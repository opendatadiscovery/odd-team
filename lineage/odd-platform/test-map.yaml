  - pattern: "**Owner-scope JOIN side-filter vs. anchor-set single-point-of-failure (getMyObjects sidecar)**: base /my path filters by JOIN ownership.owner_id = ? at the SQL layer (defence-in-depth). Lineage variants /my/with_upstream and /my/with_downstream RELY on an anchor-set fetch being correct, with NO downstream owner filter on the result set. A regression in fetchAssociatedOwner leaks non-owned lineage neighbours. NEW class of cross-cutting risk: 'anchor-set-derived endpoints with no defence-in-depth'."
    affected_node_count: 3
