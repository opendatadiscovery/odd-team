  - "ActivityServiceImpl.md says (concepts.invariants.[2]): 'activity.created_by = NULL is the system-event signal (line 49, 60). switchIfEmpty fires when authIdentityProvider.getCurrentUser() is Mono.empty() — which AuthIdentityProviderImpl produces when there is no SecurityContext, no Authentication, OR when ReactiveSecurityContextHolder.getContext() is empty in the Reactor context. Three code paths produce this: (a) ActivityIngestionRequestProcessor (no SecurityContext on S2S ingestion path); (b) AlertServiceImpl scheduled-job and reactive flows that lose the SecurityContext across thread boundaries; (c) DISABLED auth mode (per AuthIdentityProviderImpl.getCurrentUser there is no Authentication object). The mapper persists null to activity.created_by.'"
