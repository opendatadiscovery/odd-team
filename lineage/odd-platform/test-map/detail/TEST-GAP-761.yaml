behaviour: |-
  **LOW — Soft-delete reincarnation: deleting a namespace marks `deleted_at = NOW()`; the partial unique index `namespace_unique` excludes that row; a subsequent `create({name: 'X'})` succeeds and yields a NEW namespace id with NEW history. Any operator-side bookmarks / external references using the old id break silently; tag / term assignments to the soft-deleted namespace persist in the DB but are filtered out of all reads.** Primary-source confirmed in batch-W NamespaceController sidecar:

  - **Schema tier**: V0_0_31__add_deleted_at_field.sql:25 — `CREATE UNIQUE INDEX IF NOT EXISTS namespace_unique ON namespace (name) WHERE deleted_at IS NULL`. The `WHERE deleted_at IS NULL` predicate excludes soft-deleted rows from the unique constraint.
  - **Repository tier**: `ReactiveAbstractSoftDeleteCRUDRepository.delete` (lines 50-58, the inherited soft-delete): `UPDATE namespace SET deleted_at = NOW() WHERE id = ? AND deleted_at IS NULL`.
  - **Reincarnation sequence**: (1) operator creates `finance` → id=42; (2) operator deletes `finance` → row 42 gets `deleted_at = NOW()`; (3) operator (or any of the 8 side-door callers) creates `finance` again → new row, new id=43; (4) the new row's name=`finance` doesn't collide with row 42 because the partial-unique-index excludes deleted rows.

  **Operator-visible consequences**:
  - **External references break silently**: a BI tool that hardcoded `namespace_id=42` for `finance` reports against the soft-deleted row's referents. The new `finance` namespace has id=43; the BI tool sees nothing.
  - **Audit confusion**: the activity feed (if it captured the original namespace creation by user A at timestamp T) shows row 42's creation. The new row 43 has its own creation event by user B at timestamp T'. The audit story is "namespace `finance` was created twice" — operator must investigate.
  - **Orphan tag/term assignments**: tags scoped to namespace 42 still have `namespace_id=42` in `tag.namespace_id`. The new namespace 43 has no inherited tags. Operators expecting "I deleted and recreated `finance` and my tags still work" are surprised.
  - **GDPR right-to-erasure ambiguity**: the soft-deleted row still holds the original creator's audit metadata. A "delete my data" request must hard-delete the row + all referents — not a single button in the UI.

  **Why LOW not MEDIUM**:
  - The behaviour is intentional (per implicit_adrs.[3]): "The partial-index syntax `WHERE deleted_at IS NULL` is a DELIBERATE pattern repeated across data_source_name_unique / collector_name_unique / data_source_oddrn_unique (same migration lines 27, 29, 31). The pattern explicitly enables 'delete then recreate' semantics."
  - Operator-impact is RECOVERABLE — operator can examine the soft-deleted row's referents and migrate them manually.
  - The reincarnation enables a useful workflow (delete a typo'd namespace, recreate it without conflict).

  **Test gap shape**: regression-pin asserting: (a) deleting `finance` succeeds (HTTP 204); (b) the soft-deleted row's `deleted_at IS NOT NULL`; (c) creating `finance` again succeeds and returns a NEW id; (d) the new namespace has NO inherited tag/term assignments; (e) the partial unique index's WHERE clause is verifiable via `pg_indexes`. The current state is PINNED — failures land if a future maintainer hard-deletes (instead of soft-deletes) or changes the unique-index expression.
