terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Per-call: 1-N writes against the Owner directory tables.
    - CREATE: INSERT into owner + N INSERTs into owner_to_role
      (N = formData.roles.size) + 2× UPDATE on search_entrypoint
      + term_search_entrypoint search vectors.
    - UPDATE: 1× SELECT owner + 1× UPDATE owner + 1× DELETE
      owner_to_role + N× INSERT owner_to_role + 2× UPDATE on
      search vectors + 1× SELECT-join read-back.
    - DELETE: 3× SELECT EXISTS (cascade-block) + on no-cascade:
      1× DELETE owner_to_role (N rows) + 1× UPDATE owner SET
      deleted_at; on cascade-rejection: 0 writes + 1× error response.
    Side-effects fan out to USER_OWNER_MAPPING (left intact by all
    three verbs — FK by id not name) + OWNER_ASSOCIATION_REQUEST
    (left orphaned on delete — cascade-block does NOT check this
    table) + the FTS index (refreshed on create/update, NOT on
    delete).
  evidence: |-
    OwnerServiceImpl.java:38-100 (create at 38-66, update at 68-85,
    delete at 87-100) + ReactiveAbstractSoftDeleteCRUDRepository.java:50-58
    (soft-delete UPDATE) + ReactiveOwnerToRoleRepositoryImpl.java:52-56
    (DSL.delete) + V0_0_4__add_user_owner_mapping.sql:3 (FK by id) +
    V0_0_51__add_owner_association_request.sql:11 (FK no ON DELETE).
  cardinality_per_call: 1-N writes per call (N varies by roles.size + by the delete-vs-update path)
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — confirmed from primary source. Per-call multiplicity is
  1 against the directory (one Owner row created/renamed/deleted per
  request); the N-fan-out is over role bindings (deterministic by
