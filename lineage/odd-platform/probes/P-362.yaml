expected_outcome: |
  Quoting hypothesis H-010 verbatim:
  "When a user deletes a term, that term immediately disappears from the
  Dictionary-tab search results and the search-suggestions dropdown — a deleted
  term never appears in catalog browse/search."

  RATIONALE FOR PROBE-NEEDED: there are two competing static signals and only a
  run settles which dominates the USER-VISIBLE result.
   (a) ReactiveTermSearchEntrypointRepositoryImpl.md bugs_limitations_corner_cases[0]:
       term DELETE leaves the row in `term_search_entrypoint` (TermServiceImpl.delete
       never calls any vector-clear method) — the FTS vector for the deleted term
       persists indefinitely.
   (b) ReactiveTermRepositoryImpl.md invariants: every read filters
       `TERM.DELETED_AT IS NULL`, AND findByState/getQuerySuggestions JOIN term →
       term_search_entrypoint. IF the search query JOINs `term` (with the deleted_at
       filter) the stale vector is masked; IF any search/suggestion path queries
       term_search_entrypoint WITHOUT re-joining term, the deleted term leaks.
  The sidecar explicitly flags (b) as the open question: "any reader that queries
  term_search_entrypoint directly without joining term would surface deleted terms."
  Whether the live findByState / getQuerySuggestions on the Dictionary tab does the
  protective join is the thing to run — the orchestrating TermSearchService is
  un-enriched.

  PASS (H-010 -> confirmed) if, after deleting a term, it is absent from both
  GET /api/termsearch/{id}/results (matching its name) and
  GET /api/termsearch/suggestions?query={name}.
  FAIL (H-010 -> contradicted; route to bug-candidate) if the deleted term still
  appears in either the results list or the suggestions dropdown.
