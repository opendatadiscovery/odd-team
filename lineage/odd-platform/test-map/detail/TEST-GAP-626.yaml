  - "deleteOwner.md says (security.known_security_gaps.[1]): 'An attacker who can submit an OWNER_ASSOCIATION_REQUEST against any owner could plant orphan rows that survive future owner directory churn — useful for a long-game persistence technique. Severity is conservative because the attacker would need OWNER_ASSOCIATION_* permissions to submit the request in the first place; severity rises under DISABLED.'"
  - "Source: OwnerServiceImpl.java:90-91 (no check) + V0_0_51__add_owner_association_request.sql:11 (FK no ON DELETE; no deleted_at column) + ReactiveOwnerRepositoryImpl.java:147-149"
