  no /actuator/health signal'''
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[4]
proposed_action: Add Testcontainers-LDAP test pre-seeding > directory-size-limit group
  members where the admin user is past the cutoff; assert login returns authority
  `[USER]` (silent demotion). Locks the trade-off posture; drives a logging/metric
  hardening follow-up.
