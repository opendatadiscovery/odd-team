proposed_action: |-
  Add `AttachmentRemoteStorageChunkStagingEphemeralTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/integration/`. Three test methods using Testcontainers:
  1. `completeFileUpload_afterContainerRestartWithRemoteStorage_failsBecauseChunksLostFromTmpOddChunks` — configure `attachment.storage=REMOTE` + a MinIO container; (a) POST /initiate; (b) POST 3 chunks; (c) restart the platform JVM context (simulate Kubernetes eviction) WITHOUT calling /complete; (d) attempt to /complete after the restart; (e) assert the completion fails with `NoSuchFileException` or `BadUserRequestException`; (f) assert `SELECT * FROM file_upload WHERE id = ?` returns the PROCESSING row still (no housekeeping fired; the upload is permanently stuck).
  2. `uploadFileChunk_routedToDifferentInstanceWithoutSharedVolume_failsWithRemoteStorage` — variant of TEST-GAP-076 specifically for REMOTE-storage compound: two platform instances + REMOTE storage configured + non-sticky LB. POST /initiate on instance A; POST a chunk on instance B; assert NoSuchFileException; assert the user-facing 5xx has no diagnostic message.
  3. `completeFileUpload_afterContainerRestartWithLocalStorage_failsBoth — sister test for LOCAL storage to PIN the dual contract: LOCAL fails for the SAME reason; the REMOTE fix is not just an attachment-backend fix but a chunk-staging-architecture fix.

  Add a `// REGRESSION-PIN — LSN-001 family extension: chunk staging is hard-coded to /tmp/odd/chunks regardless of attachment.storage mode. The post-LSN-001 doc fix closed the LOCAL-default loop but left this latent issue invisible at the YAML level. Any REFACTOR that parameterises CHUNK_BASE_PATH or moves chunk-staging to the storage backend will break these tests; the maintainer should re-author the tests against the new contract.` comment block.

  Pair with a DOC-NNN candidate: extend the configuration-and-deployment/odd-platform.md attachment-storage section to disclose the three new constraints (chunk-staging node-locality, multi-replica sticky-routing requirement, in-flight-upload loss on restart). Without the doc, operators cannot avoid the cliff. Pair with a REFACTOR-NNN parameterising CHUNK_BASE_PATH; when that lands, tests #1 and #3 invert (the chunk staging persists across restart for REMOTE).
