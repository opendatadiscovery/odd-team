realism_caveats: |
  The 500 vs 400/404 status code drift is a small UX defect, not a security
  hole. The leaking exception class can be informative for adversaries
  (confirms version existence by status differential — 200 vs 500) but the
  same enumeration is possible via the GET-by-id endpoint with NotFoundException.
  The probe also does not verify the response body — assumes ControllerAdvice
  maps RuntimeException → 500. If a future ControllerAdvice change adds
  explicit handling for the "Query returned N rows" case, the status code
  changes and this probe must be updated.
