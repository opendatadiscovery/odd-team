expected_outcome: |
  Stress question (Category B, `isOn`; Category A, the `'yes'` magic string): the Favorites control
  is a two-state checkbox over a THREE-state URL param. `isOn` is computed as
  `paramsToSearchState(location.search).favorites === 'yes'`
  (FavoritesFilter.tsx:39-42), while the fail-closed parser accepts BOTH `yes` and `no`
  (searchUrlState.ts:57-60, 252-260) and the wire projection maps `'no'` to the real boolean
  `false` (searchUrlState.ts:300-303), which the repository turns into
  `DSL.not(exists(...))` — an anti-join over the caller's favorites
  (ReactiveAssetSearchRepositoryImpl.java:328-337).

  Hypothesis: on `/search?favorites=no&q=<token>` the sidebar checkbox renders UNCHECKED (no
  visible filter is active anywhere in the Filters rail) while the result list IS narrowed to the
  assets the caller has NOT starred. The operator sees a filtered list with no on-screen
  explanation for why their starred asset vanished, and the only way out of the state is to check
  the box (-> `favorites=yes`) and uncheck it again (-> param removed), or to press Clear All.

  This state is reachable today by a hand-written URL and by anyone editing a shared link, and it
  is the state the API-level negative direction (`{"favorites": false}`, kept deliberately per the
  GATE-1 decision recorded in contributor/CTRIB-061.md section 6.1) renders into. Neither the
  vitest file (FavoritesFilter.test.tsx — 7 cases, none for `no`) nor IT-148
  (integration-tests/e2e/specs/favorites-star-see-loop.spec.ts — no `favorites=no` case) covers it.
