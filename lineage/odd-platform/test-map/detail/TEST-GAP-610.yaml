proposed_action: |-
  Unit test on GoogleUserHandler. (a) provider.allowedDomain='odd.com' + IdToken with NO `hd` claim (personal @gmail.com account scenario). (b) Invoke enrichUserWithProviderInformation. (c) Capture the thrown OAuth2AuthenticationException. (d) Assert error.getDescription() equals literally 'Domain null doesnt match with allowed domain odd.com' (current). (e) Pin the unhelpful message. Future fix branching on `domain == null` flips the assertion to expect a friendlier message.
