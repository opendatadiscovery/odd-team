# P-249 — post-fix listMostPopular full-directory aggregation cost at scale (F-018)

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (1020, '//probe-source-P-249/db', 'probe-source-P-249')
      ON CONFLICT (id) DO NOTHING

  # 50 usage-target entities, ids 20000..20049.
  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, view_count,
         source_created_at, source_updated_at)
      SELECT 20000 + gs,
             '//probe-source-P-249/db/tables/p249_entity_' || lpad(gs::text, 3, '0'),
             'p249_entity_' || lpad(gs::text, 3, '0'),
             1020, 1, 0, NOW(), NOW()
      FROM generate_series(0, 49) AS gs
      ON CONFLICT (id) DO NOTHING

  # 10,000 tags, ids 20000..29999 (created in id order: lowest = oldest).
  - kind: sql
    query: |
      INSERT INTO tag (id, name, important, created_at, updated_at)
      SELECT 20000 + gs, 'p249_tag_' || lpad(gs::text, 5, '0'), false, NOW(), NOW()
      FROM generate_series(0, 9999) AS gs
      ON CONFLICT (id) DO NOTHING

  # Base usage distribution: every tag tagged on 20 distinct entities
  # (~200,000 relation rows).
  - kind: sql
    query: |
      INSERT INTO tag_to_data_entity (tag_id, data_entity_id, external)
      SELECT t.id, 20000 + ((t.id + g) % 50), false
      FROM tag t
      CROSS JOIN generate_series(0, 19) AS g
      WHERE t.id BETWEEN 20000 AND 29999
      ON CONFLICT (tag_id, data_entity_id) DO NOTHING

  # Heavy-usage YOUNGEST 100 tags (ids 29900..29999): tagged on ALL 50
  # entities -> usage 50 each vs 20 for the bulk. Page 1 (size=30) must be
  # ids 29900..29929 post-fix (count DESC, id ASC ties).
  - kind: sql
    query: |
      INSERT INTO tag_to_data_entity (tag_id, data_entity_id, external)
      SELECT t.id, de.id, false
      FROM tag t
      CROSS JOIN data_entity de
      WHERE t.id BETWEEN 29900 AND 29999
        AND de.id BETWEEN 20000 AND 20049
      ON CONFLICT (tag_id, data_entity_id) DO NOTHING

act:
  # Warm-up call (connection pools, planner caches).
  - kind: rest
    method: GET
    path: /api/tags?page=1&size=30
    capture_as: warmup_response

  # Measured-correctness call.
  - kind: rest
    method: GET
    path: /api/tags?page=1&size=30
    capture_as: popular_tags_response

observe:
  - kind: jsonpath
    from: popular_tags_response_body
    path: "$.items[*].id"
    capture_as: returned_tag_ids

  - kind: jsonpath
    from: popular_tags_response_body
    path: "$.items"
    capture_as: returned_items_list

  # Server-side execution time of the faithful post-fix SQL shape
  # (jOOQ chain at ReactiveTagRepositoryImpl.java:137-171 wrapped by
  # JooqQueryHelper.paginate:62-89), via EXPLAIN ANALYZE FORMAT JSON.
  - kind: sql
    query: |
      EXPLAIN (ANALYZE, FORMAT JSON)
      WITH tag_cte AS (
        SELECT * FROM tag WHERE deleted_at IS NULL
      )
      SELECT t.*, (t._row <> t._total) AS _next
      FROM (
        SELECT u.*, count(*) OVER () AS _total,
               row_number() OVER (ORDER BY u.count DESC, u.id ASC) AS _row
        FROM (
          SELECT uu.id, uu.name, uu.important, uu.created_at, uu.updated_at,
                 uu.deleted_at,
                 bool_or(uu.external) AS external, sum(uu.count) AS count
          FROM (
            SELECT tag_cte.*, coalesce(bool_or(ttde.external), false) AS external,
                   count(ttde.tag_id) AS count
            FROM tag_cte
            LEFT JOIN tag_to_data_entity ttde ON ttde.tag_id = tag_cte.id
            GROUP BY tag_cte.id, tag_cte.name, tag_cte.important,
                     tag_cte.created_at, tag_cte.updated_at, tag_cte.deleted_at
            UNION ALL
            SELECT tag_cte.*, coalesce(bool_or(ttdf.origin <> 'INTERNAL'), false) AS external,
                   count(ttdf.tag_id) AS count
            FROM tag_cte
            LEFT JOIN tag_to_dataset_field ttdf ON ttdf.tag_id = tag_cte.id
            GROUP BY tag_cte.id, tag_cte.name, tag_cte.important,
                     tag_cte.created_at, tag_cte.updated_at, tag_cte.deleted_at
          ) uu
          GROUP BY uu.id, uu.name, uu.important, uu.created_at, uu.updated_at,
                   uu.deleted_at
        ) u
        ORDER BY u.count DESC, u.id ASC
        LIMIT 30 OFFSET 0
      ) t
      ORDER BY t.count DESC, t.id ASC
    capture_as: explain_json

assert:
  # Correctness at scale: page 1 is the heavy-usage youngest slice.
  - "len(returned_items_list) == 30"
  - "29900 in returned_tag_ids"
  - "29929 in returned_tag_ids"
  - "20000 not in returned_tag_ids"
  - "29999 not in returned_tag_ids"  # count ties break id ASC: 29930..29999 fall to later pages

  # Cost budget: server-side execution of the faithful SQL under 500 ms.
  - "explain_json[0]['Execution Time'] < 500"

cleanup:
