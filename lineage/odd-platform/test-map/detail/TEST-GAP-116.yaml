gap_id: TEST-GAP-116
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java IngestionDataEntitiesFilter config-key-consumer:auth.ingestion.filter.enabled@L20
surfaced_by:
- IngestionDataEntitiesFilter@L20.md:tests_coverage_semantic.uncovered_behaviours.[0]
- IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[0]
behaviour: 'Default-off ingestion auth verification. application.yml:48 ships `auth.ingestion.filter.enabled:
  false`. IngestionDataEntitiesFilter.java:20 has no `matchIfMissing=true`. Bundled
  deployment that operator runs unmodified has `POST /ingestion/entities` reachable
  without any credential check. NO existing test asserts this default-off posture
  — the orchestrator''s hypothesis about default-on was wrong (per task input); only
  a boot-time test that asserts the configured-default is what code observes would
  have caught it earlier. Live docs (WebFetched 2026-05-10) do not surface this property.
  LSN-001/LSN-002-class shape.'
test_files_existing:
- odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/BaseIngestionTest.java
  (exercises ingestion endpoints but inherits application.yml's `false` default —
  filter never registered; does NOT assert the default-off posture)
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ingestion/IngestionFilterDefaultOffTest.java
  name: ingestionEntities_applicationYmlDefault_acceptsUnauthenticatedPost
evidence:
- 'IngestionDataEntitiesFilter@L20.md says: ''Default deployment ships with POST /ingestion/entities
  UNAUTHENTICATED. application.yml:48 sets auth.ingestion.filter.enabled: false ...
  any caller able to reach the platform''s HTTP port can POST /ingestion/entities
  with a valid DataEntityList payload and have entities ingested'' (severity HIGH;
  LSN-001 shape)'
- 'concepts.yaml:entities[Ingestion Filter].security_aggregate.weaknesses.[0] verbatim:
  ''Default-off ingestion auth (HIGH severity, LSN-001-class)'''
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[0] (part of triangulated
  insecure-default finding)
- 'Grep against `odd-platform-api/src/test` for `auth.ingestion.filter.enabled`: 0
  matches (verified 2026-05-10)'
cross_references:
- concepts.yaml:entities[Ingestion Filter].security_aggregate.weaknesses.[0]
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[0]
- retrospectives/LSN-001-attachment-ephemeral-default.md
proposed_action: Add a WebTestClient test that loads application.yml unmodified and
  posts `POST /ingestion/entities` with a valid DataEntityList payload BUT NO `Authorization`
  header; assert 2xx (current vulnerable posture). Locks the canonical LSN-001-class
  insecure-default; turns the hypothetical operator trap into a CI-visible assertion.
