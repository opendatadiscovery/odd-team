proposed_action: |-
  Concurrency integration test. (a) Construct two parallel CompletableFutures each invoking `metadataFieldService.getOrCreateMetadataFields(Map.of(new MetadataKey("foo", STRING), null))`. (b) `CompletableFuture.allOf(f1, f2).join()`. (c) Assert exactly ONE future succeeds with a created field; the other throws `UniqueConstraintException` with message "Internal metadata with this name already exists". (d) Assert exactly ONE row exists in metadata_field with name='foo' + origin='INTERNAL'. (e) Add a `// REGRESSION-PIN — The UI tier resolves the race via exception; the ingestion tier resolves it silently via ON CONFLICT. The inconsistency is by-design today. REFACTOR-NNN may align both paths; this test flips to assert silent merge on both.` comment block. (f) Compare with the ingestion-path variant — two parallel `ingestData` calls succeed silently with the same row's id.
