behaviour: |-
  **`DataSourceIngestionServiceImpl.createDataSources` USES `@ReactiveTransactional` AT THE METHOD LEVEL (line 40) — partial failure rolls back ENTIRE batch.** A collector POSTing 100 datasources where 1 violates the name-uniqueness constraint (`data_source_name_unique` partial index per batch R sidecar) sees ALL 100 fail with HTTP 5xx. The existing 6-case parameterized test (`createDataSourcesTest` lines 72-93) mocks all DB calls to SUCCEED; no failure-injection test exercises rollback. A regression that drops `@ReactiveTransactional` would silently change the operational shape: partial successes would persist; the batch would no longer be all-or-nothing. The contract is the SERVICE-TIER ENACTMENT of F-008's `single_transaction_per_batch_no_per_entity_isolation` drift facet (operationally: "the batch is the unit of consistency"). The maintainer's deliberate choice — annotation applied to the HIGHEST-LEVEL method rather than the individual repository calls — is the structural signal. The test pins the choice so a future per-entity-isolation refactor (if pursued) breaks the test deliberately.
