mitigations_unimplemented:
  - |-
    Architectural change: widen PostgresWALMessageProcessor's return type
    from void to a typed ProcessResult (ALL_DELIVERED /
    PARTIAL_DELIVERED_RETRYABLE / POISON_SKIP / TRANSIENT_RETRYABLE) —
    enables in-seam expressivity for poison-skip without a side-channel
    table. Closes Layer 3 root cause.
  - |-
    Add a poison-skip table approach: dispatcher writes the bad-LSN to
    alert_notification_poison; subscriber consults the table on next
    iteration before re-processing. Closes Layer 1 + 2 with no seam
    change (Layer 3 remains, but its consequences are bypassed).
  - |-
    Emit a Prometheus counter notification_poison_total{alert_id, error_class}
    on each WAL replay-loop cycle so operators detect when the loop is
    active. Closes the observability half of Insight 3.
  - |-
    Make the 10s retry cadence operator-tunable via
    notifications.wal.retry-delay (with a sensible default). Closes the
    hardcoded-cadence half of Insight 1.
  - |-
    Add a docs section on /features/active-platform-features/notifications
    explicitly naming this failure mode and the operator-side
    remediation: clean up the bad row OR drop the replication slot (and
    accept lost in-flight alerts). Pending the code fix this is the only
    operator-visible signal.
  - |-
    Cross-cutting case-law: extend the poison-message-replay observation
    to ANY future WAL-driven sub-feature that consumes via
    PostgresWALMessageProcessor — without a poison-skip strategy at the
    seam level, every future consumer inherits the same fragility.
notes: |-
  STRENGTHENS the batch-K poison-message-wal-replay-loop invariant with
  primary-source code-side confirmation at TWO new layers (Layer 2 — the
  subscriber's inner+outer loop architecture; Layer 3 — the seam shape).
  The strengthening converts the batch-K 1-layer symptom finding into a
  4-layer architectural picture.

  The 4-layer picture explains why partial remediations are insufficient:
    - Fixing only Layer 1 (catch the translator exception at the
      dispatcher) closes the symptom but the seam still cannot express
      poison-skip; the dispatcher must write to a side-channel
    - Fixing only Layer 2 (catch the exception in the subscriber's
      inner loop and advance LSN anyway) loses the bad alert without
      audit, and the seam still cannot express the loss
    - Fixing only Layer 3 (widen the seam) requires re-shaping all
      callers (currently only one — NotificationSubscriber) and all
      implementors (currently only one — AlertNotificationMessageProcessor),
      but enables expressive poison-skip with audit
    - Fixing all three layers + adding Prometheus telemetry = end-to-end
      remediation

  Cross-cutting connections:
    - Pairs with the cross-channel-runtimeexception-abort-void-return-root-cause
      invariant (batch Y Layer 3 sibling — both findings cite the seam
      shape as the architectural root cause)
    - Pairs with the wal-retention-disk-exhaustion-under-poison-replay-no-bound
      invariant (batch Y Layer 4 consequence — describes the same root
      cause's storage-side consequence)
    - Pairs with the lazy-create-no-drop-replication-artefacts (batch C
      + batch Y strengthen) — the operator-owns-cleanup posture makes
      the consequence (Layer 4 disk exhaustion) operationally severe

  Three DOC-NNN candidates flow from this strengthening:
    (a) Document the 4-layer architectural picture on the live
        notifications page; explain to operators why poison-replay
        cannot be silently absorbed
    (b) Document the operator-side remediation paths (clean up bad row;
        drop slot + lose in-flight) with explicit trade-offs
    (c) Document the future-evolution ADR for widening the seam shape;
        cross-link to the cross-channel-runtimeexception-abort invariant
