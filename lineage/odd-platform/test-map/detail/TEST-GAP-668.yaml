pillars_affected: [P-07, P-09]
surfaced_by:
  - "ReactiveActivityRepositoryImpl.md:security.known_security_gaps.[1] (Anonymous-mutation attribution gap under DISABLED auth.type)"
  - "ReactiveActivityRepositoryImpl.md:bugs_limitations_corner_cases.[2] (created_by varchar(512) NULLABLE — anonymous mutations + ingestion-path system events write null)"
behaviour: |-
  **Under `auth.type=DISABLED`, anonymous traffic CAN mutate the catalog (description edits, tag assignments, ownership changes) and the resulting activity rows write `created_by = null`.** `ActivityServiceImpl.createActivityEvent` (line 47-49) emits `null` when `authIdentityProvider.getCurrentUser()` returns empty (the `switchIfEmpty(Mono.defer(() -> Mono.just(activityMapper.mapToPojo(event, activityCreateTime, null))))` line — explicit null fallback). These rows are VISUALLY INDISTINGUISHABLE from system events at the UI layer — the only discriminator is `is_system_event` which CAN be `false` (anonymous-mutation case) OR `true` (genuine ingestion / scheduler) for null-created_by rows. A reviewer cannot determine whether a null-created_by `is_system_event=false` row is an unattributed user action or a missed-username on a real user. The docs frame DISABLED as 'dev-only' but the runtime cost is real and the audit trail loses forensic value precisely when an operator most needs to investigate. No test pins this attribution gap.
