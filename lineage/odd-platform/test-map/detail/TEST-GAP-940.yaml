proposed_action: |-
  Author PolicyControllerReadPostureTest to pin the read-collaborative
  posture across the three read endpoints. Each test authenticates a user
  with zero RBAC permissions (no POLICY_*, no ROLE_*) and asserts 200 OK with
  the full response body. Pin EVERY policy can be read by any authenticated
  user including the schema. A future deliberate addition of POLICY_READ
  permission will flip these tests — the test rewrite is the visible signal
  that the contract changed. Add a complementary anonymous-under-DISABLED
  case (200 with full data — symmetric to TEST-GAP-230).
