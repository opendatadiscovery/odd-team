# Integration Wizard argument-form UX — product-owner reflection

## product_owner_narrative

The Integration Wizard's argument form is the **authoring surface** of the Integrations
tab under Management (pillar P-08): the screen where an operator who has decided to stand
up a new pull collector types the connection values for their source — host, port,
credentials, a database name — and gets back a ready-to-paste `collector_config.yaml`
snippet (per the live Management doc: "pick an integration template, fill in its
parameters, and copy the generated collector_config.yaml snippet", WebFetch
docs.opendatadiscovery.org/features/management). It sits on top of F-033 (the
classpath manifest registry that supplies the Handlebars templates); F-162 is the part
the human actually touches and the moment they form their first impression of how much
ODD respects their time.

A user interacts with it as follows (per IntegrationContent.tsx:12-26 + IntegrationCodeSnippetWithForm.tsx:13-135, source-read for validation). When they open an integration's tab, the parent sorts the integration's code snippets by declared-argument-count descending — so the most-configurable snippet renders first — and dispatches each snippet that has arguments to the form component; arg-less snippets render as plain Markdown. For a snippet with arguments, the operator sees a form (`showForm` defaults to true): one field per declared argument, with the field's visible label coming from `arg.name`. They fill in the values, the `Configure` button (disabled until the form is valid, line 117) becomes enabled, and on submit the panel flips to a second view (`showForm` false) showing a `Reconfigure` button and the compiled template rendered as Markdown (typically a YAML code-fence) — the thing they copy.

The working parts the operator experiences (all per IntegrationCodeSnippetWithForm.tsx,
source-read for validation): three field types dispatched by `arg.type` — a checkbox for
`BOOLEAN` (line 38-66), a free-text/number input for everything else (line 80-109, where
`type='string'` for STRING and `type='number'` for every other non-boolean type), and an
**invisible** field for any argument carrying a `staticValue` (line 69-77, rendered as
`<input style={{display:'none'}}>`). Every visible non-boolean field is `required` and
trim-validated — but only along the string branch (line 86-90). The Handlebars template is
compiled and invoked with the collected values on every render; substitution is keyed by
`arg.parameter`, not by the `arg.name` the operator sees on the label. The rendered Markdown
gets its copy affordance from the shared `Markdown` component, which maps a per-code-fence
`CopyButton` (Markdown.tsx:41-45, 118-121) — there is no top-level "Copy snippet" button
specific to this wizard.

The integration story: this feature is the front door into pillar P-10 (Integrations &
Ingestion) — the cross-pillar relationship "P-08 feeds P-10: Integration Wizard generates
collector_config.yaml snippets" (system-mission.md). The static-value mechanism is the
hand-off point: the live Integration Wizard doc states "exactly one parameter is wired up
this way: platform_url, read from odd.platform-base-url", and warns operators to set
`odd.platform-base-url` before opening the wizard "so the snippets carry a working URL out
of the box" (WebFetch docs.opendatadiscovery.org/integrations/integrations/integration-wizard).
The operator's natural next actions after copying are F-031 (register the resulting
datasource) and F-020 (issue the collector token the snippet references).

Edge cases a product owner would flag in a demo: what happens when the operator clears a
field and types `0` into a "number" argument; what happens when they click `Reconfigure`
to tweak one value; what they see (nothing) when a `staticValue` is baked in under a
misconfigured `odd.platform-base-url`; and whether a maliciously-authored manifest template
can inject anything into the rendered Markdown. The live doc is explicit that the wizard
"does not validate ... credentials, hosts, and ports are typed at face value" — so the
form's own validation is the only client-side gate, and as the hypotheses below show, that
gate is string-only.

