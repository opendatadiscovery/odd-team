proposed_action: |-
  Add `TagServiceImplUpdateSearchVectorRefreshTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/` using Mockito + `@SpringBootTest` (or pure Mockito unit test if the search-entrypoint repositories are mockable). Three test methods:

  1. **`update_invokesAllThreeSearchVectorRefreshCallsConcurrently_pinsTripleZipContract`** (HEADLINE):
     - Arrange: stub `reactiveTagRepository.getDto`, `reactiveTagRepository.update`. Stub all three search-entrypoint refreshes to return `Mono.empty()`. Spy on the three search-entrypoint repositories.
     - Act: `tagService.update(tagId, TagFormData with name='new-name').block()`.
     - Assert: `verify(reactiveSearchEntrypointRepository, times(1)).updateChangedTagVectors(tagId)`; `verify(reactiveSearchEntrypointRepository, times(1)).updateChangedTagStructureVector(tagId)`; `verify(reactiveTermSearchEntrypointRepository, times(1)).updateChangedTagVectors(tagId)`. PIN: all three fire.

  2. **`update_searchVectorRefreshFailure_rollsBackTransaction_pinsSyncAwaitedZip`**:
     - Arrange: stub the third call (`reactiveTermSearchEntrypointRepository.updateChangedTagVectors`) to return `Mono.error(new RuntimeException())`.
     - Act: `tagService.update(tagId, ...)`.
     - Assert: the call fails with the propagated exception. Query the DB: the `tag` row's `name` is UNCHANGED (rollback succeeded). PIN: the triple-zip is synchronously awaited; failure rolls back.

  3. **`update_searchVectorCallsAreParallelNotSequential_pinsConcurrency`**:
     - Arrange: instrument each search-entrypoint call with `Mono.delay(Duration.ofMillis(100))` (3 delays of 100ms each).
     - Act: measure the total elapsed time for `tagService.update(tagId, ...)`.
     - Assert: elapsed time is LESS than 300ms (closer to 100ms) — proves parallel zip, not sequential flatMap. PIN: the zip's concurrency intent is preserved.

  Cross-pair with TEST-GAP-866 (the asymmetric `delete` refresh): after both tests land, a maintainer can clearly see "update refreshes 3, delete refreshes 1" — surface this on the doc + extract a shared helper. Cross-pair with REFACTOR-NNN.
