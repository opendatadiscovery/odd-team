- id: H-002
  hypothesis: |
    When an operator deletes a Policy via the Management -> Policies tab and the
    platform reports success (the policy disappears from the list), that policy no
    longer grants any permission to any user.
  derivation: |
    Endpoint shape — DELETE /api/policies/{id} + the UI Delete affordance promise
    removal; the operator's mental model of "delete = revoke" is universal. A
    security operator deleting a policy during incident response expects the grant
    to stop.
  seed_source: endpoint-shape + ui-label + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Two things are true at once, and their interaction is the contradiction. The
      NORMAL UI delete path is DEFENDED: PolicyServiceImpl.delete (lines 89-92)
      raises CascadeDeleteException (HTTP 400) if the policy is still bound to any
      role — so an operator deleting a bound policy through the UI gets an error and
      cannot complete the delete (the happy-path defence works; confirmed by the
      PLT-110 re-scope + PolicyServiceImplTest's poison-stub which proves the guard
      short-circuits before the cascade-check/delete). BUT the underlying
      authorization JOIN getRolesPolicies (ReactivePolicyRepositoryImpl.java:32-35)
      carries NO `policy.deleted_at IS NULL` predicate, AND the role-policy attach
      path does not validate that the attached policy is live. So a soft-deleted
      policy re-attached via the raw API (the path the UI does not take) CONTINUES
      to grant its permissions on every authorized request via the unfiltered JOIN.
      The list shows revoked; the enforcer keeps granting. The hypothesis is
      therefore false on the narrow out-of-band/raw-API path: the deletion does NOT
      universally guarantee revocation (PLT-110 + DOC-314).
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactivePolicyRepositoryImpl.md
        section: bugs_limitations_corner_cases[0] + security.known_security_gaps[0]
        cite: "ReactivePolicyRepositoryImpl.java:32-35"
        note: "getRolesPolicies JOIN has no deleted_at filter — soft-deleted bound policy still resolves."
      - sidecar: odd-platform__java__service__service__PolicyServiceImpl.md
        section: invariants[2]
        cite: "PolicyServiceImpl.java:89-92"
        note: "CascadeDeleteException is the sole live defence; UI delete is cascade-blocked while bound."
      - sidecar: '(issues/odd-platform/PLT-110.md — re-scoped 2026-05-30)'
        section: "What (two grant-path omissions)"
        cite: "ReactivePolicyRepositoryImpl.getRolesPolicies + createRelations liveness"
        note: "Re-scope confirms: UI delete blocked; residual is the raw-API ghost-grant. Matches this verdict."
    operator_visible_failure: |
      (a) Incident-response failure (narrow path): an operator who has scripted a
          cleanup that re-attaches or revives a policy id, or who does a DB-direct
          `UPDATE policy SET deleted_at = NOW()` on a bound policy, reaches the
          orphan-grant state with no signal — every user in that role retains the
          permission (SHB-111 operator-incident narrative, F-006 chain shoebox-F).
      (b) The defence's fragility is the operator hazard: any DB-direct cleanup doing
          `UPDATE policy SET deleted_at = NOW()` silently creates the orphan-grant
          state — the platform offers no warning that the safe path is the UI/API
          cascade check.
      (c) A scripted cleanup catching HTTP 400 USR004 must detach roles FIRST then
          delete the policy; the dependency ordering is undocumented (F-006 chain
          shoebox-F facet policy_delete_cascade_detach_order_dependency_undocumented).
    severity: MEDIUM
    confidence: HIGH
    probe_id: P-198
    routes_to_finding: bug-candidate
    use_case_kind: teardown        # "teardown of a policy fully revokes its grant"
    coverage: unverified
    test_demand: functional        # the headline regression-pin: soft-deleted+bound policy must not grant (P-198 / security cell)
    verdict_note: |
      Marked `contradicted` (not `partial`) because the user-facing PROMISE "delete =
      no longer grants" is FALSE on the out-of-band/raw-API path. Severity revised
      HIGH->MEDIUM this refresh to match the PLT-110 re-scope (the UI delete is
      cascade-blocked; the residual is the narrow raw-API ghost-grant) — the prior
      reflection's HIGH was the pre-re-scope framing. P-198 MEASURES the grant
      persistence end-to-end (a confirming probe on a contradicted verdict).

- id: H-003
  hypothesis: |
    When an operator looks at the Management -> Roles tab, the Policies listed in a
    role's chip list are the policies that are actually live and granting — a
    deleted policy does not appear attached to a role.
  derivation: |
    Response-shape — RoleItem renders `policies.map(p => p.name)` as chips; the
    operator reads each chip as "this role currently grants this (live) policy".
    A role catalogue that shows deleted policies as if attached misrepresents the
    role's actual grant.
  seed_source: response-shape + ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The role-dto JOIN against POLICY in getDto/listDto/getByName
      (ReactiveRoleRepositoryImpl.java:45-48, 67-70, 87-90) has NO
      `policy.deleted_at IS NULL` predicate (the mirror of the Policy-half drift).
      A Role whose Policy has been soft-deleted but whose role_to_policy edge
      survives WILL render the deleted Policy's name in the per-row chip list, with
      no visual differentiation (RolesList.md invariants + RoleItem.tsx:42-48). The
      role catalogue shows a ghost policy as if attached and granting.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__RolesList.md
        section: invariants ("Soft-deleted Policies STILL APPEAR")
        cite: "RoleItem.tsx:42-48 + ReactiveRoleRepositoryImpl.java:45-48,67-70,87-90"
        note: "Per-row chips render LEFT-JOINed policies with no deleted_at filter."
      - sidecar: '(F-006 feature-flow detail — batch N notes)'
        section: drift_class role_repo_left_join_no_policy_deleted_at_filter_mirror
        cite: "ReactiveRoleRepositoryImpl.java:45-48"
        note: "Role-repo LEFT JOIN no policy.deleted_at filter — primary source."
    operator_visible_failure: |
      (a) Operational-intelligence leak: an operator (or an attacker with read
          access to the role catalogue) can enumerate HISTORICAL policy names that
          were once attached and then deleted — names like "PII Custodian" or
          "Finance Admin" reveal organisational structure that the deletion was
          meant to retire.
      (b) Misrepresentation of effective grants: an operator auditing "what does the
          Editor role grant?" reads a chip for a deleted policy and either
          double-counts a grant that is gone (if the binding was cleaned) or
          under-reacts to a grant that survives (if the binding persists — which it
          does, chaining into H-002). Either way the chip list is not a truthful
          statement of the role's live grant.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
