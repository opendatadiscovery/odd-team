      pinned_by_probe_run: R-20260519T020610Z-P-009
      cell_evidence: lineage/odd-platform/probe-runs/2026-05-19-P-009.yaml
      note: "PINNING-BUG + PARTIAL-MITIGATION-DOCUMENTED. The probe asserts the measured\n\
        state across 4 DOM facets:\n  - script tag IN DOM → PINS the bug (rehype-raw\
        \ passes <script>)\n  - p009-xss-img ID IN DOM → PINS the bug\n  - p009-xss-iframe\
        \ ID IN DOM → PINS the bug\n  - onerror= attribute NOT IN DOM → PINS the partial\
        \ mitigation\nWhen rehype-sanitize lands, the first three flip to == False;\
        \ the fourth stays.\n"
    uncovered:
    - XSS execution via script-tag content (Playwright on('dialog') + on('request')
      for /attacker.example/leak — slice-6 candidate)
    - Term-mention side-channel via [[ns:term]] auto-link (TEST-GAP-295)
    - 'SQL-injection vector in getHighlightedResult (batch-H known_security_gaps[0])
      — raw `.formatted()` SQL with user-controllable internal_description as one
      of two interpolated parameters. Separate downstream feature (FTS highlight)
      but the description IS the upstream source.'
control_summary: '2 of 4 cells PROBED — integration + security both PROBED-PINNING-BUG.
  Slice-5 adds UI-render-side empirical measurement: P-009 refined REFACTOR-218 from
  inferred-full-XSS to measured-partial-XSS (tags pass, attributes stripped). Batch-H
  adds primary-source SQL confirmation (ReactiveDataEntityRepositoryImpl.java:430-438)
  and surfaces a downstream SQL-injection surface in getHighlightedResult (lines 799-806)
  that consumes the same internal_description column. Batch-I adds service-tier confirmation
  at DataEntityServiceImpl.upsertDescription (lines 323-333) — silent-UPDATE-on-missing-entity
  (NO pre-existence check, contrast createMetadata at lines 257-258) + response-from-request-payload
  (NOT post-write DB read, lines 329-332). Two new STATIC facets surface the silent-200-on-missing
  contract and the response-decoupled-from-storage edge case.'
