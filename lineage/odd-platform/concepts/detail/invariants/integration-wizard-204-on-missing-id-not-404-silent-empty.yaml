name: |-
  Integration getIntegration({unknown-id}) returns 204 No Content, NOT 404 (batch ZF: DataCollab redirect surfaces the SECOND instance — Mono.empty silent-200-or-204 class)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-10
description: |-
  **NEW INVARIANT, batch 2026-05-25-ZD** — `GET /api/integrations/{id}`
  on an unknown id returns `204 No Content` rather than `404 Not Found`.
  The OpenAPI spec (openapi.yaml:75-81) declares only `200` as a
  response — no `404` is contracted. Operators cannot distinguish
  "wizard exists but has empty body" (currently impossible — the
  empty-state is non-existent) from "wizard does not exist".

  ## Mechanism

  Trace:

    IntegrationController.getIntegration(id, exchange)
        (IntegrationController.java:19-22)
      → integrationService.get(id)
        (IntegrationServiceImpl.java:20-23)
      → integrationRegistry.get(id)
        (ResourceFilesIntegrationRegistry.java:15-17)
        — returns Mono.justOrEmpty(registry.get(id))

  When the id is not in the registry's TreeMap,
  `registry.get(id)` returns null; `Mono.justOrEmpty(null)`
  returns `Mono.empty`; the upstream `.map(integration ->
  integrationMapper.map(integration, ...))` is short-circuited
  (the `.map` does not execute on an empty Mono); the controller's
  `.map(ResponseEntity::ok)` is similarly short-circuited; the
  return value is `Mono.empty`.

  Spring WebFlux's reactive controller-return semantics translate
  `Mono.empty` to `204 No Content` rather than 404. The path
  lacks any `switchIfEmpty(Mono.error(new NotFoundException(...)))`
  that would convert the empty state to a typed exception.

  ## Compare to sibling endpoints

  Most other GET-by-id endpoints in this codebase use a
  switchIfEmpty error chain to surface 404:

    - `MetadataFieldServiceImpl.get` (`:30-34`) throws
      `NotFoundException("Metadata field with id %d hasn't been
      found", id)` via `switchIfEmpty`
    - `DataEntityServiceImpl.getDimensions` similarly throws
      `NotFoundException` on missing entity
    - `TermServiceImpl.getTermDetailsDto` similarly throws

  The Integration get path is the OUTLIER — it omits the
  switchIfEmpty error path. Whether this is INTENTIONAL (the
  wizard registry is reasonably-stable + the empty-state is
  rare + a 204 is "good enough" because the UI handles it) or
  AN OVERSIGHT (the maintainer who wrote the registry forgot
  the switchIfEmpty pattern that sibling services use) is
  unknowable from source-comment evidence.

  ## STRENGTHENED batch 2026-05-25-ZF — DataCollaborationController.redirect surfaces SECOND instance (200 OK on Mono.empty, NOT 204 OR 404)

  Batch ZF surfaces a SECOND instance of the same class-of-bug at
  the DataCollaborationController.redirect endpoint
  (`GET /api/messages/{message_id}/url`):

    Trace:
      DataCollaborationController.redirect(messageId, exchange)
        (DataCollaborationController.java:41-49)
        → dataCollaborationService.resolveMessageUrl(messageId)
        (DataCollaborationServiceImpl.java:72-77)
        → reactiveMessageRepository.getMessageProviderIdentity(messageId)
        (ReactiveMessageRepositoryImpl.java:171-185)
        → if not found / not UUIDv1: returns Mono.empty

    When `messageId` does not exist OR is not a valid UUIDv1
    (causes `extractDateTimeFromUUID(messageId)` to produce a
    wrong timestamp, the WHERE clause fails, the inner Mono
    is empty), the controller's
    `dataCollaborationService.resolveMessageUrl(messageId).map(...)`
    short-circuits to `Mono.empty`. Spring WebFlux translates
    `Mono.empty` from a controller to `200 OK` with NO body —
    NOT 404 NOR 204. There is no `switchIfEmpty(Mono.error(new
    NotFoundException(...)))` anywhere in the chain.

  **The DataCollab variant differs from the Integration variant**
  in one operator-relevant way: Integration emits 204 No Content
  (per Spring WebFlux's default Mono.empty handling for empty
  body); DataCollab.redirect emits 200 OK (per the same default,
  but the operator's expectation differs because the endpoint's
  natural shape is a redirect — a 302 with Location: header).
  A caller who probes the endpoint for a non-existent
  messageId sees a 200 OK with no body AND no Location: header —
  a UNIQUE response shape that no documented contract describes.
  Combined with the missing RBAC permission on the endpoint per
  `rbac-read-endpoints-no-securityrule-authenticated-only-fall-through`,
  ANY authenticated user can effectively use the endpoint as a
  message-existence-by-id ORACLE: probe IDs, distinguish 200/empty
  (does not exist) from 302/slack-url (exists). The class-of-bug
  is the same (Mono.empty silently returned, no switchIfEmpty,
  no NotFoundException); the operator-visible consequence is more
  serious for DataCollab because of the redirect-shape mismatch.

  ## Compare to sibling endpoints (extended)

  Most other GET-by-id endpoints in this codebase use a
  switchIfEmpty error chain to surface 404; TWO OUTLIERS now
  confirmed:

    - **Integration.get** — returns 204 No Content
    - **DataCollab.redirect** — returns 200 OK with no body
      (no Location: header either; a unique shape)
    - All other sibling getById endpoints surface 404 via
      switchIfEmpty + NotFoundException

  ## Severity

  MEDIUM. Functional impact:
    - The UI's `useIntegration({integrationId})` React Query hook
      receives 204 with no body; the destructured `data` field is
      `undefined`; the detail page renders an empty layout (or
      crashes if the page assumes data is defined). The exact UI
      behaviour is not pinned by a test.
    - Direct REST API consumers reading the OpenAPI spec (which
      declares only 200) get a 204 response their generated
      client code does NOT explicitly handle — silent contract
      mismatch.
    - SDK generators auto-generating response handlers for the
      sole 200 response treat 204 as an error in some libraries.
    - **DataCollab.redirect variant**: the UI's `<Button to={url}
      target='_blank'>` in `Message.tsx:60-66` opens the URL in
      a new tab; if the redirect returns 200 OK with no body, the
      browser shows a blank page rather than a 404. The
      operator-visible UX is "I clicked Open-in-Slack and got a
      blank tab" — diagnosable only by capturing the response
      headers.

  ## Fix surface

  Two coherent paths for EACH outlier:

    (A) Add `switchIfEmpty(Mono.error(new NotFoundException(
        "Integration with id '%s' hasn't been found".formatted(id))))`
        to `IntegrationServiceImpl.get` between the
        `integrationRegistry.get(id)` and the `.map(...)`. Aligns
        with sibling service-tier patterns. Surfaces as HTTP 404
        with code `USR002` via ControllerAdvice. One-line change.

        For DataCollab: same shape applied to
        `DataCollaborationServiceImpl.resolveMessageUrl` or to the
        `ReactiveMessageRepositoryImpl.getMessageProviderIdentity`
        callsite — surfaces 404 instead of 200/empty.

    (B) Update the OpenAPI spec (openapi.yaml:75-81 for Integration;
        openapi.yaml:1776-1791 for DataCollab redirect) to declare
        both `200` and `204` (or both `200` and `404`) as valid
        responses. Aligns the contract to the implementation
        reality. Requires SDK regeneration for downstream
        consumers.

  Path (A) is more consistent with the codebase. Path (B) is
  faster to apply but locks in the 200/204 contract for SDK
  consumers.

  ## Live doc drift

  The live API-reference page for Integration
  (`/developer-guides/api-reference/integrations` WebFetched
  2026-05-25, status 200) does NOT document either the
  204-on-missing behaviour or the 404-not-emitted behaviour —
  the page omits response schemas, HTTP status codes, and
  authentication requirements entirely.

  The live api-reference page for DataCollab
  (`/developer-guides/api-reference/data-collaboration` WebFetched
  2026-05-25, status 200) acknowledges the 302-vs-301 drift on
  redirect but is SILENT on the 200-on-missing-message-id
  behaviour. The endpoint's documented contract is "302 to
  provider's deep-link"; nothing says what happens when the
  message ID is not in the message table.
