  \ status updates. Two doc-gaps surface:\n  (a) The API endpoint surface (`PUT /api/dataentities/{id}/statuses`)\n\
  \      and the `propagate` request-body flag's semantics\n      (group-only, silently\
  \ ignored on non-groups) are not\n      documented on `/features/data-discovery/statuses`.\n\
  \  (b) Auto-flip job 10-minute cadence + 9-minute ShedLock window\n      is not\
  \ documented — operators wondering when a DRAFT/DEPRECATED\n      entity will tip\
  \ into DELETED cannot derive precision.\n\nCross-batch defect: the HIGH-severity\
