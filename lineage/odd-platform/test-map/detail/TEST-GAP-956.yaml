proposed_action: |-
  Author TitleServiceImplConcurrencyTest with three cases:
  (a) two parallel OwnershipServiceImpl.create calls with the same
  brand-new title_name → one succeeds, the other gets USR003;
  (b) subsequent third call → finds the now-existing row via
  getByName, succeeds without re-attempting insert;
  (c) ownership rollback assertion: the losing side's ownership row
  is NOT persisted (txn boundary rolled it back).
  Use CountDownLatch or StepVerifier.zip with explicit thread pools to
  reproduce the race deterministically.
