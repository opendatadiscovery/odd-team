# Ingestion Batch Atomicity & Error Contract — product-owner reflection

## product_owner_narrative

`POST /ingestion/entities` is the single load-bearing write endpoint of the whole
ODD platform: every pull Collector, every push adapter (Airflow, dbt, Spark, Great
Expectations), and every direct `odd-cli` invocation funnels its per-tick scan results
through this one endpoint as a `DataEntityList` payload — one `data_source_oddrn` plus
a list of `DataEntity` items (per `IngestionService.md` understanding + `postDataEntityList`
understanding). The "user" of this feature is NOT a screen-facing human; it is a
**custom-collector author** (audience `integration-author / custom-collector-developer`)
and the **collector runtime** itself — an API consumer writing code against the published
ingestion contract. The feature this reflection judges is therefore not a UI; it is the
*contract* the endpoint presents to that author: what does a success look like, what does
a failure look like, and what is the author supposed to DO when they get one.

A collector author interacts with the feature in exactly one shape: assemble a batch,
POST it, read the HTTP status, branch on it. On success the platform returns an empty
body — `Mono<ResponseEntity<Void>>`, no per-item acknowledgement (per `postDataEntityList`
understanding + IngestionController.java:38-45). On failure the platform returns a generic
Spring reactive 5xx envelope — `{"status":500,"error":"Internal Server Error","path":"/ingestion/entities"}`
— with no machine-readable discriminator naming WHICH item or WHICH condition failed
(per the feature-flow `terminal_side_effect`). The contract is binary: 200 OK with no
body, or 5xx with a body that carries nothing actionable.

The working part a product owner would demo — and the one that defines the feature — is
the **atomicity guarantee**: `ingest(...)` is `@ReactiveTransactional` (IngestionServiceImpl.java:66),
so the datasource lookup, the bulk upsert, all 14 downstream processors (lineage, metadata,
dataset-structure, FTS, alerts, activity), and the OTLP metric export run inside ONE
Postgres transaction. One failure anywhere rolls back EVERY entity in the batch and every
downstream side effect (per `IngestionService.md` downstream_side_effects closing paragraph:
"One bad entity in a batch: NO per-entity isolation … The HTTP response is binary"). For
an author this is a strong, clean promise — *all of my batch lands, or none of it does* —
but it is a promise that is **nowhere documented** and is **paired with an error contract
that hides the reason for the rollback**. The author gets all-or-nothing atomicity AND a
5xx that won't tell them which entity poisoned the batch.

This feature composes with two siblings. F-008 (same `IngestionServiceImpl`) owns the
*destruction* angle — the replace-not-merge semantics where a collector that forgets to
re-emit a lineage edge or a metadata field silently deletes it; this reflection's
atomicity-and-error-contract angle is the operator-facing surface of the same single
transaction. F-094 (ingestion auth coverage) owns the *who-can-call-it* angle — and it is
load-bearing context here, because the endpoint ships UNAUTHENTICATED by default
(`auth.ingestion.filter.enabled=false`, application.yml:48, per the controller sidecar
bugs_limitations_corner_cases[0]), so the error-contract failure modes below are reachable
by any caller able to hit the HTTP port, not only by a registered collector.

The edge cases a product owner would surface in a demo are exactly the ones the contract
gets wrong: a collector whose source-iteration glitches and emits the same ODDRN twice in
one batch (a 5xx, not a 400); a collector pointed at a datasource ODDRN that was never
registered or was renamed (a 5xx, not a 404); a collector whose tick produced a payload
larger than the 20 MB codec cap (a 5xx, not a 413); two collectors emitting to the same
datasource at once (the loser blocks on a `SELECT … FOR UPDATE` row lock held for the
FULL pipeline duration, then may time out into a 5xx with no `Retry-After`); and an SRE
trying to diagnose any of the above from logs, finding the service body emits ZERO `log.*`
lines despite carrying `@Slf4j` (IngestionServiceImpl.java:53). Every one of these is a
real user expectation the assembled chain violates.

