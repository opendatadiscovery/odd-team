  parse-and-link-glossary-terms, emit-DESCRIPTION_UPDATED-activity-event, refresh-fts-search-vector]
- upsertDataEntityInternalDescription.md:bugs_limitations_corner_cases.[1] (silent
  200 OK on missing entity)
axes_present:
