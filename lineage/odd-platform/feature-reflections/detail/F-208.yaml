- id: H-012
  hypothesis: |-
    The freshness signal reflects genuine source activity — a stalled
    source cannot be made to look fresh without actually publishing.
  derivation: |-
    Negative-space / security (facet 3 / SHB-001:26). Trust signal
    integrity — the implicit requirement that the most prominent
    data-trust indicator cannot be trivially falsified.
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      The predicate has no notion of source authenticity (SHB-001:26):
      freshness is set entirely by lastIngestedAt, which any actor with
      ingestion-write capability can update by emitting an ingestion event
      with a current timestamp. For a legitimate, single-tenant deployment
      the signal is trustworthy (only the real collector writes); for a
      multi-tenant or shared-ingestion deployment, any ingestion-write
      principal can forge freshness on any entity — there is no check that
      the event originates from the entity's registered collector. The
      signal is trustworthy in the intended posture and forgeable outside
      it; the boundary is undocumented.
    evidence:
      - sidecar: "(unresolved) service:DataEntityStaleDetector"
        section: provenance
        cite: "DataEntityStaleDetector.java:13-17"
        note: "predicate reads lastIngestedAt only; no provenance/authenticity check"
        source_read_for_validation: true
      - sidecar: "(unresolved) SHB-001"
        section: caveat-3
        cite: "SHB-001:26"
        note: "ingestion-write can forge freshness; may be deliberate, undocumented"
    operator_visible_failure: |-
      An attacker or a misconfigured collector emitting bogus current
      timestamps masks a genuinely-stalled source as healthy — the
      platform's most prominent data-trust signal is silently falsified.
      The blast radius depends on the deployment's ingestion-auth posture
      (single-tenant: low; shared/multi-tenant ingestion: high). The
      integrity boundary ("any actor with ingestion-write on a data source
      can mark any entity fresh") is real but documented nowhere.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

