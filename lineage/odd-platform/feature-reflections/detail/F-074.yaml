- id: H-004
  hypothesis: |-
    When any authenticated user (or anonymous caller under DISABLED) issues
    GET /api/collectors, the response body exposes the last six plaintext
    characters of every collector's token (the masked "******"+last6 form).
  derivation: |-
    The list path constructs TokenDto via the 1-arg masked constructor
    (showToken=false); TokenMapper.mapValue renders "******" + last 6 chars.
    The terminal_side_effect of F-074 names this exposure (F-074.yaml:69-77).
  seed_source: response-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      TokenMapper.mapValue(hidden) returns "******" + the last 6 characters of the
      token (verified by TokenMapperImplTest: input "secret1234567890" maps to
      "******567890"). The DataSource list path uses the 1-arg TokenDto constructor
      → showToken=false → masked form (getDataSourceList.md:28-32). The Collector
      repository test confirms the list path emits showToken=false. Combined with
      H-003, under DISABLED these last-6-chars reach any anonymous caller. The
      live /features/management doc now warns about exactly this ("the last six
      characters of the token leak through the list response").
    evidence:
      - sidecar: source_read_for_validation
        section: TokenMapperImplTest.mapValue_hiddenToken_masksAllButLastSix
        cite: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/mapper/TokenMapperImplTest.java:29-32"
        note: "@validates F-163 — masked form is '******'+last6; verified"
        source_read_for_validation: true
      - sidecar: odd-platform__java__DataSourceController__controller-method__getDataSourceList.md
        section: understanding + coupling
        cite: "TokenMapper.java:15-18 + TokenDto.java:6-8 (showToken=false on list path)"
        note: "List path = masked; register/regenerate = plaintext. Swapping the constructor would leak full tokens"
    severity: null
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: render
    coverage: verified
    test_ref: "TokenMapperImplTest.mapValue_hiddenToken_masksAllButLastSix (@validates F-163) + CollectorRepositoryImplTest (showToken=false on list)"
    test_demand: null

