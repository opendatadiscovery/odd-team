- id: H-007
  hypothesis: "When the operator enables S2S (`auth.s2s.enabled=true`) as defence-in-depth alongside the ingestion filter — exactly as the live S2S doc recommends — the `X-API-Key` gate protects the `/ingestion/**` endpoints."
  derivation: "The live S2S doc (WebFetched 2026-05-25, status 200) recommends 'combine S2S with auth.ingestion.filter.enabled: true' and shows a curl using X-API-Key against /ingestion/entities. Doc-claim seed."
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      The S2sAuthenticationFilter is mounted via addFilterAt within the
      non-DISABLED security configurations — but the /ingestion/** WHITELIST_PATHS
      permitAll runs at the authorize step BEFORE the request would be subject to
      the S2S authority requirement, so a whitelisted path is admitted without
      the S2S filter ever gating it. S2S grants ADMIN identity to a valid
      X-API-Key, but on /ingestion/** the whitelist short-circuits the
      authorization, so S2S being ON does not CLOSE the ingestion endpoints — it
      only opens an additional admin path elsewhere. The doc's defence-in-depth
      recommendation does not hold for the whitelisted ingestion namespace.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-class__IngestionController.md
