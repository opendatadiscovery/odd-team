proposed_canonical: Administrator-name reservation asymmetry on CRUD
rationale: '2-sidecar primary-source triangulated cross-cutting CRUD-defensive asymmetry
  from batch 2026-05-12E. `RoleServiceImpl` + `PolicyServiceImpl` both protect the
  seeded `Administrator` predefined name on UPDATE + DELETE paths but NOT on CREATE.
  The only fence on creation is the partial-unique DB index, which depends on the
  seeded row remaining present. Recommended cleanup: extract `RbacNameValidator` helper
  + invoke from all three create paths. Codebase-wide refactoring scope ~2 files.'
contributing_concepts:
- RoleServiceImpl.update/.delete check `UserProviderRole.values()`; RoleServiceImpl.create
  does NOT (batch E)
- PolicyServiceImpl.update/.delete reject `ADMINISTRATOR_POLICY` name; PolicyServiceImpl.create
  does NOT (batch E)
- role_name_unique + policy_name_unique partial indexes depend on seeded row presence
  (V0_0_55__add_policies_and_roles.sql:30, 42)
suggested_add_to_docs: false
