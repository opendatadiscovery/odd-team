proposed_action: |-
  Add `OwnerDeleteRaceWindowTest` (Testcontainers + R2DBC + parallel reactive subscriptions). (a) Seed Owner with NO ownership rows; (b) start two parallel subscriptions: thread A does POST /api/dataentities/{id}/ownership creating an Ownership for the seeded owner; thread B does DELETE /api/owners/{id}; (c) use Testcontainers to set short network delays so thread B's existence-check completes before thread A's INSERT commits; (d) assert the resulting state: SELECT * FROM ownership WHERE owner_id = O AND EXISTS(SELECT 1 FROM owner WHERE owner.id = O AND owner.deleted_at IS NOT NULL) returns ONE row (the orphan); pin the current race-window behaviour. Future fix that adds SELECT FOR UPDATE on the cascade-check or moves to a Postgres advisory lock will break this test.
