notes: 'Activity Table Partitioning is the OPERATIONAL counterpart to the

  Activity Feed concept — Activity Feed is the read surface, this is

  the durability surface. The concept also covers the sibling

  MessageTablePartitionManager (DataCollaboration messages table) by

  pattern. main-concepts.md does not name "Partition" or "Partitioning"

  as a canonical term; the operator-facing reference at

  `/configuration-and-deployment/odd-platform#activity-feed-partitioning-odd-activity-partition-period`

  documents the partition-period config but mis-describes its effect

  (claims retention; actually width-only) and omits coupled keys

  (partition.advisory-lock-id). Three high-priority DOC-NNN candidates

  flow from this concept: (a) correct the retention claim on the

  activity-feed feature page, (b) add `partition.advisory-lock-id` +

  DB-role-privilege requirements to the operator reference, (c) add

  operational observability guidance (the partition-creation failure

  mode is currently invisible).


  Batch 2026-05-12D adds 2-sidecar primary-source triangulation for the

  activity-retention-drift weakness — HousekeepingTTLProperties confirms

  that no `activity*Days` field exists ANYWHERE in the codebase; the only

  activity-touching housekeeping path requires partitions to already be

  empty before dropping. REFACTOR-085 is now confirmed from two angles

  and surfaced as a separate cross-cutting invariant ("Retention claim

  vs code drift").

  '
