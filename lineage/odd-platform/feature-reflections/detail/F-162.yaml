- id: H-004
  hypothesis: |-
    When an operator types an invalid value into an INTEGER/number argument (a negative
    number for a retention-days field, a decimal, an out-of-range value, or pastes a
    non-numeric string), the form rejects it before allowing Configure — so an invalid value
    never reaches the copied snippet.
  derivation: |-
    Endpoint-shape + negative-space — non-boolean non-static fields carry `required: true`
    and a `validate` callback; the operator's mental model is that "required + validate"
    means the value is checked. INTEGER fields render as type='number' (arg.type !== 'STRING').
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The `validate` body at IntegrationCodeSnippetWithForm.tsx:86-90 is
      `validate: value => { if (typeof value === 'string') return !!value.trim(); }`. For a
      number-typed input (any non-STRING type, rendered type='number' at line 101), the
      browser coerces the field value to a number; `typeof value === 'string'` is then FALSE,
      so the validate function falls through and returns `undefined`. react-hook-form treats
      an `undefined` validate result as VALID. There is no min/max/step/sign/finiteness/integer
      check anywhere — the only constraint on a number field is the browser's native
      type='number' input (which still accepts negatives, decimals, and very large numbers,
      and yields empty-string when cleared). The live Integration Wizard doc itself states the
      wizard "does not validate ... typed at face value" — so the contradiction is between the
      operator's reasonable expectation (a required+validated INTEGER field is checked) and the
      actual behaviour (numbers bypass the validate body entirely).
    evidence:
      - sidecar: "(unresolved — source_read_for_validation)"
        section: validation
        cite: "IntegrationCodeSnippetWithForm.tsx:86-90 (validate string-branch only); :101 (type='number')"
        note: "validate returns undefined for numbers → treated valid; no range/sign/integer check"
      - sidecar: "(doc cross-reference)"
        section: doc
        cite: "WebFetch docs.opendatadiscovery.org/integrations/integrations/integration-wizard"
        note: "doc confirms no source-side validation; does NOT disclose the string-only client gate"
    operator_visible_failure: |-
      (1) An operator typing a negative number into a field that semantically must be
      positive (retention-days, port, batch-size) passes Configure successfully; the invalid
      value is substituted verbatim into the YAML; they copy it into collector_config.yaml; the
      COLLECTOR rejects or misbehaves at deploy/run time — feedback delayed by a full deploy
      cycle. (2) Pasting a non-numeric string into the number field can yield an empty value or
      NaN coercion that silently produces a snippet with a blank/garbage parameter. (3) The
      required+validate UI affordance gives FALSE confidence: the operator believes the form
      validated their integer because they saw a "required" asterisk-style gate work for the
      text fields. (4) The number-field cleared-to-empty case: `required: true` should catch an
      empty number, but because the validate fallthrough returns undefined, the empty handling
      relies solely on react-hook-form's `required` on a coerced-number field — fragile and
      untested.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional
  sme_consultation_recommended: true
  sme_consultation_question: |-
    For a data-catalog integration wizard, do operators of comparable tools (Airbyte / Fivetran
    connector setup, Meltano) expect client-side range/type validation of connection parameters,
    or is "typed at face value, validated by the connector at connect time" the industry-canonical
    posture? Archetype: implicit-requirements.

- id: H-005
  hypothesis: |-
    When an operator submits `0` into a number argument (a legitimate value for
    "disabled"/"no limit" semantics), the form accepts it and `0` appears in the snippet.
  derivation: |-
    Negative-space — `0` is falsy in JS; a naive `!!value` check would wrongly reject it.
    Operators commonly pass 0 for retention-disabled / unlimited semantics.
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      Because the validate body (line 86-90) only runs its `!!value.trim()` falsy-check on the
      STRING branch, a numeric `0` never reaches that check — it falls through to `undefined`
      (valid). `required: true` on a populated number field with value 0 is satisfied (0 is a
      present value, not an empty input). So `0` passes and is substituted into the template.
      This is the correct outcome — but it is correct by accident (the string-only validate that
      causes H-004's bug is the same code that makes `0` pass here). The two hypotheses share a
      root cause with opposite valence.
    evidence:
      - sidecar: "(unresolved — source_read_for_validation)"
        section: validation
        cite: "IntegrationCodeSnippetWithForm.tsx:86-90, 101"
        note: "0 bypasses the string-only validate → accepted (correct, but incidental)"
    confidence: MEDIUM
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
  sme_consultation_recommended: false

