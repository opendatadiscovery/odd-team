proposed_action: |-
  Author the scaffold + meta-test:

  (a) `_scaffold.routesAreTested.test.ts`: a single assertion that `globby` returns > 0 `*.test.{ts,tsx}` files under `odd-platform-ui/src/routes/__tests__/`. Initially FAILS — the first test author makes it pass by adding `_smoke.test.ts`. Pins the meta-invariant "the routes/ directory IS tested".

  (b) `_smoke.test.ts`: a single test asserting `dataQualityPath() === '/data-quality'`. Costs 4 lines, prevents the lowest-effort regression.

  (c) Add a `odd-platform-ui/src/routes/README.md` (or comment-block in `routes/index.ts`) documenting: 'The routes/ directory is tested under routes/__tests__/. See TEST-GAP-1003 (this meta-anchor) + TEST-GAPs 994-1005 (concrete behaviours to pin). Any new route module MUST add at least a `_smoke.test.ts` that asserts its primary path builder returns the expected literal. Project-wide route-param anti-pattern (parseInt + `as T` cast) is documented in TEST-GAP-422 / TEST-GAP-849 / TEST-GAP-997 / TEST-GAP-1000 — new useParams hooks should add isNaN guards.'

  Pair with the orchestrating maintainer's documentation pillar to add a "Testing route modules" snippet to `docs/contributing/testing.md` once the scaffold lands.
