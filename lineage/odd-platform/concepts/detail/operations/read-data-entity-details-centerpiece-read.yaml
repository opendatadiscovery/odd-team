name: Read Data Entity Details (centerpiece read)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
- P-01
- P-09
description: '`GET /api/dataentities/{data_entity_id}` — the platform''s single hottest
  read endpoint. NO `@PreAuthorize`, NO SECURITY_RULES entry, falls through to `pathMatchers(''/**'').authenticated()`
  (and `permitAll()` under DISABLED). Pure delegation to `DataEntityService.getDetails(long)`:
  1 CTE select (multi-JOIN, `baseDimensionsSelect`) + 5 parallel reactive lookups
  (enrich-class: dependencies + last-task-runs + DEG-children + DEG-children-count
  + consumers-count) + 1 parent-DEG lookup + 4 parallel reactive lookups (enrich-details:
  metadata + dataset-versions + terms + tags) + 1 UPDATE `view_count` → ~10 round-trips
  per call. `@ReactiveTransactional` wraps the chain INCLUDING the view-count UPDATE
  — every read is also a write at the DB layer. Soft-deleted entities ARE returned
  (`.includeDeleted(true)` is deliberate; UI needs this to render the `isStale` flag).
  Returns the FULL 34-field `DataEntityDetails` payload — ownership[], descriptions,
  tags, terms, metadataFieldValues[], dataSource, linkedUrlList[], sourceList[]/targetList[]/outputList[]/inputList[],
  viewCount, isStale, manuallyCreated, suiteUrl/suiteName/expectation/severity. Centerpiece
  embodiment of the read-collaborative posture (ADR-CANDIDATE-003 RESOLVED as INTENTIONAL
  on this endpoint). **Batch J — UI HALF (P-01 pillar)**: the canonical caller is
  `DataEntityDetails.tsx` (the per-entity detail-page top-level component) mounting
  at `/dataentities/:dataEntityId/*`; the fetch is dispatched via `fetchDataEntityDetails`
  redux-thunk wrapping the OpenAPI-generated `DataEntityApi.getDataEntityDetails`.
  Every page-mount fires the thunk via `useEffect` at DataEntityDetails.tsx:56-64.
  **LSN-017 doubling confirmed**: the dep-array contains `details.status?.status`
  which is itself populated by THIS very thunk''s fulfilled action — first render
  fetches (status undefined → real value), second render re-fires (status value unchanged),
  net: TWO `GET /api/dataentities/{id}` calls per page-open, TWO `view_count + 1`
  UPDATEs. Empirically pinned by probe P-004 (xhr_count=2 + DB delta=2; regex-filtered
  exact path match). The fulfilled payload fans across THREE redux slices (dataentities
  + metadata + owners) via independent extraReducers. Error path uses `switchOffErrorMessage:
  true` → no toast on rejection; `<AppErrorPage>` is the only error surface. No client-side
  validation of `dataEntityId` (negative / zero / NaN flow through to the backend).
  No `requestId`-based stale-response guard. UI security inheritance: the thunk has
  no authorization check; under DISABLED-mode the read is anonymous; under LOGIN_FORM/OAUTH2/LDAP
  every authenticated user fetches every entity (read-collaborative). UI performance:
  the mount issues 5 parallel thunks (this one + 4 in the second useEffect: alert-counts,
  DQ-test-report, SLA-report, resource-permissions) — 6 HTTP calls per mount with
  LSN-017.'
axes_present:
- controllers
- ui_components
- ui_redux_thunks
nodes:
- odd-platform java DataEntityController controller-method:getDataEntityDetails
- odd-platform ts react-component component:DataEntityDetails
- odd-platform ts redux-thunk thunk:fetchDataEntityDetails
contributors:
- 'getDataEntityDetails.md:concepts.operations: delegate getDetails(Long), CTE select,
  error-on-missing, enrich-entity-class (5-zip), enrich parent-DEGs, enrich-details
  (4-zip), side-effect view_count UPDATE, map DTO, lift to 200 OK'
- getDataEntityDetails.md:implicit_adrs.[0] (read-collaborative GET intentionally
  outside SECURITY_RULES) + implicit_adrs.[1] (soft-deleted entities returned by design)
  + implicit_adrs.[2] (read-as-write view_count increment) + implicit_adrs.[3] (multi-stage
  zip-merge enrichment)
- 'DataEntityDetails.md (batch J — UI HALF): concepts.operations[dispatch fetchDataEntityDetails
  on mount + dep-array change, dispatch 4 parallel ancillary fetches mount-only, render
  conditional Header/Tabs + unconditional Routes, render Skeleton/AppErrorPage as
  exclusive alternatives]; concepts.invariants[the 5-element dep-array contains 1
  response-derived value (LSN-017 bug locus)]; bugs_limitations_corner_cases.[0]
  LSN-017 empirically pinned by P-004 at run R-20260519T010758Z-P-004 (HIGH); implicit_adrs.[0]
  page-component owns data-fetch lifecycle; implicit_adrs.[1] skeleton + content +
  error exclusive renders; implicit_adrs.[2] permissions via React Context'
- 'fetchDataEntityDetails.md (batch J — UI HALF): concepts.operations[dispatch thunk
  → pending → API call → fulfilled fans to 3 slices → no success toast → no error
  toast]; concepts.invariants[exactly one HTTP call per dispatch (no de-dup, no retry,
  no debounce); fulfilled payload fans into THREE slices simultaneously (dataentities
  + metadata + owners) via independent extraReducers; switchOffErrorMessage suppresses
  toast not rejectWithValue]; implicit_adrs.[0] project standardises all async data-fetching
  through handleResponseAsyncThunk; implicit_adrs.[2] fulfilled payload fans across
  three slices intentionally; bugs_limitations_corner_cases.[self-feeding double-fetch
  loop HIGH cross-referenced from this thunk + DataEntityDetails dep-array]'
