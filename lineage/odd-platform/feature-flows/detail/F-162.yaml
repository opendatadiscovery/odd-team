observed_vs_expected:
  facets:
    - facet_id: handlebars_compile_misuse_via_usecallback_invoked_at_render_time_not_memoised
      drift_class: handlebars_compile_misuse_via_usecallback_invoked_at_render_time_not_memoised
      severity: LOW
      observed: |-
        IntegrationCodeSnippetWithForm.tsx:22-24 declares
        `const compiledTemplate = useCallback(Handlebars.compile(snippet.template), [snippet.template])`.
        The semantic intent appears to be "memoise the compiled
        template across renders" — but `useCallback(value, deps)`
        memoises a CALLBACK function reference, not an arbitrary
        value. Here `Handlebars.compile(snippet.template)` is invoked
        on EVERY render before useCallback receives the result. The
        compiled template happens to be a function (Handlebars
        returns a render function), so useCallback's signature
        accepts it without typecheck error, but the memoization is
        a no-op — the compile runs every render. For a small wizard
        manifest the cost is invisible; for a large manifest the
        per-keystroke re-compile across the React form state cascade
        is wasteful. The correct call is useMemo.
      expected: |-
        Replace with `const compiledTemplate = useMemo(() => Handlebars.compile(snippet.template), [snippet.template])`
        so the compile happens once per template change instead of
        every render.
      evidence:
        - "IntegrationCodeSnippetWithForm.tsx:22-24"
        - "https://react.dev/reference/react/useCallback (useCallback memoises a function REFERENCE, not arbitrary values)"
      operator_visible_consequence: |-
        Latent — invisible to the operator unless the manifest is
        huge OR the operator's browser is on a slow device. The bug
        is a minor inefficiency, not a correctness defect.
      ui_unverified: false
    - facet_id: required_field_validate_only_checks_string_branch_number_fields_skip_validation
      drift_class: required_field_validate_only_checks_string_branch_number_fields_skip_validation
      severity: MEDIUM
      observed: |-
        IntegrationCodeSnippetWithForm.tsx:86-90 — the `rules`
        block for every non-BOOLEAN non-staticValue argument
        carries `required: true` AND `validate: value => { if
        (typeof value === 'string') return !!value.trim(); }`. The
        validate body explicitly checks `typeof value === 'string'`
        before applying the trim+empty check. For an `arg.type ===
        'INTEGER'` field (rendered as type='number' at line 101),
        `value` arrives as a number (or empty string when the user
        clears the input). The `typeof value === 'string'` branch
        FAILS for numbers — the validate function returns undefined,
        which react-hook-form treats as "valid" (no error). A
        user submitting a non-empty integer passes; but a user
        submitting `0` (a legitimate integer that operators commonly
        pass for "disabled" / "no limit" semantics) ALSO passes
        without explicit validation of the integer's range, sign,
        or finiteness. More problematic — there is no min/max/step
        validation; the `arg.type === 'INTEGER'` schema is enforced
        ONLY by the browser's type='number' input. Negative numbers,
        decimals, NaN-on-paste, and very large numbers are accepted.
      expected: |-
        Either (a) extend the validate body to branch on `typeof
        value === 'number'` with appropriate integer/positive/range
        checks; OR (b) the manifest YAML schema includes per-argument
        validation hints (min / max / pattern / enum) and the form
        consumes them; OR (c) live docs / the manifest authoring
        guide explicitly state that argument values are
        client-trusted and the collector's own validation is the
        authoritative gate.
      evidence:
        - "IntegrationCodeSnippetWithForm.tsx:86-90 (validate body string-only)"
        - "IntegrationCodeSnippetWithForm.tsx:101 (type='number' input)"
      operator_visible_consequence: |-
        An operator typing an invalid integer (e.g. negative for a
        retention-days field) submits successfully; the resulting
        Markdown carries the invalid value verbatim; the operator
        copy-pastes into their collector config; the COLLECTOR
        fails at runtime. The error feedback is delayed by the
        deploy cycle.
      ui_unverified: false
    - facet_id: static_value_argument_renders_invisible_input_no_disclosure_to_operator
      drift_class: static_value_argument_renders_invisible_input_no_disclosure_to_operator
      severity: LOW
      observed: |-
        IntegrationCodeSnippetWithForm.tsx:69-77 — when an argument
        has `staticValue`, the field renders as a
        `<input style={{display: 'none'}} value={arg.staticValue}>`
        registered into the form. The operator NEVER sees that the
        argument exists or that a hardcoded value is being baked
        into their copy-pasted snippet. This is the
        platform_url-substitution mechanism (per F-033's
        `default_platform_url_placeholder_into_copy_pasted_snippets`
        finding): the manifest's static `platform_url` argument is
        injected from server-side mapping context and rendered
        invisibly into the template.
      expected: |-
        Either (a) the form renders a read-only badge for each
        static argument disclosing its value (so the operator can
        verify before copy-pasting); OR (b) the manifest authoring
        guide documents the invisible-injection behaviour; OR (c)
        a "static substitutions" preview block above the form lists
        every server-injected value about to be baked in.
      evidence:
        - "IntegrationCodeSnippetWithForm.tsx:69-77 (display:none input)"
        - "F-033 finding: default_platform_url_placeholder_into_copy_pasted_snippets"
      operator_visible_consequence: |-
        Per F-033 — under a misconfigured platform.base-url (the
        default ships as `<odd-platform-repo>`), the operator
        copy-pastes the snippet and silently bakes the placeholder
        URL into their collector. Disclosure of the injection point
        would make this misconfiguration visible at copy-paste time
        rather than at first-run time.
      ui_unverified: false
    - facet_id: configured_snippet_no_explicit_copy_button_relies_on_markdown_renderer_copy_affordance
      drift_class: configured_snippet_no_explicit_copy_button_relies_on_markdown_renderer_copy_affordance
      severity: LOW
      observed: |-
        IntegrationCodeSnippetWithForm.tsx:122-132 — after
        Configure, the panel shows the Reconfigure button and the
        rendered Markdown. There is NO explicit "Copy" button on
        the configured snippet; the copy affordance depends on the
        Markdown component's own code-block copy widget (assumption,
        not verified at this UI pass). For a snippet that operators
        are EXPECTED to copy-paste verbatim into their collector
        config, the absence of a top-level Copy button is a friction
        point — operators triple-click + Ctrl+C, miss the trailing
        newline or the leading whitespace, and ship subtly broken
        YAML.
      expected: |-
        A "Copy snippet" affordance (with a clipboard icon, mirroring
        CopyButton at CollectorItemToken.tsx:52) above the rendered
        Markdown, scoped to the snippet's text and explicit about
        line-ending normalisation.
      evidence:
        - "IntegrationCodeSnippetWithForm.tsx:122-132 (Reconfigure block + Markdown only)"
        - "CollectorItemToken.tsx:52 (the CopyButton pattern used elsewhere on the same Management section)"
      operator_visible_consequence: |-
        Copy-paste friction; subtle whitespace bugs in operator
        collector config; possible silent dropping of the leading
        Markdown code-fence backticks if the operator pastes line
        ranges instead of the whole block.
      ui_unverified: true
      ui_unverified_reason: |-
        The Markdown component's internal copy widget behaviour
        was not read in this UI pass. /enrich on the shared
        Markdown component will confirm whether a copy button
        ships per code-fence.
    - facet_id: reconfigure_round_trip_loses_typed_values_on_re_show_form_unless_form_state_re_hydrated
      drift_class: reconfigure_round_trip_loses_typed_values_on_re_show_form_unless_form_state_re_hydrated
      severity: LOW
      observed: |-
        IntegrationCodeSnippetWithForm.tsx:122-128 — clicking
        Reconfigure (line 124-128) flips showForm back to true but
        does NOT reset snippetArgs and does NOT explicitly re-hydrate
        the form fields. react-hook-form's internal state retention
        across the showForm toggle is implicit and depends on the
        useForm({}) configuration at line 20 (default — no
        defaultValues, no shouldUnregister explicit). The user's
        observed behaviour on Reconfigure: the form likely returns
        to empty (defaults) rather than pre-populated with the
        values they just submitted. Operators reconfiguring to tweak
        a single value end up re-typing every value.
      expected: |-
        On Reconfigure, the form should re-hydrate from snippetArgs
        so the operator's prior values are visible and editable —
        the natural meaning of "Reconfigure" (vs. "Reset" which
        could be a sibling affordance).
      evidence:
        - "IntegrationCodeSnippetWithForm.tsx:122-128 (Reconfigure button — no reset / no re-hydrate)"
        - "IntegrationCodeSnippetWithForm.tsx:20 (useForm({}) with no defaultValues)"
      operator_visible_consequence: |-
        Operator tweaking one value re-types every value. Friction
        compounds with the no-copy-button finding above for a
        workflow that should be a fast configure → copy → done cycle.
      ui_unverified: true
      ui_unverified_reason: |-
        react-hook-form state retention across conditional render
        depends on internal behaviour not fully traced here; verify
        empirically.
