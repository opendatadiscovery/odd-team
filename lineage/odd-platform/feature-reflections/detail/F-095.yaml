# Dataset-Field Statistics Ingestion — cross-dataset write surface — product-owner reflection

## product_owner_narrative

Dataset-Field Statistics Ingestion is the platform's "push your column profiles here" surface. A data-quality producer — the `odd-collector-profiler`, a Great Expectations / dbt push adapter, or any custom framework — computes per-column statistics (null counts, min/max, mean/median, distinct counts, plus optional per-field tags) and POSTs them as a `DatasetStatisticsList` to `POST /ingestion/entities/datasets/stats`. The platform stores each column's profile as a JSONB blob on the `dataset_field.stats` column and recomputes the full-text-search vector for the named dataset so the new tags become searchable (per `postDataSetStatsList.md`:understanding + dependencies_semantic). This is pillar P-10's data-quality ingest arm and the feed for pillar P-04's three quality granularities (per `system-mission.md` P-04 sub-feature "Test Results Import" + cross-pillar map P-10→P-04).

A producer interacts with the feature purely over HTTP: one POST per dataset per profiling tick, body is a list of `DataSetStatistics` items, each carrying a parent `datasetOddrn` plus a `fields: Map<fieldOddrn, DataSetFieldStat>` map (per `postDataSetStatsList.md`:concepts.entities). The endpoint returns `201 Created` with an empty body — the producer learns nothing programmatically about how many fields were actually updated (per `postDataSetStatsList.md`:bugs_limitations_corner_cases[10]). The end *user* never touches this endpoint directly; what they see is downstream — the per-column statistics rendered on the Dataset Structure tab and aggregated into the Quality Dashboard rings (per `postDataSetStatsList.md`:security.data_exposure[0] + feature-flow F-095 terminal_side_effect). That downstream render surface is the operator-visible face of every contradiction below.

The working parts a product owner would demo: you push a per-field stat and it shows up on the column's profile; you push a tag alongside the stat and it appears as an EXTERNAL_STATISTICS-origin tag on the field, kept distinct from tags a UI user curated by hand (per `postDataSetStatsList.md`:implicit_adrs[2] + the service test `externalStatisticsTagStateIngestionTest`); you re-push and the profile updates in place rather than accumulating duplicates (per `postDataSetStatsList.md`:concepts.invariants[3]). Those three are the feature's genuine promises and the chain honours them.

The integration story is where the feature's seams show. This endpoint sits in pillar P-09's blind spot: it is whitelisted via `/ingestion/**` in `SecurityConstants.WHITELIST_PATHS` and is NOT matched by `IngestionDataEntitiesFilter` (whose path matcher is exact-literal `/ingestion/entities`, POST), so it is unauthenticated under every supported `auth.type` and regardless of `auth.ingestion.filter.enabled` (per `postDataSetStatsList.md`:security.auth_mode_relevance + the live Security doc page, which lists this exact path as "outside the ingestion filter's coverage"). Pillar P-10's own load-bearing note — "datasource scoping is payload-driven, NOT principal-driven" (per `system-mission.md` P-10 maintainer-notes) — manifests here in its sharpest form: the write target is chosen entirely by the field-ODDRN in the payload, the declared parent `datasetOddrn` is consulted only to pick which dataset's FTS vector to recompute, and nothing cross-checks that the field actually belongs to the named parent (per `postDataSetStatsList.md`:concepts.invariants[4] + bugs_limitations_corner_cases[1]). The same payload also reaches into pillar P-08's Tag taxonomy: a `tags` array on a stat creates catalog tags via `getOrCreateTagsByName(...)`, the same auto-create primitive the UI gates behind `TAG_CREATE` (per `postDataSetStatsList.md`:dependencies_semantic.requires-feature + bugs_limitations_corner_cases[5]).

Edge cases a product owner would flag in a demo: a re-push that drops a previously-sent tag silently removes that EXTERNAL_STATISTICS tag from the field (the F-008 `silent_destruction_replace_not_merge` class, applied to the per-field tag plane — per `postDataSetStatsList.md`:bugs_limitations_corner_cases[6]); a payload with a typo in the field ODDRN returns `201 Created` having written nothing, with no warning logged (per `postDataSetStatsList.md`:bugs_limitations_corner_cases[8]); negative null-counts, inverted min/max, and NaN means are accepted verbatim into JSONB because the OpenAPI integer fields carry no bounds (per `postDataSetStatsList.md`:bugs_limitations_corner_cases[4]); and an empty `{}` body NPEs to a 500 because — unlike the sibling `postDataEntityList` — there is no empty-payload guard (per `postDataSetStatsList.md`:concepts.invariants[1]). None of these is recorded on the Activity Feed: `updateStatistics` carries no `@ActivityLog`, while its `DatasetFieldServiceImpl` siblings `updateInternalName` and `updateDatasetFieldTags` do (per `postDataSetStatsList.md`:security.known_security_gaps[5]).

