behaviour: |-
  **MEDIUM — Unhandled rejection + missing .rejected reducer combine into silent-failure mode. Auth-token-expired mid-session reproduces this.** `useCreateSearch.ts:14-19`: `dispatch(createDataEntitiesSearch({searchFormData})).unwrap().then(({searchId}) => { ... navigate(searchLink); })`. NO `.catch(...)` follows the `.then`. `.unwrap()` re-throws on rejection. If `createDataEntitiesSearch` rejects (server-side 500, network failure, auth expiry mid-flight), the rejection lands in the React error boundary (if any wraps the Route — App.tsx:60-65 verified NO `<ErrorBoundary>` wraps the Route element) or the browser console.

  **The slice has missing `.rejected` reducers** (slice.ts:214-260 verified — only `.fulfilled` cases). Neither the slice nor the UI surfaces the failure.

  **Net failure mode**: User sees a frozen empty page with no error message; the URL stays at `/search`; refreshing repeats the same path.

  **Reproduction scenarios**:
  1. Auth-token-expired mid-session — `GET /api/search/{searchId}` returns 401 → thunk rejects → slice silent → URL retains `:searchId` → user sees frozen empty page → refresh repeats.
  2. Stale URL UUID from 30+ day old Slack link — server-side `SearchFacetsHousekeepingJob` evicted the session (default `housekeeping.ttl.search_facets_days: 30` per F-010) → GET 404 → same silent failure.
  3. Server-side 500 from FTS injection (per TEST-GAP-838) — same silent failure.

  **Why MEDIUM**:
  - **Operator-misleading silent failure mode** — the user has no diagnostic path
  - Combined with FTS-injection + session-bearer-token (TEST-GAP-838 + TEST-GAP-841), the silent-failure compounds: poisoned UUID shared → recipient sees broken page → no error trace
  - **Defense-in-depth + observability gap** — silent failures inhibit operator diagnostics
  - **Cross-cutting**: same pattern in TermSearch batch-U bugs[3]; clone-propagated

  **Test gap shape**: Three error-path tests asserting that rejection paths surface user-visible diagnostics (or PIN the current silent-failure).
