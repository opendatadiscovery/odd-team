feature_id: F-034
name: Platform Feature-Flag Exposure
pillar_anchored_id: P-09:F-006
discovered_at_batch: ZE
discovered_at_commit: 25e66b1
discovered_from_entry_point: |-
  ui_route:* — every SPA mount (App.tsx useEffect, empty deps) fires GET
  /api/features/active once
batch_extensions:
  - batch: ZJ
    entry_point_added: |-
      ui-shell-widget:ToolbarTabs — the navigation chrome that should
      consume the activeFeatures slice but DOESN'T. Hop-2 of F-034's
      chain previously cited App.tsx as the fetch site + WithFeature
      as a downstream consumer. Batch ZJ confirms via the ToolbarTabs
      sidecar that the 9-tab primary navigation row is UNCONDITIONAL
      with respect to feature flags — the F-034 boot-immutable
      Set<Feature> is dispatched into Redux but NEVER read by the tab
      visibility model. The disconnect is the load-bearing F-034/F-041
      cross-feature drift.
    contributing_nodes_added:
      - odd-platform ts components/shared/elements/AppToolbar/ToolbarTabs ui-shell-widget:ToolbarTabs
    notes: |-
      ONE net-new drift facet surfaces from the ToolbarTabs sidecar
      primary source:

      (1) FEATURE-FLAG-SET DISPATCHED BUT NOT CONSUMED BY NAVIGATION
      CHROME (MEDIUM, structural drift between F-034 and F-041) —
      App.tsx:49 dispatches `fetchActiveFeatures()` on SPA mount; the
      resulting `Feature` set is stored in Redux. ToolbarTabs.tsx:34-82
      builds the 9-tab navigation row in a useMemo with NO
      `useAppSelector(getActiveFeatures)` read, NO WithFeature wrapping
      on any tab. The Grep across the AppToolbar subtree for
      `WithFeature|getActiveFeatures` returns ZERO matches. The toolbar's
      tab visibility is structurally invariant to F-034's published flag
      set. Tabs whose DESTINATION pages ARE feature-gated downstream
      (Data Modelling's Query Examples sub-features wrap children in
      `<WithFeature featureName={Feature.DATA_COLLABORATION}>` at
      Message.tsx:59, MainThreadMessage.tsx:36,
      DataEntityDetailsHeader.tsx:132) remain visible regardless of
      whether `datacollaboration.enabled=false`. The fetchActiveFeatures
      dispatch fires unconditionally but is consumed only by sub-page
      affordances, not by the chrome that lands the user on them.
      NEW drift facet for F-034:
      `feature_flag_set_dispatched_but_not_consumed_by_navigation_chrome`.
      STRENGTHENS existing facet `feature_enum_ui_backend_skew_silent_disable`
      with primary-source evidence at the consumer layer: even WHEN the
      flag set is correctly synchronized between backend + UI enum, the
      navigation chrome is invariant to it.

      Cross-references:
        - F-041 (new this batch) owns the chrome surface; F-034 owns the
          backend endpoint surface — the disconnect lives at the
          consumer boundary between them.
        - REFACTOR-625 already documents the boot-immutable design;
          adding the navigation-chrome-skip as a sub-finding of the
          broader UI/feature-flag posture.

      Coherence sweep STRENGTHENS=2 (existing `feature_enum_ui_backend_skew`
      strengthened; F-035's tabnabbing finding cross-referenced because
      both F-034 + F-035 surfaces are consumed via the same toolbar);
      SUPERSEDES=0; CONFLICTS=0.
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render — JSON FeatureList items=[]|[DATA_COLLABORATION]|[ALERT_NOTIFICATIONS]|[both]
    shapes the WithFeature wrapper visibility for the Open-in-Slack button, DataCollaboration
    thread surface, and every affordance gated by the two boot-resolved flags. The toolbar
    navigation chrome (F-041) is NOT shaped by this output — tabs render unconditionally
    regardless of the published flag set.
