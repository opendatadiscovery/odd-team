proposed_action: |-
  Two unit tests. (A) Stub Authentication with [USER, READ_QUERY_EXAMPLE] authorities. Assert getCurrentUserProviderRole returns Mono.just(USER) — the READ_QUERY_EXAMPLE is silently dropped. (B) Stub Authentication with empty authorities collection. Assert getCurrentUserProviderRole returns empty Mono (the CollectionUtils.isNotEmpty filter drops it before iterator().next() can throw). LOCKS both contracts.
