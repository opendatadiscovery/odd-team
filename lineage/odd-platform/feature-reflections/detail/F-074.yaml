# Management-Tab Read-Collaborative Posture — product-owner reflection

## product_owner_narrative

ODD Platform's Management section is the operator-facing surface for everything an
operator configures inside the running platform: namespaces, datasources,
collectors and their tokens, owners, the tag taxonomy, RBAC roles and policies,
and user-owner association requests (per `system-mission.md:222-247`, P-08). This
feature is not a single screen — it is the **cross-cutting read posture** shared by
the seven directory-list endpoints behind those tabs: `GET /api/owners`,
`/api/datasources`, `/api/collectors`, `/api/titles`, `/api/namespaces`,
`/api/owner_association_request/activity`, and `/api/owners/providers`. The
product-owner question this feature answers is not "what does one tab show?" but
"who is allowed to READ the catalog of operational configuration, and does that
match what an operator setting up RBAC expects?" (per `F-074.yaml:5-14`).

The mechanism is uniform and deliberate. None of the seven list endpoints carries
a `@PreAuthorize`; none has an entry in `SecurityConstants.SECURITY_RULES`; all
fall through to the single catch-all `pathMatchers("/**").authenticated()` in
`AuthorizationCustomizer:29-30` (per the DataSource method sidecar
`getDataSourceList.md:31-38` and the Title sidecar invariants[3], lines 37). The
authorization table guards MUTATIONS only — every `*_CREATE` / `*_UPDATE` /
`*_DELETE` verb is gated, but there is **no `*_READ` permission anywhere in the
model** (per `permissions` doc WebFetched 2026-06-03 status 200: "There is no
OWNER_READ permission"). So under `LOGIN_FORM` / `OAUTH2` / `LDAP`, any
authenticated user reads every directory regardless of role, policy, or owner
scope; under `auth.type=DISABLED` — the application.yml-shipped default (per
`DisabledAuthSecurityConfiguration` sidecar, `application.yml:32-34`) — every
directory is readable by any anonymous network caller, because the DISABLED chain
is `.anyExchange().permitAll()` and the SECURITY_RULES table is inert.

How a user interacts with it: an operator opens any Management tab (the sidebar
renders eight of nine tabs to every authenticated user; only Associations is
hidden behind `OWNER_ASSOCIATION_MANAGE` — per the `ui_review_2026_05_26` block,
`F-074.yaml:152-184`, the full UI-tier finding living in the newly-minted F-161).
The tab fires its list GET; the backend returns the full directory paginated
`id ASC` (insertion order) with no owner-scoping and no server-side size cap. Two
directories carry sensitive payloads beyond plain labels: the Collector and
Datasource lists embed each token's **last six plaintext characters** (the masked
`"******"+last6` form from `TokenMapper.mapValue`, per `getDataSourceList.md:28-32`
and `TokenMapperImplTest:29-32`), and the Owner-Association activity log exposes
the full "who approved Alice's binding to Owner-X at T" forensic record set —
which, notably, has NO SecurityRule of its own (per the OAR controller sidecar
`security.known_security_gaps[1]`, severity HIGH).

The integration story is cross-pillar. This posture is the read-side complement to
the P-09 Security pillar: the same `SecurityConstants.SECURITY_RULES` table that
gates Management mutations is what (by its silence on reads) defines this posture
(per `system-mission.md:262-267`, P-09 maintainer notes naming the
read-collaborative posture as "a load-bearing implicit ADR"). The Title directory
is also a load-bearing dimension for the authorization model itself — Policies can
gate access by `dataEntity:owner:title == 'X'`, so enumerating `/api/titles`
hands an attacker the deployment's policy vocabulary (per Title sidecar
`dependencies_semantic.requires-feature[1]`). The provider-list endpoint exposes
the auth-strategy topology (LOGIN_FORM / OAUTH2_GOOGLE / OAUTH2_GITHUB / LDAP) to
any authenticated user (per OAR sidecar `security.data_exposure[2]`).

The edge a product owner would highlight in a demo: this posture is **intentional**
and now formalised. ADR-CANDIDATE-003 has been promoted to **ADR-0003** and is
pinned by a contract test (`AdrSecurityRulesContractTest`, `@enforces ADR-0003`)
that asserts exactly one GET rule exists in the table. The original load-bearing
drift was operator-INVISIBILITY: the live docs were silent on the posture. As of
the 2026-06-03 re-fetch, the `/permissions` and `/features/management` pages now
document it explicitly (the read-collaborative posture, the token last-6 leak, the
Policy deep-link read). The reflection's job is therefore split: confirm the
posture is real and the test pins it (it does); and verify whether the
operator-discoverability gap — the load-bearing finding — is now closed (it
appears to be, pending live-render confirmation in /review Gate 8).

