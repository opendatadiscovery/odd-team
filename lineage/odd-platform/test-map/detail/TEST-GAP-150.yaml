behaviour: 'Okta + Keycloak silent gap: per live `/oauth2-oidc` docs both are supported
  (with YAML examples), but `Provider.java:3-5` enumerates only `COGNITO, GITHUB,
  GOOGLE, ODD_IAM, AZURE`. `auth/handler/impl/` contains only `GoogleUserHandler.java`
  + `GithubUserHandler.java`; `auth/logout/` contains 5 handlers, no Okta/Keycloak.
  Okta/Keycloak operators authenticate via generic OIDC but receive (a) no provider-specific
  user enrichment — admin-group claim mapping silently absent; (b) no provider-specific
  logout (fallback to default OIDC-initiated logout).'
