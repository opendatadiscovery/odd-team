behaviour: |-
  **The `type` query parameter (RelationshipsType enum: ERD / GRAPH / ALL)
  on GET /api/relationships drives an SQL filter switch — but no test
  exercises any of the three branches.** At
  ReactiveDataEntityRelationshipRepositoryImpl.java:99-101:
  - `type == ALL` → DSL.noCondition() (disables the filter; returns both
  types);
  - `type == ERD` → `relationships.field(RELATIONSHIPS.RELATIONSHIP_TYPE).eq(ERD)`;
  - `type == GRAPH` → `relationships.field(RELATIONSHIPS.RELATIONSHIP_TYPE).eq(GRAPH)`.

  A regression that inverted the ERD/GRAPH enum-to-SQL mapping, or that
  silently flipped `DSL.noCondition()` to the wrong branch, or that
  added a new RelationshipsType value without updating the switch,
  would not be caught by the build. The list endpoint is the primary
  surface of the P-02 Data Modelling feature; the UI uses the type
  filter as one of its main facets.

  Pairs with: the page=1 happy-path response shape pin (items[].id,
  items[].type, items[].sourceDataEntity / targetDataEntity refs) and
  the `query` substring filter behavior pin (relationship name match,
  not source/target entity name). The four uncovered behaviours
  enumerated in the sidecar map to one test class with four cases:
  type=ERD, type=GRAPH, type=ALL, and query-substring filter.
