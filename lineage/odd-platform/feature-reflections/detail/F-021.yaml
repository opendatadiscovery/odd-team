- id: H-007
  hypothesis: |
    When a Catalog Owner is deleted (or their `user_owner_mapping`
    row is soft-deleted), the historical activity rows that user
    created continue to display their username in the UI — so an
    auditor reviewing past actions can still reconstruct WHO
    performed each change.
  derivation: |
    The pillar mission's "audit-trail surface" frames the feature as
    HISTORICAL RECORD — an audit log that loses actor identity on
    owner-deletion is operationally useless. The actor column
    `activity.created_by` is varchar(512) and stores the username at
    INSERT time (per ActivityServiceImpl.java:47) — the data is
    preserved; the display SHOULD continue to surface it.
  seed_source: negative-space + pillar-mission
  validation:
    verdict: contradicted
    actual_behavior: |
      The actor display in the UI is resolved via the LEFT JOIN
      `USER_OWNER_MAPPING ON OIDC_USERNAME = ACTIVITY.CREATED_BY AND
      DELETED_AT IS NULL` (per ReactiveActivityRepositoryImpl.java:
      220-222). The join filters `USER_OWNER_MAPPING.DELETED_AT IS
      NULL` — meaning when the user-owner mapping is SOFT-DELETED
      (e.g. user-owner association removed by admin, user leaves the
      organization), the join misses; the resolved OwnerPojo is NULL;
      the UI surfaces the activity row with no actor (visually
      indistinguishable from a system event). The raw
