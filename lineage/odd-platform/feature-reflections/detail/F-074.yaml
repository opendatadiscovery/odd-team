- id: H-010
  hypothesis: |-
    When an integrator reads the OpenAPI spec for the seven Management list GETs,
    the spec signals the design intent (authenticated reads are not 403-gated) so
    the integrator does not code defensive 403-handling that never fires.
  derivation: |-
    The OpenAPI spec declares only 200 and 500 (no 403) on these GETs — implicitly
    encoding the no-read-gate intent (drift_class
    openapi_403_response_absent_implicit_design_intent_under_documented).
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |-
      The drift_class records that the OpenAPI spec declares only 200/500 (no 403)
      on these GETs — which is CONSISTENT with the code (authenticated reads are not
      permission-gated, so a 403 is never returned for an authenticated caller). The
      spec is therefore accidentally-correct: a 403 absence happens to encode the
      intent. But the encoding is IMPLICIT — an integrator reading only the spec
      cannot tell whether 403-absence means "reads are open by design" or "the spec
      author forgot the 403". The hypothesis (the spec actively signals intent) is
      partially true: the spec does not CONTRADICT the code, but it does not
      explicitly STATE the read-collaborative intent either. The drift facet notes
      "no DOC-NNN follow-up exists for this implicit-design encoding" (F-074.yaml:146).
    evidence:
      - sidecar: feature-flow F-074
        section: "observed_vs_expected.facets[openapi_403_response_absent_implicit_design_intent_under_documented]"
        cite: "F-074.yaml:137-146 (openapi.yaml — no 403 on any GET in this set)"
        note: "403-absence is consistent with the code but does not explicitly document the intent"
    operator_visible_failure: |-
      An integrator generating a client from the spec sees no 403 on the Management
      list GETs and may (a) assume reads are always permitted and skip auth-error
      handling (correct outcome, accidental reasoning), or (b) assume the spec is
      incomplete and add speculative 403-handling that never fires. The ambiguity is
      low-severity (the runtime behaviour is unaffected) but the spec is a missed
      opportunity to document the intent at the contract layer.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: doc-gap-candidate
    use_case_kind: grammar
    coverage: unverified
    test_ref: null
