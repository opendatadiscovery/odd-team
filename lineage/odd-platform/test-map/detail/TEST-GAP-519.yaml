proposed_action: |-
  WebTestClient integration test. (a) User A authenticates; POST /api/search with query 'finance' → A receives session_id S_A. (b) User B authenticates (different principal). (c) User B calls GET /api/search/S_A → assert HTTP 200 with the SearchFacetsData payload of A's session (including A's query 'finance'). (d) User B calls GET /api/search/S_A/facet/OWNERS?page=1&size=100 → assert HTTP 200 with the catalog-wide owner facets. (e) User B calls PUT /api/search/S_A with new query 'engineering' → assert HTTP 200 — B has now MUTATED A's session. (f) User A re-fetches S_A → assert the query is now 'engineering' (B's mutation succeeded — session was hijacked). (g) Test comment 'LOCKS the bearer-token-shaped search-session posture as of 2026-05-19 (TEST-GAP-252 extended to facet endpoints; criticality bumped from LOW to HIGH given additional cross-owner facet-count exposure). When per-user owner-binding is added to search_facets, this test FLIPS to expect 403/404 on all of B's reads + writes.' This is regression-pin + vulnerability-proof — operators reading the test understand the session-hijack surface.
