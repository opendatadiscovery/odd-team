    operator_visible_failure: |-
      Cross-cultural first-impression defect: every non-English visitor's first
      impression of the platform is in English, even when their browser declares a
      supported locale ODD ships. Bounce risk for first-time non-English visitors who
      may not realise the UI is multilingual at all. The feature's value (six locales)
