security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - S2S
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  ingestion_filter_relevance: true
  authorization_consistency:
    verdict: CONSISTENT
    detail: S2S filter consumes the token via plaintext-equality at IngestionDataEntitiesFilter.java:55-58.
      Token rotation gated by COLLECTOR_TOKEN_REGENERATE (MANAGEMENT). The token IS
      the auth credential for ingestion — not authorized BY something, but authorizing
      OF something. BATCH ZB — the DataSource token is the symmetric case
      gated by DATA_SOURCE_TOKEN_REGENERATE (MANAGEMENT); both rotate rows
      in the same `token` table.
  owner_scoping:
    verdict: N/A
    detail: Token is a global infrastructure credential, not data-scoped.
  strengths:
  - Token is opaque random string used over TLS-protected transport (the only sanctioned
    ingress)
  - 40-char alphanumeric ≈ 238 bits of input space — long enough that brute-force
    is infeasible (assuming RNG quality)
  weaknesses:
  - RandomStringUtils.randomAlphanumeric(40) uses ThreadLocalRandom (non-CSPRNG) —
    actual entropy depends on RNG quality, not just length. Should use `.secure().nextAlphanumeric(40)`
    (regenerateCollectorToken.md:security.known_security_gaps.[1] HIGH)
  - Stored in plaintext in TOKEN table — DB compromise carries credentials in the
    clear (regenerateCollectorToken.md:security.known_security_gaps.[3] HIGH)
  - Plaintext returned in response body on rotation — any middleware on the response
    path records the credential (regenerateCollectorToken.md:security.known_security_gaps.[0]
    MEDIUM)
  - No rotation grace period — in-place UPDATE invalidates the old token immediately
    (regenerateCollectorToken.md:security.known_security_gaps.[5] HIGH operational)
  - No audit log — historical 'who rotated when' unrecoverable; updated_by column
    overwrites on each rotation (regenerateCollectorToken.md:security.known_security_gaps.[2]
    HIGH)
  - |-
    **NEW batch Q — UI-side: plaintext token rendered into DOM as text
    node at CollectorItemToken.tsx:34 (no <input type='password'>, no
    Reveal-on-hover, no auto-hide); any browser extension / screenshot
    tool / accessibility reader captures the credential. The warning
    admonition at CollectorItem.tsx:87-98 is the SOLE operational
    mitigation — operator vigilance.** (MEDIUM —
    CollectorsList.md:security.known_security_gaps.[1])
  - |-
    **NEW batch Q — UI-side: token-visibility detection is a literal
    substring-prefix sniff on '******' at CollectorItemToken.tsx:25-27.
    A future backend mask-format change would silently break detection —
    UI would offer Copy button on masked value, leaking ******{last6}-
    style fragments to clipboards.** (MEDIUM —
    CollectorsList.md:security.known_security_gaps.[2])
  - |-
    **NEW batch ZB — DataSource-side: the GET /api/datasources list
    endpoint emits the MASKED token form `"******" + the REAL last 6
    plaintext chars` to EVERY authenticated user (the list has no
    permission gate). The mask is partial real-token material, not a
    placeholder. A 1-line swap at ReactiveDataSourceRepositoryImpl.java:167
    (1-arg TokenDto → TokenDto.visibleToken) would expose full 40-char
    plaintext to every authenticated user with no test to catch it.**
    (MEDIUM — getDataSourceList.md:security.known_security_gaps; probe P-035)
  - |-
    **NEW batch ZB — DataSource-side: a successful data-source delete
    ORPHANS the token row — the `token` table has no `deleted_at`
    column, no GC path; each register/delete cycle leaks one plaintext
    token row (stale-secret-at-rest + unbounded table growth).**
    (MEDIUM — deleteDataSource.md:security.known_security_gaps; probe P-046)
  cross_file_inconsistencies:
  - |-
    **NEW batch ZB** — NONE of substance. The DataSource-side token
    findings (getDataSourceList / registerDataSource /
    regenerateDataSourceToken / deleteDataSource) are CONSISTENT with
    the Collector-side findings — same `token` table, same
    TokenGeneratorImpl, same ReactiveTokenRepositoryImpl, same
    plaintext-everywhere chain, same in-place destructive rotation.
    The DataSource-side sidecars RESOLVE one ambiguity the Collector
    class sidecar left open: the redaction is API-side (TokenMapper.mapValue
    gated by TokenDto.showToken), NOT UI-side.
  contributing_files:
  - regenerateCollectorToken.md
  - CollectorsList.md
  - getDataSourceList.md
  - registerDataSource.md
  - regenerateDataSourceToken.md
  - deleteDataSource.md
  evidence:
  - regenerateCollectorToken.md:security.known_security_gaps.[1,3,0,5,2]
  - regenerateCollectorToken.md:concepts.invariants.[1-3]
  - CollectorsList.md:security.known_security_gaps.[1,2] (NEW batch Q UI-tier evidence)
  - getDataSourceList.md:security.data_exposure + security.known_security_gaps + implicit_adrs.[0] (NEW batch ZB — API-side masking RESOLVED; probe P-035)
  - registerDataSource.md:security.data_exposure + implicit_adrs.[0,1,2] (NEW batch ZB — plaintext-on-create; probe P-040)
  - regenerateDataSourceToken.md:concepts.invariants.[2] + security.known_security_gaps (NEW batch ZB — plaintext-at-rest, RandomStringUtils, no-audit-log)
  - deleteDataSource.md:security.known_security_gaps (NEW batch ZB — orphan plaintext token; probe P-046)
performance_aggregate:
  overall: HIGH
  hot_paths:
  - Token validation on every /ingestion/entities POST — IngestionDataEntitiesFilter
    does literal `.equals(...)` against in-DB token value (regenerateCollectorToken.md:concepts.invariants.[3])
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: One token per collector; no bulk-token API. The expensive throughput surface
      is /ingestion/entities itself, not token operations.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Token validation is a single DB SELECT per ingestion request. No locking.
      Stateless across replicas.
  strengths:
  - Plaintext-equality check is O(1) — bounded cost per ingestion request
  weaknesses:
  - 'Per-ingestion-request DB hit for token validation — no in-memory cache observed
    (likely intentional given the rotation contract: in-place UPDATE invalidates immediately)'
  cross_file_inconsistencies: []
  contributing_files:
  - regenerateCollectorToken.md
  evidence:
  - regenerateCollectorToken.md:concepts.invariants.[3]
notes: 'Surface as canonicalisation candidate. main-concepts.md names S2S auth
  mode and the Ingestion authentication filter, but does not name "Collector
  Token" or "shared-secret rotation" as a first-class concept. The
  operational mechanics (in-place UPDATE, plaintext-in-response, no grace
  window) live entirely in the code; a `Token Rotation` section under
  enable-security would close the loop.

  **NEW batch Q** — the UI-tier hazards (plaintext-DOM rendering + fragile
  substring-sniff) compound the backend-side weaknesses. See new sibling
  invariant `plaintext-token-rendered-into-dom-fragile-substring-prefix-sniff-masking`
  for the full UI-tier analysis. Every link in the token-handling chain
  is fragile.

  **NEW batch ZB** — the DataSource-side method sidecars confirm the
  DataSource token IS A Collector Token (both `data_source.token_id` and
  `collector.token_id` FK the same `token` table). The four
  DataSourceController method sidecars close the DataSource side of the
  same plaintext-everywhere chain: the list endpoint masks API-side
  (getDataSourceList), the create + rotate endpoints return plaintext
  API-side (registerDataSource / regenerateDataSourceToken), and the
  delete endpoint orphans the token row (deleteDataSource). The chain is
  symmetric for Collector and DataSource; a fix (SecureRandom, hashing,
  rotation grace period, orphan-token GC, plaintext-in-response
  hardening) applies to both token-bearing entities.'
