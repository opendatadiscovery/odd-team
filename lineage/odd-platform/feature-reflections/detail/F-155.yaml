      config and NO rehype-sanitize allowlist applied in Markdown.tsx (lines 1-127). The query body is
      stored verbatim (text NOT NULL, no sanitisation at the controller or service layer). So a query
      example whose definition or query contains Markdown/HTML payload (a javascript: link, an
      <img onerror=...>, raw <script> where rehype-raw passes it) is RENDERED, not displayed verbatim. This
      term's Query-Examples tab is one of the two render sites of the F-004 4th surface (the other being
      the catalog list + details page).
