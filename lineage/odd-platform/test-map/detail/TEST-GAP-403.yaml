proposed_action: |-
  Add `delete_concurrentBindingAddition_createsOrphanBindingPermissionLeak`
  in `PolicyServiceImplConcurrencyTest`. Two concurrent flows — (A) `policyService.delete(id)`
  reaches line 89 (isAttached=false), pauses; (B) `roleService.create({policies: [id]})`
  completes; (A) resumes to line 93, soft-deletes the now-bound policy. Assert the
  bound role STILL grants the (soft-deleted) policy's permissions via `getCurrentUserPolicies`.
  Pin the gap until REFACTOR-230 ships @ReactiveTransactional + SELECT FOR UPDATE.
