proposed_action: |-
  Add `OwnerUpdateRoleSemanticsTest` with two test methods: (a) seed owner with roles [ROLE_A, ROLE_B]; PUT /api/owners/{id} with body `{name: "newName"}` (omitting roles field); assert role list is now empty; pin the destructive-default behaviour; (b) PUT /api/owners/{id} with body `{name: "newName", roles: []}` (explicit empty); assert same result. Both pin the current UX hazard. The test surfaces the destructive surface to operators considering the API; future fix introducing IGNORE-IF-OMITTED semantics will break this test, forcing explicit re-authoring.
