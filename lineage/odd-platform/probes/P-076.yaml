realism_caveats: |
  Scenario A asserts only the rename — it does NOT assert the description
  survived, because react-hook-form pre-fills the Description input from the
  `dataSource` prop, so a name-only edit DOES re-submit the pre-filled
  description and it survives; the data-loss bite is scenario B (operator
  actively clears the field) and the latent case where the description was
  never pre-filled. If a future maintainer wants to also pin "description NOT
  pre-filled" they must seed a data source whose description column is already
  null and confirm the modal renders an empty Description input. The probe runs
  DISABLED-auth so it does not exercise DATA_SOURCE_UPDATE; that gate is the
  updateDataSource backend sidecar's P-044. If scenario B's assertion fails
  (description retained), re-check DataSourceMapper.applyToPojo null-handling —
  a global nullValuePropertyMappingStrategy=IGNORE would convert the PUT from
  REPLACE to MERGE and invalidate the hypothesis.
