name: <AppErrorPage> as Error Render Surface (Suppressed Toasts on Large Loaders)
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
  - P-01
  - P-05
description: |-
  **NEW INVARIANT, batch 2026-05-19J**. The project's pattern for handling "expected
  failure" loads (large entity payloads — DataEntityDetails, TermDetails, Policy,
  DataEntityAlertList, DatasetStructure, Alerts, Activity, PolicyList,
  DataEntityLineage, DataQualityTest) is **selective error-toast suppression** via
  `switchOffErrorMessage: true`. The flag (14 occurrences across 10 thunk files,
  per fetchDataEntityDetails.md grep counts) tells `handleResponseAsyncThunk` to
  SKIP the `showServerErrorToast` call on the error path but still persist the
  `AppError` payload into `loader.errors[<actionType>]`. **Full-page error surface**:
  the affected components render `<AppErrorPage showError={true}
  error={loader.errors[...]} />` as a full-page banner (e.g. DataEntityDetails.tsx:116-119;
  HierarchyLineage.tsx:129-133). **The decision shape**: large entity loads' failures
  are MORE prominent than a transient toast (they take over the full content area),
  but the user retains the surrounding UI shell (header, navigation). A 404 / 403 /
  500 from a detail page is rendered identically. **Generic error fallback**:
  `AppError.message` falls back to literal `'An error occurred'` when the backend
  returns a non-JSON body or a body without a `message` field
  (`lib/errorHandling.tsx:12-26`). A 502/504 from the platform process or an
  intervening proxy with an HTML error body becomes the same opaque banner as a
  real 404 — operators have no way to tell from the UI whether the entity doesn't
  exist or the backend is down.

  ## REFINED — batch ZJ (2026-05-26): the displayed-field contract is 2-of-4, not 4-of-4

  Batch ZJ adds the AppErrorPage.tsx primary-source sidecar
  (odd-platform__ts__components_shared_elements_AppErrorPage__ui-shell-widget__AppErrorPage.md).
  The 40-line component file provides the AUTHORITATIVE rendering
  contract:

  **AppErrorPage renders ONLY `error?.status` (numeric HTTP code,
  AppErrorPage.tsx:25) and `error?.statusText` (RFC 7231 reason
  phrase, AppErrorPage.tsx:29).** The remaining two ErrorState
  fields — `error.url` (the failing API URL) and `error.message`
  (the backend's body.message text) — are accepted by the type
  system but NEVER rendered to the DOM. A grep across
  AppErrorPage/ for `error.message|error.url|error?.message|error?.url`
  returns ZERO matches.

  **This SUPERSEDES the prior batch 2026-05-19J claim** that the
  banner displays all 4 fields (`error.status`, `error.statusText`,
  `error.url`, `error.message`). That claim was inferred from the
  ErrorState type shape; the actual JSX accesses only 2 of the 4
  fields. The earlier batch's `notes` recommendation to 'strip
  AppError.url from the banner in production builds' is therefore
  ALREADY satisfied by the component (it never rendered the URL
  to begin with). LSN-018 supersede ref.

  **The `error.message` IS surfaced in a SEPARATE channel** — the
  `react-hot-toast` 6-second toast emitted by `showServerErrorToast`
  (`errorHandling.tsx:48-68`) carries the message. The asymmetry
  is the design: STATUS code stays on page indefinitely, MESSAGE
  flashes for 6 seconds. (But under `switchOffErrorMessage: true`
  the toast is also suppressed; the message effectively goes
  nowhere.)

  **The information-disclosure boundary IS the load-bearing
  property of this widget**, but is UNDOCUMENTED in the code (no
  JSDoc, no inline comment defends the omission of `url` and
  `message`). A future "improvement" PR adding
  `<Typography>{error.url}</Typography>` (to help operators
  identify the failing endpoint) or `<Typography>{error.message}</Typography>`
  (to surface the backend hint) would silently invert the boundary
  — backend response bodies (which may carry stack-trace fragments,
  SQL exception text, or echoed PII depending on the backend's
  error formatter) would land in the DOM. No test exists to catch
  this regression. Probe P-176 emitted (batch ZJ) to runtime-verify
  the 2-of-4 contract.

  **AppErrorPage is NOT a React error boundary AND NOT a catch-all
  route**. The widget is a CONTROLLED render helper rendered by 23
  caller files via `<AppErrorPage showError={isXxxNotFetched}
  error={xxxFetchingError}>`. It catches NO synchronous JS render
  errors. It is NOT mounted on `path='*'` in App.tsx. Captured
  separately as the `no-react-error-boundary-no-catch-all-route-blank-page-root-cause`
  invariant (batch ZJ).

  **Error-payload reflection (REVISED)**: `AppError.url` IS still
  populated upstream (`errorHandling.tsx:23` from `response?.url`)
  but the widget chooses NOT to render it. The defence is
  implementation-level, not type-level. The same `url` is exposed
  to the network observer (DevTools Network tab) and to the toast
  channel (briefly), but NOT to the persistent on-page error
  display.
