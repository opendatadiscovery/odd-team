proposed_action: |-
  Add `PostDataSetStatsListUnauthenticatedCrossDatasetCrossOwnerWriteMatrixTest`. Testcontainers integration test:

  1. **Setup**: 2 datasets (D-A owned by ownerA; D-B owned by ownerB), each with 3 fields.
  2. **Anonymous unauthenticated POST** with payload `{items: [{datasetOddrn: D-A.oddrn, fields: {D-A.field1.oddrn: {boolean_stats: {true_count: 100}}}}]}` → assert 201 + DB `dataset_field.stats` for D-A.field1 is updated. PINS unauthenticated reach.
  3. **Cross-dataset POST** with mismatched parent: `{items: [{datasetOddrn: D-A.oddrn, fields: {D-B.field1.oddrn: {boolean_stats: {true_count: 100}}}}]}` → assert 201 + DB `dataset_field.stats` for D-B.field1 IS updated despite D-A in parent. PINS the cross-dataset write.
  4. **Cross-owner POST**: as caller authenticated as ownerA (when auth is enabled), post stats targeting D-B's fields → assert 201 + DB write succeeds. PINS the cross-owner write.
  5. **Auth-matrix** (each combination): `auth.type ∈ {DISABLED, OAUTH2, LDAP, LOGIN_FORM}` × `auth.ingestion.filter.enabled ∈ {true, false}` → assert 201 across ALL 8 permutations.

  Pair with REFACTOR-NNN candidates: (a) extend filter path to `/ingestion/entities/**` OR add a sister filter for stats; (b) add cross-check between datasetOddrn parent and field ODDRN parent at service tier; (c) add owner-scoping or principal-binding at service tier.

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP names the postDataSetStatsList unauthenticated reach or cross-dataset write. The sibling TEST-GAP-398 covers DataEntityStatisticsTest boundary conditions (existence/activity) at LOW priority — this entry surfaces the CRITICAL security dimension that 398 does not. STRENGTHENS F-008 by extending the unauthenticated-reach finding to a second IngestionController sub-path. STRENGTHENS the `two-ingestion-filters-asymmetric-auth` invariant by adding the second test surface (this endpoint is explicitly named in the invariant's evidence list).
