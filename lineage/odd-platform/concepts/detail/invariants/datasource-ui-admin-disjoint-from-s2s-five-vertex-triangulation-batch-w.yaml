mitigations_unimplemented:
  - |-
    Document the 5-vertex picture on the operator-facing
    /features/management page — explicitly distinguish 'collector-owned
    fields (name + description; overwritten on next startup)' from
    'operator-owned fields (connection_url, active, etc.; preserved
    across collector restarts)'. Add admonition admonishing operators
    that UI edits to name/description are silently overwritten by
    the next collector startup.
  - |-
    Add an /developer-guides/api-reference/data-sources sub-page
    documenting the 5 endpoints, the 4 DATA_SOURCE_* permissions,
    the cascade-delete guard, the implicit namespace creation, the
    destructive token rotation, and the silent UI-edit overwrite.
    Symmetric with the existing 9 per-feature sub-pages on the API
    reference hub.
  - |-
    Add a service-tier permission check at DataSourceServiceImpl.java:56-60
    (the namespaceService.getOrCreate side-door) — split into
    getByName (no permission needed) + create (requires NAMESPACE_CREATE).
    Same architectural fix as the TermController side-door from batch U.
  - |-
    Add @ReactiveTransactional to DataSourceServiceImpl.regenerateDataSourceToken
    (line 98) — makes the in-memory rotation + DB write atomic;
    failure mode becomes 500 with old token still valid (consistent
    with the surrounding 3 methods).
  - |-
    Align openapi.yaml (declared 201) with controller actual (returns
    200) for registerDataSource + updateDataSource. Codebase-wide
    audit candidate (cross-link to openapi-200-vs-201-status-code-drift-codebase-wide
    canonicalisation candidate). EITHER fix spec to 200 (silent
    contract change for SDK consumers, aligns to test reality) OR
    fix code to 201 (breaks every existing test that asserts isOk()).
  - |-
    Add @ActivityLog to the 4 DataSourceServiceImpl mutating methods
    AND the analogous DataSourceIngestionServiceImpl. Both paths
    are currently silent on Activity Feed. Requires the
    ActivityEventTypeDto enum to gain DATA_SOURCE_CREATED /
    DATA_SOURCE_UPDATED / DATA_SOURCE_DELETED / DATA_SOURCE_TOKEN_REGENERATED
    values (cross-link to f-006-audit-silence-enum-rooted-deeper-than-schema-rooted).
  - |-
    Build-time scanner: enumerate every service method that mutates
    a data_source row AND verify it emits an Activity Event of the
    expected type. Same scanner shape as the audit-log-presence-asymmetry
    cross-pillar audit follow-up.
  - |-
    Regression test for the silent-overwrite class: fixture that
    sequences UI-edit-via-controller → collector-ingest-via-S2S →
    DB read, asserts the asymmetric merge semantics. Pins both
    behaviours so neither side can be refactored without surfacing
    the contract change.
notes: |-
  This invariant captures the FIRST end-to-end 5-vertex triangulation
  of the DataSource architectural picture. Previous batches established
  the WHAT and WHERE of the disjunction (batches P + R + S); this
  batch (W) adds the COUNTERFACTUAL vertex via the UI admin controller
  AND the explicit framing of the architectural intent (collector-as-tenant
  vs operator-as-admin).

  The picture's load-bearing observations:
    (a) The two paths mutate the SAME data_source row but apply
        DIFFERENT merge semantics — silent overwrite class.
    (b) The architectural disjunction is DELIBERATE (different service
        classes, different mappers, different field-set narrowing) —
        the asymmetry is not accidental.
    (c) The disjunction has consequences operators don't know about
        — undocumented on every relevant doc page.
    (d) The disjunction extends to FOUR cross-cutting concerns: status
        codes, permissions, audit, transactionality.

  Cross-cutting connections:
    - STRENGTHENS the existing master upsert-by-oddrn-partial-merge-collector-driven-only-name-description
      (the S2S half of the asymmetry); this invariant adds the UI
      half + the architectural framing
    - STRENGTHENS the existing master namespace-inherited-from-collector-not-payload-collector-scoped-tenancy
      (the S2S half); this invariant adds the UI counterpart
    - STRENGTHENS the existing master openapi-200-vs-201-status-code-drift
      (DataSource is now a 7th controller exhibiting the same drift)
    - STRENGTHENS the existing master namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths
      (DataSource is now a 5th sister service with getOrCreate
      side-door pattern; the cross-pillar pattern now spans Term +
      DataSource + Owner + Tag + Collector + DataEntityGroup as
      enumeration sites)
    - STRENGTHENS the existing master read-collaborative-cross-owner-enumeration
      (DataSourceController.getDataSourceList joins the catalogue
      of 24+ surfaces with no SecurityRule)
    - STRENGTHENS the existing master audit-log-presence-asymmetry-2-tier-audit-story
      (data_source mutations are Tier-2 unaudited on BOTH paths)
    - Pairs with collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
      (the regenerateDataSourceToken endpoint surfaces the SAME
      plaintext-everywhere pattern as regenerateCollectorToken — the
      DataSource token IS A COLLECTOR TOKEN per the schema; this is
      the same end-to-end chain)

  Three DOC-NNN candidates flow:
    (a) /features/management Datasources tab — document the 5
        operator-facing nuances (collector-overwrite-class, implicit
        namespace creation, destructive token rotation, RBAC GET-gap,
        Activity Feed silence)
    (b) /developer-guides/api-reference/data-sources NEW page — the
