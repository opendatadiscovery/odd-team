realism_caveats: |
  - If size=null is rejected by Spring at the binding step, STRESS_A1 resolves to
    STATIC-INFERRED RESOLVED (Spring binding enforces required) and the doc-drift
    finding flips polarity (the Java nullable binding is dead code).
  - The size=-1 outcome distinguishes whether Postgres's error percolates cleanly
    to a 4xx (Spring sometimes maps DataIntegrityViolation to 400) or a generic 500.
