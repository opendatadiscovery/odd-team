gap_id: TEST-GAP-808
category: missing-security
criticality: MEDIUM
node_ids:
  - "odd-platform java notification.sender class:SlackNotificationSender"
pillars_affected: [P-07, P-09]
surfaced_by:
  - "SlackNotificationSender.md:bugs_limitations_corner_cases.[1] MEDIUM (No URI scheme allowlist / no SSRF guard at sender layer)"
  - "SlackNotificationSender.md:security.known_security_gaps.[1] MEDIUM (No URI scheme allowlist on the webhook URI)"
behaviour: |-
  **MEDIUM — Slack webhook URI accepts ANY syntactically-valid URI; no SSRF defence at sender layer.** The `slackWebhookUrl` is bound at `NotificationConfiguration.java:77` as raw `java.net.URI` via `@Value`, with only an empty-string check at L81-83. `SlackNotificationSender` accepts the URI verbatim and invokes `HttpRequest.newBuilder().uri(slackWebhookUrl)` at line 44 — no scheme allowlist (operator can configure `file:` or `gopher:` and only the JDK HttpClient rejection at send-time prevents the request), no host allowlist (operator can configure `http://169.254.169.254/...` for AWS instance-metadata, `http://localhost:NNNN/...` for loopback services, or any RFC1918 address), no certificate-pinning to `hooks.slack.com`.

  **Sister to TEST-GAP-807** at the same root cause (`NotificationConfiguration` validates only `.isEmpty()`). The two together cover the F-009 outbound-URL surface.

  **Distinct Slack-specific risk**: an attacker with config-modification capability who knows the platform's network neighbourhood can use the Slack notification path as an SSRF vector targeting AWS IMDS or internal services. Unlike the Webhook channel where the operator is "trusted to set a URL pointing at their own receiver", the Slack channel is conventionally pointed at `hooks.slack.com` — an attacker substituting an internal URL is silently unmasked at boot (the Slack channel's behavioural contract assumes "URL = Slack workspace webhook", the URL substitution attack subverts this assumption).

  **No certificate-pinning to `hooks.slack.com`**: combined with the no-allowlist gap, a man-in-the-middle attacker with TLS-intercept capability could intercept the alert payload + the webhook URL (which is itself a bearer credential).

  **Test gap shape**: regression-pin asserting boot-time acceptance of RFC1918 / loopback / `file://` URIs at `notifications.receivers.slack.url`. PINS the current vulnerability; pairs with REFACTOR-NNN applying the same allowlist as TEST-GAP-807's fix.
