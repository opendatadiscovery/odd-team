name: Notification Recipient
canonical_in_docs: false
canonical_candidate: true
description: 'Downstream consumer of ODD''s outbound alert notifications: a Slack
  channel reachable by the configured incoming webhook URL, a generic webhook endpoint,
  or an SMTP email inbox. Receives the full `AlertNotificationMessage` payload (alertType,
  eventType, dataEntity.{name, dataSourceName, namespaceName, owners[]}, downstream
  lineage entities to configured depth, alertChunks). Distinct from the platform''s
  internal Alert audience (UI end-users browsing alerts) and from the AlertManager
  webhook caller (which is an INBOUND audience). main-concepts.md does not name this
  — Notifications is itself not canonical.'
axes_present:
- config_prefixes
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties
contributors:
- 'NotificationsProperties.audiences: alert recipient (Slack channel / webhook endpoint
  / email inbox)'
evidence:
- NotificationsProperties.md:concepts.audiences
- NotificationsProperties.md:security.data_exposure (full alert payload to any party
  with access to the configured Slack channel / webhook URL / email inbox)
notes: 'Surface as canonicalisation candidate alongside the Notifications

  concept. The audience includes three sub-types (Slack channel, webhook

  endpoint, email inbox) — recommended canonicalisation either keeps

  this as a single audience entry with three sub-shapes or splits into

  three per-channel audiences. The catalog currently uses the single-entry

  approach because the configuration model treats them as parallel

  receivers (`notifications.receivers.*`).

  '
