    Fix surface 1 (preferred) — parameterise the STATUS filter
    at the three repository methods + add a UI filter affordance
    + add @Param on the controller methods. Closes the drift at
    the source; surfaces resolved alerts on the global page.
  - |-
    Fix surface 2 (minimum-viable) — update the live doc page at
    /features/active-platform-features/alerting with the 'Open
    only' caveat. Loses the operator who never reads the docs,
    but stops the misconception class from propagating.
