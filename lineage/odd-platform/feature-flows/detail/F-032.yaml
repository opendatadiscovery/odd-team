terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Mounting /data-quality renders the catalog-wide Data Quality dashboard:
    a sticky two-pane shell, a five-dimension two-set filter sidebar, three
    DonutChart rings (Table Health = healthy/warning/error table counts;
    Test Results Breakdown = per-run-status test-run counts, up to 6 slices;
    Monitored Tables = monitored/not-monitored table counts), two status
    legends, and one TestCategoryResults card per backend test category
    (bounded at 6). The data behind every visual block comes from ONE
    aggregate fetch GET /api/dataqatests/runs — recorded as a secondary
    external-call side effect on the chain. NO db-write, NO activity-emit:
    the dashboard is a pure read surface (the filter selections write only
    the in-memory jotai store + the browser URL query string).
  evidence: |-
    DataQuality.tsx:7-18 (the page shell) + DataQualityContent.tsx:79-145
    (the three rings + legends + category cards) + TestCategoryResults.tsx
    :27-45 (the per-category leaf row) + DataQualityContent.tsx:24 →
    dataQuality.ts:79 (the single GET /api/dataqatests/runs) +
    DataQualityFilters.tsx:46-54 (the URL query-string write).
  cardinality_per_call: |-
    1 page-render per /data-quality open: 3 DonutChart rings + N
    TestCategoryResults cards (N <= 6) + 2 legends. Plus 1 external-call
    (GET /api/dataqatests/runs) on a plain open, 2 on a URL-deeplinked open.
amplification_factor: unresolved (1 partially-determined)
amplification_factor_provenance: |-
  STATIC-INFERRED, partially-determined. Per-hop multiplicity along the chain:
  hop-1 DataQuality mount = 1 (no useEffect, no dispatch — LSN-017 check
  clean); hop-2a/2b/3-leaf = 1; hop-3 DataQualityContent fetch =
  1 on a PLAIN /data-quality open, 2 on a URL-deeplinked open (the mount
  useEffect in DataQualityFilters sets formFiltersAtom from searchParams
  AFTER the first render, re-firing the derived filtersAtom and a second
  GET /api/dataqatests/runs). The product is therefore 1 for the common
  plain-open path and 2 for the deeplink-open path. Probe P-101 pins the
  exact per-open fetch count and whether React StrictMode double-mount adds
  a further multiplier in dev. The hop-4 backend multiplicity (1 dashboard
  GET fans out to 3 DB queries server-side) is recorded on the chain but is
  a server-side fan-out, not a user-action amplification. Recorded as
  `unresolved (1 partially-determined)` per Rule 3 rather than guessing a
  single number — the deeplink-open double-fetch is a real second-order
  amplification awaiting P-101.
observed_vs_expected:
  facets:
  - facet: |-
      The /data-quality route is mounted with NO client-side permission guard
      — any authenticated user opens the catalog-wide aggregate quality view
    observed: |-
      App.tsx:73 mounts the route as a bare `<Route path={dataQualityPath()}
      element={<DataQuality />} />`. The sibling /lookup-tables route directly
      below (App.tsx:75-88) IS wrapped in WithPermissionsProvider with explicit
      allowedPermissions (LOOKUP_TABLE_CREATE / UPDATE / DELETE). The
      "Data Quality" top-bar tab is rendered unconditionally too —
      ToolbarTabs.tsx:45-49 has no permission check and no conditional render.
      Any authenticated user — including a minimum-privilege user with zero
      Permissions and zero ownership associations — renders the FULL
      /data-quality page and sees the catalog-wide aggregate health of every
      dataset (table-health counts, monitored/unmonitored counts, per-category
      test-run breakdown). There is NO comment, exception, or convention in
      App.tsx or DataQuality.tsx defending the absence of a guard — it is an
      unexplained absence. Whether the BACKEND dashboard endpoint
      GET /api/dataqatests/runs also lacks a gate is the open half — the
      DataQualityRunsController node is not yet enriched.
    expected: |-
      Either (a) the route is intentionally read-collaborative (consistent
      with ODD's documented catalog posture — the DataQualityController
      sidecar records the same silence for the per-dataset DQ reads) and the
      live dashboard doc page DISCLOSES "visible to any authenticated user";
      OR (b) the dashboard is gated by a permission like the /lookup-tables
      sibling. The live dashboard.md and data-quality.md pages (WebFetched
      2026-05-22, both status 200) make NO statement about access control —
      the doc-side silence is the actionable item regardless of which posture
      is intended.
    drift_class: ungated_dashboard_route_no_permission_guard
    provenance: |-
      STATIC-INFERRED — primary-source in DataQuality.tsx sidecar (batch ZC)
      bugs_limitations_corner_cases[0] + security.known_security_gaps[0] +
      stress_findings.auth_gates, and DataQualityContent.tsx sidecar
      implicit_adrs[1] + security.authorization_assertions. Evidence:
      App.tsx:73 (bare route) vs App.tsx:75-88 (the gated sibling) +
      ToolbarTabs.tsx:45-49 (unconditional tab) + WebFetch dashboard.md +
      data-quality.md 2026-05-22 (both silent on access control). The
      BACKEND half is PROBE-NEEDED — probe P-090. Severity: MEDIUM
      (operator-facing surprise; the actionable fix is the doc-gap).
  - facet: |-
      Under auth.type=DISABLED the dashboard and its catalog-wide DQ
      aggregate are anonymously reachable
    observed: |-
      Under auth.type=DISABLED the SPA shell renders with no authentication
      and no principal; the /data-quality route — already ungated at the
      React layer (App.tsx:73) — is reachable by any anonymous caller who can
      reach the platform. The catalog-wide aggregate quality data
      (per-category run-status counts + tables-health counts +
      monitored-tables counts for every dataset) is exposed to anonymous
      callers. This is the DISABLED-mode anonymous-reach pattern the
      platform-wide meta-finding catalogues (DOC-GAP-082).
    expected: |-
      Either (a) the dashboard endpoint is gated even under DISABLED for the
      catalog-wide aggregate; OR (b) the enable-security doc page warns that
      auth.type=DISABLED leaves the catalog-wide quality dashboard
      anonymously reachable on a network-exposed deployment. DISABLED is
      doc-marked dev-only; the live dashboard doc is silent.
    drift_class: disabled_mode_anonymous_reach
    provenance: |-
      STATIC-INFERRED — DataQualityContent.tsx sidecar (batch ZC)
      security.data_exposure[1] ("Same aggregate → anonymous callers under
      auth.type=DISABLED") + DataQuality.tsx sidecar security.auth_mode_relevance.
      Evidence: App.tsx:73 (no permission wrapper) + the global DISABLED-mode
      auth bypass (DisabledAuthSecurityConfiguration cross-sidecar reference).
      Severity: MEDIUM under a misconfigured production DISABLED deployment.
      Member of the platform-wide DISABLED-bypass cluster — cross-link to
      DOC-GAP-082 + REFACTOR-185.
  - facet: |-
      A run-status outside the DataEntityRunStatus enum throws an uncaught
      TypeError and blanks the WHOLE dashboard
    observed: |-
      DataQualityContent.tsx:47-48 builds the Test Results Breakdown slice
      colours with `palette.runStatus[status].color ??
      palette.dataQualityDashboard.unknown`. palette.runStatus is a
      `Record<DataEntityRunStatus, ItemColors>` (interfaces.ts:55) — keyed by
      exactly the SIX enum values SUCCESS/FAILED/SKIPPED/BROKEN/ABORTED/UNKNOWN.
      If `status` is any other string — a 7th backend enum value not yet in
      the generated frontend types, a stale generated-sources build, or
      malformed data — `palette.runStatus[status]` is `undefined` and `.color`
      throws a TypeError BEFORE the `??` is evaluated. The `??` was written to
      guard a missing `.color` on a PRESENT entry, not a missing entry — so
      it does not save this case. The error propagates out of the useMemo and
      crashes the whole component tree: the operator sees a blank dashboard,
      not a degraded one. The same risk does NOT apply to the Table Health or
      Monitored Tables rings (they read fixed palette keys, not
      status-indexed lookups).
    expected: |-
      Either (a) the lookup is `palette.runStatus[status]?.color ??
      fallback` (optional chaining on the ENTRY, not the property), so an
      out-of-enum status degrades to the unknown colour; OR (b) the component
      filters `testResults` to known DataEntityRunStatus values before the
      colour lookup; OR (c) an ErrorBoundary around the dashboard so a single
      bad status does not blank the page. None exists — and nothing in the
      test suite or the type system flags it before runtime.
    drift_class: out_of_enum_status_blanks_whole_dashboard
    provenance: |-
      STATIC-INFERRED, statically certain from the type definition —
      primary-source in DataQualityContent.tsx sidecar (batch ZC)
      bugs_limitations_corner_cases[0] + concepts.invariants[4] +
      stress_findings.tunables. Evidence: DataQualityContent.tsx:47-48 (the
      unsafe indexed access) + interfaces.ts:55 (RunStatus =
      Record<DataEntityRunStatus, ItemColors>) + components.yaml:1407-1415
      (the 6-value enum). Severity: HIGH — a backend enum addition (or a
      malformed status) takes the entire catalog-wide dashboard down with the
      build green. The corresponding uncovered test behaviour is the
      integration cell's highest-criticality entry.
  - facet: |-
      The "Title" filter binds to OWNERSHIP.TITLE_ID (ownership role), not to
      dataset name — LSN-020 input-name-vs-implementation drift
    observed: |-
      The filter sidebar's "Title" sub-filter carries the bare i18n label
      `t('Title')` (TitleFilter.tsx:29). Traced through filtersAtom →
      getDataQualityTestsRuns → DataQualityRunsServiceImpl →
      DataQualityTestFiltersMapper → ReactiveDataQualityRunsRepositoryImpl
      .getConditionsForFilters, `titleIds` binds to `OWNERSHIP.TITLE_ID.in
      (titleIds)` (ReactiveDataQualityRunsRepositoryImpl.java:301, 309).
      OWNERSHIP.TITLE_ID references the TITLE table — the ownership ROLE
      assigned alongside an owner (e.g. "Data Steward", "Owner"), a concept
      distinct from a dataset's name. An operator who selects a value in the
      "Title" filter expecting to narrow the dashboard to a named dataset
      narrows it instead to datasets where someone holds that ownership title.
      Partial mitigation: the "Title" autocomplete is populated by
      useGetTitleList, which lists ownership titles, so a careful operator who
      opens the dropdown sees role names and can infer the meaning — but the
      bare label alone misleads. SECOND-ORDER: when BOTH Owner and Title are
      selected the SQL puts them in ONE OWNERSHIP join joined by AND
      (ReactiveDataQualityRunsRepositoryImpl.java:297-302) — the result is
      entities where THAT owner holds THAT title, which can be a surprising
      empty dashboard.
    expected: |-
      Either (a) a clearer label — "Ownership Title" / "Ownership Role" —
      that names the bound concept; OR (b) if the intent were genuinely to
      filter by dataset name, the entity name column (DATA_ENTITY's
      internal/external name) is the available-but-unused candidate; OR
      (c) the live dashboard doc explains what "Title" filters by. The live
      dashboard.md page (WebFetched 2026-05-22, status 200) lists "Title" as
      one of the five filter dimensions but explicitly does NOT explain what
      it filters by.
    drift_class: input_name_vs_implementation_title_filter
    provenance: |-
      STATIC-INFERRED with strong SQL evidence — primary-source in
      DataQualityFilters.tsx sidecar (batch ZC) bugs_limitations_corner_cases[0]
      + docs_link_semantic.doc_drift_findings[0] + stress_findings.request_inputs
      (the Title filter Q3 DRIFT_INPUT_NAME_VS_IMPLEMENTATION). Evidence:
      TitleFilter.tsx:29 (the label) + DataQualityFilters.tsx:73,88 (the
      titleIds/deTitleIds keys) + ReactiveDataQualityRunsRepositoryImpl.java
      :296-311 (the OWNERSHIP.TITLE_ID bind). Pinned by probe P-110.
      Severity: HIGH — the same shape as LSN-020 (Activity Feed userIds →
      OWNER_ID); the named input operates on a different entity than its name
      promises, with no UI qualifier.
  - facet: |-
      The "Namespace" filter silently widens the match to datasource-inherited
      namespaces
    observed: |-
      The "Namespace" sub-filter's `namespaceIds` / `deNamespaceIds` bind at
      the SQL layer to `NAMESPACE.ID.in(namespaceIds)` matched against
      `DATA_ENTITY.NAMESPACE_ID` OR `DATA_SOURCE.NAMESPACE_ID`
      (ReactiveDataQualityRunsRepositoryImpl.java:288-293, the
      `.or(NAMESPACE.ID.eq(DATA_SOURCE.NAMESPACE_ID))` clause). A namespace
      selected in the filter therefore matches both entities directly
      assigned to it AND entities whose datasource carries it — a wider
      result set than the bare label "Namespace" implies. An operator
      filtering by namespace X sees MORE entities in the rings than "entities
      in namespace X": every entity whose datasource is in namespace X is
      included even if the entity itself has no namespace or a different one.
    expected: |-
      Either (a) the SQL matches only the entity's own NAMESPACE_ID; OR
      (b) the live dashboard doc discloses that the Namespace filter also
      matches datasource-inherited namespaces. The live dashboard.md page
      does not state the widening.
    drift_class: namespace_filter_datasource_inheritance_widening
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityFilters.tsx sidecar
      (batch ZC) docs_link_semantic.doc_drift_findings[1] +
      stress_findings.request_inputs (the Namespace filter Q3
      TRANSLATES_SILENTLY / DRIFT_INPUT_NAME_VS_IMPLEMENTATION). Evidence:
      ReactiveDataQualityRunsRepositoryImpl.java:288-293. Severity: MEDIUM —
      over-inclusion, not mis-binding (the strict-match column DATA_ENTITY
      .NAMESPACE_ID IS in the OR; the drift is the added datasource clause).
  - facet: |-
      The Test Results Breakdown ring is documented as 3 statuses; the code
      renders up to 6
    observed: |-
      The live dashboard.md page (WebFetched 2026-05-22, status 200)
      describes the Test Results Breakdown ring as "the count of test runs
      broken down by status (passed / failed / skipped)" — 3 statuses. The
      component builds the breakdown slices dynamically from
      DataEntityRunStatus, which has SIX values — SUCCESS, FAILED, SKIPPED,
      BROKEN, ABORTED, UNKNOWN (components.yaml:1407-1415; iterated at
      DataQualityContent.tsx:43-51, 83) — and the legend
      (DataQualityContent.tsx:83-89) renders all six. The leaf
      TestCategoryResults card likewise renders a tile for every one of the
      six statuses (TestCategoryResults.tsx:21). An operator who sees a
      BROKEN or ABORTED slice (in the ring) or tile (in a category card) has
      no doc explaining it.
    expected: |-
      The live dashboard doc names all six DataEntityRunStatus values, or
      states the breakdown is "by run status" without an incomplete
      three-status enumeration.
    drift_class: breakdown_3_vs_6_status_doc_drift
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityContent.tsx sidecar
      (batch ZC) docs_link_semantic.doc_drift_findings[1] AND
      TestCategoryResults.tsx sidecar docs_link_semantic.doc_drift_findings[0].
      Evidence: WebFetch dashboard.md 2026-05-22 ("passed / failed / skipped")
      vs DataQualityContent.tsx:43-51,83 + TestCategoryResults.tsx:21 +
      components.yaml:1407-1415 (the 6-value enum). Severity: MEDIUM — the
      three named statuses are a subset, so the doc is incomplete rather than
      contradictory.
  - facet: |-
      Table Health ring labels disagree between doc and code
    observed: |-
      The live dashboard.md page describes Table Health as
      "success / failed / broken". The component renders the slices labelled
      Healthy / Warning / Error from `tablesDashboard.tablesHealth
      .{healthyTables, warningTables, errorTables}` (DataQualityContent.tsx
      :55-62; components.yaml:3772-3787). The DTO field set has no `failed`
      or `broken` — it has `warning` and `error`. An operator reading the
      docs looking for a "broken tables" count will not find that label on
      the screen. Separately, the "Unknown" test-category label has a minor
      casing mismatch — the doc lists "Unknown Category" (capital C); the
      code renders the DataQualityCategory.UNKNOWN description "Unknown
      category" (lowercase c) verbatim (TestCategoryResults.tsx:30,
      DataQualityCategory.java:17).
    expected: |-
      The live dashboard doc uses the product's vocabulary —
      Healthy / Warning / Error for the Table Health ring, "Unknown category"
      (matching the rendered string) for the category label.
    drift_class: table_health_label_doc_drift
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityContent.tsx sidecar
      (batch ZC) docs_link_semantic.doc_drift_findings[0] AND
      TestCategoryResults.tsx sidecar docs_link_semantic.doc_drift_findings[2].
      Evidence: WebFetch dashboard.md 2026-05-22 ("success / failed / broken")
      vs DataQualityContent.tsx:55-62 + components.yaml:3772-3787 +
      TestCategoryResults.tsx:30 + DataQualityCategory.java:12-17. Severity:
      MEDIUM (Table Health labels) / LOW (the casing mismatch).
  - facet: |-
      The operator's filter slice does NOT survive navigating away from
      /data-quality and back
    observed: |-
      DataQuality.tsx wraps the dashboard in DataQualityAtomProvider — a
      fresh jotai `<Provider>` per mount (DataQualityProvider.tsx:4-6). The
      /data-quality route is a single non-wildcard `<Route>` (App.tsx:73);
      React Router unmounts the element on navigation away, destroying the
      Provider and its atom scope. The next mount starts a fresh
      formFiltersAtom at the all-empty default (DataQualityStore.ts:11-22) —
      the operator loses their filter slice with no warning. The ONLY
      persistence channel is the URL search params written by
      DataQualityFilters' second useEffect (DataQualityFilters.tsx:46-54);
      whether those fully reconstruct the selection on remount is what probe
      P-120 verifies. An operator who builds a multi-dimension filter slice,
      clicks into a dataset, and clicks Back finds the dashboard
      unfiltered unless they navigated via a bookmarked /data-quality?... URL.
    expected: |-
      Either (a) the filter selection survives a navigate-away within the
      session (the URL round-trip should reconstruct it on Back — P-120
      verifies whether it does); OR (b) the live dashboard doc states that
      filters reset on navigate-away. The live dashboard.md page is silent on
      the default state and on filter persistence.
    drift_class: per_mount_filter_reset_loses_operator_slice
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityStore.ts sidecar
      (batch ZC) bugs_limitations_corner_cases[1] + implicit_adrs[1] +
      docs_link_semantic.doc_drift_findings[0], and DataQualityFilters.tsx
      sidecar implicit_adrs[2]. Evidence: DataQualityStore.ts:11-22
      (all-empty default) + DataQualityProvider.tsx:4-6 (fresh Provider per
      mount) + App.tsx:39,73 (lazy + single Route) +
      DataQualityFilters.tsx:46-54 (the URL-sync useEffect, the only
      persistence channel). Pinned by probe P-120. Severity: MEDIUM —
      operator-visible UX surprise.
  - facet: |-
      A failed dashboard fetch is presented identically to an empty catalog
      — no error UI
    observed: |-
      DataQualityContent.tsx:24 destructures only `{ data, isSuccess }` from
      useGetDataQualityDashboard — never `isError` / `error`. The hook
      supplies `initialData` (an all-zero DataQualityResults — dataQuality.ts
      :34-81). On a 4xx/5xx from GET /api/dataqatests/runs, react-query keeps
      `data` at initialData (all zeros), `isSuccess` stays false,
      `testResults` is `[]`, and the operator sees three grey "No data"
      donuts (DonutChart's own zero-total path) with NO error message and
      zero category cards. A real backend failure is presented as "your
      catalog has no data quality tests". The route-entry node mounts no
      error UI of its own either — DataQuality.tsx is pure layout.
    expected: |-
      Either (a) the component reads `isError` and renders an explicit error
      state ("Could not load the quality dashboard — retry"); OR an
      ErrorBoundary around the dashboard. None exists.
    drift_class: failed_fetch_indistinguishable_from_empty_catalog
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityContent.tsx sidecar
      (batch ZC) bugs_limitations_corner_cases[5] +
      stress_findings.resource_boundaries, and DataQuality.tsx sidecar
      bugs_limitations_corner_cases[2]. Evidence: DataQualityContent.tsx:24
      (only data,isSuccess destructured; no isError) + dataQuality.ts:77-81
      (useQuery with initialData, no error surface). Severity: MEDIUM.
  - facet: |-
      Category cards are alphabetically ordered — the worst-failing category
      is not surfaced first
    observed: |-
      DataQualityContent.tsx:75-77 sorts `data.testResults` by
      `category.localeCompare`. An operator opening /data-quality to find
      "which category of tests is failing worst" must scan all panels; the
      panel order conveys nothing about quality. The live dashboard.md page
      lists the six categories in this same alphabetical order but never
      STATES the order is alphabetical (vs severity / failure-count), so a
      reader cannot tell the order is not meaningful. `localeCompare` is
      also called with no explicit locale — runtime-locale-dependent; today
      benign because all six category labels are ASCII, but a future
      non-Latin category name would sort differently per user. The `toSorted`
      runs OUTSIDE a useMemo so it re-sorts on every render.
    expected: |-
      Either (a) category cards ordered by failure count / severity so the
      worst category surfaces first; OR (b) the live doc states the order is
      alphabetical (informational, not meaningful). The doc is silent.
    drift_class: category_ordering_alphabetical_not_severity
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityContent.tsx sidecar
      (batch ZC) bugs_limitations_corner_cases[1,2] +
      docs_link_semantic.doc_drift_findings[2] + stress_findings.orderings.
      Evidence: DataQualityContent.tsx:75-77 (the toSorted(localeCompare),
      outside useMemo) + DataQualityRunsServiceImpl.java:36-42 (backend
      imposes no ordering). Pinned by probe P-100. Severity: MEDIUM (a UX
      trade-off — alphabetical optimises "find a category by name", not
      "find the worst category").
  - facet: |-
      A URL-deeplinked open of /data-quality fires the dashboard fetch twice
    observed: |-
      On a plain /data-quality open the dashboard fetch
      (GET /api/dataqatests/runs) fires once — react-query dedupes by
      queryKey. On a DEEPLINK open (e.g. /data-quality?deNamespaceIds=[1]),
      DataQualityFilters' mount useEffect (DataQualityFilters.tsx:28-43) sets
      formFiltersAtom from searchParams AFTER the first render; the derived
      filtersAtom then recomputes and a SECOND fetch fires with the URL
      filters. So an operator landing on a bookmarked/shared filtered
      dashboard triggers two backend aggregate queries (each fanning out to
      three DB queries server-side) for one page-open. This is the LSN-017
      multiplicity class — the user perceives "one page-open" but the chain
      issues two.
    expected: |-
      One fetch per page-open — the URL-derived filter state should be
      established before the first fetch (e.g. by deriving the initial
      filtersAtom synchronously from searchParams), not applied via a
      post-render useEffect.
    drift_class: ui_deeplink_double_fetch
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityContent.tsx sidecar
      (batch ZC) upstream_callers[1] ("1 on plain open; 2 on open with a
      filter pre-set in the URL"). Evidence: DataQualityContent.tsx:24
      (useGetDataQualityDashboard once per render) +
      DataQualityFilters.tsx:28-43 (the mount useEffect that sets
      formFiltersAtom from searchParams after first render). Pinned by probe
      P-101. Severity: LOW (a redundant backend query, not a correctness
      bug) — but it is a measured second-order amplification feeding the
      feature's amplification_factor.
  - facet: |-
      No debounce / no Apply gate — every single filter change re-queries
      the whole dashboard
    observed: |-
      There is no separate Apply step. filtersAtom is a DERIVED atom that
      recomputes from formFiltersAtom on every change (DataQualityStore.ts
      :32-42), and DataQualityContent reads filtersAtom directly into
      useGetDataQualityDashboard (DataQualityContent.tsx:23-24). Every filter
      chip select/deselect immediately re-derives filtersAtom, produces a new
      react-query queryKey, and fires a fresh GET /api/dataqatests/runs —
      which fans out to three DB queries server-side. An operator building a
      multi-chip filter slice fires one full backend dashboard query per chip
      rather than one on an "Apply" action. Separately, the autocomplete
      search input has no debounce either (DataQualityFilters' MultipleFilter
      ItemAutocomplete calls setSearchText on every keystroke) — typing a
      10-character name fires up to 10 list-API GETs; with 5 filters x 2
      sides the panel generates a request burst.
    expected: |-
      Either (a) an Apply button gating the dashboard re-query; OR (b) a
      debounce around the filtersAtom-driven refetch; AND a debounce on the
      autocomplete search input. The codebase ships an unused per-key
      `getFieldFilterAtom` (DataQualityStore.ts:24-30) — the focused-atom
      tool that would also cut the whole-atom re-render of all ten filter
      components.
    drift_class: no_debounce_dashboard_refetch_per_filter_change
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityStore.ts sidecar
      (batch ZC) performance.known_performance_gaps, DataQualityFilters.tsx
      sidecar bugs_limitations_corner_cases[1] + performance.known_performance_gaps,
      and DataQualityContent.tsx sidecar performance.known_performance_gaps.
      Evidence: DataQualityStore.ts:32-42 + DataQualityContent.tsx:23-24
      (no debounce around useGetDataQualityDashboard) +
      MultipleFilterItemAutocomplete.tsx:57-66 + hooks/index.ts:11-17 (the
      per-keystroke list query). The sibling facet
      autocomplete_no_debounce_request_burst rolls up here. Pinned by probe
      P-111. Severity: MEDIUM.
  - facet: |-
      Filter autocompletes fetch a fixed first 30 options and never paginate
      — large catalogs are not fully filterable
    observed: |-
      DataQualityFilters' useFilter hook hard-codes the autocomplete
      list-query at `{ page: 1, size: 30 }` (hooks/index.ts:13-16) with no
      page-increment, no infinite-scroll, no "load more". For a dimension
      with more than 30 values (a catalog with 200 owners, say), any value
      not in the server's first-30 for a given search prefix cannot be
      selected via that prefix — and nothing distinguishes a truncated list
      from a complete one (no "showing 30 of N" indicator). The autocomplete
      also de-dups options by NAME not id (MultipleFilterItemAutocomplete.tsx
      :77-80), so two distinct entities sharing a name collide — selecting
      one hides the other.
    expected: |-
      Either pagination / infinite-scroll on the filter autocompletes, or a
      "showing first 30" truncation indicator. None exists.
    drift_class: autocomplete_no_pagination_first_30_only
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityFilters.tsx sidecar
      (batch ZC) bugs_limitations_corner_cases[3] + stress_findings.tunables
      + stress_findings.orderings. Evidence: hooks/index.ts:13-16
      (page:1,size:30 literal) + MultipleFilterItemAutocomplete.tsx:75-89.
      Severity: MEDIUM — a usability ceiling on large catalogs, not a perf
      failure.
  - facet: |-
      The empty-state (no ingested DQ tests) is undocumented
    observed: |-
      On a fresh install with no DQ tests ingested, opening /data-quality
      shows three grey "No data" donuts (DonutChart's zero-total path,
      DonutChart.tsx:94-95) and zero category cards (testResults is `[]`) —
      an otherwise empty page with no explanatory copy. The live dashboard.md
      page (WebFetched 2026-05-22, status 200) says NOTHING about what the
      dashboard shows when no DQ data exists.
    expected: |-
      The live dashboard doc describes the empty state, or the dashboard
      itself shows an explanatory empty-state message ("No data quality
      tests have been ingested yet").
    drift_class: empty_state_undocumented
    provenance: |-
      STATIC-INFERRED — primary-source in DataQualityContent.tsx sidecar
      (batch ZC) docs_link_semantic.doc_drift_findings[3]. Evidence: WebFetch
      dashboard.md 2026-05-22 (silent) + DonutChart.tsx:94-95 (the grey
      "No data" slice). Severity: LOW — the silence is a doc-gap; the code's
      behaviour is benign.
