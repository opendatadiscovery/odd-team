name: Get Data Entity Relationships List (paged ERD + GRAPH)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-02
description: |-
  NEW OPERATION, batch ZE — GET /api/relationships with page + size
  + type (ERD|GRAPH|ALL) + query (free-text). Returns paginated
  DataEntityRelationshipList ordered by data_entity.id ASC
  (insertion order — newest landing at the END of the infinite
  scroll).

  IMPLEMENTATION: RelationshipController.java:19-27 →
  RelationshipsServiceImpl.java:30-34 →
  ReactiveDataEntityRelationshipRepositoryImpl.java:57-131. The
  query selects from data_entity WHERE entity_class_ids = [9] AND
  (optional external_name match), JOOQ paginate with ORDER BY
  data_entity.id ASC, then JOINs to relationships +
  source_data_entity + target_data_entity + data_source + 2x
  namespace.

  STRUCTURAL POSTURE: catalog-global read (no OWNERSHIP join, no
  data_source-permission filter, no EXCLUDE_FROM_SEARCH filter, no
  HOLLOW filter). Every authenticated user sees every relationship
  across every data source. Asymmetric to /api/dataentities which
  applies EXCLUDE_FROM_SEARCH per batch-T REFACTOR-425 — the
  asymmetry is undocumented in data-modelling/relationships.md.

  SEARCH SEMANTIC: query parameter matches case-insensitive
  containment on the RELATIONSHIP-row external_name only, NOT on
  source/target entity names. UI placeholder 'Search relationships'
  is aligned with the SQL behaviour.

  TYPE FILTER: ERD applies relationships.relationship_type='ERD',
  GRAPH applies =`GRAPH`, ALL applies DSL.noCondition() (disables
  filter). The mapper at RelationshipMapper.java:60-62 silently
  defaults to GRAPH_RELATIONSHIP for unknown relationship_type
  values (null, lowercase 'erd', misspellings) since the schema's
  varchar(256) column has no CHECK constraint.

  Pairs with operation:get-erd-or-graph-relationship-by-id (the
  detail endpoints) and the dataset-scoped variant
  /api/datasets/{data_entity_id}/relationships on DatasetController.
