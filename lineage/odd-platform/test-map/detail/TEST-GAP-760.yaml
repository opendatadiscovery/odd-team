proposed_action: |-
  Add `NamespaceCaseSensitivityTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `createNamespace_financeAndFinance_returnTwoDistinctIds_pinsCaseSensitiveUniqueness` — POST `/api/namespaces` with `name='finance'`; capture id_lower; POST again with `name='Finance'`; capture id_capital; assert `id_lower != id_capital`.
  2. `getByName_caseSensitiveByteEquality_pinsRepositoryContract` — seed `finance`; call `ReactiveNamespaceRepositoryImpl.getByName('Finance')`; assert Mono.empty().
  3. `uniqueIndexDefinitionOverPlainName_pinsDbConstraint` — query `pg_indexes` for `namespace_unique`; assert the index definition is `(name) WHERE deleted_at IS NULL` (NOT `(LOWER(name))` and NOT with case-insensitive collation).
  4. `unicodeConfusables_cyrillicI_vsAsciiI_returnTwoDistinctIds_pinsHomographAcceptance` — POST `finance` (ASCII) then POST `fіnance` (with Cyrillic 'і' codepoint U+0456); assert both succeed and return distinct ids.

  Pair with DOC-NNN: surface namespace case-sensitivity in the Management doc; recommend a UI fix (warn on near-matches via Levenshtein distance or NFKC normalization).
