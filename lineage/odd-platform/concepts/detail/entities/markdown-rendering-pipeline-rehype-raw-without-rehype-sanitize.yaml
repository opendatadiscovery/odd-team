name: Markdown Rendering Pipeline (rehype-raw without rehype-sanitize)
canonical_in_docs: false
canonical_candidate: false
description: UI-side rendering surface for arbitrary user-authored Markdown bodies,
  primarily for internal_description. Implemented via @uiw/react-markdown-preview@4.2.2
  which transitively pulls in rehype-raw@6.1.1 (parses raw HTML embedded in Markdown
  into AST nodes). NO rehype-sanitize is configured (grep returns 0 matches across
  odd-platform-ui/). NO skipHtml prop is set. Stored-XSS surface for any caller able
  to write into a Markdown-rendered field.
nodes:
- odd-platform java DataEntityController controller-method:upsertDataEntityInternalDescription
contributing_files:
- odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription.md
evidence:
- upsertDataEntityInternalDescription.md:bugs_limitations_corner_cases.[0]
- upsertDataEntityInternalDescription.md:dependencies_semantic.coupling.[3]
axes_present:
- ui_shell
- controllers
security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  authorization_consistency:
    verdict: N/A
    detail: Rendering pipeline downstream of write authorization; auth gate is the
      writer's permission, not the renderer's
  owner_scoping:
    verdict: BYPASSES
    detail: Every reader of an entity-detail page (DATA_ENTITY_VIEW) is downstream
      of the writer's payload — one malicious writer reaches every reader
  weaknesses:
  - No backend sanitisation + rehype-raw on UI without rehype-sanitize = stored-XSS
    surface for description bodies (HIGH)
  - Activity-feed re-renders description payload in event-detail dialog — second exposure
    surface
  - Lineage tooltips (if they display descriptions) would be a third surface
  - Future minor-version bump of @uiw/react-markdown-preview or react-markdown can
    widen the surface invisibly with no test catching the regression
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - No client-side cap on Markdown body length (mirrors server-side gap) — large descriptions
    stall the render
