control_summary: |-
  0 of 4 cells PROBED — feature minted in batch ZD from
  IntegrationController.java:1-28 + the registry/factory/mapper stack
  (5 supporting files) + 4 live WebFetch results 2026-05-25 across the
  wizard / integrations / api-reference / permissions doc pages. ZERO
  direct tests for any path through the controller, service, registry,
  factory, deserializer, mapper, or static-argument-context tier (Grep
  `IntegrationController` in `<odd-platform-repo>/odd-platform-api/src/test`
  returns ZERO matches verified 2026-05-25). The highest-leverage missing
  test is the **security cell** — DISABLED-mode anonymous reachability +
  open-read posture under authenticated modes are documented nowhere; a
  future change that added an `INTEGRATION_READ` permission would break
  the UI silently because no security test pins the contract either way.

  Probe candidate P-126 emitted by the sidecar: pins
  `GET /api/integrations/{unknown-id}` returns 204 (current code path
  via Mono.empty), 404 (with switchIfEmpty + NotFoundException), or
  something else AND whether the response carries an empty body OR a
  JSON-empty body OR is a content-type-less 204. Local docker-compose
  probe stack is sufficient: ODD platform + Postgres + one fixture
  wizard YAML overlay + WebTestClient against the controller-class slice.

  TWO additional probe candidates emerge from this sidecar's drift
  facets but are NOT yet authored: (a) P-INT-1 — DISABLED-mode anonymous
  reachability + platform_url leak (set auth.type=DISABLED +
  odd.platform-base-url to an internal hostname; issue an anonymous
  GET /api/integrations/{id}; assert response includes the internal
  hostname in static_value). (b) P-INT-2 — empty-registry deployment
  (boot without any wizards on classpath; assert GET /api/integrations
  returns 200 with empty items list AND GET /api/integrations/any-id
  returns 204 AND the UI IntegrationPreviewList.tsx renders the
  empty-content placeholder with no error log).

  Cross-feature picture: F-033 is the canonical operator-facing entry
  to the Pillar P-08 Management surface for integrations. F-008 (S2S
  Batch Ingestion) ships the data the wizard helps operators configure;
  F-031 (Data Source Lifecycle) is the natural-next action after
  copy-pasting the wizard YAML. F-006's audit-silence pattern does
  NOT extend here (the wizard surface is READ-ONLY; no mutating
  endpoints; no @ActivityLog candidate site exists), but the
  DISABLED-mode bypass cluster does (REFACTOR-185 22nd supporting
  surface anchored at the wizard endpoint).
