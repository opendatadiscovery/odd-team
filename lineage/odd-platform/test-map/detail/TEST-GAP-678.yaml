proposed_action: |-
  Testcontainers integration test. (a) Create three data_entities: E1 (STATUS=STABLE, owner=ALICE), E2 (STATUS=STABLE, owner=BOB), E3 (STATUS=DELETED, owner=CAROL). (b) Add dataset_field column `temperature` to each, linked to the SAME term 'Climate Reading'. (c) Authenticate as ALICE. (d) Call `listByTerm(termId, page=1, size=100)`. (e) Assert: ALL three rows returned, including the field on E3 (DELETED). (f) Assert: the OWNER array for each row contains every owner across the three entities (CAROL's name visible to ALICE). (g) Pin the read-collaborative posture: `// REGRESSION-PIN — listByTerm is cross-owner AND cross-deleted-parent. A REFACTOR adding owner-scoping or status-filter would flip this test. The read-collaborative posture is the documented choice at the platform level.` (h) Also pin the EXCLUDE_FROM_SEARCH inconsistency: compare with `dataEntityRepository.list(...)` which DOES filter EXCLUDE_FROM_SEARCH; this method does NOT.
