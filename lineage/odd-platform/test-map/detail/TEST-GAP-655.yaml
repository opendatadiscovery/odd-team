  - "CollectorController.regenerateCollectorToken sidecar (backend half)"
  - "IngestionDataEntitiesFilter sidecar (the consumer of rotated tokens)"
  - "DOC-GAP-NNN (Management → Collectors page silent on both invariants)"
proposed_action: |-
  Add `regenerate_token_dialog_does_not_surface_no_grace_period_or_filter_disabled_warnings` to CollectorItemToken.test.tsx. Mount with a masked collector (token starts with `******`); click Regenerate; assert the ConfirmationDialog mounts; assert its body text does NOT contain any of `grace period`, `401`, `in-flight`, `ingestion will fail`, `auth.ingestion.filter`, `anonymous`; pins the CURRENT silent contract. Pair with `.todo` test `regenerate_dialog_should_warn_about_grace_period_and_filter_disabled` — surfacing the eventual UI fix. The pin freezes today's UX; a future fix that adds the warning to the dialog breaks the test AND forces intentional re-authoring of the security contract.
