name: Predefined role-name three-policy case-sensitivity mismatch (RoleServiceImpl create vs update vs delete)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  NEW HIGH-severity INVARIANT, batch 2026-05-20S (RoleServiceImpl primary source).
  The same logical predicate — "is this role one of the seeded predefined roles
  (Administrator / User)?" — is implemented THREE DIFFERENT WAYS across the
  three mutating verbs in a single 143-line class. The drift is observable from
  a single operator-level exploit.

  Case-policy mismatch verbatim from RoleServiceImpl.java:
    - CREATE (lines 49-61): NO case check at all. Protection is the partial
      unique index `role_name_unique WHERE deleted_at IS NULL` (V0_0_55__add_
      policies_and_roles.sql:42); Postgres VARCHAR equality is byte-for-byte
      case-sensitive, so "administrator" (lowercase) is DISTINCT from
      "Administrator" (the seeded row); creation of the lowercase variant
      succeeds.
    - UPDATE outer filter (line 68): case-SENSITIVE
      `!role.getName().equals(UserProviderRole.ADMIN.getValue())` — only the
      LITERAL "Administrator" is rename-blocked. A role named "administrator"
      passes this filter and reaches updateRoleName (lines 103-110), which
      blocks only "User"-rename, not "administrator"-rename. The lowercase
      Administrator variant is rename-able to anything.
    - DELETE filter (lines 81-82): case-INSENSITIVE
      `Stream.of(UserProviderRole.values()).noneMatch(r ->
      r.getValue().equalsIgnoreCase(role.getName()))` — BOTH literals AND
      every case-variant ("administrator" / "ADMINISTRATOR" / "AdministratoR"
      / "user" / "USER" / etc.) ARE protected. The lowercase Administrator
      variant is NOT delete-able via the service path.

  EXPLOITATION VECTOR (single-actor; ROLE_CREATE permission required):
    1. POST /api/roles with `{name: "administrator", policies: [<seeded Admin
       policy id>]}` → succeeds (no name check on create; unique index doesn't
       collide).
    2. The new role's policies confer MANAGEMENT/ALL permissions on any owner
       attached to it.
    3. POST /api/owners or PUT /api/owners/{id} to attach the new role to
       the attacker's own owner → next authorized request, attacker holds
       MANAGEMENT/ALL.
    4. Defender attempts DELETE /api/roles/{id} → fails with
       BadUserRequestException("Role is predefined and cannot be deleted")
       at line 84 — the lowercase variant is treated as predefined, and
       defender cannot remove it via the normal delete path.
    5. Defender remediation requires DB-direct DELETE or careful update-then-
       delete dance.

  This is the F-006 batch S NEW HIGH finding. The 3-divergent-policy pattern
  inside one class is the most discoverable kind of case-sensitivity bug;
  the maintainer-readable evidence is the three distinct equals / equalsIgnoreCase
  call sites at four lines of the file. The single-line fix at line 50-51 closes
  the create-side gap: `if (UserProviderRole.values().stream().anyMatch(r ->
  r.getValue().equalsIgnoreCase(formData.getName()))) return Mono.error(new
  BadUserRequestException("Role name is reserved"))`.

  Severity: HIGH (single-actor exploitable; the lowercase-role's policies
  grant equivalent permissions to the seeded Administrator; defender s
  normal-path remediation is blocked). Mitigation today: ROLE_CREATE is itself
  MANAGEMENT-tier permission, so the attacker already holds high privileges
  to exploit — but that exact contract assumes ROLE_CREATE is harder than
  full-admin, which the case-sensitivity gap silently equates.
