name: Management tab visible to all authenticated users (unpermissioned tab visibility — read-collaborative UX manifestation)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-08
description: |-
  **NEW MEDIUM-severity INVARIANT, batch 2026-05-20-Q (AppToolbar
  primary source)**. **STRENGTHENED batch ZH (2026-05-26) with the
  managementRoutes sidecar — the route-module-level evidence
  confirms the section-level half-gated posture.** **STRENGTHENED
  batch ZJ (2026-05-26) with the ToolbarTabs primary-source sidecar —
  the unconditional 9-tab enumerator pinned at ToolbarTabs.tsx:34-82
  with explicit grep confirmation that `usePermissions /
  getGlobalPermissions / hasGlobalPermission` produces 0 matches in
  the AppToolbar subtree.** The SPA's top-level navigation tabs are
  rendered UNCONDITIONALLY by `<ToolbarTabs>` (ToolbarTabs.tsx:34-82) —
  every authenticated user sees ALL NINE tabs (Catalog / Directory /
  Data Quality / Data Modelling / Master Data / **Management** /
  Dictionary / Alerts / Activity) regardless of their permission set.
  The ToolbarTabs enumerator does NOT consult `getGlobalPermissions`
  or any permission predicate — every tab entry is unconditionally
  pushed into the rendered list.

  **The Management tab is the highest-stakes example**: an operator
  with zero `*_MANAGE` permissions (e.g. a regular user with only
  `DATA_ENTITY_VIEW`) still sees the `Management` tab in the toolbar.
  Clicking through routes to `/management/*` where the page-level
  `WithPermissionsProvider` (per `pillars/documentation/cornerstones.md`
  Cornerstone 3 — configuration is a separate audience surface)
  injects context but does NOT gate route rendering — they see the
  page, but the individual Create/Edit/Delete buttons are hidden via
  `<WithPermissions>` wrappers returning `null`.

  **The UX consequence**: an operator sees a tab labelled "Management"
  but clicking through reveals only read-only views (the per-button
  WithPermissions wrappers hide every mutation affordance). They have
  no UI affordance explaining "this tab exists because the platform's
  read-collaborative posture (REFACTOR-024) lets you READ the role
  catalog / owner catalog / policy catalog but not MUTATE it". The
  tab appears "broken" to the user (a tab with no actions).

  **This is internally consistent with the platform's read-collaborative
  posture** catalogued at `read-collaborative-cross-owner-enumeration`
  invariant (REFACTOR-024, REFACTOR-203, REFACTOR-201 cross-pillar
  reads bypass per-owner scoping). The Management tab being visible
  follows the same posture: READ across the platform is collaborative;
  WRITE is permission-gated. But the UX manifestation is operator-
  surprising — the maintainer should either:
    (a) add a per-tab permission predicate to ToolbarTabs.tsx (hide
        the Management tab from users with zero Management permissions);
    (b) add a banner on the Management routes explaining "you can
        read this catalogue but not edit it without {required
        permission}".

  **Cross-batch coherence (LSN-018)**: This sidecar STRENGTHENS the
  `read-collaborative-cross-owner-enumeration` invariant by adding
  the FIRST UI-layer evidence point — the read-collaborative posture
  is not just an HTTP/service/SQL-layer architectural choice; it is
  visible to every user as a tab in the toolbar they may not
  understand the role of.

  ## STRENGTHENED — batch ZH (2026-05-26)

  The managementRoutes sidecar adds ROUTE-MODULE-LAYER evidence to
  complete the picture:
    - The /management splat route at App.tsx:62 has NO route-level
      permission guard.
    - Management.tsx wraps everything in
      `<WithPermissionsProvider allowedPermissions=[OWNER_ASSOCIATION_MANAGE]>` —
      a CONTEXT seed, NOT a gate.
    - 8 of 9 sub-routes (Namespaces / Datasources / Collectors / Owners /
      Tags / Roles / Policies / Integrations + their per-id detail
      pages) render unconditionally for any authenticated user. Lists
      are fetched on mount (e.g. NamespaceList.tsx:46-48). Only the
      Associations sub-route at ManagementRoutes.tsx:101-110 is
      route-gated via RestrictedRoute redirecting to ../namespaces.
    - The Integrations sub-route at ManagementRoutes.tsx:150 has
      NO WithPermissionsProvider at all — any inner usePermissions
      check falls back to the outer Management.tsx context whose
      allowedPermissions = [OWNER_ASSOCIATION_MANAGE], so any
      sub-area-specific permission check deny-by-defaults
      regardless of the user's global permissions.

  The original AppToolbar-only finding ('tab is visible') is now
  CROSS-LAYER evidenced: the route module ALSO does not gate, the
  inner per-sub-route providers do not gate, the lists fetch
  unconditionally. The chain from tab visibility -> route mount ->
  list fetch is end-to-end ungated except for Associations.

  See the new `management-section-half-gated-only-associations-route-restricted`
  invariant for the section-level posture in full.

  ## STRENGTHENED — batch ZJ (2026-05-26)

  Batch ZJ adds the ToolbarTabs.tsx primary-source sidecar
  (odd-platform__ts__components_shared_elements_AppToolbar_ToolbarTabs__ui-shell-widget__ToolbarTabs.md)
  with the EXPLICIT primary-source confirmation:

    - ToolbarTabs.tsx:34-82 is the LITERAL 9-tab array — 'tabs is a
      hard-coded array with NO `hidden`/`disabled`/permission-gated
      entry; AppTabs own `hidden`/`disabled` props on AppTabItem are
      NEVER set by this caller' (concepts.invariants.[2]).

    - 'security.known_security_gaps.[0]' explicitly records: 'Tab
      visibility is structurally unconditional — READ_ONLY users see
      the Management tab the same as ADMIN ... the discovery
      affordance — this feature exists — is leaked to every
      authenticated user'.

    - 'security.authorization_assertions: []' with the verifier note
      'Grep for usePermissions|getGlobalPermissions|hasGlobalPermission
      inside the AppToolbar subtree returns 0 matches'.

    - 'security.known_security_gaps.[1]': Tab visibility ALSO does
      NOT participate in Active Features (the platform's feature-
      flag system via WithFeature). WithFeature exists
      (`WithFeature.tsx:15-36`) but is NEVER used to wrap any tab.
      A future operator disabling a backend feature does NOT
      auto-hide its tab.

  Probe P-175 emitted to verify the runtime across all four auth
  modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP) and three role
  classes (READ_ONLY / ADMIN / unprivileged).
