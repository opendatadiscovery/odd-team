behaviour: |-
  **CRITICAL — NEW F-004 stored-XSS surface in the Term Definition field.** The F-004 family until now spanned Data Entity Description + Dataset Field Description (per F-004.yaml batch-J primary-source + P-009 dynamic-verification slice). This sidecar discovers a THIRD surface with the IDENTICAL fingerprint: **Term Definition** (the rich-text body of every Term entity). The render path is verified end-to-end:

  - **Author endpoint**: `POST /api/terms` (createTerm — `TermController.java:70-75`) + `PUT /api/terms/{term_id}` (updateTerm — `TermController.java:78-83`) accept `TermFormData.definition` (a String) with NO server-side sanitisation. `TermServiceImpl.createTerm` (lines 99-117) + `TermServiceImpl.updateTerm` (lines 121-145) persist the definition verbatim into `term.definition` (verified by reading the service end-to-end + Grep `'sanitize|escape|jsoup|policyFactory'` against `TermServiceImpl.java` returns zero matches).
  - **Read endpoint**: `GET /api/terms/{term_id}` (getTermDetails — `TermController.java:92-97`) returns the verbatim `definition` field as part of `TermDetails`.
  - **Render path**: `TermDetails.tsx` → `Overview.tsx:39-44` reads `termDetails.definition` → `TermDefinition.tsx:16-47` → `<Markdown value={transformDescriptionToMarkdown(definition)}>` → `Markdown.tsx:113-124` instantiates `<MDEditor.Markdown source={value} ...>` which is `@uiw/react-md-editor`'s preview component which bundles `rehype-raw@6.1.1` (verified at `odd-platform-ui/pnpm-lock.yaml:3900,5922,8843`) and applies NO `rehype-sanitize` (verified by Grep over `odd-platform-ui/src` for `rehype-sanitize` returning ZERO matches).

  **Trust model break**: An operator with `TERM_UPDATE` permission on any term (which the docs claim gates rename/description/namespace/directly-linked terms) can plant `<script>alert(1)</script>` in a term's `definition`. The script fires for ANY authenticated user who later opens the Term detail page (read-collaborative posture — `system-mission.md:267`). The read-collaborative posture means EVERY authenticated user sees EVERY term in EVERY namespace — so a single compromised TERM_UPDATE-holder can plant payloads that fire for every reader of any term across the catalog.

  **Why CRITICAL not HIGH**: this is the third surface in the F-004 family; the first two (data-entity description + dataset-field description) are already gated only by browser defence-in-depth (CSP, Trusted Types) per P-009 dynamic-verification. The browser defences MAY or MAY NOT extend to this third surface — out of scope for this test gap; the storage-layer + render-layer pair IS the surface. The combination of (a) NEW surface not in F-004's existing batch-J primary-source enumeration, (b) operator-edit-time entry point with TERM_UPDATE permission (broadly granted by default per docs), (c) read-collaborative read-time surface for every authenticated user — meets the CRITICAL threshold.

  **Test gap shape**: regression-pin asserting `term.definition` containing `<script>` (or `onerror=`, `<iframe>`, etc.) is rendered as RAW HTML by the @uiw/react-md-editor's preview, NOT escaped. The bug must be PINNED (i.e., the test asserts the current — unsafe — behaviour), so that any future addition of `rehype-sanitize` to the MDEditor instantiation will be caught at CI time by the test failing. Paired with a backlog item proposing the sanitisation fix.
