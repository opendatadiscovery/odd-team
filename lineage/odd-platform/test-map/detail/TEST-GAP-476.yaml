behaviour: |-
  Per-call DB round-trip on the principal-lookup query. Every fetchAssociatedOwner invocation issues `SELECT owner.* FROM user_owner_mapping JOIN owner ... WHERE oidc_username = ? AND deleted_at IS NULL AND (provider = ? OR provider IS NULL)` (ReactiveUserOwnerMappingRepositoryImpl.java:77-85). For a UI rendering catalog home (mounting Recommended → My Objects + My Alerts count + Activity feed simultaneously), a single user page-load triggers 3-5 sequential identical queries to user_owner_mapping. The query is indexed and small, but the absence of even a per-request memoization (e.g. reactor Context attribute) or per-session in-memory cache is a measurable per-page cost. The maintainer's deliberate absence (implicit ADR) is the trade-off: cache-invalidation surface vs. per-request DB round-trip.
