gap_id: TEST-GAP-098
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
surfaced_by:
- regenerateCollectorToken.md:bugs_limitations_corner_cases.[4] (severity HIGH)
- regenerateCollectorToken.md:security.known_security_gaps.[1] (severity HIGH)
behaviour: 'Token entropy regression-pin: `RandomStringUtils.randomAlphanumeric(40)`
  delegates to ThreadLocalRandom (non-CSPRNG in commons-lang 3.16+; cryptographically-secure
  variant requires `RandomStringUtils.secure().nextAlphanumeric(40)` or explicit `SecureRandom`).
  40 alphanumeric chars ≈ 238 bits of input space, but actual entropy depends on RNG
  quality — no test pins this.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/TokenGeneratorImplTest.java
  name: regenerate_tokenValueUsesCryptographicallySecureRandomSource
evidence:
- 'regenerateCollectorToken.md says: ''`RandomStringUtils.randomAlphanumeric(40)`
  delegates to `Random` ... NOT `SecureRandom`'''
- 'concepts.yaml:entities[Collector].security_aggregate.weaknesses.[0] verbatim: ''Token
  entropy uses RandomStringUtils.randomAlphanumeric(40) which delegates to ThreadLocalRandom
  (non-CSPRNG); should use RandomStringUtils.secure().nextAlphanumeric(40) (severity
  HIGH)'''
- concepts.yaml:entities[Collector Token].security_aggregate.weaknesses.[0] (same
  finding, second concept-level rediscovery)
cross_references:
