name: Get lineage (recursive-CTE walk with depth-1 expansion fan-out)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW OPERATION, batch 2026-05-19I (LineageServiceImpl sidecar)**
  — `LineageServiceImpl.getLineage(long dataEntityId, int lineageDepth, List<Long>
  expandedEntityIds, LineageStreamKind)` at lines 87-122. The lineage-canvas read
  for F-005, called from `DataEntityController.getDataEntityDownstreamLineage`
  / `getDataEntityUpstreamLineage`. Two-query assembly: (1) recursive-CTE walk
  for the bulk subgraph: `lineageRepository.getLineageRelations(Set.of(root.getDataEntity().getOddrn()),
  LineageDepth.of(lineageDepth), lineageStreamKind)` (lines 95-97); (2) depth-1
  fan-out for `expandedEntityIds`: `lineageRepository.getLineageRelationsForDepthOne(expandedEntityIds,
  lineageStreamKind)` (lines 98-99). Merged via `Flux.mergeWith(...).distinct().collectList()`
  (lines 100-102), then enriched in parallel via `Mono.zip(repositoryMapsMono,
  getChildrenCount, getParentCount)` (lines 113-114). **Three concrete bugs at
  the service-layer boundary**: (a) **null-lineageDepth NPE**: the service signature
  uses primitive `int`; the controller passes a boxed `Integer` (`DataEntityController.java:257`)
  which is null-allowed by the OpenAPI spec. Autoboxing at the call site throws
  NullPointerException BEFORE the service body executes. The doc claims `lineage_depth`
  "Unset returns the platform''s default depth" — the realised behaviour is unimplementable
  as written. (b) **no upper-bound check on lineageDepth**: there is no defensive
  clamp (`Math.min(lineageDepth, MAX)`), no warning log, no safety net. A caller
  passing `lineageDepth=Integer.MAX_VALUE` runs the recursive CTE to whatever
  Postgres or graph-density limits enforce (REFACTOR-202 amplification). (c) **anchor-set
  defence-in-depth NOT applied**: the service has no `AuthIdentityProvider` field
  (verified by reading lines 19, 54-57), no `fetchAssociatedOwner()` call anywhere
  in the method body; cross-owner enumeration is unmitigated (REFACTOR-203 confirmation
  at the service layer). **One observed race**: the `Optional.orElseThrow(...)`
  blocks at lines 152-154 and 170-173 throw `RuntimeException("Entity with oddrn
  %s wasn''t fetched")` if the metadata fetch returned fewer oddrns than the edge
  set referenced (race window: an entity hard-deleted between the lineage walk
  and the metadata fetch). The user sees a generic 500. **Read-only, NOT
  transactional** — multiple separate DB round-trips per call; each is its own
  statement.'
