behaviour: 'Search-session UUID has no owner column / no per-user binding — `search_facets`
  rows are keyed solely by a server-generated UUID. A user who guesses or observes
  another user''s `search_id` UUID can call `GET /api/search/{search_id}/results`,
  `GET /api/search/{search_id}/facet/{facet_type}`, `PUT /api/search/{search_id}`
  (updateSearchFacets), or `GET /api/search/{search_id}/data_entities/{data_entity_id}/highlights`
  against it. UUIDs are server-generated v4-random (high entropy), but the principle
  of per-user session isolation is violated by absence. STRENGTHENED batch M — the
  SearchController#facets sidecar confirms the same posture at the FACET endpoint
  surface AND extends the impact analysis: an attacker with another user''s search_id
  can not only read their session state but ALSO drill down via getFiltersForFacet
  to enumerate the cross-owner catalog cardinality on the victim''s session — combining
  TEST-GAP-252 (session hijack) + TEST-GAP-518 (cross-owner facet enumeration) means
  the search session UUID is effectively a bearer token for cross-owner enumeration.
  Criticality BUMPED from LOW to HIGH given the additional cross-owner facet-count
  data exposure surface (per concepts.yaml:entities[Search Session].security_aggregate
  HIGH severity for the cross-owner posture at facet endpoints). Cross-pillar P-01+P-09.
  See TEST-GAP-519 for the dedicated regression-pin at the facet endpoint surface.'
