name: |-
  RBAC soft-delete persistence — Role aggregation methods don't filter soft-deleted Policies (symmetric Policy mirror)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-19N — symmetric mirror of
  batch-H's ReactivePolicyRepositoryImpl.getRolesPolicies finding** —
  ReactiveRoleRepositoryImpl's THREE custom dto methods (getDto / listDto
  / getByName) all do a LEFT JOIN against the POLICY table for the
  attached-policies aggregation. NONE of the three methods filter
  `POLICY.deleted_at IS NULL` on the joined POLICY rows. A soft-deleted
  policy with surviving `role_to_policy` bindings is materialised into
  the aggregated `policy_relations` JSON returned to the caller.

  **The three offending methods**:
    - `getDto(id)` at ReactiveRoleRepositoryImpl.java:42-52 — single-row
      Role lookup with attached-policies aggregation; LEFT JOIN on
      ROLE_TO_POLICY + POLICY; soft-delete filter on ROLE.deleted_at
      (correct) but NOT on POLICY.deleted_at.
    - `listDto(page, size, nameQuery)` at lines 54-79 — paginated Role
      list with CTE pagination + LEFT JOIN aggregation; same shape;
      same missing POLICY filter.
    - `getByName(name)` at lines 82-93 — Role lookup by name with
      attached-policies; the AUTHORIZATION HOT PATH for the
      `getUserProviderRole()` fallback (RoleServiceImpl.java:125);
      same shape; same missing POLICY filter.

  **The symmetric Policy mirror**: ReactivePolicyRepositoryImpl batch H
  surfaced this exact bug shape on the parallel surface — Policy's
  `getRolesPolicies` (the inverse-direction JOIN, from Roles → Policies
  per a role-id list) does NOT filter `policy.deleted_at IS NULL` either.
  The two repositories together exhibit the BUG SYMMETRICALLY across the
  RBAC mutation surface:
    - Role-repo: Role.getDto/listDto/getByName → POLICY (this batch N)
    - Policy-repo: Policy.getRolesPolicies → POLICY by role-id (batch H)

  **The bug shape applies BOTH directions**: regardless of which side
  initiates the read (a Role being rendered with its attached policies,
  or the RBAC permission framework resolving a user's roles to their
  policies), a soft-deleted Policy with a surviving `role_to_policy`
  edge silently confers permissions transitively. The service-layer
  defence at PolicyServiceImpl.delete (lines 89-92) — `isPolicyAttachedToRole`
  → CascadeDeleteException — is the SOLE defence in normal operator
  flow; ANY service-bypassing path (DB-direct UPDATE, schema migration
  mistake, future refactor weakening the cascade-check) re-opens the gap
  at BOTH read sides.

  **The Role-side schema-side analysis** (batch N strengthening): the FK
  on `role_to_policy.policy_id REFERENCES policy(id)` has NO `ON DELETE
  CASCADE` and NO trigger removing role_to_policy rows when
  `policy.deleted_at` is set (per V0_0_55__add_policies_and_roles.sql:52).
  This is consistent with the soft-delete intent (the bound edge should
  survive if the policy is restored), BUT means a soft-deleted policy
  silently retains its bindings. The application-tier defence is
  PolicyServiceImpl.delete + isPolicyAttachedToRole; this defence does
  NOT exist on the Role side — RoleServiceImpl.delete (line 89) directly
  removes role_to_policy edges before soft-deleting the role (acceptable
  because it removes the binding cleanly), but the SYMMETRIC defence —
  a Role-side check refusing to delete a Role whose attached policies
  include a soft-deleted one — does NOT exist. There is no operator
  signal that a Role currently aggregates soft-deleted policies into
  its dto view.

  **Why HIGH severity** (same as batch H Policy-side finding): the bug
  applies on the AUTHORIZATION HOT PATH (getByName is called for every
  authorized HTTP request whose user has no explicit owner-attached
  roles per RoleServiceImpl.java:96-101, 123-126 — see
  resolve-roles-to-policies operation invariant). A soft-deleted
  Administrator policy with surviving Administrator-role bindings would
  continue to confer the ALL-permissions wildcard to users in the
  Administrator role until an operator audited the policy table directly.
  The lack of audit log on RBAC mutations (companion invariant) means
  the soft-delete event itself is forensically invisible.

  **The fix is one line per method**: `AND policy.deleted_at IS NULL` in
  each LEFT JOIN's ON-clause or WHERE-clause. The pattern is uniform
  across both repositories (Role + Policy). A single sweep of the RBAC
  repositories closes the BOTH-DIRECTIONS exposure.
