proposed_action: |-
  Add `ActivityControllerViewModeDispatchTest` with FIVE regression-pin methods, one per branch + the no-owner edge:
  (a) `getActivity_typeAll_dispatchesToFetchAllActivities_returnsCrossOwnerSet`: seed multiple owners + events; authenticate as one; GET `/api/activity?type=ALL`; assert events from ALL owners are returned. Pin the ALL branch.
  (b) `getActivity_typeMyObjects_dispatchesToFetchMyActivities_returnsOnlyCallerOwned`: same fixture; GET `/api/activity?type=MY_OBJECTS`; assert only caller-owned events. Pin the only owner-scoped branch.
  (c) `getActivity_typeUpstream_walksLineageWithoutOwnerFilter`: build lineage A → B → C, owners A/B/C distinct; authenticate as A's owner; GET `/api/activity?type=UPSTREAM&data_entity_id={C}`; assert events from A's and B's entities appear (lineage-resolved). Pin lineage-walk.
  (d) `getActivity_typeDownstream_walksLineageOppositeDirection`: same fixture; GET `?type=DOWNSTREAM&data_entity_id={A}`; assert events from B's and C's entities appear. Pin direction-correctness.
  (e) `getActivity_typeMyObjects_callerHasNoOwnerAssociation_returnsEmptyFlux_pinsSilentEmptyFallback`: authenticate as a user with NO owner association; GET `/api/activity?type=MY_OBJECTS`; assert response 200 with EMPTY Flux<Activity>. Pin the `switchIfEmpty(Flux.empty())` silent-empty behaviour — the highest-leverage edge case the sidecar called out.
  Add `// REGRESSION-PIN — ActivityController.getActivity has four dispatch arms + one no-owner edge. Methods (a)-(d) pin the four branches; method (e) pins the silent-empty fallback for no-owner-association. The doc page activity-feed.md does NOT document the type parameter; pair with DOC-GAP-NNN that adds the section. If a future refactor changes any branch (rename enum, collapse two, swap lineage direction) or changes the no-owner fallback (e.g. to Mono.error), one of (a)-(e) will catch it.` comment block.
