  OpenAPI contract'
- 'openapi-tag:dataEntity.implicit_adrs[0]: spec contains no top-level security: block
  and no per-operation security: override'
- 'postMessageInSlack.docs_link_semantic.doc_drift_findings[0]: live api-reference
  page does not state which Permission gates this endpoint'
