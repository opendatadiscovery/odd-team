proposed_action: |-
  Testcontainers test. (a) Seed 25 tags, each attached to varying numbers of entities for stable popularity ordering. (b) listMostPopular(page=1, size=10) → 10 rows, total=25, hasNext=true. (c) listMostPopular(page=2, size=10) → 10 rows (continuation), no duplicates from page 1. (d) listMostPopular(page=3, size=10) → 5 rows, hasNext=false. (e) listMostPopular(page=100, size=10) → empty page (out-of-bounds).
