oracle:
  - **HYPOTHESIS CONFIRMED (HIGH severity)**: row was lost — the partition
    was dropped despite the row being inserted between the check and the
    drop; no error returned to the inserting client.
  - **HYPOTHESIS REJECTED (the race is benign)**: either (a) the
    `AccessShareLock` held by the in-progress INSERT blocks the
    `AccessExclusiveLock` of DROP TABLE — the DROP waits until INSERT
    commits, then re-evaluates emptiness... but PartitionServiceImpl
    does NOT re-evaluate; the DROP fires regardless. So (b) is the only
    benign outcome: the INSERT physically lands in the dropped table
    BEFORE the DROP attempts to acquire its lock, but the table is
    already gone — INSERT errors with `relation does not exist`. Both
    (a) and (b) require empirical verification; the static reading
    (no transaction, no re-check) suggests row loss is the actual
    outcome.

