behaviour: |-
  **ObjectMapper instance allocation per filter subclass instance — minor memory inefficiency vs Jackson's shared-instance recommendation.** AbstractIngestionFilter.java:32 declares `new ObjectMapper()` — each concrete `AbstractIngestionFilter` subclass instantiates its own ObjectMapper at field init. With Spring singletons, TWO ObjectMappers exist (one per concrete filter — IngestionDataEntitiesFilter + IngestionDataSourceFilter). Jackson's recommended pattern is shared static instance OR injection of the Spring-managed ObjectMapper bean (Spring Boot auto-configures one). The per-class instance is a minor memory inefficiency (~hundreds of KB of cached type metadata × N filter classes). NOT a hot-path bug; pin the current pattern.
