# Management Section Route Gating — product-owner reflection

## product_owner_narrative

The Management section is the operator's control room inside the running ODD Platform —
the place where namespaces, datasources, collectors and their tokens, owners, tags, RBAC
roles, and authorization policies are created, edited, and removed (per system-mission.md
P-08 "Operator-facing UI for everything an operator configures inside the running
platform"). It is presented to the user as an admin-tier affordance: a "Management" tab in
the global toolbar, behind which sit nine vertical sub-area tabs (Owners / Roles / Policies
/ Namespaces / Tags / Collectors / DataSources / Integrations / Owner-Associations) on a
single React-Router splat mount (per route__management:understanding — `App.tsx:62` mounts
`<Route path={managementPath()+'/*'} element={<Management />} />`). A new operator opening
this section would describe it as "where I administer the platform."

The way the user reaches it is the load-bearing fact of this feature. There is exactly ONE
URL into the whole section — the wildcard `/management/*` mount — and from there an inner
`<Routes>` declaration dispatches to each sub-area component, which fetches its catalog on
mount (per route__management:bugs_limitations_corner_cases — `NamespaceList.tsx:46-48` fires
`fetchNamespaceList` unconditionally; the same fetch-on-mount shape repeats across the eight
list components). The operator types or clicks a link, lands on a tab, and the full catalog
for that surface paints. What the operator can DO on the painted page is then gated: each
create/edit/delete affordance is wrapped in `<WithPermissions permissionTo={...}>`, which
renders `null` — the button is invisible, not greyed — when the session lacks the
permission (per PolicyList:dependencies_semantic — `WithPermissions.tsx:28` returns null,
and the Create-policy CTA at `PolicyList.tsx:91-98` is the canonical instance).

The working parts the operator perceives as "permission gating" are three peeled layers
(per route__management:stress_findings.auth_gates): every authenticated user sees the eight
non-Associations tabs and their rendered lists; a user with `OWNER_ASSOCIATION_MANAGE`
additionally sees the Associations tab and its route resolves; a user with a sub-area
permission (e.g. `NAMESPACE_CREATE`) additionally sees that tab's write buttons. Crucially,
of the nine sub-routes only `/management/associations/*` is wrapped in a `RestrictedRoute`
that actually redirects an unpermitted user away (per route__management:implicit_adrs —
`ManagementRoutes.tsx:101-110`, `redirectTo='../namespaces'`). The other eight wrap in a
`WithPermissionsProvider`, whose name implies a gate but whose implementation returns its
children unconditionally in every branch (per the feature-flow facet
`with_permissions_provider_is_context_only_not_a_rendering_gate`, confirmed at
`WithPermissionsProvider.tsx:12-48` by the ZH/ZI systemic finding). The Integrations
sub-route has no permission wrapper at all (`ManagementRoutes.tsx:150`).

This feature composes with the rest of P-08: each sub-area's lifecycle feature (F-019
Owner, F-020 Collector, F-026 Lookup-Tables, F-028 Namespace, F-031 DataSource, F-006 RBAC
Policy, F-033 Integration Wizard) renders inside this chrome — F-105 is the route-level gate
that conventionally PRECEDES those features but, except for Associations, does not fire. It
also shares a boundary with P-09 Security & Access Control: F-006 owns the RBAC policy
mutation gate (which works — IT-010 pins the 403 on `DELETE /api/owners/{id}`); F-105 owns
the read-side reachability that lets a non-admin user READ a policy's contents without that
mutation gate ever being consulted. P-09's own maintainer notes name this the
"read-collaborative posture" and call it a load-bearing implicit ADR: "every authenticated
user can enumerate the entire catalog" (per system-mission.md P-09 maintainer notes).

The edge a product owner would flag in a demo: under `auth.type=DISABLED`, the SPA bundle
is served to any anonymous network caller, `fetchIdentity` returns the anonymous identity,
and every Management list paints for a visitor who never logged in (per
route__management:stress_findings.auth_gates — the DISABLED branch). The worst-case payload
is the Policies tab: `/management/policies` lists policy names and owners, and navigating to
`/management/policies/{id}` mounts the full policy JSON — the permission grants, the ODDRN
selectors, the role bindings — in the `AppJSONEditor` (per PolicyList:understanding). No
mutation is possible (the Save button is gated by `POLICY_UPDATE`), but the disclosure is
complete. The same product owner would also note that the live Authorization doc — as of
this reflection's 2026-06-03 WebFetch — now states this posture explicitly ("Read access on
Management catalogs is collaborative by design ... any authenticated user can view Policies,
Roles, Owners, Collectors"), which both confirms the implementation and partially
invalidates the feature flow's `docs_do_not_document_management_ui_permission_model_at_all`
facet recorded at the 2026-05-26 walk.

## hypotheses

- id: H-001
  hypothesis: |-
    When a user with zero Management-tier permissions deep-links to
    /management/policies, the response is a redirect or an access-denied screen
    (the operator's mental model: "Management is admin-only").
  derivation: |-
    The pillar (P-08) names Management as the operator-facing administration
    surface; the outer Management.tsx wraps in WithPermissionsProvider seeded
    with OWNER_ASSOCIATION_MANAGE, and the toolbar presents Management as an
    admin affordance (F-041) — all of which imply a route-level gate.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      No redirect, no access-denied screen. /management/policies renders the
      full Policy LIST for any authenticated user. The outer
      WithPermissionsProvider (Management.tsx:9-12) only provides a React
      Context; WithPermissionsProvider.tsx:12-48 returns its children
      unconditionally in every branch. Of the nine sub-routes, only
      /management/associations/* carries a RestrictedRoute that redirects
      (ManagementRoutes.tsx:101-110). The eight others — including policies —
      mount their list component, which fetches on mount (NamespaceList.tsx:46-48
      is the canonical shape). Only the create/edit/delete BUTTONS hide.
    evidence:
      - sidecar: odd-platform__ts__routes__route__management.md
        section: bugs_limitations_corner_cases
        cite: "ManagementRoutes.tsx:29-150 + WithPermissionsProvider.tsx:12-48"
        note: "8 of 9 sub-routes wrap in a non-blocking provider; only associations/* is route-gated."
      - sidecar: odd-platform__ts__react-component__component__PolicyList.md
        section: invariants
        cite: "PolicyList.tsx:109-122"
        note: "list rendering is unconditional; only the Create CTA is permission-wrapped."
    operator_visible_failure: |-
      A user with no Management permissions deep-links to /management/policies and
      sees every policy NAME plus its owner; clicking through to
      /management/policies/{id} renders the full policy JSON (permission grants,
      ODDRN selectors, role bindings) in the editor. The same any-auth read applies
      to /management/owners, /roles, /namespaces, /datasources, /collectors, /tags,
      /integrations. The subtle failure: the operator who provisioned a "read-only"
      user (intending Management to be hidden) has in fact granted that user a full
      read of the platform's RBAC topology and catalog — the create/edit/delete
      buttons hiding makes the surface LOOK gated, masking that the read is complete.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

