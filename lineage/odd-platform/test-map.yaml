     of the highest-leverage tests-pillar batches in the catalog.

  7. **DISABLED-DEFAULT + NO-MATCH-IF-MISSING FALL-THROUGH** — none of the four
     `*SecurityConfiguration` classes uses `matchIfMissing=true`. Operator who
