- id: H-004
  hypothesis: "An EXTERNAL-origin field (a value discovered and populated by a collector during ingestion) is read-only from the operator's curation surface — the operator cannot overwrite source-system-discovered metadata through the UI/API."
  derivation: "The INTERNAL/EXTERNAL origin distinction (per concepts.yaml 'Metadata Field Origin') names two audiences — operator-curated vs source-discovered; a 'discovered' value implies source-of-truth authority the operator does not overwrite."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The upsert path never checks MetadataFieldPojo.getOrigin(). EXTERNAL fields are populated by collectors (MetadataFieldServiceImpl.java:62-71 ingestMetadataFields creates origin=EXTERNAL); a user with DATA_ENTITY_CUSTOM_METADATA_UPDATE can overwrite the collector-ingested value through this endpoint. The override persists until the next ingestion cycle silently replaces it. The UI hides the edit affordance for EXTERNAL fields, but the API enforces nothing — a direct API call (or the auto-create-on-miss path) overwrites freely. The live doc page confirms this verbatim ("An operator with DATA_ENTITY_CUSTOM_METADATA_UPDATE can write a value onto an EXTERNAL field through the API directly").
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityMetadataFieldValue
        section: bugs_limitations_corner_cases[3]
        cite: "DataEntityServiceImpl.java:287-305 (no origin check) + MetadataFieldServiceImpl.java:62-71 (EXTERNAL field creation)"
        note: "no origin guard on the write path; UI-only hiding"
    operator_visible_failure: |
      The catalog can show a fabricated "source-system" value for an EXTERNAL field — combined with the forensic-silence gap (H-007) with no record of the fabrication. An auditor trusting EXTERNAL = discovered-from-source is misled; a downstream consumer reading the EXTERNAL value as authoritative reads operator-injected data. The override is transient (next ingest reverts it) so the data-quality drift is intermittent and hard to reproduce.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

