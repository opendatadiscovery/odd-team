observed_vs_expected:
  facets:
    - facet_id: infinite_scroll_next_wired_to_noop_pagination_silently_broken
      drift_class: ui_pagination_silently_broken_via_noop_callback
      severity: HIGH
      observed: |-
        LinkedColumnsList.tsx:77 — `<InfiniteScroll next={() => {}}>`.
        The InfiniteScroll component fires `next` when the user scrolls
        past the threshold; here it's a no-op. The HOOK
        `useGetTermLinkedColumns` does not expose a `fetchNextPage`
        function — the call signature `{termId, page: 1, size, query}`
        is single-page (compare LinkedTermsList.tsx:24-31 which uses
        `useInfiniteQuery` with `fetchNextPage`). A Term with 51+
        linked columns silently truncates at column 50; operators see
        the InfiniteScroll spinner if `isFetching` is true but never
        advance. Worse — `pageInfo.hasNext` is forwarded to InfiniteScroll
        (line 78) so the UI promises more pages but the trigger does
        nothing. False UI affordance.
      expected: |-
        Either (a) migrate `useGetTermLinkedColumns` to `useInfiniteQuery`
        with `fetchNextPage` and wire `next={fetchNextPage}`, mirroring
        LinkedTermsList; OR (b) remove the InfiniteScroll wrapper +
        replace with a "Load more" button + explicit pagination state
        (page index incremented on click). Current shape is the worst
        of both — silently broken.
      evidence:
        - 'LinkedColumnsList.tsx:77 (next={() => {}})'
        - 'LinkedColumnsList.tsx:22-27 (single-page hook signature)'
        - 'LinkedTermsList.tsx:24-31 (the working sibling pattern)'
      ui_unverified: false
    - facet_id: search_query_not_in_hook_deps_array_no_refetch_on_query_change
      drift_class: ui_hook_call_misses_query_dependency_only_explicit_refetch_works
      severity: MEDIUM
      observed: |-
        LinkedColumnsList.tsx:22-27 — `useGetTermLinkedColumns({termId,
        page:1, size, query})` is invoked with `query` as a hook
        argument. Whether the hook re-fires on query change depends on
        the hook's internal `queryKey` shape. If `queryKey` includes
        `query`, the hook auto-fetches on every keystroke (which is
        why the explicit `search()` refetch exists at line 34/48). If
        `queryKey` does NOT include `query`, only explicit `refetch()`
        retrieves filtered results. Without reading the hook
        implementation, this is `ui_unverified`.
      expected: |-
        Determined by hook design — if `queryKey` includes `query`,
        a debounce is needed to avoid per-keystroke fetches. If not,
        document the explicit-trigger contract.
      evidence:
        - 'LinkedColumnsList.tsx:22-27 (hook signature with query as arg)'
        - 'LinkedColumnsList.tsx:34-49 (explicit search() on Enter/click)'
      ui_unverified: true
      ui_unverified_reason: |-
        Hook implementation (`useGetTermLinkedColumns`) not read in this
        UI walk; the queryKey shape determines auto-fetch vs explicit-only.
    - facet_id: term_linked_columns_reverse_lookup_inherits_read_collaborative_posture
      drift_class: ui_renders_unscoped_reverse_lookup_surface
      severity: LOW
      observed: |-
        Every authenticated user sees every Dataset Field linked to the
        Term across every namespace and every owner — consistent with
        the platform-wide read-collaborative posture (cross-link F-002
        batch N, F-024 batch U facet
        `read_collaborative_posture_inherits_repo_tier_no_ui_filter`).
        No UI filter "show only fields in my namespace" or "fields I
        own". Aligned with the documented architecture; the absence is
        the intentional UX manifestation.
      expected: |-
        No fix required; document the catalog-wide reverse-lookup
        posture for the Business Glossary docs page.
      evidence:
        - 'LinkedColumnsList.tsx (no namespace / owner filter inputs)'
      ui_unverified: false
