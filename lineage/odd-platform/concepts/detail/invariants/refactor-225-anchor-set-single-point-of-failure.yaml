mitigations_unimplemented:
  - |-
    Introduce a listByOddrnsAndOwner(oddrns, ownerId) repository method that
    JOINs against OWNERSHIP with WHERE OWNERSHIP.OWNER_ID = ? as a belt-and-braces
    filter; route the /my/upstream and /my/downstream endpoints through it.
  - |-
    Add a Long ownerId parameter to listByOddrns and require it at the
    lineage-variant call sites; treat null as a deliberate cross-owner read
    that must be commented at the call site.
  - |-
    Service-layer guard: a mustScope(reason) annotation on methods that
    deliberately BYPASS the anchor — the maintainer must explicitly justify the
    bypass in code review.
  - |-
    Test: a REFACTOR-225 regression-vector unit test that injects a misconfigured
    AuthIdentityProvider returning a wrong owner and asserts the response does
    NOT leak unscoped lineage neighbours — surfaces the single-point-of-failure
    to maintainers reading the test corpus.
notes: |-
  This invariant is the 4-angle triangulated finding from batch M:
    (a) /my/upstream — getMyObjectsWithUpstream sidecar (PRIMARY SOURCE);
    (b) /my/downstream — getMyObjectsWithDownstream sidecar (SYMMETRIC SIBLING);
    (c) /api/dataentitygroups/{id}/lineage — getDataEntityGroupsLineage sidecar
        (DEG-anchored sibling — even broader because the DEG anchor exposes the
        full member-graph + reachable edges + per-member metadata);
    (d) /api/dataentities/{id}/lineage/{downstream|upstream} — the negative-case
        sibling per batch I LineageServiceImpl + batch H repository, where there
        is no anchor-set at all (cross-owner enumeration unmitigated).

  The DEG-anchored variant (c) is the WIDEST blast — for a multi-team DEG (e.g. a
  Domain), the per-connected-component partitioning at LineageServiceImpl.java:200-216
  surfaces team A and team B both contribute to the Finance DEG even when the
  individual entities would not be cross-team-searchable. The DEG anchor wraps
  the whole co-membership graph as the discovery primitive.

  Cross-references:
    - Read-collaborative cross-owner enumeration — same posture across 19 surfaces
      (extended from 15-surface to 19-surface by batch M: getMyObjectsWithUpstream
      + getMyObjectsWithDownstream + getDataEntityGroupsLineage + facets).
    - Anchor-set defence-in-depth — positive vs negative cases at the service tier
      (the platform-level invariant; this is the controller-side instance with
      explicit single-point-of-failure framing).
    - Owner-scoped routes — controllers take NO principal parameter (the
      controller-shape primary source — third member of the triplet confirmed by
      batch M).
