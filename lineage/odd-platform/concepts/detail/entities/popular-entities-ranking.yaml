name: Popular Entities Ranking
canonical_in_docs: true
canonical_candidate: true
pillar_affinity:
- P-01
description: 'Read-only list-shaped surface at GET /api/dataentities/popular ranking
  by view_count DESC. The CONSUMER half of the view_count loop opened by getDataEntityDetails
  (the producer). Surfaces 9-field DataEntityRef projection of the top-N most-viewed
  entities across all owners to every authenticated caller (and any anonymous caller
  under DISABLED). **Batch J — UI HALF (P-01 pillar)**: the UI surface that displays
  the Popular column is one of FOUR columns inside `OwnerEntitiesList.tsx` (not a
  standalone PopularStrip component — the substrate node-id has a name-drift; the
  rendering is actually inside `OwnerEntitiesList/DataEntityList`). Fetched once on
  mount via `dispatch(fetchPopularDataEntitiesList({page: 1, size: 5}))` with empty
  deps array (no polling, no auto-refresh, no interval). Each tile is a `<Link>` to
  `dataEntityDetailsPath(item.id)` which navigates to `/dataentities/{id}/overview`
  — clicking a Popular tile mounts DataEntityDetails which fires fetchDataEntityDetails
  which increments view_count. **THIS CLOSES THE F-001 LOOP ON THE CLIENT SIDE**:
  the UI surface that displays the inflatable ranking is the SAME surface that triggers
  view_count increments on click. No client-side debouncing, no idempotency key, no
  per-tab-per-entity cache. Two UI doc-drift findings: (a) docs say click target is
  Structure tab, code navigates to Overview tab; (b) docs say Recommended panel is
  visible under DISABLED auth mode, code hides it. Owner-association gate at OwnerAssociation.tsx:84-86
  (`if (identity && ownership)`) limits the UI Popular column to owner-associated
  users — but the API endpoint remains anonymous-reachable under DISABLED (UI-only
  gate, not security).'
