      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: tests_coverage_semantic.gaps
        cite: "test_files: ['none'] + uncovered_behaviours (spec-vs-controller status/response/path parity all GAP)"
        note: "No conformance test; the drift cluster DOC-GAP-099 is the direct consequence of nothing structurally guarding spec<->controller alignment."
    operator_visible_failure: |
