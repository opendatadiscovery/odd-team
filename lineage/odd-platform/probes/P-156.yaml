realism_caveats: |
  The probe runs under DISABLED auth for setup simplicity — the auth posture
  for this endpoint is the subject of a SEPARATE probe (P-157). The
  arrange-phase SQL bypasses normal ingestion to seed the denormalised
  last-run table directly; if a future maintainer changes ingestion to
  populate the last-run table via a different mechanism (trigger, app-side
  upsert, etc.), this seeding may become invalid. The probe assumes the
  DATA_ENTITY_TASK_LAST_RUN table's task_oddrn PK constraint is enforced;
  if a schema migration drops or weakens that constraint, the probe still
  works (it explicitly inserts one row) but the test-vs-run semantics in the
  endpoint would shift.

  The probe does NOT test:
  - The Table Health classification (separate probe candidate)
  - The Monitored Tables count (covered by existing
    ReactiveDataQualityRunsRepositoryTest.testGetMonitoredTables)
  - Any filter combination (10 filter dimensions × 2^N combinations is
    out of scope for a focused single-drift probe)
  - The Category-F titleIds/namespaceIds drifts — those would route
    through the same code path; the static analysis is the trace-answer
    for those.

  If the probe PASSES (assertions 1-3 match), update the
  DataQualityRunsController sidecar's bugs_limitations_corner_cases[0]
  confidence from STATIC-INFERRED to PROBE-VERIFIED, and route a DOC-NNN
  follow-up to the dashboard doc page to clarify the wording.

  If the probe FAILS (e.g. assertion_failed_count == 1 AND
  assertion_success_count == 99 — historical run counts), the static
  analysis missed something; re-read the JOOQ chain in
  ReactiveDataQualityRunsRepositoryImpl.java:64-105 carefully. The most
  likely error class: a misunderstood JOOQ COUNT() over the join — perhaps
  the COUNT happens AFTER a join that produces one row per (test × run)
  rather than after the join with DATA_ENTITY_TASK_LAST_RUN's PK.
