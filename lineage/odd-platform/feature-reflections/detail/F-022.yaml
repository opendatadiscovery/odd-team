        section: performance.known_performance_gaps[1] + performance.hot_paths[1]
        cite: "DataQualityController.java:25-68 (no header manipulation) + CachingByteArraySLAResourceResolver.java:18-25 (no ETag)"
        note: "No client-cacheability on the PNG badge; SQL aggregation runs per request"
    operator_visible_failure: |
