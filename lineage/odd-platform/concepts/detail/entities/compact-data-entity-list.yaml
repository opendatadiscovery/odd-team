name: CompactDataEntityList (S2S read projection — oddrn + type only)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-10
- P-01
description: |-
  **NEW ENTITY, batch 2026-05-20-Z (getDataEntitiesByDEGOddrn sidecar)** —
  the minimal response projection of the S2S read endpoint
  `GET /ingestion/entities/{deg_oddrn}`. Each `CompactDataEntity` carries
  `{oddrn, type}` only — no name, no namespace, no owner, no parent-group
  marker, no creation timestamp, no tags. The response is wrapped in
  `CompactDataEntityList { items: List<CompactDataEntity> }`.

  **The contract**: deliberately narrower than the UI-side `DataEntityRef`
  / `DataEntityList` shape. The S2S surface exposes the minimal
  identifier+type tuple sufficient for a collector or third-party
  integration to walk a DEG's direct members. A consumer needing full
  metadata must follow up with `GET /api/dataentities/...` calls per
  member — but that endpoint lives on a different prefix (`/api/`,
  authenticated under UI auth modes) and produces a different result
  shape (`DataEntityRef` with name + namespace + ownerships).

  **The model package**: `org.opendatadiscovery.oddplatform.ingestion.contract.model`
  — generated from the external `opendatadiscovery-specification` repository
  (loaded as the `ingestion-contract-server:0.1.40` gradle dep per
  libs.versions.toml:6,65,142). Symmetric model package with `DataEntityList`
  (the request shape on `POST /ingestion/entities`); the two endpoints
  use a symmetric model for the request/response payload.

  **Three undocumented invariants of the projection (per the
  getDataEntitiesByDEGOddrn sidecar)**:
    (a) Inner-DEG handling is opaque: a nested DEG within the queried DEG
        appears as a single `DATA_ENTITY_GROUP`-typed CompactDataEntity
        with no marker telling the caller it can be re-queried. Compare
        the recursive-CTE behaviour of `getDataEntityGroupLineage` (F-016).
    (b) Soft-deleted members surface: the SQL filter is
        `GROUP_ENTITY_RELATIONS.IS_DELETED.isFalse()` (the EDGE
        soft-delete), not `DATA_ENTITY.STATUS != DELETED` or
        `DATA_ENTITY.HOLLOW = false`. A DEG containing a soft-deleted
        entity returns that entity. Deviates from the platform's
        `getDataEntityDefaultConditions` pattern used everywhere else.
    (c) Response shape is unbounded (no pagination): a 10K-member DEG
        returns a 10K-item list in one response. The sibling
        `listDEGItems` (DataEntityGroupServiceImpl.java:111) DOES
        paginate; this endpoint does not.

  **vocabulary_status**: codebase-anchored, doc-side-absent (no live ODD
  doc names the CompactDataEntityList projection; the
  configuration-and-deployment/data-ingestion page does not exist —
  prior batch-F WebFetch 2026-05-12 status 404).
