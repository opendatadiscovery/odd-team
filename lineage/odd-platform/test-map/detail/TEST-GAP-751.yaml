behaviour: |-
  **HIGH — `POST /api/datasources` and `PUT /api/datasources/{id}` implicitly CREATE Namespaces via the `getOrCreate` side-door pattern, bypassing `NAMESPACE_CREATE` permission.** An operator holding `DATA_SOURCE_CREATE` (the documented gate per Management → Datasources tab) but explicitly NOT `NAMESPACE_CREATE` can proliferate new namespaces by submitting a never-seen `namespaceName` in the DataSourceFormData. Primary-source confirmed in batch-W DataSourceController + NamespaceController sidecars:

  **Call site primary-source**:
  - `DataSourceServiceImpl.create` (line 52, `@ReactiveTransactional`) line 57: `if (StringUtils.isNotEmpty(form.getNamespaceName())) { namespaceService.getOrCreate(form.getNamespaceName()).zipWith(token)... }`. The `namespaceService.getOrCreate` (NamespaceServiceImpl.java) creates the namespace if absent.
  - `DataSourceServiceImpl.update` (line 69, `@ReactiveTransactional`) line 75: same `namespaceService.getOrCreate(...)` pattern.

  **What the docs claim vs what the code enforces** (per batch-W sidecar's `docs_link_semantic` WebFetch 2026-05-20):
  - Management page: "Registered data sources — the platform's view of every system a Collector or Push-client is reporting from. View existing sources, audit ingestion timestamps, edit metadata, link to a Collector + Namespace." — describes the UI flow but does NOT disclose the implicit-namespace-creation side-effect.
  - Authorization page: "The current page only lists the authorization documentation structure with links to detailed sections on Policies, Permissions, Roles, Owners, and User-owner association, but does not include the specific permission names or policy types you're seeking." — the live docs do NOT enumerate `NAMESPACE_CREATE` / `DATA_SOURCE_CREATE` permission names; operators authoring policies have no doc-side anchor.
  - The dedicated `POST /api/namespaces` endpoint requires `NAMESPACE_CREATE` (SecurityConstants.java:99-102) — operators authoring a "datasource-admin" Role with `DATA_SOURCE_CREATE` but NOT `NAMESPACE_CREATE` reasonably expect the operator cannot create namespaces. The code contradicts that expectation.

  **Cross-pillar reach (the architectural pattern)**:
  This is **vertex 3 of the 4-sister-service NAMESPACE_CREATE side-door** documented in NamespaceController.md:bugs_limitations_corner_cases.[1]:
  - Vertex 1: TermServiceImpl.createTerm / updateTerm (lines 103, 138) — TERM_CREATE / TERM_UPDATE → namespaceService.getOrCreate
  - Vertex 2: CollectorServiceImpl.create / update (lines 43, 57) — COLLECTOR_CREATE / COLLECTOR_UPDATE → namespaceService.getOrCreate
  - **Vertex 3 (THIS gap)**: DataSourceServiceImpl.create / update (lines 57, 75) — DATA_SOURCE_CREATE / DATA_SOURCE_UPDATE → namespaceService.getOrCreate
  - Vertex 4: DataEntityGroupServiceImpl.createDataEntityGroup / updateDEG (lines 65, 84) — DATA_ENTITY_GROUP_CREATE / UPDATE → namespaceService.getOrCreate

  **Aggregate finding**: NAMESPACE_CREATE is bypassed by 4 sister services × 2 method × 8 call sites total. Each individual side-door is LOW-MEDIUM per the sidecars; the aggregate is HIGH because: (a) operators authoring RBAC policies expecting NAMESPACE_CREATE to gate namespace creation are SYSTEMATICALLY DECEIVED about what their policies allow; (b) the live docs do NOT disclose this; (c) every catalog-mutation pillar (P-06 Glossary, P-08 Datasources/Collectors, P-01 DEGs/Discovery) has a side-door. The Management UI's Namespaces tab (intended as the controlled-vocabulary surface per P-08) is EFFECTIVELY UNGATED because every other pillar's write endpoints can bypass it.

  **THIS gap pins the DataSourceController-specific vertex** (the broader 4-sister aggregate is being STRENGTHENED into TEST-GAP-726 in the same batch — see the parallel finding there). Both representations are kept: TEST-GAP-726 is the aggregate test (4-sister-service compound), TEST-GAP-751 is the DataSource-specific instance with controller-tier file:line anchors.

  **Test gap shape**: regression-pin asserting: (a) `POST /api/datasources` with a never-seen `namespaceName` succeeds for a caller holding `DATA_SOURCE_CREATE` but NOT `NAMESPACE_CREATE`; (b) the namespace IS persisted; (c) `PUT /api/datasources/{id}` with a never-seen `namespaceName` succeeds for a caller holding `DATA_SOURCE_UPDATE` but NOT `NAMESPACE_CREATE`. The current state is PINNED — failures land if a future maintainer adds explicit `NAMESPACE_CREATE` check at the service layer.
