name: |-
  OwnerAssociationRequestController — three endpoints have NO SecurityRule (create-self-request + auth-providers + activity-audit-read)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
  - P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT (one of three), batch 2026-05-20V — surfaced
  by primary-source examination of OwnerAssociationRequestController batch V.
  Three of the controller's seven endpoints have NO SecurityRule entry in
  SecurityConstants.java:148-162. They fall back to the global authentication
  filter (.authenticated()) — any authenticated user (LOGIN_FORM / OAUTH2 /
  LDAP) can reach them without holding any RBAC permission.

  THE THREE UNGATED ENDPOINTS — file:line citations from the batch V sidecar:

    Endpoint A — POST /api/owner_association_request (createOwnerAssociationRequest)
      OwnerAssociationRequestController.java:28-34 — user self-submits an
      association request. NO SecurityRule. INTENTIONAL per the doc
      narrative (any authenticated user must be able to self-request,
      regardless of held permissions). Severity: LOW in isolation. HIGH
      when combined with the getOrCreate side-door + DIRECT_OWNER_SYNC
      composition (separate batch-V invariant) — the absent SecurityRule
      enables the privilege-escalation chain entry-point.

    Endpoint B — GET /api/owners/providers (getAuthProviders)
      OwnerAssociationRequestController.java:81-85 — returns the Provider
      enum values + the operator's registered providers (LOGIN_FORM,
      OAUTH2_GOOGLE, OAUTH2_GITHUB, LDAP, etc.). NO SecurityRule.
      Severity: LOW (minor information disclosure — an authenticated user
      can fingerprint the deployment's auth strategy + which providers
      are registered).

    Endpoint C — GET /api/owner_association_request/activity (getOwnerAssociationRequestActivityList)
      OwnerAssociationRequestController.java:47-53 — returns the FULL
      audit-trail of who requested association with which Owner, who
      approved/declined, when. NO SecurityRule.
      Severity: HIGH (forensic-data disclosure — the audit trail is a
      SUPERSET of the LIST endpoint in sensitivity; the LIST endpoint
      DOES require OWNER_ASSOCIATION_MANAGE but the ACTIVITY view does
      NOT. The asymmetry is unintended).

  THE ASYMMETRY VS THE LIST ENDPOINT:

    SecurityConstants.java:148-150 — GET /api/owner_association_request
      (the live-pending LIST view) IS gated by OWNER_ASSOCIATION_MANAGE.
    SecurityConstants.java (no entry) — GET /api/owner_association_request/activity
      (the historical AUDIT view) is NOT gated.

    The LIVE-PENDING view is a CURRENT state snapshot (who has open
    requests right now). The AUDIT view is a HISTORICAL forensic record
    (who requested which Owner over time, who approved/declined). The
    audit view is STRICTLY MORE SENSITIVE — it exposes the patterns of
    user-to-Owner attribution, operational decisions, and timestamps.
    The current gating gets the asymmetry BACKWARDS: the less-sensitive
    view is gated; the more-sensitive view is not.

  THE COMPOUND ATTACK SHAPE — combining endpoints B + C:

    1. A compromised low-privilege user (e.g. via phishing or session
       hijack) GETs /api/owners/providers (Endpoint B) → learns the
       deployment's auth strategy (e.g. 'OAUTH2_GOOGLE + LDAP enabled').
    2. The user GETs /api/owner_association_request/activity (Endpoint C)
       → learns the full audit trail of who associated with which Owner
       when, including the OWNER NAMES, the requesting usernames, the
       approving usernames, the timestamps.
    3. The user reconstructs the deployment's organisational structure:
       which Owner is most-privileged (by audit trail volume + admin
       cross-references), which admins approve most requests, which
       owners are 'new' (recently-created via DIRECT_OWNER_SYNC), which
       owners have anomalously-many bindings (potential targets for
       privilege escalation).
    4. Combined with the DIRECT_OWNER_SYNC + getOrCreate composition
       chain (separate batch-V invariant), the user has full
       reconnaissance for a targeted Owner-spoofing attack.

  WHY ENDPOINTS A AND B ARE LEFT UNGATED — design rationale:

    Endpoint A (self-request): the doc-narrative-canonical design is
    that any authenticated user can self-request. This is INTENTIONAL.
    Severity: LOW.

    Endpoint B (auth-providers): the endpoint exists to populate the
    self-request form's provider dropdown. An authenticated user filling
    in the form needs to see the providers. Severity: LOW.

    Endpoint C (activity-read): the design rationale is UNCLEAR — the
    sidecar's docs_link_semantic.doc_drift_findings notes the live doc
    is silent on this endpoint entirely. There is no obvious intent for
    it to be cross-owner-readable. The asymmetry vs the LIST endpoint
    suggests an omission rather than an intentional design choice.

  THE MITIGATION SCOPE:

    Layer 1 — add ONE SecurityRule entry for Endpoint C:
      GET /api/owner_association_request/activity → OWNER_ASSOCIATION_MANAGE
      (matching the LIST endpoint's gate). One-line fix. Closes the
      audit-disclosure surface.

    Layer 2 — re-evaluate Endpoints A and B against the read-collaborative
    posture. Endpoint A appears intentional; Endpoint B is borderline (the
    information-disclosure surface is small but non-zero). Document the
    intentional-no-gate decisions on the live docs to make the design
    explicit.

  SEVERITY OF THE COMPOSITE INVARIANT: HIGH (driven primarily by Endpoint C).
