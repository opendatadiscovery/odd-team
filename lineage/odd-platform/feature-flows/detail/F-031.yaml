shoebox_extensions_2026_05_26:
- seeded_from: SHB-092
  drift_class: operator_vs_collector_silent_overwrite_asymmetric_merge_strengthens_replace_not_merge
  description: |-
    STRENGTHENS the existing `replace_not_merge_silent_field_wipe` facet
    with the CROSS-PATH dimension: the `data_source` table is mutated through
    TWO disjoint paths that apply DIFFERENT merge semantics. (a) PUT
    /api/datasources/{id} (Management UI Edit form) uses MapStruct
    `@MappingTarget` to FULL-REPLACE every mutable field; (b) POST
    /ingestion/datasources (S2S collector startup) UPSERTs by ODDRN and
    applies PARTIAL-MERGE of ONLY `name` + `description`. The asymmetry is
    SILENT at both ends — an operator's UI edit to a datasource's name is
    overwritten on the next collector startup with no warning; an operator's
    edit to `connection_url` is preserved because the collector never sends
    that field. Per ADR-CANDIDATE-142, the asymmetry IS deliberate (collectors
    are constrained tenants, operators are admins) — the IMPLEMENTATION GAP
    is that the asymmetry is NOT operator-visible. The UI has no awareness;
    the docs are silent. The audit-silence (no @ActivityLog on either path
    end-to-end) compounds the impact: operator returns to find name reverted
    with NO way to learn it was the collector's startup that overwrote it.
  evidence:
  - DataSourceController.java:38-45 (UI update — dataSourceService.update)
  - DataSourceServiceImpl.java:68-83 (UI service path — @ReactiveTransactional)
  - DataSourceMapper.java:49-56 (MapStruct @MappingTarget — FULL-REPLACE)
  - DataSourceIngestionServiceImpl.java:74-92 (S2S path — UPSERT-by-ODDRN narrows to name + description)
  - DataSourceServiceImpl.java:1-110 (Grep ZERO @ActivityLog on any mutating method)
  - IngestionDataSourceFilter.java (S2S filter; disjoint auth principal model)
  - concepts/detail/canonicalisation_candidates/upsert-by-oddrn-partial-merge-collector-driven-only-name-description.yaml
  - ADR-CANDIDATE-142 (back-link via DataSourceController sidecar)
  cross_pillar_compounds_with:
  - F-008 (Batch Ingestion — primary source for the S2S UPSERT path)
  - F-021 (Activity Feed — the audit-trail surface that does NOT record either write path)
  - F-020 (Collector lifecycle — credential surface whose startup triggers the overwrite)
  fix_proposal: |-
    Per-field `operator_set` boolean OR `last_updated_by` enum
    (operator | collector) on DataSourcePojo; collector UPSERT respects
    `operator_set` flags; UI shows a lock icon next to operator-owned
    fields. Add `@ActivityLog` on both write paths.
  severity: HIGH
  drift_class_strengthening: true
