behaviour: |-
  **GET /api/resource/MANAGEMENT/{anyId}/permissions returns HTTP 400 USR001
  ("Resource type MANAGEMENT does not have context") but the OpenAPI spec at
  components.yaml:3387 declares MANAGEMENT as a valid PermissionResourceType
  enum value — spec-vs-runtime contradiction.** Calling
  getResourcePermissions(MANAGEMENT, anyId) triggers BadUserRequestException at
  PermissionServiceImpl.java:25-27 → ControllerAdvice → HTTP 400 USR001 with
  body "Resource type MANAGEMENT does not have context". A spec-compliant client
  built strictly from openapi.yaml would believe MANAGEMENT is valid; runtime
  rejects it. Adjacent risk: adding a new contextual PolicyTypeDto value without
  a corresponding ContextualPermissionExtractor bean raises
  IllegalArgumentException at PermissionServiceImpl.java:47-48 which has NO
  dedicated handler in ControllerAdvice — surfaces as HTTP 500 with body
  "Internal Server Error" losing the diagnostic message.
