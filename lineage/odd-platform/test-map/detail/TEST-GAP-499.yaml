behaviour: |-
  Silent-204 + always-fire-activity-event regression-pin for deleteTermFromDataEntity (MEDIUM — audit-trail noise). Three semantically-different outcomes are indistinguishable to the caller: (a) a manual link existed and was removed, (b) only a description-link existed and was NOT removed (the WHERE clause filters IS_DESCRIPTION_LINK.isFalse() at TermRelationsRepositoryImpl.java:84), (c) no link existed at all. All three return 204 No Content. There is NO 404 surface (no switchIfEmpty). The matching activity event ALWAYS fires — @ActivityLog(event = TERM_ASSIGNMENT_UPDATED) annotates the service method unconditionally (TermServiceImpl.java:183); TermAssignmentActivityHandler re-queries the data-entity's terms-list BEFORE and AFTER (TermAssignmentActivityHandler.java:23-43); a no-op DELETE yields BEFORE = AFTER but the event row is still written. Auditors investigating 'who removed term T from entity E' see an activity event that LOOKS like a real removal but where nothing actually changed. The signal-to-noise ratio of GET /api/activity is degraded for term-management investigations. Combined with the REFACTOR-217 DELETE-half auth-bypass (TEST-GAP-489), unauthorized callers can BOTH succeed-on-no-op AND generate misleading audit-feed entries. Cross-pillar P-06 (Glossary integrity / audit trail) + P-07 (Activity Feed signal quality). Test would assert the documented behaviour pin: (a) DELETE on non-linked pair returns 204 silently AND (b) activity row is created with BEFORE=AFTER.
test_class: missing-edge-case
