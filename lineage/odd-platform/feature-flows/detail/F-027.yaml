    DataEntityAttachmentController class sidecar; together the two
    close the LSN-001 + LSN-002 primary-source picture at the
    storage-strategy bean-factory layer. The class is gated by
    `@ConditionalOnProperty(value = "attachment.storage",
    havingValue = "REMOTE")` so it materialises only under REMOTE
    mode (the LSN-001 exit posture for production deployments).
