expected_outcome: |
  STRESS_A1 + STRESS_A2 PROBE: pin the actual HTTP response when ActivityController.getActivity
  is called with degenerate `size` values.

  The controller's `final Integer size` parameter (ActivityController.java:26) has
  no @Max, no @Min, no @NotNull. The OpenAPI spec marks SizeParam as `required: true`
  (components.yaml:4226) but the Java method signature accepts null.

  Expected outcomes by size value:
  - size=null: STATIC-INFERRED MEDIUM — Spring may reject at binding step (OpenAPI required)
    OR pass through to controller. If through, JOOQ .limit(null) omits LIMIT, full unbounded
    scan, HTTP 200 with all rows.
  - size=0: STATIC-INFERRED HIGH — LIMIT 0, HTTP 200 with empty array []
  - size=-1: STATIC-INFERRED MEDIUM — Postgres rejects LIMIT -1; ControllerAdvice's generic
    Exception handler returns HTTP 500. THE PROBE-NEEDED CASE.
  - size=Integer.MAX_VALUE (2.1B): STATIC-INFERRED HIGH — DB plans full scan, HTTP 200

triggers:
  - ActivityController.java:26 — `final Integer size` (no validation annotations)
  - components.yaml:4226 — `required: true` on SizeParam (contradicts the Java nullable binding)
  - ReactiveActivityRepositoryImpl.java:292 — `.limit(size)` (JOOQ accepts null and negative)
  - ControllerAdvice.java:61-66 — generic Exception handler mapping to HTTP 500

