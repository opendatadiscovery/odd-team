security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      Frontend route-level gates are effectively ABSENT across the
      route registry: 10 of 10 enriched route sidecars (5 from batch ZH,
      5 from batch ZI) confirm the same pattern. The only route-level
      gate in the SPA is RestrictedRoute at ManagementRoutes.tsx:101-110
      (Associations). Every other route — whether bare or wrapped in
      WithPermissionsProvider — renders for any authenticated user.
      Backend posture varies: dataQuality dashboard endpoint
      PROBE-NEEDED P-090; QueryExampleController has @PreAuthorize on
      3 of 13 endpoints; RelationshipController has none (confirmed ZE);
      TermController has SecurityRules on 9 of 14 mutating endpoints;
      ActivityController has none (confirmed ZI); SearchController has
      none for any /api/search* path (confirmed batch M + ZE + ZI);
      DirectoryController has none (confirmed batch T + ZI);
      Management API endpoints individually gated at the controller
      layer per the batch-ZD/ZF/W sidecars.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Every enriched route renders catalog-wide content with no
      current-user predicate at the UI layer. The data fetches
      happen in inner components; backend owner-scoping varies. Most
      surfaces are cross-owner read by intention; the activity
      type=MY_OBJECTS dispatch is the lone owner-respecting per-route
      branch.
  strengths:
    - |-
      Read-only surface posture IS consistent with ADR-CANDIDATE-003 +
      the broader read-collaborative cross-owner enumeration pattern.
      The architectural intent is intentional and uniform.
    - |-
      Per-mutation backend gates DO catch the write side regardless
      of UI permissive posture.
  weaknesses:
    - |-
      The sibling-route 'contrast' originally cited (gated
      /lookup-tables vs bare /data-quality) was a MISREADING — the
      wrapped /lookup-tables is also not route-gated. The actual
      contrast is RestrictedRoute (Associations only) vs everything
      else.
    - |-
      A reviewer auditing route-level RBAC by reading App.tsx alone
      sees `WithPermissionsProvider allowedPermissions=[...]` and
      reasonably concludes the route IS gated; it is not. This is
      a name-vs-behaviour drift in the Provider component, surfaced
      first at batch ZH.
    - |-
      Under auth.type=DISABLED, every batch-ZH/ZI route is anonymously
      reachable — catalog-wide DQ aggregate / Lookup Tables /
      Management catalogs / Glossary terms / Data Modelling Query
      Examples + Relationships / Activity / Directory / Search all
      visible without authentication. The full catalog enumeration
      surface (entities + relationships + activity history +
      data-source inventory + facets) becomes anonymous.
    - |-
      **NEW batch ZI** — the Activity feed exposes ownership-change
      events that reveal user-owner associations (per the
      ActivityController sidecar). Combined with the bare /activity
      route, a minimum-privilege authenticated user enumerates the
      USER-OWNER ATTRIBUTION GRAPH by reading the audit trail.
      Severity HIGH if user-owner association is itself sensitive.
  cross_file_inconsistencies:
    - |-
      Triangulated across 12 contributing sidecars (2 from batch ZC,
      5 from batch ZH, 5 from batch ZI). No sidecar disputes the
      claim. The original 'data-quality vs lookup-tables contrast'
      framing is REFINED by batch ZH into 'no route-level gates
      anywhere except Associations' and EXTENDED by batch ZI to all
      five remaining primary user-facing routes (activity, directory,
      search, queryExamples, relationships).
