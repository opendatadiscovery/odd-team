name: Category-row status-tile six-status backend guarantee — silent cross-tier coupling
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  `TestCategoryResults.sortedResults` (TestCategoryResults.tsx:19-25)
  uses a `flatMap(f => (f ? [f] : []))` to drop statuses absent from
  `results[]`. In production this drop branch is DEAD CODE because the
  backend `DataQualityCategoryMapperImpl.addMissingStatuses`
  (DataQualityCategoryMapperImpl.java:45-60) injects a zero-count
  `DataQualityRunStatusCount` for every `DataEntityRunStatus` value
  not already present — so every category's `results[]` always has all
  six entries. The UI's correctness (stable horizontal tile alignment
  across category rows) depends on this backend mapper invariant —
  but the UI does NOT assert it, and the backend invariant is NOT
  marked load-bearing for the UI. NEW invariant, batch ZC (2026-05-22).

  The corner case the silent coupling produces:
    If the backend `addMissingStatuses` regresses (a refactor drops
    it, a new endpoint forgets to call it, a future caller passes a
    partial categoryResults), category rows would show a varying
    NUMBER of tiles — the dashboard's horizontal alignment breaks
    silently (one row has 6 tiles, another has 4); no warning, no
    test failure, just visual inconsistency.

  The pattern is the classic "trust the upstream invariant without
  asserting it" cross-tier coupling. Severity LOW today (no production
  trigger), but it's a latent UI fragility AND an undocumented backend
  responsibility. A backend maintainer refactoring the mapper has no
  signal that the dashboard depends on the six-status guarantee.

  The fix options:
    (a) UI-side defence: change `flatMap(f => f ? [f] : [])` to
        `map(f => f ?? {status: <enum-value>, count: 0})` — emit
        zero-count placeholders for any missing status. Cost: a few
        lines of code; the UI becomes resilient to a backend
        regression at the price of duplicating the backend's
        addMissingStatuses logic at the UI tier.
    (b) Backend-side annotation: mark `addMissingStatuses` as
        load-bearing for the dashboard UI (a comment, an integration
        test). Cheap; preserves the single-source-of-truth at the
        backend.
    (c) Both: (a) for defence in depth + (b) for documentation.

  vocabulary_status: codebase-anchored. The cross-tier coupling is an
  architectural artefact not named in the user-facing docs.
vocabulary_status: codebase-anchored
