behaviour: |-
  silent-200-on-missing-pair regression-pin for upsertMetadataFieldValue (HIGH — operator-deceptive). PUT /api/dataentities/{id}/metadata/{field_id} is named UPSERT in the OpenAPI but the implementation is pure UPDATE. ReactiveMetadataFieldValueRepositoryImpl.update at lines 95-104 issues `DSL.update(METADATA_FIELD_VALUE).set(VALUE, ...).set(ACTIVE, pojo.getActive()).where(METADATA_FIELD_ID.eq(...).and(DATA_ENTITY_ID.eq(...))).returning()`. If no row exists for the (dataEntityId, metadataFieldId) pair, the query matches zero rows, `mono(query).map(r -> r.into(MetadataFieldValuePojo.class))` returns Mono.empty, the rest of the pipeline (search-vector refresh, mapper) is short-circuited via empty-mono propagation, and the controller returns 200 OK with empty body. The path lacks any `switchIfEmpty(Mono.error(new NotFoundException(...)))` (DataEntityServiceImpl.java:287-305). The UI's redux thunk metadata.thunks.ts:51-54 hardcodes a 'Metadata successfully updated.' success toast on any non-error response — the user is told the write succeeded when no row was touched. Same pattern as `upsertDataEntityInternalDescription` (batch G TEST-GAP-XXX) — a class-shape across DataEntityController write paths. Three semantically-different missing-pair outcomes are indistinguishable: (a) data entity X doesn't exist (no row in data_entity), (b) metadata field F doesn't exist for the global field table (caught by `MetadataFieldServiceImpl.get` 404, but only the field side), (c) valid (X, F) but no prior value row in metadata_field_value (the silent-200 path). The DataEntityServiceImpl.upsertMetadataFieldValue path does NOT do `reactiveDataEntityRepository.get(dataEntityId)` validation (unlike createMetadata which DOES at line 257-258). Test would assert: missing-pair → silent 200 with empty body (current contract); test FLIPS to 404 when the bug is fixed. Cross-pillar P-01 (Discovery / catalog metadata is what users TRUST as authoritative; silent failures undermine that trust).
