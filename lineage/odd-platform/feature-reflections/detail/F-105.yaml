    H-001/H-003 disclosures are "expected" or "surprising" to a security operator.
  seed_source: cross-pillar
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The code+doc confirm the platform's stance: metadata reads (catalog,
      policies, roles) are open to any authenticated user; only mutations and the
      Associations route are gated. Whether this matches the canonical posture of
      comparable platforms — and specifically whether RBAC POLICY CONTENTS (not
      just business metadata) being readable by non-admins is industry-normal or
      an over-disclosure — is a domain-grounding question this reflection cannot
      answer from the codebase alone. A platform may treat business metadata as
      collaborative while still gating authorization-policy internals; the F-105
      disclosure (H-003) blurs that line. This needs an SME comparison, not a
      local probe of odd-platform.
    evidence:
