pillars_affected: [P-10, P-09]
surfaced_by:
  - "CollectorsList.md:bugs_limitations_corner_cases.[3] (Token rotation has no UI-side warning about the no-grace-period semantic)"
  - "CollectorsList.md:bugs_limitations_corner_cases.[4] (Token rotation has no UI-side warning about the auth.ingestion.filter.enabled default — severity HIGH)"
  - "CollectorsList.md:security.known_security_gaps.[3,4] (no-grace-period UI silence; no-effect-when-filter-disabled)"
behaviour: |-
  **Token-rotation UI silence on TWO operational invariants unit gap.** CollectorItemToken.tsx:37-50 renders the Regenerate ConfirmationDialog with text `'Are you sure you want to regenerate token for this collector?' / 'Regenerate token for "{collector.name}"?'` — neither line warns about: (a) **no-grace-period semantic**: in-flight ingestion using the prior token will start 401-ing immediately, the operator must redeploy the collector with the new token, rotation invalidates the prior secret platform-wide. The existing backend sidecar (CollectorController.regenerateCollectorToken.md:bugs_limitations_corner_cases[0], severity HIGH) describes the operational consequence; the UI affordance does NOT surface it. (b) **no-security-effect-when-filter-disabled**: rotating a 'leaked' token on a default deployment (`auth.ingestion.filter.enabled=false`) has ZERO security effect on `POST /ingestion/entities` — the endpoint is anonymously reachable regardless. The UI promises a security property the default deployment does not enforce. NO test asserts (a) the current ConfirmationDialog text does NOT mention 'grace period' or '401' or 'in-flight'; (b) the dialog does NOT mention `auth.ingestion.filter.enabled` or 'anonymous reach'; (c) the regression-pin: a future fix adding either warning would break the test, forcing intentional re-authoring of the UI-side contract; (d) operationally — if the maintainer adds a banner under specific conditions (e.g. when the rotated collector has been recently inactive, or when the platform's filter is disabled), the test surfaces the change.
test_files_existing: []
test_files_proposed:
  path: "odd-platform-ui/src/components/Management/CollectorsList/CollectorItemToken/__tests__/CollectorItemToken.test.tsx"
  name: "regenerate_token_dialog_does_not_surface_no_grace_period_or_filter_disabled_warnings"
evidence:
  - "CollectorsList.md says (bugs_limitations_corner_cases.[3]): 'Token rotation has no UI-side warning about the no-grace-period semantic. The ConfirmationDialog at CollectorItemToken.tsx:37-50 reads Are you sure you want to regenerate token for this collector? / Regenerate token for {collector.name}? — neither line warns that in-flight ingestion using the prior token will start 401-ing immediately, nor that the operator must redeploy the collector with the new token, nor that rotation invalidates the prior secret platform-wide. The existing backend sidecar CollectorController.regenerateCollectorToken.md:bugs_limitations_corner_cases[0] (severity HIGH) describes the operational consequence; the UI affordance does not surface it. severity: MEDIUM'"
  - "CollectorsList.md says (bugs_limitations_corner_cases.[4]): 'Token rotation has no UI-side warning about the auth.ingestion.filter.enabled default. An operator rotating a leaked token on a default deployment (auth.ingestion.filter.enabled=false) has rotated a credential that has ZERO security effect on POST /ingestion/entities — the endpoint is anonymously reachable regardless of the token. The UI promises a security property the default deployment does not enforce. This is a Cornerstone-3 (configuration-as-separate-audience-surface) failure that compounds with REFACTOR-185. severity: HIGH'"
  - "CollectorsList.md says (security.known_security_gaps.[3,4]): 'No UI warning that rotation has no grace period... No UI warning that token rotation has no security effect when auth.ingestion.filter.enabled=false — the platform's default deployment.'"
