notes: |-
  This canonicalisation candidate extends the F-006 audit-silence pattern beyond
  RBAC / Owner / Datasource mutations. The DataQuality severity-change is the
  FIRST mutation in the catalog that:
    (a) IS authorization-gated (DATA_ENTITY-scoped via DATASET_TEST_RUN_SET_SEVERITY)
    (b) IS data-entity-scoped (so the schema-rooted activity table FK constraint
        does NOT block emission)
    (c) STILL emits no audit event
  Categories (a) + (b) make this the SIMPLEST F-006 remediation target — no
  schema migration needed, just add the activity event emission to the service
  method.

  Pair with the f-006-audit-silence-batch-s-9-sidecar-pattern-extension invariant
  for the cross-batch narrative; this candidate is the DATA-ENTITY-SCOPED extension
  of that pattern.
