feature_id: F-089
feature_name: |-
  Post-Logout Redirect Provenance — `post_logout_redirect_uri` is derived
  from the inbound HTTP request's Host header via UriUtils.getBaseUri,
  NOT from a configured platform.base-url allowlist; a proxy trusting
  X-Forwarded-Host propagates user-controlled values to the IdP's
  end-session endpoint
pillar_id: P-09
pillar_anchored_id: P-09:F-010
pillar_anchored_feature_name: Post-Logout Redirect Provenance
seeded_from: SHB-112
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  logout-handler-tier: 5 *LogoutSuccessHandler classes
  (AzureLogoutSuccessHandler / CognitoLogoutSuccessHandler /
  GoogleLogoutSuccessHandler / GithubLogoutSuccessHandler /
  ODDIAMLogoutSuccessHandler) — all five derive the
  post_logout_redirect_uri / logout_uri query parameter from
  `UriUtils.getBaseUri(requestUri)` where `requestUri` is
  `exchange.getRequest().getURI()` — the platform-side derived URI
  including any forwarded Host header.
