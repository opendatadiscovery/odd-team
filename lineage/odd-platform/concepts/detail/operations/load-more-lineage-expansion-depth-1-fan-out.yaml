security_aggregate:
  overall: MEDIUM
  weaknesses:
  - 'LoadMore mechanic increases backend recursive-CTE load — each click is a
    separate backend SQL round-trip; rapid LoadMore on a wide tree fires many
    parallel queries with no rate-limit'
  - 'No upper bound on the number of LoadMore clicks per session — operationally,
    a user can drive the backend repository hot path arbitrarily via UI clicks'
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - 'Each LoadMore click is a fresh backend round-trip to
    getLineageRelationsForDepthOne (the per-click hot path per batch-H
    ReactiveLineageRepositoryImpl sidecar); cost scales with branching factor at
    the clicked node'
  weaknesses:
  - 'Monotonic memory growth at the UI — no eviction, no max-size cap; a user
    accumulating 100 expansions on a 10K-graph holds 100x payload-size in Redux
    + in the rendered SVG tree'
  - 'No re-rendering optimisation as the tree grows — every node mounted as SVG
    primitives; expansion compounds the no-virtualisation cost'
notes: |-
  New concept captured in batch 2026-05-19J. The LoadMore mechanic is the primary
  way a user expands beyond the initial depth — but it is undocumented in
  /features/data-lineage. The doc's framing of "configurable upstream / downstream
  depth" suggests increasing `?d=` is the canonical expansion path; in practice
  LoadMore is the more granular tool.

  Recommended UX improvement: add a "Collapse this branch" affordance + a
  max-loadmore-cap warning + per-session expansion budget. Today the design
  trusts the user not to over-expand a graph; for a curious user or a misbehaving
  bot, the unbounded accumulation is a UI-side DoS amplification vector.
