behaviour: 'Free-string `provider` field at `ODDOAuth2Properties.java:32` (NOT the
  `Provider` enum at `Provider.java:3-5`). A typo (`provder: google`, `provider: Goggle`)
  binds cleanly; consumer-side `equalsIgnoreCase(Provider.X.name())` checks fail to
  match; deployment silently routes through generic OIDC with no provider-specific
  user enrichment, no admin-group mapping, no provider-specific logout. Also locks
  Okta/Keycloak silent-routing as deliberate design.'
