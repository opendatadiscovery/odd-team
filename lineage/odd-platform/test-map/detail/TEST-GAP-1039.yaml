  Two-step fix. (1) Add a mount-time useEffect to Activity.tsx
  that writes the computed default window into the URL via
  setQueryParams if beginDate/endDate are absent — making the
  URL deterministic. (2) Add a "Default window" admonition to
  the live doc page explaining the 6-day backward window + the
  share-determinism guarantee.

