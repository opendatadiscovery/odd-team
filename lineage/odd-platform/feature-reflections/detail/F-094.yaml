### doc_drift_findings
- hypothesis_id: H-007
  doc_url: "https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authentication/s2s"
  doc_says: "If you only need to authenticate the ingestion pipeline (collectors / push adapters), consider combining S2S with `auth.ingestion.filter.enabled: true` — and the curl example uses `X-API-Key` against `/ingestion/entities`."
  code_does: "S2S (auth.s2s.enabled) does NOT protect /ingestion/** — the /ingestion/** WHITELIST_PATHS permitAll short-circuits the authorization step BEFORE the S2S filter's authority requirement applies. And /ingestion/entities under the filter wants `Authorization: Bearer`, not `X-API-Key` (two distinct filters conflated). So the doc's defence-in-depth recommendation does not hold for the whitelisted ingestion paths, and the X-API-Key curl example only works if auth.s2s.enabled=true (a DIFFERENT mechanism than auth.ingestion.filter.enabled)."
  recommended_log_as: "Already tracked — DOC-GAP-038 (S2S/ingestion-filter conflation) + the filter sidecar's doc_drift_findings[1]. Corroboration; the new angle (whitelist short-circuits BEFORE the S2S filter) extends DOC-GAP-038's framing."

## maintainer_notes

This reflection is overwhelmingly CONVERGENT VALIDATION rather than net-new discovery: every contradicted/partial hypothesis re-derives a finding already tracked (PLT-043, PLT-051, DOC-GAP-038/082/107/240, DOC-228, REFACTOR-073/185, TEST-GAP-116..123/958). That is the expected and valuable signal for a feature that has already been through SHB-123 graduation + a Mode-B scanner review (SR-20260527T1700Z, fully-corroborated) + the F-008 / F-007 / F-030 sibling reflections. Two genuinely net-new contributions:

1. The PROMISE LAYER itself (LSN-030): 11 falsifiable operator-facing promises, projected to use_cases on the feature-flow, with use_case_coverage = 0/11 verified. This feature — the platform's single most important security control — has ZERO of its promises guarded by a real test. The matrix test (TEST-GAP-958) and the filter pins (TEST-GAP-116..123) are minted but UNIMPLEMENTED; the only test that touches this surface (BaseIngestionTest) fixes the most-open cell and asserts nothing about auth. This is the highest-value functional-test cluster in the security pillar to actually write.

2. One net-new drift class (s2s_whitelist_short_circuits_before_s2s_filter, H-007) and one net-new test demand not yet minted (the cross-tenant isolation pin, H-009 / F-094-UC-9). The S2S finding sharpens the existing DOC-GAP-038 conflation with the ORDERING insight (whitelist permitAll precedes the S2S addFilterAt), which is why even the doc's own defence-in-depth recommendation does not close the gap.

Severity posture: the live docs were corrected 2026-05-27 (the property-name + whitelist disclosures shipped), so the operator who READS the enable-security page is now informed — the residual risk is the operator who reasons from the property NAME / the auth.type knob / the YAML in isolation, and the absence of any executable or boot-time guard. The maintainer's highest-leverage action is implementing TEST-GAP-958 (the executable matrix), which simultaneously guards the DOC-228 doc matrix against drift and verifies 7 of these 11 promises in one parameterised test.
