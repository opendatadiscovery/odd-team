expected_outcome: |
  Quoting hypothesis H-004 verbatim:
  "When a large backlog of entities matures in the same window (e.g. 5,000
  entities with status_switch_time all elapsing within one hour), each tick
  processes a bounded batch so the job completes inside its 9-minute ShedLock
  window and the next tick is not skipped."

  The NO-CAP STRUCTURE is already confirmed statically (DataEntityStatusSwitchJob
  .run() collectList()s the full unbounded getPojosForStatusSwitch result — no
  .take(N), no LIMIT). What is NOT statically settle-able is the TIMING OUTCOME:
  does a single tick over a 5K-entity backlog × the soft-delete cascade fan-out
  actually EXCEED the 9-minute lockAtMostFor window? That depends on real Postgres
  latency, cascade write count per entity, and machine — it must be MEASURED.

  This probe seeds a 5K-entity DEPRECATED backlog with status_switch_time already
  elapsed, then drives ONE status-switch tick (by invoking the job's write path
  against the seeded set) and measures wall-clock duration + verifies all 5K
  flipped to DELETED in one pass.

  PASS/verdict mapping for H-004:
  - If tick duration < 9 minutes AND all 5K flipped in the single tick →
    the burst is absorbed safely → H-004 verdict flips probe-needed → confirmed
    (the no-cap structure exists but does not breach the window at 5K scale;
    record the duration + the scale headroom).
  - If tick duration >= 9 minutes (lock would release before commit) OR the job
    splits across ticks under the lock → H-004 verdict flips probe-needed →
    contradicted, severity MEDIUM, with the measured duration recorded and the
    multi-instance race window quantified. PLT-027 Thread C (add LIMIT) becomes
    measurement-justified rather than precautionary.
  - Record the per-entity cascade write count observed (pg_stat) so the LIMIT
    value in PLT-027 Thread C (proposed 200/tick) can be tuned against real fan-out.
