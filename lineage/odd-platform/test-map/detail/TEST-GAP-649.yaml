behaviour: |-
  **Pagination quiescence + LSN-017 negative-finding unit gap.** OwnersList.tsx:52-55 defines `fetchNextPage = () => { if (!hasNext) return; dispatch(fetchOwnersList({page: page+1, size, query})) }` triggered by the InfiniteScroll wrapper when the user scrolls within 200px of the bottom. Lines 57-59 wrap the 500ms `useDebouncedCallback` search. The dep array `[isOwnerCreating, isOwnerDeleting, query]` is PRIMITIVE-only (booleans + string); none are derived from the fetch response. The component is therefore LSN-017-safe by structure — no fetch-result → re-fetch loop. No test asserts (a) the pagination quiescence: `!hasNext` short-circuits the fetchNextPage dispatch; (b) the LSN-017 negative finding (current pattern does NOT exhibit the doubling shape) — a regression that introduces a derived dep would slip through; (c) the debounce coalesces 6 keystrokes into 1 dispatch. The sidecar explicitly flags the LSN-017 negative finding as a regression-pin candidate: "no test asserts that the dep array [isOwnerCreating, isOwnerDeleting, query] does not double-fire on identity changes of those flags (consistent with LSN-017 useEffect-dep-array shape; the OwnersList variant uses primitive booleans not derived objects, so the LSN-017 doubling pattern does NOT apply here)."
