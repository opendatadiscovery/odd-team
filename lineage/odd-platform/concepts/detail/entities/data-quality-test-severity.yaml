  DataQualityController (class) batch T:
    entities[DataQualityTestSeverity enum, DataQualityTestSeverityForm];
    operations[set-test-severity];
    invariants[default-MAJOR-when-unset, lone-owner-scoped-mutation-via-DATASET_TEST_RUN_SET_SEVERITY,
