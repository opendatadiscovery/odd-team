feature_name: Data entity description — Markdown content storage
discovered_from_entry_point: rest:PUT /api/dataentities/{id}/description
description: 'Operators edit a data entity''s description via PUT /api/dataentities/{id}/description.

  The body is Markdown (per the OpenAPI documentation) and is stored verbatim in

  data_entity.internal_description. The UI renders the description via

  react-markdown + rehype-raw WITHOUT rehype-sanitize. The combined

  backend-no-sanitisation + UI-renders-raw-HTML produces a stored-XSS surface.

  '
contributing_nodes:
- ts react-component:DataEntityDescription (Overview > Description cluster — InternalDescription + Markdown + useTermWiki)
- odd-platform java DataEntityController controller-method:upsertDataEntityInternalDescription
- odd-platform java service service:DataEntityServiceImpl
- odd-platform java repository reactive repository:ReactiveDataEntityRepositoryImpl
terminal_side_effect:
  side_effect_class: db-write
  description: UPDATE data_entity SET internal_description = ? — stored verbatim, no sanitisation
  evidence: 'ReactiveDataEntityRepositoryImpl.java:430-438 (setInternalDescription). Batch-H primary-source confirmation:
    the exact SQL shape is `DSL.update(DATA_ENTITY).set(DATA_ENTITY.INTERNAL_DESCRIPTION, newDescription).where(DATA_ENTITY.ID.eq(dataEntityId)).returning()`
    (lines 432-435). The SOLE pre-write transformation is `newDescription = StringUtils.isEmpty(description) ? null : description`
    (line 431) — no Jsoup.clean, no Encode.html, no length cap, no allowlist. Wrapped by `DataEntityServiceImpl.upsertDescription`
    @ReactiveTransactional (line 324) → `DataEntityInternalStateServiceImpl.updateDescription` @ReactiveTransactional + @ActivityLog(DESCRIPTION_UPDATED).'
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: Markdown body sanitisation — backend
    observed: <script>, <img onerror>, <iframe> tags stored verbatim in DB; round-trip preserves all dangerous tags
    expected: Sanitised storage (Jsoup.clean / Encode.html / allowlist) OR sanitised render (UI rehype-sanitize); ideally
      defence-in-depth at both
    drift_class: external_lib_assumes_sanitisation
    provenance: MEASURED — P-007 (run R-20260519T012123Z-P-007) PUT the XSS payload, GET back, SELECT raw column; all 3 dangerous-tag
      substrings present verbatim. Batch-H primary-source SQL confirmation at ReactiveDataEntityRepositoryImpl.java:430-438.
  - facet: Markdown body sanitisation — UI render (defence-in-depth, slice-5)
    observed: "DANGEROUS TAGS reach the rendered DOM via react-markdown + rehype-raw + no rehype-sanitize:\n  - <script> tag\
      \ present in document body (dom_has_script_tag == True)\n  - id=\"p009-xss-img\" reaches DOM (dom_has_xss_img_id ==\
      \ True)\n  - id=\"p009-xss-iframe\" reaches DOM (dom_has_xss_iframe_id == True)\nBUT event-handler attributes are STRIPPED\
      \ (likely by React's normal attribute\nfiltering on rehype-raw's setProperty path):\n  - `onerror=` attribute NOT in\
      \ rendered DOM (dom_has_onerror_attr == False)\n"
    expected: Sanitised render — rehype-sanitize strips ALL dangerous tags + attrs
    drift_class: partial_mitigation_via_unrelated_layer
    provenance: 'MEASURED — P-009 slice-5 (run R-20260519T020610Z-P-009 on commit ede5d277).

      Refines the static-layer inference. REFACTOR-218 originally inferred "rehype-raw

      + no rehype-sanitize → full XSS surface"; measurement says partial — TAGS reach

      the DOM (script execution surface remains via tag-based vectors) but

      ATTRIBUTE-based vectors (img onerror, iframe javascript:) are already

      mitigated by React''s attribute handling. This is the methodology''s

      "measured truth refines inference" principle in action — the static layer''s

      severity assessment for REFACTOR-218 stays HIGH (tag injection is still a

      surface) but the attack surface is narrower than originally inferred.

      '
  - facet: Markdown body sanitisation — UI EXECUTION (defence-in-depth, slice-6)
    observed: "Despite dangerous TAGS reaching the DOM, no EXECUTION SURFACE materialises:\n  - xss_dialog_fired == 0 (no\
      \ alert/confirm/prompt observed by Playwright's\n    page.on('dialog') hook across the post-settle window)\n  - xss_leak_count\
      \ == 0 (no requests to the attacker.example callback\n    target — the img onerror handler did not fire)\nThe execution\
      \ surface is closed by TWO unrelated browser/framework mitigations:\n  1. Chromium's HTML-parser policy of NOT executing\
      \ <script> tags inserted via\n     innerHTML / dangerouslySetInnerHTML (a long-standing browser mitigation\n     against\
      \ exactly this class of injection); AND\n  2. React's attribute filtering on the rehype-raw render path stripping\n\
      \     event-handler attributes (the slice-5 measured-truth finding above).\n"
    expected: Either no dangerous markup in DOM (rehype-sanitize) OR an explicit no-execution guarantee documented + tested
    drift_class: closed_by_browser_mitigation_not_app_layer
    provenance: 'MEASURED — P-009 slice-6 (latest run on commit ede5d277). Refines REFACTOR-218

      once more: "tag injection succeeds at the DOM layer but execution is closed by

      browser + framework mitigations". The fix (rehype-sanitize) is still warranted

      as defence-in-depth, not defence-by-luck. Future code changes (switching to

      dangerouslySetInnerHTML directly, OR a client-side template renderer that DOES

      execute embedded scripts, OR a CSP relaxation that allows inline-script

      execution) would flip these assertions and surface the regression via P-009.


      Note: a hostile payload that doesn''t rely on script-tag execution (an SVG

      payload with onload, a CSS expression, a sophisticated href javascript: URL

      without iframe) might still exercise an execution surface; P-009 currently

      pins only the COMMON attack vectors against the CURRENT render pipeline.

      Slice-7+ candidate: expand P-009''s payload corpus with OWASP XSS filter-

      evasion catalog entries to widen the empirical attack-surface envelope.

      '
  - facet: UI rehype-sanitize is ABSENT — PRIMARY-SOURCE CONFIRMED (batch J)
    observed: |-
      The shared `<Markdown>` element at
      `odd-platform-ui/src/components/shared/elements/Markdown/Markdown.tsx:84-127`
      invokes `MDEditor.Markdown` (read path) and `MDEditor` (edit path) from
      `@uiw/react-md-editor@3.25.6` with ONLY `components`, `source`,
      `wrapperElement`, `disableCopy` props — NO `rehypePlugins` override.
      The library transitively pulls in `@uiw/react-markdown-preview@4.2.2` →
      `rehype-raw@6.1.1` + 6 other rehype plugins (per `pnpm-lock.yaml:5911-5938`)
      BUT NEVER `rehype-sanitize`. Grep confirms ZERO matches of
      `rehype-sanitize` anywhere in the `odd-platform-ui/` source OR in
      pnpm-lock.yaml. The defence-in-depth depends ENTIRELY on Chromium's
      HTML-parser policy of not executing scripts inserted via
      innerHTML/dangerouslySetInnerHTML + React's attribute filtering on
      rehype-raw's setProperty path (sidecar bugs_limitations_corner_cases[0]
      severity HIGH). A future code change (switching to dangerouslySetInnerHTML,
      adopting a client-side template renderer, relaxing CSP, or using SVG
      payloads with onload) re-opens the surface invisibly. **Defence-in-depth
      breadth**: every Markdown surface in the UI is affected (alerts, queries,
      term definitions, owner descriptions, dataset-field descriptions,
      attachments) because `<Markdown>` is the SOLE Markdown renderer. PRIMARY-SOURCE
      CONFIRMED batch J.
    expected: rehype-sanitize configured at the Markdown component level OR
      application-layer sanitisation upstream
    drift_class: external_lib_assumes_sanitisation
    provenance: |-
      STATIC + MEASURED — primary-source verification at Markdown.tsx:84-127
      + pnpm-lock.yaml:5911-5938 + DataEntityDescription sidecar
      bugs_limitations_corner_cases[0] (severity HIGH) + invariants[0] +
      P-009 slice-5/-6 empirical pin (run R-20260519T020610Z-P-009).
  - facet: Permission gating is PARTIAL — Edit button gated, content NOT (batch J)
    observed: |-
      Only the Edit/Add affordance is gated by `WithPermissions permissionTo={Permission.DATA_ENTITY_DESCRIPTION_UPDATE}`
      (`InternalDescriptionHeader.tsx:40-50` + `InternalDescriptionPreview.tsx:32-40`).
      The description CONTENT itself (`<Markdown value={value} />` at
      InternalDescriptionPreview.tsx:21) renders UNCONDITIONALLY for any caller
      with `DATA_ENTITY_VIEW` on the entity. A caller without
      `DATA_ENTITY_DESCRIPTION_UPDATE` still receives the full Markdown render
      including any embedded HTML payload from a malicious writer. This is the
      read-collaborative posture (REFACTOR-024 family) — but the specific
      gating semantic is subtle: a refactor "simplifying" by wrapping
      OverviewDescription in <WithPermissions> would silently BREAK legitimate
      read access for non-editors. A reviewer easily mistakes the
      WithPermissions placement as "description gating" rather than
      "edit-button gating". PRIMARY-SOURCE CONFIRMED batch J via sidecar
      bugs_limitations_corner_cases[1] + invariants[1].
    expected: documented gating model — either explicit "Edit gated, View
      always" with operator-facing notes OR symmetric content-gating with
      a separate read permission
    drift_class: ui_hides_control_backend_doesnt_enforce
    provenance: STATIC — primary-source verification at
      InternalDescriptionHeader.tsx:40-50 + InternalDescriptionPreview.tsx:21,32-40
      + DataEntityDescription sidecar invariants[1] + implicit_adrs[1] (the
      `WithPermissions` placement around buttons-only is deliberate, per
      sidecar implicit_adrs[1] intent_anchor).
  - facet: "[[Namespace:TermName]] mention syntax is undocumented (batch J)"
    observed: |-
      The platform-specific term-mention syntax `[[Namespace:TermName]]`
      (parsed by `useTermWiki.ts:30-228` at `TERM_PATTERN` regex from
      `lib/constants.ts:177`) is documented ONLY in the InformationIcon
      tooltip at `InternalDescriptionHeader.tsx:22-28`: "You can link an
      existing term by entering information about the term according to
      the pattern [[NamespaceName:TermName]]". No public doc page covers
      the syntax, its precedence rules, what happens on lookup failure
      (the inline "Term {termName} not found in namespace {namespaceName}"
      error at useTermWiki.ts:126), OR the side-effect that mentioning a
      term AUTO-CREATES a `term_relations` row REGARDLESS of
      `DATA_ENTITY_ADD_TERM` permission (per batch-G
      upsertDataEntityInternalDescription sidecar
      bugs_limitations_corner_cases[3]). Additionally: the UI regex is
      STRICTER than the backend regex (UI requires non-empty namespace
      AND term-name; backend allows empty groups per
      `TermServiceImpl.java:67`) — a latent inconsistency.
    expected: doc page covering the syntax + the auto-link side-channel +
      the regex parity contract
    drift_class: ui_hides_control_backend_doesnt_enforce
    provenance: STATIC — primary-source verification at
      DataEntityDescription sidecar invariants[3] + doc_drift_findings[0]
      + InternalDescriptionHeader.tsx:22-28 + lib/constants.ts:177 +
      useTermWiki.ts. NEW DOC-GAP candidate.
  - facet: Shift+Enter save shortcut is undocumented (batch J)
    observed: |-
      `useTermWiki.ts:179-184` — `handleSaveMarkdownOnEnter` fires
      `handleUpdateDescription` ONLY when `e.key === 'Enter' && e.shiftKey`.
      Quiet power-user shortcut layered atop the explicit Save button. The
      InformationIcon tooltip at `InternalDescriptionHeader.tsx:20-28`
      documents the term-mention syntax but NOT the keyboard shortcut.
      No documentation in any operator-facing surface. PRIMARY-SOURCE
      CONFIRMED batch J.
    expected: documented shortcut OR removed if accidental
    drift_class: null
    provenance: |-
      STATIC — primary-source verification at useTermWiki.ts:179-184 + sidecar
      bugs_limitations_corner_cases (omission) + implicit_adrs[4] (intent —
      deliberate exclusion of plain Enter). NEW DOC-GAP candidate.
  - facet: Cancel discards in-flight edits silently (batch J)
    observed: |-
      `useTermWiki.ts:46-49` — `toggleEditMode` re-syncs
      `internalDescription = description` (the redux-stored value) on EVERY
      flip. A user who clicks Cancel then re-clicks Edit sees the LAST SAVED
      description, NOT their cancelled work. There is NO autosave, NO draft
      preservation, NO warn-on-navigate, NO undo. A user editing a long
      description who accidentally clicks Cancel loses all work
      irrecoverably. PRIMARY-SOURCE CONFIRMED batch J via sidecar
      invariants[4] + implicit_adrs[2].
    expected: at minimum a confirm-discard prompt OR a draft-preservation
      mechanism (sessionStorage / Redux UI-slice) OR a warn-on-navigate
    drift_class: null
    provenance: STATIC — primary-source verification at useTermWiki.ts:46-49
      + InternalDescriptionEdit.tsx:35 + sidecar implicit_adrs[2] (the
      `setInternalDescription(description)` line IS the explicit reset —
      it would have been trivial to omit; the maintainer chose to discard).
  - facet: Async term-resolution race condition (batch J)
    observed: |-
      `useTermWiki.ts:98-149` — `handleMarkdownChange` fires on every editor
      keystroke; for each `TERM_PATTERN` match it calls
      `useGetTermByNamespaceAndName` ONCE per unique term (memoised in
      `fetchedTerms` / `unsuccessfulTerms`). A description with 100 unique
      unresolved mentions issues 100 PARALLEL HTTP requests on first render
      (sidecar invariants[6]). The last-write-wins error state at
      useTermWiki.ts:122-128 does NOT coordinate across in-flight
      requests. Typing fast in the editor can produce parallel HTTP
      requests that race; the inline error state may flicker. The
      `fetchedTerms` cache memoises but does NOT batch. PRIMARY-SOURCE
      CONFIRMED batch J.
    expected: debounce per keystroke + batched term-resolution (single
      `GET /api/terms/resolve?ns=X&names=A,B,C` endpoint) OR a request
      coalescer at the hook layer
    drift_class: structural_amplification_surface
    provenance: STATIC — primary-source verification at useTermWiki.ts:30-228
      + sidecar invariants[6] + bugs_limitations_corner_cases (the
      "highest-likelihood regression sites" list).
  - facet: Spellcheck DOM mutation hard-codes id='md-editor' (batch J)
    observed: |-
      `Markdown.tsx:96-101` — `useEffect` queries
      `document.getElementById('md-editor')?.querySelector('textarea')?.setAttribute('spellcheck',
      'true')` on mount. The id is HARD-CODED at `Markdown.tsx:105`; two
      simultaneous `<Markdown editor>` instances on the same page would
      race for the same DOM id. Bug is DORMANT today (OverviewDescription
      is single-editor) but the contract is fragile — a multi-editor
      refactor (e.g. multi-pane comparison view) would race silently.
      The imperative DOM mutation also bypasses React's state model.
      PRIMARY-SOURCE CONFIRMED batch J.
    expected: stable per-instance ID + React-state-driven spellcheck OR
      removal of the imperative DOM mutation
    drift_class: null
    provenance: STATIC — primary-source verification at Markdown.tsx:96-101,
      :105 + sidecar invariants[6] + bugs_limitations_corner_cases.
  - facet: empty-string normalisation on description writes (batch H — STATIC)
    observed: StringUtils.isEmpty(description) is normalised to NULL before the UPDATE (line 431); an empty body and a payload-omitted
      body both produce `internal_description = NULL`
    expected: Documented behaviour — operator clearing the description should produce NULL, not empty string (consistent with
      how the UI distinguishes "no description" from "empty description")
    drift_class: null
    provenance: STATIC — primary-source verification in batch-H ReactiveDataEntityRepositoryImpl sidecar invariants/concepts
      (line 431). No probe yet — proposed local probe could PUT empty body and assert SELECT returns NULL.
  - facet: silent-UPDATE-on-missing-entity at service tier (batch I — STATIC)
    observed: 'DataEntityServiceImpl.upsertDescription (lines 323-333) is @ReactiveTransactional

      and delegates to DataEntityInternalStateServiceImpl.updateDescription + termService.handleDataEntityDescriptionTerms.

      The service tier has NO pre-existence check (contrast: createMetadata at lines

      257-258 DOES check via reactiveDataEntityRepository.get(dataEntityId).switchIfEmpty(NotFoundException);

      addDataEntityToDEG at lines 391-392 ditto). The repository''s bare UPDATE returns

      Mono.empty on missing id, the reactive chain short-circuits at the empty-Mono

      step, and the response binding at lines 329-332 (`new InternalDescription(formData.getInternalDescription(),

      linkedTerms)`) never fires — controller emits 200 OK with empty body. The asymmetry

      is curated (per batch-I implicit_adrs[4]): metadata operations create FK-dependent

      rows so they pre-check; description ops only update an existing column so they

      accept the silent-no-op. Combined with potential id-enumeration via the activity

      feed, a caller can probe ids via PUT and observe 200 vs 403 — the 200 reveals

      the permission-decision shape EVEN IF the entity doesn''t exist.'
    expected: Either symmetric existence-check OR documented silent-200 contract; a future maintainer aligning the patterns
      by adding switchIfEmpty(NotFoundException) would silently break every client depending on the silent-200 behaviour.
    drift_class: silent_write_on_missing_anchor
    provenance: STATIC — primary-source verification in batch-I DataEntityServiceImpl sidecar bugs_limitations_corner_cases[1]
      (silent-UPDATE) + invariants[3] (response binding from request payload, not post-write pojo) + invariants[5] (createMetadata
      vs upsertDescription existence-check asymmetry). Proposed local probe — PUT /api/dataentities/9999999/description (missing
      id) + assert response status == 200 AND response body is empty.
  - facet: response payload echoes request, not DB-truth (batch I — STATIC)
    observed: 'DataEntityServiceImpl.upsertDescription line 329-332 constructs response from

      `formData.getInternalDescription()` (the REQUEST payload), NOT from a post-write

      DB re-read. The empty-string-to-NULL normalisation at the repository tier (line

      431) is invisible to the caller — a PUT with `{"internal_description": ""}` gets

      `{"internal_description": ""}` in the response while the DB column stores NULL.

      A client comparing response-to-stored-value would see a mismatch on the empty-string

      case.'
    expected: response from post-write DB SELECT to confirm server-side normalisation
    drift_class: response_decoupled_from_storage
    provenance: STATIC — primary-source verification in batch-I DataEntityServiceImpl sidecar bugs_limitations_corner_cases[5]
      + implicit_adrs[6]. Local probe — PUT empty body + GET back + SELECT raw column + assert PUT echo == "" AND GET shows
      no description AND SELECT returns NULL.
