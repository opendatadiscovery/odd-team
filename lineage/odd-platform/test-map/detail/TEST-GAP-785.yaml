behaviour: |-
  **MEDIUM — R2DBCConfiguration injects `?schema=lookup_tables_schema` into the custom-pool R2DBC URL via `UriComponentsBuilder` at lines 112-119, with NO validation of the schema constant. The schema name `lookup_tables_schema` is a HARD-CODED `public static final String` at line 25 — duplicated in two other locations (ReferenceDataRepositoryImpl.java:57 + V0_0_86__create_schema_and_tables_for_custom_tables.sql:53). Drift in any one breaks Lookup Tables silently.**

  Additionally, the URL query-param injection at line 116-119 has NO validation that the operator-provided `spring.custom-datasource.url` does not already contain a `?schema=` parameter — the `UriComponentsBuilder.queryParam(SCHEMA, VALUE)` call APPENDS, potentially producing `?other=...&schema=lookup_tables_schema&schema=lookup_tables_schema` which is parser-dependent (Postgres takes the LAST value, but the platform should not depend on this).

  **Two composing risks**:

  1. **Schema constant drift across 3 locations**: a refactor renaming the schema (well-intentioned: `lookup_tables_schema` → `custom_tables_schema` for clarity) requires updating all three locations atomically. Any one missed → schema-not-found runtime error at every Lookup-Table operation (compile + boot OK; first-call failure).

  2. **URL parameter injection / collision**: an operator who points `spring.custom-datasource.url` at a deliberately-separate Postgres deployment AND wants control over the schema is silently overridden — the platform appends `?schema=lookup_tables_schema` regardless. The doc-drift finding (live `/configuration-and-deployment/odd-platform` 2026-05-20 status 200) confirms operators have NO warning that the URL is rewritten.

  **Test gap shape**: parametrised test asserting:
  1. Default config (custom keys blank) — `customConnectionPool` opens against `spring.datasource.url + "?schema=lookup_tables_schema"`; verify the URL via reflection on the pool's options.
  2. Custom URL with NO `?schema=` — the platform appends `?schema=lookup_tables_schema`; verify single query-param.
  3. Custom URL WITH `?schema=other_schema` — the platform STILL appends `?schema=lookup_tables_schema`; verify TWO `schema=` query-params present (current behaviour). PINS the silent-override surface; drives a fix to either RESPECT operator-provided schema or REJECT at boot with a clear error.
  4. Schema-constant drift detection — assert `R2DBCConfiguration.VALUE_PART_FOR_CUSTOM_DB_URL` equals `ReferenceDataRepositoryImpl.SCHEMA_NAME` equals the literal in V0_0_86. Tests THREE source-of-truth alignment.
