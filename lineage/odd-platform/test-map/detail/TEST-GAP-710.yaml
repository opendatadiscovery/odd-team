behaviour: |-
  **ActivityController `getActivity` ACCEPTS UNBOUNDED `size` AND NO RATE LIMIT — a single hostile or mis-tuned client can drive arbitrarily-expensive cross-owner audit-trail dumps.** The controller method signature at `ActivityController.java:26` declares `final Integer size` with NO `@Max`, NO `@Valid`, NO programmatic upper-bound check. The OpenAPI spec (`openapi.yaml:3206-3284`) declares no maximum. The downstream `ActivityServiceImpl.java:179-181` passes the parameter through unchanged. `ReactiveActivityRepositoryImpl.java:292` applies `.limit(size)` directly to the Postgres LIMIT clause. **A caller submitting `size=Integer.MAX_VALUE`** triggers a wide scan limited only by Postgres's plan + the partition layout; combined with `type=null` (the default — unscoped across owners) + no `@RateLimit` annotation anywhere in the controller package (verified by grep — zero matches), a single mis-tuned client can issue a wide-window cross-owner audit-trail dump. **Compounded amplification**: the `userIds` / `ownerIds` filter parameters (lines 30-31) accept arbitrary ID lists; passing `userIds=[1..N]` lets the same call probe which IDs correspond to active users via response cardinality (the response is owner-unfiltered by default, so every valid ID contributes proportionally to the response). Cost amplification: per-call work scales linearly with `size`; per-call work also scales linearly with the `userIds`/`ownerIds` list cardinality (Postgres needs to evaluate the IN clause for every row scanned). **No test catches either dimension**: `find <odd-platform> -path '*test*' -name 'ActivityController*'` returned no matches 2026-05-20; `Grep ActivityController|getActivity|api/activity` against `odd-platform-api/src/test/` returned 0 files. **Combined with TEST-GAP-706 (cross-owner read posture)** this is the DoS amplifier on top of the audit-trail exposure surface; combined with REFACTOR-024 it is the cross-owner read at scale.
