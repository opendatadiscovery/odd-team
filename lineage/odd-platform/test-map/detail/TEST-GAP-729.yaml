proposed_action: |-
  Add `OwnerAssociationDirectOwnerSyncEscalationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `createOwnerAssociationRequest_withDIRECT_OWNER_SYNCOnly_andFreshOwnerName_mintsOwnerAndSelfApprovesInOneCall` — authenticate as a user with ONLY `DIRECT_OWNER_SYNC` (no OWNER_CREATE, no OWNER_ASSOCIATION_MANAGE); POST `/api/owner_association_request` with `name: "fresh-owner-" + UUID.randomUUID()`; assert (a) HTTP 200/201; (b) `SELECT COUNT(*) FROM owner WHERE name = ? AND deleted_at IS NULL` returns 1 (the side-door minted the Owner); (c) `SELECT COUNT(*) FROM user_owner_mapping WHERE owner_id = ? AND ...` returns 1 (the auto-approve bound the caller); (d) `SELECT COUNT(*) FROM owner_association_request_activity WHERE event_type = 'REQUEST_APPROVED' AND owner_id = ?` returns 1 (the self-approve fingerprint). PIN the entire chain.
  2. `createOwnerAssociationRequest_withDIRECT_OWNER_SYNCOnly_andExistingOwnerName_selfApprovesWithoutMintingDuplicate` — pin the get half of getOrCreate: pre-seed an Owner with the target name; POST `/api/owner_association_request` with the same name; assert no duplicate Owner is created BUT the USER_OWNER_MAPPING is still created (the self-approve grants access to the existing Owner).
  3. `createOwnerAssociationRequest_withoutDIRECT_OWNER_SYNC_andFreshOwnerName_mintsOwnerButLeavesPendingRequest` — pin the half-chain: without DIRECT_OWNER_SYNC the getOrCreate STILL mints (no OWNER_CREATE check inside the service); the request goes PENDING awaiting admin approval. Assert the Owner exists AND the request is PENDING (NOT yet auto-approved).
  4. `createOwnerAssociationRequest_underAuthDisabled_anonymousUserMintsAndBinds` — pin the DISABLED-mode behaviour. Under auth.type=DISABLED, no SecurityRule fires; the service throws on `authIdentityProvider.getCurrentUser()` at line 55 (per the sidecar's positive finding — fail-fast). Assert the throw; pin the contract.
  5. `createOwnerAssociationRequest_activityFeedRecordsRequestApprovedNotRequestManuallyApproved` — pin the audit-trail distinction. The MANUAL-mapping flow (POST /api/owners/mapping) writes `REQUEST_MANUALLY_APPROVED`; the DIRECT_OWNER_SYNC self-approve writes `REQUEST_APPROVED` (the auto-approve uses the same code path as the admin-approve). Pin this so a forensic investigator can distinguish operator-admin-approve from self-approve in the activity-list.

  Pair with a follow-up backlog item proposing the fix: either (a) require OWNER_CREATE inside OwnerService.getOrCreate when called from the OwnerAssociationRequest auto-approve path; (b) split getOrCreate into get+create with separate auth surfaces; (c) feature-flag the DIRECT_OWNER_SYNC auto-approve to require an additional admin-on-approval review for fresh Owners. The most conservative is (c); the architecturally cleanest is (b). When (b) lands, tests #1 and #3 invert (the fresh-Owner case requires the dedicated OWNER_CREATE permission); test #2 remains stable.

  Cross-pair with a DOC-NNN candidate: surface the DIRECT_OWNER_SYNC auto-approve flow + the getOrCreate side-door on the live user-owner-association doc page.
