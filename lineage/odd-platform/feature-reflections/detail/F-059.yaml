# Lookup table rename cascade — product-owner reflection

## product_owner_narrative

Master Data Management (pillar P-03) is ODD's home for operator-curated reference data — the canonical code tables, lookup values, and mapping lists that downstream pipelines and BI tools join against. The pillar is intentionally narrow: today it has exactly one user-observable surface, Lookup Tables, reached from the "Master Data" toolbar tab landing on `/master-data/lookup-tables` (per the LookupTables sidecar `understanding`, and system-mission.md P-03 lines 125-141). A steward creates a lookup table, gives it a name and a namespace, adds typed columns and rows, and — the load-bearing promise of this pillar — that table becomes **directly SQL-queryable** as a real PostgreSQL relation inside `lookup_tables_schema`. The live doc page states this plainly: "Direct database access is the recommended path for downstream consumers (BI tools, ETL jobs, ad-hoc queries)" (per WebFetch 2026-06-03). The physical relation is named `n_{namespaceId}__{lowercased_underscored_name}` — derived by `buildTableName`, which lowercases the display name and replaces spaces with underscores (per ReferenceDataServiceImpl.java:191-194, source-read-for-validation 2026-06-03).

A user interacts with this feature through one screen and one modal. The list page (LookupTables) shows a counter, a search box, a permission-gated "+Add new" button, and an infinite-scroll table of every readable lookup table. Each row carries an Edit pencil (gated by `LOOKUP_TABLE_UPDATE`) that opens the `LookupTableForm` modal. The edit form presents a single Name field, a disabled Namespace field (`disabled={!!lookupTable}`), and a Description field (per LookupTables sidecar `bugs_limitations_corner_cases[2]`, `docs_link_semantic.doc_drift_findings[0]`, and the feature-flow hop-1 evidence LookupTableForm.tsx:84-93). To the operator this is an unambiguously *metadata* action: rename the catalog entry, the same way you would rename a dashboard or retitle a document. There is no warning dialog, no preview of the resulting physical table name, no opt-out, and no alias offer (per the feature-flow contributing_nodes[0] note + LookupTables sidecar).

The hidden working part is the cascade. On submit of a renamed Name, `ReferenceDataServiceImpl.updateLookupTable` rebuilds the physical table name via `buildTableName(formData.getName(), table.namespacePojo())` and — *only if the rebuilt name differs from the current one* — calls `referenceDataRepository.updateLookupTable`, which issues `ALTER TABLE … RENAME TO` (plus rename of the table's sequences and constraints) against `lookup_tables_schema` (per ReferenceDataServiceImpl.java:107-124 and ReferenceDataRepositoryImpl.java:180-202, both source-read-for-validation 2026-06-03). From the next millisecond, every downstream consumer that hardcoded the old physical name receives `relation "<old>" does not exist` — the live doc page now says exactly this. There is no deprecation view, no notification fan-out, and no `ActivityEvent` recording who renamed which table when (per ReferenceDataController sidecar `bugs_limitations_corner_cases[7]` + the feature-flow audit-silence facet + WebFetch confirmation).

This feature sits at the intersection of three pillars. Lookup tables are first-class Data Entities (`DataEntityTypeDto.LOOKUP_TABLE` inside `DATA_SET`), so the rename surfaces in Data Discovery's search and Catalog Overview (P-01 — system-mission.md cross-pillar line 475). The rename *should* feed the Activity Feed (P-07, feature F-021) but does not — the same audit-silence pattern F-057 (DQ severity edit) exhibits, which is why both are cross-pillar evidence for system-mission.md canonicalisation candidate 3 ("audit-log presence asymmetry — 2-tier audit story"). And the whole surface is read-collaborative: any authenticated user sees the global lookup-table count and every row, because the read endpoints carry no RBAC and the mutating permissions are `NO_CONTEXT` / global (per ReferenceDataController sidecar `security.known_security_gaps`).

The edge cases a product owner would flag in a demo: a "cosmetic" rename that does not change the lowercased-underscored form (e.g. "Customer Lookups" → "Customer lookups", or editing only the Description) does NOT touch the physical table — the `getTableName().equals(...)` guard short-circuits the DDL (ReferenceDataServiceImpl.java:119-122). A rename that collides with an existing physical name in the same namespace surfaces a raw Postgres error as a generic 500, not a friendly 409 (per ReferenceDataController sidecar `bugs_limitations_corner_cases[2]`). And the rename DDL takes an `ACCESS EXCLUSIVE` lock on the table, blocking concurrent reads of a popular reference table for the lock duration (per ReferenceDataController sidecar `performance.known_performance_gaps[0]`). None of these is surfaced to the operator at rename time.

