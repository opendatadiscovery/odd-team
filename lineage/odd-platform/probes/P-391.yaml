expected_outcome: |
  Hypothesis H-002 (verbatim from the reflection):

  "When a caller POSTs an AlertManager payload with labels.entity_oddrn set to a
  data entity owned by a DIFFERENT team, the platform creates an OPEN alert
  attributed to that entity, and that forged alert is then visible to every
  authenticated user on the platform-wide /alerts/all tab — even though the
  caller has no ownership of, or permission on, the targeted entity."

  Static trace (HIGH confidence, per AlertServiceImpl.java:178 verbatim mapping +
  AlertManagerController.java:21-26 no-auth handler + ReactiveAlertRepositoryImpl.java:143-145
  cross-owner listAllWithStatusOpen) predicts the secure expectation is CONTRADICTED:
  entity_oddrn is mapped with no existence/ownership/permission check, the path is
  exempt from the auth chain via SecurityConstants WHITELIST_PATHS /ingestion/**,
  and the global All tab has no owner predicate. This probe is the end-to-end
  REGRESSION-PIN the feature-flow control_summary names as the highest-leverage
  unprobed cell ("0 of 4 cells PROBED ... anonymous AlertManager POST creating
  cross-tenant alerts visible on the platform-wide All tab is the highest-leverage
  candidate"). It pins the COMPOUND (forge + cross-tenant attribution + global
  display + duplicate-on-retry) that no single per-file sidecar can assert.

stress_category: F (request-input naming alignment — entity_oddrn promises "my entity"; binds to ANY entity, unauthenticated)

triggers:
  - AlertManagerController.java:21-26 (no @PreAuthorize / @Secured / @Valid on the webhook handler)
  - AlertServiceImpl.java:178 (setDataEntityOddrn(labels.get("entity_oddrn")) — verbatim, no validation)
  - ReactiveAlertRepositoryImpl.java:143-145 (listAllWithStatusOpen — no owner predicate; REFACTOR-024)
  - ReactiveAlertRepositoryImpl.java:332-342 (createAlerts — INSERT ... RETURNING, no ON CONFLICT)
  - SecurityConstants.java:96 (WHITELIST_PATHS[/ingestion/**] exempts the path from the UI auth chain)
  - IngestionDataEntitiesFilter.java:28 (ingestion filter binds to /ingestion/entities POST only — sibling path uncovered)
  - F-007 drift_class cross_tenant_alert_creation + forge-and-display compound (REFACTOR-024)

arrange:
  - Build odd-platform from main against a docker-compose Postgres stack.
  - Run TWO scenarios for auth posture:
      (S1) auth.type=DISABLED — the anonymous-reach headline.
      (S2) auth.type=LOGIN_FORM with two seeded users in two DIFFERENT owners
           (userA->ownerA, userB->ownerB) — the authenticated-but-unauthorised case.
  - Seed a dataset Data Entity owned by ownerB with a known oddrn
    (e.g. ENTITY_B_ODDRN = "//postgres/host/db/teamB.sales") and data_entity_id 7002.
  - Confirm zero alert rows reference ENTITY_B_ODDRN before the probe.

act:
  - S1 CALL A (anonymous forge): with NO auth header, POST /ingestion/alert/alertmanager
      body {"alerts":[{"labels":{"entity_oddrn":"<ENTITY_B_ODDRN>"},
                       "generatorURL":"http://prometheus.example/graph","startsAt":"2026-06-01T10:00:00Z"}]}
  - S1 CALL B (anonymous read): with NO auth header, GET /api/alerts (the All-tab feed).
  - S2 CALL C (cross-owner forge): authenticated as userA (ownerA), POST the same
      AlertManager payload targeting ENTITY_B_ODDRN (owned by ownerB).
  - S2 CALL D (third-party read): authenticated as userB (or any third user), GET /api/alerts.
  - S2 CALL E (idempotency cross-check): repeat CALL C identically (Prometheus-retry simulation).

observe:
  - kind: rest_response
    target: S1 CALL A
    capture: [status_code]            # static trace predicts 204 No Content (accepted, unauthenticated)
  - kind: rest_response
    target: S1 CALL B
    capture: [status_code, body]      # does the forged alert on ENTITY_B_ODDRN appear to an anonymous reader?
  - kind: rest_response
    target: S2 CALL C
    capture: [status_code]            # predicts 204 — any authenticated user may POST; no ALERT_CREATE permission exists
  - kind: rest_response
    target: S2 CALL D
    capture: [status_code, body]      # does a third user (not ownerB) see the forged alert on the All tab?
  - kind: db_state
    target: alert table after CALL C + CALL E
    capture: [row_count_for_ENTITY_B_ODDRN]   # 1 if idempotent (it is NOT); 2 confirms the no-ON-CONFLICT duplication

oracle:
  pass_if:                            # the SECURE behaviour the secure expectation would WANT
    - S2 CALL C.status_code in (401, 403)      # cross-owner forge rejected
    - AND S1 CALL A.status_code in (401, 403)  # anonymous forge rejected
  fail_if_forge_and_display:          # the static-trace prediction (secure expectation contradicted)
    - S1 CALL A.status_code == 204
      AND S1 CALL B.body contains an alert whose data_entity_oddrn == ENTITY_B_ODDRN
  fail_if_authenticated_cross_owner:
    - S2 CALL C.status_code == 204
      AND S2 CALL D.body contains an alert whose data_entity_oddrn == ENTITY_B_ODDRN
  fail_if_no_idempotency:
    - row_count_for_ENTITY_B_ODDRN == 2 after CALL C + CALL E

