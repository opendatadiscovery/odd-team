name: Bind Owner to Data Entity (with optional DEG propagation)
canonical_in_docs: true
canonical_candidate: false
description: '`POST /api/dataentities/{data_entity_id}/ownership` — gated by `DATA_ENTITY_OWNERSHIP_CREATE`
  per-data-entity Permission via SECURITY_RULES (SecurityConstants.java:215-217).
  `OwnershipServiceImpl.create` runs under `@ReactiveTransactional` + `@ActivityLog(event
  = OWNERSHIP_CREATED)`: `Mono.zip(ownerService.getOrCreate(owner_name), titleService.getOrCreate(title_name))`
  → ownership-row INSERT → optional propagation to children if data-entity is a DEG
  → search-index refresh → mark `data_entity_filled.OWNERS` → mapDto. **Side-effecting
  auto-create**: novel `owner_name` silently creates an Owner directory row; novel
  `title_name` silently creates a Title directory row. Both side-doors past their
  respective create-side permissions. **Activity-event emission CONFIRMED** for the
  ownership-binding (contrast OwnerController.createOwner which has NONE — the audit
  decision is per-write). DEG propagation (`propagate=true` on a Data Entity Group
  target) cascades the ownership row to every child via `createOrUpdate` with `onConflictOnConstraint(...).doUpdate().set(TITLE_ID,
  excluded)` — children with existing ownership rows for this Owner are RE-TITLED,
  NOT skipped.'
