# GenAI free-text proxy (POST /api/genai/ask) — product-owner reflection

## product_owner_narrative

The GenAI Assistant is ODD's first and only generative-AI surface, and the
canonical example of a feature whose product name promises far more than the code
delivers. Sold in the pillar mission as "broker AI questions to an external
service" (per system-mission.md:202 P-07 one-line capability) and named, in the
canonical concepts catalogue, the "GenAI Assistant" (per concepts.yaml:1473), it
is in implementation a 11-line reactive HTTP forwarder: `POST /api/genai/ask`
takes a single free-text field, forwards it verbatim as `{"question": "..."}` to
whatever URL the operator wired at `genai.url`, and hands the response back
(per GenAIController.md:understanding + GenAIServiceImpl.java:41-43 cited therein).
ODD embeds no model, adds no catalog context, applies no prompt template, and
performs no safety filtering — the live feature page is candid about this,
calling the platform "a thin proxy" (per WebFetch
features/active-platform-features/genai 2026-06-01). The audience the feature
nominally serves — an analyst who wants to "ask my data catalog a question" — is
not who the implementation serves; the implementation serves whatever external
service the operator runs, and trusts it completely.

A user interacts with the feature today only programmatically. There is no UI
affordance: a grep over odd-platform-ui/src for the generated GenaiApi client
returns zero hand-written callers (per GenAIController.md:bugs[9] +
GenAIProperties.md:bugs[4]), and both the live config page and feature page state
"API-only today" verbatim (per WebFetch 2026-06-01). The input is a single JSON
field `{"body": "<question>"}`; the output is a single JSON field
`{"body": "<answer>"}` (per GenAIController.md:concepts.entities). The feature is
opt-in and ships disabled — `application.yml:18` writes `genai.enabled: false`
explicitly, not by primitive default (per GenAIProperties.md:implicit_adrs[0]).
To turn it on, an operator must set three keys: `genai.enabled` (re-read on every
request), `genai.url`, and `genai.request_timeout` (the latter two baked into the
genAiWebClient bean at startup, requiring a restart to change — per
GenAIProperties.md:implicit_adrs[2] + WebFetch config page 2026-06-01).

The working parts are deliberately few, and that minimalism is itself the product
stance. There is no batching, no streaming, no response cache, no retry, no
circuit breaker (per GenAIProperties.md:performance.throughput + implicit_adrs[4]).
The only request-time logic beyond "forward the bytes" is: (a) the enabled gate
at the SERVICE tier — when `genai.enabled=false` the service throws
BadUserRequestException -> HTTP 400 "Gen AI is disabled" (per
GenAIServiceImpl.java:37-39 cited in GenAIController.md:invariants), which is
notably DIFFERENT from the sibling DataCollaboration EventApiController that
404s its route via `@ConditionalOnDataCollaboration` when disabled; and (b) the
response unwrap — a CharMatcher quote-trim plus StringEscapeUtils.unescapeJava
that silently assumes the external service returns a bare JSON-quoted string
(per GenAIController.md:concepts.invariants.response-unwrap-brittle).

The integration story is sparse by design but cross-pillar-relevant in three
directions. To P-09 (Security): the endpoint carries no RBAC entry, no
GENAI_USE Permission, no SecurityConstants rule — it falls through to the
catch-all `.authenticated()` matcher, so the platform's read-collaborative
posture (any authenticated user can read most things) extends here AS A WRITE
that costs real money on the operator's LLM account (per feature-flow
cross_pillar_relationships P-09 + GenAIController.md:security.known_security_gaps[0]).
To P-11 (Developer surface): the only consumer is the OpenAPI-generated SDK; the
developer audience is the one that can reach it (per feature-flow
cross_pillar_relationships P-11). To P-07 itself: were audit logging ever added,
the natural home for a GENAI_USAGE event is the Activity Feed (F-021); were
authorization ever added, the natural home for a GENAI_USE permission is RBAC
(F-006) (per feature-flow related_features).

The edge cases a product owner would flag in a demo are the ones that turn this
feature from "minimal" into "hazardous when enabled carelessly". Enable it with
only `genai.enabled=true` and the two unset keys collapse to `url=null` +
`request_timeout=0` — the platform boots clean and reports the feature enabled,
then every single call fails with a confusing user-facing diagnostic ("Gen AI
request take longer that 0 min" — note the typo, and note that the message frames
a misconfiguration as a slow response) (per GenAIProperties.md:bugs[0] +
GenAIController.md:stress_findings.tunables). Point `genai.url` at an internal
address and the platform's egress identity makes the outbound call with no scheme
allowlist — an SSRF surface (per GenAIController.md:bugs[6]). And the headline
edge case: because there is no authorization gate, no rate limit, no body-size cap,
and no audit log, a single authenticated low-privilege user — or, under
auth.type=DISABLED, an anonymous one — can drive arbitrary, untraced, unredacted
cost on the operator's AI vendor account at HTTP-client speed (per
GenAIController.md:security.known_security_gaps[0-5]). This is the "operator
follows our guide off a cliff" scenario for the AI-vendor-billing audience.

## hypotheses

- id: H-001
  hypothesis: |-
    When a least-privilege authenticated user (no admin role, no GenAI-specific
    permission, default role at user creation) calls POST /api/genai/ask under
    LOGIN_FORM / OAUTH2 / LDAP with genai.enabled=true, the request succeeds and
    the external LLM is invoked on the operator's account — i.e. there is no
    permission/role gate that restricts who may incur GenAI cost.
  derivation: |-
    The endpoint is named "ask" inside a feature called "GenAI Assistant"; the
    pillar mission lists "broker AI questions" as a primary action with no
    role qualifier; an operator paying per-token would expect, by default, that
    only a privileged subset (or a metered subset) can spend their AI budget.
  seed_source: pillar
  sme_consultation_recommended: true
  sme_consultation_question: |-
    Do data-catalog operators running an external-LLM integration expect a
    per-role / per-permission gate on who may consume the model by default, or is
    "any authenticated catalog user may ask" the industry-normal posture (cf.
    DataHub's AI features, Atlan's natural-language query, OpenMetadata)?
  sme_consultation_archetype: implicit-requirements
  validation:
    verdict: contradicted
    actual_behavior: |-
      There is no authorization gate anywhere on the request path. GenAIController
      has no @PreAuthorize and no programmatic permissionService.hasPermission(...)
      call; the generated GenaiApi interface carries no authorization annotations;
      PolicyPermissionDto has no GENAI_USE Permission; and SecurityConstants has no
      SECURITY_RULES entry and no WHITELIST_PATHS entry for /api/genai/**. Under
      OAUTH2/LDAP the path falls through to AuthorizationCustomizer.java:29
      `pathMatchers("/**").authenticated()`; under LOGIN_FORM it falls through to
      LoginFormSecurityConfiguration.java:57 because the path is not in
      `permittedPaths` (lines 49-51). Three of four auth modes require
      authentication only; the fourth (DISABLED) requires nothing. A default-role
      viewer is functionally identical to an admin for this endpoint.
    evidence:
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: stress_findings.auth_gates
        cite: "GenAIController.java:13-24 + SecurityConstants.java:95-355 + AuthorizationCustomizer.java:22-30 + LoginFormSecurityConfiguration.java:49-57"
        note: "Full auth-mode matrix traced; no Permission/Role gate in any mode."
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: security.known_security_gaps[0]
        cite: "GenAIController.java:13-24 + SecurityConstants.SECURITY_RULES (no /api/genai/* rule)"
        note: "No GENAI_USE Permission exists in PolicyPermissionDto."
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: stress_findings.probes_emitted
        cite: "lineage/odd-platform/probes/P-160.yaml"
        note: "P-160 pins the admin==viewer outcome end-to-end against WireMock."
    operator_visible_failure: |-
      (1) Cost injection by any insider — a read-only viewer, a contractor with a
      default account, or any compromised low-privilege credential can fire
      requests at HTTP-client speed, each one charging the operator's external LLM
      account, bounded only by the vendor's own throttling. (2) No principal
      attribution — combined with the no-audit-log finding (H-005), the operator
      cannot answer "which user ran up this bill" from platform data alone. (3)
      Permission-creep regression risk — because no test pins the current
      "authenticated-only" posture, a future maintainer adding
      @PreAuthorize(GENAI_USE) could silently break SDK consumers relying on the
      absence, or the absence could silently persist when policy intends a gate.
    severity: HIGH
    confidence: HIGH
    probe_id: P-160        # already emitted by the file-analyser; status pending-stress-protocol
    routes_to_finding: bug-candidate

- id: H-002
  hypothesis: |-
    When an operator enables the feature by setting ONLY genai.enabled=true
    (omitting genai.url and genai.request_timeout), the platform refuses to start
    or surfaces a clear configuration error at boot — i.e. a half-configured
    feature fails fast, not silently.
  derivation: |-
    Negative-space + LSN-002 case-law: a Principal engineer expects an enabled
    integration with a null endpoint and a zero timeout to fail fast at startup,
    not to boot clean and fail every runtime request with a misleading message.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The feature boots clean and reports enabled. GenAIProperties uses Java
      primitives with no initializers and no validation: `String url` defaults to
      null, `int requestTimeout` defaults to 0; the class carries only
      @ConfigurationProperties + @Data — no @Validated, no @NotBlank/@URL/@Min(1),
      no @PostConstruct validate(). WebClientConfiguration builds the genAiWebClient
      with baseUrl(null) and Duration.ofMinutes(0) — both legal at bean
      construction, neither throws at boot. Every subsequent POST then fails: with
      url=null the outbound call fails before reaching the external service
      (HTTP 500, generic GenAIException); with request_timeout=0,
      Duration.ofMinutes(0) trips ReadTimeoutException immediately and the user
      sees "Gen AI request take longer that 0 min" (typo: "that" should be "than").
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_config_properties__config-properties-class__GenAIProperties
        section: bugs_limitations_corner_cases[0]
        cite: "GenAIProperties.java:8-12 (no validation annotations, no initializers) + WebClientConfiguration.java:22-29"
        note: "No fail-fast; bean constructs with null baseUrl + zero Duration."
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: stress_findings.tunables
        cite: "WebClientConfiguration.java:23 + GenAIServiceImpl.java:48-51 + GenAIProperties.java:11"
        note: "request_timeout=0 -> immediate ReadTimeoutException -> the typo'd message."
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: stress_findings.probes_emitted
        cite: "lineage/odd-platform/probes/P-161.yaml"
        note: "P-161 pins the zero-timeout default-failure mode."
    operator_visible_failure: |-
      (1) The operator believes the feature is working (boots clean, gate reports
      enabled) until the first real question fails. (2) The diagnostic actively
      misleads: "request take longer that 0 min" frames a static misconfiguration
      as an intermittent slow-response problem, sending the operator to investigate
      the external service's latency rather than their own YAML. (3) The url=null
      and timeout=0 cases produce DIFFERENT HTTP 500 bodies, so the operator cannot
      even rely on a consistent error to diagnose. This is the LSN-002 regional
      analogue (MinIO .region(...) unset -> us-east-1): an unset parameter shipping
      silent misbehaviour instead of a startup failure.
    severity: HIGH
    confidence: HIGH
    probe_id: P-161        # already emitted by the file-analyser
    routes_to_finding: bug-candidate
    note: |-
      Mitigation already partly in place on the DOCS side: the live config page
      (WebFetch 2026-06-01) carries a warning admonition naming this exact failure
      ("Setting only genai.enabled=true will silently misconfigure the feature ...
      Always set all three keys when enabling"). That makes this a documented
      caveat, NOT an undocumented trap — but the CODE still ships the silent
      failure, so the bug-candidate (add @Min(1) + @NotBlank/@URL fail-fast) stands.

- id: H-003
  hypothesis: |-
    When genai.enabled=false (the shipped default) and a user calls
    POST /api/genai/ask, the request is rejected with a clear "disabled" response
    and no outbound call to the external service fires.
  derivation: |-
    Endpoint shape + the disabled-by-default invariant: a disabled feature must
    not silently forward, and must not charge the operator's account.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      The service-tier gate fires first: GenAIServiceImpl.java:37-39 checks
      `if (!genAIProperties.isEnabled())` and returns
      Mono.error(new BadUserRequestException("Gen AI is disabled")), which
      ControllerAdvice.java:24-28 maps to HTTP 400 with code BAD_REQUEST. The
      cardinality of the outbound call on the disabled path is 0 — the short-circuit
      happens before webClient.post() (per the feature flow terminal_side_effect
      cardinality_per_call). The live config page documents this verbatim ("When
      false, POST /api/genai/ask returns HTTP 400 with the message 'Gen AI is
      disabled'").
    evidence:
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: concepts.invariants
        cite: "GenAIServiceImpl.java:37-39 + ControllerAdvice.java:24-28"
        note: "Disabled path returns HTTP 400; no outbound call."
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_config_properties__config-properties-class__GenAIProperties
        section: docs_link_semantic.fetched_excerpts
        cite: "application.yml:17-18 (genai.enabled: false) + live config page"
        note: "Disabled-by-default is explicit YAML, and the 400 behaviour is documented."
    confidence: HIGH
    routes_to_finding: none

- id: H-004
  hypothesis: |-
    When genai.enabled=false, the GenAI endpoint behaves like a not-deployed
    feature — i.e. it returns HTTP 404, consistent with how ODD's other
    feature-flagged endpoints (e.g. DataCollaboration's EventApiController) hide
    themselves when disabled.
  derivation: |-
    Cross-pillar / consistency: a developer-audience SDK consumer who learns ODD's
    convention from one feature-flagged controller expects the next one to behave
    the same way.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      GenAI returns HTTP 400, not 404, when disabled. The controller bean is
      ALWAYS registered (no @ConditionalOnProperty on the class), so the route is
      always reachable; the gate is at the service tier (BadUserRequestException ->
      400). The sibling EventApiController carries @ConditionalOnDataCollaboration,
      so its bean is NOT registered when disabled and the route returns 404. Two
      sibling controllers, two opposite conventions for "feature flag off". Both
      are internally consistent; the inconsistency BETWEEN them is the finding.
    evidence:
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: implicit_adrs[1]
        cite: "GenAIServiceImpl.java:37-39 + GenAIController.java:13-24 (no @ConditionalOnProperty) + contrast EventApiController.java:15 (@ConditionalOnDataCollaboration)"
        note: "GenAI=400 reachable-but-gated; DataCollaboration=404 not-registered."
    operator_visible_failure: |-
      An SDK consumer or operator probing "is this feature available" gets
      different signals from sibling endpoints: a 404 reads as "not deployed / not
      in this build" while a 400 reads as "deployed but you sent a bad request" —
      which can send a developer hunting for a request-body error that does not
      exist. The divergence is benign (both responses are debuggable) but it is a
      real cross-feature consistency defect on the developer surface, and it is
      undocumented — neither convention is called out as the deliberate choice.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-005
  hypothesis: |-
    When a user submits a GenAI question, the platform records who asked what (an
    audit trail of principal + question + timestamp) so an operator can later
    reconstruct usage and investigate abuse.
  derivation: |-
    Negative-space + pillar mission ("the platform is itself an actor" — actions
    the platform takes on the operator's behalf are auditable elsewhere in P-07,
    e.g. the Activity Feed); an action that spends money with no record is an
    operational blind spot a senior PO would flag.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      No audit trail exists. GenAIServiceImpl declares @Slf4j but makes ZERO log.*
      calls anywhere on the request path; the controller has no Logger field. The
      ServerWebExchange parameter on the controller method
      (GenAIController.java:19-20) — which exposes the user Principal,
      X-Forwarded-For, User-Agent, and trace context via
      exchange.getPrincipal()/getRequest().getHeaders() — is declared but never
      read. There is no GenAI interaction persisted to the database, no
      GENAI_USAGE Activity event. The only trace of a call is whatever the reverse
      proxy and the external service log independently.
    evidence:
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: bugs_limitations_corner_cases[3]
        cite: "GenAIServiceImpl.java:35-52 (no log.* calls) + GenAIController.java:19-23 (ServerWebExchange unreferenced)"
        note: "No audit log; the Principal is available-but-unused (Category F Q5 fix-anchor)."
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: downstream_side_effects (log-emit)
        cite: "GenAIController.java:13-24 + GenAIServiceImpl.java:35-52"
        note: "log-emit cardinality_per_call == 0 — itself the finding."
    operator_visible_failure: |-
      (1) Forensic vacuum — when the AI bill spikes or a prompt leaks sensitive
      data, the operator cannot answer "who, what, when" from ODD; they must
      cross-reference reverse-proxy access logs (which have no question body) with
      the external vendor's logs (if any). (2) No usage analytics — the operator
      cannot see which teams use the feature or whether it delivers value. (3) The
      fix-anchor is already present and discarded — reading the ServerWebExchange
      to log Principal + question is a small change, which makes the absence a
      deliberate-looking gap rather than a structural impossibility.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: |-
    When a user submits a question containing PII or secrets (an email, a credit
    card number, an API key pasted by mistake), the platform redacts or at least
    detects it before forwarding to the external LLM, so sensitive data does not
    silently cross the operator's trust boundary.
  derivation: |-
    Negative-space + data-exposure: operators pointing genai.url at a third-party
    SaaS LLM (the typical case) are subject to that vendor's data-retention policy;
    a data-catalog product handling potentially-sensitive metadata would, by
    default, be expected to guard the boundary.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The question text is forwarded verbatim. GenAIServiceImpl.java:41-43 builds
      the outbound body as Map.of("question", request.getBody()) with no scrubber,
      no allowlist, no PII/secret detection, no length cap, no system-prompt
      overlay. The live feature page confirms the stance ("No prompt modification:
      Questions are forwarded verbatim") and now also explicitly states "No PII
      redaction. The user's question text ... flows verbatim to the external LLM"
      (WebFetch 2026-06-01). So the behaviour is real AND now documented.
    evidence:
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: security.known_security_gaps[4]
        cite: "GenAIServiceImpl.java:41-43 + WebClientConfiguration.java:26-29"
        note: "Verbatim forward; no redaction or content filter."
      - sidecar: odd-platform__java__GenAIController__controller-class__GenAIController
        section: docs_link_semantic.fetched_excerpts
        cite: "WebFetch features/active-platform-features/genai 2026-06-01"
        note: "Live page now states 'No PII redaction ... flows verbatim'."
    operator_visible_failure: |-
      (1) Sensitive content leaves the trust boundary — any authenticated user can
      paste secrets/PII into a question and it reaches the configured external
      service, subject to that vendor's retention. (2) Prompt-injection content is
      equally unfiltered (see H-007). The mitigating fact is that the live docs now
      disclose this clearly, so it is a documented design stance rather than a
      hidden defect — which is why this routes to caveat (already largely satisfied)
      rather than bug. The residual action is whether the PRODUCT should offer an
      optional scrub hook, which is a roadmap question, not a doc gap.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-007
  hypothesis: |-
    When a user submits a prompt-injection / jailbreak payload (role-override text,
    system-prompt-overriding instructions), the platform neither filters it nor
    leaves a trace of it — i.e. the platform applies no safety boundary and an
    operator cannot detect the attempt from platform data.
  derivation: |-
    Endpoint-shape (free-text body, unconstrained) + the "assistant" framing implies
    some safety posture; a senior PO asks where the safety boundary is and confirms
    whether the platform abdicates it entirely.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      The platform applies no safety boundary and leaves no trace. The body is
      forwarded verbatim (GenAIServiceImpl.java:41-43) with no content scan; there
      is no log of the prompt (H-005). The live feature page is explicit that
      injection handling "falls to your external service implementation" (per
      concepts.yaml:1506 strengths + WebFetch 2026-06-01). The hypothesis
      (no filter AND no trace) is exactly what the code does — confirmed as a
      deliberate thin-proxy stance, with the operator-relevant nuance that the
      no-trace half compounds the no-filter half.
