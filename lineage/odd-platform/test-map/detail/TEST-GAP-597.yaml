proposed_action: |-
  Unit test on GithubUserHandler. (a) Mock WebClient to return a List of 30 teams none of which match adminGroups, with a Link header indicating page 2 contains the matching team. (b) Mock provider.organizationName + adminGroups=['target-team']. (c) Invoke enrichUserWithProviderInformation. (d) Assert resulting authorities = {USER} (silently demoted — page 2 not fetched). (e) Pin the limitation. Future fix adding Link-header pagination flips assert.
