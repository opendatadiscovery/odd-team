- id: H-002
  hypothesis: |-
    When an operator deploys ODD without setting
    `odd.data-entity-stale-period` (the key is stripped from the Helm
    values / ConfigMap / Docker environment overlay), the staleness
    indicator continues to work and at minimum some signal tells the
    operator it is off.
  derivation: |-
    Negative-space: an operator expects a load-bearing signal to either
    default safely or announce its own death. Cross-ref facet 1 +
    LSN-001/LSN-002 silent-default footgun class.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The predicate's second conjunct is `stalePeriod != null`
      (DataEntityStaleDetector.java:15). If the @Value-bound integer
      resolves null (key absent from the operator overlay), the predicate
      short-circuits to false for EVERY entity — the signal is dead
      platform-wide. There is no @PostConstruct validator, no startup INFO
      log, no admin-visible banner. The shipped application.yml default IS
      7 days (application.yml:211, verified SR-20260527T2330Z), so the
      footgun materialises only when an overlay deliberately strips the
      line — but for that case it holds completely.
    evidence:
      - sidecar: "(unresolved) service:DataEntityStaleDetector"
        section: predicate-guard
        cite: "DataEntityStaleDetector.java:15"
        note: "stalePeriod != null guard => false for all entities when unset"
        source_read_for_validation: true
      - sidecar: feature-flow F-208 scanner_reviews
        section: primary_source_verifications
        cite: "application.yml:211"
        note: "shipped default is `data-entity-stale-period: 7 # days`"
      - sidecar: "(unresolved) ui-shell-widget:MetadataStale"
        section: render
        cite: "MetadataStale.tsx:31"
        note: "isStale false => returns null => zero icons, looks healthy"
        source_read_for_validation: true
    operator_visible_failure: |-
      An operator whose overlay omits the key sees every entity reported
      fresh forever — the load-bearing "a source stopped publishing"
      signal is silently dead. There is no diagnostic affordance anywhere:
      no log line at startup, no error, no admin indicator, and because
      the widget renders null on isStale=false, the entire UI surface
      shows ZERO orange clocks and is visually identical to a perfectly
      healthy platform. This is the LSN-001 / LSN-002 silent-default
      footgun class: the same default that hides the misconfiguration also
      hides the absence of the signal across every list/detail/lineage
      view. An operator following the docs into a stripped overlay reaches
      a worse-than-broken state because everything looks fine.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
