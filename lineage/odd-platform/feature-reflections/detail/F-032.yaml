# Catalog-wide Data Quality Dashboard — product-owner reflection

## product_owner_narrative

The Catalog-wide Data Quality Dashboard is Pillar P-04's second user-observable surface and its one *aggregate* view: where the per-dataset Test Reports tab (F-022) answers "how is THIS dataset's quality", the `/data-quality` page answers "how is the WHOLE catalog's quality at a glance" (per `DataQuality.md` understanding + the feature-flow `description`). Its audience, per every contributing sidecar's `concepts.audiences` and `system-mission.md` P-04, is the data-quality engineer and the data-platform operator opening the page to triage: how many tables are healthy, how many are monitored, how the test results break down by status, and the per-category spread of outcomes. The pillar's load-bearing constraint is that **the platform is an aggregator, not a checker** — "Quality checks are not performed inside ODD Platform" (per WebFetch `data-quality` 2026-05-25, quoted in `DataQualityRunsController.md` and `system-mission.md` P-04 line 149) — so everything on this page is a projection of test-run data that arrived earlier via the ingestion pipeline (P-10). It is a pure READ surface: no mutation, no db-write, no activity-emit (per `DataQuality.md` + the feature-flow `terminal_side_effect`).

A user reaches the feature through exactly one URL — `/data-quality`, the static path returned by `dataQualityPath()` (per `DataQuality.md` understanding) — mounted as a bare `<Route>` at `App.tsx:73` and reachable from the unconditional "Data Quality" top-bar tab (`ToolbarTabs.tsx:45-49`). The page is a two-pane shell: a sticky left filter sidebar (`DataQualityFilters`) and a scrolling content pane (`DataQualityContent`), both wrapped in a feature-scoped jotai `Provider` so the filter state is mount-local (per `DataQuality.md` invariants + `DataQualityProvider.tsx:4-6`). The content pane issues exactly one aggregate fetch — `GET /api/dataqatests/runs` (operationId `getDataQualityTestsRuns`) — and projects the single `DataQualityResults` DTO into three `DonutChart` rings plus one `TestCategoryResults` card per backend test category (per `DataQualityContent.md` understanding). The single backend contract is `DataQualityRunsController`, which fans out server-side to three parallel CTE queries (`getLatestDataQualityRunsResults` / `getLatestTablesHealth` / `getMonitoredTables`) and zips them into one envelope (per `DataQualityRunsController.md:36-43`).

The working parts a product owner would demo: **three rings** — Table Health (Healthy / Warning / Error table counts), Test Results Breakdown (per-status counts, up to six slices), Monitored Tables (monitored vs not-monitored table counts) — and **per-category cards**, alphabetically sorted, each showing a category name, a large total, and a fixed row of six per-run-status count tiles (per `DataQualityContent.md` operations + `TestCategoryResults.md` understanding). The **filter sidebar** carries two independent blocks — "Filters for tables" and "Filters for tests" — each with the same five dimensions (Namespace, Datasource, Owner, Title, Tag), writing ten distinct keys into the jotai store, with the table-side keys `de`-prefixed (per `DataQualityFilters.md` understanding). Each filter change re-derives the query and immediately refetches the dashboard — there is no Apply button (per `DataQualityStore.md` name_behavior_pairs: `formFiltersAtom` over-promises a draft stage the code does not have). The filter selection is mirrored into the URL query string so a filtered view is bookmarkable and shareable (per `DataQualityFilters.md` implicit_adrs[2]).

The integration story has three legs (per the feature-flow `cross_pillar_relationships`): the dashboard **feeds-from P-10 Integrations** — every count it shows was pushed via the ingestion pipeline as already-computed DQ test runs; it is a **sibling-consumer with P-07 Alerting (F-007)** — a failing DQ run is the same signal F-007 turns into a `FAILED_DQ_TEST` alert, where this dashboard visualises the aggregate and the alert pillar reacts to each individual failure; and it **shares catalog-metadata list APIs with P-08 Management** — the five filter autocompletes read the same Namespace / Datasource / Owner / Title / Tag lists the Management lifecycle surfaces operate on. A load-bearing detail of the third leg: the "Title" filter binds at the SQL layer to `OWNERSHIP.TITLE_ID` (an ownership ROLE such as "Data Steward"), the same TITLE table the Owner-association surfaces use — not to any dataset name (per `DataQualityFilters.md` bugs_limitations_corner_cases[0] + `ReactiveDataQualityRunsRepositoryImpl.java:301,309` cross-quoted by the controller sidecar).

Five edge cases a product owner would flag in a demo, each a place where the assembled chain diverges from what an operator opening the screen would reasonably expect: (a) the page is reachable by **any authenticated user** — no permission guard at the route, no `@PreAuthorize`, no SecurityRule entry, no owner predicate in the SQL — so a minimum-privilege user sees the catalog-wide health of every dataset (per `DataQualityRunsController.md` implicit_adrs[1] + the SecurityConstants audit); (b) a single backend run-status outside the six-value enum throws an uncaught `TypeError` at `DataQualityContent.tsx:47-48` and **blanks the whole dashboard**, not just one ring (per `DataQualityContent.md` bugs_limitations_corner_cases[0]) — this one is now PINNED RED by IT-004 + the boundary-class IT-006, both run 2026-06-02; (c) the "Test Results Breakdown" ring counts **tests by their latest run status, not runs** — the LSN-019 class on the dashboard (per `DataQualityRunsController.md` bugs[0]); (d) a **failed fetch is indistinguishable from an empty catalog** — three grey "No data" donuts, no error UI (per `DataQualityContent.md` bugs[5]); (e) the operator's **filter slice resets to all-empty on navigate-away-and-back** unless they bookmarked the `?...` URL (per `DataQualityStore.md` bugs[1]). The whole `components/DataQuality/` subtree has **zero unit/component test coverage** (Grep over `odd-platform-ui/src/**/*.{test,spec}.{ts,tsx}` for `DataQuality` returned zero files, 2026-06-04), and the backend controller has **zero HTTP-level test coverage** (Grep over `odd-platform-api/src/test` for `DataQualityRunsController`, 2026-06-04) — so every promise below ships a regression with the build green. **The promise-layer headline (LSN-030): 0 of 13 user-facing promises are verified by a test that asserts the intended behaviour.** The two e2e pins that exercise this screen (IT-004 / IT-006) assert the CRASH, not the promise — they are regression guards for the H-004 failure mode, not verifications that the dashboard does what it promises.

