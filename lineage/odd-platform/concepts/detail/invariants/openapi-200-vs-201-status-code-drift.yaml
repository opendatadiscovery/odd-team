notes: |
  NEW cross-cutting hygiene invariant captured in batch 2026-05-12F.
  Pattern expanded across batches W + ZD; now 13+ endpoint-level
  instances across 9+ controllers.

  The drift has shipped — test suites lock in the implementation,
  not the spec. A fix to align EITHER side must coordinate:
    - Fix the spec (declare 200 everywhere): silently changes the
      contract for downstream SDK consumers; aligns to test reality.
    - Fix the implementation (return 201 to match spec): breaks every
      existing test that asserts isOk(); surfaces the drift to test
      maintainers in a single CI run.

  The maintainer's call. The catalog records the pattern so future
  audits + DOC-NNN passes have a discoverable anchor.

  Surface as canonicalisation candidate AND a refactoring-scope item
  (small focused per-endpoint alignment; ~13+ files touched depending
  on audit scope).
