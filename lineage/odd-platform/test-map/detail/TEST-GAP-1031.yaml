behaviour: |-
  **`@ConfigurationProperties("odd")` at `AdditionalLinkProperties.java:6` claims the entire `odd.*` Spring prefix, but the record only binds the `links` sub-field.** The other `odd.*` keys are consumed elsewhere via `@Value` reads:
  - `odd.tenant-id` — `ExternalMetricReader.java:53` (verified)
  - `odd.platform-base-url` — `SlackMessageGeneratorConfiguration.java:15` (verified)
  - `odd.data-entity-stale-period` — `DataEntityStaleDetector.java:10` (verified)
  - `odd.activity.partition-period` — additional `@Value` consumer

  This is a legitimate Spring pattern (relaxed-binder + `@ConfigurationProperties` only binds the declared fields, ignoring siblings by default) but a FRAGILE one: if anyone ever adds `(ignoreUnknownFields = false)` to this annotation — a common hardening change in security audits or in upgrading to stricter binding — the application will FAIL TO BOOT because the binder sees `tenant-id`, `platform-base-url`, `data-entity-stale-period`, etc. as "unknown" sibling keys under the `odd` prefix.

  Test gap shape: integration test forcing `ignoreUnknownFields=false` (via test-only override of the annotation, or via a custom `Binder` config) and asserting the platform fails to boot — pinning the latent foot-gun.

  LOW because (a) the failure mode requires someone to deliberately add `ignoreUnknownFields=false`, (b) the failure is fail-fast (no silent corruption), (c) the mitigation is to refactor each `@Value` consumer onto its own `@ConfigurationProperties` POJO or to narrow this annotation's prefix to `odd.links`.
