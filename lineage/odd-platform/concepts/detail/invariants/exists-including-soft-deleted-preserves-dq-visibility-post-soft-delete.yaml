name: existsIncludingSoftDeleted preserves DQ visibility post-soft-delete (ADR-shaped invariant)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-04
- P-01
description: |-
  **NEW ADR-SHAPED INVARIANT, batch 2026-05-20T (DataQualityController class
  sidecar)** — four of the five DataQualityService methods (getDatasetTestReport,
  getSLA, getSLAReport, setDataQualityTestSeverity) start with
  `reactiveDataEntityRepository.existsIncludingSoftDeleted(datasetId)
   .filter(e -> e).switchIfEmpty(... NotFoundException ...)`
  (DataQualityServiceImpl.java:55-57, 67-77, 96-98). This is a DELIBERATE choice
  to use the existsIncludingSoftDeleted variant rather than the unrelated `exists`
  variant.

  **The intent**: a dataset marked deleted (soft-delete via `deleted_at` timestamp
  / `is_deleted` boolean / `STATUS = DELETED` per the three-soft-delete-mechanisms
  architectural observation from batch I) but NOT YET hard-purged by housekeeping
  STILL surfaces its historical DQ signal. This matters for audit / forensic /
  'what happened before deletion' workflows.

  **The naming convention asserts intent**: `existsIncludingSoftDeleted` is a
  publicly-named method on ReactiveDataEntityRepository — the repository surface
  EXPLICITLY exposes the soft-delete-permissive existence check as a first-class
  primitive. Service callers consciously choose between the two variants;
  DataQualityServiceImpl picks the permissive one for DQ reads.

  **Asymmetric across the codebase**: NOT every read path uses
  existsIncludingSoftDeleted. The lone exception within DataQualityService is
  getDatasetTests, which checks `getDataQualityTestOddrnsForDataset` for emptiness
  instead (DataQualityServiceImpl.java:38-42) — an inconsistent asymmetry that
  this invariant flags for review. Within DataQualityController, the four-out-of-five
  uniformity is a strong signal of intent for the DQ surface, but a sweep across
  other services would reveal which features prefer 'forget post-soft-delete' vs
  'preserve post-soft-delete' as their visibility default.

  **The cross-cutting concern**: ODD's three-soft-delete-mechanisms architecture
  (deleted_at timestamp / is_deleted boolean / STATUS = DELETED) creates a vocabulary
  problem at the service layer — what does 'exists' MEAN for a soft-deleted entity?
  The DQ surface answers: 'preserve historical signal; an entity exists as long as
  its row exists in the table, regardless of its soft-delete flag'. Other surfaces
  may answer differently.

  Severity: LOW (the invariant is intentional and well-named; the concern is
  consistency across other features — see mitigation_unimplemented).
