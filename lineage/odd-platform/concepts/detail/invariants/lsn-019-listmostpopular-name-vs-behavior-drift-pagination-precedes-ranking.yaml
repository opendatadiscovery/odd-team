mitigations_unimplemented:
  - |-
    FIX A (preferred) — move the ORDER BY count DESC inside the paginate
    window. Refactor `ReactiveTagRepositoryImpl.listMostPopular` to:
      (1) build an inner select that computes per-tag counts:
          `SELECT tag.*, sum(count) AS popularity FROM tag
           LEFT JOIN (tag_to_data_entity + tag_to_dataset_field)
           GROUP BY tag.id`
      (2) wrap with `paginate(..., [(popularity, DESC), (TAG.ID, ASC)], offset, size)`
          — making popularity the primary sort key and tag.id the
          tie-breaker for stable pagination.
    This delivers the promised popularity ordering AND keeps tag.id ASC
    as the deterministic tiebreaker for equal-count tags. Cost: the
    aggregation runs over the FULL tag table on every call (acceptable
    for typical tag counts; if the table grows beyond ~10K rows, add a
    materialised view).
  - |-
    FIX B (cheap) — relabel the surface. Rename `listMostPopular` to
    `listOldestTagsRankedByCount` (verbose but truthful); update the
    OpenAPI description; update the UI label from "Top Tags" to
    "Oldest Tags by Use" or similar. Operators get truthful framing;
    the implementation stays as-is. This DOES NOT solve the operator's
    actual need (find the most-used tags); it just stops lying.
  - |-
    FIX C (compromise) — gate the popular-tags surface on a feature
    flag. Disable the misnamed endpoint by default; only operators who
    have explicitly opted in see "Top Tags". The operator's tag-search
    facet (the other use of this endpoint) is less affected because
    the substring filter usually narrows the candidate pool below
    `size`.
  - |-
    Add the regression test pinning the truth. The test is already
    sketched in TagController.md:tests_coverage_semantic.uncovered_behaviours
    (35 tags fixture, every entity tagged by all 35, size=30 → assert
    response contains IDs 1..30, NOT IDs 31..35). Probe P-010 captures
    this; the next step is converting it into a Testcontainers-backed
    @SpringBootTest in TagRepositoryImplTest.java or TagControllerTest.java.
    Once the regression test lands, future refactors that change the
    behaviour MUST acknowledge the change (the test fails until
    intentionally updated).
  - |-
    Document the LSN-019 drift on the live docs page
    /features/data-discovery/tagging — explicit admonition: "The Top
    Tags UI surface returns the oldest tags in your catalog, not the
    most-used. For an accurate popularity ranking, refer to [future
    proper-popularity-ranking endpoint when FIX A lands]."
  - |-
    Audit sister candidates per the cross-cutting drift class:
    enumerate every Java method with `paginate(...)` inside a CTE
    that is later aggregated then re-ordered by a non-id column.
    The Stress Protocol's B-category will surface these mechanically
    on subsequent file-analyser passes.

