# =============================================================================
# query-gold-set.yaml — the maiden-acceptance gold set for the graph query layer
# =============================================================================
#
# Per adrs/drafts/research/graph-query-layer/PROBES.md. This file is the
# retrieval-quality gate: ~60 queries with hand-labelled answer sets. The
# graph+vector layer replaces the grep/Python query path only once it beats
# (or matches) the baseline on every query class AND clears the absolute
# floors — see the maiden acceptance gate.
#
# AUTHORING / REVERSE-FIT DISCIPLINE (PROBES.md §"The query gold set"):
#   1. Every question + answer_set here was derived from INDEPENDENT GROUND
#      TRUTH — the lineage/odd-platform/ substrate files (nodes.jsonl,
#      edges.jsonl, the reducer detail/ + index files, concepts/), the
#      odd-platform codebase, and the ODD documentation — NOT from the query
#      layer's own output. That is the anti-reverse-fit rule.
#   2. This draft is AI-authored; it is `draft-pending-maintainer-review`.
#      The maintainer reviews and ratifies every entry — that review is what
#      satisfies PROBES' "maintainer-authored" requirement. Edit freely:
#      tighten answer sets, drop weak queries, add blind-spot queries.
#   3. The adversarial / capability-negation round (maiden-gate item 5 — three
#      queries for capabilities that DO NOT exist; the layer must return empty)
#      stays SEPARATE and is authored fresh per /probe Type-4. It is not here.
#   4. Grow this set by one query per LSN blind-spot incident — permanent
#      regression coverage.
#
# SIX QUERY CLASSES and the metric each is scored by:
#   feature-locate   -> MRR        (one canonical home; first hit is the answer)
#   depends-on       -> recall@20  (a missed dependent is a silent gap)
#   concept-discuss  -> recall@20  (completeness over a cross-axis join)
#   dedup-nearest    -> MRR        (succeeds registry-search's core job)
#   impact-of-change -> nDCG@10    (graded — direct callers outrank 3-hop)
#   cross-axis-join  -> recall@20  (a deterministic structural class)
#
# ABSOLUTE FLOORS the candidate must clear (PROBES thresholds table):
#   feature-locate / dedup-nearest : MRR       >= 0.75
#   depends-on / concept-discuss   : recall@20 >= 0.90
#   impact-of-change               : nDCG@10   >= 0.80
#   cross-axis-join                : recall@20 >= 0.90  (PROBES envisions a
#       deterministic exact-set match; the current harness scores it through
#       query() as recall@20 — route it through traverse() for true exact-set
#       in a harness v0.2. Noted for the maintainer.)
#
# answer_set grades (load-bearing only for nDCG@10): 3 = primary / canonical
#   home, 2 = strongly related, 1 = peripheral-but-correct.
#
# Run the harness:  uv run lineage-extractor query-probe odd-platform
# =============================================================================

meta:
  status: draft-pending-maintainer-review
  authored_by: "Claude (drafted from substrate + odd-platform code + ODD docs)"
  authored_at: 2026-05-21
  pinned_commit: 76a61fd
  substrate_scan_commit: ede5d277
  query_count: 60
  note: >
    Answer sets are labelled against the substrate at pinned_commit. A substrate
    refresh past that SHA triggers a maintainer re-label of any query whose
    nodes moved. Several queries are deliberately hard (synonym-swapped
    dedup-nearest, multi-hop depends-on) so the gate is real, not a rubber stamp.

