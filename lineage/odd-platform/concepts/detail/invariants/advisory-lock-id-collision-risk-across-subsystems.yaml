notes: |-
  Promoted to a NEW cross-cutting invariant in batch 2026-05-12D after
  the third primary-source sidecar (DataCollaborationProperties)
  surfaced this as a per-feature weakness. STRENGTHENED batch 2026-05-20X
  with the fourth-sibling-with-NO-lock observation from SessionConfiguration.

  Now 4-sidecar triangulated across all known advisory-lock-using subsystems
  PLUS the one asymmetric non-using subsystem.

  The same observation appears in the "202+queue+Postgres-advisory-lock
  single-sender pattern" invariant's notes (which named the lock-ID
  candidates 90/100/110/120 by convention). That invariant is the
  ARCHITECTURAL PATTERN (when to use this lock-shape); this invariant
  is the COLLISION-AVOIDANCE concern (how to keep the IDs disjoint
  across the subsystems that already use the pattern, and how to fold
  in the one subsystem that DOESN'T use it).

  Recommended cleanup: introduce an `AdvisoryLockId` enum with the four
  named values + a fifth `SESSION_HOUSEKEEPING` value, replace the per-
  Properties-class `int` fields with the enum, add a `@PostConstruct`
  validator to a top-level configuration-validator bean. This makes the
  invariant code-enforced rather than convention-enforced. The validator
  should also assert every `@Scheduled` job has either `@SchedulerLock`
  OR a Postgres-advisory-lock wrapper — failing on the housekeeping
  outlier.

  Cross-cutting connections:
    - housekeeping-job-no-scheduler-lock-multi-instance-amplification (batch X
      NEW) — the SessionConfiguration asymmetry finding
    - spring-session-timeout-minus-one-housekeeping-noop (batch X NEW) —
      compound finding on the same housekeeping job
    - The 202+queue+Postgres-advisory-lock single-sender pattern — the
      architectural pattern this invariant catalogues collision-risk for
