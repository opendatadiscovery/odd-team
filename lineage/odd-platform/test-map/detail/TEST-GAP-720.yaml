behaviour: |-
  **CRITICAL — F-004 SECOND surface inside the auto-link side-channel.** While F-004's batch-J primary-source captures the description-render XSS surface (`<script>` in the description body), this sidecar discovers a SECOND persistence vector via the term-mention staging mechanism: a payload SHAPED LIKE A TERM MENTION — `[[<script>alert(1)</script>:foo]]` — is parsed by the regex `\[\[([^:]*?):([^\]]*?)\]\]` at `TermServiceImpl.java:67`, partitioned into `(namespace=<script>alert(1)</script>, name=foo)`, and the unhandled-mention staging code (`buildDataEntityUnknownTerms` at `TermServiceImpl.java:501-522`) INSERTs a row into `data_entity_description_unhandled_term` with `term_namespace_name = <script>alert(1)</script>` (lowercased) and `term_name = foo`. The staging row persists indefinitely (until a matching term is later created, triggering `resolveUnhandledDescriptionMentions`).

  **Persistence shape**: the staging table columns are `varchar(255)` (term_name) and `varchar(64)` (term_namespace_name) per `V0_0_91__add_term_to_term.sql:18-19` (verified by reading the migration). The lowercased payload survives until either: (a) the matching term is later created (then the staging row is migrated to a real `data_entity_to_term` link row with `is_description_link=TRUE`); (b) the description is edited to remove the mention; (c) the parent data entity is hard-deleted. None of these reliably fires for a maintainer who has not noticed the payload.

  **Exfiltration shape**: any subsequent `getDataEntityTerms` / `getDatasetFieldTerms` call that surfaces unhandled mentions can return the raw payload verbatim — the XSS payload re-emerges through the API. The read endpoints DO surface unhandled mentions per the sidecar's `bugs_limitations_corner_cases.[3]` analysis. If a UI consumer renders the staging-row's `term_namespace_name` field (Glossary search results, autocomplete dropdowns, term-relationship visualisations), the payload could execute in a NEW DOM context distinct from the F-004 description-render context.

  **Trust model break**: an attacker with `DATA_ENTITY_DESCRIPTION_UPDATE` permission alone (no `DATA_ENTITY_ADD_TERM` needed — see TEST-GAP-478 for the auto-link side-channel) can plant a payload that persists IN A LONG-LIVED STAGING ROW visible to any authenticated user across the catalog (read-collaborative posture). Even if F-004's defence-in-depth (CSP, Trusted Types, future rehype-sanitize) eventually closes the description-render path, this staging-row resurfacing channel is a SEPARATE surface not currently in scope of the F-004 mitigation discussion.

  **Sanitisation responsibility split — currently NEITHER layer sanitises**: TermServiceImpl's `findTermsInDescription` (`TermServiceImpl.java:337-360`) treats the regex match groups as opaque strings; `buildDataEntityUnknownTerms` (`TermServiceImpl.java:501-522`) inserts the lowercased groups verbatim. The description-write path at `DataEntityServiceImpl.upsertDescription` (`DataEntityServiceImpl.java:325-328`) also does not sanitise before invoking `handleDataEntityDescriptionTerms`. Sanitisation MUST happen at description-write time (F-004's recommendation) OR at term-mention staging time (this gap's recommendation) — currently neither layer sanitises.

  **Why CRITICAL not HIGH**: this is a CONCEPTUALLY NEW surface within an already-CRITICAL F-004 family. The persistence shape (long-lived staging row) is fundamentally different from the inline description render — fixing F-004's description-render does NOT close this channel. The cross-component nature (description-write → auto-link parser → staging-table → future read API) means it spans P-01 (Discovery's description editing) + P-06 (Glossary's term-mention semantics) + P-09 (the side-channel bypass of DATA_ENTITY_ADD_TERM). Three-pillar surface elevates severity.
