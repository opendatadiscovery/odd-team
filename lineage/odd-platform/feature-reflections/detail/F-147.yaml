- id: H-007
  hypothesis: "A row visually communicates that it is clickable — a user scanning the list can tell the rows are actionable before clicking one."
  derivation: "Product-owner UX seed (Rule 9 — 'does the user understand how to use this from what is on screen'): if the entire row is the click target, the affordance must be discoverable, not hidden."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      The row signals clickability to MOUSE users only, and weakly. S.Container has a hover
      background-change (the styled-component hover state referenced in the F-147.yaml a11y facet), which
      gives a mouse user a hover cue. But there is no cursor:pointer guarantee surfaced in the read, no
      explicit "open" affordance, no chevron/arrow, no link-styled name. For a first-time user the row reads
      as a data table row (it has column headers above it via TableHeader, Results.tsx:139), so the
      expectation set by the layout is "this is a table" not "every row is a button" — the whole-row
      navigate is a hidden behaviour discovered by clicking. For keyboard/AT users there is no cue at all
      (H-003). So the affordance is partially communicated (hover, for mouse) and partially hidden (no
      persistent visual signal; nothing for non-mouse input).
    evidence:
      - sidecar: "(source read — ResultItem.tsx, hop-1 sidecar unresolved)"
        section: render
        cite: "ResultItem.tsx:72-76"
        note: "Whole-row onClick with no link-styling/chevron/role; hover cue only. source_read_for_validation: true."
      - sidecar: "(source read — Results.tsx)"
        section: render
        cite: "Results.tsx:139 (TableHeader above the rows)"
        note: "Column-headered table layout sets a 'table' mental model, not a 'each row is a button' one."
    operator_visible_failure: |
      (1) A first-time user may not realise the whole row is clickable (the layout reads as a sortable table),
      and may hunt for an 'open' button or click only the name. (2) Mouse users get a hover cue but
      keyboard/AT users get nothing (compounds H-003). (3) The mismatch between 'looks like a data table' and
      'behaves like a list of buttons' is a discoverability gap; a link-styled name cell would resolve both
      the affordance signal and (with a real anchor) H-003/H-004.
    severity: LOW
    confidence: MEDIUM
    source_read_for_validation: true
    use_case_kind: render
    coverage: unverified
    test_demand: functional
