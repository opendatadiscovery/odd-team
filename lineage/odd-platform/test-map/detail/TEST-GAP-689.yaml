behaviour: |-
  **`RoleServiceImpl.create` HAS NO NAME-RESERVATION GUARD — `Administrator` and `User` are reserved against UPDATE / DELETE but not CREATE.** Lines 49-61 (create) have NO check against `formData.getName().equals(UserProviderRole.ADMIN.getValue())` or `.USER.getValue()`. The constants ARE consulted at line 43 (list admin-detection), 68 (update Administrator block), 81-82 (delete predefined-name block), 104 (update User-rename block) — FOUR distinct sites — but NOT on the create path. The only protection is the DB partial UNIQUE INDEX (V0_0_55__add_policies_and_roles.sql:42), which: (a) protects WHILE the seeded rows are live; (b) DOES NOT protect if the seeded row is ever soft-deleted out-of-band; (c) produces a `UniqueConstraintException` (translated to 'Role with this name already exists' per ExceptionUtils.java:57-59, HTTP 400) rather than the cleaner `BadUserRequestException` the rest of the file emits. The single-line fix at line 50-51 closes it. The test pins the CURRENT permissive behaviour as the regression baseline AND demonstrates the case-sensitive bypass route (creating 'administrator' lowercase — see TEST-GAP-690 sister gap).
