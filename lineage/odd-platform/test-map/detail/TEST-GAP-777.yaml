behaviour: |-
  **CRITICAL (HIGH-by-criticality, escalated by compound risk) — SessionConfiguration wires ZERO cookie-security attributes. No `CookieWebSessionIdResolver` bean, no `SameSite` directive, no `HttpOnly` override, no `Secure` flag setter. Combined with `spring.session.timeout: -1` (sessions never expire) AND LOGIN_FORM's hardcoded-ADMIN posture (TEST-GAP-774), a stolen session cookie grants permanent ADMIN access to the catalog.**

  **Verified by grep at the entire repo level**: `grep CookieWebSession|SameSite|HttpOnly|Secure.*cookie|sessionIdResolver|WebSessionIdResolver` over odd-platform returned ZERO matches. The platform does NOT override Spring WebFlux's framework defaults at any layer. Spring's defaults for the session cookie are:
  - `HttpOnly`: true (Spring's default — mitigates JavaScript-side cookie theft via XSS)
  - `Secure`: NOT SET — the cookie travels in plaintext on HTTP deployments
  - `SameSite`: lax (permits cross-site GET / top-level navigation cookie leakage — sufficient against trivial CSRF but inadequate against state-changing endpoints accepting cookie-auth GET)
  - `Domain` / `Path`: not configured (cookie scoped to the issuing host's full path)

  **Compound risk** (the CRITICAL escalation):
  - Cookie has no `Secure` flag → on HTTP deployments, observable in transit (operator MUST front the platform with TLS + a reverse proxy that adds `Secure` externally).
  - `spring.session.timeout=-1` (application.yml:2-3) → session NEVER expires.
  - LOGIN_FORM mode hardcodes ADMIN authority for every user (TEST-GAP-774).
  - CSRF unconditionally disabled across all four auth modes (TEST-GAP-146).
  - No in-platform session revocation mechanism (live-doc verbatim 2026-05-20: "does not support rotation, session revocation, or MFA").

  Result: a session cookie compromised via HTTP transit OR via XSS (CSP not asserted) is valid until JVM restart, grants ADMIN authority across every endpoint, with no platform-side revocation mechanism. The compound posture is the LSN-001/LSN-002-class shape: silent insecure default + caveat-only / silent doc coverage + no fail-fast.

  **STRENGTHENS existing TEST-GAP-143** (session-cookie security from LoginForm-tier view). This sidecar is the SessionConfiguration config-class primary source — confirms the absence at the *session backing store* layer (where any cookie override would naturally live, regardless of auth mode), broader than just LOGIN_FORM. The cookie defaults apply to OAUTH2 and LDAP modes too.

  **Live doc drift**: WebFetched 2026-05-20 status 200 from `/configuration-and-deployment/odd-platform#select-session-provider` covers session storage and timeout but does NOT name the cookie attributes. Operators relying on framework defaults have no guidance.

  **Test gap shape**: integration test asserting the `Set-Cookie` header on a successful form-login response carries `HttpOnly` AND `Secure=false` (the framework default with no override) AND `SameSite=Lax`. PINS the current state so a future fix (adding a `CookieWebSessionIdResolver` bean with `HttpOnly + Secure + SameSite=Strict + Domain + Path`) is a deliberate test update. Pair with a second test asserting that a non-TLS deployment exposes the cookie in plaintext (set up HTTP-only TestContainer; observe Set-Cookie in HTTP response; confirm no `Secure` attribute).
