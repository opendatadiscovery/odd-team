# Feature-Local State Persistence (jotai per-Provider vs Redux global) — product-owner reflection

## product_owner_narrative

This is not a feature an operator opens; it is a **cross-cutting UX consistency property** of the odd-platform SPA that an operator only ever experiences as a surprise. Most of the platform — Catalog search, the directory, every Management list — keeps your in-progress UI state (filter chips, search text, selected facets) for the whole browser session: navigate away to inspect a result, click Back, and your filters are exactly where you left them, because that state lives in a single application-scoped Redux store that the SPA holds for its lifetime (per `DataQualityStore.md:34-37` understanding — "most of `odd-platform-ui` is `redux` + `redux-thunk`"). Four feature areas break that contract on purpose: the **Data Quality Dashboard** (`/data-quality`), **OwnerAssociations** (Management), **DEGLineage**, and **DatasetStructure-compare** each wrap their feature root in a fresh `jotai` `<Provider>`, so their state is created empty on every mount and destroyed on unmount (per `DataQualityStore.md:119-120` implicit_adrs — the byte-identical `<Provider>{children}</Provider>` shape across all four areas; 26 files import jotai across them).

A user interacts with the Data Quality instance — the only one with an enriched UI surface in this chain — by opening `/data-quality`, picking among ten filter chips (five "tables-side", five "tests-side"), and reading the three breakdown rings (per `DataQualityFilters.md:27` understanding). The promise the operator carries, formed from every OTHER page they have used, is that this filter slice survives the normal click-into-a-dataset-and-back flow. It does not: the `/data-quality` route is a single non-wildcard `<Route element={<DataQuality />} />` (per `DataQualityStore.md:125` at App.tsx:39,73), React Router unmounts the element on navigate-away, that destroys the `<DataQualityAtomProvider>` and its jotai `<Provider>`, and the next visit starts a fresh `formFiltersAtom` at the all-empty default (`DataQualityStore.ts:11-22`). There is exactly one cushion: a `useEffect` mirrors the filter selection into the URL query string (`DataQualityFilters.tsx:46-54`), so a back-navigation that preserves the URL can reconstruct part — possibly all — of the slice. Whether that reconstruction is lossless is the open empirical question (P-120, generalised here as PENDING-F-104-1).

The working parts, phrased as the operator lives them: you can filter the DQ dashboard by namespace, datasource, owner, "title" (which actually means ownership role, a separate F-032/PLT finding), and tag, across two independent sides; you can clear each side independently; and your selections immediately re-query (there is no "Apply" gate). But the moment you leave the page, every selection that did not round-trip through the URL is gone. The OwnerAssociations instance is **worse**: it resets your search not only on navigate-away but on an *in-feature* sub-tab switch — `OwnerAssociationsTabs.tsx:44-47` explicitly calls `setQuery('')` when you move between New / Active / History (per the F-104 feature-flow facet `owner_associations_slice_h_corroboration`), so the operator hunting a username across the request lifecycle re-types it every tab.

This property sits at the seam of three pillars: the canonical instance is the Data Quality Dashboard (P-04, F-032 owns the dashboard feature); DatasetStructure-compare lives under Data Discovery (P-01, the schema-revision diff); and OwnerAssociations is Management (P-08, the owner-triage surface). F-104 is the cross-cutting paradigm node — it owns the consistency gap, not any single screen. The edge case a product owner would flag in a demo: the reset is **invisible until it bites** — no banner, no "your filters will not be saved" affordance, no doc caveat on any of the three feature doc pages (per `DataQualityStore.md:115` doc_drift_findings — the dashboard page "is silent on the default state and on filter persistence"). The intent itself is deliberate and well-motivated (a self-contained feature store that does not leak into other pages' atom state); the drift is the **silence** around it — neither the operator nor a future contributor is told that these four areas behave differently from the other ~200 files of Redux-backed UI.

