name: AlertActionResolver (discriminated-union)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW CANDIDATE, batch 2026-05-19I (AlertServiceImpl sidecar)** —
  `AlertActionResolver` + `AlertActionResolverFactory` is the platform-internal
  abstraction that takes the OPEN-alerts snapshot + halt configs + a list of ingestion-derived
  candidates (DQ-test runs, job runs, schema-change deltas) and produces a discriminated-union
  `AlertAction` list with three subtypes: `CreateAlertAction` (alert + chunks),
  `StackAlertAction` (chunks for an existing alert), `ResolveAutomaticallyAlertAction`
  (ids to bulk auto-resolve). The resolver enforces application-level de-duplication
  via `AlertUniqueConstraint(dataEntityOddrn, type, messengerEntityOddrn)`. **Consumed
  by ONE caller**: `AlertServiceImpl.applyAlertActions` (the in-platform ingestion
  sink). **Deliberately SKIPPED** by `AlertServiceImpl.handleExternalAlerts` (the
  AlertManager webhook path) — which is the gap that causes the idempotency
  finding (see `alertmanager-webhook-bypasses-alert-action-resolver-no-idempotency`
  invariant). Not yet a top-level concept — surfaced as a CANDIDATE because the
  resolver is a self-contained abstraction worth documenting in its own right, but
  the contributor-facing docs (which would be the home for it) don''t exist yet.
  proposed_canonical: yes — extend `documentation/docs/main-concepts.md` or a future
  `developer-guides/ingestion-internals` page with a section naming the resolver
  as the platform''s alert-action abstraction and the discriminated-union as the
  contract shape.'
proposed_canonical: AlertActionResolver
rationale: 'The resolver is a load-bearing internal abstraction with a clear shape
  (open-alerts snapshot + halt configs + candidates → discriminated-union AlertAction
  list) and a clear consumer (AlertServiceImpl.applyAlertActions). The discriminated-union
  subtypes (CreateAlertAction / StackAlertAction / ResolveAutomaticallyAlertAction)
  are stable enough to document. Docs do not yet name it; the divergence between
  the two ingestion paths (applyAlertActions USES the resolver; handleExternalAlerts
  SKIPS it) is the source of the idempotency-gap finding. Documenting the resolver
  + the rationale for the skip is the natural way to make the design intent
  legible.'
contributing_concepts:
- 'AlertServiceImpl.md:concepts.entities — AlertAction + 3 subclasses (CreateAlertAction,
  ResolveAutomaticallyAlertAction, StackAlertAction)'
- 'AlertServiceImpl.md:concepts.entities — AlertUniqueConstraint(dataEntityOddrn,
  type, messengerEntityOddrn) — the de-duplication key'
- 'AlertServiceImpl.md:implicit_adrs.[3] — the divergence between applyAlertActions
  (uses resolver) and handleExternalAlerts (skips resolver)'
suggested_add_to_docs: true
notes: |
  Candidate for the contributor-facing docs (ingestion internals). The resolver
  is one of those primitives the codebase clearly relies on but doesn't yet
  surface in operator-facing or contributor-facing documentation.

  Two adjacent canonicalisation candidates surfaced together:
    - `ingestion-request-processor-chain` (the broader chain orchestration).
    - `alert-action-resolver` (this one — the alert-specific resolver).

  Both candidate for a future `developer-guides/ingestion-internals` page.
