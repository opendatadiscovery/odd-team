behaviour: 'AlertManager webhook idempotency gap — `handleExternalAlerts` (lines 151-191)
  bypasses `AlertActionResolver` (which the in-platform ingestion path uses) and forwards
  directly to `createAlerts` (line 190), a bulk INSERT with no ON CONFLICT (per batch-H
  ReactiveAlertRepositoryImpl sidecar). Two POSTs of the same AlertManager payload (e.g.
  Prometheus retry on transient network error) produce two duplicate ALERT rows. The
  applyAlertActions path de-duplicates via the resolver; handleExternalAlerts deliberately
  skips it. No test asserts row count = 1 after a duplicate POST. STRENGTHENED batch
  P — the AlertManagerController#postAlerts sidecar PRIMARY-SOURCE at the method
  tier confirms the deliberate skip pattern AND adds a NEW dimension: the AlertUniqueConstraint.fromAlert
  (AlertServiceImpl.java:187) deduplicates WITHIN a single batch but NOT across batches.
  So Prometheus''s standard retry policy (transient network failures, configurable
  per-receiver, group_interval 5m default + repeat_interval 4h default) re-sends
  the same group every interval; each re-send creates a fresh AlertPojo row even
  if the underlying `(entity_oddrn, type=DISTRIBUTION_ANOMALY)` already has an OPEN
  alert. The parallel applyAlertActions path at AlertServiceImpl.java:222-227 DOES
  route through AlertActionResolver to deduplicate. The asymmetry is intentional —
  this asymmetric handling vs AlertActionResolver path is named verbatim in the
  postAlerts sidecar.'
