behaviour: |-
  Shift+Enter save shortcut AND error-path handling. (a) handleSaveMarkdownOnEnter fires on Shift+Enter only — plain Enter inserts a newline. The shortcut is undocumented in the operator-facing tooltip (DOC-GAP candidate per the sidecar). (b) handleUpdateDescription on error response sets the inline error to response.statusText OR a fallback "Unable to update description"; the catch handler (useTermWiki.ts:172-176) treats ANY rejected promise as a Response with statusText (potentially incorrect for network errors or promise rejections raised from inside the thunk).
