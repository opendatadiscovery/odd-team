- id: H-005
  hypothesis: |
    When a user rapidly changes the date / event-type / user filter on the Activity tab,
    the displayed results always correspond to the LAST filter the user set — an
    in-flight request for a superseded filter never overwrites the results for the current
    filter.
  derivation: |
    The product promise of any filter UI is "what I see matches what I last selected".
    `ActivityResults.tsx:41-45` fires a fetch on every `[queryParams, dataEntityId]`
    change; the question is whether stale responses are cancelled / ordered.
  seed_source: ui-label + negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      Static analysis (Rule-8 source read of ActivityResults.tsx:41-59): the useEffect
      dispatches `fetchDataEntityActivityList({...queryParams, dataEntityId,
      isQueryUpdated: true})` on every queryParams change with NO debounce and NO
      AbortController — an in-flight fetch is NOT cancelled when the filter changes again.
      `isQueryUpdated: true` signals the redux reducer to REPLACE (not append) results.
      Whether a slow response for filter-A can land AFTER a fast response for filter-B and
      overwrite B's results depends on the reducer's correlation logic (does it stamp/guard
      responses against the current query, or blindly accept the latest arrival?). The redux
      slice + the thunk's race-handling are NOT in this reflection's chain (no sidecar), so
      the operator-visible outcome cannot be PINNED from static reading alone. Lower
      amplitude than the global feed (1 query vs 5), but the same race contract. Requires a
      measured run.
    evidence:
      - sidecar: "(source read for validation)"
        section: ActivityResults useEffect
        cite: "ActivityResults.tsx:41-59"
        note: "source_read_for_validation: true — no debounce, no AbortController, isQueryUpdated:true REPLACE confirmed; reducer correlation NOT in chain"
      - sidecar: "(F-196 feature-flow facet)"
        section: per_entity_activity_no_useeffect_debounce_no_abortcontroller
        cite: "DataEntityActivity/ActivityResults/ActivityResults.tsx:41-45"
        note: "Race-contract facet asserted at the component; the win-condition (which response the reducer keeps) is the part requiring measurement"
    operator_visible_failure: |
      IF the reducer accepts the latest-arriving response without correlating it to the
      current query, a user twiddling the calendar fast can briefly (or until the next
      change) see results for a filter they already moved off — on an audit surface this is
      misleading ("these are the events for THIS window" when they are not). Bounded by the
      single-query shape (no count/list desync as in the global feed). The probe pins
      whether the reducer guards or not.
    probe_id: PENDING-F-196-1
    routes_to_finding: validation-gap
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-196-1"

- id: H-006
  hypothesis: |
    Each activity row on the per-entity tab visually distinguishes WHO caused the change:
    a system/ingestion event vs a named human user vs an anonymous (DISABLED-mode) actor —
    so a reviewer can tell at a glance whether the platform or a person made each change.
  derivation: |
    `ActivityItem.tsx:178-187` branches on `activity.systemEvent` (GearIcon) else renders a
    UserIcon + actor name. A reviewer expects three distinguishable cases. The pillar frames
    this as an audit surface where attribution is the point.
  seed_source: response-shape + ui-label + negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The component renders TWO explicit visual states and leaves a THIRD unhandled (Rule-8
      source read of ActivityItem.tsx:178-187, identical to the global ActivityItem per
      F-021 batch UI-A finding 2): `activity.systemEvent ? <GearIcon /> : <UserIcon /> +
      (createdBy?.owner?.name || createdBy?.identity.username)`. Case 1 (system event):
      GearIcon — correct WHEN the write path set is_system_event=true. Case 2 (real user):
      UserIcon + resolved name — correct when the actor-resolution JOIN hits. Case 3
      (anonymous DISABLED-mode mutation): `created_by` is null AND `systemEvent` is false
      (a human mutated, not the system) → the UI renders `<UserIcon />` + empty name
      (both `createdBy?.owner?.name` and `createdBy?.identity.username` resolve undefined)
      → a UserIcon with NO actor text, visually distinct from a system event but presenting
      a nameless human actor with no explanation. This is the same unhandled third state
      F-021 documented at the global ActivityItem; the per-entity tab inherits it because it
      reuses the same ActivityItem render branch. Additionally, the F-021 family pinned that
      the write path may leave is_system_event unset for some ingestion/scheduler rows
      (F-021 facet ingestion_attribution_null_created_by) — when that happens the GearIcon
      branch mis-renders too. The promise is partly kept: system-vs-user is usually
      distinguishable; the anonymous-human case is not handled.
    evidence:
      - sidecar: "(source read for validation)"
        section: ActivityItem actor render
        cite: "ActivityItem.tsx:178-187"
        note: "source_read_for_validation: true — GearIcon/UserIcon branch + `createdBy?.owner?.name || createdBy?.identity.username` confirmed; null-name UserIcon is the unhandled third state"
      - sidecar: "(parent F-021 feature-flow)"
        section: batch UI-A finding 2 (activityitem three visual states)
        cite: "F-021 feature-flow batch UI-A note (2) + ActivityItem.tsx:71-79 (global twin)"
        note: "Per-entity ActivityItem reuses the same render branch; inherits the unhandled-anonymous third state"
    operator_visible_failure: |
      Under auth.type=DISABLED, an anonymous human edit to the entity renders on its
      Activity tab as a UserIcon with a blank name — a reviewer sees "a user did this" with
      no identity, indistinguishable in usefulness from no-attribution, and cannot tell it
      apart from a row where actor resolution simply failed. Bounded to DISABLED deployments
      + ingestion/scheduler rows with unset is_system_event. On the per-entity tab this lands
      on the entity an operator is actively reviewing.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    test_note: |
