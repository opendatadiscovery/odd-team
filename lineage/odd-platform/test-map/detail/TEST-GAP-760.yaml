behaviour: |-
  **MEDIUM — Namespace name comparison is CASE-SENSITIVE at every layer (repository getByName, unique-index `namespace_unique`, application-tier validation). An operator creating `finance` and then `Finance` gets TWO distinct namespaces with distinct ids — but the live docs treat namespace names as natural identifiers (`Create a namespace before authoring tags or terms that should be scoped to a particular team or domain`).** Primary-source confirmed in batch-W NamespaceController sidecar:

  - **Repository tier**: `ReactiveNamespaceRepositoryImpl.getByName` line 26 uses `NAMESPACE.NAME.eq(name)` — jOOQ's `.eq` resolves to `=` SQL operator, which is BYTE-EQUALITY in PostgreSQL's `varchar` column (no case-folding, no collation override).
  - **DB tier**: V0_0_31__add_deleted_at_field.sql:25 — `CREATE UNIQUE INDEX IF NOT EXISTS namespace_unique ON namespace (name) WHERE deleted_at IS NULL` — the index expression is `(name)`, NOT `(LOWER(name))` or `(name COLLATE "C")`. Case-sensitive uniqueness.
  - **Mapper tier**: `NamespaceMapper.java:1-29` — no case-folding hook. The mapper passes name verbatim.
  - **Controller tier**: `NamespaceController.java` — no normalization in the request handlers.

  **Operator-visible consequences**:
  - Operator A creates namespace `Finance`. Operator B searches the autocomplete for `finance`, doesn't see a match, creates `finance`. The platform now has TWO namespaces. Tags and terms scoped to one don't see the other.
  - Cross-team confusion: when team B tags their data with `finance` and team A tagged theirs with `Finance`, the cross-namespace queries return disjoint results.
  - The "natural identifier" framing in the docs (live-fetched 2026-05-20 from `/features/management`: "Create a namespace before authoring tags or terms that should be scoped to a particular team or domain") implies case-insensitive matching.
  - UI Unicode confusables: `fіnance` (Cyrillic 'і') vs `finance` (ASCII 'i') — both ACCEPTED as distinct names. The platform offers no defense against homograph attacks for namespace selection.

  **Why MEDIUM not HIGH**:
  - Operator-impact is RECOVERABLE — duplicate namespaces can be merged (delete one, re-attach referents to the other).
  - The behaviour is CONSISTENT with the platform's broader posture (per implicit_adrs.[4]): "Name validation is INTENTIONALLY minimal — varchar(64), no regex, no allowlist, no case-folding." — applied uniformly across owner / tag / label / data_source name columns.
  - Not a security vulnerability per se; the issue is operator-surprise and cross-team data fragmentation.

  **Test gap shape**: regression-pin asserting: (a) `POST /api/namespaces` with name `finance` then `POST /api/namespaces` with name `Finance` BOTH succeed and return DISTINCT ids; (b) the unique-index `namespace_unique` is over `(name)` not `(LOWER(name))`; (c) Unicode confusables (Cyrillic 'і' vs ASCII 'i') produce distinct namespaces. The current state is PINNED — failures land if a future maintainer adds case-folding at any layer.
