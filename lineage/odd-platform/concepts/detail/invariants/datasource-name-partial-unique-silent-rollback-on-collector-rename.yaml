mitigations_unimplemented:
- |-
  Improve the collector-facing error message: extend
  `ExceptionUtils.formatMessage` to specifically detect the
  `data_source_name_unique` constraint name in the SQL error and
  surface a clear message ("Datasource name 'X' already in use by
  another datasource — choose a different name in the collector
  configuration"). Cheapest fix; preserves the SQL constraint;
  improves operator triage time.
- |-
  Add a pre-write name-collision check at
  `DataSourceIngestionServiceImpl.createDataSources` — for the
  payload's set of (oddrn, name) pairs, issue a single SELECT to
  identify any name that's already held by a DIFFERENT-ODDRN row.
  Surface the collision as a structured response BEFORE the
  transaction commits. Adds one round-trip per ingestion call;
  pays back in clarity of the error.
- |-
  Add the regression test from the test-coverage proposal: insert
  two datasources `[(oddrn1, name='snow-A'), (oddrn2, name='snow-B')]`;
  call createDataSources with a payload renaming oddrn1 to 'snow-B';
  assert the call fails with UniqueConstraintException AND that
  oddrn2's row is UNCHANGED (verifying the transactional rollback).
- |-
  Document the name-uniqueness contract on the collector-author docs:
  "Datasource names must be unique across all live datasources in the
  platform. A collector renaming an existing datasource to a name
  already held by another datasource will fail the entire ingestion
  batch."
- |-
  Consider relaxing the name uniqueness to PER-COLLECTOR uniqueness
  (partial unique index on `(collector_id, name) WHERE deleted_at IS
  NULL` instead of `(name) WHERE deleted_at IS NULL`). This would
  scope the constraint to each collector's namespace; collisions
  across collectors would be permitted. HIGH-scope schema change;
  preserves backward compatibility within a single-collector
  deployment; opens the door to name reuse across multi-collector
  deployments.
notes: |-
  This is a HIGH-severity operational invariant, not because the
  constraint itself is wrong (it serves a real purpose — preventing
  duplicate datasource names that would confuse users) but because
  the COLLECTOR-FACING ERROR SURFACE is opaque. A collector's
  automation pipeline encountering this error has no programmatic
  way to recover; the operator must intervene manually. The 500
  → opaque message → automation retry loop is the failure mode.

  Cross-cutting connections:
    - Pairs with the upsert-by-oddrn-partial-merge invariant — the
      UPSERT contract is that `name` IS one of the two fields that
      propagates from payload. That propagation enables this collision
      surface
    - Pairs with the three-soft-delete-mechanisms invariant — the
      data_source table's partial-unique-on-live-rows pattern is one
      instance of the deleted_at + partial-unique-index combination;
      the ODDRN index uses the same shape and serves correctness;
      the name index uses the same shape and serves consistency
    - Pairs with the namespace-inherited-from-collector-not-payload
      invariant — both invariants describe behaviour the collector
      cannot reasonably know about from the API surface; both are
      service-tier conventions that surface as opaque collector errors
    - Pairs with `LSN-001` retrospective pattern — silent-failure-mode
      where the actual cause (name collision) is hidden behind an
      opaque 500 status

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the name-uniqueness contract on the collector-author
        docs (developer-guides/build-and-run/custom-collectors and
        the Datasource Ingestion API reference)
    (b) Document the collector-vs-UI error-surface ergonomics gap on
        the operator-facing Datasources tab help text — operators
        debugging "collector failed to register datasource" need
        clear guidance to check for name collisions in the catalog
    (c) Document the V0_0_31 partial-unique-index design choice in an
        internal architecture note — the schema decision is non-obvious
        and the operational consequence (silent collector errors) is
        a real ongoing cost
