      was mentioned in description" (TermServiceImpl.java:157-160), the .then(navigate) does NOT fire
      (correct), and the global error snackbar shows. BUT the partial gap: the ConfirmationDialog dismisses
      synchronously on confirm-click regardless of the thunk outcome (per TermDetails.md
      bugs_limitations_corner_cases) — so on a blocked delete the user sees the dialog close, the term
      remain, and an error snackbar appear elsewhere; there is no inline error at the Delete button and no
      pre-flight "this term is mentioned in N descriptions" warning before the confirm prompt.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__TermDetails.md
        section: downstream_side_effects
        cite: "TermDetails.tsx:47-53 (navigate-on-fulfilment) + TermDetailsHeader.tsx:80-90 (dialog dismisses synchronously)"
        note: "navigation correct; blocked-delete feedback is dislocated from the button"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: invariants
        cite: "TermServiceImpl.java:157-160 (delete guard — 400 when mentioned in active description)"
        note: "delete is guarded; error surfaces as a snackbar, not inline"
    operator_visible_failure: |
