name: Get Data Set Structure (by version id)
canonical_in_docs: false
canonical_candidate: true
description: |-
  GET /api/datasets/{data_entity_id}/structure/{version_id} —
  returns DataSetStructure { dataSetVersion: DataSetVersion,
  fieldList: List<DataSetField> }. NO SecurityRule entry; any
  authenticated user can call. Implementation:
  DatasetController.java:22-31 → DatasetVersionServiceImpl.getDatasetVersion
  (DatasetVersionServiceImpl.java:39-45) → ReactiveDatasetVersionRepositoryImpl.getDatasetVersion
  (lines 97-144). The repository's SQL filters
  WHERE DATASET_VERSION.ID = datasetVersionId only (line 129) —
  the URL's `data_entity_id` parameter is CONSUMED ONLY in the
  service-tier NotFoundException message string at line 42-43.
  A request to GET /api/datasets/{any_id}/structure/{valid_version_id_for_other_dataset}
  returns the OTHER dataset's structure. See
  datasetcontroller-per-entity-scoping-bypass-data-entity-id-not-enforced-at-sql
  invariant THIS BATCH.

  The response payload's per-field DataSetField includes
  internal_description — the F-004 verbatim-storage column-level
  XSS surface. See f-004-read-side-surface-at-column-level-via-datasetcontroller
  invariant THIS BATCH.
axes_present:
  - controllers
nodes:
  - odd-platform java DatasetController controller-class:DatasetController
