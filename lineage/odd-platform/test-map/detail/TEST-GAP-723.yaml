proposed_action: |-
  Add `TermSearch.test.tsx` at `odd-platform-ui/src/components/Terms/TermSearch/`. Three test methods + 1 live probe:
  1. `termSearch_rapidFacetClicks_assertsDebouncedPutFiresOncePer1500msWindow_currentlyFails` — render `<TermSearch/>` wrapped in `<MemoryRouter initialEntries={['/termsearch/uuid-1']}>`; mock the backend; dispatch 5 facet-change Redux actions within a 200ms window; advance fake timers by 1500ms; assert `PUT /api/termsearch/uuid-1` was called EXACTLY ONCE. **This test will FAIL today (count=5)** and pins the bug.
  2. `termSearch_rapidFacetClicks_documentsCurrentBuggy5PutBehaviour` — companion test that PINS the current buggy 5-invocation count. When the dep-array fix lands, this test becomes the "remove me" marker.
  3. `termSearch_singleFacetChange_assertsExactlyOnePutAfter1500ms` — pin the happy-path debouncer behaviour (still works for single events).

  PROBE (per LSN-017 measurement-truth principle): live-load `/termsearch` in a sandboxed browser instance, click 5 facets within a 2-second window, capture the backend log via browser DevTools, count `PUT /api/termsearch/{searchId}` invocations. Probe verifies the static-reasoning conclusion AND surfaces any compounding effects (e.g. React 18 Concurrent Mode batching) that static reading missed.

  Pair with a follow-up backlog item proposing the dep-array fix: wrap the `useDebouncedCallback` in a `useMemo` with the actual depended-on values, OR refactor the facet-sync effect to read latest values from a `useRef` instead of closing over per-render state. When the fix lands, test #1 succeeds, test #2 deletes.
