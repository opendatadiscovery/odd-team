- id: H-006
  hypothesis: "When a user (or third-party client) requests a very large lineage_depth (e.g. d=10000) on a microservice, the platform clamps the traversal to a safe ceiling rather than attempting to enumerate the entire reachable graph."
  derivation: "The UI depth dropdown caps at [1..20] and the API-reference doc states a minimum of 1; a user reasonably assumes 20 (or some platform ceiling) is the enforced maximum (endpoint-shape + implicit-requirements seed)."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      No upper bound exists at any tier. The generated interface enforces @Min(1) only — no @Max
      (getDataEntityDownstreamLineage.md bugs[1]). The service hands the int straight to LineageDepth.of with no
      Math.min clamp (LineageServiceImpl.java:96). The recursive CTE terminates only on tDepth < lineageDepth with no
      cycle guard (ReactiveLineageRepositoryImpl.java:174). The UI dropdown caps at 20 but the URL accepts any integer
      (useQueryParams parseNumbers:true) and click-through propagates node.depth without Math.min(.,20). A d=10000
      request runs the CTE to whatever Postgres/timeout limits enforce.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityDownstreamLineage.md
        section: bugs_limitations_corner_cases[1] + performance.known_performance_gaps[0]
        cite: "DataEntityApi @Min(1) only; ReactiveLineageRepositoryImpl.java:122-176 (no cap)"
        note: "No @Max, no service clamp, no CTE cycle guard — DoS-amplification vector."
      - sidecar: odd-platform__ts__react-component__component__LineageGraph.md
        section: bugs_limitations_corner_cases[no-upper-bound-d]
        cite: "useQueryParams.ts:36 + HierarchyLineage.tsx:47 + Node.tsx:46-52"
        note: "UI dropdown [1..20] is cosmetic; URL + click-through bypass it."
    operator_visible_failure: |
      A curious operator hand-editing ?d=10000, or a node-click that propagates a large rendered depth, drives an
      arbitrarily-expensive recursive-CTE walk that can peg a Postgres connection / exceed the transaction timeout and
      degrade the platform for everyone. On a microservice with a densely-connected call graph (microservice topologies
      are often more interconnected than dataset DAGs) the amplification is worse. Under DISABLED mode an unauthenticated
      probe can trigger it. The user expecting "20 is the max" gets no clamp and no warning.
    severity: HIGH
