proposed_action: |-
  Add `TermLifecycleAuditSilenceEnumRootedTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/term/`. Six test methods:
  1. `activityEventTypeDtoEnum_doesNotDefineTermCreatedUpdatedDeleted_enumRootedSilence` — read the enum via reflection or by listing `ActivityEventTypeDto.values()`; assert NONE of `TERM_CREATED`, `TERM_UPDATED`, `TERM_DELETED`, `TERM_DESCRIPTION_UPDATED`, `TERM_TAGS_UPDATED` are present. PIN the schema-level absence.
  2. `termServiceImplCreateTerm_producesZeroActivityEvents` — call `TermServiceImpl.createTerm(formData)` with a fresh term; assert no rows in `activity` table mention the new term's id. PIN the service-tier silence.
  3. `termServiceImplUpdateTerm_producesZeroActivityEvents` — call `TermServiceImpl.updateTerm(termId, formData)` with a rename; assert no rows.
  4. `termServiceImplDeleteTerm_producesZeroActivityEvents` — call `TermServiceImpl.delete(termId)`; assert no rows.
  5. `termServiceImplUpsertTags_producesZeroActivityEvents` — call `TermServiceImpl.upsertTags(termId, tagsFormData)`; assert no rows.
  6. `termServiceImplLinkTermWithTermAndRemove_producesZeroActivityEvents` — call `linkTermWithTerm(A, B)` then `removeTermToLinkedTermRelation(A, B)`; assert no rows. PIN the compound failure (unauthenticated + unlogged per TEST-GAP-718).

  Pair with a maintainer-decision-on-disk DOC-NNN candidate: either disclose the current "catalog vocabulary is silent by design" decision on `documentation/docs/features/data-glossary/business-glossary.md` AND the `active-platform-features.md` activity-feed page, OR add the enum values + service-tier `@ActivityLog` instrumentation in a separate PR. When/if instrumentation lands, test #1 inverts to assert PRESENCE, tests #2-#6 invert to assert positive activity-event production.

  Cross-pair with concept-merger to surface a NEW concept entry: `f006-audit-silence-enum-rooted-term-lifecycle` (the SECOND enum-rooted variant; first was `seven_sidecar_audit_silence_pattern_repo_tier_schema_root_cause` for RBAC).
