control_summary: |-
  0/4 cells COVERED. The lifecycle feature is entirely under-tested:
  no unit-test asserts status_updated_at is set, no integration test
  exercises the scheduled path, no end-to-end test verifies the
  documented 30-day retention. The SHB-004 mapper bug + the
  no-chunking burst risk + the missing operator-peek endpoint
  compose into a HIGH-severity correctness defect that's invisible
  to operators until they run `SELECT count(*) WHERE status='DELETED'`
  and find a number that never drops.
