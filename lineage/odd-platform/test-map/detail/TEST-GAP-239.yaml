proposed_action: 'Add an integration test: (a) create owner `O`; (b) soft-delete `O`;
  (c) re-POST /api/owners with `name=''O''`; (d) assert current behaviour (DB error
  / 500). Once the maintainer adds a partial-unique migration for `owner.name` (parallel
  to V0_0_89), flip assertion to expect 200 with the new owner.'
