mitigations_unimplemented:
- |-
  Code-side: register a `WebSessionIdResolver` bean (typically
  `CookieWebSessionIdResolver`) that explicitly sets:
    .setCookieName("ODD_SESSION") or accept default SESSION
    .setCookieSecure(true) for HTTPS-only deployments OR pair with a
       boot-time guard 'if not HTTPS in production, log warning + accept'
    .setCookieSameSite(Cookie.SameSite.STRICT) for strict cross-site
       protection (default is Lax; the platform's REST surface justifies Strict)
    .setCookieMaxAge(some-finite-value) — avoid never-expiring sessions even
       when spring.session.timeout: -1
  Wire into the SessionConfiguration.java bean topology so all three
  session.provider variants get consistent cookie attributes.
- |-
  Code-side OR docs-side: change `spring.session.timeout: -1` default to a
  finite TTL (e.g., 8 hours). Document the never-expire-by-default trade-off
  loudly on the docs side if the code-side default is preserved for backward
  compatibility.
- |-
  Doc-side: extend `/configuration-and-deployment/odd-platform#select-session-provider`
  with a cookie-attributes subsection documenting:
    - Default attributes (HttpOnly=true; Secure=NOT set by platform; SameSite=lax;
      never-expiring via spring.session.timeout: -1 default)
    - Operator responsibility to terminate TLS and add Secure via reverse proxy
    - Recommended hardening (TLS-only deployment + finite timeout + SameSite=Strict)
- |-
  Doc-side: cross-link the LOGIN_FORM auth-mode page to the session-cookie posture
  warning — LOGIN_FORM is the only auth.type that uses the session cookie as the
  primary credential bearer, so the cookie security implications are
  load-bearing for LOGIN_FORM-mode deployments.
notes: |-
