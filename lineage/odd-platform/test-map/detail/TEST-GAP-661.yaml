behaviour: |-
  **HIGH-impact silent failure mode on COLLECTOR-DRIVEN UPSERT: a `bulkUpdate` rename to a name already held by ANOTHER live datasource rolls back the ENTIRE transaction** including the paired `bulkCreate` of new datasources. The partial unique index `data_source_name_unique ON data_source(name) WHERE deleted_at IS NULL` (V0_0_31__add_deleted_at_field.sql:27) was DROPPED by V0_0_18__pull_push_data_sources.sql:1-3 then RE-CREATED in V0_0_31:27 — so `name` IS unique-on-live-rows, but operators reading the schema history may miss this. The collector-driven UPSERT pathway is shielded for the OPERATOR-EDITED name case because `prepareForUpdate` overwrites name from payload (DataSourceIngestionServiceImpl.java:86-88) — so if collector A originally registered ODDRN X with name "snowflake-prod", and the same collector A re-emits a payload renaming X to "redshift-prod" (a name already held by ANOTHER live datasource), the `bulkUpdate` SQL hits SQLSTATE 23505 mid-transaction, rolling back BOTH the rename AND any paired `bulkCreate` of new datasources from the same ingestion call (the bulk methods are `@ReactiveTransactional` per ReactiveAbstractCRUDRepository.java:128). The operator sees a 500 with the underlying message; there is NO `name collision with another datasource` distinction at the controller / mapper / service layer. Severity: HIGH because (a) a single failing datasource silently corrupts the success of all OTHER datasources in the same `createDataSources` batch; (b) collector retry logic typically re-emits the same payload, producing a stable 500 with no operator-actionable signal.
