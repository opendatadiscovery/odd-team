- id: H-003
  hypothesis: "When a user with only DATA_ENTITY_DESCRIPTION_UPDATE (and NOT DATA_ENTITY_ADD_TERM) saves a description containing [[finance:Customer]], the platform refuses to auto-link the glossary term — because term-linking is gated by the dedicated DATA_ENTITY_ADD_TERM permission."
  derivation: "Pillar P-09 model: DATA_ENTITY_ADD_TERM is a distinct permission from DATA_ENTITY_DESCRIPTION_UPDATE (SecurityConstants registers them separately). A product owner expects the two privileges to be orthogonal — the docs describe DATA_ENTITY_ADD_TERM as the term-linking gate."
  seed_source: pillar + cross-pillar (P-06/P-09 boundary)
  validation:
    verdict: contradicted
    actual_behavior: |
      The platform DOES auto-link the term — the dedicated DATA_ENTITY_ADD_TERM permission is BYPASSED
      entirely. DataEntityServiceImpl.upsertDescription (line 328) calls
      termService.handleDataEntityDescriptionTerms UNCONDITIONALLY after the description write; that method
      (TermServiceImpl.java:201-207) parses [[ns:term]] mentions and INSERTs data_entity_to_term rows with
      is_description_link=TRUE, with NO permission check inside. The only gate the side-channel passes through
      is DATA_ENTITY_DESCRIPTION_UPDATE on the description endpoint itself. The Policy framework's intended
      separation between "edit description" and "link terms" is structurally undermined: anyone who can edit a
      description can effectively ADD_TERM. (Compounding: TermServiceImpl's headline finding REFACTOR-217 is
      that even the EXPLICIT term-link endpoint's SecurityConstants rule is wired to the wrong path — singular
      /term vs plural /terms — so the explicit gate never fires either; but the description side-channel is a
      second, independent bypass that lands regardless.)
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription
        section: security.known_security_gaps[3]
        cite: "DataEntityServiceImpl.java:328 + TermServiceImpl.java:198-207 + SecurityConstants.java:194-197 vs :237-239"
        note: "term-handler invoked unconditionally; the two SECURITY_RULES that should be orthogonal"
      - sidecar: odd-platform__java__service__service__TermServiceImpl
        section: operations[handleDataEntityDescriptionTerms] + understanding
        cite: "TermServiceImpl.java:201-207 (no permission check inside) + :67 (regex)"
        note: "auto-link side-channel; is_description_link=TRUE rows synthesised, ADD_TERM gate bypassed"
      - sidecar: "(feature-flow F-004.yaml shoebox_merged_facets)"
        section: "SHB-017 description_link_permission_bypass_anyone_with_description_update_can_add_terms"
        cite: "TermServiceImpl.java:198-207 + DataEntityServiceImpl.java:329-332"
        note: "homed at F-004 as the entry-point that triggers the bypass; cross-pillar to F-002"
    operator_visible_failure: |
      (a) An operator deliberately granted ONLY description-edit rights (e.g. a documentation contributor who
      should not curate the glossary taxonomy) can create glossary associations on entities by typing
      [[ns:term]] — silently widening their effective privilege. (b) Under auth.type=DISABLED an anonymous
      caller gets the same term-write power on every entity. (c) The complementary asymmetry: term-management's
      DELETE-term path filters is_description_link=FALSE, so a user CANNOT remove description-created links via
      the term UI — the link is created by a side-channel and is sticky from the term-management surface
      (cross-pillar concern surfaced for F-002/P-06). (d) The audit story is muddied: the auto-link emits a
      TERM_ASSIGNMENT_UPDATED event the operator never explicitly triggered.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_ref: null
    test_demand: functional
    use_case_note: "TEST-GAP-295 (missing-security, HIGH) is the EXACT pre-existing, still-unwritten test demand for this promise (test_files_existing: []). The functional test demand maps to it, not a fresh mint."

- id: H-004
  hypothesis: "When an operator edits a description and adds a [[ns:term]] mention, the Activity feed shows ONE row for the change (a description edit is a single user action)."
  derivation: "A product owner reasons about the activity feed as one row per user action. The user clicked Save once; they expect one audit entry."
  seed_source: response-shape + pillar (P-07 audit)
  validation:
    verdict: contradicted
    actual_behavior: |
      The platform emits TWO activity-feed rows at the same timestamp for a single description-edit-with-mention
      save: DESCRIPTION_UPDATED (from DataEntityInternalStateServiceImpl.updateDescription's @ActivityLog, the
      inner service) AND TERM_ASSIGNMENT_UPDATED (from TermServiceImpl.handleDataEntityDescriptionTerms'
      @ActivityLog). Both fire inside the same @ReactiveTransactional boundary in upsertDescription. The live
      activity-feed docs list the two event types separately but do NOT explain that one description edit emits
      BOTH (per the SHB-017 evidence + the doc cross-reference). This is intentional at the code level (two
      distinct @ActivityLog annotations on two service methods) but surprising at the operator level.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription
        section: implicit_adrs[3] + coupling[1]
        cite: "DataEntityInternalStateServiceImpl.java:56 + TermServiceImpl.java:200 + DataEntityServiceImpl.java:327-328"
        note: "two @ActivityLog annotations on two sequential service methods"
      - sidecar: "(feature-flow F-004.yaml shoebox_merged_facets)"
        section: "SHB-017 description_edit_auto_links_terms_dual_activity_events"
        cite: "DataEntityInternalStateServiceImpl.java:28 + TermServiceImpl.java:243"
        note: "operator sees TWO rows per description edit at the same timestamp"
    operator_visible_failure: |
      (a) An operator auditing the activity feed infers two distinct user actions (a description change AND a
      separate term-assignment) when only one save happened — over-counting change activity and potentially
