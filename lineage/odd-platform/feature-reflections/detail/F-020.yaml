    actual_behavior: |
      The token is plaintext at rest end-to-end. V0_0_28__add_token.sql:4 declares
      `value varchar(40) NOT NULL` with no hashing column, no salt, no UNIQUE
      constraint. TokenGeneratorImpl.java:34-42 writes
      RandomStringUtils.randomAlphanumeric(40) verbatim. ReactiveCollectorRepository
      Impl.java:94 resolves an inbound bearer token via `TOKEN.VALUE.eq(token)` —
      plaintext SQL equality; IngestionDataEntitiesFilter.java:55-58 mirrors it with
      a non-constant-time `tokenPojo.getValue().equals(token)`. Every layer of the
      bearer-token flow assumes plaintext (the repository sidecar names this the
      load-bearing implicit ADR). The API masking on reads is cosmetic — it hides
      the value in list views but the storage is clear text. (Separately, the
      generator uses ThreadLocalRandom, not SecureRandom — a distinct entropy
      defect; see H-013.)
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveCollectorRepositoryImpl.md
        section: "bugs_limitations_corner_cases[0] + implicit_adrs[0]"
        cite: "V0_0_28__add_token.sql:1-9 + TokenGeneratorImpl.java:34-42 + ReactiveCollectorRepositoryImpl.java:94 + IngestionDataEntitiesFilter.java:55-58"
        note: "No hashing anywhere; SQL + application equality are both plaintext."
      - sidecar: odd-platform__java__CollectorController__controller-method__regenerateCollectorToken.md
        section: "implicit_adrs[3] + security.known_security_gaps[3]"
        cite: "IngestionDataEntitiesFilter.java:55-58 + ReactiveTokenRepositoryImpl.java:21-39"
        note: "Direct String.equals, not BCrypt.matches; shared-secret-stored-as-is model."
    operator_visible_failure: |
      (1) Any DB-side reader — pg_dump artefact, read replica snapshot, WAL archive,
      jOOQ statement-log leak, Datadog/pgaudit DB observability — recovers every
      live collector credential in clear text. (2) A single leaked backup is a
      platform-wide credential compromise requiring rotation of every token (which,
      per H-004, knocks every collector offline). (3) The implicit ADR ("tokens are
      deployment-internal shared secrets; at-rest threats are addressed at the
      disk/backup layer") is undefended in any comment, doc, or ADR — so an operator
      cannot even discover that the plaintext storage is a deliberate choice.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-009
  hypothesis: "When an operator edits a collector and changes only its name, the other fields they did not touch (description, namespace) are preserved."
  derivation: "Endpoint shape (the edit form + PUT /api/collectors/{id}) + the universal operator expectation that an edit form changes the field you edited and leaves the rest alone."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      Update is full-replace, not patch. CollectorServiceImpl.update (lines 50-69)
      calls `collectorMapper.applyToDto(collectorDto.collectorPojo(), form)` and
      CollectorMapper.java:41-47 uses MapStruct @MappingTarget — a whole-pojo
      overwrite. Any field absent (null) in the incoming CollectorFormData nulls the
      corresponding column. So a PUT that carries only the name will null the
      description and namespace. The UI form (CollectorForm.tsx) populates all three
      fields from the existing collector when editing, which masks the hazard in the
      happy UI path — but any partial-update flow (a future UI refactor, a scripted
      caller, an API consumer building a PATCH-shaped request against this PUT)
      silently destroys the unsent fields. The OpenAPI verb is PUT (full-replace is
      technically correct HTTP), but the field semantics are documented nowhere a UI
      or API author would find them before writing a partial update.
    evidence:
      - sidecar: odd-platform__java__CollectorController__controller-class__CollectorController.md
        section: "bugs_limitations_corner_cases[2] (update semantics are full-replace, not PATCH)"
        cite: "CollectorController.java:33-40 + CollectorServiceImpl.java:50-69 + CollectorMapper.java:41-47"
        note: "MapStruct @MappingTarget whole-pojo overwrite; null form fields null the columns."
    operator_visible_failure: |
      (1) A scripted or API consumer sending a name-only update wipes the
      collector's description and namespace with no error and no warning. (2) A
      future UI partial-update flow (e.g. inline-rename) would silently destroy
      sibling fields — a latent footgun that the current full-form modal happens to
      avoid only because it always resubmits every field. (3) The PUT-is-replace
      contract is undocumented, so the trap is discovered by data loss, not by
      reading the spec.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-010
  hypothesis: "When an operator misses copying a freshly-issued token, they can view it again later from the Collectors tab."
  derivation: "Endpoint shape (the list response carries token.value) + the operator's reasonable expectation that a value shown once in a UI is retrievable from that same UI."
