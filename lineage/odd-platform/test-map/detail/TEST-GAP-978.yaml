proposed_action: |-
  Add `DataEntityRunControllerHttpTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `getRuns_validDQTestWithThreeCompletedRuns_returns200WithCorrectShapeAndOrdering` — seed a DQ-test entity + 3 completed runs across 3 statuses; GET via WebTestClient; assert HTTP 200 + items.size()=3 + ordering end_time DESC.
  2. `getRuns_nonExistentDataEntityId_returns404_pinsNotFoundExceptionPath` — GET `/api/dataentities/99999/runs`; assert HTTP 404.
  3. `getRuns_dataEntityWithWrongClass_returns400_pinsBadUserRequestExceptionPath` — seed a DATA_SET (class 1) entity; GET its `/runs`; assert HTTP 400 with the canonical message "Data entity with id %d is not supposed to have runs due to its class".
  4. `getRuns_dataEntityWithZeroRuns_returns200WithEmptyList` — seed a DQ-test entity with no runs; GET; assert HTTP 200 + items=[] + pageInfo={total:0, hasNext:false}.
  5. `getRuns_statusFilterSUCCESS_only5SuccessRowsReturnedFromMixed10Runs` — seed 10 runs (5 SUCCESS, 5 FAILED); GET with `?status=SUCCESS`; assert items.size()=5 + every item.status=SUCCESS.

  Pair with TEST-GAP-979, 980, 981 — together this controller's HTTP surface is covered.
