realism_caveats: |
  - The probe relies on the activity partition for "today" being present.
    If ActivityTablePartitionManager has not yet created today's partition,
    the INSERT step fails. Pre-trigger the manager or add explicit
    CREATE TABLE PARTITION OF activity in arrange.

  - The probe runs under DISABLED auth; the cursor is auth-mode-agnostic.

  - If the secondary assertions fail (visual shuffle confirmed), the
    maintainer has empirical evidence for a remediation backlog item
    (REFACTOR-NNN — strengthen cursor to full-microsecond precision).
    The primary assertions (forward correctness) hold either way.

  - The cursor's wire-format on the REST response uses pageInfo.lastEventId
    + pageInfo.lastEventDateTime per OpenAPI; verify field names match
    the actual API contract.

  - If the assertions pass, the cursor is empirically STRICT and the
    static-inferred hypothesis is incorrect. Either outcome is valuable:
    the probe pins the actual behaviour.
