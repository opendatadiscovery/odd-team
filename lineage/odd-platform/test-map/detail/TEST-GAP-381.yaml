behaviour: |-
  `addDataEntityToDEG` rejection paths — line 395-397 rejects auto-ingested (non-manually-created) DEG with `BadUserRequestException`; line 402 rejects duplicate-membership with `BadUserRequestException("already in this DEG")`. Both paths are unpinned. A maintainer adding lineage-graph-DEG features could accidentally drop the `isManuallyCreatedDEG` filter, exposing auto-ingested DEGs to manual mutation. STRENGTHENED batch L — the controller-method sidecar adds the controller-tier primary source confirming the validity predicate at DataEntityServiceImpl.java:483-486 (`isManuallyCreatedDEG`) is reachable via both add and delete paths (DRY ADR; same predicate at lines 394 and 417). The four uncovered cases per the controller sidecar: (a) data_entity_group_id referring to a non-existent entity id, (b) referring to an entity that is NOT a DEG (e.g. a TABLE), (c) referring to an ingested (not manually-created) DEG, (d) referring to a soft-deleted DEG (deleted_at IS NOT NULL). Each should produce a 400 with the specific error message. The OpenAPI description at openapi.yaml:1073 reads 'Adds data entity to manually created data entity group' — the manually-created constraint surfaces in three layers (predicate, error message, spec) per the controller sidecar's implicit_adrs.[0]. See TEST-GAP-488 (cross-owner write-collaborative pin) + TEST-GAP-498 (soft-delete re-add UX defect) + TEST-GAP-501 (null id UX defect) for adjacent controller-tier-scoped entries.
