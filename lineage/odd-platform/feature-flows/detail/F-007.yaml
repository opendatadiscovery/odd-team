batch_extensions:
- batch: P
  entry_point_added: |-
    controller-method:postAlerts (the AlertManagerController#alertManagerWebhook
    method, single-method @PostMapping at `ingestion/alert/alertmanager`).
    Hop-1 of F-007's chain previously cited the class-level
    AlertManagerController sidecar from batch H + the AlertServiceImpl
    sidecar from batch I; this batch closes hop-1 at the METHOD TIER
    with PRIMARY-SOURCE confirmation of the three drift facets named
    in the drift_class_summary header — all anchored at
    AlertManagerController.java:21-26.
  contributing_nodes_added:
  - odd-platform java AlertManagerController controller-method:postAlerts
  notes: |-
    Method-tier primary-source evidence for the three load-bearing
    F-007 drift facets:
    (1) `unauthenticated_payload_trust` confirmed at AlertManagerController.java:21-26 —
    the four-line handler has NO `@PreAuthorize`, NO `@Secured`, NO
    `@ConditionalOnProperty`, NO programmatic auth check, NO header
    inspection. Auth wiring is delegated entirely to
    `SecurityConstants.WHITELIST_PATHS[2]` (`/ingestion/**`) which
    exempts the path from the UI auth chain across all four `auth.type`
    modes, AND to the absence of any path matcher in
    `IngestionDataEntitiesFilter` (line 28 binds to `/ingestion/entities`
    POST only). The endpoint accepts any AlertManager-shaped JSON from
    any caller with network reach under all auth modes. The live doc
    page now documents this verbatim — refreshed 2026-05-20 status 200,
    excerpt: "The AlertManager webhook endpoint is not authenticated.
    ODD Platform whitelists the entire `/ingestion/**` namespace in
    Spring Security, and the ingestion auth filter controlled by
    `auth.ingestion.filter.enabled` only guards `/ingestion/entities`
    (POST) — it does not cover `/ingestion/alert/alertmanager`."
    The doc-side intent is operator-delegated network-layer auth.
    (2) `cross_tenant_alert_creation` confirmed at AlertManagerController.java:24 —
    `req.getAlerts()` is delegated verbatim to
    `AlertService.handleExternalAlerts` with NO validation step between.
    Downstream at AlertServiceImpl.java:178 the `entity_oddrn` label
    is mapped directly to `AlertPojo.dataEntityOddrn` with no check
    that (a) the entity_oddrn refers to an existing DataEntity row,
    (b) the calling principal (if any) is authorised to alert on it.
    A POST with `labels.entity_oddrn=<any-data-entity-oddrn>` produces
    an OPEN alert attributed to that data entity, visible on the target
    entity's page to every authenticated user. Compounded with
    REFACTOR-024 (cross-owner GET /api/alerts) — every authenticated
    user sees forged alerts on the platform-wide All tab.
    (3) `no_idempotency_no_audit` confirmed at AlertManagerController.java:21-26 +
    AlertServiceImpl.java:151-191 vs 222-227 — the method does not
    inspect any `Idempotency-Key` header; the request DTO has no
    idempotency-key field; the downstream `handleExternalAlerts`
    deliberately SKIPS the `AlertActionResolver` (which IS used by
    the in-platform ingestion path at AlertServiceImpl.java:222-227
    for de-duplication via AlertUniqueConstraint snapshots). The
    `createAlerts` private helper (lines 261-300) issues INSERT …
    RETURNING with NO `.onConflict(...)` clause. Prometheus's standard
    retry policy duplicates rows. The method has NO audit log — no
    `log.info(...)` at entry, no `@Timed` Micrometer counter, no
    per-call correlation-id capture. From the operator's perspective
    the only post-hoc signal that a webhook arrived is the alert table
    rows themselves; forensic reconstruction of "who POSTed what when"
    after a forge incident is not possible.
    NEW SUPERSEDE — the live doc page
    `https://docs.opendatadiscovery.org/features/active-platform-features/alerting`
    was 404 in the 2026-05-08 batch H enrichment; refreshed 2026-05-20
    in batch P returns status 200. The page now exists and cross-links
    to this endpoint, documents the Distribution Anomaly halt-toggle
    limitation ("the Distribution Anomaly halt toggle doesn't enforce
    suppression on AlertManager-driven alerts, recommending operators
    use Prometheus Alertmanager configuration layers instead to manage
    alert noise"). The prior 404 finding is SUPERSEDED — flag
    `superseded_by: batch-P 2026-05-20`. Also new: batch P adds two
    SECONDARY drift facets via the sidecar's bugs_limitations_corner_cases
    block: (a) silent loss of timestamp offset (ExternalAlert.startsAt
    is LocalDateTime; Jackson strips RFC3339 timezone offsets — the
    embedded Prometheus query URL is keyed by ODD server's local time
    not the alert's actual time; mirror of batch I `misaligned_timestamp_contract`
    facet); (b) DTO silently drops AlertManager wire fields (`status`,
    `endsAt`, `annotations`, `fingerprint`, `groupKey`, `groupLabels`,
    `commonLabels`, `commonAnnotations`, `externalURL`, `version`,
    `receiver` are all silently dropped — most operationally impactful
    drop is `status: resolved`, the platform never sees the field;
    doc-cross-link confirmed via live alerting page excerpt). Both
    secondary facets are non-headline but represent the architectural
    DTO-shape coupling between AlertManagerController and the wire
    format.
