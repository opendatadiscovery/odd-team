proposed_action: |-
  Add `TagExternalGuardCoverageTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `updateTag_tagWithExternalDataEntityRelation_returns4xx_guardFires` — seed a tag with an `external = true` `tag_to_data_entity` relation; `PUT /api/tags/{id}`; assert 4xx with "Can't update tag which has external relations". PINS the guard fires for the data-entity channel.
  2. `deleteTag_tagWithExternalDataEntityRelation_returns4xx_guardFires` — same setup; `DELETE`; assert 4xx with "Can't delete tag which has external relations".
  3. `updateTag_tagWithOnlyExternalDatasetFieldOrigin_succeeds_pinsGuardGap` — seed a tag with NO external data-entity relation but an `EXTERNAL`-origin `tag_to_dataset_field` relation; `PUT`; assert the call SUCCEEDS (the guard does NOT fire — the gap). PIN the current state.
  4. `deleteTag_tagWithOnlyExternalDatasetFieldOrigin_succeeds_pinsGuardGap` — same setup; `DELETE`; assert the call succeeds and the `tag_to_dataset_field` row is left orphaned.

  Pair with REFACTOR-NNN: extend `getDto`'s `external()` aggregate to also consult `tag_to_dataset_field.origin`. When the fix lands, tests #3-#4 invert to assert a 4xx.
