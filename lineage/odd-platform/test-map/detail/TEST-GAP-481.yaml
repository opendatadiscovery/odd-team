  - "TermServiceImpl.md:security.known_security_gaps.[5] (cross-namespace pollution)"
behaviour: |-
  Cross-namespace term pollution / no per-tenant scoping. Neither TermServiceImpl nor ReactiveTermRepositoryImpl references `odd.tenant-id` or any tenant scoping. `getByNameAndNamespace(List<TermBaseInfoDto>)` (ReactiveTermRepositoryImpl.java:162-179) joins `term` and `namespace` with NO tenant filter. In any deployment where multiple teams share a single platform instance, a description in team-A's namespace that references `[[team-B-ns:term]]` will silently auto-link to team-B's term. There is no concept-level isolation between namespaces in this code path. The system-mission's read-collaborative posture applies here at write-time too — descriptions can cross-link terms regardless of namespace ownership.
test_class: missing-security
