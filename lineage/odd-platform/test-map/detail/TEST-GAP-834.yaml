proposed_action: |-
  Add `IngestionServiceImplSilentAuditTrailLog0EntriesRegressionPinTest`. JUnit + LogCaptor test:

  1. **Setup**: `LogCaptor` configured for the `IngestionServiceImpl` logger (e.g. `LogCaptor.forClass(IngestionServiceImpl.class)`).
  2. **POST /ingestion/entities** with a valid happy-path payload of 5 entities.
  3. **Assert**: `LogCaptor.getLogEvents().size() == 0` — pins the current silent behaviour.
  4. **Sister assertions**:
     - Same setup but happy-path 100 entities → still 0 log entries.
     - Crash-path payload (duplicate ODDRN per TEST-GAP-832) → still 0 log entries from `IngestionServiceImpl` (the WebFlux error handler logs elsewhere).
     - Soft-delete-restore payload (re-ingest a previously-DELETED entity) → still 0 log entries.
  5. **Maintainer-choice gate**: when REFACTOR-NNN lands, update test to assert ≥ 1 INFO-level log line per ingest, with structured fields like `entities_count`, `entities_restored`, `entities_hollow_promoted`, etc.

  Coherence note (LSN-018 Rule 6): NET-NEW. STRENGTHENS the `audit-log-presence-asymmetry-2-tier-audit-story` concept by adding the 7th surface (IngestionServiceImpl). No prior TEST-GAP names the IngestionServiceImpl silent-audit-trail.
