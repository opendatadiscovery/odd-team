behaviour: '`PolicyServiceImpl.update` (line 76) + `.delete` (line 87) reject mutations
  against the seeded `Administrator` name with `BadUserRequestException("Administrator
  policy cannot be updated")` / `"Administrator policy cannot be deleted"`; `.create`
  (lines 62-69) has NO such block. A privileged user can create a SECOND policy with
  `name = "Administrator"` — the DB UNIQUE constraint rejects it because the seeded
  one is live, BUT if the seeded Administrator policy is ever soft-deleted by some
  other path, a custom Administrator policy with arbitrary statements becomes creatable.
  Same shape as Role''s TEST-GAP-220. STRENGTHENED batch I — the PolicyServiceImpl
  sidecar confirms PRIMARY-SOURCE at the service layer: the asymmetry IS in PolicyServiceImpl,
  not a controller-layer omission. The constant `ADMINISTRATOR_POLICY = "Administrator"`
  (line 29) and the explicit rejection text are maintainer-surfaced intent; the absence
  of the same check on create is a structural omission with HIGH confidence. Implicit
  ADR captures this asymmetry as a design choice (or oversight). STRENGTHENED batch
  S — re-verified by the PolicyServiceImpl service-tier closure sidecar (2026-05-20).
  The 7-sidecar cross-batch RBAC audit-silence pattern (E + H + I + N + P + Q + R)
  is now CONFIRMED at the SERVICE TIER with the additional finding that the absence
  of any defending comment + the symmetric absence on the sibling RoleServiceImpl.create
  (see TEST-GAP-689 sister gap NEW batch S) strongly argues OVERSIGHT not intent.
  The cross-RBAC asymmetric guards (Role + Policy both fail to guard on create-path)
  are NOW PRIMARY-SOURCE-CONFIRMED at the service tier on BOTH halves.'
