control_summary: |-
  2 of 4 cells PROBED — integration + security both PROBED-PINNING-BUG.
  Slice-5 adds UI-render-side empirical measurement: P-009 refined REFACTOR-218
  from inferred-full-XSS to measured-partial-XSS (tags pass, attributes
  stripped). Batch-H adds primary-source SQL confirmation
  (ReactiveDataEntityRepositoryImpl.java:430-438) and surfaces a downstream
  SQL-injection surface in getHighlightedResult (lines 799-806) that consumes
  the same internal_description column. Batch-I adds service-tier confirmation
  at DataEntityServiceImpl.upsertDescription (lines 323-333) —
  silent-UPDATE-on-missing-entity (NO pre-existence check, contrast
  createMetadata at lines 257-258) + response-from-request-payload (NOT
  post-write DB read, lines 329-332). Batch-J adds the UI HALF of F-004
  PRIMARY-SOURCE CONFIRMED: NO rehype-sanitize anywhere in the SOLE Markdown
  renderer (`Markdown.tsx:84-127` + zero matches in source/lockfile);
  permission gating is PARTIAL (Edit button gated, content render NOT —
  read-collaborative posture for descriptions); [[ns:term]] mention syntax
  is undocumented + auto-creates term_relations bypassing
  DATA_ENTITY_ADD_TERM; Shift+Enter save shortcut undocumented; Cancel
  silently discards in-flight edits; async term-resolution race exists.
  THREE new doc-gap candidates surface this batch (term-mention syntax /
  Markdown rendering pipeline / partial-gating semantics).

  Batch U extends F-004 with the THIRD MARKDOWN-XSS SURFACE: TERM
  DEFINITION. TermDefinition.tsx → Markdown.tsx → MDEditor.Markdown with
  rehype-raw (NO rehype-sanitize); TermServiceImpl.createTerm + updateTerm
  persist verbatim with no sanitisation pass; ReactiveTermRepositoryImpl
  inherits CRUD with no allowlist. ONE new HIGH-severity drift facet
  (`term_definition_xss_surface_extension_3rd_surface_markdown_rehype_raw`).
  The fix has BROADER leverage than originally scoped — applying
  rehype-sanitize at the SHARED Markdown.tsx component (lines 84-127,
  verified SOLE Markdown renderer across odd-platform-ui) closes all
  THREE surfaces (entity description + dataset-field description + term
  definition) in ONE commit. The mitigations measured at slice-5/slice-6
  (React attribute filtering + Chromium HTML-parser policy) apply
  identically to the term-definition surface; partial-mitigation
  envelope unchanged — SVG-onload + CSS-expression + href-javascript
  vectors remain unmeasured across all three. Cross-link to F-002
  batch-U term_definition_xss_surface_extension_f_004_class_3rd_surface
  (the same observation surfaced on the F-002 side because Term
  lifecycle is THAT feature's domain; this facet on F-004 because XSS
  is THIS feature's domain). Coherence: STRENGTHENS=2, SUPERSEDES=0,
  CONFLICTS=0.
