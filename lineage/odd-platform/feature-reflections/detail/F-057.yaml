- id: H-006
  hypothesis: |-
    Setting a severity twice (Major, then Critical) is recorded as two distinct changes the
    platform can replay — i.e. the history of severity transitions is retained.
  derivation: 'pillar audit expectation — an audit/compliance audience expects a sequence of changes, not just a current value.'
  seed_source: negative-space + pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The persistence is a single upsert row keyed on (DATA_QUALITY_TEST_ID, DATASET_ID) with
      onDuplicateKeyUpdate overwriting SEVERITY (ReactiveDataQualityRepositoryImpl.java:90-97).
      The second write overwrites the first in place; there is no history table, no version
      column, no append. The prior severity is not even READ before being overwritten (the set
      is unconditional), so it is unrecoverable from platform storage the instant the second
      write commits. Same shape as F-013 silent UPDATE-not-UPSERT but on a compliance-impactful
      surface.
    evidence:
      - sidecar: '(absent — source read for validation)'
        section: repository
        cite: 'ReactiveDataQualityRepositoryImpl.java:86-102'
        note: 'onDuplicateKeyUpdate; single row; no version/history; prior value not read'
        source_read_for_validation: true
    operator_visible_failure: |-
      "This test was Minor last quarter, who escalated it and when" is unanswerable — only the
      current value survives. For a regulated-data operator (financial / healthcare / government,
      the audience the SHB-044 seed names) this means the severity classification — which directly
      drives the externally-visible SLA colour — has zero auditable change trail. Combined with
      H-001 (no event, no actor), severity is the least-accountable mutation in a pillar whose
      whole point is trustworthy data-health signal.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

