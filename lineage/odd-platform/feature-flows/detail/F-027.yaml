  - odd-platform java MinioConfig config-class:MinioConfig
  notes: |-
    Six new drift facets surface, all primary-source at
    MinioConfig.java:1-26, anchored on the REMOTE storage-wiring
    layer:

    (1) **LSN-002 PRIMARY-SOURCE CONFIRMED — `.region(...)` NEVER
    CALLED (HIGH severity — canonical LSN-002 surface)** — The
    `MinioAsyncClient.builder()` chain at lines 19-25 is exactly
    `.endpoint(url).credentials(accessKey, secretKey).build()` — NO
    `.region(...)` invocation. The SDK's default `us-east-1` governs
    all signing. Operators running ODD against AWS S3 in any other
    region (eu-west-1, us-west-2, ap-southeast-1, etc.) see opaque
    `AuthorizationHeaderMalformed` / `PermanentRedirect` errors on
    the first putObject call. Self-hosted MinIO is unaffected
    (MinIO ignores the region header), so the operator-facing
    contract is "AWS S3 in any region except us-east-1 is broken; the
    self-hosted MinIO path is healthy." The doc-side remediation is
    HEALTHY: the live operator page at
    `docs.opendatadiscovery.org/configuration-and-deployment/odd-platform`
    (WebFetched 2026-05-20 status 200, anchor
    `#attachment-storage-configuration` resolves) carries the
    us-east-1 caveat verbatim. The CODE-side residue is UNMITIGATED:
    no `attachment.remote.region` config key anywhere in the
    codebase (grep returns zero matches), no in-code comment
    cross-referencing LSN-002, no `@PostConstruct` guard.
    PRIMARY-SOURCE confirmation of F-027 batch-V
    `attachment_lsn_002_minio_region_unset_us_east_1_default` drift
    facet — the facet is now anchored at MinioConfig.java:21-24
    (the absent `.region(...)` call) + cross-referenced from the
    DataEntityAttachmentController class sidecar batch V.

    (2) **@ConditionalOnProperty REMOTE OPT-IN PRIMARY-SOURCE
    (POSITIVE invariant)** — MinioConfig.java:10
    `@ConditionalOnProperty(value = "attachment.storage",
    havingValue = "REMOTE")` confirms the bean materialises ONLY
    when the operator explicitly sets `attachment.storage=REMOTE`.
    Mirrors `LocalFileUploadServiceImpl.java:26` (`havingValue =
    "LOCAL", matchIfMissing = true`) — the mutual-exclusion + LOCAL
    default pattern. The `matchIfMissing=true` on LOCAL is the
    LSN-001 root (the LOCAL-ephemeral default that wiped production
    data on container restart); the REMOTE opt-in is the
    OPERATOR-FRIENDLY-EXIT from LSN-001. STRENGTHENS F-027 batch-V
    `attachment_storage_strategy_via_conditionalonproperty_local_default_match_if_missing`
    drift facet with the REMOTE-mode bean-factory anchor.

    (3) **GATE-5 UNSET-PARAMETER AUDIT — THREE
    CAVEAT-DEFAULTED PARAMETERS (HIGH structural — playbook
    compliance evidence)** — Per the Gate-5 unset-parameter-audit
    playbook (`playbooks/unset-parameter-audit.md` — the playbook
    that LSN-002 motivated), every parameter of the
    `MinioAsyncClient.builder()` call is now classified at primary
    source: (a) `.endpoint(...)` configured from
