proposed_action: |-
  Add `AttachmentLinkUrlSchemeAllowlistTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `saveLinks_withJavascriptScheme_persistsVerbatim_pinsCurrentMissingAllowlist` — POST `/api/dataentities/100/links` with `{ items: [{ url: "javascript:alert(1)", description: "..." }] }`; assert HTTP 200; GET `/api/dataentities/100/attachments`; assert the link URL is byte-equal to `javascript:alert(1)`.
  2. `saveLinks_withDataUriScheme_persistsVerbatim` — sister test for `data:text/html,<script>...` scheme.
  3. `saveLinks_withVbscriptScheme_persistsVerbatim` — sister test.
  4. `saveLinks_withFileScheme_persistsVerbatim` — sister test for `file://` scheme.
  5. `saveLinks_withMaxLengthBoundary_acceptsArbitrarilyLongUrl` — pin the absence of length cap: POST with a 1MB URL string; assert HTTP 200; PIN the no-length-cap contract.

  Add a `// REGRESSION-PIN — Link URL has no scheme allowlist, no length cap. The UI render-tier is the operative defence (or absence thereof). A REFACTOR adding a scheme allowlist (e.g. only allow http/https/ftp/sftp/mailto) will break tests #1-#4. The maintainer must re-author them to assert the BadUserRequestException + the scheme-rejected error message.` comment block.

  Pair with REFACTOR-NNN: implement scheme allowlist + length cap at LinkServiceImpl OR at the OpenAPI schema layer (preferred — declarative); pair with DOC-NNN disclosing the current absent contract and the future allowlist.
