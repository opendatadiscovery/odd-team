name: Data Entity
canonical_in_docs: true
canonical_candidate: false
description: 'The platform''s unit of metadata — datasets, transformers, consumers,
  quality tests, groups, and inputs — addressable by ODDRN. The central domain object
  spanning catalog navigation, lineage, alerts, ownership, tags, terms, descriptions,
  status, metadata, and discussions. **Batch F** completes the centerpiece-read +
  ownership-binding + status-lifecycle + lineage-graph surface: getDataEntityDetails
  (the platform''s single hottest endpoint; view-count side-effect; cross-owner full-payload
  exposure on the CENTERPIECE READ), createOwnership (Owner+Title auto-create-on-miss
  bypassing OWNER_CREATE permission), updateStatus (HIGH-severity ordering bug breaking
  30-day housekeeping TTL; programmatic audit-log emission confirmed), getDataEntityDownstreamLineage
  (recursive-CTE; null-Integer NPE; no depth cap; cross-owner graph enumeration vector).'
axes_present:
- controllers
- openapi_tags
