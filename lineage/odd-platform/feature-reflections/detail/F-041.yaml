      parent ODD Platform tab to a phishing target (reverse tabnabbing). Modern browsers default _blank to
      noopener since ~2020, but the react-router <Link> abstraction + compatibility-trailing browsers may not
      honour the modern default — explicit rel is the correct hardening. ALREADY TRACKED as PLT-088 Defect 2.
    evidence:
