name: |-
  Slack 429 Retry-After header silently ignored — no rate-limit honour, no exponential back-off, no DLQ (batch Y)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
description: |-
  NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20Y — surfaced by primary-source
  examination of SlackNotificationSender.java + AbstractNotificationSender.java.
  Slack's incoming-webhook API rate-limits at ~1 message per second per
  webhook and returns HTTP 429 with a Retry-After header on burst overflow;
  the platform discards the response body and headers and treats every
  non-200 as a uniform NotificationSenderException.

  THE PRIMARY-SOURCE EVIDENCE — SlackNotificationSender batch Y:

    SlackNotificationSender.java:43-48 (the send chain):
      sends an HttpRequest.POST built without rate-aware headers; delegates
      to AbstractNotificationSender.sendAndValidate(request).

    AbstractNotificationSender.java:24-29 (the validation check):
      if (response.statusCode() != HttpStatus.OK.value()) {
          throw new NotificationSenderException(...);
      }
    The check is binary (200 vs non-200); response.headers() is NEVER
    consulted, response.body() is NEVER logged. The Retry-After header (a
    standard HTTP cache-control mechanism for rate-limited responses,
    RFC 6585 §4) is structurally invisible to the platform.

  THE FAILURE MODE — bursty alert flows:

    Slack documents the webhook rate limit as ~1 message per second per
    webhook (short bursts allowed; sustained excess returns 429). For an
    ODD deployment with bursty alert sources — a single failed dbt run
    can produce 50+ FAILED_DQ_TEST alerts, a backwards-incompatible
    schema deploy can produce 1 alert per table — the platform will hit
    Slack's rate limit within seconds.

    Each rate-limited message:
      1. POSTs from this sender's send() at SlackNotificationSender.java:48
      2. Slack returns HTTP 429 + Retry-After: 1 (or higher)
      3. AbstractNotificationSender.sendAndValidate at line 26 sees
         statusCode != 200, raises NotificationSenderException
      4. AlertNotificationMessageProcessor.java:31 catches the exception,
         logs at ERROR, moves to the next sender (Webhook then Email)
      5. NotificationSubscriber.java:83-84 advances setAppliedLSN unconditionally
         AFTER process() returns
      6. The next WAL alert event arrives ~immediately (the WAL stream
         does not throttle); the cycle repeats
      7. Slack continues to 429 until the burst clears (typically seconds
         to minutes)

    Net effect: every rate-limited alert is DROPPED from the Slack channel
    permanently. The operator-visible signal is a sequence of identical
    log.error lines with no rate-limit classification, no Retry-After
    value, no body text.

  THE STRUCTURAL EXTENSIONS BEYOND SLACK:

    AbstractNotificationSender is the SHARED parent for both
    SlackNotificationSender AND WebhookNotificationSender. The 200-only
    binary check applies to BOTH. The Webhook channel inherits the same
    rate-limit-blind behaviour for any receiver that returns 429 (most
    webhook receivers under burst load do return 429 — Discord, Microsoft
    Teams, PagerDuty, custom-incident-managers).

    The email channel uses JavaMailSender (SMTP), which has its own
    rate-limit semantics (SMTP RCPT-level rejection codes 421 / 450 /
    452); EmailNotificationSender does not handle them either, but the
    failure mode is shaped differently and is covered by the existing
    per-recipient fail-stop invariant.

  THE CONTRAST WITH SLACK'S OWN AdvICE:

    Slack's developer documentation (slack.com/docs — referenced
    indirectly in the live doc page silence) explicitly tells webhook
    consumers to honour Retry-After. The platform's silence is therefore
    a CONTRACT VIOLATION with the documented expectation of the
    receiver, not merely a missing-feature gap.

  CROSS-LINK TO REFACTOR-129 (batch C):

    The existing "No rate-limiting at any layer" finding (catalogued at
    NotificationsProperties.md:bugs_limitations_corner_cases.[10]) named
    the absence of CLIENT-side rate limiting (no token bucket on the
    sender). This invariant identifies the RECEIVER-side rate-limit-
    signalling-ignored gap — these are sibling findings: even if the
    platform never throttles outbound, honouring Retry-After would
    convert "burst loss" into "burst delay". Both fixes are valuable;
    neither is present.

  CROSS-LINK TO THE NO-RETRY-NO-DLQ FINDING:

    The Slack sender batch Y (and the Webhook sender batch Y)
    explicitly named NO retry / NO DLQ / NO audit on failed delivery.
    The Retry-After-ignored invariant is a SPECIFIC manifestation of
    that broader gap — even Slack's explicit "retry after N seconds"
    hint is not honoured because the code path lacks the architecture
    to retry at all.

  SEVERITY MEDIUM — bounded by alert-burst rate at the deployment; for
  low-cadence deployments this is a tolerable gap, for high-cadence
  deployments it is a delivery-correctness issue with no operator
  visibility.
