  contributing_nodes_added: []  # no chain extension on the F-007 side — the new content lives downstream as F-009 batch Y
  notes: |-
    Three cross-feature observations:

    (1) F-007 → F-009 DOWNSTREAM-CHAIN PRIMARY-SOURCE COMPLETE
    (HIGH severity, structural compound) — Before batch Y, F-007's
    OPEN-ALERT side effect (db-write to the `alert` table) was the
    documented chain terminus; the downstream outbound notification
    delivery was conceptually known but not primary-source anchored.
    Batch Y closes this gap. The full F-007 → F-009 pipeline is now:
      F-007 hop-1 (AlertManagerController.postAlerts) — POST handler
        accepts the AlertManager payload (UNAUTHENTICATED under
        `auth.type=DISABLED`, AUTHENTICATED any-role otherwise).
      F-007 hop-2 (AlertServiceImpl.handleExternalAlerts →
        createAlerts) — batched INSERT into ALERT table.
      F-007 → F-009 BRIDGE — Postgres logical replication slot
        captures the INSERT on ALERT (NotificationSubscriber batch Y
        sidecar L51 `registerPublication(connection, Tables.ALERT)`).
      F-009 hop-1 (NotificationSubscriber.run) — single-thread
        leader-elected reads the WAL event.
      F-009 hop-3 (AlertNotificationMessageProcessor.process via
        PostgresWALMessageProcessor SPI) — translate + fan-out.
      F-009 hop-4a/b/c (Slack/Webhook/Email senders) — outbound
        delivery to operator-configured channels.

    The HIGH-severity compound: a forged AlertManager webhook under
    DISABLED mode (F-007 headline finding —
    `unauthenticated_payload_trust` drift) creates an alert that
    REACHES every Slack channel, webhook URL, and email recipient
    cluster-wide — with NO operator-side authentication signal at
    any hop AND with the F-009 mrkdwn-injection surface (F-004
    6th XSS surface, F-009 batch Y facet 11) allowing an attacker-
    controlled `description` to inject `@channel` broadcasts in
    the Slack workspace. The compound spans 4 surfaces now:
      F-007 (CREATES via forged ingest) →
      F-009 + F-004 (DELIVERS the forged content with mrkdwn
        injection on Slack channel) →
      F-014 (DISPLAYS at per-entity alerts) →
      F-022 (DISPLAYS at per-dataset Test reports tab).

    NEW drift facet for F-007:
    `downstream_notification_delivery_chain_amplifies_forged_alertmanager_to_every_configured_channel_with_mrkdwn_injection_compound`.

