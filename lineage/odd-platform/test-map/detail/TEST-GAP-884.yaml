behaviour: |-
  **HIGH — `POST /api/tags` (createTag) bulk-create atomicity on a duplicate name is UNVERIFIED. The endpoint accepts a `BulkTagFormData` array and delegates to the inherited `ReactiveAbstractCRUDRepository.bulkCreate` (`:114-126`), which emits a single `insertManyReturning` multi-row INSERT with NO `ON CONFLICT` clause. A payload `[{"name":"a"},{"name":"a"}]` (in-batch self-duplicate) or a payload containing a name already present in the directory (cross-batch duplicate) hits the partial unique index `tag_name_unique` (`V0_0_64__remove_is_deleted_field.sql:105`). Whether the whole INSERT rolls back ATOMICALLY (zero rows created) or PARTIALLY COMMITS (the distinct names land) is NOT statically determinable — it depends on the R2DBC insertManyReturning emission shape and Spring's reactive-TX rollback semantics. A partial-commit outcome is a silent data-shape bug: the operator submits a 5-tag batch, gets a 4xx error, and 4 tags exist anyway.** Method-level primary source from the batch-X-TAGGING `createTag` controller-method sidecar:

  - `TagController.createTag` (`:22-28`): `.collectList()`s the inbound `Flux<TagFormData>`, hands the list to `tagService.bulkCreate`. 3-line delegation, no business logic.
  - `TagServiceImpl.bulkCreate` (`:37-42`): `tags.stream().map(tagMapper::mapToPojo).toList()` then `reactiveTagRepository.bulkCreate(pojos).map(tagMapper::mapToTag)`. NO `@ReactiveTransactional` at the service tier.
  - `ReactiveAbstractCRUDRepository.bulkCreate` (`:114-126`, `@ReactiveTransactional`): empty-collection short-circuit to `Flux.just()` (`:115-117`); else a single `insertManyReturning` multi-row INSERT with NO `ON CONFLICT`. The transactional boundary is INHERITED here, not at the controller or service.
  - The duplicate translates: a `tag_name_unique` partial-index violation maps via `JooqReactiveOperations` -> `UniqueConstraintException("Tag with this name already exists")` per `ExceptionUtils.java:54-56`.

  **Two distinct sub-behaviours, both unpinned:**
  - **In-batch self-duplicate atomicity** — `[{"name":"a"},{"name":"a"}]`: the second row collides on `tag_name_unique`. Does the whole multi-row INSERT roll back (zero `a` rows), or does the first `a` land and the second fail? P-026 pins this.
  - **Cross-batch duplicate** — a name already in the directory: `createTag` is fail-on-duplicate (no upsert — the deliberate counterpart of the Collector path's `getOrInjectTagByName`). The whole batch fails. The caller cannot tell WHICH name collided from the exception text.

  **Why this is a data-shape contract, not a cosmetic gap**: a partial-commit regression is BOTH silent and operator-visible — a failed batch that left rows behind. Converting probe P-026 into a Testcontainers `@SpringBootTest` would put the data-shape contract permanently under CI.

  **Test gap shape**: a `WebTestClient` / `@SpringBootTest` test asserting (a) `POST /api/tags` with `[{"name":"x"},{"name":"x"}]` returns a 4xx AND a follow-up `GET /api/tags?query=x` returns zero rows (atomic rollback — NO partial commit); (b) `POST /api/tags` with a name already in the directory returns a 4xx with the UniqueConstraintException message and NO 500; (c) the `tag_name_unique` partial index's WHERE predicate is verifiable via `pg_indexes`. The current state is PINNED at whatever P-026 establishes.
