proposed_action: |-
  Stand up the DataSource test classes:
  1. Create (or reuse) a Testcontainers-backed `@SpringBootTest` base (`BaseIntegrationTest` for HTTP-tier, `BaseIngestionTest` for the S2S ingestion-cutover test) and an RBAC-permission test fixture that injects a caller holding a specified `DATA_SOURCE_CREATE` / `DATA_SOURCE_UPDATE` / `DATA_SOURCE_DELETE` / `DATA_SOURCE_TOKEN_REGENERATE` permission set; add an `auth.type=DISABLED` context for the bypass cells (TEST-GAP-899).
  2. Add HTTP-floor smoke tests: `GET /api/datasources` → 200; `POST /api/datasources` → 200; `PUT /api/datasources/{id}` → 200; `PUT /api/datasources/{id}/token` → 200; `DELETE /api/datasources/{id}` → 204 (no children).
  3. House the behaviour-level test classes proposed by TEST-GAP-898..908 (token-rotation cutover, DISABLED RBAC matrix, concurrent rotation, list token masking, register transaction-rollback, update 404-on-missing, list HTTP-floor + ordering, list query divergence, regenerate null-token 500, register/update 201-vs-200) and TEST-GAP-749..753 in this package.

  This META gap is the parent backlog item for the tests-pillar DataSourceController effort.
  Triage the 11+5 individual gaps as child test-authoring tasks under it.
