behaviour: |-
  **`shouldHandle(provider)` contract — case-insensitive Google match, partial-string non-match.** Line 39: `return Provider.GOOGLE.name().equalsIgnoreCase(provider);`. Returns true for 'google' / 'GOOGLE' / 'Google' / 'GoOgLe' (case-insensitive); returns false for 'GOOGL' (partial), 'google ' (trailing space), null, empty, 'github', 'azure'. The dispatcher `OAuthSecurityConfiguration.java:185-189` picks the FIRST `shouldHandle == true` from the `oidcUserHandlers` list — current handlers are uniquely-disjoint by provider string, so first-match-wins is safe today. But CustomOIDCUserHandler.shouldHandle returns true for ANY provider NOT in the `Provider` enum (CustomOIDCUserHandler.java:28-34) — a future handler with OVERLAPPING coverage (e.g. an OktaUserHandler claiming 'okta' which Custom also claims) depends on Spring's bean-list ordering for correctness. The fragility is undocumented; the test pins the case-insensitive Google contract AND the non-overlap-today expectation.
