mitigations_unimplemented:
  - |-
    Document the design intent at the internal architecture page —
    explicit text: "TagServiceImpl's @ReactiveTransactional
    distribution: methods that issue multi-step DB sequences carry
    the annotation; methods that delegate single-step to the
    repository do not. The 'multi-step read-then-write' methods
    intentionally lack TX because the DB-tier ON CONFLICT clause
    (where present) provides the consistency guarantee. The
    bulkCreate path (race-prone) surfaces UniqueConstraintException;
    callers must handle it as 'already created'." Documents the
    intent so future contributors don't accidentally "fix" the
    omission.
  - |-
    Add tests pinning the race-semantic ASYMMETRY between
    getOrCreateTagsByName (race-prone) and getOrInjectTagByName
    (race-tolerant). The intent is the architectural decision; the
    tests pin it. A future refactor that collapses the two methods
    into one would FAIL the tests rather than silently changing
    semantics.
  - |-
    Add tests for `deleteRelationsWithTerm` concurrent-add scenario.
    Pin the silent-miss behaviour as a baseline. If the silent-miss
    is unacceptable, the fix is to wrap the method in
    @ReactiveTransactional with isolation = SERIALIZABLE (which
    would surface 40001 serialization-failure on the loser, allowing
    a retry path).
  - |-
    Consider promoting the no-TX-by-design observation to an
    `@AutoCreateOnMissNoTx` aspect-or-annotation. The four-method
    pattern (getOrCreate-or-similar) appears across at least 5
    services per the cross-batch evidence. Centralising the rationale
    + the convention reduces the surface for future refactor-bypass.
  - |-
    Add an architectural-decision-record (ADR) drafted in
    `adrs/drafts/` capturing the design intent — when does a service
    method get @ReactiveTransactional, when does it NOT, and why.
    Cite the four cross-batch instances (Tag, Owner, Namespace,
    MetadataField) as the evidence base.

notes: |-
  CAPTURED batch VAL-LSN-019 (2026-05-20). The cross-method
  enumeration is the LSN-019 Stress Protocol's E-category output
  applied to TagServiceImpl: every @ReactiveTransactional decision
  is interrogated; the absences are surfaced explicitly. The pattern
  is consistent (the architectural intent is inferable) but
  undocumented (no comment defends it).

  Cross-cutting connections:
    - Pairs with `tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race`
      (the HIGH-severity surface where the no-TX choice creates the
      race window)
    - Pairs with `ingestdata-upsert-with-returning-conflict-trigger`
      (the SAFE counterpart that the no-TX choice routes through for
      ingestion-tier writes)
    - Pairs with `repository-transactional-boundary-at-service-layer-not-repository`
      (the broader pattern — the repository tier is NOT
      @ReactiveTransactional; the service tier carries the TX where
      one is needed)
    - Pairs with the LSN-019 Stress Protocol — the E-category
      auto-question on every @ReactiveTransactional method is what
      surfaced this cross-method consistency analysis

  Two DOC-NNN candidates:
    (a) Document the design intent at the internal architecture page
        on the service-tier transactional discipline
    (b) ADR draft capturing the four-method @ReactiveTransactional
        rationale + the four cross-batch evidence sites
