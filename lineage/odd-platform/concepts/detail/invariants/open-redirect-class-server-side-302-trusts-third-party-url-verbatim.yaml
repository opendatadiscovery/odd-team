mitigations_unimplemented:
  - |-
    Add a URI validator to DataCollaborationController.redirect that:
    (a) parses providerUrl in a try/catch (catch IllegalArgumentException
    → 502 Bad Gateway), (b) validates scheme is https,
    (c) validates host ends with .slack.com OR equals slack.com,
    (d) optionally validates path starts with /archives/. Reject
    with structured 502 on any validation failure. 15-25 lines of code.
  - |-
    Add a deny-list of forbidden schemes (javascript:, data:, file:)
    as a first-pass defence-in-depth. Cheaper than (a)-(d) above
    but only catches the most-egregious attacker scenarios.
  - |-
    Document the URL validation rules on the live api-reference
    page. Operator-visible signal that the redirect is bounded;
    raises operator confidence in the endpoint's safety.
  - |-
    Add a security-test case asserting that a mocked SlackAPIClient
    returning a non-slack.com URL produces a 502 (not 302). Pin
    the validation behaviour in CI.
notes: |-
  NEW MEDIUM-severity invariant captured in batch 2026-05-25-ZF
  from DataCollaborationController class-level primary-source
  evidence at the redirect handler site. The finding is one of
  three composable security gaps at this endpoint; the other
  two are:
    - missing RBAC (any authenticated user can call) —
      `rbac-read-endpoints-no-securityrule-authenticated-only-fall-through`
    - missing Mono.empty → 404 path —
      `integration-wizard-204-on-missing-id-not-404-silent-empty`

  The three together compose into a message-existence-by-id
  oracle PLUS a phishing-via-Slack-workspace-control class. A
  single bug-class scanner would flag the open-redirect immediately;
  the platform has been shipping this surface for as long as the
  Data Collaboration feature has existed.

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the URL validation rules on the api-reference
        page once the fix ships
    (b) Document operator-side mitigation (e.g., reverse-proxy
        with allowlist) pending the fix
