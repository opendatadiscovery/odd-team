  - name: "Plaintext-equality shared-secret token model"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Collector authentication uses a 40-char alphanumeric token stored in plaintext in the TOKEN table; IngestionDataEntitiesFilter validates incoming /ingestion/entities requests via literal `.equals(...)` against the in-DB value. No hashing layer, no HMAC, no per-request signature. Rotation is in-place UPDATE — no overlap window. The model is consistent with the token being a long-random opaque string used over TLS-protected transport, but DB compromise / backup / replica carries credentials in the clear. RandomStringUtils.randomAlphanumeric(40) uses ThreadLocalRandom (non-CSPRNG); should be .secure().nextAlphanumeric(40). Triangulated across WRITE-side (regenerateCollectorToken) AND VERIFY-side (IngestionDataEntitiesFilter@L20) sidecars in 2026-05-10B."
    axes_present:
      - controllers
      - config_prefixes
    nodes:
      - "odd-platform java CollectorController controller-method:regenerateCollectorToken"
      - "odd-platform java IngestionDataEntitiesFilter config-key-consumer:auth.ingestion.filter.enabled@L20"
    contributors:
      - "regenerateCollectorToken.implicit_adrs[1]: token rotation is in-place UPDATE, not append-new-then-revoke-old"
      - "regenerateCollectorToken.implicit_adrs[2]: token returned in plaintext on rotation, masked on read"
      - "regenerateCollectorToken.implicit_adrs[3]: token authentication is plaintext-equality against in-DB string; no hashing layer"
      - "IngestionDataEntitiesFilter@L20.implicit_adrs[2]: VERIFY-side carry of the same stance — `if (!dto.tokenPojo().getValue().equals(token))` at line 56. Not BCrypt.matches, not MessageDigest.isEqual, not HMAC verification. The shared-secret-stored-plaintext stance carries across the rotate-side AND the verify-side."
    evidence:
      - "regenerateCollectorToken.md:implicit_adrs.[1,2,3]"
      - "regenerateCollectorToken.md:security.known_security_gaps.[1,3]"
      - "IngestionDataEntitiesFilter@L20.md:implicit_adrs.[2]"
      - "IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[1] (plaintext-equality timing-attack consideration)"
    notes: |
      Trade-off is explicit in the code: the model assumes (a) TLS protects
      transport, (b) the DB is trusted, (c) operators rotate when a token
      is compromised. The catalog records this as an invariant so future
      audits know the threat model the maintainers chose. Open question:
      should rotation use a CSPRNG and offer a grace window? Batch 2026-05-10B
      adds the verify-side corroboration: the same plaintext-equality stance
      is implemented identically on both ends, so any change to one MUST
      coordinate with the other (e.g. adding a hashing layer at rotate
      requires changing the verify-side from .equals to BCrypt.matches).

