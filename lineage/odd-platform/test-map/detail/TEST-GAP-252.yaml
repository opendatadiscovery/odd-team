gap_id: TEST-GAP-252
category: missing-security
criticality: LOW
node_ids:
- odd-platform java SearchController controller-method:search
surfaced_by:
- search.md:bugs_limitations_corner_cases.[4]
behaviour: Search-session UUID has no owner column / no per-user binding — `search_facets`
  rows are keyed solely by a server-generated UUID. A user who guesses or observes
  another user's `search_id` UUID can call `GET /api/search/{search_id}/results`,
  `GET /api/search/{search_id}/facet/{facet_type}`, `PUT /api/search/{search_id}`
  (updateSearchFacets), or `GET /api/search/{search_id}/data_entities/{data_entity_id}/highlights`
  against it. UUIDs are server-generated v4-random (high entropy), but the principle
  of per-user session isolation is violated by absence — under read-collaborative
  posture this is impact-minimal; under any future owner-scoped search tightening
  this becomes HIGH.
