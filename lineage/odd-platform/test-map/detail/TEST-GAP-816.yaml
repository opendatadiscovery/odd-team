behaviour: |-
  **CRITICAL — Sequential ODDRN id enumeration + cross-owner read = full DEG-membership graph harvestable in O(N) requests with no rate-limit, no audit-log, no metric counter.**

  The DEG ODDRN generator at `DataEntityGroupServiceImpl.java:191-200` produces `ODDPlatformDataEntityGroupPath.builder().id(pojo.getId()).build()` — the `{id}` segment is the row's monotonically-increasing primary key. An attacker iterating `id ∈ [1..N]` and submitting `GET /ingestion/entities/<odd_oddrn>/?id=$id` for each value receives:
  - **200 with members** for live DEGs (the member-list contract — TEST-GAP-815 establishes anonymous reach).
  - **200 with empty items** for unused / soft-deleted DEG ids (TEST-GAP-817 establishes the 404-vs-empty silent conflation that prevents an attacker from telling which case applies but does NOT prevent the harvest).

  **Cross-owner dimension**: the controller / service / repository chain applies NO owner-scoping filter (verified: `DataEntityGroupServiceImpl.java:47-59` constructor has no AuthIdentityProvider; `ReactiveDataEntityRepositoryImpl.java:318-326` does no `OWNERSHIP` join). Any caller reads ANY DEG owned by ANY owner — extending the REFACTOR-024 / REFACTOR-203 / REFACTOR-340 read-collaborative posture to the S2S surface as a 6th surface in the family.

  **Defence absences**:
  - **No rate-limit at the controller** (verified: no `@RateLimiter` annotation, no per-IP throttle in the WebFlux pipeline).
  - **No audit-log entry on access** (verified: no `activityService.create(...)` call in controller or service; no `log.info/warn` line; no `meterRegistry.counter(...)`).
  - **No anomaly detection on burst-rate enumeration**.
  - **No marker on the response that the caller hit a "no such DEG" vs "DEG exists with no members"** — so probing is undetectable from response content alone.

  **Result chain**:
  1. Attacker (unauthenticated under default, authenticated-as-anyone otherwise) enumerates `id ∈ [1..N]` with a small script.
  2. For each live DEG, collects the member ODDRNs + DataEntityType.
  3. Combines with downstream `GET /api/dataentities/{id}` (only reachable when UI auth is permissive) for full metadata — but even without it, the ODDRN string contains the parent datasource path + entity name + namespace, leaking the catalog's data-product taxonomy.
  4. A post-incident question "which DEGs did the attacker enumerate?" has NO operational answer from application logs.

  **Why CRITICAL** (over the HIGH severity the sidecar rates): the enumeration is **trivially scriptable** + **defence-absent across all five mechanisms** (auth, rate, audit, anomaly, content-marker). Combined with TEST-GAP-815 (unauthenticated reach) this is the same shape as a public-API catalog dump but advertised as "ingestion" so operators do not include it in their attack-surface model.

  **Test gap shape**: probe-test that submits N=100 sequential-id GETs in <1s and asserts (a) zero 429 Too Many Requests responses; (b) zero entries in `activity_event` table after the burst; (c) zero `meterRegistry` counter increments. PINS the current open-by-default + audit-silent behaviour.
