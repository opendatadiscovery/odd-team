behaviour: |-
  **The three POLICY READ endpoints — GET /api/policies/{id} (getPolicyDetails),
  GET /api/policies (getPolicyList), GET /api/policies/schema (getPolicySchema)
  — have NO SECURITY_RULES entry; ANY authenticated user can read every policy
  by id and fetch the live schema regardless of role/permission.** The
  AuthorizationCustomizer.java:29-30 catch-all .pathMatchers("/**")
  .authenticated() is the only gate. The bypass is structural: it is consistent
  with implicit_adr "read-collaborative posture" (reads return what the policy
  resolves; gating the read would be tautological) but the design choice has
  a visibility cost — a user with no permission can enumerate the entire
  RBAC policy graph by iterating policy ids. The /api/policies/schema endpoint
  is the catalogue of every valid policy shape; an attacker can learn the
  platform's policy DSL by an unauthenticated probe under DISABLED. No test
  pins the open-read posture; a future fix that added POLICY_READ would
  silently break the UI's PolicyList catalogue rendering.
