notes: |
  Operation vocabulary captured for the platform-internal ingestion-derived alert
  write path. Two test gaps surface:

    (a) The activity emission paths inside applyAlertActions are NOT directly
        asserted in any test (AlertIngestionTest asserts alert status but NOT
        the activity-feed rows).

    (b) The discriminator dispatch is not directly unit-tested — a regression
        that drops one of the if-let-else branches would silently change
        ingestion semantics.

