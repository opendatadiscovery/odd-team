axes_present:
- ui_components
security_aggregate:
  overall: MEDIUM
  authorization_consistency:
    verdict: INCONSISTENT
    detail: 'Component itself enforces no authorization on the READ; passes 3-permission
      vector to WithPermissionsProvider for descendant MUTATION affordances only.
      Read is unguarded — any user reaching the route mounts this page and triggers
      all 5 dispatches.'
  owner_scoping:
    verdict: BYPASSES
    detail: Component passes dataEntityId directly to thunks without owner filtering;
      no UI signal that the user is reading another owner's entity (no banner, no
      permission-aware redirect, no soft-gate prompt).
  weaknesses:
  - 'Front-end embodiment of the read-collaborative posture; the user-observable
    surface where REFACTOR-024/203 is realised on the per-entity detail page'
  - 'DISABLED-mode page-open is anonymous + inflates view_count (probe P-002)'
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - 'Component mount → 5 Redux dispatches (6 with LSN-017) → 6 backend GET requests.
    Every entity-detail page navigation runs this lifecycle. Probe P-003 baseline:
    backend GET p50=106ms p95=202ms p99=1539ms.'
  weaknesses:
  - 'LSN-017 doubles network round-trip cost per page-open (MEDIUM) — fix is 1
    line at line 63'
  - 'Skeleton flicker on legitimate re-fetch — the render gate predicates on BOTH
    details.id AND !isDataEntityDetailsFetching'
  - 'No request coalescing / deduplication at the thunk layer'
notes: |-
  New concept captured in batch 2026-05-19J. The DataEntityDetails shell is the
  TOP-LEVEL orchestrator for the per-entity detail-page UX. The component pattern
  (page-component owns data-fetch lifecycle) is consistent across the platform's
  detail pages — replicated in TermDetails, AlertDetails, PolicyDetails, etc.
  Maintainer extending the catalog with new entity types should follow this
  pattern.

  The component is the canonical example of "cross-layer user-effects invisible
  to per-node scans" (LSN-017 retro title): the dep-array bug at the UI layer is
  the cause; the backend +view_count UPDATE is the effect; no per-layer scan
  would have caught the doubling. The fix (one line at 63) closes the F-001
  inflation surface 50% from the UI side.
