proposed_action: |-
  Repository-layer unit + integration test. (a) Create a dataset_field via `bulkCreate` with `internalDescription='abc'`. (b) Call `updateDescription(id, "")`. Read back. Assert `internalDescription IS NULL`. (c) Call `updateDescription(id, null)`. Read back. Assert `internalDescription IS NULL`. (d) Call `updateDescription(id, "  ")` (whitespace). Read back. Assert `internalDescription = "  "` (whitespace is NOT trimmed today — pin the current behaviour). (e) Call `updateDescription(99999999, "x")` (non-existent id). Assert the returned Mono is EMPTY (no error). (f) Repeat all 4 cases for `updateInternalName`. (g) Add a `// REGRESSION-PIN — Empty-to-null is the documented behaviour. Whitespace is NOT trimmed today. Unknown id silently no-ops at the repository layer; the service layer must guard with switchIfEmpty. A REFACTOR that trims whitespace OR adds repository-layer NotFoundException will flip parts of this test.` comment block.
