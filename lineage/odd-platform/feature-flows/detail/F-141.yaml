chain:
  - hop: 1
    node: ts react-component:Overview
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      Overview.tsx:18-62 — the SPA home shell. Composes 6 distinct widgets;
      orchestrates two top-level fetches (identity via `getIdentityFetchingStatuses`
      selector at line 19; tags via `useGetPopularTags({page:1, size:30})` at
      line 20-23). All other widgets self-load: Domains via `useGetDomains()`
      (Domains.tsx:10), DataEntitiesUsageInfo via `useDataEntitiesUsage()`
      (DataEntitiesUsageInfo.tsx:21), Directory via `useGetDataSourceTypes()`
      (Directory.tsx:10), OwnerAssociation via four Redux selectors
      (OwnerAssociation.tsx:22-26). The skeleton (line 34-42) renders ONLY
      when identity OR tags is loading; the other four widgets show their own
      loading skeleton or nothing.
    unresolved: false
  - hop: 2
    node: ts react-component:OverviewSkeleton
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      OverviewSkeleton.tsx:10-49 — placeholder skeleton matching the
      shape: 12 tag skeletons + 4 info-bar item skeletons + 4 data-list
      skeletons (each with 5 rows). DOES NOT INCLUDE A SKELETON FOR
      MainSearch (the search input — line 35 substitutes a generic
      width-rectangle Skeleton at the top, not a search-bar shape).
      Layout-shift on first load: the skeleton's tag strip / info bar
      / data lists nominally align with TopTagsList / DataEntitiesUsageInfo /
      OwnerEntitiesList — but the Directory + Domains widgets have NO
      skeleton at all (they self-hide while empty per their own
      `data?.length > 0 ? ... : null` guard).
    unresolved: false
  - hop: 3a
    node: ts react-component:Domains (Overview-side)
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      Domains.tsx:8-22 — Overview-side mini Domains card. Self-fetches via
      `useGetDomains()` hook. Renders `null` when the response is empty
      OR loading (line 12: `domains && domains?.length > 0 ? ... : null`).
      No skeleton, no empty-state placeholder, no loading indicator. An
      operator on a fresh deployment with no Domains seeded sees no signal
      that the widget exists.
    unresolved: false
  - hop: 3b
    node: ts react-component:DataEntitiesUsageInfo
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      DataEntitiesUsageInfo.tsx:19-67 — fetches via `useDataEntitiesUsage()`
      (line 21). Renders `null` on error OR missing data (line 56:
      `if (isError || !usageInfo) return null;`). The widget exposes
      6+ click-launchers per class — handleEntityClassClick navigates to
      Search prefilled with `entityClasses` filter (lines 23-32); the
      per-type-cell click prefills BOTH `entityClasses` AND `types`
      filters (lines 34-54). Cross-pillar feed-into F-017 (Search Filter
      Facets) — the home page is a search-launcher constellation.
    unresolved: false
  - hop: 3c
    node: ts react-component:Directory (Overview-side mini)
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      Overview/Directory/Directory.tsx:8-27 — Overview-side mini Directory
      card. Self-fetches via `useGetDataSourceTypes()` (same hook as the
      full-page Directory.tsx — SHARED CACHE singleton per F-023 batch ZA
      sidecar). Renders `null` when empty/loading (line 12: same shape as
      Domains). Each `<DirectoryItem>` is a `<Link to={prefix}>` (resolved
      relative to current route — so on `/` becomes `/postgresql` which
      DOES NOT MATCH the `/directory/:prefix` pattern in DirectoryRoutes.tsx;
      the prefix-only relative link bypasses the directory hierarchy and
      most likely yields a 404 unless the SPA router catches it).
    unresolved: true
    unresolved_reason: |-
      The relative-Link behaviour on `/` needs runtime confirmation:
      `<Link to={prefix}>` evaluates to `/${prefix}` which DOES NOT match
      `${directoryPath()}/{prefix}` = `/directory/${prefix}`. ui_unverified
      until probe walks the click.
  - hop: 3d
    node: ts react-component:OwnerAssociation
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      Overview.tsx:25-27, :53-59 — `isShowOwnerAssociation = Boolean(appInfo?.authType
      && appInfo.authType !== 'DISABLED')` gates the entire OwnerAssociation
      sub-tree behind a string-equality check. Wrapped at line 53-58 with
      `WithPermissionsProvider` requiring `Permission.DIRECT_OWNER_SYNC` — but
      per ZH systemic finding (referenced by F-023), WithPermissionsProvider
      is NON-BLOCKING. The full OwnerAssociation lifecycle is F-142.
    unresolved: false
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Renders the SPA home page composition: search bar + top tags strip +
    domains strip + entity-class usage dashboard + datasource-type
    Directory strip + (conditionally) OwnerAssociation. Six independent
    REST/TanStack-Query/Redux fetches fire on mount; the Overview waits
    for ONLY identity + tags before lifting the skeleton, then exposes
    the page even though the other 4 widgets are still loading their
    own data.
  evidence: |-
    Overview.tsx:18-62 + OverviewSkeleton.tsx:10-49 + the four
    component-side data hooks.
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
    - drift_class: home_page_composition_no_skeleton_alignment_between_six_independent_data_widgets
      description: |-
        Overview.tsx waits only for `isIdentityFetching || isTagsFetching`
        before unmounting the skeleton (line 29-32). The OTHER four
        data-bound widgets (Domains, DataEntitiesUsageInfo, Directory,
        OwnerAssociation) each self-load. Result: on a slow network the
        skeleton vanishes after the FAST tags+identity calls resolve,
        and the operator sees a partial home page — search bar +
        TopTagsList + 4 empty/loading slots that pop in asynchronously.
        Cumulative Layout Shift (Web Vital) is unbounded; first-contentful-
        paint is not aligned with the page's "ready" state. The skeleton's
        promise is broken: it claimed to represent the loading shape but
        only covers 2 of 6 widgets.
      evidence:
        - "odd-platform-ui/src/components/Overview/Overview.tsx:29-42 (skeleton gate predicate)"
        - "odd-platform-ui/src/components/Overview/OverviewSkeleton/OverviewSkeleton.tsx:10-49 (skeleton shape)"
        - "odd-platform-ui/src/components/Overview/Domains/Domains.tsx:10 (self-fetch)"
        - "odd-platform-ui/src/components/Overview/DataEntitiesUsageInfo/DataEntitiesUsageInfo.tsx:21 (self-fetch)"
        - "odd-platform-ui/src/components/Overview/Directory/Directory.tsx:10 (self-fetch)"
      severity: LOW
      ui_unverified: false
    - drift_class: skeleton_shape_does_not_match_rendered_shape_search_bar_main_search_missing_from_skeleton
      description: |-
        OverviewSkeleton.tsx:35 renders a generic
        `Skeleton width={width} height='74px' sx={{ maxWidth: '644px' }}`
        as the top hero placeholder. The actual Overview renders
        `<MainSearch mainSearch />` (Overview.tsx:46-48) — a search input
        box with an icon affordance and (per shared/MainSearch) a typeahead
        dropdown. Layout-shift between skeleton and actual render is the
        signature drift: operator sees a grey rectangle, then a search
        box appears with different padding, height, and focus affordance.
      evidence:
        - "odd-platform-ui/src/components/Overview/OverviewSkeleton/OverviewSkeleton.tsx:35"
        - "odd-platform-ui/src/components/Overview/Overview.tsx:46-48"
      severity: LOW
      ui_unverified: false
    - drift_class: owner_association_gate_string_equality_disabled_no_normalisation
      description: |-
        Overview.tsx:25-27 — `isShowOwnerAssociation = Boolean(appInfo?.authType &&
        appInfo.authType !== 'DISABLED')`. Same string-equality predicate
        flagged in F-003 batch ZA Overview sidecar bugs_limitations_corner_cases[0]
        (4 surprise scenarios: empty / typo / lowercase / whitespace).
        Cross-link to F-142 (OwnerAssociation lifecycle) where this gate is
        the entry-point. The drift is anchored on F-003 + F-001 with respect
        to Popular column visibility; F-141 cross-references it as the
        composition-layer entry point and F-142 owns the lifecycle drift
        downstream.
      evidence:
        - "odd-platform-ui/src/components/Overview/Overview.tsx:25-27"
      severity: MEDIUM
      ui_unverified: false
    - drift_class: domains_directory_widgets_silently_hide_when_empty_no_empty_state_signal
      description: |-
        Domains.tsx:12 + Overview/Directory/Directory.tsx:12 both render
        `null` when the data is empty (`data?.length > 0 ? ... : null`).
        An operator on a fresh deployment with no Domains seeded and no
        datasources registered sees a home page WITHOUT these widgets at
        all — no "add your first Domain" call-to-action, no empty-state
        affordance, no link to Management to set them up. The widgets
        silently disappear, indistinguishable from "this build doesn't
        ship Domains" from the operator's perspective. Onboarding gap:
        a fresh admin cannot discover from the home page that Domains
        / Directory exist as platform features.
      evidence:
        - "odd-platform-ui/src/components/Overview/Domains/Domains.tsx:12-22"
        - "odd-platform-ui/src/components/Overview/Directory/Directory.tsx:12-27"
      severity: LOW
      ui_unverified: false
    - drift_class: no_route_level_permission_no_authentication_redirect_at_component_layer
      description: |-
        Overview.tsx has no `Permission` check at the component layer (only
        OwnerAssociation is wrapped). Under `auth.type=DISABLED` the entire
        home page renders anonymously. Per F-023 batch ZI evidence
        (App.tsx:72 routing pattern) — bare frontend routes are the
        established pattern; the route-level expectation is that the
        backend rejects unauthenticated calls. Under DISABLED the backend
        does NOT reject, so anonymous callers see the full home page
        composition + every widget's data (top tags, domains, datasource
        types, entity-class usage counts) — extending the
        REFACTOR-185 family from per-feature surfaces to the platform
        first-impression surface.
      evidence:
        - "odd-platform-ui/src/components/Overview/Overview.tsx:18-62 (no Permission wrapper at the component)"
        - "F-023 hop-0 evidence — DirectoryRoutes mounted BARE at App.tsx:72"
      severity: LOW-MEDIUM
      ui_unverified: false
    - drift_class: domains_widget_renders_under_full_owner_association_subtree_visually_competes_with_recommended_panel
      description: |-
        The composition order at Overview.tsx:46-59 is:
        MainSearch → TopTagsList → Domains → DataEntitiesUsageInfo →
        Directory → OwnerAssociation. The OwnerAssociation subtree
        (when shown) renders OwnerEntitiesList with FOUR columns
        ("My Objects" / "Upstream" / "Downstream" / "Popular"). The
        FIRST FOUR widgets each have their own H1 / typography header
        and section spacing. Result: on a populated deployment the home
        page is a 5-band vertical scroll (search bar + tag chips +
        4-column entity grid + a 4-column class-usage card + a list of
        ODDRN-prefix cards + a 4-column Recommended panel). NO unified
        IA — the operator does not get a single signal "this is the
        catalog overview"; they get six discrete visual surfaces stacked.
        Cross-link to F-001 / F-003 — the Recommended panel is the
        operator's anchor for "my work today"; competing widgets above
        it dilute discoverability.
      evidence:
        - "odd-platform-ui/src/components/Overview/Overview.tsx:46-59"
        - "F-001 + F-003 + F-064 cross-links — Recommended panel anchors My-objects/Popular/Upstream/Downstream"
      severity: LOW
      ui_unverified: true
      ui_unverified_reason: |-
        Visual-IA judgement; requires UX walkthrough at populated state
        to confirm operator's actual discoverability path.
