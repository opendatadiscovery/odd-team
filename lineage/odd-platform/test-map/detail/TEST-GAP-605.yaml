behaviour: |-
  **Cognito requires the `logout_uri` parameter to be in the App Client's "Allowed sign-out URLs" allowlist — failure mode is a Cognito-side error page, NOT a 302 back to ODD.** Per AWS Cognito docs: 'if the value of `logout_uri` is one of the Allowed sign-out URLs for your app client, Amazon Cognito redirects users to that URL'. Otherwise the user sees a Cognito error page after logout. This handler dynamically derives the `logout_uri` from `UriUtils.getBaseUri(requestUri)` (line 43) — root URL only, path/query stripped. Operators who deploy ODD behind hostname A but the user accesses via hostname B (load balancer / DNS alias / multi-hostname proxy) get `logout_uri=https://B/`. If B is NOT in the App Client's Allowed sign-out URLs, the Cognito-side check fails. The ODD docs are silent on this dependency on operator-side AWS Console configuration; the handler dynamically derives the URI from the incoming request, making the coupling implicit. Edge case: a user logging out from `https://odd/dashboard?filter=foo` gets `logout_uri=https://odd/` — only the root URL is passed (the path/query is stripped by UriUtils.getBaseUri).
