# Owner-Association History tab — product-owner reflection

## product_owner_narrative

The **Owner-Association History tab** is the audit surface of ODD's user-to-owner binding
workflow. An operator who needs to answer "who associated Alice with the `data-platform`
owner, and who approved it, and when?" opens Management → Associations → History and reads a
reverse-chronological, read-only list of every *resolved* association event — every request
that was approved or declined, every admin direct-bind, every unbind. It is the human-readable
projection of the `owner_association_request_activity` table — a dedicated, typed audit table
that exists *only* for this workflow (five event types: REQUEST_CREATED, REQUEST_APPROVED,
REQUEST_DECLINED, REQUEST_MANUALLY_APPROVED, REQUEST_MANUALLY_DECLINED), distinct from the
platform's 27-value global ActivityEventType enum (per
`OwnerAssociationRequestController` sidecar implicit_adrs[0]; OwnerAssociationRequestActivityType.java:3-8).

A user interacts with it by navigating to the History sub-tab (route `/management/associations/history`)
and optionally typing a free-text term into the page's single search box; the tab issues
`GET /api/owner_association_request/activity?query=<text>&status=RESOLVED&size=30` and renders
seven columns per row: username, ownerName, role, provider, resolvedBy, status, resolvedAt
(per F-174 chain hop 2-3 evidence; ResolvedAssociationRequest.tsx:30-69). There are no action
buttons — this surface is purely a forensic read. The `RESOLVED` status filter resolves at the
repository layer to `OWNER_ASSOCIATION_REQUEST_ACTIVITY.STATUS.ne(PENDING)` — i.e. "show every
non-pending entry" — which means it surfaces APPROVED *and* DECLINED entries together, including
the manual-approval and manual-decline entries (ReactiveOwnerAssociationRequestActivityRepositoryImpl.java:128-138,
verified this session).

The working part operators most need to trust is *completeness*: does the History tab show
**every** way a user-owner binding can be created or destroyed? The platform offers four such
write-paths — (A) user self-request then admin-approve, (B) auto-approve under DIRECT_OWNER_SYNC,
(C) admin direct-bind via "+ Create association", and (D) admin unbind via the Active-tab Remove
button. F-174 was seeded with the suspicion that paths C and D *bypass* this audit table (because
they call a different hook, `useCreateUserOwnerMapping` / `useRemoveUserOwnerMapping`, against
`POST/DELETE /api/owners/mapping`). Tracing the actual service implementation overturns that
suspicion: `createUserOwnerMapping` routes through `createManualAssociationRequest`
(OwnerAssociationRequestServiceImpl.java:109-114, 131-148), which DOES create an
`owner_association_request` row stamped APPROVED and DOES emit a REQUEST_MANUALLY_APPROVED
activity entry (line 209-210, verified this session). The unbind path likewise emits
REQUEST_MANUALLY_DECLINED — but only for request rows currently in STATUS=APPROVED
(ReactiveOwnerAssociationRequestRepositoryImpl.java:164-170). The completeness story is therefore
mostly *correct* with one precise gap, captured below.

This feature integrates tightly with the Security & Access-Control pillar (P-09): it is one of
the seven Management read endpoints enumerated by F-074's read-collaborative posture, and it is
the **positive half** of the platform's bifurcated audit story (per concept
`audit-log-presence-asymmetry-2-tier-audit-story`; PLT-062) — the OwnerAssociationRequest
workflow has forensic recording, while the parallel RBAC mutation paths (role/policy/owner-rename)
have none. The `resolvedBy` column joins to `USER_OWNER_MAPPING` for display-name resolution,
inheriting the provider-null cross-mode bleed class documented for the global activity feed
(PLT-065 / ReactiveUserOwnerMappingRepositoryImpl sidecar doc_drift_findings).

In a demo, the product owner would highlight: the History tab has **no date-range filter and no
per-actor filter** — an operator investigating an audit question across thousands of resolved
entries must scroll or remember the exact username/ownerName to type into the single search box;
and the live documentation (WebFetched 2026-06-03, status 200) now describes the History tab and
its four write-path coverage *accurately* — a notable doc-vs-code agreement — except it makes one
blanket claim ("a removal appears as a Declined row") that holds only when a matching APPROVED
request row exists.

