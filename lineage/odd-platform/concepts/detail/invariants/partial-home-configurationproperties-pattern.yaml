name: Partial-home @ConfigurationProperties pattern
canonical_in_docs: false
canonical_candidate: true
description: |-
  Cross-cutting refactoring-hazard invariant: ODD's `@ConfigurationProperties`
  POJOs intermittently bind only a SUBSET of their declared prefix's keys;
  the remaining keys are scattered as `@Value`-injected reads across multiple
  consumer files. A maintainer reading the Properties class to learn the
  config-prefix sees a partial picture.

  2-sidecar triangulated in batch 2026-05-12D:
    (a) DataCollaborationProperties binds 3 of 7 `datacollaboration.*` keys;
        the other 4 (`enabled`, `slack-oauth-token`, `message-partition-period`)
        are `@Value`-scattered across DataCollaborationConfiguration.java:21
        + FeatureResolverImpl.java:17 + DataCollaborationFeatureCondition.java:18-22
        + MessageTablePartitionManager.java:19.
    (b) EmailSenderProperties binds the SMTP transport surface (sender /
        password / host / port / protocol / smtp.auth / smtp.starttls) but
        NOT the recipient list `notifications.receivers.email.notification.emails`
        (consumed via raw `@Value` in `NotificationConfiguration.java:104`).

  Refactoring hazard:
    (i) a future maintainer searching the codebase via 'find usages of
        `datacollaboration.message-partition-period`' would NOT find
        DataCollaborationProperties;
    (ii) tooling that walks `@ConfigurationProperties` to generate Spring
         Boot metadata captures only the bound subset, leaving the
         @Value-read keys without IDE auto-completion;
    (iii) the Properties class's `@PostConstruct` validator cannot enforce
          invariants over keys it does not bind.

  Recommended cross-cutting remediation: complete the binding — every
  `@Value` reading a key in a prefix that has a `@ConfigurationProperties`
  POJO should be replaced by adding the field to that POJO. Bonus: this
  also enables central validation.

  ## STRENGTHENED — batch ZK (2026-05-26) — third instance: AdditionalLinkProperties / `odd.*` namespace

  Batch ZK adds AdditionalLinkProperties as the THIRD instance of the
  partial-home pattern. `AdditionalLinkProperties` declares
  `@ConfigurationProperties("odd")` — claiming the entire `odd.*` prefix
  — but binds only the `links` sub-field via its record-of-records shape.
  The other `odd.*` keys (FOUR known) are `@Value`-scattered across
  multiple consumer files:

    - `odd.tenant-id` — consumed via @Value in
      ExternalMetricReader.java:53 (the Prometheus tenant label) and
      CounterTimeSeriesExtractor.java:20 (sibling)
    - `odd.platform-base-url` — consumed via @Value in
      SlackMessageGeneratorConfiguration.java:15 (the absolute URL builder
      for Slack alert message links)
    - `odd.data-entity-stale-period` — consumed via @Value in
      DataEntityStaleDetector.java:10 (the freshness-detection threshold)
    - `odd.activity.partition-period` — consumed via @Value in
      ActivityTablePartitionManager.java:11 (the activity-feed partition
      width knob)

  ELEVATED REFACTORING-HAZARD CLASS — LATENT FOOT-GUN:

  AdditionalLinkProperties is the FIRST instance of partial-home where
  the FRAGILITY is concrete: the `@ConfigurationProperties("odd")` annotation
  does NOT carry `(ignoreUnknownFields = false)` — currently. If a future
  hardening PR added strict-mode binding (a common Spring Boot hardening
  posture — REJECT operator typos at boot), the application would FAIL
  TO BOOT. The binder would see `tenant-id`, `platform-base-url`,
  `data-entity-stale-period`, and `activity.partition-period` as UNKNOWN
  sibling keys under the `odd` prefix bound by AdditionalLinkProperties.

  Mitigations on the table:
    (a) Complete the binding — fold the four scattered @Value reads into
        AdditionalLinkProperties.
    (b) Move `links` to its own `odd.links.*` sub-prefix —
        `@ConfigurationProperties("odd.links")` — so AdditionalLinkProperties
        no longer claims the parent namespace.
    (c) Add `(ignoreUnknownFields = true)` explicitly to document the
        intent and lock the current behaviour (rather than relying on
        Spring's default).

  Triangulation count rises from 2 to 3.
