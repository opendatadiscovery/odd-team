behaviour: |-
  **MEDIUM — `GET /api/datasources?query=` applies a name-PREFIX match to select page rows
  but a name-SUBSTRING match to compute the total on an empty page — a `query` that matches
  a data source by substring-but-not-prefix returns an EMPTY `items[]` labelled with a
  non-zero `page_info.total` ("0 of 1"). And `size` has no upper bound. Neither is tested.**
  Method-level primary source from the batch-ZB `getDataSourceList` controller-method
  sidecar (this sidecar REFINES the class-level REFACTOR-425 framing):

  - **The query divergence (REFACTOR-425, refined)**: the PAGE branch uses
    `ReactiveDataSourceRepositoryImpl.queryCondition` (line 151-160) →
    `DATA_SOURCE.NAME.startsWithIgnoreCase(query)` — a name-PREFIX match. The empty-page
    COUNT fallback uses `fetchCount(query)` →
    `ReactiveAbstractCRUDRepository.listCondition` (line 240-249) →
    `nameField.containsIgnoreCase(query)` — a name-SUBSTRING match. The
    `JooqQueryHelper.pageifyResult` empty-records branch (lines 95-101) is the ONLY place
    the contains-count is consulted. **The refinement vs the class sidecar**: when the page
    is NON-empty the window-function `count().over()` uses the SAME `startsWith` predicate,
    so populated pages have a CONSISTENT count — the defect surfaces ONLY on the empty-page
    branch as a phantom `total` with no rows ("0 of 1"). Probe P-036 pins this refined
    shape.
  - **Unbounded size**: the OpenAPI `SizeParam` declares NO `maximum` (components.yaml:4222-4229);
    `size` flows unclamped into SQL `LIMIT`. `size=Integer.MAX_VALUE` emits `LIMIT
    2147483647` — the whole catalog plus 2 LEFT JOINs materialised into one in-memory list.
    `size=0` / negative `size` / `page=0` reach SQL as `LIMIT 0` / negative `LIMIT` /
    negative `OFFSET` — the failure mode is not statically determinable.

  **Why MEDIUM**: the query divergence is an operator-confusing wrong-UX (a search bar that
  says "1 result" then shows none) and the unbounded size is a low-probability
  unbounded-response surface (typical catalogs are small). Neither is a security or
  data-loss defect. But both are operator-visible, both are undocumented (the management
  doc page mentions no search behaviour and no size limit), and the endpoint has ZERO
  HTTP-tier coverage (Glob-verified — no `DataSourceControllerTest`). The only related
  repository-tier test, `DataSourceRepositoryImplTest.listDtoNameQueryTest`, exercises a
  `query` that DOES match by prefix — it does NOT exercise the substring-not-prefix
  empty-page divergence.

  **Test gap shape**: a `@SpringBootTest` / `WebTestClient` test that: (1) registers a data
  source named `my-snowflake-dev`; (2) `GET /api/datasources?query=snow` (substring, not
  prefix) → asserts `items` is EMPTY but `page_info.total` is non-zero (the "0 of 1"
  phantom — PIN the divergence per P-036); (3) `GET /api/datasources?query=my-snow`
  (prefix) → asserts `items` has 1 row and `page_info.total` is 1 (the consistent case);
  (4) boundary cases — `size=Integer.MAX_VALUE` accepted (LIMIT 2147483647), `size=0`,
  `size=-1`, `page=0` — assert the observed response shape (PIN the current behaviour per
  P-037). When REFACTOR-425 is fixed (one predicate for page AND count), test #2 inverts.
