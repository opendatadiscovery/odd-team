behaviour: |-
  **MEDIUM — Relationships UI route mount has NO `WithPermissionsProvider`
  wrapper at all** at `components/DataModelling/DataModellingRoutes.tsx:40`.
  The bare declaration `<Route path='relationships' element={<Relationships />} />`
  contrasts the two siblings at lines 19-25 (Query Examples LIST wrapped
  on `QUERY_EXAMPLE_CREATE`) and 31-37 (Query Examples DETAILS wrapped on
  `QUERY_EXAMPLE_UPDATE + QUERY_EXAMPLE_DELETE`). Relationships is the
  ONLY inner route of the Data Modelling pillar that is **NOT** wrapped
  in a permission context.

  This is parallel to TEST-GAP-996 (the `/management/integrations*`
  sub-route — every OTHER Management sub-tab has a wrapper; integrations
  is the lone exception). The Relationships case is the equivalent
  exception in Data Modelling.

  **The UI-layer absence + the backend chain combine** (per TEST-GAP-952):
  - Route (this gap): bare `<Route>`, no wrapper.
  - Component layer (`Relationships.tsx:16-84`): reads URL state and
    dispatches API calls; no permission checks.
  - Backend `RelationshipController.java`: no @PreAuthorize (per
    TEST-GAP-952).
  - `SecurityConstants.SECURITY_RULES` table at lines 95-355: no entry
    for `/api/relationships/**` (per TEST-GAP-952).
  - `RelationshipsServiceImpl.java:30-49`: no permission check (per
    TEST-GAP-952).
  - `ReactiveDataEntityRelationshipRepositoryImpl.java:66-75`: no
    owner JOIN, no permission filter (per TEST-GAP-952).

  The chain is open end-to-end for every authenticated caller under
  LOGIN_FORM/OAUTH2/LDAP, and reachable unauthenticated under
  `auth.type=DISABLED`.

  **Even if a wrapper WERE added** (TEST-GAP-994 cross-cutting),
  `WithPermissionsProvider.tsx:12-49` returns children unconditionally —
  the wrapper seeds `PermissionContext` for descendants to consult, NOT
  a render gate. The Relationships page would render either way; the
  wrapper-added refactor would change ONLY whether descendant
  `<WithPermissions>` calls receive a populated context.

  **Why MEDIUM not HIGH/CRITICAL** (escalated up from LOW in the sidecar):
  - The intent IS the read-collaborative posture (per `implicit_adrs.[0]`
    — "Relationships are platform-wide metadata that every authenticated
    user can read; only the write paths are gated").
  - But the doc at `https://docs.opendatadiscovery.org/features/data-modelling/relationships`
    (WebFetched 2026-05-26, status 200) is SILENT on visibility scoping.
    Neither the pillar page nor the per-feature page mentions who can
    VIEW relationships.
  - A future operator deploying ODD with RBAC expectations from the
    `enable-security/authorization` doc has no signal that Relationships
    are exempt.
  - **Cross-pillar leverage** (P-02 × P-09): a regression that
    tightened the controller to `@PreAuthorize` would break the read-
    collaborative posture; a regression that loosened the doc to claim
    "Relationships ARE gated" would mislead operators. No test pins the
    deliberate openness.

  P-167 Block A (the relationships sidecar's emitted probe) pins the
  runtime observation that a reader-only user renders the full page +
  full row count.
