- id: H-003
  hypothesis: "When a user looks at the Linked Terms count badge, it equals the true number of terms linked to the snippet (not merely the number that happened to be fetched)."
  derivation: "Response shape + cross-pillar (the badge is a promise of completeness) + the feature-flow's own counting-asymmetry facet — the entities badge uses pageInfo.total but the terms badge uses items.length."
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |-
      The Linked Terms badge is `linkedTerms.items.length` (QueryExampleDetailsContainer.tsx:70 passes
      linkedTermsHint = linkedTerms.items.length per the feature-flow facet) — the COUNT OF FETCHED ITEMS,
      NOT a pageInfo.total. This diverges from the Linked Entities badge, which uses pageInfo.total. If
      the `LinkedTermList` is returned complete (un-paginated) in the details payload — which is what the
      single-fetch getQueryExampleDetails appears to do — then items.length equals the true total and the
      badge is correct. BUT if LinkedTermList ever carries a pageInfo.total that exceeds the items array
      (server-side cap, or a future paginated details read), the terms badge would silently UNDERSTATE the
      true count while the entities badge (pageInfo.total) would stay correct. The feature-flow flags this
      facet `ui_unverified: true` precisely because the LinkedTermList backend schema (does it carry
      pageInfo, and is the details read ever capped?) was not read. Verdict is partial: correct today
      under the un-paginated assumption, latently wrong under the asymmetry.
    evidence:
      - sidecar: "(feature-flow primary-source) F-132 observed_vs_expected facet[1]"
        section: "observed_vs_expected.facets[1] (the counting-asymmetry facet, ui_unverified: true)"
        cite: "QueryExampleDetailsContainer.tsx:69-70 (pageInfo.total vs items.length)"
        note: "entities=pageInfo.total, terms=items.length — divergent counting treatment"
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController
        section: concepts.QueryExampleDetails (linkedTerms = LinkedTermList)
        cite: "QueryExampleMapper.java:102-113"
        note: "details bundles linkedTerms as LinkedTermList; pageInfo presence/cap not read in this slice"
    operator_visible_failure: |-
      (1) Today, for a snippet linked to a handful of terms, the badge is correct. (2) The latent failure:
      if a snippet is linked to many terms and the details read caps or pages the LinkedTermList, the Linked
      Terms badge shows the FETCHED count (e.g. "20") while the true link count is higher — an operator
      trusts the badge as a completeness signal and under-counts the snippet's term linkages, while the
      sibling Entities badge stays accurate. (3) The inconsistency itself is an operator surprise: two
      adjacent badges on the same page count by two different rules. Same shape as the F-037 sibling
      pagination-aware-counts-vs-item-array-length facet.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: probe-needed
    probe_id: PENDING-F-132-1
