behaviour: |-
  **CRITICAL — `GET /ingestion/entities/{degOddrn}` is unauthenticated in EVERY shipped deployment mode**, including when the operator has enabled `auth.ingestion.filter.enabled=true` believing they have locked down the ingestion surface. The endpoint enumerates the entire member list of any Data Entity Group by ODDRN. Three independent failures compound:

  1. **`@PreAuthorize` absent**: `IngestionController.java:75-79` carries no auth annotation; the OpenAPI-generated `IngestionApi` interface declares no security; `DataEntityGroupServiceImpl.listEntitiesWithinDEG` (lines 92-108) carries no `fetchAssociatedOwner` call, no AuthIdentityProvider field.
  2. **WHITELIST_PATHS exempts `/ingestion/**`**: `SecurityConstants.java:96` puts the entire `/ingestion/**` namespace into the auth-bypass whitelist. Under OAUTH2/LDAP/LOGIN_FORM the SecurityWebFilterChain skips it.
  3. **`IngestionDataEntitiesFilter` path matcher is hard-coded to `POST /ingestion/entities` ONLY**: `IngestionDataEntitiesFilter.java:28` declares `PathPatternParserServerWebExchangeMatcher("/ingestion/entities", HttpMethod.POST)` — exact-literal, method-scoped to POST. The templated `GET /ingestion/entities/{degOddrn}` path does NOT match this matcher even when `auth.ingestion.filter.enabled=true`.

  **Result chain**:
  - Under shipped default (`auth.type=DISABLED`, `auth.ingestion.filter.enabled=false`): any HTTP caller reaching the platform's port enumerates any DEG by ODDRN.
  - Under operator's belief of "I enabled the filter": still anonymously reachable; the filter's matcher silently passes the GET.
  - Under `auth.type=OAUTH2`/`LDAP`/`LOGIN_FORM` with a session cookie or a `Bearer` token: STILL anonymously reachable; `/ingestion/**` whitelist bypasses UI auth.
  - Under `auth.s2s.enabled=true`: STILL anonymously reachable; S2S applies only to `/api/*` paths, not `/ingestion/*`.

  **Blast radius**: a network probe can enumerate the full DEG-to-members mapping. Combined with TEST-GAP-816 (sequential DEG ODDRN enumeration), the attacker collects the entire DEG membership graph in O(N) requests with no audit trail (TEST-GAP-834).

  **Why CRITICAL**: this is the read-side complement to F-008 (the destructive-write surface). F-008's `destruction_under_default_off_auth` drift facet is mirrored here on the READ side — but worse: F-008's filter at least *exists* on POST /ingestion/entities (toggleable via the config flag); this GET has NO toggle that can fail-close it. No live ODD doc warns operators (per sidecar docs_link_semantic — both inferred URLs returned 404 or are silent on this endpoint). LSN-001 attachment-storage-default-data-loss class extended to the DEG-member-enumeration vector.

  **Test gap shape**: WebTestClient integration test for each of the 5 auth-mode permutations × 2 filter-state permutations × 2 token-presence permutations. PINS the current reachability matrix; pairs with REFACTOR-NNN candidate (add a `GET` matcher to `IngestionDataEntitiesFilter` or extend `SecurityConstants.WHITELIST_PATHS` scope correction) and DOC-GAP-NNN (live S2S page must list this endpoint and its unauthenticated reach explicitly).
