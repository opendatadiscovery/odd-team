- id: H-010
  hypothesis: "On a brand-new deployment (entities ingested, no user traffic yet), the Popular strip is either empty or clearly indicates 'no popularity data yet'."
  derivation: "Negative-space / empty-state: a senior PO asks what a fresh install shows; an empty or honest-empty state is the expected, non-misleading behaviour."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      On a fresh deployment the Popular strip silently shows the NEWEST-ingested entities, not "no data."
      With view_count=0 everywhere (the migration default), the primary orderBy is a flat tie and the
      `id DESC` tiebreaker takes over — so the strip ranks most-recently-ingested first and presents them
      under 'Popular' as if they were most-viewed. There is no empty-state, no "no popularity data yet"
      message, and no documentation of this bootstrap behaviour. (Separately, the generic
      EmptyContentPlaceholder text "No information to display" appears only when the page=1 slice is
      genuinely empty, which gives no hint about WHY.)
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: bugs_limitations_corner_cases
        cite: "ReactiveDataEntityRepositoryImpl.java:945-967 + V0_0_10__add_counters.sql"
        note: "view_count=0 default → id DESC tiebreaker → 'Popular' shows newest entities pre-traffic."
      - sidecar: odd-platform__ts__react-component__component__PopularStrip.md
        section: bugs_limitations_corner_cases
        cite: "DataEntityList.tsx:65-67 + EmptyContentPlaceholder.tsx:46"
        note: "Generic 'No information to display' empty-state gives no diagnostic for the bootstrap case."
    operator_visible_failure: |
      (1) A new operator evaluating ODD sees a 'Popular' strip on day one and concludes those entities are
      genuinely most-viewed, when they are merely newest — a misleading first impression. (2) There is no
      signal distinguishing "ranked by real views" from "degenerate id-DESC tiebreak", so the operator
      cannot tell when the ranking becomes meaningful. (3) This is cosmetic-to-medium: it does not break
      anything, but it silently misrepresents the feature's signal during the exact window (onboarding)
      when first impressions matter most.
    severity: LOW
    confidence: HIGH
    use_case_kind: empty/no-match        # the zero-traffic bootstrap state
    coverage: unverified
    test_demand: functional              # test: all view_count=0 → Popular is empty/honest, NOT a newest-first masquerade
