description: |-
  Every data-entity detail page renders a header with the entity's name +
  a sequence of CLASS badges (one per element in `details.entityClasses`)
  and a single TYPE badge (`details.type.name`). The class names are
  enum-driven (DataEntityClassNameEnum); the type name is a freeform
  collector-supplied string (e.g. "MICROSERVICE", "JOB_RUN",
  "GREAT_EXPECTATIONS_RUN").

  Operator-observable promise (inferred from the badge presence + the
  doc's Data Discovery framing): "These badges tell you what KIND of
  thing this entity is — so you know what's relevant to look for on
  this page."

  Operator-observable reality, per primary-source
  DataEntityDetailsHeader.tsx:79-86:

  1. The class badges (`<EntityClassItem entityClassName={...}>` —
     Slice-M's territory; cluster_with) render the enum value verbatim
     as the badge label. There is no tooltip explaining what each class
     means or what surfaces it unlocks (Overview's class-conditional
     stats panel, the conditional Structure tab visibility, the
     conditional Lineage tab routing in DataEntityDetailsTabs.tsx).

  2. The single TYPE badge (`<EntityTypeItem entityTypeName={type.name}>`)
     renders adjacent to the class badges with NO visual distinction
     between the two categories. An operator scanning the row sees a
     row of badges of identical shape and cannot tell which encodes
     "class" (the load-bearing axis) vs "type" (the descriptive sub-
     classification). The two are categorically different (class is
     an enum of seven values that drives composition; type is a
     freeform collector-supplied string that drives nothing in the
     UI conditional logic).

  3. Multi-class entities (e.g. an entity that is BOTH a DEG and a
     QUALITY_TEST) render MULTIPLE class badges. The container is
     `<Grid container alignItems='center' flexWrap='nowrap'>` (line 75)
     — `flexWrap: nowrap` means a 4-class entity overflows the
     horizontal allocation without wrapping. No overflow collapse,
     no "+N more" affordance.

  4. An entity with `entityClasses === undefined` or `[]` renders NO
     class badge at all — silently. Combined with the type badge
     (which IS rendered if `type` is truthy), an unclassified entity
     can render with just a type badge — visually indistinguishable
     from a classified entity whose entityClasses payload happened to
     be lost (cross-link F-176 facet `class_conditional_render_silent_when_class_unknown`).

  5. The header surface is the ONLY place in the platform where class
     identity is rendered prominently. The Overview tab's
     class-conditional panel composition (F-176 — OverviewStats's
     seven-way switch, OverviewMetrics gated on isDataset, DQ panel
     gated on isDataset) is NOT visually linked back to the header
     badges. An operator who sees "TRANSFORMER" in the header has no
     visual hint that THAT badge is the reason the Transformer-stats
     panel exists below; the connection is purely conceptual.
