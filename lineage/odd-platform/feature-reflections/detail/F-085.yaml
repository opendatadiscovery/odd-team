# Identity Probe & DISABLED-Mode Synthetic Admin Fallback — product-owner reflection

## product_owner_narrative

`GET /api/identity/whoami` is the single endpoint the React SPA calls on every page
load to answer one question: *who is the current user, and what may they do?* The SPA
dispatches it from `App.tsx` on mount alongside the feature-flag and class/type probes
(`fetchIdentity()`, App.tsx:48), stores the answer in the Redux `profile` slice, and the
entire UI's permission gating reads off that one stored answer for the rest of the
session (`getGlobalPermissions`, profile.selectors.ts:17-19). It is the platform's
identity heartbeat — every "can this user see the Delete button" decision traces back to
this one call (per profile.selectors.ts:17-20, PermissionProvider.tsx:19-25,
source_read_for_validation).

For a *logged-in* user the answer is computed honestly: `IdentityServiceImpl.whoami()`
resolves the authenticated principal to its catalog Owner, looks up any pending
owner-association request, and computes the user's MANAGEMENT-scoped permissions from
their RBAC policies (IdentityServiceImpl.java:30-51 → ManagementPermissionExtractor.java:32-41,
source_read_for_validation). The response is an `AssociatedOwner` — a wrapper carrying
`{ identity: { username, permissions }, owner, associationRequest }` — not a bare
`Identity` (IdentityController.java:24-33, source_read_for_validation). This wrapper shape
is load-bearing for the trace and is the one place the live doc simplifies the JSON
(see H-009).

The feature's second, security-defining face appears under `auth.type=DISABLED` (the
application.yml default for local/demo deployments). In that mode no
`ServerSecurityContextRepository` is wired (DisabledAuthSecurityConfiguration.java:11-19),
so the authenticated principal `Mono` is empty, the controller's
`.switchIfEmpty(...)` fires, and `whoami` returns a hardcoded synthetic identity:
`username "admin"` with `permissions = Arrays.asList(Permission.values())` — literally
every Permission enum value the platform defines (IdentityController.java:30-33,
source_read_for_validation). Because the SPA trusts this answer verbatim, every
permission-gated control in the UI unlocks for any caller. And because the grant is
`Permission.values()` rather than an explicit list, every Permission added in a future
release enters this anonymous grant automatically, with no code change in the controller —
the dynamic blast radius. The live `disabled-authentication.md` doc page now documents all
of this by name (verified 200 OK, 2026-06-04), having shipped as the DOC-239 companion to
the PLT-072 hardening issue.

The endpoint also doubles, unintentionally, as a reconnaissance surface. `whoami` is NOT
in `WHITELIST_PATHS` and NOT in `SECURITY_RULES` (SecurityConstants.java:95-96 — the rule
list is mutating-method-only), so under LOGIN_FORM/OAUTH2/LDAP it falls through to
`AuthorizationCustomizer`'s catch-all `pathMatchers("/**").authenticated()` rule
(AuthorizationCustomizer.java:29-30). The four resulting response shapes — `200`+admin
(DISABLED), `302`→`/login` (LOGIN_FORM), `401` (OAUTH2/LDAP) — let an anonymous caller
fingerprint the deployment's auth mode in a single unauthenticated GET. The endpoint emits
no log line and no audit row, so the probe is silent.

This feature sits inside Pillar P-09 (Security & Access Control) and is the
controller-tier sibling of F-034 (the `/api/appInfo` auth-mode reporter — together the
two endpoints the SPA hits for runtime-config discovery) and F-011 (Principal-to-Owner
Resolution — which fires only AFTER an authenticated principal exists; the DISABLED branch
here short-circuits before that). A product owner demoing this would highlight: under
DISABLED you ARE admin and see everything (by design, for local use); the moment you flip
to a real auth mode the synthetic admin vanishes, previously-ignored RBAC policies take
effect for the first time, and any operator-named `admin`/`ADMIN` Owner collides with the
synthetic literals (per disabled-authentication.md "Reserved usernames" + "Migrating away"
sections, verified live; cross-link F-011).

