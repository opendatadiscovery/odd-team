behaviour: '`PolicyServiceImpl.update` (line 76) + `.delete` (line 87) reject mutations
  against the seeded `Administrator` name with `BadUserRequestException("Administrator
  policy cannot be updated")` / `"Administrator policy cannot be deleted"`; `.create`
  (lines 62-69) has NO such block. A privileged user can create a SECOND policy with
  `name = "Administrator"` — the DB UNIQUE constraint rejects it because the seeded
  one is live, BUT if the seeded Administrator policy is ever soft-deleted by some
  other path, a custom Administrator policy with arbitrary statements becomes creatable.
  Same shape as Role''s TEST-GAP-220.'
