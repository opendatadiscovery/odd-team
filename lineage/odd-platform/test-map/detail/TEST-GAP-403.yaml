behaviour: 'Cascade-delete check race window on `delete()` (lines 83-95). The check
  (line 89 `isPolicyAttachedToRole`) and the soft-delete (line 93 `policyRepository.delete(id)`)
  are SEPARATE R2DBC calls outside any transaction. Race window: client A reads `isAttached=false`,
  client B `POST /api/roles` adds a `role_to_policy` row referencing the policy, client
  A continues to delete the now-bound policy. Result: SURVIVING role binding to a
  SOFT-DELETED policy — the EXACT orphan-binding permission-leak state batch H identified
  at the repository layer (TEST-GAP-345). The defence at lines 89-92 closes the gap
  in SEQUENTIAL operator flow but NOT in concurrent-mutation. This is the SOLE service-layer
  protection against the security gap; once raced past, the permission-leak persists.'
