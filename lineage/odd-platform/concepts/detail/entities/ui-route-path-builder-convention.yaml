security_aggregate:
  overall: HIGH
  auth_modes_relevant: []
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: N/A
    detail: |-
      The route-path-builder convention itself imposes no
      authorization. Per-route gate posture is governed by separate
      invariants (withpermissionsprovider-context-seed-not-route-gate,
      management-section-half-gated-only-associations,
      ui-route-no-permission-guard-data-quality-vs-lookup-tables-contrast).
  owner_scoping:
    verdict: N/A
    detail: ''
  strengths:
    - |-
      Uniform convention across 11 modules — operator-curious URL
      can be located via a single Grep over routes/.
    - |-
      Type-safety on sub-route slugs (via `as const` + Type union)
      prevents typos at compile time.
  weaknesses:
    - |-
      Convention BREAKS in two places: dataQualityRoutes (no
      BASE_PATH); dataModelling (BASE_PATH exported across files).
      Cosmetic/consistency drift, not behavioural.
    - |-
      Sub-route literal duplication (routes module vs React
      component renderer) is NOT type-enforced. Refactoring a slug
      in the routes module silently breaks the renderer.
    - |-
      No test coverage — typos in BASE_PATH ship silently (per
      the zero-ui-test-coverage-vitest-installed-no-test-files
      invariant).
  cross_file_inconsistencies: []
  contributing_files:
    - odd-platform__ts__routes__route__dataModelling.md
    - odd-platform__ts__routes__route__dataQuality.md
    - odd-platform__ts__routes__route__management.md
    - odd-platform__ts__routes__route__masterData.md
    - odd-platform__ts__routes__route__terms.md
    - odd-platform__ts__routes__route__alerts.md
  evidence: []
performance_aggregate:
  overall: HIGH
  hot_paths:
    - |-
      Path builders are invoked at render time by ToolbarTabs.tsx
      (global toolbar, every navigation), per-pillar tab strips
      (ManagementTabs.tsx invokes managementPath() 9 times per
      Management page render), and App.tsx route mount evaluation.
      Each call is O(1) — a generatePath() call on a template
      with no/few placeholders.
  throughput_shape:
    verdict: N/A
    detail: |-
      Pure functions — not on a request/response path. No batching,
      no async, no I/O.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless and pure — every path builder is referentially
      transparent with no closure over mutable state, no module-
      level mutation, no side effects. Scales horizontally with
      the React render tree at zero cost.
  strengths:
    - |-
      Zero cost — bundle-size cost is a few dozen bytes per module
      after minification. No memory pooling, no DB connection, no
      outbound HTTP.
  weaknesses: []
  cross_file_inconsistencies: []
  contributing_files:
    - odd-platform__ts__routes__route__dataModelling.md
    - odd-platform__ts__routes__route__dataQuality.md
    - odd-platform__ts__routes__route__management.md
    - odd-platform__ts__routes__route__masterData.md
    - odd-platform__ts__routes__route__terms.md
  evidence: []
