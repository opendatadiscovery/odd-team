realism_caveats: |
  Two assertions expect FAIL on the current implementation:
  - page_3_hasNext == false (currently returns true)
  - page_4_hasNext == false (currently returns true)

  If both fail as expected, the probe has CONFIRMED the contract
  bug at DataEntityServiceImpl.java:192. Fix anchor: change
  `new Page<>(dtos, total, true)` to
  `new Page<>(dtos, total, (page * size) < total)`.

  The size=Integer.MAX_VALUE assertion is open-ended — the actual
  behaviour determines whether a max-size cap is needed at the
  OpenAPI parameter spec (currently unconstrained per
  components.yaml:4213-4229).

  The probe does NOT exercise: page=0 (negative offset case),
  size=0 (degenerate case), or my_objects=true (owner-scoped path).
  Those are separable concerns.
