# Query Example Details Tab Navigation — product-owner reflection

## product_owner_narrative

The Query Example Details page is where an analyst lands after clicking a snippet in the Data Modelling catalog (or following a deep link at `/data-modelling/query-examples/:queryExampleId`). It is the *reading* surface for one curated query example — the companion to F-025's catalog + authoring surface and F-131's edit dialog. The page organises everything known about a single snippet into three tabs: **Overview** (the human `definition` and the executable `query` body, both rendered as Markdown), **Linked Entities** (a table of every data entity the snippet is attached to — Name, Namespace, Datasource, Owner, Created, Updated), and **Linked Terms** (a table of every glossary term the snippet is attached to — Name, Namespace) (per the feature-flow chain hops 1-4, `QueryExampleDetailsContainer.tsx:74-94` + the two table components). The audience is the read side of Query Examples: analysts and BI engineers discovering vetted query knowledge, plus the data engineers and stewards who authored it (per the QueryExampleController sidecar `concepts.audiences`).

The interaction is deliberately lightweight. The whole details payload — definition, query, the full linked-entities list (with dimensions), and the full linked-terms list — is fetched ONCE at container mount via `useGetQueryExampleDetails` → `GET /api/queryexample/{id}` → `QueryExampleController.getQueryExampleDetails` (per controller sidecar `operations.getQueryExampleDetails`; amplification_factor STATIC=1 per the feature-flow). Switching tabs is then a zero-network client re-render: the active tab is read from `?tab=overview|linked-entities|linked-terms` (`QueryExampleDetailsContainer.tsx:30-31`), and clicking a tab writes the new value back to the URL via `setSearchParams` (`QueryExampleDetailsTabs.tsx:44-53`). Each tab carries a count-hint badge so the user can see at a glance how many entities and terms are linked before opening the tab (`QueryExampleDetailsTabs.tsx:15-33`).

The working parts a product owner would demo: **URL-shareable tab state** (a colleague can be sent a link straight to the Linked Entities view); **count-hint badges** (the Linked Entities tab shows a count from `linkedEntities.pageInfo.total`, the Linked Terms tab a count from `linkedTerms.items.length` — note the asymmetry, the load-bearing observation of this reflection); **deep navigation out** (clicking a Linked Entities row jumps to that dataset's detail page via `dataEntityDetailsPath`; clicking a Linked Terms row jumps to that term's page via `termDetailsPath` — the two cross-pillar exits, to P-01 and P-06); and **an empty-state placeholder** when a tab has no rows (`EmptyContentPlaceholder` on both tables).

The feature sits squarely between three pillars. It is the *read terminus* of F-025 Query Examples (P-02 Data Modelling) — the snippet it shows is created and edited elsewhere (the authoring modal of F-131, the link CRUD that lives on `DataEntityController` and `TermController` per the controller sidecar `concepts` note). Its Linked Entities tab *feeds* P-01 Data Discovery (a row click is a jump into the dataset catalog) and its Linked Terms tab *feeds* P-06 Data Glossary (a row click is a jump into the term glossary). The reverse directions — viewing query examples ON a dataset page or ON a term page — are sibling features (F-024 / F-155, the latter covered by integration test IT-034). It also inherits the platform-wide read-collaborative posture: `getQueryExampleDetails` has no RBAC gate, so any authenticated user can open any snippet's details (per controller sidecar `security.owner_scoping`).

In an honest demo the product owner would flag the rough edges. The tab state has no runtime validation: a hand-edited or stale `?tab=foo` link lands the user on a page with a header but a BLANK body and NO active tab highlighted (`QueryExampleDetailsContainer.tsx:31,74,80,85` + `QueryExampleDetailsTabs.tsx:38` — `findIndex` returns -1). The two count badges count differently — `pageInfo.total` for entities versus `items.length` for terms — so if the linked-terms list is ever server-paginated, the terms badge silently understates the true count. There is no breadcrumb back to the catalog, so a deep-linked user has only the browser Back button or the left-sidebar tab. The two tables are strictly read-only — to detach a snippet from a dataset the user must navigate to that dataset's page and remove the link from there, a multi-step workflow paper-cut for anyone disconnecting a snippet from several datasets. The Overview tab is the F-004 4th stored-XSS surface (Markdown render with no extra sanitiser). And — the frame this whole reflection is written under — the entire surface has ZERO automated tests: the tab navigation, the URL-state round-trip, the two tables, the empty states, and the count badges are verified only by a human clicking. There is also NO enriched UI sidecar for any of the four components, so this reflection reasons from the feature-flow's primary-source walk plus the backend sidecar, and cannot judge the rendered pixel-level experience (see the first validation_gap).

