    expected: |-
      Either (a) per-child activity emission inside `propagateOwnership` OR
      (b) a single aggregate event on the parent that enumerates the affected
      children (parent + children list as event payload).
    drift_class: deg_propagation_cascade_audit_absent_below_parent
    provenance: STATIC — primary-source in batch K OwnershipServiceImpl sidecar
      implicit_adrs[2] + invariants[6] + OwnershipServiceImpl.java:48, 77, 100 vs 134-148
  - facet: DELETE flow does NOT refresh the search_entrypoint FTS vector
    observed: |-
      `create` (line 69) and `update` (line 116) call
      `searchEntrypointRepository.updateChangedOwnershipVectors(ownershipId)`.
      The `delete` flow (lines 81-96) has NO equivalent call. After a
      successful delete, the FTS index may still surface the old owner-name in
      catalog search results until the search vector is refreshed by some
      other event (e.g. a subsequent create or update on the same data entity).
      A data entity from which Owner X has been removed continues to surface
