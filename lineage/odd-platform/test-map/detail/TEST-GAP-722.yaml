proposed_action: |-
  Add `TermDetails.test.tsx` at `odd-platform-ui/src/components/Terms/TermDetails/`. Three test methods:
  1. `termDetailsMount_overviewRouteDefault_fetchTermDetailsFiresExactlyOncePerPageOpen` — mount `<TermDetails/>` wrapped in `<MemoryRouter initialEntries={['/terms/100/overview']}>`; spy on the backend invocations; assert exactly ONE `GET /api/terms/100` is fired across both the shell's `fetchTermDetails` dispatch AND Overview's `useGetTermByID` hook. **This test will FAIL today (count=2)** and serves as the regression-pin for any future consolidation fix.
  2. `termDetailsMount_overviewRouteDefault_redundantBackendInvocationDocumentsCurrentState` — companion test that PINS the current 2-invocation behaviour (asserts `count==2` in the meantime). When the consolidation fix lands, this test becomes the "remove me" marker.
  3. `termDetails_tabSwitchBetweenOverviewAndLinkedEntities_doesNotRetrigger12JoinFetch` — pin that tab switching does not re-trigger the shell's `fetchTermDetails` (verify the `[termId]` dep array stability across re-renders).

  Pair with a follow-up backlog item proposing the consolidation fix: drop `Overview.tsx:19-21`'s `useGetTermByID` and have Overview selector-read from `state.terms.byId[termId]` populated by the shell's `fetchTermDetails`. When the fix lands, test #1 succeeds, test #2 deletes, test #3 unchanged.

  Cross-pair with a probe (per the LSN-017 measurement-truth principle — `playbooks/dynamic-verification.md`): live-load `/terms/{id}/overview` on a heavily-linked term in a sandboxed instance, capture the backend log, count `GET /api/terms/{id}` invocations per page-open. Probe pins the live truth before and after the consolidation fix.
