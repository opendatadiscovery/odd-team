behaviour: |-
  Connection-pool bypass — `PGConnectionFactory.getConnection()` uses `DriverManager.getConnection` (PGConnectionFactory.java:36). The housekeeping subsystem bypasses HikariCP entirely. Connection-pool exhaustion metrics (HikariCP gauges in JMX) do NOT cover housekeeping connections, and a connection-leak in housekeeping is invisible to pool monitoring. The shared connection is closed by try-with-resources at HousekeepingJobManager.java:32 (closed even on exception via the finally semantic), so the leak risk is bounded — but the architectural smell is that housekeeping connections are off-the-record from the platform's primary connection-pool observability surface. A future regression that broke try-with-resources scoping (e.g. moved connection acquisition outside the try) would leak with no JMX signal.
