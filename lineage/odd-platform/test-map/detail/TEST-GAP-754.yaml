proposed_action: |-
  Add `CollectorTokenPlaintextOnWireTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `registerCollector_responseBodyContainsPlaintextToken40Chars_pinsPlaintextOnTheWire` — POST `/api/collectors` with valid form; capture response body; assert `token.value` is a 40-char alphanumeric string verbatim. Assert NO `Cache-Control: no-store` header.
  2. `regenerateCollectorToken_responseBodyContainsPlaintextToken40Chars_pinsPlaintextOnRotation` — sister test on the rotation surface.
  3. `getCollectorList_responseBodyContainsMaskedTokenStarsThenLast6_pinsListMaskingContract` — assert that `token.value` in the list response is `******{6chars}` format; assert the leading 6+ chars are NOT plaintext.
  4. `updateCollector_responseBodyContainsMaskedToken_pinsUpdateMaskingContract` — PUT `/api/collectors/{id}`; assert masked token in response.
  5. `dbTokenValueEqualsRegisterResponseTokenValue_assertsNoHmacOrDerivedFormBetweenLayers` — register; capture response token; query `TOKEN.value` directly via test fixture; assert identical. PIN the absence of HMAC-on-issue / hashing.

  Pair with REFACTOR-NNN: add `Cache-Control: no-store` + `X-Sensitive-Body: true` headers to register + regenerate-token responses. Long-term: migrate to HMAC-on-issue.

  Cross-pair with DOC-NNN: surface the end-to-end plaintext-token-chain on the Management → Collectors doc page + Permissions doc page — operators MUST know to disable APM body-capture and reverse-proxy logging on the two token paths.
