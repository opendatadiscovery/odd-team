observed_vs_expected:
  facets:
  - facet: co-membership leakage — wider blast than per-entity REFACTOR-203
    observed: |-
      The endpoint has NO @PreAuthorize, NO `SecurityConstants.SECURITY_RULES`
      entry, NO `fetchAssociatedOwner()` call at any layer. Any
      authenticated user enumerating DEG IDs can read the full
      inter-member lineage graph of every DEG in the catalogue,
      including DEGs to which they have no owner relationship and DEGs
      whose members are owned by other teams. The blast radius is
      strictly WIDER than per-entity REFACTOR-203 because: (a) per-entity
      REFACTOR-203 exposes the lineage neighbourhood of a SINGLE root
      entity, while DEG-lineage exposes the inter-member edge graph
      across ALL members of the named DEG; (b) DEGs commonly span owner
      boundaries (a "Finance" DEG may contain datasets owned by Finance
      AND ETL jobs owned by Data Engineering); the inter-member edges
      are the cross-owner lineage. The endpoint is the per-DEG instance
      of the cross-owner enumeration pattern (REFACTOR-203 family —
      generalised across DEG membership). Under DISABLED auth mode the
      endpoint is anonymously reachable.
    expected: |-
      Either: (a) add owner-scoping at the read path — verify the
      caller has at least one ownership relation to the DEG or one of
      its members; OR (b) document the cross-owner posture explicitly
      on the Data Lineage feature page + API-reference. The structural
      precedent (read-collaborative posture across the platform) suggests
      (b) is the platform's chosen direction; the documentation gap is
      the load-bearing fix.
    drift_class: co_membership_leakage
    provenance: |-
      STATIC — primary-source in batch-M getDataEntityGroupsLineage sidecar
      bugs_limitations_corner_cases section + invariants + audiences[2,3]
      + couples-to.AuthorizationCustomizer (no SECURITY_RULES entry)
      verified by Grep. Severity: HIGH (mirrors REFACTOR-203 read-collaborative
      posture extended to DEG-anchored reads — wider blast radius).
      Proposed local docker-compose probe — seed two unrelated owners + a
      DEG containing entities from both + lineage edges across owner
      boundaries + invoke as user A (no relation to DEG or members) +
      assert response contains the cross-owner edge.
  - facet: inner-DEG suppression — undocumented carve-out
    observed: |-
      `LineageServiceImpl.java:71-75` filters out edges whose endpoint
      is itself a DEG AND removes DEG-typed entries from the response
      dictionary. The comment at line 71 reads
      `// Remove this when we will support inner DEGs for DEG lineage`
      — an explicit deferred-feature marker. Live API-reference page
      (WebFetch 2026-05-19 status 200) documents the endpoint verbatim
      but does NOT disclose the inner-DEG suppression. A third-party
      caller against a DEG containing nested DEGs silently observes
      the nested DEGs missing from the response with no contract
      description of why. A future lift of the suppression would
      silently change the response shape from "flat graph of non-DEG
      members" to "recursive graph including DEG nodes" — no test pins
      the current contract.
    expected: |-
      Either: (a) document the inner-DEG suppression on the live
      API-reference page under a "Known limitations" subsection; OR
      (b) add a `@Disabled` regression test pinning the current
      contract; OR (c) lift the suppression (the SQL CTE already
      supports nested-DEG recursion — only the Java filter needs
      removal). Backlog-citation linking the comment to a triaged
      ticket would be the minimal fix.
    drift_class: inner_deg_suppression_undocumented_carve_out
    provenance: |-
      STATIC — primary-source in batch-M getDataEntityGroupsLineage sidecar
      implicit_adrs[0] + bugs_limitations_corner_cases section +
      LineageServiceImpl.java:71-75 (the deliberate filter as
      deferred-feature). Severity: MEDIUM (undocumented contract
      carve-out).
  - facet: 404 conflation — three conditions, one error message
    observed: |-
      `LineageServiceImpl.java:62` raises
      `NotFoundException("Data entity group", dataEntityGroupId)` via
      `.switchIfEmpty(...)` when the member-resolution Flux is empty.
      Three semantically different conditions trigger this single 404:
      (a) the DEG ID does not exist;
      (b) the DEG exists but has zero (non-soft-deleted) members;
      (c) the path parameter is a Data Entity that exists but is NOT
      a DEG (the SQL CTE at ReactiveGroupEntityRelationRepositoryImpl.java:182-184
      selects by `DATA_ENTITY.ID.eq(dataEntityGroupId)` and if the
