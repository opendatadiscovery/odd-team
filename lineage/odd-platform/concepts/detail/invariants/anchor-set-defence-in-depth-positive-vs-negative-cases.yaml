name: Anchor-set defence-in-depth — positive vs negative cases at the service tier
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19I (LineageServiceImpl + DataEntityServiceImpl
  sidecars)** — the platform''s read-collaborative posture (REFACTOR-024/203 family,
  ADR-CANDIDATE-003) is mitigated AT SOME service-layer surfaces by an "anchor-set"
  pattern: the service calls `authIdentityProvider.fetchAssociatedOwner()` upfront,
  resolves the caller''s owner-anchored ODDRN set, and feeds that set as the boundary
  parameter into the same downstream repository method that would otherwise enumerate
  cross-owner. **The pattern is applied INCONSISTENTLY** across the service surface
  — sibling methods on adjacent paths show diametric postures: (a) **POSITIVE CASE**:
  `DataEntityRelationsServiceImpl.getDependentDataEntityOddrns` (DataEntityRelationsServiceImpl.java:25-39)
  DOES call `fetchAssociatedOwner()` (line 26) before passing the resolved owner''s
  entity-oddrn set to `ReactiveLineageRepository.getLineageRelations`. This is how
  `DataEntityController.getMyObjectsWithUpstream/Downstream` (batch G/H) achieves
  owner-scoping even though the SQL layer has no owner column. The anchor IS the
  defence; (b) **NEGATIVE CASE**: `LineageServiceImpl.getLineage` (LineageServiceImpl.java:87-122)
  accepts `dataEntityId` from the controller WITHOUT calling `fetchAssociatedOwner()`
  — confirmed by direct read of LineageServiceImpl.java:19 (no AuthIdentityProvider
  import) + lines 54-57 (no authIdentityProvider field) + the entire method body
  (no fetchAssociatedOwner call). The recursive-CTE walk operates on the caller-supplied
  oddrn with NO owner filter at any layer (the repository itself confirms this —
  ReactiveLineageRepositoryImpl.java:122-176, batch H). This is the **NEGATIVE-CASE
  SIBLING** of the batch-G/batch-H anchor-set pattern: cross-owner enumeration is
  UNMITIGATED for the lineage-canvas read path; (c) **NEGATIVE CASE**: `LineageServiceImpl.getDataEntityGroupLineage`
  (LineageServiceImpl.java:59-85) same shape — DEG ID is the anchor; any DEG visible
  to the caller exposes its full member-graph + reachable edges; no owner check;
  (d) **MOSTLY-NEGATIVE CASE**: `DataEntityServiceImpl` — 10 list-shape / single-entity
  read methods (`getDetails`, `getDimensions` overloads, `getDataEntitiesByDatasourceAndType`,
  `listByTerm`, `listPopular`, `getDataEntityGroupsChildren`, `getDomainsInfo`,
  `getDataEntityUsageInfo`) apply NO anchor-set. ONE counter-example: `listAssociated`
  (line 212-225) DOES fetch the caller''s associated owner. `findByState` (line 181-194)
  takes an OPTIONAL `OwnerPojo` parameter (SearchServiceImpl can pass it). The presence
  of `listAssociated` proves the project knows how to apply the anchor-set defence;
  the omission elsewhere is the structural shape. **The pattern is the PLATFORM''s
  primary defence-in-depth mechanism for the read-collaborative posture, but its
  application is sparse and uneven**. A consistent application across LineageServiceImpl.getLineage
  + DataEntityServiceImpl.getDetails would meaningfully tighten the read posture
  without rewriting the SQL layer. The architectural shape is clear (the positive
  examples exist); the gap is implementation completeness, not design ambiguity.'
