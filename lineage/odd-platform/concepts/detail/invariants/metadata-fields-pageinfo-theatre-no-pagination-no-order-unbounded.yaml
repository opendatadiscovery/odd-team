mitigations_unimplemented:
  - |-
    Direction A (align spec to code): edit components.yaml:2111-2120
    to declare MetadataFieldList = {items: MetadataField[]} WITHOUT
    the embedded PageInfo block. Removes the misleading pagination
    advertisement. Requires SDK regeneration for downstream
    consumers.
  - |-
    Direction B (align code to spec): edit
    MetadataFieldController.getMetadataFieldList signature to
    accept page/size params; pass through to
    ReactiveAbstractCRUDRepository.list(page, size, query). Mapper
    populates PageInfo honestly from Page<T>.total() and hasNext().
    Requires sign-off because the autocomplete UX assumes
    unpaginated access.
  - |-
    Direction C (close the unbounded-return amplification, retain
    spec): add a hard LIMIT (e.g., 1000) at the SQL layer; if
    the catalogue grows past 1000, the autocomplete returns the
    first 1000 and silently truncates. Honest about scale
    limits; lies about pagination still.
  - |-
    Add ORDER BY name to the SELECT (one-line jOOQ change). UX
    improvement: autocomplete results are stable across calls.
    Independent of the pagination fix.
  - |-
    Add a live doc page documenting the Custom Metadata feature
    end-to-end: catalogue semantics, INTERNAL vs EXTERNAL origin,
    auto-create-on-miss, the autocomplete UI, the API surface,
    and (whichever fix direction is chosen) the actual response
    shape.
notes: |-
  NEW MEDIUM-severity invariant captured in batch 2026-05-25-ZF
  from MetadataFieldController class-level primary-source
  evidence at the controller + repository + mapper sites. The
  finding is the THIRD distinct PageInfo-drift shape in the
  codebase; the trio (hasNext-true, params-unbounded, theatre-
  paginated) suggests a CODEBASE-WIDE AUDIT candidate to
  enumerate every endpoint that uses PageInfo and validate its
  pagination contract honesty.

  The CUSTOM METADATA feature is otherwise undocumented on the
  live site — surface as a DOC-NNN candidate as well.

  Cross-cutting connections:
    - Pairs with three sibling pagination-shape invariants (above)
    - Pairs with `metadata-field-asymmetric-uniqueness-by-origin`
      (the partial-unique-index story; same table)
    - Pairs with the (broader) auto-create-on-miss /
      `permission-bypass-via-owner-auto-create-side-door-write-path`
      pattern — the catalogue grows as a side-effect of writes
      and is enumerable by ANY authenticated user (see
      `rbac-read-endpoints-no-securityrule-authenticated-only-fall-through`
      batch ZF strengthening for the read-side unauth context)

  Three DOC-NNN candidates flow from this invariant:
    (a) Add a live doc page documenting the Custom Metadata
        feature end-to-end (catalogue, autocomplete, partition,
        API)
    (b) Document the chosen pagination-fix direction once the
        code/spec lands
    (c) Cross-link the THREE distinct PageInfo-drift shapes on a
        single "PageInfo semantics in ODD's OpenAPI" reference
        page — operators and SDK authors get a single source of
        truth for which endpoints actually paginate
