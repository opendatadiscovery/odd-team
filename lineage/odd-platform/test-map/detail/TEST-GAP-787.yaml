behaviour: |-
  **MEDIUM — R2DBCConfiguration wires `PropertyMapper.alwaysApplyingWhenNonNull()` for ALL TEN `R2dbcProperties.Pool` settings (maxIdleTime / maxLifeTime / maxAcquireTime / maxCreateConnectionTime / initialSize / maxSize / validationQuery / validationDepth / minIdle / maxValidationTime) at lines 41-50 + 75-84 — yet `application.yml` declares ZERO `spring.r2dbc.pool.*` overrides, and the live docs publish NONE of these as operator knobs. The platform's pool ceiling is whatever Spring Boot's framework default ships — typically `maxSize=10`, but not committed to.**

  **Three composing risks**:
  1. **Framework drift**: a future Spring Boot upgrade that changes the default `maxSize` silently changes ODD's deployed pool ceiling. No `application.yml` override pins the value.
  2. **Operator silence**: WebFetched 2026-05-20 status 200 from `/configuration-and-deployment/odd-platform` confirms NONE of the ten pool keys are documented. Operators sizing high-RPS deployments have no published guidance.
  3. **Authorization hot path saturation**: per existing concept catalog (`authorization-hot-path-getcurrentuserroles-per-request-no-cache.yaml:44-45`), R2DBC pool size is the upper bound; the authorization checks saturate the pool under load.

  **Two pools × max-size 10 × N replicas = practical concurrency budget for the ENTIRE platform's DB access.** A 5-replica deployment with default Spring Boot pool sizes can sustain max 100 concurrent DB queries. PG `max_connections` default is 100 — operators are at the edge with NO platform-side telemetry.

  **Test gap shape**:
  1. Boot-time assertion — verify `spring.r2dbc.pool.max-size` is unset in the application context (PINS the framework-default reliance).
  2. Spring Boot version pin — assert the resolved Spring Boot version (via Manifest or BuildInfo) — a future upgrade trips the test and forces re-verification of the framework default.
  3. Optional: bind a deliberate override `spring.r2dbc.pool.max-size=50` via `@TestPropertySource`; verify the pool actually accepts the override via PropertyMapper.

  PINS the current framework-default reliance; documents the gap; drives the operator-facing knob to docs + a tested default at the platform level.
