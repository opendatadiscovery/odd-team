name: FTS Search Vector (Data Entity)
canonical_in_docs: false
canonical_candidate: false
description: Per-data-entity tsvector index column refreshed by reactiveSearchEntrypointRepository.updateDataEntityVectors.
  Includes INTERNAL_DESCRIPTION at weight B (second-tier after names at weight A).
  Updated atomically on every description write inside the @ReactiveTransactional
  boundary.
nodes:
- odd-platform java DataEntityController controller-method:upsertDataEntityInternalDescription
contributing_files:
- odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription.md
evidence:
- upsertDataEntityInternalDescription.md:concepts.invariants[FTS refresh]
- upsertDataEntityInternalDescription.md:implicit_adrs.[4] (FTS weight B is a deliberate
  ranking choice)
axes_present:
- controllers
- openapi_paths
security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: BYPASSES
    detail: FTS search is read-collaborative — every authenticated caller sees results
      spanning all owners
  weaknesses:
  - Unbounded description body → unbounded FTS-index write per description edit
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - FTS rebuild is the FULL entity tsvector (not just description slice) — every description
    edit re-reads ~8 related tables
