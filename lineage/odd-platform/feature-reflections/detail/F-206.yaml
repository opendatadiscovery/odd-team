- id: H-009
  hypothesis: |-
    The per-class colour lets an operator distinguish ANY two different classes at a glance —
    a Group chip looks different from a Relationship chip, a Transformer from a Transformer Run.
  derivation: |-
    The colour layer's entire purpose (vs the text-only type badge) is at-a-glance class
    discrimination. The promise is that distinct classes get distinct colours.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      theme.palette.entityClass (palette.ts:103-113) is NOT a bijection from class to colour.
      Three colours are each shared by two classes:
        - DATA_ENTITY_GROUP = colors.lightGreen5 AND DATA_RELATIONSHIP = colors.lightGreen5
        - DATA_TRANSFORMER  = colors.purple5     AND DATA_TRANSFORMER_RUN  = colors.purple5
        - DATA_QUALITY_TEST = colors.orange5     AND DATA_QUALITY_TEST_RUN = colors.orange5
      So 6 of the 9 classes collapse to 3 colours. A DEG chip and a Relationship chip are the
      SAME colour; only the text ("DEG" vs "REL") distinguishes them — which is exactly the
      at-a-glance affordance the colour layer was supposed to add ON TOP OF the text. For the
      *_RUN pairs the collision is arguably intentional (a run shares its parent's hue), but for
      ENTITY_GROUP vs RELATIONSHIP — two unrelated top-level classes sharing lightGreen5 — there
      is no such rationale in code. This is NOT in PLT-094 (which only notes the TYPE badge is
      uncoloured); it is a distinct defect in the CLASS colour layer the feature is built around.
    evidence:
