notes: |-
  STRENGTHENED batch 2026-05-19K — the codebase-wide audit-candidate
  predicted in this invariant's original 2026-05-12F authorship is NOW
  PRIMARY-SOURCE CONFIRMED at four service-tier sites:
    (1) OwnershipServiceImpl.create — getOrCreate(owner_name) at line 52
        — REFACTOR-199 (cross-batch primary-source confirmation; batch F
        controller-tier + batch K service-tier)
    (2) OwnershipServiceImpl.create — getOrCreate(title_name) at line 53
        — REFACTOR-206 (cross-batch primary-source confirmation; batch F
        controller-tier + batch K service-tier)
    (3) TermServiceImpl.upsertTags — getOrCreateTagsByName at line 257
        — TAG_CREATE bypass (NEW batch K, predicted by 2026-05-12F)
    (4) TermServiceImpl.createTerm/updateTerm — namespaceService.getOrCreate
        at lines 103, 138 — NAMESPACE_CREATE bypass (NEW batch K,
        predicted by 2026-05-12F)
  Codebase-wide audit pattern is now CONFIRMED, not just suspected.

  The invariant's original analysis: pattern is structurally similar to
  the "Authorization is path-pattern wired in SecurityConstants.SECURITY_RULES"
  failure mode (gates assume paths are the only entry points), but the
  specific shape is "the service-layer auto-create-on-missing pattern
  bypasses the controller-layer permission check that was supposed to gate
  that side effect."

  STRENGTHENED architectural finding: the maintainer's OwnershipServiceImpl
  implicit_adrs.[0] confirms this is DELIBERATE for OwnershipService —
  Owner+Title directory auto-creation is the intentional convenience UX
  pattern, not an oversight. The same can be assumed for Title, Tag, and
  Namespace getOrCreate's. The invariant therefore distinguishes between
  TWO sub-classes:
    (a) Deliberate-side-door — the maintainer accepts the auto-create as
        the convenience; docs should NAME the side-door so operators
        understand the actual gate set
    (b) Accidental-side-door — surfaces only when readers expect a single
        gate and miss the side-door; remediation is explicit permission
        check
  All four primary-source instances are class (a) by maintainer intent;
  the invariant's value is documentation/audit-trail, not bug-fix.

  Surface as canonicalisation candidate AND a refactoring-scope item.
  Three DOC-NNN candidates flow from this invariant:
    (a) /authorization/permissions page: name the four side-doors
        (Owner via Ownership; Title via Ownership; Tag via Term;
        Namespace via Term) explicitly.
    (b) /authorization/owners page: clarify that Owner directory
        entries can be created via TWO paths and which permissions
        gate each.
    (c) Add a new /authorization/title-and-tag-vocabularies page (or
        a section on the existing permissions page) explaining that
        Title and Tag vocabularies grow via free-text mutation side-effects
        with no allowlist.
