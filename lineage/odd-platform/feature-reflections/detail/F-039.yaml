    >256KB fail HTTP 500, and the docs imply 20MB works (80x gap).
  dedup_status: net_new
  distinct_from: PLT-020
  distinct_reason: |-
    Not in PLT-020 (security) or PLT-008 (config defaults). DOC-080 documented that GenAIException->HTTP 500 is
    STATED on the timeout + non-timeout paragraphs, but did NOT document the 256KB OUTBOUND codec cause or the
    doc-vs-code 80x size-framing gap. This is an outbound-codec resource-allocation defect + a paired doc gap.
  recommended_log_as: "upstream-issue (code: add .codecs override) + doc-gap (distinguish inbound 20MB vs outbound 256KB)"
  proposed_fix_anchor: |-
    Add .codecs(c -> c.defaultCodecs().maxInMemorySize(...)) to the genAiWebClient builder
    (WebClientConfiguration.java:26-29), AND correct the feature page's size-ceiling framing to distinguish
    inbound request (20MB) from outbound response.

