behaviour: |-
  **The platform has NO `<Route path='*'>` catch-all in App.tsx; the
  AppErrorPage widget is reached ONLY when an async thunk rejects,
  NOT when react-router fails to match a URL. Visiting any URL the
  router doesn't recognise (`/terms` bare, `/master-data` bare,
  any unknown slug) produces a BLANK PAGE under the toolbar with NO
  content, NO error, NO redirect — react-router-DOM v6's NO-MATCH
  default behaviour is to render nothing.**

  Verified at primary source (AppErrorPage.md doc_drift_findings[1]
  + cross-batch ZH/ZI/ZJ findings):
  - App.tsx:59-89 declares specific `<Route path={termsPath()}>`,
    `<Route path={masterDataPath()}>`, etc. — but NONE of these is
    a parent route with index children that match the BARE path.
  - There is NO `<Route path='*'>` catch-all.
  - There is NO global ErrorBoundary (the broader TEST-GAP-1013
    cross-cutting gap — but this gap is narrower and complements it).

  The user-visible UX is:
  (a) `/terms/{id}` (valid id) → TermDetails renders.
  (b) `/terms/{id}` (invalid id, async thunk rejects) →
      AppErrorPage banner shows.
  (c) `/terms` BARE → BLANK PAGE.
  (d) `/random-unknown-slug` → BLANK PAGE.

  Operators report (c) and (d) as "I clicked a stale link and got a
  blank page" — they cannot self-diagnose whether the platform is
  broken, the network is broken, or the URL is malformed.

  No test pins:
  - The current state (BLANK PAGE for cases c and d) as a
    regression-pin.
  - The desired state (an AppErrorPage with status=404,
    statusText="Page Not Found" for cases c and d) as the target.

  The fix is a 5-line addition to App.tsx of a
  `<Route path='*' element={<AppErrorPage showError error={{status:
  404, statusText: 'Page Not Found', url:'', message:''}}/>} />`.
