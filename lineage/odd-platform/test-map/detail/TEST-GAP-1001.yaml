strengthened_evidence: |-
  Batch ZL (2026-05-26): the LookupTables.tsx component sidecar
  (odd-platform__ts__react-component__component__LookupTables.md)
  triangulates the partial-enumeration finding from the
  component-tier perspective. The new sidecar's
  tests_coverage_semantic.uncovered_behaviours.[2] (HIGH security
  test class): 'Visiting /master-data/lookup-tables with zero of
  LOOKUP_TABLE_CREATE/_UPDATE/_DELETE renders the page (counter,
  search, list) but hides the Add-new button — WithPermissionsProvider
  at the route layer is NOT a gate (LSN-018 substitution-class
  finding); the operator-visible consequence is that the page
  renders unconditionally and only the Add-new button is hidden.'
  This confirms two distinct issues compounded at this surface:
  (a) the route's allowedPermissions list enumerates ONLY the 3
  table-tier permissions (the original TEST-GAP-1001 finding); and
  (b) the wrapper does not actually gate render (TEST-GAP-994
  cross-cutting), so even if the list were complete the page would
  render anyway. The two together mean an auditor cannot derive the
  RBAC posture from any single file. P-193 emitted in batch ZL to
  verify the zero-permission render path.
