    drift_class: attachment_link_url_unvalidated_javascript_scheme_storable_xss_class
    provenance: |-
      STATIC — primary-source at DataEntityAttachmentController batch V
      sidecar bugs_limitations_corner_cases[7] + security.known_security_gaps[4]
