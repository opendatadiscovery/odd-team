behaviour: |-
  **HIGH — TermController write endpoints systematically bypass NAMESPACE_CREATE + TAG_CREATE permissions via the platform's getOrCreate side-door pattern.** Primary-source confirmed across both batch-U Term-side sidecars + cross-link to the platform's existing batch-K invariant on the same architectural class:

  **NAMESPACE_CREATE side-door** — two entry points:
  - `TermController.createTerm` → `TermServiceImpl.createTerm` → `namespaceService.getOrCreate(formData.getNamespaceName())` (`TermServiceImpl.java:103`). A caller holding `TERM_CREATE` (the documented gate per Business Glossary docs) can submit a TermFormData with a NEVER-SEEN `namespaceName` and SILENTLY CREATE the namespace.
  - `TermController.updateTerm` → `TermServiceImpl.updateTerm` → `namespaceService.getOrCreate(formData.getNamespaceName())` (`TermServiceImpl.java:138`). Same side-door on update — re-naming a term to a fresh namespace creates that namespace.

  **TAG_CREATE side-door** — one entry point:
  - `TermController.createTermTagsRelations` → `TermServiceImpl.upsertTags` → `tagService.getOrCreateTagsByName(names)` (`TermServiceImpl.java:257`). A caller holding `TERM_TAGS_UPDATE` (the documented gate per Business Glossary docs) can submit a TagsFormData with NEVER-SEEN tag names and SILENTLY CREATE the tags.

  **What the docs claim vs what the code enforces**: the Business Glossary docs (live-fetched 2026-05-20 per the sidecars) declare `TERM_CREATE` gates "Create a new term in the Dictionary" and `TERM_TAGS_UPDATE` gates "Apply or remove tags on a term". Neither line discloses the side-door creation of namespaces or tags. Operators authoring RBAC policies that withhold `NAMESPACE_CREATE` (the dedicated permission for creating namespaces — gated at `POST /api/namespaces` per the Management surface) or `TAG_CREATE` (gated at `POST /api/tags` per the Management surface) and granting only `TERM_CREATE` + `TERM_TAGS_UPDATE` to a "glossary curator" Role expect the curator to be unable to expand the namespace or tag taxonomies. The code, however, allows arbitrary expansion via Term write endpoints.

  **Architectural pattern — cross-pillar reach**: this is a SISTER pattern to the previously-enumerated `getOrCreate` side-doors:
  - REFACTOR-199 (Owner auto-create via `ownerService.getOrCreate` — gateway for `OWNER_CREATE` bypass via OwnerController#createOwner)
  - REFACTOR-222 (TAG_CREATE bypass via `upsertTags` in OwnerController#createOwner — same `getOrCreateTagsByName` call site)
  - REFACTOR-223 (NAMESPACE_CREATE bypass via `getOrCreate` in TermServiceImpl#createTerm — sister site, identified earlier)
  - REFACTOR-486 (TITLE auto-create via `titleService.getOrCreate` — `TitleServiceImpl.getOrCreate` has NO allowlist, no enum, no @Pattern)

  The aggregate finding: **the platform's `getOrCreate*` pattern systematically allows tag/namespace/owner/title creation through ANY endpoint that touches those entities, bypassing the dedicated `*_CREATE` permissions.** This sidecar adds the NAMESPACE_CREATE side-door on createTerm + updateTerm and the TAG_CREATE side-door on createTermTagsRelations to the family, bringing the cumulative cross-pillar count to FOUR getOrCreate bypass sites.

  **Why HIGH not MEDIUM**: while each individual side-door is rated MEDIUM in the sidecars, the CUMULATIVE cross-pillar pattern is elevated to HIGH because: (a) the side-doors are NOT documented anywhere in the operator-facing site (sidecar's doc_drift_findings confirm); (b) operators reasoning about access control via the documented `*_CREATE` permissions are SYSTEMATICALLY DECEIVED about what permissions a Role actually allows; (c) the read-collaborative posture means EVERY authenticated user with any `TERM_*` write permission can pollute the namespace + tag taxonomies indefinitely. The Management UI's Namespace + Tag tabs (intended as the controlled-vocabulary surfaces per P-08) are EFFECTIVELY UNGATED because every other pillar's write endpoints can bypass them.

  **Test gap shape**: regression-pin asserting: (a) `createTerm` with a never-seen `namespaceName` succeeds for a caller holding TERM_CREATE but NOT NAMESPACE_CREATE; (b) `createTermTagsRelations` with never-seen tag names succeeds for a caller holding TERM_TAGS_UPDATE but NOT TAG_CREATE; (c) `updateTerm` with a never-seen `namespaceName` succeeds for a caller holding TERM_UPDATE but NOT NAMESPACE_CREATE. Each test PINS the current (bypass) behaviour — failures land if a future maintainer adds explicit `NAMESPACE_CREATE` / `TAG_CREATE` checks at the service layer.
