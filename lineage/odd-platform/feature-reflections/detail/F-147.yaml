  derivation: "Negative-space: a user comparing candidates naturally opens A, goes Back, opens A again to re-check; a counter feeding a ranking should not treat repeat same-session looks as unbounded new votes."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      There is no per-session dedupe anywhere. Each row click navigates to the Overview tab and mounts
      DataEntityDetails fresh; back-navigation returns to the search list and a second click remounts the
      Overview tab and fires fetchDataEntityDetails again → another +2 view_count. The F-001 chain has no
      idempotency key, no localStorage/session "already viewed" guard, and no TTL window — confirmed across
      the chain (DataEntityDetails.md downstream_side_effects + the F-001 reflection H-006). So opening
      result A, going Back, and opening A again writes +2 × 2 = +4 view_count for two conceptually-identical
      "looked at A" gestures, unbounded per session. The same applies whether the user re-clicks the same
      row or re-runs the search and clicks the matching row again.
    evidence:
      - sidecar: "(source read — ResultItem.tsx, hop-1 sidecar unresolved)"
        section: render
        cite: "ResultItem.tsx:72-76"
        note: "Row click has no client-side guard against repeat opens. source_read_for_validation: true."
      - sidecar: odd-platform__ts__react-component__component__DataEntityDetails.md
        section: downstream_side_effects
        cite: "DataEntityDetails.tsx:56-76 (no AbortController/cleanup) + F-001 reflection H-006"
        note: "Remount re-fires the read-as-write; no idempotency/dedupe at any layer of the F-001 chain."
    operator_visible_failure: |
      (1) Comparison shopping among search results (the normal way to evaluate several candidates)
      multiplies the inflation in H-002: every Back-and-reopen is another +2 into Popular. (2) The view_count
      becomes a count of "navigations", not "distinct human reads", so two users genuinely interested look
      identical to one user bouncing in and out. (3) There is no operator lever to dedupe; the fix has to be
      a per-(session,entity) guard in the F-001 chain (PLT-104) and the search-side trigger removal (PLT-091).
    severity: MEDIUM
    confidence: HIGH
    source_read_for_validation: true
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    routes_to_finding: bug-candidate

