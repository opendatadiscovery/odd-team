notes: 'Operation vocabulary captured for future DOC-NNN follow-ups on the

  search surface. The live `/features/data-discovery/search` page

  documents seven UI facets but is silent on WHO can search,

  query-syntax semantics, the server-side session mechanism, the

  `myObjectsTotalCount` unconditional aggregation cost, and the

  30-day persistent query-text retention. Sibling

  `/api/terms/search`, `/api/queryexample/search`, and

  `/api/referencedata/search` replicate the same session-UUID

  pattern.

