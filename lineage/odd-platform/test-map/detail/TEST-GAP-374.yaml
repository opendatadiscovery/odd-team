behaviour: '`@ActivityLog` AOP `@Profile("!integration-test")` test-coverage trap —
  `ActivityAspect.java:24` guards the aspect away from integration-test profiles. Any
  end-to-end integration test asserting alert-state-changed activity rows would silently
  see zero rows for the `updateStatus` path. The manual emission paths (`applyAlertActions`,
  `handleExternalAlerts`) still emit, but `updateStatus`''s does NOT. A regression that
  breaks `updateStatus`''s activity emission would land green in the integration-test
  suite. Only unit tests with a mocked/explicitly-wired `ActivityAspect` can exercise
  this surface. This is a SYSTEMIC test-infrastructure gap — surface the pattern, not
  just one method.'
