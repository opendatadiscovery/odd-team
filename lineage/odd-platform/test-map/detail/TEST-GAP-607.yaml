proposed_action: |-
  Integration test simulating multi-pod deployment. (a) Boot TWO application contexts (or two app instances under test). (b) Authenticate via Azure OAuth on context A; capture the session-id cookie. (c) Issue an authenticated request to context A — succeeds. (d) Issue an authenticated request to context B with the SAME session-id — FAILS (the session doesn't exist on context B). (e) Invoke logout on context A — only context A's session is cleared. (f) The orphan-on-non-logout-pod behaviour is the architectural finding. Pin until shared-session-store landed.
