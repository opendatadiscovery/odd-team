behaviour: |-
  `ingestData` upsert path — the bulk INSERT … ON CONFLICT … DO UPDATE upsert is not exercised in tests. The repository test only covers `bulkCreate` (no onConflict clause). This is the **MOST CONSEQUENTIAL method** (every Collector-pushed tag flows here) and is the **LEAST COVERED**. A regression in `Indexes.TAG_NAME_UNIQUE.getFields()` resolution, in the `WHERE TAG.DELETED_AT.isNull()` partial-index predicate matching, or in the `DSL.excluded(TAG.NAME)` RETURNING-trigger pattern would silently break ingestion-side tag relations. Cross-pillar: P-01 (Discovery — tag directory) and P-10 (Integrations — ingestion path).
