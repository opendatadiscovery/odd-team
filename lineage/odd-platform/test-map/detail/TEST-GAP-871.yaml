proposed_action: |-
  Add `ActivityCrossOwnerVisibilityAuthorizationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` using `@WebFluxTest(DataEntityController.class)` + `WebTestClient` + Spring Security test fixtures. The HEADLINE test method:

  1. **`getDataEntityActivity_authenticatedCallerWithNoEntityPermission_returns200WithFullAuditPayload`** (HEADLINE):
     - Arrange: seed `data_entity` owned by Owner A; seed activity rows with description-edit events (oldState contains "BEFORE: PII X"; newState contains "AFTER: PII Y"). Authenticate as Bob — a real user with NO ownership association with Owner A, no role, no policy granting access to this entity.
     - Act: `webTestClient.get().uri("/api/dataentities/{id}/activity?begin_date=...&end_date=...", entityId).exchange()`
     - Assert: `expectStatus().isOk()`; response body contains BOTH activity rows; the `old_state` and `new_state` JSON fields are NOT redacted; PIN the cross-owner visibility default.
     - Comment: this is the SECURITY POSTURE test — locking in the current behaviour so a future refactor that adds an authorization gate is a coordinated decision (the test would FAIL until updated to expect 403 — making the maintainer surface the change).

  2. **`getDataEntityActivity_authenticatedCallerWithOwnerLink_returns200WithFullAuditPayload`** (CONTROL):
     - Same fixture; Bob is associated with Owner A via user_owner_mapping.
     - Assert: same 200 with full payload (the owner-linked case is the expected positive).

  3. **`getDataEntityActivity_anonymousCallerUnderDisabledAuth_returns200WithFullAuditPayload`**:
     - Set `auth.type=DISABLED`; no authentication header.
     - Assert: same 200 with full payload (the anonymous-mutator case from DisabledAuthSecurityConfiguration).

  4. **`getDataEntityActivity_revealsPiiInDescriptionEditPayload_pinsLeakageSurface`**:
     - Fixture: description-edit activity row whose `new_state` JSON includes a fake PII string `"customer_email": "alice@example.com"`.
     - Authenticated caller is Bob (no entity permission).
     - Assert: response body contains the PII string verbatim; PIN the data-exposure surface.

  After this test lands, REFACTOR-NNN can introduce a `@PreAuthorize("hasPermission(#dataEntityId, 'DATA_ENTITY', 'DATA_ENTITY_ACTIVITY_READ')")` at the controller; this test becomes the regression-pin proving the new gate fires. Cross-pair with DOC-NNN to surface the visibility posture on activity-feed.md (currently silent per `ActivityServiceImpl.md:docs_link_semantic`).
