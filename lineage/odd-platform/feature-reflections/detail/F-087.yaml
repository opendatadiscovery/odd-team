    actual_behavior: |-
      `management.health.redis.enabled: false` is the shipped default (application.yml:244-245), and the
      REDIS session branch is just `@EnableRedisWebSession` with no health-check wiring
      (SessionConfiguration.java:61-65). An operator switching to `session.provider=REDIS` is not nudged to
      enable the health indicator. A Redis outage on a session-Redis-only deployment causes 5xx on every
      authenticated request, but `/actuator/health` stays green — the monitoring blind spot is exactly when
      the operator most needs the signal.
    evidence:
      - sidecar: odd-platform__java__SessionConfiguration__config-class__SessionConfiguration.md
        section: bugs_limitations_corner_cases.[5]
        cite: "application.yml:244-245 + SessionConfiguration.java:61-65"
        note: "Redis health check disabled by default; REDIS branch has no health-check wiring."
    operator_visible_failure: |-
      (1) On a REDIS-session deployment, a Redis outage produces a platform-wide authenticated 5xx storm
      while `/actuator/health` reports healthy — the operator's automated monitoring and K8s readiness
      probes do not detect the real cause. (2) Incident triage is slowed because the obvious health signal
      lies. (3) The gap is silent at deploy time: nothing in the session-provider switch points the operator
      at `management.health.redis.enabled`.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: |-
    When an operator mistypes `session.provider` (e.g. `INTERNAL_POSTGRES` instead of `INTERNAL_POSTGRESQL`,
    or `POSTGRESQL`), the platform fails fast at boot with a clear error rather than starting in a broken
    session state.
  derivation: |-
    `session.provider` is a free-string config knob with three valid literals; the operator expects a
    misconfiguration to be caught, not silently degraded.
  seed_source: endpoint-shape       # config-key shape
  validation:
    verdict: partial
    actual_behavior: |-
      The condition gating is a literal string match with no compile-time enum, no `matchIfMissing`, and no
      fail-fast. A misspelled `session.provider` matches NEITHER the IN_MEMORY/INTERNAL_POSTGRESQL inner
      branch (SessionConfiguration.java:51-57) NOR the REDIS `@ConditionalOnProperty` (line 62), so NO
      `ReactiveSessionRepository<MapSession>` bean is registered. The platform does NOT fail fast and does
      NOT WARN — it may boot with session-aware filters unsatisfied (a silent boot-degradation surface). So
      the hypothesis is PARTIAL: a typo is caught only indirectly (downstream bean-wiring failure or runtime
      session errors), not by a clear, early, named error. A blank/unset value, by contrast, falls back to
      the IN_MEMORY default per application.yml:30.
    evidence:
      - sidecar: odd-platform__java__SessionConfiguration__config-class__SessionConfiguration.md
        section: bugs_limitations_corner_cases.[0]
        cite: "SessionConfiguration.java:51-57, 62"
        note: "Invalid value registers no bean; no fail-fast, no WARN — silent boot-degradation."
      - sidecar: odd-platform__java__SessionConfiguration__config-class__SessionConfiguration.md
        section: concepts.invariants
        cite: "SessionConfiguration.java:29, 37, 46, 51-57, 62 + application.yml:28-30"
        note: "A missing/misspelled value matches no inner branch; no compile-time enum, runtime string match only."
    operator_visible_failure: |-
      (1) A typo'd `session.provider` produces a platform that boots but has no session repository wired —
      authenticated flows fail in confusing ways at runtime rather than at boot. (2) The error the operator
      eventually sees (a downstream bean / filter failure or a session-resolution exception) does not name
      the root cause (the bad provider string), inflating diagnosis time. (3) The asymmetry — unset falls
      back to IN_MEMORY, but misspelled silently breaks — is itself a trap.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match    # the "no provider matched" branch
    coverage: unverified
    test_demand: functional

