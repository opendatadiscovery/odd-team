        detail: "17 mutating endpoints gated by SECURITY_RULES (DATA_ENTITY_*); 27+ read endpoints fall through to .authenticated() with no role/owner gate; DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM rules silently disabled by `/term` vs `/terms` path mismatch (SecurityConstants.java:237-242 vs DataEntityApi.java:148, 542); attachment chunk path gate authorises against URL's data_entity_id but file lands against uploadId's originating entity (cross-entity hijack); Activity feed cross-owner exposure repeats the same admin-path-without-admin-gate failure mode."
      owner_scoping:
        verdict: MIXED
        detail: "Owner-scoped: `/my`, `/my/upstream`, `/my/downstream` (delegated to reactor Context). Bypasses owner: `/popular`, `getDataEntityDetails`, `getDataEntityActivity`, `getDataEntityMessages`, lineage reads, DEG children/items/lineage, global Activity feed (ALL/UPSTREAM/DOWNSTREAM type-dispatch paths), Slack-message posting (cross-owner posting accepted). Mutations gated per-resource by DATA_ENTITY policy resolver. Directory non-owner-scoped catalog-wide view."
      strengths:
        - "Mutating endpoints centralised in SECURITY_RULES with DATA_ENTITY policy context (SecurityConstants.java:194-324)"
        - "DATA_ENTITY policy resolver evaluates user policies against resource owner/namespace/datasource/class/type"
        - "Per-resource permission model exists (Permissions / Roles / Owners / User-owner association per ODD vocabulary)"
        - "**Audit-log emission CONFIRMED for DataEntity mutations (batch F POSITIVE FINDING)** — `updateStatus` emits `DATA_ENTITY_STATUS_UPDATED` activity events with explicit `oldState` + `newState` payloads (programmatic, NOT AOP `@ActivityLog`); `createOwnership` emits `OWNERSHIP_CREATED` via `@ActivityLog` on OwnershipServiceImpl.create. DataEntity mutations are TIER-1 AUDITED — contrast with TIER-2 RBAC mutations (Role/Policy/Owner) which have NO audit. The platform has a 2-tier audit story; this concept is on the audited side. (updateStatus.md:implicit_adrs.[4] + createOwnership.md:implicit_adrs.[1])"
      weaknesses:
        - "DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM gates SILENTLY DISABLED by `/term` (SecurityConstants.java:237-242) vs `/terms` (DataEntityApi.java:148, 542) path mismatch — any authenticated user can attach/detach terms on any entity"
        - "All 27+ read endpoints (`getDataEntityDetails`, `getDataEntityAlerts`, `getDataEntityMessages`, `getDataEntityActivity`, `getDataEntityMetrics`, lineage reads) carry no role/owner/permission gate — auth-mode-only reads of every entity's full payload"
        - "**CENTERPIECE READ CROSS-OWNER EXPOSURE (batch F — RESOLVES ADR-CANDIDATE-003 borderline_flag as INTENTIONAL DELIBERATE posture)** — `getDataEntityDetails` (`GET /api/dataentities/{id}`) is the single hottest endpoint on the platform; any authenticated user (any anonymous caller under DISABLED) receives the FULL 34-field DataEntityDetails payload — ownership[] list, internalDescription, externalDescription, tags[], terms[], metadataFieldValues[], dataSource, linkedUrlList[], viewCount, isStale, sourceList[]/targetList[]/outputList[]/inputList[], including SOFT-DELETED entities (`includeDeleted(true)` is deliberate). 4th read-collaborative cross-owner-enumeration surface — WIDEST blast radius (the platform's primary UI read). The doc-gap is that live `/configuration-and-deployment/enable-security/authorization` does NOT name this posture. (getDataEntityDetails.md:security.known_security_gaps.[0] severity HIGH; bugs_limitations_corner_cases.[0])"
        - "**Read-as-write `view_count` increment on every GET (batch F)** — `getDataEntityDetails` UPDATE-s `data_entity.view_count` inside `@ReactiveTransactional` on every successful read. Unauthenticated under DISABLED → any caller can inflate any entity's `view_count` arbitrarily to push it to the top of `getPopular` ranking. Hot-key contention on the platform's most-popular entities. No idempotency, no rate-limit, no debouncing. (getDataEntityDetails.md:security.known_security_gaps.[3] severity MEDIUM; performance.known_performance_gaps.[0])"
        - "`getDataEntityActivity` exposes who-changed-what audit trail to any authenticated user"
        - "`getDataEntityMessages` exposes Slack-thread content to any authenticated user (cross-tenant exposure if Slack workspace has multiple sensitive channels)"
        - "Global `/api/activity` returns audit trails across every owner — including ActivityState old/new diffs of descriptions, business names, ownership changes, custom metadata — to ANY authenticated user (getActivity.md:security.known_security_gaps.[0] severity HIGH)"
        - "**Catalog-wide search enumeration (batch E)** — `POST /api/search` + paginated `GET /api/search/{search_id}/results` enumerates every non-EXCLUDE_FROM_SEARCH Data Entity in the platform with no owner predicate to ANY authenticated user. Same admin-path-without-admin-gate failure mode as getAllAlerts / getActivity but WIDER blast radius (the search surface is the platform's primary catalog discovery vector). search.md:security.known_security_gaps.[0] severity HIGH"
        - "**Lineage-graph cross-owner enumeration (batch F)** — `GET /api/dataentities/{id}/lineage/downstream` (sibling `/upstream`) returns the FULL reachable lineage subgraph from any rooted entity, including entities owned by other teams. Lineage edges encode causal connections — leaking the existence of a downstream transformer or consumer reveals another team's internal pipeline structure even if their individual entities are not separately enumerable. Wider than alerts/activity/search because graphs traverse owner boundaries. Combined with no `lineage_depth` upper-bound cap and no CTE cycle guard, this is also a DoS-amplification vector. (getDataEntityDownstreamLineage.md:security.known_security_gaps.[0,1] severity HIGH)"
        - "Slack-message posting accepts any user-supplied data_entity_id with no owner check — cross-tenant message injection (postMessageInSlack.md:security.known_security_gaps.[2] severity HIGH)"
        - "Attachment chunk hijack: caller with DATA_ENTITY_ATTACHMENT_MANAGE on entity X who learns another user's uploadId for entity Z can post chunks via X's URL — gate authorises path entity, service forwards to uploadId entity (uploadFileChunk.md:security.known_security_gaps.[0] severity MEDIUM)"
        - "**Owner-auto-create permission-bypass via createOwnership (batch F)** — `POST /api/dataentities/{id}/ownership` calls `OwnerService.getOrCreate(owner_name)` which silently creates a fresh `OwnerPojo` when the name is novel. Any caller with `DATA_ENTITY_OWNERSHIP_CREATE` can mint new Owner directory entries WITHOUT holding `OWNER_CREATE` permission. Same auto-create pattern on Title (`title_name` becomes a Title directory row with no allowlist, no length cap, no audit). Structural permission-escalation surface: the documented `OWNER_CREATE` permission gate on `POST /api/owners` is incomplete — this endpoint is a second write path into the Owner directory. (createOwnership.md:security.known_security_gaps.[0] + bugs_limitations_corner_cases.[0,1] severity MEDIUM)"
        - "**Status-update self-grant ambiguity + cross-tenant assignment (batch F)** — `createOwnership` accepts any caller-supplied `owner_name` (including names that don't correspond to the caller). A Policy granting `DATA_ENTITY_OWNERSHIP_CREATE` without `\"is\": \"dataEntity:owner\"` condition is functionally root on any entity's ownership; the docs do not enumerate default Policies. Self-grant feasibility undocumented. (createOwnership.md:bugs_limitations_corner_cases.[6,7] severity MEDIUM)"
        - "Authorization layer is path-string-coupled with no compile-time/test-time guard against drift; the term mismatch is the canonical example, no integration test currently catches such drift"
        - "Attachment subsystem (a per-entity feature) has its own systemic security weaknesses — see Attachment concept's security_aggregate"
        - "Under auth.type=DISABLED, every endpoint becomes anonymously reachable — now 11-SIDECAR triangulated; getDataEntityDetails + createOwnership + updateStatus join the 8 prior sidecars (batch F corroboration on the entire DataEntity primary surface)"
      cross_file_inconsistencies:
