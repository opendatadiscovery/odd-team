expected_outcome: |
  Hypothesis H-008 (verbatim from the reflection):

  "When the caller paginates the Activity Feed by passing
  `(last_event_id, last_event_date_time)` from page N's last row,
  page N+1 returns the strictly-older rows (in `created_at DESC,
  id DESC` order) without (a) skipping any row whose insertion
  is observable to a concurrent reader, (b) duplicating any row,
  or (c) surfacing rows in commit-inverted order under sustained
  write rate >= 100 events/sec."

  The static trace (ReactiveActivityRepositoryImpl batch-R sidecar
  S-C-2 + ActivityServiceImpl batch-R sidecar S-C-2) establishes:
  (i) cursor predicate is asymmetric — LEFT side
      `row(trunc(ACTIVITY.CREATED_AT, DatePart.SECOND), ACTIVITY.ID)`
      (SECOND precision); RIGHT side `(truncated_last_event_dt,
      lastEventId)` also SECOND-truncated; ORDER BY is full microsecond
      precision (ReactiveActivityRepositoryImpl.java:287-291);
  (ii) `DateTimeUtil.generateNow()` is called at Mono-assembly time,
       not at INSERT commit time (ActivityServiceImpl.java:45, :56) —
       two near-simultaneous mutations can have `created_at` columns
       inverted vs commit order;
  (iii) within a single second-bucket, page N's cursor cut at id=L
        excludes rows with id < L; but those rows may have microseconds
        > μ_L, and would appear AFTER page N's last row in pure
        microsecond ordering — yet page N+1's filter sees them.

  Static analysis concludes: no row SKIP under forward correctness;
  no DUPLICATE from the cursor mechanism itself; but a possible
  visual OUT-OF-ORDER within a single second-bucket when the bucket
  splits across pages. The visual claim is PROBE-NEEDED to PIN under
  realistic write rate.

