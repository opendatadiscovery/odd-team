proposed_action: |-
  Add `IngestionDataSourceFilterIntegrationTest` that posts /ingestion/datasources with a valid bearer token BUT BYPASSES the filter (e.g. via a test-specific WebTestClient.mutateWith() removing the filter chain) — asserts the controller throws `IllegalStateException("Collector id is null")` producing HTTP 500 (NOT 401). Pins the current contract; future refactor that introduces principal-based identity must flip the test. Plus a sibling test: under simulated cluster split (session attribute manually cleared between request hops), same 500 result.
