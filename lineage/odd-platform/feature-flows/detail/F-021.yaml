description: |-
  The Activity Feed is the audit-trail consumer surface of the platform
  — the user-observable history of data-entity-scoped lifecycle and
  metadata-edit events. The feed manifests as TWO UI surfaces: the
  global Activity Feed page (`/activity` route, 7 filter facets per
  the live doc — Calendar / datasource / namespace / event type /
  tags / owners / users) AND the per-entity Activity tab on every
  Data Entity detail page. Cursor-paginated by
  `(created_at SECOND-truncated, id)` tuples newest-first;
  size-bounded only by caller-supplied size with no clamping at any
  layer.

  The user-observable promise (per the live `features/active-platform-features/activity-feed`
  page, WebFetched 2026-05-20 status 200): "Activity Feed records
  changes to data entities — description edits, ownership changes,
  tag and term assignments, custom-metadata edits, and alert lifecycle
  events. Filter by event type, owner, user, tag, or date range."
  The page enumerates 20 event types in 6 groups (data-entity
  lifecycle / ownership / tags-and-terms / dataset-fields / DEGs /
  alerts).

  The user-observable reality, per batch-R primary-source code-walk
  of `ReactiveActivityRepositoryImpl` + cross-references to
  ActivityServiceImpl batch A + AlertServiceImpl batch I + the V0_0_48
  migration: the feed is STRUCTURALLY SCOPED to data-entity events
  ONLY. The `activity.data_entity_id` column is NOT NULL with FK to
  `data_entity(id)` (V0_0_48__add_activity.sql:4,12) — RBAC mutations
  (Role / Policy / Owner CRUD), Datasource registration, Collector
  token rotation, integration-wizard config changes CANNOT physically
  emit to this table even if a future @ActivityLog annotation were
  added. The doc's framing ("records changes") implicitly suggests
  platform-wide audit; the reality is data-entity-scoped audit. The
  audit-silence-on-RBAC pattern observed across batches F/H/N/P/Q/R
  on F-006 is rooted in THIS feature's schema.

  Additionally: the read default is CROSS-OWNER (every authenticated
  caller sees every data entity's activity); only the `MY_OBJECTS`
  type parameter is owner-scoped, and that scoping is along the
  OBJECT-OWNERSHIP axis (entities the caller owns) NOT the ACTOR
  axis (activity the caller performed). Code's 27 ActivityEventTypeDto
  enum values vs the live doc's 20 — seven event types undocumented.
  Anonymous mutations under `auth.type=DISABLED` write
  `created_by=null` and surface visually indistinguishable from
  system events. The provider-agnostic LEFT JOIN to
  `USER_OWNER_MAPPING ON OIDC_USERNAME` (four read paths) is the
  read-side mirror of F-011's cross-mode-bleed pattern.
