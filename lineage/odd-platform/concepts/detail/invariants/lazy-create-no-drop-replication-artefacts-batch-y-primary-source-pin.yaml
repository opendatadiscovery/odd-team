description: |-
  STRENGTHENS the existing
  lazy-create-no-drop-replication-artefacts-operator-owns-cleanup
  invariant (batch C) by PRIMARY-SOURCE pinning the lazy-create-no-drop
  pattern at the actual code site (NotificationSubscriber.java lines
  104-126 for the replication slot and lines 128-158 for the publication)
  via the batch-Y NotificationSubscriber file-analyser sidecar. The batch-C
  invariant was anchored on operator-facing documentation and a textual
  sibling reference; this strengthening pins the code-side primary source.

  THE NEW PRIMARY-SOURCE EVIDENCE — NotificationSubscriber batch Y:

    NotificationSubscriber.java:104-126 (replication-slot lazy create):
      // existence probe (parameterised SELECT EXISTS — L106-114)
      try (final PreparedStatement ps = connection.prepareStatement(
              "SELECT EXISTS (SELECT slot_name FROM pg_replication_slots WHERE slot_name = ?)")) {
          ps.setString(1, walProperties.getReplicationSlotName());
          try (final ResultSet rs = ps.executeQuery()) {
              if (rs.next() && !rs.getBoolean(1)) {
                  // conditional CREATE — L115-122
                  pgConnection
                      .getReplicationAPI()
                      .createReplicationSlot()
                      .logical()
                      .withSlotName(walProperties.getReplicationSlotName())
                      .withOutputPlugin(PG_REPLICATION_OUTPUT_PLUGIN) // "pgoutput"
                      .make();
              }
          }
      }
    The slot is created if absent, never dropped here. The driver-side
    createReplicationSlot() is the only construction site; no
    pg_drop_replication_slot() invocation exists in the file (verified
    by reading the entire 159-line file end-to-end at batch Y).

    NotificationSubscriber.java:128-158 (publication lazy create):
      // existence probe (parameterised SELECT EXISTS on pg_publication — L133-135)
      try (final PreparedStatement ps = connection.prepareStatement(
              "SELECT EXISTS (SELECT oid FROM pg_publication WHERE pubname = ?)")) {
          ps.setString(1, walProperties.getPublicationName());
          try (final ResultSet rs = ps.executeQuery()) {
              if (rs.next() && !rs.getBoolean(1)) {
                  // conditional CREATE — L144-152 via registerPublication
                  registerPublication(connection, Tables.ALERT);
              }
          }
      }
      // registerPublication helper at L144-152
      private void registerPublication(final Connection connection,
                                       final Table<?> targetTable) throws SQLException {
          final String tableName = targetTable.getSchema().getName() + "."
                                   + targetTable.getName();
          final String sql = "CREATE PUBLICATION %s FOR TABLE %s"
                  .formatted(walProperties.getPublicationName(), tableName);
          try (final Statement stmt = connection.createStatement()) {
              stmt.execute(sql);
          }
      }
    The publication is created if absent, never dropped here. No
    DROP PUBLICATION invocation exists in the file.

  THE OPERATOR-OWNS-CLEANUP POSTURE — primary source from the live doc
  (NotificationSubscriber.md:docs_link_semantic.inferred_docs[0]):

    WebFetch 2026-05-20 status 200 quotes from the live
    /configuration-and-deployment/odd-platform page, Enable Alert
    Notifications section:
      "ODD Platform doesn't clean up replication slot it has created."
      Cleanup SQL (operator-runs-manually):
        SELECT pg_drop_replication_slot('<replication_slot_name>');
        DROP PUBLICATION IF EXISTS <publication_name>;

    The live-doc verbatim phrasing PRIMARY-SOURCES the operator-owns-
    cleanup posture, which the batch-Y sidecar inherits and reflects in
    implicit_adrs.[1] (Lazy-create-no-drop replication artefact policy).

  THE RENAME-ORPHAN AMPLIFICATION — batch Y bugs_limitations_corner_cases.[4]:

    A subtle case the live doc does NOT warn about: if an operator
    renames notifications.wal.replication-slot-name between deployments
    without first running pg_drop_replication_slot('<old_name>'), the OLD
    slot accumulates WAL forever on the primary. The lazy-create at
    L113-120 creates the NEW slot fine; the OLD slot is now invisible to
    ODD Platform but still pinned by Postgres. Combined with the new
    batch-Y wal-retention-disk-exhaustion-under-poison-replay invariant
    (which describes a similar but different unbounded-WAL-retention
    scenario), the lazy-create-no-drop posture has TWO failure modes
    that both lead to Postgres-primary disk exhaustion:
      - rename-orphan: operator renames slot-name without cleanup
      - poison-replay: subscriber stuck in 10s retry loop with un-advanced LSN

    Both failure modes share the same root cause: ODD does NOT manage
    the slot lifecycle proactively, and there is NO telemetry exposing
    slot-side WAL retention to the operator.

  THE OUTPUT PLUGIN HARDCODING (batch Y additional finding):

    Batch Y also primary-sources the choice of pgoutput as the output
    plugin (NotificationSubscriber.java:30:
      private static final String PG_REPLICATION_OUTPUT_PLUGIN = "pgoutput";
    + line 119 use in withOutputPlugin call). This is consistent with the
    lazy-create-no-drop pattern (the plugin is bound to the slot at
    create time and persists with the slot); a future change to a
    different output plugin would require dropping the existing slot
    AND recreating with the new plugin AND updating
    PostgresWALMessageDecoder to parse the new format. The
    operator-owns-cleanup posture compounds this: there is no
    platform-managed migration path.

  THE SIBLING PATTERN — partition lazy-create (batch C reference):

    ActivityTablePartitionManager (batch B primary source) ships
    createPartitionsIfNotExists for the activity table — partitions are
    lazily created at boot and on nightly schedule, never dropped. The
    same pattern: idempotent create + no drop + operator-owns-cleanup.
    Batch Y's pin extends the pattern to the replication slot +
    publication, providing primary-source confirmation that the
    code-side convention is consistent across the multiple
    Postgres-resident-artefact subsystems.

    Cross-subsystem coverage (extending the original batch-C 2-sidecar
    triangulation to a 3-sidecar pin):
      Subsystem 1 — Activity table partitions (batch B): lazy-create,
        no drop, operator-owns-cleanup
      Subsystem 2 — DataCollaboration message-table partitions (batch B
        sibling): lazy-create, no drop, operator-owns-cleanup
      Subsystem 3 — Notification replication slot + publication
        (batch Y — THIS STRENGTHENING): lazy-create, no drop, operator-
        owns-cleanup, PRIMARY-SOURCE pinned

  SEVERITY remains MEDIUM (inherited from the batch-C invariant);
  this strengthening does not change the severity assessment but
  provides primary-source code-side confirmation and surfaces the
  rename-orphan + poison-replay disk-exhaustion compounding.
