  - "ReferenceDataController.md:security.known_security_gaps.[3] (updateLookupTableField discards path-param lookupTableId at the service layer — an authorized caller with LOOKUP_TABLE_DEFINITION_UPDATE granted via Policy on table A can PATCH a column belonging to table B by spoofing the URL — severity MEDIUM)"
behaviour: |-
  **HIGH — `updateLookupTableField` discards the `lookupTableId` path parameter — a caller authorized for table A can PATCH a column belonging to table B by URL-spoofing.** Primary-source confirmed in the batch-V ReferenceDataController sidecar:

  - **Controller signature** (`ReferenceDataController.java:131-141`): the method accepts `lookupTableId` in the URL path and `columnId` in a sibling path segment. The controller passes BOTH to `referenceDataService.updateLookupTableField(...)`.
  - **Service signature** (`ReferenceDataServiceImpl.java:126-143`): `updateLookupTableField(final Long columnId, final LookupTableFieldUpdateFormData formData)` — **the lookupTableId is silently dropped from the service contract**. The service operates ONLY on `columnId`.
  - **No cross-check at the service layer**: the service does NOT verify that `columnId` belongs to `lookupTableId`. The update succeeds for any column matching `columnId`.
  - **Asymmetric with `getLookupTableField`**: `ReferenceDataServiceImpl.java:58-70` (`getLookupTableField`) DOES enforce the parent-table linkage (raises `BadUserRequestException` for column reads with mismatched parent — per `concepts.invariants[1]` of the sidecar). The asymmetry is between READ (validates) and UPDATE (does not validate) — operators familiar with the READ contract have no warning that the UPDATE contract is laxer.

  **Attack scenario**:
  ```
  # Attacker holds LOOKUP_TABLE_DEFINITION_UPDATE via Policy attached to lookup_table A.
  # Column 999 belongs to lookup_table B (attacker has NO permission on B).

  curl -X PATCH https://platform/api/referencedata/table/{A_id}/column/999 \
       -H "Authorization: Bearer $TOKEN" \
       -d '{ "name": "renamed-column" }'

  # Result: column 999 is renamed. Authorization manager checked LOOKUP_TABLE_DEFINITION_UPDATE
  #         on the URL's table A (granted). Service operated on column 999 (which belongs to table B,
  #         not A). Cross-table mutation succeeds.
  ```

  **Compound with TEST-GAP-739 (NO_CONTEXT permission scope)**: even with TEST-GAP-739's NO_CONTEXT permission asymmetry (LOOKUP_TABLE_* grants are platform-global), THIS gap surfaces an ADDITIONAL bypass at the per-method service-signature layer. Even if a future REFACTOR scoped LOOKUP_TABLE_* permissions to specific tables (per TEST-GAP-739's recommended fix), the discarded-lookupTableId-in-updateLookupTableField bug would BYPASS that scoping. The two gaps must be fixed TOGETHER.

  **Why HIGH not MEDIUM**: this is a path-id-binding-bypass class — the URL says "column on table A" but the service operates "any column whose id matches". Operators reasoning about authorization at the URL level (which the sidecar's `OwnerAssociationRequestController.implicit_adrs.[6]` ALSO documents on a SISTER controller for the attachment surface) have no warning. The asymmetry with the READ contract (`getLookupTableField` enforces) elevates severity — operators tested READ behaviour and inferred UPDATE behaviour matches.

  **Test gap shape**: regression-pin asserting the path-id-binding bypass: `PATCH /api/referencedata/table/{A}/column/{B-belonging-column-id}` succeeds. Pair with the sister test asserting `GET /api/referencedata/table/{A}/column/{B-belonging-column-id}` returns BadUserRequestException (the asymmetry).
