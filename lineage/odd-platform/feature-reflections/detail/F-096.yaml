    a non-empty list of well-formed items), the platform either commits the ENTIRE batch
    atomically and returns success, or — if any single item or any downstream processor
    fails — rolls back EVERY entity in the batch (and every downstream side effect: lineage,
    metadata, FTS, alerts, activity) so the catalog is never left in a half-applied state.
  derivation: |-
    The endpoint name + payload shape (one datasource, a LIST of entities) promises batch
    semantics; `@ReactiveTransactional` on `ingest(...)` is the atomicity anchor.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      `ingest(...)` is `@ReactiveTransactional` (IngestionServiceImpl.java:66). The single
      transaction wraps datasource lookup + bulkUpdate + bulkCreate + restore + the full
      14-processor chain (INITIAL→MAIN→FINALIZING) + OTLP export. A failure anywhere rolls
      back everything; the response is binary 200-or-5xx with no partial-commit window. The
      atomicity promise itself HOLDS — this is the one part of the contract that behaves
      exactly as an author would hope.
    evidence:
