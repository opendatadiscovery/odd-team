behaviour: |-
  **MEDIUM — `DELETE /api/namespaces/{id}` is vulnerable to a TOCTOU race between the cascade-check phase and the namespace-delete phase. A concurrent `POST /api/datasources` (or any of the 7 other "side-door" namespace-referencing endpoints) can insert a new referent row with `namespace_id = id` between the zip-existsByNamespace check and the namespaceRepository.delete UPDATE. The delete proceeds; the new referent row is orphan-attached to a soft-deleted namespace.** Primary-source confirmed in batch-W NamespaceController sidecar:

  **Concurrent-execution evidence**:
  - `NamespaceServiceImpl.delete` (lines 73-90): NOT annotated with `@ReactiveTransactional` (verified by sidecar primary-source — contrasted with the surrounding `update` at lines 62-71 which IS annotated). NO SELECT FOR UPDATE on the namespace row. NO advisory-lock.
  - The check phase: `Mono.zip(dataSourceRepository.existsByNamespace(id), collectorRepository.existsByNamespace(id), termRepository.existsByNamespace(id), dataEntityRepository.existsNonDeletedByNamespace(id))` — 4 parallel SELECTs.
  - The filter phase: `.filter(tuple -> !tuple.t1() && !tuple.t2() && !tuple.t3() && !tuple.t4())` — application-tier boolean.
  - The delete phase: `.then(namespaceRepository.delete(id))` — `UPDATE namespace SET deleted_at = NOW() WHERE id = ?`.
  - **Race window**: between the 4 existsByNamespace SELECTs and the namespace soft-delete UPDATE, ANY of the 8 side-door call sites (per NamespaceController.md:bugs_limitations_corner_cases.[1] — TermServiceImpl.createTerm/updateTerm, DataSourceServiceImpl.create/update, CollectorServiceImpl.create/update, DataEntityGroupServiceImpl.createDataEntityGroup/updateDEG) can INSERT a new row with `namespace_id = id`. The cascade-check has already returned "no children"; the new child arrives after the check; the delete proceeds.

  **Operator-visible consequence**:
  - The new datasource (or term / collector / DEG) references a soft-deleted namespace via `namespace_id`. Reads via `dataSourceService.list(...)` will JOIN through the namespace and find `deleted_at IS NOT NULL` — depending on the JOIN's filter, the datasource may appear with NULL namespace OR may be filtered out entirely.
  - The FK `data_source.namespace_id → namespace.id` has NO `ON DELETE CASCADE` (verified by V0_0_11 migration); the new referent row is technically orphan-attached but the FK is still valid (the parent row exists, just soft-deleted).
  - The race is REACHABLE at multi-instance scale (the platform can scale horizontally; concurrent operator + collector mutations on different instances are common).

  **Sibling pattern**: this is the same architectural class as `ReactiveTagRepositoryImpl` TOCTOU (batch N) — the cascade-check + write are not atomic at the persistence tier; the application-tier zip-check is best-effort under concurrency.

  **Why MEDIUM not HIGH**: the operator-impact is RECOVERABLE — the orphan-attached referent can be deleted by the operator and re-attached to a new namespace. The race is statistically rare (requires concurrent ops on the same namespace within milliseconds). MEDIUM rather than LOW because: (a) the race window is REACHABLE; (b) the application invariant ("namespaces with non-deleted referents cannot be deleted") is violated; (c) there is no DB-tier constraint backing the invariant.

  **Test gap shape**: regression-pin asserting the TOCTOU is reachable: concurrent `DELETE /api/namespaces/{id}` + `POST /api/datasources?namespace_name={target_name}` produces a state where the datasource references a soft-deleted namespace. The current state is PINNED — failures land if a future maintainer adds `@ReactiveTransactional` + SELECT FOR UPDATE.
