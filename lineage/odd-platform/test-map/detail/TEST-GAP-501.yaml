behaviour: |-
  Null data_entity_group_id UX-defect regression-pin (LOW — spec hygiene). `DataEntityDataEntityGroupFormData` (components.yaml:1087-1092) declares the property `data_entity_group_id` without a `required` clause; the schema is `type: object, properties: {data_entity_group_id: {type: integer, format: int64}}`. A POST body `{}` or `{data_entity_group_id: null}` passes OpenAPI validation. The Spring/Jackson deserialiser yields `formData.getDataEntityGroupId() == null`. The service then calls `reactiveDataEntityRepository.get(null)` (DataEntityServiceImpl.java:393) which returns Mono.empty(). `switchIfEmpty` fires with `BadUserRequestException("Entity with id null is not manually created DEG")` — a user-visible error mentioning 'id null' is a poor surface for a missing-required-field condition. The schema should declare `required: [data_entity_group_id]` (also a backward-compatible spec change since omitting was already invalid behaviour at the service level). The current test landscape never exercises this null path. Cross-pillar P-01 (Discovery DEG UX). Test asserts current contract (400 with 'id null' message) and FLIPS to a contract-validation 400 ('data_entity_group_id is required') when the spec is fixed.
test_class: missing-edge-case
