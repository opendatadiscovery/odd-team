behaviour: |-
  **Cross-provider username row-duplication via OIDC_USERNAME-only JOINs.** Four other repositories (Alert / Activity / OwnerAssociationRequest / Owner) LEFT JOIN user_owner_mapping `ON USER_OWNER_MAPPING.OIDC_USERNAME = X AND USER_OWNER_MAPPING.DELETED_AT IS NULL` — **NO provider equality clause**. If two ACTIVE rows exist for (alice, null) AND (alice, GITHUB), the LEFT JOIN matches BOTH rows and produces a Cartesian product — alerts/activity entries get DUPLICATED (one per matching mapping), and the Owner display becomes one of the two non-deterministically (depending on Postgres physical row order). Row-duplication is more severe than incorrect-display — operators investigating alerts see phantom doubled entries; auditors see duplicated activity events. The same authoritative compound-key contract at this repository's lines 116-127 is NOT respected by the consuming JOINs. Cross-cutting integration test required.
