terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Authenticated principal's authority set is materialised into the
    SecurityContext for the request; if ADMIN granted, every authorization
    gate passes. Misconfiguration → over-privileged users (LDAP substring
    match) OR no-admin-path users (GitHub missing scope, Okta/Keycloak
    no handler).
  evidence: "LDAPSecurityConfiguration.java:91-93 / each *UserHandler"
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
    - drift_class: ldap_admin_groups_substring_match_overpromotion
      description: |-
        `LDAPSecurityConfiguration.java:96` uses
        `OperationUtils.containsIgnoreCase(adminGroups, authority)` — case-
        insensitive SUBSTRING containment, not equality. Operator config
        `admin-groups: ['ops']` against LDAP groups `devops`, `noops`,
        `appops`, `dataops` silently promotes EVERY member of EVERY one
        of those groups to ADMIN. Mitigation is operator-side (use long
        admin-group names like `ODD_PLATFORM_ADMINS`). Docs do NOT warn.
        HIGHEST SEVERITY in this feature.
      reflection_correction: |-
        CONTRADICTED by feature-reflector F-124 H-001 (2026-06-03), ground-truth
        source-read of OperationUtils.java:9 = `collection.stream().anyMatch(element::equalsIgnoreCase)`
        — this is FULL-STRING case-insensitive EQUALITY, NOT substring. `admin-groups: ['ops']`
        does NOT match `devops`/`noops`. This facet is FACTUALLY WRONG; the over-promotion does
        not exist. The GithubUserHandler sidecar (2026-05-19) already flagged this; correction was
        not propagated. RE-FRAME to the H-002 caveat (exact-CN, case-insensitive). PLT-081 / DOC-235 /
        DOC-238 carry the same error and must be retracted/re-framed. See feature-reflections/detail/F-124.yaml.
      evidence:
        - "LDAPSecurityConfiguration.java:48,94-98"
        - "ODDLDAPProperties.java:31"
        - "WebFetch docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authentication/ldap (no substring warning)"
        - "CONTRADICTING: OperationUtils.java:9 (element::equalsIgnoreCase — full-string equality, read 2026-06-03)"
    - drift_class: github_admin_requires_read_org_scope_silent_failure
      description: |-
        GitHub admin-detection (`GithubUserHandler.java:78-86`) calls
        the GitHub API to enumerate the user's teams. Missing `read:org`
        scope → 403 / empty result → handler returns no admin authorities
        → user is USER regardless of team membership. No fail-fast at
        boot, no log clue at sign-in time. Operator sees "admin promotion
        isn't working" with no actionable info.
      evidence:
        - "GithubUserHandler.java:78-86"
    - drift_class: azure_logout_uri_unvalidated_npe_on_first_logout
      description: |-
        Per ODDOAuth2Properties sidecar: Azure operators who omit `logout-uri`
        get NullPointerException on first logout. `@PostConstruct validate()`
        only checks clientId + provider non-empty; provider-required fields
        are unvalidated. Same shape applies to Google's `allowed-domain`
        and GitHub's `organization-name`.
      evidence:
        - "ODDOAuth2Properties.java @PostConstruct validate()"
    - drift_class: okta_keycloak_documented_but_no_handler_implementation
      description: |-
        Live docs at `docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authentication/oauth2-oidc`
        claim support for 7 providers. The `Provider` enum has 5 values
        (`COGNITO, GITHUB, GOOGLE, ODD_IAM, AZURE`). Okta + Keycloak get
        generic OIDC routing — `*UserHandler.shouldHandle` checks fail —
        no admin-detection logic runs — every Okta/Keycloak user is USER.
        Documented as supported; mechanically not supported.
      evidence:
        - "Provider enum (5 values)"
        - "WebFetch docs page (7 providers claimed)"
        - "each *UserHandler.shouldHandle equalsIgnoreCase(Provider.X.name())"
    - drift_class: ldap_groups_unset_silent_user_only_no_admin_path
      description: |-
        When `auth.ldap.groups` is null (default — application.yml ships
        the ldap block commented out), LDAPSecurityConfiguration:91-93
        returns a USER-only authority for every authenticated user. An
        operator who uncomments LDAP but forgets `groups.admin-groups` has
        NO path to ADMIN via LDAP AND no error message tells them.
      evidence:
        - "ODDLDAPProperties.java:18,28-32"
        - "LDAPSecurityConfiguration.java:91-93"
        - "application.yml:50-65 (ldap block commented out)"
    - drift_class: oauth2_provider_field_free_string_no_enum_typo_silent_routing
      description: |-
        `OAuth2Provider.provider` field type is free String (not the
        `Provider` enum). A typo like `provder: google` fails fast at
        boot? No — it silently routes through generic OIDC discovery
        (every `*UserHandler.shouldHandle` check fails on typo'd value,
        so handler-chain falls through). No admin path; no fail-fast.
      evidence:
        - "ODDOAuth2Properties.java:32 (provider String, not Provider enum)"
    - drift_class: login_form_admin_via_seeded_administrator_role_not_via_config
      description: |-
        Under `auth.type=LOGIN_FORM`, there is NO admin-detection
        mechanism on form-login itself. Admin is granted at user-creation
        time via the UI by binding the seeded `Administrator` Role to
        the user's mapped Owner. Per F-011's drift class
        `login_form_admin_for_all_hardcoded_no_role_discrimination`, this
        is itself a load-bearing finding: the form-login mode has its
        OWN admin-promotion shape that the OAuth2/LDAP docs don't
        anticipate.
      evidence:
        - "F-011 drift class login_form_admin_for_all_hardcoded_no_role_discrimination"
    - drift_class: six_admin_paths_no_unified_doc_page
      description: |-
        Six concrete shapes of "configure admins": (a) LDAP substring,
        (b) Cognito exact-match, (c) GitHub org+team+scope, (d) Google
        domain+attribute, (e) Azure roles-or-groups-claim, (f) ODD_IAM
        userinfo-flag. Plus form-login's role-binding-at-creation. Live
        docs treat each provider's admin page in isolation; no unified
        "ADMIN Promotion Across Auth Providers" reference for operators
        migrating between modes.
      evidence:
        - "WebFetch docs (per-provider pages; no unified reference)"
