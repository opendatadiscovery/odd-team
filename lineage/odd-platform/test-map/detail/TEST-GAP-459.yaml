gap_id: TEST-GAP-459
category: missing-security
criticality: MEDIUM
node_ids:
  - "odd-platform java service service:NotificationsDispatcher"
pillars_affected: [P-07, P-09]
surfaced_by:
  - "NotificationsDispatcher.md:bugs_limitations_corner_cases.[3] (no per-channel filter)"
  - "NotificationsDispatcher.md:security.known_security_gaps.[0] (owner-scoping bypassed)"
behaviour: |-
  ALL configured senders receive ALL alerts — no per-channel filter by alert type / severity / data-entity owner / namespace. Owner-scoping is BYPASSED at the dispatcher: every channel receives every alert event regardless of which data-entity Owner is attached. The AlertNotificationMessage payload INCLUDES dataEntity.owners[] (populated by AlertNotificationMessageTranslator.java:73-83) but the dispatcher does NOT consult them for routing. Operators wanting 'Critical to Slack only, all to email' OR 'team-A alerts to team-A's Slack only' cannot express that. This is a security/scope gap (cross-team Slack workspaces see other teams' alerts) AND an operator UX gap.
test_class: missing-security
