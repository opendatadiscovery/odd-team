behaviour: |-
  **LOW — `GET /api/datasets/{id}/structure/diff` for two versions where a parent struct field has been RENAMED produces DELETE+CREATE rows for EVERY descendant of that parent. The diff payload size grows non-linearly with struct depth — a single rename of a top-level struct can yield 2N rows for an N-leaf subtree. Behaviour is intentional (encodes the column-level versioning-by-reference invariant) but unsurfaced to API consumers.** Primary-source confirmed in batch-W DatasetController sidecar:

  - `DatasetVersionServiceImpl.getParentOddrnChangedPojos` (lines 156-180): a recursive fixed-point algorithm that propagates `parentFieldChanged` from any field whose parent oddrn was renamed to ALL its descendants.
  - `DatasetVersionServiceImpl.calculateVersionDiff` (lines 110-134): branches on `parentOddrnChanged`. When TRUE, emits TWO rows per descendant: line 121 (DELETED with minVersionDiff) + line 129 (CREATED with maxVersionDiff).
  - **The intent** (per implicit_adrs.[2]): "a struct rename invalidates every nested column's identity at the dataset_field row level (consistent with the versioning-by-reference invariant in ReactiveDatasetFieldRepositoryImpl batch-R + concept dataset-field-versioning-by-reference-no-soft-delete-orphan-accumulation)."

  **Amplification scenario**:
  - Dataset's V1 schema: struct `user { id, name, email, address { street, city, zip } }` — 6 leaves under `user`.
  - V2 schema: same shape, but `user` renamed to `customer`.
  - Diff between V1 and V2: 12 rows emitted (6 DELETED + 6 CREATED — one per leaf). NOT 1 row (the parent rename) or 2 rows (the rename as DELETED+CREATED on the parent only).
  - For deeply nested struct types (e.g., a 5-level deep schema with 10 leaves per level = 100,000 leaves), a single parent rename produces 200,000 diff rows.

  **Operator-visible consequences**:
  - **Diff payload size**: an operator comparing two versions of a complex nested-struct dataset sees an amplified diff. The UI's diff visualization may render slowly or be visually noisy.
  - **API consumer confusion**: a custom BI tool integrating against the diff endpoint sees more rows than expected for a "simple rename" — the tool's deduplication logic (if any) may misclassify the rename as wholesale schema replacement.
  - **Unbounded payload**: there is NO pagination on the diff endpoint (per the sidecar's performance.known_performance_gaps.[no-pagination]) — pathological cases produce > 10K rows in a single response.

  **Why LOW not MEDIUM**:
  - The behaviour is INTENTIONAL (encodes the versioning-by-reference invariant).
  - The amplification is bounded by struct depth + width — practical schemas have modest amplification (typical: < 100 rows for a typical rename).
  - The functional impact is "visual noise / payload size" not "incorrect data" — the diff is accurate at the per-field level.
  - LOW is consistent with the sidecar's own rating.

  **Test gap shape**: regression-pin asserting: (a) seed V1 with `user { id, name }` and V2 with `customer { id, name }` (same structure, parent renamed); (b) GET diff; assert the response contains FOUR rows: `user.id DELETED`, `user.name DELETED`, `customer.id CREATED`, `customer.name CREATED` (NOT 2 rows or 1 row); (c) for a 3-level deep struct with 4 leaves, a single parent rename produces 8 rows (4 DELETED + 4 CREATED). The current state is PINNED — failures land if a future maintainer changes the cascade semantic.
