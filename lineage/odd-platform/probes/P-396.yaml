arrange:
  - kind: docker-compose-up
    profile: odd-minimal
    note: |
      The odd-minimal stand runs AUTH_TYPE=DISABLED, so every caller resolves to the shared
      sentinel identity `(__shared__, DISABLED)`
      (CurrentUserIdentityResolver.java:21-22, 26-29). That is sufficient for this probe: it tests
      the DIRECTION of the predicate, not per-user scoping.
  - kind: rest
    method: POST
    path: /ingestion/entities
    note: |
      Seed TWO searchable data entities that both match one FTS token and whose names do NOT
      share a substring (the CTRIB-061 fixture trap: "favnobetaunstarreddataentity" contains
      "starreddataentity"). Reuse the IT-148 helpers `seedIngestionDataSource` +
      `seedSearchableEntity` if running inside the odd-team e2e harness.
    body: |
      two entities with external names "p396starred" and "p396plain",
      both matching the search token "p396"
  - kind: rest
    method: PUT
    path: /api/favorites/DATA_ENTITY/{id_of_p396starred}
    capture_as: star_response
  - kind: rest
    method: DELETE
    path: /api/favorites/DATA_ENTITY/{id_of_p396plain}
    note: idempotent no-op — guarantees the foil is not starred from an earlier run
act:
  - kind: dom-probe
    steps:
      - navigate to {BASE_URL}/search?favorites=no&q=p396
      - wait for the POST /api/search/assets response to settle (react-query/redux initialData
        masks early assertions — see reference_odd_platform_e2e_route_interception)
    capture_as: negative_scope_view
  - kind: rest
    method: POST
    path: /api/search/assets?size=30
    body: |
      {"query": "p396", "filters": {}, "favorites": false}
    capture_as: api_negative
  - kind: rest
    method: POST
    path: /api/search/assets?size=30
    body: |
      {"query": "p396", "filters": {}}
    capture_as: api_absent
observe:
  - kind: dom-probe
    capture:
      - js: "document.querySelector('[data-qa=\"filter-favorites\"] input[type=checkbox]').checked"
        capture_as: checkbox_checked
      - js: "document.querySelector('[data-qa=\"filter-favorites\"]').innerText.trim()"
        capture_as: filter_label
      - js: "[...document.querySelectorAll('body *')].some(el => (el.textContent || '').includes('p396starred'))"
        capture_as: starred_listed
      - js: "[...document.querySelectorAll('body *')].some(el => (el.textContent || '').includes('p396plain'))"
        capture_as: plain_listed
      - js: "document.location.search"
        capture_as: final_search
  - capture: api_negative.items[*].externalName
    as: api_negative_names
  - capture: api_absent.items[*].externalName
    as: api_absent_names
assert:
  # THE HYPOTHESIS: the list is narrowed while the control shows nothing active.
  - "checkbox_checked == false        # the control does not reflect an active favorites narrowing"
  - "plain_listed == true             # the un-starred foil IS listed"
  - "starred_listed == false          # THE NARROWING: the starred asset is excluded"
  - "final_search contains 'favorites=no'   # the URL was not rewritten away by Search.tsx's mirror"
  # The wire contract behaves as specified (this half is expected to PASS — it is the control that drifts).
  - "'p396plain' in api_negative_names"
  - "'p396starred' not in api_negative_names"
  - "'p396plain' in api_absent_names and 'p396starred' in api_absent_names   # absent != false"
cleanup:
  - kind: rest
    method: DELETE
    path: /api/favorites/DATA_ENTITY/{id_of_p396starred}
  - kind: docker-compose-down
    destroy_volumes: true
