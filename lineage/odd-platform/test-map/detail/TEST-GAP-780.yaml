proposed_action: |-
  Add `PostgreSQLSessionHousekeepingLeaderElectionRegressionPinTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/session/`. One test method asserting the absence:

  1. `housekeepingJob_runsOnEveryInstance_pinsAbsenceOfSchedulerLock` — instantiate `PostgreSQLSessionHousekeepingJobHandler` reflectively; verify the class's `runHousekeeping` method has NO `@SchedulerLock` annotation in its annotation set. The test passes against the current code AND will fail after the fix is applied, prompting an explicit update.

  2. `housekeepingJob_underMultiInstance_runsNTimesNotOnce_pinsLoadAmplification` — `@SpringBootTest` two ApplicationContexts in the same JVM sharing a Testcontainers PG; trigger `runHousekeeping()` on both; assert the DELETE SQL was executed TWICE (e.g., via P6Spy-style query interceptor counting). Confirms the load-amplification path.

  Add a `// ARCHITECTURAL-INCONSISTENCY-PIN — PostgreSQLSessionHousekeepingJobHandler is the sole @Scheduled job in the codebase without @SchedulerLock. Multi-instance deployments multiply DB load. This test pins the current absence until REFACTOR-NNN adds the annotation aligning with the platform pattern.` comment block.

  Pair with: (a) REFACTOR-NNN — add `@SchedulerLock(name = "sessionHousekeepingJob", lockAtLeastFor = "PT55M", lockAtMostFor = "PT55M")` to PostgreSQLSessionHousekeepingJobHandler.java; (b) live-doc update if the inconsistency persists for any reason (it should not — this is the cheapest fix in the codebase).
