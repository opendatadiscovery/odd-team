proposed_action: |-
  Add `SecurityConstantsVsOpenAPIPathPatternConformanceTest`. Build-time test:

  1. Load `SecurityConstants.SECURITY_RULES` via reflection → Map<HttpMethod+PathPattern, RequiredPermission>.
  2. Parse OpenAPI spec → List<HttpMethod+Path>.
  3. For each SECURITY_RULES entry, run Spring's `PathPattern.matches(specPath)` against every spec path; assert AT LEAST ONE match.
  4. Today the test FAILS on `(POST, /term)` (singular — matches ZERO spec paths) AND `(DELETE, /term/{term_id})` (singular). Each failure is REFACTOR-217's primary-source confirmation.
  5. The test ALSO surfaces any OTHER similar drift the audit hasn't caught yet — the maintainer triages each at first run.

  **Pair-test with TEST-GAP-017**: that entry pins the BEHAVIORAL test (anonymous-caller-can-link-term-returns-200 instead of 403); this entry pins the STRUCTURAL test (the path-pattern would never match in the first place).

  Coherence note (LSN-018 Rule 6): NET-NEW (spec-side complement). DOES NOT contradict TEST-GAP-017 — they pin different test types for the SAME root cause. STRENGTHENS REFACTOR-217 by adding the structural-fix layer alongside the existing behavioural layer. STRENGTHENS DOC-GAP-099 (spec-drift META) by adding the PATH-MISMATCH axis to the 5-shape drift family.
