behaviour: |-
  **MEDIUM — Lineage dispatcher branch logic has zero tests. The single decision point between F-005 (HierarchyLineage) and F-016 (DEGLineage) is structurally untested.** Lineage.tsx is a 28-line pure dispatcher with NO state, NO useEffect, NO useState — every render is a pure function of `(dataEntityId, isDEG, isLoaded)`. Despite the simplicity, ZERO tests pin the contract.

  **The four highest-leverage test gaps at this dispatcher**:
  1. **Branch logic regression** — a refactor that accidentally flips `isDEG === true ? ... : ...` to `isDEG === false ? ... : ...` ships silently. The dispatcher mounts the WRONG subtree for every entity.
  2. **Render-null guard removal** — a refactor that removes `if (!isLoaded) return null;` ships silently. The subtree mounts before `entityClasses` resolves, defaulting to HierarchyLineage (because `isDEG=false` on undefined classes) even for DEGs.
  3. **jotai-Provider scope** — a refactor that mounts the jotai Provider OUTSIDE the DEG branch (e.g. at the shell layer) changes jotai state lifetimes silently. The DEG-side atom state could leak across mounts.
  4. **NaN dataEntityId** — covered separately by TEST-GAP-849.

  **Single highest-value test**: A `Lineage.test.tsx` that snapshots three states:
  - `(isLoaded=false) → null`
  - `(isLoaded=true, isDEG=true) → DEGLineageAtomProvider+DEGLineage`
  - `(isLoaded=true, isDEG=false) → HierarchyLineage`

  **A 30-line test pins the entire dispatcher contract.** This is the cheapest-to-write, highest-leverage test in the Lineage subsystem.

  **Why MEDIUM**:
  - **Single-decision-point regression risk** — the cost of a silent branch-logic flip is high (wrong subsystem mounts for every Lineage view)
  - **Easy to write** — 30 lines, no Testcontainers needed, no mock infrastructure beyond Redux + Router
  - **High coverage per line** — the test pins 4 distinct invariants in one file
  - **Forward-compatible** — adding a third branch (e.g. MicroserviceLineage per TEST-GAP-850) requires updating this test
