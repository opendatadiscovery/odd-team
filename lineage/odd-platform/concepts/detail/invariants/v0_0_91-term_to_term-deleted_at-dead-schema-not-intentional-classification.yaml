description: |-
  NEW INVARIANT, batch 2026-05-20U — STRENGTHENS the existing
  term-to-term-deleted-at-schema-drift-v0_0_76-vs-v0_0_91 invariant
  (batch N) by resolving the previously-open interpretation ambiguity.
  The master invariant enumerated TWO possible interpretations:
    (a) The column is dead schema — V0_0_91 was authored before V0_0_76's
        hard-delete commitment had crystallised; the column should have
        been omitted; cleanup migration is the correct fix.
    (b) The application code is missing the filter — V0_0_91 deliberately
        retained the column as forward-compat for a future term-to-term
        soft-delete feature; the application code SHOULD filter and was
        just under-implemented.

  Batch U primary-source evidence from TermServiceImpl + TermController
  RESOLVES this in favour of interpretation (a) — DEAD SCHEMA from
  MISSED MIGRATION.

  THE NEW EVIDENCE (TermServiceImpl batch U sidecar — primary source):

    Verification at TermRelationsRepositoryImpl.java:204-219 +
    222-230 — the two methods that mutate term_to_term:

      deleteTermToTermRelations (lines 204-219) — invokes
      DSL.delete(TERM_TO_TERM) — a HARD DELETE, not a soft-delete.

      deleteTermToLinkedTermRelation (lines 222-230) — invokes
      DSL.deleteFrom(TERM_TO_TERM) — also a HARD DELETE.

    Verification by Grep: grep -rn 'TERM_TO_TERM\.DELETED_AT' across
    odd-platform-api/src/main/java returns ZERO matches. No code path
    in the entire backend WRITES to TERM_TO_TERM.DELETED_AT. The
    deleted_at column is structurally orphaned — neither the platform's
    own soft-delete pathway nor any service-tier write touches it.

  THE INTENT DISAMBIGUATION:

    Interpretation (a) — DEAD SCHEMA from MISSED MIGRATION:
      The maintainer authoring V0_0_91 most-likely copy-pasted from
      V0_0_35's data_entity_to_term template (which DID have deleted_at
      at line 50 of V0_0_35__add_terms.sql) and OMITTED to apply
      V0_0_76's post-cleanup pattern. The intent visible at V0_0_76
      was 'link tables are hard-delete only — soft-delete is reserved
      for first-class entities'; V0_0_91 reverted this without explicit
      justification.

    Interpretation (b) — UNDER-IMPLEMENTED SOFT-DELETE:
      Would require a code path somewhere WRITING to TERM_TO_TERM.DELETED_AT.
      Grep verifies NO such path exists. Would require a service-tier
      design decision documenting the soft-delete intent. NO such
      design document is referenced in the code or schema.

  The Grep + the hard-delete evidence FALSIFY interpretation (b) AS A
  LIVE INTENT — no soft-delete feature is partially implemented; no
  staging code is being held aside for completion; the column is
  structurally unused.

  THIS DOES NOT RULE OUT (b) AS A FUTURE INTENT — a maintainer COULD
  add a soft-delete feature in the future and would re-introduce the
  question of filtering at the 7 read sites. But the CURRENT-STATE
  classification is: DEAD SCHEMA. The fix is interpretation (a)'s
  cleanup migration:

    DELETE FROM term_to_term WHERE deleted_at IS NOT NULL;
    ALTER TABLE term_to_term DROP COLUMN IF EXISTS deleted_at;

  THIS REFINES THE SEVERITY:

    The master invariant rated severity HIGH because the gap was
    AUTHORIZATION-EQUIVALENT — a soft-delete signal the application
    silently ignores creates the same shape of bug as
    policy-getRolesPolicies-missing-deleted_at-filter (orphan-binding
    permission leak via missing filter). Under interpretation (a) the
    gap is REDUCED — the column is dead, the failure mode is
    THEORETICAL (no current code writes deleted_at; no current bug
    surfaces). Severity MEDIUM is more accurate under the disambiguation:
      - Architectural-hygiene concern (correct).
      - Forward-compat trap if a future maintainer reads the schema
        and infers soft-delete intent (correct).
      - Active runtime bug (NO — no code writes deleted_at).

    The remediation is one ALTER TABLE migration that closes the
    interpretation ambiguity permanently and prevents a future
    maintainer from accidentally building soft-delete on top of the
    dead column.

  WHY THIS CLASSIFICATION MATTERS FOR THE MAINTAINER'S DOC-NNN QUEUE:

    Under interpretation (b), the doc-side admission would be 'document
    the term-to-term schema asymmetry so operators inspecting the DB
    directly understand the read-path does not honour deleted_at'.
    Under interpretation (a), the doc-side admission is NOT NEEDED —
    the cleanup migration removes the asymmetry entirely. The DOC-NNN
    item flips from 'document the gap' to 'no documentation gap once
    the cleanup ships'.

  CROSS-CHECK WITH THE PLATFORM'S OTHER SCHEMA-DRIFT FAILURES:

    Schema-drift family across batches H + N + R + U:
      - policy.getRolesPolicies missing deleted_at filter (batch H —
        orphan-binding permission leak) — INTERPRETATION: filter bug,
        column is live and used elsewhere.
      - role.getDto / listDto / getByName missing deleted_at on POLICY
        join (batch N) — INTERPRETATION: filter bug, column is live
        on POLICY side.
      - V0_0_91 term_to_term.deleted_at (batch N original — batch U
        disambiguation) — INTERPRETATION: dead schema, column was
        added in error and is structurally unused.
      - activity.data_entity_id NOT NULL FK (batch R — F-006 audit
        silence schema-rooted) — INTERPRETATION: deliberate schema
        choice; the FK is the load-bearing structural commitment.

    The four schema-related findings span the spectrum: live-but-not-filtered
    (the master pattern) → live-but-deliberate (activity FK) →
    dead-and-orphaned (term_to_term deleted_at). Each requires a
    different remediation. This invariant classifies V0_0_91 deleted_at
    explicitly as dead-and-orphaned.

  SEVERITY MEDIUM — downgraded from HIGH on the master invariant. The
  master invariant's HIGH severity covered the worst-case interpretation;
  the disambiguation evidence shows the worst case is not the actual
  case. The architectural-hygiene concern remains; the runtime gap
  does not.
