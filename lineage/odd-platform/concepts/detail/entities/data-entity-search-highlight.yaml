name: DataEntitySearchHighlight (FTS field-match markup)
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
  - P-01
description: |-
  NEW ENTITY, batch ZE — the per-entity match-highlight payload
  surfaced via GET /api/search/{search_id}/data_entities/{data_entity_id}/highlights.
  Returned by SearchController.highlightDataEntity. Carries the
  entity's searchable fields with `<b>...</b>`-marked positions
  where the FTS query matched.

  IMPLEMENTATION: DataEntityHighlightServiceImpl.java:26-46 zips
  three reactive sources (search session row + data entity
  searchable fields + latest dataset version) and invokes
  ReactiveDataEntityRepositoryImpl.getHighlightedResult(text,
  query) which builds a raw SQL string via
  `ts_headline('english', '%s', to_tsquery('%s'), 'HighlightAll=true')`
  .formatted(text, tsQuery) at line 798-806.

  TRUE SQL-INJECTION VECTOR (cross-link batch H + this batch's
  SearchController class sidecar) — both `text` (catalog-supplied
  entity searchable string) and `tsQuery` (user-derived from
  persisted session query) are interpolated WITHOUT parameterised
  binding. A crafted query [exploit payload withheld from this
  public workspace - private advisory GHSA-rjp9-9vgm-q94c]
  is persisted and detonates on every subsequent highlight call.
  Cross-link: the get-headline-formatted-sql-injection invariant
  is the canonical write-up of the bug; this entity is the
  RESPONSE-SHAPE concept the bug ships.

  Same `getHighlightedResult` code path is what the
  `tsquery-operator-injection-via-persisted-state` invariant flags
  at the DoS layer — the highlight path additionally has the
  SQL-injection vector via `.formatted()` direct interpolation.
