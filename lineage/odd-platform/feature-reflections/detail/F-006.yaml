        section: owner_to_role_hard_delete_closes_orphan_binding
        cite: "OwnerServiceImpl.java:97 + ReactiveOwnerToRoleRepositoryImpl.java:52-56"
        note: "Hard-delete of owner_to_role rows — the binding is physically removed on owner delete."
      - sidecar: '(test) OwnerRoleStripKnownBugTest.java'
        section: "@pins PLT-066"
        cite: "OwnerServiceImpl.java getRoleIdsList + deleteOwnerRelationsExcept(owner.getId(), newRoles)"
        note: "ADJACENT pin (the same deleteOwnerRelationsExcept primitive) but on the PUT-omitted-roles bug, NOT the owner-delete revocation — so it does not verify THIS promise."
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown        # "owner deletion fully revokes the owner's role-derived access"
    coverage: unverified           # confirmed-but-untested (Rule 11): no test asserts deleteOwner removes owner_to_role + revokes
    test_demand: functional        # THE FIX: hand-proven positive behaviour with no guard -> highest-value test to write
    confirmed_note: |
      Routes to caveat-candidate NOT because it is broken but because the asymmetry
