behaviour: |-
  **Search debounce + search-clear race unit gap.** PolicyList.tsx:52-57 wraps `useDebouncedCallback(() => dispatch(fetchPolicyList(...)), 500)` to debounce search by 500ms. Lines 39-41 fire `fetchPolicyList({page:1, size:100})` on the empty-query effect. When the user types a search term then clears it within 500ms, BOTH dispatches are inflight: (a) the debounced search dispatch with the stale query, (b) the effect-driven empty-query dispatch. The slice's `fetchPolicyList.fulfilled` reducer (policy.slice.ts:29-40) handles whichever resolves second via `setAll` (page === 1 path). The order of resolution is not deterministic; the 500ms debounce makes it rare but not impossible. No test asserts (a) the debounce coalesces 6 keystrokes within 500ms into ONE dispatch; (b) Enter-key bypasses the debounce or fires immediately; (c) the search-clear race resolves correctly — empty-query result eventually wins because the no-query result replaces via `setAll`. Regression: a refactor removing the `(!query)` guard at line 40 would cause the effect to fire on every render where `query` is empty, doubling fetches; a refactor changing the debounce interval would slip through.
