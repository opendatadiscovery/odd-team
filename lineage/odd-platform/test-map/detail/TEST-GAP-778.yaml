behaviour: |-
  **CRITICAL (cross-cutting) — NO integration test exists that verifies each of the four `auth.type` modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP) produces the EXPECTED authorization-framework wiring posture AND the EXPECTED authority for an authenticated user.** This is the systemic absence underlying every per-mode CRITICAL pin (TEST-GAP-140, TEST-GAP-141, TEST-GAP-774, TEST-GAP-149) — none individually catches the cross-mode quartet contract.

  **The four-mode quartet contract** (assembled from the four sidecars):
  | auth.type | AuthorizationCustomizer | Authority for authed user | RBAC enforced? | Cookie expiry | Test coverage |
  |---|---|---|---|---|---|
  | DISABLED | NOT wired | every request bypassed, no auth | NO (read-collaborative wide-open) | n/a (no session) | ZERO |
  | LOGIN_FORM | NOT wired | ADMIN (hardcoded, every user) | NO (wide-open) | never expires | ZERO |
  | OAUTH2 | wired (line 98) | per-OIDC-claim from `ODD_USER_ROLE_CLAIM` | YES | never expires | ZERO |
  | LDAP | wired (line 145) | per-LDAP-attribute extraction | YES | never expires | ZERO |

  The compound finding is the ASYMMETRY: OAUTH2 + LDAP wire the authorization framework, LOGIN_FORM + DISABLED do not. A maintainer adding `.authorizeExchange(new AuthorizationCustomizer(...))` to LOGIN_FORM "to match OAuth/LDAP" silently flips the posture from wide-open (intentional per docs) to RBAC-enforced — breaking existing deployments. A maintainer REMOVING the customizer from OAUTH2 "to simplify" silently flips it from RBAC to wide-open. No test catches either change.

  **Cross-reference to the per-mode pins** (already cataloged but isolated):
  - TEST-GAP-140 + TEST-GAP-774 (LOGIN_FORM no AuthorizationCustomizer)
  - TEST-GAP-141 (LOGIN_FORM ADMIN-for-every-user)
  - TEST-GAP-148 (OAUTH2 bean-graph contract — NO test asserts AuthorizationCustomizer is wired)
  - TEST-GAP-149 (S2S composes with all three interactive modes producing ADMIN)
  - TEST-GAP-3212 / batch H DISABLED mode read-collaborative posture pin

  **What the quartet test catches that none of the above does in isolation**:
  - A future refactor moving authorization wiring into a shared utility class (well-intentioned dedup) that silently changes the OAUTH2 + LDAP behaviour while leaving LOGIN_FORM/DISABLED untouched.
  - A future change to `SecurityConstants.WHITELIST_PATHS` that breaks LOGIN_FORM's HAND-ROLLED permittedPaths divergence (line 49-51 vs SecurityConstants.java:95-96 — confirmed-divergent in the sidecar; see also TEST-GAP-147).
  - A future change to `GrantedAuthorityExtractor.getAuthorities(isAdmin)` semantics — LOGIN_FORM hardcodes `true`, OAUTH2 + LDAP compute per-user, DISABLED never calls it.
  - A `Provider.java` enum addition (e.g., adding OKTA, KEYCLOAK) that needs handler registration in OAuth2 mode but should not affect the other three modes — this test confirms each mode's bean graph is independent.

  **Test gap shape**: parametrised `@SpringBootTest` running 4 boot cycles (one per `auth.type`), each asserting THE SAME contract:
  1. Exactly ONE `SecurityWebFilterChain` bean is registered.
  2. `AuthorizationCustomizer` bean presence matches the expected mode (present in OAUTH2/LDAP; absent in LOGIN_FORM/DISABLED).
  3. An authenticated user's `SecurityContext.getAuthentication().getAuthorities()` matches the expected pattern (ADMIN-hardcoded for LOGIN_FORM; per-OIDC-claim for OAUTH2; per-LDAP-attribute for LDAP; bypassed for DISABLED).
  4. A request to an RBAC-gated endpoint (e.g., `POST /api/permissions/{id}/policies`) without the gating permission returns 200 (LOGIN_FORM/DISABLED — wide-open) or 403 (OAUTH2/LDAP — RBAC-enforced).
  5. The five permit-all paths (`/actuator/health`, `/favicon.ico`, `/ingestion/entities`, `/ingestion/datasources`, `/api/slack/events`) are reachable WITHOUT authentication under each mode (compatibility floor).
