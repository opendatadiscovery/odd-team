gap_id: TEST-GAP-937
category: missing-integration
criticality: HIGH
node_ids:
  - 'odd-platform java RoleController controller-class:RoleController'
  - 'odd-platform java PolicyController controller-class:PolicyController'
surfaced_by:
  - 'odd-platform__java__RoleController__controller-class__RoleController.md:invariants.[1]'
  - 'odd-platform__java__RoleController__controller-class__RoleController.md:bugs_limitations_corner_cases.[0]'
  - 'odd-platform__java__PolicyController__controller-class__PolicyController.md:invariants.[2]'
  - 'odd-platform__java__PolicyController__controller-class__PolicyController.md:bugs_limitations_corner_cases.[0]'
behaviour: |-
  **CLASS-WIDE STATUS-CODE DRIFT — six of the eight POST/PUT mutation endpoints
  across the RBAC controller family return HTTP 200 OK while the OpenAPI spec
  declares 201 Created.** RoleController.createRole (line 24) returns 200 vs
  spec 201 (openapi.yaml:3629); RoleController.updateRole (line 42) returns
  200 vs spec 201 (openapi.yaml:3656); PolicyController.createPolicy (line 24)
  returns 200 vs spec 201 (openapi.yaml:3528); PolicyController.updatePolicy
  (line 49) returns 200 vs spec 201 (openapi.yaml:3566). DELETE endpoints
  return 204 matching spec; GET endpoints return 200 matching spec — only the
  POST/PUT pair drifts. A generated TypeScript/Java/Python client compiled
  from openapi.yaml treats 200 as an unexpected status on these endpoints and
  parses the response into the unhappy path. The bundled UI tolerates this
  (inspects body, not status) but external SDKs do not. Same drift extends to
  OwnerController (TEST-GAP-235), TagController (TEST-GAP-764) — class-wide
  inconsistency on RBAC CRUD.
test_class: integration
test_files_existing: []
test_files_proposed:
  - path: 'odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/OpenAPIStatusCodeConformanceTest.java'
    name: 'allPostAndPutEndpoints_actualStatusCodeMatchesOpenAPIDeclaration'
evidence:
  - 'RoleController.md says: "Status-code drift on POST /api/roles AND PUT /api/roles/{role_id} — code returns 200, OpenAPI spec declares 201. Two of the four endpoints disagree with the spec. Generated TypeScript / Java / Python clients compiled from openapi.yaml:3601-3679 expect 201 as the success branch for both mutation creates/updates; the actual 200 is parsed as an unexpected status"'
  - 'PolicyController.md says: "openapi.yaml:3528 declares 201: The resource has been successfully created for POST /api/policies; PolicyController.createPolicy (line 24) returns ResponseEntity.ok() (HTTP 200). openapi.yaml:3566 declares 201: The resource has been successfully modified for PUT /api/policies/{policy_id}; PolicyController.updatePolicy (line 49) returns ResponseEntity.ok() (HTTP 200). Both create and update endpoints have a 200-vs-201 response-code drift between code and spec"'
  - 'RoleController.java:24, 42 + PolicyController.java:24, 49 + openapi.yaml:3528, 3566, 3629, 3656'
cross_references:
  - 'TEST-GAP-216 (RoleController POST drift — STRENGTHENS at class level)'
  - 'TEST-GAP-227 (PolicyController POST drift — STRENGTHENS at class level)'
  - 'TEST-GAP-235 (OwnerController POST drift — sibling)'
  - 'TEST-GAP-624 (Owner UPDATE drift — sibling)'
