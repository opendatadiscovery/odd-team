proposed_action: |-
  WebTestClient integration test, three sub-cases. (a) Sub-case (i) — DEG ID does not exist: GET /api/dataentitygroups/99999999/lineage; assert HTTP 404 with body containing 'Data entity group' and 'doesn't exist'. (b) Sub-case (ii) — non-DEG-typed entity: create a Dataset entity D (not a DEG); GET /api/dataentitygroups/D.id/lineage; assert HTTP 404 with the IDENTICAL body. (c) Sub-case (iii) — DEG with no members: create empty DEG E; GET /api/dataentitygroups/E.id/lineage; assert HTTP 404 with the IDENTICAL body. (d) Test comment 'LOCKS the 404-conflation contract as of 2026-05-19. If a future refactor splits any of the three conditions (e.g. returns 200 [] for empty DEG, or 422 for wrong-type), this test FLIPS to expect the new contract on the specific case.' This is a contract-pinning test that documents the deliberate conflation.
