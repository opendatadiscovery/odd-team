terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Renders the header row. No direct backend side-effect from the
    composer; each dialog / form / button trigger has its own write
    path (InternalNameFormDialog → PUT business name; DataEntityGroupForm
    → PUT group membership; EntityStatus selection → PUT status;
    CreateMessageForm → POST message). The composer's render side-effect
    IS the operator-observable outcome (the header surface).
  evidence: DataEntityDetailsHeader.tsx — entirely render logic
  cardinality_per_call: 1 per page render
