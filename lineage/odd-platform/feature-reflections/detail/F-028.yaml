- id: H-005
  hypothesis: "When a namespace is deleted and then a namespace is created again with the same name, the create succeeds and the new namespace is a fresh entity (new id, fresh history)."
  derivation: "Partial unique index WHERE deleted_at IS NULL deliberately enables delete-then-recreate (soft-delete reincarnation); implicit ADR."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      Delete sets deleted_at = NOW() (soft-delete via ReactiveAbstractSoftDeleteCRUDRepository:50-59); the
      partial unique index only constrains rows WHERE deleted_at IS NULL, so the deleted row no longer
      participates and a same-name create succeeds with a NEW id. This behaviour is DIRECTLY asserted by a
      repository integration test that creates, deletes, recreates, and asserts the second id differs from
      the first and the first row's deleted_at is non-null.
    evidence:
      - sidecar: odd-platform__java__NamespaceController__controller-class__NamespaceController
        section: implicit_adrs[3] + concepts.invariants[5]
        cite: "V0_0_31__add_deleted_at_field.sql:25 + ReactiveAbstractSoftDeleteCRUDRepository.java:50-59"
        note: "partial unique index + soft-delete = reincarnation by design."
      - sidecar: source_read_for_validation
        section: repository integration test
        cite: "NamespaceRepositoryImplTest.java:85-100 (testCreateNamespacePojoAfterDeletingIt)"
        note: "Read this validation (Rule 8 exception): asserts new id + non-null deleted_at on the old row. The reincarnation MECHANIC is verified."
    severity: null
    confidence: HIGH
    routes_to_finding: none
    use_case_kind: resolve-later
    coverage: verified
    test_ref: "NamespaceRepositoryImplTest.testCreateNamespacePojoAfterDeletingIt:85-100"
    test_demand: none
