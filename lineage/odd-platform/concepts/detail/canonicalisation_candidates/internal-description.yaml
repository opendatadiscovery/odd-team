proposed_canonical: Internal Description
rationale: upsertDataEntityInternalDescription introduces 'Internal Description' as
  a distinct concept from 'Description' (the external/ingested description owned by
  the collector pipeline). The docs may name this just 'Description'; the code distinguishes
  Internal vs External via separate columns. Surface to maintainer for vocabulary
  extension.
contributing_concepts:
- Internal Description (Markdown body)
- data_entity.internal_description
suggested_add_to_docs: true
rationale_for_distinction: External description is sourced from ingestion (collector
  pipeline); internal description is operator-authored via the UI Markdown body. Two
  separate write paths, two separate columns, two separate audiences.
