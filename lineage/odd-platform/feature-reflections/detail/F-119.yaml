- id: H-006
  hypothesis: "When an operator INTENDS to enable authentication but typos auth.type (e.g. `OUATH2` for `OAUTH2`), the platform either fails to start or clearly signals the misconfiguration — it does NOT silently run wide-open while the UI behaves as though auth is healthy."
  derivation: "Negative-space + endpoint-shape — auth.type is round-tripped with no @Value default and no enum validation at the backend (AppInfoController.java:18) and no validation at the UI string-compare (Overview.tsx:26)."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      A typo'd auth.type (`OUATH2`) is injected verbatim by `@Value("${auth.type}")` with no
      default and no enum constraint; EVERY `@ConditionalOnProperty(havingValue=...)` then fails
      to match, so NO SecurityWebFilterChain bean is wired (no boot fail-fast, no WARN — the
      DisabledAuthSecurityConfiguration itself is `@Slf4j`-less and silent). /api/appInfo echoes
      `OUATH2` back. The UI's gate `Boolean(appInfo?.authType && appInfo.authType !== 'DISABLED')`
      evaluates TRUE for `OUATH2`, so the home page RENDERS the OwnerAssociation card as if auth
      were healthy — on a deployment that actually has no security chain wired. The two layers'
      missing validation COMPOUND: the backend doesn't catch the typo and the UI doesn't catch
      the backend's silence. (Empty `AUTH_TYPE=` is the mirror failure: gate evaluates FALSE,
      card HIDDEN as if DISABLED were intended, masking the same broken-chain deployment.)
    evidence:
      - sidecar: odd-platform__java__AppInfoController__controller-class__AppInfoController.md
        section: bugs_limitations_corner_cases[0,1]
        cite: "AppInfoController.java:18 + the four @ConditionalOnProperty(havingValue=...) configs"
        note: "No @Value default, no enum validation; typo/empty silently produces no SecurityWebFilterChain."
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: bugs_limitations_corner_cases[0]
        cite: "Overview.tsx:25-27"
        note: "String-equality gate renders OwnerAssociation TRUE for any non-DISABLED string incl. typos; FALSE for empty — both wrong vs operator intent, no diagnostic."
      - sidecar: odd-platform__java__DisabledAuthSecurityConfiguration__config-key-consumer__auth_type@L10.md
        section: bugs_limitations_corner_cases[1,6]
        cite: "DisabledAuthSecurityConfiguration.java:1-19 (no @Slf4j) + :10 (no matchIfMissing)"
        note: "Silent boot; no WARN; missing-key/typo produces no bean from any of the four configs."
    operator_visible_failure: |
      (1) An operator who deploys with `auth.type: OUATH2` believing they enabled OAuth sees a
      home page that shows the self-service Owner-Association card (the screen LOOKS like a
      healthy authenticated deployment) while the platform actually serves every endpoint
      unauthenticated — the worst silent security failure, with the UI actively reassuring the
      operator that auth is on. (2) An operator who clears `auth.type` (empty) sees the
      Owner-Association card disappear as if they had chosen DISABLED, masking that the security
      chain is unwired for a non-DISABLED reason. (3) In both cases there is no boot WARN, no
      toast, no fail-fast — the operator's only signal is the (misleading) UI state. This is the
      LSN-001 class: an insecure outcome an operator inherits without realising.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

