        section: bugs_limitations_corner_cases[1]
        cite: "ReactiveDataEntityRepositoryImpl.java:909-939"
        note: "cteDataEntitySelect omits the EXCLUDE_FROM_SEARCH predicate that 9+ other sites apply."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: concepts.invariants[3]
        cite: "JooqFTSHelper.java:149 + ReactiveDataEntityRepositoryImpl.java:974"
