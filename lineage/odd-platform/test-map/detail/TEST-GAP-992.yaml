proposed_action: |-
  Add `DatasetFieldResponseCodeDriftTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `putDatasetField_threeMutationEndpoints_returnHTTP200_pinsSpecCodeDrift` — for each of /description, /name, /tags PUT endpoints, submit a valid request; assert HTTP 200 (NOT 201). PIN the current drift.
  2. `postDatasetField_enumValues_returnsHTTP201_baselineNonRegression` — submit a valid POST /enum_values; assert HTTP 201. Verifies the spec-aligned shape (so the test class as a whole isolates the drift).
  3. `openApiSpec_declaresResponseCode201_forThreePUTEndpoints_pinsSpecContract` — parse the OpenAPI spec at build/runtime; assert the three PUT endpoints declare 201 in their responses block. PIN that the spec hasn't drifted to match the code.

  Pair with REFACTOR-NNN: pick a source-of-truth (spec or code) and align. The natural choice: SPEC wins (matches the POST endpoint behaviour). Change `ResponseEntity::ok` → `ResponseEntity::created` at the three PUT sites. When the fix lands, test 1 inverts to 201.
