name: List My Owned Data Entities
canonical_in_docs: true
canonical_candidate: false
description: 'GET /api/dataentities/my — returns Flux<DataEntityRef> of entities owned
  by the calling principal''s resolved Owner. The PRIMARY-SOURCE owner-scoped read:
  controller takes NO principal parameter; principal flows via reactor Context → AuthIdentityProvider.fetchAssociatedOwner
  → user_owner_mapping → JOIN OWNERSHIP. Sibling variants: getMyObjectsWithUpstream/Downstream
  expose the lineage-reachable (NON-owned) subgraph.'
nodes:
- odd-platform java DataEntityController controller-method:getMyObjects
contributing_files:
- odd-platform__java__DataEntityController__controller-method__getMyObjects.md
evidence:
- getMyObjects.md:concepts.operations[*]
- getMyObjects.md:implicit_adrs.[0] (ADR-CANDIDATE-015 primary source)
- getMyObjects.md:implicit_adrs.[3] (lineage-variant non-owned-but-reachable semantic)
axes_present:
- controllers
- openapi_paths
- ui_routes
security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: No SecurityRule entry, no @PreAuthorize. Falls through to .authenticated().
      Owner-scoping enforced inside the SQL JOIN, not at the gate.
  owner_scoping:
    verdict: RESPECTS
    detail: JOIN OWNERSHIP WHERE OWNER_ID = ? at ReactiveDataEntityRepositoryImpl.java:526-527
  strengths:
  - Owner-scoping is a JOIN-side concern (defence-in-depth at the SQL layer)
  - Stateless controller — horizontally scalable
  weaknesses:
  - Silent empty Flux for unlinked user (no 401/403/404 — information-quality issue)
  - 'Lineage variants (Upstream/Downstream) have single-point-of-failure: no JOIN-side
    owner filter on the response'
  - Page=0 produces negative SQL offset → 500 instead of 400
  - Unbounded size param → insider DoS vector
