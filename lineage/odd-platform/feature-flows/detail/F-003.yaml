control_summary: |-
  2 of 4 cells PROBED — integration (PROBED-PINNING-BUG) + security (PROBED-PINNING-BUG).
  Batch-H adds primary-source SQL confirmation (cteDataEntitySelect 909-939,
  listPopular line 633) + surfaces the wider 9-list-shape inconsistency (only
  one of 9 paths is empirically probed; the rest remain GAP). Batch-I confirms
  the 1-line pass-through at the service tier (DataEntityServiceImpl.listPopular
  lines 227-231) — no defence added at orchestration; the F-001/F-003 inflation
  loop closes cleanly through this service. Batch-J adds UI-side realisation:
  the Popular surface is the FOURTH COLUMN inside OwnerEntitiesList.tsx (NOT a
  standalone PopularStrip component — sidecar understanding), click-through
  navigates to Overview tab (NOT Structure as docs claim — NEW doc drift),
  DISABLED-mode hides the entire Recommended panel (CONTRADICTS docs — NEW
  doc drift), and the API surface omits view_count from the 9-field projection
  (ranking is opaque). The 1-shot-mount fetch with no refresh cadence (sidecar
  implicit_adrs[0]: useEffect with [] deps array) means Redux acts as the
  SPA-session cache for the popular list. Three NEW doc-gap candidates surface
  this batch.
