notes: |-
  Doc-gap invariant — surfaces a DOC-NNN follow-up. The fix is a
  one-paragraph caveat on each of two doc pages (dashboard.md +
  data-quality.md) disclosing the read-collaborative posture explicitly.

  Sibling pattern: every per-dataset DQ read endpoint exhibits the same
  silence (DataQualityController sidecar's docs_link_semantic). A more
  systemic fix would be a single "Access Control on Data Quality
  Surfaces" section in the pillar landing page that all sub-pages cross-
  link to — captures the read-collaborative posture once for all DQ
  surfaces. Worth flagging in a future docs-coherence sweep.
