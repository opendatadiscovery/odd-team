name: Policy (Authorization)
canonical_in_docs: true
canonical_candidate: false
description: 'A named JSON document of `statements` over resource types `DATA_ENTITY
  | TERM | QUERY_EXAMPLE | MANAGEMENT` granting specific `permissions` or the `ALL`
  wildcard. Policies are validated server-side against `schema/policy_schema.json`
  (JSON Schema V201909) at every create + update; the persisted text column is always
  schema-valid. A Policy is inert until bound to a Role via `role_to_policy`. The
  seeded `Administrator` policy is reserved by name on UPDATE + DELETE (PolicyServiceImpl.java:76,
  87) but NOT on CREATE (PolicyServiceImpl.java:62-69 — name-asymmetry invariant).
  Authorization gate on CREATE is `POLICY_CREATE` (MANAGEMENT tier) wired in SECURITY_RULES
  line 163-164, **bypassed under `auth.type=DISABLED`**. **Batch H adds the SQL primary-source
  persistence layer** via ReactivePolicyRepositoryImpl — 40-line shell that adds exactly
  ONE method (`getRolesPolicies`, the policy-by-role JOIN used to resolve current
  user effective policies on EVERY authorized request) and inherits standard CRUD
  from `ReactiveAbstractSoftDeleteCRUDRepository`. **Soft-delete uses deleted_at timestamp**,
  enforced via partial unique index `policy_name_unique ON policy(name) WHERE deleted_at
  IS NULL` (V0_0_55__add_policies_and_roles.sql:30) — the soft-delete-aware-recreation
  invariant operators rely on. **NEW HIGH-severity gap (batch H)**: `getRolesPolicies`
  at lines 32-35 does NOT filter `deleted_at IS NULL` — a soft-deleted policy with
  surviving role_to_policy bindings continues to confer permissions; PolicyServiceImpl
  defends only at the cascade-delete check (lines 89-92); any DB-direct UPDATE setting
  deleted_at, schema migration mistake, or future refactor weakening the cascade re-opens
  the gap. The fix is one line: AND policy.deleted_at IS NULL in the JOIN. Canonical
  doc anchor: `configuration-and-deployment/enable-security/authorization/policies`
  (200, 2026-05-12).'
axes_present:
- controllers
- repositories_reactive
nodes:
- odd-platform java PolicyController controller-method:createPolicy
- odd-platform java PermissionController controller-method:getResourcePermissions
- odd-platform java repository reactive repository:ReactivePolicyRepositoryImpl
contributors:
- 'PolicyController.createPolicy: entities[Policy, PolicyFormData (name + policy JSON
  string), PolicyDetails, PolicyPojo, PolicyStatementDto, PolicyPermissionDto, PolicyTypeDto];
  operations[create-policy, validate-policy-json-schema, persist-policy, return-policy-details]'
- 'PermissionController.getResourcePermissions: PolicyDto (the materialised policy
  graph evaluated at the read-side); the resolver flattens roles → policies → statements
  identical to the mutation enforcer'
- 'ReactivePolicyRepositoryImpl (batch H): entities[PolicyPojo, PolicyRecord, POLICY
  jOOQ table, ROLE_TO_POLICY jOOQ table, policy_name_unique partial unique index,
  Role (referenced via ROLE_TO_POLICY.ROLE_ID, not loaded here)]; operations[getRolesPolicies
  (the per-request authorization hot path — JOIN policy ⋈ role_to_policy filtered
  by role_id list), inherited create / update / get / list / delete / bulkCreate /
  bulkUpdate from ReactiveAbstractSoftDeleteCRUDRepository, soft-delete writes ONLY
  deleted_at timestamp (NOT is_deleted boolean — that column is functionally dead
  schema)]; 5 ADRs (soft-delete via deleted_at timestamp consistent with every CRUDable
  platform entity; partial unique index on (name) WHERE deleted_at IS NULL enables
  soft-delete-aware-recreation; ExceptionUtils.translateDatabaseException centralised
  unique-constraint-to-UniqueConstraintException translation; repository is policy-AGNOSTIC
  — all business invariants live at PolicyServiceImpl; is_deleted boolean DDL column
  is dead schema — base only writes deleted_at). PolicyServiceImpl is the sole non-test
  caller (8 distinct call sites at lines 47/58/67/74/79/85/93/106). getRolesPolicies
  is on the AUTHORIZATION HOT PATH — invoked by ManagementPermissionExtractor.getNonContextualPermissions
  AND AbstractContextualPermissionExtractor.getContextualResourcePermissions on EVERY
  authorized HTTP request that traverses the permission framework.'
