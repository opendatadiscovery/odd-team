behaviour: |-
  **The four `@Scheduled` jobs in the platform share ONE thread by Spring Boot's default `ThreadPoolTaskScheduler.poolSize=1`** — verified by absence of `TaskScheduler` `@Bean` anywhere in `<odd-platform-repo>/odd-platform-api/src/main/java` AND absence of `spring.task.scheduling.pool.size` in `application.yml`. The operator's mental model ("my four scheduled jobs run in parallel") is wrong by default. Concrete operational consequences:

  - HousekeepingJobManager.java:25 — `fixedRate = 15min` + `@SchedulerLock(housekeepingJob, 14m, 14m)`
  - DataEntityStatusSwitchJob.java:21 — `fixedRate = 10min` + `@SchedulerLock(statusSwitchJob, 9m, 9m)`
  - PostgreSQLPartitionCreationJob.java:40 — `cron = "0 1 0 * * *"` (00:01 daily) + `@SchedulerLock(partitionCreationJob, 10m, 10m)`
  - PostgreSQLSessionHousekeepingJobHandler.java:13 — `fixedRate = 1h` (NO `@SchedulerLock`)

  A 14-minute housekeeping cycle blocks the 10-minute status-switch from firing on schedule. A housekeeping cycle that runs past midnight delays the daily partition-creation cron at 00:01 — Spring's default cron-misfire behaviour is queue-and-delay, NOT skip. If the cron is deferred past 23:59:59 of the partition's first-use day, INSERTs against `ACTIVITY` / `MESSAGE` may fail with "no partition exists for the given key". One-line operator mitigation (`spring.task.scheduling.pool.size: 4`) is not documented anywhere on the live config page. No test asserts the current single-thread contract OR the cron-misfire-queueing behaviour.
