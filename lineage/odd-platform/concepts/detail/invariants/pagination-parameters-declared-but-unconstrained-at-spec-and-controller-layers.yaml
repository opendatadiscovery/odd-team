notes: |-
  **STRENGTHENED batch 2026-05-19M to 13-surface pattern**. Batch M adds
  FOUR new surfaces (the anchor-set-defence audit family) bringing the
  cross-cutting pagination weakness count from 9 to 13. Three new
  observation modes batch M surfaces:
    (a) UNSTABLE-pagination — /my/upstream + /my/downstream lack ORDER BY
        on the final listByOddrns scan; consecutive pages may overlap or
        skip entries even WITHOUT size manipulation;
    (b) NO-PAGINATION-AT-ALL — /api/dataentitygroups/{id}/lineage has NO
        parameters declared in the OpenAPI spec; the response shape is
        bounded only by the DEG member cardinality + edge count; a
        bug-class-of-its-own for unbounded responses;
    (c) DEEP-PAGINATION-COST-AMPLIFIED — facet drill-downs at
        getFiltersForFacet use OFFSET-based pagination at 7+ sites in the
        repository; deep pagination cost grows linearly with page.

  STRENGTHENED batch 2026-05-19L with the per-entity-alerts surface
  (P-07-shaped). The audit-export-workaround amplification on
  getDataEntityAlerts is the most operationally-significant
  single-surface observation pre-batch-M.

  Recommended cleanup paths (in increasing scope):
    - Document a recommended size value on the audit-export workaround
      section of the alerting page (operator-facing immediate fix).
    - Add @Min/@Max validation annotations to controller params at every
      list-shape endpoint.
    - **NEW batch M** — Add stable ORDER BY (e.g. ORDER BY id ASC) to
      listByOddrns at ReactiveDataEntityRepositoryImpl.java:247-250
      — single-line fix that addresses the unstable-pagination failure
      mode at the /my/upstream and /my/downstream endpoints.
    - **NEW batch M** — Add page/size parameters to the DEG-lineage
      OpenAPI spec at openapi.yaml:2418-2433 + the controller — closes the
      no-pagination-at-all failure mode on the WIDEST-BLAST DEG-anchored
      surface.
    - Standardise a service-layer clamp helper that every paginated
      controller method invokes.
    - Constrain the OpenAPI PageParam / SizeParam at the spec level
      (would require regenerating clients).
