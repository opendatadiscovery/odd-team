name: EXTERNAL-origin metadata field overwrite — silent, no origin check, no audit
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-10
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-19L** — primary-source
  confirmed at `DataEntityServiceImpl.upsertMetadataFieldValue` (lines
  287-305) + `MetadataFieldServiceImpl.ingestMetadataFields` (lines
  62-71). The custom-metadata upsert path
  (`PUT /api/dataentities/{data_entity_id}/metadata/{metadata_field_id}`)
  does NOT check `MetadataFieldPojo.getOrigin()` before writing the new
  value — both `INTERNAL` (operator-curated) and `EXTERNAL`
  (collector-ingested) fields are writable through the SAME endpoint
  with the SAME permission (`DATA_ENTITY_CUSTOM_METADATA_UPDATE`).

  **The two origins**:
    - `INTERNAL` — created via the catalog UI's Custom-metadata panel
      (POST /api/dataentities/{id}/metadata). Field-name + type live in
      the `metadata_field` table; per-entity value lives in
      `metadata_field_value`.
    - `EXTERNAL` — created via the ingestion pipeline by collectors
      emitting `metadata_field` rows alongside data-entity payloads
      (`MetadataFieldServiceImpl.ingestMetadataFields` lines 62-71). Same
      tables, same shape — only the `origin` column distinguishes them.

  **What the bug enables**:
    - A user with `DATA_ENTITY_CUSTOM_METADATA_UPDATE` (typically granted
      to entity owners via `is: dataEntity:owner` scope) discovers an
      EXTERNAL field's id (e.g. via a previous `GET /api/dataentities/{id}/metadata`
      response, or by enumerating IDs).
    - They call `PUT /api/dataentities/{id}/metadata/{external_field_id}`
      with their preferred value.
    - The endpoint silently overwrites the collector-ingested value;
      until the NEXT ingestion run replaces it, the catalog shows the
      USER's value as authoritative.
    - No activity-feed event is emitted (per the absence of
      `@ActivityLog` on `upsertMetadataFieldValue`; the
      `CUSTOM_METADATA_UPDATED` enum value exists in
      `ActivityEventTypeDto.java:18` but is reserved-but-never-fired by
      any code path).
    - No log line, no UI banner, no per-field source-of-truth indicator
      surfaces the override.

  **Cross-pillar implications**:

    - **P-01 Data Discovery — data-quality**: catalog metadata values
      labelled "ingested from source-system" are silently overrideable.
      A user-facing data-quality signal that "this `cost_centre` came
      from the data-warehouse's metadata catalog" can be a fabrication
      until the next ingestion cycle. Operators auditing
      "is this catalog metadata trustworthy?" cannot tell.

    - **P-10 Integrations & Ingestion**: the platform's ingest pipeline
      creates EXTERNAL fields with the implicit promise "this value
      tracks the source system"; the upsert path silently breaks that
      promise. A future ingestion cycle restores the source-system
      value, but in the interim there is no UI affordance to
      distinguish the user's edit from the source value.

  **Combined with the no-audit gap**: the no-`@ActivityLog` finding
  (custom-metadata upsert path is forensically silent — same as DEG
  membership flips) means an operator restoring the source-of-truth
  ingested value cannot answer "who overwrote it?" or "when?".

  **Combined with the silent-200 gap**: even the user trying to undo
  their own overwrite via PUT cannot tell whether their UPDATE landed —
  the silent-200-on-missing-pair invariant means the response is the
  same shape for success, no-op-success, and missing-row.

  **The fix is small**: the upsert path should either:
    1. Reject writes to `EXTERNAL`-origin fields with a 400
       (`BadUserRequestException("Cannot edit ingested metadata field —
       this field's source-of-truth is the collector")`).
    2. Accept the write but flip the field's `origin` to `INTERNAL` on
       first user edit (marking the catalog state as "operator
       override; next ingestion may overwrite").
    3. Accept the write but emit a CUSTOM_METADATA_UPDATED activity
       event with an explicit "operator override of EXTERNAL field"
       sub-type.

  Operator-side decision; the code currently makes choice (0) — silent
  acceptance with no audit, no indicator, no provenance signal.
