behaviour: |-
  **The controller emits ZERO audit log lines on /api/identity/whoami invocation —
  combined with the under-DISABLED admin-grant (TEST-GAP-928), every anonymous
  probe of the identity-exposure surface is INVISIBLE in application logs.** The
  class carries @Slf4j (line 19) but the controller body uses no log.info /
  log.debug / log.warn calls; IdentityServiceImpl.java:30-52 is equally silent.
  Under DISABLED + default deployment, an attacker reconnoitering the platform's
  auth posture and harvesting the admin identity claim leaves NO controller-tier
  trace. An operator forensically reconstructing a security incident cannot
  determine that an attacker probed whoami nor that the platform confirmed an
  admin identity. The ServerWebExchange parameter is RECEIVED (line 24) but
  UNUSED — exchange.getRequest().getRemoteAddress() is right there, free, and
  discarded.
