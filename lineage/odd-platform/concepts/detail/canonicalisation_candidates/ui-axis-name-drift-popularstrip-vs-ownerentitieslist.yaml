name: UI Axis Name Drift — PopularStrip Substrate Node vs OwnerEntitiesList
  Implementation
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: |-
  **NEW CANONICALISATION CANDIDATE, batch 2026-05-19J — substrate-axis-name drift**.
  The substrate's logical node-id `odd-platform ts react-component
  component:PopularStrip` names a component that **does not exist as a standalone
  file in the codebase**. There is no `PopularStrip.tsx` in odd-platform-ui/src
  (verified by exhaustive grep). The Popular surface is actually rendered as the
  **fourth column inside `OwnerEntitiesList.tsx`**
  (`odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerEntitiesList/OwnerEntitiesList.tsx:99-105`),
  alongside "My Objects" / "Upstream dependents" / "Downstream dependents". **The
  per-column tile renderer `DataEntityList` is shared** across all four columns;
  only the props (`dataEntitiesList`, `entityListName`, `entityListIcon`,
  fetching-status) differ. **The drift signals**: (a) the substrate's
  axis-extractor inferred a logical node from feature-flow context (F-003 Popular
  surface) but the codebase doesn't have a separate component; (b) the maintainer
  may want to refactor — extract PopularStrip as its own component to match the
  substrate naming AND surface column-specific behaviour (e.g. analytics
  interception, debouncing); or (c) the substrate should rename the node-id to
  match the implementation. **Two resolution paths**: (a) **Update the substrate**
  — rename `component:PopularStrip` to either `component:OwnerEntitiesList` (the
  parent) OR `component:DataEntityList` (the tile renderer); the sidecar's
  contents would shift accordingly. (b) **Refactor the code** — extract a
  standalone `PopularStrip.tsx` from the fourth column of `OwnerEntitiesList.tsx`;
  this would give the Popular surface a dedicated component matching the
  substrate. **Recommended resolution (per maintainer practical bias)**: rename
  the substrate node-id to `component:OwnerEntitiesList` since the recommended
  panel logic IS the unit of code — splitting into 4 components would gain little
  if all four columns share the same tile renderer.
contributing_concepts:
