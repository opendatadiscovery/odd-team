- id: H-006
  hypothesis: |-
    When a user types a brand-new owner name into the form, the form warns them that submitting
    will CREATE a new owner directory entry (so a typo does not silently pollute the shared Owner
    directory) and applies some client-side validation (length cap / charset / trim) before submit.
  derivation: |-
    Senior-product-owner UX seed (is the interaction safe + intuitive?) + the feature-flow
    free_solo facet (no max length, no charset filter, no normalisation, no "will create"
    affordance). A product owner expects a destructive-by-accretion action to be signposted.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The freeSolo Autocomplete applies only a `required: true` rule (feature-flow scanner_review
      F-142a: "only `required: true` rule; no charset / length / format / case normalization").
      There is NO inline "this will create a new owner" warning, no max-length cap, no charset
      filter (Unicode emoji / control chars / leading-trailing whitespace all accepted), and no
      case-normalisation — so "John Smith", "john smith", and "John  Smith" (double space) all
      mint DISTINCT owners. The user committing a typo gets no signal that they just created a
      permanent directory entry rather than matched an existing one. (Same shape as F-018 tag
      input + F-046 custom-metadata input.)
    evidence:
      - sidecar: "(feature-flow inline evidence — hop:2)"
        section: "facet free_solo_autocomplete… + scanner_review F-142a"
        cite: "OwnerAssociationForm.tsx:167-172 (only required:true) + :190 (freeSolo)"
        note: "Only required:true; no charset/length/format/case rule; no create-warning affordance."
    operator_visible_failure: |-
      (1) Directory pollution by typo: a user fat-fingers "Dat Eng" instead of selecting the
      existing "Data Eng" and silently mints a near-duplicate owner; subsequent users searching
      "Data Eng" miss the typo'd row, and ownership fragments across variants. (2) No undo on the
      form — the user cannot tell, before submit, that they are about to CREATE vs MATCH. (3) The
      backend then mints the row with no OWNER_CREATE check (the security half — PLT-125 / F-075
      H-005). The UI-side gap (no validation, no create-warning) is the part NOT covered by the
      backend findings; it is the F-142 free_solo facet's UX consequence and was the scanner's
      F-142a doc-gap candidate (now doc-addressed as intentional, so it converts to a UI-hardening
      caveat + test demand, not a doc gap).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: |-
    When the form mounts, the user sees a "Maybe it's you" suggestion section seeded from their
    own username — and this works as a helpful shortcut for deployments where usernames look like
    person-names, degrading gracefully (no broken/empty section) where usernames are opaque.
  derivation: |-
    Feature-flow chain hop:2 (mount-time seed search on identity?.username, lines 131-142;
    "Maybe it's you" rendered 203-222) + facet identity_username_used_as_search_seed. Senior-PO
    UX seed: is the suggestion intuitive across deployment shapes?
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |-
      On mount the form dispatches searchOwners({query: identity?.username}) WITHOUT the debounce
      and renders matches under a "Maybe it's you" hint (feature-flow chain hop:2, lines 131-142,
      203-222). The shortcut works well when username is `firstname.lastname`. But where username
      is an opaque OAuth subject UUID (a common OAUTH2 deployment shape), the seed query matches
      nothing and the hint section is empty/noise — there is no fallback copy ("we couldn't guess
      your owner — search above"), and the user's identity string is used as a DB query with no
      explicit "find matches like me" consent (the facet flags this as a soft, undocumented
      assumption). So the promise holds for person-name usernames and degrades to silent-empty
      (not broken, but unhelpful) for opaque usernames.
    evidence:
      - sidecar: "(feature-flow inline evidence — hop:2)"
        section: "facet identity_username_used_as_search_seed + chain hop:2"
        cite: "OwnerAssociationForm.tsx:131-142 (seed search) + 203-222 ('Maybe it's you')"
        note: "Username-seeded suggestion; no fallback for opaque usernames; implicit consent."
    operator_visible_failure: |-
      In OAUTH2/opaque-subject deployments the "Maybe it's you" panel is permanently empty for
      every user, so the only intended shortcut is dead and the user must know to type the owner
      name unaided — with no copy explaining why the suggestion is blank. Minor, but it is the
      difference between an intuitive first-run and a confusing one for a whole class of
      deployments. Recommend a fallback empty-state string.
    severity: LOW
    confidence: MEDIUM
    confidence_note: |-
      MEDIUM because hops 2's component has no enriched standalone sidecar — the line cites come
      from the feature-flow evidence block, not a file-analyser-verified sidecar (validation_gap).
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

