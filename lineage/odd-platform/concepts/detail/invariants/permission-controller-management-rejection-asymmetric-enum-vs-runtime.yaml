notes: |-
  NEW invariant captured in batch 2026-05-25-ZD. The spec-vs-runtime
  asymmetry on the enum is a discoverable surface — operators
  building third-party clients from the spec hit the 400 once and
  learn the constraint. The doc gap is the higher-leverage fix
  (a single admonition closes it permanently). The spec split is
  more invasive and would break SDK consumers.

  DOC-NNN candidate: admonition on the live
  /authorization/permissions page naming the constraint +
  cross-link to the Identity-payload delivery path.
