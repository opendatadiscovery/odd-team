description: |-
  The Data Quality controller surfaces P-04's first user-observable
  read+mutate capability: per-dataset DQ test reports, the catalog-wide
  SLA aggregate as both a BI-embeddable PNG badge AND a programmatic
  JSON report, plus operator-set per-test severity classification. The
  5-endpoint surface is the read counterpart of the test-result-ingestion
  pillar invariant ('aggregator only — checks are not performed inside
  ODD'). Four reads (`getDataEntityDataQATests`, `getDatasetTestReport`,
  `getSLA`, `getDatasetSLAReport`) are unscoped at the controller and
  repository tiers; the lone write (`setDataQATestSeverity`) is the only
  controller method with a centralised `SecurityConstants.SECURITY_RULES`
  entry (line 243-246), owner-scoped via the `DATA_ENTITY`
  AuthorizationManagerType + `DATASET_TEST_RUN_SET_SEVERITY` permission.

  The user-observable promise (per live `features/data-quality/sla-statuses`,
  WebFetched 2026-05-20 status 200): "Each dataset exposes its current
  aggregate SLA at `GET https://{platform_url}/api/datasets/{data_entity_id}/sla`
  … BI tools can fetch this endpoint per dataset and render the colour
  as a one-glance trust signal next to dashboard tiles or report
  sections." The page also frames the response as "a `DataSetSLAReport`
  that includes: SLA colour (GREEN / YELLOW / RED), severity weights
  breakdown, and a slaRef self-link" — implying JSON.

  The user-observable reality, per the batch-T primary-source
  controller-class sidecar plus the SLA-calculator + repository tier
  sidecars: `GET /api/datasets/{id}/sla` returns `image/png` (a
  classpath PNG byte-array via `CachingByteArraySLAResourceResolver`);
  the JSON `DataSetSLAReport` is the sibling endpoint
  `GET /api/datasets/{id}/sla_report` (operationId `getDatasetSLAReport`,
  `openapi.yaml:1898-1913`). A BI engineer following the live doc
  verbatim will receive a 1-2 KB PNG body and fail to deserialise it
  as JSON — the canonical "operator follows our guide off a cliff"
  scenario for the audience the page explicitly targets.

  Additionally: the four read endpoints have NO entry in
  `SecurityConstants.SECURITY_RULES` (extending the REFACTOR-024
  cross-owner-read family to P-04); `existsIncludingSoftDeleted`
  (DataQualityServiceImpl.java:55,67,96) preserves DQ visibility for
  soft-deleted datasets (intentional forensic-coverage choice);
  `getDataEntityDataQATests` returns 404 for a dataset with zero
  defined tests (unusual REST shape); the SLA calculator default-MAJOR
  fallback (ReactiveDataQualityRepositoryImpl.java:142-148) silently
  inflates SLA colour against operator intuition; `setDataQATestSeverity`
  produces NO Activity Feed row (the audit-silence-on-mutations pattern
  extended to per-test severity changes).
