  - "GithubUserHandler.md says (bugs_limitations_corner_cases.[2]): 'Admin-principals bypass the organization-name gate without doc warning. Lines 54-67 fire BEFORE the org check at line 68. An adminPrincipals: [external-consultant] entry grants ADMIN to external-consultant even if they are NOT a member of organizationName.' severity: MEDIUM"
