behaviour: |-
  **MEDIUM — `POST /api/datasources` AND `PUT /api/datasources/{id}` both return HTTP 200,
  while the OpenAPI spec declares HTTP 201 for both operations. A client generated from the
  published spec asserts `status == 201` and treats a correct registration / update as a
  failure. Two endpoints, the same spec-vs-implementation contract drift, no test.**
  Method-level primary source from the batch-ZB `registerDataSource` and `updateDataSource`
  controller-method sidecars:

  - **register**: `DataSourceController.java:35` is `.map(ResponseEntity::ok)` — HTTP 200.
    `openapi.yaml:453-455` declares `'201': The resource has been successfully created` for
    operationId `registerDataSource`. The resource IS created (the `data_source` row is
    inserted) but the status is 200, not the spec-declared 201.
  - **update**: `DataSourceController.java:44` is `ResponseEntity.ok()` — HTTP 200.
    `openapi.yaml:481-487` declares `'201': The resource has been successfully updated` for
    the PUT (a 201 for an update is itself unusual). The controller hard-codes 200.

  **Why MEDIUM**: this is a real, observable spec-vs-code drift — a generated client
  (TypeScript / Java / Python from the published OpenAPI) compiled to assert the declared
  201 will mis-detect every successful register and update as an error. It is not a
  security or data-loss defect. The drift is SISTER to a class-wide pattern: Owner / Role /
  Policy CRUD all share the same 200-vs-201 drift (TEST-GAP-227 / TEST-GAP-234 /
  TEST-GAP-235 territory), and `IngestionController.postDataEntityList` shares it too —
  this entry pins the DataSource-controller instance, which batch-W did NOT separately
  capture. The endpoints have ZERO direct test coverage (Glob-verified — no
  `DataSourceControllerTest`).

  **Test gap shape**: a `@SpringBootTest` / `WebTestClient` contract-conformance test that:
  (1) `POST /api/datasources` with a valid body → asserts the ACTUAL status is 200 (PIN
  the current behaviour) and asserts the OpenAPI spec at `openapi.yaml:453-455` declares
  201 (the asymmetry); (2) `PUT /api/datasources/{id}` with a valid body → asserts the
  ACTUAL status is 200 and the spec at `openapi.yaml:481-487` declares 201. When the drift
  is resolved (either the controller is changed to return 201, or the spec is corrected to
  200), the test inverts — forcing an explicit decision.
