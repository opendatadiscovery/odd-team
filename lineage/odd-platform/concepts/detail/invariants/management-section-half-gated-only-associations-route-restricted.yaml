notes: |-
  This invariant complements the existing
  management-tab-visible-to-all-authenticated-users-unpermissioned-tab-visibility
  invariant — that one documents the TAB visibility (any user sees
  the Management tab in toolbar). THIS one documents what happens
  AFTER the user clicks through: 8 of 9 sub-routes render to them,
  exposing the full catalogs.

  Coherence (Rule 6): grepped existing detail/ files for
  Associations + RestrictedRoute — confirmed in OwnerAssociations
  feature traces; no contradicting claim found. The
  existing partial-permission-gating invariant catalogues the
  WithPermissions HIDE-not-DISABLE convention; THIS invariant
  documents the ROUTE-LEVEL gate posture which is structurally
  separate.

  Pinned by P-162 — the auth-gate audit emitted by the management
  route sidecar.
