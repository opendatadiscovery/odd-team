behaviour: |-
  **LOW — `proto_version=1` is hardcoded at `NotificationSubscriber.java:42`; PG 14+ streaming-decoding optimisations inaccessible.** The replication-stream options map at line 42 contains `("proto_version", "1")` — a hardcoded literal. Postgres logical decoding currently supports proto_versions 1, 2, 3, 4. Locking to v1 means streaming-decoding optimisations introduced in PG 14+ (e.g. `streaming` parameter for in-progress transactions, parallel apply) are not accessible without a code change.

  **Trade-off**: maximum compatibility (PG 10+) vs no headroom for future optimisations. No config key surfaces the `proto_version` choice; operators on PG 14+ cannot opt into newer-protocol behaviours.

  **Severity is LOW** because the platform's notification volume is low (single-thread leader-elected; alert table is not high-throughput) — the absence of streaming-decoding optimisations is operationally invisible. The gap is documented for completeness; the fix is making the proto_version operator-configurable.

  **Test gap shape**: regression-pin asserting the literal `proto_version=1` value at the streaming-options map. PINS the current state.
