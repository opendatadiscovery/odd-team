- 'postAlerts.md says (bugs_limitations_corner_cases.[5]): ''Generator URL is passed
  through without scheme allowlist: ExternalAlert.generatorURL is `URI` (ExternalAlert.java:13)
  — the URI type validates wire-shape but does not constrain scheme. AlertServiceImpl.java:168-172
  builds a query-augmented URL via UriComponentsBuilder, then AlertServiceImpl.java:185
  embeds the result in the chunk description as `String.format("Distribution Anomaly.
  URL: %s", queryUrl)`. The chunk description is then rendered back in the platform
  UI on the alerts feed.'''
- 'AlertServiceImpl.java:168 (URL build) + 185 (description embedding)'
- 'ExternalAlert.java:13 (URI type, no scheme constraint)'
- 'AlertManagerController.java:21-26, 24 (no validation at controller boundary)'
