behaviour: |-
  Upper-bound clamp on the d query-param — useQueryParams uses parseNumbers: true converting ?d=999999999 to d=999999999. The UI's depth AppSelect only exposes [1..20] but the URL accepts any integer. A user hand-editing ?d=10000 triggers a backend recursive-CTE walk to depth 10000 (REFACTOR-202 amplifies). The UI never validates or clamps. Tests must pin the missing clamp AND — once a clamp fix lands — pin the clamp's correctness.
test_class: missing-security
test_files_existing: []
test_files_proposed:
  path: "odd-platform-ui/src/components/DataEntityDetails/Lineage/__tests__/HierarchyLineage.depthClamp.test.tsx"
  name: "HierarchyLineage_dParam_clampedToMax20"
evidence:
  - "LineageGraph.md bugs_limitations_corner_cases.[1]: 'No upper bound on d URL param parsing — useQueryParams.ts:36 uses parseNumbers: true which converts ?d=999999999 to d: 999999999; the UI's depth AppSelect (LineageControls.tsx:104-118) only exposes [1..20] but the URL accepts any integer. A user who hand-edits ?d=10000 triggers a backend recursive-CTE walk to depth 10000'"
  - "LineageGraph.md security.known_security_gaps.[2]: 'Unvalidated ?d= URL param flows directly to the backend... A curious user editing ?d=10000 triggers the REFACTOR-202 amplification surface from the URL. No UI clamp.'"
cross_references:
