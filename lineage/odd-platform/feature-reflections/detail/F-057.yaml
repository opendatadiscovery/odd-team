- id: H-003
  hypothesis: |-
    Changing a test's severity from Major to Critical flips the SLA colour the moment the change
    is saved, regardless of the test's latest run status.
  derivation: 'response-shape — the SLA endpoint reads severity live; a user assumes the reclassification takes effect immediately for any test.'
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      The flip happens only for tests whose LATEST run status is SUCCESS or FAILED — calculateSLA
      and getSLAReport both filter the stream to t.status()==SUCCESS || t.status()==FAILED before
      counting (SLACalculator.java:24-26,74-76). A test whose latest run is ABORTED / BROKEN /
      SKIPPED / UNKNOWN is dropped from the counter entirely, so its severity (Major or Critical)
      contributes ZERO to the colour. Reclassifying such a test from Major to Critical has no
      effect on the SLA at all — until its next SUCCESS/FAILED run lands. For SUCCESS/FAILED tests
      the hypothesis holds and the flip is immediate (live read, no cache in the chain).
    evidence:
      - sidecar: '(absent — source read for validation)'
        section: sla-calc
        cite: 'SLACalculator.java:24-26,74-76'
        note: 'stream filtered to SUCCESS||FAILED before counting; other statuses excluded from buckets'
        source_read_for_validation: true
    operator_visible_failure: |-
      An operator who reclassifies a currently-broken or aborted test to Critical expecting the
      dashboard to go RED sees no change and may assume the severity write failed (no feedback
      either way — see H-010). The behaviour is invisible and unexplained: the severity dropdown
      shows Critical, the colour stays whatever it was, and there is nothing on screen or in the
      doc connecting "latest run not SUCCESS/FAILED" to "your severity change is currently inert".
      The change silently activates later when the next pass/fail run arrives, potentially
      surprising a different operator weeks later.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |-
    A test that has never had its severity set explicitly is treated as the lowest / most-benign
    weight in the SLA (i.e. an unset test does not silently inflate the dataset's risk colour).
  derivation: 'response-shape — a user setting severities one-by-one assumes the ones they have not touched are neutral, not pre-weighted as Major.'
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      An unset severity defaults to MAJOR, the MIDDLE weight, not the most-benign. The SLA query
      LEFT JOINs DATA_QUALITY_TEST_SEVERITY and mapLastRunDto coalesces a NULL severity to
      DataQualityTestSeverity.MAJOR (ReactiveDataQualityRepositoryImpl.java:119-122,144-146). The
      UI dropdown likewise shows MAJOR as the default for an unset test
      (TestReportDetailsOverview.tsx:84 defaultValue=... || DataQualityTestSeverity.MAJOR). So a
      failing test nobody has classified counts as a failing Major and can drive the colour to
      YELLOW (hasFailedMajors) or, combined with a failing Critical, contribute to RED.
    evidence:
      - sidecar: '(absent — source read for validation)'
        section: repository
        cite: 'ReactiveDataQualityRepositoryImpl.java:119-122,141-146'
        note: 'leftJoin severity; NULL severity coalesced to MAJOR in mapLastRunDto'
        source_read_for_validation: true
      - sidecar: '(absent — UI read for validation)'
        section: ui
        cite: 'TestReportDetailsOverview.tsx:84'
        note: 'dropdown defaultValue falls back to MAJOR for an unset test'
        source_read_for_validation: true
    operator_visible_failure: |-
      Every quality test that ingestion creates is, from day one and with no operator action,
      weighted as Major in the SLA. An operator who has classified three tests as Minor and
      assumes "everything else is uncounted" is wrong — every other failing test is silently a
      failing Major dragging the colour toward YELLOW/RED. There is also NO path back to
      "unspecified": the upsert only ever writes one of the three enum values (no DELETE, no NULL
      set — ReactiveDataQualityRepositoryImpl.java:90-97), and the enum has no UNSPECIFIED member
      (DataQualityTestSeverity.java:26-30), so once a value is shown the operator cannot return a
      test to a neutral state — they can only pick a different non-neutral weight.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

