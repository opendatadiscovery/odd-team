proposed_action: |-
  Add `GetDataEntitiesByDEGOddrnUnauthenticatedReachMatrixTest`. WebTestClient-based reachability matrix:

  1. `get_authDisabled_filterDisabled_noBearer_returns200_pinsAnonymousReach` — the shipped-default reachability.
  2. `get_authDisabled_filterEnabled_noBearer_returns200_pinsFilterIrrelevance` — proves the filter does NOT cover this GET path.
  3. `get_authOauth2_filterEnabled_noBearer_returns200_pinsWhitelistBypass` — proves UI auth does NOT protect /ingestion/**.
  4. `get_authLdap_filterEnabled_noBearer_returns200_pinsLDAPDoesNotProtect` — same for LDAP.
  5. `get_authLoginForm_filterEnabled_noBearer_returns200_pinsLoginFormDoesNotProtect` — same for LOGIN_FORM.
  6. `get_authS2SEnabled_invalidApiKey_returns200_pinsS2SDoesNotProtect_ingestionPaths` — proves S2S filter applies only to `/api/*`, not `/ingestion/*`.
  7. `get_authOauth2_validSessionCookie_filterEnabled_returns200_confirmsAuthenticatedCallerAlsoBypassed` — same reach even when authenticated.

  Each assertion pins the current production reachability. Pair with REFACTOR-NNN (the fix) and DOC-GAP-NNN (live S2S page must document the endpoint + its unauthenticated reach).

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP names the GET /ingestion/entities/{degOddrn} unauthenticated reach. Sister gaps TEST-GAP-097 / 119 cover the POST /ingestion/entities filter coupling; TEST-GAP-017 / 478 cover REFACTOR-217 (path-string drift on /terms vs /term); this entry pins the READ-side complement. STRENGTHENS the cross-cutting F-008 chain by adding the read-side mirror that the original F-008 closure did not cover (F-008 detail YAML is single-vertex on the destructive write).
