feature_id: F-191
pillar_id: P-01
pillar_anchored_id: P-01:F-009-ui
pillar_anchored_feature_name: Dataset Schema Revision Compare Viewer (UI surface)
feature_name: |-
  Dataset Schema Revision Compare Viewer — the side-by-side per-field
  diff UI surface at `/dataentities/{id}/structure/compare?firstVersionId=&secondVersionId=`,
  the OPERATOR-OBSERVABLE counterpart of the
  GET /api/datasets/{id}/structure/diff backend endpoint F-045 anchors.
  Surface composes 4 UI components (DatasetStructureCompare,
  DatasetStructureCompareHeader, DatasetStructureCompareList,
  DatasetStructureCompareListItem) with jotai "show changes only" state +
  URL-query-param-driven version-id selection.
seeded_from: ui-review-2026-05-26
seeded_at: 2026-05-26
status: ui-complete
discovered_from_entry_point: |-
  ui_route:/dataentities/{id}/structure/compare?firstVersionId=&secondVersionId=
  → DatasetStructureCompare.tsx (55 loc, hooks=5) mounted via
  `datasetStructureComparePath` route helper. Operator-visible affordance
  is the "Revision compare" button in DatasetStructureHeader.tsx:144-150
  (disabled if datasetVersions.length < 2).
primary_subject:
  - odd-platform-ui/src/components/DataEntityDetails/DatasetStructure/DatasetStructureCompare/DatasetStructureCompare.tsx
  - odd-platform-ui/src/components/DataEntityDetails/DatasetStructure/DatasetStructureCompare/DatasetStructureCompareHeader/DatasetStructureCompareHeader.tsx
  - odd-platform-ui/src/components/DataEntityDetails/DatasetStructure/DatasetStructureCompare/DatasetStructureCompareList/DatasetStructureCompareList.tsx
  - odd-platform-ui/src/components/DataEntityDetails/DatasetStructure/DatasetStructureCompare/DatasetStructureCompareList/DatasetStructureCompareListItem/DatasetStructureCompareListItem.tsx
contributing_nodes:
  - odd-platform ts react-component component:DatasetStructureCompare
  - odd-platform ts react-component component:DatasetStructureCompareHeader
  - odd-platform ts react-component component:DatasetStructureCompareList
  - odd-platform ts react-component component:DatasetStructureCompareListItem
chain:
  - hop: 0
    node: ui-route route:datasetStructureCompare
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      Operator clicks "Revision compare" in DatasetStructureHeader.tsx:144-150
      → `handleCompareClick` (lines 69-73) navigates to
      `datasetStructureComparePath(dataEntityId, firstVersionId, secondVersionId)`
      with the OLDEST + NEWEST version IDs seeded from the sorted
      datasetVersions list. The header (DatasetStructureCompareHeader.tsx)
      then exposes two SELECT pickers + "Show changes only" checkbox +
      Close button.
  - hop: 1
    node: ui-component component:DatasetStructureCompare
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      DatasetStructureCompare.tsx:30-35 — `useDatasetStructureCompare` React
      Query hook fires GET /api/datasets/{id}/structure/diff with
      firstVersionId/secondVersionId from URL query params + showChangesOnly
      from jotai atom. Loading/Error/Empty/Success states rendered via
      AppLoadingPage / AppErrorPage / EmptyContentPlaceholder /
      DatasetStructureCompareList respectively.
  - hop: 2
    node: ui-component component:DatasetStructureCompareList
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      DatasetStructureCompareList renders one DatasetStructureCompareListItem
      per fieldDiff in data.structureDiffList. Recursive — list-item passes
      `renderCompareItem` callback that recurses on `fieldDiff.childFields`
      (DatasetStructureCompareListItem.tsx:113-117) for nested fields.
  - hop: 3
    node: ui-component component:DatasetStructureCompareListItem
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      DatasetStructureCompareListItem.tsx:31-37 — reads `from` and `to`
      states from `fieldDiff.states[firstVersionId]` and
      `fieldDiff.states[secondVersionId]`. Computes
      `isTypeChanged`/`isIsNullableChanged`/`isPrimaryKeyChanged` flags
      from the per-state objects. Renders side-by-side via
      `S.FieldWrapper` containers with `$status={fieldDiff.status}` (the
      CREATED/UPDATED/DELETED status from backend's DataSetFieldDiffState
      enum) driving the visual treatment.
  - hop: 4
    node: backend rest:GET /api/datasets/{id}/structure/diff
    sidecar: '(see F-045 for backend chain — DatasetController → DatasetVersionServiceImpl → ReactiveDatasetVersionRepositoryImpl)'
    multiplicity_per_trigger: 1
    evidence: |-
      Backend chain per F-045: DataSetController.getDataSetStructureDiff
      (lines 35-46) → DatasetVersionServiceImpl.diffByDataSetVersionId
      → ReactiveDatasetVersionRepositoryImpl.getDiff (lines 147-157).
      The diff payload `structureDiffList` is what this UI surface renders.
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Side-by-side two-column field diff page, one row per affected field,
    CREATED/UPDATED/DELETED status driving the row container colour;
    nested fields expandable via Collapse. "Show changes only" checkbox
    filters CLIENT-SIDE via jotai atom. Close button returns to the
    structure tab.
  evidence: |-
    DatasetStructureCompare.tsx:37-57; DatasetStructureCompareListItem.tsx:90-119.
observed_vs_expected:
  observed: |-
    Operator opens the Compare viewer with the two oldest/newest versions
    pre-selected, can swap either via SELECT picker, can toggle
    "Show changes only". On valid pair → side-by-side rendering. On
    invalid pair (cross-dataset version-ids per F-045 leak, or non-existent
    version-id → 500) → undifferentiated AppErrorPage. Empty diff
    (no fields differ) → EmptyContentPlaceholder. URL is the source of
    truth for selected version-ids — direct paste of arbitrary IDs is
    accepted by the picker WITHOUT validation against the loaded
    datasetVersions list.
  expected: |-
    Surface should (a) validate firstVersionId/secondVersionId belong to
    the current dataset's datasetVersions list before firing the
    backend request; (b) discriminate 4xx vs 5xx error states with
    actionable messaging ("invalid version-id" vs "platform error");
    (c) document the URL-query-param contract so deep-linking is a
    first-class workflow (operators sharing a diff URL across chat).
  facets:
    - drift_class: compare_url_query_params_not_validated_against_loaded_dataset_versions_list_cross_dataset_paste_attack_silent
      description: |-
        DatasetStructureCompare.tsx:24-26 reads firstVersionId and
        secondVersionId from `useQueryParams` directly into the fetch hook
        WITHOUT checking they appear in the loaded `datasetVersions` array
        (DatasetStructureCompare.tsx:28 reads versions but only passes
        them to the header for the SELECT pickers). Paired with backend
        F-045 cross-dataset leak — a pasted URL with version-ids from
        another dataset returns 200 with a structurally-valid but
        semantically-nonsense diff that the list-item renders blindly.
      evidence:
        - "DatasetStructureCompare.tsx:24-26 + 30-35 (URL → fetch hook with no validation)"
        - "F-045 backend cross_dataset_version_id_leak_path_component_is_documentation_only"
      severity: MEDIUM
      ui_unverified: false
    - drift_class: compare_error_page_does_not_differentiate_4xx_vs_5xx_operator_cannot_distinguish_wrong_id_from_platform_broken
      description: |-
        Lines 47-51 — `<AppErrorPage showError={isError} error={error as unknown as ErrorState} offsetTop={210} />`
        catches all error states from the React Query hook. F-045 backend
        returns 500 on missing version-ids and 400 on identical
        version-ids; both bubble through this surface as the same
        AppErrorPage. Operator cannot distinguish "I typed wrong" from
        "platform broken".
      evidence:
        - "DatasetStructureCompare.tsx:46-51"
        - "F-045 backend diff_500_vs_400_asymmetric_error_model"
      severity: LOW
      ui_unverified: false
    - drift_class: show_changes_only_is_client_side_filter_full_diff_payload_still_transferred
      description: |-
        `showOnlyChangesAtom` jotai (DatasetStructureCompare.tsx:14, 22)
        is passed to the React Query hook
        (`useDatasetStructureCompare({..., showChangesOnly})`). It is
        UNVERIFIED whether the hook serialises this to a server query
        param or filters client-side. From the .tsx surface alone the
        contract cannot be determined; if it's a query-param the backend
        F-045 diff endpoint must support it (no evidence in F-045 sidecar
        that it does), otherwise it's a client-side prune of an already-
        downloaded full diff payload. For pathological 10K-field schemas
        the latter is non-trivial.
      evidence:
        - "DatasetStructureCompare.tsx:30-35"
        - "F-045 backend diff_in_memory_load_no_pagination_no_row_count_guard"
      severity: LOW
      ui_unverified: true
      ui_unverified_reason: |-
        useDatasetStructureCompare hook NOT YET enriched as sidecar — the
        showChangesOnly serialisation contract is opaque from .tsx alone.
        Probe candidate: fetch DevTools network tab while toggling the
        checkbox; assert request count + query-param shape.
    - drift_class: revision_picker_disabled_only_on_self_no_cross_dataset_validation
      description: |-
        DatasetStructureCompareHeader.tsx:99 + 129 — the SELECT picker
        disables only the option that equals the OTHER picker's value
        (`disabled={rev.id === +secondVersionId}`). It does NOT validate
        that rev.id belongs to the current dataset (it can't, because
        the picker is fed from `datasetVersions` which is already
        dataset-scoped) — but the URL query params bypass the picker
        entirely. The picker is therefore a NORMAL-PATH safety only;
        URL-paste attack still works.
      evidence:
        - "DatasetStructureCompareHeader.tsx:99 + 129"
      severity: LOW
      ui_unverified: false
    - drift_class: close_button_returns_to_structure_path_drops_compare_state_no_url_history_preservation
      description: |-
        DatasetStructureCompareHeader.tsx:31-33 — `handleCloseClick`
        navigates to `datasetStructurePath(dataEntityId)` (no version-id)
        which triggers the F-045 latest-fetch + URL-replace flow. The
        compare query-state is lost; operator's browser back button
        may bring them BACK to the compare URL → re-fetch. The
        "Close" button is operationally a "go to latest" not a "go back".
      evidence:
        - "DatasetStructureCompareHeader.tsx:31-33"
      severity: LOW
      ui_unverified: false
