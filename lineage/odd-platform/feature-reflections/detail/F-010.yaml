- id: H-012
  hypothesis: >-
    When an operator deploys with default session settings, expired sessions are
    cleaned up by the session-housekeeping job (bounded SPRING_SESSION growth).
  derivation: >-
    The session-housekeeping job's WHERE clause is `expiry_time < now()`; the
    operator expects it to bound the session table.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The shipped default is `spring.session.timeout: -1` (never-expire). Under
      `-1`, sessions are written with an `expiry_time` that never falls before
      `now()`, so the session-housekeeping predicate `expiry_time < now()` never
      matches — the job is a NO-OP and SPRING_SESSION grows monotonically with the
      high-water-mark of authenticated users. The live doc now states both the
      `-1` default and that it means "sessions never expire" (2026-06-01).
    evidence:
      - sidecar: F-010 feature-flow batch-X notes
        section: "drift facet postgresql_session_housekeeping_job_no_op_under_default_spring_session_timeout_minus_one_..."
        cite: "application.yml:2-3 (spring.session.timeout: -1) + PostgreSQLSessionHousekeepingJob.java:30"
        note: "WHERE expiry_time < now() never matches under -1; session table grows"
    operator_visible_failure: |
      (1) On an INTERNAL_POSTGRESQL deployment left at the default, SPRING_SESSION
      grows without bound — another monotonic-growth surface under default config,
      sibling to H-006. (2) The session-housekeeping job exists but does nothing
      until the operator sets a finite timeout — and only THEN does H-011's N×
      load surface. Severity MEDIUM (default-config silent growth; the live doc now
      warns, so the doc-side is covered).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown-constraint  # the session-expiry teardown promise, negated by the -1 shipped default
    coverage: unverified  # no test asserts the -1 default's no-op consequence (FeatureGatingDefaultsTest does not check spring.session.timeout)
    test_demand: functional  # a shipped-default pin for spring.session.timeout: -1 (sibling to FeatureGatingDefaultsTest), so a flip is a conscious edit

- id: H-013
  hypothesis: >-
    When an operator misconfigures a TTL to a destructive value (e.g.
    `data_entity_delete_days=1` or `0`), the platform protects them — a preview,
    a dry-run, a validation rejection, or an archive-before-delete.
  derivation: >-
    Any operator of a system that permanently deletes data expects a guard rail
    against a fat-fingered retention value; this is an implicit safety requirement
    for a destructive subsystem.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      There is NO guard rail. `HousekeepingTTLProperties` has NO `@Validated`, NO
      `@Min(1)`/`@Max`, NO `@DefaultValue`, NO `@PostConstruct validate()` (contrast
      the sibling ODDLDAPProperties which DOES carry a `@PostConstruct validate()`).
      There is no `housekeeping.dry-run=true` mode, no `archive-table`, no
      operator-overrideable gate, and no in-cycle abort. A misconfigured
      `data_entity_delete_days=1` (or `0`, or a negative producing a future cutoff)
      silently binds and the next 15-minute cycle hard-deletes / cascades with no
      recovery path. Once a cycle starts, the only "abort" is killing the JVM
      mid-cycle to force a rollback.
