name: Directory
canonical_in_docs: true
canonical_candidate: false
description: |-
  Catalogue's hierarchical browse interface complementing Search — four-level
  navigation: data source type → data source → entity type → entity. Read-only
  GET endpoints under `/api/directory`, with ODDRN prefix as the grouping key
  (sources whose ODDRN can't be parsed bucket under `Other`/UNKNOWN_DATASOURCE_TYPE)
  (DirectoryController sidecar `understanding`; main-concepts.md `Data Discovery`
  pillar names Directory as one of four entry paths).

  **STRENGTHENED batch 2026-05-20T (DirectoryController controller-class layer
  sidecar)** — adds three new findings:
    (a) **Page-vs-count predicate divergence at level 4** (NEW invariant
        `data-entity-page-vs-count-predicate-divergence-exclude-from-search`):
        the page query uses HOLLOW + soft-delete only; the count query adds
        EXCLUDE_FROM_SEARCH IS NULL or = FALSE. UI renders 'X of Y entities'
        where X > Y in deployments using EXCLUDE_FROM_SEARCH. STRUCTURALLY
        ANALOGOUS to REFACTOR-425 (DataSource listDto) at a DIFFERENT site —
        the bug class PREDICATE-DIVERGENCE-IN-PAGINATION-WRAPPERS is now confirmed
        at TWO sites. MEDIUM severity.
    (b) **Reflection-based ODDRN property extractor — infrastructure-revealing**
        (NEW invariant `reflection-property-extractor-infrastructure-revealing`):
        DirectoryServiceImpl.getOddrnPathProperties (lines 138-171) emits EVERY
        @PathField-annotated property — host, database, port, account, warehouse,
        cluster, topic — for every registered data source, with no allow-list /
        redaction / per-property visibility gate. LOW severity; rises to MEDIUM
        for hostname-sensitive deployments; rises to HIGH under DISABLED.
    (c) **REFACTOR-024 reaches a 5th+ enumeration vector** — Directory is the
        flat-list inventory enumeration sibling to lineage's graph-shaped vector;
        together they exhaust the catalog-shape reconnaissance surface (topology
        + inventory roster).
