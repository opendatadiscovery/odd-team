expected_outcome: |
  Stress question (Category B — name-behaviour pair): the OpenAPI spec for
  operationId registerDataSource declares response '201 The resource has been
  successfully created' (openapi.yaml:453-455), but DataSourceController.java:35
  hard-codes `.map(ResponseEntity::ok)` which is HTTP 200. A client generated
  from the spec asserts `status == 201`; the running platform returns 200.
  Hypothesis: POST /api/datasources with a valid body returns HTTP 200, NOT 201
  — a contract-vs-implementation drift that breaks spec-generated clients.
