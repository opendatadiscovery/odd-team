proposed_action: |-
  Add `TermTagRelationsReplaceAllTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Promote probe P-027 to CI:
  1. `createTermTagsRelations_replaceAll_removesUnsubmittedTags` — seed a term tagged `{a,b}`; `PUT /api/terms/{id}/tags` with `{"tag_name_list":["x"]}`; assert the term ends tagged exactly `{x}` (a and b hard-deleted from tag_to_term).
  2. `createTermTagsRelations_emptyList_clearsAllTermTags` — seed a term tagged `{a,b}`; `PUT` `{"tag_name_list":[]}`; assert ZERO tag_to_term rows for the term.
  3. `createTermTagsRelations_autoCreatesMissingTag_withImportantFalse` — `PUT` `{"tag_name_list":["never-seen"]}`; assert a fresh `tag` row exists with `important = false`; assert it appears in `GET /api/tags`.
  4. `createTermTagsRelations_reInsertOfExistingRelation_isIdempotent` — `PUT` the same list twice; assert no primary-key violation (createTermRelations uses onDuplicateKeyIgnore).

  Pair with a DOC-NNN: document the term-tag PUT as replace-all and warn that an empty `tag_name_list` clears all term tags. Pair with a follow-up backlog item to consider a `minItems: 1` on `TagsFormData.tag_name_list` OR an explicit empty-list guard.
