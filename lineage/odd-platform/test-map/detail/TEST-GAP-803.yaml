behaviour: |-
  **HIGH — F-006 audit-silence ENUM-ROOTED extends to notification delivery.** `ActivityEventTypeDto.java:3-31` enumerates 26 activity event types (`OWNERSHIP_CREATED`, `ALERT_STATUS_UPDATED`, `OPEN_ALERT_RECEIVED`, `RESOLVED_ALERT_RECEIVED`, etc.) but **ZERO of them name notification delivery**: no `NOTIFICATION_SENT`, no `NOTIFICATION_FAILED`, no `NOTIFICATION_DELIVERY_ATTEMPTED`, no `NOTIFICATION_DELIVERED_TO_CHANNEL`.

  This is a STRUCTURAL silence — even if a future maintainer wanted to emit notification-delivery audit events from `AlertNotificationMessageProcessor` (the sole implementor of `PostgresWALMessageProcessor`), they cannot: there is no enum constant to name the event. The activity-feed pipeline (`@ActivityLog` annotation + `ActivityEventTypeDto` enum + `activity_event` table) is enum-driven; adding a new event type requires a code change to the enum, a Flyway migration to the constraint, and updates to the activity-feed UI's switch statement.

  **The F-006 audit-silence family** (per the F-006 feature flow's drift class `audit_silence_enum_rooted_activity_event_type_dto_term_namespace_owner_lifecycle`):
  - Term lifecycle events: silent
  - Namespace lifecycle events: silent
  - Owner lifecycle events: silent
  - Role / Policy / Permission mutations: silent (see TEST-GAP-573 — sister coverage)
  - **Notification delivery events: silent** (THIS gap — the seam adds the 5th surface)

  **Compliance / forensics consequences**:
  1. Multi-tenant deployments with regulatory requirements ("data alerts must be delivered or auditable as undelivered" per GDPR / SOC2 / HIPAA frameworks) cannot meet the requirement.
  2. Operators asking "did the webhook receive alert X" or "which alerts failed Slack delivery between 14:00 and 14:30 yesterday" can ONLY answer via `grep` of stdout for the receiver-id strings — which are not structured, not timestamped uniformly, and not queryable.
  3. SIEM integrations expecting per-action audit events have no ODD-side feed for notification activity — the platform's `/api/activity` endpoint returns nothing for notification delivery.
  4. Post-incident forensics (operator asks "what alert went to which channel?" after a security incident) is impossible.

  **The seam's role**: `PostgresWALMessageProcessor.process(DecodedWALMessage)` carries no per-message identifier (no LSN, no message-id, no correlation-id) — even if the enum had `NOTIFICATION_SENT`, the dispatcher implementor would have no per-message anchor to emit. The LSN is known only to the caller (`NotificationSubscriber`).

  **Cross-feature corroboration**: F-006 catalogues the ENUM-rooted silence at the term / namespace / owner / RBAC surfaces. This gap pins the 5th surface — notification delivery — anchored to the same `ActivityEventTypeDto.java:3-31` enum gap.

  **Test gap shape**: regression-pin asserting that the `ActivityEventTypeDto` enum has NO `NOTIFICATION_*` constants. PINS the structural silence; pairs with REFACTOR-NNN extending the enum + adding `@ActivityLog`-on-process surfaces.
