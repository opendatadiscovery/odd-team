mitigations_unimplemented:
  - |-
    Install rehype-sanitize as a direct dependency in odd-platform-ui's
    package.json and add it to the Markdown.tsx shared element's
    rehypePlugins prop chain with a strict allowlist. ONE line in ONE
    file (per the master F-004 invariant's recommendation). Six surfaces
    fixed simultaneously.
  - |-
    Add an integration test or CI check asserting that grep over
    odd-platform-ui/src for rehype-sanitize returns at least one match
    (the import + plugin registration at Markdown.tsx). This prevents
    a future refactor from accidentally removing the plugin.
  - |-
    Document the architectural decision: the Markdown.tsx shared
    element is the SINGLE Markdown renderer; any new Markdown-rendered
    surface MUST route through this element; rehype-sanitize is part
    of its plugin chain by convention.
  - |-
    Per the master F-004 mitigation list, add backend sanitisation
    (Jsoup or org.owasp.encoder) at the write paths for the three
    canonical surfaces (data-entity description + dataset-field
    description + term definition) — defence-in-depth that holds even
    if a future UI refactor bypasses Markdown.tsx.
  - |-
    Per master F-004, verify behaviour on Firefox and Safari — the
    P-009 probe only covers Chromium-headless. Cross-browser empirical
    pin closes the brittleness of the current defence-in-depth posture.
  - |-
    Add a build-time scanner that flags any new React component
    importing MDEditor.Markdown directly (bypassing Markdown.tsx). The
    shared element's value as an architectural lever depends on every
    Markdown-rendered surface routing through it.
