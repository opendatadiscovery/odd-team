## maintainer_notes

(reserved — no prior reflection to inherit; first reflection for F-147 at feature-reflector/0.3.0)

Convergent-validation note for the triager: this top-down pass independently re-derived, from the
search-user seat, the four ResultItem defects already clustered in PLT-091 (row-click +2 inflation =
H-002, result-row a11y = H-003, inner-child stopPropagation = H-005, plus the chain-level dedupe gap =
H-008→PLT-104) and the DOC-260 caveat (H-010). Two independent methods agreeing is a high-confidence
signal, NOT duplicate work — recorded here, not re-filed. The genuinely net-new findings are H-004
(whole-row navigate breaks middle-click/new-tab/bookmark — a convenience+consistency gap PLT-091's a11y
framing does not call out) and H-007 (the row's clickability is communicated only by a mouse hover cue
against a table-looking layout) — both fold into PLT-091 Defect 3's <a href> fix rather than needing
separate items, so the recommendation is to EXTEND PLT-091's rationale, not open new issues.

The load-bearing structural finding for the methodology: F-147's hop-1 node (ResultItem) has NO sidecar
(chain hop-1 `sidecar: unresolved`), so the platform's SECOND-most-trafficked click surface was
feature-anchored but never enriched. This reflection had to read primary source to validate any hypothesis
(Rule 8 exception). The /enrich of ResultItem + its inner children is surfaced as the primary validation_gap.

The promise-layer headline (LSN-030): F-147 sits at use_case_coverage 0/9 verified — a user-facing feature
on the platform's main discovery surface with ZERO functional tests guarding ANY promise (there are no UI
test files in odd-platform-ui at all). Even the two CONFIRMED promises (H-001 row→overview navigation, H-006
'No matches found' empty state) are unverified and routed to functional_test_demands — these are the
highest-value, lowest-cost guards to mint (pure Vitest + react-testing-library, the row already exposes
data-testid='search-result-item'). The contradicted promises' functional tests double as the regression
guards for the PLT-091/PLT-104 fixes.
