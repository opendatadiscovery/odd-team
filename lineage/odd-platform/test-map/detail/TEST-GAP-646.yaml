behaviour: |-
  **Non-ADMIN principal-aware list fork — UI visibility integration gap.** `RoleServiceImpl.list` (RoleServiceImpl.java:40-47) silently returns DIFFERENT row sets to different callers: non-ADMIN users get only their own attached roles via `filterUserRoles(currentUserRoles, query)`; ADMIN users get the full `roleRepository.listDto(page, size, query)`. The UI is IDENTICAL in either case — the operator's perception of "role catalog completeness" depends on their own role attachment. A non-ADMIN with the USER role sees exactly one row (their own USER role); they cannot tell from the UI that any other roles exist. No test asserts (a) a non-ADMIN caller sees only their own attached roles (server-side filter at RoleServiceImpl.java:40-44); (b) the UI does NOT surface "showing N of M roles" messaging or any indication of filtering; (c) a regression removing the `noneMatch(ADMIN)` branch at RoleServiceImpl.java:42-44 would expose the full catalog to non-ADMIN callers and would be visually invisible from the UI (no test would catch it). This is a P-09 cross-layer security regression-pin: the UI plus the service-tier filter together implement principal-aware role visibility. Either side breaking silently is a security incident.
