- id: H-006
  hypothesis: "When an operator submits a namespace name longer than the storage cap (65+ characters), the system returns a clear operator-facing validation error (a 400 explaining the length limit)."
  derivation: "A user-facing form field with no visible length hint; the operator expects the form to tell them what is wrong, consistent with the unique-name 400 (H-003)."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      NamespaceFormData declares `name: string, required: true` with NO maxLength/minLength/pattern
      (components.yaml:262-268), the NamespaceForm UI applies only required+trim (ui_review_2026_05_26
      note 2), and the only length cap is the DB column `varchar(64)` (V0_0_1__init.sql:13). A 65-char name
      reaches the DB, fails with 'value too long for type character varying(64)', and surfaces as
      `DatabaseException` → HTTP 500, because ExceptionUtils.java:30-36 only translates
      C23_INTEGRITY_CONSTRAINT_VIOLATION (unique index) to a friendly message — the value-too-long path
      falls through to a 500.
    evidence:
      - sidecar: odd-platform__java__NamespaceController__controller-class__NamespaceController
        section: bugs_limitations_corner_cases[4]
        cite: "V0_0_1__init.sql:13 + components.yaml:262-268 + ExceptionUtils.java:30-36"
        note: "varchar(64) only cap; value-too-long → DatabaseException → 500, not a translated 400."
      - sidecar: odd-platform__ts__react-component__component__NamespaceAutocomplete
        section: bugs_limitations_corner_cases[3]
        cite: "NamespaceAutocomplete.tsx:124-127 + DataSourceForm.tsx:124-129"
        note: "the combo-box path ALSO applies no length shaping before emitting the name."
    operator_visible_failure: |
      An operator pasting a long descriptive name (or a generated identifier) into the Namespaces form, or
      into any of the five combo-box forms, sees an opaque 500 server error with no indication that the
      problem is name length. They cannot self-correct: the form gave no maxlength hint, the error names no
      field and no cap. On the combo-box forms (datasource/term/etc.) the failure aborts the parent-entity
      save too, so the operator loses the whole form's work to an unexplained 500. A monitoring operator
      sees a 500 in logs that looks like a server fault, not user error — noise in the error budget.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    note: "No test pins the 500-vs-400 contract (feature-flow test_matrix lists it explicitly as uncovered). Both a bug-fix (translate to 400 + app-tier maxLength) and a regression-guard test are demanded."

- id: H-007
  hypothesis: "When an operator's RBAC policy grants TERM_CREATE / DATA_SOURCE_CREATE / COLLECTOR_CREATE / DATA_ENTITY_GROUP_CREATE but withholds NAMESPACE_CREATE, that operator cannot create new namespaces."
  derivation: "Endpoint shape: NAMESPACE_CREATE is the named gate on POST /api/namespaces; the doc implies namespace creation is a deliberate, separately-authorised operator step ('Create a namespace before authoring tags or terms')."
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |
      The DEDICATED surface is correctly gated — POST /api/namespaces requires NAMESPACE_CREATE
      (SecurityConstants.java:98-102). BUT four sister services call `namespaceService.getOrCreate(name)`
      from their own create/update flows (TermServiceImpl.java:103,138 confirmed; plus DataSourceServiceImpl,
      CollectorServiceImpl, DataEntityGroupServiceImpl per the side-door invariant). getOrCreate has NO
      permission check at the service callsite, so a caller holding any of the four parent *_CREATE
      permissions mints a brand-new namespace by submitting a never-seen namespaceName — NAMESPACE_CREATE
      is never consulted. So the hypothesis is HALF TRUE: the dedicated path enforces the permission; the
      five inline paths do not.
      CRITICAL REFINEMENT (Rule 9, LSN-023): the inline path is NOT a hidden back door — it is the deliberate
      `NamespaceAutocomplete` select-or-create combo-box, which shows existing namespaces, lets the user PICK
      one (the default path), and offers a LABELLED 'Create new custom namespace «X»' row only on a genuine
      no-match. The product INTENDS inline namespace creation as a convenience; the LSN-023-prescribed 'fix'
      (add a namespace_id field to force selection) would DELETE that affordance. So this is simultaneously
      (a) an RBAC-design surprise — TERM_CREATE silently grants implicit namespace-create, more permissive
      than additive policy-reasoning suggests; and (b) intended UX. The honest finding is a documentation +
      RBAC-granularity gap, not a vulnerability.
    evidence:
      - sidecar: odd-platform__java__service__service__TermServiceImpl
        section: dependencies_semantic.requires-feature + concepts.operations(createTerm)
        cite: "TermServiceImpl.java:103,138 (namespaceService.getOrCreate)"
        note: "primary-source side-door call sites in createTerm + updateTerm."
      - sidecar: concepts/detail/invariants/namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths
        section: description (SIDE-DOOR 1) + WHY THIS MATTERS FOR THE OPERATOR'S RBAC POLICY DESIGN
        cite: "invariant nodes[TermController, TermServiceImpl]; 8 call sites enumerated"
        note: "the cross-pillar bypass is catalogued MEDIUM; lists all four sister services."
      - sidecar: odd-platform__ts__react-component__component__NamespaceAutocomplete
        section: coherence_notes (refines registerDataSource) + understanding
        cite: "NamespaceAutocomplete.tsx:78-84,127,165-178 + LSN-023"
        note: "the getOrCreate is the deliberate server half of a labelled select-or-create combo-box; prescribed namespace_id 'fix' would delete the affordance."
    operator_visible_failure: |
      An organisation that grants its data-engineering team TERM_CREATE (scoped to namespace=data-engineering)
      expecting they can author terms in that namespace ONLY discovers — only by trial or by reading service
      code — that the team can also mint ANY new namespace name ('finance', 'compliance'), platform-wide and
      audit-silent. Because there is no NAMESPACE_CREATED activity event (H-011), the operator investigating
      'who created the finance namespace' finds nothing. The RBAC catalog also does not document the
      NAMESPACE_* permission triad at all (authorization doc 200 but silent, 2026-05-20), so the operator
      cannot even discover that NAMESPACE_CREATE exists, let alone that four other permissions bypass it.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    note: "Side-door bypass is asserted by NO test (NamespaceServiceImplTest is mock-based and never exercises the cross-service path; the side-door invariant explicitly requests a regression-pin). A characterization test pinning the CURRENT intended-but-surprising state is demanded."

- id: H-008
  hypothesis: "When an operator deletes a namespace, an external reference (a bookmark, an API client holding the old namespace id, or historical tag/term assignments) continues to resolve correctly afterwards."
  derivation: "Negative-space: soft-delete + reincarnation means a recreated same-name namespace has a NEW id; an operator does not expect a delete-then-recreate to silently break references."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Delete soft-deletes (deleted_at = NOW()). A subsequent same-name create (H-005) yields a NEW id. Any
      external reference using the OLD id now points at a soft-deleted row that all reads filter out
      (ReactiveAbstractSoftDeleteCRUDRepository applies `deleted_at IS NULL`). Tag/term/entity assignments
      that were bound to the old namespace_id persist in the DB but are filtered out of every read and are
      NOT migrated to the recreated namespace. There is no operator-facing warning at delete time and no doc
      caveat (per NamespaceController:bugs_limitations_corner_cases[5]).
    evidence:
      - sidecar: odd-platform__java__NamespaceController__controller-class__NamespaceController
        section: bugs_limitations_corner_cases[5] + implicit_adrs[3]
        cite: "ReactiveAbstractSoftDeleteCRUDRepository.java:50-59 + V0_0_31:25"
        note: "soft-delete + new-id reincarnation; old assignments orphaned and filtered out."
    operator_visible_failure: |
      An operator who deletes 'finance' to 'clean it up' and recreates it the same day believes they restored
      the namespace — but every tag, term, datasource, and data entity previously scoped to it is now
      invisible (bound to the orphaned old id), and any saved deep-link or API integration referencing the old
      id 404s. The data is not gone, but it is unreachable, and nothing tells the operator that delete is not
      reversible-by-recreate. This is the LSN-001-shaped class (a destructive default with no warning) one
      tier up from data loss.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional
    note: "testCreateNamespacePojoAfterDeletingIt (H-005) verifies the NEW-id mechanic but NOT the orphaning consequence — no test asserts that old assignments become unreachable. The consequence is the operator-facing part and is untested + undocumented."

