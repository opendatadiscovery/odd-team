contributors:
- 'createRole.md:bugs_limitations_corner_cases.[0]: predefined-name protection asymmetry
  — `update` + `delete` check `UserProviderRole.values()`; `create` does NOT. The
  only fence is `role_name_unique` partial index. HIGH severity per implicit_adrs.[1]
  + security.known_security_gaps.[0]'
- 'createPolicy.md:bugs_limitations_corner_cases.[3]: Administrator name reserved
  on UPDATE/DELETE but NOT on CREATE. If the seeded Administrator policy is ever soft-deleted,
  a custom Administrator could be re-created with arbitrary statements. Defence-in-depth
  would be to symmetrise across all three endpoints (implicit_adrs.[3])'
- 'PolicyServiceImpl.md (batch I): concepts.invariants.[1] — The Administrator policy
  name (constant ADMINISTRATOR_POLICY at PolicyServiceImpl.java:29) is reserved
  against UPDATE and DELETE only — not CREATE. bugs_limitations_corner_cases.[1]
  — Administrator-name CREATE-side asymmetry confirmed PRIMARY-SOURCE at this layer.
  implicit_adrs.[2] — The Administrator policy is name-reserved against UPDATE
  and DELETE but NOT against CREATE — the operator-visible bootstrap admin path
  is protected against accidental destruction via standard endpoints, but the
  platform does NOT prevent the creation of a SECOND policy named "Administrator"
  at the service layer (relying instead on the DB UNIQUE constraint). security.known_security_gaps.[1]
  — Administrator-name CREATE-side asymmetry is a defence-in-depth gap (MEDIUM
  severity; gap-of-gaps; surfaces only on out-of-band soft-delete).'
