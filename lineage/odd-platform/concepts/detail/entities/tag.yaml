security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      Scope asymmetry: TAG_CREATE is MANAGEMENT-scoped (unconditional),
      DATA_ENTITY_TAGS_UPDATE is DATA_ENTITY-scoped (grantable via
      'is: dataEntity:owner'). The latter can mint Tag rows in the
      global directory without holding TAG_CREATE.
      **STRENGTHENED batch N — SQL primary source confirms**:
      ReactiveTagRepositoryImpl has NO authorization annotations
      whatsoever (no @PreAuthorize, no @Secured, no programmatic
      permission check). The class trusts the caller to have already
      evaluated permissions. The 18-method contract surface would, if
      mistakenly invoked from an unauthorised path, write directly to
      the tag directory or the relation tables with no native defence.
      The architectural assumption is that SecurityConstants.SECURITY_RULES
      covers every controller path that reaches here.
      **STRENGTHENED batch VAL-LSN-019 — SERVICE primary source
      confirms**: TagServiceImpl carries ZERO @PreAuthorize and ZERO
      programmatic permission checks across all 168 lines (9 public
      methods + 2 private helpers, line-by-line verified). The service
      inherits whatever auth posture the call-site provides; for
      TagController calls this is the perimeter SecurityRule; for the
      four side-door surfaces it varies per surface and TAG_CREATE is
      NEVER held even though directory rows are minted. The
      architectural assumption — that the CONTROLLER perimeter is the
      SOLE defence — is triple-anchored across controller + service +
      repository sidecars.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Tag directory is global; no per-tenant/per-namespace scoping at
      the Tag layer.
      **STRENGTHENED batch N**: there is no `tag.owner_id` column, no
      per-Owner Tag filtering anywhere in this class. listMostPopular
      and listByNames return globally. The Tag directory is a flat,
      globally-shared namespace BY DESIGN; the side-door write surface
      (REFACTOR-223) compounds this.
      **STRENGTHENED batch VAL-LSN-019**: TagServiceImpl's
      data_exposure confirms — Mono<TagsResponse> from listMostPopular
      → globally-ordered tag directory → any authenticated user, no
      owner filter, no per-tag permission check. The closest analogue
      to ownership is the `external` boolean which encodes
      Collector-vs-UI provenance, NOT user-ownership.
  strengths:
  - Auto-create IS spec-documented at openapi.yaml:1174 — intentional UX trade-off
  - important = false hardcoded for auto-created tags — admin-curated 'important'
    distinction preserved
  - External tag relations PROTECTED from this endpoint (filter !external in TagServiceImpl.java:100-103)
  - |-
    **NEW batch N — Partial-unique-index as RACE PROTECTION**.
    `tag_name_unique ON tag(name) WHERE tag.deleted_at IS NULL`
    (V0_0_64:105) is the platform's only locking mechanism for the
    auto-create-on-miss path. The `ingestData` upsert leans on this
    via ON CONFLICT (name) WHERE deleted_at IS NULL DO UPDATE — makes
    concurrent novel-name inserts idempotent without an
    application-level lock.
    (ReactiveTagRepositoryImpl.md:implicit_adrs.[0])
  - |-
    **NEW batch N — RETURNING-trigger pattern via no-op DO UPDATE SET
    name = EXCLUDED.name**. The conflicting row's name is set to itself
    to trigger the RETURNING clause; the caller (getOrInjectTagByName)
    needs every row's id to build TagToDataEntityPojo relations. A
    deliberate trade-off: per-row touch on every ingestion-time
    conflict in exchange for caller convenience.
    (ReactiveTagRepositoryImpl.md:implicit_adrs.[2])
  - |-
    **NEW batch N — Centralised friendly-error translation via
    ExceptionUtils.translateDatabaseException** — every R2DBC query
    maps DataAccessException → UniqueConstraintException with the
    tailored "Tag with this name already exists" message
    (ExceptionUtils.java:54-56). Consistent with the platform-wide
    centralised translation idiom.
  - |-
    **NEW batch VAL-LSN-019 — Three-method !external guard pattern**.
    TagServiceImpl.update + .delete + .updateRelationsWithDataEntity
    all defend Collector-set EXTERNAL relations from UI mutation via
    consistent guard shapes. INTENTIONAL design (per the explicit
    BadUserRequestException messages); the maintainer's defence
    against UI users impersonating a Collector. See the
    `external-relations-immutable-to-ui-users-cross-method-guard-tagserviceimpl`
    invariant.
  weaknesses:
  - Tag side-door past TAG_CREATE via DATA_ENTITY_TAGS_UPDATE — per-data-entity-owner
    can globally pollute the Tag directory (MEDIUM)
  - Cross-tenant Tag pollution — no per-tag ACL; mint a tag for entity X in tenant
    A, it appears in tenant B's popular-tags surface (MEDIUM)
  - Unique-index race on concurrent novel-tag creation surfaces as UniqueConstraintException;
    UI must retry-on-conflict
  - Soft-deleted tag recreation produces NEW row (orphans history; data-entity relations
    stay frozen at old id)
  - No length/character-set/whitespace validation on tag names (homoglyph/typo pollution
    accumulates)
  - |-
    **NEW HIGH batch N — TOCTOU race between listByNames and
    bulkCreate in TagServiceImpl.getOrCreateTagsByName** (PRIMARY
    SOURCE — see batch N
    `tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race`
    invariant; STRENGTHENED batch VAL-LSN-019 with TagServiceImpl
    service-tier primary source pinning the no-@ReactiveTransactional
    on the read+write pair as intentional). The service-layer's
    read-then-write pattern is race-prone; the `bulkCreate` path is
    NOT protected by the upsert that `ingestData` uses. The
    unique-index loser sees a 5xx-level error on a normal-looking
    PUT request. NO caller-side retry.
    (ReactiveTagRepositoryImpl.md:bugs_limitations_corner_cases.[0] +
    TagServiceImpl.md:bugs_limitations_corner_cases[HIGH TOCTOU])
  - |-
    **NEW MEDIUM batch N — Case-sensitive `listByNames`** enables
    silent duplicate Tag rows. `TAG.NAME.in(names)` is case-sensitive
    SQL; `TagServiceImpl.divideTagsByExistence` calls listByNames
    then `existingTagNames.contains(n)` — also case-sensitive.
    Submitting `PII` against a directory that already contains `pii`
    sees `pii` as missing and mints a fresh `PII` row. Two operators
    looking for `pii` may apply different rows, fragmenting the
    search facet.
    (ReactiveTagRepositoryImpl.md:bugs_limitations_corner_cases.[1] +
    TagServiceImpl.md:bugs_limitations_corner_cases[case-sensitivity])
  - |-
    **NEW MEDIUM batch N — No tag-name validation at any layer** —
    no PostgreSQL CHECK constraint, no service-layer validation, no
    OpenAPI pattern constraint. An operator with
    DATA_ENTITY_TAGS_UPDATE can mint Tag rows with arbitrary names
    (any length, whitespace-only, control-character) visible to
    every other user via `GET /api/tags/popular`. REFACTOR-223 DoS class.
    (ReactiveTagRepositoryImpl.md:bugs_limitations_corner_cases.[2])
  - |-
    **NEW MEDIUM batch N — listMostPopular is globally-scoped, no
    pagination cap**. The `size` parameter is passed through verbatim
    to paginate; `size=100000` would force a full-directory aggregate.
    Combined with the side-door write path (REFACTOR-223), an
    attacker can populate the popular-tags surface for ALL users.
    (ReactiveTagRepositoryImpl.md:bugs_limitations_corner_cases.[3] +
    performance.scaling_characteristics.[2])
  - |-
    **NEW MEDIUM batch N — Repository emits NO audit log on writes**.
    `ingestData`, `bulkCreate`, `delete`, every `create*Relations` /
    `delete*Relations` method writes with NO repository-side activity
    event. The TAG_ASSIGNMENT_UPDATED activity event is emitted by
    DataEntityServiceImpl.upsertTags @ActivityLog (the UI write
    path); the ingestion-side ExternalTagIngestionRequestProcessor
    write produces NO activity-feed entry. Tier-1c-equivalent of the
    audit-log-presence-asymmetry pattern.
    (ReactiveTagRepositoryImpl.md:security.known_security_gaps.[0])
  - |-
    **NEW HIGH batch VAL-LSN-019 — LSN-019 NAME-vs-BEHAVIOR DRIFT
    on listMostPopular**. The endpoint name + the OpenAPI description
    + the UI "Top Tags" surface all promise popularity-ranked
    selection. The SQL truth: pre-truncate by TAG.ID ASC, then count-
    DESC re-order within the window. Operator-visible at the "Top
    Tags" UI surface. See the
    `lsn-019-listmostpopular-name-vs-behavior-drift-pagination-precedes-ranking`
    invariant + the
    `top-tags-ui-label-vs-implementation-drift-operator-visible`
    canonicalisation candidate. Probe P-010 pins the SQL contract
    in CI permanently.
  - |-
    **NEW MEDIUM batch VAL-LSN-019 — deleteTag has TWO asymmetries**
    (compound observation). The delete path: (a) skips the
    `tag_to_dataset_field` cleanup (the existing batch-W
    `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field`
    invariant — STRENGTHENED with TagServiceImpl as new primary
    source) AND (b) refreshes only 1 of 3 search vectors (the new
    `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
    invariant). Both omissions live in the same method; the
    recommended fix is compound (touch both in one commit).
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    **NEW batch N — Three hot paths now SQL-primary-source pinned**:
      Hot path 1 — ingestData per Collector batch: every Collector
        push with novel tags lands here once per batch via
        ExternalTagIngestionRequestProcessor.process.
      Hot path 2 — listMostPopular per `GET /api/tags/popular` call:
        non-trivial UNION-ALL CTE across two relation tables with
        per-tag aggregates. Hot for Catalog Overview + tag-search-facet
        rendering.
      Hot path 3 — listDataEntityDtos on EVERY data-entity detail page
        load: triple-call shape (DataEntityServiceImpl + DataEntityPermissionExtractor
        + TagActivityHandlerImpl all call listDataEntityDtos for the
        same data entity in a single HTTP request).
    (ReactiveTagRepositoryImpl.md:performance.hot_paths.[0,1,2])
  - |-
    **NEW batch VAL-LSN-019 — updateRelationsWithDataEntity hot path
    + LSN-019-affected listMostPopular hot path observation**:
      `updateRelationsWithDataEntity` runs on every
      `PUT /api/dataentities/{id}/tags` write — issues FOUR DB
      statements in a single @ReactiveTransactional boundary.
      `listMostPopular` per `GET /api/tags?popular`: the LSN-019
      drift compounds the cost — the CTE aggregates run over rows
      that won't be operator-visible in the response. Cost per call
      is still bounded by `size` (counter-intuitive performance
      UPSIDE of the structural bug, at the cost of correctness).
  throughput_shape:
    verdict: BATCH_FRIENDLY
    detail: |-
      The ingestData upsert is partitioned by executeInPartitionReturning
      at BATCH_SIZE (typically 1000); a 5000-row upsert is 5 sequential
      round-trips in the caller's TX. Flux.concat (sequential), not
      Flux.merge — each partition is a separate INSERT ... ON CONFLICT
      ... DO UPDATE statement.
  weaknesses:
  - No cap on tag_name_list size — abusive caller can submit million-string list (Postgres
    parameter limit ~32K breaks at driver layer)
  - Tag directory grows monotonically with tag-related activity; popular-tags query
    latency degrades over years
  - |-
    **NEW LOW batch N — Triple-fetch of listDataEntityDtos during one
    request** — DataEntityServiceImpl + DataEntityPermissionExtractor
    + TagActivityHandlerImpl all call the same `listDataEntityDtos(dataEntityId)`
    in a single HTTP request. No request-scoped cache. Three identical
    DB round-trips per data-entity detail-page load.
    (ReactiveTagRepositoryImpl.md:performance.known_performance_gaps.[0])
  - |-
    **NEW LOW batch N — listMostPopular UNION-ALL CTE has no
    pagination cap** — `size` parameter passed verbatim to paginate;
    no upper bound. An attacker can force a full-directory aggregate.
    (ReactiveTagRepositoryImpl.md:performance.known_performance_gaps.[1])
  - |-
    **NEW LOW batch VAL-LSN-019 — updateRelationsWithDataEntity
    in-memory diff is O(N×M)** where N is current relations and M is
    updated — `current.stream().filter(r -> !updated.contains(r))` at
    TagServiceImpl.java:114-116 does a linear scan per current relation.
    For typical operations (dozens of relations) this is not a bottleneck;
    at extreme scale it would be.
