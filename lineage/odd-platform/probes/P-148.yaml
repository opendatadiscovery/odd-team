realism_caveats: |
  In normal ingestion flow, version monotonicity == time monotonicity, so the
  drift does not surface. The probe confirms the semantic gap; operators
  doing data-fixup / replay must understand that "Latest" means "highest
  version number", not "most recently created". The probe does NOT verify
  what the UI actually displays — the UI consumes the same response and
  shows version + createdAt side-by-side, so a careful operator can read the
  timestamp and notice. But the API contract's "latest" word is unqualified.
