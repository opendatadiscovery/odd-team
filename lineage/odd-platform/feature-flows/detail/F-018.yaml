terminal_side_effect:
  side_effect_class: db-write
  description: |-
    INSERT/UPDATE rows into `tag` table (the global directory) via FIVE
    write paths: (1) operator-explicit TAG_CREATE on POST /api/tags via
    TagController.createTag (bulkCreate, fail-on-duplicate); (2) UI side-channel
    via DATA_ENTITY_TAGS_UPDATE on DataEntityController.setDataEntityTags; (3)
    side-channel via TERM_TAGS_UPDATE on TermController.createTermTagsRelations
    -> TermServiceImpl.upsertTags; (4) side-channel via DATASET_FIELD_TAGS_UPDATE
    on DatasetFieldController.updateDatasetFieldTags; (5) ingestion-side
    `ingestData` upsert from ExternalTagIngestionRequestProcessor + the
    unauthenticated postDataSetStatsList stats path. UPDATE on PUT /api/tags/{id}
    (rename / important toggle, + a triple FTS-vector refresh). SOFT-delete +
    asymmetric HARD-delete of relations on DELETE /api/tags/{id}. INSERT into
    `tag_to_data_entity`, `tag_to_dataset_field`, `tag_to_term` relation tables
    via the respective create*Relations methods (onDuplicateKeyIgnore).
  evidence: |-
    ReactiveTagRepositoryImpl.java:191-213 (ingestData upsert), 217-323
    (relation create/delete), inherited bulkCreate + delete. TagController.java:22-52
    (the four directory-CRUD operations). TermServiceImpl.java:254-264 +
    DatasetFieldServiceImpl.java:117-132 (the two sibling relation-write
    paths). Side effects: NEW tag-row visible to every user via GET /api/tags
    immediately (no per-owner / per-namespace / per-tenant scoping; no GET
    SecurityRule). NO repository-side audit log; the @ActivityLog
    TAG_ASSIGNMENT_UPDATED event lives at DataEntityServiceImpl.upsertTags
    (line 358) and fires only on the UI-side data-entity assignment path;
    DatasetFieldServiceImpl.updateDatasetFieldTags emits its OWN
    @ActivityLog(DATASET_FIELD_TAGS_UPDATED) with full before/after state;
    TermServiceImpl.upsertTags and the directory-CRUD operations
    (createTag / updateTag / deleteTag) emit NONE.
  cardinality_per_call: |-
    1 (per novel tag minted) + N (per relation created/removed); createTag
    emits N (one row per BulkTagFormData element, or 0 on a duplicate-name
    failure IF the batch INSERT rolls back atomically — P-026); updateTag
    emits 1 tag UPDATE + 0..N search_entrypoint upserts; deleteTag emits 1
    soft-delete + 0..N tag_to_term + 0..M tag_to_data_entity hard-deletes
    (tag_to_dataset_field NOT touched).
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — primary-source in batch N ReactiveTagRepositoryImpl sidecar +
  X-TAGGING controller-method sidecars. Per-call amplification is 1 for the
  directory write + N for the per-relation fan-out. The DEEPER amplification
  is the side-channel-count: a single authorized operation grants effective
  write access to a globally-shared vocabulary surfaced to every other user
  — five write paths now confirmed (createTag + three relation-write
  endpoints + the ingestion path). This is a CARDINALITY amplification of
  consequences, not a per-request multiplier. The REFACTOR-223 framing
  captures this as "side-door write surface" rather than a numerical product.
  updateTag carries a SECONDARY amplification: a rename of a tag attached to
  N data entities triggers an N-row search_entrypoint upsert per call
  (cardinality scales with the tag's usage breadth — TagServiceImpl.java:161-167).
observed_vs_expected:
  facets:
  - facet: DATA_ENTITY_TAGS_UPDATE side-channel into global Tag directory (REFACTOR-223 headline — X-TAGGING confirms all three relation-write endpoints at primary source)
    observed: |-
      The auto-create-on-miss path
      (`TagServiceImpl.getOrCreateTagsByName` -> `bulkCreate`) is invoked from
      FOUR relation-write entry points, each now confirmed at controller-method
      primary source by X-TAGGING: (a) `DataEntityController.setDataEntityTags`
      (DATA_ENTITY_TAGS_UPDATE gate); (b)
      `TermController.createTermTagsRelations` -> `TermServiceImpl.upsertTags`
      (TermServiceImpl.java:257 — TERM_TAGS_UPDATE gate, SecurityConstants
      .java:185-186); (c) `DatasetFieldController.updateDatasetFieldTags`
      (DATASET_FIELD_TAGS_UPDATE gate, SecurityConstants.java:288-290); (d)
      `ExternalTagIngestionRequestProcessor` + the unauthenticated
      postDataSetStatsList stats path. None of these consult `TAG_CREATE`.
      `createTag` (POST /api/tags) IS gated by TAG_CREATE — but it is one of
      five write paths, and the four side-doors all bypass it. An operator
      with TERM_TAGS_UPDATE on a single term, or DATASET_FIELD_TAGS_UPDATE on
      a single dataset field's parent entity, can mint arbitrary new tag
      names in the global directory visible to every user via GET /api/tags.
      The live tagging + permissions doc pages (WebFetched 2026-05-21 status
      200) document the TAG_CREATE / per-entity tag-update permissions
      separately but are silent on the side-channels — the createTag sidecar
      records this as DOC-GAP-168.
    expected: |-
      Either (a) consult `TAG_CREATE` inside `tagService.getOrCreateTagsByName`
      (move the gate from the controller perimeter to the upsert primitive —
      the leverage fix: ONE change closes all four side-doors) OR (b) document
      explicitly that `DATA_ENTITY_TAGS_UPDATE`, `TERM_TAGS_UPDATE`,
      `DATASET_FIELD_TAGS_UPDATE`, and the ingestion S2S filter ALL grant
      directory-mint scope, with the operator-trust implications spelled out.
    drift_class: data_entity_tags_update_side_channel_into_global_tag_directory
    provenance: |-
      STATIC — primary-source in batch N ReactiveTagRepositoryImpl sidecar +
      X-TAGGING controller-method sidecars: createTag bugs_limitations[5]
      (4-side-door enumeration) + createTermTagsRelations bugs_limitations
      "Permission side-door TERM_TAGS_UPDATE mints global Tag directory rows"
      + updateDatasetFieldTags bugs_limitations "Permission side-door
      DATASET_FIELD_TAGS_UPDATE mints global Tag directory rows" +
      TermServiceImpl.java:257 + DatasetFieldServiceImpl.java:264-271 +
      SecurityConstants.java:138, 185-186, 288-290. REFACTOR-223 +
      DOC-GAP-168 are the canonical backlog entries. Severity: HIGH.
  - facet: TOCTOU between listByNames and bulkCreate (HIGH availability surface)
    observed: |-
      `TagServiceImpl.getOrCreateTagsByName` (TagServiceImpl.java:80-86,
      144-159) issues `listByNames(tagNames)` first to filter existing,
      then `bulkCreate(tagsToCreate)` for the remainder. Between the two
      reactor stages, a concurrent caller can insert the same novel name.
      In PostgreSQL's READ COMMITTED isolation the listByNames snapshot does
      NOT see uncommitted INSERTs from a concurrent TX, so the second caller
      attempts bulkCreate with the now-conflicting name, hits `tag_name_unique`,
      and receives `UniqueConstraintException("Tag with this name already
      exists")`. Because the enclosing service method is @ReactiveTransactional,
      the losing caller's WHOLE transaction rolls back — its term-relation /
      data-entity-relation writes are lost too, not just the directory row
      (createTermTagsRelations sidecar makes this explicit). The `ingestData`
      path is safe (ON CONFLICT DO UPDATE); the `bulkCreate` path is NOT.
    expected: |-
      Either (a) replace `bulkCreate` with `ingestData`-style upsert in the
      getOrCreateTagsByName path, OR (b) catch UniqueConstraintException
      and retry listByNames + filter again.
    drift_class: toctou_between_list_by_names_and_bulk_create
    provenance: |-
      STATIC — primary-source in batch N ReactiveTagRepositoryImpl sidecar
      bugs_limitations_corner_cases[0] + X-TAGGING createTermTagsRelations
      bugs_limitations "Unique-index race on concurrent novel-tag creation"
      (P-028) + updateDatasetFieldTags resource_boundaries (P-030 covers the
      dataset-field variant) + TagServiceImpl.java:80-86, 144-159 +
      ReactiveAbstractCRUDRepository.java:114-126. Severity: HIGH.
  - facet: case-sensitive listByNames enables silent duplicate Tag rows via case variation
    observed: |-
