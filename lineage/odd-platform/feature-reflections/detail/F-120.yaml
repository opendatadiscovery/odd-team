- id: H-004
  hypothesis: "When an operator runs a deployment that never uses Lookup Tables, the platform does not pay for the Lookup-Tables connection pool."
  derivation: "The customConnectionPool exists solely for the Lookup-Tables (P-03) subsystem (sidecar understanding); a least-surprise operator expects an unused subsystem to cost nothing."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The `customConnectionPool` bean is created at R2DBCConfiguration.java:54 with NO
      `@ConditionalOnProperty` gate — it is instantiated on EVERY deployment regardless of whether
      `spring.custom-datasource.*` is set or any Lookup Table is ever created. When the custom keys
      are unset (the shipped default — commented out at application.yml:8-11), the second pool opens
      against the SAME PostgreSQL database as the primary, differing only by `?schema=lookup_tables_schema`,
      and holds its `initialSize` connections perpetually. So a Lookup-Tables-free deployment still pays
      the full second-pool connection cost (the other half of the 20-per-replica ceiling in H-002).
    evidence:
      - sidecar: "R2DBCConfiguration"
        section: "bugs_limitations_corner_cases[2]"
        cite: "R2DBCConfiguration.java:54 (no @ConditionalOnProperty; contrast HousekeepingJobManager.java:18)"
        note: "Unconditional instantiation — every deployment runs both pools."
      - sidecar: "R2DBCConfiguration"
        section: "concepts.invariants[1] (custom datasource opt-in fallback)"
        cite: "R2DBCConfiguration.java:56-58,61-62,113 + application.yml:8-11 (commented out)"
        note: "Unset custom keys → second pool against the same DB with ?schema= appended; still a live pool."
    operator_visible_failure: |
      The connection-budget overcommit in H-003 is doubled-into precisely because of this: the half of
      the 20-slot ceiling that 'belongs' to Lookup Tables is consumed even by the (common) deployments
      that never enable the feature. An operator reasoning 'I don't use Lookup Tables so my DB footprint
      is one pool' is wrong by a factor of 2. There is no log line, no warning, and no docs note that a
      second pool is always live.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

