  invariants:
    - slug: datasource-update-replace-not-merge-mapstruct-set-to-null
      name: |-
        DataSource UI update is REPLACE-not-MERGE — MapStruct SET_TO_NULL nulls every omitted form field (silent partial-edit data loss)
      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
        - controllers
      nodes_count: 1
      contributors_count: 1
      security_aggregate_overall: null
      performance_aggregate_overall: null
      description: |-
        NEW MEDIUM-SEVERITY INVARIANT, batch ZB — PUT /api/datasources/{id} is a
        full-form REPLACE of the 3 mutable fields (name, description,
        namespace_name), NOT a field-wise MERGE. An API consumer (or a UI bug)
        sending a PARTIAL body to change one field SILENTLY NULLS the other two.
        The mechanism — DataSourceMapper.applyToPojo is a MapStruct @MappingTarget
        mapper; MapperConfig (MapperConfig.java:7-11) sets no
        nullValuePropertyMappingStrategy so MapStruct's default SET_TO_NULL
        governs; DataSourceUpdateFormData has no `required` block so an omitted
        JSON field deserialises to null and is written as null. A partial PUT to
        rename a source wipes the description and detaches the namespace. The
        REPLACE semantic is not declared anywhere — it is an emergent consequence
        of three independent facts, and one MapperConfig line away from inverting.
        Probe P-043. The UI-admin DataSource analogue of the
        silent-data-loss-replace-not-merge-ingestion-semantics invariant.
      detail_path: detail/invariants/datasource-update-replace-not-merge-mapstruct-set-to-null.yaml
    - slug: datasource-delete-incomplete-cleanup-orphan-token-uncleared-fts
