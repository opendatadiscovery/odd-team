behaviour: |-
  **CASCADE-BLOCK LEG INDEPENDENCE — three separate tests per leg, NOT one composite test.** OwnerServiceImpl.java:90-96 implements the cascade-block as `Mono.zip(termOwnershipRepository.existsByOwner(id), ownershipRepository.existsByOwner(id), userOwnerMappingRepository.isOwnerAssociated(id))` + an OR'd predicate `BooleanUtils.toBoolean(t.getT1()) || BooleanUtils.toBoolean(t.getT2()) || BooleanUtils.toBoolean(t.getT3())`. The current implementation is correct, but the failure mode of a regression is asymmetric: if a maintainer accidentally flips ANY of the OR conjuncts to AND (`||` → `&&`) OR drops one of the three legs, the cascade-block would silently allow deletion of Owners with active bindings on the dropped/AND-incorrectly-combined leg. Each leg corresponds to a distinct table — termOwnership, ownership, userOwnerMapping — with different observable consequences (term-side dangling references vs entity-side dangling references vs auth-side dangling principal-bound rows). The single-composite test "delete an owner with cascade" would not catch leg-independence regressions; THREE distinct tests are needed. The cascade-block leg-independence pin is the SECOND-HIGHEST priority OwnerServiceImpl test per the sidecar's `gaps` framing.
