# Platform OpenAPI Discoverability Surface (Swagger UI) — product-owner reflection

## product_owner_narrative

The Platform OpenAPI Discoverability Surface is the developer-facing front door to ODD's
194-operation HTTP API. Every running deployment ships a springdoc-openapi integration that
renders an interactive Swagger UI plus the machine-readable OpenAPI 3.0.3 document, so an
operator or a third-party integrator can browse, read, and "try it out" against every endpoint
the platform exposes — Alerts, Data Entities, Owners, Terms, Query Examples, the lot — without
reading source (per `odd-platform__openapi__spec__odd-platform-public-api.md:understanding`,
194 operations across 35 tags; pillar P-11 "interactive Swagger UI on every running deployment"
per `system-mission.md:302-303`). The audience is the `odd-api-consumer` and the
`integration-author` who build SDKs against the spec, and the `platform-operator` who opens the
Swagger UI to test a call interactively (`...public-api.md:audiences`).

A user reaches the feature one of two ways. Programmatic consumers fetch the OpenAPI document
and run it through `openapi-generator-cli` / `openapi-typescript` to produce a typed client.
Interactive users open the Swagger UI in a browser. The pillar and SHB-128 both name the
entry URL `{platform-base-url}/api/v3/api-docs` (`system-mission.md:303,316`; the demo is
`https://demo.oddp.io/api/v3/api-docs`). The springdoc config declares two grouped specs —
`platform-api` matching `/api/**` and `ingestion-api` matching `/ingestion/**`
(`SwaggerUIConfiguration.java:10-22`) — so the Swagger UI presents two definitions the way the
(now-removed) api-reference doc described ("ingestion-api … and platform-api").

The working parts a product owner would demo: the spec's `info` block (title, contact,
version) that brands the API; the `servers` block that a code-generator reads as the default
base URL; the per-tag grouping that becomes the Swagger UI left-nav; and — load-bearing for any
security-conscious operator — *who can reach the surface*, which depends entirely on the
deployment's `auth.type`. Under the shipped default `DISABLED` the whole `/**` surface is
permit-all (`DisabledAuthSecurityConfiguration.java:16` `.anyExchange().permitAll()`), so the
Swagger UI and spec are anonymously reachable. Under `OAUTH2` / `LDAP` the chain applies
`AuthorizationCustomizer` which permits only `WHITELIST_PATHS` then requires authentication on
`/**` (`AuthorizationCustomizer.java:22-30`); under `LOGIN_FORM` a hand-rolled permit list
plus `.pathMatchers("/**").authenticated()` (`LoginFormSecurityConfiguration.java:49-57`). The
springdoc paths are NOT in any whitelist (`SecurityConstants.java:95-96`
`{"/actuator/**","/favicon.ico","/ingestion/**","/img/**","/api/slack/events"}`), so the 4-cell
availability matrix is: DISABLED = anonymous; the other three = authentication required.

The feature is the developer-surface arm of P-11, which `feeds` P-01 ("API Reference per-feature
pages back every UI affordance; Swagger UI provides interactive testing of the same endpoints",
`system-mission.md:467-470`) and P-10 (the custom-collector SDK guide). Its integration story
is that it is the discovery layer over every OTHER pillar's HTTP face — a defect in the spec's
shape, branding, or auth-legibility is therefore visible to consumers of all 11 pillars
(`...public-api.md:dependencies_semantic.requires-feature`).

The edge cases a product owner would flag in a demo are exactly where this reflection finds the
contradictions: the title still says "ProspectLog" (a pre-rebrand codename); the contact block
carries a named individual's personal email AND name; the `servers` entry is a `http://localhost`
stub a generator will target verbatim; the spec is auth-illegible (no `securitySchemes`); the
canonical doc that tells operators where the Swagger UI lives now 404s; and — the catch only a
top-down trace surfaces — the URL everyone CALLS "the Swagger UI" is springdoc-configured as the
HTML-UI path while the JSON spec body is served at the OTHER path, inverted from the label.

## hypotheses

- id: H-001
  hypothesis: |-
    When any caller opens {platform-base-url}/api/v3/api-docs (or the spec JSON path) on a
    deployment running the shipped default configuration (auth.type=DISABLED), they receive the
    full OpenAPI surface (194 operations / 35 tags) with no authentication challenge.
  derivation: |-
    DISABLED is the application.yml-shipped default (application.yml:34) and its chain is
    .anyExchange().permitAll(); the springdoc paths are under /api/** which that chain permits.
  seed_source: pillar + endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      Under auth.type=DISABLED the only SecurityWebFilterChain is permit-all for every path
      (DisabledAuthSecurityConfiguration.java:16 `.anyExchange().permitAll()`, no securityMatcher
      narrowing). springdoc registers its endpoints under /api/v3/* (application.yml:22-26) which
      is inside /**. No authentication, no authorization, no CSRF gate applies. A caller reaching
      the network port sees the entire 194-operation spec anonymously. This is intended: the
      pillar directs operators to the Swagger UI URL, and the public demo serves it openly.
    evidence:
      - sidecar: odd-platform__java__DisabledAuthSecurityConfiguration__config-key-consumer__auth_type@L10.md
        section: understanding
        cite: "DisabledAuthSecurityConfiguration.java:16"
        note: ".anyExchange().permitAll() — every path served to every caller under DISABLED (the shipped default at application.yml:34)"
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api.md
        section: security.data_exposure
        cite: "openapi.yaml:1 + live api-reference doc"
        note: "spec publicly served at /api/v3/api-docs by every running deployment; full surface discoverable before any auth"
    severity: ""
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

- id: H-002
  hypothesis: |-
    When a caller hits the Swagger UI / spec path on a deployment running auth.type=OAUTH2 or LDAP
    WITHOUT credentials, they are denied (401/redirect) — the spec surface is NOT anonymously
    reachable in those modes.
  derivation: |-
    OAUTH2/LDAP wire AuthorizationCustomizer which permits only WHITELIST_PATHS then requires
    .authenticated() on /**; springdoc's /api/v3/* paths are NOT whitelisted.
  seed_source: pillar + negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      Both OAUTH2 (OAuthSecurityConfiguration.java:98) and LDAP (LDAPSecurityConfiguration.java:145)
      apply `.authorizeExchange(new AuthorizationCustomizer(permissionService, extractors))`.
      AuthorizationCustomizer.customize() permits SecurityConstants.WHITELIST_PATHS, then applies
      SECURITY_RULES, then `.pathMatchers("/**").authenticated()` (AuthorizationCustomizer.java:22-30).
      WHITELIST_PATHS = {"/actuator/**","/favicon.ico","/ingestion/**","/img/**","/api/slack/events"}
      (SecurityConstants.java:95-96) — the springdoc paths /api/v3/api-docs and /api/v3/swagger-ui.html
      are under /api/** but are NOT among the whitelisted entries and match no SECURITY_RULE
      specific to them, so they fall through to .authenticated(). An anonymous caller is challenged.
    evidence:
      - sidecar: odd-platform__java__OAuthSecurityConfiguration__config-key-consumer__auth_type@L71.md
        section: security.authorization_assertions
        cite: "AuthorizationCustomizer.java:29-30"
        note: '.pathMatchers("/**").authenticated() catch-all after WHITELIST_PATHS + SECURITY_RULES'
      - sidecar: odd-platform__java__LDAPSecurityConfiguration__config-key-consumer__auth_type@L51.md
        section: bugs_limitations_corner_cases
        cite: "SecurityConstants.java:95-96 + AuthorizationCustomizer.java:22-24"
        note: "WHITELIST_PATHS does not include /api/v3/* — springdoc surface is not in the permit list"
      - sidecar: SELF
        section: source_read_for_validation
        cite: "SecurityConstants.java:95-96 (Read 2026-06-03 — WHITELIST_PATHS verbatim)"
        note: "Confirmed the whitelist contents directly; no springdoc/api-docs/swagger entry present"
    severity: ""
    confidence: HIGH
    source_read_for_validation: true
    routes_to_finding: functional-test-demand
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

