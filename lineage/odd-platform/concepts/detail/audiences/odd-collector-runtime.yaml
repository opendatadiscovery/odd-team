name: ODD Collector (runtime)
canonical_in_docs: true
canonical_candidate: false
description: 'The deployed collector container/process consuming the COLLECTOR_TOKEN_REGENERATE-rotated
  token to authenticate `POST /ingestion/entities`. The collector audience is downstream
  of the rotation operation — it''s the system that must pick up the new token (typically
  a config-file change + restart) the moment the in-place UPDATE commits. **Batch
  F**: postDataEntityList is the canonical S2S endpoint the collector authenticates
  against — the collector''s only production code path into the platform''s metadata
  catalog. main-concepts.md names Collector canonically.'
axes_present:
- controllers
nodes:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
- odd-platform java IngestionDataEntitiesFilter config-key-consumer:auth.ingestion.filter.enabled@L20
- odd-platform java IngestionController controller-method:postDataEntityList
contributors:
- 'regenerateCollectorToken: token rotation is felt at the collector runtime — in-flight
  ingestion fails the moment UPDATE commits; operator must reconfigure the collector
  to use the new value'
- 'IngestionDataEntitiesFilter@L20: when filter enabled, collectors authenticate via
  Authorization: Bearer <token>; sidecar names odd-collector + odd-collector-sdk as
  the HTTP clients ingesting data entities'
- 'postDataEntityList (batch F): the actual ingestion entry point the collector POSTs
  to; batched DataEntityList payloads carry per-tick scan results; collector typically
  batches hundreds-to-thousands of items per HTTP call'
evidence:
- regenerateCollectorToken.md:concepts.invariants.[3]
- regenerateCollectorToken.md:bugs_limitations_corner_cases.[0] (no rotation grace
  period)
- IngestionDataEntitiesFilter@L20.md:concepts.audiences
- postDataEntityList.md:concepts.audiences (odd-collector / odd-collector-sdk HTTP
  clients)
