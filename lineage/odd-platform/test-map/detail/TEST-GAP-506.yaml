behaviour: |-
  Inner-DEG suppression deferred-feature regression-pin (MEDIUM — P-05). The service-layer filter at `LineageServiceImpl.java:71-75` strips DEG-typed edge endpoints AND DEG-typed metadata entries from the response (`relations.stream().filter(r -> !isDegODDRN(r.getChildOddrn(), dict) && !isDegODDRN(r.getParentOddrn(), dict))` + `dict.entrySet().removeIf(e -> isDEG(e.getValue().getDataEntity()))`). The comment `// Remove this when we will support inner DEGs for DEG lineage` (line 71) is the explicit deferred-feature anchor. There is NO corresponding backlog item (`grep "inner DEG\\|nested DEG"` in odd-team/backlog/ returns no matches), NO ADR draft, and NO regression test. A future maintainer attempting to lift the suppression has NO test feedback when they accidentally break the existing API contract — the response shape would silently flip from 'flat graph of non-DEG members' to 'recursive graph including DEG nodes'. The SQL layer DOES support nested DEG traversal (`getDEGEntitiesOddrns` at `ReactiveGroupEntityRelationRepositoryImpl.java:177-204` recursively walks GROUP_ODDRN); only the Java filter suppresses the DEG entries. A regression that drops the Java filter would: (a) increase response payload size by including DEG nodes, (b) potentially break UI rendering (the DEGLineage component does not currently render DEG-typed nodes — verified by sidecar's `DEGLineage.tsx:18-19` reference), (c) break third-party API contract assumptions. The DEFERRED-FEATURE intent is load-bearing for the current operator contract.
