  derivation: "Doc-claim — business-glossary.md:181 states 'The tab shows the \"more available\" loading indicator on scroll, but the underlying scroll handler is not wired to fetch additional pages.'"
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      No loading indicator appears on scroll. The InfiniteScroll `loader` prop is
      `{isFetching && <LinkedColumnsListSkeleton />}` (LinkedColumnsList.tsx:79), and
      react-infinite-scroll-component only renders the loader while `hasMore` is true
      AND a `next` fetch is in flight. Since `hasMore={pageInfo.hasNext}` is hard-coded
      false at the backend (DatasetFieldListMapperImpl.java:48), the component never
      enters the loading state on scroll — the loader never shows. The doc's claim of a
      "more available loading indicator on scroll" is factually inaccurate. The doc IS
      correct that additional rows never load and that the cap is 50.
    evidence:
      - sidecar: "(source read)"
        section: LinkedColumnsList
        cite: "LinkedColumnsList.tsx:78-79"
        note: "hasMore=hasNext(false) → loader gated by isFetching never triggers on scroll"
      - sidecar: "(source read)"
