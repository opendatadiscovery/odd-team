notes: |-
  Pairs with:

    - `two-ingestion-filters-asymmetric-auth` invariant — explains the
      always-on auth layer that gates this endpoint.

    - `namespace-inherited-from-collector-not-payload-collector-scoped-tenancy`
      invariant — the namespace-handling rule that compounds the
      partial-merge story (namespace is ALSO not propagated from the
      payload — but for a different reason: it's inherited from the
      Collector, not preserved from existing row).

    - **NEW batch R** —
      `datasource-name-partial-unique-silent-rollback-on-collector-rename`
      invariant — the name-collision rollback that compounds the
      partial-merge story (the name field IS one of the two
      payload-driven fields; if the new name collides with another
      live row, the entire transaction rolls back).

  **STRENGTHENED batch R — the SERVICE-tier vs REPOSITORY-tier
  enforcement distinction is now PRIMARY-SOURCE pinned**. This
  refines the original (controller-side) understanding of the
  contract: the partial-merge IS service-tier-only, and a
  service-bypassing caller (test code today; hypothetical future
  direct-injection) would break it without any persistence-layer
  protection. The refactoring scope to "make this schema-enforced"
  is captured at ADR-CANDIDATE-142 — would require a database
  trigger or a hash-based prevention column on the data_source row
  that the repository explicitly clears.

  Doc-side recommended action: extend the custom-collectors developer
  guide with a "Re-registration semantics" subsection: enumerate the
  fields that propagate (`name`, `description`) vs preserved (everything
  else) vs inherited from Collector (`namespace_id`). **NEW batch R**:
  also document the SERVICE-tier vs REPOSITORY-tier enforcement
  distinction in an internal architecture note — maintainers
  reading the repository code in isolation could reasonably assume
  the contract is schema-enforced.
