behaviour: |-
  **CRITICAL — `POST /api/collectors` and `PUT /api/collectors/{id}/token` emit the full 40-character plaintext collector token in the HTTP response body. The token then traverses the wire to the UI (batch-Q CollectorsList.tsx renders plaintext to DOM), the at-rest store (batch-R: `TOKEN.value` stored plaintext), and any reverse-proxy / APM / browser DevTools on the path. NO `Cache-Control: no-store`, NO `X-Sensitive-Body`, NO documented warning to operators about wire-tier exposure.** Primary-source confirmed in batch-W CollectorController sidecar:

  **Controller tier (this gap's surface)**:
  - `CollectorController.registerCollector` (lines 27-31): `return collectorService.create(formData).map(ResponseEntity::ok)` — the service emits a `Collector` DTO whose `token.value` is the plaintext 40-char string per `ReactiveTokenRepositoryImpl.create` line 21 (`new TokenDto(r.into(TokenPojo.class), true)` — the `showToken=true` flag).
  - `CollectorController.regenerateCollectorToken` (lines 47-51): same pattern — `tokenRepository.updateToken(...)` line 30 returns `new TokenDto(..., true)`.
  - **Per `TokenMapper.mapValue` (TokenMapper.java:15-18)**: when `dto.showToken() == true`, returns the FULL plaintext. When false, returns `******{last6chars}`.

  **The chain (the complete picture across 3 layers)**:
  - **Vertex 1 — Wire-tier (THIS gap)**: HTTP response body contains plaintext. Reverse-proxy + APM + DevTools all capture it.
  - **Vertex 2 — UI-tier (batch-Q CollectorsList.tsx)**: the UI renders the plaintext to DOM (no copy-to-clipboard masking; no on-screen scroll-clear; the token sits in browser memory as plaintext).
  - **Vertex 3 — At-rest tier (batch-R TOKEN.value)**: stored plaintext. The platform compares plaintext-to-plaintext against the `IngestionDataEntitiesFilter`.

  **Operator-visible consequences**:
  - An operator clicking Register Collector in the Management → Collectors tab: the plaintext token traverses the response wire, renders in their browser, and is captured by any APM agent / proxy logger / browser cache.
  - An operator screensharing during the Register flow: the token is leaked in the screenshare.
  - An operator running the platform behind a corporate ingress with body-capture logging: every token they ever rotate is in the ingress log forever.
  - A breach of the central APM aggregator: every collector token across every customer using that APM.
  - **The leaked token is the FULL credential** — there is no salting, no HMAC, no derived form. The S2S filter at `IngestionDataEntitiesFilter` does a plaintext comparison.

  **Why CRITICAL not MEDIUM (the sidecar's own rating per CollectorController.md)**: the sidecar rates this MEDIUM at the controller layer in isolation, but explicitly states "high in aggregate via the chain". This test pins the END-TO-END behaviour: the chain across wire + UI + at-rest is CRITICAL because ANY single-layer leak compromises the full credential (no recovery via HMAC-on-issue / derived-form / hashed-storage). The CollectorController's wire-tier is the FIRST exposure point.

  **Test gap shape**: regression-pin asserting: (a) `POST /api/collectors` response body contains the plaintext 40-char token verbatim; (b) `PUT /api/collectors/{id}/token` response body contains the plaintext token; (c) `GET /api/collectors` (list) responses carry the masked `******{last6chars}` form; (d) `PUT /api/collectors/{id}` (update) responses carry the masked form; (e) NO response carries `Cache-Control: no-store` or `X-Sensitive-Body`. The current state is PINNED — any future maintainer adding header markers OR migrating to HMAC-on-issue will see tests #1-#4 fail and must update the wire contract + the UI + the docs in lockstep.
