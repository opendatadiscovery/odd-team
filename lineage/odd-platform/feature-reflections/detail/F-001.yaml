      The UI gate and the API gate diverge. The home-page Popular STRIP is hidden under DISABLED (H-007) and
      requires identity+ownership under the three authenticated modes (per OwnerAssociation.tsx:84-86). BUT
      the underlying endpoint GET /api/dataentities/popular has NO @PreAuthorize and NO SecurityRule entry —
      it falls through to pathMatchers("/**").authenticated(), and under auth.type=DISABLED that filter chain
      is not wired at all, so the endpoint is anonymously reachable. A signed-in user with no Owner (who sees
