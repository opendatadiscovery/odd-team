- id: H-012
  hypothesis: |
    The `size` query parameter on `GET /api/activity` has a reasonable
    upper bound (e.g. 1000 or 10000) that protects the platform from
    a pathological caller requesting all-of-history in a single
    response.
  derivation: |
    Standard listing endpoints on operated platforms clamp `size` to
    a sane maximum. A user reading the API knows the parameter
    exists; the framework convention is to silently clamp or to
    reject above-max requests.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The repository applies `LIMIT size` directly at line 292; jOOQ
      passes `null` through as no LIMIT (returns ALL matching rows);
      the service layer applies no clamp (per ActivityServiceImpl.md
      stress_findings.S-A-1 — verified line-by-line, no
      Math.min(size,MAX) clamp, no @Value injection); the controller
      method declares `final Integer size` (boxed, nullable) with NO
      `@Min`/`@Max`/`@NotNull` validation (per ActivityController.md
      stress + understanding). A pathological caller can request
      `size=Integer.MAX_VALUE` or `size=null` and the SQL query is
      `LIMIT 2147483647` or `(no LIMIT clause)` respectively —
      Postgres clamps to actual row count; on a long-running deployment
      with tens-of-millions of audit rows, this is a wide scan with
      no clamp at any layer.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: stress_findings.A1
        cite: "ReactiveActivityRepositoryImpl.java:292"
        note: "limit(size) with no clamp; null → no LIMIT clause"
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: stress_findings.S-A-1
        cite: "ActivityServiceImpl.java:85-117"
        note: "Service passes size through unchanged"
      - sidecar: odd-platform__java__ActivityController__controller-class__ActivityController.md
        section: stress_findings.A1 (referenced) + understanding
        cite: "ActivityController.java:24-41"
        note: "No @Min/@Max/@NotNull on size; OpenAPI spec marks SizeParam required:true but the boxed Integer is accepted as null at runtime"
    operator_visible_failure: |
      A caller (browser tab left open with the API request rebuilt,
      or a malicious authenticated user, or an integration script
      with bad pagination logic) can issue `GET /api/activity?
      size=10000000` or `GET /api/activity` (no size) and force a
      full-history scan with the resulting Flux streaming millions
      of rows. The single request can saturate the R2DBC connection
      pool, hold a Postgres query plan for seconds-to-minutes, and
      transfer hundreds of MB of audit data over the network. No
      defensive guard at the read surface. This is operator-visible
      as a latency cliff or, in the worst case, a DoS surface.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-013
  hypothesis: |
    The `GET /api/activity/counts` response satisfies the invariant
    `totalCount == myObjectsCount + upstreamCount + downstreamCount`
    (or has a documented overlap rationale) — so an operator using
    the four counts to build a dashboard sees consistent numbers.
  derivation: |
    The four-count payload shape suggests partitioned aggregation;
    the natural reader's interpretation is "the four numbers add up
    to the total" or "each is a subset of total with documented
    overlap rules". An undocumented arithmetic relationship between
    the four is an operator-visible inconsistency.
  seed_source: response-shape + negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The service issues four parallel `SELECT COUNT(*)` queries via
      `Mono.zip` (ActivityServiceImpl.java:138-166); the four
      queries execute against four separate R2DBC connections at
      READ COMMITTED isolation (no `@ReactiveTransactional` on the
      controller, the service method, OR the underlying call chain
      per ActivityServiceImpl.md S-C-1 + S-E-1). A row INSERTed
      between the four query executions appears in some counts but
      not others — so the four sub-counts are NOT GUARANTEED to sum
      to or align with `totalCount`. Additionally, the count queries
      have the same JOIN-cardinality inflation problem as the find
      queries (per repository.md C3) — multi-tag/multi-owner filters
      inflate counts non-DISTINCT-ly. And: the count semantic model
      does not naturally partition — `myObjects` is owner-scoped
      (entities I own), `upstream`/`downstream` is lineage-scoped
      from caller-named entities; the three sets can OVERLAP (a
      data entity I own that is also upstream of another entity I'm
      viewing). The promised arithmetic relationship is not
      well-defined; operators using the four counts as if they sum
      will see mismatches.
    evidence:
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: stress_findings.S-C-1 + S-E-1
        cite: "ActivityServiceImpl.java:138-166"
        note: "Mono.zip 4-way concurrent count without TX; READ COMMITTED isolation"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: stress_findings.C3 + bugs_limitations_corner_cases.[7]
        cite: "ReactiveActivityRepositoryImpl.java:297-302"
        note: "COUNT(*) over multi-LEFT-JOIN inflates per-tag/per-owner multiplicity"
    operator_visible_failure: |
      A UI showing four count badges (total / my / upstream /
      downstream) displays numbers that do not satisfy the arithmetic
      expectation. Operators building dashboards on top of /api/activity/
      counts see "totals don't reconcile" tickets filed against the
      platform; the answer is "the four counts are independently
      computed; no consistency guarantee" — which is true but
      undocumented and surprising.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-014
  hypothesis: |
    When the caller passes `GET /api/activity?type=ALL&tag_ids=
    [a,b,c]&owner_ids=[1,2]`, the response contains DISTINCT activity
    events — each event appears once even when its data entity
    matches multiple of the requested tags or owners.
  derivation: |
    The product-owner mental model of an event-list is "one row per
    event". A user setting multiple filter facets expects to narrow
    the result, not to multiply it. The response DTO `Activity` is
    a single-event payload; the caller's mental model is event-set,
    not row-set.
  seed_source: response-shape + endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The repository's find queries use no `DISTINCT` clause (per
      ReactiveActivityRepositoryImpl.md
      bugs_limitations_corner_cases.[7] + the F-021 drift_class
      `no_distinct_multi_facet_filter_duplicates`). The conditional
      LEFT JOINs to `TAG_TO_DATA_ENTITY` (when tagIds is set) and
      `OWNERSHIP` (when ownerIds is set) multiply the per-row result
      by the number of matching tags and owners. A single activity
      row whose data entity has 3 matching tags + 2 matching owners
      surfaces as 6 rows in the response. The count endpoint
      (per H-013) has the same inflation, so the badge and the list
      remain internally consistent — but each is wrong relative to
      the "unique event" mental model.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: bugs_limitations_corner_cases.[7] + stress_findings.C3
        cite: "ReactiveActivityRepositoryImpl.java:290-292"
        note: "No DISTINCT; LEFT JOIN multiplicity inflates row count"
      - feature_flow_drift_class: no_distinct_multi_facet_filter_duplicates
        cite: "F-021 drift_class_summary"
        note: "Already enumerated as a drift class; this hypothesis confirms it as user-visible"
    operator_visible_failure: |
      A user filtering "show me activity on entities tagged 'pii' or
      'finance' OR owned by team-alpha or team-bravo" sees a feed
      with duplicate-looking entries — the same DESCRIPTION_UPDATED
      event appears 4-6 times in the list with identical timestamps,
      identical payloads, identical actor. The user assumes "multiple
      changes happened" or "the event was re-emitted" — neither is
      true; the LEFT JOIN multiplied a single row. The cursor
      pagination is unaffected (the cursor advances by id), but the
      page contents are visibly inflated.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

