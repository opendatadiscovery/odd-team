      (batch I origin; STRENGTHENED here at the service-tier with batch P
      controller-tier + batch S service-tier + batch R audit-refinement
      end-to-end framing).
    - Existing entity `alertmanager-webhook-receiver` (the inbound webhook
      surface).
    - F-007 feature-flow detail.
