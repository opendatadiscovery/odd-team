security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      5 of 7 endpoints have SecurityRule entries. THREE endpoints have NONE
      (POST self-request, GET providers, GET activity-list). The
      missing-rule asymmetry is the load-bearing finding (the activity-list
      view is more sensitive than the list view but the activity-list view
      is NOT gated).
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The list endpoint returns ALL pending/approved/declined requests
      across all users + all Owners without filtering by the calling user's
      owner-scope. Read-collaborative posture on the LIST view.
  strengths:
    - Dedicated audit table with 5 typed event values — full forensic
      coverage of the user-owner-binding workflow (the POSITIVE half of
      the 2-tier audit story)
    - Fail-closed under auth.type=DISABLED (4 explicit current-user
      assertions throw 'There is no current authorization')
  weaknesses:
    - DIRECT_OWNER_SYNC + getOrCreate composition is a privilege-escalation
      chain (HIGH — separate batch V invariant)
    - GET /api/owner_association_request/activity ungated (HIGH — the
      audit-trail superset disclosed without permission check)
    - createUserOwnerMapping allows Admin to bind ANY oidc-username + provider
      to ANY ownerId without consent or existence check
    - REFACTOR-427 orphan rows on Owner delete (FK has no ON DELETE clause)
  cross_file_inconsistencies:
    - createOwnerAssociationRequest is fail-closed under DISABLED; OwnerController
      Owner-CRUD verbs are fail-OPEN under DISABLED (REFACTOR-185) — the
      user-owner-binding surface is more disciplined than the Owner-CRUD
      surface
  contributing_files:
    - OwnerAssociationRequestController.md
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'getOwnerAssociationRequestList: paginated query joining
      owner_association_request + owner + role tables —
      OwnerAssociationRequestController.md'
    - 'getOwnerAssociationRequestActivityList: paginated query joining
      activity + owner (twice via aliases) + role —
      OwnerAssociationRequestController.md'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      All endpoints are single-item per call. Bulk-cancel inside the approve
      path can fan out to N+1 activity-row writes per cancelled colliding
      request (within @ReactiveTransactional).
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      No page-size upper bound on either list endpoint. A malicious or
      careless caller can request size=1_000_000.
  strengths:
    - Reactive Mono signatures across all 7 endpoints
    - Stateless controller — horizontal scaling
    - Per-mutating-method @ReactiveTransactional boundaries
  weaknesses:
    - No page-size upper bound (LOW)
    - Cascade-cancel fan-out can deadlock on concurrent approvals (LOW)
  cross_file_inconsistencies: []
  contributing_files:
    - OwnerAssociationRequestController.md
notes: |-
  This entity entry is the catalog landing page for the Owner Association
  Request workflow + F-011 Principal-to-Owner Resolution producer half.
  The entity carries the dedicated audit-table observation that REFINES the
  F-006 audit-silence pattern.

  Cross-cutting connections:
    - Companion invariant: two-tier-audit-asymmetry-bifurcation-owner-association-request-has-dedicated-table-rbac-mutations-do-not
      (the 3rd tier of the audit story)
    - Companion invariant: direct-owner-sync-plus-getorcreate-composition-privilege-escalation-chain
      (the HIGH privilege-escalation chain at the createOwnerAssociationRequest
      entry-point)
    - Companion invariant: owner-association-request-three-ungated-endpoints-create-providers-activity
      (the three ungated endpoints — HIGH for the activity-list endpoint)
    - F-019 Owner Lifecycle Management — REFACTOR-427 orphan rows
    - F-006 master invariant: this controller is the POSITIVE counter-example
      to the audit-silence pattern (HAS audit; RBAC mutations DO NOT)
    - F-011 Principal-to-Owner Resolution — THIS controller IS the producer
      of the USER_OWNER_MAPPING rows
