name: ODD Frontend SPA
canonical_in_docs: true
canonical_candidate: false
description: The React single-page application that operators / end-users load in
  the browser. Calls `GET /api/appInfo` on app load to discover which auth mode is
  active and render the appropriate login flow (DISABLED → no login; LOGIN_FORM →
  username/password form; OAUTH2 → OIDC redirect; LDAP → LDAP credentials form). main-concepts.md
  names the SPA via the `ODD Platform` canonical entry.
axes_present:
- controllers
- config_prefixes
nodes:
- odd-platform java AppInfoController config-key-consumer:auth.type@L18
contributors:
- 'AppInfoController@L18.audiences: frontend SPA (renders login UI based on returned
  authType)'
evidence:
- AppInfoController@L18.md:concepts.audiences
notes: 'Distinct from "ODD Platform UI End-User" (the human) — this is the

  RUNTIME consumer (the JS bundle) that gates which login UI is

  shown to the human. The published `/api/appInfo` contract is the

  backend''s interface to the SPA''s login-flow renderer.

  '
