evidence:
  - |-
    Alerts.md:bugs_limitations_corner_cases.[stale-totals] —
    'Tab badge totals (totals, myTotal, dependentTotal) are
    fetched ONCE on mount (Alerts.tsx:15-17, useEffect([])
    no deps) — they do not refresh after a Resolve action, after
    navigating tabs, or after the backend creates new alerts.
    An operator who resolves alerts watches the badge stay stale
    until full reload.' Severity MEDIUM.
  - |-
    Alerts.md:stress_findings.resource_boundaries.cache —
    'No cache. Each tab visit re-fetches; totals fetched once
    on mount (Alerts.tsx:15-17) and never invalidated — that
    IS the staleness gap. After Resolve, totals.total still
    reflects pre-Resolve count until full page reload.'
  - |-
    Alerts.md:performance.known_performance_gaps.[totals-stale] —
    'Totals are fetched once on Alerts mount and never refreshed —
    operator who resolves an alert sees the badge stay stale
    (off-by-one) until they leave and re-enter /alerts.'
    Severity LOW (perf), but UX MEDIUM.
