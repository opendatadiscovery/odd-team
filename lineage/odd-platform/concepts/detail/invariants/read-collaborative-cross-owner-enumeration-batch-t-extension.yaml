description: |-
  **NEW INVARIANT, batch 2026-05-20T** — STRENGTHENS the master
  `read-collaborative-cross-owner-enumeration` invariant from 24-sidecar to
  28-sidecar by adding FOUR new controller-class layer evidence points across
  THREE distinct feature subsystems. Records the cross-batch evidence
  consolidation so the read-collaborative posture growth across batches
  A → T is traceable.

  THE 28-SIDECAR PATTERN END-TO-END (now batch-T-anchored):

    Prior 24 (per master invariant batches A-Q):
      Backend: getAllAlerts / getActivity / search / facets /
      getDataEntityDownstreamLineage / getDataEntityDetails /
      getDataEntityAlerts / getMyObjectsWithUpstream / getMyObjectsWithDownstream
      / getDataEntityGroupsLineage / ReactiveAlertRepositoryImpl /
      ReactiveLineageRepositoryImpl / ReactiveDataEntityRepositoryImpl /
      ReactiveSearchFacetRepositoryImpl / DataEntityServiceImpl /
      AlertServiceImpl / LineageServiceImpl / SearchServiceImpl
      UI: DataEntityDetails / fetchDataEntityDetails / LineageGraph /
      OwnersList / AppToolbar / PolicyList / RolesList / CollectorsList

    NEW batch T (+4 corroborating surfaces):
      **(y) ActivityController (class) — 25th corroborating sidecar**:
        controller-class layer view of the global Activity Feed read surface.
        NO @PreAuthorize, NO SecurityConstants.SECURITY_RULES entry for
        /api/activity or /api/activity/counts (full file read; zero matches
        for activity/Activity/ACTIVITY). Confirms the F-006 9-sidecar audit-silence
        pattern AT the read surface that surfaces what the schema-rooted scope
        can record. ActivityController.java:1-58 + SecurityConstants.java:95-356.
      **(z) DataQualityController (class) — 26th corroborating sidecar**:
        FOUR read endpoints (getDataEntityDataQATests, getDatasetTestReport,
        getSLA, getDatasetSLAReport) — NONE has a SecurityRule entry; falls
        through to global authenticated(); ReactiveDataQualityRepositoryImpl
        applies only HOLLOW + STATUS != DELETED filters with no OWNERSHIP join.
        The lone PUT (setDataQATestSeverity) RESPECTS owner-scoping via
        DATA_ENTITY AuthorizationManagerType — confirms ADR-CANDIDATE-114
        (read-cardinality split: per-entity reads unscoped, lone mutation
        owner-scoped). EXTENDS read-collaborative posture to P-04 Data Quality
        pillar — a NEW feature subsystem not previously catalogued in this
        invariant. NEW SUB-CLASS: 'authorization-asymmetry-within-controller'
        where MULTIPLE reads are unscoped + ONE mutation is gated.
      **(aa) DirectoryController (class) — 27th corroborating sidecar**:
        the FLAT-LIST inventory enumeration sibling of REFACTOR-203's
        graph-shaped vector. Adds a NEW dimension: enumeration of the
        DATASOURCE INVENTORY itself (every registered DataSource's ODDRN,
        host, database, prefix) plus per-type/per-source entity counts. NO
        other read surface in the cross-owner family exposes this datasource-
        cardinality dimension. Combined with the lineage graph (REFACTOR-203)
        and the catalog-shape enumeration is COMPLETE — topology + inventory
        roster. Cross-batch confirmation that the cross-owner posture extends
        to operational metadata, not just data-entity metadata. Companion
        new invariant: reflection-property-extractor-infrastructure-revealing
        amplifies the leak via ODDRN-derived host/database/port disclosure.
      **(bb) AppInfoController (class) — 28th corroborating sidecar**:
        the SIMPLEST instance of the read-collaborative posture — under DISABLED,
        an anonymous network caller reads `{authType, projectVersion}` without
        any authentication. Distinct shape from the others (deployment-metadata,
        not catalog-data) but the same architectural pattern: a read endpoint
        with no SecurityRule entry that becomes anonymous under DISABLED.
        Companion to REFACTOR-185 (19-sidecar DISABLED-mode bypass) — this
        controller-class layer view of AppInfo is REFACTOR-185's 19th evidence
        point AT the controller-class axis.

  **WHY 28 SIDECARS MATTERS**: the pattern is now anchored at FIVE feature
  subsystems (alerts, activity, data-entity, lineage, search, data-quality,
  directory, deployment-introspection) and at every layer (UI → API → service
  → SQL). The architectural posture is uniform; the doc-side silence on the
  posture is the actionable finding for the maintainer's DOC-NNN queue.

  **NEW SUB-CLASS surfaced in batch T**: 'authorization-asymmetry-within-controller'
  (DataQualityController) — N reads unscoped + 1 mutation owner-scoped within
  the same controller-class file. This pattern is CONSISTENT with the platform-wide
  convention (mutations centralised in SecurityConstants.SECURITY_RULES,
  owner-scoping via the appropriate AuthorizationManagerType) but is the FIRST
  evidence point where a single controller-class file contains BOTH halves of
  the asymmetry visibly. Future controllers should be classified by this
  asymmetry pattern (where applicable) for triage.

  Severity: MEDIUM (per master invariant — the posture is intentional per
  ADR-CANDIDATE-003 but undocumented; batch T extends the doc-gap surface
  to TWO new feature subsystems — P-04 Data Quality and the deployment
  introspection surface).
