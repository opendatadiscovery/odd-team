behaviour: |-
  **CRITICAL — End-to-end plaintext token chain at the controller tier: `POST /api/datasources` and `PUT /api/datasources/{id}/token` (DataSourceController) AND `POST /api/collectors` and `PUT /api/collectors/{id}/token` (CollectorController) all emit the full 40-character plaintext token in the HTTP response body. The platform's token-issuing API is "send-once over the wire" with NO mitigations (no `Cache-Control: no-store`, no `X-Sensitive-Body`, no Vary-by-auth response-marker, no documented warning).** Primary-source confirmed across batch-W DataSourceController + CollectorController sidecars + cross-link to existing batch-Q UI-tier finding + batch-R repository-tier finding:

  **Controller tier (this gap's surface)**:
  - `DataSourceController.registerDataSource` (lines 30-36) calls `dataSourceService.create(form)` → `tokenGenerator.generateToken()` → response via `ResponseEntity::ok(DataSourceMapper.mapDto(...))`. The mapper at `DataSourceMapper.mapDto` includes the full `TokenDto.value` (40 alphanumeric chars, plaintext).
  - `DataSourceController.regenerateDataSourceToken` (lines 53-59) calls `dataSourceService.regenerateDataSourceToken(id)` → `tokenGenerator.regenerateToken(existing)` → response via `ResponseEntity::ok`. Same full plaintext token in the response.
  - `CollectorController.registerCollector` (CollectorController.java:27-31) — same pattern: `ResponseEntity::ok` carrying the full plaintext token.
  - `CollectorController.regenerateCollectorToken` (CollectorController.java:47-51) — same pattern.
  - **Per the `TokenMapper.mapValue` branch at TokenMapper.java:15-18**: `dto.showToken() ? dto.tokenPojo().getValue() : "******" + dto.tokenPojo().getValue().substring(length()-6)`. The `showToken=true` flag is set at `ReactiveTokenRepositoryImpl.create` line 21 and `updateToken` line 30 — both branches RETURN the full plaintext.

  **Wire-tier (the leak vectors)**:
  - **Reverse proxies / API gateways**: any TLS-terminating proxy on the operator's deployment captures the response body. The platform's default deployment via Helm uses an ingress controller that logs at `level: debug` capturing full bodies; operators do not know to disable.
  - **Browser history + DevTools**: a Management → Datasources tab operator clicking `Add datasource` or `Regenerate token` issues the API call; the response body is captured in browser DevTools' Network tab AND in the browser's session HTTP cache (`Cache-Control: no-store` is absent).
  - **APM tools (Datadog APM, New Relic, Honeycomb)**: distributed-tracing agents capture HTTP request/response bodies for `/api/datasources*` and `/api/collectors*` paths by default. The plaintext token is in the trace.
  - **Server-side response loggers**: WebFlux's `ServerHttpResponseDecorator` is freely composable; many operator deployments wrap the response stream with a tee-logger for audit. The plaintext token is in the audit log.

  **Aggregate-chain (the multi-layer finding)**:
  This gap is the **third vertex** of the end-to-end plaintext-token-chain triangulation:
  - **Vertex 1 (batch-R repository-tier)**: tokens are stored in `TOKEN.value` column as plaintext (per concept `shared-secret-tokens-stored-plaintext`). At-rest plaintext.
  - **Vertex 2 (batch-Q UI-tier — CollectorsList.tsx)**: the UI renders the token to the DOM plaintext (no copy-to-clipboard masking, no on-screen scroll-clear). Plaintext in browser memory.
  - **Vertex 3 (THIS gap — controller-tier)**: the API response wire carries the plaintext. The complete chain is: **operator click → controller response wire (PLAINTEXT) → UI DOM render (PLAINTEXT) → repository write (PLAINTEXT)**. Every layer is plaintext; there is NO HMAC-equivalent / hash-equivalent that would let the operator capture the credential while the platform stores only a derived form. The S2S consumer (`IngestionDataSourceFilter` / `IngestionDataEntitiesFilter`) compares plaintext-to-plaintext.

  **Operator-visible consequences**:
  - An operator who screenshares their browser during a Datasources tab rotation leaks the new token in the screenshare.
  - An operator who clicks Regenerate while a corporate proxy logs request/response bodies leaks the new token to the proxy log.
  - An operator who exports their browser's network log for debugging leaks every token they've ever rotated.
  - A breach of the central observability platform (APM aggregator) yields every collector token across every datasource for every customer using that APM.

  **Why CRITICAL not MEDIUM (the sidecar's own rating)**: individual vertices are MEDIUM; the COMPLETE END-TO-END CHAIN is CRITICAL because the absence of ANY single-layer mitigation means the operator has NO recovery: there is no point at which the operator can capture the token while the platform retains only a derived form (no Bearer-token-derive-on-receipt, no HMAC-on-issue). The chain is "all or nothing"; any leak at any layer leaks the full credential.

  **Test gap shape**: regression-pin asserting that: (a) POST `/api/datasources` returns the plaintext token in the response body verbatim; (b) PUT `/api/datasources/{id}/token` returns the plaintext token; (c) POST `/api/collectors` returns the plaintext token; (d) PUT `/api/collectors/{id}/token` returns the plaintext token; (e) NO `Cache-Control: no-store` or sensitive-body markers are set on any response. The current state is PINNED — any future maintainer adding HMAC-on-issue / Vary-by-auth / no-store markers will see the test fail and must update both the wire contract AND the operator-facing docs in lockstep.
