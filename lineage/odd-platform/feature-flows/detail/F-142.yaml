pillar_anchored_feature_name: User-Owner Association Request Workflow
feature_name: |-
  User-Owner Association Request Workflow — the home-page user-binding
  surface where an authenticated user without an Owner mapping requests
  to be associated with one. A 4-branch state machine (form / pending /
  declined / approved) rendered conditionally on the home page,
  presupposed by F-064 (silent-empty My-views), gated by
  isShowOwnerAssociation predicate, and feeding the
  user_owner_mapping row that resolves F-011 (Principal-to-Owner
  Resolution).
seeded_from: ui-review-2026-05-26
seeded_at: 2026-05-26
status: ui-incomplete
primary_drift_class: owner_association_predicate_string_equality_disabled_no_normalisation_four_misconfiguration_scenarios
