name: Register Collector
canonical_in_docs: false
canonical_candidate: true
description: |-
  POST /api/collectors — gated by COLLECTOR_CREATE Permission
  (MANAGEMENT scope) at SecurityConstants.java:127-128. The
  controller's createCollector handler (CollectorController.java:22-31)
  is a one-line delegation to CollectorServiceImpl.create
  (CollectorServiceImpl.java:37-48, @ReactiveTransactional). The
  service: (1) generates a new token via tokenGenerator.generateToken()
  then persists via tokenRepository.create; (2) IF
  CollectorFormData.namespaceName is non-empty, calls
  namespaceService.getOrCreate (the side-door — see
  namespace-create-side-doors-cross-pillar-4-sister-services
  invariant); (3) maps the FormData + token + namespace to a
  CollectorPojo via CollectorMapper; (4) collectorRepository.create
  inserts the row. Returns 200 (controller line 27) BUT OpenAPI
  declares 201 (openapi.yaml:557-563) — status-code drift class.
  Returns the full plaintext 40-char alphanumeric token in the
  response body via TokenDto(..., true) showToken=true; same
  plaintext-everywhere chain as regenerateCollectorToken (see
  collector-plaintext-token-chain-controller-tier-closure batch W
  invariant).
axes_present:
  - controllers
nodes:
  - odd-platform java CollectorController controller-class:CollectorController
contributors:
