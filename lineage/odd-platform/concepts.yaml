  - name: "Metrics Ingestion"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Operator-selected metrics-storage subsystem driven by `metrics.storage` (`INTERNAL_POSTGRES` default vs `PROMETHEUS`). PROMETHEUS mode writes Prometheus-shaped time series via the Prometheus remote-write protocol to `metrics.prometheus-host`/api/v1/write (Snappy-compressed) and queries via `/api/v1/query`. Mirrored bean structure: `extractors/external/Counter|Gauge|Histogram|SummaryTimeSeriesExtractor` (gated `havingValue=\"PROMETHEUS\"`) vs `extractors/internal/Counter|...|MetricsSeriesExtractor` (gated `havingValue=\"INTERNAL_POSTGRES\", matchIfMissing=true`). Per-MetricType extractor dispatch via `extractors.stream().filter(canExtract).findFirst()` — new MetricType support is add-a-class. vocabulary_status: codebase-anchored, doc-side-covered (live `/configuration-and-deployment/odd-platform#metric-storage-backend` enumerates both modes and documents `metrics.prometheus-host` + the Prometheus `--web.enable-remote-write-receiver` runtime requirement — verified WebFetch 2026-05-10)."
    vocabulary_status: "codebase-anchored, doc-side-covered"
    axes_present:
      - config_prefixes
    nodes:
