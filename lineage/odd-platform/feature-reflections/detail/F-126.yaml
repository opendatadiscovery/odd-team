- id: H-003
  hypothesis: |-
    When an operator looks for a recently RESOLVED alert on the global Alerts page (any of the three
    tabs), they can find it.
  derivation: |-
    Tab label "All" + the general user expectation that an alert inbox retains resolved items as history;
    the live doc was historically read as promising "open and resolved".
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      All three global list queries (listAllWithStatusOpen, listByOwner, listDependentObjectsAlerts) carry
      a hard-coded ALERT.STATUS = OPEN predicate. RESOLVED and RESOLVED_AUTOMATICALLY alerts never appear on
      any global tab. There is no `status` query parameter on getAllAlerts / getAssociatedUserAlerts /
      getDependentEntitiesAlerts — ALERT.STATUS is an available-but-unused column on the list API. The
      resolved alert IS still reachable via a single data entity's Alerts tab (getAlertsByDataEntityId has
      no status filter), so the data is not lost — but the global page cannot surface it. NOTE: this is the
      same finding the F-007 reflection already filed as PLT-121; the live alerting doc has since been
      CORRECTED to state "they list OPEN alerts only" (WebFetch 2026-06-03), so this is no longer a doc-drift
      — it is a label-vs-behaviour drift on the UI tab named "All".
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveAlertRepositoryImpl.md
        section: bugs_limitations_corner_cases + owner_scoping
        cite: "ReactiveAlertRepositoryImpl.java:142-145, 160-166, 217-230"
        note: "all three global queries hard-filter STATUS=OPEN."
      - sidecar: odd-platform__ts__react-component__component__Alerts.md
        section: stress_findings.request_inputs.tab-route
        cite: "AlertController.java:36-57 + ReactiveAlertRepositoryImpl.java:182-199"
        note: "no status param on list endpoints; getAlertsByDataEntityId (per-entity) has no status filter — the data exists there."
    operator_visible_failure: |-
      An operator who resolves an alert (or whose colleague does) and later returns to the global Alerts
      page to confirm/review it cannot find it on any of the three tabs — the tab labelled "All" shows
      open-only. Failure modes: (1) the operator assumes the alert was purged by housekeeping and either
      re-investigates the underlying issue from scratch or files a support ticket about "lost alerts";
      (2) an auditor reconstructing an incident timeline from the global page sees only currently-open
      alerts and misses the resolved history; (3) the only recovery path (open the specific data entity's
      Alerts tab) is non-obvious because nothing on the global page hints that resolved alerts live elsewhere.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_ref: ""

- id: H-004
  hypothesis: |-
    When an unprivileged user (no Owner association, no admin role) — or, under auth.type=DISABLED, an
    anonymous caller — reaches /alerts/all, the platform restricts what they can see, or at minimum frames
    the All tab as a privileged platform-wide view before showing cross-owner data.
  derivation: |-
    Pillar P-09 cross-pillar relationship (security gates reads) + the live doc's "stewards and admins"
    audience language + the normal expectation that a platform-wide surface is access-controlled.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      There is no gate at any layer. (1) The frontend route /alerts/* has NO WithPermissionsProvider
      wrapper (contrast LookupTables at App.tsx:75-87). (2) getAllAlerts has no @PreAuthorize; GET /api/alerts
      has no entry in SecurityConstants.SECURITY_RULES, so it falls through to the catch-all
      pathMatchers('/**').authenticated(). (3) listAllWithStatusOpen has no owner/role predicate. Under
      LOGIN_FORM/OAUTH2/LDAP any authenticated user reads every OPEN alert across the platform; under
      auth.type=DISABLED the endpoint is anonymously reachable. The bare-/alerts auto-redirect to /alerts/all
      (AlertsRoutes.tsx:18) combined with the My/Dependents tabs being hidden for unprivileged users means
      the cross-owner All tab is the ONLY visible tab and the DEFAULT landing — there is no framing that
      "All" means platform-wide. This is the operator-visible manifestation of REFACTOR-024.
    evidence:
      - sidecar: odd-platform__java__AlertController__controller-method__getAllAlerts.md
        section: implicit_adrs + security.known_security_gaps
        cite: "AlertController.java:35-41 + SecurityConstants.java:98-295 + AuthorizationCustomizer.java:29-30"
        note: "no SecurityRule for GET /api/alerts → catch-all .authenticated() only."
      - sidecar: odd-platform__ts__react-component__component__Alerts.md
        section: security.known_security_gaps + bugs_limitations_corner_cases
        cite: "App.tsx:64 vs App.tsx:75-87 + AlertsRoutes.tsx:18"
        note: "no UI route-guard; bare-/alerts redirects onto the cross-owner All tab by default."
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveAlertRepositoryImpl.md
        section: security.data_exposure
        cite: "ReactiveAlertRepositoryImpl.java:143-156 + AlertServiceImpl.java:185"
        note: "payload includes entity names, triager owner/username, and alert-chunk descriptions (AlertManager generatorURL embeds internal monitoring host)."
    operator_visible_failure: |-
      Failure modes, ordered by blast radius: (1) DISABLED-mode internet-facing deployment — any anonymous
      network caller enumerates every open alert: data-entity names, the OIDC/LDAP usernames of whoever
      triaged each one, and free-text alert-chunk descriptions which for AlertManager-forged alerts embed
      the Prometheus generatorURL (often an internal monitoring hostname). (2) Authenticated-but-unprivileged
      user under LOGIN_FORM/OAUTH2/LDAP — a read-only viewer with no ownership lands by default on a feed of
      every team's broken pipelines, framed as "All" with no signal that this is privileged platform-wide
      data. (3) The implicit UX framing "alerts = the whole platform" (because All is the only visible tab
      for unprivileged users) trains operators to triage other teams' alerts. NOTE: per the read-collaborative
      ADR (REFACTOR-024) the cross-owner read under authenticated modes is DELIBERATE; the DISABLED-mode
      anonymous reach and the absence of any framing are the load-bearing failures here.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_ref: ""

- id: H-005
  hypothesis: |-
    When a signed-in user who IS a registered Owner opens the "My Objects" tab, they see exactly the OPEN
    alerts on the entities they own — and the page's count/pagination reflects that owner-scoped set.
  derivation: |-
    Tab label "My Objects" + endpoint /api/alerts/my (listByOwner) which JOINs OWNERSHIP on the caller's owner id.
  seed_source: view-mode
  validation:
    verdict: partial
    actual_behavior: |-
      The ITEM LIST is correct: listByOwner JOINs OWNERSHIP on the caller's owner id (resolved at the service
      via authIdentityProvider.fetchAssociatedOwner) and filters STATUS=OPEN + DATA_ENTITY.STATUS != DELETED.
      BUT the pagination TOTAL is wrong on the empty-result path: listByOwner passes
      countAlertsWithStatusOpen() (platform-wide count) as the empty-record total counter into pageifyResult,
      instead of countAlertsWithStatusOpenByOwner(ownerId). pageifyResult consults the empty-record counter
      only when the result set is empty — so an owner with ZERO owned-entity alerts gets a Page whose total
      reports the platform-wide open-alert count, not 0.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveAlertRepositoryImpl.md
        section: bugs_limitations_corner_cases + owner_scoping
        cite: "ReactiveAlertRepositoryImpl.java:160-179 (line 177 countAlertsWithStatusOpen())"
        note: "wrong empty-result total counter; expected countAlertsWithStatusOpenByOwner(ownerId)."
      - sidecar: odd-platform__java__service__service__AlertServiceImpl.md
        section: downstream_side_effects (listByOwner row)
        cite: "AlertServiceImpl.java:82-87"
        note: "service resolves the caller's owner and forwards to the owner-scoped repo method — list scoping is correct."
    operator_visible_failure: |-
      An owner who has no alerts on their owned entities opens My Objects, sees an empty list (correct), but
      the pagination metadata / any total-derived UI reports a non-zero count (the platform-wide open total).
      The discrepancy "the list is empty but the total says 42" is confusing and erodes trust in the count;
      if any UI element drives off Page.total (e.g. a "showing 0 of 42" string or a load-more affordance), it
      misbehaves. Surfaces ONLY on the zero-owned-alert path, which is exactly the common case for a new owner.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_ref: ""

