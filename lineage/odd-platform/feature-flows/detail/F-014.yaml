control_summary: |-
  0 of 4 cells COVERED. Feature emerges from batch-L primary-source audit
  of the controller method + the service flatMap chain + the repository
  query shape + the SecurityConstants rule list + the AuthorizationCustomizer
  catch-all + the live alerting page workaround text. Nine substantive
  drift facets cluster around three load-bearing themes: (1) cross-owner
  per-entity alert read — the REFACTOR-024 catalog-wide enumeration
  pattern extended to a per-entity surface, with the audit-export
  workaround as the doc-named primary use case but no doc clarity on
  the access model; (2) soft-delete-inclusive existence check creates
  a cross-channel leak — alerts visible while the entity is hidden from
  the catalog UI; (3) read/write SecurityRule asymmetry — alert_config
  PUT is rule-gated while alerts GET is not, with no inline defence of
  the convention. The highest-leverage probe candidates are: (a)
  cross-owner enumeration — configure two unrelated Owners + create
  alerts on entity X owned by user B + as user A (with no permission
  on X) issue GET /api/dataentities/{X-id}/alerts + assert 200 with the
  full alert history (pins the cross-owner posture); (b) soft-deleted
  entity read — flip data_entity.status to DELETED for entity X with
  prior alerts + GET /api/dataentities/{X-id}/alerts + assert 200 with
  the alerts (pins the cross-channel leak); (c) unbounded pagination —
  POST size=1_000_000 + assert server response size / latency under load
  (pins the unbounded-size facet). Local docker-compose probe stack:
  ODD platform + Postgres + two seeded Owners + alerts on entities each
  owns + a soft-deleted entity with prior alerts.
