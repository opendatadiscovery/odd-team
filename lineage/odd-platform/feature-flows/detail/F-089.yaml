test_matrix_notes: |-
  No test coverage of the Host-header-derived redirect mechanism.
  Integration target: set up platform behind nginx with X-Forwarded-Host
  honoured; configure Azure with permissive logout URL allowlist
  (https://*.example.com/); click logout from victim.example.com with
  crafted X-Forwarded-Host: attacker.example.com; assert the IdP-issued
  302 redirects to attacker.example.com.
