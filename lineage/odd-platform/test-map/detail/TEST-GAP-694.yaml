behaviour: |-
  **`AlertServiceImpl.handleExternalAlerts` STRIPS THE TIMEZONE FROM `ExternalAlert.startsAt` — the embedded generator URL points to a Prometheus query window keyed by the SERVER'S local time, not the alert's actual timestamp.** Lines 67-68 declare `ALERT_MANAGER_TIME_FORMATTER` with pattern `yyyy-MM-dd HH:mm:ss` — no timezone. `ExternalAlert.startsAt` (ExternalAlert.java:14) is `LocalDateTime` (timezone-naive). Jackson's default `LocalDateTime` deserialisation silently strips the offset from AlertManager's RFC3339 payload. Lines 162-172 embed the naive timestamp in the URL query params `g0.moment_input` / `g0.end_input` of the embedded generator URL. An operator clicking the link sees no data because the Prometheus query window is off (offset by the server's UTC delta + the alert's source timezone). The fix is straightforward: switch `ExternalAlert.startsAt` to `OffsetDateTime` or `ZonedDateTime` + adjust the formatter pattern. The test pins the CURRENT timezone-naive behaviour to make the fix deliberate.
