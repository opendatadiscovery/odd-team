evidence:
- 'getActivity.md says: ''fetchDependentActivities walks the lineage graph via DataEntityRelationsService.getDependentDataEntityOddrns(lineageStreamKind)
  — the resulting set of dependent oddrns is NOT filtered by the caller''s ownership'''
- 'concepts.yaml:entities[Activity Feed].security_aggregate.owner_scoping verbatim:
  ''BYPASSES (UPSTREAM/DOWNSTREAM — lineage-scoped, not caller-owner-scoped)'''
cross_references:
