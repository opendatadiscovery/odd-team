description: |-
  **STRENGTHENED INVARIANT, batch 2026-05-13G — 5-sidecar; ADR-CANDIDATE-003
  RESOLVED as DELIBERATE; batch 2026-05-19H — 8-sidecar with two repository-layer
  SQL primary-source confirmations; batch 2026-05-19I — 11-SIDECAR with FOUR
  service-layer service-tier confirmations; batch 2026-05-19J — 14-SIDECAR with
  THREE UI-LAYER REALISATION-POINT CONFIRMATIONS; batch 2026-05-19L —
  15-SIDECAR with a new PER-ENTITY ALERT-READ surface; batch 2026-05-19M —
  19-SIDECAR with the ANCHOR-SET-DEFENCE AUDIT family (DEG-lineage +
  /my/upstream + /my/downstream + facet-aggregator suite); BATCH 2026-05-20-Q —
  24-SIDECAR with the OWNER-DIRECTORY READ surface (OwnersList — GET
  /api/owners has NO SecurityRule entry) + UI-shell unconditional rendering
  (AppToolbar Management tab visible to all authenticated users) + 3
  Management list components confirming UI-tier consistency; **BATCH
  VAL-LSN-019-B (2026-05-20) — 27-SIDECAR with the Activity feature
  THREE-TIER confirmation (controller-class + service + repository) —
  HTTP → service → SQL uniformity for the Activity feature, mirroring
  the same pattern already established for Tag / Alert / Search /
  Owner-directory features** —
  Repository-wide read-side posture: GET / read-shaped endpoints fall through
  to pathMatchers('/**').authenticated() and return data across owners with
  no owner predicate.

  **TWENTY-SEVEN corroborating surfaces** all share the same admin-path-without-
  admin-gate failure mode:
  (a) getAllAlerts; (b) getActivity; (c) search;
  (d) getDataEntityDownstreamLineage; (e) getDataEntityDetails (CENTERPIECE
  READ); (f) ReactiveAlertRepositoryImpl.listAllWithStatusOpen (REFACTOR-024
  SQL); (g) ReactiveLineageRepositoryImpl.getLineageRelations (REFACTOR-203 SQL
  — graph-shaped enumeration sink); (h) ReactiveDataEntityRepositoryImpl
  (every list-shape method lacks principal/owner parameter);
  (i) DataEntityServiceImpl (10 of 22 public methods owner-unaware);
  (j) AlertServiceImpl (listAll + getTotals.total + getDataEntityAlerts
  BYPASSES); (k) LineageServiceImpl (NEGATIVE-CASE SIBLING — no anchor-set
  defence-in-depth); (l) DataEntityDetails React component (batch J — UI
  REALISATION POINT); (m) fetchDataEntityDetails redux-thunk (batch J — UI
  REALISATION POINT); (n) LineageGraph React component family (batch J — UI
  REALISATION POINT); (o) getDataEntityAlerts controller method (batch L —
  PER-ENTITY ALERT-READ SURFACE);
  (p) getMyObjectsWithUpstream controller method (batch M — POSITIVE CASE
  WITH SINGLE-POINT-OF-FAILURE); (q) getMyObjectsWithDownstream controller
  method (batch M — SYMMETRIC SIBLING); (r) getDataEntityGroupsLineage
  controller method (batch M — DEG-ANCHORED WIDEST-BLAST SURFACE);
  (s) SearchController.facets (batch M — CATALOG-CARDINALITY-DISCOVERY
  SURFACE);
  (t) OwnersList React component (batch Q — OWNER-DIRECTORY READ surface);
  (u) AppToolbar React component (batch Q — UI SHELL surface);
  (v) PolicyList React component (batch Q — Management catalogue UI surface);
  (w) RolesList React component (batch Q — Management catalogue UI surface);
  (x) CollectorsList React component (batch Q — Management catalogue
  UI surface);
  **(y) ActivityController controller-class (batch VAL-LSN-019-B — Activity
  HTTP-tier 25th corroborating surface)**: line-by-line verified —
  ZERO @PreAuthorize on class or methods; zero entries in
  SecurityConstants.SECURITY_RULES for /api/activity or /api/activity/counts;
  zero entries in WHITELIST_PATHS; falls through to pathMatchers('/**')
  .authenticated(); under DISABLED reachable anonymously. The 25th
  corroborating surface and the FIRST sidecar confirming the Activity
  feature at the controller-class layer (vs the prior per-method
  getActivity sidecar);
  **(z) ActivityServiceImpl (batch VAL-LSN-019-B — Activity service-tier 26th
  corroborating surface)**: line-by-line verified lines 33-273 —
  ZERO @PreAuthorize, ZERO programmatic permissionService calls, ZERO
  permission predicates. Even getDataEntityActivityList (the per-entity
  read path) accepts a dataEntityId parameter without any per-entity
  authorization check (S-D-3 — any authenticated user reads activity
  for ANY data entity including entities they have no permission to view).
  The 26th corroborating surface and the FIRST sidecar confirming the
  Activity feature at the service-tier;
  **(aa) ReactiveActivityRepositoryImpl (batch VAL-LSN-019-B — Activity
  repository-tier 27th corroborating surface)**: read paths
  (findAllActivities, findDependentActivities, findDataEntityActivities)
  issue cross-owner SELECTs and rely entirely on caller-side filter
  parameters for narrowing. No SQL-tier ownership filter, no
  row-level security. The 27th corroborating surface and the FIRST
  sidecar confirming the Activity feature at the SQL primary-source
  layer. The HTTP→service→SQL uniformity is now confirmed for the
  Activity feature — same pattern as Tag / Alert / Search /
  Owner-directory.

  **Live docs do not warn about this posture on any of the surfaces**. The
  pattern is the platform deliberate stance (ADR-CANDIDATE-003 —
  read-collaborative tradeoff: ODD catalog is intentionally cross-owner-
  readable to facilitate cross-team collaboration). Batches F/H/I confirmed
  the posture is uniform end-to-end (HTTP → service → SQL). Batch J confirms
  the posture is uniform UI → API → service → SQL — the UI provides no
  compensating defence, no permission-aware UI, no owner-scoping toggle.
  **Batch L** adds the per-entity Alert-read surface. **Batch M** adds the
  ANCHOR-SET-DEFENCE AUDIT family. **Batch Q** completes the cross-cutting
  evidence — the read-collaborative posture extends to the OWNER directory
  (NOT just data entities), to the UI shell (the Management tab itself is
  unconditional), and to every Management catalogue list (Policy / Role /
  Owner / Collector — all readable to any authenticated user). **Batch
  VAL-LSN-019-B** completes the cross-tier evidence for the Activity feature:
  HTTP-tier (ActivityController class) + service-tier (ActivityServiceImpl)
  + repository-tier (ReactiveActivityRepositoryImpl) all confirm the
  read-collaborative posture for the Activity audit feed.
