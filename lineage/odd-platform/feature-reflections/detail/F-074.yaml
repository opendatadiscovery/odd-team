    /api/namespaces, they receive HTTP 200 with the full directory — no
    permission, no role, and no owner-scope restricts the read.
  derivation: |-
    None of the seven list endpoints is in SecurityConstants.SECURITY_RULES; all
    fall through to AuthorizationCustomizer's catch-all .authenticated(); there is
