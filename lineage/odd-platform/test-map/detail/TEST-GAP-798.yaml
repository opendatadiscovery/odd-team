proposed_action: |-
  Add `SlackNotificationSenderRetryAfterIgnoredRegressionPinTest`. Unit test stubbing `HttpClient.send(...)` to return a controlled HttpResponse:

  1. `slack429RateLimitWithRetryAfter_treatedAsGenericFailure_alertLost_pinsHeaderIgnored` —
     - Stub `HttpClient.send(...)` to return `HttpResponse` with statusCode=429, headers={"Retry-After": "30"}, body='{"error":"rate_limited"}'.
     - Invoke `slackSender.send(message)`.
     - Assert `NotificationSenderException` is thrown.
     - Assert the exception message does NOT include "429", does NOT include "Retry-After", does NOT include "rate_limited".
     - Assert NO `Thread.sleep(...)` was invoked (verify via a Mockito-static spy on Thread).
     - PINS the current undifferentiated handling.

  2. `slack200_returnsNormally_pinsHappyPath` — stub statusCode=200; assert no exception, no retry.

  3. `slack4xxOther_treatedSameAs429_pinsUniformErrorHandling` — stub statusCode=400 vs 429; assert BOTH throw NotificationSenderException with the SAME message format (proving the lack of differentiation).

  4. `slack429RateLimit_scheduledRetryAfter30Seconds_resendsAlert_confirmsFixDirection` — (UPDATE this test once REFACTOR-NNN adds the scheduled-retry branch)
     - After REFACTOR-NNN: stub the first send to return 429 + Retry-After: 5; assert the message is re-sent after 5 seconds.
     - CONFIRMS the fix's effectiveness.

  Pair with REFACTOR-NNN (status-class branching + scheduled retry) and DOC-GAP-NNN (live doc rate-limit caveat).

  Coherence note (LSN-018 Rule 6): This finding STRENGTHENS TEST-GAP-457 (which pins absence of client-side rate-limit) by pinning the specific sub-surface "Retry-After header is ignored". No contradiction — both are load-bearing for the rate-limit story. NET-NEW finding at the Retry-After-specific granularity.
