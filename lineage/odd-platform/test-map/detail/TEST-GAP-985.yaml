proposed_action: |-
  Add `ReactiveDataQualityRunsTableHealthTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/`. Six test methods:
  1. `getLatestTablesHealth_allTestsSuccessOnDataset_classifiedHealthy` — seed 1 dataset + 3 DQ-tests, all latest-runs=SUCCESS; assert tablesHealth.healthyTables=1, errorTables=0, warningTables=0.
  2. `getLatestTablesHealth_oneFailedLatestRun_classifiedError` — seed 1 dataset + 3 tests, one latest=FAILED; assert errorTables=1, healthyTables=0.
  3. `getLatestTablesHealth_oneBrokenLatestRun_classifiedError` — same shape but BROKEN; assert errorTables=1.
  4. `getLatestTablesHealth_oneSkippedAmongSuccesses_classifiedWarning_pinsSubtleGap` — 1 dataset + 3 tests, two SUCCESS one SKIPPED; assert warningTables=1, healthyTables=0. PIN the subtle non-SUCCESS-means-NOT-HEALTHY rule.
  5. `getLatestTablesHealth_mutuallyExclusiveAcrossBuckets_pinsCTEAlgebraInvariant` — seed 10 datasets across all 3 classifications; sum healthy+error+warning; assert sum equals total datasets with at least one DQ test.
  6. `getLatestTablesHealth_datasetWithoutAnyDQTest_absentFromAllThreeBuckets` — seed a dataset with NO DQ test; assert it's in NEITHER healthy NOR error NOR warning; the table-health ring excludes it. PIN the with-test-only clause.

  Pair with DOC-NNN: surface the classification rules on the live `data-quality/dashboard` doc page. Operator's mental model needs explicit rules to align with the SQL's algebra.
