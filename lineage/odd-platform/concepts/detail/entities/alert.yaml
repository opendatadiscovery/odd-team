name: Alert
canonical_in_docs: true
canonical_candidate: false
description: 'Platform-detected and externally-injected issues against catalog entities,
  including failed jobs, data-quality test failures, schema incompatibilities, and
  distribution anomalies. Three visibility scopes: All / My Objects (owner-linked)
  / Dependents (downstream-by-lineage). Alert lifecycle: OPEN (Platform creates) →
  RESOLVED (Operator) / RESOLVED_AUTOMATICALLY (Platform when condition clears) (AlertController
  + alert openapi-tag sidecars).'
axes_present:
- controllers
- openapi_tags
- ui_routes
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertController
- odd-platform openapi tags openapi-tag:alert
- odd-platform ts routes route:alerts
- odd-platform java AlertController controller-method:changeAlertStatus
- odd-platform java AlertController controller-method:getAllAlerts
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityController
contributors:
- 'AlertController: entities[Alert, AlertList, AlertStatusFormData, AlertTotals]'
- 'openapi-tag:alert: entities[Alert, AlertList, AlertStatus, AlertStatusFormData,
  AlertTotals]'
- 'alerts route: entities[Alert, AlertTab (all/my/dependents)]'
- 'AlertController.changeAlertStatus: entities[Alert, AlertStatus, AlertStatusFormData]'
- 'AlertController.getAllAlerts: entities[AlertList, Page]; operations[list-open-alerts-platform-wide
  (paged, no filter)]'
- 'DataEntityController: getDataEntityAlerts / getDataEntityAlertsCounts / getAlertConfig
  / updateAlertConfig (per-entity alert listings + halt config)'
