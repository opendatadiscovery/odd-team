- id: H-002
  hypothesis: |-
    When an operator clicks Delete and the confirmation dialog says the entity
    "will be deleted permanently", confirming actually deletes it permanently —
    the entity and its footprint are gone.
  derivation: |-
    The three ConfirmationDialogs ship near-identical text promising permanent
    deletion; that is the literal user-facing promise on screen.
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |-
      The delete is neither unconditional NOR permanent. (1) It is a GUARDED
      soft-delete: if any live referent exists the operator gets HTTP 400 and
      NOTHING is deleted (H-001) — the dialog's "will be deleted permanently"
      over-promises destruction. (2) When it does succeed it sets deleted_at =
      NOW() — the row, and for DataSource its token + FTS vector + historical
      child entities, all PERSIST in the database (deleteDataSource.md:understanding;
      OwnerServiceImpl.md:downstream_side_effects). The word "permanently" is
      wrong in both directions: the dialog implies unconditional irreversible
      destruction; the reality is conditional, blockable, and a soft-delete that
      retains the row (and frees the name for reuse via the partial unique index).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItem.md
        section: implicit_adrs
        cite: "DataSourceItem.tsx:58-74"
        note: "dialog text 'Are you sure you want to delete this datasource?' — no cascade-block forewarning"
      - sidecar: odd-platform__java__DataSourceController__controller-method__deleteDataSource.md
        section: stress_findings.name_behavior_pairs
        cite: "DataSourceController.java:47-51 + DataSourceServiceImpl.java:85-96"
        note: "DRIFT_NAME_VS_BEHAVIOR — 'delete' is a guarded soft-delete"
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: implicit_adrs
        cite: "OwnerServiceImpl.java:97-98"
        note: "soft-delete UPDATE; row persists with deleted_at set (name-reuse)"
    operator_visible_failure: |-
      (a) The operator who reads "deleted permanently" and is then blocked with
      a 400 is confused — they were told it would be destroyed unconditionally.
      (b) The operator who wants a HARD delete (e.g. removing a name they
      mistyped, or purging PII) believes the row is gone — it is not; the
      soft-deleted Owner is still readable by-id (OwnerServiceImpl.md:bugs[9]
      visibility asymmetry), the soft-deleted DataSource's token persists as a
      plaintext secret at rest (deleteDataSource.md:security), and the name is
      silently freed for a future collision. (c) The word "permanently" makes an
      operator MORE likely to hesitate over a reversible action and LESS likely
      to understand that referents block it.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: |-
    When an operator clicks Delete on a DataSource that is actively ingesting
    (has live data entities), the UI tells them — in product terms — why the
    delete failed and what to do, and the dialog recovers to a usable state.
  derivation: |-
    A senior PO expects the cascade-block 400 to surface as comprehensible
    guidance, not a stuck modal; this is the convenience + intuitiveness UX seed.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      On the 400, the thunk calls showServerErrorToast surfacing the RAW backend
      string ("Data source cannot be deleted: there are still data entities
      attached") in a generic red toast, AND ConfirmationDialog's onConfirm does
      action().then(close).catch(() => {}) — the .catch SWALLOWS the rejection,
      so handleClose() is never called (the modal stays open) and
      setIsLoading(false) is never called (the confirm button stays
      spinner-locked). The operator is left with a stuck-loading modal plus a
      backend-jargon toast and zero in-product guidance to stop the collector or
      soft-delete the entities first (DataSourceItem.md:bugs[1],
      ConfirmationDialog.tsx:28-34).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItem.md
        section: bugs_limitations_corner_cases
        cite: "DataSourceItem.tsx:31,58-74 + ConfirmationDialog.tsx:28-34 + errorHandling.tsx:48-68"
        note: ".catch(() => {}) swallows the 400; modal never recovers; raw backend toast"
    operator_visible_failure: |-
      The operator sees a permanently-spinning Delete button on an open modal
      that never closes, plus a red toast carrying database-implementation jargon.
      They cannot tell whether the delete is in progress, failed, or hung. The
      only escape is to dismiss the modal manually (if the overlay allows) or
      reload the page. They are given no hint that the fix is to remove the
      data entities (or stop the collector) — and per H-004 the source is
      effectively undeletable while the collector runs.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    release_gated_update:   # CTRIB-027 correction + CTRIB-031 fix / odd-platform#1766 — flips at 0.29.0 (canonical record: F-031 H-005)
      note: |
        Cross-referenced to F-031 H-005's release_gated_update (the canonical record for this same
        ConfirmationDialog class — not duplicated here):
        (1) FACTUAL CORRECTION (CTRIB-027, live 2026-06-22): the "stuck-loading / spinner-locked modal"
            actual_behavior above is the TanStack mutateAsync arm's symptom. DataSource delete is THUNK-wired,
            so on the cascade-block 400 it SILENT-CLOSES (closes-as-success), it does not stick spinning. #1771
            also made the error toast render on both arms (a toast now shows; the "raw backend jargon" point holds).
        (2) FIX (release-gated 0.29.0): CTRIB-031 / #1766 ARM-2 — the thunk consumers now `.unwrap()`, so a
            refused DataSource delete keeps the dialog open with the error instead of closing-as-success (PLT-233).
