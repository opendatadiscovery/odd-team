notes: "NEW cross-cutting hygiene invariant captured in batch 2026-05-12F.\n2-sidecar\
  \ primary-source triangulated (batch E + F).\n\nThe drift has shipped — test suites\
  \ lock in the implementation,\nnot the spec. A fix to align EITHER side must coordinate:\n\
  \  - Fix the spec (declare 200 everywhere): silently changes the\n    contract for\
  \ downstream SDK consumers; aligns to test reality.\n  - Fix the implementation\
