proposed_action: |-
  Add `TagUpdateResponseShapeTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Two test methods:
  1. `updateTag_responseBody_omitsExternalAndUsedCount_pinsCurrentPartialFill` — `PUT /api/tags/{id}` on a tag that HAS usage relations; assert the response body's `usedCount` is null/absent and `external` is null/absent (the current `mapToTag(TagPojo)` behaviour). PIN the current state.
  2. `getPopularTagList_responseBody_populatesExternalAndUsedCount_documentsTheInconsistency` — `GET /api/tags`; assert the same `Tag` JSON shape DOES carry `usedCount` and `external` populated. Co-locating these two tests documents the cross-endpoint inconsistency.

  Pair with REFACTOR-NNN: switch `TagServiceImpl.update`'s terminal map to the `mapToTag(TagDto)` overload (re-read via `getDto` after persist). When the fix lands, test #1 inverts to assert the fields ARE populated, matching the OpenAPI `Tag` schema and `getPopularTagList`.
