security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - INTERNAL_ONLY
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: BYPASSES
    detail: |-
      The WAL consumer + dispatcher operate at the database-replication layer —
      Postgres-level credentials (a REPLICATION-role-granted DB user), not platform
      RBAC. The `AlertNotificationMessageProcessor` is a Spring @Component invoked
      from the WAL-consumer thread; no @PreAuthorize, no programmatic permission
      check. Operates with full platform privileges via DSLContext using the
      platform's datasource credentials. The fan-out is unconditional: every
      configured Slack/webhook/email channel receives every alert regardless of
      which Owner is attached to the alerted entity.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The AlertNotificationMessage payload INCLUDES `dataEntity.owners[]` (owner
      name + title) populated by `AlertNotificationMessageTranslator#fetchAlertedDataEntity`,
      but the dispatcher does NOT consult them for routing. Every channel sees
      every alert regardless of the alerted entity's Owner.
  strengths:
  - |-
    Durability via WAL streaming — the replication slot retains WAL until the
    consumer advances setAppliedLSN/setFlushedLSN; platform crashes mid-delivery
    are replayed on restart (one of only two outbound-delivery durability mechanisms
    in the platform, alongside the 202+queue+advisory-lock pattern for
    DataCollaboration)
  - |-
    Leader-elected single-thread consumer prevents duplicate delivery across
    cluster replicas — advisory lock id 100 ensures one cluster-wide active
    subscriber
  - |-
    Disabled-by-default — `notifications.enabled=false` is the gate read by
    NotificationsFeatureCondition directly from the Spring Environment; bean
    does not exist if absent
  weaknesses:
  - |-
    **Poison-message WAL replay loop (HIGH severity — NEW invariant batch K)** —
    a translation failure (unknown alert-type code, missing FK on
    alerted-data-entity row, null type_id) inside `translate()` bypasses the
    dispatcher's per-sender catch and reaches `NotificationSubscriber.java:90`'s
    outer catch. NotificationSubscriber logs, releases the lock, waits 10s, and
    re-acquires. The SAME WAL LSN is re-delivered indefinitely with 10s back-off
    between cycles, blocking subsequent WAL messages from being processed. No
    DLQ, no skip-poison, no manual `setAppliedLSN` advance — operators with a
    persistently-bad row must clean it up manually OR drop the replication slot
    (which also drops all in-flight undelivered alerts).
    (NotificationsDispatcher.md:bugs_limitations_corner_cases.[6])
  - |-
    **Exception-type asymmetry between sender impls (HIGH severity — NEW
    invariant batch K)** — the dispatcher's per-sender try/catch catches
    `NotificationSenderException` (checked) only. `EmailNotificationSender`
    wraps `MessagingException | TemplateException | IOException` as
    `new RuntimeException(...)` at EmailNotificationSender.java:59, NOT as
    `NotificationSenderException`. Email failure therefore BYPASSES the
    catch and aborts fan-out for that message — subsequent senders (if email
    is not last in the list) do NOT receive the alert. Contradicts the
    implicit catch-and-continue ADR for one channel only.
    (NotificationsDispatcher.md:bugs_limitations_corner_cases.[0])
  - |-
    Lazy-create-no-drop replication-slot mechanic — operator owns cleanup;
    renaming replication-slot-name between deployments orphans the prior slot
    and Postgres retains WAL for it indefinitely, risking primary disk
    exhaustion. (NotificationsProperties.md — existing finding)
  - |-
    No delivery audit, no DLQ, no retry — failed deliveries are logged at ERROR
    and the message is treated as delivered from the dispatcher's perspective;
    setAppliedLSN advances unconditionally. Operators have NO database record
    of which alert went to which channel with what status.
    (NotificationsDispatcher.md:bugs_limitations_corner_cases.[1])
  - |-
    PII surface — full AlertNotificationMessage payload (dataEntity.{id, name,
    dataSourceName, namespaceName, owners[]}, downstream[] lineage) → every
    Slack channel + webhook endpoint + email inbox, no redaction.
    (NotificationsDispatcher.md:bugs_limitations_corner_cases.[8])
  cross_file_inconsistencies:
  - |-
    Live `/features/active-platform-features/notifications` says "every channel
    that is enabled" receives every alert (TRUE per code) but does NOT mention
    the exception-type asymmetry: email failures abort fan-out (RuntimeException
    not caught), Slack/webhook failures do not (NotificationSenderException
    caught). Operator-facing framing is incomplete.
  - |-
    Live `/configuration-and-deployment/odd-platform#enable-alert-notifications`
    warns about manual cleanup of the replication slot but does NOT warn about
    the rename-orphan scenario (operator renames `notifications.wal.replication-slot-name`
    between deployments; prior slot retained by Postgres until manual drop).
  contributing_files:
  - NotificationsDispatcher.md
  - NotificationsProperties.md
  - EmailSenderProperties.md
  evidence:
  - NotificationsDispatcher.md:security.owner_scoping
  - NotificationsDispatcher.md:security.known_security_gaps.[0,1,2]
  - NotificationsDispatcher.md:bugs_limitations_corner_cases.[0,6]
  - NotificationsProperties.md:bugs_limitations_corner_cases.[12] (replication-slot orphan)
performance_aggregate:
  overall: LOW
  hot_paths:
  - |-
    Per WAL message: translate() runs (a) one multi-statement jOOQ read of
    alert_chunk + alerted-data-entity join + recursive downstream-lineage CTE
    bounded by notifications.message.downstream-entities-depth, then (b)
    sequential for-loop calling .send(...) on every NotificationSender
    synchronously. End-to-end per-alert latency ≈ (DB roundtrips for
    translation) + Σ (per-channel network RTT including potential SMTP hang).
    Single-thread WAL consumer on leader only — cluster-wide throughput
    bounded by the dispatcher's serial latency.
    (NotificationsDispatcher.md:performance.hot_paths.[0])
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Single-thread WAL consumer per cluster (leader-elected at advisory lock
      id 100). No batching — one HTTP/SMTP roundtrip per alert per channel.
      Backpressure on WAL stream: while dispatcher's process() runs, upstream
      stream.readPending() blocks; subsequent WAL messages queue in Postgres
      replication-slot buffer until dispatcher returns.
      (NotificationsDispatcher.md:performance.throughput_characteristics)
  scaling_shape:
    verdict: STATEFUL_LOCKED
    detail: |-
      Stateful at the cluster level — Postgres advisory lock id 100 + named
      replication slot + named publication. Horizontal scaling = exactly one
      active subscriber. Sender bean order is Spring-injection-order-dependent
      and not stably configurable; slow senders run in undefined position
      relative to fast senders, affecting per-alert tail latency.
      (NotificationsDispatcher.md:performance.scaling_characteristics)
  strengths:
  - |-
    Single shared HttpClient bean across Slack + Webhook senders — connection
    reuse
  - |-
    Polling loop sleeps 10ms between empty readPending() calls — bounded idle
    CPU baseline
  - |-
    Recursive downstream CTE bounded by notifications.message.downstream-entities-depth
    (default 1) — bounded translation cost at default
  weaknesses:
  - |-
    **No rate-limiting — bursty alert events translate 1:1 into outbound
    deliveries (HIGH severity)** — Slack will rate-limit (429); platform has
    no retry-with-backoff. Dispatcher catches the failure, logs, drops the
    alert from that channel.
    (NotificationsDispatcher.md:performance.known_performance_gaps.[0])
  - |-
    Synchronous fan-out — one slow sender stalls all subsequent senders for
    the same alert; misconfigured webhook with 30s SLA blocks Slack and email
    delivery for THAT alert. (NotificationsDispatcher.md:performance.known_performance_gaps.[1])
  - |-
    Poison-message replay — translation failure triggers
    NotificationSubscriber's outer catch → 10s back-off → re-acquire → same
    WAL LSN re-delivered indefinitely; persistently-bad row blocks WAL stream.
    (NotificationsDispatcher.md:performance.known_performance_gaps.[3])
  - |-
    Empty-senders DB cost — translate() runs even when no senders are
    configured; recursive CTE executed on every WAL event for zero delivery.
    (NotificationsDispatcher.md:performance.known_performance_gaps.[2])
  - |-
    No backlog metric / no delivery metric / no failure-by-channel metric —
    operators cannot detect "notifications stuck" without log inspection.
    (NotificationsDispatcher.md:performance.known_performance_gaps.[4])
  cross_file_inconsistencies: []
  contributing_files:
  - NotificationsDispatcher.md
  - NotificationsProperties.md
  - EmailSenderProperties.md
  evidence:
  - NotificationsDispatcher.md:performance.hot_paths.[0]
  - NotificationsDispatcher.md:performance.throughput_characteristics
  - NotificationsDispatcher.md:performance.scaling_characteristics
  - NotificationsDispatcher.md:performance.known_performance_gaps.[0-4]
notes: |-
  NEW concept captured in batch 2026-05-19K. Architectural anchor for the
  platform's outbound-notification durability pattern. The WAL consumer +
  Postgres replication slot is one of TWO outbound-delivery durability
  mechanisms in ODD Platform (the other being the 202+queue+advisory-lock
  pattern used by DataCollaboration's Slack sender). The two patterns differ
  in queue mechanism:
    - WAL Consumer (this concept): Postgres logical-replication WAL streaming
      from the ALERT table; consumed by leader-elected single-thread; the
      replication slot retains WAL until consumer advances setAppliedLSN.
      Durability: survives platform crashes — re-delivers from last applied LSN.
    - 202+queue+advisory-lock (DataCollaboration): in-table queue read via
      polling SELECT; consumed by leader-elected single-thread.
      Durability: survives platform crashes — re-reads queue rows on restart.

  Cross-cutting connections:
    - This is the load-bearing architectural pattern for P-07 Active Platform
      Features (Notifications sub-feature) — the platform's outbound surface
      for alert events.
    - Pairs with the "Notifications" concept which captures the operator-facing
      config + sender chain; this concept captures the WAL-consumer +
      dispatcher mechanic.

  Recommended canonicalisation paths:
    (a) Add "Notifications WAL Consumer" as a named architectural pattern in
        the system-mission's "Architectural pillars" list (currently lists
        platform-server, producer-ecosystem, ui-spa, metadata-store,
        ingestion-api-wire-contract, ingestion-pipeline; this would be a
        7th: outbound-notification-pipeline).
    (b) Document the poison-message replay loop limitation on the live
        `/features/active-platform-features/notifications` page — operators
        running ODD with notifications enabled need to know that a
        persistently-bad ALERT row blocks all subsequent alert delivery.
    (c) Document the exception-type asymmetry — operators choosing channel
        order matter (put email LAST in the sender order to minimise the
        bypass-by-RuntimeException blast radius).
