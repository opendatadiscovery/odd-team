realism_caveats: |
  The probe pins the BYPASS hypothesis via the OwnershipServiceImpl callsite
  (`OwnerServiceImpl.java:52`). If the assertions PASS, the OWNER_CREATE
  permission documented at the live `/permissions` page is NOT the sole gate
  on Owner directory writes; the platform exposes three side-channel paths
  through different permissions. Doc-gap-finder should add an OWNER_CREATE
  caveat to the live permissions page.

  Realism caveats:
  - The probe uses the OwnershipServiceImpl path only; the OwnerAssociationRequestServiceImpl
    and TermOwnershipServiceImpl callsites are NOT exercised. A follow-up
    probe could exercise all three; the current probe is sufficient to
    confirm the class of bug.
  - The probe assumes the LOGIN_FORM session-cookie endpoint accepts a
    probe-user with a custom password; if the stack uses LDAP/OAUTH2 only,
    the arrange-section needs to be adjusted. The odd-minimal profile is
    expected to ship LOGIN_FORM by default.
  - The probe role's permission JSON shape MAY not match the actual production
    policy schema exactly (the schema is derived from PolicyServiceImpl /
    PermissionDto enums); a real probe-runner pass should validate the JSON
    against the live `/api/policies` POST endpoint's accepted shape before
    relying on the assertion semantics.
  - If the assertions FAIL (the side-channel owner does NOT appear), the
    hypothesis is wrong; possible explanations: (a) the OwnershipServiceImpl
    flow has an undocumented OWNER_CREATE check upstream of `getOrCreate`
    that this analyser missed; (b) the probe's permission setup is incorrect
    and the user actually has OWNER_CREATE indirectly. Re-check the policy
    JSON and the SecurityConstants list against the probe-runner's evidence
    before concluding the analyser was wrong.
