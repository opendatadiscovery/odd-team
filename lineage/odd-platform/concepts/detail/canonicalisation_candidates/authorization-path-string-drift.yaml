proposed_canonical: Authorization path-string drift
rationale: 'DataEntityController sidecar surfaces a verified production failure (the
  `/term` vs `/terms` mismatch silently disabling DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM
  gates). Reinforced by uploadFileChunk method-level: the gate evaluates against URL''s
  data_entity_id while the file row resolves by uploadId — a different shape of path-vs-identity
  drift (cross-entity hijack). Reinforced AGAIN by LDAP `containsIgnoreCase` admin
  match (LDAPSecurityConfiguration@L51 batch C): name-based authorization via substring
  match invites substring-collision admin escalation. The ADR-level pattern (path-pattern
  + name-based wired authorization) is the root cause; multiple concrete failure modes
  exist.'
contributing_concepts:
- term path mismatch in SECURITY_RULES (DataEntityController)
- cross-entity uploadId hijack (uploadFileChunk)
- containsIgnoreCase substring-collision admin escalation (LDAPSecurityConfiguration)
- Authorization layer is path-string-coupled with no compile-time or test-time guard
  against drift (DataEntityController)
suggested_add_to_docs: false
