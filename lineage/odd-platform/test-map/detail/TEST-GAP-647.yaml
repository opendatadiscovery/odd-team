proposed_action: |-
  Stand up `OwnerForm.integration.test.tsx` test `empty_roles_destructive_update_is_reachable_in_three_clicks_no_confirmation`. Mount OwnerForm pre-seeded with an existing Owner `{ id: 1, name: 'Alice', roles: [{id: 10}, {id: 20}] }`; assert formState.isValid initially true; click the X icon on the first role TagItem; assert formState.isValid REMAINS true (regression-pin against future role-required validation); click the X on the second; assert isValid still true; assert Save button is enabled; assert NO ConfirmationDialog component is mounted in the DOM (regression-pin: future fix that adds a confirmation modal breaks this test, forcing intentional re-authoring); click Save; assert `updateOwner({ ownerId: 1, ownerFormData: { name: 'Alice', roles: [] } })` is dispatched. The pin freezes the CURRENT dangerous UX; a fix that adds role-required validation OR a confirmation modal will break the test AND surface to /review for explicit security-pillar approval. Pair with `delete_owner_has_confirmation_dialog_demonstrating_ux_asymmetry` test that pins the existing Delete-confirmation modal on EditableOwnerItem, surfacing the asymmetry side-by-side.
