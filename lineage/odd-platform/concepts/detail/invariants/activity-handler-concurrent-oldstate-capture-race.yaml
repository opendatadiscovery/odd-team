evidence:
- |-
  ActivityHandler.md:tests_coverage_semantic.uncovered_behaviours —
  Verbatim: "OLD-vs-NEW state race under concurrent mutations of the
  SAME data entity — getContextInfo captures pre-mutation state; the
  wrapped mutation runs; getUpdatedState captures post-mutation state.
  If a SECOND concurrent @ActivityLog-annotated method also captures
  pre-mutation state BEFORE its mutation runs, both transactions see
  the pre-A state as their oldState, but one sees post-A+post-B state
  and the other sees only post-A state — the diff records collide."
  Severity HIGH.
- |-
  ActivityServiceImpl.md:stress_findings.S-E-1 — confirms the TX
  boundary depends on the wrapping caller. Under @ActivityLog's
  @ReactiveTransactional + Postgres R2DBC default READ COMMITTED, two
  concurrent @ActivityLog flows on the same entity each see the
  pre-mutation snapshot independently
- |-
  ActivityAspect.java:86 — `filter(newState ->
  !info.getOldState().equals(newState))` is JSON-string equality, NOT
  an integrity check; the filter passes the wrong-oldState case
- |-
  ActivityHandler.java:9-22 — the interface contract: getContextInfo
  + getUpdatedState are the two snapshot methods; no protection
  primitive built into the interface for concurrent same-entity
  scenarios
