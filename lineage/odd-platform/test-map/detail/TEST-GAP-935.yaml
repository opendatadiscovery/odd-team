proposed_action: |-
  Author RoleControllerListForkTest with three caller-shape fixtures: ADMIN,
  non-ADMIN-with-roles, non-ADMIN-no-roles. Assert: (a) ADMIN sees full
  catalog paginated per request; (b) non-ADMIN sees only their own attached
  roles, hasNext=false, page/size ignored; (c) no-roles non-ADMIN sees empty
  items, hasNext=false. Pin the divergent contract — a future "consolidation"
  of the two list paths would silently widen visibility AND would change the
  pagination contract; only this test catches the regression. Also pin the
  page=-1/size=-1 boundary behaviour to document and lock the current
  forward-no-validation semantics.
