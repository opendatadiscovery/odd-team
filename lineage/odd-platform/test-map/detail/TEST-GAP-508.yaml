behaviour: |-
  Circular DEG-nesting CTE unbounded-recursion regression-pin (MEDIUM — P-05+P-08 cross-pillar). `getDEGEntitiesOddrns` (`ReactiveGroupEntityRelationRepositoryImpl.java:177-204`) has no termination guard other than 'no new GROUP_ODDRN matches'. For a pathological circular DEG-membership (DEG A contains DEG B contains DEG A), the CTE could loop indefinitely — Postgres's recursive-CTE `UNION ALL` does NOT deduplicate intermediate rows; only the `selectDistinct` at the final wrap deduplicates the FINAL result. The DEG-creation paths do NOT actively prevent circular DEG nesting at the application layer (verified by sidecar's Grep: no DEG-cycle check anywhere). For a 5-level deep nested DEG with 1000 members at each level, intermediate row count can reach 5000+; for true circular nesting the row count could exceed memory bounds. The pathological case is constructible by ANY authenticated operator with `DATA_ENTITY_ADD_TO_GROUP` permission — this is a self-DoS surface accessible to legitimate operators (mistakes), and a deliberate-DoS surface accessible to authenticated attackers. The cure is either (a) add a cycle-detection clause to the recursive CTE, (b) clamp recursion depth at the application layer, or (c) prevent circular DEG creation at the write path. NO test exists exercising the cycle case. Cross-pillar P-05 (Data Lineage performance) + P-08 (Management — DEG creation validation gap).
