        section: "concepts.invariants[4] + bugs_limitations_corner_cases[1]"
        cite: "AbstractContextualPermissionExtractor.java:25-35 (no cache) + LoginFormSecurityConfiguration.java:74-82 + GrantedAuthorityExtractor.java:12-14"
        note: "Per-call recompute (fresh) EXCEPT LOGIN_FORM static admin authority returns ALL regardless of DB policy state."
    operator_visible_failure: |
