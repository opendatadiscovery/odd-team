behaviour: |-
  **HIGH — Statically-visible UI bug in `RelationshipsListItem.tsx:73-81`:
  the Target column renders Source data for every row.** The Target cell is
  declared with `dataEntityId={item.sourceDataEntity.id}` /
  `name={item.sourceDataEntity.internalName || item.sourceDataEntity.externalName || ''}` /
  `oddrn={item.sourceDataEntity.oddrn || ''}` — identical to the Source cell
  at lines 64-72. The `item.targetDataEntity` field IS available on the
  `DataEntityRelationship` interface and IS consumed correctly by sibling
  components (`elements/Relationships/RelationshipTypes/EntityRelationship.tsx:33-35`
  and `GraphRelationship.tsx:32-34`); the bug is a copy-paste in the row
  renderer only.

  Operator-visible consequence: every row of the
  `/data-modelling/relationships` table shows the SAME dataset in both the
  Source and Target columns. The user has no way to see what each
  relationship POINTS TO from the list page. The bug is pure DOM
  observation — `Source.href == Target.href` for every row.

  **The doc page at `https://docs.opendatadiscovery.org/features/data-modelling/relationships`
  (WebFetched 2026-05-26, status 200)** explicitly describes the table as
  having distinct "Source entity, Target entity" columns:
  - "A table displaying 'Name, Type (ERD or GRAPH), Namespace + Datasource,
    Source entity, Target entity'"
  - The doc is RIGHT; the code is WRONG.

  **Why this regressed**: the bug is type-correct (`item.sourceDataEntity.id`
  is a number per the OpenAPI-generated DTO; TypeScript cannot detect
  copy-paste between two identically-shaped fields). The build doesn't catch
  it. Zero tests exist that target `RelationshipsListItem` (Grep across
  `odd-platform-ui/src/` for `RelationshipsListItem` in `*.test.*` /
  `*.spec.*` returned zero matches at commit 4ec2b20).

  **Why this is operator-load-bearing**: relationships are the THIRD column
  of the operator's catalog navigation (Data Modelling → Relationships).
  The Target column is THE essential information for the feature — the
  user opens the page to see "what relates to what". A bug that shows
  `A → A` for every row makes the feature functionally useless until the
  user clicks through to a relationship's detail page (where the type-
  specific rendering at `OverviewRelationshipStats/OverviewRelationshipType/*.tsx`
  uses `targetDataEntity` correctly).

  **A single integration test would catch this**: assert `Source !== Target`
  on a seeded relationship row where source and target are distinct data
  entities. The current zero-test posture means the bug ships green and is
  caught only by an operator filing a defect report.

  P-167 Block D (the relationships sidecar's emitted probe) pins the
  runtime confirmation that the bug is operator-visible.
