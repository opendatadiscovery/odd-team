name: GenAI Assistant
canonical_in_docs: true
canonical_candidate: false
description: |-
  Opt-in proxy from a single platform endpoint (`POST /api/genai/ask`)
  to an external AI service the operator runs. The platform does not embed an LLM.
  API-only today (no in-app UI affordance). Three-key configuration (`genai.enabled`
  request-time gate, `genai.url` + `genai.request_timeout` baked into genAiWebClient
  at startup) (GenAIController + GenAIProperties sidecars; main-concepts.md `## AI
  aspects` names this as 'GenAI assistant').

  **STRENGTHENED batch ZK (2026-05-26)** — GenAIProperties REV-2
  (file-analyser/0.4.0) re-enriches the prior reading with Stress Protocol
  categories, Category F request-input analysis, upstream_callers,
  downstream_side_effects, and probes P-178/P-179/P-180. The
  DRIFT_NAME_VS_BEHAVIOR between `genai.request_timeout` (YAML key naming
  'request timeout') and the underlying `HttpClient.responseTimeout(...)`
  call is now formally pinned — the YAML key suggests how long to wait
  while SENDING the request, but the implementation is the time to wait
  for the REPLY after sending. Live doc page describes the behaviour
  correctly as 'outbound response timeout'; the operator-facing YAML key
  preserves the misleading promise.
axes_present:
- controllers
- config_prefixes
nodes:
