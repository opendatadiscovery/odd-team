# Data Collaboration — Slack-integrated Discussions tab — product-owner reflection

## product_owner_narrative

Data Collaboration is one of P-07 Active Platform Features' five opt-in subsystems — the one that turns a data entity's detail page into a place where a team can *talk about the data where the data lives*, with the conversation mirrored into a Slack channel they already watch (per system-mission.md P-07 sub-feature seed "Data Collaboration (Slack OAuth + Events API webhook; ... bidirectional)"). The promise to a customer is concrete: on every Data Entity you get a **Discussions** tab; you pick a Slack channel, type a message, and it posts to Slack as the ODD bot; when a teammate replies in that Slack thread, the reply shows up back on the entity's Discussions tab — a two-way bridge so the audit/annotation conversation is not lost in Slack scrollback (per `postMessageInSlack` sidecar understanding + EventApiController sidecar understanding). The audiences are the platform-operator who wires up the Slack app + the bot token, and the odd-platform-ui-end-user who posts and reads from the Discussions tab (per DataCollaborationController sidecar audiences). It is OFF by default — `datacollaboration.enabled=false` (application.yml:205) — so a default deployment ships none of this surface (per DataCollaborationFeatureCondition.java:18-22).

How a user interacts with it: the feature has FOUR HTTP endpoints across TWO controller classes (per F-038 chain hops 2 + 2.5). Outbound, from the Discussions tab UI: a channel-picker autocomplete (`GET /api/datacollaboration/providers/slack/channels`) that lists the bot's joined public channels filtered by what you type; a Send action (`POST /api/datacollaboration/providers/slack/messages`) that returns `202 Accepted` and enqueues the message for an advisory-lock-elected background sender to deliver to Slack (per `postMessageInSlack` sidecar understanding); and an "Open in Slack" button per message (`GET /api/messages/{message_id}/url`) that 302-redirects the browser to the Slack permalink (per DataCollaborationController.java:41-49). Inbound, from Slack itself: `POST /api/slack/events` receives Slack's Events API webhooks — it answers Slack's one-time URL-verification CHALLENGE and, for thread replies whose parent matches a tracked ODD message, enqueues a `message_provider_event` row that an async processor materialises into a child message (per EventApiController sidecar understanding).

The working parts, described as the user lives them: the channel autocomplete shows only public channels the bot has been *invited to* (excludeArchived + ConversationType.PUBLIC_CHANNEL + `Conversation::isMember` filter — per DataCollaborationController sidecar invariants), cached for 60 seconds, and matched by **prefix** (`name.startsWith(query)`) not substring — so typing the middle of a channel name finds nothing (SlackMessageProviderClient.java:52). Sending is fire-and-forget: you get `202 Accepted` immediately and the actual Slack post happens later under a single-leader sender with a fixed-3 retry budget (per `postMessageInSlack` sidecar concepts.operations); if Slack rejects the message the row flips to `ERROR_SENDING` but nothing pushes that failure back to you on the HTTP surface (per `postMessageInSlack` sidecar bugs[4]). The inbound bridge only mirrors *thread replies on messages ODD itself sent* — non-thread chatter is filtered and ack'd-200 at parse time (per EventApiController implicit_adrs[2]).

The integration story: F-038 is the OAuth-bot-token twin of F-009 (WAL-driven outbound alert fan-out) — both are P-07 Slack-outbound features sharing the Slack SDK, but with entirely different auth models (F-009 uses an incoming-webhook URL; F-038 uses a `chat.postMessage` bot token) and reliability postures (per F-038 control_summary cross-feature note + related_features F-009). The Discussions tab is mounted on the same Data Entity Details chrome that fires F-001's view-count chain (per F-038 cross_pillar_relationships P-01). And the four endpoints add the 20th-22nd surfaces to the REFACTOR-185 DISABLED-mode auth-bypass cluster shared with F-008 (per F-038 related_refactoring_scopes).

Edge cases a product owner would flag in a demo, and which dominate this reflection: the inbound webhook performs **zero Slack signature verification** and is whitelisted from authentication in all four auth modes (per EventApiController bugs[0,1]); the Send endpoint lets any authenticated user attach a message to **any** `data_entity_id` in any Slack channel the bot can reach, with no owner/read scope (per `postMessageInSlack` sidecar security.known_security_gaps[0,2]); the "Open in Slack" redirect trusts Slack's permalink **verbatim** with no host/scheme check, and returns `200`-empty (not `404`) for a non-existent message — making it a message-existence oracle (per DataCollaborationController bugs[0,2]); and Slack's at-least-once delivery + a missing unique constraint means duplicate Slack deliveries materialise **duplicate** Discussion messages (per EventApiController bugs[2]). Notably, the live doc page — which was 404 at substrate time — now exists and (via DOC-204, done) already documents five of these as operator caveats (per WebFetch 2026-06-01). The entire data-collaboration package has **zero** automated test coverage at the odd-platform-api level (verified identically across all three sidecars' tests_coverage_semantic.gaps).

## hypotheses

- id: H-001
  hypothesis: |-
    "When I open the channel-picker on the Discussions tab and type the middle
    of a channel's name (e.g. `platform` to find `#odd-platform-alerts`), the
    autocomplete shows that channel."
  derivation: |-
    Endpoint `GET .../slack/channels` takes a `channel_name` query param feeding
    a UI autocomplete (SlackChannelsAutocomplete) — the universal autocomplete
    UX promise is substring match.
  seed_source: endpoint-shape
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |
      The filter is `slackChannel.name().startsWith(nameLike)` — a PREFIX match,
      not a substring/contains match. Typing `platform` returns zero results for
      `#odd-platform-alerts` even though the channel exists in the bot's joined
      set. The UI's 500ms-debounced autocomplete (SlackChannelsAutocomplete.tsx:43-54)
      drives this filter on every keystroke; the only feedback is an empty
      dropdown. Compounded by a 60-second Caffeine cache and the bot-must-be-invited
      gating, the autocomplete is narrower than the user's mental model in three
      independent ways.
    evidence:
      - sidecar: odd-platform__java__DataCollaborationController__controller-class__DataCollaborationController.md
        section: invariants + bugs_limitations_corner_cases
        cite: "SlackMessageProviderClient.java:52"
        note: "startsWith(nameLike), not containsIgnoreCase"
      - sidecar: odd-platform__java__DataCollaborationController__controller-class__DataCollaborationController.md
        section: stress_findings.name_behavior_pairs
        cite: "SlackAPIClientImpl.java:30-47 + SlackMessageProviderClient.java:47-56"
        note: "bot-invited public channels only; 60s cache layered on top of the prefix filter"
    operator_visible_failure: |
      A user searching the channel-picker by the most memorable middle-of-name
      token gets an empty dropdown and concludes the channel is unavailable —
      they cannot post their Discussion to the channel they actually want. Worst
      case they pick a wrong-but-prefix-matching channel and the message lands in
      the wrong Slack channel. There is no on-screen hint that the match is
      prefix-only (the live api-reference says only "optionally filtered by
      `channel_name`").
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-002
  hypothesis: |-
    "When a Slack thread reply appears on my entity's Discussions tab, the
    platform verified that the event actually came from Slack (it is a genuine
    Slack delivery, not a forgery)."
  derivation: |-
    Negative-space + pillar promise: a 'Slack callback' endpoint
    (`POST /api/slack/events`) named and documented as the Slack receiver carries
    the implicit promise that inbound events are authenticated as Slack-origin;
    Slack's own protocol mandates X-Slack-Signature HMAC verification.
  seed_source: negative-space
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |
      The controller binds ONLY `@RequestBody Mono<String>` and reads NO headers;
      a grep across the whole codebase for `X-Slack-Signature`, `signing.secret`,
      `verifySignature`, `HMAC.SHA256` returns zero matches. There is no signature
      check anywhere on the chain. Worse, `/api/slack/events` is whitelisted from
      authentication in ALL four auth modes (WHITELIST_PATHS for OAUTH2/LDAP,
      `permittedPaths` for LOGIN_FORM, permit-all for DISABLED). Any internet host
      that can reach the platform port can POST a JSON shaped like a Slack
      thread-reply event; if its `thread_ts` matches a tracked ODD message's
      `provider_message_id`, the forged reply is enqueued and later materialises
      into a child message row on that entity's Discussions tab.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: bugs_limitations_corner_cases
        cite: "EventApiController.java:22-27 + SlackEventParser.java:22-23"
        note: "raw body only; no header read; zero signature primitives in the codebase"
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: security.known_security_gaps + auth_gates
        cite: "SecurityConstants.java:95-96 + LoginFormSecurityConfiguration.java:49-51 + AuthorizationCustomizer.java:22-23 + DisabledAuthSecurityConfiguration.java:13-17"
        note: "all four auth modes whitelist the path"
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: security.data_exposure
        cite: "SlackMessageProviderEventHandler.java:31-35 + DataCollaborationMessageEventProcessor.java:88-127"
        note: "forged content appears in the Discussions tab if thread_ts matches a tracked message"
    operator_visible_failure: |
      (1) Forgery: an unauthenticated attacker injects fabricated thread replies
      into any tracked entity's Discussions tab, attributing arbitrary text to
      arbitrary Slack authors — the catalog's collaboration record is no longer
      trustworthy. (2) The challenge-echo (`{type:url_verification}` -> echoes the
      caller's `challenge` verbatim) is an unauthenticated liveness oracle that
      confirms the endpoint exists and will echo arbitrary content. (3) Combined
      with the no-dedup gap (H-005), a captured genuine event can be replayed N
      times to amplify the pollution. The operator who followed the docs to wire
      up the Slack callback believes they configured a Slack receiver; they
      published an unauthenticated public write endpoint into their catalog.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-003
  hypothesis: |-
    "When I send a Discussion message, I can only attach it to a data entity I am
    allowed to see/own, and only to a channel surfaced for that entity — the
    platform enforces who-can-post-where."
  derivation: |-
    Pillar RBAC promise (P-09 gates every mutation) + the natural expectation
    that a per-entity Discussions feature scopes posting to entities the user can
    access. POST body fields `data_entity_id` + `channel_id` name the scope.
  seed_source: pillar
  sme_consultation_recommended: true
  sme_consultation_question: |-
    Do data-catalog operators (DataHub / Amundsen / OpenMetadata discussions
    surfaces) treat per-entity discussions as a deliberately read-collaborative
    capability (any authenticated user may post on any entity) or do they scope
    posting to entity owners/readers? This determines whether the cross-owner
    POST is a deliberate posture to document or a defect to fix.
  sme_consultation_archetype: comparative
  validation:
    verdict: contradicted
    actual_behavior: |
      There is no `@PreAuthorize`, no SecurityConstants.SECURITY_RULES entry for
      `/api/datacollaboration/**`, and no programmatic permission check in
      `DataCollaborationServiceImpl.createAndSendMessage`. The service checks only
      that the `data_entity_id` EXISTS and is not hollow — it never checks the
      caller may see/own that entity, and never checks an (entity, allowed-channel)
      mapping. Any authenticated user (any role, under LOGIN_FORM/OAUTH2/LDAP; any
      anonymous caller under DISABLED) can attach a message to ANY data_entity_id
      in the catalog and post it to ANY Slack channel the bot has joined —
      including entities in namespaces they cannot otherwise read and channels the
      autocomplete never offered them.
    evidence:
      - sidecar: odd-platform__java__DataCollaborationController__controller-method__postMessageInSlack.md
        section: security.known_security_gaps
        cite: "SecurityConstants.java:96-355 + AuthorizationCustomizer.java:29-30 + DataCollaborationServiceImpl.java:47-62"
        note: "no authz gate; existence-checked but not owner/read-scoped"
      - sidecar: odd-platform__java__DataCollaborationController__controller-method__postMessageInSlack.md
        section: security.known_security_gaps[3]
        cite: "DataCollaborationController.java:34-37 + SlackAPIClientImpl.java:50-62"
        note: "channel_id fully user-supplied; no (data_entity, allowed_channels) server-side mapping"
    operator_visible_failure: |
      Cross-tenant message injection: user A attaches a message to an entity
      owned by team B and posts it into team B's Slack channel as the ODD bot —
      bypassing the namespace read-isolation the rest of the catalog enforces.
      Because posting happens as the shared bot identity and (for owner-less users)
      records ownerId=null, the in-product trail of WHO posted is anonymous within
      the deployment. The live doc DOES now state the read-collaborative posture
      ("none of them carry an RBAC permission"), but the *cross-owner write to any
      entity + any channel* dimension (not just "any user can use the feature") is
      not framed as the data-isolation breach it is, and no code item proposes
      either a gate or a deliberate-design ADR.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-004
  hypothesis: |-
    "When I click 'Open in Slack' on a Discussion message, the browser is taken
    to that message inside Slack (a slack.com URL) — and to nowhere else."
  derivation: |-
    Response field `Message.url` = `/api/messages/{uuid}/url` + the redirect
    endpoint's name promise ("Redirects user to correspondent message in the
    provider"); the user expects a redirect bounded to Slack.
  seed_source: response-shape
  sme_consultation_recommended: false
  validation:
    verdict: partial
    actual_behavior: |
      Under Slack's normal operation the redirect IS to a slack.com permalink, so
      the happy-path promise holds. BUT the controller emits a 302 to
      `URI.create(providerUrl)` where `providerUrl` is whatever Slack's
      `chat.getPermalink` returned, UNCONDITIONALLY — no host check (e.g.
      `.endsWith("slack.com")`), no scheme check (a `javascript:` value would be
      emitted verbatim), no malformed-URI guard (a malformed value throws
      IllegalArgumentException -> 5xx). The trust assumption "Slack returns a
      slack.com URL" is enforced nowhere in the controller->service->client chain.
      The promise holds in practice and breaks the moment Slack's contract changes
      or the bot's Slack app is compromised to return a crafted permalink.
    evidence:
      - sidecar: odd-platform__java__DataCollaborationController__controller-class__DataCollaborationController.md
        section: bugs_limitations_corner_cases + invariants
        cite: "DataCollaborationController.java:42-48 + SlackAPIClientImpl.java:83-95"
        note: "providerUrl from chat.getPermalink consumed verbatim; no host/scheme/structure validation"
    operator_visible_failure: |
      Open-redirect class: if Slack ever returns (or is manipulated to return) a
      non-slack.com URL, the platform 302s the user's browser there — and a
      `javascript:`-scheme value emitted into a Location header / rendered in the
      UI is a stored-XSS vector on the entity's Discussions tab. The blast radius
      is bounded by Slack's API integrity, which is the SOLE defence; the cost of
      a host allowlist is one regex check. This is a DIFFERENT defect from the
      302-vs-301 status drift (PLT-009) on the same endpoint.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-005
  hypothesis: |-
    "When the same Slack thread reply is delivered to ODD more than once (Slack's
    normal retry behaviour), it appears on the Discussions tab exactly once."
  derivation: |-
    Negative-space: Slack documents at-least-once delivery with retries; a user
    expects de-duplication so one Slack reply == one Discussion message.
  seed_source: negative-space
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |
      `message_provider_event` (V0_0_59__data_collaboration.sql:25-39) has NO
      unique constraint on (provider, event_id) — only a BIGSERIAL PK and an FK on
      the parent. `createMessageEvent` (ReactiveMessageRepositoryImpl.java:136-155)
      is a plain INSERT with no ON CONFLICT. A duplicated Slack delivery for the
      same event inserts N rows; the processor materialises N child message rows
      with N distinct uuids but the same provider_message_id. Downstream
      `getUUIDByProviderInfo` has no LIMIT 1, so on multi-row matches it returns an
      arbitrary first row (order-undefined). The controller also ignores Slack's
      `X-Slack-Retry-Num` header that would let it detect a retry.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: bugs_limitations_corner_cases[2] + resource_boundaries
        cite: "ReactiveMessageRepositoryImpl.java:136-155 + V0_0_59__data_collaboration.sql:25-39 + DataCollaborationMessageEventProcessor.java:88-101"
        note: "no unique constraint, no ON CONFLICT, no LIMIT 1 on the downstream lookup"
    operator_visible_failure: |
      The same Slack reply renders two-to-four times on the same entity's
      Discussions tab seconds apart (one per Slack retry). Workspace admins seeing
      duplicate messages lose confidence in the bridge. Combined with H-002 (no
      signature check), an attacker can replay one captured event N times to
      amplify pollution. The order-undefined `getUUIDByProviderInfo` means
      thread-reply association can resolve to a different child message run-to-run.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: |-
    "When I request the Slack URL for a message id that does not exist, the
    platform tells me it does not exist (404)."
  derivation: |-
    Endpoint shape `GET /api/messages/{message_id}/url` + REST convention: a
    GET-by-id for a missing resource returns 404.
  seed_source: endpoint-shape
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |
      `getMessageProviderIdentity` binds BOTH `MESSAGE.UUID.eq(messageId)` AND
      `MESSAGE.CREATED_AT.eq(UUIDHelper.extractDateTimeFromUUID(messageId))` (a
      UUIDv1 covering-index assist). For a non-existent id (or a non-v1 UUID whose
      extracted timestamp is wrong) the inner Mono is empty; WebFlux maps an empty
      controller Mono to `200 OK` with NO body — there is no
      `switchIfEmpty(Mono.error(new NotFoundException(...)))` anywhere on the
      chain. A caller cannot distinguish "message does not exist" from "message
      exists but Slack returned no permalink".
    evidence:
      - sidecar: odd-platform__java__DataCollaborationController__controller-class__DataCollaborationController.md
        section: bugs_limitations_corner_cases + invariants
        cite: "DataCollaborationController.java:41-49 + DataCollaborationServiceImpl.java:72-77 + ReactiveMessageRepositoryImpl.java:171-185"
        note: "empty Mono -> 200/empty, not 404; UUIDv1 predicate makes non-v1 ids silently empty too"
    operator_visible_failure: |
      Two failure modes. (1) A genuine UI 'Open in Slack' click on a message whose
      Slack permalink can't be resolved gives the user a blank 200 (a dead button)
      rather than an actionable error. (2) Combined with the no-RBAC gate (H-003),
      the endpoint is an authenticated message-existence-by-id oracle: 302 means
      the id exists, 200/empty means it does not — a user can enumerate which
      message UUIDs are real without any owner scoping or audit trail.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-007
  hypothesis: |-
    "When my Discussion message fails to deliver to Slack (channel archived, text
    too long, token revoked), I am told about the failure."
  derivation: |-
    The Send action returns a `Message` with a `state` field; the user expects to
    learn whether their message actually reached Slack.
  seed_source: response-shape
  sme_consultation_recommended: false
  validation:
    verdict: partial
    actual_behavior: |
      The 202 response carries a `Message` whose state is `PENDING_SEND`. The
      async sender later flips the row to `ERROR_SENDING` on Slack failure
      (after the fixed-3 retry budget), but NOTHING pushes that state change back
      to the HTTP caller — there is no SSE/websocket/notification on the send
      path. The user only learns the outcome by re-fetching
      `/api/dataentities/{id}/messages`. So the user is told the INITIAL state
      truthfully, but never the FINAL delivery outcome unless they poll.
    evidence:
      - sidecar: odd-platform__java__DataCollaborationController__controller-method__postMessageInSlack.md
        section: bugs_limitations_corner_cases[4]
        cite: "DataCollaborationController.java:38 + DataCollaborationServiceImpl.java:96 + DataCollaborationMessageSenderJob.java:58-63"
        note: "202 returns PENDING_SEND; ERROR_SENDING is set async with no push to the caller"
    operator_visible_failure: |
      A user sends a message, sees it accepted, and assumes it reached Slack. If
      the channel was archived or the text exceeded Slack's ~40KB limit, the
      message silently never arrives in Slack; the only signal is a state flip the
      user must re-fetch to see. For a collaboration feature this is a
      trust-eroding silent failure. (Lower severity than the security findings
      because it is recoverable by refresh and the message is persisted.)
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-008
  hypothesis: |-
    "When my deployment runs with the default config, the Discussions endpoints
    are not reachable (the feature is off and exposes nothing)."
  derivation: |-
    Pillar 'opt-in per subsystem' framing + the implicit ADR that
