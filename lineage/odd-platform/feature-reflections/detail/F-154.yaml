- id: H-003
  hypothesis: |-
    When an operator (in create mode) types a Name that already exists in the chosen
    namespace, the form warns them client-side BEFORE they submit, so they never reach
    a backend rejection.
  derivation: |-
    Endpoint shape + the explicit client-side duplicate detector — TermsForm fetches
    existingTerms on mount specifically to pre-validate the name (TermsForm.tsx:71-75,
    84-94). The product-owner intent of a pre-submit check is to spare the user a
    server round-trip failure.
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |-
      The check works ONLY when the catalog has <= 1000 terms AND only in CREATE mode.
      TermsForm.tsx:71-75 fetches with a hardcoded `size: 1000`; a catalog of 1001+
      terms silently truncates the candidate set, so the 1001st+ term never participates
      in the duplicate check and the detector returns no-match (false "name is free").
      The check is also gated by `if (!term?.id)` (TermsForm.tsx:84), so EDIT mode does
      no client-side collision check at all. The authoritative gate is the backend
      (namespace,name) uniqueness guard at TermServiceImpl.java:107-113 — but the form
      has no error path to surface that rejection (see H-005). So the promise holds for
      small catalogs in create mode and breaks silently at scale and on rename.
    evidence:
      - sidecar: F-154 feature-flow facet client_side_duplicate_check_loads_1000_terms_in_memory
        section: observed
        cite: "TermsForm.tsx:71-75"
        note: "hardcoded size:1000 fetch on mount — blind past 1000 terms"
      - sidecar: F-154 feature-flow facet client_side_duplicate_check_loads_1000_terms_in_memory
        section: observed
        cite: "TermsForm.tsx:84"
        note: "CREATE-mode-only gate `if (!term?.id)` — EDIT rename never checked"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: concepts.invariants
        cite: "TermServiceImpl.java:107-113"
        note: "backend (namespace,name) duplicate guard is the authoritative gate (case-insensitive)"
    operator_visible_failure: |-
      (i) On a mature catalog (>1000 terms), an operator typing a name that DOES already
      exist gets no warning, submits, and hits an unhandled backend rejection that the
      dialog swallows (H-005) — the term appears to silently fail to save. (ii) In edit
      mode, renaming a term to collide with another in the same namespace produces no
      client warning and the same swallowed backend rejection. (iii) The false "name is
      available" signal actively misleads: an operator trusts the green check and is
      surprised when Save does nothing.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

