# Activity Feed (Audit-Trail Surface) — product-owner reflection (v0.3.0)

## product_owner_narrative

The Activity Feed is ODD Platform's **audit-trail read surface** — the user-observable history of what changed on the catalog's data entities. A senior product owner introduces it from the screen the user actually lives in: an authenticated user clicks the **Activity** tab in the top toolbar (`ToolbarTabs.tsx:77` deep-links `activityPath(activityQueryString)`) and lands on the global Activity page at `/activity`, a two-column layout — a seven-facet filter sidebar on the left, a date-grouped infinite-scroll results list on the right (per `odd-platform__ts__react-component__component__Activity.md` understanding + `system-mission.md:200-220` P-07 pillar). The same feed appears as a per-entity Activity tab on every Data Entity detail page. Three personas use it: an end-user scanning recent platform-wide change activity; a data steward reviewing one entity's history; and a security/compliance reviewer asking "who did what, when" against a user, owner, or date window (per the live `activity-feed` doc, WebFetched 2026-06-04 status 200).

A user interacts with it through one HTTP read surface with two endpoints (per `ActivityController` class sidecar): `GET /api/activity` returns a cursor-paginated list of activity rows with ~12 query parameters (`beginDate`, `endDate`, `size`, `datasourceId`, `namespaceId`, `tagIds`, `ownerIds`, `userIds`, `type`, `eventType`, `lasEventId` [sic — a typo on the Java surface; the OpenAPI spec spells it `last_event_id`], `lastEventDateTime`); `GET /api/activity/counts` returns four aggregate badges (`totalCount`, `myObjectsCount`, `downstreamCount`, `upstreamCount`). Neither endpoint carries `@PreAuthorize`, neither appears in `SecurityConstants.SECURITY_RULES`, and both fall through to Spring's catch-all `.authenticated()` rule — so **every authenticated identity reads the full cross-owner audit trail by default** (per `ActivityController` sidecar security block + route sidecar auth_gates). The UI route is mounted bare at `App.tsx:65` with no `WithPermissionsProvider` and no owner-association guard (per `route:activity` sidecar bugs_limitations_corner_cases).

The working parts a product owner demos: a seven-facet filter panel — **Period / Datasource / Namespace / Event type / Tag / Owner / User** (per `Activity` sidecar invariant + live doc); a four-way **view-mode tab axis** carried in the `type` query parameter, not the URL path — `ALL` / `MY_OBJECTS` / `UPSTREAM` / `DOWNSTREAM` (per `route:activity` implicit_adrs + `ActivityTabs.tsx:29-51`); newest-first ordering `CREATED_AT DESC, ID DESC` (per repository line 291); cursor pagination on `(lastEventId, lastEventDateTime)` with infinite scroll (per `Activity` sidecar orderings + ADR-0021); and a default 6-day window (`startOfDay(now-5d)` .. `endOfDay(now+1d)`, `size=30`) computed at module-eval time, not URL-stamped (per `common.ts:33-41` cited across the route + component sidecars). The **User** facet's dropdown actually lists **Owners** — selecting one stores its id in `queryParams.userIds`, which the backend binds to `USER_OWNER_MAPPING.OWNER_ID.in(userIds)`, never to the actor column `activity.created_by` (per `Activity` sidecar Category-F request_inputs + `ReactiveActivityRepositoryImpl.java:272-273` + LSN-020). This is the load-bearing semantic mismatch the feature's product story turns on.

The integration story has three cross-pillar legs (per `system-mission.md:200-220` + F-021 `cross_pillar_relationships`): the feed **feeds P-01 Data Discovery** as the change-driven discovery surface (every `DESCRIPTION_UPDATED` / `BUSINESS_NAME_UPDATED` event shows alongside its entity); it **shares schema with P-09 Security** — the actor-resolution LEFT JOIN to `USER_OWNER_MAPPING ON OIDC_USERNAME = ACTIVITY.CREATED_BY` (no provider qualifier) is the read-side mirror of F-011's `provider-null-cross-mode-bleed` (tracked PLT-065 / PLT-120); and it is **operationally coupled to P-08 Housekeeping** — `ActivityEmptyPartitionsHousekeepingJob` drops only EMPTY past partitions, so non-empty partitions persist forever (per F-010 coupling). The audit-silence-on-RBAC pattern across F-006 is rooted here: `activity.data_entity_id` is `NOT NULL` FK to `data_entity(id)` (`V0_0_48__add_activity.sql:4,12`), so RBAC / Owner-CRUD / Datasource / Collector mutations physically cannot emit to this table.

A senior product owner would flag five demo edge cases (the Rule 9 UX questions made concrete): (a) **does the user understand the screen?** — the "User" filter looks like an actor filter, lists owners, and silently answers a different question (H-001); (b) **is it convenient?** — every filter twiddle fires FIVE backend queries (4 counts + 1 list) with no debounce and no request cancellation (per `Activity` sidecar performance.hot_paths), and a platform with >100 datasources truncates the Datasource/Namespace dropdowns silently (H-018b); (c) **is it consistent with the platform?** — the Activity route is the one entity surface mounted without a permission wrapper, where Alerts uses `RestrictedRoute + WithPermissionsProvider` (per route sidecar; tracked PLT-031/PLT-034); (d) **can the user customise it / share it?** — sharing a bare `/activity` URL surfaces the default window relative to the *recipient's* now, not the sharer's (H-018a, share-time drift); (e) **how does it behave across views/devices?** — the grid split (`xs=3 / xs=9`) is hardcoded with no responsive breakpoint or collapsible sidebar (per `Activity` sidecar invariant) — on a narrow viewport the filter panel and the results compete for space.

## hypotheses

- id: H-001
  hypothesis: |
    When a user picks an entry in the "User" filter on the Activity page (or passes
    `GET /api/activity?userIds=42`), the feed narrows to activity rows whose ACTOR — the
    user who performed the change, i.e. the value in `activity.created_by` — is that user.
  derivation: |
    The filter is labelled `t('User')` (Filters.tsx:93-98); the pillar mission frames the
    feature as an "audit-trail surface" (system-mission.md:200-220); the response carries a
    `created_by` actor field. A request field's meaning is what the UI control feeding it
    means (Rule 9) — and the control says "User".
  seed_source: ui-label + endpoint-shape + pillar-mission
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |
      The "User" filter's dropdown is populated by `fetchOwnersList` (MultipleFilter.tsx:32-34
      dispatches it for any filterName != 'tagIds') — it lists OWNERS, not users. Selecting an
      owner stores its id in `queryParams.userIds`; the thunk sends `userIds=[ownerId]`; the
      repository binds `USER_OWNER_MAPPING.OWNER_ID.in(userIds)` at getCommonConditions
      (ReactiveActivityRepositoryImpl.java:272-273). The actor column `activity.created_by`
      IS read in the LEFT JOIN (line 221) and SELECTED (line 212) but is NEVER in a WHERE
      predicate. The filter answers "events on entities owned by the selected owner-via-mapping",
      not "events performed by the user". This is the LSN-020 canonical case manifesting at the
      UI input surface.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Activity.md
        section: "stress_findings.request_inputs + bugs_limitations_corner_cases.[0]"
        cite: "components/Activity/Filters/Filters.tsx:93-98 + MultipleFilter.tsx:32-34"
        note: "UI 'User' control lists owners (fetchOwnersList); selecting an owner stores its id in userIds"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: "stress_findings.request_inputs + invariants"
        cite: "ReactiveActivityRepositoryImpl.java:272-273 (bind) + 212,221 (created_by read+selected, never filtered)"
        note: "userIds binds to OWNER_ID; the available-but-unused actor column is created_by"
      - test: "odd-platform-api/.../repository/reactive/ActivityActorFilterKnownBugTest.java"
        cite: "ActivityActorFilterKnownBugTest.java:38-45 (@pins LSN-020)"
        note: "GREEN characterization pin asserting the source contains `USER_OWNER_MAPPING.OWNER_ID.in(userIds)` — RED the instant the filter is corrected to the actor axis"
      - sidecar: '(WebFetch live doc)'
        section: "User filter description"
        cite: "https://docs.opendatadiscovery.org/features/active-platform-features/activity-feed (2026-06-04, 200)"
        note: "Doc was CORRECTED (DOC-206) and now states 'entity-ownership axis, not an actor axis' — the doc no longer reinforces the wrong promise; the UI label + SQL bug remain"
    operator_visible_failure: |
      The canary triplet (all confirmed from the chain): (a) a platform user with NO
      user_owner_mapping row cannot be selected at all — the dropdown only surfaces owners, so
      that user is silently absent from the picker (distinct from "returns empty"); an auditor
      cannot even express the query. (b) Reassigning a user-owner mapping retroactively rewrites
      which historical rows match the filter — the audit answer for past events changes silently
      with no event-log entry. (c) Multiple users mapped to the same owner collapse into one
      filter result — picking owner-Alice-team returns rows for every user mapped to that owner,
      so "what did Alice do" is indistinguishable from "what did Bob (same owner) do".
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    coverage_note: "ActivityActorFilterKnownBugTest pins the WRONG behaviour GREEN (LSN-029 sense); the pin flips RED on fix. The CORRECT (actor-axis) promise has no test and is UNVERIFIED — it will need one as the regression guard when PLT-030 is fixed (functional_test_demands UC-1). Per Rule 11 this promise does NOT count toward use_case_coverage verified."
    case_law_anchor: "retrospectives/LSN-020 (the case-law that motivated Layer 4b) + LSN-029 (known-bug pin)"

- id: H-002
  hypothesis: |
    When the user selects the "My Objects" tab (`type=MY_OBJECTS`), the feed shows the
    activity the signed-in user PERFORMED across the catalog (their own actions).
  derivation: |
    The tab is labelled "My Objects" and a user's natural mental model of a "my activity" tab
    is "things I did". The pillar's "audit metadata changes" action reinforces an actor reading.
  seed_source: view-mode + ui-label + pillar-mission
  validation:
    verdict: contradicted
    actual_behavior: |
      `type=MY_OBJECTS` resolves the caller's Owner id via
      `authIdentityProvider.fetchAssociatedOwner()` and threads it as currentOwnerId into
      `findMyActivities`, which binds `OWNERSHIP.OWNER_ID.in([currentOwnerId])` (repository
      line 270) — the OBJECT-ownership axis (entities the caller OWNS), not the ACTOR axis
      (activity the caller PERFORMED). A user who edits an entity they do not own makes a change
      that is invisible in their own My-Objects view; a user with no ownership attachments who
      has made many changes sees an EMPTY My-Objects feed. `fetchAssociatedOwner()` returns
      Mono.empty() for users without a mapping, so the feed is silently empty with no error and
      no UI hint. The doc (DOC-206) now documents the four tabs and the My-Objects ownership
      scoping, so this is doc-acknowledged — but the user-on-screen mental model still mismatches.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: "invariants + bugs_limitations_corner_cases"
        cite: "ReactiveActivityRepositoryImpl.java:91-107 + line 270 (OWNERSHIP.OWNER_ID, object axis)"
        note: "findMyActivities scopes by object-ownership, not actor"
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: "invariants + operations"
        cite: "ActivityServiceImpl.java:184-199 (fetchAssociatedOwner -> currentOwnerId; empty for no-owner)"
        note: "silent empty feed for users without an owner mapping"
      - test: "odd-platform-api/.../service/ActivityServiceImplTest.java"
        cite: "ActivityServiceImplTest.getActivityList_myObjects_dispatchesToFetchMyActivities"
        note: "verifies the DISPATCH to findMyActivities (object axis) — does NOT assert the empty-for-no-owner or object-vs-actor promise"
      - sidecar: '(WebFetch live doc)'
        section: "view-mode tabs"
        cite: "activity-feed doc (2026-06-04, 200)"
        note: "doc now names the 4 tabs + My-Objects = entities you own (DOC-206 shipped)"
    operator_visible_failure: |
      (i) A fresh user with no owner mapping who has been editing descriptions / tags / business
      names sees a completely EMPTY "My Objects" feed — no error, no "no owner association" hint,
      visually identical to "no activity in this window". They cannot find their own past actions.
      (ii) A user WITH an owner mapping who edits entities they do not own (the common
      shared-platform pattern) sees only activity ON entities they own — most of which they did
      not personally cause; their own actions elsewhere are absent. The "My" tab is not a reliable
      "my recent work" surface.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    coverage_note: "dispatch is unit-tested; the user-facing object-axis promise (empty for no-owner; my-owned not my-performed) is not. Functional demand UC-2."

- id: H-003
  hypothesis: |
    When the user lands on the default "All" tab (or passes `type=ALL` / omits `type`), the
    feed shows activity across ALL owners in the catalog, subject only to the date / event-type /
    cursor filters — and any authenticated user sees the same cross-owner feed.
  derivation: |
    The view-mode label `ALL` promises "all"; the controller carries no @PreAuthorize and no
    principal-derived predicate; the route is mounted with no permission wrapper.
  seed_source: view-mode + endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      `type=null` and `type=ALL` both route to fetchAllActivities (ActivityServiceImpl.java:107-116;
      pinned by AdrActivityContractScanTest null≡ALL); findAllActivities (repository 73-89) applies
      NO current-user predicate. The default feed is cross-owner — every authenticated identity reads
      every data entity's activity, including actor identity + full old/new state JSONB. The controller
      falls through to `.authenticated()`; under auth.type=DISABLED the gate is `.permitAll()` and
      anonymous traffic reads the global feed. The doc (DOC-181) now states this explicitly: "By
      default, every authenticated user reads every entity's activity history."
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: "security + owner_scoping"
        cite: "ReactiveActivityRepositoryImpl.java:73-89 (no current-user predicate)"
        note: "cross-owner read at the SQL layer"
      - sidecar: odd-platform__ts__routes__route__activity.md
        section: "stress_findings.auth_gates + security.known_security_gaps"
        cite: "App.tsx:65 (bare route, no WithPermissionsProvider)"
        note: "no UI-tier gate either; gate lives nowhere for the ALL view"
      - test: "odd-platform-api/.../service/ActivityServiceImplTest.java + .../config/AdrActivityContractScanTest.java"
        cite: "getActivityList_nullType_dispatchesToFetchAllActivities + activityViewModeIsASingleEnumDispatch_nullMeansAll"
        note: "verify the null≡ALL DISPATCH; neither verifies the cross-owner VISIBILITY (no security test that a non-owner reads another owner's rows)"
      - sidecar: '(WebFetch live doc)'
        section: "visibility"
        cite: "activity-feed doc (2026-06-04, 200)"
        note: "doc now documents the cross-owner default (DOC-181 shipped)"
    severity: N/A
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: happy-path
    coverage: unverified
    coverage_note: |
      The DISPATCH (null≡ALL→fetchAllActivities) is unit+ADR-tested, but the user-facing PROMISE that
      MAKES this a notable feature — that an authenticated non-owner sees another owner's audit rows —
      has NO security test. The dispatch test mocks the repository; it cannot observe cross-owner
      visibility. Functional/security demand UC-3.
    caveat_note: "Cross-owner default is the deliberate read-collaborative posture (REFACTOR-024); now doc-acknowledged (DOC-181). The CONFIRMED behaviour is still a security caveat operators must understand before multi-tenant deployment."

- id: H-004
  hypothesis: |
    When the user combines a view-mode with an owner filter (`type=UPSTREAM&ownerIds=42`, or
    `type=MY_OBJECTS&ownerIds=42`), BOTH filters compose — the feed is the upstream/my-objects
    set AND restricted to the named owners.
  derivation: |
    The OpenAPI surface exposes `ownerIds` on `/api/activity` unconditionally, regardless of
    `type`; a user combining two filters reasonably expects both to apply — nothing on screen or
    in the doc says any parameter is silently ignored.
  seed_source: endpoint-shape + view-mode
  validation:
    verdict: contradicted
    actual_behavior: |
      The view-mode dispatch routes UPSTREAM/DOWNSTREAM to `fetchDependentActivities(...)` and
      MY_OBJECTS to `fetchMyActivities(...)` — neither signature accepts an `ownerIds` parameter
      (ActivityServiceImpl.java:107-117); the caller's `ownerIds` is SILENTLY DROPPED for three of
      four view modes. Only `type=ALL`/`type=null` passes `ownerIds` through to getCommonConditions
      (`OWNERSHIP.OWNER_ID.in(ownerIds)`, repository 269-271). The OpenAPI spec exposes `owner_ids`
      unconditionally; the Java service ignores it for 3 of 4 modes with no error and no warning.
    evidence:
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: "operations + stress_findings"
        cite: "ActivityServiceImpl.java:107-117 (fetchMyActivities/fetchDependentActivities lack ownerIds)"
        note: "ownerIds dropped on the view-mode arms"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: "stress_findings.request_inputs"
        cite: "ReactiveActivityRepositoryImpl.java:266-275 (ownerIds predicate only in getCommonConditions)"
