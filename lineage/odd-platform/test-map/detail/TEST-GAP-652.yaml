proposed_action: |-
  Stand up `CollectorDisabledModeAsymmetryTest.java` — Spring `@SpringBootTest` with `auth.type=DISABLED`. Method (a): mount the UI shell (React-Testing-Library + Vitest, OR pure backend assert of `/api/identity` returning empty permissions); assert via direct call that `/api/identity` returns `{permissions: []}`; via DOM assertion (if running the UI in jsdom), assert ZERO Add / Edit / Delete / Regenerate buttons present (the UI's read-only appearance). Method (b): with the same configuration, fire `POST /api/collectors` ANONYMOUSLY (no Cookie, no X-API-Key); assert HTTP 201 with a fresh collector token in the response. Method (c): the cross-layer pin — assert (a) AND (b) hold simultaneously: UI promises locked-down, backend accepts anonymous mutation. This is the regression-pin that surfaces the UI-vs-API asymmetry; the fix path is either harden DISABLED mode to apply SECURITY_RULES (changing semantics, requires ADR) OR add a UI banner stating "DISABLED auth mode — REST endpoints are anonymously reachable". Either fix breaks one or both halves of this test, forcing intentional re-authoring.
