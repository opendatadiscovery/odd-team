notes: |-
  This is the OPERATION tier; the corresponding state ENTITY is
  Data Quality Dashboard. The operation's distinct contribution to the
  catalog is that the page-mount establishes THREE invariants the
  dashboard depends on (atom scope, layout shape, lazy-load) — each
  recorded under its own concept or implicit_adrs entry.
