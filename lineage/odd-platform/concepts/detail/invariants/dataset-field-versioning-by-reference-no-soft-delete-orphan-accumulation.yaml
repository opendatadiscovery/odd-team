mitigations_unimplemented:
- |-
  Add a housekeeping job removing orphan dataset_field rows.
  The query: identify dataset_field rows whose `id NOT IN (SELECT
  dataset_field_id FROM dataset_structure)` (rows no longer
  referenced by ANY dataset_version) — these are SAFELY DELETABLE.
  Run on the existing 15-minute housekeeping cycle behind a
  configurable TTL (e.g. `housekeeping.ttl.dataset_field_orphan_days`).
- |-
  Add a TTL-based housekeeping job removing dataset_field rows that
  are referenced ONLY by old dataset_version rows (where
  dataset_version.created_at older than TTL). Requires schema
  decisions: what TTL? Retain N most recent versions? Retain by
  data_entity creation date? The decision shape is the same as
  the F-010 housekeeping cascade-delete.
- |-
  Add an admin endpoint `POST /api/admin/housekeeping/dataset_field_orphans`
  (gated by ADMIN role) that runs the orphan-cleanup query on demand.
  Useful for operators with high-churn datasets who want to bound
  the growth without waiting for scheduled housekeeping.
- |-
  Document the version-aware identity model on the dataset schema-diff
  live page — operators reading the schema-diff feature should
  understand that a column rename produces an orphan dataset_field
  row referenced only by historical dataset_versions; the operator-
  curated internal name + description are preserved forward but the
  data row remains in PG.
- |-
  Document the forward-copy invariant for operator-curated metadata.
  Today this is INVISIBLE to operators — they edit
  `internalDescription` on a column; the column is later renamed (a
  schema change creates a new dataset_field row); the operator's
  stewardship investment is silently preserved. The platform DOES
  the right thing; the operator-facing docs should say so.
- |-
  Add the regression test from the test-coverage proposal:
    Three dataset_versions, each with the same column oddrn but
    different hashes (rename + type change + flag-flip);
    assert `getLastVersionDatasetFieldsByOddrns` returns the
    CURRENT row (max version), and that the orphan rows persist
    in PG.
notes: |-
  This is a UNIQUE deletion-pattern in the platform — the FIFTH
  distinct mechanism after V0_0_64's convergence on
  (deleted_at + partial-unique-index). The other four mechanisms are
  documented at the `three-soft-delete-mechanisms-across-the-repository-layer`
  invariant; this concept adds the FIFTH: no-deletion-at-all-with-
  M:N-edge-based-lifecycle.

  **Why the design is correct despite the growth concern**: the
  versioning-by-reference pattern preserves the dataset's schema
  history. If a future analyst needs to reproduce a query that ran
  against the dataset 18 months ago when column 'foo' was an INTEGER
  but is now a STRING, the historical dataset_field row + the
  historical dataset_version row + the historical dataset_structure
  link are ALL preserved. The schema-history feature surfaces the
  Δ via Dataset schema-diff (P-01 sub-feature).

  **Why the growth concern is real**: deployments with high schema
  churn accumulate dataset_field rows at a rate proportional to
  (number of columns) × (number of ingestion cycles where a column
  changed). Postgres planner overhead grows with table size; the
  3-table authorization join chain runs on every dataset_field-targeted
  request; the term back-link enumeration includes orphan rows.

  Cross-cutting connections:
    - Pairs with the three-soft-delete-mechanisms invariant — this
      concept is the FIFTH mechanism not previously catalogued
    - Pairs with the activity-table-partitioning invariant — both
      surface unbounded growth concerns; the activity table has
      partition-creation but no DROP; the dataset_field table has
      neither (no partitioning either)
    - Pairs with the read-collaborative-cross-owner-enumeration
      invariant — the listByTerm enumeration includes orphan
      dataset_field rows AND soft-deleted-parent data entities,
      compounding the cross-owner exposure surface
    - Pairs with the retention-claim-vs-code-drift invariant — the
      pattern of "schema author chose an architecture with no
      cleanup path" repeats at multiple sites; this is another
      instance the docs do not flag
    - Pairs with the F-006 audit-silence schema-rooted invariant
      — both are schema-layer architectural decisions that constrain
      future remediation options

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the version-aware identity model + the orphan row
        consequence on the dataset schema-diff live page (P-01
        sub-feature)
    (b) Document the operator-curated metadata forward-copy invariant
        on the per-column UI surface (operators editing
        internalDescription deserve to know their work is
        preserved across schema evolution)
    (c) Document the absence of dataset_field retention / cleanup on
        an operations runbook page — multi-year deployments need to
        plan PG storage growth or commit to the housekeeping job
