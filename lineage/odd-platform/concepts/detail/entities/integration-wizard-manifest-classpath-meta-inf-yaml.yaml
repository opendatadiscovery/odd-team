notes: |-
  NEW entity captured in batch 2026-05-25-ZD. The wizard manifest
  is the platform's plugin-author extension surface — operators
  contribute wizard manifests by overlay; the platform serves them
  through the IntegrationController surface.

  The live wizard doc page describes the SHAPE of a manifest but
  not the lifecycle (boot-time load, fail-fast on malformed YAML,
  case-insensitive id collision). DOC-NNN candidates for each.

  The manifest entity is structurally adjacent to but distinct
  from the platform's data-content entities (DataEntity, Owner,
  Tag, etc.): manifests are SHIPPED ARTEFACTS, not USER-EDITED
  PLATFORM STATE. The architectural decision (`IntegrationRegistry`
  is read-only by type) encodes the commitment.
