name: Operation name vs behaviour drift — create*-shaped operationId for replace-all
  semantic (Tag relations)
canonical_in_docs: false
canonical_candidate: false
description: 'OpenAPI spec (''summary: Creates tags relations for DataEntity entity'',
  operationId ''createDataEntityTagsRelations''), the controller method name (''createDataEntityTagsRelations''),
  and the spec description (''Creates tags relations tags for DataEntity entity'')
  all use CREATE-language for an operation whose underlying semantic is REPLACE-ALL
  diff (TagServiceImpl.java:113-120 computes pojosToDelete = current - updated and
  deletes them). The UI''s redux action is correctly named updateDataEntityTagsActionType
  (masking the drift from UI users) — but third-party API consumers reading only the
  spec have no warning. A consumer sending repeated calls expecting cumulative semantics
  will silently lose tags between calls. Cross-class parallel: ''upsert'' Internal
  Description is similarly misleading (it''s UPDATE-not-UPSERT, returns 200 OK silently
  on missing entity). Pattern: spec-vs-code naming drift on PUT-shaped operations.'
