# ERD/Graph Relationships Listing — product-owner reflection

## product_owner_narrative

The Relationships Listing is the Data Modelling pillar's catalog-topology browser: a single page at `/data-modelling/relationships` where any operator can see, in one paginated table, every entity-to-entity link the platform has discovered or that operators have defined — foreign-key-style ERD edges between two table-class datasets, and free-form graph edges between graph-store nodes (per the P-02 pillar mission, `system-mission.md:108-120`, and the live doc at `docs.opendatadiscovery.org/features/data-modelling/relationships`). It answers the question "how is my data connected?" — the complement to Query Examples ("how is my data queried?") that together capture the pillar's stated mission of recording "the contract of a dataset" (per `odd-platform__ts__react-component__component__DataModelling.md:138-141`). It is reached as the second of the two Data Modelling sidebar tabs; the toolbar "Data Modelling" entry deep-links to Query Examples, so Relationships is found by a second click or a direct deep-link (per route sidecar `implicit_adrs[2]`).

A user lands on the page, sees a header with a total count, a "Search relationships" free-text input, an ALL / ERD / Graph tab strip, and a table whose documented columns are Name, Type, Namespace + Datasource, Source entity, and Target entity (per route sidecar `docs_link_semantic.fetched_excerpts`). They scroll; the list infinite-scrolls 30 rows per page (per route sidecar `concepts.invariants`, `Relationships.tsx:23` hard-codes `size: 30`). Switching the tab rewrites `?type=` in the URL and re-queries the backend; typing in the search box rewrites `?q=`; both are URL state, so a refresh or a deep-link reconstructs the filtered view (per route sidecar `concepts.invariants` + `request_inputs`). Clicking a row navigates to the underlying data entity's overview page (per route sidecar `concepts.invariants[0]`, `RelationshipsListItem.tsx:52`). Three REST endpoints back the surface — `GET /api/relationships` (list), `GET /api/relationships/erd/{relationship_id}` and `/graph/{relationship_id}` (detail) — and the detail endpoints are reached by the data-entity overview page's relationship cards, NOT by the list-page row click (per controller sidecar `concepts.operations` + route sidecar `doc_drift_findings`).

The working parts the user touches are: a type filter (ALL / ERD / GRAPH, which the backend honours via the `relationships.relationship_type` column — name and behaviour align, per controller sidecar `request_inputs` for `type`); a name search (which matches the relationship row's own external_name, NOT the source/target dataset names — a scope the user may misread); pagination (1-indexed by arithmetic convention, oldest-relationship-first by `data_entity.id ASC`, per controller sidecar `orderings`); and per-row navigation. The entire chain — route mount, controller, service, repository — carries no authorization gate: no permission wraps the route, no `@PreAuthorize` guards the controller, no `SECURITY_RULES` entry exists for `/api/relationships/**`, and the repository SQL applies no owner / namespace / `EXCLUDE_FROM_SEARCH` / data-source filter (per controller sidecar `security` + route sidecar `auth_gates`). This is the platform's deliberate read-collaborative posture (relationships are public catalog metadata), but it is undocumented and asymmetric to `/api/dataentities`, which DOES apply `EXCLUDE_FROM_SEARCH`.

The feature feeds the connection graph alongside lineage (P-02 feeds P-05, per `system-mission.md:439-442`): the same ERD edges that surface here contribute to the lineage graph the F-005 surface walks. It draws its data from the ingestion side (Postgres / Snowflake collectors extract ERD edges; graph-store collectors extract graph edges, per the pillar mission's cross-pillar `feeds_from`). The audiences are the platform end-user, the data-engineer/analyst tracing topology, and the viz/BI engineer assessing source structure (per `system-mission.md:328-332`).

The edge cases a product owner would flag in a demo: the Target column currently shows source data on every row (a copy-paste bug — the flagship demo failure); a deep-link with a mistyped `?type=` value lands the user on a blank list with no active tab and no error; a third-party API caller reading the OpenAPI spec and supplying a real `relationships.id` to a detail endpoint gets a 404 because the parameter is silently consumed as a `data_entity.id`; a 0-indexed `?page=0` caller hits an opaque 500 instead of the first page; and in a multi-tenant deployment behind one IDP, every team's relationships are visible to every authenticated operator. Every one of these is reasoned from the assembled chain below.

