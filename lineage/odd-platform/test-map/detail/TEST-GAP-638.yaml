proposed_action: |-
  Add `PolicyList.test.tsx` (NEW file) with parameterised tests: (a) `list_renders_only_active_policies` — provide a redux state with three Policy rows where one has `deleted_at` set (synthesized — the slice expects already-filtered payload); assert exactly two rows render; the test serves as a documentation pin even though deleted policies would not appear in the slice via the real API; (b) `create_cta_visible_only_with_POLICY_CREATE_permission` — render with `usePermissions.hasAccessTo(POLICY_CREATE)` returning true; assert Create button exists. Render with hasAccessTo returning false; assert NO Create button is in the DOM (verify the `WithPermissions returns null` semantic). Pair with assertion that no greyed-out button exists either.
