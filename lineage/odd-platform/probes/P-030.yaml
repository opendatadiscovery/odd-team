realism_caveats: |
  The probe pins three hypotheses about the unset-origin INSERT and the
  delete-then-recreate cycle. What it does NOT verify:

  (1) The concurrent-race case — two simultaneous PUTs submitting the same
  novel tag name, where one bulkCreate loses the partial-unique-index race on
  tag(name) and the resulting UniqueConstraintException may abort the whole
  updateDatasetFieldTags transaction (leaving the field with no internal tags
  after the delete-all step). That needs a separate concurrency-class probe.

  (2) The activity-feed before/after state JSON correctness — a separate probe
  should assert the DATASET_FIELD_TAGS_UPDATED event payload carries the full
  before/after tag list per DatasetFieldInformationUpdatedActivityHandler.

  (3) The parent-scoped authorization path — auth.type=DISABLED is used here to
  isolate the data-write behaviour. A security-class probe must exercise the
  DATASET_FIELD_TAGS_UPDATE resolution: confirm the dataset-field id resolves to
  its parent data entity via DatasetFieldResourceExtractor and that a caller
  without the permission on the PARENT data entity is rejected 403 under
  LOGIN_FORM/OAUTH2/LDAP.

  (4) If first_status is NOT 200, the probe has confirmed Hypothesis B — the
  endpoint is dead for non-empty payloads — and the remaining assertions are
  moot; probe-runner should report the failure mode and the HTTP error body
  verbatim so the maintainer can confirm whether it is the origin NOT NULL
  constraint violation specifically.
