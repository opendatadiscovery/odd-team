behaviour: |-
  **OWNER.NAME RENAME IS THE SAFE DIRECTION — USER_OWNER_MAPPING SURVIVES INTACT.** Load-bearing safe-rename invariant: PUT /api/owners/{owner_id} mutates `owner.name` only. The FK from USER_OWNER_MAPPING is `user_owner_mapping.owner_id REFERENCES owner(id)` (V0_0_4__add_user_owner_mapping.sql:3) — `owner.id` is the bigserial PK, stable across name changes. After rename, the previously-associated user can still log in and resolve to the SAME Owner. This is the load-bearing CONTRAST to REFACTOR-391's OIDC_USERNAME-rename hazard: the OWNER-side rename is safe, the principal-side rename (via OIDC handler login-rename) orphans USER_OWNER_MAPPING because OIDC username is the freerename string used as the mapping key. The two surfaces together describe the rename hazard surface: OIDC_USERNAME side is the DANGEROUS direction, OWNER.NAME side is the SAFE direction. NO test pins the safe-rename contract. A future refactor that (a) changes USER_OWNER_MAPPING.OWNER_ID from id-based to name-based, OR (b) introduces an OWNER.NAME → USER_OWNER_MAPPING write-back that orphans on rename — would silently break the safe-rename invariant. Plus this is a documentation back-link opportunity (the live owners doc is silent on rename semantics — flagged in updateOwner.md:docs_link_semantic.doc_drift_findings.[1]).
