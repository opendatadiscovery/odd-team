behaviour: |-
  **HIGH — F-006 audit-silence pattern extends to the ENUM SCHEMA on the entire Term-lifecycle surface.** Primary-source-confirmed via the batch-U TermServiceImpl sidecar:

  - `TermServiceImpl.createTerm` (`TermServiceImpl.java:99-117`) carries NO `@ActivityLog`.
  - `TermServiceImpl.updateTerm` (`TermServiceImpl.java:121-145`) carries NO `@ActivityLog`.
  - `TermServiceImpl.delete` (`TermServiceImpl.java:154-165`) carries NO `@ActivityLog`.
  - `TermServiceImpl.upsertTags` (`TermServiceImpl.java:253-264`) carries NO `@ActivityLog`.
  - `TermServiceImpl.linkTermWithTerm` (`TermServiceImpl.java:289-294`) carries NO `@ActivityLog`.
  - `TermServiceImpl.removeTermToLinkedTermRelation` (`TermServiceImpl.java:297-302`) carries NO `@ActivityLog`.

  Beyond service-tier omission, **the `ActivityEventTypeDto` enum at `ActivityEventTypeDto.java:3-31` does NOT define `TERM_CREATED`, `TERM_UPDATED`, `TERM_DELETED`, `TERM_DESCRIPTION_UPDATED`, `TERM_TAGS_UPDATED`, `NAMESPACE_CREATED`, `NAMESPACE_DELETED`, `TAG_CREATED`, or `TAG_DELETED`** (verified by the sidecar's primary-source `grep -n 'TERM_CREATED\|TERM_UPDATED\|TERM_DELETED\|TAG_CREATED\|NAMESPACE_CREATED' returns zero matches`). The audit-silence on catalog-vocabulary lifecycle is SCHEMA-ROOTED, not just service-side: a maintainer adding `@ActivityLog(TERM_CREATED)` would FAIL TO COMPILE.

  **Why HIGH not MEDIUM**: this is a STRUCTURAL gap, not a service-tier omission. The F-006 audit-silence pattern was previously enumerated across 8+ sidecars at the service tier (operator-investigation surface — "I deleted a Role, no audit trail"). This sidecar surfaces a deeper variant: even if a maintainer wanted to instrument these mutations, the schema doesn't HAVE the right enum values. The intent is encoded by absence — catalog-vocabulary-curation is silent BY DESIGN at the enum level. Whether this is durable design or oversight is decision-shaped; the schema-level absence ELEVATES the gap from "service didn't choose to log" to "platform-design decided catalog-vocabulary is silent". This is the SAME enum-root pattern as the F-006 batch-G primary-source discovery (`seven_sidecar_audit_silence_pattern_repo_tier_schema_root_cause`) but applied to a NEW surface (Term lifecycle vs the previously-enumerated RBAC + ownership surfaces).

  **Operational consequences**:
  - Operator who deletes a term has no forensic trace in the activity feed; restoring deleted catalog-vocabulary requires DB introspection.
  - Auditor investigating "who renamed the `Customer` term in `finance` namespace last quarter" has no answer from the activity feed.
  - Auditor investigating "who linked term A to term B" has no answer (compound with TEST-GAP-718 unauthenticated term-to-term linkage — any authenticated user can link/unlink with no audit trail).
  - Compliance frameworks (SOX, GDPR-derived data-cataloguing requirements) cannot demonstrate auditability for the Business Glossary.

  **Test gap shape**: a regression-pin asserting that (a) the enum at `ActivityEventTypeDto.java` does NOT contain `TERM_CREATED` / `TERM_UPDATED` / `TERM_DELETED` / etc.; (b) `TermServiceImpl.createTerm/updateTerm/delete/upsertTags/linkTermWithTerm/removeTermToLinkedTermRelation` produce ZERO activity-feed entries on any path. The current state is PINNED to make the design intent visible — any future maintainer adding enum values + `@ActivityLog` instrumentation will see the test fail and must explicitly update both layers in the same PR.
