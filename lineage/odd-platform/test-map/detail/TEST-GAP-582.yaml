  - "F-008"
proposed_action: |-
  WebTestClient + heap-instrumented test. (a) Boot with `auth.ingestion.filter.enabled=true`. (b) POST `/ingestion/entities` with a 20MB DataEntityList payload + malformed Authorization (or missing). (c) Instrument the test to track JVM heap allocation OR set the test profile to a memory-bound limit. (d) Assert (i) response is 401 with body `"Token is not correct"` or `"Token is missed"`, (ii) the full payload was Jackson-deserialised before rejection (e.g. assert a custom DataEntityList deserializer counter increments before the 401 path is taken). (e) Pin the body-first ordering; a future auth-first protocol change (e.g. `X-Datasource-Oddrn` header) flips the assertion to expect zero parse-cycles before reject.
