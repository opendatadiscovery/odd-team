mitigations_unimplemented:
- |-
  Code-side: change `management.endpoints.web.exposure.include` default to
  exclude `env` and `info` — operators can opt into them for debugging via
  override. The bundled deployment should expose only `health` and `prometheus`.
- |-
  Code-side: fail-fast boot guard — if `spring.datasource.password` equals
  the shipped default `odd-platform-password` AND the platform binds to a
  non-loopback interface, throw a clear `IllegalStateException`. The same
  pattern recommended for LOGIN_FORM default credentials. The pattern is
  applicable across multiple shipped-defaults — collector-side, S3, SMTP, etc.
- |-
  Code-side: add property-mask extensions for the four non-default-masked
  URL keys (slack URL, webhook URL, custom-datasource URL, primary datasource
  URL host). Spring Boot's masking is keyName-substring-based; extending it
  to a configured set of additional substrings is a single property change
  (`management.endpoint.env.keys-to-sanitize`).
- |-
  Doc-side: add an operator-hardening checklist to `/configuration-and-deployment/odd-platform`
  enumerating:
    - Rotate all shipped-default credentials before any non-local deployment
    - Restrict /actuator/env to a management-only network OR disable it entirely
    - Override the masking set to cover URL-style credentials
    - Pair LOGIN_FORM with TLS termination (see session-cookie-security-attributes-unset)
  This compounds with the existing 'enable-security' docs but is a separate
  operational-discipline surface.
- |-
  Code-side: separate the management endpoint port from the application port.
  Spring Boot's `management.server.port` lets operators bind /actuator/** on
  an internal-only interface. The platform does not document this option
  and does not set it by default.
notes: |-
  NEW MEDIUM-SEVERITY INVARIANT captured in batch 2026-05-20X surfaced by
  the cross-cutting examination of R2DBCConfiguration + MinioConfig +
  NotificationConfiguration + LoginFormSecurityConfiguration config-class
  sidecars. The finding is the COMPOUND — no single sidecar's signal is
  HIGH severity in isolation; together they trace a credential-reachability
  surface that touches DB, S3, notification, and form-login credentials in
  one platform-wide default posture.

  Cross-cutting connections:
    - LSN-001 + LSN-002 case-law — operator-discipline as the only line of
      defence is insufficient; the platform's shipped defaults are the
      attack surface
    - LOGIN_FORM-ADMIN-for-every-user-rbac-inert (batch X) — under LOGIN_FORM
      the ADMIN-for-all means /actuator/env is reachable to any form user
    - REFACTOR-185 (DISABLED-mode bypass) — under DISABLED the actuator
      endpoints are anonymously reachable
    - lombok-data-tostring-sensitive-field-leak (existing invariant) — same
      family of credential-leak vectors; this invariant adds the actuator
      vector to the toString vector
    - The platform's `management.endpoints.web.exposure.include` default
      is itself an implicit ADR worth surfacing

  Three DOC-NNN candidates:
    (a) Operator-hardening checklist on the deployment docs page
    (b) Hardening section on /configuration-and-deployment/odd-platform
        covering management endpoint isolation
    (c) Cross-link from each auth-mode page (DISABLED / LOGIN_FORM / OAUTH2
        / LDAP) to the actuator-exposure consequence under that mode
