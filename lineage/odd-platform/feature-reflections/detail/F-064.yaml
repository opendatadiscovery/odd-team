# "My objects" silent-empty across Activity / Alerts / Owned views — product-owner reflection

## product_owner_narrative

ODD Platform's "My" surfaces — the Activity feed's **My Objects** tab (`GET /api/activity?type=MY_OBJECTS`), the Alerting page's **My Objects** tab (`AlertService.listByOwner`), and the Catalog Overview's **Recommended / My Objects** strip — are the platform's answer to the operator question *"what changed on the things I own?"*. A signed-in data steward opens any of these and expects to see activity, alerts, or entities scoped to themselves rather than the whole cross-owner catalog (per system-mission P-07 "primary user actions: audit metadata changes ... on the global Activity feed or per-entity tab"). The promise is a personalised slice of the catalog (per `AuthIdentityProviderImpl` understanding — `fetchAssociatedOwner()` is "the POSITIVE side of the defence-in-depth anchor-set pattern" feeding every owner-scoped read).

The way a user reaches a "My" view is to authenticate (LOGIN_FORM / OAUTH2 / LDAP), navigate to Activity or Alerts, and click the **My Objects** tab. The personalisation hinges on one piece of catalog-side state the user often does not know exists: a `user_owner_mapping` row binding their authenticated principal `(username, provider)` to an `Owner` entity. That binding is created out-of-band in **Management -> Associations** (per system-mission P-08 "process owner-association requests"; `ReactiveUserOwnerMappingRepositoryImpl` understanding — "no auth-mode flow auto-creates this row on first login"). The single chokepoint is `AuthIdentityProviderImpl.fetchAssociatedOwner()` (per `AuthIdentityProviderImpl.java:50-53`), shared across all 15 owner-scoped callsites.

The working part F-064 exists to surface is the **failure path** when that binding is absent. `fetchAssociatedOwner()` returns `Mono.empty()` (not an error) for an unmapped user (per `AuthIdentityProviderImpl` invariant — "emits empty (not error) if no SecurityContext ... downstream .flatMap therefore short-circuits to empty"). Three consumers then degrade silently: `ActivityServiceImpl.fetchMyActivities` does `.switchIfEmpty(Flux.empty())` (per `ActivityServiceImpl.java:194-198`); the sibling `getMyObjectActivitiesCount` does `.defaultIfEmpty(0L)` (per `ActivityServiceImpl.java:239-243`); `AlertServiceImpl.listByOwner` resolves the principal then queries an owner-scoped repo that returns nothing (per `AlertServiceImpl.java:82-87`). The user sees an empty list and a "0 My objects" badge — visually identical to a fresh deployment where they genuinely have no activity. The UI renders the generic `EmptyContentPlaceholder` (per `ActivityResults.tsx:81-85`, confirmed via Grep) with no diagnostic copy distinguishing "no mapping" from "no data."

The integration story is that this is **not a single-endpoint bug but a cross-feature class**: every "My" view in the platform routes through the same `fetchAssociatedOwner()` chokepoint (per `AuthIdentityProviderImpl` audiences — Search `my_objects=true`, Alert `listByOwner`, DataEntity `getMyObjects`, Activity `MY_OBJECTS`). F-064 is the user-observable consequence; F-011 (Principal-to-Owner Resolution) is the underlying mechanism; F-021 (Activity Feed) and F-014 (Per-Entity Alert View) are sibling read surfaces where it manifests. The product-owner edge case the demo would highlight is the **admin-onboarding trap** (per system-mission P-08 + SHB-060 narrative): the operator who sets up RBAC for their teammates but never associates *themselves* with an Owner experiences every "My" view as broken before they finish onboarding.

The decisive cross-reference for this reflection is that the **documentation has materially changed since the feature flow was composed**. The flow's drift facets were anchored on doc WebFetches from 2026-05-20/05-26/05-27 that showed the prerequisite undocumented. Re-verified live on 2026-06-03, both the activity-feed page ("the three personalised tabs silently render an empty feed ... This is an entity-ownership axis, not an actor axis") and the alerting page ("the platform finds no user-owner mapping, returns an empty result, and the UI shows no diagnostic distinguishing 'no alerts in window' from 'you are not bound to an owner'") now document the prerequisite, the silent-empty failure mode, and the **Management -> Associations** remedy verbatim. The doc-side of F-064 is substantially closed; the **code/UI affordance gap persists** and is the remaining load-bearing finding.

