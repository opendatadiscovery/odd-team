name: Silent data-loss via replace-not-merge ingestion semantics
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19I (IngestionService sidecar)** —
  the ingestion pipeline''s per-call contract is REPLACE-NOT-MERGE for lineage
  edges and metadata fields. A collector that re-emits its payload with a PARTIAL
  state (network flake, OOM, code bug, malicious tampering with a valid token)
  silently DELETES the omitted bindings from the platform with no warning log,
  no operator visibility, no activity-feed audit row. Two concrete surfaces: (a)
  **Metadata delete-on-absence**: `MetadataIngestionRequestProcessor.java:72-80`
  computes `bindingsToDelete = existingMetadataBindings.difference(currentBindings).toSet()`
  and issues `metadataFieldValueRepository.delete(bindingsToDelete)` inside the
  same transaction. No `log.warn` records the delete branch (verified — `@Slf4j`
  present at line 30 but zero log calls on the delete path). A re-ingest of entity
  E with metadata `{a:1}` after a prior ingest of `{a:1, b:2, c:3}` silently removes
  `b` and `c`; (b) **Lineage replace-not-merge**: `LineageIngestionRequestProcessor.java:17`
  calls `lineageService.replaceLineagePaths(request.getLineageRelations())`. The
  verb is `replace`, not `merge`: every ingestion call replaces lineage paths
  originating from this datasource''s entities by establisher-grouped DELETE then
  INSERT (`LineageServiceImpl.java:124-133` is `@ReactiveTransactional`, the only
  transactional method on LineageServiceImpl). A collector that forgets to re-emit
  a lineage edge silently removes it; if an establisher in the input pojo set has
  no current edges to delete the delete clause is a no-op; if an existing establisher
  is NOT in the input pojo set, its edges are LEFT UNTOUCHED (the establisher-keyed
  provenance property). The intent is **deliberate**: the maintainer chose `replace`
  semantics for both surfaces — the contract with collectors is "the payload represents
  the complete state of this entity''s relations from this datasource". The trade-off:
  a buggy/compromised collector accepts the loss; an operator querying "why did
  this lineage edge disappear?" has no audit-log answer because the ingestion
  pipeline''s `ActivityIngestionRequestProcessor` (FINALIZING phase) only emits
  `DATA_ENTITY_CREATED` rows for NEW entities, never `DATA_ENTITY_UPDATED` for
  existing entities. No DOC-NNN candidate explains this on the operator-facing
  ingestion docs (`/integrations/ingestion-filters` was verified status 200 on
  2026-05-12 by batch F — silent on this contract; OpenAPI accepts a list and
  the reader reasonably infers per-entity success/failure isolation, which is
  WRONG on two counts: replace-not-merge AND single-transaction-per-batch — the
  latter is captured separately as `single-transaction-per-batch-ingestion-no-per-entity-isolation`).
  Combined surface: an attacker with a valid collector token (or any caller under
  `auth.ingestion.filter.enabled=false`, the default) can ERASE existing metadata
  and lineage by re-emitting incomplete state — destructive WRITE indistinguishable
  in the application logs from legitimate omission.'
axes_present:
- services
nodes:
