behaviour: |-
  Lineage UI plumbing — six behaviours of the LineageGraph component family. (a) Lineage.tsx route-dispatch DEG vs non-DEG branch selection based on isDEG selector. (b) d query-param mounts the canvas with d=1 even when URL omits ?d=. (c) depth-slider change re-fires the dual fetch with new lineageDepth. (d) Pan/zoom transformMatrix persists across navigation via ?t= URL param. (e) Expand-all-groups toggle dispatches expandEntitiesFromUpstreamGroup + expandEntitiesFromDownstreamGroup; the local-state mutation in the slice is order-dependent (module-level globals). (f) parseData assigns a UUID to every node — uuidv4 stability across re-renders (mismatched UUIDs cause React reconciliation thrash).
