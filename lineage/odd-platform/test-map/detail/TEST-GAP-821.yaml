behaviour: |-
  **MEDIUM — `postDataSetStatsList` lacks the empty-payload guard its sibling has, producing NPE on null and silent no-op on empty.**

  The controller method (`IngestionController.java:82-87`) calls `.flatMap(ingestionService::ingestStats)` without any guard. Compare the sibling `postDataEntityList` (`IngestionController.java:40-42`):
  - `postDataEntityList` short-circuits empty/null via `CollectionUtils.isNotEmpty(items)` → throws `BadUserRequestException("Ingestion payload is empty")` → HTTP 400 with structured error.
  - `postDataSetStatsList` has NO such guard.

  Behavior with `items: null`:
  1. Controller delegates to `IngestionServiceImpl.ingestStats(...)` (one-line passthrough to `DatasetFieldService.updateStatistics`).
  2. `DatasetFieldServiceImpl.updateStatistics` (line 161) executes `datasetStatisticsList.getItems().stream()` — NullPointerException on null `getItems()`.
  3. Reactor default error handler propagates → HTTP 500 with stack trace in response body (verified by no `@ExceptionHandler` for NPE in `<odd-platform-repo>/odd-platform-api/src/main/java`).
  4. Caller receives 500 — indistinguishable from a Postgres outage or any other server-side fault.

  Behavior with `items: []`:
  1. Empty `Stream.empty()` flows through line 161-181.
  2. `getLastVersionDatasetFieldsByOddrns(emptySet)` returns empty `existingFields`.
  3. `updateFieldsStatistics(emptyList)` and `updateFieldsTags(emptyList)` are no-ops.
  4. **`reactiveSearchEntrypointRepository.updateStructureVectorForDataEntitiesByOddrns(emptySet)` still fires** (line 179) — possibly DOSing cost on the FTS recalc surface.
  5. Transaction commits empty.
  6. Caller receives 201 Created — indistinguishable from a successful real write.

  **Three asymmetries surface here**:
  - **Empty-vs-null asymmetry** at the same endpoint (one 500, one 201).
  - **Sibling-method asymmetry** (postDataEntityList → 400, postDataSetStatsList → 500/201).
  - **Sibling-method-201 asymmetry** (ingestMetrics ALSO returns 201 on empty per its sidecar; postDataSetStatsList silent — three different empty-payload contracts across three controller methods).

  **Why MEDIUM**: the 500 on null leaks a stack trace (information disclosure — see TEST-GAP-824 mirror for ingestMetrics); the 201 on empty produces a no-op DoS amplifier (each request fires the FTS recalc); the inconsistency is undocumented.

  **Test gap shape**: regression-pin asserting (a) `{}` → 500 NPE; (b) `{items: []}` → 201 + DB no-op; (c) `{items: [{...valid}]}` → 201 + DB write. PINS the three behaviours; pairs with REFACTOR-NNN (add empty-payload guard symmetric with sibling).
