proposed_action: |-
  Add `TermTagAuditAbsenceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `createTermTagsRelations_producesNoActivityEntry_pinsCurrentAbsence` — `PUT /api/terms/{id}/tags`; query the activity table for the term; assert ZERO rows. PINS the current absence.
  2. `linkTermWithDataEntity_producesTermAssignmentUpdatedEntry_documentsTheAsymmetry` — call the sibling term-data-entity link; assert a `TERM_ASSIGNMENT_UPDATED` activity row IS produced. Co-locating this documents that the SAME service audits some term mutations but not the tag one.
  3. `updateDatasetFieldTags_producesDatasetFieldTagsUpdatedEntry_documentsTermTagIsLoneUnauditedSurface` — call the dataset-field tag path; assert a `DATASET_FIELD_TAGS_UPDATED` row IS produced. Establishes that of the three tag-assignment surfaces (data-entity, dataset-field, term), only the term path is unaudited.

  The test PINS the current asymmetry. Pair with REFACTOR-NNN: add `@ActivityLog` to `TermServiceImpl.upsertTags`. When the fix lands, test #1 inverts to assert an activity row IS produced.
