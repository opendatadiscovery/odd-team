name: Delete Data Source (UI admin path — guarded soft-delete, blocks on live children)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  NEW OPERATION, batch 2026-05-21ZB — surfaced at primary source by
  the deleteDataSource method-level sidecar. DELETE
  /api/datasources/{data_source_id} is the UI-admin "remove data
  source" action on the Management → Datasources tab — the fourth
  and final UI-admin DataSource write operation (register + update +
  regenerate-token were the prior three).

  THE OPERATION — what DELETE /api/datasources/{id} does:

    The controller handler (DataSourceController.java:47-51) is a
    4-line proxy: delegate to dataSourceService.delete(id), map to
    `204 No Content`. Despite the name "delete", the operation is a
    GUARDED SOFT-DELETE that BLOCKS on live child data entities.
    DataSourceServiceImpl.delete (DataSourceServiceImpl.java:85-96,
    @ReactiveTransactional):
      (1) calls dataEntityRepository.existsNonDeletedByDataSourceId(id)
          — `SELECT EXISTS(SELECT 1 FROM data_entity WHERE
          data_source_id = ? AND deleted_at IS NULL)`;
      (2) IF any non-soft-deleted data_entity references the data
          source, throws CascadeDeleteException → HTTP 400 — the data
          source is NOT deleted;
      (3) IF no live children exist, dataSourceRepository.delete(id)
          runs the inherited soft-delete `UPDATE data_source SET
          deleted_at = NOW() WHERE id = ? AND deleted_at IS NULL`.

  AUTHORIZATION: path-gated by DATA_SOURCE_DELETE Permission
  (MANAGEMENT tier) at SecurityConstants.java:121-123. NO @PreAuthorize
  on the handler, NO programmatic check — the gate is 100%
  declarative. Under auth.type=DISABLED the endpoint is fully open.
  S2S X-API-Key grants ADMIN, satisfying DATA_SOURCE_DELETE
  unconditionally. DATA_SOURCE_DELETE is MANAGEMENT-tier, not
  entity-scoped — a holder can delete ANY data source.

  THE TWO LOAD-BEARING CHARACTERISTICS:

    (a) THE CASCADE-GUARD makes an actively-ingested data source
        EFFECTIVELY UNDELETABLE. `data_entity` rows are created by the
        collector and re-created on its next ingest tick. An operator
        who soft-deletes all entities and then deletes the source
        RACES the collector: if the collector re-ingests between the
        two steps, the next delete 400s again. The only reliable
        delete path is to STOP THE COLLECTOR FIRST — which no doc page
        mentions. The cascade-guard is a SERVICE-tier business rule,
        not a schema constraint (data_entity_fk_data_source has no
        ON DELETE clause). Pinned by probe P-047.

    (b) THE DELETE IS AN INCOMPLETE SOFT-DELETE — it orphans the
        `token` row and leaves the FTS search_entrypoint vector
        uncleared. This is captured at the dedicated invariant
        `datasource-delete-incomplete-cleanup-orphan-token-uncleared-fts`.

  KEY FACTS:
    - The delete is a SOFT-delete (`deleted_at = NOW()`) — there is NO
      `DELETE FROM data_source` anywhere in the source tree.
    - The delete does NOT cascade — soft-deleting the parent leaves
      child data_entity rows' data_source_id pointing at the
      soft-deleted parent.
    - The delete emits NO Activity Event — an operator auditing "who
      deleted which data source and when" has no audit trail; the
      only signal is the row's deleted_at timestamp, which carries no
      actor.
    - There is no method to recover a soft-deleted data source
      (cross-link to the ReactiveDataSourceRepositoryImpl sidecar).
    - The 400 CascadeDeleteException body carries the message 'Data
      source cannot be deleted: there are still data entities
      attached' — a minor existence-disclosure to a caller already
      holding DATA_SOURCE_DELETE.
    - Returns 204 on success (consistent with the OpenAPI-declared
      `204` for DELETE — unlike POST/PUT which exhibit the 200-vs-201
      drift).

  DISTINCT FROM the S2S ingestion path — there is no S2S
  data-source-delete; the only collector-driven lifecycle on a data
  source is register/update via IngestionController.createDataSourceEntity.
nodes:
  - odd-platform java DataSourceController controller-method:deleteDataSource
