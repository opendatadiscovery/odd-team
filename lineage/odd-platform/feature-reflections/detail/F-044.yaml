### caveat_candidates
- hypothesis_id: H-004
  one_line: |-
    Scheduled auto-flip has no per-tick batch cap; a large synchronized backlog may
    exceed the 9-minute ShedLock window (cadence drift / multi-instance race).
  dedup_status: already_tracked
  tracked_as: DOC-191
  recommended_log_as: caveat in https://docs.opendatadiscovery.org/features/data-discovery/statuses
  note: |-
    DOC-191 (done) ships the "no per-tick batch cap" WARNING documenting the
    10-min cadence + 9-min lock window + burst behaviour; PLT-027 Thread C drafts
    the LIMIT fix. Probe P-390 emitted to MEASURE whether the burst actually
    breaches the window (converts the caveat from theoretical to measured).
- hypothesis_id: H-005
  one_line: |-
    propagate=true is single-hop (DEG-of-DEGs propagates to immediate children
    only) and is silently ignored on non-group entities — no error, no signal.
  dedup_status: net_new
  recommended_log_as: doc-gap-NNN (statuses.md — document the propagate flag's group-only, single-hop semantics; the page currently does not describe the propagate body flag at all per updateStatus.md doc_drift_findings)
