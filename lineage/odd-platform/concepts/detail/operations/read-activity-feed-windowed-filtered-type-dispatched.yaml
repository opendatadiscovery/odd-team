name: Read Activity Feed (windowed, filtered, type-dispatched)
canonical_in_docs: false
canonical_candidate: true
description: GET /api/activity — return Flux<Activity> windowed by (beginDate, endDate)
  with up to 9 filter facets (size, datasourceId, namespaceId, tagIds, ownerIds, userIds,
  type, eventType, lastEventId, lastEventDateTime). type query parameter (ALL / MY_OBJECTS
  / DOWNSTREAM / UPSTREAM) dispatches between four service paths in ActivityServiceImpl.getActivityList.
  Cursor pagination via (lastEventId, lastEventDateTime). Sibling GET /api/activity/counts
  returns 4 aggregate counts in one payload.
