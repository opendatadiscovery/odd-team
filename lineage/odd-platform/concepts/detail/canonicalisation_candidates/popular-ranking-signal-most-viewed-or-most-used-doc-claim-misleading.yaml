  most-viewed or most-used data entities across the catalog". Code: the ranking
  signal is EXCLUSIVELY view_count DESC. There is no "most-used" signal — no
  usage-frequency counter, no time-weighted usage, no edit-count, no
  API-call-count, just the singular view_count field]'
- 'cross-reference: batch-G getPopular sidecar + batch-H
  ReactiveDataEntityRepositoryImpl SQL primary source line 633'
notes: |-
  Surface to maintainer for a one-line doc fix. The catalog-overview.md:50 line
  is the only place this misleading phrase appears; updating it eliminates the
  signal-source ambiguity. This is the kind of "small doc fix surfaced by the
  catalog reducer" that the workspace methodology is designed to surface.
