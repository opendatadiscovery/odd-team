name: metadata_field soft-delete + partial-unique-index mismatch (REFACTOR-223-class)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20R** — surfaced by the
  ReactiveMetadataFieldRepositoryImpl batch-R sidecar. The
  `metadata_field` table has TWO partial unique indexes that filter
  ONLY by `origin`, NOT by `deleted_at`. The sibling `tag_name_unique`
  WAS migrated in `V0_0_64__remove_is_deleted_field.sql:103-105` to
  include `WHERE tag.deleted_at IS NULL`; the metadata_field partial
  indexes were NOT updated in the same migration:

    - `ix_unique_internal_name ON metadata_field(name) WHERE origin =
      'INTERNAL'` (V0_0_1__init.sql:242-244)
    - `ix_unique_external_name_type ON metadata_field(type, name) WHERE
      origin <> 'INTERNAL'` (V0_0_1__init.sql:238-240)

  V0_0_64 retrofitted `metadata_field` with a `deleted_at TIMESTAMP`
  column (lines 41-42) but did NOT update either partial index. The
  base class `ReactiveAbstractSoftDeleteCRUDRepository.java:25`
  hardcodes `deleted_at` as the canonical soft-delete column;
  `listInternalMetadata` and `listByKey` apply `addSoftDeleteFilter`
  filtering soft-deleted rows out of the read side.

  **The UX manifestation**: an operator who soft-deletes a custom
  metadata field with name `cost_centre` (origin=INTERNAL) then tries
  to re-create it via the UI receives
  `UniqueConstraintException("Internal metadata with this name already
  exists")` (ExceptionUtils.java:63-65). But `listInternalMetadata`
  (called by `GET /api/metadata`) had reported no existing field —
  the UI dropdown shows the field as absent. The user sees
  "doesn't exist" in the dropdown but cannot create — a latent UX
  bug whose cause is invisible from the operator-facing surface.

  **No hard-delete path exists in code** (verified by Grep on the
  MetadataFieldServiceImpl + repository inspection) — soft-deleted
  metadata_field rows are PERMANENT name-blockers until a manual
  DBA UPDATE removes the `deleted_at` row or hard-DELETEs the row.

  **The mismatch is asymmetric across the codebase's soft-delete
  convergence story** — the platform's V0_0_64 migration is the
  CANONICAL convergence point where `is_deleted` boolean was
  collapsed onto `deleted_at` timestamp AND the corresponding
  partial unique indexes were updated to include the soft-delete
  predicate. For the Tag table the migration is COMPLETE (column
  drop + partial-index update). For the metadata_field table the
  migration is PARTIAL (column add but partial indexes not touched).

  **Cross-cutting bug class — REFACTOR-223**: the platform has at
  least ONE OTHER instance of the same mismatch class. The
  `collector.name UNIQUE` constraint is a FULL unique constraint
  (V0_0_29:4 — `name varchar(255) UNIQUE`), NOT partial-scoped to
  `WHERE deleted_at IS NULL`. A soft-deleted collector's name
  CANNOT be reused without first hard-deleting the row (per the
  ReactiveCollectorRepositoryImpl batch-R sidecar
  bugs_limitations_corner_cases.[4]). The pattern is:
  SCHEMA-LEVEL FULL UNIQUE on names + soft-delete-via-deleted_at +
  no-partial-index-update = name lockout after soft-delete.

  **The intent at V0_0_64**: the migration's deliberate scope was to
  unify soft-delete schemes around `deleted_at` AND enable
  recreate-after-soft-delete for OPERATOR-FACING entities (Role,
  Policy, Tag, Owner). The metadata_field and collector tables were
  EXCLUDED from the partial-index update. The exclusion is not
  documented anywhere in the codebase or in the doc-site — operators
  encounter the lockout empirically.

  **Triggering scenarios in real deployments**:
    (a) Operator creates a custom INTERNAL metadata field `cost_centre`,
        then deletes it via the UI ("I made a mistake; I'll create
        it again as a different type"). The next create attempt with
        the same name fails opaquely.
    (b) A collector ingests an EXTERNAL metadata field `cost_centre`
        of type STRING; an operator soft-deletes it; the same
        collector re-ingests the same field on its next run — the
        ingestData path's ON CONFLICT clause swallows the conflict
        successfully (ingestData IS race-tolerant; the partial index
        + ON CONFLICT serialise the upsert). The OPERATOR-SIDE
        re-creation via the UI fails; the COLLECTOR-SIDE upsert
        succeeds.
    (c) Operator-deletes a field then EXPECTS the dropdown to allow
        the same name. The dropdown DOES (listInternalMetadata
        filters soft-deleted out); the next create attempt fails.

  **Pair with the tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race
  invariant** — the metadata_field TOCTOU race surface (per the
  ReactiveMetadataFieldRepositoryImpl batch-R sidecar
  concepts.invariants.[4]) is structurally identical to the Tag race;
  the partial-index mismatch ADDS a second class of correctness gap
  on top.
