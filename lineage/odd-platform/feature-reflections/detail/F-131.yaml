      is stored as `text NOT NULL` (V0_0_84__create_query_example.sql:5), indexed verbatim into
      the FTS vector (QueryExampleServiceImpl.java:166-167, hop-4), and is later rendered through
      the same unsanitised `MDEditor.Markdown` on every reader's screen (controller sidecar
      `security.known_security_gaps.[0]`). The authoring dialog is the first cheap intervention
      point in the F-004 chain and it intervenes nowhere.
    evidence:
