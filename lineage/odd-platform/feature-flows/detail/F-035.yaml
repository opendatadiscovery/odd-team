feature_id: F-035
name: Operator-Configured Additional Links
pillar_anchored_id: P-08:F-009
discovered_at_batch: ZE
discovered_at_commit: 25e66b1
discovered_from_entry_point: |-
  ui_route:* — every page that renders AppToolbar mounts AppInfoMenu which
  fires GET /api/links via TanStack Query.
batch_extensions:
  - batch: ZJ
    entry_point_added: |-
      ui-shell-widget:AppInfoMenu — the React widget that consumes
      `useAppLinks()` and renders the operator-configured links inside
      the App Info menu popover. Hop-3 of F-035's chain previously
      cited AppInfoMenu.tsx as an unresolved UI render surface; batch
      ZJ promotes it to a primary-source sidecar AND adds the
      surrounding 5-link-site evidence + the keyboard-inaccessibility
      finding + the keepMounted-+-no-staleTime silent-staleness chain
      + the URL-as-React-key duplicate-key warning.
    contributing_nodes_added:
      - odd-platform ts components/shared/elements/AppToolbar/AppInfoMenu ui-shell-widget:AppInfoMenu
    notes: |-
      FIVE refinements / new findings surface from the AppInfoMenu
      primary-source enrichment:

      (1) TABNABBING SURFACE EXTENDED — ALL 5 LINK SITES, not just
      operator-configured (MEDIUM, STRENGTHENS the existing
      `reverse_tabnabbing_target_blank_without_rel_noopener_noreferrer`
      facet) — The widget uses `<Link target='_blank'>` WITHOUT
      `rel='noopener noreferrer'` at FIVE sites:
        - line 41 (project version GitHub link — hardcoded)
        - line 61 (operator-configured links — already documented)
        - line 95 (Documentation link — hardcoded gitbookLink)
        - line 103 (Slack link — hardcoded slackLink)
        - line 112 (Feedback link — hardcoded reviewLink)
      The four hardcoded targets (docs.opendatadiscovery.org,
      go.opendatadiscovery.org, github.com/opendatadiscovery/odd-platform,
      producthunt.com) are first-party-trusted today but inherit the
      same window.opener leak as a defence-in-depth gap. F-035's
      existing facet identified the operator-configured surface
      specifically; the AppInfoMenu sidecar's evidence widens the
      surface to FIVE link sites. STRENGTHENS the existing facet.

      (2) APP INFO MENU IS KEYBOARD-INACCESSIBLE — WCAG 2.1 SC 2.1.1
      VIOLATION (NEW drift facet, MEDIUM) — AppInfoMenu.tsx:78-82
      declares the icon button with `onMouseEnter` ONLY — no onClick,
      no onKeyDown, no onFocus handler. The ARIA attributes
      (`aria-haspopup='true'` line 80, `aria-controls={menuId}` line 79)
      suggest the AUTHOR EXPECTED keyboard accessibility, but no
      handler is wired. Touch-device users (iOS Safari, Android Chrome)
      generate NO mouseenter on the icon button; the menu is
      unreachable for them too. NEW drift facet for F-035:
      `app_info_menu_keyboard_inaccessible_aria_haspopup_claims_support_no_handler_wired`.

      (3) KEEP-MOUNTED + NO STALE-TIME → YAML EDITS INVISIBLE UNTIL
      RELOAD (NEW drift facet, LOW; STRENGTHENS F-035's existing
      `config_properties_boot_time_only_runtime_yaml_change_silent_until_restart`)
      — AppInfoMenu.tsx:90 sets `keepMounted` on the MUI Menu — the
      DOM tree stays mounted forever after the first hover.
      `lib/hooks/api/appInfo.ts:11-17` sets NO `staleTime`, NO
      `refetchInterval` on the `useAppLinks` query — TanStack Query
      defaults to `staleTime=0` (refetch on every mount). Combined
      with keepMounted, the widget NEVER UNMOUNTS for the lifetime of
      the SPA tab — so the cache is effectively kept hot. Operator
      edits to `odd.links` in YAML + backend restart are invisible to
      users in long-lived SPA tabs until they do a full page reload.
      F-035's `config_properties_boot_time_only` facet identifies the
      backend boot-immutability; this UI-tier finding identifies the
      frontend cache-hot-on-mount amplifier. NEW drift facet:
      `appinfomenu_keepmounted_combined_with_no_staletime_renders_yaml_edits_invisible_until_reload`.

      (4) LINK.URL AS REACT RECONCILIATION KEY — DUPLICATE-URL WARNING
      RISK (NEW drift facet, LOW) — AppInfoMenu.tsx:61 uses `link.url`
      as the React key in the operator-link map. If the operator
      configures two `odd.links` entries with the same URL but
      different titles (e.g. "Runbook" + "Runbook (old)" pointing at
      the same wiki), React emits a duplicate-key warning and may
      de-duplicate the render in some reconciliation paths. NEW drift
      facet for F-035:
      `linkurl_as_react_reconciliation_key_duplicate_url_warning_risk`.

      (5) LOCALISATION GAP — HARDCODED ENGLISH LABELS BYPASS i18n
      (NEW drift facet, LOW) — AppInfoMenu.tsx:20-23, 48, 100, 108, 117
      — labels 'Documentation', 'Slack', 'ODD Platform version', 'Leave
      a feedback' hardcode English and bypass the `useTranslation()`
      infrastructure already present in `AppToolbar.tsx:19`. A non-English
      locale user sees these four labels in English inside an otherwise-
      translated menu. Cross-link F-043. NEW drift facet:
      `appinfomenu_4_hardcoded_english_labels_bypass_i18n_localisation_gap`.

      Coherence sweep STRENGTHENS=2 (`reverse_tabnabbing` facet widened
      from 1 site to 5; `config_properties_boot_time_only` extended with
      the keepMounted+no-staleTime amplifier); SUPERSEDES=0; CONFLICTS=0.

      Cross-references:
        - F-041 (new this batch) owns the toolbar chrome surface that
          HOSTS this widget; F-035 owns the additional-links data
          contract. The two cover different boundaries of the same
          UI affordance.
        - F-043 (new this batch) owns the multilingual UI; the
          AppInfoMenu localisation gap is one of 12+ missing-key-or-
          hardcoded-string sites the i18n feature catalogues.
        - REFACTOR-629 / REFACTOR-631 already track the tabnabbing
          gap + boot-time YAML staleness at the controller / config
          layer; the AppInfoMenu sidecar extends them to the UI
          consumer layer.
  - batch: ZK
    entry_point_added: |-
      config-properties-class:AdditionalLinkProperties — the
      `@ConfigurationProperties("odd")` record-of-records that
      binds `odd.links[].{title,url}` at boot. F-035 batch-ZE
      contributing_nodes flagged the AdditionalLinkProperties node
      as `unresolved: true` (sidecar not yet enriched). Batch ZK
      promotes the props record to a primary-source sidecar AND
      resolves the contributing_nodes entry.
    contributing_nodes_added:
      - odd-platform java org.opendatadiscovery.oddplatform.config.properties config-properties-class:AdditionalLinkProperties
    notes: |-
      FOUR new drift facets surface from the AdditionalLinkProperties
      primary-source enrichment, plus TWO strengthenings of existing
      F-035 facets:

      (1) **RECORD HAS NO VALIDATION ANNOTATIONS — `title` AND
      `url` CAN BE null / EMPTY / MALFORMED (HIGH severity —
      STRENGTHENS F-035's URL-scheme acceptance facet from the
      config-tier angle)** —
      AdditionalLinkProperties.java:8 declares
      `record Link(String title, String url)` with NO
      `@NotBlank`, NO `@NotNull`, NO `@URL`, NO `@Pattern`, NO
      `@Size`. The Spring binder accepts a missing `title` (renders
      as invisible-but-clickable menu item — phishing-vector
      enabler), a missing `url` (renders as `<a href=null>` —
      non-clickable but visible), `javascript:alert(1)` (React
      neutralises but warns in console), `data:text/html,<script>...</script>`
      (browser sandboxes but surprising), `file:///etc/passwd`
      (modern browsers refuse), `wiki.internal` (browser
      interprets as relative path under ODD host, hits 404).
      None of these fail at config-load time. STRENGTHENS the
      F-035 batch-ZE
      `url_scheme_acceptance_javascript_data_file_no_allowlist_no_pattern`
      facet with primary-source at the field-declaration tier.
      NEW drift facet for F-035:
      `additional_link_properties_no_validation_no_notblank_no_url_no_pattern_no_validated_no_postconstruct_validate`.

      (2) **`@ConfigurationProperties("odd")` CLAIMS THE ENTIRE
      `odd.*` SPRING PREFIX BUT BINDS ONLY `links` — LATENT
      `ignoreUnknownFields=false` FAIL-FAST FOOT-GUN (MEDIUM
      severity — boot-failure hazard on future hardening change)** —
      AdditionalLinkProperties.java:6 declares
      `@ConfigurationProperties("odd")` (the prefix is `odd`, NOT
      `odd.links` or `odd.additional-links`). The record only
      binds the `links` sub-field. The OTHER `odd.*` keys
      (`odd.tenant-id`, `odd.platform-base-url`,
      `odd.data-entity-stale-period`, `odd.activity.partition-period`)
      are consumed via `@Value` reads scattered across services
      (SlackMessageGeneratorConfiguration.java:15,
      ExternalMetricReader.java:53, DataEntityStaleDetector.java:10).
      This is a legitimate Spring pattern but fragile: if a future
      hardening change adds `(ignoreUnknownFields = false)` to
      this annotation — a common security-hardening recommendation
      — the application FAILS TO BOOT because the binder sees
      `tenant-id`, `platform-base-url`, etc. as "unknown" sibling
      keys under the `odd` prefix. The latent foot-gun is invisible
      until the hardening is attempted; no test guards against it.
      NEW drift facet for F-035:
      `additional_link_properties_claims_odd_prefix_binds_only_links_latent_ignore_unknown_fields_boot_failure`.

      (3) **CLASS NAME `AdditionalLinkProperties` BINDS `odd.links`
      NOT `odd.additional-links` — class-name-vs-config-key drift
      (LOW severity — operator-mental-model mismatch)** —
      AdditionalLinkProperties.java:6-7 declares the class as
      `AdditionalLinkProperties` but binds `odd.links`. An operator
      searching by config key (`grep odd.links`) finds the class;
      an operator searching by class name (`grep AdditionalLink`)
      finds it too. But an operator skimming `application.yml`
      and seeing `odd.links:` may reasonably assume there is also
      a separate `odd.additional-links:` for some other purpose.
      The 'Additional' qualifier is JAVA-INTERNAL ONLY — the
      YAML/env-visible key is just `odd.links`. The `application.yml:208-214`
      `odd:` block contains `tenant-id`, `data-entity-stale-period`,
      `activity.partition-period` — `links` is NOT in the default
      YAML at all. NEW drift facet for F-035:
      `additional_link_properties_class_name_vs_config_key_drift_additional_in_class_name_only`.

      (4) **BOOT-TIME-IMMUTABLE — EDITS TO `odd.links` IN A RUNNING
      CONTAINER ARE INVISIBLE UNTIL RESTART (LOW severity —
      STRENGTHENS F-035 batch-ZE existing boot-time-staleness
      facet from the props-tier angle)** — AdditionalLinkProperties.java:7
      declares `record AdditionalLinkProperties(List<Link> links)`
      — Java record + final fields + Spring's
      `@ConfigurationProperties` bind once during context refresh.
      There is NO `@RefreshScope`, NO reload-on-file-change
      mechanism. An operator who edits `odd.links` in the
      Kubernetes ConfigMap and reloads the Pod's mounted volume
      sees NOTHING change in the running JVM until restart.
      STRENGTHENS the F-035 batch-ZJ
      `keepmounted_no_stale_time_silent_staleness_chain` facet
      with primary-source at the props-tier angle: the staleness
      is NOT a UI bug, it is a structural property of
      `@ConfigurationProperties` records.

      Plus the `null` vs `List.of()` design observation:
      AdditionalLinkProperties.java:7-9 has no compact constructor
      with `links = links == null ? List.of() : links;` — every
      downstream consumer (LinksController.java:27 handles it; a
      future metrics extractor or audit-logger would need to
      handle it independently). A maintainer fix anchor — but not
      a drift facet per se because LinksController already does
      the null-guard.

      Coherence sweep STRENGTHENS=2 (F-035 batch-ZE
      `url_scheme_acceptance_javascript_data_file_no_allowlist_no_pattern`
      — extended with primary-source at the field-declaration tier;
      F-035 batch-ZJ
      `keepmounted_no_stale_time_silent_staleness_chain` — extended
      with the props-tier boot-time-immutability primary source).
      SUPERSEDES=0. CONFLICTS=0. The `unresolved: true` flag on
      the contributing_nodes entry for AdditionalLinkProperties is
      now resolved (sidecar lives at
      `lineage/odd-platform/understanding/odd-platform__java__config_properties__config-properties-class__AdditionalLinkProperties.md`).
  - batch: ZL
    source_thread: SHB-178
    authored_at: 2026-05-26
    authored_by: feature-flow-builder (slice H2 parallel triage)
    notes: |-
      Merge of SHB-178 — Operator-Configured Additional Links — URL scheme
      unvalidated + reverse tabnabbing + global visibility. This batch
      STRENGTHENS several existing F-035 drift facets with primary-source
      file:line evidence and ADDS the no-RBAC visibility surface as a
      distinct facet.

      EVIDENCE STRENGTHENING (no new facets, primary-source confirmations):

      (1) `reverse_tabnabbing_target_blank_without_rel_noopener_noreferrer`
      — STRENGTHENED with the explicit threat model: an operator who
      configures `odd.links[0].url=https://internal-wiki.example.com` AND
      an attacker who controls a page at that URL (compromised internal
      wiki / third-party content-injection) can call
      `window.opener.location = "https://phishing.example.com"` from JS.
      The parent ODD tab navigates; the user's ODD session is replaced by
      an attacker-controlled login page. MITRE-defined `noopener` keyword
      in `rel` is the standard mitigation. React's auto-defence depends on
      React-Router-specific Link rendering; the toolbar's plain `<a>`
      element bypasses this. Primary source: `AppInfoMenu.tsx:60-66` —
      `<Link target='_blank'>` WITHOUT `rel='noopener noreferrer'`.

      (2) `url_scheme_not_validated_javascript_data_passthrough` —
      STRENGTHENED with primary source: `AdditionalLinkProperties.java:7-9` —
      `record AdditionalLinkProperties(List<Link> links) { record Link(String
      title, String url) {} }` — NO JSR-303 annotations on either field
      (no `@URL`, no `@Pattern`, no `@NotBlank`). React 17+ neutralises
      `javascript:` in `<a href>` at runtime; `data:` URI scheme depends
      on the browser. The platform's contract is "operator-trusted free
      string"; the browser is the only defence.

      (3) `config_properties_boot_time_only_runtime_yaml_change_silent_until_restart`
      — STRENGTHENED with the boot-time-immutable binding semantic.
      Operators editing `application.yml` to add a new link in a running
      container expect the change on next page-load; it does not happen
      until restart. Docs don't mention this.

      NEW FACET:

      `additional_links_no_rbac_global_visibility_internal_url_leak` —
      Operators configuring internal wiki / runbook / Grafana URLs (the
      documented use case) expose those URLs to every authenticated user
      including read-only / zero-owner users. There is NO per-role
      visibility (no `odd.links[].roles: [ADMIN]` mechanism). Per-link role
      tagging would require backend + UI changes. Under `auth.type=DISABLED`,
      the URLs are reachable unauthenticated. Live docs do NOT warn about
      the global-visibility / no-RBAC posture. Evidence:
        - `LinksController.java:25-36` (passthrough mapper, no per-role
           filter)
        - `SecurityConstants.java:95-96` (`/api/links` not in
           WHITELIST_PATHS but no SECURITY_RULES entry either; falls
           through to authenticated default; under DISABLED → open)
        - `AppInfoMenu.tsx:60-66` (renders every link for every user)

      The "two scopes for /api/links" path-namespace observation (collision
      with `/api/dataentities/{id}/links` per-entity attachments — F-027)
      is a doc-clarity observation, not a security gap. Captured here as a
      note rather than a facet.

      Application.yml shipped config: the `odd.links` block is COMMENTED OUT
      in the shipped config (`application.yml:11-20`); operators write it
      themselves with no template-side validation.

      Follow-up scope candidates:
        - SEC-NNN: UI fix — add `rel='noopener noreferrer'` to AppInfoMenu
          link rendering (one-line change in AppInfoMenu.tsx:60-66).
        - SEC-NNN: backend fix — add `@Pattern("^https?://")` or `@URL`
          constraint on `Link.url`, plus `@PostConstruct validate()` on
          `AdditionalLinkProperties` rejecting javascript:/data:/file:/vbscript:.
        - DOC-NNN: operator page admonition — "Operator-configured `odd.links`
          URLs are visible to every authenticated user and rendered in
          `<a target='_blank'>` elements. Restrict configured URLs to trusted
          internal services."

      Probe candidate (local-only): test `data:text/html,<script>alert(1)</script>`
      URL in an `odd.links` entry against the current React 18-based UI;
      confirm whether modern Chrome / Firefox renders or rejects `data:`
      URLs in `<a href>` contexts.

      Confirmation question: the "global visibility" semantic is probably
      DELIBERATE (operator-curated links visible to all users by design);
      the missing rel-noopener and scheme allowlist are likely UNINTENTIONAL.
      Maintainer triage TBD.

      Cluster origin: SHB-178 was filed cluster_with F-035 by the mining
      pass; feature-flow-builder confirms the merge target — F-035's anchor
      is the right home; this thread fills in the operator-trust drift class.
      Provenance: feature-flow-builder slice H2 parallel triage 2026-05-26.
