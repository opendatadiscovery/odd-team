contributors:
- 'PolicyController.createPolicy: entities[Policy, PolicyFormData (name + policy JSON
  string), PolicyDetails, PolicyPojo, PolicyStatementDto, PolicyPermissionDto, PolicyTypeDto];
  operations[create-policy, validate-policy-json-schema, persist-policy, return-policy-details]'
- 'PermissionController.getResourcePermissions: PolicyDto (the materialised policy
  graph evaluated at the read-side); the resolver flattens roles → policies → statements
  identical to the mutation enforcer'
- 'ReactivePolicyRepositoryImpl (batch H): entities[PolicyPojo, PolicyRecord, POLICY
  jOOQ table, ROLE_TO_POLICY jOOQ table, policy_name_unique partial unique index,
  Role (referenced via ROLE_TO_POLICY.ROLE_ID, not loaded here)]; operations[getRolesPolicies
  (the per-request authorization hot path — JOIN policy ⋈ role_to_policy filtered
  by role_id list), inherited create / update / get / list / delete / bulkCreate /
  bulkUpdate from ReactiveAbstractSoftDeleteCRUDRepository, soft-delete writes ONLY
  deleted_at timestamp (NOT is_deleted boolean — that column is functionally dead
  schema)]; 5 ADRs (soft-delete via deleted_at timestamp consistent with every CRUDable
  platform entity; partial unique index on (name) WHERE deleted_at IS NULL enables
  soft-delete-aware-recreation; ExceptionUtils.translateDatabaseException centralised
  unique-constraint-to-UniqueConstraintException translation; repository is policy-AGNOSTIC
  — all business invariants live at PolicyServiceImpl; is_deleted boolean DDL column
  is dead schema — base only writes deleted_at). PolicyServiceImpl is the sole non-test
  caller (8 distinct call sites at lines 47/58/67/74/79/85/93/106). getRolesPolicies
  is on the AUTHORIZATION HOT PATH — invoked by ManagementPermissionExtractor.getNonContextualPermissions
  AND AbstractContextualPermissionExtractor.getContextualResourcePermissions on EVERY
  authorized HTTP request that traverses the permission framework.'
- 'PolicyServiceImpl (batch I): entities[PolicyPojo, PolicyFormData, PolicyDetails,
  Policy, PolicyList, RoleDto, POLICY_SCHEMA (loaded once at class loading)]; operations[getPolicyDetails,
  list (admin-vs-non-admin branching IN MEMORY), create (validate + INSERT), update
  (validate + READ + Administrator-name guard + write — LOST-UPDATE RACE), delete
  (READ + Administrator-name guard + cascade-binding check + soft-delete — orphan-binding
  RACE), getPolicySchema (returns bundled schema to any authenticated caller), getCurrentUserPolicies
  (AUTHORIZATION HOT PATH — invoked on every authorized request)]; 5 ADRs (Service-layer
  business invariants enforced HERE not repository; JSON Schema validation synchronous
  at the WebFlux event-loop thread; Administrator-name reservation on UPDATE+DELETE
  not CREATE; Cascade-delete HARD-BLOCKED at the service layer not cascading cleanup;
  Service composition methods are NON-TRANSACTIONAL in deliberate inconsistency
  with the sibling RoleServiceImpl). 9 bugs (LOST-UPDATE race on update — MEDIUM;
  Administrator CREATE-side asymmetry — MEDIUM; HTTP 500 on schema validation —
  MEDIUM; non-admin pagination ignored — LOW; empty-roles routes to admin path
  vacuously — LOW; cascade-check non-atomic with soft-delete → orphan-binding race
  — MEDIUM; JSON schema validation on WebFlux event loop thread — LOW; no caching
  on authorization hot path — LOW; forensic silence on RBAC mutations — HIGH).'
