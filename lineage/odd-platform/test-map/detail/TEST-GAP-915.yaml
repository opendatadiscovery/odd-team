proposed_action: |-
  Add `DataQualityContentEmptyStateTest` under `odd-platform-ui/src/components/DataQuality/__tests__/`. Three pinning methods:
  (a) `renderWithEmptyTestResults_rendersThreeNoDataDonuts`: mock useGetDataQualityDashboard to return DataQualityResults with testResults=[] and tablesDashboard{tablesHealth:{healthyTables:0,warningTables:0,errorTables:0}, monitoredTables:{monitoredTables:0,notMonitoredTables:0}}. Render <DataQualityContent>. Assert three DonutChart instances exist; each renders the grey 'No data' slice (asserted via the DOM class/style or the rendered text).
  (b) `renderWithEmptyTestResults_rendersNoCategoryCards`: same mock; assert ZERO TestCategoryResults instances render (i.e. no category headings appear).
  (c) `renderWithZeroCountPlaceholders_rendersSixCategoryCardsAllZero`: mock to return the initialData shape (6 categories, each with zero-count results). Assert SIX category cards render, each with total=0 and six en-dash tiles. PINS the distinction between "no categories at all" vs "categories present but all zero".

  Add a `// REGRESSION-PIN — DataQualityContent + DonutChart — the empty state renders three grey No data donuts and a category-card count that reflects backend testResults. If a refactor changes the empty-state UX (e.g. shows an explanatory message), this test breaks and documentation/docs/features/data-quality/dashboard.md must be updated to document the new empty-state copy.` block. Pair with DOC-GAP-NNN (document the empty state on the dashboard page).
