pillar_anchored_feature_name: DQ Test Severity Lifecycle
feature_name: |-
  DQ test severity change (Minor / Major / Critical) — gated by permission but
  emits NO activity event, NO last_modified_by, NO version increment; severity
  drives SLA colour visible cross-tenant; compliance cannot answer "who set
  this to Critical"
seeded_from: SHB-044
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  rest:PUT /api/datasets/{id}/dataqatests/{tid}/severity — the severity
  mutation endpoint. Severity directly drives the dataset's SLA colour per
  SLACalculator's aggregate-weight computation: raising a single test from
  Major to Critical can flip the dataset from Yellow to Red without any test
  pass/fail status changing.
