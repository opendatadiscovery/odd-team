security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      DATA_ENTITY_TAGS_UPDATE correctly enforced at the data-entity
      layer, but writes into MANAGEMENT-scoped Tag directory (side-doors
      past TAG_CREATE).
      **STRENGTHENED batch VAL-LSN-019** — the service-tier
      (TagServiceImpl) carries zero authorization checks; the
      controller perimeter at DataEntityController is the SOLE auth
      defence for the relations-write path. The getOrCreateTagsByName
      call inside this operation IS the side-door — it mints Tag
      directory rows without TAG_CREATE.
  owner_scoping:
    verdict: MIXED
    detail: |-
      RESPECTS at data-entity layer; BYPASSES at Tag directory layer
      (global). The !external guard pattern protects Collector-set
      relations from UI mutation but does NOT scope the directory
      mint by owner.
  strengths:
  - |-
    **NEW batch VAL-LSN-019 — !external guard pattern protects
    Collector-set relations** from UI mutation. The diff filters
    `currentRelations` to `!external` (TagServiceImpl.java:102) before
    the diff; new relations are hardcoded `setExternal(false)` (line 109).
    The UI cannot impersonate a Collector via this path. See the
    `external-relations-immutable-to-ui-users-cross-method-guard-tagserviceimpl`
    invariant.
  - |-
    **NEW batch VAL-LSN-019 — @ReactiveTransactional boundary** — the
    operation IS transactional. The 4-statement orchestration runs
    atomically; a failure mid-flow rolls back.
  weaknesses:
  - Tag side-door past TAG_CREATE (MEDIUM)
  - Operation name vs behaviour drift (create* operationId for replace-all semantic)
  - |-
    **NEW HIGH batch VAL-LSN-019 — TOCTOU race at getOrCreateTagsByName
    call-site** — two concurrent calls with overlapping novel tag
    names race; one wins, the other surfaces UniqueConstraintException
    to the UI user. NO service-tier retry. See the
    `tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race`
    invariant.
  - |-
    **NEW MEDIUM batch VAL-LSN-019 — destructive-on-empty-input** —
    empty `tagNames` Set is interpreted as "remove all non-external
    tags from this data entity". A caller treating `{}` as "no-op"
    triggers a destructive operation. Stress-finding S-C-2.
