behaviour: |-
  **Under auth.type=DISABLED, GET /api/identity/whoami returns 200 OK with
  identity.username='admin' and identity.permissions=Arrays.asList(Permission.values()) —
  the FULL 70+ Permission enum.** The dummyOwner() fallback at IdentityController.java:30-33
  fires whenever ReactiveSecurityContextHolder.getContext() is empty (the defining
  DISABLED-mode condition per DisabledAuthSecurityConfiguration.java:11-19 — no
  ServerSecurityContextRepository is wired). An anonymous network caller probing
  /api/identity/whoami receives a hardcoded admin identity claim with every
  Permission the platform defines, no audit log, no Cache-Control header, no
  rate-limit. The SPA's WithPermissionsProvider then unlocks every Permission-gated
  UI control on the strength of that admin grant. This is the IDENTITY-LAYER FACET
  of REFACTOR-185 (17th sidecar in the cluster) — the centerpiece identity-exposure
  surface of the DISABLED-default operator-trap pattern.
