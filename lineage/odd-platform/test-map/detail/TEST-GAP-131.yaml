behaviour: 'No partition retention / DROP path for the `activity` table — `AbstractPartitionManager.createPartitionsIfNotExists`
  only creates partitions; never invokes `PartitionService.dropPartition` or `getEmptyPastPartitions`.
  The activity table grows monotonically. The docs page (activity-feed Configuration
  section) explicitly tells operators the setting controls ''retention and partitioning''
  — that claim is **incorrect**: `partition-period=7` narrows partitions but does
  NOT shorten the retained window. Severity HIGH per Activity Table Partitioning.performance_aggregate.weaknesses.[0]
  (silent-data-growth class — analogous to LSN-001 in shape).'
