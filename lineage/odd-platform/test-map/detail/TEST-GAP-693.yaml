behaviour: |-
  **`AlertServiceImpl.handleExternalAlerts` PROPAGATES `externalAlert.getGeneratorURL()` VERBATIM into the alert chunk description, rendered later by the UI — STORED-XSS / OPEN-REDIRECT surface.** Line 168 builds the URL via `UriComponentsBuilder.fromUri(externalAlert.getGeneratorURL())`; line 185 embeds it in the description as `String.format("Distribution Anomaly. URL: %s", queryUrl)`. The UI then renders this description text. The `URI` type does some shape validation but does NOT block `javascript:` scheme or arbitrary host URLs. Combined with the UNAUTHENTICATED webhook (per `AlertManagerController` batch P), ANY caller can plant the payload. The end-to-end exploit: (1) attacker POSTs `/ingestion/alert/alertmanager` with `generatorURL=javascript:alert(document.cookie)` and `entity_oddrn=<target entity>`; (2) the AlertManager webhook processes the payload + creates an OPEN alert with the malicious URL in its chunk description; (3) ANY authenticated user visiting `/entities/<entity>/alerts` sees the alert; (4) the UI renders the description — if as innerHTML or as a clickable link, the malicious payload executes / redirects. The file-local evidence does not confirm whether the UI renders description as `innerHTML` (the UI tier is out of scope for this sidecar), but the platform-doc surface from batch P names the externally-injected alert path as the EXPECTED workflow — so the link IS clickable.
