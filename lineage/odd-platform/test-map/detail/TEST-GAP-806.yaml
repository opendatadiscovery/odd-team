behaviour: |-
  **MEDIUM — Email From header derived IMPLICITLY from `notifications.receivers.email.sender`; no allowlist, no domain check.** `EmailNotificationSender.java:46-53` uses `MimeMessageHelper` but never calls `helper.setFrom(...)`. JavaMail's default behaviour: if From is unset, the message takes the session's `mail.from` property OR the JavaMailSender's username (`emailProperties.getSender()` at `NotificationConfiguration.java:55`) as the envelope From.

  **Operator-visible result**: the From header on outgoing alerts equals the `notifications.receivers.email.sender` value verbatim — but this isn't documented in this class or in the live doc.

  **Spoofing risk surface** (bounded but real):
  - An operator with **config-modification capability** (via `/actuator/refresh`, environment-variable injection, K8s ConfigMap patch, AWS SSM write) can set `sender` to ANY address.
  - No allowlist, no domain-match, no SPF/DKIM consideration at the ODD level (those are SMTP-relay-side concerns).
  - For a **multi-team deployment** where the same SMTP relay is shared across multiple ODD instances (or with other applications), an operator can set `sender=ceo@company.com` and outgoing alerts impersonate the CEO — phishing-amplification scenario.

  **The risk is bounded by**:
  - The SMTP relay's own SPF / DKIM / DMARC posture (if strict, the spoofed message is rejected at the relay).
  - The threat model where operator-config-modification is itself a higher-privilege state (e.g. a CI/CD pipeline modifying production secrets).

  But for many deployments — particularly Helm-managed K8s with broad ConfigMap edit permissions, or shared SMTP relays without strict SPF/DKIM — the gap is real.

  **The fix is two lines** (`helper.setFrom("alerts@odd.example.com")` with an operator-configurable + validated From key). The cost of NOT fixing is the spoofing vector + the implicit-from-derivation behavioural surprise.

  **Test gap shape**: regression-pin asserting that the outgoing email's From header equals `notifications.receivers.email.sender` verbatim, with NO allowlist check. PINS the current behavioural surface.
