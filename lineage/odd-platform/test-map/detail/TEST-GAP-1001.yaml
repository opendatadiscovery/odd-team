behaviour: |-
  **MEDIUM — `/master-data/lookup-tables` route at App.tsx:75-88 wraps in `<WithPermissionsProvider allowedPermissions={[LOOKUP_TABLE_CREATE, LOOKUP_TABLE_UPDATE, LOOKUP_TABLE_DELETE]}>` — naming only THREE of the NINE Lookup-Tables-related permissions.**

  The backend (per PolicyPermissionDto.java:80-88) defines a 9-permission model across THREE surfaces:
  - **Table tier**: `LOOKUP_TABLE_CREATE`, `LOOKUP_TABLE_UPDATE`, `LOOKUP_TABLE_DELETE` (the 3 named at the route).
  - **Definition tier** (column schema): `LOOKUP_TABLE_DEFINITION_CREATE`, `LOOKUP_TABLE_DEFINITION_UPDATE`, `LOOKUP_TABLE_DEFINITION_DELETE`.
  - **Data tier** (rows): `LOOKUP_TABLE_DATA_CREATE`, `LOOKUP_TABLE_DATA_UPDATE`, `LOOKUP_TABLE_DATA_DELETE`.

  **Why this is an audit-trail drift, not just a cosmetic enumeration**:
  - An auditor reading App.tsx:75-88 in isolation believes the route is gated on 3 permissions and concludes "the Lookup Tables UI is gated by table-tier RBAC".
  - The actual surface gates 9 permissions, but the OTHER 6 (definition + data tiers) are enforced (a) backend-side at `SecurityConstants.SECURITY_RULES` per the ReferenceDataController sidecar, AND (b) component-side INSIDE `LookupTables.tsx` and its descendants via `<WithPermissions>` wrappers.
  - The asymmetry is invisible from the route declaration. The doc page at `https://docs.opendatadiscovery.org/features/master-data-management/lookup-tables` (WebFetched 2026-05-26 status 200) DOES enumerate "9 permissions on three surfaces — table, definition (the column schema), and data (the rows)" — so the doc is correct, but the route's apparent gate list is a partial enumeration that misleads grep-the-codebase audits.

  **Compounding effect with TEST-GAP-994** (WithPermissionsProvider does not block rendering): the route claims to gate on 3 permissions but actually gates on NONE (per TEST-GAP-994). A reviewer correctly reads "3 permissions" but believes those gate the route; in reality the wrapper is context-only AND the permission list is incomplete.

  **No test pins either symptom**:
  - A regression that ADDS the 6 missing permissions to the route's `allowedPermissions` list (improving the audit trail visibility) ships green.
  - A regression that REMOVES the 3 currently-named permissions (silently zeroing the partial audit trail) also ships green.
test_class: missing-security
criticality_rationale: |-
  Sidecar rates this MEDIUM and held MEDIUM: (a) backend RBAC catches every actual mutation regardless of route-level permission list; (b) the doc page correctly enumerates the 9-permission surface; (c) defect is auditor-misleading, not user-affecting. Bumped from sidecar-rated LOW per Rule 3 cross-pillar amplification (`pillars_affected: [P-03, P-09]` — Master Data + Auth-and-Access). NOT escalated to HIGH because the live impact is bounded by (a) backend enforcement, (b) doc-side accuracy, and (c) the partial enumeration is INTERNALLY consistent (the 3 named ARE the canonical table-tier set; the omission is the other 6 tiers, not a wrong subset of table-tier).
