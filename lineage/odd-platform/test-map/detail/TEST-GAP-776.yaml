behaviour: |-
  **CRITICAL — LSN-002 canonical anchor reaffirmed at config-class tier. `MinioAsyncClient.builder()` at MinioConfig.java:19-25 has EXACTLY THREE method calls: `.endpoint(url)`, `.credentials(accessKey, secretKey)`, `.build()`. `.region(...)` is NEVER called. MinIO SDK default region is `us-east-1`. Production AWS S3 deployments outside `us-east-1` fail with `AuthorizationHeaderMalformed` / `PermanentRedirect` on every `putObject` / `getObject`.**

  **CONFIRMS PRIMARY SOURCE at the file the LSN-002 retrospective named.** The retrospective said: "constructed `MinioAsyncClient.builder()` without calling `.region(...)`". Verified at MinioConfig.java:19-25 — the builder chain is `.endpoint(url).credentials(accessKey, secretKey).build()`. Zero matches for `attachment.remote.region` across the entire codebase. No `@PostConstruct` guard. No in-code comment cross-referencing LSN-002.

  **STRENGTHENS existing TEST-GAP-052** (which already names the LSN-002 region failure mode from the YAML angle). This sidecar provides the config-class-tier primary source: the EXACT builder chain shape with the EXACT line numbers, with the gate-level evidence that REMOTE-mode beans only materialise under `attachment.storage=REMOTE`. Together TEST-GAP-052 + TEST-GAP-776 form a two-tier anchor for the regression pin (YAML config + Java builder).

  **Doc-side remediation is HEALTHY** (WebFetched 2026-05-20 status 200 from `/configuration-and-deployment/odd-platform#attachment-storage-configuration`): "AWS S3 region pinned to `us-east-1`. The attachment client is built without an explicit region, so it uses the MinIO Java SDK's default region (`us-east-1`) for request signing. Against AWS S3 this means only buckets in `us-east-1` work." The OPERATOR knows. The CODE remains unguarded.

  **Code-side remediation is UNIMPLEMENTED**:
  - No `attachment.remote.region` config key (grep returns zero matches).
  - No `.region(operatorRegionOrDefault)` call in MinioConfig.java:19-25.
  - No `@PostConstruct` validator on RemoteFileUploadServiceImpl or MinioConfig that warns when a non-MinIO endpoint is configured without a region key.
  - No in-code comment block `// LSN-002 — region defaults to us-east-1 against AWS S3` at the builder call site.

  **Test gap shape**: REGRESSION-PIN against the current behaviour — a `@SpringBootTest` driving the bean wiring under `attachment.storage=REMOTE` + valid credentials, asserting (a) `MinioAsyncClient` is registered, AND (b) reflection / proxied-builder introspection confirms `.region(...)` was NEVER called. Until the REFACTOR-027 fix lands, the test pins the absence. When the fix lands (operator-configurable `attachment.remote.region` with documented default), the test is the natural place to add the positive contract.

  **Integration-level regression pin** (the OPERATOR FAILURE MODE): a `@SpringBootTest` with Testcontainers running MinIO (which ignores the region header — so happy path proves wiring) + a stub AWS S3 SigV4 validator that requires a specific region header — assert the SigV4 signature carries `us-east-1` regardless of operator config. The two-tier test (unit + integration) prevents both a builder refactor (someone adds `.region(...)` with the wrong default) and a deployment surprise.
