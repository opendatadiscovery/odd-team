  derivation: "Pillar mission anchor (P-07 Activity Feed 'audit metadata changes') + cross-pillar — term mutations like term-tag and term-entity linkage emit Activity events; a user expects query-example linkage to be auditable too."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      QueryExampleServiceImpl carries no @ActivityLog annotations anywhere (QueryExampleController sidecar
      downstream_side_effects + bugs_limitations_corner_cases.[3], verified across the full service).
      linkTermWithQueryExample / removeTermFromQueryExample therefore emit NO Activity Feed event. By
      contrast TermServiceImpl DOES emit (e.g. TERM_ASSIGNMENT_UPDATED on term-entity linkage). So
      attaching/detaching a query example to a term is INVISIBLE on both the global Activity Feed and any
      per-entity Activity tab. This is the canonical audit-log-presence-asymmetry-2-tier-audit-story
      (system-mission.md:386-395).
    evidence:
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController.md
        section: downstream_side_effects
        cite: "QueryExampleServiceImpl.java:1-169 (no @ActivityLog) vs TermServiceImpl @ActivityLog on term linkage"
        note: "query-example linkage produces no audit event"
    operator_visible_failure: |
      An operator or compliance reviewer asking "who attached this query example to the Customer term, and
      when?" gets no answer from the platform — the Activity Feed shows term description edits, owner
      changes, and term-entity links, but the query-example linkage performed through THIS feature leaves
      no trace. For a glossary used as an authoritative business-vocabulary surface this is an
      accountability gap: a query example carrying a sensitive or wrong SQL snippet can be attached to a
      high-visibility term with no record of who did it. Not a security hole per se (the write is
      permission-gated) but a real audit-completeness gap that the cross-pillar nature makes easy to miss.
    severity: MEDIUM
