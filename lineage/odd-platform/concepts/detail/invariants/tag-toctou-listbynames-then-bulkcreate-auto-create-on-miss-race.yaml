mitigations_unimplemented:
- |-
  Add a service-layer retry-on-UniqueConstraintException loop in
  TagServiceImpl.getOrCreateTagsByName: on first UniqueConstraintException,
  re-fetch listByNames, filter out the now-existing names, and re-attempt
  bulkCreate with the (now-empty or now-smaller) residual. Bounded retry
  count (max 2 attempts).
- |-
  Migrate TagServiceImpl.getOrCreateTagsByName to use ingestData (the
  upsert path) instead of bulkCreate. The upsert returns the existing
  row's id; the caller wraps the result list into the relation-create
  call. Single repository method covers BOTH the operator-explicit
  TagController.createTag path (which keeps using the FAIL-ON-DUPLICATE
  semantic) AND the UI tag-assignment path (which uses UPSERT). Requires
  routing decision at TagController.createTag (which wants the 400 on
  duplicate) vs the assign-tag-to-entity flow (which wants the
  return-existing).
- |-
  Wrap the listByNames + bulkCreate pair in a @ReactiveTransactional
  with isolation = SERIALIZABLE on TagServiceImpl.updateRelationsWithDataEntity
  (currently READ COMMITTED). Serialisable would cause the race losers
  to fail with serialisation-failure (40001) which is RETRY-able rather
  than the silent-no-recovery 5xx today.
- |-
  Add a regression test:
    (a) Set up parallel Mono<Void> with the same tag name list;
    (b) Run them concurrently via Mono.zip / StepVerifier with parallel
        scheduler;
    (c) Assert that ONE succeeds AND the other surfaces
        UniqueConstraintException (pinning the current — buggy —
        behaviour as a regression baseline) OR assert BOTH return the
        same Tag id (under the proposed retry-or-upsert fix).
- |-
  Document the TOCTOU race window in the API reference for the
  data-entity-tags-update endpoint — operators can plan retry strategies
  client-side until the server fix lands.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-19N. Primary
  source is the ReactiveTagRepositoryImpl repository sidecar's
  bugs_limitations_corner_cases.[0] — the TOCTOU between
  TagServiceImpl.divideTagsByExistence (listByNames) and the subsequent
  TagServiceImpl.upsertTags (bulkCreate). The race is at the SERVICE
  layer; the repository's DB-side `tag_name_unique` partial index is the
  load-bearing protection that prevents silent-duplicate data corruption,
  at the cost of surfacing the race as a 5xx error to the user.

  Class shape: this is one instance of a CROSS-CUTTING bug class —
  every auto-create-on-miss service-tier method that does listBy →
  bulkCreate without the DB-side ON CONFLICT protection has the same
  race surface. Other instances:
    - Owner auto-create (batch F finding)
    - Namespace auto-create (batch K finding via TermServiceImpl)
    - Title auto-create (similar shape)

  Cross-cutting connections:
    - Pairs with spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create
      — the side-door creates the wide-open surface; the TOCTOU
      surfaces the operational fragility under concurrent load
    - Pairs with permission-bypass-via-owner-auto-create-side-door-write-path
      — same architectural shape on Owner
    - Pairs with the batch-N
      `ingestData-upsert-with-returning-conflict-trigger` operation —
      the SAFE counterpart that the race-prone path should migrate to
    - Cross-references ReactiveTagRepositoryImpl.md:performance.hot_paths.[0]
      — every Collector batch lands here; the race is dormant in the
      ingestData path but live in the bulkCreate path

  Companion testing gap: the batch-N sidecar's
  tests_coverage_semantic.uncovered_behaviours block names this race as
  a HIGH-severity uncovered test case (`testBulkCreate_ConcurrentDuplicateName_
  ThrowsUniqueConstraintException`, `testIngestData_ConcurrentNovelName_
  DoesNotThrow`). The repository has ZERO direct test coverage —
  TagRepositoryImplTest exercises only happy paths.

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the auto-create-on-miss race window for tag-assignment
        callers
    (b) Fix the service layer (retry-on-conflict OR migrate to ingestData
        upsert path)
    (c) Add the regression tests pinning the race behaviour as a
        baseline
