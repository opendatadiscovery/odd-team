security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      SecurityRule(DATA_ENTITY,
      `/api/dataentities/{data_entity_id}/metadata/{metadata_field_id}`,
      PUT, DATA_ENTITY_CUSTOM_METADATA_UPDATE) at
      SecurityConstants.java:204-207. Path matches OpenAPI exactly;
      permission is DATA_ENTITY-scoped against the entity.
      `dataEntity:owner` scope supports owners-only edit.
  owner_scoping:
    verdict: RESPECTS
    detail: |-
      Permission resource-scoped on dataEntityId via
      DataEntityPermissionExtractor. The
      `is: dataEntity:owner` Policy scope grants owners edit.
  weaknesses:
    - |-
      MEDIUM: silent 200-on-missing-pair AND missing-entity — UI
      claims success on writes that didn't land
    - |-
      MEDIUM: no type validation against declared MetadataTypeEnum —
      arbitrary text in any typed column
    - |-
      MEDIUM: EXTERNAL-origin fields silently overrideable — no origin
      check, no audit; data-quality risk for source-system-ingested
      catalog metadata
    - |-
      MEDIUM: `active` column dropped to NULL on every UPDATE — silent
      state-corruption (the pojo's getActive() is NULL because never set)
    - |-
      MEDIUM: missing @ActivityLog — CUSTOM_METADATA_UPDATED enum is
      reserved-but-never-fired; no audit trail for metadata edits
    - |-
      LOW: spec-vs-code drift — the optional `origin` field on the
      request body is silently dropped
    - |-
      HIGH (under DISABLED): anonymous traffic can write/overwrite
      metadata values including collector-ingested EXTERNAL fields
  strengths:
    - |-
      Three distinct permissions (CUSTOM_METADATA_CREATE / UPDATE /
      DELETE) per PolicyPermissionDto.java:15-17 + three SECURITY_RULES
      entries — administrators can grant edit rights independently of
      description and name permissions
    - |-
      @ReactiveTransactional on the upsert + FTS-vector refresh
      pipeline (DataEntityServiceImpl.java:288) — atomicity is
      preserved
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Per-row metadata UPDATE — `ReactiveMetadataFieldValueRepositoryImpl.update`
      runs one UPDATE per call. Composite PK
      (data_entity_id, metadata_field_id) provides O(log N) index lookup
    - |-
      FTS vector refresh — `updateMetadataVectors(dataEntityId)` runs a
      tsvector rebuild for the entity's metadata column on every
      successful update; cost grows with the number of metadata rows
      for the entity
notes: |-
  NEW entity captured in batch 2026-05-19L. The custom-metadata feature
  surface is operationally significant but operator-facing documentation
  is ABSENT — no doc page describes the field-name + type +
  origin model, the per-entity value semantics, the silent-200 contract,
  the type-validation absence, or the EXTERNAL-overwrite hazard.

  Cross-cutting connections:
    - Related operations: upsert-data-entity-metadata-field-value (NEW
      batch L)
    - Related invariants:
      - silent-200-on-missing-pair-or-entity-on-upsert-family (NEW)
      - external-metadata-overwrite-silent-no-origin-check (NEW)
      - active-column-null-regression-on-metadata-update (NEW)
    - Cross-references "FTS Search Vector Data Entity" (existing
      entity) — metadata-value writes refresh the entity's
      metadata_vector
    - Cross-references "Permission-bypass via Owner auto-create
      (side-door write path)" — custom-metadata-create does NOT
      auto-create the field (createMetadataFields uses
      getOrCreateMetadataFields which IS auto-create); upsert is
      UPDATE-only with no auto-create

  Four DOC-NNN candidates:
    (a) Create a custom-metadata operator-facing page describing the
        field-name + type + origin model
    (b) Document the silent-200 contract on the developer API reference
    (c) Document the EXTERNAL-vs-INTERNAL distinction + the override
        semantics
    (d) Fix or document the active=NULL regression on the upsert path
