  - "F-006"
  - "DOC-NNN candidate: S2S+ingestion-filter combined behaviour undocumented"
proposed_action: |-
  Test matrix over (auth.s2s.enabled × auth.ingestion.filter.enabled × X-API-Key × Authorization-Bearer-token). For each combination, assert the expected behaviour. Key cases: (a) both enabled + X-API-Key only → 401 Token is missed (current behaviour, undocumented); (b) both enabled + Bearer-token only → 2xx (filter satisfies via its own check); (c) both enabled + both headers → 2xx; (d) only S2S enabled + X-API-Key → 2xx (filter unregistered, S2S permits); (e) only ingestion-filter + Bearer → 2xx. Document the combined matrix as part of the assertion.
