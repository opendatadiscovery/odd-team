- id: H-006
  hypothesis: |-
    When the entity is a Dataset with ZERO quality tests, the user can tell that
    state apart from "the DQ report is still loading" — i.e. the empty state is
    distinguishable from the loading state.
  derivation: |-
    A reading surface should not present "no data" and "not yet loaded"
    identically; the user makes a real judgement ("this dataset has no quality
    coverage") off this section. Negative-space + the feature-flow's
    `right_column_dq_report...indistinguishable_from_loading` facet.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The composer gate is `isDataset && datasetQualityTestReport?.total ? ... :
      null` (Overview.tsx:105). While the report is loading the selector is
      empty so `?.total` is falsy -> the whole branch is null. A dataset with
      genuinely zero tests also has falsy `?.total` -> also null. The two states
      are DOM-identical (both render nothing in the sidebar). Crucially, the
      OverviewDQTestReport component DOES contain a loading skeleton
      (OverviewDQTestReport.tsx:66-67, `isDatasetTestReportFetching ?
      <OverviewDQReportSkeleton/> : ...`) — but because the composer gate fails
      BEFORE the component mounts, that inner skeleton is dead code for this
      entry path: it never renders during the gate-blocked loading window. So
      the user sees identical empty space for "no tests" and "still loading".
      The canonical doc documents this exact indistinguishability
      (entity-detail-page.md:73-75).
    evidence:
      - sidecar: "(feature-flow F-176 chain hop-2k)"
        section: Overview.tsx DQ gate
        cite: "Overview.tsx:105"
        note: "gate is null for BOTH zero-tests and loading"
      - sidecar: "(Rule-8 confirmation read)"
        section: OverviewDQTestReport skeleton
        cite: "OverviewDQTestReport.tsx:66-67"
        note: "inner skeleton exists but is unreachable while the composer gate is false; source_read_for_validation: true"
      - sidecar: "(doc cross-ref)"
        section: entity-detail-page.md warning
        cite: "documentation/docs/data-discovery/entity-detail-page.md:73-75"
        note: "doc already documents the zero-vs-loading indistinguishability (DOC-263 family)"
    operator_visible_failure: |-
      (1) A user evaluating whether a dataset is quality-monitored sees an empty
      sidebar and cannot tell "this dataset has no tests configured" (a real
      governance gap they should act on) from "the report is still loading"
      (transient). (2) On a slow network the empty sidebar is permanent-looking
      until the (often never-arriving, because gated) report would resolve. (3)
      The misread is asymmetric and dangerous: an operator may record "dataset X
      has DQ coverage" or "dataset X has none" based on a state that is actually
      the other one.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    source_read_for_validation: true
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    test_demand_note: |-
      Feature-flow unit uncovered names "gates DQ section on isDataset &&
      datasetQualityTestReport?.total"; the harder assertion (loading vs zero
      produce identical DOM) is the regression guard worth minting.
      missing-functional demand.

- id: H-007
  hypothesis: |-
    When a user lacks the edit permission for a given panel (e.g. no
    DATA_ENTITY_TAGS_UPDATE), they see the panel's read content but NOT its edit
    affordance — and the per-panel gating is consistent panel-to-panel.
  derivation: |-
    Pillar P-09 promise "authorization gates every mutation"; each panel is
    wrapped in its own <WithPermissionsProvider> with a distinct
    allowedPermissions array (Overview.tsx:67-147).
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |-
      The mechanism is real: seven panels are each wrapped in a
      <WithPermissionsProvider> carrying that panel's own allowedPermissions
      (Description: DATA_ENTITY_DESCRIPTION_UPDATE @:68; Attachments:
      DATA_ENTITY_ATTACHMENT_MANAGE @:75; Metadata: CUSTOM_METADATA_{CREATE,
      UPDATE,DELETE} @:83-86; General/Ownership: OWNERSHIP_{CREATE,UPDATE,DELETE}
      @:96-100; Groups: ADD_TO_GROUP/DELETE_FROM_GROUP @:113-116; Tags:
      TAGS_UPDATE @:128; Terms: ADD_TERM/DELETE_TERM @:135-137). So edit
      affordances ARE permission-gated per panel. The PARTIAL: there is no single
      composer-level provider, so "what can I edit on this entity?" is the union
      of seven independent evaluations — derivable only by walking every panel.
      The doc now states this explicitly (entity-detail-page.md:118-132). The
      hypothesis's "consistent panel-to-panel" clause is the weak part: each
      panel resolves independently against the SAME resourcePermissions value
      (Overview.tsx passes one selector down), so they are consistent in INPUT
      but the CONTRACT (which permission -> which affordance) varies per panel
      with no shared declaration. Additionally, the Metadata "Add metadata"
      button uses WithPermissions (inner, CREATE only) gated additionally on
      `!isStatusDeleted` (OverviewMetadata.tsx:40-55) — a second condition the
      sibling panels do not share, so the gating is NOT uniform.
    evidence:
      - sidecar: "(feature-flow F-176 chain hop-1)"
        section: Overview.tsx seven WithPermissionsProvider wraps
        cite: "Overview.tsx:67-147"
        note: "seven panels, seven distinct allowedPermissions arrays"
      - sidecar: "(Rule-8 confirmation read)"
        section: OverviewMetadata add-gate
        cite: "OverviewMetadata.tsx:40-55"
        note: "Add-metadata additionally gated on !isStatusDeleted — non-uniform; source_read_for_validation: true"
      - sidecar: "(doc cross-ref)"
        section: entity-detail-page.md Permissions surface
        cite: "documentation/docs/data-discovery/entity-detail-page.md:118-132"
        note: "doc documents per-panel-evaluates-locally + per-panel permission table"
    operator_visible_failure: |-
      (1) An admin auditing "what can role X do on this entity?" cannot read a
      single map — they must inspect each panel's behaviour, so a
      mis-provisioned role is easy to miss. (2) The non-uniform extra conditions
      (e.g. deleted-status hides Add-metadata but not other affordances) mean a
      user with full permissions still sees inconsistent affordances depending on
      entity state, with no on-screen explanation.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    source_read_for_validation: true
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    test_demand_note: |-
      Feature-flow integration uncovered names "Permission-stripped user sees
      panels without edit affordances". No test exists. missing-functional demand.

