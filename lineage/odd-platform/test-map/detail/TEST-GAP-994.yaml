behaviour: |-
  CROSS-CUTTING META — `WithPermissionsProvider` is named like a route gate but behaves like a context publisher only. The wrapper unconditionally renders its child (WithPermissionsProvider.tsx:30-39 + 41-48; child is returned via `{render()}` / `<Component />` / `{children}` with no `isAllowedTo`-gated branch); it ONLY seeds `PermissionContext` so descendant `<WithPermissions>` (different component, no `Provider` suffix) can gate UI ACTIONS like buttons.

  Concretely affected route mounts:
  (a) Management — Management.tsx:9-12 (outer wrap on `OWNER_ASSOCIATION_MANAGE`) + ManagementRoutes.tsx:29-149 (7 of 9 sub-routes wrapped); ALL non-associations sub-tabs render to ANY authenticated user.
  (b) Data Modelling — DataModellingRoutes.tsx:19-25 (query-examples wrap on `QUERY_EXAMPLE_CREATE`) + 31-37 (details wrap on `QUERY_EXAMPLE_UPDATE`+`QUERY_EXAMPLE_DELETE`); BOTH render unconditionally — only the inner `<WithPermissions>` around Add/Edit buttons in QueryExamples.tsx:36-46 actually blocks anything.
  (c) Lookup Tables — App.tsx:75-88 (wrap on `LOOKUP_TABLE_CREATE`+`_UPDATE`+`_DELETE`); page chrome + table list ALL render to ANY authenticated user; only the in-list `+Add new` button gated by `<WithPermissions>` at LookupTables.tsx:72-82.

  The naming is a maintainer FOOT-GUN — an auditor reading `App.tsx:75-88` reasonably concludes the route is gated; it is not. A junior maintainer copying the `WithPermissionsProvider` pattern for a future sensitive route (e.g. a `/secrets` page) ships a green-build open-route. ZERO tests exist that pin (a) the misleading semantic OR (b) the deliberate read-collaborative posture across these 3+ surfaces.

  This is the SYSTEMIC FRAMEWORK-NAMING DRIFT for the entire UI-route security model. It pairs with the read-collaborative backend posture documented in concepts.yaml (REFACTOR-024 family) — the intent is consistent, but the wrapper name is sand-trap that survives only because reviewers learn it by experience.
test_class: missing-security
criticality_rationale: |-
  Bumped from HIGH (sidecar-rated MEDIUM individually across 3 sources) to CRITICAL per Rule 3 cross-pillar amplification (`pillars_affected: [P-08, P-09, P-02, P-03]` — 4 pillars; Rule 3 caps cross-pillar bumps at CRITICAL). The drift is FRAMEWORK-WIDE (3+ route mounts using the misleading wrapper), spans 4 pillars (Management / Auth-and-Access / Data Modelling / Master Data), and is the single audit-trail-integrity defect a security-conscious operator would flag first on reading the route table. The behaviour itself is intended (read-collaborative posture); the test gap is the absence of a regression-pin that locks in the deliberate intent against (a) a junior maintainer changing `WithPermissionsProvider` to actually-block (silently breaking 3+ surfaces) OR (b) a future security-tightening PR copy-pasting the pattern for a sensitive route without realising it doesn't block.
