proposed_action: |-
  Unit test on GithubUserHandler with mocked WebClient. (a) Mock /user/orgs to return 429 (or 403 with X-RateLimit-Remaining: 0). (b) Invoke enrichUserWithProviderInformation. (c) Assert the Mono terminates with WebClientResponseException (propagated unchanged); the login flow surfaces this as an OAuth2 error to the user. (d) Verify NO retry attempts (the WebClient was called exactly once). (e) Pin the no-retry contract. Future REFACTOR adding `.retryWhen(Retry.backoff(2, Duration.ofSeconds(1)))` flips the assert to expect 2 retry attempts.
