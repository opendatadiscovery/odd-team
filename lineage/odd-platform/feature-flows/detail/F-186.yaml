pillar_anchored_feature_name: Lineage Canvas Compact/Full View-Mode Toggle
feature_name: |-
  Lineage canvas Compact/Full view-mode toggle — parallel-but-distinct
  per-subtree implementations (DEG = jotai-atom-driven re-layout; Hierarchy =
  Redux/Context-driven re-render only). One label, two semantics; the
  Compact/Full URL `?full=` param is read by BOTH subtrees but each renders
  it differently.
seeded_from: SHB-002
seeded_at: '2026-05-26'
discovered_from_entry_point: |-
  ui_route:/dataentities/{id}/lineage (regardless of class — both DEG and
  non-DEG branches expose a Compact/Full AppTabs control). The toggle is
  one of TWO display-mode controls in the lineage canvas (the other is
  "Show full names" — Hierarchy-only, fn URL param).
