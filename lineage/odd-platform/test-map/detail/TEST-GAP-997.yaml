proposed_action: |-
  Add `managementRoutes.useIntegrationRouteParams.test.tsx`:

  (a) `useIntegrationRouteParams_insideMatchingRoute_returnsString`: render the hook inside `<MemoryRouter initialEntries={['/management/integrations/abc-123']}>` with the route declaration `<Route path='/management/integrations/:integrationId' element={<TestHookConsumer />}>`; assert `integrationId === 'abc-123'`.

  (b) `useIntegrationRouteParams_outsideMatchingRoute_returnsUndefinedTypedAsString`: render the hook inside `<MemoryRouter initialEntries={['/management/policies']}>` (a route without `:integrationId`); assert `integrationId === undefined` at runtime; documents the type-system-lie explicitly so a future caller is warned.

  Add a comment at managementRoutes.ts:43 documenting: 'The `as IntegrationRouteParams` cast strips react-router-dom v6 useParams Partial<> wrapper. The cast is SAFE only inside routes that include `:integrationId` in the path. If you call this hook elsewhere, expect `integrationId === undefined` at runtime despite the type. See TEST-GAP-997 + TEST-GAP-422 / TEST-GAP-849 / TEST-GAP-1000 for the project-wide pattern.'
