# Integration Wizard — product-owner reflection

## product_owner_narrative

The Integration Wizard is the platform's **copy-paste affordance for connecting a data source to ODD**. It lives under `Management → Integrations` (UI route `/management/integrations`) and answers the operator's question "I want to wire up Snowflake / dbt / Airflow — what configuration do I paste where?". Each integration is a card; opening a card reveals ordered content blocks of prose plus parameterised YAML/code snippets the operator copies into their collector config. The wizard is the documented front door to the Pillar-P-10 producer ecosystem and the first step of the Pillar-P-08 operator workflow (read the wizard → register the datasource on the Datasources tab → issue a token on the Collectors tab) (per the IntegrationController sidecar `understanding` + `upstream_callers`; per `system-mission.md` P-08 sub-feature seed "Integrations tab").

A user interacts with it through exactly two read endpoints, both pure GETs against an in-memory registry: `GET /api/integrations` returns the full list of cards (sorted case-insensitively by id), and `GET /api/integrations/{integration_id}` returns one card's full detail with the platform's own URL substituted into the snippets. There are no write endpoints — an operator cannot author a wizard from the UI. The catalogue of wizards is assembled **once at boot** by scanning every jar on the classpath for `META-INF/wizard/*.yaml` files; integrations are shipped artefacts authored by integration-authors and supplied via classpath overlay, not platform state the operator edits (per sidecar `implicit_adrs` #1 + #3; `IntegrationRegistryFactory.java:26` `classpath*:` glob).

The working parts the operator perceives are: a **searchable card list** (the search box filters client-side by name); a **per-card detail view** with titled content blocks and copy-ready snippets; and a single piece of magic — the **`platform_url` substitution**, which injects the platform's configured `odd.platform-base-url` into the snippets so the operator does not have to type their own platform address (per sidecar `concepts.operations` + `StaticArgumentMappingContext.java:11`). The card model also declares an `installed` boolean that the UI renders as an "Integrated" badge — the product's promise that it will tell you which integrations are already wired (per `IntegrationPreviewItem.tsx:44-51`, cited in the sidecar).

The wizard's integration story is entirely **inbound**: it feeds the operator toward Pillar P-10 (the snippet they copy configures a collector/adapter), and it is gated only by Pillar P-09's `auth.type` knob (per `system-mission.md` cross_pillar_relationships). There is no RBAC permission specific to the wizard — every authenticated user reads the full registry, and under `auth.type=DISABLED` any anonymous network caller does too (per sidecar `security` + `DisabledAuthSecurityConfiguration.java:13-18`).

The edge cases a product owner would flag in a demo are sharp and several: a **fresh checkout ships ZERO wizards** (the `<odd-platform-repo>` has no `META-INF/wizard/*.yaml`), so a developer running locally sees an empty panel with no explanation; an **unknown integration id returns 204 No Content, not 404**, so an SDK or operator cannot tell "does not exist" from "exists but empty"; the **`installed` badge never appears** for any integration because the field is hardcoded false; the **default `platform_url` is a literal placeholder** (`http://your.odd.platform`) that lands verbatim in copied snippets unless the operator configures the override; and a **single malformed wizard YAML aborts the whole platform at boot** (per sidecar `bugs_limitations_corner_cases` 1-6 + `stress_findings`).

