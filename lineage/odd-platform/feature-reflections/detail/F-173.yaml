- probe_id: PENDING-F-173-1
  hypothesis_id: H-009
  hypothesis_text: "When a single owner has been bound to two principals that differ only by provider (alice@null via LOGIN_FORM and alice@github via OAUTH2), clicking Remove unbinds exactly the intended one — equivalently, the partial unique index unique_deleted_at_per_owner prevents two active mappings for one owner from EVER coexisting, so the ownerId-only Remove never faces an ambiguous active set."
  local_execution: "Testcontainers + local Postgres: apply migrations through V0_0_89; INSERT one active mapping for owner X; attempt a concurrent second active INSERT for X under a different provider via two R2DBC connections without an enclosing transaction; assert the second raises UniqueConstraintException (the index fires) and that at all times at most one active row exists for owner X. Then deleteActiveRelationByOwner(X) and assert exactly one row soft-deleted."
  expected_outcome: "At most one active mapping per owner at all times; the ownerId-only Remove is unambiguous; no provider-disambiguation needed at the Remove layer."
- probe_id: PENDING-F-173-2
  hypothesis_id: H-010
  hypothesis_text: "When an operator removes a user-owner binding, the affected user's live session immediately loses the owner-scoped permissions and views — no stale-binding window across request boundaries beyond the in-flight request already resolved."
  local_execution: "Local docker-compose odd-platform + Postgres under auth.type=LDAP (the only local mode giving per-user roles): bind user alice to owner X with a Role bundle; open an authenticated session for alice; confirm /api/dataentities/my returns X-owned entities and a gated mutation succeeds; from an admin session DELETE /api/owners/mapping/{X}; then re-issue alice's /api/dataentities/my and the same mutation; observe at which request boundary the owner-scoped reads go empty and the permission is denied."
  expected_outcome: "The first request AFTER the unbind sees the binding gone (per-request re-resolution); no session-scoped cache lets alice keep elevated access across subsequent requests."

