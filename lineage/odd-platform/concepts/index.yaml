extras:
  batch_2026_05_13_g_strengthens:
  - category: entities
    name: Data Entity
    added_sidecars:
    - addDataEntityTerm.md
    - upsertDataEntityInternalDescription.md
    - createDataEntityTagsRelations.md
    - getMyObjects.md
    - getPopular.md
    reason: Five new controller methods extend the per-entity write/read surface —
      term linkage, description editing, tag relations, owner-scoped reads, popular
      ranking.
    new_known_security_gaps_added:
    - SecurityRule path-mismatch silently disables DATA_ENTITY_ADD_TERM/DELETE_TERM
      (HIGH)
    - No backend sanitisation of Markdown body + UI rehype-raw without rehype-sanitize
      (HIGH)
    - Tag side-door past TAG_CREATE via DATA_ENTITY_TAGS_UPDATE scope-asymmetry (MEDIUM)
    - Lineage-variant /my endpoints have single-point-of-failure for owner-scoping
      (MEDIUM)
    - view_count inflation loop trivially pumpable by any authenticated caller (HIGH)
    new_known_performance_gaps_added:
    - No length cap on description body + activity-row 2x payload growth (MEDIUM)
    - No index on data_entity.view_count + sequential scan + sort per Popular page
      render (HIGH)
    - Per-call principal-lookup DB round-trip on every /my request (LOW)
    - Unbounded size param on /my and /popular endpoints (MEDIUM insider DoS)
    - Activity-handler 2x full-list capture on every term-assignment (LOW)
  - category: entities
    name: Owner (Authorization directory entry)
    added_sidecars:
    - getMyObjects.md
    - createDataEntityTagsRelations.md
    reason: 'getMyObjects materialises Owner as per-caller resolution target via user_owner_mapping
      + JOIN OWNERSHIP — primary-source confirmation. createDataEntityTagsRelations
      adds Owner as optional scope of DATA_ENTITY_TAGS_UPDATE via ''is: dataEntity:owner''.'
    new_strengths_added:
    - user_owner_mapping (oidc_username, provider, deleted_at IS NULL) composite key
      cleanly isolates owner identity across auth modes
    new_weaknesses_added:
    - LOGIN_FORM and LDAP both produce provider=null, enabling cross-mode user-identity
      bleed during auth.type migrations (LOW-MEDIUM)
  - category: entities
    name: Policy (Authorization)
    added_sidecars:
    - addDataEntityTerm.md
    - upsertDataEntityInternalDescription.md
    - createDataEntityTagsRelations.md
    - getMyObjects.md
    reason: Four new sidecars surface Policy framework's dataEntity:owner scoping
      (description, tags), INTENDED but unreachable scoping (term-linking), missing
      wiring for owner-scoped reads (getMyObjects bypasses Policy by falling through
      to .authenticated()).
    authorization_consistency_refined: Per-resource Policy resolver (DataEntityPermissionExtractor)
      is the canonical mechanism but reachability depends on SecurityRule path-pattern
      matching — BROKEN for term-linking (HIGH). Two-permission split (DESCRIPTION_UPDATE
      vs TAGS_UPDATE vs ADD_TERM) is intentional fine-grained design.
  - category: entities
    name: Permission (Authorization)
    added_sidecars:
    - addDataEntityTerm.md
    - upsertDataEntityInternalDescription.md
    - createDataEntityTagsRelations.md
    reason: 'Three new permissions surface in batch G: DATA_ENTITY_ADD_TERM (broken
      wiring), DATA_ENTITY_DESCRIPTION_UPDATE (correctly wired), DATA_ENTITY_TAGS_UPDATE
      (correctly wired but side-doors past TAG_CREATE).'
    new_weaknesses_added:
    - DATA_ENTITY_ADD_TERM + DATA_ENTITY_DELETE_TERM unreachable due to path mismatch
      (HIGH)
    - DATA_ENTITY_TAGS_UPDATE conditionally grantable (dataEntity:owner) but writes
      into MANAGEMENT-scoped TAG directory (MEDIUM)
  - category: invariants
    name: Read-collaborative cross-owner enumeration
    added_sidecars:
    - getPopular.md
    reason: getPopular adds the home-page surface — Popular ranking exposes id, oddrn,
      externalName, internalName, entityClasses, status, isStale, hasAlerts to every
      authenticated caller across all owners. Now spans getDataEntityDetails (batch
      F) + getAllAlerts + global activity + search + getPopular (batch G) — FIVE sidecars
      on the pattern.
    triangulation_count_new: 5
  - category: invariants
    name: Owner-link is the gate for owner-scoped views
    added_sidecars:
    - getMyObjects.md
    reason: 'getMyObjects is the PRIMARY-SOURCE site for this invariant (previously
      inferred; now confirmed from canonical owner-scoped controller method). Adds:
      empty Flux silently returned when user-owner_mapping is missing (no 401/403/404
      signal), lineage variants have single-point-of-failure (no JOIN-side filter),
      provider=null cross-mode bleed.'
    primary_source_confirmation: DataEntityController.java:283-289 + DataEntityServiceImpl.java:212-225
      + AuthIdentityProviderImpl.java:50-53 + ReactiveUserOwnerMappingRepositoryImpl.java:77-85
  - category: invariants
    name: Permission-bypass via Owner auto-create (side-door write path)
    added_sidecars:
    - createDataEntityTagsRelations.md
    reason: 'REFINES the pattern. createDataEntityTagsRelations confirms a SECOND
