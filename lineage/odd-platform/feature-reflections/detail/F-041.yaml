  hypothesis: |-
    When a non-English user (e.g. one who has switched the UI to Ukrainian) looks at the toolbar, all nine
    tab labels appear in their selected language.
  derivation: |-
    UI-label — every tab uses t('...'); the senior-PO consistency question (is the localisation complete
    and consistent across the chrome the user lives in?).
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |-
      Three of the nine tab labels — t('Data Quality') (line 46), t('Data Modelling') (line 51),
      t('Master Data') (line 56) — have NO i18n key in en.json or in any of the five non-English locales
      (es/ch/fr/ua/hy). Per the en.json sidecar's grep-verified finding, the missing-key set is identical
      across all six locales, strongly suggesting the three pillar-rename tabs were added after the locale
      corpus was last synced. i18next's natural-keys + fallbackLng chain returns the lookup-key STRING (the
      English literal) after exhausting the chain — so a Ukrainian user sees six tabs translated and three
      (Data Quality / Data Modelling / Master Data) in English, with no error and no visible indication a key
      is missing.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_ToolbarTabs__ui-shell-widget__ToolbarTabs.md
        section: bugs_limitations_corner_cases + references (i18n-corpus)
        cite: "ToolbarTabs.tsx:46,51,56 + locales/translations/en.json (3 keys absent) + ua.json (same 3 absent)"
        note: "missing-key set uniform across all 6 locales; natural-keys fallback renders the English literal silently."
    operator_visible_failure: |-
      A Spanish / French / Ukrainian / Chinese / Armenian user opens the toolbar — present on every screen —
      and sees a chrome that is six-ninths localised and three-ninths English. Failure modes: (1) a visibly
      half-translated navigation bar undermines confidence in the localisation for the whole product; (2)
      the three untranslated labels are exactly the renamed pillar tabs, so the inconsistency is permanent
      until the locale corpus is re-synced; (3) the natural-keys fallback HIDES the bug from any error
      channel — nothing logs the missing key, so it can ship and persist unnoticed. Localisation-quality
      drift; consistent across locales; the highest-visibility i18n gap because it is on the always-present chrome.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
