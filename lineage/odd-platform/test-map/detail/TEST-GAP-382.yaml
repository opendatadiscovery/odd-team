proposed_action: |-
  Add two parameterised cases — (a) entity belongs to two manually-created DEGs; deleting one leaves the filled flag SET; (b) entity belongs to only one DEG; deleting it toggles the flag to UNFILLED. Verify markEntityUnfilled is called only in (b). STRENGTHENED batch L: extend to validate (c) entity is in one MANUAL + one INGESTED DEG; deleting the manual one toggles UNFILLED because the filter excludes ingested DEGs.
