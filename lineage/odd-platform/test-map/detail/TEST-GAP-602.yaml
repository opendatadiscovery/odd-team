behaviour: |-
  **shouldHandle contract + 302 Location shape — base coverage for the entire `auth/logout/` package (6 production classes, 0 test files).** Both AzureLogoutSuccessHandler and CognitoLogoutSuccessHandler are uncovered. (a) shouldHandle: Azure returns true for 'azure'/'AZURE'/'Azure' (case-insensitive equalIgnoreCase at line 27); Cognito returns true for 'cognito'/'COGNITO'/'Cognito' (line 26 via Provider.COGNITO.name()). (b) handle() builds 302 with correct Location URL containing the IdP-specific query params: Azure uses `post_logout_redirect_uri` + `client_id`; Cognito uses `logout_uri` + `client_id` (note: Cognito's parameter name is `logout_uri`, NOT `post_logout_redirect_uri` — the AWS Cognito `/logout` endpoint wire contract). (c) WebSession invalidation in BOTH handlers. (d) Cognito's short-circuit: `if (StringUtils.isEmpty(provider.getLogoutUri())) return Mono.empty();` — when logoutUri is empty, NEITHER redirect IS set NOR session is invalidated; the user is left logged in to ODD. The asymmetric guard (Cognito guards, Azure NPEs — see TEST-GAP-599) needs a paired test. Future addition of a 6th provider (Okta/Keycloak per docs) without corresponding handler will silently fall through to `defaultOidcLogoutHandler` — no test asserts the documented provider set has a handler.
