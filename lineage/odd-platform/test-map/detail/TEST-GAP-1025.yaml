behaviour: |-
  **ToolbarTabs selects the highlighted tab by `pathname.includes(tab.value)`
  — a substring-match heuristic. The contract is fragile in two
  axes:**

  (a) A route rename in `routes/*` can silently break tab
  highlighting WITHOUT anyone noticing until a user complains.
  Example: if the catalog route changes from
  `/search/{searchId}` to `/data-entities/{searchId}` and the
  tab.value remains `/search`, the Catalog tab would
  silently STOP highlighting when a user is on the search page.
  No test pins the route-rename → tab-highlight relationship.

  (b) Substring-match has the FALSE-POSITIVE class: a path like
  `/management/search-anything` (if it ever existed) would match
  both the Management tab (path includes `/management`) AND the
  Catalog tab (path includes `/search`). Today no such overlapping
  route exists, but a future route addition could trip this — no
  test pins the no-overlap invariant.

  (c) The `/` route (Overview landing) has NO matching tab; the
  toolbar shows "no tab selected" by design. This is
  operator-visible (the row looks unselected) and intended but
  undocumented. A regression that defaulted to "Catalog
  highlighted" on `/` would slip through.

  This is the LSN-019 family failure-mode class: silent
  drift from a code rename to a downstream presentational
  decoupling.

  Severity MEDIUM because (a) the drift is operator-visible (tab
  highlighting is a primary UX affordance), (b) the false-positive
  class is structurally bounded today but unbounded under future
  route additions, (c) the fix (move to exact-match or
  prefix-with-delimiter) requires a small refactor with test
  coverage as the rollback safety net.
