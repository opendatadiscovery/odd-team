- id: H-006
  hypothesis: |-
    When an operator picks Okta or Keycloak (both named in the live docs' provider list) and
    configures `admin-groups`, members of those groups are granted ADMIN on login.
  derivation: |-
    The live oauth2-oidc page enumerates seven providers including Okta + Keycloak
    (ODDOAuth2Properties sidecar doc excerpt); an operator expects admin-detection parity.
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      The `Provider` enum has five values (COGNITO/GITHUB/GOOGLE/ODD_IAM/AZURE). Okta and
      Keycloak match no enum value, so their `shouldHandle` lands on CustomOIDCUserHandler (the
      catch-all for any provider NOT in the enum). CustomOIDCUserHandler DOES extend
      AbstractOIDCUserHandler, so admin-groups CAN be honoured IF the operator also configures
      the correct `groups-claim` (the base class requires a non-empty groups claim at line
      44-46). But there is no Okta/Keycloak-specific default groups claim, no provider-specific
      handling, and the docs imply first-class parity that the code does not provide — the
      operator gets the generic OIDC path, not an Okta/Keycloak handler.
    evidence:
      - sidecar: "feature-flow F-084 facet live_docs_claim_okta_keycloak_first_class_code_does_not"
        section: observed_vs_expected.facets
        cite: "Provider.java:3-5 (5 values) + CustomOIDCUserHandler.java:28-34 (catch-all) + live docs (7 providers)"
        note: "Okta/Keycloak fall through Custom OIDC"
      - sidecar: "unresolved (AbstractOIDCUserHandler — source read for validation)"
        section: enrichUserWithProviderInformation
        cite: "AbstractOIDCUserHandler.java:44-46"
        note: "admin-groups requires a non-empty groups-claim; no Okta/Keycloak default exists"
        source_read_for_validation: true
    operator_visible_failure: |-
      An operator who chooses Okta or Keycloak off the docs' seven-provider list and copies
