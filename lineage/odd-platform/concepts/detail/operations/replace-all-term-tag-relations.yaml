security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Gated at the controller perimeter via SecurityConstants.SECURITY_RULES
      (TERM_TAGS_UPDATE, resolved per-term through the TERM
      AuthorizationManagerType). NO @PreAuthorize on the method; NO
      programmatic permission check in TermServiceImpl.upsertTags or the
      TagService methods — path-pattern rule is the sole gate.
  owner_scoping:
    verdict: RESPECTS
    detail: |-
      TERM_TAGS_UPDATE is a TERM-scoped permission resolved per-term — a
      caller can hold a Policy conditionally granting tag-edit on specific
      terms only. This is per-resource scoping (unlike the flat global
      tag directory itself).
  strengths:
    - |-
      Dedicated TERM_TAGS_UPDATE permission — distinct from TERM_UPDATE —
      lets an operator author a Policy that allows tagging terms without
      allowing rename of name/namespace/definition.
    - |-
      @ReactiveTransactional boundary — the delete + auto-create + insert
      + search-vector refresh run atomically.
  weaknesses:
    - |-
      MEDIUM — permission side-door — TERM_TAGS_UPDATE on any single term
      mints global tag directory rows WITHOUT TAG_CREATE; the scope
      asymmetry (TERM-scoped, conditionally grantable, vs MANAGEMENT-scoped
      TAG_CREATE) exacerbates it. See the
      `namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths`
      invariant.
    - |-
      MEDIUM — NO activity-feed audit for term-tag changes — an operator
      auditing 'who changed the tags on term X?' finds NO record; the
      asymmetry vs the audited sibling methods is most likely an oversight.
    - |-
      MEDIUM — empty tag_name_list `[]` silently clears ALL term tags
      (no minItems); a buggy client that forgets to populate the array
      wipes a term's tag set. Pinned by P-027.
    - |-
      MEDIUM under DISABLED — the TERM_TAGS_UPDATE SecurityRule is
      bypassed under auth.type=DISABLED; anonymous callers can overwrite
      term tag sets AND mint directory rows, doubly invisible (no auth +
      no audit).
  cross_file_inconsistencies:
    - |-
      Single contributing sidecar this batch — no cross-file conflict.
      The replace-all-under-create-naming drift matches the existing
      `operation-name-vs-behaviour-drift-create-shaped-operationid-for-replace-all-semantic-tag-relations`
      invariant (data-entity instance) — same drift class, term instance.
  contributing_files:
    - createTermTagsRelations.md
  evidence:
    - 'createTermTagsRelations.md:concepts.invariants[NO activity-feed event]'
    - 'createTermTagsRelations.md:bugs_limitations_corner_cases (permission side-door; DISABLED bypass)'

performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Runs once per term-details-page tag-panel save — low frequency.
      odd-platform java TermController controller-method:createTermTagsRelations
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One term per call; no bulk-term-tagging endpoint. The submitted
      tag_name_list can be arbitrarily long (no maxItems / no per-item
      length cap).
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless controller. Concurrent PUTs for the SAME term race to
      last-committed-tag-set-wins (a classic read-modify-write race on
      the relation set); concurrent novel-tag creation races on the
      tag-directory partial unique index.
  weaknesses:
    - |-
      LOW — concurrent novel-tag creation race: getOrCreateTagsByName
      reads listByNames then bulkCreate (no ON CONFLICT); under
      @ReactiveTransactional the loser's WHOLE transaction rolls back
      (term-relation writes lost too). Pinned by P-028.
  contributing_files:
    - createTermTagsRelations.md
  evidence:
    - 'createTermTagsRelations.md:stress_findings.resource_boundaries'
    - 'createTermTagsRelations.md:bugs_limitations_corner_cases (unique-index race P-028)'

notes: |-
  CAPTURED batch X-TAGGING (2026-05-21). This is a DISTINCT concept
  from `upsert-internal-tag-relations-replace-all` (data-entity path)
  per the conservative-clustering rule — the term path differs in TWO
  material ways (no activity-feed event; no external-tag carve-out).
  Merging them would erase the cross-axis distinction a maintainer
  needs.

  Cross-cutting connections:
    - Pairs with the Tag entity (the directory rows it auto-creates)
    - Sibling of `upsert-internal-tag-relations-replace-all` (the
      data-entity tag-relation write path) and
      `replace-internal-dataset-field-tag-relations` (the dataset-field
      path) — the three-member tag-relation write trio
    - Pairs with `namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths`
      (the TERM_TAGS_UPDATE side-door past TAG_CREATE)
    - Pairs with the new `term-tag-relation-has-no-external-carve-out`
      invariant (the schema-rooted absence of provenance)
