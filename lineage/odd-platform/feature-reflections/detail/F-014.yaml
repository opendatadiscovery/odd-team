# Per-entity alert read — product-owner reflection

## product_owner_narrative

Per-Entity Alert View is the surface that answers one operator question: *"show me every alert ODD has ever raised on THIS data entity."* It is mounted at `GET /api/dataentities/{data_entity_id}/alerts` (a one-line WebFlux delegation at `DataEntityController.java:315-321`, per the getDataEntityAlerts sidecar `understanding`) and returns the entity's full alert history — open, resolved, auto-resolved, with alert chunks and status history — as a paginated `AlertList`. It serves two distinct audiences that the feature-flow deliberately stitches together: the **odd-platform-ui-end-user** who clicks the per-entity "Alerts" tab on a data-entity detail page, and the **platform-operator / compliance audience** the live alerting page explicitly directs here as the *audit-export workaround* for a housekeeping bug (F-010) that hard-deletes manually-resolved alerts. The live page names the endpoint verbatim — "export the alert audit data before manually resolving" (per getDataEntityAlerts sidecar `docs_link_semantic.inferred_docs[0]`). So the user-observable promise has two halves: an operator can see an entity's alert timeline on screen, and can export it durably before the housekeeping cleanup eats it.

How a user interacts with it splits across the two surfaces. The **API surface** is what the doc-recommended workaround drives: a caller supplies `data_entity_id`, `page`, and `size`, and gets back an `AlertList` (per the getDataEntityAlerts sidecar `concepts.operations`). The **UI surface** is the per-entity Alerts tab — the React `DataEntityAlerts` component, mounted under the data-entity detail page's route tree, which fetches with a hardcoded `size=30` and infinite-scrolls (per the F-014 feature-flow `chain` hop `0-ui` evidence). Each alert row is rendered by the shared `AlertItem` component (the SAME component used on the global `/alerts/*` page, per the F-014 feature-flow hop `0-ui-item` + the Alerts.tsx sidecar `understanding`), which exposes a Resolve/Reopen button. A halt-config affordance (`NotificationSettings`) sits on the tab, wrapped in a `WithPermissions` block keyed on `DATA_ENTITY_ALERT_CONFIG_UPDATE` (per the feature-flow hop `0-ui` evidence + PLT-034 `Where`).

The working parts, as the operator experiences them. The read is **unscoped by entity-ownership**: the SQL is `WHERE DATA_ENTITY.ID = :id` with no `OWNERSHIP` join and no principal predicate (per the ReactiveAlertRepositoryImpl sidecar `invariants` + `getAlertsByDataEntityId` row in `downstream_side_effects`), in deliberate structural contrast to the sibling `listByOwner` query which DOES `.join(OWNERSHIP)` and DOES filter `STATUS != DELETED` (per the same sidecar `bugs_limitations_corner_cases` + the getDataEntityAlerts sidecar `implicit_adrs[2]`). The existence guard is **soft-delete-inclusive** by name and intent — `existsIncludingSoftDeleted` (per the getDataEntityAlerts sidecar `implicit_adrs[1]`), the helper's name encoding the audit-preservation choice. The read returns **all statuses** (OPEN / RESOLVED / RESOLVED_AUTOMATICALLY) with no `status` filter, even though the sibling `getDataEntityAlertsCounts` endpoint DOES accept a `status` param (per the getDataEntityAlerts sidecar `concepts.invariants[4]`). Pagination is **unbounded at every layer** — no `@Min`/`@Max` on the controller params, no `minimum:`/`maximum:` in the OpenAPI `PageParam`/`SizeParam`, no clamp at the repository's `OFFSET = (page-1)*size` (per the getDataEntityAlerts sidecar `bugs_limitations_corner_cases[2]`). And the read endpoint has **no SECURITY_RULES entry at all**, while the sibling mutation `PUT /api/dataentities/{id}/alert_config` IS rule-gated with `DATA_ENTITY_ALERT_CONFIG_UPDATE` (per the getDataEntityAlerts sidecar `security.known_security_gaps[1]` + `SecurityConstants.java:304-307`).

The integration story places F-014 inside the same read-collaborative family as its siblings. The cross-owner read posture is the **REFACTOR-024** read-collaborative stance (system-mission P-09 maintainer notes: "every authenticated user can enumerate the entire catalog") applied to a per-entity surface; the doc-gap registry tracks it as DOC-GAP-157 ("the SECOND DOC-GAP naming a cross-owner read posture on an alert read path after DOC-GAP-002"). The soft-delete-inclusive read is structurally identical to the per-entity **Activity** tab (F-021 / PLT-031) and the per-entity **DQ Test-reports** tab (F-022 / PLT-117) — three per-entity surfaces where the backend deliberately preserves data for soft-deleted entities. The alerts this view displays were WRITTEN by F-007 (the AlertManager webhook + in-platform ingestion), and the housekeeping job (F-010) is the reason the audit-export workaround exists at all (system-mission P-07 cross-pillar relationships + the AlertServiceImpl sidecar `dependencies_semantic.requires-config` housekeeping coupling).

Edge cases a product owner would flag in a demo. (1) The endpoint is unauthenticated-authorization by design — under any non-DISABLED auth mode any *authenticated* user reads any entity's alerts; under DISABLED any *anonymous* network caller does (per the getDataEntityAlerts sidecar `security.data_exposure[0,1]`). (2) The audit-export workaround the docs recommend for compliance reaches ACROSS owners — an operator exporting "their" entity's alerts is using an endpoint that has no notion of "their." (3) Soft-deleted entities' alert history is served by the API but the per-entity tab ROUTE is gated on `!isStatusDeleted` (per PLT-031 `Where` — the alerts tab uses `RestrictedRoute condition={!isStatusDeleted}` + `WithPermissionsProvider`), so a UI user and an API caller get DIFFERENT answers for the same soft-deleted entity — the F-022/PLT-117 cross-channel split. (4) The per-entity tab has no status filter and no export button, so an operator wanting only OPEN alerts, or wanting to export, must leave the UI for the API. (5) The endpoint has ZERO automated test coverage (verified by file-system search in the getDataEntityAlerts sidecar `tests_coverage_semantic`) — every behaviour below is traced from primary source, not from a passing test.

