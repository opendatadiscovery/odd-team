name: Data Quality Test Category (anomaly-class bucket)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-04
description: |-
  Per-category grouping of data-quality test runs surfaced on the standalone
  Data Quality Dashboard (`/data-quality`) and named by the backend
  `DataQualityCategory` enum: `Assertion Tests | Volume Anomalies |
  Freshness Anomalies | Schema Changes | Column Values Anomalies | Unknown
  category`. NEW entity, batch ZC (2026-05-22) — first concept-catalog entry
  for the per-category dimension of pillar feature P-04:F-002.

  Each category renders as a `TestCategoryResults` row on the dashboard: a
  category heading (the enum description, rendered verbatim without i18n —
  always English), a large total-count number, and a fixed row of six
  per-run-status count tiles (TestCategoryResults.tsx:11-45). The backend
  `DataQualityCategoryMapperImpl.addMissingStatuses`
  (DataQualityCategoryMapperImpl.java:45-60) guarantees every category's
  `results` array carries one entry per `DataEntityRunStatus` value (zero-count
  injected for absent statuses) — the UI relies on this six-status invariant
  for stable column alignment across rows but does not enforce it.

  The wire-side type is `DataQualityCategoryResults`
  (components.yaml:3802-3813) — `{category: string, results: DataQualityRunStatusCount[]}`.
  The `category` field is `type: string`, NOT an enum — the UI is a generic
  renderer that adapts to new categories without a frontend change; the
  hook's `initialData` six-category list (dataQuality.ts:34-60) is only a
  loading-state placeholder, not a contract.

  vocabulary_status: codebase-anchored, doc-side-partially-covered. The live
  https://docs.opendatadiscovery.org/features/data-quality/dashboard sub-page
  (WebFetched 2026-05-22 status 200) enumerates the six categories verbatim
  in alphabetical order. The dashboard doc page describes "a per-test-category
  matrix on the right showing per-anomaly-class counts" but does not describe
  the per-category ROW shape (heading + total + per-status tile row) or the
  six-status backend guarantee the UI silently depends on.
vocabulary_status: codebase-anchored, doc-side-partially-covered
axes_present:
