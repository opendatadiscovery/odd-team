      nodes_count: 1
      contributors_count: 1
      security_aggregate_overall: null
      performance_aggregate_overall: null
      description: |-
        NEW INVARIANT, batch X-TAGGING — schema-rooted divergence between the three
        tag-relation tables. tag_to_data_entity carries an external boolean;
        tag_to_dataset_field carries a three-value TagOrigin enum; tag_to_term
        carries NEITHER (V0_0_35__add_terms.sql:18-28). Consequence: the term-tag
        replace-all hard-deletes EVERY tag_to_term row absent from the submitted
        list — there is no ingested-tag set to preserve. INTENTIONAL at the schema
        level (terms are UI/API-authored, no ingestion-side tagging path) but worth
