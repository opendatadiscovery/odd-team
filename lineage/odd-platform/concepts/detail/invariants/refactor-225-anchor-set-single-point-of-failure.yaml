  - P-05
  - P-01
description: |-
  NEW INVARIANT, batch 2026-05-19M (4-sidecar PRIMARY-SOURCE confirmation across the
  anchor-set defence audit) — the owner-scoping invariant for the lineage-variant /my
  endpoints (and the DEG-anchored lineage endpoint and the search-facets surface) is
  enforced at EXACTLY ONE site (the anchor resolution via
  authIdentityProvider.fetchAssociatedOwner) with NO defence-in-depth at the SQL-JOIN
  layer. The downstream listByOddrns scan at
  ReactiveDataEntityRepositoryImpl.java:228-253 is a pure WHERE DATA_ENTITY.ODDRN IN (?, ?, ...)
  scan with no JOIN against OWNERSHIP; the lineage recursive CTE at
  ReactiveLineageRepositoryImpl.java:122-176 has no owner JOIN and no owner predicate.
  This contrasts SHARPLY with the sibling /my endpoint (getMyObjects) which routes to
  the JOIN-side defended listByOwner at
  ReactiveDataEntityRepositoryImpl.java:515-534 with explicit WHERE OWNERSHIP.OWNER_ID = ?
  — that endpoint has belt-and-braces enforcement; the /my/upstream and /my/downstream
  endpoints do not. A regression at the SOLE owner-defence site
  (DataEntityRelationsServiceImpl.java:26) — e.g. (a) a future refactor adding a
  fallback owner-id for DISABLED mode, (b) a misordered WebFilter dropping the
  SecurityContext, (c) a corrupted USER_OWNER_MAPPING row, (d) a flatMap-vs-map typo
  passing through to a hardcoded fallback — silently leaks the lineage neighbourhood
  of an unintended anchor with no SQL-layer trip-wire. **Latent today** (current
  fetchAssociatedOwner correctly returns empty for unmapped users) — the architecture
  provides ZERO defence against a future regression at this single load-bearing call
  site. **Architectural-hygiene observation**: the existence of two distinct repository
  methods (listByOwner with the JOIN, listByOddrns without) is the structural evidence
  of intent — if the maintainer wanted the lineage variants to be JOIN-defended, they
  would have constructed a listByOddrnsAndOwner(oddrns, ownerId) method or added a
  Long ownerId parameter to listByOddrns; the absence is the architectural decision
  that creates this single-point-of-failure. **Severity**: HIGH (latent vulnerability;
  the gap is the missing redundant SQL filter, not a present-day defect).
