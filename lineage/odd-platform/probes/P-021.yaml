  combines a SYMMETRIC truncate-to-second tuple comparator
  (`row(trunc(ACTIVITY.CREATED_AT, DatePart.SECOND), ACTIVITY.ID).lessThan(
   truncated_last_event_dt, lastEventId)` — line 287-288) with a
  FULL-PRECISION ORDER BY (`ACTIVITY.CREATED_AT.desc(), ACTIVITY.ID.desc()`
  — line 291).

  HYPOTHESIS: when a single second-bucket SPLITS across two pages, page 2
  may surface rows whose microsecond precedes page 1's cursor-anchor row's
  microsecond — producing a "visual time-travel" effect.

  The probe constructs 100 activity rows within ONE wall-clock second with
  NON-MONOTONIC microsecond ordering relative to id ordering, then pages
  through them and observes the cross-page ordering. The hypothesis is
  CONFIRMED if rows on page 2 have created_at microsecond values GREATER
  than rows on page 1 (visual time-travel).

  When the cursor is upgraded to full-microsecond precision (eliminate the
  `trunc(..., DatePart.SECOND)` and the `truncatedTo(ChronoUnit.SECONDS)`
  matching pair), the test would flip: cross-page ordering would be
  monotonically descending in microsecond.
