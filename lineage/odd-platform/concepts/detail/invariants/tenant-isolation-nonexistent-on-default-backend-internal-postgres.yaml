name: Tenant isolation NONEXISTENT on the default metrics backend (INTERNAL_POSTGRES) — odd.tenant-id is PROMETHEUS-only
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
- P-07
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20-Z (ingestMetrics sidecar)** —
  the `odd.tenant-id` configuration property is consumed ONLY by the PROMETHEUS-
  path metric extractors (CounterTimeSeriesExtractor / GaugeTimeSeriesExtractor /
  HistogramTimeSeriesExtractor / SummaryTimeSeriesExtractor) where it is
  appended as a `tenant_id={value}` Prometheus label at bean construction
  (@Value("${odd.tenant-id}")). The INTERNAL_POSTGRES backend — the
  `matchIfMissing = true` DEFAULT — has NO `tenant_id` column on the
  `metric_series` or `metric_point` tables (verified via
  InternalIngestionMetricsServiceImpl.java:1-295 JOOQ POJO imports —
  MetricSeriesPojo, MetricPointPojo do not declare tenant_id fields).

  **The operator-trap**: a deployment that configures `odd.tenant-id=tenantA`
  AND runs the SHIPPED DEFAULT `metrics.storage=INTERNAL_POSTGRES` (or omits
  the key entirely — `matchIfMissing=true` makes INTERNAL_POSTGRES the
  default) writes ALL metrics into ONE untyped Postgres namespace. There
  is NO multi-tenant isolation. A multi-tenant deployment that relies on
  `odd.tenant-id` for isolation under the default backend has NO isolation.

  **The doc-side gap**: the live `configuration-and-deployment/odd-platform`
  page (WebFetched 2026-05-20, status 200) names `odd.tenant-id` semantically
  as a 'tenant identifier appended as a Prometheus query label' —
  implicitly PROMETHEUS-only — but does NOT explicitly state that
  INTERNAL_POSTGRES IGNORES it. Operators consulting the docs may
  reasonably believe `odd.tenant-id` is universal across both backends.
  The asymmetry is invisible at the property level — the property is
  documented; its scope is not.

  **Composition with REFACTOR-185 AUTH-MODE-ORTHOGONAL facet**: the
  ingestMetrics endpoint is unauthenticated in every supported deployment
  posture (per the batch-Z REFACTOR-185 27-sidecar extension). Combined with
  this tenant-isolation gap, the INTERNAL_POSTGRES default backend in
  a multi-tenant deployment exposes metric data cross-tenant AND
  accepts cross-tenant writes — both via unauthenticated POST /ingestion/metrics.

  **Severity HIGH**: the property's purpose (tenant isolation) is silently
  void on the default storage backend; operators believing they have
  isolation by setting the property have none.
