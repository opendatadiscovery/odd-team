behaviour: |-
  **Three of the nine toolbar tab labels — "Data Quality", "Data
  Modelling", "Master Data" — have NO locale entries in ANY of the
  six locale files (en / es / ch / fr / hy / ua). The English
  literal is therefore shown regardless of the user's selected
  language; the other six tab labels (Catalog / Directory /
  Management / Dictionary / Alerts / Activity) ARE localised.**

  This is the concrete instance pattern that TEST-GAP-1014 (code
  → en.json parity) and TEST-GAP-1015 (en.json → all-locales
  parity) both surface as a class. It is also OPERATOR-VISIBLE:
  a French operator looking at the toolbar sees the six localised
  tabs in French ("Catalogue", "Répertoire", "Gestion",
  "Dictionnaire", "Alertes", "Activité") interspersed with three
  English tabs ("Data Quality", "Data Modelling", "Master Data").
  The visual inconsistency draws attention to itself and reads
  as "the localization is half-done".

  Severity MEDIUM because (a) it surfaces on every UI render
  under non-English locales, (b) the operator-visible
  inconsistency is exactly the kind of polish drift that
  undermines doc-as-product trust, (c) the fix per tab is a
  6-locale entry addition — bounded scope.

  No test pins (a) the current state (3 tabs not localised — the
  regression-pin against an accidental partial fix) OR (b) the
  desired state (all 9 tabs have entries in all 6 locales —
  testable as a static assertion against the JSON files).
