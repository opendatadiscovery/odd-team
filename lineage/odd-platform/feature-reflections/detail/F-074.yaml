- id: H-006
  hypothesis: |-
    When any authenticated user issues GET /api/owner_association_request/activity,
    they receive the full historical forensic record set (who requested association
    with which Owner, who approved/declined, when) — a richer dataset than the live
    pending-request list.
  derivation: |-
    GET /api/owner_association_request/activity has NO SecurityRule (OAR sidecar)
    even though the sibling pending-list GET requires OWNER_ASSOCIATION_MANAGE — an
    asymmetry the sidecar flags HIGH. The drift_class
    owner_association_activity_log_full_forensic_dataset names it.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The OAR controller sidecar records this as a HIGH-severity gap: the activity
      endpoint has no SecurityRule entry while the LIST endpoint
      (/api/owner_association_request, GET) requires OWNER_ASSOCIATION_MANAGE. The
      activity view is "strictly a superset of the list view in sensitivity" — yet
      the more-sensitive view is LESS-gated. The hypothesis (that a user expects the
      forensic audit log to be at least as protected as the live list) is
      contradicted: the activity log is reachable by ANY authenticated user (and
      anonymous under DISABLED), while the live list requires a MANAGEMENT
      permission. NOTE: AdrSecurityRulesContractTest pins exactly ONE GET rule, so
      this asymmetry is locked-in by the very contract that defines the posture.
    evidence:
      - sidecar: odd-platform__java__OwnerAssociationRequestController__controller-class__OwnerAssociationRequestController.md
        section: "security.known_security_gaps[1]"
        cite: "SecurityConstants.java:148-162 (no activity entry) + OwnerAssociationRequestController.java:47-53 + openapi.yaml:3392-3414"
        note: "Activity-log read ungated while pending-list read is gated — the asymmetry is unintended per sidecar (severity HIGH)"
    operator_visible_failure: |-
      (1) An operator who restricts the pending-request list to OWNER_ASSOCIATION_
      MANAGE holders (expecting the same gate on the audit trail) finds any
      authenticated user can read the full association forensic history — every
      "user X requested binding to Owner-Y, admin Z approved at T" event. (2) The
      activity dataset is richer than the gated list (it includes approver identity,
      timestamps, and the manual-vs-self distinction), so the LESS-protected surface
      leaks MORE. (3) Under DISABLED, the entire association audit trail is anonymous-
      readable. This is a genuine authorization-consistency defect (not merely the
      catalog-read posture): the maintainer gated one view and left its superset open.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_ref: null
    test_demand: functional

