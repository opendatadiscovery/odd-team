gap_id: TEST-GAP-221
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java RoleController controller-method:createRole
surfaced_by:
- createRole.md:tests_coverage_semantic.uncovered_behaviours.[9]
behaviour: '`RoleServiceImpl.create/.update/.delete` (lines 39-92) emit no `@Slf4j`
  log lines, publish no events, insert into no audit table. A hijacked admin or S2S
  API-key holder can rewrite the authorization model invisibly. The `activity` feed
  covers DataEntity / Owner mutations but does NOT extend to Role / Policy / Permission
  mutations. This is the highest-leverage audit gap on the RBAC surface.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/RBACMutationAuditTrailTest.java
  name: createRole_currentlyEmitsNoLogNoEventNoAuditRow
evidence:
- 'createRole.md says: ''No audit logging on role mutations'''
- createRole.md:bugs_limitations_corner_cases.[no audit logging] severity HIGH
- 'concepts.yaml:entities[Role (Authorization)].security_aggregate.weaknesses.[1]
  verbatim: ''**No audit log on role mutations (HIGH)**'''
- 'concepts.yaml:cross-cutting NEW INVARIANT (batch E) — ''No-audit-log-on-RBAC-mutations:
  3-sidecar: RoleController.createRole + PolicyController.createPolicy + OwnerController.createOwner.
  None of `RoleServiceImpl.create`, `PolicyServiceImpl.create`, `OwnerServiceImpl.create`
  emit @Slf4j log calls, publish events, or insert into audit tables'''
