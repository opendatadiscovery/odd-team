strengthens:
  - existing_gap_id: TEST-GAP-749
    by_new_gap: TEST-GAP-898
    add_node_id: "odd-platform java DataSourceController controller-method:regenerateDataSourceToken"
    note: |
      The regenerateDataSourceToken controller-METHOD sidecar re-confirms the
      missing-@ReactiveTransactional finding at primary source read this batch
      (DataSourceServiceImpl.java:99 — no annotation; sibling create/update/delete at
      52/69/86 all annotated) AND completes the atomicity analysis the class sidecar
      left open: the missing annotation does NOT produce a partial-write bug today (the
      only DB write is a single atomic UPDATE; tokenGenerator.regenerateToken is purely
      in-memory — no old-invalidated-but-new-not-persisted window). The split-state is
      a LATENT-RISK code-smell, not an active bug; the reflection-assertion test pin
      stays HIGH-value. The CRITICAL rating holds via the plaintext-token compound with
      TEST-GAP-750. Add the regenerateDataSourceToken method node_id to TEST-GAP-749.

  - existing_gap_id: TEST-GAP-750
    by_new_gap: TEST-GAP-898
    add_node_id: "odd-platform java DataSourceController controller-method:registerDataSource + ...regenerateDataSourceToken"
    note: |
      The registerDataSource + regenerateDataSourceToken controller-METHOD sidecars
      supply method-level file:line anchors for the plaintext token chain:
      registerDataSource at DataSourceController.java:30-36 (mints a token
      unconditionally, returns plaintext token.value via showToken=true);
      regenerateDataSourceToken at DataSourceController.java:53-59 (returns the new
      plaintext token, no Cache-Control: no-store — bare .map(ResponseEntity::ok)).
      Probes P-040 + P-052 pin the wire-tier exposure. The LIST side is the masked
      counterpart — NEW TEST-GAP-901. Add the two method node_ids to TEST-GAP-750.

  - existing_gap_id: TEST-GAP-751
    by_new_gap: TEST-GAP-902
    add_node_id: "odd-platform java DataSourceController controller-method:registerDataSource + ...updateDataSource"
    note: |
      The registerDataSource + updateDataSource controller-METHOD sidecars confirm the
      NAMESPACE_CREATE side-door at method-level primary source: registerDataSource —
      DataSourceServiceImpl.java:56-57; updateDataSource — DataSourceServiceImpl.java:74-76
      (the updateDataSource request_inputs block classifies namespace_name as
      TRANSLATES_LEGITIMATELY name->id but flags the get-or-create CREATE side-effect as
      the same escalation-by-side-effect). Probe P-039 pins the bypass. No change to the
      HIGH rating or the test shape. Add the two method node_ids to TEST-GAP-751.

  - existing_gap_id: TEST-GAP-752
    by_new_gap: TEST-GAP-903
    add_node_id: "odd-platform java DataSourceController controller-method:updateDataSource"
    note: |
      The updateDataSource controller-METHOD sidecar supplies the MECHANISM behind the
      full-form-REPLACE: MapperConfig (MapperConfig.java:7-11) sets NO
      nullValuePropertyMappingStrategy, so MapStruct default SET_TO_NULL governs
      DataSourceMapper.applyToPojo (line 49) — an omitted (null) field is WRITTEN as
      null. The method sidecar also CORRECTS the field list: DataSourceUpdateFormData
      has EXACTLY 3 fields (name, description, namespace_name) — NO connection_url / NO
      oddrn (connection_url column dropped by V0_0_71). REPLACE is over 3 fields, not an
      open-ended set. Probe P-043 pins the silent field-wipe. Add the updateDataSource
      method node_id to TEST-GAP-752.

  - existing_gap_id: TEST-GAP-753
    by_new_gap: TEST-GAP-905
    add_node_id: "odd-platform java DataSourceController controller-method:deleteDataSource"
    note: |
      The deleteDataSource controller-METHOD sidecar confirms the cascade-block at
      method-level primary source (DataSourceServiceImpl.java:88-95 +
      ReactiveDataEntityRepositoryImpl.java:158-163) and REFINES the operator impact —
      data_entity rows are collector-re-created on the next ingest tick, so an
      actively-ingested data source is effectively undeletable (the reliable path is to
      stop the collector first, which no doc mentions). Probe P-047 pins the block/allow
      split. The post-delete CLEANUP gaps (orphan token, uncleared FTS) are split out
      into the NEW TEST-GAP-905. Add the deleteDataSource method node_id to TEST-GAP-753.

  - existing_gap_id: TEST-GAP-098
    by_new_gap: TEST-GAP-907
    add_node_id: "odd-platform java DataSourceController controller-method:regenerateDataSourceToken"
    note: |
      The regenerateDataSourceToken controller-METHOD sidecar surfaces the SAME shared
      TokenGeneratorImpl.java:49 finding from the DATA-SOURCE token-rotation path: token
      entropy uses RandomStringUtils.randomAlphanumeric(40), NOT a CSPRNG by default
      (severity HIGH). The data-source regenerate path and the collector regenerate path
      SHARE TokenGeneratorImpl — the SecureRandom fix and the proposed TokenGeneratorImplTest
      (also proposed by TEST-GAP-907) cover BOTH. Widens TEST-GAP-098's node coverage
      from collector-only to both token-issuing surfaces. Add the regenerateDataSourceToken
      method node_id to TEST-GAP-098.

  - existing_gap_id: TEST-GAP-659
    by_new_gap: TEST-GAP-909
    add_node_id: "odd-platform java DataSourceController controller-method:registerDataSource + ...updateDataSource + ...deleteDataSource + ...regenerateDataSourceToken"
    note: |
      All 4 DataSourceController mutation method-sidecars (register / update / delete /
      regenerateDataSourceToken) independently confirm the schema-rooted audit-silence:
      DataSourceServiceImpl emits NO Activity Event for ANY data_source mutation. This is
      the activity.data_entity_id-NOT-NULL schema constraint TEST-GAP-659 already pins —
      datasource register / edit / delete / token-rotation have no data_entity context
      and CANNOT emit even if @ActivityLog-annotated. The regenerateDataSourceToken
      sidecar adds the security-forensics consequence: rotation writes no audit log and
      token.updated_by is overwritten per rotation (single-state) — 'who rotated
      data-source token X before the last rotation' is unrecoverable (severity HIGH).
      Widens TEST-GAP-659's enumerated mutation set with the 4 named DataSource methods.

