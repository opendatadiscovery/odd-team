name: Activity write is in same @ReactiveTransactional as the originating business
  mutation — emit failure rolls back the user's change
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-08
description: |-
  **NEW INVARIANT, batch VAL-LSN-019-B (2026-05-20)** — surfaced by
  primary-source examination of ActivityServiceImpl + ActivityHandler at
  the service tier; cross-referenced against AlertServiceImpl and
  ActivityIngestionRequestProcessor as the three caller paths.

  **THE INVARIANT**: every successful business mutation under @ActivityLog
  AND every successful Alert-state mutation AND every successful S2S
  ingestion DATA_ENTITY_CREATED event runs in ONE @ReactiveTransactional
  that ALSO wraps the activity-row INSERT. There is no decoupling. If the
  activity-row INSERT fails (transient DB error, partition-coverage gap,
  unique-constraint violation), the WHOLE TX rolls back — including the
  user's business mutation.

  **PRIMARY SOURCES** (3 caller paths, all verified line-by-line in batch
  VAL-LSN-019-B):

    Path (a) — @ActivityLog AOP path (the most common):
      `ActivityAspect.java:42` — `@ReactiveTransactional` on
      `monoActivityAspect`
      `ActivityAspect.java:62` — `@ReactiveTransactional` on
      `fluxActivityAspect`
      The aspect wraps the WHOLE business method PLUS the postActivity
      emit (lines 41-94) in ONE TX. 18+ @ActivityLog-annotated methods
      across 10 service files all share this semantic.

    Path (b) — AlertServiceImpl.applyAlertActions:
      `AlertServiceImpl.java:201` — `@ReactiveTransactional` on
      `applyAlertActions`
      The outer method wraps the alert mutation + the `registerNewAlertsActivityEvents`
      (line 309-325) and `registerAutomaticallyResolvedAlertsActivityEvents`
      (line 247-258) calls in ONE TX. Activity emit failure rolls back
      the alert state transition.

    Path (c) — ActivityIngestionRequestProcessor.process:
      `IngestionServiceImpl.ingest:66` — `@ReactiveTransactional` on
      the outer ingestion entry point.
      The TX wraps the WHOLE ingestion pipeline including
      ActivityIngestionRequestProcessor.process's
      `createActivityEvents(...)` call. Activity emit failure rolls
      back the WHOLE ingestion batch (including any other entities
      being ingested in the same request — large blast radius).

  **OPERATOR-SURPRISING SEMANTIC** — this is the OPPOSITE of the
  intuitive expectation. Most operators expect:
    - "audit is best-effort; if the audit row fails, we still keep the
      user's change"
    - "audit fail-open is the default"

  The actual ODD semantic is "audit-or-fail":
    - Transient ActivityRepository write error → user's mutation
      reverted, user sees 500 with no indication the mutation was
      actually applied-then-rolled-back
    - Partition-coverage failure (`no partition of relation "activity"
      found for row` — ReactiveActivityRepositoryImpl batch R coupling
      finding) → same: every mutation in flight when partition rotation
      gaps OUT fails with 500
    - ON CONFLICT collision (would not happen on the unconditional
      INSERT but a future ON CONFLICT addition could) → same

  **CASCADING BLAST RADIUS** on the ingestion path: a single activity
  emit failure during ingestion rolls back the WHOLE S2S ingestion batch
  (possibly hundreds of entities). The data the collector sent is lost;
  the collector sees a 5xx and retries; the retry hits the same emit
  failure; loop until the activity table catches up. No partial-success
  mechanism exists.

  **THE GAP IN DOCUMENTATION** — the live activity-feed.md page
  (verified WebFetch 2026-05-20, status 200) does NOT mention the
  audit-or-fail semantic. The live
  /configuration-and-deployment/enable-security/authorization page
  does not mention it either. An operator reading the docs would
  reasonably conclude audit is best-effort; reality is the opposite.

  **REFACTOR-NNN CANDIDATE** — either:
    (a) Document the audit-or-fail semantic explicitly on the
        activity-feed feature page and on a new operator-facing
        "Activity Feed reliability guarantees" section
    OR
    (b) Decouple via @Async post-commit hook (Spring TransactionSynchronization
        / TransactionalEventListener) — let the business mutation commit
        first, then emit the activity event in a separate TX. Trade-off:
        partial-state (mutation succeeded, audit didn't) becomes possible;
        operators have to accept best-effort audit
    OR
    (c) Add a circuit-breaker / fallback path on the activity emit —
        if the activity DB write fails, write to a local file / queue /
        DLQ for later replay; the business mutation commits
nodes:
- odd-platform java service:ActivityServiceImpl
- odd-platform java service activity handler:ActivityHandler
- odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl
