- id: H-008
  hypothesis: |-
    When a non-admin user opens /management/policies, the policies-overall count
    shown in the subtitle reflects the number of policies actually visible to that
    user (not a larger catalog total they cannot see).
  derivation: |-
    Response-shape: the "X policies overall" subtitle is a user-facing count; a
    user expects it to match what they can see. PolicyList freezes the count to
    the last unfiltered total (PolicyList:invariants).
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |-
      For the SEARCH case the count is intentionally the unfiltered catalogue size,
      not the filtered result (PolicyList.tsx:43-45: useEffect [total]: if (!query)
      setTotalPolicies(total) — frozen during search by design). For the
      non-ADMIN visibility case, the LIST itself is narrowed at the service layer
      to role-attached policies (PolicyServiceImpl.java:53-60), and the total
      returned is filteredPolicies.size() (PolicyServiceImpl.java:115), so the
      count DOES match the non-admin's visible set on the unfiltered view. The
      gap is the search-vs-overall ambiguity: a non-admin filtering their already-
      narrowed list sees e.g. "3 policies overall" alongside 1 visible row, with no
      caption distinguishing "overall" from "matching" — a careful operator may
      infer pagination and hit load-more (which carries the query and naturally
      terminates for non-admins after one page).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__PolicyList.md
        section: invariants
        cite: "PolicyList.tsx:43-45,78 + PolicyServiceImpl.java:53-60,115"
        note: "count = unfiltered catalogue size; non-admin list narrowed by role-attachment; subtitle ambiguous during search."
    operator_visible_failure: |-
      A non-admin operator search-filtering the Policies list reads "N policies
      overall" while seeing fewer rows, with no label clarifying that N is the
      pre-filter total of THEIR visible set. The consequence is mild confusion
      (the user may believe rows are hidden by pagination), not a data-integrity
      or security failure. The non-admin visibility scoping itself is correct;
      only the subtitle wording is ambiguous.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

