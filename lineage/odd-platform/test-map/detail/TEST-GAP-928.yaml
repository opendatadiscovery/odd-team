proposed_action: |-
  Author IdentityControllerAuthMatrixTest as a @SpringBootTest fired across the
  four auth.type modes (DISABLED, LOGIN_FORM, OAUTH2, LDAP). Under DISABLED,
  assert (a) GET /api/identity/whoami → 200 with identity.username='admin'
  literally; (b) identity.permissions.size() == Permission.values().length
  (dynamically tracks enum growth — adding a new Permission enters the admin
  grant); (c) owner == null; (d) NO Cache-Control header (or document the
  actual header). The dynamic-enum assertion is load-bearing: every new
  Permission added to components.yaml automatically enters the DISABLED-mode
  admin-grant blast radius, and only this test catches the silent expansion.
