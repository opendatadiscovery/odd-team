behaviour: |-
  **MEDIUM — `getActivityCounts(beginDate, endDate, ...)` does NOT validate null dates, asymmetric to `getActivityList` / `getDataEntityActivityList` (which both throw `BadUserRequestException` on null dates).** A `GET /api/activity/counts` request without `begin_date` or `end_date` query parameters propagates null through the service → repository → SQL builder. The repository's `getCommonConditions` (per existing repo sidecar lines 264-275) only adds `ACTIVITY.CREATED_AT.greaterOrEqual(...)` if the date is non-null — so null dates produce a count query over the ENTIRE retained activity table (all partitions per F-010, which grows monotonically per the housekeeping job's empty-only-drop semantics). On a multi-year deployment with millions of activity rows, an unbounded COUNT(*) over the full history runs as 4 parallel sequential scans (via Mono.zip — totalCount + myObjectsCount + downstreamCount + upstreamCount), saturating R2DBC connections and stressing the Postgres planner.

  **Primary-source chain**:
  - `ActivityServiceImpl.java:98-100` (`getActivityList`) — null-date guard: `Flux.error(BadUserRequestException("Begin date and end date can't be null"))`
  - `ActivityServiceImpl.java:128-130` (`getDataEntityActivityList`) — SAME null-date guard
  - `ActivityServiceImpl.java:138-166` (`getActivityCounts`) — **NO null-date guard** (verified line-by-line in sidecar)
  - `ActivityServiceImpl.java:158-165` — `Mono.zip(totalCount, myObjectActivitiesCount, downstreamActivitiesCount, upstreamActivitiesCount)` — 4 parallel count queries
  - `ReactiveActivityRepositoryImpl` count methods (`getTotalActivitiesCount`, `getMyObjectsActivitiesCount`, `getDependentActivitiesCount`) — all use `getCommonConditions` which skips date predicates when null
  - `ActivityEmptyPartitionsHousekeepingJob.md:bugs_limitations_corner_cases.[0]` — "The activity table grows monotonically — no DELETE path, no non-empty-partition DROP path" — confirms unbounded historical scan is the operational reality

  **The asymmetry** (per ActivityServiceImpl.md:stress_findings.S-B-3):
  - `getActivityList` requires both dates; rejects null with HTTP 400
  - `getActivityCounts` accepts null both dates; runs over the entire history
  - The asymmetry is NOT documented in the OpenAPI spec (openapi.yaml:3286-3347 doesn't mark dates as required)
  - The asymmetry is NOT documented on the activity-feed.md docs page (silent per `ActivityServiceImpl.md:docs_link_semantic.doc_drift_findings`)

  **Operator-visible consequences**:
  - **UI performance cliff**: a UI bug that fails to pass begin_date/end_date to `/api/activity/counts` (e.g. on first-load before the date picker initializes) triggers 4 parallel full-table COUNT(*) scans
  - **curl/scripted access**: an operator running `curl /api/activity/counts` without dates produces the same effect — the call may take minutes on multi-year deployments
  - **R2DBC pool exhaustion**: 4 parallel long-running counts consume 4 connections; concurrent calls saturate the pool quickly
  - **Postgres planner overhead**: scanning 60+ partitions with no date predicate produces 60+ partition-prune evaluations × 4 queries = 240+ planner invocations per call
  - **DoS-amp**: a hostile or mis-tuned client driving the counts endpoint at 1 request/sec consumes the entire R2DBC pool

  **Why MEDIUM not HIGH**:
  - The empirical performance impact is workload-dependent (small deployments aren't affected; multi-year deployments with daily-cadence partitions accumulate to ~365+ partitions per year)
  - The data correctness is preserved (the count IS the true count — just expensive)
  - We rate MEDIUM because: (a) the asymmetry surface is a clear bug-class shape (validation rules not symmetric); (b) the operational impact under realistic deployment ages is significant; (c) the fix is trivial — add the same null-date guard to `getActivityCounts`.

  **Connection to probe P-023**:
  - The sidecar emits P-023 to measure the actual latency / response shape of `/api/activity/counts` without dates against a populated demo platform
  - This TEST-GAP is the regression-pin AFTER P-023 confirms the empirical behaviour

  **Connection to TEST-GAP-079**:
  - TEST-GAP-079 (existing) pins the null-date validation on `getActivity`
  - This gap (876) pins the ABSENCE of the same validation on `getActivityCounts` — surfacing the asymmetry as the test contract
