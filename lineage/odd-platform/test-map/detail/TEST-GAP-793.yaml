behaviour: |-
  **LOW — An invalid or misspelled `session.provider` value (e.g., `IN-MEMORY` with hyphen, `inmemory` lowercase, `postgres`, anything else) boots the platform SILENTLY with NO `ReactiveSessionRepository<MapSession>` bean registered. The `SpringWebSessionCondition.matches` at SessionConfiguration.java:51-57 returns `false` for anything other than literal strings `INTERNAL_POSTGRESQL` / `IN_MEMORY`. The REDIS branch's `@ConditionalOnProperty` similarly returns `false`. No fail-fast, no WARN log, no enum.**

  Sidecar evidence:
  - SessionConfiguration.java:51-57 — the `.equals("INTERNAL_POSTGRESQL")` / `.equals("IN_MEMORY")` checks are case-sensitive literals.
  - SessionConfiguration.java:62 — REDIS branch via `@ConditionalOnProperty(havingValue = "REDIS")` — also case-sensitive.
  - No enum, no central validator, no boot-time log naming the accepted set.

  **Operator-impact scenario**: an operator setting `SESSION_PROVIDER=REDIS_CLUSTER` (a forwards-thinking value name not yet supported) or `IN-MEMORY` (typo) boots a platform with no session backing — Spring's auto-configuration may fall through to a default `InMemoryReactiveSessionRepository` or fail at first session-write request. The platform's behaviour in this degenerate state is dependent on whether Spring Boot's auto-config provides a fallback.

  **Test gap shape**: parametrised test asserting:
  1. Valid values (`IN_MEMORY`, `INTERNAL_POSTGRESQL`, `REDIS`) — bean wiring per provider.
  2. Invalid values (`in_memory` lowercase, `IN-MEMORY`, `redis`, `''`) — assert either a fail-fast at boot OR (current behaviour) a silent fallback, documenting which.

  PINS the current silent-boot surface; drives REFACTOR-NNN to add an enum-based validator.
