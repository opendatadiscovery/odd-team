notes: |
  This invariant is the cross-batch synthesis that bridges F-006 and F-007.
  Without it, the prior audit-silence narrative seemed to apply uniformly
  ("everything is unaudited") which contradicted the concrete evidence that
  alert state transitions DO produce activity rows (per the AlertIngestionTest
  end-to-end tests asserting alert status persisted across multiple steps).
  The refinement disambiguates two distinct audit gaps that share a name:

    - F-006 audit-silence (RBAC mutations) — STATE-TRANSITION SILENCE.
      Caused by the schema-level NOT NULL data_entity_id FK; remediation
      requires schema migration + service-layer annotation.

    - F-007 audit-silence (AlertManager webhook) — INGRESS SILENCE.
      Caused by the unauthenticated whitelist-path + no-log controller
      method; remediation is a controller-layer @Slf4j log.info + @Timed
      with correlation-id capture (one-day fix).

  The DataSourceIngestionServiceImpl audit gap is mixed:
    - Ingress silence at the controller (IngestionController.createDataSource
      per batch P — no log on entry; only the upstream filter logs).
    - State-transition silence at the service (DataSourceIngestionServiceImpl.java
      only emits DEBUG; no audit event because datasources are NOT
      data_entity-scoped and the schema blocks them).
    - Per batch R: the right scope for cleanup is a schema migration to
      separate platform_event table OR NULLable data_entity_id with a
      discriminator column.

  Recommended cleanup paths (in increasing scope):
    (1) F-007 ingress remediation — controller-layer log.info / @Timed /
        correlation-id capture at AlertManagerController.postAlerts +
        DataSourceIngestionController. Closes the ingress gap.
    (2) F-006 + datasource state-transition remediation — schema migration
        (V0_x_y__separate_platform_event.sql) creating a sibling table
        for non-data-entity events; new ActivityRepositoryImpl methods
        for `platformEvent.save(...)`; new @ActivityLog event-types for
        RBAC + datasource + collector mutations.
    (3) F-007 ingress + state-transition cross-check — extend the
        per-incident reconstruction doc on
        `/configuration-and-deployment/odd-platform#prometheus-alertmanager-integration`
        to call out that "state transitions are audited via the activity
        feed; webhook ingress is not — for forensic reconstruction of a
        forge incident, consult network-tier logs in addition to the
        activity feed".

  Cross-references:
    - Existing invariant `no-audit-log-on-rbac-mutations-...-batch-f` (the
      catch-all audit-silence pattern; this invariant REFINES it).
    - Existing invariant `f-006-audit-silence-schema-rooted-data-entity-id-not-null-fk`
      (the schema-tier root cause).
    - Existing invariant `alertmanager-webhook-bypasses-alert-action-resolver-no-idempotency`
      (the F-007 ingress aspect on the alert side).
    - New invariant `alertservice-handle-external-alerts-skip-resolver-asymmetry`
      (batch S — the service-tier ENACTMENT of the F-007 ingress audit gap).
