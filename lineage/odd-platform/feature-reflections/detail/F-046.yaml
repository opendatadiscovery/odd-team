- id: H-009
  hypothesis: |
    The catalogue treats field names case-insensitively, so a user cannot accidentally create
    `cost_centre` and `Cost_centre` as two separate fields meaning the same thing.
  derivation: |
    UI-label + negative-space: the search box is case-insensitive (containsIgnoreCase), so a user
    naturally assumes the catalogue itself is case-insensitive end-to-end.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Case-sensitivity is asymmetric. The search (listInternalMetadata) is case-INSENSITIVE
      (LOWER(name) LIKE LOWER('%q%')), but the uniqueness index IX_UNIQUE_INTERNAL_NAME and the
      auto-create diff (listByKey uses case-SENSITIVE .eq() on name) treat `cost_centre` and
      `Cost_centre` as distinct. So a user who types a different casing on a second entity mints a
      SECOND row; both then appear together in any case-insensitive search. There is no LOWER(name)
      index and no input normalisation.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveMetadataFieldRepositoryImpl
        section: invariants (case-sensitivity asymmetry) + bugs_limitations_corner_cases[2]
        cite: "ReactiveMetadataFieldRepositoryImpl.java:48 (containsIgnoreCase) vs :65 (NAME.eq) + V0_0_1__init.sql:242-244"
        note: "search insensitive; lookup + unique index sensitive; no normalisation"
    operator_visible_failure: |
      The dropdown shows `cost_centre` AND `Cost_centre` as two pickable options with identical intent,
      and a user typing either casing on a fresh entity creates yet another variant. Values fragment across
      near-duplicate fields; aggregations and downstream consumers see the same concept under multiple keys.
      Combined with H-006 (no signpost) and the no-delete limitation, the catalogue accretes case-variant
      duplicates with no cleanup path. (SHB-008 drift_class tracks this; not in PLT-025's 5 defects.)
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    coverage_note: |
      The repository test's substring assertion uses the EXACT field name, never a case-variant — so
      neither the case-insensitive search nor the case-sensitive duplicate-mint is regression-protected.

- id: H-010
  hypothesis: |
    When a user soft-deletes a custom-metadata field, they can later re-create a field with the same
    name (the name is freed for reuse).
  derivation: |
    Negative-space: soft-delete normally frees the user-visible name; the field disappears from the
    dropdown, so re-creation would succeed.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The metadata_field partial unique indexes filter ONLY by origin, NOT by deleted_at (unlike the
      sibling tag_name_unique which WAS migrated to exclude soft-deleted rows in V0_0_64). So a
      soft-deleted INTERNAL field with name `foo` is filtered OUT of listInternalMetadata (dropdown says
      "absent") but STILL occupies IX_UNIQUE_INTERNAL_NAME — re-creating `foo` throws
      UniqueConstraintException("Internal metadata with this name already exists"). There is no hard-delete
      path in the codebase, so the name is a permanent blocker until a manual DBA UPDATE.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveMetadataFieldRepositoryImpl
        section: bugs_limitations_corner_cases[0] + invariants (partial unique index mismatch)
        cite: "V0_0_1__init.sql:238-244 (no deleted_at predicate) + V0_0_64 (Tag fixed, metadata not) + ExceptionUtils.java:63-65"
        note: "soft-deleted name filtered from read but still blocks create; no hard-delete path"
    operator_visible_failure: |
      A user "removes" a custom-metadata field, sees it gone from the dropdown, then tries to recreate it
      (perhaps with a corrected type) and is told it already exists — while the dropdown insists it does
      not. The two surfaces actively contradict each other. The only resolution is a DBA hard-DELETE, which
      no UI/API exposes. This is the highest-confusion edge case in the feature and is entirely undocumented.
      NOT covered by PLT-025's 5 defects — net-new (and distinct from the case-sensitivity defect).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: |
    The autocomplete returns the same fields in the same order across sessions, so a user sees a stable,
    predictable list.
  derivation: |
    UI-label: a dropdown a user returns to repeatedly is expected to be stable; ordering normally has a
    contract (alphabetical, recency, relevance).
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      There is NO ORDER BY at the SQL layer — Postgres returns rows in heap-scan order, which is roughly
      insertion order on a freshly vacuumed table but becomes arbitrary after creates + soft-deletes +
      vacuum cycles. The UI's MUI Autocomplete preserves input order (it filters but does not re-sort), so
      the operator-visible order IS the heap-scan order. For a small, static catalogue the order is stable
      in practice; for a churning catalogue it drifts between sessions and across deployment generations.
    evidence:
      - sidecar: odd-platform__java__MetadataFieldController__controller-class__MetadataFieldController
        section: stress_findings.orderings + bugs_limitations_corner_cases[2]
        cite: "ReactiveMetadataFieldRepositoryImpl.java:51-55 (no orderBy) + MetadataCreateFormItem.tsx:94-109 (MUI preserves input order)"
        note: "contract-less ordering; UI does not re-sort"
    operator_visible_failure: |
      In a stable small deployment the user sees no problem (hence partial, not contradicted). In a
      long-running deployment with heavy create/delete churn, the same query yields different orderings
      between sessions — the field a user expected near the top moves unpredictably, and there is no
      alphabetical fallback to anchor recognition. Purely UX-shaped (no data loss). (PLT-025 Defect 3
      names the no-ORDER-BY fact as a sub-clause.)
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-012
  hypothesis: |
    With 10,000 custom-metadata fields in the deployment, the autocomplete stays responsive — each
    keystroke-debounce returns quickly and the payload is bounded.
  derivation: |
    Negative-space + performance: an autocomplete fired on every debounced keystroke is expected to be
    cheap; a typical paginated list endpoint bounds its payload.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      Statically: the SQL has no LIMIT, so each call materialises the ENTIRE filtered INTERNAL catalogue
      (N MetadataFieldPojo + N MetadataField DTOs + the wire payload), and the autocomplete fires this on
      focus + each debounced (500ms) keystroke (per the controller sidecar). At 10k fields this is a large
      unbounded payload per keystroke-window with no cache (no @Cacheable anywhere in the chain). The
      latency + payload-size at scale require measurement on a local stand to assign a severity verdict.
    evidence:
      - sidecar: odd-platform__java__MetadataFieldController__controller-class__MetadataFieldController
        section: bugs_limitations_corner_cases[1] + resource_boundaries
        cite: "ReactiveMetadataFieldRepositoryImpl.java:44-56 (no LIMIT) + MetadataCreateFormItem.tsx:43-51 (debounced dispatch) + no @Cacheable"
        note: "unbounded return amplified by per-keystroke dispatch; no cache"
    operator_visible_failure: |
      (predicted, pending probe) At high catalogue cardinality the dropdown becomes laggy on every
      keystroke and the response payload balloons; the amplification scales linearly with row count. The
      severity is LOW at typical tens-of-rows scale and rises toward HIGH at thousands — the exact knee
      requires the local probe to quantify. (PLT-025 Defect 3 notes the "1-2 MB response on every
      autocomplete keystroke" claim; this probe quantifies it.)
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-046-1
    routes_to_finding: probe-needed
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-046-1"
