notes: |
  Cross-batch architectural-hygiene observation. The anchor-set defence-in-depth
  pattern is a real platform primitive (visible in DataEntityRelationsServiceImpl
  + DataEntityServiceImpl.listAssociated + AlertServiceImpl.listByOwner) but is
  applied SPARSELY relative to the read-collaborative posture's blast radius.

  The pattern is the highest-leverage SERVICE-LAYER mitigation for the cross-owner
  enumeration findings in batch G/H (REFACTOR-024, REFACTOR-203). The SQL layer
  has no owner column (lineage table) or no owner predicate (data_entity reads);
  the service tier is the only place where the owner-scoping can be re-introduced
  without rewriting the schema. The architecture supports it; the application is
  incomplete.

  Cross-references:
    - Companion invariant: `read-collaborative-cross-owner-enumeration` (REFACTOR-024/203
      controller + repository confirmations).
    - Companion invariant: `owner-link-is-the-gate-for-owner-scoped-views` (owner-link
      table is the underlying primitive that fetchAssociatedOwner consumes).

  Recommended cleanup paths:

    - Audit every list-shape read method on every service for the anchor-set pattern.
      Surface a `mustScope(reason)` annotation on methods that BYPASS the anchor —
      the maintainer must explicitly justify the bypass.

    - For the highest-traffic surfaces (DataEntityServiceImpl.getDetails, LineageServiceImpl.getLineage),
      add the anchor-set as a service-layer guard. This closes the cross-owner
      surface for those endpoints without any SQL changes.

    - Doc-side: extend `/configuration-and-deployment/enable-security/authorization`
      with a 'Read-side defence' section explaining the anchor-set pattern, listing
      which surfaces APPLY it and which DO NOT.
