name: Single-fetch aggregate dashboard projection (one GET serves N visual blocks)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The Data Quality Dashboard is a SINGLE-FETCH composition: one HTTP
  GET /api/dataqatests/runs returns the `DataQualityResults` DTO that
  serves all three breakdown rings (Table Health, Test Results
  Breakdown, Monitored Tables) AND every per-test-category card AND
  both status legends — five visual blocks plus N category cards, all
  derived from the SAME atomic DTO. NEW invariant, batch ZC (2026-05-22).

  The decision is operator-facing: every ring on the dashboard reflects
  THE SAME filter application AT THE SAME instant. No partial-load
  skew. An operator who sees "Table Health = 75% healthy" and "Test
  Results Breakdown = 90% pass" knows both numbers describe the same
  filter slice.

  The backend operationalises the pattern by zipping three repository
  queries server-side
  (`DataQualityRunsServiceImpl.java:36-42`:
  `.testResults(testsMapper.mapToDto(item.getT1()))
  .tablesDashboard(tablesDashboardMapper.mapToDto(item.getT2().getT1(),
  item.getT2().getT2()))`) into one `DataQualityResults` response. The
  frontend (`DataQualityContent.tsx:24, 43-77`) derives all five visual
  blocks from the one `data` source via memoised reductions; none of
  the derivations fire an independent fetch.

  The pattern is the OPPOSITE of a per-ring or per-category lazy-loading
  design (which would have one endpoint per visual block, each
  independently fetched). The trade-off the maintainer accepted:
  larger single payload + more backend work per request, in exchange
  for atomic snapshot semantics.

  vocabulary_status: codebase-anchored. The pattern is an architectural
  choice not named in the user-facing docs; the live dashboard.md
  describes the three rings without commenting on how they're served.
vocabulary_status: codebase-anchored
