proposed_action: |-
  Add `DirectoryOddrnReflectionLeakTest` extending `BaseIngestionTest` with three regression-pin methods:
  (a) `getDirectoryDatasourceList_postgres_emitsHostAndDatabase_pinsCurrentLeakSurface`: ingest a PostgreSQL datasource with `host=internal-pg.acme.corp` + `database=secret_db`; WebTestClient GET `/api/directory/datasources?prefix=postgresql`; assert the response's `properties` map contains `host: internal-pg.acme.corp` AND `database: secret_db`. Pins the current intentional leak.
  (b) `getDirectoryDatasourceList_snowflake_emitsAccountAndWarehouse_pinsBroaderLeakSurface`: ingest a Snowflake datasource; assert `properties` contains `account` AND `warehouse`. Pins the broader-than-Postgres surface.
  (c) `getDirectoryDatasourceList_anyAuthenticatedUserSeesFullInventory_pinsCrossOwnerReachability`: ingest datasources owned by Owner A and Owner B; authenticate as Owner B (no association with A's datasources); GET `/api/directory/datasources?prefix=postgresql`; assert response contains BOTH owners' datasources with full host/database properties. Pins the cross-owner reachability dimension.
  Add `// REGRESSION-PIN — DirectoryController exposes every datasource's ODDRN-derived properties (host, database, account, warehouse, cluster, topic) to any authenticated user — and any anonymous caller under auth.type=DISABLED. The reflection-based extractor walks @PathField annotations on the OddrnPath subclass with NO allow-list or redaction. If a future OddrnPath subclass adds a sensitive field (e.g. connection URI carrying credentials, internal service token), the field will silently surface in this response. A maintainer adding such a field should either (a) add an allow-list redaction step in DirectoryServiceImpl.getOddrnProperties OR (b) extend this test to assert the new field DOES appear (locking it as a deliberate publication). The existing DirectoryTest.java:141-149 pins host+database as intentional; this test extends to the rest of the @PathField surface.` comment block.
