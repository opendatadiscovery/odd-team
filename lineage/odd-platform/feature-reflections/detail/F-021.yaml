        cite: "ReactiveActivityRepositoryImpl.java:220-222 + lines 157-158/178-179/199-200/221-222"
        note: "USER_OWNER_MAPPING.DELETED_AT IS NULL filter on the actor-resolution JOIN"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: tests_coverage_semantic.uncovered_behaviours
        cite: "tests_coverage_semantic.gaps line 138"
        note: 'Sidecar explicitly notes "no test confirms this is intentional" — gap surfaced'
    operator_visible_failure: |
