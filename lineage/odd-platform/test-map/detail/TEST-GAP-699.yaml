proposed_action: |-
  Add `DataSourceIngestionServiceImplTransactionalRollbackTest.createDataSources_secondItemBulkCreateFails_rollsBackFirstItemBulkUpdate_pinsBatchAtomicity` as a Testcontainers integration test (requires real R2DBC + real Postgres for the transaction binding). (a) Seed Collector C with namespace NS. (b) Seed an existing DataSource D with `oddrn=//x`, `collector_id=C`, `name="old-x"`. (c) POST `/ingestion/datasources` with `{ items: [ { oddrn: //x, name: "new-x" }, { oddrn: //y, name: "duplicate-of-x" } ] }` where "duplicate-of-x" matches an UNRELATED active datasource's name (triggers UNIQUE constraint violation on the bulkCreate path). (d) Assert HTTP 5xx. (e) Query `SELECT name FROM data_source WHERE oddrn = //x`. (f) Assert the name is STILL "old-x" (the bulkUpdate was rolled back). (g) Query `SELECT COUNT(*) FROM data_source WHERE oddrn = //y`. Expect 0 (the bulkCreate was rolled back). (h) Add a `// REGRESSION-PIN — @ReactiveTransactional makes the batch all-or-nothing. A REFACTOR removing the annotation OR pursuing per-entity isolation would break this test — both half of the items would persist. The current contract is documented batch-atomic; the failure surface is HTTP 5xx with no per-item indication.` comment block.
