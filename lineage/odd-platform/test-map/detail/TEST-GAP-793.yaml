proposed_action: |-
  Add `SessionProviderInvalidValueSilentBootRegressionPinTest`. Two parametrised cases:
  1. Valid: each of IN_MEMORY / INTERNAL_POSTGRESQL / REDIS — assert correct bean wiring.
  2. Invalid: `IN-MEMORY` / `in_memory` / `redis` / `''` — assert (current behaviour) NO bean of type `ReactiveSessionRepository<MapSession>` is registered AND no fail-fast occurs. PINS the silent surface.

  Pair with REFACTOR-NNN: add an enum + boot-time validation `if (!ENUM.contains(value)) throw IllegalStateException("session.provider must be one of {IN_MEMORY, INTERNAL_POSTGRESQL, REDIS}, got: " + value)`.
