mitigations_unimplemented:
- 'Add Vitest tests that assert: (a) caller WITHOUT DATA_ENTITY_DESCRIPTION_UPDATE
  sees Markdown content rendered; (b) caller WITHOUT the permission does NOT see
  the Edit button; (c) the gating predicates on resource-scoped permission, not
  on owner-id directly'
- 'Surface the partial-gating as documented behaviour on
  /configuration-and-deployment/enable-security/authorization/permissions — the
  current page describes permissions as "allows editing and deleting" but does
  NOT explain that the view side has no separate permission'
- 'Consider adding a "you have read-only access" banner on entities the user
  can view but not edit — operators self-diagnosing access issues would benefit'
notes: |-
  New invariant captured in batch 2026-05-19J. The partial-gating semantic is
  the UI-layer realisation of the read-collaborative posture. The pattern is
  consistent across the platform (DataEntityDetails header, DataEntityDescription
  cluster, presumably other detail-page surfaces).

  The risk surface is REFACTOR fragility: an engineer "tidying up" the WithPermissions
  placement could easily flip the semantic from "edit gated" to "content gated",
  hiding the content from legitimate readers. The fix is a SCREAMING test that
  assertively pins the current semantic: "a non-editor sees the description text
  AND does not see the Edit button". Without that test, every refactor risks the
  semantic shift.
