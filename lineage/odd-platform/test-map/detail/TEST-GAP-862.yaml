behaviour: |-
  **HIGH — `TagServiceImpl` (lines 1-168) has ZERO service-tier authorization checks: zero `@PreAuthorize` annotations, zero `permissionService.hasPermission(...)` programmatic calls, zero `OwnerAuthorizationFacade` invocations, zero `SecurityContextHolder` reads. The controller perimeter is the SOLE auth defence for the canonical `POST /api/tags` path; the FOUR side-door write paths (TermServiceImpl, DataEntityServiceImpl, DatasetFieldServiceImpl, ExternalTagIngestionRequestProcessor) reach this service WITHOUT holding `TAG_CREATE`. The absence-of-gates IS the architectural posture; the absence has NEVER been pinned by a test. A future regression that ADDS `@PreAuthorize` to ANY method here would silently change exposure (likely BREAKING a side-door for the legitimate Collector path).**

  **Per-method auth posture** (from TagServiceImpl.md:stress_findings.D.S-D-1):

  | Method | Service @PreAuthorize? | Controller-perimeter auth | Side-door bypass? |
  |---|---|---|---|
  | `bulkCreate` (:37) | NO | `TAG_CREATE` | NO (only called by TagController) |
  | `update` (:45) | NO | `TAG_UPDATE` | NO |
  | `delete` (:57) | NO | `TAG_DELETE` | NO |
  | `listMostPopular` (:73) | NO | `authenticated()` catch-all | NO (only TagController calls) |
  | `getOrCreateTagsByName` (:80) | NO | varies per side-door | **YES — never TAG_CREATE** |
  | `getOrInjectTagByName` (:89) | NO | S2S ingestion filter | **YES — never TAG_CREATE** |
  | `updateRelationsWithDataEntity` (:97) | NO | `DATA_ENTITY_TAGS_UPDATE` | YES |
  | `deleteRelationsWithTerm` (:124) | NO | `TERM_TAGS_UPDATE` | YES |
  | `createRelationsWithTerm` (:137) | NO | `TERM_TAGS_UPDATE` | YES |

  **Why this is HIGH** (not LOW as one might expect for "absence is the architecture"):
  - **The absence is invisible to grep on the canonical perimeter**: a future maintainer auditing "where does Tag CREATE happen?" sees `TagController.createTag` gated by `TAG_CREATE` — and reasonably concludes that's the only path. The 4 side-door paths are NOT marked with `@PreAuthorize(TAG_CREATE)` because they're gated by a DIFFERENT permission (DATA_ENTITY_TAGS_UPDATE etc.). The architectural design is documented in `TagServiceImpl.md:implicit_adrs` but not in code.
  - **A future "security hardening" PR** that adds `@PreAuthorize("hasAuthority('TAG_CREATE')")` to `getOrCreateTagsByName` would silently BREAK every side-door (UI users with only DATA_ENTITY_TAGS_UPDATE would suddenly get 403 on PUT /api/dataentities/{id}/tags). This is a HIGH-impact, NON-OBVIOUS regression.
  - **The test pins the INTENT**: zero service-tier checks. Any test that ASSERTS the absence forces a future maintainer adding gates to coordinate the addition with the side-door behavior change.

  **Why this is the canary headline finding** (per TagServiceImpl.md):
  - The S-D-1 finding states: "Tag directory writes via the side-door surfaces (5 of 9 methods) bypass TAG_CREATE entirely. This is logged in implicit_adrs as intentional (the per-feature permission model) but is recorded here as the per-method enumeration that the Stress Protocol mandates."
  - The probe `P-LSN019-service-auth-zero` was emitted to "confirm zero auth gates at the service layer via grep" — this gap converts the grep probe into a CI-runnable test.
