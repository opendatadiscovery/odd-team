amplification_factor: |-
  N feature-area unmounts × M operator-visible filter chips lost per unmount.
  For the DQ Dashboard with 10 filter dimensions: every navigate-away from
  /data-quality discards up to 10 chip selections (modulo URL-search-param
  recovery). Aggregate across a multi-area session: ~30+ filter chips lost
  per typical drill-and-back workflow.
amplification_note: |-
  The amplification is in the gap between operator expectation (filters
  persist as in Redux feature slices) and reality (filters reset on
  every navigate-away). 4 feature areas multiplied by per-area filter
  count = the cross-platform drift envelope. The URL-search-param fallback
  cushions but does not eliminate (the reconstruction is partial per P-120
  open probe).
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render — the four feature areas re-render with all-empty filter
    state after every navigate-away. The previous filter selections are
    discarded; operators must re-pick. No DOM persistence; no warning
    affordance.
  evidence: |-
    DataQualityProvider.tsx:4-6 (the Provider boundary) +
    DataQualityStore.ts:11-22 (the all-empty defaults) + App.tsx:39, 73
    (the unmount boundary) + DataQualityFilters.tsx:46-54 (the partial
    URL-mediated mitigation).
  cardinality_per_call: '1 re-render per route mount; 10 filter values reset per DQ mount'
observed_vs_expected:
  facets:
    - facet_id: ui_state_management_paradigm_split_jotai_per_provider_resets_filters_on_navigate_away
      drift_class: ui_state_management_paradigm_split_jotai_per_provider_resets_filters_on_navigate_away
      severity: MEDIUM
      observed: |-
        Four feature areas wrap their roots in `<Provider>` from jotai
        (DataQualityProvider.tsx:4-6 + 3 byte-identical siblings).
        The rest of the SPA uses Redux Toolkit. Per-Provider atom state
        is destroyed on unmount → reset on next mount. Route change
        unmounts the feature root → next visit shows all-empty defaults.
      expected: |-
        Either ALL feature state lives in Redux (cross-mount persistence
        baseline), OR the per-feature jotai paradigm is explicitly
        documented with an operator-visible signal ("filters reset on
        navigate-away — bookmark the URL to preserve them").
      operator_visible_consequence: |-
        DQ Dashboard operator picks 3 namespaces + 2 owners + 1 tag →
        clicks an entity to drill in → clicks back → finds filter row
        empty. Same shape for OwnerAssociations / DEGLineage /
        DatasetStructure-compare. No UI affordance warns; no doc page
        explains. Seeded from SHB-155.
      ui_unverified: false
    - facet_id: feature_local_state_partially_serialised_to_url_search_params_partial_reconstruction
      drift_class: feature_local_state_partially_serialised_to_url_search_params_partial_reconstruction
      severity: LOW
      observed: |-
        DataQualityFilters.tsx:46-54 — useEffect writes filter state to
        URL search params on every change. The URL IS the partial
        cross-mount persistence channel. P-120 probe (DataQualityStore
        sidecar) is OPEN on whether back-navigation fully reconstructs
        all 10 filter dimensions from the URL.
      expected: |-
        Either ALL filter state round-trips through the URL (the URL
        becomes the canonical source of truth, eliminating jotai
        atom-as-state), or NONE does (cleaner failure mode but worse UX).
      operator_visible_consequence: |-
        Today: partial reconstruction (some filters survive a
        back-button, some don't) — operator-confusing because the
        recovery is non-uniform. P-120 needed to enumerate which
        dimensions survive vs reset.
      ui_unverified: true
    - facet_id: intentional_per_feature_scoping_no_operator_warning_no_doc_caveat
      drift_class: intentional_per_feature_scoping_no_operator_warning_no_doc_caveat
      severity: LOW
      observed: |-
        The jotai-Provider pattern is identical across 4 areas → the
        choice is deliberate; no PR-trail evidence shows an accidental
        adoption. But neither the in-app UI nor `docs.opendatadiscovery.org`
        documents the persistence model. The implicit-ADR is unsurfaced.
      expected: |-
        Either an implicit-ADR archaeology pass produces a documented
        ADR ("Per-feature jotai stores deliberately scoped to mount
        lifetime — operator-impacting filter-reset behaviour") and the
        live doc page covers it, OR the paradigm is unified back to Redux.
      operator_visible_consequence: |-
        Cross-link DOC-NNN candidate: dashboard / lineage / structure-diff
        doc pages should warn about filter reset. Cross-link
        implicit-ADRs reducer candidate.
      ui_unverified: false
    - facet_id: inconsistent_with_rest_of_platform_paradigm_no_implicit_adr_documented
      drift_class: inconsistent_with_rest_of_platform_paradigm_no_implicit_adr_documented
      severity: LOW
      observed: |-
        Redux-Toolkit is the platform's documented state-management
        paradigm (per imports in 200+ files); jotai is adopted in
        ~26 files across 4 feature areas. No CONTRIBUTING.md or
        ADR explains when to use which. Future contributors face an
        unsignposted choice.
      expected: |-
        A single CONTRIBUTING / ARCHITECTURE doc entry stating the
        criteria ("use jotai when the state must reset on unmount;
        use Redux otherwise") OR a unification commit.
      operator_visible_consequence: |-
        Today: contributor-facing only (developer-experience drift).
        Tomorrow: a new feature area authored with the wrong paradigm
        produces an inconsistent UX surface.
      ui_unverified: false
    - facet_id: owner_associations_slice_h_corroboration_explicit_reset_in_tab_change_handler
      drift_class: ui_state_management_paradigm_split_jotai_per_provider_resets_filters_on_navigate_away
      severity: LOW
      observed: |-
        ui-review-2026-05-26 slice H confirmed the OwnerAssociations
        instance of the paradigm: `OwnerAssociationsAtomProvider`
        (Provider.tsx:4-6 — byte-identical to DataQualityProvider)
        wraps the route at OwnerAssociations.tsx:46. The jotai
        store is `queryAtom = atom('')` in OwnerAssociationsAtoms.ts:3.
        On SUB-TAB switch (New ↔ Active ↔ History), OwnerAssociationsTabs.tsx:44-47
        EXPLICITLY calls `setQuery('')` and invalidates the rq
        cache — the reset is INTENTIONAL within the feature, not
        just a side-effect of unmount. This is a STRONGER pattern
        than the DataQuality canonical instance: even an
        in-feature tab switch resets the search input. EXTENDS the
        finding: the jotai-Provider paradigm carries both
        navigate-away resets (DataQuality-style) and
        in-feature-tab-change resets (OwnerAssociations explicit-style).
      expected: |-
        Sub-tab switches preserve the search query (operator searching
        "alice" in Pending should see Active filtered for "alice"
        immediately). Either keep the query stable in the atom AND
        re-filter on tab switch, or persist the search to URL
        search params (the DataQualityFilters mitigation).
      operator_visible_consequence: |-
        Operator typing a username to find a request loses the search
        when they switch tabs to check whether it's already approved
        or historical. They must re-type. Friction on multi-tab
        workflows like "find this user's full association history."
      ui_unverified: false
    - facet_id: owner_associations_slice_h_unverified_jotai_provider_scope_outside_tabs
      drift_class: ui_state_management_paradigm_split_jotai_per_provider_resets_filters_on_navigate_away
      severity: INFO
      observed: |-
        Slice H corroboration extends to the Provider-scope question:
        OwnerAssociationsAtomProvider in OwnerAssociations.tsx:46
        wraps the ENTIRE feature including the Tabs and the Routes.
        Sub-tab switches do NOT remount the Provider — so the atom
        identity persists across sub-tab switches. The reset
        observed is via explicit setQuery('') in
        OwnerAssociationsTabs:44-47, NOT a Provider-unmount artefact.
        This is a POSITIVE COROLLARY of the implicit-ADR: scope is
        deliberately the feature-root, not per-sub-route — the
        designers chose explicit reset over mount-driven reset.
      expected: |-
        N/A — observation only. Strengthens the implicit-ADR's
        load-bearing rationale ("per-feature jotai stores").
      operator_visible_consequence: |-
        N/A — corroborates the intentionality of the paradigm.
      ui_unverified: false
