behaviour: |-
  `.block()` inside transaction anti-pattern. `DataEntityHousekeepingJob.doHousekeeping` (lines 71-82) wraps the entire ~25-table cascade in `DSL.using(connection).transaction(ctx -> {...})`. Inside that transaction, `deleteFiles` (lines 131-143) calls REACTIVE `fileUploadService.deleteFiles(filePojos).block()` at DataEntityHousekeepingJob.java:142. The `.block()` has no explicit timeout (no `.block(Duration)`); a hung MinIO / S3 call hangs the entire housekeeping cycle until either the transport-level read-timeout fires or the 14-minute ShedLock expires. If the S3 call eventually throws, the transaction rolls back ALL ~25 deletes — the next cycle retries the entire batch. Under persistent S3 misconfiguration, data-entity housekeeping never makes progress, and the only signal is log.error at HousekeepingJobManager.java:45. Cross-references REFACTOR-145 batch D.
