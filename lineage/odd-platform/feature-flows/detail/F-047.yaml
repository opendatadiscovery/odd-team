chain:
  - hop: 1
    node: rest controller-class:DatasetFieldController
    sidecar: odd-platform__java__DatasetFieldController__controller-class__DatasetFieldController.md
    multiplicity_per_trigger: 1
    evidence: |-
      DatasetFieldController.java:35-103 — 7 endpoints, thin-proxy.
      Three PUTs (description, internal-name, tags), one POST
      (enum_values), two GETs, two term endpoints.
  - hop: 1.5
    node: auth permission extractor:DatasetFieldResourceExtractor
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      DatasetFieldResourceExtractor.java:21-27 — every authorized request
      issues a 3-table JOIN
      (dataset_field → dataset_structure → dataset_version → data_entity)
      to map dataset_field_id to parent data_entity_id BEFORE the
      controller method runs.
  - hop: 2
    node: service:DatasetFieldServiceImpl
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      DatasetFieldServiceImpl.java:117-132 — updateDatasetFieldTags
      calls deleteDatasetFieldInternalRelations(datasetFieldId) first
      (unconditional DELETE filtered by origin = INTERNAL), then re-inserts
      the full submitted set. NOT a diff.
  - hop: 2.5
    node: service:EnumValueServiceImpl
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      EnumValueServiceImpl.java:91-122 — BULK-REPLACE semantics: items
      with id != null → bulkUpdate; items with id == null → bulkCreate;
      rows whose id is NOT in idsToKeep → softDeleteExcept. Partial body
      silently deletes others.
  - hop: 3
    node: repository reactive:ReactiveTagRepositoryImpl.deleteDatasetFieldInternalRelations
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      ReactiveTagRepositoryImpl.java:289-295 — DELETE filter
      `.and(TAG_TO_DATASET_FIELD.ORIGIN.eq(TagOrigin.INTERNAL.toString()))`.
      Replace-all only touches the INTERNAL channel; EXTERNAL_STATISTICS
      rows survive.
  - hop: 3.5
    node: repository reactive:TermRelationsRepositoryImpl
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      TermRelationsRepositoryImpl.java:179 — DELETE filter
      `.and(DATASET_FIELD_TO_TERM.IS_DESCRIPTION_LINK.isFalse())`.
      Description-derived term-link rows survive the DELETE endpoint.
  - hop: 4
    node: repository reactive:ReactiveDatasetFieldRepositoryImpl
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      ReactiveDatasetFieldRepositoryImpl.java:73-80 — updateDescription
      is UPDATE dataset_field SET internal_description = ? WHERE id = ?
      with only empty-to-null normalisation. No Jsoup.clean, no
