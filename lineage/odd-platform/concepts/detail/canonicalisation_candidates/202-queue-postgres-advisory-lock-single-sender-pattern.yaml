proposed_canonical: 202+queue+Postgres-advisory-lock single-sender pattern
rationale: 'Cross-cutting concurrency convention triangulated across 2 sidecars: DataCollaborationMessageSenderJob
  (batch A, Slack outbound at advisory lock 120) + NotificationSubscriber (batch C,
  WAL consumer at advisory lock 100). Preserves Postgres-as-only-dependency posture
  while decoupling external-service latency from inbound HTTP. Worth surfacing as
  ADR-promotion candidate if future outbound integrations (webhooks beyond notifications,
  email beyond notifications, OAuth bot-event consumer) adopt the same shape — and
  as a centralised advisory-lock-id registry so collision-avoidance becomes managed
  rather than convention.'
contributing_concepts:
- decoupled 202+queue+sender (postMessageInSlack implicit_adrs[3])
- Postgres advisory lock id 120 for Slack sender (postMessageInSlack implicit_adrs[4])
- leader-elected WAL subscriber at advisory lock 100 (NotificationsProperties implicit_adrs[3])
- 'advisory-lock-id registry candidates: 90 (partition) / 100 (notifications WAL)
  / 110 (datacollaboration receive-event) / 120 (datacollaboration sender-message)'
suggested_add_to_docs: false
