  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/reactive/ReactiveCollectorRepositoryTokenStorageContractTest.java"
  name: "collectorToken_storedAsPlaintextVarchar40_noUniqueConstraint_noHashing_pinsAtRestThreatModel"
