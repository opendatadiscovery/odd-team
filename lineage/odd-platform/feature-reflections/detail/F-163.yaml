# Cross-Management one-shot token reveal pattern — product-owner reflection

## product_owner_narrative

The one-shot token reveal is the affordance an operator lives through every time
they wire a collector to ODD Platform. From the operator's seat it is one inline
string and one button per row, repeated identically on two Management tabs — the
Datasources tab and the Collectors tab. When you register a data source or a
collector, the platform mints a 40-character bearer token, and for that one moment
the row shows the full plaintext token next to a **Copy** button plus a yellow
banner: "Save token in a secure location. You will not be able to retrieve it
again." (per DataSourceItem.tsx:110-121, mirrored at CollectorItem.tsx:87-98 per
the feature-flow chain). Copy it now, because every later visit to the tab shows
the same token masked as `******` plus its real last six characters, and the only
button you get then is **Regenerate** (per DataSourceItemToken.tsx:34-53). The
product promise is a deliberate security UX: the secret is shown exactly once, and
the warning tells you so.

The operator interacts with it through three controls. **Copy** writes the
plaintext token to the OS clipboard (per DataSourceItemToken.tsx:51-53 +
CopyButton.tsx:43). **Regenerate** — visible only on the masked state and only to a
holder of DATA_SOURCE_TOKEN_REGENERATE / COLLECTOR_TOKEN_REGENERATE (per
DataSourceItemToken.tsx:36 + WithPermissions.tsx:27-29) — opens a
ConfirmationDialog that asks "Are you sure you want to regenerate token for this
datasource?" and, on confirm, dispatches the rotation thunk → PUT
/api/datasources/{id}/token (per DataSourceItemToken.tsx:29-49). The third control
is invisible: the row's own logic that decides masked-vs-plaintext, which it does
by sniffing whether `token.value.substring(0,6) === '******'` (per
DataSourceItemToken.tsx:25-27). That substring test is the SOLE discriminator —
there is no typed `isMasked` field on the wire; the UI re-implements, as a string
parse, the contract that the backend TokenMapper produces a six-asterisk prefix
(per the regenerateDataSourceToken backend sidecar's reference to
TokenMapper.java:15-18).

The working parts the operator perceives are: the one-shot reveal (plaintext once,
masked forever after), the Copy affordance, the permission-gated Regenerate, and
the destructive-rotation warning. What the operator does NOT perceive — and this is
where the product's promise and its delivery diverge — is that "Regenerate" is a
destructive, no-grace, in-place rotation: the instant the PUT commits, the old
token is irrecoverably overwritten and any running collector still presenting it
starts failing POST /ingestion/entities with 401 "Token is not correct" (per the
regenerateDataSourceToken backend sidecar bugs_limitations_corner_cases + the
IngestionDataEntitiesFilter coupling). The dialog text says nothing of this.

The feature sits at the boundary between Management (P-08, where the token is
issued and rotated) and Integrations & Ingestion (P-10, the consumer of the
token), gated by Security (P-09, the S2S Ingestion filter that validates it). The
pillar's primary user action "issue / rotate collector tokens" (per
system-mission.md P-08:225) is exactly this feature. The cross-pillar promise that
matters: a token rotated here is the credential a collector authenticates with
there — so the rotation UX must respect the operator's mental model of a running
production pipeline, and today it does not warn them.

A product owner demoing this would highlight two edge cases. First, the warning
banner is ephemeral: it shows only while the token is unmasked, and ANY list
refetch (search clear, delete completion, background refresh) re-masks the token,
re-fires the substring sniff, and the banner silently disappears — an operator
distracted mid-create can lose the only copy of a credential they never saved (per
DataSourceItem.tsx:110-121 + the warning_banner_disappears facet). Second, the
whole reveal/mask decision is a string-prefix bet against the backend mask format:
the day anyone changes TokenMapper to emit a different mask (eight stars, a unicode
bullet, a "last 4 only" redaction), both tabs silently break — Regenerate becomes
unreachable and the reveal warning never fires (per the
token_visibility_detection facet, cross-referenced to DataSourceItemToken.tsx:26).

