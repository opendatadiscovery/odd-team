control_summary: |-
  0 of 4 cells PROBED — feature MINTED this batch (V) from
  ReferenceDataController class sidecar primary-source. FOURTEEN drift
  facets anchored on three load-bearing themes: (a) NO_CONTEXT
  permission scope + cross-table jump on PATCH column + cascade orphan
  on parent delete — three architectural surfaces where the documented
  data-integrity model and the operative code diverge; (b) F-004 XSS
  family extension to reference-data row values + column names + table
  name + description — fifth surface (after entity description + term
  definition + dataset-field description + query example); (c)
  operational risk under load — DDL ACCESS EXCLUSIVE LOCK + rename
  breaks downstream + two-transactions delete.

  The HIGHEST-LEVERAGE probe candidates are:
  (a) **F-004 5th-surface XSS regression-pin** — POST /api/referencedata/table/{id}/data
      with row containing `<img src=x onerror=alert(1)>` + GET row list
      + assert verbatim storage + render the lookup-table tab + assert
      the UI render contract. The platform-wide partial-mitigation
      envelope from F-004 slice 5/6 applies (React attribute filtering +
      Chromium HTML-parser policy).
  (b) **PATCH-column-tableId-jump regression-pin** — POST table A +
      POST column on table B + PATCH
      /api/referencedata/table/{A}/column/{column_of_B} + assert
      SUCCESS (pin the bug); compare with `getLookupTableField` which
      DOES validate the parent-table linkage.
  (c) **Cascade-orphan regression-pin** — POST lookup table + DELETE
      via /api/dataentities/{id} + assert orphan rows in `lookup_tables`
      + orphan physical Postgres table in `lookup_tables_schema`.

  Local docker-compose probe stack is sufficient: ODD platform +
  Postgres + a pre-seeded LOOKUP_TABLE-permission-granted user.

  Cross-feature coherence: this feature LIVES INSIDE pillar P-03
  Master Data Management (the FIRST P-03 anchored feature in the
  registry; per system-mission.md:125-141 the pillar is intentionally
  narrow — one user-observable child surface, Lookup Tables). The
  pillar's narrowness is itself load-bearing (per the live doc page).
  Cross-link partners: F-004 (XSS family — 5th surface), F-001 / F-003
  / F-017 (Data Discovery family — lookup tables surface there as
  DATA_SETs), F-006 (no audit log on lookup_table mutations —
  audit-silence extension via LookupDataService Grep verification
  deferred), F-017 / F-024 / F-025 (search-session pattern family).
