proposed_action: |-
  Add `DataSourceIngestionServiceImplDefenseInDepthTest.createDataSources_payloadWithEmptyOddrn_throwsBadUserRequestException_pinsServiceTierDefenseInDepth`. (a) Mockito-style unit test bypassing the controller layer entirely (invoke `dataSourceIngestionService.createDataSources(collectorId, payload)` directly). (b) Mock `reactiveCollectorRepository.getDto(collectorId)` to return a valid CollectorDto. (c) POST a `DataSourceList` with one DataSource: `{ name: "test" }` — NO oddrn field set. (d) Use `StepVerifier` to expect a `BadUserRequestException` with message `"ODDRN must be filled for all data sources"`. (e) `verify(reactiveDataSourceRepository, never()).bulkCreate(any())` — confirm the validation fires BEFORE any DB write. (f) Add a `// REGRESSION-PIN — Service-tier defense-in-depth at AlertServiceImpl.java:103 is REDUNDANT with the controller's check but DELIBERATE. A REFACTOR removing this check (e.g., the maintainer "simplifying" because the controller already validates) would silently re-open the empty-ODDRN surface for any future caller bypassing the controller. The defense-in-depth pattern is the platform's posture per batch P sidecar's observation on the controller's session-attribute check at IngestionController.java:53-55.` comment block.
