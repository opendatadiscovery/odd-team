proposed_action: |-
  Add `NotificationConfigurationDownstreamDepthMissingDefaultTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/config/`. Three test methods:

  1. `alertNotificationMessageTranslator_withDepthExplicitlySet_succeeds` — `@SpringBootTest(properties = { "notifications.enabled=true", "notifications.message.downstream-entities-depth=3", ... })`; assert bean is created with depth=3.

  2. `alertNotificationMessageTranslator_withYamlDefaultAvailable_succeedsWithDepthOne_pinsYamlMasking` — `@SpringBootTest` with only `notifications.enabled=true` + receiver config; rely on application.yml:174-175 default; assert bean is created with depth=1.

  3. `alertNotificationMessageTranslator_withoutYamlAndWithoutValueDefault_failsBoot_pinsAsymmetry` — `@SpringBootTest` with custom @TestPropertySource overriding application.yml to REMOVE the depth key + setting `notifications.enabled=true`; assert `BeanCreationException` with `Could not resolve placeholder` in cause chain. PINS the current asymmetric behaviour until L123 is fixed.

  Add a `// ASYMMETRY-PIN — NotificationConfiguration.java:123 has no @Value default while L105 (platform-base-url) does. Operators overriding application.yml without supplying the depth key crash boot with cryptic placeholder error. This test pins the asymmetry until REFACTOR-NNN adds the inline default :1.` comment block.

  Pair with: (a) REFACTOR-NNN — one-line fix at L123: `@Value("${notifications.message.downstream-entities-depth:1}")`; (b) DOC-GAP-NNN — live `/configuration-and-deployment/odd-platform` should explicitly mark each `notifications.*` key as REQUIRED or OPTIONAL with the default if optional.
