behaviour: |-
  **`adminAttribute` accepts ANY claim string — no whitelist, no schema check; silent-no-op for typos.** Line 57-58: `provider.getAdminAttribute()` is used verbatim as the claim name to look up at line 59 (`token.getClaim(adminPrincipalAttribute)`). An operator with `admin-attribute: arbitrary_claim_name` reads `token.getClaim('arbitrary_claim_name')` — if the claim doesn't exist in the ID-token, the result is null, `containsIgnoreCase(adminPrincipals, null)` returns false, `isAdmin` stays false. Silent-no-op for typos: `admin-attribute: emale` (typo of 'email') → no admin is EVER assigned. The silent-no-op-on-typo is consistent with the broader OAuth2Properties pattern (REFACTOR-152 + REFACTOR-154 capture the unvalidated-string-config class). Affects every OIDC handler (Google, Cognito, Azure, ODDIAM) similarly.
