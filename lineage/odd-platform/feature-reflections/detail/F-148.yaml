      `state.isMyObjects()` owner predicate (SearchServiceImpl.java:104-108) —
      the only owner-scoping path in the whole search backbone. The doc's claim
      ("subset owned by the authenticated user") is accurate FOR THE RESULT
      LIST. Consistency with the access model: this is the visible UI counterpart
      of the read-collaborative posture (system-mission.md line 267 / F-017) —
      My Objects is OPT-IN (default tab is All = full catalog), confirming the
      platform's "every authenticated user can enumerate the catalog; My Objects
