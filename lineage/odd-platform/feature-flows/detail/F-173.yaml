notes: |-
  Minted from ui-review-2026-05-26 slice H. The disambiguation question
  (drift facet 1) is the load-bearing finding — if the backend resolves
  by ownerId-only and an admin is acting on a multi-bound owner, the
  Remove may target the wrong row OR all rows. Highest-leverage probe.

  The confirm-dialog symmetry across F-171 (Accept/Reject) + F-173
  (Remove) is a POSITIVE finding — the OwnerAssociations subtree
  consistently uses ConfirmationDialog for destructive ops. Contrast
  with F-019 batch-Q empty-roles-update UX where the destructive
  reachable path had NO confirmation.
