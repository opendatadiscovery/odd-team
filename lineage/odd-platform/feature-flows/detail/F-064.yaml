    drift_class: management_associations_active_tab_silent_empty_fresh_deploy_vs_decommissioned
    provenance: |-
      PRIMARY-SOURCE (UI) — OwnerAssociationsActive.tsx:39-42 +
      OwnerAssociationsActive.tsx:98 (EmptyContentPlaceholder usage).
