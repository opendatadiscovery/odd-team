proposed_action: |-
  Vitest + react-testing-library + mocked React-Query. Single parameterised test file `Overview.test.tsx` with 10 cases:

  | authType value | Expected OwnerAssociation visibility | Scenario class |
  |---|---|---|
  | 'DISABLED' | hidden | valid (intentional disable) |
  | 'LOGIN_FORM' | shown | valid |
  | 'OAUTH2' | shown | valid |
  | 'LDAP' | shown | valid |
  | '' (empty) | hidden | bug-shape #1 (fails-close, masks security degradation) |
  | 'OUATH2' (typo) | shown | bug-shape #2 (fails-open, no auth wired) |
  | 'disabled' (lowercase) | shown | bug-shape #3 (case-sensitive intent miss) |
  | ' DISABLED' (whitespace) | shown | bug-shape #4 (whitespace intent miss) |
  | undefined | hidden | absent shape |
  | null | hidden | absent shape |

  Each test asserts `screen.queryByTestId('owner-association')` matches the expected visibility AND captures the failure mode in a snapshot comment (Scenarios 1-4 are the surprising cases).

  After the test ships, the REFACTOR-073 fix (boot-time validator rejecting non-enum auth.type values) should be implemented; the test then ALSO becomes the pin for "the validator caught the misconfiguration at boot, so the UI never receives a bug-shaped value". The test class becomes the canonical regression-pin for the dual-layer gap.

  Coherence note (LSN-018 Rule 6): NO contradiction with existing artefacts. STRENGTHENS the batch-T AppInfoController finding by establishing the UI-tier consequence. The test gap is the natural UI-side closure of the compound gap REFACTOR-073 + Overview.tsx:25-27.
