    expected: hidden-from-search entities consistently excluded across all list-shape surfaces (9 sites apply the filter)
    drift_class: filter_application_inconsistency
    provenance: MEASURED — P-006 (run R-20260519T011813Z-P-006) seeded the entity, GET'd /api/dataentities/popular, asserted
      appears_in_popular == True. Batch-H primary-source SQL confirmation at ReactiveDataEntityRepositoryImpl.java:909-939
      (cteDataEntitySelect — no EXCLUDE_FROM_SEARCH predicate; only HOLLOW.isFalse() at line 918 and the soft-delete branch).
  - facet: EXCLUDE_FROM_SEARCH wider inconsistency surface (batch H — STATIC)
    observed: cteDataEntitySelect at lines 909-939 is consumed by 9 list-shape methods — listPopular (line 633), listByOwner
      (line 526-527), listByTerm, getDEGExperimentRuns, getDimensions(id|oddrns|ids), getDetails(id), getQuerySuggestions
      — NONE apply EXCLUDE_FROM_SEARCH. Only findByState (via JooqFTSHelper.resultFacetStateConditions line 149) and getDataEntityDefaultConditions
      (line 974 — used by countByDatasourceAndType, getDataSourceEntityTypeIds, getCountByDataSources, getDataEntityDomainsInfo,
      getDataEntityWithOwnership) DO apply it. The Popular case is one of many; my-objects, by-term, and even by-id details
      fall under the same gap.
    expected: One canonical filter helper applied across all user-facing list shapes
    drift_class: filter_application_inconsistency
    provenance: 'STATIC — primary-source verification in batch-H ReactiveDataEntityRepositoryImpl

      sidecar bugs_limitations_corner_cases[1] + invariants[2]. A Type-7 probe should

      assert the same hidden-from-search entity surfaces in GET /api/dataentities/my,

      GET /api/dataentities/{deg-id}/children (DEG-experiment-runs path), and the

      detail GET — proposed slice-N: local probe-stack with 1 hidden entity + 6 GETs.'
  - facet: service tier is a 1-line pass-through (batch I — STATIC)
    observed: 'DataEntityServiceImpl.listPopular (lines 227-231) is `reactiveDataEntityRepository.listPopular(page,

      size).map(dataEntityMapper::mapRef)` — ONE line, NO @ReactiveTransactional, NO

      caller-identity check, NO enrichment, NO owner filter. The service tier adds

      ZERO defence; the producer-side amplification (F-001''s view_count inflation)

      flows DIRECTLY into the consumer-side ranking signal at the repository CTE.

      The cross-feature loop closes at this layer.'
    expected: same — the 1-line pass-through is the design choice; fixes belong at the repository CTE (EXCLUDE_FROM_SEARCH)
      and/or the controller (rate limit)
    drift_class: null
    provenance: STATIC — primary-source verification in batch-I DataEntityServiceImpl sidecar invariants[2] (cross-owner read
      posture confirmed at service tier) + operations.listPopular (lines 227-231).
