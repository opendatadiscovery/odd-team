proposed_action: |-
  Add `DataSourceRegisterTransactionRollbackTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Two test methods:
  1. `registerDataSource_oddrnCollision_rollsBackTokenAndNamespaceInserts_noOrphanRows` — register a data source with ODDRN X (succeeds); record `SELECT COUNT(*) FROM token` and `SELECT COUNT(*) FROM namespace` as baselines; POST /api/datasources again with ODDRN X AND a never-seen `namespace_name`; assert HTTP 400 (UniqueConstraintException); assert `SELECT COUNT(*) FROM token` equals the baseline (no orphan token from the rolled-back attempt); assert `SELECT COUNT(*) FROM namespace WHERE name = <never-seen name>` returns 0 (the namespace INSERT rolled back).
  2. `registerDataSource_emptyOddrn_rollsBackTokenInsert_no400Orphan` — POST /api/datasources with `oddrn=''`; assert HTTP 400 (BadUserRequestException); assert `SELECT COUNT(*) FROM token` is unchanged (the empty-ODDRN check throws inside the transaction, so even the unconditional token INSERT rolls back).

  A regression removing `@ReactiveTransactional` from `create`, or splitting it into
  separately-committed writes, inverts both tests.
