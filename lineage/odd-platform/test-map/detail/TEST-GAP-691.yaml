  - "AlertServiceImpl.md says (tests_coverage_semantic.uncovered_behaviours.[6]): 'No test asserts the AlertManager webhook idempotency gap (F-007 facet no_idempotency_no_audit). Two POSTs of the same AlertManager payload produce two duplicate ALERT rows because handleExternalAlerts does not de-duplicate. The applyAlertActions path DOES de-duplicate via AlertActionResolver; the AlertManager path bypasses it. A test that POSTs the same payload twice and asserts row count = 1 would surface the gap.'"
  - "AlertServiceImpl.md says (implicit_adrs.[3]): 'The two ingestion paths (handleExternalAlerts for AlertManager, applyAlertActions for in-platform ingestion) deliberately diverge on de-duplication. handleExternalAlerts constructs AlertPojo directly from the webhook payload and skips the resolver (lines 174-187). The shared createAlerts helper (lines 261-300) does NOT de-duplicate at the SQL level. The CONSEQUENCE of the asymmetry is the F-007 no_idempotency_no_audit facet at the service tier.'"
  - "Source: AlertServiceImpl.java:151-191 (handleExternalAlerts body — no AlertActionResolver use, no getOpenAlertsForEntities snapshot, no de-dup logic) + AlertServiceImpl.java:202-231 (applyAlertActions — uses AlertActionResolver) + AlertServiceImpl.java:261-300 (shared createAlerts — no ON CONFLICT) + cross-reference to batch H ReactiveAlertRepositoryImpl bugs_limitations_corner_cases[2] (createAlerts issues INSERT … RETURNING with no upsert)"
