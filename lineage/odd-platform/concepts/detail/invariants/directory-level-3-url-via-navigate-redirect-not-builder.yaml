name: |-
  Directory level-3 URL `/directory/{prefix}/{dsId}/all` produced via React-Router Navigate redirect, not by the URL builder
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
description: |-
  **NEW MEDIUM-severity ARCHITECTURE INVARIANT, batch ZI (2026-05-26)** —
  the Directory feature surfaces four URL levels documented at the live
  doc page `https://docs.opendatadiscovery.org/features/data-discovery/directory`
  (WebFetched 2026-05-26 status 200):

    Level 1 — `/directory`
    Level 2 — `/directory/{type-prefix}`
    Level 3 — `/directory/{type-prefix}/{data-source-id}/all`
    Level 4 — `/directory/{type-prefix}/{data-source-id}/{type-id}`

  The URL BUILDER `directoryDataSourcePath(prefix, dsId?, typeId?)` at
  `directoryRoutes.ts:43-62` has only TWO output branches:
    - level-2 (no truthy `dsId` AND `typeId` → returns bare prefix path)
    - level-4 (BOTH truthy → returns full path via generatePath)

  There is NO branch in the builder that produces a level-3 URL
  directly. The level-3 URL `/directory/{prefix}/{dsId}/all` is reached
  via TWO mechanisms ONLY:

    (a) **React-Router Navigate-replace redirect** at
        `components/Directory/DirectoryRoutes.tsx:14-17`:

            <Route
              path=':dataSourceTypePrefix/:dataSourceId'
              element={<Navigate to='all' replace />}
            />

        When the user types `/directory/postgresql/1` in the browser
        (no `typeId` segment), React-Router matches this Route element
        and immediately transitions to `/directory/postgresql/1/all`
        with `replace` semantics (i.e. the bare `/dsId` URL does NOT
        appear in browser history). This is the path actually exercised
        when the user CLICKS A DATA-SOURCE ROW from level 2.

    (b) **Explicit `'all'` literal passed to the level-4 builder branch**
        at `components/Directory/Entities/EntitiesTabs.tsx:26`:

            link: directoryDataSourcePath(prefix, dsId, 'all')

        The builder's `typeId` argument is typed `number | 'all'`
        (`directoryRoutes.ts:47`), so the literal IS a first-class
        accepted argument shape. The result is the same level-3 URL
        produced via the level-4 branch.

  **The decision encoded here is architectural**: the builder represents
  ONLY "addressable, user-reachable states" (i.e. URLs an app component
  WANTS to build). The level-3 URL is fundamentally a transient redirect
  target — no app code WANTS to build that URL; only the React Router
  declaration WANTS to MATCH it (so it can redirect). The
  `<Navigate to='all' replace />` element's `replace` prop is the
  explicit semantic: "this URL should not appear in browser history;
  it's a passthrough".

  **The `'all'` LITERAL is a LOAD-BEARING MAGIC STRING shared across
  THREE files with no named constant uniting them** — captured as a
  separate invariant
  `directory-all-magic-string-load-bearing-cross-three-files`:
    - `directoryRoutes.ts:34` (hook coercion: `typeId === 'all' ? undefined : parseInt(typeId, 10)`)
    - `Directory/DirectoryRoutes.tsx:16` (Navigate target: `<Navigate to='all' replace />`)
    - `Directory/Entities/EntitiesTabs.tsx:26` (builder caller: `directoryDataSourcePath(prefix, dsId, 'all')`)

  **Consequence**: the URL builder is INCOMPLETE relative to the
  documented URL space — a developer reading `directoryRoutes.ts`
  alone learns only TWO of the FOUR addressable URL shapes. The
  level-3 URL is discoverable only by reading the inner Routes
  declaration AND the EntitiesTabs builder caller. Documentation
  recommendation: a comment in `directoryRoutes.ts:43` explaining
  the branch semantics OR exporting a `DIRECTORY_ALL_TYPES_SENTINEL =
  'all'` constant that both the hook AND the Navigate target AND the
  builder caller reference.

  **CONTRAST with the same pattern at other pillars**: the alerts
  route (`alertsRoutes.ts`) declares sub-paths as URL path segments
  (`/alerts/all`, `/alerts/my`, `/alerts/dependents`) — three discrete
  builder targets. The terms route exposes 5 named sub-paths via a
  frozen `as const` object literal. Directory diverges: the level-3
  surface is reachable but not addressable-by-build (you cannot write
  `directoryLevel3Path(prefix, dsId)` — you have to write
  `directoryDataSourcePath(prefix, dsId, 'all')` with the magic
  literal).

  vocabulary_status: codebase-anchored. The live doc page lists `all`
  verbatim as part of the level-3 URL pattern, so the doc and code
  AGREE that 'all' is the sentinel — the documentation does NOT
  explain that `all` is in-band ("means no type filter").
vocabulary_status: codebase-anchored
