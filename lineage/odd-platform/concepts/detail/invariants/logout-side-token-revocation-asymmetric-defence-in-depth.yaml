name: Logout-side token revocation (asymmetric defence-in-depth)
canonical_in_docs: false
canonical_candidate: true
description: |-
  Among the five `auth/logout/*` provider-specific success-handlers (Cognito,
  Azure, Google, GitHub, ODD_IAM), only TWO actively revoke the provider-side
  OAuth2 token at logout — `GoogleLogoutSuccessHandler.java:43-54` POSTs to
  `https://oauth2.googleapis.com/revoke`, `GithubLogoutSuccessHandler.java:51-63`
  calls `DELETE /applications/{client_id}/grant`. The OTHER THREE
  (`AzureLogoutSuccessHandler.java:31-48`, `CognitoLogoutSuccessHandler.java:33-50`,
  `ODDIAMLogoutSuccessHandler.java:30-46`) invalidate ONLY the local Spring
  WebFlux `WebSession` — they emit `exchange.getExchange().getSession().flatMap(WebSession::invalidate)`
  as their terminal Mono with NO outbound provider HTTP. Azure AD v2.0 does NOT
  expose RFC 7009 token revocation (the end-session-endpoint IS the only sign-out
  mechanism in v2.0), so the absence is a Microsoft-platform limitation as much
  as an ODD gap. Cognito's `/logout` similarly drops only the User Pool session
  cookie; the access token remains valid at Cognito-issued downstream APIs until
  natural TTL (default 1 hour for Cognito). ODD_IAM is OIDC-end-session-pattern-
  compliant. The asymmetry has a security consequence: a token exfiltrated from
  an Azure/Cognito/ODD_IAM session (XSS, browser-extension exfiltration, non-
  HttpOnly storage harvest) RETAINS authority at the provider after the user has
  "logged out" of ODD Platform until natural TTL — for Cognito (1 hour access
  token), Azure (60-90 minutes access, up to 90 days refresh), this is a real
  exposure window. Google + GitHub close this window via active revocation;
  Cognito + Azure + ODD_IAM leave it open. The docs (live OAuth2/OIDC page
  WebFetched 2026-05-19 status 200) do NOT surface this asymmetry — operators
  with stringent compliance requirements (immediate-revocation-on-logout) need
  to know.
axes_present:
  - controllers
nodes:
  - odd-platform java auth logout:AzureLogoutSuccessHandler
  - odd-platform java auth logout:CognitoLogoutSuccessHandler
contributors:
  - 'AzureLogoutSuccessHandler.invariants[2]: Session invalidation is the only platform-side cleanup — there is NO call to revoke the Azure access/refresh/id token at Microsoft Graph or the Azure token endpoint. Compare: GoogleLogoutSuccessHandler.java:43-54 calls oauth2.googleapis.com/revoke; GithubLogoutSuccessHandler.java:51-63 calls DELETE /applications/{client_id}/grant.'
  - 'AzureLogoutSuccessHandler.docs_link_semantic.doc_drift_findings[3]: NO server-side Azure token revocation on logout. The handler invalidates only the local WebSession. Tokens issued by Azure remain valid at Azure until their natural TTL expires.'
  - 'AzureLogoutSuccessHandler.security.known_security_gaps[2]: No Azure token revocation on logout — the access/refresh/id tokens remain valid at Azure until natural TTL. Compromised tokens retain authority to other Azure resources the user consented for.'
  - 'CognitoLogoutSuccessHandler.bugs_limitations_corner_cases[3]: No token-revocation step. The handler does NOT explicitly call Cognito''s token-revocation endpoint. An attacker who exfiltrated the access token before logout could continue using it against Cognito-issued downstream APIs until the token expires.'
  - 'CognitoLogoutSuccessHandler.security.known_security_gaps[0]: No token revocation. Compare with GoogleLogoutSuccessHandler.java:43-54 which DOES call /revoke. Asymmetric treatment across the 5 sibling handlers.'
  - 'CognitoLogoutSuccessHandler.implicit_adrs[3]: Local platform session is invalidated atomically with the IdP-side logout — every *LogoutSuccessHandler.handle() ends with exchange.getExchange().getSession().flatMap(WebSession::invalidate). This invariant is symmetric across all five siblings.'
