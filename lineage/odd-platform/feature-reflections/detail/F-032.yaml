- id: H-001
  hypothesis: |
    When a minimum-privilege authenticated user (no Permissions, no ownership
    associations) opens /data-quality, they see the catalog-wide aggregate
    quality of EVERY dataset — i.e. the dashboard is NOT scoped to entities the
    calling user owns or has permission to read.
  derivation: "Endpoint-shape + pillar-mission: the route is a bare <Route> (App.tsx:73) and the pillar names 'any authenticated user' as an audience; a product owner asks whether catalog-wide health is gated."
  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      Confirmed at both tiers. FRONTEND: App.tsx:73 mounts /data-quality as a
      bare <Route> with NO WithPermissionsProvider, in deliberate contrast to
      the sibling /lookup-tables route at App.tsx:75-88 which IS wrapped and
      gates on LOOKUP_TABLE_* permissions; the "Data Quality" tab is rendered
      unconditionally (ToolbarTabs.tsx:45-49). BACKEND: DataQualityRunsController
      has no @PreAuthorize; SecurityConstants.SECURITY_RULES has NO entry for
      /api/dataqatests/runs (grep-verified over lines 98-355, 2026-05-25); the
      path falls through to AuthorizationCustomizer.java:29-30
      `.pathMatchers("/**").authenticated()`; and the downstream SQL has NO
      owner/principal predicate (every JOIN is filter-derived from request
      params, lines 65-196). So any authenticated principal gets 200 with the
      full catalog-wide aggregate. This is the deliberate read-collaborative
      posture (ADR-CANDIDATE-003 / REFACTOR-024) applied to the dashboard.
      Whether this is a defect or the intended posture is a maintainer call;
      the actionable item is the doc-side silence (H-002). Probe P-090 firms
      the static verdict to PROBE-VERIFIED with a real minimum-privilege user.
    evidence:
      - sidecar: odd-platform__java__DataQualityRunsController__controller-class__DataQualityRunsController.md
        section: implicit_adrs[1] + auth_gates
        cite: "DataQualityRunsController.java:13-34 + SecurityConstants.java:98-355 + AuthorizationCustomizer.java:29-30 + ReactiveDataQualityRunsRepositoryImpl.java:65-196"
        note: "no @PreAuthorize, no SecurityRule entry, fallthrough to .authenticated(), no owner predicate in SQL"
