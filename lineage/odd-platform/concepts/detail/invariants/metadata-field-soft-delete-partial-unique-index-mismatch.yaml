mitigations_unimplemented:
- |-
  V0_0_NNN migration mirroring V0_0_64's Tag fix for the metadata_field
  partial unique indexes:
    DROP INDEX ix_unique_internal_name;
    CREATE UNIQUE INDEX ix_unique_internal_name ON metadata_field(name)
      WHERE origin = 'INTERNAL' AND deleted_at IS NULL;
    DROP INDEX ix_unique_external_name_type;
    CREATE UNIQUE INDEX ix_unique_external_name_type ON metadata_field(type,
      name) WHERE origin <> 'INTERNAL' AND deleted_at IS NULL;
  CAUTION: this requires updating the `.where(ORIGIN.ne(INTERNAL))`
  clause in `ReactiveMetadataFieldRepositoryImpl.ingestData` at
  line 101 to ALSO include `.and(DELETED_AT.isNull())` — Postgres's
  ON CONFLICT arbitrator predicate must match the partial index
  predicate EXACTLY.
- |-
  V0_0_NNN migration scoping the collector.name uniqueness as partial:
    ALTER TABLE collector DROP CONSTRAINT collector_name_key;
    CREATE UNIQUE INDEX collector_name_unique ON collector(name)
      WHERE deleted_at IS NULL;
  Aligns collector with role/policy/owner partial-unique pattern.
- |-
  Document the partial-unique-index-includes-deleted-at convention in
  an internal architecture note. Any future repository / table that
  follows the platform's soft-delete pattern (`deleted_at TIMESTAMP`)
  MUST include `WHERE deleted_at IS NULL` on EVERY unique index on
  human-meaningful columns (name, oddrn, etc).
- |-
  Add the regression test from the test-coverage proposal:
    Soft-delete a metadata field with `(name='foo', type='STRING',
    origin='INTERNAL')`; attempt `bulkCreate({name='foo', type='STRING',
    origin='INTERNAL'})`; under the CURRENT (buggy) behaviour expect
    UniqueConstraintException; under the proposed fix expect the new
    row to be created successfully.
notes: |-
  This invariant captures a CROSS-TABLE bug class where V0_0_64's
  convergence on the `deleted_at` + partial-unique-index pattern was
  applied INCONSISTENTLY across the codebase. Tag, Role, Policy,
  Owner, Namespace got the full treatment; metadata_field and
  collector did NOT. The fix per-table is straightforward; the
  systematic-cleanup is a one-migration sweep over the schema.

  **Why the migration is HIGH PRIORITY despite individual MEDIUM
  severity**: the bug class is INVISIBLE to operators and to the
  developer test suite, and the surface manifestation
  (UniqueConstraintException with no clear cause) erodes platform
  trust in subtle ways. An operator who soft-deletes a metadata
  field and tries to recreate it via the UI sees an opaque error;
  their natural response is to assume the platform is broken or
  to file a misleading bug report.

  Cross-cutting connections:
    - Pairs with the tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race
      invariant — the TOCTOU race surface is structurally identical
      across Tag and metadata_field; the partial-index-update miss
      compounds with the TOCTOU race in the metadata_field case
      (a TOCTOU loser hits the partial-index collision AND the
      stale-soft-deleted-row collision)
    - Pairs with the three-soft-delete-mechanisms-across-the-repository-layer
      invariant — V0_0_64 was the convergence migration; this concept
      captures the INCOMPLETE-convergence cases (metadata_field +
      collector did not get the full treatment)
    - Pairs with the V0_0_64 convergence on `deleted_at` invariant
      (the schema-history narrative — V0_0_1 introduced
      is_deleted bool; V0_0_31 added deleted_at TIMESTAMP parallel;
      V0_0_64 dropped is_deleted and converged on deleted_at IS NULL;
      this concept captures what V0_0_64 LEFT OUT)
    - Cross-references the REFACTOR-223 work item (Tag side-door
      class) — the auto-create surface is wide-open per the
      spec-documented design intent; the partial-index-update miss
      adds another corner case

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the soft-delete-aware-recreation invariant per-feature
        (the Tag, Role, Policy, Owner live pages all should say
        "you can recreate an entity with a previously-used name after
        soft-delete")
    (b) **Cross-cutting**: document the EXCEPTIONS (metadata_field +
        collector) on the feature pages where the lockout matters
    (c) Add the partial-unique-index-includes-deleted-at convention
        to the internal architecture page documenting persistence
        conventions
