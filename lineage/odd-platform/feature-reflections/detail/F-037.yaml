      across every data source, including hidden and cross-tenant rows. Under auth.type=DISABLED any
      caller reaching the port sees them unauthenticated. This is asymmetric to /api/dataentities,
      which DOES apply EXCLUDE_FROM_SEARCH (controller sidecar security.known_security_gaps). The
      platform-wide intent is read-collaborative (relationships are public catalog metadata, per
      implicit_adrs), but that posture is undocumented for this surface.
