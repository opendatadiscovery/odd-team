- id: H-012
  hypothesis: "Only the rightful caller can read their personalised dependents — the endpoint requires authentication and there is no parameter (owner-id, user-id) by which one caller could request another user's My-Objects neighbourhood."
  derivation: "Endpoint-shape seed (the method signature accepts only page/size/exchange — no principal parameter) + pillar P-09 auth posture; the auth-gate question (Stress Category D analogue)."
  seed_source: endpoint-shape + pillar
  validation:
    verdict: partial
    actual_behavior: |
      The endpoint signature genuinely accepts no owner/user parameter (DataEntityController.java:291-305) — the
      principal is read from reactor Context, so a caller CANNOT request another user's neighbourhood by passing
      an id (this half of the promise is confirmed). BUT there is no @PreAuthorize, no SECURITY_RULES entry; the
      path falls through to pathMatchers("/**").authenticated() (getMyObjectsWithUpstream invariants[6] +
      security.authorization_assertions). Under auth.type=DISABLED no SecurityContext is populated, so an
      anonymous caller reaches the endpoint and (because the anchor resolves empty) receives 200 + [] — NOT a
      cross-owner leak today, but the protection is the empty-propagation accident (AuthIdentityProvider
      security.known_security_gaps), not an authorization gate. So "only the rightful caller can read their
      dependents" is true under the three real auth modes via authentication + per-caller anchor, and is
      vacuously safe-but-ungated under DISABLED — partial because the safety rests on empty-propagation, not on
      an explicit gate, and a fallback-owner regression (H-006) would convert DISABLED from safe-empty to
      cross-owner leak.
