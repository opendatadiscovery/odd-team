mitigations_unimplemented:
  - |-
    Schema migration: add owner_id FK column (nullable; backfill with NULL
    for legacy rows; new rows get the creator owner-id captured from
    fetchAssociatedOwner at search-creation time).
  - |-
    Service-layer enforcement: ReactiveSearchFacetRepositoryImpl.get(id)
    becomes get(id, ownerId); update similarly; rows with owner_id=NULL
    are readable by anyone (legacy), rows with owner_id set are gated by
    matching the caller's owner.
  - |-
    UI surface: a session-shared toggle that explicitly opts-in to sharing
    the UUID (and then sets owner_id to NULL on the row); operators who
    want to share a search URL with a colleague explicitly de-scope it.
  - |-
    Doc: extend /features/data-discovery/search with a "Session lifecycle"
    section explaining that search URLs are bearer-tokens for the saved
    session state — operators should not paste search URLs into bug
    reports or screenshots without understanding the disclosure.
  - |-
    TTL eviction: the V0_0_1__init.sql:207 "TODO: find a way to define TTL"
    is the OTHER half of the same finding; an unbounded-growth pool of
    bearer-token-shaped session state is itself a privacy concern; the
    Housekeeping job F-010 NOW addresses TTL (default 30 days) — the
    owner-binding gap remains.
notes: |-
  STRENGTHENED batch ZE (2026-05-25) — SearchController class-level
  confirmation. The class is the load-bearing controller-tier surface
  for the bearer-token semantic; the schema + service + repository
  evidence is now end-to-end pinned across batches E + M + ZE.

  This invariant is a STRENGTHENING of the batch-E search-session finding
  (search-session entity, weakness.[3]: "Search-session UUID has no
  per-user owner-binding LOW under read-collaborative posture"). Batch M
  upgraded the severity FROM LOW TO HIGH because:
    (a) The facet drill-down endpoints (getSearchFacetList +
        getFiltersForFacet) inherit the same posture — the catalog
        cardinality enumeration via facets compounds the bearer-token
        risk;
    (b) The schema-level evidence is explicit (V0_0_1__init.sql:204-211
        with TODOs that DO NOT mention ownership);
    (c) The cross-batch confirmation across batch E + batch M shows the
        decision is structurally consistent (not an oversight at one
        endpoint).
  Batch ZE adds: (d) the class-level controller sidecar pins the seven-
  endpoint surface — every endpoint inherits the bearer-token semantic;
  the highlight endpoint additionally has the .formatted SQL-injection
  vector compounding the threat.

  Cross-references:
    - Search Session — the entity vocabulary; this invariant is the
      structural cause of the entity bearer-token semantics.
    - Search Catalog (faceted, session-as-server-state) — the operation
      that creates the bearer-token row.
    - tsquery operator-injection via persisted state — the
      poison-pill class that ALSO sits in the same unscoped row.
    - get-highlighted-result-formatted-sql-injection — the TRUE
      SQL-injection vector compounding the bearer-token reach.
    - Read-collaborative cross-owner enumeration — the broader posture
      that this is a sub-case of (search-session state is itself
      cross-readable across all authenticated users).
