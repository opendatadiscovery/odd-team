proposed_action: |-
  Add `infinite_scroll_dispatches_next_page_only_when_hasNext_true` to PolicyList.test.tsx. Mount with `pageInfo: {total: 250, page: 1, hasNext: true}`; trigger the InfiniteScroll's `next` callback; assert one `fetchPolicyList({page: 2, size: 100, query: ''})` dispatch. Mount with `hasNext: false`; trigger `next`; assert ZERO dispatches. Pair with `non_admin_single_page_termination` which mounts the same component pre-seeded as if non-ADMIN had been served `hasNext: false` after page 1, simulates scroll, asserts no page-2 request.
