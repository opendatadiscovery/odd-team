expected_outcome: |
  Stress question (Category D — auth gate; Category F — dataEntityId promise):
  the four DataSetController GETs declare a dataEntityId path parameter but
  the service-layer / repository never re-checks that the version_id /
  first_version_id / second_version_id requested actually belong to that
  dataset. Concretely, ReactiveDatasetVersionRepositoryImpl.getDatasetVersion
  is keyed on DATASET_VERSION.ID only (line 129) — the dataEntityId path
  parameter is consumed by the controller and forwarded to the service, then
  dropped at the repository layer.

  Two operator-observable consequences this probe verifies:
    (a) any authenticated user can request /api/datasets/{X}/structure/{V}
        with any version_id V that belongs to a different dataset Y, and the
        response is 200 with dataset Y's structure (a small data-exposure
        leak; the path looks scoped, the response is not);
    (b) /api/datasets/{X}/structure/diff?first_version_id=V1&second_version_id=V2
        where V1 belongs to dataset X and V2 belongs to dataset Z computes a
        cross-dataset diff (the service throws "Query returned N rows for diff
        request" only when one of the version ids does NOT exist at all; two
        existing ids from different datasets are returned and diffed).

  Hypothesis: both (a) and (b) succeed. The dataEntityId path param is
  documentation, not enforcement.
