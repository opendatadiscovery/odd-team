name: Read-collaborative cross-owner enumeration
canonical_in_docs: false
canonical_candidate: true
description: '**STRENGTHENED INVARIANT, batch 2026-05-13G — 5-sidecar; ADR-CANDIDATE-003
  RESOLVED as DELIBERATE; batch 2026-05-19H — 8-sidecar with two repository-layer
  SQL primary-source confirmations; batch 2026-05-19I — 11-SIDECAR with FOUR service-layer
  service-tier confirmations** — Repository-wide read-side posture: GET / read-shaped
  endpoints fall through to `pathMatchers(''/**'').authenticated()` and return data
  across owners with no owner predicate. **ELEVEN corroborating surfaces** all share
  the same admin-path-without-admin-gate failure mode: (a) `getAllAlerts` (batch A
  — `GET /api/alerts` returns alerts across all data entities regardless of caller''s
  Owner; getAllAlerts.md:security.known_security_gaps.[0] HIGH); (b) `getActivity`
  (batch B — `GET /api/activity` returns global audit trail to any authenticated user,
  including old/new diffs of descriptions / business names / ownership / custom metadata;
  getActivity.md:security.known_security_gaps.[0] HIGH); (c) `search` (batch E — `POST
  /api/search` + `GET /api/search/{search_id}/results` paginates the entire catalog:
  every non-EXCLUDE_FROM_SEARCH Data Entity row including name / ODDRN / descriptions
  / ownership / tags / custom metadata / term linkages; search.md:security.known_security_gaps.[0]
  HIGH); (d) `getDataEntityDownstreamLineage` (batch F — `GET /api/dataentities/{id}/lineage/downstream`
  returns the FULL reachable lineage subgraph including entities owned by other teams;
  lineage edges leak causal connections; getDataEntityDownstreamLineage.md:security.known_security_gaps.[0]
  HIGH); (e) **`getDataEntityDetails` (batch F — THE CENTERPIECE READ)** — `GET /api/dataentities/{id}`
  returns the FULL 34-field DataEntityDetails payload (ownership[], descriptions,
  tags, terms, metadataFieldValues[], linkedUrlList[], etc.) for ANY entity to ANY
  authenticated user; the platform''s single hottest endpoint and the WIDEST single
  blast radius (getDataEntityDetails.md:security.known_security_gaps.[0] HIGH); **(f)
  `ReactiveAlertRepositoryImpl.listAllWithStatusOpen` (batch H — SQL PRIMARY-SOURCE
  CONFIRMATION of REFACTOR-024)** — the canonical SQL is `selectFrom(ALERT).where(ALERT.STATUS.eq(OPEN))`
  at lines 143-145 with NO owner predicate, NO permission filter, NO role check; outer
  pagination wrapper adds DATA_ENTITY + USER_OWNER_MAPPING + OWNER + ALERT_CHUNK joins
  but no owner clause; **(g) `ReactiveLineageRepositoryImpl.getLineageRelations(Set,
  LineageDepth, LineageStreamKind)` (batch H — SQL PRIMARY-SOURCE CONFIRMATION of
  REFACTOR-203)** — the recursive-CTE walks `lineage` table edges with `WHERE IS_DELETED.isFalse()`
  only; lineage table has NO owner column (V0_0_2 + V0_0_17 + V0_0_79 confirm); the
  CTE is the graph-shaped cross-owner enumeration SINK at the SQL layer; **(h) `ReactiveDataEntityRepositoryImpl`
  (batch H)** — every method signature lacks principal/owner parameter; list-shape
  methods return rows with no per-tenant filter; the repository is the authoritative
  read source for cross-owner data entity enumeration; **(i) `DataEntityServiceImpl`
  (batch I — SERVICE-LAYER CONFIRMATION)** — 10 of 22 public methods (getDetails,
  getDimensions overloads, getDataEntitiesByDatasourceAndType, listByTerm, listPopular,
  getDataEntityGroupsChildren, getDomainsInfo, getDataEntityUsageInfo) apply NO
  caller-identity filter. ONE counter-example (listAssociated, line 212-225) proves
  the project knows how to scope by owner; the omission elsewhere is the structural
  shape. The orchestration tier doesn''t add the filter that the repository tier
  doesn''t enforce; **(j) `AlertServiceImpl` (batch I — SERVICE-LAYER CONFIRMATION)**
  — `listAll` (lines 77-80) is a three-line pass-through to `alertRepository.listAllWithStatusOpen`,
  no owner filter; `getTotals` (lines 90-109) has `total` platform-wide (BYPASSES);
  `getDataEntityAlerts` (lines 138-149) is owner-unaware (only checks entity existence);
  the service is the missing-defence layer between controller and repository;
  **(k) `LineageServiceImpl` (batch I — SERVICE-LAYER CONFIRMATION)** — `getLineage`
  (lines 87-122) AND `getDataEntityGroupLineage` (lines 59-85) have no `AuthIdentityProvider`
  field (verified by direct read of LineageServiceImpl.java:19, 54-57), no `fetchAssociatedOwner()`
  call. This is the NEGATIVE-CASE SIBLING of the anchor-set defence-in-depth pattern
  — `DataEntityRelationsServiceImpl.getDependentDataEntityOddrns` DOES apply the
  anchor; LineageServiceImpl does NOT. Each surface independently authored, none
  gated by a Permission, all fall through to authenticated() + no owner predicate.
  **Live docs do not warn about this posture on any of the five HTTP surfaces**:
  `/features/alerts`, `/features/active-platform-features/activity-feed`, `/features/data-discovery/search`,
  `/features/data-lineage`, and `/features/data-discovery` are all silent on WHO
  can see what. The pattern is the platform''s deliberate stance (ADR-CANDIDATE-003
  — read-collaborative tradeoff: ODD''s catalog is intentionally cross-owner-readable
  to facilitate cross-team collaboration). **Batch F RESOLVED the ADR-CANDIDATE-003
  borderline_flag**; batch H adds the SQL primary-source confirmation that the persistence
  layer ALSO embodies the posture; **batch I adds the SERVICE primary-source confirmation
  that the orchestration tier doesn''t add the filter either**. The catalog now
  has end-to-end (HTTP → service → SQL) uniform confirmation that the read-collaborative
  posture is the platform''s INTENTIONAL design choice. The fix for each surface
  is a one-line WHERE clause at the SQL layer + the corresponding service-layer
  anchor-set principal resolution; today neither half exists at any of the 11
  surfaces.'
