proposed_canonical: Housekeeping TTL retention
rationale: 'Net-new concept surfaced in batch 2026-05-12D via HousekeepingTTLProperties.
  Time-based retention subsystem covering three tables (ALERT, SEARCH_FACETS, DATA_ENTITY)
  with three TTL fields all defaulted to 30 days. Critically: does NOT cover the ACTIVITY
  or MESSAGE tables — REFACTOR-085 confirmed from primary source. Has a documented
  AlertHousekeepingJob jOOQ operator-precedence bug acknowledged by docs but un-fixed.
  Defaults shipped at application.yml level (not Java level) — overriding the YAML
  without re-supplying the housekeeping.ttl block silently binds 0 and hard-deletes
  on next cycle (LSN-001 shape). main-concepts.md does not name ''Housekeeping'' or
  ''Retention''. Live `/configuration-and-deployment/odd-platform#housekeeping` documents
  the three keys but enumerates only ''three cleanup tasks'' (omitting the two EmptyPartitions
  jobs).'
contributing_concepts:
- HousekeepingTTLProperties (typed config POJO)
- HousekeepingJobManager (@Scheduled orchestrator at 15-min fixedRate)
- HousekeepingJob interface + 5 implementations (3 TTL'd + 2 EmptyPartitions)
- AlertHousekeepingJob jOOQ-precedence bug (manual RESOLVED rows deleted regardless
  of TTL)
- 30-day uniform default across all three TTLs
- ShedLock-coordinated `housekeepingJob` lock (14m / 15m)
suggested_add_to_docs: true
