behaviour: |-
  **DELETE /api/roles/{role_id} carries FOUR untested contract surfaces:**
  (a) cascade-block-on-owner-attached: raises CascadeDeleteException
  ("Role is attached to a owner" — note the grammar quirk "a owner" preserved
  in the literal message at RoleServiceImpl.java:85-88) → HTTP 400;
  (b) predefined-name reservation (case-INSENSITIVE check on User OR
  Administrator at RoleServiceImpl.java:81-82) → HTTP 400
  BadUserRequestException("Role is predefined and cannot be deleted");
  (c) wholesale-cleanup-of-outbound-edges: line 89 HARD-deletes ALL
  role_to_policy edges BEFORE line 90 SOFT-deletes the role row itself —
  a delete that succeeds leaves NO orphan role-policy bindings but the role
  row persists with deleted_at populated, and the partial unique index
  excludes soft-deleted rows so the name can be recreated;
  (d) consistent status code: returns 204 — code matches spec at
  openapi.yaml:3676 (the lone consistent op of four). The four invariants
  interact: any one regression breaks a deployment that depended on the
  delete contract. Zero test exists.
