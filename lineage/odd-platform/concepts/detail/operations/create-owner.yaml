name: Create Owner
canonical_in_docs: true
canonical_candidate: false
description: 'POST /api/owners — gated by OWNER_CREATE NO_CONTEXT Permission via SECURITY_RULES
  (SecurityConstants.java:143). OwnerServiceImpl.create runs under `@ReactiveTransactional`:
  INSERT into `owner` + N INSERTs into `owner_to_role` (where N = `roles[]` length)
  + read-back via `ownerRepository.getDto(id)`. Returns 200 OK with `Owner`. Note:
  spec declares 201 but controller returns 200 — class-wide drift. **Identity-decoupled
  directory CRUD** — request body carries only `name` + optional `roles`; controller
  never reads security context; user→owner mapping is created only through the SEPARATE
  `POST /api/owner_association_request` flow. **NO auth-mode flow auto-creates an
  Owner on first login**. Bypassed under `auth.type=DISABLED`.'
axes_present:
- controllers
