      handler (it does not extend the base class). The `admin-groups` value binds successfully
      on the POJO at boot (no validation error, no warning log) and is then silently discarded
      at every login. The member of `workspace-admins` is granted USER, not ADMIN. Contrast:
      the identical key on a Cognito or Azure client IS consulted via the base class.
    evidence:
      - sidecar: odd-platform__java__auth__handler__GoogleUserHandler.md
        section: bugs_limitations_corner_cases[0] + known_security_gaps[0]
        cite: "GoogleUserHandler.java:1-74 (no getAdminGroups call) + ODDOAuth2Properties.java:49 (field binds)"
        note: "field binds, handler never reads it; silent no-op"
      - sidecar: "unresolved (AbstractOIDCUserHandler — source read for validation)"
        section: enrichUserWithProviderInformation
        cite: "AbstractOIDCUserHandler.java:44-55"
        note: "the admin-groups path that EXISTS for Cognito/Azure and is ABSENT for Google"
