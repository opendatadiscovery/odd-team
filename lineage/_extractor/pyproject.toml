[project]
name = "lineage-extractor"
version = "0.2.0"
description = "Cross-pillar code-lineage extractor for the ODD workspace. Tree-sitter based; produces JSONL nodes/edges, YAML manifests, and Markdown rollups per scanned repo."
requires-python = ">=3.10"
authors = [
    { name = "ODD Team" },
]
readme = "../README.md"

dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "pyyaml>=6",          # probe-runtime/runner.py uses the PyYAML API (yaml.safe_load/safe_dump/YAMLError); was undeclared → FATAL on a clean env (CTRIB-027 2026-06-22)
    "requests>=2.31",     # probe-runtime/runner.py uses requests for the live HTTP probe calls; likewise undeclared (CTRIB-027 2026-06-22)
    "rustworkx>=0.15",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The derived graph query layer's embedding half (adrs/drafts/graph-query-layer.md).
# Graph-only query works WITHOUT this extra; installing it enables hybrid
# (vector + graph) retrieval. The embedder degrades gracefully to graph-only
# when fastembed or its model is unavailable, so this stays optional.
embeddings = [
    "fastembed>=0.4",
]

[project.scripts]
lineage-extractor = "lineage_extractor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_extractor"]

[tool.uv]
package = true
