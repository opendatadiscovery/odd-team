proposed_action: |-
  Add `TagDirectoryBypassReadWriteTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `getPopularTagList_userWithNoTagPermissions_returns200WithFullDirectory_pinsOpenReadPosture` — authenticate as a user with NO `TAG_*` permissions and NO Management-scope role; GET `/api/tags`; assert HTTP 200 with full result set.
  2. `perEntityTagger_postsDataEntityTagsWithNovelNames_succeeds_pinsWriteSideDoor` — authenticate as a user with `DATA_ENTITY_TAGS_UPDATE` only (NO `TAG_CREATE`); POST `/api/dataentities/{id}/tags` with `tagNames: ['fresh-' + UUID.randomUUID()]`; assert HTTP 200 AND assert `SELECT COUNT(*) FROM tag WHERE name = ?` returns 1. PIN the side-door.
  3. `perEntityTagger_directCreateTagPostFails403_pinsControllerPerimeter` — same user; POST `/api/tags`; assert HTTP 403. PIN the perimeter-defence-WORKS-on-the-direct-path observation.
  4. `perEntityTagger_postsDataEntityTagsThenGetPopularTagList_seesOwnSideDoorWrite_pinsBidirectionalBypass` — same user; POST `/api/dataentities/{id}/tags` with `tagNames: ['compound-bypass-test']`; then GET `/api/tags?query=compound-bypass-test`; assert the tag IS in the response.
  5. `perEntityTagger_postsTermTagsWithNovelNames_succeeds_pinsTermSideDoorVertex` — same user with `TERM_TAGS_UPDATE` (no `TAG_CREATE`); PUT `/api/terms/{id}/tags` with novel names; assert success.

  Pair with REFACTOR-NNN: split `getOrCreateTagsByName` at the 4 side-door call sites; require `TAG_CREATE` for the create branch. When the fix lands, tests #2 + #4 + #5 invert to assert HTTP 403 on the side-door write paths.

  Cross-pair with DOC-NNN: surface the read+write bypass on the Tagging doc + Permissions doc — operators authoring RBAC policies need to see this to avoid the cliff.
