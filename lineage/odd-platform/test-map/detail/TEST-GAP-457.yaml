proposed_action: |-
  Unit test with @Mock SlackNotificationSender that throws NotificationSenderException on every 3rd call (simulating 429). Drive AlertNotificationMessageProcessor.process(...) 30 times in a tight loop. Assert: (a) every alert is attempted exactly once on every channel, (b) NO retry of the failing alerts (count slackMock.send invocations == 30, not 30 + retries), (c) NO batching (count == 30, not 1 batched message), (d) log.error fires for the 10 failing alerts. Locks the current contract; promotes to a fix-required regression when rate-limit/retry/batching lands.
