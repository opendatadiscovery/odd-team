proposed_action: |-
  Repository-layer regression-pin test (multi-faceted). (a) Schema inspection — query `information_schema.columns` for `token` table; assert `value` column is `character varying(40)` and IS NULLABLE per V0_0_28 (the NOT NULL is application-layer-only). (b) Constraint inspection — query `information_schema.table_constraints` for table `token`; assert NO UNIQUE constraint on `value`. (c) Round-trip — call `tokenRepository.create(newPojo)` with `value = "alice-token-1"`; query the raw row; assert `value = "alice-token-1"` byte-equal (no hashing applied). (d) Cross-collector — create TWO TOKEN rows with the SAME `value` ("collision-token"); both succeed (no UNIQUE blocks). Assert `getByToken("collision-token")` returns a CollectorPojo non-deterministically (no ORDER BY guarantees stability). (e) Add a comment block at test top: `// THREAT MODEL PIN: This test asserts the CURRENT plaintext-at-rest invariant. If a future migration adds BCrypt hashing at-rest, this test will fail and must be flipped to assert hash-storage + MessageDigest.isEqual at the compare site. The cross-layer coordination required is documented at REFACTOR-NNN.`
