proposed_action: |-
  Add `R2DBCUrlConversionEdgeCaseRegressionPinTest`. Two parametrised test cases:
  1. Standard URL: `jdbc:postgresql://localhost:5432/odd-platform` → assert converts to `r2dbc:postgresql://localhost:5432/odd-platform`.
  2. Edge URL: `jdbc:postgresql://jdbc-host.example.com:5432/jdbc_db` → assert converts to `r2dbc:postgresql://jdbc-host.example.com:5432/jdbc_db` (current code FAILS this — that's the pin).

  Pair with REFACTOR-NNN: change to `.replaceFirst("^jdbc:", "r2dbc:")`.
