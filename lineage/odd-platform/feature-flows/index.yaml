  control_summary: "0 of 4 cells PROBED — NEW pillar-anchored feature minted in batch\
    \ ZF\nfrom the convergence of two controller-class sidecars\n(DataCollaborationController\
    \ + EventApiController) plus the earlier\npostMessageInSlack method-tier sidecar.\
    \ 15 load-bearing drift facets\ncluster around SIX architectural concerns:\n\n\
    (1) **Security** — no Slack signature verification on the events\n    webhook;\
    \ no RBAC gate on any of 4 endpoints; Slack OAuth token\n    has no rotation hook;\
    \ DISABLED-mode publishes the 4-endpoint\n    surface anonymously. Combined this\
    \ is the highest-leverage\n    finding cluster.\n(2) **Open-redirect class** —\
    \ redirect trusts Slack permalink\n    verbatim; no host/scheme/structure validation.\n\
    (3) **At-least-once delivery without idempotency** — schema lacks\n    unique\
    \ constraint on (provider, event_id); duplicate Slack\n    deliveries materialise\
    \ N child message rows.\n(4) **Silent-200 conflations** — non-UUIDv1 message_id\
    \ returns 200\n    not 404; malformed JSON returns undefined status; unchecked\n\
    \    cast throws ClassCastException; unknown event types silently\n    filtered\
    \ without operator-visible signal.\n(5) **UX defects on autocomplete** — startsWith\
    \ not contains filter;\n    1-minute Caffeine cache + bot-must-be-invited gating.\n\
    (6) **Documentation absence** — live feature page returns 404;\n    configuration\
    \ page documents the enable procedure but is silent\n    on the security caveats.\n\
    \nThe HIGHEST-LEVERAGE probe candidates (deferred):\n\n(a) **Signature verification\
    \ probe** — local docker-compose\n    Discussions stack + curl-forged POST to\
    \ /api/slack/events with\n    empty/missing X-Slack-Signature + assert the endpoint\
    \ accepts\n    it; pins the current behaviour as a regression-pin AND becomes\n\
    \    the assertion-flip target after the fix.\n\n(b) **DISABLED-mode anonymous\
    \ reach probe** — local docker-compose\n    with `auth.type=DISABLED` + `datacollaboration.enabled=true`\
    \ +\n    anonymous POSTs to all 4 endpoints + assert 200/202/302/200\n    responses;\
    \ pins the bypass behaviour.\n\n(c) **Duplicate delivery regression-pin** — local\
    \ docker-compose +\n    curl two identical Slack events with the same event_id\
    \ + count\n    message_provider_event rows in Postgres + assert exactly 2 are\n\
    \    inserted (pinning the current bug) + after the unique-constraint\n    fix\
    \ the assertion flips to exactly 1.\n\nLocal docker-compose probe stack: ODD platform\
    \ + Postgres +\nMockServer for Slack API + a seeded `messages` row in PENDING_SENT\n\
    state for the redirect happy-path test. No external Slack workspace\nrequired\
    \ (all probes mock the SDK at the SlackAPIClient interface).\n\nCross-feature\
    \ coherence: STRENGTHENS F-009 (WAL-driven outbound\nalert fan-out) which is the\
    \ SIBLING outbound-to-Slack feature on\nthe same pillar (P-07:F-002 vs P-07:F-006);\
    \ the two features share\nthe Slack SDK dependency but have entirely different\
    \ authentication\nmodels (Slack webhook URL vs Slack OAuth bot token) and entirely\n\
