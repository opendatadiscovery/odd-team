mitigations_unimplemented:
- |-
  Fix the SecurityConstants entry — change the permission from
  `DATASET_FIELD_ADD_TERM` to the intended ALERT-domain permission
  (likely `DATA_ENTITY_ALERT_RESOLVE` or `DATA_ENTITY_STATUS_UPDATE`
  — pending operator-side decision on which permission was intended).
  Verify the choice by reading the AlertController sidecar and the
  permissions doc page; pick the one that names "alert resolution"
  or "alert status change" semantics.
- |-
  Add a build-time scanner that asserts every SecurityRule's permission
  has a name-prefix matching the URL path's resource (e.g.
  `/api/alerts/*` paths should only be gated by permissions starting
  with `ALERT_` or `DATA_ENTITY_ALERT_`). This would have caught both
  this bug AND REFACTOR-217.
- |-
  Add a regression test:
    (a) Authenticate as a user with `DATASET_FIELD_ADD_TERM` but NOT
        any alert-domain permission;
    (b) Call PUT /api/alerts/{alert_id}/status;
    (c) Assert the response is 403 (under the fix) OR 200 (under the
        current bug — pins the current behaviour explicitly so the next
        maintainer cannot silently flip the contract).
- |-
  Audit all Policies shipped with ODD Platform's default RBAC
  configuration and any Policies in operator deployments — identify
  which Policies grant `DATASET_FIELD_ADD_TERM` and warn operators
  that those Policies accidentally grant alert-status mutation
  capability until the fix lands.
- |-
  Document the failure mode on the live alerting and permissions doc
  pages until the fix lands — operators choosing Policies should know
  the two-way bypass exists.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-19K. Surfaced
  during the Term path-mismatch audit; the maintainer reading
  SecurityConstants.java for REFACTOR-217 noticed the alerts-status PUT
  entry has a Term permission. The two bugs are independent — REFACTOR-217
  is a path-text mismatch, this is a permission-name mismatch — but both
  live in SecurityConstants and both went undetected for an unknown
  duration. Two such bugs in the same authorization-wiring file
  strongly suggest a third or more await discovery; a build-time
  scanner would close the class of failures.

  Cross-cutting connections:
    - Companion of the "Authorization path-mismatch — SECURITY_RULES
      /term vs OpenAPI /terms" invariant (REFACTOR-217) — same file,
      different bug class
    - Cross-references the AlertController.changeAlertStatus operation
      — that operation's true gate is this wrong permission today
    - Companion of the "TermServiceImpl service-tier zero permission
      checks" invariant — both surface the platform's
      controller-only-authorization posture's failure modes

  Four DOC-NNN candidates flow from this invariant:
    (a) Code fix — change the permission to the intended ALERT-domain
        permission
    (b) Build-time scanner — assert permission/path-prefix consistency
    (c) Docs warning — operators choosing Policies should know
    (d) Default Policy audit — identify which shipped Policies are
        bug-impacted; revise them if any
