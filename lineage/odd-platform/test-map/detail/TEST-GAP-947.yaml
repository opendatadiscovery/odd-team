proposed_action: |-
  Author SearchControllerPaginationContractTest as a @SpringBootTest +
  WebTestClient harness covering three pages of the same search session:
  (a) middle page (assert hasNext=true, items.length == size);
  (b) last page (assert hasNext=false, items.length == total % size or
  size if cleanly divisible);
  (c) over-range page (page > total/size + 1; assert hasNext=false,
  items=[]).
  The test is RED today on (b) and (c). Pair with a fix at
  DataEntityServiceImpl.java:192 changing `true` → `(page * size) < total`.
  Also update the UI's `fetchDataEntitySearchResults` thunk to trust the
  backend hasNext (removing the client-side override) ONLY after the
  backend fix lands.
