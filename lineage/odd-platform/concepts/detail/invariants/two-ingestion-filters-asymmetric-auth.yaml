notes: |-
  STRENGTHENED batch 2026-05-20-Z — the 4-endpoint observation is now
  a 7-endpoint observation. The four NO-FILTER endpoints (AlertManager
  webhook + DQ stats + metrics + DEG-by-OddrnRead) form the
  AUTH-MODE-ORTHOGONAL facet of REFACTOR-185 — each requires a
  separate code-side or network-side mitigation; none can be closed
  by operator configuration alone.

  Pairs with:
    - `entity-oddrn-trust-from-alertmanager-webhook` invariant — the
      third NO-FILTER endpoint
    - `collector-identity-via-websession-attribute-not-principal`
      invariant — explains WHY the IngestionDataSourceFilter must be
      unconditional (it sets the WebSession state the controller depends
      on)
    - `upsert-by-oddrn-partial-merge-collector-driven-only-name-description`
      invariant — the merge semantics that the always-on filter enables
    - **BATCH Z NEW**: `s2s-read-side-unauthenticated-deg-membership-enumeration`
      (the fourth NO-FILTER endpoint — S2S READ)
    - **BATCH Z NEW**: `cross-dataset-stats-write-no-parent-child-consistency-check`
      (the fifth NO-FILTER endpoint exploit — DQ stats write)
    - **BATCH Z NEW**: `tenant-isolation-nonexistent-on-default-backend-internal-postgres`
      (the sixth NO-FILTER endpoint exploit — metrics write)
    - **BATCH Z NEW**: `tag-creation-as-side-effect-bypasses-tag-create-permission`
      (composition partner; same DQ stats endpoint surfaces both gaps)
    - **BATCH Z NEW**: REFACTOR-185 27-sidecar extension (the
      AUTH-MODE-ORTHOGONAL facet anchor)

  Doc-side recommended action: extend
  `/configuration-and-deployment/enable-security/authentication/s2s`
  with an explicit "scope of ingestion-filter properties" subsection:
  enumerate the SEVEN ingestion endpoints and the FOUR different
  auth postures. CORRECT the existing wording about UI-auth fallback
  (the namespace is whitelisted; UI auth does NOT apply).
