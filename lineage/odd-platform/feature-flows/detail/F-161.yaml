feature_id: F-161
pillar_id: P-08
pillar_anchored_id: P-08:F-017
pillar_anchored_feature_name: Management Section Top-Level Chrome
feature_name: |-
  Management section top-level chrome — Management.tsx composes a fixed
  3/9 sidebar layout (ManagementTabs) + content pane (ManagementRoutes)
  wrapped in a single outer WithPermissionsProvider seeded with
  OWNER_ASSOCIATION_MANAGE. The chrome itself has TWO observable
  behaviours distinct from per-tab features and from F-105's
  route-gating drift: (1) the outer permission-provider seed publishes
  OWNER_ASSOCIATION_MANAGE as the default permission CONTEXT for any
  descendant that does NOT have its own per-route WithPermissionsProvider
  override (most notably the Integrations sub-area, which mounts via
  ManagementRoutes.tsx:150 with NO sub-route provider — its inner
  usePermissions().hasAccessTo() calls resolve against the
  OWNER_ASSOCIATION_MANAGE context); (2) ManagementTabs.tsx hides ONLY
  the Associations tab from non-admin users (hideAssociations
  derivation at ManagementTabs.tsx:14-17) — every other tab name
  (Namespaces, Datasources, Integrations, Collectors, Owners, Tags,
  Roles, Policies) is rendered to every authenticated user regardless
  of any permission, leaking the EXISTENCE of the eight admin surfaces
  to every reader.
seeded_from: ui-review-2026-05-26
seeded_at: '2026-05-26'
