proposed_action: |-
  Add `AlertManagerWebhookRateAndAuditTest`. (a) POST 1000 well-formed AlertManager payloads in rapid succession (no auth); assert all return 204; assert alert table has 1000 rows; pin the current unbounded-write behaviour; (b) grep through application logs for any `audit` or `correlation-id` entry tied to one of the POSTs; assert NONE present; pin the audit-silence behaviour; (c) POST a payload with batch cardinality 10000 alerts; assert it succeeds (no per-batch cap) — pin the no-cap behaviour. Future fixes (rate limiter / @Timed counter / per-call log entry / batch cap) will break these tests deliberately.
