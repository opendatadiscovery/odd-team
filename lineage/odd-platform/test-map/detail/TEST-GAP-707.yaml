behaviour: |-
  **DIRECTORY LEVEL 4 PAGE-VS-COUNT PREDICATE DIVERGENCE — UI renders "X of Y entities" where X > Y is possible.** DirectoryController.getDatasourceEntities (line 37-44) delegates to DataEntityServiceImpl.getDataEntitiesByDatasourceAndType (DataEntityServiceImpl.java:164-179) which composes the page query via `reactiveDataEntityRepository.listByDatasourceAndType(datasourceId, typeId, page, size)` (line 170) with the count query via `reactiveDataEntityRepository.countByDatasourceAndType(datasourceId, typeId)` (line 173). The two queries use DIFFERENT predicate sets:
  - **PAGE path** (ReactiveDataEntityRepositoryImpl.java:595-613 + 909-939): applies `cteConditions` (only `DATA_SOURCE_ID = ?` plus optional `TYPE_ID = ?`) + `addSoftDeleteFilter(...)` (deleted_at IS NULL, STATUS != DELETED) + `DATA_ENTITY.HOLLOW.isFalse()` — **missing** `EXCLUDE_FROM_SEARCH IS NULL OR = FALSE`.
  - **COUNT path** (ReactiveDataEntityRepositoryImpl.java:616-627): `getDataEntityDefaultConditions()` returns THREE conditions: `HOLLOW.isFalse()` + `STATUS != DELETED.getId()` + `EXCLUDE_FROM_SEARCH IS NULL OR = FALSE`.
  **Operator surface manifestation**: any DataEntity with `EXCLUDE_FROM_SEARCH = TRUE` (a flag platform sets on certain entities — e.g. transformer runs that should not appear in search results) will be RETURNED by the page query but NOT COUNTED by the count query. UI renders "X of Y entities" where X > Y is possible, AND a `page=2` request can return rows that "shouldn't exist" according to the count. The bug is INVISIBLE for catalogs whose per-datasource entities are all `EXCLUDE_FROM_SEARCH = FALSE` (the common case); manifests in deployments using `EXCLUDE_FROM_SEARCH` to hide intermediate entities. **Cross-cutting bug class** PREDICATE-DIVERGENCE-IN-PAGINATION-WRAPPERS: same root pattern as REFACTOR-425 (which targets `ReactiveDataSourceRepositoryImpl.listDto`'s page-vs-count). The bug class is now confirmed at TWO sites; an audit sweep across all repository `list*/count*` pairs in the codebase is the defensible follow-up. **No test catches this**: `DirectoryTest.java` (verified at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/DirectoryTest.java:30-159`) covers levels 1+2 only; no fixture injects an `EXCLUDE_FROM_SEARCH=TRUE` entity and asserts list-size vs count-total parity at level 4.
