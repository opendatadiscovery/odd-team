name: Three soft-delete mechanisms across the repository layer (STRENGTHENED batch
  R — sixth mechanism + collector FULL-UNIQUE asymmetry)
canonical_in_docs: false
canonical_candidate: true
description: |-
  **NEW INVARIANT, batch 2026-05-19H** — load-bearing architectural inconsistency
  surfaced across 4 sibling `Reactive*Repository` sidecars. ODD Platform implements
  THREE distinct soft-delete mechanisms across the persistence layer + ONE hard-delete-edge
  pattern: **(1) `deleted_at` timestamp** (the inherited default): used by `ReactivePolicyRepositoryImpl`
  + every other CRUDable platform entity (role, owner, data_source, collector, namespace,
  tag, term). The base class `ReactiveAbstractSoftDeleteCRUDRepository` writes ONLY
  `deleted_at` on delete (lines 50-59, 106-110); every read auto-scopes via `addSoftDeleteFilter`
  (lines 96-104) appending `WHERE deleted_at IS NULL`. Partial unique index `{table}_name_unique
  ON {table}(name) WHERE deleted_at IS NULL` enables soft-delete-aware-recreation
  (the same name reusable after soft-delete). **(2) `is_deleted` boolean** (lineage-specific):
  used by `ReactiveLineageRepositoryImpl` on the `lineage` table. Added in V0_0_79__data_deprecation.sql:11-12
  (`ADD COLUMN IF NOT EXISTS is_deleted BOOLEAN NOT NULL DEFAULT FALSE`); every read
  filters `LINEAGE.IS_DELETED.isFalse()` (7 sites). The lineage table has paired symmetric
  `softDeleteLineageRelations` + `restoreLineageRelations` methods for the entity
  status-change cascade (UPDATE is_deleted=true / false). Distinct from the deleted_at
  pattern; uses a different column and a different SQL predicate. **(3) STATUS state-machine
  with DELETED terminal state** (data-entity-specific): used by `ReactiveDataEntityRepositoryImpl`
  via subclass OVERRIDE — extends `ReactiveAbstractSoftDeleteCRUDRepository` but passes
  null for `deletedAtField` (line 103) and overrides `getDeleteChangedFields` + `addSoftDeleteFilter`
  to swap deleted_at semantics for `STATUS = DELETED.getId()` + `STATUS_UPDATED_AT
  = now()` + `STATUS_SWITCH_TIME = null` (lines 109-123). The parent helpers that
  touch deletedAtField would NPE on this subclass — they are not called because every
  relevant path goes through the overrides. **(4) Hard-delete (no deleted_at column)**:
  used by `ReactiveOwnershipRepositoryImpl` on the `ownership` edge table; parallel
  pattern at V0_0_76__term_relations_hard_delete.sql:8-13 dropping deleted_at from
  `term_ownership`. **STRENGTHENED batch 2026-05-19L** — TWO additional
  relationship-edge sites confirmed at primary source:
    - `data_entity_to_term` (per deleteTermFromDataEntity controller method
      batch L) — HARD DELETE via DSL.deleteFrom at
      TermRelationsRepositoryImpl.java:81-87; deleted_at column DROPPED
      in V0_0_76__term_relations_hard_delete.sql:1-6 (forward-only data
      migration also DELETES tombstoned rows). Once unlinked, no
      row-level restore — only the
      TermAssignmentActivityHandler BEFORE/AFTER JSON state persists.
    - `group_entity_relations` (per deleteDataEntityFromDataEntityGroup
      controller method batch L) — HARD DELETE on user action via
      `deleteRelationsReturning` at ReactiveGroupEntityRelationRepositoryImpl.java:57-65;
      SIBLING `softDeleteRelationsForDeletedDataEntities` at lines 92-101
      is the entity-deletion cascade ONLY (paired with
      `restoreRelationsForDataEntities` at lines 104-112). The
      SOFT-DELETE-on-cascade path is REVERSIBLE; the HARD-DELETE-on-user
      path is NOT — the asymmetry is intentional but undocumented at
      the operator surface.

  **STRENGTHENED batch 2026-05-19N** — FOUR ADDITIONAL repository
  sidecars confirm the inherited `deleted_at` mechanism on the
  remaining CRUDable platform entities:
    - **ReactiveTermRepositoryImpl** (batch N) — `term` table uses
      `deleted_at` timestamp (V0_0_35:9-16); every read filters
      `TERM.DELETED_AT IS NULL` (verified at lines 143, 156, 188, 234,
      257, 279, 367, 387, 403, 432, 451, 461, 505 — 13 distinct sites).
      Partial unique index `term_name_namespace_unique ON
      term(name, namespace_id) WHERE deleted_at IS NULL` (V0_0_35:16).
      Soft-delete enables term-name-reuse after soft-delete; consistent
      with the Policy pattern.
    - **ReactiveTagRepositoryImpl** (batch N) — `tag` table uses
      `deleted_at` timestamp; partial unique index `tag_name_unique
      ON tag(name) WHERE deleted_at IS NULL` (V0_0_64:105). The
      `is_deleted` boolean column was DROPPED in V0_0_64 — Tag is
      another example of the platform's convergence on deleted_at as
      the canonical predicate.
    - **ReactiveRoleRepositoryImpl** (batch N) — `role` table uses
      `deleted_at`; partial unique index `role_name_unique ON role(name)
      WHERE deleted_at IS NULL` (V0_0_55:42, recreated by V0_0_58 then
      V0_0_64). The `is_deleted` column was DROPPED in V0_0_64 — Role
      has the CLEANER schema vs the batch-H Policy-side (Policy retains
      `is_deleted` as dead schema; Role does NOT).
    - **ReactiveUserOwnerMappingRepositoryImpl** (batch N) —
      `user_owner_mapping` table uses `deleted_at` timestamp; TWO
      partial unique indexes from V0_0_89:
        `unique_deleted_at_per_owner ON (owner_id) WHERE deleted_at IS NULL`
        `user_owner_mapping_oidc_username_provider_deleted_key ON
        (oidc_username, provider) WHERE deleted_at IS NULL`
      DISTINCT FROM the soft-delete-aware-recreation pattern of the
      sibling tables — here the SCHEMA-side enforcement is the two
      partial unique indexes, NOT a name-unique index; the
      `at-most-one-active-row` invariant is enforced at TWO dimensions
      (owner_id AND username,provider tuple). No `DELETE FROM` anywhere
      in the codebase (verified by Grep) — the table grows monotonically
      with every binding change.

  **NEW FIFTH-MECHANISM ASYMMETRY surfaced batch N**: the
  `term_to_term` table (V0_0_91__add_term_to_term.sql:6) retains a
  `deleted_at` column despite the V0_0_76 commitment to hard-delete
  relationship-edge tables (which dropped deleted_at from 3 sibling
  link tables). The application layer NEVER filters
  `term_to_term.deleted_at` across 7 read sites — confirmed at
  primary source. Captured at the dedicated
  `term-to-term-deleted-at-schema-drift-v0_0_76-vs-v0_0_91` invariant
  (batch N).

  **STRENGTHENED batch 2026-05-20R — TWO NEW DELETION SHAPES**:

  **(6) NO-DELETION-AT-ALL with M:N-edge-based lifecycle** (NEW —
  dataset_field-specific): used by `ReactiveDatasetFieldRepositoryImpl`
  on the `dataset_field` table. NO `deleted_at`, NO `is_deleted`, NO
  `STATUS` column (verified across V0_0_1__init.sql:148-164 + every
  subsequent ALTER TABLE dataset_field migration). The inherited
  `delete(id)` / `delete(ids)` from `ReactiveAbstractCRUDRepository.java:144-155`
  issue HARD DELETE, but NO CALLER IN THE PLATFORM INVOKES THEM.
  V0_0_9__normalize_dataset_structure.sql:1-43 DROPPED
  `dataset_field.dataset_version_id` FK + column and introduced the M:N
  `dataset_structure (dataset_version_id, dataset_field_id)` join
  table. A dataset_field row is SHARED across every dataset_version
  that contains it; schema evolution creates NEW dataset_field rows
  via DatasetFieldServiceImpl's hash-diff partition at
  DatasetFieldServiceImpl.java:375-396. THERE IS NO SCHEDULED
  ORPHAN-CLEANUP JOB. Operator-curated metadata (internal-name,
  internal-description, INTERNAL-origin tags, INTERNAL enum values)
  is COPIED FORWARD from the OLD row to the NEW row when the hash
  diverges (DatasetFieldServiceImpl.java:308-322 + 324-335 + 352-373).
  The OLD row persists in the table referenced only by historical
  dataset_versions. This is DISTINCT from all 5 prior mechanisms —
  not soft-delete (no marker), not hard-delete (rows are never
  removed), not state-machine (no STATUS), not the
  hard-delete-on-relationship-edges pattern (this IS the parent
  table, not an edge). It is the **versioning-by-reference** pattern
  captured at the dedicated
  `dataset-field-versioning-by-reference-no-soft-delete-orphan-accumulation`
  invariant. The growth is unbounded with no retention.

  **(7) FULL-UNIQUE (not partial) on names — collector + metadata_field
  outliers from the V0_0_64 convergence** (NEW): batch R surfaces
  TWO instances where the V0_0_64 convergence on
  `deleted_at + partial-unique-index` was NOT applied to a name-unique
  schema. `ReactiveCollectorRepositoryImpl` batch R
  bugs_limitations_corner_cases.[4]: `collector.name UNIQUE` is a
  FULL unique constraint (V0_0_29__add_collector.sql:4), NOT scoped
  to `WHERE deleted_at IS NULL`. A soft-deleted collector's name
  CANNOT be reused without first hard-deleting the row.
  `ReactiveMetadataFieldRepositoryImpl` batch R
  bugs_limitations_corner_cases.[0]: the `metadata_field` partial
  unique indexes filter only by origin (`WHERE origin = 'INTERNAL'`
  AND `WHERE origin <> 'INTERNAL'`), NOT by deleted_at — the same
  bug class. Both are captured at the dedicated
  `metadata-field-soft-delete-partial-unique-index-mismatch`
  invariant. These instances reveal that V0_0_64 was an INCOMPLETE
  convergence — Tag, Role, Policy, Namespace, Owner got the full
  treatment; metadata_field and collector did NOT. The platform's
  persistence-layer deletion shape is now **6-mechanism × 10+-site
  primary-source confirmed**.

  Edge tables between hard-deletable entities don't need their
  own soft-delete; the activity-feed audit stream is the source of truth for historical
  state (where activity logs exist — note that DEG-membership flips do NOT emit
  `@ActivityLog`, so the HARD-DELETE-on-DEG-membership is doubly forensically silent).
  **The architectural commitment**: every operator-facing entity is soft-delete-recoverable
  (the platform's consistent UX promise); only join tables and immutable audit-like
  tables use hard delete. BUT: the implementation across the 6 mechanisms uses 5 different
  schemas (deleted_at timestamp vs is_deleted boolean vs STATUS state-machine vs
  no-mechanism-with-M:N-edge-lifecycle vs hard-delete), MULTIPLE different predicates
  (IS NULL vs isFalse vs ne(DELETED.getId()) vs nothing-needed), and 2 different
  delete mechanics (UPDATE vs physical DELETE). A maintainer reading ONE repository
  to infer the platform's convention will reach the WRONG conclusion for the others.
  A future migration adding `deleted_at` to `ownership` would silently break
  `existsByOwner` (it would count soft-deleted rows as 'exists', preventing legitimate
  owner cascade-deletes); a maintainer working in the parent class without recognising
  the DataEntity subclass override could either propagate deleted_at semantics that
  DataEntity doesn't honour, or break the STATUS override by removing a parent-class
  hook. **Highest-leverage hygiene gap discovered at batch H** — surfaced by triangulating
  the 4 repository sidecars side-by-side. **Batch L confirms the 4th mechanism
  (HARD-DELETE) at TWO MORE SITES — the relationship-edge cluster pattern is now
  multi-site primary-source confirmed**. **Batch N confirms FOUR MORE
  deleted_at sites (Term, Tag, Role, UserOwnerMapping) AND surfaces the
  FIFTH-MECHANISM ASYMMETRY (term_to_term retains deleted_at despite
  V0_0_76's hard-delete commitment) — the platform's persistence-layer
  deletion shape is now 4-mechanism × 8-site primary-source confirmed**.
  **Batch R confirms the SIXTH-mechanism (NO-DELETION-AT-ALL with
  M:N-edge lifecycle on dataset_field) AND the V0_0_64 INCOMPLETE
  convergence (collector + metadata_field outliers); the
  platform's persistence-layer deletion shape is now
  6-mechanism × 10+-site primary-source confirmed**.
