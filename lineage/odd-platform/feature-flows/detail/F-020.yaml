discovered_from_entry_point: ui_route:/management/collectors
description: |-
  The Collector Lifecycle Management feature is the operator-facing CRUD
  + token-rotation + secret-issuance surface under
  `Management → Collectors` (the `/management/collectors` SPA route).
  Five operator capabilities composed by `CollectorsList.tsx:1-128`
  + sibling `CollectorForm.tsx` (modal create/edit dialog) +
  `CollectorItem.tsx` (per-row card with edit/delete affordances) +
  `CollectorItemToken.tsx` (the token-display surface with copy-on-
  reveal + regenerate-on-mask):

  - **Register a Collector** (`POST /api/collectors`) — gated by
    `Permission.COLLECTOR_CREATE` permission. Mints a Collector row in
    the `collector` table + auto-issues a 40-character plaintext token
    via `RandomStringUtils.randomAlphanumeric(40)` and writes a row to
    the `token` table.
  - **Edit a Collector's name/description/namespace** (`PUT /api/collectors/{id}`)
    — gated by `COLLECTOR_UPDATE`. Note: the form does NOT collect a
    token field — token is server-issued, not operator-supplied.
  - **Delete a Collector** (`DELETE /api/collectors/{id}`) — gated by
    `COLLECTOR_DELETE`. Removes the collector row.
  - **Regenerate a Collector's token** (`PUT /api/collectors/{id}/token`)
    — gated by `COLLECTOR_TOKEN_REGENERATE`. Invalidates the prior
    secret IMMEDIATELY (no grace period); in-flight ingestion using
    the prior token starts 401-ing immediately. The new token is
    returned as 40-character plaintext ONCE; subsequent reads return
    `******{last6}`.
  - **List and search Collectors** (`GET /api/collectors/list`) —
    NO SecurityRule entry (read-collaborative posture per
    ADR-CANDIDATE-003 / REFACTOR-024 family); any authenticated user
    can enumerate the catalog (returning name + namespace + masked
    token).

  As of batch Q, the feature emerges from the convergence of the
  UI-tier `CollectorsList` sidecar (the operator-facing affordance
  surface for the trinity) with the previously-enriched backend
  controller sidecars (`CollectorController` at batches D/E +
  `regenerateCollectorToken` at batch D/E enrichment). The feature
  is anchored under pillar P-08 Management & Administration per the
  system-mission.md sub-feature seed: `Collectors tab (issue + rotate
  tokens; OwnerController#createOwner sidecar evidence)`.

  The user-observable reality, per the batch-Q UI sidecar audit, surfaces
  TWELVE load-bearing drift facets. The HIGH-severity headline is the
  19TH-SIDECAR REFACTOR-185 facet: under `auth.type=DISABLED`, the
  UI's `WithPermissions` wrappers HIDE the Add / Edit / Delete /
  Regenerate buttons (because `/api/identity` returns empty
  `permissions`) WHILE the BACKEND endpoints ACCEPT ANONYMOUS
  MUTATIONS regardless (per `DisabledAuthSecurityConfiguration.java:11-19`
  `.anyExchange().permitAll()` bypassing `SecurityConstants.java:127-137`).
  An attacker bypassing the UI mints new collectors + copies the
  plaintext response token + uses it to bootstrap a hostile collector
  identity via the sibling `POST /ingestion/datasources`. The compound
  attack surface under default DISABLED extends through the ENTIRE
  collector boot-of-self chain.

  Secondary load-bearing drifts: (a) token rotation has NO UI warning
  about no-grace-period semantic AND no security effect on default
  deployment (auth.ingestion.filter.enabled=false neutralises token
  validation on /ingestion/entities); (b) token-visibility detection
  via fragile substring-prefix sniff (`substring(0, 6) === '******'`)
  — a future backend mask-format change would silently break and leak
  fragments to clipboards; (c) token plaintext rendered into DOM as
  text node (no `<input type='password'>` obfuscation, no Reveal-on-
  hover, no auto-hide timer); (d) anonymous list-enumeration under
  DISABLED leaks last-6-chars of every token (the mask format
  includes them); (e) 6th UI-tier corroboration of the platform-wide
  audit-silence pattern (no analytics, no console.log, no persistent
  audit panel — the toast vanishes in ~5 seconds).

  This feature did NOT appear in earlier batches because the UI-tier
  `CollectorsList` sidecar only enriched in batch Q; the backend
  CollectorController sidecars existed but were not paired with the
  UI tier to form a coherent user-observable lifecycle feature.
  Prefers EXTENDING F-008 (which carries the credential CONSUMERS —
  the two ingestion filters) was rejected per Rule 0: F-020 is a
  distinct USER-OBSERVABLE Management capability (CRUD the producer
  ecosystem) vs F-008's S2S Ingestion surface (CONSUME credentials
  for batch metadata writes). Cross-link to F-008 records the
  credential bridge between the two pillars.
