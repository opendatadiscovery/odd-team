name: Owner-Association Gate — UI-Only, Not API
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
- P-09
- P-01
description: |-
  **NEW INVARIANT, batch 2026-05-19J**. The Popular UI surface (and the entire
  Recommended panel — My Objects, Upstream, Downstream, Popular) is conditionally
  rendered only when `identity && ownership` are both truthy
  (`OwnerAssociation.tsx:84-86`). A signed-in user with no Owner sees the
  OwnerAssociationForm instead, NOT the Recommended panel. **The API endpoint
  `GET /api/dataentities/popular` has NO owner-association requirement at the
  server** (per batch-G `getPopular` sidecar `authorization_assertions: []`).
  **The implicit decision**: "the Popular UI is a feature for owner-associated
  users (a richer-context audience); the API endpoint is open to any authenticated
  caller for third-party integrations / weekly digest dashboards." **This
  client-side gate is purely UX, NOT security** — a curl call to the endpoint
  bypasses the gate entirely (and under DISABLED auth bypasses authentication
  too). The gate is observable in code (the parent-component rendering gate vs
  the API's no-gate posture) but the WHY is INFERRED from the system-wide
  read-collaborative pattern (REFACTOR-203). The gate is consistent with the
  platform's broader UI pattern of using component-level conditional rendering
  for UX scoping while leaving API endpoints uniformly authenticated-only.
contributing_files:
- PopularStrip.md
triangulation_count: 1
cross_batch: false
severity: LOW
severity_dim: security
evidence:
- 'PopularStrip.md:concepts.invariants[rendering gate: owner-association required
  — the Popular column is reachable only via OwnerEntitiesList, which is only
  mounted by OwnerAssociation when identity && ownership; a signed-in user with
  no Owner sees the Owner-association form instead]'
- 'PopularStrip.md:implicit_adrs.[Owner-association gate is the rendering
  precondition for Popular UI access — but NOT for the underlying API endpoint;
  this client-side gate is purely UX, NOT security]'
- 'PopularStrip.md:concepts.audiences[ODD Platform UI end-user with an associated
  Owner — the only audience that can reach this surface]'
mitigations_unimplemented:
- 'Document the UI-vs-API gating asymmetry on
  /configuration-and-deployment/enable-security/authorization — operators
  deploying ODD must understand that UI rendering gates do NOT extend to API
  endpoints'
- 'For multi-tenant deployments, consider adding a server-side opt-in flag
  `auth.popular.requires-association=true` that mirrors the UI gate at the API
  layer — would close the asymmetry for operators who want consistency'
notes: |-
  New invariant captured in batch 2026-05-19J. The owner-association gate is a
  UX-scoping pattern, NOT a security pattern. It is consistent with the platform's
  broader stance: UI rendering gates for richer-context audiences, API endpoints
  uniformly authenticated-only (consistent with the read-collaborative ADR).

  The asymmetry is operationally significant for ANY operator who looks at the
  UI and infers the API is similarly gated. A curl test against /api/dataentities/popular
  from an authenticated-but-no-Owner caller (or anonymous under DISABLED) returns
  the same payload as the UI shows — confirming the API is more permissive than
  the UI implies.
