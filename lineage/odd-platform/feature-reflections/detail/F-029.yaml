- id: H-012
  hypothesis: "When the platform ships a release, the OpenAPI spec is verified to match the running platform — a developer can trust that every spec'd operation, on the wire, returns the declared status code and the declared response-DTO field-set."
  derivation: "Negative-space + pillar mission (the spec is 'the wire contract for shape') — a contract a developer builds against is only trustworthy if something guarantees it matches reality."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      ZERO end-to-end conformance test exists between the spec and the running platform. The only
      de-facto check is that openapi-generator-cli parses the spec (a YAML-validity + $ref-
      resolvability check) at build time — nothing fires the spec'd operations against a running
      instance to assert status-code or response-DTO parity. This absence is the STRUCTURAL ROOT
      that lets every drift class above (H-002 error-model, H-003/H-004 status-code, H-005 inverse-
      semantic, H-008 missing-field, H-009 operationId) accumulate: nothing guards the alignment, so
      every authoring session is a potential new drift instance. Whether ANY currently-shipped
      operation drifts in response-DTO field-set (beyond the status-code + summary drifts already
      enumerated statically) cannot be known from the sidecars alone — it requires running the
      platform and diffing. Emitted P-243 to measure it.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: tests_coverage_semantic.gaps
        cite: "test_files: ['none'] + uncovered_behaviours (spec-vs-controller status/response/path parity all GAP)"
        note: "No conformance test; the drift cluster DOC-GAP-099 is the direct consequence of nothing structurally guarding spec<->controller alignment."
    operator_visible_failure: |
      A developer trusts the spec as the wire contract and builds an SDK against it; any operation
      whose response-DTO field-set has silently drifted from the spec (a renamed field, a
      now-nullable field, an added required field) breaks the SDK at runtime with no warning at
      integration time — exactly the silent semantic-mismatch class. Because nothing guards the
      contract, the developer's trust in 'the spec is the contract' is unverified at every release.
    severity: HIGH
    confidence: HIGH
    probe_id: P-243
    routes_to_finding: bug-candidate

- id: H-013
  hypothesis: "When an operator hardens their deployment (auth.type=OAUTH2 + auth.s2s.enabled=true + auth.ingestion.filter.enabled=true), the ingestion-shaped endpoints the platform exposes alongside the platform-api (e.g. POST /ingestion/entities/datasets/stats, POST /ingestion/metrics) require authentication — so a network caller cannot write to the catalog unauthenticated."
  derivation: "Cross-pillar (P-09 'enabling one surface does not protect the other' + P-10 ingestion) — the IngestionController siblings are in this chain; an operator reasonably expects the ingestion namespace to be protected once the ingestion filter is enabled."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      Both sibling endpoints are UNAUTHENTICATED under EVERY combination of auth.type and
      auth.ingestion.filter.enabled. IngestionDataEntitiesFilter binds the EXACT-LITERAL path
      /ingestion/entities (IngestionDataEntitiesFilter.java:28) — it does NOT match the sub-paths
      /ingestion/entities/datasets/stats or /ingestion/metrics. /ingestion/** is in
      SecurityConstants.WHITELIST_PATHS (SecurityConstants.java:95-96), so UI auth modes bypass
      them too. The property name auth.ingestion.filter.enabled reads as 'protect the ingestion
      namespace' but its actual scope is ONE sibling endpoint. (This is the ingestion-spec sibling,
      not the platform-api spec F-029 anchors — but the three IngestionController nodes are in this
      chain precisely because they demonstrate the contract-surface boundary, so the finding is
      in-scope to surface here, already tracked on the ingestion side.)
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: bugs_limitations_corner_cases[0]
        cite: "IngestionController.java:82-87 + IngestionDataEntitiesFilter.java:28 + SecurityConstants.java:95-96"
        note: "stats endpoint unauthenticated under every auth.type x filter combination."
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics
        section: bugs_limitations_corner_cases[0]
        cite: "IngestionController.java:89-95 + IngestionDataEntitiesFilter.java:28 + SecurityConstants.java:96"
        note: "/ingestion/metrics unauthenticated under every supported deployment posture."
    operator_visible_failure: |
      An operator who enables all three auth knobs believes the ingestion namespace is sealed; in
