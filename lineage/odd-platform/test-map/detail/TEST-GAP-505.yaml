proposed_action: |-
  Testcontainers integration test. (a) Create Owner Z with user uZ. (b) Authenticate uZ with Role R having NO DEG-related permissions (no DATA_ENTITY_ADD_TO_GROUP, no DATA_ENTITY_DELETE_FROM_GROUP). (c) Create DEG D with 2 members. (d) GET /api/dataentitygroups/D.id/lineage — assert HTTP 200 with the lineage graph (read succeeds — no DEG permission required). (e) POST /api/dataentities/{memberId}/data_entity_group with payload {data_entity_group_id: D.id} — assert HTTP 403 Forbidden (write requires DATA_ENTITY_ADD_TO_GROUP). (f) Test comment 'LOCKS the read-vs-write DEG RBAC asymmetry as of 2026-05-19. If a future change adds a DATA_ENTITY_GROUP_VIEW_LINEAGE permission, the GET assertion flips to expect 403; if a future change removes the write permissions, the POST assertion flips to expect 200.' This is a contract-pinning test that documents the deliberate asymmetry.
