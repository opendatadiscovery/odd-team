- id: H-003
  hypothesis: "When a backend reject (4xx/5xx) occurs on submitting the 'Link query' dialog, the user is shown an error and can correct it."
  derivation: "Negative-space + senior-PO UX seed (convenient/intuitive) — every form submit must signal failure; F-154 established this pattern across Terms forms."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The submit handler is mutateAsync({...}).then(_ => { reset(); }) with NO .catch
      (AssignTermQueryExampleForm.tsx:32-41). The dialog only auto-closes on isSuccess
      (handleCloseSubmittedForm={isSuccess}, line 81), so on a rejected promise the dialog stays open but
      neither resets nor shows any error — the rejection is swallowed (the .then callback never runs; there
      is no rejection branch). The user sees the dialog still open with their selection intact and no
      feedback. This is the F-155 facet no_error_handler_on_assign_query_example_mutation_silent_failure
      and the same class as F-154b.
    evidence:
      - sidecar: "(source_read_for_validation — UI hop unresolved)"
        section: ui
        cite: "AssignTermQueryExampleForm.tsx:32-41 (.then with no .catch) + :81 (close only on isSuccess)"
        note: "rejected mutation → dialog stays open, no error rendered, no reset"
    operator_visible_failure: |
      An operator who links a query example that the backend rejects — e.g. a duplicate link (the link
      may already exist; TermController delegates to a service whose duplicate path raises a
      BadUserRequestException per the QueryExample duplicate-relation pattern), a 403 from a stale
      permission, or a transient 5xx — sees the dialog simply sit there. There is no toast, no inline
      error, no spinner-stop signal. The likely user reaction is to click submit again (compounding the
      duplicate) or to assume it worked and navigate away. The failure is fully silent: the operator
      cannot tell a successful link from a rejected one without manually refreshing the tab.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional
