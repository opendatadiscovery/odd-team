# Role-Based Access Control — product-owner reflection

## product_owner_narrative

Role-Based Access Control is ODD Platform's **authorization governance surface** — the operator-facing machinery that decides *which authenticated identity may mutate which part of the catalog*. A product owner introduces it to a new customer like this: "ODD ships read-collaborative — every signed-in user can browse the whole catalog — but every WRITE (tagging an entity, editing a description, registering a datasource, granting ownership) is gated. You control those gates here. You write **Policies** (named JSON rules that grant permission verbs over resource types — `DATA_ENTITY`, `TERM`, `QUERY_EXAMPLE`, `MANAGEMENT`), you bundle policies into **Roles**, and you attach roles to **Owners** — the directory entries your authenticated users associate themselves with. Two roles ship seeded: `Administrator` (everything) and `User` (nothing by default)." The audiences are the platform-operator and the data-steward-owner (per `system-mission.md:222-268` P-09 + P-08 pillar blocks); the load-bearing constraint the pillar states verbatim is that ODD has **two independent authentication surfaces** and "enabling one does not protect the other" (`system-mission.md:254-256`).

A user interacts with RBAC through two front doors. The **Management UI** (the `/management/policies` and `/management/roles` SPA routes, per the batch-ZH `routes/managementRoutes` sidecar) renders two structurally-identical tabs: each lists the entities (id + name only) with infinite-scroll + a debounced search box, gates the "Create" button behind a `WithPermissions` wrapper, and exposes per-row Edit/Delete affordances (per `PolicyList.md` understanding + `RolesList.md` understanding). The **REST API** is the same chain underneath — `POST/GET/PUT/DELETE /api/policies`, `/api/roles`, `/api/owners`, plus the ownership-binding endpoints `POST /api/dataentities/{id}/ownership` (per the F-006 chain `contributing_nodes` + `PolicyServiceImpl.md` upstream_callers). Behind every front door the same persistence pattern repeats: soft-delete (`UPDATE ... SET deleted_at = NOW()`, never `DELETE`), a partial unique index that frees the name on soft-delete (`policy_name_unique ... WHERE deleted_at IS NULL`, per `ReactivePolicyRepositoryImpl.md` invariants[2]), and — critically — the authorization **hot path** `getRolesPolicies(roleIds)` that resolves the calling user's effective permissions on *every authorized HTTP request* (per `PolicyServiceImpl.md` invariants[5] + `ReactivePolicyRepositoryImpl.md` performance.hot_paths).

The working parts a product owner would demo: **policy authoring** (a JSON editor validated against a bundled JSON-Schema at write time, per `PolicyServiceImpl.md` invariants[0]); **role bundling** (attach N policies to a role; the role-policy edge set is rewritten wholesale on update, per `RolesList.md` concepts); **predefined-entity protection** (the seeded `Administrator`/`User` rows can't be renamed or deleted through the normal path — and this is now genuinely test-pinned at the service tier, per `PolicyServiceImplTest` + `RoleServiceImplTest`); **a four-mode authentication front** (`auth.type` = DISABLED / LOGIN_FORM / OAUTH2 / LDAP, the last enriched at batch ZK, and the boundary now e2e-pinned by IT-009); and **cascade-delete defence** (you can't delete a policy that's still bound to a role — the platform raises HTTP 400 and tells you to detach first, per `PolicyServiceImpl.md` invariants[2]). The customer's mental model is reasonable and mostly honoured on the happy path. The reflection's job is to find where the *assembled product* diverges from what an operator running a real, multi-admin, audited deployment would expect.

The integration story has three legs (per `system-mission.md` cross-pillar graph). RBAC **feeds every other pillar** — "Authorization gates every mutation in Discovery ... the read-collaborative posture means READS bypass per-owner scoping" (`system-mission.md:447-450`) — and IT-010 now proves that under an enforcing mode (LDAP) the gate actually denies a principal who lacks the permission (no ADMIN bypass). It **feeds-from P-08 Management** — the Management UI is the authoring surface for the policy/role/owner bundles (`system-mission.md:455-458`). And it is **schema-coupled to P-07's Activity Feed** — the audit trail an operator would expect to record RBAC changes is the *same* `activity` table that F-021 owns, and that table's `data_entity_id NOT NULL` FK plus the `ActivityEventTypeDto` enum scope mean RBAC mutations **physically cannot be recorded there** (per the F-006 chain batch-R + batch-U notes, confirmed across 9-to-12 sidecars). This single coupling is the source of the feature's highest-severity finding.

A product owner would flag four edge cases in a demo. (a) **The audit trail is empty for everything you do on these screens** — create a policy, edit a role, delete an owner: nothing appears in the Activity Feed, no log line, no UI authorship column (per the 9-sidecar audit-silence pattern + `PolicyList.md`/`RolesList.md` confirming the UI tier renders only id+name). (b) **A deleted policy can keep granting via a narrow out-of-band path** — the catalogue-vs-grant asymmetry: the UI delete is cascade-blocked while the policy is bound, but the `getRolesPolicies` JOIN carries no `deleted_at` filter and the role-policy attach path does not validate liveness, so a soft-deleted policy re-attached via raw API keeps granting (per `ReactivePolicyRepositoryImpl.md` bugs[0] + the PLT-110 re-scope). (c) **A non-admin sees a different list than an admin, silently** — the principal-aware list fork returns only the caller's own roles/policies with no "showing N of M" affordance, so a non-admin may conclude "this platform has one role" (per `RolesList.md` invariants + `PolicyServiceImpl.md` invariants[4]). (d) **The seeded Administrator's protection is a case-sensitive string** — `name === 'Administrator'` at the UI, service-update, and SQL-index layers, but `equalsIgnoreCase` at the service-delete layer, producing a lowercase-`administrator` row that is editable, undeletable, and bypasses the UI guard (per `RolesList.md` invariants + `PolicyList.md` invariants[2]).

## hypotheses

- id: H-001
  hypothesis: |
    When an operator (or a compliance auditor) opens the Activity Feed and asks
    "who created / edited / deleted this RBAC policy, role, or owner, and when?",
    the platform shows them the answer — because the pillar's primary user action
    is "audit metadata changes" and RBAC mutations are the most security-relevant
    metadata changes the platform supports.
  derivation: |
    Pillar mission P-07 enumerates "audit metadata changes on the global Activity
    feed" as a primary user action (system-mission.md:203); P-09 frames RBAC as the
    gate on every mutation. A senior operator of any access-control system treats
    "who changed the permissions" as the single most load-bearing audit question.
  seed_source: pillar-mission + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      RBAC mutations emit NOTHING to any audit surface. PolicyServiceImpl,
      RoleServiceImpl, and OwnerServiceImpl carry no @Slf4j, no Logger, no log.*
      call, and no @ActivityLog annotation (Grep-verified across the class bodies,
      per PolicyServiceImpl.md downstream_side_effects + RoleServiceImpl/OwnerServiceImpl
      via the F-006 chain batch-S notes). The UI tier is equally silent — PolicyList
      and RolesList render only id+name, no created_by, no created_at (PolicyList.md
      security.known_security_gaps[4] + RolesList.md downstream_side_effects). The
      gap is not a missing annotation: it is DOUBLE-rooted. (1) Schema root cause —
      `activity.data_entity_id` is NOT NULL with FK to data_entity(id)
      (V0_0_48__add_activity.sql:4,12); RBAC mutations have no data-entity context,
      so the write would fail at the SQL layer even if @ActivityLog were added
      (F-006 chain batch R). (2) Enum root cause — ActivityEventTypeDto has NO
      POLICY_CREATED/ROLE_CREATED/OWNER_CREATED (or *_UPDATED/*_DELETED) values, so
      `@ActivityLog(POLICY_CREATED)` would not even compile (F-006 chain batch U).
      The pattern is confirmed across 9 distinct sidecars (controller E + policy-repo
      H + role-repo N + UI Q + activity-repo R + owner-service P + policy/role-service S
      + term-service U) and extends to a 10th surface (notification delivery, batch Y).
    evidence:
      - sidecar: odd-platform__java__service__service__PolicyServiceImpl.md
        section: downstream_side_effects (final paragraph)
        cite: "PolicyServiceImpl.java:1-117 (Grep @Slf4j|Logger|log.|@ActivityLog -> zero)"
        note: "Service tier emits zero security-relevant log lines on create/update/delete."
      - sidecar: odd-platform__java__repository_reactive__repository__ReactivePolicyRepositoryImpl.md
        section: security.known_security_gaps[1]
        cite: "ReactivePolicyRepositoryImpl.java:1-40 + ExceptionUtils.java:34"
        note: "Repository tier — only log.error on non-uniqueness DB errors; no mutation audit."
      - sidecar: '(F-006 feature-flow detail — batch R notes)'
        section: batch_extensions[batch=R]
        cite: "V0_0_48__add_activity.sql:4,12"
        note: "activity.data_entity_id NOT NULL FK — schema cannot store a non-data-entity event."
      - sidecar: '(F-006 feature-flow detail — batch U notes)'
        section: observed_vs_expected facet audit_silence_enum_rooted
        cite: "ActivityEventTypeDto.java:3-31"
        note: "Enum has no POLICY/ROLE/OWNER lifecycle values — @ActivityLog(POLICY_CREATED) would not compile."
      - sidecar: odd-platform__ts__react-component__component__PolicyList.md
        section: security.known_security_gaps[4]
        cite: "PolicyList.tsx:118-120"
        note: "UI rows render id+name only — no authorship affordance for the operator."
    operator_visible_failure: |
      Multiple operator-visible consequences:
      (a) A security incident reviewer asked "who created the MANAGEMENT/ALL policy
          on 2026-05-30?" has ZERO in-application records — not in the Activity Feed,
          not in server logs, not in any UI panel. The investigation dead-ends.
      (b) A regulated deployment (SOC2 / ISO27001 access-review requirement) cannot
          produce an access-change audit trail from ODD telemetry at all — the
          control simply does not exist for the RBAC surface.
      (c) An operator who notices an unexpected role binding cannot answer "did I
