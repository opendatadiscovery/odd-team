- id: H-006
  hypothesis: |-
    When two collectors (or two ticks of one collector) ingest into the SAME datasource at the
    same time, the platform serialises them safely and BOTH batches eventually succeed — a
    collector author running a normal concurrent-collector deployment does not see one batch
    spuriously fail because another was in flight.
  derivation: |-
    The platform's canonical deployment is one platform + many concurrent producers (system-mission
    P-10 architectural pillar); a collector author reasonably assumes concurrent ingestion to one
    datasource is safe and bounded.
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |-
      `getIdByOddrnForUpdate` issues `SELECT … FOR UPDATE` on the `data_source` row
      (IngestionServiceImpl.java:68, ReactiveDataSourceRepositoryImpl.java:94-101), held for the
      FULL `@ReactiveTransactional` pipeline duration. Concurrent ingestions to the SAME datasource
      are correctly SERIALISED (no interleaving, no lost write) — the safety half of the promise
      HOLDS. But the loser BLOCKS for the entire winner's pipeline (datasource resolve + 14
      processors + OTLP export); under a slow Postgres / saturated R2DBC pool / large winning batch,
      the loser may exceed the transaction timeout and surface as a 5xx with NO `Retry-After` and
      NO 429 — so "both eventually succeed" does NOT hold under contention.
    evidence:
      - sidecar: odd-platform__java__service__service__IngestionService.md
        section: concepts.invariants (datasource lookup FOR UPDATE) + scaling
        cite: "IngestionServiceImpl.java:68 + ReactiveDataSourceRepositoryImpl.java:94-101"
        note: "Per-datasource row lock serialises same-datasource ingestions for full pipeline."
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataEntityList.md
        section: performance.resource_allocation + scaling_characteristics
        cite: "IngestionServiceImpl.java:65-74"
        note: "Lock lifetime = full ingestion; loser may time out → 5xx-no-detail."
    operator_visible_failure: |-
      Under the platform's OWN expected deployment pattern (many collectors), two collectors
      pointed at one datasource degrade each other: the loser blocks, may time out into a generic
      5xx, then (per the documented retry-on-5xx pattern) retries — worsening the contention into a
      retry storm with no backoff signal. An author has no way to learn "you are contended, back
      off" from the contract. partial because the correctness (no lost/interleaved write) is intact;
      only the liveness/signalling under contention is broken. drift class
      `serialisation_under_pessimistic_lock_no_signal`.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

