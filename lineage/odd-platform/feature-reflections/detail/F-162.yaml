- id: H-010
  hypothesis: |-
    A manifest snippet that declares ONLY a BOOLEAN argument (or only static arguments) lets the
    operator reach Configure and get a snippet — the wizard works for non-text-input manifests.
  derivation: |-
    View-mode + negative-space — `disabled={!formState.isValid}` on Configure. If a manifest has
    no required text fields, is the form valid immediately so Configure is clickable?
  seed_source: view-mode
  validation:
    verdict: partial
    actual_behavior: |-
      Configure is `disabled={!formState.isValid}` (line 117). The BOOLEAN branch (line 38-66)
      and the staticValue branch (line 69-77) attach NO `rules`, so they impose no validity
      constraint; only the non-boolean non-static text branch attaches `required: true`
      (line 86-90). For a manifest whose arguments are all BOOLEAN and/or staticValue, the form
      has no required fields, formState.isValid is true from the start, and Configure is
      immediately clickable — the wizard works. For a manifest that mixes a required text field
      with booleans, the operator must fill the text field first (correct). The partial verdict:
      the happy path (boolean-only / static-only manifest) works, but react-hook-form's initial
      `isValid` for a form with a `required` field that has not been touched can be `false` until
      the field registers — meaning for a manifest WITH required text fields, Configure starts
      disabled (correct) but the exact initial-validity timing across mount is an
      implementation-internal of react-hook-form (mode defaults to onSubmit; isValid may lag).
    evidence:
      - sidecar: "(unresolved — source_read_for_validation)"
        section: view-mode
        cite: "IntegrationCodeSnippetWithForm.tsx:38-77, 86-90, 117"
        note: "boolean/static impose no rules → boolean-only manifest is valid immediately"
    operator_visible_failure: |-
      For boolean-only / static-only manifests the feature behaves correctly. The residual risk:
      react-hook-form's default validation mode is onSubmit, so `formState.isValid` may not update
      until a field interaction or submit attempt — for a required-text manifest this could leave
      Configure disabled in a way that feels stuck if isValid does not recompute on first input,
      or enabled prematurely. This is the same uncertainty surfaced as a probe in H-012.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
  sme_consultation_recommended: false

- id: H-011
  hypothesis: |-
    The rendered snippet shows the operator a safe view of the template — a maliciously- or
    carelessly-authored manifest template cannot execute script or inject markup into the
    operator's browser when the snippet is rendered as Markdown.
  derivation: |-
    Negative-space / security — the template is server-supplied (manifest YAML), compiled by
    Handlebars on the client, and rendered through MDEditor.Markdown. No client-side sanitisation
    of the compiled output is visible at this call site.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The compiled Handlebars output (templateWithArguments) is passed to `<Markdown>` →
      `MDEditor.Markdown source={value}` (Markdown.tsx:113-124). Handlebars HTML-escapes
      double-mustache `{{ }}` interpolations by default, but the TEMPLATE TEXT itself (the
      manifest-authored body) is rendered as-is by the Markdown renderer. @uiw/react-md-editor
      uses react-markdown/rehype under the hood, which by default does NOT render raw HTML unless
      rehype-raw is enabled — but whether this Markdown wrapper enables raw HTML / what sanitiser
      schema @uiw applies is NOT determinable from this call site alone. The threat model: a
      manifest is authored by P-10 integration developers (trusted-ish, classpath-loaded per
      F-033), not by end users — so the practical exposure is low. But "the manifest is trusted"
      is an assumption, not a verified control, and a stored-template → client-render path that
      trusts the server template entirely warrants an empirical check of what the renderer does
      with embedded HTML/script in a code-snippet template.
    evidence:
      - sidecar: "(unresolved — source_read_for_validation)"
        section: security
        cite: "IntegrationCodeSnippetWithForm.tsx:22-26, 130; Markdown.tsx:113-124"
        note: "compiled template → MDEditor.Markdown; sanitiser schema not determinable from call site"
    probe_id: PENDING-F-162-1
    confidence: LOW
    routes_to_finding: probe-needed
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-162-1"
  sme_consultation_recommended: false

- id: H-012
  hypothesis: |-
    When an operator fills the last required field, the Configure button enables promptly (no
    extra click), so the configure step feels responsive.
  derivation: |-
    Senior-PO convenience/intuitive question (Rule 9 mandatory UX seed) — Configure is gated on
    formState.isValid; react-hook-form's default validation mode affects when isValid flips.
  seed_source: ui-label
  validation:
    verdict: probe-needed
    actual_behavior: |-
      `useForm({})` (line 20) uses react-hook-form defaults — `mode: 'onSubmit'`,
      `reValidateMode: 'onChange'`. With `mode: 'onSubmit'`, `formState.isValid` is NOT eagerly
      computed before the first submit in some react-hook-form versions; the Configure button's
      `disabled={!formState.isValid}` may therefore stay disabled until the user attempts submit
      or until reValidate fires. The exact UX (does Configure enable on the keystroke completing
      the last field, or only after a submit attempt?) depends on the react-hook-form version
      pinned in odd-platform-ui and cannot be asserted from the component source alone. This is a
      responsiveness/intuitiveness question a senior PO must answer empirically.
    evidence:
      - sidecar: "(unresolved — source_read_for_validation)"
        section: ui-behaviour
        cite: "IntegrationCodeSnippetWithForm.tsx:20, 117"
        note: "useForm({}) default mode=onSubmit; isValid timing for the disabled gate is version-dependent"
    probe_id: PENDING-F-162-1
    confidence: LOW
    routes_to_finding: probe-needed
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-162-1 (e2e — same wizard stack covers H-007/H-010/H-012 timing)"
  sme_consultation_recommended: false

