gap_id: TEST-GAP-099
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
surfaced_by:
- regenerateCollectorToken.md:bugs_limitations_corner_cases.[6] (severity HIGH in
  DISABLED)
- regenerateCollectorToken.md:security.known_security_gaps.[4] (severity HIGH in DISABLED)
behaviour: Under `auth.type=DISABLED`, `COLLECTOR_TOKEN_REGENERATE` is bypassed entirely
  — `TokenGeneratorImpl.java:30-31` falls through to `regenerate(tokenPojo, null)`
  with NULL `updated_by`. The Permission gate in SecurityConstants is bypassed (security
  filter chain skips authorization). Any caller able to reach the platform on a DISABLED
  deployment can rotate any collector's token and receive plaintext.
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/CollectorTokenRegenerationDisabledAuthTest.java
  name: regenerateCollectorToken_authTypeDISABLED_anonymousCallerReceivesPlaintextToken
evidence:
- 'regenerateCollectorToken.md says: ''In DISABLED mode, AuthIdentityProvider.getCurrentUser()
  returns empty, and TokenGeneratorImpl.java:30-31 falls through to Mono.just(this.regenerate(tokenPojo,
  null)) — the resulting TOKEN row''s updated_by is NULL ... any caller able to reach
  the platform on a DISABLED deployment can rotate any collector''s token'''
- 'concepts.yaml:entities[Collector].security_aggregate.weaknesses.[4] verbatim: ''Under
  auth.type=DISABLED the gate is bypassed entirely (severity HIGH in DISABLED deployments)'''
cross_references:
- concepts.yaml:entities[Collector].security_aggregate.weaknesses.[4]
- concepts.yaml:entities[Auth Mode]
proposed_action: Add `@WebFluxTest` parameterised over `auth.type=DISABLED`; assert
  anonymous PUT returns 200 with plaintext token + `updated_by=NULL` on the persisted
  row. Locks the dev-only-mode bypass posture; pair with a startup-warning assertion
  when DISABLED + production-flag detected.
