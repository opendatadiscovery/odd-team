description: 'POST /api/policies — gated by POLICY_CREATE MANAGEMENT-tier Permission
  via SECURITY_RULES (SecurityConstants.java:163-164). Service validates the inbound
  policy JSON against `schema/policy_schema.json` (V201909) via `PolicyJSONValidator.validate(...)`
  before persistence; non-empty ValidationMessage set raises `IllegalArgumentException`.
  Maps to `PolicyPojo`, INSERTs via `ReactivePolicyRepository.create` (soft-delete-aware
  base). Returns 200 OK with `PolicyDetails`. Note: spec declares 201 (openapi.yaml:3517-3534)
  but controller returns 200 — same drift as POST /api/roles + POST /api/owners. Bypassed
  under `auth.type=DISABLED`.'
