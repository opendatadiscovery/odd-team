contributors:
  - 'GoogleUserHandler.invariants[6]: Admin-group support is ABSENT. Google handler reads adminPrincipals ONLY — adminGroups is not consulted. Operators who set `auth.oauth2.client.google.admin-groups` see ZERO effect.'
  - 'GoogleUserHandler.bugs_limitations_corner_cases[0]: admin-groups config silently no-op for Google. The bug class: silent no-op config IS operator hostility — no boot warning, no log, no rejection.'
  - 'GoogleUserHandler.docs_link_semantic.doc_drift_findings[3]: admin-groups for Google is silently unsupported. The live docs document admin-groups for AWS Cognito and GitHub, NOT for Google.'
  - 'GoogleUserHandler.security.known_security_gaps[0]: admin-groups silently no-op (security policy gap) — operator setting admin-groups expects group-based admin assignment matching the Cognito/GitHub pattern; the handler never reads provider.getAdminGroups() — the user is silently USER.'
  - 'GithubUserHandler.dependencies_semantic.requires-config: admin-groups for GitHub is fully implemented at lines 99-120 — the user must be a member of a team whose name case-insensitively equals any admin-groups entry AND whose team belongs to organizationName.'
  - 'ODDOAuth2Properties (existing sidecar): OAuth2Provider.adminGroups Set<String> binds provider-agnostically; no @Validation annotation guards per-provider semantic correctness.'
evidence:
