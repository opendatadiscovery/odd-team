  Modelling (the FIRST P-02 anchored feature in the registry; the
  pillar's sub-feature seed at system-mission.md:118-119 names it).
  The P-02:F-001 anchor is the canonical home; sibling P-02:F-002
  Relationships and ERDs is the second pillar feature awaiting
  enrichment. Cross-link partners: F-004 (XSS family — 4th surface),
  F-002 (term-side reverse-lookup), F-014 / F-015 / F-017
  (read-collaborative posture family).
