proposed_action: |-
  Author RelationshipControllerAuthorizationPostureTest as a
  @SpringBootTest + WebTestClient harness with five cases:
  (a) authenticated user with NO policies/roles → 200 OK with full
  catalog (pins the open-by-default invariant);
  (b) seed a data_entity with exclude_from_search=true and assert it
  IS RETURNED by /api/relationships (pins the asymmetry vs
  /api/dataentities — regression-pin: if a future fix wires the filter
  here, this test must be updated explicitly with a comment);
  (c) auth.type=DISABLED → 200 OK to anonymous (PROVIDER-NULL-BLEED);
  (d) user A scoped to data_source_1 only sees relationships involving
  data_source_2 entities — pins the cross-data-source visibility;
  (e) two users (A admin, B read-only) get identical detail payloads —
  no owner-derived response variance.
  Also: maintainer should triage whether the no-auth posture is the
  intended catalog-as-public-metadata stance OR a defect requiring
  authorization — this test should document the chosen stance in
  comments. If the stance flips, EACH case has to be updated and the
  doc gap surfaced.
