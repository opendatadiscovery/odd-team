proposed_canonical: Collector Token (Token Rotation)
rationale: 'regenerateCollectorToken sidecar surfaces an architecturally significant
  operation (in-place UPDATE, no grace window, plaintext in response, plaintext in
  DB, ThreadLocalRandom RNG) gated by a Permission (COLLECTOR_TOKEN_REGENERATE) that
  IS documented on the live `/permissions` page (verified 200, 2026-05-10) BUT without
  operational context. main-concepts.md names Collector and S2S authentication mode
  separately; the token-as-credential and the rotation contract are not first-class
  vocabulary. Recommended: add a `Token Rotation` section to the `enable-security`
  pillar covering (a) who can rotate (Permission name), (b) what happens to in-flight
  ingestion against the old token, (c) whether rotation is audit-logged, (d) the plaintext-in-response
  shape of the rotation endpoint.'
contributing_concepts:
- Token (40-char alphanumeric shared secret) — regenerateCollectorToken
- TokenPojo (regenerateCollectorToken)
- regenerate-collector-token operation (regenerateCollectorToken)
- COLLECTOR_TOKEN_REGENERATE Permission (live /permissions page)
suggested_add_to_docs: true
