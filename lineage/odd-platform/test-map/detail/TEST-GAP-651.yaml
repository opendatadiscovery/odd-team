proposed_action: |-
  Add `search_while_paginating_race_window_resolves_deterministically_or_pin_current_behaviour` to `OwnersList.test.tsx`. Simulate two in-flight `fetchOwnersList` thunks with response delays: (a) `{page: 6, query: ''}` returns after 100ms; (b) `{page: 1, query: 'foo'}` returns after 300ms. Order them so (a) resolves before (b) — assert the final list state is only `foo` matches (page 1 setAll). Then reverse: (a) resolves AFTER (b); assert the actual reducer behaviour (likely: page-1 foo replaces, then page-6 unfiltered SETMANY appends — current dangerous-but-shipping behaviour). Pin AS the current contract; surface a `.todo` test `cancellation_via_abortcontroller_would_eliminate_race` to flag the eventual fix path.
