notes: |
  This is the cross-batch synthesis batch S confirms — the authorization
  hot path was previously inferred from individual sidecars (batch H ReactivePolicyRepositoryImpl
  surfaced the per-request JOIN; batch N ReactiveUserOwnerMappingRepositoryImpl
  surfaced the 5-table JOIN). Batch S anchors the chain at the SERVICE tier:
  the two services (Policy + Role) are the upstream consumers of both
  repositories; the chain enacts the per-request authorization model.

  Recommended cleanup (highest leverage first):
    (1) Add request-scoped caching to getCurrentUserPolicies via Spring s
        @RequestScope on a delegating cache bean (1-call-per-request);
        immediate win for any request that traverses multiple SecurityRules
        (which is rare today but possible).
    (2) Add short-TTL process-wide cache (Caffeine, 30-60s TTL) on
        getCurrentUserPolicies AND getCurrentUserRoles keyed by (username,
        provider). Cache invariant: invalidate on RoleServiceImpl.update /
        delete + PolicyServiceImpl.update / delete + OwnerServiceImpl.delete
        + ReactiveOwnerToRoleRepository writes. The publish/subscribe
        primitive can be the existing notifications-WAL channel (already
        in-process for the Slack notifier).
    (3) Add @Timed observability on both service methods to surface the
        actual per-request cost in Micrometer metrics — the current
        invariant is reasoned-about but not measured.

  Cross-link to F-009 (Doc Drift): both the live `/authorization/policies`
  and `/authorization/roles` pages are SILENT on the per-request DB cost
  of the authorization model; operators tuning their R2DBC pool size
  cannot derive the auth-resolution cost from documentation.
