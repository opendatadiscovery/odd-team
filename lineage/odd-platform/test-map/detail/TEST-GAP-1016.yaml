behaviour: |-
  **The Activity Feed filter labelled `t('User')` is OPERATOR-MISLEADING
  and uniform across all six locales — no locale corrects the label.**
  The label appears at `Filters.tsx:58` and reads "User" in en.json
  line 347. An operator clicking the filter expects "filter activity
  by who PERFORMED the action". The implementation at
  `ReactiveActivityRepositoryImpl.java:272-273` binds
  `USER_OWNER_MAPPING.OWNER_ID.in(userIds)` — i.e. it filters by the
  OWNER of the entity that the activity was on, NOT by the actor who
  performed it.

  Per LSN-020 (`retrospectives/LSN-020-activity-feed-user-filter-semantic-drift.md`)
  this is a documented structural drift; the en.md sidecar's
  bugs_limitations_corner_cases couples line 347 of this file to the
  SQL behaviour. No test exists pinning either (a) the current
  rendered text → SQL-behaviour mismatch (the regression-pin for
  documentation accuracy) OR (b) the desired state where the label
  reads "Entity Owner" and the SQL behaviour matches OR a separate
  "Actor" filter is added with the actor-side SQL.

  The drift is HIGH because (i) every activity-feed visit hits this
  surface, (ii) the misleading label could lead an operator to
  conclude that no activity occurred when in fact activity occurred
  but performed by someone OUTSIDE the owner set, (iii) the cross-
  locale uniform misleading-ness means a French operator gets the
  same wrong mental model as the English operator. This is
  documentation-driven harm, not data loss.

  Probe P-171 (per en.md docs_link_semantic refs) verifies the
  runtime drift but no unit test pins the relationship.

  Batch ZL (2026-05-26) strengthens this with the Activity.tsx
  component sidecar evidence: the misleading-label channel is
  triangulated across en.json, the Filters child, the Activity
  component itself, and the backend repository. The component
  sidecar makes the four operator-observable consequences
  explicit:
  (a) Users WITHOUT an active user-owner mapping cannot be selected
      at all — autocomplete sources via `fetchOwnersList` only
      (`MultipleFilterAutocomplete.tsx:44-47`); a user-without-owner
      is silently absent from the picker. The doc copy "performed
      by selected users" cannot be satisfied for these users.
  (b) Reassigning a user-owner mapping (the user changes which
      owner they represent) RETROACTIVELY rewrites which historical
      activity rows match the filter — the audit trail's "who did
      this" answer for past events changes silently without any
      event-log entry. Forensic integrity drift.
  (c) Multiple users mapped to the same owner all collapse into
      the same filter result — picking "owner-Alice-team" returns
      rows for every user mapped to that owner. The label promises
      single-user, the implementation delivers user-set-by-owner.
  (d) Deleted-user-mapping silent empty: when
      `USER_OWNER_MAPPING.DELETED_AT.isNull()` is enforced (line
      274), filtering by a soft-deleted mapping's owner_id
      returns empty even if the underlying actor still exists.

  The available-but-unused column is `ACTIVITY.CREATED_BY` — read
  in the LEFT JOIN at line 221, SELECTED at line 212, but NEVER
  filtered. An actor-honest implementation would bind
  `ACTIVITY.CREATED_BY.in(userIds)` on the username axis.

  Probe P-190 (batch ZL) emitted to validate the four observable
  consequences end-to-end on a real platform run.
