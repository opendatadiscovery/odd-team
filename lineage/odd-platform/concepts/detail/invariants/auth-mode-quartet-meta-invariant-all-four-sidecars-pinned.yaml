mitigations_unimplemented:
- |-
  Doc-side: publish a single auth-mode comparison table on
  /configuration-and-deployment/enable-security that names the four modes
  AND the asymmetries (AuthorizationCustomizer wiring; ADMIN authority
  semantics; provider-null bleed surface; S2S compositional behaviour;
  CSRF posture). The information is currently spread across four
  separate sub-pages with no overview.
- |-
  Code-side: extract the common CSRF-disabled + S2S-additive convention
  into a shared base configuration. The duplication across four
  SecurityConfiguration files is convention encoding (all four call
  `.csrf(...disable)`; three of four wire S2S at HTTP_BASIC) — a shared
  base would make the convention enforced rather than imitated.
- |-
  Code-side: revive AuthorizationManagerCondition to gate
  AuthorizationCustomizer wiring centrally. Today the Condition is dead
  code (no @Conditional consumers) and the Customizer is wired by
  duplicate @ConditionalOnProperty on OAuth + LDAP. Centralising the
  decision in the Condition would make the asymmetry explicit and
  fixable in one place.
- |-
  Test-side: add boot-time integration tests that boot the platform with
  each `auth.type` value AND assert (a) the correct SecurityWebFilterChain
  is registered; (b) the AuthorizationCustomizer presence/absence
  matches the convention; (c) the S2S filter is composed when
  `auth.s2s.enabled=true` for the three additive modes.
