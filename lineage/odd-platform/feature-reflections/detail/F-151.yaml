- id: H-006
  hypothesis: "When a term author saves a definition, the definition is displayed to viewers as text — a definition containing <script> or other HTML is shown as literal characters, not executed."
  derivation: "Response-shape — the Overview tab renders termDetails.definition; a user reasonably expects a description field to be displayed as text, not as live markup."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The term definition flows TermFormData.definition → TermServiceImpl.createTerm/updateTerm
      (NO Jsoup.clean, NO Encode.html, NO allowlist, NO length cap — per TermServiceImpl.md
      operations) → term.definition column → Overview.tsx → TermDefinition.tsx:45 →
      <Markdown value={...}> → MDEditor.Markdown, which bundles rehype-raw@6.1.1 (pnpm-lock.yaml:
      3900,5922,8843) and applies NO rehype-sanitize (Grep over odd-platform-ui/src returns zero
      matches). A <script> payload in the definition renders as live HTML/JS on every subsequent
      render of the Overview tab. This is the F-004 stored-XSS class extended to TermDefinition —
      the THIRD surface after DataEntity description and DatasetField description.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__TermDetails.md
        section: known_security_gaps
        cite: "TermDefinition.tsx:45 + Markdown.tsx:113-124 + pnpm-lock.yaml:3900,5922,8843 (rehype-raw, no rehype-sanitize)"
        note: "definition rendered via rehype-raw without sanitisation"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: operations
        cite: "TermServiceImpl.java:99-145 (createTerm/updateTerm — no sanitisation pass)"
        note: "raw definition string persisted verbatim; shares the F-004 trust assumption"
    operator_visible_failure: |
      Any operator holding TERM_UPDATE on any term they can edit can persist arbitrary HTML+JS into
      that term's definition; because reads are collaborative (any authenticated user can open any
      term), the script executes in the browser of EVERY authenticated viewer who opens that term's
      Overview tab. Consequences: session/token theft, action-on-behalf, catalog-wide credential
      harvesting from a single planted term. Operators classifying a term as "internal/restricted"
      by NAME get no protection — the content (and the XSS payload) is uniformly readable/executable.
      The live data-glossary doc page carries no warning that definitions are unsanitised.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

