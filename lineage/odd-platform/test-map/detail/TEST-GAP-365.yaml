test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/AlertServiceImplExternalAlertSpoofTest.java
  name: handleExternalAlerts_arbitraryEntityOddrn_createsAlertWithNoOwnershipValidation
evidence:
- 'AlertServiceImpl.md says: ''The AlertManager webhook payload''s `entity_oddrn` label
  is trusted verbatim and never validated against the calling principal or the data-entity
  registry (severity HIGH)'''
- 'AlertServiceImpl.java:178 verbatim: `setDataEntityOddrn(externalAlert.getLabels().get("entity_oddrn"))`
  — no validation'
- 'AlertManagerController.java:21-26 — unauthenticated endpoint'
cross_references:
