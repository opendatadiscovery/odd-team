  batch_refresh_note_archived_batch_L: 'Batch L — 5 DataEntityController write-surface
    sidecars processed:

    addDataEntityDataEntityGroup, deleteDataEntityFromDataEntityGroup,

    getDataEntityAlerts, upsertDataEntityMetadataFieldValue,

    deleteTermFromDataEntity.


    3 NEW pillar-anchored features minted:


    F-012 (P-01:F-003 Data Entity Group Membership) — write-collaborative

    DEG surface. The SecurityRule gate is on the CHILD entity not the DEG,

    enabling cross-owner pollution of Catalog Overview Domain tiles

    (DATA_ENTITY_ADD_TO_GROUP holder on entity X can place X into ANY

    manually-created DEG owned by ANY team — the operator who curates

    "Finance Domain" has no veto on drive-by writes). Neither ADD nor

    DELETE emits @ActivityLog despite ActivityEventTypeDto.DATA_ENTITY_RELATION_UPDATED

    enum existing as dead code. ADD raises 400 on duplicate; DELETE

    silently returns 204 on no-op — asymmetric idempotence contracts on

    write-symmetric operations. The (group_oddrn, data_entity_oddrn) PK

    does NOT include is_deleted (added later by V0_0_79), so a

    soft-deleted prior membership blocks re-add via PK collision —

    onDuplicateKeyIgnore returns empty Flux, switchIfEmpty fires

    misleading "already in this DEG" error while the user sees no

    membership. User-initiated DELETE HARD-deletes; ingestion-cascade

    soft-deletes — same operator-visible behaviour, different durability.

    11 substantive drift facets.


    F-013 (P-01:F-004 Custom Metadata Field Editing) — silent

    UPDATE-not-UPSERT despite OpenAPI operationId "upsert". The repository

    method is pure UPDATE with WHERE; on missing (entity, field) pair OR

    missing dataEntityId, the query matches zero rows, the Mono collapses

    to empty, the controller returns 200 OK with empty body. The UI''s

    redux thunk hardcodes "Metadata successfully updated." on any 200 —

    user told the write succeeded when no row was touched. SAME shape as

    F-004 upsertDescription. No type validation against MetadataTypeEnum

    (INTEGER field accepts "not a number"). No origin restriction —

    EXTERNAL fields (collector-ingested) are writable; an operator can

    overwrite collector values until the next ingestion cycle. The

    `active` column is silently dropped to NULL on every UPDATE (pojo

    construction never calls setActive; DB column DEFAULT TRUE applies

    only on INSERT). No @ActivityLog despite ActivityEventTypeDto reserving

    CUSTOM_METADATA_CREATED/UPDATED/DELETED — all three enum values are

    reserved-but-never-fired. 11 substantive drift facets.


    F-014 (P-07:F-003 Per-Entity Alert View) — cross-owner per-entity

    alert read. REFACTOR-024 family extension to per-entity surface.

    No @PreAuthorize, no SecurityConstants.SECURITY_RULES entry for the

    GET path, no OWNERSHIP join at the repository. Falls through to

    AuthorizationCustomizer''s catch-all `.authenticated()`. The

    structural asymmetry with the sibling listByOwner query (which DOES

    join OWNERSHIP) encodes the "per-entity reads are unscoped" pattern,

    but the live alerting doc (WebFetched 2026-05-19 status 200) names

    this endpoint VERBATIM as the audit-export workaround for the

    housekeeping-cleanup bug — silent on access model. The

    soft-delete-inclusive existence check creates a cross-channel leak:

    alerts reachable via this endpoint while the entity is hidden from

    catalog list endpoints. Sibling getDataEntityAlertsCounts accepts a

    status filter; this endpoint does not. Pagination is unbounded at

    every layer. The mutation endpoint on the same namespace

    (alert_config PUT) IS rule-gated; the read endpoint is not — no

    inline defence of the convention. 9 substantive drift facets.


    1 feature EXTENDED:


    F-002 (P-06:F-001 Term-to-Entity Linkage) — DELETE half PRIMARY-SOURCE

    CONFIRMED via deleteTermFromDataEntity sidecar. SecurityConstants.java:240-242

    registers SINGULAR `/term/{term_id}` while openapi.yaml:1042 declares

