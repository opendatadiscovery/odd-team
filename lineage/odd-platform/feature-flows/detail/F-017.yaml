description: |-
  The "facets" surface on SearchController is realised by TWO sibling
  reactive endpoints that operate on the SAME `SearchFacets` session UUID:
  (a) `getSearchFacetList` (`SearchController.java:42-47` — `GET /api/search/{search_id}`
  per `openapi.yaml:654-674`) returns the seven-facet aggregate counts +
  total entity counts for the session, and (b) `getFiltersForFacet`
  (`SearchController.java:30-40` — `GET /api/search/{search_id}/facet/{facet_type}`
  per `openapi.yaml:702-732`) returns the paginated list of countable
  filter options for a single facet type (TAGS / OWNERS / TYPES / GROUPS
  / STATUSES per `MultipleFacetType`). Both endpoints delegate to
  `SearchServiceImpl` (`SearchServiceImpl.java:51-72`) which mints SQL
  via `ReactiveSearchFacetRepositoryImpl`.

  The user-observable promise (per the live Search and Filtering page
  WebFetched 2026-05-19 status 200): "The platform incorporates faceted
  search capabilities. This means you can refine your search results
  based on specific attributes, ensuring that you find exactly what you
  are looking for." The page lists seven facets: Datasource, Type,
  Namespace, Owner, Tag, Groups, Statuses.

  The user-observable reality, per primary-source code-walk of
  SearchController.facets + SearchServiceImpl + ReactiveSearchFacetRepositoryImpl
  + the V0_0_1__init.sql migration:

  (1) **Cross-owner facet enumeration** — every facet count is computed
  CATALOG-WIDE with no `OWNERSHIP` join and no principal-derived
  predicate. The six aggregators in `ReactiveSearchFacetRepositoryImpl`
  (entity-class 163-249, type 251-337, owner 339-372, tag 374-407,
  group 409-452, status 454-534) all join `SEARCH_ENTRYPOINT` +
  `DATA_ENTITY` and apply only `getDataEntityDefaultConditions`
  (HOLLOW=false, STATUS != DELETED, EXCLUDE_FROM_SEARCH NULL-or-false) —
  no owner-side filter. Only `myObjectsCount` at `SearchServiceImpl.java:128-130`
  is owner-scoped, and it is shown ALONGSIDE the cross-owner `total`,
  not as a scoping predicate. An authenticated caller drilling
  `getFiltersForFacet(OWNERS)` enumerates EVERY OWNER NAME in the
  platform + per-owner entity counts; then `getFiltersForFacet(NAMESPACES)`
  (via the aggregate response) enumerates every namespace; then TAGS /
  GROUPS / TYPES / STATUSES enumerate the full catalog cardinality.

  (2) **Bearer-token-shaped session UUIDs** — the `search_facets`
  table (`V0_0_1__init.sql:204-211`) has NO `owner_id`, `created_by`,
  or `user_id` column — the schema is `id uuid PRIMARY KEY DEFAULT
  gen_random_uuid(), query_string varchar(255), filters jsonb`. The
  service layer never captures the principal — `SearchServiceImpl.search`
  creates a row without owner binding (lines 75-82); `updateFacets`
  accepts any caller for any UUID (lines 84-96); `fetchFacetState` is
  a raw UUID lookup (lines 157-160). Any authenticated user in possession
  of any other user's UUID can READ, UPDATE, and DRIVE that session.
  The UUID space is 122-bit so brute force is infeasible, but URL
  leakage (copy/paste, screenshot, bug report) hands the recipient full
  read+update access.

  (3) **tsquery operator injection → SQL parser DoS via persisted query** —
  `JooqFTSHelper.tsQuery` (`JooqFTSHelper.java:164-168`) does NOT
  escape tsquery operators; persisted `query_string` reaches
  `to_tsquery(?)` directly via `JooqFTSHelper.java:100-105`. A caller
  who POSTs a search with `query='foo )('` persists the row; every
  subsequent facet aggregator that runs on that row's state fails at
  `to_tsquery` parse time with Postgres syntax error 42601. The session
  becomes permanently broken — the row is reachable but every facet
  read 500s. Same code path as batch-H `getHighlightedResult` finding;
  the facet endpoints are a SECOND invocation site for the same bug
  shape.
facets_summary: |-
  10 substantive drifts: cross-owner facet enumeration (catalog-wide
  counts expose cardinality across all owners — REFACTOR-024 family
  extension to the facet surface) + bearer-token-shaped session UUIDs
  (search_facets schema has no user binding; URL leak = session hijack)
  + tsquery operator injection DoS via persisted query (same code path
  as batch-H getHighlightedResult; SECOND invocation site) + DISABLED-mode
  anonymous facet enumeration + unbounded pagination at controller +
  OpenAPI + repository layers (size=1M triggers single jOOQ query
  bounded only by Postgres / network buffers) + side-effect UPDATE of
  last_accessed_at on every GET (GET is not idempotent + row contention
  under concurrent UI tabs) + session-state accumulates forever (no
  TTL eviction, no archive policy — V0_0_1 TODOs acknowledge the gap
  but no migration fixes it) + workaround doc silent on facet count
  scoping (operators may assume My Objects toggles facet counts —
  it does not) + catalog-wide count is by design (myObjectsCount is
  EXTRA scope, NOT a boundary) + zero test coverage at any layer.
