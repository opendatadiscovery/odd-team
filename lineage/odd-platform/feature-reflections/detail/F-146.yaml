# Metadata Stale Indicator (orange-clock per-row staleness signal) — product-owner reflection

## product_owner_narrative

The **Metadata Stale Indicator** is the platform's at-a-glance "this source may have stopped publishing" signal. Wherever a Data Entity's name appears in the catalog — a Search result row, a Directory level-4 list, a Catalog-Overview Recommended tile, a Lineage-graph node, the entity's own detail-page header — a small **orange clock icon** appears next to the name when the entity's metadata has gone stale, and nothing appears when it is fresh. An operator scanning a list of fifty datasets can spot the three that have not been re-ingested recently without opening any of them. The audience is every catalog user (per pillar P-01: `data-engineer-analyst`, `data-scientist-ml-engineer`, `viz-bi-engineer`, and the general `odd-platform-ui-end-user`); the problem it solves is the data-platform failure mode that `documentation/docs/data-discovery/metadata-stale.md` names directly — "acting on silently-stale data" (per metadata-stale.md:7 + SHB-001 hypothesis).

A user does not interact with the indicator directly — it is a read-only decoration computed entirely server-side. The single rule lives in one five-line `@Component`: an entity is stale when `lastIngestedAt != null && stalePeriod != null && now().isAfter(lastIngestedAt.plusDays(stalePeriod))` (per DataEntityStaleDetector.java:13-17, read directly). The threshold is one deployment-wide integer, `odd.data-entity-stale-period`, defaulting to `7` days (per application.yml:211, read directly). The backend imprints the resulting `is_stale` boolean onto four distinct response DTOs in the mapper tier (DataEntityMapperImpl.java:163,279,492,547) plus the lineage-node DTO (LineageMapper.java:143), and the OpenAPI spec declares `is_stale` as a **required** field on `DataEntityRef`, `DataEntity`, and `DataEntityDetails` (components.yaml:609,918,2010 per SHB-001) — so every list, detail, and lineage payload carries it. The shared UI primitive `MetadataStale.tsx` renders `<StaleIcon/>` wrapped in a hover tooltip when `isStale === true` and returns `null` otherwise (per F-146 chain hop-2 evidence + PLT-097's MetadataStale.tsx:20-31 quote).

The working parts a product owner would demo: the icon appears on a row the moment that entity's last ingestion crosses the 7-day line; hovering reveals the last-refresh timestamp; the same predicate drives every surface so the signal is consistent catalog-wide (the cross-surface uniformity is corroborated by the enriched `PopularStrip` sidecar, where `DataEntityList.tsx:41` renders `<MetadataStale isStale={item.isStale}/>` exactly as the Search row does). There is no filter "show me only stale entities", no per-source threshold, no "mark as acknowledged" — the indicator is purely informational.

The integration story: staleness is computed off the **Ingestion** pillar's `last_ingested_at` write (P-10 feeds P-01), shares its read surface with **Popular Entities** (F-001) and **Search Facets** (F-017) which render the same icon, and is conceptually adjacent to **Alerting** (P-07) — but distinct: metadata-stale.md:42 is explicit that "a stale icon is a discovery-time prompt, not a runtime alert." It is also a read-collaborative disclosure surface: like every other GET on the platform, `is_stale` is broadcast to every authenticated caller (anonymous under `auth.type=DISABLED`) with no owner scoping (per getPopular.md data_exposure — "operators marking entities as stale inadvertently broadcast that signal on the home page").

Edge cases a product owner would flag in a demo: a never-ingested manually-created entity shows NO icon (looks fresh, has no data at all); an operator whose Helm overlay strips the config key silently kills the signal platform-wide with the UI looking perfectly healthy; a multi-replica deployment with clock skew can flicker the icon at the threshold boundary; and any holder of an ingestion token can forge freshness by writing a current timestamp. Notably — and this is the largest change since this feature was seeded on 2026-05-26 — **all five of these caveats are now documented** in the live `metadata-stale.md` page (verified HTTP 200, 2026-06-03), including a `danger`-level hint on the silent-default footgun. The doc-side mitigation has shipped ahead of the code-side fix (PLT-097, still `draft`).

