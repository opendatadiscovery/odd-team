mitigations_unimplemented:
  - |-
    Add an origin-check at the service layer: reject
    EXTERNAL-origin writes with HTTP 400 OR fold the override flag onto
    the field/value row.
  - |-
    Add the missing `@ActivityLog(event = CUSTOM_METADATA_UPDATED)`
    annotation to `upsertMetadataFieldValue` so overrides ARE auditable
    even if accepted.
  - |-
    Document the EXTERNAL-vs-INTERNAL origin distinction on a
    custom-metadata operator-facing doc page (currently absent — no
    operator-facing documentation page exists for the custom-metadata
    feature itself; the data-discovery directory has metadata-stale.md
    for the staleness indicator but no page describing the custom-metadata
    write surface, the type enum, the per-entity metadata panel, the
    API endpoint, or the EXTERNAL/INTERNAL distinction).
  - |-
    Add a UI affordance — the Custom-metadata panel should display the
    field's origin badge (Ingested / Curated) and gate the edit
    affordance on origin (Curated → editable; Ingested → readonly with
    an "Override" admin-only override).
notes: |-
  NEW invariant captured in batch 2026-05-19L. The pattern is a
  data-quality-and-audit gap that compounds with two sibling findings:
    (a) silent-200-on-missing-pair (the operator can't even verify
        whether their override landed)
    (b) no-`@ActivityLog`-on-custom-metadata (the override has no
        audit trail)

  Cross-cutting connections:
    - Pairs with "silent-200-on-missing-pair-or-entity-on-upsert-family"
      — together they make EXTERNAL-metadata overrides operationally
      invisible to BOTH the operator (no response signal) and to any
      auditor (no activity-feed event)
    - Pairs with "Permission-bypass via Owner auto-create" — that
      captures the directory-growth side-door; this captures the
      value-overwrite side-door for source-of-truth columns
    - Cross-references "EXCLUDE_FROM_SEARCH is broadly applied but NOT
      to /popular" — both are data-quality-defence-in-depth gaps on
      shipped features

  Two DOC-NNN candidates:
    (a) Reject EXTERNAL overwrite at the service layer OR emit an
        audit event on accept
    (b) Document the EXTERNAL-vs-INTERNAL metadata distinction on a
        new custom-metadata operator-facing page
