- id: H-005
  hypothesis: "When a lineage subgraph contains a cycle (e.g. a transformer that consumes its own downstream artefact), requesting a large depth terminates quickly via cycle detection rather than materialising rows up to the full requested depth."
  derivation: "Negative-space seed — a recursive graph walk over real-world lineage will hit cycles; a user expects the canvas not to melt the database on a cyclic subgraph."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      There is no cycle detection. The CTE body is UNION ALL with no visited-set guard and no
      Postgres WITH...CYCLE clause; the ONLY termination is tDepth.lessThan(lineageDepth.getDepth())
      (ReactiveLineageRepositoryImpl.md:bugs[0], lines 163-175). For a cyclic subgraph at ?d=10000
      the recursion materialises intermediate rows up to depth 10000 in Postgres work_mem before
      the outer selectDistinct prunes the FINAL projection; the intermediate work is never pruned.
      The UI then renders cross-edges separately as CrossLink components, but that is cosmetic —
      the resource cost has already been paid in the database (LineageGraph.md:invariants on
      crossEdges + ReactiveLineageRepositoryImpl.md:bugs[0]).
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveLineageRepositoryImpl.md
        section: bugs_limitations_corner_cases[0]
        cite: "ReactiveLineageRepositoryImpl.java:163-175 (UNION ALL, no cycle guard); 177 (tDepth sole terminator)"
        note: "No visited-set, no WITH...CYCLE; only the depth bound stops recursion."
      - sidecar: odd-platform__java__service__service__LineageServiceImpl.md
        section: performance.resource_allocation
        cite: "LineageServiceImpl.java:102 (.collectList materialises full edge list in heap)"
        note: "Service collects the full result; heap pressure scales with cyclic edge count."
    operator_visible_failure: |
      A user opening lineage on an entity whose subgraph happens to contain a cycle, with a high
      depth (set via dropdown=20, URL edit, or click-through compounding), triggers a recursive-CTE
      walk whose intermediate row count grows with depth × cyclic-edge-count rather than terminating
      at the cycle. The observable effects: slow lineage tab, Postgres CPU/work_mem pressure, JVM
      heap pressure, and on a small instance a saturated database that degrades the whole platform.
      No cap and no cycle guard means the two failure modes (H-002 unbounded depth + this) multiply.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

