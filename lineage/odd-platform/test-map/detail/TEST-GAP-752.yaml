proposed_action: |-
  Add `DataSourceCrossPathSilentOverwriteTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `uiUpdateDataSource_writesAllFieldsViaMapStructApplyToPojo_pinsFullFormReplaceContract` — PUT `/api/datasources/{id}` with `{name, description, connectionUrl, active}`; query DB; assert ALL four fields are updated. PIN the UI full-form contract.
  2. `s2sIngestionForSameOddrn_overwritesNameAndDescriptionOnly_preservesUiConnectionUrlEdit_pinsCrossPathSilentOverwrite` — sequence: UI updates the datasource with connectionUrl='operator-set-value'; then S2S `POST /ingestion/datasources` with a different name+description (collector's view); assert DB row has the collector's name+description AND the operator's connectionUrl. PIN the asymmetry.
  3. `bothPathsEmitNoActivityEvent_assertsAuditLogPresenceAsymmetry` — register an ActivityEvent listener; perform a UI PUT and a S2S POST on the same datasource; assert ZERO ActivityEvent emissions across both paths. PIN the audit-log absence.
  4. `uiUpdateThenS2SIngestThenUiRead_operatorSeesCollectorOverwrittenFields_noWarningSurface` — full operator-cliff scenario: UI edit → collector restart simulation → operator re-reads via GET; assert the description is the collector's value, not the operator's; assert no warning header / no field-level "modified-by" metadata in the response.

  Pair with a follow-up backlog item: add a `last_modified_by_path` audit column to `data_source` (UI / S2S / NULL); emit Activity Events on both paths; surface a UI warning when an operator's edit is about to be silently overwritten on the next collector startup (the warning requires the collector's expected fields to be known — a deeper change).

  Cross-pair with DOC-NNN: surface the cross-path silent-overwrite class in `documentation/docs/features/management.md` (Datasources tab) — operators MUST know that a UI edit to `name` or `description` will be overwritten on the next collector restart.
