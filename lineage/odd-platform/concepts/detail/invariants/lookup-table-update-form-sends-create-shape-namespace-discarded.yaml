name: |-
  Lookup Table edit form submits CREATE shape on UPDATE — namespace_name silently discarded by Spring lenient binding (Category F DTO drift)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-03
description: |-
  NEW HIGH-severity Category F INVARIANT, batch ZL (2026-05-26) —
  the LookupTableForm component
  (`components/MasterData/LookupTableForm.tsx`) types its form data
  as `LookupTableFormData` (the CREATE shape, which REQUIRES
  `namespaceName` per the OpenAPI generated type at line 49).
  On EDIT submit (line 60-66), the same shape is submitted to
  `editLookupTable` — but the OpenAPI contract for UPDATE
  (`LookupTableUpdateFormData`, components.yaml:3853-3862) defines
  ONLY `name` + `description`. The `namespaceName` field is sent
  on the wire on every edit but silently discarded by the server
  (assuming Spring's default lenient JSON binding via Jackson with
  `FAIL_ON_UNKNOWN_PROPERTIES = false`).

  **Trace**:

      // LookupTableForm.tsx:49 — form types data as LookupTableFormData
      // (the CREATE shape with required namespaceName)
      const {handleSubmit, ...} = useForm<LookupTableFormData>({
        defaultValues: { name, description, namespaceName },
      });

      // LookupTableForm.tsx:60-66 — edit submit branch
      const onSubmit = (data: LookupTableFormData) => {
        const mutation = lookupTable
          ? editLookupTable({
              lookupTableUpdateFormData: data,  // ← wrong shape sent
              lookupTableId: lookupTable.id,
            })
          : createLookupTable({lookupTableFormData: data});
        mutation.unwrap().then(...);
      };

      // LookupTableForm.tsx:117-123 — UI hint: namespace disabled on edit
      <Controller
        control={control}
        name="namespaceName"
        render={({ field }) => (
          <Input {...field} disabled={!!lookupTable} />  // ← cosmetic only
        )}
      />

  The form-visual `disabled={!!lookupTable}` (line 120) HIDES the
  problem from the user — they cannot edit the namespace field in
  the UI. But the form state still carries `namespaceName` (it's
  set in defaultValues at line 44 from `lookupTable.namespace.name`),
  and the submit handler passes the ENTIRE form data — including
  namespaceName — to the editLookupTable mutation. The generated
  client serialises the request body as JSON; namespace_name ends
  up on the wire.

  **The live doc explicitly says namespace is NOT updatable** — per
  WebFetch of
  `https://docs.opendatadiscovery.org/features/master-data-management/lookup-tables`
  2026-05-26 status 200:

      "LOOKUP_TABLE_UPDATE — Renaming a lookup table or editing its
      description"

  (No mention of changing the namespace.) The OpenAPI schema confirms:
  `LookupTableUpdateFormData` (components.yaml:3853-3862) defines
  ONLY `name` + `description`.

  **The available-but-named-correctly column** is the form's own
  `namespaceName` field — it's there, it carries the right value,
  it's sent on the wire, but it has no destination on the server.
  The fix is to type the edit-form data separately as
  `LookupTableUpdateFormData` and rebuild the form's controller
  set accordingly.

  **Operator-visible consequences** (three patterns):

  (a) **Operator inspecting the network tab on edit submit sees
      `namespace_name` in the request body** — they may believe
      the field is being updated. The DB does NOT change; the
      namespace remains the original. This is undocumented
      silent-discard behaviour.

  (b) **A future Spring upgrade enabling strict JSON binding
      (`FAIL_ON_UNKNOWN_PROPERTIES = true`)** would flip the
      bug from silent-discard to all-edits-fail. The form would
      submit; the server would 400; the operator would see
      'edit failed' with no hint why. This is the upgrade-time
      bug class — code that depends on lenient defaults breaks
      catastrophically when the defaults change.

  (c) **A reverse-engineering client** parsing the OpenAPI spec
      and generating a strict-binding client (e.g., openapi-
      typescript with strict mode) would treat namespace_name
      as an INVALID field — the client may reject the request
      before it leaves the browser, OR the client may strip
      the field. Either is a divergence from the current
      odd-platform-ui generated client behaviour.

  **The fix surfaces** (maintainer-triage):

  1. **Type the edit-form data correctly** — use
     `LookupTableUpdateFormData` (CREATE-shape MINUS
     namespaceName) for the edit submit path. Requires
     splitting the form into two useForm calls (one per shape)
     OR using a discriminated union. ~30-50 lines of churn;
     closes the bug at the source.

  2. **Strip namespace_name in the submit handler** — quick
     fix:
       const updateData = {name: data.name, description: data.description};
       editLookupTable({lookupTableUpdateFormData: updateData, ...})
     ~5 lines; closes the bug but leaves the type-system loose.

  3. **Set FAIL_ON_UNKNOWN_PROPERTIES = true at the Spring
     layer** — Pro: surfaces all similar bugs catastrophically.
     Con: catastrophic — every existing client sending
     undocumented extras breaks. Out-of-UI-scope but worth
     considering at the platform level.

  vocabulary_status: codebase-anchored AND live-doc-confirmed
  (the doc page explicitly enumerates renaming + description-
  edit; does NOT mention namespace edit). The OpenAPI schema is
  the AUTHORITATIVE source for the UPDATE shape; the UI submits
  a wider shape. The bug is a UI bug, not a doc-vs-code drift.
