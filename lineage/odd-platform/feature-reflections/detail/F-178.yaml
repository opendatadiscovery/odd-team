### H-010 — a status flip from the header opens/closes the documented soft-delete retention window correctly

- id: H-010
- hypothesis: |-
    When an operator flips an entity to DELETED from the header, the documented 30-day
    soft-delete retention window begins from that moment (so the entity is recoverable for
    exactly 30 days, then hard-deleted by housekeeping).
- derivation: |-
    The header status selector calls PUT /api/dataentities/{id}/statuses (updateStatus.md);
    the Statuses doc promises a 30-day recovery window keyed on STATUS_UPDATED_AT.
- seed_source: pillar + cross-pillar + doc-claim
- validation:
    verdict: probe-needed
    actual_behavior: |-
      updateStatus.md records a HIGH-severity bug: `DataEntityMapperImpl.applyStatus` sets
      `pojo.setStatus(...)` BEFORE the `if (statusDto.getId() != pojo.getStatus())` check, so
      the condition is always false and `STATUS_UPDATED_AT` is NEVER bumped on a status
      transition. The housekeeping TTL query (`DataEntityHousekeepingJob.java:73`,
      `STATUS_UPDATED_AT <= now - 30d`) evaluates `NULL <= ...` ≈ false → DELETED entities are
      never hard-deleted. This is a WRITE-PATH bug owned by F-044's status lineage, NOT by this
      header feature — the header merely triggers the buggy write path. Whether the operator-
      observable consequence (entity recoverable forever vs the documented 30 days) actually
      manifests end-to-end is a runtime question (does any OTHER code path set STATUS_UPDATED_AT?
      does the auto-flip job behave differently?). Marking probe-needed rather than asserting,
      because the verdict is owned by F-044 and requires a running instance to confirm the
      header-triggered path leaves the column null.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: bugs_limitations_corner_cases
        cite: "DataEntityMapperImpl.java:242-253 + DataEntityHousekeepingJob.java:73-82"
        note: "applyStatus ordering inversion → STATUS_UPDATED_AT never set → 30-day TTL defeated"
    operator_visible_failure: |-
      If confirmed: a DELETED entity the operator expects to be purged after 30 days persists
      indefinitely (soft-deleted but never hard-deleted), and the documented 30-day recovery/
      purge promise is silently false. This is the F-044 write-side pin's blast radius surfacing
      through the header's status action.
    severity: HIGH
    confidence: MEDIUM
    probe_id: PENDING-F-178-1
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: "probe PENDING-F-178-1 (verdict owned by F-044 write-side pin)"

### H-011 — the seven header affordances are organised so an operator can find the action they want

- id: H-011
- hypothesis: |-
    When an operator scans the header, the affordances are organised (grouped, prioritised, or
    progressively disclosed) so they can quickly find the action they want without parsing
    eight independent semantics inline.
- derivation: |-
    Senior-PO UX seed (Rule 9 — "is it intuitive, convenient, consistent with the platform?").
    The F-178 density facet observes eight surfaces in one strip with no overflow menu.
- seed_source: ui-label + negative-space (senior-PO UX)
- validation:
    verdict: partial
    actual_behavior: |-
      The header lays out identity on the left (lg=7) and actions on the right (lg=5) — a
      coarse two-column grouping that IS some organisation. But within the action column the
      stale indicator, status badge/selector, Edit-group, and Share buttons render inline with
      no overflow menu, no categorisation, no priority ordering (DataEntityDetailsHeader.tsx:73-148,
      F-178 density facet). The gating lattice (permission × feature-flag × lifecycle) means the
      VISIBLE set varies per user/deployment, which partially self-limits density — but an
      operator with all permissions on a DataCollaboration deployment sees the full eight-surface
      strip with no progressive disclosure.
    evidence:
      - sidecar: "SOURCE DataEntityDetailsHeader.tsx:73-148"
        section: source-read
        cite: "DataEntityDetailsHeader.tsx:73-148"
        note: "two-column lg=7/lg=5 grouping; no overflow menu within the action column"
        source_read_for_validation: true
      - sidecar: "feature-flow F-178 facet"
        section: observed_vs_expected
        cite: "F-178.yaml density facet header_concentrates_seven_distinct_affordances_no_progressive_disclosure"
        note: "eight surfaces inline, no overflow / categorisation / priority ordering"
    operator_visible_failure: |-
      A fully-permissioned operator on a Slack-enabled deployment must visually parse up to eight
      independent affordances in one horizontal strip to find a target action. On a narrow viewport
      the `flexWrap='nowrap'` + `noWrap` heading risks truncation/crowding (device-consistency
      concern, unverified across viewports). Low harm; an intuitiveness/scalability caveat rather
      than a defect.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

