proposed_canonical: Decoupled-write pattern (accept-202 + queue + single-leader sender)
rationale: 'postMessageInSlack sidecar embodies an architecturally significant pattern:
  outbound integration to an unreliable external service is decoupled from the inbound
  HTTP via 202 Accepted + Postgres-advisory-lock-elected sender thread (DataCollaborationMessageSenderJob).
  Preserves Postgres-as-only-dependency posture. Single example in catalog today;
  surface for ADR-promotion if future features (outbound webhooks, email notifications)
  adopt the same shape.'
contributing_concepts:
- decoupled 202+queue+sender (postMessageInSlack implicit_adrs[3])
- Postgres advisory lock for single-sender (postMessageInSlack implicit_adrs[4])
- DataCollaborationMessageSenderJob single-leader election
suggested_add_to_docs: false
