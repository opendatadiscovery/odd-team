behaviour: |-
  **Multi-replica deployments without shared session store leave orphaned WebSessions on non-logout-handling pods.** The default Spring WebSession store is in-memory (no `@EnableSpringWebSession` bean, no Redis/Hazelcast wired per `OAuthSecurityConfiguration.java:1-269` ABSENCE). For multi-replica deployments without sticky sessions, the WebSession lives only on the pod that handled the original OAuth2 callback. If the logout request lands on a DIFFERENT pod (sticky-session misconfiguration), `exchange.getExchange().getSession()` resolves an empty session, `WebSession::invalidate` is a no-op on the empty session, AND the user appears logged out on the original pod but their session persists silently on others until natural TTL. A user clicks logout on pod A, the session on pod A is invalidated, but pods B and C still hold the session attribute map if the user's load balancer routing differed earlier in the session. Affects all 5 OIDC logout handlers identically.
