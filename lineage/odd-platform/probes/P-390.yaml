realism_caveats: |
  - LOCAL-ONLY (APPROACH.md §9 rule 12): docker-compose stack + SQL seed + a single
    timed job invocation + DB count — no cloud, no managed DB, no remote runner.
  - The probe measures a SINGLE-instance tick duration. The multi-instance race
    (a second replica acquiring the lock at minute 10 while the first is still
    committing past minute 9) is the downstream consequence IF tick_duration >= 540;
    a true 2-replica reproduction is a heavier follow-up and is intentionally out of
    scope here — this probe establishes whether the window is breached at all.
  - 5000 is the F-044 substrate's stated worst-case burst figure
    (drift_class scheduled_auto_flip_no_per_tick_batch_cap). If the local machine's
    Postgres is materially faster/slower than a production deployment, record the
    observed per-entity cascade write count (pg_stat_statements) alongside the
    duration so the result can be scaled — the per-entity fan-out is the portable
    quantity, not the absolute wall-clock on one laptop.
  - status_switch_time is seeded as elapsed (now - 1 min) so getPojosForStatusSwitch
    selects the full set immediately; this faithfully reproduces a backfill that
    DRAFT/DEPRECATED-marks a large set with switch-times in the recent past.
  - flipped_with_null_status_updated_at is captured as PASSIVE corroboration of the
    H-002 applyStatus bug (it should equal 5000); it is NOT the pass gate of P-390.
