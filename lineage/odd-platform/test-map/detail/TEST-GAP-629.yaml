proposed_action: |-
  Add `OwnerDeleteIdempotencyTest` with three test methods: (a) seed Owner; DELETE /api/owners/{id} TWICE; assert both calls return 204; (b) DELETE /api/owners/9999999 (non-existent id); assert 204; (c) seed Owner with cascade-blocking dependent rows; DELETE; assert 400 USR004; DELETE again; assert 400 USR004 (the cascade-block fires both times because the owner is NOT yet soft-deleted). All pin the current behaviour; future fix that introduces NotFound discrimination will break (b) at minimum.
