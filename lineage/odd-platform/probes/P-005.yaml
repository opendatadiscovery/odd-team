---
probe_id: P-005
feature_id: F-002
test_class: security
verified_against_commit: ede5d277
prompt_version: probe-runner/0.1.0
maintainer_curated: true
stack_profile: odd-minimal
expected_outcome: |
  Per LSN-017's batch-G context: SecurityConstants.SECURITY_RULES declares
  the term-add gate at `/api/dataentities/{id}/term` (SINGULAR) while OpenAPI
  exposes the real endpoint as `/api/dataentities/{id}/terms` (PLURAL). The
  AuthorizationCustomizer's path-matcher never matches the real path → falls
  through to .authenticated() → DATA_ENTITY_ADD_TERM is NEVER ENFORCED.

  Slice-2 already demonstrated DISABLED-mode bypass (P-002 — anonymous detail
  reads). P-005 demonstrates the same class of bug from a different angle:
  under AUTH_TYPE=DISABLED (the probe stack default), ANY anonymous caller can
  successfully POST a term-link to ANY data entity, even without holding
  DATA_ENTITY_ADD_TERM. That's the bug's user-observable consequence: term
  linking is uncontrolled.

  When the fix lands (SecurityConstants path string changed `/term` → `/terms`),
  AND if probes are run with a non-DISABLED auth mode under a caller lacking
  the permission, the response would flip 200 → 403. Slice-2's stack is
  DISABLED-only; this probe pins the unprotected behaviour at the path level.

  REFACTOR-217 + TEST-GAP-017 + REFACTOR-073 (DISABLED-bypass cluster) all
  gain empirical confirmation through this probe.
---

# P-005 — term path-mismatch + unenforced gate (REFACTOR-217 / TEST-GAP-017)

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (1005, '//probe-source-P-005/db', 'probe-source-P-005')
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, view_count,
         source_created_at, source_updated_at)
      VALUES (1005, '//probe-source-P-005/db/tables/p005_term_target', 'p005_term_target',
              1005, 1, 0, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # Create a namespace + term to link. Term creation uses the canonical
  # POST /api/terms; under DISABLED, this succeeds anonymously (a separate
  # finding — but expected for this probe context).
  - kind: rest
    method: POST
    path: /api/terms
    body:
      name: "p005_test_term"
      namespace_name: "p005_test_namespace"
      definition: "Probe-created term for P-005 path-mismatch verification"
    capture_as: created_term

  - kind: sql
    query: |
      SELECT id FROM term WHERE name = 'p005_test_term'
    capture_as: term_id

  # Baseline: no term-relations on data_entity 1005 yet.
  - kind: sql
    query: |
      SELECT COUNT(*) FROM data_entity_to_term WHERE data_entity_id = 1005
    capture_as: initial_term_count

act:
  # POST to the PLURAL endpoint (matches OpenAPI; the SecurityRule path is
  # singular and never matches; under DISABLED the request short-circuits
  # through .authenticated() ≈ .permitAll()).
  - kind: rest
    method: POST
    path: /api/dataentities/1005/terms
    body:
      term_id: "${term_id}"

observe:
  - kind: sql
    query: |
      SELECT COUNT(*) FROM data_entity_to_term
      WHERE data_entity_id = 1005 AND is_description_link = false
    capture_as: final_term_count

assert:
  # The bug-pinning assertion: term-link succeeded with no permission check.
  # When the path-mismatch is fixed AND a permission-less caller is tested,
  # this row would not appear; assertion flips to == 0.
  - "final_term_count - initial_term_count == 1"

cleanup:
  - kind: docker-compose-down
    destroy_volumes: true

cross_references:
  refactoring_scopes: [REFACTOR-217, REFACTOR-073]
  test_gaps: [TEST-GAP-017]
  doc_gaps: [DOC-GAP-001]
  related_concepts: ["Term Linkage", "Permission (Authorization)"]
  retrospectives: [LSN-017]

realism_caveats: |
  - Probe runs against AUTH_TYPE=DISABLED. The path-mismatch bug technically
    affects ALL auth modes (LOGIN_FORM/OAUTH2/LDAP would also fall through to
    .authenticated() under the broken rule), but proving that requires a
    probe stack with one of those auth modes wired up — deferred. Slice-3
    probe demonstrates the bug's user-observable consequence (uncontrolled
    term linking) under the simpler DISABLED stack.
  - A separate stronger probe in a future slice should: (a) bring up the
    stack with AUTH_TYPE=LOGIN_FORM, (b) authenticate as a user WITHOUT
    DATA_ENTITY_ADD_TERM, (c) POST the term-link, (d) assert 200 (pins the
    bug; flips to assert 403 when SecurityConstants path is fixed).
