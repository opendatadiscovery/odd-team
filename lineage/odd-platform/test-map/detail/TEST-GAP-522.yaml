proposed_action: |-
  Performance-boundary test (marker test — runs separately). (a) Pre-seed 10,000 owners with varying entity counts. (b) Authenticate user A; create search session S. (c) GET /api/search/S/facet/OWNERS?page=1&size=1000000. (d) Assert HTTP 200 (current contract — the request is accepted). (e) Measure response time and response body size; record as baseline. (f) Test comment 'LOCKS the unbounded-size contract as of 2026-05-19. When REFACTOR-NNN adds maximum: clamp, this test FLIPS to expect 400 or response-truncation at the clamp value.' Secondary tests: (g) POST with `size=-1`, `page=0`, `size=0` exercising edge-case boundary values — assert current behaviour. (h) Pair with DISABLED-mode anonymous variant to confirm the DoS-amp is reachable without authentication. Cross-pillar HIGH-impact because the facets endpoint is the platform's hottest read path AND combines with TEST-GAP-518 cross-owner enumeration.
