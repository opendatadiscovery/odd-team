- id: H-009
  hypothesis: "When an operator opens group lineage for a very large DEG (a wide connected component, e.g. a path-graph of thousands of members), the system returns the graph successfully rather than failing with a server error."
  derivation: "Operators expect large-but-valid groups to render; a 5xx on a structurally-valid DEG is an availability failure."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The connected-component assembly getRelationsForEntities (LineageServiceImpl.java:218-233) is tail-recursive
      in shape but Java has no TCO — each BFS-frontier expansion adds a JVM stack frame. For a wide connected
      component (path-graph diameter ~5000+), recursion approaches the default JVM stack limit (~512KB) and a
      StackOverflowError surfaces as a generic 500 with no graceful degradation, no depth cap, no iterative
      rewrite. The DEG has no MAX-MEMBERS gate. Whether a realistic production DEG reaches the threshold, and the
      exact frame budget, requires running the system against a seeded wide-component DEG — a STATIC read cannot
      confirm the failure point.
    evidence:
      - sidecar: odd-platform__java__service__service__LineageServiceImpl.md
        section: bugs_limitations_corner_cases / performance.resource_allocation
        cite: "LineageServiceImpl.java:218-233"
        note: "Recursion depth = component diameter; unbounded by service-layer guard."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityGroupsLineage.md
        section: downstream_side_effects / performance.scaling_characteristics
        cite: "LineageServiceImpl.java:218-233 + no LIMIT / no pagination"
        note: "No pagination, no rate limit; component diameter drives stack depth."
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-016-1
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

