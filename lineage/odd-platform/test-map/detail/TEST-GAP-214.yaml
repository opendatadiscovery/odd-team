behaviour: |-
  ShedLock multi-instance race: two instances boot simultaneously, both attempt to run housekeeping at minute 0 — only one acquires the lock; the other no-ops (HousekeepingJobManager.java:26 `@SchedulerLock(name="housekeepingJob", lockAtLeastFor="14m", lockAtMostFor="14m")`). The 14-minute upper bound is dangerously close to the 15-minute schedule; a job running 14m 1s releases the lock prematurely. No multi-process test verifies the single-leader invariant.

  STRENGTHENED batch ZK — the SchedulingConfiguration sidecar adds the foundation-tier confirmation: the `.usingDbTime()` call at SchedulingConfiguration.java:22 is the load-bearing precondition. Without it, JVM-side timestamps would cause two replicas with skewed clocks to write different lock_until values and the lock semantics would be vulnerable to clock drift. The multi-instance race test should ALSO verify the clock-arbitration is PG-anchored (cross-reference TEST-GAP-1028).
