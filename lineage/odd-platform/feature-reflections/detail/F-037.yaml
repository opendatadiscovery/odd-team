  hypothesis: "When a non-admin / read-only authenticated user opens the Relationships page, they see only relationships they are entitled to — relationships within their own tenant / namespace / owned data sources."
  derivation: "Negative-space: an operator deploying ODD with the platform's RBAC story (enable-security/authorization) expects view scoping consistent with the rest of the catalog."
  seed_source: negative-space
  validation:
    verdict: contradicted
