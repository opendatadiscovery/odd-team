contributors:
  - |-
    TagServiceImpl batch VAL-LSN-019 (PRIMARY SOURCE — service-tier
    cross-method enumeration):
    concepts.invariants[Methods that issue MULTI-step reads-then-writes
    WITHOUT @ReactiveTransactional: bulkCreate (single-step write,
    inherited TX), getOrCreateTagsByName (read listByNames + write
    bulkCreate), getOrInjectTagByName (read listByNames + upsert
    ingestData), deleteRelationsWithTerm (read listByTerm + write
    deleteTermRelations). These are TOCTOU surfaces — a concurrent
    caller can change the read-side state between the read and the
    write. The ingestData path silences the race via ON CONFLICT ...
    DO UPDATE; the bulkCreate path translates the race to
    UniqueConstraintException; the deleteRelationsWithTerm path can
    silently miss a concurrent term-tag-add] +
    implicit_adrs[TX scope is the multi-statement orchestration, not
    the call-site — four methods carry @ReactiveTransactional because
    they issue multi-statement DB sequences; the others delegate
    single-step to the repository] +
    stress_findings.S-B-4 (getOrCreateTagsByName vs getOrInjectTagByName —
    same shape, different race semantics)

