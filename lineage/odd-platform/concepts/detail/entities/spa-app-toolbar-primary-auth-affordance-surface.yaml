evidence:
  - AppToolbar.md:understanding (the persistent top-of-viewport fixed-position bar rendered by the SPA shell on every authenticated route)
  - AppToolbar.md:concepts.entities (AssociatedOwner, Identity, Owner, Language preference)
  - AppToolbar.md:concepts.operations (the 7 operations — render identifier, open menu, logout, switch language, render tabs, render info menu, scroll-elevation effect)
