      collectList, and on a non-empty set invokes changeStatusForDataEntities(
      pojos, new DataEntityStatus(DELETED)). The flip to DELETED on elapsed
      switch-time is exactly what the hypothesis predicts; worst-case latency is
      one tick (≤10 min) plus job runtime. COVERAGE: the switch-time PERSISTS
      correctly on a manual DEPRECATED PUT (DataEntityStatusChangeTest, lines
