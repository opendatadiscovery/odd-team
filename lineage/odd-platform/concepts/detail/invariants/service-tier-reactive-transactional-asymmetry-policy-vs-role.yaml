notes: |
  Cross-batch architectural-hygiene observation. The asymmetry is between two
  sibling RBAC services in the same package; no third service is involved.
  The Owner side (OwnerServiceImpl batch P) ALSO carries @ReactiveTransactional
  on all three mutating methods, mirroring Role; the Policy side is the SINGLE
  outlier across the RBAC + Owner mutation surface.

  Recommended cleanup: add @ReactiveTransactional to PolicyServiceImpl.create
  (line 62), PolicyServiceImpl.update (line 71), and PolicyServiceImpl.delete
  (line 83). One-line each. The annotation is the platform s wrapper at
  org.opendatadiscovery.oddplatform.annotation.ReactiveTransactional which
  meta-binds to @Transactional("reactiveTransactionManager"). The fix
  strictly improves correctness (scopes read+write to one R2DBC connection);
  does NOT prevent lost-update without row-version tracking; combine with
  SELECT FOR UPDATE on the existence check to fully close the race.
