proposed_action: |-
  Add `DataQualityControllerSLAEndpointContractTest` extending `@WebFluxTest(DataQualityController.class)` (or full `@SpringBootTest` for end-to-end content-negotiation). Three pinning methods:
  (a) `getSLA_returnsImagePng_withYellowBody_whenDatasetHasZeroTests`: seed a dataset with 0 DQ tests; WebTestClient GET `/api/datasets/{id}/sla`; assert Content-Type starts with `image/png`; assert response body bytes equal the bytes of classpath resource `sla/sla_yellow.png` (the zero-tests default per SLACalculator.java:81-83); assert content-length > 0.
  (b) `getSLAReport_returnsApplicationJson_withDataSetSLAReportSchema`: WebTestClient GET `/api/datasets/{id}/sla_report`; assert Content-Type is `application/json`; assert body deserialises into `DataSetSLAReport` carrying `slaColour`, `severityWeights`, `slaRef`.
  (c) `getSLA_withAcceptApplicationJson_returnsNotAcceptable_or406`: WebTestClient GET `/api/datasets/{id}/sla` with header `Accept: application/json`; assert the response is 406 (per OpenAPI declaring image/png only) — pins the content-negotiation behaviour so a regression that adds JSON support without retiring the PNG path is caught.
  Add a `// REGRESSION-PIN — Documentation drift LSN: the live sla-statuses.md page conflates /sla (PNG) and /sla_report (JSON); the code returns PNG at /sla. This test pins the current contract. If the maintainer decides to MOVE the JSON to /sla (deprecating the PNG), this test breaks and the maintainer must coordinate the doc fix.` comment block. Pair with DOC-GAP-NNN that fixes the doc-side conflation.
