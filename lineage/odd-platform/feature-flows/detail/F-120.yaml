notes_for_maintainer: |-
  Probe-needed (local-only docker-compose stack): empirically verify what
  happens at request 21 to a single replica — does Spring R2DBC backpressure
  via Mono queueing, or does it fail with `R2dbcTimeoutException` after
  `maxAcquireTime`? Sidecar marks `PROBE-NEEDED`.

  Follow-up scope candidates:
  - DOC-NNN: publish `spring.r2dbc.pool.max-size` on the operator page with
    the framework-default value stated.
  - PERF-NNN: add R2DBC Micrometer binder so `/actuator/prometheus` exposes
    pool utilisation.
  - REFACTOR-NNN: gate `customConnectionPool` with
    `@ConditionalOnProperty("spring.custom-datasource.url")` so deployments
    without Lookup Tables don't pay the double-pool cost.
