proposed_action: |-
  Add `TermDefinition.test.tsx` at `odd-platform-ui/src/components/Terms/TermDetails/Overview/TermDefinition/`. Three test methods:
  1. `termDefinition_withScriptPayload_rendersAsRawHtmlNotEscaped` — render a `<TermDefinition>` whose definition carries a raw `<script>` payload and assert the script tag REACHED THE DOM. This pins the bug. (Literal payload REDACTED pre-disclosure under GHSA-mf43-2636-9289 / CTRIB-020; restore from the held record at 0.28.0.)
  2. `termDefinition_withImageOnError_rendersHtmlAttribute` — render a `<TermDefinition>` with a raw `<img onerror>` payload and inspect the DOM `<img>` to assert how the attribute was handled (per P-009 batch-G probe: `onerror=` is filtered by React's setProperty path but the `<img>` tag itself reaches the DOM). (Literal payload REDACTED pre-disclosure.)
  3. `termDefinition_withIframePayload_rendersAsRawIframe` — render a `<TermDefinition>` with a raw `<iframe>` `javascript:`-src payload and assert via `container.querySelector('iframe')` is NOT null. (Literal payload REDACTED pre-disclosure.)

  Cross-pair with a documentation fix: add an admonition on `documentation/docs/features/data-glossary/business-glossary.md` stating `Term definitions are stored as raw Markdown without HTML sanitisation; only trusted operators should be granted TERM_UPDATE.` and reference the relevant LSN. Pair with a backlog item proposing the sanitisation fix at `Markdown.tsx:113-124` (add `rehypePlugins={[[rehypeSanitize, schema]]}` to MDEditor.Markdown). When the fix lands, this regression-pin updates to assert the SAFE behaviour.
