security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNKNOWN
    detail: |-
      The enum is data, not a gate; it has no authorization surface of its own.
      Whoever can read DQ data (catalog-wide via the dashboard or per-dataset
      via the test report) sees the full status distribution.
  owner_scoping:
    verdict: N/A
    detail: |-
      The enum is a categorical label, not a scoped entity.
  strengths:
    - |-
      The wire-side schema (components.yaml) is the single source of truth — both
      backend and frontend code-generate from the same enum; the value set cannot
      drift across services.
  weaknesses:
    - |-
      The frontend palette assumes all six enum values are present (interfaces.ts:55
      `Record<DataEntityRunStatus, ItemColors>`); a backend that ships a seventh
      value before the frontend is regenerated will crash the dashboard at render —
      a deployment-coupling brittleness. Severity MEDIUM if an operator rolls out
      services with mismatched generated-sources versions.
    - |-
      Wire-enum-vs-DB-enum asymmetry confirmed at the backend mapper layer
      (DataEntityRunMapper.java:13-14): the runs-history endpoint
      (GET /api/dataentities/{id}/runs) returns HTTP 500 for any result set
      containing a RUNNING row — exactly while a test is in flight. Captured
      as invariant `wire-enum-running-asymmetry-data-entity-run-status` THIS
      BATCH. Severity HIGH — page UNAVAILABLE during active monitoring.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityContent.md
    - TestCategoryResults.md
    - DataEntityRunController.md
    - DataQualityRunsController.md
  evidence:
    - DataQualityContent.md:bugs_limitations_corner_cases.[0] (line-48 TypeError on out-of-enum status)
    - DataEntityRunController.md:bugs_limitations_corner_cases.[1] HIGH (mapper 500 on RUNNING row)
performance_aggregate:
