amplification_factor: 1
amplification_note: |-
  1 per AppToolbar mount. TanStack Query default staleTime=0 triggers a refetch
  on every component remount BUT AppInfoMenu's keepMounted (line 90) means the
  widget never unmounts for the SPA tab's lifetime — the cache stays hot,
  refetches don't fire, and YAML edits remain invisible until full page reload.
observed_vs_expected:
  facets:
    - facet_id: reverse_tabnabbing_target_blank_without_rel_noopener_noreferrer
      drift_class: ui_security_default_missing_against_operator_configured_external_url
      severity: MEDIUM
      observed: |-
        AppInfoMenu.tsx:41, 61, 95, 103, 112 — FIVE link sites render
        `<Link target='_blank'>` with NO rel='noopener noreferrer'. The
        operator-configured URLs (line 61, broadest attack surface) AND the
        four hardcoded targets (lines 41, 95, 103, 112 — docs.opendatadiscovery.org,
        slack, github.com/opendatadiscovery/odd-platform, producthunt.com)
        all leak window.opener to the destination. Batch ZJ widens the
        original facet from 1 site (operator-configured) to 5 sites.
      operator_visible_consequence: |-
        Bounded by trust of who controls odd.links config; amplified if operator
        config is editable by a less-trusted role. The 4 hardcoded targets are
        first-party-trusted today; a future XSS on any of the 4 destination
        domains would have lateral movement into the ODD Platform tab via
        window.opener.
    - facet_id: url_scheme_not_validated_javascript_data_uris_passthrough
      drift_class: input_passthrough_no_schema_allowlist
      severity: MEDIUM
      observed: |-
        AdditionalLinkProperties.java:8 `record Link(String title, String url)`
        has NO @URL constraint, no @Pattern. React 17+ neutralises javascript:
        in <a href> but data:text/html,... still renders in some browsers.
    - facet_id: config_properties_boot_time_only_runtime_yaml_change_silent_until_restart
      drift_class: boot_immutable_drift_no_actuator_refresh_path
      severity: LOW
      observed: |-
        AdditionalLinkProperties bound once at boot; /actuator/refresh not in
        default actuator exposure per application.yml:228-231.
    - facet_id: disabled_mode_anonymous_links_disclosure
      drift_class: disabled_mode_bypass
      severity: LOW
      observed: |-
        Under DISABLED the configured link list (potentially containing
        internal-network URLs — runbooks, Grafana, wikis) is anonymously
        reachable.
    - facet_id: app_info_menu_keyboard_inaccessible_aria_haspopup_claims_support_no_handler_wired
      drift_class: wcag_2_1_sc_2_1_1_keyboard_accessibility_violation_aria_lies
      severity: MEDIUM
      observed: |-
        AppInfoMenu.tsx:78-82 — the icon button declares aria-haspopup='true'
        (line 80) and aria-controls={menuId} (line 79) — claiming keyboard
        support — but wires ONLY onMouseEnter (line 81). NO onClick, NO
        onKeyDown, NO onFocus handler. AT users (screen-reader + keyboard
        navigation) and touch-device users cannot open the menu.
      expected: |-
        Every menu activation must be keyboard-reachable per WCAG 2.1 SC 2.1.1.
        A button claiming aria-haspopup must respond to Enter/Space.
      operator_visible_consequence: |-
        AT users cannot reach the version display, the documentation link,
        or the operator-configured links. Touch users cannot hover. The
        menu is exclusively mouse-and-keyboard-not-allowed.
    - facet_id: appinfomenu_keepmounted_combined_with_no_staletime_renders_yaml_edits_invisible_until_reload
      drift_class: react_query_keepmounted_combined_with_no_staletime_silent_staleness_amplifier
      severity: LOW
      observed: |-
        AppInfoMenu.tsx:90 — `keepMounted` on the MUI Menu. The widget never
        unmounts after first hover. useAppInfo / useAppLinks
        (lib/hooks/api/appInfo.ts:4-17) set NO staleTime, NO refetchInterval.
        TanStack Query's staleTime=0 default means refetch-on-mount — but
        keepMounted means no remount. Combined: the FIRST mount populates
        the link list + version; subsequent operator edits to odd.links in
        YAML + backend restart remain invisible to users in long-lived SPA
        tabs until they do a full page reload.
      expected: |-
        Either staleTime: Infinity (correct given both endpoints are
        boot-immutable at the backend) + an operator-visible "this list is
        bound at boot" caveat, OR a refetchInterval that picks up config
        edits within a window. Or remove keepMounted.
      operator_visible_consequence: |-
        STRENGTHENS the existing `config_properties_boot_time_only` facet.
        Operators editing odd.links + restarting the backend see no UI
        update for users in already-open tabs.
    - facet_id: linkurl_as_react_reconciliation_key_duplicate_url_warning_risk
      drift_class: react_key_collision_on_duplicate_url
      severity: LOW
      observed: |-
        AppInfoMenu.tsx:61 — `key={link.url}` in the operator-link map.
        If the operator configures two odd.links entries with the same URL
        but different titles (e.g. "Runbook" + "Runbook (old)" pointing at
        the same wiki), React emits a duplicate-key console warning AND may
        de-duplicate the render in some reconciliation paths.
      expected: |-
        Either index as key (`{(link, idx) => ...key={idx}...}`) or a
        synthetic id stamped at the backend.
      operator_visible_consequence: |-
        Operator sees one of their two entries silently dropped in some
        cases; a console warning at all times for duplicate URLs.
    - facet_id: appinfomenu_4_hardcoded_english_labels_bypass_i18n_localisation_gap
      drift_class: ui_hardcoded_english_labels_bypass_i18n_layer
      severity: LOW
      observed: |-
        AppInfoMenu.tsx:20-23, 48, 100, 108, 117 — labels 'Documentation',
        'Slack', 'ODD Platform version', 'Leave a feedback' are hardcoded
        English strings, bypassing the `useTranslation()` infrastructure
        already imported in AppToolbar.tsx:19. A non-English locale user
        sees these labels in English amongst otherwise-translated menu items.
      expected: |-
        Each label uses t('...') with matching keys in en.json + every
        non-English locale.
      operator_visible_consequence: |-
        Cross-link F-043. A Ukrainian-locale user sees four English labels
        ('Documentation' / 'Slack' / 'ODD Platform version' / 'Leave a
        feedback') in the otherwise-localised App Info menu. The
        operator-configured link.title values DO render verbatim — operators
        CAN localise their own additions but the platform's hardcoded
        surfaces cannot be localised.
