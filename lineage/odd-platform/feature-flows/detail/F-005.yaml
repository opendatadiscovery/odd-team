  - facet: recursive-CTE cycle/diamond amplification (REFACTOR-202 — STATIC primary-source)
    observed: CTE body is `UNION ALL` (line 168) without visited-set guard or Postgres `WITH ... CYCLE` clause. Outer `selectDistinct`
      (line 127) deduplicates the FINAL result but does NOT prune intermediate CTE rows. For a depth-N diamond pattern with
      branching factor B, intermediate row count grows as O(B^N) before the outer projection prunes duplicates. For a true
      cycle (A→B→A), row growth is bounded ONLY by the depth ceiling — which itself has no repository-layer upper bound (line
      174 consumes the raw int).
    expected: Bounded cost — either visited-set guard, Postgres WITH CYCLE, or a defensive depth cap (e.g. Math.min(depth,
