name: Dashboard 'Title' filter binds to OWNERSHIP.TITLE_ID — not dataset name (LSN-020 class)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The bare-labelled `t('Title')` filter on the Data Quality Dashboard
  (TitleFilter.tsx:29) binds, at the SQL layer in
  `ReactiveDataQualityRunsRepositoryImpl.java:301, 309`, to
  `OWNERSHIP.TITLE_ID` — the ownership *title/role* (e.g. 'Data Steward',
  'Owner') — NOT to any dataset name or title field. NEW invariant, batch
  ZC (2026-05-22).

  An operator reading the bare label 'Title' will reasonably expect to
  filter the dashboard by a dataset's title/name and instead narrows it
  by ownership role: selecting 'Title=Data Steward' narrows the rings
  to entities where SOME owner holds the 'Data Steward' role — a
  completely different and far wider slice than 'datasets named X'.

  This is the LSN-020 input-name-vs-implementation drift class — the
  same shape as the Activity Feed's `userIds` → `OWNER_ID` finding that
  produced the LSN. The Title filter is the second clear instance on
  the platform: a generically-named input that operates on a different
  entity than its name promises, with no UI qualifier.

  Composition with the Owner filter compounds the surprise: when BOTH
  Owner and Title are selected, the SQL puts them in ONE OWNERSHIP join
  joined by AND (ReactiveDataQualityRunsRepositoryImpl.java:297-302) —
  the result is entities where THAT owner holds THAT title, not entities
  matching that owner OR that title, and not even entities where the
  owner exists and (separately) someone has that title. An operator
  expecting "owned by Alice AND tagged with title X" may get an empty
  dashboard if Alice's ownership row has a different title.

  Partial mitigation: the Title autocomplete is populated by
  `useGetTitleList` (TitleFilter.tsx:4), which lists ownership titles —
  so a careful operator who opens the dropdown sees role names and can
  infer the meaning. The bare label alone (Title) is misleading; the
  dropdown content is honest. The mitigation depends on the operator
  bothering to open the dropdown rather than assuming the filter is
  obvious.

  The live https://docs.opendatadiscovery.org/features/data-quality/dashboard
  page (WebFetched 2026-05-22 status 200) lists 'Title' as one of the
  five filter dimensions but explicitly does NOT explain what it filters
  by. The doc offers no correction; the operator must inspect the
  dropdown content to discover the actual semantic.

  Suggested fix: rename the UI label to 'Ownership Title' or 'Ownership
  Role' (the i18n key change is a one-line edit in `TitleFilter.tsx:29`),
  and document the binding on the dashboard.md doc page. The Owner +
  Title AND-join semantic also deserves an explicit caveat on the same
  page.
