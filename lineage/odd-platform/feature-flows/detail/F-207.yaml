      HIDE-NOT-DISABLE contract. The `hasAccessTo` predicate is supplied
      by the `usePermissions` hook (lib/hooks) which reads from the
      surrounding PermissionProvider context.
  - node_id: "odd-platform ts components/shared/contexts/Permission ui-shell-widget:WithPermissionsProvider"
    role: resource-scoped-context-provider
    note: |-
      WithPermissionsProvider.tsx:12-51 — a 51-line wrapper that mounts
      PermissionProvider with two permission lists
      (`allowedPermissions: Permission[]`, `resourcePermissions: Permission[]`).
      Three branches: render-prop (`render`), Component-prop (`Component`),
      or children. The context dictates what the inner `usePermissions`
      hook resolves to. The provider is the CONTEXT scope — each Management
      page (Policies, Roles, Owners, Associations) wraps with its own
      provider naming the resource-relevant permissions.
