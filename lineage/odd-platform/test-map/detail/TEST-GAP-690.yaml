evidence:
  - "RoleServiceImpl.md says (bugs_limitations_corner_cases.[1]): 'DRIFT-FACET-B (P-09:F-001 RBAC — case-sensitivity mismatch across create / update / delete name guards). The create path (lines 49-61) has no case-check (so administrator / Administrator / ADMINISTRATOR are all distinct strings; all three create attempts succeed if not already present in the DB). The update path (line 68) uses case-SENSITIVE !role.getName().equals(UserProviderRole.ADMIN.getValue()) — only the literal Administrator is rename-blocked; a role named administrator is rename-able. The updateRoleName path (lines 104-106) uses case-SENSITIVE role.getName().equals(UserProviderRole.USER.getValue()) — only the literal User has the rename block. The delete path (lines 81-82) uses case-INSENSITIVE r.getValue().equalsIgnoreCase(role.getName()) — BOTH Administrator and User AND their case-variants are protected.' severity: MEDIUM"
  - "RoleServiceImpl.md says (tests_coverage_semantic.uncovered_behaviours.[14]): 'delete() on a role named ''administrator'' (lowercase, created via the create-path gap) raises BadUserRequestException — case-INSENSITIVE check at line 82 matches. Pin the case-asymmetry across create / update / delete.'"
