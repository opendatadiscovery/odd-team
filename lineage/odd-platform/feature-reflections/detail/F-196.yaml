    verdict: contradicted
    actual_behavior: |
      The `User` filter is the LSN-020 surface, and it is WORSE on the per-entity tab than
      on the global feed. `Filters.tsx:58` renders `<MultipleFilter filterName='userIds'
      name={t('User')} />`; the MultipleFilter component (per F-021 batch-ZL primary-source
      finding at MultipleFilter.tsx:32-34) dispatches `fetchOwnersList` for any
      `filterName !== 'tagIds'` — the dropdown lists OWNERS, not users. The selected owner
      id is stored in `queryParams.userIds` and threaded to
      `getDataEntityActivity(... userIds ...)`, which the shared
      `ReactiveActivityRepositoryImpl.getCommonConditions` binds as
      `USER_OWNER_MAPPING.OWNER_ID.in(userIds)` (per F-021 reflection H-001 +
      ReactiveActivityRepositoryImpl.java:272-275). The filter therefore narrows to "events
      on THIS entity by the selected user's owner-mapping" — an entity-ownership axis, not
      an actor axis. The actor column `activity.created_by` is JOINed (LEFT JOIN
      USER_OWNER_MAPPING ON OIDC_USERNAME = ACTIVITY.CREATED_BY) and SELECTed for display
      but NEVER filtered. The live doc (WebFetched 2026-06-03) now confirms the actual
