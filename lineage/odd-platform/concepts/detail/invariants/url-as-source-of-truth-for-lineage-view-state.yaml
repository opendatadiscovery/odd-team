mitigations_unimplemented:
- 'Add UI-side clamp on `?d=` URL param to e.g. min(d, MAX_DEPTH=20) matching the
  dropdown options — would close the URL-side REFACTOR-202 amplification'
- 'Document the URL-shareability contract on /features/data-lineage — operators
  copying URLs should understand what state is preserved'
- 'Surface a warning when a URL with many `?exd[]` / `?exu[]` IDs is shared —
  cross-owner enumeration footprint via URL leakage is a defence-in-depth concern'
notes: |-
  New invariant captured in batch 2026-05-19J. The URL-as-state pattern is
  intentional and load-bearing for the share-a-view UX. The trade-off is the
  security/UX coupling: URL shareability + cross-owner readable backend = URLs
  carry enumeration evidence.

  A higher-leverage future change would be to allow operators to opt INTO URL
  shareability via a "Share this view" button that exports the URL, rather than
  passively encoding state into every URL the browser address bar shows. Today
  the browser address bar IS the share affordance — for some workflows desirable,
  for others a leak surface.
