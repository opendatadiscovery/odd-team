proposed_action: |-
  Testcontainers integration test (asymmetry pin). (a) Authenticate as a privileged user. (b) Create a dataset (via ingestion) with one column. (c) Call `PUT /api/datasetfields/{id}/description` with a new description. (d) Query the activity table: `SELECT COUNT(*) FROM activity WHERE event_type = 'DATASET_FIELD_DESCRIPTION_UPDATED' AND data_entity_id = ?`. Assert 0. (e) Call `PUT /api/datasetfields/{id}/internal_name` with a new internal name. (f) Query: `SELECT COUNT(*) FROM activity WHERE event_type = 'DATASET_FIELD_INTERNAL_NAME_UPDATED' AND data_entity_id = ?`. Assert 1. (g) Pin the asymmetry with a comment: `// REGRESSION-PIN — DatasetFieldServiceImpl.updateDescription lacks @ActivityLog while updateInternalName + updateDatasetFieldTags carry it. REFACTOR-NNN will add the annotation; this test will then flip to assert 1 activity row for description edits as well.` (h) Also pin the doc-side claim: the live activity-feed doc lists DATASET_FIELD_DESCRIPTION_UPDATED as an event type — at present this is a DOC-vs-CODE drift.
