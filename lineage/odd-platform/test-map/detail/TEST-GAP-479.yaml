proposed_action: |-
  Testcontainers integration test. (a) Create term `finance:Customer`. (b) Create data entity with description `"Refer to [[finance:Customer]]"`. (c) Attempt to RENAME the term to `finance:Client` — assert HTTP 400 with body containing 'Can't update term, which was mentioned in description'. (d) Attempt to edit ONLY the definition (no name/namespace change) — assert HTTP 200. (e) Attempt to DELETE the term — assert HTTP 400. (f) Drop the description's `[[finance:Customer]]` text; rename should now succeed. LOCKS the rename/delete guard contract AND the definition-edit allowance.
