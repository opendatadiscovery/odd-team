proposed_action: |-
  Add `ReferenceDataStoredXssBackendContractTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `addDataToLookupTable_rowValueWithScriptTag_persistsVerbatim` — POST `/api/referencedata/table/{id}/data` with `items: [{ value: "<script>alert('xss')</script>", ... }]`; assert HTTP 200; GET `/api/referencedata/table/{id}/data`; assert the row's value byte-equals the payload.
  2. `addDataToLookupTable_rowValueWithImgOnerror_persistsVerbatim` — sister test on a different XSS payload class.
  3. `createLookupTable_tableNameWithScriptTag_persistsAfterBuildTableNameLossyNormalization` — POST `/api/referencedata/table` with `name: "<script>alert(1)</script>"`; assert the resulting physical table name is the lowercased + underscore-replaced version of the script tag (the buildTableName function applies, see TEST-GAP-734); assert the CATALOG-side name (in the `lookup_tables` row) stores the verbatim `<script>alert(1)</script>` string. PIN both layers of the contract.
  4. `addColumnsToLookupTable_columnNameWithScriptTag_persistsVerbatim` — POST `/api/referencedata/table/{id}/columns` with `items: [{ name: "<script>...", description: "..." }]`; assert the column-name is stored verbatim in the column-metadata catalog (the schema view renders this name).
  5. `getReferenceDataSearchResults_returnsLookupTablesWithVerbatimNames_pinsCrossNamespaceVisibility` — pin the read-tier exposure: any authenticated user can search lookup tables across all namespaces and receive verbatim XSS payloads in the search results.

  Add a `// CONTRACT PIN — F-004 family P-03 Master-Data-Management sibling: lookup table row values, column names, table names are stored verbatim. The Lookup Tables UI does NOT use the Markdown.tsx wrapper (these are plain-text fields rendered via table-grid components — different defence-in-depth from the entity description surface). A REFACTOR adding LookupCharValidator HTML sanitization will flip these tests to assert sanitiser output. The dynamic-verification probe P-009 should be extended to verify the table-grid render path independently.` comment block.

  Pair with: (a) extend P-009 dynamic-verification to cover the Lookup Tables Master Data tab render surface; (b) DOC-NNN — disclose verbatim-storage contract on the Lookup Tables doc page.
