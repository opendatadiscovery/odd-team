- id: H-002
  hypothesis: "When an operator is granted LOOKUP_TABLE_UPDATE via a Policy intended to scope them to their own team's tables, they can edit ONLY those tables — not lookup tables owned by other teams."
  derivation: "The three-surface RBAC split (per the live doc + controller implicit_adrs[2]) and the platform's per-entity scoping precedent (TERM resolver, DATA_ENTITY resolver) promise per-resource governance; a feature sold as 'multi-tenant-safe reference data' would scope a grant to the table it names."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      All 9 LOOKUP_TABLE_* SecurityRule entries use the NO_CONTEXT resolver (SecurityConstants.java:114, 326-354)
      — the resolver that does NOT pass the lookup_table_id in the URL to a permission-scope extractor. Contrast
      with TERM (TERM resolver, lines 174-193) and DATA_ENTITY (DATA_ENTITY resolver, lines 194-227), both of
      which scope the grant to the specific resource's owners. The consequence: a Policy granting LOOKUP_TABLE_UPDATE
      permits editing ANY lookup table in any namespace, regardless of how the Policy's ODDRN pattern is written.
      The table-id in the URL is decorative for authorization purposes.
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: security.authorization_assertions + known_security_gaps[2]
        cite: "SecurityConstants.java:114,326-354 (NO_CONTEXT) vs 174-193 (TERM) vs 194-227 (DATA_ENTITY)"
        note: "9 LOOKUP_TABLE_* rules all NO_CONTEXT; sibling permission families are entity-scoped."
    operator_visible_failure: |
      An operator who sets up a Policy intending "this role can edit the Marketing team's reference tables"
      grants edit (and, with the _DELETE permission, delete) over EVERY lookup table in the platform. In a
      multi-tenant or multi-team deployment this is a silent privilege escalation: the operator believes they
      configured least-privilege governance and actually configured platform-wide write access. There is no
      error, no warning, and no UI signal — the misconception only surfaces when someone edits a table they
      "shouldn't be able to." The DELETE variant additionally enables cross-team data destruction (each delete
      DROPs the physical Postgres table — see H-008).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

