## maintainer_notes

UI/GUI IS present and enriched for this feature (Rule 9): the credential lifecycle has a real user-facing surface — the
Collectors tab (CollectorsList -> CollectorItem -> CollectorItemToken) and the Datasources tab (DataSourceItem ->
DataSourceItemToken). This reflection is NOT API-only; the highest-leverage findings (H-003 dialog-warning gap, H-011
prefix-sniff fragility, H-012 no-recovery) come precisely from reasoning about the screen the operator lives through. This
is the correct shape — the F-031 mistake (an API-only reflection of a UI-driven feature) is avoided because the UI hops are
in the chain and enriched.

FEATURE-FLOW DRIFT-CLASS CORRECTION (H-003, write-back candidate): the feature-flow's drift class
`regenerate_token_ui_one_click_no_confirmation_modal` is FACTUALLY WRONG as stated — a ConfirmationDialog DOES exist on both
token controls (DataSourceItemToken.tsx:37-49 + CollectorItemToken.tsx:37-49). The real gap is that the dialog carries NO
consequence warning. Proposed replacement drift class:
`regenerate_ui_confirmation_dialog_exists_but_carries_no_consequence_warning`. The maintainer should fold this correction
into F-125's observed_vs_expected (and the UX severity stays HIGH because the informed-click footgun is real).

NET_NEW LOAD-BEARING FINDING (H-001): the orphan-token-never-housekept problem is only PARTIALLY tracked. PLT-087 D1 covers
the DataSource-side per-delete cleanup; NOTHING covers (a) the Collector-side per-delete cleanup or (b) the
housekeeping-cascade daily sweep that reclaims tokens orphaned before any per-delete fix ships. The sweep
(`DELETE FROM token WHERE id NOT IN (...every token_id FK...)` as a new HousekeepingJob bean) is the F-125
notes_for_maintainer recommendation and is the genuinely new contribution of this reflection vs the already-tracked corpus.

