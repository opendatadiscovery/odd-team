behaviour: |-
  **`POST /api/datasetfields/{id}/enum_values` is SILENT BULK-REPLACE: a partial body (one item) submitted against a field with three existing items soft-deletes the OTHER TWO.** The operationId says `createEnumValue` (singular CREATE verb — `openapi.yaml:2539`); the OpenAPI summary says "Enum Value CRUD" (hinting at the multi-action shape but burying it). The implementation at `EnumValueServiceImpl.java:91-122`:

  - Partitions input by `id != null` (line 97-100): items with id → bulkUpdate path; items without id → bulkCreate path.
  - `softDeleteExcept(datasetFieldId, idsToKeep)` (line 105) — removes every existing row whose id is NOT in the request's `idsToKeep`.

  **Operator-visible failure mode** — a third-party API consumer OR a future UI refactor sending only the changed item against a field with three existing enum values will SILENTLY DESTROY the other two values. The current UI (`DatasetFieldEnumsForm.tsx:90-105`) is well-behaved — it preserves the full `data.enums` array on every submit (lines 45-60 initialise defaultValues from the existing enum-list) — but this is a UI-side convention that the API does NOT enforce.

  **Why CRITICAL**:
  - **Silent data destruction**: the response is HTTP 201 + the new state — no warning, no diff log of what was removed. An API consumer building an enum value via a "fire-and-forget POST one item" pattern (the most natural read of `createEnumValue`) will destroy other operator-edited values.
  - **Activity-feed insufficiency**: the soft-delete fires a single `DATASET_FIELD_VALUES_UPDATED` activity event with no diff payload — the operator reviewing the feed sees "values updated" not "values destroyed".
  - **Compound with TEST-GAP-990** (no concurrency control): two operators concurrently sending different partial bodies guaranteed to interleave the soft-delete cycles, multiplying the destruction.
  - **OpenAPI contract failure**: the spec at `openapi.yaml:2536-2554` declares operationId `createEnumValue` with body `BulkEnumValueFormData` — but does NOT declare in the description that the body IS THE NEW STATE. Generated client SDKs in Python/Go/Java will offer the method with NO warning.
  - **Live docs silent**: per the sidecar's doc_drift_findings: the live docs do not describe BULK-REPLACE semantics. Operator has no way to discover the failure mode pre-incident.

  Probe P-154 pins this directly.
