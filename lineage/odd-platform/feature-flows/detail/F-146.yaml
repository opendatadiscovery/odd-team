pillar_anchored_feature_name: Metadata Stale Indicator (orange-clock per-row staleness signal)
feature_name: |-
  Search Result Item rendering of the per-entity is_stale signal — the
  orange-clock icon surfaced on EVERY Data Entity row across the Search /
  Directory / Detail-header / Lineage / Term-linked / Owner-Association
  Recommended-panel / DataModelling / Overview / hooks surfaces.
  Operators see an at-a-glance "source has stopped publishing" indicator
  computed from a single backend predicate `lastIngestedAt +
  odd.data-entity-stale-period < now()`. F-146 anchors the
  Search-result-list rendering surface specifically; the predicate +
  cross-surface coverage are inherited from SHB-001 (un-graduated until
  this batch).
seeded_from: ui-review-2026-05-26 + SHB-001 (data-entity-staleness)
seeded_at: '2026-05-26'
batch_origin: ui-review-2026-05-26-slice-E
created_in_batch: ui-review-2026-05-26-slice-E
status: ui-incomplete
status_reason: |-
  The Search-list UI rendering surface (ResultItem.tsx + MetadataStale.tsx)
  is read directly from .tsx source in this batch — UI half resolved at
  this anchor. The backend predicate + the configuration-binding (the
  @Value("${odd.data-entity-stale-period}") read) + the mapper-tier
  imprint pattern (5 callsites in DataEntityMapperImpl + 1 in LineageMapper)
  + the spec-level required-field declaration (3 schemas) + the
  ten-cross-surface UI consumption pattern are anchored via SHB-001
  evidence + the live-doc gap. The UI HALF is complete for this anchor;
  the BACKEND HALF (predicate sidecar, mapper sidecar, four caveats —
  unset-config silent-default, never-ingested forging, ingestion-write
  forgery integrity, clock-skew flicker) needs separate /enrich pass.
  Therefore ui-incomplete — the cross-surface picture is the OUTER feature.
