      description: "UPDATE data_entity SET internal_description = ? — stored verbatim, no sanitisation"
      evidence: "ReactiveDataEntityRepositoryImpl line ~340"
      cardinality_per_call: 1
    amplification_factor: 1
    observed_vs_expected:
      facets:
        - facet: "Markdown body sanitisation — backend"
          observed: "<script>, <img onerror>, <iframe> tags stored verbatim in DB; round-trip preserves all dangerous tags"
          expected: "Sanitised storage (Jsoup.clean / Encode.html / allowlist) OR sanitised render (UI rehype-sanitize); ideally defence-in-depth at both"
          drift_class: external_lib_assumes_sanitisation
          provenance: "MEASURED — P-007 (run R-20260519T012123Z-P-007) PUT the XSS payload, GET back, SELECT raw column; all 3 dangerous-tag substrings present verbatim"

        - facet: "Markdown body sanitisation — UI render (defence-in-depth, slice-5)"
          observed: |
            DANGEROUS TAGS reach the rendered DOM via react-markdown + rehype-raw + no rehype-sanitize:
              - <script> tag present in document body (dom_has_script_tag == True)
              - id="p009-xss-img" reaches DOM (dom_has_xss_img_id == True)
              - id="p009-xss-iframe" reaches DOM (dom_has_xss_iframe_id == True)
            BUT event-handler attributes are STRIPPED (likely by React's normal attribute
            filtering on rehype-raw's setProperty path):
              - `onerror=` attribute NOT in rendered DOM (dom_has_onerror_attr == False)
          expected: "Sanitised render — rehype-sanitize strips ALL dangerous tags + attrs"
          drift_class: partial_mitigation_via_unrelated_layer
          provenance: |
            MEASURED — P-009 slice-5 (run R-20260519T020610Z-P-009 on commit ede5d277).
            Refines the static-layer inference. REFACTOR-218 originally inferred "rehype-raw
            + no rehype-sanitize → full XSS surface"; measurement says partial — TAGS reach
            the DOM (script execution surface remains via tag-based vectors) but
            ATTRIBUTE-based vectors (img onerror, iframe javascript:) are already
            mitigated by React's attribute handling. This is the methodology's
            "measured truth refines inference" principle in action — the static layer's
            severity assessment for REFACTOR-218 stays HIGH (tag injection is still a
            surface) but the attack surface is narrower than originally inferred.

        - facet: "Markdown body sanitisation — UI EXECUTION (defence-in-depth, slice-6)"
          observed: |
            Despite dangerous TAGS reaching the DOM, no EXECUTION SURFACE materialises:
              - xss_dialog_fired == 0 (no alert/confirm/prompt observed by Playwright's
                page.on('dialog') hook across the post-settle window)
              - xss_leak_count == 0 (no requests to the attacker.example callback
                target — the img onerror handler did not fire)
            The execution surface is closed by TWO unrelated browser/framework mitigations:
