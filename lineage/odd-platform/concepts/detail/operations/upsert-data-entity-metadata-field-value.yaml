name: Upsert Data Entity Metadata Field Value (UPDATE-only despite the name)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-01
  - P-10
description: |-
  **NEW OPERATION, batch 2026-05-19L** — primary-source confirmed at
  `DataEntityController.upsertDataEntityMetadataFieldValue` (lines
  213-223) + `DataEntityServiceImpl.upsertMetadataFieldValue` (lines
  287-305) + `ReactiveMetadataFieldValueRepositoryImpl.update` (lines
  95-104). `PUT /api/dataentities/{data_entity_id}/metadata/{metadata_field_id}`
  with body `{value: string (required), origin: MetadataFieldOrigin
  (optional, silently dropped)}` — overwrite the per-(data-entity,
  metadata_field) value. **The OpenAPI operationId is `upsert*` but
  the implementation is pure UPDATE** with silent no-op on missing pair
  or missing data entity (per the silent-200-on-missing-pair-or-entity
  invariant).

  **The pipeline shape**:
    1. `metadataFieldService.get(metadataFieldId)` → `MetadataFieldServiceImpl.java:30-34`
       throws `NotFoundException` if the field row is missing. (404
       surface: a non-existent metadata_field_id IS rejected.)
    2. Construct `MetadataFieldValuePojo` with `value = form.getValue()`
       and the (dataEntityId, metadataFieldId) pair set; `active` is NEVER
       set → remains null in the pojo
    3. `reactiveMetadataFieldValueRepository.update(pojo)` issues
       `DSL.update(METADATA_FIELD_VALUE).set(VALUE, ...).set(ACTIVE,
       pojo.getActive()).where((dataEntityId, metadataFieldId) match).returning()`
       — UPDATE with composite-PK WHERE
    4. `reactiveSearchEntrypointRepository.updateMetadataVectors(dataEntityId)`
       — rebuild the entity's metadata FTS vector
    5. `metadataFieldValueMapper.mapDto(MetadataDto)` → response

  All inside one `@ReactiveTransactional` boundary at the service
  (`DataEntityServiceImpl.java:288`).

  **Six substantive defects** (each captured as its own
  bugs_limitations_corner_cases item in the sidecar):

    1. **Silent 200-on-missing pair** — when the (dataEntityId,
       metadataFieldId) pair has no row in `metadata_field_value`, the
       UPDATE matches zero rows; the Mono completes empty; FTS-vector
       refresh and mapper short-circuit; controller returns 200 OK with
       empty body. The UI's redux thunk hardcodes a "Metadata
       successfully updated." toast on any non-error response. Same
       pattern as `upsertDataEntityInternalDescription` (batch G).

    2. **Silent 200-on-missing data entity** — when `dataEntityId` does
       not exist, the metadata-field lookup still succeeds (the
       `metadata_field` row is global), the UPDATE matches zero rows in
       `metadata_field_value`, response is 200-with-empty-body. Unlike
       `createMetadata` (lines 257-258) which DOES validate the entity
       exists, the upsert path never validates.

    3. **No type validation against `metadata_field.type`** —
       `formData.getValue()` is written verbatim into the `text` column
       regardless of declared `MetadataTypeEnum` (INTEGER / FLOAT /
       BOOLEAN / DATETIME / ARRAY / JSON / STRING / UNKNOWN). A user
       can write `"not a number"` to an INTEGER-typed field.

    4. **EXTERNAL-origin fields writable** — the upsert path does not
       check `MetadataFieldPojo.getOrigin()`. EXTERNAL fields are
       populated by collectors during ingestion; a user with
       `DATA_ENTITY_CUSTOM_METADATA_UPDATE` can overwrite the
       collector-ingested value until the next ingestion cycle replaces
       it. Pairs with the no-audit gap.

    5. **`active` column dropped to NULL on every UPDATE** — the
       repository writes `.set(METADATA_FIELD_VALUE.ACTIVE,
       pojo.getActive())` but the pojo's `getActive()` returns null
       (boxed Boolean, never set by the upsert path's pojo construction).
       The DB column is `boolean DEFAULT TRUE`, but defaults apply on
       INSERT only — an UPDATE writes the explicit null. Silent
       state-corruption on every edit.

    6. **No `@ActivityLog` annotation** — `upsertMetadataFieldValue`
       does NOT carry `@ActivityLog(event = CUSTOM_METADATA_UPDATED)`
       despite the enum value existing in `ActivityEventTypeDto.java:18`.
       Sibling methods like `upsertBusinessName` and `upsertTags` DO emit
       audit events. The CUSTOM_METADATA_CREATED / UPDATED / DELETED
       enum values are all reserved-but-never-fired.

  **Plus a contract drift**: the OpenAPI form schema declares an
  optional `origin: MetadataFieldOrigin` (`components.yaml:2149-2150`)
  but the impl reads only `value` (line 295). The `origin` field is
  silently dropped on the wire — a client sending it is given no signal
  that the field was ignored.

  **Authorization**: `SecurityRule(DATA_ENTITY,
  '/api/dataentities/{data_entity_id}/metadata/{metadata_field_id}',
  PUT, DATA_ENTITY_CUSTOM_METADATA_UPDATE)` at
  `SecurityConstants.java:204-207`. Permission is DATA_ENTITY-scoped on
  `dataEntityId`; supports `is: dataEntity:owner` Policy scope for
  owners-only edit. UNDER `auth.type=DISABLED`, the permission check is
  NEVER consulted; anonymous traffic can write metadata values.

  **Audiences**:
    - ODD Platform UI — entity-detail page Overview > Metadata panel;
      MetadataItem row edit; redux thunk `updateDataEntityCustomMetadata`
      hardcodes a success toast on any 200 response
    - Direct REST clients holding `DATA_ENTITY_CUSTOM_METADATA_UPDATE`
    - S2S programmatic consumers (X-API-Key → ADMIN scope)
    - Anonymous callers under DISABLED
    - FTS consumers — every metadata update refreshes the entity's
      search vector
