- id: H-004
  hypothesis: |-
    When a user clicks Logout, the platform always at minimum invalidates the local
    ODD session, so regardless of provider the user is signed out of ODD itself.
  derivation: |-
    Pillar mission: "logout is the dual of authentication." The minimum a Logout
    button must deliver is local sign-out — the universal tail of every handler.
  seed_source: pillar + endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      The local-session-invalidate tail (exchange.getSession().flatMap(WebSession::invalidate))
      is the documented common tail of all five handlers — BUT in CognitoLogoutSuccessHandler
      the StringUtils.isEmpty(provider.getLogoutUri()) guard at lines 33-35 returns
      Mono.empty() BEFORE reaching the line-49 invalidate. So if a Cognito deployment omits
      logout-uri, the local session is NOT invalidated and the user remains signed into ODD
      with NO error, NO redirect, HTTP 200. The "minimum guarantee" is therefore not
      universal — it is gated on a config value the docs mark optional for non-Azure providers.
      (Azure's opposite failure: omitting logout-uri NPEs to HTTP 500, also denying logout.)
    evidence:
      - sidecar: odd-platform__java__auth__logout__CognitoLogoutSuccessHandler.md
        section: bugs_limitations_corner_cases[0] + security.known_security_gaps[1]
        cite: "CognitoLogoutSuccessHandler.java:33-35 (early return BEFORE invalidate at line 49)"
        note: "Empty logout-uri short-circuits the whole handler incl. local cleanup."
      - sidecar: odd-platform__java__auth__logout__AzureLogoutSuccessHandler.md
        section: bugs_limitations_corner_cases[0]
        cite: "AzureLogoutSuccessHandler.java:39 (URI.create(null) NPE -> HTTP 500)"
        note: "Opposite failure mode for the same missing config on Azure."
    operator_visible_failure: |-
      On a Cognito deployment misconfigured without logout-uri: the user clicks Logout,
      the page does nothing visible, and they remain fully authenticated to ODD — a
      genuine "logout that doesn't log out" on the local session, not just the IdP token.
      No log line, no error toast — the only way an operator discovers it is by clicking
      Logout and watching the session survive. This is the LSN-001-shaped silent
      permissive-default failure applied to logout.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

