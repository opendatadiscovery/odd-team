- id: H-011
  hypothesis: |-
    When the SPA's whoami call fails (302/401 under a real mode before login, or a network
    error), the UI degrades gracefully — it does not crash and does not leave permission
    state in a way that silently grants access.
  derivation: |-
    App.tsx wraps fetchIdentity() in .catch(()=>{}); getGlobalPermissions falls back to
    emptyArr when there is no identity. Negative-space (error path) seed.
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      fetchIdentity() is dispatched with a trailing `.catch(() => {})` (App.tsx:48), so a
      rejected whoami (401/302/network) does not throw into React render. When the profile
      slice has no owner/identity, getGlobalPermissions returns `emptyArr`
      (profile.selectors.ts:19) and PermissionProvider.isAllowedTo returns false for every
      permission (PermissionProvider.tsx:21-23, empty list → `.every` over a non-empty
      required set is false). So the failure mode is FAIL-CLOSED in the UI (controls hidden),
      not fail-open. Note the swallowed error means NO user-facing message on failure — a UX
      gap (silent), but not a security one.
    evidence:
      - source_read_for_validation: true
        cite: "odd-platform-ui/src/components/App.tsx:48"
        note: "dispatch(fetchIdentity()).catch(() => {}) — error swallowed, no crash"
      - source_read_for_validation: true
        cite: "odd-platform-ui/src/redux/selectors/profile.selectors.ts:19"
        note: "|| emptyArr fallback when no identity → isAllowedTo false (fail-closed)"
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

