feature_id: F-125
feature_name: "Ingestion Credential Lifecycle — orphan tokens never housekept, plaintext at rest, no rotation grace period"
pillar_id: P-08
pillar_anchored_id: P-08:F-017
pillar_anchored_feature_name: "Ingestion Credential Storage & Lifecycle"
