name: Repository transactional boundary at service-layer, not repository
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19H** — load-bearing architectural convention
  surfaced across all 5 sibling `Reactive*Repository` sidecars. ODD Platform repositories
  are intentionally UNTRANSACTIONAL — no `@ReactiveTransactional` / `@Transactional`
  annotation at the class or method level. Transaction boundaries live ONE LAYER UP
  at the service-layer caller. The convention is uniform: every Reactive*Repository
  is `@Repository @RequiredArgsConstructor` only (the 5 batch-H sidecars all confirm).
  This allows individual repository methods to compose freely under EITHER a shared
  transaction (when a caller wraps several calls in @ReactiveTransactional) OR no
  transaction (when a caller fires-and-forgets). The trade-off: callers can FORGET
  to wrap and silently lose atomicity. Specific instances confirmed at the SQL primary
  source: (a) `ReactiveDataEntityRepositoryImpl`: writes (incrementViewCount / setInternalDescription
  / setInternalName / updateDEG / createHollow) are method-only; transactional scope
  lives in DataEntityServiceImpl.@ReactiveTransactional at lines 197, 324; (b) `ReactiveLineageRepositoryImpl`:
  mutation methods (batchDeleteByEstablisherOddrn / batchInsertLineages / softDeleteLineageRelations
  / restoreLineageRelations) have no @ReactiveTransactional; LineageServiceImpl.replaceLineagePaths
  is @ReactiveTransactional at LineageServiceImpl.java:124-133, wrapping the delete+insert
  pair as the atomicity contract for "rewrite an establisher''s edges"; (c) `ReactiveOwnershipRepositoryImpl`:
  class is @Repository @RequiredArgsConstructor only (lines 27-28); OwnershipServiceImpl.create/delete/update
  carry @ReactiveTransactional at lines 49, 78, 101; (d) `ReactivePolicyRepositoryImpl`:
  inherited single-row create/update/delete on `ReactiveAbstractCRUDRepository` have
  NO @ReactiveTransactional (lines 103-110, 158-173) — only BULK variants (113, 129)
  do. PolicyServiceImpl.update (lines 71-81) issues policyRepository.get(id) then
  policyRepository.update(...) — two separate R2DBC calls OUTSIDE any @ReactiveTransactional
  → lost-update race possible; (e) `ReactiveAlertRepositoryImpl`: class declaration
  has no annotation (lines 63-65); AlertServiceImpl.handleExternalAlerts + applyAlertActions
  carry @ReactiveTransactional (lines 152, 201); AlertServiceImpl.updateStatus DELIBERATELY
  does NOT carry the annotation (lines 111-113) — the platform tolerates the read-then-write
  race on user-driven status changes (the reopen-conflict guard catches the data-integrity
  case at the application level). **The convention is consistent**; the gap is at
  the service-layer authoring. A future maintainer writing a new controller / job
  / admin tool that invokes a repository method directly WITHOUT wrapping in @ReactiveTransactional
  would observe non-atomic behaviour with no rollback on partial failure and no defensive
  check at the repository signature. **Highest-leverage caveat for a future feature
  author** — every Reactive*Repository is a thin SQL surface; atomicity is the CALLER''s
  responsibility.'
