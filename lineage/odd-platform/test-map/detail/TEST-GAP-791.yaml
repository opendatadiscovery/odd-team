behaviour: |-
  **LOW — MinioConfig.java:23 calls the two-argument `.credentials(accessKey, secretKey)` — which constructs a `StaticProvider` implicitly. The MinIO SDK's `Provider` interface (`StaticProvider`, `IamAwsProvider`, `WebIdentityProvider`, etc.) is bypassed. AWS EKS / ECS operators wanting IAM-role-based credentials (IRSA, instance profiles) cannot use them.**

  **Third Gate-5 unset-parameter-audit finding** on the MinioConfig builder chain (alongside `.region(...)` — TEST-GAP-776 — and `.httpClient(...)` — TEST-GAP-790). Severity is LOW because it is a DEPLOYMENT-FLEXIBILITY gap (operator convenience), not a security risk in itself — static keys still work; operators simply lack the IRSA/instance-profile alternative.

  **Test gap shape**: regression-pin asserting the credentials path is hard-coded to static-key construction. The fix direction (REFACTOR-NNN) is to accept a `Provider` bean optionally via `@Qualifier("minioCredentialsProvider")` if present, falling back to the static-key path.
