behaviour: |-
  **`installed: false` is hardcoded on every IntegrationPreview and Integration
  response — the field is structurally dead.** IntegrationMapper.java:27 and
  :30 carry `@Mapping(target = "installed", constant = "false")` on both the
  full Integration mapping AND the preview mapping. The OpenAPI contract
  declares installed REQUIRED at components.yaml:64-70; the UI's
  IntegrationPreviewItem.tsx:44-51 conditionally renders an "Integrated" badge
  on `{installed && (...)}` — the badge will NEVER show. There is no code path
  inspecting whether an integration is actually wired into the platform (no
  DataSourceRepository lookup against integration id, no comparison against
  registered collectors). The field is REQUIRED-and-meaningless. An operator
  who has connected a Snowflake datasource and sees the Snowflake wizard card
  sees no "Integrated" indicator — they cannot distinguish "wizard exists,
  integration done" from "wizard exists, integration pending".
