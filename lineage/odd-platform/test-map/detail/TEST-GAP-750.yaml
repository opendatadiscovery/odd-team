proposed_action: |-
  Add `EndToEndPlaintextTokenChainAtControllerTierTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Six test methods:
  1. `registerDataSource_responseBodyContainsPlaintextToken_pinsPlaintextOnTheWire` — POST `/api/datasources` with valid form; capture the response body; assert it contains a 40-char alphanumeric token verbatim; assert the response carries NO `Cache-Control: no-store` header. PIN the plaintext-on-the-wire posture.
  2. `regenerateDataSourceToken_responseBodyContainsPlaintextToken_pinsPlaintextOnRotation` — sister test on the rotation surface.
  3. `registerCollector_responseBodyContainsPlaintextToken_pinsPlaintextOnTheWire` — sister test on the CollectorController register surface.
  4. `regenerateCollectorToken_responseBodyContainsPlaintextToken_pinsPlaintextOnTheWire` — sister test on the CollectorController rotation surface.
  5. `getDataSourceList_responseBodyContainsMaskedToken_assertMaskFormatStarsThenLast6_pinsMaskingContract` — pin the LIST endpoint's MASKING contract (verifies the `showToken=false` branch at `TokenMapper.java:17`). Assert that `******{last6chars}` is the wire format; assert the leading 6+ chars of the plaintext are NOT present in the list response.
  6. `endToEndPlaintextChain_dbValueEqualsResponseBodyValue_assertNoHmacOrDerivedFormBetweenLayers` — register a datasource; capture the response token; query the DB directly via test fixtures; assert the DB `TOKEN.value` is identical to the response token (no HMAC-on-issue, no salted hash, no derived form). PIN the absence of mitigation between wire and at-rest.

  Pair with a follow-up backlog item: add `Cache-Control: no-store` and an `X-Sensitive-Body: true` advisory header to all four token-issuing endpoints. When the fix lands, tests #1-#4 invert to assert the headers ARE present.

  Cross-pair with DOC-NNN: surface the end-to-end plaintext-token-chain to operators on `documentation/docs/configuration-and-deployment/enable-security/authorization` and `documentation/docs/features/management.md` — operators MUST know to disable APM body-capture and reverse-proxy logging on the four token paths. LSN-001/LSN-002 framing: the deployment-default leaks tokens; the docs must say so.
