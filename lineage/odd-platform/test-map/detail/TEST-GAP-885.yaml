behaviour: |-
  **HIGH — the four `/api/tags` operations carry NO method-level `@PreAuthorize`; the entire authorisation surface is `SecurityConstants.SECURITY_RULES` path-pattern matching. A path rename of `/api/tags` without a coordinated `SECURITY_RULES` update would silently un-gate all three write endpoints (the REFACTOR-217 drift class). NO `TagControllerSecurityTest` exists, so the perimeter-only auth posture has ZERO CI coverage — a wiring drift would not surface.** Method-level primary source from the batch-X-TAGGING `TagController` controller-method sidecars (4 distinct nodes):

  - `SecurityConstants.java:138-142`: the `/api/tags*` `SecurityRule` entries — `POST /api/tags` -> `TAG_CREATE`, `PUT /api/tags/{tag_id}` -> `TAG_UPDATE`, `DELETE /api/tags/{tag_id}` -> `TAG_DELETE`. **There is NO GET entry** — `getPopularTagList` falls through to the catch-all `pathMatchers("/**").authenticated()` (`AuthorizationCustomizer.java:29-30`).
  - `TagController.java:22-52`: NONE of the four methods (`createTag`, `getPopularTagList`, `updateTag`, `deleteTag`) carries `@PreAuthorize`. Verified per the createTag/updateTag/deleteTag/getPopularTagList sidecars' `authorization_assertions` blocks.
  - `TagServiceImpl.java:1-167`: zero `@PreAuthorize`, zero programmatic permission checks (verified by the TagServiceImpl sidecar referenced in all four method sidecars). The controller perimeter is the SOLE authorisation defence.

  **Four distinct sub-behaviours, all unpinned:**
  - **Write-endpoint RBAC enforcement** — a caller holding only `DATA_ENTITY_TAGS_UPDATE` (a per-entity tag permission, NOT a directory permission) attempting `POST` / `PUT` / `DELETE` on `/api/tags` must get 403. Three permission gates, each unverified.
  - **Open-read posture (intentional)** — `getPopularTagList` returns 200 + the full directory for ANY authenticated user, including one holding NO `TAG_*` permission. This is the deliberate open-read design (consistent with sibling read endpoints) but it is UNPINNED — a future maintainer adding a GET `SecurityRule` would silently break the documented open-read posture, or a future drift removing the catch-all would make the directory unreadable.
  - **Unauthenticated access** — under LOGIN_FORM/OAUTH2/LDAP, an unauthenticated caller gets 401 (or 302 for LOGIN_FORM) on all four operations via the catch-all. Under `auth.type=DISABLED`, all four are reachable WITHOUT authentication.
  - **The path-pattern coupling itself** — `SecurityConstants` keys the gate by URL string, not a code reference. A rename of `/api/tags` un-gates the writes silently. A test that asserts each verb gets the expected status for a no-permission caller IS the regression catcher for that drift class.

  **Test gap shape**: a `WebTestClient` security test (one of: `@WithMockUser`-style permission injection or a Testcontainers-backed RBAC fixture) asserting (a) a caller WITHOUT `TAG_CREATE` gets 403 on `POST /api/tags`; (b) WITHOUT `TAG_UPDATE` -> 403 on `PUT`; (c) WITHOUT `TAG_DELETE` -> 403 on `DELETE`; (d) a caller with NO `TAG_*` permission gets 200 + full directory on `GET /api/tags` (the open-read posture); (e) an unauthenticated caller gets 401/302 on all four under an authenticating mode. The current state is PINNED — a REFACTOR-217-class path rename would flip (a)-(c) to 200, failing the test.
