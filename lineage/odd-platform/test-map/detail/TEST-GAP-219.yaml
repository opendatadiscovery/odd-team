behaviour: Under LOGIN_FORM/OAUTH2/LDAP with `auth.s2s.enabled=true`, any X-API-Key
  holder is injected as ADMIN globally (S2sAuthenticationFilter.java:31-39) and can
  create new Roles, including a role that grants further Permissions to itself or
  to other Owners. The S2S identity is implicit-admin everywhere, not scoped to ingestion.
  REFACTOR-108.
