mitigations_unimplemented:
  - |-
    Rename LineageDepth.empty() to LineageDepth.singleHop() — the factory
    method name should encode the semantic, not the structural emptiness; the
    rename is a one-touch refactor that makes the call site self-documenting.
  - |-
    Add an explicit if (empty) return seed branch to the CTE construction in
    ReactiveLineageRepositoryImpl — the empty field is then consumed at the
    construction site; the magic-number sentinel becomes a defensive guard.
  - |-
    Add a CTE unit test that asserts LineageDepth.empty() produces single-hop
    output (not zero-hop, not multi-hop) — pins the current semantic against
    a future refactor of the termination predicate.
  - |-
    Doc: a maintainer-facing developer note in the LineageDepth class JavaDoc
    explicitly stating "empty() means seed-step only; the recursive UNION ALL
    does not fire" — discoverable at the type level.
notes: |-
  This invariant is a documentation / naming-clarity finding, not a runtime
  correctness defect. The encoding works correctly today; the gap is the
  brittleness of a magic-number sentinel buried in a single WHERE-clause
  comparison that could be silently broken by an innocent-looking refactor
  (e.g. "let me use lessThanOrEqual everywhere for consistency").

  Cross-references:
    - Traverse Lineage Graph (recursive-CTE) — the broader operation; this
      invariant is one carve-out within the recursion-bound mechanism.
    - REFACTOR-225 anchor-set single-point-of-failure — the lineage-variant
      endpoints that consume LineageDepth.empty() are the same endpoints
      affected by the single-point-of-failure; the magic-number encoding is
      load-bearing on the response shape for those endpoints.
