    TagServiceImpl batch VAL-LSN-019 (PRIMARY SOURCE — three-method
    consistency pattern):
    concepts.invariants[The !external guard pattern — TagServiceImpl.update
    and TagServiceImpl.delete both refuse to mutate a tag whose
    boolOr(tag_to_data_entity.external) aggregate is true; the
    updateRelationsWithDataEntity diff filters current relations to
    !external before the diff, and new relations are hardcoded
    external=false] +
    concepts.invariants[NOTE: the guard reads tagDto.external() which
    is the AGGREGATE across all data-entity relations; it does NOT
    consult tag_to_dataset_field origins — a tag with INTERNAL
    data-entity relations + EXTERNAL dataset-field relations would
    NOT be blocked] +
    implicit_adrs.[EXTERNAL relations are immutable to UI users — both
    update and delete reject tags with external=true aggregate;
    updateRelationsWithDataEntity reads only !external relations for
    the diff; new relations are hardcoded external=false; the Collector
    owns the EXTERNAL bit and the UI cannot impersonate] +
    tests_coverage_semantic.uncovered_behaviours[update !external
    guard, delete !external guard, preserves external relations,
    new relations external false] +
    bugs_limitations_corner_cases[the !external check is computed
    from tag_to_data_entity only — silent gap on tag_to_dataset_field
    EXTERNAL origins]

