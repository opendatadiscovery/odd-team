security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Authorization is enforced UPSTREAM at the controller via SecurityRule
      registered at SecurityConstants.SECURITY_RULES[215-227] for the three
      `DATA_ENTITY_OWNERSHIP_*` permissions; the repository trusts that
      authorization has already happened. Under DISABLED, the upstream
      gate is bypassed and the repository is reachable from anonymous
      callers. Under LOGIN_FORM the AuthorizationCustomizer is NOT wired
      (cross-ref Auth Mode aggregate) so SECURITY_RULES is INERT — every
      form-authenticated user effectively has DATA_ENTITY_OWNERSHIP_CREATE/UPDATE/DELETE.
      The repository has NO @PreAuthorize, NO programmatic permission
      check, NO method-level access-control annotation — defence-in-depth
      is null. Consistent posture with every other Reactive*Repository in
      the codebase. **STRENGTHENED batch K**: the SERVICE layer
      (OwnershipServiceImpl) ALSO has NO service-tier permission check
      (verified via grep at OwnershipServiceImpl.java:35-37 + grep
      @PreAuthorize|permissionService returns zero matches). The
      architectural posture is "controller-tier-only authorization" —
      a CONSISTENT but defence-in-depth-null choice across the chain.
  owner_scoping:
    verdict: N/A
    detail: |-
      The repository operates on `(ownership_id)` and `(data_entity_id,
      owner_id)` parameters with NO implicit owner-scoping. Owner-scoping
      for `/my`-shaped reads is built at SIBLING repositories
      (ReactiveDataEntityRepositoryImpl#listByOwner at lines 526-527
      builds the JOIN OWNERSHIP locally); this repository neither knows
      about nor enforces the caller's owner-link. This is the correct
      architectural posture per ADR-CANDIDATE-015 (owner-link resolution
      at the service via authIdentityProvider.fetchAssociatedOwner(),
      owner-id flows as a Long parameter into siblings, NOT through this
      class). **STRENGTHENED batch K**: the service-layer is also
      principal-independent — owner_name is taken VERBATIM from the
      form, NEVER inferred from the principal
      (OwnershipServiceImpl.implicit_adrs.[5]).
  strengths:
  - DB-constraint-driven uniqueness via `UNIQUE (data_entity_id, owner_id)` (V0_0_3:17)
    — duplicate creates fail at the DB layer, not requiring a pre-flight existsBy
    check
  - Centralised friendly-error translation via ExceptionUtils.translateDatabaseException
    (JooqReactiveOperations.java:41) maps unique-constraint violations to HTTP 400
    (USR003) with human-readable message — no raw Postgres errors leak to the API
  - Operator-precedence-safe OR-chain in deleteByDataEntityAndOwner (lines 98-101)
    — each AND-pair is closed BEFORE OR-combining; jOOQ wraps each Condition in parentheses
    at SQL generation; no `A AND (B OR C) AND D` ambiguity
  - Activity-feed audit trail via @ActivityLog(OWNERSHIP_CREATED/UPDATED/DELETED)
    annotations on OwnershipServiceImpl + the three AbstractOwnershipActivityHandler
    subclasses — every ownership mutation is forensically traced (TIER-1 audited per
    the audit-asymmetry invariant)
  - |-
    **STRENGTHENED batch K**: @ReactiveTransactional at the SERVICE LAYER
    (lines 49, 78, 101) wraps every public method — atomicity for the
    full lifecycle (owner+title upsert + ownership write + DEG cascade
    + search-vector refresh + filled-flag toggle + activity-event capture).
  weaknesses:
  - '**Hard-delete is irreversible at the data layer**; recovery depends on the activity-feed
    audit trail being intact. A regression that disabled `@ActivityLog(event = OWNERSHIP_DELETED)`
    on OwnershipServiceImpl.delete (line 77) would silently break the only post-deletion
    reconstruction path. The repository''s delete method is unaware of and unprotective
    of the audit trail. (ReactiveOwnershipRepositoryImpl.md:security.known_security_gaps.[1]
    LOW)'
  - '**No defence-in-depth — repository trusts upstream authorization without redundant
    checks**. A regression in the controller-layer SecurityRule (e.g. accidentally
    dropping the DATA_ENTITY_OWNERSHIP_DELETE entry from SecurityConstants.SECURITY_RULES)
    would allow any caller to invoke delete(ownershipId) without authorization. (ReactiveOwnershipRepositoryImpl.md:security.known_security_gaps.[0]
    LOW)'
  - '**Owner-auto-create permission-bypass via createOwnership (batch F upstream finding)**
    — `POST /api/dataentities/{id}/ownership` calls `OwnerService.getOrCreate(owner_name)`
    which silently creates a fresh Owner. Any caller with DATA_ENTITY_OWNERSHIP_CREATE
    can mint Owner directory entries WITHOUT holding OWNER_CREATE permission. The
    repository itself is not the gap site (the Owner-auto-create lives in OwnerService.getOrCreate
    at upstream), but the binding flow exposes the gap. (createOwnership.md:security.known_security_gaps.[0]
    MEDIUM)'
  - |-
    **STRENGTHENED batch K — REFACTOR-199 + REFACTOR-206 service-tier
    primary-source pin**: OwnershipServiceImpl.create at line 52-53 calls
    `ownerService.getOrCreate(formData.getOwnerName())` AND
    `titleService.getOrCreate(formData.getTitleName())`. The maintainer's
    deliberate choice of `getOrCreate` over `create` IS the design
    statement (per implicit_adrs.[0] — INTENTIONAL side-effect, NOT
    oversight). DATA_ENTITY_OWNERSHIP_CREATE is a SECOND undocumented
    gate on Owner+Title directory growth, alongside OWNER_CREATE.
    (OwnershipServiceImpl.md:bugs_limitations_corner_cases.[0,1])
  - |-
    **NEW MEDIUM batch K**: Self-grant decoupling — owner_name is taken
    VERBATIM from the form, NOT inferred from the principal. A Policy
    granting DATA_ENTITY_OWNERSHIP_CREATE without an
    `"is": "dataEntity:owner"` condition lets the holder grant ownership
    on ANY data entity to ANY owner (including a newly auto-created one).
    The default Policies shipped with ODD Platform are undocumented at
    the live docs layer.
    (OwnershipServiceImpl.md:security.known_security_gaps.[1])
  - |-
    **NEW LOW batch K**: Under auth.type=DISABLED, the service is
    reachable anonymously (the SecurityRule chain is bypassed at the
    controller boundary; this service has no fail-closed behaviour).
    The @ActivityLog still fires but ActivityContextInfo lacks a caller
    identity. (OwnershipServiceImpl.md:bugs_limitations_corner_cases.[9])
  cross_file_inconsistencies:
  - 'Batch-F createOwnership sidecar incorrectly stated the duplicate-key
    surface error is 5xx; batch-H ReactiveOwnershipRepositoryImpl CORRECTS:
    actual surface is HTTP 400 (USR003) via UniqueConstraintException +
    ControllerAdvice.handleUniqueConstraint mapping. **STRENGTHENED batch
    K** — OwnershipServiceImpl PRIMARY-SOURCE PIN at the service-layer
    confirms the correction; the full error-translation chain is
    JooqReactiveOperations.onErrorMap → ExceptionUtils.translateDatabaseException
    → UniqueConstraintException("Ownership for this data entity and owner
    already exists") → ControllerAdvice.handleUniqueConstraint →
    HttpStatus.BAD_REQUEST; ErrorCode USR003 resolvable=true retryable=false.
    Downstream artefacts inheriting the batch-F misclaim should be
    corrected. (ReactiveOwnershipRepositoryImpl.md:docs_link_semantic.doc_drift_findings.[2]
    + OwnershipServiceImpl.md:implicit_adrs.[3])'
  - Three test files exercise the repository at the BaseIntegrationTest level (`OwnershipRepositoryImplTest.java`
    — happy-path create/get/updateTitle/delete; service-layer mocked at `OwnershipServiceImplTest.java`),
    but `createOrUpdate` / `deleteByDataEntityAndOwner` / `existsByOwner` / `getOwnershipsByDataEntityId`
    + duplicate-prevention error surface are UNTESTED — see ReactiveOwnershipRepositoryImpl.md:tests_coverage_semantic.uncovered_behaviours
  - |-
    **NEW batch K**: DEG-propagation cascade audit-feed asymmetry —
    @ActivityLog(OWNERSHIP_*) annotates only the three top-level methods
    (lines 48, 77, 100); propagateOwnership cascade (lines 134-148)
    emits NO per-child events. Operators auditing child-entity ownership
    changes via ActivityController.getActivity see NO event on the child;
    they must walk the parent DEG's activity feed and INFER the cascade.
    Deliberate granularity choice per
    OwnershipServiceImpl.implicit_adrs.[2].
  contributing_files:
  - createOwnership.md
  - ReactiveOwnershipRepositoryImpl.md
  - OwnershipServiceImpl.md
  evidence:
  - createOwnership.md:security.known_security_gaps.[0] (Owner-auto-create permission-bypass
    MEDIUM)
  - ReactiveOwnershipRepositoryImpl.md:security.known_security_gaps.[0,1]
  - ReactiveOwnershipRepositoryImpl.md:concepts.invariants.[1] (duplicate prevention
    is DB-constraint-level, surface error is HTTP 400)
  - OwnershipServiceImpl.md:security.known_security_gaps.[0,1,2,3,4]
  - OwnershipServiceImpl.md:bugs_limitations_corner_cases.[0,1,2,3,8,9]
  - OwnershipServiceImpl.md:implicit_adrs.[3] (duplicate-prevention CROSS-BATCH
    CORRECTION PRIMARY-SOURCE PIN)
  - OwnershipServiceImpl.md:implicit_adrs.[5] (self-grant decoupling PRIMARY SOURCE)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - '`getOwnershipsByDataEntityId(dataEntityId)` is invoked TWICE per ownership write
    event by activity-feed handlers (BEFORE + AFTER state capture) — a 3-way JOIN
    over OWNERSHIP / OWNER / TITLE filtered by data_entity_id. For data-entities with
    many owners (>10), per-write activity-emission cost is two such joined SELECTs
    in addition to the actual write. (ReactiveOwnershipRepositoryImpl.md:performance.hot_paths.[0])'
  - '`existsByOwner(ownerId)` is invoked once per `OwnerService.delete` call to gate
    cascade-delete. The query is `SELECT EXISTS (SELECT * FROM ownership WHERE owner_id
    = ?)` — but the migration history adds NO standalone index on `owner_id`; the
    (data_entity_id, owner_id) unique constraint''s index has `data_entity_id` as
    leading column. PostgreSQL may not use this index efficiently for owner-only lookups
    on large deployments. (ReactiveOwnershipRepositoryImpl.md:performance.known_performance_gaps.[2])'
  - |-
    **NEW batch K**: `update` re-fetches `ownershipRepository.get(ownershipId)`
    TWICE — once at line 104 (NotFound check via switchIfEmpty), once at
    line 115 (response builder after updateTitle). The existing
    testUpdateOwnership at OwnershipServiceImplTest.java:157 verifies
    exactly twice. Combining the two would save one DB round-trip per
    update. (OwnershipServiceImpl.md:performance.known_performance_gaps.[2])
  throughput_shape:
    verdict: MIXED
    detail: 'Single-row CRUD (get/create/delete/updateTitle) — one DB round-trip per
      call, non-blocking. Batch CRUD (createOrUpdate / deleteByDataEntityAndOwner)
      — createOrUpdate partitions at 1000 rows via executeInPartitionReturning; deleteByDataEntityAndOwner
      does NOT partition (builds a single OR-chain WHERE clause and issues one DELETE
      — for very large input collections the WHERE clause grows linearly which may
      hit PostgreSQL''s statement-size limits at extreme cardinality). No bulk-read
      variant — getOwnershipsByDataEntityId takes a single dataEntityId; callers needing
      per-data-entity ownership lists for multiple entities must loop and N+1.'
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: 'Stateless — @Repository is a singleton bean; the only state is the two
      injected dependencies (jooqReactiveOperations, jooqQueryHelper) which are themselves
      stateless. Horizontal scaling unconstrained at this layer. Sequential partition
      execution for createOrUpdate: executeInPartitionReturning uses `Flux::concat`
      (not `Flux::merge`) to combine partition results, serialising the DB round-trips
      — for O(10K) children, 10 sequential INSERT-ON-CONFLICT batches inside a single
      @ReactiveTransactional hold the DB connection for cumulative duration.'
  strengths:
  - Stateless repository — horizontal scaling unconstrained
  - Reactive R2DBC throughout — non-blocking I/O; no thread held during DB await
  - Per-call allocations bounded; OwnershipPojo / OwnershipDto are small; Flux<OwnershipDto>
    materialises lazily per emitted record
  - DB-level constraint serialises concurrent same-row inserts — one wins, others
    throw at constraint level (mapped to 400)
  weaknesses:
  - '**No bulk-read variant for getOwnershipsByDataEntityId** (LOW) — activity-feed
    handlers call this method serially; bulk-import scenario emitting OWNERSHIP_CREATED
    events for many data-entities would N+1. No method on the interface supports `Collection<Long>`
    input. (ReactiveOwnershipRepositoryImpl.md:performance.known_performance_gaps.[0])'
  - '**Activity-handler issues TWO `getOwnershipsByDataEntityId` calls per ownership-write
    event** — once in `getContextInfo` (BEFORE state) and once in `getUpdatedState`
    (AFTER state). For data-entities with many owners, doubles the activity-emission
    cost per write. (ReactiveOwnershipRepositoryImpl.md:performance.known_performance_gaps.[1])'
  - '**`existsByOwner` may not benefit from a leading-column index on owner_id (MEDIUM)**
    — the migration history declares no standalone owner_id index. For operator deployments
    with O(M) ownerships, `existsByOwner` could degrade to sequential scan. (ReactiveOwnershipRepositoryImpl.md:performance.known_performance_gaps.[2])'
  - '**Sequential partition execution for createOrUpdate** (LOW for typical DEG cardinality
    <1000, MEDIUM if any operator has DEGs with O(10K) children) — `Flux::concat`
    serialises the partition INSERT-ON-CONFLICT batches inside a single @ReactiveTransactional
    boundary'
  - |-
    **NEW LOW batch K**: No method-level observability on the service —
    no @Timed, no Micrometer counter, no structured log. A DEG cascade
    on a 10K-child DEG shows up only as elevated WebFlux response time
    on a generic timer. (OwnershipServiceImpl.md:performance.known_performance_gaps.[0])
  cross_file_inconsistencies: []
  contributing_files:
  - createOwnership.md
  - ReactiveOwnershipRepositoryImpl.md
  - OwnershipServiceImpl.md
  evidence:
  - createOwnership.md:performance.throughput_characteristics + performance.known_performance_gaps.[0,1]
  - ReactiveOwnershipRepositoryImpl.md:performance.hot_paths.[0]
  - ReactiveOwnershipRepositoryImpl.md:performance.known_performance_gaps.[0,1,2]
  - OwnershipServiceImpl.md:performance.hot_paths.[0]
  - OwnershipServiceImpl.md:performance.throughput_characteristics.[0-5]
  - OwnershipServiceImpl.md:performance.scaling_characteristics.[0-3]
  - OwnershipServiceImpl.md:performance.known_performance_gaps.[0,1,2]
notes: |-
  NEW concept captured in batch H. Distinct from Owner directory entry (the
  platform-managed Owner row) and from User-Owner Mapping (the per-user
  oidc_username → owner_id binding) — Ownership is the EDGE between Owner
  and DataEntity, with an optional Title attribute. Three sibling
  repositories embed JOIN OWNERSHIP for their own owner-scoped read queries:
  ReactiveDataEntityRepositoryImpl, ReactiveAlertRepositoryImpl,
  ReactiveSearchEntrypointRepositoryImpl + others; this repository owns
  CRUD on the ownership ROW itself.

  Strong member of the ADR-CANDIDATE-015
  (owner-scoping-by-principal-resolution-at-service) cross-cutting
  pattern — every method signature confirms the architectural commitment.
  See 'Owner-scoped routes — controllers take NO principal parameter'
  invariant.

  Cross-batch correction propagated from batch-F: duplicate-key surface
  error is HTTP 400 (USR003), NOT 5xx as the batch-F createOwnership
  sidecar stated. The error-translation path is
  JooqReactiveOperations.onErrorMap → ExceptionUtils.translateDatabaseException
  → UniqueConstraintException → ControllerAdvice.handleUniqueConstraint
  → HttpStatus.BAD_REQUEST.

  STRENGTHENED batch 2026-05-19K: OwnershipServiceImpl primary-source
  pinned at the SERVICE LAYER. Two cross-batch corrections confirmed
  end-to-end:
    - HTTP 400 USR003 duplicate-key surface (PRIMARY-SOURCE PIN — full
      error-translation chain visible)
    - Self-grant decoupling (PRIMARY-SOURCE PIN — owner_name verbatim
      from form, no principal inference)
  NEW finding: DEG-propagation cascade audit-feed asymmetry (deliberate
  granularity choice per implicit_adrs.[2]).

  Companion new concepts surfaced batch K:
    - Manage Ownership Lifecycle (create/update/delete with DEG cascade)
      [new operation]
    - DEG-propagation cascade audit-feed asymmetry [new invariant]

  Doc-gap candidate: extend
  `/configuration-and-deployment/enable-security/authorization/permissions`
  with explicit text on how DATA_ENTITY_OWNERSHIP_CREATE/UPDATE/DELETE
  behave on duplicate-key collisions (HTTP 400, USR003 — not 5xx); the
  live page is silent on the error shape. Also document the
  self-grant decoupling and the audit-feed asymmetry.
