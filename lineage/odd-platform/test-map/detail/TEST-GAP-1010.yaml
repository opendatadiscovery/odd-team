behaviour: |-
  **MEDIUM — `queryExamplesRoutes.ts` has TWO compounded boundary defects:**

  **(a) Falsy-id guard silently routes id=0 to the LIST URL** at line 31:
  the builder uses `if (queryExampleId)` — a truthy check — so
  `queryExamplesPath(0)` returns the LIST URL `/data-modelling/query-examples`,
  NOT the details URL `/data-modelling/query-examples/0`. This is consistent
  with JavaScript's `if (numericVar)` idiom but indistinguishable from
  `queryExamplesPath()` (no-arg) and `queryExamplesPath(undefined)`. Postgres
  bigserial currently never produces id=0 so the case is theoretical, BUT:
  (i) a backend renumbering script that resets the sequence could produce
  id=0 silently; (ii) a future migration to signed ints could produce id=0
  from counter underflow; (iii) a unit test that uses `0` as a sentinel-id
  would be silently miscompiled to the list URL; (iv) a future caller that
  passes id from an arithmetic expression (e.g. `id - parent_id`) could
  produce 0 and silently land on the list.

  **(b) `useQueryExamplesRouteParams` propagates NaN silently** when the
  URL segment is non-numeric. Line 22's `as QueryExamplesRouteParams` is a
  type-system LIE — it claims `queryExampleId` is a non-undefined string
  when the React Router segment may be missing OR may not be numeric. Then
  line 25's `parseInt(queryExampleId, 10)` returns `NaN` for any non-numeric
  input. The downstream `useGetQueryExampleDetails({ exampleId: NaN })` then
  fires `GET /api/queryexample/NaN` — the backend returns 400/404, the UI
  hangs on `AppLoadingPage` (per `QueryExampleDetailsContainer.tsx:97`)
  until the error response arrives. No graceful fallback. **This is the
  FIFTH instance of the project-wide parseInt-without-isNaN-guard pattern**
  after TEST-GAP-422 (DataEntityDetails), TEST-GAP-849 (cross-component
  meta), TEST-GAP-997 (Integrations), TEST-GAP-1000 (Terms), TEST-GAP-1009
  (Directory — 4th instance). queryExamples is the 5th surface.

  **The compound nature of (a)+(b)**: a future change might enable id=0
  on the backend (e.g. a fixture or a renumbering); the builder silently
  routes to LIST. The same id=0 string ('0') as a URL segment would
  `parseInt('0', 10) === 0` (NOT NaN), so the hook returns
  `queryExampleId: 0`. The downstream details container then asks
  `useGetQueryExampleDetails({ exampleId: 0 })` → backend likely 404 (id=0
  doesn't exist). User lands on AppLoadingPage indefinitely. The pair of
  defects produces asymmetric behaviour: the BUILDER drops id=0 silently,
  but the HOOK accepts it. The architecture says "id=0 is invalid" via the
  builder but the hook doesn't enforce it.

  **Same-file additional surface**: the `URLSearchParams` constant
  exported from this file SHADOWS the global Web Platform
  `URLSearchParams` class (the URL-search-params API used throughout the
  SPA). A reader scanning the file may briefly believe `URLSearchParams`
  refers to the platform API; only the type definition resolves the
  ambiguity. Cosmetic naming clash, unconventional — not a bug but a
  readability defect. Surface here as a same-file finding for completeness.

  **The fix is single-file and three-line**: (i) replace
  `if (queryExampleId)` at line 31 with
  `if (queryExampleId !== undefined && queryExampleId !== 0)`
  or `if (typeof queryExampleId === 'number' && queryExampleId > 0)`;
  (ii) replace `parseInt(queryExampleId, 10)` at line 25 with a
  shared `safeParseRouteParamId` helper (per the TEST-GAP-1009 long-term
  recommendation); (iii) optionally rename `URLSearchParams` to
  `QueryExamplesSearchParams` to break the platform-API shadow.
