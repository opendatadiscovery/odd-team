question: |
  Does `getActivityCounts` (ActivityServiceImpl.java:138-166) accept NULL
  begin_date / end_date and issue an unbounded count over the entire
  retained activity history?

  STATIC-INFERRED OBSERVATION (S-B-3 stress finding):
  - `getActivityList` (ActivityServiceImpl.java:98-100) and
    `getDataEntityActivityList` (ActivityServiceImpl.java:128-130) BOTH
    validate `beginDate==null || endDate==null` and reject with
    `BadUserRequestException("Begin date and end date can't be null")`.
  - `getActivityCounts` (ActivityServiceImpl.java:138-166) does NOT
    validate. The reactive Mono.zip 4-way count chain forwards null
    dates to the repository's `getCommonConditions`, which (per the
    existing ReactiveActivityRepositoryImpl sidecar) only adds a
    `created_at` predicate when the date parameter is non-null.
  - Combined with F-010 (activity table has no row-level TTL; only
    EMPTY partitions are dropped), a null-dates call could scan the
    entire retained history — a performance cliff at scale.

  Two possible runtime outcomes:
    (a) OpenAPI spec marks begin_date/end_date as REQUIRED → request
        rejected at controller layer with 400 → service-layer validation
        gap is moot.
    (b) Spec accepts the request → service issues unbounded count.

  Pin whichever outcome holds; the maintainer's response differs by
  outcome:
    - (a) → mark S-B-3 as "mooted-by-OpenAPI-validation" in the sidecar;
    - (b) → either add service-level null-check OR ship a docs caveat
            (DOC-GAP-LSN-019-activity-feed-counts-unbounded-scan-caveat).

stress_category: B (name-behavior) + E (resource boundaries)
stress_question_ids: [Q-B-3, Q-E-3]

