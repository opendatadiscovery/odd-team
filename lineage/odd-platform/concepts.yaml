  - name: "Activity Feed"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Platform-wide audit-trail surface exposing append-only events tracking who changed what (descriptions, business names, ownership, tags, terms, custom metadata, dataset fields, alerts, halt-config). Reached via `GET /api/activity` (windowed by beginDate/endDate + 9 filter facets) and `GET /api/activity/counts` (aggregate totals). Four visibility modes via `type` query parameter (ALL / MY_OBJECTS / DOWNSTREAM / UPSTREAM). Cursor pagination via `(lastEventId, lastEventDateTime)` — the typo `lasEventId` exists on the public controller signature (ActivityController.getActivity.md `bugs_limitations_corner_cases[0]`). Persisted in the range-partitioned `public.activity` table managed by `ActivityTablePartitionManager` (partition WIDTH controlled by `odd.activity.partition-period`, default 30 days; no retention/DROP path — table grows monotonically). vocabulary_status: codebase-anchored, doc-side-partially-covered (live `features/active-platform-features/activity-feed` describes the UI surface but main-concepts.md does not name 'Activity Feed' as a canonical term)."
