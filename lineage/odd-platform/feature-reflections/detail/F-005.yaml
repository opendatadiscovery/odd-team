# Downstream lineage traversal — product-owner reflection

## product_owner_narrative

The **Data Lineage** feature lets a user open the *Lineage tab* on any catalogued entity — a dataset, a transformer, a quality test, a microservice, or a Data Entity Group — and see, as an interactive pannable/zoomable graph, what flows INTO that entity (upstream) and what flows OUT of it (downstream). It is the platform's answer to the "data observability" pain point named in the mission: when irrelevant or broken data shows up in production, the lineage canvas is the diagnostic surface an engineer opens first to trace the chain of producers and consumers (per system-mission.md P-05; per LineageGraph.md:audiences). The audiences are data engineers / analysts, data-quality engineers, and data scientists tracing producer↔consumer relationships (per LineageGraph.md:audiences).

A user interacts with it through one tab and a small control bar. The same URL — `/dataentities/{id}/lineage` — dispatches to one of two rendering subsystems based purely on the entity's class: Data Entity Groups route to a DEG-specific canvas (F-016); everything else routes to the per-entity *HierarchyLineage* canvas (per Lineage.md:understanding, lines 19-25 of `Lineage.tsx`). The control bar (LineageControls) offers a depth dropdown of 1..20, a Full/Compact view toggle, a Show-full-names toggle, an Expand-all-nested-items toggle, and a centre-on-root button (per F-005.yaml:contributing_nodes; per LineageGraph.md:concepts `lineageDepth` constants.ts:97-99). Behind the canvas, the per-entity endpoint is `GET /api/dataentities/{id}/lineage/downstream` (and the symmetric `/upstream`), which accepts a `lineage_depth` hop-count and an `expanded_entity_ids` list (per getDataEntityDownstreamLineage.md:understanding).

The working parts the user lives through: choose a depth and the canvas fetches that many hops; click a node's "Load N more" button and the canvas fetches one additional hop around that node (per LineageGraph.md:invariants — LoadMore is depth-1 expansion, LoadMoreButton.tsx:55-65); click a node's title and you navigate INTO that node's own lineage view (per LineageGraph.md:operations — Node.tsx:71); pan and zoom, and your zoom state plus your whole exploration set is captured in the URL so a share-link reproduces the view (per LineageGraph.md:implicit_adrs — URL is the source of truth, interfaces.ts:75-85). The graph is laid out as a TREE by d3-hierarchy, with non-tree edges (cycles, diamond-closures) drawn as separate cross-edges (per LineageGraph.md:invariants — generateGraph.ts:57-148).

The integration story: lineage edges are written by ingestion (every collector / push adapter that emits `parentDatasetOddrn`, transformer source/target lists, consumer input lists) and by microservice traces from `odd-tracing-gateway` (per system-mission.md P-05 cross-pillar `feeds_from`). Lineage in turn feeds the Recommended panel in Discovery and the Dependents tab in Alerts (per system-mission.md P-05 `feeds`). The same recursive-walk machinery is reused by the *my-objects* endpoints (`/api/dataentities/my/upstream` + `/downstream`) — and THAT path, unlike the canvas path, scopes results to the calling user's owned entities (per LineageServiceImpl.md:understanding — the negative-case/positive-case contrast with DataEntityRelationsServiceImpl).

Edge cases a product owner would flag in a demo: an empty graph (an entity nobody has declared lineage for) renders as a lone root — and this happy/empty pair is the one part now guarded by an e2e test (IT-029, GREEN, per integration-tests/protocols/IT-029-entity-lineage-display.md); a deeply-branchy or cyclic graph is the cost-amplification surface (the recursive SQL walk has no cycle guard and no depth cap — per ReactiveLineageRepositoryImpl.md:understanding); and a DEG's lineage view shows only the edges *between members of that group*, which can make a busy group look like an island disconnected from its real producers and consumers (per ReactiveLineageRepositoryImpl.md:invariants — getLineageRelations(List) requires BOTH endpoints in the member set).

## hypotheses

- id: H-001
  hypothesis: "When a user opens the Lineage tab on an entity and does NOT touch the depth control, the canvas shows the platform's default lineage depth (the depth the API documents as the 'unset' behaviour)."
  derivation: "The live api-reference doc states `lineage_depth` 'Unset returns the platform's default depth'; the OpenAPI param is `required: false`, promising callers a sensible default when omitted."
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      There is no platform default depth at any layer, and the documented unset
      behaviour is unimplementable as written. For a DIRECT API caller who omits
      `lineage_depth`, the controller passes a null `Integer` into the service's
      primitive `int` parameter; autoboxing throws NullPointerException BEFORE the
      service body runs, surfacing as HTTP 500 (getDataEntityDownstreamLineage.md
      bugs[0]; LineageServiceImpl.md bugs[1]). For the UI user the failure mode is
      DIFFERENT and silent: the UI hardcodes `defaultLineageQuery.d = 1`
      (constants.ts:74-84) across seven components, so the canvas ALWAYS sends
      `lineage_depth=1`. The user therefore never reaches the "default depth" branch
      and never sees the 500 — but they DO get a depth-1 graph (immediate neighbours
      only), which is an artificially shallow first impression with no documented
      basis (LineageGraph.md invariants + implicit_adrs[0]).
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityDownstreamLineage
        section: bugs_limitations_corner_cases[0]
        cite: "DataEntityController.java:256-262 + LineageService.java:11-14 + LineageServiceImpl.java:87-97"
        note: "Null Integer→int autoboxing NPE; no default in code; documented unset behaviour unimplementable."
      - sidecar: odd-platform__ts__react-component__component__LineageGraph
        section: implicit_adrs[0]
        cite: "constants.ts:74-84 (defaultLineageQuery.d=1) + HierarchyLineage.tsx:47"
        note: "UI silently supplies d=1, masking the NPE from the UI path and giving a depth-1 first view."
    operator_visible_failure: |
      Two distinct failure modes from the same doc claim. (1) A third-party / SDK
      caller following the API reference and omitting `lineage_depth` gets HTTP 500
      with a server exception trace in the logs, not a default-depth graph — the
      documented-as-optional parameter crashes the request. (2) A UI user sees a
      depth-1 graph on first open (only direct neighbours), which under-represents
      the lineage for an entity that is part of a longer pipeline; the user may
      conclude "this dataset has almost no lineage" when in fact they are looking at
      one hop. Neither the 500 nor the silent d=1 matches the promise of a
      "platform default depth".
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
    test_demand_note: "Regression guard for the fix: GET /api/dataentities/{id}/lineage/downstream with NO lineage_depth must return 200 + the canonical default-depth graph (NOT 500); AND the UI first-open must request the backend default, not a hardcoded d=1."

- id: H-002
  hypothesis: "When a user opens the Lineage tab on an entity, the returned graph is scoped to entities the user is entitled to see (e.g. entities they or their team own, or entities within their access scope) — it does not reveal the existence and structure of other teams' pipelines."
  derivation: "A platform with an RBAC model (Policies × Permissions × Roles × Owners) and owner-association implies that what a user sees is bounded by their access; an audit/observability surface that leaks every team's pipeline topology to every account would be a security expectation violation."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The lineage canvas applies NO owner-scoping at any layer. The controller passes
      no Principal/owner argument; LineageServiceImpl.getLineage has no
      AuthIdentityProvider field and makes no fetchAssociatedOwner() call
      (LineageServiceImpl.java:54-57, 87-122); the `lineage` table has no owner column
      and the recursive CTE filters only on `is_deleted` (ReactiveLineageRepositoryImpl
      lines 167, 174). The endpoint has no @PreAuthorize and no SecurityConstants
      SECURITY_RULES entry — it falls through to `pathMatchers("/**").authenticated()`.
      Any authenticated user (LOGIN_FORM / OAUTH2 / LDAP), and any anonymous caller
      under `auth.type=DISABLED`, can root at any entity id and read the full reachable
      subgraph, including edges into entities owned by other teams. The UI is the
      realisation point: it ALWAYS fetches via the anchor-set-UNDEFENDED endpoints
      (`/lineage/downstream` + `/upstream`), never the anchor-set-DEFENDED `/my/*`
      endpoints (LineageGraph.md bugs[9], thunks.ts:19,36). The contrast confirms intent
      drift: the same repository method IS owner-scoped when called via
      DataEntityRelationsServiceImpl.getDependentOddrns (which calls
      fetchAssociatedOwner() first) — the defence exists, but is not applied to the
      canvas path.
    evidence:
      - sidecar: odd-platform__java__service__service__LineageServiceImpl
        section: security.owner_scoping + bugs_limitations_corner_cases[0]
        cite: "LineageServiceImpl.java:54-57, 87-122 vs DataEntityRelationsServiceImpl.java:20,26"
        note: "Negative-case anchor-set: no owner resolution on the canvas path; the positive-case sibling DOES resolve owner."
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveLineageRepositoryImpl
        section: invariants[2] + downstream_side_effects (getLineageRelations Set,depth,kind)
        cite: "ReactiveLineageRepositoryImpl.java:122-176; V0_0_2/V0_0_17/V0_0_79 (no owner column)"
        note: "lineage table has no owner column; CTE filters only is_deleted; no JOIN-side owner predicate."
      - sidecar: odd-platform__ts__react-component__component__LineageGraph
        section: bugs_limitations_corner_cases[9] + security.known_security_gaps[1]
        cite: "thunks.ts:19, 36"
        note: "UI always fetches the undefended endpoints; no 'my owners only' toggle exists — UI is the user-observable realisation point."
    operator_visible_failure: |
      (1) Confidentiality leak across owner boundaries: any authenticated user can pivot
      from one accessible entity to the full reachable lineage subgraph, learning the
      names/oddrns/datasources of other teams' datasets, transformers, consumers, and
      microservices — and the causal connections between them, which reveal another
      team's internal pipeline structure even when those entities are not separately
      enumerable. (2) Under the default `auth.type=DISABLED` deployment the entire
      cross-owner topology is reachable by any unauthenticated network probe. (3) The DEG
      and microservice variants are strictly wider — microservice lineage exposes
      operational service-call topology (per F-016 / DOC-226). There is no UI affordance
      (no restricted view, no "only my entities" filter) to mitigate at the surface.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    test_demand_note: "Once a defence is chosen (anchor-set scoping OR JOIN-side owner filter + SecurityConstants entry), the regression guard is a cross-actor integration test: owner-B opens the Lineage tab rooted at owner-A's private entity and the cross-owner edges are absent (or a restricted placeholder renders). Under DISABLED, the documented posture is asserted explicitly."

- id: H-003
  hypothesis: "When a user (or a curious operator hand-editing the URL) requests a large lineage depth, e.g. `?d=10000`, the platform bounds the cost — it caps the depth at a sane maximum, or rejects the request, rather than driving an unbounded recursive query."
  derivation: "The UI depth dropdown only exposes 1..20, implying 20 is the product-policy maximum; an operator who sees a 20-entry dropdown reasonably expects 20 to be a hard cap enforced by the platform."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      No layer enforces an upper bound. The depth dropdown shows [1..20]
      (constants.ts:97-99) but the URL parser uses `parseNumbers: true` and accepts any
      positive integer (useQueryParams.ts:36); the value is passed straight to the API
      (HierarchyLineage.tsx:47). The OpenAPI/controller carries only `@Min(1)`, no `@Max`
      (DataEntityApi.java:918). The service applies no `Math.min(depth, MAX)` clamp
      (LineageServiceImpl.java:96). The repository consumes the raw int in the recursive
      CTE termination `tDepth.lessThan(lineageDepth.getDepth())` (ReactiveLineageReposito
      ryImpl.java:174). So `?d=10000` (or `Integer.MAX_VALUE` via direct API) drives the
      recursive walk to graph-density / Postgres limits. Click-through compounds this:
      Node.tsx:46-52 opens the clicked node's view with `d = node.depth`, so drilling 5
      hops in then clicking opens a depth-5 fetch around the new root, and repeating
      escalates depth without ever touching the slider.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LineageGraph
        section: bugs_limitations_corner_cases[1] + security.known_security_gaps[2]
        cite: "useQueryParams.ts:33-36 + constants.ts:97-99 + HierarchyLineage.tsx:47"
        note: "Dropdown is [1..20] but URL accepts any int; no UI clamp; passed straight through."
      - sidecar: odd-platform__java__service__service__LineageServiceImpl
        section: bugs_limitations_corner_cases[2]
        cite: "LineageServiceImpl.java:96"
        note: "No defensive clamp at service tier; raw int handed to repo."
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveLineageRepositoryImpl
        section: downstream_side_effects (getLineageRelations Set,depth,kind)
        cite: "ReactiveLineageRepositoryImpl.java:122-176, 174"
        note: "No LIMIT, no cycle clause, no depth cap inside the CTE; depth is the only terminator."
    operator_visible_failure: |
      A single user (or anonymous probe under DISABLED) can saturate Postgres CPU and JVM
      heap by requesting a very large depth against a dense or cyclic subgraph — a
      DoS-amplification vector with no rate limit and no defence at any tier. Combined
      with the absence of a cycle guard (H-009), the cost is bounded only by the
      depth value, which is itself unbounded. Operators cannot defend a small Postgres
      instance without an external WAF/reverse-proxy rule; the 20-entry dropdown gives a
      false sense that the platform enforces the cap.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional
    test_demand_note: "Regression guard for the PLT-042 depth-clamp fix: a request with lineage_depth far above the policy max (e.g. 10000) returns a bounded result or a 400 (not an unbounded CTE walk); the UI click-through clamps d to the max. Pairs with H-009 cycle-guard probe."

- id: H-004
  hypothesis: "When a user passes `expanded_entity_ids` to expand specific nodes inline, the parameter expands the named entities (one-hop fan-out around each), regardless of whether they are Data Entity Groups or ordinary entities — i.e. the parameter does what its name and the canvas's per-node Load-More affordance imply."
  derivation: "The endpoint shape exposes `expanded_entity_ids` and the UI's per-node Load-More appends a node id to the expansion set; the parameter is a general per-entity progressive-expansion mechanism."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The IMPLEMENTATION does exactly the general thing the hypothesis predicts: the list
      flows into getLineageRelationsForDepthOne which joins on `DATA_ENTITY.ID.in(rootIds)`
      with NO group-class filter, producing a depth-1 fan-out around ANY entity id
      (ReactiveLineageRepositoryImpl.java:134-148; LineageServiceImpl.md implicit_adrs[2]).
      The DOCUMENTATION, however, narrows it incorrectly: the live api-reference says
      `expanded_entity_ids` are "IDs of `Data Entity Group` entities that should be
      expanded inline" (getDataEntityDownstreamLineage.md doc_drift[1]). So the hypothesis
      is TRUE against the code and FALSE against the doc — a doc-vs-code drift where the
      doc is the inaccurate artefact (the code is more permissive than documented). A
      caller who trusts the doc and passes only DEG ids under-uses the feature; a caller
      who passes ordinary entity ids sees "unexpected" extra nodes the doc did not lead
      them to expect (though the call does not fail).
    evidence:
      - sidecar: odd-platform__java__service__service__LineageServiceImpl
        section: implicit_adrs (two-query lineage assembly) + docs_link_semantic.doc_drift_findings[1]
        cite: "LineageServiceImpl.java:98-99 + ReactiveLineageRepositoryImpl.java:134-148"
        note: "Depth-1 fan-out joins DATA_ENTITY.ID.in(rootIds) with no entity-class filter — any id, not only DEGs."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityDownstreamLineage
        section: docs_link_semantic.doc_drift_findings[1]
        cite: "DataEntityController.java:258 + WebFetch api-reference excerpt"
        note: "Doc narrows the parameter to 'Data Entity Group entities'; code accepts any id."
    operator_visible_failure: |
      The drift is in the documentation, not the runtime, so the operator harm is
      moderate: a third-party API consumer reading the api-reference is told the parameter
      only accepts DEG ids and may build tooling that never expands ordinary entities,
      missing a usable capability; or passes a non-DEG id and is surprised to receive a
      well-formed response with extra nodes. The behaviour is more permissive than the
      contract, so nothing crashes — but the contract is wrong.
    severity: LOW
    confidence: HIGH
    routes_to_finding: doc-gap-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
    test_demand_note: "Functional guard for the corrected contract: GET .../lineage/downstream with expanded_entity_ids holding an ORDINARY (non-DEG) entity id returns the depth-1 fan-out around that entity (proves the parameter is general, matching the corrected doc). LineageServiceTest mocks this branch to empty today — uncovered."

- id: H-005
  hypothesis: "When an entity is part of a Data Entity Group and the user opens the Group lineage view, the graph shows the group's members AND how they connect to their real upstream producers and downstream consumers — so the user sees the group's place in the overall data flow."
  derivation: "A DEG groups related entities (e.g. a 'Finance' group of datasets and jobs); a lineage view of that group is expected to show how the group connects to the rest of the catalogue, which is the point of grouping for observability."
  seed_source: view-mode
  validation:
    verdict: contradicted
    actual_behavior: |
      The DEG-lineage view shows ONLY edges where BOTH endpoints are members of the group.
      getDataEntityGroupLineage resolves the member oddrn set, then reads edges via
      getLineageRelations(List<String>) whose filter is
      `PARENT_ODDRN.in(oddrns).AND(CHILD_ODDRN.in(oddrns))`
      (ReactiveLineageRepositoryImpl.java:112-119; ReactiveLineageRepositoryImpl.md
      invariants — "only edges where BOTH endpoints are DEG members appear; edges exiting
      the DEG (member→non-member) and entering it (non-member→member) are dropped"). The
      service additionally strips any edge touching a nested DEG and removes DEG-typed
      entries from the dictionary (LineageServiceImpl.java:71-75, the
      `// Remove this when we will support inner DEGs` deferred-feature marker). The result
      is an INTERNAL-ONLY graph: a group's members and the edges among them, with the
      group rendered as an island disconnected from its actual producers and consumers.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveLineageRepositoryImpl
        section: downstream_side_effects (getLineageRelations List) + invariants
        cite: "ReactiveLineageRepositoryImpl.java:112-119"
        note: "BOTH-endpoints-in-member-set filter; cross-boundary edges are dropped."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityGroupsLineage
        section: invariants (DEG-internal edge filter is BIDIRECTIONAL)
        cite: "LineageServiceImpl.java:59-85 + ReactiveLineageRepositoryImpl.java:112-119"
        note: "Confirms the inter-member-only contract; the endpoint has no lineage_depth/expanded_entity_ids."
      - sidecar: odd-platform__java__service__service__LineageServiceImpl
        section: implicit_adrs (DEG-lineage is INNER-DEG-FREE)
        cite: "LineageServiceImpl.java:71-75"
        note: "Inner-DEG suppression also strips nested-DEG edges — flat member graph only."
    operator_visible_failure: |
      A user opening Group lineage for, say, a 'Finance' DEG that ingests from a
      'Raw events' dataset (owned by Data Engineering) and feeds a BI dashboard sees
      NEITHER the raw-events producer NOR the BI consumer — only the edges between the
      Finance group's own members. For observability ("where does this group's data come
      from / go to?") this is the opposite of useful: the group looks self-contained when
      it is not. The behaviour is undocumented at the user-facing level — the data-objects
      page describes group lineage as "lineage for the group's children" without warning
      that boundary edges are excluded. This is distinct from the DEG empty/404 and
      cross-owner caveats already tracked (PLT-036 / DOC-225); it concerns which edges are
      shown, not error polarity or auth.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
