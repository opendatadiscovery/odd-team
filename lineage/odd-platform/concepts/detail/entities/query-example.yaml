name: |-
  Query Example (operator-curated SQL/KQL/Spark snippet attached to data entities and terms)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-02
description: |-
  Operator-curated query snippet — first-class catalog citizen for the
  Data Modelling pillar (P-02). Each Query Example carries two text fields
  (definition — human prose / description; query — executable code body)
  and links to zero-or-more Data Entities (typically datasets) AND
  zero-or-more Glossary Terms. The 17-endpoint API surface is SPLIT across
  THREE controllers per the cross-controller permission split pattern:
  QueryExampleController owns the example CRUD; DataEntityController owns
  the example-to-dataset linkage; TermController owns the example-to-term
  linkage. The schema-tier table is query_example with soft-delete via the
  ReactiveAbstractSoftDeleteCRUDRepository base; link rows in
  data_entity_to_query_example + query_example_to_term are hard-deleted on
  example delete. FTS-vector materialisation runs synchronously on create
  + update; the entrypoint row is NOT cleaned up on delete (a slow
  storage leak per the batch V finding).

  PRIMARY-SOURCE ANCHOR — file:line citations from QueryExampleController
  batch V:

    Controller surface (13 endpoints — anchored here):
      Catalog CRUD: createQueryExamples, updateQueryExample, deleteQueryExample
      Read-by-relationship: getQueryExampleByDatasetId, getQueryExampleByTermId
      Detail + list: getQueryExampleDetails, getQueryExampleList
      Search-session: queryExamplesSearch, getQueryExampleSearchFacetList,
        getQueryExampleSearchResults, updateQueryExampleSearchFacetList,
        getQueryExampleSearchSuggestions

    Additional endpoints (NOT this controller — per the cross-controller split):
      DataEntityController: createQueryExampleToDatasetRelationshipNew,
        deleteQueryExampleToDatasetRelationshipNew (2 endpoints)
      TermController: createQueryExampleToTermRelationship,
        deleteQueryExampleToTermRelationship (2 endpoints)
      Total: 17 endpoints (the system-mission.md '16 endpoints' claim is
      off-by-one; the QueryExampleController batch V sidecar's
      dependencies_semantic.requires-feature notes the correction)

    Authorization model — 7 QUERY_EXAMPLE_* permissions split across THREE
    controllers:
      QueryExampleController: QUERY_EXAMPLE_CREATE / _UPDATE / _DELETE (3)
      DataEntityController: QUERY_EXAMPLE_DATASET_CREATE / _DELETE (2)
      TermController: QUERY_EXAMPLE_TERM_CREATE / _DELETE (2)

    Schema — V0_0_84__create_query_example.sql:
      query_example: id, definition text NOT NULL, query text NOT NULL,
        created_at, updated_at, deleted_at, is_deleted, namespace_id
      data_entity_to_query_example: FK to data_entity + query_example
      query_example_to_term: FK to term + query_example
      query_example_search_entrypoint: FTS materialisation table with GIN
        index

  CROSS-PILLAR RELATIONSHIPS:

    feeds: [P-05]  # ERD-like contribution to lineage adjacency? — minor
    feeds_from: [P-01, P-06, P-10]  # entities (P-01), terms (P-06),
      adapter-pushed query metadata (P-10)
    shares_data_with: [P-09]

  AUDIENCES:
    odd-platform-ui-end-user (Query Examples tab, search, detail page)
    odd-api-consumer (programmatic clients via OpenAPI SDK)
    data-engineer-analyst (primary author audience)
    viz-bi-engineer (reader audience — vetted query examples)
    data-steward-owner (term-linkage curation via TermController)
