proposed_action: |-
  Add `DataQualityPerMountStoreResetTest` under `odd-platform-ui/src/components/DataQuality/__tests__/`. Use Vitest + React Testing Library + <MemoryRouter>. Three pinning methods:
  (a) `filterChipsPersistDuringMount_butResetOnUnmountRemount_pinsPerProviderScope`: mount <App> at /data-quality; select a filter chip via the UI; rerender at / (navigating away); rerender at /data-quality (navigating back); assert the filter chip is GONE (the atom is all-empty).
  (b) `filterChipsPersistAcrossInternalRerenders_pinsAtomDoesNotResetOnReactRerender`: mount at /data-quality; select chips; trigger a forced rerender of the parent (without unmounting the Provider); assert the chips are STILL present. PINS the distinction between "React rerender" and "Provider unmount".
  (c) `urlPersistenceSurvivesNavigateAwayWhenUrlPreserved_butAtomResets`: select chips; capture the URL (TEST-GAP-913 contract); navigate away; navigate back to the EXACT URL captured; assert the chips re-appear (URL-sync fills the atom). PINS the URL-as-only-persistence behaviour.

  Add a `// REGRESSION-PIN — DataQualityProvider.tsx:4-6 + DataQuality.tsx:8 + App.tsx:73 — the dashboard's filter atom store is per-Provider-mount. Navigating away unmounts the Provider, destroys the store, and the next mount starts fresh. The URL is the only persistence channel (TEST-GAP-913). If you lift the Provider to App.tsx for "sticky" behaviour, this test breaks AND documentation/docs/features/data-quality/dashboard.md must be updated to disclose the new persistence model.` block. Pair with DOC-GAP-NNN documenting the per-visit reset.
