name: Database-level uniqueness with centralised friendly-error translation
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19H** — load-bearing architectural convention
  surfaced across 3 of the 5 batch-H repository sidecars. Uniqueness invariants are
  enforced at the DATABASE layer via UNIQUE constraints (or partial UNIQUE indexes
  for soft-delete-aware-recreation); duplicate violations are translated to a project-specific
  `UniqueConstraintException` carrying a HUMAN-READABLE message keyed by the constraint
  name — NOT propagated as the raw jOOQ `DataAccessException` — through a centralised
  translation layer (`ExceptionUtils.translateDatabaseException`) wired into every
  R2DBC query via `JooqReactiveOperations`''s `.onErrorMap(DataAccessException.class,
  ExceptionUtils::translateDatabaseException)` (JooqReactiveOperations.java:41, 48).
  The translation is uniform — every Reactive*Repository inherits it; no repository
  can leak raw Postgres errors to the API layer. **Specific instances confirmed at
  the SQL primary source**: (a) `ReactivePolicyRepositoryImpl` — Policy name uniqueness
  enforced via partial unique index `policy_name_unique ON policy(name) WHERE deleted_at
  IS NULL` (V0_0_55__add_policies_and_roles.sql:30). Duplicate INSERT fails as SQLSTATE
  23505 → UniqueConstraintException with message "Policy with this name already exists"
  (ExceptionUtils.java:60-62). Repository has no service-layer pre-check; a duplicate
  INSERT just fails at the DB layer; (b) `ReactiveOwnershipRepositoryImpl` — UNIQUE
  (data_entity_id, owner_id) constraint (V0_0_3__add_ownership.sql:17). Duplicate
  INSERT translates to HTTP 400 (USR003) with message "Ownership for this data entity
  and owner already exists" (ExceptionUtils.java:69-71). **CROSS-BATCH CORRECTION**:
  the batch-F createOwnership sidecar incorrectly stated the surface error is 5xx
  — the actual surface is HTTP 400 with USR003 ErrorCode + friendly message via the
  ExceptionUtils translation path + ControllerAdvice.handleUniqueConstraint mapping
  to HttpStatus.BAD_REQUEST; (c) `ReactiveLineageRepositoryImpl` — batchInsertLineages
  uses `.onConflict(...).doNothing()` (ON CONFLICT DO NOTHING via jOOQ `onDuplicateKeyIgnore`)
  against the (parent, child, establisher) PK established at V0_0_17:117 — SILENT
  duplicate-skip instead of error translation. Different shape (no exception path);
  the contract is "duplicates are silently skipped" enabling the ingestion-rewrite-by-establisher
  flow to operate without read-before-write logic. **The design choice**: DB enforces
  the invariant; the repository wrapper translates DB-level errors to application-level
  errors with HTTP-mapping-friendly types. The choice avoids pre-flight `existsBy`
  lookups on every create (saves one round-trip) at the cost of a try-and-catch error-handling
  pattern in callers. Centralised at ExceptionUtils + uniform across the repository
  layer.'
