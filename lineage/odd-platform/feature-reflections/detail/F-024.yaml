# Term Search & Browse (Dictionary tab) — product-owner reflection

## product_owner_narrative

The **Dictionary tab** is the Data Glossary pillar's front door for finding terms. An operator who has built up a business glossary — `finance/Customer`, `marketing/PII Tracking`, `compliance/Restricted Data Class` — comes here to locate a term across the whole catalog, read who owns it and how widely it is used, and click through to its detail page to edit it or link it to data entities. It is the "I want to find a term" surface, the sibling of F-002's "I want to link a term" surface; the two share the same controller, service, and repository tiers but answer different operator questions (per F-024 feature-flow `description` + `system-mission.md` P-06 primary user actions "search Terms; reverse-look-up every entity tied to a Term").

A user reaches the tab from the top navigation "Dictionary" item, which routes to `/termsearch` (per ToolbarTabs → `termsSearchPath()` → `termsRoutes.ts:5 TERMS_SEARCH_PATH`, recorded in the F-024 batch-ZH/ZJ entry points). On first arrival the React shell `TermSearch.tsx` silently creates a **server-side search session** (`POST /api/termsearch`), captures its UUID in the URL (`/termsearch/{uuid}`), and from then on every filter change is a `PUT` against that session and every page of results is a `GET` against it (per TermSearch.md understanding + operations; TermController.java:166-216 owns the six search-state endpoints). The session living on the server, keyed by a URL UUID, is the load-bearing design choice: it makes a filtered Dictionary view **deep-link-shareable** and **reload-survivable**, and it hands the cleanup problem to the shared `SearchFacetsHousekeepingJob` TTL (default 30 days, per F-010 / LSN-018 cross-link in TermSearch.md implicit_adrs[0]).

The working parts the operator interacts with are: a **free-text search box** (TermSearchInput — fires synchronously on Enter), a **left-sidebar facet filter** across three axes — namespace, tag, owner (TermSearchFilters; the facet axes are confirmed by `FTSConstants.TERM_CONDITIONS` = NAMESPACES/OWNERS/TAGS per ReactiveTermRepositoryImpl.md dependencies), an **infinite-scroll results table** at a fixed `pageSize=30` (TermSearchResults; the literal `30` is hardcoded in two places per TermSearch.md invariants[4]), and a permission-gated **"Add term" button** (gated UI-only by `TERM_CREATE` per TermSearch.md invariants[1]). Each result row shows the term name, its namespace, its owners, a flattened usage count, and created/updated timestamps (TermSearchResultItem per TermSearch.md concepts).

The integration story: the Dictionary tab is downstream of every term-authoring path (F-002 create/link), it indexes through the `term_search_entrypoint` materialised FTS table maintained by `ReactiveTermSearchEntrypointRepositoryImpl`, and it shares the `search_facets` session table + the `SearchFacetsHousekeepingJob` TTL infrastructure with the Discovery pillar's `/search/*` surface (F-017) — the two faceted-search features are structural twins (per F-024 description + the F-017 sibling reflection). Crucially, the read tier applies the platform-wide **read-collaborative posture**: there is no per-namespace or per-owner scoping at any layer (ReactiveTermRepositoryImpl.md invariants; `system-mission.md:267`), so every authenticated user sees every term in every namespace.

For a demo, the product owner would flag four edges: the tab opens to an **empty results table** on a fresh catalog (the search session's default query is empty — the page does not pre-list all terms); a **broken bookmark** to a 30-day-old session shows a stuck empty page; sharing a `/termsearch/{uuid}` URL **shares the session's filter state, not just a link**; and the search index can retain a **deleted term's vector** until a read happens to mask it. These edges are exactly where the user-facing promise and the assembled chain diverge, and they are the load-bearing findings below.

