proposed_canonical: Notifications
rationale: 'Outbound alert-notification subsystem is a first-class platform feature
  with its own live doc page (`features/active-platform-features/notifications`),
  three independently-configurable channels (Slack incoming webhook / generic JSON
  webhook / SMTP email), per-channel `@ConditionalOnProperty` activation, feature-flag
  gate (`notifications.enabled=false` by default read by `NotificationsFeatureCondition`),
  leader-elected single-thread WAL consumer, and 13+ surfaced bugs/limitations including
  HIGH-severity defects: no retry/DLQ/audit on failed delivery, email per-recipient
  silent partial delivery, no rate-limit (10k alerts → 10k Slack messages → Slack
  429 + drop), SMTP timeouts unset (hung server stalls ALL channels). main-concepts.md
  Terms & Aliases names ''Slack alert webhook'' (outgoing variant) but does NOT name
  ''Notifications'' as a canonical feature concept. HIGH-priority canonicalisation
  candidate: extend main-concepts.md and surface the channel sub-concepts.'
contributing_concepts:
- NotificationsProperties (top-level config POJO)
- WalProperties (replication-slot coordinates)
- EmailSenderProperties (sibling — notifications.receivers.email)
- AlertNotificationMessage (the delivered payload)
- DecodedWALMessage (WAL stream intermediate)
- NotificationSender (Slack | Webhook | Email — the polymorphic dispatch)
- notifications.enabled gate
- feature condition reading notifications.enabled directly from Environment
- lazy-create-no-drop replication slot + publication
- leader-elected single-thread WAL consumer at advisory lock 100
- fail-soft per-channel fan-out
suggested_add_to_docs: true
