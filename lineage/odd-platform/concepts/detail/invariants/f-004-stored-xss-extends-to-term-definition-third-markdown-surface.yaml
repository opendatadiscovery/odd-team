description: |-
  NEW INVARIANT, batch 2026-05-20U — STRENGTHENS the master F-004
  invariant markdown-rendering-via-rehype-raw-without-rehype-sanitize-stored-xss-surface-on-internal-description
  from 2-surface (data-entity description + dataset-field description)
  to 3-surface coverage by adding TermDefinition as the third user-curated
  Markdown surface that flows through the same vulnerable
  rehype-raw-without-rehype-sanitize pipeline.

  THE F-004 FINGERPRINT REMAINS IDENTICAL:

    Backend tier — term backend stores TermFormData.definition verbatim:
      - TermServiceImpl.createTerm (batch K — TermServiceImpl.java:99-117) +
        updateTerm (TermServiceImpl.java:121-145) accept TermFormData with
        no Jsoup.clean, no Encode.html, no allowlist, no length cap.
      - TermServiceImpl.handleDataEntityDescriptionTerms (TermServiceImpl.java:201-207)
        + handleDatasetFieldDescriptionTerms (TermServiceImpl.java:244-250)
        consume the SAME unsanitised Markdown body that the data-entity
        and dataset-field description flows produce — the regex parse for
        [[ns:term]] happens AFTER persistence, with the raw payload
        intact.
      - ReactiveTermRepositoryImpl carries no sanitisation in any mutation
        path.

    UI tier — TermDefinition.tsx renders via the platform's shared
    Markdown.tsx which uses MDEditor.Markdown from @uiw/react-md-editor:
      - TermDefinition.tsx:45 calls Markdown with value =
        transformDescriptionToMarkdown(definition).
      - Markdown.tsx:113-124 wraps MDEditor.Markdown which transitively
        pulls rehype-raw@6.1.1 per pnpm-lock.yaml:3900,5922,8843.
      - Grep over odd-platform-ui/src for rehype-sanitize returns ZERO
        matches (verified end-to-end in the batch-U TermDetails sidecar).

  THE NET ATTACK CHAIN — operationally equivalent to F-004:

    1. Adversary holds TERM_UPDATE on any term they can reach (or any
       authenticated user under the term-to-term-NO-SecurityRule failure
       — they don't even need TERM_UPDATE for the term-to-term variant).
    2. Adversary edits a term's definition or creates a new term with a
       payload like script_alert_one in the definition field. (Backticks
       are avoided in this YAML scalar — the payload contains an HTML
       script tag opening, an alert call, and a script tag closing.)
    3. TermFormData.definition flows through TermServiceImpl mutation
       paths and lands in term.definition column verbatim.
    4. Any subsequent viewer landing on /terms/term_id/overview triggers
       TermDetails.tsx mount → Overview.tsx → TermDefinition.tsx →
       Markdown.tsx → MDEditor.Markdown with rehype-raw → arbitrary
       HTML+JS execution.

  THE 3-SURFACE CLOSURE means F-004 is now fully end-to-end across the
  USER-CURATED MARKDOWN inventory:
    - data-entity internal_description (batch F + batch J primary source)
    - dataset-field internal_description (batch R primary source)
    - term definition (batch U primary source — THIS INVARIANT)

  THE READ-COLLABORATIVE COMPOUNDING:

    Per system-mission.md line 267 read-collaborative posture, every
    authenticated user sees every Term across every namespace. There is
    NO permission gate on the READ side of TermDetails (the
    WithPermissionsProvider wrap at TermDetails.tsx:59-70 covers only
    the Header's Edit/Delete affordances; the tab content renders
    unconditionally — per the partial-permission-gating invariant).
    Effect: an XSS payload planted by a single operator with TERM_UPDATE
    on a single term fires for EVERY authenticated viewer who reaches
    that term's detail page, regardless of their namespace, owner, or
    permission set.

  THE TERM-MENTION COMPOUND ATTACK:

    Per the [[ns:term]] auto-link side-channel (REFACTOR-227 — primary
    source TermServiceImpl batch K), a payload like
    open-bracket open-bracket script-tag alert one close-script-tag
    colon foo close-bracket close-bracket parses cleanly through the
    findTermsInDescription regex (line 67 of TermServiceImpl.java —
    char classes excluded-colon-star-eager and excluded-close-bracket-star-eager
    accept any character that is not colon or close-bracket).
    The unhandled-mention staging row data_entity_description_unhandled_term
    persists the payload in term_name varchar 255 and term_namespace_name
    varchar 64. Per batch K bugs_limitations_corner_cases.[3] F-004 XSS
    intersection on auto-link, the staging row payload re-emerges through
    the API on any subsequent getDataEntityTerms response that surfaces
    unhandled mentions. The XSS surface compounds: definition payload
    fires on direct view; mention payload fires on every entity that
    references the un-created term via [[ns:term]] syntax.

  THE BROWSER MITIGATION CAVEAT (inherited from F-004 master entry):

    P-009 slice-5/-6 probe (run R-20260519T020610Z-P-009) confirmed for
    the data-entity surface that the dangerous tags REACH THE DOM:
    dom_has_script_tag is True, dom_has_xss_img_id is True,
    dom_has_xss_iframe_id is True. Script execution is blocked by
    Chromium HTML-parser policy and React attribute filtering — defence-in-depth
    mitigations, NOT application-layer defences. Relaxing CSP, switching
    to dangerouslySetInnerHTML, or testing on a different browser
    (Firefox / Safari not empirically verified) re-opens the surface.
    The TermDefinition surface has NOT been probed independently in
    batch U — the inference is structural (same Markdown.tsx shared
    element; same rehype-raw with no rehype-sanitize) and the probe
    inference should hold. A P-N probe pinning the TermDefinition
    surface specifically is recommended.

  THE PLATFORM-WIDE CLOSURE — separate companion invariant:

    Beyond the three user-curated Markdown surfaces, the platform's
    Markdown.tsx is the SOLE renderer across every Markdown affordance:
    Term definitions (this invariant), data-entity description, dataset-
    field description, alert descriptions, query-example descriptions,
    owner descriptions. A single rehype-sanitize addition at Markdown.tsx
    fixes ALL surfaces simultaneously. The companion invariant
    'no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic'
    (batch U — see sibling file) records the systemic absence
    Grep-verified across the entire UI tree.

  SEVERITY HIGH — extends the existing F-004 HIGH severity to the
  third user-curated Markdown surface; combined with the read-collaborative
  posture's all-authenticated-users see-all-Terms rule, the impact set
  of a single TERM_UPDATE-holder is the entire platform's authenticated
  user population.
