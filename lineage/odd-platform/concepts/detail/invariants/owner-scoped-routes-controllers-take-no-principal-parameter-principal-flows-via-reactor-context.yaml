name: |-
  Owner-scoped routes — controllers take NO principal parameter; principal flows
  via reactor Context
canonical_in_docs: false
canonical_candidate: false
description: |-
  PRIMARY-SOURCE confirmation of ADR-CANDIDATE-015. **STRENGTHENED batch
  2026-05-19M — third controller-method PRIMARY SOURCE** — the three
  getMyObjects* methods on DataEntityController accept only (page, size,
  exchange); no Authentication, no Principal, no owner-id query/path/body
  parameter. Resolution happens at DataEntityServiceImpl.java:213 (for the
  base /my path) and at DataEntityRelationsServiceImpl.java:26 (for the
  /my/upstream and /my/downstream paths) via
  authIdentityProvider.fetchAssociatedOwner() which internally calls
  ReactiveSecurityContextHolder.getContext()
  (AuthIdentityProviderImpl.java:24-35). The contrast with sibling
  controllers' read-collaborative cross-owner reads (getDataEntityDetails
  accepting only (id, exchange) and emitting identical payload for every
  authenticated caller) makes the deliberate asymmetry visible at the
  controller-method shape.

  Owner-scoped routes are intentionally NOT in SECURITY_RULES — they fall
  through to .pathMatchers('/**').authenticated() AND apply per-Owner
  filtering via JOIN OWNERSHIP at the SQL layer (defence-in-depth at the
  data layer, not the auth gate). **TWO distinct postures within the
  triplet, confirmed by batch M PRIMARY SOURCE**:
    (a) **getMyObjects** (batch G PRIMARY SOURCE) — JOIN-side-defended at
        ReactiveDataEntityRepositoryImpl.java:515-534 with explicit
        WHERE OWNERSHIP.OWNER_ID = ?; defence-in-depth at the SQL layer;
    (b) **getMyObjectsWithUpstream + getMyObjectsWithDownstream** (batch M
        PRIMARY SOURCES) — anchor-set ONLY at
        DataEntityRelationsServiceImpl.java:26; downstream listByOddrns has
        NO JOIN-side defence-in-depth (REFACTOR-225 single-point-of-failure).

  **Three controller-method sites of the convention applied uniformly**:
  the maintainer chose (page, size, exchange) as the controller signature
  for all THREE members of the /my* triplet; no method accepts an
  Authentication, Principal, or owner-id parameter; the principal is read
  inside the service chain via reactor Context. This is the FULL primary-
  source set for the convention's application; it applies to the entire
  owner-scoped surface, not just one method.
