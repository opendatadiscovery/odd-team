behaviour: |-
  **MEDIUM — Housekeeping `DROP TABLE <activity_partition>` takes `ACCESS EXCLUSIVE` lock on the parent activity table, blocking all concurrent SELECTs and INSERTs touching that partition.** Different victim than TEST-GAP-870 (which addresses the empty-check-vs-drop race producing silent data loss); this gap addresses the READ-side lock collision: a `/api/activity` query (`findAllActivities`, `findDataEntityActivities`, etc.) that needs ACCESS SHARE on every child partition it scans will BLOCK behind a housekeeping DROP TABLE on any one of those partitions. Under sustained read traffic + partition cycling, reads stall in a measurable, observable, but currently unmeasured way.

  **Primary-source chain**:
  - `PartitionServiceImpl.java:120-127` — `DROP TABLE %s.formatted(partitionName)` issued via raw JDBC by the housekeeping cycle
  - `HousekeepingJobManager.java:32` — `pgConnectionFactory.getConnection()` shared across all 5 housekeeping jobs; sequential within the cycle
  - `ReactiveActivityRepositoryImpl.java:73-89` (`findAllActivities`) — SELECT requires ACCESS SHARE on every partition it touches via partition routing
  - `ReactiveActivityRepositoryImpl.java:128-142` (`findDataEntityActivities`) — same lock requirement
  - `ReactiveActivityRepositoryImpl.java:50-54` (`saveReturning`) — INSERT requires ROW EXCLUSIVE on parent + child partition
  - `ReactiveActivityRepositoryImpl.java:57-71` (`save` batch) — same INSERT path
  - PostgreSQL lock-modes documentation: ACCESS EXCLUSIVE conflicts with ALL other lock modes including ACCESS SHARE and ROW EXCLUSIVE

  **The lock-collision shape** (per ReactiveActivityRepositoryImpl.md:stress_findings.E1):
  1. Housekeeping cycle T=0: identifies empty past partition `activity_20240101_20240301`
  2. Empty-check passes (count(*) = 0)
  3. UI user T=1ms: requests `/api/activity?begin_date=2024-02-01&end_date=2024-02-28&size=100` (touches the targeted partition for SELECT)
  4. Postgres routes the SELECT through the parent table; the SELECT needs ACCESS SHARE on `activity_20240101_20240301`
  5. Housekeeping T=2ms: issues `DROP TABLE activity_20240101_20240301`; the DROP needs ACCESS EXCLUSIVE
  6. Lock arbitration: ACCESS EXCLUSIVE conflicts with the held ACCESS SHARE → DROP queues behind the SELECT (typically wins after SELECT completes)
  7. Meanwhile, ANOTHER SELECT from a different client at T=3ms tries to acquire ACCESS SHARE → it queues behind the queued DROP → cascading stall
  8. Net effect: a single slow SELECT during a housekeeping cycle can stall multiple subsequent SELECTs/INSERTs

  **Operator-visible consequences**:
  - **Latency spikes during housekeeping cycles**: a `/api/activity` query that normally returns in 50ms can take 5+ seconds during a housekeeping cycle that's dropping an old empty partition stuck behind a slow read.
  - **Sustained partition-cycling load amplifies the effect**: a deployment configured with `partition_period=1` (daily cycles per the docs' "narrower partitions for performance" guidance) drops MORE partitions per cycle → more lock-collision windows.
  - **F-010 `shedlock_window_dangerously_close_to_schedule` interaction**: a 14m-or-longer housekeeping cycle that's stalled behind a slow query can OVERLAP with the next scheduled cycle, producing cascading log noise (`relation does not exist` from the second instance).

  **Why MEDIUM not HIGH**:
  - The lock collision is **not data-loss** (unlike TEST-GAP-870's silent INSERT loss)
  - The lock collision is **observable** (latency spike, lock-wait log lines if enabled)
  - The empirical hit rate depends on: write volume × partition-empty-cycle rate × concurrent read traffic
  - We rate MEDIUM because: (a) the latency impact is operationally visible; (b) the empirical hit rate is high in production (multi-year deployments with 60+ partitions cycle through empty-checks every 15 min); (c) the read-path stall is invisible to the user beyond "this query is slow" — no error, no metric.

  **Why this is a SEPARATE gap from TEST-GAP-870**:
  - **TEST-GAP-870 scope**: silent data loss when a CONCURRENT INSERT lands in a partition between empty-check and DROP
  - **TEST-GAP-875 scope**: lock-collision LATENCY when a SELECT/INSERT touches a partition concurrently being dropped — the victim is read throughput, not data
  - Both are surfaced by P-022 (different facets of the same DDL lock contention)

  **Connection to probe P-022**:
  - The sidecar emits P-022 to MEASURE the lock-collision behaviour empirically
  - This TEST-GAP is the regression-pin AFTER P-022 confirms the timing

  **Connection to TEST-GAP-880**:
  - TEST-GAP-880 pins read-during-DDL with CLIENT-DISCONNECT (does the in-flight DB query cancel?)
  - TEST-GAP-875 (this) pins read-during-DDL with NO disconnect (does the DDL stall behind the read?)
  - Both surfaces are part of the read-vs-DDL contract; this gap is the steady-state stall measurement
