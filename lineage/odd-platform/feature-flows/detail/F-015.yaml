terminal_side_effect:
  side_effect_class: page-render
  description: |-
    200 OK with `Flux<DataEntityRef>` (paginated; default UI fetch is
    size=5) of the NON-owned single-hop upstream-or-downstream adjacent
    set — entities the caller does NOT own that are referenced in
    LINEAGE rows touching the caller's owned set. Same DataEntityRef
    shape as the base /my endpoint and the search/listByOwner endpoints.
  evidence: |-
    DataEntityController.java:291-297 (downstream) + :299-305 (upstream)
    + DataEntityServiceImpl.java:218-225 + DataEntityRelationsServiceImpl.java:25-39
    + ReactiveDataEntityRepositoryImpl.java:228-253.
  cardinality_per_call: |-
    0..size rows per request. Default UI size=5; OpenAPI PageParam/SizeParam
    carry no minimum/maximum (components.yaml:4213-4229); a caller passing
    size=1_000_000 triggers the full derived-set materialisation in memory
    THEN SQL pagination slices the materialised list.
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: anchor-set single-point-of-failure (REFACTOR-225 PRIMARY-SOURCE)
    observed: |-
      Owner-scoping is enforced at EXACTLY ONE site —
      `DataEntityRelationsServiceImpl.java:26` (`authIdentityProvider.fetchAssociatedOwner()`).
      Downstream the lineage CTE (`ReactiveLineageRepositoryImpl.java:122-176`)
      has NO OWNERSHIP join NO owner predicate; the final projection
      `listByOddrns` (`ReactiveDataEntityRepositoryImpl.java:228-253`) is
      a pure `WHERE DATA_ENTITY.ODDRN.in(...)` scan with no owner JOIN.
      A regression at the anchor (fallback owner-id under DISABLED, a
      misordered WebFilter dropping SecurityContext, USER_OWNER_MAPPING
      corruption returning wrong owner, flatMap-vs-map typo) silently
      leaks the lineage neighbourhood of an unintended owner. Today's
      code is correct; the architecture provides ZERO defence against a
      future regression at this single load-bearing call site. CONTRAST
      with the base `/my` endpoint's repository method `listByOwner`
      (`ReactiveDataEntityRepositoryImpl.java:515-534`) which DOES JOIN
      OWNERSHIP — a regression there at worst leaks entities the user
      genuinely co-owns with the wrong owner.
    expected: |-
      Add `listByOddrnsAndOwner(oddrns, ownerId)` repository method (or
      a `Long ownerId` parameter to `listByOddrns`) that JOINs against
      OWNERSHIP with `WHERE OWNERSHIP.OWNER_ID = ?` as belt-and-braces
      filter. OR document the single-point-of-failure architecture
      explicitly so a future maintainer understands the constraint.
    drift_class: anchor_set_single_point_of_failure
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      bugs_limitations_corner_cases[0] + security.known_security_gaps[0]
      + security.owner_scoping + DataEntityRelationsServiceImpl.java:25-31
      + ReactiveDataEntityRepositoryImpl.java:228-253 (no owner JOIN) vs
      :515-534 (the contrast site, JOIN-defended). 4-angle triangulated
      across batch-G (`getMyObjects`) + batch-H (`ReactiveLineageRepositoryImpl`)
      + batch-I (`LineageServiceImpl` NEGATIVE case) + batch-M (this
      endpoint pair, controller-method PRIMARY SOURCE for both UPSTREAM
      + DOWNSTREAM). Severity: HIGH (latent — today correct, regression
      vector unmitigated).
  - facet: OpenAPI summary inversion (DOC-GAP-099 inverse-semantic, 4-angle triangulated)
    observed: |-
      `openapi.yaml:843-844` declares `getMyObjectsWithUpstream` summary
      as "Get my objects with upstream dependencies" and description as
      "Returns list of data entities owned by current user with upstream
      dependencies". Symmetric copy at `openapi.yaml:861-862` for
      `getMyObjectsWithDownstream`. The actual response is the INVERSE:
      the NON-owned upstream/downstream-adjacent set
      (`Predicate.not(oddrns::contains)` at
      `DataEntityRelationsServiceImpl.java:37` explicitly excludes the
      owned set). UI label `Upstream dependents` at `OwnerEntitiesList.tsx:87`
      is semantically accurate — the UI consumer renders the response
      correctly because the front-end was written against the
      implementation, not against the spec. Third-party API consumers
      building integrations against the OpenAPI contract receive the
      wrong shape — either consuming the response as "my entities"
      (wrong: they're not theirs) or never realising the discrepancy
      because the DataEntityRef shape is the same as the /my endpoint.
    expected: |-
      Either: (a) rewrite the OpenAPI summaries to match the
      implementation — e.g. "Returns list of data entities upstream of
      the current user's owned set (entities the user does not own that
      flow INTO entities they own)"; OR (b) document the three-endpoint
      composition (`/my` + `/my/upstream` + `/my/downstream` answering
      "what do I own?" / "what flows IN?" / "what flows OUT?") on the
      Data Lineage feature page and the Permissions page.
    drift_class: spec_says_X_impl_does_Y
    provenance: |-
      STATIC — primary-source 4-angle triangulated: batch-G via
      `getMyObjects` sidecar (the contrasting positive case) + batch-H
      via `ReactiveLineageRepositoryImpl` no-owner-JOIN SQL primary
      source + batch-I via `LineageServiceImpl` NEGATIVE-CASE SIBLING +
      batch-M via this batch's two sidecars (controller-method primary
      source for both UPSTREAM + DOWNSTREAM). DOC-GAP-099 promoted from
      a candidate to PRIMARY-SOURCE-CONFIRMED. Severity: HIGH.
  - facet: silent-empty indistinguishable from no-owner-link / no-data
    observed: |-
      Four distinct conditions produce the SAME HTTP 200 + `[]`
      response: (a) caller has no `USER_OWNER_MAPPING` row;
      (b) caller's owner exists but owns zero entities; (c) owned
      entities exist but have no upstream/downstream LINEAGE edges; (d)
      no SecurityContext is populated (e.g. DISABLED auth mode —
      `fetchAssociatedOwner` emits empty -> anchor empty -> derived
      empty). There is no 401, no 403, no `OwnerNotAssociatedException`,
      no signal in the response distinguishing the four cases. A new
      operator hitting this endpoint and receiving `[]` has no path to
      debug whether the platform thinks they own nothing, thinks they're
      not linked to an owner, or has no upstream data to show.
    expected: |-
      Either: (a) discriminate the four cases at the HTTP layer (401 for
      no SecurityContext, 403 for no owner link, 200+`[]` for genuine
      empty-data); OR (b) include a metadata envelope in the response
      naming which case applies; OR (c) document the unified empty
      response explicitly on the Data Discovery / Data Lineage pages.
    drift_class: silent_empty_indistinguishable_from_unlinked
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      bugs_limitations_corner_cases[3] + invariants[4] +
      DataEntityRelationsServiceImpl.java:26-30 (empty anchor propagates)
      + DataEntityServiceImpl.java:218-225 (no .switchIfEmpty). Same
      shape as the base /my endpoint per batch-G. Severity: LOW
      (information-quality issue).
  - facet: unbounded anchor-set IN-clause fan-out (admin-owner DoS)
    observed: |-
      `dataEntityRepository.listByOwner(o.getId())` at
      `DataEntityRelationsServiceImpl.java:27` fetches ALL owned entities
      with NO pagination — an admin owner or CI-bot owner owning thousands
      of entities materialises the entire owned-entity table-slice into
      the JVM. Then `getLineageRelations(oddrns, LineageDepth.empty(),
      UPSTREAM)` constructs a CTE with `WHERE CHILD_ODDRN IN (?, ?, ...)`
      where the IN-list cardinality equals the full anchor-set size.
      Postgres planner cost is non-linear above ~1000 IN elements; jOOQ
      does not paginate the IN clause. The lineage-CTE result is then
      `.distinct().filter.collectList()` — fully materialised in memory
      BEFORE pagination kicks in at `listByOddrns`'s SQL LIMIT/OFFSET.
      Memory and DB-CPU cost scale with anchor set size, NOT with the
      requested page size.
    expected: |-
      Either: (a) cache the owned-oddrn set per-session (currently no
      caching at any layer); OR (b) bound the anchor at SQL — e.g.
      `listByOwner(ownerId, ANCHOR_MAX)` defaulting to a sensible cap
      with a request-rejection if exceeded; OR (c) push pagination into
      the derived-set SQL by passing `oddrns` + `(page, size)` to a
      single `listByOddrnsLineagePaginated` method that does the
      JOIN-LATERAL-style lineage-fetch INSIDE the paginated query.
    drift_class: unbounded_in_clause_anchor_fanout
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      bugs_limitations_corner_cases[2] +
      performance.known_performance_gaps[0,1,2] +
      DataEntityRelationsServiceImpl.java:27 (no `(page, size)` on
      listByOwner) + :34 (no IN-list bound on getLineageRelations) +
      :35-38 (in-memory dedup defeats SQL pagination). Severity: MEDIUM
      (operationally — the endpoint is meaningful only for small
      ownership cardinalities). Proposed local k6 probe: seed an
      "admin" owner with 10k owned entities + invoke /my/upstream with
      `size=5` + measure response time vs same call for a typical
      owner with 5 owned entities.
  - facet: in-memory dedup defeats SQL pagination (cost O(anchor) not O(page))
    observed: |-
      `.flatMap.distinct.filter.collectList()` at
      `DataEntityRelationsServiceImpl.java:35-38` materialises the full
      deduplicated derived-oddrn set in JVM memory before passing to
      `listByOddrns`. SQL `LIMIT 5 OFFSET 0` then slices the materialised
      list, but the cost-per-call is fixed by the unscoped derived set
      size. Reactive backpressure is defeated — the lineage-Flux is
      collapsed via `.collectList()`, the entire derived oddrn list lands
      in heap, then a separate Flux is materialised for the final
      listByOddrns call.
    expected: |-
      Replace `.collectList()` + `listByOddrns(list, ...)` with a
      streaming join that pages through derived oddrns directly. Or
      accept the O(anchor) memory cost and document the constraint.
    drift_class: in_memory_dedup_defeats_sql_pagination
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      performance.throughput_characteristics[2] +
      bugs_limitations_corner_cases[2] +
      DataEntityRelationsServiceImpl.java:35-38. Severity: MEDIUM.
  - facet: unstable pagination from missing ORDER BY on listByOddrns
    observed: |-
      `ReactiveDataEntityRepositoryImpl.java:247-250` builds
      `DSL.selectFrom(DATA_ENTITY).where(conditions).limit(size).offset(...)`
      with NO `.orderBy(...)` call. Postgres documents pagination without
      ORDER BY as "undefined" — the planner is free to return rows in
      heap-scan order, which may change across consecutive identical
      queries (especially under concurrent writes). Pagination across
      pages may produce duplicates and/or missing entries between
      consecutive requests. A UI re-fetching `page=2, size=5` after
      `page=1, size=5` may see entity X on BOTH pages or on NEITHER.
    expected: |-
      Add `.orderBy(DATA_ENTITY.ID.asc())` (or a stable user-meaningful
      ordering) before the `.limit/.offset` call. This is the canonical
      fix used throughout the rest of the platform.
    drift_class: unstable_pagination_no_order_by
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      performance.scaling_characteristics[3] +
      bugs_limitations_corner_cases[5] +
      ReactiveDataEntityRepositoryImpl.java:247-250 (the missing
      ORDER BY). Severity: MEDIUM (pagination correctness).
  - facet: hollow+soft-deleted entities silently excluded from derived set
    observed: |-
      `DataEntityServiceImpl.java:223` passes `includeHollow=false,
      includeDeleted=false` to `listByOddrns`. If an upstream LINEAGE
      edge points to a hollow entity (oddrn-only stub created during
      ingestion when the parent isn't yet ingested) or a soft-deleted
      entity, the LINEAGE row is in the derived oddrn set, but the
      entity is filtered out at the final scan. The caller's response is
      shorter than the lineage suggests — no signal that the upstream
      graph contains stubs / deleted entities. This may be intentional
      (don't show stubs in user-facing UI tiles) but is undocumented.
    expected: |-
      Document the includeHollow=false / includeDeleted=false default
      behaviour OR include a tombstone-counter field in the response
      indicating "N upstream stubs / deleted entities elided".
    drift_class: hollow_and_softdelete_silent_exclusion
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      invariants[8] + bugs_limitations_corner_cases[4] +
      DataEntityServiceImpl.java:223 + ReactiveDataEntityRepositoryImpl.java:228-253.
      Severity: LOW.
  - facet: Data Lineage / Permissions docs silent on owner-anchored lineage view
    observed: |-
      Live Data Lineage feature page (`documentation/docs/data-lineage.md:5-29`
      + WebFetch 2026-05-19 at `https://docs.opendatadiscovery.org/features/data-lineage`)
      describes the pillar across data-object + microservices lineage,
      lists subsections, the per-entity Lineage tab + Group lineage entry
      point, the API Reference page for per-entity / group / microservices
      lineage APIs — but does NOT mention `/api/dataentities/my/upstream`
      or `/api/dataentities/my/downstream` or `getMyObjectsWithUpstream` /
      `getMyObjectsWithDownstream`. Live Permissions page (WebFetched
      2026-05-19 status 200) documents the 5 permission categories but
      does NOT name a permission code that gates these endpoints — they
      rely entirely on user-owner-association, not the RBAC catalogue.
      An operator auditing "which endpoints are owner-scoped vs cross-owner?"
      has no doc path that names this endpoint family.
      UPDATE 2026-06-04 (feature-reflector F-015): RESOLVED IN LIVE DOC —
      documentation/docs/data-lineage.md now carries a full "My-objects
      triplet — composition + anchor architecture" section (lines 24-67)
      documenting the triplet, the non-owned-but-reachable semantic, the
      OpenAPI-summary inversion as a known bug, the single-point-of-failure
      anchor architecture, the unbounded fan-out, and the four-way silent
      empty (with the /api/identity/whoami + /api/dataentities/my
      cross-check workaround). The doc-silence is closed; the OpenAPI spec
      inversion (DOC-GAP-099) remains live.
    expected: |-
      Add a Data Lineage subsection or Permissions subsection that names
      the `/my*` triplet, explains the anchor-set-defended posture,
      documents the OpenAPI-summary inversion as a known doc bug under
      maintenance, and disambiguates "owned by current user" from
      "in the lineage neighbourhood of the current user's owned set".
      [Largely satisfied as of 2026-06-04 — see observed UPDATE.]
    drift_class: doc_silent_on_owner_anchored_lineage_view
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      docs_link_semantic.inferred_docs[0,1,2] + doc_drift_findings[1,2]
      + live `permissions.md` WebFetched 2026-05-19 status 200 + local
      `data-lineage.md:5-29`. Severity: MEDIUM (P-09 + P-05 doc-coverage
      gap). [Re-verified 2026-06-04: data-lineage.md:24-67 now documents
      the triplet — facet RESOLVED IN LIVE DOC.]
  - facet: LineageDepth.empty() fragile sentinel encoding
    observed: |-
      `DataEntityRelationsServiceImpl.java:34` passes `LineageDepth.empty()`
      to `getLineageRelations`. Per `LineageDepth.java:16-18`,
      `empty()` returns `new LineageDepth(-1, true)`. The recursive-CTE
      termination predicate at `ReactiveLineageRepositoryImpl.java:174`
      consults ONLY the int depth field via `tDepth.lessThan(lineageDepth.getDepth())`;
      with depth=-1 the recursive UNION ALL never fires (seed-only). But
      a maintainer reading only the call site sees `LineageDepth.empty()`
      and may reasonably misinterpret "empty" as "no depth limit /
      unlimited recursion" rather than "single-hop only". The class-level
      `boolean empty` field is the explicit disambiguation, but the CTE
      ignores it. A future refactor changing the termination to
      `lessThanOrEqual` would silently expand this endpoint to two hops
      because the `empty=true` flag is not honoured by the CTE.
    expected: |-
      Either: (a) rename the factory to `LineageDepth.seedOnly()` /
      `singleHop()` so the call-site is self-documenting; OR (b) make
      the CTE honour the `empty=true` flag explicitly (early-return at
      seed); OR (c) inline-comment the call site naming the seed-only
      semantic.
    drift_class: spec_says_X_impl_does_Y
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      bugs_limitations_corner_cases[6] +
      `LineageDepth.java:8-19` (the dual-encoding) +
      `ReactiveLineageRepositoryImpl.java:174` (the sentinel-driven
      guard). Severity: LOW (works correctly today; the gap is
      documentation / naming clarity).
  - facet: no JOIN-side defence-in-depth contrast with /my endpoint
    observed: |-
      The base `/my` endpoint routes via
      `ReactiveDataEntityRepositoryImpl.listByOwner` (lines 515-534)
      which JOINs OWNERSHIP and applies
      `WHERE OWNERSHIP.OWNER_ID = ?` as the SQL-layer scoping. The
      `/my/upstream` and `/my/downstream` endpoints route via
      `listByOddrns` (lines 228-253) which is a generic IN-set scan
      with NO OWNERSHIP join. The existence of two distinct repository
      methods is the structural evidence of intent — if the maintainer
      wanted the lineage variants to be JOIN-defended, they would have
      constructed an `listByOddrnsAndOwner(oddrns, ownerId)` method or
      added a `Long ownerId` parameter; the absence of either is the
      architectural decision.
    expected: |-
      Add `listByOddrnsAndOwner(oddrns, ownerId)` and route the lineage
      variants through it, OR document the deliberate
      anchor-set-only-defence posture inline.
    drift_class: no_join_side_defence_in_depth
    provenance: |-
      STATIC — primary-source in batch-M getMyObjectsWithUpstream sidecar
      implicit_adrs[2] (the deliberate two-method structural choice) +
      ReactiveDataEntityRepositoryImpl.java:228-253 vs :515-534. The
      same architectural choice carries across the
      `getMyObjectsWithDownstream` sibling per batch-M's second sidecar
      bugs_limitations_corner_cases[0]. Severity: HIGH (latent — paired
      with the anchor-set-single-point-of-failure facet above).
