proposed_action: |-
  Testcontainers integration test. (a) Create owner A with entity a1; entity b1 with edge b1->a1; entity c1 with edge c1->b1. (b) Authenticate uA. (c) GET /api/dataentities/my/upstream. (d) Assert response contains b1 (one hop upstream of a1). (e) Assert response does NOT contain c1 (two hops upstream — would only appear if recursion fired). (f) Test comment 'LOCKS the LineageDepth.empty() = single-hop-only semantic as of 2026-05-19. The encoding is fragile (depth=-1 + boolean empty=true with only the int read by the CTE); if a future refactor changes the CTE termination predicate to lessThanOrEqual, c1 would appear in the response and this test would FAIL — exactly the regression-catcher needed.' Pair with /my/downstream symmetric test.
