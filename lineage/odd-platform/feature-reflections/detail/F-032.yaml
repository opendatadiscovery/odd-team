- id: H-011
  hypothesis: |
    When an operator reads the three rings together, they account for all of
    the operator's tables — i.e. the Table Health ring's healthy+warning+error
    counts cover every Table-type dataset, so a Table is always represented
    somewhere on the dashboard.
  derivation: "Response-shape + negative-space: a product owner reading three aggregate rings assumes they partition the population; the question is whether a table with no DQ tests is counted."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The Table Health ring counts ONLY datasets that have at least one DQ test.
      Its three CTEs (healthy / error / warning) all derive from datasets
      reached via DATA_QUALITY_TEST_RELATIONS
      (ReactiveDataQualityRunsRepositoryImpl.java:111-157); a dataset with NO DQ
      test falls into NONE of the three buckets — it is silently absent from the
      Table Health ring entirely. Such a table appears only as a "Not Monitored"
      slice in the separate Monitored Tables ring (and only if it is TABLE-type
      — Views/Files/Topics are excluded from Monitored Tables too,
      ReactiveDataQualityRunsRepositoryImpl.java:179). So the three rings do NOT
      partition the operator's tables: a Table with no tests is in neither the
      Table Health ring nor (if non-TABLE) any ring. Separately, the HEALTHY CTE
      treats a SKIPPED latest run as NOT-healthy -> WARNING, which an operator
      may not expect.
    evidence:
      - sidecar: odd-platform__java__DataQualityRunsController__controller-class__DataQualityRunsController.md
        section: bugs_limitations_corner_cases + name_behavior_pairs (getLatestTablesHealth) + invariants
        cite: "ReactiveDataQualityRunsRepositoryImpl.java:111-157 (health CTEs via DATA_QUALITY_TEST_RELATIONS) + :179 (TABLE-only Monitored)"
        note: "datasets without a DQ test are in no health bucket; non-TABLE excluded from Monitored"
    operator_visible_failure: |
      An operator reads "Table Health: 12 healthy, 2 warning, 1 error" and
      concludes they have 15 tables. They actually have, say, 200 tables, 185 of
      which have no DQ test and are invisible to the ring. The dashboard
      silently equates "tables with DQ coverage" with "tables," so it
      systematically understates how much of the catalog is UNTESTED — the exact
      blind spot a quality dashboard exists to surface. A deployment that uses
      only Views (not Tables) shows 0/0 in Monitored Tables and an empty Table
      Health ring, reading as "no DQ tests anywhere" when the truth is "no
      Table-type entities exist." The fix is to disclose the
      counted-population scope (tables-with-tests, TABLE-type-only) on the
      dashboard and the doc.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_projection:
      uc_id: F-032-UC-11
      kind: render   # what the three rings represent vs the operator's partition assumption
      promise: "The three rings account for the operator's tables — a Table is always represented somewhere — or the dashboard discloses the counted-population scope (tables-with-DQ-tests, TABLE-type-only)."
      coverage: unverified
      test_ref: null
      test_demand: functional   # a backend/integration test seeding a Table with NO DQ test + a View with a DQ test, then asserting the Table is absent from Table Health and the View is absent from Monitored Tables (pins the non-partition)
      test_demand_note: "No test pins the counted-population scope. The demand: seed a Table with zero DQ tests and a non-TABLE entity with a DQ test; assert the Table is in NO health bucket and the non-TABLE is excluded from Monitored. NEW drift class; routes to a net-new doc-gap caveat + this guard."

- id: H-012
  hypothesis: |
    When an operator builds a multi-dimension filter slice, clicks into a
    dataset, then clicks Back, the dashboard returns to the slice they built —
    i.e. the filter selection survives in-session navigation.
  derivation: "UX-question (consistency / convenience, Rule 9) + endpoint-shape: a product owner asks whether a built filter slice survives the normal click-into-detail-and-back flow."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      Partly: it survives ONLY via the URL, and only if the operator navigated
      via a URL that carried the filters. DataQuality.tsx wraps the dashboard in
      DataQualityAtomProvider — a fresh jotai <Provider> per mount
      (DataQualityProvider.tsx:4-6). The /data-quality route is a single
      non-wildcard <Route> (App.tsx:73); React Router unmounts the element on
      navigate-away, destroying the Provider and its atom scope; the next mount
      starts a fresh formFiltersAtom at the all-empty default (DataQualityStore
      .ts:11-22). The ONLY persistence channel is the URL search params written
      by DataQualityFilters' second useEffect (DataQualityFilters.tsx:46-54).
      Whether a browser Back fully reconstructs the selection from those params
      on remount depends on the mount-sync useEffect (DataQualityFilters.tsx
      :28-43) and is what probe P-120 verifies — the static trace shows the
      mechanism exists but cannot confirm it round-trips losslessly (the URL
      carries id+name JSON; the hydration parses it back). So: bookmarked/shared
      filtered URL -> survives; plain in-app navigate-away-and-back -> the jotai
      store resets and reconstruction depends on the URL having been written and
      re-read, which P-120 pins.
    evidence:
      - sidecar: odd-platform__ts__jotai-store__store__DataQualityStore.md
        section: bugs_limitations_corner_cases[1] + stress_findings.resource_boundaries
        cite: "DataQualityStore.ts:11-22 (all-empty default) + DataQualityProvider.tsx:4-6 + App.tsx:39,73"
        note: "per-Provider-mount scope resets on navigate-away; URL is the only persistence"
      - sidecar: odd-platform__ts__react-component__component__DataQualityFilters.md
        section: implicit_adrs[2] + operations
        cite: "DataQualityFilters.tsx:28-54 (the two URL-sync useEffects)"
        note: "URL round-trip is the reconstruction channel; P-120 verifies it round-trips"
    operator_visible_failure: |
      An operator builds a careful multi-chip slice (namespace + owner + tag),
      clicks a dataset to investigate, clicks Back — and (unless the URL fully
      reconstructs) lands on the unfiltered catalog-wide dashboard, losing their
      slice with no warning. They must rebuild it from scratch. This is the kind
      of UX contract a global (redux) store would preserve by default and the
      per-Provider jotai store inverts. The doc is silent on the default state
      and on filter persistence. Whether reconstruction is lossless is the open
      runtime question (P-120) — until then this is `partial`, not a full
      contradiction. The product fix is to ensure the URL round-trip is lossless
      (so Back works) and to document the bookmark-to-persist affordance.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: P-120
    routes_to_finding: caveat-candidate
    use_case_projection:
      uc_id: F-032-UC-12
      kind: edit-reconcile   # build a selection, navigate, reconcile it back
      promise: "A built filter slice survives a click-into-a-dataset-and-Back — the operator returns to the slice they built, not the unfiltered dashboard."
      coverage: unverified
      test_ref: null
      test_demand: functional   # an e2e: build a multi-chip slice, navigate to a dataset, click Back, assert the chips/rings are restored (P-120 pins whether the URL round-trip is lossless)
      test_demand_note: "Partial — survives via URL only. The demand: an e2e that builds a slice, navigates to a dataset detail, clicks browser Back, and asserts the filter chips + the filtered rings are restored. P-120 pins the lossless-ness. Routes to DOC-GAP-267 + this guard."

