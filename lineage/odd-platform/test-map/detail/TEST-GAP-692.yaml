proposed_action: |-
  Add `AlertServiceImplUpdateStatusAuthTest.updateStatus_anonymousCallerUnderDisabledAuth_completesWithNullUpdatedBy_pinsAuditAttributionLeak` as a SpringBootTest with `auth.type=DISABLED` profile. (a) Seed an OPEN alert id=A on a known data entity. (b) Make a `PUT /api/alerts/A/status` request with body `{"status": "RESOLVED"}` from a WebTestClient with NO authentication. (c) Assert HTTP 200. (d) Query `SELECT status_updated_by FROM alert WHERE id = A`. Expect NULL. (e) Query the activity_event table for the alert's most recent entry. Assert `created_by IS NULL`. (f) Add a `// REGRESSION-PIN — updateStatus's switchIfEmpty fallback (line 119) silently accepts null usernames. Under DISABLED, anyone can mutate any alert with no actor attribution. A REFACTOR adding a required-principal guard will break this test; a REFACTOR strengthening AuthIdentityProvider to throw rather than empty will also break this test. The audit-attribution-leak is the F-007 unauthenticated_payload_trust facet at the updateStatus tier (distinct from the AlertManager webhook path).` comment block.
