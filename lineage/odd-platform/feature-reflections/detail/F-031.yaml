# Data Source Lifecycle — product-owner reflection

## product_owner_narrative

Data Source Lifecycle Management is the operator-facing CRUD-plus-token-rotation surface under **Management → Datasources** (the `/management/datasources` SPA route). It is the FOURTH P-08 UI-admin lifecycle sibling alongside Owner (F-019), Collector (F-020), and Namespace (F-028) lifecycles, and it is the most-frequently-used Management surface per the daily-ops sequence (per `system-mission.md:222-247` P-08 pillar block + F-031 frontmatter `cross_pillar_relationships`). From the operator's seat it is one screen — `DataSourcesList` (`DataSourcesList.tsx:28-126`) — headed "Datasources" with a live "N datasources overall" count, a "Search datasource" box, an "Add datasource" button, and a vertically-scrolling list of cards (one `DataSourceItem` per source: logo, name, ODDRN, description, namespace, and a masked collector token), reached only by a user holding at least one `DATA_SOURCE_*` permission (per `DataSourcesList.md` understanding + `ManagementRoutes.tsx:43-57`).

A user interacts with the feature through five operations, each a UI control wired to one of five thin-proxy `DataSourceController` endpoints (per `DataSourceController.java:21-59` + the 5 method sidecars): **register** via the "+ Add datasource" modal (`DataSourceForm` in create mode → `POST /api/datasources`, gated `DATA_SOURCE_CREATE`); **edit** via the per-card "Edit" button (`DataSourceForm` in edit mode → `PUT /api/datasources/{id}`, gated `DATA_SOURCE_UPDATE`); **delete** via the per-card "Delete" button behind a `ConfirmationDialog` (→ `DELETE /api/datasources/{id}`, gated `DATA_SOURCE_DELETE`); **regenerate token** via the per-card "Regenerate" button behind a `ConfirmationDialog` (`DataSourceItemToken` → `PUT /api/datasources/{id}/token`, gated `DATA_SOURCE_TOKEN_REGENERATE`); and **list/search/browse** (the screen's own `fetchDataSourcesList` → `GET /api/datasources`, which carries NO `SecurityRule` and is reachable to any authenticated user — read-collaborative posture per `DataSourcesList.md` security + `getDataSourceList.md` coherence_notes). Every mutating control is permission-gated client-side by `WithPermissions`, which renders the control to `null` (hide-not-disable) for a user lacking the matching permission (per `DataSourceItem.md` implicit_adrs[0] + `WithPermissions.tsx:27-29`); the gates are advisory UX — the backend `SecurityConstants.SECURITY_RULES` (lines 116-126) are the real boundary, and the read endpoint has no boundary at all.

The working parts a product owner would demo: the **Namespace field is a select-or-create combo-box** (`NamespaceAutocomplete`) that shows existing namespaces, filters as the user types behind a 500ms debounce, and offers an explicitly-labelled "No result. Create new custom namespace «X»" row ONLY when the typed text matches nothing — selecting it submits the typed string and the backend `namespaceService.getOrCreate` resolves-or-creates it (per `NamespaceAutocomplete.md` understanding + implicit_adrs[0] + `AutocompleteSuggestion.tsx:23-30`); this same control is reused across ~11 sibling autocompletes (Owner, Term, DEG, Collector, Lookup-Table forms). The **token control is a one-shot reveal**: the list returns a masked `"******"+real-last-6` form (`DataSourceItemToken` infers masked-vs-plaintext from the `******` string prefix), and only immediately after a register or a regenerate does the full 40-char plaintext appear with a Copy button and the warning "Save token in a secure location. You will not be able to retrieve it again." (per `DataSourceItemToken.md` understanding + `DataSourceItem.tsx:110-121`). Browsing is **infinite-scroll** (30 per page, `id ASC` creation order, no client re-sort), search is **debounced** with Enter-to-commit, and create-vs-edit is one prop-discriminated modal (per `DataSourcesList.md` implicit_adrs + `DataSourceForm.md` implicit_adrs[1]).

The integration story has four cross-pillar legs (per F-031 frontmatter): the feature **feeds P-10 Integrations & Ingestion** — register mints the 40-char token a Push/Collector client later presents on `POST /ingestion/entities` (validated by `IngestionDataEntitiesFilter`, opt-in, default-off), and regenerate rotates that same credential; it is **DISJOINT from F-008 Batch Ingestion** — the S2S collector path `POST /ingestion/datasources` is a separate endpoint, service class, auth model, and merge semantic (the SHB-092 cross-path asymmetry: this UI Edit FULL-REPLACEs, the collector startup PARTIAL-MERGEs name+description); it **shares the central RBAC gate with P-09 Security** (the four mutating verbs) while the read is ungated; and it **feeds P-01 Data Discovery** — a registered source is the parent of every data_entity ingested under it and its FTS vector feeds catalog Search (which `updateDataSource` refreshes and `deleteDataSource` does NOT clear). It is the **structural twin of F-020 Collector** because both rotation paths share `TokenGeneratorImpl` + `ReactiveTokenRepositoryImpl` — a SecureRandom / hash-at-rest / grace-period fix lands on both.

A product owner introducing this feature should flag, in a demo, the load-bearing edge cases this reflection's hypotheses turn on. First — and this is the case-law correction that prompted this whole reflection (LSN-023) — the Namespace combo-box's "Create new custom namespace" affordance is a **deliberate, labelled UX pattern, not a "permission side-door"**: the backend `getOrCreate` is the faithful server half of a control the operator explicitly clicked (per `DataSourceForm.md` + `NamespaceAutocomplete.md` coherence_notes, both `kind: supersedes` the backend sidecars' side-door framing). Second, the **single most likely Delete attempt fails badly**: collectors re-create `data_entity` children every ingest tick, so an actively-ingested source is effectively undeletable, and the UI surfaces that backend-400 as a stuck-loading modal plus a raw-jargon toast with no recovery (per `DataSourceItem.md` bugs[0] — the §0 user-facing defect). Third, **Edit is REPLACE-not-MERGE reachable straight from the modal** — editing only the Name and leaving Description blank nulls the stored description on Save (per `DataSourceForm.md` name_behavior_pairs + `updateDataSource` backend sidecar P-043). These are the gaps no per-file pass surfaces; they live in the assembled UI→backend product.

**The promise-layer finding (v0.3.0 / LSN-030).** Stepping back one further level — past the individual edge cases to the shape of the test obligation — this feature is the canonical LSN-030 case. The bottom-up pipeline catalogued **nineteen** drift facets exhaustively (`observed_vs_expected.facets[]` runs HIGH-to-LOW with file:line provenance on each). But the user-facing PROMISES — *"clicking Add registers a source and mints its token"*, *"the list shows me what is configured"*, *"the one-shot reveal lets me copy the token once"* — had, until this refresh, **zero** functional test obligation anywhere: `related_test_gaps` enumerated only drift-pins (REPLACE-not-MERGE, destructive-cutover, side-door, cascade, DISABLED-matrix), never a happy-path promise. Re-deriving coverage against the LIVE test tree (Rule 11, not the stale `test_matrix`) shows the gap is real and only partly closed: two F-031-stamped behavioural unit tests and one e2e (IT-026) have since landed and pin exactly TWO promises — the list-render happy path and the backend cascade-block invariant — leaving the other twelve, including the destructive token rotation, unguarded. A drift catalogue at 19/19 facets and a promise layer at 2/14 verified is the precise asymmetry LSN-030 names: the feature was modelled as a bug-list and never as a contract.

## hypotheses

- id: H-001
  hypothesis: "When an operator clicks '+ Add datasource', fills Name + ODDRN + (optionally) Namespace + Description and clicks Save, the system registers a new data source and mints a fresh collector ingestion token for it."
  derivation: "Endpoint shape (POST /api/datasources, registerDataSource) + the 'Add datasource' modal label + DataSourceFormData field set."
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      The create path is faithful. DataSourceForm.onSubmit (DataSourceForm.tsx:69-81)
      dispatches registerDataSource with the four-field body when `dataSource` is
      absent (create mode); the controller (DataSourceController.java:30-36)
      flatMaps into DataSourceServiceImpl.create (DataSourceServiceImpl.java:51-66,
      @ReactiveTransactional) which mints a 40-char token unconditionally
      (tokenGenerator.generateToken, line 54), optionally get-or-creates the
      namespace, validates ODDRN non-empty, INSERTs the data_source row, and
      returns a DataSource whose token.value is plaintext. One Save = one POST
      (multiplicity 1, confirmed UI-side in DataSourceForm.md upstream_callers).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceForm
        section: understanding + downstream_side_effects
        cite: "DataSourceForm.tsx:69-81"
        note: "create-mode submit dispatches registerDataSource (POST)"
      - sidecar: odd-platform__java__DataSourceController__controller-method__registerDataSource
        section: understanding + dependencies_semantic
        cite: "DataSourceServiceImpl.java:51-66 + TokenGeneratorImpl.java:18-24"
        note: "service mints token + INSERTs data_source inside one transaction"
    confidence: HIGH
    use_case_kind: happy-path
    coverage: unverified
    coverage_rationale: |
      NO test covers the register→token-mint→INSERT happy path end-to-end.
      DataSourceMapperImplTest.mapForm_* covers a SLICE (oddrn trim + null-safe FK
      mapping) but not that a POST mints a token, persists the row, and returns
      plaintext. The feature-flow test_matrix lists this happy-path register under
      `integration.uncovered`. So a CONFIRMED promise with no guard — exactly the
      LSN-030 highest-value demand to write.
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-002
  hypothesis: "When an operator types a namespace name that does not yet exist into the Namespace field and saves the data source, that namespace is created — and this is the intended, operator-visible affordance, not a covert privilege escalation."
  derivation: "UI label ('Namespace' field + 'Create new custom namespace «X»' suggestion row) cross-referenced against the backend namespace_name → namespaceService.getOrCreate; LSN-023 case-law mandates tracing through the UI control."
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |
      This is the LSN-023 correction. The Namespace field is NamespaceAutocomplete
      — a deliberate select-or-create combo-box. It shows existing namespaces, and
      offers a synthetic '{name: inputValue}' option rendered as 'No result. Create
      new custom namespace «X»' (AutocompleteSuggestion.tsx:23-30) ONLY when the
      no-match guard `!options.some(o => o.name === inputValue)` is true
      (NamespaceAutocomplete.tsx:78-84). Selecting it emits the plain string X
      (line 127); the parent submits namespaceName=X; the backend
      namespaceService.getOrCreate does getByName(X).switchIfEmpty(createByName(X)).
      The create path is what the operator explicitly clicked on a labelled row —
      it is a faithful server fulfilment, NOT a side-door. The control is the
      canonical instance of an ~11-component reuse pattern (Owner / Term / DEG /
      Collector / LookupTable forms). The backend sidecars' original
      'permission_side_door / escalation by side effect' framing, with a prescribed
      fix of 'add a namespace_id field so the caller SELECTS', is SUPERSEDED: that
      fix would BREAK the create-new half of an intentional UX pattern. The wrong
      finding (REFACTOR-584 / DOC-GAP-262 in the lineage doc-gaps registry) is the
      one LSN-023 exists to retire. The legitimate residue is two non-bug
      questions, both already tracked: (1) should creating-a-namespace-while-
      creating-a-datasource additionally require NAMESPACE_CREATE (a product/RBAC
      decision — PLT-087 'Out of scope' note explicitly judges closing it
      UX-breaking, doc-side caveat is the right ship); (2) the inline-create
      affordance is undocumented (DOC-255 Caveat 1, status: done).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__NamespaceAutocomplete
        section: understanding + implicit_adrs + stress_findings.name_behavior_pairs
        cite: "NamespaceAutocomplete.tsx:78-84,127,165-178 + AutocompleteSuggestion.tsx:23-30"
        note: "labelled create-on-no-match affordance; drift: NONE end-to-end"
      - sidecar: odd-platform__ts__react-component__component__DataSourceForm
        section: coherence_notes (kind: supersedes)
        cite: "DataSourceForm.tsx:124-129"
        note: "UI sidecar explicitly supersedes the backend 'side-door' framing (LSN-023)"
      - sidecar: odd-platform__java__DataSourceController__controller-method__registerDataSource
        section: dependencies_semantic
        cite: "NamespaceServiceImpl.java:37-40"
        note: "the get-or-create the affordance is wired to"
    confidence: HIGH
    use_case_kind: resolve-later
    coverage: unverified
    coverage_rationale: |
      No test exercises the select-or-create affordance end-to-end (type-unknown →
      create-new option appears → submit → namespace minted). This is BOTH a
      functional happy-path gap AND the regression guard that would lock in the
      LSN-023-correct behaviour so a future 'tighten the side-door' change cannot
      silently break the intentional create-new half. The DataSourceMapperImplTest
      covers null-safe FK mapping, not the getOrCreate resolve-or-create branch.
    test_demand: functional
    routes_to_finding: functional-test-demand
    secondary_routing: caveat-candidate   # the doc-gap + RBAC residue (DOC-255 Caveat 1, PLT-087) — preserved from v0.2.0

- id: H-003
  hypothesis: "When an operator opens 'Edit datasource' to change one field (e.g. fix a typo in the Name) and clicks Save, only that field changes; the fields they did not touch keep their stored values."
  derivation: "The 'Edit datasource' modal label + the conventional reading of an edit form (PATCH-like merge). Negative-space: REPLACE semantics would surprise the user."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Edit is a full-form REPLACE, not a merge — and the data-loss path is
      reachable straight from the modal. DataSourceForm.onSubmit submits the WHOLE
      four-field object (DataSourceForm.tsx:69-81); the PUT path's backend
      DataSourceServiceImpl.update (lines 68-83) applies the form via MapStruct
      @MappingTarget applyToPojo (DataSourceMapper.java:49-56) with NO
      nullValuePropertyMappingStrategy set (MapperConfig.java:7-11 → MapStruct
      default SET_TO_NULL). An omitted/blank JSON field is written as null onto the
      existing row. Because the modal pre-fills from the dataSource prop, a field
      the operator clears (or that simply was not pre-filled) is nulled on Save.
      The modal gives NO warning that a blank field overwrites. The namespace
      overload even sets namespace_id to null when the namespace is cleared.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceForm
        section: stress_findings.name_behavior_pairs (DRIFT_NAME_VS_BEHAVIOR) + bugs
        cite: "DataSourceForm.tsx:69-81"
        note: "submits all 4 fields; 'edit' means 'replace with what the modal holds'"
      - sidecar: odd-platform__java__DataSourceController__controller-method__updateDataSource
        section: observed_vs_expected facet (replace_not_merge_silent_field_wipe)
        cite: "DataSourceMapper.java:49-56 + MapperConfig.java:7-11"
        note: "MapStruct default SET_TO_NULL; no IGNORE strategy"
    operator_visible_failure: |
      (1) An operator who opens Edit to fix one field and leaves Description blank
      in the modal nulls the stored description on Save — silent data loss, no
      warning, no undo. (2) Clearing the Namespace field detaches the source from
      its namespace (namespace_id → null), removing it from that namespace's scope.
      (3) An API consumer sending a partial PUT body (the natural REST assumption
      for a resource update) silently wipes every field they omitted. (4) Compounds
      with the cross-path asymmetry (SHB-092): a field the operator sets here can
      ALSO be reverted by the next collector startup's partial-merge, and neither
      write is audit-logged — the operator cannot learn what overwrote what.
    severity: HIGH
    confidence: HIGH
    use_case_kind: edit-reconcile
    coverage: unverified
    coverage_rationale: |
      DataSourceServiceImplTest.update_nonExistentDataSource_errorsNotFound covers
      the 404-on-missing branch of update — NOT the REPLACE-not-MERGE field-wipe.
      No test asserts that a PUT omitting `description` nulls the stored
      description (P-043 backend / P-076 from-UI remain unrun probes). The
      regression guard for whichever way the maintainer resolves it (global
      MapStruct IGNORE → MERGE, or doc-the-REPLACE) is unwritten.
    test_demand: functional
    routes_to_finding: caveat-candidate   # preserved from v0.2.0 — DOC-255 documents the REPLACE semantic; the functional demand is the new v0.3.0 guard

- id: H-004
