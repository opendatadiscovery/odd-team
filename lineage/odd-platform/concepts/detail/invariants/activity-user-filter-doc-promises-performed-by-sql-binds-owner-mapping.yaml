notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "LSN-020" + "user filter" + "performed by" — found
  `invariant:dashboard-title-filter-binds-ownership-title-not-dataset-name`
  (a DIFFERENT LSN-020 instance for the dashboard Title filter). No
  existing concept describes the Activity Feed User filter LSN-020
  instance specifically.

  STRENGTHENS `entitie:activity-feed` by adding the UI-layer +
  doc-page evidence that the User filter is operator-misleading.
  STRENGTHENS the broader LSN-020 invariant class with a fourth
  confirmed instance (dashboard Title, Activity User, ... — pattern
  is structural across the platform).

  The CASE for promoting LSN-020 to a canonical-vocabulary entry in
  `documentation/docs/main-concepts.md` ("Filter semantics in ODD —
  filter parameter NAMES may bind to DIFFERENT columns at the SQL
  layer than the operator expects; refer to the per-feature filter
  reference table") gets stronger with each instance. This invariant
  is the operator-facing-doc-page instance — the highest-priority
  one to surface.

  Batch ZJ adds the I18N CHANNEL evidence — the drift is uniform
  across all six locales because of the natural-keys pattern. A
  full-cycle fix requires (a) renaming the key in the codebase
  (~2 t() call sites), (b) adding the new entry to all six locale
  bundles (~6 file edits), AND (c) updating the doc page. The
  i18n-channel-uniform-across-six-locales evidence elevates this
  from 'English-locale operator misled' to 'every locale operator
  misled' — the latter is closer to the real impact.
