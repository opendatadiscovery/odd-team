security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: N/A
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      The toolbar enforces no permission gates of its own. Identity.permissions
      are imported via getIdentity but never read by this file. Tab visibility
      via <ToolbarTabs> is also unconditional (per the
      management-tab-visible-to-all-authenticated-users-unpermissioned-tab-visibility
      invariant — TabTabs.tsx:34-82 has no permission predicate around any
      tabs entry).
  owner_scoping:
    verdict: N/A
    detail: |-
      The toolbar renders the CURRENT user's identity/owner; no cross-owner
      data exposure happens at this surface.
  strengths:
    - The Identity wire schema has NO `provider` field, so the toolbar cannot expose the F-011 provider-null cross-mode bleed (positive — per `identity-wire-has-no-provider-field-not-a-provider-null-cross-mode-bleed-surface` invariant)
    - Logout defers entirely to backend handler chain (correct shape for OIDC end-session)
  weaknesses:
    - Management tab is rendered to ALL authenticated users regardless of permission set (MEDIUM — per `management-tab-visible-to-all-authenticated-users-unpermissioned-tab-visibility` invariant)
    - Raw auth-provider username (OIDC sub, email, LDAP UID, LOGIN_FORM username) is exposed in the toolbar when no user-owner mapping exists (LOW — operator-visible-PII-by-default)
    - Logout asymmetry across providers (Google + GitHub revoke; Azure + Cognito + ODD_IAM don't) is invisible from this surface (MEDIUM — per `logout-side-token-revocation-asymmetric-defence-in-depth` invariant; operator may believe they've fully logged out when they haven't)
    - No SPA-side audit affordance — no "who am I logged in as right now" detail page, no session-history view
  cross_file_inconsistencies: []
  contributing_files:
    - AppToolbar.md
  evidence:
    - AppToolbar.md:security.auth_mode_relevance
    - AppToolbar.md:security.known_security_gaps.[0,1,2,3]
performance_aggregate:
  overall: HIGH
  hot_paths:
    - useScrollTrigger runs on every scroll event but bounded by threshold (AppToolbar.tsx:40-46)
    - Redux selectors getIdentity / getOwnership are memoised (AppToolbar.tsx:20-21)
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single-render component; no batched / paginated / streaming concerns at this layer
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Stateless per-user; each browser session renders its own toolbar; no server-side contention
  strengths:
    - Bounded state (anchorEl, elevation, scroll-trigger boolean) — no memory growth
    - Single whoami fetch on app mount, consumed from redux store — no repeated network calls
    - No outbound HTTP requests from this component (all data via redux selectors)
  weaknesses: []
  cross_file_inconsistencies: []
  contributing_files:
    - AppToolbar.md
  evidence:
    - AppToolbar.md:performance.hot_paths
    - AppToolbar.md:performance.throughput_characteristics
    - AppToolbar.md:performance.scaling_characteristics
notes: |-
  Surface as canonicalisation candidate — the docs do not name the
  AppToolbar surface, but it is the operationally-critical convergence
  point for the SPA's auth UX. A `Toolbar / Identity / Sign-out`
  section on the user-facing docs page would close the gap.

  Cross-references:
    - `ui-has-no-local-login-form-oidc-redirect-only-auth-model` (the
      complementary invariant — no Login surface exists)
    - `identity-wire-has-no-provider-field-not-a-provider-null-cross-mode-bleed-surface`
      (positive — the structural protection)
    - `management-tab-visible-to-all-authenticated-users-unpermissioned-tab-visibility`
      (the unconditional tab rendering)
    - `logout-side-token-revocation-asymmetric-defence-in-depth` (the
      logout behaviour the button delegates to)
    - F-006 / P-09:F-001 RBAC authorization model (the toolbar reads
      but does not gate by Identity.permissions)
    - F-011 / P-09:F-002 Principal-to-Owner Resolution (the
      owner?.name ?? identity?.username is the client-side render of
      the resolution result)
