proposed_action: |-
  Author IntegrationControllerAuthMatrixTest pinning (a) DISABLED → 200 with
  full registry to anonymous; (b) LOGIN_FORM/OAUTH2/LDAP authenticated
  read-only → 200 with full registry; (c) LOGIN_FORM/OAUTH2/LDAP anonymous →
  302/401. Verify the response body contains the substituted platform_url
  value (assert the live value rather than the placeholder under an
  operator-configured fixture). Pin the open-read posture so adding
  INTEGRATION_READ permission becomes a deliberate, test-visible change.
  Particular care for the platform_url leak: assert that when
  odd.platform-base-url is set to an internal-looking URL, the same value
  appears in the anonymous-under-DISABLED response.
