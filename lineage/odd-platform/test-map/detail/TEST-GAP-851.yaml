proposed_action: |-
  **Vitest cache-key contract tests** (2 tests):

  1. `renderDirectory_twoUsersSameSession_cacheLeaksAcrossIdentities_pinsLatentCacheKeyGap` — render Directory as UserA (mock identity), wait for cache populate. Re-render as UserB (mock identity change). Assert UserB's render hits the cache → UserA's view. PINS the latent gap.

  2. `useGetDataSourceTypes_queryKeyIsStatic_pinsNoUserIdentityScope` — unit test on the hook; assert the queryKey is exactly `['dataSourceTypes']` with no userId/sessionId.

  **Architectural fix when actionable**:
  - Add `userId` (or session-derived value) to queryKey: `['dataSourceTypes', userId]`
  - Add `queryClient.removeQueries(['dataSourceTypes'])` on identity-change events
  - Tests then flip assertion direction (assert cache is rebuilt per identity)

  Coherence note (LSN-018 Rule 6): NO contradiction with existing artefacts. This is a LATENT regression-pin — pins the assumption today; flips direction when per-user API scoping is added.
