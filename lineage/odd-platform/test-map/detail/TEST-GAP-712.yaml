behaviour: |-
  **ActivityController.getActivity FOUR-WAY VIEW-MODE DISPATCH IS UNDOCUMENTED AND UNTESTED — `type` parameter accepts ALL / MY_OBJECTS / UPSTREAM / DOWNSTREAM, each branching to a DIFFERENT service method.** The controller method signature at `ActivityController.java:32` declares `final ActivityType type`; the OpenAPI spec (`openapi.yaml:3255-3258`) documents the parameter as enum `{ALL, MY_OBJECTS, DOWNSTREAM, UPSTREAM}`; the service implements a four-way dispatch in `ActivityServiceImpl.java:107-117` — `case ALL → fetchAllActivities` (no owner filter), `case MY_OBJECTS → fetchMyActivities` (consults `authIdentityProvider.fetchAssociatedOwner()`), `case UPSTREAM → fetchDependentActivities(LineageStreamKind.UPSTREAM)` (lineage-walk), `case DOWNSTREAM → fetchDependentActivities(LineageStreamKind.DOWNSTREAM)`. **The live `documentation/docs/active-platform-features/activity-feed.md` page** (WebFetched 2026-05-20 status 200) describes the 7 filter facets (Calendar / Datasource / Namespace / Event type / Tag / Owner / User) but makes NO mention of `type` — operators reading the doc cannot discover that the same endpoint serves four different ownership scopes, nor that 3 of those 4 scopes bypass owner filtering entirely (only MY_OBJECTS consults the principal). **`type=null` defaults to a fifth implicit branch** (per `ActivityServiceImpl.fetchActivityList` logic): a missing `type` falls into the same `fetchAllActivities` path as `type=ALL` — but the doc page doesn't even hint that omitting `type` is the equivalent of asking for cross-owner activity. **MY_OBJECTS empty-Mono edge case** (the highest-leverage gap): when a user has no owner association, `fetchAssociatedOwner()` returns empty; `ActivityServiceImpl.java:198` does `.switchIfEmpty(Flux.empty())` — the call silently returns an empty feed, visually indistinguishable on the UI from "no activity in window". A user troubleshooting "why is my activity feed empty" has no signal that the cause is missing owner association vs no recent events. **No test catches any of the four dispatch arms**: zero ActivityControllerTest, zero ActivityServiceImplTest under `odd-platform-api/src/test/`. A refactor that renames an enum value, collapses two branches, swaps lineage-walk direction, or changes the `switchIfEmpty` fallback to anything else (e.g. `Mono.error(NotFoundException)`) would silently regress.
