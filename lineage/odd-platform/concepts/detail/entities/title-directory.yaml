name: Title Directory (Owner-relationship labels)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
  - P-09
description: |-
  NEW ENTITY, batch ZE — a free-text catalogue of OWNERSHIP-ROLE
  labels (e.g. 'Data Steward', 'DBA', 'Maintainer') that operators
  select in the React OwnerTitleAutocomplete when granting ownership
  of a Data Entity or a Term. Persisted in the `title` table
  (renamed from `role` at V0_0_53; columns id bigserial PK, name
  varchar(128) UNIQUE, deleted_at, created_at, updated_at).

  Two distinct surfaces consume the directory:
    - OwnershipForm — DataEntity + Term ownership grants
      (OwnerTitleAutocomplete.tsx:43-48, freeSolo: operator may type
      a NEW name and OwnershipServiceImpl.create silently auto-inserts
      via titleService.getOrCreate)
    - Data Quality runs filter — TitleFilter.tsx multi-select
      passing titleIds / deTitleIds to /api/datasets/runs

  The directory is also a CONDITION FIELD in Policies — the live
  /authorization/policies page (200) names dataEntity:owner:title
  and term:owner:title as Policy condition keys.

  Doc gap — no live doc page describes the Title concept end-to-end;
  the only mention is on the Policies page citing the condition
  field, without explaining what 'title' represents or how the
  directory is populated.

  Naming-vs-implementation gap — the directory is reused as a
  Data Quality runs filter labelled 'Title' in the dashboard,
  which led to the LSN-020 class invariant
  dashboard-title-filter-binds-ownership-title-not-dataset-name.
axes_present:
  - controllers
  - openapi_schemas
  - migrations
  - ui_components
nodes:
  - odd-platform java TitleController controller-class:TitleController
contributors:
  - 'TitleController.md:concepts.entities — Title + TitleList + TitlePojo + OwnershipFormData.title_name'
  - 'TitleController.md:understanding — the directory is mutated only as a side-effect of OwnershipServiceImpl, not via TitleController writes'
evidence:
  - TitleController.md:concepts.entities
  - TitleController.md:understanding
  - TitleController.md:dependencies_semantic.requires-runtime (V0_0_3 + V0_0_53 schema)
  - TitleController.md:docs_link_semantic.doc_drift_findings.[0] (no live doc end-to-end)
notes: |-
  Title directory is a derived dimension that follows ownership
  grants. It is not named in main-concepts.md; canonical-candidate
  pending maintainer review. Pairs with the
  dashboard-title-filter-binds-ownership-title-not-dataset-name
  invariant (LSN-020) — the DQ dashboard reuses Title under a name
  that misleads operators expecting dataset-name filter semantics.
