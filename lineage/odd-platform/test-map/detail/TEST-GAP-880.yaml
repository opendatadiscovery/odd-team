behaviour: |-
  **MEDIUM — `ActivityController.getActivity`'s underlying SQL has NO `queryTimeout`, NO Postgres `statement_timeout` hint, NO client-side bound. A long-running query (size=Integer.MAX_VALUE wide-window scan) holds an R2DBC connection from the pool with no cap. The client-disconnect-cancellation behaviour is currently untested — does Reactor's `onCancel` actually propagate to the PostgreSQL driver's `cancelQuery()`? Does the in-flight query actually stop on the DB side? Does the connection return to the pool, or does it linger until DB-side timeout?** Additionally, the partition-creation cron at PartitionServiceImpl.java:60-66 (`CREATE TABLE ... PARTITION OF activity`) takes `ACCESS EXCLUSIVE` on the parent during DDL (boot-time + nightly cron). A read query arriving during the brief DDL window blocks waiting for the lock; the combined cancellation behaviour during DDL stall is the test surface.

  **Primary-source chain**:
  - `ReactiveActivityRepositoryImpl.java:290-292` — ORDER BY + LIMIT with no `queryTimeout` (no JOOQ `.queryTimeout(...)` call; verified by sidecar grep)
  - `ActivityController.java:23-41` — `getActivity` returns `Mono<ResponseEntity<Flux<Activity>>>` — streaming Flux body
  - `PartitionServiceImpl.java:60-66` — `CREATE TABLE ... PARTITION OF activity` — takes ACCESS EXCLUSIVE on parent
  - `PostgreSQLPartitionCreationJob.java:30-43` — boot + nightly cron at 00:01
  - PostgreSQL `statement_timeout=0` (default — unlimited) — no DB-side timeout cap
  - R2DBC connection pool — connection released on Mono/Flux completion OR explicit disconnect

  **The three test surfaces**:
  - **Surface 1 — Client disconnect mid-stream**: a UI client closes the TCP connection while the controller is streaming Flux<Activity>. Reactor's `onCancel` propagates back; the question is whether the in-flight DB query actually gets cancelled (via `PgConnection.cancelQuery`) AND whether the connection returns to the pool promptly
  - **Surface 2 — Read-during-CREATE-PARTITION DDL**: at 00:01 cron, the partition-creation job runs `CREATE TABLE` taking ACCESS EXCLUSIVE; a concurrent read arrives. The read blocks waiting for the lock. If the client disconnects DURING the lock wait, does the lock-wait abort? Does the connection return?
  - **Surface 3 — Pool exhaustion under sustained no-timeout queries**: 10 concurrent slow queries hold 10 connections; new queries wait. No metric exposes "queries in flight" or "longest-running query".

  **Operator-visible consequences**:
  - **UI flakiness during DDL windows**: a UI user clicking the Activity tab at 00:01 cron may see "request hangs then succeeds 200ms later" — the DDL stall is invisible
  - **R2DBC pool exhaustion**: a hostile or mis-tuned client driving size=MAX wide-window queries can exhaust the pool, with no per-connection or per-user limit
  - **Cancellation correctness**: a client disconnecting (browser tab close) SHOULD release the connection; if it doesn't, the connection lingers, eventually exhausting the pool

  **Why MEDIUM not HIGH (sidecar says LOW)**:
  - The sidecar rates this LOW because the symptoms are recoverable (queries eventually complete; pool eventually frees)
  - **We elevate to MEDIUM because**: (a) the cancellation semantic is structurally important for production stability; (b) the DDL-stall interaction with cancellation is unmeasured (per probe P-014); (c) under load, the absence of a timeout + the absence of cancellation correctness = pool exhaustion vector

  **Connection to probe P-014**:
  - The sidecar emits P-014 to MEASURE the empirical disconnect-cancellation behaviour
  - This TEST-GAP is the regression-pin AFTER P-014 confirms whether cancellation actually fires

  **Connection to TEST-GAP-875**:
  - TEST-GAP-875 pins the DROP-vs-SELECT lock collision (housekeeping DDL vs read)
  - This gap (880) pins the CREATE-vs-SELECT lock collision (partition creation DDL vs read) AND the disconnect-cancellation behaviour
  - Both surfaces are part of the read-during-DDL contract on the activity table

  **Connection to probe P-017** (from sidecar reference):
  - P-017 is the partition-creation-during-read probe (similar shape; specifically for boot-time DDL); P-014 is the no-timeout disconnect-cancellation probe
  - This test covers BOTH probe surfaces because they share the same code path
