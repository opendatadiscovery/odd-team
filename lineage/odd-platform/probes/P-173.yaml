realism_caveats: |
  This probe requires a Playwright/headless-browser harness which is currently
  pending across the methodology (existing probes are SQL/REST only). Until the
  Playwright harness lands, this probe sits in pending-stress-protocol state
  with the hypotheses encoded; manual verification is possible by
  opening the SPA root URL in Chrome DevTools and inspecting the rendered
  <a> attributes of the AppInfoMenu's <ul>.

  This probe does NOT cover:
    - The Slack OAuth callback flow (separate from AppInfoMenu);
    - The toolbar's account menu (handled in AppToolbar.tsx, not here);
    - Cross-browser variance on data: URL handling (test only asserts the href
      is REACHABLE, not that the BROWSER will execute it — Chrome refuses
      top-level data: nav since 2018; Firefox is similar).

  The OPERATOR-TRUST model — the assumption that only operators edit
  `odd.links` — is the BOUNDARY of how seriously to take findings (1) and (2).
  Under a deployment where operator-config editing is scoped to a less-trusted
  role (config-server with multi-tenant config-edit ACL), both findings move
  from MEDIUM to HIGH.
