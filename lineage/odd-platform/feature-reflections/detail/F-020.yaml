        cite: "CollectorItemToken.tsx:25-27 + TokenMapper.java:15-18"
        note: "Masked on read; UI flips to hidden; no re-reveal affordance."
    severity: null
    confidence: HIGH
    routes_to_finding: none

- id: H-011
  hypothesis: "When a user without any Management permission (a read-only auditor) is logged in, they cannot enumerate the platform's collector inventory."
  derivation: "Pillar P-08 (the section is operator-facing / permission-gated) + the four COLLECTOR_* permissions implying the resource type is access-controlled."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      GET /api/collectors/list has NO SecurityRule entry (verified by grep — only
      the four mutation verbs are registered at SecurityConstants.java:127-137) and
      no @PreAuthorize on the controller. The read is collaborative across the
      platform (the REFACTOR-024 read-collaborative posture): any authenticated user
      — including one with zero Management permissions — can enumerate every
      collector with its (id, name, namespace, ******{last6}, createdAt, updatedAt).
      The mask includes the last six characters of the token (TokenMapper.java:15-18).
      Under auth.type=DISABLED the same list is reachable to anonymous network
      callers (no auth at all). The route mount itself (/management/collectors) is
      also not permission-gated — only the buttons inside it are (per the route-tier
      finding F-161).
    evidence:
      - sidecar: odd-platform__java__CollectorController__controller-class__CollectorController.md
        section: "security.known_security_gaps[0] (GET /api/collectors unrestricted)"
        cite: "SecurityConstants.java:127-137 (no GET rule) + CollectorController.java:19-25"
        note: "Any authenticated user lists every collector with masked-token last-6 exposed."
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "security.known_security_gaps[5] (anonymous list-enumeration under DISABLED)"
        cite: "SecurityConstants.java + TokenMapper.java:15-18"
        note: "Under DISABLED, anonymous callers enumerate every collector + last-6 token chars."
    operator_visible_failure: |
      (1) A read-only auditor or any low-privilege authenticated user can map the
      entire collector inventory (names, namespaces, token suffixes) — unnecessary
      attack-surface and information disclosure for a credential table. (2) The
      last-6-chars exposure on the mask is gratuitous: it weakens the token by ~36
      bits (still computationally infeasible to brute, but a credential mask should
      not leak any of the secret). (3) Under DISABLED the same enumeration is fully
      anonymous. The read-collaborative posture is undocumented as it applies to the
      collector credential table specifically.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-012
  hypothesis: "When a collector authenticates with its bearer token (the always-on POST /ingestion/datasources path), the platform resolves it to exactly one collector identity deterministically."
  derivation: "Endpoint shape (getByToken bridges a bearer token to a Collector id stored in COLLECTOR_ID_SESSION_KEY) + the operator's expectation that token resolution is unambiguous."
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |
      Resolution is deterministic in practice but has two structurally-unguarded
      ambiguity windows. (a) TOKEN.value has NO UNIQUE constraint (V0_0_28) — two
      TOKEN rows MAY share a value, and getByToken's query (ReactiveCollectorRepository
      Impl.java:89-94) has NO ORDER BY, so on a collision the first-matching row is
      returned non-deterministically, and COLLECTOR_ID_SESSION_KEY becomes ambiguous
      (cross-collector datasource registration silently possible). A collision is
      astronomically improbable from random-40-char output, so in practice
      resolution is unique — but the schema provides no defence, so a future
      deterministic-token-generation bug would open it. (b) The bridge writes the
      resolved id into a WebSession attribute; under the default IN_MEMORY session
      provider (application.yml:30) in a multi-replica deployment without sticky
      sessions, the second-hop request can land on a node that does not have the
      session, breaking resolution across nodes (the cluster-fragility facet
      REFACTOR-419). This needs a running multi-replica stack to observe precisely.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveCollectorRepositoryImpl.md
        section: "invariants[3] (no UNIQUE on TOKEN.value; getByToken no ORDER BY) + scaling_characteristics"
        cite: "V0_0_28__add_token.sql:1-9 + ReactiveCollectorRepositoryImpl.java:89-94 + IngestionDataSourceFilter.java:33-43 + application.yml:30"
        note: "No uniqueness + no ORDER BY = non-deterministic first-match on collision; session bridge needs sticky sessions in a cluster."
    operator_visible_failure: |
      (1) On a multi-replica deployment with the default IN_MEMORY session provider
      and no sticky sessions, collector datasource-registration produces sporadic
      401s on the second-leg request — invisible from any config value, surfacing
      only as intermittent ingestion failures. (2) The token-collision branch is
      theoretical at current entropy but ships with zero schema-level defence and no
      in-file marker, so a maintainer cannot see the risk. The cluster constraint is
      the operationally real half.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate

- id: H-013
  hypothesis: "When the platform generates a collector token, the value is produced by a cryptographically-secure random source, so it cannot be predicted from other tokens or from timing."
  derivation: "Negative-space (a bearer credential's unpredictability is its entire security property; the operator assumes the generator is crypto-grade)."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The two token-generation sites (TokenGeneratorImpl.java:39 generate, :49
      regenerate) call RandomStringUtils.randomAlphanumeric(40). In commons-lang
      3.16+ this delegates to ThreadLocalRandom — NOT SecureRandom. The sidecars
      assert this from the code and the commons-lang Javadoc, and the secure variant
      RandomStringUtils.secure().nextAlphanumeric(40) exists since 3.16. The
      remaining question that requires running the system is the BINDING one for the
      severity call: which commons-lang version is actually on this build's
      classpath at runtime (the delegation target differs across 3.x minors), and
      whether the produced output is in fact ThreadLocalRandom-backed here. That is
      resolvable locally by booting the platform and inspecting the resolved
      commons-lang version + the generator output; emitted as a probe rather than
      asserted HIGH/contradicted on a version inference.
    evidence:
      - sidecar: odd-platform__java__CollectorController__controller-method__regenerateCollectorToken.md
        section: "bugs_limitations_corner_cases[4] + security.known_security_gaps[1]"
        cite: "TokenGeneratorImpl.java:39, 49"
        note: "RandomStringUtils.randomAlphanumeric(40) — non-SecureRandom in commons-lang 3.16+ per Javadoc."
      - sidecar: odd-platform__java__CollectorController__controller-class__CollectorController.md
        section: "bugs_limitations_corner_cases[9]"
        cite: "TokenGeneratorImpl.java:39, 49"
        note: "Same finding reconfirmed at controller-class tier."
    probe_id: P-350
    confidence: MEDIUM
    routes_to_finding: bug-candidate

