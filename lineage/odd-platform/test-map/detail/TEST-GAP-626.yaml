proposed_action: |-
  Add `OwnerDeleteCascadeCompletenessTest` with three test methods: (a) seed Owner + PENDING owner_association_request; DELETE /api/owners/{id}; assert delete succeeds AND the owner_association_request row persists; (b) GET /api/owner_association_request; assert the orphan row is returned with owner_id pointing to soft-deleted space; (c) seed Owner + APPROVED owner_association_request; DELETE /api/owners/{id}; assert same orphan persistence. All pin the current cascade-incomplete behaviour; future fix that extends the cascade-block to owner_association_request will break these tests (deliberately).
