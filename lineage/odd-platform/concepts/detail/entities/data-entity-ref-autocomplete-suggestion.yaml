name: DataEntityRef (autocomplete top-five suggestion row)
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
  - P-01
description: |-
  NEW ENTITY, batch ZE — the minimal per-suggestion payload
  surfaced via GET /api/search/suggestions and consumed by the
  main-search bar's SearchSuggestionsAutocomplete (the toolbar
  autocomplete dropdown) AND the DEG Add-data-entity form.

  SHAPE: {id, oddrn, internalName, externalName, entityClasses,
  manuallyCreated} per components.yaml — a denormalised slice of
  DataEntity sized for instant render in a dropdown.

  CARDINALITY CONTRACT: hard-coded LIMIT 5 via
  ReactiveDataEntityRepositoryImpl.SUGGESTION_LIMIT=5 (line 92).
  No paginate variant on this endpoint.

  ORDERING NON-DETERMINISM (LSN-019 class) — the CTE selects
  + ORDER BY ts_rank DESC LIMIT 5; the OUTER select re-orders by
  rank DESC ONLY (no secondary tie-breaker on data_entity.id).
  When 6+ entities have equal ts_rank (synonym-rich catalogs),
  the top-5 surfaced is STORAGE/HEAP-ORDERED — non-deterministic
  across repeat queries on the same dataset; operator-visible
  flickering in the autocomplete dropdown.

  Sub-filters: entityClassId (single Integer; cannot OR-filter
  across multi-class entities — a Data Set that's also a Data Input
  must be queried twice) + manuallyCreated nullable Boolean
  (true=manually-created only; false=ingested only; null=no filter;
  the `false` branch is unused by any UI consumer per Grep).

  Empty-query short-circuit — getQuerySuggestions:474-476 returns
  Flux.empty() BEFORE any DB call when StringUtils.isEmpty(query),
  distinct from the `search` operation which has no equivalent
  guard.

  AUDIENCE: SearchSuggestionsAutocomplete.tsx (toolbar autocomplete,
  500ms debounced); AddDataEntityToGroupForm.tsx (DEG add-member
  form, `manuallyCreated: true` passed for ingestion-vs-manual
  filter).
axes_present:
  - controllers
  - openapi_schemas
  - repositories
  - ui_components
nodes:
