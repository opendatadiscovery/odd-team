- id: H-006
  hypothesis: "Clicking a Popular tile is a navigation only — it does not itself change the entity's popularity ranking."
  derivation: "Negative-space: a user expects browsing TO a thing to be read-only with respect to the thing's ranking; a ranking that moves because you looked at it is a feedback loop a product owner would flag."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Clicking a Popular tile DOES change the ranking. The tile navigates to /dataentities/{id}/overview,
      which mounts DataEntityDetails, which fires the read-as-write fetchDataEntityDetails → +1 (in fact +2,
      per H-002) view_count → the clicked entity ranks higher on the next Popular render. The UI closes the
      inflation loop: clicking the most-popular tile makes it more popular. There is no client-side
      debounce, no per-session "already counted" guard, no idempotency key, no analytics-only mode. A
      back-button navigation remounts the strip and re-fetches, so a user can observe the ranking shift in
      real time within one SPA session. The same closure exists at a SECOND entry point — the Directory
      level-4 EntityItem also links via dataEntityDetailsPath (per F-001.yaml ui-review-2026-05-26 facet).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__PopularStrip.md
        section: bugs_limitations_corner_cases
        cite: "DataEntityList.tsx:38 + dataEntitiesRoutes.ts:66-73"
        note: "Unguarded Link into the read-as-write Overview tab — closes the loop client-side."
      - sidecar: odd-platform__ts__react-component__component__PopularStrip.md
        section: downstream_side_effects
        cite: "PopularStrip.md downstream_side_effects (back-nav remount re-fires popular fetch)"
        note: "Loop is observable to the user in real time; no client-side mitigation at any layer."
    operator_visible_failure: |
      (1) The home page's Popular ranking is a self-reinforcing rich-get-richer loop: whatever surfaces on
      Popular draws clicks, which raise its rank, which draws more clicks — independent of underlying value.
      (2) Routine browsing (clicking Popular tiles, or browsing the Directory) silently inflates the very
      ranking it reads, so the signal measures "what is easy to click from the home page" as much as "what
      the team values." (3) Combined with H-002 the per-click cost is +2. (4) An operator cannot opt out of
      contributing to the loop — there is no read-only / analytics-only browse mode.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

