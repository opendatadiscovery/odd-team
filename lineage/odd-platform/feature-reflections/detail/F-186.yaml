- id: H-005
  hypothesis: |-
    When the same Data Entity Group node is viewed in COMPACT mode on the Hierarchy
    canvas, the "Items" drill-in affordance is STILL reachable (a density change should
    not remove a navigational capability) — the user can still open the group's members.
  derivation: |-
    Negative-space user expectation: a "compact/full" density toggle conventionally
    changes visual density, not available actions. The pillar mission (P-05
    traceability) implies group membership stays reachable regardless of density.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The Items button / GroupedEntitiesListModal opener lives ONLY in the
      `full && externalName` branch (Info.tsx:65-144). In Compact mode (`!full`) the
      component returns either the "No Information" placeholder (when externalName is
      absent, lines 46-56) or `null` (the final `return full ? <ODDRN block> : null`
      at lines 146-166). Either way the Items button is NOT rendered. Switching to
      Compact for graph-overview readability silently removes the DEG-membership
      drill-in entirely — the user must switch back to Full to reach it. This is facet
      `compact_mode_hides_deg_membership_entry_point_in_hierarchy_canvas`.
    operator_visible_failure: |-
      (1) An operator using Compact mode to read a dense lineage graph cannot click
      into a Data Entity Group node to see its members — the affordance is simply
      gone, with no tooltip or disabled-state hint explaining why. (2) The loss is
      discovered only at the moment the operator wants to drill in, after they have
      already chosen Compact — a dead-end interaction. (3) An operator who learned the
      drill-in exists in Full mode may conclude the group has no members in Compact
      mode (the same visual absence the empty-group case would produce), a false
      negative about the catalog's structure. Mitigation exists (switch to Full, or use
      the entity Overview -> Members path) but is non-obvious and undocumented in-app.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

