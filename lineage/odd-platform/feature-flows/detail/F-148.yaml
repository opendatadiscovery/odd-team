pillar_anchored_feature_name: Search Result Class-Tab Filter — 9-tab class scoping that mutates the entityClasses facet (not the 7 documented facets)
feature_name: |-
  Search Result Class-Tab Filter — the 9-tab strip at the top of the
  /search results (All / My Objects / Datasets / Transformers / Data
  Consumers / Data Inputs / Quality Tests / Groups / Relationships).
  Looks like ordinary tab-switching; ACTUALLY dispatches a facet mutation
  on the `entityClasses` facet (mixing string sentinels 'all' / 'my' with
  numeric class IDs) that flows through the same F-017 backbone (POST /
  PUT /api/search/.../facets → 1500ms debouncer → backend tsquery).
  Distinct UX surface from the 7-facet sidebar — operators interact with
  these tabs more than with the sidebar facets.
