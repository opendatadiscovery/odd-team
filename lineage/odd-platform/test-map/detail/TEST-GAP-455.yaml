evidence:
  - |-
    NotificationsDispatcher.md says: 'A `RuntimeException` (e.g. `IllegalArgumentException` from unknown alert type code, `IllegalStateException` from missing data entity) inside `translate()` bypasses the dispatcher and reaches `NotificationSubscriber.java:90`. NotificationSubscriber logs the error, releases the lock, waits 10s, and re-acquires. The SAME WAL LSN is replayed — the dispatcher is invoked again on the same poison message indefinitely.'
  - "AlertNotificationMessageProcessor.java:23-24 (uncaught translate call)"
  - "NotificationSubscriber.java:60-91 (outer try/catch + 10s back-off + re-acquire)"
  - "NotificationSubscriber.java:83-84 (setAppliedLSN/setFlushedLSN inside try block only)"
  - "Grep `notification` against odd-platform-api/src/test returned 0 matches — entire subsystem untested"
