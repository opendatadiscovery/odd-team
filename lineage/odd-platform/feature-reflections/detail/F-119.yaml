# Deployment-Info Introspection Surface (`/api/appInfo`) — product-owner reflection

## product_owner_narrative

`/api/appInfo` is the platform's **runtime self-description endpoint**. It answers exactly one question for a caller: "which ODD Platform am I talking to, and how does it want me to log in?" The answer is two strings — the build version (`projectVersion`) and the active authentication mode (`authType`, one of `DISABLED / LOGIN_FORM / OAUTH2 / LDAP`) (per `AppInfoController`:understanding, `AppInfoController.java:24-28`). Its single real consumer is the React single-page app, which calls it once at boot to decide which login flow to render and whether to show the self-service Owner-Association card on the home page (per `Overview.md`:understanding, `Overview.tsx:25-27`). The endpoint is a pure **reporter, not a reactor**: it reads `auth.type` as a raw `@Value` string and echoes it, while every other consumer of the same key branches on it via `@ConditionalOnProperty(havingValue=...)` (per `AppInfoController.controller-class`:implicit_adrs, contrasting `AppInfoController.java:18` with `DisabledAuthSecurityConfiguration.java:10`).

A user never types into this feature and never sees a button for it — the feature is *infrastructure the UI consumes on the user's behalf*. The user-observable surface is two screens fed by the endpoint: (1) the **App Info menu** behind the information icon in the top toolbar, which renders the platform version as a clickable GitHub link (per `AppInfoMenu.md`:understanding, `AppInfoMenu.tsx:37-53`); and (2) the **home page (Overview)**, whose self-service Owner-Association card is shown only when `authType !== 'DISABLED'` (per `Overview.md`:concepts.invariants, `Overview.tsx:25-27`). So the product promise has two faces: a deliberate disclosure (the SPA must know the auth mode before the user authenticates) and a deliberate gate (the Owner-Association affordance only makes sense when there is an identity to associate).

The working parts are minimal and that is the point: no filtering, no sorting, no pagination, no request body — the only "input" is the deployment's own `auth.type` configuration, and the only output is the two-field DTO (per `AppInfoController.controller-class`:performance, `AppInfoController.java:25-28`). The interesting behaviour is entirely in the **edges**: what the endpoint discloses to whom (it carries no `@PreAuthorize`, is not in `SecurityConstants.WHITELIST_PATHS`, and is therefore open under DISABLED but authenticated under the other three modes — per `AppInfoController.controller-class`:bugs[2], `SecurityConstants.java:95-96` + `DisabledAuthSecurityConfiguration.java:13-18`), and what happens when the `auth.type` value it round-trips is not one of the four documented words (nothing validates it, at either the backend `@Value` or the UI string-compare — per `AppInfoController.java:18` + `Overview.tsx:26`).

The integration story anchors this feature in **Pillar P-09 (Security & Access Control)** and makes it the adjacency point for two neighbours. It feeds P-08 (Management): every Management affordance assumes `auth.type` is a real value, and the Owner-Association card the home page gates is itself the entry to the Management owner-association flow (per F-119 feature-flow `cross_pillar_relationships`, P-08 shares_data_with). It is part of P-11 (the public API surface) but historically was absent from the developer-guides API reference — now tracked and delivered via DOC-240. It is the controller-class member of the broader **REFACTOR-185 DISABLED-mode-bypass pattern** (this is the 19th supporting sidecar in that cluster — per `AppInfoController.controller-class`:security.known_security_gaps[0]).

In a demo a product owner would highlight three edge behaviours an operator hits in the field: (1) on a default `auth.type=DISABLED` deployment, an anonymous network caller gets version + auth-mode in one GET — now documented as a passive-recon fingerprint on the live disabled-authentication page (confirmed via WebFetch 2026-06-03); (2) a typo in `auth.type` (`OUATH2`) silently produces a deployment with NO `SecurityWebFilterChain` AND a home page that still shows the Owner-Association card as if auth were healthy (per `Overview.md`:bugs[0], `Overview.tsx:25-27` + `AppInfoController.java:18`); and (3) the App Info menu that displays the version is hover-only and keyboard-inaccessible, so the disclosure that exists for machines is partly unreachable for the humans it is rendered to (per `AppInfoMenu.md`:bugs[1], `AppInfoMenu.tsx:78-82`).

## hypotheses

- id: H-001
  hypothesis: "When any caller issues GET /api/appInfo, the response body is exactly two fields — the deployment's build version (`projectVersion`) and the active authentication mode (`authType`) — and nothing more (no hostname, no build SHA, no OAuth issuer, no LDAP URI)."
  derivation: "Response-shape seed — the AppInfo DTO has exactly two properties (`components.yaml:2493-2499`); the controller constructs it from two captured-at-construction values."
  seed_source: response-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      The controller returns `new AppInfo().projectVersion(buildProperties.getVersion()).authType(authType)`
      and nothing else; the OpenAPI schema declares only `projectVersion` and `authType`. The
      sidecar explicitly records the NON-disclosure: no OAuth provider name, no LDAP URI, no
      issuer URL, no build SHA, no hostname — a deliberate "expose mode, hide provider" contract
      shared with IdentityController.whoami (which also has no `provider` field).
    evidence:
      - sidecar: odd-platform__java__AppInfoController__controller-class__AppInfoController.md
        section: implicit_adrs[2] + security.data_exposure[3]
        cite: "AppInfoController.java:24-28 + components.yaml:2493-2499"
        note: "DTO has exactly two fields; the non-disclosure of provider-level detail is recorded as a deliberate ADR."
    severity: null
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: render
    coverage: unverified
    test_demand: functional
  note: |
    Confirmed-but-untested. The sidecar's own gaps section names this as the highest regression risk:
    "a future contributor adds a new field to AppInfo containing operator-sensitive metadata (build SHA,
    hostname, deployment-id, OAuth issuer URI) — no test would catch the expanded disclosure surface."

- id: H-002
  hypothesis: "When the SPA boots, GET /api/appInfo tells it the active auth mode so it can render the correct login flow before the user has authenticated."
  derivation: "Pillar-mission anchor (P-09 'pick a UI auth mode') + the implicit ADR that the endpoint exists to let the SPA discover the mode without a prior auth round-trip."
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |
      The endpoint DOES expose `authType` by design and the SPA DOES read it. But the
      "before the user has authenticated" half holds ONLY under DISABLED. `/api/appInfo` is
      NOT in `SecurityConstants.WHITELIST_PATHS` and has no SECURITY_RULES entry, so under
      LOGIN_FORM / OAUTH2 / LDAP it falls through to `.pathMatchers("/**").authenticated()`
      — i.e. the endpoint that supposedly tells the SPA which login form to draw is itself
      behind the login wall under exactly the three modes that HAVE a login form. The
      auth.type@L18 sidecar flags this explicitly as a "potential broken-UI bug under
      LOGIN_FORM OR a missing whitelist entry — either way, undocumented behaviour" and could
      not statically resolve which (the SPA may reach it via a path the sidecar did not trace,
      or the LOGIN_FORM landing renders without the call).
    evidence:
      - sidecar: odd-platform__java__AppInfoController__config-key-consumer__auth_type@L18.md
        section: bugs_limitations_corner_cases[4]
        cite: "SecurityConstants.java:95-96 + SecurityConstants.java:98-355 + LoginFormSecurityConfiguration.java:49-57"
        note: "/api/appInfo absent from WHITELIST_PATHS and SECURITY_RULES → authenticated() fall-through under the 3 login-bearing modes."
      - sidecar: odd-platform__java__AppInfoController__controller-class__AppInfoController.md
        section: bugs_limitations_corner_cases[2] + security.auth_mode_relevance
        cite: "DisabledAuthSecurityConfiguration.java:13-18 + LoginFormSecurityConfiguration.java:49-57"
        note: "Open under DISABLED, authenticated under the other three modes — the pre-auth-discovery promise holds only under DISABLED."
    operator_visible_failure: |
      Two operator-visible shapes, depending on which way the untraced SPA call resolves
      (this is the `probe-needed`-adjacent gap — see note): (a) if the SPA fetches /api/appInfo
      from a public route before sign-in under LOGIN_FORM, the current config would 401/302 it
      and the SPA would have to fall back to a default login render — a fragile dependency on an
      endpoint that is gated exactly when it is needed; (b) if the SPA only calls it post-auth,
      then the "discover the mode before authenticating" rationale is not actually exercised
      under LOGIN_FORM/OAUTH2/LDAP and the endpoint's pre-auth value is real only under DISABLED.
      Either way the design intent ("know the mode before the auth round-trip") is not delivered
      uniformly across modes, and no test or doc pins which behaviour ships.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
  note: |
    The clean resolution is a runtime probe (boot LOGIN_FORM locally, observe whether the SPA's
    /api/appInfo fetch happens pre- or post-auth and whether it 401s). Recorded as
    PENDING-F-119-1 in probes_emitted rather than a hard contradiction, because the verdict
    genuinely needs the running stack to settle which of (a)/(b) ships.

