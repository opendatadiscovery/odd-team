behaviour: |-
  **MEDIUM — `TagServiceImpl.deleteRelationsWithTerm(termId, tagsToKeep)` (lines 123-134) is a multi-statement READ-then-WRITE without `@ReactiveTransactional`. The method reads current term-tag relations via `listByTerm(termId)` then issues `deleteTermRelations(termId, idsToDelete)` for the set difference. A concurrent write to `tag_to_term` between the read and the write will NOT be detected; if a tag is added to the term concurrently, the just-added relation will not be in the `currentTags` collection and will not be deleted (a "lost addition" — survives). If a tag is removed concurrently, the read sees it but the delete is a no-op (idempotent).** No test pins this race window; no comment defends the choice; the choice is ambiguous (deliberate or oversight).

  **Primary-source chain**:
  - `TagServiceImpl.java:123-134` (`deleteRelationsWithTerm`):
    - Line 124: NO `@ReactiveTransactional` annotation (verified by reading the file).
    - Line 126: `reactiveTagRepository.listByTerm(termId).collectList()` (read step).
    - Line 128-131: in-memory diff `.filter(t -> !tagsToKeep.contains(t.getName()))` to compute `idsToDelete`.
    - Line 132: `reactiveTagRepository.deleteTermRelations(termId, idsToDelete)` (write step).
  - The read and write run in SEPARATE query roundtrips and possibly different TXs depending on caller context.

  **Race characterisation** (per TagServiceImpl.md:bugs_limitations_corner_cases.[deleteRelationsWithTerm-no-tx]):
  - **A concurrent write to tag_to_term between the read at :126 and the write at :132 will not be detected.**
  - If a tag is added to the term concurrently → the just-added relation will not be in `currentTags` → will NOT be deleted (the addition SURVIVES the keep-only operation).
  - The other multi-statement non-TX methods (`getOrCreateTagsByName`, `getOrInjectTagByName`) have race protections in the underlying repository (unique-constraint OR `ON CONFLICT DO UPDATE`); `deleteRelationsWithTerm` has NEITHER — there is no constraint preventing the race, and the read/write are not atomic.
  - No comment defends the choice. The intent is ambiguous: deliberate (to allow concurrent additions to survive a keep-only-this-set operation) OR oversight (the maintainer forgot the annotation on a method that resembles its `@ReactiveTransactional` sibling `createRelationsWithTerm` at :137).

  **Operator-visible consequences if the race is exercised**:
  - **Lost-deletion intent**: an operator submits "keep only tagA" via the Term Tag UI; concurrently, another operator adds tagB to the term; the result is "keep tagA AND tagB" (NOT "keep only tagA"). The operator's intent is silently violated.
  - **Audit confusion**: the Activity Feed shows "operator X kept only tagA"; the term state shows tagA + tagB. The two diverge.
  - **The race window is small in practice**: term tag updates are not concurrent in normal operation (a term has typically <10 tags and is edited by one operator at a time). But the test pinning forces the maintainer to make the choice EXPLICIT.

  **Why MEDIUM not HIGH**:
  - The practical race surface is narrow (terms are not high-concurrency objects).
  - The failure mode is non-corrupting (the addition survives; nothing is lost).
  - The criticality is anchored to the policy: a future refactor that adds `@ReactiveTransactional` SHOULD be a coordinated decision, not a silent change. The test pins the current behavior.
