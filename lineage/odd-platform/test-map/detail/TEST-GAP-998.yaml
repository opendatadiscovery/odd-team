behaviour: |-
  **MEDIUM — visiting bare `/terms` in the browser renders a BLANK PAGE** beneath the AppToolbar with NO error message, NO redirect, NO content. App.tsx:66 declares `<Route path={termsPath()}>` as a parent with one child route `<Route path=':termId/*' element={<TermDetails />} />` and NO `index` route, NO `element` prop on the parent itself, NO `Navigate` fallback. React Router matches the parent but has nothing to render — the operator sees an empty page.

  **Why this is operator-visible**:
  - The Dictionary tab in ToolbarTabs.tsx:67 navigates to `/termsearch` (NOT `/terms`), so users following the UI never hit `/terms` via normal navigation.
  - But typing `/terms` in the address bar, sharing a stale bookmark, or any code path that calls `termsPath()` and navigates produces the dead-end.
  - Live doc at `https://docs.opendatadiscovery.org/features/data-glossary/business-glossary` (WebFetched 2026-05-26 status 200) describes the Dictionary tab as "the catalog-wide list of all terms in the platform" — implying a list view exists; an operator who reasons "list is probably at `/terms`" types it and hits the blank page.

  **Contrast with the sibling `/termsearch/*` route** at App.tsx:63: this is `<Route path={`${termsSearchPath()}/*`} element={<TermSearch />} />` — a single self-rendering route that always renders SOMETHING (the search UI with facets).

  **Same shape elsewhere in the routes/ surface**: TEST-GAP-999 (`/master-data` bare path) and TEST-GAP-1004 (`/data-modelling` bare path) are sister findings. The Management surface ALSO has the same shape but handles it via `<Navigate to='namespaces' replace />` at ManagementRoutes.tsx:151 — proving the project HAS the pattern and chose NOT to apply it to `/terms`.

  **No test pins this** at any layer — a regression that adds an `index` route or a `Navigate` fallback to `/terms` (improving UX) ships green; a regression that removes the `TermDetails` child route (silently regressing every term-detail link to blank) also ships green.

  Probe P-164 is the primary-source verifier (does visiting `/terms` in a headless browser session against the running SPA produce a blank page?).
test_class: missing-edge-case
criticality_rationale: |-
  Sidecar rates this MEDIUM and held MEDIUM: (a) the dead-end is operator-visible but not data-loss; (b) the normal navigation path bypasses it (Dictionary tab → /termsearch, not /terms); (c) bookmarks and shared links to bare /terms are the only realistic operator-discovery path. NOT bumped to HIGH because no probe-verified evidence of actual operator confusion; NOT LOW because the doc-implied mental-model "list at /terms" is a probabilistic operator-discovery vector. Cross-pillar amplification does NOT apply (sticks within P-06 Data Glossary).
