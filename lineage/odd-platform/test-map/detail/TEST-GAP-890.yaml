behaviour: |-
  **HIGH — the `!external` Collector-ownership guard on `updateTag` and `deleteTag` reads ONLY the `tag_to_data_entity` aggregate (`boolOr(tag_to_data_entity.external)`) — it does NOT consult `tag_to_dataset_field.origin`. A tag whose ONLY Collector-set provenance is an `EXTERNAL` `tag_to_dataset_field` row (with no `external` data-entity relation) PASSES the `.filter(!external)` guard and CAN be renamed or deleted by a UI user holding `TAG_UPDATE` / `TAG_DELETE` — silently overwriting or orphaning a Collector-owned dataset-field tag link. The guard's intent (Collector-pushed tags are immutable to the UI) is partially defeated for the dataset-field provenance channel.** Method-level primary source from the batch-X-TAGGING `updateTag` + `deleteTag` controller-method sidecars:

  - `TagServiceImpl.delete` (`:62-63`) and `TagServiceImpl.update` (`:49-50`): both apply `.filter(tagDto -> !tagDto.external())` else `BadUserRequestException("Can't delete/update tag which has external relations")`.
  - `getDto`'s `external()` aggregate (`ReactiveTagRepositoryImpl.java:54-66`): `coalesce(boolOr(tag_to_data_entity.external), false)` — a `LEFT JOIN tag_to_data_entity` ONLY. It does NOT join `tag_to_dataset_field`.
  - `tag_to_dataset_field` carries a `TagOrigin` enum column (`INTERNAL` / `EXTERNAL` / `EXTERNAL_STATISTICS`, `TagOrigin.java:3-7`), NOT a boolean `external`. The guard's `boolOr(tag_to_data_entity.external)` aggregate cannot see it.
  - Consequence: a tag with INTERNAL (or no) data-entity relations + an `EXTERNAL` `tag_to_dataset_field` relation has `tagDto.external() == false` -> passes the guard -> is UI-mutable.

  **Two distinct surfaces, both unpinned (the SAME guard gap, two operations):**
  - **deleteTag** — a UI user with `TAG_DELETE` deletes such a tag. The `tag_to_dataset_field` row (a Collector-set EXTERNAL relation) is left orphaned referencing the soft-deleted tag (compounding the asymmetric-cascade orphan accumulation of TEST-GAP-762).
  - **updateTag** — a UI user with `TAG_UPDATE` renames such a tag. On the Collector's next push, the rename may be silently overridden, OR the renamed tag diverges from the Collector's expected name — the exact Collector-vs-UI reconciliation is the broader concern; the immediate gap is that the guard meant to PREVENT UI mutation of Collector-owned tags does not fire.

  **Why HIGH**: this is a partial defeat of an intentional cross-pillar ownership invariant (Collector owns the `external` bit; UI cannot mutate Collector-owned tags). The guard is asymmetric by construction — it protects the data-entity provenance channel but not the dataset-field provenance channel. A test asserting the guard fires for BOTH provenance channels is the regression catcher; today nothing asserts even the data-entity-side guard, let alone the dataset-field gap.

  **Test gap shape**: a `WebTestClient` / `@SpringBootTest` security test asserting (a) `updateTag` / `deleteTag` of a tag with an `external = true` `tag_to_data_entity` relation returns 4xx with the canonical message (the guard FIRES — the data-entity channel); (b) `updateTag` / `deleteTag` of a tag whose only Collector provenance is an `EXTERNAL` `tag_to_dataset_field` relation — assert the CURRENT behaviour (the guard does NOT fire — the call SUCCEEDS). Test (b) PINS the gap as the current state; when the guard is fixed to consult `tag_to_dataset_field.origin`, test (b) inverts to assert a 4xx.
