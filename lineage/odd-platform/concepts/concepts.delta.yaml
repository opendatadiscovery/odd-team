      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
        - openapi_tags
      nodes_count: 1
      contributors_count: 1
      security_aggregate_overall: null
      performance_aggregate_overall: null
      description: |-
        NEW INVARIANT, batch X-TAGGING — spec-level input-name-vs-implementation
        drift (LSN-020 class). getPopularTagList references the SHARED IdsParam
        component whose description reads 'Entity ids', but the implementation
        binds the parameter as TAG.ID.in(ids) — a tag-id-set filter. The component
        is shared and accurate for its data-entity-scoped consumer; the defect is
        the reuse of an entity-scoped component on a tag-scoped operation. A caller
        supplying data-entity ids gets empty results; an id that is BOTH a valid
        entity id AND tag id silently returns a nonsensical tag. Distinct from the
        LSN-019 popularity-ordering drift on the same endpoint — separate probe
        P-031. Fix: a dedicated TagIdsParam component or operation-level override.
      detail_path: detail/invariants/idsparam-entity-ids-misdescription-on-getpopulartaglist-tag-id-filter.yaml

