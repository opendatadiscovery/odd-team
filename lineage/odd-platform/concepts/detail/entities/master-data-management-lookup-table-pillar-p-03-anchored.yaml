security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      9 mutating endpoints HAVE SecurityRule + LOOKUP_TABLE_* permissions
      (NO_CONTEXT resolver). 6 read endpoints have NO SecurityRule and
      fall through to .authenticated(). NO _READ permission exists in
      PolicyPermissionDto.java:80-88 — the MANAGEMENT category split
      provides no read-side gradient.

      Batch ZH adds: the UI route mount at App.tsx:75-88 wraps
      LookupTables in WithPermissionsProvider with
      [LOOKUP_TABLE_CREATE, _UPDATE, _DELETE] — but the wrapper does
      NOT block rendering (per the wrapper-context-seed invariant);
      only the inner +Add button is gated by WithPermissions. The
      route-level posture mirrors the backend's read-collaborative
      posture.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      All 9 permission rules use NO_CONTEXT resolver — a Policy granting
      LOOKUP_TABLE_UPDATE permits modifying ANY lookup table, not just
      those owned by the user's Owner. Read-collaborative posture.
  strengths:
    - 9 mutating endpoints fully gated with documented permissions
    - Three-surface permission split (table / definition / data) enables
      operator-fine-grained Policy authoring
  weaknesses:
    - Read endpoints have NO RBAC — any authenticated user can browse
      every lookup table in every namespace (HIGH severity if reference
      tables contain sensitive employee/customer/internal codes)
    - Stored-XSS surface on row values + column names + table name +
      description (LookupCharValidator returns input verbatim; same F-004
      family) — HIGH severity
    - Permission scope is global (NO_CONTEXT) — inconsistent with TERM /
      DATA_ENTITY scoped permissions in the same SecurityConstants table
    - updateLookupTableField discards path-param lookupTableId — cross-table
      column-PATCH attack — MEDIUM severity
    - 'NEW batch ZH — UI route mount wraps in WithPermissionsProvider that does not gate; reviewer reading App.tsx:75-88 reasonably believes route is gated; the wrapper''s name promises an access gate that does not exist'
  cross_file_inconsistencies:
    - The NO_CONTEXT resolver for LOOKUP_TABLE_* contrasts with TERM /
      DATA_ENTITY resolver families that DO scope to the resource
  contributing_files:
    - ReferenceDataController.md
    - odd-platform__ts__routes__route__masterData.md
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'List rows: fetchCount(table.tablesPojo().getTableName()) — full-table
      COUNT(*) per page request — ReferenceDataController.md'
    - 'Search results: tsvector @@ tsquery via search-entrypoint
      ReactiveLookupTableSearchEntrypointRepositoryImpl — ReferenceDataController.md'
  throughput_shape:
    verdict: BATCH_FRIENDLY
    detail: |-
      Batch insert via Flux<LookupTableRowFormData>; sized for tens to
      low-hundreds of rows per request.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless controller; physical-PG tables in lookup_tables_schema
      scale with operator-created tables (no upper bound). Hardcoded 50-row
      response cap on insert/update.
  strengths:
    - Reactive Mono/Flux throughout — non-blocking I/O preserved end-to-end
    - Batch insert via single InsertValuesStepN
  weaknesses:
    - DDL serialization risk on rename / delete (ACCESS EXCLUSIVE LOCK)
    - fetchCount(*) per page read on row-list endpoint
    - FTS update is synchronous on the write path
  cross_file_inconsistencies: []
  contributing_files:
    - ReferenceDataController.md
    - odd-platform__ts__routes__route__masterData.md
notes: |-
  This entity entry is the catalog landing page for P-03 Master Data
  Management. The pillar was previously declared in system-mission.md but
  had no concept-catalog anchor; the batch V ReferenceDataController class-
  level sidecar fills the gap.

  Cross-cutting connections:
    - Companion invariant: lookup-table-rename-via-alter-table-breaks-downstream-sql-consumers
      (the rename-side data-loss vector)
    - Companion invariant: lookup-table-cascade-orphan-on-data-entity-delete
      (the delete-side cascade gap)
    - Companion entity: data-entity.yaml (LookupTable is a sub-type of
      DATA_SET — the Data Entity hierarchy)
    - F-004 stored-XSS family: the row values + column names carry the same
      verbatim-storage fingerprint as the prose Markdown surfaces; the
      surface is DIFFERENT (HTML output rather than Markdown render) but
      the unsanitised storage is the same pattern
    - F-006 audit-silence: Lookup Table mutations have NO @ActivityLog —
      cross-cutting with the existing F-006 master invariant
    - read-collaborative-cross-owner-enumeration: the 6 read endpoints
      extend the read-collaborative posture to lookup-table contents,
      potentially exposing sensitive reference data
    - Cross-pillar: P-03 feeds P-01 (Lookup Tables surface in Discovery)
      and P-09 (gated by 9 LOOKUP_TABLE_* permissions)
    - NEW batch ZH — ui-route-path-builder-convention entity (the
      P-03 route module is one of the 11 conforming modules; one of
      the two outliers — no BASE_PATH export — per the convention
      entity's known-divergences)
    - NEW batch ZH — bare-base-url-behavior-divergence-redirect-vs-blank
      (visiting /master-data renders blank — not a redirect)
    - NEW batch ZH — withpermissionsprovider-context-seed-not-route-gate
      (the LookupTables mount's wrapper does NOT block rendering)
