description: |-
  ## REFINED — batch ZH (2026-05-26)

  Batch ZH refines this invariant in light of 5 additional route
  sidecars (dataModelling / dataQuality / management / masterData /
  terms). The ORIGINAL framing — '/data-quality is bare; /lookup-tables
  is wrapped; contrast is the finding' — UNDERSTATED the problem.
  Batch ZH confirms that **/lookup-tables's wrapper does NOT gate
  the route either** — `WithPermissionsProvider` is context-seed-only
  (per the NEW `withpermissionsprovider-context-seed-not-route-gate`
  invariant). The corrected picture:

    - Bare mounts (no wrapper at all): /data-quality, /terms, every
      sub-route in /management (except associations), every sub-route
      in /data-modelling/relationships
    - 'Wrapped' mounts (LOOK gated but don't block rendering):
      /lookup-tables, /data-modelling/query-examples, /data-modelling/
      query-examples/:queryExampleId, Management.tsx outer wrap on
      OWNER_ASSOCIATION_MANAGE, ManagementRoutes inner wraps on
      every sub-area
    - Actually gated mounts (RestrictedRoute redirects): EXACTLY ONE
      — /management/associations/* at ManagementRoutes.tsx:101-110

  The originally-cited 'sibling-route contrast' (gated /lookup-tables
  vs bare /data-quality) was a misreading: a reviewer (including the
  batch-ZC analyser of DataQuality) reading App.tsx:75-88 reasonably
  concluded /lookup-tables is gated. Inspection of
  WithPermissionsProvider.tsx + masterData route sidecar confirms it
  is NOT.

  ## ORIGINAL — batch ZC (2026-05-22)

  The `/data-quality` route is mounted at `App.tsx:73` as a bare
  `<Route path={dataQualityPath()} element={<DataQuality />} />` with
  NO `WithPermissionsProvider` wrapper. The IMMEDIATELY ADJACENT
  `/lookup-tables` route at `App.tsx:75-88` IS wrapped in
  `WithPermissionsProvider` with explicit `allowedPermissions`
  (`LOOKUP_TABLE_CREATE | LOOKUP_TABLE_UPDATE | LOOKUP_TABLE_DELETE`).
  The 'Data Quality' top-bar tab at `ToolbarTabs.tsx:45-49` is
  rendered unconditionally with no permission check; the operator-
  visible result is that any authenticated user reaches the dashboard
  via the tab or by direct URL.

  The two routes' contrast is what makes this a finding rather than
  a noted absence: bare mount + lazy + `AppSuspenseWrapper` is the
  universal pattern (11 of 12 primary routes use it); a wrapped
  permission gate is the exception that lookup-tables applies. The
  dashboard's missing wrapper is unexplained — there is NO comment,
  exception, or convention in App.tsx defending the absence.

  Whether this is a defect or the intended read-collaborative posture
  cannot be settled from the frontend alone. The backend dashboard
  endpoint `GET /api/dataqatests/runs` may or may not enforce its own
  permission gate (PROBE-NEEDED, P-090; not enrichable from the UI
  sidecars). If the backend ALSO has no gate, the catalog-wide
  aggregate health of every dataset is visible to every authenticated
  principal — and anonymously reachable under `auth.type=DISABLED`
  (REFACTOR-185 family).

  The pattern is consistent with ODD's broader read-collaborative
  catalog posture (ADR-CANDIDATE-003; the related per-dataset
  DataQualityController also has four ungated reads), but it is
  UNDOCUMENTED on every live Data Quality doc page. Captured separately
  in the `dq-dashboard-doc-silent-on-access-control` invariant.

  vocabulary_status: codebase-anchored, doc-side-gap. The live
  https://docs.opendatadiscovery.org/features/data-quality/dashboard
  + https://docs.opendatadiscovery.org/features/data-quality
  (WebFetched 2026-05-22 status 200) make NO statement about access
  control or permissions on the dashboard.
