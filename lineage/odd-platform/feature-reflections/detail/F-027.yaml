- id: H-007
  hypothesis: "When a user uploads a file whose fileName contains path-traversal characters (e.g. ../../../etc/odd-secret), the platform rejects or neutralises the filename, and the stored object stays inside attachment.local.path — it cannot be written outside the attachment directory."
  derivation: "Negative-space + endpoint-shape (fileName flows into the storage path) — a filename is user input that becomes a filesystem path; a safe system sanitises it."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      fileName is propagated RAW from DataEntityUploadFormData.fileName into the storage path:
      FileMapper.java:30-31 calls pathConstructor.getFilePath(fileName, dataEntityId);
      LocalFilePathConstructor.java:31-33 returns getFileDirectory(dataEntityId).resolve(fileName).
      Path.resolve("../../../etc/odd-secret") escapes the per-entity directory, so for LOCAL storage a
      traversal filename writes (and on download, reads) OUTSIDE attachment.local.path. There is no
      sanitization, no `..` rejection, no NUL-byte filter, no length cap anywhere in the upload path. The
      same raw filename is also emitted into the Content-Disposition header on download without RFC-6266
      quoting (a CRLF in the filename can inject headers). The live docs are silent on filename handling
      (WebFetch `configuration-and-deployment/odd-platform` 2026-06-01 — "no explicit claims about
      filename sanitization").
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: bugs_limitations_corner_cases[1] + security.known_security_gaps[2]
        cite: "FileMapper.java:30-31 + LocalFilePathConstructor.java:31-33 + DataEntityAttachmentController.java:76-79"
        note: "Raw fileName into storage path (path traversal for LOCAL) AND into Content-Disposition (CRLF header injection)."
    operator_visible_failure: |
      (1) Arbitrary filesystem write (LOCAL): a traversal filename writes the uploaded bytes to an
      attacker-chosen location relative to the attachment base path — overwriting config, planting files
      in directories the platform process can write. (2) Arbitrary read-back: download resolves the same
      traversal, so a file written to an escaped path can be retrieved. (3) Header injection on download:
      a CRLF-bearing filename can inject response headers (e.g. set a cookie, smuggle a second response)
      because the Content-Disposition value is unquoted. (4) For REMOTE the raw filename becomes an S3
      object key (key-injection / cross-key-overwrite is the analogue; lower severity than LOCAL's real
      filesystem traversal).
    severity: HIGH
    confidence: HIGH
    probe_id: PENDING-F-027-2
    use_case_kind: grammar
    coverage: unverified   # security test_matrix lists "filename path-traversal ... assert REJECTION (currently FAILS)" + the CRLF case as uncovered; no test exists.
    test_ref: null
    test_demand: functional
    routes_to_finding: bug-candidate   # + functional-test-demand (path-traversal + CRLF rejection regression-pin)

- id: H-008
  hypothesis: "When a single user uploads many files to a data entity, the platform applies a per-user or per-entity quota so one user cannot exhaust the storage backend — the count and total size are bounded."
  derivation: "Negative-space + doc-claim — the docs say 'no platform-enforced count limit'; a product owner asks whether ANY ceiling protects shared storage."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      The hypothesis predicted a quota EXISTS; the implementation confirms there is NONE, so the
      hypothesis-as-stated (a protective bound exists) is contradicted in spirit — but the documented
      contract is explicit and accurate, so I record this as a confirmed CAVEAT rather than a bug-vs-promise
      contradiction. There is no per-user or per-entity attachment-count or cumulative-size quota anywhere;
      the only ceiling is attachment.max-file-size PER FILE (and even that is not enforced on the API path
      per H-002). The live feature page states the count is unbounded ("a single data entity can carry
      multiple files and multiple links" with no platform-enforced count limit — WebFetch 2026-06-01). The
      code matches the doc; the doc is honest about the absence; the operational risk (single-user
      storage-fill DoS) is real but documented-as-designed.
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: bugs_limitations_corner_cases[3]
        cite: "FileServiceImpl.java:33-103 + AttachmentServiceImpl.java:59-62"
        note: "No count/sum check anywhere; max-file-size is per-file only."
    operator_visible_failure: |
      Documented-as-designed, but the operator-visible consequence remains: any authenticated user with
      attachment-manage (reachable catalog-wide per H-005) can fill the LOCAL /tmp partition or the REMOTE
      bucket with no platform-side throttle — a storage-fill / cost-amplification DoS. The doc names the
      absence; the operator should still treat it as a hardening gap for production. Combined with H-002
      (no server-side size enforcement) and H-013 (no audit), the abuse is both unbounded and untraceable.
    severity: MEDIUM
    confidence: HIGH
    use_case_kind: teardown-constraint
    coverage: unverified   # confirmed-as-designed (no bound exists); a characterization test asserting "no quota is enforced" would pin this state. Untested today.
    test_ref: null
    test_demand: functional
    routes_to_finding: caveat-candidate   # + functional-test-demand (characterization pin of the documented no-quota state)

- id: H-009
  hypothesis: "When an operator configures attachment.storage=REMOTE against an AWS S3 bucket in their own region (e.g. eu-west-1), file uploads and downloads work — the platform talks to the bucket they configured."
  derivation: "Pillar mission anchor (P-08 'operators configure storage') + cross-layer drift (region absent from the SDK builder) — REMOTE promises persistence against the operator's bucket."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      MinioConfig builds the MinioAsyncClient with exactly .endpoint(url).credentials(accessKey,
      secretKey).build() — .region(...) is NEVER called (MinioConfig.java:21-24), so the SDK's default
      region us-east-1 governs request signing. Against AWS S3 in any other region, the first putObject
      returns opaque AuthorizationHeaderMalformed / PermanentRedirect errors. Self-hosted MinIO ignores
      the region header and is unaffected. There is no attachment.remote.region config key anywhere (grep
      returns zero), no @PostConstruct guard, no in-code comment. This is the canonical LSN-002 surface.
      The doc-side remediation is HEALTHY (the live operator page warns "AWS S3 region pinned to us-east-1
      ... only buckets in us-east-1 work" — WebFetch `configuration-and-deployment/odd-platform`
      2026-06-01); the CODE-side residue is unmitigated. NOTE: MinioConfigRegionTest (@pins PLT-086) +
      MinioRegionUnsetRegressionPinTest (@regresses LSN-002) both pin this absence — they assert no
      .region(...) call / no region field today (GREEN while broken); they pin the BUG, not the promise.
    evidence:
      - sidecar: odd-platform__java__MinioConfig__config-class__MinioConfig
        section: bugs_limitations_corner_cases[0] (region-unset) + unset_parameter_audit
        cite: "MinioConfig.java:19-25"
        note: ".region(...) never called; us-east-1 default; LSN-002 canonical anchor; REFACTOR-027."
      - sidecar: "(test, source_read_for_validation)"
        section: "MinioConfigRegionTest.java + MinioRegionUnsetRegressionPinTest.java"
        cite: "odd-platform-api/.../config/MinioConfigRegionTest.java:68-89 + MinioRegionUnsetRegressionPinTest.java:32-45"
        note: "Both PIN the region absence (one source-scan @pins, one reflection-field @regresses); neither verifies the eu-west-1-works promise."
        source_read_for_validation: true
    operator_visible_failure: |
      (1) An operator in eu-west-1 / ap-southeast-1 / us-west-2 etc. configures REMOTE correctly per the
      key names, boots green (no fail-fast — H-011), and discovers at first upload that every putObject
      fails with an opaque AWS signing error that does not name "region" as the cause. (2) Because the
      doc carries the caveat but the code does not fail fast, the operator who skipped the doc has no
      in-product signal. Mitigation today is doc-only; the code-side fix (add attachment.remote.region +
      parameterise the builder) is REFACTOR-027 / PLT-086 Defect 2.
    severity: HIGH
    confidence: HIGH
    use_case_kind: happy-path
    coverage: unverified   # the @pins/@regresses tests guard the BROKEN/absent state. The promise (eu-west-1 works) is verifiable only via a Testcontainers-MinIO/localstack regional probe (I2-attachment-storage, PLANNED/RED).
    test_ref: "MinioConfigRegionTest + MinioRegionUnsetRegressionPinTest (pin the BUG/absence, not the promise)"
    test_demand: functional
    routes_to_finding: bug-candidate   # PLT-086 Defect 2 + functional-test-demand (the post-fix regional-works assertion)

- id: H-010
  hypothesis: "When the platform is deployed as multiple replicas (the standard Kubernetes posture) behind a normal load balancer, a user's chunked upload succeeds regardless of which replica handles each chunk."
  derivation: "Negative-space + pillar mission (the platform is a horizontally-scalable Spring service) — a stateless-looking REST API implies replica-agnostic requests."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Chunk staging is NODE-LOCAL: chunks are written to /tmp/odd/chunks/{uploadId}/{index} on whichever
      replica receives the chunk, and the chunk directory is created at initiate time on whichever replica
      handled THAT request (FileUtils.java:24 hard-coded constant; createDirectories at initiate only). If
      a non-sticky load balancer routes initiate and the chunk POSTs to different replicas without a shared
      volume backing /tmp/odd/chunks, transferTo raises NoSuchFileException (directory absent), or chunks
      scatter across replicas and completeFileUpload finds an incomplete set. This applies to BOTH LOCAL and
      REMOTE (the chunk path is upstream of the storage-backend dispatch). Neither the controller nor the
      docs surface a sticky-routing requirement; it is a latent constraint inherited from the LSN-001 class.
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-method__uploadFileChunk
        section: bugs_limitations_corner_cases[0] + performance.scaling_characteristics + known_performance_gaps[0]
        cite: "FileUtils.java:24 + FileServiceImpl.java:58-67 + LocalFileUploadServiceImpl.java:37 + RemoteFileUploadServiceImpl.java:56"
        note: "Chunk staging per-replica local fs; multi-replica without sticky routing fails uploads. Applies to REMOTE too."
    operator_visible_failure: |
      (1) Intermittent upload failures in the most common production deployment (HA replicas behind a
      round-robin LB): uploads fail "sometimes" with opaque 500s, succeed on retry only if the retry happens
      to hit the initiating replica — a maddening, non-deterministic user experience. (2) The failure is
      invisible to operators who validated uploads on a single-replica dev stack. (3) REMOTE operators are
      surprised: they paid for S3 persistence expecting it to remove local-disk dependence, but the chunk
      window still pins them to one replica. The chunk-staging /tmp residue is the same LSN-001 class root;
      the live operator page now mentions the chunk-staging /tmp dependency but does NOT name the
      multi-replica/sticky-routing requirement (WebFetch 2026-06-01).
    severity: HIGH
    confidence: HIGH
    use_case_kind: happy-path
    coverage: unverified   # no test exercises multi-replica routing (it requires a multi-pod docker-compose/k8s harness — I2-attachment-storage PLANNED/RED).
    test_ref: null
    test_demand: functional
    routes_to_finding: bug-candidate   # PLT-118 + functional-test-demand (multi-replica upload integration test)

- id: H-011
  hypothesis: "When an operator misconfigures REMOTE storage (unreachable endpoint, wrong credentials, or a bucket that does not exist), the platform fails to start (or logs a clear startup error) so the operator catches the misconfiguration before users try to upload."
  derivation: "Pillar mission anchor (P-08 operators configure storage; fail-fast is the operator-friendly contract) + negative-space — boot-time validation is the normal expectation for required external dependencies."
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |
      Partial fail-fast exists, but it is shallow. The three @Value fields (url / access-key / secret-key)
      fail bean wiring at boot ONLY if blank-and-no-default (Spring placeholder resolution throws
      IllegalArgumentException). RemoteFileUploadServiceImpl has a @PostConstruct that checks
      StringUtils.isEmpty(bucket) and nothing else. There is NO boot-time S3 reachability call, NO credential
      validation, NO bucketExists check, and (per H-009) NO region pre-flight. The platform boots GREEN under
      REMOTE mode with an unreachable endpoint, wrong credentials, a missing bucket, OR a wrong region; the
      first putObject is the first time the configuration is exercised. So: present-but-blank config is caught
      at boot; present-but-wrong config is a deferred runtime failure. The live operator page warns "the
      bucket must already exist" (WebFetch 2026-06-01) but the platform does not enforce it.
    evidence:
      - sidecar: odd-platform__java__MinioConfig__config-class__MinioConfig
        section: bugs_limitations_corner_cases[2] (no-boot-validation) + concepts.invariants[3] + security.known_security_gaps[2]
        cite: "MinioConfig.java:9-25 + RemoteFileUploadServiceImpl.java:45-50"
        note: "No @PostConstruct S3 call in MinioConfig; only bucket-non-empty check downstream; deferred-failure pattern."
    operator_visible_failure: |
      (1) Deferred failure with high operator confidence: the platform reports "up", health checks pass,
      the operator moves on — and the first user to upload gets a failure that surfaces as a UI error, not a
      deployment error, so it lands on the user and on support rather than on the deploy pipeline. (2)
      "Bucket must exist" is doc-only: an operator who forgets to pre-create the bucket boots successfully
      and discovers it at first upload. This is the same LSN-001-shape latent-silent-failure pattern.
      REFACTOR-028 captures the bucket-existence sub-case.
    severity: MEDIUM
    confidence: HIGH
    use_case_kind: resolve-later
    coverage: unverified   # the bucket-non-empty check is the only validation and is untested; the broader reachability/bucket-exists fail-fast does not exist.
    test_ref: null
    test_demand: functional
    routes_to_finding: caveat-candidate   # REFACTOR-028 + functional-test-demand (boot-time validation regression-pin once the fail-fast is added)

- id: H-012
  hypothesis: "When a client cannot guess or inject an upload identifier — the uploadId is server-issued and an upload only accepts chunks while it is in PROCESSING state — the chunked-upload protocol is safe from clients fabricating their own upload sessions."
  derivation: "Endpoint-shape + the server-owned-uploadId implicit ADR — the protocol mints the UUID server-side; this is a positive design claim worth verifying holds end to end."
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      initiateUpload mints a random server-side UUID and persists a PROCESSING file row; uploadFileChunk
      and completeFileUpload both route through checkProcessingUploadById, which rejects any uploadId whose
      file row is not in PROCESSING state with BadUserRequestException. Clients cannot choose their own
      uploadId, and a completed (COMPLETED-status) upload stops accepting chunks. The state machine is the
      deliberate design and it holds. (Caveat for completeness: an attacker who LEARNS a valid in-flight
      uploadId issued for another entity can still post chunks to it — that is the cross-entity uploadId
      hijack, which is H-005's chunk-path sibling, a SEPARATE finding; it does not undermine the
      server-owned-identity property asserted here.)
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: implicit_adrs[2]
        cite: "FileServiceImpl.java:41-55,58-67,69-76,93-102"
        note: "Server-issued UUID + PROCESSING-state gate on chunk and complete; clients cannot inject an uploadId."
    confidence: HIGH
    use_case_kind: happy-path
    coverage: unverified   # the server-owned-uploadId + PROCESSING-gate property is confirmed-by-trace but has NO test (the unit test_matrix lists "uploadFileChunk/completeFileUpload with a non-PROCESSING uploadId" as uncovered). Confirmed-but-untested -> functional test demand (LSN-030 fix).
    test_ref: null
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-013
  hypothesis: "When a user uploads, deletes, or modifies an attachment, the action appears in the platform's audit trail (the Activity Feed) so an operator can later reconstruct who attached or removed what context, and when."
  derivation: "Pillar mission anchor (P-08 is a mutating operator surface; F-021 Activity Feed is the audit-trail surface) + cross-pillar promise — a governance platform audits content mutations."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      No attachment mutation writes an Activity event. The controller methods carry no @ActivityLog, no
      logging framework imports, and no log calls; the service chain (AttachmentServiceImpl / FileServiceImpl
      / LinkServiceImpl) is silent on the principal, the file/link id, and the operation. F-027's flow notes
      record the audit-silence pattern explicitly (cross-link to F-019 Owner Lifecycle and F-021 Activity
      Feed — "Attachment Lifecycle has the same audit-silence pattern; no @ActivityLog on any mutation per
      sidecar Grep"). The Activity Feed (F-021) cannot record these even if it wanted to: its schema roots
      events on data_entity_id NOT NULL, but the deeper issue here is simply that the attachment write path
      emits no event at all.
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-method__uploadFileChunk
        section: security.known_security_gaps[2] (no audit log)
        cite: "DataEntityAttachmentController.java:54-62 + AttachmentServiceImpl.java:71-73 + FileServiceImpl.java:58-67"
        note: "No logging imports/calls anywhere in the chunk path; mutation leaves no application-side trace."
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: (F-027 flow control_summary cross-link to F-019)
        cite: "F-027.yaml control_summary (audit-silence cross-link)"
        note: "No @ActivityLog on any attachment mutation — sidecar Grep."
    operator_visible_failure: |
      (1) No accountability: when a runbook link is repointed (H-006) or a file is deleted cross-entity
      (H-005), there is no record of who did it or when — the reverse-proxy access log is the only forensic
      surface and it cannot correlate a fileId to the entity it ultimately affected. (2) Compounds the
