mitigations_unimplemented:
- |-
  Wrap empty-check + DROP TABLE in a single TX with `BEGIN; LOCK TABLE
  <partition> IN EXCLUSIVE MODE; SELECT count(*) = 0 FROM <partition>;
  -- if true, DROP TABLE <partition>; COMMIT;` — the EXCLUSIVE lock
  blocks concurrent INSERTs to the partition for the duration of the
  re-check, closing the race window. ConcurrentINSERTers queue behind
  the lock until COMMIT releases it; they see "partition vanished"
  error AFTER the DROP commits, which is recoverable (the routing
  would naturally pick the next partition, OR fail visibly to the
  caller).
- |-
  Add an `IF EXISTS` clause to `DROP TABLE` — PartitionServiceImpl.java:122
  (`DROP TABLE %s`). Multi-instance race (two instances past ShedLock,
  e.g. lockAtLeastFor=14m releases before the 15m schedule fires) sees
  the second to issue DROP TABLE raise SQLException. `IF EXISTS`
  silences the secondary failure; primary failure is unaffected.
- |-
  Add a metric `housekeeping_activity_partition_dropped_rows_total` —
  count rows IN the partition just before dropping (the existing
  count(*)=0 check produces this value; record it as 0). If the metric
  is ever >0 on a successful drop, the race window fired. Without this
  metric, the race is invisible.
- |-
  Add a test
  `ActivityEmptyPartitionsHousekeepingJobConcurrencyTest.testInsertBetweenEmptyCheckAndDrop`
  that exercises the race directly: launch two threads, one issuing
  INSERT INTO activity, one issuing the housekeeping job, time them
  to overlap; assert the inserted row is preserved (after the fix) OR
  pin the lost-row behaviour as the current contract (before the fix).
- |-
  Document the temporal-boundary semantic on the activity-feed feature
  page + the operator reference:
    "ODD's activity-table housekeeping drops empty past partitions on a
    15-minute cycle. The empty-check and the drop are NOT atomic —
    a race window exists for late-arriving writes. Operators
    expecting strict audit-trail durability should not rely on the
    boundary-partition timing."
notes: |-
  NEW invariant captured in batch VAL-LSN-019-B. Surfaced by primary-source
  examination of ActivityEmptyPartitionsHousekeepingJob combined with
  PartitionServiceImpl line-by-line.

  This is a Linus Torvalds-class engineering finding: the name promises
  "empty partitions only" and the check at the centre honors the name,
  but the SCOPE OF THE GUARANTEE has a temporal boundary that the
  check-then-drop pattern does NOT close. The race window is small
  (microseconds typically) but the SHAPE of the bug is silent data
  loss, with no error path, no log, no metric.

  Cross-cutting connections:
    - Pairs with `retention-claim-vs-code-drift-refactor-085-confirmed-from-two-angles`
      — both findings concern the activity-table durability surface;
      this finding is the OPPOSITE drift (the housekeeping is more
      destructive than it appears) vs the retention drift (housekeeping
      is less destructive than the docs claim)
    - Pairs with `housekeeping-job-no-scheduler-lock-multi-instance-amplification`
      — the multi-instance ShedLock race surface (14m vs 15m razor-
      thin window) amplifies the in-instance race window into a
      cross-instance race
    - Cross-references LSN-001 (attachment-storage default) as a
      SHAPE — both findings are "operator's mental model says X; code
      reality silently does Y with no visible error path"

  PRIMARY-SOURCE confidence: HIGH (line citations to
  PartitionServiceImpl.java:108-117 + 121-127; EmptyPartitionsHousekeepingJob.java:16-33
  with explicit contrast to AlertHousekeepingJob.java:25's transaction(...)
  pattern).
