proposed_action: |-
  Add `CollectorItemToken.test.tsx` (NEW file) with: (a) `plaintext_40_char_token_renders_visible_with_warning` — provide a Collector with `token.value = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij1234'` (40 chars); mount CollectorItem + CollectorItemToken; assert the rendered DOM contains the full 40-char string as a text node; assert the warning admonition (with text 'Save token in a secure location...') is in the DOM; assert the Copy button is rendered; assert NO Regenerate button (because masked-mode is off). (b) `copy_button_click_writes_token_to_clipboard` — click the Copy button; assert `navigator.clipboard.writeText` was called with the exact 40-char value. (c) `isHidden_flips_to_false_on_plaintext` — render with `useEffect(() => setIsHidden(value.substring(0,6) === '******'))` shape; assert `isHidden === false` derived state.
