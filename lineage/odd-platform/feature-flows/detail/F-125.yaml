terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Token table row UPDATE (rotation) OR orphaning (collector/datasource
    soft-delete). No housekeeping cascade ever DELETEs orphan token rows.
    Every collector token EVER MINTED by the platform accumulates in the
    token table monotonically over time.
  evidence:
    - "ReactiveTokenRepositoryImpl.java:33-36 (regenerate)"
    - "HousekeepingJobManager.java (no token cleanup)"
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
    - drift_class: token_table_no_deleted_at_no_housekeeping_orphans_forever
      description: |-
        `token` table per V0_0_28 has NO `deleted_at` / `is_deleted` /
        STATUS column. Soft-delete-collector path UPDATE SET deleted_at=NOW()
        on COLLECTOR but does NOT delete the TOKEN row. HousekeepingJobManager
        covers DataEntity / Activity / Message / OwnerAssociationRequest /
        Notification cleanup; token cleanup is NOT in the cascade. Grep
        for `DELETE FROM token` returns zero matches. A deployment running
        for a year accumulates every historical credential of every long-gone
        collector in a single PG table.
      evidence:
        - "V0_0_28__add_token.sql:1-9 (no deleted_at)"
        - "HousekeepingJobManager.java (no token cleanup query)"
        - "grep DELETE FROM token returns zero matches"
    - drift_class: token_plaintext_at_rest_no_encryption_no_hash
      description: |-
        `RandomStringUtils.randomAlphanumeric(40)` (TokenGeneratorImpl.java:34-42)
        written VERBATIM into `token.value VARCHAR(40)` — no hash, no
        encryption, no separate plaintext-display column. Reachable by any
        DB-side reader (replica / pg_dump / backup / accidentally-leaked
        SQL log line). Combined with the no-cleanup invariant: a Postgres
        replica leak / nightly backup compromise / accidental-log-line
        exposes EVERY collector token the platform has ever minted.
      evidence:
        - "TokenGeneratorImpl.java:34-42"
        - "ReactiveCollectorRepositoryImpl.java:89-97 (plaintext TOKEN.VALUE.eq(token) match)"
    - drift_class: regenerate_no_grace_period_old_token_immediately_invalid
      description: |-
        Regenerate path UPDATEs the row in place — the OLD token immediately
        starts 401-ing at every `POST /ingestion/datasources` and
        `POST /ingestion/entities`. The collector deployed on operator
        infrastructure must be restarted with the new token AT THE MOMENT
        of rotation; if not, ingestion stops. There's no "old + new both
        valid for 24 hours" pattern. Operationally fragile.
      evidence:
        - "ReactiveTokenRepositoryImpl.java:33-36 (UPDATE token SET value = ? WHERE id = ?)"
    - drift_class: token_rotation_delete_no_audit_log_no_activity_event
      description: |-
        `regenerateToken` emits NO Activity Event, writes NO audit-log
        row. `TOKEN.updated_at` + `TOKEN.updated_by` (which CAN be null
        in `auth.type=DISABLED` per TokenGeneratorImpl fallback) is the
        ONLY forensic trace. An incident reviewer asking "who rotated
        this collector's token at 02:13 last Tuesday" has minimal info.
        Same for delete-collector.
      evidence:
        - "ReactiveTokenRepositoryImpl regenerateToken (no @ActivityLog)"
        - "TokenGeneratorImpl.java:27-32 (updated_by null in DISABLED mode)"
    - drift_class: data_source_token_parallel_orphan_surface_same_class
      description: |-
        `data_source.token_id` accumulates orphans the same way per
        ReactiveDataSourceRepositoryImpl sidecar: token rotation UPDATEs
        in place, data_source soft-delete leaves token row dangling.
        Cross-cutting failure across BOTH ingestion-credential surfaces
        (Collector tokens + DataSource tokens). Fix must enumerate every
        table with a `token_id` FK in the housekeeping NOT IN clause.
      evidence:
        - "ReactiveDataSourceRepositoryImpl invariants section"
        - "DataSourceServiceImpl.regenerateDataSourceToken"
    - drift_class: regenerate_token_ui_one_click_no_confirmation_modal
      description: |-
        UI "Regenerate Token" button (CollectorController.regenerateCollectorToken
        / DataSourceController.regenerateDataSourceToken) is one click; there's
        no "are you sure?" modal warning about immediate invalidation. Operators
        who click expecting draft / preview flow lose ingestion. UX-amplified
        version of the no-grace-period drift.
      evidence:
        - "(UI inferred — CollectorController.regenerateCollectorToken endpoint exists)"
    - drift_class: token_value_no_unique_constraint_theoretical_collision_risk
      description: |-
        No UNIQUE constraint on `TOKEN.value`. Two tokens COULD collide;
        keyspace 62^40 makes this astronomically improbable in practice,
        but no schema-level defence. A future migration could add UNIQUE
        without operational risk.
      evidence:
        - "V0_0_28__add_token.sql:1-9 (no UNIQUE on value)"
