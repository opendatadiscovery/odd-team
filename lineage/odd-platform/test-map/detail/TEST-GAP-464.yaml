  - "HousekeepingJobManager.md:tests_coverage_semantic.uncovered_behaviours.[5] (per-job exception isolation)"
behaviour: |-
  Per-job failure isolation regression-pin. The inner try/catch at HousekeepingJobManager.java:41-47 catches `Exception` and logs at ERROR (`log.error("Error while running a housekeeping job", e)`), then the outer loop continues to the next job. This is the ONLY mechanism preventing one failed job from cascading. A future refactor that (a) moved the loop body inline (losing the per-iteration try/catch), (b) changed the catch type from `Exception` to a narrower exception (e.g. `SQLException`), or (c) re-threw the exception after logging would silently regress isolation. No test verifies that a RuntimeException in AlertHousekeepingJob.doHousekeeping does NOT prevent DataEntityHousekeepingJob.doHousekeeping from running in the same cycle. Without this isolation, the 14m ShedLock window combined with the .block()-inside-transaction anti-pattern means a single transient S3 failure could indefinitely block all housekeeping.
test_class: missing-edge-case
