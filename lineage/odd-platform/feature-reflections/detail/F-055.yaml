# Lineage depth boundary — product-owner reflection

## product_owner_narrative

The Lineage tab is the daily-use canvas of the Data Lineage pillar (P-05): a user opens any data-entity detail page, clicks Lineage, and sees the entity at the centre with its upstream producers fanning left and downstream consumers fanning right, rendered as a `d3-hierarchy` tree with pan/zoom (per `LineageGraph.md:understanding` + `:concepts.operations`). The single most prominent control the user is handed is a depth dropdown advertising the options `1` through `20` (`LineageGraph.md:concepts.entities` — `lineageDepth array (constants.ts:97-99)`; rendered by `LineageControls.tsx:104-118`). The product promise that dropdown makes is unambiguous to anyone who reads a screen: *you can ask for between 1 and 20 hops of lineage, and 20 is as deep as this goes.* This feature, F-055, is precisely the contract that dropdown advertises — and whether the system below the dropdown honours it.

A user interacts with depth in three ways, and a senior product owner has to look at all three from the screen, not from the endpoint. (1) They pick a value from the dropdown — this writes `?d=N` into the browser URL (`LineageGraph.md:implicit_adrs` — "URL is the source of truth for view state"). (2) They click a node title to re-centre the canvas on that node — which navigates to that node's own Lineage tab carrying `d: node.depth || 1` (`LineageGraph.md:concepts.operations` — `Node.tsx`; `:implicit_adrs` — "click-through ... uses node.depth as new d"). (3) They click "Load N more" on a leaf to expand one hop further — always a depth-1 fetch (`LineageGraph.md:invariants` — LoadMore is depth-1 expansion). The URL is shareable and hand-editable; the dropdown is a `<select>` whose options are exactly the 20-entry array (per the feature-flow chain hop 1b — the native `<select>` will not let the browser pick a value outside its option list, *but the URL `?d=` is unaffected*).

The working parts below the screen are a four-hop backend chain: the controller `GET /api/dataentities/{id}/lineage/{down,up}stream` carries `@Min(1)` and **no `@Max`** (`getDataEntityDownstreamLineage.md:concepts.invariants` + `:bugs[1]`); the service `LineageServiceImpl.getLineage(... int lineageDepth ...)` wraps the value in `LineageDepth.of(lineageDepth)` and hands the primitive straight through with **no `Math.min` clamp** (`LineageServiceImpl.md:bugs[2]`, line 96); the repository consumes the depth directly as the **sole** recursion terminator `tDepth.lessThan(lineageDepth.getDepth())` in a hand-written Postgres `WITH RECURSIVE` CTE with **no cycle guard and no upper bound** (`ReactiveLineageRepositoryImpl.md:bugs[0]` + `:bugs[3]`, lines 174, 177). The full edge list is then collected into JVM heap via `.collectList()` (`LineageServiceImpl.md` line 102). So the user-visible 20-cap is enforced in exactly one place — the dropdown widget — and nowhere in the URL parser, the controller, the service, or the SQL.

Integration story: this feature is the sibling of F-005 (which captures the recursive-CTE walk semantics end-to-end) and shares the same chain; the depth boundary is the user-facing slice F-005 does not isolate. It feeds the same cross-owner-enumeration surface the whole lineage read path carries (`getDataEntityDownstreamLineage.md:security` — the lineage table has no owner column, the read is `.authenticated()` only), so depth amplification and cross-owner reach compound: a deeper walk reaches more entities, across more owner boundaries, in one request. Under `auth.type=DISABLED` the entire affordance — dropdown, URL, click-through — is reachable unauthenticated (`getDataEntityDownstreamLineage.md:bugs[6]`).

Edge cases a product owner would demo: the click-through compounding (drill 5 nodes out and the next view silently opens at depth 5, `LineageGraph.md:downstream_side_effects` Node.tsx row); the diamond DAG that renders the same node twice because the UI builds a tree not a DAG (`LineageGraph.md:bugs[0]`); the cyclic subgraph that has no visited-set guard and is bounded only by the depth ceiling (`ReactiveLineageRepositoryImpl.md:bugs[0]`); and the operator who reads the API docs ("minimum 1", no maximum) plus sees the 20-entry dropdown and reasonably concludes 20 is a hard platform cap when it is decorative.

