behaviour: |-
  **HIGH — F-004 stored-XSS family extends to a FOURTH surface: the QueryExample definition + query fields rendered via `@uiw/react-md-editor`'s `MDEditor.Markdown` in two UI sites — same architectural class as the entity description, term description, and dataset_field description surfaces previously enumerated in F-004 batches.** Primary-source confirmed in the batch-V QueryExampleController sidecar:

  **Storage tier — verbatim**:
  - DB schema: `V0_0_84__create_query_example.sql:4-5` declares `definition text NOT NULL, query text NOT NULL`. PostgreSQL `text` accepts arbitrary characters up to 1GB; NO `CHECK` constraint; NO trigger transform.
  - Service tier: `QueryExampleServiceImpl.java:42` does `queryExampleMapper.mapToPojo(formData)` — a MapStruct field-to-field copy with NO transformation, NO Jsoup.clean, NO Encode.html.
  - Controller tier: `QueryExampleController.java:26-32` (createQueryExamples) + `:35-42` (updateQueryExample) — pure pass-through, no sanitization.
  - OpenAPI: `components.yaml:2799-2808` — declares both fields `string` with NO `maxLength`, NO `pattern`, NO `format`.

  **Render tier — Markdown executed in TWO UI sites**:
  - `QueryExampleDetailsOverview.tsx:19` renders `definition` via `<Markdown value={queryExample.definition} disableCopy />` (the full markdown body).
  - `QueryExampleDetailsOverview.tsx:25` renders `query` (the SQL body) ALSO via `<Markdown value={queryExample.query} disableCopy />`.
  - `QueryExamplesListItem.tsx:45-52` renders BOTH fields via the same Markdown component in the catalog list view (every Query Examples tab + cross-entity tab + cross-term tab).
  - The `Markdown.tsx` wrapper at the UI layer (lines 1-127 per sidecar) uses the default `MDEditor.Markdown` config — NO `rehype-sanitize` plugin, NO allowed-tags allowlist applied.

  **Attack scenario**:
  A user holding `QUERY_EXAMPLE_CREATE` (granted broadly via Administrator role per `V0_0_88__add_query_example_policy.sql:1-11`, OR via any operator-authored policy granting this permission) submits:
  ```
  POST /api/queryexample
  { "definition": "<raw-HTML XSS payload — held pre-disclosure>",
    "query": "<raw img-onerror cookie-exfil payload — held pre-disclosure (GHSA-mf43-2636-9289 / CTRIB-020)>" }
  ```
  Both fields persist verbatim. Every subsequent UI viewer of the Query Example (catalog list, dataset-tab, term-tab, details page) executes the payload in the platform's origin. The blast radius is the entire authenticated-user pool — every authenticated user can READ every query example per `system-mission.md:267` read-collaborative posture.

  **Same architectural class as F-004 sisters**:
  - F-004 surface 1: DataEntityController.upsertDataEntityInternalDescription (entity description)
  - F-004 surface 2: TermController.createTerm + TermController.updateTerm (term description) — see TEST-GAP-720 for the related side-channel
  - F-004 surface 3: DatasetFieldController.updateDatasetFieldDescription (column description) — see TEST-GAP-664
  - F-004 surface 4: QueryExampleController.createQueryExamples / updateQueryExample (definition + query) — **THIS GAP**

  **Why HIGH not CRITICAL**: the four surfaces share a common UI-render-tier defence-in-depth: the dynamic-verification probe P-009 (per `dynamic-verification slice 6` from the workspace) confirms that the runtime DOM-render path applies a sanitization mitigation through the React Markdown wrapper. The defence is real at the entity description path (P-009 verified); for the QueryExample surface, the defence is **inferred symmetric** because all four surfaces use the SAME `Markdown.tsx` component. The browser-tier defence reduces the practical exploitability, but the BACKEND storage contract (verbatim) plus the LACK OF any backend or service-tier sanitization means: (a) any tool that bypasses the React UI (CLI, direct API consumer, custom dashboard, OpenAPI-generated SDK consumer) renders the raw payload; (b) any regression weakening the UI defence (a rehype plugin change, a Markdown lib upgrade, a render-path bypass) re-opens the full XSS surface. HIGH is the maintenance-of-defence-in-depth posture.

  **Test gap shape**: regression-pin at the BACKEND tier asserting the verbatim-storage contract for both fields; regression-pin at the UI tier (dynamic probe extension) asserting the render-tier defence applies to BOTH definition AND query fields (today the probe is verified only for the entity-description surface). The test PINS the current architectural contract: "verbatim storage + render-time defence" — any future maintainer who adds backend sanitization or weakens UI defence breaks the test, forcing an explicit design decision.
