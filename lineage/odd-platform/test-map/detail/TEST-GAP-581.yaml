  name: "ingestionEntities_filterEnabled_pathVariantsBypass_pinsExactLiteralOnlyContract"
evidence:
  - "IngestionDataEntitiesFilter.md says (bugs_limitations_corner_cases.[1]): 'Path matcher is hard-coded EXACT-literal /ingestion/entities (no wildcard, no property injection, no regex). A new endpoint POST /ingestion/entities/batch / POST /ingestion/entities/v2 / POST /ingestion/entities/stream would silently bypass authentication. There is no compile-time signal, no test asserting the path scope.' severity: MEDIUM (future-regression risk)"
  - "IngestionDataEntitiesFilter.java:28 (literal string)"
