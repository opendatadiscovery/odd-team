- odd-platform java service service:LineageServiceImpl
contributors:
- 'IngestionService.md (batch I): concepts.invariants — replace-not-merge for lineage
  edges and metadata fields is the per-ingestion contract. bugs_limitations_corner_cases.[0,1]
  — Silent metadata-delete-on-absence + lineage-edge-deletion-on-absence (both HIGH
  severity). security.data_exposure.WRITE — destructive surface beyond pure data
  injection; an attacker can ERASE existing metadata/lineage by re-emitting incomplete
  state under a valid token. security.known_security_gaps.[1] — Silent destructive
  operations via replace-not-merge HIGH severity.'
- 'LineageServiceImpl.md (batch I): implicit_adrs.[1] — Establisher-keyed atomic-rewrite
  contract for ingestion. replaceLineagePaths takes List<LineagePojo>, extracts establishers,
  deletes ALL edges by those establishers, then inserts the supplied pojos, ALL
  inside one @ReactiveTransactional. "When an entity re-publishes its lineage,
  the rewrite is atomic and per-establisher: edges declared by OTHER entities are
  untouched." The cornerstone of non-destructive multi-producer ingestion BUT the
  destructive trapdoor for any single producer who emits incomplete state.'
