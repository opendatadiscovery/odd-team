proposed_action: |-
  Add `GetDataEntitiesByDEGOddrnSoftDeletedMemberLeakRegressionPinTest`. Testcontainers integration test:

  1. **Seed**: DEG D-1 with 5 member entities: 3 STATUS=STABLE, 1 STATUS=DELETED, 1 HOLLOW=true.
  2. **GET /ingestion/entities/{D-1.oddrn}** → assert response items.length == 5 (pins the leak).
  3. **GET /api/dataentities/?... filtered by DEG D-1** → assert response items.length == 3 (pins the UI default-filter contract).
  4. **Sibling**: `GET /api/dataentitygroups/{D-1.id}/lineage?depth=1` → assert lineage edges exclude the soft-deleted member (or pin whatever F-016 currently does).

  PINS the asymmetry; the future REFACTOR that adds the missing filters MUST update this test to assert items.length == 3 on the GET — a deliberate contract change.

  Coherence note (LSN-018 Rule 6): NET-NEW. Sister entries TEST-GAP-815/816/817 pin the unauthenticated reach / sequential-id / 404-vs-empty surfaces. This entry pins the SOFT-DELETE asymmetry — a 4th surface on the same endpoint. Together the four entries cover the full uncovered_behaviours surface from the sidecar's tests_coverage_semantic block. STRENGTHENS the `three-soft-delete-mechanisms` concept by establishing it has a 4th surface (the asymmetric application of one mechanism but not the others on this endpoint).
