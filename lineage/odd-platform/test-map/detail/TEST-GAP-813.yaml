behaviour: |-
  **LOW — `receiverId()` return values are asymmetric across the three senders.**
  - `WebhookNotificationSender.receiverId()` returns `"Generic webhook"` (capital G + space).
  - `SlackNotificationSender.receiverId()` returns `"Slack"` (capital S, single token).
  - `EmailNotificationSender.receiverId()` returns `"email"` (lowercase, single token).

  **Log greppability impact**:
  - `NotificationSenderException.getMessage()` (per `NotificationSenderException.java:24-27`) formats as `String.format("Notification sender %s: %s", receiverId, super.getMessage())`. Logged at `AlertNotificationMessageProcessor.java:33` as `log.error("Notification sender %s: %s", ...)`.
  - To filter logs for webhook failures: `grep "Notification sender Generic webhook"` (multi-word).
  - To filter for Slack: `grep "Notification sender Slack"` (single token, different case convention).
  - To filter for email: `grep "Notification sender email"` (lowercase).

  **Three different grep patterns** for three sibling channels. The asymmetry is silent at compile time, observed only by operators tailing logs.

  **The string is also load-bearing for cross-system correlation**: SIEM integrations parsing ODD log lines must accommodate the three patterns.

  **Severity is LOW** — purely a log-readability nit. The fix is normalising the three receiverIds to a single convention (e.g. lowercase single-token: `webhook` / `slack` / `email`) — but this is a backward-incompatible change for any operator's existing log filters.

  **Test gap shape**: regression-pin asserting the three literal values. Mainly serves to document the asymmetry.
