mitigations_unimplemented:
- |-
  Trivial remediation for DataQuality severity-set:
    File: odd-platform-api/src/main/java/.../service/DataQualityServiceImpl.java
    Method: setDataQualityTestSeverity (lines 62-81)
    Change: Add @ActivityLog(event = ActivityEventType.{DATASET_QA_TEST_SEVERITY_UPDATED |
            DATA_ENTITY_OVERVIEW_UPDATED}) annotation OR emit an ActivityEvent
            with the dataset_id, the test_id, the old severity, the new severity.
    Test: assert that a PUT followed by a GET /api/activity?event_type={chosen} returns
          the severity-change event with the correct old/new state.
- |-
  Schema-side remediation for RBAC + Owner + Datasource + Collector mutations
  (PER MASTER INVARIANT — NOT new in batch T):
    Pattern A: extend activity table to permit non-data-entity events
              (NULLable data_entity_id + discriminator column).
    Pattern B: separate platform_event table for non-data-entity audits.
    Either pattern PAIRED with service-tier annotations + activity-event-type
    enum extensions.
- |-
  Read-surface remediation (NOT NEEDED — confirmed by ActivityController batch T):
    The activity feed correctly surfaces what the schema-rooted scope permits.
    No change to ActivityController; the fix is at the write side. Confirms
    that the controller is intentionally thin (per its implicit_adrs.[2] —
    'controller is intentionally thin to make the OpenAPI-generated interface
    the canonical source of HTTP-binding truth').
notes: |-
  This invariant is the BATCH T strengthening artefact for the master F-006
  audit-silence pattern. Rather than re-write the master multi-batch narrative
  files (which carry cumulative cross-batch history and would risk YAML
  fragility), this batch T extension records the 10-sidecar pattern at a separate
  detail file. The rebuild_indexes.py rolls both into the index together.

  The master entry (no-audit-log-on-rbac-mutations-...-batch-f) remains the
  canonical home for the multi-batch narrative; the batch S extension is the
  service-tier closure marker; THIS batch T extension is the read-surface
  + data-entity-scoped-mutation extension.

  The DataQualityController severity-set finding is the most actionable
  next-step: a one-method annotation change with no schema migration. Pair
  with the DOC-NNN candidate to disclose the audit-silence on the live
  activity-feed.md page (the schema-rooted scope boundary must be operator-visible
  for compliance reviewers).

