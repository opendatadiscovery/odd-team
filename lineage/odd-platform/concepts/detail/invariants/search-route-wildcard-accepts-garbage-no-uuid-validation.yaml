notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "wildcard" + "validation" + "graceful degradation" — found
  `invariant:app-error-page-as-error-render-surface-suppressed-toasts`
  (the suppressed-toast pattern is the GENERIC error-surfacing gap;
  this invariant is the SPECIFIC routing-layer instance for /search).

  STRENGTHENS the broader graceful-degradation gap; the Search route's
  empty-catalog-vs-error rendering is a UX inconsistency with the
  AppErrorPage pattern.

  Companion to `invariant:search-id-route-param-is-session-uuid-not-saved-search-category-f`
  — the Category F drift makes the URL look bookmarkable; the wildcard
  failure mode makes broken URLs invisible. Together they account for
  why operators report "my saved search disappeared" without diagnostic
  signal.
