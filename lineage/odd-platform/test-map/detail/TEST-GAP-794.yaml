behaviour: |-
  **CRITICAL — Publication-name DDL injection at NotificationSubscriber.java:151.** The `CREATE PUBLICATION` statement at line 151 interpolates `walProperties.getPublicationName()` (operator config from `notifications.wal.publication-name`) directly into the SQL DDL via `String.formatted(...)`. Postgres identifiers are not parameterisable in prepared statements (PG bans parameterised DDL identifiers), so the interpolation is structurally required — but NO validation/escaping is applied. A pathological config value (e.g. `'odd_alert"; DROP TABLE alert; --'`) would inject as DDL, executed by a database role holding `WITH REPLICATION` plus broad schema privileges.

  **Why CRITICAL (not LOW as the sidecar's individual security entry rates it)**:
  - The threat model assumed operator-config-modification is a higher-privilege threat is INCOMPLETE. Three reachability vectors elevate this:
    1. **`/actuator/env` exposure**: Spring Boot's default actuator includes the env endpoint. Many ODD deployments expose actuator on the application port. A user who can read env can confirm the publication-name format; combined with secret-manager / env-variable injection paths in containerised deployments, the attack surface is wider than "config file write".
    2. **Alt-Secrets-Backend mutability**: The platform's Alternative Secrets Backend (AWS SSM Parameter Store) is read at boot, so an attacker with SSM write capability — typically a separate AWS IAM scope from platform admin — can inject the value.
    3. **Helm/Kubernetes ConfigMap permissions**: The platform-base-url and notifications.wal.* keys are conventionally bound via env vars sourced from K8s ConfigMaps. An attacker with K8s `patch configmap` capability on the platform's namespace — common in multi-team clusters — can inject without ever touching the application's source-of-truth config.
  - DDL injection at boot bypasses every downstream protection. The PG role used here has REPLICATION + DDL on at least one schema; depending on the operator's grant strategy, DROP/TRUNCATE/ALTER on platform tables is reachable.
  - **No fail-fast validator**: The platform does not validate that `publicationName` matches Postgres identifier rules (`[a-zA-Z_][a-zA-Z0-9_]*`, ≤63 chars). Any string that doesn't break URI parsing at boot will reach the DDL.

  **Asymmetric SQL-parameterisation**: The probe at line 133 uses `PreparedStatement` (`SELECT EXISTS (SELECT oid FROM pg_publication WHERE pubname = ?)`) — parameterised. The CREATE at line 151 does NOT — interpolated. The platform pays the prepared-statement cost on the probe but drops the guard on the create — the asymmetry is structural (PG bans parameterised DDL identifiers) but operationally invisible to anyone auditing only the probe.

  **Test gap shape**: regression-pin asserting that an injection-style `publicationName` either (a) is rejected at boot (after the fix), or (b) currently reaches the DDL execution path. Two test classes:
  1. Unit test on `NotificationSubscriber.registerPublication` with a deliberately-bad publication name string; observe the SQL produced.
  2. Testcontainers integration test booting the platform with `notifications.wal.publication-name='ok"; CREATE TABLE evil; --'`; assert the platform either fails at boot OR observes the unexpected DDL execution (pinning the current vulnerability).
