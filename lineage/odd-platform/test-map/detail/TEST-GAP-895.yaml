behaviour: |-
  **HIGH — under `auth.type=DISABLED`, the `TERM_TAGS_UPDATE` and `DATASET_FIELD_TAGS_UPDATE` `SecurityRule`s are bypassed entirely (`DisabledAuthSecurityConfiguration` permits all exchanges; the `AuthorizationCustomizer` is not installed). Anonymous callers can `PUT /api/terms/{id}/tags` and `PUT /api/datasetfields/{id}/tags` to (a) overwrite the tag set of ANY term / dataset field via the replace-all semantic, AND (b) mint arbitrary new rows in the global `tag` directory via the `getOrCreateTagsByName` side-channel. For the term path the overwrite is DOUBLY invisible — no auth AND no audit (the term-tag path carries no `@ActivityLog`).** Method-level primary source from the batch-X-TAGGING `createTermTagsRelations` + `updateDatasetFieldTags` controller-method sidecars:

  - `createTermTagsRelations` sidecar: `SecurityConstants.java:185-186` registers the `TERM_TAGS_UPDATE` rule. Under DISABLED, per the cross-batch DISABLED-bypass case-law (`DisabledAuthSecurityConfiguration` permits all exchanges, `AuthorizationCustomizer` not installed), anonymous callers reach the endpoint. The term-tag path has NO `@ActivityLog` (verified — no annotation on the controller method, on `TermServiceImpl.upsertTags`, or on the `TagServiceImpl` methods) — so a DISABLED-deployment term-tag overwrite is doubly invisible.
  - `updateDatasetFieldTags` sidecar: `SecurityConstants.java:288-290` registers the `DATASET_FIELD_TAGS_UPDATE` rule. Under DISABLED, anonymous callers can overwrite the internal tag set of any dataset field AND mint global `tag` rows. The `@ActivityLog` event still fires but the caller identity is undefined.

  **Two distinct sub-behaviours, both unpinned (the SAME DISABLED-bypass class, two endpoints):**
  - **Term-tag DISABLED bypass** — anonymous `PUT /api/terms/{id}/tags` overwrites any term's tag set + mints directory rows; no auth, no audit. DOUBLE-invisible.
  - **Dataset-field-tag DISABLED bypass** — anonymous `PUT /api/datasetfields/{id}/tags` overwrites any dataset field's internal tag set + mints directory rows; the `DATASET_FIELD_TAGS_UPDATED` activity event fires with an undefined caller identity.

  **Why HIGH**: DISABLED is documented as dev-only, but the absence of a fail-fast on a network-reachable port makes accidental production deployment plausible. The DISABLED-bypass on these two side-channels means an anonymous network caller can rewrite the catalog's term and dataset-field tag sets AND pollute the global vocabulary. The sidecars rate this MEDIUM-to-HIGH (HIGH under DISABLED on a network-reachable port; LOW if DISABLED is honestly dev-only). No test pins the DISABLED-mode behaviour on either endpoint.

  **Test gap shape**: a `@SpringBootTest` with `auth.type=DISABLED` asserting (a) an UNAUTHENTICATED `PUT /api/terms/{id}/tags` succeeds and rewrites the term's tags + mints a directory row; (b) the same call produces NO activity-feed entry (the double-invisibility); (c) an unauthenticated `PUT /api/datasetfields/{id}/tags` succeeds and rewrites the dataset field's internal tags; (d) for (c), a `DATASET_FIELD_TAGS_UPDATED` activity row IS produced but with an undefined caller. The current state is PINNED — the DISABLED-bypass is documented-and-tested rather than silent.
