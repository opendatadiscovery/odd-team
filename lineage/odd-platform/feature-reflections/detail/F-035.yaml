- id: H-013
  hypothesis: |-
    "When the operator misconfigures a very large odd.links list (e.g. an env-var binding accidentally
    expands to thousands of entries), the platform handles it without breaking the menu or the
    response."
  derivation: |-
    Resource-boundary seed: there is no @Size cap on the list and no pagination at the API or UI. A
    product owner asks what happens at pathological scale — does the menu degrade gracefully or break?
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Statically: AdditionalLinkProperties has no @Size; LinksController has no LIMIT and allocates a
      fresh O(N) ArrayList per request; AppInfoMenu renders 5+N DOM subtrees in one MUI Menu with no
      pagination and keepMounted. For typical N<=50 this is sub-millisecond and irrelevant. For
      pathological N (1000s) the sidecars predict (a) an O(N) per-request copy on every /api/links call,
      (b) a menu render that degrades the MUI Menu's vertical-scroll and positioning algorithm. Whether
      the menu becomes unusable, the MUI positioning breaks, or the browser hangs at a specific N is not
      statically determinable — it requires running the UI with a large injected list and observing.
    evidence:
      - sidecar: odd-platform__java__LinksController__controller-class__LinksController.md
        section: performance.scaling_characteristics
        cite: "LinksController.java:31-33 + AppInfoMenu.tsx:55-69"
        note: "No pagination at API or UI; list size grows O(N); pathological config degrades menu render."
      - sidecar: odd-platform__java__config_properties__config-properties-class__AdditionalLinkProperties.md
        section: performance.known_performance_gaps
        cite: "AdditionalLinkProperties.java:7 (no @Size)"
        note: "No max-size cap on the list; cost surfaces at every consumer call and UI render, not at the record."
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-035-1
    routes_to_finding: validation-gap
    use_case_kind: render
    coverage: unverified
