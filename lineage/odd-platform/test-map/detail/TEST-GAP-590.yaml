behaviour: |-
  **admin-attribute defaults to literal 'email' for Google — diverges from AbstractOIDCUserHandler default (userNameAttribute).** Line 31 declares `GOOGLE_EMAIL = "email"`; line 58 uses it as the fallback when `provider.adminAttribute` is unset. AbstractOIDCUserHandler.java:33-35 instead falls back to `userNameAttributeName` (the username attribute itself — Cognito uses `cognito:username`, Azure uses `name`). The Google-specific default IS the decision — `email` is the verified Workspace email and the natural admin-list identifier (matching `admin-principals: john@odd.com,david@odd.com` in the docs example). A regression that aligned the fallback with the abstract base (e.g. defaulting to `userNameAttributeName`) would silently demote every admin where `admin-attribute` is unset (a common configuration — operators only set it when they need to override). Six admin-detection branches need coverage: (1) adminPrincipals match → ADMIN; (2) adminPrincipals case-insensitive match → ADMIN; (3) explicit adminAttribute='sub' + match → ADMIN; (4) adminAttribute unset → reads 'email' (the GOOGLE_EMAIL constant) NOT userNameAttribute; (5) non-admin → USER; (6) empty adminPrincipals → USER regardless of claim values.
