        section: invariants + implicit_adrs + docs_link_semantic.doc_drift_findings
        cite: "constants.ts:77 (defaultLineageQuery.d=1); HierarchyLineage.tsx:47"
        note: "UI hardcodes d=1; the 'unset' API branch is unreachable from the UI."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityDownstreamLineage.md
        section: bugs_limitations_corner_cases[0] + docs_link_semantic.doc_drift_findings[0]
        cite: "DataEntityController.java:257 + LineageService.java:12 + LineageServiceImpl.java:89"
        note: "Null Integer -> primitive int NPE -> 500; documented default does not exist."
    operator_visible_failure: |
      (UI) A first-time user sees a 1-hop graph and may conclude the entity has almost no lineage,
