- id: H-007
  hypothesis: |-
    Disabling housekeeping (or running with the shipped default) gives the
    operator the retention behaviour the docs describe — i.e. with housekeeping ON
    (the shipped default), DELETED entities ARE eventually purged.
  derivation: |-
    Cross-pillar promise (this feature FEEDS the Housekeeping TTL job F-010) +
    HousekeepingTTLProperties doc claim that the subsystem is on-by-default.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      Even with housekeeping fully enabled and correctly configured (the shipped
      application.yml default housekeeping.enabled=true,
      data_entity_delete_days=30), the DataEntityHousekeepingJob runs, queries
      STATUS_UPDATED_AT <= cutoff, and matches ZERO of this feature's entities
      because their status_updated_at is NULL (H-002 root cause). The housekeeping
      subsystem is healthy and firing; the data-entity purge step is a no-op against
      this feature's output. The cross-pillar contract (F-044 produces DELETED rows
      that F-010 reaps) is structurally broken at the data layer — F-010 receives
      nothing to reap because the join key was never written. NOTE: an ADJACENT
      housekeeping defect is separately pinned — HousekeepingTtlKnownBugsTest
      (@pins PLT-083) shows the TTL fields are bare `int` with no @DefaultValue, so
      an unset/partial housekeeping.ttl silently defaults to 0 and deletes
      everything older-or-equal to now (LSN-001 shape). That is distinct from this
      feature's NULL-key defect but compounds the cross-pillar fragility.
    evidence:
