notes: |-
  **STRENGTHENED batch 2026-05-19M to 4-sidecar additional triangulation**.
  The catalog now has end-to-end uniform confirmation that the anchor-set
  pattern is APPLIED in 3 named positive-case surfaces (listAssociated +
  DataEntityRelationsService getDependentDataEntityOddrns + AlertService
  listByOwner) and UNAPPLIED in 14+ named negative-case surfaces (10
  DataEntityServiceImpl reads + 4 LineageServiceImpl reads + 3 AlertService
  reads + 1 DEG-lineage read + 6 facet-aggregator sites).

  **Two batch-M refinements**:
    (1) Even the POSITIVE cases have secondary fragility: REFACTOR-225 —
        the lineage-variant /my endpoints' anchor-set is SINGLE-POINT-OF-
        FAILURE because listByOddrns has no JOIN-side defence-in-depth;
        the architectural posture trusts the anchor to be correct.
    (2) The facet-aggregator suite INVOKES the anchor pattern
        (fetchAssociatedOwner is called) but consumes the result as an
        ADDITIVE scope (the myObjectsCount alongside the catalog-wide
        total), NOT as a boundary predicate — the pattern is PRESENT but
        does not SCOPE the operation. This is a third posture mode:
        APPLIED-AS-ADDITIVE-SCOPE distinct from APPLIED-AS-BOUNDARY and
        UNAPPLIED.

  The catalog therefore now distinguishes:
    (a) APPLIED-AS-BOUNDARY (3 surfaces — the JOIN-side-defended listByOwner
        plus AlertService listByOwner plus DataEntityRelationsService
        getDependentDataEntityOddrns — though the latter is single-point-
        of-failure);
    (b) APPLIED-AS-ADDITIVE-SCOPE (1 surface family — facet aggregators);
    (c) UNAPPLIED (14+ surfaces).

  Cross-references:
    - Companion invariant: read-collaborative-cross-owner-enumeration
      (REFACTOR-024 / 203 controller + repository + UI confirmations).
    - Companion invariant: owner-link-is-the-gate-for-owner-scoped-views
      (the underlying primitive that fetchAssociatedOwner consumes).
    - Companion invariant: REFACTOR-225 anchor-set single-point-of-failure
      (the secondary fragility of the POSITIVE case).
    - Companion invariant: LineageDepth.empty() sentinel magic-number
      encoding (the brittleness of the POSITIVE case single-hop semantic).
    - Companion invariant: DEG-membership read vs write authorization
      asymmetry (the DEG-anchored NEGATIVE case sibling).

  Recommended cleanup paths:
    - Audit every list-shape read method on every service for the
      anchor-set pattern. Surface a mustScope(reason) annotation on methods
      that BYPASS the anchor — the maintainer must explicitly justify
      the bypass.
    - For the highest-traffic surfaces (DataEntityServiceImpl.getDetails,
      LineageServiceImpl.getLineage, the facet aggregators), add the
      anchor-set as a service-layer guard.
    - For the lineage-variant /my endpoints (positive case), add a
      listByOddrnsAndOwner repository method that JOINs against OWNERSHIP —
      closes REFACTOR-225 single-point-of-failure.
    - Doc-side: extend /configuration-and-deployment/enable-security/authorization
      with a Read-side defence section explaining the three posture modes
      (boundary / additive-scope / unapplied) and listing which surfaces fall
      into which category.
