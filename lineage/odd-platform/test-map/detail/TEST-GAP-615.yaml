proposed_action: |-
  Unit test on GithubUserHandler with spied WebClient. (a) Configure provider with organizationName + adminGroups non-empty. (b) Invoke enrichUserWithProviderInformation. (c) Assert WebClient.get() invoked exactly TWICE in this handler (orgs + teams; the third call from Spring's DefaultReactiveOAuth2UserService is in upstream code). (d) Mirror: adminGroups empty → assert WebClient invoked exactly ONCE (orgs only, teams call skipped). (e) Pin the cost model.
