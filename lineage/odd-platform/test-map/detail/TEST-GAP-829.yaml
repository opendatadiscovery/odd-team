proposed_action: |-
  Add `OpenAPISpecErrorResponseContractTest`. Build-time test:

  1. **Parse spec** with `swagger-parser`.
  2. **For each of 194 operations**: assert `operation.responses` contains at least one entry with status code matching `4..` or `5..`.
  3. **For 4xx/5xx responses**: assert each references a canonical `ErrorResponse` schema (or one of a small fixed set of error schemas in `components.yaml`).
  4. **Cross-check** against Spring's `@ExceptionHandler` chain (via reflection at test setup): assert the spec'd error responses are a superset of what the controllers actually throw.

  The test fails today on (2) for 191 operations. Each failure is a structural finding for the maintainer to triage. Once 191 operations are spec'd, the test guards against silent re-introduction of unspec'd errors.

  Coherence note (LSN-018 Rule 6): NET-NEW. Sister to TEST-GAP-828/830 — together they form the spec-conformance test suite. STRENGTHENS DOC-GAP-099 (spec-drift META cluster) by adding the ERROR-RESPONSE axis. No contradiction with TEST-GAP-285 (postDataEntityList 200-vs-201) — that entry is about a single happy-path drift; this entry is about the absence of error responses altogether.
