proposed_action: |-
  Integration test with in-memory log appender. (a) Authenticate via Google/Azure/Cognito/GitHub with various branches (accept, reject, admin-grant). (b) Invoke logout. (c) Assert log capture: ZERO ODD-platform log records emitted from the handler classes (no `o.o.o.auth.handler.*` or `o.o.o.auth.logout.*` loggers). (d) Compare with sibling controllers (DataEntityController emits log calls on operations) — the contrast establishes the asymmetric observability gap. Pin the absence; future @Slf4j + audit-log addition flips this test deliberately.
