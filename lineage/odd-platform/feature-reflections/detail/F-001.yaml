- id: H-011
  hypothesis: "The home-page Recommended panel renders correctly for every valid deployment auth mode (the operator picks DISABLED / LOGIN_FORM / OAUTH2 / LDAP and the panel shows or hides as intended)."
  derivation: "Endpoint/config seed: the panel's visibility is driven by appInfo.authType; a robust feature handles every documented value of that knob."
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |
      The gate is correct for exact, well-formed values but fails open/closed silently for malformed ones.
      Overview.tsx:25-27 does a case-sensitive string-equality check against the single literal 'DISABLED'
      with no enum validation and no fallback. If the operator sets AUTH_TYPE='' (empty) the panel hides (as
      if DISABLED) AND every backend @ConditionalOnProperty fails to match → no SecurityWebFilterChain wired
      → unguarded deployment. If the operator typos AUTH_TYPE=OUATH2 or sets 'disabled' lowercase, the gate
      evaluates TRUE → the panel SHOWS on a deployment whose backend has no matching security config. The UI
      mis-gating compounds the backend's identical lack of validation. The Popular strip's visibility is thus
      reliable only when auth.type is one of the four exact uppercase literals.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: bugs_limitations_corner_cases
        cite: "Overview.tsx:25-27 + AppInfoController.java:18"
        note: "Case-sensitive equality vs single literal; no enum validation; compounds backend no-default."
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: invariants
        cite: "Overview.tsx:25-27"
        note: "Empty/typo/lowercase/whitespace auth.type all produce a surprising panel-visibility outcome."
    operator_visible_failure: |
      (1) A typo'd or unset auth.type can render the Popular/Recommended panel on a deployment that has no
      authentication wired — the panel's presence falsely signals a working secured deployment. (2) The
      inverse (empty string) hides the panel AND silently disables security, masking the misconfiguration
      from an operator who only looks at the home page. (3) There is no console warning, toast, or fallback
      UI naming the unrecognised value. This is a deployment-time trap that no integration test catches
      because typos are operator-side.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-012
  hypothesis: "Two operators opening the same popular entity's detail page concurrently each have their read counted correctly (no lost updates), and a client paging through the full Popular list sees each entity exactly once."
  derivation: "Concurrency / pagination negative-space: a counter feeding a ranking must be race-correct, and a paginated ranking must be stable enough not to skip/duplicate under concurrent writes — a senior PO asks both."
  seed_source: response-shape
  validation:
    verdict: probe-needed
    actual_behavior: |
      Two distinct sub-questions, neither settle-able from the sidecars alone:
      (a) Lost-update on view_count: the increment is `UPDATE ... SET view_count = view_count + 1`, which is
      atomic per-statement in Postgres, so the sidecar reasons there is NO lost update "by SQL semantics, not
      by test" (ReactiveDataEntityRepositoryImpl.md performance). That is a STATIC claim about concurrent
      single-row increments — the methodology's bar (run it, don't reason it) wants this measured under real
      concurrency, especially since the +2 doubling means each page-open fires TWO increments inside (and
      across) @ReactiveTransactional boundaries.
      (b) Pagination stability: getPopular is non-transactional and offset-based ((page-1)*size); a client
      iterating page=1,2,3 while concurrent detail-reads mutate view_count can see an entity twice or miss
      one entirely (getPopular.md bugs[8]). The UI fetches page=1 only, so this is latent for the UI but
      real for API consumers. Whether it manifests in practice needs a concurrent-load probe.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveDataEntityRepositoryImpl.md
        section: performance
        cite: "ReactiveDataEntityRepositoryImpl.java:173-180"
        note: "Lost-update absence asserted by SQL semantics, NOT by test — wants empirical confirmation."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: bugs_limitations_corner_cases
        cite: "DataEntityServiceImpl.java:227-231 (no @ReactiveTransactional) + ReactiveDataEntityRepositoryImpl.java:629-649"
        note: "Non-transactional offset pagination → possible skip/duplicate under concurrent writes."
    probe_id: P-301
    routes_to_finding: none

- id: H-013
  hypothesis: "Performance of the Popular strip stays acceptable as the catalog grows — opening the home page does not get materially slower at 50K-100K entities."
  derivation: "Pillar/performance negative-space: the home page is the most-trafficked surface; a senior PO asks whether it scales with the catalog."
  seed_source: pillar
  validation:
    verdict: probe-needed
    actual_behavior: |
      The Popular query is `ORDER BY view_count DESC` against data_entity with NO index on view_count
      (verified across all 91 migration files in getPopular.md). For small catalogs the LIMIT lets Postgres
      use a top-N sort; but at 50K-100K+ entities every home-page render is a sequential scan + sort over the
      whole table, on the platform's hottest surface, with no service-layer or HTTP cache to absorb repeated
      home-page loads / back-button re-fetches. The cost is bounded today (UI fetches page=1, size=5, once
      per mount) but the H-002 doubling raises the distinct-view-value count over time, growing the scan-cost
      curve. The actual p99 at scale is unmeasured — P-003 baselined only a small seed (p50=106ms). A seeded
      large-catalog + concurrent-load probe is required to know whether the home page degrades.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: performance.known_performance_gaps
        cite: "ReactiveDataEntityRepositoryImpl.java:633 + migration audit (no view_count index)"
        note: "Unindexed ORDER BY view_count DESC → seq-scan + sort per render; no caching layer."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: tests_coverage_semantic
        cite: "lineage/odd-platform/probe-runs/2026-05-19-P-003.yaml"
        note: "Latency baseline at SMALL seed only (p50=106ms); scale behaviour unmeasured."
    probe_id: P-302
    routes_to_finding: none

