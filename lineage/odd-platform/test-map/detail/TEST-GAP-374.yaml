proposed_action: Add `AlertServiceImplActivityAOPTest` running under a `unit-test`
  profile (or no profile) that explicitly wires `ActivityAspect`, invokes `updateStatus`,
  and asserts an `ALERT_STATUS_UPDATED` activity row was emitted. Pair with a backlog
  item proposing a project-wide unit-test profile that activates ActivityAspect so
  the systemic gap closes across all @ActivityLog services.
