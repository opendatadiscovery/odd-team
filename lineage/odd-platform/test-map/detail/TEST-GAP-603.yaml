proposed_action: |-
  Unit test on CognitoLogoutSuccessHandler. (a) Mock OAuth2Provider with logoutUri=null + clientId='c' + provider='cognito'. (b) Mock WebFilterExchange + Authentication + the WebSession (spied). (c) Invoke handle(). (d) Assert (i) result is Mono.empty(); (ii) response.setStatusCode was NEVER called (status defaults to 200); (iii) response.getHeaders().setLocation was NEVER called; (iv) WebSession.invalidate was NEVER called. (e) Pin: empty logoutUri = silent-no-op = user remains logged in server-side. Future fix (align with Azure NPE, or add boot-time check, or invalidate session even without redirect) flips assertions.
