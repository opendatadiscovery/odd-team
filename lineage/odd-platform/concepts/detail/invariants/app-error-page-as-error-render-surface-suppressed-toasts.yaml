notes: |-
  New invariant captured in batch 2026-05-19J. The AppErrorPage + switchOffErrorMessage
  pattern is intentional and load-bearing — it embodies the project's "expected
  failure for large loads" stance. The pattern is well-understood but has three
  gaps that batch J surfaces:
    (a) Generic fallback message hides backend signal.
    (b) Status-code-agnostic rendering hides 403/404/500 differences.
    (c) No retry affordance for transient failures.

  Recommended improvement: extend AppErrorPage to discriminate by `error.status`
  + add a Retry button + strip URL in production. Affects 10 large-loader thunks
  consistently.

  **Batch ZJ REFINED**: gap (c) — 'strip URL in production' — was a
  redundant recommendation; the widget never rendered URL anyway.
  The actual safety mechanism is implementation-level (the JSX
  selects 2 of 4 fields) and is the load-bearing security property
  of the widget. The correct mitigation is to LOCK IT IN with a
  JSDoc + regression test, not to strip something that was already
  not rendered.

  Cross-references:
    - `app-error-page-controlled-render-helper-not-error-boundary`
      (NEW batch ZJ — the entity definition; the AppErrorPage shape
      that is NOT a global error pane)
    - `no-react-error-boundary-no-catch-all-route-blank-page-root-cause`
      (NEW batch ZJ — the structural architectural absence that
      causes bare /terms and /master-data blank pages)
    - LSN-018 (cross-batch coherence — the SUPERSEDES annotation
      on the 'banner displays url + message' claim from batch J)
