expected_outcome: |
  Hypothesis H-003 (verbatim from the reflection):

  "When an operator opens the 'Test reports' tab for a dataset that EXISTS but
  has zero defined DQ tests, they see an empty-state ('no tests for this
  dataset') rather than an error."

  Static trace (DataQualityController sidecar bugs_limitations_corner_cases[2],
  citing DataQualityServiceImpl.java:38-42 through the controller sidecar):
  getDataEntityDataQATests throws NotFoundException (HTTP 404) when the dataset
  exists but its DQ-test ODDRN stream is empty — i.e. an empty collection
  returns 404, not 200+[]. The 404 message ("Data quality tests for dataset
  with id %d not found") differs from the dataset-not-found 404 message, but a
  status-code-only client cannot distinguish the two. What the TestReport React
  component renders in the 404 case is NOT determinable from the substrate (no
  enriched TestReport sidecar; batch-UI-L notes silent on the empty/404 UI
  state). The probe resolves BOTH the API shape AND the UI rendering.

