notes: |-
  STRENGTHENED batch 2026-05-20X — REFACTOR-419 (cluster-fragility) now has
  3-sidecar triangulation: (1) IngestionController + IngestionDataSourceFilter
  (batch P) — the bridge contract sites; (2) implicit at the
  WebSession-attribute layer (SessionConstants.COLLECTOR_ID_SESSION_KEY);
  (3) SessionConfiguration config-class (batch X NEW) — the WIRING SUBSTRATE
  for the WebSession backing store. The cluster-fragility surface is now
  PRIMARY-SOURCE PINNED at the config-class layer where the IN_MEMORY default
  lives. ADR-CANDIDATE-141 gains a third facet — (a) WebSession over
  SecurityContext, (b) stringly-typed key, (c) **in-memory default rooted at
  application.yml:30 and wired at SessionConfiguration.java:46-49**.

  Cross-references:

    - `two-ingestion-filters-asymmetric-auth` invariant — explains the
      sibling `IngestionDataSourceFilter` and why it's unconditional.

    - `upsert-by-oddrn-partial-merge-collector-driven-only-name-description`
      invariant — the operation enabled by this session bridge.

    - **NEW batch X**:
      `spring-session-timeout-minus-one-housekeeping-noop` — sibling finding
      on the same session-store wiring; under spring.session.timeout=-1
      default the housekeeping job is a no-op, so monotonic growth is
      not bounded by the hourly cleanup.

    - **NEW batch X**:
      `housekeeping-job-no-scheduler-lock-multi-instance-amplification` —
      operational-inconsistency finding on the same housekeeping job;
      N replicas × 1 cleanup/hr = N× DB load.

    - **NEW batch X**:
      `session-cookie-security-attributes-unset` — sibling security finding
      on the same WebSession layer; cookie defaults are framework-level only,
      no platform override.

  Doc-side recommended action: extend the custom-collectors developer
  guide with a "Cluster deployment" subsection naming the
  cluster-without-sticky-sessions gap and listing the two alternative
  session providers (REDIS / INTERNAL_POSTGRESQL).
