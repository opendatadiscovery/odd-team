proposed_action: |-
  Unit test: construct HousekeepingJobManager with List<HousekeepingJob> = [@Mock throwingJob (always throws new RuntimeException), @Mock job2, @Mock job3]. Invoke runHousekeepingJobs(). Assert (a) throwingJob.doHousekeeping invoked exactly once, (b) job2.doHousekeeping invoked exactly once, (c) job3.doHousekeeping invoked exactly once, (d) log.error captured the exception's message. LOCKS the per-job isolation contract; the test must update if isolation semantics change.
