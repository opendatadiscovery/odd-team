realism_caveats: |
  - The assertions on the 5xx cases use `>= 500` rather than an exact `== 500`
    because the platform's reactive exception-translation chain
    (JooqReactiveOperations -> ExceptionUtils) may map a DataAccessException to
    500 directly or to a more specific 5xx; the probe pins "the request fails
    with a server error", and the probe-runner should record the EXACT status
    observed so the sidecar can be tightened to the measured value.

  - The probe does NOT exercise the literal-`null` page/size variant (the
    NullPointerException-on-unboxing path). Spring's @RequestParam binding for
    an OpenAPI-defaulted parameter typically substitutes the default, so a
    literal null is hard to send through a normal HTTP client; that case is
    better pinned by a focused service-layer unit test and is left out of this
    integration probe deliberately.

  - The probe runs under DISABLED auth (stack_profile odd-minimal). The
    page/size arithmetic boundary is auth-mode-agnostic — the SQL is identical
    across modes — so DISABLED is sufficient and minimises setup cost.

  - If an input-validation fix later lands on getPopularTagList (e.g. @Min(1)
    on page, @Min(0) @Max(N) on size, turning the 500s into 400s), this
    probe's 5xx assertions FLIP — the failing assertion surfaces the fix in
    CI, at which point the maintainer updates the assertions to the new
    contract (400 for out-of-range inputs). That is the intended probe
    lifecycle: pin the current behaviour, surface the fix, update, ship.
