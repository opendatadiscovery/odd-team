notes: |-
  NEW invariant captured in batch 2026-05-25-ZD. Smallest fix is
  path (A) — a one-line change that aligns the wizard get
  path with the sibling service-tier conventions. DOC-NNN
  candidate either way to ensure the operator-visible behaviour
  is documented on the live API reference.

  STRENGTHENED batch 2026-05-25-ZF — the DataCollab redirect
  surfaces a SECOND instance of the class-of-bug. The DataCollab
  variant is more concerning operationally because it COMPOSES
  with the missing RBAC permission (per
  `rbac-read-endpoints-no-securityrule-authenticated-only-fall-through`)
  to create a message-existence-by-id ORACLE: ANY authenticated
  user can probe IDs and distinguish 200/empty (does not exist)
  from 302/slack-url (exists). The DataCollab fix should
  PRIORITISE the switchIfEmpty addition over the OpenAPI spec
  edit because the operator-visible UX (blank tab on click) is
  more confusing than a typed 404.
