behaviour: |-
  **CATALOGUE-VS-GRANT DIFFERENTIAL RENDER (UI half of F-006 soft_delete_aware_visibility_inconsistency).** PolicyList consumes `policyApi.getPolicyList` → `PolicyServiceImpl.list` → `policyRepository.list(...)` which auto-applies `WHERE deleted_at IS NULL` via `ReactiveAbstractSoftDeleteCRUDRepository`. The list shows a CONSISTENT post-delete view (deleted policy gone from rows). BUT the GRANT path `getRolesPolicies(roleIds)` invoked on every authorized request (per ReactivePolicyRepositoryImpl batch-H finding `known_security_gaps[0]`) has NO `deleted_at IS NULL` filter — a role bound to a soft-deleted policy continues to confer that policy's permissions. An operator looking at the Policies tab sees the policy is GONE; the OPERATING reality is that the role still grants. NO test asserts this differential render: there is no integration test that (a) seeds a Role with a Policy bound via `role_to_policy`, (b) soft-deletes the Policy via direct DB UPDATE, (c) renders PolicyList and asserts the Policy is GONE from the list, (d) calls `getRolesPolicies` for the role and asserts the Policy is STILL returned. A regression that fixed the LIST path to leak soft-deleted policies (or the GRANT path to filter them) would not be caught — and the current dangerous-but-shipping behaviour has no pin. This is the HIGHEST-LEVERAGE UI-anchored regression-pin for F-006.
