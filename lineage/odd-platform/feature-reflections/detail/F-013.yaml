- id: H-012
  hypothesis: "When a curator soft-deletes a custom metadata field, values previously attached to that field disappear from the entity detail pages (the deleted field is gone everywhere)."
  derivation: "Negative-space: deleting a field should remove it from the read surfaces; the dropdown (listInternalMetadata) DOES filter soft-deleted out, setting the expectation that deletion is consistent across surfaces."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      getDtosByDataEntityId (the per-entity detail-page metadata join, ReactiveMetadataFieldRepositoryImpl.java:111-121) carries NO `.where(METADATA_FIELD.DELETED_AT.isNull())` filter. Soft-deleted fields with values still attached to an entity surface on the detail page. The dropdown (listInternalMetadata) DOES filter soft-deleted out via addSoftDeleteFilter. So soft-deleting a field hides it from the autocomplete but NOT from per-entity rendering — orphan-like values stay visible. Combined with the no-CASCADE FK and the partial-unique-index soft-delete mismatch, the soft-deleted name even blocks re-creation while reporting "doesn't exist" on the read side.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveMetadataFieldRepositoryImpl
        section: invariants ("getDtosByDataEntityId does NOT apply soft-delete filter on metadata_field")
        cite: "ReactiveMetadataFieldRepositoryImpl.java:111-121 (no deleted_at filter on the join)"
        note: "soft-deleted field renders on detail page but not in dropdown — cross-surface split"
    operator_visible_failure: |
      A curator who deletes a field still sees its values on every entity that had them — the deletion looks broken (the field is "gone" from the add-dropdown but still shows on entities). Re-creating the same field name is impossible (UniqueConstraintException 'Internal metadata with this name already exists') because the partial unique index ignores deleted_at, while the read side says the field doesn't exist — an unrecoverable confusing state with no hard-delete path in the codebase.
    severity: MEDIUM
