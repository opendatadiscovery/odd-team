behaviour: |-
  **LOW — `ActivityHandler.getUpdatedState(Map<String, Object> parameters, List<Long> dataEntityIds)` (`:17-21`) is a DEFAULT method that throws `UnsupportedOperationException("getUpdatedState for multiple ids is not implemented yet for this handler")` UNLESS overridden by concrete impls. Only 2 of 18 concrete impls override the default — `DataEntityCreatedActivityHandler.getUpdatedState(parameters, List<Long>)` (`:46-49`) and `DataEntityStatusUpdatedActivityHandler.getUpdatedState(parameters, List<Long>)` (`:51-55`). All 16 other concrete impls inherit the throwing default. The ONLY current caller of the multi-id path is `ActivityIngestionRequestProcessor.process` (`:25-32`) which dispatches `DATA_ENTITY_CREATED` only — so the runtime is safe in current usage, but the interface contract advertises a polymorphic batch path that 14/16 impls do NOT support. A future `@ActivityLog` annotation passing a multi-id parameters bag for any other event would throw at runtime with the misleading error message above.** No CI-time check enumerates impl × method-override matrix.

  **Primary-source chain**:
  - `ActivityHandler.java:17-21` — the default method body:
    ```
    default Mono<Map<Long, String>> getUpdatedState(Map<String, Object> parameters, List<Long> dataEntityIds) {
        throw new UnsupportedOperationException("getUpdatedState for multiple ids is not implemented yet for this handler");
    }
    ```
  - `DataEntityCreatedActivityHandler.java:46-49` — ONE of two overrides (currently used)
  - `DataEntityStatusUpdatedActivityHandler.java:51-55` — the SECOND override
  - 16 other concrete handlers do NOT override (verified by sidecar enumeration)
  - `ActivityServiceImpl.java:75` — `handler.getUpdatedState(parameters, dataEntityIds)` — the dispatch site
  - `ActivityIngestionRequestProcessor.java:25-32` — the only current caller (dispatches DATA_ENTITY_CREATED only)

  **The contract drift** (per ActivityHandler.md:stress_findings.S-B-3):
  - The interface advertises the multi-id path as a polymorphic API
  - 14/16 concrete impls inherit a throwing default — the multi-id path is effectively NOT implemented
  - At current usage, the only caller dispatches the ONE event type whose handler DOES override the default — safe at the current state
  - A future `@ActivityLog` annotation adding a batch path for any other event would throw at runtime — the error message is misleading ("not implemented yet for this handler") because it suggests intentional deferred implementation, not "we didn't think to implement this"

  **Operator-visible consequences**:
  - **No current impact**: only DATA_ENTITY_CREATED uses the batch path; the impl overrides; the system works
  - **Latent regression risk**: a future maintainer adding `@ActivityLog(event = OWNERSHIP_UPDATED, multiId = true)` (or equivalent) would discover the missing override at FIRST INVOCATION, not at boot time
  - **Error-message clarity**: the message "not implemented yet for this handler" frames the absence as deliberate-but-temporary, opt-in-when-needed; a maintainer reading this in a stack trace may pursue the wrong fix (assume it's a temporary missing impl rather than a structural gap)
  - **Compile-time silence**: the interface contract does NOT use `@FunctionalInterface` or `abstract` on the multi-id method; the language allows any concrete impl to silently inherit the default — no IDE warning

  **Why LOW not MEDIUM**:
  - The current runtime is safe (the only caller dispatches an event whose handler overrides)
  - The fix is well-understood: enumerate `ActivityEventTypeDto` × handler.isHandle × handler.getUpdatedState-override matrix at boot time
  - We rate LOW because: (a) the failure mode is LOUD (UnsupportedOperationException with named message); (b) the empirical hit rate is currently zero; (c) the regression risk is real but bounded by the deliberate need to add a new multi-id call site

  **Connection to TEST-GAP-882**:
  - TEST-GAP-882 is the META anchor for handler-tier coverage; this gap (881) is one of the specific behaviours that the META coverage would assert
