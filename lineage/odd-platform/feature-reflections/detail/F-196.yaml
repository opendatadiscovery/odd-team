# Per-Entity Activity Tab (Audit-Trail Surface, entity-scoped) — product-owner reflection

## product_owner_narrative

The **per-entity Activity tab** is the entity-scoped sibling of the global Activity Feed (F-021) — the audit-trail surface a data steward reaches by opening any data entity's detail page and clicking the **Activity** tab. Where the global feed answers "what changed across the whole catalog?", this surface answers the narrower, more common operator question: "what has happened to THIS dataset / transformer / quality test?" The audience is the same three personas as the parent — a steward reviewing their entity's change history, an engineer diagnosing "why did this dataset's schema/description change last week?", and a compliance reviewer auditing actions on a regulated entity (per `system-mission.md:200-220` P-07 pillar + the parent F-021 reflection narrative). It is reached at `/dataentities/{id}/activity`, mounted at `DataEntityDetailsRoutes.tsx:105` as a BARE route — no `RestrictedRoute`, no `WithPermissionsProvider` (verified against the F-196 feature-flow hop-1 evidence + the parent F-021 batch-ZL/UI-A finding that the global route is identically unguarded).

A user interacts with this surface through a deliberately leaner control set than the global feed (per Rule-8 source read of `DataEntityActivity/Filters/Filters.tsx:44-60`): exactly **three filters** — a Calendar (date range), an Event-type single-select, and a `User` multi-select — composed inside a 13-line two-column shell (`DataEntityActivity.tsx:6-13` — Filters left, ActivityResults right, no state, no hooks, no permission gate). There is **NO view-mode tab axis** (no ALL / MY_OBJECTS / UPSTREAM / DOWNSTREAM) and **NO** datasource / namespace / tag / owner filters — all of which the global feed exposes. The reasoning is sound from a product view: the entity is already fixed, so the four ownership-scope view-modes and the cross-catalog facets collapse to nothing meaningful here (the live doc, WebFetched 2026-06-03 status 200, now states this verbatim: "exposes a smaller filter surface than the global Activity page does (the entity is already fixed)"). On any filter change, `ActivityResults.tsx:41-45` dispatches a single `fetchDataEntityActivityList({...queryParams, dataEntityId, isQueryUpdated: true})` — ONE backend query per twiddle, distinct from the global feed's five-query (4-count + 1-list) pattern; the per-entity surface has no counts companion.

Behind the screen, the tab calls `GET /api/dataentities/{id}/activity` → `DataEntityController.getDataEntityActivity` (`DataEntityController.java:351-365`) → `activityService.getDataEntityActivityList(beginDate, endDate, size, dataEntityId, userIds, eventType, lastEventId, lastEventDateTime)` (per the DataEntityController class sidecar `concepts.operations` line 48). Two structural facts matter here. First, the per-entity service signature **takes `userIds` but NOT `ownerIds` and NOT `type`** — narrower than the global `/api/activity` signature; the per-entity surface is entity-id-scoped, not view-mode-scoped. Second, the backend posture is the same as every other per-entity read on `DataEntityController`: NO `@PreAuthorize`, NO `SecurityConstants.SECURITY_RULES` entry for the GET path, NO `OWNERSHIP` join, soft-delete-inclusive existence check — every authenticated user reads any data entity's audit trail by enumerating `data_entity_id`, including JSONB old/new-state diffs and including soft-deleted entities (per the DataEntityController class sidecar `security.known_security_gaps[2]` "getDataEntityActivity exposes who-changed-what audit trail to any authenticated user" + `data_exposure[3]`, and the F-014 sibling `getDataEntityAlerts` sidecar which documents the identical cross-owner + `existsIncludingSoftDeleted` shape line-by-line).

The integration story is a tight sibling relationship rather than a cross-pillar fan-out. This surface **shares the entire backend chain mechanism with F-021** — the `userIds` → `USER_OWNER_MAPPING.OWNER_ID` bind (LSN-020), the provider-agnostic actor-resolution LEFT JOIN on `OIDC_USERNAME = ACTIVITY.CREATED_BY`, the `INNER JOIN DATA_ENTITY` (hard-delete history erasure), the absent DISTINCT, and the unbounded `size` — because the per-entity find queries are built by the same `ReactiveActivityRepositoryImpl.getCommonConditions`. It **shares the per-entity-tab structural pattern with F-014** (Per-Entity Alert View): both mount a bare tab, both read cross-owner, both use a soft-delete-inclusive existence check, both survive entity soft-deletion. And it **inherits the i18n amplifier from F-043** — the `t('User')` label resolves to the literal 'User' in all six locales, so the misleading label ships uniformly to every language (per F-021 batch ZJ).

A product owner demoing this tab should highlight three edge cases. (a) The **`User` filter is mislabelled and, on a single entity, the mislabel is worse than on the global feed**: on one dataset the only natural actor question is "who touched THIS?" — and that is precisely the question the filter cannot answer, because it lists Owners and binds OWNER_ID (the actor column `activity.created_by` is JOINed and SELECTed but never filtered). (b) The **Activity tab is the ONLY entity-detail tab without a `hidden:` clause** (`DataEntityDetailsTabs.tsx:91-94`) — it is the single surviving tab on a soft-deleted entity, which is operationally correct (audit history matters most on deleted entities) but visually inconsistent and, combined with the ungated route, means the audit trail of a soft-deleted (UI-hidden) entity is reachable by any authenticated user. (c) The **race-and-staleness contract** — one un-debounced, un-cancellable query per filter change means rapid calendar twiddling lets the redux reducer accept whichever response lands last regardless of correlation to the latest filters (lower amplitude than the global feed's 5-query version, same race class).

