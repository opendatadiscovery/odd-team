behaviour: |-
  **HIGH — Broken debouncer on Catalog page facet PUT calls. IDENTICAL bug shape to TermSearch batch-U bugs[2] — propagated via clone.** Search.tsx:50-65 wraps `useDebouncedCallback(..., 1500, {leading: true})` in a `useCallback` whose deps include `searchFacetParams`. Every facet click constructs a NEW `useDebouncedCallback(...)` instance — the prior debouncer's pending trailing-edge timer is unreachable. With `{leading: true}`, the new debouncer fires on its FIRST call (immediately) AND would defer a trailing call until 1500ms — but the trailing call NEVER fires because the next click constructs yet another debouncer.

  **Effective behaviour**: every facet click dispatches `updateDataEntitiesSearch` immediately; the 1500ms "debounce" is not actually rate-limiting anything. A user rapidly clicking 5 facets in 2 seconds dispatches 5 PUT `/api/search/{searchId}/facets` calls instead of the intended 1.

  **Server-side cost** (per batch-M SearchController.facets sidecar + SearchServiceImpl):
  - Each PUT = one `search_facets` row UPDATE + one full facet-state recompute
  - Per-PUT cost scales O(# facet options × # facets × catalog size)
  - For a 100K-entity deployment, 5 PUTs in 2 seconds adds up to a substantial backend cost burst the platform's rate-limit-free posture (REFACTOR-220 family) does not mitigate.

  **Why HIGH**:
  - **Functional**: the debounce intent is documented (1500ms throttle) but unrealised — a future maintainer reading the code sees the throttle and assumes it works.
  - **Performance**: backend N× cost amplification per N facet clicks.
  - **Concurrency**: the slice's `assignFacetStateWithNewFacets` reducer at slice.ts:73-86 RACES with itself when N in-flight PUTs settle out of order. The slice handles the race correctly (idempotent state merge), but the wasted server-side cost is real.
  - **Architectural blast radius**: the same bug ships in TermSearch.tsx (batch-U bugs[2] — confirmed identical pattern). The clone-propagation hazard is the meta-finding.

  **Test gap shape**: A `Search.test.tsx` + `TermSearch.test.tsx` parallel pair asserting that rapid facet clicks coalesce into a single PUT call after the 1500ms window. The assertion FAILS today (observes N PUT calls); after the fix (`useMemo` the debouncer instead of `useCallback`-recreating it, OR remove `searchFacetParams` from the deps), the assertion PASSES.

  **Cross-component fix**: This is a SINGLE-PR architectural refactor (one debouncer pattern, two consumer files). The test pins both Search and TermSearch — fixing the pattern in one without the other would break the other test, surfacing the cross-component scope.
