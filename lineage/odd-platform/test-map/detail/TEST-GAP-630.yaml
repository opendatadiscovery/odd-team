proposed_action: |-
  Add `AlertManagerWebhookWireDropTest` with four test methods: (a) POST a real-world AlertManager v2 payload with `status: resolved`, `endsAt`, `annotations`, `fingerprint`; assert HTTP 204; assert alert row was CREATED (NOT resolved) — pins the silent-drop / no-auto-resolve behaviour; (b) seed an OPEN alert, then POST a `status: resolved` AlertManager payload referencing the same entity_oddrn; assert the original alert remains OPEN; (c) assert annotations field is not stored anywhere; (d) assert fingerprint/groupKey are not stored. All pin the current wire-field drop. Future fix that adds resolved-status handling will break (a) and (b), forcing explicit migration.
