behaviour: |-
  **GenAI endpoint has NO rate limit, NO per-user quota, NO max-concurrent-requests cap — denial-of-service AND unbounded-cost surface.** `POST /api/genai/ask` accepts requests as fast as any authenticated principal can submit them (any logged-in user under LOGIN_FORM/OAUTH2/LDAP, or any anonymous caller under DISABLED). Combined with the absence of `@Size` on `GenAIRequest.body` (only the implicit `spring.codec.max-in-memory-size: 20MB` ceiling at `application.yml:15`), this is BOTH:

  - **DoS surface**: a single user (or a worm in the network under DISABLED) can submit a flood of 20MB prompts, exhausting Reactor Netty's event-loop and upstream LLM service connection pool.
  - **Unbounded-cost surface**: the operator's external LLM bills per-token; the platform forwards every request verbatim with no spend-cap, no per-user quota, no audit accounting. A malicious or buggy script can burn through the operator's LLM budget in hours.

  No test asserts this posture. The current state is intentional (the live doc states "deploy behind a network policy / mesh / ingress that authenticates / restricts callers") but the platform offers NO defense-in-depth — a missed network policy at the deployment layer leaves the GenAI surface unprotected.

  **Distinct from existing TEST-GAP-037** (which pins unbounded prompt-body SIZE). This gap pins unbounded REQUEST FREQUENCY + unbounded COST. A test pinning rate-limit posture would also serve as a guardrail when a future hardening (e.g. `@RateLimit` annotation, per-user counter in Micrometer) lands.
