terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Two-row INSERT chain on auto-approve branch:
    (i) `owner(id, name, deleted_at=NULL)` — new Owner row (if name unseen)
        via getOrCreate side-door (audit-silent — no @ActivityLog).
    (ii) `user_owner_mapping(user_id, owner_id, ...)` — binding row tying
        the requesting user to the freshly-minted Owner.
    Combined effect: user is now bound to an Owner they themselves
    chose-and-minted. Policy conditions `dataEntity:owner == 'X'` for the
    chosen X become attacker-controllable.
  evidence: "OwnerAssociationRequestServiceImpl.java:55-67 + :184-190"
observed_vs_expected:
  facets:
    - drift_class: self_mint_then_self_bind_privilege_chain_via_direct_owner_sync
      description: |-
        DIRECT_OWNER_SYNC was designed for OIDC-group-mapped users where the
        IdP authoritatively binds users to owners (per the auto-approve
        branch's intent). The implementation does NOT verify the OIDC group
        mapping; the permission alone is sufficient. Combined with the
        getOrCreate side-door (F-019 facet), a user with the permission can
        self-mint-and-self-bind to an arbitrary owner name.
      evidence:
        - "OwnerAssociationRequestServiceImpl.java:55-67 (permission-only check)"
        - "OwnerServiceImpl.java:38-42 (mint side-door)"
        - "PolicyPermissionDto.java:70 (DIRECT_OWNER_SYNC MANAGEMENT)"
    - drift_class: openapi_permission_editor_does_not_warn_about_composition_hazard
      description: |-
        The OpenAPI-generated permission editor in the UI allows operators
        to grant DIRECT_OWNER_SYNC to ad-hoc Policies without warning them
        about composition with the getOrCreate side-door. Operators
        reading the live `/permissions` page see only "Allows associating
        a user with an owner without an approval request" — silent on the
        self-mint hazard.
      evidence:
        - "live /permissions doc WebFetched 2026-05-25 (single-line description)"
        - "PolicyPermissionDto.java:70"
    - drift_class: live_doc_user_owner_association_silent_on_auto_approve_branch
      description: |-
        Live `/configuration-and-deployment/enable-security/authorization/user-owner-association`
        (WebFetched 2026-05-20, status 200) documents ONLY the two-step
        SELF-request + Admin-approve flow. The DIRECT_OWNER_SYNC
        auto-approve branch is invisible — operators cannot discover this
        capability from the docs.
      evidence:
        - "live doc page WebFetched 2026-05-20"
    - drift_class: mint_path_audit_silent_on_self_mint
      description: |-
        The Owner mint side of the chain emits no `@ActivityLog` (audit
        silence on Owner-create; F-019 root finding). The auto-approve
        request itself DOES emit to `owner_association_request_activity`
        with `isManual=false`, so the chain is forensically
        partially-recoverable — but the mint itself is not.
      evidence:
        - "OwnerServiceImpl.java:38-122 (Grep zero @ActivityLog on the trinity + getOrCreate)"
        - "OwnerAssociationRequestServiceImpl.java approval path emits to activity"
    - drift_class: rest_path_no_security_rule_anyone_reaches_endpoint
      description: |-
        `POST /api/owner_association_request` has NO entry in
        SecurityConstants.SECURITY_RULES → the DIRECT_OWNER_SYNC check is
        in-service, not at the SecurityRule layer. Combined with
        `auth.type=DISABLED`, anonymous callers reach the endpoint.
      evidence:
        - "SecurityConstants.java:148-162"
        - "OwnerAssociationRequestController.java:28-34"
