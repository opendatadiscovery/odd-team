  - "GithubUserHandler.md:tests_coverage_semantic.uncovered_behaviours.[11] (multi-page /user/teams)"
behaviour: |-
  **`/user/teams` pagination silently truncated to first page (default 30 items) — silent ADMIN demotion possible.** Lines 104-113 fetch `/user/teams` with NO `?page=N`, NO `Link` header handling, NO recursion over pages. GitHub's `/user/teams` returns ALL teams across ALL orgs the user belongs to (not scoped by ?org). A user in 31+ teams may have their ADMIN-qualifying team beyond the first page, silently demoting them to USER. Rare in single-org deployments; sharper risk for users in many GitHub orgs (e.g. consultants, open-source maintainers). The handler reads the first 30 teams; if `adminGroups` matches a team on page 2+, the user gets USER role instead of ADMIN.
test_class: missing-edge-case
