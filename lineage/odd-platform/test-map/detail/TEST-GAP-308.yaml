  at ReactiveDataEntityRepositoryImpl.java:228-253 has NO owner filter. Contrast:
  the base /my endpoint''s repository method listByOwner JOINs against OWNERSHIP with
  WHERE OWNERSHIP.OWNER_ID = ?.'''
