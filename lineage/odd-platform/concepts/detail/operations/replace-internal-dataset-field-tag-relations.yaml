name: Replace Internal Dataset-Field Tag Relations (origin-scoped delete-then-recreate)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-08
  - P-09
description: |-
  NEW OPERATION, batch X-TAGGING (2026-05-21) — captures
  `PUT /api/datasetfields/{dataset_field_id}/tags` (operationId
  `updateDatasetFieldTags`) at the operation-concept level. This is the
  DATASET-FIELD-side member of the tag-relation write trio; it is a
  DISTINCT operation from `upsert-internal-tag-relations-replace-all`
  (the data-entity path) and `replace-all-term-tag-relations` (the term
  path). The three are kept as separate concepts because the
  dataset-field path differs materially: it discards-and-rebuilds rather
  than diffs, it has a THREE-VALUE TagOrigin discriminator, and it
  carries the most-complete activity-feed audit story of the trio.

  THE ENDPOINT:
    PUT /api/datasetfields/{dataset_field_id}/tags -> HTTP 200, Flux<Tag>.
    Authorization is PARENT-SCOPED: the DATASET_FIELD AuthorizationManagerType
    resolves the dataset-field id to its owning data-entity id (via
    DatasetFieldResourceExtractor.getDataEntityIdByDatasetFieldId), then
    evaluates DATASET_FIELD_TAGS_UPDATE — itself a DATA_ENTITY-scoped
    enum member — against the PARENT data entity's Policy context.
    SecurityConstants.SECURITY_RULES at SecurityConstants.java:288-290.

  THE CHAIN — delete-all-then-recreate (NOT a diff):
    DatasetFieldController.updateDatasetFieldTags (DatasetFieldController.java:55-63)
    — 4-line reactive handler reading Mono<DatasetFieldTagsUpdateFormData>.
    -> DatasetFieldServiceImpl.updateDatasetFieldTags
       (DatasetFieldServiceImpl.java:117-132, @ReactiveTransactional +
       @ActivityLog(event = DATASET_FIELD_TAGS_UPDATED)):
       Step a: deleteDatasetFieldInternalRelations(datasetFieldId) —
               unconditional `DELETE FROM tag_to_dataset_field WHERE
               dataset_field_id = ? AND origin = 'INTERNAL'`
               (ReactiveTagRepositoryImpl.java:289-295).
       Step b: getOrCreateTagsByName auto-creates any submitted name
               absent from the global tag directory; each resolved tag
               becomes a TagToDatasetFieldPojo with tagId + datasetFieldId
               set but `origin` LEFT UNSET.
       Step c: createDatasetFieldRelations — batched INSERT with
               onDuplicateKeyIgnore.
       Step d: updateDatasetFieldSearchVectors refreshes the
               dataset-field search vector.
       Step e: markDataEntityByTags toggles
               data_entity_filled.dataset_field_tags_filled.
       Step f: re-read listDatasetFieldDtos and map to Flux<Tag>.

  ORIGIN-SCOPED REPLACE — INTERNAL only, ingestion-set protected:
    The delete is gated by `origin = 'INTERNAL'`. The TagOrigin enum has
    THREE members: INTERNAL, EXTERNAL, EXTERNAL_STATISTICS. EXTERNAL and
    EXTERNAL_STATISTICS relations (ingestion-sourced, including the
    dataset-statistics-derived tags written by DatasetFieldServiceImpl.updateFieldsTags)
    SURVIVE this UI/API call. A caller cannot remove ingested-statistics
    tag relations through this endpoint. This is the schema-level
    multi-channel ownership model — see the existing
    `tag-with-internal-vs-external-distinction` candidate.

  THE LOAD-BEARING FRAGILITY — relation INSERT relies on a DB default
  (probe P-030):
    getUpdatedRelations builds TagToDatasetFieldPojo with only tagId +
    datasetFieldId, NEVER origin — it relies on the DB column default
    `origin varchar NOT NULL DEFAULT 'INTERNAL'`
    (V0_0_82__add_tag_to_dataset_field.sql:12). The data-entity sibling
    path side-steps this entirely by explicitly calling .setExternal(false).
    If jOOQ's newRecord-from-pojo emits an explicit NULL for the unset
    origin field, the INSERT violates the NOT NULL constraint and the
    endpoint is BROKEN for any non-empty tags payload. Statically
    uncertain; untested; pinned by probe P-030. This is a CRITICAL
    untested path.

  ACTIVITY AUDIT — the most complete of the trio:
    @ActivityLog(event = DATASET_FIELD_TAGS_UPDATED) annotates the
    service method; DatasetFieldInformationUpdatedActivityHandler.getState
    serialises the field's COMPLETE before/after tag list (id + name per
    tag) into both oldState and newState. This is notably more complete
    than the data-entity tag path (which captures only the parent
    dataEntityId) and than the term-tag path (which emits NO event at all).

nodes:
  - odd-platform java DatasetFieldController controller-method:updateDatasetFieldTags

