name: Popular Ranking Signal — "most-viewed OR most-used" Doc Claim Misleading
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: |-
  **NEW CANONICALISATION CANDIDATE, batch 2026-05-19J — doc vagueness vs code
  precision**. The live doc page
  `https://docs.opendatadiscovery.org/features/data-discovery/catalog-overview`
  (local at `catalog-overview.md:50`) describes the Popular column as: "the
  most-viewed or **most-used** data entities across the catalog". **The code is
  precise**: the ranking signal is **exclusively** `view_count DESC` (per batch-G
  getPopular sidecar + batch-H ReactiveDataEntityRepositoryImpl SQL primary source
  at line 633 — the SOLE order signal; id DESC tiebreaker only). **There is no
  "most-used" signal in the platform** — no usage-frequency counter, no
  time-weighted usage, no edit-count, no API-call-count, just the singular
  `view_count` field that increments only on `GET /api/dataentities/{id}`. **The
  "or most-used" disjunction misleads operators** into thinking the ranking
  blends multiple signals; in reality the ranking is monotonically driven by
  detail-reads only — an entity that has never been viewed (but is heavily
  INGESTED, EDITED, ALERTED on, or appears in many lineage walks) has
  view_count=0 and cannot reach Popular regardless of any other "use". **This
  is the F-001 inflatability surface restated in doc terms**: the docs obscure
  the single-signal nature of the ranking. **Recommended doc fix**: replace
  "most-viewed or most-used" with "most-viewed", with an explicit note that
  view_count is incremented on every detail-page-read.
contributing_concepts:
- popular-entities-ranking
- view-count-update-read-loop-closed-trivially-inflatable-no-anti-abuse-signal
suggested_canonical_choice: |-
  Update the doc page `/features/data-discovery/catalog-overview` line 50:
  replace "the most-viewed or most-used data entities across the catalog" with
  "the most-viewed data entities across the catalog, ranked by `view_count`
  (incremented on every GET /api/dataentities/{id} call — see Configuration &
  Deployment > Catalog Tuning for tuning options)".
suggested_add_to_docs: true
rationale: |-
  This is a Cornerstone 1 finding (doc-product editorial coherence). The doc
  claim is technically incorrect — "most-used" implies a usage signal that
  doesn't exist. The fix is a 5-word doc change.

  A more thorough fix would also document the read-as-write side-effect of
  GET /api/dataentities/{id} on the Catalog Tuning page — operators tuning
  the Popular ranking need to know what drives the signal.
