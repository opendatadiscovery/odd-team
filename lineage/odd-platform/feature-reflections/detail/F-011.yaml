# Principal-to-Owner resolution — product-owner reflection

## product_owner_narrative

Principal-to-Owner resolution is the **single per-request chokepoint** that answers "who is the human making this call, and which catalog Owner are they?" for ODD Platform. A product owner introduces it like this: "When you sign in — by form, by your corporate LDAP, by Google/GitHub/Azure/Cognito SSO, or as a server-to-server API client — the platform resolves your login into a catalog **Owner** entity. That Owner is what makes 'My Objects', 'My Alerts', and 'my' activity show *your* things, and what your role bindings attach to. One service, `AuthIdentityProviderImpl`, does this resolution for all 15 places in the platform that need to know who you are" (per `AuthIdentityProviderImpl.md` understanding + the F-011 chain `description`). The audiences are the platform-operator (who picks the auth mode), the odd-platform-ui-end-user (who experiences My-Objects scoping), the odd-api-consumer (S2S callers), and the data-steward-owner (the Owner identity being resolved) — per `system-mission.md:249-268` (P-09) + `:334-335`.

A user interacts with this feature mostly *implicitly*. There is no "resolve my identity" button. The visible surfaces are: the **top-right user-name label** in the persistent `AppToolbar` (which renders `owner?.name ?? identity?.username`, preferring the catalog Owner display-name over the raw login — `AppToolbar.md` operations + `AppToolbar.tsx:74`); the **Logout link** in the same toolbar (a full-page `window.location.href = '/logout'` that hands all session-termination to the backend handler chain — `AppToolbar.tsx:35-37`); the **nine-tab navigation strip** rendered unconditionally by `ToolbarTabs.tsx:34-82`; and, behind the scenes, every owner-scoped read (`/my` objects, `/my` alerts, the MY_OBJECTS activity view, per-Owner discussions). The login screen itself is **not** an ODD React component — there is no `LoginForm` in `odd-platform-ui/src` (Grep-confirmed zero matches, per the batch-Q `AppToolbar` substitution note); LOGIN_FORM and LDAP render Spring Security's framework-default HTML page, OAUTH2 redirects to the IdP's hosted login, and DISABLED skips login entirely. (Because the toolbar + tab-strip + error page ARE enriched UI sidecars in the chain — batches Q + ZJ — this reflection is NOT API-only; Rule 9's UI-absent validation_gap does not apply. The one hole is hop-4: the 15 owner-scoped consumers are referenced but not individually enriched — see validation_gaps.)

The working parts, as a product owner would demo them: **mode dispatch** (`auth.type` selects exactly one of DISABLED / LOGIN_FORM / OAUTH2 / LDAP, with S2S composing additively — per `system-mission.md:262-264` + backlog ADR-0074); **identity construction** (`AuthIdentityProviderImpl.java:29-33` builds `UserDto(username, provider)` where `provider` is the OAuth2 client-registration id *only* for OAUTH2 — every other mode gets `provider=null`); **role extraction** (the first GrantedAuthority becomes ADMIN or USER — `AuthIdentityProviderImpl.java:41-46`); and **owner resolution** (a single jOOQ `SELECT owner.* FROM user_owner_mapping JOIN owner WHERE oidc_username=? AND deleted_at IS NULL AND (provider=? OR provider IS NULL)` — `ReactiveUserOwnerMappingRepositoryImpl.java:77-85, 116-127`). The customer's mental model — "the platform knows who I am and shows me my stuff" — is honoured on the happy path of a single, stable, OAUTH2-or-consistently-named deployment. The reflection's job is to find where the assembled product diverges from what an operator running a *real* deployment (multi-mode, migrated, SSO-renamed, multi-admin) would expect.

The integration story (per `system-mission.md` cross-pillar graph + the F-011 `cross_pillar_relationships`): this feature **feeds every owner-scoped pillar**. `fetchAssociatedOwner()` is the load-bearing primitive consumed by Data Discovery's `/my` reads (P-01), Lineage's `/my/{up,down}stream` anchor-set defence (P-05 — the POSITIVE case; `LineageServiceImpl` is the NEGATIVE case that skips it, the F-005/PLT-100 surface), the Glossary's per-Term permission gate (P-06), and Alerts/Activity/Discussions per-Owner scoping (P-07). It **feeds-from** the OAuth handler tier (which produces the `OAuth2AuthenticationToken`) and the S2S filter and the four `*SecurityConfiguration` beans (which populate the SecurityContext). It is **read-side mirrored** in the Activity Feed (F-021), where the cross-mode collapse becomes an audit-integrity problem.

A product owner would flag five edge cases in a demo. (a) **Two different people with the same username across modes become the same person** — the cross-mode bleed; the highest-severity finding. (b) **A brand-new SSO user sees a completely empty personalised platform with no explanation** — no Owner is auto-created on first login, and `fetchAssociatedOwner` returns empty-Mono (HTTP 200 + `[]`), not a 403 or an onboarding prompt. (c) **An S2S API-key client can silently inherit a human user's Owner** if that user happens to be named `ADMIN` (uppercase). (d) **Editing an Owner's name to update *only* the name silently wipes all that Owner's role assignments** if the API client omits the `roles` field. (e) **Under the default `auth.type=DISABLED`, the toolbar shows everyone as "admin", every tab including Management is visible, and clicking Logout 404s** — the as-shipped posture is fully open, and the UI gives no signal of it. The v0.3.0 finding that wraps all of these: **none of the five — nor any of the 13 promises below — has a verifying test.**

## hypotheses

- id: H-001
  hypothesis: |
    When a deployment runs two non-OAUTH2 auth modes (e.g. it migrates LOGIN_FORM → LDAP),
    and two GENUINELY DIFFERENT people happen to have the same username string in each
    (a LOGIN_FORM user 'alice' and a later LDAP user 'alice'), the platform treats them
    as two distinct identities — the LDAP 'alice' does NOT see the LOGIN_FORM 'alice''s
    My Objects, My Alerts, owner-scoped mutations, or role bindings.
  derivation: |
    The live user-owner-association doc promises "one user can be associated only with
    one owner and vice versa"; a senior operator reads "one user" as "one PERSON". The
    code identifies a user by the (username, provider) tuple, and provider is null for
    every non-OAUTH2 mode — so "one user" is actually "one username string", not one
    person.
  seed_source: doc-claim + negative-space + cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      AuthIdentityProviderImpl.java:29-33 casts on OAuth2AuthenticationToken to read
      the registrationId; the else-branch hard-codes provider=null for LOGIN_FORM,
      LDAP, and S2S alike. The downstream owner lookup
      (ReactiveUserOwnerMappingRepositoryImpl.java:116-127, getConditions) builds
      `WHERE OIDC_USERNAME='alice' AND DELETED_AT IS NULL AND PROVIDER IS NULL` for
      BOTH the LOGIN_FORM 'alice' and the LDAP 'alice' — the same predicate matches the
      same single USER_OWNER_MAPPING row. The DB partial unique index
      `user_owner_mapping_oidc_username_provider_deleted_key` (V0_0_89:9-15) ENFORCES
      at-most-one active (username=alice, provider=null) row, so the LDAP 'alice'
      cannot even get a distinct mapping — they inherit the LOGIN_FORM 'alice''s
      Owner. IdentityServiceImpl.java:38-39 (.defaultIfEmpty(new OwnerPojo())) masks
      the collision in the whoami response. There is no mode-check, no warning log,
      no fail-fast at the migration step (per the F-011 chain observed_vs_expected
      facet `login_form_ldap_provider_null_cross_mode_bleed` + batch-ZL primary-source
      strengthening). The bleed propagates to all 15 fetchAssociatedOwner consumers.
    evidence:
      - sidecar: odd-platform__java__service__service__AuthIdentityProviderImpl.md
        section: bugs_limitations_corner_cases[0] + implicit_adrs[1] + security.known_security_gaps[0]
        cite: "AuthIdentityProviderImpl.java:29-33"
        note: "Else-branch collapses LOGIN_FORM/LDAP/S2S to provider=null — the resolver IS the fix-site."
      - sidecar: "(F-011 chain hop-3 + batch-ZL notes 1-4)"
        section: provider_null_cross_mode_bleed_sql_primary_source
        cite: "ReactiveUserOwnerMappingRepositoryImpl.java:116-127 + V0_0_89__update_user_owner.sql:9-15"
        note: "SQL IS-NULL predicate + the partial unique index that forces the second user to inherit the first's row."
    operator_visible_failure: |
      (a) Silent cross-mode identity takeover: after a LOGIN_FORM→LDAP migration, the
          LDAP person named 'alice' lands on a fully-populated account that is actually
          the previous LOGIN_FORM person's — their data entities, alerts, role-granted
          permissions, and discussions. No error; the takeover is invisible to both
          parties and to the operator who performed the migration.
      (b) Even WITHOUT migration, a deployment that runs LOGIN_FORM and LDAP
          concurrently with any overlapping username has the same collapse — the second
          person to sign in cannot get their own Owner because the DB index blocks a
          second (alice, null) row.
      (c) The whoami endpoint actively HIDES the problem (defaultIfEmpty(new OwnerPojo))
          so an operator inspecting the API cannot distinguish "correctly resolved" from
          "inherited someone else's Owner".
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      NO test exists. The regression guard for the resolver fix: an integration test
      that stands up LOGIN_FORM + LDAP with overlapping username 'alice' and asserts the
      second-mode user resolves to a DISTINCT OwnerPojo (post-fix) — and a unit test on
      AuthIdentityProviderImpl asserting distinct provider literals per non-OAUTH2 mode.

- id: H-002
  hypothesis: |
    When a server-to-server (S2S) API-key client performs an owner-scoped operation,
    it resolves to a dedicated system identity (or to no Owner at all) — it does NOT
    silently act as some human operator's account.
  derivation: |
    Endpoint-shape (S2S is a distinct auth surface per system-mission.md:263) +
    negative-space — a senior security reviewer expects a machine principal to be
    isolated from human principals; an API key inheriting a person's data scope is a
    boundary failure.
  seed_source: pillar-mission + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      S2sAuthenticationFilter.java:31-34 hard-codes `User.withUsername("ADMIN")` into
      the UsernamePasswordAuthenticationToken; this collapses to provider=null at
      AuthIdentityProviderImpl.java:32. Any S2S call into a service that uses
      fetchAssociatedOwner therefore looks up `WHERE OIDC_USERNAME='ADMIN' AND
      PROVIDER IS NULL`. If an operator has named a LOGIN_FORM or LDAP user 'ADMIN'
      (exact case — the SQL uses eq, not equalsIgnoreCase), the S2S caller resolves to
      THAT human's Owner and inherits their owner-scoped reads and mutations (per
      AuthIdentityProviderImpl.md bugs[1] + security.known_security_gaps[1] + the
      F-011 facet s2s_admin_username_collision_security_boundary). There is no
      system-Owner and no no-owner sentinel for S2S.
    evidence:
      - sidecar: odd-platform__java__service__service__AuthIdentityProviderImpl.md
        section: bugs_limitations_corner_cases[1] + tests_coverage_semantic.uncovered_behaviours[8]
        cite: "S2sAuthenticationFilter.java:31-34 + AuthIdentityProviderImpl.java:29-33"
        note: "Hard-coded 'ADMIN' username, provider=null — collides with operator-named 'ADMIN' user."
    operator_visible_failure: |
      (a) An S2S API key (intended for collector/programmatic access) silently gains a
          specific human user's owner-scoped data access whenever an operator has
          created an Owner/mapping for a user literally named 'ADMIN'. The key holder
          sees and can mutate that user's owned entities.
      (b) The collision is naming-dependent and case-sensitive, so it is intermittent
          across deployments — it works fine until an operator names a user 'ADMIN',
          then silently changes the S2S blast radius with no signal.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      NO test exists. Regression guard: an integration test that seeds a human user
      named 'ADMIN' with an owned entity, issues an S2S (X-API-Key) call, and asserts
      the S2S principal does NOT resolve to that user's Owner (post-fix: a system-Owner
      or no-owner sentinel). This is the test_matrix.security HIGHEST-PRIORITY cell.

- id: H-003
  hypothesis: |
    When an operator authors a complete RBAC configuration (Policies, Roles attached to
    Owners) and runs the platform under auth.type=LOGIN_FORM, those Policies and Roles
    actually GATE what each authenticated user can do.
  derivation: |
    Pillar-mission — P-09's primary user action is "author Policies + Roles; attach
    Roles to Owners" (system-mission.md:252); an operator who builds the RBAC config
    expects it to be enforced under whichever auth mode they enabled.
  seed_source: pillar-mission + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      LoginFormSecurityConfiguration.java:55-57 wires only
      `.authorizeExchange(... pathMatchers(permittedPaths).permitAll()
      .pathMatchers("/**").authenticated())` — it never constructs
      `new AuthorizationCustomizer(permissionService, extractors)` (contrast
      OAuthSecurityConfiguration.java:98 + LDAPSecurityConfiguration.java:145 which DO).
      AuthorizationCustomizer.java:14-32 is what walks SecurityConstants.SECURITY_RULES
      and applies per-Policy/Role/Owner access managers. So under LOGIN_FORM the entire
      SECURITY_RULES table is INERT — and every LOGIN_FORM user is already ADMIN
      unconditionally (LoginFormSecurityConfiguration.java:81 calls
      getAuthorities(true)). The authored Policies/Roles are silently ignored (per the
      F-011 batch-X facets login_form_authorization_customizer_not_wired_security_rules_inert
      + login_form_admin_for_all_hardcoded_no_role_discrimination).
    evidence:
      - sidecar: "(F-011 chain batch-X LoginFormSecurityConfiguration notes 1-3)"
        section: login_form_authorization_customizer_not_wired_security_rules_inert
        cite: "LoginFormSecurityConfiguration.java:55-57, 81 vs OAuthSecurityConfiguration.java:98 + LDAPSecurityConfiguration.java:145"
        note: "AuthorizationCustomizer not wired under LOGIN_FORM; admin-for-all hardcoded."
    operator_visible_failure: |
      (a) An operator who configures LOGIN_FORM and builds a careful least-privilege
          RBAC model via the Management UI gets a platform where every form-authenticated
          user is ADMIN and can call every endpoint — the RBAC config they authored has
          ZERO effect, with no warning that it is inert.
      (b) The admin-for-all behaviour IS documented on the login-form page, but the
          SECURITY_RULES-inert consequence is NOT — an operator reading only "users get
          ADMIN" may still believe per-resource Policies narrow it; they do not.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: happy-path
