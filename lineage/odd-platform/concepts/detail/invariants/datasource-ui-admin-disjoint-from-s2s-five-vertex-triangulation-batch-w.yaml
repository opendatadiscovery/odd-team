name: |-
  DataSource UI-admin path DISJOINT from S2S ingestion path (5-vertex ADR-142/143 triangulation closed at controller tier batch W)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
  - P-09
  - P-10
description: |-
  NEW INVARIANT, batch 2026-05-20W — STRENGTHENS by COUNTERFACTUAL
  the existing ADR-CANDIDATE-142 + ADR-CANDIDATE-143 triangulation
  with the FIFTH and final architectural vertex: the UI admin path
  is DELIBERATELY DISJOINT from the S2S ingestion path. The two paths
  mutate the SAME data_source row but apply DIFFERENT merge semantics,
  authentication, authorization, and tenancy rules.

  THE FIVE-VERTEX TRIANGULATION — now closed:

    Vertex 1 — batch P controller (S2S side): IngestionController.createDataSourceEntity
      lives at /ingestion/datasources. Auth: collector token via Authorization
      header. Mutation semantics: UPSERT-by-ODDRN with partial-merge of
      name + description only. Tenancy: namespace inherited from collector
      (cannot cross namespaces).

    Vertex 2 — batch R repository (shared persistence): ReactiveDataSourceRepositoryImpl
      backs BOTH paths. The same data_source table row is mutated by both
      controllers. listDto count-vs-query divergence (REFACTOR-425) lives
      here.

    Vertex 3 — batch S service (S2S side): DataSourceIngestionServiceImpl.prepareForUpdate
      lines 74-92 — `new DataSourcePojo(a).setName(i.getName()).setDescription(i.getDescription())`
      explicit 2-field narrowing. The S2S mapper DataSourceIngestionMapper
      is distinct from the UI's DataSourceMapper.

    Vertex 4 — batch W controller (UI admin side):
      DataSourceController lives at /api/datasources/*. Auth: 4 UI auth
      modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP) + RBAC permissions
      (DATA_SOURCE_CREATE / UPDATE / DELETE / TOKEN_REGENERATE), OR S2S
      X-API-Key grants ADMIN scope (bypasses RBAC). Mutation semantics:
      full-form REPLACE via MapStruct @MappingTarget over ALL
      DataSourceUpdateFormData fields. Tenancy: operator picks namespace
      freely (CAN cross namespaces).

    Vertex 5 — batch W controller-tier closure:
      DataSourceServiceImpl is the UI-side service, DISTINCT from
      DataSourceIngestionServiceImpl. The two service classes never
      share code paths; the two mappers (DataSourceMapper vs
      DataSourceIngestionMapper) never share field-set narrowing.
      The architectural intent is now visible: collectors are
      CONSTRAINED tenants in the data-source space; operators are
      ADMINS with full mutation power.

  STRENGTHENED batch 2026-05-21ZB — the FIVE DataSourceController
  METHOD-level sidecars (getDataSourceList / registerDataSource /
  updateDataSource / deleteDataSource / regenerateDataSourceToken)
  close vertex 4+5 at METHOD-scoped primary source — the batch-W
  vertex was a CLASS-node finding; this batch deepens it endpoint by
  endpoint and CORRECTS two class-node claims:

    (a) THE FORMDATA FIELD-SET IS NARROWER than the class node said.
        The class node described the create/update FormData
        inferentially as "oddrn, name, description, namespaceName,
        connectionUrl etc." — naming a `connectionUrl` and a
        `pullingInterval`. The method sidecars READ THE SPEC:
        DataSourceFormData has EXACTLY 4 fields (components.yaml:1303-1315),
        DataSourceUpdateFormData EXACTLY 3 (components.yaml:1317-1325).
        There is NO connection_url field on either DTO; the
        connection_url COLUMN was dropped from data_source by V0_0_71.
        The UI-side full-form REPLACE is over 3 fields (name,
        description, namespace_name), NOT an open-ended set.

    (b) THE REPLACE MECHANISM IS NAMED. The class node asserted
        "full-form REPLACE" without the mechanism. The updateDataSource
        method sidecar supplies it: MapperConfig (MapperConfig.java:7-11)
        sets no nullValuePropertyMappingStrategy → MapStruct's default
        SET_TO_NULL governs DataSourceMapper.applyToPojo
        (DataSourceMapper.java:49) — an omitted (null) form field is
        written as null. The asymmetry with the S2S path's 2-field
        narrowing is therefore a consequence of two different mapper
        shapes. The file-local data-loss hazard of this mechanism is
        captured at the dedicated invariant
        datasource-update-replace-not-merge-mapstruct-set-to-null.

  THE OPERATOR-FACING CONSEQUENCE — silent overwrite class
  (STRENGTHENS REFACTOR-423):

    An operator editing a datasource's name in the UI calls
    DataSourceController.updateDataSource → DataSourceServiceImpl.update
    → DataSourceMapper.applyToPojo (writes ALL form fields). The next
    collector startup that includes the same ODDRN calls
    IngestionController.createDataSourceEntity → DataSourceIngestionServiceImpl.prepareForUpdate
    (writes ONLY name + description). The collector OVERWRITES the
    operator's name; the drift is one-way and silent. Neither side
    logs a warning. Neither side emits an Activity Event (audit-log
    gap; cross-link to audit-log-presence-asymmetry).

  THE PERMISSION ESCALATION BY SIDE-EFFECT — confirmed at method
  primary source THIS BATCH:

    DataSourceController.registerDataSource requires DATA_SOURCE_CREATE.
    The service-tier code at DataSourceServiceImpl.java:56-57 calls
    `namespaceService.getOrCreate(form.getNamespaceName())` — CREATES
    a Namespace if absent — WITHOUT the operator needing NAMESPACE_CREATE.
    updateDataSource has the SAME side-door at DataSourceServiceImpl.java:74-75
    under DATA_SOURCE_UPDATE. An operator with ONLY DATA_SOURCE_CREATE
    or DATA_SOURCE_UPDATE can implicitly create namespaces. Both method
    sidecars confirm this at file:line; probe P-039 pins the
    register-path bypass. Captured at the namespace-create-side-doors
    invariant.

  THE NON-TRANSACTIONAL TOKEN-REGENERATE — refined at method primary
  source THIS BATCH:

    DataSourceServiceImpl.regenerateDataSourceToken (lines 99-106) is
    NOT @ReactiveTransactional — UNLIKE the surrounding create
    (line 52), update (line 69), delete (line 86) which ARE annotated.
    The regenerateDataSourceToken method sidecar REFINES the severity:
    the missing annotation does NOT produce a partial-write bug today
    because the only DB write is a SINGLE atomic jOOQ UPDATE and the
    regenerate step is purely in-memory — there is NO old-invalidated-
    but-new-not-persisted window. Severity LOW (code-shape
    inconsistency / latent risk), NOT an active atomicity bug.

  THE 201-VS-200 STATUS DRIFT — confirmed at method primary source:

    DataSourceController returns 200 (ResponseEntity::ok) for
    registerDataSource (POST line 35) and updateDataSource (PUT line 44),
    but openapi.yaml:454 declares 201 for POST and openapi.yaml:482
    declares 201 for PUT. Both method sidecars confirm; probes P-038
    pins the register-side drift. Codebase-wide pattern; captured at
    openapi-status-code-drift-batch-w-extension-to-7-controllers.

  THE UI-ADMIN ENDPOINT HAS NO API-REFERENCE SUB-PAGE — DOC-NNN:

    Per WebFetch 2026-05-20 of /developer-guides/api-reference (200),
    the API reference hub lists 9 per-feature sub-pages but EXPLICITLY
    omits Data Sources. Verbatim from the fetched response: 'Data Sources
    endpoints are not included in this particular documentation page.'
    All 5 method sidecars re-confirm this (inherited at status 200
    within the stale-probe window). Operators wanting to programmatically
    integrate must read the Swagger UI live.

  WHY THIS MATTERS:

    Operators wiring RBAC policies typically reason about permissions per
    surface: 'I gave the team DATA_SOURCE_UPDATE on datasource X — they
    can edit X but cannot touch other datasources.' The 5-vertex picture
    surfaces nuances the policy author MUST know:
      - DATA_SOURCE_UPDATE on the UI path writes ALL 3 fields (full-replace
        — a partial body NULLS the omitted fields).
      - The collector for that datasource STILL overwrites name + description
        on next startup (the collector's mutation isn't gated by RBAC).
      - DATA_SOURCE_CREATE / DATA_SOURCE_UPDATE implicitly grant namespace
        creation.
      - The list endpoint (GET /api/datasources) has NO RBAC gate at all
        (any authenticated user enumerates every datasource — read-collaborative
        posture extension; confirmed at method primary source by the
        getDataSourceList sidecar).
      - Token regeneration is destructive with no grace window — restarting
        collectors is operator's responsibility, no doc anchor for the
        procedure.

  SEVERITY MEDIUM — the architectural disjunction is intentional
  (the asymmetry between collector-as-tenant and operator-as-admin
  is deliberate per ADR-CANDIDATE-142 + 143). The HIGH-severity items
  are the cascading consequences: silent overwrite, permission
  escalation by side-effect, non-transactional token-regenerate,
  doc-side silence on all five vertices.
