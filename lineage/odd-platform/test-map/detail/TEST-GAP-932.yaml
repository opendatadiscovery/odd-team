proposed_action: |-
  Author PermissionControllerAuthMatrixTest as a @SpringBootTest parameterised
  over (auth.type, principal-fixture, resource_id). Asserts the four-mode
  matrix: DISABLED → 200 with empty Flux; LOGIN_FORM (any user) → 200 with the
  full permission set; OAUTH2/LDAP (configured policy) → 200 with the
  policy-derived subset; anonymous → 401/302. Pin the DISABLED-cascade-empty
  AND the LOGIN_FORM-admin-all-static branches as regression anchors — neither
  is documented externally and a future "fix" to either would silently change
  UI behaviour without breaking any existing test.
