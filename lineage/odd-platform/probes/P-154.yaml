expected_outcome: |
  Stress questions surfaced by Category B (name-vs-behaviour) and Category E
  (resource boundaries) on `createEnumValue` /
  EnumValueServiceImpl.upsertInternalEnumValues:

  1. Category B — the endpoint is named `createEnumValue` (POST,
     spec-declared 201) but the operation is BULK REPLACE, not CREATE. When
     the field has only INTERNAL-origin enum values:
     - items with `id == null` → bulkCreate
     - items with `id != null` → bulkUpdate
     - existing rows whose `id` is NOT in the request → softDeleteExcept

     The semantics is "the request body IS the new state"; any items omitted
     from the body are SOFT-DELETED. A caller assuming bulk-CREATE who sends
     a partial body to ADD one value will delete every other existing value.

  2. Category B — when sending the same JSON body twice (same names, all
     `id == null`), the second call:
       a) soft-deletes every row created by the first call (idsToKeep = [])
       b) bulkCreate inserts fresh rows with the same names but new ids
     The visible state LOOKS identical, but a `DATASET_FIELD_VALUES_UPDATED`
     activity event is emitted on EACH call, and the row identities have
     churned. Not strictly idempotent — replay-safe for OBSERVED state but
     not for AUDIT-TRAIL state.

  3. Category E — two concurrent POSTs against the same datasetFieldId
     interleave at READ-COMMITTED isolation. Each transaction:
       T: getEnumState → softDeleteExcept → bulkCreate/bulkUpdate
     The `getEnumState` read in T1 happens before T2's writes commit; T1
     therefore softDeleteExcepts the PRE-T2 state, then commits its
     bulkCreate. T2 commits later, with its OWN softDeleteExcept that wipes
     T1's writes. End state: only the last-committer's rows survive — silent
     last-write-wins; no version-check, no advisory lock.

  This probe verifies (1)+(2) statically and pins (3) under concurrent
  HTTP load.
