mitigations_unimplemented:
- |-
  Doc-side fix (recommended) — update sla-statuses.md to disambiguate:
    BEFORE: 'Each dataset exposes its current aggregate SLA at:
            GET https://{platform_url}/api/datasets/{data_entity_id}/sla.
            The endpoint returns a DataSetSLAReport that includes...'
    AFTER:  'Each dataset exposes its current aggregate SLA at two endpoints:
            GET /api/datasets/{data_entity_id}/sla → image/png — the embeddable
              colour badge for BI dashboards.
            GET /api/datasets/{data_entity_id}/sla_report → application/json
              DataSetSLAReport — the programmatic surface with severity weights
              breakdown and slaRef self-link.'
  File: documentation/docs/features/data-quality/sla-statuses.md (live URL
  https://docs.opendatadiscovery.org/features/data-quality/sla-statuses). Single
  paragraph edit; no code change. Trace to DOC-NNN follow-up.
- |-
  Alternative wire-contract change (NOT recommended) — swap content types:
  /sla returns JSON, /sla_image returns PNG. Breaks every deployed BI integration;
  needs a deprecation cycle (announce in CHANGELOG, ship a 410 Gone after one
  release).
- |-
  Test-side defence — add a Content-Type assertion to the (currently missing)
  WebFluxTest for DataQualityController.getSLA: the response Content-Type MUST be
  image/png. A regression that changes the content-type (e.g. a content-negotiation
  refactor) would be caught.
notes: |-
  The dual-endpoint shape (PNG + JSON) is the CORRECT architectural decision —
  two audiences with two contracts. The drift is purely doc-side; no code change
  is needed. The fix is small (one paragraph in sla-statuses.md) and the failure
  mode is large (BI engineers writing JSON-parsing clients against a PNG response).
  This is a strong DOC-NNN candidate.

  Cross-references:
    - Companion entity: `dataset-sla` (the dual-endpoint shape)
    - Cross-link to data-quality.md pillar landing (mentioned but not the specific
      endpoint disambiguation)
    - First instance in the catalog of a HIGH-severity doc drift where the doc's
      claim about content-type contradicts the spec's content-type declaration —
      a pattern worth scanning for across other dual-endpoint surfaces.
