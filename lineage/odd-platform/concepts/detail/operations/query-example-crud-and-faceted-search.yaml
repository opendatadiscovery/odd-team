name: |-
  Query Example CRUD + Faceted Search (the 13-endpoint surface owned by QueryExampleController)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-02
description: |-
  Operation cluster for the Query Example feature: 4 catalog CRUD endpoints
  (createQueryExamples, updateQueryExample, deleteQueryExample plus the
  getQueryExampleList paginated browse) + 2 read-by-relationship endpoints
  (getQueryExampleByDatasetId, getQueryExampleByTermId) + 1 detail endpoint
  (getQueryExampleDetails) + 5 faceted-search-session endpoints
  (queryExamplesSearch creates session, getQueryExampleSearchFacetList +
  Results + updateFacetList + Suggestions operate on session state).

  All 13 endpoints are 1-or-2-line reactive delegations to either
  QueryExampleService (9 endpoints) or QueryExampleSearchService (4 endpoints).
  No business logic at the controller layer; the OpenAPI-generated
  QueryExampleApi interface dictates signatures.

  KEY SEMANTICS:

    Write semantics:
      createQueryExamples is INTENTIONALLY plural in the OpenAPI operationId
      but creates a SINGLE example per call (body is a single
      QueryExampleFormData, not a list). Naming inconsistency with siblings
      createTerm / createOwner.
      Status-code drift: openapi spec declares 201 for create + update PUTs;
      controller returns 200 via ResponseEntity::ok. Same drift class as
      TermController.

    Delete semantics:
      Hard-delete-of-links + soft-delete-of-entity asymmetry. Three-step
      transaction: hard-delete data_entity_to_query_example link rows +
      hard-delete query_example_to_term link rows + soft-delete the query
      example itself (deleted_at = NOW + is_deleted = TRUE per the
      ReactiveAbstractSoftDeleteCRUDRepository base). Search-vector cleanup
      is NOT performed — query_example_search_entrypoint rows leak on delete.

    Read semantics — read-collaborative posture:
      All 10 non-mutating endpoints (4 reads + 5 search-session endpoints +
      1 list — the 'mutate-facet' search-session endpoint is technically
      a write but on the session, not the data) have NO SecurityRule.
      They fall through to .authenticated() catch-all. Any authenticated
      user can browse every query example across every namespace.

    Search semantics — UUID-only session ownership:
      queryExamplesSearch issues a UUID searchId; subsequent GET/PUT/Results
      calls use the UUID as the sole authority. NO caller-id binding —
      session-hijack on UUID leak is theoretically possible (mitigated by
      128-bit entropy).

  SIDE EFFECTS:

    createQueryExamples: INSERT query_example + INSERT search-entrypoint
    updateQueryExample: UPDATE query_example + UPDATE search-entrypoint
    deleteQueryExample: 3-step transaction (HARD-delete data_entity_to_query_example
      + HARD-delete query_example_to_term + SOFT-delete query_example) +
      LEAVES search-entrypoint row (the leak)
    queryExamplesSearch: INSERT search_facets row (shared facet-session table)

    NO Activity Feed emission — QueryExampleServiceImpl carries no
    @ActivityLog annotations. Mutations do NOT appear in the global Activity
    Feed or per-data-entity Activity tab. Audit-log presence asymmetry
    (per the F-006 master, not a new finding).

  AUTHORIZATION (3 SecurityRules at SecurityConstants.java):
    QUERY_EXAMPLE_CREATE — line 112-113 (NO_CONTEXT resolver)
    QUERY_EXAMPLE_UPDATE — line 312-314 (QUERY_EXAMPLE resolver via
      QueryExamplePermissionExtractor)
    QUERY_EXAMPLE_DELETE — line 315-317 (QUERY_EXAMPLE resolver)

    NOTE — 4 more permissions (QUERY_EXAMPLE_DATASET_CREATE / _DELETE +
    QUERY_EXAMPLE_TERM_CREATE / _DELETE) live on OTHER controllers per the
    cross-controller permission split pattern.
