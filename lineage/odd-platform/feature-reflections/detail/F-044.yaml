      - sidecar: odd-platform__java__housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: dependencies_semantic.requires-feature.[2]
        cite: "DataEntityHousekeepingJob.java:71-80"
        note: "consumes data_entity_delete_days; predicate depends on STATUS_UPDATED_AT being maintained"
      - sidecar: source_read_for_validation
        section: HousekeepingTtlKnownBugsTest (adjacent pin)
        cite: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/housekeeping/HousekeepingTtlKnownBugsTest.java:47-59"
        note: "PLT-083 pin (TTL int-default-zero) — distinct from PLT-027's NULL-key defect but compounds it"
