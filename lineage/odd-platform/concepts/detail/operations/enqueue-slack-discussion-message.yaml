name: Enqueue Slack Discussion Message
canonical_in_docs: true
canonical_candidate: false
description: POST /api/datacollaboration/providers/slack/messages — deserialise MessageRequest
  (data_entity_id, channel_id, text), resolve channel via Slack conversations.info,
  resolve data_entity via dataEntityRepository.get (existence + hollow check), resolve
  current user's associated owner (nullable), persist Message row in PENDING_SEND
  state, return 202 Accepted. Actual Slack chat.postMessage call happens later in
  DataCollaborationMessageSenderJob under a Postgres advisory-lock-elected leader.
  Gated by @ConditionalOnDataCollaboration class-level → 404 when datacollaboration.enabled=false.
axes_present:
- controllers
nodes:
- odd-platform java DataCollaborationController controller-method:postMessageInSlack
contributors:
