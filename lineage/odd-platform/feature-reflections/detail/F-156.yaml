# Term Overview Right-Rail — Tag chips + Owner ownership list — product-owner reflection

## product_owner_narrative

The Term **Overview** tab is the page an operator lands on when they open a glossary term — the in-app Business Glossary's "About"-style home for a single concept (per `system-mission.md` P-06; per WebFetch business-glossary 2026-06-03 which frames the Overview as "the user-friendly functionality found on Wikipedia — an About section"). Down the right rail of that page sit two operator affordances this feature covers: a **Tags** panel of chips and an **Owners** ownership list. Both are read-first surfaces with inline edit affordances — a steward reads the term, and from the same screen can re-tag it or change who owns it without leaving the page (per F-156 chain hops 1a/1b; `OverviewTags.tsx:15-103`, `OverviewGeneral.tsx:22-110`).

A user interacts with the Tags panel by reading the chips and, if they hold `TERM_TAGS_UPDATE`, clicking "Edit tags" / "Add tags" to open the `TagsEditForm` dialog where they type tag names (per `OverviewTags.tsx:32-43, 94-98`). The chips are meant to be a *prioritised* list: the panel sorts "important" tags first, then alphabetically (`tagsCompare`, `OverviewTags.tsx:20-26`), and shows the first 20, hiding the rest behind a "View All (N)" collapse (`visibleLimit = 20`, `OverviewTags.tsx:17, 58-81`). A user interacts with the Owners list by reading the assigned owners with their roles and, if they hold the right `TERM_OWNERSHIP_*` permission, deleting an owner (per-row `ConfirmationDialog`), editing an owner's role (`OwnershipForm`), or adding a new owner at the bottom (per F-156 chain hop 1b; `OverviewGeneral.tsx:22-110`). The three ownership affordances are independently gated by `TERM_OWNERSHIP_CREATE` / `UPDATE` / `DELETE` — fine-grained separation a product owner would call out as a strength (per hop 1b evidence; corroborated by WebFetch business-glossary which names all three with "Assign / Update / Remove" verbs).

The working parts are: an importance-then-alphabetic client-side sort with a 20-chip visible limit and a "View All" reveal; a tag-edit dialog backed by `TermServiceImpl.upsertTags` (a delete-then-recreate that calls `tagService.getOrCreateTagsByName`, per `TermServiceImpl.java:253-264`); and a term-ownership CRUD trio backed by `TermOwnershipServiceImpl`, each affordance permission-gated in the UI. Two of these parts carry the load-bearing concerns this reflection exists to surface: the tag panel's sort is applied to a pre-sliced window, so the prioritisation it visually promises is not the prioritisation it computes; and both the tag-edit dialog and the owner-add affordance feed `getOrCreate`-family backends that mint catalog rows (tags, owners) without consulting the dedicated `*_CREATE` permission.

This feature sits inside the Data Glossary pillar (P-06) but reaches across three others: tag-create touches P-08 Management's Tag directory (the global tag taxonomy, per `system-mission.md` P-08 Tags tab); owner-create touches P-08's Owners tab and P-09's RBAC owner identity; and the read posture inherits P-09's read-collaborative stance (every authenticated user sees every term's tags and owners — there is no per-namespace scoping at the service or repository tier, per `TermServiceImpl.md` security.owner_scoping). The tag-chip surface is a sibling of F-018's Catalog-Overview "Top Tags" tile and of the data-entity Overview tag panel (F-018 / IT-020), but its ordering defect is its own — F-018's is a backend SQL slice-before-aggregate (`listMostPopular`, PLT-026); F-156's is a *client-side* slice-before-sort with no backend involvement.

In a demo, the product owner would highlight the empty states ("Not created." with an inline Add-tags button when a term has no tags, per `OverviewTags.tsx:84-99`), and would warn about the heavy-term edge case: on a term with 50+ tags, the right-rail's 20-chip window is the typical view, so any importance-marked tag that the backend happened to return after the 20th position never appears in the prioritised strip — it is reachable only by clicking "View All", which an operator scanning for "the important tags" would not think to do.

## hypotheses

- id: H-001
  hypothesis: "When a term has more than 20 tags and a tag marked `important` sits past the 20th position in the backend payload's id-order, opening the Term Overview shows that important tag among the visible chips (because the panel promises an importance-first prioritised list)."
  derivation: "The panel sorts by `important` first (`tagsCompare`, OverviewTags.tsx:20-26) and shows `visibleLimit=20` chips — the visual contract is 'the most important tags are shown first'."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The panel slices BEFORE it sorts: `tags.slice(0, visibleLimit).sort(tagsCompare)`
      (OverviewTags.tsx:47-49) takes the FIRST 20 tags by the backend payload's order
      (term tag payload is id/insertion-order, NOT importance-order) and THEN sorts only
      those 20 by importance + alphabet. An `important` tag at payload position 25 is never
      in the sliced window, so it is sorted into the COLLAPSED "View All" path
      (`tags?.slice(visibleLimit).sort(tagsCompare)`, OverviewTags.tsx:62-64) — which has
      the identical slice-then-sort bug. The importance ordering is applied within an
      already-arbitrary 20-element window; it does not select the 20 most-important tags.
    evidence:
      - sidecar: "(feature-flow F-156 chain hop 1a + observed_vs_expected facet tags_slice_then_sort_ordering_bug)"
        section: chain.hop-1a / observed_vs_expected
        cite: "OverviewTags.tsx:47-49"
        note: "slice(0, visibleLimit).sort(tagsCompare) — slice before sort, primary path"
      - sidecar: "(source_read_for_validation — UI sidecar unresolved)"
        section: source
        cite: "OverviewTags.tsx:62-64"
        note: "the collapsed 'View All' path has the identical slice-then-sort bug — sorting the leftovers does not recover the hidden important tag"
    operator_visible_failure: |
      (1) On a heavily-tagged term (50+ tags — the typical case for a mature glossary concept),
      an operator scanning the prioritised chip strip for the important tags sees a strip that
      LOOKS definitive but is actually "20-arbitrary-then-sorted". (2) An important tag is
      silently hidden beneath "View All" — and clicking "View All" does NOT surface it at the
      top of the expanded set either, because the collapsed path re-applies the same
      slice-then-sort, so the important leftover tag is mixed into the alphabetical tail. (3) The
      prioritisation the UI visually promises (important-first) is broken in exactly the
      condition where prioritisation matters most (many tags). The defect is deterministic, not
      flaky — it triggers for every term whose important tag is not among the first 20 returned.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    source_read_for_validation: true

