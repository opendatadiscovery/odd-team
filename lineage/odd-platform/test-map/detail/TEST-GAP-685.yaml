proposed_action: |-
  Add `RbacTransactionalAsymmetryTest.policyUpdate_lostUpdateRace_currentBehaviour_vs_roleUpdate_transactionScoping_pinsRBACAsymmetry` as a Testcontainers integration test. (a) Seed a policy P with name="P" + a role R with name="R". (b) FIRE TWO CONCURRENT `policyService.update(P, body1).subscribe(...)` + `policyService.update(P, body2).subscribe(...)`. Sleep / await both. Read the row. Expect either body1 OR body2 to have won (the test cannot deterministically pick) BUT the lost-update window IS observable; pin it by INJECTING a delay between read and write at the repository mock layer (intercept `policyRepository.get` to delay 50ms, allowing the second update's read to slip in before the first write). (c) Symmetric: FIRE TWO CONCURRENT `roleService.update(R, body1).subscribe(...)` + `roleService.update(R, body2).subscribe(...)`. Verify that the @ReactiveTransactional scopes the second update's read+write into a separate connection-scope — one read-write sequence sees the OTHER's write, not v1. The Role-side test will FAIL if @ReactiveTransactional is dropped from RoleServiceImpl. (d) Add a `// REGRESSION-PIN — RoleServiceImpl.update is @ReactiveTransactional; PolicyServiceImpl.update is NOT. A REFACTOR that adds @ReactiveTransactional to Policy-side (symmetry fix) will break the Policy half of this test; a REFACTOR that drops it from Role-side will break the Role half. The asymmetry is the deliberate inconsistency from batch I implicit_adrs[4] — re-running this test surfaces every change to the pattern.` comment block.
