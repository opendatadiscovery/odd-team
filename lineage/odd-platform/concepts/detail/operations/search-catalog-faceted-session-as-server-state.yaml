name: Search Catalog (faceted, session-as-server-state)
canonical_in_docs: true
canonical_candidate: false
description: |-
  POST /api/search — NO SECURITY_RULES entry, falls through to `pathMatchers('/**').authenticated()`.
  Creates a server-side `search_facets` row keyed by a server-generated UUID; returns
  aggregated facet counts + the UUID + `total` + `myObjectsTotalCount`. Does NOT return
  result rows — caller must issue `GET /api/search/{search_id}/results` for paginated
  `DataEntityList`. Inbound `SearchFormData` → mapped to `FacetStateDto` via `FacetStateDto.removeUnselected`
  → persisted via `ReactiveSearchFacetRepository::create` → aggregation via `Mono.zip(entityClassFacet,
  allCount, myObjectsCount)` running three concurrent queries (the myObjectsCount
  UNCONDITIONALLY). Postgres FTS via `to_tsquery(?)` + `JooqFTSHelper.tsQuery` (split
  on space + append `:*` + join with `&`). Owner-bypass by default (`my_objects=false`
  enumerates whole catalog). PII-persistent query text in `search_facets.query`. Same
  session UUID also used by `getSearchFacetList`, `updateSearchFacets`, `getFiltersForFacet`,
  `highlightDataEntity`.

  ## STRENGTHENED — batch ZL (2026-05-26) — Search.tsx UI ORCHESTRATOR PRIMARY-SOURCE

  Batch ZL adds the Search.tsx page-component sidecar
  (odd-platform__ts__react-component__component__Search.md) —
  the UI ORCHESTRATOR primary source for this backend operation.
  The Search.tsx component is the UI half: it dispatches the
  three thunks (createDataEntitiesSearch /
  getDataEntitiesSearch / updateDataEntitiesSearch) that this
  operation receives, manages the URL session UUID round-trip,
  and surfaces the faceted result list.

  THE UI-LAYER COMPLEMENT:
    Step 1 (POST /api/search): Search.tsx:37-42 on mount
    when routerSearchId is absent.
    Step 2 (PUT /api/search/{searchId}): Search.tsx:50-71 via
    the 1500ms leading-edge debouncer (BROKEN — see the
    broken-debouncer-pattern invariant).
    Step 3 (GET /api/search/{searchId}): Search.tsx:44-48 on
    URL-bound mount.
    Step 4 (GET /api/search/{searchId}/results): Results.tsx:71-74
    via infinite-scroll (Results is the Search.tsx child).

  CROSS-OPERATION RELATIONSHIPS:
    - Pairs with `operation:bootstrap-and-orchestrate-data-entity-search-session`
      (the UI orchestrator role — new in batch ZL).
    - Pairs with `operation:term-search-session-faceted-as-server-state`
      (the term-side clone — both files were authored from the
      same template per Search.tsx implicit_adrs).

  UI-LAYER FINDINGS THAT THIS BACKEND OPERATION INHERITS:
    - tsquery-operator-injection (REFACTOR-229 family) —
      user-typed text reaches to_tsquery() unsanitised
    - get-highlighted-result-formatted-sql-injection — TRUE
      SQL injection at the highlight path
    - broken-debouncer-pattern — every click is a dispatch
      (not coalesced); 5x backend cost amplification
    - search-id-route-param-is-session-uuid — Category F drift
    - tab-click-drops-session-state — Catalog tab orphans the
      current session

  The backend operation is the SERVER-side surface; the UI
  orchestrator (Search.tsx batch ZL) is the OPERATOR-side
  surface. Both anchored now.


