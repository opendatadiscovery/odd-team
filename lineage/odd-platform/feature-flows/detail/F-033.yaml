feature_name: Integration Wizard — classpath-loaded YAML manifests served
  with case-insensitive id lookup + platform_url substitution
discovered_from_entry_point: rest:GET /api/integrations + ui_route:/management/integrations
description: |-
  The Integration Wizard surface — `IntegrationController` exposes exactly
  two endpoints (GET /api/integrations + GET /api/integrations/{integration_id})
  backed by a classpath-loaded `META-INF/wizard/*.yaml` manifest registry
  served from a `TreeMap<String, IntegrationOverviewDto>` constructed once
  at boot via `IntegrationRegistryFactory.createResourceFilesIntegrationRegistry()`.
  The wizard surface is the platform's copy-paste affordance for collector
  setup — each manifest contains `IntegrationPreview {id, name, description,
  installed}` plus an ordered `content_blocks` list of `{title, content,
  code_snippets}` parameterised templates. The single static parameter
  substituted is `platform_url`, sourced from `@Value("${odd.platform-base-url:http://your.odd.platform}")`
  at `StaticArgumentMappingContext.java:16`.

  The wizard is a UI affordance under `Management → Integrations`
  (UI route `/management/integrations`; consumed by `IntegrationPreviewList.tsx:21`
  via React-Query key `['integrationPreviews']`; per-integration view at
  `Integration.tsx:21` via React-Query key `['integration', integrationId]`).
  Per the live doc page WebFetched 2026-05-25 status 200
  (`https://docs.opendatadiscovery.org/integrations/integrations/integration-wizard`):
  "In-app UI under Management → Integrations that generates parameterized
  YAML snippets for plugins, leveraging manifests on the platform's classpath".

  Twelve operator-visible drifts: (1) `installed: false` is hardcoded —
  the OpenAPI contract declares `installed: boolean` REQUIRED but no
  code path detects actual install state; the UI's 'Integrated' badge
  is structurally dead; (2) missing-id returns 204 No Content, not 404
  — the registry's `Mono.justOrEmpty` cascades to empty-Mono which
  Spring WebFlux translates to 204; (3) `odd.platform-base-url`
  default placeholder `http://your.odd.platform` is rendered verbatim
  into copy-pasted snippets in default deployments; (4) case-insensitive
  id collision via the TreeMap comparator `Comparator.comparing(String::toLowerCase)`
  + merge function `(o1, o2) -> o2` — two wizards with ids `Snowflake`
  and `snowflake` silently merge (last-load-wins); (5) boot-time fail-fast
  on any malformed YAML aborts the entire application context with
  `IllegalStateException("Couldn't read wizard manifest")`; (6) NO
  RBAC permission for `/api/integrations*` — both endpoints fall
  through to AuthorizationCustomizer's catch-all `.authenticated()`;
  any role can read the full wizard surface; (7) under `auth.type=DISABLED`
  the wizard registry (including platform_url) is anonymously readable
  via `.anyExchange().permitAll()`; (8) no pagination on
  `getIntegrationPreviews` — full registry returned per call (O(N) body);
  (9) free-form `String integrationId` path parameter — no validation;
  silent enumeration via 200 OR 204 oracle; (10) `ServerWebExchange exchange`
  injected on both methods but never read — pure OpenAPI-codegen
  scaffolding; (11) default checkout of `<odd-platform-repo>` has ZERO
  `META-INF/wizard/*.yaml` resources on classpath — the registry is
  empty by default + the panel renders an empty-content placeholder
  with no error message; (12) the live wizard doc page is silent on
  the auth posture / 204-on-missing-id / dead `installed` field; the
  live API-reference page is silent on response schemas, HTTP status
  codes, and authentication requirements.
