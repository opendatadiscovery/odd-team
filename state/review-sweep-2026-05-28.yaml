# Review-sweep driver — autonomous /review of 88 review-ready DOC items.
#
# Source: state/doc-batch-plan-2026-05-27.yaml (sweep complete; all 35 sub-batches done).
# Sweep branch: feature/docs-pending-sweep-2026-05-27 → already merged to origin/main
#   (verified 2026-05-28: `git rev-list --count origin/main..feature/docs-pending-sweep-2026-05-27` = 0).
# GitBook publishing may lag main; Gate 8 (live-site WebFetch) DEFERS per-item on 404.
#
# Driver protocol (one /loop iteration):
#   1. Read this YAML. Pick FIRST sub-batch with review_status: pending. If none → switch to Phase 2
#      (editorial audit; walk editorial_audit_subtrees in order). If both phases exhausted → exit (no
#      further ScheduleWakeup).
#   2. For the chosen sub-batch:
#      a. For each commit in commits[]: `git show <commit>` in /home/raman/work/odd/documentation
#         to read the diff + parse `Sources:` footer.
#      b. For each item in items[]:
#         - Read /home/raman/work/odd/odd-team/backlog/docs/{id}.md (acceptance criteria, claims).
#         - Verify acceptance criteria one-by-one against the diff (cite file:line).
#         - Run Gates 1-11 per .claude/skills/review/SKILL.md (load pillars/documentation/gates.md).
#         - Gate 8: WebFetch the affected URL on docs.opendatadiscovery.org; if 404 (GitBook lag) →
#           per_item.{id}.gate8: DEFERRED. All other gates still verified.
#         - Append `## Review (2026-05-28, session: doc-review-sweep-{N})` block on item file.
#         - Flip status: all gates PASS → done; any FAIL → blocked; only Gate 8 DEFERRED → review-ready.
#      c. Update this YAML: review_status: done | partial (if any blocked) | deferred (if only Gate 8s).
#         verdict: "X done / Y blocked / Z deferred".
#      d. Commit on odd-team/main:
#         `[doc-review-sweep] {sub-batch} reviewed — {verdict}`
#   3. ScheduleWakeup 60s (cache-warm; in-process local work) with the same prompt to continue.
#
# Phase 2 (editorial audit) — fires after all review_sub_batches.review_status ∈ {done, partial, deferred}.
#   Per iteration: pick first editorial_audit_subtrees with audit_status: pending.
#   Walk `documentation/docs/{subtree}**/*.md` end-to-end per playbooks/doc-product-editorial-read.md.
#   Each finding → new DOC-NNN backlog item via playbooks/follow-up-on-disk.md.
#   Update audit_status: done + audit_findings_logged: [DOC-NNN, ...]. Commit.
#
# Phase 3 (exit) — when both phases exhausted: final state report + STOP (no ScheduleWakeup).
#
# Idempotence: re-running the loop on an already-done sub-batch is a no-op (the picker skips it).
# Mid-iteration crashes: the YAML is committed atomically at end of iteration; a partial run leaves
# review_status: pending and is retried on next wake.

