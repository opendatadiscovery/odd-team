name: Popular-Tile Click Target — Code Navigates to Overview, Docs Say Structure
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: |-
  **NEW CANONICALISATION CANDIDATE, batch 2026-05-19J**. The live docs page
  `https://docs.opendatadiscovery.org/features/data-discovery/catalog-overview`
  (WebFetched 2026-05-19, status 200, see PopularStrip.md docs_link_semantic)
  states: "Clicking a tile opens that entity's **Structure page**". The code at
  `DataEntityList.tsx:38` calls `dataEntityDetailsPath(item.id)` which defaults
  to `path='overview'` per `dataEntitiesRoutes.ts:66-73`. **Result**: a Popular
  tile click lands on the entity's Overview tab, NOT its Structure tab.
  **Consequential for the F-001 loop**: the Overview tab fires
  `fetchDataEntityDetails` → `incrementViewCount`; whether the Structure tab
  also fires the increment is a separate question (the Structure tab is a
  different SPA route — `/dataentities/{id}/structure`). **Two resolution paths**:
  (a) **If the code is correct and docs are wrong**: the doc must be updated to
  say "Overview tab" (consistent with the F-001 inflation-loop closure described
  in feature-flows). (b) **If the docs are correct and code is wrong**: the code
  must change the default path to 'structure' — but that change would BREAK the
  F-001 loop's UI closure (Popular click would no longer trigger view_count
  increment via the Overview-tab read-as-write). Either direction is a real
  change with maintainer-level implications. **Recommended resolution**: docs
  are wrong; code is the source of truth; update the doc page to say "Overview
  tab" (consistent with the implementation). The F-001 loop CLOSURE depends on
  the Overview-tab destination — changing the code to navigate elsewhere would
  break the platform's view_count tracking signal.
contributing_concepts:
