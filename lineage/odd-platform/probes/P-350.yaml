local_execution_blocked: false
realism_caveats: |
  The probe is entirely local (odd-minimal docker-compose + a JShell/javac snippet
  run inside the already-running platform container) per Rule 6 / Rule 8 — no
  remote infrastructure, no managed DB, no cloud CI.

  The verdict is a function of the RESOLVED commons-lang3 version, which is why
  the reflection refused to assert CONTRADICTED from a version inference. The
  conditional is exact: IF the resolved commons-lang3 is >= 3.16 AND the no-arg
  `randomAlphanumeric` path is ThreadLocalRandom-backed, H-013 → CONTRADICTED
  severity HIGH with the one-line fix warranted; otherwise H-013 → CONFIRMED. The
  probe exists to make that severity call evidence-based rather than inferred, and
  to catch the case where a shaded/older commons-lang is on the classpath.

  This probe does NOT attempt to mount a seed-recovery ATTACK on the live token
  stream — that is neither necessary (the delegation-target fact settles the
  finding) nor proportionate. It confirms the GENERATION SOURCE, not an exploit.

  If the snippet's reflective `getImplementationVersion()` returns null (some
  shaded JARs strip the manifest), fall back to the Gradle dependency-tree
  evidence from the arrange step as the authoritative version signal.
