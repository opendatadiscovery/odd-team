proposed_action: |-
  Add `AuthTypeQuartetContractIntegrationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four `@ParameterizedTest`s sharing a fixture, each running a Spring Boot context under one `auth.type` value:

  **Method 1 — `bean_graph_quartet` (parametrised over auth.type)**:
  - For each mode, assert: exactly one `SecurityWebFilterChain` bean is registered; AuthorizationCustomizer bean is present iff mode ∈ {OAUTH2, LDAP}; the corresponding `*SecurityConfiguration` class's beans are registered (e.g., for LOGIN_FORM, assert `mapReactiveUserDetailsService` bean is present).
  - Pins the bean-graph contract for the quartet.

  **Method 2 — `authority_for_authenticated_user_quartet`**:
  - Under LOGIN_FORM: authenticate `alice:alicepw` (custom credentials); assert authorities == `[ADMIN]`.
  - Under OAUTH2: stub OAuth2 provider returning a user with `ODD_USER_ROLE_CLAIM=USER`; assert authorities == `[USER]` (not ADMIN).
  - Under LDAP: stub LDAP provider returning a user with a `memberOf` attribute that maps to USER role; assert authorities == `[USER]`.
  - Under DISABLED: assert no authentication is required AND no `SecurityContext.getAuthentication()` is present (the chain bypasses).

  **Method 3 — `rbac_enforcement_quartet`**:
  - Under LOGIN_FORM + DISABLED: POST `/api/permissions/{id}/policies` without `PERMISSION_*_MANAGE` permission; assert HTTP 200 (wide-open).
  - Under OAUTH2 + LDAP: same request without permission; assert HTTP 403 (RBAC-enforced).

  **Method 4 — `permit_all_paths_quartet`**:
  - For each mode, assert `/actuator/health`, `/favicon.ico`, `/ingestion/entities`, `/ingestion/datasources`, `/api/slack/events` are reachable WITHOUT authentication.

  Add a `// CROSS-MODE-CONTRACT — Pins the auth.type quartet wiring asymmetry: OAUTH2 + LDAP wire AuthorizationCustomizer; LOGIN_FORM + DISABLED do not. A maintainer changing any one mode's wiring without explicit policy decision will trip this test.` comment block.

  Pair with: (a) DOC-GAP-NNN — live `/enable-security/authorization` page must enumerate the quartet contract; (b) ADR-CANDIDATE-029 ratification — the asymmetry must be a documented decision, not an implicit pattern.
