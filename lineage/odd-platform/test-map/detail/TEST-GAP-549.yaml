  - "ReactiveTagRepositoryImpl.md:feature_hint.drift_class_facets.[3] (Audit-log absence on the ingestion-side tag mutation path)"
behaviour: |-
  Repository emits NO audit log on writes — `ingestData`, `bulkCreate` (inherited), `delete` (inherited soft-delete), and every `create*Relations` / `delete*Relations` method writes to a relation or directory table with NO repository-side activity event. The `TAG_ASSIGNMENT_UPDATED` activity event is emitted by the UPSTREAM service layer (`DataEntityServiceImpl.upsertTags` with `@ActivityLog(event = TAG_ASSIGNMENT_UPDATED)`). The ingestion-side path (`ExternalTagIngestionRequestProcessor`) writes via this repository directly and produces NO activity-feed entry. This extends the existing "Audit-log Presence Asymmetry" canonicalisation candidate (system-mission.md §Canonicalisation candidates) to the ingestion-side path.
test_class: missing-security
