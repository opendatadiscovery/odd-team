name: Tag
canonical_in_docs: true
canonical_candidate: false
correction_note: |
  CORRECTED batch VAL-LSN-019 (2026-05-20) — the "listMostPopular is
  globally-scoped" framing in batch N described the QUERY scope (no
  per-tenant filter) correctly but did NOT capture the LSN-019 NAME-vs-
  BEHAVIOR drift. The ordering semantic is corrected this batch: the
  paginate at ReactiveTagRepositoryImpl.java:148 pre-truncates the
  candidate pool by TAG.ID ASC BEFORE the outer count-DESC re-ordering,
  so "globally-scoped" + "popularity-ranked" combine to deliver "the
  OLDEST `size` tags by creation order, re-ordered by count DESC within
  the window". See the
  `lsn-019-listmostpopular-name-vs-behavior-drift-pagination-precedes-ranking`
  invariant captured this batch. Probe P-010 pins the SQL contract in
  CI permanently.
superseded_in_batch: VAL-LSN-019
description: |-
  Global, cross-tenant directory entry for taxonomic labelling of data
  entities. Schema: (id, name UNIQUE WHERE NOT deleted, important boolean,
  deleted_at). Created either via the dedicated POST /api/tags (TAG_CREATE-
  gated, MANAGEMENT scope) OR side-door via the upsertTags flow
  (DATA_ENTITY_TAGS_UPDATE on any single entity is sufficient; spec-
  documented at openapi.yaml:1174).

  **STRENGTHENED BATCH N (2026-05-19N) — SQL-LAYER PRIMARY SOURCE NOW
  PINNED.** ReactiveTagRepositoryImpl
  (`repository/reactive/repository/ReactiveTagRepositoryImpl.java`) is the
  jOOQ/Reactor persistence surface for everything ODD does with Tag rows
  and their three relation tables (TAG_TO_DATA_ENTITY, TAG_TO_DATASET_FIELD,
  TAG_TO_TERM). Extends ReactiveAbstractSoftDeleteCRUDRepository — all
  base CRUD reads through a `tag.deleted_at IS NULL` filter.

  **STRENGTHENED BATCH VAL-LSN-019 (2026-05-20) — CONTROLLER + SERVICE
  TIERS PINNED + LSN-019 DRIFT CORRECTED.** The Tag entity is now
  triple-anchored across the controller (TagController), service
  (TagServiceImpl), and repository (ReactiveTagRepositoryImpl) layers.
  The full call-site graph for the side-door write surface, the
  full Tag lifecycle (create/update/delete/listMostPopular), and the
  LSN-019 ordering drift are all PRIMARY-SOURCE confirmed at three
  tiers simultaneously.

  **NEW LOAD-BEARING FINDINGS BATCH N**:
    (a) **The DUAL-METHOD WRITE DESIGN** — TWO conflict-handling methods
        on the Tag write path with EXPLICITLY DIFFERENT semantics:
          - `ingestData` (lines 199-210) — UPSERT via INSERT ... ON
            CONFLICT (name) WHERE deleted_at IS NULL DO UPDATE SET
            name = EXCLUDED.name RETURNING * — RACE-SAFE; concurrent
            novel-name inserts merge cleanly
          - `bulkCreate` (inherited, lines 113-126) — FAIL-ON-DUPLICATE;
            no ON CONFLICT; collision raises UniqueConstraintException
        TagController.createTag uses bulkCreate (operator-explicit;
        MUST surface the 400 on duplicate). ExternalTagIngestionRequestProcessor
        uses ingestData (ingestion-side; MUST not fail on parallel-
        pipeline conflict). NEW BATCH VAL-LSN-019: TagServiceImpl
        confirms the dual-method design at the service-tier (
        getOrCreateTagsByName at :79-86 wraps bulkCreate, race-prone;
        getOrInjectTagByName at :88-94 wraps ingestData, race-safe).
        The dual shape is intentional per the maintainer-authored code
        + the consistent pattern; the architectural rationale is
        triple-anchored.
    (b) **TOCTOU race vulnerability** — TagServiceImpl.getOrCreateTagsByName
        does `listByNames(tagNames)` then `bulkCreate(tagsToCreate)` for
        the residual. Between the two stages, a CONCURRENT caller can
        insert the same novel name; the first caller's bulkCreate hits
        the `tag_name_unique` partial index and raises
        UniqueConstraintException with NO service-tier retry. The
        ingestData upsert path is SAFE; the bulkCreate path is NOT.
        (NEW HIGH invariant — see batch N
        `tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race`,
        STRENGTHENED batch VAL-LSN-019 with TagServiceImpl as
        service-tier primary source.)
    (c) **Case-sensitive listByNames enables silent duplicate Tag rows**
        — `TAG.NAME.in(names)` is case-sensitive SQL; PII and pii are
        treated as distinct novel names by `divideTagsByExistence`.
        UI tag-dropdown renders both rows. (MEDIUM severity.) NEW
        BATCH VAL-LSN-019: TagServiceImpl confirms the divideTagsByExistence
        check uses `existingTagNames.contains(n)` which is case-sensitive
        — the service-tier is the layer where this could be normalized;
        today the divergence is uncorrected.
    (d) **No name validation at any layer** — no PostgreSQL CHECK
        constraint, no service-layer validation, no OpenAPI pattern
        constraint. An operator with DATA_ENTITY_TAGS_UPDATE can mint
        Tag rows of arbitrary length, whitespace-only names, or
        control-character names. REFACTOR-223 DoS class.
    (e) **listMostPopular is globally-scoped** — no per-data-entity,
        per-owner, per-namespace, per-tenant filter. Combined with the
        side-door write path, a per-data-entity-owner can populate
        every other user's popular-tags surface.
        **CORRECTED BATCH VAL-LSN-019**: the ORDERING is OLDEST-by-id
        within the window then count-DESC within those rows, NOT
        globally-popularity-ranked. See the LSN-019 invariant.
    (f) **Soft-delete + hard-delete asymmetry** — tag rows are
        SOFT-DELETED (deleted_at IS NULL filter); the four relation
        tables are HARD-DELETED. A tag-name reuse after soft-delete
        produces a fresh row with a DIFFERENT id — prior relations are
        gone (hard-deleted in TagServiceImpl.delete BEFORE the
        soft-delete; not reattached on recreate).
    (g) **Three migrations** to land on the current partial unique
        index shape (V0_0_36 → V0_0_57 → V0_0_64). The is_deleted
        boolean was DROPPED in V0_0_64; only deleted_at is the
        soft-delete signal in the post-V0_0_64 era.
    (h) **No repository-tier audit log on writes** — every write path
        is silent. The TAG_ASSIGNMENT_UPDATED activity event is
        emitted by DataEntityServiceImpl.upsertTags @ActivityLog;
        the ingestion-side ExternalTagIngestionRequestProcessor
        write produces NO activity-feed entry. Tier-1c-equivalent
        pattern per the no-audit-log-on-rbac-mutations invariant.

  **NEW LOAD-BEARING FINDINGS BATCH VAL-LSN-019 (2026-05-20)**:
    (i) **LSN-019 NAME-vs-BEHAVIOR DRIFT (HIGH)** — listMostPopular
        is misnamed: the SQL pre-truncates by TAG.ID ASC before the
        count-DESC re-ordering. Operator-visible at the "Top Tags"
        UI surface. See the
        `lsn-019-listmostpopular-name-vs-behavior-drift-pagination-precedes-ranking`
        invariant. Probe P-010 pins this in CI permanently.
    (j) **Service-tier zero-authorisation** — TagServiceImpl carries
        ZERO `@PreAuthorize` and ZERO programmatic permission checks
        across all 168 lines. The controller perimeter is the SOLE
        auth defence. See the
        `getpopulartaglist-open-read-plus-side-door-compose-to-write-read-directory-bypass`
        invariant + the new
        `external-relations-immutable-to-ui-users-cross-method-guard-tagserviceimpl`
        invariant.
    (k) **`!external` guard pattern — three-method consistency** —
        TagServiceImpl.update + .delete + .updateRelationsWithDataEntity
        all defend Collector-set EXTERNAL relations from UI mutation.
        See the new
        `external-relations-immutable-to-ui-users-cross-method-guard-tagserviceimpl`
        invariant.
    (l) **deleteTag cascade incomplete (HIGH — re-confirmed)** — the
        delete path leaves `tag_to_dataset_field` rows orphaned AND
        skips two of three search-vector refreshes. See the
        `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field`
        invariant (strengthened this batch with service-tier
        primary-source) + the new
        `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
        invariant.
    (m) **Multi-step writes without @ReactiveTransactional (HIGH)** —
        TagServiceImpl carries FOUR @ReactiveTransactional methods
        (update, delete, updateRelationsWithDataEntity, createRelationsWithTerm)
        and FIVE that lack it (bulkCreate inherits, listMostPopular is
        read-only, getOrCreateTagsByName + getOrInjectTagByName +
        deleteRelationsWithTerm are multi-step read-then-write WITHOUT
        TX). The TOCTOU surfaces are at these untranscactional methods.
        Confirmed at the service-tier this batch.
