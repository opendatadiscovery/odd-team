mitigations_unimplemented:
  - |-
    Fix Failure 4 at SecurityConstants.java:297-299 — change the permission
    from DATA_ENTITY_ADD_TERM to DATASET_FIELD_ADD_TERM. The live docs
    document the correct gate verbatim; the code change is one line.
  - |-
    Fix Failure 5 (same as the Failure 2 master fix) at SecurityConstants.java:295-296 —
    change the permission from DATASET_FIELD_ADD_TERM to the intended
    ALERT-domain permission. The fix is referenced in the existing
    second-securityconstants-bug-alerts-status-wrong-permission invariant.
  - |-
    Build-time scanner — implement Rules R1 + R2 + R3 (see description above)
    as a Java test in odd-platform-api/src/test that fails the build if
    any SecurityRule violates the canonical-name-prefix rule, the
    path-pattern-vs-OpenAPI-paths consistency rule, or the every-mutation-has-a-rule
    rule.
  - |-
    Default Policy audit — identify which shipped Policies and which
    operator-deployment Policies grant DATA_ENTITY_ADD_TERM or
    DATASET_FIELD_ADD_TERM. Warn operators about the two-way bypass for
    Failure 4 until the fix lands. Same audit shape as the Failure 2
    canonicalisation candidate.
  - |-
    Regression tests — add per-failure regression tests (one per failure)
    that authenticate a user with the WRONG-but-currently-effective
    permission and assert the endpoint succeeds (PIN current behaviour as
    a regression boundary). Add the corresponding fix-pinning tests that
    assert the endpoint FAILS for the wrong-permission holder ONCE the
    fix lands.
  - |-
    Docs warning until fix lands — disclose the wiring failures on the
    live authorization/permissions doc page (a 'Known issues' admonition
    with the affected endpoints + the two-way bypass description for each
    wrong-permission failure).
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20V from the
  DatasetFieldController class-level sidecar's primary-source SecurityConstants
  examination. The count grows 3 → 5; the bug density (5 independent
  failures in a single ~360-line authorization table) is itself a meta-finding
  arguing for build-time integrity checks.

  Cross-cutting connections:
    - Failure 1: authorization-path-mismatch-security-rules-term-vs-openapi-terms-silently-disables-permission-gate (REFACTOR-217)
    - Failure 2: second-securityconstants-bug-alerts-status-wrong-permission (now multi-batch confirmed)
    - Failure 3: securityconstants-term-to-term-no-security-rule-third-wiring-failure (batch U)
    - Failures 4 + 5: THIS INVARIANT (batch V — primary-source citations)
    - Companion invariant: term-service-tier-zero-permission-checks (no
      defence-in-depth at the service layer means the perimeter failures
      have no fallback)

  Three DOC-NNN candidates flow:
    (a) Code fix — change the two wrong-permission entries (one-line each)
    (b) Build-time scanner — Rules R1/R2/R3 as a build-time invariant
    (c) Default-Policy audit — identify and warn about Policies impacted by
        the two-way bypasses

  Pattern-level lesson: a hand-curated single source of truth for
  authorization is unstable at scale. Five independent failures in one
  file argue for tooling, not for review-discipline alone. The cost-benefit
  of the build-time scanner (hours of work, prevents an entire failure
  class permanently) is highly asymmetric.

batch_zg_addendum: |-
  ## STRENGTHENS — batch ZG (2026-05-26)

    The DatasetFieldController class-level v0.4.0 sidecar (batch ZG)
    RE-CONFIRMS Failures 4 and 5 at primary-source CLASS level, adding
    three pieces of evidence:

      (i) Live doc WebFetch
          https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions
          on 2026-05-25 (status 200) re-quotes DATASET_FIELD_ADD_TERM
          verbatim as the documented gate for POST /api/datasetfields/{id}/terms
          ("Allows linking a business glossary term to a specific field
          within a dataset"). The doc/code disagreement persists.

      (ii) Probe P-153 emitted on the DatasetFieldController sidecar
           pins BOTH Failures 4 and 5 as a single probe — verifies that
           a user holding DATA_ENTITY_ADD_TERM but NOT DATASET_FIELD_ADD_TERM
           SUCCEEDS at /api/datasetfields/{id}/terms POST, AND a user
           holding DATASET_FIELD_ADD_TERM but NOT any ALERT permission
           SUCCEEDS at /api/alerts/{id}/status PUT. Two endpoints, one
           probe.

      (iii) The DatasetFieldController class-level sidecar surfaces the
            bugs as a single contiguous block (lines 295-299 in
            SecurityConstants.java) — the positional adjacency makes the
            copy-paste origin visible. A maintainer reading the
            DATASET_FIELD permission block sees BOTH bugs in 5 lines.

    Recommendation status: REFACTOR-NNN candidate to add a compile-time
    consistency check (annotation processor or unit test) that asserts
    every SecurityRule''s permission belongs to the SAME scope family as
    the URL pattern''s resource. The 5-failure count grows with every
    controller-class enrichment; a structural fix is overdue.

