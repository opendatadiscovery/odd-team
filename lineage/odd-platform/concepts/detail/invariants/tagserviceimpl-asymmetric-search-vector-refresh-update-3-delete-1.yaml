mitigations_unimplemented:
  - |-
    SIMPLE FIX — extend the delete path's `.flatMap` chain to invoke
    all three search-vector refreshes:
      `.flatMap(deletedTag -> Mono.zip(
        reactiveSearchEntrypointRepository.updateChangedTagVectors(tagId),
        reactiveSearchEntrypointRepository.updateChangedTagStructureVector(tagId),
        reactiveTermSearchEntrypointRepository.updateChangedTagVectors(tagId))
        .thenReturn(deletedTag))`
    Mirrors the update path's `Mono.zip` shape. One-line semantic change.
  - |-
    Add the missing regression test pinning the update triple-zip:
      Use Mockito to assert that all three updateChangedTag*Vectors
      methods are called when TagServiceImpl.update fires. The test
      pins the maintainer's intent permanently. A future refactor
      that collapses the zip to a single call would fail the test.
  - |-
    Add a parallel regression test asserting the delete path's
    vector-refresh shape — pinning the current (BUGGY) single-vector
    behaviour as the baseline; once the simple fix lands, the test
    is updated to assert the triple-zip on delete too.
  - |-
    OR: invert the test: assert that AFTER a tag delete, the main
    search_entrypoint table has NO ROWS containing the deleted tag's
    name. The test would currently FAIL (the FTS tokens persist);
    once the simple fix lands, the test PASSES.
  - |-
    Consider promoting the search-vector refresh into a
    `TagFTSRefresh` helper class with a single
    `refreshAllVectorsForTag(tagId)` method. The three methods of
    TagServiceImpl would invoke a single helper rather than
    individually composing the zip. Reduces the surface for future
    asymmetry.
  - |-
    Document the search-freshness contract on the
    /features/discovery/search live doc page — explicit text on
    when FTS tokens refresh after tag mutations (today: only on
    entity-level writes; after the fix: immediately on tag-vocabulary
    writes too).

notes: |-
  CAPTURED batch VAL-LSN-019 (2026-05-20). The asymmetric search-vector
  refresh is a LOW-severity code-omission bug visible only by
  cross-referencing the update + delete methods. The same architectural
  fingerprint as the `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field`
  invariant (also a delete-path code-omission).

  Cross-cutting connections:
    - Pairs with `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field`
      (both are delete-path code-omissions visible only at
      cross-method enumeration)
    - Pairs with the `Tag` entity (this is one of the entity's
      lifecycle invariants)
    - The compound observation: the delete method has TWO
      consistent-with-each-other asymmetries — tag_to_dataset_field
      NOT cleaned up AND search-entrypoint vectors NOT refreshed.
      Both are operationally low-cost; together they constitute the
      "tag delete is not as thorough as tag update" pattern.

  Single DOC-NNN candidate:
    /features/data-discovery/tagging — admonition on the
    search-freshness behaviour after tag deletes (deferred update
    until next entity-level write); revised once the simple fix
    lands.
