behaviour: |-
  No-type-validation regression-pin for upsertMetadataFieldValue (MEDIUM — silent type confusion). `formData.getValue()` is a raw String written verbatim into `metadata_field_value.value` (a `text` column) regardless of the field's declared `MetadataTypeEnum` (INTEGER / FLOAT / BOOLEAN / DATETIME / ARRAY / JSON / STRING / UNKNOWN per MetadataTypeEnum.java:3-12). A user can write `"not a number"` to an INTEGER-typed field, or `"true"` to a JSON-typed field. No coercion, no validation, no rejection. Downstream readers must defend against arbitrary string content regardless of the declared type. The OpenAPI ENUM (components.yaml:2077-2086) is published as documentation but never enforced at write time. The doc-product editorial gap: the `MetadataFieldType` enum is published in the OpenAPI spec but no doc page describes what the types mean, whether they are validated at write time (they are NOT), or how mismatched values are rendered. Cross-pillar P-01 (Discovery / data-quality of custom metadata; a metadata column declared INTEGER cannot be trusted as numeric anywhere downstream).
test_class: missing-edge-case
