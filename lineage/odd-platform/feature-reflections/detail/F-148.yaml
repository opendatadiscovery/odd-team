        section: "observed_vs_expected catalog_wide_count_design_my_objects_not_a_boundary"
        cite: "SearchServiceImpl.java:122-155 + ReactiveSearchFacetRepositoryImpl.java:163-534"
        note: "facet counts catalog-wide; only myObjectsTotal owner-scoped"
      - sidecar: "(source read)"
        section: SearchResultsTabs.tsx
        cite: "SearchResultsTabs.tsx:26-62"
        note: "class-tab hints from totals[CLASS].count (catalog-wide); My Objects hint from totals.myObjectsTotal (owner-scoped)"
    operator_visible_failure: |-
      An operator on the My Objects tab sees a short result list (their owned
      entities) but the per-class tab badges show the full-catalog cardinality.
      Clicking from My Objects to Datasets jumps from "3 results" to "4000
      results" with no visual cue that the scope boundary changed — the operator
      may believe their owned-dataset count is 4000. The asymmetry is the same
      one F-017 documents for the sidebar; it is undocumented for the tab
      counts specifically. Severity MEDIUM (misleading count, not data loss).
