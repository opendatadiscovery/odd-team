description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20-Z (getDataEntitiesByDEGOddrn sidecar)** —
  `GET /ingestion/entities/{deg_oddrn}` (IngestionController.java:75-79)
  is unauthenticated in EVERY shipped deployment configuration, including
  the fully-hardened (`auth.type=OAUTH2` + `auth.s2s.enabled=true` +
  `auth.ingestion.filter.enabled=true`) posture. The bypass is structural
  via three composing mechanisms:
    (a) `/ingestion/**` is in `SecurityConstants.WHITELIST_PATHS` line 96 —
        removed from EVERY UI auth chain (LOGIN_FORM / OAUTH2 / LDAP)
        by AuthorizationCustomizer line 22.
    (b) `IngestionDataEntitiesFilter` path matcher is exact-literal
        `/ingestion/entities` + `HttpMethod.POST`
        (IngestionDataEntitiesFilter.java:28) — does NOT match the
        GET method on the templated child path.
    (c) The controller method has NO `@PreAuthorize` annotation
        (IngestionController.java:75-79).

  **The blast radius**: any caller able to reach the platform's HTTP
  port can enumerate the FULL member list of ANY Data Entity Group
  (DEG) by submitting its ODDRN. ODDRNs for DEGs follow a sequential
  numeric id convention (`ODDPlatformDataEntityGroupPath.builder().id(pojo.getId()).build()`
  at DataEntityGroupServiceImpl.java:193-195) — iterating ids 1..N
  with the GET endpoint collects the full DEG-to-members mapping in
  O(N) requests. No rate-limit, no audit-log entry, no per-IP throttle.

  **Composition with REFACTOR-185 AUTH-MODE-ORTHOGONAL facet**: this
  is the FIRST S2S READ endpoint where the unauthenticated-by-design
  posture is documented. Prior batches focused on the S2S WRITE side
  (POST /ingestion/entities — IngestionController.postDataEntityList,
  POST /ingestion/alert/alertmanager, POST /ingestion/datasources). The
  READ side is the structural complement: BOTH SIDES of the S2S API
  are anonymously reachable under default deployment, AND the read
  side has NO opt-in toggle to fail-close (the IngestionDataEntitiesFilter
  is POST-only by design; broadening to GET would require a separate
  IngestionReadFilter class).

  **Combined with read-collaborative-cross-owner-enumeration**: any
  caller (authenticated or not) reads the member list of ANY DEG
  regardless of which owner the DEG belongs to. Extends the
  REFACTOR-024 / REFACTOR-203 cross-owner-read posture to the S2S
  surface; the UI-counterparts (DEG-lineage / search / catalog-walk)
  at least REQUIRE authentication; this one does not.

  **Severity HIGH**: cross-owner enumeration of DEG MEMBERSHIP under
  default deployment, with no auditability and no rate-limit. The
  endpoint is the read-side complement to F-008 (the destructive-write
  surface) — together both sides of the S2S API are anonymously
  reachable.
