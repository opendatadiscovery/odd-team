notes: "CROSS-BATCH cross-cutting invariant captured in batch 2026-05-12F.\nThe pattern\
  \ is: a load-bearing defect that emerges only when two\nindependently-authored sidecars\
  \ are combined. Neither sidecar\nalone reveals it:\n  - HousekeepingTTLProperties\
  \ surfaces 'retention is 30 days'.\n  - updateStatus surfaces 'statusUpdatedAt never\
  \ bumped'.\n  - Combined: the 30-day retention is broken because the field the\n\
  \    query depends on is never updated.\n\nThis is the second cross-batch invariant\
  \ in the catalog (after\n\"Retention claim vs code drift\" which combined ActivityTablePartitionManager\n\
  batch B + HousekeepingTTLProperties batch D). The pattern recurs:\noperational features\
  \ that span configuration + mutation + job sides\ncan have defects that only the\
  \ cross-axis view surfaces.\n\nRecommended cleanup (3-line fix in DataEntityMapperImpl.applyStatus):\n\
  \n  public void applyStatus(DataEntityPojo pojo, DataEntityStatusDto status) {\n\
  \      final boolean changed = status.getId() != pojo.getStatus();\n      pojo.setStatus(status.getId());\n\
  \      if (changed) {\n          pojo.setStatusUpdatedAt(LocalDateTime.now());\n\
  \      }\n  }\n\nPlus a regression test asserting `statusUpdatedAt` is bumped on\
  \ real\ntransitions and unchanged on no-op writes.\n\nTwo DOC-NNN candidates flow\
  \ from this invariant:\n  (a) `/features/data-discovery/statuses` page: warn that\
  \ the 30-day\n      retention window is currently broken (or document the\n    \
  \  workaround until fix lands).\n  (b) `/configuration-and-deployment/odd-platform#housekeeping`\n\
  \      page: same caveat on the `housekeeping.ttl.data_entity_delete_days`\n   \
  \   entry.\n\nSurface as canonicalisation candidate AND a refactoring-scope item\n\
  (small focused 3-line fix with HIGH defence-in-depth value;\ncoordinates with the\
  \ LSN-001 pattern of insecure/broken defaults).\n"
