name: spring.session.timeout=-1 default makes PostgreSQLSessionHousekeepingJob a no-op
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20X — a compound boot-default chains
  through three components and silently disables the platform's only session-expiry
  cleanup mechanism, producing monotonic resource growth on a long-running platform.

  **THE CHAIN**:

    Step 1 — application.yml:2-3 ships `spring.session.timeout: -1`. The value
    `-1` means 'sessions never expire' (the live `/select-session-provider` doc
    page WebFetched 2026-05-20 status 200 confirms this verbatim).

    Step 2 — JooqSessionRepository.java:138-148 computes the EXPIRY_TIME column
    value as `expiry_time = lastAccessedTime.plusSeconds(maxInactiveInterval.
    toSeconds()).getEpochSecond()`. When `maxInactiveInterval` is unset or negative
    (which it IS under `spring.session.timeout: -1`), the expiry is effectively
    never reached — the resulting Long is either at its arithmetic-saturation
    limit or interpreted as 'never' by downstream queries.

    Step 3 — PostgreSQLSessionHousekeepingJob.java:30 issues the housekeeping
    SQL DELETE with predicate `expiry_time < now()`. Under the unexpiring-expiry
    from Step 2, the predicate NEVER matches and the housekeeping is a NO-OP for
    every session row.

  **NET EFFECT**:
    - IN_MEMORY mode: the ConcurrentHashMap grows monotonically until JVM restart;
      a long-running platform with many UI logins / many collector connections
      accumulates session entries on the heap forever.
    - INTERNAL_POSTGRESQL mode: the SPRING_SESSION + SPRING_SESSION_ATTRIBUTES
      tables grow monotonically; the hourly housekeeping job (hardcoded cadence
      at PostgreSQLSessionHousekeepingJobHandler.java:13) runs but deletes zero
      rows.
    - REDIS mode: keys persist with no TTL set; operator-side Redis tooling
      (`maxmemory-policy`) is the only eviction surface.

  **WHY THIS IS A COMPOUND DEFAULT**:
    The platform ships TWO independent defaults that, separately, would each be
    defensible:
      (a) `spring.session.timeout: -1` — for the dev/demo case (no manual logout
          friction, sessions persist across restart-free dev workflows).
      (b) Hourly housekeeping cadence at PostgreSQLSessionHousekeepingJobHandler —
          designed to keep the SPRING_SESSION table bounded.
    Combined, the housekeeping is operator-visible but functionally inert. An
    operator who reads the housekeeping code may reasonably conclude the platform
    is bounding the session-state surface; in fact the platform is NOT.

  **DOC PRESENCE**: the live doc at
  `/configuration-and-deployment/odd-platform#select-session-provider` documents
  BOTH facts independently:
    - 'spring.session.timeout: -1 means sessions never expire.'
    - 'Expired-session cleanup runs hourly and is not configurable.'
  But does NOT make the compound dependency explicit. An operator who switches
  to a finite `spring.session.timeout` (the recommended posture for any
  internet-facing deployment) gets the housekeeping job active; an operator who
  retains the default gets monotonic growth.

  **SEVERITY**: HIGH — operator-invisible monotonic growth on production
  deployments. The IN_MEMORY case is the worst (heap pressure → OOM kill →
  service restart drops every UI login) but the INTERNAL_POSTGRESQL case is the
  sneakier (a 100,000-session SPRING_SESSION table grows quietly until a DBA
  notices the disk pressure).
