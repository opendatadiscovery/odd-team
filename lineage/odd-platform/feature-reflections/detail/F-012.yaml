    verdict: partial
    actual_behavior: |-
      The net effect is correct (the removed entity ends up out of the group), but the MECHANISM differs from
      the per-entity flow in a way that matters. DataEntityGroupForm's entities field is a useFieldArray holding
      the FULL membership set; the X chip on EntityItem calls useFieldArray.remove (DataEntityGroupForm.tsx:101)
      — NO server call fires until Save. On Save, handleSubmitForm dispatches updateDataEntityGroup with the
      COMPLETE entities[] array (DataEntityGroupForm.tsx:85-99) and the PUT /api/dataentitygroups/{id} bulk-REPLACES
      the membership set. So a single-chip removal is implemented as a full-set replace, gated on a DIFFERENT
