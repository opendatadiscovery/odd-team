           # this feature names the operator-observable per-provider MATRIX as a distinct surface.
maintainer_curated: false
proposed_action: |-
  Local-only probe via docker-compose + osixia/openldap is not applicable
  (LDAP probe lives at SHB-110). For OAuth, a local Keycloak realm
  configured as 5 distinct providers (Google-shape, GitHub-shape, Cognito-
  shape, Azure-shape, Custom-OIDC-shape) per provider's ID-token claim
  vocabulary; per-provider integration test asserting which knob fires.
notes: |-
  Genuinely new feature shape — not subsumed by F-011 (the principal-to-owner
  resolution chokepoint), F-034 (feature-flag exposure), or F-008
  (S2S ingestion). The operator-observable claim is "the same `admin-groups`
  key has DIFFERENT semantics across the 5 enum'd providers" — a cross-cutting
  surface that lives at the dispatcher + each handler. F-011 already carries
  several individual facets here (google_admin_groups_silent_no_op,
  oauth_provider_quirks_pattern); this feature is the operator-shape OWNER
  of the matrix as a coherent surface for documentation + integration test
  scope. Cross-link with F-011 in BOTH directions: F-011 owns the
  resolution chokepoint; F-084 owns the per-provider matrix.
