name: S2S 'ADMIN' username literal collision with operator-named users
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-19K** — a latent security
  boundary failure surfaced by primary-source examination of
  `AuthIdentityProviderImpl.java:29-33` cross-referenced against
  `S2sAuthenticationFilter.java:31-39`. The S2S authentication filter
  HARDCODES the username string `"ADMIN"` (uppercase) into the
  `UsernamePasswordAuthenticationToken` it produces for every S2S call:
  `User.withUsername("ADMIN").roles("ADMIN")`. The
  AuthIdentityProviderImpl's `getCurrentUser()` branches on the
  Authentication subtype — `UsernamePasswordAuthenticationToken` falls into
  the else-branch at line 32 which produces `UserDto("ADMIN", null)`. When
  ANY S2S call invokes a service using `fetchAssociatedOwner()`, the
  downstream repository lookup at
  `ReactiveUserOwnerMappingRepositoryImpl.java:116-127` builds
  `WHERE OIDC_USERNAME = 'ADMIN' AND DELETED_AT IS NULL AND PROVIDER IS NULL`.
  If an operator has created a LOGIN_FORM or LDAP user with the EXACT case-sensitive
  username 'ADMIN' (uppercase) AND that user has an active user_owner_mapping
  row (provider=null because LOGIN_FORM and LDAP both produce provider=null
  per the cross-mode bleed invariant), the S2S caller will resolve to THAT
  user's Owner. S2S API key holders thereby INHERIT one specific operator
  user's owner-scoped reads and mutations. The SQL match is case-sensitive
  via jOOQ's `.eq()` (NOT `.equalIgnoreCase()`), so 'admin' / 'Admin' /
  'aDmIn' would NOT collide — only the exact literal 'ADMIN' (uppercase).
  This is mitigation by accident, not by design: a developer choosing the
  literal didn't anticipate the collision. **The docs are silent.** Neither
  the S2S auth doc page nor the user-owner-association doc nor the auth doc
  warns operators against naming users 'ADMIN'. Cross-batch implication: the
  REFACTOR-024 / read-collaborative posture means an authenticated user with
  any reasonable Policy can already read most of the catalog — but the
  inheritance of a specific operator user's MUTATION capability via S2S is a
  privilege escalation pathway that does not exist in the documented threat
  model. Remediation: (a) Use a sentinel username that cannot collide with
  any human user (e.g., `__s2s_principal__` with reserved-prefix validation
  on user creation); (b) Override the AuthIdentityProvider's getCurrentUser
  for S2S-shape authentications to return a distinct UserDto subtype that
  short-circuits fetchAssociatedOwner to empty.
