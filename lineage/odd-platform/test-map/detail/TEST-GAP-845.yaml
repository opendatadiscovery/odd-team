proposed_action: |-
  **Phase 1 — Vitest dep-array smell tests**:

  1. `renderSearch_createSearchEffectDepArrayIncomplete_currentlyMaskedByBatchOrdering_pinsLatentSmell1` — render Search with `routerSearchId=undefined`, `isSearchCreating=false`, `searchId=undefined`. Observe ONE `createSearch` dispatch. Then mock the navigate-vs-redux ordering to be NON-batched (e.g. delay one of the transitions). Observe whether a SECOND `createSearch` dispatch fires. PINS the latent vulnerability.

  2. `renderSearch_facetSyncEffectDepArrayIncomplete_observesRefireDuringInflightPUTWindow_pinsActiveSmell3` — render Search, toggle a facet, observe `updateSearchFacets` dispatch cardinality DURING the in-flight PUT window (between the dispatch start and `.fulfilled` action landing). PINS the active re-fire.

  3. `renderSearch_restoreFromURLEffectDepArrayCorrect_observesSingleDispatch_pinsCounterExampleSmell2` — render Search with URL UUID but no cached session, observe EXACTLY ONE `getDataEntitiesSearch` dispatch. PINS the counter-example (the correctly-written effect).

  **Phase 2 — Playwright probe** (LSN-017 measurement-truth principle):

  4. `clickFacetAndObservePUTDispatchCardinality_currentlyExceedsOnePerClick_pinsLSN017ClassMatch_playwrightProbe` — boot platform, navigate to `/search`, click a facet ONCE, network-intercept PUT requests, assert count. If count > 1, smell #3 is ACTIVE.

  Coherence note (LSN-018 Rule 6): STRENGTHENS retrospectives/LSN-017 by establishing the CLASS distinction (exact-pattern vs class-match). The LSN-017 case is DataEntityDetails-specific (response-derived dep closes the loop); the Search.tsx smells are sibling class-matches (deps and conditions out of sync). The retrospective's measurement-truth principle applies to both: a live probe is the only way to know if the smell is actively re-firing.
