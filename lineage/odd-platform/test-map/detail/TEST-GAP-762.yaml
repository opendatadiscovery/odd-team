behaviour: |-
  **HIGH — `DELETE /api/tags/{tag_id}` cascade is INCOMPLETE: the service hard-deletes `tag_to_data_entity` + `tag_to_term` join rows, soft-deletes the `tag` row, but DOES NOT hard-delete `tag_to_dataset_field` rows. Tags attached to dataset fields via the side-door `DATASET_FIELD_TAGS_UPDATE` path, when deleted via this controller, leave orphaned `tag_to_dataset_field` rows referencing the soft-deleted tag id indefinitely. The orphans are filter-hidden from reads via `addSoftDeleteFilter` on the join, but persist in the DB.** Primary-source confirmed in batch-W TagController sidecar:

  - `TagServiceImpl.delete` (lines 57-70, `@ReactiveTransactional`): the cascade-aware deletion logic.
  - **Line 64**: `reactiveTagRepository.deleteTermRelations(tagId)` — hard-deletes `tag_to_term`.
  - **Line 65**: `reactiveTagRepository.deleteDataEntityRelations(tagId)` — hard-deletes `tag_to_data_entity`.
  - **MISSING line — would be `reactiveTagRepository.deleteDatasetFieldRelations(tagId)`**: this method EXISTS at `ReactiveTagRepositoryImpl.java:299-306` but is NOT called from `TagServiceImpl.delete`. Verified by sidecar's Grep on `deleteDatasetFieldRelations` returning no caller in TagServiceImpl.
  - **Line 66**: the soft-delete of the `tag` row.

  **The orphan growth pattern**:
  - A tag created via the side-door `DATASET_FIELD_TAGS_UPDATE` path (DatasetFieldServiceImpl.java:202, 266) gets a `tag_to_dataset_field` row.
  - When the operator (or a future maintainer running cleanup scripts) deletes the tag via `DELETE /api/tags/{id}`, the `tag_to_data_entity` + `tag_to_term` rows go away — but the `tag_to_dataset_field` row remains, referencing the now-soft-deleted tag id.
  - Reads via `listDatasetFieldDtos` filter these out via `addSoftDeleteFilter` on the join (`ReactiveDatasetFieldRepositoryImpl.java:84-98` per batch-R sidecar) — so the orphans are UI-invisible — but they persist in the DB indefinitely.

  **Operator-visible consequences**:
  - **DB bloat (slow growing)**: every tag ever attached to a dataset field and then deleted leaves an orphan `tag_to_dataset_field` row. For a heavily-tagged catalog, the orphan table can grow to non-trivial size over years.
  - **Migration hazard**: a future maintainer changing the join-filter logic (e.g., removing `addSoftDeleteFilter`) would suddenly SURFACE all the orphan rows in reads — a regression at the read-side that exposes the orphan accumulation.
  - **Schema-migration hazard**: any migration that introduces FK constraints on `tag_to_dataset_field` would fail because the orphan rows reference soft-deleted tags.
  - **Audit confusion**: a forensic investigation querying `SELECT * FROM tag_to_dataset_field WHERE tag_id = X` after a tag has been "deleted via the UI" finds rows — the operator must understand the soft-delete-with-orphan-cascade semantics.

  **Why HIGH not MEDIUM (the sidecar's own rating)**: the sidecar rates this MEDIUM. We elevate to HIGH because:
  - **Cascade asymmetry is invisible to code-review**: a maintainer reading `TagServiceImpl.delete` sees the 2-line cascade (`deleteTermRelations + deleteDataEntityRelations`) and reasonably assumes that's the full cascade — there's no comment explaining that `tag_to_dataset_field` is intentionally NOT cleaned up. The pattern is silently asymmetric.
  - **Cross-side-door reach**: the side-door `DATASET_FIELD_TAGS_UPDATE` mints tag entries (TEST-GAP-763 — the directory side-door), and the cleanup is INCOMPLETE; together these create a unilateral data-accumulation surface (operators can CREATE via side-door, but cannot DELETE cleanly).
  - **No housekeeping job**: the 5-job housekeeping cycle (per batch-K F-010) does NOT include a `TagToDatasetFieldHousekeepingJob`. The orphans grow without bound.

  **Test gap shape**: regression-pin asserting: (a) seed a tag; attach it to BOTH a data_entity AND a dataset_field via the appropriate side-door paths; (b) DELETE the tag via `/api/tags/{id}`; (c) assert `tag_to_data_entity` row is GONE (hard-deleted); (d) assert `tag_to_term` row is GONE; (e) assert `tag_to_dataset_field` row STILL EXISTS (orphan); (f) assert the soft-deleted tag row's `deleted_at IS NOT NULL`. The current state is PINNED — failures land if a future maintainer adds `deleteDatasetFieldRelations(tagId)` to the cascade.
