behaviour: '`@Min(1)` validation absence on `partition-period`. `@Value("${odd.activity.partition-period:30}")`
  accepts 0 / negative / any int. `partition-period=0` produces NO partition (the
  `while (lastPartitionDate.isBefore(bufferDate))` predicate evaluates to false);
  subsequent INSERTs fail with `no partition of relation "activity" found for row`.
  Negative values fail Postgres at CREATE time + ERROR-log + swallow.'
