proposed_action: |-
  Add `NotificationSubscriberTruncateAdvancesLSNRegressionPinTest`. Testcontainers-Postgres setup:

  1. `truncateAlertTable_lsnAdvances_noNotificationFires_pinsSilentLossOnTruncate` —
     - Boot platform with `notifications.enabled=true` and a stub `NotificationSender`.
     - INSERT a pending ALERT row (uncommitted).
     - Capture the slot's `confirmed_flush_lsn` (`pos_before`).
     - Execute `TRUNCATE TABLE alert`.
     - Wait 5 s.
     - Capture `confirmed_flush_lsn` (`pos_after`).
     - Assert `pos_after > pos_before` (the LSN advanced past the truncation).
     - Assert the stub `NotificationSender` was NOT invoked.
     - PINS the silent-loss-on-TRUNCATE.

  2. `truncateAlertTable_followedByInsert_newAlertDelivers_pinsNormalRecovery` —
     - Continue from test 1.
     - INSERT a new ALERT row.
     - Wait 5 s.
     - Assert the stub sender received this NEW alert (the truncation does not break subsequent delivery).
     - PINS that the silent-loss is per-message, not subsystem-breaking.

  3. `truncateAlertTable_warningEmitted_confirmsFixDirection` — (UPDATE once REFACTOR-NNN adds the defensive WARN log)
     - After REFACTOR-NNN: assert a WARN log line was emitted for the TRUNCATE.
     - CONFIRMS the fix's effectiveness.

  Pair with DOC-GAP-NNN (operator warning) and REFACTOR-NNN (defensive WARN log).

  Coherence note (LSN-018 Rule 6): NET-NEW. TEST-GAP-455 covers the LSN-advance contract from the uncaught-throw direction; this gap covers it from the empty-decoded-message direction. Together they pin the full contract. No contradiction.
