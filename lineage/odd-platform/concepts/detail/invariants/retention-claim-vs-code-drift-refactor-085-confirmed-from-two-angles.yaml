notes: |-
  Promoted to a NEW cross-cutting invariant in batch 2026-05-12D after
  the second-angle confirmation. The earlier batch-B narrative cited
  this as a per-feature weakness on the Activity Feed concept; the
  batch-D evidence makes it a doc-product-level invariant about how
  retention claims are documented vs implemented in ODD.

  **STRENGTHENED batch 2026-05-20-R — THIRD ANGLE PINNED AT SQL
  REPOSITORY TIER**. The ReactiveActivityRepositoryImpl batch-R
  sidecar adds the persistence-layer primary source: zero
  `deleteFrom(ACTIVITY)` matches in the repository file; the
  monotonic-growth posture is confirmed end-to-end (partition-WIDTH
  side + housekeeping-coverage side + SQL repository tier). The
  triangulation is now FIVE evidence points across THREE distinct
  code/config axes — sufficient confidence to call REFACTOR-085
  PRIMARY-SOURCE-PINNED rather than INFERRED.

  Three DOC-NNN candidates flow from this invariant:
    (a) Rewrite the activity-feed Configuration section per the
        recommendation above.
    (b) Add a parallel statement on the data-collaboration page for
        the MESSAGE table.
    (c) Add a code-side roadmap entry (or backlog item) for the
        `housekeeping.ttl.activity_days` / `housekeeping.ttl.message_days`
        fields, with the abstract `EmptyPartitionsHousekeepingJob`
        pattern reused.

  **NEW batch R fourth DOC-NNN candidate**: document the per-row vs
  per-partition deletion-path distinction in an internal architecture
  note — implementing `housekeeping.ttl.activity_days` requires
  EITHER (a) a new `delete-from-activity-where-created_at-older-than-X`
  query path in ReactiveActivityRepositoryImpl (which does NOT
  currently exist; the repository is INSERT + SELECT only) OR (b)
  waiting for current-window partitions to age out completely (which
  is what `ActivityEmptyPartitionsHousekeepingJob` does — but the
  operator would need to ALSO configure the partition cadence to
  match the desired TTL such that older partitions naturally become
  empty within the retention window).
