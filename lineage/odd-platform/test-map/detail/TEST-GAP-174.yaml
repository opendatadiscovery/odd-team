proposed_action: Add unit test on `EmailNotificationSender#send` with 3 recipients
  [valid, invalid, valid]; assert recipient[0] receives, recipient[1] throws, recipient[2]
  is silently skipped. Locks the silent-partial-delivery contract. A future per-recipient
  try/catch hardening would deliberately flip the test.
