feature_name: Principal-to-Owner resolution — the per-request chokepoint that
  resolves Spring Authentication → UserDto(username, provider) → OwnerPojo via
  USER_OWNER_MAPPING JOIN
discovered_from_entry_point: per-request-resolution:ReactiveSecurityContextHolder.getContext()
description: |-
  AuthIdentityProviderImpl is THE canonical per-request identity resolver for
  ODD Platform's RBAC + owner-scoping model. The class exposes three
  parameter-less Mono signatures — `getCurrentUser()`, `getCurrentUserProviderRole()`,
  `fetchAssociatedOwner()` — each reading
  `ReactiveSecurityContextHolder.getContext()` to extract the active Spring
  `Authentication`, then either:

  (a) constructing a `UserDto(username, provider)` where `provider` is the
      OAuth2 client registration id ONLY for `OAuth2AuthenticationToken`
      (LOGIN_FORM, LDAP, S2S all produce provider=null),
  (b) reading the first `GrantedAuthority` as a `UserProviderRole` enum
      (ADMIN | USER),
  (c) chaining getCurrentUser() into
      `ReactiveUserOwnerMappingRepository.getAssociatedOwner(username, provider)`
      to resolve a single `OwnerPojo` via the
      `USER_OWNER_MAPPING JOIN OWNER` lookup.

  The service is invoked by 15 distinct callsites — 9 services
  (SearchServiceImpl, AlertServiceImpl, DataEntityServiceImpl,
  DataEntityRelationsServiceImpl, ActivityServiceImpl,
  DataCollaborationServiceImpl, OwnerAssociationRequestServiceImpl,
  IdentityServiceImpl, RoleServiceImpl), TokenGeneratorImpl, and 4
  permission/extractor classes (DataEntityPermissionExtractor,
  TermPermissionExtractor, QueryExamplePermissionExtractor,
  ManagementPermissionExtractor) plus PolicyService. ALL owner-scoped
  business logic flows through these three Monos — the single chokepoint for
  principal-to-owner resolution.

  `fetchAssociatedOwner()` is the POSITIVE side of the defence-in-depth
  anchor-set pattern documented in F-005's drift facet
  `anchor_set_defence_in_depth_partial_application`: every owner-scoped read
  path that calls it feeds the resolved owner-id into a downstream SQL
  `WHERE OWNERSHIP.OWNER_ID = ?` JOIN; paths that DO NOT call it
  (LineageServiceImpl per batch I, ReactiveLineageRepositoryImpl per batch H)
  are the NEGATIVE case and produce unmitigated cross-owner reads.

  The user-observable promise (per live `/configuration-and-deployment/enable-security/authorization/user-owner-association`
  doc, WebFetched 2026-05-19 status 200): "One user can be associated only with
  one owner and vice versa" + "If a user doesn't have an association with any
  owner, it's impossible for them to manage data entities or have an
  owner-based security role." The user-observable reality diverges on multiple
  facets — LOGIN_FORM and LDAP both collapse to provider=null producing
  cross-mode bleed; S2S hardcodes username="ADMIN" which collides with
  operator-named LOGIN_FORM/LDAP users; new OAUTH2/LDAP users have NO Owner
  auto-created on first login (silent empty results until OwnerAssociationRequest);
  empty SecurityContext silently propagates rather than fail-fast; no caching
  layer means N×DB round-trips per page load.
