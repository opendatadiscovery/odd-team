name: Lineage Slice Module-Level Mutable Globals (LoadMore Accumulator)
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
- P-05
description: |-
  **NEW INVARIANT, batch 2026-05-19J**. The `dataEntityLineage.slice.ts` declares
  module-level mutable state OUTSIDE the slice's `reducers` —
  `localUpstreamState` and `localDownstreamState` (lines 30-48). These are mutated
  freely across actions. **The pattern is unusual for Redux Toolkit** (which
  usually keeps all state in Immer drafts inside reducers). **The choice
  optimises for**: cross-fetch accumulation of nodes/edges without storing them
  in normalised Redux state (memory + dedup is cheaper with native Set/Map than
  with Immer-tracked objects). **The cost**: (a) state-leak across rootNodeId
  changes is mitigated by `resetLocalState` (lines 202-203, 281-282), but the
  reset is `IF rootNodeId === dataEntityId` only — for some flows the globals
  carry over; (b) the globals are NOT in any DevTools timeline, NOT in any
  snapshot — debugging means stepping the source. **The pattern says "we trade
  Redux observability for accumulator performance"**. **Implication for testing**:
  unit tests of the slice need to reset the module-level globals between test
  cases — a class of test fragility absent from normal Redux Toolkit usage. A
  test that fails to reset `localDownstreamState` will see contaminated state
  from the previous test, manifesting as flaky tests. **The pattern is a latent
  bug magnet**: a new contributor authoring a sibling slice ("hey, the lineage
  slice does it this way") could replicate the pattern without understanding
  the trade-off; a refactor moving to RTK Query or a reducer-based accumulator
  would need to surface the module-level state.
