description: |-
  ## STRENGTHENED — batch ZI (2026-05-26)

  Batch ZI enriches FIVE MORE route modules (activity / directory /
  search / queryExamples / relationships), pushing the triangulation
  count to 11 — the entire `routes/` directory is now covered, with
  the sole exception of `dataEntitiesRoutes.ts` (the Data Entity
  detail-page family).

  **New batch-ZI sub-conventions and divergences observed**:

  (f) **`directoryRoutes.ts` has a UNIQUE three-export shape** — the
      ONLY route module that pairs the path builder + path-param hook
      with a SEPARATE THREE-WAY-OPTIONAL BUILDER (`directoryDataSourcePath(prefix,
      dsId?, typeId?)`). The builder has two output branches
      corresponding to level-2 and level-4 URLs; level-3 is reached
      via React-Router Navigate-replace (not via this builder). See
      `invariant:directory-level-3-url-via-navigate-redirect-not-builder`.

  (g) **`searchRoutes.ts:14-16` declares a TypeScript interface
      `SearchRouteParams { searchId: string }` AND a hook
      `useSearchRouteParams()` that returns it via type assertion**
      — the SAME shape as terms / integration / directory /
      queryExamples but without the parseInt coercion (the searchId
      IS a UUID string, not a number). See
      `invariant:useparams-type-lie-parseint-nan-coercion` (the
      type-lie applies here too even without parseInt — the cast
      claims `string` for a value that can be `undefined` on the
      `/search` root URL).

  (h) **`activityRoutes.ts` is the SIMPLEST shape** — a single
      `activityPath(query?: string)` builder with no
      `useRouteParams`-style hook (no path parameters; the route
      has no `:param` segments). Three sub-views (`MY_OBJECTS` /
      `DOWNSTREAM` / `UPSTREAM` / `ALL`) are encoded in the
      `?type=...` QUERY STRING, not in URL path segments. This is a
      Major architectural divergence from the alerts pattern (which
      uses `/alerts/all`, `/alerts/my`, `/alerts/dependents` discrete
      sub-paths). See activity sidecar `implicit_adrs[type as query
      not sub-path]`.

  (i) **`queryExamplesRoutes.ts` is the FIRST module to export a
      `URLSearchParams` constant** — a typed string-constants holder
      for query-string keys. The constant name `URLSearchParams`
      shadows the global Web Platform class `URLSearchParams` — see
      queryExamples sidecar `bugs_limitations_corner_cases[3]` (cosmetic
      naming clash). This is a NEW class of artifact in the routes
      directory: not just path-string constants but ALSO query-string-
      key constants.

  (j) **`relationshipsRoutes.ts` is the SMALLEST module — 7 lines
      total** — a single `relationshipsPath()` zero-arg builder
      whose body is a `generatePath` call with no parameter
      substitutions (the `generatePath` import is a no-op). The
      builder relies on the sibling `BASE_PATH` import from
      `./dataModelling` — the second module in the routes directory
      to use the cross-file shared-constant pattern.

  (k) **Inner Routes literal duplication is SYSTEMATIC** — confirmed
      at THREE batch-ZI modules:
        - `directoryRoutes.ts:10-15` (param-name constants) vs
          `Directory/DirectoryRoutes.tsx:11-17` (re-hardcoded
          literals). See directory sidecar
          `bugs_limitations_corner_cases[3]`.
        - `queryExamplesRoutes.ts:30` (path literal `query-examples`)
          vs `DataModellingRoutes.tsx:18, 28` (re-hardcoded).
        - `relationshipsRoutes.ts:5` (path literal `relationships`)
          vs `DataModellingRoutes.tsx:40` (re-hardcoded). See
          relationships sidecar `bugs_limitations_corner_cases[3]`.

  The pattern is uniform: the inner Routes declarations re-hardcode
  the same path segments instead of importing the constants from the
  routes module. A refactor that renames a sub-path in the routes
  module SILENTLY breaks the inner Routes match. This is the
  cross-file rename-fragility class — same shape as the alerts
  LSN-tracked inconsistency.

  ## ORIGINAL — batch ZH (2026-05-26)

  **NEW ENTITY, batch ZH (2026-05-26)** — the SPA's `odd-platform-ui/src/
  routes/` directory hosts a uniform convention for URL-shape modules,
  one file per pillar/feature. Each module is a tiny TypeScript file
  (3-65 lines) that declares the pillar's URL prefix as `BASE_PATH`
  and exports one-or-more `*Path()` builder functions consumers call
  to construct routes. The convention serves THREE purposes:

  **1. Single source of truth for URL strings**. Renaming a pillar's
  URL (e.g. `/data-modelling` -> `/data-modeling`) is a one-file
  change at the BASE_PATH constant. Consumers across the SPA
  (App.tsx route mounts, ToolbarTabs entries, post-create/delete
  redirects, in-page Link targets) all import from `'routes'` and
  call the builder — they never hard-code the URL literal.

  **2. Type-safe sub-route narrowing**. Where a pillar has multiple
  sub-tabs (Data Modelling: Query Examples + Relationships;
  Management: 9 sub-areas; Terms: 5 sub-tabs; Alerts: 3 sub-tabs;
  Owner Associations: 3 sub-tabs), the routes module declares a
  frozen `as const` object literal naming each sub-route slug, plus
  a `<Type>Type` union (e.g. `ManagementRoutesType =
  (typeof ManagementRoutes)[keyof typeof ManagementRoutes]`)
  restricting the path-builder argument to one of the declared
  slugs. Callers writing `managementPath('admin')` (a slug not in
  the literal map) fail at compile time.

  **3. Parameterised URL construction via react-router-dom's
  generatePath**. Where a route has path parameters (`:termId`,
  `:integrationId`, `:queryExampleId`, `:policyId`), the builder
  uses `generatePath()` to substitute the value with URL-safe
  encoding. The convention is uniform: every parameterised route
  module imports `generatePath` from react-router-dom on line 1.

  **The 11 known route modules** at batch ZI (full coverage of the
  routes directory except dataEntitiesRoutes.ts):
    - `alertsRoutes.ts` (P-09 Alerts feature)
    - `activityRoutes.ts` (P-09:F-008 Activity feed — batch ZI)
    - `dataEntitiesRoutes.ts` (P-01 Discovery)
    - `dataModelling/dataModelling.ts` + sibling
      `queryExamplesRoutes.ts` + `relationshipsRoutes.ts` (P-02 —
      query+relationships sub-routes enriched batch ZI)
    - `dataQualityRoutes.ts` (P-04:F-002 DQ Dashboard)
    - `directoryRoutes.ts` (Directory feature — batch ZI)
    - `managementRoutes.ts` (P-08 Management catch-all)
    - `masterDataRoutes.ts` (P-03 Master Data Management)
    - `searchRoutes.ts` (Search feature — batch ZI)
    - `termsRoutes.ts` (P-06 Data Glossary)
    - `index.ts` (barrel re-export so consumers import from
      `'routes'`)

  **Observed sub-conventions and divergences across batch-ZH + ZI
  enrichments**:

  (a) **BASE_PATH placement**: 8 of 9 modules declare `BASE_PATH` as
      a file-private inline `const`. The outliers are
      `dataModelling/dataModelling.ts:3` (EXPORTS `BASE_PATH` so
      sibling files `queryExamplesRoutes.ts:3`, `relationshipsRoutes.ts:2`
      can import it) — a deliberate cross-file pattern where a pillar
      has multiple sub-route files. The `dataQualityRoutes` is a
      SECOND outlier that does NOT use BASE_PATH at all — it
      inlines `/data-quality` directly in the return statement.

  (b) **Function-vs-constant signature**: all 11 builders are
      FUNCTIONS, even when they accept no arguments and return a
      constant string. The choice is API consistency — every call
      site writes `dataQualityPath()` (with parens) — so refactoring
      a route to take parameters is a non-breaking change at the
      call sites.

  (c) **generatePath usage**: parameterised routes uniformly import
      and use `generatePath`. Parameterless routes diverge:
      - `dataModelling.ts:5-7` imports generatePath but calls it on
        a parameterless path (the call is a no-op).
      - `dataQualityRoutes.ts` imports NOTHING from react-router-dom
        (returns plain string literal).
      - `activityRoutes.ts` imports NOTHING; uses template-literal
        concatenation (batch ZI confirmation).
      - `relationshipsRoutes.ts:1` imports `generatePath` but the
        builder body is a no-op call (batch ZI confirmation).
      - The inconsistency is cosmetic, not behavioural.

  (d) **Custom hooks**: some modules expose `use*RouteParams()` hooks
      that wrap `useParams<keyof T>()` with a type assertion to
      strip the Partial<> wrapper React Router natively returns. Now
      FIVE confirmed across batches ZH + ZI: useTermsRouteParams,
      useIntegrationRouteParams, useDirectoryRouteParams,
      useQueryExamplesRouteParams, useSearchRouteParams. See
      `useparams-type-lie-parseint-nan-coercion` invariant for the
      shared runtime drift.

  (e) **Sub-route map duplication**: modules with `<Type>Routes`
      frozen object literals (terms, management) declare the slugs
      as both URL-pattern names AND as TypeScript property names.
      The DOWNSTREAM React component renderers
      (ManagementRoutes.tsx, TermDetailsRoutes.tsx, DataModellingRoutes.tsx)
      RE-HARDCODE the same slugs as string literals — renaming a
      slug in the routes module BREAKS the link generation but
      leaves the renderer matching the OLD literal. The single
      source of truth shape applies to URL CONSTRUCTION only, not
      to URL MATCHING. Batch ZI confirmation at three more sites
      (directoryRoutes / queryExamplesRoutes / relationshipsRoutes).

  **The convention enables a maintainer to**:
    - Find every pillar's URL surface by listing
      `odd-platform-ui/src/routes/*Routes.ts`
    - Refactor a URL with a single-file change (grep + replace
      BASE_PATH; consumers stay structurally unchanged)
    - Discover what sub-features each pillar exposes by reading
      the `as const` object literal in the routes module

  **Limitations / known gaps**:
    - Zero test coverage across the entire `routes/` directory (per
      the existing zero-ui-test-coverage-vitest-installed-no-test-files
      invariant). A typo in BASE_PATH ships silently.
    - Sub-route literal duplication (routes module vs the React
      component renderer) is not type-enforced — a refactor breaks
      half the system at compile time and half at runtime.
    - `WithPermissionsProvider` wrappers at the route mount level
      LOOK like access gates but only seed permission context
      (per the withpermissionsprovider-context-seed-not-route-gate
      invariant).
    - **NEW batch ZI** — magic-string sentinels (`'all'` in
      directory, `'querySearchId'` in queryExamples) are load-bearing
      cross-three-files with no named constants uniting locations
      (see `invariant:directory-all-magic-string-load-bearing-cross-three-files`).

  vocabulary_status: codebase-anchored. The convention IS the
  platform's URL contract; the docs name URL shapes (e.g. the
  Business Glossary page describes the Dictionary tab) but not the
  convention itself. Worth surfacing as a doc-product 'how the SPA
  is structured' page for developer onboarding.
