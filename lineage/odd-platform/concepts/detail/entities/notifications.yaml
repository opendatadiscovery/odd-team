  \ concept — Alert is the data-entity-scoped issue surface, this\nis the operator-facing\
  \ delivery channel for those alerts. Three\nchannels (Slack incoming webhook, generic\
  \ JSON webhook, SMTP email)\neach independently activated by the presence of its\
  \ URL/sender key.\n\nmain-concepts.md names `Slack alert webhook` in Terms & Aliases\
  \ (the\nOUTGOING variant — distinct from `Slack collaboration app` which is\nthe\
  \ bidirectional Discussions integration), but does NOT name\n\"Notifications\" as\
  \ a first-class canonical feature. Live feature page\nexists at `features/active-platform-features/notifications`\
  \ (200); the\nlegacy/alternate path `active-platform-features/notifications` returns\n\
  404 — GitBook IA drift mirrored by DataCollaboration.\n\nCross-cutting connections:\n\
  \  - 202+queue+Postgres-advisory-lock single-sender pattern: now\n    2-sidecar\
  \ triangulated (this + postMessageInSlack); see the\n    cross-cutting invariant.\n\
  \  - Lazy-create-no-drop replication artefacts: 2-sidecar triangulated\n    (this\
  \ + ActivityTablePartitionManager partitions); see the\n    cross-cutting invariant.\n\
  \  - Dead code in load-bearing positions: `webhookUrl` field on this\n    POJO +\
