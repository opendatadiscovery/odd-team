- id: H-003
  hypothesis: "When an operator configures GitHub OAuth with `admin-groups: [admins]` but forgets the `read:org` scope, a user who IS in the `admins` team is still promoted to ADMIN."
  derivation: "Feature-flow facet `github_admin_requires_read_org_scope_silent_failure` + GithubUserHandler sidecar — the org/team gate calls the GitHub REST API which requires `read:org`."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      GitHub admin detection requires two outbound GitHub REST calls — `GET /user/orgs` and
      `GET /user/teams` — to determine org membership and team-based admin (per GithubUserHandler
      sidecar invariants + downstream_side_effects). Both calls require the OAuth2 access token to carry
      the `read:org` scope. Without it, GitHub returns 403 on `/user/orgs`; the handler has no
      `.onErrorResume` / `.retryWhen` (GithubUserHandler:invariants[no-retry]), so the WebClientResponseException
      propagates and the LOGIN FAILS outright — the user does not even authenticate, let alone reach ADMIN.
      So the user is NOT promoted to ADMIN; worse, they cannot log in at all. The hypothesis (silently
      USER-but-logged-in) understates it — the actual outcome is total login failure with no actionable
      message. Note: this is a CONFIGURATION failure mode, not a code bug; the handler behaves correctly
      given a scope-deficient token.
    evidence:
      - sidecar: "odd-platform__java__auth__handler__GithubUserHandler.md"
        section: "dependencies_semantic.requires-config + downstream_side_effects"
        cite: "GithubUserHandler.java:76-91, 104-113"
        note: "Two REST calls with Bearer token; `read:org` required per live docs; no retry/onErrorResume so a 403 fails the login Mono."
      - sidecar: "odd-platform__java__org_opendatadiscovery_oddplatform_auth__config-properties-class__ODDOAuth2Properties.md"
        section: "bugs_limitations_corner_cases[6]"
        cite: "ODDOAuth2Properties.java:37 + GithubUserHandler.java:78-86"
        note: "`scope` is unvalidated at boot; a GitHub client with adminGroups set but missing read:org boots fine and fails at first admin login."
    operator_visible_failure: |
      Two distinct operator-visible modes. (1) If `organization-name` is set, the `/user/orgs` 403 fails
      the WHOLE login — every GitHub user is locked out with a generic OAuth2 error, no log clue pointing at
      the missing scope. (2) If `organization-name` is empty (no org gate) but `admin-groups` is set, the
      `/user/teams` call is reached only inside the org-gated branch, so admin-groups silently has no effect
      and users land as USER. Either way the operator sees "GitHub admin promotion / login isn't working"
      with nothing in the platform telling them `read:org` is the cause. Boot-time scope validation (reject a
      GitHub client with adminGroups/organizationName set but read:org absent from scope) is the fix.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: "When an Azure operator follows the docs but omits `auth.oauth2.client.azure.logout-uri`, the platform boots and works until the user logs out, at which point logout fails."
  derivation: "Feature-flow facet `azure_logout_uri_unvalidated_npe_on_first_logout` + ODDOAuth2Properties sidecar — the @PostConstruct validator checks only clientId + provider; Azure logout calls URI.create(provider.getLogoutUri()) with no null guard."
  seed_source: doc-claim
  validation:
    verdict: confirmed
    actual_behavior: |
      `ODDOAuth2Properties.@PostConstruct validate()` enforces only non-empty `clientId` and `provider`
      (per ODDOAuth2Properties:invariants[1] + implicit_adrs[1]); `logoutUri` is NOT validated.
      `AzureLogoutSuccessHandler.java:39` calls `URI.create(provider.getLogoutUri())` with no null guard,
      whereas `CognitoLogoutSuccessHandler.java:33-35` has the `if (StringUtils.isEmpty(...)) return Mono.empty()`
      guard. `URI.create(null)` throws NullPointerException per the JDK contract, surfacing as a 500 on the
      logout flow. The live docs explicitly state Azure `logout-uri` is mandatory ("An unset `logout-uri`
      raises a NullPointerException and the logout flow returns a 500 response") — so this is a doc-claim the
      code confirms: the requirement is real and unenforced at boot.
    evidence:
      - sidecar: "odd-platform__java__org_opendatadiscovery_oddplatform_auth__config-properties-class__ODDOAuth2Properties.md"
        section: "bugs_limitations_corner_cases[0] + docs_link_semantic.doc_drift_findings[1]"
        cite: "ODDOAuth2Properties.java:16-28 + AzureLogoutSuccessHandler.java:39 + CognitoLogoutSuccessHandler.java:33-35"
        note: "Validator checks only clientId+provider; Azure logout has no null guard, Cognito does; live docs name the NPE."
    operator_visible_failure: |
      The deployment passes boot and serves authenticated sessions normally — the operator believes the
      config is complete. The first time any Azure user clicks logout, they get a 500 and a broken logout
      (session may not be cleared client-side). Because it is deferred to first-logout, it escapes smoke tests
      that only check login. The asymmetry with Cognito (which guards the null) makes it a clear, fixable
      defect: extend the @PostConstruct validator with provider-conditional required-field checks (Azure ⇒
      logoutUri), and/or add the isEmpty guard to AzureLogoutSuccessHandler mirroring Cognito.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: "When an operator picks Okta or Keycloak (both listed as supported on the live docs page) and configures `admin-groups`, an Okta/Keycloak user in that group is promoted to ADMIN like a Cognito or GitHub user would be."
  derivation: "Feature-flow facet `okta_keycloak_documented_but_no_handler_implementation` + the live docs claim 7 providers while Provider.java has 5 (ODDOAuth2Properties sidecar invariants[2] + doc_drift_findings[2])."
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      The `Provider` enum has FIVE values (COGNITO, GITHUB, GOOGLE, ODD_IAM, AZURE) (per ODDOAuth2Properties
      sidecar). Okta and Keycloak have no dedicated `*UserHandler` and no entry in the enum; their `provider`
      string fails every `shouldHandle(...equalsIgnoreCase(Provider.X.name()))` check and the handler chain
      falls through to `CustomOIDCUserHandler` (shouldHandle = NOT in Provider enum), which performs NO
      provider-specific admin detection (no admin-groups, no admin-principals beyond the generic OIDC path).
      So every Okta/Keycloak user is granted USER at login; `admin-groups` binds on the POJO but is never read
      for these providers. ADMIN requires manual Owner-Role binding via the Management UI (LOGIN_FORM-style),
      which is not what the per-provider config promises. The live docs list Okta + Keycloak as supported
      because OIDC discovery works — but admin-detection parity does not exist.
    evidence:
      - sidecar: "odd-platform__java__org_opendatadiscovery_oddplatform_auth__config-properties-class__ODDOAuth2Properties.md"
        section: "concepts.invariants[2] + docs_link_semantic.doc_drift_findings[2]"
        cite: "Provider.java:3-5 (5 values) + CustomOIDCUserHandler.java:28-34 + live docs (7 providers)"
        note: "Free-String provider + 5-value enum + Custom OIDC catch-all = Okta/Keycloak get no admin detection; docs claim 7."
    operator_visible_failure: |
      An operator who chooses Okta/Keycloak from the documented provider list and configures admin-groups
      following the Cognito/GitHub pattern gets a working LOGIN (OIDC discovery succeeds) but ZERO admins —
      no group ever maps to ADMIN, no warning, no log. Their only path to a working admin is to discover,
      undocumented, that they must hand-bind the Administrator role via the Management UI. This is the
      doc-says-supported / code-does-not divergence the feature exists to surface; the fix is either add
      OktaUserHandler + KeycloakUserHandler (PLT-071) or fix the docs to state the admin-detection asymmetry
      (DOC-235).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: "When an operator makes a typo in the provider key (e.g. `provider: provder`), the platform refuses to boot (fail-fast) so the operator immediately learns the provider value is invalid."
  derivation: "Feature-flow facet `oauth2_provider_field_free_string_no_enum_typo_silent_routing` + ODDOAuth2Properties sidecar — `provider` is a free String, not the Provider enum; the validator only checks non-empty."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      `OAuth2Provider.provider` is a free `String` (ODDOAuth2Properties.java:32), NOT the `Provider` enum.
      The @PostConstruct validator only checks non-empty (per ODDOAuth2Properties:invariants[1]). A typo like
      `provder: google` (or `provider: gogle`) binds cleanly — non-empty passes — and at runtime fails every
      `equalsIgnoreCase(Provider.X.name())` dispatch in the handler chain, falling through to CustomOIDCUserHandler
      (generic OIDC). The deployment BOOTS and a generic OIDC login may even WORK against a compliant IdP, but
      all provider-specific behaviour (admin-groups, admin-principals, provider logout) is silently lost. There
      is no fail-fast, no enum constraint, no allowlist check.
    evidence:
      - sidecar: "odd-platform__java__org_opendatadiscovery_oddplatform_auth__config-properties-class__ODDOAuth2Properties.md"
        section: "bugs_limitations_corner_cases[2] + implicit_adrs[2] + concepts.invariants[2]"
        cite: "ODDOAuth2Properties.java:32 + ODDOAuth2Properties.java:16-28 + OAuthSecurityConfiguration.java:168"
        note: "Free String, validator non-empty-only, consumer-side equalsIgnoreCase dispatch — typo routes silently to generic OIDC."
    operator_visible_failure: |
      The most operator-frustrating failure shape: "the platform appears to work, but my admin-detection
      doesn't." Login succeeds (OIDC discovery covers the typo'd provider), so the operator has no signal that
      anything is wrong; only when an expected admin remains USER do they investigate, and the provider typo is
      far from the visible symptom. Fix: make `provider` enum-typed OR add a @PostConstruct allowlist check that
      fails boot on a non-enum, non-CUSTOM_OIDC provider value (PLT-082).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

