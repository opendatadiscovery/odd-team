proposed_action: |-
  Add two parameterised test cases — (a) target DEG was auto-ingested, expect BadUserRequestException; (b) duplicate membership, expect BadUserRequestException with the "already in this DEG" message. Use Mockito to verify the createRelationsReturning call is NEVER made on the rejection paths. STRENGTHENED batch L: extend to FOUR parametrised cases per the controller sidecar — non-existent id, non-DEG entity, ingested DEG, soft-deleted DEG. Pair-test the symmetric delete-side rejection (deleteDataEntityFromDEG line 417 uses the same predicate).
