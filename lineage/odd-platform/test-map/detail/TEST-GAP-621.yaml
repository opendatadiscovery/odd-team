proposed_action: |-
  Three test methods on `IngestionDataSourceFilterIntegrationTest`: (a) seed two Collectors sharing TOKEN.value via direct DB insert; assert the filter resolves to the first-matched collector; pin the silent-cross-collector behaviour; (b) seed a Collector with TOKEN, soft-delete the Collector, POST /ingestion/datasources with the (still-valid) token; assert 401 with AccessDeniedException; (c) POST with `namespace_name` in the payload; assert the resulting DataSourcePojo's namespace_id equals the Collector's namespace_id (NOT the payload's namespace_name).
