proposed_action: |-
  Add `TagDeleteCascadeAsymmetryTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `deleteTag_cascadesToTagToDataEntity_pinsHardDeleteOnSurface1` — POST a tag; attach to a data_entity via DATA_ENTITY_TAGS_UPDATE; DELETE the tag; assert `tag_to_data_entity` row is GONE via raw DB SELECT.
  2. `deleteTag_cascadesToTagToTerm_pinsHardDeleteOnSurface2` — sister test on the term linkage.
  3. `deleteTag_doesNotCascadeToTagToDatasetField_pinsCascadeIncompleteOnSurface3` — POST a tag; attach to a dataset_field via DATASET_FIELD_TAGS_UPDATE; DELETE the tag; assert `tag_to_dataset_field` row STILL EXISTS via raw DB SELECT. PIN the asymmetry.
  4. `deleteTag_softDeletedTagRowReferencedByOrphanedTagToDatasetField_pinsOrphanShape` — same setup; after DELETE, query `SELECT tag.deleted_at, ttdf.tag_id FROM tag JOIN tag_to_dataset_field ttdf ON ttdf.tag_id = tag.id WHERE tag.id = ?`; assert the row exists with `deleted_at IS NOT NULL`. PIN the orphan-attached-to-soft-deleted shape.

  Pair with REFACTOR-NNN: add `reactiveTagRepository.deleteDatasetFieldRelations(tagId)` to `TagServiceImpl.delete`. The fix is a 1-line addition. When the fix lands, tests #3-#4 invert to assert the cascade IS complete.

  Cross-pair with DOC-NNN: surface the cascade-asymmetry on the Tagging doc; explain operator-impact on backups and migrations.
