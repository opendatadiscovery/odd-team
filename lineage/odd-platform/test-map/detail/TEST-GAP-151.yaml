gap_id: TEST-GAP-151
category: missing-edge-case
criticality: HIGH
node_ids:
- odd-platform java OAuthSecurityConfiguration config-key-consumer:auth.type@L71
surfaced_by:
- OAuthSecurityConfiguration@L71.md:bugs_limitations_corner_cases.[3]
- OAuthSecurityConfiguration@L71.md:security.known_security_gaps.[4]
behaviour: 'Azure `logout-uri` unchecked despite docs flagging it required: `ODDOAuth2Properties.validate()`
  (lines 17-28) only checks `clientId` and `provider` for non-empty. An Azure operator
  following docs but omitting `logout-uri` boots successfully and fails at first logout
  (NPE in AzureLogoutSuccessHandler). Fail-fast was applied to `clientId` and `provider`;
  not extended to `logoutUri`.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/config/AzureLogoutUriValidationTest.java
  name: azureProvider_logoutUriUnset_bootSucceedsLogoutThrowsNPE
evidence:
- 'OAuthSecurityConfiguration@L71.md says: ''An operator deploying Azure without logout-uri
  boots successfully and fails at first logout — AzureLogoutSuccessHandler presumably
  dereferences oAuth2Provider.getLogoutUri() without a null-check'''
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[8]
proposed_action: 'Configure `auth.oauth2.client.azure.provider: azure` with `logout-uri`
  UNSET; assert the context boots; assert invoking the logout flow throws an NPE (or
  the equivalent failure mode AzureLogoutSuccessHandler exhibits). Drives the fail-fast
  hardening as a deliberate test update.'
