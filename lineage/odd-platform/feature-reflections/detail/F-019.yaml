# Owner Lifecycle Management — product-owner reflection

## product_owner_narrative

Owner Lifecycle Management is the **operator-facing directory for the catalog's stewardship identities**. A product owner introduces it to a new customer like this: "An *Owner* is the catalog-side identity — a team or a person — that you attach to data entities and terms to say 'this is who stewards this'. The **Management → Owners** tab is where you author that directory: create an Owner, give it a name, attach RBAC roles to it, rename it later, and delete it when the team disbands. Owners are the join point between your authenticated users (who *associate* themselves with an Owner) and your RBAC roles (which *grant permissions* to an Owner)." The audiences are the platform-operator and the data-steward-owner (per `system-mission.md:222-246` P-08 pillar), and the pillar's framing is that Management is the *mutating* surface — "every tab here lets an operator add, edit, or remove a piece of catalog configuration" (`system-mission.md:228`), in contrast to the read-oriented Catalog and Directory.

A user interacts with the feature through one UI surface and three REST verbs. The **UI** is the `OwnersList` React component mounted at `/management/owners` — an infinite-scroll (page size 100), 500ms-debounced-search list of Owner cards, where each card carries Edit and Delete affordances and the page header carries a Create button (per `OwnersList.md` understanding). Every mutating affordance is hidden behind a `WithPermissions` wrapper gated by `OWNER_CREATE` / `OWNER_UPDATE` / `OWNER_DELETE` (per `OwnersList.md` security.authorization_assertions). Underneath, the three verbs are `POST /api/owners` (createOwner), `PUT /api/owners/{owner_id}` (updateOwner), and `DELETE /api/owners/{owner_id}` (deleteOwner), all delegating to `OwnerServiceImpl` (per the F-019 chain hops 1a/1b/1c → hop 2). Create mints an Owner row + N role-binding rows; Update renames the row, *rewrites* the role-binding set by deletion-of-the-complement, and refreshes the FTS search vectors; Delete runs a three-leg cascade-block (term-ownership + ownership + user-owner-mapping), then hard-deletes the role bindings and soft-deletes the Owner row (per `OwnerServiceImpl.md` operations).

The working parts a product owner would demo: **role attachment via a chip/tag picker** (the Edit dialog renders each attached role as a removable TagItem, per `OwnersList.md` invariants[1]); **a confirmation modal on Delete** ("\"{name}\" will be deleted permanently", per `OwnersList.md` invariants[0]); **cascade-delete defence** (you can't delete an Owner that still owns data entities or terms, or whose user mapping is live — the platform raises HTTP 400 USR004, per `deleteOwner.md` concepts); **name re-use after delete** (delete is soft, and a partial unique index `owner_name_unique ... WHERE deleted_at IS NULL` frees the name for a fresh Owner, per `OwnerServiceImpl.md` invariants); and **permission-gated affordances** that vanish from the DOM when the user lacks the verb (per `OwnersList.md` implicit_adrs[0]). The customer's mental model — "this is a normal admin CRUD screen; Delete is the dangerous button; renaming is safe" — is *reasonable and mostly wrong at the load-bearing edges*. The reflection's job is to find where the assembled product inverts the operator's risk model and where the audit/permission story diverges from what an operator running a real, multi-admin, audited deployment expects.

The integration story has three legs (per `system-mission.md` cross-pillar graph + the F-019 `cross_pillar_relationships`). Owner Lifecycle **feeds P-09 Security** — the Owner is the binding target for RBAC roles, and the Owner-side OWNER_TO_ROLE hard-delete is the *positive* case-law contrast to F-006's Policy/Role soft-delete orphan-grant half (`F-019:cross_pillar_relationships` + `OwnerServiceImpl.md` coherence_notes). It **shares data with P-01 Discovery and P-06 Glossary** — every owner-scoped read (getMyObjects, ownership panels) consumes these directory rows. And it is **schema-coupled to P-07's Activity Feed** — the audit trail an operator would expect to record "who renamed Owner X" is the same `activity` table that F-021 owns, whose `data_entity_id NOT NULL` FK plus the `ActivityEventTypeDto` enum scope mean Owner mutations *physically cannot be recorded there* (per `OwnerServiceImpl.md` invariants + the F-006 chain batch-R/U confirmation). This single coupling is the source of the feature's audit-silence finding.

A product owner would flag five edge cases in a demo. (a) **Clearing the role chips and clicking Save wipes all roles, permanently, with no warning** — the form validates only the name field (`OwnersList.md` invariants[1]); the more-destructive operation has *no* confirmation while Delete does. (b) **The audit trail is empty for everything you do here** — create, rename, delete: nothing in the Activity Feed, no log line, no authorship column (per the 6/7-sidecar audit-silence pattern). (c) **Any signed-in user can read the entire Owner directory** including every Owner's name and roles — the GET path has no permission gate at all (`OwnersList.md` security.known_security_gaps[1]). (d) **Owners can be minted without `OWNER_CREATE`** — three service-tier callers (`getOrCreate`) auto-create Owner rows from a typed name, bypassing the gate the `/permissions` doc names (`OwnerServiceImpl.md` upstream_callers). (e) **A deleted Owner is gone from the list but still readable by id**, and its association requests persist as orphans pointing into soft-deleted space (`deleteOwner.md` bugs_limitations_corner_cases). Each of these is the operator's real contract; the live docs are silent on all five.

A senior product owner's closing note on COVERAGE (v0.3.0 promise layer): this is a user-facing Management CRUD feature, yet **zero of its 13 falsifiable hypothesis-promises have a test that asserts the promise**. The two promises the chain HONORS — H-008 (delete revokes role-bindings immediately + frees the name) and H-010 (rename preserves user associations) — are CONFIRMED-BUT-UNTESTED: H-010's safe-rename invariant has no test at all, and only the hard-delete half of H-008 is asserted (`OwnerServiceImplTest.delete_ownerWithNoAttachedResources_clearsRolesThenDeletes`); the name-reuse half is unguarded. PLT-066 is pinned by `OwnerRoleStripKnownBugTest` — but a pin guards the BUG, not the H-002/H-003 promise (it goes RED the instant the bug is fixed). The only verified promises (H-014 list-search via IT-028, H-015 create via add-owner.spec, H-016 owners-render via IT-015) sit OUTSIDE the 13 hypotheses. A feature at 0/13 verified hypothesis-promises is itself the headline finding — every one of the 12 user-facing promises (and the 1 concurrency probe) below is routed to a functional-test demand for the test-coverage-mapper to mint.

## hypotheses

- id: H-001
  hypothesis: |
    When an operator (or a compliance auditor) opens the Activity Feed and asks
    "who created, renamed, or deleted this Owner, and when?", the platform shows
    them the answer — because Management is the platform's mutating surface and
    Owner directory mutations are security-relevant configuration changes an
    audited deployment must be able to reconstruct.
  derivation: |
    Pillar P-08 frames Management as the surface where operators "add, edit, or
    remove a piece of catalog configuration" (system-mission.md:228); a senior
    operator of any access-control-adjacent system treats "who changed the
    stewardship/permission bindings" as a load-bearing audit question
    (negative-space). The OWNER table carries created_at/updated_at columns and
    the platform HAS an Activity Feed (F-021) — the user reasonably assumes
    directory mutations land there.
  seed_source: pillar-mission + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Owner create/update/delete emit NOTHING to any audit surface.
      OwnerServiceImpl carries no @ActivityLog on any of the three lifecycle
      methods (Grep-verified across <odd-platform-api>/service/*.java 2026-05-20:
      10 service files carry the annotation; NONE is OwnerServiceImpl), no
      @Slf4j, and no Logger (the controller-class is equally silent per the
      batch-ZF finding — no @Slf4j, no info/debug/warn/error calls). The UI tier
      provides no "recent changes" panel and renders no created_by/created_at
      column (OwnersList.md understanding, verified end-to-end). The gap is not a
      missing annotation: it is schema-rooted — `activity.data_entity_id` is NOT
      NULL with an FK to data_entity(id) (V0_0_48__add_activity.sql:4,12), so an
      Owner mutation (which has no data-entity context) would FAIL at the SQL
      layer even if @ActivityLog were added; AND enum-rooted —
      ActivityEventTypeDto has no OWNER_CREATED/UPDATED/DELETED values, so the
      annotation would not compile. The positive-half contrast is operator-
      visible: the sibling OwnerAssociationRequest workflow DOES have a typed
      audit table (owner_association_request_activity, 5 typed event values),
      so "who approved Alice's mapping" is auditable while "who renamed Owner X"
      is not. Confirmed across the 6/7-sidecar audit-silence pattern (createOwner
      E + updateOwner P + deleteOwner P + service-tier S + UI Q + route-tier ZH).
    evidence:
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: concepts.invariants[1]
        cite: "OwnerServiceImpl.java:38-122 (Grep @ActivityLog → zero; 10 sibling service files carry it)"
        note: "Service tier — zero audit annotation on create/update/delete; sibling OwnershipServiceImpl IS audited (asymmetry)."
      - sidecar: odd-platform__java__OwnerController__controller-method__deleteOwner.md
        section: security.known_security_gaps[0]
        cite: "OwnerServiceImpl.java:87-100"
        note: "Delete (the most destructive verb) emits no audit; role bindings hard-deleted with no historical record."
      - sidecar: '(F-006 feature-flow detail — schema/enum root cause)'
        section: batch_extensions[batch=R/U]
        cite: "V0_0_48__add_activity.sql:4,12 + ActivityEventTypeDto.java:3-31"
        note: "Double-rooted: NOT NULL data_entity_id FK + no OWNER_* enum values — cannot be closed by an annotation."
    operator_visible_failure: |
      (1) Compliance: an operator under SOX/SOC2/HIPAA/GDPR audit obligations
      cannot answer "who created/renamed/deleted Owner X at time T" from any
      platform surface — the directory's mutation history is unrecoverable.
      (2) Forensics: combined with H-002 (silent role-strip) and H-008 (name
      re-use after soft-delete), an attacker with brief admin access can strip an
      Owner's roles, delete it, and re-create a different Owner with the same
      name, leaving NO trace anywhere except the soft-deleted row's deleted_at
      timestamp (no operator-readable surface) and the owner_to_role row-count
      delta. (3) Trust: the partial-half asymmetry (association requests ARE
      audited) means an operator reasonably assumes ALL Owner-related actions are
      audited, and is wrong precisely for the highest-impact ones.
    severity: HIGH
    confidence: HIGH
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    routes_to_finding: bug-candidate

- id: H-002
  hypothesis: |
    When an operator opens the Edit dialog on an Owner to rename it, and removes
    the role chips (because they only meant to change the name, or to swap one
    role), the platform either preserves the roles they did not explicitly
    intend to remove, or warns them before destroying role bindings — because a
    rename is the operator's mental "safe" operation and role-stripping is
    irreversible.
  derivation: |
    UI-label seed: the Edit dialog renders roles as removable TagItems with an X
    icon (OwnerForm.tsx:95-103) and a Save button; the operator's screen-level
    mental model is "this is the edit form; Save persists my changes." A senior
    PO reasons from the screen: a destructive set-replacement behind an
    unguarded Save inverts the normal risk model. The Delete affordance HAS a
    confirmation modal — so the operator infers Save (edit) is the safer action.
  seed_source: ui-label + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The Edit dialog treats `roles` as REPLACE-WITH-WHAT-IS-SUBMITTED, not
      "leave untouched what I did not change." Removing every TagItem submits
      OwnerFormData with roles: []. The form's Save button is enabled because
      formState.isValid checks ONLY the name field (OwnerForm.tsx:73-86 declares
      `rules={{ required: true, validate: value => !!value.trim() }}` for name;
      the roles useFieldArray at OwnerForm.tsx:40-43 carries NO rules block). On
      submit, OwnerServiceImpl.update calls
      `deleteOwnerRelationsExcept(ownerId, getRoleIdsList(form))` then
      `createRelations(ownerId, ...)`; getRoleIdsList (OwnerServiceImpl.java:117-122)
      collapses both null AND empty to List.of(); the jOOQ-generated
      `notIn(emptyCollection)` folds to a tautology, so the DELETE becomes
      `DELETE FROM OWNER_TO_ROLE WHERE OWNER_ID = ?` — wiping ALL role bindings —
      and the create-half inserts nothing. The bindings are HARD-deleted
      (irreversible; no soft-delete, no audit row per H-001). The UI provides NO
      confirmation modal, NO before/after diff, NO warning banner for the
      role-strip — while the reversible Delete (soft-delete + name re-use) DOES
      have a ConfirmationDialog. The risk model is inverted at the UI layer:
      the irreversible operation is unguarded, the reversible one is guarded.
      Reachable in 3 clicks (Edit → click X on each chip → Save), confirmed at
      UI primary source (ui-review-2026-05-26 slice G).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__OwnersList.md
        section: concepts.invariants[1] + bugs_limitations_corner_cases[5]
        cite: "OwnerForm.tsx:40-43, 73-86, 95-103, 108-117"
        note: "Save enabled with roles:[]; only name is validated; no confirmation on the role-strip."
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: concepts.invariants (getRoleIdsList collapse + shared destructive primitive)
        cite: "OwnerServiceImpl.java:76-81, 117-122 + ReactiveOwnerToRoleRepositoryImpl.java:52-56"
        note: "null+empty → List.of(); notIn(empty) tautology → DELETE all bindings; same primitive delete() uses intentionally at line 97."
      - sidecar: odd-platform__ts__react-component__component__OwnersList.md
        section: implicit_adrs[2]
        cite: "EditableOwnerItem.tsx:55-72 (Delete has ConfirmationDialog) vs OwnerForm.tsx (Save does not)"
        note: "Confirmation asymmetry — guarding the reversible verb, not the irreversible one."
    operator_visible_failure: |
      (1) An operator renaming an Owner via a clear-and-retype-chips flow, or
      simply pruning one role, silently removes ALL role bindings — every
      permission the Owner conferred to its associated users vanishes
      immediately and irreversibly. (2) No confirmation, no diff, no undo, no
      audit (H-001) — the operator has no signal it happened until a downstream
      user reports lost access. (3) Shoulder-surfing / brief-access risk: anyone
      with a logged-in operator session can strip any Owner's roles in 3 clicks
      with zero friction, and leave no trace. (4) The inverted risk model trains
      operators to fear Delete and trust Edit — exactly backwards.
    severity: HIGH
    confidence: HIGH
    use_case_kind: edit-reconcile
    coverage: unverified
    test_ref_pin: "OwnerRoleStripKnownBugTest.putWithoutRolesStripsAllBindings_knownBug_PLT066 (@pins PLT-066 — pins the BUG, RED the instant the promise is honored; NOT a promise guard)"
    test_demand: functional
    routes_to_finding: bug-candidate

- id: H-003
  hypothesis: |
    When an API consumer (a provisioning script, a CI tool, an integration)
    issues `PUT /api/owners/{id}` with body `{"name": "new-name"}` to rename an
    Owner — omitting `roles` to mean "leave the roles unchanged" — the platform
    preserves the existing role bindings, because `roles` is OpenAPI-optional and
    a well-behaved PUT/PATCH treats an omitted optional field as "no change."
  derivation: |
    Endpoint-shape seed: OwnerFormData.roles is declared optional in the OpenAPI
    spec (components.yaml:419-422, no `required` marker). The standard REST
    consumer expectation for an optional field omitted from the body is
    "unchanged" (PATCH-merge semantics) — especially when the endpoint is named
    "update," not "replace."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The backend makes NO distinction between "roles omitted" and "roles: []".
      getRoleIdsList (OwnerServiceImpl.java:117-122) uses
      `CollectionUtils.isEmpty(formData.getRoles())` which is true for BOTH null
      (omitted) and empty list. Both collapse to List.of(), which (per H-002)
      triggers the `DELETE FROM OWNER_TO_ROLE WHERE OWNER_ID = ?` tautology and
      wipes all bindings. So a consumer renaming an Owner by sending only
      `{"name": "..."}` SILENTLY STRIPS ALL ROLES. The UI happens to mask this
      because it always sends the current roles list (read-modify-write), so the
      hazard is invisible in normal UI flows — but any direct API consumer that
      follows the PATCH-merge convention is exposed. This is a PUT-with-destructive-
      omission semantic that the OpenAPI optional marker actively misleads on.
    evidence:
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: concepts.invariants (getRoleIdsList null+empty collapse)
        cite: "OwnerServiceImpl.java:117-122 + components.yaml:419-422"
        note: "Optional `roles` + null/empty collapse = destructive-on-omission; the discriminator between 'don't touch' and 'clear' is lost at the service layer."
      - sidecar: '(F-019 feature-flow detail — observed_vs_expected facet)'
        section: empty_roles_field_silently_destroys_bindings (observed)
        cite: "OwnerServiceImpl.java:71, 76-81"
        note: "Feature-flow confirms: UI masks the hazard; any API consumer omitting roles strips all bindings."
    operator_visible_failure: |
      (1) A provisioning/IaC script that renames Owners in bulk (common in a
      team-rename or merge operation) wipes every renamed Owner's roles in one
      pass, with HTTP 200 success and no error — a silent mass de-permissioning.
      (2) An integration that PATCHes one field unknowingly clears roles, and
      (combined with H-001) leaves no audit trail to diagnose the resulting
      access outage. (3) The OpenAPI `optional` marker is a documentation lie —
      it signals "safe to omit" while omission is destructive; consumers reading
      the spec are actively misled.
    severity: HIGH
    confidence: HIGH
