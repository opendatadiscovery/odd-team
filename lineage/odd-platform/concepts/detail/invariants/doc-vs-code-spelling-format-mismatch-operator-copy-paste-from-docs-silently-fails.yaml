name: Doc-vs-code spelling/format mismatch (operator copy-paste-from-docs silently
  fails)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-12F — now 2-sidecar** — repository-wide
  cross-cutting doc-drift pattern: live docs show a verbatim YAML key or HTTP header
  that does NOT match what the code actually binds/expects. Operator copy-paste-from-docs
  verbatim succeeds against the docs but silently fails against the code. Two-sidecar
  primary-source corroborated: (a) OAuth2 `username-attribute` vs `userNameAttribute`
  (batch D — live `/configuration-and-deployment/enable-security/authentication/oauth2-oidc`
  documents `username-attribute` in the Common-to-All-Providers section; POJO field
  at `ODDOAuth2Properties.java:44` is `private String userNameAttribute;`. Spring
  relaxed binding converts `username-attribute` → `usernameAttribute` (single word,
  NOT split), `user-name-attribute` → `userNameAttribute`. To bind to the POJO field
  operators MUST write `user-name-attribute` in YAML — the docs verbatim is `username-attribute`
  which silently binds to nothing. ODDOAuth2Properties.md:docs_link_semantic.doc_drift_findings.[3]);
  (b) S2S `X-API-Key` vs `Authorization: Bearer` (batch F — live `/configuration-and-deployment/enable-security/authentication/s2s`
  page shows a `curl -X POST https://{platform_host}/ingestion/entities -H "X-API-Key:
  {long_random_token}"` example. The example uses the `X-API-Key` header which is
  consumed by the GLOBAL `S2sAuthenticationFilter` (`auth.s2s.enabled`, single shared
  cluster-wide token grants ADMIN globally). The PATH-SCOPED `IngestionDataEntitiesFilter`
  (`auth.ingestion.filter.enabled`, per-datasource bearer tokens stored in the TOKEN
  table) requires `Authorization: Bearer <token>` instead. Operators reading the docs
  and using `X-API-Key` succeed only if they enabled `auth.s2s.enabled=true`; under
  the OTHER property `auth.ingestion.filter.enabled=true` the same header fails with
  401. postDataEntityList.md:docs_link_semantic.doc_drift_findings.[1]). Both failure
  modes are ''docs are correct, but operator following them lands in a different code
  path than the docs intend.'' **Codebase-wide audit candidate**: WebFetch every live
  config-and-deployment page; cross-reference verbatim YAML keys and curl examples
  with the consumer-code that parses them.'
axes_present:
- controllers
- config_prefixes
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.auth config-properties-class:ODDOAuth2Properties
- odd-platform java IngestionController controller-method:postDataEntityList
