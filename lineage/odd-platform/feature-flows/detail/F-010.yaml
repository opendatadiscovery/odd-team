feature_name: Scheduled housekeeping cycle — TTL purge + empty-partition drop (5
  jobs, every 15 minutes, ShedLock-coordinated)
discovered_from_entry_point: scheduled-job:@Scheduled(fixedRate=15min)+@SchedulerLock(name=housekeepingJob)
description: |-
  HousekeepingJobManager is the Spring `@Component` orchestrator for ODD
  Platform's housekeeping subsystem — a 48-line class that fires every 15
  minutes via `@Scheduled(fixedRate=15, timeUnit=TimeUnit.MINUTES)`, holds a
  14-minute ShedLock named `housekeepingJob`, acquires ONE JDBC `Connection`
  from `PGConnectionFactory` (bypassing HikariCP), and iterates a
  constructor-injected `List<HousekeepingJob>` of FIVE discovered beans,
  invoking each sequentially on the shared connection.

  The five discovered jobs are:
  - AlertHousekeepingJob (TTL — `housekeeping.ttl.resolved_alerts_days`)
  - SearchFacetsHousekeepingJob (TTL — `housekeeping.ttl.search_facets_days`)
  - DataEntityHousekeepingJob (TTL — `housekeeping.ttl.data_entity_delete_days`,
    cascades ~25 tables incl. `fileUploadService.deleteFiles(...).block()` inside
    the jOOQ transaction)
  - ActivityEmptyPartitionsHousekeepingJob (drops EMPTY past partitions of ACTIVITY)
  - MessageEmptyPartitionsHousekeepingJob (drops EMPTY past partitions of MESSAGE,
    excludes MESSAGE_PROVIDER_EVENT)

  The class is gated by `@ConditionalOnProperty("housekeeping.enabled",
  havingValue="true")` with NO `matchIfMissing` — strict opt-in if the key is
  absent from the resolved configuration; `application.yml:166` ships
  `housekeeping.enabled: true` and the integration-test profile
  (`application-integration-test.yml:7-8`) flips it to `false`. The
  inner try/catch at lines 41-47 catches `Exception` per job and logs at ERROR
  before continuing — one failing job does NOT abort the cycle; ONE failed
  Connection acquisition DOES abort all jobs that did not yet run.

  The user-observable promise (per live `/configuration-and-deployment/odd-platform`
  doc, WebFetched 2026-05-19 status 200): "The platform identifies three
  cleanup tasks executed by the housekeeping job ... Defaults to true. The job
  fires every 15 minutes and uses ShedLock for multi-instance coordination."
  The user-observable reality: code defines FIVE jobs (the doc enumerates
  three — the two empty-partition-drop jobs are not surfaced); the ShedLock
  window is exactly 14m / 14m (razor-thin against the 15m schedule); the
  AlertHousekeepingJob carries a known + acknowledged jOOQ operator-precedence
  bug that has no source comment, no test, and no tracking issue; per-job
  failure isolation behaviour is undocumented; the `.block()` inside the
  DataEntityHousekeepingJob transaction is a latent S3-misconfiguration
  failure mode that can stall the entire cycle.
