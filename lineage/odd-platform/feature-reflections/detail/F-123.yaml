- id: H-005
  hypothesis: "When an operator deletes an Ownership (the owner↔data-entity binding) and later needs to know who owned an entity 6 months ago, the historical ownership is recoverable from the platform."
  derivation: "Pillar audit expectation — Management mutations should be reconstructable; an operator asking 'who owned this' is a normal stewardship question."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The `ownership` table is HARD-DELETE — no `deleted_at` column (V0_0_3:10-22), both
      `delete(id)` and `deleteByDataEntityAndOwner` are physical DELETE
      (`ReactiveOwnershipRepositoryImpl.java:85-91, 94-107`). The row itself is gone and
      unrecoverable. PARTIAL because the before/after state IS captured in the `activity`
      table via `OwnershipDeletedActivityHandler` (the @ActivityLog(OWNERSHIP_DELETED) on
      `OwnershipServiceImpl.delete`) — so an auditor CAN reconstruct historical ownership
      *if and only if* the activity feed has not aged the event out. The activity table
      has its own TTL/partition housekeeping (Activity partition manager + empty-partition
      housekeeping), so beyond the retention window the answer is irrecoverable. The
      reconstruction also depends on the @ActivityLog annotation remaining intact — a
      regression dropping it silently removes the only recovery path.
