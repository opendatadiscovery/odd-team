# Data Entity Staleness Indicator — product-owner reflection

## product_owner_narrative

The Data Entity Staleness Indicator is ODD Platform's "this source has gone quiet" signal. It answers the single most consequential question a data-catalog user asks before they trust a row: *is what I'm looking at still being fed?* Whenever an entity has not been re-ingested for longer than a deployment-wide window, an orange clock icon appears next to it — on a search result, in the directory list, on the entity's own detail-page header, in the lineage graph, on a term's linked-entities list, and in the Overview "your entities" strip. The audience is everyone who reads the catalog (per `system-mission.md` P-01 audiences: ui-end-user, data-engineer-analyst, data-quality-engineer, data-scientist, viz-bi-engineer); the problem it solves is the platform's third stated pain point, **data observability** — "irrelevant data appearing in production" (`system-mission.md` Mission statement). The live doc frames it precisely: "a discovery-time freshness prompt; not a runtime alert" (per WebFetch /features/data-discovery).

A user does not interact with this feature so much as read it. There is no form, no toggle, no input the end-user supplies — the only human who configures anything is the platform operator, who sets one key, `odd.data-entity-stale-period` (default 7 days), once in `application.yml` (per `DataEntityStaleDetector.java:10`, `@Value`-bound — it cannot change without a restart). Everyone else simply scans a list and looks for the orange clock. Hovering the icon shows a relative-time tooltip — and here is the first product-owner observation: the tooltip text is literally "Ingested at {relative time}" (per MetadataStale.tsx:17), it never says the word "stale" or "out of date." The user must already know that an orange clock *means* stale; the affordance names the ingestion time, not the condition.

The working parts are unusually simple for a signal this load-bearing. There is exactly one rule, stated in exactly one place — a five-line `@Component` predicate: `lastIngestedAt != null && stalePeriod != null && now().isAfter(lastIngestedAt.plusDays(stalePeriod))` (per DataEntityStaleDetector.java:13-17). The backend imprints the resulting boolean as a REQUIRED `is_stale` field on three OpenAPI DTOs — DataEntityRef, DataEntity, DataEntityDetails (per SHB-001:16, components.yaml:609,918,2010) — by calling the detector at five mapper sites (four in DataEntityMapperImpl at :163,279,492,547 and one in LineageMapper at :143, per SHB-001:14-15). The widget then renders the icon when `is_stale` is true and renders nothing when it is false (per MetadataStale.tsx:20-31). The predicate is O(1) per row with no DB calls (per SHB-001:23), so it materialises cheaply into every list payload no matter how large.

The integration story reaches further than its size suggests. Because `is_stale` rides on the shared DataEntity DTOs, staleness propagates automatically into the Data Lineage pillar (P-05) — a stalled upstream lights up orange inside the lineage graph (per SHB-001:15, LineageMapper:143) — and into the Data Glossary pillar (P-06) via the term linked-entities list. It is also the most natural feed into Alerting (P-07): a stale entity is exactly the kind of condition an operator wants pushed, yet the feature is read-only — there is no stale→alert bridge today, only the discovery-time prompt the doc names. `lastIngestedAt`, the input the whole signal pivots on, is written by the ingestion pipeline (P-10 → P-01 feed), which means the signal is only as trustworthy as the ingestion events that set it.

The edge cases a product owner would flag in a demo are where this feature gets interesting — and where it gets dangerous. Three of them are silent: an entity that has **never** been ingested reports `is_stale: false` and looks identical to a freshly-refreshed one (the `lastIngestedAt != null` guard, per DataEntityStaleDetector.java:14); a deployment whose overlay **omits** the config key disables the entire signal platform-wide with no warning and a UI that looks perfectly healthy (the `stalePeriod != null` guard combined with the widget rendering null, per facets 1+6); and anyone with ingestion-write capability can **forge** freshness by emitting a current timestamp (no provenance check, per SHB-001:26). None of these is visible to the user looking at the screen — which is precisely the failure mode this top-down pass exists to surface, and which the platform already partly tracks as the HIGH-severity issue draft PLT-097.

