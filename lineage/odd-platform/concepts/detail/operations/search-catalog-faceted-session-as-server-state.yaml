name: Search Catalog (faceted, session-as-server-state)
canonical_in_docs: true
canonical_candidate: false
description: POST /api/search — NO SECURITY_RULES entry, falls through to `pathMatchers('/**').authenticated()`.
  Creates a server-side `search_facets` row keyed by a server-generated UUID; returns
  aggregated facet counts + the UUID + `total` + `myObjectsTotalCount`. Does NOT return
  result rows — caller must issue `GET /api/search/{search_id}/results` for paginated
  `DataEntityList`. Inbound `SearchFormData` → mapped to `FacetStateDto` via `FacetStateDto.removeUnselected`
  → persisted via `ReactiveSearchFacetRepository::create` → aggregation via `Mono.zip(entityClassFacet,
  allCount, myObjectsCount)` running three concurrent queries (the myObjectsCount
  UNCONDITIONALLY). Postgres FTS via `to_tsquery(?)` + `JooqFTSHelper.tsQuery` (split
  on space + append `:*` + join with `&`). Owner-bypass by default (`my_objects=false`
  enumerates whole catalog). PII-persistent query text in `search_facets.query`. Same
  session UUID also used by `getSearchFacetList`, `updateSearchFacets`, `getFiltersForFacet`,
  `highlightDataEntity`.
