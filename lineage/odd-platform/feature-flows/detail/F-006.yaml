feature_name: RBAC policy lifecycle — soft-delete with permission-grant persistence
discovered_from_entry_point: rest:POST /api/policies
description: 'Operators manage RBAC policies via the /api/policies CRUD endpoints

  (POST/GET/PUT/DELETE). Each policy is a named JSON authorization rule (resource +

  permissions + conditions); the moment a policy is BOUND to a role via the role-policy

  edge, it becomes operative authorization on every authorized request — resolved

  on the hot path by `getRolesPolicies(roleIds)` which JOINs policy ↔ role_to_policy.


  The lifecycle has TWO load-bearing pieces of state: the soft-delete column

  `policy.deleted_at` (UPDATE-not-DELETE on `DELETE /api/policies/{id}`) AND the

  role-binding edges in `role_to_policy`. The maintainer-documented intent (live

  /authorization/policies page — verified 2026-05-12 status 200 via batch-E sibling

  sidecar) is that a soft-deleted policy''s name can be re-used (the partial unique

  index `policy_name_unique ON policy(name) WHERE deleted_at IS NULL` enables this),

  AND that deleted policies should no longer grant permissions.


  The user-observable reality, per batch-H primary-source code-walk of

  ReactivePolicyRepositoryImpl + PolicyServiceImpl: the `getRolesPolicies` JOIN

  (ReactivePolicyRepositoryImpl.java:32-35) DOES NOT carry a `deleted_at IS NULL`

  filter on the policy side. The service-layer cascade-delete defence

  (PolicyServiceImpl.java:89-92, CascadeDeleteException on bound policies) prevents

  the normal soft-delete path from leaving orphans — BUT any direct DB UPDATE setting

  `policy.deleted_at` (a hot-fix script, a migration mistake, a future refactor

  weakening the service-layer check) creates the orphan-binding security gap: the

  soft-deleted policy''s statements continue to confer permissions on every

  authorized request, with NO application log line on policy mutations (forensic

  silence: zero `log.info` / audit-table-write on policy create/update/delete).

  '
