behaviour: |-
  **CROSS-CUTTING PATTERN: ALL FOUR BATCH-P CONTROLLER-METHOD TARGETS HAVE ZERO DIRECT CONTROLLER-BOUNDARY TESTS.** Verified across all four method-level sidecars in batch P: (1) `IngestionController.createDataSource` — service-tier `DataSourceIngestionServiceTest.java` exists with 6 cases but NO `IngestionDataSourceControllerTest` and NO `IngestionDataSourceFilterIntegrationTest`; (2) `AlertManagerController.postAlerts` — `grep -rln 'alertmanager|handleExternalAlerts|AlertManager' odd-platform-api/src/test` returns ONLY the test-resource `prometheus/prometheus.yml`, zero test classes; (3) `OwnerController.updateOwner` — `grep -rln 'updateOwner|OwnerController' odd-platform-api/src/test` returns zero matches; (4) `OwnerController.deleteOwner` — only the repository-tier `OwnerRepositoryImplTest.testDeletesOwner` exercises the soft-delete UPDATE, NOT the cascade-block / role-binding hard-delete / search-vector / orphan-association-request surface. **The pattern is class-wide for the high-impact write surfaces of the platform.** Each method bundles 4-8 distinct correctness contracts (auth/authz + transaction + cascade + audit + search + side-effects) but the test directory has NO controller-tier verification for any of them. A regression in MapStruct mapper, role-rebind diff, search-vector refresh, cascade-check predicate, or unique-constraint mapping (USR003 vs 500) would silently break these endpoints with the build still green. This systemic-pattern gap traces 4 separate sidecars converging on the same architectural absence.
