proposed_action: |-
  Two-step fix. (1) Wrap the Resolve / Reopen Button at
  AlertItem.tsx:159-166 in <WithPermissions
  permissionTo={Permission.DATA_ENTITY_ALERT_RESOLVE}> — this hides
  the affordance for unprivileged users. (2) Land the three
  regression-pin tests above (UI hide + UI show + backend 403).
  After the fix, also surface a DOC-NNN to add a "Permissions"
  section to the alerting doc page enumerating
  DATA_ENTITY_ALERT_RESOLVE as the gate for the Resolve/Reopen
  action. Net effect: affordance is invisible to unprivileged
  users (operator-honest), permission is documented (operator-
  discoverable), backend gate remains (defense-in-depth).
