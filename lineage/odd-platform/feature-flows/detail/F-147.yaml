terminal_side_effect:
  side_effect_class: db-write (via the F-001 chain)
  description: |-
    Each search-row click triggers DataEntityServiceImpl.getDetails
    wrapped in @ReactiveTransactional, which fires
    incrementViewCount → UPDATE data_entity SET view_count = view_count + 1.
    Due to LSN-017 dep-array bug at DataEntityDetails.tsx:56-64, each
    page-mount fires 2 GETs → +2 view_count per click.
  evidence: |-
    ResultItem.tsx:42, 75-76 (UI) → F-001 backend chain (resolved).
  cardinality_per_call: 2 (per F-001's amplification_factor=2)
amplification_factor: 2
amplification_factor_provenance: |-
  Inherited from F-001 — the LSN-017 useEffect at DataEntityDetails.tsx:56-64
  fires the fetch twice per mount. The Search-row click is just the entry
  trigger; the doubling lives downstream. P-004 (run R-20260519T010758Z-P-004)
  empirically pinned xhr_count=2 + DB delta=2 per click.
observed_vs_expected:
  facets:
  - facet: |-
      Entire row clickable — no <button>/<a>, no focus-visible, no
      keyboard handler, no aria-label, no role
    observed: |-
      ResultItem.tsx:72-76 — S.Container is a styled grid container
      with `onClick={() => navigate(detailsLink)}`. No button / anchor
      semantics, no tabindex, no Enter / Space handlers, no aria-label
      naming the entity by name, no role='link'. Keyboard-only operators
      cannot reach a result row. Screen readers do not announce the row
      as actionable. Color-only focus indicator (the hover background-
      change in S.Container styles) does not serve as a focus ring.
    expected: |-
      Render the row as `<S.Container as='a' href={detailsLink}>` or as a
      <button>; add aria-label `'Open data entity X'`; add tabindex=0
      and an `onKeyDown` handler for Enter / Space. The same fix shape
      as the F-001 PopularStrip a11y gap.
    drift_class: search_result_row_entire_clickable_no_focus_visible_no_keyboard_no_aria_label_no_navigation_prevention_for_routine_scrolling
    provenance: |-
      STATIC — ResultItem.tsx:71-76 line-by-line.
    severity: MEDIUM
    ui_unverified: false
  - facet: |-
      Search row click amplifies view_count → routine browsing inflates
      Popular ranking (the F-001 + F-003 inflation loop closes from the
      search side too)
    observed: |-
      A user typing a search query and clicking a few result rows to
      check each entity pumps +2 view_count per click into the
      data_entity.view_count column. The Popular ranking surface
      (F-003's PopularStrip) orders by exactly this column. Routine
      search browsing inflates the home-page Popular column without the
      operator's intent or awareness. Combined with F-003's missing
      EXCLUDE_FROM_SEARCH filter on listPopular, a user opening 30
      search-result rows raises every clicked entity by +60 view_count
      in a single session.
    expected: |-
      Either (a) search-row click should NOT fire incrementViewCount
      (the read should be a "preview/peek" not a "view"); (b) the
      Popular ranking should distinguish search-driven clicks from
      direct-link clicks; (c) the LSN-017 doubling fix (1-line dep-
      array fix at DataEntityDetails.tsx:63) at LEAST halves the
      amplification; (d) per-session dedupe on view_count increments.
    drift_class: search_row_click_amplifies_view_count_routine_browsing_inflates_popular_ranking
    provenance: |-
      STATIC — ResultItem.tsx:75 + F-001's resolved chain + F-003's
      Popular CTE order-by view_count.
    severity: HIGH
    ui_unverified: false
  - facet: |-
      Inner button click handlers may double-navigate without
      stopPropagation audit
    observed: |-
      Inside the row at lines 100-107 — `<DataEntityDetailsPreview
      dataEntityId={...}/>` is a hover-preview component; at lines
      101-105 the `<AppTooltip checkForOverflow={false}
      title={searchHighlights}><QuestionIcon .../></AppTooltip>` is
      clickable; at line 87-90 the `<MetadataStale .../>` icon is
      wrapped in another AppTooltip. NONE of these inner handlers
      visibly call event.stopPropagation. A click on the QuestionIcon
      or the StaleIcon may bubble to the row container's onClick →
      double-navigate.
    expected: |-
      Each inner clickable child either explicitly calls
      event.stopPropagation, OR the row's onClick checks e.target
      against the row's e.currentTarget. The cheapest fix is a
      stopPropagation pass on the row-internal handlers; the cleanest
      is to drop the whole-row onClick in favour of a single anchor
      wrapping the Name cell only.
    drift_class: inner_button_clicks_no_stop_propagation_audit_DetailsPreview_AppTooltip_QuestionIcon_may_double_navigate
    provenance: |-
      STATIC — ResultItem.tsx walk + the slice's other components
      (MetadataStale + SearchHighlights + DataEntityDetailsPreview) read
      directly. The stopPropagation audit requires reading
      DataEntityDetailsPreview which is OUT OF SLICE — flagged
      ui_unverified.
    severity: MEDIUM
    ui_unverified: true
    ui_unverified_reason: |-
      DataEntityDetailsPreview is in components/shared/elements and
      not part of slice E. Audit deferred to next /enrich pass.
  - facet: |-
      UI route target hardcoded to '/overview' segment — couples Search
      to F-001's inflation loop closure point
    observed: |-
      `dataEntityDetailsPath(searchResult.id)` resolves to
      /dataentities/{id}/overview — the SAME target as F-001's
      PopularStrip tile. Per F-001's existing facet
      `PopularStrip click-target docs mismatch`, the live doc claims
      Popular tiles open the Structure page, but code navigates to
      Overview. The same statement applies to Search-row clicks — if
      the doc ever describes the Search-row click target it must say
      Overview.
    expected: |-
      Either (a) the Search-row click should target a "peek" route
      that doesn't fire incrementViewCount; OR (b) the docs explicitly
      document the click → Overview behaviour.
    drift_class: ui_route_target_hardcoded_to_overview_path_couples_search_to_F_001_inflation_loop
    provenance: |-
      STATIC — ResultItem.tsx:42 + F-001's batch-J PopularStrip
      click-target finding.
    severity: LOW
    ui_unverified: false
  - facet: |-
      Back-navigation does not dedupe — same entity clicked twice via
      Back → click increments view_count twice
    observed: |-
      No client-side guard against repeat clicks within a session.
      Operator opening result row A, hitting Back to return to results,
      clicking row A again increments view_count by +2 × 2 = +4 for two
      conceptually-identical "looked at A" gestures. Same shape as the
      F-001 PopularStrip "back-navigation REMOUNTS" finding.
    expected: |-
      A per-session per-entity dedupe key (e.g. localStorage TTL on
      viewed entity IDs) suppresses repeat increments within a 5-minute
      window.
    drift_class: back_navigation_does_not_dedupe_search_row_click_count_unbounded_per_session
    provenance: |-
      STATIC — ResultItem.tsx:75 has no dedupe + F-001 PopularStrip
      batch-J finding (same posture).
    severity: LOW
    ui_unverified: false
