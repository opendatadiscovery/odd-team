name: F-001 UI LOOP CLOSURE — Popular-Tile Click Feeds view_count Increment
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: |-
  **NEW INVARIANT, batch 2026-05-19J — UI-LAYER CLOSURE OF F-001**. The Popular
  column on the home page (rendered as one of four columns inside
  OwnerEntitiesList) DISPLAYS the inflatable ranking AND is the surface that
  TRIGGERS view_count increments on click. **The mechanic**: a user clicks a
  Popular tile → SPA navigates to `/dataentities/{id}/overview` → the entity-detail
  page mounts → `fetchDataEntityDetails` fires → backend
  `GET /api/dataentities/{id}` → server-side `incrementViewCount` runs (per batch
  F + H) → the entity's view_count rises → next Popular refresh ranks it higher
  → the entity is more likely to be clicked again. **The UI does not break this
  loop** with any client-side debouncing, idempotency key, per-tab-per-entity
  "already-counted-this-session" guard, or analytics-only mode. Every Popular-tile
  click is an authentic detail-read that the server counts. **Combined with
  LSN-017**: every Popular-tile click costs +2 view_count UPDATEs (the doubling).
  **Under DISABLED auth**: the loop is reachable anonymously at the API layer, but
  the UI Recommended panel is HIDDEN on the home page (per Overview.tsx gate) —
  so the UI-driven inflation path is closed for DISABLED while the API path
  remains open. Under LOGIN_FORM/OAUTH2/LDAP both UI and API loops are open.
  **The back-button compounds the loop**: react-router-dom v6's default route
  component unmount/remount on history navigation means returning to `/` from
  `/dataentities/{id}/overview` triggers `OwnerEntitiesList`'s `useEffect(...,
  [])` again, firing all four thunks again. A user clicking Popular → back →
  clicking again from a remounted Popular observes an ALREADY-UPDATED ranking
  if their click+back round-trip incremented the clicked entity's view_count
  past a neighbour — **the loop is observable to the user from the UI in
  real-time**. **Mitigation candidates (all unimplemented at the UI layer)**:
  (i) debounce `fetchDataEntityDetails` per `(session, entityId)` pair —
  first click counts, subsequent clicks within N minutes don't refetch; (ii)
  intercept the Popular-tile click to dispatch an analytics-only thunk that
  does NOT trigger `incrementViewCount`; (iii) cache the detail-page mount in
  Redux so back-and-forward navigation doesn't refire the read.
