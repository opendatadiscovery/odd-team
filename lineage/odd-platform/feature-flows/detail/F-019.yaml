observed_vs_expected:
  facets:
  - facet: six-sidecar audit-silence pattern (Owner lifecycle trinity adds 3 to the existing RBAC mutation count)
    observed: |-
      OwnerServiceImpl.create / .update / .delete all carry NO
      @ActivityLog annotation (verified via grep across
      <odd-platform-api>/service/*.java — only 6 service files have
      @ActivityLog, none of them OwnerServiceImpl). The activity
      feed does NOT record "owner X created/renamed/deleted by Y
      at T". Combined with the role-binding HARD-delete on delete
      (irreversible) and the partial-unique-index pattern enabling
      name re-use after soft-delete, an operator can delete an Owner
      and re-create a DIFFERENT Owner with the same name, with no
      trace anywhere except the soft-deleted row's deleted_at
      timestamp (no operator-readable surface). Extends the F-006
      4-sidecar audit-silence pattern (RoleController + PolicyController
      + ReactivePolicyRepositoryImpl + ReactiveRoleRepositoryImpl)
      by adding the Owner-lifecycle 3-sidecar count.
    expected: |-
      Owner CRUD should emit OWNER_CREATED / OWNER_UPDATED /
      OWNER_DELETED activity events (matching the existing
      DATA_ENTITY_CREATED / OWNERSHIP_CREATED / etc. naming). The
      live permissions doc names the permissions but is silent on
      audit; the live owners doc is silent on audit. An operator
      auditing "who renamed Owner X to Y between dates A and B" has
      NO record to consult.
    drift_class: forensic_silence_on_owner_lifecycle_mutations
    provenance: |-
      STATIC — primary-source in createOwner sidecar (batch E)
      bugs_limitations_corner_cases[4] + updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[1] + deleteOwner sidecar (batch P)
      bugs_limitations_corner_cases[0]. Severity: HIGH.
  - facet: empty `roles` field silently destroys all role bindings on update
    observed: |-
      OwnerFormData.roles is OpenAPI-optional (`components.yaml:419-422`,
      no `required` marker); getRoleIdsList collapses both null AND
      empty list to `List.of()` (`OwnerServiceImpl.java:117-122`).
      The update transaction then calls `deleteOwnerRelationsExcept(
      ownerId, List.of()).then(createRelations(ownerId, List.of()))`
      — the first half DELETES all current role-links (no existing
      link is in the empty set); the second half INSERTS nothing. An
      operator updating ONLY the owner name (omitting `roles` to
      mean 'don't touch') INSTEAD REMOVES ALL role assignments. The
      UI in practice always sends the current `roles` list so the
      hazard is masked in normal UI flows — but any API consumer
      (script, integration) that omits `roles` silently strips ALL
      roles from the Owner.
    expected: |-
      `roles` should be treated as 'don't touch if omitted' OR explicit
      partial-update semantics (e.g. JSON Merge Patch) OR a separate
      `clear_roles` boolean flag. The destructive-default UX is
      hazardous AND silent — combined with the no-audit-log gap,
      role-stripping leaves no trace.
    drift_class: empty_roles_field_silently_destroys_bindings
    provenance: |-
      STATIC — primary-source in updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[3] + security.known_security_gaps[2]
      + OwnerServiceImpl.java:71, 76-81, 117-122 + components.yaml:419-422.
      Severity: HIGH.
  - facet: OpenAPI declares 201 for create AND update — implementation returns 200 (class-wide drift)
    observed: |-
      The OpenAPI spec declares `responses.'201'` for BOTH the
      createOwner operationId (`openapi.yaml` createOwner) AND the
      updateOwner operationId (`openapi.yaml:196`). The controller
      returns `ResponseEntity.ok = 200` on both methods (`OwnerController.java:25`
      for create, line 53 for update). Doubly anomalous: (a) declaring
      201 for a PUT-update is itself unusual (201 canonically signals
      POST-creation); (b) the implementation disagrees with the spec
      on BOTH methods. Class-wide pattern — not a per-method oversight.
      The deleteOwner method DOES align (OpenAPI declares 204, impl
      returns 204).
    expected: |-
      Either update the OpenAPI spec to declare 200 on the update
      operationId (consistent with PUT semantics) AND keep 201 on
      the create operationId (correct for POST-creation) — and fix
      the implementation to match the corrected spec. OR update the
      implementation to honour the declared 201 for create + the
      anomalous 201 for update.
    drift_class: openapi_201_vs_impl_200_class_wide
    provenance: |-
      STATIC — primary-source in createOwner sidecar (batch E)
      bugs_limitations_corner_cases[0] + updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[0] + deleteOwner sidecar (batch P)
      doc_drift_findings[2] (alignment record for symmetry). Severity:
      MEDIUM.
  - facet: OWNER.NAME rename SAFE for USER_OWNER_MAPPING — load-bearing contrast to OIDC_USERNAME rename hazard
    observed: |-
      USER_OWNER_MAPPING.owner_id REFERENCES owner(id) — the FK is
      by `owner.id` (the bigserial PK, stable across name changes),
      NOT by `owner.name`. PUT /api/owners/{owner_id} renames
      `owner.name` via OwnerMapper.applyToPojo +
      ReactiveAbstractCRUDRepository.updateOne; USER_OWNER_MAPPING
      rows continue to point at the same Owner identity. This is the
      LOAD-BEARING CONTRAST to REFACTOR-391's GitHub-login-rename
      orphan (the OIDC_USERNAME side of the rename hazard surface,
      which DOES orphan USER_OWNER_MAPPING because the handler uses
      `oidc_username='login'` — a free-rename string — and no
      stable-id fallback). The two findings together describe the
      complete rename hazard surface: OWNER.NAME safe; OIDC_USERNAME
      hazardous.
    expected: |-
      Documentation cross-link on the live owners doc + the live
      user-owner-association doc: "OWNER.NAME rename is safe for
      associations — the FK is by owner.id; OIDC username rename is
      hazardous, see REFACTOR-391". The safety invariant is
      structurally provable; surface for ADR + doc page.
    drift_class: owner_name_rename_safe_for_user_owner_mapping
    provenance: |-
      STATIC — primary-source in updateOwner sidecar (batch P)
      coherence_notes (the LOAD-BEARING contrast) + concepts.invariants[1]
      + V0_0_4__add_user_owner_mapping.sql:3 (FK declaration). Severity:
      N/A (positive case-law, no severity — but the documentation
      gap surrounding the contrast is MEDIUM).
  - facet: rename collision propagated as USR003/HTTP 400 — not 409 Conflict
    observed: |-
      The `owner_name_unique` partial unique index (`V0_0_64__remove_is_deleted_field.sql:70`)
      catches the second rename to the same active name; jOOQ raises
      `DataAccessException` → `ExceptionUtils.translateDatabaseException`
      → `UniqueConstraintException` → `ControllerAdvice.handleUniqueConstraint`
      → HTTP 400 with `ErrorCode.UNIQUE_CONSTRAINT`. The client
      receives 400, not the canonically-correct 409 Conflict. NO
      test verifies this code path; NO API doc indicates which code
