name: Table Health label drift (doc says 'success/failed/broken', code shows 'Healthy/Warning/Error')
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The live https://docs.opendatadiscovery.org/features/data-quality/dashboard
  page (WebFetched 2026-05-22 status 200) describes Table Health as
  "success / failed / broken". The dashboard code renders the slices
  labelled `Healthy` / `Warning` / `Error` from
  `tablesDashboard.tablesHealth.{healthyTables, warningTables, errorTables}`
  (DataQualityContent.tsx:55-62, components.yaml:3772-3787). The DTO
  field set has no `failed` or `broken` field — it has `warning` and
  `error`. NEW invariant, batch ZC (2026-05-22).

  Vocabulary mismatch: an operator reading the docs looking for a
  'broken tables' count will not find that label on the screen. The
  concepts roughly correspond — Healthy ≈ success, Warning ≈ failed,
  Error ≈ broken — but the doc's vocabulary is not the product's
  vocabulary. An operator searching the UI for a docs-cited label
  will fail; an operator searching the docs for a UI-cited label will
  also fail.

  Severity MEDIUM: the concepts roughly correspond, but the doc's
  vocabulary is not the product's vocabulary.

  Recommended fix: align the doc to the code. The DTO is the source of
  truth (`TablesHealthDashboard.healthyTables / warningTables /
  errorTables` at components.yaml:3772-3787); the doc should match.
  Bonus: a 3-row table on dashboard.md naming each label, its DTO
  field name, and one-line semantics — same pattern as the proposed
  fix for the `run-status-three-vs-six-status-doc-drift-dashboard`
  invariant.

  vocabulary_status: codebase-anchored, doc-side-drift (explicit
  vocabulary mismatch, not absence).
