behaviour: 'Activity emission for `applyAlertActions` — `registerNewAlertsActivityEvents`
  and `registerAutomaticallyResolvedAlertsActivityEvents` paths build `ActivityCreateEvent`
  rows that should land in the activity feed. Ingestion tests assert alert status but
  do NOT query the activity table to confirm emission. A regression that drops one
  of the `flatMap(activityService::createActivityEvents)` calls would land green. The
  four emission patterns (`OPEN_ALERT_RECEIVED` / `RESOLVED_ALERT_RECEIVED` / `ALERT_STATUS_UPDATED`
  systemEvent=true / `ALERT_STATUS_UPDATED` systemEvent=false) need pinned coverage
  at the service tier.'
