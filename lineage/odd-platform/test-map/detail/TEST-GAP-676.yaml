surfaced_by:
  - "ReactiveCollectorRepositoryImpl.md:bugs_limitations_corner_cases.[4] (collector.name UNIQUE is a FULL unique constraint, NOT partial)"
behaviour: |-
  **`collector.name UNIQUE` is a FULL unique constraint, NOT partial (asymmetric with role/policy/owner/tag patterns).** `V0_0_29__add_collector.sql:4` — `name varchar(255) UNIQUE`. The constraint applies to ALL rows including soft-deleted ones. A soft-deleted collector's name CANNOT be reused without first hard-deleting the row. This is INCONSISTENT with the recreate-after-delete pattern used for `role.name` (where the partial unique index `role_name_unique ON role(name) WHERE deleted_at IS NULL` per V0_0_55:42 + V0_0_64:88-90 allows re-creation), `policy.name` (same pattern, batch H), `owner.name` (TEST-GAP-239 — V0_0_64:68-70 reissues the partial), `tag.name` (V0_0_64:103-105). An operator deleting a collector named 'snowflake-prod' and trying to re-create with the same name hits a `UniqueConstraintException` with no doc explanation. **The schema-layer asymmetry is undocumented; the user-facing error wrapping does NOT distinguish "name held by a soft-deleted collector you can't see" from "name held by a live collector you can see".**
