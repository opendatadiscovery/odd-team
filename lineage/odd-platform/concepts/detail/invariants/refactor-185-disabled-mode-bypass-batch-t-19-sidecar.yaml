name: REFACTOR-185 DISABLED-mode anonymous-bypass — batch T 19-sidecar at controller-class layer
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  NEW INVARIANT, batch 2026-05-20T — STRENGTHENS REFACTOR-185 (the DISABLED-mode
  bypass surface enumeration) by anchoring the cross-batch pattern at the
  CONTROLLER-CLASS axis layer via the AppInfoController class sidecar.

  **The 19-sidecar accounting** (per the batch Q UI-vs-API asymmetry invariant
  plus this batch's controller-class anchor):

    Prior 18 sidecars (per the master ui-vs-api-asymmetry-under-disabled-...
    invariant):
      Backend (controllers + services + ingestion paths): 14 sidecars across
        Batch B-O — the auth-mode SecurityConfiguration siblings + various
        controllers that fall through to authenticated() under non-DISABLED
        modes and become anonymous under DISABLED. Detailed enumeration in
        the master invariant entry.
      UI tier (batch Q): 4 sidecars — CollectorsList / OwnersList / RolesList /
        PolicyList — the UI-vs-API SAFETY asymmetry (UI hides buttons, backend
        accepts anonymous mutations).

    NEW batch T (+1 evidence point):
      **(19th sidecar) AppInfoController (controller-class) — the SIMPLEST
      instance of REFACTOR-185 at the axis layer**:
        AppInfoController has NO @PreAuthorize and no SecurityConstants.SECURITY_RULES
        entry for /api/appInfo. Under DISABLED, the endpoint is anonymously
        reachable AND returns `{authType, projectVersion}` to any network
        caller (DisabledAuthSecurityConfiguration.java:13-18 applies
        .anyExchange().permitAll()). The disclosure is BOTH:
          (a) the auth mode itself ('this deployment is DISABLED — attack
              surface is anonymous'),
          (b) the precise project version (CVE-scoping for any vulnerabilities
              in the Spring Boot / WebFlux / Reactor / R2DBC / OAuth-client
              chains applicable to THIS deployment).
        The endpoint is the highest-signal-density fingerprint endpoint in the
        platform: no body, no auth, returns two strings, both identifying.
        Compared to /actuator/info (whitelisted) or / (returns SPA HTML),
        /api/appInfo is the single most useful reconnaissance target.

  **WHY THIS REACHES 19 SIDECARS MATTERS**: prior batches catalogued the
  DISABLED-mode bypass at the SecurityConfiguration tier (the WHY of the
  bypass) and at the UI tier (the UX hazard of UI-vs-API asymmetry). Batch T
  adds the controller-class layer view — the WHAT a network attacker actually
  reads when they hit a DISABLED deployment's /api/appInfo:
    - auth mode (informs WHICH attack vector to use next)
    - project version (informs WHICH CVEs apply)
    - the absence of (provider name / LDAP URI / build SHA / hostname) — the
      INTENTIONAL non-disclosure surface that limits the fingerprinting blast
      radius to (mode + version)

  The 19-sidecar count is the platform's most thoroughly-enumerated security
  pattern; cross-link to the new expose-mode-hide-provider invariant captured
  in this same batch (the deliberate cross-endpoint contract that limits the
  fingerprinting surface).

  **Combined with the batch T Directory finding**: REFACTOR-185 under DISABLED
  is COMPOUNDED by the Directory reflection-extractor's ODDRN-property leak
  (host / database / port / account / warehouse / cluster / topic emitted for
  every registered datasource). An anonymous DISABLED deployment leaks:
    - (mode + version) via /api/appInfo — the fingerprinting signal
    - (datasource inventory + ODDRN-derived infrastructure map) via
      /api/directory + /api/directory/datasources — the operational reconnaissance
    - the full cross-owner audit trail via /api/activity, ALL search results via
      /api/search, ALL data-entity details via /api/dataentities, ALL DQ data
      via /api/datasets/{id}/* — the catalog enumeration
  An attacker hitting a network-reachable DISABLED port enumerates the entire
  deployment's identity-mode, version, infrastructure, and metadata catalog
  in well under 30 seconds.

  Severity: HIGH (the 19-sidecar enumeration confirms the platform's most
  thoroughly-catalogued security failure mode; under DISABLED, every layer
  the platform exposes is anonymous; the recommendation in the docs that
  DISABLED is 'dev-only' is the only mitigation, and it relies on operator
  discipline that the workspace's case-law has repeatedly shown to be
  insufficient — LSN-001 and LSN-002 are the precedents).
