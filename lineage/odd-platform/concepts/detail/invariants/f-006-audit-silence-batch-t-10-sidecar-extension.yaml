description: |-
  NEW INVARIANT, batch 2026-05-20T — STRENGTHENS the existing F-006 audit-silence
  pattern from 9-sidecar to 10-sidecar by adding TWO new evidence points in
  batch T:

    1. **ActivityController (class) — 10th audit-silence corroborating sidecar**.
       The read surface that surfaces what the schema-rooted scope can record.
       NO @PreAuthorize, NO SecurityConstants.SECURITY_RULES entry for
       /api/activity or /api/activity/counts. The generated ActivityApi interface
       carries no authorization annotations. Combined with batch R's schema-rooted
       scope (activity.data_entity_id NOT NULL FK), the picture is COMPLETE
       end-to-end: every authenticated user sees every recorded change on every
       data entity across all owners — AND those recorded changes structurally
       CANNOT include RBAC mutations, Datasource registrations, Owner CRUD, or
       Collector token rotations. The READ surface is the layer at which the
       pattern's user-visible manifestation crystallises.

    2. **DataQualityController setDataQATestSeverity — 10b: NEW shape of
       audit-silence at a DATA-ENTITY-SCOPED mutation**. Prior batches catalogued
       audit-silence at RBAC / Owner / Datasource / Collector / AlertManager-ingress
       mutations — every prior sidecar was a mutation that was EITHER
       not-data-entity-scoped (RBAC/Owner — would require schema change to audit)
       OR data-entity-scoped but ingress-only (AlertManager — state transitions
       ARE audited per batch S refinement). DataQuality severity-set is the FIRST
       audit-silence sidecar that is BOTH:
         (a) IS authorization-gated (DATA_ENTITY-scoped via DATASET_TEST_RUN_SET_SEVERITY)
         (b) IS data-entity-scoped (so the schema-rooted activity table FK
             constraint does NOT block emission — the dataset has a data_entity_id)
         (c) STILL emits no audit event (no @ActivityLog on
             DataQualityServiceImpl.setDataQualityTestSeverity; no
             ActivityEventEmitter call; ReactiveDataQualityRepositoryImpl.java:90-101
             onDuplicateKeyUpdate is silent)
       This is the SIMPLEST F-006 remediation target — no schema migration
       needed, just add the activity event emission to the service method. The
       audit-silence is purely an annotation gap, not a schema-rooted constraint.

  THE 10-SIDECAR PATTERN END-TO-END (now batch-T-anchored):

    Prior 9-sidecar inventory (per batch S extension):
      UI tier (batch Q — 5 sidecars):
        AppToolbar / PolicyList / RolesList / OwnersList / CollectorsList
      HTTP / controller tier (batch E + P — 5 sidecars):
        createRole / createPolicy / createOwner / updateOwner / deleteOwner
      Service tier (batch S — 5 sidecars):
        OwnerServiceImpl / PolicyServiceImpl / RoleServiceImpl /
        AlertServiceImpl (partial — webhook INGRESS only) /
        DataSourceIngestionServiceImpl
      SQL tier (batch H + N + R — 3 sidecars):
        ReactivePolicyRepositoryImpl / ReactiveRoleRepositoryImpl /
        ReactiveActivityRepositoryImpl
      Schema tier (batch R):
        V0_0_48__add_activity.sql:4,12 (data_entity_id NOT NULL FK)

    NEW batch T (+2 evidence points):
      Read-surface tier (batch T):
        **ActivityController (class)** — 10th audit-silence sidecar; the read
        surface where the schema-rooted limit becomes user-visible. The four-way
        ActivityType dispatch (ALL / MY_OBJECTS / UPSTREAM / DOWNSTREAM) is the
        operator-facing visibility model; under default (type=null or type=ALL)
        the read returns cross-owner audit but cannot include RBAC mutations.
      Mutation-surface tier (batch T — NEW SHAPE):
        **DataQualityController setDataQATestSeverity** — the FIRST audit-silence
        sidecar on an authorization-gated, data-entity-scoped mutation. Schema
        permits emission (data_entity_id is the dataset id); the gap is purely
        annotation-level.

  REMEDIATION SCOPE (refined by batch T):
    - The Activity read surface itself does NOT need remediation; it correctly
      surfaces what the schema-rooted scope permits. The fix is at the WRITE
      side: extend the activity table to permit non-data-entity events, OR
      pair each RBAC/Owner/Datasource mutation with a sibling event table.
    - DataQualityController setDataQATestSeverity IS easy to remediate — add
      @ActivityLog (or an ActivityEventEmitter call) to
      DataQualityServiceImpl.setDataQualityTestSeverity. The data_entity_id is
      the dataset's id; the constraint is satisfied. A new ActivityEventType
      enum value (DATASET_QA_TEST_SEVERITY_UPDATED) would be the cleanest, but
      reusing DATA_ENTITY_OVERVIEW_UPDATED is a one-line stop-gap.

  Severity: HIGH (the 10-sidecar pattern means the platform's RBAC + Owner +
  Datasource + Alert-ingress audit story is uniformly absent across every layer
  — PLUS the DataQuality severity-set mutation is silent despite being trivially
  remediable; a privileged caller / hijacked admin / S2S API-key holder per
  REFACTOR-108 who mutates the authorization model OR a data steward who changes
  a critical-test severity leaves no trail anywhere).
