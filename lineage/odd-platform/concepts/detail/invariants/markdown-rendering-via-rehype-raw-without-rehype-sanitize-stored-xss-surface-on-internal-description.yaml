mitigations_unimplemented:
- Add rehype-sanitize to the UI Markdown rendering pipeline with allowlist excluding
  script/iframe/style/onerror
- Add backend HTML sanitisation (Jsoup or org.owasp.encoder) at write time
- Add @Size(max=...) on InternalDescriptionFormData; cap at e.g. 64 KiB
- Add a regression test that stores <script>/<img onerror=...> and asserts the round-trip
  is neutralised
- Add a Vitest + Testing Library unit test that mounts InternalDescriptionPreview
  with a malicious description and asserts script/iframe tags are STRIPPED (would
  surface ANY rehype-pipeline change that loosens behaviour; defence-in-depth)
- Verify behaviour on Firefox and Safari (P-009 only covers Chromium-headless)
notes: |-
  Strengthened in batch 2026-05-19J from single-sidecar to two-sidecar with the
  DataEntityDescription UI cluster sidecar. The F-004 UI half is now CONFIRMED
  end-to-end:
    - rehype-raw transitively pulled, no rehype-sanitize in deps tree
    - Markdown shared element is the SOLE renderer on the platform; affects every
      Markdown surface (alerts, queries, term definitions, owner descriptions,
      dataset-field descriptions, attachments)
    - P-009 slice-5 empirically pinned dangerous-tag DOM penetration
    - Execution blocked only by defence-in-depth (Chromium HTML-parser policy +
      React attribute filtering)

  The F-004 fix recommendation is unchanged: add rehype-sanitize to the shared
  Markdown wrapper (one file, one prop) — this fixes every Markdown surface in
  the UI simultaneously, regression-pinned by P-009 (the slice-6 mitigation would
  flip dom_has_script_tag from True to False).
