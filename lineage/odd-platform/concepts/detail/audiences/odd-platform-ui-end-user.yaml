contributors:
  - 'AlertController.audiences: ODD Platform UI — Alerts navigation pane and per-entity Alerts tabs'
  - 'DataEntityController.audiences: virtually every UI screen consumes Data Entity endpoints'
  - 'DataEntityAttachmentController.audiences: per-entity Attachments tab, drag-and-drop file uploader, link picker'
  - 'alerts route.audiences: signed-in platform users browsing alerts via the AppToolbar `Alerts` tab and the in-page tab strip'
  - 'i18n.ts.audiences: platform UI end-users (the language switcher in the user menu reads i18n.languages)'
  - 'getActivity.audiences: Activity Feed page (https://docs.opendatadiscovery.org/features/active-platform-features/activity-feed), operators auditing platform changes, security/compliance reviewers'
  - 'postMessageInSlack.audiences: authenticated ODD UI users posting from the Discussions tab on a data-entity detail page'
  - 'getAllAlerts.audiences: ODD Platform UI — Alerts → All tab (per live alerting doc); platform stewards and admins per the live doc''s recommendation'
  - 'uploadFileChunk.audiences: ODD Platform UI — chunked uploader on the per-entity Attachments tab'
  - 'getDataEntityDetails.audiences: ODD Platform UI — the per-entity detail page''s Overview tab + every other tab that opens via the same entity context (Lineage, Alerts, Activity, Discussions, Metrics, Test Reports, Structure, Linked Items, Query Examples) — the platform''s single hottest read path on the UI'
  - 'createOwnership.audiences: ODD Platform UI — the Data Entity overview / Owners panel uses this endpoint to add an owner to a data entity; the primary UI surface where the user-supplied owner_name + title_name may unintentionally create directory entries'
  - 'updateStatus.audiences: ODD Platform UI — entity-detail page status dropdown calls this endpoint; in-platform `DataEntityStatusSwitchJob` writes through the same service path but originates server-side'
  - 'getDataEntityDownstreamLineage.audiences: ODD Platform UI — the lineage canvas on the data-entity detail page; the UI sets `lineage_depth` and accumulates `expanded_entity_ids` as the user expands nodes'
  - |-
    DataQuality.audiences (batch ZC): odd-platform-ui-end-user — any authenticated
    user; reaches the page via the top-bar 'Data Quality' tab (ToolbarTabs.tsx:45-49)
    or by navigating directly to /data-quality
  - |-
