behaviour: |-
  **Cross-mode coverage divergence between LOGIN_FORM (exact-path list) and OAUTH2/LDAP (wildcard `/ingestion/**`).** LoginFormSecurityConfiguration.java:49-51 lists `/ingestion/entities` + `/ingestion/datasources` exact-only — so `POST /ingestion/alert/alertmanager` under LOGIN_FORM would FALL THROUGH to `.pathMatchers("/**").authenticated()` and REQUIRE login. BUT OAUTH2/LDAP route through `SecurityConstants.WHITELIST_PATHS` (`/ingestion/**` wildcard at line 96) + `AuthorizationCustomizer.java:22` which DOES permit `/ingestion/alert/alertmanager`. Under DISABLED, every path is permitAll. The mode-by-mode reachability of the alertmanager webhook is INCONSISTENT and undocumented. An operator switching from LOGIN_FORM to OAUTH2 might unknowingly OPEN the alertmanager webhook (from auth-required to anonymous). The cross-mode behaviour divergence affects the SAME endpoint set with the SAME nominal protection but different actual reachability.
