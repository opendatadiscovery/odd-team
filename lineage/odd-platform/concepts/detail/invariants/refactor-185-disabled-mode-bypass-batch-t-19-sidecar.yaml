name: REFACTOR-185 DISABLED-mode + LOGIN_FORM-ADMIN-for-all bypass — batch X 24-sidecar at config-class layer
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  STRENGTHENED INVARIANT — batch 2026-05-20X promotes the pattern from 19-sidecar
  (batch T) to 24-sidecar with the LOGIN_FORM facet anchored at the config-class
  layer. The pattern now covers TWO of the four auth modes (DISABLED + LOGIN_FORM)
  with effectively-bypassed authorization, each via a different mechanism.

  **BATCH X EXPANSION — the LOGIN_FORM-ADMIN-for-everyone facet** (5 new sidecars):
    The LoginFormSecurityConfiguration config-class sidecar (batch X) reveals that
    LOGIN_FORM mode also bypasses the RBAC framework — via a DIFFERENT mechanism
    than DISABLED:
      - DISABLED mode: `.anyExchange().permitAll()` at DisabledAuthSecurityConfiguration.java:13-18
        — no authentication required AT ALL; SecurityWebFilterChain bypasses
        everything
      - LOGIN_FORM mode: `.pathMatchers("/**").authenticated()` requires auth +
        `getAuthorities(true)` at LoginFormSecurityConfiguration.java:81 grants ADMIN
        to every form-authenticated user + NO AuthorizationCustomizer wired (lines
        55-57). The compound effect: every authenticated LOGIN_FORM user is ADMIN
        AND bypasses the SECURITY_RULES table → every endpoint reachable by every
        authenticated caller regardless of operator-authored RBAC.

    The 5 new sidecars in the LOGIN_FORM facet:
      - LoginFormSecurityConfiguration config-class (batch X) — NEW PRIMARY SOURCE
        at the config-class layer
      - LoginFormSecurityConfiguration@L31 config-key-consumer (batch C) — existing,
        the gate-level view
      - GrantedAuthorityExtractor (referenced by line 81 of the config-class) —
        the helper that returns UserProviderRole.ADMIN when `isAdmin=true`
      - getResourcePermissions controller-method sidecar (batch E) — UI-side
        reveal: under LOGIN_FORM the endpoint returns the FULL admin permission
        set regardless of UI-configured policies (the second of the two HIGH
        auth-mode-bypass findings on this endpoint)
      - login-form-admin-for-every-user-rbac-inert invariant (batch X NEW) —
        the canonical promoted invariant

    Net result: 19 (batch T) + 5 (batch X LOGIN_FORM facet) = 24-sidecar pattern.

  **THE LOGIN_FORM VARIANT IS OPERATIONALLY DIFFERENT FROM DISABLED**:
    Under DISABLED: an anonymous network caller hits the platform's HTTP port
      AND reads (mode + version) via /api/appInfo, (datasource inventory +
      ODDRN-derived infrastructure map) via /api/directory, the full cross-owner
      activity feed via /api/activity, ALL search results, ALL data-entity
      details, ALL DQ data. **NO credential needed**.
    Under LOGIN_FORM: a form-authenticated caller (with default `admin:admin`
      OR `root:root` credentials per application.yml:37, OR any operator-defined
      entry) hits the platform AND reads / writes everything regardless of any
      operator-configured Policy. **Authentication is required, but the shipped
      credentials are publicly known and the operator-authored RBAC is silently
      ignored**.

    The DISABLED variant is the worst — no credential needed; the LOGIN_FORM
    variant is the second-worst — credential needed but the credential is
    operator-discipline-dependent (the docs warn 'Change these defaults before
    any non-local deployment') and the discipline is the only line of defence.

  **THE 19-sidecar baseline (batch T)** — preserved from the original entry:

    Prior 18 sidecars (per the master ui-vs-api-asymmetry-under-disabled-...
    invariant):
      Backend (controllers + services + ingestion paths): 14 sidecars across
        Batch B-O — the auth-mode SecurityConfiguration siblings + various
        controllers that fall through to authenticated() under non-DISABLED
        modes and become anonymous under DISABLED. Detailed enumeration in
        the master invariant entry.
      UI tier (batch Q): 4 sidecars — CollectorsList / OwnersList / RolesList /
        PolicyList — the UI-vs-API SAFETY asymmetry (UI hides buttons, backend
        accepts anonymous mutations).

    Batch T (+1 evidence point at AppInfoController controller-class):
      **(19th sidecar) AppInfoController (controller-class) — the SIMPLEST
      instance of REFACTOR-185 at the axis layer**:
        AppInfoController has NO @PreAuthorize and no SecurityConstants.SECURITY_RULES
        entry for /api/appInfo. Under DISABLED, the endpoint is anonymously
        reachable AND returns `{authType, projectVersion}` to any network
        caller (DisabledAuthSecurityConfiguration.java:13-18 applies
        .anyExchange().permitAll()).

    Batch T also added 3 amplifier sidecars (Directory / Activity / DataQuality
    controllers) confirming the DISABLED-mode blast radius widens to
    infrastructure + audit-trail + DQ data + every read-collaborative surface.

  **WHY THIS REACHES 24 SIDECARS MATTERS**: REFACTOR-185 is now the platform's
  most thoroughly-enumerated security pattern. Prior batches catalogued the
  DISABLED-mode bypass at the SecurityConfiguration tier (the WHY of the
  bypass) and at the UI tier (the UX hazard of UI-vs-API asymmetry); batch T
  added the controller-class layer view (the WHAT a network attacker actually
  reads); batch X now adds the LOGIN_FORM-mode auth-bypass-shaped-differently
  view — same effective end-state via a different mechanism.

  Severity: HIGH (the 24-sidecar enumeration confirms the platform's most
  thoroughly-catalogued security failure mode; under DISABLED or LOGIN_FORM,
  the SECURITY_RULES table is effectively INERT; the recommendation in the
  docs that DISABLED is 'dev-only' and LOGIN_FORM-default-credentials must
  be rotated is the only mitigation, and it relies on operator discipline
  that the workspace's case-law (LSN-001, LSN-002) has repeatedly shown to
  be insufficient).
