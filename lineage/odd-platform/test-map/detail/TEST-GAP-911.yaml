behaviour: |-
  **HIGH — the catalog-wide `/data-quality` Data Quality dashboard is mounted UNGATED at `App.tsx:73` — the frontend route has NO `WithPermissionsProvider` wrapper, the toolbar tab is rendered unconditionally, and NO test pins the deliberate any-authenticated-user posture so a future tightening (or a future loosening that opens the route to anonymous) has no regression detector.**

  **The current posture (statically certain at the frontend layer)**:
  - `App.tsx:73` mounts the route as `<Route path={dataQualityPath()} element={<DataQuality />} />` — a BARE route, no permission wrapper.
  - **Contrast**: the IMMEDIATELY ADJACENT `/lookup-tables` route at `App.tsx:75-88` IS wrapped in `WithPermissionsProvider` with explicit `allowedPermissions: [LOOKUP_TABLE_CREATE, LOOKUP_TABLE_UPDATE, LOOKUP_TABLE_DELETE]`. The contrast makes the absence visible — it is an unexplained exception in a code path that knows how to gate routes.
  - `ToolbarTabs.tsx:45-49` renders the "Data Quality" top-bar tab UNCONDITIONALLY — no `Permission` check, no conditional render. Any authenticated user sees the tab.
  - Under `auth.type=DISABLED`, the SPA is anonymous, and so is `/data-quality`.

  **What the dashboard exposes if reached** (the catalog-wide aggregate quality view via the sibling `DataQualityContent`'s `useGetDataQualityDashboard` → `GET /api/dataqatests/runs`):
  - Tables Health aggregate: count of `healthyTables`, `warningTables`, `errorTables` across the WHOLE catalog.
  - Monitored Tables aggregate: count of `monitoredTables`, `notMonitoredTables` across the WHOLE catalog.
  - Test Results Breakdown: catalog-wide per-status (SUCCESS/FAILED/SKIPPED/BROKEN/ABORTED/UNKNOWN) test-run counts.
  - Per-category result rows for all 6 `DataQualityCategory` values with per-status counts.

  **The cross-pillar risk** (P-04 × P-09):
  - This is the UI half. Whether the backend `GET /api/dataqatests/runs` endpoint (owned by `DataQualityRunsController`, not yet enriched) is ALSO ungated decides whether the catalog-wide aggregate health of every dataset is visible to every authenticated principal. P-090 probe pins the backend half.
  - If the backend ALSO omits a permission check (the hypothesis from F-032's `drift_class_summary: ungated_dashboard_route_no_permission_guard`), the dashboard exposes whole-catalog DQ health to any authenticated principal, INCLUDING a minimum-privilege user with zero `Permission`s and zero ownership associations.
  - **DOC-side silence amplifies the gap**: the live `documentation/docs/features/data-quality/dashboard.md` page (WebFetched 2026-05-22 status 200) makes NO statement about access control. An operator reading the docs to understand "who can see this dashboard" finds no answer. So the posture is BOTH undocumented AND unguarded by a regression test — the exact "double jeopardy" Rule 4 of the contract surfaces.

  **No test pins this** at any layer. A test asserting either "every authenticated user can render `<DataQuality>`" OR "users without `DATA_QUALITY_READ` are redirected" would pin the deliberate posture — TODAY a regression that adds an accidental guard, or a regression that opens the route to unauthenticated callers, ships green.

  **Test gap shape**: two paired tests asserting (a) the CURRENT bare-route posture: render `<App>` in a memory router with an authenticated minimal-privilege user; navigate to `/data-quality`; assert `<DataQuality>` renders fully (mounts the filter sidebar + content). PINS the read-collaborative posture for future regression detection. (b) The CONTRAST: render `<App>` at `/lookup-tables` with the same minimal-privilege user; assert the page does NOT render (the existing `WithPermissionsProvider` gates it). PINS the asymmetry so anyone who later wraps `/data-quality` in a permission gate must update BOTH tests — forcing the doc-side disclosure to ship alongside.
test_class: missing-security
criticality_rationale: |-
  Sidecars self-rate this MEDIUM. Bumped to HIGH per Rule 3 cross-pillar amplification (`pillars_affected: [P-04, P-09]` — len >= 2; the gap spans the Data Quality pillar's READ surface AND the Auth & Access pillar's permission-gating responsibility; the contract Rule 3 caps cross-pillar bumps at CRITICAL). Also: the SIDECAR-recorded `drift_class_summary: ungated_dashboard_route_no_permission_guard` is the PRIMARY drift class for F-032 (`feature-flows/detail/F-032.yaml:9`) — meaning the feature-flow surface itself flags this as the most architecturally-significant defect of the dashboard. Not CRITICAL because (a) no data-LOSS or credential-leak vector, (b) the posture is consistent with ODD's documented read-collaborative catalog stance (F-002 backend pillar invariant). HIGH stands.
