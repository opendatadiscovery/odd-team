    (c) `XXXXXX{last6}` → `isHidden = false` (mask change); (d) edge cases like a
    real token that happens to start with `******` (vanishingly unlikely but worth
    pinning) → `isHidden = true` (false positive case worth documenting). A regression
    on either side (backend mask format OR UI sniff logic) breaks the security contract
