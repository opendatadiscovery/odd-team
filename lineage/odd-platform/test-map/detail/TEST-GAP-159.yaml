- LDAPSecurityConfiguration@L51.md:security.known_security_gaps.[substring admin match]
behaviour: '**LDAP substring-collision admin escalation**: `containsIgnoreCase` (line
  96, imported from `OperationUtils` line 48) is a SUBSTRING match, not equality.
  `admin-groups: [''Admin'']` matches `cn=Administrators` AND `cn=NonAdminContractors`.
  `admin-groups: [''ops'']` matches `devops`/`oopsgroup`. Live docs only say ''A list
  granting admin permissions'' — no warning. Regression test pinning equality vs substring
  would catch any future widening of the matcher.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/LDAPSubstringCollisionAdminTest.java
  name: ldapAdminGroups_substringMatchesSiblingGroup_userPromotedToAdmin
evidence:
- 'LDAPSecurityConfiguration@L51.md says: ''An admin-groups config of [Admin] will
  match LDAP group cn=Administrators AND cn=NonAdminContractors (because both contain
  Admin as a substring). An operator who configures admin-groups: [ops] may inadvertently
  promote anyone in a group named devops or apps'''
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[3] HIGH
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[3]
proposed_action: 'Add unit test on `authoritiesMapper` (LDAPSecurityConfiguration.java:89-99):
  feed it (a) admin-groups=[''Admin''] + user-groups=[''cn=NonAdminContractors'']
  → currently returns ADMIN; (b) admin-groups=[''Admin''] + user-groups=[''cn=Administrators'']
  → ADMIN; (c) admin-groups=[''Administrators''] + user-groups=[''cn=Administrators'']
  → ADMIN. Locks the current substring-match behaviour. A maintainer who later widens
  ''admin'' → ''admins'' or tightens to equality must update the test deliberately.'
