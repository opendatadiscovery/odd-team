proposed_action: |-
  Add `WebhookSenderUnreachableURLBlocksSubscriberThreadRegressionPinTest`. Integration test using a Wiremock TCP listener that accepts connections but never responds:

  1. `send_unreachableURL_blocksDispatcherThreadFor75Seconds_pinsTimeoutUnsetVulnerability` —
     - Start a Wiremock TCP listener bound to 127.0.0.1:NNNN that accepts SYN but never responds to the HTTP request.
     - Configure `webhookSender` with the Wiremock URL.
     - Invoke `webhookSender.send(message)` on a separate thread.
     - Sleep 30 seconds.
     - Assert the thread is STILL alive AND has NOT thrown an exception.
     - PINS the current blocking behaviour.

  2. `send_unreachableURL_blocksFor75SecondsThenIOException_pinsEventualTimeout` —
     - Same setup; wait 90 seconds.
     - Assert the thread eventually throws NotificationSenderException with IOException cause.
     - PINS the OS-default-timeout ceiling.

  3. `send_unreachableSlackURL_sameBehaviourAsWebhook_pinsSharedHttpClientPathology` —
     - Same setup but using `SlackNotificationSender` + the same Wiremock URL.
     - Assert identical blocking behaviour (proves the issue is at the shared HttpClient layer).

  4. `send_connectTimeoutConfigured_failsImmediately_confirmsFixDirection` — (UPDATE once REFACTOR-NNN lands)
     - After REFACTOR-NNN: configure `notifications.receivers.webhook.connect-timeout-ms=2000`.
     - Assert `webhookSender.send(message)` throws NotificationSenderException within 2.5 seconds.
     - CONFIRMS the fix's effectiveness.

  Pair with REFACTOR-NNN (per-channel timeout config) and DOC-GAP-NNN (tuning guidance on live doc).

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP names the JDK-HttpClient-defaults-only behaviour for the HTTP-sender channels. The SMTP timeout finding (REFACTOR-498) is the email-channel sibling at the JavaMailSender level — same family-class, different transport. NO contradiction.
