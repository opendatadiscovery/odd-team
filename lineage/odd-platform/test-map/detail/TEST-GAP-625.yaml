proposed_action: |-
  Add `OwnerSearchVectorRefreshTest` with two test methods: (a) seed Owner with name "Alice" + data entity ownership; PUT /api/owners/{id} with `{name: "Alice2"}`; GET /api/search?query=Alice should NOT find the entity; GET /api/search?query=Alice2 should find it. Pins the update-path refresh. (b) seed Owner "Bob" + data entity ownership; DELETE /api/owners/{id}; GET /api/search?query=Bob should still match the entity (the current buggy behaviour) — pins the delete-path miss. Both tests pair to surface the asymmetry. Future fix that adds search-vector refresh to delete path will flip test (b) and trigger explicit re-authoring.
