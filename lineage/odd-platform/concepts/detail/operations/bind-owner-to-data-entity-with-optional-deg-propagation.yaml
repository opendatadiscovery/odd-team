name: Bind Owner to Data Entity (with optional DEG propagation)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
- P-08
- P-09
description: |-
  `POST /api/dataentities/{data_entity_id}/ownership` — gated by
  `DATA_ENTITY_OWNERSHIP_CREATE` per-data-entity Permission via
  SECURITY_RULES (SecurityConstants.java:215-217). `OwnershipServiceImpl.create`
  runs under `@ReactiveTransactional` + `@ActivityLog(event =
  OWNERSHIP_CREATED)`: `Mono.zip(ownerService.getOrCreate(owner_name),
  titleService.getOrCreate(title_name))` → ownership-row INSERT →
  optional propagation to children if data-entity is a DEG →
  search-index refresh → mark `data_entity_filled.OWNERS` → mapDto.
  **Side-effecting auto-create**: novel `owner_name` silently creates an
  Owner directory row; novel `title_name` silently creates a Title
  directory row. Both side-doors past their respective create-side
  permissions. **Activity-event emission CONFIRMED** for the
  ownership-binding (contrast OwnerController.createOwner which has NONE
  — the audit decision is per-write). DEG propagation (`propagate=true`
  on a Data Entity Group target) cascades the ownership row to every
  child via `createOrUpdate` with `onConflictOnConstraint(...).doUpdate().set(TITLE_ID,
  excluded)` — children with existing ownership rows for this Owner are
  RE-TITLED, NOT skipped. **STRENGTHENED batch 2026-05-19K** —
  OwnershipServiceImpl primary-source pinned at the SERVICE LAYER (lines
  47-74); the create flow's 6-step body is now line-cited. Two CROSS-BATCH
  corrections propagated from batch H + K:
    (a) Duplicate-key error surface — HTTP 400 USR003 (NOT 5xx as batch
        F sidecar claimed); the path is
        JooqReactiveOperations.onErrorMap → ExceptionUtils.translateDatabaseException
        → UniqueConstraintException("Ownership for this data entity and
        owner already exists") → ControllerAdvice.handleUniqueConstraint →
        HttpStatus.BAD_REQUEST.
    (b) Self-grant decoupling primary-source confirmation — owner_name is
        taken VERBATIM from the form, NOT inferred from the principal
        (no authIdentityProvider call; no SecurityContext read inside the
        method). Cross-namespace / cross-tenant grant is unconstrained at
        the service tier.
  NEW finding: the DEG-propagation cascade emits NO per-child activity
  events (deliberate audit-granularity choice per
  OwnershipServiceImpl.implicit_adrs.[2]). The delete flow does NOT
  refresh the search vector (FTS staleness on owner removal).
