- id: H-007
  hypothesis: |-
    When a collector ingests a data entity whose type name contains markup
    (e.g. a hostile "<script>alert(1)</script>" type string), the header
    renders it as inert text — the operator's browser does not execute it.
  derivation: |-
    Security/negative-space seed. type.name is collector-supplied freeform
    text rendered into the header; the feature-flow flagged a type-badge XSS
    facet under security as a worthwhile static-check candidate.
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      EntityTypeItem renders `stringFormatted(entityTypeName, '_', 'all')` as a
      JSX TEXT child of a styled component (EntityTypeItem.tsx:14-15) and as a
      `title` attribute — NOT via dangerouslySetInnerHTML. React escapes string
      children by default, so a hostile type.name renders as visible inert text
      rather than executing. `stringFormatted` is a pure string transform
      (lib/helpers — splits on '_', case-formats); it does not produce markup.
      The type value is therefore safe-by-render-path. (The class badge is
      enum-driven and not user-supplied, so it is safe by construction.)
    evidence:
      - sidecar: "(source_read_for_validation)"
        section: type-render
        cite: "EntityTypeItem.tsx:14-15"
        note: "type.name rendered as JSX text child + title attr, no dangerouslySetInnerHTML → React auto-escaping applies"
    confidence: MEDIUM
    confidence_note: |-
      Render-path reasoning is HIGH-confidence (React escapes text children).
      MEDIUM overall only because no test pins it and stringFormatted was not
      opened line-by-line this session; a focused render test would convert
      this to a verified regression guard.
    routes_to_finding: functional-test-demand
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    source_read_for_validation: true

