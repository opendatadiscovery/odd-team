      creating sessions and walking facets. Combined with the
      cross-owner posture and the bearer-token-shaped UUIDs, DISABLED
      mode hands the full catalog discovery surface to anonymous
      callers. DISABLED is documented as dev-only but operators who
      misuse it expose the catalog cardinality across the platform.
    expected: |-
