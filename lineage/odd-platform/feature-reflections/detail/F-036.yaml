- id: H-007
  hypothesis: "When a user calls GET /api/titles with a large size (e.g. size=100000), the platform protects itself with a server-side cap on how many rows it will return in one response."
  derivation: "Endpoint-shape: the `size` parameter promises page size; a senior PO/engineer expects a defensive maximum on a caller-controlled limit."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      `Integer size` flows verbatim to `paginate(...).limit(size)` → Postgres LIMIT.
      There is no Math.min(size, MAX), no @Max annotation, no controller-level
      validator, and the OpenAPI SizeParam declares no maximum. A caller can request
      size=100000 and the JVM materialises the entire filtered directory plus the
      count CTE in one response. The exact JVM/Postgres behaviour at extreme N is
      PROBE-NEEDED (H-012); the ABSENCE of a cap is statically confirmed.
    evidence:
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: bugs_limitations_corner_cases[1]
        cite: "TitleController.java:18-22 + ReactiveAbstractCRUDRepository.java:91 + components.yaml:4222-4229"
        note: "no Math.min, no @Max, no maximum keyword on the size param"
    operator_visible_failure: |
      For the Title directory specifically the blast radius is bounded by directory
      cardinality (typically tens of rows), so the practical risk is LOW for this
      feature in isolation. But the same uncapped-size pattern is replicated across
      every list-CRUD controller, so the class is a HIGH-aggregate resource-exhaustion
      vector. For Titles, the more user-visible consequence is the interaction with
      the UI's hardcoded size=30 (H-008), not exhaustion.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: "When a deployment has more than 30 titles, a user typing into the autocomplete can still find and select any title in the directory that matches what they typed."
  derivation: "Negative-space + UI-label: an autocomplete promises 'find the matching item'; the user does not know the fetch is capped at 30 server-side rows."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
