      IngestionDataEntitiesFilter.java:37-60 + application.yml:14-15.
      Severity: MEDIUM.
  - facet: plaintext-equality token compare — non-constant-time + at-rest plaintext (batch O)
    observed: |-
      IngestionDataEntitiesFilter.java:56 — `dto.tokenPojo().getValue()
      .equals(token)` uses `String.equals` (Java's standard non-constant-time
      compare). The compared TOKEN row stores the secret in plaintext
      (TokenGeneratorImpl.java:39,49 generates
      `RandomStringUtils.randomAlphanumeric(40)`; ReactiveTokenRepositoryImpl.java:30-39
