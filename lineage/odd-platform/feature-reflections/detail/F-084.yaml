# OAuth Provider Admin-Detection Matrix — product-owner reflection

## product_owner_narrative

ODD Platform lets an operator put their whole company behind their existing single-sign-on
instead of ODD's built-in login form: set `auth.type: OAUTH2` and register one or more
OAuth2/OIDC clients under `auth.oauth2.client.{name}.*` (per ODDOAuth2Properties:14 — the
config is a `Map<String, OAuth2Provider>`, one logical client per map key). The live docs
advertise seven providers — AWS Cognito, GitHub, Google, Azure AD, Okta, Keycloak, and a
generic Custom-OIDC option (per ODDOAuth2Properties sidecar docs excerpt, WebFetched
2026-05-19, status 200). For each client the operator gets the same-looking set of knobs to
decide *who is an administrator*: `admin-principals` (a list of named users), `admin-groups`
(a list of group/team names), `admin-attribute` (which claim to match principals against),
plus two membership gates — `allowed-domain` (Google Workspace) and `organization-name`
(GitHub org). The product promise an operator reads off that uniform schema is: "I configure
my admin policy once, the same way, and ODD enforces it consistently per provider."

A user interacts with this feature only at the moment of login. They click "Sign in with
{provider}", get redirected to their IdP, come back, and ODD's per-provider handler runs
exactly once to decide two things: accept-or-reject this login, and grant ADMIN-or-USER for
the session (per GoogleUserHandler sidecar understanding + GithubUserHandler sidecar
understanding). That single decision is terminal — there is no later re-check — and it then
feeds every authorization decision the user hits for the rest of the session, because the
ADMIN/USER `GrantedAuthority` produced here is what F-011's principal resolver and F-006's
RBAC layer read downstream (per GoogleUserHandler downstream_side_effects + the feature-flow
terminal_side_effect). The operator never sees a screen that reflects any of this: the SPA
only reads the resulting `identity.permissions` set via `WithPermissionsProvider`, so the
whole matrix is invisible at the UI (per feature-flow ui_incomplete_reason). This is an
operator-configuration surface with no operator-facing UI control — which is precisely why
the silent-no-op failures below are so dangerous: there is nothing on screen to contradict a
wrong mental model.

The working parts diverge sharply by provider, and that divergence is the whole subject of
this feature. There are TWO admin-detection vocabularies in the handler set (per feature-flow
facet `provider_quirks_strategy_two_admin_detection_vocabularies`). The **base-class
vocabulary** (`AbstractOIDCUserHandler`, used by Cognito / Azure / Custom-OIDC / ODD_IAM)
reads `admin-groups` from a configurable groups claim, defaults `admin-attribute` to the
username attribute, and evaluates BOTH `admin-principals` AND `admin-groups` (either grants
ADMIN) — verified at AbstractOIDCUserHandler.java:33-55 (read under the Rule-8 exception). The
**Google vocabulary** does NOT extend the base class, ignores `admin-groups` entirely, and
defaults `admin-attribute` to the literal `email` claim (GoogleUserHandler.java:31, 56-64).
The **GitHub vocabulary** also does not extend the base class, makes two outbound calls to a
hard-coded `api.github.com` to read org+team membership, and lets `admin-principals` fire
BEFORE — and bypass — the `organization-name` gate (GithubUserHandler.java:39, 54-67). So the
same five YAML keys mean materially different things depending on which provider string the
operator typed.

This feature sits squarely inside Pillar P-09 (Security & Access Control) and feeds two
sibling features in both directions. It feeds F-011 (Principal-to-Owner Resolution): the
handler's output token carries the registration-id that becomes the `provider` partition key
for owner-scoping (per GithubUserHandler coupling note + feature-flow note). It feeds F-006
(RBAC): the ADMIN authority granted here is the input to every later `@PreAuthorize` /
policy evaluation. The drift facets in this feature are therefore not cosmetic — a
silent-no-op on `admin-groups` means an intended administrator is silently a least-privilege
USER for the life of every session, and an `admin-principals` org-bypass means an
out-of-org user is silently a full ADMIN.

The edge cases a product owner would flag in a demo are exactly the ones with no UI to catch
them: an operator who copies the Cognito `admin-groups` block to a Google client and sees it
bind cleanly (then wonders why no one is admin); an operator on GitHub Enterprise Server whose
every login dies on DNS errors to `api.github.com` with no doc explaining why; an Okta or
Keycloak operator who configures admin-groups off the docs' seven-provider list and gets zero
admin path because Okta/Keycloak fall through the generic Custom-OIDC handler (per feature-flow
facets + the live-docs excerpt naming seven providers against a five-value `Provider` enum).
Every one of these is a real, already-triaged finding — and none of them has a single test
guarding it (per feature-flow test_matrix: unit/integration/performance/security all GAP;
Grep of `odd-platform-api/src/test` for any `*UserHandler*` / `OAuthSecurityConfiguration` /
`ODDOAuth2Properties` returns ZERO; the two auth integration tests IT-009/IT-010 cover only
LOGIN_FORM authentication-boundary and LDAP RBAC, explicitly NOT OAUTH2).

## hypotheses

- id: H-001
  hypothesis: |-
    When an operator sets `auth.oauth2.client.{c}.admin-principals: [alice@corp.com]` on a
    Google client and `alice@corp.com` logs in, alice is granted ADMIN for the session.
  derivation: |-
    `admin-principals` is a uniform OAuth2Provider knob; Google's admin path reads it
    (GoogleUserHandler.java:56-64) defaulting the lookup claim to `email`.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      GoogleUserHandler reads `provider.getAdminAttribute()` defaulting to the literal
      `email` claim (GOOGLE_EMAIL, line 31), looks up that claim on the OIDC id-token, and
      grants ADMIN when its value is contained (case-insensitively, full-string) in
      `adminPrincipals`. For `alice@corp.com` whose Google id-token `email` claim is
      `alice@corp.com`, the match succeeds and `GrantedAuthorityExtractor.getAuthorities(true)`
      produces the ADMIN authority. This is the one provider knob Google honours as the
      operator expects.
    evidence:
      - sidecar: odd-platform__java__auth__handler__GoogleUserHandler.md
        section: concepts.invariants[4] + bugs_limitations_corner_cases
        cite: "GoogleUserHandler.java:31, 56-64"
        note: "admin-attribute defaults to email; containsIgnoreCase(adminPrincipals, email) → ADMIN"
    severity: ""
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

