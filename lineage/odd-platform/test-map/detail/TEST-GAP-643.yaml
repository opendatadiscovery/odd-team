evidence:
  - "RolesList.md says (tests_coverage_semantic.uncovered_behaviours.[9]): 'Create role with attacker-chosen policies — no test asserts that after a soft-delete of the seeded Administrator row (e.g. via direct DB UPDATE), this form can re-create a role named Administrator with any policy list (the F-006 drift_class role_create_administrator_name_asymmetry_mirror end-to-end probe; pairs with batch-E security.known_security_gaps[0])'"
  - "RolesList.md says (concepts.invariants.[5]): 'Predefined-role name protection is UI-only. These are CASE-SENSITIVE string matches against the literal name Administrator / User — a role named administrator (lowercase, see batch-N drift_class role_service_predefined_name_case_sensitivity_mismatch) would NOT be matched by isAdministrator and WOULD show Edit/Delete buttons.'"
  - "RolesList.md says (docs_link_semantic.doc_drift_findings.[4]): 'No documentation of soft-delete behaviour on Roles. Per batch-N invariants[3] + F-006 drift_class role_create_administrator_name_asymmetry_mirror, the partial unique index role_name_unique ON role(name) WHERE deleted_at IS NULL permits re-creation of soft-deleted role names — combined with the create-path absence of UserProviderRole.values() check, an operator who soft-deletes the seeded Administrator row (e.g. via direct DB UPDATE) can use this exact UI surface (RolesList → Create role) to re-create a role named Administrator with attacker-chosen Policies.'"
  - "RolesList.md says (downstream_side_effects): 'No client-side validation for the predefined-name asymmetry — batch-E sidecar bugs_limitations_corner_cases[0] surfaces that RoleServiceImpl.create has NO UserProviderRole.values() check, unlike .update and .delete. The UI provides NO protection either: a user typing Administrator or User into the new-role name field will succeed if the seeded rows have been soft-deleted via direct SQL.'"
