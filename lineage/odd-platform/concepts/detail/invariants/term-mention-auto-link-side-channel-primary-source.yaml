mitigations_unimplemented:
- |-
  Add a service-tier permission check in
  `TermServiceImpl.handleDataEntityDescriptionTerms` (and the symmetric
  `handleDatasetFieldDescriptionTerms`): for any term-link row about to be
  created, consult `permissionService.hasPermission(DATA_ENTITY_ADD_TERM)`
  for the caller. Rejection drops the parsed mentions silently OR returns
  a 403 — design decision pending.
- |-
  Add a docs section to `/features/data-glossary/business-glossary`
  describing the side-channel: name it as a deliberate feature (operator
  reads "description edits auto-create term links if you mention them
  via [[ns:term]] — this is a deliberate convenience") OR as a bug
  (operator reads "currently a user with DESCRIPTION_UPDATE can create
  term links without holding ADD_TERM; we plan to require ADD_TERM in
  vX.Y").
- |-
  Document the unhandled-mention staging on the same doc page — operators
  authoring descriptions need to know that `[[ns:NEW_TERM]]` mentions for
  terms that don't yet exist are NOT silently dropped, but staged and
  later materialised.
- |-
  Add a regression test:
    (a) Authenticate as a user with DESCRIPTION_UPDATE but NOT ADD_TERM;
    (b) Call PUT /api/dataentities/{id}/description with body containing
        `[[finance:Customer]]`;
    (c) Assert the response is 200 AND a data_entity_to_term row exists
        with is_description_link=TRUE (pins the current side-channel
        behaviour explicitly) OR assert the response is 403 / the row
        does NOT exist (under the proposed fix).
notes: |-
  NEW invariant captured in batch 2026-05-19K — PRIMARY-SOURCE PIN of
  REFACTOR-227. The side-channel is now 3-way triangulated across the
  stack:
    - UI tier: TERM_PATTERN regex at lib/constants.ts:177 (DataEntityDescription
      batch J)
    - Controller tier: upsertDataEntityInternalDescription endpoint and
      auth gate (upsertDataEntityInternalDescription batch G)
    - Service tier: handleDataEntityDescriptionTerms + findTermsInDescription
      + auto-resolution staging (TermServiceImpl batch K)
  The first two are mirror UI/HTTP surfaces of the same architectural
  pattern; the third is the LOAD-BEARING enabler — the regex compile
  site at TermServiceImpl.java:67 and the INSERT site at
  updateDataEntityDescriptionTermsState are where the rows actually
  get created.

  The UI vs backend regex asymmetry (per the existing Term-mention
  Syntax concept) is also surfaced by this batch's
  bugs_limitations_corner_cases.[11] — the backend regex is STRICTER
  in that empty groups produce empty matches that short-circuit, but
  the absence of escaping for nested brackets is a latent issue.

  Cross-cutting connections:
    - Pairs with the "Authorization path-mismatch — SECURITY_RULES /term
      vs OpenAPI /terms" invariant — REFACTOR-217 (controller-tier)
      and REFACTOR-227 (service-tier auto-link) are INDEPENDENT
      bypass paths
    - Pairs with the "TermServiceImpl service-tier zero permission
      checks" invariant — the service-tier-zero-checks architecture
      enables this side-channel
    - Pairs with the "Term-mention Syntax [[Namespace:TermName]]" entity
      concept — that entity captures the syntax; this invariant
      captures the security implication
    - Companion of the "Permission-bypass via Owner auto-create
      (side-door write path)" invariant — same architectural class
      (service-tier auto-create-on-missing pattern bypasses
      controller-tier permission gates)

  Four DOC-NNN candidates flow from this invariant:
    (a) Document the side-channel on the business-glossary doc page
    (b) Document the unhandled-mention staging on the same page
    (c) Decide the auth-contract (deliberate convenience vs bug);
        ship a fix or an explicit acceptance ADR
    (d) Add a regression test that pins the current behaviour
