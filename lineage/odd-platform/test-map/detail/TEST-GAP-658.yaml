  Add to `AppToolbar.test.tsx`: (a) `renders_under_disabled_mode_with_admin_username_literal` — provide a redux store with the DISABLED-mode dummyOwner shape (identity.username='admin', owner=null); mount AppToolbar; assert the username label shows exactly 'admin'; pin this as the regression observable for REFACTOR-185 UX surface. (b) `logout_button_under_disabled_mode_navigates_to_404_endpoint` — assert that clicking Logout under DISABLED-mode setup hits `/logout` which lacks a handler; this is a RED test today documenting the broken UX; the fix is a small one (either DisabledAuthSecurityConfiguration adds `.logout(...)` OR AppToolbar hides Logout under DISABLED). (c) `scroll_threshold_10px_toggles_elevation_state` — mount AppToolbar inside a tall container; programmatically scroll to 5px → elevation 0; scroll to 15px → elevation flipped (the threshold-10 pin); scroll back to 5px → elevation 0.
