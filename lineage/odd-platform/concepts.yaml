        - "`@ReactiveTransactional` on IngestionServiceImpl.ingest ensures per-batch atomicity"
        - "Path matcher per filter subclass — IngestionDataEntitiesFilter ↔ /ingestion/entities, IngestionDataSourceFilter ↔ /ingestion/datasources — discoverable by file name"
      weaknesses:
        - "**Default-off ingestion auth (HIGH, LSN-001-class)** — bundled deployment ships `/ingestion/entities` reachable without credentials. Operator-trap: the property `auth.ingestion.filter.enabled` is NOT surfaced in any live doc (configuration-and-deployment/data-ingestion → 404; data-ingestion → 404). 2-sidecar primary-source confirmed (batch B + batch F)."
        - "**Datasource scoping is payload-driven, not token-driven, at the controller (HIGH under default-off)** — controller passes the entire `Mono<DataEntityList>` to the service unchanged; service resolves the datasource BY ODDRN FROM THE PAYLOAD. When filter is OFF, the controller blindly trusts the payload's `data_source_oddrn`. (postDataEntityList.md:bugs_limitations_corner_cases.[2])"
        - "**Plaintext-equality `.equals()` not constant-time (MEDIUM)** — `IngestionDataEntitiesFilter.java:56` uses `String.equals(...)`, not `MessageDigest.isEqual(...)`. (IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[1])"
        - "**Body-buffered-before-auth (MEDIUM)** — filter reads full request body to extract `dataSourceOddrn` BEFORE validating token. Attacker submitting 20MB payloads with invalid tokens forces the platform to buffer+parse before rejecting — heap-pressure DoS. (IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[4])"
        - "**Unknown `data_source_oddrn` returns 5xx, not 404 (MEDIUM)** — no `@ExceptionHandler(NotFoundException)` returning 404 on the reactive ingestion path. (postDataEntityList.md:bugs_limitations_corner_cases.[4])"
        - "**`X-API-Key` (S2S) vs `Authorization: Bearer` (this filter) doc-drift (MEDIUM)** — operator copy-paste-from-docs-using-X-API-Key fails when only `auth.ingestion.filter.enabled=true` is set. Live S2S doc curl example uses `X-API-Key` (the OTHER filter). See cross-cutting invariant 'Doc-vs-code spelling/format mismatch'. (postDataEntityList.md:docs_link_semantic.doc_drift_findings.[1])"
        - "**No canonical doc page for the endpoint (MEDIUM)** — `configuration-and-deployment/data-ingestion` returns 404; `data-ingestion` returns 404. The entire `/ingestion/*` surface is under-documented except for the S2S sub-page's brief mention. (postDataEntityList.md:docs_link_semantic.doc_drift_findings.[0])"
      cross_file_inconsistencies:
        - "Live `/configuration-and-deployment/enable-security/authentication/s2s` page conflates the two auth filters — the page documents `auth.s2s.enabled` + `auth.s2s.token` + `X-API-Key` header but does NOT mention `auth.ingestion.filter.enabled` + `Authorization: Bearer` + `IngestionDataEntitiesFilter`. Operators reading only the S2S page miss the path-scoped filter entirely."
        - "OpenAPI status-code drift: spec declares `201 Created` (odd_api.yaml:23-25); controller returns `200 OK`; tests lock in 200. 2-sidecar status-code drift with OwnerController.createOwner — see cross-cutting invariant 'OpenAPI 200-vs-201 status-code drift'."
      contributing_files:
        - "postDataEntityList.md"
        - "IngestionDataEntitiesFilter@L20.md"
        - "regenerateCollectorToken.md"
      evidence:
        - "postDataEntityList.md:security.known_security_gaps.[0-5]"
        - "postDataEntityList.md:bugs_limitations_corner_cases.[0-8]"
        - "IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[0-4]"
        - "regenerateCollectorToken.md:concepts.invariants.[3] (plaintext-equality)"
    performance_aggregate:
      overall: MEDIUM
      hot_paths:
        - "Every `POST /ingestion/entities` incurs: full-body reactive parse (up to 20MB), Jackson deserialise to DataEntityList, empty-check, service-call to IngestionServiceImpl.ingest. When filter active, body parsed TWICE (filter + controller)"
        - "Per-ingestion DB writes: datasource SELECT-FOR-UPDATE + bulk dedup-and-upsert (bulkUpdate + bulkCreate inside the transaction) + processor chain + OTLP metric export"
        - "Synchronous response — HTTP connection held for the duration of the pipeline; bursty collectors with slow downstream processors cause cascading timeouts"
      throughput_shape:
        verdict: BATCH_FRIENDLY
        detail: "Per-request can carry hundreds-to-thousands of DataEntity items (one collector-tick batched). No streaming or chunking — whole list buffered to 20MB cap"
      scaling_shape:
        verdict: HORIZONTALLY_SCALABLE
        detail: "Stateless controller. Per-datasource row-level lock (`getIdByOddrnForUpdate`) serialises concurrent ingestions for SAME datasource; cross-datasource scales linearly"
      strengths:
        - "Reactive non-blocking signature"
        - "Per-datasource lock isolation — different collectors / datasources scale linearly"
        - "Idempotency-by-ODDRN at the data layer (upsert on existing rows)"
      weaknesses:
        - "**Synchronous-blocking-on-pipeline (LOW)** — no async-accept mode; HTTP connection held for full pipeline duration. (postDataEntityList.md:performance.known_performance_gaps.[0])"
        - "**Duplicate body parse when filter active (MEDIUM)** — filter parses body for dataSourceOddrn, controller re-parses for DataEntityList. (IngestionDataEntitiesFilter@L20.md:performance.known_performance_gaps.[0])"
        - "**OTLP metric export inside per-request flow (MEDIUM)** — slow/unhealthy OTLP backend slows every ingestion request. No timeout/circuit-breaker. (postDataEntityList.md:performance.known_performance_gaps.[2])"
        - "**No token cache** — every ingestion request re-fetches datasource (and possibly collector) from DB. (IngestionDataEntitiesFilter@L20.md:performance.known_performance_gaps.[2])"
      cross_file_inconsistencies: []
      contributing_files:
        - "postDataEntityList.md"
        - "IngestionDataEntitiesFilter@L20.md"
      evidence:
