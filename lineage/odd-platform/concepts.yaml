    description: "Token-based authentication filter for `/ingestion/**` endpoints — independent of the UI auth surface. `IngestionDataEntitiesFilter` is `@ConditionalOnProperty(\"auth.ingestion.filter.enabled\", havingValue=true)` and matches `POST /ingestion/entities` only. Sibling `/ingestion/*` paths (including `/ingestion/alert/alertmanager` and `/ingestion/datasources`) are NOT covered by THIS filter — `/ingestion/datasources` is covered by the unconditional sibling `IngestionDataSourceFilter`; `/ingestion/alert/alertmanager` is covered by NO filter and has no `@PreAuthorize`. main-concepts.md `Terms & Aliases` lists 'Ingestion authentication filter' as canonical alias. Default-off per `application.yml:48` (`auth.ingestion.filter.enabled: false`) — bundled deployment ships with `/ingestion/entities` unauthenticated."
    axes_present:
      - controllers
      - openapi_tags
      - config_prefixes
    nodes:
      - "odd-platform java IngestionDataEntitiesFilter config-key-consumer:auth.ingestion.filter.enabled@L20"
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertManagerController"
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityController"
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController"
