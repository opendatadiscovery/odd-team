# Search Result Class-Tab Filter — product-owner reflection

## product_owner_narrative

The Search Result Class-Tab Filter is the horizontal strip of tabs an operator
sees directly above their Catalog search results: **All · My Objects · Datasets ·
Transformers · Data Consumers · Data Inputs · Quality Tests · Groups ·
Relationships**. It is the single most-clicked control on the Catalog page —
operators reach for these tabs far more than the seven-facet sidebar to its
left, because "show me only the datasets" is the most common refinement a data
practitioner makes. The feature belongs to Pillar P-01 Data Discovery, whose
one-line capability is "find existing data entities in the catalog" (per
system-mission.md P-01); the class tabs are the second, faster filtering axis
that sits alongside free-text search and the facet sidebar.

A user interacts with it by clicking a tab. There is no form, no submit, no
dialog — one click. Clicking "Datasets" narrows the list to dataset-class
entities; clicking "My Objects" narrows it to entities the logged-in user owns;
clicking "All" returns the unscoped catalog. Each tab carries a count badge (its
"hint") so the operator can see the per-class cardinality before committing to a
tab. Mechanically, every tab click dispatches a single Redux action —
`changeDataEntitySearchFacet({facetName: 'entityClasses', ...})` (per
Results.tsx:83-97) — onto the SAME `entityClasses` facet the sidebar's class
filtering would use, and that flows through the F-017 backbone: the 1500ms
facet-debouncer in Search.tsx, then `PUT /api/search/{searchId}/facets`, then
the SearchServiceImpl tsquery aggregator, then a re-fetch of the result list
(per F-017.yaml chain hops 1-4).

The working part that distinguishes this surface from the sidebar is its
**value-typing trick**. The class tabs carry numeric backend class IDs
(`totals[SET].id` etc.), but the All and My Objects tabs carry *string
sentinels* — the literal strings `'all'` and `'my'` (per SearchResultsTabs.tsx:26-27).
When a string sentinel hits the reducer, two things happen (per
dataEntitySearch.slice.ts:173-174, 187-188): the `'my'` sentinel flips the
separate `myObjects: true` boolean (the owner-scoping switch), and BOTH string
sentinels are filtered OUT of the `entityClasses` facet array by a
`typeof facetOptionId === 'number'` guard — so the strings never reach the
backend's numeric `entityClasses` field. This is the load-bearing fact that
turns what looks like a type-confusion bug (mixing strings and numbers in one
payload) into a deliberate, correct normalisation. A class tab, by contrast,
writes its numeric id into `entityClasses` and leaves `myObjects: false`.

The feature integrates tightly with the rest of P-01. It shares the entire
backend session machinery with F-017 (the 7-facet sidebar) and F-024 (Term
Search) — the same `search_facets` server-side session row, the same broken
1500ms debouncer (F-017 batch-ZL), the same read-collaborative posture where the
result list spans all owners unless My Objects is toggled (system-mission.md
line 267). It feeds the Type sidebar facet: per the live doc, selecting a class
tab "unlocks the Type sidebar facet, which is hidden until a specific class is
chosen" — the tabs and the sidebar are coupled, not independent.

In a demo a product owner would highlight the edge cases that bite: the tab
strip is **not** navigation even though it looks like a tab bar — browser Back
does not restore the previous tab; the strip has nine English-only labels that
never localise even though the rest of the platform's tables are fully
translated; the Relationships tab silently disappears if a deployment's backend
does not return a RELATIONSHIP class count; and on a deep-linked / reloaded
session whose saved class has a count of zero, no tab is highlighted at all
(findIndex returns -1). None of these are catastrophic, but each is a small
sharp edge on the most-used control of the most-used page.

