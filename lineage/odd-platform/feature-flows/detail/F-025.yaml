  notes: |-
    hop-0 (UI route module) PRIMARY-SOURCE resolved this batch via the
    batch-ZH dataModelling route sidecar. The route layer corroborates the
    existing F-025 read-collaborative-posture facets but also surfaces TWO
    novel UI-layer findings that extend the existing `service_tier_no_preauthorize_controller_perimeter_sole_defence`:

