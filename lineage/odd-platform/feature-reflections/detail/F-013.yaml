        section: bugs_limitations_corner_cases[1]
        cite: "DataEntityServiceImpl.java:287-305 (no guard) vs :257-258 (createMetadata guards)"
        note: "asymmetric existence check between create and upsert siblings"
    operator_visible_failure: |
      A typo'd or stale data-entity ID in an API integration returns 200, so the integration's error handling never fires; the operator believes the metadata landed on the entity when no entity (and no row) exists. Combined with H-001 the two missing-validation cases are indistinguishable from a real success at the wire.
    severity: MEDIUM
    confidence: HIGH
