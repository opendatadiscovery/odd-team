proposed_action: |-
  Add `routesConvention.test.ts`:

  (a) `allRouteModulesDeclareBasePath_orHaveSingleFeatureSurface`: read all `odd-platform-ui/src/routes/*.ts` files; for each module that exposes more than one URL builder OR has any string substring `/.+/`, assert it declares `const BASE_PATH = '/...'`. Currently fails on `dataQualityRoutes.ts`; documents the outlier explicitly.

  (b) `dataQualityRoute_isSingleFeatureSurface_pinsExceptionRationale`: assert dataQualityRoutes.ts exposes EXACTLY ONE builder (`dataQualityPath`) AND that builder takes ZERO arguments AND returns a literal-shape string — pins the "single-feature surface" rationale that justifies the convention exception today. Breaks deliberately if a second URL or sub-path is added (forcing the maintainer to choose: align with the BASE_PATH convention OR justify the new exception).

  Add a comment at dataQualityRoutes.ts:1 documenting: 'NO BASE_PATH constant — exception justified by single-feature surface (no sub-paths). If a sub-path under /data-quality/* is added (e.g. /data-quality/failures), refactor to declare `const BASE_PATH = "/data-quality"` aligning with the 8 sibling modules under routes/. See TEST-GAP-1002.'
