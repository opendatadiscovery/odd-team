behaviour: |-
  **HIGH — Live doc OVERPROMISES the email channel's payload (doc-drift; F-009 doc-drift facet at the email-channel sink).** The live `/features/active-platform-features/notifications` page (WebFetched 2026-05-20 status 200) enumerates 4 outbound-carried items in email:
  1. Entity name and its data source/namespace
  2. **Attached owners**
  3. **Downstream entities (within configurable depth, default 1 level)**
  4. Clickable links back to the platform UI (using `odd.platform-base-url`)

  Bullets 1 and 4 are honoured by `EmailNotificationSender.getEmailContent` (lines 64-78 populate 9 model fields covering entity id / name / dataSourceName / namespaceName / type / link / alertType / alertDescription / eventAtTime). **Bullets 2 and 3 are NOT honoured** by the code:
  - **Owners missing**: `AlertedDataEntity.owners` (AlertNotificationMessage.java:36) is a `Set<OwnershipPair>` populated by the translator — but the email template model (`EmailNotificationSender.getEmailContent` lines 64-78) does NOT include an `owners` entry. The `templates/email.ftlh:1-46` template has NO `<#list owners as o>` block, no `${owners}` reference.
  - **Downstream missing**: `AlertNotificationMessage.downstream` (List<AlertedDataEntity> at line 30) is computed by the translator using the `notifications.message.downstream-entities-depth` knob — but the email template model does NOT include `downstream`. The template has NO `<#list downstream as d>` block.

  **The doc-drift is operator-relevant**: a reader of the live doc reasonably assumes that an email alert carries owners (for attribution) and downstream lineage (for impact analysis). The Slack channel DOES carry both (via `SlackMessageGenerator`). The webhook channel carries both (raw POJO serialisation). The email channel does NOT — alone. Operators running multi-channel notifications cannot rely on cross-channel parity.

  **Why HIGH** (compounds operator trust):
  1. Operators reading the live doc to design their incident-response workflow ("when an email arrives, the owners are listed, contact them; downstream entities are listed, validate them") build runbooks predicated on payload contents that do not exist.
  2. The asymmetry is silent: emails arrive looking complete (subject + body) but are missing the per-feature-doc-promised fields.
  3. The fix is either (a) extend the email template to include the missing fields, or (b) correct the live doc. Either way, the current state is operator-facing trust erosion.

  **Compares to TEST-GAP-461** (PII pass-through — every channel gets full payload regardless of channel security posture): TEST-GAP-461 catalogues the PRESENCE of fields in non-email channels; this gap catalogues the ABSENCE of fields in the email channel that the doc promises. Both are load-bearing.

  **Test gap shape**: contract-test asserting the rendered email body includes the 4 doc-promised payload bullets. PINS the current absence; either fails on missing fields (when the template is extended) OR pins the doc-drift (until then).
