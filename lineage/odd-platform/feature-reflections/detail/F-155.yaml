  derivation: "Pillar mission anchor (P-09 gates every mutation) + endpoint-shape — the tab is route-gated and the 'Link query' button is permission-gated; the question is whether the BACKEND enforces, not just the UI hide."
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |
      Two independent gates exist, and the UI-side ones are UI-only hides. (a) The ROUTE is wrapped in
