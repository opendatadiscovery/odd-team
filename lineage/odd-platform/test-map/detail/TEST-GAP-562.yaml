proposed_action: |-
  Testcontainers test. (a) Seed: Administrator-equivalent policy P1; Role R1 bound to P1 via role_to_policy. (b) Direct UPDATE: SET policy.deleted_at = NOW() ON P1 (bypassing the service defence). (c) Call getDto(R1.id). Assert: the response includes P1 with its full statements (the soft-deleted policy is still aggregated). (d) Mirror with getByName(R1.name) → same result. (e) Mirror with listDto(page=1, size=10, query=null) → R1's policy_relations includes P1. (f) Test comment: 'PINS the current buggy behaviour. Future fix MUST add AND policy.deleted_at IS NULL to the three JOIN sites — this test FLIPS to expect empty policy_relations.' Cross-reference TEST-GAP-345 (Policy mirror).
