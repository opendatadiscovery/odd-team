behaviour: |-
  **LOW — `useIntegrationRouteParams()` at managementRoutes.ts:43-44 performs an unsafe type assertion (`as IntegrationRouteParams`) that PROMISES a non-undefined `integrationId: string` to every caller.** If the hook is called outside a route that has `:integrationId` in its path, `useParams()` returns `{}` at runtime and `integrationId` is `undefined`, but the type system reports it as `string`. A consumer that does `const { integrationId } = useIntegrationRouteParams(); fetchIntegration(integrationId);` (no null-check) silently sends `undefined` to the backend.

  **Same shape as `useDataEntityRouteParams` (TEST-GAP-422 / TEST-GAP-849 / TEST-GAP-849) and `useTermsRouteParams` (TEST-GAP-1000 in this batch)** — a project-wide pattern of `useParams<T>() as T` casts that strip React Router's `Partial<>` return shape and lie to callers about non-undefined-ness.

  **Current safety condition** (sidecar verified): the single in-repo caller IntegrationHeader.tsx IS inside an `:integrationId` route so the assertion holds today. The defect is FUTURE-FRAGILE — the second caller from a future feature that mis-places the hook gets `undefined`-as-`string`.

  **No test pins this** — adding a guard (`if (!integrationId) throw new Error(...)` or `?? Number.NaN` propagation) ships green; introducing a caller from outside `:integrationId`-bearing route ships green and emits `/api/integrations/undefined` requests to the backend.
test_class: missing-edge-case
criticality_rationale: |-
