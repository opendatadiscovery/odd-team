notes: |-
  NEW invariant captured in batch 2026-05-25-ZD. The IdentityController
  sidecar describes itself as the "17th sidecar" in the 16-sidecar
  REFACTOR-185 triangulation; this concept is the catalog anchor for
  that claim.

  Mitigation candidates (additive on top of the master invariant's):

    (1) Replace `switchIfEmpty(Mono.just(dummyOwner))` with
        `switchIfEmpty(Mono.error(new AuthenticationException(...)))`
        and let the controller return 401. Under DISABLED, the SPA's
        App.tsx onMount fetchIdentity().catch(() => {}) silently
        ignores the 401; the user lands on a blank SPA. This is
        the fail-fast path; trade-off is that the SPA needs an
        unauthenticated-landing UX (login form / disabled banner).

    (2) Restrict dummyOwner to a curated minimum-permission set
        rather than `Permission.values()`. Under DISABLED, the
        SPA mounts, the toolbar shows "admin", but the
        WithPermissionsProvider gates correctly because the
        permission list is sparse. The dev iteration ergonomic
        survives without the maximum-permissive blast radius.

    (3) Emit `Cache-Control: no-store` + audit log on every
        whoami invocation; route the unused `ServerWebExchange`
        through `exchange.getRequest().getRemoteAddress()` into
        an audit-trail INSERT.

    (4) Doc-side: admonition on every relevant authentication
        and authorization page naming the under-DISABLED admin
        fallback. The disabled-authentication page is the
        canonical home; the authentication landing page should
        cross-link; the authorization page should warn that
        the UI permission framework is INERT under DISABLED.

  Cross-references:
    - LSN-001 + LSN-002: case-law precedents showing
      operator-discipline-as-mitigation is consistently insufficient.
      The IDENTITY-LAYER facet is the AUTHORITATIVE positive
      identity-claim that compounds the bypass.
    - The defence-in-depth gap (LOGIN_FORM dummy-vs-admin shape
      collision) is the single most important regression-target
      to harden via a security-class integration test.
