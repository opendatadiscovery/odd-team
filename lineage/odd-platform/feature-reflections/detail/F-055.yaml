- id: H-007
  hypothesis: "When a user opens the Lineage tab without ever touching the depth control (fresh navigation, no ?d= in the URL), the canvas loads at the platform's sensible default depth as the API reference documents ('Unset returns the platform's default depth')."
  derivation: "Doc-claim seed — the live API reference states unset depth returns a platform default; response-shape + UI-default seed for the fresh-open case."
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      Two truths split by caller. (a) FROM THE UI: there is a default, but it is d=1, hardcoded in
      the UI, not the platform — defaultLineageQuery.d=1 (constants.ts:77) means useQueryParams
      returns d:1 for a URL with no query string, so the UI ALWAYS supplies lineage_depth=1
      (LineageGraph.md:invariants + implicit_adrs "UI defaults d=1 silent default-depth contract").
      The fresh canvas therefore loads a 1-hop neighbourhood — an artificially shallow first
      impression of the graph, NOT a documented platform default. (b) FROM A DIRECT API CALLER:
      there is NO default at all — omitting lineage_depth sends a null Integer that autoboxes to
      the service's primitive int and throws NullPointerException -> HTTP 500 before the body runs
      (getDataEntityDownstreamLineage.md:bugs[0] + LineageServiceImpl.md:bugs null-NPE). So the doc
      claim "Unset returns the platform's default depth" is true for neither path: the UI masks it
      with d=1, the API crashes.
