observed_vs_expected:
  facets:
    - drift_class: owner_association_predicate_string_equality_disabled_no_normalisation_four_misconfiguration_scenarios
      description: |-
        The Overview.tsx:25-27 predicate
        `isShowOwnerAssociation = Boolean(appInfo?.authType && appInfo.authType !== 'DISABLED')`
        controls whether F-142 renders AT ALL. Four operator-misconfiguration
        scenarios produce surprising outcomes (per F-003 batch ZA Overview
        sidecar bugs_limitations_corner_cases[0] severity HIGH):
          (1) AUTH_TYPE='' (empty) → Boolean('' && ...) = false → form HIDDEN
              even though the operator MEANT to enable auth; new users can't
              request association
          (2) AUTH_TYPE='OUATH2' (typo) → '!== DISABLED' = true → form SHOWS
              on a deployment with NO SecurityWebFilterChain wired
          (3) AUTH_TYPE='disabled' (lowercase) → '!== DISABLED' = true →
              form SHOWS even though operator intended to disable auth;
              user submits a request and the request-creation endpoint
              succeeds without any backend gate
          (4) AUTH_TYPE=' DISABLED' (whitespace) → '!== DISABLED' = true →
              same as (3)
        No console.warn, no fallback render, no enum validation at the
        SPA layer. The two failure layers (no @Value default at
        AppInfoController.java:18 + no enum validation at Overview.tsx:26)
        COMPOUND. Carried into F-142 because the predicate is the entry
        gate for the whole workflow.
      evidence:
        - "odd-platform-ui/src/components/Overview/Overview.tsx:25-27"
        - "F-003 batch ZA Overview sidecar bugs_limitations_corner_cases[0]"
      severity: MEDIUM
      ui_unverified: false
      cross_reference: F-001 + F-003 (same predicate gates Popular column)
    - drift_class: permission_provider_non_blocking_pattern_zh_ui_layer_associate_immediately_branch_uncontrolled
      description: |-
        Overview.tsx:53-58 wraps OwnerAssociation in
        `WithPermissionsProvider({allowedPermissions: [Permission.DIRECT_OWNER_SYNC]})`.
        Per F-023 batch ZI note (ZH systemic finding — WithPermissionsProvider
        all three render branches unconditionally render the child) this
        wrapper IS NON-BLOCKING — it INJECTS PERMISSION CONTEXT but does
        not gate the render. Inside the form, OwnerAssociationForm.tsx:26
        reads `const { isAllowedTo: associateImmediately } = usePermissions()`
        AND OwnerAssociationForm.tsx:121-127 — if APPROVED is returned AND
        associateImmediately is TRUE, the form dispatches setProfileOwnerName
        immediately. The "approved" branch of the workflow is therefore
        permission-gated on the CLIENT-SIDE — a user without DIRECT_OWNER_SYNC
        but with a forged appInfo could submit a request; whether the
        backend would short-circuit-approve depends on backend permission
        check (NOT yet verified at this writing). Two surfaces of permission
        — the wrapper (non-blocking, injects context) and the form's
        usePermissions call — share the SAME permission name but differ
        in semantics.
      evidence:
        - "odd-platform-ui/src/components/Overview/Overview.tsx:53-58 (WithPermissionsProvider wrapper)"
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:26"
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:121-127"
        - "F-023 batch ZI ZH-systemic-finding cross-reference"
      severity: MEDIUM
      ui_unverified: true
      ui_unverified_reason: |-
        WithPermissionsProvider semantics confirmed by F-023 cross-link;
        the BACKEND permission check on the request-creation endpoint
        has not been walked here (OwnerAssociationRequestController not
        yet enriched). The whole-chain semantics (frontend permission
        injection + backend permission gate) need joint validation.
    - drift_class: free_solo_autocomplete_creates_owner_name_with_no_validation_no_charset_filter_no_length_cap
      description: |-
        OwnerAssociationForm.tsx:190 — the Autocomplete uses `freeSolo`,
        permitting any string the user types as a valid submission. No
        max length validation, no charset filter (Unicode emoji, control
        characters, leading/trailing whitespace all accepted), no
        normalisation (case-sensitivity — same shape as F-018 tag
        case-sensitivity drift). When the user submits a freshly-typed
        name, the backend creates a brand-new Owner row (mediated via
        the request-creation endpoint). Result: catalog Owner directory
        accretes typos + variants over time; subsequent users searching
        for "John Smith" miss "john smith" or "John  Smith" (double space).
      evidence:
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:190 (freeSolo)"
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:78-91 (getFilterOptions allows free-typed name as final option)"
      severity: MEDIUM
      ui_unverified: false
      cross_reference: F-018 (tag name case-sensitivity + no validation — same shape)
    - drift_class: declined_message_dismissable_via_x_button_no_persistence_user_redismiss_per_session
      description: |-
        OwnerAssociation.tsx:28, 61-82 — when status=DECLINED the rejection
        message is shown above a fresh form. The user can dismiss the
        rejection notice via an X button (line 72-76); state is local
        (`useState(true)` at line 28). Refreshing the page re-renders the
        notice (no per-user/per-decline persistence). Result: the
        operator who saw a declined message and dismissed it cannot
        "remember" that act between sessions; on every login the
        message reappears. Conversely, a user who has SEEN the message
        and acted (e.g. resubmitted a different name) still gets the
        notice on their next visit until the request-creation endpoint
        actually changes the status. No "decline-reason" surface — the
        message is a generic "association request rejected" translation
        string with no per-decline context. Cross-link to F-011 silent-
        empty: the user knows they were declined but does not know why,
        whom to escalate to, or how to re-request.
      evidence:
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociation.tsx:28 (showRejectMsg local state)"
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociation.tsx:61-82 (declined branch + dismiss)"
      severity: LOW
      ui_unverified: false
    - drift_class: identity_username_used_as_search_seed_no_explicit_consent_implies_user_knew
      description: |-
        OwnerAssociationForm.tsx:131-142 — on form mount, the component
        dispatches `searchOwners({query: identity?.username, ...})` and
        surfaces matches as a "Maybe it's you" hint section above the
        autocomplete (line 203-222). The user's USERNAME is used as a
        DB query without explicit "I want to find matches like me"
        consent. In deployments where username is `firstname.lastname`,
        the user sees their probable Owner immediately; in deployments
        where username is opaque (e.g. an OAuth subject UUID), the
        suggestion section is empty / noise. The UX-implicit assumption
        ("operator knows usernames map to person-names") is a soft drift
        — not malicious, but undocumented.
      evidence:
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:131-142 (mount-time seed search)"
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:203-222 ('Maybe it's you' rendered)"
      severity: LOW
      ui_unverified: false
    - drift_class: direct_owner_sync_branch_silently_skips_review_pipeline_on_approval
      description: |-
        OwnerAssociationForm.tsx:121-129 — when `associateImmediately =
        isAllowedTo(DIRECT_OWNER_SYNC)` is TRUE AND the backend returns
        `status === OwnerAssociationRequestStatus.APPROVED`, the form
        immediately dispatches `setProfileOwnerName(ownerName)` AND
        `fetchIdentity()`. There is no review notification, no audit
        affordance, no "you have used direct-owner-sync" indication.
        A user with DIRECT_OWNER_SYNC permission can self-associate
        with ANY owner name (subject to backend duplicate check) without
        admin review. No second-line UI confirmation ("are you sure you
        want to associate with `prod-admin`?"); the form auto-binds
        and the user is dropped into the OwnerEntitiesList (branch 4).
        Cross-link to F-011: the user_owner_mapping write here is
        ungated at the workflow layer.
      evidence:
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:121-129"
      severity: MEDIUM
      ui_unverified: true
      ui_unverified_reason: |-
        Backend gate semantics on POST /api/owner/association under
        DIRECT_OWNER_SYNC permission not yet verified (controller
        sidecar pending).
    - drift_class: association_lifecycle_no_revoke_no_re_request_after_approved_or_declined
      description: |-
        OwnerAssociation.tsx has no branch for "approved-but-user-wants-
        to-change" or "declined-and-user-wants-to-retry-different-name".
        Branch 4 (approved) goes straight to OwnerEntitiesList — there
        is no "Disassociate" button, no "Re-request" affordance, no
        "switch Owner" link. Branch 3 (declined) shows the form again
        BUT the previous request's submitted name is not pre-populated;
        the user starts from scratch. No history affordance ("you've
        previously requested association with X, declined on 2026-05-23").
        Lifecycle is one-shot per outcome.
      evidence:
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociation.tsx:32-89 (no revoke / re-request branches)"
      severity: LOW
      ui_unverified: false
    - drift_class: debounce_5_hundred_ms_on_open_autocomplete_first_keystroke_can_race_initial_seed_fetch
      description: |-
        OwnerAssociationForm.tsx:46-63 (`useDebouncedCallback(..., 500)`)
        wraps the search fetch. On autocomplete OPEN (line 114-119), the
        useEffect fires `handleOwnersSearch()` — but that itself respects
        the debounce; first keystroke within 500ms RESCHEDULES rather
        than firing immediately. Meanwhile, the mount-time seed fetch
        (line 131-142) runs WITHOUT the debounce — fires immediately
        for `identity?.username`. Two parallel fetches racing: the
        immediate seed fetch and the deferred user-input fetch. Result
        in the dropdown: the user sees the "Maybe it's you" suggestions
        FIRST (from the seed search), then 500ms later the user-input
        results replace them (or merge?). The merge behaviour is not
        defensively coded; if both promises resolve in unexpected order,
        the dropdown jitters.
      evidence:
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:46-63 (debounce)"
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:131-142 (seed without debounce)"
        - "odd-platform-ui/src/components/Overview/OwnerAssociation/OwnerAssociationForm/OwnerAssociationForm.tsx:114-119 (open useEffect)"
      severity: LOW
      ui_unverified: true
      ui_unverified_reason: |-
        Race-condition behaviour is timing-dependent; needs probe with
        artificial latency injection.
