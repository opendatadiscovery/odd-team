- id: H-008
  hypothesis: |-
    The Relationships tab always appears in the strip, regardless of backend
    version or feature configuration.
  derivation: |-
    SearchResultsTabs.tsx:59-62 sets the Relationships tab value to
    `totals[RELATIONSHIP].id`. If the backend omits the RELATIONSHIP key the
    value is undefined. Negative-space seed.
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      The tab is ALWAYS rendered (the array at SearchResultsTabs.tsx:24-63 is
      unconditional — all nine entries are always pushed). But when the backend
      `totals` response does not include a RELATIONSHIP key (older backend, or
      a deployment with Relationships disabled per P-02), the tab renders with
      `hint: 0` (the `|| 0` fallback at :60) and `value: undefined` (no `?.id`
      fallback). Clicking it then calls onSearchClassChange(undefined) →
      `tabValue ? ... : null` (Results.tsx:85) → facetOptionId resolves to null
      → the dispatch sends facetOptionId: null on the entityClasses facet, which
      the reducer treats as no class constraint (null is not a number; not
      'my'), effectively behaving like the All tab but with the Relationships
      tab visually selected. So the tab is present-but-inert rather than
      missing — the F-148 flow's facet description ("silently missing
      otherwise") is imprecise: it is present-and-dead, not absent.
    evidence:
      - sidecar: "(source read)"
        section: SearchResultsTabs.tsx
        cite: "SearchResultsTabs.tsx:58-62"
        note: "Relationships value = totals[RELATIONSHIP]?.id; undefined if key absent"
      - sidecar: "(source read)"
        section: Results.tsx
        cite: "Results.tsx:84-86"
        note: "undefined tabValue → facetOptionId null → behaves as no-class"
    operator_visible_failure: |-
      On a backend that does not return a RELATIONSHIP count, the operator sees
      a Relationships tab with a 0 badge that, when clicked, silently shows the
      full catalog (behaves like All) while appearing selected as
      Relationships. The operator believes they are viewing relationships and
      sees everything. Severity LOW (rare config; misleading rather than
      data-losing).
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    note: |-
      Refines the F-148 flow's facet 6. The functional test demand pins the
      present-and-inert behaviour (render with empty totals → assert
      Relationships tab present with hint 0).

- id: H-009
  hypothesis: |-
    When a backend class id of 0 is returned for any class, the corresponding
    tab is selectable and distinguishable from the "All" tab.
  derivation: |-
    SearchResultsTabs.tsx:69 uses `searchClass ? findIndex : 0` (truthy check)
    and Results.tsx:84 uses `tabValue ? ... : null`. A numeric class id of 0 is
    falsy → collides with the no-class / All semantics. Negative-space seed.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The truthiness collision is real in the code: in SearchResultsTabs.tsx:69
      `searchClass ? tabs.findIndex(...) : 0` forces selectedTab to index 0 (the
      All tab) whenever searchClass is 0; in Results.tsx:84
      `tabValue ? get(...) : null` treats a class id of 0 as no-class. So IF the
      backend ever allocates DataEntityClassNameEnum id 0, that class's tab
      would be unselectable (always falls back to All) and clicking it would
      clear the class filter. Whether this is reachable depends entirely on the
      backend's DataEntityClassNameEnum id allocation — Filters.tsx:53 uses
      `searchClass > 0` which implies ids start at 1, but this is not verified
      against the enum/migration. Requires inspecting the actual class-id
      allocation in the running system / the DataEntityClassNameEnum source.
    evidence:
      - sidecar: "(source read)"
        section: SearchResultsTabs.tsx
        cite: "SearchResultsTabs.tsx:68-70"
        note: "selectedTab = searchClass ? findIndex : 0 — class id 0 collides with All"
      - sidecar: "(source read)"
        section: Results.tsx
        cite: "Results.tsx:84"
        note: "tabValue ? ... : null — class id 0 treated as no-class"
    operator_visible_failure: |-
      IF a class id 0 exists, that class's tab cannot be selected (always shows
      All as active) and clicking it clears the class filter — the class is
      effectively unreachable via the tab strip. If ids start at 1 (as
      Filters.tsx:53 implies) the bug is unreachable dead-defensive-code.
      Severity LOW pending the probe.
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-148-2
    routes_to_finding: validation-gap
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: "probe PENDING-F-148-2"
    note: |-
      Matches the F-148 flow's facet 4. The probe pins whether class id 0 is
      reachable; until then this is a latent collision, not a confirmed bug.

- id: H-010
  hypothesis: |-
    On reload / deep-link of a session whose saved class tab is set, the correct
    tab is highlighted as active when the page restores.
  derivation: |-
    SearchResultsTabs.tsx:68-70 computes selectedTab via
    `tabs.findIndex(tab => tab.value === searchClass)`. If no tab value matches
    searchClass, findIndex returns -1. Response-shape + negative-space seed.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      When searchClass is set (truthy) the selected index is
      `tabs.findIndex(tab => tab.value === searchClass)` (SearchResultsTabs.tsx:69).
      If the restored searchClass is a numeric class id whose tab value is
      currently `undefined` (e.g. the backend totals on restore did not include
      that class, so the tab's `value: totals[CLASS]?.id` is undefined), or if
      tabs has not yet populated (the tabs-building effect at :24-64 runs on a
      separate render cycle from the selectedTab effect at :68-70), findIndex
      returns -1. AppTabs receives selectedTab=-1, so NO tab is highlighted —
      the strip shows results scoped to a class with no visual indication which
      class is active. Because the tabs array is rebuilt on every `totals`
      change (no memoization) and selectedTab depends on `[tabs, searchClass]`,
      there is a window on restore where the strip shows no active tab.
    evidence:
      - sidecar: "(source read)"
        section: SearchResultsTabs.tsx
        cite: "SearchResultsTabs.tsx:68-70"
        note: "findIndex returns -1 when no tab.value === searchClass → no tab highlighted"
      - sidecar: "(source read)"
        section: SearchResultsTabs.tsx
        cite: "SearchResultsTabs.tsx:22-64"
        note: "tabs rebuilt on every totals change; runs on a different render than the selectedTab effect"
    operator_visible_failure: |-
      A deep-linked or reloaded session that had a class tab active can restore
      with the result list class-scoped but NO tab highlighted, so the operator
      cannot tell which class they are viewing or which tab to click to widen.
      Transient on the common path (resolves once totals + searchClass settle)
      but persistent if the saved class's totals key is absent. Severity LOW-to-
      MEDIUM (orientation loss, no data impact).
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    note: |-
      NEW drift class proposed
      (selected_tab_findindex_returns_minus_one...) — not in the F-148 flow's
      8 facets. Net-new finding from this reflection's primary-source read.

