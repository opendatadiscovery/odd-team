evidence:
  - |-
    Activity.md:understanding — 'Activity is the top-level page
    component for the global Activity Feed surface at /activity.
    It is a pure layout shell: a MainContainer wrapping a 3/9
    split ContentContainer Grid whose left column hosts <Filters/>
    and whose right column hosts <ActivityResults/>.'
  - |-
    Activity.md:concepts.invariants — 'All filter state and
    result state lives in URL query params, not in component
    state.'
  - |-
    Activity.md:implicit_adrs — two load-bearing decisions:
    (1) All filter and result state lives in URL query params,
    not in component state or context; (2) Sub-views are encoded
    as `type` query parameter rather than URL path segments
    (diverging from the Alerts pattern).
  - |-
    Activity.md:downstream_side_effects — three side-effect
    classes (page-render + REFERENCE external-call to children).
