notes: |-
  This invariant is the BATCH T strengthening artefact for the master
  read-collaborative pattern. Rather than re-write the 480-line master file
  (which carries cumulative cross-batch history and would risk YAML fragility
  if a large edit drops a colon or backtick into a scalar), this batch T
  extension records the 28-sidecar pattern at a separate detail file. The
  rebuild_indexes.py rolls both into the index together.

  The master entry (read-collaborative-cross-owner-enumeration.yaml) remains
  the canonical home for the multi-batch narrative; this batch T extension is
  the focused controller-class layer evidence consolidation across four
  distinct feature subsystems.

