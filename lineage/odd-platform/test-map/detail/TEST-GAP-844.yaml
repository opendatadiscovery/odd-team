behaviour: |-
  **MEDIUM — UI-layer defense-in-depth absent at the Lineage dispatcher. The natural chokepoint for an owner-scope check is unguarded.** Lineage.tsx is a 28-line pure dispatcher that decides between DEG-branch (F-016) and non-DEG-branch (F-005) based on `entityClasses` containing `ENTITY_GROUP`. Both branches inherit the read-collaborative posture from their respective backend chains (F-005 facet `UI uses anchor-set-undefended endpoints`; F-016 facet `co-membership leakage`).

  **The dispatcher is the natural defense-in-depth chokepoint** — a single short-circuit at this layer would prevent EITHER subtree from mounting if the user lacks an Owner relationship to the entity. The check is:
  ```
  if (!callerHasAnyRelation(dataEntityId)) return <RestrictedPlaceholder />
  ```
  This is the CHEAPEST UI-side mitigation for REFACTOR-203 + F-016 co-membership leakage. **It is absent.**

  **Why this isn't HIGH or CRITICAL**:
  - The backend gap is the LOAD-BEARING fix (REFACTOR-203 — recursive CTE has no anchor-owner filter)
  - UI-side defense-in-depth is a complement, not a substitute
  - Per system-mission.md line 267 (read-collaborative posture), the catalog-wide visibility is a DELIBERATE design choice (ADR-CANDIDATE-003)
  - The Lineage view specifically inheriting that posture is consistent with the architectural stance

  **Why it's MEDIUM (not LOW)**:
  - Lineage is the SINGLE chokepoint at which a UI-layer owner-scope check would be cheapest to add — it sits above both F-005 and F-016 subtrees
  - Adding the check here is a 5-line change vs adding it at both subtree entrypoints (DEG-side + HierarchyLineage-side)
  - The absence is structural; a future maintainer cannot easily retrofit it without first surfacing this gap
  - **The shell amplifies the exposure by making the routing trivial** — the user clicks the tab, the shell does the rest, the lineage graph reveals every neighbour entity regardless of Owner

  **Test gap shape**: A `Lineage.test.tsx` that pins the contract:
  - **PINS-THE-CONTRACT mode** (today): mount with user lacking Owner relation to the entity, assert the shell still routes to the subtree (no short-circuit). Documents the current read-collaborative posture.
  - **PINS-THE-FIX mode** (after defense-in-depth added): same setup, assert `<RestrictedPlaceholder />` renders instead of the subtree. The test flips assertion direction.

  The maintainer's policy call (ADR-CANDIDATE-003) determines which mode the test ships in; either way the test is the canonical pin for the dispatcher's owner-scope posture.
