- id: H-010
  hypothesis: |
    When a user opens a page that renders several owner-scoped surfaces at once (catalog
    home with My Objects + My Alerts + Activity), the platform resolves their identity
    efficiently — it does not re-run the same identity DB query several times for one
    page load.
  derivation: |
    Pillar-mission (this is the per-request chokepoint for 15 callsites) +
    negative-space — a senior engineer expects a per-request identity to be resolved
    once and reused, not recomputed per consumer.
  seed_source: negative-space + response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      AuthIdentityProviderImpl is deliberately stateless with no caching and no
      per-request memoisation (implicit_adrs[3]); every fetchAssociatedOwner /
      getCurrentUser call issues a fresh ReactiveSecurityContextHolder.getContext() and
      (for owner resolution) a fresh `SELECT ... FROM user_owner_mapping JOIN owner`
      (AuthIdentityProviderImpl.java:50-53 + ReactiveUserOwnerMappingRepositoryImpl.java:77-85).
      A single catalog-home page-load triggers 3-5 sequential identical queries because
      the controller, the permission extractor, and the activity-logging path each
      resolve independently (per the F-011 amplification_factor + facet
      single_chokepoint_no_caching). The query is small and indexed, so correctness is
      preserved, but the duplicate work is real and unbounded as more owner-scoped
      surfaces are added to a page.
    evidence:
      - sidecar: odd-platform__java__service__service__AuthIdentityProviderImpl.md
        section: bugs_limitations_corner_cases[4] + performance.known_performance_gaps[0] + implicit_adrs[3]
        cite: "AuthIdentityProviderImpl.java:50-53 + ReactiveUserOwnerMappingRepositoryImpl.java:77-85"
        note: "No per-request memoisation; 3-5 identical principal-lookup queries per page-load."
    operator_visible_failure: |
      (a) Under heavy UI activity or many concurrent users, the identity-lookup query
          fires at a multiple of the request rate (3-5x per page-load), consuming
          connection-pool capacity that scales linearly with how many owner-scoped
          widgets a page renders — a latent throughput drag with no architectural guard.
      (b) The cost is invisible to operators (no metric, no counter) so it cannot be
          observed or alarmed before it bites at scale.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      NO test exists. Functional/performance demand: a test counting DB round-trips per
      page-load (assert N≤2 post-memoisation, OR a documented assertion pinning the
      no-cache N for trend tracking). This is the test_matrix.performance cell.

