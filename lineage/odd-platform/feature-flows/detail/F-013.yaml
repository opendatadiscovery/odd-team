      If no row exists for the pair, the query matches zero rows, the
      Mono collapses to empty, the FTS-vector refresh and the response
      mapper are short-circuited, and the controller returns 200 OK with
      an empty body. The UI's redux thunk
      (`odd-platform-ui/src/redux/thunks/metadata.thunks.ts:51-54`)
      hardcodes a "Metadata successfully updated." success toast on any
      non-error response — the user is told the write succeeded when no
      row was touched. SAME pattern as upsertDataEntityInternalDescription
      (batch G; F-004).
    expected: |-
      Either a true UPSERT (`ON CONFLICT DO UPDATE`) so the missing pair
      becomes a successful INSERT, OR `switchIfEmpty(NotFoundException)`
      raising 404 to surface the missing pair to the caller.
    drift_class: silent_200_on_missing_pair
    provenance: |-
      STATIC — primary-source in batch L
      upsertDataEntityMetadataFieldValue sidecar bugs_limitations_corner_cases[0]
      + ReactiveMetadataFieldValueRepositoryImpl.java:95-104 +
      DataEntityServiceImpl.java:287-305 + metadata.thunks.ts:51-54.
      Severity: MEDIUM.
  - facet: silent 200 on missing data entity — no existence check
    observed: |-
      DataEntityServiceImpl.upsertMetadataFieldValue (lines 287-305) does
      NOT call `reactiveDataEntityRepository.get(dataEntityId).switchIfEmpty(...)`.
      Contrast createMetadata at lines 257-258 which DOES check entity
      existence. A PUT against a non-existent dataEntityId proceeds to the
      metadata-field lookup (which can succeed — fields are global, not
      entity-scoped), then to the UPDATE which matches zero rows (no value
      row for the non-existent entity since FK to data_entity(id) is intact
      but the row never existed), then to the silent-200 empty-body path.
    expected: |-
      Pre-check `reactiveDataEntityRepository.get(dataEntityId).switchIfEmpty(NotFoundException)`
      matching the createMetadata sibling.
    drift_class: silent_200_on_missing_data_entity
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[1] + DataEntityServiceImpl.java:287-305
      (no entity-existence check) vs :257-258 (createMetadata does
      check). Severity: MEDIUM.
  - facet: no type validation against MetadataTypeEnum
    observed: |-
      formData.getValue() is a raw String written verbatim into the
      `text` column at ReactiveMetadataFieldValueRepositoryImpl.java:95-104
      regardless of metadata_field.type. MetadataTypeEnum.java:3-12 declares
      8 types (INTEGER / FLOAT / BOOLEAN / DATETIME / ARRAY / JSON / STRING /
      UNKNOWN); none is enforced at write time. A user can write
      "not a number" to an INTEGER-typed field, "true" to a JSON-typed
      field, "hello" to a DATETIME-typed field. Downstream readers must
      defend against arbitrary string content.
    expected: |-
      Type-coerce or validate formData.getValue() against
      metadataFieldPojo.getType() inside upsertMetadataFieldValue —
      reject with 400 on mismatch, OR coerce (parse INTEGER as Long,
      DATETIME as Instant, etc.) and reject on parse failure.
    drift_class: no_type_validation_against_metadata_field_type
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[2] + DataEntityServiceImpl.java:292-295
      (only `value` extracted) + ReactiveMetadataFieldValueRepositoryImpl.java:95-104
      (no type-inspect on SET) + V0_0_1__init.sql:179 (`value text`).
      Severity: MEDIUM.
  - facet: EXTERNAL-origin fields are writable — operator can overwrite collector-ingested values
    observed: |-
      The upsert path does not check `MetadataFieldPojo.getOrigin()`.
      EXTERNAL fields are populated by collectors during ingestion
      (MetadataFieldServiceImpl.java:62-71 ingestMetadataFields creates
      fields with origin=EXTERNAL); a user with
      `DATA_ENTITY_CUSTOM_METADATA_UPDATE` can overwrite the
      collector-ingested value, and the override persists until the next
      ingestion cycle replaces it. The user-facing distinction between
      "discovered" (EXTERNAL) and "curated" (INTERNAL) metadata is
      therefore not enforced at write time. The catalog can show
      fabricated "source-system" values for fields with origin=EXTERNAL
      and (combined with the forensic-silence facet) no record of the
      fabrication.
    expected: |-
      Either reject EXTERNAL-origin writes with 400, OR require explicit
      `?force=true` parameter to overwrite EXTERNAL fields, OR document
      the overwrite-then-cycle-replace behaviour on the data-discovery
      docs page.
    drift_class: external_origin_writable_overwrites_ingestion
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[3] + DataEntityServiceImpl.java:287-305
      (no origin check) + MetadataFieldServiceImpl.java:62-71 (EXTERNAL
      field creation). Severity: MEDIUM.
  - facet: forensic silence — no @ActivityLog despite CUSTOM_METADATA_UPDATED enum
    observed: |-
      upsertMetadataFieldValue (DataEntityServiceImpl.java:287-305) lacks
      the @ActivityLog(event = CUSTOM_METADATA_UPDATED) annotation despite
      the CUSTOM_METADATA_UPDATED enum value existing in
      ActivityEventTypeDto.java:18. Contrast upsertBusinessName at line
      336 with @ActivityLog(BUSINESS_NAME_UPDATED), upsertTags at line
      358 with @ActivityLog(TAG_ASSIGNMENT_UPDATED). The createMetadata
      (line 245) and deleteMetadata (line 307) siblings are ALSO
      un-annotated — the entire CUSTOM_METADATA_CREATED /
      CUSTOM_METADATA_UPDATED / CUSTOM_METADATA_DELETED family
      (ActivityEventTypeDto.java:17-19) is reserved-but-never-fired.
      Auditors querying GET /api/activity find no record of metadata
      writes.
    expected: |-
      Add `@ActivityLog(event = CUSTOM_METADATA_UPDATED)` to upsertMetadataFieldValue
      and similar annotations to createMetadata and deleteMetadata, with
      a CustomMetadataActivityHandler capturing BEFORE/AFTER state.
    drift_class: forensic_silence_via_missing_activity_log
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[5] + DataEntityServiceImpl.java:287-305
      (no @ActivityLog) + ActivityEventTypeDto.java:17-19 (three reserved
      enums) + sibling @ActivityLog annotations at :336, :358. Cross-pillar
      pattern with F-012 (DEG membership forensic silence). Severity: MEDIUM.
  - facet: active column dropped to NULL on every UPDATE
    observed: |-
      ReactiveMetadataFieldValueRepositoryImpl.java:97-98 writes
      `.set(METADATA_FIELD_VALUE.ACTIVE, pojo.getActive())`, but
      DataEntityServiceImpl.java:292-295 constructs the pojo without
      calling `setActive(...)`. The jOOQ-generated
      MetadataFieldValuePojo.getActive() returns boxed Boolean null when
      unset. The DB column is `boolean DEFAULT TRUE` (V0_0_1__init.sql:180),
      but DEFAULTs apply on INSERT only — an UPDATE that sets the column
      writes the explicit NULL, dropping a previously-TRUE row to NULL.
      Every edit silently drops the active flag. If any platform code
      filters `WHERE metadata_field_value.active = TRUE` (rather than
      `IS DISTINCT FROM FALSE`), edited rows silently disappear from
      those queries.
    expected: |-
      Either: (a) construct the pojo at lines 292-295 with
      `.setActive(true)` to preserve the post-edit state, OR (b) change
      the UPDATE query to OMIT the `.set(ACTIVE, ...)` clause (so the
      column is unchanged), OR (c) audit downstream `active` consumers
      to confirm NULL-tolerance.
    drift_class: active_column_dropped_to_null_on_update
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[4] +
      ReactiveMetadataFieldValueRepositoryImpl.java:97-98 (SET clause) +
      DataEntityServiceImpl.java:292-295 (no setActive call) +
      V0_0_1__init.sql:180 (`active boolean DEFAULT TRUE`). Severity: MEDIUM.
  - facet: OpenAPI `origin` field silently dropped
    observed: |-
      MetadataFieldValueUpdateFormData (components.yaml:2144-2152) declares
      an optional `origin: MetadataFieldOrigin` field. The impl at
      DataEntityServiceImpl.java:292-295 reads only `formData.getValue()`
      — `origin` is silently dropped. A client posting
      `{value: "...", origin: "INTERNAL"}` is told via the spec that
      origin is meaningful here, but the platform discards it.
    expected: |-
      Either: (a) remove `origin` from the schema (it's never used at
      this endpoint), OR (b) honour it by validating it matches the
      field's declared origin and rejecting mismatches.
    drift_class: openapi_origin_field_silently_dropped
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[6] + components.yaml:2144-2152 (spec
      includes origin) vs DataEntityServiceImpl.java:292-295 (impl reads
      only value). Severity: LOW.
  - facet: OpenAPI operationId "upsert" while impl is pure UPDATE
    observed: |-
      openapi.yaml:1219-1220 declares the operationId / summary as "upsert"
      ("Upsert DataEntity's metadata field value") but the implementation
      is pure UPDATE with silent no-op on missing pair. A user reading the
      OpenAPI summary would expect POST-or-PUT-semantics upsert; the
      actual semantics are "replace if exists, silently succeed if missing".
    expected: |-
      Either: (a) implement true upsert semantics (`INSERT ... ON CONFLICT
      DO UPDATE`), OR (b) rename the operationId / summary to "update" so
      the spec matches the implementation.
    drift_class: spec_says_upsert_impl_does_update
    provenance: |-
      STATIC — primary-source in batch L sidecar
      docs_link_semantic.doc_drift_findings[2] +
      ReactiveMetadataFieldValueRepositoryImpl.java:95-104 (pure UPDATE)
      + openapi.yaml:1219-1220 ("upsert" operationId). Severity: LOW.
  - facet: DISABLED-mode anonymous metadata writes
    observed: |-
      Under auth.type=DISABLED, the DisabledAuthSecurityConfiguration
      `.anyExchange().permitAll()` chain bypasses SECURITY_RULES; the
      `DATA_ENTITY_CUSTOM_METADATA_UPDATE` permission gate at
      SecurityConstants.java:204-207 is NEVER consulted. Anonymous traffic
      can rewrite any metadata field value, including overwriting
      EXTERNAL-origin (collector-ingested) values, with no audit trail
      (per forensic-silence facet).
    expected: |-
      DISABLED documented as truly dev-only. The pattern repeats across
      batches A/B/C/E/F/G/K.
    drift_class: disabled_mode_bypass
    provenance: |-
      STATIC — cross-ref batches A/B/C/E/F/G/K DISABLED-bypass pattern +
      SecurityConstants.java:204-207 (rules not consulted under DISABLED).
      Severity: MEDIUM on network-reachable DISABLED; LOW if honestly dev-only.
  - facet: unbounded value length at every layer
    observed: |-
      The `text` column is unbounded (V0_0_1__init.sql:179); the OpenAPI
      spec has no `maxLength` constraint (components.yaml:2147-2148).
      A 100 MiB value is technically accepted, then FTS-indexed (cost
      grows with value size), then served back to every consumer of the
      entity. The WebFlux request-size limit (`spring.codec.max-in-memory-size`,
      default 256 KiB) provides an indirect cap, but operators tuning
      that value up to accept large attachments would also accept large
      metadata values.
    expected: |-
      Add `maxLength: 65536` (or similar) to components.yaml:2147-2148
      and a CHECK constraint on the column for defence-in-depth.
    drift_class: unbounded_value_length_at_every_layer
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[7] + V0_0_1__init.sql:179 +
      components.yaml:2147-2148. Severity: LOW.
  - facet: metadata_field is globally unscoped — no per-tenant / per-team / per-owner namespacing
    observed: |-
      V0_0_1__init.sql:166-173 declares the `metadata_field` table with
      `(name, type)` as the natural key — no `tenant_id`, no `owner_id`,
      no `namespace_id`. MetadataFieldServiceImpl.getOrCreateMetadataFields
      (lines 43-58) matches existing fields by `MetadataKey(name, type)`
      (MetadataKey.java:6-15) regardless of caller; two teams creating
      `cost_centre:STRING` collapse to one row. The `metadata_field`
      table is GLOBAL across the platform. There is no platform-side
      mechanism to namespace metadata fields per team / project / owner.
    expected: |-
      Either: (a) namespace metadata_field by Namespace or Owner, OR (b)
      document the global-namespace behaviour on the data-discovery
      metadata docs page.
    drift_class: metadata_field_globally_unscoped
    provenance: |-
      STATIC — primary-source in batch L sidecar implicit_adrs[0] +
      V0_0_1__init.sql:166-173 (no scoping column) +
      MetadataFieldServiceImpl.java:43-58 (matches by name+type globally).
      Severity: LOW (architectural; not a defect, but operationally
      worth documenting).
