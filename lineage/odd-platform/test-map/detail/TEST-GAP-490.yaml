  Integration test. (a) Snapshot `activity` table row count N for entity X. (b) POST /api/dataentities/X/data_entity_group with body {data_entity_group_id: Y_id} (success). (c) Query `SELECT count(*) FROM activity WHERE data_entity_id = X_id`; assert STILL N (no row added). (d) DELETE /api/dataentities/X/data_entity_group/Y_id (success). (e) Re-query the activity count; assert STILL N. (f) Test comment 'LOCKS the forensic-silence contract on DEG membership writes as of 2026-05-19. When REFACTOR-NNN wires DATA_ENTITY_RELATION_UPDATED, this test FLIPS to assert N+2.' The test pins the intentional absence — the test FLIPS direction when the intent changes, surfacing the change loud during code review.
