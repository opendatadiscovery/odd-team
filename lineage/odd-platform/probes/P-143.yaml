expected_outcome: |
  Stress questions: SlackMessageProviderClient (`:36-44`) builds an
  AsyncLoadingCache with `expireAfterWrite(1, MINUTES)` + `maximumSize(1)` for
  the Slack channel list. Three behaviours to verify:

  (1) **Stale-cache window** — when the bot is freshly invited to a new
      channel (or freshly removed from one), how long until the autocomplete
      reflects the change? The hypothesis from code reading is "up to 60
      seconds — the cache entry must expire before the next call reloads".
      There is no event-driven invalidation hook (EventApiController processes
      member_joined_channel events but does NOT touch SlackMessageProviderClient.cache).

  (2) **Cache-refresh blocking** — does the first call after eviction block
      on the in-flight load, or does it serve the just-evicted stale value
      during refresh? Caffeine's AsyncLoadingCache.get returns a
      CompletableFuture that completes when the load completes — i.e., the
      caller waits. The probe verifies this by injecting a 2-second delay on
      the Slack-side `conversations.list` mock and timing the first
      post-eviction get.

  (3) **Multi-replica cache duplication** — each platform process has its
      own Caffeine cache. N replicas = N copies of the channel map = N Slack
      `conversations.list` calls per cache TTL. The probe arranges a 2-replica
      compose-up and asserts the Slack mock receives 2 separate
      `conversations.list` calls within a single 60-second window.

  Hypothesis: all three claims hold per the code reading. If (1) fails (the
  freshly-invited channel appears in <60s), the cache is invalidated somewhere
  the code-walk did not find. If (2) fails (the call doesn't block), the
  Caffeine async-loading semantics are different from the documented behaviour.
  If (3) fails (replicas share state), there's a hidden cache backplane that
  the code-walk missed.
