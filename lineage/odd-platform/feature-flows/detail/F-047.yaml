  (description / business-name / tags / enum values / glossary-term
  links) on the dataset Structure tab, parent-data-entity-scoped via
  DatasetFieldResourceExtractor, with FOUR distinct correctness defects
  (replace-all tags, BULK-REPLACE enums named CREATE, description-link
  DELETE quirk, XSS verbatim storage) and TWO HIGH-severity
  SecurityConstants wiring bugs misrouting permission gates
