test_files_proposed:
  - path: "odd-platform-ui/src/components/DataModelling/Relationships/__tests__/RelationshipsListItem.test.tsx"
    name: "RelationshipsListItem_distinctSourceAndTargetDataEntity_targetColumnRendersTargetData"
    description: |-
      Vitest + React Testing Library. Render <RelationshipsListItem item={...}
      /> with a fixture where `sourceDataEntity = { id: 1, internalName: 'src' }`
      and `targetDataEntity = { id: 2, internalName: 'tgt' }`. Assert the
      Source-column DOM contains 'src' (or src/href to dataentities/1); assert
      the Target-column DOM contains 'tgt' (or tgt/href to dataentities/2).
      Pins the contract that Source and Target columns render DISTINCT data.
      This test would FAIL on the current buggy code; once the fix is shipped
      (`item.sourceDataEntity` → `item.targetDataEntity` at lines 73-81), the
      test passes and the regression is locked.
  - path: "odd-platform-ui/src/components/DataModelling/Relationships/__tests__/RelationshipsListItem.test.tsx"
    name: "RelationshipsListItem_clickRow_navigatesToDataEntityOverviewPageForSource_pinsDocClaimSurprise"
    description: |-
      Same fixture. Simulate a click on the row. Assert navigation goes to
      `/dataentities/1/overview` (the source entity's overview), NOT to a
      relationship-type-specific detail URL. Pins the doc-drift finding
      (relationships sidecar `doc_drift_findings.[4]`): the doc says
      "routing determined by the relationship type" but the code always
      navigates to dataEntityDetailsPath(item.id). A future doc fix that
      clarifies "row click goes to source data-entity overview, not a
      type-specific URL" anchors this test.
  - path: "odd-platform-ui/src/components/DataModelling/Relationships/__tests__/Relationships.integration.test.tsx"
    name: "relationshipsTable_seededRowsWithDistinctSourceTarget_tableColumnsMatchDocs"
    description: |-
      Higher-level integration: mount <Relationships /> in a MemoryRouter at
      /data-modelling/relationships. Mock the GET /api/relationships response
      with two rows: row1 (src=A, tgt=B), row2 (src=C, tgt=D). Assert the
      rendered table contains 4 distinct data-entity references (A, B, C, D).
      Catches the bug at the integration tier; pairs with the unit test for
      regression-pin completeness.
