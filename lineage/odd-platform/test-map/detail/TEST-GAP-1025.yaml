proposed_action: |-
  Four-test wedge:
  (a) on_catalog_route_catalog_tab_is_highlighted — render
  ToolbarTabs at /search/{any-id}; assert the Catalog tab has the
  selected aria-attribute / CSS class.
  (b) on_overview_root_path_no_tab_is_highlighted — render at /;
  assert no tab has the selected attribute (selectedTab === -1).
  Pins the documented Overview behaviour as a regression-pin.
  (c) all_nine_tabs_route_each_highlights_correct_tab — parameterised
  test iterating the 9 tabs and their canonical destinations;
  assert each highlights correctly under its own destination
  pathname.
  (d) no_two_tabs_match_the_same_pathname_simultaneously — for
  each tab's destination pathname, compute the highlight set
  (which tabs match via pathname.includes) and assert the set
  size is exactly 1 (no overlap). RED if a future route is
  added that creates a substring-overlap; GREEN today.
  Pair with documentation: pin the "/ shows no highlighted tab"
  behaviour in the operator guide.
