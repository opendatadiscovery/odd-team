  2026-05-25 batch ZG — NEW pillar-anchored feature MINTED from the
  DataEntityRunController batch-ZG controller-class sidecar plus references
  to the not-yet-enriched DataEntityRunServiceImpl,
  ReactiveDataEntityTaskRunRepositoryImpl, DataEntityRunMapper service-tier
  + repository-tier + mapper-tier nodes.

  Per Rule 0 evaluation against system-mission.md: P-04 Data Quality
  enumerates three sub-features (Test Results Import / Quality Dashboard /
  Dataset Quality Statuses SLA). The per-test runs-history surface is NOT
  one of those three; it is a per-TEST-EXECUTION-timeline view at a
  DIFFERENT granularity from F-022's per-dataset reports + F-032's
  catalog-wide aggregate. It belongs inside P-04 as a third user-observable
  read surface. The natural slot is P-04:F-003.

  No duplicate feature exists per registry-search graph-search verification:
  `lineage-extractor graph-search odd-platform "per-data-entity test runs
  history paginated end-time descending DQ test run list" --label Feature
  --k 6` returned F-014 (Per-Entity Alert View, 0.71 similarity), F-022
  (Per-Dataset DQ Reports, 0.70 similarity), F-021 (Activity Feed, 0.70).
  None of those three are the same feature — F-014 is per-entity ALERTS;
  F-022 is per-DATASET DQ tests list; F-021 is the platform-wide audit feed.
  F-040 is per-TEST RUNS history — a distinct surface.

  Per Rule 0b (UI-completeness): F-040's entry points include TWO concrete
  UI consumers (TestRunsHistory.tsx + TestReportDetailsHistory.tsx) which
  are observed in the sidecar's upstream_callers block. The UI surfaces are
  named at specific file:line citations. The feature is UI-complete on the
  frontend; the UI-tier sidecars will be enriched in a future batch to
  close hop-0a/0b with PRIMARY-SOURCE. Confidence HIGH — the UI consumers
  exist; only the sidecars themselves are pending.

  Cross-pillar back-links: P-10 (Integrations — ingestion is the upstream
  producer), P-09 (Security — cross-owner read posture + DISABLED bypass),
  P-07 (Active Platform Features — failing runs feed the alerting + activity
  feed pipelines).

  The headline drift facet is the cross-owner read posture extended to a
  surface that exposes a DISTINCT data-shape (status_reason free-form
  diagnostic text) — the leak channel here is qualitatively different from
  the namespaces/owners/tags lists already exposed elsewhere. Combined with
  the wire-enum-asymmetry HTTP 500 surface, the feature has TWO
  HIGH-severity findings worth probing locally before the next batch.
