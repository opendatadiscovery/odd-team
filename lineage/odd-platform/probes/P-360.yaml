# P-360 — Term-search tsquery operator-injection persistent session DoS (H-009; PLT-090-class, second surface)

arrange:
  - kind: docker-compose-up

  # Seed a couple of terms so the FTS index has rows to (not) match — the bug is
  # about the QUERY parse failing, not about matching, so even one term suffices.
  - kind: http
    method: POST
    path: /api/terms
    base: "http://localhost:18080"
    body: |
      {"name": "ProbeTermAlpha", "definition": "p360 alpha", "namespace_name": "p360_ns"}
    capture_status_as: seed_term_status

act:
  # 1. Create a term-search session (no URL param == the Dictionary-tab first-mount path).
  - kind: http
    method: POST
    path: /api/termsearch
    base: "http://localhost:18080"
    body: |
      {"query": "", "pageSize": 30, "filters": {}}
    capture_json_as: session_create
    capture_status_as: session_create_status

  # 2. Submit a malformed tsquery free-text query against the session (the UI's
  #    TermSearchInput Enter path → PUT /api/termsearch/{searchId} with the raw
  #    query string). `foo )(` is the canonical unbalanced-parens DoS payload from
  #    PLT-090 Defect 3.
  - kind: http
    method: PUT
    path: "/api/termsearch/{{session_create.searchId}}"
    base: "http://localhost:18080"
    body: |
      {"query": "foo )(", "pageSize": 30, "filters": {}}
    capture_status_as: malformed_put_status

  # 3. Read the session results — the read calls to_tsquery(?) on the persisted
  #    query_string. If the malformed string was persisted unescaped, THIS is the
  #    persistent-500 surface.
  - kind: http
    method: GET
    path: "/api/termsearch/{{session_create.searchId}}/results?page=1&size=30"
    base: "http://localhost:18080"
    capture_status_as: results_read_1_status

  # 4. Re-read the SAME session UUID a second time to prove persistence (the
  #    "breaks for everyone who opens the URL later" half of the hypothesis).
  - kind: http
    method: GET
    path: "/api/termsearch/{{session_create.searchId}}/results?page=1&size=30"
    base: "http://localhost:18080"
    capture_status_as: results_read_2_status

  # 5. Also probe the suggestions endpoint, which routes through the same FTS helper
  #    (getQuerySuggestions) — a parallel surface for the same injection.
  - kind: http
    method: GET
    path: "/api/termsearch/suggestions?query=foo%20)("
    base: "http://localhost:18080"
    capture_status_as: suggestions_status

observe:
  - kind: noop
    note: "all status codes captured in act"

assert:
  # Session create must succeed (sanity).
  - "session_create_status == 200"
  # H-009 confirmed: the malformed query is handled gracefully on write AND on both
  # reads (no persistent poisoned session). Any 500 on the PUT or either GET
  # contradicts the hypothesis.
  - "malformed_put_status >= 200 and malformed_put_status < 500"
  - "results_read_1_status >= 200 and results_read_1_status < 500"
  - "results_read_2_status >= 200 and results_read_2_status < 500"
  - "suggestions_status >= 200 and suggestions_status < 500"

cleanup:
  - kind: docker-compose-down
    destroy_volumes: true

cross_references:
  refactoring_scopes: [REFACTOR-229]
  related_issues: [PLT-090]
  related_concepts: ["tsquery-operator-injection-via-persisted-state", "Term Search Session (Dictionary tab)"]
  reflection: "lineage/odd-platform/feature-reflections/detail/F-024.yaml#H-009"
  note: |
    distinct_from PLT-090 — PLT-090 files the tsquery-injection persistent DoS for
    the DATA-ENTITY SearchController surface (/api/search/*, F-017). This probe tests
    whether the SAME class reproduces on the TERM-search surface (/api/termsearch/*,
    F-024) via the shared JooqFTSHelper. If it reproduces, it is a second controller
    surface of the same root defect — file as a Term-search extension of PLT-090 (or
    fold into the JooqFTSHelper consolidated fix), NOT a fresh root-cause issue.

realism_caveats: |
  - LOCAL-ONLY (APPROACH.md §9 rule 12): docker-compose + local Postgres + a small
    HTTP client loop. No cloud, no managed DB.
  - Runs under auth.type=DISABLED (the odd-minimal profile default) so no token
    plumbing is needed — the tsquery-parse path is auth-independent. If the profile
    enables LOGIN_FORM, the harness must authenticate first (all six search-state
    endpoints are authenticated() per TermController.java:166-216).
  - `foo )(` is the minimal reproducer; the harness may also try `a & | b`, `!`, and
    a bare `*:` to characterise which operator classes leak.
  - If the platform uses `plainto_tsquery` / `websearch_to_tsquery` on the Term path
    (rather than the raw `to_tsquery` the data-entity path uses), the hypothesis is
    CONFIRMED and the Term surface is — unlike F-017 — already hardened; record that
    asymmetry, it is itself a finding (two FTS entry points, two escaping postures).
