name: |-
  OpenAPI 200-vs-201 status-code drift — batch W extends to 7+ controllers (DataSource + Collector + Tag confirmed THIS BATCH); batch ZF adds redirect 302-vs-301 cross-class drift
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-11
description: |-
  STRENGTHENED INVARIANT, batch 2026-05-20W — extends the existing
  openapi-200-vs-201-status-code-drift master invariant by
  confirming the same drift class at THREE NEW controllers from
  batch W primary-source class-level sidecars.

  THE EXPANDED CONFIRMATION — 7 confirmed instances now:

    Previously confirmed (per existing master invariant):
      Instance 1 — OwnerController.createOwner (batch E):
        controller returns 200; openapi declares 201
      Instance 2 — RoleController.createRole (batch E):
        same drift
      Instance 3 — PolicyController.createPolicy (batch E):
        same drift
      Instance 4 — IngestionController.postDataEntityList (batch F):
        spec declares 201 (odd_api.yaml:23-25), controller returns
        200 (IngestionController.java:44), BaseIngestionTest.java:79
        locks in 200
      Instance 5 — TermController.createTerm + .updateTerm (batch U)
      Instance 6 — AlertController.changeAlertStatus (cross-ref)

    Batch W adds 3 new instances:
      Instance 7 — DataSourceController.registerDataSource (POST
        /api/datasources): controller returns 200 (line 35); spec
        declares 201 (openapi.yaml:454). Same drift.
      Instance 7b — DataSourceController.updateDataSource (PUT
        /api/datasources/{id}): controller returns 200 (line 44);
        spec declares 201 (openapi.yaml:482). Same drift.
      Instance 8 — CollectorController.registerCollector (POST
        /api/collectors): controller returns 200 (CollectorController.java:27);
        spec declares 201 (openapi.yaml:557-563). Same drift.
      Instance 8b — CollectorController.updateCollector (PUT
        /api/collectors/{id}): controller returns 200; spec
        declares 201 (openapi.yaml:586-591). Same drift.
      Instance 9 — TagController.createTag (POST /api/tags):
        controller returns 200 (TagController.java:27); spec
        declares 201 (openapi.yaml:372). Same drift.
      Instance 9b — TagController.updateTag (PUT /api/tags/{tag_id}):
        controller returns 200 (TagController.java:51); spec
        declares 201 (openapi.yaml:400). Same drift.

    Updated count: 9+ endpoint-level instances across 7+ controllers
    (Owner, Role, Policy, Ingestion, Term, Alert, DataSource,
    Collector, Tag).

  THE PATTERN'S LOAD-BEARING OBSERVATION:

    The drift is UNIFORM across every controller's createX +
    updateX endpoint. The architectural shape:
      - controllers extend OpenAPI-generated *Api interfaces (e.g.
        TagApi, CollectorApi, DataSourceApi)
      - the generated interfaces' method signatures don't dictate
        a specific HTTP status; the contract for status code is
        in the openapi.yaml's responses block
      - the controller bodies uniformly use ResponseEntity::ok
        (which returns 200) or ResponseEntity.noContent (which
        returns 204)
      - no controller uses ResponseEntity.status(HttpStatus.CREATED)
        for the create paths
      - the OpenAPI spec declares 201 for the create paths
        (canonical REST shape)

    The drift is PERVASIVE — every createX method on every
    controller exhibits it. The drift is also LOCKED IN by tests
    that assert isOk() (HTTP 200), not isCreated() (HTTP 201).
    Aligning to spec (return 201) would break every existing test;
    aligning the spec (declare 200) would silently change the
    contract for downstream SDK consumers.

  ADDITIONAL THIS BATCH OBSERVATION — TagController updateTag's
  201 is NON-CANONICAL:

    The OpenAPI declares `'201': The resource has been successfully
    updated` at openapi.yaml:400 for TagController.updateTag. The
    use of 201 (canonically 'Created') for an UPDATE endpoint is
    itself unusual — 200 or 204 fits update semantics better. The
    controller's 200 is more semantically correct than the spec's
    201. This is consistent with the same drift class observed in
    TermController.createTerm + .updateTerm (batch U).

    The pattern: the OpenAPI spec author chose 201 for both create
    AND update; the controller author chose 200 for both. The two
    decisions are independent; neither references the other.
    Coordination only happens via shared tests, which lock in 200.

  THE 5-ENDPOINT TAG-PLUS-DATA-SOURCE-PLUS-COLLECTOR CLUSTER:

    Batch W's 5 new endpoint-level instances cluster at the 3
    Management-tier controllers DataSource + Collector + Tag.
    Together with the per-controller multi-endpoint counts:
      - DataSourceController: 2 endpoints affected (POST + PUT)
      - CollectorController: 2 endpoints affected (POST + PUT)
      - TagController: 2 endpoints affected (POST + PUT)

    The Management-tier cluster ALONE has 6 affected endpoints.
    Across the platform, a conservative estimate is 12-18 affected
    endpoints. The codebase-wide audit candidate (master invariant
    note) is now ENTERPRISED by this batch.

  ## STRENGTHENED batch 2026-05-25-ZF — IngestionController class-level + DataCollab redirect adds two new drift CLASSES

  Batch ZF adds two new drift instances AND surfaces a SECOND
  drift class (302-vs-301 on the redirect endpoint):

    Instance 10 (200-vs-201 class — IngestionController consolidation):
      IngestionController controller-class sidecar (batch ZF) re-
      anchors the per-method postDataEntityList drift (Instance 4
      above) at the class level. The class-level reading makes
      the drift IMPOSSIBLE TO MISS — line 44 `ResponseEntity.ok()`
      (200) vs the sibling lines 86 + 94 returning
      `HttpStatus.CREATED` (201) on postDataSetStatsList +
      ingestMetrics. The class-level surface shows that ONLY
      postDataEntityList drifts; the other two POSTs ALIGN with
      the spec's 201. The drift is class-level isolated to ONE
      handler — likely a forgotten port from an earlier spec
      revision.

    NEW DRIFT CLASS — 302-vs-301 on
    DataCollaborationController.redirect:
      The OpenAPI spec (`openapi.yaml:1788-1789`) declares
      `301 Moved Permanently` for `GET /api/messages/{message_id}/url`.
      The controller emits `HttpStatus.FOUND` (302) at
      `DataCollaborationController.java:45`. The live api-reference
      doc page (WebFetched 2026-05-25, status 200) EXPLICITLY
      acknowledges the drift: "the OpenAPI spec declares 301 Moved
      Permanently for this route; the platform actually serves 302
      Found". Spec-generated client code may interpret the responses
      differently. Three sources of truth disagree: code (302), spec
      (301), live doc (302 + note).

      This is a SECOND drift CLASS — distinct from the 200-vs-201
      shape on create/update endpoints. The same architectural
      pattern (OpenAPI declares X, controller emits Y, tests lock
      in Y, docs may surface the drift after the fact) applies, but
      the specific status-code shape is different. The drift is at
      the same time more SUBTLE (302 vs 301 are semantically
      similar from a browser perspective — both result in redirect)
      and more PROBLEMATIC for HTTP-cache-aware clients (301 is
      cacheable; 302 is not).

  SEVERITY LOW — functional impact zero (200 and 201 are both
  success responses; 302 and 301 are both redirects); spec-doc
  drift; SDK-consumer-impact medium for clients with strict
  isCreated() checks OR HTTP-cache-aware clients differentiating
  301 from 302.

