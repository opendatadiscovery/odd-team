description: |-
  **NEW INVARIANT — PRIMARY-SOURCE PIN of REFACTOR-227, batch 2026-05-19K.**
  The Business Glossary's description-mention auto-link is a service-tier
  side-channel that creates `data_entity_to_term` rows with
  `is_description_link=TRUE` WITHOUT consulting the controller-tier
  `DATA_ENTITY_ADD_TERM` permission. The regex parser
  `findTermsInDescription` at `TermServiceImpl.java:337-360` matches
  `\[\[([^:]*?):([^\]]*?)\]\]` against any description text supplied via
  `PUT /api/dataentities/{id}/description`. The flow:
    (a) `DataEntityServiceImpl.upsertDescription` (line 328 of
        DataEntityServiceImpl) calls `termService.handleDataEntityDescriptionTerms(...)`;
    (b) `TermServiceImpl.handleDataEntityDescriptionTerms` (lines
        201-207) invokes `findTermsInDescription` then
        `updateDataEntityDescriptionTermsState`;
    (c) `updateDataEntityDescriptionTermsState` (lines 362-389)
        INSERTs `data_entity_to_term` rows with `is_description_link=TRUE`
        for newly-mentioned terms.
  The only auth gate consulted on this entire path is
  `DATA_ENTITY_DESCRIPTION_UPDATE` (SecurityConstants.java:194-197) on
  the description-update endpoint — `DATA_ENTITY_ADD_TERM` (the gate
  that nominally protects term-linkage at the direct-link endpoint
  `POST /api/dataentities/{id}/terms`) is NEVER consulted. **The side-channel
  PERSISTS even if REFACTOR-217 is fixed.** REFACTOR-217's path-mismatch
  bug disables the controller-tier gate on the DIRECT-LINK endpoint; this
  invariant identifies a SECOND, independent path that bypasses the gate
  even when correctly wired — the description-edit path is service-tier-invoked,
  not controller-tier, so a controller-tier gate cannot fire here.
  Operator-facing manifestation: a user holding `DATA_ENTITY_DESCRIPTION_UPDATE`
  but NOT `DATA_ENTITY_ADD_TERM` can paste `[[finance:Customer]]` into a
  description and create a term-link row. The `is_description_link=TRUE`
  flag distinguishes the row from a manual link, but the row exists with
  the same `term_id` and the same `data_entity_id` — visible in the
  Terms section of the data-entity detail page identically to a manual
  link. **Backward-compat side-effect**: a description-mention for a term
  that doesn't yet exist is staged in `data_entity_description_unhandled_term`
  (per `buildDataEntityUnknownTerms` at line 501); when the matching term
  is later created via `createTerm`, `resolveUnhandledDescriptionMentions`
  (line 421-442) drains the staging and materialises real link rows. So
  a user with DESCRIPTION_UPDATE can mention `[[finance:NEW_TERM]]` today;
  an admin with TERM_CREATE creates the term tomorrow; the link row
  materialises automatically — auto-linking flows ACROSS TIME without
  either user holding DATA_ENTITY_ADD_TERM at any point.
  vocabulary_status: PRIMARY-SOURCE PIN — prior batches surfaced the
  side-channel from the UI angle (DataEntityDescription batch J — the
  TERM_PATTERN regex on lib/constants.ts:177) and the
  controller-method angle (upsertDataEntityInternalDescription batch F);
  batch K is the first pin at the service-tier regex compile site
  AND the staging-table backward-resolution mechanism.
