proposed_action: |-
  Add `DataSourceCascadeDeleteTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `deleteDataSource_withLiveDataEntityChildren_returns400_pinsCascadeBlock` — seed a datasource + ingest data_entities (live, not soft-deleted); DELETE `/api/datasources/{id}`; assert HTTP 400 with the canonical message "Data source cannot be deleted: there are still data entities attached".
  2. `deleteDataSource_withNoDataEntityChildren_returns204_pinsCascadeAllow` — seed a fresh datasource (no children); DELETE; assert HTTP 204 No Content.
  3. `deleteDataSource_withOnlySoftDeletedChildren_returns204_pinsSoftDeleteExclusion` — seed a datasource + ingest data_entities + soft-delete all children; DELETE; assert HTTP 204 (the existsNonDeletedByDataSourceId check filters out soft-deleted rows).
  4. `deleteDataSource_softDeletePersists_oddrnReusable_pinsReincarnation` — DELETE; assert `data_source.deleted_at IS NOT NULL` via raw DB query; assert a fresh `POST /api/datasources` with the same ODDRN succeeds (the partial unique index excludes the soft-deleted row).

  Pair with DOC-NNN: surface the cascade-delete behaviour in the Datasources tab doc page so operators know the workflow (delete data_entities first, then the datasource).
