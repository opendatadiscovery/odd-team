terminal_side_effect:
  side_effect_class: db-write
  description: |-
    INSERT or UPDATE row in `term` table. Side effects via
    TermServiceImpl: namespaceService.getOrCreate (silent namespace
    creation if novel) + updateSearchVectors (FTS refresh) +
    resolveUnhandledDescriptionMentions (drain staging table on create —
    cross-time auto-link, see F-056).
  evidence: |-
    TermServiceImpl.java:99-117 (create) + :119-145 (update) +
    :103, 138 (namespace getOrCreate side-channel) +
    :116 (resolveUnhandledDescriptionMentions cross-time drain).
  cardinality_per_call: 1 term row + N namespace rows (0 or 1) + N FTS row + M auto-link rows
amplification_factor: 1
observed_vs_expected:
  facets:
    - facet_id: client_side_duplicate_check_loads_1000_terms_in_memory
      drift_class: ui_pre_validation_fragile_at_scale
      severity: MEDIUM
      observed: |-
        TermsForm.tsx:71-75 dispatches `fetchTermsSearchResults({searchId,
        page:1, size:1000})` on form mount. The fetch populates
        `existingTerms` for the duplicate detector (lines 84-94). Three
        stacking issues: (i) `size: 1000` hardcoded — a catalog of
        1001+ terms silently skips the check for the 1001th+ term and
        the duplicate detector returns no-match; (ii) the check ONLY
        fires in CREATE mode (line 84 `if (!term?.id)`) — the EDIT
        path can rename a term to collide with another in the same
        namespace without any client-side warning; (iii) the backend
        uniqueness constraint is the authoritative gate but
        TermServiceImpl.createTerm has no graceful-error path
        documented; the client check is meant to PREVENT reaching
        backend rejection. Current shape gives operators false
        validation that silently breaks at scale + on rename. Also
        cross-link F-002 batch N
        `list_term_ref_dtos_count_vs_list_filter_mismatch` —
        listTermRefDtos may report `total > 1000` but the page=1
        size=1000 fetch ceilings what the client sees.
      expected: |-
        Either (a) drop the client check entirely + add a backend
        error-translation for the duplicate case (4xx with structured
        body) + render it on form submit failure; OR (b) implement
        the check as a server-side validator endpoint
        (`GET /api/terms/check-name-availability?name=X&namespaceName=Y`)
        the form calls on blur.
      evidence:
        - 'TermsForm.tsx:71-75 (hardcoded size:1000 fetch on mount)'
        - 'TermsForm.tsx:84-94 (client-side duplicate check)'
        - 'TermsForm.tsx:84 (CREATE-mode-only gate)'
      ui_unverified: false
    - facet_id: no_error_handler_on_dispatch_chain_silent_failure_on_backend_reject
      drift_class: ui_submit_chain_lacks_catch_silent_failure
      severity: MEDIUM
      observed: |-
        TermsForm.tsx:100-111 — `dispatch(createTerm|updateTerm).unwrap().then(...)`
        with NO `.catch(...)` handler. If the backend rejects the
        request (4xx for duplicate name, 5xx for server error), the
        unwrap().then() chain rejects silently; the dialog STAYS OPEN
        with the form filled, no error message renders, the user has
        no feedback. They click "Save" again, get the same silent
        failure. Pattern is the LSN-024-shaped silent-empty class
        (cross-link F-064) — feature appears broken without diagnostic.
      expected: |-
        Add `.catch((e) => setError(serializeBackendError(e)))` —
        surface the error in the existing Alert UI (line 122-147 already
        has the Alert component for the client-side duplicate; reuse
        for backend errors).
      evidence:
        - 'TermsForm.tsx:100-111 (dispatch chain with no .catch)'
        - 'TermsForm.tsx:50, 122-147 (Alert component scaffolding already exists)'
      ui_unverified: false
    - facet_id: query_client_invalidate_by_undefined_termid_in_create_mode
      drift_class: ui_cache_invalidation_uses_route_termid_in_create_mode
      severity: MEDIUM
      observed: |-
        TermsForm.tsx:106-108 — `await queryClient.invalidateQueries({queryKey:
        ['term', termId]})`. `termId` comes from `useTermsRouteParams()`
        (line 36) which is the URL termId. In CREATE mode the form is
        mounted from `/termsearch/*` where `termId` is `undefined` (or
        `NaN` per termsRoutes.ts useTermsRouteParams parseInt behaviour
        — F-024 batch ZH note). The invalidation fires for
        `['term', undefined]` queryKey — invalidates nothing, OR
        invalidates the wrong cache slot. The newly-created term's
        details are not invalidated; the navigation to
        `termDetailsPath(response.id)` then triggers a fresh fetch
        (which works), but any future cached lookups for
        `['term', undefined]` accumulate dead cache entries.
      expected: |-
        Use `response.id` from the unwrap result for the invalidation
        key, OR scope the invalidation to the search-results list
        (`['term-search', searchId]`) rather than a single-term cache.
      evidence:
        - 'TermsForm.tsx:36 (termId from route)'
        - 'TermsForm.tsx:105-108 (invalidate by route termId in create mode)'
        - 'routes/termsRoutes.ts useTermsRouteParams parseInt-NaN propagation (F-024 batch ZH)'
      ui_unverified: false
    - facet_id: definition_markdown_editor_xss_surface_extension_f_004
      drift_class: stored_xss_surface_extends_at_authoring_time
      severity: HIGH
      observed: |-
        TermsForm.tsx:168-186 — the definition field is a `<Markdown {...field}
        editor height={200} />` (line 183). The editor accepts arbitrary
        Markdown including HTML+JS payloads. On submit the raw string
        round-trips through TermServiceImpl.createTerm/updateTerm
        (no sanitisation per F-002 batch U + F-004 batch U). The
        Markdown editor is the AUTHORING surface for the F-002 facet
        `term_definition_xss_surface_extension_f_004_class_3rd_surface`
        — an operator with TERM_UPDATE permission can plant `<script>`
        payloads via this dialog and the F-004 family stored-XSS
        triggers for every authenticated viewer.
      expected: |-
        Same as F-004 — sanitise at storage or render layer. The
        TermsForm itself has no responsibility for sanitisation
        (consumer responsibility), but the form IS the authoring
        entry point for the XSS surface; documenting that the
        Markdown definition is treated as trusted HTML is part of
        TERM_UPDATE permission's docs.
      evidence:
        - 'TermsForm.tsx:168-186 (Markdown editor with `editor` prop)'
        - 'cross-link F-002 batch U term_definition_xss_surface_extension_f_004_class_3rd_surface'
        - 'cross-link F-004 batch U (primary documentation)'
      ui_unverified: false
    - facet_id: namespace_create_via_namespace_autocomplete_bypass_at_authoring_time
      drift_class: ui_namespace_autocomplete_authors_silent_namespace_creation
      severity: MEDIUM
      observed: |-
        TermsForm.tsx:161-167 — `NamespaceAutocomplete` accepts a novel
        namespace name (user types a name not in the dropdown). On
        submit the namespace string flows to
        TermServiceImpl.createTerm/updateTerm and through to
        `namespaceService.getOrCreate(namespaceName)` — per F-002 batch K
        `namespace_create_bypass_via_get_or_create`, this bypasses
        NAMESPACE_CREATE. The UI provides no signal that typing a
        novel namespace will create one; it appears to be a selection
        affordance. An operator with TERM_CREATE but without
        NAMESPACE_CREATE silently creates new namespaces by typing
        them.
      expected: |-
        Either (a) the NamespaceAutocomplete restricts to existing
        namespaces (no novel input) and surfaces a separate "Create
        new namespace" affordance gated by NAMESPACE_CREATE; OR (b)
        the affordance is documented as "TERM_CREATE includes
        namespace-create scope".
      evidence:
        - 'TermsForm.tsx:161-167 (NamespaceAutocomplete with no creation gate)'
        - 'F-002 batch K namespace_create_bypass_via_get_or_create'
      ui_unverified: true
      ui_unverified_reason: |-
        NamespaceAutocomplete component not read in this UI walk; the
        novel-input handling shape determines confirmation OR refinement.
