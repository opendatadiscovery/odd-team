    application's DB role must hold BOTH CREATE TABLE on public AND
    DROP TABLE on every partition it creates. Canonical config docs
    don't enumerate. Operators running ODD against managed Postgres
    (RDS) with least-privileged role discover the gap only when
    partition lifecycle silently fails.
