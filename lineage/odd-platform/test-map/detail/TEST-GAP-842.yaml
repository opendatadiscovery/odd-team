proposed_action: |-
  **Phase 1 — UI Playwright regression-pin**:

  1. `userAuthenticatedAsOwnerANavigatesToHome_seesEntitiesOwnedByOwnerBInPopularColumn_pinsCatalogWidePopular` — boot test-platform with two users + two Owners. Seed entities under OwnerB (and zero under OwnerA). Log in as UserA (associated with OwnerA), navigate to `/`, wait for Recommended panel to load. Assert that the Popular column renders OwnerB-owned entities. PINS the cross-owner visibility.

  **Phase 2 — Backend integration tests**:

  2. `getPopular_authenticateAsUserAWithOwnerA_returnsEntitiesOwnedByOwnerB_pinsNoOwnerScoping` — WebTestClient calling `GET /api/dataentities/popular` as UserA, assert response contains entities not owned by UserA's Owner. Sister-test to the Popular inflation regression.

  3. `anonymousUnderDISABLED_pumpsEntityViewCount_authenticatedUserSeesPromotedEntityOnHomePage_pinsCrossPillarComposition` — boot DISABLED-mode platform, anonymous caller hits `/api/dataentities/{id}` 1000 times (the inflation pattern from probe P-002). Then authenticate as UserB, navigate to home, assert the inflated entity appears at position 0 in Popular. PINS the cross-pillar attack chain.

  **Architectural fix dependency**:
  - Backend fix: add per-Owner filter to `listPopular` (the load-bearing fix per F-003 facet `service tier is a 1-line pass-through`)
  - Doc fix: catalog-overview.md must explicitly disambiguate Popular (catalog-wide) from My Objects / Upstream / Downstream (per-user)
  - Test pins both the current bypass AND the future fix (after fix, the test asserts the absence of cross-owner entities in the response)

  Coherence note (LSN-018 Rule 6): STRENGTHENS REFACTOR-024 + F-003 by establishing the home-page UI-tier consumer surface explicitly. NO contradiction with existing artefacts. The catalog-wide Popular column is a DELIBERATE design choice (ADR-CANDIDATE-003 + ADR-CANDIDATE-122) — the test does not necessarily PIN-AS-BUG; it PINS-THE-CONTRACT. The fix decision is a maintainer policy call: keep the read-collaborative posture explicit (test stays as documentation of the contract) OR add per-Owner Popular filter (test flips assertion direction).
