notes: |-
  This is the LOAD-BEARING finding the user's prompt called out. Same shape
  as `idsparam-entity-ids-misdescription-on-getpopulartaglist-tag-id-filter`
  (the earlier LSN-020-class entry on the popular-tag-list endpoint). The
  pattern is now confirmed on a UI surface (dashboard filter label) in
  addition to the prior OpenAPI surface (description string).

  Maintainer follow-ups (DOC-NNN / REFACTOR-NNN class):
    (1) UI: rename `t('Title')` to `t('Ownership Title')` in TitleFilter.tsx:29.
    (2) Docs: dashboard.md should document the binding ('Title filter = the
        ownership role assigned to a dataset's owners; e.g. Data Steward, Owner').
    (3) Docs: dashboard.md should document the Owner+Title AND-composition
        semantic.
    (4) Backend: openapi.yaml:1973-2078 should add `description` fields to the
        `titleIds`/`deTitleIds` query params disclosing the OWNERSHIP.TITLE_ID
        binding for API consumers who hit the endpoint without the UI.
