expected_outcome: |
  Quoting hypothesis H-010 verbatim:
  "When the audit-export workaround is exercised end-to-end (cross-owner read +
  soft-deleted-entity read + a large page) the platform behaves as the doc-
  recommended workaround implies — a complete, owner-irrelevant export of the
  entity's alert history."

  The per-hop static verdicts are NOT in doubt (H-001 cross-owner, H-005 soft-
  deleted-entity read, H-003 unbounded size are each contradicted from primary
  source). This probe pins the COMPOUND the F-014 control_summary names as the
  highest-leverage unprobed cells ("0 of 4 cells COVERED") as one measured local
  artefact, so a future security tightening (owner-scope or soft-delete-exclude
  or @Max clamp) breaks the build against a concrete failing assertion rather
  than silently changing the documented workaround.

  Four measured sub-assertions:

  (a) CROSS-OWNER READ of an entity the caller does NOT own. Seed two unrelated
      owners (B owns entity X) + create alerts on X. As user A (authenticated,
      NO ownership of X, NO role granting it) call GET /api/dataentities/{X}/alerts
      and assert 200 with X's full alert history. PASS for the CURRENT (contradicted)
      posture = A reads X's alerts. A future owner-scoping fix flips this to
      403/empty and the assertion fails loudly (the regression pin).

  (b) SOFT-DELETED-ENTITY READ. Flip data_entity.status of an entity Y (with prior
      alerts) to the DELETED code, then GET /api/dataentities/{Y}/alerts and assert
      200 with Y's pre-deletion alert history (existsIncludingSoftDeleted admits it).
      Contrast: confirm Y is ABSENT from a catalog list endpoint (the cross-channel
      split — visible via alerts API, hidden in the catalog).

  (c) UNBOUNDED SIZE. Call GET /api/dataentities/{X}/alerts?page=1&size=1000000 and
      assert the request is ACCEPTED (200, not a 4xx clamp) — characterise response
      size / latency. Separately call page=0 and record the error shape (expect a
      Postgres negative-OFFSET error surfacing as a 5xx, NOT a clean 400 — H-003).

  (d) ANONYMOUS REACH UNDER DISABLED. With the stack's default auth.type=DISABLED,
      assert an UNAUTHENTICATED GET /api/dataentities/{X}/alerts returns 200 (H-002).

  PASS (pins current behaviour) = (a) 200 cross-owner read; (b) 200 soft-deleted
  read + Y hidden from catalog list; (c) size=1000000 accepted + page=0 errors as
  5xx; (d) anonymous 200 under DISABLED. The reflection verdict for H-010 flips
  from probe-needed to confirmed if the compound reproduces as traced, or to
  partial/contradicted if any leg behaves differently (with the observed shape
  recorded — e.g. if size IS clamped somewhere not visible in the static trace).
