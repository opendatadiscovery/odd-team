behaviour: |-
  Sequential dual-fetch contract — HierarchyLineage.tsx:54-66 issues downstream first, then upstream via .then(). If downstream returns 500 (e.g. F-005 NPE-on-null-lineage_depth), upstream NEVER fires. The Redux error state for downstream surfaces but upstreamError is null because the fetch never ran; the user sees a single error but the UI cannot recover by just retrying upstream. Test asserts (a) happy path runs both fetches in order; (b) downstream failure short-circuits upstream; (c) the resulting state surfaces only the downstream error.
