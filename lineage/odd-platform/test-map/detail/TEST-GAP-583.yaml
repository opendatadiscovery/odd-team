proposed_action: |-
  WebTestClient test. (a) Boot with `auth.ingestion.filter.enabled=true`. (b) POST `/ingestion/entities` with a valid token AND a payload naming a `dataSourceOddrn` that does NOT exist. (c) Assert HTTP 5xx (current). (d) Compare with POST naming an EXISTING datasource and WRONG token → 401. (e) Pin the distinguishability. Future fix catching `NotFoundException` → flipping assertion (c) to 404 or 401.
