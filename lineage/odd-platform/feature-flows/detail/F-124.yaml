notes_for_maintainer: |-
  Probe-needed (local-only): configure LDAP with `admin-groups: ['ops']`
  against a fake LDAP server containing groups `devops` + `noops` + `appops`;
  confirm the platform promotes every user in any of those groups to ADMIN.

  Follow-up scope candidates:
  - SEC-NNN (HIGH): change LDAP admin-group matching from `containsIgnoreCase`
    SUBSTRING to `equalsIgnoreCase` EXACT match (one-line LDAPSecurityConfiguration.java:96).
    Migration note for operators using substring tokens.
  - SEC-NNN: cross-field validation in ODDOAuth2Properties.@PostConstruct
    validate() — Azure requires logoutUri; GitHub requires read:org scope
    when adminGroups non-empty; Google requires allowedDomain.
  - REFACTOR-NNN: OAuth2Provider.provider field type-safe via Provider enum
    (currently free String).
  - DOC-NNN: create unified "ADMIN Promotion Across Auth Providers" page.
  - DOC-NNN: Provider enum + handlers brought to parity with live docs'
    7-provider claim (Okta + Keycloak need handlers).
  - CONCEPT-CATALOG: promote
    `cross-provider-admin-promotion-mechanism-divergence-with-six-distinct-shapes`
    as a canonical concept entry.

  Cluster_with [F-006, F-011] per source SHB. F-006 (RBAC Policy Lifecycle)
  is the destination of an ADMIN authority; F-011 (Principal-to-Owner
  Resolution) is the resolver layer that consumes the authority set; F-124
  is the admin-promotion layer that PRODUCES the authority. The three are
  complementary not overlapping.

  REFLECTION CORRECTION (feature-reflector F-124, 2026-06-03): the first SEC-NNN
