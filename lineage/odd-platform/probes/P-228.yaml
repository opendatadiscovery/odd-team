realism_caveats: |
  The second HIGHEST-leverage F-011 probe the control_summary names. The collision is
  case-sensitive (the SQL uses eq, not equalsIgnoreCase) so the seeded username MUST be
  exactly 'ADMIN' uppercase to reproduce. If s2s_whoami.owner.id is null (S2S resolves to
  no Owner), the static trace would be wrong — re-read S2sAuthenticationFilter.java:31-34 +
  AuthIdentityProviderImpl.java:29-33. The probe also implicitly confirms that the platform
  ships NO dedicated system-Owner for S2S: there is no reserved owner row the filter binds
  to; isolation depends entirely on operators never naming a human user 'ADMIN'. Note the
  sibling DISABLED-mode dummyOwner uses LOWERCASE 'admin' (IdentityController.java:32) — a
  separate collision surface (PLT-072 Defect 3 covers both literals).
