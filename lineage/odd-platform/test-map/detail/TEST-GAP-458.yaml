gap_id: TEST-GAP-458
category: missing-security
criticality: MEDIUM
node_ids:
  - "odd-platform java service service:NotificationsDispatcher"
pillars_affected: [P-07, P-09]
surfaced_by:
  - "NotificationsDispatcher.md:security.known_security_gaps.[1] (no delivery audit)"
  - "NotificationsDispatcher.md:bugs_limitations_corner_cases.[1] (no retry / no DLQ / no audit)"
behaviour: |-
  No delivery audit at dispatcher — no DB record of which alert went to which channel with what status. The WAL stream's setAppliedLSN and setFlushedLSN are advanced unconditionally after process() returns (NotificationSubscriber.java:83-84) — the dispatcher has no way to signal 'do not advance LSN'. Operators have NO database record of delivery success/failure per alert per channel; they have only grep-greppable receiver-id strings in stdout. Compliance frameworks requiring 'data alerts must be delivered or auditable as undelivered' are not satisfied. Cross-pillar P-09 dimension because the catch-and-log-only stance + the receiver-id leaks in NotificationSenderException.getMessage() (logged at ERROR per AlertNotificationMessageProcessor.java:32-34) is the only forensic surface.
test_class: missing-security
