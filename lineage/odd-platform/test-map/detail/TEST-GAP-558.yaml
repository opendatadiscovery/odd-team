behaviour: |-
  getUserRolesByOwner returns the RoleDto list including the policy_relations jsonArrayAgg — verify empty policy_relations for a role with no role_to_policy bindings is handled (jsonArrayAgg([null]) is the empty marker). This is the **AUTHORIZATION HOT PATH** — the 4-way JOIN at lines 99-114 is invoked transitively from PolicyServiceImpl.getCurrentUserPolicies on EVERY authorized HTTP request via the RBAC permission framework. The empty-bindings edge case is realistic (a Role created via API with no Policy attachments yet) — a regression that returned `[null]` instead of `[]` would propagate as a malformed RoleDto upstream and either corrupt the permission resolution OR raise an NPE.
