proposed_action: |-
  WebTestClient + in-memory log appender. (a) Boot with `auth.ingestion.filter.enabled=true`. (b) Issue requests: missing Authorization header, malformed Authorization (no Bearer prefix), wrong token, valid token. (c) Assert log capture: ZERO log records from `o.o.o.auth.filter.*` loggers on the FAILURE paths (current). (d) Pin the absence; future audit-log addition (logger emitting WARN with caller IP + dataSourceOddrn on failure) flips this test deliberately.
