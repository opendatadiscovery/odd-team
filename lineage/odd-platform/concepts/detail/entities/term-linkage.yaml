security_aggregate:
  overall: HIGH
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      INTENDED: DATA_ENTITY_ADD_TERM/DELETE_TERM via SecurityRule
      (SecurityConstants.java:237-242). ACTUAL: NEVER ENFORCED due to path
      mismatch (singular /term vs plural /terms in OpenAPI). Falls through
      to .authenticated(). ALSO bypassable via DATA_ENTITY_DESCRIPTION_UPDATE
      → [[ns:term]] mention auto-creates term_relations. **STRENGTHENED
      batch K**: service-tier TermServiceImpl has ZERO permission checks
      (verified via grep — primary source); the entire term-linkage
      surface is structurally controller-tier-only, and the controller-tier
      gate is silently disabled by REFACTOR-217. **STRENGTHENED batch L**:
      DELETE half PRIMARY-SOURCE CONFIRMED at the same SecurityConstants
      file (lines 240-242) — same bug shape, same fallback to
      .authenticated(); both controller-tier halves are now structurally
      pinned. **NEW HIGH (batch K)**: SecurityConstants.java:295-296
      wires /api/alerts/{id}/status PUT to DATASET_FIELD_ADD_TERM (a Term
      permission on an Alert path — almost certainly copy/paste error;
      two-way bypass).
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Cross-namespace term assignment is unconstrained; even with path fix,
      term_id has no per-term permission gate. **STRENGTHENED batch K**:
      cross-namespace pollution unconstrained at service tier — neither
      TermServiceImpl nor ReactiveTermRepositoryImpl references odd.tenant-id
      or any tenant scoping; descriptions in namespace-A can auto-link to
      terms in namespace-B (REFACTOR-218-class drift).
  strengths:
    - |-
      Description-link rows protected from DELETE via API (filter
      is_description_link=FALSE in TermRelationsRepositoryImpl.java:84) —
      **STRENGTHENED batch L** — confirmed at the DELETE primary source
    - Duplicate-prevention graceful (onDuplicateKeyIgnore + switchIfEmpty → 400 BadUserRequest,
      not 5xx)
    - '@ActivityLog(TERM_ASSIGNMENT_UPDATED) emits BEFORE/AFTER state for audit'
    - |-
      **STRENGTHENED batch K**: Description-mention guards on update/delete
      prevent broken references — renaming a term while it is mentioned by
      descriptions surfaces as HTTP 400 BadUserRequestException
      "Can't update/delete term, which was mentioned in description" (per
      TermServiceImpl.java:125-134, 156-160). The guard checks all three
      link tables AND filters parent status != DELETED.
    - |-
      **STRENGTHENED batch K**: Unhandled-mention staging with
      auto-resolution is INTENTIONAL forward-compat — operators can
      reference terms they plan to create later; the platform reconciles
      when the term arrives (TermServiceImpl.java:421-442).
  weaknesses:
    - 'HEADLINE: SecurityRule path mismatch (/term singular vs /terms plural) silently
      disables DATA_ENTITY_ADD_TERM + DATA_ENTITY_DELETE_TERM (HIGH)'
    - |-
      **STRENGTHENED batch L** — DELETE half now PRIMARY-SOURCE CONFIRMED;
      the bug-shape is now symmetrically pinned at both controller methods
      AND the service tier; REFACTOR-217 fix is one PR covering both
      SecurityRule paths
    - Term-linking side-effect via description-write path bypasses DATA_ENTITY_ADD_TERM
      dedicated permission
    - Cross-namespace term assignment unconstrained even when path is fixed
    - DISABLED-mode anonymously reachable — anyone can corrupt term linkage
    - |-
      **NEW HIGH batch K**: Second SecurityConstants bug —
      /api/alerts/{id}/status PUT gated by DATASET_FIELD_ADD_TERM (a Term
      permission on an Alert path). Two-way bypass: operators with
      DATASET_FIELD_ADD_TERM can change alert statuses; operators with
      DATA_ENTITY_ALERT_RESOLVE cannot.
      (TermServiceImpl.md:bugs_limitations_corner_cases.[1])
    - |-
      **NEW MEDIUM batch K**: TAG_CREATE bypass via TermServiceImpl.upsertTags
      — a user with TERM_TAGS_UPDATE can create new tags through
      tagService.getOrCreateTagsByName, bypassing TAG_CREATE. Same
      architectural class as REFACTOR-199 (Owner auto-create).
      (TermServiceImpl.md:bugs_limitations_corner_cases.[10])
    - |-
      **NEW MEDIUM batch K**: NAMESPACE_CREATE bypass via createTerm /
      updateTerm — TERM_CREATE / TERM_UPDATE allows creating namespaces
      through namespaceService.getOrCreate(name).
      (TermServiceImpl.md:security.known_security_gaps.[4])
    - |-
      **NEW LOW batch K**: BadUserRequestException error messages leak
      operational state — "Term already assigned to data entity", "Can't
      update term, which was mentioned in description" — enumeration vector
      for cross-namespace probing.
      (TermServiceImpl.md:security.known_security_gaps.[6])
    - |-
      **NEW MEDIUM batch L**: Silent-204 on no-op DELETE compounds with
      activity-event-fires-regardless — auditors investigating "who removed
      term T from entity E" cannot distinguish real removals from no-op
      DELETEs (the activity feed records BEFORE=AFTER for both).
      (deleteTermFromDataEntity.md:bugs_limitations_corner_cases.[1,2])
performance_aggregate:
  overall: MEDIUM
  weaknesses:
    - Activity-handler captures BEFORE+AFTER terms-list by RE-querying twice (2x O(N)
      per call) — quadratic-shape cost at extreme term counts
    - No method-level observability (no @Timed, no Micrometer counter)
    - |-
      **NEW MEDIUM batch K — REFACTOR-228 PRIMARY-SOURCE**: TermAssignmentActivityHandler
      triple-re-query — removeTermFromDataEntity emits TERM_ASSIGNMENT_UPDATED;
      the handler's getContextInfo re-queries getDataEntityTerms (1st full-list)
      BEFORE method execution; the method itself re-queries (2nd full-list)
      to drive the markEntityUnfilled decision; the handler's getUpdatedState
      re-queries AGAIN (3rd full-list) AFTER. For a data entity with 100
      linked terms, a single de-link produces 3 full-list re-queries plus
      1 DELETE. Same pattern on removeTermFromDatasetField.
      (TermServiceImpl.md:bugs_limitations_corner_cases.[4]) —
      **STRENGTHENED batch L** — confirmed at the deleteTermFromDataEntity
      primary source (the controller-method sidecar names the same handler
      overhead at performance.known_performance_gaps.[0])
    - |-
      **NEW MEDIUM batch K**: Broken pagination on listByTerm — total
      reflects page size not full size; hasNext hard-coded false.
      (TermServiceImpl.md:performance.known_performance_gaps.[1])
    - |-
      **NEW LOW batch K**: Description-edit auto-link runs 4-5 DB statements
      even on no-op edits (description unchanged); no early-exit when terms
      == existing description-link set.
      (TermServiceImpl.md:performance.known_performance_gaps.[3])
