    (single probe, three feature assertions) — POST a forged
    AlertManager payload (F-007 anonymous-under-DISABLED entry
    point) with the `description` field containing a Slack
    mrkdwn-injection vector (e.g. `@channel <https://attacker.example|click
    here>`). Observe: (a) F-007 — the OPEN alert row is created
    in the ALERT table with `entity_oddrn` pointing at any chosen
    data entity; (b) F-009 — the WAL stream picks up the INSERT
    + the dispatcher fans out + Slack delivers the message; (c)
    F-004 — the Slack channel renders the `@channel` broadcast +
    the fake-link as the 6th XSS surface in the F-004 family.
    SINGLE PROBE pins THREE feature contracts simultaneously.
    Cross-link to F-009 batch Y probe P-W-3.

    (3) F-007 INGEST AUDIT-EMISSION GAP CHAINS WITH F-009 DELIVERY
    AUDIT-SILENCE — F-007's batch-S audit-emission asymmetry
    (WEBHOOK INGRESS gap) extends through the F-009 batch Y
    findings to the OUTBOUND DELIVERY surface. The combined
    silence: an operator has NO audit trail for (a) who/what
    pushed the AlertManager payload (F-007 INGEST audit-silence),
