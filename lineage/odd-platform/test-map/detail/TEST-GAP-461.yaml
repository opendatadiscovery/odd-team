  - "DOC-NNN candidate: PII redaction is not part of the notification contract"
proposed_action: |-
  Unit test with an AlertNotificationMessage whose dataEntity.name='customer_pii_export'. Drive dispatcher.process(...). Capture the AlertNotificationMessage handed to each sender mock; assert ALL THREE senders received the literal 'customer_pii_export' string with NO redaction applied. LOCKS the current no-redaction posture; promotes to a fix-required regression when a redaction hook lands.
