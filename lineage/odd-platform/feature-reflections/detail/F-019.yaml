      exactly four mutation-path matches, zero GET matches). OwnerController.getOwnerList
      (lines 30-38) carries no @PreAuthorize, no programmatic check. Per the
      platform's central authorization design, an endpoint with no matching rule
      is allowed for any authenticated caller (read-collaborative posture,
      ADR-CANDIDATE-003). The OwnersList UI consumes this freely with no ids/
      allowedForSync filter — any signed-in user sees the full directory + the
