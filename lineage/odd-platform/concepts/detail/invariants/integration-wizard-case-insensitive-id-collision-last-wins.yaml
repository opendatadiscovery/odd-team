notes: |-
  NEW invariant captured in batch 2026-05-25-ZD. The case-insensitive
  comparator is intentional (operators look up by id without caring
  about case) but the merge function is silently destructive (vs the
  fail-fast pattern the boot-time YAML-parse path uses). The
  asymmetry — fail-fast on YAML parse error, silent-drop on id
  collision — is an internal inconsistency that the maintainer may
  not have intended.

  DOC-NNN candidate: a single line on the wizard live page making
  the case-insensitive id uniqueness requirement explicit.
