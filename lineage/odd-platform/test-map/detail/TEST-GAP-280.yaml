surfaced_by:
- getDataEntityDownstreamLineage.md:bugs_limitations_corner_cases.[2]
behaviour: No bound on `expanded_entity_ids` list size — OpenAPI schema has no `maxItems`;
  the list flows into `DATA_ENTITY.ID.in(rootIds)` which hits Postgres's 32K-parameter
  limit. A sufficiently large list (~30K IDs) yields a non-actionable driver error
  rather than a 400.
