mitigations_unimplemented:
  - |-
    Add a SecurityRule entry for /api/dataentitygroups/{id}/lineage gated by a
    new DATA_ENTITY_GROUP_READ_LINEAGE permission (or the existing
    DATA_ENTITY_VIEW permission applied at the DEG layer) — closes the
    READ-side asymmetry at the gate.
  - |-
    Add an anchor-set defence at the service layer — LineageServiceImpl
    should consume AuthIdentityProvider and resolve the caller owner before
    enumerating DEG members; filter members to those the caller has owner-side
    visibility on (with an explicit fall-through to "show the full DEG if
    caller is on a Domain Admin role").
  - |-
    Doc: extend /configuration-and-deployment/enable-security/authorization
    with a "Read-side posture" section explicitly stating that DEG-lineage
    READS are cross-owner-readable while DEG-membership WRITES are RBAC-gated
    — operators must understand the asymmetry.
  - |-
    Doc: extend /features/data-lineage with a sub-section on DEG-lineage
    surfacing the cross-owner-readable posture; the live page is currently
    silent on the WHO-can-see question for DEG lineage.
notes: |-
  This invariant strengthens the broader Read-collaborative cross-owner
  enumeration pattern by surfacing a SPECIFIC asymmetry: the platform is
  CAREFUL about WRITE-side gating on DEG membership but DELIBERATE about
  the BYPASS on the corresponding READ side. The shape is consistent with
  the platform-wide read-collaborative posture (ADR-CANDIDATE-003) but the
  asymmetry is operationally surprising — operators reading the
  /permissions catalog see DATA_ENTITY_ADD_TO_GROUP / DELETE_FROM_GROUP
  and reasonably assume "DEG membership is RBAC-protected"; the READ-side
  silence is undisclosed.

  The DEG-lineage read is the WIDER blast — per-connected-component
  partitioning at LineageServiceImpl.java:200-216 surfaces co-membership
  shape across owners; a multi-team Domain exposes "team A's entity X
  shares a pipeline with team B's entity Y" even when the individual
  entities are not cross-team-searchable.

  Cross-references:
    - Read-collaborative cross-owner enumeration — the platform-wide
      posture; this is one specific READ surface where the asymmetry is
      operationally surprising.
    - REFACTOR-225 anchor-set single-point-of-failure — DEG-anchored
      lineage is the EVEN-WIDER blast (no anchor-set at all, not just
      single-point-of-failure).
    - DEG-lineage flat-graph operation (get-data-entity-group-lineage-flat-graph)
      — the operation primitive this asymmetry surfaces on.
    - Write-collaborative DEG (write-collaborative-deg-no-deg-side-authorization)
      — the sibling write-side observation; the asymmetry between the two
      surfaces this invariant.
