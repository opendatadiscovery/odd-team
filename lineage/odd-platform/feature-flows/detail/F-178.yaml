observed_vs_expected:
  facets:
  - facet: header concentrates seven distinct affordances — no progressive disclosure
    observed: |-
      Lines 73-148 — one MUI Grid row hosting (1) entity name, (2) class
      badges, (3) type badge, (4) business name edit, (5) stale indicator,
      (6) status badge/selector, (7) group edit, (8) share-to-Slack. Eight
      distinct interactive / informational surfaces in one horizontal strip.
      Permission and feature-flag gates filter the visible affordance set
      per user / per deployment. There is no "more" overflow menu, no
      categorisation, no priority ordering — all eight render inline when
      enabled. Operators must scan eight independent semantics to find the
      action they want.
    expected: |-
      Either (a) a kebab/overflow menu housing secondary actions, OR
      (b) a documented header IA explaining what each affordance does.
    drift_class: header_concentrates_seven_distinct_affordances_no_progressive_disclosure
    evidence:
    - 'DataEntityDetailsHeader.tsx:73-148'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
  - facet: internal-name button label toggles "Edit" vs "Add business name" — intent is same authoring flow
    observed: |-
      Line 92 — `text={internalName ? t('Edit') : t('Add business name')}`.
      Same dialog opens; same write path; same target field. The label
      switch is helpful semantic but creates two distinct affordances
      the operator must learn. Cross-link F-176 — the Description panel
      uses the same pattern (Edit vs Add).
    expected: documented or harmonised affordance copy.
    drift_class: internal_name_button_label_toggles_edit_vs_add_business_name_but_intent_is_same_authoring_flow
    evidence:
    - 'DataEntityDetailsHeader.tsx:91-97'
    provenance: STATIC.
    severity: LOW
  - facet: status select only renders interactive for permission holders — silent for non-holders no read-only indicator
    observed: |-
      Lines 113-122 — EntityStatus is rendered always but its `selectable`
      prop = `isAllowedTo` (the WithPermissions render-prop value). A user
      without DATA_ENTITY_STATUS_UPDATE sees the badge in non-interactive
      mode — no tooltip explaining "you don't have permission to change
      this", no visual "lock" icon, no cursor change. The status text
      reads the same; only clickability differs.
    expected: |-
      Either (a) visual lock indicator on read-only mode, OR (b) tooltip
      explaining the read-only state, OR (c) documented permission model.
    drift_class: status_select_only_renders_for_permission_holders_silent_for_non_holders_no_read_only_indicator
    evidence:
    - 'DataEntityDetailsHeader.tsx:113-122 — WithPermissions render-prop with selectable={isAllowedTo}'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
  - facet: share-to-Slack gated by feature flag — silent when feature disabled no install hint
    observed: |-
      Lines 132-144 — `<WithFeature featureName={Feature.DATA_COLLABORATION}>`.
      When DataCollaboration is disabled (the default per backend
      DataCollaborationProperties — `datacollaboration.enabled=false`),
      the button does not render. There is no "Install Slack integration"
      hint, no documentation cross-link from the header. The feature
      exists in the UI bundle and is wired up — but invisible to operators
      until a platform-operator enables it (P-08 Management surface).
    expected: |-
      Either (a) a "Configure DataCollaboration" affordance for operators
      with permission, OR (b) docs cross-link from the header IA.
    drift_class: share_to_slack_gated_by_feature_flag_silent_when_feature_disabled_no_install_hint
    evidence:
    - 'DataEntityDetailsHeader.tsx:132-144 — WithFeature gate'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
  - facet: stale indicator inherits global 7-day default — no per-class default no operator override at header layer
    observed: |-
      Lines 52-56 — `<MetadataStale isStale={isStale} lastIngestedAt={lastIngestedAt}/>`
      vs `<TimeGapIcon/>`. The `isStale` boolean is server-computed per the
      backend `odd.data-entity-stale-period` config (default 7 days per
      P-01 sub-feature seed "Metadata stale indicator"). All entities use
      the same global threshold regardless of their class — a quality test
      that runs hourly is "fresh" 167 hours after its last run; a daily
      ingestion table is "stale" 1 hour after it should have run.
    expected: |-
      Either (a) per-class default stale period (e.g. quality tests
      stale after 1 day, datasets after 7 days), OR (b) per-entity
      operator override, OR (c) header tooltip explaining the threshold.
    drift_class: stale_indicator_metadata_stale_icon_pre_dates_per_class_default_silently_inherits_global_seven_day_default
    evidence:
    - 'DataEntityDetailsHeader.tsx:50-61 — header render of MetadataStale + TimeGapIcon'
    - 'system-mission.md P-01 sub-feature seed — odd.data-entity-stale-period default 7 days'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
  - facet: original-name footer renders only when BOTH internal and external present — subtle UX signal
    observed: |-
      Lines 63-70 — `internalName && externalName && (<Grid>... Original
      {externalName}</Grid>)`. The "Original: {externalName}" footer
      appears ONLY when both names exist. An operator who only authored
      a business name (no upstream external name — possible for manually-
      created entities) sees no footer. An operator who has only the
      external name (no business name authored yet) ALSO sees no footer
      (their externalName is in the h0 slot — line 77). The footer's
      semantic is "what was this called BEFORE you renamed it" — only
      visible AFTER the rename. The semantic is correct but discovery-
      hostile: an operator who renamed an entity sees both names; one
      who hasn't sees just the imported name with no hint that a
      business-name option exists (until they spot the "Add business
      name" button on the right).
    expected: documented OR explicit "External name" label always present.
    drift_class: original_name_footer_renders_only_when_both_internal_and_external_present_subtle_ux_signal
    evidence:
    - 'DataEntityDetailsHeader.tsx:63-70 — conditional originalName render'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
  - facet: isStatusDeleted gate hides ALL edit affordances — no global banner explaining why buttons missing
    observed: |-
      Line 47 — `const isStatusDeleted = useAppSelector(getIsEntityStatusDeleted(dataEntityId))`.
      Line 87, 123, and Overview.tsx-side gates ALL check `!isStatusDeleted`
      to hide their edit affordances. A user opening a DELETED entity
      sees the entity render (status badge shows DELETED) but every edit
      button disappears. There is no banner / inline message explaining
      "This entity is DELETED — edits disabled until restored". The
      operator must infer from the missing buttons + the status badge.
    expected: |-
      Either (a) an info banner near the status badge explaining the
      consequence of DELETED state, OR (b) documented behaviour at the
      Data Discovery / Statuses doc page.
    drift_class: isstatusdeleted_gate_hides_all_edit_affordances_no_global_banner_explaining_why_buttons_missing
    evidence:
    - 'DataEntityDetailsHeader.tsx:47, :87, :123'
    - 'OverviewTags.tsx:20, :39; OverviewTerms.tsx:25, :32; OverviewGroups.tsx:26 — sibling isStatusDeleted gates'
    provenance: STATIC.
    severity: MEDIUM
    ui_unverified: true
