behaviour: |-
  Soft-deleted-entity alert-read regression-pin for getDataEntityAlerts (MEDIUM — intentional behaviour with no test). `AlertServiceImpl.getDataEntityAlerts` (line 140) and `getDataEntityAlertsCounts` (line 147) both gate on `checkDataEntityExistence` (lines 327-335), which calls `dataEntityRepository.existsIncludingSoftDeleted(dataEntityId)`. The repository helper name (`existsIncludingSoftDeleted`) and its sibling (`existsNonDeletedByDataSourceId` at line 158 — which DOES apply `addSoftDeleteFilter(...)`) demonstrate that the codebase distinguishes the two soft-delete postures by helper name. The deliberate choice of `existsIncludingSoftDeleted` for the alert-read path is consistent with the `getDataEntityDetails` neighbour sidecar's observation that soft-deleted entities ARE returned by the detail page — the pattern is 'soft-deleted entities remain readable for audit / housekeeping use cases'. The sibling `listByOwner` query (ReactiveAlertRepositoryImpl.java:166-167) DOES filter `DATA_ENTITY.STATUS != DELETED` — confirming the asymmetry. The audit-export workaround from the live alerting doc (WebFetched 2026-05-19) implicitly depends on this — operators must be able to read alerts on soft-deleted entities to export the audit trail before housekeeping deletes them. NO test asserts this intentional behaviour. A future tightening (e.g. a maintainer changing `existsIncludingSoftDeleted` to `exists` to 'fix' the asymmetry) would silently break the audit-export workaround with NO regression signal. Cross-pillar P-07 (Alerts feature audit-export workaround depends on this).
