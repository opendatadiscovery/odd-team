proposed_action: |-
  Four React-Testing-Library tests in AppInfoMenu.a11y.test.tsx:
  (a) Mount AppInfoMenu; tab to icon-button; fireEvent.keyDown
  Enter; assert menu opens (role=menu in DOM).
  (b) Tab to icon-button; fireEvent.keyDown Space; assert menu opens.
  (c) Open menu; arrow-down sequence; assert focus walks through
  menu items in DOM order.
  (d) Open menu; Esc keyDown; assert menu closes AND focus returns to
  icon-button.
  RED today on (a) and (b) (no Enter/Space handler); fix is a one-line
  addition of onClick={openMenu} or onKeyDown handler at line 81.
  Tests (c) and (d) verify that MUI Menu's default keyboard handling
  works once the open path is fixed — likely GREEN-out-of-box after
  the icon-button wiring is corrected.
