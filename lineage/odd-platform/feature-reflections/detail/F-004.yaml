- id: H-002
  hypothesis: "When an operator submits an empty (or whitespace-only) description body to clear a description, the platform stores SQL NULL and a subsequent page reload shows the description as cleared/empty."
  derivation: "Repo normalises StringUtils.isEmpty(description) ? null : description; OpenAPI marks internal_description required (forces the key, not non-empty content). Clearing is a normal operator action."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The DB-write half is confirmed: setInternalDescription normalises empty/whitespace to NULL at
      ReactiveDataEntityRepositoryImpl.java:431, and the filled-flag toggles to unfilled. BUT the immediate
      PUT response does NOT reflect the DB truth — DataEntityServiceImpl.upsertDescription line 329-332
      binds the response from formData.getInternalDescription() (the REQUEST payload), not a post-write
      re-read. So a PUT of {"internal_description": "   "} echoes "   " in the 200 response while the column
      stores NULL. The UI re-reads the redux slice populated from that echo, so immediately after save the
      preview can briefly reflect the echoed value rather than the stored NULL; a fresh GET /api/dataentities/{id}
      reconciles to the cleared state. The user-facing "clears the description" promise holds on reload; the
      response-vs-storage decoupling is the gap (a programmatic client comparing the PUT echo to a later GET
      sees a mismatch on the whitespace case).
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription
        section: invariants[0]
        cite: "ReactiveDataEntityRepositoryImpl.java:431"
        note: "empty/whitespace → NULL normalisation"
      - sidecar: odd-platform__java__service__service__DataEntityServiceImpl
        section: invariants[3] + downstream_side_effects[F-004].exact_response_binding
        cite: "DataEntityServiceImpl.java:329-332"
        note: "response echoes request payload, not post-write pojo"
      - sidecar: odd-platform__ts__react-component__component__DataEntityDescription
        section: bugs_limitations_corner_cases (empty-string echo)
        cite: "InternalDescription.tsx:44 + InternalDescriptionPreview.tsx:20"
        note: "UI empty-state branch keys on !description; coupling to backend null-to-empty conversion"
