proposed_action: |-
  Add `AttachmentFilenamePathTraversalAndCrlfInjectionTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Six test methods:
  1. `initiateFileUpload_filenameWithDotDotSlash_storesOutsideAttachmentLocalPath_LOCALStorage` — configure `attachment.storage=LOCAL` + `attachment.local.path=/tmp/odd/test-attachments`; POST `/api/dataentities/100/files/uploads` with `fileName: "../../../etc/path-traversal-evidence.txt"`; complete the upload; assert the stored path resolves OUTSIDE `/tmp/odd/test-attachments` (the path-traversal escaped the base directory). PIN the current vulnerability.
  2. `initiateFileUpload_filenameWithNulByte_acceptsAndPersists` — sister test for NUL-byte injection (Java + Postgres may truncate the filename at NUL).
  3. `downloadFile_filenameWithCRLF_responseCarriesInjectedHeaders` — upload a file with `fileName: "foo\\r\\nX-Injected: yes"`; GET /api/dataentities/100/files/{id}; assert the response includes `X-Injected: yes` as a separate header (the CRLF in fileName injected the header).
  4. `downloadFile_filenameWithQuote_responseHeaderTruncated` — upload a file with `fileName: "foo\\\".txt"`; GET; assert the Content-Disposition header is truncated at the quote (RFC 6266 quoting absent).
  5. `downloadFile_filenameWithNonAscii_responseDoesNotApplyRfc5987Encoding` — upload a file with `fileName: "déjà-vu.txt"`; GET; assert the Content-Disposition uses the raw UTF-8 bytes (NO RFC 5987 percent-encoding). Pin the encoding-class.
  6. `initiateFileUpload_filenameWithDotDotSlash_REMOTEStorage_S3ObjectKeyTraversesOutsideExpectedPrefix` — sister test for REMOTE storage (S3 object key prefix manipulation).

  Add a `// REGRESSION-PIN — filename is the single weakest input in the attachment subsystem. Path-traversal writes outside attachment.local.path; CRLF injects headers; quote truncates; non-ASCII bypasses RFC 5987. A REFACTOR applying Path.normalize + base-path-prefix-assert + RFC 6266 quoting will break tests #1, #3, #4 simultaneously; the maintainer must re-author them to assert the sanitized behaviour.` comment block.

  Pair with REFACTOR-NNN closing both halves: (a) at FileMapper, normalise fileName + reject path-traversal-escapes; (b) at downloadFile, wrap fileName in RFC 6266 quoted-string or apply RFC 5987 encoding. Pair with DOC-NNN warning operators about the LOCAL-storage path-traversal surface until the code fix lands.
