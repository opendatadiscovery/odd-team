  1. `getDataSourceList_substringNotPrefixQuery_emptyItemsWithNonZeroTotal_pinsRefactor425Divergence` — register a data source named "my-snowflake-dev"; GET /api/datasources?query=snow (substring, not prefix); assert `items` is empty AND `page_info.total` is non-zero (the "0 of 1" phantom). PIN the divergence (P-036).
