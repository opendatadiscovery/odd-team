pillars_affected: [P-06]
surfaced_by:
  - 'terms.md:concepts.invariants.[TermDetailsRoutes object IS the single source of truth for the 5 sub-routes — but TermDetailsRoutes.tsx re-hardcodes each string literally]'
  - 'terms.md:bugs_limitations_corner_cases.[Sub-route literal "overview" is hard-coded as the default arg in termDetailsPath rather than referenced via TermDetailsRoutes.OVERVIEW]'
behaviour: |-
  **LOW — `TermDetailsRoutes` (termsRoutes.ts:25-31) declares the 5 sub-route literals as a frozen `as const` object** (`OVERVIEW: 'overview'`, `LINKED_ENTITIES: 'linked-entities'`, `LINKED_COLUMNS: 'linked-columns'`, `LINKED_TERMS: 'linked-terms'`, `QUERY_EXAMPLES: 'query-examples'`) — **but `TermDetailsRoutes.tsx` (the renderer) re-hard-codes each string literally** at lines 29, 30, 31, 32, 34, AND 46 (the Navigate fallback). Same anti-pattern in `termsRoutes.ts:37` itself: the default-arg value `'overview'` is a plain string literal NOT `TermDetailsRoutes.OVERVIEW`.

  **The invariant the SoT object PROMISES**: rename `OVERVIEW: 'overview'` to `OVERVIEW: 'home'` in termsRoutes.ts and the URL generator (`termDetailsPath`) starts emitting `/terms/42/home`. The RENDERER at TermDetailsRoutes.tsx:29 still matches `<Route path='overview'>` — silently breaking every term-overview link without a build error or a failing test.

  **Same shape as the alerts sidecar `bugs_limitations_corner_cases.[1]`** (alertsRoutes hardcoded slugs) and the management sidecar `bugs_limitations_corner_cases.[the slugs in ManagementRoutes are re-hard-coded inside ManagementRoutes.tsx]` — a project-wide PATTERN where the routes module DECLARES the slugs but the renderer DOES NOT IMPORT them.

  **No test pins this** — renaming any of the 5 literals in `TermDetailsRoutes` without updating the corresponding `<Route path='...'>` declaration in TermDetailsRoutes.tsx ships green; an operator clicks the renamed tab link and lands on a blank page (because no route matches the new URL).

  **Why this is project-wide structural fragility**: every multi-tab pillar in the SPA has this same shape (Alerts, Management, Terms — verified by sidecars). Without a single-source-of-truth invariant test, the SoT object is a documentation artifact, not a load-bearing constraint.
test_class: missing-unit
criticality_rationale: |-
  Sidecar rates this LOW and held LOW: (a) renaming events are rare and reviewer-visible; (b) the symptom (blank page on link click) is operator-discoverable; (c) backend RBAC and routing catch every actual data flow regardless of UI tab slug. Logged primarily to capture the SoT-violation PATTERN at the routes-tier so a future cleanup pass (or a generator-based fix) has a TEST-GAP anchor. NOT escalated for cross-pillar — sticks within P-06; the pattern's analogs in P-07 (alerts) and P-08 (management) are recorded as cross_references.
