gap_id: TEST-GAP-082
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java ActivityController controller-method:getActivity
surfaced_by:
- getActivity.md:tests_coverage_semantic.uncovered_behaviours.[6]
- getActivity.md:security.known_security_gaps.[2] (severity MEDIUM)
behaviour: Cross-owner enumeration via `userIds` and `ownerIds` filter parameters
  — caller submits a list of candidate user/owner ids and observes response cardinality
  to learn which ids correspond to active users/owners. No authorization gate prevents
  this; no rate limit on `/api/activity`.
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ActivityFeedEnumerationTest.java
  name: getActivity_userIdsAndOwnerIdsFilter_revealsExistenceOfTargetUserOrOwner
evidence:
- 'getActivity.md says: ''A caller can submit userIds=[1,2,3,...,N] to probe which
  users have generated platform activity in the window — a low-cost user-id enumeration
  vector'''
- 'concepts.yaml:entities[Activity Feed].security_aggregate.weaknesses.[1] verbatim:
  ''userIds/ownerIds filter parameters not validated — submitting candidate id lists
  allows enumeration of which users/owners have generated platform activity (severity
  MEDIUM)'''
cross_references:
- concepts.yaml:entities[Activity Feed].security_aggregate.weaknesses.[1]
proposed_action: Add `WebTestClient` test sweeping `userIds=[1..100]` over a window
  where only userId=42 has activity; assert response cardinality differs vs an inactive
  sweep. Locks the enumeration vector.
