terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Two distinct response shapes:
    (a) `getSearchFacetList` → 200 OK with `SearchFacetsData` (entity-class
    aggregate counts + catalog-wide `total` + owner-scoped `myObjectsTotal`
    + the session's `query` string + `FacetState` listing selected/unselected
    filters).
    (b) `getFiltersForFacet` → 200 OK with `Flux<CountableSearchFilter>`
    (paginated list of `{name, count, selected}` filter options for
    the chosen facet type).
    Both responses surface catalog-wide cardinality across owner boundaries.
  evidence: |-
    SearchController.java:30-47 + SearchServiceImpl.java:51-72,
    122-155 + ReactiveSearchFacetRepositoryImpl.java:163-534.
  cardinality_per_call: |-
    SearchFacetsData = 1 payload per GET. CountableSearchFilter[] =
    0..size rows per GET; pagination unbounded at controller + OpenAPI
    + repository (no minimum / maximum at any layer). size=1M triggers
    single jOOQ query bounded only by Postgres / network buffers.
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: cross-owner facet enumeration — REFACTOR-024 family extension to facet surface
    observed: |-
      The endpoints have NO permission gate at the controller, NO entry
      in SecurityConstants.SECURITY_RULES for any `/api/search/*` path
      (verified by Grep search/facet against SecurityConstants.java —
      zero matches), and the facet aggregators in
      ReactiveSearchFacetRepositoryImpl.java:163-534 have NO OWNERSHIP
      join, NO owner predicate. Only `getDataEntityDefaultConditions`
      (HOLLOW=false, STATUS != DELETED, EXCLUDE_FROM_SEARCH NULL-or-false)
      apply. An authenticated caller drilling `getFiltersForFacet(OWNERS)`
      enumerates EVERY OWNER NAME in the platform + per-owner entity
      counts. Drilling NAMESPACES (via the aggregate getSearchFacetList
      response) enumerates every namespace. TAGS / GROUPS / TYPES /
      STATUSES enumerate the full catalog cardinality. The facet COUNTS
      surface is sharper than the search RESULTS surface — an attacker
      who cannot read an entity directly can still infer its existence
      by watching the OWNERS / NAMESPACES / TAGS counts increment as
      ingestion fires. Pairs with REFACTOR-024 (batch alert read) and
      REFACTOR-340 (per-entity alert read).
    expected: |-
      Either: (a) add owner-scoping to facet counts — every aggregator
      JOINs OWNERSHIP and applies a per-owner filter; OR (b) document
      the cross-owner posture explicitly on the live Search and
      Filtering page so operators understand the access model. The
      structural precedent (read-collaborative posture across the
      platform) suggests (b) is the platform's chosen direction.
    drift_class: cross_owner_facet_enumeration
    provenance: |-
      STATIC — primary-source in batch-M SearchController.facets sidecar
      security.known_security_gaps[0] + bugs_limitations_corner_cases[0]
      + security.owner_scoping + SearchController.java:30-47 (no
      @PreAuthorize) + SecurityConstants.java (no rule) +
      ReactiveSearchFacetRepositoryImpl.java:163-534 (no OWNERSHIP
      join) + WebFetch search page 2026-05-19 (silent on the posture).
      Severity: HIGH (catalog cardinality enumeration). Pairs with
      REFACTOR-024 (catalog-wide cross-owner enumeration on getAllAlerts)
      and REFACTOR-340 (per-entity alert cross-owner read).
  - facet: bearer-token-shaped session UUIDs — no user binding
    observed: |-
      `search_facets` schema at V0_0_1__init.sql:204-211 has NO
      `owner_id`, `created_by`, or `user_id` column. `SearchServiceImpl.search`
      creates a row without capturing the principal (lines 75-82);
      `updateFacets` accepts any caller for any UUID (lines 84-96);
      `fetchFacetState` is a raw UUID lookup with no ownership check
      (lines 157-160); `ReactiveSearchFacetRepositoryImpl.get(UUID)`
      at lines 99-106 is a raw UUID-keyed UPDATE-RETURNING. Any
      authenticated user in possession of any other user's UUID can
      READ, UPDATE, and DRIVE that session. Concrete impact:
      (a) an operator who copies a search URL into a bug report exposes
      their entire saved-filter state including My Objects posture;
      (b) a CSRF-style cross-tab actor with browser URL-bar access
      can hijack the session; (c) authenticated UUID-probing via
      `GET /api/search/{guess}` yields 404 OR 200+session-data. UUID
      space is 122-bit (brute force infeasible) but URL leakage is not.
    expected: |-
      Either: (a) add `owner_id` column to search_facets + populate
      from the SecurityContext at create-time + enforce on read/update;
      OR (b) document the bearer-token semantic explicitly so operators
      treat the UUID as a secret.
    drift_class: search_session_no_user_binding
    provenance: |-
      STATIC — primary-source in batch-M SearchController.facets sidecar
      implicit_adrs[2] (the deliberate schema-level decision) +
      bugs_limitations_corner_cases[1] +
      security.known_security_gaps[1] +
      V0_0_1__init.sql:204-211 (schema with no owner column +
      acknowledging TODOs but no defence of the unscoped posture).
      Severity: HIGH (cross-link batch-E SearchController.search same
      finding).
  - facet: tsquery operator injection DoS via persisted query (SECOND invocation site)
    observed: |-
      JooqFTSHelper.tsQuery at lines 164-168 does NOT escape tsquery
      operators; persisted `query_string` reaches `to_tsquery(?)`
      directly via JooqFTSHelper.java:100-105. A caller who POSTs a
      search with `query='foo )('` persists the row in
      `search_facets.query_string`; every subsequent facet aggregator
      that joins to SEARCH_ENTRYPOINT and applies
      `ftsCondition(SEARCH_ENTRYPOINT.SEARCH_VECTOR, state.getQuery())`
      at ReactiveSearchFacetRepositoryImpl.java:182, 267, 469, 582 fails
      at `to_tsquery` parse time with Postgres syntax error 42601 → 500.
      The session becomes permanently broken — the row is reachable
      but every facet read 500s. Same code path as batch-H
      getHighlightedResult finding; the facet endpoints are a SECOND
      invocation site for the same shape.
    expected: |-
      Either: (a) escape tsquery operators in JooqFTSHelper.tsQuery
      before joining (use the proper to_tsquery quoting API); OR (b)
      validate query_string at create-time and reject inputs with
      tsquery syntax characters.
    drift_class: tsquery_operator_injection_dos_via_persisted_query
    provenance: |-
      STATIC — primary-source in batch-M SearchController.facets sidecar
      bugs_limitations_corner_cases[5] +
      security.known_security_gaps[2] + JooqFTSHelper.java:100-105,
      164-168 + ReactiveSearchFacetRepositoryImpl.java:182, 267, 469,
      582. Cross-link batch-H getHighlightedResult finding. Severity:
      HIGH (the SECOND invocation site of the same bug raises severity
      because the exploit surface is wider).
  - facet: DISABLED-mode anonymous facet enumeration
    observed: |-
      Under `auth.type=DISABLED` no SecurityContext is populated; the
      missing SecurityRule entry combined with
      `.anyExchange().permitAll()` means any unauthenticated client on
