proposed_action: |-
  WebTestClient integration test (Testcontainers). (a) Create Owner X with user uX, Owner Y with user uY. (b) Create DEG D owned by Y; add 3 members owned by Y (entities y1, y2, y3); add 1 inter-member lineage edge y1->y2. (c) Authenticate as uX (NO membership in Y's owner). (d) GET /api/dataentitygroups/D.id/lineage. (e) Assert HTTP 200 with response payload containing y1, y2 as nodes and the y1->y2 edge — uX successfully enumerated Y's DEG (current contract — REFACTOR-203 DEG sibling). (f) Test comment 'LOCKS the DEG-anchored cross-owner enumeration contract as of 2026-05-19 (REFACTOR-203 DEG sibling). When anchor-set defence-in-depth lands at LineageServiceImpl.getDataEntityGroupLineage, this test FLIPS to expect 403 or empty payload.' (g) Secondary DISABLED-mode test: same payload via anonymous client — assert HTTP 200.
