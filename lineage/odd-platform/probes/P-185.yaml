expected_outcome: |
  Stress question (Category F — ActiveDirectory.domain unvalidated despite
  docs-named requirement):

  ODDLDAPProperties.ActiveDirectory (lines 35-38) declares `boolean enabled`
  and `String domain`. The live LDAP docs (WebFetched 2026-05-26) say `domain`
  is "Required when AD is enabled". The Properties class's `validate()`
  method (lines 40-49) enforces ONLY {url, dnPattern-or-filter} — it does
  NOT enforce {enabled=true → domain non-empty}.

  Pin the hypothesis: with `auth.ldap.active-directory.enabled: true` and
  `auth.ldap.active-directory.domain` UNSET, the platform:
  (a) boots successfully (validate() does NOT throw — confirms the unvalidated
      pairing);
  (b) constructs `new ActiveDirectoryLdapAuthenticationProvider(null, url)`
      at LDAPSecurityConfiguration.java:78 — confirms Spring Security accepts
      the null domain;
  (c) at first login, attempts an AD bind with the missing domain — the
      operator-visible outcome (401 vs unexpected success vs different bind
      shape) is what the probe pins.

  If the platform boots AND first-login returns 401 with no log line naming
  the missing domain, this is the silent-degradation scenario the sidecar's
  bugs_limitations_corner_cases[AD.domain unvalidated] documents.
---
arrange:
  - kind: docker-compose-up
    profile: odd-minimal
    services: [odd-platform, odd-postgres, openldap]
  - kind: docker-compose-service
    name: openldap
    description: |
      Seed an OpenLDAP container with one user. The probe uses OpenLDAP
      (not actual Active Directory) — Spring Security's
      ActiveDirectoryLdapAuthenticationProvider talks LDAP-protocol; the
      probe is testing the platform's behavioural shape, not real AD
      semantics.
    env:
      LDAP_ORGANISATION: "Probe Org"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "probe-bind-2026"
    ldif: |
      dn: ou=people,dc=example,dc=com
      objectClass: organizationalUnit
      ou: people

      dn: uid=carol,ou=people,dc=example,dc=com
      objectClass: inetOrgPerson
      uid: carol
      sn: Carol
      cn: Carol User
      userPassword: carol-pass
  - kind: env
    description: |
      Configure auth.type=LDAP with active-directory.enabled=true BUT
      active-directory.domain DELIBERATELY UNSET. The validate() pair check
      ({url, dnPattern-or-filter}) is satisfied via dnPattern, so the
      validation passes; the AD-pair check ({enabled, domain}) is NOT
      enforced by validate().
    vars:
      AUTH_TYPE: LDAP
      AUTH_LDAP_URL: "ldap://openldap:389"
      AUTH_LDAP_DN_PATTERN: "uid={0},ou=people,dc=example,dc=com"  # satisfies validate() at line 45-48
      AUTH_LDAP_ACTIVE_DIRECTORY_ENABLED: "true"
      # AUTH_LDAP_ACTIVE_DIRECTORY_DOMAIN is INTENTIONALLY UNSET — the hypothesis
  - kind: restart-service
    service: odd-platform
    wait_for_healthy: 60s
    capture_boot_log_as: ad_no_domain_boot_log
act:
  - kind: derived
    description: "Verify the platform BOOTED (validate did NOT throw)."
    expressions:
      - "platform_booted_successfully: 'Started OddPlatformApplication' in ad_no_domain_boot_log or 'Started Application' in ad_no_domain_boot_log"
  - kind: form-login
    description: |
      Attempt login as carol. Under the silent-degradation hypothesis, this
      goes through `new ActiveDirectoryLdapAuthenticationProvider(null, ldap_url)`.
      Spring's AD provider with null domain falls back to a bind shape that
      will either (a) succeed against the openldap user with no UPN suffix,
      (b) fail with 401 because the provider expects UPN-form binds, or
      (c) throw at provider-construction (unlikely — Spring accepts null).
    username: carol
    password: carol-pass
    capture_session_as: carol_session_attempt
    capture_status_as: carol_login_status
  - kind: rest
    description: "Verify whether carol's session is authenticated."
    method: GET
    path: /api/identity
    headers:
      Cookie: "${carol_session_attempt}"
    capture_as: carol_identity
observe:
  - kind: derived
    expressions:
      - "platform_booted: platform_booted_successfully == True"
      - "validate_did_not_throw: 'IllegalStateException' not in ad_no_domain_boot_log or 'LDAP server url is not defined' not in ad_no_domain_boot_log"
      - "boot_log_warns_about_missing_domain: ('domain' in ad_no_domain_boot_log.lower() and ('missing' in ad_no_domain_boot_log.lower() or 'required' in ad_no_domain_boot_log.lower() or 'null' in ad_no_domain_boot_log.lower()))"
      - "carol_login_succeeded: carol_login_status in [200, 302]"
      - "carol_login_returns_401: carol_login_status == 401"
      - "carol_identity_authenticated: carol_identity.status_code == 200 and 'carol' in carol_identity.body"
assert:
  # PRIMARY HYPOTHESIS: validate() does NOT catch the missing domain.
  - "platform_booted == True"
  - "validate_did_not_throw == True"
  # SECONDARY HYPOTHESIS: there is NO platform-side warning about the
  # missing domain in the boot log. Silent degradation.
  - "boot_log_warns_about_missing_domain == False"
  # TERTIARY OBSERVATION: what does first-login look like?
  # The assertion records the load-bearing operator-visible failure pattern:
  # the AD-provider-with-null-domain typically rejects non-UPN binds.
  - "carol_login_succeeded == False or carol_identity_authenticated == False"
cleanup:
  - kind: docker-compose-down
    destroy_volumes: true
cross_references:
  related_sidecars:
    - odd-platform__java__auth__config-properties-class__ODDLDAPProperties
