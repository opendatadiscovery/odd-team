proposed_action: |-
  Add `ActivityCountsNullDateValidationAsymmetryTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` using `@WebFluxTest(ActivityController.class)` + `WebTestClient`. Three test methods:

  1. **`getActivityCounts_nullBeginDate_pinUnboundedScanBehaviourVsGetActivityList400`** (HEADLINE):
     - Act: `webTestClient.get().uri("/api/activity/counts").exchange()` (no query params)
     - Assert (PIN current behaviour): `expectStatus().isOk()`; response body shape is `{ "total_count": <N>, "my_objects_count": <M>, "downstream_count": ..., "upstream_count": ... }`
     - Assert (DOCUMENT asymmetry): query the same caller on `/api/activity` (no dates) and verify HTTP 400 with BadUserRequestException error body
     - Comment: this test PINS the asymmetric validation. A future REFACTOR-NNN that adds the symmetric guard will need to UPDATE this test to expect 400 — a coordinated change.

  2. **`getActivityCounts_validBeginAndEndDate_returnsScopedCounts_pinHappyPath`** (CONTROL):
     - Act: `webTestClient.get().uri("/api/activity/counts?begin_date={begin}&end_date={end}", begin, end).exchange()`
     - Assert: 200 OK with all four counts populated; the counts are scoped to the date window.

  3. **`getActivityCounts_nullDatesUnderLoad_consumesR2dbcPool_pinPerformanceCliff`** (PERFORMANCE):
     - Arrange: seed 100K activity rows across 10 historical partitions. Configure R2DBC pool size = 4.
     - Act: dispatch 10 concurrent calls to `/api/activity/counts` (no dates) within 100ms window.
     - Assert: at least one call surfaces a connection-pool exhaustion error OR a long latency (> 5s); PIN the operational risk under load.

  After P-023 measures the empirical latency on a populated platform, refine the test's thresholds. Cross-pair with REFACTOR-NNN to add the symmetric guard (the test then becomes the no-regression pin for the fix). Cross-pair with DOC-NNN to update the OpenAPI spec + activity-feed.md.
