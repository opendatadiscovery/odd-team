gap_id: TEST-GAP-107
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java AuthorizationManagerCondition config-key-consumer:auth.type@L11
surfaced_by:
- AuthorizationManagerCondition@L11.md:bugs_limitations_corner_cases.[1]
- AuthorizationManagerCondition@L11.md:security.known_security_gaps.[1]
behaviour: 'Under `auth.type=LOGIN_FORM`, LoginFormSecurityConfiguration.java:53-66
  wires `.authorizeExchange(...).pathMatchers("/**").authenticated()` ONLY — `AuthorizationCustomizer`
  (Policies/Permissions/Roles/Owners framework) is silently absent. The composite
  `AuthorizationManagerCondition` correctly returns FALSE for LOGIN_FORM (intentional),
  but the consequence is undocumented: every authenticated user can hit every endpoint
  that depends on AuthorizationCustomizer for fine-grained access control. Severity
  HIGH per concept.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/config/AuthorizationFrameworkWiringTest.java
  name: loginForm_authorizationCustomizerAbsent_authenticatedUserBypassesPolicyGates
evidence:
- 'AuthorizationManagerCondition@L11.md says: ''auth.type=LOGIN_FORM runs WITHOUT
  the AuthorizationCustomizer ... authenticated-but-unauthorized: every authenticated
  user can hit every endpoint that depends on AuthorizationCustomizer for fine-grained
  access control'' (severity HIGH)'
- 'concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[1] verbatim: ''LOGIN_FORM
  runs without AUTHORIZATION'''
- 'Grep against `odd-platform-api/src/test` for `AuthorizationManagerCondition|OAuthCondition`:
  0 matches'
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[1]
- concepts.yaml:entities[Auth Mode].security_aggregate.authorization_consistency
proposed_action: Add Spring context-startup test parameterised over `auth.type ∈ {LOGIN_FORM,
  OAUTH2, LDAP, DISABLED}`; assert AuthorizationCustomizer bean is present ONLY for
  OAUTH2 + LDAP. Pair with a WebTestClient test asserting that under LOGIN_FORM, an
  authenticated user without any Permission can reach a DATA_ENTITY-Permission-gated
  endpoint (current vulnerable posture).
