description: |-
  **NEW INVARIANT, batch 2026-05-19J — UI-side semantic surfaced across multiple
  components**. **STRENGTHENED batch 2026-05-20-Q to 6-component pattern with the
  4 Management list components**. **REFINED batch ZH (2026-05-26) to distinguish
  `WithPermissions` (the actual gate) from `WithPermissionsProvider` (a sibling
  that LOOKS like a gate but only seeds context).**

  ## REFINED — batch ZH (2026-05-26)

  Batch ZH refines this invariant by distinguishing TWO permission-related
  React components that are easily confused:

  (a) **`WithPermissions`** (no Provider suffix) at
      `components/shared/contexts/Permission/WithPermissions.tsx:11-32`:
      THIS is the actual gate. Returns `null` when the user lacks the
      specified permission (line 27-29). The HIDE-not-DISABLE pattern
      is implemented here. Wrap an Edit button, Delete button, Add
      CTA, mutation menu item with this HOC — the affordance
      disappears for users without the permission.

  (b) **`WithPermissionsProvider`** (with Provider suffix) at
      `components/shared/contexts/Permission/WithPermissionsProvider.tsx:11-49`:
      THIS does NOT gate. It unconditionally renders its child
      (`{render()}` at line 25, `<Component />` at line 36, or
      `{children}` at line 46); it only wraps the child in
      `PermissionProvider` which computes an `isAllowedTo` boolean
      and exposes it via React Context for descendant components to
      consult. Wrap a route mount with this — the route STILL
      renders for users without the listed permissions; the
      permissions become the "active set" that descendant
      `<WithPermissions>` HOCs check against.

  **The 5 batch-ZH route sidecars** confirm: when a route mount lists
  permissions in WithPermissionsProvider (LookupTables on
  LOOKUP_TABLE_CREATE/UPDATE/DELETE, DataModelling on
  QUERY_EXAMPLE_CREATE, etc.) — the page RENDERS for every
  authenticated user; only the inner WithPermissions-wrapped
  mutation buttons hide. The partial-gating semantic is THEREFORE
  baked into the platform's permission-component naming: the
  Provider seeds context, the HOC blocks. A reviewer reading the
  route mount alone misreads the wrapper as a gate.

  The (a) clarification matters because batch ZH revealed that
  several existing 'permission gating' findings (including this
  invariant's batch-J + batch-Q evidence) were partly conflating
  WithPermissions with WithPermissionsProvider. The original
  ORIGINAL pattern (batch J: DataEntityDescription) IS the
  WithPermissions HOC pattern around an Edit button — correctly
  named. The batch-Q strengthening (4 Management list components)
  IS also correctly named (the Create CTA / per-row Edit/Delete
  buttons are WithPermissions). The DataEntityDetails sub-finding
  (wraps header in WithPermissionsProvider carrying 3 permissions)
  was correctly described as a context-seed for descendant
  mutations — the description was accurate; batch ZH NAMES the
  pattern as a first-class distinction.

  ## ORIGINAL — batch J + batch Q

  The platform's UI pattern is to gate MUTATION
  affordances (Edit buttons, Save buttons, mutation menu items) on resource-scoped
  permissions via `<WithPermissions permissionTo={Permission.X}>`, while leaving
  the rendered CONTENT unconditional. **The DataEntityDescription cluster is the
  canonical example**: `InternalDescriptionHeader.tsx:40-50` wraps the Edit/Add
  button in `<WithPermissions permissionTo={Permission.DATA_ENTITY_DESCRIPTION_UPDATE}>`;
  `InternalDescriptionPreview.tsx:32-40` wraps the empty-state "Add Description"
  button identically. The `<Markdown value={value} />` render at
  `InternalDescriptionPreview.tsx:21` runs unconditionally for ANY caller with
  `DATA_ENTITY_VIEW`. The description CONTENT (and any embedded HTML) reaches
  every reader's browser regardless of whether they can edit it. **DataEntityDetails
  follows the same pattern**: the component wraps the header in
  WithPermissionsProvider carrying 3 permissions
  (`DATA_ENTITY_INTERNAL_NAME_UPDATE`, `DATA_ENTITY_GROUP_UPDATE`,
  `DATA_ENTITY_STATUS_UPDATE`) for descendant mutation affordances, but the
  READ of the entity payload + the rendered tab content is unguarded. **The
  semantic IS the read-collaborative posture realised at the UI layer** — the
  partial-gating is INTENTIONAL (the platform deliberately ships cross-owner-readable
  per ADR-CANDIDATE-003). **Fragility**: the gating semantic is SUBTLE enough
  that a refactor "simplifying" the cluster (e.g. wrapping `OverviewDescription`
  in `<WithPermissions>`) would silently break LEGITIMATE READ ACCESS for
  non-editors — and would be undetectable by existing probes (which exercise
  authenticated-writer flows, not authenticated-reader-without-write flows). A
  reviewer reading the source easily mistakes the `WithPermissions` placement as
  "description gating" rather than "edit-button gating". **No UI-side signal**:
  the user does not see a "You don't have permission to edit this entity" banner;
  the edit affordances simply disappear. A user uncertain about why they can/can't
  edit cannot self-diagnose, and operators auditing a user's intent have no log
  trail.

  **BATCH Q EXTENSION — pattern generalised across Management list components**.
  PolicyList + RolesList + OwnersList + CollectorsList all exhibit the SAME
  HIDE-not-DISABLE convention:
    - PolicyList: `<WithPermissions permissionTo={Permission.POLICY_CREATE}>`
      wraps the Create button (PolicyList.tsx:91-98); each PolicyItem wraps
      Edit/Delete in POLICY_UPDATE / POLICY_DELETE
    - RolesList: same shape with ROLE_CREATE / ROLE_UPDATE / ROLE_DELETE
    - OwnersList + EditableOwnerItem: same shape with OWNER_CREATE / OWNER_UPDATE
      / OWNER_DELETE
    - CollectorsList + CollectorItem + CollectorItemToken: same shape with
      COLLECTOR_CREATE / COLLECTOR_UPDATE / COLLECTOR_DELETE /
      COLLECTOR_TOKEN_REGENERATE
  All four follow the WithPermissions HIDE-when-permission-absent semantic (the
  HOC returns null per WithPermissions.tsx:27-29). The LIST CONTENT (policy
  names, role names, owner names, collector names + masked tokens) is rendered
  UNCONDITIONALLY — every authenticated user sees the catalog regardless of
  Permission. The pattern is platform-wide.

  **The 6-component generalisation** strengthens the original 2-component
  observation: this is not a DataEntity-detail-page idiom; it is a PLATFORM-WIDE
  convention for the entire Management UI tree. The mitigation surface (add tests
  pinning the gating semantic) widens to all 6 components.

  **batch-ZH 11-CONTRIBUTOR FURTHER GENERALISATION** — extends the
  6-component pattern with 5 route-module contributors (dataModelling
  /dataQuality /management /masterData /terms). The route modules
  themselves enforce no gating; downstream renderers apply WithPermissions
  HOCs around buttons (Add Query Example, +Add Lookup Table, +Add Term,
  Create Policy, Edit/Delete Role, etc.). The platform-wide nature of
  the pattern is now confirmed at 11 distinct primary sources (6 UI
  components + 5 routes).
