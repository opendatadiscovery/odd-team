name: 'Spec carries no security: block; authorization is wholly out-of-band of the
  OpenAPI contract'
canonical_in_docs: false
canonical_candidate: true
description: 'Both alert and dataEntity OpenAPI tags declare zero `security:` blocks
  (top-level OR per-operation) and no `components.securitySchemes`. Every authorization
  decision is invisible to the spec; consumers reading the spec to derive auth requirements
  get nothing. The contract therefore commits the platform to enforcing auth in Spring
  Security wiring downstream of the generated `*Api` interface. Reinforced by method-level
  findings: postMessageInSlack''s live API-reference page does not state authentication/authorization
  model; regenerateCollectorToken''s Permission gate is invisible to the OpenAPI contract.'
axes_present:
- openapi_tags
- controllers
nodes:
- odd-platform openapi tags openapi-tag:alert
- odd-platform openapi tags openapi-tag:dataEntity
- odd-platform java DataCollaborationController controller-method:postMessageInSlack
- odd-platform java CollectorController controller-method:regenerateCollectorToken
contributors:
