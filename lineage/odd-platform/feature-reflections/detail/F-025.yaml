- id: H-010
  hypothesis: "When a user WITHOUT the QUERY_EXAMPLE_CREATE permission calls POST /api/queryexample directly (bypassing the hidden UI button), the server rejects it with 403 Forbidden."
  derivation: "Pillar mission (P-09) + negative-space — the UI hides the Add button, but a product owner expects the server perimeter (not just the UI affordance) to enforce the permission."
  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |-
      The create endpoint DOES have a server-side SecurityRule: SecurityConstants.java:112-113 binds
      POST /api/queryexample → QUERY_EXAMPLE_CREATE (NO_CONTEXT). Update and delete are likewise gated
      (312-317). So a caller lacking the permission is rejected at the Spring Security perimeter
      regardless of the UI. CAVEAT 1 (auth.type=DISABLED): all gates fall through to permitAll, so an
      anonymous caller succeeds — documented posture, not a bug. CAVEAT 2 (S2S): an X-API-Key caller
      is granted ADMIN and passes the gate. CAVEAT 3: the permission is role-scoped, NOT owner-scoped —
      a holder of QUERY_EXAMPLE_UPDATE via any Role on any Owner can edit ANY snippet, even ones whose
      linked entities belong to another team (controller security.owner_scoping). So the gate exists
      and fires, but is coarse-grained.
    evidence:
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController
        section: security.authorization_assertions + security.owner_scoping
        cite: "SecurityConstants.java:112-113,312-317 + QueryExamplePermissionExtractor.java:38-48"
        note: "3 write endpoints gated; no per-owner scoping on the grant"
    severity: null
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: cross-actor
    coverage: unverified
    coverage_note: |-
