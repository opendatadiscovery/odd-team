  - "REFACTOR-NNN candidate: add `// SQL-tier row lock — DO NOT remove .forUpdate() without restructuring the ingestion serialisation strategy` comment at line 98"
proposed_action: |-
  Testcontainers integration test (two concurrent transactions). (a) Seed a live datasource with oddrn `//snow/prod`. (b) Open TX-A; call `getIdByOddrnForUpdate("//snow/prod")` — acquires row lock; hold the TX open with a slow downstream operation (e.g. `Mono.delay(2 seconds)`). (c) From TX-B (separately), call `getIdByOddrnForUpdate("//snow/prod")` — assert this Mono BLOCKS for ~2 seconds until TX-A commits. (d) After TX-A commits, TX-B unblocks and returns the same id. (e) Pin the lock semantic with a comment: `// REGRESSION-PIN — Removing .forUpdate() from line 98 would compile and pass happy-path tests but introduce a race in the ingestion pipeline. This test asserts the lock acquisition.` (f) Pair with a soft-delete variant — TX-A soft-deletes the datasource while TX-B is waiting; TX-B unblocks and gets `Mono.empty()` (the row no longer matches deleted_at IS NULL).
