security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Single mechanism: ReactiveSecurityContextHolder.getContext() →
      Authentication.getName() + provider → SELECT user_owner_mapping
      WHERE oidc_username=? AND deleted_at IS NULL AND (provider=? OR
      provider IS NULL) → Owner. STRENGTHENED batch K: the runtime
      resolver is now primary-source pinned at
      AuthIdentityProviderImpl.java:23-53; the case-sensitive .eq()
      lookup at ReactiveUserOwnerMappingRepositoryImpl.java:116-127 is
      the load-bearing SQL.
      **STRENGTHENED batch N**: the SQL primary source is now
      independently pinned at the repository layer; the getConditions
      helper IS the WHERE clause. End-to-end pinning: HTTP → service
      (AuthIdentityProvider) → SQL (UserOwnerMappingRepo) is
      consistent on the happy-path contract.
      **STRENGTHENED batch O**: the GitHub identity-source primary
      source confirms username = mutable GitHub `login` for
      provider=github (consistent with the broader compound-key
      contract; the bug is at the IDP-mutability angle, not the SQL
      lookup correctness).
  owner_scoping:
    verdict: RESPECTS
    detail: |-
      Owner-id is the principal-derived parameter passed into the
      OWNERSHIP JOIN at the SQL layer.
      **STRENGTHENED batch N** — ReactiveUserOwnerMappingRepositoryImpl
      is the persistence-layer enforcement of the owner-scoping
      mechanism. Every owner-scoped read in the platform consumes the
      OwnerPojo this repository's getAssociatedOwner returns. The
      case-sensitive .eq() predicates at lines 119 and 122 are the
      SQL-layer load-bearing component of the entire defence-in-depth
      anchor-set pattern documented in ADR-CANDIDATE-015
      (DataEntityController.getMyObjects sidecar batch G).
  strengths:
  - Composite-key (oidc_username, provider) correctly isolates owner identity across
    OAuth2 providers
  - 'Single Mono lookup per request — architectural posture: one user, one Owner identity'
  - clear-active-then-insert pattern ensures only ONE active mapping per (user, provider)
  - |-
    **STRENGTHENED batch K**: the runtime resolver is a single chokepoint
    at AuthIdentityProviderImpl — 15 callsites all funnel through three
    Monos (getCurrentUser / getCurrentUserProviderRole /
    fetchAssociatedOwner)
  - |-
    **STRENGTHENED batch N**: the SQL primary source has TWO partial
    unique indexes from V0_0_89 as the DB-side safety net —
    `unique_deleted_at_per_owner ON (owner_id) WHERE deleted_at IS NULL`
    AND `user_owner_mapping_oidc_username_provider_deleted_key ON
    (oidc_username, provider) WHERE deleted_at IS NULL`. Together they
    enforce "at most one ACTIVE row per owner AND at most one ACTIVE
    row per (username, provider)". The two-step clear-active pattern at
    the service layer is the application-side complement.
  weaknesses:
  - |-
    **LOGIN_FORM and LDAP both produce provider=null → cross-mode user-identity
    bleed during auth.type migrations (HIGH severity — RAISED from previous
    LOW-MEDIUM, batch K primary-source confirmation; SQL-LAYER PRIMARY-SOURCE
    UPGRADED batch N)**. Two HIGH-severity scenarios:
      (a) Migration LOGIN_FORM → LDAP retaining usernames silently inherits
          old user-owner mappings without invalidation
      (b) Concurrent LOGIN_FORM + LDAP deployments with overlapping
          usernames silently collide
    No mode-check, no warning log, no fail-fast.
    (AuthIdentityProviderImpl.md:bugs_limitations_corner_cases.[0] +
    ReactiveUserOwnerMappingRepositoryImpl.md:bugs_limitations_corner_cases.[0])
  - |-
    **S2S 'ADMIN' literal collision with operator-named users (NEW HIGH
    severity, batch K)** — S2sAuthenticationFilter.java:31 hardcodes
    username="ADMIN" (uppercase) → provider=null. If an operator created
    a LOGIN_FORM/LDAP user 'ADMIN' (case-sensitive exact match), the S2S
    caller resolves to THAT user's Owner. Case-sensitivity mitigates but
    does not eliminate.
    (AuthIdentityProviderImpl.md:bugs_limitations_corner_cases.[1])
  - |-
    **NEW MEDIUM batch N — Cross-provider username row-duplication in
    external JOINs**. FOUR sibling repositories (Alert / Activity /
    Owner / OwnerAssociationRequest) LEFT JOIN user_owner_mapping on
    OIDC_USERNAME ONLY without the provider half of the compound key.
    Two-row coexistence produces Cartesian-product row duplication in
    alert / activity / owner-display read paths during cross-mode
    deployments or auth-mode migrations.
    (ReactiveUserOwnerMappingRepositoryImpl.md:bugs_limitations_corner_cases.[1]
    + docs_link_semantic.doc_drift_findings.[3])
  - |-
    **NEW LOW batch N — Empty-string vs null provider indistinguishable**
    — the `StringUtils.isNotEmpty(provider)` branch fires the IS NULL
    predicate for BOTH null AND empty-string. The partial unique index
    `user_owner_mapping_oidc_username_provider_deleted_key` IS on
    (oidc_username, provider) so empty-string and null could theoretically
    coexist (Postgres treats them as distinct values in unique
    constraints). But the read path bypasses the empty-string row.
    Unreachable rows; latent data-corruption surface.
    (ReactiveUserOwnerMappingRepositoryImpl.md:bugs_limitations_corner_cases.[3])
  - |-
    **NEW MEDIUM batch N — Positional INSERT values; schema-evolution
    fragility.** Line 45 passes values positionally
    `.values(ownerId, oidcUsername, provider, DSL.val(null, DATE))`. A
    future migration that adds a column BETWEEN existing columns would
    silently break the INSERT. Plus a TYPE MISMATCH on deleted_at
    (DSL.val(null, DATE) vs TIMESTAMP column).
    (ReactiveUserOwnerMappingRepositoryImpl.md:bugs_limitations_corner_cases.[4,5])
  - |-
    **NEW MEDIUM batch N — No @ReactiveTransactional on multi-statement
    createRelation**. The inner DELETE + INSERT chain via .then() is NOT
    atomic across R2DBC connections. UserOwnerMappingServiceImpl is also
    NOT annotated; OwnerAssociationRequestServiceImpl IS annotated at
    the entry method (so transitive callers are atomic within that
    flow). If the UPDATE succeeds and the INSERT fails (partial unique
    index violation), the user is left in an unmapped state.
    (ReactiveUserOwnerMappingRepositoryImpl.md:bugs_limitations_corner_cases.[6])
  - |-
    **NEW HIGH batch O — GitHub username-rename orphans USER_OWNER_MAPPING
    row (latent identity-drift)**. The GithubUserHandler.java:36 + line
    56 default `adminAttribute = USER_LOGIN` means the username consumed
    by USER_OWNER_MAPPING for provider=github is GitHub's MUTABLE `login`
    string, NOT the stable numeric `id`. GitHub allows free login renames
    (90-day escrow, then re-released). A renamed user logs in as
    (alice2, github); the prior (alice, github) row is ORPHANED. No
    id-based fallback, no migration tool, no live-doc warning. The bug
    is structural: the compound key is bound to a mutable IDP identifier,
    so identity drift at the IDP silently breaks the binding. Operator
    mitigations: (a) use GitHub's stable numeric `id` as the username
    attribute (one-line code change in GithubUserHandler); (b) document
    the rename-risk on the live OAuth2/OIDC GitHub config page;
    (c) operator-side admin tool to merge orphan rows; (d) accept the
    silent fail-open posture and document recovery (new owner-association
    request after rename).
    (GithubUserHandler.md (batch O):invariants.[0] +
    bugs_limitations_corner_cases.[0] + security.known_security_gaps.[0];
    canonicalisation candidate:
    github-username-rename-orphans-user-owner-mapping batch O)
  - DISABLED mode = no SecurityContext = empty Flux degradation indistinguishable
    from owning-nothing
  - No fail-fast for unlinked user — 200 OK with [] body is the only signal (silent
    UX trap)
  - Per-request principal lookup (no session cache) — multiplicative on /my call rate
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    **STRENGTHENED batch N — TWO HOT PATHS NOW SQL-PRIMARY-SOURCE PINNED**:
      Hot path 1 — getAssociatedOwner — invoked by
