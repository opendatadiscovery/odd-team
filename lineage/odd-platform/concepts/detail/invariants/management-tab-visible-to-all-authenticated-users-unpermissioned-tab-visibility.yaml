mitigations_unimplemented:
  - |-
    Code-side: add a `permission` field to each entry in the `tabs`
    array in ToolbarTabs.tsx and gate render via
    `useAppSelector(getGlobalPermissions)` predicates. The Management
    tab gates on `usePermissions().hasAccessTo(POLICY_VIEW)` (or any
    Management-tier permission); the Alerts tab gates on the alerts
    permission; etc.
  - |-
    Doc-side: surface the read-collaborative posture explicitly on the
    `/configuration-and-deployment/enable-security/authorization` page —
    "Every authenticated user can READ the platform's catalogues; only
    users with specific permissions can MUTATE. The UI surfaces the
    read affordance even when the mutate affordances are hidden."
  - |-
    UX-side: add a banner on Management routes when the user has zero
    Management permissions explaining the page-level read-collaborative
    posture — "You can see this catalogue. Editing requires {permission}.
    Contact your administrator."
  - |-
    **NEW batch ZH** — author a developer-side doc page describing the
    Management UI's 9 sub-areas + the asymmetric route-gate posture
    (Associations gated, 8 others bare). The Management UI is one of
    the largest navigable surfaces in the SPA and is entirely
    undocumented (per the managementRoutes sidecar doc_drift_findings).
