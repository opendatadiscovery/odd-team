    evidence:
      - "CounterTimeSeriesExtractor@L20.md:concepts.entities + concepts.operations + concepts.invariants"
      - "CounterTimeSeriesExtractor@L20.md:implicit_adrs.[0,1] (mirrored beans with matchIfMissing default-on; per-MetricType class explodes the switch)"
      - "CounterTimeSeriesExtractor@L20.md:dependencies_semantic.requires-config (metrics.storage + metrics.prometheus-host + odd.tenant-id)"
    security_aggregate:
      overall: MEDIUM
      auth_modes_relevant:
        - INTERNAL_ONLY
      ingestion_filter_relevance: INDIRECT
      authorization_consistency:
        verdict: "N/A"
        detail: "`@Component`-layer extractor — not on the HTTP surface. Auth gates apply upstream at the ingestion controller boundary; whether `auth.ingestion.filter.enabled` covers the metric-sets path depends on which ingestion route mounts `IngestionMetricsService` (NOT `/ingestion/entities`, so NOT covered by IngestionDataEntitiesFilter)."
      owner_scoping:
        verdict: "N/A"
        detail: "Extractor is per-MetricType, not per-Owner. Injected oddrn + MetricFamilyPojo.id are the only scoping keys; ODD Owners do not appear in the metric label set."
      strengths:
        - "Disabled-by-default for the PROMETHEUS path — `matchIfMissing=true` is on the INTERNAL_POSTGRES side; an operator who never mentions `metrics.storage` runs the internal-postgres path (no external write)"
        - "Default `metrics.prometheus-host` is `http://localhost:9090` (localhost) — operator must actively change to expose to network"
