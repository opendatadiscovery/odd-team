control_summary: |-
  0/4 cells COVERED. The catalogue is a load-bearing feature with
  pageInfo theatre at the contract level (SDK clients lied to),
  no read scoping (full deployment vocabulary enumerable by any
  authenticated user), no docs, and three smaller defects (case
  sensitivity, no ORDER BY, no auto-create rate-limit). F-013
  covers the WRITE half; F-046 covers the READ half — together
  they describe the Custom Metadata feature end-to-end.
