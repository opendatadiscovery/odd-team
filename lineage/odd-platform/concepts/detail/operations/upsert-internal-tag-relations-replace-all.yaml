name: Upsert Internal Tag Relations (Replace-All)
canonical_in_docs: false
canonical_candidate: true
description: 'PUT /api/dataentities/{id}/tags — replace-all the INTERNAL tag relations
  for a data entity (external/ingested tag relations are PROTECTED via filter !external).
  Side-effects: auto-creates Tag directory rows for novel names (important=false);
  refreshes search vector; emits TAG_ASSIGNMENT_UPDATED. Despite the create*-shaped
  operationId, the underlying semantic is REPLACE-ALL diff (delete missing + insert
  new).'
