realism_caveats: |
  What this probe pins:
    - The N=0 misleading-error-message contract: operators get
      '0 min' (typo and confusing); a fail-fast at boot would be
      better.
    - The N=2 happy-path: confirms the responseTimeout binding
      actually fires at the configured value.
    - The N=-5 undefined-behavior class: pins WHICH undefined
      branch is taken (so the sidecar can stop saying 'PROBE-NEEDED').

  What this probe does NOT verify:
    - The behavior at N=MAX_INT (~4080 years) — the elapsed-time
      check would be impractical. Static analysis is sufficient
      for this case (Duration.ofMinutes(MAX_INT) is legal; the
      WebClient never times out on responseTimeout; inbound
      Spring WebFlux defaults still cap the inbound request).
    - Connection-establishment failures (the mock IS reachable
      in this probe) — a separate probe could point genai.url
      at an unreachable host to confirm the connect-timeout
      behavior, which is governed by Reactor Netty defaults,
      NOT by genai.request_timeout.
    - The interaction with Spring WebFlux's inbound request
      timeout (the request thread on the platform side may
      time out before the outbound socket does, especially
      at N=MAX_INT).

  Reactor Netty version assumption:
    The behavior of responseTimeout(Duration.ofMinutes(0)) and
    responseTimeout(Duration.ofMinutes(-5)) depends on the
    Reactor Netty version pinned by Spring Boot. The probe is
    informational — if a Spring Boot upgrade changes the
    behavior at N=0 or N=-5, the sidecar's PROBE-VERIFIED entry
    must be re-run.

  Mock LLM service:
    The probe uses a docker-compose-managed mock at
    http://mock-slow-llm:5000 with a 3-minute delay. If the
    probe-runner's mock-server primitive doesn't support
    arbitrary delays, substitute a WireMock or MockServer
    container with the equivalent configuration. The N=0
    scenario doesn't actually need the mock to be reachable
    (the timeout fires before the connection completes), but
    the N=2 scenario does.
