behaviour: |-
  **`getLatestTablesHealth` — one of THREE sub-queries the dashboard fans out to — has ZERO test coverage at any tier.** The existing `ReactiveDataQualityRunsRepositoryTest.java:91-119` covers `getLatestDataQualityRunsResults` (line 91-99) and `getMonitoredTables` (line 101-119); the THIRD method `getLatestTablesHealth` (`ReactiveDataQualityRunsRepositoryImpl.java:108-173`) has NO test method asserting its 3-way classification CTE algebra.

  **What's at risk**:
  - **HEALTHY classification**: `NOT EXISTS last_run WHERE STATUS != SUCCESS` (`ReactiveDataQualityRunsRepositoryImpl.java:118-124`). A dataset is healthy iff EVERY one of its DQ tests has a latest run with status=SUCCESS.
  - **ERROR classification**: `EXISTS last_run with STATUS in {BROKEN, FAILED}` AND NOT in healthy (`ReactiveDataQualityRunsRepositoryImpl.java:127-146`).
  - **WARNING classification**: fallthrough — NOT IN healthy AND NOT IN error (`ReactiveDataQualityRunsRepositoryImpl.java:148-157`). Typical case: a dataset with latest-runs including SKIPPED / ABORTED / UNKNOWN but no BROKEN / FAILED.
  - **Mutually exclusive + exhaustive**: every dataset with at least one DQ test falls into exactly one bucket per the CTE algebra. Datasets with NO DQ tests are absent from all three (a separate concept — they're counted in `notMonitoredTables` instead).

  **Operator-visible failure modes if the SQL drifts**:
  - A subtle classification gap (per sidecar `bugs_limitations_corner_cases[6]`): a dataset with 10 tests where 9 latest-runs are SUCCESS and 1 is SKIPPED is classified WARNING (because SKIPPED != SUCCESS), not HEALTHY. The operator's mental model "SKIPPED is benign" misaligns with the SQL's "anything not SUCCESS = not healthy".
  - The UNION ALL collapse: `UNION ALL` (not `UNION`) is the join across the 3 CTEs; if the CTE predicates accidentally overlap (e.g. a future bug at line 130-145 lets WARNING and ERROR co-classify the same dataset), the table-health ring's slice cardinality breaks. No test pins the mutual-exclusivity.

  **Compound with doc-drift**: the live `https://docs.opendatadiscovery.org/features/data-quality/dashboard` page enumerates the three states but provides NO rules — operators cannot predict which colour their dataset renders. Pinning the CTE algebra in tests is the operator-trust substrate the doc currently lacks.

  No test asserts ANY of the above. A maintainer refactoring the CTE chain has no regression coverage to catch a classification flip. The sidecar's `name_behavior_pairs.[2]` records the lexicon drift (doc says "success / failed / broken"; UI says "healthy / warning / error"; SQL constants say `GOOD_HEALTH / WARNING / ERROR`) — three lexicons compound the test gap.
