realism_caveats: |
  The probe verifies the term-link-cascade semantics from the operator's
  perspective. If `len(post_delete_rows) == 0` (assert fails), it would mean
  the implementation does drop description-links on explicit DELETE — which
  would contradict the read of TermRelationsRepositoryImpl.java:175-183
  (the `.and(IS_DESCRIPTION_LINK.isFalse())` clause). Re-read the
  repository if the assert fails.

  The probe assumes the description-term-marker pattern is `[[namespace/name]]`
  as inferred from TermServiceImpl.findTermsInDescription line 337-360. If
  the marker pattern is different (e.g. a regex with different delimiters)
  the description-link in step A will not be created and the dual-link state
  will be 1 row, not 2 — re-read TermServiceImpl.findTermsInDescription
  and adjust the description body in step A.

  The probe verifies the operator-perspective bug-shape: "I deleted the term
  but it still shows up in the linked-terms tab". The remedy (edit
  description to remove the marker) is documented in the realism block of
  the sidecar's bugs_limitations_corner_cases entry. The probe does NOT
  verify the remedy path; that is left for a follow-up integration test.

  Per Rule 8 the probe runs entirely on the local Testcontainers + docker
  compose stack.
