- id: H-009
  hypothesis: "When the per-entity Alerts tab fetches an entity's alert history, the response payload does not leak another user's personal identity (an OIDC/LDAP login name) to viewers who should not see it."
  derivation: "Negative-space + privacy: the AlertDto carries status_updated_by → the human who triaged the alert; a senior PO treats raw login names rendered on a cross-owner-readable surface as a privacy concern (the read-collaborative posture's known PII edge)."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The per-entity read resolves status_updated_by (an OIDC username string on the ALERT row) to an OwnerPojo via
      a USER_OWNER_MAPPING LEFT JOIN with DELETED_AT IS NULL (per ReactiveAlertRepositoryImpl sidecar invariants +
      implicit_adrs). When the user→owner binding is still active the UI shows the Owner display name; when the
      binding is absent/soft-deleted the join resolves NULL and (per the F-007 Alerts-list reflection, same shared
      AlertItem) the raw username can fall through to a verbatim render. Because the per-entity read is itself
      cross-owner (H-001), the human who last triaged an alert on ANY entity is visible to any authenticated user
      who reads that entity. PARTIAL: in the common case the Owner display name (not the raw login) is shown; the
      raw-username fall-through is the edge, and it is the same statusUpdatedBy-username class flagged on the global
      Alerts list under the read-collaborative-posture family.
    evidence:
