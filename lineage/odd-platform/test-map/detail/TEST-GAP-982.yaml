proposed_action: |-
  Add `DataEntityRunOrderingEdgeCasesTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `getRuns_runningAndCompletedMixed_runningAppearsFirst_pinsNullsFirstOrdering` — seed 1 RUNNING (end_time=null) + 3 completed runs; GET; assert items[0].endTime is null. PIN the NULLS-FIRST behaviour.
  2. `getRuns_twoRunsShareEndTime_orderingIsImplementationDefined_pinsTieBreakerAbsence` — seed 5 runs with two pairs at identical end_times; GET; capture order; re-issue the same GET; assert observed order MAY differ (or document that PG returns same order due to physical storage); pin the no-tie-breaker contract.
  3. `getRuns_paginationBoundary_tiedEndTime_observedDuplicationOrSkip_pinsBoundaryHazard` — seed 12 runs, runs 4+5 share end_time; GET page=1 size=4 then page=2 size=4; verify whether rows 4+5 appear correctly across the boundary; pin the observed behaviour.
  4. `getRuns_uiSortKeyMismatch_runStartedYesterdayEndedToday_appearsAboveRunStartedAndEndedEarlierToday_pinsKeyMismatch` — seed run A (start yesterday, end today) + run B (start today, end today, earlier than A); GET; assert items[0] is A (end_time newer) even though start_time of A is older than B. PIN the display-key vs sort-key mismatch.

  Pair with REFACTOR-NNN: add `.orderBy(DATA_ENTITY_TASK_RUN.END_TIME.desc().nullsLast(), DATA_ENTITY_TASK_RUN.ID.desc())` at the paginate site. The two-key ordering closes (a) and (b). Flips tests 1+2+3 deliberately.
