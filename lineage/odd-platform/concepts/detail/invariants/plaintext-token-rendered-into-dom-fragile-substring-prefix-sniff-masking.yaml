mitigations_unimplemented:
  - |-
    UI: render the visible plaintext via `<input type='password'>` with
    a Reveal-on-hover affordance. Standard pattern across the industry
    (Stripe, AWS console, GCP console all use this for secret display).
  - |-
    UI: auto-hide the plaintext after 30 seconds with a "Copy now"
    countdown timer. Forces operator action; minimises the visible-
    plaintext window.
  - |-
    Contract: add a `tokenVisible: boolean` field to the Collector
    DTO (`components.yaml` Collector schema). Backend sets `true` on
    the regenerate response, `false` on subsequent reads. UI consumes
    the explicit flag instead of the substring sniff. Removes the
    fragile detection entirely.
  - |-
    Test: Vitest test on CollectorItemToken that asserts (i)
    plaintext (40-char alphanumeric) renders Copy + admonition;
    (ii) masked (`******{last6}`) renders Regenerate; (iii) variant
    mask formats (4 stars, Unicode, prepended whitespace) render
    DEFENSIVE behaviour (default to "treat as masked", showing
    Regenerate rather than Copy). The third assertion is the
    regression-pin for a future backend change.
  - |-
    Doc: extend `/configuration-and-deployment/enable-security/authorization/permissions`
    with explicit caveat on the COLLECTOR_TOKEN_REGENERATE permission
    "The plaintext token is displayed ONCE — on the regenerate
    response — and is rendered into the DOM as a text node. Browser
    extensions, screenshot tools, and accessibility readers may
    capture the value. Copy the token immediately and store securely."
notes: |-
  Pairs with the existing `collector-token` entity's catalogued
  weaknesses (non-CSPRNG entropy, plaintext-in-DB, no rotation grace
  period, no audit log). The UI-side hazards compound those backend-
  side hazards — every link in the chain is fragile.

  Cross-references:
    - `collector-token` entity
    - `regenerate-collector-token` operation
    - `plaintext-equality-shared-secret-token-model` invariant
    - `lombok-data-tostring-sensitive-field-leak` invariant (sibling
      Lombok-DAT-side credential exposure surface)
