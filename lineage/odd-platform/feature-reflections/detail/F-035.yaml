# Operator-Configured Additional Links — product-owner reflection

## product_owner_narrative

The "Additional Links" feature lets a platform **operator** surface a curated list of external
navigation shortcuts — internal wikis, runbooks, dashboards, Grafana, anything a team should be
able to reach from inside the catalog — directly in the ODD Platform UI, without writing any code
or running a database migration. The audience is two-sided: the operator configures the list, and
every signed-in end-user consumes it (per LinksController.md:concepts.audiences). It is one of the
"Other Management surfaces" the mission pillar P-08 names alongside M2M tokens and the Alternative
Secrets Backend — "operationally part of Management even though not rendered as tabs"
(per system-mission.md P-08 Maintainer-notes, line 246).

The operator's only interface is configuration: a `odd.links[]` list in `application.yml`,
environment variables, or a Kubernetes ConfigMap, each entry a `{title, url}` pair
(per AdditionalLinkProperties.md:understanding). There is no admin screen, no save button, no CRUD
endpoint — the feature is implemented entirely as a Spring `@ConfigurationProperties` record bound
once at boot (per AdditionalLinkProperties.md:implicit_adrs[0]; LinksController.md:implicit_adrs[0]).
The end-user's interface is purely consumption: the links appear inside the **App Info menu** — the
popover behind the information icon in the top-right toolbar, present on every authenticated page
(per AppInfoMenu.md:understanding; WebFetch 2026-06-04). The user does not configure, reorder, or
hide anything; they hover the icon, the menu opens, and the operator's links render as clickable
menu items that open in a new browser tab (per AppInfoMenu.md:concepts.operations.render-operator-links).

The working parts are deliberately thin. The backend has exactly one read-only endpoint,
`GET /api/links`, which streams the bound config list to the API model with no sort, no pagination,
no filtering, and no per-role differentiation — every authenticated caller gets the identical list
(per LinksController.md:understanding; LinksController.md:stress_findings.auth_gates). The frontend
fetches it once via TanStack Query (`useAppLinks`) and renders each entry as a react-router
`<Link target='_blank'>` inside the MUI menu, keyed by URL, in API order
(per AppInfoMenu.md:concepts.operations; AppInfoMenu.md:stress_findings.orderings). The App Info menu
is shared chrome: the SAME popover also carries four hardcoded surfaces (Documentation, Slack,
project-version-with-GitHub-link, Leave-Feedback) — so this feature's data shares a widget with
deployment-introspection (F-009) and community shortcuts (per AppInfoMenu.md:understanding).

The integration story crosses three sibling features. F-009 (Deployment Introspection) co-inhabits
the same widget and shares its auth-mode behaviour; F-041 owns the toolbar chrome that hosts the
widget; F-043 (multilingual UI) catalogues the four hardcoded English labels in this menu as one of
its missing-i18n sites (per F-035.yaml:batch ZJ cross-references). The feature also touches P-09
(Security) because the configured URL list is gated only by the framework-default `authenticated()`
rule, and because under `auth.type=DISABLED` it is anonymously reachable (per LinksController.md:security).

A product owner demoing this would highlight the convenience (links appear in seconds, no deploy of
custom UI) but would also flag the edge cases an operator hits in practice: the list is **bound at
boot** so YAML edits don't take effect until restart, AND the UI keeps the menu DOM mounted for the
tab's lifetime so even after a restart, users in open tabs see the stale list until a full reload
(per AppInfoMenu.md:bugs_limitations_corner_cases[2]); the operator cannot show different links to
different roles; there is no validation, so a typo'd or malicious URL ships silently into the menu;
and — the load-bearing one — the menu only opens on mouse hover, so keyboard-only and touch-device
users cannot open it at all (per AppInfoMenu.md:bugs_limitations_corner_cases[1]).

