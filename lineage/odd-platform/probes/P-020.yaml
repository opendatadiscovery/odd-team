expected_outcome: |
  LSN-019 STRESS-FINDING S-E-5: Pin the system-event-username silent-NULL
  behaviour for ingestion-driven activity events. Verify the operator-visible
  consequence: the Activity Feed shows ingestion-driven changes as having
  NO user (NULL `created_by_user_id`), with NO `is_system_event` indicator
  on the persisted ActivityPojo to distinguish "system did it" from
  "user did it but auth context lost due to bug".

  Mechanism: `ActivityServiceImpl.createActivityEvent` (`:46-49`):
    `authIdentityProvider.getCurrentUser()
      .map(UserDto::username)
      .map(username -> activityMapper.mapToPojo(event, activityCreateTime, username))
      .switchIfEmpty(Mono.defer(() -> Mono.just(activityMapper.mapToPojo(event, activityCreateTime, null))))`
  When no security context exists (ingestion thread, scheduler), `getCurrentUser`
  returns `Mono.empty()`, switchIfEmpty kicks in, username = null. No
  `log.warn`, no metric.

  Additionally: `ActivityCreateEvent.systemEvent` (`:13`) is a boolean set
  to `true` by the ingestion processor (`ActivityIngestionRequestProcessor:53`)
  and false by default for @ActivityLog-driven events. Verify whether this
  boolean is persisted on the ActivityPojo row (column on `activity` table)
  so the UI/operator can distinguish "system event" from "user event with
  NULL user".

  Arrange: clean baseline; verify schema.

  Act: submit an ingestion request creating ONE new data entity via the
  Collector path (`POST /ingestion/entities`).

  Observe:
  - The ActivityPojo row for the new data entity.
  - `created_by_user_id` (expected NULL).
  - Schema of `activity` table — does an `is_system_event` (or
    analogously-named) column exist?
  - Activity Feed API response — what user-shape does the UI see for this row?

  Assertion (current bug state):
  - `created_by_user_id IS NULL` (silent null verified).
  - Possibly: no `is_system_event` column on the activity table — surface
    as separate finding (the systemEvent flag exists on the event DTO but
    cannot be queried/displayed downstream).

  When the fix lands (add `log.warn` for unexpected-NULL auth context;
  persist the systemEvent flag in the row; surface it in the Activity API
  response so the UI can render "system" vs "unknown user"), this probe's
  assertions update:
    - NULL user with systemEvent=true → expected (clean).
    - NULL user with systemEvent=false → assertion failure (bug persists
      for non-ingestion paths).
    - WARN-log presence in application logs when NULL-user persists with
      systemEvent=false.

triggers:
  - service/activity/handler/ActivityHandler.java:9-22 (interface contract — auth-agnostic)
  - service/activity/ActivityServiceImpl.java:46-49 (silent null fallback)
  - service/activity/ActivityServiceImpl.java:55-63 (createActivityEvents — ingestion path)
  - service/ingestion/processor/ActivityIngestionRequestProcessor.java:44-56 (systemEvent=true on every ingestion event)
  - dto/activity/ActivityCreateEvent.java:13 (systemEvent boolean field on the event DTO)

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (1020, '//probe-source-P-020/db', 'probe-source-P-020')
      ON CONFLICT (id) DO NOTHING

  # Baseline count of DATA_ENTITY_CREATED events with NULL user — to
  # delta from after the act.
  - kind: sql
    query: |
      SELECT COUNT(*) AS baseline_count
      FROM activity
      WHERE event_type = 'DATA_ENTITY_CREATED'
        AND created_by_user_id IS NULL
    capture_as: baseline_system_event_count

  # SCHEMA CHECK: enumerate activity table columns. The probe-runner
  # parses this to verify whether an `is_system_event` column exists.
  - kind: sql
    query: |
      SELECT column_name, data_type
      FROM information_schema.columns
      WHERE table_name = 'activity'
      ORDER BY ordinal_position
    capture_as: activity_schema

act:
  # Ingestion path. Body shape per the spec's DataEntityList contract;
  # the probe assumes auth.ingestion.filter.enabled=false (DISABLED auth)
  # in the integration environment so the request goes through without
  # S2S tokens.
  - kind: rest
    method: POST
    path: /ingestion/entities
    body:
      data_source_oddrn: "//probe-source-P-020/db"
      items:
        - oddrn: "//probe-source-P-020/db/tables/p020_system_event"
          name: "p020_system_event"
          owner: "//probe-source-P-020/db"
          type: "TABLE"
          metadata: []
          tags: []
    capture_as: ingest_response

observe:
  - kind: sql
    query: |
      SELECT id, oddrn, external_name
      FROM data_entity
      WHERE oddrn = '//probe-source-P-020/db/tables/p020_system_event'
    capture_as: created_data_entity

  # The activity row for this new entity.
  - kind: sql
    query: |
      SELECT id, data_entity_id, event_type, created_by_user_id,
             old_state, new_state, created_at
      FROM activity
      WHERE event_type = 'DATA_ENTITY_CREATED'
        AND data_entity_id = (SELECT id FROM data_entity WHERE oddrn = '//probe-source-P-020/db/tables/p020_system_event')
      ORDER BY created_at DESC
      LIMIT 1
    capture_as: ingestion_activity_row

  - kind: sql
    query: |
      SELECT COUNT(*) AS now_count
      FROM activity
      WHERE event_type = 'DATA_ENTITY_CREATED'
        AND created_by_user_id IS NULL
    capture_as: now_system_event_count

  # UI-API check: hit the Activity Feed for the period containing the
  # ingestion-driven event. Capture the response shape.
  - kind: rest
    method: GET
    path: /api/activity?beginDate=2026-05-19T00:00:00Z&endDate=2026-05-21T00:00:00Z&size=50
    capture_as: activity_api_response

oracle:
  # Sanity.
  - "ingest_response.status in (200, 201)"
  - "len(created_data_entity) == 1"
  - "ingestion_activity_row.event_type == 'DATA_ENTITY_CREATED'"
  - "now_system_event_count - baseline_system_event_count == 1"

  # PRIMARY ASSERTION (current bug state): silent NULL on created_by_user_id.
  - "ingestion_activity_row.created_by_user_id is None"

  # SECONDARY ASSERTION (schema gap surface): does an `is_system_event`
  # column exist?
  # If FALSE, this surfaces a separate finding: the systemEvent flag
  # exists on the event DTO (`ActivityCreateEvent:13`) but does not
  # persist into the row, so the UI cannot distinguish "system event"
  # from "user event with NULL user."
  - "'is_system_event' in [col.column_name for col in activity_schema] or 'system_event' in [col.column_name for col in activity_schema] or any(col.column_name.endswith('system_event') for col in activity_schema)"

  # UI-API assertion (loose — captures the response shape for human
  # inspection rather than asserting specific behaviour).
  - "activity_api_response.status == 200"

