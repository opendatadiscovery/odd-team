proposed_action: |-
  Add `DeleteTermFromDatasetFieldCascadeLimitTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `deleteTerm_termAlsoDescriptionLinked_returnsNoContentButTermSurvives_pinsCascadeLimit` — seed field F + term T; POST /terms to manually link; PUT /description with body containing `[[ns/T]]` to also description-link (verify TWO rows in dataset_field_to_term); DELETE /terms/T; assert HTTP 204; GET field's term list; assert T STILL APPEARS (description-link row survives). PIN the silent cascade limit.
  2. `deleteTerm_termOnlyManuallyLinked_termRemovedFromList_baselineNonRegression` — same setup but skip the description-link; DELETE; GET; assert T is gone. Baseline for the happy path.
  3. `deleteTerm_termOnlyDescriptionLinked_noChange_pinsManualOnlySemantics` — seed field F + term T linked ONLY via description marker; DELETE /terms/T; assert HTTP 204 (idempotent no-op); GET; assert T still appears. PIN the no-effect-on-description-link contract.
  4. `deleteTerm_followedByDescriptionEditRemovingMarker_termFullyRemoved_pinsRemedyPath` — execute test 1's setup; DELETE /terms/T (still appears); PUT /description with the `[[ns/T]]` marker removed; GET; assert T is now gone. PIN the documented-remedy path.

  Pair with REFACTOR-NNN: choose (a) cascade-delete description-links OR (b) make the limit visible via 200 response with `description_link_remains: true`. Pair with DOC-NNN: update OpenAPI description + live docs.
