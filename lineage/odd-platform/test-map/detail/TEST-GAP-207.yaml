proposed_action: '`@SpringBootTest` that resolves the four `*.advisory-lock-id` properties
  via `Environment` (`partition.advisory-lock-id`, `notifications.wal.advisory-lock-id`,
  `datacollaboration.receive-event-advisory-lock-id`, `datacollaboration.sender-message-advisory-lock-id`)
  and asserts they form a 4-element set. The test fails today (it passes vacuously;
  the four shipped defaults are disjoint) — the value is forcing future maintainers
  to keep them disjoint when adding a 5th advisory-lock subsystem.'
