  - "IngestionDataEntitiesFilter.md:security.known_security_gaps.[4]"
behaviour: |-
  **STRENGTHENS TEST-GAP-123 with filter-class anchor.** The filter-class sidecar confirms at file:line that the failed-auth paths are silent: `IngestionDataEntitiesFilter.java:55-58` throws `AccessDeniedException("Token is not correct")` with no log call; `AbstractIngestionFilter.java:48` throws `AccessDeniedException("Token is missed")` with no log call; the parent writes the 401 with the verbatim message but emits NO `@Slf4j` log call on EITHER path. `@Slf4j` IS imported in AbstractIngestionFilter (line 10) but only used by `readBody` exception path at line 61 (the Jackson deserialise failure path), NOT for auth failures. NO metric counter on the failure path. A security incident review of 'how many failed-auth attempts in the last hour against /ingestion/entities' cannot be answered from application logs. Combined with TEST-GAP-117 (filter-on activation), TEST-GAP-118 (bearer-token contract), and this gap = the auth surface emits zero audit signal.
