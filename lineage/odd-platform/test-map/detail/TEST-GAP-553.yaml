proposed_action: |-
  Testcontainers test. (a) Seed mapping (owner X, username='alice', provider=null, deleted_at=null). (b) getAssociatedOwner('alice', null) → X. (c) getAssociatedOwner('alice', '') → STILL X (the StringUtils.isNotEmpty empty-string collapse). (d) Seed second mapping (owner Y, username='alice', provider='GITHUB'). (e) getAssociatedOwner('alice', null) → STILL X (GITHUB row is excluded — provider-discrimination). (f) getAssociatedOwner('alice', 'GITHUB') → Y. (g) **CRITICAL pin**: under LOGIN_FORM + LDAP simultaneous deployment with overlapping usernames, the LOGIN_FORM user 'alice' inherits the LDAP user 'alice's Owner — this test pins the current behaviour AND documents the security gap. Future fix introducing per-mode provider values flips this test to expect Mono.empty() in the cross-mode scenario.
