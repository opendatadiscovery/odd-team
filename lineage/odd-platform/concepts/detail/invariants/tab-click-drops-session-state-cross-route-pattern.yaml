  strengths:
    - |-
      The homecoming pattern IS consistent across the AppToolbar's
      top-nav tabs — predictable behaviour for power users who learn
      the semantic.
    - |-
      The dropped session row eventually gets reaped via the
      housekeeping job (search_facets TTL = 30 days); no permanent
      data leak.
  weaknesses:
    - |-
      Operators expect tab-clicks to preserve their filter state (the
      pattern in most catalog UIs, e.g. Jira's "Issues" tab returns to
      a filtered view); ODD's homecoming pattern DROPS state. Doc-side
      silence makes the pattern un-discoverable.
    - |-
      The Search/Catalog tab carries a NAME DIVERGENCE: tab label,
      URL, and doc feature name are three different strings.
    - |-
      Silent-failure surface on Catalog + Dictionary tab clicks —
      both .unwrap().then() chains lack a .catch(); a backend hiccup
      on the search-create POST leaves the user on the previous page
      with NO error feedback. Operator-visible no-op click on a
      primary nav action (MEDIUM — batch ZJ)
