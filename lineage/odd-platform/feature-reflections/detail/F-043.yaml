- id: H-008
  hypothesis: |-
    When a French user hits a key that is missing from fr.json, they see the English
    fallback (a sensible graceful degradation) — never a third, unexpected language.
  derivation: |-
    Endpoint/bootstrap shape — fallbackLng at i18n.ts:30 governs missing-key behaviour;
    the conventional value is a single 'en'.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      `fallbackLng` is the full six-element array `['en','es','ch','fr','ua','hy']`
      (i18n.ts:30), not the conventional single `'en'`. i18next walks this array in order
      on a missing key — so for a key present in es.json or ch.json but ABSENT from fr.json,
      a French user sees the SPANISH or CHINESE value mid-page before English would ever be
      reached. The natural-keys pattern (en.json is the canonical source) makes the
      common case land on English, but for any locale-set-drift key that exists in an
      earlier-in-chain locale and not the active one, the fallback is cross-locale. The
      i18n.ts sidecar flags this as "almost certainly not the intended UX" — a one-line fix
      (fallbackLng: 'en'). Seeded from SHB-147.
    evidence:
      - sidecar: odd-platform__ts__locales__ui-shell-bootstrap__i18n_ts.md
        section: bugs_limitations_corner_cases.[0] + concepts.invariants.fallback_chain
        cite: "i18n.ts:30 (fallbackLng: ['en','es','ch','fr','ua','hy'])"
        note: "array walked in order; a fr-missing key present in es.json shows Spanish before English."
      - sidecar: odd-platform__json__locales_translations__i18n-resource__en.md
        section: implicit_adrs.[3] + concepts.invariants.locale_count_drift
        cite: "wc -l per locale: en=418, ch=415, fr=415, es=414, hy=414, ua=414"
        note: "locale-set drift is the precondition that makes cross-locale fallback observable."
    operator_visible_failure: |-
      Low-frequency but real: a French (or Ukrainian, or Armenian) operator encountering a
      key that exists in es.json/ch.json but not their locale sees a Spanish or Chinese
      phrase embedded in their otherwise-French UI — a jarring cross-locale surprise that
      no monolingual-locale test catches and no error channel reports. Combined with the
      locale-set drift (H-009), the array fallback turns "graceful degradation to English"
      into "degradation to whichever of five locales happens to have the key first."
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

