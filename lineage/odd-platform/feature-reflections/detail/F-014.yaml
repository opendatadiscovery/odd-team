        section: understanding + concepts.operations
        cite: "DataEntityController.java:315-321 + AlertServiceImpl.java:138-143 + ReactiveAlertRepositoryImpl.java:182-199"
        note: "existence-check → paginated alert select → AlertMapper.mapAlerts → 200 OK AlertList"
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveAlertRepositoryImpl.md
        section: downstream_side_effects (getAlertsByDataEntityId) + invariants (pageifyResult)
        cite: "ReactiveAlertRepositoryImpl.java:182-199"
        note: "the SQL + pagination that materialises the AlertList the read returns"
    confidence: HIGH
    routes_to_finding: none

- id: H-013
  hypothesis: "When two alerts on the same entity share the same ordering key, the per-entity listing orders them deterministically so paginating does not skip or duplicate a row at the page boundary."
  derivation: "Negative-space + response-shape: a paginated list (and the infinite-scroll tab on top of it) needs a stable total order, or boundary rows are skipped/duplicated; a senior PO expects deterministic ordering, as the sibling global Alerts list achieves with (LAST_CREATED_AT DESC, ID DESC)."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      The per-entity listing shares the same createAlertJoinQuery ordering as the global lists: the join query
      declares (ALERT.LAST_CREATED_AT DESC, ALERT.ID DESC) applied to both the inner paginate CTE and the outer
      select (per ReactiveAlertRepositoryImpl sidecar — the global Alerts reflection F-007 H-014 pinned the same
      ordering at ReactiveAlertRepositoryImpl.java:474-483, 505). ALERT.ID is monotonic per insert, so ties on
      last_created_at break by id DESC — a stable total order. So offset pagination on getAlertsByDataEntityId is
      duplicate/skip-free at page boundaries for a static dataset. (Caveat: page=0 yields a negative OFFSET that
      Postgres rejects — a visible error, not a silent skip — per H-003.)
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveAlertRepositoryImpl.md
        section: invariants (pagination via pageifyResult) + couples-to (JooqQueryHelper.paginate)
        cite: "ReactiveAlertRepositoryImpl.java:474-483, 505"
        note: "(LAST_CREATED_AT DESC, ID DESC) total order shared across the join queries — stable boundaries"
    confidence: MEDIUM
    routes_to_finding: none

