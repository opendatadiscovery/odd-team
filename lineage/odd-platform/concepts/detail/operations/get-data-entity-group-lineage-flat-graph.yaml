notes: |
  Operation vocabulary captured for the DEG-lineage tab read. Three headline
  test + doc + code gaps surface:

    (a) NO unit test on this method exists in LineageServiceTest.java. The
        DEG-lineage path is entirely untested at the service layer; the
        ingestion-side tests don't exercise it either.

    (b) Doc: operator-facing feature page does not document the inner-DEG
        suppression behaviour (see companion invariant); third-party caller
        building tooling on getDataEntityGroupsLineage for a DEG containing
        nested DEGs will silently observe missing edges.

    (c) Code: getRelationsForEntities is tail-recursive but Java has no TCO;
        for wide-component DEGs this can blow the stack. A defensive
        iteration-based BFS would close.

