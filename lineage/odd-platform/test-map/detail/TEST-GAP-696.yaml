behaviour: |-
  **`@ActivityLog` AOP IS `@Profile("!integration-test")` — activity emission for `AlertServiceImpl.updateStatus` is SILENTLY DISABLED in integration tests; a regression that drops the AOP would LAND GREEN.** `ActivityAspect.java:24` guards the aspect away from integration-test profiles. The end-to-end tests in `AlertIngestionTest` cannot assert that `updateStatus` produces an `ALERT_STATUS_UPDATED` row; only unit tests (with the aspect EXPLICITLY wired into the bean wiring without the profile guard) can. A regression that breaks `updateStatus`'s activity emission would land green in the integration-test suite. The other AlertServiceImpl methods (`applyAlertActions`, `handleExternalAlerts`) use MANUAL `activityService.createActivityEvents` calls (lines 258, 324) — those WOULD be exercised by integration tests. Only the AOP-guarded `updateStatus` path has this blind-spot. The test pins the AOP wiring at the UNIT level so a refactor removing `@ActivityLog` is caught regardless of profile.
