evidence:
  - "deleteTermFromDataEntity.md:bugs_limitations_corner_cases.[1]: 'Calling DELETE /api/dataentities/{id}/terms/{termId} for a (data-entity, term) pair that is NOT linked (or is ONLY description-linked) returns 204 No Content with no row deleted. The DELETE WHERE clause matches zero rows; the inner flatMap short-circuits because Mono emits no element; the chain completes via .thenReturn(ResponseEntity.noContent().build()). Callers cannot distinguish three semantically-different outcomes.'"
  - "deleteTermFromDataEntity.md:bugs_limitations_corner_cases.[2]: '@ActivityLog(event = TERM_ASSIGNMENT_UPDATED) annotates the service method unconditionally (TermServiceImpl.java:183). The handler re-queries BEFORE/AFTER. A no-op DELETE yields BEFORE = AFTER but the event row is still written.'"
  - "TermRelationsRepositoryImpl.java:80-88 (WHERE-clause with IS_DESCRIPTION_LINK.isFalse() filter; no switchIfEmpty)"
  - "TermServiceImpl.java:181-196 (no early-exit for zero-row DELETE before @ActivityLog triggers)"
  - "TermAssignmentActivityHandler.java:23-43 (state captured regardless of caller intent or outcome)"
  - "DataEntityController.java:161-162 (thenReturn(noContent()))"
