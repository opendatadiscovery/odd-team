# Lineage canvas Compact/Full view-mode toggle — product-owner reflection

## product_owner_narrative

The Lineage canvas is where an operator answers "what is upstream/downstream of this
entity?" by reading a rendered graph on the entity's **Lineage** tab
(`/dataentities/{id}/lineage`, per F-186 `discovered_from_entry_point`). On every
lineage canvas there is a small two-tab control labelled **Full / Compact** (per
`DEGLineageControls.tsx:42-48` and `LineageControls.tsx:96-102` — `AppTabs` with
`items=[{Full},{Compact}]`). The promise the label makes to the user is a density
choice: *Full* shows each node with its full detail (Space / Source labels, the ODDRN
block, and — for Data Entity Group nodes — a clickable list of members); *Compact*
strips a node down so more of the graph fits on screen. It is one of two display
controls in the canvas, the sibling being the Hierarchy-only "Show full names"
checkbox (related feature F-055).

A user reaches the toggle by opening any entity's Lineage tab and clicking Compact or
Full. The control writes a single URL query parameter, `?full=` (`handleViewChange`
sets `full: newViewIndex <= 0` — Full is tab index 0, Compact is index 1, per
`DEGLineageControls.tsx:21-27` and `LineageControls.tsx:50-54`). Because the state
lives in the URL, the chosen mode survives a page reload and is shareable in a link.
The observable output is the graph re-drawn at the chosen node density.

The working part that defines this feature — and the reason it is a discrete F-NNN
rather than a footnote on the lineage pillar — is that the SAME labelled control drives
**two entirely different rendering subsystems** depending on the entity class being
viewed. A Data Entity Group's group-lineage renders through the DEG subtree
(`DEGLineage.tsx`), which packs nodes with elkjs/dagre using each node's *measured*
pixel height; switching density there invalidates the measurements, so the DEG control
also fires `setIsLayouted(false)` (`DEGLineageControls.tsx:24`) which re-mounts the
layout engine (`DEGLineage.tsx:29-36`) and **re-runs the whole layout** — the user sees
a "Loading lineage" spinner and nodes animate to new positions. A regular entity's
lineage renders through the Hierarchy subtree (d3-hierarchy + visx Tree), whose layout
treats node sizes as static across renders; its control (`LineageControls.tsx:50-54`)
sets only the `full` param and triggers **no re-layout** — the node shapes change
instantly in place. One label, two observable experiences.

This feature sits inside the Data Lineage pillar (P-05), whose mission is "upstream and
downstream traceability across the catalog" (per `system-mission.md` P-05). It composes
with the DEG-lineage subsystem (F-016) and the per-entity Hierarchy-lineage subsystem
(F-005) — the toggle is the shared display-mode surface layered over both. The
cross-pillar relevance is to Data Discovery (P-01): a DEG node in the canvas is a
gateway to "which entities belong to this group," and the Compact rendering changes
whether that gateway is reachable.

The edge cases a product owner would flag in a demo are exactly the drift facets the
bottom-up pass already surfaced: (1) the two-subsystem asymmetry means a user's mental
model from a DEG canvas does not transfer to a Hierarchy canvas; (2) Compact mode on the
Hierarchy canvas **hides the DEG-Items drill-in button** (`Info.tsx:120-141`, gated by
`full && externalName && nodesRelatedWithDEG?.length > 0`) — an operator who switched to
Compact for readability silently loses the ability to open a group node's member list;
(3) on a dense Hierarchy graph, switching Compact→Full enlarges node rects without
re-spacing them, risking visual overlap; and (4) two LSN-017-family React dependency-array
latent bugs ride along (`DEGLineageLayouter`'s empty `useLayoutEffect` deps and
`LineageProvider`'s `providerValue` memo omitting `nodeSize`/`titleHeight`/`oddrnHeight`)
that work only because of incidental re-mount behaviour. The documentation (DOC-198,
live and verified 2026-06-03) now describes facets 1, 2, and 3 accurately as caveats.

