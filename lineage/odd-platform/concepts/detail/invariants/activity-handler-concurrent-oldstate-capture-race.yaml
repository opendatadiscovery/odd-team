mitigations_unimplemented:
- |-
  Add a regression test
  `ActivityServiceImplTest.testConcurrentOwnershipUpdates_DiffIntegrity`
  per the ActivityHandler sidecar's recommended test name. StepVerifier
  with two concurrent OwnershipServiceImpl.update calls on the same data
  entity; assert ActivityPojo old/new states are pairwise consistent
  (B's oldState should equal A's newState if A committed first).
- |-
  Add optimistic concurrency control to handlers — handler's
  getContextInfo captures the data entity's version_id (or UPDATED_AT);
  handler's getUpdatedState asserts the post-mutation version is
  monotonically > pre-mutation version; if a concurrent commit happened
  between getContextInfo and joinPoint.proceed, the handler re-fetches
  the now-correct oldState before emitting.
- |-
  Document the concurrent-mutation semantic on the activity-feed
  feature page — operators reading the feed should know that
  concurrent same-entity mutations may produce overlapping wrong-diff
  rows; the underlying entity's current state is authoritative.
- |-
  Add a metric `activity_handler_oldstate_drift_total{event_type}`
  that compares each handler's emitted oldState against the
  immediately-prior committed activity row for the same data entity
  + event type; emit a counter increment when the new emit's oldState
  doesn't match the previous emit's newState. Race incidents become
  observable.
- |-
  Consider serializing concurrent @ActivityLog method invocations per
  (data_entity_id, event_type) tuple via a Redis-backed mutex or a
  Postgres advisory lock keyed on the hash of (entity_id, event_type).
  Throughput cost; correctness gain.
notes: |-
  NEW invariant captured in batch VAL-LSN-019-B. Surfaced by primary-source
  examination of ActivityHandler + ActivityAspect line-by-line.

  This is an audit-correctness finding with operator-visible
  manifestation under load. Single-user-UX deployments rarely hit the
  race; ingestion-heavy + automated-workflow deployments hit it
  routinely. The SHAPE of the bug — wrong oldState in an audit row
  emitted under concurrent same-entity load — is the kind of finding
  that becomes "ODD's audit log is unreliable for compliance" once an
  operator notices the discrepancy.

  Cross-cutting connections:
    - Pairs with `activity-write-tx-coupled-emit-failure-rolls-back-business-mutation`
      — the same @ReactiveTransactional that protects audit atomicity
      ALSO sets up this race (each racer commits its own TX
      independently of the other)
    - Pairs with `activity-handler-state-differ` (new entity) — names
      the dispatch core that participates in the race
    - Pairs with `service-tier-multi-step-writes-without-reactivetransactional-toctou-surface`
      — both are TOCTOU surfaces; this one is "TOCTOU within an
      already-@ReactiveTransactional method"

  PRIMARY-SOURCE confidence: HIGH (ActivityHandler sidecar surfaces
  the race in tests_coverage_semantic with severity HIGH;
  ActivityServiceImpl + ActivityAspect line citations confirm the
  R2DBC + READ COMMITTED + snapshot-pair shape).
