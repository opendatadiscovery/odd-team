- id: H-004
  hypothesis: |-
    The tab COUNT badge next to each class tab reflects the count of entities of
    that class scoped to the authenticated user (i.e. the My Objects count is
    per-user, and class counts respect the active My Objects scope).
  derivation: |-
    The doc states "tab counts update with the active query and facet
    selection" and frames My Objects as the user's personal subset. A user
    reading per-class counts would assume they reflect what they will see.
    Response-shape + doc-claim seed.
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |-
      The COUNTS are catalog-wide, not user-scoped — this is the F-017
      `catalog_wide_count_design_my_objects_not_a_boundary` posture inherited
      wholesale. SearchServiceImpl.getFacetsData (SearchServiceImpl.java:122-155
      per F-017.yaml hop 2) computes the class-facet aggregate counts with NO
      owner predicate (ReactiveSearchFacetRepositoryImpl has no OWNERSHIP join);
      only the `myObjectsTotal` value (the My Objects tab's own hint,
      SearchResultsTabs.tsx:27) is owner-scoped. So: the My Objects tab badge IS
      per-user (correct), but the Datasets/Transformers/etc. badges are
      catalog-wide regardless of whether My Objects is active — they do NOT
      re-scope to the user's owned subset. A user on the My Objects tab sees a
      result list of (say) 3 owned datasets but a Datasets-tab badge of 4000.
      The doc's "counts update with the active query and facet selection" is
      true for query+facets but silent on the my-objects-vs-counts asymmetry.
