security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      No SecurityRule entry for the path; no @PreAuthorize at the
      controller. Falls through to .authenticated() catch-all. Sibling
      mutation endpoint PUT /api/dataentities/{id}/alert_config IS
      rule-gated (DATA_ENTITY_ALERT_CONFIG_UPDATE); the read endpoint
      is intentionally not (per the convention that GET endpoints are
      not rule-gated).
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Returns data across owners. The endpoint takes no principal
      parameter; the SQL has no OWNERSHIP join; the existence-check
      is soft-delete-inclusive. Cross-owner enumeration is the
      operational consequence — pairs with REFACTOR-024 on
      getAllAlerts and the broader read-collaborative posture.
  weaknesses:
    - |-
      HIGH: cross-owner enumeration — any authenticated user can
      enumerate any catalogued entity's complete alert history by
      ID; pairs with REFACTOR-024
    - |-
      MEDIUM: asymmetry with sibling alert_config PUT — mutation
      endpoint is rule-gated; read endpoint is not (the asymmetry is
      a class-wide convention but has no inline justification)
    - |-
      LOW: soft-deleted entities' alert history reachable — useful
      for audit but creates a discovery surface for an attacker with
      prior knowledge of soft-deleted IDs
    - |-
      HIGH (under DISABLED): anonymous traffic can read every alert
      ever raised on every catalogued entity by enumerating data_entity_id
  strengths:
    - |-
      Soft-delete-inclusive existence-check is INTENTIONAL design
      (the helper name encodes the intent); supports the audit-export
      workaround use case
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Per-tab-activation on the entity detail page's Alerts tab —
      fires alongside getDataEntityAlertsCounts on every navigation
    - |-
      Audit-export workaround — operators hit this endpoint
      immediately before manually resolving each alert; burst-y
      around incident response windows
  weaknesses:
    - |-
      MEDIUM: no upper bound on pagination `size` — `size=1_000_000`
      triggers unbounded query; the audit-export use case AMPLIFIES
      the risk (operators want large pages to complete exports with
      fewer round-trips)
    - |-
      LOW: deep-pagination cost — `OFFSET = (page - 1) * size`; cost
      grows linearly with page; keyset pagination not implemented
    - |-
      LOW: two DB round-trips per request (existence-check + page+count)
      via sequential flatMap; could be collapsed to one outer LEFT JOIN
    - |-
      LOW: no method-level observability (no @Timed, no Micrometer
      counter, no caching, no Cache-Control/ETag)
notes: |-
  NEW entity captured in batch 2026-05-19L. The endpoint is doubly
  significant — operationally as the per-entity Alerts tab on the UI
  AND as the platform-recommended audit-export workaround for a
  housekeeping bug. The contract has architecturally-load-bearing
  asymmetries (cross-owner read, soft-delete-inclusive existence, no
  pagination upper bound) that the live docs only partially surface.

  Cross-cutting connections:
    - Related operations: list-data-entity-alerts (NEW batch L)
    - Strengthens existing invariants:
      - read-collaborative-cross-owner-enumeration (NEW SURFACE — 15th
        contributing site)
      - pagination-parameters-declared-but-unconstrained-at-spec-and-controller-layers
        (NEW PRIMARY SOURCE confirmation)
    - Cross-references "Alert" entity (existing) — that captures the
      Alert primitive; this captures the per-entity read surface
    - Cross-references the "alertmanager-webhook-receiver" entity —
      raw chunk descriptions propagated from AlertManager webhooks
      surface through this endpoint

  Three DOC-NNN candidates flow from this entity:
    (a) Update the alerting feature page (/features/active-platform-features/alerting)
        to document the cross-owner read posture on the per-entity tab
        AND the audit-export workaround
    (b) Document the pagination shape on the audit-export workaround
        section — recommend a size value, name the truncation risk
    (c) Document the soft-delete-inclusive existence-check behaviour
        for the audit-export use case
