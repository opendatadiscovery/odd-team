gap_id: TEST-GAP-173
category: missing-integration
criticality: HIGH
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties
surfaced_by:
- NotificationsProperties.md:implicit_adrs.[4]
- NotificationsProperties.md:bugs_limitations_corner_cases.[12]
behaviour: 'Lazy replication-slot + publication creation: `NotificationSubscriber.java:99-122`
  checks `pg_replication_slots` and conditionally creates. Live doc: ''ODD Platform
  doesn''t clean up replication slot it has created.'' Replication-slot orphan risk
  if operator renames `notifications.wal.replication-slot-name` between deployments
  — Postgres retains WAL for orphaned slot indefinitely (primary disk exhaustion).
  No test verifies lazy-create vs never-drop contract.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/ReplicationSlotLifecycleTest.java
  name: notificationsEnabled_firstLeaderRun_createsSlotAndPublication_neverDropsOnShutdown
evidence:
- 'NotificationsProperties.md says: ''lazy create, never drop ... if an operator renames
  notifications.wal.replication-slot-name between deployments and forgets to drop
  the old slot, Postgres retains WAL for the orphaned slot indefinitely — risking
  primary disk exhaustion'''
cross_references:
- concepts.yaml:entities[Notifications].security_aggregate.weaknesses.[8]
proposed_action: Add Testcontainers-Postgres test booting platform with `notifications.enabled=true`
  and a fresh slot name; assert (a) the slot + publication appear after first leader
  run, (b) shutdown does NOT drop them. Locks the operator-owns-cleanup contract.
