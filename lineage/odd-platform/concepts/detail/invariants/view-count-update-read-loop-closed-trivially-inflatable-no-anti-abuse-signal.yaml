- Sample the view_count increment (probability 1/N)
- Per-user view-count cap per entity per day
- 'Signal-mix: combine view_count with recency, owner-popularity, alert-state'
- Human-curated popular list override
- CREATE INDEX idx_data_entity_view_count_desc ON data_entity (view_count DESC) WHERE
