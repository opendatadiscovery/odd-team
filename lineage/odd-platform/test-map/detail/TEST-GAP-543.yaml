behaviour: |-
  Reinsertion of a soft-deleted name — no test asserts that creating a Tag with the same name as a soft-deleted Tag succeeds (the partial unique index permits it). This is the auto-create resurrection corner case: if an operator deletes `PII` and a per-data-entity user submits `PII` via `DATA_ENTITY_TAGS_UPDATE`, a new Tag row is minted with a DIFFERENT id; prior `tag_to_data_entity` rows that were hard-deleted are not restored. The platform's soft-delete pattern combined with hard-delete on relations means a deleted-then-recreated Tag silently loses ALL prior assignment history. There is no maintainer-visible audit of this.
test_class: missing-edge-case
