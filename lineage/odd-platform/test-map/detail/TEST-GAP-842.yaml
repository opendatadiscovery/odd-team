behaviour: |-
  **HIGH — Catalog-wide Popular column rendered to every authenticated user on the home page, regardless of Owner namespace. The home-page chrome surface of the read-collaborative posture (REFACTOR-024 + ADR-CANDIDATE-003).** Overview.tsx:53-59 wraps OwnerAssociation in the auth-mode gate; OwnerAssociation mounts OwnerEntitiesList; OwnerEntitiesList.tsx:99-105 renders the Popular column as the 4th column of the Recommended panel.

  **The Popular column has NEVER been per-user**:
  - Backend `listPopular` (DataEntityServiceImpl.java:227-231) is a 1-line pass-through with NO owner filter (per F-003 facet `service tier is a 1-line pass-through`)
  - Repository `ReactiveDataEntityRepositoryImpl.listPopular` (line 633) sole orderBy is `view_count DESC` — no per-owner / per-namespace / per-tenant predicate
  - Only the My Objects / Upstream / Downstream columns are owner-scoped; Popular is catalog-wide by design (ADR-CANDIDATE-003)

  **The 9-field DataEntityRef projection exposes**:
  - `externalName` (the system-of-record name — often discloses table-name conventions, PII categorisation)
  - `internalName` (the operator-curated business name)
  - `entityClasses[]` (DEG / Dataset / Transformer / QualityTest / etc. — reveals catalog composition)
  - `oddrn` (the canonical identifier — discloses datasource type + structure)
  - `manuallyCreated`, `status`, `isStale`, `hasAlerts` (operational metadata)
  - **`view_count` is NOT in the projection** — so the ranking ORDER leaks but the magnitude is opaque

  **The doc says** (catalog-overview.md, WebFetched 2026-05-20 status 200): "on auth-disabled deployments the panel is visible but the per-user filtering does not apply" — IMPLYING that on auth-enabled deployments per-user filtering DOES apply. **This is FALSE for the Popular column specifically.**

  **Compounded with F-001 inflation surface**:
  - Anonymous DISABLED-mode `/api/dataentities/{id}` can pump any entity's view_count (per probe P-002 + REFACTOR-220)
  - An attacker can promote any chosen entity to the home-page Popular column
  - Every authenticated user then sees the attacker-chosen entity's `externalName` + `internalName` on their home page
  - This is **directed cross-owner data-name exfiltration** via Popular ranking manipulation

  **Why HIGH**:
  - **Security**: Cross-owner data exposure to every authenticated user; ranking manipulation is operator-reachable
  - **Doc-drift compound**: The live doc gives operators a false expectation of per-user filtering on Popular
  - **Cross-pillar impact**: F-001 inflation + F-003 ranking + REFACTOR-024 read-posture compose into this surface
