  multiplicity_per_trigger: 1
  unresolved: false
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Per-row orange-clock icon (lib/icons/StaleIcon) rendered next to the
    entity name when isStale=true, with a hover tooltip showing relative
    last-ingested time. NO icon when isStale=false (the surface is
    invisible — undiscoverable to a new operator who has not seen a
    stale row before).
  evidence: ResultItem.tsx:87-90 + MetadataStale.tsx:20-32
  cardinality_per_call: 0..1 per row (0 when not stale, 1 when stale)
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — the staleness signal is per-row, not amplified at the UI
  layer. The cross-surface multiplication (ten consumer sites per
  SHB-001) is a coverage factor, not a per-call amplification.
observed_vs_expected:
  facets:
  - facet: |-
      Stale signal silently disabled when odd.data-entity-stale-period
      is unset — same Class-1 silent-default footgun as LSN-001 and LSN-002
    observed: |-
      DataEntityStaleDetector.java:13 guard `stalePeriod != null` returns
      false when the config key is unset; every entity reports
      is_stale=false silently; the MetadataStale primitive renders
      nothing; the operator sees a uniform "fresh" UI across every list
      surface — no log, no warning, no admin-visible signal the indicator
      is dead. Same shape as LSN-001 (attachment-ephemeral default
      silently wiped production data) and LSN-002 (minio-region-unset
      silently defaulted to us-east-1). SHB-001 caveat 1 names this
      explicitly and notes the application.yml:208-214 block needs
      verification.
    expected: |-
      EITHER (a) the predicate fails-loud when stalePeriod is null
      (throws an explicit startup error so the operator must set or
      explicitly accept-default the value); OR (b) the default value is
      hard-coded in DataEntityStaleDetector.java itself (e.g.
      `@Value("${odd.data-entity-stale-period:7}")` per the doc-claimed
      7-day default).
    drift_class: stale_signal_silently_disabled_when_config_unset_no_admin_visible_signal
    provenance: |-
      STATIC — SHB-001 caveat 1 + DataEntityStaleDetector.java:13 line-by-line.
      The application.yml default needs verification (deferred to
      next /enrich pass on DataEntityStaleDetector).
    severity: HIGH
    ui_unverified: false
  - facet: |-
      Never-ingested entity reports is_stale=false — misleading "fresh"
      indicator for manually-created Data Entities that have NEVER had
      a real ingestion event
    observed: |-
      The `pojo.getLastIngestedAt() != null` guard means an entity that
      has never been ingested (e.g. a manually-created data entity via
      the Data Entity Groups create flow, or an entity pending its first
      ingestion) is reported as is_stale=false. The operator sees a
      "fresh"-looking row for an entity with no underlying data at all.
      Verifiable by walking the ingestion path: does lastIngestedAt get
      set on registration or only on first ingestion event?
    expected: |-
      EITHER (a) a tri-state is_stale (fresh / stale / never-ingested)
      with the never-ingested case rendered with a distinct icon /
      caveat; OR (b) the predicate returns true for never-ingested
      (treating "no data yet" as a stronger signal of staleness than
      "data older than 7 days").
    drift_class: never_ingested_entity_reports_is_stale_false_misleading_for_manually_created_entities
    provenance: |-
      STATIC — SHB-001 caveat 2 + DataEntityStaleDetector.java:13.
    severity: MEDIUM
    ui_unverified: true
    ui_unverified_reason: |-
      The ResultItem walk + MetadataStale walk both show isStale + the
      tooltip showing "Ingested at" — neither has a "never ingested"
      branch in the .tsx, suggesting the backend always passes one of
      true/false. The UI cannot distinguish; this is a backend-data-
      shape gap propagated to the UI.
  - facet: |-
      Ingestion-write capability can forge freshness — no source-
      authenticity check on lastIngestedAt
    observed: |-
      The staleness predicate uses pojo.getLastIngestedAt(), which is
      populated from ingestion events. Anyone with ingestion-write
      capability (the Collector's per-datasource token) can emit an
      ingestion event with a current timestamp and forge freshness —
      the predicate has no notion of source authenticity. May be
      deliberate (multi-tenant ingestion is part of the threat model)
      but is undocumented.
    expected: |-
      EITHER (a) document the integrity boundary on the staleness doc
      page — "freshness reflects WHAT the ingestion source claims, not
      independently observed liveness"; OR (b) cross-check the
      lastIngestedAt against an independently-tracked timestamp the
      Collector cannot influence.
    drift_class: ingestion_write_capability_can_forge_freshness_no_source_authenticity_check
    provenance: |-
      STATIC — SHB-001 caveat 3.
    severity: LOW
    ui_unverified: true
    ui_unverified_reason: |-
      The integrity claim depends on the ingestion auth-filter behaviour
      (F-017 sibling pillar P-09 finding — ingestion filter disabled-by-
      default) and the ODD-Specification's stance on lastIngestedAt.
      UI cannot see the source of the timestamp.
  - facet: |-
      Clock-skew flicker across horizontally-scaled deployments — same
      entity renders is_stale=true on node A and is_stale=false on
      node B if lastIngestedAt is within stalePeriod ± skew of "now"
    observed: |-
      The predicate uses DateTimeUtil.generateNow() per mapper invocation
      (no centralised clock). Horizontally-scaled deployments with wall-
      clock skew see flicker for entities at the threshold edge.
      Immaterial for single-node deployments; relevant if the platform
      is horizontally scaled (a configuration shape the docs don't
      explicitly support today but operators do attempt).
    expected: |-
      EITHER (a) compute is_stale at write-time (when the ingestion
      event lands) and persist; OR (b) use a database-side NOW() in the
      SELECT; OR (c) document the single-node assumption explicitly.
    drift_class: clock_skew_flicker_horizontally_scaled_deployments_inconsistent_per_node_render
    provenance: |-
      STATIC — SHB-001 caveat 4 + DataEntityStaleDetector.java:13.
    severity: LOW
    ui_unverified: false
  - facet: |-
      Deployment-wide threshold — no per-tenant / per-namespace / per-
      datasource window
    observed: |-
      odd.data-entity-stale-period is a single global config key.
      Operators of mixed-cadence environments (some sources update
      hourly, some weekly) get a single deployment-wide window — either
      the hourly sources are over-aggressively marked stale, or the
      weekly sources are under-aggressively marked stale. Known
      limitation per SHB-001 NOTES.
    expected: |-
      Per-datasource override (e.g. a datasource-level stalePeriodDays
      column) OR per-namespace override.
    drift_class: deployment_wide_threshold_no_per_tenant_per_namespace_per_datasource_window
    provenance: |-
      STATIC — SHB-001 known-limitation note + DataEntityStaleDetector.java:13.
    severity: LOW
    ui_unverified: false
  - facet: |-
      Orange-clock icon is undiscoverable for new operators — no legend,
      no first-time hover hint, no doc page
    observed: |-
      MetadataStale.tsx renders bare <StaleIcon/> wrapped in a tooltip
      that ONLY appears on hover and ONLY shows the "Ingested at" relative
      time — NOT the WORD "stale" + the threshold + a link to "what does
      stale mean?". A new operator looking at a search result row sees an
      unfamiliar icon next to some entity names and not others. The first-
      time discoverability is poor. The icon has no aria-label.
    expected: |-
      Either (a) inline mini-legend on first row hover; (b) a top-of-
      results-list header "N stale entries (threshold: 7 days)"; (c) a
      "what is stale?" tooltip explanation that links to the doc page.
    drift_class: result_item_no_tooltip_legend_orange_clock_meaning_undiscoverable_for_new_users
    provenance: |-
      STATIC — MetadataStale.tsx:20-32 + ResultItem.tsx:87-90 line-by-line.
    severity: MEDIUM
    ui_unverified: false
  - facet: |-
      Live doc silent on what makes an entity stale — no glossary entry,
      no Discovery doc mention of the orange-clock icon
    observed: |-
      The live `features/data-discovery/search` page (per F-017
      WebFetched 2026-05-19/-26 status 200) lists facets but does NOT
      mention the staleness signal, the orange-clock icon, the 7-day
      threshold, or the odd.data-entity-stale-period config key. SHB-001
      NEXT step 3 names the DOC-GAP candidate but it has not been graduated
      to a DOC-NNN backlog item. The is_stale field is REQUIRED in spec
      (3 schemas) yet the user-facing doc gives no semantic.
    expected: |-
      Add a "Metadata staleness" section to the live Search & Filtering
      doc page (or to a dedicated main-concepts entry) explaining:
      (a) what the orange-clock means; (b) the 7-day default (and the
      config key for operators); (c) which entities can be stale
      (cross-link to the never-ingested edge case); (d) the deployment-
      wide vs per-source scope.
    drift_class: live_doc_silent_on_what_makes_an_entity_stale_no_glossary_entry
    provenance: |-
      STATIC — SHB-001 NEXT step 3 + WebFetch of the search page (per
      F-017 batch ZA / ZL — neither WebFetch returned any "stale" /
      "orange-clock" mention).
    severity: MEDIUM
    ui_unverified: false
    reflection_followup_F146: |-
      RESOLVED as of 2026-06-03 (feature-reflector F-146, H-011). A dedicated
      canonical aspect page documentation/docs/data-discovery/metadata-stale.md
      now EXISTS and is LIVE (WebFetch 200) — it documents the predicate, the
      7-day default, and ALL FIVE caveats (silent-default footgun as a danger
      hint, never-ingested, globally-dead-signal-invisible, no-per-source-override,
      clock-skew flicker, plus trust-on-write forgeability). The config-page side
      is covered by DOC-010 (odd-platform.md#detecting-stale-metadata, shipped PASS).
      Residual: search.md does not cross-link metadata-stale.md (LOW-priority
      discoverability cross-link only — the content is correctly homed per Cornerstone 5).
  - facet: |-
      Single predicate multiplies across TEN UI surfaces — the staleness
      signal is cross-cutting; any change to the predicate ripples
      everywhere
    observed: |-
      Per SHB-001 evidence, ten UI consumers render the is_stale signal:
      Search/ResultItem (THIS), Directory/Entities/EntitiesList/EntityItem,
      DataEntityDetails/DataEntityDetailsHeader, Terms/TermDetails/...
      LinkedEntity, Overview/OwnerAssociation/OwnerEntitiesList/DataEntityList,
      DataModelling/QueryExampleDetails/...LinkedEntitiesItem,
      DataEntityDetails/DataEntityDetails, Directory/Entities/EntitiesList,
      lib/hooks/api/dataEntity.ts, and via LineageMapper into lineage-graph
      nodes. A single backend predicate change has ten user-visible blast
      radii. SHB-001 NEXT step 1 specifies the F-NNN graduation target as
      "the cross-cutting feature" — F-146 IS that graduation.
    expected: |-
      A single canonical doc + a single test pinning the predicate's
      semantics + a single regression suite covering all ten render
      sites — preserved by the inheritance from this F-NNN.
    drift_class: multiplied_ten_ways_across_surfaces_single_predicate_dispatches_to_search_directory_detail_lineage_term_owner_recommended_modelling_overview_hooks
    provenance: |-
      STATIC — SHB-001 evidence block + ResultItem.tsx walk + MetadataStale.tsx
      walk.
    severity: MEDIUM
    ui_unverified: false
