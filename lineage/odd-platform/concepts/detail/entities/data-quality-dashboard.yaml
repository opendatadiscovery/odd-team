security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      RESOLVED END-TO-END batch ZG (2026-05-25). At the FRONTEND layer the
      /data-quality route is mounted bare at App.tsx:73 with NO WithPermissionsProvider
      wrapper — contrast the sibling /lookup-tables route at App.tsx:75-88 which IS
      wrapped and gates on LOOKUP_TABLE_* permissions. The "Data Quality" top-bar
      tab (ToolbarTabs.tsx:45-49) is rendered unconditionally. At the BACKEND
      layer the DataQualityRunsController class-level sidecar CONFIRMED the
      ungated posture: no @PreAuthorize, no entry in SecurityConstants.SECURITY_RULES
      for /api/dataqatests/runs (verified by grep over lines 98-355 returning
      zero matches), no programmatic permissionService.hasPermission call in the
      service, no owner predicate at the repository tier. The path falls through
      to AuthorizationCustomizer.pathMatchers("/**").authenticated(). The P-090
      hypothesis was CORRECT — the dashboard mirrors the read-collaborative
      posture of the per-dataset DataQualityController. Any authenticated user
      renders the full catalog-wide aggregate quality view; under
      auth.type=DISABLED anonymously reachable.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      No principal-derived scope at the UI layer — the dashboard fetches and
      renders catalog-wide aggregates (table-health counts, monitored/unmonitored
      counts, per-category run-status counts across ALL datasets). The traced SQL
      in ReactiveDataQualityRunsRepositoryImpl joins OWNERSHIP ONLY when the
      operator supplies owner/title FILTER ids — it is a user-driven filter, NOT a
      security scope; there is no current-user predicate in the dashboard query.
      Consistent with ODD's read-collaborative posture (the DataQualityController
      sidecar records the same for the four per-dataset DQ read endpoints), but
      undocumented on every live Data Quality doc page.
  strengths:
  - |-
    The dashboard exposes only GET reads — no mutation surface, no owner-scoped
    write. The catalog-wide quality posture is read-collaborative by design.
  - |-
    Filter selections (including which owners/namespaces an operator filtered by)
    are catalog metadata, not credentials — the URL-query leak (filter names
    written verbatim to the address bar) is LOW-sensitivity.
  weaknesses:
  - |-
    The /data-quality route has NO client-side permission guard (App.tsx:73, bare
    <Route>) while the adjacent /lookup-tables route IS guarded — the DQ dashboard
    is under-gated relative to its sibling. If the backend GET /api/dataqatests/runs
    also lacks an authorization gate (P-090), the catalog-wide aggregate health of
    every dataset is visible to every authenticated principal — and anonymously
    reachable under auth.type=DISABLED (REFACTOR-185 family).
  - |-
    Every live Data Quality doc page (dashboard.md, data-quality.md) is SILENT on
    access control / who can view the dashboard — the natural place to disclose
    the 'visible to any authenticated user' posture, and it does not. DOC-GAP,
    severity MEDIUM.
  - |-
    DataQualityContent destructures only { data, isSuccess } from the fetch hook —
    never isError/error. A 4xx/5xx from the backend is presented to the operator
    as three grey 'No data' donuts, indistinguishable from a genuinely empty
    catalog — a real backend failure masquerades as 'no DQ tests ingested'.
  cross_file_inconsistencies:
  - |-
    The five contributing sidecars (DataQuality, DataQualityContent,
    DataQualityFilters, DataQualityStore, TestCategoryResults) AGREE on the
    ungated-route observation — every one records App.tsx:73 as a bare route.
    No contradiction across the batch. The single open question is the BACKEND
    half (P-090), uniformly deferred by all five sidecars to the not-yet-enriched
    DataQualityRunsController node.
  contributing_files:
  - DataQuality.md
  - DataQualityContent.md
  - DataQualityFilters.md
  - DataQualityStore.md
  - TestCategoryResults.md
  - DataQualityRunsController.md
  evidence:
  - DataQuality.md:security.known_security_gaps.[0] (ungated route — App.tsx:73 vs gated /lookup-tables)
  - DataQualityContent.md:security.known_security_gaps.[0] (bare GET, no UI permission gate)
  - DataQualityContent.md:bugs_limitations_corner_cases.[5] (no error UI — failed fetch looks like empty catalog)
  - DataQualityFilters.md:security.known_security_gaps.[0] (filter names leaked into URL query string)
  - DataQualityRunsController.md:security.known_security_gaps (BACKEND UNGATED CONFIRMED — no @PreAuthorize, no SecurityRule, no owner predicate)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    GET /api/dataqatests/runs fires once per /data-quality mount and refetches on
    every filter change / window-focus (react-query default staleTime 0) —
    DataQualityContent.tsx:24
  - |-
    The backend resolves each fetch as THREE repository queries zipped server-side
    (getLatestDataQualityRunsResults / getLatestTablesHealth / getMonitoredTables) —
    DataQualityRunsServiceImpl.java:36-39
  - |-
    Every single filter chip toggle triggers a full dashboard re-query (no
    debounce, no Apply gate) — an operator building a multi-chip filter slice
    fires one multi-CTE-multi-join backend query per chip — DataQualityStore.ts:32-42
    + DataQualityContent.tsx:23-24
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One aggregate fetch per filter state — no per-ring or per-category lazy
      loading; all three rings + all category cards come from one DTO. No bulk /
      batch variant. react-query dedupes concurrent identical-key requests.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      The dashboard endpoint declares no page/size params (openapi.yaml:1973-2087);
      testResults is the full category set. Bounded in practice — the category
      count is small and backend-bounded (~6) — so this is not a scaling failure,
      but the contract has no pagination.
  strengths:
  - |-
    Single atomic fetch — all three rings reflect the same filter application at
    the same instant; no partial-load skew across the dashboard.
  - |-
    The /data-quality JS chunk (component subtree + jotai store + charts) is
    code-split and lazy-loaded — not in the initial bundle; downloads on first
    navigation to the route.
  - |-
    Client-side derivation cost is trivial — three useMemo reductions bounded by
    ~6 categories x ~6 statuses; per-category TestCategoryResults render is O(6).
  weaknesses:
  - |-
    No staleTime / gcTime configured on useGetDataQualityDashboard — react-query
    default staleTime 0 means the dashboard re-runs all three backend queries on
    every remount and every window-focus. A modest staleTime would cut redundant
    fetches with no correctness loss (DQ aggregates do not change second-to-second).
    Severity LOW.
  - |-
    No debounce / no Apply gate between filter selection and dashboard re-query —
    the full multi-CTE multi-join getDataQualityTestsRuns SQL runs on every single
    filter change. Severity MEDIUM.
  - |-
    The filter autocompletes have no debounce on the search input — one catalog
    list-API request per keystroke; filling the 10-slot panel generates a request
    burst. Severity MEDIUM.
  cross_file_inconsistencies:
  - |-
    The no-debounce-on-filter-re-query finding is recorded from THREE angles —
    DataQualityStore (the derived atom updates synchronously on every source
    write), DataQualityContent (no debounce around useGetDataQualityDashboard),
    and DataQualityFilters (no Apply gate). Consistent across the batch, not a
    disagreement — three sidecars triangulate the same MEDIUM-severity gap.
  contributing_files:
  - DataQuality.md
  - DataQualityContent.md
  - DataQualityFilters.md
  - DataQualityStore.md
  - TestCategoryResults.md
  evidence:
  - DataQualityContent.md:performance.known_performance_gaps.[0] (no staleTime — refetch on focus)
  - DataQualityContent.md:performance.hot_paths.[0] (one GET, three server-side queries)
  - DataQualityFilters.md:performance.known_performance_gaps.[0-1] (no autocomplete debounce, no Apply gate)
  - DataQualityStore.md:performance.known_performance_gaps.[0] (every chip toggle re-fetches the dashboard)
