mitigations_unimplemented:
  - |-
    Change the channel filter from `startsWith(nameLike)` to
    `containsIgnoreCase(nameLike)` at SlackMessageProviderClient.java:52.
    One-line change. Operator-visible improvement: typing any
    substring of a channel name returns results. Slight perf cost
    (linear scan still, but no significant change for typical
    workspace sizes).
  - |-
    Wire member_joined_channel / member_left_channel Slack events
    to invalidate the SlackMessageProviderClient cache. Requires
    a new event-handler in the SlackMessageProviderEventHandler
    chain that calls asyncLoadingCache.synchronous().invalidateAll().
    Closes the 60-second staleness window.
  - |-
    Document the filter shape (startsWith vs contains) AND the
    cache TTL (1-minute) AND the bot-must-be-member constraint
    on the live api-reference page. Operator-facing signal to
    set realistic UX expectations.
  - |-
    For large workspaces (10K+ channels), consider a smarter
    cache structure: per-channel-name lookup index instead of
    full-list scan. Optional; only kicks in at scale.
notes: |-
  NEW LOW-severity invariant captured in batch 2026-05-25-ZF.
  The finding is a UX-shaped imperfection rather than a
  correctness or security issue. Operators running large
  Slack workspaces (1000+ channels) may notice the cache-miss
  latency; operators running small workspaces may notice the
  startsWith filter limitation. Neither is data-loss-shaped.

  Cross-cutting connections:
    - Pairs with the OUTBOUND `decoupled-write-pattern` (the
      same feature uses the cache for read AND queues for
      write — coherent architectural posture)
    - The cache + filter pattern is the read-side complement
      to the queue + leader-election pattern at write time;
      both serve to decouple the platform from Slack API
      latency / availability

  One DOC-NNN candidate flows from this invariant:
    Document the channel-filter shape (startsWith), the cache
    TTL (1-minute), and the bot-must-be-member constraint on
    the live data-collaboration api-reference page.
