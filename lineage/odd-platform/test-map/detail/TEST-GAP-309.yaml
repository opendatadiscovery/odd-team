behaviour: 'Inflation-attack regression: scripted GET /api/dataentities/{id} loop
  pushes any chosen entity to position 0 in GET /api/dataentities/popular. Closes
  REFACTOR-201 from primary source (consumer half of the view-count loop). STRENGTHENED
  batch H — the repository sidecar confirms from primary source: `listPopular` cteConfig.orderBy
  sets exactly ONE orderBy field (`DATA_ENTITY.VIEW_COUNT.sort(SortOrder.DESC)`) at
  line 633 with NO time-decay, NO per-class weight, NO per-owner filter. STRENGTHENED
  batch I — the DataEntityServiceImpl sidecar confirms the F-003 inflation loop is
  STRUCTURALLY CLOSED at the service tier: `listPopular` (lines 227-231) is a 1-line
  pass-through with no enrichment, no owner filter, no anti-abuse signal. The producer-side
  write (view_count increment in getDetails) plus this consumer-side ranking read
  complete the inflation loop. The trivial-to-game finding is now anchored at THREE
  tiers (controller G + repository H + service I). STRENGTHENED batch ZA — DataEntityDetails
  sidecar confirms the UI-tier amplification: the LSN-017 bug means every UI page-open
  drives +2 view_count (vs +1 for a direct API call). The inflation attack is therefore
  2x MORE EFFICIENT from the UI than from the API. Plus Overview sidecar confirms
  the home-page surface where the inflated entity becomes visible to every authenticated
  user via the Popular column (Overview.tsx:53-59 mounts the chain, OwnerEntitiesList
  renders Popular without owner-scoping). The full F-001 -> F-003 attack chain is
  now anchored at FIVE tiers: UI producer (DataEntityDetails) + Redux thunk (fetchDataEntityDetails)
  + controller (getDataEntityDetails) + service (DataEntityServiceImpl) + repository
  (incrementViewCount + listPopular) + UI consumer (Overview Popular column rendering).'
