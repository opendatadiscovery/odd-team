behaviour: |-
  **MEDIUM — `MultipleFilterItemAutocomplete`'s options-loading effect (`MultipleFilterItemAutocomplete.tsx:91-104`) has a stale-closure / stuck-spinner bug: `setOptionsLoading(true)` runs unconditionally; `setOptionsLoading(false)` runs ONLY inside `if (hookResult.isSuccess)`; the effect's dependency array is `[searchText, autocompleteOpen]` — `hookResult` is NOT in it. Consequences: (a) if the list query is pending or has errored when the effect runs, `optionsLoading` stays `true` forever and the `noOptionsText` renders empty-string (`MultipleFilterItemAutocomplete.tsx:162`) — neither options nor a "No options" message; (b) because `hookResult` is excluded from deps, the effect does not re-run when the query later resolves, so freshly-arrived options are not flushed into `options` until the next `searchText`/`autocompleteOpen` change.**

  **The bug** (statically certain):
  - Effect at `MultipleFilterItemAutocomplete.tsx:91-104`:
    ```
    useEffect(() => {
      setOptionsLoading(true);
      if (hookResult.isSuccess) {
        setOptions(getFilterOptions(...));
        setOptionsLoading(false);
      }
    }, [searchText, autocompleteOpen]);
    ```
  - `hookResult` is `useGetNamespaceList({...})` or one of the four siblings — a react-query result with `isSuccess`, `isError`, `isPending`.
  - Two failure modes:
    1. The effect fires (searchText change). `hookResult.isPending` is true. `setOptionsLoading(true)` runs; the `if` skips. `optionsLoading` stays true. The query later resolves — but the effect does NOT re-run (no `hookResult` in deps). The Autocomplete shows nothing until the user types another character.
    2. The query rejects (network error / 500). `hookResult.isError = true`, `isSuccess = false`. Same outcome: `optionsLoading` stays true; the `noOptionsText` is empty; user sees a blank Autocomplete with no error signal.

  **What an operator sees on a failed list-API call**: they open the Namespace autocomplete; the spinner stays forever; no options appear; no "No options" message; no error banner. They are stuck. The only escape is to type a character, which re-fires the effect — but the same failure path repeats unless the API recovers.

  **No test pins this**: the entire DataQuality subtree has zero tests.

  **Test gap shape**: unit test using React Testing Library + MSW. Three scenarios: (a) successful query → assert optionsLoading transitions true→false. (b) pending query → assert optionsLoading transitions true→true (FAILS today on this assertion because the effect never re-runs). (c) errored query → assert optionsLoading transitions to false AND a "Failed to load" message renders (FAILS today — this is a FIX-REQUIRED case).
