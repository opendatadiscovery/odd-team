proposed_action: |-
  Add `PostgresWALMessageProcessorSingleImplementorRegressionPinTest`. Two test variants:

  1. `postgresWALMessageProcessor_exactlyOneImplementor_pinsSingleImplInvariant` —
     - Classpath scan via Reflections (or ArchUnit): find all classes implementing `PostgresWALMessageProcessor`.
     - Assert `count == 1`.
     - Assert the single implementor is `AlertNotificationMessageProcessor`.
     - PINS the single-implementor architectural invariant.

  2. `notificationSubscriber_messageProcessorFieldIsSingleBeanType_pinsAlertOnlyAssumption` —
     - Reflection on `NotificationSubscriber.class` fields.
     - Assert the `messageProcessor` field's declared type is `PostgresWALMessageProcessor` (not `List` / `Map`).
     - PINS the single-bean injection assumption.

  3. `notificationSubscriber_publicationTargetIsAlertTable_pinsAlertTableCoupling` —
     - Static analysis: assert `registerPublication(connection, Tables.ALERT)` is called at `NotificationSubscriber.java:51` (literal `Tables.ALERT` reference; no variable substitution).
     - PINS the alert-table coupling.

  4. `springBoot_walMessageProcessorBeanRegistration_singleBeanOnly_confirmsRuntimeInvariant` —
     - `@SpringBootTest` with `notifications.enabled=true`.
     - Inject `Map<String, PostgresWALMessageProcessor>` (Spring resolves all bean names).
     - Assert `map.size() == 1`.
     - PINS the runtime invariant.

  Pair with REFACTOR-NNN (ArchUnit / Spring fitness-function) if the maintainer wants compile-time enforcement.

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP pins the single-implementor architectural invariant. Sister TEST-GAP-455 covers the runtime contract on the same interface. No contradiction.
