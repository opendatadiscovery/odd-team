ui_review_2026_05_26:
  reviewer: ui-review-2026-05-26 (slice G — Management general)
  status: ui-complete (UI tier confirms the symmetric cascade dialog UX gap)
  notes: |-
    UI walk of EditableOwnerItem.tsx + EditableNamespaceItem.tsx +
    DataSourceItem.tsx confirms a UI-TIER analogue of the cascade-on-delete
    pattern: the three operator-facing delete affordances ship the
    IDENTICAL minimal ConfirmationDialog text:
    (1) EditableOwnerItem.tsx:55-72 — "Are you sure you want to delete
        this owner?" / "\"{name}\" will be deleted permanently".
    (2) EditableNamespaceItem.tsx:46-65 — "Are you sure you want to
        delete this namespace?" / "\"{namespace.name}\" will be deleted
        permanently".
    (3) DataSourceItem.tsx:57-76 — "Are you sure you want to delete
        this datasource?" / "Delete \"{name}\" datasource?".
    Two NEW drift facets at the UI tier:
    (a) UI_DOES_NOT_WARN_ABOUT_CASCADE_BLOCK — none of the three
        dialogs mention "if there are dependent rows the delete will
        fail with CascadeDeleteException USR004". An operator clicks
        Delete on a Namespace with 100 entities under it, gets a
        ControllerAdvice toast on rejection — but the UI implies the
        delete is unconditionally destructive. Operator mental model:
        "this WILL delete permanently" — reality: "this will EITHER
        delete permanently OR fail because of children."
    (b) UI_DOES_NOT_DISCLOSE_TOCTOU_RACE — the structural race-window
        finding (concurrent ownership/data-entity insert slipping
        past the existence check) is invisible at the UI. There is
        no per-row "actively-ingesting / has-children" warning badge,
        no read-only flag for in-use rows, no operator-visible
        signal that a delete-then-orphan window exists.
    Cross-link: NEWLY MINTED F-161 + F-163 share the "minimal
    ConfirmationDialog text" pattern recognition. The pattern is a
    cross-Management UX class — terse confirmation, asymmetric
    consequence disclosure, no operator-facing reflection of
    cascade-block / TOCTOU / no-grace-period semantics.
