    actual_behavior: |
      The mutation endpoint IS rule-gated. SecurityConstants.SECURITY_RULES contains an entry for
      PUT /api/dataentities/{data_entity_id}/alert_config at SecurityConstants.java:304-307, pairing the
      DATA_ENTITY resource with DATA_ENTITY_ALERT_CONFIG_UPDATE (per the getDataEntityAlerts sidecar
