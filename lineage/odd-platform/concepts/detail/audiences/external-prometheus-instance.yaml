name: External Prometheus Instance
canonical_in_docs: false
canonical_candidate: true
description: 'The operator-run Prometheus deployment that ODD Platform writes metrics
  to (`POST {metrics.prometheus-host}/api/v1/write`) and reads metrics from (`{metrics.prometheus-host}/api/v1/query`)
  when `metrics.storage=PROMETHEUS`. Runtime requirement: Prometheus v2.33+ with `--web.enable-remote-write-receiver`
  (disabled by default in v2.33+; without it every write returns 404). In a shared-Prometheus
  multi-tenant deployment, the `tenant_id` label appended via `odd.tenant-id` is the
  ONLY mechanism keeping one tenant''s series from being readable by another tenant''s
  query. main-concepts.md does not name this; live `/configuration-and-deployment/odd-platform#metric-storage-backend`
  documents the integration.'
axes_present:
- config_prefixes
nodes:
- odd-platform java CounterTimeSeriesExtractor config-key-consumer:metrics.storage@L20
contributors:
- 'CounterTimeSeriesExtractor@L20.audiences: operator''s external Prometheus instance
  (consumes Snappy-encoded Prometheus remote-write payloads); Prometheus instant-query
  API on /api/v1/query consumed by ExternalMetricReader to render the Data Entity
  → Metrics tab in the React UI'
evidence:
- CounterTimeSeriesExtractor@L20.md:concepts.audiences
- CounterTimeSeriesExtractor@L20.md:dependencies_semantic.requires-runtime
notes: 'Distinct from the `Prometheus AlertManager` audience: this is the

  Prometheus time-series database (consumes remote-write), while

  `Prometheus AlertManager` is the alerting infrastructure (POSTs

  webhooks INTO ODD). Both are external Prometheus-family systems but

  they sit on different integration surfaces — one is downstream

  destination, the other is upstream source.

  '
