proposed_canonical: Identity-decoupled directory CRUD (Owner)
rationale: 'Single-sidecar canonical observation from batch 2026-05-12E (OwnerController.createOwner).
  The platform''s design intent is `OwnerController` for admin-time directory CRUD
  (just `name` + optional `roles`, no security-context read) + `OwnerAssociationRequestController`
  for user-claim-via-association + downstream `UserOwnerMappingService` for the actual
  binding. **Crucially: no auth-mode flow auto-creates an Owner on first login** —
  operators must manually pre-create per-user Owner rows OR accept association requests.
  This is the design intent, but the live owners doc says ''Every ODD Platform user
  should associate themselves with one of the existing owners'' which implies the
  association is a USER-initiated step against EXISTING owners; operators are not
  told they need to pre-create them. Worth surfacing because every Owner-link-dependent
  endpoint (the entire ''Owner-link is the gate for owner-scoped views'' invariant)
  cascades onto this prerequisite, which itself is undocumented.'
contributing_concepts:
- 'OwnerController.createOwner: directory CRUD operation (batch E)'
- 'OwnerAssociationRequestController.createOwnerAssociationRequest: separate user-claim
  flow (batch E)'
- 'AuthIdentityProviderImpl.java:23-53: no OwnerService.create / getOrCreate call
  on login (batch E)'
- Live `/authorization/owners` page silence on creation mechanics + association mechanics
  + sprawl prevention (batch E)
suggested_add_to_docs: true
