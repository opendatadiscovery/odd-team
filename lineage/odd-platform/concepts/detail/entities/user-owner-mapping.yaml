name: User-Owner Mapping
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
- P-09
description: |-
  user_owner_mapping table row — the gate that turns an authenticated
  principal (oidc_username + provider) into an Owner identity. Schema:
  (owner_id, oidc_username, provider, deleted_at). The PRIMARY mechanism
  for owner-scoped reads (getMyObjects family); also the per-data-entity
  authorization Policy's anchor for 'is: dataEntity:owner' scoping.
  **STRENGTHENED batch 2026-05-19K** — AuthIdentityProviderImpl sidecar
  primary-source confirms the row's runtime consumer at
  `AuthIdentityProviderImpl.java:50-53` (the fetchAssociatedOwner Mono
  chain) and the case-sensitive `.eq()` lookup at
  `ReactiveUserOwnerMappingRepositoryImpl.java:116-127`. NEW load-bearing
  finding: the LOGIN_FORM ↔ LDAP cross-mode bleed is HIGH severity
  (previously LOW-MEDIUM) — provider=null is the SAME lookup key for both
  modes, and during auth-mode migration scenarios (a documented operator
  use case) the second-mode user inherits the first-mode user's Owner.
  ADDITIONAL: the S2sAuthenticationFilter hardcodes username='ADMIN'
  (uppercase) and produces UsernamePasswordAuthenticationToken → falls
  into the else-branch at line 32 → provider=null → if an operator named
  a LOGIN_FORM/LDAP user 'ADMIN' (case-sensitive exact), the S2S caller
  inherits that user's Owner-link (NEW HIGH-severity literal collision
  invariant). The single-Mono lookup at fetchAssociatedOwner is the doc-side
  invariant verbatim at "one user can be associated only with one owner
  and vice versa" (WebFetched 2026-05-19 status 200) — schema enforcement
  is application-side via clear-active-then-insert pattern, NOT a partial
  unique index.

  **STRENGTHENED BATCH N (2026-05-19N) — REPOSITORY-LAYER PRIMARY SOURCE
  NOW PINNED.** ReactiveUserOwnerMappingRepositoryImpl
  (`repository/reactive/repository/ReactiveUserOwnerMappingRepositoryImpl.java`,
  128 lines) is the SQL primary source for every USER_OWNER_MAPPING read
  and write. The class exposes six method-level operations:
    - createRelation (line 41-51) — CLEAR-ACTIVE-THEN-INSERT pattern
      via `deleteActiveRelationByOwner(ownerId).then(insert)`
    - deleteRelation (line 54-62) — soft-delete by (oidc_username, provider)
    - deleteActiveRelationByOwner (line 65-74) — soft-delete by owner_id
    - getAssociatedOwner (line 77-85) — the LOAD-BEARING owner-scoping
      primitive consumed by AuthIdentityProviderImpl.fetchAssociatedOwner
    - isOwnerAssociated (line 88-96) — boolean existence consumed by
      OwnerServiceImpl.delete cascade-block
    - getUserRolesByOwner (line 99-114) — 4-way JOIN ROLE ← ROLE_TO_POLICY
      ← OWNER_TO_ROLE → USER_OWNER_MAPPING; the AUTHORIZATION HOT PATH
      consumed by RoleServiceImpl.getCurrentUserRoles

  **NEW PRIMARY-SOURCE FINDINGS BATCH N**:
    (a) **PROVIDER-NULL CROSS-MODE BLEED PRIMARY SOURCE PINNED AT SQL
        LAYER** — getConditions helper at lines 116-127 builds
        `OIDC_USERNAME.eq(oidcUsername) AND DELETED_AT.isNull() AND
         (StringUtils.isNotEmpty(provider) ? PROVIDER.eq(provider) :
         PROVIDER.isNull())`. The branch fires the IS NULL predicate
        for BOTH null AND empty-string provider. (Strengthens
        provider-null-cross-mode-bleed invariant from 1-sidecar to
        2-sidecar with SQL-layer primary source.)
    (b) **Cross-provider username row-duplication in external JOINs**
        (NEW HIGH invariant) — FOUR sibling repositories
        (ReactiveAlertRepositoryImpl, ReactiveActivityRepositoryImpl,
        ReactiveOwnerAssociationRequestRepositoryImpl,
        ReactiveOwnerRepositoryImpl) LEFT JOIN user_owner_mapping on
        OIDC_USERNAME ONLY without the provider half of the compound
        key. Two-row coexistence (alice, null) + (alice, GITHUB)
        produces Cartesian-product row duplication in alert / activity
        / owner-display read paths.
    (c) **Soft-delete-only growth** — three "delete" methods are all
        UPDATE statements setting deleted_at = generateNow(). No
        `DELETE FROM user_owner_mapping` anywhere. Table grows
        monotonically.
    (d) **Clear-active-then-insert pattern** — createRelation issues
        deleteActiveRelationByOwner(ownerId) FIRST, then INSERT.
        UserOwnerMappingServiceImpl.createRelation ADDS an outer
        clear by (username, provider). Two-step clear enforces both
        partial unique indexes from V0_0_89:
          - unique_deleted_at_per_owner ON (owner_id) WHERE
            deleted_at IS NULL
          - user_owner_mapping_oidc_username_provider_deleted_key ON
            (oidc_username, provider) WHERE deleted_at IS NULL
    (e) **No @ReactiveTransactional on multi-statement createRelation**
        — the inner DELETE + INSERT chain via .then() is NOT atomic
        across R2DBC connections; OwnerAssociationRequestServiceImpl
        wraps in @ReactiveTransactional but UserOwnerMappingServiceImpl
        does NOT.

  Single-Mono lookup at fetchAssociatedOwner is the doc-side invariant
  verbatim at "one user can be associated only with one owner and vice
  versa" (WebFetched 2026-05-19 status 200) — schema enforcement is
  application-side via the clear-active-then-insert pattern AND DB-side
  via the two partial unique indexes added in V0_0_89.

  **STRENGTHENED batch 2026-05-19-O (GithubUserHandler sidecar)** —
  GitHub-specific identity-drift finding: the username field consumed
  by USER_OWNER_MAPPING is GitHub's MUTABLE `login` string (per
  GithubUserHandler.java:36 + line 56 default `adminAttribute = USER_LOGIN`).
  GitHub allows free login renames at any time (the old name enters a
  90-day escrow, then is released to others). A renamed user presents
  `(alice2, github)` to AuthIdentityProviderImpl.fetchAssociatedOwner
  on next login; the prior `(alice, github)` USER_OWNER_MAPPING row is
  ORPHANED. NO id-based fallback. NO migration tool. NO live-doc warning.
  Extends the F-011 `compound_key_silent_in_docs` drift facet to a new
  failure mode: identity-drift-at-IDP, not just compound-key mapping or
  auth-mode migration. HIGH severity per the GithubUserHandler sidecar
  primary-source assessment.
