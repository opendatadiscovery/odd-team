mitigations_unimplemented:
- |-
  Option A (in-place audit-table extension): V0_NN migration making
  `activity.data_entity_id` NULLABLE + adding a `event_scope` discriminator
  column (`DATA_ENTITY | RBAC | DATASOURCE | COLLECTOR | USER_OWNER_BINDING`).
  Update ReactiveActivityRepositoryImpl read paths to use LEFT JOIN
  to DATA_ENTITY (with `event_scope = 'DATA_ENTITY'` predicate where
  appropriate) and update the UI to render non-data-entity rows.
  HIGH-scope migration; touches every read path.
- |-
  Option B (separate audit surface): create a sibling `rbac_audit`
  / `platform_audit` table with its own schema (FK to actor +
  action + resource + timestamp; no data_entity FK). Add a
  PlatformAuditService bean writing to it. Update the Activity Feed
  UI to merge both tables on read. MEDIUM-scope; new surface; UI work.
- |-
  Option C (operator-facing documentation): rewrite the Activity Feed
  live page to explicitly state "the activity feed covers data-entity
  events only; RBAC / Owner directory / Datasource / Collector changes
  are NOT recorded — investigate via application logs (not retained by
  default)". Cheapest; preserves the existing schema; arms operators
  with accurate expectations.
- |-
  Companion fix for the cascade-delete forensic-erasure: add `ON DELETE
  RESTRICT` to the FK constraint to make the housekeeping cascade FAIL
  LOUDLY when activity rows still reference a TTL-deleted entity, OR
  add a pre-cleanup hook in DataEntityHousekeepingJob that snapshots
  the activity rows to a separate `archived_activity` table before
  cascading. Either preserves the audit trail across TTL cleanup.
notes: |-
  This invariant is the SCHEMA-LAYER ROOT CAUSE underlying the F-006
  audit-silence pattern. The 7-sidecar F-006 evidence chain (UI tier
  via batch Q, controller tier via batches E + P, service tier
  inferred, repository tier via batches H + N) all surface the
  audit-silence as observable behaviour; the batch-R schema-layer
  primary source explains WHY it is the way it is. **Future
  remediation conversations should start at this schema-layer
  invariant, not at the higher-tier surfaces.** Adding `@ActivityLog`
  to OwnerServiceImpl.create without resolving the schema constraint
  is a dead-end fix; the annotation would fire and the activity-event
  emission would fail at the FK constraint at INSERT time.

  **The fix scope is therefore larger than F-006's per-sidecar
  recommendations suggested** — the F-006 concept entry recommends
  "wire @ActivityLog(OWNER_CREATED) / OWNER_UPDATED / OWNER_DELETED";
  this is INSUFFICIENT without a schema migration. The right scope
  is a Schema Migration + Audit Service Refactor jointly, not an
  annotation sprinkle.

  **Cross-cutting connections**:
    - Anchors the F-006 7-sidecar audit-silence pattern
      (no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f)
      at the SCHEMA layer
    - Pairs with the activity-table-partitioning invariant — both are
      durability characteristics of the activity table; this one
      captures the COVERAGE characteristic (what events fit), the
      partition invariant captures the RETENTION characteristic
      (whether old rows are dropped)
    - Pairs with the read-collaborative-cross-owner-enumeration
      invariant — the audit feed has BOTH a coverage gap (RBAC events
      missing) AND a reading-blast-radius (every authenticated user
      can read everything); BOTH are independent forensic
      vulnerabilities

  Three DOC-NNN candidates flow from this invariant:
    (a) Document on the Activity Feed live page that the audit
        coverage is data-entity-scoped only — operators reading the
        page should not assume RBAC / Owner / Datasource / Collector
        changes are captured
    (b) Document the cascade-delete forensic-erasure (when entities
        are TTL-cleaned, their audit history goes with them) on the
        Data Entity Status / Lifecycle live page — operators
        reasoning "I can always reconstruct what happened to a
        deleted entity" need this knowledge
    (c) Document the proposed two-table audit pattern (DATA_ENTITY
        + PLATFORM) in an internal architecture note, anchored on
        this concept entry, so future maintainers approaching the
        F-006 remediation see the schema constraint up-front
