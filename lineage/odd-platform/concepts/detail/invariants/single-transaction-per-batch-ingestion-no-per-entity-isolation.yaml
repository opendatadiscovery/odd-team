notes: |
  Cross-batch architectural-hygiene finding. The invariant is INTENTIONAL design
  (the `@ReactiveTransactional` annotation is the explicit artefact of intent)
  but operationally surprising for collector authors reading the OpenAPI spec.

  Combined with the replace-not-merge surface, the ingestion pipeline has TWO
  uncovered-in-docs surprises that compound:

    (1) "One bad entity rolls back the batch": no per-entity error report, no
        partial-success body, no DLQ. Operators debugging a flaky collector
        must read application logs for the actual failing entity.

    (2) "Omission deletes": replace-not-merge for lineage and metadata. An
        attacker with a valid token (or any caller under filter-OFF, the
        default) can erase existing data by re-emitting incomplete state.

  Recommended cleanup paths:

    (a) Doc: add an explicit operator-facing 'Ingestion contract' page with
        the all-or-nothing rule + the replace-not-merge rule + a worked
        example of a failed-batch debugging session.

    (b) Code: extend the HTTP response shape to carry per-entity outcome
        details (or at minimum, the failing entity's ODDRN and the error
        class) — currently `Mono<ResponseEntity<Void>>` is the entire
        contract.

    (c) Code: add a feature-flag for `ingestion.per-entity-isolation` that
        switches to a per-entity transaction-per-entity model when enabled.
        Trade-off: lose cross-entity atomicity (e.g. lineage edges that
        span two entities in the batch); gain partial-success debuggability.

  Cross-references:
    - Companion invariant: `silent-data-loss-via-replace-not-merge-ingestion-semantics`
      (the other side of the same gap).
    - Companion invariant: `repository-transactional-boundary-at-service-layer-not-repository`
      (the persistence-layer side of the same architectural choice — the
      repository is transaction-AGNOSTIC; the service tier owns atomicity).
