behaviour: |-
  `getDataEntityAlerts` and `getDataEntityAlertsCounts` not-found path via `checkDataEntityExistence` at lines 327-335. A caller passing an unknown data-entity id should receive a 404; importantly, soft-deleted entities ARE accepted (`existsIncludingSoftDeleted` line 328). The not-found path is unpinned; the soft-delete-acceptance is also unpinned (a future tightening that excluded soft-deleted entities would silently change behaviour). STRENGTHENED batch L — the getDataEntityAlerts controller-method sidecar adds the controller-tier primary source: `AlertServiceImpl.getDataEntityAlerts (line 140) and getDataEntityAlertsCounts (line 147) both gate on checkDataEntityExistence (lines 327-335), which calls dataEntityRepository.existsIncludingSoftDeleted(dataEntityId). The repository helper name (existsIncludingSoftDeleted) and its sibling (existsNonDeletedByDataSourceId at line 158 — which DOES apply addSoftDeleteFilter(...)) demonstrate that the codebase distinguishes the two soft-delete postures by helper name.` The intent_anchor is the method name itself (`existsIncludingSoftDeleted`) — load-bearing for the audit-export workaround documented at the live alerting page WebFetched 2026-05-19. See TEST-GAP-502 for the soft-delete-inclusive-acceptance regression-pin specifically (this entry covers the not-found path AT THE SERVICE TIER; 502 covers the inclusive-read behaviour AT THE CONTROLLER TIER).
