# Moves the DEMO STAND's host ports so IT-154 can drive odd-platform's docker/demo.yaml without
# touching the developer-facing 8080/5432 — composed on top of the demo file, never edited into it
# (the demo file IS the artifact under test).
#
# `!override` is load-bearing. Compose MERGES `ports` across -f files (the reference: "appends new
# entries that do not violate a uniqueness constraint" — docs.docker.com/reference/compose-file/merge),
# so a plain override ADDS 18095/15495 next to 8080/5432 and the stand binds all four. Measured
# 2026-09-03 (/review round 2, B1): `config` resolved database ['5432:5432','15495:5432'] and
# odd-platform ['8080:8080','18095:8080'], and the stand false-REDs with a bind failure the moment the
# maintainer's own demo stand or a local Postgres holds those ports. With `!override` the list is
# REPLACED: ['15495:5432'] / ['18095:8080'] (measured, docker compose v5.1.4).
# Legacy `docker-compose` 1.29.2 refuses the tag outright ("could not determine a constructor for the
# tag '!override'") — a loud failure at parse time, never a silent bind of 8080/5432. The harness's
# composeCmd() (helpers/docker.ts) prefers the v2 plugin, which is what this stand requires.
#
# Nothing else is overridden: the enricher and the collector reach the platform over the compose
# network at odd-platform:8080 either way, so the readiness gate, the healthcheck and the injection
# are exercised exactly as a user gets them. 18095/15495 are clear of every fixed e2e port (which
# stop at 18090/15441) and below run-suite.sh's per-stream SUT search, which starts at 18100/15500.
services:
  database:
    ports: !override
      - 15495:5432
  odd-platform:
    ports: !override
      - 18095:8080
