behaviour: |-
  **CRITICAL — LOGIN_FORM hardcodes ADMIN for EVERY authenticated user AND omits AuthorizationCustomizer wiring. The compound posture means any valid credential pair = unrestricted platform access.** Two file-level facts compose into the operator-facing surface:

  (1) **GrantedAuthorityExtractor(true) at line 81** — `mapReactiveUserDetailsService(...)` populates every in-memory `UserDetails` with `grantedAuthorityExtractor.getAuthorities(true)`. The boolean `true` parameter is the `isAdmin` flag; `GrantedAuthorityExtractor.java:13-14` returns `UserProviderRole.ADMIN`. There is NO per-user role distinction in LOGIN_FORM mode — `admin:admin`, `root:root`, and any operator-added entry resolve to identical ADMIN authority.

  (2) **AuthorizationCustomizer NOT wired at lines 55-57** — the chain has `.authorizeExchange(spec -> spec.pathMatchers(permittedPaths).permitAll().pathMatchers("/**").authenticated())` and NOTHING ELSE. Sibling `OAuthSecurityConfiguration.java:98` and `LDAPSecurityConfiguration.java:145` BOTH call `new AuthorizationCustomizer(permissionService, extractors)`; LOGIN_FORM does NOT. The `SecurityConstants.SECURITY_RULES:98-355` rule table — every `*_CREATE`, `*_UPDATE`, `*_DELETE`, `*_MANAGE` Permission — is INERT under LOGIN_FORM. An operator who authored Policies + Roles + Owner bindings via the platform UI gets a fully-built RBAC configuration that the live auth chain silently ignores.

  **STRENGTHENS existing TEST-GAP-140 (REFACTOR-073 validated) + TEST-GAP-141 (ADMIN-for-every-user)** with the config-class-tier primary source. Prior batch C surfaced these from the config-key-consumer view; this sidecar is the config-class primary source confirming both facts in one place plus the cross-batch composition (S2S also injects ADMIN at line 31-34 of S2sAuthenticationFilter; under LOGIN_FORM + S2S enabled, BOTH cookie-bearing and X-API-Key-bearing requests are operationally indistinguishable — both are ADMIN, both bypass the missing AuthorizationCustomizer).

  **Operator-impact scenario** (the operator-cliff failure mode per LSN-001 / LSN-002 family): an operator reads the live `/enable-security/authorization` page (WebFetched 2026-05-20 status 200 — confirms framework description is silent on which `auth.type` modes wire it), configures Policies + Roles + Owner-association in the UI, runs `auth.type=LOGIN_FORM` (the shipped default credential set is `admin:admin,root:root` per application.yml:37), and assumes the framework gates access. The chain wires no gate; every credential-bearer is ADMIN; every endpoint is reachable. The doc surface gives no warning.

  **Test gap shape**: regression-pin asserting (a) form-authenticated user receives ONLY `ADMIN` authority (no per-user distinction), (b) a request from a form-authenticated user with NO Policy/Role association can call `POST /api/permissions/{id}/policies` (a `PERMISSION_*_MANAGE`-gated endpoint per SecurityConstants) and receives HTTP 200 (not 403). PINS the intentional absence so a future maintainer wiring AuthorizationCustomizer "to match OAuth/LDAP" trips the test and must explicitly update it.
