- id: H-013
  hypothesis: "When a DELETE /api/namespaces/{id} runs concurrently with a request that registers a new datasource/collector/term/data-entity-group referencing that same namespace id, the system does NOT leave an orphan referent row pointing at a soft-deleted namespace (the cascade-check + delete behave atomically)."
  derivation: "Endpoint shape + negative-space: delete promises a safe teardown; an operator does not expect a concurrent attach to slip a referent past the cascade guard. NamespaceServiceImpl.delete runs the existsByNamespace checks then deletes with no transaction or lock."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      NamespaceServiceImpl.delete (lines 73-90) runs the four `existsByNamespace*` checks via Mono.zip,
      filters on !exists, then invokes namespaceRepository.delete(id). The flow is NOT inside any
      @ReactiveTransactional, there is no SELECT FOR UPDATE on the namespace row, and no advisory-lock
      (NamespaceController:bugs_limitations_corner_cases[2], MEDIUM). The data_entity / data_source FKs to
      namespace(id) carry NO ON DELETE clause (V0_0_1:84 etc.), so an orphan referent row is schema-possible.
      Whether the race is actually reachable — and whether it produces an orphan row pointing at a
      soft-deleted namespace or a delete-deferred outcome — requires RUNNING the system under concurrent
      load; it is not statically determinable.
    evidence:
      - sidecar: odd-platform__java__NamespaceController__controller-class__NamespaceController
        section: bugs_limitations_corner_cases[2] + performance.scaling_characteristics
        cite: "NamespaceServiceImpl.java:73-90 (no @ReactiveTransactional / no lock) + V0_0_1__init.sql:84 (FK without ON DELETE)"
        note: "check + delete not atomic; orphan-row is schema-possible; race reachability needs runtime."
    operator_visible_failure: |
      If the race is reachable: a datasource (or collector/term/entity) ends up referencing a soft-deleted
      namespace_id. That referent's namespace pill resolves to nothing (reads filter deleted_at IS NULL), the
      entity looks 'namespace-less' in the catalog, and a later same-name namespace recreate does NOT re-link
      it (H-008's orphaning). The operator sees an entity that lost its namespace scope with no action of
      their own and no error at the time. Severity pending probe (MEDIUM if reachable).
    severity: MEDIUM
    confidence: LOW
    probe_id: PENDING-F-028-1
    routes_to_finding: validation-gap
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: "probe PENDING-F-028-1"
    note: "Verdict requires running the system (concurrency race). Probe recorded in cross_references.probes_emitted as PENDING-F-028-1 (parallel-safe mode — no P-NNN file minted). Local docker-compose probe: fire DELETE + concurrent createDataSource(namespace_id=id) from two Reactor parallel threads; observe orphan vs cascade-deferred."

