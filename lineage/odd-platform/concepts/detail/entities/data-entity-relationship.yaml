name: Data Entity Relationship (ERD + Graph variants)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-02
description: |-
  NEW ENTITY, batch ZE — the persistent representation of how two
  data-entity rows relate to each other. Two variants discriminated
  by relationship_type column: ERD (entity-relationship-diagram —
  foreign-key relationships between dataset entities; cardinality +
  fields_pairs payload) and GRAPH (typed edge with directional flag
  + arbitrary specific_attributes JSON).

  The relationship itself is BACKED BY a data-entity row in the
  data_entity table with entity_class_ids containing 9
  (DATA_RELATIONSHIP per DataEntityClassDto.java:51). The
  `relationships` table at V0_0_87__create_relation_tables.sql:1-10
  carries data_entity_id (FK), relationship_type (ERD/GRAPH),
  source_data_entity_id, target_data_entity_id; the
  `erd_relationship_details` table at lines 12-22 carries the
  fields_pairs JSON; the `graph_relationship` table at lines 24-32
  carries the specific_attributes + is_directed payload.

  Schema gap (LSN-shape) — `relationships.data_entity_id` has NO
  UNIQUE constraint. One relationship-class data_entity could own
  multiple relationships rows; the detail endpoint uses mono()
  expecting one row and behaviour on multi-match is JOOQ-driver
  specific.

  Documented on docs/data-modelling/relationships.md (74 lines)
  with cardinality model + ingestion-matrix (PostgreSQL + Snowflake
  adapters only) + 30-default UI page-size.
