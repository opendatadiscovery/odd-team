- id: H-008
  hypothesis: |-
    When a user clicks Logout, the post-logout redirect lands them back on the
    legitimate ODD platform (their canonical URL), not on an attacker-controlled
    destination.
  derivation: |-
    Negative-space + endpoint-shape: post-logout redirect targets are a known
    open-redirect class; a user expects to return to ODD's own login page.
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      All five handlers derive the post-logout redirect target from the INBOUND request's
      Host header via UriUtils.getBaseUri(requestUri) (AzureLogoutSuccessHandler.java:38-44,
      CognitoLogoutSuccessHandler.java:43, etc.). There is NO platform.base-url allowlist,
      NO Host validation (Grep for platform.base-url/odd.platform-url/allowed.redirect
      returns zero). In a single-host deployment with a fixed reverse-proxy Host this is
      safe; behind a proxy that trusts X-Forwarded-Host, an attacker-forged host propagates
      into the IdP end-session redirect, and if the IdP's own allowlist is permissive
      (e.g. *.example.com) the user lands on the attacker domain AFTER an authenticated
      logout. The IdP-side allowlist is the only guard.
    evidence:
      - sidecar: odd-platform__java__auth__logout__AzureLogoutSuccessHandler.md
        section: bugs_limitations_corner_cases[1] + security.known_security_gaps[1]
        cite: "AzureLogoutSuccessHandler.java:40 + UriUtils.java:11-22 (Host-derived, no allowlist)"
        note: "Redirect target from inbound Host; no platform-side allowlist."
    operator_visible_failure: |-
      Conditional open-redirect after authenticated logout: only exploitable when the
      reverse proxy honours user-controlled X-Forwarded-Host AND the IdP allowlist is
      permissive — but when it triggers, the victim is delivered to an attacker domain at
      the moment they trust the app most (right after logging out), enabling convincing
      credential-phishing. Already tracked as PLT-075.
