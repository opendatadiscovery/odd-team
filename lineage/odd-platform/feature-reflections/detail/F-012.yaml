# Data Entity Group membership add/delete — product-owner reflection

## product_owner_narrative

The **Data Entity Group (DEG) membership** surface is how a catalog user files a data
entity into a group — a Domain, an ML Experiment, a DAG, or any other manually-created
`DATA_ENTITY_GROUP`-class container — so that the grouping shows up on the Catalog
Overview's Domain tiles and on the entity's own detail page (per the F-012 feature-flow
description + `addDataEntityDataEntityGroup`:understanding). It belongs to the Data
Discovery pillar's "group entities into DEGs; flag DEGs as Domains" primary action
(per system-mission P-01). A data engineer or steward uses it to say "this dataset is
part of the Finance domain"; a data scientist uses it to attach runs to an ML Experiment.

A user reaches it from a data entity's Overview page, in the **"Data entity groups"**
panel (`OverviewGroups.tsx`:31). Pressing **"Add to group"** opens a dialog whose only
control is a search-autocomplete picker; the user types a group name, picks one, and
presses **"Add"** (`AddDataEntityToGroupForm.tsx`:65-99). That fires
`POST /api/dataentities/{data_entity_id}/data_entity_group` with body
`{data_entity_group_id}` (the `addDataEntityToGroup` thunk, `dataentities.thunks.ts:219-236`),
a six-line reactive proxy into `DataEntityServiceImpl.addDataEntityToDEG`
(`DataEntityServiceImpl.java:387-408`). Each already-attached group shows as a row with a
close (X) icon; pressing it fires `DELETE /.../data_entity_group/{group_id}` immediately
(`GroupItem.tsx`:21-26 → `deleteDataEntityFromDEG`, `DataEntityServiceImpl.java:411-438`).
Crucially, the picker is pre-filtered to `entityClassId=DATA_ENTITY_GROUP, manuallyCreated:true`
(`AddDataEntityToGroupForm.tsx`:80-83) and the X icon only renders when
`group.manuallyCreated` (`GroupItem.tsx`:38) — so the UI funnels the user onto exactly the
constrained set the backend predicate `isManuallyCreatedDEG` accepts.

The working parts the product owner would demo: a single-entity **ADD** (returns the parent
DEG's ref, toggles the entity's `CUSTOM_GROUP` filled-flag), a single-entity **DELETE** (a
HARD delete of the join row, conditionally clears the filled-flag when no manual group
remains), a permission gate on **each direction independently** (`DATA_ENTITY_ADD_TO_GROUP`
for POST, `DATA_ENTITY_DELETE_FROM_GROUP` for DELETE — `SecurityConstants.java:228-236`),
and a SECOND, owner-side write path — the **DataEntityGroupForm** create/edit dialog
(batch-K extension) where the DEG owner picks the full member set at once and the PUT
`/api/dataentitygroups/{id}` bulk-REPLACES membership (`DataEntityGroupForm.tsx`:85-99).
The two write paths have DIFFERENT authorization scopes: the per-entity POST is gated on
the CHILD entity; the DEG-PUT is gated on the DEG itself (`DATA_ENTITY_GROUP_UPDATE`).

The integration story is cross-pillar: a successful membership write is immediately visible
to every authenticated user on the DEG's items list, on the child's `parentGroups`, and in
Group lineage (P-05) — the read-collaborative posture (`addDataEntityDataEntityGroup`:downstream_side_effects).
But it does NOT write the activity feed (P-07): neither add nor delete carries `@ActivityLog`,
even though `ActivityEventTypeDto.DATA_ENTITY_RELATION_UPDATED` exists as a dead enum value
(`ActivityEventTypeDto.java:12`) and every sibling write on the controller emits activity.

Edge cases a senior product owner would flag in a demo: removing the last child leaves an
**empty DEG** that still litters search and the Domain tiles; a double-click on "Add"
yields a `400 "already in this DEG"` while a double-click on the X yields a cheerful
"successfully deleted from group" toast even though nothing was deleted (the silent-204);
an entity that was soft-deleted by an ingestion cascade and restored cannot be re-added
(the join row is still there with `is_deleted=true`, so the ADD collides and reports
"already in this DEG" while the user sees no membership); and under `auth.type=DISABLED`
the whole surface is reachable anonymously. None of these is visible on the activity feed.

