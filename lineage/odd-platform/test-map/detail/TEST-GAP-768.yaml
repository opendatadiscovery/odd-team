proposed_action: |-
  Add `DatasetVersionDiffPerEntityScopingBypassTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `getDataSetStructureDiff_versionIdsBelongToDifferentDatasets_returnsCrossDatasetDiff_pinsBypass` — seed datasets A and B with distinct versions; GET `/api/datasets/{C}/structure/diff?first_version_id={A_ver}&second_version_id={B_ver}` where C is any third id; assert HTTP 200 with a well-formed diff payload comparing A's and B's columns. PIN the bypass.
  2. `getDataSetStructureDiff_responseIncludesBothDatasetsInternalDescriptionVerbatim_pinsF004ReadSideExposure` — same setup; seed A with `internal_description = '<script>alert("A")</script>'` and B with `internal_description = '<script>alert("B")</script>'`; GET the cross-dataset diff; assert BOTH script payloads are in the response verbatim. PIN the compound with F-004.
  3. `getDataSetStructureDiff_enumerationVectorViaSequentialVersionIds_returnsCatalogWideVersionExistenceProofs_pinsBlastRadius` — sweep version_id pairs `(1, 2), (2, 3), ... (N-1, N)` against `/api/datasets/1/structure/diff?...`; collect the dataset oddrns observable in the responses; assert the set covers MULTIPLE distinct datasets across owner boundaries.
  4. `getDataSetStructureDiff_oneVersionIdMatchesPathDataEntityId_otherDoesNot_stillSucceeds_pinsAsymmetricSurface` — first_version_id belongs to dataset {path_id}; second_version_id belongs to OTHER dataset; assert HTTP 200 with cross-dataset diff. The check is purely WHERE IN over version_ids; the path id is decorative.
  5. `sqlWhereClause_isOverDatasetVersionIdInOnly_pinsSqlShape` — capture jOOQ-emitted SQL during a diff call; assert the WHERE clause contains `DATASET_VERSION.ID in (?, ?)` but NOT `DATA_ENTITY.ID = ?`. PIN the SQL shape contract.

  Pair with REFACTOR-NNN: add `DATA_ENTITY.ID = datasetId` WHERE clause to `getDatasetVersionWithFields` (ReactiveDatasetVersionRepositoryImpl.java:146-157). Symmetric fix to TEST-GAP-767. When the fix lands, test #1 inverts to assert HTTP 404 on the cross-dataset diff attempt.

  Cross-pair with DOC-NNN: surface the dataSet endpoint family (currently OMITTED from the live API reference per WebFetch 2026-05-20) including the security model.
