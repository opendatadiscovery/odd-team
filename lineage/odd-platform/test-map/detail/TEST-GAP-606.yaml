behaviour: |-
  **No `state` parameter on end-session redirects across all 4 OIDC logout handlers (Azure, Cognito, ODDIAM, Google).** Per RFC 7636 + OIDC RP-Initiated Logout 1.0 §5, `state` is RECOMMENDED to bind the logout request to the user session and prevent CSRF on the post-logout redirect. The platform does not generate one. Azure handler at lines 38-44 only sets `post_logout_redirect_uri` + `client_id`; Cognito at lines 40-46 only sets `client_id` + `logout_uri`. Risk is LOW because the local WebSession is already invalidated by the time the redirect fires (no auth bypass); but an attacker who induces the user to follow a logout link with a crafted state can replay the post-logout redirect. Sibling handlers (Google, GitHub, ODDIAM, Cognito) all omit state — consistent across the chain, but consistently below the OIDC RP-Initiated Logout 1.0 §5 RECOMMENDED bar.
