  name: ingestionEntities_oversizedPayloadInvalidToken_heapBufferedBeforeReject
evidence:
- 'IngestionDataEntitiesFilter@L20.md says: ''an attacker submitting maximum-size
  20 MB payloads with invalid tokens forces the platform to buffer those payloads
  in heap before rejecting them — a low-effort heap-pressure DoS vector'''
- concepts.yaml:entities[Ingestion Filter].security_aggregate.weaknesses.[3]
