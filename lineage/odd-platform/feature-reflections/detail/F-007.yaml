        section: bugs_limitations_corner_cases[2] + performance.hot_paths
        cite: "Alerts.tsx:15-17 + AlertServiceImpl.java:90-109"
        note: "useEffect([]) — no refresh after resolve; totals are a 3-COUNT + recursive-CTE fetch"
