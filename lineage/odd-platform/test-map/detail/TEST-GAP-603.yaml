behaviour: |-
  **Empty `provider.getLogoutUri()` → Mono.empty() short-circuit — silent 'logout that doesn't log out'.** Lines 33-35: `if (StringUtils.isEmpty(provider.getLogoutUri())) return Mono.empty();` returns BEFORE setting redirect AND BEFORE invalidating the session. An operator who omits `logout-uri` from Cognito YAML configuration sees the logout button do nothing visible — NO redirect, NO error, just a response cycle that returns the user to the same page STILL LOGGED IN. This is operator-hostile silent failure: the user clicks logout, the request returns 200, the browser stays on the page with the same session cookie. No log warning, no boot-time check. The Cognito handler is the ONLY one with this guard — Azure NPEs (TEST-GAP-599), Google/GitHub don't have this code path (different logout shapes), ODDIAM has similar but different fallback. The asymmetry is operator-hostile because the behaviour DIFFERS between Cognito (silent-success-doing-nothing) and Azure (loud-NPE-500). A unified contract would either fail-fast at boot OR consistently silent-success across all handlers.
