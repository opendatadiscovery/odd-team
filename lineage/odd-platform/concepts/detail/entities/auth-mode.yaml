    (camelCase split `userName`). Spring relaxed binding converts: `username-attribute`
    (kebab single-word) → `usernameAttribute` (single word, NOT `userNameAttribute`);
    `user-name-attribute` (kebab triple-word) → `userNameAttribute`. To bind to the
    POJO field, operators MUST write `user-name-attribute` in YAML — but the docs
    verbatim show `username-attribute`. Operator following docs copy-paste verbatim
    gets a silently-unbound field; whichever username claim defaults the OAuth2/OIDC
    client picks is used instead. No boot-time fail-fast. (ODDOAuth2Properties.md:docs_link_semantic.doc_drift_findings.[3])'
  - '**OAUTH2 Lombok `@Data` toString() exposes clientSecret verbatim (MEDIUM)** —
    `ODDOAuth2Properties.java:12,30` apply `@Data` to both the outer Properties class
    AND the nested `OAuth2Provider` POJO. The nested POJO''s auto-generated `toString()`
    includes `clientSecret=<plaintext>` — no `@ToString.Exclude` on the field. Spring
    Boot 3.4.10''s `/actuator/configprops` default sanitiser DOES mask keys matching
    `*secret*` (so the actuator surface is safe), but any future `log.debug("loaded
    oauth2 providers: {}", properties.getClient())` would emit every client''s secret
    in plaintext. (ODDOAuth2Properties.md:bugs_limitations_corner_cases.[3] + security.known_security_gaps.[0])'
  - '**OAUTH2 free-string `provider` field admits silent typos (MEDIUM)** — `ODDOAuth2Properties.java:32`
    declares `private String provider;` (NOT the `Provider` enum at `Provider.java:3-5`).
    Validator at lines 16-19 checks non-empty only. A typo (`provder: google`, `provider:
    Goggle`) binds cleanly; every consumer-side `equalsIgnoreCase(Provider.X.name())`
    check (GoogleUserHandler.java:39, GithubUserHandler.java:45, AzureUserHandler.java:26,
    CognitoUserHandler.java:26, ODDIAMUserHandler.java:28, OAuthSecurityConfiguration.java:168)
    fails to match; deployment silently routes through generic OIDC with no provider-specific
    user enrichment / admin-group mapping / logout. (ODDOAuth2Properties.md:bugs_limitations_corner_cases.[2]
    + security.known_security_gaps.[2])'
  - '**OAUTH2 empty-client-map passes validation, fails downstream with obscure error
    (LOW)** — `ODDOAuth2Properties.validate()` iterates `getClient().values()` (line
    18); empty map is a no-op. `auth.type=OAUTH2` with zero registered clients passes
    Properties validation and fails downstream at `InMemoryReactiveClientRegistrationRepository`
    constructor with a Spring framework error far from the actual root cause. (ODDOAuth2Properties.md:bugs_limitations_corner_cases.[4])'
  - '**LDAP password leak via Lombok @Data toString() — REFINED from batch C actuator-env
    claim (HIGH severity)** — batch C reported the LDAP password leaking via `/actuator/env`.
    Batch D primary-source verification (`ODDLDAPProperties.md`) refines this: Spring
    Boot 3.4.10''s `management.endpoint.env.show-values: NEVER` default DOES sanitise
    `/actuator/env` (password appears as `******` in actuator). The DURABLE leak surface
    is `ODDLDAPProperties.java:10,14` — `@Data` on the class + `private String password`
    with no `@ToString.Exclude` and no `@JsonIgnore`. Any code path that logs the
    bean (e.g. `log.info("props = {}", properties)`) emits the password verbatim.
    Same pattern across `EmailSenderProperties` (notifications email password), `ODDOAuth2Properties.OAuth2Provider`
    (clientSecret), `ODDLDAPProperties` (LDAP password). 4-sidecar triangulated cross-cutting
    invariant. (ODDLDAPProperties.md:security.known_security_gaps.[0] + bugs_limitations_corner_cases.[0])'
  - '**LDAP empty admin-groups produces zero-admin deployment (MEDIUM)** — `ODDLDAPProperties.java:18,28-32`
    declares `Group groups` as a nullable nested block with `Set<String> adminGroups`
    field. `validate()` enforces URL + search-method only; admin-groups absence is
    not validated. `LDAPSecurityConfiguration.java:91-93` consumes this — when `Group`
    is null or `adminGroups` is empty, returns USER-only authority for every authenticated
    LDAP user. Bundled `application.yml:50-65` ships the entire `ldap:` block commented
    out — operator who uncomments without setting `groups.admin-groups` gets a deployment
    where NO LDAP user can reach admin features. Live docs do not warn that admin-groups
    is load-bearing. (ODDLDAPProperties.md:bugs_limitations_corner_cases.[3] + security.known_security_gaps.[3])'
  - '**LDAP ActiveDirectory.domain unvalidated (MEDIUM)** — `ODDLDAPProperties.java:35-38`
    declares nested `ActiveDirectory` block with `boolean enabled` + `String domain`.
    `validate()` does NOT check `enabled=true` implies `domain` non-empty. Downstream
    `LDAPSecurityConfiguration.java:78` constructs `new ActiveDirectoryLdapAuthenticationProvider(properties.getActiveDirectory().getDomain(),
    properties.getUrl())` — `domain=null` is accepted by Spring Security (falls back
    to non-domain UPN bind), almost certainly not the operator intent. Silent misconfiguration.
    (ODDLDAPProperties.md:bugs_limitations_corner_cases.[4] + security.known_security_gaps.[4])'
  - Under `auth.type=DISABLED`, every endpoint named anywhere in this catalog becomes
    anonymously reachable — every controller sidecar's `weaknesses` block flags this
    individually; aggregated here as a cross-cutting consequence of the application.yml
    default. CANONICAL evidence is now DisabledAuthSecurityConfiguration@L10.
  cross_file_inconsistencies:
  - All controller sidecars treat `auth.type` as opaque (it gates `permittedPaths`
    and the AuthorizationCustomizer chain upstream); AppInfoController@L18 is the
    only sidecar where `auth.type` is itself the DATA being exposed; the four `*SecurityConfiguration`
    sidecars (batch 2026-05-12C) are the canonical WIRING-side sidecars where `auth.type`
    selects the actual SecurityWebFilterChain. The three layers (consumer-of-mode
    in controllers + reporter-of-mode in AppInfo + wirer-of-mode in *SecurityConfiguration)
    coexist in the codebase and the catalog has to surface all three.
  - '**Per-mode AuthorizationCustomizer asymmetry**: OAUTH2 + LDAP wire it (OAuthSecurityConfiguration.java:98
    + LDAPSecurityConfiguration.java:145); LOGIN_FORM + DISABLED do not. Live `/enable-security/authorization`
    describes the Policies/Permissions/Roles/Owners framework without naming this
    precondition. Operators reading the authorization page see a framework; operators
    choosing LOGIN_FORM never get it.'
  - '**Permit-all path lists drift across modes**: LOGIN_FORM hand-codes a 5-element
    list at line 49-51 (`/actuator/health`, `/favicon.ico`, `/ingestion/entities`,
    `/ingestion/datasources`, `/api/slack/events`); OAUTH2 + LDAP use `SecurityConstants.WHITELIST_PATHS`
    via AuthorizationCustomizer; DISABLED''s `.anyExchange().permitAll()` doesn''t
    path-discriminate. A maintainer adding a new always-public path to WHITELIST_PATHS
    silently leaves LOGIN_FORM out of sync. (LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[7])'
  - 'Live `enable-security` page documents the four modes; live `enable-security/authentication`
    page documents S2S as a fifth mode ''complementing any of the above''; live `enable-security/authentication/s2s`
    page documents `auth.s2s.enabled` + `auth.s2s.token` + `X-API-Key` header but
    does NOT mention `auth.ingestion.filter.enabled` / `Authorization: Bearer` / `IngestionDataEntitiesFilter`.
    Operators reasonably conflate the two ingestion-related filters. (IngestionDataEntitiesFilter@L20.md:docs_link_semantic.doc_drift_findings.[1])'
  - 'NEW batch O — OAuth Provider-Quirks Strategy Pattern explains the asymmetric
    per-provider behaviour: each OAuth provider handler diverges from the AbstractOIDCUserHandler
    base class in a UNIQUE direction (Google: no extends, hd-claim, email-default,
    Spring-discovered userNameAttribute; GitHub: OAuth2-not-OIDC distinct list, two
    outbound HTTP calls, org-and-team gating; Azure logout: no null guard; Cognito
    logout: graceful-degradation guard). The chain wiring is symmetric (shouldHandle
    + @Conditional + first-match-wins) but the per-provider SUBSTANCE diverges by
    IDP-protocol need. Consequence: any cross-cutting security change (e.g. add
    state-param CSRF protection) must be replicated across 5 logout handlers + 6
    user handlers; risk of partial-rollout silent gaps. (concept invariant:
    oauth-provider-quirks-strategy-pattern batch O)'
  - 'NEW batch O — `OperationUtils.containsIgnoreCase` IS FULL-STRING equality, not
    substring (CORRECTION from primary-source Read at OperationUtils.java:7-10).
    Used at FOUR call sites: LDAPSecurityConfiguration.java:94-97 (LDAP admin-groups);
    GithubUserHandler.java:114-119 + 122-131 (GitHub admin-teams, org-scoped);
    GithubUserHandler.java:135-137 (GitHub org-membership); GoogleUserHandler.java:60
    (Google admin-principals). All four are case-insensitive FULL-STRING matches.
    The previously-asserted "substring-collision admin escalation" worked example
    (`admin-groups: [''ops'']` matches `devops` / `noops`) DOES NOT OCCUR. Retraction
    block now lives in canonicalisation_candidates/substring-match-admin-escalation-ldap-containsignorecase.yaml.'
