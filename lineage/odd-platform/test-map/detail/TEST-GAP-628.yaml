gap_id: TEST-GAP-628
category: missing-security
criticality: HIGH
node_ids:
  - "odd-platform java OwnerController controller-method:deleteOwner"
pillars_affected: [P-08, P-09]
surfaced_by:
  - "deleteOwner.md:bugs_limitations_corner_cases.[6] (getOwnerList surfaces SOFT-DELETED owners selectively — by-id vs list asymmetry — severity MEDIUM)"
  - "deleteOwner.md:security.known_security_gaps.[2] (Soft-deleted owners visible via GET /api/owners/{id} — severity MEDIUM)"
behaviour: |-
  **SOFT-DELETED OWNERS VISIBLE INCONSISTENTLY: invisible via list (`GET /api/owners`); visible via by-id (`GET /api/owners/{id}`).** The list query at `ReactiveOwnerRepositoryImpl.java:86-121` uses `enrichSelect` which calls `listCondition` (inherited from ReactiveAbstractSoftDeleteCRUDRepository.listCondition at lines 86-94) which adds `deleted_at IS NULL`. So soft-deleted owners do NOT appear in the listing — operators get a clean directory after delete. **HOWEVER**: the `getDto` query at `ReactiveOwnerRepositoryImpl.java:65-83` does NOT apply the soft-delete filter on OWNER (`WHERE OWNER.ID.eq(id)` without `deleted_at IS NULL`). Direct `GET` of an owner-by-id via `OwnerService.getOwnerDtoById` (OwnerServiceImpl.java:102-107) RETURNS the soft-deleted row + `.switchIfEmpty(Mono.error(NotFoundException))` only fires when the ID does not exist at all. **The visibility of a soft-deleted owner is INCONSISTENT across list vs by-id queries** — list hides them; by-id surfaces them. A direct API consumer who learns an owner-id (from cached search results, from a stale lineage view, from a UI bookmark, from a stale owner_association_request linking to the soft-deleted owner) can read the soft-deleted owner's full DTO including its previously-attached roles and the (now soft-deleted) user_owner_mapping row. **If a soft-deleted owner's name is sensitive (e.g. PII the platform stored), the by-id surface leaks it.** The asymmetry is unstated.
