behaviour: |-
  **`GET /api/dataentities/{id}/runs?size=10000000` is accepted verbatim — DoS surface via single-request memory exhaustion.** The OpenAPI `SizeParam` (`components.yaml:4222-4229`) declares int32 with NO `minimum`/`maximum` constraint; the controller's `Integer size` parameter is passed through verbatim to the SQL `LIMIT` (`ReactiveDataEntityTaskRunRepositoryImpl.java:180-181`); no bounds-check at controller / service / repository / mapper layers. A request with `size=10000000` will:

  - Issue `SELECT ... FROM data_entity_task_run JOIN ... LIMIT 10000000` to PostgreSQL — the window-function-based paginate plan (count(*) over() + row_number() over(orderBy) per `JooqQueryHelper.java:73-83`) is O(N) on the materialised result set.
  - Materialise up to 10M rows in the API tier through JOOQ result mapping + MapStruct conversion + Jackson serialisation.
  - Hold one Postgres connection from the reactive pool for the duration.
  - Block the response thread for serialisation of a multi-GB JSON payload.

  Practical impact: a single curl request can wedge an API instance's reactive event loop for tens of seconds; sustained traffic from a buggy script or malicious user OOMs the API tier. The endpoint sits BEHIND `.authenticated()` only (no rate-limit, no per-user quota), making the DoS surface available to any authenticated user including under `auth.type=DISABLED` (anonymous).

  No test asserts a server-side cap. The UI's well-behaved size=100 (TestRunsHistory.tsx:27) and size=10 (TestReportDetailsHistory.tsx:31) defaults DO NOT defend against direct API consumers or a future UI refactor that increases the cap.
