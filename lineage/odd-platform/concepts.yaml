canonicalisation_candidates:

  - proposed_canonical: "Locale Bundle"
    rationale: "Two sidecars (i18n.ts, SelectLanguage) describe the multilingual UI's per-language resource bundle in consistent terms; main-concepts.md does not name 'Locale Bundle', 'Multilingual UI', or 'i18n' anywhere. The platform ships six locales (en/es/ch/fr/ua/hy) with a user-facing language switcher and yet has zero doc-side coverage (canonical F-047 finding). A canonical doc-side concept entry would close the discoverability gap."
    contributing_concepts:
      - "locale resource bundle (i18n.ts)"
      - "language code (SelectLanguage)"
      - "persisted language preference (both)"
      - "i18n singleton (i18n.ts)"
    suggested_add_to_docs: true

  - proposed_canonical: "Attachment"
    rationale: "First-class platform feature with its own live doc page (`features/data-discovery/attachments`), per-entity REST surface, RBAC permission (DATA_ENTITY_ATTACHMENT_MANAGE), config-prefix (`attachment.*`), and two retrospectives (LSN-001 LOCAL-ephemeral, LSN-002 us-east-1 pin). Three sidecars (controller + service-layer config-consumer + config-prefix) consistently use 'attachment' as the noun. main-concepts.md does not register it as either a canonical term or alias — recommend extension."
    contributing_concepts:
      - "DataEntityAttachments / DataEntityFile / DataEntityLink (controller)"
      - "DataEntityUploadOptions (service)"
      - "attachment storage backend / S3-compatible bucket / local filesystem path / attachment upload session / attachment file size cap (config-prefix)"
    suggested_add_to_docs: true

  - proposed_canonical: "Attachment Storage Backend"
    rationale: "Operationally distinct sub-concept of Attachment with its own ADR (LOCAL is matchIfMissing default), retrospectives (LSN-001, LSN-002), and operator-config surface. Currently surfaced only in the attachment config-prefix sidecar but referenceable across the catalog. Useful as a navigation anchor for storage-tier discussions."
    contributing_concepts:
      - "attachment storage backend (config-prefix)"
      - "S3-compatible bucket (config-prefix)"
      - "local filesystem path (config-prefix)"
    suggested_add_to_docs: false

  - proposed_canonical: "AlertManager Webhook Receiver"
    rationale: "Distinct concept from the platform's internal Alert lifecycle: external write-only ingress, no `*Api` interface, hand-rolled DTO, unauthenticated by design (operator-delegated). Live `configuration-and-deployment/odd-platform#prometheus-alertmanager-integration` documents the endpoint but main-concepts.md does not register the concept. Cross-references the Alert concept (every webhook payload becomes a DISTRIBUTION_ANOMALY Alert) but the receiver itself has its own auth posture, perf shape, and operator audience."
    contributing_concepts:
      - "ExternalAlert (AlertManagerController)"
      - "AlertManagerRequest (AlertManagerController)"
      - "DISTRIBUTION_ANOMALY alert (AlertManagerController)"
      - "entity_oddrn label (AlertManagerController)"
    suggested_add_to_docs: true

  - proposed_canonical: "ODD API Consumer"
    rationale: "Every controller and openapi-tag sidecar names this audience as a distinct group from UI end-users. main-concepts.md does not register 'API consumer' or 'API client' as canonical audience vocabulary. The audience has its own concerns (programmatic access, OpenAPI-generated SDKs, error contract visibility, rate-limit awareness) that the docs surface implicitly but never bundle under a named audience concept."
    contributing_concepts:
      - "API consumers building integrations (multiple controller sidecars)"
      - "platform integrations writing back metadata (openapi-tag:dataEntity)"
      - "operators inspecting alerts/runs/activity (openapi-tag:dataEntity)"
    suggested_add_to_docs: true

  - proposed_canonical: "Prometheus AlertManager"
    rationale: "Distinct external system audience for ODD's alerts subsystem (the operator's Prometheus deployment, NOT the platform's internal Alert audience). Surfaces in AlertManagerController sidecar audiences. Live docs reference Prometheus AlertManager but main-concepts.md does not register it as a named external-system audience."
    contributing_concepts:
      - "Prometheus AlertManager HTTP webhook caller (AlertManagerController)"
    suggested_add_to_docs: false

  - proposed_canonical: "LSN-002-class config default failure pattern"
    rationale: "Two sidecars (GenAIProperties + AttachmentServiceImpl@L27) embody the same architectural pattern: a typed config field with no Java initializer ships a primitive default (`int` 0, boxed `Integer` null) that is legal at boot but broken at first use. LSN-002 retrospective names the regional variant (MinIO us-east-1); the `requestTimeout=0` and `maxFileSize` unset cases are the same root cause in different domains. Useful as a pattern-recognition anchor for future enrichments."
    contributing_concepts:
      - "silent misconfiguration when genai.enabled=true is the only key set (GenAIProperties)"
      - "boot-time crash if attachment.max-file-size is unset (AttachmentServiceImpl@L27)"
      - "LSN-002-class concern flagged in input prompt (GenAIProperties.performance.known_performance_gaps[0])"
    suggested_add_to_docs: false

  - proposed_canonical: "Authorization path-string drift"
    rationale: "DataEntityController sidecar surfaces a verified production failure (the `/term` vs `/terms` mismatch silently disabling DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM gates). The ADR-level pattern (path-pattern wired authorization) is the root cause; the concrete path-mismatch instance is the canonical example. Useful for the catalog as a tracked failure-mode concept that cuts across the 'Authorization is path-pattern wired' invariant."
    contributing_concepts:
      - "term path mismatch in SECURITY_RULES (DataEntityController)"
      - "Authorization layer is path-string-coupled with no compile-time or test-time guard against drift (DataEntityController)"
    suggested_add_to_docs: false

  - proposed_merge:
      - "alert (singular variants: 'alert', 'Alert', 'alerts')"
      - "Alert (canonical, lifecycle)"
    rationale: "The catalog already merges the singular/plural/case variants under the canonical 'Alert' entry per main-concepts.md naming. Recorded for symmetry — no further merge action needed."
    canonical_choice: "Alert"

  - proposed_merge:
      - "Data Entity"
      - "DataEntity"
      - "data-entity"
    rationale: "Same conceptual entity; main-concepts.md uses 'Data Entity' (capitalised, two words) verbatim. Catalog uses that canonical form throughout."
    canonical_choice: "Data Entity"
