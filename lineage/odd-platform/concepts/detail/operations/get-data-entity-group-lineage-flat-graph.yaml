name: Get data entity group lineage (flat graph per DEG member, inner DEGs suppressed)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW OPERATION, batch 2026-05-19I (LineageServiceImpl sidecar)**
  — `LineageServiceImpl.getDataEntityGroupLineage(Long dataEntityGroupId)` at
  lines 59-85. Called from `DataEntityController.getDataEntityGroupsLineage` (`DataEntityController.java:276-281`),
  consumed by the DEG `Lineage` tab in the UI. Contract: (1) resolve DEG-member
  oddrns via `groupEntityRelationRepository.getDEGEntitiesOddrns(dataEntityGroupId)`
  (line 61) — 404 if no entities (`switchIfEmpty(Flux.error(NotFoundException(...)))`,
  line 62); (2) fetch entity metadata via `getDataEntityWithDatasourceMap` (line
  65) and lineage edges via `lineageRepository.getLineageRelations(oddrns)` (line
  66); (3) **filter out inner DEGs**: the conditional at lines 71-75 with the
  literal source-level comment `// Remove this when we will support inner DEGs
  for DEG lineage` removes edges where EITHER endpoint is itself a DEG, AND removes
  DEG-typed entries from the metadata dictionary (the explicit deferred-feature
  marker — see `inner-deg-suppression-comment-marked-deferred-feature` invariant);
  (4) build the relations map (`buildRelationsMap` lines 282-289 — each edge filed
  under BOTH endpoints), partition the DEG''s member graph into per-member connected
  components via `establishDEGRelations` (lines 200-216) using BFS-shaped recursion
  via `getRelationsForEntities` (lines 218-233); (5) produce ONE `DataEntityLineageStreamDto`
  per DEG-member oddrn via the 3-arg `getLineageStream` private overload (lines
  181-198) which always passes `List.of()` as groups and `Map.of()` as groupsRelations
  (line 197) — DEG-lineage results NEVER surface group memberships in the response.
  Read-only, NOT transactional. **Three concrete gaps**: (a) **anchor-set defence-in-depth
  NOT applied** — same as `getLineage`; DEG ID is the anchor; any DEG visible
  to the caller exposes its full member-graph + reachable edges (HIGH severity);
  (b) **JVM-stack recursion in getRelationsForEntities** — tail-recursive in structure
  but Java has no TCO; each call adds a stack frame; for a wide-component DEG
  (e.g. 10K+ entities in a single component) this can blow the stack (LOW severity);
  (c) **NO unit test on this method exists** — `LineageServiceTest.java` has zero
  matches for `getDataEntityGroupLineage`; the DEG-lineage path is entirely untested
  at the service layer. The `// Remove this when we will support inner DEGs for
  DEG lineage` comment at line 71 acknowledges a known-deferred-feature without
  a corresponding `@Disabled` test or backlog citation.'
