proposed_action: |-
  Add `ReferenceDataBuildTableNameCollisionTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `createLookupTable_lowercaseVsTitleCaseInSameNamespace_collides_returns500WithUnfriendlyMessage` — seed `Customer Lookups` (succeeds); attempt to create `customer_lookups` in the same namespace; assert HTTP 500 (or 5xx with `relation already exists` upstream); PIN the current unfriendly error path.
  2. `createLookupTable_whitespaceAndUnderscoreVariantsInSameNamespace_collides` — sister test for `Customer Lookups` vs `Customer_Lookups`.
  3. `createLookupTable_sameNameInDifferentNamespaces_doesNotCollide_currentContractWorks` — pin the POSITIVE contract: `Customer Lookups` in namespace A + `Customer Lookups` in namespace B are independent. The physical table names differ by namespaceId prefix.
  4. `createLookupTable_scriptTagInName_lossy_normalisationOrPostgresIdentifierError` — pin the compound with TEST-GAP-733: a `<script>` payload in the table name produces either a Postgres identifier error OR a lossy version (depending on identifier rules). Pin the current behaviour; the test will need re-authoring if the fix at the service tier rejects unsafe identifier characters.

  Add a `// REGRESSION-PIN — Lossy buildTableName normalisation is the current contract. A REFACTOR adding a pre-check or surfacing a friendly 409 will break tests #1 and #2; the maintainer must re-author them to assert the 409 message and the absence of physical-table creation.` comment block.

  Pair with: (a) REFACTOR adding the pre-check at ReferenceDataServiceImpl.createLookupTable; (b) DOC-NNN surfacing the lowercased + underscore naming convention on the doc page.
