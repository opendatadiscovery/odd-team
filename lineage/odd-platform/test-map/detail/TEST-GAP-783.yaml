proposed_action: |-
  Add `LoginFormRedirectOpenRedirectRegressionPinTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods asserting the current open-redirect surface:

  1. `loginFormSuccess_withAttackerControlledRedirect_returns302WithLocationHeaderVerbatim_pinsOpenRedirect` — `@SpringBootTest(properties = { "auth.type=LOGIN_FORM", "auth.login-form-redirect=https://attacker.com" })`; submit form-login as `admin:admin`; assert response status 302 AND `Location: https://attacker.com`. PINS the current open-redirect.

  2. `loginFormSuccess_withJavascriptUri_eitherCrashesBootOrIssuesRedirect_documentsBrowserDependentXSSVector` — same fixture with `auth.login-form-redirect=javascript:alert(1)`; behaviour TBD by browser; documents the XSS-via-redirect surface.

  3. `loginFormSuccess_withEmptyRedirect_returns302ToSlash` — same fixture with `auth.login-form-redirect=` (empty); assert `Location: /`. CONFIRMS the existing fallback (the only documented behaviour).

  Add a `// OPEN-REDIRECT-PIN — auth.login-form-redirect accepts attacker-controlled URIs with no validation. Live docs do not mention the key (verified WebFetch 2026-05-20). This test pins the current behaviour until REFACTOR-NNN adds allowlist validation + the live doc is updated to warn operators about templated-config attack vectors.` comment block.

  Pair with: (a) REFACTOR-NNN — add `auth.login-form-redirect.allowed-origins` config key + boot-time validation in LoginFormSecurityConfiguration.java:88-90; reject non-allowlisted URIs with `IllegalArgumentException` at boot; (b) DOC-GAP-NNN — live `/configuration-and-deployment/enable-security/authentication/login-form` MUST document the key AND warn about the templated-config attack class.
