behaviour: |-
  **MEDIUM — The Tag service+repository chain has FIVE empty-input entry points that all short-circuit DIFFERENTLY: (1) `listByNames(empty)` has NO guard and emits `TAG.NAME IN ()` SQL (PG evaluates as FALSE; zero matches); (2) `ingestData(empty)` has explicit empty-collection short-circuit (`Flux.just()`) at `ReactiveTagRepositoryImpl.java:181-183`; (3) inherited `bulkCreate(empty)` ALSO short-circuits at `ReactiveAbstractCRUDRepository.java:115-117`; (4) `getOrCreateTagsByName(empty Set)` / `getOrInjectTagByName(empty Set)` propagate through `divideTagsByExistence(empty)` → `Tuples.of([], [])` → no-op. (5) `updateRelationsWithDataEntity(entity.id, empty Set)` is DESTRUCTIVE per TEST-GAP-858. The shapes are NOT consistent: jOOQ does NOT accept zero-record INSERT statements, so the empty-batch guard on `ingestData` and `bulkCreate` is LOAD-BEARING. A future change removing the guard would produce a runtime SQL error on every empty bulk call.** No test asserts the empty-input contract on any of the five entry points.

  **Primary-source map**:
  - **`listByNames(empty)`** — `ReactiveTagRepositoryImpl.java:120-125`, no guard. `TAG.NAME.in([])` → SQL `IN ()` (jOOQ emits an equivalent that PG evaluates as FALSE).
  - **`ingestData(empty)`** — `ReactiveTagRepositoryImpl.java:181-183`, EXPLICIT empty short-circuit: `if (CollectionUtils.isEmpty(tags)) return Flux.just();`.
  - **`bulkCreate(empty)`** — `ReactiveAbstractCRUDRepository.java:115-117` (inherited), EXPLICIT short-circuit.
  - **`getOrCreateTagsByName(empty Set)`** — `TagServiceImpl.java:79-86` — propagates through divideTagsByExistence → returns empty Flux.
  - **`getOrInjectTagByName(empty Set)`** — `TagServiceImpl.java:88-94` — same shape.

  **Why MEDIUM**:
  - The empty-batch guard on `ingestData` and `bulkCreate` is LOAD-BEARING: removing it produces a runtime SQL error (jOOQ rejects empty-record INSERTs) on every empty bulk call. A bug here would be discovered in production on first empty-array submission.
  - The asymmetry between methods (some have explicit guards, some have NO guard but rely on SQL semantics) is invisible to reviewers; a maintainer reading `listByNames` and seeing no guard might "add one" for consistency — but it would change behavior under the SQL semantic of `IN ()` (PG-specific FALSE evaluation that the guard would shadow).
  - The empty input contracts ARE NOT documented in the service interface (`TagService.java:14-36`); they're implementation-defined.

  **What the test pins**:
  - Each entry point's empty-input behavior (empty output, no exception, no DB roundtrip beyond `listByNames`).
  - The asymmetric guard placement (some have explicit guards, some don't).
  - The contract that a future refactor must NOT regress: `ingestData(empty)` does not issue an empty INSERT SQL.
