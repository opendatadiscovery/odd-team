mitigations_unimplemented:
  - |-
    Render a PERSISTENT banner on every authenticated route when
    `appInfo.authType === 'DISABLED'`. Banner text: "Authentication
    is DISABLED. The platform's API endpoints are anonymously
    reachable. Do not run this configuration in production." Banner
    is dismissible per session but reappears on next mount. The
    banner is a 10-line React component + a redux selector + a
    persistent-storage flag.
  - |-
    Under DISABLED, render the mutation affordances as DISABLED
    (greyed out) rather than HIDDEN (null) — combined with the
    persistent banner, this surfaces the asymmetry to operators
    instead of papering over it. Caveat: this contradicts the
    `WithPermissions` HIDE-not-DISABLE convention (per the existing
    invariant `partial-permission-gating-edit-button-gated-content-unconditional`),
    so the alternative is to add a DISABLED-mode-specific render
    path. Trade-off worth surfacing to maintainer.
  - |-
    Doc-side: extend `/configuration-and-deployment/enable-security/authentication`
    with explicit UI-vs-API caveat — "Under auth.type=DISABLED, the
    UI hides mutation affordances (UI behaves as if locked down) but
    the API endpoints are anonymously reachable. The UI's appearance
    is NOT a security boundary."
  - |-
    Refactor: introduce a `disabled_mode_alert` flag on AppInfo that
    the SPA reads to render the persistent banner. Wire from
    application.yml via existing AppInfoController.
notes: |-
  The 19th-facet contribution is significant: REFACTOR-185 was
  catalogued as a backend-mutation issue for 18 sidecars. The UI-
  layer evidence pattern adds a DISTINCT shape of risk — operators
  who interact with the UI as their primary mental model are
  systematically misled about the platform's actual security state
  under DISABLED.

  Cross-references:
    - REFACTOR-185 (the parent surface enumeration)
    - `login-form-without-authorizationcustomizer-refactor-073-validated`
      (REFACTOR-073)
    - `auth-mode` (the `auth.type` knob entity)
    - `partial-permission-gating-edit-button-gated-content-unconditional`
      (the HIDE-not-DISABLE convention)
    - `read-collaborative-cross-owner-enumeration` (the read posture
      that allows the catalogue rendering even under DISABLED)
