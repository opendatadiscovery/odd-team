discovered_from_entry_point: |-
  ui_shell_bootstrap:i18n.ts (the singleton i18next instance configured at
  odd-platform-ui/src/locales/i18n.ts:27-31 with 6 locale resources +
  6-element fallbackLng chain + localStorage-persisted language preference).
  Consumed via `useTranslation().t('<key>')` at 241 call sites across the
  SPA. Switched via `SelectLanguage.tsx:28-33` (await i18n.changeLanguage(lang)
  + localStorage.setItem('i18nextLng', lang)).
description: |-
  Multilingual UI is the SPA's localisation feature surface — six locales
  (English, Spanish, Chinese, French, Ukrainian, Armenian) configured at
  i18n.ts:27-31 with English-first fallback chain. The contract between
  code and resource is the **natural-keys** pattern: keys ARE the English
  source phrases (417/418 entries in en.json have `key === value`); the
  five non-English locale files mirror the key set (with three-to-four-key
  divergence — en=418, ch=415, fr=415, es=414, hy=414, ua=414). The single
  deviation from natural-keys is `main search placeholder` (en.json:381) —
  a slug key with a descriptive value enumerating four entity types.

  The user-observable promise is "the UI is available in 6 languages, and
  my preference persists across reloads". The reality:

  (a) **Missing-key drift** — 12+ keys are referenced in code via t() that
  do NOT exist in en.json or any locale. Notable: `t('Data Quality')`,
  `t('Data Modelling')`, `t('Master Data')` (all three top-level navigation
  tabs in ToolbarTabs.tsx:46,51,56), plus `t('Query Examples')`,
  `t('Save lookup table')`, `t('Table name')`, `t('Enter business name')`,
  ... The natural-keys + fallbackLng chain makes the English UI
  accidentally work (i18next returns the KEY ITSELF after exhausting the
  chain), but every non-English locale ALSO renders the English key string
  — a French user sees three untranslated English labels in the toolbar.
  The drift is uniform across locales because the missing-key set is
  identical.

  (b) **Locale-set drift** — `wc -l` per locale: en=418, ch=415, fr=415,
  es=414, hy=414, ua=414. Three to four keys exist in en.json but NOT in
  the non-English locales. The natural-keys pattern hides this — missing
  entries fall through to English via fallbackLng. A contributor adding a
  new key to en.json receives NO signal that other locales need updating.

  (c) **No missing-key event handler** — `i18n.ts:27-31` has only
  `resources`, `lng`, `fallbackLng`. No `missingKeyHandler`,
  `parseMissingKeyHandler`, or `saveMissing`. The contract "every t() call
  site has a matching en.json key" is enforced by NOTHING.

  (d) **Browser-language never consulted** — `i18n.ts:22` reads
  `localStorage('i18nextLng')` with hardcoded fallback to 'en'.
  `navigator.language` is never consulted. A user with a Spanish-language
  browser sees English on first visit; they must manually switch via the
  gear menu (which is itself in English).

  (e) **Activity Feed `User` label channel** — the LSN-020 drift surface
  channels through en.json:347 → Filters.tsx:58 → SQL at
  ReactiveActivityRepositoryImpl.java:272-273 (binds userIds to
  USER_OWNER_MAPPING.OWNER_ID.in(userIds), not activity.created_by). The
  label promises "filter by user who performed the action"; the SQL
  filters by owner-of-affected-entity-via-mapping. No locale corrects the
  drift — natural-keys defaults make every language uniformly misleading.

  (f) **Dictionary label vs URL drift** — `"Dictionary"` (en.json:115)
  labels the top-level Dictionary tab → /termsearch (termsRoutes.ts:5).
  Vocabulary disagreement uniformly across all 6 locales.

  (g) **`Statuses` Spanish locale divergence** — en.json:418 = "Statuses"
  (plural); es.json:410 = "Estado" (singular). The other four locales
  carry the English string. A Spanish-locale user sees a multi-select
  facet labelled "Estado" (singular) when the widget IS multi-select.

  (h) **`main search placeholder` content drift** — en.json:381 enumerates
  four entity types ("Search data tables, feature group, jobs and ML
  models via keywords"); fr/es/ch/ua/hy carry shorter generic strings.
  Localisation-quality drift, not correctness.

  (i) **Feature undocumented** — `https://docs.opendatadiscovery.org/`
  (WebFetched 2026-05-26 status 200) makes no mention of multilingual UI,
  no list of supported locales, no explanation of persistence (browser
  localStorage only — no server-side binding). Operators discovering the
  feature must find the gear-menu in the user dropdown.
