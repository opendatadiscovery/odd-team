behaviour: |-
  DEG-internal-only edge filter regression-pin (MEDIUM — P-05). `getLineageRelations(List<String>)` at `ReactiveLineageRepositoryImpl.java:112-119` requires BOTH `PARENT_ODDRN.in(oddrns)` AND `CHILD_ODDRN.in(oddrns)`. Edges crossing the DEG boundary are dropped — both edges EXITING the DEG (from a member to a non-member) AND edges ENTERING the DEG (from a non-member to a member). This is a deliberate architectural stance (implicit_adrs.[4]): the DEG-lineage view is INTERNAL to the DEG; external context (upstream sources outside the DEG; downstream consumers outside the DEG) is NOT shown. The operator who wants 'show me everything connected to this DEG' must use the per-entity lineage endpoints on individual members. An operator viewing a DEG's lineage cannot tell that 'this DEG's data flow has upstream sources outside the DEG' or 'this DEG feeds into consumers outside the DEG' — the live docs do not warn about this. A regression that loosened the filter (e.g. using `.or(...)` instead of `.and(...)`) would silently leak external-edge metadata into the DEG-lineage response, exposing entities owned by OTHER teams not represented in the DEG, materially widening the cross-owner enumeration surface (TEST-GAP-504). The bidirectional filter is therefore load-bearing for BOTH the architectural contract (DEG-internal scope) AND the security envelope (limits cross-owner enumeration to DEG members + their cross-edges).
