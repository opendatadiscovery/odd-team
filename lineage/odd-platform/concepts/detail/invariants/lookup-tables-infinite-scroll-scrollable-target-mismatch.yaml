notes: |-
  NEW invariant captured in batch ZL (2026-05-26) FINAL refresh.
  This is the LookupTables.tsx primary-source bug. The bug
  class is 'copy-paste with one rename missed' — a recurring
  pattern that lint rules + shared components can prevent. The
  immediate fix is trivial (one string change); the deeper fix
  is the shared component pattern.

  Cross-batch follow-up: the Directory + LookupTables + Alerts +
  Activity InfiniteScroll wrappers should each be audited for
  the same shape. Probe P-192 captures the LookupTables
  instance; other instances may have similar bugs (or may be
  correct).
