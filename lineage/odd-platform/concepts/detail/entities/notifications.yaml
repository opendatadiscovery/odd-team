security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - INTERNAL_ONLY
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: BYPASSES
    detail: |-
      NotificationsProperties is a config-binding POJO, not an HTTP surface
      — no `@PreAuthorize` applicable. Downstream effect: the WAL subscriber
      reads `ALERT` table rows directly via Postgres logical replication,
      bypassing any application-layer authorization. Fan-out is unconditional:
      every configured channel receives every alert event regardless of
      which data-entity owners would have been entitled to see it. The
      `AlertNotificationMessage` payload includes `owners[]` (owner name +
      title) for the alerted entity, but does NOT route based on them.
      Cross-tenant / multi-team deployments cannot scope notifications to
      the owning team. **STRENGTHENED batch K** — the dispatcher's
      authorization_assertions[] is verified empty via primary-source
      examination at AlertNotificationMessageProcessor.java:1-37 (no
      @PreAuthorize, no programmatic permission check). The dispatcher
      operates with full platform privileges via DSLContext.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Fan-out unconditional — every Slack channel / webhook URL / email
      recipient gets every alert. `AlertNotificationMessageProcessor.java:25-36`
      loop iterates `List<NotificationSender>` unconditionally on every
      `AlertNotificationMessage`; no per-recipient owner filter; no
      per-channel routing predicate. **STRENGTHENED batch K** — the
      AlertNotificationMessage payload INCLUDES dataEntity.owners[]
      populated by AlertNotificationMessageTranslator#fetchAlertedDataEntity
      but the dispatcher does NOT consult them for routing.
  strengths:
  - Disabled-by-default — `notifications.enabled=false` is the default read by `NotificationsFeatureCondition.java:8-13`
    from the Spring `Environment` (single source of truth, enforced uniformly across
    `NotificationConfiguration`, `NotificationSubscriberStarter`, and `AlertNotificationMessageProcessor`
    via `@ConditionalOnNotifications`)
  - Per-channel URL-presence activation — `@ConditionalOnProperty(name = "notifications.receivers.slack.url"
    | "notifications.receivers.webhook.url" | "notifications.receivers.email.sender")`
    on each sender bean method. Absence of a key = no bean = silently no-op for that
    channel. Operators configure only the channels they want.
  - Email password masked by Spring's default `/actuator/env` sanitisation (`password`-suffixed
    keys in Spring's default mask list) — partial mitigation
  - Single `HttpClient` bean shared across Slack + Webhook senders — bounded resource
    footprint
  weaknesses:
  - |-
    **Exception-type asymmetry between sender impls (NEW HIGH severity,
    batch K)** — the dispatcher's per-sender try/catch catches
    `NotificationSenderException` (checked) only. `EmailNotificationSender`
    wraps `MessagingException | TemplateException | IOException` as
    `new RuntimeException(...)` at EmailNotificationSender.java:59,
    NOT as `NotificationSenderException`. Email failure therefore BYPASSES
    the dispatcher's catch and aborts fan-out for that message — subsequent
    senders (if email is not last in the list) do NOT receive the alert.
    (NotificationsDispatcher.md:bugs_limitations_corner_cases.[0])
  - |-
    **Poison-message WAL replay loop (NEW HIGH severity, batch K)** — a
    persistently-bad ALERT row (unknown alert-type code, missing FK,
    null type_id) causes translate() to throw IllegalArgumentException
    or IllegalStateException. The exception propagates OUT of process()
    to NotificationSubscriber.java:90's outer catch which logs, waits
    10s, re-acquires the lock. The SAME WAL LSN is re-delivered
    indefinitely, blocking ALL subsequent WAL messages. No DLQ, no
    skip-poison, no manual LSN advance API.
    (NotificationsDispatcher.md:bugs_limitations_corner_cases.[6])
  - '**No retry / dead-letter queue / audit trail on failed notification delivery
    (HIGH severity)** — `AlertNotificationMessageProcessor.java:30-35` catches `NotificationSenderException`,
    logs at ERROR, and moves on. The alert is lost from that channel''s perspective
    with no record in the `ALERT` table that delivery failed. No `notification_delivery`
    table, no metric counter, no Prometheus gauge. Operators have no DB-visible signal
    that notifications stopped working. (NotificationsProperties.md:bugs_limitations_corner_cases.[3]
    + known_security_gaps.[3])'
  - '**Email per-recipient silent partial delivery (HIGH severity)** — `EmailNotificationSender.java:53-61`
    iterates `notificationsEmails` in order, reusing the same `MimeMessage` and calling
    `helper.setTo(email); emailSender.send(mimeMessage);` per iteration. Any thrown
    `MessagingException` aborts the loop via the surrounding try/catch — recipients
    after the failing one never receive the alert. Documented as a known limitation
    on the live doc, but the code has no fault-tolerance (no continue-on-error, no
    per-recipient try/catch). (NotificationsProperties.md:bugs_limitations_corner_cases.[4])'
  - '**No rate-limiting / throttling at any layer (HIGH severity)** — WAL streams
    as fast as Postgres can decode, the loop in `AlertNotificationMessageProcessor`
    is synchronous, and senders block on HTTP. A burst of 10k alerts (misconfigured
    data-quality run) will fire 10k Slack messages + 10k webhook POSTs + 10k emails
    with no rate cap. Slack will rate-limit the webhook (429); platform has no retry-with-backoff
    on 429 — logs the failure, drops the alert. (NotificationsProperties.md:bugs_limitations_corner_cases.[10]
    + known_performance_gaps.[0])'
  - '**Webhook delivery unsigned / no shared secret / no HMAC (MEDIUM)** — `WebhookNotificationSender.java:18-23`
    is `HttpRequest.newBuilder().uri(webhookUrl).POST(...)` with no auth header, no
    signature. The receiving endpoint cannot verify the webhook actually originated
    from ODD Platform vs an attacker who scraped the webhook URL. (NotificationsProperties.md:known_security_gaps.[0])'
  - '**Alert payload routes to ALL configured channels regardless of owner (MEDIUM)**
    — cross-tenant / multi-team deployments cannot scope notifications to the owning
    team. `AlertNotificationMessage` carries `owners[]` but the processor does not
    consult them for routing. (NotificationsProperties.md:known_security_gaps.[2])'
  - '**PII surface in notification payloads (MEDIUM)** — `AlertNotificationMessage`
    carries `dataEntity.{name, dataSourceName, namespaceName}`, `owners[].ownerName`,
    `eventAt`, and `downstream` lineage entities up to `notifications.message.downstream-entities-depth`.
    Any operator-supplied free-text (descriptions, table names) is rendered verbatim
    into Slack/webhook/email — no redaction, no allowlist. (NotificationsProperties.md:bugs_limitations_corner_cases.[11]
    + NotificationsDispatcher.md:bugs_limitations_corner_cases.[8])'
  - '**Dead config field: `NotificationsProperties.webhookUrl` (MEDIUM)** — top-level
    field declared on the POJO but NO consumer reads it; the active webhook URL is
    `notifications.receivers.webhook.url` read via `@Value` in `NotificationConfiguration`.
    An operator setting `notifications.webhookUrl=...` gets silent acceptance and
    zero effect. (NotificationsProperties.md:bugs_limitations_corner_cases.[0])'
  - '**No structured audit log of notifications sent (MEDIUM)** — only `log.debug("Sending
    notification message via {}: {}", ...)`. Operators have no way to answer ''when
    did notifications last work?'' or ''which alert IDs were delivered to which channels?''.
    (NotificationsProperties.md:bugs_limitations_corner_cases.[11] +
    NotificationsDispatcher.md:bugs_limitations_corner_cases.[1])'
  - '**Replication-slot orphan risk (MEDIUM)** — if operator renames `notifications.wal.replication-slot-name`
    between deployments and forgets to drop the old slot, Postgres retains WAL for
    the orphaned slot indefinitely — risking primary disk exhaustion. Live doc warns
    about manual cleanup but does not warn about rename-orphan specifically. (NotificationsProperties.md:bugs_limitations_corner_cases.[12])'
  - '**Advisory-lock-id collision risk (MEDIUM)** — `notifications.wal.advisory-lock-id`
    defaults to 100. Cross-subsystem collision targets: `partition.advisory-lock-id=90`,
    `datacollaboration.receive-event-advisory-lock-id=110`, `datacollaboration.sender-message-advisory-lock-id=120`.
    Distinct in shipped defaults, but operator customisation could collide silently.
    (NotificationsProperties.md:bugs_limitations_corner_cases.[2])'
  - |-
    **Sender iteration order undefined / Spring-bean-order-dependent (LOW
    — batch K PRIMARY SOURCE)** — `List<NotificationSender>` is injected
    as a bean collection; the order depends on Spring's bean-registration
    order, which is class-scan-order-dependent. Operators cannot predict
    which channel runs first.
    (NotificationsDispatcher.md:bugs_limitations_corner_cases.[5])
  - '**Email + Slack URL accept any scheme/host (LOW)** — `notifications.receivers.slack.url=file:///etc/passwd`
    boots OK and fails at HTTP-send time; no `@URL` constraint, no allowlist, no SSRF
    guard. (NotificationsProperties.md:bugs_limitations_corner_cases.[6] + known_security_gaps.[1])'
  - '**PG replication role is broad (LOW)** — `ALTER ROLE ... WITH REPLICATION` is
    required cluster-wide; ODD does not document scoping to a per-publication role.
    (NotificationsProperties.md:known_security_gaps.[4])'
  - '**Email password leak via Lombok @Data toString() (MEDIUM — batch D primary-source)**
    — `EmailSenderProperties.java:6-10` declares `@Data` + `private String password`
    with no `@ToString.Exclude`. Any code path that logs the bean (or any future `log.info("props
    = {}", emailProperties)` addition) emits the SMTP password verbatim. Spring Boot
    3.4.10''s `/actuator/env` masks `password`-suffixed keys by default — the actuator
    path is partially protected — but the in-process toString path is not. Same pattern
    as ODDLDAPProperties + ODDOAuth2Properties; 4-sidecar triangulated (EmailSenderProperties.md:bugs_limitations_corner_cases.[3]
    + security.known_security_gaps.[0])'
  - '**STARTTLS-only TLS — implicit-TLS-required relays cannot be used (MEDIUM — batch
    D primary-source)** — `EmailSenderProperties.SmtpProperties` exposes only `auth`
    and `starttls` Boolean fields. `NotificationConfiguration.java:63-69` only sets
    `mail.smtp.starttls.enable` from these. The implicit-TLS keys (`mail.smtp.ssl.enable`,
    `mail.smtps.*` namespace) are never set. Gmail port 465 and many corporate SMTP
    relays REQUIRE implicit TLS — those will not work. Live doc confirms this is a
    known limitation. (EmailSenderProperties.md:bugs_limitations_corner_cases.[1]
    + security.known_security_gaps.[4])'
  - '**No `mail.smtp.ssl.trust` override exposed (MEDIUM)** — Operators using self-signed
    or internal-CA SMTP certificates cannot configure trust from ODD''s YAML — must
    add cert to JVM truststore or pass `-Djavax.net.ssl.trustStore=...` at boot. Live
    doc surfaces the limitation but the config surface offers no remediation. (EmailSenderProperties.md:bugs_limitations_corner_cases.[2]
    + security.known_security_gaps.[3])'
  - '**No XOAUTH2 / modern SMTP-AUTH support (MEDIUM)** — `EmailSenderProperties.SmtpProperties.auth`
    is binary Boolean only; ODD does NOT expose `mail.smtp.auth.mechanisms`, `mail.smtp.auth.login.disable`,
    or any modern-auth knob. SMTP-AUTH OAUTH2 (XOAUTH2) is not configurable — operators
    on Microsoft 365 / Gmail with OAUTH2-only SMTP cannot use this channel. Live doc
    does not call this out. (EmailSenderProperties.md:bugs_limitations_corner_cases.[12]
    + security.known_security_gaps.[5])'
  - '**Sender address has no @Email validation (LOW)** — `EmailSenderProperties.sender`
    is a free-form `String` with only `StringUtils.isBlank` check. Spoofed/malformed
    sender addresses accepted silently; SMTP-AUTH username = sender address (relays
    where service-account username differs from From address cannot be expressed).
    (EmailSenderProperties.md:bugs_limitations_corner_cases.[4] + security.known_security_gaps.[2])'
  - '**Recipient list comma-split with no per-address trim (LOW)** — `NotificationConfiguration.java:118`
    does `notificationEmails.trim().split(",")` — a single outer trim, no per-address
    trim. List with whitespace (`''a@x.com, b@x.com''`) yields ` b@x.com` (leading
    space) → JavaMail `InternetAddress` rejection → recipient loop aborts before subsequent
    emails are sent. Compounds the silent-partial-delivery defect in NotificationsProperties
    weaknesses. (EmailSenderProperties.md:bugs_limitations_corner_cases.[9] + security.known_security_gaps.[6])'
  - '**Recipient list lives OUTSIDE the typed POJO (partial-home pattern — LOW)**
    — `notifications.receivers.email.notification.emails` is NOT a field on `EmailSenderProperties`;
    it is consumed via raw `@Value` in `NotificationConfiguration.java:104`. A maintainer
    reading the POJO source to understand the email channel sees a partial picture.
    Surfaced separately as a cross-cutting invariant. (EmailSenderProperties.md:bugs_limitations_corner_cases.[8])'
  cross_file_inconsistencies:
  - 'GitBook IA drift: `active-platform-features/notifications` returns 404; canonical
    is `features/active-platform-features/notifications` (200). Same drift class as
    DataCollaboration''s 404 — surface in cross-cutting invariants.'
  - '`notifications.message.downstream-entities-depth` is consumed via raw `@Value`
    in `NotificationConfiguration#alertNotificationMessageTranslator`, NOT through
    this `@ConfigurationProperties` POJO — the POJO model is incomplete vs the actual
    config surface. Cosmetic inconsistency vs ODD''s `@ConfigurationProperties` pattern
    elsewhere. (NotificationsProperties.md:bugs_limitations_corner_cases.[1])'
  - '`NotificationsProperties.enabled` field exists but is NOT the gate — `NotificationsFeatureCondition`
    reads `notifications.enabled` directly from the Spring `Environment`, bypassing
    this POJO. Two parallel paths for reading the same key — a future maintainer wiring
    `@ConditionalOnProperty(matchIfMissing=false)` on the bean methods would conflict
    with the existing Condition class.'
  - |-
    **NEW batch K**: Live `/features/active-platform-features/notifications`
    says "every channel that is enabled" receives every alert (TRUE per
    code) but does NOT mention the exception-type asymmetry: email failures
    abort fan-out (RuntimeException not caught), Slack/webhook failures
    do not (NotificationSenderException caught). Operator-facing framing
    is incomplete.
