behaviour: |-
  **MEDIUM — `postDataSetStatsList` replay with FEWER tags silently REMOVES the absent EXTERNAL_STATISTICS-origin tag relations.**

  The tag reconciliation at `DatasetFieldServiceImpl.java:221-223` computes `relationsToDelete = existingRelations.filter(r -> !relationsToCreate.contains(r))` — the diff is delete-on-absence. A re-POST with a smaller tag set DELETES the absent EXTERNAL_STATISTICS-origin tag relations from the affected fields.

  **Concrete operator-pain chain**:
  1. Collector A posts stats with `tags: ["PRODUCTION", "PII", "CRITICAL"]`. ODD creates the three EXTERNAL_STATISTICS-origin relations.
  2. Operator-in-UI views the field; sees the three tags.
  3. Next day, Collector A's profiler has a sampling bug — it only detects `PRODUCTION` for the field.
  4. Collector A re-POSTs with `tags: ["PRODUCTION"]`.
  5. ODD computes `relationsToDelete = {PII-relation, CRITICAL-relation}` — DELETES both.
  6. Operator-in-UI views the field next day; sees only `PRODUCTION`. The `PII` + `CRITICAL` classification — possibly load-bearing for compliance — is gone, **with no warning, no audit log, no user notification**.

  **Reconciliation is asymmetric**:
  - `INTERNAL`-origin tags (UI-curated) are UNTOUCHED — the `listTagsRelations(datasetFieldIds, TagOrigin.EXTERNAL_STATISTICS)` filter (line 218) operates ONLY on EXTERNAL_STATISTICS-origin relations. This is intentional (see implicit_adrs.[2] in the sidecar) — UI users' manual tags survive collector re-ingestions.
  - But the asymmetry MEANS the UI/Collector mental model differs: a Collector author may not realise that emitting a tag once and dropping it later REMOVES the tag.

  **Same shape as F-008's `silent_destruction_replace_not_merge` drift facet** — applied to the stats path. F-008 documents the class on the entity-list path; this entry surfaces the stats-path variant.

  **No live doc describes this contract**: the WebFetch (postDataSetStatsList.md docs_link_semantic.doc_drift_findings.[3]) of `/features/data-quality` and `/configuration-and-deployment/enable-security` returned 200 but neither page mentions the replace-on-replay contract.

  **Why MEDIUM**: classification data is load-bearing for downstream compliance + DQ workflows; silent removal is operationally dangerous; but the data loss is REVERSIBLE if the collector re-emits the tag in a subsequent run. Compare LSN-001's IRREVERSIBLE attachment-storage data loss — this is a soft-loss class.

  **Test gap shape**: regression-pin asserting:
  1. POST tag-set A → tag relations exist.
  2. POST tag-set B (subset of A) → tag relations now match B only; A-only tags are gone.
  3. No `activity_event` row emitted; no log line.
  4. UI-curated INTERNAL tags persist across (1) and (2).
