proposed_action: |-
  Add `AlertManagerTimezoneStripTest.handleExternalAlerts_rfc3339WithOffset_silentlyStripsTimezone_embeddedUrlPointsToWrongWindow`. (a) POST `/ingestion/alert/alertmanager` with `startsAt: "2026-01-01T12:00:00+09:00"` (Tokyo time). (b) Query `SELECT description FROM alert_chunk WHERE alert_id = (SELECT MAX(id) FROM alert)`. (c) Extract the `g0.moment_input=` parameter from the URL. (d) Assert it equals `"2026-01-01 12:00:00"` (the LOCAL time stripped of offset). (e) DOCUMENT the deviation from the true UTC equivalent `"2026-01-01 03:00:00"`. (f) Add a `// REGRESSION-PIN — ExternalAlert.startsAt is LocalDateTime; Jackson silently strips the offset on deserialisation; the generator URL points to a Prometheus query window keyed by the server's local time. A REFACTOR switching to OffsetDateTime/ZonedDateTime + updating the formatter pattern will flip this test, making the fix deliberate.` comment block.
