behaviour: |-
  **Activity-feed coverage asymmetry on dataset_field edits.** `DatasetFieldServiceImpl.updateInternalName` (line 99) carries `@ActivityLog(event = ActivityEventTypeDto.DATASET_FIELD_INTERNAL_NAME_UPDATED)`. `DatasetFieldServiceImpl.updateDatasetFieldTags` (line 119) carries `@ActivityLog(event = ActivityEventTypeDto.DATASET_FIELD_TAGS_UPDATED)`. But `DatasetFieldServiceImpl.updateDescription` (line 87-95) has NO `@ActivityLog` annotation — description edits on a dataset_field are NOT recorded in the activity feed. The asymmetry is intentional in the surface code (a maintainer authored it that way) but operationally indefensible: an operator auditing "who changed the description on this critical column over time?" will find no activity-feed evidence. The activity-feed live doc (WebFetched 2026-05-20) enumerates `DATASET_FIELD_DESCRIPTION_UPDATED` as an event type for dataset_field (one of the 20 enumerated event types on the page), but the corresponding `@ActivityLog` annotation does not exist in the service layer. The doc surface promises an event type that the code never emits — a doc-vs-code-drift class finding. Compare with `DATA_ENTITY` whose `DESCRIPTION_UPDATED` (the entity-level description edit) DOES carry `@ActivityLog` via DataEntityServiceImpl. The dataset_field surface is the asymmetric outlier.
