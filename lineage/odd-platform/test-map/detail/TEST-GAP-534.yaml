proposed_action: |-
  Testcontainers test that constructs the FULL 3-EXISTS topology fixture. (a) Term T1 in namespace N1. (b) DataEntity DE1 mentions T1 via description (is_description_link=true). (c) DatasetField DF1 of DE2 mentions T1. (d) Term T2 has term-to-term link to T1 (T1 as target). (e) Assert hasDescriptionRelations(T1.id) = TRUE. (f) Soft-delete DE1. Assert hasDescriptionRelations(T1.id) = TRUE (DF1 + T2 still match). (g) Hard-delete DF1's row. Soft-delete DE2 (the parent of DF1). Assert FALSE for the dataset-field branch alone. (h) Soft-delete T2 (the source term). Assert the term-to-term branch returns FALSE. (i) Pin: this guard MUST scan all 3 link tables; failing any branch leaves the rename-protection contract broken.
