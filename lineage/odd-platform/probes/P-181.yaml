realism_caveats: |
  The probe targets `AlertHousekeepingJob` because it has the simplest test
  setup (single table + cascade to ALERT_CHUNK). Equivalent boundary behaviour
  on `SearchFacetsHousekeepingJob` (negative → all facets deleted) and
  `DataEntityHousekeepingJob` (negative → all soft-deleted entities cascade-
  purged) are STRONGLY EXPECTED but not asserted by this specific probe;
  they would be covered by separate probes if the maintainer wants to
  mechanise the full TTL surface.

  Negative-value bind: Spring Boot @ConfigurationProperties binds negative
  integers without complaint (no `@Min(0)` validation on this POJO — that
  itself is a finding worth recording in REFACTOR-NNN). The probe does NOT
  need to bypass any validation layer to inject N = -1.
