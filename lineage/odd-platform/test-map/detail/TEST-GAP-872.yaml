  - "ActivityHandler.md says (bugs_limitations_corner_cases.[System-event username silently null]): 'ActivityServiceImpl.createActivityEvent (:46-49) uses authIdentityProvider.getCurrentUser().map(UserDto::username).switchIfEmpty(Mono.defer(() -> Mono.just(activityMapper.mapToPojo(event, ..., null)))). When no security context is present (ingestion thread, background scheduler), the username falls back to null. No log.warn, no metric, no IllegalStateException for the system-event case. The resulting ActivityPojo.created_by_user_id is NULL with no in-system indicator that this was an ingestion-driven event. The systemEvent boolean exists on ActivityCreateEvent (:13) but is not used to distinguish a null-username system event from a null-username auth-context-bug user event.' — severity: MEDIUM"
