proposed_action: |-
  Add `DatasetVersionDiffParentCascadeAmplificationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `parentFieldRenamed_cascadesDeleteCreateToTwoLeafDescendants_pinsAmplificationOf4` — seed V1 `user { id, name }`, V2 `customer { id, name }`; GET diff; assert response contains 4 rows (user.id DELETED, user.name DELETED, customer.id CREATED, customer.name CREATED).
  2. `parentFieldRenamed_threeLevelNestingFourLeaves_amplifiesTo8_pinsAmplificationOf8` — seed V1 with 3-level struct `a.b.c { x1, x2, x3, x4 }`, V2 with `a.b.renamed { x1, x2, x3, x4 }`; GET diff; assert 8 rows.
  3. `nonParentFieldRenamed_singleLeafRename_amplifiesTo2_pinsNonCascadeBaseline` — seed V1 `user { id, name }`, V2 `user { id, full_name }` (only the leaf renamed); GET diff; assert 2 rows (name DELETED + full_name CREATED). Establishes the baseline (no cascade).
  4. `parentFieldRenamed_diffPayloadSizeGrowsLinearlyWithLeafCount_pinsLowSeverityAmplification` — for leaf counts {1, 10, 100, 1000} under a renamed parent; GET diff; assert the response row count is `2 × leaf_count`. Document the growth shape.

  Cross-pair with DOC-NNN: surface the parent-cascade amplification semantic on the dataset structure / diff doc — explain that struct renames produce N×2 diff rows for an N-leaf subtree.
