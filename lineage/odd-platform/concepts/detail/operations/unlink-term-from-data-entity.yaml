security_aggregate:
  overall: HIGH
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      REFACTOR-217 DELETE half: SecurityConstants.java:240-242 registers
      `/api/dataentities/{data_entity_id}/term/{term_id}` (SINGULAR)
      while openapi.yaml:1042 declares plural `/terms/{term_id}`. The
      rule never fires; AuthorizationCustomizer falls through to
      .authenticated(). ANY authenticated user can unlink any term
      regardless of Policy.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Any authenticated user can remove any manual term-link from any
      data entity. Even if REFACTOR-217 is fixed, the term-side has no
      separate authorization gate — the cross-namespace pollution
      remains.
  weaknesses:
    - |-
      HIGH — REFACTOR-217 DELETE half (path-mismatch silently disables
      DATA_ENTITY_DELETE_TERM); SYMMETRIC counterpart of the ADD bug;
      both halves now PRIMARY-SOURCE CONFIRMED
    - |-
      MEDIUM — term-side authorization absent even when SecurityRule is
      fixed; cross-namespace unlinks unconstrained
    - |-
      HIGH — UI gates the X button via WithPermissions but the server
      gate is broken; operators believe enforcement matches the UI
    - |-
      MEDIUM — audit-trail noise: silent-204 + always-fire activity
      event = forensics-friendly stream but low-signal
    - HIGH under DISABLED — anonymous mass-deletion + HARD-DELETE finality
  strengths:
    - |-
      Description-link protection at the WHERE clause prevents accidental
      removal of description-driven term inferences
    - |-
      @ActivityLog(TERM_ASSIGNMENT_UPDATED) captures BEFORE/AFTER state —
      provides the only forensic trail (HARD-DELETE leaves no row)
    - |-
      @ReactiveTransactional boundary at the service guarantees atomicity
      across DELETE + filled-flag + activity-event emission
performance_aggregate:
  overall: MEDIUM
  hot_paths: []
  weaknesses:
    - |-
      MEDIUM — REFACTOR-228 triple-re-query (the @ActivityLog handler
      runs 2× full-list reads BEFORE+AFTER plus the service's own 1×
      full-list read for the filled-marker decision); for entities
      with many terms, 3× O(N) per per-term unlink. Pairs with the
      existing REFACTOR-228 invariant captured at term-linkage entity.
    - |-
      LOW — activity-event fires even on no-op DELETE — write
      amplification to the `activity` table without diagnostic value
    - LOW — no method-level observability
notes: |-
  NEW operation captured in batch 2026-05-19L. Pairs with the symmetric
  Link Term to Data Entity operation; together they form the per-entity
  term-linkage CRUD surface. The REFACTOR-217 DELETE half is now
  PRIMARY-SOURCE CONFIRMED — the term-linkage authorization invariant
  is now 3-way triangulated at the CONTROLLER tier (POST + DELETE) AND
  the SERVICE tier (TermServiceImpl batch K).

  Cross-cutting connections:
    - Strengthens "Authorization path-mismatch — SECURITY_RULES /term
      vs OpenAPI /terms silently disables permission gate" invariant
