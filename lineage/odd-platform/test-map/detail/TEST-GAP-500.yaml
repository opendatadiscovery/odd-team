behaviour: |-
  Description-link protection regression-pin for deleteTermFromDataEntity (MEDIUM — load-bearing intent untested). The DELETE WHERE clause includes `.and(DATA_ENTITY_TO_TERM.IS_DESCRIPTION_LINK.isFalse())` (TermRelationsRepositoryImpl.java:84). A term linked to a data-entity ONLY via a `[[namespace:name]]` description mention cannot be removed via this endpoint; the user must edit the description (which routes through `handleDataEntityDescriptionTerms` / `updateDataEntityDescriptionTermsState` to remove description-link rows separately at TermServiceImpl.java:198-207 + lines 362-385). The UI gates the X button via `!linkedTerm.isDescriptionLink` (TermItem.tsx:46), so UI users never see the X for description-linked terms. However, an API caller bypassing the UI (curl, custom script — and per the REFACTOR-217 DELETE-half path-mismatch, ANY authenticated user, see TEST-GAP-489) calls DELETE /api/dataentities/{id}/terms/{termId} and gets 204 with NO actual change. The pair has a composite PK `(data_entity_id, term_id, is_description_link)` per V0_0_77__data_entity_term_description.sql:13-14 — manual and description-link rows can coexist for the SAME (data_entity, term) pair. A regression that dropped the `IS_DESCRIPTION_LINK.isFalse()` filter would silently allow API callers to remove description-link rows (which should only be removed by re-parsing the description), breaking the description→link inference invariant. The intentional design is undocumented at the operator-facing surface. Cross-pillar P-06 (Glossary integrity / the description-mention auto-link contract is load-bearing for term discoverability).
