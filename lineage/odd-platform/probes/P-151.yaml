expected_outcome: |
  Stress question (Category B — name-behavior pair) + wire-vs-DB enum
  asymmetry: the DB column `data_entity_task_run.status` accepts the
  full IngestionTaskRunStatus enum (SUCCESS | FAILED | SKIPPED | BROKEN
  | ABORTED | RUNNING | UNKNOWN — seven values, IngestionTaskRun.java:28-36).
  The OpenAPI wire-side enum `DataEntityRunStatus` does NOT include
  RUNNING (components.yaml:1407-1415: SUCCESS | FAILED | SKIPPED |
  BROKEN | ABORTED | UNKNOWN — six values).

  The DataEntityRunMapper @Mapping(source="run", target=".") flat-maps
  the pojo's String `status` field into the OpenAPI enum target
  (DataEntityRunMapper.java:13-14). MapperConfig.java:9 sets
  unmappedTargetPolicy=IGNORE — but that controls UNMAPPED PROPERTIES,
  not unknown enum literals. MapStruct's default for an unknown enum
  literal is to emit an `IllegalArgumentException` at the generated
  toEnum() switch-case `default:` branch.

  Two questions:

  Q1: when the runs-history endpoint encounters a row with
  `status='RUNNING'` (which the DB happily stores during in-flight
  task execution — DataEntityRunRepositoryImplTest.java:52, 102 seeds
  this exact scenario), what HTTP status does the operator see? 500
  with a marshal failure, or does some catch-all map it to a wire-safe
  value (e.g. UNKNOWN)?

  Q2: the OpenAPI client (the UI's generated-sources DataEntityRunStatus)
  would also choke on a RUNNING string if it somehow leaked through.
  Confirm or refute that the failure (if it exists) is at the server
  side (MapStruct throws before serialisation) vs the client side
  (server emits "RUNNING" string in JSON, client's enum-binding fails).

  Hypothesis: the endpoint returns HTTP 500 when the result set
  contains any RUNNING row — making the runs-history surface
  COMPLETELY UNAVAILABLE while any test is in flight (a
  silent-availability bug — the page renders empty / error to the
  operator at the moment the operator most needs to see "the test is
  running now").

  Drift class: wire-vs-DB enum asymmetry; RUNNING-state-unmodeled-at-wire;
  silent-availability-bug-during-in-flight-runs.

  This probe is HIGH-priority because the failure mode is operator-
  blocking (the runs page returns 500 instead of showing the live run).
