  Fixture detail:
  (a) <AppErrorPage showError={false} /> → assert nothing rendered.
  (b) <AppErrorPage showError error={{status:404,
  statusText:'Not Found', url:'', message:''}} /> → assert "404"
  and "Not Found" both in DOM.
  (c) <AppErrorPage showError /> (no error prop) → assert
  "Unknown Error" string in DOM (sourced from t(...) — mock i18next
  to return the literal).
  (d) <AppErrorPage showError error={{status:500, statusText:'',
  url:'', message:''}} /> → assert "Unknown Error" fallback for
  empty statusText.
  (e) Render with a navigation history; click the Home Page
  button; assert pushHistory was called with "/" AND no
  window.location.reload was invoked.
