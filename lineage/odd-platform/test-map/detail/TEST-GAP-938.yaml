behaviour: |-
  **PUT /api/policies/{id} lost-update race — two concurrent authenticated
  authorized clients posting different bodies BOTH succeed; second-arriving
  wins; first-arriving change is SILENTLY LOST with no 409 Conflict, no ETag
  protocol, no version field, no @ReactiveTransactional bracket spanning the
  read-then-write.** The controller has NO transactional annotation; the
  service tier (PolicyServiceImpl per batch-S) does not carry one either.
  Two layers of missing transactional bracket — controller above + service
  below — confirm the race is operator-visible from the HTTP surface. An
  RBAC operator authoring policy changes during a release rollout could
  silently lose policy text the platform stored briefly. No optimistic
  concurrency surface exists (no @Version on PolicyPojo, no If-Match header
  expected).
