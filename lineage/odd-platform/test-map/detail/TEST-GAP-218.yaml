gap_id: TEST-GAP-218
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java RoleController controller-method:createRole
surfaced_by:
- createRole.md:tests_coverage_semantic.uncovered_behaviours.[2]
behaviour: Under `auth.type=DISABLED` (the application.yml-bundled default), `AuthorizationCustomizer`
  is NOT wired (`DisabledAuthSecurityConfiguration.java:10`) and SECURITY_RULES is
  INERT — any network-reachable caller can POST /api/roles. Combined with anonymous
  ADMIN principal under DISABLED, an attacker can issue `POST /api/roles` with a custom
  Administrator-equivalent policy attached. This is the LSN-001-shape failure mode
  on the RBAC primary surface.
