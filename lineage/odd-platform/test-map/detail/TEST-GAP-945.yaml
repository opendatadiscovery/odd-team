behaviour: |-
  **THE 10-SIDECAR AUDIT-SILENCE PATTERN — RBAC mutation + identity-exposure
  stack is forensically dark across THREE vertical layers × multiple controllers.**
  Cross-batch confirmation now spans:
  (1) IdentityController.java:1-34 (this batch) — no @Slf4j, no Logger, no log
  call on /api/identity/whoami;
  (2) PolicyController.java:1-64 (this batch) — no @Slf4j, no Logger, no
  @ActivityLog, no log call on any of 6 ops;
  (3) RoleController.java:1-52 (this batch) — no @Slf4j, no Logger, no log
  call on any of 4 ops;
  (4) PermissionController.java:1-27 (this batch) — no @Slf4j, no Logger;
  (5-7) PolicyServiceImpl, RoleServiceImpl, ReactivePolicyRepositoryImpl,
  ReactiveRoleRepositoryImpl (batches E, H, N, S — TEST-GAP-221/573 audit
  silence cluster);
  (8) ReactiveActivityRepositoryImpl (batch R) — schema-rooted: V0_0_48
  data_entity_id NOT NULL FK structurally prevents recording RBAC mutations
  (TEST-GAP-659);
  (9-10) OwnerServiceImpl + AppToolbar UI (batches P, Q) — completing the
  pattern at controller + UI surface ends.

  No test enforces this silence today. A privileged caller (S2S API-key
  holder injected as ADMIN globally per REFACTOR-108) invoking POST /api/roles
  with {name: 'attacker-admin', policies: [<MANAGEMENT/ALL id>]} produces
  ZERO application log lines — forensically undetectable. The fix is
  schema-rooted (V0_0_48 NULLable data_entity_id + discriminator column OR
  separate platform_event table) not annotation-rooted; a controller-tier
  @Slf4j addition does not solve the activity-log structural defect but it
  IS a partial mitigation that should be regression-pinned.
