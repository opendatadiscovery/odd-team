behaviour: |-
  **`setDataQATestSeverity` MUTATES OWNED ENTITY STATE WITH NO AUDIT TRAIL — extension of the audit-log presence asymmetry pattern (concepts.yaml — `audit-log-presence-asymmetry-2-tier-audit-story`) to the DQ surface.** The repository upsert at `ReactiveDataQualityRepositoryImpl.java:90-101` writes to `DATA_QUALITY_TEST_SEVERITY` with `onDuplicateKeyUpdate` on `(DATA_QUALITY_TEST_ID, DATASET_ID)` — idempotent in outcome but there is NO `ActivityEvent` emission, NO `@ActivityLog` annotation on `DataQualityServiceImpl.setDataQualityTestSeverity` (lines 62-81), NO audit log entry, NO `last_modified_by`, NO version increment. **A maintainer auditing "who set this severity to Critical?" has no answer from the platform.** The Activity Feed (P-07:F-003) captures alert status changes, ownership creations, description edits, tag/term assignments — but severity changes on DQ tests are SILENT. This is the audit-log presence asymmetry instantiated on the DQ surface: state changes on OWNED entities are NOT audited here, whereas other state changes on the same owned entities (ownership transitions, description edits) ARE audited. **Why this matters more than the general audit asymmetry**: severity affects the SLA-colour rendering directly (per SLACalculator's hierarchical-multiplicative weight algorithm — changing a single test's severity from Major to Critical flips the dataset SLA from Yellow to Red WITHOUT any test pass/fail status changing). A compliance auditor seeing a dataset go from Green to Red overnight has no way to determine "who reclassified test X to Critical at time Y" — the platform's forensic trail is silent on this surface. **No test catches this**: there is no test asserting that calling `PUT /api/datasets/{id}/dataqatests/{tid}/severity` produces an activity row, a log line, or any persisted audit record. STRENGTHENS TEST-GAP-232 (RBAC audit-silence pattern) by adding a NEW invocation site — the audit-trail gap is broader than just RBAC; it also covers data-quality mutations.
