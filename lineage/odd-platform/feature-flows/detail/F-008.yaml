control_summary: |-
  0 of 4 cells PROBED — feature emerged from batch-I primary-source audit of
  IngestionService + LineageServiceImpl. The two destructive surfaces
  (metadata-delete-on-absence + lineage-replace-on-each-call) are the highest-leverage
  candidates for the next probe round. Proposed P-NNN — local docker-compose stack
  + ingest entity with metadata {a:1,b:2} + ingest entity with metadata {a:1} only
  + assert b is GONE from /api/dataentities/{id}/metadata. Symmetric probe for
  lineage replacement. Existing integration tests cover happy-path / schema-change
  / lineage-materialisation / alert-generation but NEVER exercise the destructive
  surfaces — a regression that "fixes" the delete-on-absence semantics (e.g. a
  maintainer adding MERGE semantics in a refactor) would land green in CI.

  Batch P adds the sibling `POST /ingestion/datasources` entry-point
  (IngestionController.createDataSourceEntity) — the S2S datasource-registration
  endpoint. Five new drift facets surface from the architectural-asymmetry angle:
  (1) `IngestionDataSourceFilter` is UNCONDITIONAL `@Component` (no
  `@ConditionalOnProperty`) while the F-008 hop-0 `IngestionDataEntitiesFilter`
  is conditional on `auth.ingestion.filter.enabled` (default `false`) — so
  `/ingestion/datasources` is ALWAYS auth-required, `/ingestion/entities` is
  default-off; the asymmetry between sibling filters is invisible to operators
  reading the S2S doc; (2) Collector identity propagates via WebSession-attribute
  (`SessionConstants.COLLECTOR_ID_SESSION_KEY` — stringly-typed, non-final, no
  Spring `@SessionAttribute` binding) rather than via Spring Security Principal;
  (3) Upsert semantics are PARTIAL-MERGE — only `name` + `description` propagate
  on update, all other fields preserved (mirrors F-008's `silent_destruction_replace_not_merge`
  with INVERTED polarity — protective vs destructive, but both undocumented);
  (4) Namespace inherited from Collector — payload `namespace_name` silently
  dropped; (5) Session-state-loss surfaces as HTTP 500 not 401 — operator-debug
  misleading. The Audit-log Presence Asymmetry canonicalisation candidate gains
  a 5th data point (createDataSource has no @ActivityLog / no activity event;
  DataSourceIngestionServiceImpl.java:41-72 has zero `activityEventEmitter`
  references). REFACTOR-185 17th invocation site primary-source confirmed at the
  datasource-registration endpoint. Two-half S2S ingestion coverage (`/entities`
  + `/datasources`) is now PRIMARY-SOURCE COMPLETE at the controller-method tier.
  The architectural-asymmetry finding is the headline — the two sibling endpoints
  in the same `IngestionController` class encode INCONGRUOUS auth-defaulting +
  identity-propagation choices; documenting this asymmetry is the highest-leverage
  doc-gap candidate downstream from this batch.
