- id: H-010
  hypothesis: |-
    When the notifications WAL subscriber is the elected leader and one ALERT row cannot be
    translated (poison message), only that delivery is affected — subsequent alerts continue to
    be delivered.
  derivation: |-
    The reflection's scope is the registry, but the feature-flow facet
    `compound_with_poison_message_replay_silent_subsystem_loss_at_two_layers` ties the two; an
    operator expects one bad alert not to take down the whole channel. Negative-space.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      A poison ALERT row blocks ALL subsequent alert delivery cluster-wide. The inner
      `messageProcessor.process(...)` (NotificationSubscriber.java:80) is NOT wrapped in
      try/catch; on a RuntimeException from the translator the LSN is NOT advanced, the outer
      loop releases the lock, sleeps 10s, re-acquires, re-delivers the SAME message, and throws
      again — forever. The presenting observable ("alerts stopped, health green, no logs") is
      identical to the advisory-lock-collision wedge (H-002/H-005), which is the load-bearing
      compound: two distinct root causes, one indistinguishable symptom, and the missing
      observability (H-005) is what prevents an operator from telling them apart. Tracked
      separately as PLT-139.
    evidence:
      - sidecar: odd-platform__java__notification__class__NotificationSubscriber.md
        section: bugs_limitations_corner_cases[0] (poison-message WAL replay loop)
        cite: "NotificationSubscriber.java:77-91 + AlertNotificationMessageProcessor.java:23-24"
        note: "no try/catch around process; LSN advances only after success → un-advanced LSN re-delivers the poison row forever"
    operator_visible_failure: |-
