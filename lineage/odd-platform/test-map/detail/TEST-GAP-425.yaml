behaviour: |-
  AppErrorPage reads AppError from store and renders the banner — when fetchDataEntityDetails is rejected, the error envelope { status, statusText, url, message } from lib/errorHandling.tsx:12-26 lands in loader.errors[fetchDataEntityDetails]; <AppErrorPage /> at DataEntityDetails.tsx:116-119 reads it and renders a full-page banner. Tests must pin (a) the 4 fields rendered into the DOM; (b) the fallback message 'An error occurred' when body.message absent; (c) the rendering does NOT discriminate 403 / 404 / 500. The generic error display is a known limitation (severity MEDIUM) — a regression that broke AppErrorPage rendering leaves users with a blank detail page and no feedback.
