name: IdsParam 'Entity ids' description misdescribes getPopularTagList's tag-id filter (LSN-020 class)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-11
description: |-
  NEW INVARIANT, batch X-TAGGING (2026-05-21) — captures a
  spec-level input-name-vs-implementation drift on the `tag` OpenAPI
  surface, surfaced by the openapi-tag `tag` sidecar. LSN-020 drift
  class (input name promises one thing, the implementation binds
  another).

  THE DRIFT:
    `getPopularTagList` (GET /api/tags) references the SHARED `IdsParam`
    query-parameter component (openapi.yaml:351 -> components.yaml:4239-4248).
    The IdsParam component's `description` field reads literally
    `Entity ids` (components.yaml:4242). On the getPopularTagList
    operation — which returns tags — `Entity ids` promises the caller
    is filtering by DATA-ENTITY identifiers.

    The implementation does NOT do that. TagController.getPopularTagList
    binds the parameter as `List<Long> ids` and passes it to
    `tagService.listMostPopular(query, ids, page, size)`
    (TagController.java:36-44); ReactiveTagRepositoryImpl.listMostPopular
    adds `TAG.ID.in(ids)` when ids is non-empty
    (ReactiveTagRepositoryImpl.java:141-142). The `ids` parameter is a
    TAG-id-set filter on the tag directory — NOT a data-entity filter.

  WHY IT IS OPERATION-LOCAL:
    The IdsParam component is SHARED. Its `Entity ids` description is
    ACCURATE for its other consumer — a data-entity-scoped operation at
    openapi.yaml:139. The defect is the REUSE of an entity-scoped
    parameter component on a tag-scoped operation: getPopularTagList
    does not override the shared component's description. An OpenAPI
    consumer reading the rendered spec for getPopularTagList has no way
    to know `ids` means tag ids here.

  OPERATOR-VISIBLE CONSEQUENCE:
    A caller who reads `Entity ids` and supplies DATA-ENTITY ids gets
    an empty page (none of those ids exist in the tag table). WORSE —
    when a supplied value is BOTH a valid data-entity id AND a valid
    tag id, the operation silently returns the matching TAG, masking
    the misunderstanding with a nonsensical-but-non-empty result. A
    caller who actually wants 'tags applied to these entities' cannot
    get it from this operation at all — the parameter does not perform
    an entity-join.

  THE RECOMMENDED FIX:
    A dedicated `TagIdsParam` component (description 'Tag ids') OR an
    operation-level parameter override on getPopularTagList. NOT a
    column change — the SQL bind (TAG.ID.in(ids)) is correct; the spec
    description is the drifting artefact.

  PROBE:
    Pinned by the placeholder probe P-031 (lineage/odd-platform/probes/P-031.yaml)
    — asserts the data-entity-id-vs-tag-id collision case at runtime.

