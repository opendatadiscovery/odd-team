surfaced_by:
  - "Directory.md:bugs_limitations_corner_cases.[4] — 'TanStack Query cache key [dataSourceTypes] does NOT include any user-identity scope. If two users with DIFFERENT visibility constraints share a browser session, the cache leaks the level-1 view across users.'"
behaviour: |-
  **LOW — TanStack Query cache key has no user-identity scope; latent vulnerability if per-user scoping is added to the API in the future.** `directory.ts:13-14`: `queryKey: ['dataSourceTypes']` — a static cache key. Today the API returns the same catalog-wide view for every authenticated user (per the read-collaborative posture), so this is moot. **But if a future patch adds per-user scoping to the API while leaving the UI cache key untouched**, a cache-hit would return the prior user's view to the new user.

  **Reproduction scenarios** (today: NONE; future after API-tier scoping):
  - Shared workstation: UserA logs in, navigates to Directory (caches view); UserA logs out; UserB logs in (same browser session), navigates to Directory → cache hit returns UserA's view.
  - SSO context-switch: same browser with multiple identities, cached view from prior identity leaks.

  **Why LOW**:
  - **Latent** — actionable only if API-tier scoping is added
  - **Bounded scope** — requires shared browser session (rare in production but possible in dev/test environments)
  - **Easy fix when actionable** — add `userId` or `session_id` to the queryKey
  - **No data integrity / security impact today** — the API is read-collaborative by design

  **Test gap shape**: A latent-regression-pin test that documents the cache-key-vs-identity assumption. Surfaces if a future maintainer adds API-tier scoping without updating the cache key.
