      VALUES (6001, '//probe-source/p150/dq/test1', 'p150_dq_test', 6000, 9, ARRAY[4], 1, false, false, false, NOW(), NOW())
      ON CONFLICT DO NOTHING;
  - kind: sql
    description: "Seed 5 task_run rows with mixed scenarios — 2 with identical end_time (tie), 1 RUNNING (NULL end_time), 2 with distinct end_times"
    query: |
      INSERT INTO data_entity_task_run (oddrn, task_oddrn, name, start_time, end_time, status, status_reason, type)
      VALUES
        ('//probe-source/p150/run/A', '//probe-source/p150/dq/test1', 'run_A_running',  NOW() - INTERVAL '1 minute',  NULL,                              'RUNNING', NULL, 'DATA_QUALITY_TEST_RUN'),
        ('//probe-source/p150/run/B', '//probe-source/p150/dq/test1', 'run_B_tie',      NOW() - INTERVAL '60 minutes', NOW() - INTERVAL '50 minutes',     'SUCCESS', NULL, 'DATA_QUALITY_TEST_RUN'),
        ('//probe-source/p150/run/C', '//probe-source/p150/dq/test1', 'run_C_tie',      NOW() - INTERVAL '70 minutes', NOW() - INTERVAL '50 minutes',     'SUCCESS', NULL, 'DATA_QUALITY_TEST_RUN'),
        ('//probe-source/p150/run/D', '//probe-source/p150/dq/test1', 'run_D_recent',   NOW() - INTERVAL '40 minutes', NOW() - INTERVAL '30 minutes',     'FAILED',  'assertion mismatch', 'DATA_QUALITY_TEST_RUN'),
        ('//probe-source/p150/run/E', '//probe-source/p150/dq/test1', 'run_E_oldest',   NOW() - INTERVAL '120 minutes', NOW() - INTERVAL '110 minutes',   'SUCCESS', NULL, 'DATA_QUALITY_TEST_RUN');
