expected_outcome: |
  Hypothesis H-013 (verbatim from the reflection):

  "When a collector re-ingests an entity via POST /ingestion/entities with a
  metadata set that OMITS a field present last tick (and a lineage edge list
  that OMITS an edge present last tick), the platform PRESERVES the previously-
  ingested metadata fields and lineage edges (merge semantics) — a collector
  that drops a field due to a transient scrape failure does not lose catalog
  state."

  Static trace (IngestionServiceImpl sidecar + MetadataIngestionRequestProcessor.java:72-80
  + LineageIngestionRequestProcessor.java:17 + LineageServiceImpl.java:124-133):
  the chain is REPLACE, not merge. MetadataIngestionRequestProcessor computes
  `bindingsToDelete = existing.difference(current)` and DELETES the omitted
  bindings inside the same @ReactiveTransactional; LineageIngestionRequestProcessor
  calls `replaceLineagePaths` which `batchDeleteByEstablisherOddrn` then
  `batchInsertLineages`. The STATIC verdict is CONTRADICTED with HIGH confidence.
  This probe is emitted NOT because the verdict is in doubt (the code is
  unambiguous) but because the BLAST RADIUS and the exact operator-observable
  end state have NEVER been measured (F-008 test_matrix: 0 of 4 cells probed;
  integration suite covers happy-path write but never the destructive subtraction
  surface — a regression that "fixes" delete-on-absence to merge would land green
  in CI). A measured run pins the destructive contract so the regression is
  caught and gives the doc-gap (DOC-195 / F-008 substrate) a reproduced artefact.

stress_category: F (request-input-vs-implementation behaviour — re-ingest subtraction semantics)

