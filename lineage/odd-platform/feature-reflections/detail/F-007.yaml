- id: H-008
  hypothesis: "When a steward resolves an alert, the three tab badges (All / My Objects / Dependents counts) update to reflect one fewer open alert."
  derivation: "Senior-PO UX correctness: a count badge next to a list a user just mutated should reflect the mutation; a stale badge is an obvious 'is this working?' defect."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
