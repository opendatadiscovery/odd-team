- id: H-001
  hypothesis: "When a user opens GET /api/datasets/{X}/structure/{V} (or the UI revision view) where version V belongs to a DIFFERENT dataset Y, the system returns 404 — the path component {X} scopes the lookup, so a version that is not X's is not found."
  derivation: "The path /api/datasets/{data_entity_id}/structure/{version_id} names data_entity_id as the owning dataset; a user reading the URL assumes containment. OpenAPI: 'Get DataSet structure ... by DataSet's id and version'."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The implementation returns dataset Y's full schema with HTTP 200. The
      by-version-id path filters on DATASET_VERSION.ID.eq(datasetVersionId) ONLY
      (ReactiveDatasetVersionRepositoryImpl.java:129); the data_entity_id is consumed
      by the controller and used solely inside the not-found error message — it never
      reaches SQL (DatasetVersionServiceImpl.java:39-45). DATASET_VERSION.DATASET_ODDRN
      is available and already JOINed in the latest-path but is omitted from the WHERE
      on the by-id and diff paths. version_id is a sequential bigserial, so the leak
      is enumerable.
    evidence:
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: stress_findings.request_inputs[dataEntityId]
        cite: "ReactiveDatasetVersionRepositoryImpl.java:129"
        note: "TRANSLATES_SILENTLY — by-id path filters version_id only; dataEntityId discarded."
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: stress_findings.request_inputs[dataEntityId].Q5
        cite: "ReactiveDatasetVersionRepositoryImpl.java:163-168"
        note: "Available-but-unused: DATASET_VERSION.DATASET_ODDRN is JOINed in the latest path; the by-id/diff WHERE skips it — a one-line fix per path."
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: security.data_exposure
        cite: "DatasetController.java:22-50 + ReactiveDatasetVersionRepositoryImpl.java:97-157"
        note: "Schema payload (fields + types + descriptions + tags + terms + lookup-table defs) returned across owners."
    operator_visible_failure: |
      (1) Cross-tenant schema disclosure: any authenticated user enumerating version_ids
      reads every dataset's full schema metadata — column names, types, descriptions,
      tags, glossary terms, lookup-table definitions — independent of dataset-level
      ownership. (2) Under auth.type=DISABLED (dev/demo default) the leak is anonymous.
      (3) The URL pattern actively misleads: an operator who sees /api/datasets/{X}/...
      reasonably assumes containment that does not exist, so the leak is invisible in
      a casual security review of the route table. (4) The tags+terms in the payload
      mean the leak crosses into F-018 (Manual Object Tagging) data, not just raw schema.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

