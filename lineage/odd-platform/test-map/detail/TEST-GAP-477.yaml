gap_id: TEST-GAP-477
category: missing-security
criticality: CRITICAL
node_ids:
  - "odd-platform java service service:TermServiceImpl"
  - "odd-platform java AlertController controller-method:changeAlertStatus"
pillars_affected: [P-06, P-07, P-09]
surfaced_by:
  - "TermServiceImpl.md:bugs_limitations_corner_cases.[1] (Second SecurityConstants bug — /api/alerts/{alert_id}/status PUT gated by DATASET_FIELD_ADD_TERM)"
  - "TermServiceImpl.md:security.known_security_gaps.[1]"
behaviour: |-
  `/api/alerts/{id}/status` PUT is gated by `DATASET_FIELD_ADD_TERM` — wrong permission regression-pin. SecurityConstants.java:295-296 registers `new SecurityRule(ALERT, new PathPatternParserServerWebExchangeMatcher("/api/alerts/{alert_id}/status", PUT), DATASET_FIELD_ADD_TERM)` — a Term permission applied to an alert-status path. Almost certainly a copy/paste error: the AlertController.changeAlertStatus endpoint should gate on `DATA_ENTITY_ALERT_RESOLVE` (the named permission for that operation). Effect: an operator with `DATASET_FIELD_ADD_TERM` can change alert statuses on any data entity; an operator with `DATA_ENTITY_ALERT_RESOLVE` (the named permission for that operation) cannot. Cross-pillar — P-06 (Term) permission inadvertently grants P-07 (Alerts) capability. Cross-tier — the bug lives at the SecurityConstants tier; AlertController + AlertServiceImpl execute the change unimpeded. This is an INDEPENDENT auth bug discovered while enriching TermServiceImpl; warrants its own regression test surface.
test_class: missing-security
test_files_existing: []
test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/AlertStatusWrongPermissionTest.java"
  name: "changeAlertStatus_callerWithDATASET_FIELD_ADD_TERM_succeeds_callerWithDATA_ENTITY_ALERT_RESOLVE_fails"
evidence:
  - |-
    TermServiceImpl.md:bugs_limitations_corner_cases.[1] (Second SecurityConstants bug): 'SecurityConstants.java:295-296 registers new SecurityRule(ALERT, new PathPatternParserServerWebExchangeMatcher("/api/alerts/{alert_id}/status", PUT), DATASET_FIELD_ADD_TERM) — a Term permission applied to an alert-status path. Almost certainly a copy/paste error.'
  - "SecurityConstants.java:295-296 (the misconfigured rule)"
  - "Cross-ref: AlertController.changeAlertStatus is the consumer endpoint"
cross_references:
  - "concepts.yaml:invariants[Authorization is path-pattern wired in SecurityConstants.SECURITY_RULES]"
  - "TEST-GAP-005 (related: changeAlertStatus mutation has no permission gate — same endpoint, different angle)"
  - "TEST-GAP-017 (related: same SecurityConstants pattern of path-string drift)"
  - "REFACTOR-NNN candidate: SecurityConstants.java:295-296 copy/paste correction"
proposed_action: |-
  WebFluxTest-driven test. Two cases. (A) Authenticated caller with `DATASET_FIELD_ADD_TERM` permission only — POST /api/alerts/{id}/status — assert HTTP 200/204 success (current bug; LOCKS the inversion). (B) Authenticated caller with `DATA_ENTITY_ALERT_RESOLVE` permission only — POST /api/alerts/{id}/status — assert HTTP 403. The fix (correct SecurityConstants.java:295-296 to use DATA_ENTITY_ALERT_RESOLVE or the equivalent alert-status permission) flips both assertions; the test must update AND a fix-required regression promoted.
