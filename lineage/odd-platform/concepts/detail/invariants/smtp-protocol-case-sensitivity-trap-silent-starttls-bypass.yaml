mitigations_unimplemented:
- |-
  Code-side: change the branch comparison to `.equalsIgnoreCase("smtp")` OR
  `.toLowerCase().equals("smtp")` at NotificationConfiguration.java:63. The
  fix is one-line and removes the case-sensitivity surface entirely. Backward-
  compatible (lowercase 'smtp' deployments continue to work; uppercase 'SMTP'
  deployments start working as the docs imply).
- |-
  Code-side: replace the case-sensitive string comparison with an explicit
  enum `SmtpProtocol { SMTP, SMTPS, … }` AND Spring's enum-binding (which
  IS case-insensitive). The typed approach also closes the door on
  raw-string typos that would land in the else branch.
- |-
  Code-side: emit a boot-time WARN log if the else branch is taken — 'protocol
  configured as {x}; not equal to lowercase smtp; STARTTLS + AUTH properties
  will NOT be set'. Surfaces the misconfiguration without breaking existing
  non-SMTP transports.
- |-
  Doc-side: update the live `/configuration-and-deployment/odd-platform`
  Gmail example to use lowercase 'protocol: smtp'. If the code change is
  applied (recommended), keep the docs consistent. If the code change is
  NOT applied, the docs MUST be corrected immediately to prevent ongoing
  operator-copy-paste failures.
- |-
  Doc-side: add a notification-channel section heading 'Protocol value is
  case-sensitive — use lowercase smtp' as an admonition until the code-side
  fix lands.
- |-
  Test-side: add a unit test on NotificationConfiguration#mailSender asserting
  that protocol='smtp' and protocol='SMTP' produce IDENTICAL Properties bag
  contents. The asymmetry is currently uncovered (entire notification package
  has zero test files per the NotificationConfiguration sidecar's gaps section).
