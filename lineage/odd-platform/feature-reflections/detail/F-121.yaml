- id: H-010
  hypothesis: "When an operator performs a rolling deployment (kubectl delete pod) during a housekeeping cycle, the platform drains the in-flight job gracefully so the next replica can resume housekeeping promptly."
  derivation: "bugs_limitations_corner_cases[3] — graceful_shutdown_lock_held_for_lockatmostfor_window; the operator doing a routine rollout expects no multi-minute housekeeping gap."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      There is no graceful drain. `spring.task.scheduling.shutdown.await-termination` is unset, so
      Spring's default interrupts the running scheduled thread on SIGTERM. The in-flight jOOQ
      transaction rolls back (safe via try-with-resources), but the `shedlock` row stays held until
      `lockAtMostFor` (~14m for housekeeping) expires — so NO replica can run housekeeping during
      that window. The hypothesis (graceful drain + prompt resume) is contradicted by the absence
      of await-termination config; confirmed as a real gap.
    evidence:
      - sidecar: odd-platform__java__config__config-class__SchedulingConfiguration.md
        section: "bugs_limitations_corner_cases[3]"
        cite: "SchedulingConfiguration.java (no TaskScheduler bean with shutdown semantics) + grep shutdown.*await returns zero"
        note: "Absence verified by grep; the lock-hold-after-interrupt window is ~lockAtMostFor."
    operator_visible_failure: |
      Routine rolling deployments on a busy housekeeping cycle introduce up to ~14 minutes of
      housekeeping pause per restart (the lock-hold window after the interrupted replica dies).
      For a frequently-redeployed platform this can mean housekeeping rarely completes a full
      cycle. No data loss (transaction rolls back), but retention silently lags. Mitigation:
      `spring.task.scheduling.shutdown.await-termination: true` + a termination period — though a
      14-minute job exceeds any reasonable grace period, so the deeper fix is chunked housekeeping.
      Tracked statically only as a drift_class; dedup net_new.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: "When an operator overrides application.yml in a Helm/Kustomize layer and omits the housekeeping block, housekeeping continues to run with safe defaults (because the docs say it is 'on by default')."
  derivation: "concepts.invariants[strict-opt-in] — the @ConditionalOnProperty has no matchIfMissing; the operator's expectation from 'default true' framing is fail-safe."
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      The "on by default" is delivered ONLY by the shipped application.yml:166 (`housekeeping.enabled:
      true`). The bean is `@ConditionalOnProperty("housekeeping.enabled", havingValue="true")` with
      NO matchIfMissing, so an override that omits the key produces a SILENT no-op (housekeeping bean
      not registered, no boot warning). The opposite failure mode is the more dangerous one (F-010 /
      PLT-083 Defect 1): omitting only the `housekeeping.ttl.*` block while keeping `enabled: true`
      binds the Java primitive-int TTL fields to 0 and wipes everything on the next cycle. Either
      partial-override path is a trap. This boundary is THIS feature's executor-config edge but the
      data-loss half belongs to F-010; cited here for completeness, routed there for the fix.
    evidence:
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: "concepts.invariants[0] + bugs_limitations_corner_cases[6] + implicit_adrs[3]"
        cite: "HousekeepingJobManager.java:18 (no matchIfMissing) + application.yml:166"
        note: "Strict opt-in confirmed; the enabled-key-absent no-op is pinned by AdrHousekeepingOptOutScanTest (ADR-0046)."
    operator_visible_failure: |
      An operator standardising per-env Helm overlays who drops the housekeeping block gets
      EITHER silent no-op (key absent -> partitions/rows grow unbounded) OR silent total wipe
      (only ttl block absent, enabled stays true -> TTL=0 deletes everything in 15 min). Both
      are LSN-001-shaped. The enabled-absent no-op is pinned by a test (ADR-0046); the TTL=0
      wipe is tracked as PLT-083 Defect 1 + DOC-250 Caveat 1 (done). Dedup: already_tracked.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: verified
    test_ref: "config.AdrHousekeepingOptOutScanTest (ADR-0046 — enabled-absent disables; no matchIfMissing) + config.FeatureGatingDefaultsTest (housekeeping ships enabled=true)"

