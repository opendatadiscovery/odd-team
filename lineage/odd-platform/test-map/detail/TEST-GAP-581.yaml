  - "IngestionDataEntitiesFilter.md:concepts.invariants.[1]"
behaviour: |-
  **Path matcher hard-coded — wildcard refactor or version-suffix would silently bypass.** The path matcher at IngestionDataEntitiesFilter.java:28 is constructed from the literal string `"/ingestion/entities"` + `HttpMethod.POST`. The constructor does NOT accept a path; no `@Value` or property injects one. A future endpoint `POST /ingestion/entities/batch`, `POST /ingestion/entities/v2`, `POST /ingestion/entities/stream`, or a router rewrite (Spring Cloud Gateway, Kubernetes Ingress) presenting `/api/ingestion/entities` prefix would silently bypass the filter. There is no compile-time signal, no test asserting the path scope, and no `@docs` annotation pinning the literal. The maintainer's intent (per implicit_adrs[0]) is one-filter-class-per-path — but the convention is enforced by code-pattern only, not test or schema.
