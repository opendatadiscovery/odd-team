surfaced_by:
  - 'en.md:tests_coverage_semantic.uncovered_behaviours.[2] (Every key present in en.json is also present in every non-English locale file — the localization-completeness drift; HIGH; 3-4 keys missing from each non-English locale)'
behaviour: |-
  **No CI / test step asserts that every key in `en.json` is present in
  ALL FIVE other locale JSONs (ch / es / fr / hy / ua).** Per the en.md
  sidecar: `wc -l` on the six locale files shows en=418 lines,
  ch=415, fr=415, es=414, hy=414, ua=414 — every non-English locale is
  missing 3-4 keys present in English.

  Concrete sample (verified via Glob 2026-05-26 against the six locale
  files at `odd-platform-ui/src/locales/translations/`): the file
  inventory matches the sidecar's claim. The natural-keys convention
  (key === English literal) means missing entries silently fall back
  through `fallbackLng = ['en', 'es', 'ch', 'fr', 'ua', 'hy']`
  (i18n.ts:30) to English. A Spanish-speaking user who selects
  Spanish in the locale switcher AND encounters a key that is
  present in en.json but missing from es.json sees the ENGLISH text
  rendered instead — operator-facing inconsistency.

  This is a HIGH-severity gap because (a) the deployment supports
  six locales as a documented feature, (b) the drift is
  silent — no UI warning, no missing-key indicator, (c) the only
  observable consequence is a non-English user encountering a key
  that DOES NOT EXIST in their locale but DOES in English. The drift
  is undetectable in CI without a parity check.
