mitigations_unimplemented:
- |-
  **Option A (cleanup migration)** — add a V0_0_NNN migration mirroring
  V0_0_76's structure:
    DELETE FROM term_to_term WHERE deleted_at IS NOT NULL;
    ALTER TABLE term_to_term DROP COLUMN IF EXISTS deleted_at;
  This brings term_to_term in line with the 3 sibling link tables.
  Lowest-cost; preserves the existing read-path semantics.
- |-
  **Option B (filter-coverage patch)** — add
  `TERM_TO_TERM.DELETED_AT.isNull()` predicate to all 7 read sites in
  ReactiveTermRepositoryImpl. Forward-compat with a future term-to-term
  soft-delete feature; higher per-query cost.
- |-
  **Option C (add the soft-delete feature)** — wire the V0_0_91
  `deleted_at` column to a service-tier soft-delete-then-restore method
  on term-to-term links, then add the filters (Option B) AND a restore
  API. Highest scope; defensible if the maintainer originally intended
  to add term-to-term soft-delete and never finished.
- |-
  Document the asymmetry on the business-glossary operator page —
  operators inspecting the schema or running ad-hoc queries against
  term_to_term need to know that deleted_at is not honoured today.
- |-
  Add a regression test pinning the current behaviour:
    (a) Insert a term_to_term row;
    (b) Set deleted_at = NOW();
    (c) Call getLinkedTermsByTargetTermId — assert the soft-deleted
        row IS STILL RETURNED (pinning the buggy behaviour as the
        regression baseline) OR assert it is NOT returned (under
        Option B / Option C).
- |-
  Add a build-time invariant scanner that flags any new
  repository read against a table with a deleted_at column that
  lacks the matching `.deleted_at.isNull()` predicate — the bug class
  is bigger than just term_to_term.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-19N. The bug is
  THEORETICAL today (no code path writes `term_to_term.deleted_at`) but
  the architectural-class drift is real: a schema permission for
  soft-deletion that the application code does not honour creates the
  same shape of bug as the batch-H Policy.getRolesPolicies orphan-
  binding permission leak — a deleted state in the DB that the
  application silently ignores at read time.

  The maintainer's most-likely intent was Option A — V0_0_76 dropped
  deleted_at from the 3 sibling tables as the platform's commitment to
  hard-delete-on-relationship-edges; V0_0_91 should have inherited the
  same shape and didn't. The cleanup is one DROP COLUMN migration plus
  no code change.

  Cross-cutting connections:
    - Pairs with hard-delete-on-relationship-edges-confirmed-cross-batch
      (batch L) — the same architectural commitment; term_to_term is
      the ASYMMETRIC EXCEPTION that batch L's invariant does NOT cover
    - Pairs with three-soft-delete-mechanisms-across-the-repository-layer
      (batch H — strengthened batch L) — adds term_to_term as a FIFTH
      shape: schema-permits-soft-delete-but-app-never-filters
    - Cross-references policy-getRolesPolicies-missing-deleted_at-filter
      (batch H — the symmetric architectural-class bug on the RBAC
      pillar)
    - Cross-references the rbac-soft-delete-persistence-policy-aggregation
      invariant batch H (symmetric pattern on the LEFT JOIN side of
      the role-policy edge — policies aren't deleted_at-filtered in
      Role's getDto/listDto/getByName per the batch-N Role-repo finding)

  This invariant ALSO pairs with the batch-N
  hasDescriptionRelations-parent-soft-delete-bypass invariant — same
  repository file (ReactiveTermRepositoryImpl), same architectural-
  class: a soft-delete signal that the read path treats inconsistently.

  Three DOC-NNN candidates flow from this invariant:
    (a) Drop the column (V0_0_NNN follow-up migration)
    (b) Document the term-to-term schema asymmetry on
        business-glossary if the column stays
    (c) Add a regression test pinning the read-path behaviour
