notes: |-
  This operation is the FIRST step in a collector's lifecycle per the
  custom-collectors developer guide (WebFetched 2026-05-20 status 200:
  "Register data sources with the Platform via POST /ingestion/datasources
  once at startup"). The doc page tells custom-collector authors to call
  this endpoint but does NOT specify: (a) the HTTP method semantics on
  re-registration (the platform UPSERTs by ODDRN — only `name` +
  `description` flow); (b) the response code (200 OK, NOT 201 Created —
  asymmetric with `POST /api/datasources` UI path which DOES return 201);
  (c) the empty-response-body contract; (d) the namespace inheritance;
  (e) the session-state requirement (the COLLECTOR_ID is bound to the
  WebSession for the connection's lifetime — clustered deployments
  without sticky sessions surface 500 on session loss).

  The S2S doc page recommends combining `auth.s2s.enabled` with
  `auth.ingestion.filter.enabled: true` but the `auth.ingestion.filter.enabled`
  property gates ONLY `/ingestion/entities`. It does NOT gate
  `/ingestion/datasources` — that path has its own always-on filter
  (`IngestionDataSourceFilter`). The asymmetry is invisible to operators
  reading the docs.
