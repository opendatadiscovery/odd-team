      the delete worked; the storage-reclamation half silently never happens.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |-
    When a large backlog of entities matures in the same window (e.g. 5,000
    entities with status_switch_time all elapsing within one hour), each tick
    processes a bounded batch so the job completes inside its 9-minute ShedLock
    window and the next tick is not skipped.
  derivation: |-
    Negative-space (a reasonable operator expectation that a scheduled reaper is
    burst-safe) + the getPojosForStatusSwitch query shape + the 9-minute lock
    window vs 10-minute cadence.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      getPojosForStatusSwitch returns ALL eligible pojos with NO LIMIT and the job
      collectList()s the entire set into one transaction
      (ReactiveDataEntityRepositoryImpl.md:concepts scheduled-batch-read +
      DataEntityStatusSwitchJob.java:26-30, source_read_for_validation — no .take(N),
      no chunking). Statically, a 5K-entity backlog × the 3-7-write soft-delete
      cascade per entity runs as a single bulk flip. Whether that EXCEEDS the
      9-minute lockAtMostFor window (releasing the lock and letting the next tick
      acquire / skip, producing phantom-double-tick latency) depends on real DB
      latency, cascade fan-out, and machine — it cannot be settled by reading. The
      no-cap STRUCTURE is confirmed; the timing OUTCOME requires running it. A probe
      skeleton (P-390, status pending-reflection-verification) is on disk to MEASURE
      a single 5K tick's wall-clock against the 540-second window.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: performance.known_performance_gaps.[2]
        cite: "ReactiveDataEntityRepositoryImpl.java:256-262 (no LIMIT) + DataEntityStatusSwitchJob.java:21-30 (no chunking)"
        note: "the sidecar flags 'potentially exceeding the 9-minute lock window' as MEDIUM but does not measure it"
      - sidecar: source_read_for_validation
        section: DataEntityStatusSwitchJob.run()
        cite: "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/job/DataEntityStatusSwitchJob.java:26-30"
        note: "collectList() on the full unbounded result — confirms no per-tick cap"
    operator_visible_failure: |-
      If a tick exceeds 9 minutes: the ShedLock releases before commit, the next
      10-minute tick may acquire mid-commit (undefined cross-instance state in a
      multi-replica deployment) or skip; auto-flip latency for the tail of a large
      backlog degrades unpredictably; and combined with H-002, the burst produces
      a wave of DELETED-forever rows. Severity is MEDIUM (latency + multi-instance
      race), not HIGH, because it requires a large synchronized backlog.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-044-1
    routes_to_finding: caveat-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: "probe P-390 (pending-reflection-verification)"

- id: H-005
  hypothesis: |-
    When an operator deletes a Data Entity Group with `propagate=true`, every
    member entity is also flipped to DELETED (the group delete cascades to its
    children).
  derivation: |-
    Endpoint shape (the `propagate` body flag) + updateStatus.md implicit ADR on
    DEG propagation.
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |-
      propagate=true IS honoured when the target is a DATA_ENTITY_GROUP:
      DataEntityServiceImpl.updateStatus fetches getDEGEntitiesOddrns(id) and
      applies the status to each member plus the parent (updateStatus.md:
      implicit_adrs.[5] + concepts.invariants). BUT (a) propagation is SINGLE-HOP —
      getDEGEntitiesOddrns is non-recursive, so a DEG-of-DEGs propagates only to
      immediate children, not transitively (updateStatus.md:
      bugs_limitations_corner_cases.[6]); and (b) propagate=true on a NON-group
      entity is SILENTLY IGNORED (no error, no signal). The "cascade" works at one
      level for groups only. COVERAGE: updateStatus.md:tests_coverage_semantic
      explicitly lists "Propagation path: no test exercises propagate=true on a
      DATA_ENTITY_GROUP" and "Group-vs-non-group propagation: no test confirms
      propagate=true on a non-group entity is silently ignored." Both sub-promises
      are unverified.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: implicit_adrs.[5] + bugs_limitations_corner_cases.[6] + tests_coverage_semantic.uncovered_behaviours
        cite: "DataEntityServiceImpl.java:468-476 (propagation branch) + :470 (getDEGEntitiesOddrns non-recursive) + :680-684 (needToPropagateStatus requires DATA_ENTITY_GROUP)"
        note: "honoured for groups, single-hop only, silently ignored for non-groups; entirely untested"
    operator_visible_failure: |-
      An operator deleting a nested group structure (DEG containing sub-DEGs)
      expecting the whole tree to retire gets only the top-level members — the
      grandchildren keep their prior status. An operator setting propagate=true on
      a plain dataset sees no effect and no warning that the flag did nothing.
      Both are silent semantic gaps (no UI / API signal). Severity MEDIUM.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # the unmet part — verify single-hop group propagation + silent-ignore on non-group

