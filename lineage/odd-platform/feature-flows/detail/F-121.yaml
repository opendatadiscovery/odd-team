    coverage: unverified
    test_demand: "functional (TEST-GAP pending mint): interrupt a holding replica mid-cycle; assert the shedlock row stays held until lockAtMostFor and no second replica acquires before then (pins the rolling-restart pause window)"
  - uc_id: F-121-UC-011
