behaviour: |-
  F-001 cross-tier integration test (UI mount to DB delta) — closes the inflation loop from UI clicks back to ranking. The Popular UI surface that displays the inflatable ranking is ALSO the surface that triggers view_count increments on click. A user clicks a Popular tile, SPA navigates to /dataentities/{id}/overview, the entity-detail page mounts, fetchDataEntityDetails fires, server-side incrementViewCount runs (per batch-F getDataEntityDetails sidecar implicit_adrs[2]), the entity's view_count rises, the next Popular refresh ranks it higher. The UI does not break this loop with debouncing, idempotency, per-session guard, or analytics-only mode. Already empirically probed by P-001 + P-004 (LSN-017 doubles the per-click delta). Promote those probes to a CI-permanent Playwright integration spec that runs E2E click-to-ranking-shift.
