notes: |-
  Cross-tier coupling that requires either UI hardening or backend
  documentation to be made safe under future refactors. The minimum-
  viable fix is option (b) — a one-line comment at the backend mapper
  + a one-line comment at the UI sortedResults — preserving the
  current behaviour and naming the dependency. The hardening fix is
  option (a) — defence in depth.
