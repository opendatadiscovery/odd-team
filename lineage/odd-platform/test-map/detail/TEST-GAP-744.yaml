proposed_action: |-
  Add `DatasetFieldDescriptionEditActivityFeedAndNotFoundContractTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods asserting the CORRECTED contract:
  1. `updateDescription_emitsDatasetFieldDescriptionUpdatedActivityEvent` — call `PUT /api/datasetfields/{id}/description`; query `SELECT COUNT(*) FROM activity WHERE event_type = 'DATASET_FIELD_DESCRIPTION_UPDATED' AND data_entity_id = ?`; assert returns 1. PIN the activity emission contract.
  2. `updateDescription_emitsDualActivityEventsWhenDescriptionContainsTermReferences` — call PUT with description containing `[[term-name]]` syntax; assert TWO activity rows: DATASET_FIELD_DESCRIPTION_UPDATED + DATASET_FIELD_TERM_ASSIGNMENT_UPDATED (per the batch-V dependencies_semantic.coupling[3] finding).
  3. `updateDescription_returns404OnMissingDatasetFieldId` — call PUT with `{id}` = 999999999; assert HTTP 404 (NotFoundException from the inner service). PIN the 404 contract.

  Pair with: (a) UPDATE F-004 detail file to reclassify the drift facets; (b) UPDATE concept-merger to remove DatasetField from the F-006 audit-silence class; (c) UPDATE TEST-GAP-666 + TEST-GAP-679 to add `superseded_by: TEST-GAP-744` notes OR allow the orchestrator to re-author them in place.

  Add a `// CORRECTION-PIN — Batch-V SUPERSEDES the prior batch-R claims that DATASET_FIELD_DESCRIPTION_UPDATED is never emitted and that updateDescription returns 200 OK on missing id. The corrected contract is: the event IS emitted (annotation lives at the inner service); the missing-id contract IS 404 (switchIfEmpty lives at the inner service). This test asserts the corrected contract.` comment block.
