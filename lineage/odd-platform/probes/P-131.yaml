realism_caveats: |
  The probe verifies the POSTURE (no owner-scoping / no exclude_from_search /
  no hollow filter at this code path) — it does NOT prejudge whether the
  posture is bug or feature. ODD's data catalog is intentionally cross-tenant
  for the namespace + data-source visibility model; relationships are
  presented as part of the same catalog. The finding is "the
  relationship-list endpoint does NOT apply the search-context filters
  that /api/dataentities applies" — the doc-drift question is whether
  the live data-modelling/relationships.md page mentions this asymmetry.
