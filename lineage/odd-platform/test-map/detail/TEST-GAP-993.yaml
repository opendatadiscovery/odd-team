behaviour: |-
  **`PUT /api/datasetfields/{id}/description` persists the description body VERBATIM into `dataset_field.internal_description` — including `<script>` / `<img onerror>` / `javascript:` payloads.** No sanitisation at any backend layer (controller has no validation; service has no `Jsoup.clean`; repository has no `Encode.html` — `ReactiveDatasetFieldRepositoryImpl.java:73-80` shows only empty-to-null normalisation at line 75). The platform's XSS defense is single-layered: UI-side render-layer at `Markdown.tsx` (probe P-009 covered) strips dangerous tags at DOM-render time.

  **F-004 verbatim-storage fingerprint at the column-level surface**:
  - **Entity-level sibling**: `ReactiveDataEntityRepositoryImpl.setInternalDescription` — same verbatim-storage pattern at the entity level (covered by F-004 batch-R coverage; the entity-level Markdown.tsx render is covered by P-009).
  - **Column-level surface**: the `DatasetField description tab` renders `dataset_field.internal_description` through the same Markdown component. Whether cross-tab Markdown.tsx coverage applies to DatasetField is UNVERIFIED per F-004 batch-R notes — there's a structural-test-coverage hole.

  **Operator-visible failure modes**:
  - A malicious user (or a compromised internal account) crafts a description carrying a raw `<img onerror>` cookie-exfiltration payload (literal held pre-disclosure under GHSA-mf43-2636-9289 / CTRIB-020). The payload persists in DB. Every other authenticated user viewing the field's description tab triggers the JavaScript (if Markdown.tsx doesn't strip it).
  - A maintainer refactoring Markdown.tsx (or replacing it with a new render pipeline) could accidentally drop the dangerous-tag stripping. With no backend defense, the entire column-description surface becomes a stored-XSS vector overnight.
  - Operators auditing log files would see the description column persists unsanitised content but no signal whether the UI render is safe.

  **Why HIGH**:
  - **Stored XSS at the platform's most-edited surface**: every operator-curated column description is a potential XSS vector if the UI defense slips.
  - **Defence-in-depth single-layer**: a sanitiser at the DB write boundary would protect against UI-render regression. The current design accepts this gap deliberately — the test gap is the regression-pin that converts "intentional design" into "deliberate test update".
  - **Cross-pillar amplification (P-01 × P-09)**: dataset-field metadata (P-01) intersects security (P-09); a maintainer auditing P-01 alone misses the security half.

  No test pins this — neither the verbatim-storage contract nor the UI-render defense intersection.
