surfaced_by:
  - "AppToolbar.md:security.known_security_gaps.[0] (Management/Alerts/Activity tabs rendered to ALL authenticated users regardless of permission set)"
  - "AppToolbar.md:bugs_limitations_corner_cases.[0] (Navigation tabs are rendered unconditionally with NO permission gating)"
  - "ToolbarTabs.md:tests_coverage_semantic.uncovered_behaviours.[5] (batch-ZJ — Every authenticated user regardless of Role / Permission / feature-flag state sees ALL 9 tabs — structurally unconditional visibility)"
  - "AppToolbar.md:bugs_limitations_corner_cases.[1] (batch-ZJ — Management tab visible to non-admin users; leaks the existence of an admin surface; backend authorization gates whatever they try to do)"
behaviour: |-
  **Tab-visibility-by-permission unit gap.** `ToolbarTabs.tsx:34-82` enumerates ALL nine top-level navigation tabs (Catalog / Directory / Data Quality / Data Modelling / Master Data / Management / Dictionary / Alerts / Activity) UNCONDITIONALLY with no `getGlobalPermissions` consumer. Every authenticated user sees the `Management` tab regardless of whether they hold any `*_MANAGE` permission. The downstream Management UI is permission-gated at the page level (`WithPermissionsProvider` wraps `<LookupTables>` etc.) but the TAB ITSELF is visible to anyone with a valid session. Even under `auth.type=DISABLED` every anonymous network caller sees the same 9 tabs including Management. No test asserts (a) the current state (all 9 tabs always rendered) NOR (b) the desired state (Management/Alerts/Activity hidden when the user holds no relevant permission). A regression that ADDS permission-gating to ToolbarTabs would break operator UX expectations without test signal; a regression that further LEAKS permission-coupled tab affordances would not be caught either. This is the UI-shell axis of the read-collaborative posture catalogued in `concepts/index.yaml` (REFACTOR-024 family) AND the load-bearing structural confirmation that role-based UI gating does NOT exist at the navigation entrypoint.
