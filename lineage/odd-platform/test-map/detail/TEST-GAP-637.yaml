proposed_action: |-
  Stand up `PolicyList.integration.test.tsx` (NEW file required — Vitest + React-Testing-Library + Testcontainers-backed Postgres OR a stubbed `policyApi` with a hand-crafted state mirroring the soft-delete drift). Test method `soft_deleted_policy_invisible_in_list_but_still_grants_via_role_binding` seeds: (a) a Role with id=42 bound to Policy id=99 via `role_to_policy`, (b) Policy 99 marked `deleted_at = now()`, (c) mount PolicyList and assert Policy 99 is NOT in the rendered rows, (d) invoke `getRolesPolicies([42])` and assert Policy 99 IS in the returned set. This pin freezes the differential render; the future fix (either filter GRANT path OR surface deleted policies in the list with an admonition) will break this test, forcing an intentional re-authoring.
