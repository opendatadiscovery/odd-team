- id: H-003
  hypothesis: "When an operator writes a value to a field typed INTEGER (or DATETIME, BOOLEAN, JSON, FLOAT), the platform validates the value matches the declared type and rejects 'not a number' on an INTEGER field with a 400."
  derivation: "The field carries a declared `type` from the 8-value MetadataTypeEnum and the UI renders a type-specific control (a true/false radio for BOOLEAN); a typed field promises type-checking of its values."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      formData.getValue() is a raw String written verbatim into the `text` column regardless of metadata_field.type. No coercion, no validation, no rejection. A user can write "not a number" to an INTEGER field, "hello" to a DATETIME field, "true" to a JSON field — all accepted with 200. The 8-value MetadataTypeEnum is documentation-only at write time. Note the UI's BOOLEAN type-control (true/false radio) constrains values FOR fields entered through that control, but the API enforces nothing, and the type can be changed/typed freely for new fields.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityMetadataFieldValue
        section: bugs_limitations_corner_cases[2]
        cite: "DataEntityServiceImpl.java:292-295 + MetadataTypeEnum.java:3-12 + V0_0_1__init.sql:179 (value text)"
        note: "only value extracted; never compared against field type"
    operator_visible_failure: |
      Downstream readers (a BI tool joining on a metadata value, a script doing Long.parseLong on an INTEGER-typed field, a chart casting a DATETIME) crash or silently mis-render on type-violating content the platform accepted. The catalog's typed-metadata promise is cosmetic — a STRING field and an INTEGER field behave identically at write time. An API consumer cannot trust the declared type as a contract.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
