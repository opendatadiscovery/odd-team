proposed_action: |-
  Vitest tests mounting HierarchyLineage under <MemoryRouter initialEntries={['/dataentities/1/lineage?d=10000']}>. Spy on the lineage thunk; assert it is called with depth=20 (after clamp lands) OR depth=10000 (current behaviour). Documents the gap; promotes to a regression-pin once the clamp lands.
