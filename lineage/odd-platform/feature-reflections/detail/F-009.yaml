        note: "case-sensitive lowercase 'smtp' check; uppercase SMTP disables AUTH+STARTTLS"
    operator_visible_failure: |
      An operator copying a Gmail example with uppercase SMTP gets a connection that either
      fails plaintext or — worse — sends SMTP AUTH credentials in the clear (no STARTTLS) to
      the relay, with no warning at boot and no log line. They discover the misconfiguration
      only after the first failed/insecure delivery. NOTE: the live doc (WebFetched 2026-06-01)
      has been FIXED — it now explicitly warns "The `protocol` value must be lowercase `smtp` —
      `SMTP` silently disables AUTH and STARTTLS". So the doc-vs-code drift is CLOSED; the
      brittle case-sensitive code remains (a one-line `.equalsIgnoreCase` would harden it).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-010
  hypothesis: "When an alert is delivered by email, the email shows the same information the docs say notifications carry — including the attached owners and the affected downstream entities."
  derivation: "Doc-claim seed: the live notifications page states all outbound notifications carry entity name, data source/namespace, owners, and downstream entities; the operator expects channel parity."
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      The email template model omits BOTH owners and downstream entities. getEmailContent
      populates a nine-field model HashMap (dataEntityId, dataEntityName, dataSourceName,
      namespaceName, dataEntityType, link, alertType, alertDescription, eventAtTime) and the
      email.ftlh template (verified at templates/email.ftlh:1-46) has no <#list owners> and no
      <#list downstream> block. The AlertNotificationMessage DOES carry owners
      (AlertNotificationMessage.java:36) and downstream (line 30) — both are populated by the
      translator and BOTH are rendered by Slack (SlackMessageGenerator) — but neither is read
      by the email template. The live doc (2026-06-01) still lists owners + downstream as
      carried by "all outbound notifications" without differentiating email.
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__EmailNotificationSender.md
        section: docs_link_semantic.doc_drift_findings[0] + [1]
        cite: "EmailNotificationSender.java:64-78 + templates/email.ftlh:1-46"
        note: "nine-field model; no owners, no downstream in the template"
      - sidecar: odd-platform__java__notification__sender__class__SlackNotificationSender.md
        section: docs_link_semantic.inferred_docs[0].fetched_excerpts
        cite: "SlackMessageGenerator.java:128-140"
        note: "Slack DOES render owners + downstream — the parity the doc implies holds for Slack only"
    operator_visible_failure: |
      An operator who reads the docs and builds an email-only runbook ("the alert email tells
      you who owns the entity and what's downstream") is misled — the email omits both. During
      an incident, an on-call engineer reading the email cannot see the owner to escalate to or
      the downstream blast radius; they must open the ODD UI (the deep-link) to get what Slack
      users see inline. This is a doc-vs-code contradiction (the doc over-promises email) AND a
      feature gap (email is strictly less useful than Slack). Routes to doc-gap (fix the doc to
      say email omits owners+downstream) and a caveat/enhancement (add them to the template).
