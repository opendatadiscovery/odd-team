      `default_off_unauthenticated_ingestion_at_filter_layer`). Under
      this default, `POST /ingestion/entities` is anonymously
      reachable regardless of the token value (the filter is not
      registered as a bean per `@ConditionalOnProperty matchIfMissing=false`).
