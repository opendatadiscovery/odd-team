#   - AuthorizationManagerCondition @ConditionalOnProperty(auth.type=OAUTH2) @L11
#   - CounterTimeSeriesExtractor @ConditionalOnProperty(metrics.storage=PROMETHEUS) @L20
#   - IngestionDataEntitiesFilter @ConditionalOnProperty(auth.ingestion.filter.enabled=true) @L20
#   - ActivityTablePartitionManager @Value("odd.activity.partition-period:30") @L11
#
# Batch 2026-05-12C added 5 sidecars — 4 `*SecurityConfiguration` classes
# (one per auth mode) plus a new NotificationsProperties config-properties-class:
#   - DisabledAuthSecurityConfiguration @ConditionalOnProperty(auth.type=DISABLED) @L10
#   - LoginFormSecurityConfiguration @ConditionalOnProperty(auth.type=LOGIN_FORM) @L31 (VALIDATES REFACTOR-073)
#   - OAuthSecurityConfiguration @ConditionalOnProperty(auth.type=OAUTH2) @L71
#   - LDAPSecurityConfiguration @ConditionalOnProperty(auth.type=LDAP) @L51
#   - NotificationsProperties — Notifications subsystem (off-by-default; per-channel URL-presence activation)
#
# Batch 2026-05-12F adds 5 controller-method sidecars covering the DataEntity
# primary surface (centerpiece read, ownership, status, lineage) + the
# canonical S2S ingestion entry point — closing the S2S loop opened by
# IngestionDataEntitiesFilter in batch B:
#   - DataEntityController.getDataEntityDetails — `GET /api/dataentities/{id}`.
#     Single hottest read on the platform. Intentionally outside SECURITY_RULES
#     (RESOLVES ADR-CANDIDATE-003 borderline_flag — confirmed deliberate
#     read-collaborative posture on the centerpiece read). Side-effecting
#     `view_count` increment makes the GET a write at the DB layer. ~10 DB
#     round-trips per call, no caching, no ETag, unbounded `entities[]`
#     lineage-shortcut arrays in response. **Cross-owner full-payload
#     exposure on the centerpiece read** — widest blast radius of the
#     read-collaborative family.
#   - DataEntityController.createOwnership — `POST /api/dataentities/{id}/ownership`.
#     SECURITY_RULES-gated (`DATA_ENTITY_OWNERSHIP_CREATE` per-data-entity).
#     **STRUCTURAL PERMISSION-BYPASS**: `OwnerService.getOrCreate(owner_name)`
#     and `TitleService.getOrCreate(title_name)` auto-instantiate directory rows
#     when the name is novel — a 2nd write path into Owner directory that
#     BYPASSES `OWNER_CREATE` permission entirely. Title is free text (no
#     allowlist). Self-grant ambiguity (caller can mint owner + bind to entity
#     without ownership claim). Activity-feed emission CONFIRMED (`@ActivityLog`
#     OWNERSHIP_CREATED) — contrast with OwnerController.createOwner which has
#     NONE.
#   - DataEntityController.updateStatus — `PUT /api/dataentities/{id}/statuses`.
#     **HIGH severity ordering bug**: `DataEntityMapperImpl.applyStatus` sets
#     `pojo.setStatus(...)` BEFORE the `if (statusDto.getId() != pojo.getStatus())`
#     check — condition is always false → `statusUpdatedAt` NEVER bumped on
#     status transition → 30-day housekeeping TTL broken (the
#     `DataEntityHousekeepingJob` query depends on `STATUS_UPDATED_AT`).
#     Cross-batch validation with batch-D `HousekeepingTTLProperties`. **POSITIVE
#     FINDING**: audit-log emission CONFIRMED (programmatic `logStatusChangeEvents`
#     in DataEntityInternalStateServiceImpl.java:164-169, not AOP `@ActivityLog`)
#     — REFINES batch-E `no-audit-log-on-mutations` 3-sidecar theme: NOT
#     codebase-wide; specifically RBAC mutations (Policy/Role/Owner), NOT
#     DataEntity mutations.
#   - DataEntityController.getDataEntityDownstreamLineage — `GET /api/dataentities/{id}/lineage/downstream`.
#     Single-query recursive-CTE traversal (Postgres `WITH RECURSIVE`). Dual
#     client-driven inputs: `lineage_depth` + `expanded_entity_ids`. **HIGH
#     severity bugs**: null-Integer NPE on missing `lineage_depth` (`Integer`
#     autoboxes to primitive `int` at the service boundary; docs claim
#     "Unset returns the platform's default depth" — UNIMPLEMENTED); no
#     `@Max(...)` cap on depth (depth=10000 against a dense graph is permitted
#     → DoS-amplification vector); no CTE cycle guard (diamond DAGs
#     amplify intermediate rows). **Cross-owner graph enumeration vector** —
#     wider than alerts/activity/search because lineage edges leak causal
#     connections across owner boundaries even when individual entities are
#     not separately enumerable.
#   - IngestionController.postDataEntityList — `POST /ingestion/entities`.
#     **CLOSES THE S2S LOOP** (2-sidecar with batch-B `IngestionDataEntitiesFilter`):
#     default-off unauth at CONTROLLER side confirmed — no `@PreAuthorize`,
#     authentication delegated EXCLUSIVELY to the `IngestionDataEntitiesFilter`
#     filter which is `@ConditionalOnProperty(name="auth.ingestion.filter.enabled",
#     havingValue="true")` and DEFAULTS to false. Bundled deployment ships
#     `/ingestion/entities` UNAUTHENTICATED. Datasource scoping is
#     payload-driven (the caller chooses `data_source_oddrn` in the body).
#     **MAJOR DOC-DRIFT**: live S2S doc example uses `X-API-Key` header (the
#     global `S2sAuthenticationFilter` admin-everywhere credential), but
#     `IngestionDataEntitiesFilter` requires `Authorization: Bearer <token>`
#     (path-scoped per-datasource token) — operator copy-paste-from-docs
#     verbatim succeeds against one filter, fails against the other. No
#     canonical doc page exists for `POST /ingestion/entities` itself
#     (configuration-and-deployment/data-ingestion → 404). OpenAPI declares
#     201, controller returns 200 — 2-sidecar status-code drift with
#     OwnerController.createOwner.
#
# CRITICAL CROSS-BATCH TRIANGULATIONS reached / strengthened in batch F:
#
# - **Read-collaborative cross-owner enumeration** — now 5-SIDECAR triangulated:
#   getAllAlerts (A) + getActivity (B) + search (E) + getDataEntityDownstreamLineage (F)
#   + getDataEntityDetails (F). The DataEntityDetails sidecar is the CENTERPIECE
#   read — the widest single blast radius. STRENGTHENS the existing invariant
#   to a load-bearing CROSS-CUTTING posture.
#
# - **DISABLED-mode bypasses SECURITY_RULES** — now 11-SIDECAR triangulated
#   (8 carried from batches B/C/E + 3 new from batch F: getDataEntityDetails +
#   createOwnership + updateStatus). The Auth Mode (DISABLED branch) is the
#   dominant load-bearing weakness across the entire platform surface.
#
# - **Permission-bypass via Owner auto-create (NEW INVARIANT, batch F)** —
#   createOwnership auto-instantiates Owner + Title rows without checking
#   OWNER_CREATE / TITLE_CREATE-equivalent permissions. The documented
#   `OWNER_CREATE` permission gate on `POST /api/owners` is incomplete —
#   any caller with `DATA_ENTITY_OWNERSHIP_CREATE` on any data entity can
#   mint Owner directory entries via this side-door. New codebase-wide
#   invariant; analog risk on any future auto-create-on-missing semantics.
#
# - **TTL retention broken by statusUpdatedAt nullification (NEW INVARIANT,
#   cross-batch finding D + F)** — batch D's HousekeepingTTLProperties +
#   batch F's updateStatus combine to surface a NEW cross-batch defect:
#   the 30-day data-entity-delete retention TTL relies on
#   `DATA_ENTITY.STATUS_UPDATED_AT`, which is NEVER bumped on status transition
#   because of an ordering bug in `DataEntityMapperImpl.applyStatus` (sets
#   the status BEFORE the prior-status check). The HousekeepingTTLProperties
#   feature documentation says 30-day retention; the code does not deliver it.
#   Two-sidecar emerges only when both sides exist (each individual sidecar
#   surfaces a partial finding; the cross-batch view is the load-bearing one).
#
# - **Audit-log presence asymmetry (REFINEMENT of batch-E theme, batch F)** —
#   batch E's "no-audit-log-on-mutations" 3-sidecar theme (Role + Policy +
#   Owner) refined: NOT codebase-wide. **RBAC mutations** (Policy / Role /
#   Owner) carry no audit signal. **DataEntity mutations** (updateStatus,
#   createOwnership) DO emit audit signals — programmatic
#   `logStatusChangeEvents` (DataEntityInternalStateServiceImpl) and
#   `@ActivityLog(OWNERSHIP_CREATED)` (OwnershipServiceImpl) respectively.
#   The codebase has a 2-TIER AUDIT STORY:
#     Tier 1 (audited): DataEntity-scoped mutations (status / ownership /
#                       description / business-name / tags / terms / metadata /
#                       alert-config / DataEntityGroup membership).
#     Tier 2 (unaudited): RBAC-scoped mutations (Policy / Role / Owner).
#   The asymmetry is invariant-shaped: the platform DOES capture activity for
#   data-content changes but NOT for authorization-model changes — the
#   inverse of what a security-conscious operator would expect.
#
# - **OpenAPI status-code drift** — now 2-SIDECAR (OwnerController.createOwner
#   batch E + IngestionController.postDataEntityList batch F). Both endpoints
#   declare `201 Created` in the spec, return `200 OK` in code. The
#   `BaseIngestionTest` locks in the 200, so the test suite enforces the
#   drift. Strengthen as cross-cutting hygiene REFACTOR candidate.
#
# - **Doc-vs-code spelling/format mismatch** — now 2-SIDECAR (OAuth2
#   `username-attribute` (docs) vs `userNameAttribute` (POJO) batch D +
#   S2S `X-API-Key` (docs example) vs `Authorization: Bearer` (code
#   IngestionDataEntitiesFilter) batch F). Both are "operator copy-paste
#   from docs silently fails to work" failures. Strengthen as cross-cutting
#   doc-drift invariant.
#
# - **ADR-CANDIDATE-003 borderline_flag RESOLVED** — getDataEntityDetails
#   primary-source confirms intentional read-collaborative posture on the
#   CENTERPIECE read (the single hottest endpoint, deliberately outside
#   SECURITY_RULES, consistent with 27+ other GETs on the same controller).
#   Promoted from "borderline_flag for human review" to a STABLE
#   read-collaborative-by-design posture. The doc-gap is that the live
#   `/configuration-and-deployment/enable-security/authorization` page
#   does NOT name this stance; the gap is doc-side, not code-side.
#
# Batch 2026-05-12E adds 5 controller-method sidecars covering the RBAC
# administration surface + a NEW search-area controller:
#   - RoleController.createRole — POST /api/roles, SECURITY_RULES-gated
#     (ROLE_CREATE NO_CONTEXT). Surfaces a NEW codebase-wide invariant:
#     Administrator-name reservation asymmetry — `update` + `delete` check
#     `UserProviderRole.values()` to reject mutations against the seeded
#     predefined names, but `create` does NOT. If the seeded Administrator
#     row is hard-deleted, this endpoint can re-create one with
#     attacker-chosen policy bindings.
#   - PolicyController.createPolicy — POST /api/policies, SECURITY_RULES-gated
#     (POLICY_CREATE MANAGEMENT-tier). SAME Administrator-name reservation
#     asymmetry as RoleController (PolicyServiceImpl.java:76, 87 vs
#     PolicyServiceImpl.java:62-69). NO anti-elevation guard —
#     `{resource: {type: MANAGEMENT}, permissions: [ALL]}` is a legal
#     policy shape identical to the seeded Administrator.
#   - OwnerController.createOwner — POST /api/owners, SECURITY_RULES-gated
#     (OWNER_CREATE NO_CONTEXT). Confirms the **identity-decoupled directory
#     CRUD** invariant: no auth-flow (LDAP / OAUTH2 / LOGIN_FORM) calls
#     `OwnerService.create` on first login — operators must MANUALLY pre-create
#     per-user Owner rows. `getOrCreate` exists but is invoked ONLY by
#     `OwnerAssociationRequestServiceImpl.createOwnerAssociationRequest`
#     (the user-claim flow), never on auto-creation. Also: `name UNIQUE` on
#     `owner` is non-partial — soft-deleted rows permanently block re-creation
#     under the same name (V0_0_1__init.sql vs V0_0_89__update_user_owner.sql
#     which DID get a partial-unique migration applied elsewhere). OpenAPI 201
#     vs impl 200 drift (same shape as POST /api/roles).
#   - PermissionController.getResourcePermissions — GET /api/resource/{type}/{id}/permissions,
#     `.authenticated()` fall-through (no SECURITY_RULES entry). The
#     CANONICAL read-side of the platform's authorization model: same
#     `PermissionService` + same `ContextualPermissionExtractor` graph the
#     mutation enforcer uses. Authoritative-not-UI-hint by design (a forged
#     response would not bypass mutation enforcement). BUT two HIGH
#     auth-mode-bypass findings: (a) under `auth.type=DISABLED` the endpoint
#     returns an empty permission set while mutation endpoints accept any
#     caller (UI says 'you can do nothing'; API says 'anyone can do
#     anything' — silent contradiction); (b) under `auth.type=LOGIN_FORM`
#     EVERY caller is admin (static `getAuthorities(true)` at
#     LoginFormSecurityConfiguration.java:74-82), so the endpoint always
#     returns the FULL permission set regardless of UI-configured policies.
#   - SearchController.search — NEW search area. POST /api/search creates a
#     server-side `search_facets` row (session-as-server-state) and returns
#     facet counts + a UUID; sibling GET /api/search/{search_id}/results
#     returns paginated `DataEntityList` rows. NO SECURITY_RULES entry,
#     `.authenticated()` only, OWNER-BYPASS by default — any authenticated
#     user can paginate the entire catalog (REFACTOR-024-shape with wider
#     blast radius). Postgres `to_tsquery(?)` syntax-error vector via
#     `JooqFTSHelper.tsQuery` (split on space + append `:*` + join with `&` —
#     a query like `foo!bar` becomes malformed tsquery). `search_facets`
#     persists user query text verbatim — PII concern at the 30-day
#     housekeeping floor.
#
# CRITICAL CROSS-CUTTING FINDINGS triangulated by batch E (3+ independent sidecars):
#
# - **DISABLED-mode bypasses SECURITY_RULES** — now 8-sidecar triangulated:
#   batch C: AppInfoController@L18 + AuthorizationManagerCondition@L11 +
#   DisabledAuthSecurityConfiguration@L10 + IngestionDataEntitiesFilter@L20
#   (4 sidecars).
#   batch E: PolicyController.createPolicy + RoleController.createRole +
#   OwnerController.createOwner + PermissionController.getResourcePermissions
#   (4 more sidecars). The Auth Mode (DISABLED branch) security_aggregate
#   reflects this as the dominant weakness — RBAC primary-surface
#   endpoints are reachable unauthenticated, and the read-side permission
#   discovery endpoint contradicts the actual mutation posture.
#
# - **LOGIN_FORM ADMIN-for-all bypass** — now 3-sidecar triangulated:
#   LoginFormSecurityConfiguration@L31 (batch C — `getAuthorities(true)` at
#   line 81 hard-codes admin) + RoleController.createRole (batch E — admin
#   sees full RBAC mutation surface) + PermissionController.getResourcePermissions
#   (batch E — endpoint returns full permission set for every caller in
#   LOGIN_FORM mode regardless of UI-configured policies). The
#   Auth Mode (LOGIN_FORM branch) security_aggregate weakness now carries
#   the read-side corroboration.
#
# - **Administrator-name reservation asymmetry (NEW INVARIANT, batch E)** —
#   2-sidecar primary-source: RoleController.createRole + PolicyController.createPolicy.
#   In both `update` + `delete` paths the service explicitly rejects mutations
#   against the seeded `Administrator` name (RoleServiceImpl.java:67-69 +
#   81-84; PolicyServiceImpl.java:76, 87). In the `create` path NEITHER
#   service checks. The only thing protecting the reserved name on creation
#   is the partial-unique DB index (which depends on the seeded row still
#   existing). Codebase-wide CRUD-defensive asymmetry pattern. NEW
#   cross-cutting invariant.
#
# - **Read-collaborative cross-owner enumeration** — now 3-sidecar
#   triangulated: getAllAlerts (A) + getActivity (B) + search (E). The
#   search surface is the WIDEST: the entire catalog is paginate-able by
#   any authenticated user with no owner predicate (REFACTOR-024 shape).
#   Strengthened on the existing Owner-link concept + ADR-CANDIDATE-003.
#
# - **Legacy-vs-canonical GitBook IA drift** — now 3-sidecar (3 distinct
#   doc-page 404s with canonical 200 siblings): data-collaboration (A) +
#   notifications (C) + search-related (E — search lives at
#   `features/data-discovery/search` 200 while no `/active-platform-features/search`
#   exists; the batch E sidecar verified this specifically as a NEGATIVE
#   result, completing the index-link-rot observation across THREE
#   parallel feature surfaces).
#
# - **No-audit-log-on-RBAC-mutations (NEW INVARIANT, batch E)** —
#   3-sidecar: RoleController.createRole + PolicyController.createPolicy +
#   OwnerController.createOwner. None of `RoleServiceImpl.create`,
#   `PolicyServiceImpl.create`, `OwnerServiceImpl.create` emit
#   `@Slf4j` log lines, publish events, or insert into any audit table.
#   `OwnerServiceImpl.create` is also missing `@ActivityLog` (verified
#   by grep — only AlertHaltConfig / AlertService / DataEntityInternalState /
#   DataEntity / DataEntityGroup carry it). A hijacked admin or any S2S
#   API-key holder can rewrite the authorization model invisibly. The
#   activity feed (`/api/activity` per batch A getActivity) does NOT
#   cover Role / Policy / Permission / Owner mutations. NEW cross-cutting
#   hygiene invariant.
#
# Batch 2026-05-12D adds 5 config-properties-class sidecars deepening per-mode
# and per-feature config surfaces — and DELIBERATELY triangulating earlier
# claims from a second angle:
#   - ODDOAuth2Properties — OAUTH2 mode config POJO. Validates 3 batch-C claims
#     (Provider enum 5-vs-7-docs gap; azureTenantId field missing from POJO;
