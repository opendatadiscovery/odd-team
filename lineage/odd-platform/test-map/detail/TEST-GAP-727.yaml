proposed_action: |-
  Add `ReactiveTermSearchEntrypointRepositoryImplTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/term/`. Eight test methods (one per repository method + one for the delete-cascade):
  1. `termServiceImplDelete_leavesStaleVectorRowInTermSearchEntrypointTable_pinsCurrentBug` — call `TermServiceImpl.delete(termId)`; assert `SELECT COUNT(*) FROM term_search_entrypoint WHERE term_id = ?` returns 1 (the dangling row). PIN the bug. Pair with the maintainer note that this should return 0 post-fix.
  2. `updateTermVectors_writesTermVectorColumnOnly_assertsAggFlagFalse` — exercise the agg=false path; assert only the `term_vector` column is non-empty.
  3. `updateChangedNamespaceVector_fansOutToAllTermsInNamespace_assertsRowCount` — pin the fan-out behaviour.
  4. `updateTagVectorsForTerm_aggregatesAcrossNTags_assertsTsvectorAggCorrectness` — exercise the agg=true path against the custom `tsvector_agg` aggregate.
  5. `updateChangedOwnershipVectors_walksOwnerNameAndTitleName_assertsCombinedVector` — pin ownership-vector materialisation.
  6. `updateChangedTagVectors_softDeletedTagStillContributes_assertsCurrentBug` — pin the absent `tag.deleted_at` filter (sidecar bug #3, MEDIUM).
  7. `updateChangedOwnershipVectors_softDeletedOwnershipStillContributes_assertsCurrentBug` — pin the absent `term_ownership.deleted_at` filter (sidecar bug #2, MEDIUM).
  8. `updateNamespaceVectorsForTerm_writesNamespaceVectorColumnOnly_assertsAggFalseAndScope` — exercise the per-term namespace-vector update path.

  Pair with a follow-up backlog item proposing the fix: add a `clearVectorsForTerm(termId)` method on the interface + impl, called from `TermServiceImpl.delete` BEFORE the soft-delete. When the fix lands, test #1 inverts to assert 0 rows.

  Use the Testcontainers / R2DBC test-container pattern already established in `LineageRepositoryTest`, `OwnershipRepositoryImplTest`, etc. (per batch-H repository-layer test patterns).
