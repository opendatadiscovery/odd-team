      - "odd-platform java AttachmentServiceImpl config-key-consumer:attachment.max-file-size@L27"
      - "odd-platform yaml application.yml config-prefix:attachment"
      - "odd-platform java DataEntityAttachmentController controller-method:uploadFileChunk"
    contributors:
      - "DataEntityAttachmentController: entities[DataEntityAttachments, DataEntityFile, DataEntityLink, DataEntityUpload, uploadId]"
      - "AttachmentServiceImpl@L27: entities[DataEntityUploadOptions, DataEntityFile, attachment upload session]"
      - "attachment config-prefix: entities[attachment storage backend, S3-compatible bucket, local filesystem path, attachment upload session, attachment file size cap]"
      - "uploadFileChunk: entities[uploadId, index, Part, dataEntityId]; operations[parse-chunk-index, delegate-chunk-upload, lift-to-200-ok]; invariants[uploadId is authoritative session key, dataEntityId cosmetic at chunk-upload]"
    evidence:
      - "DataEntityAttachmentController.md:concepts.entities.[DataEntityAttachments]"
      - "AttachmentServiceImpl@L27.md:concepts.entities.[DataEntityUploadOptions]"
      - "attachment-config-prefix.md:concepts.entities.[attachment storage backend, S3-compatible bucket]"
