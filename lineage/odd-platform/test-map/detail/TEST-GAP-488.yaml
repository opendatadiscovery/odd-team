behaviour: |-
  DEG write-collaborative regression-pin (CRITICAL — DATA_ENTITY_ADD_TO_GROUP holder writes into stranger's DEG). The SecurityRule at SecurityConstants.java:228-231 registers the path matcher on `/api/dataentities/{data_entity_id}/data_entity_group` POST with AuthorizationManagerType.DATA_ENTITY. URLResourceExtractor pulls `data_entity_id` (the CHILD) from the path; DataEntityPermissionExtractor evaluates the caller's DATA_ENTITY_ADD_TO_GROUP Policies against THAT child's resolver context. The TARGET DEG id (`data_entity_group_id`) lives in the REQUEST BODY and has NO authorization check at any layer of controller -> service -> repository. PolicyPermissionDto.java:22 confirms `DATA_ENTITY_ADD_TO_GROUP(DATA_ENTITY)` — the scope is DATA_ENTITY (per-child-entity), NOT DATA_ENTITY_GROUP. Net effect: a caller with DATA_ENTITY_ADD_TO_GROUP on entity X (typically granted via `is: dataEntity:owner` to every owner) can place X into ANY manually-created DEG in the catalog — including the Administrators-only 'Critical Systems' domain, Finance Domain, or any DEG curated by another team. The DEG owner has no veto. The cross-pillar P-01 implication: the Catalog Overview's Domain tiles can be polluted from the outside. The cross-pillar P-09 implication: the read-collaborative posture combines with the no-DEG-side-gate to produce a write-collaborative DEG surface — every DATA_ENTITY_ADD_TO_GROUP holder writes into any DEG. Operators cannot defend the DEG without revoking the permission from every owner. The Permissions doc text (live 2026-05-19, status 200) 'Allows adding a data entity to a manually created group' is silent on which side is gated. CRITICAL because (a) security boundary mismatch between operator mental model and enforcement, (b) no tests pin the design intent (a future refactor adding DEG-side checks would be unable to validate), (c) cross-pillar — combines P-01 Discovery surface (Domain pollution) with P-09 Authorization model (resource-boundary asymmetry). Test would be a WebFluxTest WITH @WithMockUser holding ONLY child-side Policy for entity X but NO DEG-side Policy on Domain Y; assert HTTP 200 (current contract), with a comment noting the brittle contract that should fail-loud as 403 when DEG-side gating lands.
