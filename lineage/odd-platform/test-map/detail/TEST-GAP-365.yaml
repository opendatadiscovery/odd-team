behaviour: 'AlertManager webhook entity_oddrn spoof — `handleExternalAlerts` (line 178) reads
  `externalAlert.getLabels().get("entity_oddrn")` and assigns it verbatim to `setDataEntityOddrn`
  with no validation against the calling principal or the data-entity registry. Combined
  with the unauthenticated `/ingestion/alert/alertmanager` endpoint (per AlertManagerController
  neighbour sidecar), any caller with network reach can POST AlertManager-shaped payloads
  naming arbitrary data-entity ODDRNs and create DISTRIBUTION_ANOMALY alerts on entities
  they have no business altering. Distinct from the WEBHOOK AUTH-GATING gap (TEST-GAP-363
  at the repository tier) — this is the SPOOF angle at the service layer.'
test_class: missing-security
