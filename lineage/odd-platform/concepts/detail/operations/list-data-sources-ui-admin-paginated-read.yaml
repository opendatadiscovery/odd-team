name: List Data Sources (UI admin path — paginated catalog read, no permission gate)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  NEW OPERATION, batch 2026-05-21ZB — surfaced at primary source by
  the getDataSourceList method-level sidecar. GET
  /api/datasources?page=&size=&query= is the single read/list endpoint
  of the Management → Datasources tab — the fifth UI-admin DataSource
  endpoint (register / update / delete / regenerate-token were the
  prior four write operations; this is the READ).

  THE OPERATION — what GET /api/datasources does:

    The controller handler (DataSourceController.java:21-28) is a
    3-line proxy: forward the three OpenAPI-generated parameters
    (page, size, optional query) to dataSourceService.list(page, size,
    query), wrap the reactive result in ResponseEntity.ok (HTTP 200).
    The chain is DataSourceServiceImpl.list → ReactiveDataSourceRepositoryImpl.listDto
    → DataSourceMapper.mapDtoPage. The SQL is a CTE
    (`data_source_cte`: a paginated `SELECT FROM data_source WHERE
    deleted_at IS NULL [+ startsWithIgnoreCase]`) + 2 LEFT JOINs
    against NAMESPACE and TOKEN. The list is ordered `data_source.id
    ASC` (creation order) via the default 3-arg paginate overload.
    The path is NOT inside an explicit transaction (DataSourceServiceImpl.list
    is NOT @ReactiveTransactional — read-only).

  AUTHORIZATION — THE LOAD-BEARING FACT: GET /api/datasources has NO
  entry in SecurityConstants.SECURITY_RULES (Grep-confirmed — only
  POST/PUT/DELETE on /api/datasources* are at SecurityConstants.java:116-126).
  Under LOGIN_FORM/OAUTH2/LDAP the request falls through to the
  catch-all `pathMatchers('/**').authenticated()` — ANY authenticated
  user lists the entire catalogue, no permission, no owner scope. This
  is the read-collaborative posture (mutations gated, reads open). Under
  auth.type=DISABLED the endpoint is fully open with no principal.

  KEY FACTS:
    - The list DOES carry a token object per item, but the LIST path
      builds the 1-arg `new TokenDto(tokenPojo)` (showToken=false) so
      TokenMapper.mapValue returns the MASKED form `"******" + the
      real last 6 plaintext chars` — API-side masking, NOT UI-side.
      register/regenerate return PLAINTEXT (showToken=true). See the
      collector-token entity for the resolved redaction-layer finding.
    - Soft-deleted data sources are universally excluded (queryCondition
      always adds `DATA_SOURCE.DELETED_AT.isNull()`).
    - The `query` parameter is name-PREFIX-only on the page query but
      name-SUBSTRING on the empty-page count — the REFACTOR-425
      divergence; see the dedicated invariant.
    - `size` has NO upper bound (the OpenAPI SizeParam declares no
      `maximum`) — a caller can request the whole catalogue (incl. 2
      LEFT JOINs) in one query; an unbounded-response surface.
    - The list emits NO Activity Event (normal for a read endpoint,
      noted for completeness vs the data_source audit gap).

  DISTINCT FROM the S2S ingestion path — there is no S2S
  data-source-LIST endpoint; collectors register/update via
  IngestionController.createDataSourceEntity and never list.
