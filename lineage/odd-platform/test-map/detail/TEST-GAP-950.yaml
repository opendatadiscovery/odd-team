behaviour: |-
  **Cross-auth-mode reachability of GET /api/features/active is undocumented
  and unpinned — under auth.type=DISABLED the endpoint is anonymously
  reachable (PROVIDER-NULL-BLEED-LIMITED-RISK facet of REFACTOR-185),
  under LOGIN_FORM / OAUTH2 / LDAP it requires authentication but no role
  gate.** The asymmetry across modes is the operator-visible contract,
  and no test pins it. The defence-in-depth assertion against accidental
  WHITELIST_PATHS or LoginFormSecurityConfiguration.permittedPaths
  additions is critical: a future change that adds `/api/features/active`
  to WHITELIST (e.g. to support a pre-login feature-toggle exposing SSO
  buttons) would silently lower the auth bar with no regression-pin
  catching the shift.

  Today's facts:
  - DISABLED (bundled default at application.yml:34): 200 OK to any
  anonymous caller (DisabledAuthSecurityConfiguration.java:13-18
  `.anyExchange().permitAll()`);
  - LOGIN_FORM: 302 to /login for unauth callers
  (LoginFormSecurityConfiguration.java:55-57 +
  AuthorizationCustomizer.java:29-30; /api/features/active NOT in
  WHITELIST at SecurityConstants.java:95-96);
  - OAUTH2 / LDAP: 401 or 302 to OAuth provider (same fallthrough);
  - All four modes: 200 OK to ANY authenticated user regardless of role.
  No per-role gate; the FeatureList is intentionally not role-scoped.

  The PROVIDER-NULL-BLEED facet (DISABLED-anonymous): the payload is
  operator-policy-configurable booleans — narrower than IdentityController
  (admin principal fabrication) and IntegrationController (internal
  hostname leak) but real. An external scanner can fingerprint whether
  the operator has activated DataCollaboration and/or Notifications.
