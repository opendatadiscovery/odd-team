security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: NO SECURITY_RULES entry — falls through to `pathMatchers('/**').authenticated()`
      catch-all (AuthorizationCustomizer.java:29-30). No `@PreAuthorize`, no programmatic
      permission check. Read-collaborative-GET ADR-CANDIDATE-003 posture surfaced
      on a graph-shaped vector. Under `auth.type=DISABLED`, anonymously reachable.
  owner_scoping:
    verdict: BYPASSES
    detail: Returned graph is NOT filtered by caller's owner relationships. The `lineage`
      table itself carries NO owner column; `LineageServiceImpl.getLineage(...)` performs
      no per-row owner check (lines 87-122); repository walk filters only by `LINEAGE.IS_DELETED.isFalse()`.
      Authenticated caller sees every entity reachable from the root via lineage edges,
      including entities owned by other teams.
  strengths:
  - Single-query recursive-CTE traversal — one DB round-trip, not BFS-per-node (efficient
    at the query layer)
  - Client-driven progressive-expansion model — UI can ask for shallow tree first
    then expand on click, bounding initial response size
  weaknesses:
  - '**Graph-shaped cross-owner enumeration vector (HIGH)** — lineage edges encode
    causal connections; leaking the existence of a downstream transformer / consumer
    reveals another team''s internal pipeline structure even if their entities are
    not separately enumerable via other endpoints. 5th surface in the read-collaborative
    invariant (after getAllAlerts + getActivity + search + getDataEntityDetails).
    (getDataEntityDownstreamLineage.md:security.known_security_gaps.[0])'
  - '**No `lineage_depth` upper-bound cap + no rate-limit — DoS-amplification vector
    (HIGH)** — `@Min(1)` enforces a lower bound but no `@Max(...)` exists; depth=10000
    against a dense subgraph is permissible. The CTE row count grows multiplicatively
    with depth; no cycle guard inside the recursion (only outer `selectDistinct`).
    (getDataEntityDownstreamLineage.md:security.known_security_gaps.[1])'
  - '**DISABLED-mode reachability (HIGH)** — 11th sidecar in the DISABLED-bypass cross-cutting
    invariant; anonymous network probe can drive cross-owner enumeration AND DoS-amplification.
    (getDataEntityDownstreamLineage.md:security.known_security_gaps.[2])'
  - '**Null-`lineage_depth` NPE returns 500 to caller (MEDIUM)** — generic 500 leaks
    server-side exception trace; docs claim ''Unset returns the platform''s default
    depth'' which is UNIMPLEMENTED. Doc-drift + error-handling-hole compounded. (getDataEntityDownstreamLineage.md:security.known_security_gaps.[3])'
  cross_file_inconsistencies:
  - Concept name 'Lineage' is canonical in main-concepts.md (`Data Lineage` Data Governance
    pillar) but the API surface, recursion-bound mechanism, dual-input expansion model,
    and cross-owner-enumeration posture are all undocumented at the concept layer.
    Sub-page `/developer-guides/api-reference/lineage` covers the parameters but with
    two inaccuracies (the null-default claim + the group-only `expanded_entity_ids`
    claim).
  contributing_files:
  - getDataEntityDownstreamLineage.md
  evidence:
  - getDataEntityDownstreamLineage.md:security.known_security_gaps.[0-3]
  - getDataEntityDownstreamLineage.md:bugs_limitations_corner_cases.[0-7]
performance_aggregate:
  overall: LOW
  hot_paths:
  - Every lineage-canvas open in the UI issues a `GET /api/dataentities/{id}/lineage/downstream`
    AND `/upstream`; each subsequent click on a node to expand re-issues the same
    endpoint with an updated `expanded_entity_ids` list — fully synchronous, fully
    un-cached
  - Recursive-CTE materialises one row per (depth, parent_oddrn, child_oddrn) tuple
    inside the recursion — highest-DB-cost read on the entity-detail screen
  - Per-oddrn metadata fetch loads every entity referenced anywhere in the edge set
    + every group oddrn — a 10K-edge response triggers a 20K-oddrn metadata fetch
    in the same Mono assembly
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single Mono pipeline per request — one request → one response holding
      the full graph; no streaming variant; no batching of multiple lineage requests
  scaling_shape:
    verdict: UNPAGINATED
    detail: Stateless controller scales horizontally; the bottleneck is unbounded
      Postgres recursive-CTE cost on diamond-shaped DAGs + full-graph in-memory materialisation
      in JVM heap before serialisation
  strengths:
  - Stateless controller — horizontal scaling unconstrained at this layer
  - Reactive `Mono` signature — non-blocking on the request thread
  weaknesses:
  - '**No upper bound on `lineage_depth` parameter (HIGH)** — operators cannot defend
    a small Postgres instance against a depth=10000 request without an external WAF/reverse-proxy
    validation rule'
  - '**No cap on `expanded_entity_ids` list length (MEDIUM)** — a multi-thousand-ID
    list hits the Postgres 32K-parameter prepared-statement limit before producing
    a useful error message'
  - '**Full-graph in-memory materialisation (MEDIUM)** — no streaming response and
    no pagination cursor; a 100K-node downstream subgraph holds its full edge list
    + per-node metadata in heap before serialisation'
  - '**No CTE-level cycle guard (MEDIUM)** — diamond DAGs and true cycles inflate
    intermediate row counts inside the CTE before final pruning at outer `selectDistinct`'
  - '**No caching (LOW)** — identical repeated calls re-walk the CTE and re-fetch
    every entity''s metadata'
  cross_file_inconsistencies: []
  contributing_files:
  - getDataEntityDownstreamLineage.md
  evidence:
  - getDataEntityDownstreamLineage.md:performance.hot_paths.[0-2]
  - getDataEntityDownstreamLineage.md:performance.known_performance_gaps.[0-4]
