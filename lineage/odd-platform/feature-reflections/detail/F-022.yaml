    soft-deleted datasets for audit/forensic "what happened before deletion"
    workflows.
  derivation: |
    The backend uses `existsIncludingSoftDeleted` (NOT `exists`) on every read path
    (per `DataQualityController.md` implicit_adrs[1] + `DataQualityServiceImpl.java:55,67,96`),
