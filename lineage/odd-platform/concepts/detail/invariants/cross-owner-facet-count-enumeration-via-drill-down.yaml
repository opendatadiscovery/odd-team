name: |-
  Cross-owner facet-count enumeration via drill-down (REFACTOR-024 family extension)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-01
description: |-
  NEW INVARIANT, batch 2026-05-19M — the facet-count surface
  (GET /api/search/{search_id} via getSearchFacetList +
  GET /api/search/{search_id}/facet/{facet_type} via getFiltersForFacet)
  computes ALL facet counts CATALOG-WIDE with no OWNERSHIP join, no
  principal-derived predicate, no per-user scope. The aggregators at
  ReactiveSearchFacetRepositoryImpl.java:163-249 (entity-class), :251-337
  (type), :339-407 (owner), :374-407 (tag), :409-452 (group), :454-534
  (status) ALL share the same shape: apply getDataEntityDefaultConditions
  (HOLLOW=false, STATUS != DELETED, EXCLUDE_FROM_SEARCH NULL-or-false), join
  to SEARCH_ENTRYPOINT, run countDistinct(SEARCH_ENTRYPOINT.DATA_ENTITY_ID)
  — NO OWNERSHIP join anywhere. The single owner-derived input on the
  service-layer path is authIdentityProvider.fetchAssociatedOwner() at
  SearchServiceImpl.java:128-130, which feeds ONLY the optional myObjectsCount
  alongside the catalog-wide total — the myObjects toggle controls which
  entities the user SEES in the result list (SearchServiceImpl.java:105-111),
  NOT the facet counts. **Operator-facing consequence**: an authenticated
  attacker can drill getFiltersForFacet(OWNERS) to enumerate every owner name
  + per-owner entity count, then drill (TAGS) / (GROUPS) / (STATUSES) /
  (TYPES) to enumerate the platform tag and group cardinality — all
  catalog-wide. An entity that the user cannot read DIRECTLY (because its
  ID is not known, or because cross-owner reads are intended to be limited)
  can still be inferred via facet counts incrementing as the entity is
  added / removed. The owner facet (getOwnerFacetForDataEntity at
  :339-372) is the PRIMARY catalog-cardinality discovery vector — it
  enumerates EVERY OWNER NAME in the platform with the count of entities
  each owns. Pairs with REFACTOR-024 (the BATCH alert read) and REFACTOR-340
  (the per-entity alert read) — together they form the catalog-wide
  cross-owner enumeration surface. **Severity**: HIGH.
