behaviour: |-
  **OWNER_ASSOCIATION_REQUEST ORPHAN ROWS PERSIST AFTER OWNER DELETE — cascade-block check is incomplete.** The cascade-block at OwnerServiceImpl.java:90-91 checks termOwnership + ownership + userOwnerMapping, but NOT `owner_association_request`. The owner_association_request table has a foreign key to `owner(id)` (V0_0_51__add_owner_association_request.sql:11: `CONSTRAINT owner_association_request_owner_fk FOREIGN KEY (owner_id) REFERENCES owner (id)`) but NO `ON DELETE` clause (defaults to NO ACTION). Because owner uses soft-delete (UPDATE `deleted_at`, not DELETE FROM), the FK is never consulted. Result: a `PENDING` or `APPROVED` owner_association_request for the just-deleted owner persists. The next `GET /api/owner_association_request` listing query returns the orphan row (the listing endpoint joins owner LEFT — verified via ReactiveOwnerRepositoryImpl.java:147-149 showing the OWNER_ASSOCIATION_REQUEST relationship is the `allowedForSync` filter in `enrichSelect`). Operators see a request for an owner whose name has likely been reused, with no UI signal that the original owner is gone. **MIRRORS F-006 family's cascade-incompleteness pattern.** Plus from a security angle: an attacker who can submit an OWNER_ASSOCIATION_REQUEST against any owner could plant orphan rows that survive future owner directory churn — useful for a long-game persistence technique. The attack precondition (the attacker must hold OWNER_ASSOCIATION_* permissions to submit the request) makes severity conservative, BUT severity RISES under DISABLED.
