proposed_action: |-
  Integration test against Testcontainers Postgres. (a) Configure `housekeeping.ttl.search_facets_days=1`. (b) Seed 50 rows in `search_facets` with `last_accessed_at = now() - 2 days` and 50 rows with `last_accessed_at = now() - 1 hour`. (c) Manually invoke `SearchFacetsHousekeepingJob.doHousekeeping(connection)` (or trigger the scheduled cycle via fast-forward). (d) Assert: 50 aged rows DELETED; 50 fresh rows PRESERVED. (e) Test comment "Pins F-010 SearchFacetsHousekeepingJob delete-predicate contract; failure indicates TTL eviction logic regression. See LSN-018 for the wrong-original-claim history." Pair with a unit test on the jOOQ predicate itself (mocked DSLContext).
batch: 2026-05-19-M
batch_corrected: 2026-05-19-N
correction_note: |-
  Original batch-M emission claimed (a) "unbounded growth", (b) "NO TTL eviction, NO row deletion, NO archive policy", (c) "V0_0_52 policy list has NO search_facets entry (verified by sidecar grep during enrichment)", (d) "TTL TODO at V0_0_1__init.sql:207 was never implemented." All four claims were factually wrong (verified 2026-05-19 against upstream code). The wrong claims contradicted F-010 (created batch K), which correctly enumerates SearchFacetsHousekeepingJob as one of 5 active housekeeping jobs. The original-claim test (assert search_facets row count UNCHANGED after housekeeping cycle) would have FAILED IMMEDIATELY on a real platform because the job DOES prune search_facets exactly as designed. Root cause: the originating sidecar (SearchController.facets) inferred absence from controller-tier scope without grepping for SearchFacetsHousekeepingJob; the test-coverage-mapper reducer trusted the sidecar without coherence-checking against feature-flows/index.yaml. The two contradictory artefacts coexisted in the registry for 2 batches (created K=2026-05-19-K and M=2026-05-19-M). Methodology fix in LSN-018: pre-emit coherence check + post-batch coherence sweep + back-link bidirectionality.
