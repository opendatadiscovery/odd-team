behaviour: |-
  **`RoleServiceImpl` carries THREE DIFFERENT CASE-SENSITIVITY policies across create / update / delete name guards — a maintainer normalising to one would silently shift behaviour.** Net observable: an operator can create 'administrator' (lowercase) bypassing the seeded Administrator's DB UNIQUE index (case-sensitive byte-for-byte), CAN rename it via update to anything (case-SENSITIVE update guard at line 68 doesn't match), CANNOT delete it (case-INSENSITIVE delete guard at lines 81-82 matches). The three policies: (a) `create` (lines 49-61) — NO case-check; (b) `update` (line 68) — case-SENSITIVE `!role.getName().equals(UserProviderRole.ADMIN.getValue())`; (c) `update` rename-block (lines 104-106) — case-SENSITIVE `role.getName().equals(UserProviderRole.USER.getValue())`; (d) `delete` (lines 81-82) — case-INSENSITIVE `r.getValue().equalsIgnoreCase(role.getName())`. The mismatch is NOT documented; a maintainer would naturally pick ONE case-policy when refactoring and silently change the operator-visible contract. This is the SAME drift batch E + batch N captured; THIS batch-S sidecar is PRIMARY-SOURCE for the THREE distinct case-policy choices in one file.
