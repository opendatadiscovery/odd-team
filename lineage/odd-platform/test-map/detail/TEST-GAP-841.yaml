proposed_action: |-
  **Phase 1 — Playwright cross-user integration test**:

  1. `userAsubmitsQuery_userBVisitsSameSessionUUID_userBSeesSameSessionState_pinsBearerTokenShape` — boot test-platform with two test users (UserA, UserB). UserA logs in, navigates to `/search`, submits `customer dataset`, captures the session UUID from URL. UserB logs in (different browser context), navigates directly to `/search/{UserA_uuid}`, assert UserB sees UserA's filter state + query text. PINS the bearer-token-shape.

  **Phase 2 — Backend integration test (Java + WebTestClient)**:

  2. `putFacetsOnSearchUUID_authenticatesAsUserOtherThanCreator_succeeds_pinsNoUserBinding` — UserA creates session via `POST /api/search`, captures UUID. UserB authenticates, calls `PUT /api/search/{UserA_uuid}/facets` with new facet selections, assert 200 OK. PINS the cross-user mutability.

  3. `putFacetsWithFTSInjection_subsequentGetFacetsReturns500_pinsPropagatedPoisoning` — UserA poisons the UUID with `foo ) | (bar`, then UserB calls `GET /api/search/{poisoned_uuid}/facet/owners` → assert backend returns 500. PINS the propagation DoS.

  4. `getSearchSession_authenticatesAsAnonymousUnderDISABLED_returns200WithFullState_pinsAnonymousReach` — boot platform with `auth.type=DISABLED`, anonymous caller hits `GET /api/search/{any_uuid}`, assert 200 with full state. PINS the DISABLED-mode reach (compound risk).

  **Architectural fix recommendation**:
  - Add `created_by_user_id` column to `search_facets` (REFACTOR-344 fix)
  - Add per-user authorization check on `GET/PUT /api/search/{uuid}` (current owner OR shared-with)
  - Add session-share mechanism (explicit "share this filter view" affordance) instead of implicit bearer-URL sharing
  - The tests then UPDATE to assert the new posture (UserB cannot access UserA's session unless explicitly shared)

  Coherence note (LSN-018 Rule 6): STRENGTHENS REFACTOR-344 by establishing the UI-tier propagation surface. NO contradiction with existing artefacts. The pattern parity with TermSearch batch-U is expected (clone relationship — same URL-backed session model).
