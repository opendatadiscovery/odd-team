feature_id: F-056
pillar_id: P-06
pillar_anchored_id: P-06:F-003
pillar_anchored_feature_name: Term Description-Mention Auto-Link Side-Channel
feature_name: |-
  [[namespace:term]] description-mention auto-link — DATA_ENTITY_DESCRIPTION_UPDATE silently
  creates term-link rows bypassing DATA_ENTITY_ADD_TERM, with cross-time + cross-namespace
  + audit-invisible properties
seeded_from: SHB-030
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  rest:PUT /api/dataentities/{id}/description (and PUT
  /api/datasetfields/{id}/description) — the description-update endpoints
  gate ONLY on DATA_ENTITY_DESCRIPTION_UPDATE. Plus rest:POST /api/terms
  and PUT /api/terms/{id} (createTerm / updateTerm) — which drain the
  unhandled-mention staging table on term-create / term-update, materialising
  cross-time auto-links to entities whose descriptions were written by OTHER
  users who never had DATA_ENTITY_ADD_TERM.
primary_subject:
  - odd-platform-api/src/main/java/.../TermServiceImpl.java:67 (regex declaration)
  - odd-platform-api/src/main/java/.../TermServiceImpl.java:201-207 (handleDataEntityDescriptionTerms)
  - odd-platform-api/src/main/java/.../TermServiceImpl.java:99-117 (createTerm + resolveUnhandledDescriptionMentions)
  - odd-platform-api/src/main/java/.../TermServiceImpl.java:421-442 (cross-time drain)
contributing_nodes:
  - node_id: odd-platform java service:TermServiceImpl
    role: service-tier-side-channel-host
    sidecar: lineage/odd-platform/understanding/odd-platform__java__service__service__TermServiceImpl.md
    note: |-
      The regex `\[\[([^:]*?):([^\]]*?)\]\]` parses [[namespace:term]] mentions
      out of every internal description (data-entity, dataset-field,
      term-definition). handleDataEntityDescriptionTerms / handleDatasetFieldDescriptionTerms
      synthesise *_to_term rows with is_description_link = TRUE.
      resolveUnhandledDescriptionMentions drains the staging table on
      createTerm / updateTerm — the cross-time drain that auto-links new terms
      to OLD descriptions by OTHER users.
  - node_id: odd-platform java service:DataEntityServiceImpl
    role: invocation-site
    sidecar: '(referenced from TermServiceImpl sidecar coupling)'
    note: |-
      DataEntityServiceImpl.upsertDescription:325-328 invokes
      handleDataEntityDescriptionTerms. Gated only by
      DATA_ENTITY_DESCRIPTION_UPDATE.
    unresolved: true
  - node_id: odd-platform java DataEntityDescriptionUnhandledTermRepository
    role: staging-table-repository
    sidecar: '(referenced from TermServiceImpl sidecar coupling)'
    note: |-
      data_entity_description_unhandled_term + dataset_field_description_unhandled_term
      staging tables. Hold mention rows for [[ns:term]] references that
      could not be resolved at description-edit time. Drained by
      resolveUnhandledDescriptionMentions on subsequent term-create / term-update.
    unresolved: true
