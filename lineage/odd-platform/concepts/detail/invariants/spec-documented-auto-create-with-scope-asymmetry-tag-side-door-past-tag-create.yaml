name: Spec-documented auto-create with scope-asymmetry — Tag side-door past TAG_CREATE
canonical_in_docs: false
canonical_candidate: true
description: 'REFINES the batch-F ''Permission-bypass via auto-create-on-miss'' invariant.
  createDataEntityTagsRelations confirms a SECOND class of auto-create side-door distinct
  from the batch-F Owner/Title undocumented pattern: Tag auto-create is EXPLICITLY
  DOCUMENTED at openapi.yaml:1174 (''Also creates corresponding tags in the system
  if they don''t exist.'') — intentional UX trade-off. The structural gap is NOT the
  auto-create itself but the SCOPE-ASYMMETRY between (a) MANAGEMENT-scoped TAG_CREATE
  (unconditional shape) and (b) DATA_ENTITY-scoped DATA_ENTITY_TAGS_UPDATE (grantable
  via ''is: dataEntity:owner'' Policy condition). A per-data-entity-owner can therefore
  mint global Tag directory rows that pollute the popular-tags surface for users with
  no permission on their data entity. Cross-tenant Tag pollution is enabled (no per-tag
  ACL; Tag directory is global). The asymmetry is undocumented at the policy-author
  surface — operators reading the Permissions doc cannot determine ''who can grow
  the Tag directory'' without reading the source code.'
