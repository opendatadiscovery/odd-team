  - NotificationsDispatcher.md:implicit_adrs.[0-3]
performance_aggregate:
  overall: LOW
  hot_paths:
  - 'Per WAL message: `messageDecoder.decode(buffer)` (sync, in-thread) then `messageProcessor.process(decodedMessage)`
    runs `messageTranslator.translate(...)` (multi-statement jOOQ query: alert chunks
    + alerted data entity + recursive downstream CTE) then sequentially iterates `List<NotificationSender>`
    calling `.send(...)` on each — every send is a synchronous HTTP/SMTP round-trip.
    End-to-end latency per alert ≈ (decode) + (DB roundtrips for downstream depth≥1)
    + Σ per-channel network RTT — NotificationsProperties + NotificationSubscriber.java:64-77
    + AlertNotificationMessageProcessor.java:25-36 + AlertNotificationMessageTranslator.java:60-86'
  - 'Per email send: freemarker render + NEW SMTP connection + STARTTLS handshake
    fires per recipient (JavaMailSenderImpl does NOT pool by default — no `mail.smtp.connectionpoolsize`).
    End-to-end latency for an alert with N recipients ≈ freemarker render + N × (TCP
    + STARTTLS + SMTP HELO/AUTH/MAIL/RCPT/DATA). (EmailSenderProperties.md:performance.hot_paths.[0])'
  - Recursive downstream lineage CTE in `AlertNotificationMessageTranslator#fetchDownstream`
    — depth-bounded by `notifications.message.downstream-entities-depth` (default
    1). At depth N over wide lineage graphs, CTE cost scales with the branching factor.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single-thread WAL consumer per cluster (leader-elected at advisory lock
      id 100). Throughput bounded by the slowest sender plus translation DB cost.
      No parallelisation across channels. No batching — one HTTP/SMTP roundtrip per
      alert per channel. Polling loop sleeps 10ms between empty `readPending()` calls
      — idle CPU baseline bounded.
  scaling_shape:
    verdict: STATEFUL_LOCKED
    detail: Stateful at the cluster level — Postgres advisory lock id 100 + named
      replication slot + named publication. Horizontal scaling = exactly one active
      subscriber. Replication slot + publication are global Postgres objects; renaming
      requires manual drop of the prior slot or WAL accumulation on the primary. No
      queueing layer between WAL decode and HTTP send — bursts of alerts directly
      translate into bursts of outbound HTTP/SMTP requests; no backpressure mechanism.
  strengths:
  - Single shared `HttpClient` bean across Slack + Webhook senders — connection reuse
  - Polling loop sleeps 10ms between empty reads — bounded idle CPU
  - Email sender reuses single `MimeMessage` across recipients — minor allocation
    savings
  - 'Default partition WIDTH `:30` and default `downstream-entities-depth: 1` are
    sensible safe defaults'
  weaknesses:
  - '**No rate-limiting — bursty alert events translate 1:1 into outbound deliveries
    (HIGH severity)** — Slack will 429; platform has no retry-with-backoff. (NotificationsProperties.md:performance.known_performance_gaps.[0])'
  - '**Synchronous fan-out — one slow sender stalls all subsequent senders for the
    same alert (MEDIUM)** — misconfigured webhook with 30s SLA blocks Slack + email
    delivery. (NotificationsProperties.md:performance.known_performance_gaps.[1])'
  - '**SMTP timeouts unset — hung SMTP server blocks subscriber thread forever, stopping
    ALL notification delivery (HIGH severity — 2-sidecar primary-source confirmed)**
    — `NotificationConfiguration.java:34-68` has no `mail.smtp.connectiontimeout`
    / `mail.smtp.timeout` / `mail.smtp.writetimeout` in the Properties bag. Live-doc-documented
    limitation. Confirmed from second angle by batch D `EmailSenderProperties` sidecar
    (`bugs_limitations_corner_cases.[0]` + `performance.known_performance_gaps.[0]`).
    Cross-channel impact: fan-out is sequential on a single thread — hung SMTP also
    stalls Slack + webhook delivery. (NotificationsProperties.md:performance.known_performance_gaps.[2]
    + EmailSenderProperties.md:performance.known_performance_gaps.[0])'
  - |-
    **Poison-message WAL replay loop (NEW HIGH severity, batch K)** —
    translation failure triggers NotificationSubscriber's outer catch
    → 10s back-off → re-acquire → same WAL LSN re-delivered indefinitely.
    A persistently-bad row (unknown alert-type code, FK-missing data entity)
    blocks the WAL stream indefinitely.
    (NotificationsDispatcher.md:performance.known_performance_gaps.[3])
  - |-
    **Empty-senders DB cost (LOW — batch K PRIMARY SOURCE)** —
    `notifications.enabled=true` with ZERO receivers still triggers
    translate() (multi-statement jOOQ read incl. recursive CTE) for every
    WAL event. DB cost paid for zero delivery.
    (NotificationsDispatcher.md:performance.known_performance_gaps.[2])
  - '**No connection-pool sizing knobs surfaced for the shared `HttpClient` (LOW)**
    — `HttpClient.newHttpClient()` uses default executor + default pool. (NotificationsProperties.md:performance.known_performance_gaps.[3])'
  - '**Slack response-status check is hard-coded == 200 (LOW)** — Slack''s incoming
    webhook can return 2xx other than 200; non-200 2xx will be misclassified as failure.
    (NotificationsProperties.md:bugs_limitations_corner_cases.[8])'
