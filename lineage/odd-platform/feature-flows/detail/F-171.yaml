observed_vs_expected:
  facets:
    - drift_class: triage_ui_no_request_context_preview_only_username_owner_role_provider
      description: |-
        The NewAssociationRequest row shows ONLY username / ownerName /
        roles / provider — there is no preview of the request's submission
        context (when was it submitted? who submitted it from where? was
        it a SELF-request or did an admin file it on behalf? is there any
        attached justification?). The operator approves blind on identity
        + role + provider strings alone. Compare to typical access-review
        UIs where the requester's prior history, the requester's stated
        reason, and the timestamp are surfaced inline.
      evidence:
        - "NewAssociationRequest.tsx:52-68 (4 visible columns + 2 action buttons; no `requestedAt`, no `requestedBy` differentiated, no justification field)"
        - "OwnerAssociationsNew.tsx:52-66 (table header — same 4 columns: User name / Owner name / Role / Provider)"
      ui_unverified: true
      ui_unverified_reason: |-
        The OwnerAssociationRequest DTO (generated-sources) may carry
        additional fields not surfaced by the UI — verifying
        intent-vs-implementation requires reading the OpenAPI schema +
        the OwnerAssociationRequest type. Slice H read only the
        components; cross-pillar to backend.
    - drift_class: confirm_dialog_text_no_irreversibility_warning_no_undo_path
      description: |-
        Both Accept and Reject ConfirmationDialogs name the action ("User
        X will be map to owner Y" / "Association request to map user X to
        owner Y will be rejected") but neither states irreversibility OR
        identifies the undo path. The actual semantics: APPROVED creates
        a user_owner_mapping row + is reversible via the Active tab's
        Remove affordance (cross-link F-173); DECLINED is a status update
        — the request becomes invisible from the Pending tab + visible
        in History (cross-link F-174). Operator does not learn this from
        the dialog text.
      evidence:
        - "NewAssociationRequest.tsx:70-104 (both dialog actionText strings)"
      ui_unverified: false
    - drift_class: positive_finding_confirm_dialog_present_for_both_accept_and_reject
      description: |-
        Positive finding (UX-symmetry): both Accept and Reject affordances
        require a ConfirmationDialog before firing. Contrast with the
        F-019 batch-Q empty-roles-destructive-update finding where the
        more-irreversible action had NO confirmation. Here the Accept
        path (which creates a user_owner_mapping = state change) and the
        Reject path (which is a status update) are SYMMETRICALLY gated.
      evidence:
        - "NewAssociationRequest.tsx:70-87 (Accept ConfirmationDialog) + 88-104 (Reject ConfirmationDialog)"
      ui_unverified: false
    - drift_class: permission_gate_disables_button_but_does_not_hide_row
      description: |-
        Operators without OWNER_ASSOCIATION_MANAGE see the full PENDING
        list (no row-level filtering — the list endpoint is in the
        catch-all-auth read posture per F-074) but the Accept/Reject
        buttons render DISABLED rather than hidden (NewAssociationRequest.tsx:84,
        101). Mixed posture vs F-019 batch-Q OwnersList finding (HIDE
        not DISABLE) — Owner-Association takes the DISABLE posture
        which is the user-friendlier choice (operator can see what they
        can't act on; the affordance discoverable). Cross-link doc-gap:
        the live permissions doc does not name OWNER_ASSOCIATION_MANAGE
        explicitly as a gate; the operator cannot Google the permission
        from the disabled state.
      evidence:
        - "NewAssociationRequest.tsx:84 (Accept button disabled gate) + :101 (Reject disabled gate)"
        - "Cross-link F-074 — list endpoint reachable to any authed user"
      ui_unverified: false
    - drift_class: tab_switch_resets_search_query_to_empty_no_persistence
      description: |-
        On tab change (New ↔ Active ↔ History) the OwnerAssociationsTabs
        `onTabChange` callback calls `setQuery('')` and invalidates the
        `ownerAssociationRequestList` query key (OwnerAssociationsTabs.tsx:44-47).
        An operator searching "alice" in PENDING then clicking Active
        loses the search term. The Provider scope (OwnerAssociationsAtomProvider)
        is outside the tabs so the atom itself persists across tab switches
        — the reset is INTENTIONAL via the explicit setQuery(''). Mirror of
        F-104's jotai-Provider paradigm-split observation, EXTENDS the
        finding: in this feature the reset is EXPLICIT not just structural.
      evidence:
        - "OwnerAssociationsTabs.tsx:44-47 (onTabChange explicitly resets query + invalidates rq cache)"
        - "OwnerAssociationsStore/OwnerAssociationsAtoms.ts:3 (queryAtom = atom(''))"
        - "OwnerAssociationsProvider.tsx:4-7 (Provider scope wraps the entire route)"
      ui_unverified: false
