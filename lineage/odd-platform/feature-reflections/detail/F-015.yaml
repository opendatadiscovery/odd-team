# My-Objects Anchor-Set Reads — product-owner reflection

## product_owner_narrative

The platform's Catalog Overview home page greets a signed-in user with a "Recommended" panel of four small tiles (per the live UI component `OwnerEntitiesList.tsx:76-105`, read directly because no enriched UI sidecar exists for this node): **My Objects**, **Upstream dependents**, **Downstream dependents**, and **Popular**. This feature owns the middle two. The promise the user reads off the screen is a personalised lineage briefing: *"here is the data I am responsible for, here is what it depends on, and here is what depends on it"* — a five-item-each at-a-glance map of the user's immediate data neighbourhood. The tiles are backed by `GET /api/dataentities/my/upstream` and `GET /api/dataentities/my/downstream` (`DataEntityController.java:291-305`); a sibling `GET /api/dataentities/my` backs the My Objects tile. The user provides no input at all — no owner-id, no filter, no page control — the panel hardcodes `{ page: 1, size: 5 }` and resolves *who you are* deep in the service chain via reactor-Context principal propagation (`DataEntityRelationsServiceImpl.java:26` → `authIdentityProvider.fetchAssociatedOwner()`, per the AuthIdentityProvider sidecar `understanding`).

Mechanically, each of the two endpoints runs a deliberate two-phase **anchor-set + derived-set** computation (per `getMyObjectsWithUpstream.md` `understanding` + implicit_adrs[0]). Phase 1 — the *anchor* — resolves the caller's bound Owner and lists the entities that Owner owns, JOIN-OWNERSHIP-defended at the SQL layer (`ReactiveDataEntityRepositoryImpl.java:515-534`). Phase 2 — the *derived set* — walks exactly one lineage hop out from the anchor in the chosen direction (`getLineageRelations(oddrns, LineageDepth.empty(), {UP|DOWN}STREAM)` at `DataEntityRelationsServiceImpl.java:34`; the recursive CTE fires only its seed step because `LineageDepth.empty()` encodes depth=-1, per `ReactiveLineageRepositoryImpl.java:174` + invariant[5]), then **explicitly excludes the anchor** via `Predicate.not(oddrns::contains)` (`DataEntityRelationsServiceImpl.java:37`). The result is the lineage neighbours of your stuff, *minus your stuff* — the entities you do NOT own that touch the entities you do. The UI labels this honestly ("Upstream dependents", not "my upstream"); the OpenAPI summary does not (it says "data entities owned by current user with upstream dependencies" — the literal inverse).

The user interacts with the panel by reading it and clicking a tile entry, which navigates to that entity's detail page (`DataEntityList.tsx:38` → `dataEntityDetailsPath(item.id)`). There is no pagination, no sort control, no filter, no "show more" — the surface is a fixed top-5 briefing, not a browsable list. An entry shows a stale-clock indicator and an alert icon when relevant (`DataEntityList.tsx:40-41`), consistent with how entities render across the rest of the catalog. An empty tile renders a generic `EmptyContentPlaceholder` (`DataEntityList.tsx:65-66`) with no copy explaining *why* it is empty.

The integration story is three-pillar. The feature is anchored in **P-09 Security & Access Control** because its entire value proposition is owner-scoping — it is one of the few read surfaces that filters by who you are, against a platform whose documented baseline is a *read-collaborative posture* where every authenticated user can read every entity (per P-09 maintainer-notes + `data-lineage.md:69-73`). It draws its substrate from **P-05 Data Lineage** (the same LINEAGE table and CTE generator that back the F-005 lineage canvas, but confined to a single hop here vs caller-supplied depth there). And it surfaces in **P-01 Data Discovery** as a sub-surface of the Catalog Overview's Recommended panel (per the feature-flow's P-01 cross_pillar_relationship). The owner-scoping itself rests on the **User-Owner Association** mechanism (P-09): a user with no `USER_OWNER_MAPPING` row has no anchor, so the panel shows empty.

In a demo, the product owner would flag the edge cases that bite real operators: a brand-new federated user (OAUTH2/LDAP first login) has no owner association yet, so all three personalised tiles render empty with no on-screen affordance pointing them to the association-request flow (per AuthIdentityProvider sidecar bugs[2]); an admin or CI-bot owner who happens to own thousands of entities pays an O(anchor) database cost on every page-load because the anchor is fetched unpaginated before the requested `size=5` slice is applied (per `getMyObjectsWithUpstream.md` performance.known_performance_gaps[0]); and four genuinely different conditions (no association / association-but-no-entities / entities-but-no-lineage / no-security-context) all collapse to the same empty tile (per bugs[3] + `data-lineage.md:58-67`). The live Data Lineage doc now documents every one of these caveats explicitly (a material improvement since 2026-05-19) — but the OpenAPI spec a third-party SDK compiler reads still describes the inverse response shape.

