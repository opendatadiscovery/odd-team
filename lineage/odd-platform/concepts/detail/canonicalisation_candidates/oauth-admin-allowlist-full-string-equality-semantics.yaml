proposed_canonical: OAuth admin allowlist — full-string equality semantics
rationale: |-
  Replaces the retracted `substring-match-admin-escalation-ldap-containsignorecase`
  candidate (factually wrong per batch O OperationUtils.java verification).
  ALL admin-allowlist callsites on the ODD Platform OAuth2 + LDAP surfaces use
  `OperationUtils.containsIgnoreCase(Collection<String>, String)` which is
  `anyMatch(element::equalsIgnoreCase)` — FULL-STRING case-insensitive equality,
  NOT substring matching. The correct invariant — verified across four call
  sites by batch O — is:
    - LDAP admin-group match (`LDAPSecurityConfiguration.java:94-97`) uses
      full-string equality on LDAP group authority names. `admin-groups: ['Admin']`
      matches the LDAP authority `'Admin'`, `'admin'`, `'ADMIN'` — but NOT
      `'Administrator'`, `'admin-contractors'`, or `'devops'`.
    - GitHub admin-team match (`GithubUserHandler.java:114-119` + 122-131)
      uses full-string equality on team.name AFTER filtering teams to those
      whose team.organization.login matches organizationName.
    - GitHub org-membership match (`GithubUserHandler.java:135-137`) uses
      full-string equality on org.login.
    - Google admin-principal match (`GoogleUserHandler.java:60`) uses full-
      string equality on the configured admin-attribute claim (default `email`).
  The live docs (WebFetched 2026-05-19 status 200) say "A list granting admin
  permissions" / "Direct list of users granted ADMIN role" / "Restricts login
  only for users from this particular organization" WITHOUT specifying matching
  semantics. The canonical claim to add to live docs is the explicit semantic:
  "admin-groups / admin-principals / organization-name use case-INSENSITIVE
  FULL-STRING equality; partial-name / substring matches do not apply."
contributing_concepts:
  - LDAPSecurityConfiguration.java:94-97 (LDAP admin-group full-string match)
  - GithubUserHandler.java:114-119 + 122-131 (GitHub admin-team full-string match, org-scoped)
  - GithubUserHandler.java:135-137 (GitHub org-membership full-string match)
  - GoogleUserHandler.java:60 (Google admin-principals full-string match)
  - OperationUtils.java:7-10 (the canonical helper — `element::equalsIgnoreCase`)
  - The retracted candidate `substring-match-admin-escalation-ldap-containsignorecase` (factually wrong)
suggested_add_to_docs: true
