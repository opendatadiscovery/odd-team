name: Metrics Ingestion
canonical_in_docs: false
canonical_candidate: true
description: 'Operator-selected metrics-storage subsystem driven by `metrics.storage`
  (`INTERNAL_POSTGRES` default vs `PROMETHEUS`). PROMETHEUS mode writes Prometheus-shaped
  time series via the Prometheus remote-write protocol to `metrics.prometheus-host`/api/v1/write
  (Snappy-compressed) and queries via `/api/v1/query`. Mirrored bean structure: `extractors/external/Counter|Gauge|Histogram|SummaryTimeSeriesExtractor`
  (gated `havingValue="PROMETHEUS"`) vs `extractors/internal/Counter|...|MetricsSeriesExtractor`
  (gated `havingValue="INTERNAL_POSTGRES", matchIfMissing=true`). Per-MetricType extractor
  dispatch via `extractors.stream().filter(canExtract).findFirst()` — new MetricType
  support is add-a-class. vocabulary_status: codebase-anchored, doc-side-covered (live
  `/configuration-and-deployment/odd-platform#metric-storage-backend` enumerates both
  modes and documents `metrics.prometheus-host` + the Prometheus `--web.enable-remote-write-receiver`
  runtime requirement — verified WebFetch 2026-05-10).'
vocabulary_status: codebase-anchored, doc-side-covered
axes_present:
- config_prefixes
nodes:
- odd-platform java CounterTimeSeriesExtractor config-key-consumer:metrics.storage@L20
contributors:
- 'CounterTimeSeriesExtractor@L20: entities[MetricType.COUNTER, MetricFamilyPojo,
  MetricPoint, CounterValue, TimeSeries / Sample / Label (Prometheus remote-write
  proto)]; operations[gate-bean-instantiation-on-metrics.storage=PROMETHEUS, accept-counter-point,
  emit-two-TimeSeries-per-counter-point (total + created), null-check counterValue.getTotal,
  NaN-substitute counterValue.getCreated, append tenant_id system label]; invariants[mirrored
  extractors via matchIfMissing=true on internal side; counterValue.getTotal mandatory;
  NaN substitution for missing created; tenant_id label append only when tenantId
  != null]'
