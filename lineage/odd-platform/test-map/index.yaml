    14+ feature not used here), no LIMIT inside the CTE, no row-count cap. The outer
    `selectDistinct` (line 127) deduplicates the FINAL result but does NOT prune the
    CTE intermediate work — confirming REFACTOR-202 amplification at the SQL layer.
    STRENGTHENED batch I — the service sidecar adds the COMPOSITION cost: getLineage
    merges the recursive-CTE result with the depth-1 expansion fan-out via `Flux.mergeWith(...).distinct()`
    (lines 100-101), then `.collectList()` (line 102). For a depth-N diamond pattern
    with branching factor B, intermediate row count grows O(B^N) at SQL BEFORE the
    service-tier distinct prunes — the cost is paid in BOTH Postgres work_mem AND
    JVM heap during `.distinct().collectList()`. Service tier is the JVM-heap amplification
    site.'
