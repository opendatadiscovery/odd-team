- id: H-011
  hypothesis: |-
    When an operator runs auth.type=DISABLED but additionally sets auth.s2s.enabled=true (e.g. to
    mimic prod ingestion locally), the spec / Swagger surface behaves consistently with the other
    modes' S2S handling.
  derivation: |-
    S2S is documented as composing with any auth mode; an operator reasonably expects DISABLED+S2S
    to behave like the others. This tests a cross-mode interaction the spec surface inherits.
  seed_source: cross-pillar (P-09 security composition) + view-mode
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Static trace shows DISABLED does NOT read auth.s2s.enabled and never wires S2sAuthenticationFilter
      (DisabledAuthSecurityConfiguration.java:13-18; the sidecar confirms the flag is silently ignored
      under DISABLED), whereas OAUTH2/LDAP/LOGIN_FORM compose the filter at HTTP_BASIC. So under
      DISABLED+S2S the spec surface is permit-all regardless and the X-API-Key path is inert. The
      OBSERVABLE behaviour at the Swagger surface (does presenting X-API-Key change anything? does the
      UI behave identically?) cannot be asserted from sidecars alone — it requires running a local
      docker-compose under DISABLED+s2s and DISABLED+no-s2s and diffing the responses at the springdoc
      paths. Local-executable (Testcontainers / docker-compose); no cloud needed.
    evidence:
