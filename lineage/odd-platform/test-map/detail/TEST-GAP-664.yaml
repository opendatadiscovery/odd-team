behaviour: |-
  **F-004 stored-XSS class fingerprint at the dataset_field surface.** `ReactiveDatasetFieldRepositoryImpl.updateDescription` (line 72-80) stores user-supplied input VERBATIM with only empty-to-null normalisation (line 75): `bare DSL.update(DATASET_FIELD).set(INTERNAL_DESCRIPTION, StringUtils.isEmpty(description) ? null : description).where(ID.eq(id)).returning()`. NO `Jsoup.clean()`, NO `Encode.html()`, NO length cap, NO HTML tag stripping. A Markdown / HTML / JavaScript payload submitted via `PUT /api/datasetfields/{id}/description` (`DATASET_FIELD_DESCRIPTION_UPDATE` permission per SecurityConstants.java:282-303) persists through reads of `getDatasetFieldWithTags` (line 127-139) and `listByTerm` (line 141-204). Same fingerprint pattern as `ReactiveDataEntityRepositoryImpl.setInternalDescription` (verified TEST-GAP-NNN family at the DataEntity layer, batch H + I sidecars). The defence-in-depth is the UI render layer (DefiniteDOMSanitiserPipeline + DOMPurify per P-009 / F-004 sidecars + dynamic-verification probe P-009 from 2026-05-19). But: the UI defence is documented to be Markdown-only at the render layer; a backend-leaked field rendered via a third-party tool (CLI, custom dashboard, OpenAPI-generated SDK consumer) would surface the raw payload. F-004 fingerprint at the dataset_field surface is UNVERIFIED at backend tier — no test asserts "the storage MUST be verbatim because the defence is at render time; this is the documented architectural choice".
