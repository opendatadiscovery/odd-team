  - "deleteOwner.md:tests_coverage_semantic.uncovered_behaviours (Idempotency + Not-found surface)"
behaviour: |-
  **IDEMPOTENCY + NOT-FOUND SURFACE INDISTINGUISHABLE — all roads lead to 204 No Content.** `OwnerServiceImpl.delete` (lines 88-100) has NO `switchIfEmpty(Mono.error(NotFoundException))` on `ownerRepository.delete(id)`. The repository's soft-delete UPDATE filters `idCondition` which adds `deleted_at IS NULL` (ReactiveAbstractSoftDeleteCRUDRepository.java:76-79); calling `delete(id)` against a non-existent or already-soft-deleted id returns an empty `Mono` (the `RETURNING` clause emits nothing because no row matched). The downstream `.then()` (OwnerServiceImpl.java:99) and `.thenReturn(noContent())` (OwnerController.java:44) propagate empty as success → HTTP 204. **Caller cannot distinguish 'I deleted it', 'it was already deleted', AND 'it never existed'** — all three states produce the same response. The `update` path DOES `.switchIfEmpty(Mono.error(new NotFoundException("Owner", id)))` at OwnerServiceImpl.java:73; the asymmetry between delete and update is unstated. **MIRRORS F-006 batch K `delete_no_not_found_validation` facet** (OwnershipServiceImpl version). NO test pins the current behaviour. A future fix that adds NotFound discrimination on delete would change the public API contract; an integration script that polls DELETE for cleanup would now fail visibly.
test_files_existing:
  - "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/OwnerRepositoryImplTest.java (testDeletesOwner at line 85-99 covers the soft-delete UPDATE contract but does NOT exercise the not-found / already-deleted-twice cases via the service layer)"
