gap_id: TEST-GAP-022
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController
surfaced_by:
- DataEntityAttachmentController.md:tests_coverage_semantic.uncovered_behaviours.[1]
behaviour: Cross-entity uploadId hijack — a user with DATA_ENTITY_ATTACHMENT_MANAGE
  on entity X who learns another user's uploadId Y issued for entity Z can post chunks
  via `POST /api/dataentities/X/files/uploads/Y/chunks` (gate authorises path's data
  entity, service forwards to uploadId's data entity).
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/AttachmentUploadIdHijackTest.java
  name: uploadFileChunk_uploadIdFromDifferentDataEntity_succeedsBypassingPathGate
evidence:
- 'DataEntityAttachmentController.md says: ''the controller never verifies that the
  `uploadId` belongs to the path''s `dataEntityId`'''
- 'concepts.yaml:entities[Attachment].security_aggregate.weaknesses.[3] verbatim:
  ''Cross-entity uploadId hijack ... gate authorises path''s data entity, service
  forwards to uploadId''s data entity (severity MEDIUM)'''
cross_references:
- concepts.yaml:entities[Attachment].security_aggregate.weaknesses.[3]
proposed_action: Add `WebTestClient` test that initiates upload on entity Z, then
  posts chunk with that uploadId via entity X path — assert success (current posture);
  update test once binding is fixed.
