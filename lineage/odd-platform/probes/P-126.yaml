expected_outcome: |
  Stress question (Category B + F, batch-ZD IntegrationController controller-class
  interrogation): IntegrationController.getIntegration({unknown-id}) — does the
  implementation return 204 No Content (current static-inferred trace via
  Mono.justOrEmpty + .map + ResponseEntity::ok producing Mono.empty), 404
  (with a switchIfEmpty + NotFoundException), or something else? AND: what is
  the response body and content-type for the unknown-id case?

  Hypothesis from the static trace: the reactive chain
    Mono.justOrEmpty(registry.get(unknown)) → .map(integration -> mapper.map(...)) → .map(ResponseEntity::ok)
  collapses to Mono.empty on the missing id; Spring WebFlux's reactive
  controller-return semantics translate Mono.empty to `204 No Content` with no
  body and no content-type header. The OpenAPI declares only `200` (no `404`,
  no `204`); the live API-reference doc page (WebFetched 2026-05-25) does not
  specify the missing-id behaviour. SDK generators auto-generating handlers
  for the `200`-only contract may misinterpret 204 as an unexpected response
  or, worse, as a successful empty-payload result.

  Secondary pins:
  (a) installed=false constant (the dead-field claim from IntegrationMapper:27, 30);
  (b) platform_url default-placeholder substitution (operator-confusion vector);
  (c) case-insensitive lookup (registry comparator behaviour);
  (d) baseline list endpoint response shape with one overlay-added wizard.

  PASS = unknown_status == 204 + known_status == 200 + known_uppercase_status == 200
  + installed=false on both list and detail + platform_url substituted as the
  default placeholder. FAIL on any of these surfaces a regression in either
  the controller's reactive chain, the mapper's installed-constant mapping,
  the StaticArgumentMappingContext substitution, or the TreeMap's
  case-insensitive comparator.
