  - "TEST-GAP-308 (sibling backend gap — getPopular has no auth gate per getPopular sidecar)"
  - "P-09 read-collaborative posture"
proposed_action: |-
  Three Vitest tests. (1) identity=true, ownership=true — assert OwnerEntitiesList renders. (2) identity=true, ownership=false — assert OwnerAssociationForm renders, OwnerEntitiesList does NOT. (3) identity=false — assert form does not render either way (upstream gate). Add comment block documenting that the API path is bypassable.
