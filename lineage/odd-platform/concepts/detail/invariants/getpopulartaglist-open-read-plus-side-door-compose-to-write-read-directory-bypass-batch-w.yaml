mitigations_unimplemented:
  - |-
    SIMPLE FIX A (close the open-read): add a SecurityRule for
    GET /api/tags at SecurityConstants.java:138-142, gated by
    TAG_CREATE (or a new TAG_READ permission). Mirrors the
    closed-read pattern on Owner-association-request (the only
    GET endpoint currently in SECURITY_RULES).
  - |-
    SIMPLE FIX B (close the write side-door): refactor
    tagService.getOrCreateTagsByName into two methods:
      - getByName (no permission needed; pure read)
      - createIfMissing (requires TAG_CREATE; novel-name path)
    Call sites at the 4 side-door entry points then need to invoke
    createIfMissing AND check the caller's TAG_CREATE permission
    before bypassing. Same architectural fix as the namespace
    side-door at batches U + W.
  - |-
    SIMPLE FIX C (introduce per-Tag namespace/ACL for multi-tenant
    deployments): the Tag directory becomes namespace-scoped at the
    SQL level; getPopularTagList filters by the caller's
    namespace-scope; the side-doors mint within the per-entity-owner's
    namespace. Higher-cost but resolves the cross-tenant pollution
    class.
  - |-
    Document the compound bypass on the
    /features/data-discovery/tagging live doc page. Operators
    wiring RBAC policies need to know that DATA_ENTITY_TAGS_UPDATE
    grants implicit TAG_CREATE for novel names. Surface as an
    admonition block.
  - |-
    Add @ActivityLog to the 3 TagServiceImpl directory-mutation
    methods (bulkCreate, update, delete). Requires
    ActivityEventTypeDto to gain TAG_CREATED / TAG_UPDATED /
    TAG_DELETED values (cross-link to
    f-006-audit-silence-enum-rooted-deeper-than-schema-rooted).
  - |-
    Regression test: authenticate as a user with ONLY
    DATA_ENTITY_TAGS_UPDATE on a single entity. Hit
    GET /api/tags?size=999. Assert the response includes tags
    from OTHER entities the user does not own. Hit
    PUT /api/dataentities/{entity_id}/tags with a novel tag name.
    Assert the next GET /api/tags shows the new tag. Pins the
    current behaviour; once the fix lands, the test asserts
    closed-read + closed-write.
  - |-
    Cross-pillar audit follow-up — enumerate every per-entity
    write permission (DATA_ENTITY_TAGS_UPDATE, DATASET_FIELD_TAGS_UPDATE,
    TERM_TAGS_UPDATE, DATA_ENTITY_TERMS_UPDATE, etc.) AND verify
    whether each grants implicit creation of a directory primitive
    (Tag, Term, Owner, Namespace, etc.). Same architectural class
    as the existing cross-pillar follow-up from
    namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths.

notes: |-
  STRENGTHENED batch VAL-LSN-019 (2026-05-20) — TagServiceImpl
  service-tier zero-auth confirmation pins the design choice across
  ALL nine public methods. The maintainer's explicit pattern (no
  @PreAuthorize anywhere in the file; no programmatic permission
  checks; the controller perimeter is the SOLE defence) is now
  triple-anchored across controller + service + repository sidecars.

  This invariant captures the FIRST controller-class-level
  enumeration of the FULL bypass picture for the Tag directory.
  Previous batches established each half separately:
    - batch F-K-U focused on the WRITE side-door
    - batches D-F-H-J-M established the read-collaborative posture
      pattern across many surfaces (24+ corroborating sidecars)
    - batch W was the FIRST controller-class-level confirmation that
      THIS specific controller — TagController — exhibits BOTH halves
      simultaneously, AND surfaces the architectural intent (the dual
      create-shape design between bulk-explicit and upsert-side-door
      is INTENTIONAL per implicit_adrs.[5])
    - batch VAL-LSN-019 PROMOTES the architectural intent observation
      to triple-anchored evidence — the service-tier confirms the
      maintainer's INTENT (zero auth at this layer is by design) and
      enumerates the FULL call-site graph (4 side-doors with their
      respective per-feature permissions)

  The architectural intent observation is load-bearing: the
  maintainer wrote TWO distinct service methods (bulkCreate for
  the gated path, getOrCreateTagsByName for the side-door) with
  DIFFERENT conflict semantics. The choice was deliberate. The
  question for the maintainer is: should the dual-method shape
  REMAIN, with explicit TAG_CREATE-permission-gating added inside
  getOrCreateTagsByName? Or should the dual shape be COLLAPSED
  into a single bulkCreate-everywhere model that surfaces conflicts
  uniformly?

  Cross-cutting connections:
    - STRENGTHENS spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create
      (the WRITE half — was 1-sidecar-1-call-site; now 1-sidecar-4-call-sites
      with the architectural intent + the read-side context)
    - Pairs with namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths
      (the broader pattern — Tag is the FIRST closed picture for
      this class; Namespace will follow when its read-side
      surfaces are similarly enumerated)
    - Pairs with read-collaborative-cross-owner-enumeration (the
      24+ no-SecurityRule read surfaces; the open-read on
      getPopularTagList is one of them — distinguished here by
      composing with the write-side)
    - Pairs with audit-log-presence-asymmetry-2-tier-audit-story
      (the compound is forensically dark — neither side emits
      Activity events for the directory mutations)
    - Pairs with deletetag-cascade-asymmetric-orphans-tag-to-dataset-field
      (the cascade asymmetry + the directory bypass
      compound: per-entity-editor creates rows that operator
      cleanup cannot remove)
    - **NEW batch VAL-LSN-019** — pairs with
      lsn-019-listmostpopular-name-vs-behavior-drift-pagination-precedes-ranking
      (the open-read endpoint also LIES about its ordering — both
      defenders and attackers have wrong mental models when they
      enumerate the directory)

