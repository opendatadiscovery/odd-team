name: Data-Entity Detail-Page Shell (DataEntityDetails React component)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: |-
  **NEW CONCEPT, batch 2026-05-19J** — the per-entity detail-page top-level React
  component at `odd-platform-ui/src/components/DataEntityDetails/DataEntityDetails.tsx`.
  Every navigation to `/dataentities/{id}/*` mounts this single component, which
  orchestrates the data-fetch lifecycle, renders the persistent shell (header + tabs
  strip + content slot via nested `<Routes>`), and gates child components on a
  `WithPermissionsProvider` permissions context. **The component owns the data-fetch
  lifecycle, not the route shell or a feature provider** — the decision is to
  colocate fetching at the page-component layer rather than at a route loader or
  outer context. Pattern is consistent across the platform's other detail pages.
  **Render contract**: Skeleton + content + error are EXCLUSIVE renders, but the
  routes outlet (`<DataEntityDetailsRoutes />`) renders UNCONDITIONALLY (line 115).
  Child route components handle their own loading state independently. **Permissions
  via context**: the header is wrapped in `WithPermissionsProvider` carrying 3
  allowedPermissions (`DATA_ENTITY_INTERNAL_NAME_UPDATE`, `DATA_ENTITY_GROUP_UPDATE`,
  `DATA_ENTITY_STATUS_UPDATE`) + the `resourcePermissions` selector result. **5
  Redux thunk dispatches per mount, 6 backend HTTP requests per mount** (due to
  LSN-017): 2x fetchDataEntityDetails (the LSN-017 doubling), 1x
  fetchDataEntityAlertsCounts, 1x fetchDataSetQualityTestReport, 1x
  fetchDataSetQualitySLAReport, 1x fetchResourcePermissions. The mount-only second
  useEffect (lines 66-76) issues 4 fetches keyed on dataEntityId alone (no LSN-017
  bug). 13 sub-routes render below the persistent shell via DataEntityDetailsRoutes
  (Overview / Structure / Lineage / Test reports / History / Alerts / Linked
  entities / Activity / Discussions / Query examples / Data / Relationships).
