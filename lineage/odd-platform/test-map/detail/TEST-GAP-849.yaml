  - "Lineage.md:concepts.invariants.[4] — 'The dataEntityId is parseInt(...,10) of a URL segment. A malformed URL like /dataentities/foo/lineage yields NaN.'"
behaviour: |-
  **LOW — Malformed URL `:dataEntityId` yields `NaN` with no client-side guard at TWO components. Project-wide pattern.** `routes/dataEntitiesRoutes.ts:47-58` calls `parseInt(dataEntityId, 10)` with no `Number.isNaN` check. If the route param is `'abc'` (manually-typed bad URL, mis-encoded query string, etc.):

  **DataEntityDetails.tsx** (line 32 + 57): dispatches `fetchDataEntityDetails({ dataEntityId: NaN })` — travels through the API client to backend as literal string `'NaN'` → likely 404 → no UI-side error at source.

  **Lineage.tsx** (line 13 → HierarchyLineage.tsx:44-67): dispatches `fetchDataEntityDownstreamLineage({dataEntityId: NaN})` → backend `GET /api/dataentities/NaN/lineage/downstream` → likely 400 Bad Request → AppErrorPage at HierarchyLineage tier.

  **The shell could short-circuit with a `Number.isFinite(dataEntityId)` guard; it does not.** The dispatcher Lineage.tsx makes the routing decision based on Redux's `entityClasses` lookup, which returns `isDEG: false` on undefined classes → silently routes to `<HierarchyLineage />` with NaN — masking the route-param error one layer deep.

  **TermDetails has the same gap** (routes/termsRoutes.ts:60) per DataEntityDetails.md note — project-wide pattern.

  **Why LOW**:
  - **UX-only impact** — the failure surfaces (backend 400/404), just at the wrong layer
  - **No data integrity / security implications**
  - **Bounded** — manually-typed bad URLs are rare in practice
  - **Easy fix** — single-line `Number.isFinite` guard at each component or at `useDataEntityRouteParams()`

  **Test gap shape**: Cross-component test asserting NaN-route-param handling at the THREE consumer sites (DataEntityDetails, Lineage, TermDetails).
