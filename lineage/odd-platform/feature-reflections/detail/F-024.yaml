- id: H-013
  hypothesis: "A first-time operator can tell from the Dictionary screen how to use it — whether the catalog is empty vs their query missed, and what to do next — and the interaction is consistent with the rest of the platform's faceted-search surfaces."
  derivation: "Senior-product-owner UX (Rule 9) — 'does the user understand how to use this from what is on screen; is it intuitive and consistent across the platform?'"
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      Consistency: GOOD — the Dictionary tab uses the SAME PageWithLeftSidebar layout,
      the SAME URL-backed server-session model, and the SAME facet-sidebar +
      infinite-scroll pattern as the Discovery /search surface (TermSearch.md concepts
      + invariants[0]; sibling Search.tsx). An operator who learned /search transfers
      the mental model directly. Understandability: WEAK — the single empty-state copy
      'No matches found' is shown for BOTH "fresh catalog, zero terms" AND "your
      filter returned nothing" (TermSearch.md bugs_limitations_corner_cases[8]); a
      day-one operator cannot distinguish "glossary is empty, go create a term" from
      "my search missed", and the empty state does not point at the 'Add term' button.
      Combined with H-004 (empty-first-view) the first-run experience actively
      misleads.
