security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  - S2S
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      SECURITY_RULES gates ROLE_CREATE / ROLE_UPDATE / ROLE_DELETE at
      lines 169-173 (NO_CONTEXT MANAGEMENT-tier). GET /api/roles is
      permitAll under SECURITY_RULES — any authenticated user can list
      roles. Under `auth.type=DISABLED` the gate is INERT
      (DisabledAuthSecurityConfiguration). Under `auth.type=LOGIN_FORM`
      the AuthorizationCustomizer is NOT wired and every form-authenticated
      user is ADMIN with effective ROLE_CREATE. Under any non-DISABLED
      mode with `auth.s2s.enabled=true`, any X-API-Key caller is injected
      as ADMIN (S2sAuthenticationFilter.java:31-39) and holds ROLE_CREATE
      globally — REFACTOR-108.
      **STRENGTHENED batch N — SQL primary source confirms**:
      ReactiveRoleRepositoryImpl has NO authorization annotations
      whatsoever; defence-in-depth is null; a direct service-bypass
      invocation reaches the SQL with no caller-ID check. Authorization
      is the upstream controller / service layer's responsibility. The
      repository CRUD is role-AGNOSTIC at the persistence layer
      (implicit_adrs.[4]) — consistent with the policy-AGNOSTIC pattern
      from batch H.
  owner_scoping:
    verdict: N/A
    detail: |-
      Roles are platform-global; not owned by any Owner. They ARE the
      binding between Permission bundles and Owners. GET /api/roles is
      permitAll under SECURITY_RULES (no list-roles gate).
  strengths:
  - '`@ReactiveTransactional` wraps the create flow (RoleServiceImpl.java:50) — no
    orphan role rows without their policy relations (createRole.md:implicit_adrs.[3])'
  - Partial-unique partial-index `role_name_unique` on `role(name) WHERE deleted_at
    IS NULL` (V0_0_55__add_policies_and_roles.sql:42) — DB-level name uniqueness enforcement
  - Role-policy relation is rewritten ENTIRELY on every update (`deleteRoleRelationsExcept`
    then `createRelations`); INSERT-only on create. Edges owned by Role, not Policy
    (createRole.md:implicit_adrs.[2])
  - |-
    **NEW batch N — centralised friendly-error translation via
    ExceptionUtils.translateDatabaseException** (JooqReactiveOperations.java:41)
    — every R2DBC query maps `DataAccessException` →
    `UniqueConstraintException` with per-constraint human-readable
    message (e.g. ROLE_NAME_UNIQUE → "Role with this name already
    exists"). Consistent with the batch-H Policy-side translation.
    (ReactiveRoleRepositoryImpl.md:implicit_adrs.[2])
  - |-
    **NEW batch N — Soft-delete-via-deleted_at with consolidated
    schema**. Role has cleanly consolidated on `deleted_at` as the
    canonical soft-delete predicate — V0_0_64 DROPPED the redundant
    `is_deleted` boolean column. Cleaner schema than batch-H Policy
    (where `is_deleted` remains in the DDL as dead schema).
    (ReactiveRoleRepositoryImpl.md:bugs_limitations_corner_cases.[7])
  - |-
    **NEW batch N — listDto CTE pagination correctness**. The CTE-then-join
    pattern correctly decouples row-multiplicity from page size. A role
    with 10 policies appears as ONE row in the result Page (not 10
    rows). Same pattern as batch-K TermServiceImpl + batch-I
    DataEntityServiceImpl.
    (ReactiveRoleRepositoryImpl.md:implicit_adrs.[5])
  weaknesses:
  - '**Administrator-name reservation asymmetry on create (HIGH)** — `update` (RoleServiceImpl.java:67-69)
    + `delete` (lines 81-84) check `UserProviderRole.values()`; `create` (lines 51-61)
    does NOT. If the seeded Administrator row is hard-deleted (e.g. direct SQL bypassing
    soft-delete), this endpoint can recreate a row named `Administrator` with attacker-chosen
    policies. The unique-index is the only fence and depends on the seeded row remaining
    present. (createRole.md:security.known_security_gaps.[0]).
    **STRENGTHENED batch N (DRIFT-FACET-C)**: the partial-unique-index
    design `role_name_unique ... WHERE deleted_at IS NULL` MAKES the
    gap exploitable — a direct DB UPDATE that soft-deletes the seeded
    Administrator row leaves the name available; the service-layer
    create path has NO name protection. The schema is correct; the
    gap is at the service layer.
    (ReactiveRoleRepositoryImpl.md:bugs_limitations_corner_cases.[DRIFT-FACET-C])'
  - '**No audit log on role mutations (HIGH)** — `RoleServiceImpl.create/.update/.delete`
    emit no `@Slf4j` log lines, publish no events, and insert into no audit table.
    A hijacked admin can rewrite the authorization model invisibly. Activity feed
    does NOT cover Role / Policy / Permission mutations. (createRole.md:security.known_security_gaps.[1]).
    **NEW BATCH N — SQL PRIMARY SOURCE CONFIRMATION**: the Role repository
    emits ZERO security-relevant log lines on any of {create, update,
    delete}. Symmetric to Policy-repo batch H. The 3-sidecar pattern is
    now 5-sidecar (Role-controller + Policy-controller + Owner-controller
    + Policy-repo batch H + Role-repo batch N) at the SQL primary
    source. The cross-batch concept catalog entry
    `no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f`
    is REFINED by this batch with a SECOND repository confirmation
    (Role symmetric to Policy).
    (ReactiveRoleRepositoryImpl.md:bugs_limitations_corner_cases.[DRIFT-FACET-B] +
    downstream_side_effects)'
  - '**Under `auth.type=DISABLED`, ROLE_CREATE is bypassed entirely (HIGH on DISABLED
    deployments)** — combined with anonymous ADMIN principal under DISABLED, an attacker
    can issue `POST /api/roles` with a custom Administrator-equivalent policy attached.
    (createRole.md:security.known_security_gaps.[2])'
  - '**Under LOGIN_FORM/OAUTH2/LDAP with `auth.s2s.enabled=true`, any X-API-Key holder
    can create roles (HIGH — REFACTOR-108)** — S2sAuthenticationFilter.java:31-39
    grants ADMIN globally, not scoped to ingestion. (createRole.md:security.known_security_gaps.[3])'
  - |-
    **NEW HIGH BATCH N — RBAC soft-delete persistence on Role
    aggregation methods**. ReactiveRoleRepositoryImpl's THREE custom
    dto methods (getDto / listDto / getByName) do NOT filter
    `policy.deleted_at IS NULL` on the joined POLICY rows. A
    soft-deleted Policy with surviving `role_to_policy` bindings
    shows up aggregated into the `policy_relations` JSON returned to
    the caller. SYMMETRIC MIRROR of batch-H's ReactivePolicyRepositoryImpl.getRolesPolicies
    finding. Both repositories exhibit the bug class. Single-line fix
    at each of FOUR sites (3 in Role-repo, 1 in Policy-repo) closes
    the bug class.
    (ReactiveRoleRepositoryImpl.md:concepts.invariants.[1] +
    bugs_limitations_corner_cases.[DRIFT-FACET-A] +
    rbac-soft-delete-persistence-role-policy-aggregation-symmetric-policy-mirror.yaml
    NEW invariant batch N)
  - '**No validation that policy ids reference live, non-soft-deleted Policies (MEDIUM)**
    — FK-error surfaces as 500; soft-deleted Policy ids may still satisfy the FK depending
    on `role_to_policy` semantics (unverified). (createRole.md:security.known_security_gaps.[4])'
  - '**Role rows vs. LDAP / OAuth2 group mapping confusion (MEDIUM — doc gap)** —
    LDAP admin-groups + OAuth2 admin claims map DIRECTLY to `UserProviderRole.ADMIN/.USER`,
    NOT to platform Role rows. Operators reasonably expect a role named `admins` to
    be auto-granted to LDAP users in `admin-groups`; it is not. (createRole.md:security.known_security_gaps.[7])'
  - '**Case-sensitivity mismatch (LOW)** — delete uses `equalsIgnoreCase`; update
    uses case-sensitive `.equals`. Inconsistent guard. (createRole.md:bugs_limitations_corner_cases.[case-sensitivity
    mismatch])'
  cross_file_inconsistencies:
  - Role + Policy + Owner CRUD all share the same Administrator-name-on-update-but-not-create
    asymmetry pattern AND the no-audit-log pattern. Catalog records both as cross-cutting
    invariants. **STRENGTHENED batch N — symmetric Role-repo confirmation now anchors
    the pattern at the SQL primary source for BOTH halves of the RBAC mutation surface.**
  - Live `/authorization/roles` page describes Roles as 'useful for combining multiple
    policies together' but does NOT document the `POST /api/roles` creation surface,
    the ROLE_CREATE permission, the partial-unique-name index, the predefined-name
    protection, the spec-vs-code 201-vs-200 drift, the audit-logging absence, or the
    LDAP/OAuth2-group-mapping relationship.
  - |-
    **NEW batch N — three repository-doc-gaps from ReactiveRoleRepositoryImpl
    docs_link_semantic.doc_drift_findings**:
      REPOSITORY-DOC-GAP-A (mirrors batch-H REPOSITORY-DOC-GAP-A on
      Policies): soft-delete-aware recreation invariant undocumented on
