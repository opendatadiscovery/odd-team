  - openapi-tag:dataEntity.implicit_adrs[1]
  - AlertController.performance.known_performance_gaps[0]
  - DataEntityController.performance.known_performance_gaps[0]
  - DataEntityAttachmentController.performance.known_performance_gaps[4]
  - |-
    getAllAlerts.bugs_limitations_corner_cases[1]: unbounded at every
    layer — controller no validation, AlertApi @NotNull @Valid only,
    repository OFFSET=(page-1)*size with no clamping
  - |-
    getActivity.bugs_limitations_corner_cases[3]: size has no documented
    or enforced upper bound; size=Integer.MAX_VALUE only safeguarded by
    DB query plan
  - |-
    SearchController.search.performance.known_performance_gaps[1]:
    `getSearchResults` size on the generated SearchApi carries @NotNull
    but no @Min/@Max — same shape as REFACTOR-024; `size=1_000_000`
    accepted structurally
  - |-
    **NEW batch L STRENGTHENS** —
    getDataEntityAlerts.bugs_limitations_corner_cases.[2]: pagination
    parameters are unbounded at every layer this method touches.
    components.yaml:4213-4229 has no minimum/maximum; controller's
    Integer page, Integer size are unannotated; repository computes
    OFFSET=(page-1)*size at ReactiveAlertRepositoryImpl.java:189 with no
    clamping. AMPLIFIED RISK — the audit-export workaround on the
    alerting page recommends this endpoint and operators will use large
    pages for complete exports.
