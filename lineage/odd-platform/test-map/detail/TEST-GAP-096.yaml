gap_id: TEST-GAP-096
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
surfaced_by:
- regenerateCollectorToken.md:tests_coverage_semantic.uncovered_behaviours.[3]
behaviour: Authorization-gate regression test for token rotation — `SecurityRule(NO_CONTEXT,
  /api/collectors/{collector_id}/token, PUT, COLLECTOR_TOKEN_REGENERATE)` (SecurityConstants.java:135-137).
  No test asserts that a user without the MANAGEMENT-tier `COLLECTOR_TOKEN_REGENERATE`
  permission gets 403 on the endpoint. A future SecurityConstants typo or rule deletion
  would silently disable the gate.
test_files_existing:
- odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/CollectorRepositoryImplTest.java
  (repository-layer; covers list/create/update/delete data access, NOT token rotation
  flow)
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/CollectorTokenRegenerationAuthorizationTest.java
  name: regenerateCollectorToken_authenticatedCallerWithoutPermission_returns403
evidence:
- 'regenerateCollectorToken.md says: ''A regression that (a) silently disables COLLECTOR_TOKEN_REGENERATE
  permission enforcement (e.g. SecurityConstants typo / rule deletion) ... would not
  be caught by the current test suite'''
- 'concepts.yaml:entities[Collector].security_aggregate.authorization_consistency
  verbatim: ''CONSISTENT ... The gate is correctly wired — the weakness is what the
  operation EXPOSES, not whether it''s gated.'''
- 'Grep against `odd-platform-api/src/test` for `CollectorController|regenerateToken|TokenGenerator`:
  0 matches (verified 2026-05-10)'
cross_references:
- concepts.yaml:entities[Collector].security_aggregate.weaknesses.[0,1,2,3,4,5,6]
proposed_action: Add `@WebFluxTest` test asserting (no-permission, has-MANAGEMENT-tier-but-not-this-permission,
  has-COLLECTOR_TOKEN_REGENERATE) → (403, 403, 200). Lock the wiring.
