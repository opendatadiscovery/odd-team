phase1_outcomes:
  - target: getDataSourceList
    status: success
    agent_id: afb41cc3be07da39d
    sidecar: lineage/odd-platform/understanding/odd-platform__java__DataSourceController__controller-method__getDataSourceList.md
    probes: [P-034, P-035, P-036, P-037]
    headline: |-
      GET /api/datasources has NO SecurityRule. The list projection DOES carry
      collector token material but masks it API-side via TokenMapper.mapValue
      gated by TokenDto.showToken — false on the list path
      (ReactiveDataSourceRepositoryImpl.java:167) vs true on register/regenerate.
      One-line regression surface at line 167 would leak full plaintext tokens to
      every authenticated user. 30 stress questions (22 STATIC-INFERRED / 7
      PROBE-NEEDED / 1 REFERENCE). Probes: P-034 list ordering id ASC undocumented,
      P-035 token-form masking, P-036 REFACTOR-425 phantom total on empty page,
      P-037 size unbounded.
  - target: registerDataSource
    status: success
    agent_id: ae95b088392f01225
    sidecar: lineage/odd-platform/understanding/odd-platform__java__DataSourceController__controller-method__registerDataSource.md
    probes: [P-038, P-039, P-040, P-041]
    headline: |-
      POST /api/datasources is gated only by DATA_SOURCE_CREATE, yet its
      namespace_name field silently calls namespaceService.getOrCreate
      (NamespaceServiceImpl.java:37-40) — a least-privilege operator creates
      namespaces without NAMESPACE_CREATE. Primary-source confirmation of the
      batch-W class sidecar flag. Also confirmed: 200-not-201 status drift
      (DataSourceController.java:35 vs openapi.yaml:454) and API-side plaintext
      token in the create response (ReactiveTokenRepositoryImpl.java:26 sets
      showToken=true). 30 stress questions (26 static-inferred / 4 probe-needed).
      Probes: P-038 status drift, P-039 namespace bypass, P-040 plaintext token,
      P-041 transactional rollback-on-collision.
  - target: updateDataSource
    status: success
    agent_id: a6c63626c6ac4ac00
    sidecar: lineage/odd-platform/understanding/odd-platform__java__DataSourceController__controller-method__updateDataSource.md
    probes: [P-042, P-043, P-044]
    headline: |-
      updateDataSource does NOT share batch-I's silent-UPDATE-on-missing pattern —
      DataSourceServiceImpl.update (DataSourceServiceImpl.java:71-72) does
      getDto(id).switchIfEmpty(NotFoundException) and getDto filters
      deleted_at IS NULL, so a missing OR soft-deleted id returns a clean 404.
      BUT it is a full-form REPLACE-not-MERGE: MapperConfig sets no
      nullValuePropertyMappingStrategy so MapStruct's default SET_TO_NULL nulls
      any omitted field — an operator editing only the name silently wipes the
      description and detaches the namespace (data-loss-class). DataSourceUpdateFormData
      has exactly 3 fields (name/description/namespace_name); connectionUrl column
      dropped by V0_0_71. 25 stress questions (17 STATIC-INFERRED / 8 PROBE-NEEDED).
      Probes: P-042 existence-check, P-043 replace-vs-merge nulling, P-044 auth matrix.
  - target: deleteDataSource
    status: success
    agent_id: aa504098e9a00c8a8
    sidecar: lineage/odd-platform/understanding/odd-platform__java__DataSourceController__controller-method__deleteDataSource.md
    probes: [P-046, P-047, P-048]
    headline: |-
      deleteDataSource is a guarded SOFT-delete that drifts from its name — it
      BLOCKS with HTTP 400 if any live data_entity child exists (an actively-ingested
      source is effectively undeletable, undocumented), and even on success it
      ORPHANS the token row (the token table has no deleted_at and no GC path —
      the exact orphan-token pattern batch W confirmed for Collector delete) and
      leaves the FTS search_entrypoint vector uncleared. Live docs describe delete
      only as "remove a source no longer ingested" with zero operational detail.
      16 stress questions (11 STATIC-INFERRED / 3 PROBE-NEEDED / 2 REFERENCE).
      Probes: P-046 orphan-token, P-047 cascade block/allow, P-048 FTS uncleared.
  - target: regenerateDataSourceToken
    status: success
    agent_id: aacc4bd9a2e0ad224
    sidecar: lineage/odd-platform/understanding/odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken.md
    probes: [P-050, P-051, P-052]
    headline: |-
      CROSS-BATCH CORRECTION of the batch-W class sidecar — regenerateDataSourceToken
      is confirmed primary-source MISSING @ReactiveTransactional
      (DataSourceServiceImpl.java:99, vs annotated siblings at 52/69/86) but this
      is a LOW-severity code-smell, NOT an atomicity bug: the only DB write
      (tokenRepository.updateToken) is a single atomic statement and
      tokenGenerator.regenerateToken is purely in-memory, so no
      old-invalidated-but-new-not-persisted lockout window can occur. The genuine
      HIGH findings are operational/security: destructive in-place rotation with no
      grace period (collector locked out the instant the UPDATE commits), plaintext
      token returned and stored unhashed, RandomStringUtils.randomAlphanumeric
      (not SecureRandom), no audit log / no Activity Event, and auth.type=DISABLED
      permission-bypass = credential-rotation-hijack surface. 22 stress questions
      (16 STATIC-INFERRED / 6 PROBE-NEEDED). Probes: P-050 concurrent double-rotation,
      P-051 binary cutover old-401/new-200, P-052 RBAC matrix incl DISABLED-bypass.
