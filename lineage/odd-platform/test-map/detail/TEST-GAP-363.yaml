behaviour: '**AlertManager WEBHOOK AUTH-GATING TEST.** The AlertManager webhook path
  does NOT go through IngestionDataEntitiesFilter — the filter only matches `/ingestion/entities`
  POST, not `POST /ingestion/alert/alertmanager`. The data flows into `createAlerts`
  via `handleExternalAlerts` with no S2S-token check, no DataEntity-scope check, and
  no validation of the untrusted `labels.entity_oddrn` against the calling principal.
  Combined with `auth.type=DISABLED` (dev mode default), any caller can POST AlertManager-shaped
  payloads and create OPEN alerts attributed to any data entity ODDRN. Plus the controller
  has a `// TODO: define OpenAPI spec based on alert provider contract` comment signalling
  the endpoint is unaudited. Plus `createAlerts` has NO ON CONFLICT semantics — duplicate
  webhook calls insert duplicate ALERT rows. test_class: security / integration. STRENGTHENED
  batch P — the AlertManagerController#postAlerts sidecar PRIMARY-SOURCE at the
  method tier consolidates ALL FOUR drift facets into one method''s evidence: (1)
  AlertManagerController.java:21-26 has NO @PreAuthorize / @Secured / programmatic
  check (unauthenticated_payload_trust); (2) `req.getAlerts()` passed verbatim to
  AlertService with no validation step (cross_tenant_alert_creation); (3) NO Idempotency-Key
  header inspection, NO idempotency field in the request DTO, downstream skips AlertActionResolver
  (no_idempotency); (4) NO log.info on entry, NO @Timed counter, NO correlation-id
  capture (no_audit_log). This is the F-007 mega-gap consolidation at the method
  tier — the in-platform ingestion path through AlertActionResolver and applyAlertActions
  (AlertServiceImpl.java:222-227) DOES dedup, but handleExternalAlerts (lines 151-191)
  DELIBERATELY skips that path. Severity remains CRITICAL.'
