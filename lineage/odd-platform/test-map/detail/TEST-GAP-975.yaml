behaviour: |-
  **MEDIUM — OwnerController class-level zero observability: no @Slf4j logger, no log calls in any of the four method bodies (OwnerController.java:21-54), no @ActivityLog on any of the three mutating service paths (REFACTOR-426). Combined with the no-@ActivityLog finding, the four-method controller is FORENSICALLY SILENT at every observability layer. A regression that returns the wrong owner or fails silently at the service tier surfaces only as a 500/4xx in the access log; the caller's identity and the request payload are not in the application log.**

  Verified at primary source:
  - `OwnerController.java:1-55` — no logger field, no `log.info`/`debug`/`warn`/`error` calls.
  - `OwnerServiceImpl.java:1-123` — no logger either (verified by Grep `private static final.*Logger` 2026-05-25 — zero matches).
  - The three mutating service methods (`OwnerService.create`, `update`, `delete`) do NOT carry `@ActivityLog` (REFACTOR-426 — cross-batch sidecar).

  **The four-method controller is silent at every layer**:
  - Controller layer: no log call, no MDC enrichment.
  - Service layer: no log call.
  - Activity Feed layer: no @ActivityLog → no operator-visible audit-trail row.
  - Default Spring access log: captures request line + status + elapsed only (no caller identity, no payload).

  **Operator-visible failure modes**:
  - A regression at the service tier (e.g. `update` silently dropping role bindings — REFACTOR-425) emits NO trace at any observability layer. The bug is detectable ONLY by reading the response body's `roles: []` field — which most clients don't.
  - A silent owner mint via `getOrCreate` side-channel (per TEST-GAP-683) leaves NO log entry.
  - A wrong-owner-delete (in case of UI race condition) leaves no diagnostic trail.

  **Why MEDIUM**:
  - Observability is plumbing; the absence is operationally costly but not data-loss-inducing.
  - Combined with TEST-GAP-683 (getOrCreate bypass) + TEST-GAP-962 (GET unauthenticated read) + TEST-GAP-731 (REFACTOR-425 empty-roles destruction) + the no-@ActivityLog finding, the F-019 Owner Lifecycle subsystem has multiple silent-failure modes that compound. Observability is the SINGLE cross-cutting fix that turns "silent" into "diagnosable".

  **Distinguishes**: this is a CROSS-CUTTING class-level concern; no prior TEST-GAP covers the OwnerController-specific zero-observability surface as a class.
