proposed_action: |-
  Add `DatasetFieldDescriptionVerbatimStorageTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `updateDescription_xssPayloadPersistedVerbatim_pinsColumnLevelF004Fingerprint` — PUT description body `<script>alert("XSS")</script>`; GET via DB query; assert dataset_field.internal_description contains the verbatim string. PIN the no-backend-sanitisation contract.
  2. `updateDescription_imgOnerrorPayload_persistedVerbatim_pinsImageElementVector` — PUT description `<img src=x onerror="alert(1)">`; assert verbatim persistence. PIN the img-element vector.
  3. `updateDescription_javascriptUriPayload_persistedVerbatim_pinsJavascriptScheme` — PUT description `[click](javascript:alert(1))`; assert verbatim persistence including the javascript: scheme. PIN the markdown-link-scheme vector.
  4. `getDescription_xssPayloadReturnedVerbatim_pinsAPIResponse` — after test 1 sets the value; GET description endpoint; assert the response body contains the verbatim XSS payload. PIN that the API returns unsanitised content; UI render is the sole defense.

  Pair with UI-side test: WebDriver-driven render test asserting Markdown.tsx strips dangerous tags on the DatasetField description tab specifically (cross-tab coverage). Pair with REFACTOR-NNN: add backend sanitiser OR document the single-layer design. Pair with DOC-NNN: surface the verbatim-storage caveat.
