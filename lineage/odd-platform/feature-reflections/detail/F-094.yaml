        cite: "SecurityConstants.java:95-96 + AuthorizationCustomizer.java:22 + LoginFormSecurityConfiguration.java:49-51"
        note: "All four UI modes whitelist /ingestion/**; ingestion auth is orthogonal to auth.type."
    operator_visible_failure: |
      The operator who "turned on auth" (e.g. OAUTH2 for the UI) believes the
      whole platform now requires a credential and leaves the ingestion filter
      off — shipping an open write surface behind a protected UI. This is the
      exact split the P-09 doc warns about ("Enabling one does not protect the
      other") but the operator who reasons from auth.type alone misses it. The
      live enable-security page now discloses this (2026-05-27); the residual
