terminal_side_effect:
  side_effect_class: page-render
  description: |-
    HTTP 200 JSON response enumerating every configured property KEY name
    + (masked or unmasked, depending on `show-values` setting) VALUE.
    Field-name leak is unfixable — KEY enumeration alone reveals which
    auth providers are configured (Google + Azure + LDAP all show up as
    distinct key prefixes); JDBC URL host:port:database-name is unmasked.
  evidence: "application.yml:226-242"
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
    - drift_class: actuator_path_whitelisted_reachable_unauthenticated_every_mode
      description: |-
        `/actuator/**` is in WHITELIST_PATHS — reachable BEFORE auth in every
        mode (DISABLED + LOGIN_FORM + OAUTH2 + LDAP). An attacker scraping
        `/actuator/env` under any deployment learns the schema of configured
        credentials. Network-level mitigation (operator firewall / separate
        management port) is required; platform default does not provide it.
      evidence:
        - "SecurityConstants.java:95-96 (WHITELIST_PATHS includes /actuator/**)"
        - "application.yml (no management.server.port — actuator on main port)"
    - drift_class: value_masking_is_defence_in_depth_not_contract
      description: |-
        Spring Boot 3.4+ defaults `show-values=NEVER` (or `WHEN_AUTHORIZED`).
        Platform sets `show-values=WHEN_AUTHORIZED` at application.yml:240.
        An operator downgrading for debugging OR a pre-3.4 deployment
        inheriting older `ALWAYS` default instantly leaks every cleartext
        credential. No platform-side test asserts the masker covers every
        configured key.
      evidence:
        - "application.yml:226-242"
        - "no platform-side keys-to-sanitize override (grep returns zero)"
    - drift_class: field_name_leak_credential_schema_enumeration
      description: |-
        Even with values masked, `/actuator/env` reveals the SCHEMA of
        configured credentials: an attacker learns that OAuth2 is wired
        with Google + Azure clients (because `auth.oauth2.client.google.*`
        + `auth.oauth2.client.azure.*` keys appear), that LDAP is wired,
        that REMOTE attachment storage is configured. This is deployment
        fingerprinting beyond what `/api/appInfo` (SHB-173 / F-119)
        exposes — SCHEMA fingerprint is broader than the two values
        AppInfo returns.
      evidence:
        - "application.yml (every @Value-bound credential key surfaces)"
    - drift_class: jdbc_url_unmasked_pg_host_leak
      description: |-
        `spring.datasource.url=jdbc:postgresql://...` doesn't match
        `password|secret|key|token` masker pattern — renders verbatim. An
        attacker scanning the network learns the PG location:port:dbname.
      evidence:
        - "application.yml:7 (shipped default: jdbc:postgresql://postgres:5432/odd-platform)"
    - drift_class: shipped_default_database_password_well_known_credential
      description: |-
        `spring.datasource.password=odd-platform-password` is the shipped
        default. An operator forgetting to override deploys with a public
        well-known credential. Combined with `/actuator/env` exposure of
        the JDBC URL, deployments are one operator-override-skip away from
        full PG compromise.
      evidence:
        - "application.yml:7"
    - drift_class: lombok_data_tostring_includes_passwords_unfiltered
      description: |-
        `@Data` on ODDLDAPProperties (password field) and on
        ODDOAuth2Properties.OAuth2Provider (clientSecret field) generates
        `toString()` including the credential verbatim. NO `@ToString.Exclude`
        on any password / secret / key / token field. A future log line
        `log.info("loaded properties: {}", properties)` emits LDAP password
        cleartext. Defence-in-depth gap.
      evidence:
        - "ODDLDAPProperties.java:10,14 (@Data, password String)"
        - "ODDOAuth2Properties.java:30,34 (@Data on OAuth2Provider, clientSecret)"
    - drift_class: management_server_port_unset_actuator_on_main_port
      description: |-
        `management.server.port` is unset; actuator runs on the same HTTP
        port as the application. No operator can split actuator onto an
        internal-only port without a deliberate config change. Mitigation
        is operator-side network discipline (ingress rule / firewall);
        platform default does not encourage it.
      evidence:
        - "application.yml (no management.server.port)"
use_cases:
  # Promise layer (LSN-030 / feature-reflector v0.3.0). Each uc_id == a hypothesis id in
  # feature-reflections/detail/F-122.yaml; the full hypothesis + validation lives there.
  # This is an operator-infrastructure surface with NO UI hop — the use_cases are framed as
  # security/operator reachability promises, not screen interactions (see the reflection's
  # FIRST validation_gap: API/infrastructure-only reflection per Rule 9).
  - uc_id: F-122-UC-001
    hypothesis_id: H-001
    kind: render
    promise: "GET /actuator/env is reachable unauthenticated under OAUTH2/LDAP (whitelisted) and anonymous under DISABLED."
    actor: "unauthenticated network caller / platform-operator / security reviewer"
    trace: "SecurityConstants.java:95-96 (WHITELIST_PATHS includes /actuator/**) + concept-invariant COMPOUND-WITH-AUTH-MODE"
    coverage: verified
    covered_by: |-
      IT-065 (e2e:actuator-exposure.spec.ts it20651) — verifies the DISABLED-anonymous half LIVE: GET /actuator/env
      is NOT auth-rejected (no 401/403/302) and reaches app code (500 via the catch-all ControllerAdvice). The
      OAUTH2/LDAP half shares the SAME WHITELIST_PATHS mechanism (the path is whitelisted before auth in every mode);
      a dedicated auth-mode-variant stack would assert it directly. NB: env does NOT currently return a 200 value
      body on :latest (the catch-all masks it to 500) — the test pins reachability, not a credential dump.
    test_demand: functional
  - uc_id: F-122-UC-002
    hypothesis_id: H-002
    kind: grammar
    promise: "The actuator value-masking posture is whatever config + framework default produce, and is asserted not assumed."
    actor: platform-operator
    trace: "application.yml:226-245 (NO show-values key → framework default NEVER) — CONTRADICTS the facet's WHEN_AUTHORIZED claim"
    coverage: unverified
    test_demand: functional
  - uc_id: F-122-UC-003
    hypothesis_id: H-003
    kind: render
    promise: "spring.datasource.url renders UNMASKED in /actuator/env (PG host:port:db disclosed)."
    actor: "attacker reaching the actuator port"
    trace: "R2DBCConfiguration sidecar:191-192 + concept-invariant gap-item-1 (url not in password|secret|key|token mask)"
    coverage: unverified
    test_demand: functional
  - uc_id: F-122-UC-004
    hypothesis_id: H-004
    kind: teardown-constraint
    promise: "The platform boots without rejecting the shipped default DB password odd-platform-password (no fail-fast)."
    actor: platform-operator
    trace: "application.yml:7 + R2DBCConfiguration sidecar:194 (silent acceptance; no boot guard)"
    coverage: unverified
    test_demand: functional
  - uc_id: F-122-UC-005
    hypothesis_id: H-005
    kind: render
    promise: "/actuator/env enumerates configured OAuth2 provider key prefixes (schema fingerprint) even when secret values are masked."
    actor: "attacker / security reviewer"
    trace: "ODDOAuth2Properties sidecar:35 (Map key == per-client id → distinct env key prefix) + concept-invariant gap-item-5"
    coverage: unverified
    test_demand: functional
  - uc_id: F-122-UC-006
    hypothesis_id: H-006
    kind: teardown-constraint
    promise: "No credential field on the @Data Properties classes is emitted by toString() — @ToString.Exclude guards every password/secret/key field."
    actor: "platform-operator / future maintainer adding a log line"
    trace: "ODDLDAPProperties sidecar:107 + ODDOAuth2Properties sidecar:95 (no @ToString.Exclude; toString leaks)"
    coverage: unverified
    test_demand: functional
  - uc_id: F-122-UC-007
    hypothesis_id: H-007
    kind: teardown-constraint
    promise: "Operators can isolate actuator on a separate management port — but the platform does not do so by default."
    actor: platform-operator
    trace: "application.yml:226-245 (no management.server.port) — CONTRADICTS an isolate-by-default expectation"
    coverage: unverified
    test_demand: functional
  - uc_id: F-122-UC-008
    hypothesis_id: H-008
    kind: render
    promise: "With notifications enabled, the Slack/webhook receiver URL leaks unmasked via /actuator/env."
    actor: "platform-operator who enabled notifications"
    trace: "concept-invariant gap-item-3/4 + NotificationConfiguration known_security_gaps[2] (url not masked) — conditional on P-07 opt-in"
    coverage: unverified
    test_demand: functional
  - uc_id: F-122-UC-009
    hypothesis_id: H-009
    kind: render
    promise: "Only health/prometheus/env/info are reachable under /actuator/**; beans/configprops/heapdump/threaddump are off."
    actor: "security reviewer / platform-operator"
    trace: "application.yml:226-240 (enabled-by-default:false + explicit four-endpoint enable)"
    coverage: unverified
    coverage_note: |-
      PARTIAL — IT-065 (it20650) verifies that /actuator/health + /actuator/info serve a real 200 body anonymously
      (info discloses the build version). The on/off DISTINCTION the promise asserts (env/prometheus reachable AND
      beans/configprops/heapdump/threaddump off) is NOT HTTP-distinguishable on the :latest image: the platform's
      catch-all ControllerAdvice (@ExceptionHandler(Exception.class) → SYS001) swallows the actuator dispatcher, so
      every /actuator/* except health+info returns an INDISTINGUISHABLE 500 — whether enabled (env), disabled
      (beans), or unknown (foobar123). Verified 2026-06-07 via curl with the actuator media type. So the promise as
      stated cannot be fully verified by an HTTP probe; only the health+info-serve-200 sub-claim is verified.
    test_demand: functional
  - uc_id: F-122-UC-010
    hypothesis_id: H-010
    kind: teardown-constraint
    promise: "A regression test guards that actuator masking covers every configured credential key."
    actor: security reviewer
    trace: "HealthAPITest.java:17-21 (only /actuator/health) + SecurityRulesAuthzGapsKnownBugsTest.java:48-79 (unrelated whitelist pins) — NO such test"
    coverage: unverified
    test_demand: functional
  - uc_id: F-122-UC-011
    hypothesis_id: H-011
    kind: render
    promise: "Operator-hardening guidance (actuator isolation + password rotation) is documented; per-auth-mode actuator cross-links exist."
    actor: platform-operator
    trace: "WebFetch /configuration-and-deployment/odd-platform 2026-06-03 (hardening present) — per-auth-mode cross-link unverified (PARTIAL)"
    coverage: unverified
    test_demand: functional
