behaviour: |-
  **HIGH — `IngestionServiceImpl.ingest(...)` carries `@ReactiveTransactional` on the OUTER transaction binding the WHOLE 14-processor chain + the OTLP metric export. One failure anywhere in the 14-processor sequence rolls back the entire batch. NO test asserts this batch-atomicity-without-signal contract.**

  Per the sidecar's `concepts.invariants.[0]`: "The `@ReactiveTransactional` here is the **outer** transaction binding the WHOLE 14-processor chain (per F-008 chain hop-3) + the OTLP export — one failure anywhere rolls back the entire batch (the `batch_atomicity_without_signal` F-008 drift facet enforced at THIS line)."

  **What atomic-rollback means in practice**:
  - Inbound payload contains 1000 DataEntities + 50 lineage edges + 10 quality test results.
  - Mid-batch (e.g. processor #9 — `LineageIngestionRequestProcessor`) throws an exception.
  - Postgres rolls back the ENTIRE transaction: zero of the 1000 entities persist, zero of the 50 lineage edges, zero of the 10 quality test results.
  - The HTTP response is 5xx with a stack trace. The collector sees a generic error.
  - **No signal to the operator** about which processor failed, which entity caused it, or how to recover.

  **Compound issue**: combined with F-008's `silent_destruction_replace_not_merge` drift facet, a partial failure can leave the catalog in a confusing state for the OPERATOR (because the rollback works) but a confusing state for the COLLECTOR (because the next retry may have different inputs based on transient state).

  **Test gap shape**: Testcontainers integration test that:
  1. Constructs a payload with N entities where the Mth entity will provoke a known-failure (e.g. a malformed lineage edge referencing a non-existent parent ODDRN in a way that breaks `LineageIngestionRequestProcessor`).
  2. POSTs the payload.
  3. Asserts: 5xx response.
  4. Asserts: ZERO new entities in `data_entity` table (atomic rollback verified).
  5. Asserts: ZERO new lineage rows in `lineage` table.
  6. Asserts: ZERO new metadata bindings.
  7. Asserts: OTLP export did NOT fire (the OTLP step is downstream of the failing processor in the same transaction).

  PINS the all-or-nothing contract.

  **Why HIGH**: the contract is load-bearing for every collector's retry semantics + downstream consumer expectations + the F-008 5-vertex picture's correctness. A regression that, e.g., refactored `IngestionProcessorChain.processIngestionRequest` to commit per-phase (instead of per-batch) would break this contract with no test signal.
