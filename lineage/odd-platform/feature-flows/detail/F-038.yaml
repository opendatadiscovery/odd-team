discovered_from_entry_point: |-
  rest:GET /api/datacollaboration/providers/slack/channels +
  rest:POST /api/datacollaboration/providers/slack/messages +
  rest:GET /api/messages/{message_id}/url +
  rest:POST /api/slack/events
description: |-
  The Data Collaboration feature (sub-feature of P-07 Active Platform
  Features, per `system-mission.md:200-215` and `documentation/docs/active-platform-features.md`)
  is the Slack-integrated **Discussions** tab on Data Entity detail
  pages. When `datacollaboration.enabled=true` (default `false` per
  `application.yml:205`) the feature exposes FOUR endpoints across TWO
  controller classes:

  (1) `GET /api/datacollaboration/providers/slack/channels` — Slack
  channel autocomplete for the channel-picker; returns the bot-joined
  public channels filtered by `name.startsWith(query)`.

  (2) `POST /api/datacollaboration/providers/slack/messages` — enqueue
  a new Discussion message for asynchronous delivery (202 Accepted).
  The actual `chat.postMessage` happens in
  `DataCollaborationMessageSenderJob` under a Postgres-advisory-lock-
  elected leader (lock id `datacollaboration.sender-message-advisory-lock-id`,
  default 120).

  (3) `GET /api/messages/{message_id}/url` — server-side 302 to the
  Slack permalink for a tracked message (calls Slack's `chat.getPermalink`
  and emits the URL verbatim in a `Location:` header).

  (4) `POST /api/slack/events` — the inbound Slack Events API webhook.
  Handles the URL-verification CHALLENGE handshake (echoes the
  challenge back) AND receives `message.channels` events. Thread
  replies whose parent thread_ts matches a tracked ODD message
  insert a row into `message_provider_event` (state=PENDING) for the
  asynchronous `DataCollaborationMessageEventProcessor` to materialise
  into a child `message` row. Slack's at-least-once delivery model
  + the schema's missing uniqueness constraint on (provider, event_id)
  → duplicate deliveries produce N child message rows.

  The user-observable promise: an in-platform Discussions tab on every
  Data Entity, mirrored to a chosen Slack channel, with bidirectional
  thread-reply sync.

  The user-observable reality, per primary-source code-walk of the two
  controller classes + their dependencies (DataCollaborationConfiguration
  + SlackAPIClientImpl + SlackMessageProviderClient + SlackEventParser +
  DataCollaborationServiceImpl + ReactiveMessageRepositoryImpl +
  AuthorizationCustomizer + SecurityConstants):

  (a) **No Slack request signature verification.** The Slack docs
  (`https://api.slack.com/authentication/verifying-requests-from-slack`)
  mandate HMAC-SHA256 verification of `X-Slack-Signature` for any
  Events API receiver; the entire ODD codebase contains zero matches
  for `X-Slack-Signature`, `signing.secret`, `verifySignature`, or
  any related primitive. The controller deserializes raw body straight
  from `@RequestBody Mono<String>` and never reads any header.

  (b) **All four endpoints have NO RBAC permission gate.**
  `SecurityConstants.SECURITY_RULES` has zero entries for
  `/api/datacollaboration/**` or `/api/messages/**` or `/api/slack/events`;
  all four fall through to the per-mode authentication only.

  (c) **Under `auth.type=DISABLED` ALL FOUR endpoints are anonymously
  reachable.** The feature flag `datacollaboration.enabled` is the
  ONLY defence — turning Discussions on in a DISABLED-mode deployment
  publishes the entire surface to the network.

  (d) **`/api/messages/{uuid}/url` is an open-redirect class surface.**
  The controller trusts Slack's `chat.getPermalink` response verbatim;
  no host/scheme/structure validation; if Slack ever returned an
  attacker-controlled URL the controller would 302 to it.

  (e) **Multiple silent-200 conflations.** A non-v1 UUID in the
  message_id path → empty mono → 200 OK with no body (NOT 404). An
  unknown Slack event type → 200 ack (intentional, to avoid Slack
  retry storms, but undocumented). A malformed JSON event payload →
  undefined HTTP status (no try/catch on JSON deserialize).

  (f) **Slack channel autocomplete uses startsWith, not contains.**
  Combined with a 1-minute Caffeine cache (size 1, fixed sentinel
  key), the autocomplete shows STALE channel membership for up to 60
  seconds.

  (g) **OpenAPI vs impl status drift on `redirect`** — spec says 301,
  impl emits 302.

  (h) **No live doc page for the Discussions feature.** WebFetched
  2026-05-25 against `/active-platform-features/data-collaboration`
  returns 404; the source markdown exists in the documentation repo
  but is not live-published. An operator Googling "odd discussions"
  lands on broken pages.
