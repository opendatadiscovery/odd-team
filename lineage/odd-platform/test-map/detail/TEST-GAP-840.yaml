behaviour: |-
  **HIGH — Page-vs-count blind trust inherited from REFACTOR-425 family. UI consumer-side surface of the data_entity-page-vs-count-predicate-divergence-exclude-from-search invariant.** Search.tsx delegates pagination to `Results.tsx:71-74` which calls `fetchDataEntitySearchResults({searchId, page+1, size:30})`. The thunk at `thunks.ts:62-63` computes `hasNext: page * size < pageInfo.total`. The `total` field comes from `SearchFacetsData.total` (the COUNT aggregator on backend).

  **If the count predicate diverges from the list predicate** (per the canonical REFACTOR-425 family — exclude_from_search flag is a known divergence vector per `concepts/detail/invariants/data-entity-page-vs-count-predicate-divergence-exclude-from-search.yaml`):
  - **count < actual rows** → pagination terminates early, user never reaches the missing pages (data loss to the user; the entity is searchable but the UI never paginates to it).
  - **count > actual rows** → `hasNext` stays true even though the server returns empty results; the infinite-scroll loop fires forever (UX hang).

  **The UI does NOT defensive-check** — it trusts the server `total` blindly. There is no client-side reconciliation between "I just got 0 results back" and "hasNext is still true". The UI has no fallback to terminate the loop in the count-divergent case.

  **Cross-batch evidence**: This is the same architectural bug class as the EXCLUDE_FROM_SEARCH inconsistency that TEST-GAP-310 pins at the backend Popular ranking surface. The pattern is broader: ANY case where the same underlying predicate differs between the COUNT(*) query and the SELECT query produces page-vs-count divergence. Search.tsx is one consumer; Popular is another; Directory level 4 is a third (per F-023 batch-T facet 13).

  **Why HIGH**:
  - **Data integrity (silent data loss)**: count < rows → user cannot find the entity they searched for, with no UI signal anything went wrong.
  - **Availability**: count > rows → infinite-scroll loop fires forever, exhausts network budget.
  - **Pattern propagation**: REFACTOR-425 family has multiple UI consumers. Without test pins at each consumer, a future predicate-divergence fix at one site can silently break another.

  **Test gap shape**: Integration test that seeds entities with EXCLUDE_FROM_SEARCH=true AND ensures the COUNT predicate disagrees with the LIST predicate, then exercises the UI's pagination. The test ASSERTS the UI reconciles the divergence (or PINS the current bypass).
