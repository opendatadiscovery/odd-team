name: Resolve Roles to Policies (per-request authorization hot path)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW OPERATION, batch 2026-05-19H** — the per-request hot-path operation
  that resolves the current user''s effective policy set from their role list. The
  canonical implementation is `ReactivePolicyRepositoryImpl.getRolesPolicies(List<Long>
  roleIds)` (lines 27-39) — a JOIN over policy ⋈ role_to_policy filtered by `role_to_policy.role_id
  IN (...)`, returning `Mono<List<PolicyPojo>>`. Invoked on EVERY authorized HTTP
  request that traverses the permission framework via two extractors: (a) `ManagementPermissionExtractor.getNonContextualPermissions`
  (line 33) — invoked for every MANAGEMENT-tier permission check; (b) `AbstractContextualPermissionExtractor.getContextualResourcePermissions`
  (line 27) — invoked for every DATA_ENTITY / TERM / QUERY_EXAMPLE permission check.
  The call path: SecurityRule fires → AuthorizationManager evaluates → `PolicyService.getCurrentUserPolicies()`
  → `policyRepository.getRolesPolicies(roleIds)` → SQL. NO caching at any layer; every
  authorized request hits Postgres. Result list collected to memory and consumed in-memory
  by the extractor (flatMapIterable). For typical user policies (~1-10 PolicyPojos,
  ~500 bytes each), trivial allocation cost. A pathological user attached to thousands
  of policies would see proportional heap allocation per request — but typical role
  cardinality is single-digit per user. **NEW HIGH-severity gap**: `getRolesPolicies`
  does NOT filter by `policy.deleted_at IS NULL`. A soft-deleted policy with surviving
  role_to_policy bindings continues to confer permissions on users in those roles
  — PolicyServiceImpl.delete defends at the cascade-delete check (lines 89-92), but
  any DB-direct UPDATE setting deleted_at, schema migration mistake, or future refactor
  weakening the cascade re-opens the gap. The fix is one line: `AND policy.deleted_at
  IS NULL` in the JOIN''s WHERE clause. **Performance characteristics**: single JOIN
  per call; sub-millisecond on typical row counts; no streaming (collectList); identifies
  THE canonical "authorization hot path" of the platform — every read and every mutation
  routes through it.'
