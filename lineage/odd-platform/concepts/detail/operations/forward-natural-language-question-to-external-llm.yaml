name: Forward Natural-Language Question to External LLM
canonical_in_docs: true
canonical_candidate: false
description: 'POST /api/genai/ask — single endpoint, single Mono pipeline; deserialises
  GenAIRequest, gates on genai.enabled, forwards body verbatim as `{"question": "<body>"}`
  to {genai.url}/query_data, returns LLM answer as GenAIResponse.body wrapped in 200
  OK. GenAIController.genAiQuestion implements.'
axes_present:
- controllers
- config_prefixes
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:GenAIController
- odd-platform java GenAIController controller-class:GenAIController
contributors:
- 'GenAIController.operations: forward-natural-language-question-to-external-LLM'
- |-
  GenAIController (controller-class, batch ZG STRENGTHENS):
    operations[the FIVE-step pipeline:
    receive-question-request → gate-on-enabled (`genai.enabled` re-read every
    request, HTTP 400 BadUserRequestException if false) →
    forward-question-verbatim-to-external-llm
    (Map.of("question", request.getBody()) POSTed to {genai.url}/query_data
    via genAiWebClient bean — no auth header, no PII scrub, no template) →
    unwrap-quoted-json-string-response (CharMatcher.is('"').trimFrom +
    StringEscapeUtils.unescapeJava — assumes JSON-quoted-string response,
    silently brittle on structured JSON) → return-response-body as
    GenAIResponse.body wrapped in 200 OK];
    invariants[exactly one outbound HTTP POST per inbound request; no retry,
    no exponential backoff, no circuit breaker; only ReadTimeoutException
    gets a custom user-friendly error message ("Gen AI request take longer
    that N min" with typo "that"→"than"), every other exception class
    collapsed into generic GenAIException(Throwable)];
    bugs[HIGH no authorization gate beyond authenticated(); HIGH no
    request-body validation (no @Size on body); HIGH no rate limit; HIGH no
    audit log of who asked what — Slf4j present but no log.* calls; HIGH no
    PII redaction; MEDIUM response unwrap brittle on structured JSON;
    MEDIUM 0-default request_timeout triggers immediate ReadTimeoutException
    when operator enables without setting timeout (LSN-002 class)]
evidence:
- GenAIController.md:concepts.operations (5-step pipeline)
- GenAIController.md:concepts.invariants (5 invariants)
- GenAIController.md:bugs_limitations_corner_cases.[0-9] (10 findings, 5 HIGH)
- GenAIController.md:implicit_adrs.[0-4] (5 design choices)
- GenAIController.md:security.known_security_gaps.[0-6]
- GenAIController.md:performance.hot_paths + known_performance_gaps[0-4]
related_features: []
related_pillar_features:
  - P-11
notes: |-
  Pairs with entity:genai-assistant (the feature this operation backs).
  The thin-proxy stance is by design — the live feature page
  https://docs.opendatadiscovery.org/features/active-platform-features/genai
  explicitly states 'the platform is a thin proxy', 'No prompt modification',
  'No retry'. The operator-visible security implications (no per-user
  permission, no rate limit, no audit log, no PII scrub) are NOT documented
  on the live feature page — captured as doc gap in the GenAIController
  sidecar.
