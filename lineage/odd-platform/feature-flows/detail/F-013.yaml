discovered_from_entry_point: rest:PUT /api/dataentities/{id}/metadata/{field_id}
contributing_nodes:
- odd-platform java DataEntityController controller-method:upsertDataEntityMetadataFieldValue
- odd-platform java service service:DataEntityServiceImpl
- odd-platform java ReactiveMetadataFieldValueRepositoryImpl
- odd-platform java MetadataFieldServiceImpl
- odd-platform java ReactiveSearchEntrypointRepository
- odd-platform java SecurityConstants
- odd-platform java ActivityEventTypeDto
