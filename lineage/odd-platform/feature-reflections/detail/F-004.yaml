    verdict: contradicted
    actual_behavior: |
      Last-writer-wins with silent loss. There is no optimistic locking on the description write — no @Version,
      no WHERE ... AND internal_description = ?oldValue? guard; the UPDATE is a plain set-by-id. Under
      concurrent writes, both DESCRIPTION_UPDATED events capture the SAME oldState snapshot (resolved via a
      separate get(dataEntityId) call, not the in-flight pojo) and different newState values — so the audit
      trail shows two parallel transitions from the same baseline, and operator A's contribution is silently
      overwritten by operator B with no warning.
    evidence:
