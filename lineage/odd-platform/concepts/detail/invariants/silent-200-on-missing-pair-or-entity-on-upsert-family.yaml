name: Silent-200-on-missing-pair / missing-entity on upsert family
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-11
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-19L** — surfaced by
  cross-reading the `upsertDataEntityMetadataFieldValue` (batch L PRIMARY
  SOURCE) and `upsertDataEntityInternalDescription` (batch G prior art)
  sidecars. Two endpoint-pair instances confirm the same pattern: the
  `upsert*` family of PUT endpoints on DataEntityController silently
  return `200 OK` with empty body when the target pair OR the target
  entity does NOT exist. Operators reading the OpenAPI "upsert" name
  expect POST-or-PUT semantics; the actual mechanism is pure UPDATE with
  silent no-op on missing-row.

  **Site 1 — `upsertDataEntityMetadataFieldValue`** (batch L PRIMARY SOURCE):
    - Endpoint: `PUT /api/dataentities/{data_entity_id}/metadata/{metadata_field_id}`
    - Service body: `DataEntityServiceImpl.upsertMetadataFieldValue` (lines 287-305)
    - Mechanism: `ReactiveMetadataFieldValueRepositoryImpl.update` (lines 95-104)
      issues `DSL.update(METADATA_FIELD_VALUE).set(...).where((dataEntityId, metadataFieldId) match).returning()`.
    - On missing pair (no row in `metadata_field_value` for the
      `(dataEntityId, metadataFieldId)` pair), the UPDATE matches zero
      rows; the returning Mono completes empty; the downstream
      `updateMetadataVectors` and mapper are short-circuited via
      empty-mono propagation; controller returns `200 OK` with empty body.
    - There is NO `reactiveDataEntityRepository.get(dataEntityId)`
      existence check (contrast with `createMetadata` at lines 257-258
      which DOES check).

  **Site 2 — `upsertDataEntityInternalDescription`** (batch G prior art):
    - Endpoint: `PUT /api/dataentities/{data_entity_id}/description`
    - Same UPDATE-not-UPSERT shape; silent 200 OK on missing entity.

  **Operator-facing manifestation**:

    - The UI's redux thunks hardcode success toasts on any non-error
      response. For `upsertDataEntityMetadataFieldValue`, the thunk emits
      "Metadata successfully updated." on 200 (regardless of body); for
      `upsertDataEntityInternalDescription`, it emits the description
      success toast. Both UIs claim success on writes that did not
      happen.

    - Operators using direct REST clients receive 200 OK with empty body
      and cannot distinguish "successfully updated" from "id was wrong"
      from "the pair did not exist yet — should I call create instead?".

    - Idempotent reconciliation scripts that retry-on-error find the
      endpoint mis-reports success for non-existent pairs; the script
      "succeeds" without writing.

  **The mechanism is a Reactor empty-mono short-circuit pattern**: when
  the repository's `Mono<T>` returns empty, the downstream `.then(...)`
  and `.flatMap(...)` chains short-circuit; the controller's
  `Mono<ResponseEntity<T>>.map(ResponseEntity::ok)` (cross-ref the
  "Reactive Mono<ResponseEntity<...>>.map(ResponseEntity::ok) is the
  uniform success-response pattern" invariant) completes with empty body
  + `200 OK`. The pattern is technically correct WebFlux but
  semantically misleading.

  **Why this exists (intent — partially confirmed)**: the OpenAPI
  operationId is `upsert*`, suggesting an UPSERT contract; the
  implementation is UPDATE-only, suggesting either (a) the maintainer
  chose UPDATE-only as the safe default (no row-creation as a side
  effect; the row was created earlier via the create endpoint), OR (b)
  the OpenAPI name is aspirational (the implementation drifted from the
  intended UPSERT semantics). The metadata-field-value endpoint has a
  separate `createDataEntityMetadataFieldValue` (POST) so (a) is the
  more likely intent — but the OpenAPI naming muddles it for callers.

  **Cross-pattern shape**: the **silent-204-on-no-op DELETE** sibling
  invariant (DEG-membership + term-unlink) is the matching pattern on
  the DELETE side; together they form a cluster: at ODD, the
  load-bearing assumption of HTTP semantics ("a 2xx means something
  happened") is selectively false on no-op DELETE paths AND on
  no-op-target UPSERT paths.

  **Audit ambiguity compounds the silent-200**: the affected upsert
  endpoints carry NO `@ActivityLog` annotations (per the
  custom-metadata enum reserved-but-unwired pattern) — operators
  cannot cross-reference the activity feed to verify whether the write
  actually happened.
