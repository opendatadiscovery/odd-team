- id: H-006
  hypothesis: |-
    When an entity has no class assigned (entityClasses empty / undefined), the operator
    sees a clear "unclassified" signal — not silent blank whitespace they cannot interpret.
  derivation: |-
    Negative-space + P-01 pillar (the class IS the primary categorical signal). An operator
    reading a list expects an unclassified entity to LOOK unclassified, not invisible.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      EntityClassItem renders NOTHING when entityClassName is undefined: both the title and the
      inner text are guarded by `entityClassName &&` (EntityClassItem.tsx:24,26), and the
      background ternary collapses to '' (EntityClassItem.styles.ts:16) — an empty, transparent,
      zero-content span. IT-018's negative path verifies this live: an entity with
      entity_class_ids={} renders the type badge but the class badge has count 0 (spec lines
      49,63-66; e2e:PASS). There is no '—', no 'Unclassified' placeholder, no skip-with-null.
      The operator cannot distinguish "this entity is unclassified" from "the UI hasn't drawn
      a chip here." This is the documented drift `class_array_empty_renders_no_badge` /
      facet entity_class_empty_when_entity_class_name_undefined.
    evidence:
      - sidecar: F-206.yaml (feature-flow detail)
        section: observed_vs_expected.facets[entity_class_empty_when_entity_class_name_undefined]
        cite: "EntityClassItem.tsx:18-28"
        note: "title + text both guarded by entityClassName &&; undefined → empty chip"
        source_read_for_validation: true
      - sidecar: IT-018 (integration spec)
        section: "negative: an entity with no classes renders no class badge"
        cite: "entity-class-type-badge.spec.ts:49,63-66"
        note: "live: entity_class_ids={} → class badge toHaveCount(0); type badge still renders (e2e:PASS)"
    operator_visible_failure: |-
      (1) An entity arriving from ingestion without a class assignment, or a manually-created
      entity before classification, renders as blank whitespace where the chip would be — in a
      dense Search/Directory list this is indistinguishable from a still-loading row or a layout
      gap, so the operator has no signal that the entity is unclassified and needs attention.
      (2) Because the empty render is silent, an operator triaging "why is this entity missing
      its Overview panels?" (F-176 keys composition off the class) gets no breadcrumb — the
      root cause (no class) is invisible at exactly the widget that should surface it. (3) The
      negative is a CONFIRMED-CURRENT behaviour (IT-018 pins it GREEN), so any fix must update
      IT-018's negative assertion in lockstep.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    test_demand_note: |-
      IT-018 pins the CURRENT (silently-blank) behaviour as a characterization. The functional
      demand is the regression guard for the FIX: when the unclassified placeholder ships, a
      test asserting the '—'/'Unclassified' marker renders (and IT-018's negative flips). Tracked
      code-side as PLT-094 Defect 4.

