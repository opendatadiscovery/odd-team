batch_origin_note: |-
  Net-new feature minted in batch T from the DataQualityController
  controller-class primary-source sidecar. Per-Dataset DQ Test Reports
  & SLA is the FIRST P-04 anchored pillar-feature minted — the pillar
  was empty before batch T. System-mission.md names P-04 with three
  sub-features; the controller's 5 endpoints span sub-features
  'Test Results Import' (3 endpoints: list-tests + test-report-aggregate
  + severity-mutation) and 'Dataset Quality Statuses (SLA)' (2 endpoints:
  PNG badge + JSON report). The Quality Dashboard sub-feature
  (`/data-quality` catalog-wide rings) is a SEPARATE read surface
  served by a DIFFERENT controller (likely DataQualityDashboardController
  or via SearchController-equivalent); a future batch enriching that
  controller mints P-04:F-002 (Quality Dashboard) and possibly
  P-04:F-003 (Test Results Import as a separate ingestion-side
  sub-feature, if the surfaces diverge sufficiently).

  Per Rule 0 evaluation: the mint is justified because (a) DataQualityController
  IS the primary user-observable per-dataset DQ surface; (b) the
  pillar P-04 was previously anchored only via system-mission.md
  without any feature-flows representation; (c) the 5-endpoint surface
  is sufficiently coherent (one controller, one service, one repository,
  one calculator) to merit a single pillar-anchored feature; (d) the
  PNG-vs-JSON doc drift is the canonical 'BI operator follows our
  guide off a cliff' scenario worth surfacing as the headline drift
  facet for the pillar.

  The 12 load-bearing drift facets enumerated here close the per-dataset
  DQ surface at the controller tier; future batches refine via
  service-tier (DataQualityServiceImpl), repository-tier
  (ReactiveDataQualityRepositoryImpl), calculator-tier (SLACalculator),
  and PNG-resolver-tier (CachingByteArraySLAResourceResolver) primary
  source. Cross-pillar back-links to P-07 (alerts, activity-feed),
  P-09 (security), P-10 (ingestion), P-01 (entity detail page).
