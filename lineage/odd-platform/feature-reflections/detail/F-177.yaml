# Data entity Class / Type badges on the detail-page header — product-owner reflection

## product_owner_narrative

The Class / Type badge row is the **identity line** of every data-entity detail page. When an operator opens any entity — a Postgres table, an Airflow DAG, a dbt model, a Great Expectations run — the header renders the entity's name followed by a short sequence of small coloured chips: one CLASS badge per element of `details.entityClasses[]`, then a single TYPE badge from `details.type.name` (per `DataEntityDetailsHeader.tsx:79-86`, source-read for this reflection; the parent `DataEntityDetails` passes both props at `DataEntityDetails.tsx:128` per its sidecar `downstream_side_effects`). The product promise the badges make — inferred from their prominence and the platform's Data Discovery framing — is: *"these chips tell you what KIND of thing this entity is, so you know what to expect on this page."*

An operator interacts with the badges purely by reading them — they are read-only projections, no click, no backend side-effect (`terminal_side_effect.side_effect_class: page-render`). They appear on the single most-trafficked surface in the platform (every navigation from Search, Directory, Lineage, Alerts, the Popular strip lands here, per the `DataEntityDetails` sidecar `upstream_callers`). What the operator actually sees, though, is not the class NAME: `EntityClassItem` renders a 2-3 letter abbreviation via `DataEntityClassLabelMap` — `DS` for SET, `TS` for TRANSFORMER, `QT` for QUALITY_TEST, `DI` for INPUT, `DC` for CONSUMER, `DEG` for ENTITY_GROUP, `REL` for RELATIONSHIP (`constants.ts:52-80`, source-read; the header passes no `fullName` prop so the `short` form is used, `EntityClassItem.tsx:26-27`). The only expansion offered is a hover `title` attribute carrying the friendly singular noun ("Dataset", "Transformer") — never an explanation of what that class DOES to the page (`EntityClassItem.tsx:24`).

The working parts are deceptively simple and entirely client-side. The class array is iterated with no upper bound and the row container is `flexWrap='nowrap'` (`DataEntityDetailsHeader.tsx:74-85`), so a multi-class entity renders every badge on one non-wrapping line that shares its grid cell with the entity name and the business-name button. An entity whose `entityClasses` is `undefined` or `[]` renders no class badge at all — silently. The single TYPE badge renders the freeform collector-supplied string formatted by `stringFormatted(type.name)` (`EntityTypeItem.tsx:14-15`), in the same row, with no colour-coding and no categorical separator from the class chips (`EntityTypeItem.styles` per scanner finding F-206b).

The badge row's deepest property is that it is **load-bearing, not decorative**. The exact `entityClasses[]` array the header projects into chips is the same array that drives the Overview tab's per-class panel composition (`OverviewStats`'s seven-way switch over the class names, per F-176 and the `Overview` sidecar which carries `entityClasses` in the 9-field DataEntityRef projection), the conditional Structure / Lineage tab visibility (`DataEntityDetailsTabs.tsx` — `hidden: !isDataset`), and the Catalog search facets (F-017). The header is the ONE place class identity is shown prominently, yet nothing visually links a header badge to the panels it causes to appear below it — the binding lives only in the operator's head.

In a demo, a senior product owner would flag the edge cases immediately: a new user lands on a `TS` badge and a missing Structure tab and has no on-screen way to learn that "TS" is why; a multi-class ML model renders four cryptic chips that overflow into the entity name; an entity with a lost `entityClasses` payload renders identically to a genuinely unclassified one; and a collector that emits a hostile `type.name` is the only operator-influenced text on the row. Each of these is a falsifiable hypothesis below.

