behaviour: |-
  **DESTRUCTIVE-DEFAULT: an API consumer omitting `roles` in PUT /api/owners/{id} body SILENTLY STRIPS ALL ROLES.** `OwnerFormData.roles` is OpenAPI-optional (components.yaml:419-422; `requiredMode` not declared); `getRoleIdsList` (OwnerServiceImpl.java:117-122) collapses both null AND empty list to `List.of()`. The update transaction then calls `deleteOwnerRelationsExcept(ownerId, List.of()).then(createRelations(ownerId, List.of()))` — the first half DELETES all current role-links (since no existing link is in the empty-set); the second half INSERTS nothing. An operator updating ONLY the owner name (omitting `roles` to mean 'don't touch') instead REMOVES all role assignments. This is a silent, destructive UX hazard: the form's `roles` is treated as REPLACE-NULL-WITH-EMPTY, not as IGNORE-IF-OMITTED. The UI in practice always sends the current `roles` list (`owners.thunks.ts` per UI source code), so the hazard is masked in normal UI flows — but any API consumer (script, integration, malformed UI request) that omits `roles` will silently strip ALL roles from the Owner. NO confirmation step, NO 'are you sure' check, NO partial-update mechanism. Combined with the no-audit-log gap (TEST-GAP-238 family) and the OWNER_TO_ROLE hard-delete on owner-delete (deleteOwner side), role-stripping is silent AND irreversible from logs. STRENGTHENED batch S — the OwnerServiceImpl service-tier closure sidecar (2026-05-20) PRIMARY-SOURCE confirms the 3-line cascade: (a) OwnerServiceImpl.java:71 (`final List<Long> newRoles = getRoleIdsList(updateEntityForm);`) — the call site; (b) lines 117-122 (`getRoleIdsList` helper) — the null+empty collapse to `List.of()`; (c) lines 76-81 — the `deleteOwnerRelationsExcept(ownerId, newRoles).then(createRelations(ownerId, newRoles))` cascade where the empty list lands. The 3-line composition is now testable at the SERVICE TIER directly (see TEST-GAP-680 NEW batch S — the algorithm-pin sister gap).
