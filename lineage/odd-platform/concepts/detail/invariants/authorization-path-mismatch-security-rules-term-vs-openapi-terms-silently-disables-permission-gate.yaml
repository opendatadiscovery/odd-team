name: Authorization path-mismatch — SECURITY_RULES /term vs OpenAPI /terms silently
  disables permission gate
canonical_in_docs: false
canonical_candidate: true
description: 'SecurityConstants.SECURITY_RULES[237-239,240-242] declares path patterns
  with SINGULAR ''/term'' and ''/term/{term_id}'' for the DATA_ENTITY_ADD_TERM/DELETE_TERM
  permission checks. OpenAPI spec at openapi.yaml:973,1042 declares the actual endpoints
  as PLURAL ''/terms'' and ''/terms/{term_id}''. The generated DataEntityApi interface
  inherits the plural path; AuthorizationCustomizer.customize only invokes the permission
  check when the rule''s matcher matches the request — the singular matcher never
  matches the plural path. Customizer falls through to .pathMatchers(''/**'').authenticated().
  Net effect: DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM are NEVER ENFORCED
  for the real endpoints. ANY authenticated user (LOGIN_FORM/OAUTH2/LDAP) can link
  or unlink terms on any data entity across the platform. ALSO bypassable via the
  description-write path (different surface, same vulnerability class). Triangulates:
  addDataEntityTerm (PRIMARY-SOURCE) + upsertDataEntityInternalDescription (the side-channel
  bypass via [[ns:term]]).'
contributing_files:
- addDataEntityTerm.md
- upsertDataEntityInternalDescription.md
triangulation_count: 2
cross_batch: false
severity: HIGH
severity_dim: security
evidence:
- addDataEntityTerm.md:bugs_limitations_corner_cases.[0] HEADLINE (path-mismatch on
  POST)
- addDataEntityTerm.md:bugs_limitations_corner_cases.[1] (same bug for DELETE)
- addDataEntityTerm.md:security.known_security_gaps.[0]
- upsertDataEntityInternalDescription.md:security.known_security_gaps.[3] (description-write
  side-channel bypasses ADD_TERM)
mitigations_unimplemented:
- Change SecurityRule path strings to plural to match the OpenAPI surface
- Add a @WebFluxTest regression that asserts a no-permission user receives 403
- Build a startup invariant that scans SECURITY_RULES paths against OpenAPI paths
  and fails-fast on mismatch
