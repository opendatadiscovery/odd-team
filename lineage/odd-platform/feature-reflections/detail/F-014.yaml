- id: H-003
  hypothesis: "When a caller passes size=1000000 (or page=0) to GET /api/dataentities/{id}/alerts, the platform clamps or rejects the request rather than executing an unbounded query / a negative OFFSET."
  derivation: "Endpoint-shape robustness + the doc-named audit-export use case: a senior PO expects an export-recommended endpoint to bound page size so a naive large request cannot degrade the server, and to reject nonsensical page indices cleanly."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      Pagination is unbounded at every layer this method touches. The controller params are bare Integer page,
      Integer size with no @Min/@Max (DataEntityController.java:317-318); the OpenAPI PageParam/SizeParam carry no
      minimum:/maximum: (components.yaml:4213-4229); the repository computes OFFSET = (page-1)*size with no clamp
      (ReactiveAlertRepositoryImpl.java:189). size=1000000 triggers a single jOOQ query + in-memory AlertList
      mapping bounded only by Postgres/network buffers; page=0 produces OFFSET = -size, which Postgres rejects with
      "OFFSET must not be negative" — surfacing as a 500-class error, not a clean 400.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityAlerts.md
        section: bugs_limitations_corner_cases[2] + performance.known_performance_gaps[0]
        cite: "DataEntityController.java:317-318 + components.yaml:4213-4229 + ReactiveAlertRepositoryImpl.java:189"
        note: "no @Min/@Max, no OpenAPI min/max, no repo clamp; (page-1)*size negative OFFSET on page=0"
    operator_visible_failure: |
      The doc explicitly recommends a LARGE size for audit exports ("set size=1000 for full audit windows") to
      minimise round-trips — so operators are nudged toward exactly the large-page request that has no upper bound.
      A careless or malicious size=1000000 on a high-volume entity produces an arbitrarily large response body and
      an unbounded query (a memory/latency amplification vector, the LSN-001/002 class). A page=0 request returns an
      opaque server error instead of a clear validation message — the first boundary an integration author hits.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    dedup_note: "DOC side TRACKED+DONE (DOC-200 documents the pagination shape + recommends size=1000 as the operator workaround; DOC-GAP-022 is the cross-cutting unbounded-size registry gap). CODE side is net_new — no PLT adds @Max + a defensive clamp for the alerts endpoint. PLT-100 caps lineage depth (@Max + clamp) — this is the structurally identical alerts-size hardening with no item. distinct_from PLT-100 (different endpoint family)."

