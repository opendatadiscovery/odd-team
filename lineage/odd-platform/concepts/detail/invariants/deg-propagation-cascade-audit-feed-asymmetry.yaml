mitigations_unimplemented:
- |-
  Add a docs section on `/configuration-and-deployment/enable-security/authorization/policies`
  or the activity-feed doc page describing the audit-granularity choice
  for DEG propagation — operators auditing child-entity ownership
  changes need to know the cascade is parent-event-only.
- |-
  Add a regression test that:
    (a) Creates a DEG with N children;
    (b) Calls POST /api/dataentities/{DEG_ID}/ownership with propagate=true;
    (c) Asserts ONE OWNERSHIP_CREATED activity event exists (current
        behaviour) OR asserts N+1 events exist (one parent + N child;
        under a proposed audit-granularity refinement).
- |-
  If the maintainer decides to refine the audit-granularity (e.g. emit
  per-child events for the cascade), the change is at
  `propagateOwnership` to invoke the per-child write through the
  `@ActivityLog`-instrumented path rather than calling
  `ownershipRepository.createOrUpdate(pojos)` directly.
notes: |-
  NEW invariant captured in batch 2026-05-19K. The deliberate-granularity
  choice is consistent with the rest of the platform's `@ActivityLog`
  pattern — every audited operation logs at the user-facing entry, not
  at every persistence side-effect. The asymmetry surfaces operationally
  only on DEG propagation because that's the platform's main fan-out
  cascade today; future cascades (e.g. tag-propagation if introduced,
  attachment-cascade-delete) would inherit the same architectural
  choice.

  Cross-cutting connections:
    - Pairs with the "Bind Owner to Data Entity (with optional DEG
      propagation)" operation concept — that captures the cascade itself;
      this captures the audit-granularity decision
    - Pairs with the "Activity Feed" entity concept — the audit
      destination
    - Cross-references the "No-audit-log on RBAC mutations
      (audit-log presence asymmetry)" invariant — that surfaces the
      INVERSE asymmetry (RBAC mutations have NO audit; this surfaces
      that ENTITY mutations have audit at the entry level but not at
      cascade level)
    - Companion of "Audit-log presence asymmetry (2-tier audit story)"
      canonicalisation candidate — adds a third tier:
      (1) entity-level mutations audited;
      (2) RBAC mutations NOT audited;
      (3) cascade-propagated mutations audited at entry-level but NOT
          per-child

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the audit-granularity choice for DEG propagation —
        operators benefit from knowing the audit-trail shape
    (b) Either refine the audit-granularity (per-child events) or
        publish the deliberate-omission as an explicit ADR
