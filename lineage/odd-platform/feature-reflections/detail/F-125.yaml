- id: H-005
  hypothesis: "When a DBA reads the `token` table (a replica, a pg_dump, a backup, a stray SQL log line), the bearer credentials are NOT recoverable in the clear — a secret-bearing column is hashed or encrypted at rest."
  derivation: "Negative-space + pillar P-09 security posture: an operator's default expectation of any credential store is that the secret is not plaintext at rest (industry-canonical: bcrypt/argon2 hash + validate-by-digest). Tested against the storage schema + the validation path."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The token is plaintext at rest at every layer. `TokenGeneratorImpl` writes `RandomStringUtils.randomAlphanumeric(40)`
      verbatim into `token.value VARCHAR(40)` (no hash, no salt, no encryption, no separate value_hash column —
      V0_0_28__add_token.sql:4). The always-on `IngestionDataSourceFilter` resolves a token via `getByToken` →
      `TOKEN.VALUE.eq(token)` (plaintext SQL equality, ReactiveCollectorRepositoryImpl.java:94), and the opt-in
      `IngestionDataEntitiesFilter` does `tokenPojo.getValue().equals(token)` (non-constant-time Java equality). A DB-side
      reader recovers every live credential with a single SELECT. This is a CONFIRMED, pinned bug — `CollectorTokenStorageKnownBugTest`
      is a GREEN characterization pin (PLT-085) asserting the plaintext `TOKEN.VALUE.eq(token)` lookup is in place, RED the
      moment storage is hashed (LSN-029 protocol).
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveCollectorRepositoryImpl.md
        section: "implicit_adrs[0] + bugs_limitations_corner_cases[0] + security.known_security_gaps[0]"
        cite: "V0_0_28__add_token.sql:4 + TokenGeneratorImpl.java:34-42 + ReactiveCollectorRepositoryImpl.java:94 + IngestionDataEntitiesFilter.java:55-58"
        note: "Plaintext write, plaintext SQL match, non-constant-time app equality — consistency-across-layers IS the (implicit) decision."
      - sidecar: odd-platform__java__CollectorController__controller-method__regenerateCollectorToken.md
        section: "security.known_security_gaps[3] + implicit_adrs[3]"
        cite: "ReactiveTokenRepositoryImpl.java:21-39 (stored as-is) + IngestionDataEntitiesFilter.java:55-58"
        note: "Confirms no hashing layer end-to-end; HIGH severity."
        source_read_for_validation: true
    operator_visible_failure: |
      Operators running PgBackup / pgaudit / DB observability / read-replica pipelines have production credentials in their
      logs and backup archives. A compromised backup, a leaked replica snapshot, or a pg_dump artefact dropped in a chat
      channel exposes every live collector/datasource credential; combined with H-001 (orphans never purged) it exposes
      every credential ever minted. Recovery means rotating every token AND treating every backup-history reader as a
      compromise. ALREADY TRACKED: PLT-085 (Collector plaintext-at-rest, with the GREEN pin) + PLT-087 D3 (DataSource
      plaintext response cache-control) + DOC-252/DOC-255 (done). Convergent validation — this reflection independently
      re-derives a high-confidence, already-pinned finding.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: verified
    test_ref: "repository.reactive.CollectorTokenStorageKnownBugTest.collectorTokenLookedUpByPlaintextEquality_knownBug_PLT085 (GREEN @pins PLT-085 — characterization pin of the CURRENT plaintext behaviour; flips RED when storage is hashed)"

