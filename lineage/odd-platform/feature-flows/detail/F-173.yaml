feature_name: |-
  Active-tab Remove UserOwnerMapping — the Management → Associations
  "Active associations" tab lists every APPROVED OwnerAssociationRequest
  (status = APPROVED) with a per-row Remove affordance gated by
  Permission.OWNER_ASSOCIATION_MANAGE. The action calls
  useRemoveUserOwnerMapping which deletes the underlying
  user_owner_mapping row by ownerId. Reverses the bind outcomes of all
  three create branches (F-075 branch A approved, F-075 branch B
  auto-approved, F-172 admin direct-bind).
