notes: |-
  Sibling drift to the more severe Title-binds-OWNERSHIP_TITLE_ID drift.
  This one is over-inclusion (operator gets more than expected); the
  Title one is wrong-binding (operator gets a different concept entirely).
  Both share the LSN-020 lesson: filter labels must qualify the column /
  the join semantic; a bare noun is ambiguous in a multi-namespace
  multi-entity catalog.

  The widening probably exists because operators viewing 'all DQ runs in
  namespace prod' intuitively expect entities whose datasource is in prod
  to be included (a Postgres database in namespace prod's tables don't
  individually carry a namespace; the datasource does). The behaviour is
  reasonable; only the silence is the gap.
