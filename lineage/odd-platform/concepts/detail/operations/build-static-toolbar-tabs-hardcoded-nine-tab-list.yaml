description: |-
  NEW OPERATION, batch ZJ (2026-05-26) — the project-wide
  convention for enumerating the SPA's primary navigation pillars
  as a hardcoded literal array. Implemented at
  `ToolbarTabs.tsx:34-82` as a `useMemo` over a 9-entry literal
  array.

  **Operation shape**:

    - **Caller**: `<ToolbarTabs>` (rendered inside `<AppToolbar>`)
    - **Input**: `(t: TFunction, activityQueryString: string)` —
      the useMemo dep array. The `t` translation function is
      consumed for tab labels; `activityQueryString` is the
      pre-baked 5-day-window query for the Activity tab link.
    - **Output**: `AppTabItem[]` — 9 entries with `{name, link,
      value, hint}` shape.
    - **Side effects**: NONE. The operation is pure construction.

  **The 9 tabs in fixed order**:

    [0] Catalog (link: searchPath())
    [1] Directory (link: directoryPath(), value: 'directory')
    [2] Data Quality (link: dataQualityPath(), value: 'data-quality')
    [3] Data Modelling (link: queryExamplesPath(), value: 'data-modelling')
    [4] Master Data (link: lookupTablesPath(), value: 'master-data')
    [5] Management (link: managementPath(), value: 'management')
    [6] Dictionary (link: termsSearchPath(), value: 'termsearch')
    [7] Alerts (link: alertsPath('all'), value: 'alerts')
    [8] Activity (link: activityPath(activityQueryString), value: 'activity')

  **The operation IS the canonical source for 'what top-level
  surfaces exist'** — reordering or feature-flag-gating tabs
  requires editing this useMemo. No ADR, no config-driven
  mechanism, no admin UI for reordering.

  **The operation does NOT consume permission or feature state** —
  no `useAppSelector(getGlobalPermissions)`, no
  `useAppSelector(getActiveFeatures)`, no `WithPermissions`
  wrappers, no `WithFeature` wrappers. The 9 tabs render
  unconditionally for every authenticated user (per the
  `management-tab-visible-to-all-authenticated-users-
  unpermissioned-tab-visibility` invariant and the
  `toolbar-tabs-ignores-fetch-active-features` invariant).

  **The Activity tab's link is DYNAMIC** — re-built on every
  render where `activityQueryString` changes. The other 8 tabs'
  links are static (the `*Path()` builders are pure functions of
  their args and the args are constants here).

  **The operation has a CONSEQUENCE — the substring-match
  selectedness heuristic** at ToolbarTabs.tsx:101 uses each
  tab's `value` field to match against the current pathname. If
  any route helper is renamed without updating the matching
  `value` literal, the tab silently stops highlighting.

  **The operation IS a hot path** — useMemo dep array contains
  `activityQueryString` which can change on every page render
  where URL query params change (the Activity page filter
  changes). Each rebuild creates 9 new object literals — minor
  GC pressure.
