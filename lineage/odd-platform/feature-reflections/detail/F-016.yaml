- id: H-004
  hypothesis: "When an operator views a DEG's group lineage, the graph includes the DEG's external context — the upstream sources outside the DEG that feed its members and the downstream consumers outside the DEG that read from them — so the operator can see what the group consumes and produces."
  derivation: "Operators reasoning about a domain/pipeline ask 'what does this consume / what consumes from it?'; a lineage view that names 'data flow' is expected to surface boundary-crossing edges."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The edge fetch getLineageRelations(List<String>) filters
      `LINEAGE.PARENT_ODDRN.in(oddrns).and(LINEAGE.CHILD_ODDRN.in(oddrns))` (ReactiveLineageRepositoryImpl.java:112-119)
      — BOTH endpoints must be DEG members. Edges exiting the DEG (member → non-member) and entering the DEG
      (non-member → member) are dropped. The endpoint answers ONLY 'what is the internal connectivity among
      members?', never 'what does this DEG consume / feed?'. The behaviour is deliberate (membership-bounded view)
      but the docs do not name which question the endpoint answers.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityGroupsLineage.md
        section: invariants[5] / implicit_adrs / bugs_limitations_corner_cases
        cite: "ReactiveLineageRepositoryImpl.java:112-119"
        note: "Bidirectional IN filter; cross-boundary edges silently dropped."
    operator_visible_failure: |
      (1) An operator asks 'what does this Finance domain consume from outside?' and the canvas shows nothing
      crossing the boundary — they conclude (wrongly) the domain is self-contained. (2) The UI gives no affordance
      signalling 'there IS external context; open per-entity lineage on a member to see it'. (3) A regression that
      loosened the filter to a single-endpoint IN clause would silently LEAK external-edge metadata into the DEG
      response with no test to catch it.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: "When an operator requests group lineage for a DEG id that does not exist, the system returns an error that distinguishes 'no such group' from other failure conditions, so the operator can debug the call."
  derivation: "REST consumers expect a 404 to mean a specific, discriminable condition; the response-shape signal (a single NotFoundException) implies one condition."
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |
      The endpoint DOES return 404 for a non-existent DEG — but the SAME 404 (NotFoundException 'Data entity group',
      LineageServiceImpl.java:62, via switchIfEmpty on an empty member Flux) fires for THREE semantically different
      conditions: (a) the DEG id does not exist; (b) the DEG exists but has zero non-soft-deleted members; (c) the
      id references a Data Entity that exists but is NOT a DEG (the CTE returns empty for any id without
      group_entity_relations rows). The message is identical in all three. So the hypothesis holds for case (a) in
      isolation but FAILS the discrimination promise: the operator cannot tell which of the three they hit.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityGroupsLineage.md
        section: bugs_limitations_corner_cases / invariants
        cite: "LineageServiceImpl.java:62 + ReactiveGroupEntityRelationRepositoryImpl.java:182-204"
        note: "switchIfEmpty 404 conflates DEG-not-found / empty-DEG / non-DEG-typed-id."
      - sidecar: odd-platform__java__service__service__LineageServiceImpl.md
        section: invariants[1]
        cite: "LineageServiceImpl.java:62"
        note: "404 only on empty member Flux; member-present-but-no-edges returns 200 with empty items."
    operator_visible_failure: |
      (1) An operator debugging 'why is my DEG-lineage call 404?' has no way to discriminate a typo'd id from an
      empty DEG from 'I passed a dataset id, not a DEG id'. (2) A future refactor that splits the conditions has no
      regression anchor. (3) Cross-endpoint: the sibling membership endpoint returns 200-empty for the same
      conditions (see H-011), so the two endpoints disagree on polarity — doubling the operator confusion.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

