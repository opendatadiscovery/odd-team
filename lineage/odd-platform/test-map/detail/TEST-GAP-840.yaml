proposed_action: |-
  **Phase 1 — Vitest UI tests** (3 tests using mocked backend responses):

  1. `paginate_serverReportsCountGreaterThanRows_uiInfiniteLoopsForever_pinsREFACTOR425Bypass` — mock the API to return `{total: 1000, items: []}` on page 1, then `{total: 1000, items: []}` on page 2, etc. Render Search, trigger infinite scroll, assert UI keeps requesting more pages indefinitely (with a test-time cap of 20 requests to avoid hanging the test). PINS the current bypass.

  2. `paginate_serverReportsCountLessThanRows_uiTerminatesEarly_pinsSilentDataLoss` — mock the API to return `{total: 30, items: [Entity1..Entity30]}` on page 1, then `{total: 30, items: [Entity31..Entity60]}` on page 2 (the server has 60 entities matching but counted 30). Render Search, trigger pagination, assert the UI stops at page 1 (since `1 * 30 < 30 === false`). PINS the silent data loss.

  3. `paginate_serverReportsConsistentCountAndRows_uiCorrectlyPaginates_pinsHappyPath` — sanity check: `{total: 60, items: [...30]}` × 2 pages, UI fetches both, then stops. PINS the happy path.

  **Phase 2 — Cross-tier Playwright regression-pin**:
  - `seedEntityWithExcludeFromSearchAndPaginateCatalog_uiBehavesPredictably_pinsCrossTierDivergence_playwrightCIPermanent` — boot test-platform, seed 100 entities with EXCLUDE_FROM_SEARCH=true on half of them, navigate to Catalog, paginate through all results. Assert UI either (a) renders consistent results matching server-reported count OR (b) surfaces a "results incomplete" warning. PINS the cross-tier divergence as a UX behaviour contract.

  **Architectural fix dependency**: The REFACTOR-425 fix needs to be applied at the BACKEND query layer (predicate consistency between COUNT and SELECT). The UI test pins the CONSUMER behaviour — when the divergence is fixed at the backend, this UI test still verifies the UI never had a defensive check for the case (the architectural posture is "the UI trusts the server" which is a per-design choice, but should be documented).

  Coherence note (LSN-018 Rule 6): STRENGTHENS the REFACTOR-425 family by establishing the UI-tier consumer surface explicitly. NO contradiction with existing artefacts. The pagination-blind-trust posture is consistent across Search.tsx and Results.tsx; the test pins both consumer surfaces in one file.
