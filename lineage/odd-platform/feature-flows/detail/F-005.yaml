feature_name: Downstream lineage traversal — default depth handling
discovered_from_entry_point: rest:GET /api/dataentities/{id}/lineage/downstream
description: 'The lineage-downstream endpoint accepts an optional lineage_depth query

  parameter. OpenAPI declares it `required: false` (so callers may omit it)

  and the live API-reference doc claims "Unset returns the platform''s

  default depth". The implementation uses primitive `int` for the parameter;

  null → autoboxing throws NullPointerException → 500. The documented

  contract is unimplementable. Batch-H adds primary-source SQL confirmation

  at the repository layer (ReactiveLineageRepositoryImpl.lineageCte lines

  150-176): the recursive CTE has NO depth cap, NO cycle guard, and NO

  JOIN-side owner filter — confirming REFACTOR-202 (cycle/diamond

  amplification) and REFACTOR-203 (cross-owner enumeration) from primary

  source.

  '
