behaviour: '**SOFT-DELETE-ORPHAN-BINDING SECURITY GAP.** getRolesPolicies does NOT
  filter by `deleted_at IS NULL` — soft-deleted policies still attached to a role
  appear in the result. A soft-deleted policy retains its statements; transitively,
  a soft-deleted MANAGEMENT/ALL policy bound to a user''s role continues to grant
  ALL Management permissions. The PolicyServiceImpl.delete defence at lines 89-92
  prevents this in normal flows by refusing to soft-delete a bound policy, BUT (a)
  any direct DB UPDATE setting deleted_at on a bound policy creates the orphan-binding
  security gap; (b) any future refactor weakening the service-layer check re-opens
  the gap. Pin the current (potentially-buggy) behaviour AND surface the gap as a
  CRITICAL backlog item. test_class: integration / security.'
