notes: |-
  Cross-batch confirmation captured in batch 2026-05-19L. Together with the
  batch-H "three-soft-delete-mechanisms-across-the-repository-layer"
  invariant, this completes the platform's persistence-layer deletion map:

    Operator-facing entity tables → SOFT-DELETE (3 variants):
      - deleted_at timestamp (policy, role, owner, datasource, collector,
        namespace, tag, term)
      - is_deleted boolean (lineage)
      - STATUS = DELETED state-machine (data_entity)

    Relationship-edge tables → HARD-DELETE on user action,
      SOFT-DELETE on entity-deletion cascade (where applicable):
      - data_entity_to_term (hard; cascade also hard, no restore)
      - group_entity_relations (hard on user; soft on cascade; restore
        path exists)
      - ownership (hard; no cascade)
      - term_ownership (hard; deleted_at dropped in V0_0_76)

  Cross-cutting connections:
    - Strengthens "three-soft-delete-mechanisms-across-the-repository-layer"
      (batch H) with the relationship-edge cluster's behaviour
    - Pairs with "no-audit-log-on-rbac-mutations" — when HARD-DELETE
      removes the only persistent trace and no audit log exists, the
      change is forensically invisible

  Two DOC-NNN candidates:
    (a) Document the HARD-DELETE-on-user vs SOFT-DELETE-on-cascade split
        on operator-facing feature pages (groups-domains, business-glossary,
        owners)
    (b) Add a "Persistence layer deletion conventions" appendix to the
        Architecture doc page naming all variants
