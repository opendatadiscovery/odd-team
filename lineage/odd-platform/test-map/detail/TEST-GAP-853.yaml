behaviour: |-
  **LOW — Onboarding UX gap: empty-state copy doesn't distinguish "no catalog yet" from "filter returned nothing". IDENTICAL pattern to TermSearch batch-U bugs[8] — clone-propagated.** Results.tsx:161-165 renders `<EmptyContentPlaceholder ... text={t('No matches found')}/>` whenever `!searchResults.length`. A fresh deployment with no data entities sees 'No matches found' — an operator new to ODD would reasonably expect 'No data entities exist yet — start by ingesting your first data source' or similar onboarding-shaped copy.

  **Pairs with WebFetched docs**: the live docs describe Search as a way to find existing entities but DO NOT say what an empty catalog looks like. An operator landing on a fresh deployment + Search page gets a misleading signal: "I searched correctly but the catalog has nothing" — when the truth is "the catalog has nothing because you haven't deployed a collector yet".

  **Why LOW**:
  - **UX-only impact** — no security / data integrity issue
  - **Operator-onboarding cost** — adds friction to the first-hour experience on a new deployment
  - **Easy fix** — single-line copy change + a check for `totalCatalogEntities === 0`
  - **Cross-cutting** — same pattern in TermSearch.tsx (clone-propagated)

  **Test gap shape**: A `Search.test.tsx` rendering test for the zero-catalog state, asserting the copy is distinguishable (currently identical) or PINS the current pattern.
