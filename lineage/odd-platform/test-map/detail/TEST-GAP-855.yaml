behaviour: |-
  **CRITICAL — `listMostPopular` does NOT order results by popularity when the tag directory exceeds `size` tags. The method name + the OpenAPI description (`'Gets the list of existing tags sorted by popularity'` at `openapi.yaml:345`) + the UI label ('Top Tags') all promise count-ranked results. The implementation truncates the candidate pool by `TAG.ID ASC` (= creation order, since `tag.id` is a serial column) BEFORE counts are computed.** No integration test exists that pins the ACTUAL ranking semantics (oldest-window selection, then count-DESC re-sort INSIDE that window) under the equal-usage-count degenerate case. The existing `testListMostPopular` at `TagRepositoryImplTest.java:239-267` is STRUCTURALLY BLIND to the drift: (a) it creates only 8 tags with `size = numberOfTestTags = 8`, so the LIMIT never fires; (b) it uses `containsExactlyInAnyOrder` (line 264), so any order would pass; (c) it gives 4 of the 8 distinct, sortable usage counts via the renamed `PopularName0..3` subset, so the drift is MASKED. A future test that ASSUMED the name's promise (e.g. "create 35 tags with the 5 youngest having HIGHER counts; assert response contains the 5 youngest") would FAIL on a real platform — empirically reproduced 2026-05-20.

  **The chain trace** (per ReactiveTagRepositoryImpl.md:stress_findings.B1):
  - `ReactiveTagRepositoryImpl.java:144-145`: `final Select<TagRecord> homogeneousQuery = DSL.selectFrom(TAG).where(conditions);` — base select, soft-delete filter + optional name-substring + optional id-list.
  - **`ReactiveTagRepositoryImpl.java:148`**: `paginate(homogeneousQuery, List.of(new OrderByField(TAG.ID, SortOrder.ASC)), (page - 1) * size, size)` — load-bearing INNER pagination by `TAG.ID ASC` BEFORE count aggregation.
  - `JooqQueryHelper.java:63-90` (paginate): emits SQL `SELECT u.*, count(*) OVER () _total, row_number() OVER (ORDER BY u.id ASC) _row FROM (homogeneous) u ORDER BY u.id ASC LIMIT size OFFSET (page-1)*size`.
  - `ReactiveTagRepositoryImpl.java:150`: `tag_cte` materialised over the OLDEST `size` tags by tag.id.
  - `ReactiveTagRepositoryImpl.java:151 + 373-391` (`getDataEntityWithDatasetFields`): WITH tag_cte AS (...) LEFT JOIN tag_to_data_entity GROUP BY tag_cte.fields UNION ALL LEFT JOIN tag_to_dataset_field GROUP BY tag_cte.fields AS union_usages — count aggregation OVER the CTE rows ONLY.
  - **`ReactiveTagRepositoryImpl.java:158`**: outer `cteSelect.orderBy(field(COUNT_FIELD).desc())` — re-orders ALREADY-SELECTED `size` rows by count DESC, but cannot reach excluded tags.
  - **Tie-break absence**: outer ORDER BY count DESC has NO secondary sort key (per ReactiveTagRepositoryImpl.md:stress_findings.C1). When two tags have equal aggregated count, PostgreSQL preserves the GROUP BY's natural row order — inherited from the CTE = tag.id ASC. So at equal-counts, the result is tag.id ASC = oldest-first.

  **Empirical confirmation** (`retrospectives/LSN-019:23-32`, 2026-05-20 maintainer test against demo.oddp.io): 35 tags created with known IDs, every entity tagged by all 35, size=30, page=1 → response contains tags with IDs 1..30 in tag.id ASC order; tags with IDs 31..35 are MISSING from the response despite being EQUALLY POPULAR. The "Top Tags" UI surface renders 30 OLDEST tags, NOT 5 youngest-and-popular.

  **Operator-visible consequences**:
  - The Catalog Overview "Top Tags" chip strip + the tag-search facet + the data-entity detail tag-dropdown all render the OLDEST 30 tags. Recently-created popular tags are INVISIBLE on page 1.
  - On a directory with >30 tags, the operator-meaningful "what's trending" semantics is broken at the application layer; only by paging through every page can a user discover newer tags.
  - The OpenAPI promise — `'Gets the list of existing tags sorted by popularity'` — is silently unmet. SDK consumers building against the spec build wrong expectations.

  **Why CRITICAL not HIGH**: this is a structural correctness defect on a user-facing surface (`/api/tags`, `/api/tags/popular`); empirically reproducible; widely-affected (every operator-visible "Top Tags" surface); no test gate at any layer; a future "fix" that pushes ORDER BY count INSIDE the paginate window would silently CHANGE observable behavior with no CI signal. The previous batch-W sidecar transcribed the SQL as "orders by descending count" — the WRONG claim, the canonical LSN-019 failure mode (file-analyser describes-not-interrogates). A regression-pin probe (P-010) is emitted as a yaml skeleton; this test gap converts the probe into a CI-runnable Testcontainers-backed `@SpringBootTest`.
