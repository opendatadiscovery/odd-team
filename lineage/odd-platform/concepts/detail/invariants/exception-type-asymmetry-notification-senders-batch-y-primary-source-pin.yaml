    PostgresWALMessageProcessor's throws clause OR change the return
    type to a typed ProcessResult that wraps per-sender outcomes (see
    sibling invariant cross-channel-runtimeexception-abort-void-return-root-cause-at-postgreswalmessageprocessor
    for full discussion).
