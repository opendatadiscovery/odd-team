name: Housekeeping TTL retention
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-08
- P-04
- P-07
description: |-
  Time-based retention subsystem — a `@ConditionalOnProperty(housekeeping.enabled=true)`
  `HousekeepingJobManager` fires every 15 minutes (Spring `@Scheduled(fixedRate
  = 15, timeUnit = MINUTES)`, ShedLock-coordinated as `housekeepingJob`
  with `lockAtLeastFor=14m / lockAtMostFor=14m`) and iterates a discovered
  `List<HousekeepingJob>` of FIVE jobs total: three TTL-driven purge jobs
  (`AlertHousekeepingJob`, `SearchFacetsHousekeepingJob`,
  `DataEntityHousekeepingJob`) each consuming one of
  `HousekeepingTTLProperties`' three int fields (`resolved_alerts_days`,
  `search_facets_days`, `data_entity_delete_days` — all defaulted to 30 in
  `application.yml:167-170`), plus two `EmptyPartitionsHousekeepingJob`
  subclasses (`ActivityEmptyPartitionsHousekeepingJob`,
  `MessageEmptyPartitionsHousekeepingJob`) that drop EMPTY past partitions
  only (no TTL coupling). The TTL surface covers EXACTLY three tables:
  ALERT (with ALERT_CHUNK cascade), SEARCH_FACETS, and DATA_ENTITY (with
  ~25-table cascade via DataEntityHousekeepingJob). **NO time-based
  retention exists for the ACTIVITY or MESSAGE tables anywhere in the
  codebase** — REFACTOR-085 confirmed from primary source. **STRENGTHENED
  batch 2026-05-19K** — HousekeepingJobManager primary-source pinned
  (orchestrator-side angle). 5 implicit ADRs surfaced: per-job failure
  isolation; shared connection across all jobs in a cycle; ShedLock window
  deliberately 14m=14m; strict opt-in via matchIfMissing-omission;
  orchestrator separation from partition-creation (two parallel schedulers
  — housekeepingJob vs partitionCreationJob — with distinct package
  homes, ShedLock names, and cadences). The AlertHousekeepingJob
  jOOQ-precedence bug (REFACTOR-142) is now PRIMARY-SOURCE PINNED to
  `AlertHousekeepingJob.java:28-34` with the exact emitted SQL + fix shape
  (one-line parenthesisation change). The `.block()`-inside-transaction
  anti-pattern (REFACTOR-145) is cross-confirmed from the manager-side
  angle.

  **STRENGTHENED batch VAL-LSN-019-B (2026-05-20)** —
  `ActivityEmptyPartitionsHousekeepingJob` FRESH sidecar adds the FIRST
  PRIMARY-SOURCE pin to the 4th of 5 housekeeping beans (the prior
  HousekeepingTTLProperties + HousekeepingJobManager sidecars only
  mentioned this bean by enumeration). Three NEW findings surface from
  the dedicated activity-reaper sidecar:
    (a) The empty-only contract is structurally enforced at the abstract
        base's template method (the AND-guard at PartitionServiceImpl.java:110)
        — the activity reaper cannot bypass the empty-check even if
        someone wanted to.
    (b) The activity reaper is functionally a near-no-op on steadily-used
        platforms (60-day-wide partitions rarely empty out) — REFACTOR-085
        is now confirmed from a FIFTH angle: the empty-only contract is
        honored at the centre but rarely fires on busy deployments.
    (c) Race window between count(*)=0 check and DROP TABLE — silent row
        loss (promoted to dedicated invariant
        `activity-empty-partitions-race-window-between-count-check-and-drop`).
    (d) The `SELECT count(*) = 0` check is an unindexed sequential scan
        on every past partition per 15-min cycle — for populated
        deployments, multi-GB scans per partition per cycle (P-013 probe
        emitted) — NEW performance finding.

  vocabulary_status: codebase-anchored,
  doc-side-partially-covered (live
  `/configuration-and-deployment/odd-platform#housekeeping` documents the
  three TTL keys and the master gate, but enumerates only 'three cleanup
  tasks' — the two EmptyPartitions jobs are not listed). main-concepts.md
  does not name 'Housekeeping' or 'Retention' as canonical vocabulary.

  **STRENGTHENED batch ZK (2026-05-26)** — TWO config-properties-class
  layer sidecars from this batch land on the housekeeping subsystem:

  (1) HousekeepingTTLProperties — REV-2 RE-ENRICHED at file-analyser/0.4.0
      with Stress Protocol categories, Category F request-input alignment,
      upstream_callers, downstream_side_effects, and an emitted probe
      P-181 for the negative-value / overflow boundaries. The PRIOR
      batch-D HousekeepingTTLProperties sidecar is now superseded by the
      rev-2 schema. All prior findings preserved: Java-vs-YAML default
      mismatch (LSN-001 shape — overriding application.yml without
      re-supplying housekeeping.ttl.* silently rebinds to 0); no
      @Min(0)/@PositiveOrZero validation (negative values bind silently
      and produce now() + (-N) days = future cutoff = delete-everything);
      no audit log of housekeeping deletions; no dry-run / preview /
      backup-before-delete; missing activity/message TTL fields; the
      AlertHousekeepingJob jOOQ-precedence bug from the config-key
      angle. P-181 NEW probe pins the negative-value / Integer.MAX_VALUE
      boundary behaviours.

  (2) SchedulingConfiguration — NET-NEW sidecar (file-analyser/0.4.0).
      The 26-line @Configuration class that turns on the entire
      scheduled-task subsystem via @EnableScheduling + @EnableSchedulerLock
      + the lockProvider Bean. The CRITICAL findings:

      (a) Spring's default ThreadPoolTaskScheduler is SINGLE-THREAD (no
          spring.task.scheduling.pool.size set anywhere; no custom
          TaskScheduler @Bean). All four @Scheduled jobs in the codebase
          (housekeeping 15min, status-switch 10min, partition-creation
          daily 00:01, session-housekeeping 1h) share ONE thread. A
          14m housekeeping cycle BLOCKS the 10m status-switch from
          running on schedule. **Undocumented in live docs**. P-183
          probe emitted for the cron-misfire behaviour empirical
          confirmation.

      (b) `.usingDbTime()` on the JdbcTemplateLockProvider — the
          POSITIVE implicit ADR. PG's current_timestamp is the
          authoritative time for shedlock arbitration, neutralising
          JVM clock-skew across replicas. Without this call (the
          ShedLock library default), two replicas with drifted clocks
          would disagree on lock validity. **Undocumented** in live
          docs even though it is the operational safety mechanism for
          multi-replica deployments under clock drift.

      (c) `defaultLockAtMostFor = "1h"` is currently DEAD CODE — all
          three @SchedulerLock methods in the codebase set their own
          lockAtMostFor explicitly (housekeeping 14m, status-switch 9m,
          partition-creation 10m). The 1h default exists as a safety
          floor for future @SchedulerLock annotations. Latent.

      (d) PostgreSQLSessionHousekeepingJobHandler has @Scheduled but
          NO @SchedulerLock — runs on EVERY replica per hour
          (5-replica deployment = 5x housekeeping invocations per hour).
          This is the existing housekeeping-job-no-scheduler-lock-multi-instance-amplification
          invariant; the SchedulingConfiguration sidecar CONFIRMS the
          finding from the platform-level scheduling-foundation angle
          and locks in the convention violation.

      (e) Shared primary DataSource (HikariCP pool) for both jOOQ
          traffic AND ShedLock UPSERTs — sub-1-QPS shedlock writes
          but a HikariCP-pool-exhaustion event would silently skip a
          @SchedulerLock acquisition cycle. Resource-economy decision;
          documented in implicit_adrs.

      Triangulation count rises from 3 to 4 (HousekeepingTTLProperties
      batch ZK rev-2 + SchedulingConfiguration batch ZK NEW +
      HousekeepingJobManager batch K + ActivityEmptyPartitionsHousekeepingJob
      batch VAL-LSN-019-B).

      Two NEW probes from SchedulingConfiguration: P-183 (cron-misfire
      under thread starvation) + P-182 (multi-instance lock race
      under usingDbTime).
