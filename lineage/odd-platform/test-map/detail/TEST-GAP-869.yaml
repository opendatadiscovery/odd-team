behaviour: |-
  **CRITICAL — No test pins the audit-or-fail contract: an `ActivityRepository.saveReturning` failure inside the aspect's `@ReactiveTransactional` rolls back a SUCCESSFUL business mutation, surfacing HTTP 500 to the user with no indication the mutation was actually executed-but-rolled-back.** The `ActivityAspect.monoActivityAspect` (`ActivityAspect.java:42`) carries `@ReactiveTransactional`; the around-advice wraps the WHOLE chain `getContextInfo → joinPoint.proceed() → postActivity → activityRepository.saveReturning` in ONE R2DBC transaction. A transient DB error on the activity-row write (partition-coverage gap, connection lost, R2DBC pool exhaustion at the activity-INSERT stage) causes the OUTER reactive chain to surface `onError`, which the @ReactiveTransactional advisor catches → rollback of the entire transaction → the business mutation (e.g. ownership update, description edit, tag assignment) is REVERTED. **The user sees HTTP 500 with no signal that their mutation was, for a few hundred milliseconds, committed in the database.** This is the intentional `audit-or-fail` semantic captured at `implicit_adrs.[2]` — but ZERO test pins it. A future refactor that decouples the TX (e.g. moves the activity emit to an `@Async` post-commit hook or a separate inner TX with `Propagation.REQUIRES_NEW`) would silently change the semantic to "best-effort audit, mutation always succeeds" — a behavioural inversion that operators relying on audit-completeness would NOT detect.

  **Primary-source chain**:
  - `ActivityAspect.java:42` — `@ReactiveTransactional` on `monoActivityAspect` (the @Around advice that wraps every `@ActivityLog`-annotated method)
  - `ActivityAspect.java:48-58` — the chained `getContextInfo → joinPoint.proceed → postActivity` flow under ONE TX
  - `ActivityAspect.java:62` — `@ReactiveTransactional` on `fluxActivityAspect` (the Flux variant)
  - `ActivityServiceImpl.java:46-52` — `createActivityEvent` returns `Mono<Void>` with NO local TX boundary; the caller's TX wraps it
  - `ActivityServiceImpl.java:50` — `activityRepository.saveReturning(pojo)` — the failure point. If this Mono signals `onError`, the entire reactive chain back to the aspect surfaces the error to the @ReactiveTransactional advisor, which rolls back.
  - `ReactiveActivityRepositoryImpl.java:50-54` — `saveReturning` is an unconditional INSERT (per repository sidecar lines 50-54); any partition-coverage gap, FK violation, or connection error surfaces here.

  **The 18+ `@ActivityLog`-annotated business methods** all share this contract (per ActivityHandler.md:upstream_callers):
  - `DataEntityServiceImpl.upsertBusinessName` (BUSINESS_NAME_UPDATED)
  - `DataEntityServiceImpl.upsertTags` (TAG_ASSIGNMENT_UPDATED)
  - `OwnershipServiceImpl.create / delete / update` (OWNERSHIP_*)
  - `DatasetFieldInternalInformationServiceImpl.updateDescription` (DATASET_FIELD_DESCRIPTION_UPDATED)
  - `DatasetFieldServiceImpl.updateInternalName / updateDatasetFieldTags`
  - `AlertHaltConfigServiceImpl.saveAlertHaltConfig`
  - `TermServiceImpl.linkTermWithDataEntity`
  - (10 more enumerated in ActivityHandler.md upstream_callers)

  ALL of these inherit the `audit-or-fail` semantic. A regression that breaks the TX coupling silently changes the semantic for the entire write surface.

  **Operator-visible consequences**:
  - **Current behaviour (PINNED)**: when activity-row INSERT fails, the user-facing mutation rolls back → user sees 500 → user can retry → the mutation appears not to have happened. Audit trail consistency is preserved.
  - **Without this test, a future refactor** that splits the TX (decoupled audit) would silently change behaviour:
    - User submits mutation → mutation commits successfully → activity-row INSERT fails (silently logged) → user sees 200 OK → audit trail has a hole.
    - This is the **opposite** behaviour and represents the failure mode of every audit system that drifts toward eventual-consistency without owner buy-in.

  **Why CRITICAL not HIGH or MEDIUM (sidecar says LOW)**:
  - The sidecar rates this LOW because the current behaviour is intentional and the surface symptom (HTTP 500) is obvious.
  - **We elevate to CRITICAL because**: (a) the contract is LOAD-BEARING for audit-trail consistency across the ENTIRE platform (18+ write surfaces); (b) the regression risk is INVISIBLE (a TX-split refactor compiles and passes every existing test); (c) the inverted behaviour breaks the audit-or-fail promise documented at the `activity-feed.md` doc page ("system events are recorded as system events on the feed" — implying every recorded mutation has a corresponding audit row).
  - The Activity Feed is the platform's primary forensic surface (per F-021); changing its TX coupling without coordination is a **structural betrayal** of operators' trust in the audit log.

  **Connection to TEST-GAP-868**:
  - TEST-GAP-868 pins the OLD-vs-NEW race within the @ReactiveTransactional boundary
  - This gap (869) pins the TX COUPLING itself — the inverse direction (audit failure cascading to mutation failure)
  - Together they fully characterise the @ReactiveTransactional boundary contract
