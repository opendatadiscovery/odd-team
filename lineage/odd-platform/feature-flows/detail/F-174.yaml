primary_drift_class: history_tab_only_audits_owner_association_request_flow_not_direct_user_owner_mapping_writes
drift_class_summary:
  - history_tab_only_audits_owner_association_request_flow_not_direct_user_owner_mapping_writes
  - request_status_component_silent_fallback_to_pending_for_unknown_status_values
