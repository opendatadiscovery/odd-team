proposed_canonical: GitHub Enterprise Server unsupported (hard-coded api.github.com)
rationale: |-
  `GithubUserHandler.java:39` carries the hard-coded singleton WebClient
  `WebClient.create("https://api.github.com")` — created at field-init,
  NOT injected via `WebClient.Builder`, NOT operator-configurable. A GitHub
  Enterprise Server (GHES) deployment whose API lives at e.g.
  `https://github.example.com/api/v3` cannot use this handler. The
  GithubCondition only checks the literal string `GITHUB` (case-insensitive)
  on `auth.oauth2.client.*.provider`, so a GHES operator who configures
  `provider: github` (the documented value) gets the handler instantiated,
  the WebClient bound to api.github.com regardless of where their GHES
  lives — outbound calls fail with DNS/cert errors and the user sees a
  generic OAuth2 login failure with no diagnostic. The platform has no
  comment / exception / annotation defending the hard-code, and no
  `ODDOAuth2Properties.OAuth2Provider.apiBaseUrl` field (verified by Read
  of ODDOAuth2Properties.java:31-53 — six per-client String fields, none
  for API base URL). The live OAuth2/OIDC docs (WebFetched 2026-05-19,
  status 200) document GitHub provider configuration but do NOT mention
  GHES or warn that GHES is incompatible. Three-fold operator surprise:
  (a) `provider: github` is the documented value, (b) the bean activates,
  (c) login fails silently with no GHES-side error chain. Fix is one
  field addition (apiBaseUrl + default api.github.com) plus one constructor
  parameter on the WebClient — minimal-scope code change for significant
  operator-mental-model parity.
contributing_concepts:
  - GithubUserHandler.java:39 (hard-coded WebClient.create("https://api.github.com"))
  - GithubUserHandler.bugs_limitations_corner_cases[1] (GHES incompatible)
  - GithubUserHandler.docs_link_semantic.doc_drift_findings[1] (live docs silent on GHES)
  - ODDOAuth2Properties.OAuth2Provider POJO (lines 31-53; no apiBaseUrl field)
  - GithubCondition.java:10-15 (matches on literal `GITHUB`, no GHES check)
suggested_add_to_docs: true
