behaviour: |-
  **Ghost metadata fields surface on the per-entity detail page.** `getDtosByDataEntityId(long dataEntityId)` (lines 111-121) joins `metadata_field_value mfv JOIN metadata_field mf ON mf.id = mfv.metadata_field_id WHERE mfv.data_entity_id = ?` with NO `.where(METADATA_FIELD.DELETED_AT.isNull())` filter. A `metadata_field` that was soft-deleted but has surviving `metadata_field_value` rows still surfaces on the entity detail page Metadata panel. The user sees a 'ghost field' that was supposed to be removed; nothing in the UI signals that the field is soft-deleted. The FTS path (`updateMetadataVectors`) also re-indexes the field's NAME tokens for the entity, making the soft-deleted field's name searchable again. This is a particularly insidious bug because the operator-side UX assumption (`I deleted that field → it's gone`) is violated silently — only entities WITHOUT values for the field stop showing it; entities WITH values continue to render it.
