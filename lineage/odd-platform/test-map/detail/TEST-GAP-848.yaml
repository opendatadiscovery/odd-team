proposed_action: |-
  **Phase 1 — UI rendering tests** (2 tests):
  - `renderDirectory_serverReturnsOtherBucket_currentlyRendersIdenticalCard_pinsNoDisambiguation` — render Directory with mocked API returning `[{prefix: 'postgresql', ...}, {prefix: 'other', entitiesCount: 5}]`. Assert the second card renders identically to the first (no special UI signal). PINS the current behaviour.
  - `renderDirectory_serverReturnsOtherBucketWithNonZeroEntitiesCount_pinsSilentMisparsing` — same but assert the 'Other' card shows a non-zero count without any operator affordance.

  **Phase 2 — Backend integration test**:
  - `getDirectory_seedDatasourceWithMalformedODDRN_responseContainsOtherBucket_pinsServerSideBucketing` — seed a datasource with malformed ODDRN, hit `GET /api/directory`, assert response contains `{prefix: 'other'}`. PINS the server-side bucketing contract.

  **Architectural fix recommendation**:
  - UI: add a tooltip on the 'Other' card explaining the bucket + link to operator docs
  - UI: distinct icon/color for 'Other' to visually separate it from known prefixes
  - Doc: add docs/features/data-discovery/directory.md section explaining 'Other' + operator action path
  - Tests then flip assertion direction (assert the disambiguation UI exists)

  Coherence note (LSN-018 Rule 6): STRENGTHENS F-023 batch-T facet 6 by establishing the UI-tier silent-rendering as the operator-observability gap. NO contradiction with existing artefacts.
