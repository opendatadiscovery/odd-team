behaviour: Empty-query persistence — `query = ''` creates a real `search_facets` row
  and runs the full count aggregation (the suggestions endpoint short-circuits empty
  queries at the repository, but `search` does NOT). Combined with the absence of
  rate-limiting and the unbounded `search_facets` table growth (TTL housekeeping at
  REFACTOR-141 — overriding application.yml without re-supplying the housekeeping
  block silently binds 0 days), pathological case is also a data-loss vector.
