security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      A React component has no authorization surface. The filter panel inherits the
      `/data-quality` route's bare-mount (App.tsx:73, no WithPermissionsProvider);
      whoever can reach the dashboard can use the filter panel. The autocomplete
      list APIs the panel calls (useGetNamespaceList / useGetDataSourceList /
      useGetOwnerList / useGetTitleList / useGetTagList) inherit their own
      controllers' gates — REFERENCE, not enrichable from the UI sidecars.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The panel writes filter IDs; the backend's owner_scoping decision lives in
      ReactiveDataQualityRunsRepositoryImpl.getConditionsForFilters — OWNERSHIP is
      joined ONLY when the operator supplies owner/title FILTER ids (it is a
      user-driven filter, NOT a security scope). No principal-derived predicate at
      this tier. Severity LOW for the panel itself; the wider dashboard's
      catalog-wide visibility is captured in the parent Data Quality Dashboard
      entity's security_aggregate.
  strengths:
    - |-
      The two filter sets are CONCEPTUALLY independent — table-side and test-side
      selections never interfere; the two Clear buttons each touch only their own
      five keys. The independence invariant is enforced by code (atom write
      surface), not by convention.
    - |-
      The panel exposes only read-direction effects (atom write + URL update); no
      mutation surface. The "form" naming in `formFiltersAtom` mildly over-promises
      a draft stage the code doesn't implement (live filtering on every chip), but
      no operator-visible security consequence.
  weaknesses:
    - |-
      Filter selections (including which owners/namespaces an operator is
      investigating) are written verbatim into the URL query string with their NAMES
      (not just ids) — DataQualityFilters.tsx:50 JSON-stringifies the full
      FilterOption[] including the `name` field. The URL is therefore visible in
      browser history, server access logs, and any referer header — a low-sensitivity
      leak of which catalog objects an operator filtered by. Severity LOW.
    - |-
      Filter autocompletes ENUMERATE catalog metadata (namespaces, datasources,
      owners, titles, tags) to any user who can reach /data-quality (i.e. any
      authenticated user; anonymous under DISABLED). For an operator who should
      not see the full owner roster, the autocomplete is an enumeration surface —
      though the same exposure exists in every catalog list view.
    - |-
      A swapped `filterKey` prop (a maintainer typo placing `titleIds` in the
      tables-side block where the code expects `deTitleIds`) would mis-route the
      filter with no compile error and silently filter the wrong side. No test
      pins the wiring. Severity LOW (no production trigger today; latent risk).
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityFilters.md
    - DataQualityStore.md
  evidence:
    - DataQualityFilters.md:security.known_security_gaps.[0] (filter names leaked to URL)
    - DataQualityFilters.md:security.data_exposure (enumeration surface for catalog metadata)
    - DataQualityFilters.md:bugs_limitations_corner_cases.[6] (swapped filterKey type-checks silently)
performance_aggregate:
  overall: LOW
  hot_paths:
    - |-
      Every keystroke in any of the ten filter autocompletes fires a list-API
      request (the searchText is the React-Query key; no debounce, no minimum
      character gate). Filling the 10-slot panel generates a burst of requests.
      MultipleFilterItemAutocomplete.tsx:57-66 + hooks/index.ts:11-17
    - |-
      Every selection/deselection in any filter mutates `formFiltersAtom`, which
      re-derives `filtersAtom`, triggers a new `getDataQualityTestsRuns` request
      in DataQualityContent (the multi-CTE, multi-join dashboard SQL runs on
      every single filter change — no debounce, no Apply gate).
      DataQualityStore.ts:32-42 + DataQualityFilters.tsx:46-54 + DataQualityContent.tsx:23-24
    - |-
      Every `useFilter` instance subscribes to the WHOLE `formFiltersAtom`, so one
      filter change re-renders all ten FilterItem components. The codebase ships an
      unused per-key `getFieldFilterAtom` (DataQualityStore.ts:24-30) — the focused-
      atom fix exists in the same file but is not applied.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One dashboard GET per filter change; one autocomplete GET per keystroke;
      no batching. React Query dedupes identical concurrent keys but not distinct
      prefixes.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      Autocompletes hard-code `{page: 1, size: 30}` (hooks/index.ts:13-16) with
      no page-increment, no infinite-scroll, no 'load more'. A catalog with >30
      owners/tags/titles for a given search prefix is not fully filterable.
      Silent truncation — no 'showing 30 of N' indicator.
  strengths:
    - |-
      The store math is trivially cheap (Object.keys reduce over 10 keys);
      memory is bounded by how many chips the operator selects.
    - |-
      Per-mount, per-tab stateful — does not scale beyond one operator's session
      and does not need to. Each `formFiltersAtom` write produces a fresh object
      via spread (standard immutable-update, no accumulation).
  weaknesses:
    - |-
      No debounce on autocomplete search — one list request per keystroke
      (severity MEDIUM).
    - |-
      No debounce / no Apply gate between filter selection and dashboard re-query —
      the multi-CTE multi-join getDataQualityTestsRuns SQL runs on every chip
      toggle (severity MEDIUM).
    - |-
      Whole-atom subscription re-renders all ten filter components on any single
      change; focused-atom fix exists but is unused (severity LOW).
    - |-
      Redundant client-side substring filtering layered on top of server-side
      `query` search (severity LOW).
    - |-
      Autocomplete fixed first-30-only with no pagination — operator usability
      ceiling (severity MEDIUM).
  cross_file_inconsistencies:
    - |-
      The no-debounce-on-filter-re-query finding is recorded from THREE angles
      (DataQualityStore, DataQualityContent, DataQualityFilters) — consistent, not
      a disagreement; three sidecars triangulate the same MEDIUM-severity gap.
  contributing_files:
    - DataQualityFilters.md
    - DataQualityStore.md
  evidence:
    - DataQualityFilters.md:performance.known_performance_gaps (all four)
    - DataQualityFilters.md:bugs_limitations_corner_cases.[1-4] (no debounce, stale closure, 30-cap, whole-atom subscribe)
    - DataQualityStore.md:performance.known_performance_gaps (chip toggle re-fetch)
related_features:
  - F-032
related_pillar_features:
  - "P-04:F-002"
notes: |-
  This is the dashboard's INTERACTION tier. The doc-side is the live
  dashboard.md sub-page, which documents the SHAPE (five filters, two sets,
  independence) but is silent on the interaction MODEL (URL deep-link,
  per-side Clear buttons, per-keystroke autocomplete, immediate re-query
  on selection). Three independent DOC-NNN follow-ups.

  The Title filter is the load-bearing LSN-020-class drift (label says
  "Title", SQL binds OWNERSHIP.TITLE_ID — ownership role, not dataset name);
  captured as its own invariant entry
  (dashboard-title-filter-binds-ownership-title-not-dataset-name). The
  Namespace filter has a smaller LSN-020-class drift (label says "Namespace",
  SQL adds .or(NAMESPACE.ID.eq(DATA_SOURCE.NAMESPACE_ID)) — widening); also
  captured as its own invariant.
maintainer_curated: false
