- 'postMessageInSlack.implicit_adrs[0]: counter-example — fail-fast on slack-oauth-token
  (the disciplined response to LSN-002-class risk)'
- 'AppInfoController@L18.bugs_limitations_corner_cases[0]: `@Value("${auth.type}")`
  no default → empty-string injection silently produces no-SecurityWebFilterChain
  deployment'
- 'AppInfoController@L18.bugs_limitations_corner_cases[1]: no enum validation; typo
  (`OUATH2`) silently disables all `@ConditionalOnProperty(havingValue=...)` matches'
- 'CounterTimeSeriesExtractor@L20.bugs_limitations_corner_cases[0]: read/write tenant-id
  label asymmetry on empty-string — write uses `!= null`, read uses `isNotEmpty` —
  same LSN-002 shape (operator supplies empty env var, behaviour silently diverges)'
- 'ActivityTablePartitionManager@L11.bugs_limitations_corner_cases[1]: no `@Min(1)`
  validation on `partition-period`; `0` silently skips partition creation; rows then
  rejected by Postgres with no boot-time fail-fast'
- 'ActivityTablePartitionManager@L11.bugs_limitations_corner_cases[5]: `partition.advisory-lock-id`
  has NO `:default` — operator unsetting fails bean wiring'
- 'IngestionDataEntitiesFilter@L20.bugs_limitations_corner_cases[0]: `auth.ingestion.filter.enabled=false`
  default + no docs surface = bundled deployment ships `/ingestion/entities` unauthenticated
  (LSN-001-class shape on the security side — analogous to attachment-ephemeral-default)'
