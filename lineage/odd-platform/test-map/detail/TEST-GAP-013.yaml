behaviour: 'ExternalAlert.startsAt is timezone-naive `LocalDateTime`; AlertManager''s
  RFC3339 timezone offset is silently stripped by Jackson — alerts stored at AlertManager-side
  wall-clock time interpreted in JVM default zone. STRENGTHENED batch I — the AlertServiceImpl
  sidecar adds the consequence: the URL embedded in the chunk description points to
  a Prometheus query window keyed by the SERVER''s local time, not the alert''s actual
  timestamp. Operators clicking the link may see no data because the query window
  is off. Service-tier primary source confirms the LocalDateTime is propagated verbatim
  into the embedded URL''s g0.moment_input / g0.end_input parameters (lines 162-172).
  STRENGTHENED batch P — the AlertManagerController#postAlerts sidecar is the THIRD
  primary-source: confirms (a) ExternalAlert.java:14 declares `LocalDateTime startsAt`
  (no zone field), (b) Jackson''s java-time module is on the classpath via spring-boot-starter-webflux
  and the default LocalDateTime deserialiser strips RFC3339 offsets silently, (c)
  AlertServiceImpl.java:67-68 declares the formatter `yyyy-MM-dd HH:mm:ss` (no timezone),
  (d) AlertServiceImpl.java:168-172 propagates the naive timestamp into the embedded
  URL''s Prometheus query params. The drift is THREE-LAYER (DTO declaration + Jackson
  default + downstream URL embed) — each test independently asserts the failure mode
  at its own tier.'
