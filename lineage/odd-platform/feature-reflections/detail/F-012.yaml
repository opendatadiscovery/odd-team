- id: H-004
  hypothesis: |-
    When a user adds an entity to a DEG, the platform only lets them add it to DEGs they are
    entitled to curate — a steward cannot drop entities into another team's "Finance Domain"
    they have no permission over.
  derivation: |-
    The endpoint operates on a DEG (data_entity_group_id) named in the request; the operator
    mental model of "managing a domain's membership" implies the permission is checked against
    the DEG being curated. Pillar P-09 (security gates every mutation).
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The only authorization check is on the CHILD entity. SecurityConstants.java:228-231 registers
      POST /api/dataentities/{data_entity_id}/data_entity_group with AuthorizationManagerType.DATA_ENTITY,
      and URLResourceExtractor pulls data_entity_id (the child) from the PATH; the target
      data_entity_group_id is in the BODY and has NO authorization check. PolicyPermissionDto.java:22-23
      confirms DATA_ENTITY_ADD_TO_GROUP / DELETE_FROM_GROUP are DATA_ENTITY-scoped — there is no
      DEG-side enum. A caller with DATA_ENTITY_ADD_TO_GROUP on entity X (commonly granted to every owner
      of X via an "is: dataEntity:owner" Policy) can place X into ANY manually-created DEG in the catalog.
      This is the write_collaborative_no_deg_side_authorization headline; it is the operator-visible twin
      of the read-collaborative posture. (Already tracked: PLT-024 Defect 1 / DOC-188 Facet 2.)
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__addDataEntityDataEntityGroup.md
        section: security.known_security_gaps[0] + bugs_limitations_corner_cases[1]
        cite: "SecurityConstants.java:228-231 + PolicyPermissionDto.java:22"
        note: "rule binds the CHILD path-var; DEG id in body is unchecked; permission is DATA_ENTITY-scoped."
      - sidecar: odd-platform__java__DataEntityController__controller-method__deleteDataEntityFromDataEntityGroup.md
        section: dependencies_semantic (authorization)
        cite: "SecurityConstants.java:232-236"
        note: "DELETE rule is also child-side scoped; same no-DEG-side-gate posture."
    operator_visible_failure: |-
      (1) Cross-owner pollution: a steward of any entity can drop that entity into a "Finance Domain"
      or "Critical Systems" DEG owned by an unrelated team; the DEG owner has no veto and cannot defend
      the DEG short of revoking DATA_ENTITY_ADD_TO_GROUP from every owner of every entity. (2) The Catalog
      Overview's Domain tiles can be polluted by drive-by writes from outside the domain's team. (3)
      Combined with the forensic silence (H-005), the DEG owner cannot even discover WHO added the
      unwanted entity or WHEN. (4) Under auth.type=DISABLED (H-011) the same surface is reachable
      anonymously. Whether to fix (per-DEG scope) or document (write-collaborative by design) is the
      maintainer call PLT-024 Thread A frames; DOC-188 has shipped the documented-behaviour caveat.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_ref: ""

