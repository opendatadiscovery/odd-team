  - name: "Policy (Authorization)"
    canonical_in_docs: true
    canonical_candidate: false
    description: "A named JSON document of `statements` over resource types `DATA_ENTITY | TERM | QUERY_EXAMPLE | MANAGEMENT` granting specific `permissions` or the `ALL` wildcard. Policies are validated server-side against `schema/policy_schema.json` (JSON Schema V201909) at every create + update; the persisted text column is always schema-valid. A Policy is inert until bound to a Role via `role_to_policy`. The seeded `Administrator` policy is reserved by name on UPDATE + DELETE (PolicyServiceImpl.java:76, 87) but NOT on CREATE (PolicyServiceImpl.java:62-69 — name-asymmetry invariant). Authorization gate on CREATE is `POLICY_CREATE` (MANAGEMENT tier) wired in SECURITY_RULES line 163-164, **bypassed under `auth.type=DISABLED`**. Canonical doc anchor: `configuration-and-deployment/enable-security/authorization/policies` (200, 2026-05-12)."
    axes_present:
      - controllers
    nodes:
      - "odd-platform java PolicyController controller-method:createPolicy"
      - "odd-platform java PermissionController controller-method:getResourcePermissions"
    contributors:
      - "PolicyController.createPolicy: entities[Policy, PolicyFormData (name + policy JSON string), PolicyDetails, PolicyPojo, PolicyStatementDto, PolicyPermissionDto, PolicyTypeDto]; operations[create-policy, validate-policy-json-schema, persist-policy, return-policy-details]"
      - "PermissionController.getResourcePermissions: PolicyDto (the materialised policy graph evaluated at the read-side); the resolver flattens roles → policies → statements identical to the mutation enforcer"
    evidence:
      - "createPolicy.md:concepts.entities + concepts.invariants.[0-4]"
      - "createPolicy.md:implicit_adrs.[1] (JSON-Schema-at-write-time) + implicit_adrs.[2] (MANAGEMENT non-contextual)"
      - "getResourcePermissions.md:concepts.entities (PolicyDto materialised graph) + implicit_adrs.[1] (authoritative-not-UI-hint)"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - LOGIN_FORM
        - OAUTH2
        - LDAP
        - DISABLED
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: INCONSISTENT
        detail: "SECURITY_RULES wires POLICY_CREATE / POLICY_UPDATE / POLICY_DELETE at lines 163-168 (NO_CONTEXT MANAGEMENT-tier), but the gate is bypassed under `auth.type=DISABLED` (DisabledAuthSecurityConfiguration.java:13-18 — `anyExchange().permitAll()`). Sibling `GET /api/policies/schema` (PolicyController.java:60-63) has NO SECURITY_RULES entry — falls through to `.authenticated()`. Under `auth.type=LOGIN_FORM` the AuthorizationCustomizer is NOT wired (cross-ref Auth Mode aggregate) so SECURITY_RULES is INERT — every form-authenticated user is ADMIN with effective POLICY_CREATE."
      owner_scoping:
        verdict: "N/A"
        detail: "Policies are global authorization documents; the `policy` table has no `owner_id` column. MANAGEMENT-tier permission gates them globally."
      strengths:
        - "JSON-Schema-at-write-time invariant — PolicyJSONValidator loads the schema once at construction (V201909) and validates per request; persisted text column is always schema-valid (createPolicy.md:implicit_adrs.[1])"
        - "Administrator policy reserved by name on UPDATE + DELETE (createPolicy.md:implicit_adrs.[3])"
        - "Soft-delete-aware partial UNIQUE INDEX `policy_name_unique` on `policy(name) WHERE deleted_at IS NULL` (V0_0_55__add_policies_and_roles.sql:30) — deleted policy's name reusable; live duplicates rejected at DB layer"
      weaknesses:
        - "**Administrator-name reservation asymmetry (HIGH for defence-in-depth)** — `update` + `delete` reject mutations against the seeded Administrator name; `create` does NOT. If the seeded row is ever soft-deleted, a custom Administrator policy with arbitrary statements becomes creatable. Cross-cutting NEW invariant — see 'Administrator-name reservation asymmetry on CRUD'. (createPolicy.md:security.known_security_gaps.[5])"
        - "**No anti-elevation guard (HIGH)** — `{resource: {type: MANAGEMENT}, permissions: [ALL]}` is a legal policy shape identical to the seeded Administrator. POLICY_CREATE is functionally root-on-the-platform; the docs do not flag this. (createPolicy.md:security.known_security_gaps.[2])"
