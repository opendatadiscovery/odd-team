        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: INCONSISTENT
        detail: "17 mutating endpoints gated by SECURITY_RULES (DATA_ENTITY_*); 27+ read endpoints fall through to .authenticated() with no role/owner gate; DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM rules silently disabled by `/term` vs `/terms` path mismatch (SecurityConstants.java:237-242 vs DataEntityApi.java:148, 542); attachment chunk path gate authorises against URL's data_entity_id but file lands against uploadId's originating entity (cross-entity hijack); Activity feed cross-owner exposure repeats the same admin-path-without-admin-gate failure mode."
      owner_scoping:
        verdict: MIXED
        detail: "Owner-scoped: `/my`, `/my/upstream`, `/my/downstream` (delegated to reactor Context). Bypasses owner: `/popular`, `getDataEntityDetails`, `getDataEntityActivity`, `getDataEntityMessages`, lineage reads, DEG children/items/lineage, global Activity feed (ALL/UPSTREAM/DOWNSTREAM type-dispatch paths), Slack-message posting (cross-owner posting accepted). Mutations gated per-resource by DATA_ENTITY policy resolver. Directory non-owner-scoped catalog-wide view."
      strengths:
        - "Mutating endpoints centralised in SECURITY_RULES with DATA_ENTITY policy context (SecurityConstants.java:194-324)"
        - "DATA_ENTITY policy resolver evaluates user policies against resource owner/namespace/datasource/class/type"
        - "Per-resource permission model exists (Permissions / Roles / Owners / User-owner association per ODD vocabulary)"
      weaknesses:
        - "DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM gates SILENTLY DISABLED by `/term` (SecurityConstants.java:237-242) vs `/terms` (DataEntityApi.java:148, 542) path mismatch — any authenticated user can attach/detach terms on any entity"
        - "All 27+ read endpoints (`getDataEntityDetails`, `getDataEntityAlerts`, `getDataEntityMessages`, `getDataEntityActivity`, `getDataEntityMetrics`, lineage reads) carry no role/owner/permission gate — auth-mode-only reads of every entity's full payload"
        - "`getDataEntityActivity` exposes who-changed-what audit trail to any authenticated user"
        - "`getDataEntityMessages` exposes Slack-thread content to any authenticated user (cross-tenant exposure if Slack workspace has multiple sensitive channels)"
        - "Global `/api/activity` returns audit trails across every owner — including ActivityState old/new diffs of descriptions, business names, ownership changes, custom metadata — to ANY authenticated user (getActivity.md:security.known_security_gaps.[0] severity HIGH)"
        - "Slack-message posting accepts any user-supplied data_entity_id with no owner check — cross-tenant message injection (postMessageInSlack.md:security.known_security_gaps.[2] severity HIGH)"
        - "Attachment chunk hijack: caller with DATA_ENTITY_ATTACHMENT_MANAGE on entity X who learns another user's uploadId for entity Z can post chunks via X's URL — gate authorises path entity, service forwards to uploadId entity (uploadFileChunk.md:security.known_security_gaps.[0] severity MEDIUM)"
        - "Authorization layer is path-string-coupled with no compile-time/test-time guard against drift; the term mismatch is the canonical example, no integration test currently catches such drift"
        - "Attachment subsystem (a per-entity feature) has its own systemic security weaknesses — see Attachment concept's security_aggregate"
        - "Under auth.type=DISABLED, every endpoint becomes anonymously reachable"
      cross_file_inconsistencies:
        - "DataEntityController and DataEntityAttachmentController both authorize via SECURITY_RULES path-pattern matchers, but DataEntityController has a verified path-mismatch failure (term/terms) and DataEntityAttachmentController has a read-path asymmetry (POST/PUT/DELETE gated, GET unprotected)"
        - "openapi-tag:dataEntity sidecar reports zero authorization at spec layer; controller sidecar reports the runtime gates that actually apply — contract-vs-runtime mismatch is a documented systemic issue"
        - "uploadFileChunk gate evaluates against URL's data_entity_id while file row resolves by uploadId — same controller surface, two different identity sources, no service-side cross-validation"
      contributing_files:
        - "DataEntityController.md"
        - "openapi-tag-dataEntity.md"
        - "DataEntityAttachmentController.md"
        - "DirectoryController.md"
        - "uploadFileChunk.md"
        - "postMessageInSlack.md"
        - "getActivity.md"
