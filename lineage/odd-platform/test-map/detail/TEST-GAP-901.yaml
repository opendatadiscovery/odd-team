behaviour: |-
  **HIGH — `GET /api/datasources` returns the collector token MASKED (`"******" + last6`),
  but NOTHING tests that. The masked-vs-plaintext outcome hinges on a SINGLE constructor
  choice at `ReactiveDataSourceRepositoryImpl.java:167`; a one-line refactor swapping it
  would silently leak full 40-char plaintext collector tokens to EVERY authenticated user
  — and the list endpoint needs no permission at all (no SecurityRule).** Method-level
  primary source from the batch-ZB `getDataSourceList` controller-method sidecar:

  - `listDto` selects `TOKEN.asterisk()` (ReactiveDataSourceRepositoryImpl.java:70), but the
    LIST path constructs the token DTO via the 1-arg `new TokenDto(tokenPojo)`
    (ReactiveDataSourceRepositoryImpl.java:167) → `showToken = false` (TokenDto.java:6-8) →
    `TokenMapper.mapValue` (TokenMapper.java:15-18) returns the masked `"******" +
    value.substring(len-6)` form.
  - register / regenerate use the 2-arg `new TokenDto(pojo, true)` form
    (ReactiveTokenRepositoryImpl.java:26,38, `showToken=true`) → full 40-char plaintext.
  - **The single-line regression surface**: a future edit to `mapRecordIntoDto`
    (ReactiveDataSourceRepositoryImpl.java:167) swapping the 1-arg `new TokenDto(tokenPojo)`
    to `TokenDto.visibleToken(tokenPojo)` would flip the list endpoint to emit full
    plaintext — with NO other code change. Combined with the fact that `GET
    /api/datasources` has NO entry in `SecurityConstants.SECURITY_RULES` (Grep-confirmed —
    SecurityConstants.java:116-126 has only POST/PUT/DELETE rules), this would expose every
    collector token to every authenticated user, no permission, no owner scope.

  **Why HIGH**: this is a security regression-guard for collector credentials — a class of
  secret whose leak (TEST-GAP-750 / DOC-GAP-034 territory) is treated as serious across the
  platform. The endpoint has ZERO direct test coverage (Glob-verified — no
  `DataSourceControllerTest`); the only protection for the masking today is the
  repository-tier `DataSourceRepositoryImplTest.listDtoTest` (which exercises the SQL but
  does NOT assert the token rendering). Probe P-035 is the regression guard for exactly
  this. The doc page calls the token "partially-redacted" but does not say the visible part
  is REAL trailing token material — a security-conscious operator may assume a placeholder.

  **Test gap shape**: a `@SpringBootTest` / `WebTestClient` security test that registers a
  data source (capturing the 40-char plaintext T from the POST response), then `GET
  /api/datasources` and asserts the matching item's `token.value` (a) starts with exactly
  six `*` characters; (b) is NOT equal to the plaintext T; (c) the trailing 6 characters
  equal `T.substring(T.length()-6)` (pinning that the mask leaks real token material — a
  fact the masking design accepts but the docs understate). PINS the masked rendering — a
  regression flipping the `TokenDto` constructor inverts the test.
test_class: missing-security
criticality_rationale: |-
  HIGH per Rule 3: the getDataSourceList sidecar's security.known_security_gaps rates the
  one-line-flip regression surface MEDIUM in isolation, and the token-leak-to-read-only-users
  MEDIUM. The aggregate is HIGH: the list endpoint has NO permission gate (a flipped
  constructor leaks EVERY collector token to EVERY authenticated user — full-catalog
  credential disclosure), and collector tokens are a credential class the platform treats
  as security-critical (DOC-GAP-034 / TEST-GAP-750 family). The masking is the ONLY thing
  standing between the no-permission list endpoint and a credential dump, and it is one
  line of code with zero test coverage. pillars_affected len 1 (P-08) — no cross-pillar
  bump; HIGH is the honest aggregate.
