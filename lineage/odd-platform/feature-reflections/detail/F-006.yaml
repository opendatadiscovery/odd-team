    them what each permission code actually grants — e.g. what `MANAGEMENT_CONTROL`
    or `POLICY_CREATE` lets a holder do — so they can write a correct policy without
    reading source code.
  derivation: |
    Senior-product-owner UX seed (Rule 9: "is the UI intuitive; does the user
    understand how to use this from what is on screen") + doc-claim. A policy editor
    that offers 75 raw enum codes with no human-readable mapping is not usable by a
    non-developer operator.
  seed_source: ui-label + doc-claim + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The policy authoring surface (PolicyForm -> AppJSONEditor) presents the operator
      with the JSON-Schema document returned by GET /api/policies/schema — i.e. the
      75-value Permission enum (components.yaml:158-235) as raw permission CODES. The
      operator AUTHORS against codes like DATA_ENTITY_VIEW, MANAGEMENT_CONTROL,
      POLICY_CREATE; the GRANT the backend resolves is getRolesPolicies ->
      role_to_policy JOIN -> effective permissions per request. NO live doc page maps
      the permission codes to user-readable descriptions of what each grants (e.g.
      "does MANAGEMENT_CONTROL cover /api/policies/* or just /api/management/*?").
      An operator must read both components.yaml AND the per-controller SecurityConstants
      wiring to understand each code (PolicyList.md doc_drift_findings UI-DOC-GAP-C —
      the LSN-001 catalogue-as-shown-vs-effect-as-applied pattern). And the wiring is
      not even trustworthy: SecurityConstants.java:299 wires POST /api/datasetfields/{id}/terms
      to DATA_ENTITY_ADD_TERM instead of the documented DATASET_FIELD_ADD_TERM, and
      :295-296 wires PUT /api/alerts/{id}/status to DATASET_FIELD_ADD_TERM (a
      copy-paste bug) — so even an operator who reads the code reads a mis-wired
      mapping that disagrees with the live permissions doc (F-006 chain batch V
      findings (a),(b); already tracked as DOC-193 + PLT-029).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__PolicyList.md
        section: docs_link_semantic.doc_drift_findings (UI-DOC-GAP-C)
        cite: "components.yaml:158-235 + PolicyForm AppJSONEditor"
        note: "Operator authors against 75 raw permission codes; no human-readable catalogue exists."
      - sidecar: '(backlog/docs/DOC-193.md)'
        section: "Bug 1 + Bug 2 (SecurityConstants wiring)"
        cite: "SecurityConstants.java:295-296 + 297-299 (VERIFIED via read)"
        note: "Permission wiring disagrees with the live docs — DATASET_FIELD_ADD_TERM mis-wired; alert-status copy-paste. Tracked DOC-193; code fix PLT-029."
      - sidecar: '(WebFetch live doc — verified via batch V)'
        section: permissions page
        cite: "https://docs.opendatadiscovery.org/.../authorization/permissions (verified 2026-05-20 status 200)"
        note: "Live page lists permission keys but does not map each code to its concrete grant; the wiring bugs contradict it."
