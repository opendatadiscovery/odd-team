proposed_action: |-
  Add `IngestionControllerAuthMatrixTest` — single parameterised WebTestClient test exercising 80 cells:

  1. `@Test @ParameterizedTest @MethodSource("authMatrix")` — args (endpoint, authType, filterEnabled, s2sEnabled).
  2. Boot the WebTestClient with `@SpringBootTest(properties={"auth.type=" + authType, "auth.ingestion.filter.enabled=" + filterEnabled, "auth.s2s.enabled=" + s2sEnabled})`.
  3. For each endpoint, assert the EXPECTED reachability (e.g. `postDataEntityList` under DISABLED+filter=false+s2s=false → 200; `createDataSource` under any combination without collector token → 500 not 401; `postDataSetStatsList` under any combination → 201).
  4. PIN the CURRENT behaviour as the contract; any future refactor that adds a `GET` matcher to `IngestionDataEntitiesFilter`, or removes `/ingestion/**` from WHITELIST_PATHS, surfaces as a deliberate decision via this file.
  5. Document each cell with a `// REGRESSION-PIN` comment quoting the SecurityConstants line and the filter line that produces the cell's behaviour.

  Coherence note (LSN-018 Rule 6): NET-NEW class-level META-ANCHOR. STRENGTHENS the 5 single-endpoint TEST-GAPs (815, 823, 819, 618, 116, 579) by holding them as a single matrix. NO conflicts surfaced — primary-source verified at IngestionController.java:31-103 + IngestionDataEntitiesFilter.java:28 + SecurityConstants.java:95-96.
