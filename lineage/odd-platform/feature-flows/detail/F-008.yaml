batch_extensions:
- batch: O
  entry_point_added: |-
    filter:IngestionDataEntitiesFilter (the auth-filter LAYER preceding
    IngestionController) — primary-source confirmation of the
    REFACTOR-185 sixteenth invocation site. The filter sidecar resolves
    hop-0 (the auth-gating layer) of F-008's chain and adds 5 new drift
    facets at the auth-layer: body-buffered-before-auth DoS surface,
    plaintext-equality timing side-channel, hard-coded exact-literal
    path matcher (sibling /ingestion/alert/alertmanager uncovered),
    NotFoundException → 5xx info-leak, cross-mode LOGIN_FORM exact-list
    vs OAUTH2/LDAP /ingestion/** wildcard reachability divergence.
  contributing_nodes_added:
  - odd-platform java auth filter:IngestionDataEntitiesFilter
  notes: |-
    Five new drift facets surface from the filter-LAYER primary source
    that complement F-008's existing service-layer destruction facets:
    (1) Body-buffered-before-auth DoS — line 38
    `super.getBody().collectList()` materialises the full 20MB payload
    (per application.yml:14-15 spring.codec.max-in-memory-size: 20MB)
    BEFORE the token check at line 56. An attacker sending repeated
    20MB invalid-token requests forces full body materialisation + Jackson
    parse per attempt; no rate-limit, no per-IP throttle.
    (2) Plaintext-equality token compare — line 56
    `dto.tokenPojo().getValue().equals(token)` uses non-constant-time
    `String.equals`, not `MessageDigest.isEqual`. Combined with at-rest
    plaintext storage in the TOKEN table (`RandomStringUtils.randomAlphanumeric(40)`
    generation, raw string write per `ReactiveTokenRepositoryImpl.java:30-39`),
    the shared-secret stance is consistent but the timing side-channel
    is theoretical.
    (3) Path coverage is hard-coded exact-literal `/ingestion/entities` —
    line 28 builds `PathPatternParserServerWebExchangeMatcher("/ingestion/entities",
    POST)`. The property name `auth.ingestion.filter.enabled` reads as
    "lock down ingestion" but covers EXACTLY ONE endpoint. Sibling
    `/ingestion/alert/alertmanager` (AlertManagerController.java:21) is
    uncovered by ANY filter AND has NO `@PreAuthorize`. An operator
    enabling the toggle reasonably believes ingestion is protected; the
    AlertManager webhook remains open.
    (4) NotFoundException surfaces as 5xx not 401 — the parent
    `AbstractIngestionFilter.filter` only catches `AccessDeniedException`
    to emit 401 (line 40); NotFoundException (thrown on unknown
    datasource OR empty fallback collector lookup) propagates to the
    default reactive error handler as 500. An attacker probing the
    endpoint with valid-token + arbitrary payload can DISTINGUISH
    'datasource exists, wrong token' (401) from 'datasource does not
    exist' (5xx) — minor info-leak + operator-debug misleading.
    (5) Cross-mode coverage divergence — under LOGIN_FORM, the explicit
    `permittedPaths` list at LoginFormSecurityConfiguration.java:50
    contains only `/ingestion/entities` + `/ingestion/datasources`
    (exact), so `/ingestion/alert/alertmanager` would FALL THROUGH to
    `.pathMatchers("/**").authenticated()`. Under OAUTH2/LDAP, the
    `SecurityConstants.WHITELIST_PATHS` line 96 contains `/ingestion/**`
    (wildcard) which DOES permit the alertmanager path. Switching auth
    modes silently changes the reachability of the alertmanager webhook.
    Hop-0 (the auth-gating layer) is now PRIMARY-SOURCE CONFIRMED at the
    filter class level. This strengthens REFACTOR-185 (sixteenth invocation
    site) and the existing F-008 facet `default_off_unauthenticated_ingestion_at_filter_layer`.
- batch: P
  entry_point_added: |-
    controller-method:createDataSourceEntity (POST /ingestion/datasources)
    — the SIBLING S2S entry-point on the same IngestionController that
    F-008's existing chain hop-1 (postDataEntityList) carries. The
    datasource-registration entry-point uses a DIFFERENT authentication
    mechanism (path-scoped IngestionDataSourceFilter — UNCONDITIONAL,
    not gated by `auth.ingestion.filter.enabled`) and a DIFFERENT
    identity-propagation mechanism (WebSession `COLLECTOR_ID_SESSION_KEY`
    stringly-typed attribute, NOT payload-ODDRN resolution). The
    asymmetry IS architecturally significant — the two ingestion
    endpoints encode the same pillar (P-10 Batch Ingestion / S2S API)
    with INCONGRUOUS auth-defaulting and identity-binding choices.
  contributing_nodes_added:
  - odd-platform java IngestionController controller-method:createDataSourceEntity
  notes: |-
    Five new drift facets surface from the datasource-registration
    sibling entry-point that complement F-008's existing entity-ingestion
    facets. The asymmetry is the load-bearing finding: F-008 was
    canonically pinned on `POST /ingestion/entities` (default-OFF auth,
    payload-ODDRN identity); this batch extends F-008 to the sibling
    `POST /ingestion/datasources` (ALWAYS-ON auth, session-attribute
    identity) and surfaces the architectural inconsistency.
    (1) ASYMMETRIC AUTH BETWEEN INGESTION FILTERS — `IngestionDataSourceFilter`
    (sibling auth filter) is `@Component` UNCONDITIONAL (no
    `@ConditionalOnProperty`, no `matchIfMissing` knob — verified
    IngestionDataSourceFilter.java:15-20 implicit via class-level annotation
    pattern + dependencies_semantic.requires-feature in batch P sidecar).
    `IngestionDataEntitiesFilter` is `@ConditionalOnProperty(value=
    "auth.ingestion.filter.enabled", havingValue="true")` (batch O sidecar +
    application.yml:48 ships `false`). So `/ingestion/datasources` is
    ALWAYS auth-required at the filter layer regardless of the operator's
    `auth.ingestion.filter.enabled` choice; `/ingestion/entities` is auth-required
    ONLY when the operator opted in. The property name
    `auth.ingestion.filter.enabled` reads as "lock down ingestion globally"
    but its scope is one endpoint. The asymmetry is structurally encoded
    in the two filter classes' registration annotations and is invisible
    to operators reading the S2S doc.
    (2) COLLECTOR_ID_SESSION_KEY WEBSESSION-ATTRIBUTE IDENTITY (stringly-typed) —
    the filter writes the matched Collector id into
    `exchange.getSession().getAttributes().put(SessionConstants.COLLECTOR_ID_SESSION_KEY,
    collectorId)` (IngestionDataSourceFilter.java:36-38); the controller
    reads it back via `exchange.getSession().map(ws ->
    ws.getAttribute(SessionConstants.COLLECTOR_ID_SESSION_KEY))`
    (IngestionController.java:50-58). The shared constant is
    `SessionConstants.COLLECTOR_ID_SESSION_KEY = "collectorId"` —
    NOT `final`, NOT type-safe, NOT a Spring `@SessionAttribute`-bound
    binding. A refactor that renames the constant in only one of the
    two files silently desyncs the contract; a misspelling on the
    controller side throws `IllegalStateException("Collector id is null")`
    at RUNTIME (line 54), not at COMPILE-TIME. Compounding: session
    state is `IN_MEMORY` (application.yml:30) with `spring.session.timeout: -1`
    — sessions never expire AND each platform instance has its own
    session store. CLUSTER DEPLOYMENTS WITHOUT STICKY SESSIONS are
    STRUCTURALLY UNSUPPORTED on this endpoint; second-hop requests
    landing on a different node throw 5xx with `"Collector id is null"`.
    No doc warns about this.
    (3) UPSERT PARTIAL-MERGE (name + description only) — re-registering
    an existing-ODDRN datasource OVERWRITES `name` + `description` from
    the payload and PRESERVES everything else (`connection_url`,
    `active`, `type`, `namespace_id`, `collector_id`, `token_id`,
    soft-delete flag, timestamps). A collector that genuinely needs
    to update `connection_url` (the source's hostname changed) CANNOT
    do so via this endpoint; the response is 200 OK regardless. The
    asymmetric-merge is silent — no log, no diff in the response body
    (`Mono<ResponseEntity<Void>>`). Mirrors F-008's existing `silent_destruction_replace_not_merge`
    facet but with INVERTED polarity: the entity-ingestion path is
    DESTRUCTIVE-REPLACE; the datasource-registration path is
    PROTECTIVE-MERGE — but protective in the wrong direction (collector
    updates are silently lost). Both surfaces are undocumented.
    (4) NAMESPACE INHERITED FROM COLLECTOR; PAYLOAD `namespace_name`
    SILENTLY DROPPED — `DataSourceIngestionServiceImpl.mapDataSources`
    (line 99-111) hardcodes the namespace_id from `CollectorDto.namespace()`,
    NEVER from the payload. A custom-collector author setting
    `namespace_name = "my-team"` in the payload sees the datasource
    appear under the Collector's PRE-CONFIGURED namespace. No log, no
    doc. Architectural intent (collector-scoped tenancy model) is sound
    BUT operator-invisible — a collector author cannot predict the
    behaviour from the docs.
    (5) SESSION-STATE-LOSS SURFACES AS HTTP 500 not 401 — IngestionController.java:54
    throws `IllegalStateException("Collector id is null")` when the
    session attribute is missing; the parent `AbstractIngestionFilter.filter`
    catches ONLY `AccessDeniedException` (line 40) to emit 401. The
    `IllegalStateException` propagates to the default reactive error
    handler as HTTP 500. Mirrors F-008's existing
    `notfoundexception_surfaces_as_5xx_info_leak` facet at batch O —
    SAME shape, SAME diagnostic confusion, DIFFERENT origin. An attacker
    probing with a valid token but lost session distinguishes
    "filter-ON, session OK" (401 on bad token) from "filter-ON, session lost"
    (5xx on missing collector_id) — minor info-leak.
    REFACTOR-185 17th invocation site at the datasource-registration
    endpoint primary-source confirmed. Hop-0 of the F-008 chain remains
    `IngestionDataEntitiesFilter` for the entity-ingestion path; this
    batch adds a SECOND hop-0 (`IngestionDataSourceFilter`) that protects
    the SIBLING datasource-registration path with INCONGRUOUS defaults.
    The Audit-log Presence Asymmetry canonicalisation candidate gains
    a 5th data point (no @ActivityLog / no activity event on
    `createDataSource` — DataSourceIngestionServiceImpl.java:41-72
    has NO `activityEventEmitter` reference). Cross-link: F-006
    audit-silence pattern + F-018 ingestion-side audit-silence facet
    + F-011 user_owner_mapping mutation no-audit + this F-008
    datasource-registration no-audit = 5-pillar audit silence pattern.
- batch: Q
  entry_point_added: |-
    UI-tier: react-component:CollectorsList (Management → Collectors tab) —
    the authoring surface for the credential consumed by BOTH ingestion
    filters this feature carries (IngestionDataEntitiesFilter at hop-0
    + IngestionDataSourceFilter at the sibling endpoint added in batch P).
    The UI does NOT directly participate in the ingestion path itself
    (CollectorsList lives at /management/collectors and calls /api/collectors/*
    endpoints, not /ingestion/*), but it IS the operator-facing trigger
    of the token-rotation + revoke + new-collector-register surface that
    governs every credential the two filters accept. The sidecar surfaces
    a NEW REFACTOR-185 facet not previously in the 16/17/18-sidecar
    enumeration: the COLLECTOR_* permission family adds a 19TH SURFACE
    via the UI-vs-API asymmetry under DISABLED.
  contributing_nodes_added:
  - odd-platform ts react-component:CollectorsList
  notes: |-
    THREE new drift facets surface from the UI tier of the
    credential-authoring surface, plus the REFACTOR-185 19th-site
    refinement. Listed in descending severity:
    (1) UI-VS-API ASYMMETRY UNDER DISABLED — REFACTOR-185 19TH SURFACE
    (HIGH) — under `auth.type=DISABLED`, the UI's `WithPermissions`
    wrappers HIDE the Add / Edit / Delete / Regenerate buttons because
    `/api/identity` returns an empty `permissions` array (the SecurityContext
    is unpopulated). Operators see a READ-ONLY surface and may infer
    'this deployment is locked down'. But the BACKEND REST endpoints
    ACCEPT ANONYMOUS MUTATIONS regardless — `DisabledAuthSecurityConfiguration.java:11-19`
    sets `.anyExchange().permitAll()` and the SecurityRule entries at
    `SecurityConstants.java:127-137` for COLLECTOR_CREATE / UPDATE /
    DELETE / TOKEN_REGENERATE are bypassed. A direct `curl POST /api/collectors`
    succeeds with no auth. **The UI is QUIETER than the API**: an
    attacker bypassing the UI mints new collectors + copies the
    plaintext token from the response + uses it to bootstrap a hostile
    collector identity via the sibling `POST /ingestion/datasources`
    (which is ALWAYS-ON auth-filtered, but the just-minted token is a
    legitimate credential). REFACTOR-185 advances from 18-SIDECAR to
    19-SIDECAR. The compound surface under default DISABLED: anyone
    on the network can `POST /api/collectors` (no UI signal), copy
    the response token, and `POST /ingestion/datasources` with that
    token (per the batch-P architectural asymmetry finding) — the
    DISABLED-mode bypass extends through the ENTIRE collector
    boot-of-self chain.
    (2) TOKEN-ROTATION HAS NO UI WARNING ABOUT NO-SECURITY-EFFECT ON
    DEFAULT DEPLOYMENT (HIGH) — The token-rotation ConfirmationDialog
    (`CollectorItemToken.tsx:38-49`) reads only 'Are you sure you want
    to regenerate token for this collector?' The UI promises a security
    property (token rotation) the default deployment does not enforce
    (`auth.ingestion.filter.enabled=false` per `application.yml:48`
    means `POST /ingestion/entities` is anonymously reachable
    regardless of token value — the 16th REFACTOR-185 surface
    confirmed at batch O). An operator rotating a 'leaked' token on a
    default deployment is rotating a credential that has ZERO security
    effect on the entity-ingestion path. Cornerstone-3
    (configuration-as-separate-audience-surface) failure that compounds
    with REFACTOR-185.
    (3) TOKEN-VISIBILITY DETECTION VIA SUBSTRING-PREFIX SNIFF (MEDIUM)
    — `CollectorItemToken.tsx:25-27` sets `setIsHidden(collector.token.value.substring(0,
    6) === '******')`. The detection is a literal 6-star prefix sniff;
    backend masks via `TokenMapper.java:15-18` as `'******' +
    value.substring(value.length() - 6)`. A future backend change to
    the mask format (e.g. dropping to 4 stars, switching to a Unicode
    block character, prepending whitespace) silently breaks detection
    — the UI would offer the Copy button on a masked value, leaking
    `******abc123`-style fragments to the operator's clipboard. No
    automated test guards against this. ALSO: the token is rendered
    as plaintext DOM text node when visible (`CollectorItemToken.tsx:34`),
    not in `<input type='password'>` — any browser extension /
    screenshot tool / accessibility reader captures the 40-character
    credential by default.
    Additionally: under DISABLED, `GET /api/collectors/list` is
    anonymously reachable (NO SecurityRule entry per SecurityConstants
    grep — read-collaborative pattern per REFACTOR-024 family).
    Anonymous probe enumerates every collector's name + namespace +
    last-6-token-chars (the mask format reveals last-6). Minor
    information leak on credential mask. Cross-batch coherence:
    STRENGTHENS REFACTOR-185 (16 → 19 SIDECAR — Owner trinity batch P
    adds 17 + createDataSourceEntity adds 17 partially in some
    counters; COLLECTOR_* UI permission family adds the 19th distinct
    drift surface), STRENGTHENS the asymmetric-auth-between-filters
    finding (batch P) — the UI is the SAME credential-authoring surface
    for two endpoints with INCONGRUOUS auth defaulting, and the UI
    gives operators no signal that the SAME token participates in TWO
    different auth postures. STRENGTHENS the audit-silence pattern:
    `CollectorsList` emits NO analytics events, NO console.log on
    mutations, NO persistent audit panel — adding a 6th UI-tier
    corroboration of the platform-wide audit-silence finding (mirror
    of batch-Q PolicyList + RolesList finding on F-006). No conflicts;
    no supersedes. Explicit LSN-017 NEGATIVE finding recorded — the
    useEffect dep-array at CollectorsList.tsx:44-46 has primitive
    booleans + a string in deps, NOT a fetch-result derivation — the
    LSN-017 amplification shape is structurally ABSENT from this
    component.
- batch: R
  entry_point_added: |-
    repository-tier (2 sidecars): ReactiveDataSourceRepositoryImpl +
    ReactiveCollectorRepositoryImpl — the SQL-tier substrates of the
    Batch Ingestion auth path AND the UPSERT semantics that batch P
    surfaced at the controller layer.
    ReactiveDataSourceRepositoryImpl: provides the UPSERT-pair primitives
    (`getDtosByOddrns` → matched / `bulkCreate` for new — invoked by
    DataSourceIngestionServiceImpl.java:35-72 inside
    `@ReactiveTransactional`), the `getIdByOddrnForUpdate` row-lock
    primitive (IngestionServiceImpl.java:68 — the SELECT FOR UPDATE
    that serialises ingestion against concurrent UI deletes /
    collector re-registrations), and the cascade-delete guards
    `existsByCollector` / `existsByNamespace`.
    ReactiveCollectorRepositoryImpl: provides the
    `getByToken(token)` SQL bridge query that
    `IngestionDataSourceFilter` (ALWAYS-ON, no `@ConditionalOnProperty`
    per IngestionDataSourceFilter.java:15-22) calls on every
    `POST /ingestion/datasources` to resolve an inbound
    `Authorization: Bearer <plaintext>` to a Collector id, AND the
    `getDto(id)` query that `IngestionDataEntitiesFilter` (OPT-IN
    via `auth.ingestion.filter.enabled`) calls on every
    `POST /ingestion/entities` to fetch the token for plaintext
    `.equals` comparison.
  contributing_nodes_added:
  - odd-platform java repository reactive repository:ReactiveDataSourceRepositoryImpl
  - odd-platform java repository reactive repository:ReactiveCollectorRepositoryImpl
  notes: |-
    SEVEN new drift facets surface from the SQL-tier primary source,
    refining four prior batch-P controller-tier findings AND adding
    three NEW load-bearing security-architectural findings (the
    plaintext-everywhere claim is now CLOSED end-to-end across the
    schema-codegen-storage-equality-emit chain). Listed in descending
    severity:
    (1) COLLECTOR TOKEN PLAINTEXT-AT-REST SQL PRIMARY SOURCE (HIGH) —
    V0_0_28__add_token.sql:4 declares `value varchar(40) NOT NULL`
    with NO UNIQUE constraint, NO hashing column, NO encoding-at-rest
    column. TokenGeneratorImpl.java:34-42 writes
    `RandomStringUtils.randomAlphanumeric(40)` verbatim; ReactiveCollectorRepositoryImpl
    line 94 reads via `TOKEN.VALUE.eq(token)` — plaintext SQL equality.
    The PLAINTEXT-EVERYWHERE claim that batch Q surfaced at the
    CollectorsList DOM-render layer (token plaintext rendered into
    DOM text node, no `<input type=password>` obfuscation) NOW CLOSES
    END-TO-END: schema-codegen-storage-write-equality-read-rendered.
    Every layer of the bearer-token authentication assumes plaintext;
    every layer SHIPS plaintext. A DB-side reader (replica, backup,
    pg_dump operator, jOOQ-log leak) recovers every live credential.
    The live doc at `configuration-and-deployment/enable-security`
    (WebFetched 2026-05-20 status 200 by ReactiveCollectorRepositoryImpl
    sidecar) is SILENT on the storage shape — operators reading the
    doc cannot infer the threat model from the doc alone.
    Cross-link to F-020 token-plaintext-DOM-render facet (which IS
    on F-020 directly per batch-Q); this batch adds the SQL primary
    source.
    (2) ALWAYS-ON INGESTION_DATASOURCE_FILTER VS OPT-IN
    INGESTION_ENTITIES_FILTER (HIGH, refines batch-P
    `asymmetric_auth_between_ingestion_filters`) — SQL-tier
    confirmation. `IngestionDataSourceFilter.java:15-22` carries NO
    `@ConditionalOnProperty` — it is ALWAYS-ON regardless of
    `auth.type` or `auth.ingestion.filter.enabled`.
    `IngestionDataEntitiesFilter.java:19-20` carries
    `@ConditionalOnProperty(value="auth.ingestion.filter.enabled",
    havingValue="true")`. An operator with
    `auth.ingestion.filter.enabled=false` (the default per
    `application.yml:48`) believes they have NO ingestion auth, but
    actually has auth on `/ingestion/datasources` (always-on) and
    none on `/ingestion/entities`. Operators reading the live doc
    ("Enable the ingestion filter for any deployment where the
    platform is reachable from an untrusted network") do NOT learn
    about the always-on filter. This SQL-tier sidecar STRENGTHENS
    batch-O's `cross_mode_login_form_vs_wildcard_alertmanager_divergence`
    and batch-P's `asymmetric_auth_between_ingestion_filters` —
    every code path that authenticates a collector calls this
    repository's `getByToken` from the always-on filter.
    (3) UPSERT PARTIAL-MERGE IS SERVICE-TIER CONVENTION, NOT
    REPO-TIER ENFORCEMENT (HIGH, refines batch-P
    `upsert_partial_merge_name_and_description_only`) — the inherited
    `bulkUpdate` (ReactiveAbstractCRUDRepository.java:128-142,
    203-223) writes ALL non-non-updatable columns from the supplied
    records. The narrowing to ONLY name + description lives at
    `DataSourceIngestionServiceImpl.prepareForUpdate` (lines 74-92)
    which `new DataSourcePojo(a).setName(...).setDescription(...)`
    — copying the existing pojo then overriding ONLY two fields.
    A service-bypassing caller invoking
    `dataSourceRepository.bulkUpdate(...)` DIRECTLY would have FULL
    column-overwrite power including `collector_id`. The partial-merge
    is a SERVICE-tier guard, not a SCHEMA / REPOSITORY guard. Surface
    for ADR-CANDIDATE-142 strengthening; the maintainer should
    consider whether to encode the partial-merge contract at the
    repository tier (e.g. an `UpdateBuilder` constraining the writable
    column set) or accept the convention-only model.
    (4) DATASOURCE LISTDTO PAGE-VS-COUNT PREDICATE DIVERGENCE (MEDIUM,
    NEW REFACTOR-425) — `listDto(page, size, nameQuery)` (lines 58-82)
    uses `DATA_SOURCE.NAME.startsWithIgnoreCase(nameQuery)` (private
    `queryCondition` line 156), but the count branch
    (`fetchCount(nameQuery)` line 80) calls the parent's `listCondition`
    which uses `nameField.containsIgnoreCase(nameQuery)`. For a
    catalog with `['snowflake-prod', 'my-snowflake-dev']` and
    `nameQuery='snow'`, the page returns ONLY 'snowflake-prod' but
    the count reports BOTH. Pagination math is broken when nameQuery
    is non-null. Filed as REFACTOR-425 by the repository sidecar.
    Severity MEDIUM — operators may not notice the discrepancy in
    a small catalog, but at >50 datasources the pagination is
    misleading. Cross-link to the Datasources tab sub-feature of
    P-08 (which surfaces this list).
    (5) DATA_SOURCE.NAME PARTIAL UNIQUE INDEX — SILENT COLLISION
    MID-UPSERT (MEDIUM, NEW) — the partial unique index
    `data_source_name_unique ON data_source(name) WHERE deleted_at
    IS NULL` (V0_0_31:27) is silent at the controller surface. A
    collector UPSERTing a datasource that renames an existing row
    to a name held by another LIVE row fails with SQLSTATE 23505
    mid-transaction — this rolls back the entire `bulkUpdate` AND
    the paired `bulkCreate`. NO partial commit. The operator sees
    a 500 with the underlying message; no 'name collision with
    another datasource' distinction at the UI. Cross-link to the
    upsert-partial-merge family above.
    (6) TOKEN.VALUE NO UNIQUE CONSTRAINT — CROSS-COLLECTOR SHARE
    RACE (MEDIUM, NEW) — V0_0_28__add_token.sql:1-9 confirms no
    UNIQUE on TOKEN.value. Two TOKEN rows COULD share the same
    `value` (cosmically improbable from
    `RandomStringUtils.randomAlphanumeric(40)`, but no schema-level
    defence prevents it). If `getByToken(t)` ever sees two rows
    matching, the jOOQ `mono(query)` returns the FIRST row's matched
    COLLECTOR with no determinism guarantee (no ORDER BY at lines
    90-94). The COLLECTOR_ID_SESSION_KEY becomes ambiguous;
    cross-collector data-source registration is silently possible.
    Cross-reference: batch-P IngestionController.createDataSourceEntity:240
    same finding (this batch is the SQL-tier substrate).
    (7) SOFT-DELETED COLLECTOR ORPHANED TOKEN PERSISTS INDEFINITELY
    (MEDIUM, NEW) — TOKEN table has no soft-delete column (V0_0_28:1-9
    — only id, value, created_at, created_by, updated_at, updated_by).
    When a Collector is soft-deleted, the FK `collector.token_id`
    points at a TOKEN row that is now ORPHANED. The partial unique
    index `collector_token_unique ON collector(token_id) WHERE
    deleted_at IS NULL` (V0_0_33:1) ALLOWS this — it only enforces
    uniqueness on LIVE collectors. The TOKEN row's value is still
    in the table, still plaintext, still discoverable via
    `SELECT * FROM token`. NO housekeeping job removing orphaned
    TOKEN rows; the row persists forever. An operator-side cleanup
