- id: H-003
  hypothesis: |-
    When an operator sets `organization-name: my-corp` on a GitHub client (intending it as the
    outermost gate — only my-corp members may log in), a user who is NOT a member of `my-corp`
    cannot obtain ADMIN regardless of other settings.
  derivation: |-
    The live docs describe organization-name as "Restricts login only for users from this
    particular organization" (GithubUserHandler sidecar doc excerpt) — operator reads it as a
    global gate.
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      GithubUserHandler evaluates the `admin-principals` fast-path at lines 54-67 and returns
      ADMIN there BEFORE the organization-name membership check at line 68. So an operator with
      `organization-name: my-corp` AND `admin-principals: [external-consultant]` grants ADMIN
      to `external-consultant` even though that user is never checked for my-corp membership.
      The org gate is NOT the outermost guard; admin-principals overrides it.
    evidence:
      - sidecar: odd-platform__java__auth__handler__GithubUserHandler.md
        section: concepts.invariants (admin-principals-bypass-org) + implicit_adrs[1] + bugs_limitations_corner_cases
        cite: "GithubUserHandler.java:54-67 (early ADMIN return) + line 68 (org check runs AFTER)"
        note: "fast-path return precedes the org-membership gate"
    operator_visible_failure: |-
      An operator who reasons "organization-name keeps everyone outside my GitHub org out"
      ships a deployment where any username in `admin-principals` is a full platform ADMIN
      with no org-membership requirement. The high-severity vector: GitHub usernames are
      free to register, and `admin-principals` matches the `login` string — a typo in the
      admin-principals list that happens to match a username an attacker can register on
      github.com becomes a platform-ADMIN backdoor that the org gate does not stop. The
      operator's separation-of-duties model (org membership first, role second) is inverted.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |-
    When an operator runs GitHub Enterprise Server (api at https://github.example.com/api/v3)
    and configures `provider: github` with an organization-name, their users can log in and be
    org/team-gated the same as github.com users.
  derivation: |-
    The docs list GitHub as a supported provider with no GHES carve-out (GithubUserHandler
    sidecar doc excerpt); an enterprise operator expects GHES to work.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      GithubUserHandler instantiates a singleton WebClient bound to a hard-coded
      `https://api.github.com` at field-init (line 39) — no `@Value`, no provider property, no
      operator override. Every org/team lookup hits github.com. A GHES deployment's API at
      `https://github.example.com/api/v3` is never contacted; the outbound calls fail with
      DNS/cert errors that surface as login failures. The handler IS still selected (the
      GithubCondition only checks the literal `github` string), so GHES operators get a
      handler that structurally cannot reach their server.
    evidence:
      - sidecar: odd-platform__java__auth__handler__GithubUserHandler.md
        section: concepts.invariants (WebClient-singleton-no-config) + bugs_limitations_corner_cases
        cite: "GithubUserHandler.java:39"
        note: "WebClient.create('https://api.github.com') hard-coded, no override knob"
    operator_visible_failure: |-
      An entire class of operator (self-hosted GitHub Enterprise Server) is silently locked
      out of GitHub OAuth. Their login attempts fail with low-level network errors
      (DNS/cert) — or, if their egress can reach github.com, with "User doesn't belong to
      organization" because the user's GHES org membership lives on a server that was never
      queried. No doc and no error message points at the hard-coded endpoint as the cause, so
      the operator burns debugging time on proxy/DNS/cert red herrings before discovering the
      handler can never target their server.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    When an operator sets `allowed-domain: corp.com` on a Cognito (or Azure / Custom-OIDC)
    client, login is restricted to users whose email/domain is corp.com — the same way it is
    on Google.
  derivation: |-
    `allowed-domain` is a uniform OAuth2Provider field; an operator reading the schema expects
    it to gate every provider, not just Google.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      `allowed-domain` is honoured ONLY for Google, at two sites: OAuthSecurityConfiguration
      mutates the authorize URL with `?hd={domain}` only when the provider equals GOOGLE
      (lines 168-175 per the feature-flow chain hop 1 + facet
      `allowed_domain_silent_no_op_on_non_google_providers`), and GoogleUserHandler re-verifies
      the `hd` id-token claim (lines 49-55). No other handler reads `allowedDomain` at all.
      Setting it on Cognito / Azure / Custom-OIDC / ODD_IAM binds on the POJO and is silently
      ignored — every user from any domain is admitted.
    evidence:
      - sidecar: "feature-flow F-084 facet allowed_domain_silent_no_op_on_non_google_providers"
        section: observed_vs_expected.facets
        cite: "OAuthSecurityConfiguration.java:168-175"
