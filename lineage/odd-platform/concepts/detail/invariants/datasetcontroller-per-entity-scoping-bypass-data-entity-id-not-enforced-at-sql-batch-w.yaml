name: |-
  DatasetController per-entity-scoping BYPASS — data_entity_id URL parameter NOT enforced at SQL on by-version + diff endpoints (HIGH severity, batch W primary source)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-05
  - P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20W — surfaces a
  per-entity-scoping bypass at TWO of THREE DatasetController
  structure endpoints. The URL parameter `data_entity_id` is
  PRESENT in the path but IS NOT enforced against the version_id
  arguments in the SQL — a client can pass any data_entity_id and
  receive the structure of a different dataset's version.

  THE BYPASS — what actually happens:

    Endpoint 1 — getDataSetStructureByVersionId
      URL: GET /api/datasets/{data_entity_id}/structure/{version_id}
      Controller: DatasetController.java:23-30 — takes BOTH
        dataEntityId and versionId; calls
        datasetVersionService.getDatasetVersion(dataEntityId, versionId).
      Service: DatasetVersionServiceImpl.java:39-45 — passes
        datasetVersionId to the repo; uses datasetId ONLY in the
        NotFoundException message text at line 42-43 ('Dataset
        version with id %s for dataset with id %s not found'
        .formatted(datasetVersionId, datasetId)).
      Repository: ReactiveDatasetVersionRepositoryImpl.java:97-144 —
        filters `WHERE DATASET_VERSION.ID = datasetVersionId` only
        (line 129). The dataEntityId is NEVER passed to SQL.

      RESULT: A request to GET /api/datasets/{any_id}/structure/{valid_version_id_for_other_dataset}
      returns the OTHER dataset's structure. The URL implies
      parent-scoping; the implementation does not enforce it.

    Endpoint 2 — getDataSetStructureDiff
      URL: GET /api/datasets/{data_entity_id}/structure/diff?first_version_id=A&second_version_id=B
      Controller: DatasetController.java:43-50 — takes
        dataEntityId, firstVersionId, secondVersionId.
      Service: DatasetVersionServiceImpl.java:55-64 — does NOT use
        datasetId in any query (only in the BadUserRequestException
        message at line 59-61 for the identical-versions guard).
      Repository: ReactiveDatasetVersionRepositoryImpl.java:146-157 —
        filters `WHERE DATASET_VERSION.ID IN (firstVersionId,
        secondVersionId)` only (line 154).

      RESULT: A client may pass two version_ids belonging to two
      COMPLETELY DIFFERENT datasets. The diff is computed over the
      raw column lists keyed by oddrn (DatasetVersionServiceImpl.java:86-106);
      columns from two unrelated datasets compare by oddrn-mismatch
      as DELETED+CREATED — producing a nonsensical but well-formed
      diff payload. No error, no warning.

    Endpoint 3 — getDataSetStructureLatest (THE ONE THAT WORKS)
      URL: GET /api/datasets/{data_entity_id}/structure
      Repository: ReactiveDatasetVersionRepositoryImpl.java:160-217 —
        the subquery `WHERE DATA_ENTITY.ID.eq(datasetId)` at line
        167 CORRECTLY scopes the latest-version lookup.

      The author of the three SQL shapes (same file) chose to scope
      `getLatestDatasetVersion` but NOT the other two. This is
      either an oversight or a deliberate shortcut (the
      dataset_version.id is a globally unique surrogate, so the
      join is redundant for correctness). No comment in the file
      frames the intent. The MAINTAINER must decide the routing:
      OVERSIGHT (close the bypass) or INTENT (document the
      shortcut).

  WHY THIS IS HIGH — three converging concerns:

    1. URL implies parent-child scoping that implementation does
       NOT enforce. Operators wiring RBAC policies + audit-log
       tagging by `data_entity_id` would assume the parent is
       scoped. The implementation makes that assumption silently
       wrong.

    2. Cross-link to F-005 read-collaborative cross-owner
       enumeration — combined with the no-SecurityRule posture on
       these endpoints (any authenticated user can hit them), ANY
       authenticated user can:
         (a) Enumerate any dataset's version history by guessing
             version ids (the URL path is cosmetic; the version_id
             is the actual key).
         (b) Compare any two datasets' versions via the diff
             endpoint regardless of parent dataset.
       The blast radius is the entire catalog of dataset versions.

    3. The bug INCLUDES the F-004 read-side surface for dataset
       fields. Every DataSetField in the returned structure carries
       its `internal_description` field — the F-004 stored-XSS
       write-side surface from DatasetFieldController PUT (batch V).
       A client bypassing per-entity scoping can read ANY dataset
       field's user-curated description regardless of permission
       scope. Combined with the no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic
       invariant (batch U), the cross-owner-readable XSS payload
       reaches Markdown.tsx renderers in any user's browser if they
       happen to load the cross-owner version.

  THE 500-ON-MISSING-VERSION-ID — sibling-shaped finding:

    `DatasetVersionServiceImpl.buildDataSetVersionDiffList` line
    69-71 throws a generic `RuntimeException` when
    `versionFields.size() != 2` (i.e., one of the requested version
    ids does not exist). The runtime exception is NOT translated to
    BadUserRequestException or NotFoundException — it bubbles as
    HTTP 500. The other two structure endpoints throw NotFoundException
    correctly (DatasetVersionServiceImpl.java:41-43, 50-51).
    Inconsistent error contract within the same controller's
    surface. Severity MEDIUM (compounds with the per-entity-scoping
    bypass: a client guessing version_ids gets 200-with-data or
    500-on-typo, NEVER 404-with-explanation).

  THE PARENT-FIELD CASCADE DELETE+CREATE — sibling-shaped finding:

    DatasetVersionServiceImpl.getParentOddrnChangedPojos (lines
    156-180) propagates a parent-rename through every descendant
    via a recursive fixed-point algorithm; the diff payload size
    grows non-linearly with struct depth. Operators comparing
    nested-struct datasets see amplified diff output with no
    doc-side text explaining why. Severity LOW (intentional per
    versioning-by-reference; surfaces as performance / UX concern
    on heavily-nested schemas).

  CROSS-OWNER READ AT THE RELATIONSHIPS ENDPOINT — fourth bypass
  member:

    GET /api/datasets/{data_entity_id}/relationships is ALSO
    no-SecurityRule + (the dataEntityId IS used in the SQL per
    RelationshipsServiceImpl, so per-entity scoping is enforced
    HERE). But the relationships returned can include relationships
    INTO entities owned by other teams — the relationship graph
    crosses ownership boundaries. Same read-collaborative posture
    as the other three endpoints. The OpenAPI tag `dataSet` declares
    this endpoint at openapi.yaml:1810-1826 but the live
    /developer-guides/api-reference/relationships page (WebFetched
    2026-05-20 status 200) EXPLICITLY omits this dataset-scoped
    variant. Verbatim from the WebFetch: 'Regarding GET
    /api/datasets/{data_entity_id}/relationships — No, this
    endpoint is not mentioned on this page.'

  THE UNDOCUMENTED dataSet OPENAPI TAG — NEW MEDIUM finding:

    All four DatasetController endpoints carry the OpenAPI tag
    `dataSet` (openapi.yaml:1793-1878). The live
    /developer-guides/api-reference hub (WebFetched 2026-05-20
    status 200) lists 9 per-feature sub-pages — NONE describe the
    dataSet tag's endpoints. Operators discovering structure /
    diff / dataset-relationships endpoints rely on Swagger UI
    at runtime. Same DOC-NNN gap class as the DataSourceController
    sub-page absence (THIS BATCH, sibling invariant).

  SEVERITY HIGH — the per-entity-scoping bypass is a security
  primitive (URL implies scoping that isn't enforced) compounded
  by the F-004 read-side surface (cross-owner-readable XSS) +
  the cross-owner enumeration class (read-collaborative posture).
  Severity climbs to HIGH because operators reasoning about
  permission scoping via URL paths would be silently wrong.

