proposed_action: |-
  Testcontainers integration test. (a) Seed: Term T1 in namespace N1 with description "look up T1"; DataEntity DE1 with description "[[N1:T1]] is important" (is_description_link inserted). (b) Soft-delete DE1 (set STATUS=DELETED). (c) hasDescriptionRelations(T1.id) → FALSE (the bug pin — current behaviour). (d) Rename T1 to T1_RENAMED via repository.update. Succeeds (the guard returned FALSE). (e) Restore DE1 (set STATUS=STABLE). (f) Read DE1's description-mentions: assert the [[N1:T1]] reference now resolves to "unhandled" or is preserved as broken text. (g) Test comment: 'Pins the current behaviour; future fix removing STATUS.ne(DELETED) filter would flip this test to expect TRUE in step (c) and reject the rename in step (d).' Pair with REPOSITORY-DOC-GAP-A.
