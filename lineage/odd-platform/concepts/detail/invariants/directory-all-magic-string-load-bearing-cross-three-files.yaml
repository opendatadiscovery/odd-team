  strengths:
    - |-
      The type annotation `typeId?: number | 'all'` at
      `directoryRoutes.ts:47` IS the type-system documentation of the
      sentinel — callers know they can pass either a number OR the
      literal `'all'`, never an arbitrary string.
    - |-
      The runtime behaviour IS consistent today — the literal is
      stable across the three files; the documented URL pattern
      `/directory/{prefix}/{dsId}/all` is what the code actually
      produces and reads.
  weaknesses:
    - |-
      No named constant unites the three locations. A rename in one
      location without the others produces silent NaN downstream
      coercion AND inconsistent inter-component navigation. Failure
      shapes enumerated in the description (three rename-asymmetry
      scenarios).
    - |-
      Doc-side does not explain the sentinel — operators reading
      `/directory/{prefix}/{dsId}/all` URL form have no signal that
      `'all'` is meaningful vs a literal data-entity-type id.
