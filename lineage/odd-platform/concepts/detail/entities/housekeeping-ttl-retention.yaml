  - |-
    **NEW batch VAL-LSN-019-B — Race window between count(*)=0 check
    and DROP TABLE in the activity reaper (HIGH — silent data loss)**:
    promoted to dedicated invariant
    `activity-empty-partitions-race-window-between-count-check-and-drop`.
    The check + drop are TWO separate SQL statements on the same
    Connection with no JOOQ transaction wrapper — concurrent INSERT
    INTO activity that lands between them survives the count check
    but is dropped along with the partition. Caller sees INSERT-success;
