feature_id: F-076
pillar_id: P-08
pillar_anchored_id: P-08:F-016
pillar_anchored_feature_name: Cross-Management Cascade-on-Delete Protection Pattern
feature_name: |-
  Cross-Management cascade-on-delete protection pattern — Owner / Namespace
  / DataSource (the three Management-tab parent rows whose delete paths
  guard against orphaning referents) share a uniform architectural shape
  AND a uniform defect: the existence-check + soft-delete pair is NOT
  atomic with concurrent referent INSERTs. None of the three delete paths
  acquires a row-level lock on the parent row, none uses a Postgres
  advisory lock, and they run under READ COMMITTED isolation. Worse: the
  Namespace path is not even `@ReactiveTransactional`, so the cascade-check
  + soft-delete chain is non-atomic with itself.
seeded_from: SHB-093
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  Three operator-triggered DELETE controller methods that share the
  cascade-protection pattern:
   - DELETE /api/owners/{id}      (OwnerController#delete)
   - DELETE /api/namespaces/{id}  (NamespaceController#delete)
   - DELETE /api/datasources/{id} (DataSourceController#delete)
  Each: existence-checks-via-Mono.zip-then-soft-deletes the parent. All
  three are operator-facing destructive verbs in the Management tabs.
primary_subject:
  - "odd-platform java OwnerServiceImpl service-method:delete"
  - "odd-platform java NamespaceServiceImpl service-method:delete"
  - "odd-platform java DataSourceServiceImpl service-method:delete"
contributing_nodes:
  - "odd-platform java OwnerServiceImpl:88-100"
  - "odd-platform java NamespaceServiceImpl:73-90"
  - "odd-platform java DataSourceServiceImpl:85-96"
  - "odd-platform java ReactiveAbstractSoftDeleteCRUDRepository:50-59"
