- id: H-010
  hypothesis: "When two operators migrate the same deployment between auth modes (e.g. LOGIN_FORM → LDAP, or OAUTH2 → LDAP) keeping the same usernames, each user's existing ADMIN/owner linkage carries over."
  derivation: "Cross-pillar — F-124 shares_data_with P-08 and feeds F-011; an operator migrating modes expects continuity. LDAPSecurityConfiguration sidecar describes provider=null for LDAP users."
  seed_source: cross-pillar
  validation:
