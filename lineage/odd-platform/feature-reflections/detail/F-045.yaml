      version_ids turns "no per-dataset gate" into "full-catalog schema disclosure to any
      account". The live doc now documents this honestly (see doc cross-reference) — so the
      contradiction is code-vs-expectation, not code-vs-doc.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

