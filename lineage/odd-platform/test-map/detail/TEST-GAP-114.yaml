gap_id: TEST-GAP-114
category: missing-integration
criticality: HIGH
node_ids:
- odd-platform java CounterTimeSeriesExtractor config-key-consumer:metrics.storage@L20
surfaced_by:
- CounterTimeSeriesExtractor@L20.md:tests_coverage_semantic.uncovered_behaviours.[4]
behaviour: '`@ConditionalOnProperty` mutual exclusion between `CounterTimeSeriesExtractor`
  (extractors/external/, havingValue=PROMETHEUS) and `CounterMetricsSeriesExtractor`
  (extractors/internal/, havingValue=INTERNAL_POSTGRES, matchIfMissing=true). No Spring-context
  test asserts only one bean exists per `metrics.storage` value. A future drop of
  `matchIfMissing=true` from the internal side silently produces a zero-extractor
  (boot OK, requests throw) or two-extractor (one of them never runs) config.'
test_files_existing:
- odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ingestion/PrometheusMetricsIngestionTest.java
  (sets metrics.storage=PROMETHEUS but does not exercise the INTERNAL_POSTGRES mutual-exclusion
  direction)
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/config/MetricsExtractorMutualExclusionTest.java
  name: metricsStorage_eachValue_onlyOnePerTypeExtractorBeanWired
evidence:
- 'CounterTimeSeriesExtractor@L20.md says: ''no Spring-context test asserts only one
  bean exists for any given value of metrics.storage. A future change that drops matchIfMissing=true
  from the internal side would silently produce a zero-extractor or two-extractor
  configuration with no test to catch it'''
- concepts.yaml:entities[Metrics Ingestion].notes (silent-third-value fallthrough
  surfacing area)
cross_references:
- concepts.yaml:entities[Metrics Ingestion]
proposed_action: Add `@SpringBootTest` parameterised over `metrics.storage ∈ {INTERNAL_POSTGRES,
  PROMETHEUS, unset, GARBAGE}`; for each MetricType ∈ {Counter, Gauge, Histogram,
  Summary} assert exactly one extractor bean of the appropriate flavour is wired (or
  zero for GARBAGE — locks the silent-third-value behaviour).
