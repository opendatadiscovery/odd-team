  method delegates straight to DataCollaborationService with no per-request business logic
- |-
  uploadFileChunk.implicit_adrs[0] — same pattern across all 10 methods on
  DataEntityAttachmentController
- |-
  IdentityController batch ZD implicit_adrs.[1] — identity-exposure surface
  deliberately omits @PreAuthorize; the 28-line single-endpoint delegate IS the convention
- |-
  PermissionController batch ZD invariants.[0] — ENTIRE method body is two lines
  (23-24); no business logic, no programmatic auth check, no validation; pure
  stub-implementation of PermissionApi
- |-
  RoleController batch ZD implicit_adrs.[0] — Thin-delegate controller posture;
  every endpoint method is exactly one expression delegating to the service. The
  pattern matches every sibling controller in the package.
- |-
  PolicyController batch ZD invariants.[0] — Every method is a thin reactive proxy
  onto policyService. The controller body for each of six methods is two to three
  Mono operations.
- |-
  IntegrationController batch ZD stress_findings.name_behavior_pairs.[0] — both
  methods are two-line delegates; ServerWebExchange injected on both methods but
  never used; same pattern as other thin OpenAPI-delegate controllers
- |-
  SearchController batch ZE implicit_adrs.[1] — Reactive pass-through delegate;
  every method body is `svcCall.map(ResponseEntity::ok)`; class has only
  @RestController + @RequiredArgsConstructor annotations
- |-
  TitleController batch ZE concepts.invariants.[7] — ServerWebExchange parameter
  unused; the single getTitleList method body is a one-line delegate to titleService.list
- |-
  FeatureController batch ZE concepts.invariants.[1] — ServerWebExchange RECEIVED
  but never read on the single getActiveFeatures method
- |-
  RelationshipController batch ZE concepts.invariants.[0] — Thin-delegate posture
  across all three methods; ServerWebExchange parameter is a no-op acceptance
- |-
  LinksController batch ZE concepts.invariants.[0] — Boot-bound static catalogue
  delegate; single getLinks method body never reads ServerWebExchange
