proposed_action: |-
  **Vitest skeleton-trigger tests** (4 tests):

  1-2: assert skeleton renders under each of the two trigger states.
  3: assert content renders even when `appInfo` is still loading — the asymmetric exclusion.
  4: assert the OwnerAssociation card flickers when `appInfo` lands after first paint — PINS the documented UX gap.

  **Architectural fix (optional, per maintainer policy)**:
  - Add `appInfo === undefined` to the loading composition (eliminates flicker)
  - OR add `<Suspense>` boundary around OwnerAssociation (smoothes the transition)
  - OR add explicit "loading..." placeholder where OwnerAssociation will mount

  The test pins the contract today; the fix is optional UX improvement.

  Coherence note (LSN-018 Rule 6): NO contradiction with existing artefacts. STRENGTHENS Overview.md:implicit_adrs[2] by establishing the asymmetric trigger as a tested contract.
