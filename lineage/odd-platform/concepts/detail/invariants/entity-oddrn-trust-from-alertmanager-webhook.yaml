notes: |
  Cross-batch security-finding capture. The AlertManager webhook path has THREE
  compounding gaps:

    (1) Unauthenticated by design (operator-delegated network controls).
    (2) entity_oddrn label trusted verbatim — spoof + orphan + XSS surfaces.
    (3) No idempotency — Prometheus retries produce duplicates (companion
        invariant `alertmanager-webhook-bypasses-alert-action-resolver-no-idempotency`).

  The cumulative blast radius: a network-reachable attacker (in DISABLED deployments,
  this is any caller; in default deployments under operator-deployed network
  controls, this is anyone inside the network perimeter) can:

    (a) Create spoof DISTRIBUTION_ANOMALY alerts on arbitrary data entities;
    (b) Plant XSS payloads via the generator URL field rendered by the UI;
    (c) Pollute the alert feed via Prometheus-retry-induced duplicates.

  Recommended cleanup paths:

    (a) Doc: extend `/configuration-and-deployment/odd-platform#prometheus-alertmanager-integration`
        with a 'Security model' subsection explicitly warning that the
        webhook is unauthenticated by design and that the operator MUST
        ensure network-layer isolation. Cross-reference the LSN that this
        bundles with (it's adjacent to LSN-001 ephemeral-default + LSN-002
        region-unset in the class of "bundled defaults that hurt operators").

    (b) Code: require S2S authentication on the AlertManager webhook (extend
        IngestionDataEntitiesFilter's path match). Trade-off: more friction
        for Prometheus operators; but mitigates the spoof + XSS surfaces.

    (c) Code: validate entity_oddrn against the data_entity table — reject
        the payload if the entity doesn't exist. This is a one-line
        switchIfEmpty in handleExternalAlerts.

    (d) Code: escape the generator URL when embedding in chunk descriptions;
        verify the UI rendering layer uses rehype-sanitize.

  Cross-references:
    - Companion: `alertmanager-webhook-bypasses-alert-action-resolver-no-idempotency`
      (the third AlertManager-path gap).
    - LSN-001 / LSN-002 class: bundled defaults that ship with destructive trade-offs
      not signposted in docs.
    - Existing concept: `alertmanager-webhook-receiver` (the entity covering the
      webhook surface; this invariant adds the trust-perimeter semantic).
