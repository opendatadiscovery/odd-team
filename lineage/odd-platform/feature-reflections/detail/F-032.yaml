- id: H-004
  hypothesis: |
    When the backend ever returns a run-status value outside the six-value
    DataEntityRunStatus enum (a 7th enum added server-side ahead of a frontend
    regen, a stale generated-sources build, or a malformed payload), the
    dashboard degrades gracefully — it shows that status as an "unknown"-coloured
    slice — rather than failing.
  derivation: "Endpoint-shape + negative-space: the response carries a `status` string projected through palette.runStatus[status].color; a product owner asks what happens at the enum boundary."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      It does NOT degrade — it crashes the entire dashboard. DataQualityContent.tsx
      :47-48 builds the Test Results Breakdown slice colours with
      `palette.runStatus[status].color ?? palette.dataQualityDashboard.unknown`.
      palette.runStatus is a `Record<DataEntityRunStatus, ItemColors>`
      (interfaces.ts:55) keyed by exactly the six enum values. For any other
      `status`, `palette.runStatus[status]` is `undefined` and `.color` throws
      a TypeError BEFORE the `??` is evaluated — the `??` was written to guard a
      missing `.color` on a PRESENT entry, not a missing entry, so it does not
      save this case. The TypeError propagates out of the useMemo and crashes
      the whole component tree: the operator sees a blank dashboard, not a
      degraded one. There is no ErrorBoundary around the route (DataQuality.tsx
      bugs[1] confirms only AppSuspenseWrapper, no error boundary). The Table
      Health and Monitored Tables rings would not hit this (fixed palette keys),
      but they are inside the same crashed tree, so they blank too.
      VERIFIED RED end-to-end on 2026-06-02: IT-004 injected status=WARNING into
      the live /api/dataqatests/runs response (odd-minimal stack) and captured
      the exact `TypeError: Cannot read properties of undefined (reading
      'color')` at DataQualityContent.tsx:47-48 with the dashboard not
      rendering; IT-006 injected tables_dashboard:null and captured the
      whole-app white-screen (#root innerText length 0) proving there is no
      ErrorBoundary anywhere in odd-platform-ui.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataQualityContent.md
        section: bugs_limitations_corner_cases[0] + concepts.invariants[4] + stress_findings.tunables
        cite: "DataQualityContent.tsx:47-48 + interfaces.ts:55 + components.yaml:1407-1415"
        note: "unsafe indexed access; the ?? guards the wrong thing; statically certain from the type"
      - sidecar: odd-platform__ts__react-component__component__DataQuality.md
        section: bugs_limitations_corner_cases[1]
        cite: "App.tsx:39,58 + AppSuspenseWrapper.tsx:8-21"
        note: "no ErrorBoundary around the route — the crash is uncaught"
      - sidecar: "(integration-test, not a node sidecar) IT-004 + IT-006 run-log"
        section: "integration-tests/run-log/2026-06-02-known-bugs.md lines 11,13"
        cite: "DataQualityContent.tsx:47-48 (IT-004 reproduced TypeError) + #root length 0 (IT-006 reproduced white-screen)"
        note: "the crash + the missing-boundary class are BOTH reproduced RED by executed e2e pins — the failure mode is verified; the PROMISE (graceful degradation) is not"
    operator_visible_failure: |
      The single most damaging latent bug on this feature. A backend enum
      addition (the platform team adds, say, a TIMED_OUT or a SUSPENDED run
      status) ships, the frontend generated-sources are not regenerated in the
      same release, and the FIRST dashboard fetch that returns a test whose
      latest run carries the new status blanks the entire /data-quality page
      with an uncaught TypeError — for every user, with the build green and no
      test catching it. The operator sees a white page exactly when a NEW kind
      of run outcome (likely a problem worth triaging) first appears. The
      failure is silent at build time and total at runtime. The one-line fix is
      optional chaining on the ENTRY (`palette.runStatus[status]?.color ??
      fallback`); the class fix is a route/root ErrorBoundary (IT-006 / F-042).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_projection:
      uc_id: F-032-UC-04
      kind: render
      promise: "When the dashboard receives a run-status outside the six-value enum (a forward-compatible backend addition or malformed payload), it degrades — shows the unknown status with a fallback colour — and never blanks the page."
      coverage: unverified   # IT-004 pins the CRASH (RED); it does NOT verify the PROMISE (graceful degradation). The promise is verified only when the null-safe fix lands AND IT-004 flips GREEN.
      test_ref: "integration-tests/e2e/specs/quality-dashboard-unknown-status.spec.ts (IT-004 — characterization pin, RED 2026-06-02; regresses PLT-052 Defect 1)"
      test_demand: functional   # the demand is "fix DataQualityContent.tsx:47-48 + add the F-042 boundary, then IT-004/IT-006 flip GREEN and the promise is verified" — NOT mint a new test (the pin already exists)
      test_demand_note: "Regression guard ALREADY EXISTS (IT-004 + the boundary-class IT-006) and runs RED. Per LSN-029 these are correct pins of the open bug; per LSN-030 the PROMISE is still unverified until the fix flips them GREEN. So the functional demand here is the FIX + the pin-flip, tracked under PLT-052 Defect 1 (crash) + F-042/TEST-GAP-1013 (boundary), not a fresh TEST-GAP."

- id: H-005
  hypothesis: |
    When an operator selects a value in the "Title" filter, the dashboard
    narrows to datasets whose TITLE/NAME matches — i.e. "Title" filters by the
    dataset's title, as the bare label reads.
  derivation: "UI-label + endpoint-shape: the filter carries the bare i18n label t('Title') (TitleFilter.tsx:29); in a data catalog 'Title' reads as the entity's human-readable name. LSN-020-class check."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      "Title" does NOT filter by dataset name. Traced through the chain
      (filtersAtom -> getDataQualityTestsRuns -> DataQualityRunsServiceImpl ->
      DataQualityTestFiltersMapper -> ReactiveDataQualityRunsRepositoryImpl),
      `titleIds`/`deTitleIds` binds to `OWNERSHIP.TITLE_ID.in(titleIds)`
      (ReactiveDataQualityRunsRepositoryImpl.java:301, 309) — the TITLE table is
      the ownership ROLE assigned alongside an owner (e.g. "Data Steward",
      "Owner"), a concept entirely distinct from a dataset's name. The bind is
      cross-quoted by TWO enriched sidecars (DataQualityFilters + the backend
      controller), so this is primary-source, not inference. An operator who
      selects a value in "Title" expecting to isolate a named dataset instead
      narrows the rings to datasets where SOMEONE holds that ownership role.
      This is a fresh instance of the LSN-020 drift class (Activity Feed
      userIds -> OWNER_ID) on the DQ dashboard. Partial mitigation: the "Title"
      autocomplete is populated by useGetTitleList, so a careful operator who
      opens the dropdown sees role names ("Data Steward") and can infer the
      meaning — but the bare label alone misleads, and there is no UI qualifier.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataQualityFilters.md
        section: bugs_limitations_corner_cases[0] + stress_findings.request_inputs (Title Q3)
        cite: "TitleFilter.tsx:29 (label) + ReactiveDataQualityRunsRepositoryImpl.java:301,309 (OWNERSHIP.TITLE_ID bind) + TitleFilter.tsx:4 (useGetTitleList)"
        note: "DRIFT_INPUT_NAME_VS_IMPLEMENTATION — primary-source SQL bind"
      - sidecar: odd-platform__java__DataQualityRunsController__controller-class__DataQualityRunsController.md
        section: bugs_limitations_corner_cases[1] + doc_drift_findings[1]
        cite: "ReactiveDataQualityRunsRepositoryImpl.java:296-311"
        note: "backend confirmation of the OWNERSHIP.TITLE_ID bind"
    operator_visible_failure: |
      An operator triaging "the quality of my `orders` dataset" selects "Title"
      and types `orders`, expecting to narrow to that dataset. If no ownership
      ROLE named `orders` exists (the normal case), the dropdown is empty or
      offers role names, and any selection narrows the dashboard to a slice of
      datasets-by-ownership-role that has nothing to do with the dataset they
      meant — silently returning the wrong rings. A BI/API consumer hitting
      GET /api/dataqatests/runs directly is worse off: the OpenAPI spec
      (openapi.yaml:1973-2078) declares all ten params with ZERO descriptions,
      so there is no signal at all that `titleIds` means ownership role. The
      operator gets confidently-wrong results with no error.
    severity: HIGH
    confidence: HIGH
    probe_id: P-110
    routes_to_finding: bug-candidate
    use_case_projection:
      uc_id: F-032-UC-05
      kind: grammar   # the meaning of a named filter input vs what it binds to (LSN-020 input-name-vs-implementation)
      promise: "Selecting a value in the 'Title' filter narrows the dashboard by what the label names — and the system surfaces what 'Title' actually binds to (ownership role) so the operator is not misled."
      coverage: unverified
      test_ref: null
      test_demand: functional   # P-110 pins the scope at runtime; the standing TEST is an e2e/integration assertion that selecting a Title value adds OWNERSHIP.TITLE_ID to the query (and, post-relabel, that the label reads 'Ownership Title')
      test_demand_note: "No test pins the Title-filter scope. The demand: an integration/e2e test asserting that a 'Title' selection narrows by OWNERSHIP.TITLE_ID (P-110 confirms the scope; the test is the guard). Pairs with the DOC-GAP-264 doc-side fix + the TitleFilter.tsx:29 relabel sliver."

- id: H-006
  hypothesis: |
    When an operator reads the "Test Results Breakdown" ring (or a per-category
    card's total), the number is the count of test RUNS in each status — i.e. a
    test that ran 100 times contributes 100 to the breakdown — matching the live
    doc's "the count of test runs broken down by status" and the URL path
    /api/dataqatests/runs.
  derivation: "Response-shape + doc-claim + name-behavior: four surfaces (UI ring label, per-category total, URL `runs`, OpenAPI summary, live doc verbatim) all promise per-run semantics. LSN-019-class check."
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      The breakdown counts TESTS by their LATEST run status, NOT runs. The SQL
      joins DATA_ENTITY_TASK_LAST_RUN, whose `task_oddrn` is a PRIMARY KEY
      (V0_0_45__last_runs_table.sql:9) — exactly one row per test, the latest
      run. A test that ran 100 times (99 SUCCESS, 1 latest FAILED) contributes
      ONE to FAILED, not 99 to SUCCESS + 1 to FAILED. Four independent surfaces
      promise per-run semantics and all are wrong-by-construction: the UI ring
      label "Test Results Breakdown" (DataQualityContent.tsx:110); the
      per-category total `total = Σ count across statuses` rendered as an
      implicit "total runs" headline (TestCategoryResults.tsx:14-17,33); the URL
      segment `/api/dataqatests/runs`; the OpenAPI operation summary "Get Data
      Quality tests runs" (openapi.yaml:1975-1976); and the live doc verbatim
      "the count of test runs broken down by status" (dashboard.md 2026-05-25).
      Three layers agree on the wrong meaning (the LSN-019 family — the
      `listMostPopular` shape on the dashboard). The closed-enum 6x6 padding
      (DataQualityCategoryMapperImpl.java:45-60) further hides "no runs" from
      "0 tests with latest=X".
    evidence:
      - sidecar: odd-platform__java__DataQualityRunsController__controller-class__DataQualityRunsController.md
        section: bugs_limitations_corner_cases[0] + name_behavior_pairs + invariants
        cite: "ReactiveDataQualityRunsRepositoryImpl.java:76,95,100 + V0_0_45__last_runs_table.sql:9 + openapi.yaml:1975-1976 + WebFetch dashboard.md 2026-05-25"
        note: "task_oddrn PRIMARY KEY -> one row per test; doc + URL + summary all say 'runs'"
      - sidecar: odd-platform__ts__react-component__component__TestCategoryResults.md
        section: stress_findings.name_behavior_pairs (total) + understanding
        cite: "TestCategoryResults.tsx:14-17,33"
        note: "the per-category total sums tests-by-latest-status, read by operators as 'total runs'"
    operator_visible_failure: |
      Two distinct failure modes. (1) OPERATOR MISREAD: an operator triaging
      reads "5 FAILED" and assumes five failing executions / a run-volume
      signal; it actually means five tests whose most-recent run failed. The
      dashboard cannot distinguish "one transient failure on a stable test"
      from "a test that fails every single run." A flapping test
      (SUCCESS/FAILED alternating) jumps buckets each refresh with no test
      added or removed — operators cannot explain the fluctuation to
      non-engineering stakeholders. (2) BI/API CONSUMER WRITES THE WRONG QUERY:
      the first PR consumer wiring a BI panel against /api/dataqatests/runs
      writes `SUM(count) across statuses` expecting total run volume and gets
      total TEST count instead — a silently wrong metric on an executive
      dashboard. The mechanical fix is to rename every surface to honour the
      truth ("Tests by Latest Run Status"); the product-correct fix is a second
      endpoint that genuinely counts runs over a window.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_projection:
      uc_id: F-032-UC-06
      kind: grammar   # the meaning the count surface promises (runs) vs what it computes (tests-by-latest-status) — LSN-019
      promise: "The 'Test Results Breakdown' ring and each per-category total mean what their label/URL/doc promise — the count of test RUNS in each status (a test that ran 100 times contributes 100)."
      coverage: unverified
      test_ref: null
      test_demand: functional   # an integration test seeding a test with N>1 runs and asserting the breakdown reflects the intended semantic (post-fix: either renamed to 'tests by latest status' with a unit asserting one-row-per-test, OR a second runs-volume endpoint asserting N)
      test_demand_note: "No test pins the runs-vs-tests semantic. The demand: a backend/integration test that seeds a test with 100 runs (99 SUCCESS, 1 FAILED latest) and asserts the breakdown counts ONE FAILED (current behaviour) — then, on the relabel/second-endpoint fix, asserts the corrected semantic. Pairs with DOC-GAP-265 + the PLT-052 Defect 2 relabel. The single highest-severity unverified promise."

- id: H-007
  hypothesis: |
    When an operator selects a value in the "Namespace" filter, the dashboard
    narrows to entities assigned to that namespace — i.e. the entity's own
    namespace, as the bare label reads.
  derivation: "UI-label + endpoint-shape: the filter carries the bare label t('Namespace'); a product owner asks whether 'Namespace' means the entity's namespace or something wider. Category-F check."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      Partly true: the entity's own namespace IS matched, but the match is
      silently WIDENED to datasource-inherited namespaces. The SQL is
      `NAMESPACE.ID.in(namespaceIds).and(NAMESPACE.ID.eq(DATA_ENTITY.NAMESPACE_ID)
      .or(NAMESPACE.ID.eq(DATA_SOURCE.NAMESPACE_ID)))`
      (ReactiveDataQualityRunsRepositoryImpl.java:288-293). The strict-match
      column DATA_ENTITY.NAMESPACE_ID IS in the OR (so the literal
      interpretation is honoured), but the added `.or(DATA_SOURCE.NAMESPACE_ID)`
      clause also includes every entity whose DATASOURCE carries the namespace
      — even if the entity itself has no namespace or a different one. So
      "Namespace X" returns a WIDER set than "entities in namespace X." This is
      over-inclusion, not mis-binding — which is why it is `partial` and not a
      full contradiction (contrast the Title filter, which is a true
      mis-binding). The dashboard doc does not disclose the widening.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataQualityFilters.md
        section: stress_findings.request_inputs (Namespace Q3/Q4) + bugs_limitations_corner_cases
        cite: "ReactiveDataQualityRunsRepositoryImpl.java:288-293 (the .or(NAMESPACE.ID.eq(DATA_SOURCE.NAMESPACE_ID)))"
        note: "TRANSLATES_SILENTLY — strict column in OR, widened by the datasource clause"
      - sidecar: odd-platform__java__DataQualityRunsController__controller-class__DataQualityRunsController.md
        section: bugs_limitations_corner_cases[2] + doc_drift_findings[2]
        cite: "ReactiveDataQualityRunsRepositoryImpl.java:288-293"
        note: "backend confirmation of the namespace widening"
    operator_visible_failure: |
      An operator filtering the dashboard to "namespace = analytics" to assess
      the quality of entities they think belong to that namespace sees a wider
      slice than expected: every entity whose datasource is in `analytics` is
      included, even entities with a different (or null) own namespace. The ring
      counts are inflated relative to the operator's mental model of "entities
      directly in analytics," and there is no UI signal of the widening. The
      consequence is a subtly-wrong aggregate, not an empty or crashed one — the
      hardest class to notice, because the numbers look plausible. The fix is
      either to match only the entity's own NAMESPACE_ID, or to disclose the
      datasource-inheritance widening in the doc + a UI hint.
    severity: MEDIUM
    confidence: HIGH
    probe_id: P-110
    routes_to_finding: caveat-candidate
    use_case_projection:
      uc_id: F-032-UC-07
      kind: grammar   # the named filter's match-scope vs the operator's reading of the label
      promise: "Selecting a value in the 'Namespace' filter narrows the dashboard to entities IN that namespace — and any widening (datasource-inherited matches) is disclosed."
      coverage: unverified
      test_ref: null
      test_demand: functional   # the unmet part (Rule 11 partial -> functional demand for the gap): a test seeding an entity with namespace=A whose datasource is namespace=B, then filtering namespace=B and asserting whether that entity appears (it does today) — pinning the widening
      test_demand_note: "Partial — the strict match works; the widening is undisclosed. The demand pins the WIDENING: seed an entity in namespace A under a datasource in namespace B, filter by B, assert the entity is counted (current widened behaviour). Pairs with DOC-GAP-272."

- id: H-008
  hypothesis: |
    When an operator selects BOTH an "Owner" and a "Title" in the same filter
    block, the dashboard narrows to entities that match the owner OR the title
    (or at least: entities the owner owns, intersected with entities that have
    that title) — i.e. the two dimensions combine the way independent filters do.
  derivation: "Endpoint-shape + negative-space: Owner and Title are presented as two independent filter rows; a product owner asks how they combine, since both bind to the OWNERSHIP table."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      They do NOT combine as two independent filters. When both ownerIds and
      titleIds are non-empty, the SQL puts them in ONE OWNERSHIP join joined by
      AND: that single ownership row must satisfy
      `OWNER_ID.in(ownerIds) AND TITLE_ID.in(titleIds)`
      (ReactiveDataQualityRunsRepositoryImpl.java:297-302). The result is
      entities where THAT owner holds THAT title — not entities the owner owns
      (under any title) intersected with entities that have that title (under
      any owner), and certainly not the union. An operator selecting "Owner:
      Alice" AND "Title: Data Steward" sees ONLY datasets where Alice is
      specifically the Data Steward — excluding datasets Alice owns under a
      different title, and datasets where someone else is the Data Steward.
      Note: system-mission.md P-04 documents "AND-only two-side filters" as a
      pillar property — the two-SIDE (tables vs tests) AND is intended; the
      surprise this hypothesis surfaces is the single-OWNERSHIP-ROW AND between
      Owner and Title WITHIN one side, which the pillar text does not name.
    evidence:
      - sidecar: odd-platform__java__DataQualityRunsController__controller-class__DataQualityRunsController.md
        section: bugs_limitations_corner_cases (Owner+Title AND)
        cite: "ReactiveDataQualityRunsRepositoryImpl.java:297-302 (combined branch) vs 303-306 (owner-only) vs 307-311 (title-only)"
        note: "single ownership row must carry both owner AND title"
      - sidecar: odd-platform__ts__react-component__component__DataQualityFilters.md
        section: stress_findings.request_inputs (Title Q4)
        cite: "ReactiveDataQualityRunsRepositoryImpl.java:297-311"
        note: "the combined-with-Title AND-semantics surfaced from the UI sidecar"
    operator_visible_failure: |
      Compounded on top of the H-005 Title mislabel: an operator who has worked
      out that "Title" means ownership role, and selects Owner=Alice +
      Title=Owner to find "datasets Alice owns," can still get a SURPRISING
      EMPTY DASHBOARD if Alice's ownership rows carry a different title string
      than the one selected — the AND on a single ownership row is far narrower
      than the operator's "Alice's datasets that also have an owner" mental
      model. An empty dashboard reads as "Alice owns no datasets with DQ tests,"
      which may be false. Because the two filters look independent in the UI,
      the AND-on-one-row semantics is invisible until it produces a wrong
      (often empty) result. This is a NEW drift class proposed
      (owner_and_title_combined_filter_single_ownership_row_AND...).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_projection:
      uc_id: F-032-UC-08
      kind: grammar   # how two named filter dimensions combine vs the operator's reading
      promise: "Selecting Owner and Title in one block combines them as the operator expects (owner's datasets intersected with that-title datasets), not as a single-ownership-row AND that often returns empty."
      coverage: unverified
      test_ref: null
      test_demand: functional   # a backend/integration test seeding an entity owned by Alice under title 'Owner' and another under 'Data Steward', then filtering Owner=Alice + Title='Data Steward' and asserting ONLY the Data-Steward row matches (pins the single-row AND)
      test_demand_note: "No test pins the single-ownership-row AND. The demand: seed two ownership rows for Alice (titles Owner / Data Steward), filter Owner=Alice + Title=Data Steward, assert only the Data-Steward entity is counted. NEW drift class; routes to a net-new doc-gap caveat + this functional guard."

- id: H-009
  hypothesis: |
    When the dashboard fetch fails (a 4xx/5xx from GET /api/dataqatests/runs),
    the operator sees an explicit error state ("could not load — retry"), not a
    state that looks like a healthy-but-empty catalog.
  derivation: "Negative-space: every read surface a product owner demos has a failure mode; the question is whether a backend failure is distinguishable from 'no data'."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      A failed fetch is presented IDENTICALLY to an empty catalog — there is no
      error UI. DataQualityContent.tsx:24 destructures only `{ data, isSuccess }`
      from useGetDataQualityDashboard — never `isError`/`error`. The hook
      supplies `initialData` (an all-zero DataQualityResults, dataQuality.ts
      :34-81). On a 4xx/5xx, react-query keeps `data` at initialData (all
      zeros), `isSuccess` stays false, `testResults` is `[]`, and the operator
      sees three grey "No data" donuts (DonutChart's zero-total path,
      DonutChart.tsx:94-95) and zero category cards. The route-entry node mounts
      no error UI of its own either (DataQuality.tsx is pure layout). A real
      backend failure renders as "your catalog has no data quality tests."
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataQualityContent.md
        section: bugs_limitations_corner_cases[5] + stress_findings.resource_boundaries
        cite: "DataQualityContent.tsx:24 (only data,isSuccess) + dataQuality.ts:77-81 (initialData, no error surface)"
        note: "isError never read; initialData all-zeros shown on failure"
      - sidecar: odd-platform__ts__react-component__component__DataQuality.md
        section: bugs_limitations_corner_cases[2]
        cite: "DataQuality.tsx:13-15 + DataQualityContent.tsx:24,33,44"
        note: "route entry is pure layout — no error/empty-state ownership"
    operator_visible_failure: |
      An operator opens /data-quality during a backend outage, a DB hiccup, or
      a deploy window and sees three grey "No data" rings and no category cards.
      They conclude the catalog has no DQ tests configured — and may go
      configure or re-ingest tests that already exist, or escalate a
      "data-quality coverage" concern that is actually a transient fetch
      failure. The two states (catalog genuinely empty vs fetch failed) are
      pixel-identical. Combined with the zero staleTime (react-query refetches
      on focus), a flaky backend produces intermittent "all my DQ data
      vanished" reports. The fix is to read `isError` and render an explicit
      retry state, or wrap the dashboard in an ErrorBoundary.
