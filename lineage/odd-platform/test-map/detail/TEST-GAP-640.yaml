proposed_action: |-
  Add `search_debounce_coalesces_keystrokes_and_handles_clear_race` to `PolicyList.test.tsx`. Use Jest fake timers; simulate 6 rapid keystrokes in the search input; advance timer 499ms; assert ZERO `fetchPolicyList` dispatches; advance timer 1ms (total 500ms); assert ONE dispatch with the final query. Then clear the input within 250ms (before debounce fires); advance timer 250ms (debounce fires with stale query); advance timer 1 tick (the effect fires with no query); assert TWO dispatches with the explicit ordering. Pair with `enter_key_bypasses_debounce` if Enter is meant to immediately fire (note: per sidecar the trailing-edge debounce wraps everything, so Enter actually does NOT bypass — pin the current contract).
