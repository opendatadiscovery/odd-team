cross_pillar_relationships:
- pillar_id: P-01
  kind: feeds_from
  via: |-
    Attachments (files + links) are operator/user-curated artefacts
    attached to Data Entities — they are surfaced on the Data Entity
    detail page (Overview tab) for any audience. F-027 is the
    Management surface (LSN-001 canonical home — storage strategy
    selection + LOCAL ephemeral / REMOTE persistent + chunk staging);
    F-001's per-entity Overview tab is the read-side. Cross-link to
    F-001 / F-004 (the read render path; F-004 XSS family applies to
    link URLs).
- pillar_id: P-04
  kind: shares_data_with
  via: |-
    Attachments include files that may contain DQ test report PDFs or
    sample data CSVs — the Data Quality pillar is a downstream consumer
    of operator-uploaded attachment context. The cross-link is informal
    today (no enforced linkage) but operationally common.
- pillar_id: P-09
  kind: feeds
  via: |-
    DATA_ENTITY_ATTACHMENT_MANAGE is the permission gating the 7
    mutation endpoints; it lives on the DATA_ENTITY resource scope.
    The mutation endpoints discard the URL's data-entity-id and act on
    file-id / link-id directly — a user authorized on entity A can
    mutate entity B's attachments by spoofing the URL. Cross-link to
    F-006 RBAC + F-019 audit-silence.
