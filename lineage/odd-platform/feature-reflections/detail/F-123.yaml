- id: H-006
  hypothesis: "When a Collector or DataSource is deleted, its issued token is invalidated / cleaned up (the operator expects deleting the resource to retire its credential)."
  derivation: "Token lifecycle expectation — a credential should not outlive the resource it authenticates; an orphaned live secret is a security smell."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Neither the Collector nor the DataSource soft-delete touches the TOKEN row. The
      `token` table has NO `deleted_at` column (V0_0_28:1-9) and there is NO janitor / no
      cleanup query. `DataSourceServiceImpl.delete` is a soft-delete of `data_source` with
      NO `tokenRepository.delete(tokenId)` (PLT-087 confirms this is a known gap). The
      orphaned TOKEN row persists indefinitely with its 40-char plaintext value intact
      (`ReactiveCollectorRepositoryImpl` invariant 2/3: TOKEN.value is plaintext at rest,
      no hashing). The live Management doc independently confirms: "Soft-deleted Collectors
      leave their TOKEN row orphaned … retired Collector tokens persist in the table
      indefinitely."
    evidence:
      - sidecar: "ReactiveCollectorRepositoryImpl.md"
        section: "invariants[1][2][3]"
        cite: "V0_0_28__add_token.sql:1-9 (token has no deleted_at) + ReactiveCollectorRepositoryImpl.java:94 (plaintext token equality)"
        note: "TOKEN outlives its soft-deleted parent; plaintext credential persists."
      - sidecar: "ReactiveDataSourceRepositoryImpl.md"
        section: "bugs_limitations_corner_cases (token regenerate, no recovery)"
        cite: "DataSourceServiceImpl.java:99-106 + V0_0_28 (no grace period / no deleted_at)"
        note: "Datasource-side: same orphan; regenerate mutates in place (no grace)."
    operator_visible_failure: |
      (1) A retired collector's 40-char plaintext token remains valid-shaped and present
      in the `token` table forever — a credential the operator believes they retired is
      still at rest (replica/backup/pg_dump exposure surface). (2) For Datasources, the
      orphaned token + uncleared FTS vector (PLT-087) are operator-invisible residue.
      (3) Token *regeneration* destroys the prior secret in-place with NO grace period
      (`ReactiveDataSourceRepositoryImpl` corner-case) — a collector that hasn't picked up
      the new token 401s immediately, so rotation and deletion both have surprising
      credential side-effects.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional
