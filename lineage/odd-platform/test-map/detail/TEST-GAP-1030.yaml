proposed_action: |-
  Two-test approach. **Test 1** — Compile-time reflection test verifying `GenAIProperties.class.getDeclaredFields()` has length 3 and contains exactly `enabled`, `url`, `requestTimeout`. Pin the current absent-surface contract. When the maintainer adds an `auth` field (REFACTOR-NNN), the test breaks deliberately and forces re-authoring with the new contract. **Test 2** — `@SpringBootTest` + WireMock for the genai backend; configure WireMock to require `Authorization: Bearer test-token` AND respond 401 if absent; drive `POST /api/genai/ask`; assert HTTP 500 from GenAIController (because the upstream 401'd). Demonstrates the proxy-required posture; pins the gap so a future credential-injection feature lands with full coverage.
