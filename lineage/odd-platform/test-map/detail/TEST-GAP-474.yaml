proposed_action: |-
  Testcontainers integration test. (1) Configure auth.type=OAUTH2 with a stub IDP. (2) Authenticate as a new user 'bob' with NO existing user_owner_mapping row. (3) Issue GET /api/dataentities/my. (4) Assert HTTP 200 with body == [] (empty list). (5) Assert NO 401/403, NO log warning, NO header X-Onboarding-Required. The test EXPOSES the silent-empty contract; the fix is either auto-create-on-first-login OR a structured 'no association' response code that the UI can render as a banner.
