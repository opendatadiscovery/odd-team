  - "DOC-NNN candidate: document the silent-204 idempotence + always-fire activity-event semantics"
proposed_action: |-
  Service-tier Mockito test (avoids the META trap from TEST-GAP-491). (a) Mock termRelationsRepository.deleteRelationWithDataEntity to return Mono.empty() (no row deleted). (b) Mock TermAssignmentActivityHandler to capture BEFORE/AFTER state. (c) Invoke TermServiceImpl.removeTermFromDataEntity(termId, dataEntityId). (d) Assert no error emitted (silent success). (e) Verify the handler is invoked TWICE (BEFORE + AFTER) with identical states. (f) Test comment 'LOCKS the silent-204 idempotence + always-fire activity-event audit-noise contract.' Bridge test (integration-tier, outside integration-test profile): assert the activity table grows by 1 row even on no-op DELETE.
