axes_present:
  - controllers
  - services
security_aggregate:
  overall: MEDIUM
  auth_modes_relevant: [LOGIN_FORM, OAUTH2, LDAP, DISABLED]
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      3 of 13 endpoints gated; the other 10 fall through to .authenticated().
      The 3-of-13 asymmetry is intentional (read-collaborative posture for
      reads + search-as-public-to-authenticated for facets) but
      under-documented.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The 3 gated endpoints check QUERY_EXAMPLE_* permissions but do NOT
      filter by Owner — a holder of QUERY_EXAMPLE_UPDATE can update any
      example owned by anyone.
  strengths:
    - 3 mutating endpoints gated with documented permissions
  weaknesses:
    - F-004 stored-XSS family 4th surface — HIGH
    - 10 of 13 endpoints have no RBAC — read-collaborative posture
      exposes SQL bodies cross-owner
    - cross-owner edit possible within the QUERY_EXAMPLE permission scope
    - search-session UUID-only ownership
  contributing_files:
    - QueryExampleController.md
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'getQueryExampleDetails 3-step fan-out — QueryExampleController.md'
    - 'by-dataset / by-term 5-jsonArrayAgg JOIN unpaginated —
      QueryExampleController.md'
    - 'getQueryExampleSearchSuggestions FTS-ranked GIN index lookup —
      QueryExampleController.md'
  scaling_shape:
    verdict: UNPAGINATED
    detail: by-dataset and by-term endpoints hard-code hasNext=false
  contributing_files:
    - QueryExampleController.md
notes: |-
  This operation entry captures the 13-endpoint surface of the Query Example
  CRUD + Faceted Search operations. The 4 remaining permission-bearing
  endpoints (linkage on DataEntityController + TermController) are
  captured in the cross-controller-permission-split-batch-v-pattern invariant.

  Cross-cutting connections:
    - Entity: query-example.yaml (the entity entry)
    - Companion invariant: cross-controller-permission-split-batch-v-pattern
    - Companion invariant: f-004-stored-xss-extends-to-query-example-fourth-markdown-surface
    - F-006 audit-silence: QueryExampleServiceImpl no @ActivityLog
    - LSN-018 finding: operationId plural-but-singular ('createQueryExamples'
      creates one example)
