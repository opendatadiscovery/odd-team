mitigations_unimplemented:
  - |-
    SIMPLE FIX A (controller-tier defence): add `Cache-Control:
    no-store` + `X-Sensitive-Body: true` response headers to the
    4 endpoints that return plaintext tokens (CollectorController.registerCollector +
    .regenerateCollectorToken + DataSourceController.registerDataSource +
    .regenerateDataSourceToken). Signals to intermediate components
    (reverse proxies, gateways, APMs) that the body is sensitive.
    Doesn't eliminate the plaintext-on-the-wire; reduces accidental
    caching / logging.
  - |-
    Add @ReactiveTransactional to DataSourceServiceImpl.regenerateDataSourceToken
    (line 98). One-line fix; makes the partial-rotation race
    impossible. Consistent with the surrounding @ReactiveTransactional
    methods (create line 52, update line 69, delete line 86).
  - |-
    SIMPLE FIX B (coordinated multi-layer hashing — same as master
    invariant): introduce token hashing across ALL SIX layers
    (now including the HTTP response). The fix at the response-body
    layer means returning the plaintext ONCE (at register / regenerate)
    for operator capture, then hashing for all subsequent reads.
    Cross-link to the master invariant's mitigations_unimplemented.
  - |-
    Regression test for the controller-tier plaintext + response
    headers: after fix A, assert response.headers contains
    'Cache-Control: no-store' for the 4 register/regenerate
    endpoints; assert response.body still contains the plaintext
    token (for operator capture).
  - |-
    Update the /configuration-and-deployment/enable-security/authentication/server-to-server
    live page with the controller-tier exposure + the response-header
    mitigation. Operator-facing text on the threat model: 'When
    a Collector or Data Source registers or rotates a token, the
    new token value is returned in the HTTP response body. Operators
    must ensure (1) TLS-only transport between platform and clients
    consuming this response, (2) intermediate components do not
    log response bodies for the affected paths.'
  - |-
    Add the response-header check to a build-time scanner —
    enumerate every controller endpoint that returns sensitive
    content (Token, Credential, Password). Verify the endpoint
    sets appropriate response headers. The four token-returning
    endpoints would be caught + the broader inventory across the
    platform would be uncovered.

notes: |-
  This invariant is the CONTROLLER-TIER CLOSURE of the existing
  master collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain.
  Previous batches established 5 tiers (write @ service, verify @
  filter, persist @ repo, schema @ migration, UI @ DOM); this batch
  adds the 6th vertex (controller @ HTTP response body) and broadens
  the framing from Collector-only to Collector+DataSource (same
  TOKEN table, same plaintext, same risk).

  The picture's load-bearing observation: the HTTP RESPONSE BODY is
  itself an exposure surface. The platform's documented threat
  model focuses on the database (where the token is stored), the
  UI (where it's rendered), and the wire (TLS-protected). The
  HTTP response BODY is at the boundary between server and UI —
  a region the operator's threat model often overlooks. Reverse
  proxies, API gateways, APM tools all sit in this region; all
  can be configured to log response bodies; all carry the
  credential.

  Cross-cutting connections:
    - STRENGTHENS the master collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
      (adds Tier 1 + the DataSource broadening + the response-header
      surface as a NEW exposure point)
    - STRENGTHENS collector-token entity concept (adds the
      controller-tier framing of the plaintext-everywhere posture)
    - Pairs with plaintext-equality-shared-secret-token-model (the
      filter-tier WRITE/VERIFY pair — this invariant closes the
      WRITE end at the controller tier)
    - Pairs with datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation
      (THIS BATCH sibling — the DataSource token surfaces at this
      controller; same plaintext-everywhere risk as the Collector
      token)

  Two DOC-NNN candidates:
    (a) /configuration-and-deployment/enable-security/authentication/server-to-server
        — explicit text on the controller-tier exposure + the
        recommended mitigations (TLS-only, disable response-body
        logging, Cache-Control headers)
    (b) Operator playbook for incident response on a leaked token —
        the rotation contract (in-place UPDATE, no grace window) +
        the audit-log absence (no record of who rotated when) means
        incident response is hard; the playbook needs explicit
        steps for token revocation + collector restart
