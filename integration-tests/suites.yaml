# Named integration-test suites — each a list of IT-NNN protocols run together.
# Maps to test-plan.md integration batches I1-I10. Run: integration-tests/run-suite.sh <name>
# Protocols are authored (Step 3) by copying TEMPLATE.md → protocols/IT-NNN-*.md and
# adding the id to the relevant suite below.

suites:
  smoke:
    description: "Framework canary — proves the stack + protocol + log loop end-to-end."
    protocols: [IT-001]

  feature-complete:
    description: "The GREEN-target regression suite — the odd-minimal-stack e2e + api specs, run in ONE fast playwright pass against the single global-setup stack; everything here passes GREEN. Excludes (a) known-open-bug pins → `known-bugs`, and (b) the DOCKER-CHURNING multi-stack specs (each brings up its OWN separate stack — MinIO/LOGIN_FORM/LDAP/notifications) → the `multi-stack` suite + the I1/I2/I3 batches. Bundling those into one playwright run made it a ~7-min, abort-prone churn (2026-06-07); they now run in their own suite. Run alongside the unit suite (scripts/run-platform-tests.sh)."
    # All odd-minimal-stack specs (no per-spec docker bring-up). The 7 multi-stack specs that DO bring up their own
    # stack — IT-008 (MinIO), IT-009 (LOGIN_FORM), IT-010 (LDAP), IT-011/012 (notifications WAL), IT-123 (LOGIN_FORM),
    # IT-124 (LDAP) — moved to the `multi-stack` suite below + their I-batches (run those separately).
    protocols: [IT-001, IT-002, IT-005, IT-013, IT-014, IT-015, IT-016, IT-017, IT-018, IT-019, IT-020, IT-021, IT-022, IT-023, IT-024, IT-025, IT-026, IT-027, IT-028, IT-029, IT-030, IT-031, IT-032, IT-033, IT-034, IT-035, IT-036, IT-037, IT-038, IT-039, IT-040, IT-041, IT-042, IT-043, IT-044, IT-045, IT-046, IT-047, IT-048, IT-049, IT-050, IT-051, IT-052, IT-053, IT-054, IT-055, IT-056, IT-057, IT-058, IT-059, IT-060, IT-061, IT-062, IT-063, IT-064, IT-065, IT-066, IT-067, IT-068, IT-069, IT-070, IT-071, IT-072, IT-073, IT-074, IT-075, IT-076, IT-077, IT-078, IT-079, IT-080, IT-081, IT-082, IT-083, IT-084, IT-085, IT-086, IT-087, IT-088, IT-089, IT-090, IT-091, IT-092, IT-093, IT-094, IT-095, IT-096, IT-097, IT-098, IT-099, IT-100, IT-101, IT-102, IT-103, IT-104, IT-105, IT-106, IT-107, IT-108, IT-109, IT-110, IT-111, IT-112, IT-113, IT-114, IT-115, IT-116, IT-117, IT-118, IT-119, IT-120, IT-121, IT-122, IT-125, IT-126, IT-127]
