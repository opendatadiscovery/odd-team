mitigations_unimplemented:
  - |-
    Fix surface 1 (preferred) — extend alerts.slice with per-
    alert userCanResolve booleans populated at list-fetch time
    via fetchResourcePermissions parallel-batched. ~30 lines;
    closes the bug AND removes the click-time round-trip.
  - |-
    Fix surface 2 (lazy-resolve with disabled button) — show
    button as disabled with tooltip until permission resolves
    in the background. ~15 lines; moderate improvement.
  - |-
    Fix surface 3 (architectural) — promote RESOLVE to a global
    permission. Requires SecurityConstants + role-definition
    audit; out of UI scope.
  - |-
    Fix surface 4 (doc-only) — document the click-then-deny
    shape on the live Alerts doc page. LOW-cost compliance fix.
notes: |-
  NEW invariant captured in batch ZL (2026-05-26) FINAL refresh.
  This is a different shape from the partial-permission-gating
  invariant (which captures 'edit button gated, content
  unconditional' — the more common case). This invariant
  captures 'button unconditional, action permission-checked on
  click' — a class observed first at AlertItem.tsx but worth
  auditing other per-row action surfaces (DataEntityActions,
  TermActions, OwnerActions) for the same shape.

  Cross-batch follow-up: the pattern 'late-binding permission
  check' suggests an architectural anti-pattern that may exist
  at multiple sites. A grep for `fetchResourcePermissions` in
  odd-platform-ui would enumerate all instances; each is a
  candidate for the same UX leak.
