name: Data Quality Test
canonical_in_docs: true
canonical_candidate: false
description: |-
  Per-dataset data-quality test entity — the unit of operator-visible quality
  signal in Pillar P-04. ODD is an AGGREGATOR (per documentation/docs/data-quality.md
  line 9) — quality checks are NOT performed inside ODD; the platform integrates
  with external test frameworks (Great Expectations, dbt, custom push adapters)
  and surfaces their results. **NEW entity, batch 2026-05-20T (DataQualityController
  class sidecar)** — formalises the entity at the concept catalog layer.

  Read surface: GET /api/datasets/{data_entity_id}/dataqatests returns a
  DataEntityList of test entities for the dataset (DataQualityController.java:25-31).
  Aggregate read surface: GET /api/datasets/{data_entity_id}/test_report returns
  a DataSetTestReport (counts per status: success / failed / aborted / skipped /
  broken / unknown). Mutation surface: PUT /api/datasets/{data_entity_id}/dataqatests/{dataqa_test_id}/severity
  assigns operator-curated severity (MINOR / MAJOR / CRITICAL) — the lone
  owner-scoped (gated via DATASET_TEST_RUN_SET_SEVERITY) endpoint among the
  five DataQualityController routes.

  vocabulary_status: codebase-anchored + doc-side-covered (live
  https://docs.opendatadiscovery.org/features/data-quality and
  https://docs.opendatadiscovery.org/features/data-quality/test-results-import
  + https://docs.opendatadiscovery.org/features/data-quality/sla-statuses all
  WebFetched 2026-05-20 status 200; the entity is named verbatim as
  "data quality test" / "DQ test"; the live doc explicitly states the
  "Test reports" tab as the per-entity surface backed by the read endpoints
  THIS entity surfaces).
vocabulary_status: codebase-anchored, doc-side-covered
axes_present:
- controllers
- openapi_tags
