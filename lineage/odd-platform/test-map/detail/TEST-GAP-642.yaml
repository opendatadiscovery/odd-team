behaviour: |-
  **SOFT-DELETED POLICIES STILL RENDERED IN ROLE CHIP LIST (UI manifestation of F-006 `role_repo_left_join_no_policy_deleted_at_filter_mirror`).** `RoleItem.tsx:42-48` renders `policies.map(policy => policy.name)` for each Role row. The underlying `getDto/listDto` LEFT JOIN against `policy` has NO `policy.deleted_at IS NULL` predicate (`ReactiveRoleRepositoryImpl.java:45-48, 67-70, 87-90`) per the batch-N invariants[1] + F-006 drift_class `role_repo_left_join_no_policy_deleted_at_filter_mirror`. So a Role whose Policy has been soft-deleted but whose `role_to_policy` edge survives will still render the deleted Policy's NAME in the per-row chip list, with no indication that the Policy is gone. The PolicyList tab will show the policy as GONE; the RolesList tab will show the same policy STILL ATTACHED to roles — operators investigating "which roles use Policy X" via the Roles tab will believe the binding is live. No test exists at any layer for this drift. The integration scenario: (a) seed Role 7 with Policy 99 via `role_to_policy`; (b) soft-delete Policy 99 via direct DB UPDATE; (c) render RolesList; assert the Role 7 row's policies chip array STILL contains Policy 99's name. This is the UI half of the cross-layer drift; combined with TEST-GAP-637 (PolicyList catalogue-vs-grant) it surfaces a TWO-WAY differential render that breaks operator audit reasoning.
