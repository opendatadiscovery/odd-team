proposed_action: |-
  WebFluxTest. (a) POST /api/dataentities/X/data_entity_group with body `{}` (no data_entity_group_id field). (b) Assert HTTP 400 with response body containing 'is not manually created DEG' and 'null' (current contract). (c) Repeat with body `{"data_entity_group_id": null}`. (d) Assert same response. (e) Test comment 'LOCKS the null-data_entity_group_id error UX as of 2026-05-19. When REFACTOR-NNN adds `required: [data_entity_group_id]` to components.yaml, this test FLIPS to expect 400 from OpenAPI-validation tier with a message like data_entity_group_id is required.'
