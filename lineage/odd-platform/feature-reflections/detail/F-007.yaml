- id: H-003
  hypothesis: "When Prometheus retries the same AlertManager webhook (its standard behaviour on a transient network error), the platform de-duplicates so the operator sees ONE alert, not N copies."
  derivation: "Endpoint-shape + robustness: a webhook receiver for an at-least-once producer (Prometheus) should be idempotent; a senior PO expects retries not to multiply the operator's alert list."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The AlertManager path is NOT idempotent. handleExternalAlerts deliberately skips
      AlertActionResolver (the application-level de-dup the in-platform ingestion path uses at
      AlertServiceImpl.java:222-227), and the shared createAlerts helper issues bulk
      INSERT ... RETURNING with NO .onConflict(...) clause (ReactiveAlertRepositoryImpl.java:332-342).
      AlertUniqueConstraint.fromAlert de-duplicates only WITHIN a single batch (AlertServiceImpl.java:187),
      not across POSTs. Each Prometheus retry of the same group creates a fresh ALERT row. There is
      also no cross-batch lookup against an existing OPEN alert of the same (entity_oddrn, type), so
      AlertManager's repeat_interval re-sends also accumulate duplicates.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveAlertRepositoryImpl.md
        section: bugs_limitations_corner_cases[2]
        cite: "ReactiveAlertRepositoryImpl.java:332-342"
        note: "INSERT ... RETURNING, no ON CONFLICT; the SQL-level idempotency gap"
      - sidecar: odd-platform__java__service__service__AlertServiceImpl.md
        section: invariants (handleExternalAlerts SKIPS AlertActionResolver) + performance.known_performance_gaps[1]
        cite: "AlertServiceImpl.java:151-191 vs 222-227"
        note: "the de-dup asymmetry — webhook path bypasses the resolver the ingestion path uses"
    operator_visible_failure: |
      Every transient network blip between AlertManager and ODD multiplies the operator's alert
      list. A steward reviewing /alerts/all sees the same anomaly N times with no way to tell
      they are retries; the burst also fans out N copies through F-009 to Slack/email. Combined
      with the unauthenticated path, an attacker can deliberately induce duplication to bury real
      alerts. The live doc now warns about this; the code gap remains.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
    test_demand_note: "missing-functional: an integration test POSTing the same payload twice and asserting alert row count == 1 (the intended idempotent behaviour). The regression guard for PLT-014 Defect 3; until the fix lands, a characterization test pinning count == 2 documents the current bug."
    dedup_note: "ALREADY TRACKED as PLT-014 Defect 3 (ON CONFLICT / idempotency-key)."

- id: H-004
  hypothesis: "When an alert's chunk description contains a Prometheus generatorURL, clicking that URL in the ODD alerts UI takes the operator to a safe Prometheus query — the platform does not render an attacker-controlled javascript: or arbitrary-host URL."
  derivation: "Response-shape + security: the generatorURL is user/external-supplied and rendered back as clickable text; a senior PO expects the rendered surface to be sanitised."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The generatorURL is parsed via UriComponentsBuilder.fromUri(...) (AlertServiceImpl.java:168),
      which validates URI shape but does NOT constrain the scheme — javascript: passes. It is then
      embedded verbatim into the chunk description via String.format("Distribution Anomaly. URL: %s",
      queryUrl) (line 185). The description is read back on the alert read paths and rendered in the
      UI. There is no scheme allow-list at the controller boundary, the service, or (per the Alerts
      sidecar) a sanitised renderer guaranteed on the description field. Combined with the
      unauthenticated webhook, any caller plants the payload; combined with the cross-owner read,
      every authenticated user sees it — a stored-XSS / open-redirect surface.
    evidence:
      - sidecar: odd-platform__java__AlertManagerController__controller-method__postAlerts.md
        section: bugs_limitations_corner_cases[5] + security.data_exposure[2]
        cite: "ExternalAlert.java:13 (URI, no scheme constraint) + AlertServiceImpl.java:168, 185"
        note: "URI shape-only; embedded verbatim in the rendered description"
      - sidecar: odd-platform__ts__react-component__component__Alerts.md
        section: security.data_exposure
        cite: "AlertItem.tsx:86 (chunk/description render surface)"
        note: "alert payload incl. alertChunkList rendered to any authenticated user on the All tab"
    operator_visible_failure: |
      A forged alert whose generatorURL is javascript:... or a phishing host renders as a clickable
      link in the alerts UI that any authenticated user (anonymous under DISABLED) may click —
      stored XSS or an open redirect that inherits the trust of "the ODD platform showed me this
      link". The live doc warns about the surface; the code gap remains.
    severity: HIGH
    confidence: MEDIUM
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    test_demand_note: "missing-functional: a service-tier test asserting a javascript:-scheme generatorURL is rejected/sanitised at ingestion (PLT-014 Defect 2 regression guard) + a UI render-sink test on AlertItem.tsx. Blocked on the validation_gap (exact render mechanism unpinned)."
    dedup_note: "ALREADY TRACKED as PLT-014 Defect 2 (scheme allow-list + UI sanitisation). Confidence MEDIUM because the exact UI render path of the description (innerHTML vs text node) is not pinned in an enriched AlertItem render sidecar — the XSS upper-bound depends on it."

- id: H-005
  hypothesis: "When AlertManager sends an alert with status=resolved (its standard 'this anomaly is over' signal), ODD marks the corresponding alert RESOLVED."
  derivation: "Doc-claim / endpoint-shape: AlertManager's wire format carries status (firing|resolved); a senior PO integrating Prometheus expects ODD to honour the resolve signal so the alert auto-closes."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The platform never sees the field. The inbound DTOs are hand-rolled and lossy: AlertManagerRequest
      carries only List<ExternalAlert> (AlertManagerController.java:28-32), and ExternalAlert carries
      only labels, generatorURL, startsAt (ExternalAlert.java:9-15). The AlertManager v2 wire fields
      status, endsAt, annotations, fingerprint, groupKey, etc. are all silently dropped by Jackson on
      deserialisation. The most operationally-impactful drop is status: resolved — every inbound alert
      is created OPEN (AlertServiceImpl.java:179) and there is no path that consumes a resolved signal.
      An AlertManager-driven alert can only be resolved manually in the ODD UI or auto-resolved by the
      in-platform ingestion path, never by AlertManager's own resolve.
    evidence:
      - sidecar: odd-platform__java__AlertManagerController__controller-method__postAlerts.md
        section: bugs_limitations_corner_cases[4]
        cite: "AlertManagerController.java:28-32 + ExternalAlert.java:9-15"
