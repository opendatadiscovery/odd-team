      OwnerPojo().setName(name))). An unseen name is minted into the directory and the request
      proceeds (PENDING on branch A, auto-approved on branch B). So even a permission-less user
      on the PENDING path mints an Owner row merely by typing a novel name — the row persists
      regardless of whether the PENDING request is ever approved.
