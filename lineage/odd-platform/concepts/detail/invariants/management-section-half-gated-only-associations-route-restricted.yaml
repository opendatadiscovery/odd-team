security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      Among 9 Management sub-routes, exactly 1 is route-gated
      (Associations via RestrictedRoute). 8 others either wrap in
      WithPermissionsProvider (which seeds context but does not block)
      or are bare. The Integrations sub-route lacks even the
      WithPermissionsProvider — its inner hasAccessTo checks fall
      through to the outer Management.tsx context whose permission
      set is just [OWNER_ASSOCIATION_MANAGE].
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Every list (NamespaceList, OwnersList, RolesList, PolicyList,
      DataSourcesList, CollectorsList, TagsList) fetches on mount
      with no per-current-user predicate. The catalog is cross-owner
      by design (read-collaborative posture per REFACTOR-024).
  strengths:
    - |-
      The Associations sub-route IS structurally gated (RestrictedRoute
      with redirect to /management/namespaces) — the safety case for
      the most-sensitive surface (the user-owner mapping approval
      inbox) is correctly applied.
    - |-
      The backend's per-mutation @PreAuthorize / SecurityRule pattern
      catches every WRITE attempt at the controller layer regardless
      of UI state — so the UI's permissive route posture does not
      enable arbitrary mutations.
  weaknesses:
    - |-
      An operator reading the docs (Authorization parent page lists
      Policies / Permissions / Roles / Owners / Associations as
      admin concepts) forms the mental model 'Management is
      admin-only'. The code reveals any-auth read across 8 of 9
      sub-areas — INCLUDING Policies (where the policy JSON
      definitions are visible) and Roles (where role-to-policy
      mapping is visible). This is exactly the
      partial-permission-gating semantic, surfaced at the section
      level rather than the page level.
    - |-
      The Integrations sub-route's missing WithPermissionsProvider is
      a SECOND-order bug: any descendant component that consults
      usePermissions for an integration-specific permission gets
      stuck against the outer OWNER_ASSOCIATION_MANAGE context. If
      this manifests as broken-closed (admin user cannot Edit) the
      operator sees no Edit button despite having permission; if
      broken-open (any user can see a sensitive integration form
      that should be gated) it leaks.
    - |-
      Live docs have NO Management UI page — the largest admin
      surface in the SPA (9 sub-areas, ~10 list+form+detail
      components) is entirely undocumented. An operator wanting to
      understand 'who can see what' has no doc reference.
  cross_file_inconsistencies:
    - |-
      management route sidecar is the sole contributor — single-file
      finding. No cross-file inconsistency surfaced. Consistent with
      ManagementRoutes.tsx + Management.tsx + WithPermissionsProvider
      sources cited inside the management sidecar.
