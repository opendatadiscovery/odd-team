discovered_from_entry_point: |-
  config-class:SchedulingConfiguration — boot-time @EnableScheduling +
  @EnableSchedulerLock setup. Four background jobs (housekeeping every 15min,
  status-switch every 10min, partition-creation cron daily 00:01,
  session-housekeeping every 1h) all run on Spring Boot's default
  TaskScheduler with `poolSize=1`. No `@Bean TaskScheduler` declaration
  anywhere overrides this default; no `spring.task.scheduling.pool.size`
  in `application.yml` either.
