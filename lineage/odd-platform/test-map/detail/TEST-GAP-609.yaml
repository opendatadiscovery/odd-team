proposed_action: |-
  Reflection-based unit test. (a) Assert the `webClient` field is `private final` and initialised at field declaration (not injected via constructor). (b) Reflect to confirm the WebClient instance is NOT obtained from a Spring-managed `WebClient.Builder` bean. (c) Pin the field-init pattern. Future REFACTOR introducing constructor-injected WebClient.Builder flips this test deliberately.
