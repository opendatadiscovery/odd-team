notes: |-
  NEW invariant captured in batch ZL (2026-05-26) FINAL refresh.
  This is a low-severity clarity invariant; recorded primarily
  to anchor the navigation taxonomy. The Data Modelling pillar
  is one of the smaller pillars (two features); the navigation
  hierarchy is shallow but non-obvious. A peer-tab redesign
  would not improve information density but would lose the
  Relationships' ALL/ERD/Graph filtering capability.
