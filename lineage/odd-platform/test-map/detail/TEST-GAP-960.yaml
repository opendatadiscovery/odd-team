behaviour: |-
  **CRITICAL — Slack's at-least-once delivery guarantee combined with the absence of any idempotency key, unique constraint, or replay-detection mechanism in `EventApiController` → duplicate Slack deliveries silently amplify into N rows in `message_provider_event` and N materialised child `message` rows.**

  Slack documents at `https://api.slack.com/apis/events-api#retries` (WebFetched 2026-05-25): 'If we don't receive an HTTP 2xx response within 3 seconds, we'll retry once. If we still don't get a 2xx, we'll continue retrying with exponential backoff for up to 3 times.' This means a single Slack event can legitimately arrive 1-4 times at `POST /api/slack/events`.

  **The four absent defences**:
  1. **No unique constraint on (provider, event_id)**: `V0_0_59__data_collaboration.sql:25-39` creates `message_provider_event` with `(id UUID PRIMARY KEY, message_id BIGINT, state TEXT, event TEXT, created_at TIMESTAMP)` — there is no column storing Slack's `event_id` and no UNIQUE constraint enforcing one-shot delivery semantics.
  2. **No application-level idempotency key**: `DataCollaborationServiceImpl.enqueueMessageEvent` inserts an unconditional new row each time `EventApiController` calls it; the row's `id` is a freshly-generated UUIDv1 (no relation to the inbound event's `event_id`).
  3. **No replay-detection window**: there's no in-memory or in-DB sliding-window deduplication (e.g. 'I've seen this event_id in the last 5 minutes; drop it').
  4. **No header-based dedup**: Slack sends `X-Slack-Retry-Num` and `X-Slack-Retry-Reason` headers on retried deliveries (Slack's docs verbatim); the controller reads neither (verified by Grep `X-Slack-Retry|x-slack-retry` against `/home/raman/work/odd/odd-platform/odd-platform-api/src/main/java/`: 0 hits 2026-05-25).

  **Concrete failure mode** (the sidecar's example): same Slack `event_id` arriving 4 times → 4 rows inserted into `message_provider_event` → `DataCollaborationMessageEventProcessor` (leader-elected, single-threaded consumer) materialises 4 child `message` rows → the Discussions UI displays the same thread-reply 4 times.

  **Operator-visible consequence**:
  - Discussions tab UX: duplicates render side-by-side; the user thinks Slack double-posted.
  - Forensics: `message_provider_event` table grows 4× for chatty workspaces — wastes disk, slows the leader-elected consumer.
  - Audit: combined with TEST-GAP-959 (no signature verification), an attacker can deliberately flood the system by replaying captured payloads — million-row amplification trivial.

  **Why CRITICAL**: this is a P-07 data-integrity vulnerability that operators cannot detect without manual inspection of the database. The Slack at-least-once contract is documented; the platform's failure to honour it is not. Without a regression-pin test, a future "optimisation" that further weakens dedup (or a Slack API upgrade that changes retry semantics) ships silently.
