behaviour: |-
  **MEDIUM — `clearTableFiltersAtom` and `clearTestFiltersAtom` (`DataQualityStore.ts:44-66`) are the only thing keeping the tables-side and tests-side filter blocks INDEPENDENT. They are write-only mirror atoms: `clearTableFiltersAtom` resets exactly the five `de*` keys (deNamespaceIds, deDatasourceIds, deOwnerIds, deTitleIds, deTagIds) to `[]` while spreading the test-side keys unchanged; `clearTestFiltersAtom` is the exact mirror. A regression that swaps a key family (e.g. accidentally resets `namespaceIds` in `clearTableFiltersAtom`) breaks the independence the live `dashboard.md` doc explicitly advertises: "The two filter sets are independent — you can hold the tables-side filter at one slice and the tests-side at another."**

  **The contract** (statically certain):
  - `clearTableFiltersAtom`: `atom(null, (get, set) => set(formFiltersAtom, prev => ({...prev, deNamespaceIds:[], deDatasourceIds:[], deOwnerIds:[], deTitleIds:[], deTagIds:[]})))` (`DataQualityStore.ts:44-54`).
  - `clearTestFiltersAtom`: same shape, resets `namespaceIds`, `datasourceIds`, `ownerIds`, `titleIds`, `tagIds` (`DataQualityStore.ts:56-66`).
  - Wired to the "Clear" buttons inside the two filter blocks at `DataQualityFilters.tsx:64-68` (tables) and `DataQualityFilters.tsx:79-83` (tests).

  **What can silently break**:
  - Copy-paste swap: a maintainer adds a 6th sub-filter and copy-pastes one of the two clear atoms, accidentally writing to the wrong key family.
  - Spread loses a key: `prev` is the 10-key `FormFiltersAtom`; if a maintainer rewrites with explicit key listing and misses one, that key is dropped (undefined) and the derived `filtersAtom`'s `Object.keys` iteration skips it forever after.
  - Cross-pillar inheritance: the test contract is also the operator-visible contract advertised in the live dashboard doc verbatim.

  **No test pins this**: the entire DataQuality subtree has zero tests.

  **Test gap shape**: trivial jotai unit test using `createStore()` from jotai. Setup: write a known shape into `formFiltersAtom`. Action: write `null` to `clearTableFiltersAtom`. Assert: the 5 `de*` keys are `[]`; the 5 non-`de*` keys retain their previous values. Mirror test for `clearTestFiltersAtom`.
