  - CollectorController.md:bugs_limitations_corner_cases.[7] (LOW — 200-vs-201 status-code drift)
notes: |-
  Pairs with regenerate-collector-token (the rotation operation).
  Pairs with collector-token entity concept.
  Pairs with collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
