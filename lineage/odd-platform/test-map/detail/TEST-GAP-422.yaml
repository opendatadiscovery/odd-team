gap_id: TEST-GAP-422
category: missing-edge-case
criticality: MEDIUM
node_ids:
  - "odd-platform ts react-component component:DataEntityDetails"
  - "odd-platform ts redux-thunk thunk:fetchDataEntityDetails"
pillars_affected: [P-01]
surfaced_by:
  - "DataEntityDetails.md:tests_coverage_semantic.uncovered_behaviours.[8]"
  - "DataEntityDetails.md:bugs_limitations_corner_cases.[1]"
  - "fetchDataEntityDetails.md:bugs_limitations_corner_cases.no-id-validation"
behaviour: |-
  Invalid-route-param NaN propagation — useDataEntityRouteParams() at routes/dataEntitiesRoutes.ts:53 calls parseInt(dataEntityId, 10) with no Number.isNaN guard; invalid route params (e.g. /dataentities/abc/overview) yield NaN which passes through into the fetchDataEntityDetails dispatch and travels to the backend as the literal string 'NaN'. The backend likely 404s but no client-side error is emitted at the source of the mistake. A test documents the gap; ideally the fix is a Number.isFinite guard at the component top with a NotFound redirect.
test_class: missing-edge-case
test_files_existing: []
test_files_proposed:
  path: "odd-platform-ui/src/components/DataEntityDetails/__tests__/DataEntityDetails.routeParam.test.tsx"
  name: "DataEntityDetails_invalidRouteParam_dispatchesNaN"
evidence:
  - "DataEntityDetails.md says: 'invalid route param :dataEntityId=abc yields NaN and the component dispatches fetchDataEntityDetails({ dataEntityId: NaN })' — uncovered_behaviours[8]"
  - "DataEntityDetails.md bugs_limitations_corner_cases.[1]: 'parseInt(dataEntityId, 10) with no Number.isNaN check'"
  - "fetchDataEntityDetails.md bugs_limitations_corner_cases.no-id-validation: 'No dataEntityId validation — the thunk's request envelope is { dataEntityId: number } but the route param comes from useDataEntityRouteParams which parses the URL. A negative or zero dataEntityId is passed through to the backend without a client-side guard.'"
cross_references:
  - "F-001"
proposed_action: |-
  Vitest test mounting under <MemoryRouter initialEntries={['/dataentities/abc/overview']}>; spy on dispatch; assert the dispatch payload contains NaN (documents current behaviour) OR — if the fix lands — assert a NotFoundPage renders without dispatch. Add edge-case for negative/zero ids.
