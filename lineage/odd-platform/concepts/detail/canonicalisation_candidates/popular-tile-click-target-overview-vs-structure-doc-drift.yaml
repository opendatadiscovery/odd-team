suggested_canonical_choice: |-
  Update the doc page `/features/data-discovery/catalog-overview` to say
  "Overview tab" (matching the implementation) AND surface the view_count
  side-effect of the Overview tab in the doc as well — operators
  understanding the Popular ranking deserve to know what triggers the signal.
suggested_add_to_docs: true
rationale: |-
  Code is the authority on user-observable behaviour; the doc-page claim is
  contradicted by the implementation file:line-anchored at DataEntityList.tsx:38
  + dataEntitiesRoutes.ts:66-73. Either the doc or the code must change — the
  code IS the F-001 loop closure mechanism, so the doc is the easier fix.

  This is a Cornerstone 2 (canonical vocabulary) finding: the docs use a term
  ("Structure page") that no longer matches the implementation; aliases must be
  logged or the doc updated.
