proposed_canonical: Read-collaborative cross-owner enumeration
rationale: '3-sidecar primary-source triangulated cross-cutting read-side posture
  from batch 2026-05-12E. Three first-class read surfaces (getAllAlerts batch A +
  getActivity batch B + search batch E) all share the same admin-path-without-admin-gate
  failure mode — fall-through to `.authenticated()`, no owner predicate, cross-owner
  data returned to any authenticated caller. Search is the WIDEST blast radius — the
  catalog enumeration vector. This IS the platform''s deliberate posture (ADR-CANDIDATE-003
  read-collaborative tradeoff) but is undocumented. HIGH-priority doc-extension: three
  live pages (`/features/alerts`, `/features/active-platform-features/activity-feed`,
  `/features/data-discovery/search`) need explicit ''Who can see this'' sections naming
  the read-collaborative stance.'
contributing_concepts:
- getAllAlerts.security.known_security_gaps.[0] (cross-owner alerts list HIGH, batch
  A)
- getActivity.security.known_security_gaps.[0] (global activity cross-owner HIGH,
  batch B)
- search.security.known_security_gaps.[0] (catalog-wide cross-owner enumeration HIGH,
  batch E)
- ADR-CANDIDATE-003 (read-collaborative borderline) — now 3-sidecar STABLE pattern
suggested_add_to_docs: true
