proposed_action: |-
  Add `TagDirectoryAuditSilenceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `createTag_producesZeroActivityEntries_pinsAuditSilence` — register an ActivityEventEmitter mock; POST `/api/tags` with valid form; assert ZERO Activity invocations.
  2. `updateTag_producesZeroActivityEntries_pinsAuditSilence` — sister on update.
  3. `deleteTag_producesZeroActivityEntries_pinsAuditSilence` — sister on delete.
  4. `perEntityTagAssignment_producesTagAssignmentUpdatedActivity_pinsExistingAuditOnAssignmentPath` — POST `/api/dataentities/{id}/tags` (the per-entity path); assert TAG_ASSIGNMENT_UPDATED IS emitted. PIN the asymmetry — the per-entity path IS audited, the directory path is NOT.
  5. `activityEventTypeDtoEnum_doesNotContainTagCreatedOrTagUpdatedOrTagDeleted_pinsSchemaLevelAbsence` — use reflection to enumerate `ActivityEventTypeDto`'s values; assert NONE of {TAG_CREATED, TAG_UPDATED, TAG_DELETED} are present. PIN the schema-root cause — even if a maintainer wanted to add `@ActivityLog`, the right enum values don't exist.

  Pair with REFACTOR-NNN: add the three enum values to `ActivityEventTypeDto` + add `@ActivityLog(event = TAG_CREATED|UPDATED|DELETED)` annotations to TagController's 3 mutating methods. When the fix lands, tests #1-#3 invert.

  Cross-pair with DOC-NNN: surface the audit-log absence on the Tagging doc + Activity Feed doc; explain the tier-1 vs tier-2 audit story.
