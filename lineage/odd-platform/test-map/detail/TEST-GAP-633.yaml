proposed_action: |-
  Stand up THREE companion test classes as the per-controller test-baseline: (a) `IngestionDataSourceControllerTest` + `IngestionDataSourceFilterIntegrationTest` covering the 401/404/500 path + session-bridge contract + token reuse + soft-deleted collector; (b) `AlertManagerWebhookTest` covering 204 + anonymous + entity_oddrn spoof + orphan + timezone + wire-drop + idempotency + XSS + rate-limit; (c) `OwnerWriteControllerTest` covering create/update/delete authorization + cascade-block + role-rebind semantics + search-vector + orphan-association-request + soft-delete visibility + name-recovery roundtrip. The proposed paths align with the existing test-directory layout. Driver: the maintainer can use each batch-P TEST-GAP entry to seed one method on the corresponding test class.
