notes: |-
  The Data Quality Dashboard is the catalog-wide aggregate; F-022 (the
  data-quality-test / dataset-test-report / dataset-sla concepts) is the
  per-dataset drill-down on the dataset detail page's 'Test reports' tab. They
  are DELIBERATELY kept as distinct concepts: the dashboard reads
  GET /api/dataqatests/runs (DataQualityRunsController, DataQualityResults DTO);
  the per-dataset surface reads GET /api/datasets/{id}/test_report
  (DataQualityController, DataSetTestReport DTO). No code is shared between the
  two surfaces; both consume the DataEntityRunStatus enum, which is its own
  concept entry.

  This is a CANONICAL entity — the live dashboard.md sub-page names the
  `/data-quality` route and the three rings verbatim. The doc structure matches
  the code (three DonutCharts, two filter ListContainers); the open doc gaps are
  (a) access control silence and (b) the filter-panel interaction model
  (URL deep-linking, two scoped Clear buttons) is undocumented.
maintainer_curated: false
