name: AlertManager webhook bypasses AlertActionResolver — no idempotency guard
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19I (AlertServiceImpl sidecar)** —
  the two alert-ingestion paths (`handleExternalAlerts` for the AlertManager webhook;
  `applyAlertActions` for in-platform ingestion derived from DQ-test / job-run /
  schema-change deltas) deliberately DIVERGE on de-duplication semantics, leaving
  the AlertManager webhook path with NO idempotency guard. **Confirmed by file:line
  evidence at AlertServiceImpl.java**: (a) `applyAlertActions` (lines 202-231) consumes
  `AlertAction` objects already pre-grouped by `AlertUniqueConstraint` from `AlertActionResolver`
  (the discriminator dispatch at lines 211-227 shows `chunks` already keyed by
  `AlertUniqueConstraint.fromAlert`); the resolver loads the open-alerts snapshot
  first via `getOpenAlertsForEntities` + halt configs via `AlertHaltConfigRepository`,
  then computes the diff. (b) `handleExternalAlerts` (lines 151-191) constructs
  `AlertPojo` DIRECTLY from the webhook payload (lines 174-187) and skips the resolver
  — no snapshot read, no halt-config consultation, no de-duplication. The shared
  `createAlerts` helper (lines 261-300) does NOT de-duplicate at the SQL level
  (no `ON CONFLICT` clause per batch H repository sidecar). Two POSTs of the same
  AlertManager payload (e.g. Prometheus retry on transient network error) produce
  TWO duplicate ALERT rows. The decision is intentional and architecturally defensible
  per the implicit ADR (the AlertManager webhook path is a thin adapter with no
  state context; loading the open-alerts snapshot is the expensive part; the AlertManager
  webhook is low-frequency in production deployments). But the OPERATOR-FACING
  consequence is uncovered: the live AlertManager-integration doc page acknowledges
  the unauthenticated posture and the `entity_oddrn` orphaning behaviour (verified
  via batch-F neighbour sidecar 2026-05-08 status 200) but says NOTHING about idempotency.
  Operators reading the docs cannot learn that a Prometheus retry on transient
  network error produces duplicate alerts. **Severity**: MEDIUM (the AlertManager
  endpoint is unauthenticated and low-frequency; combined with the `entity_oddrn`
  trust trapdoor — see companion invariant — and the absence of any UI-side de-duplication,
  duplicate alerts persist in the platform indefinitely and surface in the All
  / per-entity views as visual duplicates that operators cannot easily distinguish
  from legitimate sibling alerts).'
