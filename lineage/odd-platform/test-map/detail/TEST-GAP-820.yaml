proposed_action: |-
  Add `PostDataSetStatsListTagCreationSideChannelTAG_CREATEBypassTest`. Testcontainers integration test:

  1. **Setup**: dataset D-A with field F-1. Pre-existing tag namespace: count rows in `tag` table = N. No granted permission for any user.
  2. **Anonymous unauthenticated POST** with payload `{items: [{datasetOddrn: D-A.oddrn, fields: {F-1.oddrn: {boolean_stats: {true_count: 100}, tags: [{name: "attacker-controlled-1"}, {name: "PROD-CRITICAL"}]}}}]}` → assert 201.
  3. **Assert tag table**:
     - `SELECT count(*) FROM tag WHERE name IN ('attacker-controlled-1', 'PROD-CRITICAL')` returns 2.
     - `SELECT origin FROM tag_to_dataset_field WHERE tag_id IN (...) AND dataset_field_id = F-1.id` returns 2 rows, all with `origin = 'EXTERNAL_STATISTICS'`.
  4. **Assert audit absence**: `SELECT count(*) FROM activity_event WHERE event_type IN ('TAG_*', 'DATASET_FIELD_VALUES_UPDATED', ...)` returns 0 — the tag creation is invisible to the Activity Feed.
  5. **Assert downstream propagation**: `GET /api/tags?name=PROD-CRITICAL` (UI listing) — assert returns the attacker-created tag.
  6. **Sister assertion of survival**: re-POST without those tags → assert the tag ROWS persist in `tag` table (only the RELATION is removed via reconcile-on-replay — see TEST-GAP-822).

  Pair with REFACTOR-NNN and DOC-GAP-NNN.

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP names the EXTERNAL_STATISTICS-origin tag-creation bypass. Cross-references TEST-GAP-545/546 (tag-CTE coverage) — those entries pin the listMostPopular SQL surface; this entry pins the WRITE-side bypass that pollutes that surface. STRENGTHENS the F-008 picture by extending the unauthenticated-write blast radius beyond `dataset_field.stats` to `tag` + `tag_to_dataset_field` + downstream UI. No contradiction with F-008's existing scope.
