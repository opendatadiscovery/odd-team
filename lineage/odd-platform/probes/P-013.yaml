  - kind: db_buffer_metric
    target: pg_stat_statements
    capture: total_exec_time, calls, shared_blks_hit, shared_blks_read for the
      `SELECT count(*) = 0 FROM activity_%` statement

oracle:
  - **HYPOTHESIS CONFIRMED (MEDIUM severity)**: count-scan is full sequential
    scan on populated partitions, taking >100ms per partition; on a deployment
    with 30+ past partitions, the housekeeping cycle spends >3s per cycle
    just confirming non-emptiness — that is 96×3s = ~5 minutes/day of DB
    load purely for emptiness verification on a job that drops nothing.
  - **HYPOTHESIS REJECTED (Postgres optimises this)**: planner detects
    `count(*) = 0` and short-circuits — the cost is O(1) regardless of
    partition size. The job's overhead is negligible.

