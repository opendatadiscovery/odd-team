- id: H-009
  hypothesis: |
    When any authenticated user calls GET /api/resource/{type}/{id}/permissions, the
    response reveals only THEIR OWN resolved permissions on the resource — a caller
    cannot coerce the endpoint into reporting another user's permissions.
  derivation: |
    Endpoint-shape (the path has {resource_id} but NO {user_id} slot) + negative-space.
    A senior security reviewer checks whether a permission-read endpoint can be turned
    into a cross-user privilege-enumeration tool.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      The endpoint signature carries (PermissionResourceType, Long resourceId,
      ServerWebExchange) and NO user identifier (PermissionController.java:20-22);
      the caller identity comes only from the reactive SecurityContext via
      AuthIdentityProviderImpl (getResourcePermissions sidecar concepts.invariants[3]
      + security.data_exposure[0]). The response is always evaluated for "current
      user" — there is no {user_id} the caller can substitute. So cross-user
      permission disclosure is structurally impossible. (A caller CAN iterate
      resource_id values to discover which resources they themselves have elevated
      permissions on, but that is bounded to what the policy graph would grant them
      anyway — a discoverability surface, not an escalation; sidecar rates it LOW.)
    evidence:
