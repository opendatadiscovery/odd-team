coverage_gap_for_scan:                  # per-scanner substrate-coverage gaps surfaced for next /enrich pass
  - axis: config_prefixes
    sub_namespace: spring.r2dbc.pool.*
    rationale: |-
      R2DBCConfiguration.java reads spring.r2dbc.pool.* via Spring Boot autoconfiguration's
      R2dbcProperties; ten map.from(pool.getXxx()).to(builder::xxx) lines per pool
      (lines 41-50 + 75-84). Substrate's axis-5 (config_prefixes) does not enumerate
      sub-namespaces under spring:; this batch's F-120 needs a config-prefix node for
      spring.r2dbc.pool.* to map cleanly. Recommend /enrich pass enriches R2DBCConfiguration
      as the consumer node + adds spring.r2dbc.pool.* to the axis-5 enumeration manifest.
  - axis: config_prefixes
    sub_namespace: spring.task.scheduling.*
    rationale: |-
      SchedulingConfiguration.java relies on Spring Boot framework-default TaskScheduler
      (poolSize=1) — operator-tunable knob spring.task.scheduling.pool.size is unset in
      application.yml + undocumented in operator page. Substrate's axis-5 does not enumerate
      this sub-namespace. Same /enrich pass recommendation as spring.r2dbc.pool.*.
