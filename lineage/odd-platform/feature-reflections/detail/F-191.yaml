# Dataset Schema Revision Compare Viewer (UI surface) — product-owner reflection

## product_owner_narrative

The Revision Compare Viewer is the screen a data engineer opens to answer one concrete question: *"what changed in this dataset's schema between two points in time?"* It is the operator-observable face of F-045's diff endpoint — where F-045 reflects the wire contract, this reflection is about the page the user actually lives through. The promise to a customer: open any dataset, click **Revision compare**, and get a side-by-side view of two revisions with every added, removed, and changed field called out in colour, plus a one-click "show only the fields that changed" filter (per the F-045 batch-extension ui-review-2026-05-26-K and `DatasetStructureCompareHeader.tsx:60-145`). The audience is the `data-engineer-analyst` doing downstream-impact analysis after a breaking change and the `odd-platform-ui-end-user` browsing a dataset (system-mission.md P-01 audiences; "view per-dataset schema-diff against revisions" is a named P-01 primary user action).

The user reaches it from the **Structure** tab: the "Revision compare" button in `DatasetStructureHeader.tsx:144-150` (disabled until the dataset has at least two revisions) navigates to `/dataentities/{id}/structure/compare?firstVersionId=&secondVersionId=`, pre-seeding the two pickers with the OLDEST and NEWEST version ids from the sorted revision list (per the feature-flow `discovered_from_entry_point`). On that screen, `DatasetStructureCompare.tsx:24-35` reads the two version ids from the URL query-params and fires `useDatasetStructureCompare`, which calls `GET /api/datasets/{id}/structure/diff` (`datasetApi.ts:13-26`, source-read). The four render states are Loading (`AppLoadingPage`), Error (`AppErrorPage`), Empty (`EmptyContentPlaceholder`), and Success (`DatasetStructureCompareList`) — `DatasetStructureCompare.tsx:37-57`.

The working parts a product owner would demo: (a) **two revision pickers** ("From" / "To") that each disable the option the other picker already holds, and write the chosen id back into the URL query-param (`DatasetStructureCompareHeader.tsx:89-144`, source-read — the URL is the source of truth for the selection); (b) a **side-by-side per-field diff**, one row per field, where the row container colour is driven by the backend's `CREATED`/`UPDATED`/`DELETED` status and nested struct/list fields expand recursively (`DatasetStructureCompareListItem.tsx:31-37,113-117`); (c) a **"Show changes only" checkbox** that filters the visible rows; and (d) a **Close** button. A decisive detail resolved by source-read this pass (`datasetApi.ts:19-32`): "Show changes only" is a purely CLIENT-SIDE prune — the hook always fetches the full diff payload and `makeCompareFieldsTree` applies the filter in React Query's `select`; the `queryKey` deliberately excludes `showChangesOnly`, so toggling the checkbox re-derives from cache without a re-fetch.

The integration story: this surface renders exactly what F-045's diff endpoint returns, so every F-045 backend defect has a UI consequence here. The cross-dataset version-id leak (F-045 H-001/H-002) reaches this screen through the URL query-params, which the viewer does NOT validate against the loaded revision list — the client-side half of the leak. The asymmetric 500-vs-400 error model (F-045 H-004) lands as a single undifferentiated full-page error. The schema payload it diffs carries the tags + glossary terms from Manual Object Tagging (F-018), so the leak is wider than raw column metadata. The viewer lives inside the data-entity detail page that Detail-Page View Tracking (F-001) enters.

Edge cases a senior product owner would flag in a demo, all load-bearing here: what happens when a user pastes a compare URL someone shared in chat — does the viewer check the ids belong to this dataset (it does not — the headline finding)? What does the user see when a version id is stale or wrong (a full-page outage-style error indistinguishable from "the platform is down")? What does the Close button do — go back, or go somewhere (it navigates to the latest-structure path, dropping the compare state, not a browser-back)? Does "Show changes only" save a slow network round-trip on a 10K-field schema (no — the full payload is always transferred)? And the question that frames the trust in the whole screen for a security reviewer: *can the viewer be made to show me a confident, legitimate-looking diff of a dataset my team does not own?* The answer — yes, via a hand-edited URL, with no warning — is the spine of this UI reflection.

