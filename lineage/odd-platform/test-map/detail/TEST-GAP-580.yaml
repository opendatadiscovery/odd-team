proposed_action: |-
  Parameterised WebTestClient test. (a) Boot with `auth.ingestion.filter.enabled=true` AND a valid datasource token seeded. (b) POST `/ingestion/entities` with NO Authorization header → 401 (filter enforces). (c) POST `/ingestion/alert/alertmanager` with NO Authorization header → 204 (uncovered). (d) POST `/ingestion/datasources` with NO Authorization header → 401 (sibling filter enforces). (e) Assert ALL THREE behaviours simultaneously to pin the asymmetry. Future REFACTOR adding AlertManager auth-gating (e.g., shared-secret header per Prometheus AlertManager webhook convention) flips assertion (c) to 401.
