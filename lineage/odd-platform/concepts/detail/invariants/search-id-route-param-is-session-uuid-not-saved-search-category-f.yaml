security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      The URL-layer drift IS a security consequence: an operator
      sharing a `/search/{uuid}` URL exposes their session state to
      any recipient who can authenticate to the platform. Under
      DISABLED the URL is reachable anonymously by anyone who can
      reach the application port.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The session row has no owner binding (per the
      search-facets-bearer-token-shaped-no-user-binding invariant);
      the URL exposing the UUID is the operator-facing surface where
      that schema-level bypass becomes visible.
  strengths:
    - |-
      Server-generated v4 UUID — unguessable in O(2^60) attempts. The
      URL bar exposing the UUID is a leak vector but not a guessing
      surface.
    - |-
      TTL-bounded retention via housekeeping.ttl.search_facets_days
      (default 30 days) — the leak surface decays over time.
  weaknesses:
    - |-
      The URL name `searchId` promises a saved-search; operators
      bookmark and share these URLs expecting saved-search semantics.
      The implementation gives bearer-token-session semantics with
      30-day TTL. Mismatch leads to silent bookmark expiry + accidental
      session sharing across users.
    - |-
      Doc-side silence is total — the live `/features/data-discovery/search`
      page (WebFetched 2026-05-26 status 200) does NOT mention the URL
      form, the session semantics, the TTL, or the cross-user link
      sharing exposure. An operator has no way to learn the semantic
      from docs.
    - |-
      Tab navigation (`ToolbarTabs.tsx:38` → `searchPath()` no-arg → `/search`)
      DROPS the URL UUID and creates a fresh session via INSERT, leaving
      the previous session row orphaned until the housekeeping reaper.
      Operator surprised by "my saved search disappeared when I clicked
      Catalog tab".
  cross_file_inconsistencies:
    - |-
      The Category F drift at the URL layer (this invariant) and the
      Category F drift at the SQL layer (the userIds-binds-to-OWNER_ID
      LSN-020 family) are the SAME drift class but at different
      surfaces. The URL-layer drift is operator-first-contact; the
      SQL-layer drift is hidden behind the API. Both should be
      documented together as the broader "name-vs-implementation
      drift" architectural pattern.
  contributing_files:
    - odd-platform__ts__routes__route__search.md
    - SearchController-class.md
  evidence:
    - |-
      search.md:stress_findings.request_inputs.[searchId DRIFT_INPUT_NAME_VS_IMPLEMENTATION]
    - |-
      search.md:bugs_limitations_corner_cases.[2,3,5]
