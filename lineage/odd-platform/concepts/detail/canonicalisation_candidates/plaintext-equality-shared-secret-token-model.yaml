proposed_canonical: Plaintext-equality shared-secret token model
rationale: 'regenerateCollectorToken sidecar surfaces three coupled invariants: in-place
  UPDATE rotation, plaintext-in-DB, plaintext `.equals(...)` validation in IngestionDataEntitiesFilter.
  The model is the implicit ADR underlying the S2S authentication mode; main-concepts.md
  names S2S but does not document the storage/validation/rotation model. Useful for
  future audits'' threat-model context.'
contributing_concepts:
- Token (40-char alphanumeric shared secret) (regenerateCollectorToken)
- in-place UPDATE rotation (regenerateCollectorToken implicit_adrs[1])
- plaintext-equality validation (regenerateCollectorToken implicit_adrs[3])
- RandomStringUtils.randomAlphanumeric (non-CSPRNG) (regenerateCollectorToken)
suggested_add_to_docs: false
