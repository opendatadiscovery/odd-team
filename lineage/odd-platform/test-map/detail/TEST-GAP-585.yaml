  - "IngestionDataEntitiesFilter.md:performance.known_performance_gaps.[0]"
behaviour: |-
  **Body parsed TWICE per request — filter to extract dataSourceOddrn + controller for the actual DataEntityList ingest.** The filter at line 40 calls `readBody(dataBuffer, DataEntityList.class)` — full Jackson tree-walk — purely to extract `body.getDataSourceOddrn()`. Then the buffered DataBuffers are re-emitted unchanged via `flatMapIterable(ignored -> dataBuffer)` at line 60 to the controller. The controller (IngestionController.java:38-44) re-deserialises the same payload via the OpenAPI-generated `IngestionApi`'s `Mono<DataEntityList>` parameter binding. For a 20MB payload containing 1000 entities, this is TWO full Jackson tree-walks per request. A streaming `JsonPath`-style extraction of just `dataSourceOddrn` would halve the per-request parse cost. The cost is meaningful at >100 req/s on 1000-entity payloads.
test_class: missing-performance
