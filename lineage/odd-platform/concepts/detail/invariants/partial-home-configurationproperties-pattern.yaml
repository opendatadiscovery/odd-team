name: Partial-home @ConfigurationProperties pattern
canonical_in_docs: false
canonical_candidate: true
description: 'Cross-cutting refactoring-hazard invariant: ODD''s `@ConfigurationProperties`
  POJOs intermittently bind only a SUBSET of their declared prefix''s keys; the remaining
  keys are scattered as `@Value`-injected reads across multiple consumer files. A
  maintainer reading the Properties class to learn the config-prefix sees a partial
  picture. 2-sidecar triangulated in batch 2026-05-12D: (a) DataCollaborationProperties
  binds 3 of 7 `datacollaboration.*` keys; the other 4 (`enabled`, `slack-oauth-token`,
  `message-partition-period`) are `@Value`-scattered across DataCollaborationConfiguration.java:21
  + FeatureResolverImpl.java:17 + DataCollaborationFeatureCondition.java:18-22 + MessageTablePartitionManager.java:19.
  (b) EmailSenderProperties binds the SMTP transport surface (sender / password /
  host / port / protocol / smtp.auth / smtp.starttls) but NOT the recipient list `notifications.receivers.email.notification.emails`
  (consumed via raw `@Value` in `NotificationConfiguration.java:104`). Refactoring
  hazard: (i) a future maintainer searching the codebase via ''find usages of `datacollaboration.message-partition-period`''
  would NOT find DataCollaborationProperties; (ii) tooling that walks `@ConfigurationProperties`
  to generate Spring Boot metadata captures only the bound subset, leaving the @Value-read
  keys without IDE auto-completion; (iii) the Properties class''s `@PostConstruct`
  validator cannot enforce invariants over keys it does not bind. Recommended cross-cutting
  remediation: complete the binding — every `@Value` reading a key in a prefix that
  has a `@ConfigurationProperties` POJO should be replaced by adding the field to
  that POJO. Bonus: this also enables central validation.'
axes_present:
- config_prefixes
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.datacollaboration.config config-properties-class:DataCollaborationProperties
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:EmailSenderProperties
