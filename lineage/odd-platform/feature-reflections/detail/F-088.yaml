# S2S API Key — Global Admin Grant Surface — product-owner reflection

## product_owner_narrative

The S2S (server-to-server) API key is ODD Platform's answer to a real, legitimate need: *"my automation has no browser and no human at the keyboard — how does my collector script, my CI job, my curl-based integration authenticate to the platform?"* A product owner introduces it like this: "Set `auth.s2s.enabled: true` and a secret `auth.s2s.token`, then have your automation send that secret in the `X-API-Key` HTTP header on every request. The platform recognises the header and runs the request as a built-in administrator — no login page, no session cookie, no OAuth dance." The audience is the **platform-operator** (who sets the two config keys) and the **odd-api-consumer / odd-collector-runtime** (the machine caller that presents the header) — per `system-mission.md:249-266` (P-09) + `:334-337`. This is the standard "machine principal" pattern every catalog/SaaS platform ships, and the capability it delivers — browserless admin-authenticated API access — is genuinely valuable and works (confirmed below at H-001).

A user interacts with this feature **entirely without a screen** — and that is the first thing a senior product owner notices. There is no UI control, no settings toggle, no combo-box that feeds the `X-API-Key` value: the key is a string an operator pastes into a Helm value / env var and an automation author pastes into an HTTP-client header (per `S2sTokenProvider.java:10` `@Value("${auth.s2s.token:#{null}}")` + `S2sAuthenticationFilter.java:20,43-47` reading the literal header). So the operator's *entire comprehension surface* for this feature is two things: the **property name** (`auth.s2s.enabled` — "S2S", server-to-server) and the **docs page** (`/authentication/s2s`). Rule 9's "reflect from the screen" therefore resolves to "reflect from the config key + the docs page," because that IS the operator's interface. This is not a missing-UI gap to flag as incomplete — it is the correct shape for a machine-to-machine credential — but it makes the *naming* load-bearing in a way a UI label would not be (H-002, H-011).

The working parts, as a product owner would demo them, traced through the chain (`F-088.yaml` hops 1-4, confirmed by Rule-8 source reads). **Wiring** (`auth.type` dispatch): under LOGIN_FORM / OAUTH2 / LDAP, `if (s2sEnabled) sec.addFilterAt(s2sAuthenticationFilter, SecurityWebFiltersOrder.HTTP_BASIC)` installs the filter at the highest-priority pre-authentication slot (`OAuthSecurityConfiguration.java:108-109`, `LDAPSecurityConfiguration.java:149-150`, `LoginFormSecurityConfiguration.java:61-63`). Under DISABLED the property is read by nobody in the security config — `DisabledAuthSecurityConfiguration.java:10-18` wires no filter (everything is already `permitAll`). **Recognition**: `S2sTokenProvider.isValidToken` does `s2sToken.equals(token)` (`S2sTokenProvider.java:20`). **Identity**: on a match, the filter forces `User.withUsername("ADMIN").roles("ADMIN")` and `contextWrite`s it (`S2sAuthenticationFilter.java:31-39`); on a miss it falls through (`:28`). **Scope**: because the filter sits ABOVE the `.pathMatchers("/**").authenticated()` rule, a valid key satisfies that rule for *every* path — not just `/ingestion/**`.

The integration story (per `system-mission.md` cross-pillar graph + F-088 `related_features`): this feature is the **filter-tier origin** of the synthetic `ADMIN` principal that F-011 (Principal-to-Owner resolution) consumes at the SQL chokepoint — `AuthIdentityProviderImpl.java:32` collapses the `UsernamePasswordAuthenticationToken` (not an OAuth2 token) to `provider=null`, so any owner-scoped read by the S2S caller looks up `WHERE OIDC_USERNAME='ADMIN' AND PROVIDER IS NULL` (`F-088.yaml` hops 3-4). It is the SAME credential the F-008 Batch-Ingestion surface uses for `/ingestion/entities`, but F-088 is the cross-cutting `/**` reality that the ingestion framing hides. And it surfaces in F-085's `whoami` as the uppercase `ADMIN` (vs the DISABLED-mode lowercase `admin` dummyOwner) — two undocumented identity surfaces distinguishable only by case.

A product owner would flag five edge cases in a demo. (a) **The name oversells nothing and undersells the blast radius** — "S2S" + the docs' ingestion examples read as "ingestion-only," but the key is full admin across `/api/policies`, `/api/owners`, `/api/users`, every mutation; an operator who hands an ingestion script this key has handed it root (H-002). (b) **An operator who names a human user `ADMIN` silently donates that human's Owner-scoped data to every S2S caller** (H-005, cross-link F-011 H-002 / PLT-072). (c) **Under LOGIN_FORM, a request that carries BOTH a session cookie AND the key is the ADMIN, not the logged-in human** — the key wins, reversing operator intuition that "my session is primary, the key is a fallback" (H-006). (d) **`DISABLED + auth.s2s.enabled=true` is silently inert** — the property is accepted with no boot warning, so an operator who believes they have "added S2S on top of open mode" has changed nothing (H-007). (e) **The single static token never rotates without a platform restart and leaves no per-caller audit trail** — if it leaks, every automation consumer must be re-coordinated and the platform bounced, and no log says which script used it when (H-009, H-010).

## hypotheses

- id: H-001
  hypothesis: |
    When a browserless machine caller (a collector script, a CI job, a curl
    command) sends `X-API-Key: <auth.s2s.token>` to a platform running under
    OAUTH2/LDAP/LOGIN_FORM with auth.s2s.enabled=true, the request is
    authenticated WITHOUT any interactive login / session cookie / OAuth
    redirect — the intended "my automation has no human" capability works.
  derivation: |
    Pillar-mission — P-09's primary user action "enable S2S for non-UI
    programmatic callers (X-API-Key header)" (system-mission.md:252,263). This
    is the LEGITIMATE promise the feature exists to deliver; a reflection that
    only catalogues misuse would miss what the feature correctly does.
  seed_source: pillar-mission
  validation:
    verdict: confirmed
    actual_behavior: |
      S2sAuthenticationFilter sits at SecurityWebFiltersOrder.HTTP_BASIC — the
      highest-priority pre-authentication slot — ahead of the form-login / OAuth2
      / LDAP entry points. On a valid token (S2sTokenProvider.isValidToken,
      s2sToken.equals(token)) the filter contextWrites a fully-authorized
      UsernamePasswordAuthenticationToken (S2sAuthenticationFilter.java:31-39),
      satisfying the `.pathMatchers("/**").authenticated()` rule with no session,
      no cookie, no redirect. A machine caller authenticates on the FIRST request
      with only the header. The capability is real and correctly delivered.
    evidence:
      - sidecar: "(unresolved — F-088.yaml hop-1 + hop-2 evidence)"
        section: "chain hops 1-2"
        cite: "S2sAuthenticationFilter.java:31-39 + OAuthSecurityConfiguration.java:108-109"
        note: "Synthetic authorized principal contextWritten at HTTP_BASIC order; no interactive step."
      - sidecar: "(source_read_for_validation)"
        section: "Rule-8 confirmation read"
        cite: "S2sTokenProvider.java:15-21"
        note: "isValidToken returns true on s2sToken.equals(token); the only gate is the shared secret."
    source_read_for_validation: true
    confidence: HIGH
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-002
  hypothesis: |
    When an operator enables S2S to let an ingestion/automation client call the
    platform, the X-API-Key grants the ingestion-shaped scope the "S2S" name and
    the docs' ingestion examples imply — i.e. it is NOT silently a full-admin
    credential able to create policies, owners, and users and delete RBAC rows.
  derivation: |
    Endpoint/property-name shape — the property is `auth.s2s.enabled`, the docs
    page is `/authentication/s2s`, and "S2S" + server-to-server ingestion is the
    operator's mental model (F-088 notes). Category-F naming alignment: does the
    implementation's scope match the name's promise?
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The filter is wired at HTTP_BASIC order ABOVE `.pathMatchers("/**")
      .authenticated()` (LoginFormSecurityConfiguration.java:55-57,61-63 +
      OAuth/LDAP siblings), and the synthetic principal carries roles("ADMIN")
      with getAuthorities(true). So a valid X-API-Key authenticates as ADMIN for
      EVERY path: POST /api/policies, POST /api/owners, POST /api/users, PUT
      /api/data-entities/{id}/internal-name, DELETE /api/policies/{id}, and every
      other mutation an admin operator can perform (F-088 terminal_side_effect +
      facet s2s_filter_scope_is_global_not_ingestion_only_name_misleading). There
      is NO path restriction to /ingestion/**. The live docs (WebFetched
      2026-06-03) DO now state "any endpoint that admins can call" — but the name
      and the ingestion-shaped examples still lead an operator skimming for "how
      do I auth my collector" to under-read the blast radius.
    evidence:
      - sidecar: "(unresolved — F-088.yaml facet)"
        section: "observed_vs_expected.facets[0]"
        cite: "S2sAuthenticationFilter.java:31-39 + OAuthSecurityConfiguration.java:108-110"
        note: "roles('ADMIN') + getAuthorities(true); filter scope is /**, not /ingestion/**."
      - sidecar: "(source_read_for_validation)"
        section: "Rule-8 confirmation read"
        cite: "LoginFormSecurityConfiguration.java:49-57,61-63"
        note: "permittedPaths is a 5-entry allowlist; everything else `.authenticated()`; S2S filter sits above it."
    source_read_for_validation: true
    operator_visible_failure: |
      (a) An operator writes a thin ingestion script, generates an S2S token, and
          embeds it in the script's config — believing (from the name + ingestion
          examples) that the worst a leak can do is push bad metadata. In fact the
          leaked key is full platform admin: an attacker creates a Policy granting
          themselves everything, mints owners/users, deletes RBAC rows, and edits
          any entity — across the entire catalog.
      (b) The blast radius is invisible at the point of decision: the config key
          and the docs page are the only signposts, and the key name says "S2S,"
          not "global admin." There is no UI, no scope picker, no per-token
          permission set to make the breadth visible.
      (c) Defence-in-depth is absent: there is no way to scope the key to
          /ingestion/** even when that IS the operator's only intent
          (REFACTOR-108 proposes exactly this path-scoping).
    severity: HIGH
    confidence: HIGH
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional
    routes_to_finding: caveat-candidate

- id: H-003
  hypothesis: |
    When an automation client presents an INVALID or absent X-API-Key (a typo'd
    secret, an expired-and-rotated value, no header at all), the platform falls
    through to the normal interactive auth chain rather than authenticating the
    request or hard-failing it — so a wrong key degrades to "unauthenticated,"
    not to "ADMIN" or to a 500.
  derivation: |
    Endpoint-shape (the X-API-Key input) + negative-space — a senior reviewer
    expects a credential check to fail CLOSED (treat-as-anonymous), not to leak
    authority or crash, on a bad value.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      S2sAuthenticationFilter.java:27-28 — `if (!isValidToken(...)) return
      chain.filter(exchange)` — on an invalid/blank/absent token the filter
      simply continues the chain WITHOUT writing the ADMIN context, so the normal
      interactive auth applies (the request is anonymous/unauthenticated unless a
      session cookie or OAuth identity is present). isValidToken returns false on
      a blank token (S2sTokenProvider.java:16-18) and on any non-equal string
      (:20). No exception is thrown on mismatch. The live docs confirm "the filter
      falls through and the normal auth chain handles the request."
    evidence:
      - sidecar: "(source_read_for_validation)"
        section: "Rule-8 confirmation read"
        cite: "S2sAuthenticationFilter.java:27-28 + S2sTokenProvider.java:15-21"
        note: "Fail-closed: invalid/absent key → chain.filter without ADMIN context; no throw."
    source_read_for_validation: true
    confidence: HIGH
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-004
  hypothesis: |
    When an operator sets auth.s2s.enabled=true but FORGETS to set
    auth.s2s.token (or leaves it blank), the platform refuses to boot (or warns
    loudly) rather than silently coming up with an unusable / wide-open S2S
    config.
  derivation: |
    Negative-space + pillar-mission — a senior operator expects a security knob
    that is half-configured to fail-fast at boot, consistent with secure-default
    discipline (LSN-001/LSN-002 class).
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      S2sTokenProvider.validate() (@PostConstruct, S2sTokenProvider.java:23-28)
      throws IllegalStateException("Long Term Token is not defined") when
      s2sEnabled && StringUtils.isBlank(s2sToken). So "enabled with no token"
      fail-fasts at boot — the one secure-default behaviour this feature gets
      right. (Contrast H-007: enabled UNDER DISABLED is NOT caught, because the
      token is non-blank — it is the WIRING that is absent, not the token.)
    evidence:
      - sidecar: "(source_read_for_validation)"
        section: "Rule-8 confirmation read"
        cite: "S2sTokenProvider.java:23-28"
        note: "@PostConstruct fail-fast on enabled+blank-token — boot-time guard present."
    source_read_for_validation: true
    confidence: HIGH
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-005
  hypothesis: |
    When an S2S API-key client performs an owner-scoped operation (reads "my"
    data, or any endpoint that filters by the caller's Owner), it resolves to a
    dedicated machine identity or to no Owner — it does NOT silently act as some
    human operator's account.
  derivation: |
    Negative-space + cross-pillar (F-011) — a senior security reviewer expects a
    machine principal to be isolated from human principals; an API key inheriting
    a person's owner-scoped data is a boundary failure.
  seed_source: negative-space + cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The synthetic principal's username is the literal uppercase "ADMIN"
      (S2sAuthenticationFilter.java:31-34). Because it is a
      UsernamePasswordAuthenticationToken (not an OAuth2 token),
      AuthIdentityProviderImpl.java:32 collapses it to provider=null, and
      ReactiveUserOwnerMappingRepositoryImpl.java:116-127 builds `WHERE
      OIDC_USERNAME='ADMIN' AND PROVIDER IS NULL AND DELETED_AT IS NULL` using a
      case-SENSITIVE eq (not equalsIgnoreCase). If an operator has named a real
      LOGIN_FORM / LDAP user `ADMIN` (exact case), the S2S caller INHERITS that
      human's USER_OWNER_MAPPING row and their owner-scoped reads/mutations
      (F-088 facet ADMIN_uppercase_username_collision_with_operator_named_user;
      F-011 H-002 carries the SQL-chokepoint primary source). There is no
      system-Owner and no no-owner sentinel for S2S.
    evidence:
      - sidecar: "(unresolved — F-088.yaml facet + F-011 H-002)"
        section: "observed_vs_expected.facets[1]"
        cite: "S2sAuthenticationFilter.java:34 + ReactiveUserOwnerMappingRepositoryImpl.java:116-127"
        note: "Literal 'ADMIN' (uppercase), provider=null, case-sensitive eq → collides with operator-named user."
    operator_visible_failure: |
      (a) An S2S key (intended for collector/programmatic access) silently gains a
          specific human user's owner-scoped data access whenever an operator has
          created an Owner/mapping for a user literally named 'ADMIN' — the key
          holder sees and can mutate that user's owned entities.
      (b) The collision is naming-dependent and case-sensitive, so it is
          intermittent across deployments — fine until someone names a user
          'ADMIN', then the S2S blast radius silently changes with no signal.
    severity: HIGH
    confidence: HIGH
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: |
    When a request under LOGIN_FORM carries BOTH a valid session cookie (a
    logged-in human) AND an X-API-Key, the logged-in human's identity is used —
    the operator's intuition is "my interactive session is primary, the API key
    is a machine fallback."
  derivation: |
    Negative-space + view-mode — a senior product owner reasons about the
    combined-credential case; the conventional expectation is that an explicit
    interactive session takes precedence over a shared machine secret.
  seed_source: negative-space + view-mode
  validation:
    verdict: contradicted
    actual_behavior: |
      The S2S filter is at SecurityWebFiltersOrder.HTTP_BASIC — a HIGHER priority
      than the form-login/session filters. On a valid key it ALWAYS contextWrites
      the synthetic ADMIN authentication (S2sAuthenticationFilter.java:36-39 calls
      chain.filter unconditionally with the ADMIN context), and the
      session-cookie authentication runs LATER in the chain, so the S2S ADMIN
      identity wins and the session identity is discarded (F-088 facet
      api_key_at_http_basic_overrides_session_cookie_under_login_form +
      LoginFormSecurityConfiguration.java:61-63). This is the REVERSE of the
      "session primary, key fallback" intuition.
    evidence:
      - sidecar: "(unresolved — F-088.yaml facet)"
        section: "observed_vs_expected.facets[3]"
        cite: "LoginFormSecurityConfiguration.java:61-63 + S2sAuthenticationFilter.java:36-39"
        note: "Filter at HTTP_BASIC (above session auth); ADMIN context written unconditionally on valid key."
    source_read_for_validation: true
    operator_visible_failure: |
      (a) A human operator who is logged in via the form AND whose client (e.g. a
          shared browser extension, a proxy, a misconfigured tool) also injects
          the X-API-Key silently performs every action as the synthetic ADMIN, not
          as themselves — so the per-user audit trail (already thin) attributes
          their actions to 'ADMIN', and any owner-scoped view shows the ADMIN
          collision target's data rather than their own.
      (b) The precedence is invisible and undocumented (the live S2S page is silent
          on cookie-vs-key ordering), so an operator cannot predict which identity
          a dual-credential request will assume.
