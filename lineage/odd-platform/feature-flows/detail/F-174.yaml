pillar_anchored_feature_name: Owner-Association History Audit-Trail Consumer (the only operator-visible audit surface in this UI subtree)
feature_name: |-
  Owner-Association History tab — the Management → Associations
  "History" tab consumes GET /api/owner_association_request/activity
  via useGetOwnerAssociationActivityList and renders a paginated list
  of OwnerAssociationRequestActivity rows (username / ownerName / role /
  provider / resolvedBy / status / resolvedAt). The ONLY operator-visible
  audit surface inside the Associations UI subtree. The endpoint is
  also enumerated by F-074 as an example of the Management-tab read-
  collaborative posture (any authenticated user can fetch the full
  activity log).
