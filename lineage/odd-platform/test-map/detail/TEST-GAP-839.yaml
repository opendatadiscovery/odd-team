proposed_action: |-
  **Phase 1 — Cross-component test pair** (Vitest + react-testing-library + fake timers):

  1. `clickFacetFiveTimesInRapidSuccession_currentlyDispatchesFivePUTCalls_pinsBrokenDebouncer` — render `<Search />` with mocked Redux. Click 5 facet checkboxes within `jest.advanceTimersByTime(1500)`. Assert `mockStore.getActions().filter(a => a.type === 'updateDataEntitiesSearch.pending')` count === 5. PINS the bug.

  2. `clickFacetFiveTimesInRapidSuccession_afterFixCoalescesIntoOnePUT_postsFixContract` — same setup. Assert count === 1 (or 2 with leading-edge). FAILS today; PASSES after fix. Becomes the regression-pin for the fix.

  3. `clickFacetFiveTimesInRapidSuccession_currentlyDispatchesFivePUTCalls_pinsTermSearchBrokenDebouncer` — sister test in `TermSearch.test.tsx`. PINS the clone-propagation.

  **Phase 2 — Cross-component Playwright spec**:
  - `rapidlyToggleFiveFacetsAcrossSearchAndTermSearchPages_observesN_PUT_calls_pinsClonePropagationFamily_playwrightCIPermanent` — navigate to `/search`, rapidly toggle 5 facets, network-intercept PUT calls, assert count. Then navigate to `/terms`, repeat. PINS both sites in one CI run.

  **Fix architectural recommendation**: `useMemo` the debouncer outside `useCallback`, OR remove `searchFacetParams` from the deps. The fix is a single-PR refactor across `Search.tsx` + `TermSearch.tsx` + any sister consumer that follows the same pattern. The test pins both sites — fixing one without the other surfaces in test failures.

  Coherence note (LSN-018 Rule 6): STRENGTHENS the TermSearch batch-U bugs[2] finding by establishing the clone-propagation explicitly across both UI surfaces. NO contradiction with existing artefacts. The cross-component test pair is the architectural pattern for clone-propagated bugs going forward.
