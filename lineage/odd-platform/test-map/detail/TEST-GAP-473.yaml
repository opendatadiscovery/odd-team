behaviour: |-
  Empty SecurityContext silently propagates rather than fail-fast. When ReactiveSecurityContextHolder.getContext() emits empty (happens under `auth.type=DISABLED` — no ServerSecurityContextRepository wiring at DisabledAuthSecurityConfiguration.java:11-19 — OR under a future regression where a WebFilter is misordered), `getCurrentUser` emits empty (no `.switchIfEmpty(Mono.error(...))`); every owner-scoped consumer therefore degrades to empty results with HTTP 200, NOT 401/403/404. No logging, no metric, no warning. A regression that broke principal propagation across the entire reactor pipeline would manifest as 'every user sees empty My Objects' — diagnosable only by examining each affected endpoint. The 15 callsites of fetchAssociatedOwner / getCurrentUser would all silently degrade simultaneously.
