evidence:
  - "MinioConfig.md says (bugs_limitations_corner_cases.[4]): 'No IAM-instance-profile / IRSA / WebIdentityToken / DefaultCredentialsProvider support — credentials are exclusively static keys via Spring @Value. Deploying ODD on AWS EKS or ECS where operators would prefer IAM roles over static keys is not supported by this bean. The MinIO SDK's Provider interface (StaticProvider, IamAwsProvider, etc.) is bypassed entirely by the .credentials(accessKey, secretKey) call which constructs a StaticProvider implicitly.'"
  - "MinioConfig.md says (pre_emit_coherence_check): '.credentialsProvider(...) is NEVER called — this is the third silent-default in addition to .region(...) and .httpClient(...). Operators wanting IAM-role-based credentials (AWS EKS / ECS / IRSA) cannot use them. Not covered by an existing REFACTOR scope at enrichment time; surfacing here as part of the Gate-5 unset-parameter audit.'"
  - "Verified at primary source: MinioConfig.java:23 (the two-arg `.credentials(accessKey, secretKey)` — no `.credentialsProvider(...)`)"
