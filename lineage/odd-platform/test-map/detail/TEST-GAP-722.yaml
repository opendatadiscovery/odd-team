behaviour: |-
  **HIGH — TermDetails cross-component fetch duplication: shell + Overview both fire the 12-JOIN getTermDetailsDto per page-open.** Verified by tracing the render path end-to-end in this sidecar:
  - `TermDetails.tsx:37-45` (shell) dispatches `fetchTermDetails({termId})` via Redux thunk on mount with `[termId]` deps.
  - `Overview.tsx:19-21` (default tab) calls `useGetTermByID({termId})` — an INDEPENDENT React-Query / RTK Query hybrid hook reading the SAME endpoint.

  When the user lands on `/terms/:termId/overview` (the default route per `TermDetailsRoutes.tsx:46`), TWO `GET /api/terms/{termId}` requests fire. Each backend GET runs the 12-LEFT-JOIN + 4-countDistinct + 7-jsonArrayAgg hot path in `ReactiveTermRepositoryImpl.getTermDetailsDto` (lines 194-238 — primary-source confirmed in F-002 batch-N sidecar). For typical Term catalogues with <100 linked entities this is sub-200ms per fetch; for a heavily-linked Term (e.g. a "Customer" term linked to 500 datasets across multiple namespaces with 200 tags + 50 owners) the JOIN fan-out before the DISTINCT can materialise N×M×P×Q intermediate rows — the doubled fetch doubles the database load on every page-open.

  **This is NOT the LSN-017 shape** (the trigger isn't a useEffect dep array; it's two independent components both reading the same data) **but it IS a SIBLING class: cross-component fetch duplication on a hot backend path.** Differences from LSN-017:
  - LSN-017 doubles via useEffect dep-array shape WITHIN one component; this doubles via TWO components fetching the same data.
  - LSN-017 amplifies a Postgres UPDATE (causing `view_count` to inflate at +2 per page-open); this amplifies a Postgres SELECT (causing 2× JOIN fan-out work per page-open, no side-effect on persisted state).

  Both are user-observable composition failures across cross-component boundaries that no single per-node enrichment would catch — this is exactly the kind of finding that LSN-018's pre-emit coherence check is designed to surface (per Rule 6 / LSN-018: this sidecar's coherence_check section explicitly notes "this is a NEW sibling pattern to F-002 batch-N drift_class `get_term_details_dto_12_join_hot_path_amplification`").

  **Why HIGH not MEDIUM**: while individual page-open cost is bounded by typical catalogue size, the load-bearing concern is the COMPOSITIONAL nature of the bug. A future refactor that adds a third fetcher (e.g., a "Term ownership panel" component using its own `useGetTermOwnership` hook that internally fetches the term-details endpoint) would silently TRIPLE the load. There is no current test gate detecting the cross-component fetch duplication; the only signal is operator-visible page-load latency on heavily-linked terms. The fix is unambiguous (consolidate to ONE fetcher — drop the shell's `fetchTermDetails` and rely on Overview, OR drop Overview's `useGetTermByID` and selector-read from Redux), but without a regression-pin every refactor risks regressing the consolidated state back to a divergent one.

  **Test gap shape**: an integration test that mounts `<TermDetails/>` with a mocked or test-tier backend, navigates to `/terms/100/overview`, and asserts the count of `GET /api/terms/100` invocations is EXACTLY ONE (not two, not zero). The LSN-017 measurement-truth principle applies — only by counting backend invocations during render can the bug be surfaced.
