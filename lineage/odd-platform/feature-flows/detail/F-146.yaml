chain:
- hop: 1
  node: odd-platform ts react-component:ResultItem
  sidecar: unresolved
  evidence: |-
    ResultItem.tsx:87-90 — `<MetadataStale isStale={searchResult.isStale}
    lastIngestedAt={searchResult.lastIngestedAt} />` inside the Name
    cell of every search result row. NO additional logic — the row
    blindly hands the backend-supplied boolean to the shared primitive.
  multiplicity_per_trigger: 1
  unresolved: false
- hop: 2
  node: odd-platform ts react-component:MetadataStale
  sidecar: unresolved
  evidence: |-
    MetadataStale.tsx:20-32 — renders `<StaleIcon/>` wrapped in an
    AppTooltip ONLY when isStale is true; returns null otherwise. The
    tooltip text is `"Ingested at ${formatDistanceToNow(lastIngestedAt)}"`
    — a relative-time hover-hint. NO icon legend, NO i18n on the
    "Ingested at" label, NO link to a "what does this mean?" doc page.
  multiplicity_per_trigger: 1
  unresolved: false
- hop: 3
  node: odd-platform java service:DataEntityStaleDetector
  sidecar: '(referenced from SHB-001 — sidecar not yet enriched)'
  evidence: |-
    DataEntityStaleDetector.java:13 — the predicate:
    `pojo.getLastIngestedAt() != null && stalePeriod != null &&
    DateTimeUtil.generateNow().isAfter(pojo.getLastIngestedAt().plusDays(stalePeriod))`.
    Five-line @Component, no scheduling, no caching, no per-tenant scope.
    Config-key binding at line 11 — @Value("${odd.data-entity-stale-period}")
    Integer days. @Value style ⇒ read once at startup, threshold cannot
    change without restart.
  multiplicity_per_trigger: 1
  unresolved: true
  unresolved_reason: |-
    DataEntityStaleDetector itself has no sidecar yet — substrate node
    exists but enrichment not run. The four-caveat dependence on this
    file (unset-config silent-default, never-ingested misleading, ingestion-
    forgery integrity, clock-skew flicker) is anchored in SHB-001 evidence.
- hop: 4
  node: odd-platform java mapper:DataEntityMapperImpl
  sidecar: '(referenced from SHB-001)'
  evidence: |-
    DataEntityMapperImpl.java:163, 279, 492, 547 — FOUR callsites imprint
    `.isStale(staleDetector.detect(pojo))` on four distinct response DTOs
    (search results, list items, details, sub-projection). The five UI
    surfaces consume from these four mapper paths.
  multiplicity_per_trigger: 1
  unresolved: true
- hop: 5
  node: odd-platform-specification components.yaml
  sidecar: '(referenced from SHB-001)'
  evidence: |-
    components.yaml:609,918,2010 — `is_stale: boolean` is a REQUIRED field
