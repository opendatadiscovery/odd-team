proposed_action: |-
  Add `DataQualityFiltersMalformedUrlTest` under `odd-platform-ui/src/components/DataQuality/__tests__/`. Use Vitest + React Testing Library + <MemoryRouter>. Three pinning methods (all EXPECTED TO FAIL — pin a FIX-REQUIRED for the unguarded JSON.parse):
  (a) `malformedJsonParamValue_doesNotCrashDashboard_pinsGracefulFallback`: mount <App> at /data-quality?namespaceIds=foo (not valid JSON). Assert the dashboard RENDERS (e.g. with an empty filter state and an inline notice "URL filter could not be parsed"). EXPECTED TO FAIL — today the JSON.parse throws.
  (b) `wrongShapeParamValue_doesNotCrashDownstreamDerivations`: mount at /data-quality?namespaceIds="hello" (parses to string, not array). Assert the dashboard renders AND no TypeError surfaces from filtersAtom's .map call.
  (c) `arrayOfObjectsMissingIdField_doesNotCrash`: mount at /data-quality?namespaceIds=[{}] (parses to [{}], missing `id`). Assert the dashboard renders, the broken filter is silently dropped, and a notice is shown.

  Add a `// FIX-REQUIRED — DataQualityFilters.tsx:31-39 — wrap JSON.parse in try/catch AND add a runtime shape guard (Array.isArray + every-element has-id-and-name). On parse failure or shape failure, drop the param, clear that filter key, and surface an inline notice. This test PINS the desired graceful-degradation behaviour and FAILS until the fix lands.` block.

  Backlog this gap as a small fix-item (the unguarded JSON.parse is a 3-line wrap-in-try/catch).
