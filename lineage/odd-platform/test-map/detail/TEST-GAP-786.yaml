proposed_action: |-
  Add `R2DBCCustomPoolUnconditionalCreationRegressionPinTest`. Two test methods:

  1. `customConnectionPool_existsInDefaultContext_pinsUnconditionalCreation` — `@SpringBootTest` default; assert `applicationContext.getBean("customConnectionPool")` returns non-null. PINS current behaviour.
  2. `pgConnections_atStartup_twoPoolsConsumeDoubleSlots` — `@SpringBootTest` with Testcontainers PG; capture `pg_stat_activity` row count; assert at least 2×initialSize connections (default ~20) are open.

  Pair with: (a) REFACTOR-NNN — add @ConditionalOnProperty on the custom pool + custom databaseClient + custom TM; default opt-in only when Lookup Tables are explicitly used; (b) DOC-GAP-NNN — live docs should explain that the platform opens 2 pools by default and explain how to disable for non-Lookup-Tables deployments.
