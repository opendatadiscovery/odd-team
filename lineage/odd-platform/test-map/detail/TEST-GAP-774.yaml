proposed_action: |-
  Add `LoginFormHardcodedAdminAndNoAuthorizationCustomizerRegressionTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Two test methods asserting the compound posture as the CURRENT intentional behaviour:

  1. `loginForm_anyAuthenticatedUserHasExactlyAdminAuthority` — `@SpringBootTest` with `auth.type=LOGIN_FORM` + custom credentials `alice:alicepw,bob:bobpw`; authenticate as `alice` via form-login; query SecurityContext; assert authority set equals exactly `[ADMIN]` (no `USER`, no per-Policy permissions).
  2. `loginForm_anyAuthenticatedUserCanCallEveryRBACGatedEndpoint` — same setup; POST to `/api/permissions/{id}/policies` (a `PERMISSION_*_MANAGE`-gated endpoint per SecurityConstants.SECURITY_RULES); assert HTTP 200 (the current intentional wide-open posture). Then for the OPPOSITE auth mode, configure `auth.type=OAUTH2` with stub OAuth provider, authenticate `alice` without any Policy assignment, POST same endpoint, assert HTTP 403 (the OAUTH2 enforcement contract).

  Add a `// REGRESSION-PIN — LOGIN_FORM hardcodes ADMIN for every authenticated user AND omits AuthorizationCustomizer. The two facts compose into compound wide-open posture. This test asserts the INTENTIONAL absence of authorization gates under LOGIN_FORM so a future maintainer wiring AuthorizationCustomizer "to match OAuth/LDAP" trips this test and must explicitly update it AND update live /enable-security/authorization docs.` comment block.

  Pair with: (a) DOC-GAP-NNN — live `/enable-security/authorization` page must name the AUTH_MODE precondition (OAUTH2/LDAP only); (b) REFACTOR-073 follow-up (a fail-fast boot warning when LOGIN_FORM is active AND the operator has configured Policies — emit log.warn naming the disconnect).
