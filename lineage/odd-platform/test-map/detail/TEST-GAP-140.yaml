behaviour: '**REFACTOR-073 validated**: LOGIN_FORM runs WITHOUT `AuthorizationCustomizer(permissionService,
  extractors)` wiring. `LoginFormSecurityConfiguration.java:55-57` configures only
  `.pathMatchers(permittedPaths).permitAll().pathMatchers("/**").authenticated()`.
  Every form-authenticated user can call every endpoint regardless of any Policy/Permission/Role
  configured via the platform UI. Live `/enable-security/authorization` describes
  the framework without naming the precondition (OAUTH2 or LDAP). HIGH per concept.'
