behaviour: 'DISABLED + S2S silent ignore: with `auth.type=DISABLED` and `auth.s2s.enabled=true`,
  the S2sAuthenticationFilter is NOT wired. The DISABLED config does not read the
  `auth.s2s.enabled` property — operator who configures S2S thinking they get an additional
  filter, but runs DISABLED, gets no filter and no warning.'
