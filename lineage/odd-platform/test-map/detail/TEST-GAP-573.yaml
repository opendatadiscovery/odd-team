behaviour: |-
  **No audit logging on role mutations at the repository or service layer.** ReactiveRoleRepositoryImpl.java:1-94 has NO `@Slf4j`-emitted log lines on create/update/delete. RoleServiceImpl.java:39-92 has NO log lines, NO event publication, NO insert into any audit table. A privileged caller (or an S2S API-key holder per REFACTOR-108 from batch E) who creates / mutates / deletes Roles leaves NO TRAIL in the platform's logs. The activity feed (`/api/activity`) does NOT extend to Role / Policy / Permission mutations (cross-axis observation — confirmed across batches E, F, H, N — 4-sidecar pattern). This is the highest-leverage audit gap in the RBAC surface, REPEATED across four sidecars — and now CONFIRMED on the Role-repository side.
