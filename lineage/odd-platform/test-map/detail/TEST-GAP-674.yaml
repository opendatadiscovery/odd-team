proposed_action: |-
  Repository-layer integration test. (a) Create two INTERNAL fields via `bulkCreate`: `cost_centre` and `Cost_Centre`. (b) Call `listInternalMetadata("cost")`. Assert: BOTH fields returned (case-insensitive substring). (c) Call `listByKey(Set.of(new MetadataKey("cost_centre", STRING)))`. Assert: only `cost_centre` returned (case-sensitive equality). (d) Call `listByKey(Set.of(new MetadataKey("Cost_Centre", STRING)))`. Assert: only `Cost_Centre` returned. (e) Pin the asymmetry with a comment: `// REGRESSION-PIN — Substring search is case-insensitive; exact lookup is case-sensitive. A user typing differently-cased metadata names creates distinct rows. REFACTOR-NNN will canonicalise via lowercase normalisation; this test flips to assert canonical case.`
