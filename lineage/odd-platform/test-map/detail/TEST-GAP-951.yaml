proposed_action: |-
  Author RelationshipControllerIdParamSemanticsTest as a @SpringBootTest +
  WebTestClient harness with a seeded relationship row whose
  data_entity.id ≠ relationships.id (e.g. data_entity.id=100,
  relationships.id=42). Three cases:
  (a) call with relationships.id=42 → assert current behaviour (404) AND
  fail-loud after the fix lands (becomes 200);
  (b) call with data_entity.id=100 → assert current behaviour (200) AND
  must remain 200 after the maintainer migrates the contract;
  (c) symmetric Graph variant.
  Plus a fourth case for the schema-admits-multi-row sub-case
  (V0_0_87 has no UNIQUE on relationships.data_entity_id): seed two
  rows with the same data_entity_id and assert the detail endpoint
  returns a single deterministic row OR fails cleanly (per the mono()
  expected-one-row contract).
