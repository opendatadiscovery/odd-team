proposed_action: |-
  Add `DataSourceUpdateNotFoundTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `updateDataSource_neverExistedId_returns404NotSilent200` — PUT /api/datasources/999999999 with a valid DataSourceUpdateFormData body; assert HTTP 404 (NotFoundException), explicitly assert it is NOT 200.
  2. `updateDataSource_softDeletedId_returns404` — register a data source, DELETE it (soft-delete), then PUT the same id with a valid body; assert HTTP 404 (the getDto `deleted_at IS NULL` filter excludes the soft-deleted row).
  3. `updateDataSource_missingId_mutatesNoRow` — after the 404 in #1, assert (via raw DB query) that no `data_source` row was inserted or modified.

  These tests PIN the anti-silent-write guard. A regression adding a
  `switchIfEmpty(Mono.just(...))` fail-soft to `DataSourceServiceImpl.update` — copying the
  `DataEntityServiceImpl.upsertDescription` silent-200 pattern — inverts tests #1-#2.
