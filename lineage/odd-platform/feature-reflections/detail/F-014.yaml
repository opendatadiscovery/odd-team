- id: H-001
  hypothesis: "When user A (authenticated, with NO ownership of data entity X) calls GET /api/dataentities/{X-id}/alerts, the platform either denies the read or scopes it — A cannot read the full alert history of an entity they have no ownership association with."
  derivation: "Endpoint-shape + P-09 security posture: the path lives under the data-entity namespace and the SIBLING mutation (alert_config PUT) IS permission-gated; a senior PO expects the read to be at least owner-scoped, the way the doc names 'owners' for the My Objects tab filter."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The read is fully cross-owner. The endpoint has NO @PreAuthorize, NO entry in SecurityConstants.SECURITY_RULES
      for the GET path (SecurityConstants.java:98-355 contains only mutations), and falls through to the catch-all
      pathMatchers("/**").authenticated() (AuthorizationCustomizer.java:29-30). The downstream SQL at
      ReactiveAlertRepositoryImpl.getAlertsByDataEntityId (lines 182-199) is WHERE DATA_ENTITY.ID = :id with NO
      OWNERSHIP join and NO principal-derived predicate — in deliberate structural contrast to listByOwner (lines
      160-178) which DOES .join(OWNERSHIP). Any authenticated caller who learns a data_entity_id (via search,
      directory, getDataEntityDetails) reads every alert ever raised on that entity, including alert chunks that
      carry raw AlertManager-derived generator-URL text. This is the REFACTOR-024 read-collaborative posture applied
      to a per-entity surface.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityAlerts.md
        section: security.known_security_gaps[0] + security.owner_scoping
        cite: "DataEntityController.java:315-321 + SecurityConstants.java:98-355 + AuthorizationCustomizer.java:29-30 + ReactiveAlertRepositoryImpl.java:182-199"
        note: "no rule entry; catch-all .authenticated(); SQL has no OWNERSHIP join"
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveAlertRepositoryImpl.md
        section: downstream_side_effects (getAlertsByDataEntityId row) + bugs_limitations_corner_cases[0]
        cite: "ReactiveAlertRepositoryImpl.java:182-199 vs 160-178"
        note: "getAlertsByDataEntityId no owner predicate; listByOwner DOES join OWNERSHIP — the asymmetry confirms the unscoped intent"
    operator_visible_failure: |
      Two failure modes. (a) Cross-owner enumeration: an attacker (or a curious authenticated user) iterates
      data_entity_id and reads the complete alert history of every catalogued entity across every team — including
      alert chunk descriptions that can leak internal monitoring host names (Prometheus generator URLs). (b) The
      compliance trap: the live page recommends THIS endpoint as the audit-export workaround; an operator wiring it
      into a compliance pipeline for "their" entities is using an endpoint with no owner notion, so the export
      systematically reaches across owners — the opposite of what "export my entity's audit trail" implies.
