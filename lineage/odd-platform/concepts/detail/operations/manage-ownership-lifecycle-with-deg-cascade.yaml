name: Manage Ownership Lifecycle (create/update/delete with DEG cascade)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-08
- P-09
description: |-
  **NEW OPERATION, batch 2026-05-19K** — the service-tier orchestration
  operation for the full ownership lifecycle. Three @ReactiveTransactional
  + @ActivityLog-annotated public methods on `OwnershipServiceImpl`:
    1. **`create(long dataEntityId, OwnershipFormData form)`** (lines
       47-74) — `Mono.zip(ownerService.getOrCreate(form.getOwnerName()),
       titleService.getOrCreate(form.getTitleName()))` auto-creates
       Owner + Title if missing → `ownershipRepository.create(ownership)`
       INSERT (UNIQUE constraint on data_entity_id + owner_id) →
       conditional DEG-propagation via propagateIfDEG(CREATE) →
       searchEntrypointRepository.updateChangedOwnershipVectors →
       dataEntityFilledService.markEntityFilled(OWNERS) → mapDto.
    2. **`delete(long ownershipId, Boolean propagate)`** (lines 76-97) —
       ownershipRepository.delete(ownershipId) hard-DELETE → conditional
       DEG-propagation via propagateIfDEG(DELETE) → re-query
       getOwnershipsByDataEntityId; if empty list, markEntityUnfilled(OWNERS).
       NO search-vector refresh on delete (latent staleness in FTS).
    3. **`update(long ownershipId, OwnershipUpdateFormData form)`** (lines
       99-119) — ownershipRepository.get(ownershipId) (NotFound check) →
       titleService.getOrCreate(form.getTitleName()) auto-creates Title if
       missing → ownershipRepository.updateTitle(ownershipId, titleId) →
       conditional DEG-propagation via propagateIfDEG(CREATE — note:
       CREATE-side branch reuses createOrUpdate UPSERT semantics for
       title overwriting on existing child rows) → search-vector refresh
       → ownershipRepository.get(ownershipId) re-fetch (second get for
       response payload).
  **DEG cascade** (`propagateIfDEG` at lines 121-132 + `propagateOwnership`
  at lines 134-149) is OPT-IN via `form.propagate: Boolean`, gated by
  `DATA_ENTITY_GROUP` entity-class membership on the target. Non-DEG
  target with propagate=true is silent no-op (NOT error). CREATE-side
  cascade routes to `ownershipRepository.createOrUpdate` (title-overwriting
  UPSERT via onConflictOnConstraint.doUpdate.set(TITLE_ID, EXCLUDED));
  DELETE-side cascade routes to `ownershipRepository.deleteByDataEntityAndOwner`
  (operator-precedence-safe OR-chain of AND-pairs). **NO service-tier
  permission check** (lines 35-37) — authorization is enforced UPSTREAM
  at SecurityConstants.SECURITY_RULES[215-227]. **No principal inference**
  — owner_name is taken VERBATIM from the form. The architectural
  posture: 'who can the caller grant to' decision belongs to the upstream
  Policy resolver; 'to whom is the ownership granted' is a CALLER
  decision (the form's owner_name). Self-grant is decoupled from upstream
  authorisation. **CROSS-BATCH CORRECTION** (per batch H + batch K):
  the batch-F createOwnership sidecar's claim of "5xx duplicate-key
  surface" is INCORRECT — actual surface is HTTP 400 USR003 via
  ExceptionUtils.translateDatabaseException →
  UniqueConstraintException("Ownership for this data entity and owner
  already exists") → ControllerAdvice.handleUniqueConstraint →
  HttpStatus.BAD_REQUEST.
