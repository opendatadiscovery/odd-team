# Term Linked-Columns Tab — product-owner reflection

## product_owner_narrative

The **Linked Columns tab** is one of the three reverse-lookup surfaces on a Term's detail page in the Business Glossary (pillar P-06, "operator-curated term entities … reverse-look-up every entity tied to a Term" per `system-mission.md:185-186`). Where the Term page's other tabs answer "what does this term mean and own", the Linked Columns tab answers the governance question that makes a glossary load-bearing: **"which dataset fields across the entire catalog have been linked to this term?"** A steward who has defined a `PII` term, or a `Revenue` term, opens this tab to see every column that has been tagged with that concept — the audit surface for "where does this sensitive/regulated concept actually live in our data". The tab is reached at the UI route `/terms/:termId/linked-columns` and is rendered by `LinkedColumnsList` (per `LinkedColumnsList.tsx:1-99`, read this run).

A user interacts with it in two ways. On opening the tab, the list loads automatically (a `useEffect` fires the query's `refetch` on mount — `LinkedColumnsList.tsx:29-31`). There is a single search box at the top-left; typing into it does NOT live-filter — the user must press Enter or click the search icon to apply the filter (`LinkedColumnsList.tsx:33-49`, and confirmed by the hook's `enabled:false` + `queryKey` that omits `query` at `terms.ts:36-43`). Each result row shows five columns: the field **Name**, its **Dataset**, the **Namespace**, the **Datasource**, and the **Owner** (the five `TermLinkedColumnsResultsTableHeader` labels at `LinkedColumnsList.tsx:52-68`). When the term has no linked columns, an empty-state "No linked columns" placeholder renders (`LinkedColumnsList.tsx:89-93`).

The working parts, as the user experiences them: a reverse-lookup list, a name-search filter applied on explicit trigger, and an infinite-scroll table that — on paper — pages through large result sets. The route through the code is unusual and worth naming: although this is a *Term* page tab, the controller method `getTermLinkedColumns` does NOT delegate to the Term service — it delegates to **`DatasetFieldService.listByTerm`** (per the `TermController` sidecar, operations, `getTermLinkedColumns` at controller `:111`). The dataset-field side owns the list shape. That repository query (`ReactiveDatasetFieldRepositoryImpl.listByTerm:141-204`, read this run) correctly scopes the result to the term — it joins `dataset_field_to_term` and filters `.where(DATASET_FIELD_TO_TERM.TERM_ID.eq(termId))` at line 196 — and applies a `limit(size).offset((page-1)*size)` page window with `size=50`.

This feature integrates with the wider catalog along the read-collaborative posture (`system-mission.md:267` — "every authenticated user can enumerate the entire catalog"): every authenticated user sees every dataset field linked to the term, across every namespace and owner, with no per-team scoping at the controller or repository tier (consistent with the `TermController` sidecar's `owner_scoping: BYPASSES` finding). The reverse-lookup is fed by the term-linkage write surface — both the explicit `POST /api/datasetfields/{id}/terms` link and the `[[ns:term]]` description-mention auto-link side-channel (`TermServiceImpl` sidecar) — so a column linked silently via a description edit surfaces here exactly like a manually-linked one.

The edge cases a product owner would flag in a demo are the load-bearing ones for this reflection. First, the pagination: the InfiniteScroll's `next` callback is a literal noop (`next={() => {}}` at `LinkedColumnsList.tsx:77`), and — the part no single sidecar saw — the backend list mapper hard-codes `pageInfo.hasNext = false` (`DatasetFieldListMapperImpl.java:48`, `new PageInfo(total, false)`). So a term with 51+ linked fields shows only the first 50, the user gets NO "more available" signal, and there is no way to reach columns 51+ from the UI at all. Second, the `pageInfo.total` the UI reads is NOT the catalog-wide count of linked fields — it is the row count of the current page (`dataFieldsDto.size()` at `DatasetFieldListMapperImpl.java:23`) — so the UI cannot even display "showing 50 of N". Third, the reverse-lookup query materialises the entire `dataset_field` table in a CTE before the term join narrows it (`ReactiveDatasetFieldRepositoryImpl.java:151-156, 191-196`), an unbounded cost that the 50-row cap masks.

