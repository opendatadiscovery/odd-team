proposed_action: |-
  Author PermissionControllerSpecConformanceTest pinning each of the four
  PermissionResourceType enum values' outcomes: DATA_ENTITY/TERM/QUERY_EXAMPLE
  → 200 with deserialisable Permission list (for valid resourceId);
  MANAGEMENT → 400 with USR001 + literal error body. A refactor that moves
  the hasContext check from service to controller (or vice versa) would
  silently flip MANAGEMENT to 200 or 500; only this test catches the
  discriminator-invariant relocation. Add a future-extractor-missing assertion
  (a hypothetical new PolicyTypeDto value with hasContext=true and no
  extractor bean) → assert 500 SYS001 today, suggest fix to 400 USR001 via
  IllegalArgumentException handler in ControllerAdvice.
