proposed_action: 'Add unit test on `MapReactiveUserDetailsService` user lookup: authenticate
  with any valid credential pair from `auth.login-form-credentials`; assert the resulting
  `Authentication.authorities` contains `UserProviderRole.ADMIN`. Pin the ADMIN-grant
  contract; a future per-user-role refactor would either pass or fail the test deliberately.'
