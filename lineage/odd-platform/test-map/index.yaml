- gap_id: TEST-GAP-007
  behaviour: 'Reopen-conflict path: caller sends OPEN while another OPEN alert of
    the same type exists for the same data entity → 400 BadUserRequestException (AlertServiceImpl.java:128-129).
    The reopen-guard is read-then-write without serialisable fence — two concurrent
    OPEN requests for sibling alerts on same entity can both pass the guard. STRENGTHENED
    batch H — the repository sidecar confirms `openAlertWithTheSameTypeExistsForDataEntity`
    is a read-only SELECT EXISTS over a self-join CTE (lines 397-420); the service-level
    `updateStatus` reads-then-writes without SELECT FOR UPDATE; there is NO `UNIQUE
    (data_entity_oddrn, type) WHERE status = OPEN` partial-index constraint to back-stop
    the race. The repository confirms the SQL shape that produces the race. STRENGTHENED
    batch I — the AlertServiceImpl sidecar primary-source confirms BOTH (a) the error
    message string is part of the user-facing contract (`Cannot reopen alert since
    the system already has an open alert of the same type`) and is unpinned, AND (b)
    the race window: both `openAlertWithTheSameTypeExistsForDataEntity` (read) and
    `updateAlertStatus` (write) are unfenced at every layer. The application invariant
    ''one OPEN alert of the same type per data entity'' is server-enforced application
    logic with NO DB-level constraint. Implicit_adrs.[2] captures the deliberate trade-off:
    tolerate brief invariant violation under concurrency to keep schema simple and
    error UX human-readable.'
  test_class: missing-edge-case
  criticality: HIGH
