description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20U — REFINES the existing
  f-006-audit-silence-schema-rooted-data-entity-id-not-null-fk invariant
  (batch R) by surfacing a DEEPER architectural layer that constrains
  the audit surface. Where the schema-rooted invariant captured the
  data_entity_id NOT NULL FK as the row-level structural impossibility,
  this invariant captures the ActivityEventTypeDto enum as the
  TYPE-LEVEL structural impossibility — beyond what the schema permits,
  the enum's value set is the SECOND structural gate that determines
  which events can fire at all.

  THE ENUM-ROOTED EVIDENCE (TermServiceImpl batch U sidecar — primary source):

    ActivityEventTypeDto.java:3-31 is the enum that every @ActivityLog
    annotation must reference. Verified by Grep:
      grep -n 'TERM_CREATED|TERM_UPDATED|TERM_DELETED|TAG_CREATED|NAMESPACE_CREATED'
      against ActivityEventTypeDto.java returns ZERO matches.

    The enum DEFINES (per the 20-named + 7-categorical = 27 enum
    reconciliation invariant from batch T):
      - DATA_ENTITY_* lifecycle events (4 named values)
      - OWNERSHIP_* events (3)
      - TAG_ASSIGNMENT_UPDATED (1 — the LINK-changes-on-tags event,
        NOT the tag-itself lifecycle)
      - TERM_ASSIGNMENT_UPDATED (1 — the LINK-changes-on-terms event,
        NOT the term-itself lifecycle)
      - DATASET_FIELD_* events (5)
      - CUSTOM_GROUP_* events (2)
      - ALERT_* events (4)
      - the 7 hidden internal types (DATA_ENTITY_OVERVIEW_UPDATED,
        DATA_ENTITY_METADATA_UPDATED, DATA_ENTITY_SCHEMA_UPDATED,
        DATA_ENTITY_RELATION_UPDATED, CUSTOM_METADATA_CREATED/UPDATED/DELETED)

    The enum DOES NOT DEFINE:
      - TERM_CREATED, TERM_UPDATED, TERM_DELETED — Term lifecycle events
      - TERM_DESCRIPTION_UPDATED, TERM_TAGS_UPDATED — Term content events
      - NAMESPACE_CREATED, NAMESPACE_DELETED — Namespace lifecycle
      - TAG_CREATED, TAG_DELETED — Tag lifecycle (the bare entity, not
        the link)
      - POLICY_CREATED, POLICY_UPDATED, POLICY_DELETED — RBAC events
      - ROLE_CREATED, ROLE_UPDATED, ROLE_DELETED — RBAC events
      - OWNER_CREATED, OWNER_UPDATED, OWNER_DELETED — Directory events
      - COLLECTOR_TOKEN_REGENERATED — Operational events
      - DATASOURCE_REGISTERED — Ingestion events

  THE TWO STRUCTURAL CONSTRAINTS — distinct but compounded:

    Layer 1 — SCHEMA-ROOTED (batch R primary source):
      activity.data_entity_id NOT NULL FK at V0_0_48__add_activity.sql:4, 12.
      Any event without a data_entity_id CANNOT be inserted into the
      activity table — the row-level structural barrier.

    Layer 2 — ENUM-ROOTED (batch U primary source — THIS INVARIANT):
      activity.event_type column references ActivityEventTypeDto values
      via Java enum-to-VARCHAR mapping. Any event whose type is NOT
      defined in the enum CANNOT be emitted via @ActivityLog (the
      annotation processor would fail at compile time) AND CANNOT be
      queried by the activity feed's event_type filter — the type-level
      structural barrier.

  WHY THIS IS A DISTINCT FINDING (not a duplicate of schema-rooted):

    A maintainer wanting to add Term-lifecycle audit must clear BOTH
    layers:

      (a) Extend ActivityEventTypeDto with new enum values (TERM_CREATED,
          TERM_UPDATED, TERM_DELETED, etc.) — adds Java code + OpenAPI
          components.yaml entry + frontend TypeScript definition (the
          generated-sources chain).

      (b) Either:
          (b.i) Provide a data_entity_id for every Term event — but
                Terms are NOT data entities (they have their own term.id
                primary key in a separate table). Term lifecycle does
                NOT correspond to any data_entity row. There is no
                natural data_entity_id to provide; faking one (e.g.
                pointing at the data-entity-zero row) corrupts the
                read-side INNER JOIN to data_entity at
                ReactiveActivityRepositoryImpl.java:219. NOT a viable
                path.
          (b.ii) Make activity.data_entity_id NULLABLE + add a
                 discriminator column (per the batch-R invariant's
                 remediation option a). Schema migration that breaks
                 every existing read path's INNER JOIN assumption.
          (b.iii) Create a separate audit surface (e.g. catalog_audit
                  table) with its own FK shape (per batch-R remediation
                  option b). Means TWO audit surfaces and the Activity
                  Feed UI needs to merge them.

    Neither (b.i), (b.ii), nor (b.iii) is fixable by just extending the
    enum. The enum extension is NECESSARY but INSUFFICIENT — any
    end-to-end audit-coverage fix for Term + Tag + Namespace + RBAC
    lifecycle requires SIMULTANEOUS work at BOTH the enum AND the
    schema. This invariant captures the enum-half so future maintainers
    do not under-scope a 'just add @ActivityLog' fix attempt.

  THE TERM-SPECIFIC MANIFESTATION (batch U primary source):

    TermServiceImpl batch U sidecar — concepts.entities,
    bugs_limitations_corner_cases.[16] F-006-audit-silence-enum-rooted:

      Six TermServiceImpl mutator methods carry no @ActivityLog:
        createTerm (TermServiceImpl.java:99-117)
        updateTerm (TermServiceImpl.java:121-145)
        delete (TermServiceImpl.java:154-165)
        upsertTags (TermServiceImpl.java:253-264)
        linkTermWithTerm (TermServiceImpl.java:289-294)
        removeTermToLinkedTermRelation (TermServiceImpl.java:297-302)

      Six other TermServiceImpl mutator methods DO carry @ActivityLog
      (and those compile cleanly):
        linkTermWithDataEntity, removeTermFromDataEntity (lines 169, 183)
        handleDataEntityDescriptionTerms (line 200)
        linkTermWithDatasetField, removeTermFromDatasetField (lines 211, 225)
        handleDatasetFieldDescriptionTerms (line 243)

    The six annotated methods all use TERM_ASSIGNMENT_UPDATED or
    DATASET_FIELD_TERM_ASSIGNMENT_UPDATED — both ARE in the enum because
    they're LINK events between a term and a data-entity (where a
    data_entity_id is the natural FK target). The six unannotated
    methods cover Term-itself lifecycle (CRUD), Term-tags upsert,
    and Term-to-Term linkage — events without a natural data-entity
    binding AND events whose type values do not exist in the enum.

    A maintainer adding @ActivityLog(TERM_CREATED) to createTerm would
    FAIL TO COMPILE — TERM_CREATED does not exist as an enum value.
    The schema absence forces the maintainer to extend the enum first;
    the schema's NOT NULL FK then forces them to choose a data_entity_id
    (or extend the schema). The two layers compound; a maintainer
    discovers them serially, not at once.

  THE BROADER ENUM-ROOTED COVERAGE:

    TAG_CREATED, NAMESPACE_CREATED — NOT in enum. The tag-side door
    via upsertTags (TermServiceImpl.java:257) and the namespace-side
    door via createTerm and updateTerm (TermServiceImpl.java:103, 138)
    therefore have NO audit trail by structural impossibility — even
    a maintainer wanting to audit them would have to extend the enum
    AND solve the data_entity_id question.

    POLICY_*, ROLE_*, OWNER_*, COLLECTOR_TOKEN_*, DATASOURCE_* — NOT
    in enum. The 9-sidecar F-006 audit-silence pattern (master
    invariant) covers these surfaces with the schema-rooted layer; the
    enum-rooted layer is the SECOND structural barrier for ALL of
    them.

  THE COMPLETENESS — three-layer F-006 audit silence model:

    Layer 1 (UI tier — 5 batch-Q sidecars):
      no console.log, no analytics, no audit affordance.
    Layer 2 (Service tier — 5 batch-S sidecars + 6 batch-U TermServiceImpl methods):
      no @ActivityLog annotations on RBAC + Term/Tag/Namespace mutators.
    Layer 3 (SQL tier — 3 batch-H/N/R sidecars):
      no audit writes from RBAC repository implementations.
    Layer 4 (Schema tier — batch-R primary source):
      activity.data_entity_id NOT NULL FK structurally blocks any
      event without a data-entity binding.
    Layer 5 (Type tier — batch-U primary source — THIS INVARIANT):
      ActivityEventTypeDto enum does not define event values for any
      of the affected surfaces.

    The five layers together are why the F-006 audit-silence pattern
    is STRUCTURALLY UNFIXABLE without coordinated work at every layer.
    A maintainer adding @ActivityLog at Layer 2 hits Layer 5 first
    (enum value missing — compile fails). Adding the enum value hits
    Layer 4 next (FK NOT NULL — insert fails). Adding the schema
    migration hits the existing Layer 3 read paths (INNER JOIN to
    data_entity — read fails). The fix scope is at MINIMUM:
      (1) Enum extension.
      (2) Schema migration (NULL FK + discriminator OR separate audit
          table).
      (3) Service-tier annotations.
      (4) Read-path queries reshaped.
      (5) UI surfaces extended.

    The five-layer scope explains why retrofitting audit coverage on
    Term / Tag / Namespace / RBAC mutations is a non-trivial design
    decision, not a maintenance follow-up.

  SEVERITY HIGH — same severity as the schema-rooted invariant; this
  invariant ADDS to the existing finding rather than refining its
  severity. The combined enum+schema barrier explains the operational
  consequence: an operator who deletes a term has no forensic trace
  in the Activity feed AT ALL because the platform's architecture
  forbids the event from existing.
