      authorization_consistency:
        verdict: INCONSISTENT
        detail: "The four `auth.type` modes have asymmetric authentication AND authorization wiring. **OAUTH2 + LDAP wire AuthorizationCustomizer** (Policies/Permissions/Roles/Owners framework) — `OAuthSecurityConfiguration.java:98` and `LDAPSecurityConfiguration.java:145` both call `.authorizeExchange(new AuthorizationCustomizer(permissionService, extractors))`. **LOGIN_FORM does NOT wire AuthorizationCustomizer** — `LoginFormSecurityConfiguration.java:55-57` runs `.authorizeExchange(... .pathMatchers(\"/**\").authenticated())` only; combined with `getAuthorities(true)` at line 81 every form-authenticated user is ADMIN. **DISABLED bypasses both** (`DisabledAuthSecurityConfiguration.java:13-18` is `.anyExchange().permitAll()`). The composite AuthorizationManagerCondition correctly maps the OAUTH2-or-LDAP disjunction but is dead code. (Per-mode wiring matrix verified across the four canonical *SecurityConfiguration sidecars: AuthorizationManagerCondition@L11.md:bugs_limitations_corner_cases.[0,1] + LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[0] + OAuthSecurityConfiguration@L71.md:implicit_adrs.[0] + LDAPSecurityConfiguration@L51.md:implicit_adrs.[AuthorizationCustomizer mode-agnostic])"
      owner_scoping:
        verdict: MIXED
        detail: "Auth Mode itself is not data-scoped; the modes determine WHETHER any owner-scoping downstream applies. Under DISABLED, no owner-scoping (no authenticated principal). Under LOGIN_FORM, owner-scoping requires authentication only — but every user is ADMIN, so the Policies/Permissions/Roles/Owners framework is inert. Under OAUTH2/LDAP, owner-scoping operates via the Policies/Permissions/Roles/Owners framework gated by AuthorizationCustomizer."
      strengths:
        - "Four explicit modes declared in `application.yml:33` as a YAML comment (`# DISABLED, LOGIN_FORM, OAUTH2, LDAP`) — operators reading the file see the enumeration"
        - "Default value `DISABLED` is in `application.yml:34` (not absent) — explicit choice, not accidental"
        - "Mutually-exclusive `@ConditionalOnProperty(value=\"auth.type\", havingValue=\"...\")` on the four SecurityConfiguration classes — clean Spring idiom (DisabledAuthSecurityConfiguration.java:10 + LoginFormSecurityConfiguration.java:31 + OAuthSecurityConfiguration.java:71 + LDAPSecurityConfiguration.java:51 — parallel structure consistently authored across the four files)"
        - "DISABLED mode is INTENTIONALLY an explicit-chain construction (not a no-bean fall-through to Spring autoconfig) — `DisabledAuthSecurityConfiguration.java:13-18` carries the permit-all chain in code so the posture is statement-of-intent rather than emergent. (DisabledAuthSecurityConfiguration@L10.md:implicit_adrs.[1])"
        - "Live `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security` enumerates the four values verbatim; per-mode sub-pages exist for DISABLED / LOGIN_FORM / OAUTH2 / LDAP / S2S"
        - "OAUTH2 + LDAP both apply `AuthorizationCustomizer` and run at `Ordered.HIGHEST_PRECEDENCE` (LDAP) — production modes carry the strongest enforcement; the asymmetry is downward (LOGIN_FORM ↓ DISABLED)"
      weaknesses:
        - "**4-sidecar triangulated insecure-default failure mode (HIGH severity)** — FOUR independent sidecars converge on the same operator trap: (a) `application.yml:34` ships `auth.type: DISABLED` as the default (DisabledAuthSecurityConfiguration@L10 + AppInfoController@L18 + AuthorizationManagerCondition@L11 all anchor on this; DisabledAuthSecurityConfiguration is the CANONICAL evidence — the chain is literally `.csrf(...disable).anyExchange().permitAll()` with no CORS, no AuthorizationCustomizer, no S2S wiring); (b) `application.yml:48` ships `auth.ingestion.filter.enabled: false` (IngestionDataEntitiesFilter@L20 not registered → `/ingestion/entities` unauthenticated regardless of `auth.type`); (c) NO `matchIfMissing=true` on any of the four `*SecurityConfiguration` classes' `@ConditionalOnProperty` — operator unsetting `auth.type` (env `AUTH_TYPE=`) or typoing it (`disabled` lowercase, `DSIABLED`) silently produces NO SecurityWebFilterChain from any of the four; (d) DISABLED is ALSO silent — no `@Slf4j` boot WARN tells the operator the deployment is unauthenticated (DisabledAuthSecurityConfiguration has no logger imports vs LDAPSecurityConfiguration which IS `@Slf4j`). Live `disabled-authentication` page declares it 'the default configuration' with a single 'DO NOT use in your production environment!' admonition but does NOT enumerate the blast radius (no CSRF, no CORS, no audit, no S2S, `/actuator/{health,prometheus,env,info}` reachable). Canonical LSN-001/002-shape failure. (DisabledAuthSecurityConfiguration@L10.md:security.known_security_gaps.[0-5] + AppInfoController@L18.md:security.known_security_gaps.[0,1,2] + AuthorizationManagerCondition@L11.md:security.known_security_gaps.[1,2] + IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[0,3])"
        - "**LOGIN_FORM runs WITHOUT AUTHORIZATION (HIGH severity — REFACTOR-073 validated)** — `LoginFormSecurityConfiguration.java:55-57` configures `.authorizeExchange(... .pathMatchers(permittedPaths).permitAll().pathMatchers(\"/**\").authenticated())` only; it does NOT wire `new AuthorizationCustomizer(permissionService, extractors)` the way OAuth (line 98) and LDAP (line 145) do. Every form-authenticated user can call every endpoint regardless of any Policy/Permission/Role configured via the platform UI. Combined with `getAuthorities(true)` at line 81 (every LOGIN_FORM user is ADMIN), the effective posture is 'any valid credential pair = full platform access'. Live `/enable-security/authorization` describes the framework without naming the precondition (OAUTH2 or LDAP). An operator running LOGIN_FORM in production (against docs' dev-only guidance but plausible) inherits authenticated-but-fully-authorized. (LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[0] + security.known_security_gaps.[0])"
        - "**S2S composes-not-mutex — X-API-Key grants ADMIN across all /** paths under LOGIN_FORM/OAUTH2/LDAP (HIGH severity)** — `S2sAuthenticationFilter.java:31-39` hard-codes `User.withUsername(\"ADMIN\")...roles(\"ADMIN\")` (admin=true) on a valid `X-API-Key` match. The filter is added at `SecurityWebFiltersOrder.HTTP_BASIC` order in EACH of the three interactive modes (`LoginFormSecurityConfiguration.java:61-63` + `OAuthSecurityConfiguration.java:108-110` + `LDAPSecurityConfiguration.java:149-151`), and runs BEFORE the interactive-auth challenge. So when an operator enables `auth.s2s.enabled=true` alongside any of LOGIN_FORM/OAUTH2/LDAP, a single shared `auth.s2s.token` string grants ADMIN across the ENTIRE `/**` UI/API surface (not just `/ingestion/entities` which has its own separate `IngestionDataEntitiesFilter`). Under DISABLED, S2S is silently ignored (DisabledAuthSecurityConfiguration does not read `auth.s2s.enabled`). Live `enable-security/authentication/s2s` page confirms 'they can call any endpoint that admins can call' but the per-mode `oauth2-oidc` / `login-form` / `ldap` pages do NOT cross-link or warn. (OAuthSecurityConfiguration@L71.md:bugs_limitations_corner_cases.[5] + security.known_security_gaps.[0] + LDAPSecurityConfiguration@L51.md:bugs_limitations_corner_cases.[S2S admin everywhere] + LoginFormSecurityConfiguration@L31.md:implicit_adrs.[2] + DisabledAuthSecurityConfiguration@L10.md:bugs_limitations_corner_cases.[2])"
        - "**LDAP substring-collision admin escalation (HIGH severity)** — `LDAPSecurityConfiguration.java:96` uses `containsIgnoreCase` (a SUBSTRING matcher imported from `OperationUtils` at line 48) for admin-group matching, NOT `Set::contains` over equality. An admin-groups config of `['Admin']` matches `cn=Administrators` AND `cn=NonAdminContractors`. Configuring `admin-groups: ['ops']` may inadvertently promote anyone in a group named `devops`, `noops`, or `oopsgroup`. Live LDAP docs only say 'A list granting admin permissions' — no warning. (LDAPSecurityConfiguration@L51.md:bugs_limitations_corner_cases.[containsIgnoreCase substring collision] + security.known_security_gaps.[substring admin match])"
        - "**LDAP plaintext-on-wire + actuator credential leak (HIGH severity)** — `LDAPSecurityConfiguration.java:117-124` accepts the `auth.ldap.url` verbatim with NO scheme enforcement: `ldap://` URLs cause bind credentials + every end-user login credential to travel in cleartext. `auth.ldap.password` is bound via `@ConfigurationProperties + @Data` on `ODDLDAPProperties` and surfaces in `/actuator/env` (Spring's default sanitisation masks `password`-suffixed keys but the key NAMES leak; combined with WHITELIST_PATHS including `/actuator/**`, the actuator port is on the same HTTP port as the app with no auth gate). Live LDAP docs do not surface either the LDAPS-vs-LDAP distinction or the actuator credential exposure. (LDAPSecurityConfiguration@L51.md:security.known_security_gaps.[no LDAPS enforcement] + security.known_security_gaps.[actuator env password])"
        - "**LOGIN_FORM open-redirect surface on `auth.login-form-redirect` (MEDIUM severity)** — `LoginFormSecurityConfiguration.java:41` reads the raw string with `@Value(\"${auth.login-form-redirect:}\")`, line 89 invokes `URI.create(redirectUri)` without validating scheme/host/path, and line 46 invokes `DefaultServerRedirectStrategy().sendRedirect(...)`. No allowlist. Plus session cookie has no `Secure`/`HttpOnly`/`SameSite` configured at this layer, and `spring.session.timeout: -1` makes sessions never expire. (LoginFormSecurityConfiguration@L31.md:security.known_security_gaps.[1,3])"
        - "**LOGIN_FORM plaintext credentials leak via /actuator/env (MEDIUM severity)** — `auth.login-form-credentials` is resolved at boot as a plain string; `management.endpoint.env.enabled: true` is the shipped default; `/actuator/health` is permit-all'd by LOGIN_FORM at line 50. If the operator inadvertently exposes the management port to the network, credentials leak. (LoginFormSecurityConfiguration@L31.md:security.known_security_gaps.[2])"
        - "**OAUTH2 Provider enum incomplete vs live docs (HIGH severity for affected operators)** — `Provider.java:3-5` lists `COGNITO, GITHUB, GOOGLE, ODD_IAM, AZURE` (5 values), but the live `/oauth2-oidc` docs document Okta + Keycloak + 'Custom OIDC providers' as supported. Okta/Keycloak operators authenticate via generic OIDC but receive (a) no provider-specific user enrichment (`auth/handler/impl/` contains only GoogleUserHandler + GithubUserHandler) — admin-group claim mapping silently absent; (b) no provider-specific logout (fallback to OIDC-initiated logout only). Drift between code and live docs. (OAuthSecurityConfiguration@L71.md:bugs_limitations_corner_cases.[4] + security.known_security_gaps.[3])"
        - "**OAUTH2 Azure logout-uri unchecked despite docs flagging required (MEDIUM)** — `ODDOAuth2Properties.validate()` only checks `clientId` and `provider` for non-empty; `logoutUri` and `azureTenantId` are unchecked. Live `/oauth2-oidc` docs flag Azure `logout-uri` as required ('unset value causes NullPointerException'). Operator following docs but omitting it boots successfully and fails at first logout. Also `ODDOAuth2Properties.OAuth2Provider` lacks an `azureTenantId` field — the commented Azure example in `application.yml:128-156` references `${auth.oauth2.client.azure.azure-tenant-id}` interpolation but the field doesn't exist; uncommenting AS-IS fails to bind. (OAuthSecurityConfiguration@L71.md:bugs_limitations_corner_cases.[3,7] + security.known_security_gaps.[4])"
        - "**OAUTH2 + LDAP multi-replica session breakage (MEDIUM)** — Spring default `WebSession` is in-memory per JVM; no `@EnableSpringWebSession` / Redis session store in either config. Multi-replica HA deployments require sticky sessions OR a shared session store; without either, OAuth2 callback may hit a different pod than the initiating redirect, causing 'authorization request not found' errors. No doc-side prerequisite. (OAuthSecurityConfiguration@L71.md:bugs_limitations_corner_cases.[6] + performance.known_performance_gaps.[0])"
        - "**Deployment fingerprinting via `/api/appInfo` under DISABLED (MEDIUM)** — `GET /api/appInfo` is reachable by ANY network caller and discloses `{projectVersion, authType}`. Active auth mode + precise platform version is enough for an attacker to scope CVE matching. Live `enable-security` documents neither the endpoint nor the default-DISABLED fingerprinting surface. (AppInfoController@L18.md:security.known_security_gaps.[0])"
        - "**AuthorizationManagerCondition is dead code (MEDIUM)** — composite Condition class designed to gate the authorization-manager wiring for OAUTH2|LDAP, but has zero `@Conditional` consumers in the repo. A future maintainer relying on it would ship code that silently never activates. (AuthorizationManagerCondition@L11.md:bugs_limitations_corner_cases.[0] + security.known_security_gaps.[0])"
        - "**DISABLED has no CSRF (consistent with other modes but undocumented), no CORS (UNIQUE among modes), actuator-on-same-port (no narrowing)** — Consistent: all four modes call `.csrf(...disable)` (DisabledAuthSecurityConfiguration.java:15 + LoginFormSecurityConfiguration.java:54 + OAuthSecurityConfiguration.java:96 + LDAPSecurityConfiguration.java:143). Unique to DISABLED: OAuth + LDAP both call `.cors(withDefaults())`; DISABLED has no `.cors(...)` AND no global `CorsConfigurationSource` bean exists in the codebase. Cross-origin browser callers under DISABLED reach the application via `.anyExchange().permitAll()` but receive no `Access-Control-*` headers from a security layer. Plus `/actuator/{health,prometheus,env,info}` (`application.yml:226-240`) are reachable under DISABLED on the same HTTP port. (DisabledAuthSecurityConfiguration@L10.md:bugs_limitations_corner_cases.[0,3,4] + security.known_security_gaps.[3,5])"
        - "Under `auth.type=DISABLED`, every endpoint named anywhere in this catalog becomes anonymously reachable — every controller sidecar's `weaknesses` block flags this individually; aggregated here as a cross-cutting consequence of the application.yml default. CANONICAL evidence is now DisabledAuthSecurityConfiguration@L10."
      cross_file_inconsistencies:
        - "All controller sidecars treat `auth.type` as opaque (it gates `permittedPaths` and the AuthorizationCustomizer chain upstream); AppInfoController@L18 is the only sidecar where `auth.type` is itself the DATA being exposed; the four `*SecurityConfiguration` sidecars (batch 2026-05-12C) are the canonical WIRING-side sidecars where `auth.type` selects the actual SecurityWebFilterChain. The three layers (consumer-of-mode in controllers + reporter-of-mode in AppInfo + wirer-of-mode in *SecurityConfiguration) coexist in the codebase and the catalog has to surface all three."
        - "**Per-mode AuthorizationCustomizer asymmetry**: OAUTH2 + LDAP wire it (OAuthSecurityConfiguration.java:98 + LDAPSecurityConfiguration.java:145); LOGIN_FORM + DISABLED do not. Live `/enable-security/authorization` describes the Policies/Permissions/Roles/Owners framework without naming this precondition. Operators reading the authorization page see a framework; operators choosing LOGIN_FORM never get it."
