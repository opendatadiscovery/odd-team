- id: H-002
  hypothesis: "When an operator configures a real auth mode (LOGIN_FORM / OAUTH2 / LDAP), the OwnerAssociation / Recommended panel appears; when they disable auth (auth.type=DISABLED), it is hidden — and any value that is NOT one of the four documented modes is treated safely (not rendered as if auth were on)."
  derivation: "The gate predicate `appInfo.authType !== 'DISABLED'` (Overview.tsx:25-27) is the visibility control for the Recommended panel; the documented enum is DISABLED|LOGIN_FORM|OAUTH2|LDAP."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The gate is a raw, case-sensitive, un-normalised string-inequality against the single literal 'DISABLED'
      (Overview.tsx:25-27), with no validation against the documented enum and no upstream default
      (AppInfoController.java:18 reads `@Value("${auth.type}")` with no @Pattern / no default). Consequently:
      a typo like `OUATH2` (transposed) → Boolean('OUATH2' && 'OUATH2' !== 'DISABLED') === TRUE → the OwnerAssociation
      card RENDERS, but NO `@ConditionalOnProperty(havingValue='OUATH2')` matches, so the backend booted with NO
      SecurityWebFilterChain at all — an apparently-functional Recommended panel on a fully-unauthenticated deployment.
      `disabled` (lowercase) or `' DISABLED'` (whitespace) → also TRUE → card shows even though the operator's clear
      intent was to disable auth. Empty string → FALSE → card hidden, masking the broken-auth deployment.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: bugs_limitations_corner_cases[0] / invariants
        cite: "Overview.tsx:25-27"
        note: "four operator-misconfiguration scenarios; no console.warn, no fallback, no diagnostic"
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: security.known_security_gaps[0]
        cite: "AppInfoController.java:18 (no @Value default, no enum validation per upstream sidecar)"
        note: "two layers (no backend default + no UI validation) compound; neither catches the other"
    operator_visible_failure: |
      (1) The headline failure: an operator who typos auth.type ships a deployment with every endpoint
      unauthenticated AND a home page that shows the OwnerAssociation card as if auth were correctly enabled —
      the UI actively reassures them that security is on while it is off. This is the LSN-002 / LSN-001 class
      (operator follows our surface off a cliff). (2) The inverse: lowercase/whitespace `disabled` shows the panel
      when the operator meant to turn auth off. (3) Empty string hides the panel, masking a broken-auth boot.
      No diagnostic is emitted in any case.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

