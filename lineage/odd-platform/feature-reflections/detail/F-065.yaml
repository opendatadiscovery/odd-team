# Postgres advisory-lock-id registry — product-owner reflection

## product_owner_narrative

The "feature" here is not a screen — it is an **operational contract the platform makes
with itself and exposes to operators through `application.yml` / environment variables /
`/actuator/configprops`**. ODD runs four background subsystems that must each elect a single
leader across horizontally-scaled replicas: the notification WAL subscriber (one replica reads
the Postgres logical-replication stream and fans alerts out), the partition orchestrator (one
replica appends the next rolling partition to the `activity` and `message` tables), and the two
Data-Collaboration workers (one drains the outbound Slack queue, one ingests inbound Slack
events). The elected-leader mechanism is a single **Postgres advisory lock** per subsystem,
identified by a hand-assigned integer: `partition=90`, `notifications.wal=100`,
`datacollaboration.receive-event=110`, `datacollaboration.sender-message=120`
(per application.yml:177,197-198,201-202, cited across all four contributing sidecars). The
"registry feature" is the (currently implicit) promise that those four integers form a
coherent, collision-free namespace and that an operator tuning any of them stays inside the
rails. The audience is the **platform-operator** persona (P-08 Management &
Administration / "Platform-Internal Operational Infrastructure" canonicalisation candidate);
there is NO end-user UI and none is expected — this is intentionally backend-only
(per feature-flow status_reason).

An operator interacts with this contract in exactly one way: they set or override the four
`*.advisory-lock-id` keys. Typically they leave the shipped defaults (which are disjoint and
correct). The realistic failure path is the enterprise-hygiene one: per-environment overrides
in a Helm overlay, a copy-paste of one key's value into another, or running ODD alongside a
second Postgres-using application that already holds one of these IDs on the shared instance.
The product question this reflection forces is: *when the operator does that, does the platform
keep them safe — does it tell them they collided, refuse to boot, degrade a readiness probe, or
at minimum surface a metric?* The single source the whole answer turns on is
`PostgreSQLLeaderElectionManagerImpl.acquire(...)` — feature-flow hop 2, which the flow itself
marks `unresolved` (no sidecar). I read that one class (Rule-8 exception): it executes the
**blocking** `SELECT pg_advisory_lock(%d)` with no timeout and no `pg_try_advisory_lock`
fast-path (PostgreSQLLeaderElectionManagerImpl.java:22-23), confirming the feature-flow's
central facet from primary source rather than from SHB-065 hearsay.

The working parts, described as the operator experiences them: (1) at boot and on failover each
subsystem calls `acquire(lockId, replicationConnection)` and **blocks** until it owns the lock;
(2) the four IDs are bound across THREE different `@ConfigurationProperties` classes
(`NotificationsProperties.wal`, the partition properties, `DataCollaborationProperties`) plus
raw `@Value` reads — there is no single class, no `AdvisoryLockId` enum, no `LockIdRegistry`
(Grep across the platform for both names returns zero matches, re-confirmed this run); (3) the
ONLY validation anywhere near these values is `DataCollaborationProperties`'s `@PostConstruct`
checking `sendingMessagesRetryCount >= 0` — which does NOT touch the lock IDs at all
(DataCollaborationProperties.java:14-20, per its sidecar); (4) the partition lock (90) is
**deliberately shared** between `ActivityTablePartitionManager` and `MessageTablePartitionManager`
(ActivityTablePartitionManager sidecar dependencies_semantic.coupling[0]) — which is the load-bearing
reason a naive "all four must be pairwise distinct" validator would be wrong and would falsely
reject a legal deployment.

The integration story is what makes a single collided integer a severe failure rather than a
cosmetic one. Three of the four locks sit inside P-07 Active Platform Features — a notifications
collision silently kills alert delivery (F-009); a data-collaboration collision silently kills
Slack send or receive (F-038). The partition lock sits inside F-010 Housekeeping and underwrites
F-021 Activity Feed's partition lifecycle — a partition-lock collision silently stops new
`activity`/`message` partitions from being created, and once the current rolling window is
exhausted, every `INSERT` into the audit table fails with `no partition of relation found for
row` (ActivityTablePartitionManager sidecar bugs[1]). Worse, the notifications-collision
failure is **operationally indistinguishable** from the separately-filed poison-message WAL
replay loop (PLT-139 / NotificationSubscriber sidecar bugs[0]): both present as "alerts stopped,
health is green, nothing in the logs." Two distinct root causes, one observable — the canonical
example of why the missing observability multiplies operator diagnostic burden.

A product owner demoing this would highlight the edge cases that a senior operator would
actually hit: the empty/no-collision happy path (defaults work, and IT-012 now PROVES the
notifications election + failover behaves correctly under two replicas); the deliberate-share
case (partition managers coexisting on lock 90 is legal and must stay legal); and the three
genuinely dangerous negative-space cases — silent wedge on collision, no readiness degradation,
no Prometheus gauge. The live docs were updated since the sidecars were captured and now carry
an "Advisory-lock registry" table plus an explicit warning that "collisions are not detected at
startup and produce silent feature wedges" (WebFetch 2026-06-03, 200) — meaning the
documentation now correctly DESCRIBES the trap that the code still does not PREVENT. That gap
between the doc's honest warning and the code's silent behaviour is the spine of this reflection.

