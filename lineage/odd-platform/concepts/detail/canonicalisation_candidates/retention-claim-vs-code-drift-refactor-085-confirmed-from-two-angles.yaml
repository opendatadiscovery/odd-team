proposed_canonical: Retention claim vs code drift (REFACTOR-085 confirmed from two
  angles)
rationale: 'Now 2-sidecar primary-source triangulated cross-cutting doc-vs-code-drift
  invariant. Live `/features/active-platform-features/activity-feed#configuration`
  claims `odd.activity.partition-period` controls ''retention and partitioning'' —
  this is unsupported by BOTH the partition-WIDTH angle (ActivityTablePartitionManager
  batch B: partition-period controls cadence only; no DROP path) AND the housekeeping-coverage
  angle (HousekeepingTTLProperties batch D: no `activity*Days` field; ActivityEmptyPartitionsHousekeepingJob
  requires partitions to be EMPTY before dropping). Same drift applies to the MESSAGE
  table (no `messageDays` field; only empty-partition-drop). HIGH-priority DOC-NNN
  candidate.'
contributing_concepts:
- ActivityTablePartitionManager — partition-period controls width-not-retention (batch
  B)
- HousekeepingTTLProperties — no activity*Days field anywhere (batch D)
- ActivityEmptyPartitionsHousekeepingJob — drops only EMPTY past partitions
- MessageEmptyPartitionsHousekeepingJob — same shape, MESSAGE table
suggested_add_to_docs: true
