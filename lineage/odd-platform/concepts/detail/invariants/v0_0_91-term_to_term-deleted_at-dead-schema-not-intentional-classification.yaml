mitigations_unimplemented:
  - |-
    Option A (the now-confirmed-correct remediation) — Add a cleanup
    migration mirroring V0_0_76's structure:
      DELETE FROM term_to_term WHERE deleted_at IS NOT NULL;
      ALTER TABLE term_to_term DROP COLUMN IF EXISTS deleted_at;
    This brings term_to_term in line with the 3 sibling link tables
    AND closes the dead-schema interpretation. Lowest-cost; preserves
    the existing read-path semantics; the existing 7 read sites
    silently become correct (no filter needed because no column exists).
  - |-
    Drop the read-path filter follow-up (Option B from the master
    invariant) — under interpretation (a) the 7 read sites do NOT need
    to be patched; the column will be removed instead.
  - |-
    Drop the soft-delete feature follow-up (Option C from the master
    invariant) — under interpretation (a) there is no current intent
    to add a term-to-term soft-delete feature; the cleanup eliminates
    the partial-implementation surface area.
  - |-
    Add the regression test pinning the cleanup migration ran cleanly:
      (a) Assert ALTER TABLE term_to_term DROP COLUMN IF EXISTS deleted_at
          has been applied (the column is gone).
      (b) Assert grep over the backend Java source for
          TERM_TO_TERM.DELETED_AT continues to return zero matches.
      (c) Assert the term-to-term link/unlink endpoints continue to
          produce the same wire-shape responses (no behavioural drift).
  - |-
    Add a build-time invariant scanner that flags any new repository
    read against a table with a deleted_at column that lacks the
    matching deleted_at.isNull() predicate — the bug class is bigger
    than just term_to_term and the scanner closes the failure class.
notes: |-
  NEW invariant captured in batch 2026-05-20U from the TermServiceImpl
  sidecar's primary-source Grep verification. The master invariant
  (batch N) enumerated two possible interpretations; the batch-U
  evidence resolves the ambiguity in favour of interpretation (a)
  DEAD SCHEMA from MISSED MIGRATION.

  The disambiguation is load-bearing for the maintainer's DOC-NNN
  remediation choice:
    - Under (b) [under-implemented soft-delete] the remediation was
      'add filter at 7 sites' AND 'document the asymmetry'.
    - Under (a) [dead schema] the remediation is 'one DROP COLUMN
      migration' AND no documentation is needed.

  The cleanup migration is the smaller, safer, and more
  architecturally-correct remediation. The master invariant's HIGH
  severity is downgraded to MEDIUM under the disambiguation; the
  active runtime bug class is gone, the architectural-hygiene concern
  remains.

  Cross-cutting connections:
    - STRENGTHENS the master invariant
      term-to-term-deleted-at-schema-drift-v0_0_76-vs-v0_0_91
    - Pairs with hard-delete-on-relationship-edges-confirmed-cross-batch
      (batch L) — term_to_term JOINs the 3 sibling tables as a fully
      hard-delete link table once the cleanup ships
    - Pairs with three-soft-delete-mechanisms-across-the-repository-layer
      (batch H) — closes one of the schema asymmetries that invariant
      surfaces
    - Distinguishes from policy-getRolesPolicies-missing-deleted_at-filter
      (batch H) — that's a LIVE filter bug; this is DEAD schema; both
      were schema-drift failures but require DIFFERENT remediations

  Two DOC-NNN candidates flow from this invariant:
    (a) Code fix — V0_0_NNN cleanup migration (DROP COLUMN)
    (b) The master invariant's remediation list is REVISED to favour
        Option A and drop Options B and C
