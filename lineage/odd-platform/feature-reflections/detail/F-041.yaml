### probes_emitted
- probe_id: PENDING-F-041-1
  hypothesis_id: H-013
  full_hypothesis: |-
    When a user returns to the Activity tab from the toolbar after a long-lived SPA session (a laptop
    suspended for days), the "recent activity" window the tab opens reflects activity up to now — NOT a
    window ending N days ago where N = days since SPA-bundle load. Statically, defaultActivityQuery
    (Activity/common.ts:33-41) evaluates beginDate=addDays(new Date(),-5) / endDate=new Date() ONCE at
    module-import time; ToolbarTabs.tsx:75-79 builds the Activity href from it when no URL query is present,
    so the window slides stale across a kept-open session. The open question is whether a real multi-day-idle
    browser session reproduces the stale window (Date.now caching across module-reload boundaries — the class
    a normal integration test misses without mocking time across reloads).
  expected_outcome: "The Activity tab href window endDate tracks 'now', not SPA-bundle-load time, across a multi-day idle session."
  local_execution: |-
    Local-only per Rule 6: Playwright headless drives a docker-compose ODD platform; mock Date.now / advance
    a simulated clock across a module-reload boundary; read the Activity tab href and assert its endDate is
    within the test 'now'. No remote infra.
  status: pending-reflection-verification
  note: "Parallel-safe mode: recorded as PENDING id; no P-NNN file created (orchestrator/probe-runner mints)."

