name: List Popular Data Entities
canonical_in_docs: true
canonical_candidate: true
description: GET /api/dataentities/popular — the read-side closure of the view_count
  loop. Returns 9-field DataEntityRef projection ranked by view_count DESC (sole signal;
  id DESC tiebreaker). Surfaces entities across all owners to every authenticated
  caller. NO transactional boundary, NO enrichment, NO auth filter, NO owner predicate,
  NO rate-limit, NO anti-abuse. Trivially inflatable via scripted detail-reads. EXCLUDE_FROM_SEARCH
  is NOT applied (sole list-shape that ignores it).
