notes: "STRENGTHENED in batch 2026-05-12F from 3-sidecar to 5-sidecar\ntriangulated.\
  \ Lineage adds the GRAPH-shaped cross-owner enumeration\n(causal-connection leak\
  \ via reachable downstream graphs); getDataEntityDetails\nadds the CENTERPIECE READ\
  \ — the single hottest endpoint with the\nwidest blast radius (full 34-field detail\
  \ payload).\n\nADR-CANDIDATE-003 (read-collaborative borderline) was originally\n\
  surfaced via getAllAlerts + getActivity in batch B. Batch E promoted\nthis to a\
  \ 3-sidecar pattern. **Batch F RESOLVES the borderline_flag**\nvia the getDataEntityDetails\
  \ primary-source: the posture is\nINTENTIONAL on the centerpiece read, consistent\
  \ with 27+ other GETs\non the same controller. The platform DELIBERATELY ships\n\
  read-collaborative; the doc-gap is doc-side, not code-side.\n\nFive DOC-NNN candidates\
  \ flow from this invariant:\n  (a) `/features/alerts` page: add a 'Who can see this'\
  \ section\n      naming the read-collaborative posture explicitly.\n  (b) `/features/active-platform-features/activity-feed`\
  \ page:\n      same treatment; emphasise that the activity feed exposes\n      who-changed-what\
  \ across owners.\n  (c) `/features/data-discovery/search` page: same treatment;\n\
  \      the catalog search surface is the WIDEST single-page\n      cross-owner enumeration\
  \ vector.\n  (d) `/features/data-lineage` page: same treatment; lineage\n      edges\
  \ leak causal connections even when individual entity\n      visibility would otherwise\
  \ be limited.\n  (e) `/features/data-discovery` (or `/features/data-discovery/catalog-overview`):\n\
  \      CENTERPIECE READ posture — `GET /api/dataentities/{id}`\n      returns the\
  \ full 34-field payload to any authenticated user;\n      this is the single most\
  \ consequential doc-gap and the\n      highest-traffic endpoint.\n\nA higher-leverage\
  \ one-pass cleanup would be to extend the\n`/configuration-and-deployment/enable-security/authorization`\
  \ page\nwith a 'Read-side posture' section naming the read-collaborative\nstance,\
  \ listing all five surfaces, and explicitly enumerating\nwhich endpoints DO and\
  \ DO NOT honour owner-scoping. That single\npage change closes the systemic gap\
  \ on all five surfaces.\n"
