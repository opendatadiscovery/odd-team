        cite: "OwnerAssociationRequestServiceImpl.java:118-122 (deleteActiveUserOwnerMapping), :157-172 (cancelAssociationByOwnerId emits REQUEST_MANUALLY_DECLINED at :168-169)"
        note: "Activity emission is downstream of the repository query matching at least one APPROVED row."
