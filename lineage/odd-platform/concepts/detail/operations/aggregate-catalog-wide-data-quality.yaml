name: Aggregate catalog-wide data-quality (single-fetch dashboard projection)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The dashboard data-fetch operation behind the /data-quality page: one
  HTTP GET /api/dataqatests/runs (operationId `getDataQualityTestsRuns`)
  serves all three rings (Table Health, Test Results Breakdown, Monitored
  Tables) and every per-category card. Owned by `DataQualityRunsController`
  on the backend, returning the `DataQualityResults` DTO
  (`testResults[]` per-category run-status counts + `tablesDashboard`
  table-health and monitored-tables aggregates). NEW operation, batch ZC
  (2026-05-22).

  Backend fans out to THREE repository queries
  (`getLatestDataQualityRunsResults` / `getLatestTablesHealth` /
  `getMonitoredTables`) zipped server-side into one DataQualityResults
  DTO (`DataQualityRunsServiceImpl.java:36-43`). The dashboard is a
  single atomic snapshot — all rings reflect the same filter application
  at the same instant, no partial-load skew.

  Frontend wraps the call in `useGetDataQualityDashboard` (a
  `@tanstack/react-query` `useQuery`, dataQuality.ts:74-82) with
  `initialData` always set (an all-zero `DataQualityResults` placeholder
  with the six known categories) — so `data` is never undefined after
  the first render. The `!data` guards scattered in DataQualityContent
  are effectively dead under this contract.

  DISTINCT from F-022's per-dataset operations
  (`aggregate-test-status-counts-for-dataset` — `getDatasetTestReport`,
  per-dataset DataSetTestReport DTO). No code is shared between the two
  surfaces; both consume the DataEntityRunStatus enum but the request /
  response shapes are independent.

  vocabulary_status: codebase-anchored, doc-side-partially-covered. The
  live https://docs.opendatadiscovery.org/features/data-quality/dashboard
  (WebFetched 2026-05-22 status 200) describes the three rings the
  operation feeds and the two-set filter sidebar that shapes its query;
  the doc does NOT name the operation, the endpoint, or the three-query
  server-side fan-out.
vocabulary_status: codebase-anchored, doc-side-partially-covered
