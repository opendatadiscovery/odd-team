extras:
  batch_2026_05_13_g_strengthens:
  - category: entities
    name: Data Entity
    added_sidecars:
    - addDataEntityTerm.md
    - upsertDataEntityInternalDescription.md
    - createDataEntityTagsRelations.md
    - getMyObjects.md
    - getPopular.md
    reason: Five new controller methods extend the per-entity write/read surface —
      term linkage, description editing, tag relations, owner-scoped reads, popular
      ranking.
    new_known_security_gaps_added:
    - SecurityRule path-mismatch silently disables DATA_ENTITY_ADD_TERM/DELETE_TERM
      (HIGH)
    - No backend sanitisation of Markdown body + UI rehype-raw without rehype-sanitize
      (HIGH)
    - Tag side-door past TAG_CREATE via DATA_ENTITY_TAGS_UPDATE scope-asymmetry (MEDIUM)
    - Lineage-variant /my endpoints have single-point-of-failure for owner-scoping
      (MEDIUM)
    - view_count inflation loop trivially pumpable by any authenticated caller (HIGH)
    new_known_performance_gaps_added:
    - No length cap on description body + activity-row 2x payload growth (MEDIUM)
    - No index on data_entity.view_count + sequential scan + sort per Popular page
      render (HIGH)
    - Per-call principal-lookup DB round-trip on every /my request (LOW)
    - Unbounded size param on /my and /popular endpoints (MEDIUM insider DoS)
    - Activity-handler 2x full-list capture on every term-assignment (LOW)
  - category: entities
    name: Owner (Authorization directory entry)
    added_sidecars:
    - getMyObjects.md
    - createDataEntityTagsRelations.md
    reason: 'getMyObjects materialises Owner as per-caller resolution target via user_owner_mapping
      + JOIN OWNERSHIP — primary-source confirmation. createDataEntityTagsRelations
      adds Owner as optional scope of DATA_ENTITY_TAGS_UPDATE via ''is: dataEntity:owner''.'
    new_strengths_added:
    - user_owner_mapping (oidc_username, provider, deleted_at IS NULL) composite key
      cleanly isolates owner identity across auth modes
    new_weaknesses_added:
    - LOGIN_FORM and LDAP both produce provider=null, enabling cross-mode user-identity
      bleed during auth.type migrations (LOW-MEDIUM)
  - category: entities
    name: Policy (Authorization)
    added_sidecars:
    - addDataEntityTerm.md
    - upsertDataEntityInternalDescription.md
    - createDataEntityTagsRelations.md
    - getMyObjects.md
    reason: Four new sidecars surface Policy framework's dataEntity:owner scoping
      (description, tags), INTENDED but unreachable scoping (term-linking), missing
      wiring for owner-scoped reads (getMyObjects bypasses Policy by falling through
      to .authenticated()).
    authorization_consistency_refined: Per-resource Policy resolver (DataEntityPermissionExtractor)
      is the canonical mechanism but reachability depends on SecurityRule path-pattern
      matching — BROKEN for term-linking (HIGH). Two-permission split (DESCRIPTION_UPDATE
      vs TAGS_UPDATE vs ADD_TERM) is intentional fine-grained design.
  - category: entities
    name: Permission (Authorization)
    added_sidecars:
    - addDataEntityTerm.md
    - upsertDataEntityInternalDescription.md
    - createDataEntityTagsRelations.md
    reason: 'Three new permissions surface in batch G: DATA_ENTITY_ADD_TERM (broken
      wiring), DATA_ENTITY_DESCRIPTION_UPDATE (correctly wired), DATA_ENTITY_TAGS_UPDATE
      (correctly wired but side-doors past TAG_CREATE).'
    new_weaknesses_added:
    - DATA_ENTITY_ADD_TERM + DATA_ENTITY_DELETE_TERM unreachable due to path mismatch
      (HIGH)
    - DATA_ENTITY_TAGS_UPDATE conditionally grantable (dataEntity:owner) but writes
      into MANAGEMENT-scoped TAG directory (MEDIUM)
  - category: invariants
    name: Read-collaborative cross-owner enumeration
    added_sidecars:
    - getPopular.md
    reason: getPopular adds the home-page surface — Popular ranking exposes id, oddrn,
      externalName, internalName, entityClasses, status, isStale, hasAlerts to every
      authenticated caller across all owners. Now spans getDataEntityDetails (batch
      F) + getAllAlerts + global activity + search + getPopular (batch G) — FIVE sidecars
      on the pattern.
    triangulation_count_new: 5
  - category: invariants
    name: Owner-link is the gate for owner-scoped views
    added_sidecars:
    - getMyObjects.md
    reason: 'getMyObjects is the PRIMARY-SOURCE site for this invariant (previously
      inferred; now confirmed from canonical owner-scoped controller method). Adds:
      empty Flux silently returned when user-owner_mapping is missing (no 401/403/404
      signal), lineage variants have single-point-of-failure (no JOIN-side filter),
      provider=null cross-mode bleed.'
    primary_source_confirmation: DataEntityController.java:283-289 + DataEntityServiceImpl.java:212-225
      + AuthIdentityProviderImpl.java:50-53 + ReactiveUserOwnerMappingRepositoryImpl.java:77-85
  - category: invariants
    name: Permission-bypass via Owner auto-create (side-door write path)
    added_sidecars:
    - createDataEntityTagsRelations.md
    reason: 'REFINES the pattern. createDataEntityTagsRelations confirms a SECOND
      class of side-door: Tag auto-create IS spec-documented (openapi.yaml:1174 explicit:
      ''Also creates corresponding tags in the system if they don''t exist''). The
      structural gap is the SCOPE-ASYMMETRY (MANAGEMENT-scoped TAG_CREATE vs DATA_ENTITY-scoped
      DATA_ENTITY_TAGS_UPDATE), not auto-create itself. Splits the original pattern
      into TWO sub-patterns: (a) undocumented auto-create (Owner/Title batch F) and
      (b) spec-documented auto-create with scope asymmetry (Tag batch G).'
    pattern_split:
    - 'Undocumented auto-create (batch F): Owner + Title via OwnershipServiceImpl'
    - 'Spec-documented auto-create with scope-asymmetry (batch G): Tag via TagServiceImpl.bulkCreate'
  - category: audiences
    name: ODD Platform UI End-User
    added_sidecars:
    - addDataEntityTerm.md
    - upsertDataEntityInternalDescription.md
    - createDataEntityTagsRelations.md
    - getMyObjects.md
    - getPopular.md
    reason: 'All five new sidecars surface specific UI panels: OverviewTerms.tsx (Terms
      panel), InternalDescriptionEdit (Description panel), dataentities.thunks.ts:50
      (Tags panel), Recommended → My Objects strip, Overview/Overview.tsx Popular
      strip.'
  batch_2026_05_19_h_strengthens:
  - category: entities
    name: Data Entity
    added_sidecars:
    - ReactiveDataEntityRepositoryImpl.md
    reason: PRIMARY-SOURCE persistence layer added — 982-line repository with 35+
      methods. SQL-level confirmation of every batch-F + batch-G finding (STATUS soft-delete
      override; EXCLUDE_FROM_SEARCH inconsistency; view_count loop; verbatim description
      storage; F-001/F-003/F-004 fingerprints).
    new_known_security_gaps_added:
    - SQL-injection vector in getHighlightedResult (lines 799-806; String.formatted
      into raw SQL with user-controllable text + tsQuery) (HIGH)
    - Owner-scoping BYPASSES at JOIN time across 9 list-shape methods (MEDIUM)
    - EXCLUDE_FROM_SEARCH inconsistency confirmed at SQL — cteDataEntitySelect omits
      predicate across 8 list-shape methods (MEDIUM)
    - view_count inflation surface structural — SQL primary source confirmed F-001+F-003
      (MEDIUM)
    new_known_performance_gaps_added:
    - No index on data_entity.view_count — full-table scan + top-N sort for /popular
      (MEDIUM)
    - 7-LEFT-JOIN fan-out on getDataEntitySearchFields (LOW)
    - Pagination (page-1)*size does not validate page >= 1 across 7 list methods —
      Postgres 500 on page=0 (LOW)
  - category: entities
    name: Alert
    added_sidecars:
    - ReactiveAlertRepositoryImpl.md
    reason: PRIMARY-SOURCE persistence layer added — 19 methods owning every ALERT
      + ALERT_CHUNK SQL operation. REFACTOR-024 confirmed at SQL (listAllWithStatusOpen
      lines 143-145 has no owner predicate).
    new_known_security_gaps_added:
    - REFACTOR-024 SQL-primary-source confirmation — outer JOIN adds DATA_ENTITY +
      USER_OWNER_MAPPING + OWNER + ALERT_CHUNK but no owner clause (HIGH)
    - AlertManager webhook bypasses IngestionDataEntitiesFilter — entity_oddrn label
      untrusted; under DISABLED, any caller can create OPEN alerts attributed to any
      data entity (HIGH)
    new_known_performance_gaps_added:
    - listByOwner empty-result total uses platform-wide count (MEDIUM UX bug)
    - Recursive lineage CTE in listDependentObjectsAlerts has no upper bound (LOW)
    - jsonArrayAgg for ALERT_CHUNK may produce very large JSON per alert (LOW)
    - No method-level observability (LOW)
  - category: entities
    name: Policy (Authorization)
    added_sidecars:
    - ReactivePolicyRepositoryImpl.md
    reason: PRIMARY-SOURCE persistence layer added — 40-line shell with single getRolesPolicies
      JOIN (the authorization hot path invoked on EVERY authorized request).
    new_known_security_gaps_added:
    - getRolesPolicies returns SOFT-DELETED policies that still have surviving role
      bindings — orphan-binding permission leak (HIGH)
    - RBAC mutations are forensically silent at the repository layer — confirms 3-sidecar
      pattern at SQL (HIGH)
    - Soft-delete recreation invariant + Administrator-name asymmetry compound risk
      (MEDIUM)
    cross_batch_correction: 'Duplicate-name POST surface is HTTP 400 (USR003) with
      friendly message, NOT 5xx as some prior sidecars suggested. Path: jOOQ DataAccessException
      → JooqReactiveOperations.onErrorMap → ExceptionUtils.translateDatabaseException
      → UniqueConstraintException → ControllerAdvice.handleUniqueConstraint → HttpStatus.BAD_REQUEST.'
  - category: entities
    name: Lineage Graph Traversal
    added_sidecars:
    - ReactiveLineageRepositoryImpl.md
    reason: PRIMARY-SOURCE persistence layer added — 177 lines with 11 public methods
      + 1 private CTE-assembly helper. Confirms every controller-method-level finding
      at the SQL layer.
    new_known_security_gaps_added:
    - No JOIN-side owner filter on the recursive CTE — REFACTOR-203 SQL primary source
      (HIGH)
    - No upper bound on lineageDepth — DoS-amplification vector (HIGH)
    - No statement_timeout enforcement at repository (MEDIUM)
    new_known_performance_gaps_added:
    - No covering index for soft-delete filter (MEDIUM)
    - No covering index for soft-delete OR predicate on either-endpoint (MEDIUM)
    - Misleading OR-predicate in getLineageRelations(List<String>) (LOW)
  - category: invariants
    name: Read-collaborative cross-owner enumeration
    added_sidecars:
    - ReactiveAlertRepositoryImpl.md
    - ReactiveLineageRepositoryImpl.md
    - ReactiveDataEntityRepositoryImpl.md
    reason: 'Batch H adds THREE repository-layer SQL primary-source confirmations:
      ReactiveAlertRepositoryImpl (listAllWithStatusOpen lines 143-145 has no owner
      predicate); ReactiveLineageRepositoryImpl (recursive CTE walks lineage edges
      with is_deleted filter only — the lineage table has no owner column at all);
      ReactiveDataEntityRepositoryImpl (every list-shape method on the repository
      returns rows with no per-tenant filter; 982 lines + 35+ methods contain ZERO
      authorization annotations and ZERO principal parameters in any signature). The
      catalog now has the controller-layer + repository-layer + SQL-layer confirmation
      that the read-collaborative posture is uniform end-to-end.'
