- id: H-011
  hypothesis: "When the text describing why an alert fired (the alert-chunk description, supplied by an upstream collector) contains Slack control sequences such as @channel or a fake link, the Slack message renders those as plain text — it does not broadcast-notify the whole channel or render an attacker-controlled clickable link."
  derivation: "Response-shape + security: the alert-chunk description is rendered into the Slack message body; a notifier should not let upstream-supplied content control Slack-side behaviour."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The latest 3 alert-chunk descriptions are rendered via markdownText(...) at
      SlackMessageGenerator.java:77 (+ 95-101) with NO escaping. Slack interprets @channel, @here,
      <!channel>, <!here>, *bold*, _italic_, ~strike~, and <url|text> as markup. AlertChunkPojo
      .description is populated from ingestion-side AlertActionResolverImpl.java:162 (upstream
      collector content — dbt test descriptions, GE expectation strings, schema-diff narratives).
      MrkdwnUtils.java:1-14 has only bold(...) and buildLink(...) helpers for platform-controlled
      strings; there is NO escape(...) for untrusted content, so the sequences pass through raw.
      (SlackMessageGeneratorTest exercises the render path with a benign description "schema changed"
      — it does NOT assert that mrkdwn metacharacters are escaped, so it does not guard this.)
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__SlackNotificationSender.md
        section: bugs_limitations_corner_cases[2] + security.known_security_gaps[0]
        cite: "SlackMessageGenerator.java:77 + MrkdwnUtils.java:1-14 + AlertActionResolverImpl.java:162"
        note: "ingestion-supplied description -> markdownText with no escape -> mrkdwn injection"
    operator_visible_failure: |
      An upstream actor who controls an alert description (a compromised or careless collector, or
      anyone who can influence a dbt test name / GE expectation message) can inject @channel / <!here>
      to broadcast-notify the entire Slack channel membership on every matching alert (notification
      fatigue / denial-of-attention), or inject a fake <https://attacker/|click here> link to phish
      channel members who trust ODD alerts. The remediation is a small MrkdwnUtils.escape applied
      before markdownText. The live doc (2026-06-01) now warns about this passthrough — doc-gap closed;
      code gap remains. This is the 6th surface of F-004's description-injection family.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: unverified
    test_ref: "SlackMessageGeneratorTest exercises the render path but with a benign description; does NOT assert escaping"
    coverage_note: |-
      CONTRADICTED security gap. Tracked as PLT-015 (the security-grade sibling of PLT-016, separate
      because it has a one-line sanitisation fix). The fix (a MrkdwnUtils.escape applied to the chunk
      description before markdownText) wants a behavioural guard: render a description containing
      @channel / <url|text> and assert the metacharacters are escaped in the output blocks.
      test_demand: functional.
    test_demand: functional

- id: H-012
  hypothesis: "When the platform writes an alert to Slack / webhook / email, the platform keeps a record (an audit row or its own Activity-feed event) that the alert was delivered (or failed), so an operator or compliance reviewer can later answer 'was alert X delivered, and to which channel?'."
  derivation: "Pillar primary user action 'audit metadata changes on the Activity feed'; cross-pillar (P-07 feeds P-01 activity) + compliance expectation for an alerting subsystem."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      There is no delivery record of any kind. The dispatcher logs at DEBUG on send (off by default)
      and ERROR on per-sender failure; there is no DB audit table, no metric counter
      (notifications_sent_total), no delivery-latency histogram, and crucially no Activity-feed event
      — ActivityEventTypeDto.java:3-31 enumerates 26 constants but ZERO name notification delivery (no
      NOTIFICATION_SENT / NOTIFICATION_FAILED / NOTIFICATION_DELIVERY_ATTEMPTED). The SPI seam's void
      return + no per-message id means even an implementor that WANTED to emit an audit event has no
      message identifier to anchor it to. This is structurally the same enum-rooted audit-silence
      pattern F-006 catalogues, extended to the outbound surface.
    evidence:
      - sidecar: odd-platform__java__notification__processor__class__PostgresWALMessageProcessor.md
        section: bugs_limitations_corner_cases[4]
        cite: "ActivityEventTypeDto.java:3-31"
        note: "26 activity-event constants; none names notification delivery -> structural audit silence"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: bugs_limitations_corner_cases[1] + security.known_security_gaps[1]
        cite: "AlertNotificationMessageProcessor.java:30-35 + NotificationSubscriber.java:83-84"
        note: "catch-and-log only; LSN advances regardless; no audit row, no metric"
    operator_visible_failure: |
      An operator cannot answer "how many alerts went to Slack last week?", "which alerts failed
      delivery between 14:00-14:30?", or "did the on-call channel receive the schema-break alert?"
      from any ODD telemetry — only by grepping platform logs for receiver-id substrings (and
      DEBUG-level send logs are off by default). A compliance regime requiring proof of alert delivery
      cannot be satisfied. The cross-pillar promise (P-07 alerts/activity feeding the audit surface)
      does not extend to notification delivery. The live doc (2026-06-01) now states "Failed deliveries
      are lost without trace ... no per-channel audit" — doc-gap closed; code gap remains.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_ref: null
    coverage_note: |-
      CONTRADICTED. Tracked as PLT-016 Defect 4 (no idempotency/DLQ/audit) + the F-006 enum-rooted
      audit-silence cluster. If the maintainer adds a delivery-audit row / a NOTIFICATION_* activity
      event, that wants a guard: deliver an alert, assert an audit row / activity event exists.
      test_demand: functional.
    test_demand: functional

- id: H-013
  hypothesis: "When the operator updates the email recipient list (`notifications.receivers.email.notification.emails`) on a running platform, the change takes effect for subsequent alerts."
  derivation: "Endpoint/config-shape: a recipient list is operator-tunable config; an operator reasonably expects config changes to apply (especially via Actuator /refresh)."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The recipient list is bound ONCE at bean construction (EmailNotificationSender.java:36, from
      NotificationConfiguration.java:104,118 via @Value parsing of the comma-string) and is never
      re-read per message. Operator changes require a Spring context restart to take effect; Actuator
      /refresh does not cover this path because the value flows via @Value constructor injection, not a
      @ConfigurationProperties POJO that supports rebind. So the hypothesis is TRUE after a restart and
      FALSE for a live change. The same immutability applies to the Slack/webhook URLs (bound as final
      fields at boot, per SlackNotificationSender.md bugs[9]).
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__EmailNotificationSender.md
        section: bugs_limitations_corner_cases[7]
        cite: "EmailNotificationSender.java:36 + NotificationConfiguration.java:104,118"
        note: "recipient list bound at construction; no per-message re-read; /refresh not covered"
      - sidecar: odd-platform__java__notification__sender__class__SlackNotificationSender.md
        section: bugs_limitations_corner_cases[9]
        cite: "SlackNotificationSender.java:27 + NotificationConfiguration.java:77"
        note: "Slack webhook URL is a credential bound at boot; no in-app rotation hook"
    operator_visible_failure: |
      An operator who adds an on-call engineer to the email recipient list (or rotates a leaked Slack
      webhook URL) during an incident sees no effect until they restart the platform process. For
      credential rotation (a leaked Slack/webhook URL is a live bearer token) this is operationally
      significant: there is no SIGHUP / live-reload path, so closing a credential leak requires a
      restart. This is consistent with ODD's broader @Value-config posture, but it is load-bearing for
      credential-class config and undocumented at the channel level.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_ref: null
    coverage_note: |-
      PARTIAL (true after restart, false live). A documented caveat (no live-reload). The verified-
      after-restart half needs no new test; the missing live-reload is a known @Value-posture
      constraint, not a behaviour to add a happy-path test for unless the maintainer ships live-reload.
      Routed to caveat-candidate; a functional demand is listed but LOW priority (only if live-reload
      is implemented). test_demand: functional (low-priority).
    test_demand: functional

