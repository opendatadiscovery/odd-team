proposed_action: |-
  Testcontainers test. (a) Seed tag "PII"; attach to 3 data entities. (b) TagServiceImpl.delete("PII") — hard-deletes relations, soft-deletes tag. (c) Bulk-create new tag "PII" via the auto-create-on-miss path. (d) Assert: new tag id ≠ old id; tag_to_data_entity rows are empty (no automatic restoration); the 3 data entities now show NO "PII" tag. (e) Pin the audit gap: no log line, no activity event, no warning.
