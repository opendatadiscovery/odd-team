mitigations_unimplemented:
  - |-
    Make CHUNK_BASE_PATH operator-configurable: add
    @Value('${attachment.chunk.staging-path:/tmp/odd/chunks}') in FileUtils
    (the cleanest refactor is to inject the path via Spring DI rather than
    keep it as a static final constant). Operators can then point staging at
    a shared volume (EmptyDir + sticky routing OR PersistentVolume OR S3
    multipart-staging).
  - |-
    Documentation update on
    https://docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#attachment-storage-configuration —
    add a 'Multi-replica REMOTE deployments' subsection with the chunk-staging
    constraint explicit + recommended LB sticky-routing configuration OR
    shared-volume guidance.
  - |-
    Refactor — replace the local-filesystem staging with S3 multipart upload
    (initiate returns the multipart UploadId from S3; chunks PUT directly to
    S3 as multipart parts; complete invokes CompleteMultipartUpload). Eliminates
    the node-local staging dependency entirely. Substantial work but the
    correct long-term fix.
  - |-
    Add a sticky-session integration test — assert that an upload initiated
    on pod A + chunks 1-3 on pod A + chunk 4 on pod B + completeFileUpload
    on pod B FAILS gracefully (404 or 400, not a corrupted file). Pin the
    current behaviour as a regression invariant until the refactor lands.
  - |-
    Container readiness probe — assert /tmp/odd/chunks is writable as part
    of the platform's readiness probe; surface a clear error if the path is
    read-only or not mounted.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20V from the
  DataEntityAttachmentController sidecar's pre_emit_coherence_check section.
  The finding extends LSN-001's lineage from the doc-layer (closed) to the
  code-layer (open). The substrate's value-add is exactly this kind of
  consumer-read finding — invisible at the YAML level, requires reading
  FileUtils.java + the two consumer classes.

  Cross-cutting connections:
    - LSN-001 retrospective: doc-layer remediation closed; this invariant
      anchors the code-layer residue
    - Existing concept: attachment-storage-backend.yaml (storage-mode @ConditionalOnProperty
      switch) — already notes the chunk path observation; this invariant
      promotes it to first-class
    - Existing concept: chunked-file-upload-3-step-state-machine.yaml (the
      3-step state machine) — already notes the storage-mode-independent
      staging; this invariant adds the failure mode + remediation scope
    - Sibling LSN-002: lsn-002-class-primitive-default-ships-disabled-but-broken-when-enabled
      (same pattern shape: a code-level default ships broken; LSN-001 is
      attachment storage tier, LSN-002 is region; both surface as 'visible
      at YAML, broken at first use')
    - Multi-replica scaling: STRENGTHENS the 'Stateless controller — instances
      scale horizontally' invariant — the controller IS stateless but the
      attachment subsystem's staging is NOT. The platform-wide claim of
      stateless horizontal scaling has an exception that is undocumented.

  Three DOC-NNN candidates flow:
    (a) Doc admonition on the attachment-storage configuration page about
        multi-replica REMOTE deployment with chunk-staging caveats
    (b) Code fix (configurable CHUNK_BASE_PATH OR S3 multipart staging)
    (c) Integration test pinning the current behaviour as a regression
        invariant

  This invariant is the 2nd 'LSN-001 in-code residue' finding (the 1st was
  the storage-mode-independent observation in batch J's uploadFileChunk
  method-level sidecar). The batch-V class-level sidecar elevates the
  finding to HIGH-severity with the multi-replica failure mode explicit.
