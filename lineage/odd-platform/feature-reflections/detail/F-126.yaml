- id: H-011
  hypothesis: |-
    When two events/alerts share the boundary of a page (e.g. equal last_created_at at the page edge),
    paginating the global list with infinite-scroll does not skip or duplicate any alert.
  derivation: |-
    Ordering + pagination semantics: the list sorts by LAST_CREATED_AT DESC, ID DESC and pages via
    OFFSET=(page-1)*size; the negative-space question of deterministic, gap-free pagination under concurrent writes.
  seed_source: endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The ordering is deterministic at the SQL layer: createAlertJoinQuery declares ORDER BY
      (ALERT.LAST_CREATED_AT DESC, ALERT.ID DESC) applied to both the inner CTE and the outer select — so
      ties on last_created_at are broken by id, giving a total order. That makes a STATIC snapshot gap-free.
      What cannot be settled statically is the behaviour under concurrent writes during scrolling: the list
      uses OFFSET pagination (not keyset), so if new OPEN alerts are inserted (or existing ones resolved,
      removing rows) between page N and page N+1 fetches, the OFFSET window shifts and an operator can skip or
      re-see a row. The UI also has a documented page-race: a slow page-2 response can land into a just-cleared
      tab state, and there is no request cancellation on tab-switch. Whether a real operator scrolling a
      live-updating high-alert deployment observes skipped/duplicated alerts requires running it.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Alerts.md
        section: stress_findings.orderings + stress_findings.resource_boundaries
        cite: "ReactiveAlertRepositoryImpl.java:474-507 + alerts.slice.ts:25-32 + AlertsList.tsx:74-93"
        note: "total order on (last_created_at DESC, id DESC); OFFSET pagination; documented page-race + no cancellation."
    operator_visible_failure: |-
      On a high-alert deployment where alerts are continuously created/resolved while an operator scrolls the
      global list, OFFSET pagination can cause a row to be skipped (a new alert inserted above the current
      window pushes an unseen row past the offset) or duplicated (a resolved alert removed above the window
      pulls a seen row back into the next page). The on-mount-only totals (H-009) compound the confusion. The
      static ordering is sound; the live-pagination correctness is the open question.
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-126-1
    routes_to_finding: functional-test-demand
    use_case_kind: grammar
    coverage: unverified
    test_ref: ""

- id: H-012
  hypothesis: |-
    The global Alerts list remains usable for an operator on a deployment with many thousands of open alerts
    (it does not freeze the browser tab).
  derivation: |-
    Pillar operator-effectiveness expectation + the hardcoded size=30 infinite-scroll with no DOM virtualisation;
    the senior-PO question of behaviour at scale / across device types.
  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |-
      CONFIRMED that the page accumulates O(N) DOM nodes with no virtualisation: AlertsList wraps a Grid
      container + map of AlertItem rows (no react-window); each AlertItem mounts a useMemo + three useState
      slots and a Collapse-wrapped history. Every infinite-scroll page appends to a single JS array on the
      heap. For ~300 alerts (10 pages) the page is fine; for 3000 it degrades visibly; for 30000 it likely
      freezes the tab. So the hypothesis as stated ("remains usable ... does not freeze") is CONFIRMED only up
      to a few hundred alerts and FAILS at tens of thousands. I record this as confirmed-with-a-ceiling: the
      mechanism is unambiguous from the code (no virtualisation, O(N) DOM), but the exact freeze threshold is
      a probe (P-194 was emitted by the sidecar for the N=3000 memory/DOM-render measurement). The doc now
      documents the size-30 no-filter posture, so the operator is warned the page is a "recent alerts" view.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Alerts.md
        section: performance.resource_allocation + performance.known_performance_gaps
        cite: "AlertsList.tsx:84-99"
        note: "Grid + map, no react-window; O(N) DOM; P-194 emitted for the N=3000 measurement."
    operator_visible_failure: |-
      On a deployment with thousands of unresolved alerts, an operator who scrolls deep into the global list
      accumulates thousands of mounted AlertItem components; the tab's memory and scroll-render cost grow
      linearly and the page becomes the bottleneck before the backend does — eventually an unresponsive tab on
      lower-end hardware. With no server-side filter, there is no way to narrow the set to avoid this. The
      backend would serve the pages fine; the UI is the limiting factor. (Covered by the PLT-050 UX cluster +
      the deferred N=3000 probe.)
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_ref: ""

