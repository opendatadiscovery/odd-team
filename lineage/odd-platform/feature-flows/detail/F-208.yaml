feature_id: F-208
pillar_id: P-01
pillar_anchored_id: P-01:F-015
pillar_anchored_feature_name: Data Entity Staleness Indicator
feature_name: |-
  Data Entity Staleness Indicator — the cross-cutting "source has stopped
  publishing" signal computed from a single backend predicate
  (`lastIngestedAt + odd.data-entity-stale-period < now()`) and rendered
  via the shared MetadataStale widget (orange clock icon + relative
  ingestion-time tooltip) on every UI surface that lists or shows a Data
  Entity. Anchored on SHB-001; ten UI consumers + four mapper imprint
  sites + lineage propagation + a REQUIRED `is_stale: boolean` field on
  three OpenAPI DTOs.
seeded_from: SHB-001
seeded_at: '2026-05-26'
seeded_from_shoebox: SHB-001
discovered_from_entry_point: |-
  ui-component:MetadataStale (the 29-line shared widget at
  components/shared/elements/MetadataStale/MetadataStale.tsx) — paired
  with backend:DataEntityStaleDetector (5-line @Component predicate at
  service/DataEntityStaleDetector.java). The widget is mounted across
  ResultItem (Search), EntityItem (Directory), DataEntityDetailsHeader
  (detail page), LinkedEntity (Term linked entities), DataEntityList
  (Overview / Owner Association strip), QueryExampleDetailsLinkedEntitiesItem,
  and the lineage graph nodes — ten consumers cross-cutting six pillar
  surfaces (Discovery, Lineage, Terms, Owner-Association, Data-Modelling,
  Search).
