mitigations_unimplemented:
  - |-
    Layer 1 — add SecurityRule entry for Endpoint C:
      new SecurityRule(NO_CONTEXT, new PathPatternParserServerWebExchangeMatcher(
        '/api/owner_association_request/activity', GET), OWNER_ASSOCIATION_MANAGE)
    Matches the gate on the LIST endpoint; closes the audit-disclosure
    asymmetry.
  - |-
    Document the intentional-no-gate decisions for Endpoints A and B on
    the live user-owner-association doc — both should be explicitly
    designed-as-public-to-authenticated-users with the design rationale
    visible to operators.
  - |-
    Regression tests — three tests:
      (a) Endpoint A — assert any authenticated user CAN submit a self-request
          (pin intentional behaviour).
      (b) Endpoint B — assert any authenticated user CAN enumerate providers
          (pin intentional behaviour).
      (c) Endpoint C — assert a user WITHOUT OWNER_ASSOCIATION_MANAGE
          receives 403 (under the fix). Pin the asymmetry-fix as a regression
          invariant.
  - |-
    Compound-attack regression test — assert the composite shape (Endpoint B
    + Endpoint C + DIRECT_OWNER_SYNC reconnaissance) is blocked by the
    Endpoint C fix alone. Validates the cost-benefit of the one-line fix.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20V from the
  OwnerAssociationRequestController class-level sidecar. The finding
  identifies three ungated endpoints; the composite severity is HIGH driven
  by Endpoint C (audit-trail disclosure). The compound-attack shape
  (Endpoints B + C + DIRECT_OWNER_SYNC) is the highest-impact case.

  Cross-cutting connections:
    - Companion finding: direct-owner-sync-plus-getorcreate-composition-privilege-escalation-chain
      (Endpoint A is the entry-point for the chain; Endpoint C is the
      reconnaissance surface)
    - Companion finding: two-tier-audit-asymmetry-bifurcation
      (Endpoint C exposes the Tier-3 audit table; the bifurcation observation
      flows from the same sidecar)
    - Companion finding: read-collaborative-cross-owner-enumeration (the
      read-collaborative posture applies to data-entity metadata; this
      finding extends it to the OwnerAssociationRequest audit surface where
      it's INAPPROPRIATE — operational audit trails are higher-sensitivity
      than catalog metadata)
    - F-006 audit-silence: this finding is the inverse — too-much-audit
      visibility rather than too-little-audit emission

  Three DOC-NNN candidates flow:
    (a) Code fix — Layer 1 SecurityRule for Endpoint C
    (b) Doc admission — disclose the design intent for Endpoints A and B
    (c) Compound-attack regression test
