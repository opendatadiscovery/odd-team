- id: H-013
  hypothesis: |-
    When a user returns to the Activity tab from the toolbar after a long-lived SPA session (a laptop
    suspended for days), the "recent activity" window the tab opens reflects activity up to now.
  derivation: |-
    Endpoint-shape + ordering/freshness — the Activity tab href carries a 5-day window built from
    defaultActivityQuery; the senior-PO question of whether a time-windowed default stays fresh across a session.
  seed_source: endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Statically the mechanism is clear: defaultActivityQuery (Activity/common.ts:33-41) is a MODULE-LEVEL
      constant whose beginDate=addDays(new Date(),-5) and endDate=new Date() are evaluated ONCE at SPA-bundle
      import time, not at click time. The Activity tab href is built via activityPath(activityQueryString)
      where activityQueryString falls through to defaultActivityQuery when no URL query is present
      (ToolbarTabs.tsx:75-79). On a long-lived SPA tab (laptop suspended over days) the window slides further
      out of date with each day since bundle load — after N days idle, the Activity tab opens a window ending
      N days ago. What requires RUNNING to confirm is whether a real multi-day-idle session reproduces the
      stale window in the browser (Date.now caching across module-reload boundaries is exactly the class an
      integration test misses without mocking time across reloads). Local-executable.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_ToolbarTabs__ui-shell-widget__ToolbarTabs.md
        section: stress_findings.request_inputs (Activity) + bugs_limitations_corner_cases
        cite: "ToolbarTabs.tsx:75-79 + Activity/common.ts:33-41"
        note: "module-load-time date snapshot; window slides stale across a long-lived SPA session; seeded from SHB-146."
    operator_visible_failure: |-
      An SRE checking "what changed today" via the Activity tab after a multi-day kept-open SPA session sees a
      window that ENDS N days ago (N = days since the bundle was loaded) — they may miss today's events
      entirely and conclude nothing changed. Failure modes: (1) silent stale window on long-lived tabs; (2)
      surfaces only after >24h idle, so it is invisible in normal testing and to short sessions; (3) the user
      has no cue the window is anchored to bundle-load rather than now. Severity is bounded (it self-heals on
      reload and most sessions are short), but the failure is exactly the silent-staleness class that hurts the
      incident-response use of the Activity feed.
    severity: LOW
