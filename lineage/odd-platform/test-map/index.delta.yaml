batch_description: |
  Activity feed feature (P-07:F-003) — second Stress Protocol canary.
  Five new/rewritten sidecars under VAL-LSN-019-B:
    - lineage/odd-platform/understanding/odd-platform__java__ActivityController__controller-class__ActivityController.md (rewritten under file-analyser/0.4.0 Stress Protocol)
    - lineage/odd-platform/understanding/odd-platform__java__service__ActivityServiceImpl.md (NEW — service-tier orchestration sidecar)
    - lineage/odd-platform/understanding/odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md (rewritten under file-analyser/0.4.0)
    - lineage/odd-platform/understanding/odd-platform__java__service__activity__handler__ActivityHandler.md (NEW — handler interface + 18 impls)
    - lineage/odd-platform/understanding/odd-platform__java__housekeeping__job__ActivityEmptyPartitionsHousekeepingJob.md (NEW — housekeeping job)

  This is the SECOND stress-protocol canary in the LSN-019 sprint (after TagServiceImpl batch
  on 2026-05-20). The delta surfaces the OLD-vs-NEW handler state race (CRITICAL), the
  audit-or-fail TX coupling (CRITICAL), the EmptyPartitions check-then-drop race (HIGH),
  and 12 more behaviours that together establish the test floor for the Activity Feed feature.

new_test_gaps:
  - gap_id: TEST-GAP-868
    behaviour: |
      **CRITICAL — Concurrent @ActivityLog mutations on the SAME data entity produce wrong-attribution audit rows.**
      Two transactions both capture pre-mutation `oldState` at the same baseline; both mutations interleave;
      both `getUpdatedState` reads see post-A+post-B state under READ_COMMITTED. Both ActivityPojo rows
      record pre→post-A+post-B with two different actors — wrong attribution for both. Source: ActivityHandler S-E-2 + P-019.
    test_class: integration
    criticality: CRITICAL
    node_ids:
      - "odd-platform java service activity handler:ActivityHandler"
      - "odd-platform java service:ActivityServiceImpl"
    feature_id: F-021
    detail_path: detail/TEST-GAP-868.yaml

  - gap_id: TEST-GAP-869
    behaviour: |
      **CRITICAL — Activity-row write failure rolls back the wrapping business mutation (audit-or-fail TX coupling).**
      ActivityAspect.monoActivityAspect (`:42`) carries @ReactiveTransactional. An R2DBC failure on
      activityRepository.saveReturning rolls back the entire chain including the user-facing mutation,
      surfacing HTTP 500 with no signal the mutation was committed-then-rolled-back. Source: ActivityServiceImpl S-E-1.
      This is the intentional contract per implicit_adrs.[2] but ZERO test pins it — a future TX-decoupling
      refactor lands silently.
    test_class: integration
    criticality: CRITICAL
    node_ids:
      - "odd-platform java service:ActivityServiceImpl"
      - "odd-platform java service activity handler:ActivityHandler"
    feature_id: F-021
    detail_path: detail/TEST-GAP-869.yaml

  - gap_id: TEST-GAP-870
    behaviour: |
      **HIGH — Race window between `SELECT count(*) = 0` empty-check and `DROP TABLE` in
      ActivityEmptyPartitionsHousekeepingJob: a concurrent INSERT lands in a partition that gets
      dropped milliseconds later — silently destroying the just-inserted activity rows. The class-name's
      "empty partitions only" promise drifts at the boundary.** Source: ActivityEmptyPartitionsHousekeepingJob S-E-3 + P-012.
    test_class: integration
    criticality: HIGH
    node_ids:
      - "odd-platform java housekeeping job:ActivityEmptyPartitionsHousekeepingJob"
      - "odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl"
    feature_id: F-010
    detail_path: detail/TEST-GAP-870.yaml

  - gap_id: TEST-GAP-871
    behaviour: |
      **HIGH — `getDataEntityActivityList` (per-entity Activity tab) has NO per-data-entity authorization.
      Any authenticated user can read full activity payload (oldState/newState JSON) for ANY data entity
      by ID — including entities they have no other read permission for. SUPERSEDES TEST-GAP-083's scope
      (which only pinned `/api/activity` global feed).** Source: ActivityServiceImpl S-D-1 + S-D-3.
    test_class: security
    criticality: HIGH
    node_ids:
      - "odd-platform java service:ActivityServiceImpl"
      - "odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl"
    feature_id: F-021
    detail_path: detail/TEST-GAP-871.yaml

  - gap_id: TEST-GAP-872
    behaviour: |
      **HIGH — Ingestion-path + scheduler activity events write `activity.created_by = NULL`;
      under DISABLED auth.type, anonymous mutations ALSO write NULL — and there is NO schema-level way to
      distinguish "system event" from "auth-context-lost-due-to-bug" from "anonymous-mutation".** The
      is_system_event flag exists but the @ActivityLog AOP path doesn't set it. Source: ActivityHandler S-E-5 + P-020.
    test_class: integration
    criticality: HIGH
    node_ids:
      - "odd-platform java service activity handler:ActivityHandler"
      - "odd-platform java service:ActivityServiceImpl"
    feature_id: F-021
    detail_path: detail/TEST-GAP-872.yaml

  - gap_id: TEST-GAP-873
    behaviour: |
      **MEDIUM — Spurious activity events from unstable list ordering in diff.** `ReactiveOwnershipRepositoryImpl.getOwnershipsByDataEntityId`
      and `ReactiveTagRepositoryImpl.listDataEntityDtos` have NO ORDER BY clause; Jackson serializes
      lists in iteration order; the diff check at ActivityAspect.java:86 is STRING equality. A row-order
      flip after VACUUM/UPDATE-MOVE emits a spurious activity record showing the same owners "changed".
      Source: ActivityHandler S-E-4 + P-018.
    test_class: integration
    criticality: MEDIUM
    node_ids:
      - "odd-platform java service activity handler:ActivityHandler"
    feature_id: F-021
    detail_path: detail/TEST-GAP-873.yaml

  - gap_id: TEST-GAP-874
    behaviour: |
      **MEDIUM — Cursor pagination's `(trunc(created_at, SECOND), id)` truncates BOTH sides of the
      comparator to second-precision but ORDER BY sorts at full microsecond precision. Under sustained
      write rate, same-second rows may appear in different visual orders across page boundaries
      (CORRECTED from v0.2 "skip rows" claim — Stress Protocol re-classifies as visual-order shuffle).**
      Source: ReactiveActivityRepositoryImpl C2 + P-021.
    test_class: integration
    criticality: MEDIUM
    node_ids:
      - "odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl"
      - "odd-platform java ActivityController controller-class:ActivityController"
    feature_id: F-021
    detail_path: detail/TEST-GAP-874.yaml

  - gap_id: TEST-GAP-875
    behaviour: |
      **MEDIUM — Housekeeping `DROP TABLE <activity_partition>` takes ACCESS EXCLUSIVE,
      blocking concurrent SELECT/INSERT touching that partition. Under partition cycling + read traffic,
      reads stall in a measurable but currently unmeasured way (latency spike of seconds, not data loss).**
      Different victim than TEST-GAP-870 (which is data loss). Source: ReactiveActivityRepositoryImpl E1 + P-022.
    test_class: performance
    criticality: MEDIUM
    node_ids:
      - "odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl"
      - "odd-platform java housekeeping job:ActivityEmptyPartitionsHousekeepingJob"
    feature_id: F-010
    detail_path: detail/TEST-GAP-875.yaml

  - gap_id: TEST-GAP-876
    behaviour: |
      **MEDIUM — `getActivityCounts(beginDate, endDate, ...)` does NOT validate null dates,
      asymmetric to `getActivityList` (which throws BadUserRequestException on null dates). A call to
      `/api/activity/counts` without dates triggers 4 parallel full-table COUNT(*) scans over the
      entire retained activity history (millions of rows on multi-year deployments).** Source: ActivityServiceImpl S-B-3 + P-023.
    test_class: performance
    criticality: MEDIUM
    node_ids:
      - "odd-platform java service:ActivityServiceImpl"
    feature_id: F-021
    detail_path: detail/TEST-GAP-876.yaml

  - gap_id: TEST-GAP-877
    behaviour: |
      **LOW — `ActivityEmptyPartitionsHousekeepingJob` runs `SELECT count(*) = 0 FROM <partition>`
      per past partition every 15 min — a SEQUENTIAL SCAN on every populated past partition. On a
      multi-year deployment with 60+ partitions, this is 96 cycles/day × 60 scans = 5760 sequential
      scans/day, ALL to determine count = 0 vs > 0. The fix is trivial (NOT EXISTS / LIMIT 1).**
      Source: ActivityEmptyPartitionsHousekeepingJob P-013.
    test_class: performance
    criticality: LOW
    node_ids:
      - "odd-platform java housekeeping job:ActivityEmptyPartitionsHousekeepingJob"
    feature_id: F-010
    detail_path: detail/TEST-GAP-877.yaml

  - gap_id: TEST-GAP-878
    behaviour: |
      **MEDIUM — `ActivityController.getActivity` validation path uses `Flux.error(BadUserRequestException)`
      from the service, wrapped by the controller as `Mono.just(<flux>).map(ResponseEntity::ok)`. Whether
      @RestControllerAdvice catches the error before the 200 headers commit, or whether the body errors
      mid-stream, is currently UNTESTED — the WebFlux body-subscription seam is the question.**
      Source: ActivityController S-B-2 + P-015.
    test_class: integration
    criticality: MEDIUM
    node_ids:
      - "odd-platform java ActivityController controller-class:ActivityController"
    feature_id: F-021
    detail_path: detail/TEST-GAP-878.yaml

  - gap_id: TEST-GAP-879
    behaviour: |
      **MEDIUM — `size` parameter on `GET /api/activity` is declared `required: true` in OpenAPI
      (`components.yaml:4226`) but the Java method signature accepts `final Integer size` (NULLABLE,
      no @Max, no @NotNull). `size=null` propagates to JOOQ `.limit(null)` = no LIMIT clause = unbounded
      scan. DOC-vs-SPEC-vs-CODE inconsistency.** Source: ActivityController S-A-1 + P-016.
    test_class: unit
    criticality: MEDIUM
    node_ids:
      - "odd-platform java ActivityController controller-class:ActivityController"
      - "odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl"
    feature_id: F-021
    detail_path: detail/TEST-GAP-879.yaml

  - gap_id: TEST-GAP-880
    behaviour: |
      **MEDIUM — `ActivityController.getActivity` underlying SQL has NO `queryTimeout`, NO Postgres
      `statement_timeout` hint, NO client-side bound. Client-disconnect cancellation semantic is untested;
      partition-creation-DDL stall during read is untested. Pool exhaustion is the latent risk.**
      Source: ActivityController E + P-014, P-017.
    test_class: integration
    criticality: MEDIUM
    node_ids:
      - "odd-platform java ActivityController controller-class:ActivityController"
      - "odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl"
    feature_id: F-021
    detail_path: detail/TEST-GAP-880.yaml

  - gap_id: TEST-GAP-881
    behaviour: |
      **LOW — `ActivityHandler.getUpdatedState(parameters, List<Long>)` default-throws
      `UnsupportedOperationException` UNLESS overridden. Only 2/18 concrete impls override
