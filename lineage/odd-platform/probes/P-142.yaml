realism_caveats: |
  The probe pins the UNGATED-READ hypothesis via two complementary tests.
  If both PASS, the GET /api/owners endpoint is genuinely UNGATED at the
  permission layer under LOGIN_FORM/OAUTH2/LDAP and anonymously reachable
  under DISABLED. Doc-gap-finder should add an explicit "Owner directory
  enumeration policy" section to the live owners page.

  Realism caveats:
  - The probe tests LOGIN_FORM only; OAUTH2 and LDAP modes have similar
    SecurityConstants wiring but their session-cookie acquisition is
    different (the arrange section's login endpoint depends on the mode).
    A complete coverage would run the same assertions under all three
    authenticated modes; the current probe is sufficient to establish
    the class of behavior under LOGIN_FORM and the DISABLED bypass.
  - The probe assumes the `query` filter narrows by exact-prefix match.
    Per the repository-tier sidecar, the predicate is a name-LIKE filter;
    'P142-Owner' should match the three seeded names.
  - If test (a) FAILS (the benign-reader is denied 403), the analyser's
    SecurityConstants Grep was wrong; re-check the SecurityRule list for
    a wildcard / NO_CONTEXT-pattern rule that covers GET /api/owners.
  - If test (b) FAILS (anonymous is denied under DISABLED), the analyser's
    cross-link to the batch-C DisabledAuthSecurityConfiguration sidecar
    is wrong; re-check the filter-chain registration under DISABLED.
