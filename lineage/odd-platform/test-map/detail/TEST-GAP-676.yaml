proposed_action: |-
  Testcontainers integration test. (a) Create a collector named 'snowflake-prod'. (b) Soft-delete via `CollectorServiceImpl.delete(id)`. (c) Attempt to create a NEW collector with the same name 'snowflake-prod'. (d) Assert: `UniqueConstraintException` raised (the FULL UNIQUE blocks). (e) Compare with the analogous role-side workflow: create a role 'Admin', soft-delete, re-create 'Admin' — succeeds with a fresh id (the PARTIAL UNIQUE permits). (f) Pin the asymmetry: `// REGRESSION-PIN — collector.name uses FULL UNIQUE; role.name / policy.name / owner.name / tag.name use PARTIAL UNIQUE WHERE deleted_at IS NULL. The asymmetry is a schema oversight from V0_0_29 not corrected by V0_0_64. REFACTOR-NNN will harmonise; this test flips to assert re-creation succeeds.`
