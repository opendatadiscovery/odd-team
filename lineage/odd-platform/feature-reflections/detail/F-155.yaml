- id: H-004
  hypothesis: "When a term has two query examples with identical SQL text, both render as distinct rows on the Query-Examples tab."
  derivation: "Negative-space — the list keys React rows on qe.definition (free-text), not qe.id; duplicate free text is a legitimate case (commonly-pasted snippets)."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      queryExamples.map renders QueryExamplesListItem with key={qe.definition}
      (TermQueryExamples.tsx:48-55, line 51), not key={qe.id}. React requires keys to be unique among
      siblings; when two query examples share the same definition string, React treats them as the same
      element and renders only the first, silently dropping the second from the DOM (and emitting a
      duplicate-key console warning visible only to developers). Every query example has a stable backend
      id (the sibling EntityClassItem uses key={entityClass.id}), so qe.id is the correct key. This is the
      F-155 facet react_key_on_qe_definition_text_potential_collision and scan finding F-155a.
    evidence:
      - sidecar: "(source_read_for_validation — UI hop unresolved)"
        section: ui
        cite: "TermQueryExamples.tsx:48-55 (key={qe.definition})"
        note: "free-text React key; duplicate definitions collide → silent row drop"
    operator_visible_failure: |
      Two query examples whose `definition` text is identical (e.g. two snippets both described "monthly
      revenue rollup", or two examples pasted from the same template) linked to one term: the tab shows
      only ONE of them. An operator counting "we documented 5 queries for the Customer term" sees 4. The
      drop is silent — no error, no placeholder — and is data-dependent, so it surfaces only for the
      specific terms that happen to accumulate duplicate-definition examples. Note the `definition` is the
      human description, NOT the SQL: two genuinely different queries with the same description collide
      even when their SQL differs, which makes the collision more likely than keying on the SQL would.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    source_read_for_validation: true

