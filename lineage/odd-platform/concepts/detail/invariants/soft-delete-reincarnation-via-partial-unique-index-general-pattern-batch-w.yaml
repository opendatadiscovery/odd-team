mitigations_unimplemented:
  - |-
    Document the lifecycle on the
    /features/management/{namespace,tag,owner,role,policy}
    operator-facing pages. The text:
      'Deleting a {entity} marks it as inactive but preserves
       historical bindings. Subsequent creates with the same name
       produce a NEW entity with a new id; historical bindings
       are NOT migrated to the new entity.'
    Five DOC-NNN candidates (one per entity type).
  - |-
    Add a /developer-guides/api-reference/lifecycle-semantics
    cross-cutting page. Single anchor for the soft-delete-reincarnation
    pattern; cross-link from every entity's per-feature page.
  - |-
    Add a 'restore' API surface for entities that ARE
    soft-delete-recoverable in principle. Currently the only restore
    path is direct SQL. A `POST /api/{entity}/{id}/restore` endpoint
    would surface the lifecycle as a first-class operation; would
    require new permissions (`{ENTITY}_RESTORE`); would need
    cascade-aware logic if children were soft-deleted in the same
    operation.
  - |-
    Fix the V0_0_64 convergence outliers (Collector, metadata_field).
    For each, add a migration converting the FULL unique to a
    PARTIAL unique keyed by `deleted_at IS NULL`. Operator-facing
    change: collector + metadata_field names become reusable after
    soft-delete (cross-link to metadata-field-soft-delete-partial-unique-index-mismatch
    invariant).
  - |-
    Add a housekeeping job that hard-deletes soft-deleted rows
    older than HOUSEKEEPING.TTL.SOFT_DELETED_DAYS (default 90?).
    The pattern currently has unbounded growth in the deleted_at
    IS NOT NULL portion of every table. Bounds the storage cost
    + matches the GDPR / data-retention contracts deployments
    typically need.

notes: |-
  This invariant captures the FIRST explicit framing of the
  soft-delete-reincarnation pattern as a platform-wide convention.
  Previous batches established the pattern at individual entities
  (Tag in batch F, Policy in batch H, Term in batch N, etc.);
  batch W (NamespaceController + the cross-batch trail) NAMES it
  as a general pattern AND identifies the deviations (Collector
  + metadata_field).

  The architectural commitment is uniform 'soft-delete with
  name-reuse' for 6 of the 8 catalogued tables. The two outliers
  are EITHER bugs (the V0_0_64 convergence missed them) OR
  intentional (collector + metadata_field are exempt from the
  reincarnation pattern for some reason). The maintainer's call —
  the V0_0_64 commit message would clarify, but the cross-batch
  evidence frames this as a code-omission BUG class (the outliers
  cluster with the no-deleted_at + outlier-FK pattern that all the
  other tables ultimately corrected).

  Cross-cutting connections:
    - Pairs with three-soft-delete-mechanisms-across-the-repository-layer
      (THIS invariant adds the PARTIAL-UNIQUE-INDEX consequence
      as a separate facet; the master invariant focuses on the
      DELETION mechanism, this one on the RECREATION semantic)
    - Pairs with cascade-on-delete-application-tier-guarded-across-n-referent-classes
      (THIS BATCH sibling) — the cascade-guard and the reincarnation
      together form the canonical lifecycle
    - Pairs with metadata-field-soft-delete-partial-unique-index-mismatch
      (the metadata_field outlier — same class as the Collector
      outlier; both V0_0_64 misses)
    - Pairs with datasource-name-partial-unique-silent-rollback-on-collector-rename
      (the data_source-side variant of the pattern — partial unique
      on data_source.name + the collector-vs-operator mutation
      asymmetry)

  Three DOC-NNN candidates (one for each surface that should
  describe the lifecycle):
    (a) Per-entity operator-facing docs — admonition on each
        Management → {Tab} page
    (b) Cross-cutting lifecycle-semantics page — single anchor
        in /developer-guides
    (c) Operator playbook for the restore-from-soft-delete edge
        case — direct SQL with the unique-index caveat
