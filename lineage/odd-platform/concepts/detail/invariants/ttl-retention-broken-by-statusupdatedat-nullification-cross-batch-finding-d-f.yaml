name: TTL retention broken by statusUpdatedAt nullification (cross-batch finding D
  + F)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW CROSS-BATCH INVARIANT, batch 2026-05-12F** — load-bearing cross-batch
  defect surfaced only when batch D''s HousekeepingTTLProperties + batch F''s updateStatus
  sidecars are combined. The platform''s 30-day data-entity-delete retention TTL relies
  on `DATA_ENTITY.STATUS_UPDATED_AT` (queried by `DataEntityHousekeepingJob.java:73-82`
  as `STATUS_UPDATED_AT <= now - housekeeping.ttl.data_entity_delete_days`). But `DataEntityMapperImpl.applyStatus`
  (lines 242-253) sets `pojo.setStatus(statusDto.getId())` on line 247 BEFORE the
  `if (statusDto.getId() != pojo.getStatus())` check on line 249 — at the point of
  the check, `pojo.getStatus()` already equals `statusDto.getId()`, so the condition
  is always FALSE and `statusUpdatedAt` is NEVER set on ANY status transition. The
  housekeeping query then evaluates `STATUS_UPDATED_AT <= cutoff` against a NULL column
  — NULL `<= ` cutoff evaluates to NULL (≈ false in SQL three-valued logic) — and
  the soft-deleted entities are NEVER hard-deleted. Two-fold defect: (a) the documented
  30-day retention window is BROKEN — soft-deleted entities accumulate indefinitely
  instead of being purged after 30 days; (b) the soft-delete cascade (lineage / group-relations
  / parent-group-relations / statistics / filled-flag) is INVISIBLE to the housekeeping
  TTL — the cascade fires on the status-flip but the cleanup-after-TTL never fires.
  Two-sidecar pattern that emerges ONLY when both sides exist: batch D''s HousekeepingTTLProperties
  surfaces ''retention claim 30 days''; batch F''s updateStatus surfaces ''ordering
  bug nulls the column the retention claim depends on''. Neither sidecar alone reveals
  the defect — the cross-batch view is load-bearing. Fix is trivial (capture the prior
  status before mutating, or use a boolean local before `setStatus`); the bug is present
  at the verified commit ede5d277. HIGH severity: combines doc-vs-code drift AND silent-data-bloat
  AND the LSN-001-shape pattern of ''feature ships disabled-but-broken''.'
