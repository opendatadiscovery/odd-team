behaviour: |-
  **No observability across the OAuth2 auth + logout chain — silent decisions, silent failures, silent rejections.** Across all 5 OIDC user handlers + 5 OIDC logout handlers (10 production classes total): (a) NO log statements on rejection paths (`OAuth2AuthenticationException` throws are silent; Spring framework emits its own logs but the auth-decision context is lost); (b) NO log statements on ADMIN role assignment (a successful admin login leaves NO ODD-platform audit trail); (c) NO log statements on logout (the WebSession invalidation site is unlogged); (d) NO metric counters (no Micrometer @Timed, no `@Counted` on auth-decision sites). An operator investigating a security incident has no in-app trail showing 'user X attempted login, rejected due to Y' or 'user Y was granted ADMIN at time Z'. This is a CROSS-HANDLER finding: ALL OAuth handlers share this characteristic — symmetric across Cognito/Azure/Google/GitHub/ODDIAM user enrichment AND across all 5 logout handlers. Test pins the absence so introduction of observability is a deliberate test update.
