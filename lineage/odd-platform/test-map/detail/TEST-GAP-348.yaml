behaviour: '**PARTIAL UNIQUE INDEX RECREATION CONTRACT.** create() with a name colliding
  against a SOFT-DELETED policy succeeds (the partial unique index `policy_name_unique
  ON policy(name) WHERE deleted_at IS NULL` excludes deleted_at IS NOT NULL rows).
  This is the soft-delete-aware recreation invariant the platform relies on. A maintainer
  removing the `WHERE deleted_at IS NULL` predicate from the migration would silently
  trap names forever after deletion. test_class: integration.'
