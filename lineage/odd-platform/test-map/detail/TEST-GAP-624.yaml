behaviour: |-
  **TWO STATUS-CODE DRIFTS in updateOwner: (1) rename-collision as 400 USR003 not 409 Conflict; (2) OpenAPI 201 vs controller 200.** Drift 1: rename to a name already held by another ACTIVE Owner triggers the partial-unique index `owner_name_unique ON owner(name) WHERE deleted_at IS NULL` (V0_0_64__remove_is_deleted_field.sql:70) → jOOQ DataAccessException → UniqueConstraintException → ControllerAdvice.handleUniqueConstraint → HTTP 400 with `ErrorCode.UNIQUE_CONSTRAINT` (USR003). The client receives 400 NOT the canonically-correct 409 Conflict. NO test verifies this code path; NO API doc indicates which code the client should expect on collision. Drift 2: openapi.yaml:195-201 declares `responses.'201': 'The resource has been successfully updated'` for updateOwner operation, but the controller returns ResponseEntity.ok = 200 (OwnerController.java:53). The drift is DOUBLY anomalous: (a) declaring 201 for a PUT-update is itself unusual (201 canonically signals POST-creation); (b) the implementation disagrees with the spec. This is the SAME class-wide drift as createOwner (also 201 declared, 200 returned — see TEST-GAP-235). Sibling Role + Policy CRUD share the same pattern. Both drifts surface to API consumers as silent operational hazards: clients written against the OpenAPI spec expect 201 (incorrect today), clients debugging collision errors see USR003 BAD_REQUEST instead of CONFLICT.
