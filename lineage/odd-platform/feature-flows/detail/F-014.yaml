observed_vs_expected:
  facets:
  - facet: cross-owner per-entity alert read — REFACTOR-024 family extension
    observed: |-
      The endpoint has NO permission gate at the controller, NO entry in
      SecurityConstants.SECURITY_RULES for the GET path, and NO OWNERSHIP
      join at the repository (ReactiveAlertRepositoryImpl.java:182-199).
      Falls through to AuthorizationCustomizer's catch-all
      `pathMatchers("/**").authenticated()` at lines 29-30 — any
      authenticated caller passes. An attacker who enumerates
      data_entity_id values via any other read endpoint (search,
      getDataEntityDetails) can read every alert ever raised on every
      catalogued entity, including alert chunks (raw description text
      propagated from ingestion / AlertManager webhooks per F-007). The
      live alerting doc (WebFetched 2026-05-19 status 200) names this
      endpoint as the audit-export workaround but does NOT specify
      owner-scoping; the page is silent on whether the cross-owner posture
      is intentional. Pairs with REFACTOR-024 (catalog-wide cross-owner
      enumeration on getAllAlerts).
    expected: |-
      Either: (a) add owner-scoping at the read path (OWNERSHIP join +
      principal-derived predicate, matching listByOwner) and update the
      page to recommend the My Objects tab for personal audit exports;
      OR (b) document the cross-owner read posture explicitly on the
      alerting page so operators understand the access model when wiring
      the audit-export workaround.
    drift_class: cross_owner_per_entity_alert_read
    provenance: |-
      STATIC — primary-source in batch L getDataEntityAlerts sidecar
      bugs_limitations_corner_cases[0] + security.known_security_gaps[0]
      + DataEntityController.java:315-321 + AlertServiceImpl.java:138-143
      + ReactiveAlertRepositoryImpl.java:182-199 (no OWNERSHIP join) +
      :160-178 (listByOwner DOES join) + SecurityConstants.java:98-355
      (no rule for the path) + AuthorizationCustomizer.java:29-30
      (catch-all `.authenticated()`) + WebFetch alerting page 2026-05-19.
      Severity: HIGH.
  - facet: soft-delete-inclusive existence check — cross-channel leak surface
    observed: |-
      AlertServiceImpl.getDataEntityAlerts (line 140) gates on
      `existsIncludingSoftDeleted` (AlertServiceImpl.java:327-335 →
      ReactiveDataEntityRepositoryImpl.java:150-155). The sibling
      listByOwner query DOES filter `DATA_ENTITY.STATUS != DELETED`
      (ReactiveAlertRepositoryImpl.java:166-167) but this per-entity path
      does not. Behaviour is deliberate (the helper name encodes intent
      — see implicit_adrs[1] in sidecar) and matches the audit-export
      workaround use case. The side-effect: a caller passing a
      soft-deleted dataEntityId receives 200 OK with the entity's
      pre-deletion alert history; the entity itself is hidden from the
      catalog UI's list endpoints. Cross-channel leak — visible via
      alerts API + invisible in catalog list API. An attacker with prior
      knowledge of a soft-deleted entity's ID (leaked audit log, prior
      credentials, monotonically-increasing ID enumeration) can read
      the alert history that the operators thought was hidden by the
      soft-delete.
    expected: |-
      Either: (a) document the soft-delete-inclusive read posture
      explicitly on the alerting page (operators expect "hidden in catalog
      = hidden everywhere"), OR (b) filter the read by
      `DATA_ENTITY.STATUS != DELETED` to make the soft-delete actually
      hide the entity end-to-end.
    drift_class: soft_delete_inclusive_existence_check
    provenance: |-
      STATIC — primary-source in batch L sidecar implicit_adrs[1] +
      bugs_limitations_corner_cases[1] + AlertServiceImpl.java:327-335
      + ReactiveDataEntityRepositoryImpl.java:150-155 +
      ReactiveAlertRepositoryImpl.java:166-167 (the sibling that DOES
      filter). Severity: LOW.
  - facet: no alert-status filter — asymmetric with sibling counts endpoint
    observed: |-
      getDataEntityAlertsCounts (DataEntityController.java:324-330)
      accepts an `AlertStatus status` query param and filters by status
      at ReactiveAlertRepositoryImpl.java:202-215. getDataEntityAlerts
      (lines 315-321) does NOT — it returns ALL statuses (OPEN /
      RESOLVED / RESOLVED_AUTOMATICALLY). A caller wanting only OPEN
      alerts must paginate the full set and filter client-side, or hit
      the counts endpoint for an unfiltered total mismatch. No comment
      or annotation defends the asymmetry.
    expected: |-
      Either: (a) add the `status` query param to the listing endpoint
      to match the counts endpoint shape, OR (b) document the asymmetry
      and recommend the workaround.
    drift_class: no_alert_status_filter_asymmetric_with_sibling_counts
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[3] +
      DataEntityController.java:315-321 vs :324-330 +
      ReactiveAlertRepositoryImpl.java:182-199 (no status filter) vs
      :202-215 (DOES filter). Severity: LOW.
  - facet: unbounded pagination size at every layer
    observed: |-
      The controller does not validate `page` or `size`
      (DataEntityController.java:317-318 — Integer page, Integer size
      without validation annotations); the OpenAPI PageParam / SizeParam
      at components.yaml:4213-4229 carry no `minimum:` or `maximum:`;
      the repository computes `OFFSET = (page - 1) * size`
      (ReactiveAlertRepositoryImpl.java:189) with no clamping. A caller
      passing `size=1_000_000` triggers a single jOOQ query bounded only
      by Postgres / network buffers; `page=0` produces a negative OFFSET
      and downstream behaviour is implementation-defined. The
      audit-export workaround amplifies the risk — operators following
      the doc page may default to large pages to complete an export
      with fewer round-trips.
    expected: |-
      Add `maximum: 1000` (or platform-appropriate bound) to SizeParam in
      components.yaml; add `minimum: 1` to PageParam; clamp at the
      controller boundary with explicit @Min/@Max annotations.
    drift_class: unbounded_pagination_size_at_every_layer
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[2] +
      DataEntityController.java:317-318 + openapi.yaml:1326-1329 +
      components.yaml:4213-4229 + ReactiveAlertRepositoryImpl.java:189.
      Severity: MEDIUM.
  - facet: read/write SecurityRule asymmetry on entity-scoped namespace
    observed: |-
      The mutation endpoint on the same entity-scoped namespace —
      PUT /api/dataentities/{data_entity_id}/alert_config — IS
      registered in SecurityConstants.SECURITY_RULES at
      SecurityConstants.java:304-307 and pairs the `DATA_ENTITY` resource
      type with the `DATA_ENTITY_ALERT_CONFIG_UPDATE` permission. The
      read endpoint GET /api/dataentities/{data_entity_id}/alerts is
      ABSENT from the rule list. No comment, annotation, or surrounding
      code defends the read/write asymmetry as intentional — the
      absence of permission gates on GET endpoints is a class-wide
      convention (per implicit_adrs[0] in sidecar) but the convention
      itself has no inline justification.
    expected: |-
      Either: (a) add a read-side SecurityRule binding a new
      DATA_ENTITY_ALERTS_READ permission to the path, OR (b) explicitly
      document the convention "GETs are not Permission-gated; reads are
      authenticated-only with intentional per-endpoint scoping at the
      repository layer".
    drift_class: read_write_security_rule_asymmetry
    provenance: |-
      STATIC — primary-source in batch L sidecar
      security.known_security_gaps[1] + implicit_adrs[0] +
      SecurityConstants.java:98-355 (all entries are mutations) +
      SecurityConstants.java:304-307 (alert_config PUT IS gated).
      Severity: MEDIUM.
  - facet: DISABLED-mode anonymous read of all alerts
    observed: |-
      Under auth.type=DISABLED, the missing SecurityRule entry combined
      with `.anyExchange().permitAll()` means any unauthenticated client
      on the network can read every alert ever raised on every
      catalogued entity by enumerating data_entity_id. DISABLED is
      documented as a dev-only mode, but operators who misuse it expose
      the full alert audit trail across the platform — including
      AlertManager-pushed alerts (per F-007 cross-tenant alert creation)
      with raw generator-URL text.
    expected: |-
      DISABLED documented as truly dev-only; the pattern repeats across
      batches A/B/C/E/F/G/K.
    drift_class: disabled_mode_bypass
    provenance: |-
      STATIC — cross-ref batches A/B/C/E/F/G/K DISABLED-bypass pattern +
      SecurityConstants.java:98-355 (no rule for the path) +
      DataEntityController.java:315-321. Severity: MEDIUM on
      network-reachable DISABLED; LOW if honestly dev-only.
  - facet: workaround doc silent on pagination + cross-owner scoping
    observed: |-
      The live alerting page (WebFetched 2026-05-19 status 200) names
      `GET /api/dataentities/{data_entity_id}/alerts` as the audit-export
      workaround for the housekeeping-cleanup bug. The page does NOT
      mention: (a) the pagination shape (page / size params required,
      with no recommended page size — operators may default to small
      pages and silently truncate exports, OR default to large pages and
      degrade server response time), (b) the cross-owner read posture
      (operators following the workaround for THEIR OWN entity's alerts
      think the endpoint is owner-scoped — it is not), (c) the
      soft-delete-inclusive behaviour (operators may not realise the
      endpoint returns audit data for entities the catalog UI hides).
    expected: |-
      Augment the alerting page's #auto-cleanup-of-resolved-alerts
      section with a "Workaround completeness notes" subsection covering
      pagination, cross-owner posture, and soft-delete behaviour.
    drift_class: workaround_doc_silent_on_pagination_and_scoping
    provenance: |-
      STATIC — primary-source in batch L sidecar
      docs_link_semantic.doc_drift_findings[0] +
      docs_link_semantic.doc_drift_findings[1] + WebFetch alerting page
      2026-05-19. Severity: MEDIUM (operationally — operators following
      the doc literally may silently truncate exports).
  - facet: cross-channel leak — soft-deleted entity alerts reachable while entity hidden
    observed: |-
      Soft-deleted data entities' alert history is reachable through
      this endpoint while being hidden from the catalog list endpoints.
      The cross-channel asymmetry (visible via alerts API + invisible in
      catalog list API) is consistent with the platform's audit-export
      use case but creates a discovery surface: an attacker who has prior
      knowledge of a soft-deleted entity's ID (leaked audit log, prior
      credentials, monotonically-increasing ID enumeration) can read the
      alert history that the operators thought was hidden by the
      soft-delete.
    expected: |-
      Either: (a) filter the read by status != DELETED to make the
      soft-delete actually hide the entity end-to-end, OR (b) document
      the cross-channel behaviour explicitly.
    drift_class: cross_channel_leak_soft_deleted_entity_alerts
    provenance: |-
      STATIC — primary-source in batch L sidecar
      security.known_security_gaps[2] + AlertServiceImpl.java:327-335 +
      ReactiveDataEntityRepositoryImpl.java:150-155 + WebFetch alerting
      page 2026-05-19 (silent on soft-delete behaviour). Severity: LOW.
  - facet: AlertItem Resolve/Reopen — post-action permission discovery
    observed: |-
      AlertItem.tsx:48-70 — the Resolve/Reopen Button is rendered
      unconditionally enabled (`disabled={disableResolve}` where
      disableResolve starts as `false`). On click, `handleResolve`
      fires `fetchResourcePermissions(...)` and ONLY THEN evaluates
      whether the caller has DATA_ENTITY_ALERT_RESOLVE. If absent,
      the button transitions to disabled and a small "No access!"
      caption appears inline. User-observable promise: actionable
      button. User-observable reality: speculative button —
      the permission check happens after click. Shared component
      across the global Alerts list AND the per-entity Alerts tab,
      so the anti-pattern surfaces on both surfaces. Bad UX —
      users learn permissions by clicking, not by visual cue.
    expected: |-
      Either (a) pre-fetch permission state for visible alerts on
