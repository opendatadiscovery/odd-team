notes: |-
  NEW invariant captured in batch 2026-05-25-ZD. STRENGTHENED in batch
  ZE with the FeatureController + LinksController LIMITED-RISK FACET
  additions — both anonymously reachable under DISABLED but with
  narrower information disclosure than IdentityController.

  Mitigation candidates (additive on top of the master invariant):

    (1) Replace `switchIfEmpty(Mono.just(dummyOwner))` with
        `switchIfEmpty(Mono.error(new AuthenticationException(...)))`
        and let the controller return 401.

    (2) Restrict dummyOwner to a curated minimum-permission set
        rather than `Permission.values()`.

    (3) Emit `Cache-Control: no-store` + audit log on every
        whoami invocation.

    (4) Doc-side: admonition on every relevant authentication
        and authorization page naming the under-DISABLED admin
        fallback.

    (5) NEW batch ZE — Under DISABLED, EITHER reject
        /api/features/active + /api/links + integrations anonymously
        (preserving the operator-policy-configurable information
        surface from external scanners) OR explicitly document the
        LIMITED-RISK fingerprint exposure on the
        disabled-authentication page.

  Cross-references:
    - LSN-001 + LSN-002: case-law precedents
    - The defence-in-depth gap is the single most important
      regression-target to harden via a security-class
      integration test.
