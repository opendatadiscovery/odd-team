name: |-
  Slack channels autocomplete — 1-minute Caffeine cache staleness window + startsWith-not-contains filter (batch ZF)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
description: |-
  **NEW LOW-to-MEDIUM-severity INVARIANT, batch 2026-05-25-ZF** —
  the `GET /api/datacollaboration/providers/slack/channels` endpoint
  in DataCollaborationController is the channel-autocomplete data
  source for the Discussions sub-feature's Slack channel picker.
  Two composable behaviours produce a surprising UX:

  (1) **1-minute Caffeine async-loading cache** fronts the Slack
      `conversations.list` API at SlackMessageProviderClient
      (`SlackMessageProviderClient.java:36-44`):
        AsyncLoadingCache, expireAfterWrite=1 MINUTE,
        maximumSize=1, keyed on a fixed sentinel string

      A freshly-invited bot is INVISIBLE to the autocomplete for
      up to 60 seconds; a freshly-removed bot is still VISIBLE
      for up to 60 seconds. No cache-invalidation hook on
      `member_joined_channel` / `member_left_channel` Slack
      events (EventApiController does process those events but
      does not invalidate the cache; the cache lives in
      SlackMessageProviderClient, NOT in the event processor).

  (2) **startsWith-not-contains channel-name filter** at
      `SlackMessageProviderClient.java:50-55`:
        slackChannel.name().startsWith(nameLike)

      A user typing `platform` to find `#odd-platform-alerts`
      gets ZERO results despite the channel existing in the
      bot's joined set. The UI's debounced 500ms autocomplete
      (`SlackChannelsAutocomplete.tsx:43-54`) drives this filter
      on every keystroke; the only feedback the user gets is an
      empty dropdown.

  ## THE PRIMARY-SOURCE EVIDENCE

  SlackMessageProviderClient.java:36-44 (the cache):
    @PostConstruct
    public void init() {
      asyncLoadingCache = Caffeine.newBuilder()
          .maximumSize(1)
          .expireAfterWrite(1, MINUTES)
          .buildAsync(this::loadChannelsAsync);
    }

  SlackMessageProviderClient.java:50-55 (the filter):
    return slackAPIClient.getSlackChannels()
        .map(channels -> channels.values().stream()
            .filter(channel -> channel.name().startsWith(nameLike))
            .map(channel -> channel.id())
            .collect(...));

  No `.contains(...)` call appears anywhere in the SlackMessageProviderClient
  body (verified by reading the class end-to-end). The filter is
  exact-prefix matching only.

  ## CHANNEL CACHE MISS COST

  When the cache expires, the next caller's request triggers a
  paginated `conversations.list` walk at 200 channels/page
  (`SlackAPIClientImpl.java:26, 30-47, 130-141`):
    - For a workspace with 1000 channels: 5 Slack API round-trips
      per cache miss
    - For a workspace with 10K+ channels: 50+ round-trips per
      cache miss
    - The full Map<String, MessageChannelDto> materialises in
      memory before being cached
    - At 50-100 bytes per Map entry × 10K channels = 1-2 MB heap
      allocation per cache miss

  Cache miss happens every minute under sustained autocomplete
  use. Concurrent first-callers after eviction all wait on the
  same Caffeine CompletableFuture (no thundering herd by design),
  but the cost per cache miss scales linearly with workspace
  channel count.

  ## CHANNEL FILTER PROTOCOL

  The Slack `conversations.list` request itself
  (`SlackAPIClientImpl.java:130-141`) applies:
    - `excludeArchived(true)` — hide archived channels
    - `types(PUBLIC_CHANNEL)` — public channels only
    - then post-filter: `.filter(Conversation::isMember)` — only
      channels the bot has been added to (`SlackAPIClientImpl.java:45`)

  The bot therefore sees ONLY public channels it has been
  EXPLICITLY added to. Private channels, DMs, and group DMs are
  excluded entirely. Combined with the startsWith filter at the
  client tier, the autocomplete's effective search space is:
    (public channels the bot is in) WHERE (name starts with query)

  Operators expecting an "ODD bot can search any channel" UX get
  a surprise; operators expecting "fuzzy search" get a different
  surprise.

  ## CONTRAST WITH THE LIVE DOCS

  Live api-reference page
  (`https://docs.opendatadiscovery.org/developer-guides/api-reference/data-collaboration`,
  WebFetched 2026-05-25, status 200) describes the endpoint as
  "List Slack channels the bot can write to, optionally filtered
  by `channel_name`. Used by the in-app channel autocomplete."

  The doc does NOT specify:
    - Whether the filter is `startsWith` / `contains` / `fuzzy`
    - That a 1-minute cache TTL applies
    - That only public bot-member channels are listed
    - That archived channels are excluded
    - The cache-miss cost on large workspaces

  An integrator using the OpenAPI-generated client cannot infer
  these behaviours from the documentation alone.

  ## CONTRAST WITH SIBLING FEATURE — Slack invite reflection

  The platform PROCESSES `member_joined_channel` events via
  `EventApiController` + the SlackEventParser routing. The
  parser's default behaviour is to FILTER (silently ack-200)
  events that aren't thread-reply messages
  (per the parser's filter chain at `SlackEventParser.java:38-43`).
  There is no event-handler subscribing to `member_joined_channel`
  that would invalidate the SlackMessageProviderClient cache.

  The two halves of the system are decoupled by design (events
  → message_provider_event for message-thread mirroring;
  channel-list cache → autocomplete-only). A future enhancement
  to wire member-change events to cache invalidation would close
  the 60-second staleness window.

  ## SEVERITY LOW-to-MEDIUM

  Functional impact:
    - UX: a user invites the bot to a new channel and waits up
      to 60 seconds before the channel appears in the autocomplete
    - UX: a user types the middle of a channel name and gets zero
      results despite the channel existing
    - Performance: 50+ Slack API round-trips per cache miss for
      large workspaces; bounded by the 1-minute cache TTL
    - No data-loss, no security gap (the cache is read-only;
      channel listing is the only operation cached)
