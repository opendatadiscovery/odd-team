- id: H-002
  hypothesis: "When two operators open the Notification Settings dialog on the same entity and submit different halt-until values, the platform detects the concurrent edit (version check / If-Match) rather than silently letting the last writer overwrite the first."
  derivation: "Negative-space + the feature-flow facet notification_settings_no_optimistic_concurrency_check (marked ui_unverified at the backend tier); a senior PO checks whether a multi-operator mutation surface protects against lost updates."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The write is unconditional last-writer-wins. AlertHaltConfigService.saveAlertHaltConfig delegates
      to AlertHaltConfigRepositoryImpl.create, which is an INSERT...ON CONFLICT (DATA_ENTITY_ID) DO
      UPDATE SET distribution_anomaly_halt_until=..., incompatible_schema_halt_until=...,
      failed_dq_test_halt_until=..., failed_job_halt_until=... (AlertHaltConfigRepositoryImpl.java:50-64,
      read this session). There is NO version column referenced, NO conditional WHERE on a prior value,
      and NO If-Match precondition at the controller (PUT /api/dataentities/{id}/alert_config carries no
      ETag plumbing). The DO UPDATE overwrites ALL FOUR halt columns with whatever the submitting form
      held. So operator B's submit, made from a dialog that opened on stale v1 data, silently replaces
      operator A's v1+A write with v1+B — A's change is lost with no warning to either operator. This
      RESOLVES the feature-flow's ui_unverified flag on this facet ("whether the backend accepts
      unconditional writes or carries an ETag has not been traced") — it accepts unconditional writes.
    evidence:
      - sidecar: "(source_read_for_validation — AlertHaltConfigRepositoryImpl.java has no enriched sidecar)"
        section: "AlertHaltConfigRepositoryImpl.create()"
        cite: "AlertHaltConfigRepositoryImpl.java:50-64"
        note: "INSERT...ON CONFLICT(DATA_ENTITY_ID) DO UPDATE SET <all 4 halt columns> — no version, no conditional WHERE"
        source_read_for_validation: true
      - sidecar: "(source_read_for_validation — AlertHaltConfigServiceImplTest.java)"
        section: "saveAlertHaltConfig_persistsAndReturnsMappedConfig"
        cite: "AlertHaltConfigServiceImplTest.java:81-93"
        note: "service test confirms save = mapForm -> repository.create -> mapPojo; the create is the unconditional upsert"
    operator_visible_failure: |
      Two failure modes. (a) Lost update: in a multi-operator team, A and B both open Notification
      Settings on the same hot entity during an incident, each toggles a different alert type's halt
      window, and whoever submits second silently wipes the other's change — the entity then alerts (or
      stays silent) in a way neither operator configured, and there is no audit-log entry for the
      halt-config mutation to reconstruct what happened. (b) Because the DO UPDATE sets ALL four columns,
      even editing ONE alert type's window rewrites the other three to whatever the (possibly stale)
      dialog held — so a concurrent edit can silently re-arm an alert type a colleague had just disabled.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    dedup_note: "ALREADY TRACKED both sides — PLT-053 Defect 1 (code: add a version column + If-Match + 412-on-stale) and DOC-201 (done; doc-side known-limitation). This reflection's NET-NEW contribution is the SQL-tier confirmation (the upsert is unconditional last-writer-wins AND DO UPDATE rewrites all four columns) which resolves the feature-flow's ui_unverified flag and strengthens PLT-053 Defect 1's evidence. New drift class proposed: halt_config_upsert_unconditional_last_writer_wins_no_version_column. distinct_from: nothing — it IS PLT-053 Defect 1, now with backend evidence."

