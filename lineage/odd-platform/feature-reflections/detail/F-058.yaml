        section: stress_findings.request_inputs (query)
        cite: "LookupTables.tsx:50-52, 70"
        note: "Per-keystroke fire flagged as a performance concern (debounce unknown)."
    operator_visible_failure: |-
      Probe-pending: if undebounced, a fast typist generates one server-side facet
      recompute per character — measurable load at scale and visible micro-latency on
      each keystroke. Not a correctness failure; a performance/cost posture to confirm.
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-058-2
    routes_to_finding: caveat-candidate
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

