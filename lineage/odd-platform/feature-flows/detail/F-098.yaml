feature_id: F-098
feature_name: |-
  Slack Events Webhook Inbound Integration Security — `POST /api/slack/events`
  accepts forged events from any internet host because Slack signing-secret
  HMAC verification is not implemented
pillar_id: P-10
pillar_anchored_id: P-10:F-005
pillar_anchored_feature_name: |-
  Slack Events inbound integration receiver — the platform's inbound boundary
  for the Slack Events API integration (sister to the alert-OUTBOUND Slack
  webhook). Whitelisted from auth in every supported mode; no
  X-Slack-Signature HMAC verification; no `(provider, event_id)` uniqueness
  for at-least-once delivery dedup
seeded_from: SHB-129
seeded_at: 2026-05-26
batch_origin: 'batch-shoebox-graduation 2026-05-26 — slice G'

discovered_from_entry_point: |-
  rest:POST /api/slack/events → EventApiController.handle → SlackEventParser.parse
  → message_provider_event INSERT → downstream message materialiser. In
  SecurityConstants.WHITELIST_PATHS — anonymously reachable in every supported
  auth mode.

