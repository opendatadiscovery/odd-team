notes: |-
  Surfaced batch 2026-05-20Z by the odd-platform-public-api spec sidecar.

  Two distinct concerns in one entry:
    (1) Legacy 'ProspectLog' branding — cosmetic, downstream-visible.
    (2) Individual contributor email in the contact block — PII concern
        under default deployment.

  Both surface at the developer-facing API contract layer; both are
  one-line spec changes. Maintainer-decision warranted because the
  rename is downstream-visible on every running deployment's
  Swagger UI.

