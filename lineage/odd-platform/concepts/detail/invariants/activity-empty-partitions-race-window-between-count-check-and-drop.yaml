name: ActivityEmptyPartitionsHousekeepingJob — race window between count(*)=0 check
  and DROP TABLE produces silent row loss
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-08
- P-07
description: |-
  **NEW INVARIANT, batch VAL-LSN-019-B (2026-05-20)** — surfaced by
  primary-source examination of ActivityEmptyPartitionsHousekeepingJob
  combined with PartitionServiceImpl. The job's name promises "drop only
  EMPTY past partitions" — and the check at the centre (real
  `SELECT count(*) = 0 FROM <partition>` at PartitionServiceImpl.java:133-142
  combined with `isPartitionInPast` at line 86,129-131) honors the
  promise SEMANTICALLY. But the check-then-drop sequence is
  non-transactional, opening a race window during which a concurrent
  INSERT can land between the check and the DROP, producing silent
  audit data loss.

  **THE TWO-STATEMENT NON-TRANSACTIONAL PATTERN**:
    `PartitionServiceImpl.getEmptyPastPartitions` runs `SELECT count(*) = 0`
    (line 134) followed by `DROP TABLE <partition>` (line 122) — TWO
    SEPARATE SQL STATEMENTS on the same shared Connection. They are NOT
    wrapped in `DSL.using(connection).transaction(ctx -> {...})` — unlike
    `AlertHousekeepingJob` and `DataEntityHousekeepingJob` which DO use
    the transaction wrapper. The omission appears unintentional (no
    comment defends it).

  **THE RACE SHAPE**:
    1. ActivityEmptyPartitionsHousekeepingJob.doHousekeeping fires (15-min
       cycle, ShedLock-coordinated leader instance)
    2. Iterates past activity partitions; runs `SELECT count(*) = 0 FROM
       activity_20250101_20250301` — Postgres returns true (no rows
       currently exist in this partition)
    3. **RACE WINDOW** — between step 2 and step 4, a concurrent reactive
       transaction issues `INSERT INTO activity (data_entity_id, event_type,
       ..., created_at) VALUES (..., '2025-02-15')` — Postgres routes the
       row to `activity_20250101_20250301` partition (the partition
       still exists; INSERT succeeds and returns to the caller; caller's
       @ReactiveTransactional commits)
    4. Housekeeping issues `DROP TABLE activity_20250101_20250301` —
       Postgres acquires ACCESS EXCLUSIVE on the partition and drops it
       (no re-check; the count-check from step 2 is stale by then)
    5. **SILENT DATA LOSS**: the just-inserted activity row is gone.
       The caller's @ReactiveTransactional committed successfully; the
       activity emit was confirmed by the DB; the row is now lost with
       no compensating transaction.

  **WHY THIS HAPPENS IN PRACTICE**:
    The race is most likely on partitions at the boundary between "past"
    and "current" — e.g. an `activity_20250101_20250301` partition where
    `2025-03-01` was yesterday. Today's housekeeping cycle sees
    `isPartitionInPast` returning true (end date is March 1, today is
    March 2). The partition has 0 rows because (a) all data entities
    were quiet during that window, OR (b) the platform was newly
    deployed during that window. A late-arriving @ActivityLog mutation
    that happens to fall in the gap (e.g. an Owner who was offline
    during the original window comes back online and updates a
    description with a timestamp the partition manager would route to
    the boundary partition).

  More commonly, the race is on partitions that "just emptied out" —
  e.g. an `activity_20240901_20241101` partition holding 5 rows that
  were ALL purged via direct SQL (operator manual cleanup) two minutes
  before the housekeeping cycle fired. The cycle sees count=0,
  legitimately, and the operator who manually deleted is unaware that
  the next 5 minutes of @ActivityLog mutations would route to that
  partition before the DROP fires.

  **THE NAME-BOUNDARY DRIFT** (per LSN-019 Stress Protocol Category B):
    The name `EmptyPartitionsHousekeepingJob` promises "drop only empty
    partitions." The check at the centre honors the name (real
    `count(*) = 0`). But the SCOPE OF THE GUARANTEE has a temporal
    boundary: the partition was empty AT THE TIME of the check; it may
    not be empty AT THE TIME of the DROP. The job's name does NOT
    advertise this temporal boundary.

  **OBSERVABILITY GAP**:
    The lost row has no error path — INSERT succeeded, caller's TX
    committed, DROP succeeded (Postgres considers the table-and-its-rows
    a unit; dropping the partition is "successful" even if rows were
    just inserted). No metric, no log, no audit. The operator querying
    the activity feed for the missing window sees zero rows and assumes
    "no activity happened" — visually indistinguishable from the
    truth.

  **PROBE-EMITTED**: P-022 (cited at ActivityEmptyPartitionsHousekeepingJob
  sidecar emitted_probes section) measures the empirical race window
  + the actual outcome (DROP wait vs INSERT wait depending on lock
  arrival order).

  **THE FIX SHAPE**: wrap the empty-check + drop in a single TX with
  SERIALIZABLE isolation, OR rewrite as `BEGIN; SELECT count(*) = 0
  FROM <partition>; ... LOCK TABLE <partition> IN EXCLUSIVE MODE;
  SELECT count(*) = 0 FROM <partition>; DROP TABLE <partition>;
  COMMIT;` — re-check with the exclusive lock held to close the race.
