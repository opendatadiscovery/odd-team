behaviour: |-
  `delete` is ENTIRELY uncovered. OwnershipServiceImplTest covers `testCreateOwnership` and `testUpdateOwnership` (verified file:line — lines 74-117 and 119-162) but NO `testDeleteOwnership`. The hard-delete behaviour (OwnershipServiceImpl.java:81), the conditional DEG-propagation (lines 82-87), the conditional `markEntityUnfilled(OWNERS)` (lines 88-95), and the activity-feed `OWNERSHIP_DELETED` emission are all uncovered at the service layer. PLUS two specific defects: (a) `delete` does NOT refresh `search_entrypoint` FTS vector (compare lines 69 + 116 for create/update; line 81-96 has NO `searchEntrypointRepository.updateChangedOwnershipVectors`), so the FTS index may still surface the deleted owner-name in catalog search results — latent search-index drift; (b) `delete` does NOT validate that the ownership existed (line 81 calls `ownershipRepository.delete(ownershipId)` and short-circuits to `Mono.empty()` if the id doesn't exist — caller cannot distinguish 'I deleted it' from 'it wasn't there'). Cross-pillar P-01 because FTS staleness leaks into Discovery search.
