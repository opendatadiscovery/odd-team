name: |-
  RBAC read endpoints (Role/Policy/Permission/Policy-Schema lists) have NO SecurityRule — any authenticated user reads
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW INVARIANT, batch 2026-05-25-ZD** — the RBAC management
  surface exposes FIVE read endpoints that all fall through to the
  catch-all `pathMatchers("/**").authenticated()` rather than a
  permission-shaped gate:

    - `GET /api/roles` (RoleController.getRolesList) — NO
      SECURITY_RULES entry; visible content varies by caller role
      via the service-tier principal-aware fork (admin sees full
      catalog; non-admin sees own attached roles)
    - `GET /api/policies` (PolicyController.getPolicyList) — NO
      SECURITY_RULES entry
    - `GET /api/policies/{id}` (PolicyController.getPolicyDetails)
      — NO SECURITY_RULES entry; any authenticated user reads the
      FULL policy by id (every statement, every role assignment)
    - `GET /api/policies/schema`
      (PolicyController.getPolicySchema) — NO SECURITY_RULES
      entry; the live JSON-Schema catalogue is open-read
    - `GET /api/resource/{type}/{id}/permissions`
      (PermissionController.getResourcePermissions) — NO
      SECURITY_RULES entry

  All five fall through to
  `AuthorizationCustomizer.java:29-30` catch-all
  `pathMatchers("/**").authenticated()` under LOGIN_FORM / OAUTH2 /
  LDAP. Under DISABLED, the chain is INERT
  (`DisabledAuthSecurityConfiguration.java:11-19` short-circuits
  via `.anyExchange().permitAll()`); all five are anonymously
  reachable.

  ## Why the pattern exists

  Per the implicit_adrs in the batch-ZD class sidecars,
  read-side endpoints are intentionally NOT in `SECURITY_RULES`
  — the read-collaborative posture for the RBAC management
  surface is the architectural commitment.

  For three of the five endpoints (the contextual permission
  query, the role list, the policy list) the response content is
  CALLER-SCOPED. For two (getPolicyDetails, getPolicySchema),
  the response is NOT caller-scoped — getPolicyDetails returns
  the FULL policy by id and is the highest-leverage exposure.

  ## STRENGTHENED batch ZE (2026-05-25) — broader pattern

  Batch ZE confirms the same posture across SEVEN more read
  endpoint classes — bringing the full no-SECURITY_RULES read
  surface to 12+ endpoints. The pattern is genuinely
  pillar-wide:

    - GET /api/search/* — 7 endpoints (search/results/facets/
      facet-options/suggestions/highlight + update). NO
      SECURITY_RULES entry for any /api/search* path
      (verified by Grep search|facet returns zero matches
      in SecurityConstants.java).
    - GET /api/relationships + /api/relationships/erd/{id} +
      /api/relationships/graph/{id} — 3 endpoints. NO
      SECURITY_RULES entry; catalog-global read posture
      (per relationships-no-exclude-from-search-asymmetry-vs-dataentities).
    - GET /api/titles — 1 endpoint. NO SECURITY_RULES entry;
      Title directory readable by any authenticated user.
    - GET /api/features/active — 1 endpoint. NO SECURITY_RULES
      entry; feature-flag enumeration; LIMITED-RISK FACET of
      REFACTOR-185 (PROVIDER-NULL-BLEED — see
      refactor-185-identity-layer-facet).
    - GET /api/links — 1 endpoint. NO SECURITY_RULES entry;
      operator-configured catalogue.

  ## STRENGTHENED batch 2026-05-25-ZF — ingestion + ownership + metadata cluster brings the pattern to 14+ endpoints

  Batch ZF confirms the same no-SECURITY_RULES read posture across
  TWO more directory-read endpoints, both surfacing operator-relevant
  cross-owner enumeration vectors:

    - `GET /api/owners` (OwnerController.getOwnerList) — NO
      SECURITY_RULES entry; verified by Grep `/api/owners` against
      SecurityConstants.java 2026-05-25 (only POST/PUT/DELETE +
      mapping-path entries match). Any authenticated user (and any
      anonymous caller under auth.type=DISABLED) enumerates the
      ENTIRE Owner directory — including owner names that may carry
      PII (e.g., "salary_band", "phi_classification", "pii_indicator"
      as soft-data-governance tags surface in OwnersList).
      OwnerController class-level sidecar (batch ZF) surfaces this
      as the FIRST of two NEW class-level findings.

    - `GET /api/metadata/fields` (MetadataFieldController.getMetadataFieldList)
      — NO SECURITY_RULES entry; NOT in WHITELIST_PATHS; falls
      through to `pathMatchers("/**").authenticated()`. The endpoint
      returns the ENTIRE non-deleted INTERNAL-origin custom-metadata
      field catalogue. Any authenticated user enumerates the full
      schema of custom-metadata fields defined by the deployment —
      including field names that operators may have intended to
      scope to specific data-entity owners. The Live Permissions
      docs (WebFetched 2026-05-25, status 200) confirm there is NO
      `CUSTOM_METADATA_FIELD_READ` Permission — only the per-VALUE
      `DATA_ENTITY_CUSTOM_METADATA_{CREATE,UPDATE,DELETE}` write
      permissions exist. Cross-owner exposure of field names like
      `salary_band`, `phi_classification` is a soft-data-governance
      leak vector.

  Additionally, the IngestionController class-level sidecar (batch ZF)
  surfaces the analog at the S2S surface: `GET /ingestion/dataentitygroups/{deg_oddrn}/entities`
  has NO SECURITY_RULES entry AND no filter coverage — it is
  unauthenticated in EVERY auth mode (per
  `two-ingestion-filters-asymmetric-auth` + `s2s-read-side-unauthenticated-deg-membership-enumeration`).

  ## The structural inconsistency

  The pattern is INTERNALLY CONSISTENT within the platform's
  architectural conventions (read endpoints are catch-all
  authenticated; write endpoints have explicit SECURITY_RULES
  entries). But it produces SEVERAL surprising outcomes:

    - getPolicyDetails — full policy reading by anyone (batch ZD)
    - getSearchResults — paginate the whole catalog (batch ZE)
    - getFiltersForFacet(OWNERS) — enumerate every owner +
      per-owner count (batch ZE)
    - getRelationships — enumerate every relationship across
      every data source (batch ZE)
    - getTitleList — enumerate every owner-title (batch ZE)
    - getActiveFeatures — fingerprint enabled features (batch ZE)
    - getLinks — read operator-internal URLs (batch ZE)
    - **getOwnerList** — enumerate every Owner row (batch ZF)
    - **getMetadataFieldList** — enumerate every custom-metadata
      field name across deployment (batch ZF)

  Compounded with the IDENTITY-LAYER FACET of REFACTOR-185
  (whoami returns admin under DISABLED), an anonymous caller
  walks ALL of these surfaces.

  ## Live doc drift

  The live `/authorization/policies` page (WebFetched 2026-05-25,
  status 200) does NOT name a Permission required for reading
  policies. Batch ZE adds: features/active, /links, /titles,
  /relationships are all undocumented for their read-posture
  semantics on the live doc surface. **Batch ZF adds**: the live
  `/configuration-and-deployment/enable-security/authorization/owners`
  page is silent on the unauthenticated read of `/api/owners`; the
  live Permissions page enumerates only `DATA_ENTITY_CUSTOM_METADATA_*`
  write permissions and is SILENT on the read posture for
  `/api/metadata/fields`. Operators reading the docs reasonably
  assume gated reads.

  ## Severity

  MEDIUM. The intentional posture is internally coherent
  (read-collaborative); the doc gap is the higher-leverage
  finding. Code fixes per endpoint would close per-surface
  exposures; doc fixes surface the remaining intentional
  posture.

  ## Mitigation candidates

  - **Code (preferred)**: per-endpoint POLICY/READ permission
    additions for the highest-leverage exposures
    (getPolicyDetails + getSearchResults via owner-scoping +
    getMetadataFieldList via deployment-wide field-namespace
    scope). Owner directory enumeration is harder to gate
    cleanly because the Management UI's OwnersList LITERALLY
    requires the list view to render — any gate that hides
    Owners renders the Management → Owners tab useless to
    non-admins.
  - **Doc (alternative)**: explicit admonition on every
    relevant doc page naming the read posture + the contrast
    with the gated write surface.
  - **Both**: the highest-completeness path.
