- concepts.yaml:entities[Ingestion Filter].security_aggregate.weaknesses.[6] (sibling
  S2S admin-everywhere)
proposed_action: 'Parameterised `@WebFluxTest` over `auth.type ∈ {LOGIN_FORM, OAUTH2,
  LDAP}` and `auth.s2s.enabled=true`; for each, set `X-API-Key: <valid>` and call
  admin-only UI/API endpoints (POST /api/permissions/{id}/policies, GET /api/users,
  PUT /api/dataentities/{id}/statuses); assert HTTP 200. Companion test under `auth.type=DISABLED`
  asserts the same X-API-Key is silently ignored (no S2S wiring). Locks the S2S admin-everywhere
  contract across modes.'
