note: |-
  Graduated 2026-05-26 from SHB-024. The feature is the operator-visible
  safety boundary (the dropdown cap). The bug is that no layer below the
  dropdown validates the boundary. Sibling-related to F-005 (which captures
  the recursive-CTE walk semantics) — F-055 captures the END-TO-END boundary
  contract that the dropdown advertises. The thread proposes a layered fix
  (REFACTOR-NNN at four sites); the feature flow anchors the operator-visible
  expectation. LSN-001-shape ADR candidate per SHB-024 Notes: "if the
  operator sees a control with limited options, every layer below must
  enforce the same options OR document the asymmetry."
