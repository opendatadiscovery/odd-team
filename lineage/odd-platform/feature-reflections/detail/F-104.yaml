- id: H-002
  hypothesis: |
    When an operator opens a bookmarked or shared /data-quality?<filters> URL,
    or clicks Back to a URL that still carries the filter query string, the
    dashboard reconstructs the FULL filter slice from that URL — losslessly.
  derivation: "Endpoint-shape + implicit-ADR seed: DataQualityFilters writes id+name JSON to the URL and hydrates from it on mount — the question is whether the round-trip is complete."
  seed_source: endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |
      The mechanism exists and is bidirectional: one useEffect hydrates
      formFiltersAtom from searchParams on mount (DataQualityFilters.tsx:28-43),
      the other writes non-empty arrays back as JSON-stringified FilterOption[]
      (id AND name) with `replace: true` on every change (DataQualityFilters.tsx
      :46-54). Because the URL carries the full {id,name} pair, hydration has the
      data it needs to rebuild the chips without a refetch. BUT static tracing
      cannot confirm losslessness: the hydration only copies a key if `key in
      newFilters` (DataQualityFilters.tsx:32) and `JSON.parse`s each value with no
      try/catch (DataQualityFilters.md bugs[5]) — a malformed or hand-edited value
      throws; and whether ALL ten dimensions survive a real browser Back (vs a
      tab-restore vs a fresh open) is exactly what probe P-120 was emitted to
      measure. This is the difference between H-001 being "partial UX surprise"
      and "complete state loss".
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataQualityFilters.md
        section: implicit_adrs[2] + operations
        cite: "DataQualityFilters.tsx:28-54 (the two URL-sync useEffects, id+name JSON)"
        note: "round-trip mechanism present; losslessness unverified — carries P-120"
      - sidecar: odd-platform__ts__jotai-store__store__DataQualityStore.md
        section: stress_findings.resource_boundaries (PROBE-NEEDED answer)
        cite: "P-120"
        note: "the store sidecar itself marks the reconstruction-extent question PROBE-NEEDED"
    operator_visible_failure: |
      If reconstruction is LOSSLESS, a shared/bookmarked URL is a genuine
      persistence workaround and the only real failure is the undiscoverability
      of it (no UI tells the operator "bookmark to keep filters"). If it is
      PARTIAL (some dimensions survive, some reset), the operator gets a
      half-reconstructed slice — more confusing than total loss, because they may
      not notice that two of five chips silently dropped, and read wrong dashboard
      numbers as correct. The hand-edited-URL path throws an uncaught render error
      (white screen) rather than degrading.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-104-1
    routes_to_finding: functional-test-demand
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

