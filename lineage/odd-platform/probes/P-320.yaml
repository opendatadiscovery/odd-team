# P-320 — audit-export workaround compound: cross-owner + soft-deleted read + unbounded size + anonymous-under-DISABLED (H-010)

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (3200, '//probe-source-P-320/db', 'probe-source-P-320')
      ON CONFLICT (id) DO NOTHING

  # Two unrelated owners — B owns the target entities; A owns nothing here.
  - kind: sql
    query: |
      INSERT INTO owner (id, name) VALUES
        (32001, 'probe-P320-owner-A'),
        (32002, 'probe-P320-owner-B')
      ON CONFLICT (id) DO NOTHING

  # Entity X (owned by B) — the cross-owner-read + unbounded-size target.
  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id,
         source_created_at, source_updated_at)
      VALUES (320100, '//probe-source-P-320/db/tables/p320_X', 'p320_X',
              3200, 1, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # Entity Y — the soft-deleted-read target (status flipped to DELETED in act).
  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id,
         source_created_at, source_updated_at)
      VALUES (320200, '//probe-source-P-320/db/tables/p320_Y', 'p320_Y',
              3200, 1, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # Ownership: B owns X and Y; A owns neither (the cross-owner setup).
  - kind: sql
    query: |
      INSERT INTO ownership (id, data_entity_id, owner_id, title_id)
      VALUES (320001, 320100, 32002, NULL),
             (320002, 320200, 32002, NULL)
      ON CONFLICT (id) DO NOTHING

  # Seed alerts on X (60 rows — enough to exercise pagination beyond size=30) and on Y (5 rows).
  - kind: sql
    query: |
      INSERT INTO alert
        (id, data_entity_oddrn, type, status, status_updated_at, last_created_at)
      SELECT 3201000 + g,
             '//probe-source-P-320/db/tables/p320_X',
             'DISTRIBUTION_ANOMALY', 'OPEN', NOW(), NOW()
      FROM generate_series(0, 59) AS g
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      INSERT INTO alert
        (id, data_entity_oddrn, type, status, status_updated_at, last_created_at)
      SELECT 3202000 + g,
             '//probe-source-P-320/db/tables/p320_Y',
             'DISTRIBUTION_ANOMALY', 'RESOLVED', NOW(), NOW()
      FROM generate_series(0, 4) AS g
      ON CONFLICT (id) DO NOTHING

act:
  # (a) CROSS-OWNER READ — as user A (no ownership of X). Under DISABLED the call
  # is anonymous, which already satisfies "a caller with no ownership"; if the
  # harness runs a LOGIN_FORM variant it authenticates as A (owner 32001) here.
  - kind: http
    method: GET
    path: /api/dataentities/320100/alerts?page=1&size=100
    base: "http://localhost:18080"
    capture_status_as: cross_owner_read_status
    capture_json_as: cross_owner_read_body

  # (b) SOFT-DELETED READ — flip Y to DELETED, then read its alerts.
  - kind: sql
    query: |
      UPDATE data_entity
      SET status = (SELECT id FROM data_entity_status WHERE name = 'DELETED' LIMIT 1),
          deleted_at = NOW()
      WHERE id = 320200
    note: |
      The DELETED status code is resolved from the data_entity_status enum table; if
      the schema stores status as an inline int the harness substitutes the
      DataEntityStatusDto.DELETED.getId() value. The load-bearing effect is that Y is
      hidden from the catalog list endpoints while its alerts remain readable here.

  - kind: http
    method: GET
    path: /api/dataentities/320200/alerts?page=1&size=100
    base: "http://localhost:18080"
    capture_status_as: soft_deleted_read_status
    capture_json_as: soft_deleted_read_body

  # cross-channel contrast: Y must NOT appear in a catalog list/search surface.
  - kind: http
    method: GET
    path: /api/dataentities?page=1&size=1000
    base: "http://localhost:18080"
    capture_json_as: catalog_list_body

  # (c) UNBOUNDED SIZE — accepted, not clamped.
  - kind: http
    method: GET
    path: /api/dataentities/320100/alerts?page=1&size=1000000
    base: "http://localhost:18080"
    capture_status_as: unbounded_size_status

  # (c') page=0 negative-OFFSET error shape.
  - kind: http
    method: GET
    path: /api/dataentities/320100/alerts?page=0&size=30
    base: "http://localhost:18080"
    capture_status_as: page_zero_status

  # (d) ANONYMOUS REACH UNDER DISABLED — explicit no-auth-header call.
  - kind: http
    method: GET
    path: /api/dataentities/320100/alerts?page=1&size=30
    base: "http://localhost:18080"
    no_auth: true
    capture_status_as: anonymous_read_status

observe:
  - kind: noop
    note: "All assertions are over the captured statuses / bodies above."

assert:
  # (a) cross-owner read of an un-owned entity succeeds (pins the contradicted posture).
  - "cross_owner_read_status == 200"
  - "len(cross_owner_read_body['items']) > 0"

  # (b) soft-deleted entity's alerts are served...
  - "soft_deleted_read_status == 200"
  - "len(soft_deleted_read_body['items']) == 5"
  # ...while the entity itself is hidden from the catalog list (the cross-channel split).
  - "320200 not in [e['id'] for e in catalog_list_body['items']]"

  # (c) unbounded size accepted (not clamped to a 4xx); page=0 errors as 5xx not a clean 400.
  - "unbounded_size_status == 200"
  - "page_zero_status >= 500"

  # (d) anonymous read succeeds under DISABLED.
  - "anonymous_read_status == 200"

cleanup:
  - kind: docker-compose-down
    destroy_volumes: true

