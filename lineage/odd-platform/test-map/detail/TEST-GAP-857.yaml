proposed_action: |-
  Add `TagServiceImplExternalRelationsTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/` using Testcontainers + `@SpringBootTest`. Four test methods:

  1. **`updateRelationsWithDataEntity_externalRelationsAreNeitherDeletedNorOverwritten_pinsCollectorOwnedRelationsImmutability`** (HEADLINE):
     - Arrange: 1 data_entity. Seed 2 tag rows: tagA, tagB. Seed `tag_to_data_entity` rows: `(tagA, entity, external=false)`, `(tagB, entity, external=true)` (the Collector-pushed one).
     - Act: `tagService.updateRelationsWithDataEntity(entity.id, Set.of("tagA")).block()`.
     - Assert: query raw DB `SELECT * FROM tag_to_data_entity WHERE data_entity_id = ?`. Result: BOTH rows present — `(tagA, false)` AND `(tagB, true)`. PIN: the !external filter at line 102 preserves Collector relations.

  2. **`updateRelationsWithDataEntity_replaceAllInternalTags_keepsExternalTagsUntouched_pinsDualSpaceDiff`**:
     - Arrange: 4 tag rows: tagA, tagB, tagC, tagD. Seed `(tagA, entity, external=false)`, `(tagB, entity, external=false)`, `(tagC, entity, external=true)`, `(tagD, entity, external=true)`.
     - Act: `updateRelationsWithDataEntity(entity.id, Set.of("tagA")).block()` (drop tagB from the internal set; tagC + tagD untouched).
     - Assert: query result: `(tagA, false)`, `(tagC, true)`, `(tagD, true)`. tagB-internal is GONE; both external relations PRESERVED.

  3. **`updateRelationsWithDataEntity_newlyMintedTagAlwaysHasExternalFalse_pinsHardcodedFalseAtLine109`**:
     - Arrange: 1 data_entity. NO existing tag rows. Submit fresh names that need auto-creation.
     - Act: `updateRelationsWithDataEntity(entity.id, Set.of("freshTag1", "freshTag2")).block()`.
     - Assert: query `SELECT external FROM tag_to_data_entity WHERE data_entity_id = ?`. BOTH rows have `external = false`. PIN: the hardcoded false at line 109.

  4. **`updateRelationsWithDataEntity_existingExternalTrueRowDoesNotPromoteToFalseOnPutThatIncludesItsName_pinsRowIdentityNotTagIdentity`**:
     - Arrange: tagX exists; seed `(tagX, entity, external=true)`. PUT `tagNames: ['tagX']` (re-asserting tagX in the internal set).
     - Act: `updateRelationsWithDataEntity(entity.id, Set.of("tagX")).block()`.
     - Assert: query result: `(tagX, false)` AND `(tagX, true)` BOTH PRESENT. The diff considers them different rows because `TagToDataEntityPojo.equals` includes the external flag. PIN: the implementation's row-identity semantic (this is subtle — re-asserting an external tag in the internal set creates a SECOND row, not a no-op). Document explicitly: if a future refactor changes `equals()` to ignore external, this test FAILS and forces an explicit policy decision.

  Cross-pair with DOC-NNN: surface the EXTERNAL-immutability invariant on the per-entity Tag assignment doc page; explain that PUT requests preserve Collector-pushed tags.
