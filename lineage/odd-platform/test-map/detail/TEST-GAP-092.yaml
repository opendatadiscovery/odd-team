behaviour: Sender / advisory-lock contention — `DataCollaborationMessageSenderJob`
  is single-leader-elected via Postgres advisory lock id 120 default. No test asserts
  the lock-acquire/release semantics, the retry+sleep loop (`sending-messages-retry-count`
  budget; 3 retries with 1-second fixed sleep), or the non-discriminating Slack-error
  handling (every Exception caught at line 55, retried 3× regardless of 429/auth/channel
  error).
