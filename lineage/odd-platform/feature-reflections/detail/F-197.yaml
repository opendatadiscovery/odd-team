- id: H-005
  hypothesis: |-
    When any logged-in user opens an entity's Discussions tab, the messages they can read
    and the channels they can post to are scoped by the RBAC Policy grants an operator has
    authored (a user without discussion permission on that entity cannot post).
  derivation: |-
    Pillar P-09 frames RBAC (Policies x Permissions x Roles) as gating mutations across the
    catalog; a senior PO assumes a posting surface participates in that model — the
    implicit-requirements archetype.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      None of the data-collaboration routes carry an RBAC permission. SecurityConstants.
      SECURITY_RULES has zero entries for /api/datacollaboration/** or /api/messages/**;
      all fall through to AuthorizationCustomizer's catch-all pathMatchers("/**")
      .authenticated() (DataCollaborationController.md invariant 3 + postMessageInSlack.md
      security.known_security_gaps[0]). Any authenticated user can post to any channel the
      bot can reach, attached to any data_entity_id (existence-checked only, NOT
      owner-scoped — postMessageInSlack.md owner_scoping "BYPASSES"). Under auth.type=DISABLED
      the routes are anonymously reachable; datacollaboration.enabled is the sole defence.
      The live doc now states this verbatim ("Enabling Data Collaboration is the only access
      control on its routes — none of them carry an RBAC permission ... any logged-in user
      can post into and read every entity's discussions regardless of the Policy grants").
