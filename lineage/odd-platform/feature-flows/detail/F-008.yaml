      the bugs-limitations consequence. Severity: MEDIUM (architectural
      drift; cluster-deployment incompatibility is a separate
      operationally-visible consequence).
  - facet: upsert partial-merge — only name + description propagated on UPDATE (batch P)
    observed: |-
      `DataSourceIngestionServiceImpl.prepareForUpdate` (lines 74-92)
      copy-constructs from the existing `DataSourcePojo` then OVERWRITES
      ONLY `name` + `description` from the new payload. The existing
      `connection_url`, `active`, `type`, `namespace_id`, `collector_id`,
      `token_id`, soft-delete flag, all timestamps, AND any custom
      fields are PRESERVED. A collector that genuinely needs to update
      `connection_url` (the source's hostname changed) CANNOT do so
      via this endpoint; only `name` and `description` propagate
      through the mapper. The response is 200 OK regardless. The
      asymmetric-merge is silent — no log, no diff in the response
      body (`Mono<ResponseEntity<Void>>` discards the assigned ids
      AND the merged-pojo state). An operator who renames a datasource
      in the UI sees their rename OVERWRITTEN by the collector's
      payload (collector wins); an operator who needs to update
      `connection_url` cannot do so via the S2S path. The asymmetry
      mirrors F-008's existing
      `silent_destruction_replace_not_merge` facet with INVERTED
      polarity (protective-merge vs destructive-replace) but BOTH are
      undocumented.
    expected: |-
      Either (a) propagate all non-null payload fields (full overwrite
      with null-skip semantics), OR (b) document the partial-merge
      contract on the custom-collectors doc page + list the explicit
      set of fields the S2S path can update vs the UI-only fields.
    drift_class: upsert_partial_merge_name_and_description_only
    provenance: |-
      STATIC — primary-source in batch P IngestionController.createDataSourceEntity
      sidecar invariants[5] + implicit_adrs[2] (the partial-merge ADR
      is deliberately narrow) + bugs_limitations_corner_cases[6] +
      DataSourceIngestionServiceImpl.java:74-92. Mirrors F-008's
      existing `silent_destruction_replace_not_merge` facet with
      INVERTED polarity. Severity: MEDIUM.
  - facet: namespace inherited from Collector — payload namespace_name silently dropped (batch P)
    observed: |-
      `DataSourceIngestionServiceImpl.mapDataSources` (lines 99-111)
      hardcodes the namespace_id from `CollectorDto.namespace()`
      (`MappingUtils.extractFieldFromNullableObject(c.namespace(),
      NamespacePojo::getId)`), NEVER from the payload. A custom-collector
      author setting `namespace_name = "my-team"` in the payload sees
      the datasource appear under the Collector's PRE-CONFIGURED
      namespace. No log records the silent drop. No doc warns about
      it. The architectural intent (collector-scoped tenancy model —
      a Collector belongs to ONE namespace, and every datasource the
      Collector registers inherits that namespace) is SOUND but
      operator-invisible: a collector author cannot predict the
      behaviour from the docs.
    expected: |-
      Either (a) honour the payload's `namespace_name` field (look up
      or create the namespace at write time, BUT enforce that the
      Collector's pre-configured namespace covers it), OR (b) document
      the collector-scoped tenancy model with an explicit note that
      payload namespace fields are silently inherited from the Collector.
    drift_class: namespace_inherited_from_collector_payload_silently_dropped
    provenance: |-
      STATIC — primary-source in batch P IngestionController.createDataSourceEntity
      sidecar invariants[6] + implicit_adrs[3] (the tenancy ADR is
      sound but undocumented) + bugs_limitations_corner_cases[5] +
      DataSourceIngestionServiceImpl.java:99-111. Severity: MEDIUM.
  - facet: session-state-loss surfaces as HTTP 500 not 401 (batch P)
    observed: |-
      `IngestionController.java:54` throws
      `IllegalStateException("Collector id is null")` when
      `COLLECTOR_ID_SESSION_KEY` is missing from the session (filter
      didn't run, session expired, session attribute lost). The parent
      `AbstractIngestionFilter.filter` catches ONLY `AccessDeniedException`
      (line 40) to emit 401; `IllegalStateException` propagates to
      the default reactive error handler as HTTP 500. An operator
      debugging a collector that suddenly fails would see a 500 in
      the logs and reasonably conclude "platform crashed" — the
      correct interpretation is "session lost — re-authenticate by
      re-establishing the connection". No 401 conversion. No
      operator-facing error contract documented. Mirrors F-008's
      existing batch-O facet
      `notfoundexception_surfaces_as_5xx_info_leak` with SAME shape,
      SAME diagnostic confusion, DIFFERENT origin (session-state loss
      vs unknown-datasource).
    expected: |-
      Either (a) catch `IllegalStateException` in
      `AbstractIngestionFilter.filter` and convert to 401 with a generic
      "Token is not correct" message, OR (b) document the 5xx-on-session-loss
      contract explicitly with a deployment-guidance note (enable
      sticky sessions OR switch `session.provider` to `REDIS` /
      `INTERNAL_POSTGRESQL` for HA collector flows).
    drift_class: session_state_loss_5xx_not_401
    provenance: |-
      STATIC — primary-source in batch P IngestionController.createDataSourceEntity
      sidecar bugs_limitations_corner_cases[0] +
      security.known_security_gaps[1] + IngestionController.java:53-55
      + AbstractIngestionFilter.java:40. Severity: LOW (info-leak) /
      MEDIUM (operator-debug misleading).
  - facet: payload-driven datasource scoping — operator-visible fused-namespace framing (SHB-124, batch-shoebox-graduation 2026-05-26)
    observed: |-
      `IngestionServiceImpl.java:68` — `dataSourceRepository.getIdByOddrnForUpdate(dataEntityList.getDataSourceOddrn())`
      is the ONLY datasource resolution. The service reads the ODDRN
      string from the request body, NEVER from any principal / session /
      collector-id. The interface itself
      (`IngestionService.java:7-11`) takes only `DataEntityList` — no
      principal parameter, no `Authentication`. The service is
      ARCHITECTURALLY IGNORANT of the caller; the upstream filter is the
      SOLE point at which caller→datasource binding could happen, and
      when the filter is OFF (bundled default), there is NO scoping
      anywhere. Operator-visible symptom: the Management → Datasources
      tab shows a FUSED LIST of all datasources regardless of which
      Collector last ingested into them. The `data_source.collector_id`
      column is set ONLY by `POST /ingestion/datasources` (REGISTRATION
      time), NOT by subsequent `POST /ingestion/entities` writes. A
      datasource registered by Collector A but routinely ingested by
      Collector B looks identical to a same-collector pipeline.
      Multi-team / multi-tenant deployments cannot distinguish team A's
      writes from team B's writes from runtime state. The protection
      that IS enforced lives in the ADR-CANDIDATE-143
      namespace-from-Collector inheritance at
      `DataSourceIngestionServiceImpl.java:106` — but this only
      constrains the namespace stamp at registration; it does NOT
      constrain WHICH Collector can ingest into a registered datasource
      subsequently. Cross-collector enumeration via the
      namespace surface (REFACTOR-024) is SEPARATE but COMPOSED:
      Collector A can see Collector B's datasource list, then choose
      any ODDRN to write into.
    expected: |-
      Either (a) add a `data_source.last_ingested_by_collector_id`
      column populated at `POST /ingestion/entities` time, surface it
      in the Datasources tab so operators can audit ingestion provenance,
      OR (b) explicitly bind every ingestion call to the
      authenticated Collector's set of registered datasources and reject
      payload-named ODDRNs outside that set with 403. The system
      mission file flags this as a "security-relevant implicit ADR"
      — a binary decision worth elevating to an ADR-NNN draft.
    drift_class: datasource_scoping_is_payload_driven_not_principal_driven
    provenance: |-
      STATIC — SHB-124 evidence; verified across 7 file:line refs
      (IngestionServiceImpl service-tier resolution + interface;
      IngestionDataEntitiesFilter token-validation;
      MetadataIngestionRequestProcessor / LineageIngestionRequestProcessor
      destruction call sites; ReactiveCollectorRepositoryImpl getByToken
      with no UNIQUE constraint visible at code level). System-mission
      file flags this surface as elevation-worthy.
