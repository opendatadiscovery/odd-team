notes: |-
  **STRENGTHENED batch 2026-05-19M to 3-sidecar triangulation** — the
  ADR-CANDIDATE-015 controller-shape convention is now confirmed at all
  THREE members of the /my* triplet (getMyObjects, getMyObjectsWithUpstream,
  getMyObjectsWithDownstream). The convention is applied uniformly across
  the family.

  Two structural sub-postures within the convention (refined by batch M):
    (a) JOIN-side-defended (only getMyObjects) — the base endpoint;
    (b) anchor-set-ONLY (getMyObjectsWithUpstream + getMyObjectsWithDownstream)
        — the lineage variants; defense-in-depth gap at the response layer
        creates REFACTOR-225 single-point-of-failure.

  Cross-references:
    - REFACTOR-225 anchor-set single-point-of-failure (batch M) — the
      load-bearing security finding for the lineage-variant sub-posture.
    - DOC-GAP-099 OpenAPI summary inverse-semantic (batch M) — the
      contract finding for the lineage-variant sub-posture.
    - Anchor-set defence-in-depth — positive vs negative cases (the
      platform-level pattern; this invariant is the controller-shape
      embodiment).
    - Owner-link is the gate for owner-scoped views (companion invariant —
      the user_owner_mapping table is the underlying primitive that
      fetchAssociatedOwner consumes).
