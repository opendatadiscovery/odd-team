proposed_action: |-
  Add `TagRenameSearchVectorPropagationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Promote probe P-025 to CI:
  1. `updateTag_rename_searchByNewNameReturnsCarryingEntities` — seed a tag attached to a data entity, a dataset field, and a term; `PUT /api/tags/{id}` renaming it; full-text search the NEW name; assert all three carrying entities are returned.
  2. `updateTag_rename_searchByOldNameReturnsNothing_pinsOverwriteNotAppend` — after #1, full-text search the OLD name; assert NONE of the three entities are returned. PINS overwrite semantics (P-025 assertion H2).
  3. `updateTag_rename_refreshesAllThreeVectorTables` — after #1, assert `search_entrypoint.tag_vector`, the dataset-structure vector, and `term_search_entrypoint.tag_vector` all reflect the new name (guarding against a collapsed Mono.zip).

  If P-025 shows append-not-overwrite, test #2 becomes a FAILING regression-pin flagging a stale-token bug. Pair with a DOC-NNN: the live tagging page does not state that renaming a tag refreshes full-text search vectors — surface the user-observable effect.
