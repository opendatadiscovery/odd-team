mitigations_unimplemented:
  - |-
    SIMPLE FIX A (UI defence-in-depth): land rehype-sanitize on
    Markdown.tsx. Single-point fix; protects all 5 F-004 surfaces.
    Cross-link to the no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic
    invariant for the broader analysis.
  - |-
    SIMPLE FIX B (server-side sanitization on write): add Jsoup.clean
    or OWASP Encoder before the DatasetFieldServiceImpl.updateDescription
    write. Eliminates F-004 at the column-level write surface
    permanently. Drawback: existing rows are not retroactively
    sanitized; a migration would be needed to clean historical
    payloads.
  - |-
    Add a regression test for the F-004 read path through THIS
    controller:
      (a) PUT /api/datasetfields/{id}/description with payload
          '<script>alert(1)</script>'
      (b) GET /api/datasets/{parent_entity_id}/structure
      (c) Assert response.fieldList[i].internalDescription contains
          the <script> tag VERBATIM (current state).
      (d) After rehype-sanitize lands, the assertion changes
          to confirm the payload is rendered safely client-side.
  - |-
    Document the F-004 chain on the live
    /configuration-and-deployment/enable-security/authorization
    page — explicit text on the user-curated content surfaces +
    the absence of server-side sanitization + the single-point-of-failure
    UI defence (post-fix: the present rehype-sanitize defence).
  - |-
    Cross-pillar audit follow-up — enumerate EVERY OpenAPI
    response shape that carries a user-curated Markdown field
    (internal_description on data-entity / dataset-field;
    definition on term / query-example; description on
    query-example; etc.). For each, identify the WRITE controller +
    the READ controller(s) + the UI render path. The full F-004
    map currently lives across 5 invariants and 1 cross-cutting
    master; a single audit batch consolidating the inventory would
    close the picture.

notes: |-
  This invariant captures the FIRST read-side closure for the
  column-level F-004 write surface. Previous batches established:
    - the master F-004 invariant at multiple write surfaces
    - the column-level WRITE surface at batch V
    (DatasetFieldController + DatasetFieldServiceImpl +
    ReactiveDatasetFieldRepositoryImpl)
    - the column-level UI render path at batch V (DatasetFieldDescription
    + Markdown.tsx)
    - the cross-cutting no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic
    invariant at batch U
  Batch W (DatasetController + DatasetVersionServiceImpl +
  ReactiveDatasetVersionRepositoryImpl) closes the chain — the
  read-side API surface that exposes the F-004 column-level write
  surface to UI consumers.

  The closure's load-bearing observation: the read-side IS A
  SEPARATE CONTROLLER (DatasetController), not the write-side
  controller (DatasetFieldController). A maintainer focused on
  DatasetFieldController would miss the read-side; a maintainer
  focused on DatasetController would miss the connection to the
  F-004 write surface. The cross-file scan protocol per LSN-018 IS
  the only mechanism that catches this; the bypass + the F-004
  chain are linked at the architectural level.

  Cross-cutting connections:
    - STRENGTHENS the F-004 master invariant by adding the
      column-level read-side closure
    - Pairs with datasetcontroller-per-entity-scoping-bypass-data-entity-id-not-enforced-at-sql
      (THIS BATCH sibling — the bypass + F-004 compound; cross-owner
      F-004 read surface is broader than the master suggests)
    - Pairs with no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic
      (the SINGLE-POINT-OF-FAILURE defence; rehype-sanitize at
      Markdown.tsx covers ALL 5 F-004 surfaces uniformly)
    - Pairs with read-collaborative-cross-owner-enumeration (the
      cross-owner read posture; combined with F-004, the column-level
      descriptions are universally readable by any authenticated user)

  Two DOC-NNN candidates:
    (a) /developer-guides/api-reference/datasets NEW page — text on
        the F-004 read surface + cross-link to the rehype-sanitize
        UI defence post-fix
    (b) Operator playbook for F-004 incident response — sanitize
        historical payloads via DELETE OR UPDATE on the
        internal_description columns; identify offending rows via
        Postgres trigram/regex search
