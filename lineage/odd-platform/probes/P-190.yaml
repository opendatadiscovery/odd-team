realism_caveats: |
  Pins three operator-observable consequences of the LSN-020 UI drift. If
  all REST-level assertions PASS, the page-root Activity component composes
  a "User" filter UI whose round-trip is semantically consistent on the
  OWNER axis but whose label, doc copy, and parameter name promise the USER
  axis — a Category-F TRANSLATES_SILENTLY at the UI layer with HIGH-severity
  operator misalignment. If any assertion FAILS, re-read the MultipleFilter
  dispatch (the only fetch branches are fetchTagsList for tagIds and
  fetchOwnersList for everything else — MultipleFilter.tsx:32-34 and
  MultipleFilterAutocomplete.tsx:44-47; a third branch added since the
  substrate commit would invalidate the trace).

  The dom-probe step (act #3) cannot be executed in this batch — Playwright /
  Puppeteer probes are local-only per Rule 8 and the substrate currently
  has no DOM-probe runner registered. The REST-level assertions alone are
  sufficient to confirm the drift; the dom-probe step is here to make the
  follow-up explicit.
