behaviour: |-
  **HIGH — `PUT /api/terms/{term_id}/tags` (createTermTagsRelations) is a REPLACE-ALL operation despite the `create*` operationId, and an empty `tag_name_list` silently clears EVERY tag relation on the term. Unlike the data-entity tag path (`tag_to_data_entity` carries an `external` column, so the replace-all has an ingested-tag carve-out), `tag_to_term` has NO `external` or `origin` column — the term-tag replace-all removes EVERY relation absent from the submitted list with no provenance protection. A buggy client that forgets to populate `tag_name_list` wipes the term's tag set.** Method-level primary source from the batch-X-TAGGING `createTermTagsRelations` controller-method sidecar:

  - `TermController.createTermTagsRelations` (`:129-136`): reads `Mono<TagsFormData>`, calls `termService.upsertTags(termId, fd)`, lifts the `Flux<Tag>` into 200. The operationId says `create`; the service method is `upsertTags`.
  - `TermServiceImpl.upsertTags` (`:254-264`, `@ReactiveTransactional`): `new HashSet<>(tagsFormData.getTagNameList())` -> `tagService.deleteRelationsWithTerm(termId, names)` FIRST (`:256`) -> `getOrCreateTagsByName` + `createRelationsWithTerm` -> `updateTagVectorsForTerm`.
  - `TagServiceImpl.deleteRelationsWithTerm` (`:124-134`): reads CURRENT term tags via `listByTerm`, computes `idsToDelete = currentTags where name NOT IN submittedNames`, hard-deletes those `tag_to_term` rows. The parameter is internally named `tagsToKeep` — revealing the replace-all intent that the API surface hides.
  - **The empty-list path**: `TagsFormData` declares `tag_name_list` REQUIRED (`components.yaml:2219-2220`) but with NO `minItems` — an empty array `[]` is a valid request. `deleteRelationsWithTerm(termId, emptySet)` computes `idsToDelete = currentTags where name NOT IN {}` — i.e. EVERY current tag.
  - **The auto-create side effect**: `getOrCreateTagsByName` -> `divideTagsByExistence` (`:144-159`) `bulkCreate`s any name not in the directory with `important = false` hardcoded (`:155`). The OpenAPI spec acknowledges this (`openapi.yaml:3186`) but no test verifies it.
  - **No external carve-out**: `tag_to_term` (`V0_0_35__add_terms.sql:18-28`) has no `external` / `origin` column; `listByTerm` filters only `TAG.DELETED_AT.isNull()` — there is no ingested-tag set to preserve (terms are a UI/API-authored concept with no ingestion-side tagging path).

  **Three distinct sub-behaviours, all unpinned:**
  - **Replace-all** — `PUT` with `['x']` on a term tagged `{a,b}` ends with `{x}`; `a` and `b` are hard-deleted. There is no separate DELETE endpoint — replace-all IS the removal mechanism.
  - **Empty-list-clears-all** — `{"tag_name_list": []}` removes ALL term tags. A client bug silently wipes the set.
  - **Auto-create-on-miss** — `['never-seen-name']` mints a `tag` directory row with `important = false`, visible to subsequent `GET /api/tags` callers.

  **Why HIGH**: the replace-all is the central operator-surprising semantic (the operationId says `create`). A regression making `deleteRelationsWithTerm` additive would silently change the contract with the build still green — this is exactly the cross-layer behaviour a unit test with a mocked `TagService` cannot catch.

  **Test gap shape**: a `WebTestClient` / `@SpringBootTest` integration test promoting probe P-027's arrange/act/assert: (a) seed a term tagged `{a,b}`, `PUT` `['x']`, assert the term ends tagged exactly `{x}`; (b) `PUT` `[]`, assert ALL term-tag relations gone; (c) `PUT` `['novel']`, assert a fresh `tag` row exists with `important = false` and is visible via `GET /api/tags`. The current state is PINNED — failures land if a future maintainer makes the operation additive.
