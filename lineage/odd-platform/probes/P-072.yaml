  retrospectives: [LSN-019, LSN-023]
realism_caveats: |
  The defect hypothesis is `header_count_during_search == 10`. If the header
  instead reads 2, the totalDataSources mirror is being updated during search
  and the sidecar's bugs_limitations_corner_cases entry is wrong — re-read
  DataSourcesList.tsx:44,50-52. This probe characterises an operator-confusion
  defect, not a data-correctness one: the card list itself is correct
  throughout (the slice total is also correct, as the api_search_response
  assertion shows); only the header NUMBER lags. The probe does not assert
  what happens to the count during an in-flight debounce window.
