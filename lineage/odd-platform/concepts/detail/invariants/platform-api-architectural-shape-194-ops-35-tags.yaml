name: Platform API architectural shape — 194 operations / 35 tags / 100 GET + 34 POST + 34 PUT + 24 DELETE + 2 PATCH
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-11
description: |-
  **NEW META-INVARIANT, batch 2026-05-20-Z (odd-platform-public-api spec
  sidecar)** — the platform-api OpenAPI spec (`odd-platform-specification/openapi.yaml`
  + sibling `components.yaml`) defines the platform's complete developer-facing
  HTTP surface with the following measured shape (Grep counts on the spec):
    - 194 operations total
    - 35 feature tags partitioning the operations
    - 100 GET + 34 POST + 34 PUT + 24 DELETE + 2 PATCH method distribution
    - ~250 schemas in components.yaml
    - 487 `$ref` invocations from openapi.yaml to components.yaml
    - 31 operations declaring HTTP 201
    - 137 operations declaring HTTP 200
    - 3 operations declaring non-2xx responses (`POST /api/owners` → 403,
      `GET /api/owners` → 500, `POST /api/owners/mapping/{owner_id}` → 403)
    - 0 `components.securitySchemes` entries
    - 0 per-operation `security:` declarations
    - 1 operation producing `image/png` (the unique non-JSON content-type:
      `GET /api/datasets/{id}/sla`)

  **Why this matters for the substrate**: the spec is the path/method/shape
  source of truth across the platform (per the
  `controllers-are-pass-through-delegates-with-http-wiring-on-generated-api-interfaces`
  invariant — every controller @Override's a generated `*Api` interface
  inherited from this spec; ZERO controllers declare their own
  @RequestMapping). The measured shape — 194 ops × 35 tags — is the
  denominator for every cross-cutting audit: status-code drift
  (31 declared 201 vs many controllers returning 200), authorization path
  drift (REFACTOR-217 + the alert-status mis-permission), error-response
  coverage gap (3 of 194 = 1.5% have any 4xx/5xx declaration), tag-to-
  doc-coverage gap (9 of 35 tags have an api-reference doc sub-page).

  **The 9-vs-35 documentation gap**: the api-reference doc hub
  (`developer-guides/api-reference`) enumerates 9 per-feature sub-pages
  (Alerts, Data Collaboration, Directory, Glossary, Integrations, Lineage,
  Query Examples, Reference Data, Relationships). The spec partitions 35
  tags. 26 tags have NO doc-side sub-page — including dataEntity (the
  largest tag with 45+ ops). The doc hub abdicates the 26 missing
  surfaces to Swagger UI without naming them; third-party API consumers
  reading the spec miss the bulk of the canonical narrative.

  **The 31-vs-spec drift**: the 31 declared-201 operations correlate with
  controllers that return 200 in implementation (per the
  `openapi-200-vs-201-status-code-drift` invariant — batch W extension
  enumerates 9+ endpoint-level instances across 7+ controllers, all of
  which are spec-vs-impl drift).

  **Severity**: META — the measured shape is the substrate fact that
  enables cross-cutting audits; the drift cluster summaries derived
  from it (status code, authorization path, error response coverage,
  doc coverage) carry their own severities.
