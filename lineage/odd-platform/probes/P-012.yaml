  - PartitionServiceImpl.java:122 (the DROP TABLE, no IF EXISTS)
  - EmptyPartitionsHousekeepingJob.java:16-33 (parent class does NOT use
    `DSL.using(connection).transaction(...)`, unlike AlertHousekeepingJob.java:25)
  - No row-lock or partition-lock held across the check + drop

