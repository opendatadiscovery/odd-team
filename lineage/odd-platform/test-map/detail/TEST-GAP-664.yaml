proposed_action: |-
  Repository-layer regression-pin test (security contract pin, not a vulnerability assert). (a) Create a dataset_field via `bulkCreate`. (b) Call `updateDescription(id, "<script>alert('xss')</script>")`. (c) Read back via `get(id)` and assert `pojo.getInternalDescription()` byte-equals `<script>alert('xss')</script>` (storage is verbatim). (d) Variant: payload `<img src=x onerror=alert('xss')>` — same verbatim-storage assertion. (e) Variant: payload `javascript:void(0)` — same. (f) Add a `// CONTRACT PIN: This test asserts the documented F-004 verbatim-storage architectural choice. The defence lives at the UI render layer (DefiniteDOMSanitiserPipeline + DOMPurify) per P-009 / F-004 sidecars. A REFACTOR introducing backend sanitisation will flip this test to assert the chosen sanitiser's output. A REFACTOR weakening the UI defence will require this storage layer to gain sanitisation; the test pair documents both ends of the contract.` comment block. (g) Cross-link to the dataset_field-tier dynamic probe candidate.
