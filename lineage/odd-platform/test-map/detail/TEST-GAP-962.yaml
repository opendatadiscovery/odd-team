behaviour: |-
  **HIGH — `GET /api/owners` is unauthenticated-read at the rule layer: SecurityConstants.SECURITY_RULES[143-147] contains rules for POST/PUT/DELETE only; the GET path has NO entry. Any authenticated user under LOGIN_FORM/OAUTH2/LDAP enumerates the entire Owner directory; any anonymous user under `auth.type=DISABLED` does the same. This contract is undocumented at both the live `/owners` and `/permissions` doc pages and untested anywhere.**

  Verified via Grep `/api/owners` against `../odd-platform/odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/auth/SecurityConstants.java` 2026-05-25: exactly three matches under `/api/owners*` mutating paths (POST line 143 → OWNER_CREATE, PUT line 144-145 → OWNER_UPDATE, DELETE line 146-147 → OWNER_DELETE) + two matches under `/api/owners/{owner_id}/mapping` paths. Zero matches for GET. The fourth method — `getOwnerList` at `OwnerController.java:30-38` — falls through to `AuthorizationCustomizer.customize`'s catch-all `pathMatchers("/**").authenticated()` (AuthorizationCustomizer.java:29-30).

  **What the directory enumeration leaks**:
  - Full list of Owner directory entries, including names that may carry PII (e.g. `alice@acme.com`, `[Pseudonymous Researcher]`, internal team-name strings).
  - The `allowedForSync` LEFT JOIN exposes which Owners have pending/approved `owner_association_request` rows — useful for an attacker constructing a phishing email targeting users mid-association-flow.
  - Combined with TEST-GAP-963 (DataCollaboration redirect open-redirect) the leaked names become cross-pillar pivot targets.

  **Documentation silence**:
  - Live `/owners` doc page (WebFetched 2026-05-25, status 200) is silent on listing-without-permission semantics.
  - Live `/permissions` doc page (WebFetched 2026-05-25, status 200) defines OWNER_CREATE / OWNER_UPDATE / OWNER_DELETE / OWNER_RELATION_MANAGE / OWNER_ASSOCIATION_MANAGE / DIRECT_OWNER_SYNC — **there is NO OWNER_READ permission**, confirming the design intent. But the absence of OWNER_READ is itself the gap operators cannot infer.
  - OpenAPI spec (`openapi.yaml:131-155`) declares only `200` and `500` responses for getOwnerList — no `401`/`403`. Implicitly confirms the design but provides no explicit policy claim.

  **Distinguishes from existing IDs**:
  - TEST-GAP-746 (LOW) — OwnerAssociationRequestController HTTP floor. Different controller.
  - TEST-GAP-736 (HIGH) — `GET /api/owner_association_request/activity` audit-trail unauthorized read. Different endpoint.
  - TEST-GAP-031 — DirectoryController @PreAuthorize absence (general directory). Different controller.
  - TEST-GAP-706 — ActivityController exposes global audit trail. Different surface.

  This entry is **CLASS-LEVEL NEW** for OwnerController and is the under-documented enumeration surface specifically for the Owner directory.
