proposed_canonical: GitHub username-rename orphans USER_OWNER_MAPPING
rationale: |-
  GitHub allows users to FREELY rename their `login` string at any time (the
  old name enters a 90-day escrow and is then released to others). The
  `GithubUserHandler.java:36` constant `USER_LOGIN = "login"` + line 56 default
  `adminAttribute = USER_LOGIN` means the username consumed downstream by
  `AuthIdentityProviderImpl.java:29-30` is the MUTABLE `login` string, NOT the
  stable numeric GitHub user `id`. A user `alice` who renames to `alice2`
  presents `(alice2, github)` to `AuthIdentityProviderImpl.fetchAssociatedOwner`
  on next login; the prior `(alice, github)` USER_OWNER_MAPPING row at
  `ReactiveUserOwnerMappingRepositoryImpl.java:116-127` is ORPHANED. There is
  NO `id`-based fallback. NO migration tool. NO live-doc warning. The compound
  key `(oidc_username, provider)` was always silent in the docs per F-011's
  `compound_key_silent_in_docs` drift facet; the GitHub-specific extension is
  that the silence has a new failure mode beyond migration (LOGIN_FORM →
  OAUTH2). A simple in-place identity change at the IDP breaks the binding.
  Severity HIGH per the GithubUserHandler sidecar — silent loss of owner-
  linkage on any GitHub rename; latent until rename happens; NOT detectable
  from server logs. Mitigations: (a) use GitHub's stable numeric `id` for
  USER_OWNER_MAPPING binding (one-line code change in
  `GithubUserHandler.java` to set userNameAttribute to `id`); (b) document
  the rename-risk on the live OAuth2/OIDC GitHub config page; (c) operator-
  side admin tool to merge orphan rows; (d) silent fail-open is the present
  state (a renamed user logs in with NO owner-link; their `My Objects` view
  renders empty; the prior row's data is orphaned).
contributing_concepts:
  - GithubUserHandler.java:36 (USER_LOGIN = "login" — the mutable username)
  - GithubUserHandler.java:56 (default adminAttribute = login)
  - AuthIdentityProviderImpl.java:29-30 (UserDto(name, "github") construction)
  - ReactiveUserOwnerMappingRepositoryImpl.java:116-127 (compound-key lookup)
  - F-011 `compound_key_silent_in_docs` drift facet (the parent finding)
  - GithubUserHandler.bugs_limitations_corner_cases[0] (HIGH severity)
suggested_add_to_docs: true
