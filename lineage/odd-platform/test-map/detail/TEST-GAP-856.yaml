behaviour: |-
  **CRITICAL — `GET /api/tags?page=1&size=30` returns the OLDEST 30 tags by `tag.id` ASC (creation order), NOT the 30 most-popular tags. This is the HTTP-boundary surface of the same LSN-019 drift that TEST-GAP-855 pins at the repository tier — but here the assertion is at the controller perimeter, the same level an integration / SDK consumer would observe.** No test exists for the controller; the repository-tier `testListMostPopular` is structurally blind (see TEST-GAP-855). The HTTP surface is the OpenAPI contract: an SDK consumer building against `openapi.yaml:344-346` ('Gets the list of existing tags sorted by popularity') and asserting `assertThat(response.items.get(0).usedCount).isGreaterThanOrEqualTo(response.items.get(1).usedCount)` across pages will FAIL the moment the directory exceeds `size`.

  **Why a SEPARATE gap from TEST-GAP-855**:
  - TEST-GAP-855 is the repository-tier (TagRepositoryImplTest using `@ExtendWith(BaseIntegrationTest)`); it pins the SQL behavior.
  - This gap (856) is the HTTP-boundary tier (`WebTestClient` against a full `@SpringBootTest`); it pins the END-TO-END behavior — the JSON response shape, the path-mapping wiring, the `TagsResponse.items` ordering, and the (absence of) authorisation gate on `GET /api/tags`.
  - A future refactor that fixes the repository BUT breaks the controller-tier serialisation, OR a future refactor that adds a UI-side re-sort to mask the repository drift, would be caught by ONE but not the OTHER. Both layers need pinning.

  **Operator-visible chain at the HTTP boundary**:
  - `TagController.getPopularTagList` (`TagController.java:36-44`): delegates straight-through to `tagService.listMostPopular(query, ids, page, size).map(ResponseEntity::ok)`. No re-sort, no transformation.
  - `TagsResponse.items` is serialised as a JSON array; the array order IS the response order.
  - The OpenAPI spec describes this as 'sorted by popularity' — but the JSON array is sorted by `tag.id` ASC when the directory exceeds `size`.
  - Combined with the absence of `@PreAuthorize` on the read endpoint (per `SecurityConstants.java:138-142` no GET entry), ANY authenticated user under LOGIN_FORM/OAUTH2/LDAP — and ANY unauthenticated user under DISABLED — can issue this request and observe the LSN-019 response shape.

  **Why CRITICAL**:
  - This is the SAME structural defect as TEST-GAP-855 but at the END-TO-END SDK-consumer-observable layer.
  - It corroborates the docs/spec drift (TagController.md:doc_drift_findings.[LSN-019]): the live page mentions a 'Top tags' surface; the API spec promises popularity; the controller returns oldest by id. The triple gap (spec vs code vs UI label) makes this a HIGHEST-VISIBILITY defect.
  - A regression-pin probe at the HTTP boundary catches BOTH spec-side and code-side regressions.
