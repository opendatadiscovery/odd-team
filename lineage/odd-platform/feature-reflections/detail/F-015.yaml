- id: H-011
  hypothesis: "When the user's owned set has an upstream lineage edge pointing to an entity that is a hollow stub (ingestion placeholder) or soft-deleted, the 'Upstream dependents' tile reflects that the neighbour exists (or signals that some neighbours were elided)."
  derivation: "invariant[8] / bugs[4] — includeHollow=false includeDeleted=false silently drop such rows; negative-space on the hollow+softdelete exclusion facet."
  seed_source: negative-space + response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      DataEntityServiceImpl.java:223 passes includeHollow=false, includeDeleted=false to listByOddrns. If an
      upstream LINEAGE edge points to a hollow entity (oddrn-only stub created when the parent is not yet
      ingested) or a soft-deleted entity, the LINEAGE row is in the derived oddrn set but the entity row is
      filtered out at the final scan. The tile is silently SHORTER than the lineage actually implies, with no
      tombstone count or "N neighbours hidden" signal. This is plausibly intentional (don't show stubs in a
      user-facing tile) but is undocumented in the spec and invisible in the UI — the user cannot tell their
      upstream graph contains stubs or deleted entities.
