proposed_action: |-
  Add `DataQualityRunsControllerHttpTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `getDataQualityTestsRuns_emptyCatalog_returns200WithAllZeroCellsPaddedTo36_pinsBaseline` — empty DB; GET; assert HTTP 200 + testResults.size()=6 (six categories) + each category.results.size()=6 (six statuses) + every count=0. PIN the padded-shape invariant.
  2. `getDataQualityTestsRuns_seededCatalog_returns200WithCorrectAggregateCells` — seed 3 DQ-tests across 2 categories with mixed latest-run statuses; GET; assert per-category counts match the manual aggregation.
  3. `getDataQualityTestsRuns_all10FiltersSupplied_andNonOverlapping_returnsAllZeroPadded` — supply 10 filter arrays designed to match no entity; GET; assert HTTP 200 + all counts=0 (NOT 404 or 400). Verifies the empty-result handling.
  4. `getDataQualityTestsRuns_emptyParams_treatedAsNoFilter_returns200WithEntireCatalog` — GET with no query params; assert HTTP 200 + catalog-wide aggregate (verify via vs. the same call with all-empty-list explicit params).
  5. `getDataQualityTestsRuns_oneNamespaceIdSupplied_resultIncludesEntitiesViaDataSourceNamespaceOrWidening_pinsLSN020Drift` — seed entity A with namespace=X directly and entity B whose datasource is in namespace=X but A's namespace is null; GET with namespaceIds=[X]; assert BOTH A and B counts appear (the OR-widening — see TEST-GAP-986).

  Pair with TEST-GAP-984, 985, 986, 987 — together this controller's HTTP surface and semantic invariants are covered.
