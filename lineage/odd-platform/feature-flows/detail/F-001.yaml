feature_name: Detail-page view tracking
discovered_from_entry_point: ui_route:/dataentities/{id}/overview
description: 'Opening a data entity''s detail page in the UI registers a view in the

  backend''s view_count column on the data_entity table. The view_count

  column is the sole signal for the home-page Popular ranking. The

  user-observable promise (per `data-discovery/catalog-overview.md`):

  "Popular shows the most-viewed or most-used data entities."

  FIXED-1764 (CTRIB-004, 2026-06-11, ships 0.28.0): one page-open now

  registers exactly +1 — the LSN-017 useEffect dep-array doubling

  (details.status?.status re-firing the fetch; +2 per open, pinned by

  P-004 and the IT-002 RED) is removed; IT-002 GREEN pins the +1. The

  refetch-after-status-change moved to an explicit dispatch in

  StatusSettingsForm. The inflation surface (unauthenticated,

  unthrottled increment x sole-DESC ranking) REMAINS by design until

  the PLT-217 hardening proposal lands.

  '
