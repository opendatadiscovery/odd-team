notes: |-
  STRENGTHENED + CORRECTED batch VAL-LSN-019 (2026-05-20) — the SQL
  primary source is now triple-anchored across the controller, service,
  and repository tiers. The previous "popularity-ranked" framing has
  been replaced with the LSN-019 truth: pagination precedes ranking;
  the outer count-DESC re-sort cannot reach excluded tags.

  Pairs with `create-tag` (the operator-explicit + gated entry-point;
  TAG_CREATE permission).
  Pairs with `delete-tag` (the GUARD-by-app-tier-cascade endpoint with
  the asymmetric tag_to_dataset_field bug — see
  `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field` invariant).
  Pairs with
  `getpopulartaglist-open-read-plus-side-door-compose-to-write-read-directory-bypass`
  (the compound WRITE+READ bypass).
  Pairs with `read-collaborative-cross-owner-enumeration` (the 24+
  sidecar pattern).
  Pairs with the NEW THIS BATCH invariant
  `lsn-019-listmostpopular-name-vs-behavior-drift-pagination-precedes-ranking`
  (the load-bearing LSN-019 finding promoted to its own invariant).
  Pairs with the NEW THIS BATCH canonicalisation candidate
  `top-tags-ui-label-vs-implementation-drift-operator-visible` (the
  UI surface where the drift manifests).

  Three DOC-NNN candidates flow from this:
    (a) /features/data-discovery/tagging — admonition on the "Top Tags"
        UI label NOT delivering most-popular when the directory exceeds
        the page size; explicit note about the SQL-tier ordering.
    (b) Update OpenAPI description at openapi.yaml:345 — replace
        "sorted by popularity" with the truthful "OLDEST `size` tags
        re-ordered by usage count within the window".
    (c) /developer-guides/api-reference/tagging NEW page — explicit
        documentation of the popularity ordering's semantic.
