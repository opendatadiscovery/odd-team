behaviour: 'PolicyJSONValidator schema invariants — MANAGEMENT with `conditions` rejected
  (schema `if MANAGEMENT then not conditions`); DATA_ENTITY-typed permissions rejected
  for a MANAGEMENT-typed resource (schema cross-type `if/then` at policy_schema.json:55-202);
  empty `statements` array rejected (`minItems: 1` at policy_schema.json:12). The
  validator raises `IllegalArgumentException` which, depending on the global exception
  handler chain, surfaces as 500 rather than 400. Operator''s experience of POSTing
  an invalid schema may be confused. STRENGTHENED batch I — the PolicyServiceImpl
  sidecar confirms PRIMARY-SOURCE: ControllerAdvice (ControllerAdvice.java:22-89) has
  handlers for `BadUserRequestException` → 400, but NO dedicated handler for `IllegalArgumentException`
  — it falls through to the catch-all at lines 61-66 and surfaces as HTTP 500 with
  the body `"Internal Server Error"` (NOT the validator''s actual error message).
  An operator POSTing a malformed policy gets a generic server error and must read
  server logs. The fix is one-line: PolicyJSONValidator throws BadUserRequestException
  OR ControllerAdvice adds an IllegalArgumentException handler.'
