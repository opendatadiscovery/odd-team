- id: H-006
  hypothesis: "When a user views a level-4 entity list, the 'X of Y' total in the header equals the number of entities they can actually page through — paginating to the last page does not surface entities the count said were not there, and the count does not claim more entities than exist."
  derivation: "Response-shape — level-4 returns both a paged items list and a separate total; a user reads 'X of Y' as a truthful claim about how many entities they can scroll. Negative-space: count/page predicate parity is a default user expectation."
  seed_source: response-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The page query and the count query use DIFFERENT predicate sets.
      `listByDatasourceAndType` (PAGE path via cteDataEntitySelect) applies soft-delete +
      HOLLOW.isFalse() only (ReactiveDataEntityRepositoryImpl.java:595-613, 909-939).
      `countByDatasourceAndType` (COUNT path via getDataEntityDefaultConditions) applies
      THREE conditions: HOLLOW + STATUS != DELETED + EXCLUDE_FROM_SEARCH IS NULL or = FALSE
      (lines 616-627, 970-976). Entities with EXCLUDE_FROM_SEARCH=TRUE are RETURNED by the
      page query but NOT COUNTED — so for any datasource that uses EXCLUDE_FROM_SEARCH to hide
      intermediate entities (transformer runs, transient inputs, hollow placeholders), the
      page returns more rows than the count reports. The UI compounds it: Entities.tsx reads
      `total` from pageInfo.total while `entities.length` derives from the flatMapped items,
      and `isContentEmpty={!total}` hides the empty placeholder on total>0 — but if total=0
      while items>0 the operator sees BOTH the empty-state placeholder AND populated rows
      (per the batch ui-review note C).
    evidence:
      - sidecar: odd-platform__java__DirectoryController__controller-class__DirectoryController
        section: coherence_check.conflicts_surfaced[0] + bugs_limitations_corner_cases[0]
        cite: "DataEntityServiceImpl.java:164-179; ReactiveDataEntityRepositoryImpl.java:595-613, 616-627, 909-939, 970-976"
        note: "page predicate set != count predicate set; EXCLUDE_FROM_SEARCH only on count"
      - sidecar: (feature-flow batch ui-review-2026-05-26 note C)
        section: batch_extensions notes (C)
        cite: "Entities.tsx:50-55, 85"
        note: "UI total vs items.length divergence + empty-placeholder-with-rows edge"
    operator_visible_failure: |
      (1) The header "30 of 28 entities" or "0 entities" with rows visible below it — a
      self-contradicting count the operator cannot trust. (2) Infinite-scroll loads more rows
      than the count claimed exist, so pagination math (page count, "load more" cut-off) is
      wrong and a user scrolling to the bottom passes entities the header said were absent.
      (3) The empty-state placeholder ("No information to display") can render ABOVE populated
      rows when total=0 but the page returns EXCLUDE_FROM_SEARCH=TRUE entities. The bug is
      invisible for the common case (all entities EXCLUDE_FROM_SEARCH=FALSE) and only bites
      deployments that use EXCLUDE_FROM_SEARCH — exactly the production deployments with
      heavy transformer-run volume, the least likely to be caught in a demo.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    note: "Already tracked as PLT-093 Defect 2. A regression-guard test is the functional demand."

- id: H-007
  hypothesis: "When a user registers a new data source in Management and then opens (or is already on) the Directory, the new source's type bucket and entity counts reflect the registration."
  derivation: "Cross-pillar (P-08 Management feeds P-01 Discovery — 'tags + namespaces + datasources feed Discovery'); negative-space — an operator expects a freshly-registered source to appear in the browse surface they use to audit coverage."
  seed_source: cross-pillar + negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The level-1 query IS unscoped and catalog-wide, so a NEW navigation to /directory after
      registration shows the new source. BUT the UI level-1 data is a TanStack singleton with
      a static queryKey ['dataSourceTypes'], NO staleTime, and NO invalidation: there is no
      `queryClient.invalidateQueries(['dataSourceTypes'])` anywhere (Directory.md:downstream_side_effects;
      implicit_adrs[0]). A user already on /directory, or who navigates back within the gcTime
      window (5 min), sees the CACHED pre-registration grid until hard reload or cache eviction.
      So the promise holds on a cold mount but fails on a warm one.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Directory
        section: downstream_side_effects + implicit_adrs[0] + bugs_limitations_corner_cases[5]
        cite: "directory.ts:13-14 (static queryKey, no staleTime); grep invalidateQueries -> empty"
        note: "stale-while-revalidate singleton; no invalidation path"
    operator_visible_failure: |
      An operator who registers a datasource in another tab/Management surface and switches to
      an already-open Directory tab does not see the new source — they may conclude registration
      failed and re-register, or file a false "datasource missing" report. The staleness window
      is bounded by gcTime (5 min) OR persists indefinitely while the Directory tab stays mounted
      and the query stays subscribed.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional
    note: "New drift class proposed: directory_level1_grid_stale_after_management_datasource_registration. Net-new (not in PLT-093, which covers leak/page-count/NaN)."

