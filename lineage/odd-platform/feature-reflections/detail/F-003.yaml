- id: H-010
  hypothesis: "When an operator sets auth.type to an unintended value (empty, a typo like 'OUATH2', lowercase 'disabled', or with stray whitespace), the platform surfaces a diagnostic rather than silently rendering the Popular panel on a deployment whose backend security did not wire."
  derivation: "Implicit functional/security requirement — an operator of a security-sensitive system expects misconfiguration to fail loud, not silently flip UI visibility. Negative-space + cross-pillar (P-09)."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The SPA gate at Overview.tsx:25-27 is a raw-string, case-sensitive equality against the literal
      'DISABLED' with NO normalization, NO enum validation, NO fallback. Four operator-misconfiguration
      scenarios produce surprising Popular-panel visibility with NO console.warn / toast / fallback:
      (1) AUTH_TYPE='' -> Boolean('' && ...) = false -> Popular HIDDEN (operator believes auth enabled);
      (2) AUTH_TYPE='OUATH2' (typo) -> true -> Popular SHOWS on a deployment where every backend
      @ConditionalOnProperty(havingValue=...) failed to match so NO SecurityWebFilterChain wired
      (degraded security + apparently-functional Popular); (3) AUTH_TYPE='disabled' (lowercase) -> true
      -> Popular SHOWS though operator intended to disable auth; (4) AUTH_TYPE=' DISABLED' (whitespace)
      -> true -> same. The backend half (AppInfoController.java:18 @Value with no default/no @Pattern)
      and the SPA half COMPOUND — neither layer catches the other's gap.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: bugs_limitations_corner_cases[0]
        cite: "Overview.tsx:25-27 + AppInfoController.java:18"
        note: "Raw-string gate + unvalidated @Value; four mis-gating scenarios with no diagnostic."
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: invariants
        cite: "Overview.tsx:25-27"
        note: "No enum validation; SPA mirrors backend's lack of validation; both fail-open."
    operator_visible_failure: |
      A typo in auth.type ('OUATH2') silently produces a deployment with NO SecurityWebFilterChain
      (every endpoint unguarded) while the home page renders the Popular panel as if auth were healthy —
      an operator sees a normal-looking platform and has no signal that the security posture collapsed.
      The compounding of the two unvalidated layers is exactly the LSN-001/002 silent-misconfiguration
      class. Already tracked as PLT-077 (which explicitly names BOTH AppInfoController.java:18 and
      Overview.tsx:25-27).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
