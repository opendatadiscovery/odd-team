- id: H-010
  hypothesis: "When the same user loads the home page twice (or paginates), the set of entities shown in the 'Upstream dependents' tile is stable — the same neighbours appear in the same order, no entity flickers in and out."
  derivation: "Response-shape/pagination seed + the unstable_pagination_no_order_by facet; a user's reasonable expectation of a stable briefing surface."
  seed_source: response-shape + negative-space
  validation:
    verdict: partial
    actual_behavior: |
      listByOddrns builds DSL.selectFrom(DATA_ENTITY).where(conditions).limit(size).offset(...) at
      ReactiveDataEntityRepositoryImpl.java:247-250 with NO .orderBy(...) call. Postgres documents pagination
      without ORDER BY as undefined — row order may change across consecutive identical queries, especially under
      concurrent writes. For the size=5/page=1 home-tile use case the practical impact is small (the derived set
      is usually small and the whole first "page" is shown), so the top-5 set membership is generally stable for
      a static catalog; but the ordering within the tile is not guaranteed, and for any larger or paginated
      consumption (a direct-API caller paging through /my/upstream) entities can appear on both adjacent pages or
      on neither. The promise holds for the common small-set tile case and breaks for the paginated/large-set
      case — hence partial.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getMyObjectsWithUpstream
        section: bugs[5] + performance.scaling_characteristics[3]
        cite: "ReactiveDataEntityRepositoryImpl.java:247-250 (no .orderBy before limit/offset)"
        note: "unstable pagination; undefined Postgres row order"
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveDataEntityRepositoryImpl
        section: understanding + gaps[4]
        cite: "ReactiveDataEntityRepositoryImpl.java:228-253"
        note: "listByOddrns is a raw scan distinct from the cteDataEntitySelect path; no ordering applied"
    operator_visible_failure: |
      (1) A direct-API consumer paging /my/upstream?page=1 then page=2 may see the same entity on both pages or
      miss an entity entirely (duplicate/skip across page boundaries). (2) Even on the home tile, the 5 entries
      can re-order between loads, which reads as instability though the membership is usually unchanged. The
      defect is latent for the size=5 happy path and active for any pagination — the fix (add .orderBy(DATA_ENTITY.ID)
      before limit/offset, the platform's canonical pattern) is the same for both.
    severity: MEDIUM
