proposed_action: |-
  Add `IngestMetricsCrossStorageMigrationOneWayDataLossRegressionPinTest`. Two-phase Spring-context-reload test:

  1. **Phase 1**: Spring context with `metrics.storage=INTERNAL_POSTGRES`. Ingest 100 metric series across 10 entities. Query `GET /api/dataentities/{id}/metrics` for each — assert all 100 visible.
  2. **Phase 2**: reload Spring context with `metrics.storage=PROMETHEUS` against a fresh Prometheus testcontainer. Ingest 50 NEW metric series across the SAME 10 entities.
  3. **Assert**:
     - `GET /api/dataentities/{id}/metrics` returns ONLY the 50 PROMETHEUS series (the 100 INTERNAL_POSTGRES series are GONE from the user's view).
     - `SELECT count(*) FROM metric_series` still returns 100 rows (the data is on disk; only the read-side is blind).
     - No migration utility class exists (`ApplicationContext.getBeansOfType(...).filter(MetricStorageMigrationService).isEmpty()`).
  4. **Reverse phase** (PROMETHEUS → INTERNAL_POSTGRES): reload context back to INTERNAL_POSTGRES, ingest 30 more series. Assert UI shows only the 30 (the 100 from Phase 1 are STILL invisible because they're keyed on different `metric_entity` rows registered before the schema-version-bump or similar).

  Coherence note (LSN-018 Rule 6): NET-NEW. Sister to TEST-GAP-823/824/825/826 (same node, different aspect). Sister-class to LSN-001 (attachment-storage migration drift) — same class of "config-change-silently-invalidates-data". STRENGTHENS the metrics-ingestion concept entry by adding `migration_one_way_data_invisibility` weakness.
