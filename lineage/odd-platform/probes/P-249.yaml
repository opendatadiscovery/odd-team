realism_caveats: |
  - The dataset-field arm of the UNION ALL joins an EMPTY tag_to_dataset_field
    table in this seed (seeding dataset fields requires dataset_version
    scaffolding). The LEFT JOIN + GROUP BY arm is still planned and executed,
    but its row-volume contribution is zero; a catalog with heavy dataset-field
    tagging is costlier than this probe measures.
  - The EXPLAIN-side execution time is a server-side proxy, not the REST
    wall-clock the operator experiences (reactive pipeline + JSON mapping add
    overhead on top). The REST calls in `act` confirm correctness; if the
    probe-runner's harness records wall-clock per rest step, prefer that
    number over the EXPLAIN proxy.
  - The 500 ms budget is a starting line chosen in the absence of a stated
    SLO for Catalog Overview tiles, not a contract. First measured run
    calibrates it.
  - The hand-written EXPLAIN SQL mirrors the jOOQ chain's structure (CTE,
    UNION ALL arms, outer aggregate, three-level paginate wrap) but is not
    byte-identical to the jOOQ-generated SQL; planner choices are expected
    to match because the shapes match, and a divergence is itself a finding.
