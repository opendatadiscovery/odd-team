maintainer_question: |-
  Surface 'unset' as a distinct UI state (option a — UI change), OR change the
  default to MINOR (option b — algorithm change with operator-visible flip across
  the catalog)? The two options have different operator-impact profiles —
  (a) is gradual and adds operator literacy; (b) is sudden and changes SLA outcomes
  for every deployment with unset tests. Cross-link to documentation/docs/data-quality/sla-statuses.md
  for the doc-side fix in either case.
