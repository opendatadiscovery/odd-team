behaviour: |-
  **hd-claim defence-in-depth — TERMINAL SECURITY decision on Google Workspace domain restriction.** When `auth.oauth2.client.{id}.allowed-domain=odd.com` is configured, Google IDP restriction enforces at TWO points: (a) `OAuthSecurityConfiguration.java:168-175` mutates the authorize URL to append `?hd={allowedDomain}` (steers Google's account picker — UX hint); (b) THIS handler at GoogleUserHandler.java:49-55 re-verifies the `hd` ID-token claim case-insensitively (the actual security enforcement). The TWO layers compose: a user could bypass the URL hint by editing the URL OR by using a personal `@gmail.com` account (which omits `hd` entirely, making it null) but is STILL rejected by the handler's hd-claim re-verification. ZERO tests exist on GoogleUserHandler — a regression that removed the hd-null check (line 50, the `!StringUtils.equalsIgnoreCase(allowed, null)` predicate) would silently let personal Google accounts authenticate to a Workspace-restricted deployment. Personal accounts: `token.getClaim('hd') == null` → `!equalsIgnoreCase('odd.com', null) == true` → REJECT with `OAuth2AuthenticationException("invalid_token", "Domain null doesn't match with allowed domain odd.com")`. A regression-vector class A (defence-in-depth-removal) silently widens the trust boundary.
