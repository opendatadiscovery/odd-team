        note: "silent failure on a primary nav action; orphan search-id mint on rapid clicks."
    operator_visible_failure: |-
      With the backend down (or transiently 5xx), a user clicks Catalog or Dictionary and nothing happens —
      no error, no spinner, no navigation. Failure modes: (1) the user repeatedly clicks (it looks unresponsive),
