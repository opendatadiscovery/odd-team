  (a) `failedDashboardFetch500_rendersErrorBanner_NOT_emptyDonuts`: mock useGetDataQualityDashboard so the underlying useQuery rejects with HTTP 500. Render <DataQualityContent>. Assert an error banner (e.g. <AppErrorPage> or an inline error message) is shown — NOT the three grey donuts. EXPECTED TO FAIL today; pins the desired UX.
