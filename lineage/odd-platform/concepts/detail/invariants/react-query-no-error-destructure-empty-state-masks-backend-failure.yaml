name: react-query no-error destructure — empty state masks backend failure (DQ Dashboard instance)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  `DataQualityContent` destructures only `{ data, isSuccess }` from
  `useGetDataQualityDashboard` (DataQualityContent.tsx:24) — it never
  reads `isError`, `error`, or any failure surface. On a 4xx/5xx from
  GET /api/dataqatests/runs, react-query keeps `data` at the all-zero
  `initialData` placeholder, `isSuccess` stays false, `testResults`
  resolves to `[]`, and the operator sees three grey 'No data' donuts
  with NO error message. A real backend failure is presented to the
  operator as "your catalog has no data quality tests". NEW invariant,
  batch ZC (2026-05-22).

  Three failure modes are made indistinguishable by this pattern:
    (a) genuine empty catalog (no DQ tests ingested) — the intended
        zero-state;
    (b) auth failure (401 / 403 from the backend) — operator sees the
        same zero-state and assumes empty catalog;
    (c) backend outage (5xx) — operator sees the same zero-state and
        assumes empty catalog.

  All three look identical: three grey 'No data' donuts plus an empty
  category list. The operator has no signal to distinguish "the dashboard
  is working and your catalog has no DQ tests" from "the dashboard's
  backend is down".

  The pattern is exacerbated by the hook's `initialData` setting
  (dataQuality.ts:80) — even before the first fetch resolves, `data`
  is the all-zero placeholder. The `if (!data)` early-returns scattered
  through DataQualityContent (lines 33, 44, 54, 66) are therefore
  effectively dead code in normal operation; if `initialData` is ever
  removed, those guards become live and the behaviour silently changes.

  vocabulary_status: codebase-anchored. The pattern is a general
  react-query anti-pattern, not unique to the DQ Dashboard — but this
  is the first instance recorded in the concept catalog. Future
  sidecars exhibiting the same pattern can STRENGTHEN this concept.

  Suggested fix: destructure `isError` (and ideally `error`) from
  the hook, render an explicit `AppErrorPage` or inline error banner
  on error, and only show the 'No data' donuts when the fetch
  succeeded with an empty `testResults` array. Severity MEDIUM
  (operator misdiagnosis risk under backend outage).
vocabulary_status: codebase-anchored
