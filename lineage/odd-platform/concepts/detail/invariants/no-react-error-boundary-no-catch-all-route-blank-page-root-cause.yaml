mitigations_unimplemented:
  - |-
    5-line fix: add `<Route path='*' element={<AppErrorPage
    showError error={{status:404, statusText:'Page Not Found',
    url:'', message:''}} />} />` just before `</Routes>` in
    `App.tsx:89`. Closes failure classes (a) and (d) — bare URLs
    + unknown URLs.
  - |-
    Wrap `<Routes>` in an `<ErrorBoundary>` (e.g. react-error-boundary
    npm package or hand-rolled). Closes failure classes (b) and (c)
    — synchronous JS render errors + lazy chunk-load failures.
  - |-
    Add a Cypress/Playwright integration test asserting that
    visiting `/__nonexistent-url__` produces the AppErrorPage 404
    surface, and that synchronous render errors fall to the
    boundary. Without this test, future regressions land silently.
