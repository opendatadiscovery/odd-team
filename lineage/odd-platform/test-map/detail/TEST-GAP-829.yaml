behaviour: |-
  **MEDIUM — Only 3 of 194 operations declare a non-2xx error response in the spec. Third-party SDK clients have NO typed error shapes for 191 operations.**

  Verified by Grep on `openapi.yaml`:
  - `'4..':` → 2 occurrences (line 172 = `POST /api/owners` 403; line 3433 = `POST /api/owners/mapping/{owner_id}` 403).
  - `'5..':` → 1 occurrence (line 152 = `GET /api/owners` 500).

  **Result**: 191 operations declare ONLY their happy-path 2xx response shape. The platform DOES return 4xx and 5xx in production (per every controller-method sidecar), but the spec is silent on what those responses look like.

  **Impact**:
  - Third-party SDKs cannot type their error catch blocks. Java's `throws IOException` is the only signal; TypeScript's `Promise<T>` swallows errors.
  - Operators debugging from spec-consuming clients have no schema for the error body — `{"message": "...", "code": "..."}` vs `{"error": {...}}` vs the bare string body — all undocumented.
  - The spec's contract surface is "shape if it succeeds; you're on your own if it fails" — a quarter-of-a-contract.

  **Concrete impact pattern**:
  - Operator calls `POST /api/dataentities/{id}/terms` (per REFACTOR-217 — the spec'd path).
  - With auth bypassed (REFACTOR-217 not yet fixed), SUCCESS. Once REFACTOR-217 is fixed, the same call returns 403.
  - The SDK's typed contract doesn't know about the 403 — operator's integration silently swallows it.

  **Why MEDIUM**: this is a quality-of-API contract gap, not a security boundary failure. But the absence of typed error shapes is a load-bearing reason operators report ODD's API as "harder to integrate than alternatives" — same operator-pain class as DOC-GAP-099 inverse-semantic on `getMyObjects*`.

  **Test gap shape**: build-time contract test that asserts:
  1. Every operation declares at least one 4xx OR 5xx response (or is explicitly marked as never-failing in an `x-error-free` allowlist).
  2. The 4xx response references a canonical `ErrorResponse` schema in `components.yaml`.
  3. The schema matches what the controllers actually return (via cross-reference with the Spring `@ExceptionHandler` chain).
