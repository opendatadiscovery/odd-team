proposed_action: |-
  Add `masterDataRouteBareUrl.test.tsx`:

  (a) `visitingBareMasterData_rendersBlankPage_pinsCurrentNoMatchBehavior`: drive `<App>` in a MemoryRouter at `/master-data`; assert AppToolbar IS rendered AND assert NO `LookupTables` / `Navigate` element mounted; pins the no-match state.

  (b) `masterDataTabSelectedRegardlessOfMatch_pinsSubstringMatchSemantic`: assert the "Master Data" toolbar tab lights up (selected style) both at `/master-data` (no match) and at `/master-data/lookup-tables` (real route) — pins the ToolbarTabs.tsx:101 substring-match anti-pattern, surfacing the misleading-by-design tab-highlight that compounds the blank-content surprise.

  Decision-point comment at masterDataRoutes.ts:1: 'The `/master-data` BASE_PATH is reserved for a future family of Master Data Management sub-features. Today only `/master-data/lookup-tables` exists. Bare `/master-data` renders nothing. To fix when a second sub-route is added: add `<Route index element={<Navigate to="lookup-tables" replace />} />` to the App.tsx route tree. See TEST-GAP-999 + TEST-GAP-1004 for the pattern done right at `/data-modelling`.'
