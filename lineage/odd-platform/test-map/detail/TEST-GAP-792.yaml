behaviour: |-
  **LOW — R2DBCConfiguration.java:31 converts `jdbc:postgresql://...` → `r2dbc:postgresql://...` via raw `.replace("jdbc", "r2dbc")`. If the JDBC URL's hostname or database-name contains the literal substring `jdbc` (LOW likelihood with standard PG deployments; possible with hostnames like `jdbc-host.example.com` or DB names like `jdbc_test`), the URL becomes corrupted at multiple positions.**

  Example failure:
  - Operator config: `spring.datasource.url=jdbc:postgresql://jdbc-internal.example.com:5432/jdbc_db`
  - Post-replace: `r2dbc:postgresql://r2dbc-internal.example.com:5432/r2dbc_db` — DNS resolution fails (host doesn't exist), bean wiring throws at boot.

  Severity is LOW because (a) the failure is loud (boot fails — fail-fast), (b) standard PG hostnames don't contain `jdbc`, (c) the fix is one line (`.replaceFirst("^jdbc:", "r2dbc:")`).

  **Test gap shape**: parametrised test asserting URL conversion behaviour for both standard and edge-case URLs. The current `.replace` will FAIL the edge case; the fix replaces with `.replaceFirst`.
