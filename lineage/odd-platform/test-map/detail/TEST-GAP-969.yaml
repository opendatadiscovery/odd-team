proposed_action: |-
  Add `IngestionControllerIdentityResolutionTest`:

  1. `createDataSource_collectorAToken_postingForOwnNamespace_returns200_pinsHappyPath` — auth as Collector A's token; POST `/ingestion/datasources` with a fresh ODDRN; assert 200.
  2. `createDataSource_missingSession_returns500NotIfHttp401_pinsErrorShapeMismatch` — POST `/ingestion/datasources` WITHOUT going through IngestionDataSourceFilter first (e.g. with no Authorization header); assert response is 500 (per the IllegalStateException at line 54), NOT 401. Comment: '// REGRESSION-PIN — current error-shape is operator-confusing.'
  3. `postDataEntityList_collectorAToken_postingForCollectorBDatasource_currentBehaviour` — with `auth.ingestion.filter.enabled=true`, POST `/ingestion/entities` with Collector A's token + `dataSourceOddrn` belonging to Collector B; assert the CURRENT behaviour (likely 401 if IngestionDataEntitiesFilter correctly cross-checks; or 200 if the cross-check is weak). PIN the contract.
  4. `postDataSetStatsList_collectorAToken_underFilterEnabledTrue_unauthenticated_pinsCoverageGap` — even with filter toggle enabled, postDataSetStatsList has NO filter coverage; assert anonymous POST succeeds, pinning the filter-coverage gap.

  Coherence note (LSN-018 Rule 6): NET-NEW class-level concern. Compounds with TEST-GAP-958 (reachability matrix) — different orthogonal concern.
