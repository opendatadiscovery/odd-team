description: |-
  NEW CANONICALISATION CANDIDATE, batch VAL-LSN-019 (2026-05-20) —
  META-FINDING capturing the validated value of the LSN-019 Stress
  Protocol. The protocol (introduced via
  `retrospectives/LSN-019-file-analyser-describes-not-interrogates.md`)
  extends the file-analyser prompt with five trigger categories that
  fire auto-questions on every detected trigger:

    Category A — Tunables (numeric / null / boundary edge cases)
    Category B — Name-behavior pairs (promise vs implementation)
    Category C — Orderings / pagination / aggregation semantics
    Category D — Authorization gates (per-method)
    Category E — Resource boundaries (concurrency / TX / locks / cache)

  The protocol's design hypothesis was that mechanically auto-firing
  questions across all five categories would surface drift patterns
  that maintainers might not think to ask about. Batch VAL-LSN-019
  validates the hypothesis: the canary batch produced THREE sidecars
  (TagController + TagServiceImpl + ReactiveTagRepositoryImpl) which,
  via the B-category auto-question on every operation, surfaced the
  listMostPopular drift across all three layers — without the
  maintainer needing to know to ask.

  THE VALIDATED PATTERN — METHODOLOGY OUTCOME:

    The maintainer's previous batch-W TagController sidecar described
    listMostPopular as delivering "popularity-ranked paginated global
    tag directory" — the WRONG framing, perpetuating the LSN-019 LIE
    at the substrate layer. The maintainer's 2026-05-20 empirical
    test against demo.oddp.io independently surfaced the drift; the
    Stress Protocol's mechanical auto-question converted the empirical
    finding into a structured, file:line-anchored, cross-layer trace
    in the rev-4 sidecar.

    Without the Stress Protocol: the rev-3 sidecars carried the WRONG
    description; the drift would only surface again when a future
    operator hit the empirical case AND independently traced the SQL.
    With the Stress Protocol: every file-analyser run that touches
    `listMostPopular` (or any sibling pagination-with-aggregate
    method) mechanically asks the NAME-vs-BEHAVIOR question and gets
    a structured answer; the drift is captured automatically.

  THE DRIFT DETECTION CLASS:

    The protocol catches drift patterns that are STRUCTURALLY HIDDEN:
      - A drift visible only by cross-layer trace (no single file
        carries the contradiction; the contradiction is across the
        method name + the SQL implementation).
      - A drift that "looks reasonable" from any single layer's
        perspective (every single method body is internally consistent;
        the bug surfaces only at the compositional boundary).
      - A drift that survives passive review (a maintainer reading the
        code without explicitly asking "does the name match the
        behavior?" would not surface it).

    The LSN-019 listMostPopular drift is the canonical exemplar of
    this class. The Stress Protocol's auto-fired question is the
    detection mechanism.

  THE STRESS PROTOCOL'S ARCHITECTURAL VALUE — three load-bearing
  properties:

    (1) MECHANICAL: the auto-fire is unconditional. The maintainer's
        attention is not the gating factor. Every operation in every
        sidecar gets the B-category question.

    (2) CROSS-LAYER: the protocol's auto-questions surface drift that
        is INVISIBLE from any single file. The chain-trace evidence
        (e.g., the smoking-gun trace at ReactiveTagRepositoryImpl.java:148)
        becomes the canonical citation, not the symptoms.

    (3) ITERATIVE: drift findings reuse the same shape across sidecars,
        so the next maintainer (or AI agent) re-running file-analyser
        finds the same pattern + the same evidence + the same probe.
        Subsequent batches strengthen the finding rather than
        re-discover it.

  THE SIBLING DRIFT CANDIDATES (where the protocol will fire next):

    Pre-emptive enumeration of sister auto-questions that future
    file-analyser runs are likely to surface across the codebase:

      - ReactiveDataEntityRepositoryImpl.listPopular — the Data Entity
        popularity parallel. Uses view_count instead of count-aggregate.
        Whether paginate INSIDE the CTE applies before view_count
        ORDER BY is a B-category auto-question waiting for a future
        sidecar.

      - Any paginated list-with-ordering-by-aggregate endpoint across
        the codebase. The Stress Protocol's B-category will surface
        these mechanically.

      - Authorization-gate D-category questions on every controller
        method — recommended as the next high-leverage application
        of the protocol. The existing audit trail (REFACTOR-217
        path-mismatch, the SecurityConstants alerts-status mis-gate,
        the read-collaborative cross-owner enumeration pattern) shows
        the D-category surface has structural drift across many
        controllers.

      - Resource-boundary E-category questions on every
        @ReactiveTransactional method. The TOCTOU race on
        TagServiceImpl.getOrCreateTagsByName (no @ReactiveTransactional
        despite multi-step read-then-write) was found this batch; the
        sibling getOrInjectTagByName and deleteRelationsWithTerm have
        identical shape and would surface mechanically.

  THE PROTOCOL VS PRE-LSN-019 PROMPT — what changed:

    Pre-LSN-019 (rev-3 prompt): the file-analyser described what each
    method DID; the prompt was "describe the file". The maintainer's
    role was to add interrogation manually for findings of interest.

    LSN-019 (rev-4 prompt): the file-analyser is asked to INTERROGATE
    the file. Every detected trigger fires a question. The maintainer's
    attention is required only to validate the answers; the questions
    themselves are mechanical.

    The shift is "describe -> interrogate". The retrospective document
    captures the motivation; the protocol's stress_findings block in
    each sidecar captures the application.

