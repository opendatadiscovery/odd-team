    (S2sAuthenticationFilter.java:31-34 uppercase 'ADMIN' + IdentityController.java:32
    lowercase 'admin'; shared SystemUsers constants + reserved-username doc admonition).
    The deeper fix (resolve S2S to a dedicated system-Owner / no-owner sentinel)
    is the F-011 H-002 framing, also tracked under PLT-072. Convergent re-derivation
    from the F-088 product-owner lens — corroboration, NOT a new filing. The
    structural pin S2sPrincipalKnownBugTest.java already guards this exact bug
    (@pins PLT-072).

