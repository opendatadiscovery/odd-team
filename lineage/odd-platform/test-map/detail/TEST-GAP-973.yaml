behaviour: |-
  **MEDIUM — `GET /api/owners?allowedForSync=<true|false>` query parameter name TRANSLATES_SILENTLY: the param name implies 'eligible for synchronization' but the actual SQL predicate is 'has-or-has-not a row in owner_association_request' (the LEFT JOIN's presence/absence). Whether 'allowed for sync' equals 'has an APPROVED request' or 'has any request' or 'has no request' is not derivable from the parameter name. The OpenAPI spec has no description (only type: boolean); the live `/owners` doc page is silent.**

  Verified at primary source: `OwnerController.java:34` (the parameter) + `openapi.yaml:140-144` (spec with no description) + the ReactiveOwnerRepositoryImpl sidecar's analysis of `enrichSelect`'s LEFT JOIN on `owner_association_request` + WebFetch live `/owners` doc 2026-05-25 status 200 (verified silent).

  **What the parameter actually does**:
  - The implementation forwards to `ownerService.list(page, size, query, ids, allowedForSync)` (line 36) → `ReactiveOwnerRepositoryImpl.list` applies the paginate-wrapper + name-LIKE + ID-IN + LEFT JOIN on `owner_association_request` filters.
  - The semantic the UI's `OwnerSelect` autocomplete RELIES ON (per OwnersList batch-Q sidecar) — but this dependency is undocumented at the API contract level.
  - An API consumer outside the UI cannot determine which interpretation is in effect.

  **Operator-visible consequence**:
  - Operator querying `allowedForSync=true` expecting 'owners eligible to be sync'd with a user account' may receive owners who have a PENDING/DECLINED owner_association_request (semantically 'has a request, not yet eligible') — OR the inverse (filtered out as 'has a request, not eligible because still pending').
  - The mismatch is silent: the API returns SOME set of owners with NO indication of how they were filtered.
  - Combined with TEST-GAP-962 (GET unauthenticated read), the parameter becomes a partial-info-leak: an attacker can probe which Owners have / don't have association requests by alternating `allowedForSync=true|false`.

  **Why MEDIUM**: not a data-loss / security concern at this size; documentation concern. But the parameter is the load-bearing semantic input for the UI's user-owner association flow.

  **Distinguishes**:
  - TEST-GAP-962 (HIGH this batch) — same endpoint, different concern (auth posture).
  - No prior TEST-GAP covers the parameter-name-vs-implementation drift specifically.
