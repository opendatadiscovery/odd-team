realism_caveats: |
  This probe measures ONE anchor oddrn per hop. The production shape binds an anchor SET — a
  subquery over data_entity JOIN ownership at hop 1 (ReactiveLineageRepositoryImpl.java:175-178)
  and a frontier IN-list of up to 10_001 elements at hops 2..n (:200). Both widen the scan; the
  probe therefore establishes the LOWER bound on hop cost, not the production cost.

  It also does not exercise the 5s wall-clock circuit breaker at MyDataScopeResolverImpl.java:103
  (that is P-251), and it says nothing about which SUBSET the LIMIT keeps — that answer is
  statically determined (ORDER BY <neighbour> ASC over a DISTINCT single-column projection has no
  ties, so the prefix is the lexicographically smallest `limit` oddrns) and belongs in a
  regression test, not a probe.
