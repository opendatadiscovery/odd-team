mitigations_unimplemented:
  - |-
    Fix surface 1 (preferred) — optimistic decrement in
    alerts.slice.ts's updateAlertStatus.fulfilled reducer.
    ~10 lines; correct for the common single-user Resolve flow.
  - |-
    Fix surface 2 (correctness) — background re-fetch of totals
    from the fulfilment reducer. ~5 lines; one extra round-trip
    per Resolve.
  - |-
    Fix surface 3 (long-lived dashboard) — polling fetchAlertsTotals
    every 30-60 seconds. Should be feature-flagged.
  - |-
    Fix surface 4 (architectural) — event-driven WebSocket / SSE
    push from backend. Out of UI-only scope.
notes: |-
  NEW invariant captured in batch ZL (2026-05-26) FINAL refresh.
  Class membership: 'useEffect with empty deps + state mutation
  decoupled from the fetch' — a recurring pattern across the SPA.
  Cross-batch audit candidates:
    - DataEntityDetailsHeader's view_count (LSN-017 case-law —
      different shape; the doubled-fetch bug was the inverse of
      this: too-many fetches, not too-few);
    - Activity.tsx counts (fetched per queryParams change —
      OK; but the badge counts on the data-entity-detail
      breadcrumb (when implemented) would face the same class);
    - LookupTables.tsx counter (fetched at list-fetch time —
      stale after delete? PROBE-NEEDED).

  Pairs with the LSN-017 measurement-truth principle — a
  Playwright probe would empirically confirm the badge stays
  stale after Resolve. Worth promoting to a probe if/when the
  fix lands.
