proposed_action: |-
  Add `DataQualityRunsTitleFilterScopeIntegrationTest` extending `@SpringBootTest` + Testcontainers (Postgres). Three pinning methods:
  (a) `titleIdsFilter_bindsToOwnershipTitleId_returnsEntitiesByOwnershipRole`: seed two `TITLE` rows (T1='Data Steward', T2='Data Owner'); seed three data entities; create OWNERSHIP rows attaching one owner with T1 to D1 and D2, one owner with T2 to D3. WebTestClient `GET /api/dataqatests/runs?titleIds={T1.id}`; assert `tablesDashboard.healthyTables + warningTables + errorTables` count covers exactly D1 and D2 (not D3). PINS that titleIds binds to the OWNERSHIP role.
  (b) `titleIdsFilter_doesNotBindToDataEntityName_returnsEmptyForEntityIdValue`: WebTestClient `GET /api/dataqatests/runs?titleIds={D1.id}` (passing a data-entity id where the spec rendered as "Title" might imply a dataset title). Assert empty `tablesDashboard` aggregates — PINS that titleIds does NOT match by DATA_ENTITY.NAME or the entity id; the only thing that matches is a TITLE row id.
  (c) `titleIdsAndOwnerIdsCombined_areConjoinedInSingleOwnershipJoinWithAND`: seed owner OwnerA holding T1 on D1, owner OwnerB holding T2 on D2. WebTestClient `GET /api/dataqatests/runs?titleIds={T1.id}&ownerIds={OwnerB.id}`; assert the result is EMPTY (neither D1 has OwnerB nor does D2 have T1 — the single OWNERSHIP join with AND is unsatisfiable). PINS the compounding drift documented in DataQualityFilters.md:bugs_limitations_corner_cases.[0] — the AND-on-same-OWNERSHIP-row semantics.

  Add a `// REGRESSION-PIN — ReactiveDataQualityRunsRepositoryImpl.java:296-311 — titleIds binds OWNERSHIP.TITLE_ID, NOT a dataset name column. The UI label is the bare i18n key t('Title'); the bind is to the ownership ROLE. This test pins the SQL bind; if the maintainer relabels the UI or rebinds the SQL, this test must be updated AND documentation/docs/features/data-quality/dashboard.md must be updated to disambiguate.` block. Pair with DOC-GAP-NNN (rename the UI label and disambiguate the doc).
