behaviour: |-
  **`DataSourceIngestionServiceImpl` DOES NOT REFRESH THE FTS SEARCH-VECTOR ON DATASOURCE RENAME — unlike the UI path's `DataSourceServiceImpl.update`.** The UI path at `DataSourceServiceImpl.java:133` (per batch R sidecar) calls `searchEntrypointRepository.updateChangedDataSourceVector(id)`; this collector-ingestion service does NOT. After a collector renames `name` from "snowflake" to "snowflake-prod", the FTS index still ranks "snowflake" — search-discoverability lags reality. A subsequent ingestion of a child data_entity would refresh the entity-side FTS, but the datasource-side vector remains stale until a full FTS rebuild. The test pins the CURRENT no-FTS-refresh absence so a future fix adding the refresh call breaks the test deliberately AND a regression that ADDED an FTS-refresh call (e.g. an accidental copy-paste from the UI path) would be silently OK without this pin.
