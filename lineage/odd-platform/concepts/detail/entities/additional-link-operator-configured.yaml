name: Additional Link (operator-configured global navigation catalogue)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-08
description: |-
  NEW ENTITY, batch ZE — operator-supplied external URLs surfaced in
  the App Info menu (the toolbar information icon) of every page in
  the SPA. Bound at boot via Spring @ConfigurationProperties from
  odd.links[].{title,url} (AdditionalLinkProperties.java:6).

  Documented on docs/configuration-and-deployment/odd-platform (200
  OK 2026-05-25) — the live page describes the feature as
  'pointers to internal wikis, runbooks, dashboards, or any other
  page', each entry requiring title + url with opening-in-new-tab.

  STATIC PER-PROCESS — the record-of-records is captured at boot;
  runtime YAML / env mutation requires container restart. No
  /actuator/refresh hot-reload path.

  Audience: every authenticated user (or anonymous under DISABLED)
  receives the SAME list — no per-role / per-owner filtering.

  Distinct from the per-data-entity attachment link surface at
  /api/dataentities/{id}/links (which is per-entity, user-managed,
  and gated by DATA_ENTITY_ATTACHMENT_MANAGE). The name 'links' is
  reused at two semantically distinct scopes — the OpenAPI tags
  ('links' vs 'dataEntityAttachment') disambiguate at the spec
  layer but not at the path layer.

  Doc drift surfaced by sidecar — live doc says 'opening in a new
  tab' but code does NOT set rel='noopener noreferrer'
  (AppInfoMenu.tsx:60-66); doc says 'absolute URL' but code does
  NOT validate URL scheme — operator-configured `javascript:` or
  `data:text/html` URLs are passed unsanitised. The reverse-tabnabbing
  + URL-scheme gap is the load-bearing operator-trust finding.

  ## STRENGTHENED — batch ZK (2026-05-26) — AdditionalLinkProperties config-properties-class primary source

  Batch ZK adds the AdditionalLinkProperties config-properties-class
  primary-source sidecar (rev file-analyser/0.5.0). The prior anchor was
  the LinksController CONSUMER angle (batch ZE); batch ZK adds the
  BINDING-OWNER angle from `AdditionalLinkProperties.java:1-10` itself
  (the 10-line record-of-records: outer `record AdditionalLinkProperties(List<Link>
  links)` + inner `record Link(String title, String url)`). Three NEW
  findings surface from the binding-owner angle that the consumer angle
  could not see:

  (a) **Class-name-vs-prefix drift** — the Java class is
      `AdditionalLinkProperties` (advertising 'additional links') but
      the `@ConfigurationProperties` prefix is `odd` (NOT
      `odd.additional-links` and NOT `odd.additional.links`). The bound
      property is the unqualified `odd.links`. The 'Additional' qualifier
      is JAVA-INTERNAL ONLY. An operator skimming `application.yml` and
      seeing `odd.links:` may not realise it corresponds to the 'additional
      links toolbar' feature.

  (b) **Namespace overclaim — `@ConfigurationProperties("odd")` claims
      the entire `odd.*` prefix but binds only `links`**. The other
      `odd.*` keys (`odd.tenant-id`, `odd.platform-base-url`,
      `odd.data-entity-stale-period`, `odd.activity.partition-period`)
      are consumed independently via `@Value` reads scattered across
      services (SlackMessageGeneratorConfiguration.java:15,
      ExternalMetricReader.java:53, DataEntityStaleDetector.java:10).
      LATENT FOOT-GUN: if a future hardening change toggled
      `(ignoreUnknownFields = false)` — a common posture — the
      application would FAIL TO BOOT because the binder would see
      `tenant-id`, `platform-base-url`, etc. as 'unknown' sibling keys
      under the `odd` prefix. This is a canonical instance of the
      Partial-home @ConfigurationProperties pattern invariant.

  (c) **NULL-vs-empty-list distinction at binding** — at the RECORD layer
      the default is actually `null` when `odd.links` is absent (not
      `List.of()`); the empty-list response shape is constructed by
      LinksController's `CollectionUtils.isEmpty` check. The doc page
      says 'Defaults to empty list' which is true at the API response
      layer but NOT at the binding layer. A future refactor that inlined
      or removed the controller's null-guard would break the documented
      default.

  Three OBSERVATIONS strengthen the existing ZE finding:

  (i)  **URL-scheme passthrough — backend-side primary source confirmed**:
       the record's inner `Link(String title, String url)` has NO
       `@URL`, NO `@Pattern`, NO `@NotBlank`, NO scheme allowlist, NO
       `@Validated` activator. The defence-in-depth pushed to the UI
       layer (React's javascript:-neutralisation) is the ONLY barrier;
       backend-side has zero validation. Confirmed at the binding-owner
       (the source of operator-input) angle.

  (ii) **No `@ConstructorBinding` despite being a record** — works under
       Spring Boot 3.x because constructor binding is now the default for
       records, but a future migration to a non-record type (e.g. Lombok
       `@Data` class) would silently flip to setter-based binding with
       different default behaviour around immutability and partial
       population. Latent refactor hazard.

  (iii) **`odd.links` is NOT in the default `application.yml`** — not even
       as a commented-out template. Operators discovering the feature have
       NO anchor in the shipped config file. The `odd:` block
       (application.yml:208-214) lists `platform-base-url` (commented),
       `tenant-id`, `data-entity-stale-period`, and `activity.partition-period`
       — but `links` is silently omitted.

  No probes emitted batch ZK (Probe P-177 from batch ZE remains the
  authoritative empirical pin; the new binding-owner-angle findings are
  all STATIC-INFERRED with HIGH confidence).
