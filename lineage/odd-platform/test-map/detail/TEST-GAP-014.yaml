behaviour: |-
  No test verifies that `/ingestion/alert/alertmanager` accepts anonymous
  requests (i.e. that `/ingestion/**` whitelisting still applies). A future security
  tightening (e.g. extending IngestionDataEntitiesFilter) could break the integration
  silently. STRENGTHENED batch P — the AlertManagerController#postAlerts sidecar
  is the PRIMARY-SOURCE at the method tier. Confirms via three independent anchors
  that auth is fully absent: (1) AlertManagerController.java:21-26 has no @PreAuthorize,
  no @Secured, no @ConditionalOnProperty; (2) SecurityConstants.java:96 — `/ingestion/**`
  is the second-to-last WHITELIST_PATHS entry exempting the entire namespace from
  the UI auth chain across all four auth.type modes; (3) IngestionDataEntitiesFilter.java:28
  binds via PathPatternParserServerWebExchangeMatcher to `/ingestion/entities` POST
  ONLY — explicitly does NOT cover this sub-path. The endpoint is unauthenticated
  under DISABLED, LOGIN_FORM, OAUTH2, AND LDAP — and under ALL values of `auth.ingestion.filter.enabled`.
  Plus the live doc page (configuration-and-deployment/odd-platform, refreshed 2026-05-20
  status 200) documents this verbatim: "The AlertManager webhook endpoint is not
  authenticated. ODD Platform whitelists the entire `/ingestion/**` namespace in
  Spring Security, and the ingestion auth filter controlled by `auth.ingestion.filter.enabled`
  only guards `/ingestion/entities` (POST) — it does not cover `/ingestion/alert/alertmanager`."
  This is the F-007 `unauthenticated_payload_trust` facet, NOW PRIMARY-SOURCE at
  method tier — operator-delegated network-layer auth is the SOLE defence.
