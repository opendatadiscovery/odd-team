proposed_local_probes:
  - id: P-shb-007-001
    description: |-
      Local stack: ingest two distinct datasets D1 and D2; for D2 capture
      its version_id V2; GET /api/datasets/D1.id/structure/V2 — assert
      200 today (locks the bug), 404 after fix.
    type: security
    cost: low
  - id: P-shb-007-002
    description: |-
      Local stack: ingest two datasets; GET /api/datasets/D1.id/structure/diff?first=V1&second=V2
      where V1 belongs to D1 and V2 belongs to D2 — assert 200 today
      (locks the cross-dataset diff bug), 400 or 404 after fix.
    type: security
    cost: low
  - id: P-shb-007-003
    description: |-
      Local stack: ingest a dataset normally (versions 1, 2, 3); then
      INSERT a row directly with version=999 and created_at = now() - 1 year;
      GET /api/datasets/{id}/structure — assert it returns version 999
      (max(VERSION)) NOT version 3 (max(created_at)).
    type: integration
    cost: medium
