- id: H-002
  hypothesis: |-
    When an operator hardens the deployment — sets auth.type=OAUTH2 (or LDAP, or
    LOGIN_FORM), AND auth.s2s.enabled=true, AND auth.ingestion.filter.enabled=true, all
    simultaneously — POST /ingestion/metrics then requires a credential, and an
    anonymous caller with only network reach is rejected (401/403).
  derivation: |-
    Endpoint-shape + pillar security-anchor (P-09 "two independent authentication
    surfaces"); an operator who turns on every auth toggle reasonably expects the write
    endpoint to be closed.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The endpoint is unauthenticated in EVERY supported deployment posture, including
      when all auth toggles are ON. ingestMetrics has no @PreAuthorize (the @Override of
      a contract-generated IngestionApi interface carrying no security annotations).
      /ingestion/** is in SecurityConstants.WHITELIST_PATHS, exempting it from UI auth for
      OAUTH2/LDAP (AuthorizationCustomizer) and LOGIN_FORM (permittedPaths), and
      short-circuiting BEFORE the S2S filter chain. IngestionDataEntitiesFilter
      exact-matches /ingestion/entities POST only; IngestionDataSourceFilter exact-matches
      /ingestion/datasources POST only — NEITHER covers /ingestion/metrics, and there is
      no IngestionMetricsFilter class. There is NO configuration that fail-closes the
      endpoint; the only mitigation is network-level (firewall / reverse-proxy auth) or
      patching in a new filter.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics.md
        section: security.known_security_gaps
        cite: "IngestionController.java:89-95 + IngestionDataEntitiesFilter.java:28 + IngestionDataSourceFilter.java:20 + SecurityConstants.java:96 + AuthorizationCustomizer.java:22"
        note: "no @PreAuthorize; whitelisted; covered by no filter — unauthenticated at every posture"
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics.md
        section: security.auth_mode_relevance
        cite: "WebFetch configuration-and-deployment/enable-security 2026-05-20 status 200"
        note: "live docs confirm only /ingestion/entities is filtered; metrics is a sibling"
    operator_visible_failure: |-
      (1) An operator who runs the full hardening checklist (OAUTH2 + S2S + ingestion
      filter) and reasonably believes their write surface is closed has left an
      anonymously-writable metrics endpoint open — a false sense of security that no UI
      and no config surfaces. (2) Any caller with network reach to the HTTP port can push
      a MetricSetList referencing any ODDRN with any labels under a "fully hardened"
      deployment. (3) Because the gap is not toggleable, an operator cannot remediate
      inside the platform — they must add perimeter controls they may not know they need.
      (4) Combined with the no-audit-log gap (H-008), the unauthorized write leaves no
      platform-side forensic trace.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: |-
    When a deployment sets odd.tenant-id=teamA and runs the DEFAULT INTERNAL_POSTGRES
    backend, its metric writes are scoped/isolated to teamA — a second deployment writing
    teamB metrics into the same platform DB does not see teamA's series and vice versa.
  derivation: |-
    The config key odd.tenant-id + the docs' multi-tenant claim ("serve metric data for
    multiple ODD Platform deployments") promise tenant isolation; an operator on the
    default backend reasonably assumes the option applies to them.
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      Tenant isolation is NONEXISTENT on INTERNAL_POSTGRES. odd.tenant-id is consumed only
      at the extractor layer (CounterTimeSeriesExtractor @Value at bean construction) and
      appended as a Prometheus label on the PROMETHEUS path. The INTERNAL_POSTGRES path
      has NO tenant_id column on metric_series / metric_point (verified at the JOOQ POJO
      level — MetricSeriesPojo / MetricPointPojo declare no tenant field). A deployment
      configured with odd.tenant-id=teamA in INTERNAL_POSTGRES mode does NOT scope its
      writes by tenant at all; all metrics land in one untyped namespace. The live config
      doc lists odd.tenant-id as "Ignored when INTERNAL_POSTGRES" but does not warn that
      this makes the default backend non-multi-tenant.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics.md
        section: security.known_security_gaps
        cite: "InternalIngestionMetricsServiceImpl.java:1-295 (no tenant_id field in any JOOQ POJO) + CounterTimeSeriesExtractor.java:22-25 (PROMETHEUS-side only)"
        note: "tenant mechanism is PROMETHEUS-only; default backend has no isolation"
      - sidecar: odd-platform__java__CounterTimeSeriesExtractor__config-key-consumer__metrics_storage@L20.md
        section: dependencies_semantic.requires-config
        cite: "application.yml:208-210 + AbstractTimeSeriesExtractor.java:22"
        note: "tenant-id is an extractor-layer label, not a storage-layer scope"
    operator_visible_failure: |-
      (1) An operator who chose the default backend and set odd.tenant-id expecting
      multi-tenant separation has NONE — two teams' metrics co-mingle in one Postgres
      namespace, readable by anyone who can query either entity's Metrics tab. (2) The
      config option appears to "work" (no error on boot, no warning) so the
      misconfiguration is silent until a co-tenant's series surface where they should not.
      (3) An operator planning a shared single-instance multi-tenant deployment on the
      default backend has built on a guarantee that does not exist.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |-
    When a caller pushes a MetricSet whose entity ODDRN does NOT correspond to any
    registered data_entity, the platform rejects it (or skips that item with a
    partial-success response) rather than minting storage for a phantom entity.
  derivation: |-
    A user pushing metrics for an entity expects the entity to exist; a catalog that
    accepts metrics for arbitrary unknown ODDRNs pollutes its own namespace.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The controller passes the payload verbatim to the service. The INTERNAL_POSTGRES
      impl calls metricEntityRepository.registerMetricEntityOddrns(request.metricRelatedOddrns())
      which CREATES metric_entity rows BY ODDRN regardless of whether a data_entity row
      with that ODDRN exists. There is no FK from metric_entity.entity_oddrn to
      data_entity.oddrn (MetricEntityPojo is independent). The PROMETHEUS path writes the
      arbitrary ODDRN string as a label. A caller can mint arbitrary metric_entity rows
      (Postgres cardinality DoS) or arbitrary Prometheus series (Prometheus cardinality
      DoS) for phantom ODDRNs, with no existence check and no rate-limit.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics.md
        section: bugs_limitations_corner_cases
        cite: "InternalIngestionMetricsServiceImpl.java:86-88 (registerMetricEntityOddrns — no existence check) + IngestionController.java:90-95"
        note: "metric_entity rows minted by ODDRN with zero validation"
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics.md
        section: security.known_security_gaps
        cite: "InternalIngestionMetricsServiceImpl.java:86-88 — severity MEDIUM (ODDRN-by-payload)"
        note: "combined with unauthenticated reach (H-002) → cardinality DoS surface"
    operator_visible_failure: |-
      (1) The metrics namespace (Postgres metric_entity table, or the operator's Prometheus
      series space) can be flooded with phantom-ODDRN rows by any caller — orphaned data
      no entity will ever read, growing unbounded. (2) On a shared Prometheus this balloons
      storage cost for co-tenants. (3) A typo in a collector's ODDRN config silently
      creates a parallel phantom series rather than erroring — the operator sees "no
      metrics on my entity" with no signal that the writes went to a misspelled ODDRN.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    When an operator leaves odd.tenant-id at its default (declared-but-empty in
    application.yml) OR supplies it as an empty env value (ODD_TENANT_ID=), the
    PROMETHEUS write side and the read side agree on tenant scoping — both treat empty as
    "no tenant label / no tenant filter", so a tenant's reads return exactly that tenant's
    series.
  derivation: |-
    Symmetry expectation: a user reasonably assumes the same config value drives write-side
    labelling and read-side filtering consistently.
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |-
      Symmetric ONLY when the value is null (YAML key declared empty → Spring binds null →
      write side `if (tenantId != null)` skips the label AND read side
      `StringUtils.isNotEmpty(tenantId)` skips the filter — both no-op, consistent). It is
      ASYMMETRIC when the value is an EMPTY STRING (operator supplies ODD_TENANT_ID= via
      env): the write side's `tenantId != null` PASSES for "" and writes a tenant_id=""
      label on every series, but the read side's StringUtils.isNotEmpty("") FAILS and drops
      the filter — so writes are tagged tenant_id="" while reads query across all tenants.
    evidence:
      - sidecar: odd-platform__java__CounterTimeSeriesExtractor__config-key-consumer__metrics_storage@L20.md
        section: bugs_limitations_corner_cases
        cite: "AbstractTimeSeriesExtractor.java:60 (if tenantId != null) + ExternalMetricReader.java:111 (StringUtils.isNotEmpty) + application.yml:210"
        note: "HIGH-severity read/write empty-string asymmetry"
      - sidecar: odd-platform__java__CounterTimeSeriesExtractor__config-key-consumer__metrics_storage@L20.md
        section: docs_link_semantic.doc_drift_findings
        cite: "doc_drift_findings[0] — doc describes empty as read-side-only, does not surface the asymmetry"
        note: "null vs empty-string distinction is the load-bearing trap"
    operator_visible_failure: |-
      (1) On a shared Prometheus, a deployment whose operator set ODD_TENANT_ID= (empty,
      not unset) buries its series under an unfilterable tenant_id="" label that co-tenants
      do not carry, while its OWN reads query across all tenants — so its Metrics tab shows
      co-tenants' series mixed with its own. (2) The null-vs-empty-string distinction is
      invisible: declared-empty in YAML works; env-empty silently breaks isolation. (3)
      The read-side consequence (wrong series on the Metrics tab) cannot be confirmed by
      this reflection because the read UI is not in the chain (see H-000-UI-GAP).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

