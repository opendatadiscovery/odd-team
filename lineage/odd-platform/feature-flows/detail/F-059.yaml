  - uc_id: F-059-UC-001
    hypothesis_id: H-001
    kind: edit-reconcile
    promise: |-
      When an operator renames a lookup table (name normalises to a new physical name),
      ALTER TABLE RENAME fires and the OLD physical relation in lookup_tables_schema no
      longer resolves — but the operator expected a metadata-only rename.
    actor: platform-operator (steward with LOOKUP_TABLE_UPDATE)
    trace: 'LookupTableForm.tsx:84-93 -> ReferenceDataServiceImpl.java:113-122 -> ReferenceDataRepositoryImpl.java:192'
    verdict: contradicted
