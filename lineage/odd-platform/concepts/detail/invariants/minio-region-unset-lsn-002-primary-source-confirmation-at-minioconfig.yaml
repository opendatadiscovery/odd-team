mitigations_unimplemented:
- |-
  Add .region(region) to the MinioAsyncClient builder at MinioConfig.java:19-25
  AND add @Value('${attachment.remote.region}') OR @ConfigurationProperties
  binding for the region field. Without a default, missing region fails
  bean wiring at boot (the disciplined fail-fast posture). With a
  default of 'us-east-1', behaviour matches the SDK default — but
  operators see the explicit annotation in code.
- |-
  @PostConstruct validate() — extend the existing bucket-validation pattern
  at RemoteFileUploadServiceImpl.java:45-50 to ALSO validate region. Pair
  the two: 'bucket can not be empty' + 'region can not be empty'. Both
  are first-class required configuration. The asymmetry between the two
  validations is itself the LSN-002 case-law evidence.
- |-
  Add a startup-time S3 head-bucket check — issue a HEAD on the configured
  bucket at boot; if the region is wrong, the head fails fast with a clear
  error. The current behaviour silently boots and fails at the first user
  action; the fail-fast posture would surface the misconfiguration in
  container logs immediately.
- |-
  Cross-link in MinioConfig.java with a code comment pointing at the
  retrospective: '// LSN-002 — region is intentionally defaulted to
  us-east-1 by the SDK; operators outside us-east-1 must configure
  attachment.remote.region. See retrospectives/LSN-002-minio-region-unset.md'.
  The comment is the minimum acceptable in-code remediation without
  refactoring the bean wiring.
- |-
  NEW batch X: add .httpClient(...) operator-tunable knobs
  (attachment.remote.connect-timeout-millis / .read-timeout-millis /
  .write-timeout-millis). The default 5-minute SDK timeouts on slow-network
  operators with large file sizes produce unrecoverable socket timeouts
  (REFACTOR-034).
- |-
  NEW batch X: add .credentialsProvider(...) support for AWS EKS / ECS /
  IRSA operators preferring IAM roles over static keys. The platform's
  ADR-CANDIDATE-013 stance is MinIO-SDK-only; this support would still
  use the MinIO SDK's Provider interface (StaticProvider | IamAwsProvider |
  etc.) and not introduce AWS SDK v2 dependency.
