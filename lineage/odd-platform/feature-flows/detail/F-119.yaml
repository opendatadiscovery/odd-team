observed_vs_expected:
  facets:
    - drift_class: disabled_mode_bypass_unauthenticated_fingerprint_surface
      description: |-
        Under shipped default `auth.type=DISABLED`, `DisabledAuthSecurityConfiguration`
        wires `.anyExchange().permitAll()` — `/api/appInfo` returns both the
        precise platform version (CVE-scoping) and the auth-mode value to any
        unauthenticated caller. Live docs do not warn about this surface.
      evidence:
        - "application.yml:34 (auth.type=DISABLED shipped default)"
        - "DisabledAuthSecurityConfiguration.java:13-18 (.anyExchange().permitAll())"
        - "AppInfoController.java:18-29 (no @PreAuthorize)"
    - drift_class: appinfo_path_not_in_whitelist_but_open_under_disabled
      description: |-
        `SecurityConstants.WHITELIST_PATHS` lists `/actuator/**`, `/favicon.ico`,
        `/ingestion/**`, `/img/**`, `/api/slack/events` — NOT `/api/appInfo`.
        Under LOGIN_FORM/OAUTH2/LDAP modes the path falls through to
        `.authenticated()` and is gated; under DISABLED it is open. The
        whitelist + the DISABLED mode interact to produce mode-dependent
        exposure with no operator-facing documentation.
      evidence:
        - "SecurityConstants.java:95-96"
    - drift_class: authtype_value_unvalidated_typo_silent_no_chain
      description: |-
        `@Value("${auth.type}")` at AppInfoController.java:18 has NO default
        literal AND NO enum constraint. An operator typo (`OUATH2`,
        `LOGINFORM`) silently produces a deployment with NO matching
        `@ConditionalOnProperty(havingValue=...)` bean AND the UI's
        OwnerAssociation gate (Overview.tsx:26 — `!== 'DISABLED'`) passes
        through, so the UI renders OwnerAssociation in a deployment with
        broken authentication.
      evidence:
        - "AppInfoController.java:18"
        - "Overview.tsx:26 (`appInfo.authType !== 'DISABLED'`)"
    - drift_class: openapi_no_security_element_on_appinfo_operation
      description: |-
        `odd-platform-specification/openapi.yaml:2704-2717` defines `getAppInfo`
        with NO `security:` element on the operation; the generated AppInfoApi
        interface has no `@PreAuthorize`. The spec layer does not encode the
        intentional "open under DISABLED" posture; readers see an endpoint with
        no security marker and may assume it is server-authenticated.
      evidence:
        - "odd-platform-specification/openapi.yaml:2704-2717"
    - drift_class: appinfo_field_shape_is_odd_specific_zero_collision_with_other_products
      description: |-
        The JSON response field name `authType` is ODD-specific (no other product
        ships that exact shape). An attacker scanning a network range receives
        in one GET both ODD-confirmation and version + auth-mode. Combined with
        SHB-177's `/actuator/env` exposure, the fingerprint is dense: deployment
        is confirmed-ODD + version-known + auth-mode-known + configured-credentials
        enumerable.
      evidence:
        - "AppInfoController.java:18-29"
        - "documentation/docs/configuration-and-deployment/enable-security/ — page does not name /api/appInfo"
