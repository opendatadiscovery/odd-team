realism_caveats: |
  The probe pins the failure-UX hypothesis via an ODDRN-collision 400. If
  `modal_visible_after_reject` comes back true, the static reading is wrong —
  re-check whether the DialogWrapper auto-close effect (handleCloseSubmittedForm
  keyed on the isLoaded selector) actually fires on a rejected dispatch: on
  rejection the *creating/updating* status may go to error rather than loaded,
  in which case the modal stays open BUT still shows no inline error. Either
  outcome (modal closes, or modal stays but blank) is a UX finding worth a
  backlog item; the probe distinguishes which. The probe does not assert toast
  TEXT (server error messages vary); it asserts only that an error-styled toast
  appeared.
