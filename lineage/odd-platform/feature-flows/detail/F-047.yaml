  notes: |-
    UI-tier confirmation of F-047 per ui-review-2026-05-26 slice K. The
    per-column edit panel previously marked `ui_unverified: true` is now
    component-tier resolved — 15 UI components compose the surface; each
    field-annotation drift facet maps to a specific UI dispatch site. The
    review surfaces SIX novel UI-tier drift facets that strengthen the
    existing backend findings + add UI-only concerns:

    (1) **`DatasetFieldDescription` renders Markdown through the shared
    `<Markdown value={...} />` component (DatasetFieldDescriptionPreview.tsx:14)
    → MDEditor.Markdown WITHOUT rehype-sanitize** (Markdown.tsx:113-124). The
    `description_verbatim_storage_no_sanitization_xss_class_at_per_column_surface`
    backend facet is REAFFIRMED at the UI render path — verbatim DB content
    flows directly into MDEditor.Markdown's `source` prop. Markdown.tsx has
    NO `rehypePlugins: [rehypeSanitize]` configuration. The per-column
    description is the SAME render pipeline as F-004's per-entity description.
    STRENGTHENS existing facet:
    `description_verbatim_storage_no_sanitization_xss_class_at_per_column_surface`.
    NOT a new facet — the UI confirms the existing one. (Severity HIGH — UI
    confirms storage-side XSS class flows to render unmodified.)

    (2) **NEW UI-TIER DRIFT FACET — `TagsEditForm` resets ALL existing tags
    on save, never sends a diff** (TagsEditForm.tsx:52-63). The submit
    handler emits `compact([...data.tagNames.map(tag => tag.name)])` —
    the FULL set of tags currently in the form state. The backend's
    `updateDatasetFieldTags` (already documented as
    `update_dataset_field_tags_delete_all_then_recreate_not_diff`) is
    therefore matched by a UI-side full-set submission shape. UI MIRRORS
    the bug: the form does NOT compute a diff, does NOT preserve external
    tags that were never modifiable in the dialog, and the dialog title
    "Edit Tags" obscures that pressing Save with zero rows clears every
    INTERNAL tag. STRENGTHENS existing facet:
    `update_dataset_field_tags_delete_all_then_recreate_not_diff`.
    NEW UI-tier drift facet candidate:
    `tags_edit_form_replace_semantics_no_confirmation_dialog_silently_clears_all_tags_on_empty_save`.
    (Severity HIGH — same data-loss class with NO confirmation guard.)

    (3) **NEW UI-TIER DRIFT FACET — `DatasetFieldEnumsForm` BULK-REPLACE
    confirms backend create-named-bulk-replace** (DatasetFieldEnumsForm.tsx:90-105).
    The submit handler sends ALL items (those WITH `id` AND those WITHOUT)
    in a single `bulkEnumValueFormData.items[]` array. Backend's
    `EnumValueServiceImpl` BULK-REPLACE branch then soft-deletes any
    existing items whose id is not in the submitted list. The UI form
    PRE-POPULATES with existing items via `defaultValues` (lines 45-60) so
    a normal Edit cycle re-submits them; but if the operator removes a
    row via `handleRemove`/"Delete" button (line 111-116) and presses Save,
    the omitted item is silently soft-deleted server-side — the UI does
    NOT confirm "this will delete N enum values" nor surface deleted-rows
    count. STRENGTHENS existing facet:
    `create_enum_value_named_create_implemented_bulk_replace`. NEW UI-tier
    drift facet candidate:
    `enums_form_remove_row_silently_soft_deletes_no_confirmation`.
    (Severity MEDIUM — same data-loss class, no UI guard.)

    (4) **NEW UI-TIER DRIFT FACET — `DatasetFieldDescription` Add/Edit
    button is gated by `Permission.DATASET_FIELD_DESCRIPTION_UPDATE` —
    correct permission name** (DatasetFieldDescription.tsx:66). NO drift
    against the backend `DATASET_FIELD_DESCRIPTION_UPDATE` SecurityRule.
    However, `DatasetFieldTags` uses `Permission.DATASET_FIELD_TAGS_UPDATE`
    (line 41) and `DatasetFieldOverviewEnums` uses
    `Permission.DATASET_FIELD_ENUMS_UPDATE` (line 79) — both match the
    documented permissions page. CONTRAST with the SecurityConstants
    wiring bugs (term-endpoint gated by DATA_ENTITY_ADD_TERM at server
    line 299, alert-status gated by DATASET_FIELD_ADD_TERM at 295-296):
    the UI uses the DOCUMENTED permission names while the server WIRES
    DIFFERENT names, so a Policy admin granting `DATASET_FIELD_ADD_TERM`
    sees the UI button DISABLED (UI uses `DATASET_FIELD_ADD_TERM` for the
    Add term button at DatasetFieldTerms.tsx:77 — which the SERVER ALSO
    requires for the term endpoint per the actual wired permission… but
    the SecurityConstants.java:299 wiring says the *POST endpoint* gates
    on `DATA_ENTITY_ADD_TERM`). The UI/server mismatch on TERM endpoint
    means: granting the documented `DATASET_FIELD_ADD_TERM` enables the
    UI button BUT the server requires `DATA_ENTITY_ADD_TERM`; pressing
    the button → 403. STRENGTHENS existing facet:
    `security_constants_wiring_bug_term_endpoint_gated_by_data_entity_permission`.
    NEW UI-tier facet:
    `ui_button_enabled_under_dataset_field_add_term_server_403s_on_data_entity_add_term_mismatch_silent_403`.
    (Severity HIGH — confused operator: UI says "you can"; server says 403.)

    (5) **NEW UI-TIER DRIFT FACET — `TermItem` delete handler chains a
    .catch() with EMPTY body** (TermItem.tsx:37-45). The
    `deleteTerm({ datasetFieldId, termId }).then(...).catch()` empty catch
    swallows the 204 No Content "success" (per backend's
    `delete_term_from_dataset_field_filters_description_link_isfalse_survives`
    finding) AND any actual error. Operator clicks Delete on a term linked
    via description marker → server returns 204 → UI optimistically removes
    the row → next reload the term is STILL there (description-link
    survived). UI has NO toast, NO re-fetch, NO error display. STRENGTHENS
    existing facet:
    `delete_term_from_dataset_field_filters_description_link_isfalse_survives`.
    NEW UI-tier facet:
    `term_item_delete_empty_catch_no_refetch_description_link_term_reappears_on_next_view`.
    (Severity MEDIUM — operator-visible "ghost term" UX bug.)

    (6) **NEW UI-TIER DRIFT FACET — `DatasetFieldOverviewEnums`
    `useEffect` re-dispatches `fetchDataSetFieldEnum` on every selected-field
