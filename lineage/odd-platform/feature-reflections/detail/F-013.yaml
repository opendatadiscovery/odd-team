- id: H-013
  hypothesis: "Two concurrent operators (or a UI submit racing an ingestion run) creating the same novel field name resolve to a single field — the platform does not error or duplicate under concurrency."
  derivation: "Negative-space: a get-or-create UX implies the platform handles the concurrent-first-create race gracefully; an operator should not see a raw constraint error from a normal double-click."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      getOrCreateMetadataFields is a TOCTOU read-then-write: listByKey (READ, sees 'doesn't exist'), then bulkCreate (WRITE). The UI tier's bulkCreate has NO ON CONFLICT clause, so two concurrent creates of the same novel (name, type) both pass the existence check, both call bulkCreate; one INSERT succeeds, the other surfaces as UniqueConstraintException('Internal metadata with this name already exists') via IX_UNIQUE_INTERNAL_NAME. The window is real per the sidecar; whether a normal UI double-click is fast enough to hit it, and what the user sees (raw 500/409 toast?), requires running the system. The ingestion path tolerates the race (ingestData uses ON CONFLICT DO UPDATE), so the two paths behave differently under concurrency.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveMetadataFieldRepositoryImpl
        section: invariants ("TOCTOU race window in getOrCreateMetadataFields")
        cite: "MetadataFieldServiceImpl.java:42-59 (listByKey then bulkCreate) + ExceptionUtils.java:63-65 (UniqueConstraintException)"
        note: "UI-tier create not race-protected; ingestion-tier is (ON CONFLICT)"
    operator_visible_failure: |
      Under a concurrent first-create of the same field name, one operator gets a UniqueConstraintException error toast on what should be a normal save — a confusing failure for a name that (from the read side) didn't exist a moment ago. The severity depends on whether the window is reachable from realistic UI interactions; this needs a local concurrency probe to confirm and to capture the exact user-facing error.
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-013-1
    routes_to_finding: validation-gap
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: probe

