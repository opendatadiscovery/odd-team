notes: |-
  This invariant captures the FIRST end-to-end 5-vertex triangulation
  of the DataSource architectural picture. Previous batches established
  the WHAT and WHERE of the disjunction (batches P + R + S); batch W
  added the COUNTERFACTUAL vertex via the UI admin controller AND the
  explicit framing of the architectural intent (collector-as-tenant
  vs operator-as-admin).

  STRENGTHENED batch 2026-05-21ZB — the 5 DataSourceController method
  sidecars close vertex 4+5 at method-scoped primary source, deepening
  the batch-W class-node finding endpoint by endpoint. The method-level
  reading of the OpenAPI spec corrects the class node's stale
  "connectionUrl" FormData example: the create FormData has exactly 4
  fields, the update FormData exactly 3, and the connection_url column
  is gone (V0_0_71). The REPLACE mechanism is now named (MapStruct
  SET_TO_NULL via MapperConfig). Two file-local hazards spun out into
  dedicated invariants this batch — datasource-update-replace-not-merge-mapstruct-set-to-null
  and datasource-delete-incomplete-cleanup-orphan-token-uncleared-fts.

  The picture's load-bearing observations:
    (a) The two paths mutate the SAME data_source row but apply
        DIFFERENT merge semantics — silent overwrite class.
    (b) The architectural disjunction is DELIBERATE (different service
        classes, different mappers, different field-set narrowing) —
        the asymmetry is not accidental.
    (c) The disjunction has consequences operators don't know about
        — undocumented on every relevant doc page.
    (d) The disjunction extends to FOUR cross-cutting concerns: status
        codes, permissions, audit, transactionality.

  Cross-cutting connections:
    - STRENGTHENS the existing master upsert-by-oddrn-partial-merge-collector-driven-only-name-description
      (the S2S half of the asymmetry); this invariant adds the UI
      half + the architectural framing
    - STRENGTHENS the existing master namespace-inherited-from-collector-not-payload-collector-scoped-tenancy
      (the S2S half); this invariant adds the UI counterpart
    - STRENGTHENS the existing master openapi-200-vs-201-status-code-drift
      (DataSource is a 7th controller exhibiting the same drift)
    - STRENGTHENS the existing master namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths
      (DataSource is a 5th sister service with getOrCreate side-door)
    - STRENGTHENS the existing master read-collaborative-cross-owner-enumeration
      (DataSourceController.getDataSourceList joins the catalogue
      of 29+ surfaces with no SecurityRule)
    - STRENGTHENS the existing master audit-log-presence-asymmetry-2-tier-audit-story
      (data_source mutations are Tier-2 unaudited on BOTH paths)
    - Pairs with collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
      (the regenerateDataSourceToken endpoint surfaces the SAME
      plaintext-everywhere pattern as regenerateCollectorToken — the
      DataSource token IS A COLLECTOR TOKEN per the schema)
    - Pairs with datasource-update-replace-not-merge-mapstruct-set-to-null
      + datasource-delete-incomplete-cleanup-orphan-token-uncleared-fts
      (the two file-local hazard invariants spun out THIS BATCH)
    - Pairs with the 5 UI-admin DataSource operation concepts:
      list-data-sources-ui-admin-paginated-read, register-data-source,
      update-data-source-ui-admin-replace,
      delete-data-source-ui-admin-guarded-soft-delete,
      regenerate-data-source-token

