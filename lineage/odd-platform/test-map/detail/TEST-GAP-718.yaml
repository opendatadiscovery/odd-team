proposed_action: |-
  Add a `TermControllerLinkageSecurityTest` (or fold into a broader `TermControllerSecurityTest`) extending `@SpringBootTest(webEnvironment=RANDOM_PORT)` or `@WebFluxTest(TermController.class)`. Three test methods minimum:
  1. `termToTermLinkage_anyAuthenticatedUser_canLinkRegardlessOfPermissions` — authenticate as a user holding NONE of the seven `TERM_*` permissions; assert that POST `/api/terms/100/term` with body `{linkedTermId: 200}` returns 200 (the current contract) — failing this test would mean a future maintainer added a SecurityRule, which should be loud rather than silent. Pair with a code comment that explicitly DOCUMENTS the design intent (or, if undesigned, propose a SecurityRule in the same PR).
  2. `termToTermLinkage_anyAuthenticatedUser_canUnlinkRegardlessOfPermissions` — same posture on the DELETE half.
  3. `termToTermLinkage_underAuthDisabled_anonymousUserCanLinkAndUnlink` — pin the `DISABLED` auth-mode behaviour. Combined with TEST-GAP-708 (AppInfo DISABLED-mode fingerprint) and TEST-GAP-148-ish family (auth-mode regression-pinning), this completes the DISABLED-mode posture across the P-06 surface.

  Triangulate with a documentation fix: either update `data-glossary/business-glossary.md` to EXPLICITLY state that `TERM_UPDATE` does NOT gate term-to-term linkage (current ground truth), OR fix `SecurityConstants.java` to add the missing rules AND change these tests to assert 403. The current state — docs claim a gate the code lacks — is the cliff.
