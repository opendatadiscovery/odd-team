      assert the same hidden-from-search entity surfaces in GET /api/dataentities/my,

      GET /api/dataentities/{deg-id}/children (DEG-experiment-runs path), and the

      detail GET — proposed slice-N: local probe-stack with 1 hidden entity + 6 GETs.'
  - facet: UI realisation — Popular surface lives inside OwnerEntitiesList, not a standalone strip (batch J)
    observed: |-
      There is NO dedicated `PopularStrip.tsx` component in the codebase as of
      ede5d277. The substrate's logical node "PopularStrip" maps to the FOURTH
      column inside `OwnerEntitiesList.tsx` (OwnerEntitiesList.tsx:99-105) —
      one of four `DataEntityList` columns under the "Recommended" h1 heading,
      alongside "My Objects" / "Upstream dependents" / "Downstream dependents".
      The same `<DataEntityList>` component renders all four columns; the
      Popular column has NO column-specific behaviour (sidecar implicit_adrs[2]:
      "Single DataEntityList component for all four columns — the Popular column
      has NO column-specific behaviour, by design"). No per-column refetch
      button, no per-column filter, no per-column sort, no per-column count,
      no per-column 'view more' link. Hardening Popular (e.g. pagination for
      inflation-resistance) requires hardening all four together OR splitting
      the component. PRIMARY-SOURCE CONFIRMED batch J via PopularStrip sidecar
      understanding + concepts + implicit_adrs[2].
    expected: documented behaviour — operator reading the docs should know the
      Popular surface is a column inside OwnerEntitiesList (not a dedicated
      strip) AND understand it's structurally symmetric with the 3 sibling
      columns
    drift_class: ui_realisation_inside_owner_entities_list
    provenance: STATIC — primary-source verification at
      OwnerEntitiesList.tsx:99-105 + PopularStrip sidecar understanding.
      NEW DOC-GAP candidate for doc-gap-finder reducer.
  - facet: Popular click-target navigates to Overview, doc says Structure (batch J)
    observed: |-
      Live doc (`https://docs.opendatadiscovery.org/features/data-discovery/catalog-overview`,
      WebFetched 2026-05-19 status 200) states "Clicking a tile opens that
      entity's **Structure** page" (also at local docs `catalog-overview.md:54`).
      Code at DataEntityList.tsx:38 calls `dataEntityDetailsPath(item.id)`
      which defaults to `path='overview'` per dataEntitiesRoutes.ts:66-73 —
      Popular tile click lands on the entity's Overview tab, NOT Structure.
      THIS IS CONSEQUENTIAL FOR THE F-001 LOOP: the Overview tab fires
      `fetchDataEntityDetails` → backend +1 view_count; whether the Structure
      tab also fires the increment is a separate question (different SPA
      route at /dataentities/{id}/structure). If docs are correct and code
      changes the default to Structure, the F-001 inflation loop's UI
      closure would break (Popular click would no longer trigger view_count
      increment via Overview-tab read-as-write). Direct doc-vs-code drift,
      file:line anchored on both sides. PRIMARY-SOURCE CONFIRMED batch J.
    expected: docs and code agree — most likely the docs need updating
      to "Overview tab" since the F-001 inflation-loop closure is the
      design behaviour
    drift_class: spec_says_X_impl_does_Y
    provenance: STATIC — primary-source verification at DataEntityList.tsx:38
