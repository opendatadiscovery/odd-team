notes: |-
  New concept captured in batch 2026-05-19J. The term-mention syntax is a
  platform-specific contract that operators learn about only from a tooltip.
  Recommended canonicalisation: document the syntax + its precedence rules + the
  auto-create side effect in:
    (a) /features/data-glossary — the pillar that owns Term entities; describe
        how mentions auto-link from descriptions
    (b) /features/data-discovery — the pillar that owns Description editing;
        describe how to use [[ns:term]] mentions to wire terms inline
    (c) /developer-guides/api-reference/glossary — the API surface for term
        resolution endpoints used by the UI parser

  Also surface the UI-vs-backend regex asymmetry as a backlog item: either tighten
  the backend regex to match UI's character-class allowlist, or loosen the UI
  regex to match backend's non-greedy permissiveness — pick one to eliminate
  the latent inconsistency.
