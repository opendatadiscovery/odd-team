name: view_count UPDATE→READ loop closed; trivially inflatable; no anti-abuse signal
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
- P-09
description: |-
  Producer half: getDataEntityDetails increments data_entity.view_count on every
  read (ReactiveDataEntityRepositoryImpl.java:173-180; no rate-limit, no idempotency
  key, no client-id-based debouncing). Consumer half: listPopular ranks exclusively
  by view_count DESC (ReactiveDataEntityRepositoryImpl.java:633, sole orderBy; id
  DESC tiebreaker only). Neither endpoint carries an authorization gate beyond
  .authenticated() (UNGATED under LOGIN_FORM/OAUTH2/LDAP; ANONYMOUS under DISABLED).
  No anti-abuse signal exists anywhere in the chain: no IP throttling, no
  signed-request, no sampling, no time-decay, no per-user view-count cap. A scripted
  loop of N calls to GET /api/dataentities/{id} pushes entity {id} to the top of
  GET /api/dataentities/popular. Under DISABLED the attacker need not authenticate.
  No index on data_entity.view_count — every Popular page render is a sequential
  scan + in-memory sort. REFACTOR-201 confirmed from primary source (the closure
  of the loop). **Batch H** — SQL primary-source triangulated: incrementViewCount
  (lines 173-180) is bare `UPDATE data_entity SET view_count = view_count + 1 WHERE
  id = ?` with no rate-limiting layer; listPopular ORDER BY VIEW_COUNT.sort(DESC)
  is the SOLE order signal at line 633. **Batch J — UI HALF CONFIRMED END-TO-END**:
  the F-001 loop is now empirically pinned at the UI layer with two ADDITIONAL
  amplifications:
    (1) **LSN-017 DOUBLING** — DataEntityDetails.tsx:56-64 useEffect dep-array
        contains `details.status?.status` which is itself populated by the fetch's
        fulfilled action; first render fetches (status undefined → real value),
        second render re-fires (status value unchanged), net: **TWO `GET
        /api/dataentities/{id}` calls per page-open = TWO `view_count + 1` UPDATEs**.
        Empirically pinned by probe P-004 (xhr_count=2 + DB delta=2; regex-filtered
        exact path match).
    (2) **F-001 UI LOOP CLOSURE** — PopularStrip (rendered as one of four columns
        in OwnerEntitiesList) is the surface that DISPLAYS the inflatable ranking
        AND triggers view_count increments on click: every click on a Popular
        tile navigates to /dataentities/{id}/overview which mounts DataEntityDetails
        which fires fetchDataEntityDetails which increments view_count. The UI
        does NOT break this loop with any client-side debouncing, idempotency key,
        per-tab-per-entity 'already-counted-this-session' guard, or analytics-only
        mode. **Combined with LSN-017**: every Popular-tile click = +2 view_count.
  Under DISABLED auth the API loop is reachable anonymously (but the UI Recommended
  panel is hidden by Overview.tsx gate — so home-page UI-driven inflation is
  closed for DISABLED, while API-driven inflation is open). Under
  LOGIN_FORM/OAUTH2/LDAP both UI and API loops are open. The 2x amplification
  baseline is empirically pinned, not inferred.
