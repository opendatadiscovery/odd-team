behaviour: |-
  **HIGH — Generic webhook sends with NO `Content-Type` header.** The `HttpRequest` construction at `WebhookNotificationSender.java:20-22` calls only `.uri(...)`, `.POST(BodyPublishers.ofString(...))`, `.build()` — no `.header("Content-Type", "application/json")`. The JDK `HttpClient` does NOT set a default `Content-Type` for `BodyPublishers.ofString(...)` unless the caller does explicitly.

  **Receiver-side impact**:
  - **Discord webhook receivers** strictly require `Content-Type: application/json` — reject with `400 Bad Request` otherwise.
  - **Many corporate WAFs** (e.g. AWS WAF default rule set, Cloudflare's OWASP rule set) reject POSTs without `Content-Type` as anomalous.
  - **Microsoft Teams webhook receivers** require `Content-Type: application/json` per their connector documentation.
  - **Custom incident-management webhook receivers** (PagerDuty Events API v2, OpsGenie Webhook integration) require explicit Content-Type.

  **Result chain**:
  1. Operator configures `notifications.receivers.webhook.url` pointing at e.g. a Discord webhook URL.
  2. ODD fires an alert.
  3. The receiver rejects with 415 Unsupported Media Type OR 400 Bad Request.
  4. `AbstractNotificationSender.sendAndValidate` raises `NotificationSenderException` because the status is not 200.
  5. Operator sees `log.error("Notification sender Generic webhook: Notification sender response didn't complete with 200 status code")` — generic, no body / status / header info.
  6. Operator (correctly) assumes their webhook URL is wrong, spends hours debugging.

  **Promoted to HIGH (not MEDIUM as the sidecar rates)** because:
  - The fix is **one line** (`.header("Content-Type", "application/json")` between lines 21 and 22).
  - The cost of NOT fixing is operator-onboarding friction — the most popular generic webhook receivers (Discord, Teams) silently fail.
  - The live doc is SILENT on this — operators cannot diagnose from documentation alone.
  - Combined with TEST-GAP-799 (no signature) + TEST-GAP-801 (200-only accept), the webhook channel feels broken to anyone evaluating it against incumbent alternatives.

  **Test gap shape**: regression-pin asserting the outbound POST has NO `Content-Type` header. PINS the current state; pairs with REFACTOR-NNN adding the one-line fix.
