  - 'FeatureController.md:implicit_adrs.[0,1] — boot-resolved-immutable + intentionally-narrow-enum'
evidence:
  - FeatureController.md:concepts.entities
  - FeatureController.md:concepts.invariants.[2] (boot snapshot)
  - FeatureController.md:bugs_limitations_corner_cases.[0,1] (DISABLED reachability + runtime-mutation-ignored)
notes: |-
  Distinct from operator-facing-only boolean toggles like
  housekeeping.enabled, genai.enabled, auth.s2s.enabled — those
  gate backend wiring but do not surface UI controls. The
  active-feature-flag concept is the bridge between deployment-time
  config and UI affordance gating.
