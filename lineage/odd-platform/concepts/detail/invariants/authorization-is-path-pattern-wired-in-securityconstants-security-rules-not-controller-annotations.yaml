name: Authorization is path-pattern wired in SecurityConstants.SECURITY_RULES, not
  controller annotations
canonical_in_docs: false
canonical_candidate: true
description: 'Repository-wide ADR: no controller carries `@PreAuthorize` / `@Secured`
  / programmatic permission calls. Authorization is enforced externally via `SecurityConstants.SECURITY_RULES`
  — a list of `(AuthorizationManagerType, PathPatternParserServerWebExchangeMatcher,
  PolicyPermissionDto)` triples consumed by `AuthorizationCustomizer`. **CRITICAL
  precondition** (verified batch 2026-05-12C): the AuthorizationCustomizer is wired
  ONLY by `OAuthSecurityConfiguration.java:98` and `LDAPSecurityConfiguration.java:145`
  — `LoginFormSecurityConfiguration.java:55-57` does NOT wire it (only `.pathMatchers("/**").authenticated()`),
  and `DisabledAuthSecurityConfiguration.java:13-18` is permit-all. Under LOGIN_FORM
  or DISABLED the entire SECURITY_RULES table is INERT — every per-rule manager(...)
  call is silently absent. Trade-off: centralised matrix view vs path-string coupling
  that breaks silently when paths drift (the `/term` vs `/terms` mismatch documented
  under DataEntityController is the canonical failure mode) PLUS auth-mode coupling
  that breaks silently when LOGIN_FORM is picked. Reinforced by method-level sidecars:
  regenerateCollectorToken (gated via SECURITY_RULES at line 135-137), getAllAlerts
  (NOT in SECURITY_RULES — fall-through to authenticated()), uploadFileChunk (gated
  via path-glob matching but with cross-entity-hijack failure mode), postMessageInSlack
  (NOT in SECURITY_RULES — fall-through ungated), getActivity (NOT in SECURITY_RULES
  — fall-through ungated). The LDAP `containsIgnoreCase` admin-match (substring-collision
  admin escalation) is a SECOND structural failure mode of path-pattern + name-based
  authorization. **Batch E reinforcement on the RBAC primary surface**: RoleController.createRole
  + PolicyController.createPolicy + OwnerController.createOwner are textbook examples
  of the pattern WORKING — each gated NO_CONTEXT against a Permission (ROLE_CREATE
  / POLICY_CREATE / OWNER_CREATE) wired in SECURITY_RULES with no controller-level
  annotations. PermissionController.getResourcePermissions is the deliberate read-side
  INTENTIONAL absence — the read endpoint reveals only the caller''s own resolved
  permissions and is therefore intentionally left out of SECURITY_RULES. SearchController.search
  is a third read-collaborative fall-through (no SECURITY_RULES entry) that also exhibits
  the cross-owner-enumeration failure mode.'
