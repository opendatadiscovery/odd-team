cross_pillar_relationships:
- pillar_id: P-10
  kind: feeds
  via: |-
    Data Source Lifecycle is the operator-facing credential + registration
    surface for the Integrations & Ingestion pillar. A data source registered
    here mints a 40-char ingestion token (registerDataSource) that the Push /
    Collector client later presents on POST /ingestion/entities — validated
    by IngestionDataEntitiesFilter (opt-in, default-off per
    application.yml). regenerateDataSourceToken rotates that same credential.
    The UI-admin registration path (POST /api/datasources) is DISJOINT from
    the S2S collector-driven path (POST /ingestion/datasources via
    IngestionController.createDataSourceEntity) — same data_source table,
    separate auth model (RBAC DATA_SOURCE_CREATE + UI session vs collector
    token), separate service class, separate merge semantics. Cross-link to
    F-008 (Batch Ingestion) which owns the S2S half + the
    ADR-CANDIDATE-142 / ADR-CANDIDATE-143 UI-vs-S2S asymmetry.
- pillar_id: P-09
  kind: shares_data_with
  via: |-
    The four mutating endpoints are gated by DATA_SOURCE_CREATE /
    DATA_SOURCE_UPDATE / DATA_SOURCE_DELETE / DATA_SOURCE_TOKEN_REGENERATE
    (all MANAGEMENT-tier permissions, declared in
    SecurityConstants.SECURITY_RULES lines 116-126). The list read
    (GET /api/datasources) has NO SecurityRule — read-collaborative posture
    (REFACTOR-024 family). Under auth.type=DISABLED every endpoint including
    the four destructive verbs is anonymously reachable (REFACTOR-185
    cluster). registerDataSource opens a permission side-door — the
    namespace_name field reaches namespaceService.getOrCreate, minting a
    namespace under DATA_SOURCE_CREATE without NAMESPACE_CREATE. Cross-link
    to F-006 (RBAC) for the central gate.
- pillar_id: P-08
  kind: shares_data_with
  via: |-
    Fourth sibling P-08 Management UI-admin lifecycle surface alongside
    F-019 (Owner Lifecycle), F-020 (Collector Lifecycle), F-028 (Namespace
    Lifecycle). All four share the thin-OpenAPI-delegate controller pattern,
    the MapStruct full-form-REPLACE update semantic, the 200-not-201 status
    drift, the audit-silence pattern, the DISABLED-mode bypass, and the
    no-rate-limit posture. The system-mission.md P-08 sub-feature seed names
    "Datasources tab (audit, edit, link Collector + Namespace)" as a
    distinct sub-feature — this anchors F-031 within the pillar. Per
    management.md daily-ops sequence, the Datasources tab is the
    most-frequently-used Management surface.
- pillar_id: P-01
  kind: feeds
  via: |-
    A registered data source is the parent of every data_entity ingested
    under it; the data_source FTS vector feeds catalog Search and the
    Directory drill-down. updateDataSource refreshes that FTS vector;
    deleteDataSource does NOT clear it (drift facet
    delete_does_not_clear_fts_vector). Cross-link to F-023 (Directory
    Browsing) which READS the same data_source rows via
    /api/directory/datasources — a different surface from this feature's
    /api/datasources UI-admin CRUD.
