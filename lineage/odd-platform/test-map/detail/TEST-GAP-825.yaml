evidence:
  - "ingestMetrics.md says (bugs_limitations_corner_cases.[1]): 'No payload-side validation that the oddrn in each MetricSet belongs to a registered data entity. The controller passes the payload verbatim to IngestionMetricsService.ingestMetrics(...); the INTERNAL_POSTGRES implementation calls metricEntityRepository.registerMetricEntityOddrns(request.metricRelatedOddrns()) which creates metric_entity rows BY ODDRN regardless of whether a data_entity row with that ODDRN exists. The PROMETHEUS implementation writes labels with whatever ODDRN string the caller supplied. Net effect: a caller can mint arbitrary metric_entity rows / arbitrary Prometheus series for non-existent ODDRNs.' (severity MEDIUM)"
  - "ingestMetrics.md says (security.known_security_gaps.[1]): 'ODDRN-by-payload attack: a caller writes MetricSet.oddrn = '//literal:any-string' in the payload; the implementation creates a metric_entity row for that ODDRN with zero validation against data_entity.oddrn referential integrity. On the PROMETHEUS path the same ODDRN string becomes a Prometheus label value. An attacker can mint thousands of fake-ODDRN metric_entity rows (Postgres-side cardinality DoS) or thousands of fake-ODDRN Prometheus series (Prometheus-side cardinality DoS) before any rate-limit catches them.' (severity MEDIUM)"
  - "ingestMetrics.md says (bugs_limitations_corner_cases.[5]): 'No rate-limit at the controller layer. A misbehaving collector POSTing 100,000 metric series per second forces the platform to: (a) buffer each 20 MB body in heap before deserialising, (b) run each through @ReactiveTransactional against Postgres ...' (severity MEDIUM)"
  - "Verified at primary source: IngestionController.java:89-95 (no rate-limit) + InternalIngestionMetricsServiceImpl.java:86-88 (registerMetricEntityOddrns — no existence check) + ExternalIngestionMetricsServiceImpl.java:202-220 (PROMETHEUS verbatim-label-write)"
