behaviour: |-
  **DISABLED-mode + scroll-elevation rendering edge-case gap.** AppToolbar is unconditionally mounted by App.tsx:56 across all 4 auth modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP). Two specific edge cases are uncovered:
  (a) **DISABLED-mode rendering**: when `auth.type=DISABLED` and the backend's `whoami` returns a synthetic identity with no provider context, the toolbar renders the same component shell with `owner?.name ?? identity?.username` evaluating to whatever the AuthIdentityProvider yields (potentially the default `anonymous` string or `null`). The Logout button is still rendered but `GET /logout` falls through to no handler (per bugs_limitations_corner_cases.[3] — DisabledAuthSecurityConfiguration.java:14-17 registers no `.logout(...)` configuration; the chain only does `.csrf().disable()` + `.authorizeExchange().anyExchange().permitAll()`). Clicking Logout in DISABLED mode hits an endpoint with no logout handler → likely returns 404 or the SPA's static index. No test exercises this path.
  (b) **Scroll-triggered elevation**: `AppToolbar.tsx:40-44` uses `useScrollTrigger({ disableHysteresis: true, threshold: 10 })` to toggle a visual elevation state via `useEffect` at line 46. The trigger boolean flips at the 10px scroll threshold; re-renders are bounded. No test asserts (a) elevation transitions from 0 to elevated when the trigger flips; (b) the threshold of 10px is preserved (regression-pin against accidental changes); (c) under DISABLED-mode + Logout-click, the navigation hits the broken `/logout` endpoint (the asymmetry pin — operator UX under DISABLED is documented but unverified).
