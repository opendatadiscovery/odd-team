name: F-006 audit-silence is SCHEMA-ROOTED — activity.data_entity_id NOT NULL FK
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-09
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20R — SCHEMA-LAYER ROOT
  CAUSE for the F-006 audit-silence pattern** — surfaced by the
  ReactiveActivityRepositoryImpl batch-R sidecar's primary-source
  inspection of the V0_0_48__add_activity.sql migration. The platform's
  audit silence on RBAC mutations (Role / Policy / Owner CRUD,
  Datasource registrations, Collector token rotations) is NOT a
  missing-annotation gap — it is a SCHEMA-LEVEL IMPOSSIBILITY. The
  `activity.data_entity_id` column is declared `bigint NOT NULL` at
  `V0_0_48__add_activity.sql:4` with an explicit FK constraint
  `activity_data_entity_id_fk FOREIGN KEY (data_entity_id) REFERENCES
  data_entity(id)` at `V0_0_48__add_activity.sql:12`. Combined with
  the INNER JOIN to DATA_ENTITY at ReactiveActivityRepositoryImpl.java:219
  (every read path requires the FK target to exist), the audit table
  STRUCTURALLY CANNOT store an event that does not reference a data
  entity.

  **The 7-sidecar audit-silence pattern (F-006) is now SCHEMA-CONFIRMED**:
  RBAC mutations (Role.create / Role.update / Role.delete /
  Policy.create / Policy.update / Policy.delete / Owner.create /
  Owner.update / Owner.delete / role-to-owner attach / policy-to-role
  attach / user_owner_mapping changes), Datasource registrations
  (`POST /ingestion/datasources` → DataSourceIngestionServiceImpl),
  and Collector token rotations (CollectorServiceImpl.regenerateToken)
  HAVE NO `data_entity_id` to bind. They CANNOT emit to the activity
  table even if a future `@ActivityLog` annotation were retrofitted
  onto OwnerServiceImpl.create / RoleServiceImpl.create /
  PolicyServiceImpl.create / etc. The activity table is structurally
  a "data-entity audit log", not a "platform audit log".

  **The schema author's intent is explicit**: the FK constraint name
  `activity_data_entity_id_fk` (verbose, schema-evolution-aware
  naming) and the deliberate choice of NOT NULL over the alternative
  `data_entity_id bigint NULL` together encode the commitment to
  data-entity-scoped audit. The schema author chose NOT to leave the
  door open for non-data-entity events.

  **Cross-pillar consequence — refinement to F-006 INTERPRETATION**:
  the F-006 "no-audit-log on RBAC mutations" finding (7-sidecar pattern
  across UI + controllers + services + repositories) was previously
  framed as a hygiene gap closable by adding `@ActivityLog` annotations
  + extending ActivityEventType enum. The batch-R schema confirmation
  refines this: adding `@ActivityLog` annotations is INSUFFICIENT —
  any audit-table extension to RBAC must EITHER (a) make
  `activity.data_entity_id` NULLABLE + add a discriminator column
  (`activity.event_scope: DATA_ENTITY|RBAC|DATASOURCE|COLLECTOR`); OR
  (b) create a separate audit surface (e.g. `rbac_audit` table) with
  its own FK shape. Option (a) breaks every existing read path's INNER
  JOIN assumption; Option (b) means TWO audit surfaces and the
  operator-facing Activity Feed UI needs to merge them.

  **The structural enforcement is also a SAFETY mechanism** — it
  prevents the audit table from accidentally storing orphaned events
  (events referencing deleted or never-created data entities). The
  trade-off chosen at V0_0_48 was strong-typing the FK at the cost of
  RBAC audit coverage. The decision is undocumented at the operator-
  facing docs layer — operators reading the Activity Feed page see
  "every platform change is audited" implicit framing, while the
  schema enforces the opposite.

  **Companion finding (cascade-delete dependence)**: the FK has no
  `ON DELETE` clause specified in V0_0_48, so Postgres defaults to
  `NO ACTION`. If a DataEntityHousekeepingJob ever cascade-deletes
  data_entity rows past TTL (per F-010 housekeeping), the activity
  rows referencing those data entities would either (i) block the
  delete (NO ACTION default; housekeeping fails silently) OR
  (ii) cascade-delete if a future migration adds `ON DELETE CASCADE`
  (the audit trail explaining WHO created the deleted entity is
  destroyed alongside the entity). Forensic implication: cleaning up
  old data entities ALSO cleans up the audit trail explaining their
  origin. **The structural audit-silence on RBAC is paired with a
  structural audit-erasure on TTL-deleted data entities** — the audit
  surface has TWO classes of forensic blind spot, both schema-rooted.
