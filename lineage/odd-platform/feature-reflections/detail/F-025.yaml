- id: H-007
  hypothesis: "When a user pastes Markdown or HTML (e.g. a link, bold text, or a script tag) into the Definition or Query field, it is displayed as the literal text they typed, not rendered/executed."
  derivation: "Response shape + negative-space — the fields are labelled for SQL/prose; a user pasting SQL containing characters like < or a Markdown link does not expect it interpreted; the F-004 family flags this surface."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      Both `definition` and `query` are stored verbatim (text NOT NULL, no sanitisation at HTTP or
      service layer) and RENDERED through `@uiw/react-md-editor`'s MDEditor.Markdown at two read
      sites (QueryExampleDetailsOverview.tsx:19,25 + QueryExamplesListItem.tsx:45,52) and authored
      through the same library's editor mode in the form (QueryExampleForm.tsx:105-110, read directly).
      Markdown IS interpreted: `**bold**` renders bold, `[x](javascript:...)` renders a link. This is
      the 4th member of the F-004 stored-XSS family; the upstream library applies a default
      rehype-sanitize schema but the shared Markdown.tsx adds no extra sanitiser, so the partial-
      mitigation envelope from F-004 applies (target-attr / data-attr vectors remain; full inline
      onerror is filtered by the upstream default).
    evidence:
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController
        section: security.known_security_gaps + bugs_limitations_corner_cases.[Markdown XSS]
        cite: "QueryExampleDetailsOverview.tsx:19,25 + QueryExamplesListItem.tsx:45,52 + Markdown.tsx:1-127"
        note: "verbatim store + MDEditor.Markdown render at two sites; F-004 4th surface"
      - sidecar: odd-platform__ts__routes__route__queryExamples
        section: (form authoring surface, source-read)
        cite: "QueryExampleForm.tsx:105-110 (Markdown editor=true on the query field)"
        note: "authoring uses the same MD pipeline; no client allowlist or length cap"
    operator_visible_failure: |-
      (1) An author pasting a SQL comment that happens to contain Markdown syntax sees it reflowed/
      rendered, not shown verbatim — confusing for a 'query body'. (2) The security failure: an author
      with QUERY_EXAMPLE_CREATE can plant a payload (link with javascript: href, target-attr injection)
      that renders to every authenticated reader of the snippet (read-collaborative → broad blast
      radius). (3) There is no length cap (text up to 1GB; WebFlux 256KB default request cap), so a
