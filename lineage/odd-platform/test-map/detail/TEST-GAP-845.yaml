behaviour: |-
  **MEDIUM — Two LSN-017-class dep-array smells in Search.tsx. Class-match to LSN-017 (deps and conditions out of sync), distinct from the exact-pattern view_count case at DataEntityDetails.tsx.** Search.tsx has THREE useEffects with three different dep-array shapes:

  **Smell #1 (LATENT — masked by React batch ordering)** — Lines 37-42: `useEffect(() => { if (!routerSearchId && !isSearchCreating && !searchId) createSearch(...); }, [routerSearchId, isSearchCreating]);`. The guard reads THREE state values (`routerSearchId`, `isSearchCreating`, `searchId`) but the deps array contains only TWO — `searchId` is MISSING. The composition is correct BY ACCIDENT: on session-create-success, the thunk fulfilment writes `searchId` to Redux AND the same render-batch calls `navigate(searchPath(searchId))` which updates `routerSearchId` — both transitions happen in the same render-batch, so the re-fire's guard correctly evaluates as `false` and skips. **But the dep-array does not document this invariant** — a refactor changing the navigate-vs-redux ordering would surface a real double-create.

  **Smell #3 (POTENTIALLY ACTIVE — recommended live probe)** — Lines 67-71: `useEffect(() => { if (!searchFacetsSynced) updateSearchFacets(); }, [searchFacetParams]);`. The guard reads `searchFacetsSynced` but the deps array contains ONLY `searchFacetParams`. The slice's `updateSearchState` reducer (slice.ts:97) sets `isFacetsStateSynced: true` on EVERY successful create/update/get fulfilment — but THIS effect does NOT re-fire when `searchFacetsSynced` transitions back to `true`. The selector `getSearchFacetsData` may also produce fresh object references on every selector run, driving the effect to re-fire on every render during the in-flight PUT window. **Possible doubling shape per LSN-017 — class-match.**

  **Counter-example (Smell #2)** — Lines 44-48: `useEffect(() => { if (!searchId && routerSearchId) dispatch(getDataEntitiesSearch({...})); }, [searchId, routerSearchId]);`. The deps array DOES include both values the guard reads. This effect is CORRECT. The contrast with #1 and #3 is INSTRUCTIVE: when a hand-written effect's deps array matches its read-set, the LSN-017 class disappears.

  **Why MEDIUM (not HIGH)**:
  - Smell #1 is LATENT (masked by React batch ordering — currently not actively reproducing)
  - Smell #3 is POTENTIALLY ACTIVE (no live probe run for Catalog page in this batch)
  - Both warrant tests + a P-N probe per LSN-017's measurement-truth principle
  - The exact LSN-017 view_count doubling pattern is DataEntityDetails-specific; these are class-matches, not exact-pattern matches
  - The presence of the counter-example (#2) reduces severity — the bug class is locally-fixable per-effect, not a project-wide systematic ignorance

  **Test gap shape**: Two regression-pin tests, one per smell. PINS the latent class today; flips assertion direction after each smell is fixed (deps array updated to match read-set).
