behaviour: |-
  **The runs-history UI displays an inconsistent / non-deterministic ordering at the page boundary when (a) NULL end_time RUNNING rows mix with completed runs, or (b) multiple completed runs share an end_time value.** The SQL emits `ORDER BY end_time DESC` (single field, no tie-breaker, no NULLS-FIRST/LAST directive — `ReactiveDataEntityTaskRunRepositoryImpl.java:178` + `JooqQueryHelper.java:74-89`). Two operator-visible failure modes:

  **(a) NULL end_time positioning** — Postgres default for DESC is NULLS FIRST, so RUNNING tasks (end_time=NULL) appear AT THE TOP of the runs list. The UI labels each row by `startTime` in the leftmost column (`TestRunItem.tsx:30`) with an empty Duration column when endTime is null (`TestRunItem.tsx:53-57`); the operator sees an undated-looking row first with no visual signal that it represents an in-flight test. Combined with TEST-GAP-979 (the RUNNING-enum-mapper failure), this is the trigger condition: a RUNNING row at position [0] in the result set fires the IllegalArgumentException at the mapper.

  **(b) Tied end_time across page boundaries** — InfiniteScroll consumer (TestRunsHistory.tsx:90-113) appends successive pages via independent SQL invocations (each fetch issues its own `LIMIT OFFSET` query). If two completed runs share an end_time AND span the page boundary (page 1 ends at index 100, page 2 starts at index 100; rows 99-101 share end_time), the Postgres physical-storage order may differ across fetches — operator sees the same row twice (duplicated across pages) OR sees rows skipped (one row never appears in either page).

  **Compound with display key mismatch** — the UI's leftmost column is `startTime` (`TestRunsHistory.tsx:74-87`); the SQL sort is `end_time DESC`. For long-running tests the two diverge: a run started YESTERDAY but ended TODAY appears ABOVE a run started AND ended earlier today. The operator's mental model "this list is sorted by what I see in the first column" is wrong.

  No test asserts ordering under (a) or (b). The repository test (`DataEntityRunRepositoryImplTest.java:62`) uses `DataEntityTaskRunPojoEndTimeComparator` to compute the EXPECTED order — but only for completed runs with distinct end_times; the NULL and tied cases are uncovered.
