behaviour: |-
  **MEDIUM — Silent relative-time semantic drift on shared
  /activity URLs.**

  `components/shared/elements/Activity/common.ts:33-34` computes
  the default Calendar window at MODULE EVAL TIME:
  ```ts
  beginDate: startOfDay(addDays(new Date(), -5)),
  endDate:   endOfDay(addDays(new Date(),  1)),
  ```

  The dates use the BROWSER'S Date constructor (the user's local
  clock). They are NOT serialised into the URL on first navigation
  — the URL `/activity` carries no `beginDate` / `endDate` query
  param until the user EXPLICITLY changes the window via the
  Calendar UI.

  **Operator-observable consequences**:
  - **Share-drift**: Alice navigates to `/activity` at 23:30 local
    time on May 25. She sees activity from May 20 to May 26 (her
    "now + 1"). She shares the URL with Bob in another time zone
    or simply 5 hours later. Bob clicks the link at 04:30 local
    on May 26. The default window is re-computed at Bob's eval
    time, yielding May 21 to May 27. The page they "share" is
    NOT the same view. The default-window invisibility means
    operators have NO signal that the URL is non-deterministic.
  - **Midnight-boundary**: An operator who keeps the tab open
    over a midnight boundary sees the window unchanged until
    they navigate or refresh. The "now" on their counter no
    longer aligns with their "today". Workflow surprise.
  - **Timezone-mismatch**: Bob in UTC-8 navigates while Alice
    is in UTC+1. The dates returned by `new Date()` reflect
    UTC instants but `startOfDay` / `endOfDay` interpret them
    in LOCAL timezone. The window crosses different dates
    depending on operator location.

  **Why MEDIUM**:
  - **Workflow surprise** but not data loss: operators expect
    `URL I shared = view I saw`. The drift breaks the
    expectation, but the data itself is unchanged — the
    rendering is just different.
  - **Doc-side compounding**: the live doc page at
    `https://docs.opendatadiscovery.org/features/active-platform-features/activity-feed`
    (WebFetched 2026-05-26 status 200) does NOT specify the
    default 6-day window. An operator reading the doc cannot
    anticipate the relative-time semantics. Surface as DOC-NNN
    candidate.
  - **Trivial mitigation**: serialise the default window into
    the URL on first mount (Activity.tsx useEffect calling
    setQueryParams({beginDate, endDate}) if absent). This
    URL-stamps the view and makes shared URLs deterministic.

  **The CONTRAST with Alerts / Search**: alerts and search are
  inbox-style (OPEN-only / current state) — relative-time is
  not relevant. Activity is an audit feed — share-deterministic
  URLs are operator-expected. This is the discriminating shape.

  **Test gap shape**:
  1. **URL-determinism regression-pin**: render <Activity/> at
     /activity, mock Date.now() to T1, capture the URL. Mock
     Date.now() to T2 (= T1 + 6 hours), reload, capture the
     URL. Today: URLs are identical (`/activity` no params);
     viewed windows differ. After fix: URLs differ (each carries
     its own `beginDate`/`endDate`); navigating to either URL
     shows that specific window.
  2. **Date-handling edge case**: hand-craft URL with
     `beginDate=2026-05-30&endDate=2026-05-25` (inverted),
     observe behaviour. Today: untested (PROBE-NEEDED per
     stress_findings). Per fix: pass-through to backend (which
     returns empty Flux), or UI validation refuses.
