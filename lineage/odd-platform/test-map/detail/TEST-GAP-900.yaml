proposed_action: |-
  Add `DataSourceTokenConcurrentRotationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Two test methods:
  1. `regenerateDataSourceToken_twoConcurrentPuts_distinctResponseTokens_noDuplicateRow_onlyLaterCommittedAuthenticates` — register a data source; fire two concurrent PUT /api/datasources/{id}/token calls (CompletableFuture / parallel WebTestClient); assert both return 200 with DISTINCT 40-char plaintext tokens; assert `SELECT COUNT(*) FROM token WHERE id = <data_source.token_id>` returns 1; assert the DB-persisted token.value equals exactly one of the two response tokens; assert `POST /ingestion/entities` with the OTHER response token returns 401.
  2. `regenerateDataSourceToken_replayedPut_isNotIdempotent_secondCallInvalidatesFirstResponseToken` — PUT once, capture T1; PUT again with the same request, capture T2; assert T1 != T2; assert `POST /ingestion/entities` with T1 returns 401 (the replay invalidated it).

  Pair with a REFACTOR follow-up: add an If-Match ETag (or idempotency key) so a UI
  double-submit does not silently strand the operator on a dead token.
