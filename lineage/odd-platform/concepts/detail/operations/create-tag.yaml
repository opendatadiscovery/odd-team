security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Gated at the controller perimeter via SecurityConstants.SECURITY_RULES
      (TAG_CREATE, Management scope, NO_CONTEXT). NO @PreAuthorize on the
      method; NO programmatic permission check in TagServiceImpl.bulkCreate
      or the inherited repository method — controller-perimeter-only is the
      consistent platform shape for write endpoints.
  owner_scoping:
    verdict: N/A
    detail: The tag table has no owner_id column; createTag produces flat globally-shared vocabulary rows.
  strengths:
    - |-
      Atomicity of the multi-row INSERT comes from the inherited
      @ReactiveTransactional on ReactiveAbstractCRUDRepository.bulkCreate.
    - |-
      external = true is NOT settable from TagFormData — a UI/API caller
      cannot impersonate a Collector-created tag.
  weaknesses:
    - |-
      HIGH — side-door directory growth — DATA_ENTITY_TAGS_UPDATE /
      TERM_TAGS_UPDATE / DATASET_FIELD_TAGS_UPDATE and S2S ingestion mint
      global tag rows WITHOUT TAG_CREATE, while createTag itself requires
      it. The live permissions page does not document this. See the
      `spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create`
      invariant.
    - |-
      MEDIUM — authorisation is path-pattern-matched only; a /api/tags
      path rename without a SECURITY_RULES update would silently un-gate
      createTag (REFACTOR-217 drift class).
    - |-
      MEDIUM — no audit log — a new tag appearing in the global directory
      produces no Activity Feed entry; the create is not attributable to
      a user or a time. See the audit-log-presence-asymmetry invariant.
    - |-
      LOW — no tag-name validation — empty / whitespace / control-char /
      unbounded-length names are accepted into the global directory.
  cross_file_inconsistencies:
    - |-
      The openapi-tag tag sidecar and the createTag method sidecar agree
      on the 200-vs-201 status-code drift — corroborating, no conflict.
  contributing_files:
    - createTag.md
    - openapi-tag__tag.md
  evidence:
    - 'createTag.md:security.authorization_assertions'
    - 'createTag.md:security.known_security_gaps'
    - 'openapi-tag__tag.md:invariants[no security: block, no securitySchemes]'

performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Runs once per Management -> Tags 'create' action — not a rendering
      or polling path. odd-platform java TagController controller-method:createTag
  throughput_shape:
    verdict: BATCH_FRIENDLY
    detail: |-
      createTag accepts a Flux<TagFormData> array; the inherited bulkCreate
      emits ONE multi-row INSERT regardless of batch size (no per-element
      round-trip; it does NOT partition like the Collector ingestData path).
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless controller; concurrency-protection on the create path is
      the tag_name_unique partial unique index (B-tree-level conflict
      serialisation), not an application lock.
  weaknesses:
    - |-
      LOW — no maxItems cap on the bulk body — a 100000-element
      BulkTagFormData is accepted, fully .collectList()-materialised in
      memory, and emitted as one very large multi-row INSERT.
  contributing_files:
    - createTag.md
  evidence:
    - 'createTag.md:performance.resource_allocation'
    - 'createTag.md:performance.known_performance_gaps'

notes: |-
  CAPTURED batch X-TAGGING (2026-05-21). createTag is the
  operator-explicit, gated, fail-on-duplicate entry-point into the Tag
  directory — the deliberate counterpart to the silent-idempotent
  Collector-path getOrInjectTagByName.

  Cross-cutting connections:
    - Pairs with the Tag entity (lifecycle)
    - Pairs with `get-popular-tag-list` (the read counterpart; that
      operation's notes already reference this slot)
    - Pairs with `delete-tag-with-asymmetric-cascade` (the delete
      counterpart)
    - Pairs with `update-tag` (the rename counterpart)
    - Pairs with `spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create`
      (the side-door write paths that bypass this operation's TAG_CREATE gate)
    - Pairs with `openapi-200-vs-201-status-code-drift-codebase-wide`
      (the status-code drift)
