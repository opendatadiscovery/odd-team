amplification_factor: |-
  241 t() call sites across the SPA × ~1 lookup per call × N renders per
  page. Per-page render aggregate: 50-200 lookups. Aggregate cost is
  negligible (O(1) hash-map probe per lookup); the load is at boot (all
  six locale bundles ship in the main JS chunk, ~120 KB raw / 30-50 KB
  gzipped together — no code-splitting per locale).
amplification_note: |-
  The drift amplification is in CARDINALITY of missing-key incidents: each
  of the 12+ missing keys is rendered everywhere it's referenced × 5
  non-English locales = 60+ user-visible English fragments across the
  Spanish / French / Chinese / Ukrainian / Armenian UIs. The natural-keys
  pattern makes this entirely silent at the English locale — only
  non-English users can SEE the bug, and only by recognising untranslated
  English fragments amongst translated ones.
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render — 418 distinct user-visible strings rendered across every
    page of the SPA. Every t() call site resolves to a translated value
    for the active locale; for missing keys (12+ confirmed) the lookup-key
    string itself is rendered (the natural-keys fallback). 50-200 t()
    lookups per page render (aggregate); 241 call sites in total.
    Locale switch also triggers a page-render of the entire SPA in the
    new language + a cache-mutate of localStorage('i18nextLng').
  evidence: |-
    en.json:2-419 (the 418 user-visible strings) + locales/i18n.ts:3,11
    (the static-import + resource binding) + 241 t() call sites across
    odd-platform-ui/src (verified by repo-wide grep at commit 4ec2b20)
    + SelectLanguage.tsx:28-33 (the change-language + localStorage write).
  cardinality_per_call: 1 per t() lookup; 50-200 aggregate per page render
observed_vs_expected:
  facets:
    - facet_id: missing_key_drift_12_plus_keys_referenced_in_code_absent_in_all_six_locales
      drift_class: i18n_missing_key_drift_silent_natural_keys_fallback
      severity: HIGH
      observed: |-
        12+ confirmed missing keys: `"Data Quality"` (ToolbarTabs.tsx:46),
        `"Data Modelling"` (ToolbarTabs.tsx:51), `"Master Data"`
        (ToolbarTabs.tsx:56), `"Query Examples"` (QueryExamples.tsx:23),
        `"query examples overall"` (QueryExamples.tsx:25), `"Add query
        example"` (AssignEntityQueryExampleForm.tsx:47,67 +
        QueryExamples.tsx:42), `"lookup table"` (LookupTableForm.tsx:77),
        `"Table name"` (LookupTableForm.tsx:90), `"Save lookup table"`
        (LookupTableForm.tsx:129), `"Add lookup table"`, `"Enter business
        name"` (InternalNameFormDialog.tsx:69), `"Link query"`
        (DataEntityDetailsQueryExamples.tsx:40), `"tab"`
        (QueryExampleDetailsContainer.tsx:31 +
        QueryExampleDetailsTabs.tsx:38), `"Delete query example"`,
        `"Are you sure you want to delete this query example?"`. Verified
        by repo-wide grep on all six locale JSON files — every missing
        key is absent across ALL six locales.
      expected: |-
        Every t() call site has a matching key in en.json + every
        non-English locale. Operator-conventional default for production
        i18n.
      operator_visible_consequence: |-
        French / Spanish / Chinese / Ukrainian / Armenian users see
        English fragments amongst translated UI — three top-level
        navigation tabs (Data Quality / Data Modelling / Master Data)
        + 12+ form labels / button texts / modal titles. Localisation-
        quality drift; consistent across locales.
    - facet_id: locale_set_drift_three_to_four_keys_per_locale_diverge_from_english
      drift_class: i18n_locale_count_drift_silent_natural_keys_fallback
      severity: HIGH
      observed: |-
        `wc -l` per locale: en=418, ch=415, fr=415, es=414, hy=414,
        ua=414. Three to four keys exist in en.json but NOT in the other
        five locales. The natural-keys pattern hides this — missing
        entries fall through to English via the fallbackLng chain.
      expected: |-
        Every key in en.json is also present in every non-English
        locale; a CI step validates this.
      operator_visible_consequence: |-
        A non-English-locale user encountering one of the
        in-en-but-not-in-their-locale keys sees English text where they
        expect their language. The drift is invisible until that key is
        rendered.
    - facet_id: no_missingkey_event_handler_silent_failure_at_runtime
      drift_class: i18n_silent_missing_key_no_event_handler_no_observability
      severity: MEDIUM
      observed: |-
        i18n.ts:27-31 — `i18n.use(initReactI18next).init({resources, lng,
        fallbackLng})` has only three keys configured. No
        `missingKeyHandler`, no `parseMissingKeyHandler`, no
        `saveMissing`. The i18next default behaviour is to return the
        KEY STRING after exhausting the fallback chain — silent failure.
      expected: |-
        A development-time `missingKeyHandler` that warns to console
        (or surfaces to Sentry / similar) on every missed key. Optional
        production-time `saveMissing` (with care — auto-add can cascade).
      operator_visible_consequence: |-
        A typo in a t() call site, a deleted key, or a key added in
        code but never added to en.json all produce silent fall-through.
        Bugs ship invisibly; only a non-English user encountering a
        freshly-added key first surfaces the drift.
    - facet_id: no_compile_time_validation_of_t_call_key_against_locale_bundle
      drift_class: i18n_no_compile_time_validation_no_ci_step
      severity: MEDIUM
      observed: |-
        Adding a new t('...') call site in the code does NOT validate
        against en.json at build time — there is no TypeScript-typed
        t() (i18next-react v12+ supports this via `keyof` constraints
        but the project does not adopt it). There is no CI step
        enumerating t() call sites and asserting presence.
      expected: |-
        Either type-safe t() (the i18next-react ts-helpers approach) or
        a one-shot CI script that greps `t\\(['"]([^'"]+)['"]\\)` and
        asserts presence in en.json + each non-English locale.
      operator_visible_consequence: |-
        The 12+ missing-key drift ships and recurs because nothing
        catches it. Adding the validation would catch existing drift
        AND prevent future drift in one shot.
    - facet_id: browser_language_navigator_language_never_consulted_localStorage_or_en_only
      drift_class: i18n_browser_language_not_consulted_first_visit_english_only
      severity: LOW
      observed: |-
        i18n.ts:20-25 reads `localStorage('i18nextLng')` with hardcoded
        fallback to 'en'. `navigator.language` (the browser's
        preferred language) is never consulted. A user with a
        Spanish-language browser sees English on first visit; they must
        manually switch via the gear menu (itself in English).
      expected: |-
        Either consult navigator.language on first visit (i18next has
        built-in language-detector support), or document the
        English-only-default behaviour.
      operator_visible_consequence: |-
        Cross-cultural UX defect — Spanish/French/etc users see English
        until they discover the locale switcher (which is in English).
        Bounce risk for first-time non-English visitors.
    - facet_id: activity_user_filter_label_misleading_label_vs_sql_drift_lsn_020_channel
      drift_class: i18n_label_promises_user_actor_sql_filters_by_owner_via_mapping
      severity: HIGH
      observed: |-
        en.json:347 — `"User": "User"`. Filters.tsx:58 — `<MultipleFilter
        filterName='userIds' name={t('User')} />`. The SQL at
        ReactiveActivityRepositoryImpl.java:272-273 binds userIds to
        `USER_OWNER_MAPPING.OWNER_ID.in(userIds)` (filters by
        owner-of-entity-via-mapping). The available column
        `activity.created_by` (the actual actor) is read in LEFT JOIN
        but NEVER referenced in WHERE. The live doc page (WebFetched
        2026-05-26 status 200) describes the filter as "events
        performed by one or more selected users" — reinforcing the
        wrong promise. Three surfaces — doc copy + UI label + SQL —
        disagree.
      expected: |-
        Rename the i18n key to express the SQL semantic honestly (e.g.
        "User" → "Affected Entity Owner" or "Entity Owner (mapped from
        user)") AND update the doc copy AND update Filters.tsx.
      operator_visible_consequence: |-
        Cross-link DOC-GAP-303 + F-021 + LSN-020. A compliance reviewer
        auditing "what did Alice do last week" sets userIds=[alice_id],
        expects Alice's actions, receives activity on entities
        owned-via-mapping by Alice. The label uniformly misleads across
        all six locales (no locale corrects it under natural-keys default).
    - facet_id: dictionary_label_vs_termsearch_url_drift_via_natural_keys
      drift_class: i18n_label_vs_url_drift_silent_uniform_across_locales
      severity: LOW
      observed: |-
        en.json:115 — `"Dictionary": "Dictionary"`. ToolbarTabs.tsx:66 —
        `name: t('Dictionary'), link: termsSearchPath()`. termsRoutes.ts:5
        — `TERMS_SEARCH_PATH = '/termsearch'`. The label says Dictionary;
        the URL says termsearch. All 6 locales render the natural-keys
        identity value 'Dictionary' verbatim.
      expected: |-
        Either rename URL or rename key. Cross-link DOC-GAP-300/301 +
        F-024.
      operator_visible_consequence: |-
        Vocabulary disagreement between label and URL; bookmarks adopt
        URL; deep links cite URL; tutorial documentation must explain
        the discrepancy.
    - facet_id: statuses_key_locale_divergent_spanish_singular_translates_plural_english
      drift_class: i18n_locale_translation_inconsistent_partial_change_by_one_contributor
      severity: LOW
      observed: |-
        en.json:418 = "Statuses" (plural); es.json:410 = "Estado"
        (singular); the other four locales (ch, fr, hy, ua) carry the
        English source "Statuses". The Search Filters component uses
        `name={t('Statuses')}` for a multi-select facet label —
        Spanish-locale users see "Estado" (singular), suggesting a
        single status to select, while the widget IS multi-select.
      expected: |-
        Either all locales translate (plural form), or all locales
        carry the English source. The current state is a partial
        contributor change.
      operator_visible_consequence: |-
        Minor UX inconsistency in the Spanish locale.
    - facet_id: main_search_placeholder_content_drift_english_enumerates_4_entities_other_locales_generic
      drift_class: i18n_localisation_content_quality_drift
      severity: MEDIUM
      observed: |-
        en.json:381 carries "Search data tables, feature group, jobs
        and ML models via keywords" (enumerates four entity types).
        fr.json:377 carries "espace de recherche principal" ("main
        search space"); es / ch / ua / hy similar shorter generic
        placeholders. Localisation-quality drift — non-English users
        see a less-informative placeholder.
      expected: |-
        Each locale carries an equivalent-enumeration placeholder.
      operator_visible_consequence: |-
        Discoverability of the search surface differs across locales —
        a French user does not see the 4-entity-type hint that an
        English user sees.
    - facet_id: case_whitespace_key_duplication_17_pairs_doubles_translation_surface
      drift_class: i18n_key_duplication_lowercase_vs_titlecase_doubled_translation_surface
      severity: LOW
      observed: |-
        17 distinct entries differ only in capitalisation or trailing
        whitespace — `"description"` (line 369) + `"Description"`
        (line 113); `"owner"` (line 389) + `"Owner"` (line 236); etc.
        Convention: lowercase key for inline noun ('5 tags'), uppercase
        key for label / heading / button ('Tags'). Doubles the
        translation surface; lowercase form is rarely localised.
      expected: |-
        A single key per noun + a UI utility for case-transformation
        at render time, OR explicit dual-key convention documented in
        a CONTRIBUTING.md.
      operator_visible_consequence: |-
        Future-cleanup item; not a defect today.
    - facet_id: no_code_splitting_per_locale_all_six_bundles_ship_together
      drift_class: i18n_no_code_splitting_per_locale_total_bundle_30_to_50kb_gzipped
      severity: LOW
      observed: |-
        i18n.ts:3-8 static-imports all six locale JSON files at boot.
        Webpack / Vite bundles them into the main JS chunk; ~120 KB raw
        / 30-50 KB gzipped together. A user with `i18nextLng='en'` ships
        the 5 other locales they never see.
      expected: |-
        Either dynamic import per locale (i18next's xhr-backend +
        bundlerless config), or static-but-lazy import via React.lazy
        for the SelectLanguage dialog.
      operator_visible_consequence: |-
        First-paint download is ~30-50 KB larger than necessary. Minor
        at modern bandwidth; observable on slow mobile networks.
    - facet_id: dangerouslysetinnerhtml_absent_react_default_escaping_handles_xss_boundary
      drift_class: i18n_xss_boundary_react_default_escaping_held_today_but_not_codified
      severity: LOW
      observed: |-
        Repo-wide grep for `dangerouslySetInnerHTML` over
        odd-platform-ui/src returns ZERO matches. React's default JSX
        escaping handles the XSS boundary — i18next values are
        rendered as React children and escaped. The i18n layer does
        NOT introduce an XSS surface in this codebase. A future
        contributor introducing `dangerouslySetInnerHTML={{__html:
        t('SomeKey')}}` would invert the boundary.
      expected: |-
        An ESLint rule banning `dangerouslySetInnerHTML` on t() output.
      operator_visible_consequence: |-
        Today: no risk. Tomorrow: a single `dangerouslySetInnerHTML`
        invocation on a t() value would execute the value (or any
