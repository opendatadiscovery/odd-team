behaviour: |-
  **RE-REGISTRATION PARTIAL-MERGE — only name + description are overwritten; everything else is PRESERVED.** `DataSourceIngestionServiceImpl.prepareForUpdate` (lines 74-92) is a hand-built shallow merger: it copy-constructs the existing `DataSourcePojo` and overwrites ONLY `name` + `description` from the new payload. The existing `connection_url`, `active` flag, `type`, `namespace_id`, `collector_id`, `token_id`, soft-delete flag, all timestamps, AND any custom fields — all PRESERVED. The trade-offs: (1) An operator who renames a datasource in the UI sees their rename OVERWRITTEN by the collector's payload (the collector wins on name and description). (2) A collector that genuinely needs to update `connection_url` (e.g. the source's hostname changed) CANNOT do so via this endpoint — only name and description are propagated. (3) A collector cannot 'take over' an existing datasource by registering with a new collector_id — the existing collector_id is preserved on update (DataSourceIngestionServiceImpl.java:86-88). The merge semantics are deliberately narrow but invisible to integration authors reading the live docs. Plus the namespace-from-COLLECTOR invariant compounds: a `namespace_name` field in the payload (the upstream Ingestion API contract has this field) is SILENTLY IGNORED — the Collector's namespace wins (DataSourceIngestionServiceImpl.java:106). NO test pins these merge contracts. A future refactor changing `prepareForUpdate` to overwrite `connection_url` from the payload would silently break operator UI edits.
