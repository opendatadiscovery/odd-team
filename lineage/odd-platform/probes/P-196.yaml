realism_caveats: |
  - The CRLF-header-injection sibling (filename containing CRLF injected into the
    Content-Disposition header on download — DataEntityAttachmentController.java:76-79)
    is a SEPARATE assertion best driven by a raw-socket HTTP client that can read the
    raw response head; WebFetch/WebTestClient normalise headers and would hide the
    injection. Emit a follow-up raw-HTTP probe for the CRLF case if the maintainer
    wants it pinned.
  - The traversal depth (../../..) is tuned for the default base path
    /tmp/odd/attachments/{id}; if attachment.local.path is overridden the probe-runner
    re-tunes the relative prefix so the escape target is a writable sandbox dir
    inside the container.
  - This probe targets LOCAL storage. The REMOTE flavour writes the raw fileName as
    an S3 object key; S3 key semantics differ (no real ../ traversal on the object
    store, but key-injection / overwrite-of-another-key is the analogue). The LOCAL
    case is the higher-severity (arbitrary filesystem write) and is pinned here.
