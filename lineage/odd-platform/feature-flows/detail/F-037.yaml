observed_vs_expected:
  facets:
  - facet_id: relationship_id_translates_silently_to_data_entity_id
    drift_class: drift_input_name_vs_implementation_path_param_target_column_mismatch
    severity: HIGH
    observed: "OpenAPI relationship_id + Java relationshipId PROMISE the relationships\ntable primary key; SQL at ReactiveRelationshipsRepositoryImpl.java:194\nfilters by relationshipsDataEntity.field(DATA_ENTITY.ID).eq(relationshipId)\n\
      \u2014 the data_entity.id column. List endpoint mapper returns\nid = data_entity.id (RelationshipMapper.java:53); UI round-trip works.\nThird-party API consumer reading the spec literally + supplying\
      \ actual\nrelationships.id gets 404 OR a payload for an UNRELATED relationship."
  - facet_id: no_authorization_gate_at_any_layer_full_catalog_visibility
    drift_class: read_collaborative_posture_undocumented_cross_pillar
    severity: HIGH
    observed: 'No @PreAuthorize; no SECURITY_RULES entry for /api/relationships/**

      (verified by reading full 357-line SecurityConstants); no service

      check; no OWNERSHIP JOIN; no data_source_id filter; no namespace_id

      filter; no EXCLUDE_FROM_SEARCH = false filter; no HOLLOW = false

      filter. Every authenticated caller sees every relationship in the

      catalog including hidden + cross-tenant. Asymmetric to /api/dataentities

      (which DOES apply EXCLUDE_FROM_SEARCH per batch-T REFACTOR-425).'
  - facet_id: page_zero_boundary_500_not_graceful_first_page
    drift_class: arithmetic_pagination_no_min_page_validation
    severity: MEDIUM
    observed: '(page - 1) * size at ReactiveDataEntityRelationshipRepositoryImpl.java:79

      produces negative offset for page=0; Postgres rejects with

      `OFFSET must not be negative`. OpenAPI PageParam lacks minimum:1;

      Spring binding accepts page=0. A JavaScript-style 0-indexed caller

      hits opaque 500 instead of first page.'
  - facet_id: no_unique_constraint_on_data_entity_id_admits_multi_row_undefined_mono
    drift_class: schema_admits_multi_row_match_application_expects_single
    severity: MEDIUM
    observed: 'V0_0_87__create_relation_tables.sql:1-10 declares data_entity_id bigint

      with only FK, no UNIQUE. ReactiveRelationshipsRepositoryImpl.java:197

      uses mono() expecting one row; on multi-match behaviour is

      JOOQ-driver-specific. No current collector produces multi-row but

      schema admits it.'
  - facet_id: search_query_filters_relationship_name_not_source_target_entity_names
    drift_class: feature_gap_search_scope_under_documents
    severity: LOW
    observed: 'query param filters by DATA_ENTITY.EXTERNAL_NAME.containsIgnoreCase

      against the relationship-class data_entity (entity_class_ids=[9]), NOT

      source/target entity names. Operator typing ''orders'' to find every

      relationship involving the ORDERS table is silently violated.'
  - facet_id: relationships_list_target_column_copy_paste_renders_source_data_doc_correct_code_wrong
    drift_class: ui_row_renderer_copy_paste_bug_target_column_displays_source_data
    severity: HIGH
    discovered_at_batch: ZI
    observed: |-
      RelationshipsListItem.tsx:73-81 renders the Target cell with
      dataEntityId={item.sourceDataEntity.id} +
      name={item.sourceDataEntity.internalName || item.sourceDataEntity.externalName || ''} +
      oddrn={item.sourceDataEntity.oddrn || ''} — identical to the
      Source cell at lines 64-72. The item.targetDataEntity field IS
      present on DataEntityRelationship interface and IS consumed
      correctly by sibling components at
      RelationshipTypes/EntityRelationship.tsx:33-35 +
      GraphRelationship.tsx:32-34. The bug is a COPY-PASTE in the
      list-item renderer only; the user sees the same dataset in
      BOTH columns for every row.
    expected: |-
      Target cell renders item.targetDataEntity.id +
      item.targetDataEntity.internalName/externalName +
      item.targetDataEntity.oddrn — matching the documented behaviour
      at https://docs.opendatadiscovery.org/features/data-modelling/relationships
      ("a table displaying Name, Type, Namespace + Datasource, Source
      entity, Target entity").
    provenance: |-
      PRIMARY-SOURCE — relationshipsRoutes batch-ZI sidecar
      bugs_limitations_corner_cases[0] + WebFetch
      https://docs.opendatadiscovery.org/features/data-modelling/relationships
      (2026-05-26 status 200) + RelationshipsListItem.tsx:64-81
      (Source and Target both reading item.sourceDataEntity). Severity:
      HIGH (operator-facing UI bug; the user has no way to see what
      each relationship POINTS TO from this list page). The doc is
      RIGHT; the code is WRONG. P-167 Block D pins the runtime
      observation. Source batch: ZI.
  - facet_id: relationships_list_row_click_doc_says_type_specific_routing_code_always_navigates_to_data_entity_overview
    drift_class: doc_drift_overstates_type_specific_routing_code_navigates_to_overview_unconditionally
    severity: MEDIUM
    discovered_at_batch: ZI
    observed: |-
      RelationshipsListItem.tsx:52 always calls
      dataEntityDetailsPath(item.id) — the data-entity overview page
      URL — regardless of relationship type. The ZE-documented endpoints
      /api/relationships/erd/{id} and /api/relationships/graph/{id} are
      reached by the data-entity overview page's relationship-card
      rendering (OverviewRelationshipStats/OverviewRelationshipType/*.tsx),
      NOT by the row click on this list page.
    expected: |-
      Either (a) the doc clarifies that the row click navigates to the
      data-entity overview where type-specific rendering happens, OR
      (b) the row click navigates to a type-specific detail URL (which
      doesn't exist today — the type-specific detail rendering lives
      inside the overview page).
    provenance: |-
      PRIMARY-SOURCE — RelationshipsListItem.tsx:52 + WebFetch
      https://docs.opendatadiscovery.org/features/data-modelling/relationships
      (2026-05-26 status 200, verbatim: "Users can click any row to
      open the relationship's detail page, with routing determined by
      the relationship type"). Severity: MEDIUM (doc overstates
      client-side type discrimination). Source batch: ZI.
