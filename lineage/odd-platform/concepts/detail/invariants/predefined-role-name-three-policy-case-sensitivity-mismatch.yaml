notes: |
  Cross-link to the broader F-006 batch S findings:
    - service-tier-reactive-transactional-asymmetry-policy-vs-role (the Role
      side gets transactional protection but the create-side case check is
      missing; symmetric drift on the Policy side per
      PolicyServiceImpl batch I — create-side Administrator-name asymmetry).
    - authorization-hot-path-getcurrentuserroles-per-request-no-cache (the
      lowercase Administrator role's policies are resolved on EVERY authorized
      request through getCurrentUserRoles + getCurrentUserPolicies; the
      exploit lands on the platform-wide authorization hot path).
    - no-audit-log-on-rbac-mutations-...-batch-f (the lowercase role's
      create / update / delete attempts are forensically silent; the
      exploit leaves no trail in the platform's logs; the 9-sidecar
      audit-silence pattern means defender's post-incident reconstruction
      relies on DB direct inspection only).

  Recommended cleanup (highest leverage first):
    (1) Add the case-insensitive name check on create at RoleServiceImpl.java
        line 50-51 (one-line fix per quoted code above).
    (2) Symmetric fix on the Policy side (PolicyServiceImpl.create at lines
        62-69 — same case-insensitive name reservation against the seeded
        Administrator policy name).
    (3) Add a regression test pinning all three case-policy choices in one
        place — a single-class test that asserts: create("administrator")
        fails; update("administrator", "renamed") fails; delete on the
        lowercase variant fails. The three assertions should be ONE test
        method that exercises the asymmetry top-to-bottom.
    (4) Document the asymmetry on
        `https://docs.opendatadiscovery.org/configuration-and-deployment/
        enable-security/authorization/roles` per batch S
        SERVICE-DOC-GAP-C — the live Roles page does not warn operators of
        the create-side gap nor the case-sensitivity exploitation vector.
