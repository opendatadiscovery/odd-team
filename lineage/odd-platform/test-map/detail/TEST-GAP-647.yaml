behaviour: |-
  **CRITICAL: empty-roles destructive UPDATE is UI-reachable in three clicks (elevation of TEST-GAP-622 from API-only to UI-operator-reachable).** OwnerForm.tsx form validation requires non-blank `name` ONLY; `roles` has NO validation rules (`OwnerForm.tsx:40-43` — `useFieldArray` with no validation). The Save button (`OwnerForm.tsx:108-117`) is disabled only by `!formState.isValid` which checks ONLY the name rule. An operator who removes every role TagItem via the `onRemoveClick={handleRemove(idx)}` X-icon (line 95-103) can still submit. The resulting `OwnerFormData` carries `roles: []`. Per F-019 batch-P `OwnerServiceImpl.update`, this triggers `deleteOwnerRelationsExcept(ownerId, []).then(createRelations(ownerId, []))` — DELETES all role-bindings, no audit log, no recovery. **THE UI HAS A CONFIRMATION MODAL ON DELETE (which is REVERSIBLE — soft-delete + name re-use) BUT NO CONFIRMATION ON EDIT (which is IRREVERSIBLE — role bindings hard-deleted)**. The UX asymmetry inverts the actual destructiveness. Flow: (1) Edit owner row → opens OwnerForm with existing roles as TagItems; (2) click X on each TagItem; (3) click Save (enabled because name is unchanged and valid). Three clicks, NO confirmation modal, NO before/after diff, NO warning banner, NO audit log entry. Combined with TEST-GAP-622 (the API-side destructive-default) and TEST-GAP-238 family (Owner audit-silence), this is the operator-facing trigger for silent privilege removal. NO test asserts (a) `OwnerForm.formState.isValid` becomes `true` after removing all role TagItems; (b) the Save button is enabled in that state; (c) the submit fires `updateOwner({ ownerId, ownerFormData: { name, roles: [] } })`; (d) NO ConfirmationDialog is mounted (regression-pin: future fix that adds a confirmation modal breaks this test).
