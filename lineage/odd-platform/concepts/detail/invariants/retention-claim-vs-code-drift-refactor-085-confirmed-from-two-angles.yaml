- HousekeepingTTLProperties.md:bugs_limitations_corner_cases.[1] (same gap for MESSAGE
  table)
- HousekeepingTTLProperties.md:docs_link_semantic.doc_drift_findings.[0] (the activity-feed
  page's 'retention' claim is unsupported from two angles)
