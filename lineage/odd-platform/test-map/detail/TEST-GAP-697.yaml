proposed_action: |-
  Add `DataSourceIngestionServiceImplNamespaceInheritanceTest.createDataSources_payloadWithNamespaceName_isSilentlyIgnored_finalRowInheritsCollectorNamespace`. (a) Mockito-style unit test extending the existing test infrastructure. (b) Mock `reactiveCollectorRepository.getDto(collectorId)` to return a CollectorDto with a Collector having `namespace_id=NS1` (assigned namespace). (c) POST a `DataSourceList` with one DataSource: `{ oddrn: "//x", name: "test", namespace_name: "my-team-NS2" }`. (d) Invoke `dataSourceIngestionService.createDataSources(collectorId, payload)`. (e) Capture the `DataSourcePojo` passed to `reactiveDataSourceRepository.bulkCreate(...)`. (f) Assert `pojo.getNamespaceId() == NS1` (Collector's namespace) NOT NS2 (payload's). (g) Add a `// REGRESSION-PIN — Payload's namespace_name is SILENTLY DROPPED. The Collector's namespace_id wins via MappingUtils.extractFieldFromNullableObject. The protective invariant (cross-collector namespace stealing blocked) is the intentional side; the silent drop is the operational caveat. A REFACTOR that reads namespace_name from the payload (e.g., to support multi-namespace collectors) will break this test, making the change deliberate.` comment block.
