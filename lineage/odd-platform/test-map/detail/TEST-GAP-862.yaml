proposed_action: |-
  Add `TagServiceImplServiceLayerAuthZeroTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/`. Pure JUnit test using reflection (no Spring boot required for the grep-style probe). Three test methods:

  1. **`tagServiceImpl_hasZeroPreAuthorizeAnnotations_pinsAbsenceOfDeclarativeServiceLayerAuth`** (HEADLINE):
     - Use reflection on `TagServiceImpl.class`. Enumerate ALL public methods declared on the class. For each method, assert `method.getDeclaredAnnotation(org.springframework.security.access.prepost.PreAuthorize.class) == null`.
     - PIN: the implicit ADR — the service has zero declarative auth at the service layer.

  2. **`tagServiceImpl_classSourceContainsZeroPermissionServiceReferences_pinsAbsenceOfProgrammaticAuth`**:
     - Read the source file content of `TagServiceImpl.java` via the test fixture (or use a Compile-time annotation processor).
     - Assert: the source does NOT contain the strings `permissionService.hasPermission`, `OwnerAuthorizationFacade`, `SecurityContextHolder`, `@PreAuthorize`, `@Secured`.
     - PIN: the grep-style absence is structurally verified.

  3. **`tagServiceImpl_allNineMethodsAreCallableFromAnyService_documentsArchitecturalIntent`**:
     - For each of the 9 public methods (per TagService interface), assert it can be invoked on a `TagServiceImpl` instance without any Spring Security context (i.e., the method does not require an authenticated principal at the service layer).
     - This is a documentation-test that captures the architectural intent. PIN: the service is a callable-by-any-caller bean; auth lives upstream.

  Cross-pair with REFACTOR-NNN: if the maintainer decides to ADD service-tier auth (e.g. extract a "perimeter-defended" subset + a "side-door" subset), tests #1-2 INVERT — the @PreAuthorize annotations appear on specific methods, and the test reflects the new architectural shape. The inversion forces the maintainer to make the change explicit + coordinated. Cross-pair with DOC-NNN: surface this design on the Authorization doc page.
