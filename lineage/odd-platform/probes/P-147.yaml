assert:
  - "legit_status == 200                                                      # baseline"
  - "cross_version_status == 200                                              # drift hypothesis: cross-dataset version_id returns 200, not 404"
  - "cross_dataset_version_response.dataSetVersion.id == 50201               # body shows ds-B's version even though ds-A is in URL"
  - "any(f.name == 'col_b' for f in cross_dataset_version_response.fieldList) # field belongs to ds-B"
  - "cross_diff_status == 200                                                 # drift hypothesis: cross-dataset diff returns 200"
cleanup:
