behaviour: |-
  **The auth-mode behaviour matrix for GET /api/resource/{type}/{id}/permissions is
  entirely untested — DISABLED cascades empty, LOGIN_FORM returns admin-all-static,
  OAUTH2/LDAP do live-policy evaluation.** The endpoint sits on the UI's critical
  path for EVERY permission-gated button across DataEntity / Term / QueryExample
  detail surfaces. A regression in any layer of the read chain silently changes
  which buttons render enabled. The four-mode contradiction matrix is itself
  load-bearing: under DISABLED the UI shows "you cannot do X" (empty cascade) while
  the API permits the mutation (DisabledAuthSecurityConfiguration permitAll); under
  LOGIN_FORM every user receives the FULL permission set for the resource type
  regardless of role-table revocations (Administrator-policy ALL expansion); the
  divergence between read-side discovery and write-side enforcement is itself the
  operator-trap. Zero existing test slice covers any of the four auth modes.
