name: Reflection-based ODDRN property extractor — infrastructure-revealing
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
- P-09
description: |-
  **NEW LOW-severity INVARIANT, batch 2026-05-20T (DirectoryController class
  sidecar)** — DirectoryServiceImpl.getOddrnPathProperties (lines 138-171) uses
  Java reflection over the `@PathField`-annotated field set of the OddrnPath
  subclass to emit EVERY datasource-side ODDRN property. The extractor has NO
  allow-list, NO redaction step, NO per-property visibility gate.

  **What gets emitted per data-source type**:
    - PostgreSQL datasource: `host`, `database`, `port` (when set)
    - Snowflake datasource: `account`, `warehouse`, `database`, `schema`
    - Kafka datasource: `cluster`, `topic`
    - Airflow datasource: `host`, `dag` (when scoped)
    - MySQL datasource: `host`, `database`
    - All other ODDRN-shaped sources: every annotated path field

  **Operator surface manifestation**: an authenticated user calling
  GET /api/directory/datasources?prefix={...} receives, for every registered
  data source of that type, a `properties: {host: '...', database: '...', port: '...'}`
  map serialised verbatim from the ODDRN. Combined with the absence of owner-scoping
  at the Directory layer (see invariant
  `read-collaborative-cross-owner-enumeration`), the result is a complete
  infrastructure roster: hostnames, database names, port numbers, Snowflake accounts,
  Kafka clusters — all readable by any authenticated user with NO owner binding.

  **The cross-cutting concern**: ODD's catalog is read-collaborative by design
  (ADR-CANDIDATE-003), but this invariant amplifies the read-collaborative posture
  with infrastructure-revealing payload semantics. The standard read-collaborative
  vector (REFACTOR-024 family) exposes catalog metadata; the Directory's reflection
  extractor specifically exposes the operational INFRASTRUCTURE map — internal
  hostnames operators may have assumed were private to the deployment.

  **Compounding factor: REFACTOR-185 (DISABLED-mode bypass)**. Under
  auth.type=DISABLED, the reflection extractor's payload becomes anonymously
  readable. A network-reachable DISABLED deployment leaks its complete
  infrastructure roster to anyone able to hit /api/directory/datasources.

  **The fix has THREE design options**:
    (a) Per-property allow-list (annotation-driven): add `@VisibleInDirectory`
        to each `@PathField` and have the reflection extractor honour it. This
        is the SAFEST default but requires touching every OddrnPath subclass in
        oddrn-generator AND aligning the documentation that today asserts these
        properties are catalog-public.
    (b) Per-deployment configuration: `odd.directory.expose-oddrn-properties=
        full | redacted | none`. Operators with hostname-sensitivity policies
        opt out; the default preserves current behaviour. LEAST DISRUPTIVE for
        existing deployments.
    (c) Per-user authorization: gate the reflection extractor on a new permission
        (DATASOURCE_INFRASTRUCTURE_READ). REQUIRES the read-collaborative posture
        to be re-evaluated for the Directory surface specifically; cross-link
        ADR-CANDIDATE-003.

  Severity: LOW in deployments where hostnames are catalogued explicitly; rises
  to MEDIUM in deployments with explicit hostname-sensitivity policies; rises to
  HIGH under DISABLED in a production-reachable network (per REFACTOR-185's
  19-sidecar enumeration).
