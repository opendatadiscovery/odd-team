name: dataset_field versioning-by-reference + no-soft-delete + orphan accumulation
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
- P-08
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20R** — surfaced by the
  ReactiveDatasetFieldRepositoryImpl batch-R sidecar. The `dataset_field`
  table follows a UNIQUE-IN-THE-PLATFORM persistence pattern:
  versioning is by REFERENCE not by mutation, AND the table has NO
  native soft-delete column AND no cascade-delete trigger. The result
  is a forensically-valuable but operationally-unbounded growth pattern.

  **The schema design** (V0_0_9__normalize_dataset_structure.sql:1-43):
  V0_0_9 introduced the M:N join table `dataset_structure
  (dataset_version_id, dataset_field_id)` AND DROPPED the
  `dataset_field.dataset_version_id` FK + column. After V0_0_9, a
  dataset_field row is SHARED by every dataset_version that contains
  it; a column's evolution is recorded by CREATING NEW dataset_field
  rows when the structure-hash diverges, NOT by mutating one
  dataset_field row across versions. The decision is encoded in the
  service layer's hash-diff partition at
  `DatasetFieldServiceImpl.java:375-396` — when `newVersionHash.equals(
  existingVersionHash)`, the field goes into `fieldsToUpdate` (the
  existing row's id is reused); when not equal, the field goes into
  `fieldsToCreate` as a NEW row.

  **The no-soft-delete posture** (verified across V0_0_1__init.sql:148-164
  plus all subsequent ALTER TABLE dataset_field migrations): no
  `deleted_at`, no `is_deleted`, no `STATUS`. The repository's
  inherited `delete(id)` / `delete(ids)` from
  ReactiveAbstractCRUDRepository.java:144-155 issue HARD DELETE.
  But NO CALLER IN THE PLATFORM INVOKES THEM. There is also no
  scheduled orphan-cleanup job (verified: no `*housekeeping*` bean
  referencing `DATASET_FIELD`).

  **Orphan accumulation**: schema-change forks leave the OLD
  dataset_field row in place, still referenced by the OLD
  dataset_structure row + the OLD dataset_version row. Over many
  ingestion cycles on a churning dataset, the `dataset_field` table
  grows monotonically. PG row count for a heavily-evolving dataset can
  be substantially larger than the current column count ×
  ingestion-versions kept. NO RETENTION POLICY, NO TTL, NO ADMIN
  ENDPOINT TO PURGE.

  **Operator-curated metadata is preserved across version forks**
  (DatasetFieldServiceImpl.java:308-322 + 324-335 + 352-373) — when
  a hash-diff causes a NEW dataset_field row, the previous row's
  `internalName` + `internalDescription` + INTERNAL-origin tags +
  INTERNAL enum values are COPIED forward to the new row. The
  forward-copy preserves the operator's stewardship investment
  across schema evolution; the trade-off is the orphan row remains
  referenced by the prior dataset_version.

  **The hash factors** (per DatasetVersionHashCalculator): `name`,
  `type`, `is_key`, `is_value`, `is_primary_key`, `is_sort_key`,
  `external_description`. A rename (`name` change), type change, or
  PK/sort-key flag flip CREATES a new dataset_field row; a
  stats-only update REUSES the existing row.

  **The orphan growth rate is data-dependent**: a stable schema
  produces minimal orphans (only ingestion-tier `external_description`
  drift causes refreshes). A volatile schema (e.g. a dataset with
  weekly column renames or PK changes) accumulates one new
  dataset_field row PER COLUMN PER CHANGE. A 100-column dataset with
  monthly type changes across 5 years yields 6,000+ dataset_field
  rows for what is logically 100 columns.

  **Authorization is parent-scoped, not field-scoped**: the
  `DatasetFieldResourceExtractor.java:21-27` resolver runs
  `getDataEntityIdByDatasetFieldId` (this repository's lines 115-125)
  on EVERY request to `/api/datasetfields/{id}/...` (5 routes). The
  3-table join chain (dataset_field → dataset_structure → dataset_version
  → data_entity) executes BEFORE the controller method runs. With
  orphan dataset_field rows accumulating, the join chain remains
  correct (it resolves to the parent data_entity via the OLD
  dataset_version), but it ADDS one extra DB round-trip per request
  for every dataset_field-targeted endpoint.

  **Term-back-link enumeration is read-collaborative** (listByTerm
  at lines 141-204): given a term id, returns every dataset_field
  linked to the term across all data entities — with NO owner-scoping,
  NO `EXCLUDE_FROM_SEARCH` filter, NO `STATUS != DELETED` filter on
  the parent DataEntity. A field on a soft-deleted DataEntity
  (STATUS=DELETED) still appears in `listByTerm` results. The orphan
  dataset_field rows referenced only by historical dataset_versions
  ALSO appear if linked to a term (the M:N join `DATASET_FIELD_TO_TERM`
  has no version-scoping).

  **Pair with the three-soft-delete-mechanisms invariant**: this
  invariant captures the FIFTH distinct deletion pattern in the
  platform's persistence layer — neither (deleted_at) nor (is_deleted)
  nor (STATUS) nor (HARD-DELETE-on-relationship-edges) applies.
  `dataset_field` has NO own deletion semantic; its lifecycle is
  WHOLLY DRIVEN by the dataset_structure M:N edges, which are also
  not cleaned up. The platform's persistence-layer deletion shape
  is now 5-mechanism × ≥9-site primary-source confirmed.
