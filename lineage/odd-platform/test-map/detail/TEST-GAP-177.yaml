gap_id: TEST-GAP-177
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties
surfaced_by:
- NotificationsProperties.md:bugs_limitations_corner_cases.[3]
- NotificationsProperties.md:security.known_security_gaps.[3]
behaviour: 'No retry / dead-letter / audit on failed notification delivery: `AlertNotificationMessageProcessor.java:30-35`
  catches `NotificationSenderException`, logs at ERROR, moves on. The alert is lost
  from that channel''s perspective with no record in the `ALERT` table that delivery
  failed. No `notification_delivery` table, no metric counter, no Prometheus gauge.
  Concept-flag HIGH.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/FailedDeliveryAuditTest.java
  name: senderThrows_processorCatchesAndLogs_noDbAuditTrail
evidence:
- 'NotificationsProperties.md says: ''AlertNotificationMessageProcessor catches NotificationSenderException,
  logs at ERROR, and moves on — the alert is lost from that channel''s perspective
  and there is no record in the ALERT table that delivery failed. Operators have no
  DB-visible signal that notifications stopped working'''
- concepts.yaml:entities[Notifications].security_aggregate.weaknesses.[0] HIGH
cross_references:
- concepts.yaml:entities[Notifications].security_aggregate.weaknesses.[0]
proposed_action: Add integration test with a Mockito-stubbed `NotificationSender`
  that throws `NotificationSenderException`; trigger fan-out; assert (a) the loop
  continues to the next sender, (b) no row is inserted in the `ALERT` table marking
  delivery as failed, (c) no metric counter is incremented. Locks the no-audit posture
  and converts the future addition of a `notification_delivery` table into a deliberate
  test update.
