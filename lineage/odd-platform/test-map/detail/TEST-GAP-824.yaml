behaviour: |-
  **CRITICAL — Multi-tenant isolation NONEXISTENT on `metrics.storage=INTERNAL_POSTGRES` (the default-on backend). The `odd.tenant-id` config property is a Prometheus-mode-only label; on the default backend, all tenants share one untyped Postgres namespace.**

  **Mechanism**:
  - `odd.tenant-id` (`application.yml:208-210`, default empty) is consumed at **extractor bean construction** via `@Value("${odd.tenant-id}")` — `CounterTimeSeriesExtractor.java:22-25` etc.
  - The PROMETHEUS-side extractors APPEND `tenant_id={value}` as a label on every TimeSeries written to the external Prometheus.
  - The INTERNAL_POSTGRES-side extractors / repository chain DO NOT REFERENCE `tenant_id` at all — `metric_series`, `metric_point`, `metric_family`, `metric_label`, `metric_label_value`, `metric_entity` tables have NO `tenant_id` column (verified at JOOQ POJO level — `MetricEntityPojo`, `MetricFamilyPojo`, `MetricLabelPojo`, `MetricLabelValuePojo`, `MetricPointPojo`, `MetricSeriesPojo` do not declare tenant fields per `InternalIngestionMetricsServiceImpl.java:39-44`).

  **Operator-pain chain**:
  1. Operator configures `odd.tenant-id=tenantA` AND `metrics.storage=INTERNAL_POSTGRES` (the default) — believing they have enabled multi-tenant isolation.
  2. Operator deploys 3 instances of ODD (one per tenant) against the same Postgres cluster.
  3. All 3 instances write metrics to the same `metric_series` / `metric_point` tables with no `tenant_id` column.
  4. Tenant A's data scientists see Tenant B's metrics in their per-DataEntity Metrics tab — no isolation.
  5. The live `/configuration-and-deployment/odd-platform` page (WebFetched 2026-05-20 per ingestMetrics.md docs_link_semantic.inferred_docs.[0]) describes `odd.tenant-id` as "tenant identifier appended as a Prometheus query label" — implicitly Prometheus-only — but does NOT explicitly state that INTERNAL_POSTGRES ignores it. Operators consulting the docs may believe `odd.tenant-id` is universal.

  **Why CRITICAL** (the sidecar rates MEDIUM):
  - Tenant isolation is a load-bearing security property in any multi-tenant deployment.
  - The asymmetry between PROMETHEUS (isolation applied) and INTERNAL_POSTGRES (isolation absent) **inverts** the operator's mental model — the DEFAULT mode is the LESS SECURE one. LSN-001 class: a sensible-looking default produces silent data leak.
  - The leak is **multi-tenant cross-organisation** — far worse than the single-org cross-owner leak class (REFACTOR-024) because tenants are usually different customer organisations.
  - Combined with TEST-GAP-823 (unauthenticated metrics write), an attacker on tenant A can deliberately POLLUTE tenant B's metrics namespace.

  **Test gap shape**: integration test that:
  1. Configures `odd.tenant-id=tenantA` + `metrics.storage=INTERNAL_POSTGRES`.
  2. Posts metrics for ODDRN `urn:..:tenantB:some-entity` (i.e. another tenant's ODDRN).
  3. Asserts the metric_series / metric_point rows are written with NO tenant scoping.
  4. Asserts a tenant-B-configured ODD instance reading the same Postgres sees the polluted data.

  PINS the absence of isolation; pairs with REFACTOR-NNN (add `tenant_id` column + scope) and DOC-GAP-NNN (live docs explicitly state INTERNAL_POSTGRES has no tenant isolation).
