realism_caveats: |
  This probe does NOT claim `favorites=no` is a defect in the wire contract — the optional boolean
  is a deliberate, maintainer-approved decision (contributor/CTRIB-061.md section 6.1 / GATE 1),
  and the API half of the assertions is expected to pass. What it pins is the RENDERED consequence:
  a URL-reachable filter state with no on-screen representation.

  If `checkbox_checked == false` AND `starred_listed == false` both hold, the finding is confirmed
  and the fix space is a product decision, not a bug fix: render the checkbox as indeterminate for
  `no`, surface a dismissible "showing assets you have not starred" chip, or drop `no` from the
  accepted parse values so the URL fails closed to All.

  If `final_search` has lost `favorites=no`, the finding changes shape entirely — it would mean the
  Search.tsx merge-back (Search.tsx:105-112) or the reader is normalising the value, which no read
  of the source predicts; re-read the chain before recording anything.

  The odd-minimal stand is AUTH_TYPE=DISABLED, so this probe cannot distinguish "the anti-join is
  scoped to MY bucket" from "the anti-join is scoped to the shared bucket". Per-identity scoping is
  proved in the backend unit bucket (AssetSearchFavoritesIntegrationTest), not here.
