- id: H-006
  hypothesis: |-
    When a user clicks a class tab and then presses the browser Back button,
    the previous tab (and its result scope) is restored.
  derivation: |-
    The control is rendered as a tab strip (AppTabs); a tab bar promises
    navigation semantics where Back returns to the prior tab. UI-label +
    negative-space seed.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      Tab clicks dispatch a Redux facet mutation and a PUT to the server-side
      session row; they do NOT push to the URL (the route stays
      /search/{searchId} — the same UUID, per F-017 batch-ZI URL-shape
      finding). The tab state lives in `state.dataEntitySearch.facetState` +
      `myObjects`, mirrored to the server row, not in browser history. Pressing
      Back therefore navigates AWAY from /search entirely (to wherever the user
      came from) — it does not restore the previous tab. If the user navigates
      back to /search/{sameUuid}, the restored session reflects the LATEST
      mutated facet state (the server row was overwritten on each tab click),
      not the pre-click tab. There is no history entry per tab.
    evidence:
      - sidecar: feature-flows/detail/F-017.yaml
        section: "batch ZI notes (2)(c) tab navigation drops the session + URL semantics"
        cite: "Results.tsx:83-97 (dispatch, no navigate) + searchRoutes.ts URL-shape"
        note: "tab click mutates server-side row; URL unchanged; no per-tab history entry"
      - sidecar: "(source read)"
        section: Results.tsx
        cite: "Results.tsx:83-100"
        note: "onSearchClassChange only dispatches; no useNavigate/router push"
    operator_visible_failure: |-
      Multiple operator-visible failures: (a) an operator who clicks Datasets,
      then Transformers, then presses Back expecting to return to Datasets is
      instead thrown off the Catalog page entirely (or, if they had history on
      /search, to a stale state); (b) the tab selection cannot be bookmarked or
      shared as a URL distinct from any other tab on the same session — every
      tab on a session shares one UUID; (c) this compounds the F-017
      `searchid_url_param_promises_saved_search_id...` finding — sharing a
      /search/{uuid} link conveys whatever tab the sharer LAST clicked, mutating
      under them. The tab-bar affordance actively mis-signals navigation.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    note: |-
      The highest-severity contradiction of this reflection. Routes to a
      bug-candidate (the fix is either URL-push per-tab or a relabel away from
      tab-as-navigation) AND a functional regression-pin test demand.

