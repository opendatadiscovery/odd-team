description: |-
  ## STRENGTHENED — batch ZI (2026-05-26)

  Batch ZI confirms the finding at FIVE MORE routes (activity / directory
  / search / queryExamples / relationships):

    - activity / directory / search / relationships — BARE mounts (no
      WithPermissionsProvider at all); inherited expectation from this
      invariant — would not change behaviour even if added.
    - queryExamples — wrapped at `DataModellingRoutes.tsx:19-25` (LIST,
      QUERY_EXAMPLE_CREATE) and `:31-37` (DETAILS, QUERY_EXAMPLE_UPDATE +
      _DELETE). Both routes render to ALL authenticated users; the
      `WithPermissions` HOC on the +Add button (`QueryExamples.tsx:36-46`)
      and the Edit (`QueryExampleDetailsContainerActions.tsx:40`) and
      Delete (`:53`) buttons are the actual gates.

  **The queryExamples sidecar's contribution is the SHARPEST evidence
  yet** of the context-seed-not-gate behaviour at PRIMARY-SOURCE: the
  details page explicitly carries a SECOND `WithPermissionsProvider`
  inside `QueryExampleDetailsContainer.tsx:53-64` — this one
  CARRIES the RESOURCE-PERMISSIONS from `useResourcePermissions({
  resourceId: exampleId, ... })` (i.e. the resource-scoped permission
  check is applied at the actions wrapper, not at the route). The
  layering is now triple:
    1. Route mount wrapper (context-only — global permission CONTEXT
       seeded for inner action buttons)
    2. Inner wrapper inside Container (context-only — RESOURCE
       permission CONTEXT seeded for the same buttons)
    3. WithPermissions HOC on each button (DOES BLOCK — returns null
       if permission absent)

  A reviewer reading either of the two `WithPermissionsProvider`
  layers reasonably concludes that some gating happens; in fact, only
  the innermost HOC gates. The cross-batch pattern is now confirmed
  at 10 route sidecars across batches ZH + ZI.

  ## ORIGINAL — batch ZH (2026-05-26)

  **NEW HIGH-severity INVARIANT, batch ZH (2026-05-26)**. The
  `<WithPermissionsProvider allowedPermissions={[...]}>` wrapper used
  at React Router route mounts across the SPA — visible in App.tsx,
  DataModellingRoutes.tsx, ManagementRoutes.tsx, and Management.tsx —
  **does NOT block rendering**. Inspection of
  `components/shared/contexts/Permission/WithPermissionsProvider.tsx:11-49`
  + `PermissionProvider.tsx:12-46` confirms the wrapper unconditionally
  renders its child (`{render()}` at line 25, `<Component />` at line 36,
  or `{children}` at line 46); it only WRAPS the child in
  `PermissionProvider`, which computes an `isAllowedTo` boolean and
  exposes it via React Context for descendant components to consult.

  **The actual gate is the SIBLING component `WithPermissions`** (no
  `Provider` suffix) at `WithPermissions.tsx:27-29` which DOES return
  `null` when the permission is missing. The naming-vs-behaviour drift
  is the trap: a reviewer reading `App.tsx:75-88` (LookupTables mount)
  or `DataModellingRoutes.tsx:19-25` (Query Examples create-surface
  mount) or `App.tsx:62` -> `Management.tsx:9-12` (Management section
  outer wrap) **reasonably concludes the route is gated** by the listed
  permissions — when in fact only the inner `<WithPermissions>` HOCs
  (on individual buttons, individual form sections) actually block.

  **Confirmed across 5 route sidecars in batch ZH + 5 in batch ZI**:
    - dataModelling route: Query Examples + Query Example Details
      wrapped in WithPermissionsProvider (QUERY_EXAMPLE_CREATE /
      _UPDATE+_DELETE) — both render to ALL authenticated users; only
      the +Add and Edit buttons inside hide.
    - masterData route: LookupTables wrapped in WithPermissionsProvider
      (LOOKUP_TABLE_CREATE / _UPDATE / _DELETE) at App.tsx:75-88 —
      page renders to all; only the +Add new button hides.
    - management route: Management.tsx wraps the entire section in
      WithPermissionsProvider([OWNER_ASSOCIATION_MANAGE]) — only the
      Associations sub-route uses RestrictedRoute (a true guard).
      The other 8 sub-areas (Namespaces/Datasources/Collectors/Owners
      /Tags/Roles/Policies/Integrations) RENDER to every authenticated
      user; only mutation buttons are hidden via WithPermissions HOCs.
    - dataQuality route: NO wrapper at all (bare route); the contrast
      makes the broader pattern visible — even wrapped routes ARE bare
      in practice.
    - terms route: NO wrapper at App.tsx:66; inner TermDetails uses
      WithPermissionsProvider on the header (TermDetails.tsx:59-70 for
      TERM_UPDATE / TERM_DELETE) which seeds context for inner
      WithPermissions buttons.
    - **NEW batch ZI** — activity route: bare at App.tsx:65; no
      wrapper. The platform-wide audit trail is reachable end-to-end.
    - **NEW batch ZI** — directory route: bare at App.tsx:72 (`/directory/*`);
      no wrapper. The four-level browse hierarchy is reachable end-to-end
      by every authenticated user.
    - **NEW batch ZI** — search route: bare at App.tsx:61 (`/search/*`);
      no wrapper. The Catalog page is reachable; only the inner
      "Add group" CTA has a WithPermissions HOC.
    - **NEW batch ZI** — queryExamples route: wrapped at
      `DataModellingRoutes.tsx:19-25` (LIST) and `:31-37` (DETAILS)
      with explicit permission lists; both wrappers are
      context-only and do not block. The details container ADDS a
      THIRD WithPermissionsProvider inside the page carrying
      resource-permissions — same context-only semantic.
    - **NEW batch ZI** — relationships route: bare at
      `DataModellingRoutes.tsx:40`; the ONLY inner route of the Data
      Modelling pillar that is NOT wrapped at all. Combined with the
      ZE finding (RelationshipController has zero authz at any layer),
      the entire chain from URL to repository is open to any
      authenticated caller.

  **The architectural intent IS read-collaborative** (consistent with
  ADR-CANDIDATE-003, REFACTOR-024, the
  `read-collaborative-cross-owner-enumeration` invariant): pages render
  for any authenticated user; only WRITE affordances are gated. But
  the wrapper's NAME promises an access gate that doesn't exist. The
  result:
    (a) A future maintainer auditing route-level RBAC by reading
        App.tsx or any *Routes.tsx file alone concludes the page IS
        gated — and may ship a configuration change that depends on
        a non-existent gate (e.g. removing a "redundant" inner
        WithPermissions HOC believing the route wrapper handles it).
    (b) An operator reading the docs cannot tell from "RBAC-gated by
        QUERY_EXAMPLE_CREATE" (per data-modelling.md, WebFetched
        2026-05-26 status 200) what part of the surface the gate
        actually applies to — the doc phrasing IS more restrictive
        than the implementation.
    (c) The "every() AND-of-permissions" semantic at
        PermissionProvider.tsx:21-25 compounds the trap: a route mount
        listing `[QUERY_EXAMPLE_UPDATE, QUERY_EXAMPLE_DELETE]` requires
        BOTH permissions for the context to evaluate `isAllowedTo: true`
        — but since the wrapper doesn't gate, this AND semantic only
        affects what the inner `WithPermissions` buttons render. A
        user with one-but-not-both still lands on the page.

  **Audit-trail consequence**: the route mount's `allowedPermissions`
  array IS effectively documentation-shaped — the listed permissions
  ARE the inner-button permissions that will be queried via context.
  But the wrapper at the mount site is misleading code: a reviewer
  cannot grep for "route gates" by searching `WithPermissionsProvider`;
  the actual route gates are the one (Management/Associations:
  RestrictedRoute) + the dynamic in-button HOCs.

  **Fix surfaces** (maintainer-triage):
    (1) Rename `WithPermissionsProvider` -> `PermissionsContextProvider`
        or `PermissionsSeed` so the name reflects context-only behaviour.
    (2) Add a JSDoc warning at WithPermissionsProvider.tsx:11
        explaining the no-block semantic with `WithPermissions`
        cross-reference.
    (3) Document the read-collaborative posture on each pillar's doc
        page so operators don't mis-read "RBAC-gated by PERM" as
        "page-blocked by PERM".

  vocabulary_status: codebase-anchored, NOT in docs. The live doc
  pages (data-modelling, master-data-management, etc.) use phrasing
  ("RBAC-gated by PERM") that is more restrictive than the
  implementation. Surfaces here for canonical-vocabulary review.
