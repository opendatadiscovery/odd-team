name: |-
  tsquery operator-injection via persisted state (DoS via every facet aggregator)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-01
description: |-
  NEW INVARIANT, batch 2026-05-19M — JooqFTSHelper.tsQuery at JooqFTSHelper.java:164-168
  does not escape Postgres tsquery operators in user-supplied search query text
  before passing the result to to_tsquery(?) at JooqFTSHelper.java:100-105. The
  function is a per-word splitter:
  Arrays.stream(plainQuery.split(" ")).map(q -> q + ":*").collect(Collectors.joining("&"))
  — every word becomes a "prefix-match" token AND-joined. But if the user-supplied
  query contains tsquery metacharacters that to_tsquery treats as syntax
  (!, (, ), :, <->, &, |, single-quote, backslash), those characters are NOT
  escaped before reaching the Postgres parser. **Two attack surfaces on the
  persisted query_string in search_facets**: (a) **SQL parser DoS via persistent
  corruption** — a caller POSTs a search with query = "foo )( bar"; the row is
  persisted with that query verbatim; every SUBSEQUENT facet aggregator that
  joins to SEARCH_ENTRYPOINT applying ftsCondition(SEARCH_ENTRYPOINT.SEARCH_VECTOR,
  state.getQuery()) fails at to_tsquery parse time with Postgres 42601 syntax
  error in tsquery — the session is permanently broken (the row is reachable
  but every facet read 500s); (b) **silent semantic re-interpretation** — a
  balanced tsquery expression that happens to parse (e.g. "foo & bar | baz")
  re-interprets at to_tsquery time with completely different match semantics
  than the user expected — the response is "wrong but not failing". **Reached
  from FIVE distinct invocation sites** in the facet aggregator suite at
  ReactiveSearchFacetRepositoryImpl.java:182 (entity-class), :267 (type),
  :339-407 owner aggregator's ftsCondition site, :469 (group), :582 — every
  facet GET triggers the same parse path. The injection is bounded by Postgres
  tsquery semantics (the parser does not eval SQL — it raises 42601), but it
  IS a denial-of-service surface AND it is the SAME code path that batch H
  flagged on getHighlightedResult. The facet endpoints are SECOND, THIRD, FOURTH,
  FIFTH, SIXTH invocation sites for the same bug. **Severity**: HIGH.
