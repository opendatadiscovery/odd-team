  validation:
    verdict: contradicted
    actual_behavior: |
      Every non-DISABLED mode ends its chain with .pathMatchers("/**").authenticated(),
      BUT /ingestion/** is in WHITELIST_PATHS and is permitAll'd BEFORE that
      catch-all (AuthorizationCustomizer:22-23 for OAUTH2/LDAP;
      LoginFormSecurityConfiguration:50 for LOGIN_FORM). So switching auth.type
      away from DISABLED does NOT start requiring authentication on the ingestion
      namespace — the whitelist exempts it in every mode. (IT-009 proves the
      auth.type boundary on a NON-whitelisted endpoint /api/dataentities/classes;
