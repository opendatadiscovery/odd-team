terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Full Management directory (Owner / Datasource / Collector / Title /
    Namespace lists; OAR activity log; IdP provider list) rendered into
    HTTP 200 response body — to any authenticated user (and any
    anonymous caller under DISABLED). Collector list includes masked
    token last-6-chars (TokenMapper.java:15-18).
  evidence: "TokenMapper.java:15-18 (last-6-chars) + 7 controller list methods"
observed_vs_expected:
  facets:
    - drift_class: management_read_collaborative_posture_undocumented_across_seven_surfaces
      description: |-
        Implicit ADR-CANDIDATE-003 "read-collaborative posture" applies to
        all seven Management read surfaces uniformly — yet the live
        `/permissions` doc names no `*_READ` permissions, and the
        `/features/management` page does not warn operators that
        withholding `*_CREATE` does not restrict reads. Operator-expectation
        mismatch is the LOAD-BEARING drift.
      evidence:
        - "SecurityConstants.java:98-162 (5 *_CREATE/UPDATE/DELETE blocks; NO *_READ; NO GET-rule)"
        - "AuthorizationCustomizer.java:29-30 (catch-all to authenticated())"
    - drift_class: collector_masked_token_last_six_chars_anonymous_under_disabled
      description: |-
        Under `auth.type=DISABLED`, the Collector list endpoint returns
        the last-6-chars of every collector token to any anonymous
        caller. Narrows brute-force search space for the non-CSPRNG token
        entropy class (cross-link F-020 / SHB-091).
      evidence:
        - "TokenMapper.java:15-18 (last-6-chars rendering)"
        - "DisabledAuthSecurityConfiguration.java:13-18 (permitAll under DISABLED)"
    - drift_class: idp_provider_topology_fingerprintable_anonymous_under_disabled
      description: |-
        GET /api/owners/providers enumerates the deployment's auth
        provider topology (LOGIN_FORM / OAUTH2_GOOGLE / OAUTH2_GITHUB / LDAP).
        Reachable by any authenticated user (and anonymous under
        DISABLED). A compromised low-privilege user fingerprints the
        deployment for phishing campaign tailoring.
      evidence:
        - "OwnerAssociationRequestController.java:81-85"
        - "SecurityConstants.java:148-162 (no rule for OAR controller)"
    - drift_class: owner_association_activity_log_full_forensic_dataset_anonymous_reachable
      description: |-
        GET /api/owner_association_request/activity exposes the historical
        "who approved Alice's binding to Owner-X at T" record set — a
        richer forensic dataset than the live request list — to any
        authenticated session.
      evidence:
        - "OwnerAssociationRequestController.java:47-53"
        - "SecurityConstants.java:148-162 (no SecurityRule)"
    - drift_class: title_directory_reveals_policy_vocabulary_for_reverse_engineering
      description: |-
        GET /api/titles enumerates every role-label string operators have
        ever attached to ownership records. Combined with Policy conditions
        `dataEntity:owner:title == 'X'`, an attacker can reverse-engineer
        the deployment's policy vocabulary.
      evidence:
        - "TitleController.java:14-24"
        - "system-mission.md:234 (Title directory is read-collaborative)"
    - drift_class: owner_directory_pii_disclosure_surface
      description: |-
        Owner.name typically carries PII (emails, employee handles,
        pseudonymous research identifiers). On public-facing deployments
        hosting personally-named owners, the ungated GET is an
        information-disclosure surface.
      evidence:
        - "SecurityConstants.java:143-147 (no GET-rule)"
        - "F-019 frontmatter (Owner Lifecycle — PII context)"
    - drift_class: openapi_403_response_absent_implicit_design_intent_under_documented
      description: |-
        The OpenAPI spec for these 7 endpoints declares only 200 and 500
        responses — NOT 403 — implicitly confirming the design intent
        that authenticated reads are not gated. The implicit-design-intent
        encoding is invisible to operators reading either the live spec
        page or the live `/permissions` page.
      evidence:
        - "openapi.yaml — no 403 response on any GET in this set"
        - "no DOC-NNN follow-up exists for this implicit-design encoding"
