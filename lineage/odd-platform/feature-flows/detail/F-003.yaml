      — NONE apply EXCLUDE_FROM_SEARCH. Only findByState (via JooqFTSHelper.resultFacetStateConditions line 149) and getDataEntityDefaultConditions
      (line 974 — used by countByDatasourceAndType, getDataSourceEntityTypeIds, getCountByDataSources, getDataEntityDomainsInfo,
      getDataEntityWithOwnership) DO apply it. The Popular case is one of many; my-objects, by-term, and even by-id details
