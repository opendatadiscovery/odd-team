name: AlertServiceImpl.handleExternalAlerts skips AlertActionResolver (deliberate de-dup asymmetry vs applyAlertActions)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
description: |-
  NEW INVARIANT, batch 2026-05-20S (AlertServiceImpl primary source — service-tier
  ENACTMENT POINT of F-007 facet `no_idempotency_no_audit` at the SERVICE layer,
  complementing batch P controller-tier and batch H repository-tier).

  The two alert-ingestion paths in the SAME service class deliberately diverge
  on de-duplication:
    (a) `applyAlertActions` (AlertServiceImpl.java:200-231) consumes `AlertAction`
        objects already pre-grouped by `AlertUniqueConstraint` from
        `AlertActionResolver` (the discriminator dispatch at lines 211-227 shows
        `chunks` already keyed by `AlertUniqueConstraint.fromAlert`). The
        resolver loads the open-alerts snapshot via `getOpenAlertsForEntities`
        (line 197 — which itself takes `FOR UPDATE` lock at the repository,
        per batch H invariant) + halt configs via AlertHaltConfigRepository,
        then computes the diff. The resolver is the de-duplication boundary;
        applyAlertActions trusts its output verbatim.
    (b) `handleExternalAlerts` (AlertServiceImpl.java:151-191) constructs
        AlertPojo DIRECTLY from the webhook payload (lines 174-187) and SKIPS
        the resolver. It builds the unique-constraint key locally via
        `AlertUniqueConstraint.fromAlert(alert)` at line 187 but never consults
        an open-alerts snapshot. The shared `createAlerts` private helper
        (lines 261-300) does NOT de-duplicate at the SQL level (no
        `.onConflict(...)` per batch H ReactiveAlertRepositoryImpl).

  CONSEQUENCE: Prometheus AlertManager retries (on transient network error)
  produce DUPLICATE AlertPojo rows. Two POSTs of the same payload land as two
  rows in the ALERT table. The audit-feed records BOTH (one OPEN_ALERT_RECEIVED
  event per row), but the platform surface (All / per-entity tabs) shows visual
  duplicates with no operator-side dedup indicator.

  AUDIT-LAYER REFINEMENT (cross-batch batch R + batch S correction): the F-007
  `no_idempotency_no_audit` headline refers to the WEBHOOK INGRESS (no `log.info`
  / `@Timed` / correlation-id capture of WHO POSTed the payload), NOT to the
  resulting alert-state-transitions. Per batch R: the resulting `OPEN_ALERT_RECEIVED`
  events DO persist via the batch save path at ReactiveActivityRepositoryImpl.java:
  57-71 with `is_system_event=true` discriminator (batch S confirms at the
  service-tier emission site AlertServiceImpl.java:309-325). The audit gap is
  AT INGRESS ONLY; the alert-state-transitions are audited. This refinement is
  the bridge between F-007 at the network ingress and the F-006 audit-silence
  patterns.

  INTENT-VISIBLE STRUCTURAL SIGNAL: the absence of an AlertActionResolver call
  in handleExternalAlerts (which DOES build the unique-constraint key locally
  at line 187) is the deliberate signal. The maintainer s implicit ADR is "the
  AlertManager webhook path is a thin adapter; loading the open-alerts snapshot
  is the expensive part; the webhook is low-frequency". The architectural reason
  is defensible BUT the operator-facing consequence (duplicate alerts on
  Prometheus retry) is undocumented.

  Severity: MEDIUM (unauthenticated endpoint + low-frequency; combined with
  the cross_tenant_alert_creation facet — payload `entity_oddrn` trust at
  AlertServiceImpl.java:178 — duplicate alerts persist on attacker-chosen
  entities and surface to all authenticated users on the platform-wide All
  tab via the cross-owner read at listAll).
