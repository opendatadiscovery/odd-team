chain:
- hop: 1
  node: odd-platform ts react-component component:QueryExampleDetailsContainer
  sidecar: unresolved
  evidence: |-
    QueryExampleDetailsContainer.tsx:30-31 — reads
    `const tab = searchParams.get('tab') ?? 'overview'` to derive the
    active sub-view. Lines 74-94 — three conditional renderings based
    on `tab` value: 'overview' → QueryExampleDetailsOverview;
    'linked-entities' → QueryExampleDetailsLinkedEntities;
    'linked-terms' → QueryExampleDetailsLinkedTerms. The container
    fetches the FULL details payload (including linkedEntities +
    linkedTerms) on first mount; tab switches are pure client-side
    re-renders, NOT additional fetches.
  multiplicity_per_trigger: 1
- hop: 2
  node: odd-platform ts react-component component:QueryExampleDetailsTabs
  sidecar: unresolved
  evidence: |-
    QueryExampleDetailsTabs.tsx:15-33 — three tabs declared with hint
    badges (`linkedEntitiesHint` = `linkedEntities.pageInfo.total`,
    `linkedTermsHint` = `linkedTerms.items.length`). Lines 37-42 —
    initial tab index resolved by `tabs.findIndex(tab => tab.value === type)`
    where `type = searchParams.get('tab') ?? 'overview'`. Lines 44-53 —
    on tab change writes the new value to `?tab=` URL param via
    `setSearchParams`. Tabs render as `<AppTabs type='primary'>`.
  multiplicity_per_trigger: 1
- hop: 3
  node: odd-platform ts react-component component:QueryExampleDetailsLinkedEntities
  sidecar: unresolved
  evidence: |-
    QueryExampleDetailsLinkedEntities.tsx:12-50 — header row (Name,
    Namespace, Datasource, Owner, Created, Updated) + map over
    `entities` prop rendering QueryExampleDetailsLinkedEntitiesItem per
    row. Empty state via `EmptyContentPlaceholder` (line 47). Per-row
    click navigates to `dataEntityDetailsPath(entity.id)`
    (QueryExampleDetailsLinkedEntitiesItem.tsx:18-20).
  multiplicity_per_trigger: 1
- hop: 4
  node: odd-platform ts react-component component:QueryExampleDetailsLinkedTerms
  sidecar: unresolved
  evidence: |-
    QueryExampleDetailsLinkedTerms.tsx:12-39 — header row (Name,
    Namespace) + map over `terms` prop rendering
    QueryExampleDetailsLinkedTermsItem. Per-row click navigates to
    `termDetailsPath(term.id)`
    (QueryExampleDetailsLinkedTermsItem.tsx:15-17). Cross-pillar P-06
    feed (term details).
  multiplicity_per_trigger: 1
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Three pure-render sub-views — Overview, Linked Entities, Linked
    Terms — selected by `?tab=` URL param; data pre-fetched at container
    mount time, tab switches are zero-network re-renders.
  evidence: |-
    QueryExampleDetailsContainer.tsx:74-94 + QueryExampleDetailsTabs.tsx:15-33
  cardinality_per_call: 0 fetches per tab switch
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — confirmed from primary source. Single backend fetch at mount
  time via `useGetQueryExampleDetails`; subsequent tab switches consume
  the same cached payload. The hint badges (count of linked entities +
  count of linked terms) are derived from the SAME payload, not separate
  count endpoints.
observed_vs_expected:
  facets:
  - drift_class: query_example_details_tab_url_param_no_runtime_validation_arbitrary_strings_fall_through_to_overview_silently
    description: |-
      QueryExampleDetailsContainer.tsx:31 reads
      `searchParams.get('tab') ?? 'overview'` — for `?tab=foo` the value
      is `'foo'`, none of the three conditional render branches at lines
      74, 80, 85 match, so the user sees the page HEADER but BLANK BODY.
      QueryExampleDetailsTabs.tsx:38 derives the active tab via the same
      `findIndex` — for `'foo'` returns `-1`, so AppTabs shows NO active
      tab. The user lands on a page with NO active tab + NO content —
      silent UX degradation. Same shape as F-037's
      `relationships_type_url_param_no_runtime_validation_arbitrary_strings_propagate_to_backend`
      family — URL-as-typed-state without runtime validation.
    evidence:
    - QueryExampleDetailsContainer.tsx:30-31 (tab fallback chain)
    - QueryExampleDetailsContainer.tsx:74,80,85 (three exhaustive conditional renders)
    - QueryExampleDetailsTabs.tsx:38 (findIndex returns -1 for invalid tab)
    ui_unverified: false
    severity: LOW
  - drift_class: query_example_details_linked_entities_hint_uses_page_info_total_but_linked_terms_hint_uses_items_length_inconsistent_counting_pattern_for_paginated_vs_unpaginated_collections
    description: |-
      QueryExampleDetailsContainer.tsx:69 passes
      `linkedEntitiesHint={queryExampleDetails?.linkedEntities.pageInfo.total}`
      (total across all pages) BUT line 70 passes
      `linkedTermsHint={queryExampleDetails?.linkedTerms?.items.length}`
      (length of items array — the count visible on the current page).
      If linkedTerms is paginated, the hint understates; if not paginated,
      both fields are equivalent. The two collections receive DIFFERENT
      counting treatment. Operators see a badge "5" on Linked Terms even
      if 30 are linked but only 5 fetched. Per F-037 sibling pagination
      facet — same shape: pagination-aware counts versus item-array
      length.
    evidence:
    - QueryExampleDetailsContainer.tsx:69 (linkedEntities total from pageInfo)
    - QueryExampleDetailsContainer.tsx:70 (linkedTerms count from items.length)
    ui_unverified: true  # depends on whether linkedTerms is server-paginated; backend schema not read in this slice
    severity: LOW
  - drift_class: query_example_details_no_breadcrumb_back_to_list_page_user_relies_on_browser_back_or_left_sidebar_tab
    description: |-
      QueryExampleDetailsContainer.tsx has NO breadcrumb component;
      no "Back to Query Examples" link. The user navigating from the
      list page must rely on browser Back button OR re-click the
      DataModellingTabs sidebar "Query Examples" tab (which returns to
      the list but with the original search session URL state, not the
      browser-Back behaviour). Same UX paper-cut shape as F-037
      Relationships row-click (which lands on a data-entity overview
      with no breadcrumb-back-to-Relationships). Operators using
      deep-links from external tools have no in-page navigation
      affordance back to the catalog.
    evidence:
    - QueryExampleDetailsContainer.tsx:44-95 (entire JSX — no breadcrumb)
    ui_unverified: false
    severity: LOW
  - drift_class: query_example_details_linked_entities_and_linked_terms_pure_render_no_inline_unlink_or_edit_affordance_management_only_via_external_data_entity_or_term_page
    description: |-
      QueryExampleDetailsLinkedEntities + QueryExampleDetailsLinkedTerms
      are READ-ONLY tables. To remove a linked entity, the user must
      navigate to that data entity's page (via the row click) and
      remove the link from there. To remove a linked term, similarly
      via the term page. There is NO inline unlink button on this
      page. The link-CRUD endpoints live on DataEntityController +
      TermController per F-025 existing
      `query_example_partial_rbac_grid_split_across_three_controllers`
      facet. The UI design CONFORMS to the backend split but creates
      a workflow paper-cut: an operator wanting to disconnect a query
      example from three datasets must visit three separate data-entity
      pages.
    evidence:
    - QueryExampleDetailsLinkedEntities.tsx:12-50 (read-only table)
    - QueryExampleDetailsLinkedEntitiesItem.tsx:18-20 (row click navigates away)
    - QueryExampleDetailsLinkedTerms.tsx:12-39 (read-only table)
    - QueryExampleDetailsLinkedTermsItem.tsx:15-17 (row click navigates away)
    ui_unverified: false
    severity: LOW
