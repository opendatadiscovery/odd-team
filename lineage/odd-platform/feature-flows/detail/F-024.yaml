feature_name: Term Search & Browse — Dictionary tab catalog-wide term enumeration via faceted search with URL-backed server-side sessions
discovered_from_entry_point: ui_route:/termsearch/* (App.tsx:63 + termsRoutes.ts:5 TERMS_SEARCH_PATH)
description: |-
  The Dictionary tab is the Data Glossary pillar's catalog-wide term browse
  surface — operators reach `/termsearch/*` to enumerate every Term across
  every namespace, filter by faceted axes (namespace + tag + owner), search
  by free-text query, paginate the result set, and click through to per-term
  detail pages. The TermSearch.tsx component (90 lines) creates a server-side
  search session via POST /api/termsearch on first mount (no URL parameter),
  navigates to /termsearch/{sessionUuid} to capture the session in the URL,
  restores existing sessions via GET /api/termsearch/{searchId} on
  deep-link/reload, and debounces facet-state mutations at 1500ms leading-edge
  before dispatching PUT /api/termsearch/{searchId} via the updateTermSearch
  thunk. The terminal side effects are db-write (server-side `search_facets`
  session row INSERT/UPDATE) + page-render (the TermSearchResults child
  renders the paginated catalog).

  The capability is structurally analogous to F-017 Search Facets (Discovery
  pillar `/search/*`) — both use the same server-side session model with
  URL-backed UUID, both rely on `SearchFacetsHousekeepingJob` TTL eviction
  (default 30 days per F-010 / LSN-018), both expose a faceted-filter sidebar
  + free-text search input + paginated results. The Dictionary tab is
  Data Glossary's equivalent for terms; F-017 is Discovery's equivalent for
  data entities.

  This is a sibling capability to F-002 Term-to-Entity Linkage — F-002 is
  the term LINKING surface (the controller-tier write paths that create
  data_entity_to_term rows); F-024 is the term BROWSING surface (the UI
  list view that operators use to find terms). They share contributing
  nodes (TermController + TermServiceImpl + ReactiveTermRepositoryImpl)
  but the user-observable contracts differ: F-002 is "I link a term to
  an entity"; F-024 is "I find a term in the catalog".
