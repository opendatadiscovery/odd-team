name: Two ingestion filters with asymmetric auth — datasource always-on, entity opt-in; FOUR sibling endpoints uncovered
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-10
description: |-
  **STRENGTHENED INVARIANT, batch 2026-05-20-Z** — promoted from
  3-endpoint observation (batch P) to 7-endpoint observation. The
  `/ingestion/**` namespace contains AT LEAST seven distinct endpoints
  with FOUR DIFFERENT auth postures, all silently asymmetric:

  **Filter-1 ALWAYS-ON** (IngestionDataSourceFilter @Component line 15
  — NOT gated by @ConditionalOnProperty):
    - `POST /ingestion/datasources` (entry point — controller throws
      `IllegalStateException("Collector id is null")` without a valid
      token at IngestionController.java:54, so the filter MUST run)

  **Filter-2 OPT-IN OFF-BY-DEFAULT** (IngestionDataEntitiesFilter
  @Component line 19 — gated by
  @ConditionalOnProperty(value="auth.ingestion.filter.enabled",
  havingValue="true"), default false per application.yml:48):
    - `POST /ingestion/entities` (exact-literal path matcher at
      IngestionDataEntitiesFilter.java:28, HttpMethod.POST only)

  **NO FILTER — UNAUTHENTICATED IN EVERY DEPLOYMENT POSTURE** (covered
  by NEITHER filter; in `SecurityConstants.WHITELIST_PATHS` /ingestion/**
  line 96 so UI auth doesn't fall through):
    - `POST /ingestion/alert/alertmanager` (third-party-shaped webhook —
      no collector token to validate; existing
      `entity-oddrn-trust-from-alertmanager-webhook` invariant)
    - `POST /ingestion/entities/datasets/stats` (DQ statistics — batch Z
      new: sub-path of /ingestion/entities NOT matched by exact-literal
      filter matcher)
    - `POST /ingestion/metrics` (metrics ingestion — batch Z new: not
      matched by either filter, no IngestionMetricsFilter exists)
    - `GET /ingestion/entities/{deg_oddrn}` (DEG membership READ — batch Z
      new: GET method + sub-path NOT matched by POST-only filter)

  **The HIGH-severity operator-trap STRENGTHENED batch Z**: the S2S doc
  page recommends `auth.s2s.enabled` + `auth.ingestion.filter.enabled: true`.
  An operator enabling both reasonably believes "ingestion is locked
  down." In reality:
    - `/ingestion/datasources` is ALREADY always-on regardless of either
      flag (sibling filter is unconditional);
    - `/ingestion/entities` becomes opt-in protected when the property
      is true — but ONLY this ONE PATH out of 7+ /ingestion/* endpoints;
    - FIVE sibling /ingestion/* endpoints remain unauthenticated under
      EVERY flag combination (the four NO-FILTER endpoints above).

  **Seven distinct ingestion endpoints, FOUR distinct auth postures**:
  always-on (filter unconditional, 1 endpoint) / opt-in (filter
  conditional / off-by-default, 1 endpoint) / always-off-with-third-party-
  shape (1 endpoint — AlertManager webhook) / always-off-S2S-stats-or-
  metrics-or-read (3+ endpoints — sub-paths not matched by exact-literal
  matcher OR HTTP method not matched). The asymmetry is invisible to
  operators reading the docs; the property name `auth.ingestion.filter.enabled`
  reads as "lock down ingestion globally" but its scope is exactly ONE
  endpoint.

  **Live docs surface this — but at the wrong page**: the Security page
  (WebFetched 2026-05-20, status 200) EXPLICITLY enumerates the
  uncovered paths — quote: 'IngestionDataEntitiesFilter uses an exact path
  matcher (/ingestion/entities, POST) ... sibling endpoints remain
  unprotected by this filter ... Other ingestion paths like
  /ingestion/alert/alertmanager, /ingestion/entities/degs/children, and
  /ingestion/entities/datasets/stats fall back to UI authentication
  behavior determined by auth.type.' The Security page is correct on
  the enumeration BUT incorrect on the fallback — `/ingestion/**` is in
  WHITELIST_PATHS so UI auth does NOT fall through. The doc surface
  has both (a) the asymmetry surfaced (at the right place — security
  page) and (b) a subtle inaccuracy about the fallback (the UI auth
  doesn't apply — the namespace is whitelisted).

  **Composes with REFACTOR-185 (DISABLED-mode bypass + LOGIN_FORM-ADMIN +
  AUTH-MODE-ORTHOGONAL facet — 27-sidecar batch Z extension)**: under
  `auth.type=DISABLED` the UI auth chain is bypassed entirely. The
  `IngestionDataSourceFilter` STILL runs and STILL requires a valid
  token — but an attacker who can reach the platform can create a
  Collector via the OPEN UI (`POST /api/collectors`), copy the
  generated token, and then call `POST /ingestion/datasources` with
  the freshly-issued token. The DISABLED-mode bypass extends to
  datasource creation by composition. Under any other auth mode the
  AUTH-MODE-ORTHOGONAL facet of REFACTOR-185 enables direct
  unauthenticated reach to the 4 NO-FILTER endpoints.

  ## STRENGTHENED batch 2026-05-25-ZF — IngestionController CLASS-LEVEL roll-up

  Batch ZF adds the CLASS-LEVEL sidecar
  (IngestionController.controller-class) that consolidates the seven
  per-method observations into a single ROW-PER-ENDPOINT matrix the
  per-method sidecars never expressed:

  - **5-endpoint × 2-filter × 4-auth-mode = 40-cell matrix** — the
    class-level sidecar enumerates ALL 5 controller methods crossed
    with the two filter classes (IngestionDataSourceFilter,
    IngestionDataEntitiesFilter) and the 4 auth modes (DISABLED,
    LOGIN_FORM, OAUTH2, LDAP). 32 of 40 cells are unauthenticated.
    The matrix is not documented anywhere in the repo (Grep
    `auth.ingestion.filter.enabled` returns 6 source files + 3 docs
    pages; NONE presents the full matrix).

  - **Class-level identity-resolution bifurcation** — the controller's
    5 methods use TWO different identity-resolution mechanisms:
    `createDataSource` reads the WebSession (collector identity
    bootstrapped by IngestionDataSourceFilter); the other 4 methods
    extract identity from PAYLOAD ODDRNs or PATH variables. This
    asymmetry is visible only at the class-level reading; per-method
    sidecars saw only one half of the split.

  - **LOGIN_FORM is STRICTER than OAUTH2/LDAP** for 3 of the 5
    ingestion endpoints (the nested paths
    /ingestion/entities/datasets/stats, /ingestion/metrics,
    /ingestion/dataentitygroups/{deg_oddrn}/entities). LOGIN_FORM's
    permittedPaths array (LoginFormSecurityConfiguration.java:50) lists
    ONLY `/ingestion/entities` + `/ingestion/datasources` — the 3
    nested paths fall through to `pathMatchers("/**").authenticated()`
    line 57. OAUTH2 / LDAP use the WHITELIST_PATHS `/ingestion/**`
    wildcard — ALL ingestion paths bypass auth. This 4-mode
    disjointness is a NEW finding from the class-level matrix;
    PROBE-NEEDED to verify at runtime (P-146).

  - **NO @Slf4j usage at the controller layer** despite the @Slf4j
    annotation at line 30 — zero auditability of ingestion events at
    the controller layer. Strengthens the audit-silence story across
    the ingestion path.

  - **Response-code drift** — the 3 mutating handlers exhibit 3
    different response-code shapes (postDataEntityList 200,
    postDataSetStatsList 201, ingestMetrics 201) — drift cross-link to
    `openapi-status-code-drift-batch-w-extension-to-7-controllers`.

  - **Transaction-boundary disagreement** — `postDataEntityList` +
    `createDataSource` are `@ReactiveTransactional` at the IMMEDIATE
    service tier; `postDataSetStatsList` + `ingestMetrics` defer the
    boundary to downstream service classes (DatasetFieldServiceImpl,
    InternalIngestionMetricsServiceImpl). The split has no comment
    explaining the choice.

  **Severity**: HIGH — operator-facing documentation drift on a
  security knob whose name claims more scope than it has; combined
  with the F-007 unauthenticated webhook path + the batch-Z three
  new S2S-uncovered endpoints, the seven-way asymmetry is invisible
  in operator-facing docs at the point of endpoint discovery. The
  batch-ZF class-level matrix is the most economical artefact for a
  maintainer to read end-to-end.
