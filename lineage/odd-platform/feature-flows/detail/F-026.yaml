cross_pillar_relationships:
- pillar_id: P-01
  kind: feeds
  via: |-
    Lookup Tables are themselves Data Entities of sub-type
    `DataEntityTypeDto.LOOKUP_TABLE` inside class `DATA_SET`
    (DataEntityClassDto.java:43) — they surface in Discovery's search,
    directory drill-down, and Catalog Overview entity reports. The same
    Discovery / Lineage / Search / Tag / Owner / Description model applies
    to lookup tables as to any other DATA_SET sub-type. Cross-link to
    F-001 / F-003 / F-017 / F-023 (Data Discovery family).
- pillar_id: P-09
  kind: shares_data_with
  via: |-
    The 9 LOOKUP_TABLE_* permissions use the NO_CONTEXT resolver
    (SecurityConstants.java:114, 325) — contrast with TERM (TERM
    resolver at lines 174-193) and DATA_ENTITY (DATA_ENTITY resolver at
    lines 194-227). A Policy granting LOOKUP_TABLE_UPDATE permits
    modifying ANY lookup table, not just those owned by the user's
    Owner. This is the architectural inconsistency in the SecurityConstants
    table; the read-collaborative posture extends to lookup tables but
    the permission-scope inconsistency is its own architectural concern.
- pillar_id: P-05
  kind: feeds
  via: |-
    Lookup tables are sub-type of DATA_SET — they participate in lineage
    walks via the same lineage-edge primitives (parent_oddrn / child_oddrn /
    establisher_oddrn). Per system-mission.md:175 "Lookup Tables are
    themselves Data Entities", they surface in lineage graph traversal
    (F-005) alongside other DATA_SETs.
- pillar_id: P-11
  kind: feeds
  via: |-
