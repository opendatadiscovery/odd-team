name: |-
  DEG-membership read vs write authorization asymmetry
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-05
  - P-01
description: |-
  NEW INVARIANT, batch 2026-05-19M — the DEG-membership feature exposes
  fine-grained authorization asymmetry between WRITE operations (gated by
  RBAC permissions) and READ operations (entirely UNGATED at the DEG layer).
  **WRITE side**: addDataEntityToDEG (DataEntityServiceImpl.java:388-408)
  and deleteDataEntityFromDEG (DataEntityServiceImpl.java:411-438) are gated
  by DATA_ENTITY_ADD_TO_GROUP and DATA_ENTITY_DELETE_FROM_GROUP permissions
  respectively (verified by SecurityConstants.java:228-236 SecurityRule
  entries per batch L sidecars on addDataEntityDataEntityGroup +
  deleteDataEntityFromDataEntityGroup). **READ side**: getDataEntityGroupsLineage
  (DataEntityController.java:275-281 GET /api/dataentitygroups/{id}/lineage)
  has NO SecurityRule entry — verified by Grep dataentitygroups.*lineage in
  SecurityConstants.java returns zero matches; falls through to
  pathMatchers("/**").authenticated() at AuthorizationCustomizer.java:29-30.
  The read endpoint also lacks a fetchAssociatedOwner() call at the service
  layer (LineageServiceImpl has no AuthIdentityProvider field — verified by
  reading LineageServiceImpl.java:54-57) — there is NO per-DEG ownership check
  anywhere in the chain. **Operator-facing consequence**: a multi-team DEG
  (e.g. a Domain) is structurally protected on its WRITE side (only users
  with DATA_ENTITY_ADD_TO_GROUP/DELETE_FROM_GROUP can mutate membership) but
  COMPLETELY open on its READ side (any authenticated user can read the
  full member-graph + reachable edges + per-member metadata via the lineage
  endpoint, and the listed children via the DEG detail endpoint). The
  asymmetry is the platform-wide read-collaborative posture (REFACTOR-203
  / REFACTOR-024 family) applied to the DEG-anchored surface. **Severity**:
  HIGH — the asymmetry is operationally invisible (the WRITE-side gate
  suggests RBAC protection; the READ-side bypass undoes it for the most
  sensitive query — graph-shaped co-membership). The doc surface is silent
  on the asymmetry.
