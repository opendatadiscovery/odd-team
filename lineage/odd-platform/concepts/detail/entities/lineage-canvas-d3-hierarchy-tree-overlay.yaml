name: Lineage Canvas (d3-hierarchy tree + crossEdges overlay)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-05
description: |-
  **NEW CONCEPT, batch 2026-05-19J** — the UI rendering primitive for lineage
  visualisation. The Lineage tab on every data-entity detail page renders an SVG
  tree built with `d3-hierarchy` (NOT force-directed, NOT Cytoscape, NOT D3-force).
  Two independent `d3.tree<T>().nodeSize(...).separation(...)` instances are built
  — one for upstream (x-coordinate negated via `-(width + mx)` so it grows leftward),
  one for downstream (grows rightward). Backend-supplied `nodesById + edgesById +
  crossEdges` are SHAPED INTO A TREE by `d3-hierarchy`'s `hierarchy(root, childAccessor)`
  walker. **Critical layout invariant**: `hierarchy(...)` ENFORCES tree topology,
  NOT DAG — visiting the SAME node id along multiple paths yields DUPLICATE
  HierarchyPointNode entries. Diamond shapes (A→B→D, A→C→D) render D TWICE. There
  is no client-side dedupe BEFORE the tree builder runs; React keys at
  LineageGraph.tsx:91 use `node.x${node.y}` so different positions are distinct keys
  and React mounts two SVG nodes. **crossEdges** carry the edges that the BACKEND
  has marked as "not tree-shaped" (cycles, diamonds closures). They are rendered
  SEPARATELY as `<CrossLink>` SVG components (LineageGraph.tsx:69-83) with no
  participation in the tree layout. The crossEdges resolution silently drops edges
  whose endpoints aren't materialised in the tree (generateGraph.ts:81-95) — a
  backend payload skew loses lineage edges invisibly. The choice prioritises layout
  determinism (same input → same SVG coordinates) over visual DAG faithfulness.
  Cost: diamond/DAG duplication; benefit: predictable layout as data grows. No
  virtualisation — every node + every link is mounted as an SVG component; for an
  N-node graph the React tree is O(N) SVG primitives. Pan/zoom via `Zoom<SVGSVGElement>`
  from `@visx/zoom` (`scaleXMin/Max=0.05/2`); transform matrix is JSON-encoded into
  `?t=` URL param for shareability.
