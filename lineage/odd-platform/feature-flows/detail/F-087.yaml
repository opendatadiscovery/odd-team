proposed_action: |-
  Local docker-compose probe: bring up odd-platform with auth.type=LOGIN_FORM
  + session.provider=IN_MEMORY (default). Log in. `curl -v` to capture
  the SESSION cookie attribute set. Confirm absence of Secure / configured
  SameSite. Leave session 7 days; confirm it remains valid (idempotency
  on a GET endpoint). Then under INTERNAL_POSTGRESQL, observe
  spring_session table growth; restart JVM; confirm rows persist + cookie
  still resolves.
notes: |-
  Genuinely new feature shape — no existing F-NNN anchors session cookie
  posture. Closest existing references: F-011 batch Q records "UI has no
  local login form" (the SPA delegates entirely to Spring's framework
  default LoginPageGeneratingWebFilter); this feature is the COOKIE side
  of the same delegation pattern. Cross-link F-011 for the principal flow.
  The LSN-001 / LSN-002 family pattern (silent insecure default, doc-only
  warning, no programmatic guardrail) is the architectural shape — same
  as auth.type=DISABLED, attachment.storage=LOCAL, metrics.storage=INTERNAL_POSTGRES.

