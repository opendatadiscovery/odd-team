feature_id: F-096
feature_name: |-
  Ingestion Batch Atomicity & Error Contract — `POST /ingestion/entities`
  returns Void on a single-transaction-per-batch pipeline with no partial
  success, no per-item error report, no DLQ
pillar_id: P-10
pillar_anchored_id: P-10:F-004
pillar_anchored_feature_name: |-
  Ingestion batch atomicity contract surfaced to custom-collector authors —
  Mono<ResponseEntity<Void>> on success or 5xx-with-generic-body on any
  failure; one bad entity rolls back all entities + every downstream effect
seeded_from: SHB-127
seeded_at: 2026-05-26
