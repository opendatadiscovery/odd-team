      doc_drift_findings[0]. NEW DOC-GAP candidate for doc-gap-finder.
  - facet: DISABLED-mode hides the Popular column entirely from home page (batch J)
    observed: |-
      Overview.tsx:25-27, :53-59 — `isShowOwnerAssociation = Boolean(appInfo?.authType
