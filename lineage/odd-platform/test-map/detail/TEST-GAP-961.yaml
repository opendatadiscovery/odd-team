behaviour: |-
  **CRITICAL — URL-verification CHALLENGE handshake (the ONLY contract Slack uses to register the callback) is fully UNTESTED. If it regresses, Slack rejects the event-subscription configuration AND the entire data-collaboration thread-reply ingest dies silently — failure is asymptomatic on the ODD side.**

  Slack's Events API onboarding: when an operator configures `request_url: https://<ODD_PLATFORM_BASE_URL>/api/slack/events` in the Slack app config UI, Slack sends a one-time URL-verification POST:
  ```
  POST /api/slack/events
  {"token":"...", "challenge":"<random-string>", "type":"url_verification"}
  ```
  Slack expects an HTTP 200 response with body `{"challenge":"<echoed-value>"}` within 3 seconds. If the response doesn't echo the challenge value, Slack marks the URL invalid and **refuses to send any further events to that endpoint until the operator re-verifies**.

  **The current implementation** (`SlackEventParser.java:23-50`) classifies the body into `ParseResultType.CHALLENGE` and `EventApiController.java:25-57` echoes the value back. The path is correct as-shipped. But:
  - Zero tests assert the CHALLENGE round-trip.
  - A refactor of `SlackEventParser.parse` (e.g. moving the URL-verification branch, renaming the field-extraction key, switching to a different deserializer) ships silently.
  - The regression failure mode is **asymptomatic on the ODD platform side**: the controller still returns 200, Discussions doesn't display anything new, no logs show anything wrong. The only signal is in the Slack app config UI, which most operators never check after initial setup.
  - An operator re-installing the Slack app (e.g. after rotating the bot token, after a workspace migration) would discover the regression at the worst moment — production setup, with no test to catch it.

  **Why CRITICAL**: this is the single point of failure for the entire P-07 Discussions sub-feature. A regression here doesn't break a feature — it **silently amputates the feature** with no operator-visible signal until they need to re-subscribe. Combined with the fact that the live `docs.opendatadiscovery.org/active-platform-features/data-collaboration` URL is 404 (per sidecar's WebFetch 2026-05-25), an operator with a regression has nowhere to look for diagnosis.

  **Sidecar's own assessment** (uncovered_behaviours.[0] note): 'If this regresses, Slack rejects the event subscription and the entire data-collaboration thread-reply ingest is silently dead — the failure is asymptomatic on the ODD side; only Slack's app config UI shows the verification failure.'

  **Distinguishes from existing IDs**: TEST-GAP-087 (MEDIUM) covers the disabled-feature 404 contract for the sibling DataCollaboration controller; this CRITICAL is for the ENABLED-feature CHALLENGE handshake on a different controller (EventApiController). No prior TEST-GAP covers the CHALLENGE round-trip.
