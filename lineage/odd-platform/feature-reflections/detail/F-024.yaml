- id: H-007
  hypothesis: "When a user clicks a facet and then immediately presses Enter on a new text query (or vice versa), the final Dictionary view reflects both intentions and does not silently drop the facet selection."
  derivation: "Negative-space — two concurrent session-mutating dispatches (facet PUT with filters vs text PUT with filters:{}) race against the same session row."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      Both dispatches hit PUT /api/termsearch/{searchId} with DIFFERENT payloads —
      the facet PUT carries filters:mapValues(termSearchFacetParams), the text-query
      PUT carries filters:{} (it RESETS filters). Whichever resolves second wins via
      the slice's updateTermsSearchState merge (TermSearch.md bugs_limitations_corner_
      cases[4]). In the steady state the slice's merge preserves local divergences and
      is eventually-consistent, BUT in the specific facet-then-Enter race the text
      query's filters:{} can overwrite the just-clicked facet — the user sees their
      facet selection vanish. It works correctly when the two actions are not
      interleaved within the round-trip window; it loses the facet when they are.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__TermSearch.md
        section: bugs_limitations_corner_cases
        cite: "TermSearch.tsx:50-58 + TermSearchInput.tsx:25-28"
        note: "Facet PUT carries filters; text PUT carries filters:{} — last-write-wins."
    operator_visible_failure: |
      An operator who clicks the 'compliance' namespace facet and then immediately
      types a term name and hits Enter can have the facet silently cleared (the text
      submit ships filters:{} and resolves second). The user perceives "I filtered to
      compliance and searched, but I'm getting results from every namespace" — a
      confusing, intermittent loss of intent. Rare in practice (requires interleaving
      within the PUT round-trip) but reproducible on a slow connection.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate

