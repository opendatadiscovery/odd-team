proposed_action: |-
  Add `RoleServiceImplEmptyRolesInvariantTest.list_userWithEmptyRoles_takesNonAdminBranch_returnsEmptyPage_pinsVacuousNoneMatchInvariant` as a Mockito-style unit test. (a) Mock `roleService.getCurrentUserRoles()` to return `Mono.just(List.of())` (empty). (b) Invoke `roleService.list(1, 10, null)`. (c) Assert the response Page has `data.isEmpty() == true`, `hasNext == false`. (d) `verify(roleRepository, never()).listDto(anyInt(), anyInt(), any())` — the admin path was NOT taken. (e) Add a `// REGRESSION-PIN — A user with EMPTY roles takes the non-admin branch via vacuous noneMatch truth. A REFACTOR flipping noneMatch to anyMatch will silently route empty-role users to the admin path, leaking the full paginated catalog. This test pins the current invariant against that single-character refactor. Pair with the PolicyServiceImpl equivalent test for the SAME pattern on the policy half.` comment block.
