notes: |-
  Coherence (Rule 6): no existing concept describes the path-builder
  convention as a first-class entity. Several invariants reference
  individual path builders (dataQualityPath, lookupTablesPath, etc.)
  but no entry catalogues the SHARED shape. This entity becomes the
  landing page for any future enrichment of route modules.

  Surfaced for canonical-vocabulary review: the convention is
  load-bearing for the SPA's URL contract; worth a developer-guide
  doc page explaining the pattern + the known divergences so new
  feature authors follow it.

  ## batch ZI cross-references
  - `invariant:directory-level-3-url-via-navigate-redirect-not-builder`
    — the Directory module's unique builder-incomplete pattern (level-3
    via Navigate-replace, not via the builder).
  - `invariant:directory-all-magic-string-load-bearing-cross-three-files`
    — the `'all'` literal sentinel pattern.
  - `invariant:search-id-route-param-is-session-uuid-not-saved-search-category-f`
    — the searchId URL-layer Category F drift.
  - `invariant:search-route-wildcard-accepts-garbage-no-uuid-validation`
    — the /* wildcard accepts garbage + the broader-than-necessary
    pattern.
  - `invariant:tab-click-drops-session-state-cross-route-pattern`
    — the AppToolbar's homecoming pattern across Search + Activity tabs.

  Recommended next-batch surface: enrich `dataEntitiesRoutes.ts` (the
  last unenriched route module) to close the full set; then audit
  the routes/ directory holistically for the magic-string +
  inner-Routes-literal-duplication patterns identified across batches
  ZH + ZI. Single-batch repository-wide fix would close the foot-gun
  class.
