behaviour: |-
  Anchor-set unbounded materialisation + in-memory deduplication regression-pin (MEDIUM — P-05+P-09 cross-pillar; performance + authenticated-insider DoS-amp). Three compounding gaps:
  (1) **Anchor-set materialisation has no pagination** — `dataEntityRepository.listByOwner(o.getId())` at `DataEntityRelationsServiceImpl.java:27` fetches ALL owned entities for the user (no `(page, size)` parameters). For an admin owner or CI-bot owner owning thousands of entities, this materialises the entire owned-entity table-slice into the JVM before the lineage step.
  (2) **Lineage IN-clause is unbounded** — `getLineageRelations(oddrns, LineageDepth.empty(), UPSTREAM/DOWNSTREAM)` constructs a CTE with `WHERE PARENT_ODDRN.in(...)` (or `CHILD_ODDRN.in(...)`) where the IN list is the full anchor-set oddrns. Postgres has no hard IN-list cardinality limit but planner cost is non-linear above ~1000 elements.
  (3) **In-memory deduplication defeats SQL pagination** — `.flatMap.distinct.filter.collectList()` at `DataEntityRelationsServiceImpl.java:35-38` materialises the full deduplicated derived-oddrn set in JVM memory before passing to `listByOddrns`. SQL `LIMIT 5 OFFSET 0` then slices the materialised list, but the cost-per-call is fixed by the unscoped derived set size — the `(page, size)` parameters slice the *materialised* derived set, not the lineage neighbourhood.
  Combined with the unbounded controller-layer `size` (no `@Max`, no `maximum:` in OpenAPI), this is an authenticated-insider DoS amplification surface — an admin user pulling `/my/upstream?size=Integer.MAX_VALUE` can saturate JVM heap with the full derived oddrn set and stall Postgres CTE evaluation on a wide anchor. NO test exists exercising the boundary. Cross-pillar P-05 (Data Lineage performance gaps) + P-09 (Security — authenticated DoS-amp).
