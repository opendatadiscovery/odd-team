expected_outcome: |
  Quoting hypothesis H-013 verbatim:
  "When one operator deletes an Owner at the same moment another operator (or an
  ingestion call) attaches a new ownership to that same Owner, the platform
  serialises the two so the result is consistent — either the delete is blocked
  by the new ownership, or the new ownership is rejected because the Owner is
  being deleted; it never produces an ownership row pointing at a deleted Owner."

  The cascade-block in OwnerServiceImpl.delete (lines 90-96) runs three
  existsBy* reads (termOwnership + ownership + userOwnerMapping) then the
  soft-delete UPDATE (line 98) inside ONE @ReactiveTransactional boundary
  (line 88) but with NO row-level lock (no SELECT FOR UPDATE on the owner row,
  no Postgres advisory lock on owner_id) and under READ COMMITTED isolation
  (the Spring/R2DBC default). Static analysis shows a TOCTOU window: a concurrent
  POST /api/dataentities/{data_entity_id}/ownerships that inserts an OWNERSHIP
  row for the same owner AFTER the existence read and BEFORE the delete commits
  would slip past the cascade-check, leaving an OWNERSHIP row pointing at a
  soft-deleted OWNER (a data entity that displays a deleted steward).

  Whether the window is OBSERVABLE depends on runtime facts that cannot be read
  from the source — R2DBC connection-per-transaction acquisition timing, the
  statement ordering inside the reactive pipeline, and Postgres MVCC visibility
  under READ COMMITTED. This probe RUNS the two operations concurrently against a
  local instance, many times, and checks for the inconsistent end-state.

  PASS (H-013 -> confirmed, i.e. the system DOES serialise correctly) if across
  all N concurrent trials EITHER the delete is rejected with HTTP 400 USR004
  (cascade-block saw the new ownership) OR the ownership insert is rejected /
  rolled back when the Owner is concurrently soft-deleted, AND zero OWNERSHIP
  rows reference a soft-deleted OWNER at the end of every trial.

  FAIL (H-013 -> contradicted, REFACTOR-430 empirically confirmed) if ANY trial
  ends with an OWNERSHIP row whose owner_id has deleted_at IS NOT NULL (an
  ownership pointing at a soft-deleted Owner) AND the delete returned 204. The
  fix anchor is then a row-level lock on the owner row during the cascade-check
  (SELECT ... FOR UPDATE) or a Postgres advisory lock on owner_id, mirroring the
  F-076 cross-Management cascade structural-class remediation.
