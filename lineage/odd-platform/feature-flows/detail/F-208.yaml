observed_vs_expected:
  facets:
    - facet_id: unset_stale_period_silently_disables_indicator_class_1_footgun
      drift_class: silent_default_disables_load_bearing_indicator_lsn001_class
      severity: HIGH
      observed: |-
        DataEntityStaleDetector.java:13 — the predicate has a
        `stalePeriod != null` guard. If `odd.data-entity-stale-period` is
        unset in application.yml (or set to null), the predicate returns
        false for EVERY entity. Per SHB-001 caveat 1: "no log, no
        warning, no admin-visible signal that the indicator is dead."
        Same shape as LSN-001 (attachment-ephemeral default) and LSN-002
        (minio-region-unset). The MetadataStale widget renders nothing
        (returns null on isStale=false), so the absence is invisible —
        the UI looks identical to a healthy ingestion.
      expected: |-
        Either (a) default to a sensible value (e.g. 7 days) when the
        config key is absent, OR (b) fail-fast on startup with an
        application.yml validation error, OR (c) emit a startup log
        line announcing "Staleness indicator disabled (config key unset)".
      operator_visible_consequence: |-
        An operator deploying ODD without setting `odd.data-entity-stale-
        period` sees every entity reported as fresh forever. The
        load-bearing signal that "a source stopped publishing" is dead.
        Cross-link to LSN-001 + LSN-002 (the silent-default footgun
        class).
      ui_unverified: true
      ui_unverified_reason: |-
        The default value (or absence thereof) in the application.yml
        shipped artefact has not been verified at primary source this
        pass. SHB-001:24 lists this as a verification step.
    - facet_id: never_ingested_entity_reported_as_fresh_semantic_drift
      drift_class: never_ingested_entity_reports_is_stale_false_semantic_drift
      severity: MEDIUM
      observed: |-
        DataEntityStaleDetector.java:13 — the `pojo.getLastIngestedAt() !=
        null` guard means an entity that has NEVER been ingested (e.g. a
        manually-created data entity, or an entity pending its first
        ingestion) reports `is_stale: false`. The operator sees "fresh"
        for an entity that has no data at all. Per SHB-001 caveat 2.
      expected: |-
        Either (a) a third visual state ("never ingested") rendered by
        MetadataStale, OR (b) document the semantic at the predicate +
        the user-facing surface ("a data entity that has never been
        ingested is not reported as stale; absence of stale is not
        confirmation of freshness").
      operator_visible_consequence: |-
        Operators creating data entities manually (or registering them
        ahead of the first ingestion) see them as healthy until the
        platform-stale-period elapses past lastIngestedAt — but
        lastIngestedAt never materialises, so the entity is "fresh"
        indefinitely. The signal is silently absent for the class of
        entities most at risk of being orphaned.
      ui_unverified: false
    - facet_id: ingestion_write_forgery_freshness_no_source_authenticity_check
      drift_class: ingestion_write_forgery_freshness_no_provenance_check
      severity: MEDIUM
      observed: |-
        DataEntityStaleDetector.java:13 — the predicate has no notion of
        source authenticity. Anyone with ingestion-write capability can
        forge freshness by emitting an ingestion event with a current
        timestamp. Per SHB-001 caveat 3. May be deliberate (multi-tenant
        ingestion is part of the threat model) but is not documented.
      expected: |-
        Either (a) document the integrity boundary explicitly ("any
        actor with INGESTION_WRITE on a data source can mark any entity
        as fresh"), OR (b) introduce a provenance check (the ingestion
        event must originate from the registered collector for the entity's
        source).
      operator_visible_consequence: |-
        An attacker (or a misconfigured collector) emitting bogus
        timestamps can mask a genuinely-stalled source as healthy. The
        platform's most prominent data-trust signal can be silently
        falsified.
    - facet_id: clock_skew_flicker_horizontally_scaled_deployments
      drift_class: clock_skew_flicker_stale_indicator_per_node_horizontal_scale
      severity: LOW
      observed: |-
        DataEntityStaleDetector.java:13 — `DateTimeUtil.generateNow()` is
        called per mapper invocation. If platform nodes have wall-clock
        skew and an entity's lastIngestedAt is within `stalePeriod ± skew`
        of "now," the `is_stale` value flickers across requests depending
        on which node mapped the response. Per SHB-001 caveat 4.
      expected: |-
        Either (a) compute the cutoff once per request (or per cluster-
        synchronized tick), OR (b) document the flicker behaviour at the
        deployment guide.
      operator_visible_consequence: |-
        In horizontally-scaled deployments with non-trivial node clock
        skew, the same entity oscillates between stale / not-stale across
        page reloads. The operator's confidence in the indicator erodes
        with each contradictory load.
    - facet_id: deployment_wide_threshold_no_per_tenant_per_source_window
      drift_class: stale_period_global_no_per_namespace_per_data_source_override
      severity: MEDIUM
      observed: |-
        Per SHB-001:28 — `odd.data-entity-stale-period` is deployment-wide;
        there is no per-tenant / per-namespace / per-data-source threshold.
        Operators of mixed-cadence environments (some sources update
        hourly, some weekly) get a single global window. The widget +
        backend assume one cadence fits all.
      expected: |-
        Either (a) per-data-source `stale-period-days` override that
        composes with the platform default, OR (b) document the global-
        cadence constraint as the supported deployment posture.
      operator_visible_consequence: |-
        A platform serving e.g. a daily-batch warehouse + a streaming
        source either flags the warehouse as never-stale (period set
        long) or flags the streaming source as always-stale (period set
        short). Operators with heterogeneous cadences have no escape.
    - facet_id: metadata_stale_widget_no_visible_difference_when_signal_dead
      drift_class: ui_widget_silent_render_when_indicator_signal_globally_off
      severity: MEDIUM
      observed: |-
        MetadataStale.tsx:12-32 — when `isStale=false` the widget returns
        `null`. Combined with the silent-default footgun (facet 1), a
        platform deployed without `odd.data-entity-stale-period` shows
        ZERO stale icons across every list/detail/lineage surface. The
        UI looks identical to a perfectly-healthy platform. No "indicator
        disabled" banner, no diagnostic affordance, no per-entity
        fallback marker.
      expected: |-
        Either (a) the platform exposes a "staleness configured?" boolean
        the UI can render as a banner when false, OR (b) MetadataStale
        renders a different icon (e.g. grey question-mark) when the
        platform's stale-period is null vs when the entity's lastIngestedAt
        is null vs when the entity is genuinely fresh.
      operator_visible_consequence: |-
        Compounds facet 1 at the UI tier — the same silent-default
        failure-mode that hides the misconfiguration also hides the
        ABSENCE of the signal across the entire UI surface. The widget
        cannot diagnose its own death.
      ui_unverified: false
    - facet_id: per_request_now_evaluation_response_caching_implications
      drift_class: is_stale_response_caching_inconsistent_with_per_request_now_calc
      severity: LOW
      observed: |-
        Because `is_stale` is computed at MAPPER time (per response, per
        request) using `DateTimeUtil.generateNow()`, the field's truth
        boundary is the response timestamp. Any HTTP-layer caching
        (browser cache, CDN, reverse-proxy cache) would freeze the
        is_stale value at the cache-fill time, not the read time. The
        client UI's `MetadataStale` widget receives the cached value and
        renders it as if current.
      expected: |-
        Either (a) explicit Cache-Control: no-store on responses
        containing is_stale, OR (b) UI-tier re-evaluation (the widget
        receives lastIngestedAt + the platform stale-period and computes
        client-side per render).
      operator_visible_consequence: |-
        In deployments behind a caching proxy or with browser cache TTL,
        the stale indicator may lag behind the platform's actual
        assessment. The widget renders stale-data-about-staleness.
      ui_unverified: true
      ui_unverified_reason: |-
        The HTTP response Cache-Control headers on /api/dataentities/*
        endpoints have not been verified at primary source. The actual
        browser-cache behaviour for the relevant endpoints is unknown.
