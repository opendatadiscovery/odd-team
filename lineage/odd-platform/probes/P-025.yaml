realism_caveats: |
  - The assertions match ts_vector LEXEME STEMS ('p025renamedvalu',
    'p025originalnam') rather than literal words, because PostgreSQL's
    to_tsvector with the configured FTS dictionary stems and lowercases
    tokens. The exact stem depends on the FTS config in
    FTS_CONFIG_DETAILS_MAP.get(FTSEntity.DATA_ENTITY); if the probe-runner
    finds the stems differ, it should read the actual tag_vector_text
    capture and adjust the substring. The lexemes were chosen to be
    alphanumeric-only to minimise stemming surprises.

  - The probe primes the BEFORE state with a no-op PUT (same name) so the
    search_entrypoint.tag_vector row exists before the rename. If the
    assignment flow (PUT /api/dataentities/{id}/tags) is preferred as the
    priming mechanism, the probe can be re-arranged — but the no-op PUT
    exercises the exact updateChangedTagVectors path under test, which is
    the cleaner pin.

  - search_old_name (H2) is captured but not asserted via the REST search
    endpoint — the assertion is on the DB tag_vector text, which is ground
    truth and not subject to search-ranking thresholds. If a future
    maintainer wants the end-to-end signal, add an assertion that
    search_old_name_body.items does not contain data_entity 2510.

  - Runs under DISABLED auth — the search-vector refresh is auth-mode
    agnostic; DISABLED minimises setup cost.

  - This probe does NOT verify the updateChangedTagStructureVector arm
    (the structure-search vector, TagServiceImpl.java:164) — that arm only
    fires for tags attached to DATASET FIELDS, and the fixture here tags a
    data entity. A complementary probe (P-025-B, future) should attach the
    tag to a dataset field and assert structure-search propagation.
