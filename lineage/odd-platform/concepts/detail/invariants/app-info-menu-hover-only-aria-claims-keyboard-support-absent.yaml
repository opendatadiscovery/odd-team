notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "ARIA" + "keyboard" + "WCAG" — no existing concept covers
  keyboard accessibility for any UI widget. This invariant is the
  first accessibility-class invariant in the catalog.

  Worth a broader accessibility audit across other UI widgets —
  the AppInfoMenu pattern (mouse-only activation with ARIA-claimed
  keyboard support) may recur on other popups / dropdowns /
  tooltips in the SPA. The current invariant is bounded to the
  AppInfoMenu widget per batch ZJ scope; future audits could
  expand.
