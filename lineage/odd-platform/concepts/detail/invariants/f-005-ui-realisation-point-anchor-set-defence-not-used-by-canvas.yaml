name: F-005 UI Realisation Point — Anchor-Set Defence NOT Used by Lineage Canvas
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-05
- P-09
description: |-
  **NEW INVARIANT, batch 2026-05-19J — UI-LAYER CROSS-CONFIRMATION OF REFACTOR-203
  AT THE LINEAGE CANVAS**. The UI Lineage tab ALWAYS fetches via the
  **NEGATIVE-case** lineage endpoints — `/api/dataentities/{id}/lineage/downstream`
  and `/upstream` (per `thunks.ts:19, 36` calling
  `dataEntityApi.getDataEntityDownstreamLineage` / `getDataEntityUpstreamLineage`).
  The UI does NOT use `getMyObjectsWithDownstream` / `getMyObjectsWithUpstream`
  (the POSITIVE-case anchor-set defence-in-depth pattern from batch G,
  ADR-CANDIDATE-015, used by DataEntityRelationsServiceImpl with
  `authIdentityProvider.fetchAssociatedOwner()` as the anchor). **Consequence**:
  every user (LOGIN_FORM/OAUTH2/LDAP authenticated; anonymous if DISABLED)
  enumerates the cross-owner lineage subgraph from the Lineage tab — the
  user-observable effect of REFACTOR-203. The UI provides NO "restricted view"
  mode, NO "show only my owners" toggle, NO banner indicating cross-owner read.
  **The negative-case fetch pattern IS the canonical UI behaviour** — the
  microservices lineage variant uses the SAME endpoints with the same fetch shape;
  DEG lineage uses `/api/dataentitygroups/{id}/lineage` (also without owner
  anchor). The anchor-set defence-in-depth pattern exists at the backend
  (REFACTOR-225/237 — `getMyObjectsWith{Upstream,Downstream}` endpoints DO scope
  by owner via `authIdentityProvider.fetchAssociatedOwner()`); the UI simply does
  not consume it. **A 1-line architectural change would close this**: add a UI
  toggle "Show only my team's lineage" that switches the fetched endpoint from
  the negative to the positive variant. Today no such UI exists; the canvas is
  the user-visible REALISATION POINT of the read-collaborative posture for
  lineage data.
