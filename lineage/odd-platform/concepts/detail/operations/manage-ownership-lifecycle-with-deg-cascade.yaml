security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      No service-tier permission check (verified via grep). Authorization
      is enforced UPSTREAM at the controller's SecurityRule chain. Under
      DISABLED the chain is bypassed; under LOGIN_FORM the
      AuthorizationCustomizer is not wired (per LoginFormSecurityConfiguration
      finding REFACTOR-073).
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Owner_name is taken VERBATIM from the form, not inferred from the
      principal. A Policy granting DATA_ENTITY_OWNERSHIP_CREATE without a
      "is": "dataEntity:owner" condition lets the holder grant ownership
      on ANY data entity to ANY owner (including a newly auto-created one).
  strengths:
  - @ReactiveTransactional at every public method — atomicity for the
    full lifecycle (owner+title upsert + ownership write + DEG cascade
    + search-vector refresh + filled-flag toggle)
  - DEG-propagation is OPT-IN (propagate: Boolean) — operators
    explicitly choose to cascade
  - Activity-feed emission at the public-method boundary — each
    lifecycle action audited
  - Duplicate prevention via DB-level UNIQUE constraint — friendly HTTP
    400 USR003 surface (not 5xx)
  weaknesses:
  - REFACTOR-199 — Owner directory grows past OWNER_CREATE via
    side-channel auto-create
  - REFACTOR-206 — Title directory grows without any permission gate
    (TITLE_CREATE does not exist)
  - delete flow does NOT refresh FTS vector (search-result staleness)
  - delete flow does NOT validate ownership exists (HTTP 204 masks
    "wasn't there to delete")
  - DEG-propagation cascade emits NO per-child activity events (deliberate
    granularity choice; surfaced separately as audit-feed asymmetry
    invariant)
  - Self-grant decoupling is undocumented at live doc layer
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    Per request DB round-trips (non-DEG create): ~6-8 (getByName/create
    Owner + Title; INSERT ownership; UPDATE search_entrypoint; mark
    filled; activity-handler BEFORE+AFTER getOwnershipsByDataEntityId).
  - |-
    DEG cascade adds: 1 SELECT (entityClassIds), 1 SELECT
    (getDEGEntitiesOddrns), 1 SELECT (listByOddrns), ceil(N/1000)
    INSERT-with-onConflict batches via executeInPartitionReturning.
    For N=10K children: ~13 DB round-trips ON TOP of the base 6-8.
  - |-
    update path re-fetches ownershipRepository.get TWICE (NotFound check
    + response-builder re-fetch).
  throughput_shape:
    verdict: MIXED
    detail: |-
      Single-row CRUD per public method call; DEG cascade adds batched
      UPSERT/DELETE that grows with child count. createOrUpdate is
      partitioned at 1000 rows; deleteByDataEntityAndOwner builds a
      single OR-chain WHERE clause.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless service — instances scale horizontally. @ReactiveTransactional
      holds DB connection from first getByName through final mark-filled;
      DEG-create transactions are the long tail.
notes: |-
  NEW operation captured in batch 2026-05-19K. The service-tier
