proposed_action: |-
  Add `BatchTControllersHttpSmokeTest` (or four separate files — one per controller — folded into one PR) extending `BaseIngestionTest` or `@SpringBootTest(webEnvironment=RANDOM_PORT)` so the test exercises the FULL stack: WebTestClient → SecurityWebFilterChain → OpenAPI-generated controller binding → service → repository → Postgres. ONE @Test method per endpoint, each asserting status code + content-type + response-body schema parity. 12 methods total:
  - ActivityController: `getActivity_happyPath_returns200WithFluxActivity`, `getActivityCounts_happyPath_returns200WithCountInfo`
  - AppInfoController: `getAppInfo_happyPath_returns200WithProjectVersionAndAuthType`
  - DataQualityController: 5 methods (`getDataEntityDataQATests`, `getDatasetTestReport`, `getSLA`, `getDatasetSLAReport`, `setDataQATestSeverity` — including content-type assertions for the PNG endpoint)
  - DirectoryController: 4 methods covering all four levels (`getDataSourceTypes`, `getDirectoryDatasourceList`, `getDatasourceEntityTypes`, `getDatasourceEntities` — the latter two have NO existing coverage)
  Add a parameterised harness if reasonable; pin the wire contract for every operationId. Where deep semantic tests already exist (TEST-GAP-705 PNG/JSON, TEST-GAP-706 cross-owner, TEST-GAP-707 page-vs-count, TEST-GAP-708 DISABLED-mode, TEST-GAP-709 owner-scoping), this CRITICAL harness is the FLOOR — the deep tests sit on top of it. Without this harness the deep tests must each carry their own boilerplate; with this harness they share the WebTestClient + auth-context fixture. Pair with the PR that addresses TEST-GAP-705 / TEST-GAP-706 / TEST-GAP-707 / TEST-GAP-708 / TEST-GAP-709 / TEST-GAP-710 as a single batch-T-HTTP-tier sprint.
