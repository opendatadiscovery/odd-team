notes: |
  Cross-batch composition observation. The destructive shape was first
  surfaced at the controller tier (batch P updateOwner sidecar), then
  confirmed at the UI tier (batch Q OwnersList sidecar). This batch S
  OwnerServiceImpl sidecar is the SERVICE-TIER PRIMARY-SOURCE — the
  file:line evidence at the three composition points.

  The asymmetric-intent observation is the key teaching moment for the
  invariant: the SAME primitive `deleteOwnerRelationsExcept(ownerId,
  List.of())` is used at BOTH the update site AND the delete site;
  the maintainer's intent is "this is the explicit wipe-all primitive";
  the UPDATE site inherits the intent VIA the helper s null+empty
  collapse, producing the destructive UX hazard. This is the rare
  case where the BUG is in the HELPER, not in the consumer — and the
  fix at the helper layer (Path B above) closes the gap at one site
  without disturbing the ADR-CANDIDATE-144 contract.

  Cross-link to F-019 (P-08:F-003 Owner Lifecycle Management) — this
  invariant is the highest-leverage drift facet in F-019; the
  remediation is one-line at the helper + one-line at the OpenAPI
  contract.
