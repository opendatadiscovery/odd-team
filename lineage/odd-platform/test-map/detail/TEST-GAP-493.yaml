proposed_action: |-
  WebFluxTest. (a) Set up data entity X with owner Alice. (b) Pre-seed 3 alerts on X via direct repository write. (c) As user Bob (no ownership of X, no DATA_ENTITY_ALERT_CONFIG_UPDATE, no admin policies), GET /api/dataentities/X/alerts?page=1&size=10. (d) Assert HTTP 200. (e) Assert response body contains all 3 alerts with their `alert_chunk_list` payloads (the AlertManager-derived raw description text). (f) Test comment 'LOCKS the cross-owner read posture as of 2026-05-19. When REFACTOR-NNN adds owner-scoping at the read path, this test FLIPS to expect filtered or 403 results.' Pair-test the soft-delete-inclusive read posture (separate gap — TEST-GAP-502).
