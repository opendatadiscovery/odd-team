behaviour: |-
  **CRITICAL — Per-entity-scoping bypass at `getDataSetStructureByVersionId`: a client calling `GET /api/datasets/{any_id}/structure/{valid_version_id_for_other_dataset}` receives the OTHER dataset's structure. The `data_entity_id` URL parameter is NOT enforced against the `version_id` at the SQL level — the WHERE clause filters by `version_id` only.** Primary-source confirmed in batch-W DatasetController sidecar:

  **Persistence-tier evidence**:
  - `DatasetController.getDataSetStructureByVersionId` (lines 23-30): accepts `dataEntityId` from URL path; passes BOTH to `datasetVersionService.getDatasetVersion(dataEntityId, versionId)`.
  - `DatasetVersionServiceImpl.getDatasetVersion` (lines 39-45): the `datasetId` argument is consumed ONLY by the `NotFoundException` message text — the SQL call ignores it.
  - `ReactiveDatasetVersionRepositoryImpl.getDatasetVersion` (lines 97-144): the WHERE clause at line 129 is `DATASET_VERSION.ID = datasetVersionId` — NO `DATA_ENTITY.ID = datasetId` join condition.
  - Compare to `getLatestDatasetVersion` (lines 160-217, line 167): DOES use `DATA_ENTITY.ID.eq(datasetId)`. Three SQL shapes in the same repository, only one of which scopes.

  **Attack scenario**:
  ```
  # Attacker has authenticated access (LOGIN_FORM / OAUTH2 / LDAP — ANY auth.type with authenticated()).
  # Attacker has NO ownership of dataset 200; dataset 100 is one they can see.

  curl -X GET https://platform/api/datasets/100/structure/999 \
       -H "Authorization: Bearer $TOKEN"

  # Result: if version_id=999 belongs to dataset 200, the response is dataset 200's structure.
  #         The URL path advertised dataset 100; the SQL returns 200.
  ```

  **Blast radius**:
  - **Cross-owner column-metadata enumeration**: any authenticated user can read any dataset's `internal_description`, `internal_name`, tags, terms, metadata-field values, enum-value counts, lookup-table definitions for any version of any dataset in the catalog by brute-forcing version_ids.
  - **`dataset_version.id` is a monotonically increasing surrogate** (jOOQ sequence) — sequential enumeration `/api/datasets/1/structure/{1..N}` walks the entire catalog's version history.
  - **No rate-limit, no audit-log, no soft-delete-filter exclusion** on the endpoint.
  - **Compound with TEST-GAP-770**: the verbatim-storage F-004 XSS read-side surface IS reachable here. Any operator-supplied Markdown / HTML in `dataset_field.internal_description` round-trips verbatim through this endpoint.

  **What the docs claim vs what the code enforces**:
  - Live `https://docs.opendatadiscovery.org/features/data-discovery` (WebFetch 2026-05-20, status 200): describes "Dataset schema diff" as a feature but provides NO API anchor, NO permission model, NO commentary on owner-scoping or who-can-view.
  - Live `https://docs.opendatadiscovery.org/developer-guides/api-reference` (status 200): explicitly omits a `dataSet` sub-page. Per the live page verbatim: "The reference hub documents these feature areas: Alerts, Data Collaboration, Directory, Glossary, Integrations, Lineage, Query Examples, Reference Data, Relationships. None of these sections mention dataset-specific CRUD operations, versioning, or diff functionality."
  - Operators reading the feature description cannot infer the id-confusion behaviour.

  **Why CRITICAL not HIGH (the sidecar's own rating)**:
  - The sidecar rates this HIGH. We elevate to CRITICAL because:
  - **Combined with the cross-owner read posture (no SecurityRule on the 4 endpoints) AND the F-004 verbatim-description payload (TEST-GAP-770)**, this is the canonical cross-tenant enumeration class — every column-level description payload (including ones that may carry sensitive operational text, table-level annotations, or operator-curated notes) is reachable by any authenticated user.
  - **The URL path implies a parent-child relationship that the implementation does not enforce**: operators wiring permission policies on `/api/datasets/{id}/...` reasonably assume the parent is scoped. The mismatch is a permission-model-violation.
  - **Audit-log attribution wrong**: audit logs / tracing tools tagging requests by `data_entity_id` attribute reads to the WRONG dataset. Forensic investigation of "who read this dataset" returns false positives.

  **Test gap shape**: regression-pin asserting: (a) `GET /api/datasets/{A}/structure/{version_id_for_B}` returns dataset B's structure (not A's, not 404); (b) the SQL WHERE clause is over `dataset_version.id` only; (c) `getLatestDatasetVersion` DOES scope (sister contract). The current state is PINNED — failures land if a future maintainer ADDS a `data_entity_id` WHERE clause to the SQL (which would FIX the bypass). When the fix lands, the test inverts to assert 404.
