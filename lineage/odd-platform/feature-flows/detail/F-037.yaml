    drift_class: ui_row_renderer_copy_paste_bug_target_column_displays_source_data
    severity: HIGH
    discovered_at_batch: ZI
    observed: |-
      [FIXED 2026-06-12 — CTRIB-006 / #1752 D1, ships 0.28.0: the Target
      cell reads item.targetDataEntity (commit 46a37f59); IT-077 H-002
      re-grounded RED→GREEN guards the regression. Historical record:]
      RelationshipsListItem.tsx:73-81 renders the Target cell with
      dataEntityId={item.sourceDataEntity.id} +
      name={item.sourceDataEntity.internalName || item.sourceDataEntity.externalName || ''} +
      oddrn={item.sourceDataEntity.oddrn || ''} — identical to the
      Source cell at lines 64-72. The item.targetDataEntity field IS
      present on DataEntityRelationship interface and IS consumed
      correctly by sibling components at
      RelationshipTypes/EntityRelationship.tsx:33-35 +
      GraphRelationship.tsx:32-34. The bug is a COPY-PASTE in the
      list-item renderer only; the user sees the same dataset in
      BOTH columns for every row.
    expected: |-
      Target cell renders item.targetDataEntity.id +
      item.targetDataEntity.internalName/externalName +
      item.targetDataEntity.oddrn — matching the documented behaviour
      at https://docs.opendatadiscovery.org/features/data-modelling/relationships
