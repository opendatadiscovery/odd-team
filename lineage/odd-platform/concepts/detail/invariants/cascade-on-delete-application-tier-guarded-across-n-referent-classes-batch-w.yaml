mitigations_unimplemented:
  - |-
    Document the cascade pattern on every operator-facing
    /features/management/{tab} page. Explicit text per entity:
      Namespace: 'Deleting a namespace requires removing all
                  data sources, collectors, terms, and active
                  data entities scoped to it first.'
      DataSource: 'Deleting a data source requires removing all
                   active data entities ingested through it first.'
      Collector: 'Deleting a collector requires removing all data
                  sources reporting through it first.'
      Tag: 'Deleting a tag removes all bindings to data entities,
            dataset fields, and terms.' (AFTER the deletetag-cascade-asymmetric
            fix lands.)
  - |-
    Make CascadeDeleteException error messages more informative.
    Currently: 'Namespace cannot be deleted: there are still
    resources attached'. Better: 'Namespace finance cannot be
    deleted: 3 data sources, 1 collector, 5 terms, 47 data
    entities still reference it.' The DTOs are available; just
    need to be collected before the throw.
  - |-
    Add a 'why can't I delete this?' API endpoint per entity:
    `GET /api/{entity}/{id}/blocking-references` returns the
    enumerated child counts. The operator UI can call this on
    delete-button-click before the delete; surfaces the friction
    BEFORE the 400 response.
  - |-
    Address the TOCTOU class with explicit transaction boundary +
    SELECT FOR UPDATE on the parent row. The existsBy checks +
    the soft-delete UPDATE need to be in a single transaction
    that holds a row lock on the parent. Cross-link to TOCTOU
    classes catalogued at tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race.
  - |-
    Build-time scanner: enumerate every service-tier delete method
    AND verify the cascade-app-tier-guard pattern (existsBy* +
    CascadeDeleteException-throw) OR the cascade-hard-delete-joins
    pattern. Surface deviations as findings. The Tag asymmetry
    would be caught by such a scanner.
  - |-
    Build-time scanner: enumerate every FK definition in the
    migration suite AND assert NONE have `ON DELETE CASCADE` or
    `ON DELETE SET NULL` (the application-tier-cascade-pattern
    invariant). Same scanner shape as the cascade-method audit.

notes: |-
  This invariant captures the FIRST explicit framing of the
  cascade-app-tier-guard pattern as a platform-wide convention,
  with the explicit count of referent classes per entity AND the
  Tag-outlier-asymmetry surfaced as a SEPARATE bug. Previous batches
  named the pattern at individual entities (Collector batch B,
  DataSource batch S, Owner batch P); batch W enumerates 4 sister
  entities + the Tag deviation in a single architectural picture.

  The architectural picture's load-bearing observations:
    (a) Cascade is APPLICATION-TIER. The database doesn't enforce
        it. A maintainer reading the FK definitions in V0_0_1__init.sql
        would NOT conclude 'cascade happens here' — they would
        conclude 'these FK references prevent deletes that violate
        them, and the application has to deal with the validation
        errors'. The application chose the more nuanced approach.
    (b) The PATTERN-SHAPE varies per entity. Namespace + DataSource
        + Collector + Owner GUARD-throw on existing children. Tag
        + Owner-association (and likely Term link tables) HARD-DELETE
        the joins as part of the parent delete. The two shapes
        coexist; the maintainer chose differently per entity.
    (c) The TAG OUTLIER is a bug, not a deliberate choice. The
        third relation table (tag_to_dataset_field) is missing
        from the cleanup. The fix is one line in TagServiceImpl
        + the migration to clean up historical orphans.
    (d) The pattern composes with soft-delete-reincarnation to
        form the canonical lifecycle: cascade-guard preconditions
        delete; partial-unique-index post-conditions recreate.

  Cross-cutting connections:
    - Pairs with three-soft-delete-mechanisms-across-the-repository-layer
      (THIS invariant adds CASCADE-PATTERN COUNTS as a separate
      facet; the master invariant focuses on the DELETION mechanism
      varieties)
    - Pairs with deletetag-cascade-asymmetric-orphans-tag-to-dataset-field
      (THIS BATCH sibling — the Tag asymmetry is a SPECIFIC bug
      within this general pattern)
    - Pairs with soft-delete-reincarnation-via-partial-unique-index-general-pattern
      (THIS BATCH sibling — the lifecycle composition)
    - Pairs with tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race
      (the cascade-app-tier guard has its own TOCTOU class —
      cross-cutting race-condition family across catalog primitives)

  Two DOC-NNN candidates:
    (a) Per-entity Management page text on cascade behaviour
    (b) Cross-cutting /developer-guides/lifecycle-semantics
        page (single anchor; cross-link the cascade-guard
        + soft-delete-reincarnation + restore semantics)
