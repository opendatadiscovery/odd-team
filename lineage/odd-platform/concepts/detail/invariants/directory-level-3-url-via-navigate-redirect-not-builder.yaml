security_aggregate:
  overall: HIGH
  auth_modes_relevant: []
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: N/A
    detail: |-
      Not a security finding — architectural pattern of URL-builder
      shape vs route-matcher shape.
  owner_scoping:
    verdict: N/A
    detail: ''
  strengths:
    - |-
      The level-3 URL IS reachable end-to-end — by clicking a data-source
      row, by typing the URL directly, or by sharing a deep-link. The
      Navigate-replace ensures users don't see bare `/{prefix}/{dsId}` in
      their history. The architecture works correctly.
    - |-
      The `replace` semantic at `Navigate to='all' replace />`
      explicitly encodes the intent — a transient redirect, not a
      navigable history entry. The choice is deliberate.
    - |-
      The type annotation `typeId?: number | 'all'` at
      `directoryRoutes.ts:47` IS the type-system documentation of the
      sentinel value — callers know they can pass either a number OR
      the literal 'all'.
  weaknesses:
    - |-
      A developer reading `directoryRoutes.ts` alone learns only TWO of
      the FOUR addressable URL shapes. The level-3 shape is hidden in
      the inner Routes declaration + the EntitiesTabs builder caller.
    - |-
      The `'all'` literal is a load-bearing magic string with no named
      constant uniting the three files that use it. A rename in one
      location silently breaks the others.
  cross_file_inconsistencies:
    - |-
      The Directory pattern (level-3 via Navigate-replace + magic
      literal) DIVERGES from the alerts pattern (three discrete
      sub-path builders) and the terms pattern (frozen as-const
      sub-path map). The cross-pillar inconsistency is undocumented;
      a developer adding a new pillar would have to choose which
      pattern to follow without guidance.
  contributing_files:
    - odd-platform__ts__routes__route__directory.md
  evidence: []
