  - "OwnersList.md says (bugs_limitations_corner_cases.[0]): 'useEffect dep-array at OwnersList.tsx:44-46 does NOT include dispatch — React-strict-mode + future React versions may flag this as a missing-dependency warning. The dep array [isOwnerCreating, isOwnerDeleting, query] references dispatch in the body but does not list it. The LSN-017 useEffect dep-array pattern (details.status?.status derived from the fetch response, causing call-doubling) does NOT apply: the deps here are primitive booleans and a primitive string; these are not produced by the fetch response, so the LSN-017 multiplier shape is absent.'"
