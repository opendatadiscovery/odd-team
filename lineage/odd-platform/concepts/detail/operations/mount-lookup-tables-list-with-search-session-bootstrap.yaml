notes: |-
  NEW operation captured in batch ZL (2026-05-26). The 'single-
  page-root with all session-orchestration inline' shape is
  unique to LookupTables.tsx among the pillar roots enriched so
  far. The cost is page-root verbosity (~93 lines); the benefit
  is no sibling-coordination overhead.

  Cross-batch follow-up: the URL parameter form differs from
  Search.tsx and TermSearch.tsx — here the UUID is in a query
  parameter (?searchId=<uuid>) NOT a path segment
  (/master-data/lookup-tables/{uuid}). This is observably
  inconsistent across the three search-session orchestrators
  and worth pinning as a separate UX-consistency invariant if
  the divergence proves intentional vs accidental.
