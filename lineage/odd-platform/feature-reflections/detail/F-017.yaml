# Search Filter Facets — product-owner reflection

## product_owner_narrative

The Search Filter Facets surface is the **left-sidebar drill-down** of the Data Discovery
Catalog page — the part of search that answers "of everything that matched, how many are
TABLEs vs JOBs, how many belong to each owner, each tag, each datasource, each namespace,
each status?" and lets the user click any of those buckets to narrow the result list. It is
realised by two sibling reactive endpoints that operate on the same server-side search
session: `getSearchFacetList` (`GET /api/search/{search_id}`) returns the seven-facet
aggregate counts plus the catalog total, and `getFiltersForFacet`
(`GET /api/search/{search_id}/facet/{facet_type}`) returns the paginated, countable options
for a single facet type (TAGS / OWNERS / TYPES / GROUPS / STATUSES) (per
`odd-platform__java__SearchController__controller-method__facets.md`:understanding +
`SearchController.java:30-47`). The live product page promises exactly this: "you can refine
your search results based on specific attributes, ensuring that you find exactly what you are
looking for" — and lists the seven facets verbatim (per WebFetch
`https://docs.opendatadiscovery.org/features/data-discovery/search` 2026-05-26, via the
sidecar docs_link_semantic block).

A user reaches this surface by landing on the Catalog page at `/search/*` — every
authenticated user can, and (under `auth.type=DISABLED`) so can an unauthenticated caller on
the network, because the route mount at `App.tsx:61` is BARE — no `WithPermissionsProvider`,
no role check — and the backend has no `/api/search` SecurityRule, falling through to the
catch-all `pathMatchers('/**').authenticated()` (per
`odd-platform__ts__routes__route__search.md`:invariants +
`odd-platform__java__SearchController__controller-method__facets.md`:security.authorization_assertions).
The on-screen experience: a text input at the top (`<MainSearch>`), the seven-facet sidebar
on the left (`<Filters/>`), and the result list with class tabs on the right (`<Results/>`).
Each facet click toggles a checkbox; the orchestrator pushes the new selection to the server
and the counts and result list refresh (per `odd-platform__ts__react-component__component__Search.md`:understanding,
operations).

The working parts a product owner would demo: free-text query (forwarded into Postgres
full-text search), seven facets to slice by, a "My Objects" tab that scopes the RESULT list
to entities the caller owns, deep-linkable URLs (`/search/{searchId}`) that let one user send
a colleague "here's my filtered Catalog view," and infinite-scroll pagination on the results.
Underneath, the session — the query string plus the selected filters plus the My-Objects
toggle — is persisted as a row in the `search_facets` table keyed by a server-minted UUID, and
that UUID is what rides in the URL bar (per
`odd-platform__ts__routes__route__search.md`:concepts +
`odd-platform__java__SearchController__controller-method__facets.md`:concepts.entities;
`V0_0_1__init.sql:204-211`).

The integration story: this surface feeds the rest of Data Discovery — clicking a result row
opens the entity detail page (P-01) and feeds Popular Entities Ranking (F-001) by view_count;
the same session model is cloned verbatim by Term Search & Browse (F-024, the Dictionary tab);
and the session rows are evicted by the Housekeeping TTL job (F-010) at a 30-day default
(`housekeeping.ttl.searchFacetsDays`) (per `system-mission.md` P-01 cross-pillar relationships
+ the LSN-018 coherence correction in
`odd-platform__java__SearchController__controller-method__facets.md`:"Coherence correction").

The edge cases a senior product owner would flag in a demo — and where the reflection below
concentrates — are the gaps between what the seven-facet sidebar APPEARS to promise and what
it does: the facet COUNTS are catalog-wide regardless of the My-Objects toggle and regardless
of who is asking, so the sidebar quietly enumerates the whole platform's owner/tag/namespace
cardinality (per security.owner_scoping + bugs[0]); the deep-linkable URL behaves like a
shared mutable pointer, not a saved search (per
`odd-platform__ts__routes__route__search.md`:stress_findings.request_inputs); a single typed
query containing a parenthesis or colon can permanently break the session (per bugs[5] /
REFACTOR-229); and the "Search" box is a Postgres `to_tsquery` expression input wearing a
plain-search label. The promise layer below (the use_cases) makes the verified-vs-unverified
state of each of these explicit: only the happy-path search and the no-match path are guarded
by a test today (IT-022 + the platform search.spec.ts); the entire facet sidebar — the
feature's NAMESAKE — has no behavioural test at any layer.

## hypotheses

- id: H-001
  hypothesis: |
    "When I open the Catalog page and look at the facet sidebar, the COUNT next to each
    facet bucket (e.g. 'Owner: alice (42)') reflects MY view of the catalog — i.e. entities
    I can see, scoped the same way the 'My Objects' tab scopes them."
  derivation: |
    The seven-facet sidebar sits next to a 'My Objects' tab; a user's natural mental model
    is that the facet counts move with the active scope. system-mission.md P-01 lists
    'My Objects' filtering as a primary action.
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      Facet counts are computed CATALOG-WIDE with no OWNERSHIP join. The six aggregators in
      ReactiveSearchFacetRepositoryImpl (entity-class 163-249, type 251-337, owner 339-372,
      tag 374-407, group 409-452, status 454-534) apply only getDataEntityDefaultConditions
      (HOLLOW=false, STATUS != DELETED, EXCLUDE_FROM_SEARCH NULL-or-false) — no owner-side
      predicate. The 'My Objects' toggle (FacetStateDto.myObjects) scopes only which entities
      appear in the RESULT LIST (SearchServiceImpl.java:105-111), not the facet COUNTS. The
      only owner-derived input on the path, authIdentityProvider.fetchAssociatedOwner(), feeds
      ONLY the optional myObjectsTotal field, shown ALONGSIDE the catalog-wide total — never
      as a scoping predicate (SearchServiceImpl.java:128-130).
    evidence:
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: security.owner_scoping
        cite: "ReactiveSearchFacetRepositoryImpl.java:163-534 (no OWNERSHIP join)"
        note: "Every facet aggregator is catalog-wide; only myObjectsCount is owner-scoped and it is additive."
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: implicit_adrs[1]
        cite: "SearchServiceImpl.java:122-155"
        note: "Mono.zip returns BOTH total and myObjectsTotal; myObjects is EXTRA scope, not a boundary."
    operator_visible_failure: |
      An operator who toggles 'My Objects' expecting the facet sidebar to narrow to their
      slice sees the counts STAY at catalog-wide values — confusing on its own ("I filtered
      to my objects but Owner: bob still shows 200?"). Worse, the counts are an information
      leak: a user with zero owner association still sees every owner's name and per-owner
      entity count, every tag's name and count, every namespace, every group. The sidebar is
      a sharper enumeration surface than the result list because counts reveal existence even
      for entities the user cannot open directly.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      No test asserts facet-count scoping. IT-022 covers result-list search, NOT the sidebar
      counts. A missing-functional demand: assert that toggling My Objects leaves the facet
      counts at catalog-wide values (pins the documented behaviour so a future scoping change
      is a deliberate, test-breaking migration).

- id: H-002
  hypothesis: |
    "Drilling the OWNERS facet (GET /api/search/{id}/facet/OWNERS) returns the owners
    relevant to ME or to entities I have a relationship with — not the entire platform's
    owner directory."
  derivation: |
    Endpoint shape: a per-facet drill-down named facet/OWNERS in a multi-tenant-feeling
    catalog implies caller-relevant scoping. Pillar P-09 documents an RBAC model around owners.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      getFiltersForFacet(OWNERS) runs OWNER JOIN OWNERSHIP JOIN SEARCH_ENTRYPOINT JOIN
      DATA_ENTITY with countDistinct(SEARCH_ENTRYPOINT.DATA_ENTITY_ID) ORDER BY count DESC
      with LIMIT/OFFSET — catalog-wide, no caller-principal filter
      (ReactiveSearchFacetRepositoryImpl.java:339-372). The endpoint has no @PreAuthorize and
      no SecurityConstants.SECURITY_RULES entry for any /api/search/* path (verified zero
      matches by grep), so authentication is required but authorization is not enforced. An
      authenticated caller drills OWNERS to enumerate every owner name + per-owner count,
      then TAGS / GROUPS / TYPES / STATUSES (and NAMESPACES via the aggregate response) to
      enumerate the full catalog cardinality.
    evidence:
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: bugs_limitations_corner_cases[0]
        cite: "ReactiveSearchFacetRepositoryImpl.java:339-372 + SecurityConstants.java (no rule)"
        note: "Cross-owner facet enumeration — REFACTOR-024 family extended to the facet-counts surface."
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: security.data_exposure[1]
        cite: "SearchController.java:30-40"
        note: "CountableSearchFilter[] for OWNERS enumerates every owner name + entity count to any authenticated user."
    operator_visible_failure: |
      Primary failure: any authenticated user (and, under auth.type=DISABLED, any
      unauthenticated client on the network) obtains the platform's complete Owner directory
      with per-owner data-entity counts — a reconnaissance map of which teams own how much.
      Subtle failure: even a deployment that later scopes the RESULT list per owner would still
      leak cardinality here, because the facet counts are a SEPARATE code path with no owner
      predicate — an attacker who cannot open team-A's `customers_pii` can still watch the
      OWNERS/TAGS counts increment as team-A ingests, inferring existence and growth.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      Regression guard for the eventual PLT-090 fix (Defect 2) AND a pin of the current
      read-collaborative posture if the maintainer documents rather than fixes. No test asserts
      cross-owner facet enumeration today (the facets sidecar has covered_behaviours: []).

- id: H-003
  hypothesis: |
    "Reaching the Catalog facet sidebar requires me to be logged in; an unauthenticated
    request to the facet endpoints is rejected."
  derivation: |
    Pillar P-09 ("Configure security") promises auth gates the catalog. Endpoint-shape: a
    /api endpoint is presumed authenticated.
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |
      Under LOGIN_FORM / OAUTH2 / LDAP the catch-all pathMatchers('/**').authenticated()
      (AuthorizationCustomizer.java:29-30) DOES require an authenticated session — so the
      hypothesis holds for the three real auth modes. But under auth.type=DISABLED no
      SecurityContext is populated and the missing SecurityRule combined with the
      permitAll-equivalent fall-through makes both facet endpoints anonymously reachable. The
      route mount is also bare (App.tsx:61, no WithPermissionsProvider), so even the SPA shell
      renders for anonymous traffic in DISABLED mode.
    evidence:
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: bugs_limitations_corner_cases[2]
        cite: "SearchController.java:30-47 + AuthorizationCustomizer.java:29-30"
        note: "DISABLED-mode anonymous facet enumeration; the three real modes do require auth."
      - sidecar: odd-platform__ts__routes__route__search.md
        section: security.auth_mode_relevance
        cite: "App.tsx:61 + LoginFormSecurityConfiguration.java:55-58"
        note: "Route mount has no guard; backend redirects unauthenticated under real auth modes, lets anonymous through under DISABLED."
    operator_visible_failure: |
      DISABLED is documented as dev-only, but any operator who runs DISABLED on a
      network-reachable host hands the full catalog-cardinality discovery surface to anonymous
      callers — combined with H-002 (no owner predicate) and H-005 (bearer-token sessions),
      DISABLED is total catalog reconnaissance with no credential. The partial verdict is
      because the gate IS correct for the three modes operators run in production.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      The partial verdict's unmet part (anonymous reach under DISABLED) wants a security-class
      pin; the met part (auth required under LOGIN_FORM/OAUTH2/LDAP) wants a positive gate test.
      Neither exists. A missing-functional demand for the auth-mode matrix on the facet endpoints.

- id: H-004
  hypothesis: |
    "The 'query' parameter on the facet drill-down (GET /api/search/{id}/facet/{type}?query=…)
    full-text-searches the facet options — typing 'snow' finds the 'Snowflake' datasource by
    the same matching I'd expect from the main Search box."
  derivation: |
    Category F: the parameter is named `query`, the same word as the main full-text search box;
    a user assumes both `query` inputs mean the same thing.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The per-facet `query` param (SearchController.java:35) is bound to facet-ROW-NAME
      containsIgnoreCase substring filtering (ReactiveSearchFacetRepositoryImpl.java:124, 152,
      360, 394, 439), NOT to FTS. It is a different mechanism from the PERSISTED session
      `FacetStateDto.query`, which IS bound to to_tsquery via
      jooqFTSHelper.ftsCondition(SEARCH_ENTRYPOINT.SEARCH_VECTOR, state.getQuery()). Two
      inputs share the name `query` but one is a plain substring match over option labels and
      the other is a Postgres tsquery expression over the search vector.
    evidence:
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: concepts.invariants[3]
        cite: "ReactiveSearchFacetRepositoryImpl.java:152, 124, 360, 394, 439"
        note: "Per-facet query param = containsIgnoreCase on facet-row name; not FTS."
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: concepts.invariants[4]
        cite: "ReactiveSearchFacetRepositoryImpl.java:182, 267, 469, 582"
        note: "The PERSISTED session query is the FTS one; the same word names two different behaviours."
    operator_visible_failure: |
      Mostly benign in the common case (substring match over short option labels does roughly
      what a user wants when typing into a facet filter box). The drift bites at the edges: a
      user who types FTS-style syntax (a prefix like 'cust*' or quoted phrase) into a facet
      filter expecting full-text matching gets literal-substring behaviour and "no options
      found" — indistinguishable from "no such facet option." The same word `query` meaning
      substring-match here and tsquery-expression on the main box is a documentation and
      mental-model hazard, distinct from the more severe injection drift (H-007).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      A missing-functional demand: assert the per-facet `query` param does substring (not FTS)
      matching on option labels — pins the Category-F drift and the new drift_class
      facet_filter_query_param_name_promises_fulltext_but_binds_to_facet_row_name_substring_match.

- id: H-005
  hypothesis: |
    "The search-session UUID in my URL is private to me — another user cannot read or change
    my session even if they obtain the UUID."
  derivation: |
    Negative-space: a URL that survives reload and carries 'my' filter state is normally
    assumed user-scoped. The DTO/route field is named `searchId` (implying 'my search').
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The search_facets table has NO owner_id / created_by / user_id column
      (V0_0_1__init.sql:204-211). SearchServiceImpl.search creates a row without capturing the
      principal (75-82); updateFacets accepts any caller for any UUID (84-96); fetchFacetState
      is a raw UUID lookup with no ownership check (157-160); the repository get(UUID) is a raw
      UUID-keyed UPDATE-RETURNING. Any authenticated user in possession of any other user's
      UUID can READ, UPDATE, and DRIVE that session. The 122-bit UUID space makes brute force
      infeasible, but URL leakage (copy/paste into a bug report, screenshot, Slack, referer
      header) hands the recipient full read+update access.
    evidence:
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: security.known_security_gaps[1]
        cite: "V0_0_1__init.sql:204-211 + SearchServiceImpl.java:75-82, 84-96, 157-160"
        note: "Session-state has no per-user binding; bearer-token-shaped UUID."
      - sidecar: odd-platform__ts__routes__route__search.md
        section: bugs_limitations_corner_cases[4]
        cite: "searchRoutes.ts:9 + batch-M SearchController.search REFACTOR-344"
        note: "URL exposes the UUID; any authenticated user with it fetches the session."
    operator_visible_failure: |
      (a) An operator who pastes a /search/{uuid} URL into a public bug report exposes their
      entire saved-filter state, including their My-Objects posture and free-text query (which
      may contain PII / customer ids typed into the box). (b) A colleague who clicks a shared
      link does not get an isolated copy — they share the live row (see H-009). (c) The URL
      labelled by the field name `searchId` reads as "my saved search" but is a transient,
      unowned, mutable session row.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      The regression guard the facets sidecar itself flags as currently unwriteable: "asserts
      userA cannot read userB's session — currently impossible to write because the row has no
      user binding, so the test would document the gap." A missing-functional demand that PINS
      the current bearer-token behaviour (userB reads userA's UUID → 200) until PLT-090 Defect 1
      lands, then flips to assert 403.

- id: H-006
  hypothesis: |
    "The 1500ms debounce on facet clicks means rapidly clicking five facets sends ONE batched
    update to the server, not five."
  derivation: |
    UI label / code intent: Search.tsx wires a useDebouncedCallback(..., 1500) around the
    facet-update dispatch; the operator-visible promise of a debounce is request coalescing.
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The debouncer is wrapped in a useCallback whose deps include searchFacetParams, which
      changes on every facet click — so each click CONSTRUCTS A NEW useDebouncedCallback
      instance (Search.tsx:50-65). With {leading: true}, each new debouncer fires on its FIRST
      call immediately, and the prior debouncer's trailing timer is unreachable. Effective
      behaviour: every facet click dispatches PUT /api/search/{id}/facets immediately; the
      1500ms debounce coalesces nothing. Five clicks in two seconds = five PUTs. This is the
      byte-identical bug to the TermSearch.tsx clone.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Search.md
        section: bugs_limitations_corner_cases (debouncer recreated)
        cite: "Search.tsx:50-65 (useCallback deps include searchFacetParams)"
        note: "Debouncer recreated per click; {leading:true} fires each new instance immediately."
      - sidecar: odd-platform__ts__react-component__component__Search.md
        section: stress_findings.name_behavior_pairs (updateSearchFacets)
        cite: "Search.tsx:50-65 + P-189"
        note: "DRIFT_NAME_VS_BEHAVIOR — name promises batching, implementation fires per click."
    operator_visible_failure: |
      Server-side load amplifies N-fold for rapid filter sessions — and crucially each extra
      PUT is an additional invocation of the persisted-query path, widening the
      tsquery-injection surface (H-007): a poisoned query is re-submitted on every click. The
      user perceives nothing wrong directly (counts still update), so the cost is invisible to
