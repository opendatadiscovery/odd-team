        cite: "OwnerAssociation.tsx:84-86 (UI gate) + getPopular.md authorization_assertions: []"
        note: "UI owner-association gate is UX, not security; API has no equivalent precondition."
    operator_visible_failure: |
      (1) An operator who relies on the home-page panel hiding under DISABLED as a defence-in-depth measure
