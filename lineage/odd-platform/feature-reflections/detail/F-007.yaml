# AlertManager Integration — product-owner reflection

## product_owner_narrative

AlertManager Integration is one of the two halves of P-07's Alerting sub-feature: it is the **inbound bridge** that lets an operator's existing Prometheus AlertManager push distribution-anomaly alerts into ODD so they sit next to the platform's own data-quality / failed-job / schema-break alerts (per system-mission.md P-07 sub-feature "Notifications ... AlertManager inbound webhook /ingestion/alert/alertmanager", and the live config doc's "Prometheus AlertManager Integration" section). The promise to a customer is: *"point your Prometheus AlertManager at one URL, label each rule with the data entity it concerns, and those external anomalies show up on the entity's page and on your platform-wide alerts feed alongside everything else ODD detects."* The audiences are the platform-operator (who wires AlertManager's `webhook_configs[].url` to the endpoint and labels rules with `entity_oddrn`), the external prometheus-alertmanager system (the canonical caller), and the odd-platform-ui-end-user / steward who reads the resulting alerts (per the postAlerts sidecar `concepts.audiences`).

How a user interacts with it splits into two surfaces that the feature-flow stitches together. The **write surface** is machine-facing: there is no screen, no form — AlertManager POSTs a JSON body (`{alerts:[{labels, generatorURL, startsAt}]}`) to `POST /ingestion/alert/alertmanager`, the 4-line `alertManagerWebhook` handler delegates to `AlertServiceImpl.handleExternalAlerts`, and the platform returns `204 No Content` unconditionally (per `postAlerts` sidecar understanding + AlertManagerController.java:21-26). The **read surface** is human-facing: the global Alerts page mounted at `/alerts/*` (the `Alerts` React component), with three tabs — All / My Objects / Dependents — each an infinite-scroll list, plus per-row Resolve/Reopen buttons and three count badges (per `Alerts.md` understanding). So an inbound forged or real alert becomes a row a steward reads on `/alerts/all`; that is the feature's observable end-to-end loop.

The working parts, described as the operator experiences them. On the write side: every inbound alert is hard-typed `DISTRIBUTION_ANOMALY` regardless of AlertManager's `alertname`/`severity` labels (AlertServiceImpl.java:177); the `entity_oddrn` label routes the alert to a data entity by writing it verbatim to `alert.data_entity_oddrn` (line 178); the Prometheus `generatorURL` is embedded in the alert's chunk description as clickable text (line 185); and the whole batch is one `@ReactiveTransactional` INSERT with no de-duplication (the path deliberately SKIPS `AlertActionResolver`, which the in-platform ingestion path DOES use — AlertServiceImpl.java:222-227 vs 151-191). On the read side: the three global tabs all hard-filter `status = OPEN` (ReactiveAlertRepositoryImpl.java:143-145 + the My/Dependents siblings) and share one Redux slot cleared on every tab switch; the list pages 30 at a time with `LAST_CREATED_AT DESC, ID DESC` ordering; and each row exposes a Resolve/Reopen button whose permission (`DATA_ENTITY_ALERT_RESOLVE`) is only checked AFTER the click (`Alerts.md` stress_findings + bugs[1]).

The integration story is where F-007 is load-bearing for the whole "Active Platform" pitch. The OPEN alert this feature writes is the START of a chain: the INSERT on the `ALERT` table is captured by Postgres logical replication and drives **F-009** (WAL-driven outbound notification fan-out to Slack / webhook / email), which is where a forged alert reaches every operator-configured channel and where the F-004 Slack mrkdwn-injection surface lives (per F-007 feature-flow batch Y + related_features F-009/F-004). The same alert displays at **F-014** (per-entity Alert view) and surfaces on **F-022** (per-dataset DQ Test reports tab). And the alert-state transitions (OPEN_ALERT_RECEIVED / RESOLVED_ALERT_RECEIVED / ALERT_STATUS_UPDATED) are written to the Activity feed (**F-021**) via the `save(List<ActivityPojo>)` batch path with `is_system_event=true` (per AlertServiceImpl downstream_side_effects + ReactiveActivityRepositoryImpl batch R). So one POST to one unauthenticated URL fans out to: a DB row, a global-tab display, a per-entity display, a per-dataset display, an Activity-feed audit row, AND an outbound Slack/webhook/email message — the compound the feature-flow's headline drift_class names.

Edge cases a product owner would call out in a demo. (1) The endpoint is unauthenticated by design — the docs now say so verbatim and recommend network-perimeter controls — which means in any deployment whose network edge does not gate `/ingestion/alert/alertmanager`, anyone who can reach it can forge alerts on any team's entities. (2) The "All" tab is named "All" but shows only OPEN alerts; a steward looking for a recently-resolved alert on the global page cannot find it and may assume it was purged (the data still exists, reachable only from a single entity's Alerts tab). (3) The Resolve button is shown to everyone, but the permission check fires on click — a viewer who cannot resolve sees the button, clicks, and only then gets "No access!". (4) The tab badges fetch once on mount and never refresh, so after resolving an alert the count stays stale. (5) An alert POSTed without `entity_oddrn` is persisted with a NULL FK — orphaned, invisible everywhere, but counted in the platform-wide totals. The feature has ZERO automated test coverage on the webhook path and ZERO UI-test coverage on the Alerts page (verified across all five sidecars) — every behaviour below is traced from primary source, not from a passing test.

## hypotheses

- id: H-001
  hypothesis: "When AlertManager (or any caller) POSTs to /ingestion/alert/alertmanager on a platform configured with a real UI auth mode (LOGIN_FORM / OAUTH2 / LDAP), the caller must be authenticated (or carry a shared secret / S2S token) for the alert to be accepted."
  derivation: "Endpoint-shape + pillar security posture: P-09 says ODD has independently-configured auth surfaces and a webhook is a server-to-server boundary; a senior PO expects the ingest of authoritative state to require SOME credential under a non-DISABLED auth mode."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The endpoint is unauthenticated under EVERY auth.type mode, not just DISABLED. The path
      sits in SecurityConstants.WHITELIST_PATHS[/ingestion/**] (SecurityConstants.java:96), which
      exempts it from the UI auth chain across DISABLED / LOGIN_FORM / OAUTH2 / LDAP alike. The
      one ingestion auth filter, IngestionDataEntitiesFilter, is @ConditionalOnProperty
      (auth.ingestion.filter.enabled) AND its matcher binds ONLY to /ingestion/entities POST
      (IngestionDataEntitiesFilter.java:28) — it does NOT cover /ingestion/alert/alertmanager.
      So even with auth.ingestion.filter.enabled=true AND OAUTH2 for the UI, this path accepts
      any AlertManager-shaped POST from any caller with network reach. The handler itself has no
      @PreAuthorize, no @Secured, no header inspection (AlertManagerController.java:21-26). Auth
      is delegated entirely to operator network controls.
    evidence:
      - sidecar: odd-platform__java__AlertManagerController__controller-method__postAlerts.md
        section: security.auth_mode_relevance + known_security_gaps[0]
        cite: "AlertManagerController.java:21-26 + SecurityConstants.java:96 + IngestionDataEntitiesFilter.java:28"
        note: "no method auth; /ingestion/** whitelisted across all modes; the only ingestion filter binds to a sibling path"
      - sidecar: odd-platform__java__service__service__AlertServiceImpl.md
        section: dependencies_semantic.requires-config (indirect auth.ingestion.filter.enabled)
        cite: "AlertServiceImpl.java:151-191"
        note: "handleExternalAlerts consults no AuthIdentityProvider (the UI paths do at 84/93/117/235)"
    operator_visible_failure: |
      An operator who has carefully enabled OAUTH2 for the UI and auth.ingestion.filter.enabled
      for /ingestion/entities reasonably believes the whole /ingestion surface is gated. It is
      not: the AlertManager path is wide open under every mode. In any deployment whose network
      edge does not separately restrict this path (the default Kubernetes/Compose ingress exposes
      it through the same edge as the protected UI), any party with network reach POSTs alerts.
      The doc now states this verbatim and recommends perimeter controls — but the gap between
      "the UI is locked" and "this one ingest path is not" is exactly the P-09 "enabling one
      surface does not protect the other" footgun, here with no in-platform toggle to close it.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    dedup_note: "Code-fix tracked as PLT-014 (gate-or-shared-secret); doc-caveat shipped as DOC-179 (done). Routed as caveat-candidate because the in-platform fix is the upstream PLT and the operator mitigation is documented."

