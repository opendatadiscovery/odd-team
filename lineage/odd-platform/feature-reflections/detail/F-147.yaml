- id: H-005
  hypothesis: "Clicking an interactive element inside a row (the staleness clock, the search-highlights question mark, the hover-preview) performs only that element's action — it does not also navigate to the entity."
  derivation: "Negative-space + product-owner: a row contains smaller affordances (tooltips, a preview); a user clicking one expects its local behaviour, not a surprise full-page navigation. Inner clickable children that don't stopPropagation are the classic whole-row-onClick hazard."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The row mounts three inner interactive elements with NO visible event.stopPropagation at the consumer
      site: MetadataStale (ResultItem.tsx:87-90, a tooltip-anchored staleness clock), the AppTooltip
      wrapping a QuestionIcon for search highlights (ResultItem.tsx:101-105), and DataEntityDetailsPreview
      (ResultItem.tsx:106, a hover-preview component). Because the row's onClick is on the outer
      S.Container, a DOM click event originating on any of these children bubbles up to the row handler and
      fires navigate(detailsLink) — UNLESS one of the children calls stopPropagation internally. MetadataStale,
      AppTooltip, QuestionIcon, and DataEntityDetailsPreview live in components/shared/elements and were NOT
      read this pass (out of the F-147 slice; the F-147.yaml facet flags this exact audit as ui_unverified).
      Whether a click on each child double-navigates therefore cannot be settled from the sidecars — it needs
      the rendered component exercised. PLT-091 Defect 4 already records this as an open hazard.
    evidence:
      - sidecar: "(source read — ResultItem.tsx, hop-1 sidecar unresolved)"
        section: render
        cite: "ResultItem.tsx:87-90, :101-105, :106"
        note: "Three inner interactive children inside the row's onClick container; no stopPropagation at consumer site. source_read_for_validation: true."
      - sidecar: "(feature-flow F-147)"
        section: observed_vs_expected
        cite: "F-147.yaml facet inner_button_clicks_no_stop_propagation_audit (ui_unverified: true)"
        note: "DataEntityDetailsPreview internals out-of-slice; stopPropagation behaviour unverified — needs a rendered probe."
    operator_visible_failure: |
      IF the children do not stopPropagation (the un-probed worst case): (1) a user clicking the staleness
      clock or the search-highlights question mark to read a tooltip is instead yanked to the entity's full
      detail page — a jarring, unintended navigation; (2) each such accidental navigation also writes +2
      view_count (compounding H-002's inflation); (3) the hover-preview's own click target collides with the
      row navigate, so the preview interaction is unreliable. The probe must click each inner element and
      assert the row does NOT navigate.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-147-1
    source_read_for_validation: true
    use_case_kind: render
    coverage: unverified
