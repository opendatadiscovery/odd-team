    # IT-002 view-count one-per-open (F-001 / PLT-104 / #1764, CTRIB-004) — flipped GREEN 2026-06-11, moved
    # from known-bugs (that move IS the regression closure); fix on PR #1770's branch, GATE 2 pending — GREEN
