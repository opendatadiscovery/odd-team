terminal_side_effect:
  side_effect_class: db-write
  description: |-
    `message_provider_event` row inserted (whether genuine or forged); the
    downstream materialiser processes the event and inserts a child `message`
    row on the affected Discussions thread (visible to UI users on the
    data-entity Discussions tab). For URL-verification challenge events,
    the platform echoes back the challenge value with 200 OK — no DB write
    but enables endpoint-existence enumeration.
  evidence: |-
    EventApiController.java:22-27 + SlackEventParser.java:22-23 +
    ReactiveMessageRepositoryImpl.java:136-155 +
    db/migration/V0_0_59__data_collaboration.sql:25-39.

observed_vs_expected:
  facets:
    - facet: Slack signing-secret HMAC verification not implemented
      observed: |-
        The entire codebase contains ZERO matches for X-Slack-Signature,
        signing.secret, signingSecret, verifySignature, or HMAC.SHA256.
        Slack mandates that receivers validate `X-Slack-Signature`
        HMAC-SHA256 over `v0:{X-Slack-Request-Timestamp}:{raw body}` using
        the app's signing-secret. The implementation does none of this.
        Any internet host can forge Slack events.
      expected: |-
        Add config property `datacollaboration.slack-signing-secret`. Mount
        a Spring WebFilter scoped to `/api/slack/events` that validates
        `X-Slack-Signature` HMAC-SHA256; reject 401 on mismatch. ~50 LOC.
        The Slack signing-secret is provided by Slack in the Apps UI
        alongside the bot OAuth token; operators copy both at deployment.
      evidence:
        - "https://api.slack.com/authentication/verifying-requests-from-slack (Slack's published requirement)"
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/controller/EventApiController.java:22-27 (the controller's only signature handling — none)"
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/datacollaboration/SlackEventParser.java:22-23 (parser only takes rawJson)"
      drift_class: inbound_webhook_signature_unverified
      provenance: STATIC — SHB-129 evidence; mechanism verified across 6 file:line refs.
    - facet: endpoint in WHITELIST_PATHS — unauthenticated in every mode
      observed: |-
        `/api/slack/events` is in SecurityConstants.WHITELIST_PATHS line 95-96;
        consumed by AuthorizationCustomizer (OAUTH2/LDAP) and
        LoginFormSecurityConfiguration. DisabledAuthSecurityConfiguration
        permits everything anyway. The endpoint is reachable anonymously
        regardless of the operator's auth-type choice.
      expected: |-
        Document the whitelisting + the threat model on the live docs
        page (`configuration-and-deployment/odd-platform#enable-data-collaboration`)
        and ship the signing-secret filter as the load-bearing defence.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/utils/SecurityConstants.java:95-96"
      drift_class: unauthenticated_under_every_supported_configuration
      provenance: STATIC — SHB-129 evidence; same class as F-094, F-095, F-097.
    - facet: no `(provider, event_id)` uniqueness — Slack retries duplicate downstream
      observed: |-
        `message_provider_event` table has NO unique constraint on
        `(provider, event_id)`. Slack at-least-once delivery semantics
        + missing dedup → duplicate `message_provider_event` rows on
        retries; downstream processor materialises N child `message` rows
        for one logical event. Operator-observable: same message appears
        twice in the thread.
      expected: |-
        Either (a) add `UNIQUE(provider, event_id)` via a new Flyway
        migration, OR (b) add `ON CONFLICT DO NOTHING` on the
        ReactiveMessageRepositoryImpl INSERT at line 136-155.
      evidence:
        - "odd-platform-api/src/main/resources/db/migration/V0_0_59__data_collaboration.sql:25-39"
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/repository/reactive/ReactiveMessageRepositoryImpl.java:136-155"
      drift_class: at_least_once_delivery_no_dedup
      provenance: STATIC — SHB-129 evidence.
    - facet: no audit log — forged-vs-real indistinguishable post-incident
      observed: |-
        `message_provider_event` rows lack `created_by_caller_ip` /
        `created_by_signature_valid` flags. Post-incident analysis cannot
        distinguish forged from real after the fact; operators have no
        forensic trail.
      expected: |-
        Add `created_by_caller_ip` + `signature_valid_at_receipt` columns
        on `message_provider_event` (or a separate audit table). Capture
        from request context at controller-tier; persist with the row.
      evidence:
        - "odd-platform-api/src/main/resources/db/migration/V0_0_59__data_collaboration.sql:25-39"
      drift_class: no_forensic_trail_on_inbound_webhook
      provenance: STATIC — SHB-129 inference.
    - facet: forged URL-verification challenge enables endpoint enumeration
      observed: |-
        An attacker reaching the platform's HTTP port can forge a Slack
        URL-verification challenge → platform echoes back the `challenge`
        value with 200 OK. No harm to the platform, but the 200-on-challenge
        confirms the endpoint exists, distinguishes ODD installations from
        non-ODD HTTP hosts at scale.
      expected: |-
        Validate the `X-Slack-Signature` signature BEFORE responding to
        URL-verification challenges (Slack's own requirement). 401 on
        unsigned challenge.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/controller/EventApiController.java:22-27"
      drift_class: endpoint_existence_enumeration_via_unsigned_challenge
      provenance: STATIC — SHB-129 inference.
    - facet: "`incoming-webhook` bot scope unused"
      observed: |-
        The Slack app manifest published in the live docs requests
        `incoming-webhook` bot scope, but it is UNUSED by the code (verified
        per EventApiController sidecar doc_drift_findings[1]) — historical
        copy-paste from a Slack example manifest. Operators following the
        docs grant a privilege the platform does not exercise.
      expected: |-
        Tighten the manifest to drop the unused scope. Operators see the
        platform request only the scopes it actually uses.
      evidence:
        - "https://docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#enable-data-collaboration (manifest)"
      drift_class: requested_scope_unused
      provenance: STATIC — SHB-129 + EventApiController sidecar doc_drift_findings[1].

