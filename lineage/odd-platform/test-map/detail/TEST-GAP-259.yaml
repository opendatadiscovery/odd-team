behaviour: 'Transactional rollback of view-count — no test asserts that a downstream
  enrichment failure (e.g. failure inside the 4-zip enrich-details Mono) rolls back
  the view-count UPDATE. The @ReactiveTransactional annotation implies it would; not
  verified. STRENGTHENED batch H — the repository sidecar confirms incrementViewCount
  is a UPDATE issued from within DataEntityServiceImpl.getDetails @ReactiveTransactional
  (lines 173-180); the F-001 chain is unverified by JVM tests (only by live HTTP probe
  P-001 / P-004). STRENGTHENED batch I — the DataEntityServiceImpl sidecar identifies
  this as one of EIGHT @ReactiveTransactional methods on the service whose rollback
  semantics are completely untested. A regression that breaks the rollback would either
  double-count views on retry (no rollback → next call re-increments on top of the
  failed one) or strand orphan increments (no rollback → counter advances regardless
  of response success).'
