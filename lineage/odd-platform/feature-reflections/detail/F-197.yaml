# Data Collaboration UI Tab (Discussions) — product-owner reflection

## product_owner_narrative

The Discussions tab is ODD Platform's in-app bridge to Slack: on any data entity's
detail page, a user opens the **Discussions** tab and sees a three-panel surface — a
channel selector on the left, an infinite-scroll messages list in the middle, and a
thread/message drilldown on the right — that mirrors a Slack conversation anchored to
that specific catalog entity (per F-197 chain hop-1, `DataCollaboration.tsx:18-80`; per
`DataEntityDetailsTabs.tsx:96-99` for the tab mount). The product promise is "discuss
this dataset where your team already talks — in Slack — without leaving the catalog,
and keep the conversation pinned to the entity it's about." It is one of five opt-in
"Active Platform Features" subsystems (`system-mission.md` P-07): the platform is an
actor, posting to and reading from a configured Slack workspace on the operator's behalf.

A user interacts with the tab in three motions. (1) They read: the middle panel lists
messages, newest-anchored, and scrolls infinitely (chain hop-2, `MessagesList.tsx:22-74`).
(2) They drill: clicking a message navigates to a per-message URL and opens the thread on
the right (chain hop-4, `Thread.tsx:19-62`). (3) They write: a "Share to Slack" /
create-message affordance (mounted from the entity-detail header, NOT from inside the tab
— per PLT-095, `DataEntityDetailsHeader.tsx:132-144`) opens a dialog with a Slack-channel
autocomplete and a text box, and on submit enqueues the message
(chain hop-3, `CreateMessageForm.tsx:23-122` → `POST /api/datacollaboration/providers/slack/messages`,
the `postMessageInSlack` sidecar). The backend returns `202 Accepted` and a single-leader
background sender delivers to Slack asynchronously (per `postMessageInSlack.md`:understanding;
`AdrDataCollabDeliveryScanTest` pins this decoupling as ADR-0020).

The working parts the operator would be shown in a demo: a **channel autocomplete** that
lists the bot's joined public channels (filtered by a prefix match — typing the middle of
a channel name returns nothing, per `DataCollaborationController.md`:invariants and the
live doc); an **infinite-scroll list** that re-fetches near the bottom; a **deep-linkable
message URL** (the right panel reads `messageId` from the URL); and a **send dialog**. The
whole backend is class-gated by `@ConditionalOnDataCollaboration` and **ships disabled by
default** (`datacollaboration.enabled=false`, pinned by
`FeatureGatingDefaultsTest.offByDefaultFamily_shipsDisabled`); enabling it requires a Slack
OAuth bot token (`DataCollaborationController.md`:understanding finding 1).

The integration story: Discussions is a P-07 sub-feature that feeds P-01 (Data Discovery)
— a conversation about an entity is one more change-driven signal surfaced alongside the
entity (`system-mission.md` P-07 cross-pillar `feeds: [P-01]`). It is explicitly distinct
from the one-way Slack **alert** webhook (Notifications): Discussions is a full bidirectional
OAuth Slack app (`DataCollaborationProperties.md`:docs_link_semantic fetched_excerpt).

The edge cases a senior product owner flags in a demo are exactly where this surface is
thin, and they are the load-bearing findings below: the tab is **visible even when the
feature is off** (the user clicks into a dead feature on a default install); opening a
thread that fails to load **silently navigates the user away with no error**; the
discussions URL is **not fully deep-linkable** (the channel filter and scroll position live
in React component state, not the URL, so a shared link drops them); the empty state reads
hard-coded English ("No messages") with no i18n; and — the asymmetry that makes the first
finding sharp — the **send button IS feature-gated** (`<WithFeature>`, PLT-095) while the
**tab that hosts the whole feature is NOT** (`DataEntityDetailsTabs.tsx:96-99`), even though
the very same `WithFeature` / `getActiveFeatures` mechanism was available to gate it
(`WithFeature.tsx`, read for validation).

## hypotheses

- id: H-001
  hypothesis: |-
    When a user opens any non-deleted data entity on a default deployment
    (datacollaboration.enabled=false), the Discussions tab is NOT shown — because the
    backend feature is off, the platform should not advertise a tab whose every route 404s.
  derivation: |-
    Pillar P-07 frames all five sub-features as opt-in ("a deployment can run with all
    five off and still serve the catalog"); a tab is an advertisement of a working
    capability; the UI ships a WithFeature mechanism (getActiveFeatures + Feature enum) and
    uses it for the Share button, so gating the tab the same way is the expected pattern.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      DataEntityDetailsTabs.tsx:96-99 renders the Discussions tab with `hidden:
      isStatusDeleted` — the ONLY hide condition is entity-deletion. It does not consult
      `getActiveFeatures` / the DATA_COLLABORATION Feature flag at all, even though
      WithFeature.tsx:20-25 shows that the active-features list IS available to the UI from
      redux (getActiveFeatures selector) and is used elsewhere (the Share-to-Slack button,
      PLT-095). The backend is @ConditionalOnDataCollaboration and 404s every
      /api/datacollaboration/** route when disabled (DataCollaborationController.md
      invariant 1). On a default install the user sees and can click Discussions, lands on
      DataCollaboration.tsx, and the fetchDataEntityMessages call hits a 404-or-empty
      surface with no banner explaining the feature is off. The live doc acknowledges this
      verbatim ("The tab itself is currently rendered regardless of the flag").
    evidence:
      - sidecar: "(source read — Rule 8 exception)"
        section: DataEntityDetailsTabs.tsx
        cite: "odd-platform-ui/src/components/DataEntityDetails/DataEntityDetailsTabs/DataEntityDetailsTabs.tsx:96-99"
        note: "Discussions tab hidden only on isStatusDeleted — no feature-flag consult."
      - sidecar: "(source read — Rule 8 exception)"
        section: WithFeature.tsx
        cite: "odd-platform-ui/src/components/shared/elements/WithFeature/WithFeature.tsx:20-25"
        note: "getActiveFeatures + Feature enum is the available-but-unused gating mechanism."
      - sidecar: odd-platform__java__DataCollaborationController__controller-class__DataCollaborationController.md
        section: invariants
        cite: "DataCollaborationController.java:21 (@ConditionalOnDataCollaboration) + application.yml:205"
        note: "Backend 404s all three routes when datacollaboration.enabled=false (the default)."
      - sidecar: "(live doc cross-ref)"
        section: WebFetch
        cite: "https://docs.opendatadiscovery.org/features/active-platform-features/data-collaboration (2026-06-03, 200)"
        note: "Doc acknowledges 'currently rendered regardless of the flag' — doc-honest, not fixed."
    operator_visible_failure: |-
      On a default (out-of-box) deployment, every entity detail page shows a Discussions
      tab that leads nowhere: the user clicks it expecting a feature, lands on an empty
      three-panel shell (or a 404-driven empty list), and gets no message telling them the
      feature must be enabled by an operator. First-time evaluators of ODD form the
      impression "Discussions is broken" rather than "Discussions is off." The send path is
      gated (button absent) but the read path advertises itself — so the user sees a tab,
      not the button, which is the most confusing possible split. Fixing this with doc copy
      ("the tab is currently rendered regardless of the flag") papers a structural UI defect.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

