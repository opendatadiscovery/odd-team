realism_caveats: |
  - This probe relies on Postgres reordering rows in storage between
    pre-mutation and post-mutation reads. CLUSTER + no-op UPDATE is the
    chosen perturbation; in production, VACUUM, HOT-updates, or
    concurrent UPDATE traffic may reproduce the same race. Necessary
    condition test: if bug manifests → mechanism proven; if not →
    `probe-inconclusive`, not `passed`.

  - The PUT endpoint path needs verification against OpenAPI spec; body
    field name (`title_name`) may differ in the actual contract.

  - DISABLED auth — the row-order non-determinism is auth-mode-agnostic.

  - Complementary probe variant (future P-018-B) should pin the same
    behaviour for the TAG-list path (`ReactiveTagRepositoryImpl.listDataEntityDtos`,
    `TagActivityHandlerImpl`); the mechanism is identical, the wrapped
    event type is TAG_ASSIGNMENT_UPDATED.
