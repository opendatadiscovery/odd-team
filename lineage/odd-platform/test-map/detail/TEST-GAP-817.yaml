behaviour: |-
  **MEDIUM — Four distinct conditions collapse to indistinguishable `200 OK + items: []` responses, contradicting the sibling lineage endpoint.**

  The endpoint silently conflates:
  1. **Unknown DEG** (the ODDRN does not exist in the catalog).
  2. **Empty DEG** (the ODDRN exists but has no GROUP_ENTITY_RELATIONS).
  3. **Malformed ODDRN** (`""`, `"x"`, `"//garbage"`, URL-encoded edge cases like `%20`).
  4. **Soft-deleted DEG** (`group_entity_relations.is_deleted=true` for all members — though TEST-GAP-818 establishes that the soft-deleted DATA_ENTITY *members* surface here, the soft-deleted EDGE filter handles this case differently).

  All four return `200 OK` with `items: []`. Caller has no contract distinguishing them.

  **Contradicts the sibling endpoint**: `LineageServiceImpl.getDataEntityGroupLineage` (`LineageServiceImpl.java:62`) DOES raise `NotFoundException("Data entity group", id)` for the same empty-membership condition. The same platform produces two different contracts for the same semantic situation depending on which endpoint the caller hits — F-016 (DEG-Anchored Lineage) returns 404, F-008's read-side sibling returns 200-empty. The asymmetry is silent in code (no comment defends either choice) and silent in docs (no live ODD page describes either).

  **No ODDRN format validation**: `IngestionController.java:76` declares `final String degOddrn` — a raw String passed verbatim into a parameterised SQL predicate. There is no `OddrnFormatValidator` class (Grep across odd-platform-api/src/main/java returns no match). Garbage input produces empty-200 silently.

  **Why MEDIUM** (not HIGH): the absence of a 404 contract is a usability/integration-quality gap, not a security failure (the unauthenticated-reach is in TEST-GAP-815/816). But a refactor that adds `switchIfEmpty(Mono.error(new NotFoundException(...)))` between releases would silently break every third-party reader that depends on the empty-200 shape — and the test today does NOT pin either contract.

  **Test gap shape**: regression-pin test that asserts the current empty-200 contract for each of the four conditions AND asserts the sibling F-016 endpoint raises 404 — pinning BOTH sides of the asymmetry so future fixes are deliberate.
