name: Get Title List (paged owner-relationship-label directory)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  NEW OPERATION, batch ZE — GET /api/titles?page=N&size=N&query=N.
  Returns paginated TitleList of owner-relationship labels (the
  Title directory). Sole read endpoint exposed by TitleController;
  WRITES happen as a side-effect of OwnershipServiceImpl.create /
  update calling titleService.getOrCreate.

  IMPLEMENTATION: TitleController.java:17-23 →
  TitleServiceImpl.java:25-27 → titleRepository.list
  [inherited from ReactiveAbstractCRUDRepository.java:84-100] →
  SELECT * FROM title WHERE LOWER(name) LIKE LOWER('%query%') AND
  deleted_at IS NULL ORDER BY id ASC LIMIT size OFFSET (page-1)*size.

  ORDERING: id ASC at the OUTER select — INSERTION order, NOT
  alphabetical, NOT by usage count, NOT by relevance to typed
  query. Operators discover this as 'why does the dropdown show
  old typo'd titles before clean ones?'. Pillar-wide convention
  applied via ReactiveAbstractCRUDRepository inheritance.

  SEARCH SEMANTIC: case-insensitive substring match on `name`
  (nameField.containsIgnoreCase(nameQuery) at
  ReactiveAbstractCRUDRepository.java:240-249). Empty/null query
  returns ALL non-deleted titles.

  SOFT-DELETE: ReactiveTitleRepositoryImpl extends
  ReactiveAbstractSoftDeleteCRUDRepository — adds
  `deleted_at IS NULL` predicate to the WHERE. No production
  call-site for the delete method (grep confirms — only test
  code), so soft-delete is provision-now-use-later.

  AUTH POSTURE: no @PreAuthorize, no permission gate, no
  owner-scoping. Falls through to `pathMatchers('/**').authenticated()`.
  Under DISABLED: anonymous reachable. Under non-DISABLED: any
  authenticated user sees the full directory regardless of role.

  PAGINATION GAP: no @Min on page → page=0 yields (0-1)*size =
  -size offset → Postgres rejects negative OFFSET. No @Max on
  size → caller may pass size=1_000_000 and the JVM materialises
  the entire directory. UI default is size=30 hard-coded at
  OwnerTitleAutocomplete.tsx:43 — for installations with > 30
  titles, the OLDEST 30 win the autocomplete window; newer titles
  are invisible to the operator (client-side MUI filter operates
  on the fixed window).

  HOT-PATH: every ownership-form open in the UI + every Data
  Quality filter open. The UI debounces 500ms.
