      scheduled-transitions / upcoming-flip read; getPojosForStatusSwitch is an
      internal repository method called only by the job, not surfaced via any
      controller — ReactiveDataEntityRepositoryImpl.md:upstream_callers lists only
      DataEntityStatusSwitchJob). Operators must inspect entities one-by-one on
      their detail pages to learn what will auto-delete. There is no batch preview,
      no dry-run, no "what flips in the next 24h" surface.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveDataEntityRepositoryImpl.md
        section: upstream_callers (getPojosForStatusSwitch)
        cite: "ReactiveDataEntityRepositoryImpl.java:256 — upstream caller is DataEntityStatusSwitchJob ONLY"
        note: "the only reader of the elapsed-switch-time set is the internal job; nothing exposes it to operators"
    operator_visible_failure: |-
      An operator who fat-fingers a status_switch_time (e.g. picks the wrong date)
      has no surface to catch it before the 10-minute reaper acts and soft-deletes
      the entity (with its cascade). Recovery requires manually restoring each
      entity. For a large catalog there is no way to audit "what is scheduled to
      disappear." This is a UX / observability gap, not a data-correctness bug —
      severity LOW. NOTE: this finding is dampened by H-002 — because the
      hard-delete never fires, a mistaken flip is currently recoverable (the row
      persists forever as DELETED); once H-002 is fixed, the absence of a preview
      becomes materially more dangerous.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-010
  hypothesis: |-
    Changing a data entity's status is gated by the DATA_ENTITY_STATUS_UPDATE
    permission — only an authorized operator can flip a status.
  derivation: |-
    Pillar mission (RBAC gates mutations) + the live doc claim ("Operators need the
    DATA_ENTITY_STATUS_UPDATE permission") + the SecurityRule on the endpoint.
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |-
      Under auth.type ∈ {LOGIN_FORM, OAUTH2, LDAP} the claim HOLDS:
      SecurityConstants.SECURITY_RULES gates PUT /api/dataentities/{id}/statuses on
      DATA_ENTITY_STATUS_UPDATE, resource-scoped per entity
      (updateStatus.md:security.authorization_assertions). BUT under
      auth.type=DISABLED, DisabledAuthSecurityConfiguration uses
      anyExchange().permitAll() and SECURITY_RULES is NOT consulted — ANY caller
      who can reach the port can PUT any entity to DELETED, triggering the
      soft-delete cascade. The doc's "operators need the permission" is true ONLY
      for the three non-DISABLED modes. (This DISABLED-mode bypass is a known
      platform-wide posture — 11-sidecar triangulated per concepts.yaml — not
      specific to this feature.)
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: security.known_security_gaps.[0] + security.auth_mode_relevance
        cite: "SecurityConstants.java:277-281 (the rule) + DisabledAuthSecurityConfiguration.java:14-17 (anyExchange().permitAll() bypass)"
        note: "gated under LOGIN_FORM/OAUTH2/LDAP; wide-open under DISABLED"
    operator_visible_failure: |-
      A production deployment that mis-sets auth.type=DISABLED (documented dev-only)
      exposes wholesale anonymous soft-deletion of any entity, cascading to
      lineage / group-relations / statistics. The doc-stated permission gate does
      not fail-closed. Severity MEDIUM here (the DISABLED-mode danger is tracked
      cross-cuttingly; for THIS feature it is the partial-truth of the permission
      claim). Routes to the existing DISABLED-mode finding family, not a new item.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-011
  hypothesis: |-
    For every DELETED entity, an auditor can determine WHO deleted it and when —
    including entities the scheduler auto-flipped (the audit trail names the actor).
  derivation: |-
    Negative-space + pillar cross-reference to the Activity Feed audit surface
    (DATA_ENTITY_STATUS_UPDATED events) — an audit trail that cannot attribute a
    deletion is operationally weak.
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      Manual PUT transitions DO emit a DATA_ENTITY_STATUS_UPDATED activity event
      with oldState/newState captured programmatically
      (updateStatus.md:implicit_adrs.[4] + security.data_exposure.[1]) — a positive
      finding (this REFINES the batch-E no-audit-log theme: DataEntity mutations ARE
      audited, unlike RBAC mutations). HOWEVER the scheduled auto-flip path runs
      under the system principal with no logged-in user, and the F-044 test_matrix
      security cell explicitly notes "Auto-flip path operates with system principal
      — no audit trail of which entities transitioned automatically (Activity feed
      coverage TBD)." So: human-initiated deletes are attributable; scheduler-
      initiated deletes attribute to "system" / have no human actor. The audit
      trail is complete for one path and identity-less for the other.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: implicit_adrs.[4] + security.data_exposure.[1]
        cite: "DataEntityInternalStateServiceImpl.java:155-182 (programmatic event emission with oldState/newState)"
        note: "manual path emits DATA_ENTITY_STATUS_UPDATED; positive finding"
      - sidecar: F-044 feature-flow (test_matrix.security.uncovered)
        section: test_matrix.security
        cite: "F-044.yaml test_matrix.security — 'no audit trail of which entities transitioned automatically'"
        note: "the scheduled path's attribution is explicitly unresolved"
    operator_visible_failure: |-
      An auditor reconstructing "who deleted entity X" finds a clean answer when a
      human did it, but for scheduler-flipped entities the activity record (if any)
      names the system, not the operator who originally set the status_switch_time.
      The accountable human — whoever scheduled the deletion days earlier — is not
      linked to the eventual flip. This is an audit-completeness gap (new facet:
      auto_flip_actor_is_system_principal_no_attribution). Severity MEDIUM.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate

