gap_id: TEST-GAP-117
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java IngestionDataEntitiesFilter config-key-consumer:auth.ingestion.filter.enabled@L20
surfaced_by:
- IngestionDataEntitiesFilter@L20.md:tests_coverage_semantic.uncovered_behaviours.[1]
behaviour: Opt-in activation verification. With `auth.ingestion.filter.enabled=true`
  the filter bean IS registered in ApplicationContext; a request without `Authorization`
  header returns 401 `Token is missed`. The current test suite cannot distinguish
  (a) silent inversion of default-off → default-on, (b) `@ConditionalOnProperty` removal
  making the filter unconditional, (c) `havingValue="true"` change accepting any truthy
  value. Doubly critical because the filter is the ONLY defense for `POST /ingestion/entities`.
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ingestion/IngestionFilterEnabledTest.java
  name: ingestionEntities_filterEnabled_unauthenticatedReturns401TokenMissed
evidence:
- 'IngestionDataEntitiesFilter@L20.md says: ''The test suite cannot distinguish a
  code change that (a) silently inverts the default-off stance, (b) removes the @ConditionalOnProperty
  annotation entirely and unconditionally registers the filter, (c) breaks the havingValue="true"
  literal match by accepting any truthy value, or (d) changes the parent''s Authorization:
  bearer  prefix to a different scheme'''
- concepts.yaml:entities[Ingestion Filter].security_aggregate.weaknesses.[0]
cross_references:
- concepts.yaml:entities[Ingestion Filter].security_aggregate.weaknesses.[0]
proposed_action: Add a WebTestClient test with a test profile setting `auth.ingestion.filter.enabled=true`;
  assert (i) 401 `Token is missed` on missing header, (ii) 401 `Token is not correct`
  on wrong token, (iii) 2xx on correct token. Pair with a `@SpringBootTest` assertion
  that the IngestionDataEntitiesFilter bean is present when the property is set.
