mitigations_unimplemented:
  - |-
    Disambiguate the error message — refactor the
    BadUserRequestException(s) at DataEntityServiceImpl.java:393-397 and
    416-420 to produce:
      (a) NotFoundException("Data entity", dataEntityGroupId) if no row
      (b) BadUserRequestException("Entity %s is not a DEG (class
          mismatch)") if class != DATA_ENTITY_GROUP
      (c) BadUserRequestException("DEG %s is ingested (not manually
          created); UI cannot modify ingested DEG membership") if
          manuallyCreated == false
  - |-
    Document the manually-created vs ingested DEG distinction on
    /features/data-discovery/groups-domains.md — operators evaluating
    why a DEG visible on the Catalog Overview can't accept manual
    membership writes (because it was ingested) need this context.
  - |-
    Cross-reference this invariant from the
    "permission-bypass-via-owner-auto-create-side-door-write-path"
    invariant — the DEG path is the COUNTER-EXAMPLE: the codebase has
    deliberate side-doors (Owner/Title/Tag/Namespace) AND deliberate
    non-side-doors (DEG). The contrast clarifies the architectural
    boundary.
notes: |-
  NEW invariant captured in batch 2026-05-19L. The pattern is intent-anchored
  (the maintainer's explicit ADR per addDataEntityDataEntityGroup
  implicit_adrs.[0]); the invariant exists to make the intent grep-able
  and to anchor future refactors against accidentally introducing a DEG
  side-door.

  Cross-cutting connections:
    - Inverse of "Permission-bypass via Owner auto-create (side-door
      write path)" — that captures the deliberate side-door pattern;
      this captures the deliberate non-side-door pattern. Together they
      map the platform's auto-create stance.
    - Pairs with "Write-collaborative DEG — NO DEG-side authorization"
      — the DEG-side VALIDITY is enforced; the DEG-side AUTHORIZATION
      is not. The two together characterize the DEG's defensive surface.

  One DOC-NNN candidate:
    Document the manually-created vs ingested DEG distinction on the
    operator-facing groups-domains.md page.
