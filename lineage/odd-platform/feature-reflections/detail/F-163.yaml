    '******'), both the Datasources and Collectors tabs correctly classify a
    masked token as masked (show Regenerate) and a plaintext token as plaintext
    (show Copy + warning).
  derivation: |-
    The substring(0,6) === '******' sniff is the sole masked/plaintext
    discriminator on both surfaces; under today's format it should classify
    correctly.
  seed_source: endpoint-shape (wire contract)
  validation:
    verdict: confirmed
    actual_behavior: |-
      The backend TokenMapper emits exactly six asterisks as the mask prefix on
