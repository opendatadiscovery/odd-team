notes: |-
  This invariant CLARIFIES (does NOT contradict) the existing
  `partial-permission-gating-edit-button-gated-content-unconditional`
  invariant — that one documents the WithPermissions HOC behaviour
  (hide-not-disable on mutation buttons); THIS one documents the
  WithPermissionsProvider SIBLING behaviour (context seed only).
  Both must coexist for a maintainer reading the catalog to understand
  the full permission-rendering picture.

  Coherence (Rule 6): grepped feature-flows/index.yaml + invariants
  detail/ for "WithPermissionsProvider" — found 7 mentions, all
  consistent with the context-seed semantic (e.g.
  DataEntityDetails wraps in WithPermissionsProvider carrying 3
  permissions for descendant mutation affordances per the existing
  partial-permission invariant line 22-25). No contradicting claim
  found. STRENGTHENS the existing finding by adding 5 route-mount
  contributors (ZH) + 5 more (ZI) and surfacing the wrapper's
  name-vs-behaviour drift as a distinct first-class concept across
  10 independent route mounts.

  Batch ZI adds a notable variant — the queryExamples details
  container layers THREE WithPermissionsProvider wrappers (route +
  resource-permissions in container + inner WithPermissions HOC).
  All three layers exhibit the same context-only semantic at the
  Provider; only the innermost HOC blocks. This is the SHARPEST
  evidence of the layered context-seed pattern's intentional use
  — the architecture IS deliberate; the NAME is the drift.
