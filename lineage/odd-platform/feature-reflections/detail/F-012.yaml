        cite: "ReactiveGroupEntityRelationRepositoryImpl.java:79-89,92-101,104-112,127-137 + V0_0_21:6 + V0_0_79:14-15"
        note: "soft-deleted row blocks PK; onDuplicateKeyIgnore → 'already in this DEG'; restore not invoked on add."
    operator_visible_failure: |-
