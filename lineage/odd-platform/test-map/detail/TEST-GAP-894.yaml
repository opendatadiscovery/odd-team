behaviour: |-
  **MEDIUM — NONE of the four tag-write surfaces (`createTag` direct create, `updateTag` rename, `createTermTagsRelations` term-tag side-channel, `updateDatasetFieldTags` dataset-field side-channel) validates the tag name beyond OpenAPI `type: string`. `TagFormData.name` / `TagsFormData.tag_name_list[]` / `DatasetFieldTagsUpdateFormData.tags[]` are all declared `type: string` with NO `pattern`, `minLength`, or `maxLength`; there is no DB-level `CHECK` constraint on `tag.name`. Empty-string, whitespace-only, control-character, leading/trailing-whitespace, homoglyph-variant, and unbounded-length tag names are accepted into the global `tag` directory — which `getPopularTagList` (`GET /api/tags`) renders to EVERY authenticated user.** Method-level primary source from the four batch-X-TAGGING controller-method sidecars:

  - `createTag` sidecar: `TagFormData.name` declared `type: string` with no `pattern`/`minLength`/`maxLength` (`components.yaml:340-345`); no DB `CHECK` on `tag.name`. `bulkCreate` passes names verbatim into `TagPojo`.
  - `updateTag` sidecar: same — a rename to an empty/whitespace/control-char/unbounded name is accepted; the renamed tag renders to every user on the popular-tags surface AND propagates into FTS vectors.
  - `createTermTagsRelations` sidecar: `TagsFormData.tag_name_list` items declared `array of type: string` (`components.yaml:2215-2218`) with no per-item constraint; `TermServiceImpl.upsertTags` does not trim/normalise; `divideTagsByExistence` passes names verbatim into `new TagPojo().setName(n)` (`TagServiceImpl.java:155`). `[' tag ', 'tag']` creates two distinct directory rows.
  - `updateDatasetFieldTags` sidecar: `DatasetFieldTagsUpdateFormData.tags` declared `array of type: string` (`components.yaml:1830-1833`) with no `maxLength`/`minLength`/`pattern` and no `maxItems`; the service does not trim/normalise. `tags: [' x ', 'x']` resolves to two distinct directory tags.

  **The shared root**: all four paths converge on the same un-validating directory write — `createTag` -> `bulkCreate` directly; the three side-channels via `getOrCreateTagsByName` -> `divideTagsByExistence` -> `bulkCreate`. None trims, normalises, or length-bounds. The global `tag` directory accumulates typos, whitespace-padded duplicates, homoglyph variants, and free-text junk over the deployment lifetime.

  **Operator-visible consequence**: the controlled-vocabulary surface (Management -> Tags) is not actually controlled — any of four write paths can pollute it with garbage names. A homoglyph or whitespace-variant duplicate (`PII` vs `PII ` vs `РΙΙ`) fragments the vocabulary; an empty-string tag renders as an invisible chip; an unbounded name is a mild DoS / UI-layout hazard.

  **Test gap shape**: a `WebTestClient` / `@SpringBootTest` test asserting, for EACH of the four write paths, the CURRENT behaviour for pathological inputs — empty string, whitespace-only, leading/trailing whitespace, control characters, a very long string. The test pins whatever the current behaviour is (per the sidecars: accepted, no validation) so a future maintainer adding validation makes a coordinated, test-visible change across all four surfaces consistently.
