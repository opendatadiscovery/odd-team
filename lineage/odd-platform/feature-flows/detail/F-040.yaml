control_summary: |-
  3 of 16 cells PARTIAL — repository-tier integration tests pin ordering +
  pagination + status filter (DataEntityRunRepositoryImplTest.java:34-93);
  controller-tier / service-tier / mapper-tier are GAP. Fourteen
  load-bearing drift facets cluster around four themes: (a) cross-owner
  read posture extended to per-test history with a DISTINCT status_reason
  diagnostic-text leak channel (the data-shape is qualitatively different
  from the namespaces/owners/tags lists already exposed by cross-owner
  read elsewhere — status_reason commonly carries operator-supplied
  failed-row samples + PII); (b) wire-enum vs DB-enum asymmetry trips the
  endpoint into HTTP 500 exactly when an in-flight RUNNING run exists;
  (c) NULL-end-time ordering surprises (Postgres NULLS FIRST puts RUNNING
  rows undated at the top of the timeline); (d) UI sort-key vs backend
  sort-key divergence (operator sees `startTime` column, backend orders by
  `end_time`).

  Three probes already authored by the sidecar: P-150 (NULL ordering +
  tie-breaker), P-151 (wire-enum-asymmetry 500 during in-flight runs),
  P-152 (cross-owner read + status_reason leak channel). All are local-only
  per Rule 7 — docker-compose ODD platform + Postgres + curl + a stub
  test-framework that emits a RUNNING-status run.

  The HIGHEST-LEVERAGE probe candidates, all executable on the maintainer's
  local workstation:

  (a) wire-enum-asymmetry pin (P-151) — boot probe stack with one DQ
      test that has a RUNNING run in flight (e.g. seed
      `data_entity_task_run` row with `status=RUNNING` + `end_time=NULL`);
      GET /api/dataentities/{id}/runs; assert HTTP 500 + Spring error
      page citing IllegalArgumentException on enum conversion. Pins
      the unavailability-during-in-flight-runs hypothesis end-to-end.

  (b) cross-owner read + status_reason leak pin (P-152) — boot probe
      stack with auth.type=LOGIN_FORM + create alice's DQ test with a
      status_reason containing recognisable PII-shaped text + bob (no
      owner association); curl as bob → assert HTTP 200 + response
      body containing alice's status_reason verbatim. Pins the
      diagnostic-text leak channel.

  (c) NULL ordering pin (P-150) — boot probe stack with one RUNNING
      row + 9 completed rows; GET runs; assert the RUNNING row appears
      at index 0 of items[]; UI label shows startTime with empty
      Duration. Pins the operator-surprise UX shape.

