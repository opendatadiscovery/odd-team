name: Management section is half-gated — Associations is the ONLY route-gated sub-area (RestrictedRoute), 8 others render to every authenticated user
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  **NEW HIGH-severity INVARIANT, batch ZH (2026-05-26)** — the Management
  section at `/management/*` exhibits a sharply asymmetric route gate
  posture. The section hosts 9 sub-areas (Namespaces, Datasources,
  Integrations, Collectors, Owners, Tags, Owner-Associations, Roles,
  Policies) at a single splat route in App.tsx:62. **Only ONE of the 9
  sub-routes is route-gated**:

    - `/management/associations/*` at ManagementRoutes.tsx:101-110 uses
      `<RestrictedRoute isAllowedTo={hasAccessTo(OWNER_ASSOCIATION_MANAGE)}
       redirectTo='../namespaces' />` — a TRUE redirecting guard.

  The remaining EIGHT sub-routes (Namespaces / Datasources /
  Integrations / Collectors / Owners / Tags / Roles / Policies +
  /policies/:policyId + /integrations/:integrationId) all render for
  every authenticated user including users with zero Management-tier
  permissions. The lists are fetched unconditionally on mount (e.g.
  NamespaceList.tsx:46-48 dispatches fetchNamespaceList on the empty
  permission set); only the create/update/delete BUTTONS are hidden
  via the inner `<WithPermissions>` HOC HIDE-not-DISABLE convention.

  **The operator mental-model trap**: an operator reading the docs
  (which describe Permissions / Policies / Roles / Owners as
  Authorization concepts under `enable-security/authorization`) forms
  the mental model "the Management page is admin-only". The code says
  "any authenticated user reads the full Owner / Role / Policy /
  Namespace / Tag / Collector / DataSource / Integration catalogs;
  only the Associations approval inbox is admin-gated; only mutation
  buttons are gated everywhere else." The asymmetry is unexplained
  in code and undocumented on the live docs (per the route sidecar's
  doc_drift_findings — the user-facing Management UI page does NOT
  exist on docs.opendatadiscovery.org).

  **Why Associations is gated**: structurally, the OwnerAssociation
  approval inbox lists pending/active/historical user-owner mapping
  requests — a high-stakes admin surface where the wrong-role reader
  would see WHO is requesting WHICH user-owner mapping (a privacy +
  org-structure signal). The RestrictedRoute guard reflects that.
  No equivalent guard exists for Policies (where wrong-role readers
  see the policy JSON definitions including resource-condition
  predicates) or for Roles (where wrong-role readers see the role-to-
  policy mapping). The boundary case for "what is admin-only" is
  inconsistently drawn.

  **The Integrations sub-route is structurally further-broken**:
  ManagementRoutes.tsx:150 declares `<Route path='integrations/*'
  element={<Integrations />} />` with NO WithPermissionsProvider
  wrapping at all (the OUTER Management.tsx provider whose
  allowedPermissions=[OWNER_ASSOCIATION_MANAGE] is the only context
  in scope). Any inner `usePermissions().hasAccessTo(Permission.X)`
  call inside the Integrations subtree falls back to that outer
  context — which only matches OWNER_ASSOCIATION_MANAGE. So any
  Integration-form `hasAccessTo(DATA_SOURCE_UPDATE)` predicate
  deny-by-defaults regardless of the user's GLOBAL permissions.
  Whether the bug is BROKEN-OPEN or BROKEN-CLOSED depends on
  which side of the gate the bug lands.

  **Cross-layer consistency**: the half-gated UI posture mirrors
  the half-gated BACKEND posture catalogued by the cross-controller
  permission-split pattern. Each Management API surface (POST
  /api/namespaces, POST /api/owners, POST /api/roles, POST /api/policy)
  is independently gated at the controller layer (per the batch
  ZD/ZF/W sidecars); READ endpoints are mostly UNgated (e.g.
  GET /api/tags/popular is anonymously readable per the TagController
  sidecar). UI permissive-route-level POSTURE mirrors backend
  permissive-read posture; both are read-collaborative by design.

  **Pinned by P-162** — auth-gate audit of the entire Management
  surface for a zero-permission authenticated user.

  vocabulary_status: codebase-anchored, doc-side-gap (the Management
  UI is one of the largest navigable surfaces and has NO doc page).
