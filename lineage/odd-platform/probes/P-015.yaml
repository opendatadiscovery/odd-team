expected_outcome: |
  STRESS_B2 PROBE: pin the actual HTTP response shape when ActivityController.getActivity
  is called with `beginDate=null`. The controller's code path is:

  ActivityController.getActivity(beginDate=null, endDate=<any>, ...)
   → Mono.just(activityService.getActivityList(null, <any>, ...)).map(ResponseEntity::ok)

  Where getActivityList synchronously returns Flux.error(new BadUserRequestException(...))
  at ActivityServiceImpl.java:98-100.

  The OUTER Mono produces ResponseEntity.ok(<error-flux>) successfully — the 200 status is
  constructed. The Flux body errors only when WebFlux's response writer subscribes to it.

  Three possible runtime outcomes:
  (a) HTTP 400 + ErrorResponse JSON body (ControllerAdvice rescues via @ExceptionHandler)
  (b) HTTP 200 + malformed/error-in-stream body (headers committed before subscription)
  (c) HTTP 500 + generic ErrorResponse (generic Exception handler catches what BadUserRequest
      missed at the body-subscription seam)

  This probe pins the actual behaviour. If (a) — the design is implicitly defended by Spring's
  rescue path; if (b) or (c) — the controller's Mono.just(Flux.error()) shape is a latent bug
  that should be fixed to Mono.error(...) for symmetric error propagation with getActivityCounts
  (line 53).

triggers:
