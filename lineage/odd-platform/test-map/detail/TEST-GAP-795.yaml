behaviour: |-
  **CRITICAL — Sustained poison-replay pins WAL position → primary disk exhaustion.** Distinct from TEST-GAP-455 (which pins the *replay loop semantics*) and TEST-GAP-173 (which pins the *slot rename orphan*), this gap pins the *operational consequence*: when `process(...)` consistently throws on the same WAL LSN, Postgres retains ALL WAL since `confirmed_flush_lsn` for the slot indefinitely. The primary's disk fills cluster-wide. There is NO operator-tunable knob, NO Prometheus gauge, NO actuator endpoint to observe the slot's lag. Operators discover the failure when the primary is OOM-on-disk and applications cluster-wide cannot write.

  **The compound failure mode** (the load-bearing F-009 fragility per concepts.yaml:4580 `poison-message-wal-replay-loop`):
  1. A single ALERT row with type-code outside `AlertTypeEnum` range (or pointing at hard-deleted data_entity_oddrn) is INSERTED via the alerting subsystem.
  2. WAL decodes the row to a `DecodedWALMessage`.
  3. `AlertNotificationMessageProcessor.process(...)` calls `AlertNotificationMessageTranslator.translate(...)` which throws `IllegalArgumentException` (unknown type code) or `IllegalStateException` (missing FK target).
  4. The throw bypasses the dispatcher's per-sender catch (which catches `NotificationSenderException` only) and reaches `NotificationSubscriber.java:90 catch (Exception e)`.
  5. The outer catch logs at ERROR, releases the advisory lock via try-with-resources, sleeps 10 s, re-acquires the lock, rebuilds the stream.
  6. The un-advanced LSN is re-delivered → repeat from step 3.
  7. PG WAL grows indefinitely for the slot. The primary's `pg_wal/` directory fills.
  8. No operator-visible signal beyond `log.error("Error occurred while subscribing", e)` at one severity, no Prometheus counter, no slot-lag gauge.

  **Why CRITICAL (operational, not security)**: WAL exhaustion takes down the PRIMARY (not just notifications). All writes cluster-wide stop. Operator recovery requires `pg_drop_replication_slot(...)` which loses ALL in-flight undelivered alerts. The platform's only documented remediation (per WebFetched live doc) is the slot-drop — which is destructive to the F-009 chain itself.

  **Distinguishes from prior coverage**:
  - **TEST-GAP-455** pins the replay-loop semantics (does the loop run? does LSN advance? does the 10s back-off fire?). It does NOT pin the WAL retention consequence.
  - **TEST-GAP-173** pins the slot-rename orphan (operator changes slot-name between deploys → old slot retains WAL). The cause is operator-action; THIS gap's cause is application-internal (no operator action needed; one poison row suffices).
  - **TEST-GAP-457** pins burst-rate exhaustion (10k alerts/sec exceeds Slack rate-limit). Different failure mode entirely.

  **Test gap shape**: end-to-end Testcontainers integration test demonstrating the WAL retention consequence. The test ASSERT is the `pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn)` value GROWING over time while the subscriber is stuck on a poison message. PINS the operational failure mode that documentation cannot otherwise express.
