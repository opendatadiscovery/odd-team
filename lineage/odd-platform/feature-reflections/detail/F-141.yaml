## maintainer_notes

(Preserved across refreshes — only the maintainer hand-edits this block.)

This is the first reflection on F-141. Notable for the maintainer: F-141 is a COMPOSITION feature, so most of its bug/caveat facets are owned by the per-widget features it composes. Of the 11 hypotheses, 5 re-derive already-tracked findings (convergent validation): H-002→PLT-077 (auth gate), H-005→PLT-026 (Top Tags ordering), H-008→PLT-104 + H-009→PLT-104 (view_count / Popular scoping), H-010→TEST-GAP-1013 (error boundary). 3 are net-new home-page-composition-specific items: H-003 (skeleton-vs-rendered CLS), H-006 (no fresh-deployment onboarding affordance), and H-011 (DISABLED-mode home-page fingerprinting inventory — needs probe PENDING-F-141-1). The use_case_coverage frontier sits at 4/11 verified — and all four verified promises are RED e2e tests pinning known bugs (IT-002, IT-005, IT-006), so even the "verified" promises are verified-as-currently-broken, not verified-as-working. There is NO green test guarding any happy-path promise of the platform's first surface; the highest-leverage net-new test is F-141-UC-02 (the auth-gate enum guard).
