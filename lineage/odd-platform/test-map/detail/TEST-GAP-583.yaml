behaviour: |-
  **NotFoundException → 5xx (NOT 401) — info-leak + misleading status code.** The filter throws `NotFoundException` at line 44 (unknown `dataSourceOddrn`) and lines 50-51 (datasource has null token AND parent collector lookup is empty). The parent `AbstractIngestionFilter.filter` only catches `AccessDeniedException` (line 40) to write 401; other exceptions including `NotFoundException` propagate to the default reactive error handler and surface as 500 Internal Server Error. Behavioral consequence: an attacker probing with arbitrary payload + valid token can DISTINGUISH (a) 'datasource exists, wrong token' (401) from (b) 'datasource does not exist' (5xx) — minor info-leak about which ODDRNs are registered. Operationally misleading too: an operator seeing 5xx in collector logs may chase a wrong root cause (think 'platform crashed') when the actual cause is a half-configured collector record. The fix (catch NotFoundException → 404 OR 401 with neutral message) is one-liner; pin the current behaviour first.
