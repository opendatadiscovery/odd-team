name: |-
  WAL-retention disk-exhaustion under poison-message-replay loop — no bound, no operator-visible signal (batch Y)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
  - P-08
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20Y — surfaced by primary-source
  examination of NotificationSubscriber.java (the WAL listener thread itself,
  not just the dispatcher implementor sidecar in batch K). PROMOTES the
  poison-message replay loop from a delivery-latency-only finding to a
  disk-exhaustion / availability finding for the entire Postgres primary.

  THE NEW PRIMARY-SOURCE EVIDENCE — NotificationSubscriber sidecar batch Y:

    NotificationSubscriber.java:77-91 — the inner loop:
      buffer = stream.readPending() → decode → process() (UNCAUGHT) →
      stream.setAppliedLSN(stream.getLastReceiveLSN()) +
      stream.setFlushedLSN(stream.getLastReceiveLSN())
    The LSN advance is positioned AFTER process(); a throwing process()
    bypasses the LSN advance entirely. The outer catch at L90-92 logs and
    releases the lock; the 10s sleep + reacquire at L94-100 re-acquires
    and re-builds the stream.

    Postgres WAL retention behaviour (live doc + replication-mechanics):
      A replication slot retains WAL on the primary from confirmed_flush_lsn
      to current_wal_lsn. While the subscriber is stuck in the poison-replay
      loop, confirmed_flush_lsn does NOT advance — the slot's WAL accumulates
      indefinitely on the Postgres primary. Disk usage grows linearly with
      time at the primary's full WAL-write rate (every write to every table
      in the cluster, not just the alert table). For an active OLTP cluster
      this can reach the primary's free disk in hours.

    NO OPERATOR-VISIBLE SIGNAL from THIS file's telemetry:
      - performance.known_performance_gaps.[4]: no Prometheus gauge for
        notification_wal_last_applied_lsn, no counter for in-flight WAL
        backlog. Operators must SHELL INTO POSTGRES and run
        SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn)
        FROM pg_replication_slots WHERE slot_name=?
        to detect the backlog.
      - bugs_limitations_corner_cases.[9]: log.debug at L75 is the ONLY
        in-process trace of LSN progress, and DEBUG is not on by default.

  THE TWO-LAYER FAILURE MODE — distinct but compound:

    Layer 1 — DELIVERY STOPPED (batch K primary source, existing invariant
              poison-message-wal-replay-loop):
      The dispatcher's process() throws on every retry; no alerts reach
      Slack/Webhook/Email. The platform appears to be silent — operators
      configuring alerts notice the absence.

    Layer 2 — POSTGRES DISK EXHAUSTION (batch Y primary source, THIS
              INVARIANT):
      WAL on the primary grows unbounded while the loop runs. The
      primary's data + WAL share a filesystem in most ODD deployments
      (the live `/configuration-and-deployment/odd-platform` page does
      not warn operators to mount pg_wal on a separate volume); a full
      WAL volume causes Postgres to refuse new writes — affecting ALL
      ODD writes (ingestion, RBAC, owner-association requests,
      data-entity updates), not just notifications. The notification
      poison message therefore can cause platform-wide unavailability.

  THE OPERATOR REMEDIATION PATH — the live doc names ONLY one option:

    live `/configuration-and-deployment/odd-platform` Cleanup SQL (verbatim,
    WebFetched 2026-05-20 status 200):
      SELECT pg_drop_replication_slot('<replication_slot_name>');
      DROP PUBLICATION IF EXISTS <publication_name>;

    Dropping the replication slot DOES release the WAL retention — but it
    also discards every in-flight undelivered alert that has accumulated in
    the WAL stream behind the poison row. There is NO operator API to
    advance LSN past a single bad row; the only choice is "lose all
    in-flight alerts" or "let the disk fill".

  WHY THIS IS A DISTINCT INVARIANT (not a duplicate of the existing
  poison-message-wal-replay-loop invariant):

    The existing invariant captured DELIVERY blocked (notifications go
    silent). This invariant captures STORAGE growing (Postgres primary
    runs out of disk). The two failure modes have:
      - different MTTD (delivery silence — operator notices when an alert
        they expected didn't fire; disk growth — operator notices when
        Postgres refuses writes platform-wide)
      - different remediation urgency (delivery silence — non-urgent;
        disk exhaustion — emergency)
      - different blast radius (delivery silence — notifications-only;
        disk exhaustion — platform-wide write outage)

    The two invariants are complements; both should be cited when the
    F-009 poison-message fragility is discussed.

  SEVERITY HIGH — same severity as the parent poison-replay invariant;
  this invariant ADDS to the existing finding rather than refining its
  severity. The combined picture is: a persistently-bad ALERT row blocks
  ALL outbound delivery AND threatens platform-wide write availability via
  Postgres-primary disk exhaustion.
