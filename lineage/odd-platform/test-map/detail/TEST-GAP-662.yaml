behaviour: |-
  **HIGH-impact UI pagination correctness bug: `listDto` page query and count query use DIFFERENT predicates on `nameQuery`.** `ReactiveDataSourceRepositoryImpl.java:58-82` paginates with the private `queryCondition(nameQuery)` at line 156 which uses `DATA_SOURCE.NAME.startsWithIgnoreCase(nameQuery)`; the count branch `fetchCount(nameQuery)` at line 80 reaches the parent's `listCondition` (ReactiveAbstractCRUDRepository.java:236-249 line 243) which uses `nameField.containsIgnoreCase(nameQuery)` (overridden by `ReactiveAbstractSoftDeleteCRUDRepository.java:87-89` to add the soft-delete predicate). **The page returns rows whose name STARTS WITH the query; the count reports rows whose name CONTAINS the query.** For a catalog with datasources named `['snowflake-prod', 'my-snowflake-dev', 'redshift-prod']`, the query `nameQuery='snow'` returns ONLY `snowflake-prod` on the page (size=1) but the count reports `2` (both contain 'snow'). Pagination math is broken when `nameQuery` is non-null: `hasNext=false` because the page is the only one — but the page only shows 1 of 2 reported matches. The operator's "1 of 2" UI display contradicts the actual page content. Filed as **REFACTOR-425** at the sidecar layer. The fix requires aligning either the page predicate to `containsIgnoreCase` (broadens results) OR the count predicate to `startsWithIgnoreCase` (narrows results) — both are valid; the maintainer must pick. No test exists for ANY listDto + nameQuery combination at the repository layer.
