- id: H-014
  hypothesis: |
    When an operator configures LDAP authentication and sets the admin-groups list,
    only members of the exact LDAP groups named receive Administrator privileges.
  derivation: |
    Endpoint/config-shape — `auth.ldap.groups.admin-groups` is the knob that maps
    LDAP membership to ADMIN; an operator naming a group expects exact-match
    semantics (the universal expectation for an allowlist of privileged groups).
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      ODDLDAPProperties.adminGroups is a Set<String> consumed at
      LDAPSecurityConfiguration.java:96 via
      OperationUtils.containsIgnoreCase(adminGroups, a.getAuthority()) — a SUBSTRING
      + case-insensitive match, NOT exact-match. A short token collides with any LDAP
      group whose NAME CONTAINS it: configuring `admin-groups: ['ops']` promotes
      everyone in `devops`, `noops`, `appops`, `helpdesk-admin`, etc. The Properties
      class does not restrict entries, does not document the substring semantics in
      the field name, and the @PostConstruct validate() does not warn (F-006 chain
      batch ZK finding (1)). Already tracked: PLT-081 (the containsIgnoreCase ->
      equalsIgnoreCase exact-match code fix, LDAP + GitHub joint) + DOC-237/DOC-238
      (the operator caveat).
    evidence:
      - sidecar: '(F-006 feature-flow detail — batch ZK notes finding (1))'
        section: drift_class ldap_admin_groups_substring_match_short_token_admin_escalation_collision
        cite: "ODDLDAPProperties.java:31 + LDAPSecurityConfiguration.java:96"
        note: "containsIgnoreCase = substring + case-insensitive match, not exact — short tokens collide."
      - sidecar: '(issues/odd-platform/PLT-081.md + backlog/docs/DOC-238.md)'
        section: "admin-groups SUBSTRING overpromotion"
        cite: "LDAPSecurityConfiguration.java:96 + GithubUserHandler.java:119"
        note: "Code fix PLT-081 (substring->exact, two-provider); operator caveat DOC-237/DOC-238."
    operator_visible_failure: |
      (a) Admin-escalation via operator typo/shorthand: an operator naming a concise
          admin group (`ops`, `admin`) inadvertently grants Administrator to every
          LDAP user in any group containing that substring — a silent
          over-provisioning of the platform's most privileged role.
      (b) The escalation inherits the H-001 audit-silence: no log line on first admin
          login, no LDAP-group attribution in the (non-existent) audit trail — so the
          over-grant is both silent at config time and unaudited at use time.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar         # the admin-groups matching "grammar" (exact vs substring)
    coverage: unverified
    test_demand: functional        # unit: containsIgnoreCase->equalsIgnoreCase pin (the PLT-081 regression guard) — admin-groups:['ops'] must NOT promote 'devops'
    contradicted_note: |
      Routes to caveat-candidate primarily (the substring-match may be a deliberate
      "match any group containing this token" design for nested-group convenience) —
      the deliverable is a documentation warning on the substring semantics + a
      field-name/validation hardening proposal (PLT-081). Cross-ref F-011 (the
      OAuth/LDAP principal-resolution chain) for the sibling group-mapping behaviour.

- id: H-015
  hypothesis: |
    When the platform runs under an enforcing auth mode (LOGIN_FORM / OAUTH2 / LDAP),
    a freshly-authenticated non-admin user who lacks a required permission is DENIED
    a SECURITY_RULES-gated admin mutation — RBAC actually enforces, with no implicit
    ADMIN bypass.
  derivation: |
    Pillar-mission — P-09's whole premise is that "Authorization gates every
    mutation" (system-mission.md:447-450). The positive promise (the gate works when
    on) is the load-bearing happy path of the RBAC feature and must be a falsifiable
    hypothesis in its own right, not just the negative-space inverse of H-008.
  seed_source: pillar-mission + cross-pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      Under LDAP (the only enforcing mode that stands up locally), a non-admin USER
      (alice; the stack configures NO admin-groups, so she maps to USER) attempting a
      SECURITY_RULES-gated mutation (DELETE /api/owners/{id}, requiring OWNER_DELETE)
      receives HTTP 403 — the AuthorizationCustomizer applied the rule and denied it.
      The 403-vs-404 distinction is the enforcement signal: 404 would mean authz was
      BYPASSED (request reached the controller, owner simply absent). There is NO
      ADMIN bypass — ReactiveNonContextPermissionAuthorizationManager resolves
      permissions from policies, so a USER with no policies is denied every gated
      mutation. IT-010 (ldap-rbac-enforcement.spec.ts) pins this GREEN.
    evidence:
      - sidecar: '(test) integration-tests/e2e/specs/ldap-rbac-enforcement.spec.ts'
        section: "IT-010 — non-admin LDAP USER denied OWNER_DELETE (403)"
        cite: "SecurityConstants.java:143-147 (OWNER_DELETE rule) + ReactiveNonContextPermissionAuthorizationManager.java (no ADMIN bypass) + LDAPSecurityConfiguration.java:145"
        note: "VERIFIED GREEN: authenticated USER's DELETE /api/owners/{id} returns 403 (enforced); 404 would mean bypassed."
      - sidecar: '(F-006 feature-flow detail — chain hop 4)'
        section: ManagementPermissionExtractor / AbstractContextualPermissionExtractor
        cite: "ManagementPermissionExtractor.java:33 + AbstractContextualPermissionExtractor.java:27"
        note: "The permission-resolution path IT-010 exercises end-to-end (the F-006 hot path)."
    confidence: HIGH
    routes_to_finding: none
    use_case_kind: happy-path      # the RBAC gate works when an enforcing mode is on
    coverage: verified             # IT-010 pins it GREEN
    test_ref: "integration-tests/e2e/specs/ldap-rbac-enforcement.spec.ts (IT-010, enforces ADR-0002 + ADR-0003)"
    test_demand: none              # confirmed AND a real test exists -> verified, no demand (the one legitimate route-to-none)
    confirmed_note: |
      This is the ONE hypothesis that routes to `none` legitimately under Rule 11:
      confirmed AND a real test (IT-010) already guards the promise. Every other
      confirmed/partial promise here is confirmed-but-untested and therefore routes
      to a functional_test_demand. H-015 added this refresh because IT-010 landing
      created a verified happy-path promise the prior reflection had no slot for.

