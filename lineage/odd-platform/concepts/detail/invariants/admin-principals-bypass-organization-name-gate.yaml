name: admin-principals bypass organization-name gate
canonical_in_docs: false
canonical_candidate: true
description: |-
  In the GitHub OAuth handler (`GithubUserHandler.java:54-67`), the
  `admin-principals` matching path fires BEFORE the `organization-name`
  membership check at line 68: if `adminPrincipals` is non-empty AND the
  user's `admin-attribute` (default `login`) claim case-insensitively
  full-string-equals any entry, the handler returns ADMIN via early
  `return Mono.just(...)` WITHOUT calling `/user/orgs` to verify
  organizationName membership. An operator who sets
  `auth.oauth2.client.github.organization-name: my-cool-org` AND
  `auth.oauth2.client.github.admin-principals: [external-consultant]`
  grants `external-consultant` ADMIN even if `external-consultant` is
  NOT a member of `my-cool-org`. This is BY DESIGN — the explicit
  allowlist is more specific than the org gate, allowing operators to
  grant ADMIN to consultants or external admins outside the
  organization. The same `admin-principals` semantic is present in
  `GoogleUserHandler.java:56-65` (admin-attribute default `email`,
  containsIgnoreCase against adminPrincipals list — also full-string
  equality per `OperationUtils.containsIgnoreCase`). The live OAuth2/OIDC
  docs (WebFetched 2026-05-19 status 200) describe `admin-principals` as
  "Direct list of users granted ADMIN role" WITHOUT flagging the org-bypass
  semantic. Operator threat-model risk: an operator who configures
  `organization-name` expecting it to be a GLOBAL gate (every user must
  be in the org) does not realise that `admin-principals` overrides this
  gate. Misconfiguration or stale config can elevate an out-of-org user
  to ADMIN without organizational visibility.
axes_present:
  - controllers
nodes:
