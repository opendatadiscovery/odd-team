behaviour: |-
  getDataEntityTerms / getDatasetFieldTerms returns every Term linked to a data-entity / dataset-field, including is_description_link flag; soft-deleted Terms are excluded; for a (data-entity, dataset-field) with 0 linked terms, returns Flux.empty(). These reads are consumed by the data-entity detail page AND by both activity handlers (TermAssignmentActivityHandler + DatasetFieldTermAssignmentActivityHandler) — the REFACTOR-228 triple-re-query pattern (3 full-list re-queries per single link/unlink operation). A regression that returned soft-deleted terms would either confuse the activity-feed BEFORE+AFTER reconciliation OR display stale terms on entity detail pages.
