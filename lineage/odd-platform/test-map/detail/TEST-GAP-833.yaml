behaviour: |-
  **HIGH — `calculateTotalDeltaCount` (IngestionServiceImpl.java:276-301) NPE on null `entityClassIds` field. The new-pojo path at line 281-286 lacks a null guard before passing the field to `calculateDeltaValues` (line 307) which calls `Arrays.stream(entityClassIds)`.**

  Per the sidecar's `tests_coverage_semantic.uncovered_behaviours.[2]`:
  > "`calculateTotalDeltaCount` edge cases: (a) entity with null `entityClassIds` reaching `classesAndTypeFilled` check (line 313-315) — confirmed filter returns false, skips decrement, but new-pojo path at line 281-286 has no null guard before `pojo.getEntityClassIds()` is passed to `calculateDeltaValues`; a new pojo with null entityClassIds would NPE at `Arrays.stream(entityClassIds)` (line 307). No test for null-entityClassIds path."

  **Failure chain**:
  1. Collector emits a `DataEntity` whose `entity_class_ids` is null (possible via the OpenAPI ingestion contract — the field is `nullable: true` per components.yaml).
  2. Service-tier converts to `DataEntityPojo` with null `entityClassIds`.
  3. `bulkCreate(pojosToCreate)` returns the new pojo with null `entityClassIds`.
  4. `calculateTotalDeltaCount` iterates new pojos at line 281-286 and calls `calculateDeltaValues(pojo.getEntityClassIds(), ...)`.
  5. `calculateDeltaValues` (line 307) calls `Arrays.stream(entityClassIds)` on the null array.
  6. NPE escapes the `@ReactiveTransactional` boundary; Postgres rolls back the entire batch (per TEST-GAP-831).
  7. Operator sees HTTP 500 with NPE stack trace.

  **Why HIGH**: same severity class as TEST-GAP-832 (duplicate-ODDRN crash) — deterministic untested crash that propagates as opaque 500.

  **Test gap shape**: regression-pin test that
  1. Constructs a payload with one entity having null `entity_class_ids`.
  2. POSTs.
  3. Asserts HTTP 5xx + NPE stack frame contains `calculateDeltaValues`.

  PINS the current crash behaviour; pairs with REFACTOR-NNN (null guard at line 281-286 OR explicit 400 if null is forbidden).
