- regenerateCollectorToken.md:concepts.operations
- regenerateCollectorToken.md:concepts.invariants.[0-3]
- |-
  **NEW batch Q — CollectorsList.md**: concepts.entities.[Collector] +
  concepts.operations + bugs_limitations_corner_cases.[1] HIGH UI-vs-API
