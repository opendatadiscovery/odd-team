name: AppInfoMenu (info-icon popup widget — 5-surface composite)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW ENTITY, batch ZJ — the 127-line React widget rendered inside
  AppToolbar at AppToolbar.tsx:67 that displays the 'information
  icon' popup combining FIVE surfaces in one MUI Menu:

    (1) Hardcoded Documentation link to docs.opendatadiscovery.org
    (2) Hardcoded Slack community invite (go.opendatadiscovery.org/slack)
    (3) The deployment's `projectVersion` with a GitHub repo link
        sourced from `GET /api/appInfo` via the `useAppInfo()` hook
    (4) Hardcoded 'Leave a feedback' Product Hunt review link
    (5) Operator-configured 'additional links' from `GET /api/links`
        via the `useAppLinks()` hook (per the
        additional-link-operator-configured entity)

  **The widget is the UI's terminal page-render site for two
  backend surfaces** — `AppInfoController` (F-009 deployment
  introspection) and `LinksController` (F-035 operator-configured
  additional links).

  **The menu opens on `onMouseEnter` of the icon button only**
  (line 81) — pure-hover activation, no `onClick`, no `onKeyDown`,
  no `onFocus`. The ARIA attributes (`aria-haspopup='true'`,
  `aria-controls={menuId}`) claim keyboard support that does not
  exist — WCAG 2.1 SC 2.1.1 (Keyboard) violation. Touch-device
  users cannot open the menu at all (no mouseenter event on iOS
  Safari / Android Chrome).

  **The menu uses MUI's `keepMounted`** (line 90) — the DOM tree
  stays mounted forever after the first hover. Combined with
  TanStack Query's default `staleTime=0` and the widget's lack
  of re-fetch triggers, an operator who edits `odd.links` in
  YAML and restarts the backend WILL STILL SEE the OLD list in
  any SPA tab opened before the restart, until the user does a
  full page reload. The keepMounted shape makes the LinksController's
  @ConfigurationProperties boot-time-only immutability harder to
  spot operator-side.

  **The widget renders ALL FIVE link sites with `<Link target='_blank'>`
  WITHOUT `rel='noopener noreferrer'`** — see the
  `additional-links-no-rel-noopener-and-no-url-validation` invariant.
  This is broader than the batch-ZE F-035 facet's operator-configured-
  only scope; the four hardcoded targets are first-party-trusted
  today but inherit the same `window.opener` leak as a defence-
  in-depth gap.

  **Under `auth.type=DISABLED` the widget renders the projectVersion
  and the operator-configured links INLINE to anonymous viewers** —
  the UI MULTIPLIES the disclosure surface that AppInfoController +
  LinksController already provide at the API layer. The version is
  no longer just visible via curl /api/appInfo; it is visible to
  any browser user hovering the information icon.

  **The widget has NO loading or error UI for its two queries** —
  if `/api/appInfo` returns 401 or 5xx, `appInfo` is `undefined`
  and the projectVersion row silently suppresses; if `/api/links`
  errors the same. The user sees a menu with no version + no
  additional links and no indication WHY.

  **`link.url` is used as React key** (line 61) — duplicate
  operator-configured URLs trigger a React duplicate-key warning
  and may de-duplicate the render in some reconciliation paths.

  **The four hardcoded link labels are NOT translatable** —
  'Documentation', 'Slack', 'ODD Platform version', 'Leave a
  feedback' hardcode English and bypass the `useTranslation()`
  infrastructure already present in AppToolbar.tsx:19. Operator-
  configured `link.title` values DO render verbatim, allowing
  operators to localise their own additions.
