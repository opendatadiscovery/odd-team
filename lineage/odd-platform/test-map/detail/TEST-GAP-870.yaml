proposed_action: |-
  Add `ActivityEmptyPartitionsRaceWindowTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/housekeeping/job/` using Testcontainers + `@SpringBootTest` + a controlled concurrency harness. The HEADLINE test method:

  1. **`concurrentActivityInsertDuringEmptyPartitionDrop_pinsSilentDataLossWindow`** (HEADLINE):
     - Arrange: seed an empty past partition (e.g. `activity_20240101_20240301`); the partition's row count = 0; the partition's end date is BEFORE today. Configure a barrier between `isPartitionEmpty` returning and `dropPartition` firing (via reflection / spied PartitionService).
     - Act:
       - Thread A (the housekeeping flow): call `partitionService.getEmptyPastPartitions(conn, "activity", emptyList())` → after `isPartitionEmpty` returns TRUE, BLOCK at the barrier (do not yet call dropPartition).
       - Thread B (the app write): call `activityServiceImpl.createActivityEvent(ActivityCreateEvent.builder().dataEntityId(seedId).eventType(DESCRIPTION_UPDATED).oldState("...").newState("...").systemEvent(false).build())` with `created_at` set so it routes to the partition Thread A is targeting. INSERT commits at autocommit boundary.
       - Thread A (resume): cross the barrier; call `partitionService.dropPartition(conn, partitionName)`.
     - Assert: query the `activity` table directly via JDBC `SELECT count(*) FROM activity WHERE id = <Thread B's row id>`; **PIN that ZERO rows match** (the Thread-B INSERT was destroyed silently by the DROP).
     - Assert: Thread B's `createActivityEvent` returned SUCCESS (no exception surfaced); the writing user has no indication their audit row was lost.

  2. **`emptyPartitionDropWithNoConcurrentInsert_succeedsDeterministically`** (CONTROL):
     - Arrange: same empty past partition; NO concurrent insert.
     - Act: run the housekeeping cycle.
     - Assert: the partition is dropped; the `activity` table has no rows in that date range (consistent with the pre-state); no rows lost (because none existed).

  3. **`emptyPartitionDropWithRowInsertedBeforeCheck_correctlyDoesNotDrop`** (CONTROL — opposite race direction):
     - Arrange: partition that becomes NON-empty BEFORE the housekeeping cycle's empty-check.
     - Act: run the cycle.
     - Assert: the partition is NOT dropped (the check correctly returned FALSE); no data loss. Pins that the centre of the contract works correctly.

  After P-012 measures the empirical race window timing on real R2DBC + Postgres, refine the test's timing assumptions. Cross-pair with REFACTOR-NNN to introduce a transaction-wrapped or LOCK-TABLE-based fix; this test then becomes the regression-pin proving the fix eliminated the window.
