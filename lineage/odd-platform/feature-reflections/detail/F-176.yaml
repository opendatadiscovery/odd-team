- id: H-011
  hypothesis: |-
    When a user opens the Overview tab on a small (phone-width) viewport, the
    two-column layout collapses to a single readable column rather than crushing
    the sidebar.
  derivation: |-
    Overview.tsx:54,93 declares `<Grid item xs={9}>` + `<Grid item xs={3}>` with
    no md/sm overrides. The senior-PO "behaves across device types" question
    (Rule 9) seeds this directly. The feature-flow
    `two_column_grid...no_explicit_responsive_collapse` facet (ui_unverified)
    challenges it.
  seed_source: ui-label
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The grid items carry only `xs` breakpoints (xs={9} main / xs={3} sidebar)
      and no `md`/`sm` overrides (Overview.tsx:54,93). In MUI, `xs` is the
      smallest breakpoint and applies at ALL widths unless a larger breakpoint
      overrides — so the 9/3 split is held even at phone widths, meaning the
      sidebar is squeezed to 25% of a narrow screen rather than stacking below
      the main column. WHETHER the resulting layout is actually usable (text
      legible, panels not clipped) at a 360px viewport is a runtime/visual
      observation the static source cannot settle; the feature-flow flags it
      ui_unverified: true. The platform's other large surfaces (Search, Catalog
      Overview) do declare responsive layouts, so this surface's desktop-first
      assumption is an inconsistency worth a live check.
    evidence:
      - sidecar: "(feature-flow F-176 chain hop-1)"
        section: Overview.tsx grid breakpoints
        cite: "Overview.tsx:54,93"
        note: "xs={9}/xs={3}, no md/sm overrides"
    operator_visible_failure: |-
      (anticipated, pending probe) On a phone the sidebar (owners / DQ / tags /
      terms / groups) is compressed to a quarter-width column, likely with heavy
      text wrap or clipping, instead of stacking below the main content — making
      the single most-used read surface awkward on mobile. Confirming the actual
      mobile rendering needs a headless-browser run at narrow viewport.
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-176-2
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-176-2"

- id: H-012
  hypothesis: |-
    When a user opens the Overview tab, they can understand from what is on
    screen which panels exist and how to act on them — the surface is
    self-explanatory and consistent with how the same tasks are done elsewhere
    in the platform.
  derivation: |-
    Senior-PO mandatory UX seed (Rule 9): "does the user understand how to use
    this from what is on screen; is it consistent across the platform". Seeded
    against the composed 12-panel surface.
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |-
      The composition uses a consistent chrome — every panel is wrapped in the
      same <SectionContainer> and edit affordances follow the platform's
      WithPermissionsProvider pattern (Overview.tsx:55-147), which IS the same
      mechanism used on other detail surfaces (e.g. Term Overview, per F-156). So
      structurally the surface is consistent with the platform. The PARTIAL: the
      page offers no on-screen explanation for its CONDITIONAL behaviour — a
      missing stats panel (H-004), an empty DQ sidebar (H-006), or a hidden edit
      button (H-007) all present as plain absence, so a user cannot understand
      from the screen alone WHY a section they expected is not there. The
      canonical doc carries all the explanations (entity-detail-page.md) but the
      surface does not link to or surface them. So "consistent chrome" holds;
      "self-explanatory" does not for the conditional cases.
    evidence:
