notes: |-
  **STRENGTHENED batch 2026-05-19M to 19-sidecar** with the anchor-set-defence
  audit family. Batch M adds 4 new surfaces (getMyObjectsWithUpstream,
  getMyObjectsWithDownstream, getDataEntityGroupsLineage, facets) confirming
  the read-collaborative posture is uniform even at endpoints DESIGNED to be
  owner-anchored — surfacing a refinement:

  **Three posture sub-classes** now visible in the catalog:
    (1) **UNAPPLIED at every layer** — getActivity, getAllAlerts,
        getDataEntityDownstreamLineage, getDataEntityDetails,
        getDataEntityAlerts; the canonical REFACTOR-024 / 203 family;
    (2) **POSITIVE-CASE-WITH-SINGLE-POINT-OF-FAILURE** —
        getMyObjectsWithUpstream / Downstream; the anchor-set IS applied at
        the service tier, but the downstream listByOddrns has no JOIN-side
        defence-in-depth (REFACTOR-225 — latent vulnerability);
    (3) **APPLIED-AS-ADDITIVE-SCOPE** — facets aggregator suite; the
        anchor-set is invoked (fetchAssociatedOwner for myObjectsCount) but
        consumed alongside the catalog-wide total, NOT as a boundary
        predicate;
    (4) **WIDEST-BLAST DEG-ANCHORED** — getDataEntityGroupsLineage; the
        DEG itself is the anchor; visibility of the DEG implies visibility
        of its full member-graph + reachable edges + per-member metadata;
        graph-shaped co-membership leakage on multi-team Domains.

  STRENGTHENED batch 2026-05-19L to 15-sidecar with the per-entity
  alert-read surface — operator-recommended audit-export workaround at
  /features/active-platform-features/alerting.

  STRENGTHENED batch 2026-05-19J to 14-sidecar with three UI-layer
  realisation-point confirmations: DataEntityDetails component,
  fetchDataEntityDetails redux-thunk, and LineageGraph component family.

  The catalog now has end-to-end (UI → API → service → SQL) UNIFORM
  confirmation across NINETEEN surfaces that the read-collaborative posture
  is the platform INTENTIONAL design choice AND that no UI affordance
  compensates for the absence of owner-scoping in the backend.

  **Twelve DOC-NNN candidates flow from this invariant** (four more than
  batch L — new doc gaps emerged in batch M):
    (a) /features/alerts page: 'Who can see this' section.
    (b) /features/active-platform-features/activity-feed page: same.
    (c) /features/data-discovery/search page: 'Facet count scoping' AND
        'Who can search' sections — currently silent on both per batch M.
    (d) /features/data-lineage page: 'Read-side posture' section. **Batch M
        adds DEG-lineage carve-out doc gap** — the live page documents the
        Group lineage entry point but is SILENT on cross-owner posture AND
        on inner-DEG suppression.
    (e) /features/data-discovery (or /features/data-discovery/catalog-overview):
        CENTERPIECE READ posture documentation.
    (f) /configuration-and-deployment/enable-security/authorization:
        'Persistence layer posture' + 'Read-side posture' subsections —
        list the 19 surfaces explicitly.
    (g) /configuration-and-deployment/enable-security/authorization: 'Frontend
        posture' subsection.
    (h) /features/active-platform-features/alerting: tighten or disclose
        the audit-export workaround.
    (i) **NEW from batch M** — /developer-guides/api-reference: ADD a
        Data Entity sub-page (currently 404 at
        /developer-guides/api-reference/data-entity) documenting the /my*
        triplet endpoints with CORRECT semantics; the OpenAPI summary is
        the INVERSE of the actual response (DOC-GAP-099).
    (j) **NEW from batch M** — /developer-guides/api-reference/lineage: ADD
        a 'DEG-lineage posture' section disclosing (1) inner-DEG suppression
        as a deferred-feature carve-out; (2) cross-owner-readable posture
        with WRITE / READ asymmetry; (3) 404 conflation of DEG-not-found vs
        DEG-empty vs non-DEG-typed-ID; (4) the bidirectional edge filter
        that silently drops cross-boundary edges.
    (k) **NEW from batch M** — /features/data-discovery/search: ADD a
        'Facet count scoping' section explicitly stating facet counts are
        catalog-wide; ADD a 'Session lifecycle' section disclosing the
        bearer-token-shaped session UUIDs.
    (l) **NEW from batch M** — /configuration-and-deployment/enable-security:
        the three posture sub-classes (UNAPPLIED / SINGLE-POINT-OF-FAILURE /
        ADDITIVE-SCOPE / DEG-ANCHORED-WIDEST-BLAST) operationalized for
        operators — operators in multi-tenant deployments need to
        understand which endpoints have which posture.

  Cross-references:
    - REFACTOR-225 anchor-set single-point-of-failure (batch M PRIMARY
      SOURCE) — the secondary fragility of the POSITIVE case.
    - DOC-GAP-099 OpenAPI summary inverse-semantic (batch M 4-angle
      triangulated) — the contract finding flowing from the POSITIVE case.
    - DEG-membership read vs write authorization asymmetry (batch M) — the
      DEG-anchored variant of this invariant.
    - Cross-owner facet-count enumeration via drill-down (batch M) — the
      facet-counts variant of this invariant.
    - tsquery operator-injection via persisted state (batch M) — adjacent
      DoS finding compounding at the same facet-aggregator surfaces.
