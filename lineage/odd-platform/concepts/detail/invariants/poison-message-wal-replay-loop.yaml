name: Poison-message WAL replay loop (notifications)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
description: |-
  **NEW INVARIANT, batch 2026-05-19K** — the load-bearing fragility of the
  notifications WAL consumer. The dispatcher
  (`AlertNotificationMessageProcessor.process()` at
  `notification/processor/AlertNotificationMessageProcessor.java:23-36`) invokes
  `messageTranslator.translate(message)` BEFORE the per-sender fan-out, and the
  translate call is UNCAUGHT — only sender-layer `NotificationSenderException`
  is caught at lines 29-35. The translator
  (`AlertNotificationMessageTranslator`) throws
  `IllegalArgumentException` on unknown alert-type code (line 87) and
  `IllegalStateException` on missing/duplicate alerted-entity rows (lines
  94-101). Both bypass the dispatcher's try/catch and reach
  `NotificationSubscriber.java:90`'s outer catch which: (a) logs the error,
  (b) releases the advisory lock, (c) waits 10 seconds, (d) re-acquires the
  lock, (e) the SAME WAL LSN is re-delivered. The dispatcher's `process()`
  re-invokes; the translator throws again; loop repeats. The setAppliedLSN /
  setFlushedLSN are NOT advanced — the WAL position stays pinned at the bad
  row. Net effect: a persistently-bad ALERT row (unknown type_id, FK to
  deleted data_entity, NULL message column) blocks ALL subsequent WAL
  messages from being processed indefinitely. The only operator remediations
  are: (a) clean up the bad row in the database; OR (b) drop the
  replication slot (which also drops all in-flight undelivered alerts).
  **There is NO dead-letter queue, NO skip-poison mechanism, NO manual
  setAppliedLSN advance API.** Distinct from the "sequential fan-out blocks
  channels" finding (a slow Slack call still completes within seconds —
  this is unbounded back-off). Distinct from the rate-limiting gap (10k
  alerts is still 10k delivered, eventually — this is zero delivered until
  remediated). This is the load-bearing fragility of the entire P-07
  Notifications pillar. Cross-batch implication: any future feature that
  consumes WAL via PostgresWALMessageProcessor inherits this fragility
  unless it adopts a poison-skip strategy at the processor level.
