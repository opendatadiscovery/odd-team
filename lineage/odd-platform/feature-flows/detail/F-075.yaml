pillar_anchored_feature_name: User-Owner Association Request Flow (DIRECT_OWNER_SYNC self-mint-and-self-bind chain)
feature_name: |-
  User-Owner Association — `POST /api/owner_association_request` flow. The
  flow has two operationally-distinct branches: (A) standard SELF-request
  with PENDING status awaiting Admin approval (documented); (B) auto-approve
  under `DIRECT_OWNER_SYNC` MANAGEMENT permission (UNDOCUMENTED on the live
  `/user-owner-association` page). Branch B composes with the
  `OwnerService.getOrCreate` side-door (F-019's
  `service_tier_get_or_create_permission_bypass_owner_create_side_door`)
  into a SELF-MINT-THEN-SELF-BIND chain: a user with DIRECT_OWNER_SYNC can
  submit a never-seen `ownerName`, the service mints the Owner, the
  permission auto-approves the request, and the user is bound to an Owner
  they just created.
