- id: H-004
  hypothesis: "When a user navigates to a compare URL whose firstVersionId/secondVersionId belong to a DIFFERENT dataset than the one in the path (e.g. a stale or hand-edited URL pasted from chat), the viewer detects the mismatch and refuses to render a cross-dataset diff — it does not silently present a confident, legitimate-looking comparison of data the user is not looking at."
  derivation: "Negative-space + Rule 9 — the URL query-params are user-supplied input; the viewer reads `datasetVersions` (the dataset's own revision list) and could validate against it. A trusted audit surface should not render a diff it cannot vouch for."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The viewer performs NO client-side validation of the URL version-ids. DatasetStructureCompare
      reads firstVersionId/secondVersionId from useQueryParams (DatasetStructureCompare.tsx:24-26,
      source-read) and passes them straight into useDatasetStructureCompare (lines 30-35) which
      fires GET .../structure/diff. The component DOES load datasetVersions
      (DatasetStructureCompare.tsx:28, source-read) but only forwards that array to the header for
      the picker dropdowns — it never checks that the URL-supplied ids are members of it. Paired
      with F-045's backend cross-dataset leak (the diff SQL filters DATASET_VERSION.ID.in(...) with
      no dataset predicate, ReactiveDatasetVersionRepositoryImpl.java:147-157), a pasted URL with
      another dataset's version-ids returns 200 and the list-item renders it AS IF a valid diff.
      The pickers' self-disable logic (H-002) is a NORMAL-PATH safety only; it cannot constrain
      the URL, which bypasses the pickers entirely.
    evidence:
      - sidecar: "(source read)"
        section: "DatasetStructureCompare.tsx"
        cite: "DatasetStructureCompare.tsx:24-35 + 28"
        note: "URL version-ids -> fetch hook with no membership check against the loaded datasetVersions array."
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: "stress_findings.request_inputs[firstVersionId / secondVersionId]"
        cite: "ReactiveDatasetVersionRepositoryImpl.java:147-157"
        note: "Backend half: diff SQL filters ID.in() only; dataEntityId discarded -> cross-dataset 200."
      - sidecar: "(feature-flow F-191)"
        section: "observed_vs_expected.facets[0]"
        cite: "F-191.yaml:117-131"
        note: "compare_url_query_params_not_validated_against_loaded_dataset_versions_list facet (severity MEDIUM)."
    operator_visible_failure: |
      (1) The Compare viewer is a TRUSTED audit surface — an operator reasoning about "what changed
      between V1 and V2" can be handed a forged or stale URL (chat, docs, bookmark) and shown a
      confident, legitimate-looking diff of a dataset they are not authorised to (or did not intend
      to) inspect, with NO error or warning. This is the most damaging failure of the surface
      because it does not look like a failure. (2) It is the client-side delivery vector for the
      F-045 backend cross-dataset schema-disclosure leak (column names/types/descriptions/tags/
      terms). (3) Even after the backend fix (PLT-028 Thread A) lands, the absence of client-side
      validation means a wrong-dataset id will surface as the H-005 undifferentiated error rather
      than an actionable "this revision isn't part of this dataset" message.
    severity: HIGH
    confidence: HIGH
    source_read_for_validation: true
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

