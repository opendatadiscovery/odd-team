      resolve alerts one by one — it never ticks down. They cannot trust the badge as a count of
      outstanding work, and may reload repeatedly (re-paying the 3-COUNT + lineage-CTE cost) to get a
      fresh number. A small but constant UX irritant on the operator's primary diagnostic surface.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
