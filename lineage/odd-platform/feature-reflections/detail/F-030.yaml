# Metrics Ingestion — product-owner reflection

## product_owner_narrative

Metrics Ingestion is the data path behind the per-DataEntity **Metrics tab** that appears on entity-detail pages in the ODD Platform UI. The capability is two-sided: a **write side** that collectors (the odd-collector / odd-collector-sdk push clients) use to publish OpenMetrics-shaped time series for a data entity, and a **read side** that platform users open when they want to see those series rendered as charts on the entity's Metrics tab. The write side is what F-030's chain covers: a collector `POST`s a `MetricSetList` payload — a list of `MetricSet`, each carrying an entity ODDRN plus one or more `MetricFamily` records of OpenMetrics types `COUNTER | GAUGE | HISTOGRAM | GAUGE_HISTOGRAM | SUMMARY` — to `POST /ingestion/metrics`, and the platform stores it (per `ingestMetrics` sidecar `understanding`). The problem this feature solves for an operator is "I already emit Prometheus-shaped metrics for my datasets; let me surface them inside the catalog next to the entity they describe."

A user interacts with the write side entirely machine-to-machine: there is no UI form for pushing metrics — the collector authors the `MetricSetList` and POSTs it. The single user-facing input that shapes the feature is a **deploy-time configuration choice**, `metrics.storage`, with two values: `INTERNAL_POSTGRES` (the default — `matchIfMissing=true` — which writes to the platform's own PostgreSQL `metric_series` / `metric_point` / `metric_entity` tables) and `PROMETHEUS` (which Snappy-compresses the batch into a Prometheus remote-write `WriteRequest` and POSTs it to `${metrics.prometheus-host}/api/v1/write`) (per `ingestMetrics` sidecar `dependencies_semantic.requires-config` + `CounterTimeSeriesExtractor` sidecar `understanding`). The dispatch is boot-time, not request-time: two mirrored `@ConditionalOnProperty` beans realise the `IngestionMetricsService` interface, exactly one wired per deployment (per `ingestMetrics` sidecar `concepts.invariants[1]`). The endpoint returns `201 Created` on success — on the spec-conformant side of the `openapi-200-vs-201` drift, unlike its sibling `postDataEntityList` (per `ingestMetrics` sidecar `implicit_adrs[1]`).

The working parts a product owner would demo: you push a batch of metric families, the platform fans them out across per-`MetricType` extractors (4 beans on each storage side, 8 total, keyed by `canExtract(MetricType)`), and the series become queryable on the entity's Metrics tab via `GET /api/dataentities/{id}/metrics` (per `ingestMetrics` sidecar `dependencies_semantic.coupling.read_side`). On the PROMETHEUS path, the platform also appends a `tenant_id={value}` label drawn from `odd.tenant-id`, which the docs sell as the mechanism that "lets a single shared Prometheus instance serve metric data for multiple ODD Platform deployments" (per WebFetch of `configuration-and-deployment/odd-platform` 2026-05-20). Timestamp-monotonicity is the one correctness invariant the tests pin: re-ingesting the same series with an OLDER timestamp does not overwrite the stored value; a NEWER timestamp does (per `ingestMetrics` sidecar `tests_coverage_semantic.covered_behaviours[0]`).

The integration story: Metrics Ingestion is the FIFTH P-07 Active Platform Features sub-feature alongside Alerting (F-007), Notification Delivery (F-009), Per-Entity Alert View (F-014), and Activity Feed (F-021), and it is one of THREE ingestion intake shapes sharing the `IngestionController` class and the `/ingestion/**` whitelist — alongside `POST /ingestion/entities` (F-008 Batch Ingestion) and `POST /ingestion/entities/datasets/stats` (the stats path, F-018) (per F-030 feature-flow `cross_pillar_relationships`). The three siblings have THREE distinct authentication postures, THREE distinct transactional shapes, and THREE distinct empty-payload contracts — and that asymmetry is itself the architectural finding (per F-030 feature-flow `cross_pillar_relationships[P-10]`). The storage backend choice also couples to the P-08 operator configuration surface: it is a one-way migration with no tooling.

Edge cases a product owner must highlight in a demo, because each is a place where the user's reasonable expectation and the implementation diverge: the endpoint is **unauthenticated in every supported deployment posture** — there is no toggle that closes it (per `ingestMetrics` sidecar `bugs_limitations_corner_cases[0]`); tenant isolation, which the config option promises, **does not exist at all on the default INTERNAL_POSTGRES backend** — the `tenant_id` mechanism is PROMETHEUS-only (per `ingestMetrics` sidecar `security.known_security_gaps[3]`); an empty payload **silently returns 201** as if it wrote something (per `ingestMetrics` sidecar `implicit_adrs[2]`); a metric for a **non-existent ODDRN** is accepted and mints a `metric_entity` row with no foreign key (per `ingestMetrics` sidecar `bugs_limitations_corner_cases[1]`); and switching storage backends **silently strands all prior metric history** (per `ingestMetrics` sidecar `bugs_limitations_corner_cases[9]`). These are the load-bearing reflections below.

