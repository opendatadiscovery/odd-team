  - 'management.md:security.known_security_gaps.[1] severity MEDIUM'
behaviour: |-
  **MEDIUM — `/management/integrations*` sub-route has NO permission-context wrapper at all** (ManagementRoutes.tsx:150 — `<Route path='integrations/*' element={<Integrations />} />`). Every OTHER Management sub-route at least wraps in a context provider (which doesn't block rendering anyway per TEST-GAP-994, but DOES seed the `PermissionContext` that `<WithPermissions>` descendants consume).

  **Why this is a wiring drift, not just a cosmetic asymmetry**: any `usePermissions().hasAccessTo(...)` call inside the Integrations subtree falls back to the OUTER Management.tsx context, whose `allowedPermissions = [OWNER_ASSOCIATION_MANAGE]` ONLY. This means an inner check like `hasAccessTo(Permission.DATA_SOURCE_UPDATE)` on an Integration edit form deny-by-defaults regardless of the user's GLOBAL permissions, because the `allowedPermissions.includes(...)` check at PermissionProvider.tsx:27-32 fails (`OWNER_ASSOCIATION_MANAGE != DATA_SOURCE_UPDATE`).

  **Concrete failure modes the sidecar identifies**:
  - BROKEN-CLOSED: an Integration form's `Save` button gated by `<WithPermissions permissionTo={Permission.DATA_SOURCE_UPDATE}>` silently hides for a user who SHOULD be allowed (false-deny — frustrating UX, no error message).
  - BROKEN-OPEN-ish: a future Integration component that relies on `usePermissions().hasAccessTo` for a write affordance MIGHT silently OPEN the affordance if the integration team uses the wrapper differently.

  **The wiring suggests Integrations was retro-fitted** without the per-sub-route `WithPermissionsProvider` discipline applied to the eight other sub-areas. The sidecar surfaces this as a TODO-grep-`usePermissions|hasAccessTo` across `components/Management/Integrations` to verify the live impact.

  **No test pins this** — a regression that ADDS a `<WithPermissionsProvider>` wrapping to Integrations (closing the wiring drift) ships green; a future maintainer who adds permission-dependent affordances to Integration components without realising the context is missing/wrong silently misroutes them.
test_class: missing-security
criticality_rationale: |-
  Sidecar rates this MEDIUM and held MEDIUM because: (a) the wiring drift only matters if an Integration component USES `usePermissions` (current grep is a P-162 follow-up — uncertain live impact); (b) the Integrations subtree is gated at the backend (DataSourceController + IntegrationController have @PreAuthorize per their sidecars); (c) the asymmetry is observable (`grep ManagementRoutes.tsx | wc -l` for `WithPermissionsProvider` is 7 of 9 sub-routes — odd-one-out is loud). Bumped from sidecar-rated LOW per Rule 3 cross-pillar amplification (`pillars_affected: [P-08, P-09]` — len >= 2). NOT escalated to HIGH because the consequence is bounded by the absence of `usePermissions` consumers in the Integrations subtree TODAY.
