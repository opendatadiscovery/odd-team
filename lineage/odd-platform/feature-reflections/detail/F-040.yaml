- id: H-012
  hypothesis: |-
    When an operator scrolls deep into a long run history (infinite scroll) and
    two runs completed at the same second, each run appears exactly once across
    the page boundary — none are duplicated or skipped.
  derivation: |-
    Negative-space: pagination correctness at tie boundaries — a deterministic
    ordering invariant the operator assumes for any paginated list.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The ORDER BY end_time DESC has no secondary tie-breaker
      (ReactiveDataEntityTaskRunRepositoryImpl.java:178). When two completed
      runs share end_time, inter-tie ordering is Postgres physical/heap order —
      non-deterministic across vacuum/reindex. The InfiniteScroll consumer
      (TestRunsHistory.tsx:88-113) appends successive independent SQL fetches;
      if a tie splits across the page boundary differently per fetch, a row may
      duplicate or be skipped in the rendered list. Whether this manifests for
      realistic data (rapid-fire same-second test batches) requires running the
      system — a local probe with N tied end_times paginated at the boundary.
    evidence:
      - sidecar: DataEntityRunController
        section: "bugs_limitations_corner_cases[3] + stress_findings.orderings"
        cite: "ReactiveDataEntityTaskRunRepositoryImpl.java:176-182; TestRunsHistory.tsx:88-113"
        note: "single-field ORDER BY, no tie-breaker; infinite-scroll accumulates independent fetches"
    operator_visible_failure: |-
