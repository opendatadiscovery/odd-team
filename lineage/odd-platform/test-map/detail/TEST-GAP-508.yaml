proposed_action: |-
  Testcontainers integration test. (a) Create DEG A, DEG B. (b) Use the data layer DIRECTLY to insert circular relationships: insert GROUP_ENTITY_RELATIONS rows (group_oddrn=A_oddrn, data_entity_oddrn=B_oddrn) and (group_oddrn=B_oddrn, data_entity_oddrn=A_oddrn). (c) GET /api/dataentitygroups/A.id/lineage with a Reactor timeout of 5 seconds. (d) Assert either: (i) the request completes within 5 seconds (Postgres's planner caps the recursion via work_mem exhaustion), OR (ii) the test times out — pinning the unbounded-recursion vulnerability. (e) Test comment 'LOCKS the unbounded-recursion-on-circular-DEG vector as of 2026-05-19. When a CYCLE clause is added to the recursive CTE OR cycle prevention is added at the write path, this test FLIPS to expect bounded completion time AND assert no rows beyond the cycle expansion limit.' This is both a regression-pin AND a vector-proof — operators reading the test understand the DoS surface.
