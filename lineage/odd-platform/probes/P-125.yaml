expected_outcome: |
  Stress question (Category F + Category B, batch-ZD PermissionController
  controller-class interrogation): The OpenAPI spec at components.yaml:3381-3387
  declares `PermissionResourceType` with four enum values: DATA_ENTITY, TERM,
  QUERY_EXAMPLE, MANAGEMENT. The endpoint
  `GET /api/resource/{permission_resource_type}/{resource_id}/permissions`
  accepts the parameter as a typed enum. A strictly-spec-compliant client
  built from the OpenAPI definition would believe all four values are valid.

  Static trace shows the service-tier discriminator at PermissionServiceImpl.java:25-27
  throws BadUserRequestException("Resource type MANAGEMENT does not have context")
  whenever resourceType resolves to MANAGEMENT (because PolicyTypeDto.MANAGEMENT
  has hasContext=false at PolicyTypeDto.java:12). ControllerAdvice.java:24-28
  maps BadUserRequestException to HTTP 400 with code USR001.

  Hypothesis (carried from static trace): calling
  `GET /api/resource/MANAGEMENT/{anyId}/permissions` produces HTTP 400 with
  body `{message: "Resource type MANAGEMENT does not have context", code: "USR001"}`.
  The probe pins the empirical confirmation of this surface.

  PASS = the response is exactly HTTP 400 USR001 with the documented message —
  confirms the static trace + locks in the discriminator invariant. FAIL =
  the response differs (e.g. 500 SYS001 from catch-all handler, or 404, or
  200 with empty list) — surfaces a regression in either the discriminator
  or the ControllerAdvice mapping.

  Secondary capture (compound stress): the probe ALSO asserts the contextual
  paths (DATA_ENTITY / TERM / QUERY_EXAMPLE) produce 200 with the expected
  permission shape for a known seeded resource — pinning the happy-path
  behaviour across all four enum values in one probe run.
