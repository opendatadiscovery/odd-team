mitigations_unimplemented:
- |-
  Code-side: add `@SchedulerLock(name = "sessionHousekeepingJob",
  lockAtLeastFor = "10m", lockAtMostFor = "1h")` to
  PostgreSQLSessionHousekeepingJobHandler.java:13. Aligns with the
  ActivityTablePartitionManager pattern. ShedLock is already on the classpath
  per the partition pattern.
- |-
  Code-side alternative: add a `spring.session.housekeeping.advisory-lock-id`
  config key (default e.g. 130 — fifth slot in the platform's advisory-lock
  registry alongside 90/100/110/120) AND wrap the DELETE in a
  PostgresLeaderElectionManager block. Pattern parity with NotificationSubscriberStarter +
  DataCollaboration's two background threads.
- |-
  Cross-cutting hardening: add a startup-time `AdvisoryLockIdRegistryValidator`
  `@PostConstruct` that asserts all advisory-lock-ids are distinct AND warns
  if any scheduled job lacks leader-election. This is also the recommended
  remediation for the advisory-lock-id-collision-risk-across-subsystems
  cross-cutting invariant.
- |-
  Doc-side: extend /configuration-and-deployment/odd-platform to publish the
  advisory-lock-id registry — list all four (and proposed fifth) IDs by
  convention, the operator-tunable knobs, and the cross-subsystem distinctness
  requirement.
notes: |-
  NEW MEDIUM-SEVERITY INVARIANT captured in batch 2026-05-20X surfaced by the
  SessionConfiguration sidecar's cross-cutting examination of the @Scheduled
  job ecology. The asymmetry — 4 of 5 scheduled jobs use leader-election, the
  session housekeeping does not — is the kind of operational-inconsistency
  finding that surfaces only when the maintainer holds the cross-subsystem
  picture in mind. Single-file analysis would not catch it.

  Cross-cutting connections:
    - spring-session-timeout-minus-one-housekeeping-noop (batch X) — sibling
      finding on the same housekeeping job; this invariant's impact is
      mitigated by the no-op compound at shipped defaults
    - advisory-lock-id-collision-risk-across-subsystems — would be PROMOTED
      to 4-subsystem (currently 3-subsystem) when the session-housekeeping
      lock is added per the recommended remediation
    - The platform's @Scheduled-job-uses-leader-election convention is itself
      an implicit ADR worth surfacing — the consistency across 4 jobs
      encodes intent

  One DOC-NNN candidate:
    Cross-link the advisory-lock-id registry as an operator-facing reference
    on the configuration page. The four existing IDs (90/100/110/120) are
    convention-only without a single docs surface naming them.
