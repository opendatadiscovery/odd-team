  - 'DisabledAuthSecurityConfiguration.java:13-18 + StaticArgumentMappingContext.java:16 (platform_url substitution) + SecurityConstants.java:98+ (no /api/integrations entries) + grep INTEGRATION in PolicyPermissionDto.java returns zero matches'
