- id: H-005
  hypothesis: "When a user clicks a tag in the home-page Top Tags strip, the strip shows the catalog's MOST-USED tags (so the most popular tag is present and prominent)."
  derivation: "The widget is labelled 'Top Tags' and is fetched via useGetPopularTags({page:1, size:30}) (Overview.tsx:20-23); 'Top'/'Popular' promises a popularity ranking."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The TopTagsList re-sorts client-side by usedCount, but it can only render tags the backend returned, and the
      backend `ReactiveTagRepositoryImpl.listMostPopular` paginates by `TAG.ID ASC` BEFORE aggregating usage
      (the LSN-019 / PLT-026 defect): page 1 (size 30) is the 30 OLDEST tags by id, re-ranked by usage only WITHIN
      that window. The youngest tags can never reach page 1 even when they are the most-used. The 'Top Tags' label
      and the `getPopularTagList` op both promise popularity ordering the implementation cannot honour past page 1.
      This is verified RED by the IT-005 e2e (top-tags-ordering.spec.ts), which seeds the 5 most-used tags as the
      5 youngest and asserts they appear on the home-page strip.
    evidence:
      - sidecar: F-018 (cross-feature, via IT-005)
        section: "integration-tests/e2e/specs/top-tags-ordering.spec.ts"
        cite: "ReactiveTagRepositoryImpl.java:147-148"
        note: "paginate-before-aggregate; most-popular-young tags dropped off page 1 — IT-005 RED today"
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: downstream_side_effects
        cite: "Overview.tsx:20-23 (useGetPopularTags page:1 size:30)"
        note: "home page is the surface that renders the mis-ordered strip"
    operator_visible_failure: |
      A newly-created, heavily-used tag never appears in the home page's 'Top Tags' even though it is genuinely the
      most-used — the strip silently shows older, less-used tags labelled as the platform's top tags. An operator
      relying on Top Tags to find the catalog's active vocabulary is misled. This is the same defect class as
      listMostPopular (LSN-019); the home page is its most visible surface. Already tracked as PLT-026 / pinned by
      IT-005 against F-018 — this reflection corroborates it from the F-141 composition seat.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: happy-path
    coverage: verified
    test_ref: "integration-tests/e2e/specs/top-tags-ordering.spec.ts (IT-005) — RED, pins PLT-026"

