behaviour: |-
  **CONCURRENT INSERT — partial unique index enforcement.** Two simultaneous createRelation(alice, null, ownerX) calls — one succeeds, the other surfaces UniqueConstraintException via `JooqReactiveOperations.translateDatabaseException`. The partial unique index `unique_deleted_at_per_owner` (or `user_owner_mapping_oidc_username_provider_deleted_key`) is the load-bearing safety net. Without this test, a regression that dropped or weakened the partial unique index would let two concurrent mappings both succeed — creating the dual-active-mapping state that breaks the at-most-one invariant.
