observed_vs_expected:
  facets:
    - facet_id: hoc_is_context_not_gate_lsn023_trap_anchor
      drift_class: ui_hoc_is_context_not_gate_misreading_as_security_boundary_is_lsn023_class
      severity: LOW
      observed: |-
        WithPermissions.tsx:11-34 returns `null` when the caller lacks
        permission. The HOC's job is UX shape (hide the button), NOT
        authorization enforcement. Backend authorization at the controller
        perimeter (SecurityConstants + @PreAuthorize on @Endpoint methods)
        is the SOLE gate; the HOC is a courtesy presentation layer. A
        methodology pass that reads the HOC and concludes "permission
        enforced at the UI" is wrong on two axes: (a) the UI is not the
        enforcement boundary; (b) the backend has its own gate that may
        OR MAY NOT mirror the UI's choice. This is the LSN-023 trap
        anchor — a UI primitive that looks like a gate but is context.
      expected: |-
        Either (a) add a doc comment to WithPermissions.tsx explicitly
        stating "This HOC is UX context, not a security boundary; backend
        authorization is enforced separately at the controller
        perimeter" — so a future ontology pass cannot mis-read it; OR (b)
        a code-comment-as-architecture-anchor that the LSN-023
        methodology rule cites by file:line.
      operator_visible_consequence: |-
        No direct operator defect. The CONSEQUENCE is methodological — a
        future scan / audit may emit a false-positive `permission_side_door`
        finding by reading the HOC as a gate. Cross-link LSN-023:39-44
        (the original false-positive on F-031.namespace_name).
      ui_unverified: false
    - facet_id: hide_not_disable_creates_admin_contact_silence
      drift_class: ui_hide_not_disable_forbidden_affordances_no_help_text
      severity: MEDIUM
      observed: |-
        The default branch (`return hasAccessTo(permissionTo) ?
        <>{children}</> : null`) is the dominant pattern across callers.
        Users without RBAC permissions see a read-only list with NO
        buttons, no tooltip explaining the missing affordance, no
        admin-contact CTA. The HOC unconditionally hides; it does not
        offer a `disabledWithTooltip` mode. Per F-006 batch-Q UI tier
        finding: PolicyList and RolesList exhibit this pattern; a non-
        ADMIN sees the list with no controls and may reasonably conclude
        "no controls exist on this platform."
      expected: |-
        Either (a) extend the HOC API with a `whenForbidden:
        'hide' | 'disable' | 'tooltip'` prop, OR (b) document the
        platform's UX choice explicitly (the read-collaborative posture
        ADR-CANDIDATE-003 / REFACTOR-024 family) so operators know what
        they're missing.
      operator_visible_consequence: |-
        New operators encountering a permission-gated page see a
        seemingly read-only UI with no signal that affordances are
        hidden. They cannot self-diagnose ("am I missing a permission?")
        without admin help. The HIDE-NOT-DISABLE convention is platform-
        wide and undocumented at the operator surface.
    - facet_id: provider_unconditionally_renders_children_no_top_level_route_gate
      drift_class: ui_permissions_provider_doesnt_gate_routes_only_announces_context
      severity: LOW
      observed: |-
        WithPermissionsProvider.tsx:12-51 — the provider unconditionally
        renders its children/Component/render regardless of permission
        state. It announces a permission context to descendants but does
        NOT itself gate access. Route-level gating (per F-105 Management
        Section Route Gating) is a SEPARATE concern handled at the
        ManagementSkeleton + ManagementRoutes layer; the provider is just
        the announcement layer. A maintainer assuming the provider also
        gates the route would mis-model the architecture.
      expected: |-
        Either (a) a doc comment naming "this provider announces context;
        route-gating is enforced separately at ManagementRoutes", OR (b)
        a sibling `<WithPermissionsRouteGuard>` higher-order route that
        composes the provider with an actual gate.
      operator_visible_consequence: |-
        No direct defect — F-105's Management route gate is the actual
        boundary. Methodology consequence: an ontology pass that reads
        WithPermissionsProvider as a route gate would misattribute the
        gate.
    - facet_id: permission_resolution_relies_on_unread_hook_ui_unverified
      drift_class: ui_predicate_resolution_via_hook_not_traced_to_redux_state
      severity: LOW
      observed: |-
        WithPermissions.tsx:17 — `const { hasAccessTo } = usePermissions()`
        — the predicate comes from a hook whose implementation has not
        been read at this writing. The hook's behaviour (does it read
        redux, react-context, both?), its caching, its reactivity to
        login/logout, the case where PermissionProvider is absent above
        the consumer, are all unverified. A scan emitting drift on
        WithPermissions without reading the hook would carry
        ui_unverified contamination.
      expected: |-
        Enrich `usePermissions` at primary source on the next pass.
        Trace from hook → context provider → redux slice (or whatever the
        actual source-of-truth is).
      operator_visible_consequence: |-
        Methodology-only; no direct operator defect.
      ui_unverified: true
      ui_unverified_reason: |-
        usePermissions hook implementation has not been read at primary
        source this pass. All drift readings about resolution timing,
        caching, login/logout reactivity are inferred from the HOC
        consumer pattern only.
