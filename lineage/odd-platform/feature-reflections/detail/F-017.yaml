- id: H-008
  hypothesis: |
    "I can bookmark my filtered Catalog URL (/search/{uuid}) and return to the same view days
    or weeks later — the URL is a durable, saved search."
  derivation: |
    Category F: the route param `searchId` + the RESTful URL form /search/{searchId} promise
    a persistent saved-search id (search route sidecar request_inputs Q1). Negative-space: a
    bookmarkable URL is expected to be durable.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The UUID is a transient server-side SESSION row, not a saved search. It has no
      'saved-search' semantics: it is mutated in place on every facet change (PUT /facets) and
      is evicted by SearchFacetsHousekeepingJob at a 30-day default
      (housekeeping.ttl.searchFacetsDays — F-010; confirmed by the LSN-018 coherence
      correction and SHB-183, superseding the earlier 'no reaper / unbounded growth' claim).
      After eviction, GET /api/search/{uuid} returns 404; Search.tsx:44-48 has no .rejected
      handler and no fall-back-to-create, so the page is permanently broken (empty Catalog /
      stale UUID in the URL) with no recovery path. Probe P-168 pins the exact TTL window.
    evidence:
      - sidecar: odd-platform__ts__routes__route__search.md
        section: stress_findings.request_inputs (searchId, Q5)
        cite: "searchRoutes.ts:4-5 + ToolbarTabs.tsx:38 + Search.tsx:37-42"
        note: "DRIFT_INPUT_NAME_VS_IMPLEMENTATION — searchId is a mutable session pointer, not a saved-search id."
      - sidecar: odd-platform__ts__react-component__component__Search.md
        section: bugs_limitations_corner_cases (session-expiry)
        cite: "Search.tsx:44-48 + F-010 SearchFacetsHousekeepingJob 30-day TTL"
        note: "Stale UUID after TTL → 404 → no .rejected reducer → permanently broken page, no recovery."
    operator_visible_failure: |
      A user who bookmarks /search/{uuid} or shares it in a Slack message finds it works for a
      while and then silently 404s after 30 days, landing on an empty Catalog with no
      explanation of why their "saved search" vanished. Clicking the top-nav 'Catalog' tab
      (searchPath() with no arg) ALSO drops the UUID and creates a fresh empty session — so
      even within a single visit the "saved search" does not survive a tab click. The
      mismatch between the durable-saved-search the URL form implies and the transient mutable
      session it actually is the load-bearing Category F drift.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      A missing-functional demand: assert a stale/unknown /search/{uuid} renders a recoverable
      state (today it 404s into a permanently-empty Catalog with no .rejected handler) and that
      a Catalog tab-click drops the session. Probe P-168 pins the TTL value; the functional test
      guards the UX recovery path.

- id: H-009
  hypothesis: |
    "When I share my /search/{uuid} deep-link with a colleague, they see the facet/query state
    I INTENDED to share — a stable snapshot of my filtered view."
  derivation: |
    The deep-link-sharing affordance (the route surfaces the UUID specifically so a filtered
    Catalog view can be shared) implies a shareable snapshot. Negative-space: a shared link is
    expected to be a read-only-ish view, not a live shared mutable document.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      Static reading says CONTRADICTED: the recipient reads the SAME live search_facets row
      (no user binding — H-005), which the originator mutates in place on every facet click
      (PUT /facets) and which both parties' GETs side-effect-write (last_accessed_at). The URL
      behaves as 'pointer-to-whatever-this-row-currently-holds', not a snapshot — and the
      recipient's own facet clicks (PUTs on the shared UUID) overwrite the originator's state.
      What static reading cannot pin is the OBSERVABLE two-actor timeline shape (does B see a
      mid-edit partial state? does B's click bidirectionally stomp A? does the GET-side
      last_accessed_at UPDATE contend on the row lock under two concurrent clients?) — that
      requires running the system. Probe PENDING-F-017-1 emitted to resolve.
    evidence:
      - sidecar: odd-platform__ts__routes__route__search.md
        section: stress_findings.request_inputs (searchId, Q5 consequence 2)
        cite: "batch-M SearchController.updateFacets (mutates same row) + searchRoutes.ts:14-16"
        note: "Cross-user sharing exposes mutable latest state, not the intended snapshot."
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: bugs_limitations_corner_cases[6] / side_effect_update_on_every_get
        cite: "ReactiveSearchFacetRepositoryImpl.java:99-106"
        note: "GET is a write (last_accessed_at UPDATE) → row-lock contention under concurrent access."
    operator_visible_failure: |
      A user shares a filtered view; the recipient opens it 30 seconds later and sees a
      DIFFERENT state because the originator kept clicking (each click mutated the shared row);
      or the recipient adjusts a facet to explore and silently overwrites the originator's
      filter selections, so the originator's next interaction inherits the recipient's filters.
      The shared-mutable-document behaviour is surprising for what looks like a shared link to
      a saved view. Severity finalised on probe outcome.
    probe_id: PENDING-F-017-1
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    test_demand_note: |
      The probe (PENDING-F-017-1, formerly P-200) resolves the two-actor timeline; the
      build-time functional demand is the two-client e2e: actor A mutates a shared UUID, assert
