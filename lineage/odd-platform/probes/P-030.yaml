expected_outcome: |
  Stress question (Category E / resource boundary + the unset-origin INSERT
  finding): DatasetFieldServiceImpl.getUpdatedRelations
  (DatasetFieldServiceImpl.java:264-271) builds TagToDatasetFieldPojo instances
  with tagId and datasetFieldId set but NEVER calls .setOrigin(...).
  ReactiveTagRepositoryImpl.createDatasetFieldRelations
  (ReactiveTagRepositoryImpl.java:350-371) maps each pojo via
  jooqReactiveOperations.newRecord(TAG_TO_DATASET_FIELD, p) and INSERTs with
  .onDuplicateKeyIgnore(). The tag_to_dataset_field.origin column is
  `varchar NOT NULL DEFAULT 'INTERNAL'` (V0_0_82__add_tag_to_dataset_field.sql:12).

  Hypothesis A (endpoint correct): jOOQ's newRecord-from-pojo omits the unset
  origin field from the generated INSERT column list; Postgres applies the
  DEFAULT 'INTERNAL'; the relation row persists with origin='INTERNAL' and the
  next call's deleteDatasetFieldInternalRelations (which filters
  origin='INTERNAL') can correctly remove it.

  Hypothesis B (endpoint dead for non-empty payloads): jOOQ marks the origin
  field changed-with-value-NULL and emits an explicit NULL; the INSERT violates
  the NOT NULL constraint; PUT /api/datasetfields/{id}/tags with any non-empty
  `tags` array returns a 4xx/5xx error and no relations are ever written.

  Hypothesis C (silent orphan accumulation): the row persists but with an
  origin value other than 'INTERNAL', so the next call's INTERNAL-scoped delete
  misses it and the dataset field accumulates undeletable internal relations
  across calls.

  The probe distinguishes A / B / C by (1) asserting the first HTTP call
  succeeds with 200, (2) reading the persisted origin column directly, and
  (3) asserting a second call with a smaller tag set actually removes the
  dropped relation. The data-entity sibling endpoint side-steps this entire
  question by explicitly calling .setExternal(false) on TagToDataEntityPojo
  (TagServiceImpl.java:109); the dataset-field path's reliance on the column
  default is the untested risk.
