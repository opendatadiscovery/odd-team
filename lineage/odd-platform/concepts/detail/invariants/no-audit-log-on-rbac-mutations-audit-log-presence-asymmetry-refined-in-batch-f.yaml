contributors:
- 'createRole.md:security.known_security_gaps.[1]: TIER-2 UNAUDITED — `RoleServiceImpl.create/.update/.delete`
  emit no Slf4j, publish no events, insert no audit table; cross-axis activity feed
  does NOT cover Role / Policy / Permission. HIGH severity'
- 'createPolicy.md:security.known_security_gaps.[1] + bugs_limitations_corner_cases.[1]:
  TIER-2 UNAUDITED — `PolicyServiceImpl.create` has no `log.info/warn/audit` call.
  The `policy` table is single-state, no audit history table. Security incident review
  of ''who authored this MANAGEMENT/ALL policy?'' has no in-application answer. HIGH
  severity'
- 'createOwner.md:security.known_security_gaps.[0] + bugs_limitations_corner_cases.[4]:
  TIER-2 UNAUDITED — no `@ActivityLog` on OwnerServiceImpl.create (grep verified —
  only 5 service files carry the annotation, none of them Owner). Owner directory
  changes invisible to audit even when they cascade into ownership-row changes that
  ARE recorded. MEDIUM severity'
- 'updateStatus.md:implicit_adrs.[4] (batch F): TIER-1 AUDITED (REFINEMENT) — `DataEntityInternalStateServiceImpl.changeStatusForDataEntities`
  (lines 155-182) emits DATA_ENTITY_STATUS_UPDATED events PROGRAMMATICALLY (oldState
  captured pre-mutation, newState resolved post-mutation, both JSON-serialised). NOT
  @ActivityLog AOP because the mutation is bulk; the asymmetric pattern is explicit.
  CONFIRMS DataEntity mutations are audited.'
- 'createOwnership.md:implicit_adrs.[1] (batch F): TIER-1 AUDITED (REFINEMENT) — `OwnershipServiceImpl.create`
  is annotated `@ActivityLog(event = OWNERSHIP_CREATED)` and `OwnershipCreatedActivityHandler`
  captures BEFORE/AFTER ownership state for the data-entity. EXPLICIT CONTRAST with
  OwnerController.createOwner from batch E (no @ActivityLog) — the audit decision
  is per-write, and ownership-binding IS audited while Owner-directory CRUD is NOT.'
- 'ReactivePolicyRepositoryImpl.md:security.known_security_gaps.[1] (batch H): TIER-2
  UNAUDITED — SQL PRIMARY-SOURCE CONFIRMATION. The repository emits ZERO security-relevant
  log lines on {create, update, delete}; ExceptionUtils emits one log.error ONLY on
  non-uniqueness DB errors. Persistence-layer silence on the RBAC mutation path uniformly
  across the 4-sidecar pattern. The HIGH-severity classification is the same as the
  service-layer findings — adding the SQL layer means the gap is end-to-end (HTTP
  → service → persistence) with no silent backup audit at any layer.'
