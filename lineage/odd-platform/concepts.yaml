entities:

  - name: "Data Entity"
    canonical_in_docs: true
    canonical_candidate: false
    description: "The platform's unit of metadata — datasets, transformers, consumers, quality tests, groups, and inputs — addressable by ODDRN. The central domain object spanning catalog navigation, lineage, alerts, ownership, tags, terms, descriptions, status, metadata, and discussions. **Batch F** completes the centerpiece-read + ownership-binding + status-lifecycle + lineage-graph surface: getDataEntityDetails (the platform's single hottest endpoint; view-count side-effect; cross-owner full-payload exposure on the CENTERPIECE READ), createOwnership (Owner+Title auto-create-on-miss bypassing OWNER_CREATE permission), updateStatus (HIGH-severity ordering bug breaking 30-day housekeeping TTL; programmatic audit-log emission confirmed), getDataEntityDownstreamLineage (recursive-CTE; null-Integer NPE; no depth cap; cross-owner graph enumeration vector)."
    axes_present:
      - controllers
      - openapi_tags
    nodes:
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityController"
      - "odd-platform openapi tags openapi-tag:dataEntity"
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController"
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:DirectoryController"
      - "odd-platform java AlertController controller-method:changeAlertStatus"
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertManagerController"
      - "odd-platform java DataEntityAttachmentController controller-method:uploadFileChunk"
      - "odd-platform java DataCollaborationController controller-method:postMessageInSlack"
      - "odd-platform java ActivityController controller-method:getActivity"
      - "odd-platform java SearchController controller-method:search"
      - "odd-platform java DataEntityController controller-method:getDataEntityDetails"
      - "odd-platform java DataEntityController controller-method:createOwnership"
      - "odd-platform java DataEntityController controller-method:updateStatus"
      - "odd-platform java DataEntityController controller-method:getDataEntityDownstreamLineage"
      - "odd-platform java IngestionController controller-method:postDataEntityList"
    contributors:
      - "DataEntityController: entities[DataEntity, DataEntityRef, DataEntityDetails, DataEntityList, DataEntityGroup, ...]"
      - "openapi-tag:dataEntity: entities[Data Entity, DataEntityGroup, DataEntityRef, DataEntityDetails, ...]"
      - "DataEntityAttachmentController: operations are scoped per data entity (`/api/dataentities/{data_entity_id}/...`)"
      - "DirectoryController: entities[Data Source Type, Data Source, Data Entity Type, Data Entity, ODDRN]"
      - "AlertManagerController: entity_oddrn is the routing key onto a Data Entity"
      - "DataEntityAttachmentController.uploadFileChunk: data_entity_id path variable bound but never forwarded; uploadId is the authoritative session key"
      - "DataCollaborationController.postMessageInSlack: data_entity_id is required in MessageRequest body; existence checked, ownership NOT checked"
      - "ActivityController.getActivity: ActivityState payload carries old_state/new_state diffs for every tracked field on each data entity"
      - "SearchController.search: catalog-wide paginated enumeration of every non-EXCLUDE_FROM_SEARCH Data Entity row — names, ODDRNs, descriptions, ownership, tags, custom metadata, term linkages, datasource, namespace, statuses. Default `my_objects=false` returns aggregations across the entire catalog without any owner predicate. Third read-collaborative cross-owner-enumeration surface alongside getAllAlerts + getActivity."
      - "DataEntityController.getDataEntityDetails (batch F): entities[DataEntityDetails (34-field payload), DataEntityDetailsDto, NotFoundException, soft-delete state with includeDeleted(true)]; CENTERPIECE READ — 4 ADRs (read-collaborative GET intentionally outside SECURITY_RULES on the hottest endpoint; soft-deleted entities returned by design; read-as-write `view_count` increment inside `@ReactiveTransactional`; multi-stage Mono.zip enrichment). Resolves ADR-CANDIDATE-003 borderline as DELIBERATE."
      - "DataEntityController.createOwnership (batch F): entities[Ownership, OwnershipFormData, OwnershipPojo, OwnerPojo (auto-created via getOrCreate), TitlePojo (auto-created via getOrCreate)]; operations[bind-owner-to-data-entity with optional DEG propagation, search-index refresh, mark `data_entity_filled.OWNERS`]; 4 ADRs incl. **activity-feed emission ASYMMETRY**: @ActivityLog(OWNERSHIP_CREATED) IS present on OwnershipServiceImpl.create vs OwnerController.createOwner which has NONE; **permission-bypass side-door**: owner/title auto-create via getOrCreate bypasses OWNER_CREATE; DEG propagation with onConflict-doUpdate cascade."
      - "DataEntityController.updateStatus (batch F): entities[DataEntityStatus, DataEntityStatusFormData, DataEntityStatusEnum (UNASSIGNED/DRAFT/STABLE/DEPRECATED/DELETED closed 5-member enum)]; 6 ADRs incl. settable-property-not-state-machine; switchable-statuses-encode-auto-flip-intent in isSwitchable boolean; soft-delete-is-the-deletion-model; programmatic activity-event emission via logStatusChangeEvents (NOT @ActivityLog AOP). **HIGH-severity ordering bug**: DataEntityMapperImpl.applyStatus@L242-253 sets `pojo.setStatus(...)` BEFORE the if-check → `statusUpdatedAt` NEVER bumped → 30-day housekeeping TTL broken. **POSITIVE FINDING**: audit-log emission CONFIRMED for DataEntity mutations."
      - "DataEntityController.getDataEntityDownstreamLineage (batch F): entities[LineagePojo edges in `lineage` table, DataEntityLineage graph DTO, LineageDepth wrapper, DataEntityLineageNode/Edge]; 2 ADRs (single-query recursive-CTE via Postgres WITH RECURSIVE; dual-input client-driven expansion model with depth + expandedEntityIds). **HIGH-severity bugs**: null-Integer NPE on missing `lineage_depth` (docs claim 'Unset returns the platform's default depth' — UNIMPLEMENTED); no `@Max(...)` cap on depth (DoS-amplification vector); no CTE cycle guard; cross-owner graph enumeration."
      - "IngestionController.postDataEntityList (batch F): entities[DataEntityList (data_source_oddrn + items[]), IngestionService, BadUserRequestException]; CANONICAL S2S ingestion entry point — controller is 4-line proxy; authentication delegated EXCLUSIVELY to IngestionDataEntitiesFilter (`auth.ingestion.filter.enabled` defaults false → bundled deployment ships UNAUTHENTICATED). 4 ADRs (OpenAPI-contract-driven path; filter-based-auth-not-annotation; code-side empty-list validation; 200-vs-201 spec drift)."
