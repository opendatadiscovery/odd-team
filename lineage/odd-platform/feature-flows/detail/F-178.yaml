discovered_from_entry_point: ui-component:DataEntityDetailsHeader
description: |-
  The detail-page header carries seven distinct affordances clustered into
  one row (left and right columns of a `lg={7}/lg={5}` grid). The left
  column carries identity surfaces (entity name + class/type badges +
  optional business-name edit). The right column carries cross-cutting
  actions (stale indicator + status flip + group edit + share-to-Slack).

  Operator-observable promise: "The header shows you what this entity
  is, when it last sync'd, what state it's in, and lets you act on it."

  Operator-observable reality, per primary-source
  DataEntityDetailsHeader.tsx:34-150:

  1. The entity name surface (line 76) chooses `internalName ||
     externalName`. If both are present, the bottom of the header
     surfaces the OTHER as "Original: {externalName}" footer (lines
     63-70) — a subtle UX signal that the operator-authored business
     name is the primary identity and the collector-ingested external
     name is the secondary fact.

  2. The business-name edit affordance is a Button rendered as
     "Edit" if internalName exists, "Add business name" otherwise
     (line 92), opening InternalNameFormDialog. Gated by
     DATA_ENTITY_INTERNAL_NAME_UPDATE (line 88).

  3. The status surface is rendered conditionally on
     `!isStatusDeleted` (line 87 — the gate spans the edit button
     AND the rest of the right-column action stack). When the entity
     is DELETED, every edit affordance (business name edit, group
     edit, share, status flip indirectly via the permission gate)
     disappears from the header. No banner explains "this entity is
     in DELETED state — actions are unavailable" to the operator;
     they just see fewer buttons.

  4. EntityStatus (lines 116-120) is rendered always but its
     `selectable` prop is gated on the permission check
     (`renderContent={({ isAllowedTo }) => <EntityStatus ...
     selectable={isAllowedTo}>`). A user without
     DATA_ENTITY_STATUS_UPDATE sees the badge in READ-ONLY mode —
     no visual hint that for others this is interactive.

  5. The DataEntityGroupForm "Edit group" button (line 124-130) is
     gated by BOTH `manuallyCreated && !isStatusDeleted` AND
     DATA_ENTITY_GROUP_UPDATE permission. Three independent gates;
     silent when any one fails.

  6. The "Share" to Slack button (lines 132-144) is gated by
     `<WithFeature featureName={Feature.DATA_COLLABORATION}>`. When
     the platform deployment hasn't enabled DataCollaboration (the
     default — `datacollaboration.enabled=false` per backend
     DataCollaborationProperties), the button is silently absent.
     No "install Slack to enable this" hint surface.

  7. The stale indicator (`<MetadataStale>` or `<TimeGapIcon>` at
     lines 52-56) is rendered conditionally on `lastIngestedAt`.
     The "isStale" boolean is computed server-side per the
     `odd.data-entity-stale-period` config (default 7 days). The
     header shows the orange-clock icon + the relative-time string
     for stale entities; the timestamp alone for fresh ones. There
     is no per-class default and no operator override; an entity
     of any class is "stale" at 7 days globally.
