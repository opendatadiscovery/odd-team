      addSoftDeleteFilter (line 916) and HOLLOW.isFalse() (line 918) but does NOT apply an
      EXCLUDE_FROM_SEARCH predicate. The filter IS applied at the FTS path (findByState via
      JooqFTSHelper.resultFacetStateConditions:149) and the count/statistics path
