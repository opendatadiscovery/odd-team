name: 'OpenAPI spec info.title is legacy ''ProspectLog'' branding'
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-11
description: |-
  **NEW CANONICALISATION CANDIDATE, batch 2026-05-20-Z (odd-platform-public-api spec sidecar)** —
  the platform-api OpenAPI spec declares
  `info.title: 'ProspectLog data catalog HTTP API contract'`
  (openapi.yaml:3) AND `info.contact.url: 'https://provectus.com'`
  + `info.contact.email: 'ndementev@provectus.com'`
  (openapi.yaml:5-9). The title 'ProspectLog' is a legacy internal/early
  project name; the contact block ties to Provectus, ODD's origin company.

  **The operator-facing surface**: the spec is publicly served at
  `{platform-base-url}/api/v3/api-docs` per the live api-reference doc
  page (WebFetched 2026-05-20, status 200). Operators interacting with
  the Swagger UI on a running platform see the title 'ProspectLog data
  catalog HTTP API contract' as the API name. The PUBLIC BRANDING is
  'Open Data Discovery'.

  **The PII / contact concern**: `info.contact.email: ndementev@provectus.com`
  is exposed to any caller that can reach `/api/v3/api-docs`. Under
  `auth.type=DISABLED` (the shipped default per system-mission.md P-09)
  AND under the AUTH-MODE-ORTHOGONAL S2S surface (the ingestion endpoints
  are unauthenticated regardless of UI auth mode), the contact block is
  reachable by unauthenticated network probes. Direct individual email
  contact for an external contributor is arguably PII exposure.

  **Severity LOW**: branding/cosmetic primarily; PII concern is a
  surface-area observation not a load-bearing security issue. Surfaced
  as a canonicalisation candidate because:
    (a) the title rename would touch the public Swagger UI of every
        ODD deployment — a one-line spec change with broad downstream
        visibility;
    (b) the contact block reform (individual email → org-shared mailbox
        + GitHub repo URL) is a publishing-standards correction the
        maintainer should consider per the LSN-006 lookup-tables-content-
        homing case (publishing-standards apply at every public surface).
canonicalisation_proposal: |-
  Maintainer-decision: either
    (a) rename to 'Open Data Discovery Platform API' in openapi.yaml:3 +
        change contact block to GitHub repo URL +
        github@opendatadiscovery.org (or equivalent shared mailbox);
    (b) document the legacy name + cite the rename history at the spec
        level (e.g. add a x-historical-name extension);
    (c) leave as-is — the legacy name is part of the project's history
        and renaming may surprise long-standing integrators.

  Recommendation: option (a) — the spec is the developer surface and
  publishing standards apply.
