chain:
- hop: 1
  node: odd-platform java service service:ActivityServiceImpl
  sidecar: '(referenced from batch-A primary-source via F-021)'
  multiplicity_per_trigger: 1
  evidence: |-
    ActivityServiceImpl.java:194-198 — `fetchMyActivities` calls
    `authIdentityProvider.fetchAssociatedOwner().flatMapMany(...).switchIfEmpty(Flux.empty())`.
    The `switchIfEmpty(Flux.empty())` is the silent-empty branch — no
    structured error, no hint payload, no diagnostic header. The
    sibling counts at lines 239-243 mirror the pattern: `.switchIfEmpty(Mono.just(0L))`.
  unresolved: false
- hop: 2
  node: odd-platform java service service:AlertServiceImpl
  sidecar: '(referenced from batch-I primary-source via F-014)'
  multiplicity_per_trigger: 1
  evidence: |-
    AlertServiceImpl.listByOwner (lines 82-87) — same pattern:
    `authIdentityProvider.fetchAssociatedOwner()` resolves to Mono.empty()
    for unmapped users; downstream flatMap never fires; Flux completes
    empty. The /api/alerts/my tab renders zero rows visually identical
    to "no open alerts on entities you own."
  unresolved: false
- hop: 3
  node: odd-platform java auth service:AuthIdentityProviderImpl
  sidecar: '(referenced from F-011 batch-R primary-source)'
  multiplicity_per_trigger: 1
  evidence: |-
    AuthIdentityProviderImpl.java:50-53 — `fetchAssociatedOwner()` returns
    `getCurrentUser().flatMap(user -> userOwnerMappingRepository.getAssociatedOwner(user.username(), user.provider()))`.
    Returns `Mono.empty()` when no mapping row exists for the
    (username, provider) tuple. This is the SHARED CHOKEPOINT — every
    "My" view across the platform routes through this method.
  unresolved: false
- hop: 4
  node: odd-platform ts react-component component:Activity
  sidecar: '(referenced from F-021 batch-ZL primary-source)'
  multiplicity_per_trigger: 1
  evidence: |-
    Activity.tsx + ActivityResults.tsx (per F-021 batch-ZL note 7) renders
    `items: []` response as the standard empty-state component (no inline
    banner, no diagnostic affordance, no click-through to associations).
    The same shape applies to Alerts.tsx (F-007 batch-ZL note 1) for the
    /alerts/my tab.
  unresolved: true
  unresolved_reason: |-
    The UI HALF of this feature — whether the empty-state component
    distinguishes "no mapping" from "no data" — has not been enriched at
    a dedicated empty-state-affordance sidecar. Per Rule 0b ui-incomplete,
    UI-dependent drift facets carry ui_unverified: true.
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    200 OK with `items: []` payload for the MY_OBJECTS / my tab view-mode
    when the authenticated user has no user_owner_mapping row. Count
    badges return 0 reinforcing the empty appearance. No structured hint,
    no diagnostic header, no UI banner.
  evidence: |-
    ActivityServiceImpl.java:194-198 (silent-empty Flux),
    ActivityServiceImpl.java:239-243 (silent-zero count),
    AlertServiceImpl.java:82-87 (alert my-tab silent-empty),
    AuthIdentityProviderImpl.java:50-53 (the shared chokepoint).
  cardinality_per_call: 0 rows per call for unmapped users
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — confirmed from primary source. The amplification is
  structural: one user click on "My objects" tab produces zero results,
  but the consequence amplifies across the operator's understanding —
  the user assumes the feature works and concludes "nothing happened
  recently," missing critical activity / alerts on entities they should
  own.
observed_vs_expected:
  facets:
  - facet: |-
      "My objects" silent-empty visually indistinguishable from "no
      recent activity" for unmapped users
    observed: |-
      Users without a user_owner_mapping row navigate to Activity → My
      objects or Alerts → My and see an empty list visually identical to
      a fresh deployment where the user genuinely has no activity. The
      `switchIfEmpty(Flux.empty())` at ActivityServiceImpl.java:194-198 +
      `switchIfEmpty(Mono.just(0L))` at lines 239-243 + the symmetric
      pattern in AlertServiceImpl.listByOwner (lines 82-87) yield the
      same payload shape as "real empty." The platform admin who set up
      RBAC for others but not themselves, a new joiner whose onboarding
      didn't include the Associations step, or any operator running ODD
      for the first time experiences the feature as broken without any
      diagnostic affordance.
    expected: |-
      Either (a) the controller / service returns a structured hint
      payload (`items: [], hint: "no_owner_association"`) and the UI
      renders an inline banner with click-through to the User-Owner
      Associations management page, OR (b) the global navigation /
      profile widget surfaces "Your account is not associated with an
      Owner" platform-wide, OR (c) the live doc explicitly flags the
      User-Owner Association as a prerequisite for the "My" views to
      function.
    drift_class: silent_empty_for_unmapped_users_no_ui_affordance_no_diagnostic_signal
    provenance: |-
      PRIMARY-SOURCE — ActivityServiceImpl.java:194-198 + 239-243 +
      AlertServiceImpl.java:82-87 + AuthIdentityProviderImpl.java:50-53.
      Live Activity Feed doc page (`features/active-platform-features/activity-feed`,
      WebFetched 2026-05-20 status 200) confirms the page mentions "My
      objects" view-mode but does NOT name the user-owner-association
      prerequisite. Per ActivityServiceImpl sidecar `stress_findings.S-D-2`
      STATIC-INFERRED HIGH.
    severity: MEDIUM
  - facet: |-
      Counts endpoint returns 0 for unmapped users reinforcing "feature
      empty for you" appearance
    observed: |-
      `getMyObjectActivitiesCount` at ActivityServiceImpl.java:239-243
      returns `Mono.just(0L)` for unmapped users (the `defaultIfEmpty(0L)`
      branch). The Mono.zip at line 158-165 combines this with the other
      counts; the badge UI renders "0 My objects" visible at every visit
      to the Activity Feed. Combined with the silent-empty list, the
      operator's only signal is the absence of signal.
    expected: |-
      A null / -1 / explicit "association_missing" sentinel that the UI
      can distinguish from a legitimate 0.
    drift_class: count_badge_returns_zero_reinforces_appears_broken
    provenance: |-
      PRIMARY-SOURCE — ActivityServiceImpl.java:239-243 + ActivityServiceImpl
      sidecar invariants.
    severity: MEDIUM
  - facet: |-
      Cross-feature uniform silent-empty pattern — Activity My / Alerts
      My / future "My owned entities" view all share the chokepoint
    observed: |-
      Every "My" view in the platform routes through `fetchAssociatedOwner()`
      (AuthIdentityProviderImpl.java:50-53). The Activity Feed's MY_OBJECTS
      type, the Alerts feature's listByOwner / my-tab, and any future
      data-entity "My owned" view (cross-link F-015 anchor-set reads)
      share the same Mono.empty() failure mode. A platform user opting
      into ODD with no Owner association experiences uniformly silent
      degradation across MULTIPLE features.
    expected: |-
      A single cross-cutting affordance — either (a) the global navigation
      profile widget surfaces "missing association" once, or (b) a shared
      empty-state component used by every "My" view renders the same
      diagnostic banner with click-through.
    drift_class: cross_feature_uniform_silent_empty_pattern_activity_alerts_my_objects_views
    provenance: |-
      STATIC — primary-source at AuthIdentityProviderImpl.java:50-53
      (the shared chokepoint) + ActivityServiceImpl.java:194-198 +
      AlertServiceImpl.java:82-87. SHB-060 evidence enumerates the
      symmetric pattern on alerts side.
    severity: MEDIUM
    ui_unverified: true
    ui_unverified_reason: |-
      The cross-feature scope (whether Activity.tsx and Alerts.tsx today
      use the SAME empty-state component vs distinct components, and
      whether either renders the "missing association" affordance) is
      backend-only inferred. A future UI sidecar enrichment of the
      empty-state component for Activity / Alerts confirms or refines.
  - facet: |-
      Live docs do not flag User-Owner Association as a prerequisite for
      "My" views
    observed: |-
      Live `features/active-platform-features/activity-feed` (WebFetched
      2026-05-20 status 200) mentions a "My objects" view-mode but does
      NOT document the user-owner-association prerequisite. Operators
      reading the doc cannot infer that the feature requires a manual
      admin step in the Associations management tab. Per ActivityServiceImpl
      sidecar `docs_link_semantic.doc_drift_findings.[1]`.
    expected: |-
      The Activity Feed doc page + the Alerts doc page + the
      `management/associations` (or equivalent) doc page should cross-
      link with a prerequisite statement: "The 'My objects' view returns
      activity only for data entities owned by the Owner you are
      associated with. Set up your association in Management →
      Associations before relying on this view."
    drift_class: doc_does_not_flag_user_owner_association_prerequisite_for_my_views
    provenance: |-
      LIVE-DOC — verified 2026-05-20 status 200. ActivityServiceImpl
      sidecar `docs_link_semantic.doc_drift_findings.[1]` records the
      gap; DOC-GAP-NNN candidate (deferred to doc-gap-finder).
    severity: MEDIUM
  - facet: |-
      Onboarding workflow gap — admin sets up RBAC for OTHERS but not for
      themselves
    observed: |-
      The platform admin authoring Roles / Policies / Owners during initial
      setup typically configures these FOR OTHERS — creating Owner entities
      representing their teammates and attaching Roles. The admin's own
      account often has no `user_owner_mapping` row because the admin's
      identity is "the operator who set up the platform" rather than "a
      catalog owner of any entity." Result: the admin experiences every
      "My" view as silent-empty during setup, may conclude the platform
      is broken before finishing onboarding.
    expected: |-
      Either (a) a setup-wizard step prompts the admin to associate their
      own user with an Owner before completing initial deployment, OR
      (b) the global "missing association" widget surfaces from first
      login and persists until resolved.
    drift_class: onboarding_workflow_gap_admin_sets_up_rbac_for_others_but_not_themselves
    provenance: |-
      INFERRED from SHB-060 narrative + ActivityServiceImpl.java:194-198
      structural pattern. No primary-source evidence at the onboarding
      wizard layer (not yet enriched as a sidecar — the wizard UI is
      P-08 Integration Wizard adjacent but not the same flow).
    severity: LOW
    ui_unverified: true
    ui_unverified_reason: |-
      The onboarding-wizard flow has not been enriched as a sidecar at
      this writing; the consequence is structurally inferable but the
      precise admin-experience trajectory needs UI walkthrough.
