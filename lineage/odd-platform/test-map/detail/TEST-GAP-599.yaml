behaviour: |-
  **NPE on null `provider.getLogoutUri()` — STRENGTHENS TEST-GAP-151 with consumer-side file:line anchor.** Line 39 of AzureLogoutSuccessHandler calls `URI.create(provider.getLogoutUri())` with NO null-guard. Per JDK contract `java.net.URI.create(String)` calls `new URI(str)` which throws NullPointerException on null. The validator at `ODDOAuth2Properties.java:17-28` checks ONLY `clientId` and `provider` for non-empty — `logoutUri` is unchecked. An Azure operator following the live docs but omitting `logout-uri` boots successfully (no boot-time validation) and hits the NPE at FIRST logout attempt (deferred runtime failure). The sibling `CognitoLogoutSuccessHandler.java:33-35` carries the matching guard (`if (StringUtils.isEmpty(provider.getLogoutUri())) return Mono.empty();`); Azure does NOT. Inconsistent guard. Live OAuth2/OIDC docs WebFetched 2026-05-19 status 200 state explicitly: "logout-uri must be set for Azure SSO. The Azure-specific logout handler calls URI.create(provider.getLogoutUri()); leaving logout-uri unset raises a NullPointerException and the logout flow returns a 500 response." The drift is operator-visible — docs say required, platform boots without it, failure deferred.
