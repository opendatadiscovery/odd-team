behaviour: |-
  Unhandled-mention staging — undocumented forward-compatibility feature. A `[[ns:NEW_TERM]]` mention for a non-existent term is NOT dropped; it is staged in `*_unhandled_term` tables (`buildDataEntityUnknownTerms` / `buildDatasetFieldUnknownTerms` / `buildTermUnknownTerms` at TermServiceImpl.java:501-544) and AUTOMATICALLY materialised into a real link row when a matching term is later created (`resolveUnhandledDescriptionMentions` at lines 421-442). Operators authoring descriptions can reference terms they plan to create later, and the platform reconciles when the term arrives. NO test verifies the unhandled→link migration. A regression that removed `resolveUnhandledDescriptionMentions` (or its invocation from createTerm at line 116) would silently break backward-resolution, with no test surface failing — operators would discover the regression only when a description's mention failed to surface as a link after the term was created.
