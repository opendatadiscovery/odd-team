name: |-
  LSN-019 — listMostPopular NAME-vs-BEHAVIOR drift (pagination precedes ranking; outer count-DESC cannot reach excluded rows)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-08
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch VAL-LSN-019 (2026-05-20) — the
  CANARY headline finding from the LSN-019 Stress Protocol validation
  batch. Captures a NAME-vs-BEHAVIOR DRIFT where the operation's name
  + the OpenAPI description + the UI surface label all PROMISE
  popularity-ranked global selection, but the SQL truth is
  pagination-precedes-ranking: pre-truncate by TAG.ID ASC then
  re-order the window by count DESC. The outer count-DESC cannot
  reach tags excluded by the inner LIMIT.

  THE PROMISE (three independent surfaces promise the same thing):

    Surface 1 — Java method name (controller + service):
      TagController.getPopularTagList (TagController.java:36-44)
      TagServiceImpl.listMostPopular (TagServiceImpl.java:72-77)
      ReactiveTagRepositoryImpl.listMostPopular (ReactiveTagRepositoryImpl.java:137-167)
      All three name the operation by POPULARITY.

    Surface 2 — OpenAPI description:
      odd-platform-specification/openapi.yaml:345 verbatim:
      `description: 'Gets the list of existing tags sorted by popularity'`.

    Surface 3 — UI surface label:
      The Catalog Overview surface renders this response as "Top Tags"
      (UI inheritance from previous batch-W sidecar analysis); the
      tag-search facet uses the same endpoint with `query`; the
      Management → Tags tab uses it for listing. ALL THREE UI surfaces
      LIE to the operator about what's actually returned.

  THE IMPLEMENTATION (the smoking gun chain):

    ReactiveTagRepositoryImpl.listMostPopular (lines 137-167):

      Step a (lines 144-145): build homogeneous select:
        `selectFrom(TAG).where(conditions)` where conditions includes
        the inherited soft-delete filter + optional listCondition(query)
        case-insensitive substring + optional `TAG.ID.in(ids)`.
        **NO ORDER BY at this layer**.

      Step b (LINE 148 — THE LOAD-BEARING SMOKING GUN):
        `paginate(homogeneousQuery, List.of(new OrderByField(TAG.ID, SortOrder.ASC)),
        (page - 1) * size, size)`.
        The `paginate` helper (JooqQueryHelper.java:63-90) wraps the
        homogeneous select and emits:
        ```sql
        SELECT u.*, count(*) OVER () AS _total,
               row_number() OVER (ORDER BY u.id ASC) AS _row
        FROM (homogeneous_select) u
        ORDER BY u.id ASC
        LIMIT size OFFSET (page-1)*size
        ```
        **This is the LIMITING step**. After this, `tag_cte` contains
        the size lowest-ID tags matching the filters — the OLDEST tags
        by serial-PK = creation order.

      Step c (line 150): materialise as `tag_cte` table-reference.

      Step d (lines 373-392 via getDataEntityWithDatasetFields call):
        Build:
        ```sql
        WITH tag_cte AS (...)
        SELECT tag_cte.fields, count, external
        FROM tag_cte LEFT JOIN tag_to_data_entity
        GROUP BY tag_cte.fields
        UNION ALL
        SELECT tag_cte.fields, count, external_via_origin_ne_INTERNAL
        FROM tag_cte LEFT JOIN tag_to_dataset_field
        GROUP BY tag_cte.fields
        AS union_usages
        ```
        The count aggregation runs OVER the already-truncated CTE.

      Step e (LINE 158): outer ordering:
        `cteSelect.orderBy(field(COUNT_FIELD).desc())` — sums counts
        across both arms + re-orders the size pre-selected rows by
        count DESC. **Does NOT change WHICH rows are returned — only
        the order within the already-selected window**.

  THE OPERATOR-VISIBLE CONSEQUENCE (the empirical proof):

    Maintainer's 2026-05-20 test against demo.oddp.io:
      - Create 35 tags with explicit timestamps (oldest first by id 1-35).
      - Tag every entity with all 35 tags (equal usage counts).
      - Call GET /api/tags?size=30 (default page size).
      - Observed: response contains tags with IDs 1-30 in tag.id ASC
        order. Tags with IDs 31-35 are ABSENT from the response despite
        being equally popular.
      - Recorded at retrospectives/LSN-019:23-32.

    For a real deployment:
      - 30+ tags total, recently-created tags MORE popular than older
        ones: "Top Tags" surface displays OLDEST tags, the actually-popular
        recently-created tags are INVISIBLE on page 1.
      - 30+ tags total, all with equal counts: same as the test, OLDEST
        30 displayed.
      - 30+ tags total, recently-created tags LESS popular: closest to
        the promised behavior, but only because the older tags happen
        to be popular too (the response is still wrong in general).

    The "Top Tags" UI surface is the operator's only window into tag
    popularity. The drift is INVISIBLE to operators because the response
    looks plausible (it IS sorted by count DESC within the response —
    just not over the right subset).

  WHY THIS IS HIGH (not MEDIUM):

    1. **OPERATOR-VISIBLE UI LIE**: The "Top Tags" UI surface presents
       OLDEST tags as if they were MOST POPULAR. Operators using the
       Discovery surface to find prevalent vocabulary are misled.

    2. **SPEC-vs-CODE DRIFT**: OpenAPI's verbatim "sorted by popularity"
       is unmet. Third-party API consumers reading only the spec have
       no warning that the contract is broken under realistic load.

    3. **PRE-VAL-LSN-019 SUBSTRATE WAS WRONG**: The previous version
       of the `get-popular-tag-list` concept entry described the
       implementation as "popularity-ranked paginated global tag
       directory" — perpetuating the LIE at the substrate layer. The
       LSN-019 Stress Protocol's mechanical detection (the auto-fired
       NAME-vs-BEHAVIOR pair question on every operation) was the
       mechanism that caught it.

    4. **NO TEST PINS THE TRUTH**: TagRepositoryImplTest.testListMostPopular
       (TagRepositoryImplTest.java:237-267) exercises 8 tags with
       size=numberOfTestTags=8 (the LIMIT never fires) and asserts
       `containsExactlyInAnyOrder` on the popular-name-filtered subset.
       Both choices are STRUCTURALLY INCAPABLE of detecting the drift.
       A future refactor that "fixes" the paginate-inside-CTE pattern
       would change the API's observable behaviour and no test would
       catch it.

    5. **THE BUG IS NOT VISIBLE FROM ANY SINGLE LAYER**: A maintainer
       reading just TagController sees a 2-line reactive delegation.
       Reading just TagServiceImpl sees a 1-line pass-through. Reading
       just ReactiveTagRepositoryImpl sees a CTE + ORDER BY count DESC
       — and the structural choice (paginate inside the CTE) is
       internally consistent with every other paginated endpoint. The
       LSN-019 drift surfaces ONLY at the cross-layer Stress Protocol
       trace: the auto-fired NAME-vs-BEHAVIOR question on every
       operation. This is the canonical LSN-019 methodology validation.

  THE LSN-019 STRESS PROTOCOL — METHODOLOGY VALIDATION (META-FINDING):

    LSN-019 (`retrospectives/LSN-019-file-analyser-describes-not-interrogates.md`)
    extended the file-analyser prompt with the Stress Protocol — every
    detected trigger fires an auto-question across 5 categories:
      A — Tunables (numeric / null / boundary)
      B — Name-behavior pairs (promise vs implementation)
      C — Orderings / pagination / aggregation
      D — Authorization gates (per-method)
      E — Resource boundaries (concurrency / TX / locks / cache)

    The B category's auto-question on `listMostPopular`: "Does the
    implementation actually order by popularity?" — surfaced this drift
    MECHANICALLY in batch VAL-LSN-019, without the maintainer needing
    to know to ask. The protocol IS the detection mechanism.

    Probe P-010 (`lineage/odd-platform/probes/P-010.yaml`) was emitted
    in this batch to pin the SQL contract in CI permanently — a
    regression test asserting that the response contains tags with
    IDs 1..size when the directory has > size tags with equal counts.

  THE DRIFT CLASS — cross-cutting application:

    Every Java method with `paginate(...)` applied INSIDE a CTE that
    is later aggregated then re-ordered by a non-id column has the
    same shape. The pattern is widespread across
    `ReactiveAbstractCRUDRepository` users; LSN-019 captures the
    pattern at `listMostPopular` first because the method name's
    semantic promise (popularity) most loudly contradicts the
    structural choice (id-asc pagination).

    Sister candidates to audit:
      - ReactiveDataEntityRepositoryImpl.listPopular (the parallel
        Data Entity popularity ranking — uses view_count instead of
        a count-aggregate; need to verify whether paginate INSIDE
        the CTE applies before view_count ORDER BY).
      - Any list-with-ordering-by-aggregate endpoint across the
        codebase. The Stress Protocol's B-category will surface
        these mechanically on subsequent file-analyser passes.

