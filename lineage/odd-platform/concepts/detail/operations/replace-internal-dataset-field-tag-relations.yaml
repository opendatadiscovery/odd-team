security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Gated at the controller perimeter via SecurityConstants.SECURITY_RULES
      (DATASET_FIELD type, DATASET_FIELD_TAGS_UPDATE permission). NO
      @PreAuthorize on the method; the service and repository tiers have
      none — path-based rule is the sole gate, consistent with every
      other dataset-field write rule.
  owner_scoping:
    verdict: RESPECTS
    detail: |-
      DATASET_FIELD_TAGS_UPDATE is a DATA_ENTITY-scoped permission
      evaluated against the dataset field's PARENT data entity (the
      dataset field is a sub-resource of the data entity). A Policy with
      a dataEntity:owner condition scopes tag-edit to owned entities'
      fields. NOTE: granting this permission for a data entity also
      grants tag-edit on ALL of that entity's dataset fields — a
      consequence the Permissions doc does not state.
  strengths:
    - |-
      EXTERNAL / EXTERNAL_STATISTICS relations are protected by the
      origin = INTERNAL delete filter — ingestion-derived tags survive
      a UI replace-all.
    - |-
      The most complete activity-feed audit of the tag-relation trio —
      full before/after tag-list state captured (id + name per tag).
    - |-
      @ReactiveTransactional single boundary — delete + auto-create +
      insert + search-vector refresh + filled-toggle + re-read run
      atomically.
  weaknesses:
    - |-
      MEDIUM — permission side-door — DATASET_FIELD_TAGS_UPDATE mints
      global tag directory rows without TAG_CREATE; WORSE than the
      data-entity sibling because the dataset-field endpoint's OpenAPI
      spec (openapi.yaml:2500) does not even mention the auto-create.
      See the `spec-documented-auto-create-with-scope-asymmetry`
      invariant.
    - |-
      MEDIUM — tags:[] clears all internal dataset-field tags,
      undiscoverably from the spec; the DatasetFieldTagsUpdateFormData
      schema has NO required block.
    - |-
      HIGH under DISABLED — the DATASET_FIELD_TAGS_UPDATE SecurityRule
      is bypassed; anonymous callers can overwrite any dataset field's
      internal tag set and mint directory rows.
    - |-
      MEDIUM — no length / character-set / whitespace validation on the
      tags items — the global tag directory accumulates typos and
      free-text junk.
  cross_file_inconsistencies:
    - |-
      Single contributing sidecar this batch — no cross-file conflict.
      The auto-create side-door matches the existing
      `spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create`
      invariant — same drift class, dataset-field instance, with the
      WORSE property that the spec does not document the auto-create.
  contributing_files:
    - updateDatasetFieldTags.md
  evidence:
    - 'updateDatasetFieldTags.md:security.authorization_assertions'
    - 'updateDatasetFieldTags.md:bugs_limitations_corner_cases (permission side-door; DISABLED bypass)'

performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Runs once per dataset-field tags-panel save on a data entity's
      Structure tab — low frequency.
      odd-platform java DatasetFieldController controller-method:updateDatasetFieldTags
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One dataset field per call; no bulk endpoint. The submitted tags
      array can be arbitrarily long (no maxItems).
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless controller. Concurrent saves of the SAME field interleave
      delete/insert pairs (last-commit-wins replace-all); concurrent
      novel-tag creation races on the tag-directory partial unique index.
  weaknesses:
    - |-
      LOW — delete-then-recreate churns relation rows on EVERY call,
      even a no-op save where the submitted set equals the current one;
      the data-entity sibling diffs and deletes only the removed subset.
    - |-
      LOW — no cap on the tags array size — a very large list materialises
      fully into heap, sends an oversized IN(...) clause, and attempts a
      correspondingly large batched INSERT.
  contributing_files:
    - updateDatasetFieldTags.md
  evidence:
    - 'updateDatasetFieldTags.md:bugs_limitations_corner_cases (delete-then-recreate churn; no maxItems)'
    - 'updateDatasetFieldTags.md:stress_findings.resource_boundaries'

notes: |-
  CAPTURED batch X-TAGGING (2026-05-21). This is a DISTINCT concept
  from `upsert-internal-tag-relations-replace-all` (data-entity path)
  and `replace-all-term-tag-relations` (term path) per the
  conservative-clustering rule — the dataset-field path discards-and-
  rebuilds (vs the data-entity diff), has a three-value TagOrigin
  discriminator (vs the data-entity boolean external / vs the term
  no-discriminator), and carries the most-complete activity audit of
  the trio.

  The CRITICAL untested path (relation INSERT relies on the DB column
  default for origin — P-030) is the highest-leverage probe in the
  tag-relation surface.

  Cross-cutting connections:
    - Pairs with the Tag entity (the directory rows it auto-creates)
    - Sibling of `upsert-internal-tag-relations-replace-all` and
      `replace-all-term-tag-relations` — the three-member tag-relation
      write trio
    - Pairs with `tag-with-internal-vs-external-distinction` (the
      three-value TagOrigin model this operation enforces)
    - Pairs with `spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create`
      (the auto-create side-door, here WORSE because spec-undocumented)
    - Pairs with `tag-creation-as-side-effect-bypasses-tag-create-permission`
      (the EXTERNAL_STATISTICS ingestion path that writes the protected
      dataset-field relations)
