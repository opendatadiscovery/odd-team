    making DATA_ENTITY_DELETE_TERM uncheckable just like

    DATA_ENTITY_ADD_TERM. AuthorizationCustomizer''s fallback at

    `.pathMatchers("/**").authenticated()` (lines 29-30) means any

    authenticated user can DELETE any term-to-data-entity relation

    regardless of Policy. Migration V0_0_76__term_relations_hard_delete

