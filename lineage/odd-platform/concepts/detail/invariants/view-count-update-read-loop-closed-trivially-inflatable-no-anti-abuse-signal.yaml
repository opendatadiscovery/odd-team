mitigations_unimplemented:
- Rate-limit getDataEntityDetails (per-caller, per-entity, per-window)
- Sample the view_count increment (probability 1/N)
- Per-user view-count cap per entity per day
- 'Signal-mix: combine view_count with recency, owner-popularity, alert-state'
- Human-curated popular list override
- CREATE INDEX idx_data_entity_view_count_desc ON data_entity (view_count DESC) WHERE
  hollow = false AND status != <DELETED_id> — partial descending B-tree index on popular-eligible
  rows
- Async batch view-count increment via outbox pattern to relieve row-lock contention
  on popular entities
- Separate counter table or Postgres advisory-counter to decouple write throughput
  from the data_entity row
- '**Batch J — UI-LAYER MITIGATIONS (additive to backend fixes)**'
- 'Fix LSN-017 1-line at DataEntityDetails.tsx:63 — remove details.status?.status
  from the dep-array; reduces UI-driven inflation by 50% (from +2 to +1 per
  page-open). Empirically pinned regression by probe P-004; promoting P-004 to
  a CI-permanent Playwright spec turns it into a regression-pin.'
- 'Debounce fetchDataEntityDetails per (session, entityId) pair — first click
  counts, subsequent clicks within N minutes do not refetch (would close the
  PopularStrip click-loop side of inflation).'
- 'Intercept the Popular-tile click to dispatch an analytics-only thunk that
  does NOT trigger incrementViewCount (would decouple ranking signal from the
  read-as-write side-effect).'
- 'Cache the detail-page mount in Redux so back-and-forward navigation does not
  refire the read (would close the back-button re-fetch surface that compounds
  the loop).'
notes: |-
  Strengthened in batch 2026-05-19J from 3-sidecar to 6-sidecar with three UI-side
  confirmations (DataEntityDetails + fetchDataEntityDetails + PopularStrip). The
  F-001 loop is now empirically pinned end-to-end UI → API → service → SQL with
  two new amplifications:
    (1) LSN-017 doubles UI-driven inflation to +2 per page-open (probe P-004).
    (2) PopularStrip click-loop: the UI surface displaying the ranking is also
        the surface triggering increments on click — closes the loop on the client
        side.

  Combined effect: each Popular-tile click costs the backend +2 view_count UPDATEs
  on the destination entity. Under default config (LOGIN_FORM/OAUTH2/LDAP) this
  is bot-amplifiable; under DISABLED auth, the UI Recommended panel is hidden but
  the API path remains open for anonymous scripted inflation.

  The fix has TWO halves now:
    (a) Backend: rate-limit + index + signal-mix (per batches F/H findings).
    (b) UI: 1-line LSN-017 fix + analytics-only Popular click handler.
  Either half alone halves the inflation surface; both together reduce it
  proportionally and close the read-as-write feedback.
