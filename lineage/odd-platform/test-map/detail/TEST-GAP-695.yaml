proposed_action: |-
  Add `AlertServiceImplGetTotalsTest.getTotals_oneCountQueryFails_zipDelayErrorWaitsForOthers_failsAfterAll_pinsPartialFailureSemantics`. (a) Mockito-style unit test with a mocked `alertRepository`. (b) Stub `alertRepository.countAlertsWithStatusOpen() → Mono.just(10L)`, `alertRepository.countAlertsByOwner(any()) → Mono.just(3L)`, `alertRepository.countDependentObjectsAlerts(any()) → Mono.delay(50ms).then(Mono.error(new RuntimeException("lineage fail")))`. (c) Invoke `alertService.getTotals()`. (d) Verify the test stays subscribed for AT LEAST 50ms (proving `zipDelayError` waits for the failing query). (e) Verify the result is an error (not a partial AlertTotals). (f) Add a `// REGRESSION-PIN — getTotals uses Mono.zipDelayError. One count failure does NOT abort the others — they ALL complete first, THEN the failure propagates. A REFACTOR changing to Mono.zip would short-circuit on first failure, returning fast but losing the partial-state-available trade-off. The current behaviour is defensible (wait for all three to maximise the chance of getting at least the total) but undocumented; this test pins it.` comment block.
