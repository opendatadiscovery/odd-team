- id: H-006
  hypothesis: |
    When an operator POSTs a malformed Policy JSON body (a schema-invalid policy),
    the platform returns a 400 Bad Request with a message describing what is wrong,
    so the operator can correct it.
  derivation: |
    Endpoint-shape — POST /api/policies validates against a JSON-Schema; a user who
    sends invalid input expects a 4xx with the validation detail (the universal REST
    contract). The pillar exposes a JSON editor, reinforcing "the platform validates
    and tells me."
  seed_source: endpoint-shape + doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      PolicyJSONValidator.validate throws IllegalArgumentException("Policy is not
      valid: " + errors) on schema failure (PolicyServiceImpl.java:64,73 ->
      PolicyJSONValidator.java:28-32). ControllerAdvice (ControllerAdvice.java:23-66)
      has handlers for BadUserRequestException->400, NotFoundException->404,
      UniqueConstraintException->400, CascadeDeleteException->400,
      WebExchangeBindException->400, and a catch-all Exception.class->500.
      IllegalArgumentException has NO dedicated handler — it falls through to the
      catch-all and surfaces as HTTP 500 with body "Internal Server Error", NOT 400
      with the validator's detail (PolicyServiceImpl.md bugs[2] + invariants[0]).
      Confirmed as a CLASS issue, already tracked as PLT-076 (the class-wide
      ControllerAdvice IllegalArgumentException->400 handler, which explicitly names
      the Policy JSON validator as a sibling vector).
    evidence:
