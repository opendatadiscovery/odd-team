    sidecar: '(referenced from F-001 batch J + F-003 batch J + F-064)'
    multiplicity_per_trigger: 1
    evidence: |-
      OwnerEntitiesList.tsx:33-114 — once association is approved
      (branch 4), this child fires FOUR data fetches in one useEffect
