name: Pagination parameters declared but unconstrained at spec and controller layers
canonical_in_docs: false
canonical_candidate: true
description: |-
  PageParam and SizeParam in components.yaml:4213-4229 are int32 with no
  minimum, no maximum, no default. Every list endpoint in the catalog
  references these unconstrained params; controllers do not validate (no
  @Min, @Max, @Size annotations). A spec-conformant size=2147483647 is
  permissible; runtime guardrails (if any) live in service/repository
  layers. Cross-cutting weakness named in alert-tag, dataEntity-tag,
  AlertController, DataEntityController, getActivity, getAllAlerts
  sidecars. **STRENGTHENED batch 2026-05-19L** — getDataEntityAlerts adds
  a per-entity-alerts site to the pattern; notable because the audit-export
  workaround named in the live alerting page (WebFetched 2026-05-19)
  AMPLIFIES the risk — operators following the documented workaround will
  naturally use large page sizes to complete exports with fewer round-trips,
  and a misconfigured size=1_000_000 against a high-volume alert entity
  triggers an unbounded query bounded only by Postgres / network buffers.
  **STRENGTHENED batch 2026-05-19M** — FOUR new surfaces in the
  anchor-set-defence audit family: getMyObjectsWithUpstream,
  getMyObjectsWithDownstream, getDataEntityGroupsLineage, and the
  SearchController facets pair (getSearchFacetList + getFiltersForFacet).
  Notable batch-M observations:
    (a) /my/upstream + /my/downstream have NO ORDER BY on listByOddrns
        (ReactiveDataEntityRepositoryImpl.java:247-250) — pagination is
        UNSTABLE across consecutive requests; consecutive page=1 size=5
        and page=2 size=5 may yield overlapping or missing entries even
        without size manipulation;
    (b) /api/dataentitygroups/{id}/lineage has NO pagination at all — the
        full DEG member-graph + edges + per-member metadata is returned
        in one response; no lineage_depth, no expanded_entity_ids, no
        page/size — the response shape is bounded only by the DEG member
        cardinality;
    (c) /api/search/{id}/facet/{type} (getFiltersForFacet) has unbounded
        size at every layer (controller, OpenAPI, repository); deep
        pagination cost grows linearly with page because OFFSET = (page-1) * size
        forces Postgres to scan and discard rows before returning the
        window.
