mitigations_unimplemented:
- |-
  Per the REFACTOR-185 AUTH-MODE-ORTHOGONAL facet mitigations
  enumeration (remove `/ingestion/**` from WHITELIST_PATHS; broaden
  IngestionDataEntitiesFilter; introduce per-endpoint filter subclasses;
  or network-layer controls). All three close this finding.
- |-
  Code-side specific to this endpoint: add a `IngestionReadFilter`
  class binding to `GET /ingestion/entities/**` gated by
  `auth.ingestion.filter.enabled` (or a new property
  `auth.ingestion.read.filter.enabled`). Composes with the existing
  filter pattern without touching the WHITELIST_PATHS structure.
- |-
  Code-side: add a `OddrnFormatValidator` at the read path — currently
  the endpoint accepts any string as the degOddrn path parameter
  (`""`, `"null"`, malformed values all produce 200 with empty items).
  Validating the ODDRN format would surface input errors as 400 and
  reduce the attacker reconnaissance surface.
- |-
  Doc-side: extend the configuration-and-deployment/enable-security/
  authentication/s2s page with the S2S READ-side surface explicitly —
  the page currently covers POST /ingestion/entities and is silent on
  the GET-by-degOddrn complement.
- |-
  Audit-side: add `log.info` invocations + Prometheus counters at the
  read path — currently `IngestionController.java:30` declares
  `@Slf4j` but lines 75-79 have no log call. Composition with the
  `slf4j-annotation-unused-no-audit-trail` finding from this batch.
