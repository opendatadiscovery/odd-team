behaviour: |-
  **The catalog-wide Data Quality Dashboard returns full aggregate test counts + table-health distribution + monitored-tables coverage to any authenticated user — including users with no ownership association anywhere in the catalog.** The endpoint sits behind `.pathMatchers("/**").authenticated()` only (`AuthorizationCustomizer.java:29-30`); `SecurityConstants.SECURITY_RULES` (`SecurityConstants.java:98-355`) has NO entry for `/api/dataqatests/runs` (grep verified 2026-05-25); the downstream SQL has no owner predicate (`ReactiveDataQualityRunsRepositoryImpl.java:65-196` — every condition is filter-derived, none principal-derived).

  **What leaks**:
  - **Catalog-wide test count distribution**: total tests by category × status — useful for risk-assessment + competitive intelligence (which teams have heavy DQ investment, which categories of anomaly are most common).
  - **Table-health distribution**: how many tables are healthy / warning / error platform-wide — operational quality signal across owner boundaries.
  - **Monitored vs unmonitored coverage**: which fraction of TABLE-type entities have ANY DQ test attached — exposes which teams have poor / no DQ practice.
  - **Filter-dimension enumeration**: a 3rd-party API consumer can iterate namespaceIds/datasourceIds/ownerIds/titleIds/tagIds, observing per-filter aggregate response — this is a META-information enumeration vector: a caller can map the platform's test infrastructure (which namespaces have failing tests, which owners are responsible for unhealthy tables) without ever reading a specific entity name.

  **Compound with `auth.type=DISABLED`**: under DISABLED, the dashboard endpoint is ANONYMOUSLY reachable. The full catalog-wide DQ aggregate leaks to anyone on the network. DISABLED is documented as dev-only per the configuration-and-deployment docs, but operators misconfiguring prod see catalog-wide DQ data publicly.

  **Why HIGH**:
  - **Intentional posture, undocumented**: the cross-owner-read posture is consistent with the platform's read-collaborative pillar (ADR-CANDIDATE-003 / REFACTOR-024) — it's a deliberate design choice. But the LIVE doc page (`https://docs.opendatadiscovery.org/features/data-quality/dashboard`) is COMPLETELY SILENT on who can view the dashboard. Operator's mental model doesn't align with platform reality — and the platform doesn't help.
  - **Enumeration vector**: even if the AGGREGATE counts are "harmless", the FILTER-API combined with this endpoint becomes a catalog-mapping tool that bypasses per-entity read gates.
  - **Compound with TEST-GAP-980** (DataEntityRun status_reason PII broadcast): the dashboard tells you WHERE the failing tests are (which owners / namespaces); the runs endpoint tells you WHAT they say (status_reason PII). Together they form a catalog-wide DQ diagnostic enumeration surface.

  No test pins this — neither the posture (no test asserts the dashboard is reachable by non-owner) nor the documentation drift (no test asserts the operator can opt into restriction).
