expected_outcome: |
  STRESS_E1 PROBE: pin the runtime interaction between a long-running getActivity
  read and the partition-creation DDL.

  CREATE TABLE ... PARTITION OF activity takes ACCESS EXCLUSIVE on the parent activity
  table for the duration of the statement (PartitionServiceImpl.java:60-66). A
  concurrent reader either:
  (a) blocks on the lock until DDL completes (typical PG behaviour), then proceeds
      with the new partition visible
  (b) the DDL waits for the reader's transaction to complete (if reader started first)
  (c) PG cancels one of them under a lock_timeout / deadlock_timeout setting

  This probe verifies the actual behaviour by:
  1. Starting a long-running getActivity call (size=Integer.MAX_VALUE, wide window)
  2. From a sibling connection, invoking a manual CREATE TABLE PARTITION DDL
     (simulating what PostgreSQLPartitionCreationJob does at boot/nightly)
  3. Observing the wall-clock latency of each, and whether one blocks the other,
     and whether either fails

  The probe is INFORMATIONAL — it characterises the system's actual concurrent-DDL
  behaviour for documentation purposes. The result feeds into the F-010 + F-021
  feature-flow narrative on partition lifecycle.

triggers:
  - PartitionServiceImpl.java:60-66 — CREATE TABLE ... PARTITION OF (ACCESS EXCLUSIVE)
  - ReactiveActivityRepositoryImpl.java:290-292 — read query with no lock hint
  - PostgreSQLPartitionCreationJob.java:30-43 — boot + nightly cron triggers

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (3017, '//probe-source-P-017/db', 'probe-source-P-017')
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      INSERT INTO data_entity (id, oddrn, external_name, data_source_id, type_id,
                               view_count, source_created_at, source_updated_at)
      VALUES (3017, '//probe-source-P-017/db/tables/p017_entity', 'p017_entity',
              3017, 1, 0, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # ~10k activity rows so the scan takes measurable wall-clock time.
  - kind: sql
    query: |
      INSERT INTO activity (data_entity_id, event_type, created_at, created_by,
                            old_state, new_state)
      SELECT 3017, 'BUSINESS_NAME_UPDATED',
             NOW() - (interval '1 second' * gs),
             'p017_user',
             '{"oldName": "before"}'::jsonb,
             '{"newName": "after"}'::jsonb
      FROM generate_series(1, 10000) AS gs

act:
  # Task A: long-running getActivity. ~hundreds of ms under typical conditions.
  - kind: parallel
    tasks:
      - kind: rest
        method: GET
        path: /api/activity?begin_date=2024-01-01T00:00:00Z&end_date=2030-12-31T23:59:59Z&size=10000
        capture_as: response_long_read
        timing: true

      # Task B: parallel CREATE TABLE PARTITION DDL, simulating a partition-creation
      # job firing during a UI-driven scan. Give A a 100ms head start.
      - kind: sql
        delay_ms: 100
        query: |
          CREATE TABLE IF NOT EXISTS activity_p017_test PARTITION OF activity
            FOR VALUES FROM ('2099-01-01') TO ('2099-12-31')
        capture_as: ddl_outcome
        timing: true

observe:
  - kind: jsonpath
    from: response_long_read_status
    path: "$"
    capture_as: status_read
  - kind: jsonpath
    from: response_long_read_timing
    path: "$.elapsed_ms"
    capture_as: elapsed_read

  - kind: jsonpath
    from: ddl_outcome_status
    path: "$"
    capture_as: ddl_status
  - kind: jsonpath
    from: ddl_outcome_timing
    path: "$.elapsed_ms"
    capture_as: elapsed_ddl

oracle:
  # Both complete successfully.
  - "status_read == 200"
  - "ddl_status == 'OK'"

  # CHARACTERISATION — record the interaction shape, do not assert a specific
  # serialisation outcome. If elapsed_read + elapsed_ddl ≈ wall_clock, they
  # blocked each other; if max(elapsed_read, elapsed_ddl) ≈ wall_clock, parallel.
  - "elapsed_read > 0"
  - "elapsed_ddl > 0"

cleanup:
  - kind: sql
    query: |
      DROP TABLE IF EXISTS activity_p017_test
  - kind: sql
    query: |
      DELETE FROM activity WHERE data_entity_id = 3017
  - kind: sql
    query: |
      DELETE FROM data_entity WHERE id = 3017
  - kind: sql
    query: |
      DELETE FROM data_source WHERE id = 3017
  - kind: docker-compose-down
    destroy_volumes: true

