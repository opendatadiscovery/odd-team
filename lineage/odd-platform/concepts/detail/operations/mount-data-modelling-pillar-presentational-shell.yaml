description: |-
  NEW OPERATION, batch ZL (2026-05-26) — DataModelling.tsx
  (`components/DataModelling/DataModelling.tsx`, 17 lines) is the
  Data Modelling pillar root mounted at `App.tsx:74` with
  `<Route path='/data-modelling/*' element={<DataModeling/>}/>`
  (note the typo'd local alias `DataModeling` — single L — vs the
  pillar's canonical double-L spelling). It is purely
  presentational: NO `useState`, NO `useEffect`, NO `useDispatch`,
  NO permission check, NO data fetch. A single JSX expression
  composing `<S.LayoutContainer>` containing `<S.Sidebar>` (with
  `<DataModellingTabs/>`) + `<S.Content>` (with `<DataModellingRoutes/>`).

  THE OPERATION ANATOMY:

    Step 1 — Layout composition (DataModelling.tsx:7-14):
      Renders the platform-wide 'page-with-vertical-sidebar' shell
      shared with Alerts.tsx, Activity.tsx, Management.tsx, etc.
      The shell is defined in `components/shared/styled-components/
      layout.ts:3-31`:
        - LayoutContainer: display:flex, padding:2, gap:2,
          overflow:auto, height: calc(100lvh - 3rem) (the 3rem
          subtracts the AppToolbar height per `lib/constants.toolbarHeight`)
        - Sidebar: max-width:15rem, $alignSelf='flex-start',
          $position='sticky' (follows scroll within the content
          viewport)
        - Content: flex-grow:1 (fills remaining space)

    Step 2 — Tab selection delegation (DataModelling.tsx:9):
      `<DataModellingTabs/>` is the child responsible for
      rendering the vertical-tabs menu. Per
      DataModellingTabs.tsx:11-23 the menu has EXACTLY TWO tabs:
        - Query Examples (link: queryExamplesPath() →
          /data-modelling/query-examples)
        - Relationships (link: relationshipsPath() →
          /data-modelling/relationships)
      ERD is NOT a peer tab at this layer — it is a SUB-tab WITHIN
      Relationships at RelationshipsTabs.tsx:14-15 (ALL/ERD/Graph
      as type query-param values). The tab-selection state is
      driven by `useSetSelectedTab` (useSetSelectedTab.ts:9-15)
      which reads `useLocation().pathname` and bidirectionally-
      substring-matches against the `link` field of each tab.

    Step 3 — URL routing delegation (DataModelling.tsx:12):
      `<DataModellingRoutes/>` is the child responsible for the
      inner Routes. Per DataModellingRoutes.tsx:13-43 the routes
      are:
        - '' (index): `<Navigate to='query-examples' />` —
          redirect-convention case per `bare-base-url-behavior-
          divergence-redirect-vs-blank` invariant
        - 'query-examples': wrapped in `<WithPermissionsProvider
          allowedPermissions={[QUERY_EXAMPLE_CREATE]}>` — context-
          only, does NOT block render
        - 'query-examples/:queryExampleId': wrapped in
          `<WithPermissionsProvider allowedPermissions=
          {[QUERY_EXAMPLE_UPDATE, QUERY_EXAMPLE_DELETE]}>` —
          every() AND-semantics, also context-only
        - 'relationships': bare, NO wrapper at all
      All three inner routes are FURTHER lazy-loaded.

    Step 4 — Lazy-load coupling (App.tsx:40):
      `const DataModeling = lazy(() => import('./DataModelling/
      DataModelling'))` declares the lazy import; the chunk fetch
      happens on first visit to `/data-modelling/*`. AppSuspenseWrapper
      at App.tsx:58 provides the Suspense boundary.

  AUTHORISATION POSTURE:
    The component itself has NO permission check, NO route guard.
    The route mount at App.tsx:74 has NO `WithPermissionsProvider`
    wrapper. The two inner `WithPermissionsProvider` wrappers inside
    `DataModellingRoutes` are CONTEXT-SEEDS only — they do NOT block
    rendering (per `withpermissionsprovider-context-seed-not-route-
    gate` invariant). Per-action gating happens at the leaf-button
    layer:
      - QueryExamples.tsx:36-46 — `<WithPermissions
        permissionTo={QUERY_EXAMPLE_CREATE}>` wraps the Add button
        (DOES gate)
      - QueryExampleDetailsContainerActions.tsx — wraps Edit/Delete
        buttons
      - Relationships subtree has ZERO permission gates at any layer
        (RelationshipController has no @PreAuthorize, per batch ZE
        sidecar)

  CROSS-OPERATION RELATIONSHIPS:
    - Pairs with `entitie:data-modelling-pillar-root-layout-shell`
      (the entity this operation constructs).
    - Pairs with `invariant:withpermissionsprovider-context-seed-not-route-gate`
      (the wrappers in DataModellingRoutes are subject).
    - Pairs with `invariant:bare-base-url-behavior-divergence-redirect-vs-blank`
      (DataModelling /data-modelling → /data-modelling/query-examples
      is one of the redirect-convention cases).
    - Pairs with `invariant:data-modelling-erd-is-sub-tab-not-peer-relationships-sub-view`
      (the layered tab hierarchy at this pillar).
    - Pairs with `operation:list-query-examples` (the default tab
      content) + `operation:get-erd-or-graph-relationship-by-id`
      (the secondary tab content).

  CROSS-BATCH COHERENCE:
    The platform-wide 'sticky vertical sidebar + content shell'
    pattern (consumed via S.LayoutContainer/Sidebar/Content from
    layout.ts) is SHARED with Alerts.tsx, Activity.tsx, Management.tsx,
    DataQuality.tsx, LookupTables.tsx. DataModelling.tsx is the
    SIMPLEST instance because it has NO state and NO effects — pure
    composition. Refactoring the layout.ts shell affects every
    pillar simultaneously (single source of truth).
