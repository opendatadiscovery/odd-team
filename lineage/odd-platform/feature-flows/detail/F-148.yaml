control_summary: |-
  0 of 8 cells PROBED. F-148 anchors the 9-tab class-filter strip as a
  distinct UX surface from F-017's 7-facet sidebar. The headline finding
  is the string/numeric mixed-payload dispatch (drift facet 1) — a class
  of bug specific to this tab vs the 7 sidebar facets which all dispatch
  numeric-id payloads. The 7-facet finding count is preserved on F-017;
  this tab is the 8th UX-surface but writes the SAME entityClasses facet
  + possibly the myObjects boolean field — confusion over which.

  Status: ui-incomplete. UI half is at primary source for all 8 drift
  facets. The backend interpretation of string facet payloads ('all' /
