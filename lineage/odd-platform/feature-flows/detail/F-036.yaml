observed_vs_expected:
  facets:
  - facet_id: free_text_auto_create_no_normalisation_silent_policy_leak
    drift_class: dimension_table_admits_duplicates_under_case_whitespace_drift
    severity: MEDIUM
    observed: "title.name varchar(128) UNIQUE — no @Pattern, no @Size, no normalisation\n(case-folding, trimming, slug-deduping). Two operators typing slightly\ndifferent forms ('Data Steward', 'data\
      \ steward', 'DATA STEWARD',\n' Data Steward ', 'data-steward') accumulate as DISTINCT rows. A Policy\ncondition `dataEntity:owner:title == 'Data Steward'` silently misses\nevery other-casing variant."
    evidence: 'V0_0_3__add_ownership.sql:1-8 + TitleServiceImpl.java:19-22 +

      OwnerTitleAutocomplete.tsx:43-48 (free-text input).'
  - facet_id: concurrent_get_or_create_race_usr003_400_not_409
    drift_class: read_then_insert_race_no_on_conflict_handler
    severity: LOW
    observed: "TitleServiceImpl.java:19-22 `getByName.switchIfEmpty(create)`; two\nparallel owner-grants typing the SAME brand-new title both observe\nempty + both attempt create → one wins, the other hits\nTITLE_NAME_UNIQUE → UniqueConstraintException → HTTP 400 USR003.\nOwnershipServiceImpl's @ReactiveTransactional boundary rolls back the\nentire ownership-grant on the losing side."
  - facet_id: size_unbounded_caller_controlled_pagination_amplification
    drift_class: unbounded_pagination_request_param_amplification
    severity: MEDIUM
    observed: 'Integer size flows verbatim to paginate(...).limit(size). No Math.min,

      no @Max, no controller-level validator.'
  - facet_id: autocomplete_30_row_window_invisibility_for_titles_past_position_30
    drift_class: server_side_id_asc_window_clipping_invisible_to_client_filter
    severity: LOW
    observed: 'Server returns 30 OLDEST non-deleted matching titles in id ASC order;

      UI''s MUI createFilterOptions re-filters within those 30 client-side.

      Titles older than the 30-row window are INVISIBLE to autocomplete

      regardless of relevance to typed query.'
  - facet_id: no_canonical_doc_for_title_concept
    drift_class: doc_silent_on_load_bearing_authorization_dimension
    severity: MEDIUM
    observed: 'Live /configuration-and-deployment/enable-security/authorization/policies

      cites :owner:title as a condition field but never explains where the

      title vocabulary comes from, that any authenticated user can mint a

      new title by typing one into an ownership form, or that the directory

      is unbounded + case-sensitive.'
