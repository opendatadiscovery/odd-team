behaviour: |-
  **`updateInternalName` has ZERO test coverage at all — including the load-bearing empty-to-null normalisation and the silent-no-op-vs-404 contract.** Line 85: `bare DSL.update(DATASET_FIELD).set(INTERNAL_NAME, StringUtils.isEmpty(internalName) ? null : internalName).where(ID.eq(id)).returning()`. Same shape as `updateDescription` (line 75) but with NO test (the existing test covers only `updateDescription`). The empty-to-null normalisation is significant because (a) downstream consumers including the activity-feed mapper, the FTS index, and the UI's filled-flag tracking treat NULL and empty-string differently; (b) a maintainer "improving" the API to accept whitespace-trimmed empty strings might re-introduce the empty-string-as-empty-string path; (c) the operator's intent of "clear this name" must round-trip as NULL, not "". Also untested: BOTH methods return `Mono.empty()` for unknown ids — NO `NotFoundException` at this repository layer. The service layer's `DatasetFieldServiceImpl.updateInternalName` line 104 does `.switchIfEmpty(Mono.error(new NotFoundException(...)))` — good. But `DatasetFieldServiceImpl.updateDescription` lines 87-95 does NOT switchIfEmpty before delegating — verify the downstream service's contract. If the chain completes empty for an unknown id, the API returns 200 OK with an empty body. UX gap.
