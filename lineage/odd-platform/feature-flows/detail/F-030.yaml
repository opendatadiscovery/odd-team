terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Two divergent terminal effects gated by `metrics.storage`:
    (a) INTERNAL_POSTGRES (default) — writes to `metric_series` +
    `metric_point` + `metric_family` + `metric_label` + `metric_label_value`
    + `metric_entity` Postgres tables (per jooq-generated POJO imports
    at InternalIngestionMetricsServiceImpl.java:39-44). All writes
    inside one `@ReactiveTransactional`.
    (b) PROMETHEUS — writes Prometheus-shaped TimeSeries via
    Snappy-compressed Protobuf POST to
    `${metrics.prometheus-host}/api/v1/write` (ExternalIngestionMetricsServiceImpl.java:202-220).
    ODD-side bookkeeping writes (`external_metric_last_value` upserts
    on Postgres) are inside the @ReactiveTransactional boundary; the
    Prometheus WebClient call is OUTSIDE the transaction.
  evidence: |-
    InternalIngestionMetricsServiceImpl.java:1-295 +
    ExternalIngestionMetricsServiceImpl.java:54-220 + IngestionController.java:89-95
    + CounterTimeSeriesExtractor.java:22-25 (extractor-tier tenant-id
    coupling) + live `configuration-and-deployment/odd-platform` doc
    WebFetched 2026-05-20 status 200 ("INTERNAL_POSTGRES (default)" +
    "PROMETHEUS — metrics are remote-written").
  cardinality_per_call: |-
    INTERNAL_POSTGRES path: O(N×M) rows where N=number of MetricSet
    items and M=number of MetricFamily records per item. PROMETHEUS
    path: one Snappy-compressed protobuf `WriteRequest` per call.
    Both bounded upstream by the 20MB `spring.codec.max-in-memory-size`
    buffer cap (application.yml:14-15).
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — primary-source in batch Z ingestMetrics sidecar. Per-call
  amplification is 1: one MetricSetList payload → one transaction →
  N+M storage writes (well-bounded). No reactive fan-out, no retry
  on Prometheus failure. The DEEPER amplification is the cumulative
  cardinality blast — labels propagated verbatim means a malicious
  caller can flood the Postgres metric_label_value table or the
  Prometheus series namespace with arbitrary cardinality. No
  cardinality cap exists at the platform tier.
