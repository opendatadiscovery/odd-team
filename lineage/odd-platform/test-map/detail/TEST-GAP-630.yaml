behaviour: |-
  **AlertManagerRequest INNER DTO SILENTLY DROPS WIRE FIELDS — `status: resolved`, `endsAt`, `annotations`, `fingerprint`, `groupKey` etc.** AlertManagerController.java:28-32 declares an INNER static DTO `AlertManagerRequest` with ONE field (`List<ExternalAlert> alerts`); `ExternalAlert.java:9-15` declares THREE fields (`labels: Map<String, String>`, `generatorURL: URI`, `startsAt: LocalDateTime`). The AlertManager v2 webhook wire format includes far more fields: `status` (firing | resolved), `endsAt`, `annotations`, `fingerprint`, `groupKey`, `groupLabels`, `commonLabels`, `commonAnnotations`, `externalURL`, `version`, `receiver`. ALL are silently dropped by Jackson on deserialisation. The MOST OPERATIONALLY-IMPACTFUL drop is `status: resolved` — the live doc-side `/features/active-platform-features/alerting` (refreshed 2026-05-20 status 200) documents that AlertManager-driven alerts CANNOT be auto-resolved on receipt of `status: resolved`, because the platform never sees the field. Operators reading the AlertManager docs reasonably expect the platform to auto-close alerts when Prometheus signals resolution; the platform silently ignores the field. NO test pins the silent-drop contract. Plus the controller has a `// TODO: define OpenAPI spec based on alert provider contract` comment (AlertManagerController.java:20) signalling the DTO contract is unfinished — any future OpenAPI-contract migration that renames `alerts` to a contract-generated `payload` field would not be caught at build time. This is the F-007 `no_openapi_contract` implicit_adr drift facet.
