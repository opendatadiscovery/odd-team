  Testcontainers integration test (schema-invariant pin). (a) Insert an Activity row via `dataSource.r2dbc().sql("INSERT INTO activity (id, event_type, old_state, new_state, is_system_event, created_at, created_by, data_entity_id) VALUES (?, 'ROLE_CREATED', '{}', '{}', false, NOW(), 'admin', NULL)").bind(...)`. Assert: SQLSTATE 23502 (not-null-violation) raised. (b) Variant — set `data_entity_id = 99999999` (non-existent FK). Assert: SQLSTATE 23503 (foreign-key-violation). (c) Pin that the table's design REQUIRES a real data_entity_id. (d) Add a `// SCHEMA INVARIANT: this test confirms the activity table cannot record non-data-entity events. To extend audit coverage to RBAC / Owner / Datasource mutations, a separate audit table is required. See concepts/index.yaml entry audit-log-presence-asymmetry-2-tier-audit-story.` comment block at the test top.
