expected_outcome: |
  Stress question (Category B / E): TagServiceImpl.delete refreshes search
  vectors ASYMMETRICALLY vs update. update() calls updateSearchVectors() which
  Mono.zips THREE refreshes — search_entrypoint.tag_vector (data-entity FTS),
  search_entrypoint structure vector, and term_search_entrypoint.tag_vector
  (TagServiceImpl.java:161-167). delete() calls only
  reactiveTermSearchEntrypointRepository.updateChangedTagVectors(tagId) — ONE
  refresh (TagServiceImpl.java:68-69). TWO hypotheses to pin:
  (H1) After delete, the data-entity-side search_entrypoint.tag_vector still
  contains the deleted tag's name token (the main search-entrypoint vector is
  never refreshed on the delete path), so a global search for the deleted tag
  name still surfaces the previously-tagged data entities until an unrelated
  data-entity write refreshes that row.
  (H2) The single term-side refresh that DOES run executes AFTER
  deleteTermRelations(tagId) has already hard-deleted the tag_to_term rows
  (delete chain: line 64 zip, line 68 refresh). ReactiveTermSearchEntrypoint
  RepositoryImpl.updateChangedTagVectors queries `TAG_TO_TERM WHERE TAG_ID =
  tagId` (line 141-144) to find which terms to re-index — but those rows are
  gone, so the CTE is empty and ZERO term rows are re-indexed. The deleted
  tag's name therefore also lingers in term_search_entrypoint.tag_vector for
  any term it was attached to.
