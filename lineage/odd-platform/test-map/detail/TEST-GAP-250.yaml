behaviour: 'Postgres `to_tsquery` syntax-error vector — `JooqFTSHelper.tsQuery` (lines
  164-168) splits the inbound query string on a single space character, appends `:*`
  to each non-empty token, joins with `&`, and passes the joined string verbatim into
  `to_tsquery(?)` (lines 103, 158). A user query containing `tsquery`-meaningful metacharacters
  not separated by a space (`foo!bar`, `foo|bar`, `(foo)`, `a<->b`, `foo:`, unbalanced
  `(`) yields a malformed `to_tsquery` argument and Postgres raises `syntax error
  in tsquery: ...` surfacing as 500. Conversely, a balanced `tsquery` expression silently
  re-interprets as that expression (operator chaining, prefix-globbing via `:*` is
  user-controllable). No input sanitisation, no escape of metacharacters, no error
  mapping. `SearchFormData.query` carries no `@Size`/`@Pattern`/max-length constraint.
  STRENGTHENED batch M — the SearchController#facets sidecar confirms the SAME unescaped
  code path is invoked by FOUR ADDITIONAL facet aggregator call sites (entity-class
  facet at ReactiveSearchFacetRepositoryImpl.java:182, type facet at 267, owner facet
  at 469, tag facet at 582 — ALL call ftsCondition(SEARCH_ENTRYPOINT.SEARCH_VECTOR,
  state.getQuery())). Combined with TEST-GAP-519 (cross-user session hijack), an
  attacker can permanently POISON another user''s session with a single PUT containing
  `query = foo ) | (bar` — every subsequent facet read on the session 500s. The persistence
  of the malformed query in search_facets.query_string is the additional risk vector
  the facets endpoints surface — the /search endpoint malforms transiently, the facet
  endpoints malform persistently. Cross-pillar P-01+P-09. Criticality remains HIGH;
  the facet endpoints multiply the attack surface 4x. See TEST-GAP-520 for the dedicated
  regression-pin proposal at the facet endpoint surface.'
