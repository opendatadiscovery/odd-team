- id: H-003
  hypothesis: "When an operator scales ODD Platform to N replicas on a default PostgreSQL (`max_connections=100`), the platform's own connection demand stays within the database's connection budget with headroom for collectors and admin tooling."
  derivation: "P-08 operator-config mission + the metadata-store architectural pillar ('Single PostgreSQL database … No Elasticsearch/Solr/Neo4j') implies the platform's DB sizing is a first-class operator concern with sane defaults."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      At the shipped default of 20 connections/replica (H-002), a 5-replica deployment reserves up to
      100 PostgreSQL connection slots from the two R2DBC pools ALONE — exactly PostgreSQL's default
      `max_connections=100`. There is zero headroom: the HikariCP `DataSource` (DataSourceConfiguration)
      for Flyway/ShedLock/sync `@Transactional` paths and the `PGConnectionFactory` direct connections
      (HousekeepingJobManager, leader election) consume ADDITIONAL slots beyond the two R2DBC pools (per
      sidecar performance.resource_allocation + coupling). Collectors push over `/ingestion/*` (separate
      HTTP, but the platform-side write still borrows from the primary pool) and any psql / BI / migration
      session needs its own slot. The docs provide no sizing table relating replica-count to a recommended
      PostgreSQL `max_connections`.
    evidence:
      - sidecar: "R2DBCConfiguration"
        section: "performance.resource_allocation"
        cite: "R2DBCConfiguration.java:27,54 + DataSourceConfiguration.java:17-27 + PGConnectionFactory.java:18-42"
        note: "2 x maxSize per replica from R2DBC + HikariCP + PGConnectionFactory all draw from the same PG max_connections budget; 5 replicas x 20 = 100 at PG default 100."
      - sidecar: "R2DBCConfiguration"
        section: "performance.scaling_characteristics"
        cite: "R2DBCConfiguration.java:22 (stateless @Configuration — horizontal scaling = more pools at the DB)"
        note: "Each replica multiplies the pool count; nothing caps the aggregate against PG's ceiling."
    operator_visible_failure: |
      An operator following ODD's 'run Postgres and nothing else' simplicity story scales to 5 replicas
      for HA/throughput and the platform begins throwing `FATAL: sorry, too many clients already` — OR
      collectors silently fail to write because the platform's own pools have exhausted PostgreSQL's slots.
      The failure surfaces at scale-up, is intermittent (depends on concurrency), and gives no in-app signal
      (no pool gauge — H-008). The operator's natural debugging path (the deployment docs) contains no
      sizing guidance to relate replica count to `max_connections`, so the diagnosis requires PostgreSQL-side
      expertise the docs do not prompt for.
    severity: HIGH
