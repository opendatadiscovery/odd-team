- id: H-008
  hypothesis: |-
    Under DISABLED, the synthetic admin's `permissions` list includes the resource-scoped
    permissions (DATA_ENTITY_*, TERM_*, etc.) — so resource-gated UI controls (per-entity
    delete/edit) unlock globally, exactly as the management-tier ones do.
  derivation: |-
    dummyOwner uses Permission.values() (the entire enum), whereas the authenticated path
    only populates globalPermissions from the MANAGEMENT (non-contextual) extractor.
    Cross-layer naming/behavior seed.
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |-
      The DISABLED dummy puts the ENTIRE Permission enum into the identity.permissions list,
      including resource-contextual permissions (IdentityController.java:32, Permission.values()).
      The authenticated path, by contrast, populates globalPermissions ONLY from the
      MANAGEMENT non-contextual extractor (IdentityServiceImpl.java:42 →
      ManagementPermissionExtractor) — resource-contextual permissions are resolved
      per-entity through resource extractors and arrive via getResourcePermissions, NOT via
      globalPermissions. So the DISABLED dummy's globalPermissions is structurally BROADER
      than any authenticated user's globalPermissions could ever be: it grants
      resource-contextual permissions globally via the global list. PARTIAL because the UI
      effect (every control unlocks) holds, but the MECHANISM differs from the authenticated
      path in a way the user/maintainer would not expect from the symmetric-looking response
      shape.
    evidence:
      - source_read_for_validation: true
        cite: "odd-platform-api/.../controller/IdentityController.java:32"
        note: "Permission.values() = full enum incl. resource-contextual perms"
      - source_read_for_validation: true
        cite: "odd-platform-api/.../service/IdentityServiceImpl.java:42"
        note: "authenticated globalPermissions from MANAGEMENT extractor only"
      - source_read_for_validation: true
        cite: "odd-platform-ui/src/redux/selectors/profile.selectors.ts:22-28"
        note: "getResourcePermissions is a SEPARATE path from getGlobalPermissions"
    operator_visible_failure: |-
      A maintainer reasoning about the permission model from the authenticated path would
      assume globalPermissions never contains resource-contextual permissions — and might
      write a UI gate or a test on that assumption. Under DISABLED that assumption breaks
      (globalPermissions contains everything), so a control that relies on the
      global-vs-resource split behaves differently under DISABLED than under a real mode in
      a way not captured by "every control unlocks".
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

