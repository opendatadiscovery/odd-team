behaviour: '`getLineage` with `lineageDepth=0` — the resulting `LineageDepth.of(0)`
  produces a CTE where `tDepth.lessThan(0)` is FALSE on iteration 1, so the recursive
  step never fires and only the seed (depth-1 edges) is returned. The behavioural
  contract here is not pinned; a regression that changed `.lessThan` to `.lessThanOrEqual`
  would silently shift this from ''one-hop'' to ''no edges''. Closely related to TEST-GAP-328
  (LineageDepth.empty() folklore at the repository tier) and TEST-GAP-329 (LineageDepth.of(0)
  at repository); this is the service-tier pin.'
