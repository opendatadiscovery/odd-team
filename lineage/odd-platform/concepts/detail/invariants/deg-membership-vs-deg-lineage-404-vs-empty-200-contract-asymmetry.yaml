- |-
  Per the directional-remedy enumeration in the description. Maintainer's
  call between (a) align S2S to UI / (b) align UI to S2S / (c) document
  the asymmetry. All three close the contract-shape gap.
- |-
  Doc-side: in developer-guides/api-reference, surface the asymmetry
  at the DEG-membership and DEG-lineage operations explicitly — a
  one-line contract caveat on each operation naming the empty-vs-404
  contract on that operation, with a cross-link to the sibling.
- |-
  Test-side: add a regression test pinning the current contract on
  both endpoints — get-by-deg-oddrn with an unknown ODDRN → 200 + [];
  get-deg-lineage with an unknown DEG id → 404. The contract pair is
  locked against silent change in either direction.
