proposed_action: |-
  Unit test on both Azure and Cognito handlers. (a) Invoke handle() with valid provider config. (b) Parse the response Location URL. (c) Assert NO `state` query parameter is present. (d) Pin the current omission across both handlers. Future REFACTOR adding `state` flips the assertion AND requires verification that the same `state` is checked at the post-logout-redirect re-entry.
