name: Lineage Graph Traversal
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-05
description: |-
  **NEW CONCEPT, batch 2026-05-12F** — the platform's lineage-graph read interface.
  `GET /api/dataentities/{id}/lineage/downstream` (sibling `/upstream`) returns the
  FULL reachable lineage subgraph from a rooted data entity, walked via a single
  Postgres `WITH RECURSIVE` CTE (`ReactiveLineageRepositoryImpl.java:122-176`). Two
  client-driven inputs control the traversal: `lineage_depth` (recursion depth bound)
  + `expandedEntityIds` (depth-1 fan-out around selected nodes for UI progressive
  expansion). Edges are persisted as `LineagePojo` rows in the `lineage` table.
  **Batch H** adds the SQL primary-source persistence layer with 11 public methods +
  1 private CTE-assembly helper. The CTE is a hand-written `WITH RECURSIVE` walking
  from a root oddrn set for at most `lineageDepth.getDepth()` hops in the chosen
  direction. The depth bound is the **only** recursion terminator — no visited-set
  guard, no Postgres `WITH ... CYCLE` clause, no upper cap on the depth value.
  Soft-delete is canonical: every read filters `IS_DELETED.isFalse()` (7 sites);
  only hard-delete path is ingestion's rewrite-by-establisher. The `lineage` table
  has NO owner column. **Batch J — UI HALF (P-05 pillar)**: the UI surface that
  renders the lineage graph is the `<Lineage />` component family at
  `odd-platform-ui/src/components/DataEntityDetails/Lineage/` — comprising `Lineage.tsx`
  (route-dispatch shell choosing DEGLineage vs HierarchyLineage based on isDEG flag),
  `HierarchyLineage.tsx` (sequential downstream-then-upstream fetch driver), and
  `LineageGraph.tsx` (the SVG render canvas using `d3-hierarchy`). **Critical
  invariants surfaced at the UI**: (1) the UI ALWAYS sends `lineageDepth=d` even
  when URL omits `?d=` (defaultLineageQuery.d=1 at constants.ts:77) — the F-005
  NPE on null lineage_depth is unreachable from the UI but the choice of 1 gives an
  artificially shallow first impression; (2) `d3-hierarchy.hierarchy()` builds a
  TREE not a DAG — diamond shapes (A→B→D, A→C→D) render D TWICE, amplifying
  REFACTOR-202 into the UI; (3) `crossEdges` resolution silently drops edges whose
  endpoints aren't materialised in the tree (generateGraph.ts:81-95) — a backend
  payload skew loses lineage edges invisibly; (4) URL is the source of truth for
  view state — depth `d`, full-names `fn`, view-mode `full`, expand-all-groups
  `eag`, transform matrix `t`, and 4 expansion-id arrays all live in the query
  string; (5) `lineageDepth=1` LoadMore expansion is depth-1 fan-out + slice
  monotonic accumulation with no collapse affordance; (6) click-through preserves
  URL params bag with `d: node.depth || 1` — clicking deep into a graph and
  navigating opens a NEW view with `d=clicked node's depth` (compounds REFACTOR-202
  cost); (7) **anchor-set defence-in-depth NOT used at the UI** — fetches use
  `/api/dataentities/{id}/lineage/{downstream|upstream}` (the NEGATIVE case of
  REFACTOR-225/237), NOT the owner-scoped `/my` variant; the user-observable
  consequence of REFACTOR-203 is realised at this canvas. **Eight UI-side
  bugs/limitations**: diamond DAG amplification, no upper bound on `?d=` URL param
  (curious user can pass `?d=10000`), silent crossEdge drops, LoadMore monotonic
  accumulation, sequential fetch fragility under partial failures, useEffect deps
  mismatch (renderedNodes vs renderedLinks), upstream/downstream highlight
  asymmetry, microservices lineage rendered by same component with no mode toggle.
