- id: H-002
  hypothesis: |-
    When a Cognito-authenticated user clicks Logout, the access + refresh tokens
    Cognito issued are revoked at AWS, so a stolen/copied token cannot continue to
    be used against Cognito-protected resources after the user has logged out.
  derivation: |-
    Negative-space + response-shape: an enterprise OAuth2 provider's "Logout" is
    expected to revoke; Cognito documents an /oauth2/revoke endpoint, so the user
    expects parity with Google/GitHub.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      CognitoLogoutSuccessHandler.java:33-50 redirects to Cognito's /logout (which only
      drops the User Pool session cookie) and invalidates the local Spring WebSession.
      It does NOT call Cognito's /oauth2/revoke endpoint — which AWS documents as
      available on every User Pool. The access token (default ~1h) and refresh token
      (up to 90 days) remain valid at AWS until natural TTL. This is a platform CHOICE,
      not a protocol limit — Google/GitHub siblings show revocation is achievable; the
      one-line difference is the absent /revoke POST.
    evidence:
      - sidecar: odd-platform__java__auth__logout__CognitoLogoutSuccessHandler.md
        section: bugs_limitations_corner_cases[3] + security.known_security_gaps[0]
        cite: "CognitoLogoutSuccessHandler.java:33-50 (no /revoke) + GoogleLogoutSuccessHandler.java:43-54 (contrast)"
        note: "Handler tail invalidates session only; no outbound revoke."
      - sidecar: WebFetch
        section: oauth2-oidc live page
        cite: "Cognito … does not call /oauth2/revoke; residual ~1h access + up to 90d refresh"
        note: "Doc now confirms the code behaviour."
    operator_visible_failure: |-
      (1) A user on a shared/public workstation clicks Logout, sees the login page, and
      reasonably believes their session is dead everywhere — but a token captured before
      logout (non-HttpOnly localStorage copy, MITM, OS-keychain export) keeps working
      against any Cognito-protected downstream resource for up to ~1h (access) and up to
      90 days (refresh). (2) Incident response cannot rely on "force all users to log
      out" to contain a token compromise on Cognito deployments — the tokens survive.
      (3) The asymmetry vs Google/GitHub is invisible: the same Logout button gives a
      strictly weaker guarantee with no signal.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: |-
    When an Azure-authenticated user clicks Logout, the Azure-issued tokens are
    revoked at the IdP, matching the revocation guarantee a user would assume from
    the GitHub/Google behaviour.
  derivation: |-
    Negative-space: a user assumes "Logout" means full token revocation regardless
    of provider; the response-shape promise of the single button is uniform.
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      AzureLogoutSuccessHandler.java:31-48 redirects to the Azure end-session endpoint
      and invalidates the local WebSession, with NO revocation call. UNLIKE Cognito, this
      is partly forced: Azure AD v2.0 does not expose an RFC-7009 token-revocation
      endpoint, so even attempting revocation would 404 (Azure sidecar implicit_adrs[0],
      doc confirms "Azure AD v2.0 does not expose RFC 7009 token revocation"). The
      end-session redirect DOES invalidate Azure's own SSO session cookie. So the
      hypothesis holds for the IdP session (the next interactive login re-prompts) but
      FAILS for issued access/refresh tokens (they live to natural TTL: access ~1h,
      refresh per tenant policy).
    evidence:
      - sidecar: odd-platform__java__auth__logout__AzureLogoutSuccessHandler.md
        section: implicit_adrs[0] + bugs_limitations_corner_cases[2]
        cite: "AzureLogoutSuccessHandler.java:31-48 (no outbound revocation HTTP)"
        note: "Session invalidate + end-session redirect only; protocol has no revoke."
      - sidecar: WebFetch
        section: oauth2-oidc live page
        cite: "Azure AD v2.0 does not expose RFC 7009 token revocation"
        note: "Doc confirms the protocol constraint."
    operator_visible_failure: |-
      Same residual-token window as Cognito for any previously-captured access/refresh
      token — but because the root cause is a Microsoft protocol limitation, NOT an ODD
      omission, the only remediation is documentation + a shorter token-lifetime tenant
      policy. The operator-visible gap is the SILENCE: an operator with strict
      immediate-revocation compliance requirements cannot tell from the product which
      providers honour revocation. (The live doc now closes the documentation half.)
    severity: MEDIUM
