security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      3 mutating endpoints HAVE SecurityRule + QUERY_EXAMPLE_* permissions.
      10 read endpoints (all reads + 5 search-session endpoints) have NO
      SecurityRule and fall through to .authenticated(). The 7-permission
      grid is SPLIT across 3 controllers per the cross-controller permission
      split pattern.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      QUERY_EXAMPLE_UPDATE / _DELETE apply to ANY example for callers holding
      the permission via ANY Policy — no cross-owner check against the
      example's linked entities' owners.
  strengths:
    - Three mutating endpoints fully gated with documented permissions
    - QueryExamplePermissionExtractor resolves per-example policy context
  weaknesses:
    - 10 of 13 endpoints ungated (intentional read-collaborative posture
      but query body may contain internal schema vocabulary)
    - F-004 stored-XSS family 4th surface (Markdown rendering of definition
      AND query) — HIGH severity
    - Search-session UUID-only ownership — theoretical session-hijack on
      UUID leakage
    - No content-length cap on definition + query (PostgreSQL text up to 1GB)
  cross_file_inconsistencies:
    - The QUERY_EXAMPLE resource extractor is correctly wired for the 3
      QueryExampleController endpoints; the 4 sibling permissions are on
      DataEntityController and TermController per the cross-controller split
  contributing_files:
    - QueryExampleController.md
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'getQueryExampleDetails: three sequential DB round-trips with
      DataEntityDimensionsDto fan-out — QueryExampleController.md'
    - 'getQueryExampleByDatasetId / ByTermId: 5-jsonArrayAgg JOIN; no
      pagination — QueryExampleController.md'
    - 'Search-suggestions: FTS-ranked query against the entrypoint GIN
      index — QueryExampleController.md'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      All 13 endpoints are single-item-per-call. No batch mutations. Create
      + update each make 2 round-trips; delete makes 3.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      by-dataset and by-term endpoints have NO pagination (hasNext=false
      hard-coded). For an entity with many query examples, response time
      degrades O(N).
  strengths:
    - Reactive Mono/Flux signatures throughout
    - PostgreSQL connection pooling via R2DBC
  weaknesses:
    - by-dataset / by-term endpoints unbounded (no pagination) — MEDIUM
    - Search-entrypoint table grows unboundedly (no DELETE on example-delete) —
      MEDIUM
    - FTS index over definition + query text combination — index size scales
      with text length
  cross_file_inconsistencies: []
  contributing_files:
    - QueryExampleController.md
notes: |-
  This entity entry is the catalog landing page for Query Example as a
  first-class concept. The 17-endpoint surface is INTENTIONALLY split
  across THREE controllers per the cross-controller permission split
  pattern; the entity entry consolidates the picture.

  Cross-cutting connections:
    - Companion invariant: f-004-stored-xss-extends-to-query-example-fourth-markdown-surface
      (the F-004 4th surface)
    - Companion invariant: cross-controller-permission-split-batch-v-pattern
      (the pattern observation)
    - Companion entity: term-linkage (terms in query examples are first-class
      linkage edges)
    - Companion entity: data-entity (the dataset linkage edge)
    - F-006 audit-silence: QueryExampleServiceImpl has NO @ActivityLog —
      mutations are NOT recorded in the activity feed (per the audit-silence
      master invariant)
    - LSN-018 finding: the OpenAPI operation 'createQueryExamples' is
      plural but creates a single example — naming inconsistency with
      sibling createTerm/createOwner
