name: Controllers are pass-through delegates with HTTP wiring on generated *Api interfaces
canonical_in_docs: false
canonical_candidate: true
description: |-
  Repository-wide convention: controllers carry only `@RestController`
  + `@RequiredArgsConstructor` + `@Override` on each method. HTTP method/path/produces/consumes
  annotations live on the OpenAPI-generated `*Api` interface, NOT on the controller
  class. AlertController, DataEntityController, DataEntityAttachmentController, DirectoryController,
  GenAIController, ActivityController, DataCollaborationController, CollectorController
  all follow this. AlertManagerController is the sole exception (hand-coded, no `*Api`
  interface, has explicit `// TODO: define OpenAPI spec` comment).

  ## STRENGTHENED — batch ZD (RBAC class-level controller-tier confirmation)

  Batch ZD adds FIVE new class-level confirmations of the same shape
  at the RBAC + Integration controller cluster. All five files are
  thin two-line-per-method reactive delegates implementing
  OpenAPI-generated `*Api` interfaces:

    - IdentityController (28 lines, 1 endpoint — `whoami`):
      single method body is
      `identityService.whoami().map(ResponseEntity::ok).switchIfEmpty(...)`;
      no `@PreAuthorize`, no `@Slf4j`, no controller-level logic.
      Implements `IdentityApi`.

    - PermissionController (27 lines, 1 endpoint —
      `getResourcePermissions`): single method body is
      `Mono.just(permissionService.getResourcePermissionsForCurrentUser(...)).map(ResponseEntity::ok)`;
      no `@PreAuthorize`, no `@Slf4j`. Implements `PermissionApi`.

    - RoleController (52 lines, 4 endpoints — create / list /
      update / delete): every method is `serviceCall.map(ok)` or
      `serviceCall.thenReturn(noContent)`; no `@PreAuthorize`, no
      `@Slf4j`, no logging on any of the 4 endpoints. Implements
      `RoleApi`.

    - PolicyController (64 lines, 6 endpoints — create / get / list
      / update / delete / schema): every method is a flatMap/map
      delegate to `policyService.*`; no `@PreAuthorize`, no
      `@Slf4j`. Implements `PolicyApi`.

    - IntegrationController (28 lines, 2 endpoints — `getIntegration`
      + `getIntegrationPreviews`): both methods are two-line
      `integrationService.X().map(ok)` delegates; no
      `@PreAuthorize`, no `@Slf4j`. Implements `IntegrationApi`.

  Across all FIVE files: every method takes `ServerWebExchange exchange`
  as a parameter (required by the OpenAPI-generated `*Api` signature)
  but NONE of the methods read the parameter — the parameter is dead
  weight forwarded from the interface contract. Five additional
  confirmations bring the pattern to 11+ controller-class sidecars
  end-to-end.

  ## STRENGTHENED — batch ZE (Discovery + Search + Links + Feature + Relationship + Title)

  Batch ZE adds FIVE MORE class-level confirmations of the same
  shape at the discovery / search / feature-flag / relationship /
  title cluster:

    - SearchController (92 lines, 7 endpoints — search / facets /
      results / facet-options / suggestions / update / highlight):
      every endpoint body is the 3-line
      `svc.call(...).map(ResponseEntity::ok)` shape; no
      `@PreAuthorize` anywhere on the class; no `@Slf4j`; no
      controller-level error mapping; ServerWebExchange parameter
      received but unread on every method. Implements `SearchApi`.

    - TitleController (24 lines, 1 endpoint — `getTitleList`):
      single method body is
      `titleService.list(page, size, query).map(ResponseEntity::ok)`;
      no `@PreAuthorize`, no `@Slf4j`. Implements `TitleApi`.

    - FeatureController (21 lines, 1 endpoint —
      `getActiveFeatures`): single method body is
      `Mono.just(featureResolver.resolveActiveFeatures()).map(ResponseEntity::ok)`;
      no `@PreAuthorize`, no `@Slf4j`. Implements `FeatureApi`.

    - RelationshipController (44 lines, 3 endpoints — list / ERD /
      GRAPH): every method body is `service.call(...).map(ok)`; no
      `@PreAuthorize`, no `@Slf4j`. Implements `RelationshipApi`.

    - LinksController (37 lines, 1 endpoint — `getLinks`): single
      method body is `Mono.just(linkProperties.links().stream()
      .map(...).toList()).map(LinkList::new).map(ResponseEntity::ok)`
      shape; no `@PreAuthorize`, no `@Slf4j`. Implements `LinksApi`.

  All five files confirm: zero `@PreAuthorize`, zero `@Slf4j`,
  ServerWebExchange dead-weight on every method. The pattern is
  now confirmed across 16+ controller-class sidecars end-to-end.
