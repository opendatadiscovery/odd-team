notes: |-
  Owner rename is a privileged, broad-impact write: it mutates a row
  read by every Ownership join, every USER_OWNER_MAPPING-bridged
  lookup, every search query, and the owner-listing in the UI. Five
  distinct correctness contracts are bundled into this one endpoint
  (UPDATE owner.name + DELETE/INSERT owner_to_role + UPDATE search
  vectors × 2 + read-back) and not a single one is HTTP-asserted.

  The live owners doc page (WebFetched 2026-05-20 status 200) is
  SILENT on Owner-rename semantics — does not describe USER_OWNER_MAPPING
  survival, audit-log absence, name-collision behaviour (USR003 vs 409),
  case-sensitivity rules, or idempotence semantics.
