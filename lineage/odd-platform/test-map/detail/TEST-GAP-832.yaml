proposed_action: |-
  Add `IngestionDuplicateODDRNPayloadCrashRegressionPinTest`. Testcontainers integration test:

  1. **Setup**: Postgres testcontainer, ODD platform. Datasource D-A registered.
  2. **POST /ingestion/entities** with payload `{data_source_oddrn: D-A.oddrn, items: [{oddrn: "urn:dup1", type: DATASET, ...}, {oddrn: "urn:dup1", type: DATASET, ...}]}` — two entities with the same ODDRN.
  3. **Assert**:
     - HTTP 5xx (500 or similar — pin the current shape).
     - Response body or server log contains `IllegalStateException` and / or `Duplicate key`.
     - `SELECT count(*) FROM data_entity WHERE oddrn='urn:dup1'` returns 0 (atomic rollback per TEST-GAP-831).
  4. **Sister assertion**: POST with deduplicated payload → 200 + 1 entity persisted.
  5. **Maintainer-choice gate**: when REFACTOR-NNN lands choosing the new behaviour (400 structured OR silent dedup), update this test to assert the new contract — explicit + deliberate.

  Coherence note (LSN-018 Rule 6): NET-NEW. STRENGTHENS the IngestionServiceImpl impl-axis sidecar by adding the first regression-pin for an untested invariant. NO contradiction with F-008 detail — this is the first test that exercises the duplicate-ODDRN edge case at the service tier.
