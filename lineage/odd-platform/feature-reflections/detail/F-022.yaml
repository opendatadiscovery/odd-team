  validation:
    verdict: contradicted
    actual_behavior: |
      No HTTP caching headers (Cache-Control, ETag, Last-Modified) are set on any
      response, including the PNG badge (per `DataQualityController.md`
      performance.known_performance_gaps[1] — "no Cache-Control, no ETag" on
      `getSLA`; the body is fully determined by `(datasetId, current_test_states)`
