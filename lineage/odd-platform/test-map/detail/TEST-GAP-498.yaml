behaviour: |-
  Soft-deleted DEG membership re-add regression-pin (MEDIUM — UX defect with audit asymmetry). The group_entity_relations PK is (group_oddrn, data_entity_oddrn) (V0_0_21__add_data_entity_group_relation.sql:6), NOT including is_deleted (added later by V0_0_79__data_deprecation.sql:14-15). The soft-delete machinery (`softDeleteRelationsForDeletedDataEntities` at ReactiveGroupEntityRelationRepositoryImpl.java:92-101) flips is_deleted=true when the underlying data entity is deleted (e.g. via STATUS=DELETED cascade). The matching `restoreRelationsForDataEntities` (lines 104-112) is the only path to flip the bit back. After an entity is soft-deleted and later restored (status flips to a non-DELETED state), the GROUP membership row REMAINS soft-deleted; getManuallyCreatedRelations (filtered by is_deleted=false at lines 127-137) shows ZERO memberships for the entity. The user re-invokes POST /api/dataentities/{id}/data_entity_group to re-add membership, the INSERT collides with the PK, `onDuplicateKeyIgnore` returns an empty Flux, the service raises `BadUserRequestException("Data entity is already in this DEG")` at DataEntityServiceImpl.java:402 — but from the user's perspective the entity is NOT visibly in the DEG. The error message is MISLEADING. The fix candidates: (a) re-issue the soft-delete restore from inside addDataEntityToDEG when an existing soft-deleted row is detected, (b) include is_deleted in the PK or in a partial unique index, or (c) document the workaround. Cross-pillar P-01 (Discovery / DEG membership UX defect; operators following the entity-restore flow encounter this without diagnostic signal).
