notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "logout" + "DISABLED" — found
  `invariant:logout-side-token-revocation-asymmetric-defence-in-depth`
  (the LOGIN_FORM/OAUTH2/LDAP-side invariant; covers cross-provider
  asymmetry for AUTHENTICATED logout). No existing concept covers
  the DISABLED-mode 404 specifically. This invariant is the
  DISABLED-side companion to the existing logout-side invariant.

  Recommended mitigation: add a 2-line condition in AppToolbar.tsx
  that hides the Logout menu item when identity.username === 'admin'
  AND there is no user-owner mapping (i.e. DISABLED-mode dummyOwner
  state). This is structurally similar to the
  REFACTOR-185-IDENTITY-LAYER mitigation recommendation #6 (UI-side
  defence-in-depth banner).
