behaviour: |-
  No auto-create of Owner on OAUTH2/LDAP first login — silent empty results for unmapped users. A new OAUTH2 or LDAP user authenticated for the first time has NO user_owner_mapping row. fetchAssociatedOwner chain emits empty Mono (line 51 → flatMap on a Mono that emits empty). Downstream consumers (AlertService.listByOwner at line 84, DataEntityService.listAssociated, SearchServiceImpl.search with my_objects=true, ActivityServiceImpl.listMyEvents) all degrade to empty results with HTTP 200 — NOT 401/403/404. The new user sees `My Objects` empty, `My Alerts` empty, `MY_OBJECTS` activity empty, and has NO on-screen signal directing them to the OwnerAssociationRequest flow. User-onboarding UX failure + undocumented gap.
