  - "CollectorsList.md says (security.known_security_gaps.[2]): 'Token-visibility detection is a literal substring prefix sniff (\"******\") — a backend mask-format change would silently break detection. No regex, no version negotiation with the backend, no automated test guarding the contract. severity: MEDIUM'"
  - "CollectorsList.md says (tests_coverage_semantic.uncovered_behaviours.[4]): 'Regression test for the substring(0,6) sentinel — if the backend changes the mask format (e.g. drops to 4 stars ****{last6}), the UI should NOT silently offer Copy on a masked value.'"
