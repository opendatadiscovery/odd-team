expected_outcome: |
  Stress question (Category B + Category F — diff semantics when versionIds
  are non-existent or duplicate): DatasetVersionServiceImpl.getDatasetVersionDiff
  (line 56-64) has two pre-checks:
    (a) if firstVersionId == secondVersionId → throws BadUserRequestException
        with message "Couldn't show diff for identical versions" (line 60);
    (b) the SQL fetches `WHERE DATASET_VERSION.ID.in(List.of(first, second))`
        and the post-check at line 69 throws RuntimeException
        "Query returned %s rows for diff request" if the result size != 2.

  Edge cases not specifically asserted by the existing test
  (DatasetVersionDiffTest.java) and not derivable from static reading:
    (1) firstVersionId exists, secondVersionId doesn't exist → SQL returns
        1 row → RuntimeException with "Query returned 1 rows for diff request"
        → ControllerAdvice maps to HTTP 500 (NOT 404).
    (2) Both versionIds don't exist → SQL returns 0 rows → "Query returned
        0 rows for diff request" → HTTP 500.
    (3) Both versionIds belong to DIFFERENT datasets (separate from P-147 —
        the diff variant) → SQL returns 2 rows → diff proceeds; the
        dataEntityId path parameter is discarded.

  Operator-visible consequence: callers passing wrong version_ids get HTTP
  500 instead of HTTP 400/404, leaking internal error class to the caller.
  Owner-scoping at the API surface is documentation-only.
