behaviour: 'EXCLUDE_FROM_SEARCH inclusion bug — entities flagged hidden-from-search
  are NOT filtered out of popular ranking, unlike all 9 other list-shaped surfaces
  in the codebase that DO apply the predicate. STRENGTHENED batch H — the repository
  sidecar confirms from primary source: `cteDataEntitySelect` at lines 909-939 contains
  NO `DATA_ENTITY.EXCLUDE_FROM_SEARCH` predicate, only `DATA_ENTITY.HOLLOW.isFalse()`
  (line 918) and the soft-delete branch (lines 913-917). REFACTOR-222 confirmed at
  the SQL layer. STRENGTHENED batch ZA — the DataEntityDetails sidecar (the platform-wide
  canonical LSN-017 source-code anchor at file:line 56-64) confirms the UI-tier amplification
  of this gap: every page-open through the bug pumps view_count by +2 (vs +1 if line 63
  was removed) — the EXCLUDE_FROM_SEARCH bypass on Popular ranking is therefore 2x
  more exploitable from the UI than from a direct API call. The test should pin BOTH
  the predicate gap AND the 2x amplification (a future fix to either layer should
  update the assertion direction appropriately). The PRIMARY-SOURCE UI-tier anchor
  is TEST-GAP-836 (batch ZA).'
