- id: H-007
  hypothesis: |
    When a user-owner mapping is soft-deleted (user leaves the org) or reassigned, the historical
    activity rows that user created continue to display their actor identity — so an auditor can
    still reconstruct who performed past actions.
  derivation: |
    The pillar mission frames this as an audit-trail of record; an audit log that loses or rewrites
    actor identity on a mapping change is operationally useless. The username is preserved in
    activity.created_by at write time — the display should keep surfacing it.
  seed_source: negative-space + pillar-mission
  validation:
    verdict: contradicted
    actual_behavior: |
      The actor display resolves via `LEFT JOIN USER_OWNER_MAPPING ON OIDC_USERNAME =
      ACTIVITY.CREATED_BY AND DELETED_AT IS NULL` (repository 220-222). The `DELETED_AT IS NULL`
      clause means a SOFT-DELETED mapping makes the JOIN miss: the resolved OwnerPojo is NULL and the
      UI shows the row with no actor (indistinguishable from a system event). The raw created_by
      username is still in the row but not surfaced through the resolved OwnerPojo. Worse, if the
      same username is RE-ASSOCIATED to a different owner, the JOIN resolves the past row to the NEW
      owner — retroactively rewriting attribution (the same failure as H-001 case (b), via the JOIN
      rather than the filter). This is a DISTINCT mechanism from PLT-031 (which is about the per-entity
      tab lacking a permission gate) and PLT-065 (provider-agnostic JOIN) — those touch the same JOIN
      but neither names the DELETED_AT-misses-the-actor-display consequence.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: "invariants + bugs_limitations_corner_cases"
        cite: "ReactiveActivityRepositoryImpl.java:220-222 (DELETED_AT IS NULL on the actor JOIN)"
        note: "soft-deleted mapping orphans the actor display; reassignment rewrites it"
    operator_visible_failure: |
      (i) When a user leaves the org and the admin soft-deletes their mapping, every activity row that
      user created appears as a system event (OwnerPojo=null) — a forensic review months later cannot
      tell who edited a description, even though the username is still in the database. (ii) When a
      mapping is reassigned, the JOIN resolves the original person's past rows to the NEW owner — the
      auditor sees the new owner's name on actions they did not perform.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    coverage_note: "no test pins the soft-delete actor-display behaviour. Functional demand UC-7."

