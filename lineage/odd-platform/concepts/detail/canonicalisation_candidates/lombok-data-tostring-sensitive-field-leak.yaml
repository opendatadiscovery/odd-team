proposed_canonical: Lombok @Data toString() sensitive-field leak
rationale: '4-sidecar triangulated cross-cutting invariant from batch 2026-05-12D:
  every ODD @ConfigurationProperties POJO carrying credentials/secrets uses Lombok
  `@Data` without `@ToString.Exclude` on the sensitive fields (NotificationsProperties
  batch C hint + EmailSenderProperties D password + ODDLDAPProperties D password +
  ODDOAuth2Properties D clientSecret). Spring Boot 3.4.10''s `/actuator/env` defaults
  are safe (sanitiser masks password/secret/token/key keys), so the actuator surface
  is NOT the leak; the DURABLE leak is `toString()` invocation if logged or custom-serialised.
  This REFINES the batch-C narrative that said ''auth.ldap.password leaks via /actuator/env''
  — that claim was overbroad; the correct claim is ''Lombok-toString-leak IF logged.''
  Recommended cross-cutting cleanup: add `@ToString.Exclude` to every sensitive field
  across the four POJOs, OR wrap credentials in a sealed `Credential` type that overrides
  `toString` with masking. The catalog records this so future audits cite the precise
  leak surface.'
contributing_concepts:
- EmailSenderProperties.password + @Data (batch D)
- ODDLDAPProperties.password + @Data (batch D)
- ODDOAuth2Properties.OAuth2Provider.clientSecret + @Data (batch D)
- NotificationsProperties (batch C hint)
- Spring Boot 3.4.10 default actuator-env sanitiser keys-to-sanitize
suggested_add_to_docs: false
