mitigations_unimplemented:
  - |-
    SIMPLE FIX (4-service refactor): split namespaceService.getOrCreate
    into TWO methods:
      - namespaceService.getByName(name) — returns existing namespace
        or empty; pure read; no permission needed
      - namespaceService.create(name) — INSERTs a new namespace;
        REQUIRES NAMESPACE_CREATE permission via a service-tier
        check (programmatic, not annotation-based, because the
        call sites are deep)
    Modify the 4 service call sites:
      - TermServiceImpl.createTerm/updateTerm at lines 103, 138
      - DataSourceServiceImpl.create/update at lines 57, 75
      - CollectorServiceImpl.create/update at lines 43, 57
      - DataEntityGroupServiceImpl.createDataEntityGroup/updateDEG
        at lines 65, 84
    Each call site:
      - getByName(name) first
      - If empty AND user holds NAMESPACE_CREATE → call create(name)
      - Else (empty + no permission) → throw AccessDeniedException
        OR continue without the namespace binding (form validation
        decides)
    SAME ARCHITECTURAL FIX as proposed in the master invariant.
  - |-
    Document the 4-service side-door in the live
    /configuration-and-deployment/enable-security/authorization/permissions
    page. Explicit admonition: 'The following Management-tier
    permissions GRANT IMPLICIT NAMESPACE_CREATE: TERM_CREATE /
    TERM_UPDATE / DATA_SOURCE_CREATE / DATA_SOURCE_UPDATE /
    COLLECTOR_CREATE / COLLECTOR_UPDATE / DATA_ENTITY_GROUP_CREATE /
    DATA_ENTITY_GROUP_UPDATE. To prevent operator-side namespace
    creation, the recommended RBAC policy structure narrows these
    permissions to existing-namespace-only via the resource
    extractor.' But the resource extractor mechanism doesn't
    currently support 'existing-only' — so the documentation
    needs the architectural fix to land first.
  - |-
    Add a regression test for the 4-service side-door:
      For each of the 4 services × 2 endpoints (8 test cases):
        (a) Authenticate as a user with the parent endpoint's
            permission but NOT NAMESPACE_CREATE.
        (b) Submit the parent form with a never-seen
            namespaceName.
        (c) Assert the namespace IS created and the parent IS
            attached (pins the current state).
        (d) After fix, the assertion changes to: request 403s.
  - |-
    Build-time scanner: enumerate every service-tier method that
    invokes namespaceService.getOrCreate / tagService.getOrCreateTagsByName /
    ownerService.getOrCreate / any *_CREATE-bypass method. Verify
    each invocation site has a corresponding permission check OR is
    explicitly authorized. The scanner output is the cross-pillar
    audit's inventory.

notes: |-
  This invariant captures the FIRST cross-service enumeration of
  the NAMESPACE_CREATE side-door pattern. The existing master
  invariant (batch U) focused on the TermController half; batch W
  closes the picture at 4 sister services + the NamespaceController
  front-door's explicit enumeration.

  The architectural picture's load-bearing observation: the
  service-tier `getOrCreate` is the LOAD-BEARING side-door. Every
  call site invoking it is a Permission-bypass point. The 4 sister
  services represent the 4 currently-known bypass points; a build-time
  scanner would close the cross-pillar audit.

  The pattern's CONSEQUENCE for operator-side RBAC policy authoring:
  the Permissions doc page (WebFetched 2026-05-20) does NOT name
  the side-door pattern. Operators reading the page see 11
  Management-tier permissions enumerated independently; they DO
  NOT see that 8 of them implicitly grant NAMESPACE_CREATE. The
  doc-side framing is additively-mistaken — the actual permission
  graph is more permissive than the page suggests.

  Cross-cutting connections:
    - STRENGTHENS the master invariant
      namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths
      (the TermController half of the pattern); this invariant
      adds 3 more sister services + the NamespaceController
      front-door's explicit enumeration
    - Pairs with getpopulartaglist-open-read-plus-side-door-compose-to-write-read-directory-bypass
      (THIS BATCH sibling — the TAG_CREATE pattern at 4
      side-doors)
    - Pairs with permission-bypass-via-owner-auto-create-side-door-write-path
      (the OWNER_CREATE side-door at OwnerController batch H —
      sibling architectural class but expressed at the controller
      tier)
    - Pairs with f-002-cross-namespace-term-pollution-ui-surface-confirmed-dictionary-tab-renders-all-namespaces
      (the COMPOUND class — namespace side-door amplifies the
      cross-namespace term pollution; the term created in a
      newly-minted namespace is visible to every Dictionary tab user)
    - Pairs with audit-log-presence-asymmetry-2-tier-audit-story
      (the namespace side-door produces no Activity event — neither
      the new namespace nor the relationship between the caller and
      the new namespace surfaces in the audit feed)

  Three DOC-NNN candidates:
    (a) /configuration-and-deployment/enable-security/authorization/permissions
        — explicit text on the side-door pattern; enumerate the
        8 bypassing permissions
    (b) /features/management/namespaces — admonition on the
        Namespaces tab Add Namespace action: 'Namespaces can also
        be created implicitly by terms, data sources, collectors,
        and data entity groups when their forms reference a
        previously-unknown namespace name.'
    (c) /features/data-glossary/business-glossary — admonition
        under 'Term Authoring' explicitly noting that authoring
        a term with a novel namespace name implicitly creates the
        namespace
