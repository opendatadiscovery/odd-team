mitigations_unimplemented:
  - |-
    Document the asymmetry on
    /configuration-and-deployment/enable-security/authorization/permissions
    — add a "manage DEG memberships" composite-capability section showing
    the paired permissions and the use case for granting them separately.
  - |-
    Document the asymmetry on /features/data-discovery/groups-domains.md
    — operators reading the page should understand that DEG membership
    management is a TWO-permission capability.
  - |-
    Audit shipped default Policies: any Policy aiming to grant
    "manage DEG memberships" should grant both permissions; identify any
    that grant only one and document the gap.
  - |-
    Add a regression test that asserts:
      (a) user with only ADD_TO_GROUP can POST but receives 403 on DELETE;
      (b) user with only DELETE_FROM_GROUP can DELETE but receives 403 on POST;
      (c) user with BOTH succeeds on both.
notes: |-
