### probes_emitted
- probe_id: "PENDING-F-089-1"
  hypothesis_id: H-002
  note: |
    CONFIRMATORY probe (not a probe-needed verdict — H-002 is CONTRADICTED with HIGH
    confidence from the Azure/Cognito sidecars + Rule-8 reads + the convergent
    PLT-075 filing). Per APPROACH Rule 6, a post-authenticated-logout open-redirect
    is a high-leverage security boundary worth raising from code-trace to
    end-to-end-observed. PARALLEL-SAFE: recorded here as PENDING, NOT written to
    probes/ (id-collision risk across concurrent reflectors). Matches F-089's own
    proposed_action (local docker-compose + nginx + Keycloak). Local-only per Rule 6.
  probe_skeleton: |
    name: "Post-logout open-redirect via X-Forwarded-Host — empirical confirmation"
    emitted_by: feature-reflector
    status: pending-reflection-verification
    local_execution: docker-compose (Rule 6 — local-only)
    setup: |
      docker-compose up: odd-platform + postgres + nginx reverse proxy
      (forward-headers-strategy=framework on the platform; nginx configured to
      pass client X-Forwarded-Host through) + Keycloak as an Azure-shape OIDC IdP
      with a PERMISSIVE post-logout allowlist (e.g. https://*.local/).
      auth.type=OAUTH2; one provider client with logout-uri pointing at Keycloak's
      end-session endpoint.
    steps:
      - "Authenticate a user at https://victim.local; confirm a live session."
      - "Issue the logout request to https://victim.local/logout with header X-Forwarded-Host: attacker.local (curl --resolve, or a browser extension)."
      - "Capture the platform's 302 Location → assert it is the Keycloak end-session URL carrying post_logout_redirect_uri=https://attacker.local/."
      - "Follow the redirect → assert Keycloak (permissive allowlist) issues a SECOND 302 to https://attacker.local/ — the user lands on the attacker host post-logout."
      - "Repeat with a SPECIFIC Keycloak allowlist (https://victim.local/ only) → assert Keycloak REJECTS the forged host (control: confirms the IdP allowlist is the sole boundary, H-008)."
      - "Repeat with forward-headers-strategy unset (default none) → assert the forged X-Forwarded-Host is IGNORED and the redirect uses victim.local (control: confirms the safe default, H-003)."
    expected_outcome: |
      "When a logout request arrives with a forged X-Forwarded-Host under a proxy
      that trusts it and the IdP's post-logout allowlist is permissive, the platform
      302s to the IdP end-session endpoint with post_logout_redirect_uri=<attacker
      host>, and the IdP lands the just-logged-out user on the attacker domain — an
      open-redirect with elevated trust." (H-002 verbatim; with H-003 + H-008 as
      the negative controls that establish the two operator-side preconditions.)

