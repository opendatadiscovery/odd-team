proposed_action: |-
  Parameterised unit test. shouldHandle: Azure true for case variants of 'azure', false for 'cognito'/'google'/'github'/null/empty; Cognito symmetric. handle: (a) Azure with valid logoutUri → response status 302, Location contains `?post_logout_redirect_uri=<base>&client_id=<id>` (UTF-8 encoded); (b) Cognito with valid logoutUri → 302 with `?client_id=<id>&logout_uri=<base>` (note distinct param names); (c) Cognito with EMPTY logoutUri → Mono.empty(), response status NOT 302 (default 200), WebSession NOT invalidated (silent failure); (d) WebSession.invalidate called in both happy paths. Pin all four.
