behaviour: |-
  **MEDIUM — Single-implementor invariant of `PostgresWALMessageProcessor` is structurally unenforced.** The `PostgresWALMessageProcessor` interface (7 lines, single method) is consumed by `NotificationSubscriber.java:36` as `private final PostgresWALMessageProcessor messageProcessor` — a single-bean dependency. Spring resolves this by type at boot.

  **The unenforced invariant**: the interface has exactly ONE implementor in the codebase — `AlertNotificationMessageProcessor` (per `grep 'implements PostgresWALMessageProcessor' <odd-platform-repo>` returning a single match at AlertNotificationMessageProcessor.java:18). No test, no annotation, no architectural-fitness-function pins this.

  **Failure modes if the invariant breaks**:
  1. **Two implementors both eligible**: a future PR adds `OwnerNotificationMessageProcessor` (also `@Component`, also `@ConditionalOnNotifications`). Spring fails at boot with `NoUniqueBeanDefinitionException`. Loud failure — good. But the failure is at deploy-time, not at compile-time or PR-time.
  2. **Two implementors, one `@Primary`**: if the second implementor adds `@Primary` to win the resolution, Spring silently picks it. The WAL stream is now decoded by the new implementor — possibly incorrect for ALERT-table rows. Silent failure — bad.
  3. **Single implementor renamed**: a refactor renaming `AlertNotificationMessageProcessor` to `NotificationMessageRouter` (or splitting it into two beans) without `@Primary` on the target bean breaks ambiguous resolution.
  4. **Implementor's `@ConditionalOnNotifications` is incorrectly broadened**: if a future maintainer relaxes the conditional (`@ConditionalOnProperty(name = "notifications.enabled", havingValue = "true", matchIfMissing = true)` instead of `false`), the bean materialises even when notifications are off — wasting decoding resources.

  **Compound with the alert-table coupling**: `NotificationSubscriber.java:51` calls `registerPublication(connection, Tables.ALERT)` — the WAL stream is hardwired to the alert table. A future maintainer adding a second processor (e.g. for OWNER-table changes) needs to ALSO add a second publication, a second slot, a second leader election... but the interface itself does NOT signal this requirement. A naive PR adding only the second processor would surface at deploy-time with a confusing error.

  **Test gap shape**: static-analysis regression-pin asserting the single-implementor invariant + the alert-table coupling.
