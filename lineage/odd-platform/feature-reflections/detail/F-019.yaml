- id: H-006
  hypothesis: |
    When a client creates an Owner via `POST /api/owners`, the HTTP response
    status code matches what the OpenAPI spec declares for that operation — so a
    generated client or a strict integration that asserts on the declared status
    succeeds.
  derivation: |
    Endpoint-shape + doc-claim: the OpenAPI spec is the contract a generated
    client (the platform's own openapi-generator UI client, plus any external
    consumer) is built against. The spec declares responses.'201' for createOwner
    and updateOwner (openapi.yaml:165-171, 195-201).
  seed_source: endpoint-shape + doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      The OpenAPI spec declares 201 for BOTH createOwner and updateOwner; the
      controller returns 200 on both (OwnerController.java:26 for create via
      ResponseEntity::ok, line 53 for update). The drift is class-wide on both
      201-declaring methods (deleteOwner correctly aligns: spec 204, impl 204;
      getOwnerList aligns: 200/200). Doubly anomalous: declaring 201 for a
      PUT-update is itself non-canonical (201 signals POST-creation), AND the
      impl disagrees with the spec on both. Sibling controllers (Policy/Role/Tag)
      show the same pattern — platform-wide. A strict client asserting the
      declared 201 receives 200 and treats the successful create/update as a
      protocol error.
    evidence:
      - sidecar: '(F-019 feature-flow detail — batch ZF finding 3 + observed_vs_expected)'
        section: observed_vs_expected.facet=openapi_201_vs_impl_200_class_wide
        cite: "openapi.yaml:165-171, 195-201 vs OwnerController.java:26, 53"
        note: "201 declared, 200 returned, on both create and update; class-wide and platform-wide."
      - sidecar: odd-platform__java__OwnerController__controller-method__deleteOwner.md
        section: docs_link_semantic.doc_drift_findings[2]
        cite: "openapi.yaml:204-219 (delete declares 204) vs OwnerController.java:44 (returns 204)"
        note: "Delete ALIGNS — confirming the drift is specific to the two 201-declaring methods."
    operator_visible_failure: |
      (1) A strictly-validating generated or hand-written client that checks the
      declared 201 sees a successful create/update fail its status assertion —
      it may retry (creating duplicates) or surface a spurious error. (2) The
      spec is wrong in BOTH directions (201-for-PUT is non-canonical, and the
      impl returns 200), so neither "fix the impl to 201" nor "trust the spec"
