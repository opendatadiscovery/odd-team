proposed_action: |-
  Add `OwnerControllerGetListAuthMatrixTest`:

  1. `get_apiOwners_authDisabled_anonymousCaller_returns200_withFullDirectory_pinsAnonymousReach` — WebTestClient `.get().uri("/api/owners").exchange().expectStatus().isOk()` under `@TestPropertySource("auth.type=DISABLED")`. Comment: `// REGRESSION-PIN — read-collaborative posture under DISABLED. ADR-CANDIDATE-003.`
  2. `get_apiOwners_authLoginForm_authenticatedCallerNoPermissions_returns200_pinsAuthenticatedReachUngated` — login as a user with ZERO OWNER_* permissions; assert 200 + full directory.
  3. `get_apiOwners_authOauth2_authenticatedCaller_returns200_underReadCollaborativePosture` — same under OAUTH2.
  4. `get_apiOwners_authLdap_authenticatedCaller_returns200_underReadCollaborativePosture` — same under LDAP.
  5. `post_apiOwners_authLoginForm_callerWithoutOwnerCreate_returns403_pinsMutationGate` — same context, but POST without OWNER_CREATE → 403. Confirms the SecurityConstants rules DO wire correctly for mutations, by contrast.
  6. Document each assertion with the design intent (ADR-CANDIDATE-003) so a future refactor that ADDS a SecurityRule for GET /api/owners surfaces this test as a deliberate intent-change rather than a green-flip.

  Coherence note (LSN-018 Rule 6): NET-NEW. Dedup query "OwnerController GET unauthenticated read full directory" found no overlapping TEST-GAP. STRENGTHENS the documentation gap by demanding live-docs language. NO conflicts.
