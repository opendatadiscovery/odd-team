name: Session cookie security attributes (HttpOnly / Secure / SameSite) are not configured anywhere
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20X — the platform offloads ALL session-
  cookie security to the deployment topology. NO in-code override of cookie security
  attributes exists ANYWHERE in the repo. Verified via Grep over the entire odd-platform
  repository for the patterns `CookieWebSession|SameSite|HttpOnly|Secure.*cookie|
  sessionIdResolver|WebSessionIdResolver` — ZERO matches.

  **WHAT THIS MEANS**:
    Spring WebFlux's `CookieWebSessionIdResolver` framework default produces a
    session cookie with:
      - HttpOnly = true (the default)
      - SameSite = lax (the default — permits cross-site GET / top-level navigation
        cookie leakage)
      - Secure = NOT set (must be enabled by the operator OR added by an upstream
        TLS-terminating reverse proxy / Ingress)
      - Path = / (the default)
    The platform does NOT register a custom `WebSessionIdResolver` bean to override
    any of these defaults. Operators expecting strict cross-site protection
    (`SameSite=Strict`) OR plaintext-bind safety (the `Secure` flag set by the
    platform itself, not the proxy) get the framework defaults silently.

  **AFFECTED AUTH MODES**:
    LOGIN_FORM is the canonical case — it is the ONLY auth.type mode that issues
    a session cookie as the primary credential bearer (form-login establishes a
    `SESSION` cookie). OAUTH2 and LDAP also use the WebSession for state but
    typically pair with an external IdP / LDAP server that adds its own session
    semantics on top. DISABLED does not populate a session by design (no auth
    pipeline runs) but a session may still be created lazily on any first-request
    `exchange.getSession()` call.

  **COMPOUND WITH `spring.session.timeout: -1`**:
    application.yml:1-3 ships `spring.session.timeout: -1` — sessions NEVER
    expire. A stolen cookie remains valid until manual platform-side invalidation:
    logout (LOGIN_FORM), restart (IN_MEMORY only), or eviction (the
    PostgreSQLSessionHousekeepingJob no-op under spring.session.timeout=-1 — see
    the housekeeping-job-no-scheduler-lock-multi-instance-amplification companion
    invariant). The LOGIN_FORM live doc verbatim: 'does not support … session
    revocation'.

  **DOC DRIFT**:
    The live `/configuration-and-deployment/odd-platform#select-session-provider`
    page covers session storage (IN_MEMORY / INTERNAL_POSTGRESQL / REDIS) and the
    `spring.session.timeout: -1` warning but does NOT document the session-cookie
    attributes that ship by default OR the operator's responsibility to add `Secure`
    via TLS-fronting infrastructure. Confirmed WebFetched 2026-05-20 status 200.

  **EVIDENCE CHAIN**:
    - SessionConfiguration.java:22-65 — the session-provider switch — does not
      register a CookieWebSessionIdResolver bean
    - Grep across the entire odd-platform repo for
      `CookieWebSession|SameSite|HttpOnly|Secure.*cookie|sessionIdResolver|
      WebSessionIdResolver` — 0 matches confirmed 2026-05-20
    - LoginFormSecurityConfiguration.java:53-66 — the LOGIN_FORM SecurityWebFilterChain
      does not configure session attributes via the chain
    - application.yml:1-3 — `spring.session.timeout: -1`

  **THIS IS THE 'Spring framework defaults + operator must configure TLS proxy'
  posture stated implicitly** — the platform does NOT take a stance and does NOT
  warn operators. Operators on plaintext-HTTP deployments (the LOGIN_FORM dev/demo
  case) ship session cookies in clear. Operators behind a TLS-terminating proxy
  may or may not configure the proxy to add the Secure flag.

  **SEVERITY**: HIGH — the compound (no-Secure + SameSite=lax + never-expiring +
  no-revocation) on a session-cookie-based auth mode (LOGIN_FORM) is the worst-case
  scenario; mitigated only by deployment topology (TLS proxy adds Secure;
  operator-discipline rotates cookies). For DISABLED + S2S-only deployments the
  session-cookie posture is less load-bearing but the framework defaults still apply.
