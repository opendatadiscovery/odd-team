      entry → appears in History as Declined. The doc claim holds for these cases. BUT the user_owner_mapping
      soft-delete (deleteActiveRelationByOwner) ALWAYS runs (per ReactiveUserOwnerMappingRepositoryImpl sidecar
      invariant) regardless of whether any APPROVED request row matched. If a user_owner_mapping row exists
      with NO matching APPROVED owner_association_request row (e.g. the request was already cancelled by a
      later collision-decline, or the mapping was created by some path that left no APPROVED row), the unbind
