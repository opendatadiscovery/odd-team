proposed_action: |-
  Add `AlertServiceImplDataEntityScopedTest` with three cases — (a) live entity returns alerts, (b) soft-deleted entity returns alerts (pin the acceptance), (c) unknown id raises NotFoundException. The middle case is the contract anchor for the soft-delete-acceptance invariant. STRENGTHENED batch L: pair-test with TEST-GAP-502 at the controller tier — the service-tier test (this entry) PINS the existence-check semantic; the controller-tier test (TEST-GAP-502) PINS the audit-export workaround use case.
