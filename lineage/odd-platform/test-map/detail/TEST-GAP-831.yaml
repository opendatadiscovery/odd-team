proposed_action: |-
  Add `IngestionServiceBatchAtomicRollback14ProcessorChainTest`. Testcontainers integration test:

  1. **Setup**: Postgres testcontainer, ODD with default `auth.ingestion.filter.enabled=false`, a known-failing processor scenario (e.g. lineage edge with non-resolvable parent ODDRN that breaks `LineageIngestionRequestProcessor`).
  2. **Pre-baseline**: count rows in `data_entity`, `lineage`, `dataset_field`, `metadata_field_value`, `group_entity_relations`, `data_quality_test_relations` tables.
  3. **POST /ingestion/entities** with payload containing 100 valid entities + 1 malformed lineage edge.
  4. **Assert**:
     - HTTP 500 response.
     - `data_entity` row count UNCHANGED.
     - `lineage` row count UNCHANGED.
     - All other ingestion-touched tables: row counts UNCHANGED.
     - OTLP metric export: 0 export calls (verify via mocking `OTLPMetricService`).
  5. **Sister assertion**: POST without the malformed edge → 200 + all 100 entities persist + all expected lineage edges.

  Pair with REFACTOR-NNN (structured error response naming failing processor; e.g. `{error: "PROCESSOR_FAILED", processor: "LineageIngestionRequestProcessor", cause: "..."}`).

  Coherence note (LSN-018 Rule 6): NET-NEW. STRENGTHENS the F-008 detail YAML by adding the SERVICE-VERTEX atomic-rollback test — the existing F-008 detail names the destructive-write picture but does NOT name a regression-pin for the atomic-rollback contract. NO contradiction with TEST-GAP-832/833 (duplicate-ODDRN, null entityClassIds) — those are different failure modes inside the same transaction, both of which this atomic-rollback test would also exercise.
