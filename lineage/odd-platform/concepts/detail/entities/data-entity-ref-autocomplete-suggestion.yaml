contributors:
  - 'SearchController.md:concepts.entities — DataEntityRef (autocomplete suggestion)'
  - 'SearchController.md:concepts.operations — getSearchSuggestions'
  - 'SearchController.md:bugs_limitations_corner_cases.[7,8,9] — non-determinism + entityClassId singular + manuallyCreated=false unused'
evidence:
  - SearchController.md:concepts.entities
  - SearchController.md:bugs_limitations_corner_cases.[7-9]
  - SearchController.md:stress_findings.tunables.[0] (SUGGESTION_LIMIT=5)
notes: |-
  Pairs with `fts-search-vector-data-entity` (the indexed
  input) and `search-session` (separate from suggestions — the
  endpoint does NOT create or read a session row). The 5-row
  truncation contract has no docs page; the live
  /features/data-discovery/search-suggestions URL returns 404
  (no canonical home).
