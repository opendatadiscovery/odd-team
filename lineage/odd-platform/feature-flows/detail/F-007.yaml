    the in-platform ingestion path at AlertServiceImpl.java:222-227
    for de-duplication via AlertUniqueConstraint snapshots). The
    `createAlerts` private helper (lines 261-300) issues INSERT …
    RETURNING with NO `.onConflict(...)` clause. Prometheus's standard
    retry policy duplicates rows. The method has NO audit log — no
    `log.info(...)` at entry, no `@Timed` Micrometer counter, no
    per-call correlation-id capture. From the operator's perspective
    the only post-hoc signal that a webhook arrived is the alert table
    rows themselves; forensic reconstruction of "who POSTed what when"
    after a forge incident is not possible.
