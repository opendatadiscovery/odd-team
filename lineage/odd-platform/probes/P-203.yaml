realism_caveats: |
  - The assertion is wire-shape-based (the raw control sequence appears in the POST body). A
    full end-to-end demonstration (an actual Slack workspace showing the @channel broadcast)
    requires a real Slack endpoint and is out of scope + non-local; the WireMock body capture
    is sufficient to prove the platform sends the unescaped sequence, which is the platform-side
    defect. The Slack-side rendering is Slack's documented behaviour for those tokens.
  - The probe uses <!channel> (the raw Slack broadcast token) rather than @channel because the
    raw token is what reaches the wire from an unescaped passthrough; the generator does not
    translate @channel -> <!channel> (that is Slack-side). Either token form in the description
    demonstrates the passthrough; the probe asserts on the exact string inserted.
  - This probe is local-only (Rule 12): WireMock stub, local Postgres, no external Slack call.
