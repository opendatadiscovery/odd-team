name: |-
  LineageDepth.empty() sentinel magic-number encoding (deferred-feature naming gap)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-05
description: |-
  NEW INVARIANT, batch 2026-05-19M — the one-hop traversal semantic for the
  owner-anchored lineage-variant endpoints (/my/upstream and /my/downstream) is
  encoded via LineageDepth.empty() at DataEntityRelationsServiceImpl.java:34 —
  NOT via LineageDepth.of(1). Per LineageDepth.java:16-18, empty() returns
  new LineageDepth(-1, true) — a depth=-1 integer with the auxiliary boolean
  empty=true. The recursive CTE inside ReactiveLineageRepositoryImpl uses
  tDepth.lessThan(lineageDepth.getDepth()) at line 174 — with depth=-1 the
  recursive step never fires (the seed step's tDepth=0 is NOT less than -1),
  so recursion terminates after the seed step. **The boolean empty field is
  NEVER consumed by the CTE** — only the int depth value is. The encoding is
  the magic number -1 + a structural factory-method-name signal; the
  semantic is "seed-only edges" not "no recursion bound". **Three load-bearing
  observations**: (a) a maintainer reading
  lineageRepository.getLineageRelations(oddrns, LineageDepth.empty(), ...) at
  the call site could reasonably misinterpret empty() as "no depth limit /
  unlimited recursion" rather than "single-hop only" — the class-level boolean
  empty field is the explicit disambiguation but is consulted only at the
  CTE-construction site, not anywhere that reads the field name; (b) a future
  refactor changing the CTE termination predicate to lessThanOrEqual would
  silently expand the endpoint to two hops because the empty() flag is not
  consumed as a special case — only the magic -1 integer; (c) the dual-encoding
  is fragile by design — the factory method name is the documentation, the
  semantic is the SQL behaviour, and they are not connected at code-execution
  time. The encoding works correctly today; the gap is documentation / naming
  clarity AND the brittleness of a magic-number sentinel buried in a single
  WHERE-clause comparison. **Severity**: LOW (latent today; future refactor
  vector).
axes_present:
  - services
  - repositories_reactive
nodes:
  - odd-platform java DataEntityController controller-method:getMyObjectsWithUpstream
  - odd-platform java DataEntityController controller-method:getMyObjectsWithDownstream
  - odd-platform java repository reactive repository:ReactiveLineageRepositoryImpl
