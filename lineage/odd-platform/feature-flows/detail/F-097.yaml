feature_id: F-097
feature_name: |-
  Platform OpenAPI Discoverability Surface (Swagger UI) — every running
  platform serves the full 194-operation API spec at /api/v3/api-docs;
  branding-legacy title + personal contact email + stub server entry
pillar_id: P-11
pillar_anchored_id: P-11:F-002
pillar_anchored_feature_name: |-
  Swagger UI per deployment — public discovery of the full Platform API
  surface; per-auth-mode availability matrix; spec-shape leakage including
  legacy "ProspectLog" title, personal contact email
  `ndementev@provectus.com`, and `http://localhost` stub server entry
seeded_from: SHB-128
seeded_at: 2026-05-26
batch_origin: 'batch-shoebox-graduation 2026-05-26 — slice G'

discovered_from_entry_point: |-
  rest:GET /api/v3/api-docs (springdoc-openapi default mount; behaviour
  per `auth.type` configuration unverified across all 4 modes)

primary_subject:
  - "odd-platform-specification/openapi.yaml"
  - "odd-platform-specification/components.yaml"
  - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/utils/SecurityConstants.java"

contributing_nodes:
  - "spec:openapi:info-block"
  - "spec:openapi:servers-block"
  - "config:springdoc default mount"

chain:
  - hop: 1
    node: "spec:openapi.yaml info+servers blocks"
    sidecar: unresolved
    evidence: |-
      odd-platform-specification/openapi.yaml:1-9 — info.title `ProspectLog
      data catalog HTTP API contract`; info.contact.email `ndementev@provectus.com`;
      info.contact.url `https://provectus.com`. lines 10-12: servers entry
      `- url: 'http://localhost' description: stub`.
    multiplicity_per_trigger: 1
  - hop: 2
    node: "springdoc-openapi default mount"
    sidecar: unresolved
    evidence: |-
      Per docs/developer-guides/api-reference: "The Swagger UI hosted on
      every running ODD Platform is the place to interactively test the
      endpoints documented above against your own deployment." Mounts at
      `{platform-base-url}/api/v3/api-docs` by default. Need to verify via
      Grep whether /api/v3/api-docs is in SecurityConstants.WHITELIST_PATHS
      OR if reachability depends on auth.type=DISABLED.
    multiplicity_per_trigger: 1
  - hop: 3
    node: "security-constants:WHITELIST_PATHS"
    sidecar: unresolved
    evidence: |-
      odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/utils/SecurityConstants.java:95-96
      — WHITELIST_PATHS contains /ingestion/**. The Swagger UI URL
      /api/v3/api-docs is under /api/**, NOT /ingestion/**. Per-auth-mode
      availability matrix needs probe.

terminal_side_effect:
  side_effect_class: page-render
  description: |-
    HTTP 200 with the OpenAPI 3.0.3 specification body (4212 lines
    openapi.yaml + 2937 lines components.yaml, 194 operations across
    35 tags). Discoverable BEFORE any authentication is attempted in
    every supported auth mode (verification pending). The body exposes
    info.title legacy branding "ProspectLog", info.contact.email
    `ndementev@provectus.com` (personal email — possible PII),
    servers entry `http://localhost` (dev-time placeholder).
  evidence: |-
    odd-platform-specification/openapi.yaml:1-12;
    documentation/docs/developer-guides/api-reference.md (the live doc
    explicitly directs operators to the Swagger UI URL).

observed_vs_expected:
  facets:
    - facet: ProspectLog legacy title — branding-defect
      observed: |-
        `info.title: ProspectLog data catalog HTTP API contract`. The
        public-facing Swagger UI announces a project name that operators
        do not recognise. ODD's marketing surfaces (docs site, GitHub
        README, package names) all say "Open Data Discovery"; the spec
        served by the running platform says "ProspectLog". An operator
        reaching the Swagger UI URL via a Google search may not realise
        they are looking at the ODD API spec.
      expected: |-
        Rename `info.title` from `ProspectLog data catalog HTTP API contract`
        to `Open Data Discovery Platform API`. Cosmetic; rebrand alignment.
      evidence:
        - "odd-platform-specification/openapi.yaml:1-2"
      drift_class: legacy_project_name_in_published_spec
      provenance: STATIC — SHB-128 evidence; openapi-spec sidecar.
    - facet: personal contact email PII exposure
      observed: |-
        `info.contact.email: ndementev@provectus.com` is a personal email
        served on the public Swagger UI surface in every shipped configuration.
        Even on a closed deployment with `auth.type=DISABLED`, every caller
        reaching `{platform-base-url}/api/v3/api-docs` sees this email. The
        individual may have left Provectus / changed roles / not consented
        to ongoing contact.
      expected: |-
        Change `info.contact.email` to a team alias (`docs@opendatadiscovery.org`
        or similar) OR replace with `contact.url` only. Convention in
        many OpenAPI specs.
      evidence:
        - "odd-platform-specification/openapi.yaml:3-7"
      drift_class: personal_email_in_published_spec
      provenance: STATIC — SHB-128 evidence.
    - facet: localhost stub server entry — SDK generator footgun
      observed: |-
        `servers: - url: 'http://localhost' description: stub`. SDK code
        generators (openapi-generator-cli, openapi-typescript) use the
        `servers:` entry as the default base URL. A third-party integration
        generating an SDK from the published spec produces code that targets
        `http://localhost` until manually corrected. Per the openapi-spec
        sidecar: "operationally, clients pass an explicit base URL; the
        spec'd `servers:` is ignored in practice" — but it's still a
        documentation-gap shape for new integrators.
      expected: |-
        Change `servers:` from the `http://localhost` stub to a documented
        placeholder (`{platform-base-url}/api` per the api-reference page
        convention) OR a templated server with a variable.
      evidence:
        - "odd-platform-specification/openapi.yaml:10-12"
      drift_class: dev_stub_server_in_published_spec
      provenance: STATIC — SHB-128 evidence.
    - facet: no securitySchemes block — spec is auth-illegible
      observed: |-
        Grep `securitySchemes` in openapi.yaml returns 0 matches; Grep
        `security:` returns 0 matches; same for components.yaml. The spec
        is machine-readable for SHAPE but not for AUTH. SDK code-generators
        produce client classes with no authentication scaffolding.
      expected: |-
        Add a `securitySchemes` block at the components level + per-operation
        `security:` declarations matching the actual auth-mode coverage.
        At minimum, document the S2S `X-API-Key` header scheme on /api/**
        operations and the lack of auth on /ingestion/** (with a maintenance
        note about the asymmetry — see F-094).
      evidence:
        - "odd-platform-specification/openapi.yaml — grep securitySchemes: 0 matches"
        - "odd-platform-specification/components.yaml — grep securitySchemes: 0 matches"
      drift_class: spec_silent_on_auth_dimension
      provenance: STATIC — SHB-128 + openapi-spec sidecar bugs_limitations_corner_cases.
    - facet: per-deployment availability matrix unverified
      observed: |-
        Swagger UI is served at `/api/v3/api-docs` (springdoc-openapi
        default). Reachability under DISABLED is documented (the docs
        direct operators there); reachability under
        OAUTH2 / LDAP / LOGIN_FORM depends on whether `/api/v3/api-docs`
        is separately whitelisted in `SecurityConstants.WHITELIST_PATHS`
        OR exempt from the configured WebFilterChain by some other route.
        The 4-cell matrix is not enumerated in-repo.
      expected: |-
        Either (a) probe + document the matrix at the
        developer-guides/api-reference page, OR (b) ship an
        `auth.swagger.enabled` toggle that gates `/api/v3/api-docs`
        separately from the rest of the `/api/**` surface, so operators
        can opt-out of public spec discoverability.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/utils/SecurityConstants.java:95-96"
        - "https://docs.opendatadiscovery.org/developer-guides/api-reference (live doc directs operators to Swagger UI URL)"
      drift_class: deployment_availability_matrix_unverified
      provenance: STATIC — SHB-128 evidence; probe pending.
    - facet: contract-shape gaps surface as discoverable bugs
      observed: |-
        `QueryExampleFormData` missing `name` field; QueryExample /
        QueryExampleRef schemas similarly missing `name`. Discoverability
        surface includes contract-shape gaps that are operator-visible —
        anyone reading the spec sees that the form-data and the entity
        type are not in sync.
      expected: |-
        Align the QueryExample family of schemas — either add `name` to
        the FormData or remove the field from the entity surface.
      evidence:
        - "odd-platform-specification/components.yaml:2729-2776 (QueryExample/QueryExampleRef)"
        - "odd-platform-specification/components.yaml:2799-2808 (QueryExampleFormData)"
      drift_class: spec_shape_drift_visible_at_discoverability_surface
      provenance: STATIC — SHB-128 evidence.

