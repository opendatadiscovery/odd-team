name: WAL Consumer + Postgres Replication Slot
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-08
description: |-
  **NEW CONCEPT, batch 2026-05-19K** — the platform's outbound-notification durability
  pattern: Postgres logical-replication WAL consumed by a single leader-elected thread
  via a named replication slot + publication. `NotificationSubscriber` (per
  `NotificationSubscriberStarter.java:21-32` + `NotificationSubscriber.java:39-46`)
  runs ONE thread named `notification-subscriber-thread` on the elected leader
  (advisory lock id `notifications.wal.advisory-lock-id`, default 100), polls the
  named replication slot, and routes each decoded WAL message through a
  `PostgresWALMessageProcessor` (sole implementor:
  `AlertNotificationMessageProcessor` at
  `notification/processor/AlertNotificationMessageProcessor.java:14-37`). The
  replication slot + publication are LAZILY CREATED on first run if absent and ODD
  NEVER drops them on shutdown — operator owns cleanup. The processor's role is
  per-channel fan-out: invokes `NotificationMessageTranslator.translate(...)` to
  enrich the decoded WAL row into an `AlertNotificationMessage` (multi-statement
  jOOQ read of `alert_chunk` + alerted data-entity + recursive downstream-lineage
  CTE), then iterates `List<NotificationSender>` sequentially with synchronous
  HTTP/SMTP per-sender. Translation runs BEFORE fan-out: translation failures
  (unknown alert-type code, missing FK) propagate OUT of `process()` to
  `NotificationSubscriber`'s outer catch which logs and waits 10s before
  re-acquiring the lock — meaning the SAME WAL LSN is re-delivered indefinitely on
  a persistently-bad row (poison-message replay loop). Distinct from the
  202+queue+advisory-lock pattern (DataCollaboration's outbound Slack messages) —
  THIS pattern uses Postgres WAL streaming as the queue, whereas the 202 pattern
  uses an in-table queue read via SELECT. **Architectural anchor for the WAL
  consumer as a durability mechanism** — the platform's only outbound subsystem
  that survives platform crashes mid-delivery (the WAL stream re-delivers from the
  last applied LSN on restart). vocabulary_status: codebase-anchored,
  doc-side-partially-covered (live `/features/active-platform-features/notifications`
  page describes the fan-out behaviour; live
  `/configuration-and-deployment/odd-platform` describes the operator's
  responsibility to enable logical replication on the Postgres cluster — but
  NEITHER page names the implementation site nor the poison-message-replay loop).
nodes:
- odd-platform java service service:NotificationsDispatcher
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:EmailSenderProperties
