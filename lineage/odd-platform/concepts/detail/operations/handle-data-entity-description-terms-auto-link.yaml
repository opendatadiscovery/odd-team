security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      The operation creates term-link rows without consulting
      DATA_ENTITY_ADD_TERM. Only DATA_ENTITY_DESCRIPTION_UPDATE
      (controller-tier on PUT /api/dataentities/{id}/description) is
      gated. A user with DESCRIPTION_UPDATE but NOT ADD_TERM can paste
      `[[finance:Customer]]` into a description and create a link row.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      No per-namespace scoping. Cross-namespace mentions resolve to
      whichever term matches the (ns, name) tuple regardless of which
      team owns the namespace.
  strengths:
  - Reactive transactional perimeter — the parse + reconcile + activity
    emission are atomic per request
  - is_description_link=TRUE flag preserves the provenance of the
    link — manual links and description-link rows coexist as separate
    rows
  - Unhandled-mention staging — mentions for non-existent terms are not
    silently dropped; they materialise automatically when the matching
    term is later created (forward-compat)
  weaknesses:
  - Auto-link side-channel bypasses DATA_ENTITY_ADD_TERM (HIGH severity)
  - Cross-namespace pollution unconstrained (MEDIUM)
  - Unicode and nested-bracket regex edge cases unproven (LOW)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    Runs on EVERY description edit (data-entity or dataset-field). The
    regex compile is once at class load (Pattern.compile at line 67);
    per-call cost = regex match (O(N) on description length) + 1 batch
    DB lookup + 4-5 reconcile DB statements.
  - |-
    Triple-re-query via TermAssignmentActivityHandler — getDataEntityTerms
    is re-queried BEFORE (getContextInfo) AND AFTER (getUpdatedState) the
    operation; for an entity with 100 linked terms, a single description
    edit produces 2 full-list re-queries plus the reconcile cost.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: One description edit at a time per @ReactiveTransactional
      perimeter; no batch description-update API.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Stateless — service horizontally scales.
