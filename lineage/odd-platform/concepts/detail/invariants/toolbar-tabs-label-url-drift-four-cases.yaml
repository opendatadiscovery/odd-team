mitigations_unimplemented:
  - |-
    Rename the URL — e.g. `/catalog` instead of `/search`,
    `/dictionary` instead of `/termsearch`. Breaks deep-linked
    bookmarks; needs migration via redirect or Navigate.
  - |-
    Rename the i18n key — e.g. `t('Catalog')` -> `t('Search')`.
    Eliminates the label-URL drift; breaks alignment with the
    live doc page.
  - |-
    Document the synonym mapping — add a 'Terms & Aliases' table
    to `documentation/docs/main-concepts.md`. Lowest cost; doesn't
    remove drift but makes it discoverable.
