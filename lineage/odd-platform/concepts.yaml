        - "Storage-tier × file-size interaction surfaces in all four sidecars (LOCAL ephemeral × 20MB cap × N concurrent uploads = LSN-001 risk surface)"
        - "uploadFileChunk method-level sidecar promotes the LOCAL-only multi-instance finding to a storage-mode-independent one — the chunk path was assumed config-driven, the method-level evidence (FileUtils.CHUNK_BASE_PATH constant) shows it's hardcoded"
