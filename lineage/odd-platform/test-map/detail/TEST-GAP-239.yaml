proposed_action: 'Add an integration test: (a) create owner `O`; (b) soft-delete `O`
  via DELETE /api/owners/{id}; (c) re-POST /api/owners with `name=''O''`; (d) assert
  the second create SUCCEEDS with a fresh id and the same name (the CORRECT current
  behaviour, NOT a 500). Pin the operator workflow; future regression of the partial-index
  predicate would re-introduce the buggy behaviour the createOwner sidecar originally
  reported.'
