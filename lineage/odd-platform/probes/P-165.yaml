realism_caveats: |
  This probe pins TWO Category B drift hypotheses on the
  `WithPermissionsProvider` wrapper:

  (1) The wrapper is context-seed-only at the LIST route — confirmed by
  `reader_h1_text == 'Query Examples'` + `reader_list_items_count >= 3`
  + `reader_add_button_present == false`. If all three pass, the
  methodology should record this as a documented architectural pattern
  AND add a doc-gap-finder note ("RBAC-gated by QUERY_EXAMPLE_CREATE"
  means "the Add button is gated", not "the page is gated").

  (2) The every()-AND-of-permissions subtlety on the DETAIL route —
  confirmed by `updater_detail_rendered == true` (the page renders for
  a user with UPDATE-but-not-DELETE). The individual Edit / Delete
  buttons may or may not be gated by separate `WithPermissions` calls
  inside `QueryExampleDetailsContainer.tsx` /
  `QueryExampleDetailsContainerActions.tsx`; the probe captures the
  state for both regardless to support either interpretation. A
  follow-up file-analyser pass on the details container would
  determine the inner gating shape; this probe's job is the route-layer
  question only.

  If `reader_h1_text != 'Query Examples'` or `reader_list_items_count`
  is 0, the static analysis is falsified — either the wrapper DOES
  block rendering via some code path file-analyser missed, OR the
  backend GET `/api/queryexample/list` requires an authorization the
  reader lacks. probe-runner should capture the HTTP responses on
  `/api/queryexample/list` to disambiguate.

  The local-only stack assumption holds — Playwright headless + local
  docker-compose; no remote infrastructure required.

  The probe does NOT verify the `/data-modelling/relationships` route
  (no permission wrapper at all) — that's a separate probe scope (the
  RelationshipController sidecar's domain). This probe is strictly
  about the `WithPermissionsProvider`-wrapped routes.
