behaviour: |-
  **HIGH — `getDataEntityActivityList(dataEntityId, ...)` has NO per-data-entity authorization check at ANY layer (controller, service, repository, OpenAPI generator). Any authenticated user can read the FULL activity history (including JSONB old_state / new_state payloads) for ANY data entity by ID — including data entities the caller has no other read permission for. This SUPERSEDES TEST-GAP-083 in scope.** TEST-GAP-083 pinned the global `/api/activity` cross-owner visibility; this gap pins the **per-data-entity** read surface (`GET /api/dataentities/{data_entity_id}/activity` via `DataEntityController.getDataEntityActivity` + `ActivityServiceImpl.getDataEntityActivityList`). The OpenAPI-generated `DataEntityApi` interface carries no auth annotations; `DataEntityController` has no `@PreAuthorize`; `ActivityServiceImpl.getDataEntityActivityList` (`:119-136`) has no permission check; `ReactiveActivityRepositoryImpl.findDataEntityActivities` (`:128-142`) issues `DATA_ENTITY.ID.eq(dataEntityId)` unconditionally with no caller-context predicate. The activity payload includes structured `old_state` / `new_state` JSON of every tracked field — descriptions, business names, ownership transitions, dataset-field internal-name edits, custom-metadata values — for entities the caller may have no permission to even SEE in the catalog.

  **Why this is a SEPARATE gap from TEST-GAP-083**:
  - **TEST-GAP-083 scope**: pins the global `GET /api/activity` cross-owner read default — the FEED is visible to any authenticated user
  - **This gap (871) scope**: pins the per-entity `GET /api/dataentities/{id}/activity` cross-owner read — the per-ENTITY history is visible to any authenticated user, even if the entity itself is hidden from the user (e.g. via a future hypothetical permission-scoped catalog)
  - Together they fully characterise the cross-owner audit-visibility surface: BOTH the feed and the per-entity tabs are read-collaborative by default
  - The per-entity surface is operationally MORE sensitive because:
    - Forensic-narrow reads ("show me everything that ever happened to this dataset") are more targeted than feed scans
    - Per-entity reads bypass the date-window guard that the feed enforces (the feed requires beginDate+endDate; per-entity does too but the date window is narrower so the leak is finer-grained)
    - Per-entity activity includes detail like dataset-field internal-name edits that are NOT enumerated in the global feed's filter facets

  **Primary-source chain**:
  - `ActivityServiceImpl.java:119-136` (`getDataEntityActivityList`) — accepts a `dataEntityId` parameter and unconditionally fetches activity; no permission check
  - `ActivityServiceImpl.java:33-273` (lines 33-273) — ZERO `@PreAuthorize` annotations end-to-end (verified line-by-line in sidecar)
  - `ReactiveActivityRepositoryImpl.java:128-142` (`findDataEntityActivities`) — `DATA_ENTITY.ID.eq(dataEntityId)` predicate; NO caller-identity predicate
  - `DataEntityController.getDataEntityActivity` (per `ActivityServiceImpl.md:concepts.audiences`) — the HTTP entry point; no `@PreAuthorize` annotation
  - The OpenAPI-generated `DataEntityApi` carries no auth annotation for this operation
  - Per `ReactiveActivityRepositoryImpl.md:concepts.invariants.[2]` — every read path LEFT JOINs `USER_OWNER_MAPPING ON OIDC_USERNAME = ACTIVITY.CREATED_BY` provider-agnostically; the read posture is HIGH-confidence cross-owner

  **Operator-visible consequences**:
  - **Forensic-trail leakage**: a contractor employee with read-only platform access can request `/api/dataentities/<sensitive-dataset-id>/activity` and read the full edit history of a dataset containing customer PII identifiers (the `old_state` / `new_state` JSON includes description text that may carry PII per `ActivityServiceImpl.md:security.data_exposure.[0]`)
  - **Audit-log discoverability**: an attacker enumerating data-entity IDs (`/api/dataentities/{id}/activity`) can iterate over the entire catalog, reading every entity's edit history without authorization
  - **Compliance disclosure surface**: SOX / GDPR records-of-processing controls may require per-entity audit-visibility to be permission-gated; the current behaviour fails that bar

  **Why HIGH not CRITICAL**:
  - **CRITICAL** is reserved for security-flagged uncovered behaviours where the security_aggregate of the concept is HIGH AND the operator-visible impact is unauthorised mutation or data-loss.
  - Activity Feed concept's security_aggregate flags audit-visibility weaknesses (per concepts.yaml); the operator-visible impact here is data-EXPOSURE not data-mutation.
  - We rate HIGH because: (a) the per-entity surface is more exfiltration-friendly than the global feed; (b) the activity payload carries free-text fields with high PII risk; (c) the absence is a structural defence-in-depth gap, not just a posture documentation gap; (d) the cross-tier verification (controller + service + repository all lack the gate) means the structural fix requires coordinated multi-tier work.

  **Connection to TEST-GAP-083**:
  - TEST-GAP-083 pins `/api/activity` (global feed) cross-owner read
  - TEST-GAP-871 (this) pins `/api/dataentities/{id}/activity` (per-entity tab) cross-owner read
  - TEST-GAP-018 (existing batch entry) pins `getDataEntityActivity` as part of a 27-read endpoint cluster but does NOT focus on the per-entity tab specifically

  **Connection to TEST-GAP-868 + TEST-GAP-869**:
  - TEST-GAP-868 + TEST-GAP-869 pin WRITE-side audit-trail integrity (race + TX coupling)
  - TEST-GAP-871 pins READ-side audit-trail authorization (cross-owner exposure)
  - Together they characterise the audit-trail's full contract surface (write-integrity + read-authorization)
