behaviour: |-
  **MEDIUM — `SessionConfiguration`'s REDIS branch (lines 61-65) only stamps `@EnableRedisWebSession` — no health-check wiring. `application.yml:244-245` ships `management.health.redis.enabled: false` as the default. Operators switching to `session.provider=REDIS` are not nudged to enable the health check. A Redis outage on a session-Redis-only deployment causes 5xx on every authenticated request, but `/actuator/health` does NOT reflect it.**

  Sidecar primary source:
  - SessionConfiguration.java:61-65 — the REDIS branch is JUST `@EnableRedisWebSession`; no `RedisHealthIndicator` bean, no `management.health.redis.enabled: true` recommendation in code or YAML.
  - application.yml:244-245 — `management.health.redis: enabled: false` as the shipped default.
  - WebFetched 2026-05-20 status 200 — live `/configuration-and-deployment/odd-platform#select-session-provider` mentions Spring Session Redis but does NOT recommend enabling the health check.

  **Operator-impact scenario**:
  1. Production operator sets `session.provider=REDIS` for cluster-safety (per TEST-GAP-781 mitigation).
  2. K8s Ingress + Service routes `/actuator/health` to the platform; LB uses 200 OK as health-readiness signal.
  3. Redis outage occurs (planned maintenance, network partition, OOM).
  4. Every authenticated request returns 5xx (session lookup fails).
  5. `/actuator/health` still returns 200 OK (Redis health check is disabled by default).
  6. LB / K8s does NOT remove the platform pod from rotation; users see persistent 5xx.

  **Test gap shape**:
  1. `@SpringBootTest` with `session.provider=REDIS` + Testcontainers Redis; submit `/actuator/health`; assert response body does NOT contain `redis` component (the health check is disabled).
  2. Stop the Redis container; submit an authenticated request; assert HTTP 5xx; submit `/actuator/health`; assert HTTP 200 (the silent-failure surface).
  3. Hypothetical fix-direction: `@TestPropertySource("management.health.redis.enabled=true")`; assert `/actuator/health` returns 503 when Redis is down. CONFIRMS the fix's effectiveness.

  PINS the current silent failure surface until REFACTOR-NNN enables the Redis health-check when `session.provider=REDIS` is selected (via a Spring `@Conditional` or via documented application.yml change).
