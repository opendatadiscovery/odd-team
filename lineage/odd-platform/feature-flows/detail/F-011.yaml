      `provider` for non-empty but NOT `logoutUri`. The sibling
      CognitoLogoutSuccessHandler.java:33-35 carries the matching guard
      (`if (StringUtils.isEmpty(provider.getLogoutUri())) return
      Mono.empty();`); Azure does NOT. An operator who follows the
      live docs but omits `logout-uri` from `auth.oauth2.client.{key}.*`
      boots successfully and hits NPE → 500 at first logout attempt.
      Live OAuth2/OIDC docs (WebFetched 2026-05-19, status 200) state
      OPERATIONALLY: "'logout-uri must be set for Azure SSO. ... leaving
      logout-uri unset raises a NullPointerException and the logout
      flow returns a 500 response.'" — but the platform does NOT
      validate. Additionally: the handler invalidates ONLY the local
      Spring WebSession (line 47) — there is NO outbound HTTP to any
      Microsoft endpoint to revoke the Azure access/refresh/id token.
      Tokens remain valid at Azure until natural TTL (typical access
      60-90 min; refresh up to 90 days for confidential clients).
      Compare: GoogleLogoutSuccessHandler.java:43-54 POSTs to
      `oauth2.googleapis.com/revoke`; GithubLogoutSuccessHandler.java:51-63
      DELETEs `/applications/{client_id}/grant`. Azure does not expose
      RFC 7009 revocation in v2.0 — but the platform-side caveat is
      undocumented and operators with stringent immediate-revocation
      requirements need to know.
    expected: |-
      Either (a) add `StringUtils.isEmpty` early-return guard matching
      Cognito's pattern; AND (b) add `logoutUri` to
      ODDOAuth2Properties.validate when `provider=azure`; AND
      (c) document the no-token-revocation caveat for Azure
      deployments with stringent compliance requirements.
    drift_class: azure_logout_npe_no_token_revoke_local_only
    provenance: |-
      STATIC — primary-source in batch O AzureLogoutSuccessHandler
      sidecar bugs_limitations_corner_cases[0,2] +
      security.known_security_gaps[0,2] +
      docs_link_semantic.doc_drift_findings[0,3] +
      AzureLogoutSuccessHandler.java:39,47 +
      CognitoLogoutSuccessHandler.java:33-35 +
      GoogleLogoutSuccessHandler.java:43-54 +
      GithubLogoutSuccessHandler.java:51-63 +
      ODDOAuth2Properties.java:17-28 +
      WebFetch of `/oauth2-oidc` on 2026-05-19, status 200.
      Severity: HIGH (NPE) / MEDIUM (no token revoke).
  - facet: Cognito logout silent no-op on empty logout-uri — LSN-001 pattern (batch O)
    observed: |-
      CognitoLogoutSuccessHandler.java:33-35 carries
      `if (StringUtils.isEmpty(provider.getLogoutUri())) { return
      Mono.empty(); }` — the ONLY sibling logout handler with this
      graceful-degradation guard (Azure has none → NPE; ODDIAM uses
      getIssuerUri() differently; Google + GitHub do not use
      logoutUri). The asymmetric guard means: a Cognito deployment
      that omits `logout-uri` sees the logout button "work" (no
      error in the response, the HTTP cycle completes) but the user
      STAYS LOGGED IN — no redirect, no local session invalidation,
      no Cognito-side session clear, no warning log. The maintainer
      intent is graceful-degradation (avoid 500 on operator
      misconfig), but the silent-no-op surface is identical to
      LSN-001's bundled-default-causes-data-loss pattern: permissive
      default hides operator error rather than fail-fast. A
      regression that turned this guard into a `throw new
      IllegalStateException("logout-uri required")` would tighten
      the contract but break any deployments intentionally omitting
      `logoutUri` (none today; lock the contract via test).
    expected: |-
      Either (a) emit a one-time WARN log on first
      `Mono.empty()`-return-path triggering, OR (b) move the
      requirement to boot-time validation (add to
      ODDOAuth2Properties.validate when `provider=cognito`), OR
      (c) document the silent-no-op behaviour explicitly.
    drift_class: cognito_logout_silent_no_op_on_empty_uri
    provenance: |-
      STATIC — primary-source in batch O CognitoLogoutSuccessHandler
      sidecar implicit_adrs (graceful-degradation choice) +
      docs_link_semantic.doc_drift_findings (logoutUri omission silent)
      + invariants[2] + CognitoLogoutSuccessHandler.java:33-35 +
      AzureLogoutSuccessHandler.java:30-48 (the no-guard sibling) +
      LSN-001 (the bundled-default-causes-data-loss case law).
      Severity: MEDIUM.
  - facet: OAuth provider-quirks-strategy diverges from abstract base (batch O)
    observed: |-
      Per ADR-CANDIDATE-034 (the provider-quirks-strategy pattern):
      Cognito, Azure, Custom, ODDIAM all extend `AbstractOIDCUserHandler`
      and override two template methods (`getDefault*`); Google +
      GitHub do NOT.
      Google diverges because: (a) the `hd` Workspace-domain claim
      verification has no analogue in the abstract base
      (GoogleUserHandler.java:49-55 — the second of two layers of
      defence-in-depth; the first is the `?hd=` URL mutation at
      OAuthSecurityConfiguration.java:168-175); (b)
      `userNameAttribute` is read from Spring's
      `ClientRegistration.ProviderDetails.UserInfoEndpoint`
      (GoogleUserHandler.java:66-69) NOT from the ODD POJO
      (the abstract base reads `provider.getUserNameAttribute()`);
      (c) `adminAttribute` defaults to the literal `'email'` for
      Google (line 31, GOOGLE_EMAIL), NOT to userNameAttributeName
      (the abstract base's default at AbstractOIDCUserHandler.java:33-35);
      (d) admin-groups absent (see the dedicated facet above).
      GitHub diverges because: (a) the protocol is OAuth2 not OIDC
      — GithubUserHandler.java:32 declares
      `OAuthUserHandler<OAuth2User, OAuth2UserRequest>` (non-OIDC
      variant); (b) GitHub's `/user` payload omits org/team
      membership → TWO outbound HTTP calls (lines 76-85, 104-113;
      THREE total per login including Spring's pre-handler /user
      fetch); (c) admin-principals BYPASS the org-membership gate
      (lines 54-67 fire BEFORE the org-empty check at line 68 —
      undocumented; live docs frame admin-principals as 'Direct
      list of users granted ADMIN role' without flagging the
      org-bypass semantic).
      The F-011 implication: the principal-resolution chain is
      NON-UNIFORM across the 6 providers. A refactor that touches
      the abstract base does NOT touch Google or GitHub. A
      refactor that adds admin-groups support for Google requires
      entirely new code (no inheritance shortcut). The 4 OIDC
      handlers + 2 bespoke handlers + 1 catch-all (Custom) +
      5 logout handlers (the parallel logout dispatch chain) form
      the surface; each carries its own bug class.
    expected: |-
      Either (a) consolidate the pattern under a strategy-pattern
      base (`ProviderUserHandlerStrategy` with hooks for each
      quirk), OR (b) document the divergent set explicitly +
      maintain ADR-CANDIDATE-034 as the canonical reference,
      OR (c) accept the divergence as architecturally intentional
      (the maintainer's stance per the contrasting handler
      implementations).
    drift_class: oauth_provider_quirks_pattern_diverges_from_abstract_base
    provenance: |-
      STATIC — primary-source in batch O GoogleUserHandler sidecar
      implicit_adrs[2] (diverges from AbstractOIDCUserHandler) +
      GithubUserHandler sidecar implicit_adrs[0,1] +
      AzureLogoutSuccessHandler sidecar implicit_adrs[1,2] +
      CognitoLogoutSuccessHandler sidecar implicit_adrs[0] +
      GoogleUserHandler.java:30 (no `extends`) +
      GithubUserHandler.java:32 (non-OIDC interface) +
      CognitoUserHandler.java:16 (extends abstract base) +
      AzureUserHandler.java:16 (extends abstract base) +
      CustomOIDCUserHandler.java:19 (extends abstract base) +
      ADR-CANDIDATE-034. Severity: LOW (architecturally
      intentional; named for cross-batch coherence).
