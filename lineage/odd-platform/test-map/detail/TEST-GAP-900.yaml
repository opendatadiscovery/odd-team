behaviour: |-
  **HIGH — Concurrent double-rotation of the same data-source token is unverified: two
  simultaneous `PUT /api/datasources/{id}/token` calls each receive a DIFFERENT plaintext
  token in their 200 response, but only the later-committed value actually authenticates
  ingestion — the caller who lost the race walks away believing an already-invalid token,
  with no error and no signal.** Method-level primary source from the batch-ZB
  `regenerateDataSourceToken` controller-method sidecar:

  - There is exactly one `token` row per data source (1:1 via `token_id`) and
    `ReactiveTokenRepositoryImpl.updateToken` issues `UPDATE ... WHERE TOKEN.ID.eq(id)`
    (ReactiveTokenRepositoryImpl.java:33-36). Two simultaneous rotations both UPDATE the
    same row — last-write-wins.
  - There is NO `@Version` column and NO optimistic-lock predicate (no `WHERE updated_at =
    :prev`). No lost-update is DETECTED — but the row is never corrupted; it always holds
    exactly one valid token value.
  - **The observable defect**: caller A and caller B each generate a fresh random token
    (`tokenGenerator.regenerateToken` mints a new value per call) and each receives a
    DIFFERENT plaintext token in their 200 response. Only the later-committed value
    authenticates against `IngestionDataEntitiesFilter`. The race-loser copied a token
    that is already dead.
  - This compounds with the related replay-safety gap (the PUT is NOT idempotent — sidecar
    `stress_findings.resource_boundaries`): a UI double-submit / network retry rotates the
    token twice, invalidating the value from the first response before the operator can
    use it. No `If-Match` ETag, no idempotency key (DataSourceController.java:53-59 consults
    no header).

  **Why HIGH**: an operator rotating a token, then finding the token they copied "does not
  work," has no way to diagnose the cause (no error, no audit log — see TEST-GAP-906). For
  a security-critical credential operation this is a real operational hazard, not a
  hypothetical. The endpoint has ZERO direct test coverage (Glob-verified — no
  `DataSourceControllerTest`, no `DataSourceServiceImplTest`). A regression that introduced
  a duplicate-token-row bug, or that broke the last-write-wins resolution, would go
  unnoticed.

  **Test gap shape**: a `@SpringBootTest` concurrency test that: (1) registers a data
  source; (2) fires two concurrent `PUT /api/datasources/{id}/token` calls; (3) asserts
  both return 200 with DISTINCT plaintext tokens; (4) asserts exactly one `token` row
  exists for the data source (no duplicate); (5) asserts the DB-persisted value equals
  exactly one of the two response tokens, and that the OTHER response token does NOT
  authenticate `POST /ingestion/entities`. Pinned by probe P-050.
test_class: missing-integration
criticality_rationale: |-
  HIGH per Rule 3: the regenerateDataSourceToken node carries a HIGH-severity
  security_aggregate (destructive rotation, no audit log). The concurrent-double-rotation
  gap is itself a correctness-under-concurrency hazard on a security-critical credential
  operation — the race-loser holds a dead token with no signal. The sidecar rates the
  uncovered behaviour HIGH. Not CRITICAL — no corruption occurs and the row always holds a
  valid token; the consequence is operator confusion + a wasted credential, not a
  cross-boundary security breach. pillars_affected len 1 (P-08) — no cross-pillar bump.
