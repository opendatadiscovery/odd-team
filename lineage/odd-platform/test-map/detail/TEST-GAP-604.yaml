  - "CognitoLogoutSuccessHandler.md:tests_coverage_semantic.uncovered_behaviours.[8]"
behaviour: |-
  **Cognito `/logout` endpoint signs out of Cognito ONLY — does NOT sign out federated upstream IdPs (Google/Facebook/SAML).** Per AWS Cognito docs (WebFetched 2026-05-19 status 200): "The logout endpoint doesn't sign users out of OIDC or social identity providers (IdPs). To sign users out from their session with an external IdP, direct them to the sign-out page for that provider." This handler ONLY redirects to Cognito's `/logout` (line 40-46) — it does NOT enumerate or initiate logout flows for any upstream IdP the user authenticated via. An ODD deployment that federates Cognito → Google (a common Cognito User Pool setup) will see a user "logged out" of ODD + Cognito but the user's Google session remains active — a subsequent login attempt skips the Google password prompt. The ODD docs do not warn about this. For deployments with stringent compliance (immediate global signout), this is a security-policy gap.
test_class: missing-security
