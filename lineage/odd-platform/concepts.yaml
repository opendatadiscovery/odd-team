      hot_paths: []
      throughput_shape:
        verdict: "N/A"
        detail: "Config-key concept, not a throughput surface. The label-append cost is part of the parent Metrics Ingestion concept's hot path."
      scaling_shape:
        verdict: HORIZONTALLY_SCALABLE
        detail: "tenantId is captured at bean construction; horizontally scalable extractor instances each carry their own immutable copy of the configured value. No coordination, no contention."
      strengths:
