  - "odd-platform ts components/shared/elements/EntityClassItem ui-shell-widget:EntityClassItem"
  - "odd-platform ts components/shared/elements/EntityTypeItem ui-shell-widget:EntityTypeItem"
contributing_nodes:
  - node_id: "odd-platform ts components/shared/elements/EntityClassItem ui-shell-widget:EntityClassItem"
    role: class-badge-widget
    note: |-
      EntityClassItem.tsx:13-29 — a 28-line stateless functional component
      taking `entityClassName?: DataEntityClassNameEnum`, `fullName?: boolean`,
      `large?: boolean`, `sx?`. The chip's background colour is keyed off
      `theme.palette.entityClass[$entityClassName]` (per
      EntityClassItem.styles.ts:16). The label is resolved from
      `DataEntityClassLabelMap.get(entityClassName)` (per lib/constants),
      rendering either the `.short` form (default) or the `.normal` form
      (when `fullName` true). Title attribute uses the `.normal` form for
      hover-text. ui_unverified for the actual class-set palette (DS /
      CONSUMER / QUALITY_TEST / etc.) — needs the theme.palette.entityClass
      + DataEntityClassLabelMap reads to confirm the operator-visible label set.
  - node_id: "odd-platform ts components/shared/elements/EntityTypeItem ui-shell-widget:EntityTypeItem"
    role: type-badge-widget
    note: |-
      EntityTypeItem.tsx:13-19 — a 16-line stateless wrapper rendering the
      type-name via `stringFormatted(entityTypeName, '_', 'all')` (the
      underscore-stripping all-caps formatter). The chip's backgroundColor
      is `theme.palette.backgrounds.primary` — UNLIKE the class badge, the
      TYPE badge does NOT colour-code per type. The chip itself is
      content-only; the only visual distinction is the rendered text. The
      special-case `'DCT'` is hardcoded into the prop type as a union with
      the OpenAPI-generated enum (`DataEntityTypeNameEnum | 'DCT'`).
  - node_id: "odd-platform ts react-component:ResultItem"
    role: search-results-consumer
    unresolved: true
    note: |-
      Search/Results/ResultItem mounts EntityClassItem one per class on
      each search-result row. (Search results: see F-017.)
  - node_id: "odd-platform ts react-component:EntityItem"
    role: directory-list-consumer
    unresolved: true
    note: |-
      Directory/Entities/EntitiesList/EntityItem mounts EntityClassItem +
      EntityTypeItem per directory entry. (Directory: see F-023.)
  - node_id: "odd-platform ts react-component:DataEntityDetailsHeader"
    role: detail-header-consumer
    unresolved: true
    note: |-
      DataEntityDetails/DataEntityDetailsHeader mounts EntityClassItem in
      the `large` variant + EntityTypeItem above the entity name. The
      detail-page chrome's class-badge surface.
