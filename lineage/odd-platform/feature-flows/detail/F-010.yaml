    AlertHousekeepingJob + SearchFacetsHousekeepingJob +
    DataEntityHousekeepingJob + ActivityEmptyPartitionsHousekeepingJob +
    MessageEmptyPartitionsHousekeepingJob. THIS BATCH adds the
    SIXTH housekeeping-shaped job — `PostgreSQLSessionHousekeepingJob`
    triggered by `PostgreSQLSessionHousekeepingJobHandler.java:13`
    `@Scheduled(fixedRate = 1, timeUnit = HOURS)`. The job deletes
    expired rows from `SPRING_SESSION` + `SPRING_SESSION_ATTRIBUTES`.
    It is activated ONLY under `session.provider=INTERNAL_POSTGRESQL`,
    so a default-config (`IN_MEMORY`) deployment does not run it.
    The job does NOT share the 15-min cadence + 14m/14m ShedLock
    window of the HousekeepingJobManager-orchestrated 5 — it has
    its own hourly cadence + (load-bearing finding 2 below) NO
    leader-election guard at all. NEW drift facet for F-010:
    `postgresql_session_housekeeping_job_is_sixth_housekeeping_shaped_job_not_enumerated_distinct_cadence_provider_gated`.

    (2) **POSTGRESQLSESSIONHOUSEKEEPINGJOB HAS NO @SchedulerLock —
    MULTI-INSTANCE RACE PRIMARY-SOURCE (HIGH severity — operational
    inconsistency)** — `PostgreSQLSessionHousekeepingJobHandler.java:13`
    declares `@Scheduled(fixedRate = 1, timeUnit = TimeUnit.HOURS)`
    with NO `@SchedulerLock` annotation, NO advisory-lock pattern,
    NO `@ConditionalOnProperty` leader-election guard. INCONSISTENT
    with EVERY OTHER `@Scheduled` job in the codebase: (a) the 5
    housekeeping jobs orchestrated by HousekeepingJobManager use
    the named `housekeepingJob` ShedLock (line 26); (b)
    NotificationSubscriber uses `notifications.wal.advisory-lock-id`
    (default 100); (c) DataCollaborationConfiguration receive-event
    + sender jobs use `datacollaboration.*` advisory-lock-ids
    (application.yml:201-202); (d) ActivityTablePartitionManager
    uses the `odd.activity.partitioning-advisory-lock-id`. The
    session housekeeping job is the SOLE `@Scheduled` job without
    leader-election visible in the codebase. On a multi-instance
    `INTERNAL_POSTGRESQL` deployment, EVERY instance runs the job
    hourly: N instances × hourly = N× DB load per hour. The
    deletes are idempotent (the WHERE clause `expiry_time < now()`
    sees no new matches on subsequent runs in the same minute) so
    correctness is preserved, but the load is wasteful and
    inconsistent with the platform pattern. NEW drift facet for
    F-010:
    `postgresql_session_housekeeping_job_no_scheduler_lock_multi_instance_race_load_n_times_inconsistent_with_5_jobs_pattern`.

    (3) **SESSION HOUSEKEEPING IS A NO-OP UNDER `spring.session.timeout: -1`
    (HIGH severity — operational data-growth surface)** —
    `application.yml:2-3` ships `spring.session.timeout: -1` (the
    NEVER-EXPIRE default). The session housekeeping job's WHERE
    clause is `expiry_time < now()` (per PostgreSQLSessionHousekeepingJob.java:30);
