behaviour: |-
  **HIGH — The 4212-line `openapi.yaml` + 2937-line `components.yaml` together declare 194 operations across 35 tags but contain ZERO `securitySchemes` blocks AND ZERO operation-level `security:` declarations.**

  **Verified by Grep**:
  - `openapi.yaml` Grep `securitySchemes` → 0 matches.
  - `openapi.yaml` Grep `security:` → 0 matches.
  - `components.yaml` Grep `securitySchemes` → 0 matches.

  **What this MEANS for SDK consumers**:
  - SDK generators producing typed clients from this spec emit NO authentication code — no `Bearer` token wiring, no session cookie handling, no `X-API-Key` injection.
  - Third-party integrators MUST hand-author auth glue per their target language. The hand-authoring is the easiest place for misconfiguration.
  - Operators evaluating ODD against incumbent alternatives (which usually DO declare auth in OpenAPI) see ODD's spec as "auth-less" — possibly believing the API IS auth-less.

  **Confirmed by the spec's contrast with live docs**: the security configuration page at `/configuration-and-deployment/enable-security` (WebFetched 2026-05-20 per openapi-spec.md docs_link_semantic.inferred_docs.[0] + cross-batch evidence) enumerates 4 UI auth modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP) + S2S API-key + Ingestion filter. NONE of these are machine-readable from the spec.

  **The contract-test gap on the SECURITY axis is HIGH-severity** because:
  - The auth model IS enforced server-side (via `SecurityConstants.SECURITY_RULES`, `SecurityWebFilterChain`, `AuthorizationCustomizer`).
  - But the model is NOT declared in the API contract.
  - The DRIFT class (server-side enforces X, spec declares NOTHING) is exactly the class that produces REFACTOR-217 (path-mismatch silently disabled authorization) — see TEST-GAP-830 sister.

  **Why HIGH** (the sidecar rates MEDIUM): the **absence of a contract-conformance test** is the structural finding. A contract test that compared `SecurityConstants.SECURITY_RULES` paths × permission requirements against the spec's declared operation-id → permission mapping would have caught REFACTOR-217 at spec-authoring time (instead of at sidecar-audit time, where it lived for an unknown number of releases as a silent authorization bypass). The same class of drift is loaded into every operation that the spec declares without a `security:` block — the spec cannot REFUTE a future drift.

  **Test gap shape**: a build-time contract test that:
  1. Parses `openapi.yaml` + `components.yaml`.
  2. Asserts at LEAST ONE `securitySchemes` block exists.
  3. Asserts every operation under `/api/*` declares a `security:` block OR is listed in an explicit "public unauthenticated allowlist" config.
  4. Asserts every operation has a documented `permissionRequired` extension (`x-permission`) matching the runtime `SECURITY_RULES`.

  PINS the current zero-declaration state; pairs with REFACTOR-NNN (declare auth in spec) and DOC-GAP-NNN (the openapi-spec sidecar's doc-drift findings).
