name: Dispatch Alert Notification via WAL Fan-Out
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
description: |-
  **NEW OPERATION, batch 2026-05-19K** — the load-bearing
  outbound-notification dispatch operation. Per WAL message received by
  `NotificationSubscriber` from the named Postgres replication slot, the
  dispatcher (`AlertNotificationMessageProcessor.process(decodedMessage)`
  at `notification/processor/AlertNotificationMessageProcessor.java:23-36`)
  performs three steps:
    1. **Translate** — `messageTranslator.translate(message)` enriches the
       DecodedWALMessage into an AlertNotificationMessage via a
       multi-statement jOOQ read: alert_chunk rows + alerted-data-entity
       join (owner / namespace / data_source) + recursive downstream-lineage
       CTE bounded by `notifications.message.downstream-entities-depth`.
       UNCAUGHT — translation failures throw `IllegalArgumentException`
       (unknown alert-type code) or `IllegalStateException` (missing
       alerted-entity row); both propagate OUT of process() to
       NotificationSubscriber's outer catch which logs and waits 10s
       before re-acquiring the lock (poison-message WAL replay loop).
    2. **Fan-out** — synchronous for-loop over `List<NotificationSender>`
       at lines 26-30 calling `.send(notificationMessage)` on each
       registered sender. Spring's bean-collection iteration order is
       package-scan-order-dependent and undefined; operators cannot
       predict whether Slack runs before email or vice versa.
    3. **Per-sender catch-and-continue** — `try { notificationSender.send(...);
       } catch (NotificationSenderException e) { log.error(...); }` at
       lines 29-35. The loop continues to the next sender on
       checked-exception failure. EmailNotificationSender violates this
       contract by throwing `RuntimeException` (NOT NotificationSenderException),
       bypassing the catch and aborting fan-out mid-message.
  After dispatch returns (successfully or via exception), NotificationSubscriber
  advances `setAppliedLSN(lsn).setFlushedLSN(lsn)` UNCONDITIONALLY at
  NotificationSubscriber.java:83-84 — the dispatcher has no way to signal
  "do not advance LSN". The architectural anchor: this is the platform's
  PRIMARY outbound-delivery operation — every alert raised in the platform
  (by ingestion-side schema-diff detection, by AlertManager webhook, by
  manual user action) flows through THIS operation to reach external
  channels.
