# Ingestion Credential Lifecycle — product-owner reflection

## product_owner_narrative

The Ingestion Credential Lifecycle is the operator-facing flow for the 40-character bearer tokens that every ODD collector and push-client presents on `POST /ingestion/*` to prove it is allowed to write to the catalog. From the operator's seat it lives on two Management tabs — **Collectors** (`/management/collectors`, the `CollectorsList` → `CollectorItem` → `CollectorItemToken` tree) and **Datasources** (`/management/datasources`, the `DataSourceItem` → `DataSourceItemToken` control) — and it is the SECURITY-load-bearing infrastructure beneath pillar P-09 (the token IS the ingestion auth credential) and pillar P-10 (every integration depends on a token minted here) (per system-mission P-08 sub-feature seed "Collectors tab — issue + rotate tokens"; per the F-125 cross_pillar_relationships feeds P-09 + P-10). The audiences are the **platform-operator** rotating a leaked or scheduled-rotation credential, and — at the wire — the **odd-collector runtime** whose next ingestion call breaks the instant a token is rotated out from under it.

A user interacts with the feature in four moves. First, **issuing**: registering a collector/datasource returns a 40-char plaintext token in the response body, rendered once on screen with a Copy button and the one-time warning "Save token in a secure location. You will not be able to retrieve it again." (per DataSourceItemToken understanding + CollectorItem.tsx:87-98). Second, **viewing**: every subsequent list fetch returns the token masked as `******`+last-6, and the UI infers "this is masked, show Regenerate not Copy" from a literal `token.value.substring(0,6) === '******'` prefix sniff (per DataSourceItemToken implicit_adrs[0] + CollectorsList concepts.invariants[2]). Third, **rotating**: the permission-gated "Regenerate" button (`DATA_SOURCE_TOKEN_REGENERATE` / `COLLECTOR_TOKEN_REGENERATE`, MANAGEMENT tier) opens a ConfirmationDialog ("Are you sure you want to regenerate token for this datasource?") and on confirm fires `PUT /api/{datasources|collectors}/{id}/token`, which does a destructive in-place `UPDATE token SET value=<new>` — the old value is irrecoverably overwritten with no overlap window (per regenerateDataSourceToken understanding + ReactiveTokenRepositoryImpl.java:30-39 via the sidecar). Fourth, **retiring**: deleting a collector/datasource soft-deletes the parent (`UPDATE ... SET deleted_at=NOW()`) but leaves the token row dangling — the `token` table has no `deleted_at` column at all (per ReactiveCollectorRepositoryImpl invariants[1] + V0_0_28__add_token.sql:1-9 cited therein).

The working parts an operator would want explained, phrased as they live them: (a) rotation is **instant and binary** — there is no "old + new both valid for 24h" grace window, so the collector deployed on the operator's own infrastructure must be reconfigured with the new token at the moment of rotation or ingestion stops with 401 `Token is not correct` (per regenerateCollectorToken bugs[0], HIGH); (b) the new plaintext is **one-time-reveal** — navigate away or let the list refetch before copying and the only recovery is to Regenerate AGAIN, i.e. another destructive rotation (per DataSourceItemToken bugs[2]); (c) the credential is **plaintext at every layer** — generated verbatim by `RandomStringUtils.randomAlphanumeric(40)`, stored in `token.value VARCHAR(40)` with no hash and no UNIQUE constraint, matched by literal SQL `.eq()` on the always-on `IngestionDataSourceFilter` path (per ReactiveCollectorRepositoryImpl implicit_adrs[0] + the `CollectorTokenStorageKnownBugTest` PLT-085 pin); (d) rotation and delete are **forensically near-silent** — no Activity Event, no audit-log row, only `token.updated_by` (which is NULL under `auth.type=DISABLED`) which is overwritten on the next rotation (per regenerateCollectorToken bugs[1], HIGH).

The integration story makes the stakes concrete. This feature is the credential-MINTING side; pillar P-09's ingestion filters (`IngestionDataSourceFilter` always-on, `IngestionDataEntitiesFilter` opt-in via `auth.ingestion.filter.enabled`) are the credential-VALIDATING side, and they consume `token.value` by plaintext equality (per ReactiveCollectorRepositoryImpl coupling). Every collector and datasource in pillar P-10 depends on a token from this flow; the cleanup of retired credentials is owned by F-010's HousekeepingJobManager — but that job iterates exactly FIVE cleanup beans (Alert, SearchFacets, DataEntity, ActivityEmptyPartitions, MessageEmptyPartitions) and NONE of them touches the `token` table (per HousekeepingJobManager understanding + concepts.entities — five jobs enumerated, no token job). The fix surface for the orphan problem therefore straddles three features (the credential UI here, the delete paths in F-020/F-031, and the housekeeping cascade in F-010).

Edge cases a product owner would flag in a demo, and which the docs are silent on: a deployment running for a year accumulates every historical credential of every long-gone collector in a single PG table (a backup/replica/pg_dump leak then exposes ALL of them, not just the live ones); an operator who clicks Regenerate during active ingestion breaks a running pipeline with no warning at the point of decision (the dialog asks "are you sure?" but never says "this kills the old token immediately"); and an operator on a default `auth.ingestion.filter.enabled=false` deployment who rotates a "leaked" token has changed a credential that has ZERO security effect on `/ingestion/entities` (which is anonymously reachable regardless) — the UI promises a security property the default deployment does not enforce (per CollectorsList bugs[4], HIGH).

## hypotheses

- id: H-001
  hypothesis: "When an operator deletes a retired collector or datasource, the bearer token it used is cleaned up (removed, or at minimum prevented from accumulating), so an operator auditing the `token` table after a year of churn does not find every credential the platform has ever minted still sitting there."
  derivation: "Pillar mission (P-08 operator hygiene) + the feature name 'Credential Lifecycle' promises a full lifecycle including retirement; an operator's default mental model is that deleting the parent reclaims its secret. Tested against the token table's schema + the housekeeping cascade's job list."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The token row is orphaned FOREVER, on BOTH credential surfaces. (1) The `token` table has no `deleted_at` /
      `is_deleted` / STATUS column at all (V0_0_28__add_token.sql:1-9 — only id, value, created_at/by, updated_at/by,
      cited in the ReactiveCollectorRepositoryImpl sidecar invariants[1]). (2) Collector/datasource soft-delete does
      `UPDATE ... SET deleted_at=NOW()` on the PARENT only and never deletes the token (ReactiveCollectorRepositoryImpl
      bugs[1]; the partial unique index `collector_token_unique ON collector(token_id) WHERE deleted_at IS NULL` even
      EXPLICITLY allows a soft-deleted collector's token_id to persist). (3) The HousekeepingJobManager iterates exactly
      five cleanup beans (Alert, SearchFacets, DataEntity, ActivityEmptyPartitions, MessageEmptyPartitions) — none touches
      the token table; a grep for `DELETE FROM token` across src/main/java returns zero matches (HousekeepingJobManager
      concepts.entities + the feature-flow's own drift evidence). The credential lifecycle has an issue/rotate/view path
      but no retire path.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveCollectorRepositoryImpl.md
        section: "concepts.invariants[1] + bugs_limitations_corner_cases[1] + security.known_security_gaps[3]"
        cite: "V0_0_28__add_token.sql:1-9 (no deleted_at) + V0_0_33__add_token_constraints.sql:1 (partial index allows orphan) + ReactiveAbstractSoftDeleteCRUDRepository.java:50-58"
        note: "Token has no soft-delete column; soft-deleting the parent leaves the token row live and discoverable."
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: "understanding + concepts.entities (the five-job enumeration)"
        cite: "HousekeepingJobManager.java:23,31 (List<HousekeepingJob> of 5 beans, none token-related)"
        note: "The cleanup cascade has no token leg; nothing ever purges orphaned tokens."
    operator_visible_failure: |
      (1) Unbounded growth: an operator auditing `SELECT count(*) FROM token` vs `SELECT count(*) FROM collector WHERE
      deleted_at IS NULL` finds the gap widening monotonically with every delete + every rotation, with no obvious source
      (the parent rows are soft-deleted and invisible). (2) Security blast-radius amplification: combined with plaintext-at-rest
      (H-005), a single pg_dump / replica / backup leak exposes EVERY collector token the platform has EVER minted — including
      every retired collector's — not just the live set. (3) The fix is genuinely cross-feature: a per-delete cleanup in
