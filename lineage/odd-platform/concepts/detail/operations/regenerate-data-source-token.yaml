name: Regenerate Data Source Token
canonical_in_docs: false
canonical_candidate: true
description: |-
  PUT /api/datasources/{data_source_id}/token — gated by
  DATA_SOURCE_TOKEN_REGENERATE Permission (MANAGEMENT scope) at
  SecurityConstants.java:124-126. The controller's
  regenerateDataSourceToken handler (DataSourceController.java:53-59)
  is a one-line delegation to DataSourceServiceImpl.regenerateDataSourceToken
  (DataSourceServiceImpl.java:99-106 — NOTABLY NOT @ReactiveTransactional;
  cf. the surrounding @ReactiveTransactional create/update/delete
  methods at lines 52, 69, 86). The service: (1) loads the existing
  DTO via dataSourceRepository.getDto(id) — throws NotFoundException
  if absent; (2) calls tokenGenerator.regenerateToken(existingTokenPojo)
  — returns a new TokenDto in memory; (3) tokenRepository.updateToken(newToken)
  — UPDATE token SET value = ?, updated_at = ?, updated_by = ?
  WHERE id = ?. Returns 200 with the new plaintext token visible
  in DataSource.token.value (showToken=true). Token rotation IS
  DESTRUCTIVE: old token value is OVERWRITTEN; no grace period;
  no `token_old_value` column. A collector still using the old
  token starts failing authentication on its next request
  (IngestionDataSourceFilter throws AccessDeniedException). NO
  warning logged to operators; NO email/notification fires.
  Missing @ReactiveTransactional means partial-rotation failure
  mode: if tokenGenerator.regenerateToken succeeds (in-memory)
  but tokenRepository.updateToken fails (DB write fails), the
  new token exists in the response body only, NOT in the DB; the
  collector still authenticates with the OLD token (still valid).
  Same SAME architectural surface as regenerateCollectorToken
  (both rotate tokens in the same TOKEN table; same plaintext-everywhere
  chain).

  STRENGTHENED — regenerateDataSourceToken (batch 2026-05-21ZB): the
  method-level sidecar REFINES the missing-@ReactiveTransactional
  finding to its conclusion — the missing annotation does NOT produce
  a partial-write bug TODAY because the only DB write
  (tokenRepository.updateToken) is a SINGLE atomic jOOQ UPDATE and
  tokenGenerator.regenerateToken is purely in-memory; there is NO
  state where the old token is invalidated but the new one is not
  persisted. Severity is therefore a LOW code-shape inconsistency /
  latent-risk (a FUTURE second write to the method would not be
  atomic), NOT an active atomicity bug. The method-level sidecar
  additionally surfaces: the credential downstream-consumer is
  IngestionDataEntitiesFilter (POST /ingestion/entities), which does
  a literal plaintext `.equals(token)` (IngestionDataEntitiesFilter.java:56-57)
  — the data-source token and the collector token are DISTINCT
  credentials and this endpoint rotates ONLY the data-source token.
