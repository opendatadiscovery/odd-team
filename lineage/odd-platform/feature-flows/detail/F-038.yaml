    observed: |-
      JSONSerDeUtils.deserializeJson (SlackEventParser.java:23) is
      called inside `.map(slackEventParser::parse)` without a
      try/catch; an IOException-class failure propagates as a reactive
      error and the response shape is determined by the global Spring
      WebFlux error handler. Untested, undocumented, and may return
      a non-2xx response that Slack interprets as "retry this event".
    expected: |-
      Catch deserialization failures explicitly + return 200 (since
      Slack will retry on non-2xx) + log the malformed payload for
      operator diagnosis.
    drift_class: malformed_json_request_body_undefined_http_status
    provenance: |-
      STATIC — primary-source in batch ZF EventApiController sidecar
      bugs_limitations_corner_cases[5] + SlackEventParser.java:22-23.
      Severity: MEDIUM.
  - facet: unchecked inner-event cast throws ClassCastException
    observed: |-
      SlackEventParser.java:45 performs an unchecked cast
      `(Map<String, Object>) requestMap.get("event")`; if a malicious
      payload sends `event: "string-not-object"` or `event: 42`,
      ClassCastException propagates from inside the parse step.
      Same response-shape uncertainty as the malformed-JSON case.
    expected: |-
      Defensive `instanceof Map` check before the cast + return ack
      on failure.
    drift_class: unchecked_event_inner_cast_classcastexception_5xx
    provenance: |-
      STATIC — primary-source in batch ZF EventApiController sidecar
      bugs_limitations_corner_cases[6] + SlackEventParser.java:45.
      Severity: LOW.
  - facet: unknown Slack event types silently filtered (log.debug only)
    observed: |-
      The Slack app manifest in the docs subscribes only to
      `message.channels`, but additional event subscriptions configured
      in the Slack UI but not handled in SlackEventParser are dropped
      at `log.debug` level (SlackEventParser.java:38-43) with NO DLQ,
      NO metric, NO operator-visible signal. The trade-off (silent
      drop in exchange for no Slack retry storm) is intentional but
      undocumented.
    expected: |-
