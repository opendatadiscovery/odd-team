feature_name: |-
  Notification Settings dialog — react-hook-form dialog mounted on the
  Alerts tab that mutates `incompatibleSchemaHaltUntil` /
  `failedDqTestHaltUntil` / `failedJobHaltUntil` /
  `distributionAnomalyHaltUntil` via
  `PUT /api/dataentities/{id}/alert_config`. Permission-gated via
  `WithPermissions` on `DATA_ENTITY_ALERT_CONFIG_UPDATE`.
