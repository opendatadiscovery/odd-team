proposed_action: |-
  Testcontainers integration test. (a) Create a Collector via the service. Note the assigned token_id. (b) Soft-delete via `CollectorServiceImpl.delete(collectorId)`. (c) Query: `SELECT * FROM token WHERE id = ?token_id`. Assert: the row still exists with `value` populated (plaintext). (d) Query: `SELECT * FROM collector WHERE id = ?collectorId`. Assert: `deleted_at IS NOT NULL`. (e) Query: `SELECT EXISTS(SELECT 1 FROM token t LEFT JOIN collector c ON c.token_id = t.id AND c.deleted_at IS NULL WHERE t.id = ?token_id AND c.id IS NULL)`. Assert: TRUE (the orphan exists). (f) Pin the retention gap: `// REGRESSION-PIN — Soft-deleting a Collector leaves the TOKEN row indefinitely. REFACTOR-NNN will introduce OrphanedTokenHousekeepingJob; this test flips to assert the orphan is DELETEd within one housekeeping cycle.`
