- id: H-002
  hypothesis: |-
    "When the operator configures three links in a specific YAML order, the user sees them in that
    same order in the menu (declaration order is preserved)."
  derivation: |-
    Operators commonly rely on insertion order to put the most-used runbook first. Spring's relaxed
    binder preserves indexed-property order; the controller streams without sort; the UI maps without
    re-sort. No field promises sorting, so the user expectation is "the order I typed".
  seed_source: response-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      No layer re-orders. Spring's @ConfigurationProperties relaxed binder preserves odd.links[0],
      [1], [2] declaration order; LinksController does linkProperties.links().stream().map(...).toList()
      with no ORDER BY (there is no SQL — it is an in-memory list); AppInfoMenu renders links.map(...)
      in array order. The effective order IS the YAML/env declaration order. The one caveat: this
      contract is asserted by NO test, and Spring's binder behaviour is the only guarantor — a Spring
      Boot upgrade that changed binder semantics would silently break it (which is exactly why P-128
      exists).
    evidence:
      - sidecar: odd-platform__java__LinksController__controller-class__LinksController.md
        section: stress_findings.orderings
        cite: "LinksController.java:31-33"
        note: "stream().toList() preserves AdditionalLinkProperties.links() order; no explicit sort."
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: stress_findings.orderings
        cite: "AppInfoMenu.tsx:60-66"
        note: "UI renders in API order without re-sort."
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: render
    coverage: unverified
    test_demand: functional

