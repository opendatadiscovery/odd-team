behaviour: |-
  **MEDIUM — the operator's filter selection does NOT survive navigating away from `/data-quality` and back: the `<DataQualityAtomProvider>` (`DataQualityProvider.tsx:4-6`) is the dashboard's jotai `<Provider>` scope; React Router unmounts the route element on navigation away, destroys the Provider + its store, and the next mount starts a fresh all-empty `formFiltersAtom` (`DataQualityStore.ts:11-22`). The operator loses their filter slice with no warning. The URL search params (written by `DataQualityFilters`' second `useEffect`, see TEST-GAP-913) are the ONLY persistence channel — and the URL bar typically gets cleared on a tab navigation away from `/data-quality`. No test pins the per-mount-reset behaviour, so a regression that accidentally widens the Provider scope (e.g. lifts it to App.tsx) silently changes the UX from "fresh-per-visit" to "sticky-across-visits".**

  **The contract** (statically certain):
  - `App.tsx:73` mounts `<Route path={dataQualityPath()} element={<DataQuality />} />` — a SINGLE non-wildcard Route. React Router unmounts `element` on navigation away.
  - `<DataQuality>` mounts `<DataQualityAtomProvider>` as its OUTERMOST element (`DataQuality.tsx:8-17`).
  - `DataQualityAtomProvider` is a thin pass-through over jotai's `<Provider>` (`DataQualityProvider.tsx:4-6`) — creating a fresh atom store per mount.
  - On unmount: the Provider's store is GC'd; the next mount creates a new store with `formFiltersAtom = {all-empty}`.
  - The URL is the only filter-persistence channel; the rest of the app does not preserve `/data-quality` query params on navigation.

  **What can silently break**:
  - A maintainer "fixes" the per-mount reset by lifting `<DataQualityAtomProvider>` to App.tsx (so the store outlives the route). Operator UX silently changes from "fresh visit" to "sticky selection" — could be desirable, but the doc-side silence (live `dashboard.md` does not document either) means the operator has no signal which to expect.
  - A maintainer adds a second `<Route path={dataQualityPath()}>` (e.g. for a sub-route) and the routing matches both, but only one renders — the Provider mounts/unmounts depending on which route matches first.

  **No test pins this**. The doc-side is silent (DataQualityStore.md:docs_link_semantic.doc_drift_findings.[0]).

  **Test gap shape**: integration test using a `<MemoryRouter>` with multiple navigation entries. Step 1: mount at `/data-quality`; select filter chips; assert the atom holds them. Step 2: navigate to `/`; assert the route unmounts. Step 3: navigate back to `/data-quality`; assert the atom is FRESH (all-empty). PINS the per-Provider-mount reset.
