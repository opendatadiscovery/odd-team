proposed_action: |-
  Add `DatasetVersionVerbatimDescriptionReadSideTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `getDataSetStructure_returnsInternalDescriptionVerbatim_includingScriptTags_pinsLatestPathContract` — seed a dataset_field with `internal_description = '<script>alert("F-004")</script>'`; GET `/api/datasets/{id}/structure`; assert the response body contains the literal script tag (verbatim, not URL-encoded, not HTML-entity-escaped).
  2. `getDataSetStructureByVersionId_returnsVerbatim_pinsByVersionContract` — sister test on the by-version path.
  3. `getDataSetStructureDiff_returnsVerbatimInBothSnapshots_pinsDiffContract` — seed two versions with different script payloads; GET the diff; assert BOTH script payloads are in the response verbatim (in the before-snapshot and after-snapshot field).
  4. `getDataSetStructure_returnsLengthUnbounded_pinsNoLengthCapAtApi` — seed `internal_description` with a 50KB string; GET `/api/datasets/{id}/structure`; assert the response carries the full 50KB payload (no truncation).

  Pair with REFACTOR-NNN: add API-tier sanitisation OR validation on `dataset_field.internal_description` writes (DatasetFieldController PUT path); the read path then relies on the at-write defence + the UI Markdown.tsx defence-in-depth.

  Cross-pair with probe candidate: launch a fresh probe targeting the Dataset → Structure tab's DatasetField description render path to verify Markdown.tsx is applied — symmetric to probe P-009 for entity descriptions.

  Cross-pair with DOC-NNN: surface the verbatim-storage class on the Data Discovery doc; warn API consumers (BI tools, custom scripts) that the API returns descriptions verbatim.
