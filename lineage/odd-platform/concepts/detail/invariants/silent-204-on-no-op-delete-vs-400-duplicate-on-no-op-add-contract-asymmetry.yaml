mitigations_unimplemented:
  - |-
    Document the contract asymmetry on
    /developer-guides/api-reference for the DEG-membership pair — the
    OpenAPI spec at openapi.yaml:1070-1105 declares the 200/204 responses
    but does not name the idempotence asymmetry.
  - |-
    Add operator-facing guidance in
    /features/data-discovery/groups-domains.md naming the idempotence
    contract: ADD is non-idempotent (400 on duplicate); DELETE is
    silently idempotent (204 on no-op).
  - |-
    Add regression tests that pin both halves of the asymmetry:
      (a) POST already-in-DEG returns 400 with the specific message;
      (b) DELETE non-member returns 204 silently;
      (c) UPSERT non-existent pair returns 200 with empty body (matching
          the upsert-family pattern).
  - |-
    Consider unifying the response shape — either ADD becomes silently
    idempotent (return 200/204 with no-change semantics), OR DELETE
    becomes 404-on-missing. The current asymmetry is intentional but
    operator-surprising; a unified contract would simplify automation.
notes: |-
  NEW invariant captured in batch 2026-05-19L. The pattern is intentional
  and consistent with the platform's broader "deliberate silent-success on
  no-op" stance, but the asymmetry is operator-surprising and unobserved
  in tests.

  Cross-cutting connections:
    - Pairs with "silent-200-on-missing-pair-or-entity-on-upsert-family"
      (NEW batch L) — the upsert family's matching pattern; together
      they form the "ODD silently succeeds on no-op writes" cluster
    - Pairs with "Write-collaborative DEG — NO DEG-side authorization"
      — the resource-scope axis of the same DEG-membership pair
    - Cross-references "Reactive Mono<ResponseEntity<...>>.map(ResponseEntity::ok)
      is the uniform success-response pattern" — that captures the
      structural shape; this captures the idempotence asymmetry within it

  Three DOC-NNN candidates:
    (a) Document the asymmetry on /developer-guides/api-reference for the
        DEG-membership endpoint pair
    (b) Operator-facing note in groups-domains.md naming the idempotence
        contract
    (c) Consider a future unification PR (post-1.0) to remove the asymmetry
