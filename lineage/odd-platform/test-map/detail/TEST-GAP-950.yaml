proposed_action: |-
  Author FeatureControllerAuthMatrixTest as a parameterised
  @SpringBootTest harness running once per auth mode (DISABLED,
  LOGIN_FORM, OAUTH2) — LDAP excluded pending P-132 confirmation of
  the Ldap*Configuration absence. For each mode assert: (a)
  unauthenticated → mode-appropriate block; (b) authenticated → 200 OK
  regardless of role. Add a separate `pathNotInWhitelist_regressionPin`
  test that GREPs SecurityConstants.WHITELIST_PATHS at test time and
  fails if /api/features/active appears — catches accidental
  whitelist additions before they ship.
