- id: H-001
  hypothesis: "When the operator enables Notifications (`notifications.enabled=true`) and configures at least one channel, an alert that fires (an ALERT-table INSERT/UPDATE) is delivered to that channel without the operator taking any further action."
  derivation: "Pillar primary user action 'receive alerts on failed jobs / failed DQ / schema breaks / external anomalies'; the WAL entry point is automatic (no user trigger)."
  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      The leader-elected NotificationSubscriber polls the ALERT-table WAL stream every 10ms,
      decodes INSERT/UPDATE messages, and synchronously calls messageProcessor.process(...),
      which translates the row to an AlertNotificationMessage and iterates the configured
      senders. With one channel configured and a well-formed alert, the single sender's
      .send(...) fires and the LSN advances. No user interaction is required — the chain is
      WAL-driven end to end.
    evidence:
      - sidecar: odd-platform__java__notification__class__NotificationSubscriber.md
        section: understanding + concepts.operations
        cite: "NotificationSubscriber.java:68-84"
        note: "poll readPending -> decode -> process -> advance LSN; the automatic entry point"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: understanding
        cite: "AlertNotificationMessageProcessor.java:23-36"
        note: "translate then fan-out to each configured sender"
    confidence: HIGH
    routes_to_finding: none

- id: H-002
  hypothesis: "When all three channels (Slack, generic webhook, email) are enabled and a single alert fires, every enabled channel receives that alert — one channel's transient failure does not stop the others."
  derivation: "Live doc + dispatcher implicit ADR: 'an alert dispatched to multiple channels is delivered to every channel that is enabled' (catch-and-continue per sender)."
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      The catch-and-continue promise holds ONLY for failures wrapped as the checked
      NotificationSenderException — which Slack and Webhook do (via AbstractNotificationSender
      .sendAndValidate, caught at AlertNotificationMessageProcessor.java:31, loop continues).
      It BREAKS for email: EmailNotificationSender wraps MessagingException | TemplateException
      | IOException as a raw RuntimeException (EmailNotificationSender.java:58-60), which
      bypasses the per-sender catch and aborts fan-out for the SAME alert. Because sender
      iteration order is Spring-bean-discovery-order (undefined; no @Order at
      AlertNotificationMessageProcessor.java:19), if email runs before Slack/Webhook, an email
      failure means Slack and Webhook receive NOTHING for that alert. So "every enabled
      channel receives every alert" is true when all channels succeed and when a FAILING
      channel is Slack/Webhook, but false when email fails and is not last.
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__EmailNotificationSender.md
        section: bugs_limitations_corner_cases[0]
        cite: "EmailNotificationSender.java:58-60"
        note: "raw RuntimeException wrap — the asymmetry's primary source"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: bugs_limitations_corner_cases[0] + implicit_adrs[0]
        cite: "AlertNotificationMessageProcessor.java:31"
        note: "per-sender catch is NotificationSenderException-only; RuntimeException escapes"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: bugs_limitations_corner_cases[5]
        cite: "AlertNotificationMessageProcessor.java:19"
        note: "no @Order on List<NotificationSender> — email-first is possible and undetectable"
    operator_visible_failure: |
      An operator who configures Slack + Webhook + Email and sees email start failing (bad
      relay, full mailbox, a single malformed recipient address, a corrupted email.ftlh)
      ALSO silently loses Slack and Webhook delivery for every alert that hits the email
      failure — IF Spring happened to order email first. The failure is order-dependent and
      therefore non-deterministic across deploys: a package rename or a bean-registration
      change can flip the order and turn a working multi-channel setup into one where an
      email outage takes down all alerting. The operator has no signal beyond ERROR log lines.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

