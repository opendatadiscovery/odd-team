# Host-port remap ONLY, composed on top of odd-platform's docker/demo.yaml so IT-154 can
# drive the DEMO STAND without owning the developer-facing 8080/5432. Nothing else is
# overridden: the enricher and the collector reach the platform over the compose network at
# odd-platform:8080 either way, so the readiness gate, the healthcheck and the injection are
# exercised exactly as a user gets them.
#
# 18095/15495 are clear of every fixed e2e port (which stop at 18090/15441) and below
# run-suite.sh's per-stream SUT search, which starts at 18100/15500.
services:
  database:
    ports:
      - 15495:5432
  odd-platform:
    ports:
      - 18095:8080
