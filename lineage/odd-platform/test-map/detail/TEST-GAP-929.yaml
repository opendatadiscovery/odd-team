  - 'odd-platform__java__IdentityController__controller-class__IdentityController.md:security.known_security_gaps.[3]'
behaviour: |-
  **Defence-in-depth assertion: the dummyOwner fallback is UNREACHABLE under
  LOGIN_FORM / OAUTH2 / LDAP — every authenticated user must receive their REAL
  principal name, never the literal "admin".** The invariant "switchIfEmpty
  fallback never fires under authenticated modes" is the load-bearing security
  boundary; if a future SecurityConfiguration change broke SecurityContext
  propagation under any of the three authenticated modes, every user would
  silently downgrade to receiving the dummyOwner admin-with-all-permissions
  response, with NO 401/403 surfacing the failure. The LOGIN_FORM mode is
  particularly insidious because GrantedAuthorityExtractor.getAuthorities(true)
  already hard-codes every LOGIN_FORM user to ADMIN authority (TEST-GAP-244) —
  a SecurityContext-loss bug under LOGIN_FORM would be VERY hard to detect from
  response shape alone. Currently NO test asserts the unreachability invariant.
