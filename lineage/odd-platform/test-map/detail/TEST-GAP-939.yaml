behaviour: |-
  **POST /api/policies with malformed policy JSON returns HTTP 500
  ("Internal Server Error") instead of 400 with the validator's diagnostic
  message.** PolicyJSONValidator throws IllegalArgumentException synchronously
  at PolicyJSONValidator.java:28-32 (via PolicyServiceImpl.java:64 on create
  and :73 on update); the exception flows through Reactor's
  flatMap-to-Mono.error conversion into ControllerAdvice.java:23-66.
  ControllerAdvice has NO @ExceptionHandler(IllegalArgumentException.class) —
  the catch-all @ExceptionHandler(Exception.class) at line 61 surfaces it as
  HTTP 500 SYS001 with body "Internal Server Error", LOSING the validator's
  actual error message (e.g. which JSON property failed, which line). The
  operator hitting a malformed-policy create gets a 500 with no diagnostic;
  fixing requires either PolicyJSONValidator throwing BadUserRequestException
  OR ControllerAdvice adding an IllegalArgumentException handler — both
  one-line — neither has been chosen. The drift surfaces on every malformed
  PolicyFormData on create AND update endpoints.
