  derivation: "Negative-space + pillar mission (the spec is 'the wire contract for shape') — a contract a developer builds against is only trustworthy if something guarantees it matches reality."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      ZERO end-to-end conformance test exists between the spec and the running platform. The only
      de-facto check is that openapi-generator-cli parses the spec (a YAML-validity + $ref-
      resolvability check) at build time — nothing fires the spec'd operations against a running
      instance to assert status-code or response-DTO parity. This absence is the STRUCTURAL ROOT
      that lets every drift class above (H-002 error-model, H-003/H-004 status-code, H-005 inverse-
      semantic, H-008 missing-field, H-009 operationId) accumulate: nothing guards the alignment, so
      every authoring session is a potential new drift instance. Whether ANY currently-shipped
      operation drifts in response-DTO field-set (beyond the status-code + summary drifts already
      enumerated statically) cannot be known from the sidecars alone — it requires running the
      platform and diffing. Emitted PENDING-F-029-1 to measure it.
