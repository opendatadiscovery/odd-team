behaviour: |-
  **MEDIUM — visiting `/master-data` (bare base path) produces a no-match / fallback render**: React Router renders nothing in the content area; no fallback `<Route path='*'>` is declared in App.tsx for `/master-data`. The toolbar still renders normally above; the content area is empty beneath.

  **Why this is operator-visible** (even though the sidecar rates the corner-case LOW):
  - The "Master Data" toolbar tab in ToolbarTabs.tsx:57 uses `lookupTablesPath()` directly (`/master-data/lookup-tables`) so UI-following users never hit `/master-data` — but BOOKMARKS of bare `/master-data` (likely after `BASE_PATH` was set up before the first sub-route was added) and any future tab-tooltip / breadcrumb-handling logic that uses the `BASE_PATH` could land here.
  - The ToolbarTabs selected-tab logic uses `pathname.includes('master-data')` (ToolbarTabs.tsx:101). So `/master-data` (no match — blank content) AND `/master-data/lookup-tables` (real route) BOTH light up the Master Data tab as selected. An operator hand-typing `/master-data` sees the tab highlighted suggesting they're on the right page — but the content area is empty. This INCREASES confusion rather than gracefully degrading.

  **The BASE_PATH-vs-implementation drift**: the sidecar surfaces this as a Cat F finding (`stress_findings.request_inputs.[BASE_PATH] DRIFT_INPUT_NAME_VS_IMPLEMENTATION`) — the constant name `BASE_PATH` implies a usable, mounted URL — a section root that should resolve to something. But visiting `/master-data` doesn't match any `<Route>` and renders nothing. The 'master data' base is an in-code organisational marker that has no corresponding URL surface.

  **Same shape as TEST-GAP-998 (bare /terms blank) and TEST-GAP-1004 (bare /data-modelling redirect — the pattern done right)** — three routes, three different bare-path behaviours: blank (terms + master-data) vs redirect (data-modelling). Master Data has only ONE sub-route today (`/master-data/lookup-tables`), so the choice of "blank" vs "redirect" is operator-visible only at deep-link entry, but the inconsistency across the routes/ directory is a maintainer-visible defect.

  **No test pins this** — a regression that adds an `index` route or a `<Navigate to='lookup-tables' replace />` fallback to `/master-data` (improving UX) ships green; a future addition of a SECOND sub-route under `/master-data` would AMPLIFY the bug (operators would land on a blank page when the chooser became meaningful).
test_class: missing-edge-case
criticality_rationale: |-
  Sidecar rates this LOW (cosmetic, no data loss). Bumped to MEDIUM because: (a) the ToolbarTabs selected-tab substring match (`pathname.includes('master-data')`) makes the blank page MISLEADING-by-design — tab highlighted but content empty; (b) the future failure mode (adding a second `/master-data/*` sub-route activates the no-match condition for any deep-link without the suffix) is foreseeable. NOT escalated higher because (a) zero current operator-discovery evidence, (b) backend RBAC catches every mutation regardless of UI shape, (c) the path forward is one `<Route index element={<Navigate to='lookup-tables' replace />} />` line. Cross-pillar amplification does NOT apply (sticks within P-03).
