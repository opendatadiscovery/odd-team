proposed_action: |-
  WebTestClient test. (a) Boot with `auth.ingestion.filter.enabled=true`. (b) POST `/ingestion/entities` with NO Authorization → 401 (correct). (c) POST `/ingestion/entities/` (trailing slash) — assert reach of controller (Spring's PathPatternParser tolerates trailing slash by default; the filter may or may not match — pin actual behaviour). (d) Assert no future-path variants would route through the filter: simulate adding a controller route for `/ingestion/entities/batch` and POST anonymously — assert request reaches the controller (the filter does NOT intercept). Pin the exact-literal-only contract; future refactor introducing wildcard matcher updates this test deliberately.
