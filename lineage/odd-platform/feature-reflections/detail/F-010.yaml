        cite: "HousekeepingJobManager.java:25-39 (no dry-run/preview/kill-switch)"
        note: "destructive cycle fires unconditionally; ~15 min from misconfig to cascade"
      - test: "HousekeepingTtlKnownBugsTest.ttlFieldsSilentlyDefaultToZero_knownBug_PLT083 (@pins PLT-083)"
        note: >-
          v0.3.0 — pins the absence of @DefaultValue (the no-validation half of
          this contradiction). GUARDS the bug; the broader dry-run/preview/validator
          guard-rail promise has no test.
    operator_visible_failure: |
