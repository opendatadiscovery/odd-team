notes: |
  This invariant is the SYNTHESIS of the 4-layer triangulation:
    - Controller (batch P) observed the service call from the controller s
      view but did not have the file:line for either ADR; the controller
      sidecar treated both as implicit ADRs surfaced from the service.
    - Service (batch S, THIS) ENACTS both ADRs at concrete file:line evidence.
      Lines 74-92 and 99-111 are the canonical anchor.
    - Repository (batch R) confirmed the SQL-tier would not have constrained
      the field set; the narrowing happens at the service tier.
    - Schema (V0_0_11) — namespace_name column does NOT exist on data_source;
      the SQL layer is the structural reason payload-side namespace info
      cannot be persisted.

  The 4-LAYER triangulation gives the maintainer a complete picture of WHERE
  to apply remediation:
    - REFACTOR-422 fix (propagate connection_url / type / active) — service
      tier (lines 74-92 + mapper line set extension); LOW risk.
    - REFACTOR-423 fix (operator UI overwrite hazard) — service tier
      (introduce a `last_modified_by` discrimination on name/description
      mutation; defer to operator on collision); MEDIUM risk because it
      changes the collector-wins contract.
    - REFACTOR-424 fix (payload namespace_name silent drop) — service tier
      OR controller tier (validation: warn the operator that namespace_name
      is ignored); LOW risk; doc-side cleanup recommended in parallel.

  The ADR-CANDIDATE-142 + 143 pair are POSITIVE case-law — they are
  architecturally defensible and INTENTIONAL design choices. The drift
  facets enumerated in F-008 (REFACTOR-422 + 423 + 424) are the operator-
  facing trade-offs of the enacted ADRs; remediation is at the doc layer
  (extending the developer-guides/build-and-run/custom-collectors page
  with a caveat block) AND optionally at the service layer (per the
  refactor scope recommendations).

