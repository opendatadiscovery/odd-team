observed_vs_expected:
  facets:
  - facet: no Slack request signature verification on the events webhook
    observed: |-
      EventApiController.java:22-27 deserializes the raw body straight
      from `@RequestBody Mono<String>` and never reads any header.
      Grep across the codebase for `X-Slack-Signature`,
      `signing.secret`, `signingSecret`, `verifySignature`,
      `HMAC.SHA256` returns ZERO matches. The endpoint accepts forged
      POSTs from any internet caller. Slack's documented protocol
      (https://api.slack.com/authentication/verifying-requests-from-slack)
      requires receivers to compute HMAC-SHA256 over
      `v0:{X-Slack-Request-Timestamp}:{raw body}` using the app's
      signing-secret and compare to `X-Slack-Signature`. ODD does
      none of this.
    expected: |-
      Either (a) implement the signature verification per Slack's
      documented protocol AND fail the request with 401 when the
      signature is missing/invalid, OR (b) document the gap
      explicitly with a deployment-guidance caveat (deploy behind a
      reverse-proxy that performs signature verification).
    drift_class: unauthenticated_slack_webhook_no_signature_verification
    provenance: |-
      STATIC — primary-source in batch ZF EventApiController
      controller-class sidecar bugs_limitations_corner_cases[0] +
      EventApiController.java:22-27 + SlackEventParser.java:22-23
      (parse signature lacks headers / timestamp / signature).
      Severity: HIGH. The endpoint is the load-bearing untested
      security surface of the Data Collaboration feature.
  - facet: Slack OAuth bot token is the SOLE workspace secret with no rotation hook
    observed: |-
      `datacollaboration.slack-oauth-token` (DataCollaborationConfiguration.java:21)
      is the bot OAuth token (`xoxb-...`) that signs every outbound
      Slack call. Used to construct a SINGLETON AsyncMethodsClient at
      boot (line 27); reused across all requests. Spring's default
      Sanitizer DOES mask `token`-suffixed property names but masking
      is the sole defence. NO env-var-rotation hook; NO token-lifecycle
      integration; NO fail-closed on token revocation (a revoked
      token returns `invalid_auth` from Slack → SlackAPIException →
      5xx, but the platform does NOT mark the feature as broken).
      Any compromise of the platform process / `/actuator/env` /
      configured property leaks workspace channel enumeration + post-
      as-bot capability across the bot's scope (`channels:history`,
      `channels:read`, `chat:write`, `users:read`, `incoming-webhook`).
    expected: |-
      Documented operational invariant on the live
      `/active-platform-features/data-collaboration` page (currently
      404) describing the token's blast radius + a rotation procedure +
      a fail-closed contract on Slack-side revocation.
    drift_class: slack_oauth_token_sole_workspace_secret_no_rotation
    provenance: |-
      STATIC — primary-source in batch ZF DataCollaborationController
      controller-class sidecar bugs_limitations_corner_cases[0] +
      DataCollaborationConfiguration.java:19-29. Severity: HIGH
      (operational invariant for any operator running Discussions).
  - facet: all four endpoints have NO RBAC permission gate
    observed: |-
      `SecurityConstants.SECURITY_RULES` has zero entries for
      `/api/datacollaboration/**`, `/api/messages/**`, or
      `/api/slack/events` (verified via Grep against
      SecurityConstants.java:98-355 — all four are absent). All four
      fall through to either (a) `AuthorizationCustomizer.customize`'s
      catch-all `pathMatchers("/**").authenticated()`
      (AuthorizationCustomizer.java:29-30) under OAUTH2/LDAP, or
      (b) explicit whitelist entries in LoginFormSecurityConfiguration.java:49-51
      under LOGIN_FORM mode (the `/api/slack/events` path is
      explicitly whitelisted; the `/api/datacollaboration/**` paths
      fall through). The Permissions docs (WebFetched 2026-05-25
      status 200) list no DATA_COLLABORATION-class permission. Any
      authenticated user under LOGIN_FORM/OAUTH2/LDAP can call all
      four endpoints regardless of which DATA_* permissions they
      hold; under DISABLED the four endpoints are anonymously
      reachable.
    expected: |-
      Either (a) introduce a DATA_COLLABORATION_{POST,READ,SEND}
      permission family and gate the outbound endpoints accordingly,
      OR (b) document the read-collaborative posture explicitly with
      the rationale (in-product Discussions are by design accessible
      to any platform user).
    drift_class: rbac_ungated_three_endpoints_pillar_catch_all_only
    provenance: |-
      STATIC — primary-source in batch ZF DataCollaborationController
      sidecar invariants[2] + DataCollaborationController.java:18-50 +
      EventApiController.java:18-57 + SecurityConstants.java:95-355.
      Severity: HIGH (combined with finding 1 + 4 the surface is
      open-by-design).
  - facet: redirect endpoint is open-redirect class — Slack permalink trusted verbatim
    observed: |-
      DataCollaborationController.java:42-48 emits
      `ResponseEntity.status(FOUND).headers(h -> h.setLocation(URI.create(providerUrl))).build()`
      where `providerUrl` comes from Slack's `chat.getPermalink` API
      (SlackAPIClientImpl.java:84-95) UNCONDITIONALLY — no host check
      (e.g. `URI.create(providerUrl).getHost().endsWith("slack.com")`),
      no scheme check (could be `javascript:` if Slack ever returned
      one), no malformed-URI handler (`URI.create` throws
      IllegalArgumentException for malformed input, bubbles to the
      WebFlux exception handler as 5xx). The trust assumption is
      "Slack returns a slack.com URL"; the assumption is enforced
      nowhere.
    expected: |-
      Defence-in-depth: validate `providerUrl` against an allowlist
      of Slack hostnames (e.g. `slack.com`, `*.slack.com`) before
      emitting the redirect; reject and log on mismatch. Cost is
      one regex check; benefit is bounded blast radius if Slack's
      contract changes or if an attacker compromises the bot's Slack
      app to return crafted permalinks.
    drift_class: open_redirect_class_slack_permalink_trusted_verbatim
    provenance: |-
      STATIC — primary-source in batch ZF DataCollaborationController
      sidecar bugs_limitations_corner_cases[2] +
      DataCollaborationController.java:42-48 +
      SlackAPIClientImpl.java:83-95. Severity: MEDIUM.
  - facet: OpenAPI declares 301 on redirect, controller emits 302
    observed: |-
      OpenAPI declares `301 Moved Permanently` for
      `/api/messages/{message_id}/url` (openapi.yaml:1788-1789) but
      the controller emits `HttpStatus.FOUND` (302) at
      DataCollaborationController.java:45. The live api-reference doc
      page (`https://docs.opendatadiscovery.org/developer-guides/api-reference/data-collaboration`,
      WebFetched 2026-05-25 status 200) acknowledges the drift
      explicitly. OpenAPI-codegen clients are wrongly typed for the
      response; functional behaviour matches (browsers follow both
      301 and 302).
    expected: |-
      Align spec and implementation — either change spec to 302 OR
      change controller to 301. The semantic difference (301 implies
      cacheable, 302 implies temporary) suggests 302 is correct;
      spec should be updated.
    drift_class: openapi_301_vs_impl_302_redirect_status_code_drift
    provenance: |-
      STATIC — primary-source in batch ZF DataCollaborationController
      sidecar invariants[9] + openapi.yaml:1788-1789 +
      DataCollaborationController.java:45. Severity: LOW (operator
      consequence is OpenAPI-codegen client mis-typing).
  - facet: getSlackChannels uses startsWith filter, not contains
    observed: |-
      SlackMessageProviderClient.java:52 invokes
      `slackChannel.name().startsWith(nameLike)`. A user typing the
      middle of a channel name (`platform` to find `#odd-platform-alerts`)
      gets zero results despite the channel existing in the bot's
      joined set. The UI's `useDebouncedCallback(500ms)`
      (SlackChannelsAutocomplete.tsx:43-54) drives this filter on
      every keystroke. UI ui_unverified: false here — the backend
      semantics are unambiguous.
    expected: |-
      Either (a) change to `containsIgnoreCase(nameLike)` to match
      the standard autocomplete UX expectation, OR (b) document the
      prefix-only behaviour on the live Discussions doc page.
    drift_class: slack_channel_autocomplete_starts_with_not_contains_filter
    provenance: |-
      STATIC — primary-source in batch ZF DataCollaborationController
      sidecar invariants[5] + SlackMessageProviderClient.java:50-55.
      Severity: LOW (UX defect).
  - facet: 1-minute Caffeine cache for channels — fresh invites invisible for up to 60 seconds
    observed: |-
      SlackMessageProviderClient.java:36-44 builds an
      AsyncLoadingCache with `expireAfterWrite(1, MINUTES)` and
      `maximumSize(1)` keyed on a fixed sentinel string. The actual
      `conversations.list` Slack API call (paginated 200/page at
      SlackAPIClientImpl.java:26, 130-141) happens on cache miss.
      Under a stale-cache window of up to 60 seconds, freshly-invited
      or freshly-removed bot-channel membership is invisible to the
      autocomplete. Combined with Slack's `excludeArchived(true)`
      (line 131) + `filter(Conversation::isMember)` (line 45) +
      `ConversationType.PUBLIC_CHANNEL` only (line 132), the autocomplete
      shows ONLY active public channels the bot is in — fresh invites
      take up to 60 seconds.
    expected: |-
      Document the cache TTL on the live Discussions doc page so
      operators inviting the bot to a channel know to expect ~60s
      propagation; OR shorten the TTL OR add a cache-bust on a
      relevant Slack event.
    drift_class: slack_channels_one_minute_caffeine_cache_stale_invites_invisible
    provenance: |-
      STATIC — primary-source in batch ZF DataCollaborationController
      sidecar invariants[6] + SlackMessageProviderClient.java:36-44.
      Severity: LOW (UX defect; operator-debug confusion).
  - facet: non-UUID-v1 message_id returns 200 not 404 silent conflation
    observed: |-
      `messageId` MUST be a UUIDv1 — ReactiveMessageRepositoryImpl.getMessageProviderIdentity
      (lines 171-185) binds an extra
      `MESSAGE.CREATED_AT.eq(UUIDHelper.extractDateTimeFromUUID(messageId))`
      condition (a covering-index assist). A non-v1 UUID extracts a
      wrong timestamp, the WHERE clause fails, the inner Mono is
      empty, and the redirect endpoint returns 200 OK with no body —
      NOT 404. The path lacks any `switchIfEmpty(Mono.error(new
      NotFoundException(...)))`.
    expected: |-
      Add explicit `switchIfEmpty(Mono.error(new NotFoundException(...)))`
      after the repository lookup; return 404 with a clear error body.
      Operators have a contract to distinguish "message doesn't exist"
      from "redirect succeeded".
    drift_class: non_uuid_v1_message_id_returns_200_not_404_silent_conflation
    provenance: |-
      STATIC — primary-source in batch ZF DataCollaborationController
      sidecar invariants[8] + ReactiveMessageRepositoryImpl.java:171-185.
      Severity: MEDIUM. Same family as F-004 silent-200 +
      F-013 silent-200 patterns.
  - facet: Slack at-least-once delivery has no idempotency, no unique constraint
    observed: |-
      Slack documents that the Events API retries undelivered events
      for up to 3 attempts and may double-deliver under load
      (https://api.slack.com/apis/events-api#retries). The
      `message_provider_event` table (V0_0_59__data_collaboration.sql:25-39)
      has no unique constraint on `(provider, event_id)` — `id` is
      a BIGSERIAL and the only constraints are PK on `id` and FK on
      `(parent_message_uuid, parent_message_created_at)`. The
      repository INSERT (ReactiveMessageRepositoryImpl.java:136-155)
      performs a plain INSERT with no ON CONFLICT clause. A duplicated
      Slack delivery for the same `event_ts` inserts N rows; the
      processor materialises N child message rows with N distinct
      `message.uuid` values but the same `provider_message_id`.
      Downstream `getUUIDByProviderInfo` does
      `select uuid from message where provider_message_id = ? and
      provider = ?` with no LIMIT 1 — multi-result returns an
      arbitrary first row (order-undefined).
    expected: |-
      Add unique constraint on (provider, event_id) in
      message_provider_event + ON CONFLICT DO NOTHING on insert.
      This is the standard at-least-once-to-exactly-once pattern.
    drift_class: at_least_once_slack_event_delivery_no_dedup_no_unique_constraint
    provenance: |-
      STATIC — primary-source in batch ZF EventApiController sidecar
      bugs_limitations_corner_cases[2] +
      ReactiveMessageRepositoryImpl.java:136-155 +
      V0_0_59__data_collaboration.sql:25-39 +
      DataCollaborationMessageEventProcessor.java:88-101. Severity:
      HIGH (each duplicate delivery is silently materialised into
      catalog rows).
