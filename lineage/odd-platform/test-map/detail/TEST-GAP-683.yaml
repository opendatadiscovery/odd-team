proposed_action: |-
  Add Mockito test `getOrCreate_calledFromOwnerAssociationRequest_doesNotRequireOwnerCreatePermission_documentsBypass`. (a) Mock `ownerRepository` to return `Mono.empty()` on the `getByName` lookup and a populated OwnerPojo on `create`. (b) Invoke `ownerService.getOrCreate("new-owner-name")` WITHOUT any security context setup. (c) Assert the returned Mono completes with an OwnerPojo. (d) `verify(ownerRepository).create(any())`. (e) Add a `// REGRESSION-PIN — getOrCreate is a deliberate permission-bypass write path for OWNER row minting. The bypass is reached from OwnerAssociationRequestServiceImpl + OwnershipServiceImpl + TermOwnershipServiceImpl. A REFACTOR that adds @PreAuthorize('hasPermission(OWNER_CREATE)') will break this test, surfacing the dependency. Document the side-door at the test level so the regression is intentional.` comment block. Pair with a test of `OwnerAssociationRequestServiceImpl.createOwnerAssociationRequest` showing the side-door is INVOKED.
