    query: |
      DELETE FROM tag_to_data_entity WHERE tag_id BETWEEN 20000 AND 29999
  - kind: sql
    query: |
      DELETE FROM tag WHERE id BETWEEN 20000 AND 29999
  - kind: sql
    query: |
      DELETE FROM data_entity WHERE id BETWEEN 20000 AND 20049
  - kind: sql
    query: |
      DELETE FROM data_source WHERE id = 1020
  - kind: docker-compose-down
    destroy_volumes: true

