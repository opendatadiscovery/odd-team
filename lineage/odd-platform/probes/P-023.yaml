oracle:
  - OUTCOME (a) — OpenAPI rejects: CALL 2 status_code == 400.
    The OpenAPI spec marked begin_date and end_date as REQUIRED. The
    sidecar S-B-3 finding should be marked as
    "mooted-by-OpenAPI-validation"; the service-layer validation gap
    is moot. No further maintainer action required beyond updating
    the sidecar.

  - OUTCOME (b) — service accepts NULL: CALL 2 status_code == 200 AND
    CALL 2 body.totalCount >= CALL 1 body.totalCount.
    Mathematically guaranteed by SQL semantics (adding a WHERE
    predicate can only reduce or equal the count). This confirms the
    static-inferred behaviour: the null-date branch issues an
    unbounded count over the entire retained history. The sidecar
    S-B-3 finding stands; the maintainer should either:
      - add a service-level null-check (symmetric with getActivityList),
        OR
      - tighten the OpenAPI spec to require dates,
      - OR add a docs caveat to activity-feed.md acknowledging the
        unbounded-scan behaviour for operators at scale.

  - The two outcomes are mutually exclusive; the probe MUST observe
    exactly one. Any other observation (CALL 2 status_code == 500,
    or status_code == 200 with totalCount < CALL 1's totalCount)
    surfaces a bug beyond S-B-3 and should be filed as a new finding.

