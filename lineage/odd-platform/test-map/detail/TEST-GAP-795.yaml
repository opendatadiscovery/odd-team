proposed_action: |-
  Add `NotificationSubscriberPoisonReplayWALRetentionRegressionPinTest`. Testcontainers-Postgres setup:

  1. `poisonAlert_subscriberStuckInReplayLoop_walLagGrowsUnbounded_pinsDiskExhaustionRisk` —
     - Boot platform with `notifications.enabled=true` and a stub `NotificationSender` that no-ops.
     - INSERT a poison ALERT row: type_id NOT in AlertTypeEnum range OR alerted_entity_oddrn pointing at hard-deleted entity.
     - Start `NotificationSubscriber`.
     - Wait 40 s (4× the 10s retry cadence).
     - Execute `SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn) AS wal_lag FROM pg_replication_slots WHERE slot_name = 'odd_platform_replication_slot'`.
     - Assert `wal_lag > 0` (the lag exists) AND grows between successive observations (a second sample 10 s later is `>=` the first).
     - PINS the WAL-retention operational consequence.

  2. `poisonAlert_operatorDropsSlot_alertsLost_pinsDestructiveRecovery` —
     - Same setup.
     - Execute `SELECT pg_drop_replication_slot('odd_platform_replication_slot')`.
     - Restart the subscriber.
     - Assert the poison alert is GONE (and NO log entry indicates it was dispatched).
     - PINS the destructive nature of the documented remediation.

  3. `poisonAlert_dlqRouteEnabled_walAdvances_pinsFixDirection` — (UPDATE this test once REFACTOR-NNN adds the DLQ)
     - After REFACTOR-NNN: assert that the same poison alert is routed to `alert_notification_dlq` and the WAL LSN advances normally.
     - CONFIRMS the fix's effectiveness.

  Pair with REFACTOR-NNN (DLQ + WAL-lag gauge) and DOC-GAP-NNN (documenting the trilemma in the live doc).

  Coherence note (LSN-018 Rule 6): This finding STRENGTHENS TEST-GAP-455 (same root cause, different observable consequence). NO contradiction with TEST-GAP-455 — that gap pins LSN-non-advance + 10s back-off; this gap pins WAL retention consequence. NET-NEW finding distinct from TEST-GAP-173 (rename orphan, operator-action root cause) and TEST-GAP-457 (burst rate, different failure mode).
