name: |-
  hasDescriptionRelations rename/delete guard bypasses for Terms mentioned only in soft-deleted entities
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-06
- P-01
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-19N — surfaced by
  primary-source examination of ReactiveTermRepositoryImpl.**

  `hasDescriptionRelations(termId)` (ReactiveTermRepositoryImpl.java:409-438)
  is the LOAD-BEARING guard for two operator-facing invariants:
    (a) `TermServiceImpl.updateTerm` rename-protection — blocks a Term
        from being renamed while any active description references it
        (TermServiceImpl.java:128)
    (b) `TermServiceImpl.delete` deletion-protection — blocks a Term
        from being hard-deleted while any active description mentions
        it (TermServiceImpl.java:156)

  The guard issues 3 nested EXISTS subqueries — one per link table —
  OR-combined into a single SELECT. The decision-shape is:
    Subquery 1 — `data_entity_to_term` (lines 410-416) — does any
      data-entity have an active description mentioning this term?
      Filter: `IS_DESCRIPTION_LINK.isTrue()` AND
      `DATA_ENTITY.STATUS.ne(DataEntityStatusDto.DELETED.getId())`
    Subquery 2 — `dataset_field_to_term` (lines 417-426) — does any
      dataset-field have an active description? The 4-table chain joins
      `dataset_field → dataset_structure → dataset_version → data_entity`
      to filter the parent data-entity's status.
      Filter: `DATA_ENTITY.STATUS.ne(DELETED)` for the parent (line 425)
    Subquery 3 — `term_to_term` (lines 427-433) — does any active term
      reference this term?
      Filter: `TERM.DELETED_AT.isNull()` on the TARGET term (different
      semantic — uses term's soft-delete column, not data-entity's
      STATUS state-machine)

  **The bug shape**: lines 415, 425 filter
  `DATA_ENTITY.STATUS.ne(DataEntityStatusDto.DELETED.getId())` on the
  data-entity / dataset-field branches. A Term mentioned ONLY in a
  soft-deleted data-entity's description (or in the description of a
  dataset-field belonging to a soft-deleted data-entity) is treated by
  the guard as 'not mentioned' — the EXISTS subquery returns FALSE.

  **Consequence**: the guard permits the Term to be renamed or hard-
  deleted via `TermServiceImpl.delete`. The descriptions of the
  soft-deleted entities still contain the `[[ns:term]]` syntactic
  reference to the now-renamed-or-deleted Term.

  **When the data-entity is later restored** (`PUT /api/dataentities/{id}/status →
  ACTIVE` — a documented operator workflow per the data-entity-status
  feature page), one of three things happens to the description:
    (i) If the Term was DELETED: the description's `[[ns:term]]` text is
        now a broken reference; the term-resolution path silently
        downgrades the mention to 'unhandled' on the next description
        edit (TermServiceImpl.updateDataEntityDescriptionTermsState path);
        the staged-unhandled-mention table records the unresolvable
        reference. The UI renders the description with un-styled,
        un-linked `[[ns:term]]` text inline.
    (ii) If the Term was RENAMED: same shape — the description's text
         still references the old name; the next description edit
         either downgrades to unhandled, OR if the same operator who
         renamed the term updates the description, they can manually
         fix the references. But there is no automatic re-link based
         on rename.
    (iii) If both the Term WAS deleted AND a new Term with the same
          name was later created (the soft-delete-aware recreation
          invariant — the partial unique index
          `term_name_namespace_unique` permits reuse), the description
          would point at the NEW term row with a DIFFERENT id — the
          mention silently rebinds across what was conceptually a
          discontinuity.

  **The asymmetry vs term-to-term branch**: the term-to-term subquery
  (lines 427-433) uses `TERM.DELETED_AT.isNull()` on the TARGET — a
  fundamentally different soft-delete predicate. The data-entity and
  dataset-field branches use STATUS state-machine; the term branch uses
  deleted_at timestamp. The asymmetry reflects the platform's broader
  three-soft-delete-mechanisms-across-the-repository-layer invariant
  (batch H), but introduces THIS specific corner case: the same
  semantic question ("is this term mentioned anywhere active?") is
  answered differently across the three subqueries.

  **The intent is explicit**: the maintainer DELIBERATELY filtered
  STATUS != DELETED on the data-entity branches so operators can clean
  up the Term catalog after a wave of entity deletions. The trade-off
  the maintainer accepted: a Term mentioned ONLY in soft-deleted
  entities can be cleaned up; the consequence (dangling reference on
  restore) is undocumented. Operator-visible inconsistency surface:
  restore-soft-deleted-entity is a documented feature but its
  interaction with Term lifecycle is undocumented.

  **Pair with the term_to_term schema-drift invariant**: both findings
  surface from the same repository file (ReactiveTermRepositoryImpl);
  both involve the term-rename-protection guard's behaviour around
  soft-deletion of the surrounding context. The combined picture: the
  guard's three subqueries each handle soft-deletion DIFFERENTLY, and
  one of them (term_to_term) has a schema-drift gap that compounds
  the bypass surface.
