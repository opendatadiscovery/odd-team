behaviour: Duplicate-name POST is not handled cleanly. The service has no pre-check
  for an existing live policy with the same name; the request falls through to the
  repository INSERT and the DB `policy_name_unique` partial UNIQUE INDEX raises a
  Postgres `unique_violation` (SQLSTATE 23505). The reactive pipeline surfaces this
  as an unhandled `DataAccessException` rather than a `409 Conflict` / `BadUserRequestException`.
  Same shape as TEST-GAP-224 (Role parallel).
