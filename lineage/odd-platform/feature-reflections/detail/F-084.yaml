      no boot warning and no per-login log, AND no UI reflects the config — so the operator's
      mental model ("I configured admin-groups, it bound cleanly, therefore it works") is
      actively confirmed by the absence of any contradicting signal. The failure is invisible
      until an intended admin reports they cannot reach an admin screen — and even then the
      cause (Google ignores admin-groups while Cognito/Azure honour it) is non-obvious because
      the same key works on a sibling provider.
