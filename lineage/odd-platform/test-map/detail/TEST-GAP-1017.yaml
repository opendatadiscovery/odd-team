behaviour: |-
  **AppInfoMenu icon is NOT keyboard-accessible — only hover-activated
  via onMouseEnter (AppInfoMenu.tsx:81). Keyboard-only users
  (tab-navigation, screen-reader users) cannot open the menu and so
  cannot reach the Documentation link, Slack invite, version
  display, feedback link, or operator-configured links.** ARIA
  attributes `aria-haspopup` and `aria-controls` ARE wired on the
  icon button, which falsely communicates to assistive technologies
  that the menu is keyboard-operable; the dis-aligned wiring is an
  ACTIVE accessibility defect, not a passive omission.

  This is the WCAG 2.1 SC 2.1.1 (Keyboard) violation class. The fix
  is a one-line addition of `onClick` (or `onKeyDown` to handle
  Enter/Space explicitly) alongside the existing onMouseEnter.

  No test asserts (a) the current broken behaviour (icon is NOT
  reachable via keyboard menu activation), (b) the desired behaviour
  (Tab to the icon → Enter opens menu → arrow keys navigate items →
  Esc closes), (c) the ARIA-attribute-vs-wiring mismatch that makes
  the defect ACTIVELY mislead assistive-tech users.

  The defect is OPERATOR-INVISIBLE (most operators don't audit
  with screen readers); it surfaces as compliance failures when
  customers run accessibility audits (a known external check at
  several finance-sector ODD adopters per maintainer notes).
