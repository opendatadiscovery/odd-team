name: UI-vs-API asymmetry under DISABLED — UI hides mutation buttons (read-only appearance), backend accepts anonymous mutations
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  **NEW HIGH-severity INVARIANT, batch 2026-05-20-Q (CollectorsList +
  RolesList + OwnersList + PolicyList primary sources)**. Under
  `auth.type=DISABLED`, the SPA experience is SEMANTICALLY SAFER
  than the API experience — an operator clicking around the UI sees
  a READ-ONLY surface (mutation affordances all hidden) and may
  reasonably infer "this deployment is locked down". The BACKEND is
  the opposite: every Management endpoint accepts anonymous mutations
  (per `DisabledAuthSecurityConfiguration.java:11-19` bypassing all
  `SECURITY_RULES`).

  **The asymmetry mechanism**:

    1. Under DISABLED, the backend's `GET /api/identity` returns an
       Identity whose `permissions` array is EMPTY (verified per the
       batch-O `auth-mode` sidecar's auth-flow trace + the
       `usePermissions` hook's `hasAccessTo()` evaluation against an
       empty list).

    2. Every Management list component uses `<WithPermissions
       permissionTo={Permission.X_CREATE/UPDATE/DELETE}>` to wrap
       its mutation affordances. `WithPermissions` returns `null`
       when `hasAccessTo` returns false (`WithPermissions.tsx:27-29`).

    3. With empty `permissions`, every `hasAccessTo` call returns
       `false`, so every mutation affordance renders as `null`. The
       operator sees the catalogues (read-collaborative) but NO
       buttons.

    4. Meanwhile, the BACKEND's
       `DisabledAuthSecurityConfiguration.java:11-19` chain configures
       `.csrf().disable()` + `.authorizeExchange().anyExchange().permitAll()`
       — every endpoint, every method, every path is anonymously
       reachable. The four COLLECTOR_* / OWNER_* / ROLE_* / POLICY_*
       permissions registered in `SecurityConstants.java` SECURITY_RULES
       are entirely bypassed.

    5. A direct `curl POST /api/collectors` / `curl POST /api/owners`
       / `curl POST /api/roles` / `curl POST /api/policies` from any
       network-reachable client succeeds anonymously.

  **The UX hazard**: an operator inspecting the UI sees no mutation
  buttons and concludes "the platform is locked down for my session;
  I don't have permission to do anything". They miss the fact that
  any external caller — including an unauthenticated attacker on the
  same network — can mutate the catalogue at will. The UI's HIDING
  posture LIES about the platform's actual security state.

  **This is the 19th-and-final-known sidecar facet of REFACTOR-185**
  (the DISABLED-mode anonymous-mutation surface enumeration). The
  prior 18 facets covered backend-only surfaces (controllers, services,
  ingestion paths). Batch Q's UI-layer evidence is the FIRST UI-side
  facet — the UI is COMPLICIT in the asymmetry by HIDING information
  the operator needs to make an informed decision.

  **The full enumeration of UI surfaces affected** (per the 5 batch-Q
  sidecars):
    - CollectorsList (Management → Collectors tab): COLLECTOR_CREATE
      / COLLECTOR_UPDATE / COLLECTOR_DELETE / COLLECTOR_TOKEN_REGENERATE
      — buttons hidden under DISABLED, endpoints anonymous
    - OwnersList (Management → Owners tab): OWNER_CREATE / OWNER_UPDATE
      / OWNER_DELETE — same shape
    - RolesList (Management → Roles tab): ROLE_CREATE / ROLE_UPDATE /
      ROLE_DELETE — same shape
    - PolicyList (Management → Policies tab): POLICY_CREATE /
      POLICY_UPDATE / POLICY_DELETE — same shape

  **The mitigation surface**: under DISABLED, the UI should render a
  PERSISTENT BANNER on every authenticated route: "Auth is DISABLED.
  Any external caller can mutate the platform's catalogues. Do not
  run DISABLED in production." A one-time toast on app load is
  insufficient — operators who navigate during an active session
  miss it. The banner approach is internally consistent with the
  documented stance "DISABLED is dev-only" — make the dev-only
  warning unmissable.

  **Cross-batch coherence (LSN-018)**: this sidecar STRENGTHENS
  REFACTOR-185 by adding 4 UI-layer evidence points (one per
  Management list component). It is the FIRST sidecar pattern in the
  catalog to surface UI-vs-API SAFETY asymmetry as a distinct
  invariant.
