  Both controller-method halves are now structurally pinned; REFACTOR-217
  is one-PR-fixes-both-halves.

  Plus a sibling SecurityConstants bug surfaced batch K:
  /api/alerts/{id}/status PUT gated by DATASET_FIELD_ADD_TERM (NEW HIGH
