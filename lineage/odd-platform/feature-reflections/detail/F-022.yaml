    When an operator opens the "Test reports" tab for a dataset that EXISTS but
    has zero defined DQ tests, they see an empty-state ("no tests for this
    dataset") rather than an error.
  derivation: |
    Negative-space seed: the normal user expectation for a collection with no
    members is an empty list / empty-state, not an error. The doc is silent on
    the empty case (WebFetch `data-quality` 2026-06-01 — no empty-state
    description).
  seed_source: negative-space + endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      `getDataEntityDataQATests` throws `NotFoundException` (HTTP 404) when the
      dataset exists but has zero DQ tests — the service throws on the
      empty-stream completion (`DataQualityServiceImpl.java:38-42` cited through
      the controller sidecar bugs_limitations_corner_cases[2]). This is the
      unusual-REST-shape drift (`404_on_empty_dq_test_list_unusual_rest_shape`):
      an empty collection returns 404, not 200+[]. The 404 message ("Data
      quality tests for dataset with id %d not found") differs from the
      dataset-not-found 404 message, but a UI doing status-code-only handling
      cannot distinguish "dataset gone" from "dataset has no tests". What the
      TestReport UI component actually renders in this 404 case is NOT
      determinable from the substrate — the TestReport component has no enriched
      sidecar (H-000), and the batch-UI-L notes do not state the empty/404 UI
