notes: "Cross-batch architectural-hygiene invariant surfaced ONLY by triangulating\n\
  the 4 batch-H repository sidecars together. None of the individual sidecars\nname\
  \ the platform-wide inconsistency — each sidecar describes its own mechanism\nas\
  \ a deliberate ADR, but the catalog reveals the platform ships 3 DIFFERENT\nsoft-delete\
  \ mechanisms + 1 hard-delete pattern across what reads as a uniform\nReactive*Repository\
  \ naming convention.\n\nRecommended cleanup paths (in increasing scope):\n\n  - Document\
  \ the asymmetry on a single page (e.g. an `adrs/`-style file in\n    the documentation\
  \ repo or a new `internal/persistence-conventions.md` page)\n    naming all 4 mechanisms\
  \ + the rationale for each. Cheap; preserves the\n    existing semantics; arms maintainers.\n\
  \n  - Standardise on ONE mechanism (preferably `deleted_at` timestamp — the most\
  \ widely\n    used) and migrate the DataEntity STATUS-state-machine + lineage is_deleted\n\
  \    + ownership hard-delete to share the same shape. High scope (DataEntity STATUS\n\
  \    state-machine carries lifecycle semantics that deleted_at does not, so the\n\
  \    migration would either lose information or require dual-write). Likely infeasible.\n\
  \n  - Document each subclass-override (DataEntity's STATUS override is the most\
  \ surprising)\n    in the ParentClass's Javadoc so a maintainer reading the parent\
  \ sees the override\n    contract before refactoring.\n\nFour DOC-NNN candidates\
  \ flow from this invariant:\n  (a) Add a 'Persistence layer conventions' note to\
  \ the internal Architecture docs\n      naming the 4 mechanisms.\n  (b) Document\
  \ the soft-delete-aware-recreation invariant on the Policies + Roles\n      live\
  \ pages (operators can recreate a policy with a previously-used name).\n  (c) Document\
  \ the hard-delete semantics on the Owners + Term-relations live pages\n      (operators\
  \ cannot undelete an ownership row — recovery via activity feed only).\n  (d) Document\
  \ the STATUS-state-machine semantics on the DataEntity Status / Lifecycle\n    \
  \  live page (operators can soft-delete + restore an entity; the entity is recoverable\n\
  \      via status change, not via a separate undelete endpoint).\n"
