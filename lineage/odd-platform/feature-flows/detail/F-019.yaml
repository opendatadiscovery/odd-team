terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Per-call: 1-N writes against the Owner directory tables.
    - CREATE: INSERT into owner + N INSERTs into owner_to_role
      (N = formData.roles.size) + 2× UPDATE on search_entrypoint
      + term_search_entrypoint search vectors.
    - UPDATE: 1× SELECT owner + 1× UPDATE owner + 1× DELETE
      owner_to_role + N× INSERT owner_to_role + 2× UPDATE on
      search vectors + 1× SELECT-join read-back.
    - DELETE: 3× SELECT EXISTS (cascade-block) + on no-cascade:
      1× DELETE owner_to_role (N rows) + 1× UPDATE owner SET
      deleted_at; on cascade-rejection: 0 writes + 1× error response.
    Side-effects fan out to USER_OWNER_MAPPING (left intact by all
    three verbs — FK by id not name) + OWNER_ASSOCIATION_REQUEST
    (left orphaned on delete — cascade-block does NOT check this
    table) + the FTS index (refreshed on create/update, NOT on
    delete).
  evidence: |-
    OwnerServiceImpl.java:38-100 (create at 38-66, update at 68-85,
    delete at 87-100) + ReactiveAbstractSoftDeleteCRUDRepository.java:50-58
    (soft-delete UPDATE) + ReactiveOwnerToRoleRepositoryImpl.java:52-56
    (DSL.delete) + V0_0_4__add_user_owner_mapping.sql:3 (FK by id) +
    V0_0_51__add_owner_association_request.sql:11 (FK no ON DELETE).
  cardinality_per_call: 1-N writes per call (N varies by roles.size + by the delete-vs-update path)
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — confirmed from primary source. Per-call multiplicity is
  1 against the directory (one Owner row created/renamed/deleted per
  request); the N-fan-out is over role bindings (deterministic by
  payload size) + the search-vector UPDATE rows (deterministic by
  the owner's prior FTS-entry count). No active probe yet; the
  amplification factor is recorded as 1 because there is no
  per-call multiplicity beyond the deterministic fan-out.
observed_vs_expected:
  facets:
  - facet: six-sidecar audit-silence pattern (Owner lifecycle trinity adds 3 to the existing RBAC mutation count)
    observed: |-
      OwnerServiceImpl.create / .update / .delete all carry NO
      @ActivityLog annotation (verified via grep across
      <odd-platform-api>/service/*.java — only 6 service files have
      @ActivityLog, none of them OwnerServiceImpl). The activity
      feed does NOT record "owner X created/renamed/deleted by Y
      at T". Combined with the role-binding HARD-delete on delete
      (irreversible) and the partial-unique-index pattern enabling
      name re-use after soft-delete, an operator can delete an Owner
      and re-create a DIFFERENT Owner with the same name, with no
      trace anywhere except the soft-deleted row's deleted_at
      timestamp (no operator-readable surface). Extends the F-006
      4-sidecar audit-silence pattern (RoleController + PolicyController
      + ReactivePolicyRepositoryImpl + ReactiveRoleRepositoryImpl)
      by adding the Owner-lifecycle 3-sidecar count.
    expected: |-
      Owner CRUD should emit OWNER_CREATED / OWNER_UPDATED /
      OWNER_DELETED activity events (matching the existing
      DATA_ENTITY_CREATED / OWNERSHIP_CREATED / etc. naming). The
      live permissions doc names the permissions but is silent on
      audit; the live owners doc is silent on audit. An operator
      auditing "who renamed Owner X to Y between dates A and B" has
      NO record to consult.
    drift_class: forensic_silence_on_owner_lifecycle_mutations
    provenance: |-
      STATIC — primary-source in createOwner sidecar (batch E)
      bugs_limitations_corner_cases[4] + updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[1] + deleteOwner sidecar (batch P)
      bugs_limitations_corner_cases[0]. Severity: HIGH.
  - facet: empty `roles` field silently destroys all role bindings on update
    observed: |-
      OwnerFormData.roles is OpenAPI-optional (`components.yaml:419-422`,
      no `required` marker); getRoleIdsList collapses both null AND
      empty list to `List.of()` (`OwnerServiceImpl.java:117-122`).
      The update transaction then calls `deleteOwnerRelationsExcept(
      ownerId, List.of()).then(createRelations(ownerId, List.of()))`
      — the first half DELETES all current role-links (no existing
      link is in the empty set); the second half INSERTS nothing. An
      operator updating ONLY the owner name (omitting `roles` to
      mean 'don't touch') INSTEAD REMOVES ALL role assignments. The
      UI in practice always sends the current `roles` list so the
      hazard is masked in normal UI flows — but any API consumer
      (script, integration) that omits `roles` silently strips ALL
      roles from the Owner.
    expected: |-
      `roles` should be treated as 'don't touch if omitted' OR explicit
      partial-update semantics (e.g. JSON Merge Patch) OR a separate
      `clear_roles` boolean flag. The destructive-default UX is
      hazardous AND silent — combined with the no-audit-log gap,
      role-stripping leaves no trace.
    drift_class: empty_roles_field_silently_destroys_bindings
    provenance: |-
      STATIC — primary-source in updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[3] + security.known_security_gaps[2]
      + OwnerServiceImpl.java:71, 76-81, 117-122 + components.yaml:419-422.
      Severity: HIGH.
  - facet: OpenAPI declares 201 for create AND update — implementation returns 200 (class-wide drift)
    observed: |-
      The OpenAPI spec declares `responses.'201'` for BOTH the
      createOwner operationId (`openapi.yaml` createOwner) AND the
      updateOwner operationId (`openapi.yaml:196`). The controller
      returns `ResponseEntity.ok = 200` on both methods (`OwnerController.java:25`
      for create, line 53 for update). Doubly anomalous: (a) declaring
      201 for a PUT-update is itself unusual (201 canonically signals
      POST-creation); (b) the implementation disagrees with the spec
      on BOTH methods. Class-wide pattern — not a per-method oversight.
      The deleteOwner method DOES align (OpenAPI declares 204, impl
      returns 204).
    expected: |-
      Either update the OpenAPI spec to declare 200 on the update
      operationId (consistent with PUT semantics) AND keep 201 on
      the create operationId (correct for POST-creation) — and fix
      the implementation to match the corrected spec. OR update the
      implementation to honour the declared 201 for create + the
      anomalous 201 for update.
    drift_class: openapi_201_vs_impl_200_class_wide
    provenance: |-
      STATIC — primary-source in createOwner sidecar (batch E)
      bugs_limitations_corner_cases[0] + updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[0] + deleteOwner sidecar (batch P)
      doc_drift_findings[2] (alignment record for symmetry). Severity:
      MEDIUM.
  - facet: OWNER.NAME rename SAFE for USER_OWNER_MAPPING — load-bearing contrast to OIDC_USERNAME rename hazard
    observed: |-
      USER_OWNER_MAPPING.owner_id REFERENCES owner(id) — the FK is
      by `owner.id` (the bigserial PK, stable across name changes),
      NOT by `owner.name`. PUT /api/owners/{owner_id} renames
      `owner.name` via OwnerMapper.applyToPojo +
      ReactiveAbstractCRUDRepository.updateOne; USER_OWNER_MAPPING
      rows continue to point at the same Owner identity. This is the
      LOAD-BEARING CONTRAST to REFACTOR-391's GitHub-login-rename
      orphan (the OIDC_USERNAME side of the rename hazard surface,
      which DOES orphan USER_OWNER_MAPPING because the handler uses
      `oidc_username='login'` — a free-rename string — and no
      stable-id fallback). The two findings together describe the
      complete rename hazard surface: OWNER.NAME safe; OIDC_USERNAME
      hazardous.
    expected: |-
      Documentation cross-link on the live owners doc + the live
      user-owner-association doc: "OWNER.NAME rename is safe for
      associations — the FK is by owner.id; OIDC username rename is
      hazardous, see REFACTOR-391". The safety invariant is
      structurally provable; surface for ADR + doc page.
    drift_class: owner_name_rename_safe_for_user_owner_mapping
    provenance: |-
      STATIC — primary-source in updateOwner sidecar (batch P)
      coherence_notes (the LOAD-BEARING contrast) + concepts.invariants[1]
      + V0_0_4__add_user_owner_mapping.sql:3 (FK declaration). Severity:
      N/A (positive case-law, no severity — but the documentation
      gap surrounding the contrast is MEDIUM).
  - facet: rename collision propagated as USR003/HTTP 400 — not 409 Conflict
    observed: |-
      The `owner_name_unique` partial unique index (`V0_0_64__remove_is_deleted_field.sql:70`)
      catches the second rename to the same active name; jOOQ raises
      `DataAccessException` → `ExceptionUtils.translateDatabaseException`
      → `UniqueConstraintException` → `ControllerAdvice.handleUniqueConstraint`
      → HTTP 400 with `ErrorCode.UNIQUE_CONSTRAINT`. The client
      receives 400, not the canonically-correct 409 Conflict. NO
      test verifies this code path; NO API doc indicates which code
      the client should expect on collision. Identical pattern on
      create (collision propagates as USR003/400 too) — class-wide
      ergonomic gap.
    expected: |-
      Rename / create collision SHOULD return HTTP 409 Conflict
      (per RFC 9110 §15.5.10 — "The 409 (Conflict) status code
      indicates that the request could not be completed due to a
      conflict with the current state of the target resource").
      USR003/400 is misleading for a constraint conflict; clients
      cannot distinguish 'bad input' from 'duplicate'.
    drift_class: rename_collision_usr003_400_not_409
    provenance: |-
      STATIC — primary-source in updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[2] + F-006 batch-K cross-batch-correction
      (the broader USR003 4xx-vs-5xx correction). Severity: MEDIUM.
  - facet: FTS search-vector refreshed on update but NOT on delete (asymmetry)
    observed: |-
      OwnerServiceImpl.update calls updateSearchVectors(owner) which
      refreshes BOTH searchEntrypointRepository.updateChangedOwnerVectors
      and termSearchEntrypointRepository.updateChangedOwnerVectors
      (lines 82, 109-114) within the same @ReactiveTransactional
      boundary. OwnerServiceImpl.delete does NOT call updateSearchVectors
      (lines 89-100). After successful delete, the FTS index continues
      to surface the deleted owner's name when users search the
      catalog (matches against search_entrypoint.search_vector for
      data entities the owner bore, until those entities are otherwise
      modified). Mirror of the F-006 batch-K
      `delete_search_vector_not_refreshed` facet (originally on
      OwnershipServiceImpl) — same gap on a sibling delete path,
      now on the OWNER side too.
    expected: |-
      OwnerServiceImpl.delete should call updateSearchVectors(owner)
      (or an equivalent FTS-removal call) inside its transactional
      boundary. The asymmetry between update (DOES refresh) and
      delete (does NOT) is unstated.
    drift_class: delete_search_vector_not_refreshed_owner_side
    provenance: |-
      STATIC — primary-source in deleteOwner sidecar (batch P)
      bugs_limitations_corner_cases[2] + OwnerServiceImpl.java:69,82
      vs 89-100 + F-006 batch-K facet `delete_search_vector_not_refreshed`.
      Severity: MEDIUM.
  - facet: idempotency on delete indistinguishable from not-found (silent 204)
    observed: |-
      OwnerServiceImpl.delete has no `switchIfEmpty(Mono.error(NotFoundException))`
      on `ownerRepository.delete(id)`. The soft-delete UPDATE filters
      `idCondition` which adds `deleted_at IS NULL`; calling delete(id)
      against a non-existent or already-soft-deleted id returns an
      empty Mono (the RETURNING clause emits nothing). The downstream
      `.then()` (line 99) and `.thenReturn(noContent())` propagate
      empty as success → HTTP 204. Caller cannot distinguish "I
      deleted it", "it was already deleted", and "it never existed".
      The update path DOES `.switchIfEmpty(Mono.error(new
      NotFoundException("Owner", id)))` (line 73); the asymmetry
      between delete and update is unstated. Mirror of F-006 batch-K
      `delete_no_not_found_validation` facet.
    expected: |-
      Either (a) add `.switchIfEmpty(Mono.error(new NotFoundException("Owner", id)))`
      to the delete path for symmetry with update, OR (b) document
      the silent-idempotent contract explicitly on the API page +
      live owners doc.
    drift_class: delete_no_not_found_validation_owner_side
    provenance: |-
      STATIC — primary-source in deleteOwner sidecar (batch P)
      bugs_limitations_corner_cases[3] + OwnerServiceImpl.java:88-100
      vs 69-85 + F-006 batch-K facet. Severity: MEDIUM.
  - facet: OWNER_TO_ROLE hard-delete on Owner delete closes orphan-binding (POSITIVE case-law)
    observed: |-
      Owner deletion HARD-DELETES owner_to_role rows via
      `ownerToRoleRepository.deleteOwnerRelationsExcept(id, List.of())`
      (OwnerServiceImpl.java:97 → ReactiveOwnerToRoleRepositoryImpl.java:52-56
      `DSL.delete(OWNER_TO_ROLE).where(...)`). The F-006 family
      pattern `permission_persistence_after_soft_delete` is closed
      CORRECTLY on the OWNER side: a deleted Owner does NOT continue
      to confer their previously-attached roles' permissions because
      the role-binding row is physically removed. This is the
      POSITIVE case-law contrast to the POLICY/ROLE half (where
      soft-delete leaves orphan grants AND the soft-deleted Policy
      surfaces in the LEFT JOIN with surviving role_to_policy edges,
      per F-006 batch H).
    expected: |-
      Either align the POLICY/ROLE half with the Owner-side
      orphan-binding closure pattern (hard-delete the binding rows
      on soft-delete of the parent) OR document the asymmetry with
      ADR-level reasoning. The current asymmetry is operationally
      meaningful — operators may expect Owner / Policy / Role
      deletions to behave uniformly.
    drift_class: owner_to_role_hard_delete_closes_orphan_binding_positive
    provenance: |-
      STATIC — primary-source in deleteOwner sidecar (batch P)
      implicit_adrs[1] + OwnerServiceImpl.java:97 +
      ReactiveOwnerToRoleRepositoryImpl.java:52-56 + cross-ref F-006.
      Severity: N/A (positive case-law, no severity).
  - facet: owner_association_request orphan rows persist after Owner delete
    observed: |-
      The cascade-block at OwnerServiceImpl.java:90-91 checks
      termOwnership + ownership + userOwnerMapping but NOT
      owner_association_request. The table has an FK to owner(id)
      (V0_0_51__add_owner_association_request.sql:11) but NO ON DELETE
      clause (defaults to NO ACTION); Owner uses soft-delete (UPDATE
      `deleted_at`, not DELETE FROM), so the FK is never consulted.
      A `PENDING` or `APPROVED` owner_association_request for the
      just-deleted Owner persists. The next `GET /api/owner_association_request`
      listing query returns the orphan row.
    expected: |-
      Either (a) add a 4th cascade-leg checking owner_association_request,
      OR (b) cascade-update the request row's owner_id to NULL on
      Owner delete (with appropriate FK ON UPDATE/DELETE clause),
      OR (c) document the orphan-persistence behaviour explicitly.
    drift_class: owner_association_request_orphan_rows_persist
    provenance: |-
      STATIC — primary-source in deleteOwner sidecar (batch P)
      bugs_limitations_corner_cases[1] + security.known_security_gaps[1]
      + V0_0_51__add_owner_association_request.sql:11. Severity:
      MEDIUM.
  - facet: soft-deleted Owner visible via GET-by-id, hidden from list (visibility asymmetry)
    observed: |-
      getOwnerList query at ReactiveOwnerRepositoryImpl.java:86-121
      uses enrichSelect which calls listCondition (inherited from
      ReactiveAbstractSoftDeleteCRUDRepository.listCondition) which
      adds `deleted_at IS NULL`. So soft-deleted Owners do NOT appear
      in the listing. However, getDto at lines 65-83 does NOT apply
      the soft-delete filter on OWNER (`WHERE OWNER.ID.eq(id)`
      without `deleted_at IS NULL`). Direct GET /api/owners/{id}
      surfaces the soft-deleted row + switchIfEmpty fires only when
      the ID does not exist at all. Visibility is INCONSISTENT
      across list vs by-id queries.
    expected: |-
      Either align getDto to apply the soft-delete filter (returning
      404 for soft-deleted Owners on by-id reads), OR document the
      visibility asymmetry explicitly. If a soft-deleted Owner's
      name is sensitive PII, the by-id surface leaks it.
    drift_class: soft_deleted_owner_visible_via_get_by_id_only
    provenance: |-
      STATIC — primary-source in deleteOwner sidecar (batch P)
      bugs_limitations_corner_cases[6] +
      ReactiveOwnerRepositoryImpl.java:65-83 vs 86-121. Severity:
      MEDIUM.
  - facet: partial-unique-index enables Owner-name re-use after soft-delete (intended)
    observed: |-
      `V0_0_64__remove_is_deleted_field.sql:68-70` issues `DROP INDEX
      IF EXISTS owner_name_unique; CREATE UNIQUE INDEX IF NOT EXISTS
      owner_name_unique ON owner (name) WHERE owner.deleted_at IS
      NULL;` — the index IS partial. After soft-delete, the name is
      freed and a subsequent POST /api/owners with the same name
      succeeds. Intended operator workflow per the migration. SUPERSEDES
      the createOwner sidecar (batch E) bugs_limitations_corner_cases[2]
      + security.known_security_gaps[2] which incorrectly claimed
      the name is BLOCKED after soft-delete. Recorded as a positive
      finding here.
    expected: |-
      Documentation on the live owners doc page explaining the
      partial-unique-index workflow — name re-use after delete is
      intended, not a bug.
    drift_class: partial_unique_index_enables_name_reuse_after_soft_delete
    provenance: |-
      STATIC — primary-source in deleteOwner sidecar (batch P)
      coherence_summary.supersedes + V0_0_64__remove_is_deleted_field.sql:68-70
      + ReactiveOwnerRepositoryImpl.java:43 (extends soft-delete CRUD).
      Severity: N/A (positive case-law; the SUPERSEDE of the createOwner
      claim is the LSN-018 case-law anchor for this batch).
  - facet: name field case-sensitive + no normalisation + no @NotBlank — homoglyph + whitespace collisions
    observed: |-
      OwnerMapper.applyToPojo (`OwnerMapper.java:18`) applies the form's
      name verbatim. The partial unique index `owner_name_unique` is
      case-SENSITIVE (no LOWER(...) in the index definition per
      V0_0_36 / V0_0_64); 'Alice' and 'alice' are distinct, both can
      coexist. No `@NotBlank`, no `@Size`, no `@Pattern` constraint
      on `OwnerFormData.name` (`components.yaml:417-418`); no
      service-layer trim / lowercase normalisation; no MapStruct
      custom mapping. An operator can rename to whitespace-only,
      empty-string (NOT rejected — `@NotBlank` absent), or
      homoglyph-collision name. The case-sensitivity differs from
      many enterprise expectations (LDAP and OIDC tokens use
      case-insensitive principals in practice).
    expected: |-
      Add `@NotBlank` + `@Size(min=1, max=255)` + a `@Pattern`
      constraint to OwnerFormData.name + a service-layer trim +
      either case-insensitive normalisation OR a documented
      case-sensitivity contract.
    drift_class: name_field_case_sensitive_no_normalisation_no_validation
    provenance: |-
      STATIC — primary-source in updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[4] + security.known_security_gaps[3]
      + createOwner sidecar (batch E) security.known_security_gaps[1]
      (mirror). Severity: LOW.
  - facet: per-Owner authorization scoping ABSENT — global OWNER_CRUD permission model
    observed: |-
      `SecurityConstants.SECURITY_RULES[143-147]` registers OWNER_CREATE
      + OWNER_UPDATE + OWNER_DELETE with `NO_CONTEXT`. A caller with
      OWNER_UPDATE can rename ANY Owner row, regardless of
      USER_OWNER_MAPPING-association. There is no `@PreAuthorize`
      enforcing "only an admin or the bound user can rename their
      own owner". Same posture across all three CRUD permissions.
      Consistent with the platform-wide read-collaborative posture
      (REFACTOR-024 family) but the write-side equivalent is not
      articulated in any ADR draft.
    expected: |-
      ADR documenting the global Owner-CRUD posture — "Owner directory
      management is admin-only; per-Owner scoping is not enforced
      because operators authoring the directory operate above the
      data they manage". Cross-link to F-006 / F-011's read-collaborative
      ADR-CANDIDATE-003.
    drift_class: per_owner_authorization_scoping_absent
    provenance: |-
      STATIC — primary-source in updateOwner sidecar (batch P)
      security.known_security_gaps[1] + deleteOwner sidecar (batch P)
      security.owner_scoping + SecurityConstants.java:143-147. Severity:
      MEDIUM.
  - facet: DISABLED-mode anonymous reach on destructive verbs
    observed: |-
      Under `auth.type=DISABLED`, the SecurityRule entries for
      OWNER_CREATE / OWNER_UPDATE / OWNER_DELETE remain in the rules
      list but the WebFlux filter chain doesn't run (per
      DisabledAuthSecurityConfiguration.java:11-19, batch-C sidecar).
      Anonymous renaming + deletion of any Owner is then unbounded.
      Combined with the no-audit-log gap, the directory can be
      silently rewritten by any caller on a network-reachable port.
      17th surface in the REFACTOR-185 16-sidecar triangulation
      (deleteOwner + updateOwner add 2 surfaces to the existing 16;
      createDataSourceEntity is a separate 17th via F-008).
    expected: |-
      Documentation on the live `/configuration-and-deployment/enable-security`
      page explicitly warning that DISABLED mode bypasses ALL
      SecurityRule entries including the destructive Management
      verbs. Operator-facing red-banner caveat.
    drift_class: disabled_mode_anonymous_reach_destructive_verb
    provenance: |-
      STATIC — primary-source in updateOwner sidecar (batch P)
      bugs_limitations_corner_cases[6] + deleteOwner sidecar (batch P)
      bugs_limitations_corner_cases[6] + REFACTOR-185.md. Severity:
      LOW (corollary of REFACTOR-185; DISABLED is dev-only per docs).
