behaviour: |-
  **CRITICAL — `DIRECT_OWNER_SYNC` + `OwnerService.getOrCreate` chain is a one-shot privilege-escalation: MINT a fresh Owner directory row + immediately self-bind to it, with no `OWNER_CREATE` permission required and no admin-approval gate.** Primary-source confirmed in the batch-V OwnerAssociationRequestController + OwnerAssociationRequestServiceImpl sidecar primary source verified at the file (DIRECT_OWNER_SYNC at `OwnerAssociationRequestServiceImpl.java:64`):

  **The chain — three composable steps in one HTTP request**:
  1. `POST /api/owner_association_request` has NO `SecurityRule` entry — any authenticated user can submit (`OwnerAssociationRequestController.md:security.authorization_assertions.ABSENT — POST /api/owner_association_request has NO SecurityRule entry`).
  2. The service calls `ownerService.getOrCreate(ownerName)` (`OwnerAssociationRequestServiceImpl.java:57`) — if no Owner with that name exists, mint a new one. No `OWNER_CREATE` permission is checked.
  3. The service then checks `permissionService.getNonContextualPermissionsForCurrentUser(MANAGEMENT)` (`OwnerAssociationRequestServiceImpl.java:60-67`) — if the caller holds `DIRECT_OWNER_SYNC`, the request is AUTO-APPROVED synchronously. The `USER_OWNER_MAPPING` row is created in-line; no admin click is required; no audit-trail awaiting-approval row is left in `owner_association_request` for an operator to vet.

  **What an attacker holding only `DIRECT_OWNER_SYNC` can do in a single curl**:
  ```
  curl -X POST https://platform/api/owner_association_request \
       -H "Authorization: Bearer $TOKEN" \
       -d '{"name": "platform-admin-owner-impersonator"}'
  ```
  - Step (a): the endpoint has no SecurityRule → the request bypasses the SecurityConstants permission check entirely (any authenticated user reaches the service).
  - Step (b): no Owner with that name exists → `getOrCreate` mints `platform-admin-owner-impersonator` as a new Owner row. The attacker did NOT have `OWNER_CREATE`.
  - Step (c): the caller holds `DIRECT_OWNER_SYNC` → the request is auto-approved synchronously; a `USER_OWNER_MAPPING` row is created binding the attacker's `(oidcUsername, provider)` to the newly-minted Owner.
  - Result: the attacker is now bound to an Owner whose name they chose, in a system where `Owner` is the principal for `My Objects`, `Dependents`, and owner-scoped read filters. The newly-minted Owner has zero roles by default, BUT the attacker's user identity is now permanently bound to an arbitrary Owner string.

  **Why CRITICAL not HIGH**: while a single-step `DIRECT_OWNER_SYNC` auto-approve to an EXISTING Owner is the documented (silent) escalation path, the COMPOUND with `OwnerService.getOrCreate` means the attacker also chooses the Owner's NAME. The chain is THREE bypass surfaces stacked: (1) no SecurityRule on POST, (2) no OWNER_CREATE check inside getOrCreate, (3) DIRECT_OWNER_SYNC auto-approve. Combined with the live doc page describing ONLY the two-step `SELF-request → Admin-approve` flow (`OwnerAssociationRequestController.md:coherence_notes.[3] — DIRECT_OWNER_SYNC absent from live docs as of 2026-05-20`), operators reading the docs CANNOT discover this chain, CANNOT audit it (the `getOrCreate` side has no doc explanation), and CANNOT distinguish "real workflow" from "escalation chain" in the activity feed (the `REQUEST_APPROVED` activity-type row looks identical in both cases). The compound disclosure invisibility + bypass stacking + lack of any feature flag to disable DIRECT_OWNER_SYNC makes this CRITICAL. Cross-pillar P-08 + P-09. Sister case-law class to LSN-001 / LSN-002 operator-cliff family.

  **Operational consequences**:
  - In an OIDC deployment where `DIRECT_OWNER_SYNC` is bound via group-claim (intended for "trust the IdP" deployments), a misconfigured group membership grants this chain to anyone in the group — silently. There is no admin-on-approval review.
  - An operator-investigation discovering an unexpected Owner row asks "who created this?" — the activity-feed `REQUEST_APPROVED` row has `status_updated_by = the requester` (because the auto-approve path makes the requester their own approver). The forensic record is intact at the request-tier but obscured: nothing distinguishes self-approve from admin-approve in the activity-list page UI.

  **Test gap shape**: regression-pin asserting the full chain in one test method. Authenticate as a user with ONLY `DIRECT_OWNER_SYNC` (no `OWNER_CREATE`, no `OWNER_ASSOCIATION_MANAGE`); POST `/api/owner_association_request` with `name: "fresh-owner-" + UUID.randomUUID()`; assert (a) HTTP 200/201; (b) a new Owner row exists; (c) a `USER_OWNER_MAPPING` row binds the caller's identity to the new Owner; (d) the activity-feed contains exactly ONE `REQUEST_APPROVED` row with `status_updated_by = the caller` (the self-approve fingerprint). Pin the entire chain. When the fix lands (either split getOrCreate, OR require OWNER_CREATE inside the auto-approve path, OR audit-flag the self-approve case), the test inverts in the relevant cell.
