- id: H-012
  hypothesis: "When a platform has thousands of data sources of one type (e.g. 5K Postgres instances), opening that type's level-2 list returns a usable, bounded response — the user is not handed all 5K rows in one payload, each with per-row reflection cost."
  derivation: "Negative-space + performance seed — a browse surface at scale is expected to paginate; levels 1-3 declare no page/size; the level-2 list runs unmemoised reflection per row."
  seed_source: negative-space + pillar
  validation:
    verdict: probe-needed
    actual_behavior: |
      Statically: openapi.yaml:3745-3779 declares NO page/size on levels 1-2-3, so the level-2
      response carries every matching datasource in one payload, and getOddrnPathProperties runs
      unmemoised reflection per row (DirectoryServiceImpl.java:138-171). What this DOES to the
      operator at 5K sources — response latency, payload size, browser render stall, server
      in-memory grouping cost — requires running the system to know the actual breaking point and
      whether the UI degrades gracefully or hangs. The static facts confirm the unbounded shape;
      the operator-visible severity is a measurement.
    evidence:
      - sidecar: odd-platform__java__DirectoryController__controller-class__DirectoryController
        section: bugs_limitations_corner_cases[6] + performance.known_performance_gaps[1]
        cite: "openapi.yaml:3745-3779; DirectoryServiceImpl.java:138-171"
        note: "no pagination at levels 1-3; unmemoised per-row reflection"
    operator_visible_failure: |
      Probable (unmeasured): a multi-second level-2 load and a large DOM for high-cardinality
      prefixes; the level-1 in-memory grouping cost is paid on every navigation (no staleTime,
      no HTTP cache). Magnitude is the open question the probe resolves.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-023-1
    routes_to_finding: functional-test-demand
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-023-1"

