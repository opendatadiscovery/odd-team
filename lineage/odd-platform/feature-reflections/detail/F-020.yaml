    severity: HIGH
    confidence: HIGH
    use_case_kind: teardown-constraint
    coverage: verified
    test_ref: "CollectorTokenStorageKnownBugTest.collectorTokenLookedUpByPlaintextEquality_knownBug_PLT085 (@pins PLT-085)"
    test_demand: none
