name: Update Data Source (UI admin path — full-form REPLACE)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  NEW OPERATION, batch 2026-05-21ZB — surfaced at primary source by
  the updateDataSource method-level sidecar. PUT
  /api/datasources/{data_source_id} is the UI-admin "edit data source"
  action on the Management → Datasources tab. It is the missing
  third UI-admin DataSource write operation — the registry already
  carried `register-data-source` (POST) and `regenerate-data-source-token`
  (PUT .../token); this is the UPDATE operation.

  THE OPERATION — what PUT /api/datasources/{id} does:

    The controller handler (DataSourceController.java:38-45) is a
    4-line reactive proxy: unwrap the Mono<DataSourceUpdateFormData>
    body, flatMap into dataSourceService.update(id, form), map to
    ResponseEntity.ok (HTTP 200). All behaviour lives in
    DataSourceServiceImpl.update (DataSourceServiceImpl.java:68-83,
    @ReactiveTransactional):
      (1) load the existing row via dataSourceRepository.getDto(id);
      (2) switchIfEmpty → NotFoundException → HTTP 404 when the row is
          absent OR soft-deleted (getDto filters deleted_at IS NULL);
      (3) IF namespace_name is non-empty, namespaceService.getOrCreate
          resolves OR creates the namespace (the NAMESPACE_CREATE
          side-door — see the namespace-create-side-doors invariant);
      (4) apply the form to the existing pojo via the MapStruct
          @MappingTarget mapper DataSourceMapper.applyToPojo
          (DataSourceMapper.java:49-56);
      (5) persist the single-row UPDATE;
      (6) refresh the FTS search vectors (updateChangedDataSourceVector
          + updateChangedNamespaceVector | clearNamespaceVector).
    All 6 steps commit/roll back inside ONE @ReactiveTransactional
    boundary.

  AUTHORIZATION: path-gated by DATA_SOURCE_UPDATE Permission
  (MANAGEMENT tier) at SecurityConstants.java:118-120. NO @PreAuthorize
  on the handler, NO programmatic permission check in the service —
  the gate is 100% declarative. Under auth.type=DISABLED the endpoint
  is fully open (DisabledSecurityConfiguration permitAll, no
  principal). S2S X-API-Key grants ADMIN, satisfying DATA_SOURCE_UPDATE
  unconditionally.

  THE LOAD-BEARING CONTRACT — REPLACE not MERGE:

    `update` is a full-form REPLACE of the 3 mutable fields (name,
    description, namespace_name), NOT a field-wise MERGE. An omitted
    PUT-body field deserialises to null and is written as null onto
    the existing row (MapStruct default SET_TO_NULL; MapperConfig sets
    no nullValuePropertyMappingStrategy). A partial body to rename a
    source SILENTLY WIPES the description and detaches the namespace.
    This is captured at the dedicated invariant
    `datasource-update-replace-not-merge-mapstruct-set-to-null` — that
    invariant is the operator hazard; THIS operation entry is the
    catalogue placement.

  KEY FACTS:
    - 404-on-missing is a CLEAN fail-fast — the endpoint NEVER
      silently no-ops on a never-existed or soft-deleted id. This is
      the SAME guard DataEntityServiceImpl.createMetadata uses and the
      one DataEntityServiceImpl.upsertDescription deliberately omits
      (the F-004 counter-case).
    - The token is NOT in DataSourceUpdateFormData — this endpoint
      never touches the token; rotation is the separate
      regenerateDataSourceToken endpoint.
    - Renaming to a `name` already held by another LIVE data source
      raises SQLSTATE 23505 → HTTP 400 UniqueConstraintException (the
      data_source_name partial-unique index).
    - The endpoint emits NO Activity Event — the edit is invisible to
      the Activity Feed (the data_source-mutation audit gap).
    - Concurrent PUTs to the same id are last-writer-wins with NO
      conflict detection (no optimistic-lock version column on
      data_source) — a lost-update window.
    - Returns HTTP 200 (controller line 44) but openapi.yaml:482
      declares 201 — the codebase-wide 200-vs-201 drift class.

  DISTINCT FROM the S2S ingestion path
  (IngestionController.createDataSourceEntity, POST /ingestion/datasources):
  the UI update is full-form REPLACE; the S2S path is UPSERT-by-ODDRN
  partial-merge of name + description only. See the
  datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation
  invariant for the 5-vertex architectural picture.
