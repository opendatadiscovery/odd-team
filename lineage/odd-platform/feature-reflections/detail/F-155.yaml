# Term Query-Example Tab — product-owner reflection

## product_owner_narrative

**What the feature is.** The Term Query-Example tab is the cross-pillar bridge between the Data Glossary (P-06) and Data Modelling (P-02): on any glossary Term's detail page there is a "Query examples" tab (`/terms/:termId/query-examples`) that lists the operator-curated SQL / KQL / Spark snippets that have been attached to that term, and — for users with the right permission — lets them attach an existing Query Example to the term via a "Link query" affordance (per feature-flow F-155 chain hops 1-2; per `system-mission.md:185` "reverse-look-up every entity tied to a Term" + `system-mission.md:109` "link a snippet to multiple datasets and terms"). The audience is the data-steward-owner curating the glossary (`system-mission.md:196`) and the data-engineer-analyst who authored the snippets (`system-mission.md:121`); the value is that a business term like `Customer` carries, on its own page, the canonical queries that operate on the data that term names.

**How a user interacts with it.** The user navigates to a term, clicks the "Query examples" tab, and sees a list of linked query examples — each row shows the example's `definition` (human description) and `query` (the executable snippet), rendered verbatim (per `QueryExampleController` sidecar `concepts.QueryExampleList` + the IT-034 ground-truth: "the definition + SQL render"). This tab is the ONLY sub-route of the Term detail page wrapped in an explicit route-layer permissions gate (`WithPermissionsProvider` with `[QUERY_EXAMPLE_TERM_CREATE, QUERY_EXAMPLE_TERM_DELETE]`, per F-155 chain hop 1 / `TermDetailsRoutes.tsx:33-44`). To attach an example the user clicks "Link query" (a button, rendered only for `QUERY_EXAMPLE_TERM_CREATE` holders, per `TermQueryExamples.tsx:33,40` — read this session), which opens a dialog containing a `QueryExamplesAutocomplete` combo-box (a shared P-02 component); selecting one and submitting fires `useAssignTermQueryExample(termId)` → `POST /api/terms/{term_id}/queryexample` → `TermController.createQueryExampleToTermRelationship` → `QueryExampleService.linkTermWithQueryExample` (per `TermController` sidecar `operations.createQueryExampleToTermRelationship`, gated by `QUERY_EXAMPLE_TERM_CREATE` on `term_id` at `SecurityConstants.java:187-189`).

**The working parts.** The READ path (`useGetQueryExamplesByTermId` → `GET /api/queryexample/term/{term_id}` → `QueryExampleController.getQueryExampleByTermId`, line 59 of the controller) is a single 5-jsonArrayAgg JOIN returning ALL examples linked to the term in one response, with NO RBAC gate (read-collaborative posture per `QueryExampleController` sidecar `operations.getQueryExampleByTermId` + `system-mission.md:267`) and with `hasNext` hard-coded to `false` (`QueryExampleMapper.mapListToQueryExampleList` lines 72-74) — there is no pagination on this endpoint regardless of how many examples are attached. The WRITE path is permission-gated at the controller perimeter only (the service tier has zero programmatic checks per `QueryExampleController` sidecar `invariants`). Both `definition` and `query` are stored verbatim as PostgreSQL `text` and rendered client-side through `@uiw/react-md-editor`'s `MDEditor.Markdown` (`QueryExamplesListItem.tsx:45,52`), which makes this list the **4th surface of the F-004 stored-XSS family** (per `QueryExampleController` sidecar `security.known_security_gaps.[0]`).

**The integration story.** This feature is a textbook cross-pillar surface (`system-mission.md` P-02 `feeds_from: [P-06]`, P-06 `feeds: [P-02]`): the Query Example entity, the `QueryExamplesAutocomplete`, and the `QueryExamplesListItem` all belong to P-02 Data Modelling; the term, the tab, and the `query_example_to_term` link table belong to P-06 Data Glossary; the write endpoint lives on `TermController` (P-06) but delegates to `QueryExampleService` (P-02). A consequence the product owner must flag: query-example↔term linkage emits NO Activity Feed entry (`QueryExampleServiceImpl` carries no `@ActivityLog`, per `QueryExampleController` sidecar `downstream_side_effects` — the canonical `audit-log-presence-asymmetry` from `system-mission.md:386-395`), so an auditor reviewing "what changed on this term" sees term edits but NOT query-example attach/detach.

**Edge cases a demo would highlight.** Empty state: a term with no linked examples shows an empty-content placeholder (`TermQueryExamples.tsx:57`, verified by IT-034 negative case). Duplicate-definition collision: the list renders React rows keyed on `qe.definition` (free-text SQL) rather than `qe.id` (`TermQueryExamples.tsx:51`, read this session) — two examples with identical SQL text silently collapse to one rendered row (F-155 facet `react_key_on_qe_definition_text_potential_collision`). Silent failure: the assign dialog auto-closes only on success (`handleCloseSubmittedForm={isSuccess}`, `AssignTermQueryExampleForm.tsx:81`) and the submit promise has a `.then` but NO `.catch` (line 38) — a backend reject leaves the dialog open with no error message. Label inconsistency: the affordance is "Link query" (the button) but the dialog title and submit button both say "Add query example" (`TermQueryExamples.tsx:40` vs `AssignTermQueryExampleForm.tsx:45,65`) — a paper-cut for a first-time user.

