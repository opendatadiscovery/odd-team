notes: 'Surface as cross-cutting hygiene concern. The pattern of ''wired by

  direct @ConditionalOnProperty rather than the Condition class designed

  for the job'' (AuthorizationManagerCondition case) is structurally

  different from ''sibling config key never wired'' (webhookUrl case), but

  both expose maintainers to subtle ''I thought this would work'' failure

  modes. Recommended cleanup: delete the Condition class, or wire it

  properly; delete the webhookUrl field, or @Deprecated-annotate it with

  a migration pointer to notifications.receivers.webhook.url.

  '
