notes: 'Multi-Tenant Configuration is a sub-concept of Metrics Ingestion but

  operationally distinct enough to merit its own catalog entry: it

  carries its own retrospective-class finding (the empty-string

  read/write asymmetry is the LSN-002-class concern flagged in the

  input prompt — same shape as MinIO''s silent us-east-1 pin: a primitive

  default silently breaks the feature when an operator thinks they

  configured it). main-concepts.md does not name "Tenant" or

  "Multi-Tenant" as canonical vocabulary. Recommended canonicalisation:

  add a "Multi-Tenant Metrics" section to the operator reference

  explicitly stating the asymmetry — "leave odd.tenant-id UNSET (not

  empty-string) in single-tenant deployments" — and consider tightening

  the write-side guard to `StringUtils.isNotEmpty(tenantId)` for

  consistency.

  '
