name: Live-filter (no Apply gate) — multi-CTE SQL runs on every chip toggle
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The Data Quality Dashboard has NO 'Apply Filters' button, NO debounce,
  and NO batch gate between operator selection and dashboard re-query.
  Every single filter chip toggle triggers a full multi-CTE multi-join
  `getDataQualityTestsRuns` SQL run. An operator building a multi-chip
  filter slice fires one multi-CTE multi-join backend query PER chip,
  not one on an "Apply" click. NEW invariant, batch ZC (2026-05-22).

  The trigger chain:
    1. User clicks a chip → DataQualityFilters writes formFiltersAtom
       (DataQualityStore.ts:11-22 via useFilter at hooks/index.ts:22-37).
    2. filtersAtom (derived) recomputes synchronously
       (DataQualityStore.ts:32-42).
    3. New filtersAtom value produces a new react-query queryKey in
       useGetDataQualityDashboard (dataQuality.ts:74-82).
    4. react-query fires GET /api/dataqatests/runs with the new params.
    5. Backend executes the three-query zip
       (DataQualityRunsServiceImpl.java:36-39).

  No step debounces. No step batches. Filling out a five-chip filter
  produces five backend dashboard fetches in close succession; react-
  query dedupes only IDENTICAL queryKeys, not the gradual key
  progression as chips accumulate.

  Triangulated across THREE contributing sidecars (DataQualityStore,
  DataQualityContent, DataQualityFilters) — the same MEDIUM-severity
  gap recorded from three angles, no disagreement.

  Severity MEDIUM: the dashboard SQL is the multi-CTE multi-join
  `getLatestDataQualityRunsResults / getLatestTablesHealth /
  getMonitoredTables` zip (`ReactiveDataQualityRunsRepositoryImpl`,
  beyond UI sidecar 1-hop budget) — not a free query. For an operator
  building a slice of 8 chips across 2 sides, backend load is 8 full
  dashboard executions where 1 would suffice with an Apply gate.

  Suggested fix options:
    (a) "Apply filters" button: classical, operator-explicit, lowest
        risk. Cost: extra click for every filter change; some operators
        will assume the button is unnecessary and miss it.
    (b) Debounce the filter-to-fetch path (e.g. 500ms): no UX change,
        most edits coalesce; latency-cost at the trailing edge of an
        edit burst. The codebase already has a `broken-debouncer-pattern-
        recreated-on-every-render-loses-rate-limit-semantics` invariant
        warning about a common debounce-implementation pitfall — the fix
        must be implemented carefully.
    (c) Both: an Apply button for explicit batches AND a debounce for
        rapid-correction scenarios.

  vocabulary_status: codebase-anchored. The pattern is a UI-implementation
  choice; the live dashboard.md does not document interaction model and
  is silent on this behaviour.
vocabulary_status: codebase-anchored
