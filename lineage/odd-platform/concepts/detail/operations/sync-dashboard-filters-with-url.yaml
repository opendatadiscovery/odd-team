name: Sync dashboard filters with URL (bidirectional searchParams round-trip)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The two-way URL ↔ jotai-atom synchronisation behind the Data Quality
  Dashboard's filter panel. Two `useEffect` hooks at
  `DataQualityFilters.tsx:28-54` form a bidirectional bridge: one hydrates
  `formFiltersAtom` from React Router's `searchParams` on mount (and on
  any `searchParams` change); the other writes `formFiltersAtom` back to
  the query string with `{ replace: true }` on every `formFilters` change.
  NEW operation, batch ZC (2026-05-22).

  Wire format: each non-empty filter array is JSON-stringified into a
  query-param value carrying the FULL FilterOption[] (id + name), not
  just the id list — so `/data-quality?namespaceIds=%5B%7B%22id%22%3A1%2C%22name%22%3A%22prod%22%7D%5D`
  carries both the filter id and the human-readable name (the name is
  preserved across reloads so the autocomplete chip can render its label
  without re-querying the list API for one id).

  The intent is dashboard-view deep-linking: an operator can bookmark or
  paste a `/data-quality?...` URL and land on the same filtered view;
  `replace: true` avoids polluting browser history with every keystroke-
  driven filter change. The operation is a UX contract — a filter panel
  that only used jotai would lose state on reload.

  Failure mode: the mount effect does `JSON.parse(value)` on each query-
  param value with NO try/catch (DataQualityFilters.tsx:35). A user who
  hand-edits `/data-quality?namespaceIds=foo` (not valid JSON) causes
  `JSON.parse` to throw inside the effect; React surfaces this as an
  uncaught render-time error. The effect also only copies a key if
  `key in newFilters` (line 32), so an unknown query param is silently
  ignored — acceptable — but a malformed value for a KNOWN key crashes
  rather than degrading. There is no schema validation on the parsed
  shape (a param parsed to a non-array, or to objects missing `id`,
  flows straight into `formFiltersAtom`).

  vocabulary_status: codebase-anchored. The live
  https://docs.opendatadiscovery.org/features/data-quality/dashboard
  (WebFetched 2026-05-22 status 200) does NOT document this URL round-trip
  — operators cannot discover from the docs that the dashboard view is
  deep-linkable / shareable. DOC-NNN follow-up.
vocabulary_status: codebase-anchored
