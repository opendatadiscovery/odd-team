proposed_action: |-
  Add `OwnerAssociationRequestControllerHttpFloorTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Six test methods covering all 7 endpoints + the SecurityConstants wiring assertion:
  1. `createOwnerAssociationRequest_anonymousAuthenticatedUser_succeeds_pinsNoSecurityRule` — pin the no-gate POST.
  2. `listOwnerAssociationRequests_callerWithOWNER_ASSOCIATION_MANAGE_succeeds_otherwise403` — pin the GET LIST gate.
  3. `updateOwnerAssociationRequest_callerWithOWNER_ASSOCIATION_MANAGE_succeeds_otherwise403` — pin the PUT gate.
  4. `createUserOwnerMapping_callerWithOWNER_RELATION_MANAGE_succeeds_otherwise403` — pin the POST mapping gate.
  5. `deleteActiveUserOwnerMapping_callerWithOWNER_RELATION_MANAGE_succeeds_otherwise403` — pin the DELETE mapping gate.
  6. `securityConstantsTableConsistency_pathToPermissionMappingMatchesDocumented` — a separate test enumerating the 5 path-pattern entries at SecurityConstants.java:148-162 and asserting each resolves to the documented permission key (per the live permissions doc page).

  Add a `// REGRESSION-PIN — OwnerAssociationRequestController HTTP-tier floor. A SecurityConstants editing error or OpenAPI path-slug change will be caught by tests #2-#5. Test #6 asserts the entire SecurityConstants table consistency against the live docs.` comment block.
