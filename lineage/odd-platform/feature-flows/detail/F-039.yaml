      `/api/genai/ask` reachable to anonymous callers (the page does
      document the API-only-today nature; the DISABLED-mode caveat is the
      additional disclosure), OR (b) the controller declines DISABLED
      mode for the genai endpoint specifically.
    drift_class: disabled_mode_anonymous_reach
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar
      bugs_limitations_corner_cases[?] + security.known_security_gaps[5].
      Evidence: DisabledAuthSecurityConfiguration.java:13-17 + GenAIController.java:13-24
      (no method-level @ConditionalOnProperty / @ConditionalOnExpression).
      Severity: LOW (operator misuse of dev-only mode) — joins the
      REFACTOR-185 DISABLED-bypass cluster.
  - facet: |-
      Response-unwrap silently brittle — assumes external service returns
      a JSON-quoted string
    observed: |-
      GenAIServiceImpl.java:45-47 does
      `new GenAIResponse().body(StringEscapeUtils.unescapeJava(CharMatcher.is('"').trimFrom(item)))`.
      The transformation assumes the external service's response is a
      JSON-encoded quoted string (e.g. `"the answer text\\n"`); trim-quote
      + unescape converts that to the unquoted, unescaped string. If the
      external service returns a structured JSON object (e.g.
      `{"answer":"the answer text"}`), `CharMatcher.is('"').trimFrom`
      strips boundary `"` chars (none exist at the boundaries of `{...}`,
      so the JSON text is returned literal); `StringEscapeUtils.unescapeJava`
      then processes any `\n`/`\t` it finds. The user sees raw JSON text in
      the response body — silently wrong, not a clear error.
    expected: |-
      Either (a) document the response-shape contract (external service
      MUST return a JSON-quoted string, not a structured JSON object), OR
      (b) the platform accepts both shapes via content-negotiation or a
      JsonNode-then-format step.
    drift_class: response_unwrap_brittle_assumes_quoted_json_string
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar
      bugs_limitations_corner_cases[5] + concepts.invariants.response-unwrap-brittle.
      Evidence: GenAIServiceImpl.java:45-47. Severity: MEDIUM (silent wrong
      response, not a crash).
  - facet: |-
      Enabled gate at SERVICE tier (HTTP 400) — asymmetric with sibling
      DataCollaboration @ConditionalOnProperty (HTTP 404)
    observed: |-
      GenAIController.java:13-24 — no `@ConditionalOnProperty` on the
      controller class. The bean is ALWAYS registered; the route is
      always REACHABLE. The gate is at the SERVICE layer:
      GenAIServiceImpl.java:37-39 — `if (!genAIProperties.isEnabled())
      throw new BadUserRequestException("Gen AI is disabled")` → HTTP 400
      via ControllerAdvice.java:24-28. The sibling EventApiController
      (data collaboration) carries `@ConditionalOnDataCollaboration` so
      its bean is NOT registered when the feature is disabled — that
      endpoint returns HTTP 404. Two siblings, two different conventions
      for "feature flag off". Both internally consistent; the inconsistency
      between sibling controllers is the finding.
    expected: |-
      Either (a) align the two conventions (both 400 or both 404 — the
      choice is product-policy, not technical), OR (b) document both
      conventions explicitly so operators / SDK consumers know what to
      expect from each.
    drift_class: enabled_gate_at_service_tier_400_not_404_diverges_from_sibling_conditionalonproperty_pattern
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar implicit_adrs[1].
      Evidence: GenAIServiceImpl.java:37-39 + ControllerAdvice.java:24-28
      + GenAIController.java:13-24 (no @ConditionalOnProperty) +
      contrast with EventApiController.java:15 (@ConditionalOnDataCollaboration).
      Severity: LOW (operator-observable but benign — both behaviours
      are acceptable; the inconsistency is the actionable finding).
  - facet: |-
      Live feature page documents platform-to-EXTERNAL stance but is
      silent on platform-to-USER stance
    observed: |-
      Live `features/active-platform-features/genai` (WebFetch 2026-05-25
      status 200) documents the three platform-to-external posture
      statements: (a) "no authentication" to the external service, (b)
      "no retry logic", (c) "no prompt modification". The platform-to-user
      posture is SILENT: (a) NO statement about ODD-side authorization
      (any authenticated user can call); (b) NO per-user / per-tenant
      rate limit warning; (c) NO request-body size cap warning; (d) NO
      prompt-injection mitigation guidance; (e) NO audit-log disclosure
      (in fact, no audit log exists); (f) NO PII redaction guidance.
      An operator reading the feature page does NOT learn from the docs
      alone that any authenticated user can drive arbitrary cost on the
      operator's AI vendor account with no in-platform record of what
      was asked.
    expected: |-
      The live feature page disclosures all five platform-to-user gaps
      (no authorization beyond authenticated; no rate-limit; no audit
      log; no PII redaction; no body-size cap) so an operator enabling
      the feature understands the full risk surface.
    drift_class: live_doc_acknowledges_no_authentication_no_retry_but_silent_on_no_authorization_no_rate_limit_no_audit_no_pii_redaction
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar
      docs_link_semantic.doc_drift_findings[0]. Evidence: WebFetch
      `features/active-platform-features/genai` 2026-05-25 status 200
      (verbatim excerpts captured in sidecar) + GenAIController.java:13-24
      + GenAIServiceImpl.java:35-52 + grep for rate-limit/audit-log/PII-redact
      primitives (zero matches). Severity: HIGH (the actionable finding;
      doc-gap routes to doc-gap-finder).
  - facet: |-
      Request body unbounded — no @Size, no @Pattern, no maxLength
    observed: |-
      `GenAIRequest.body` is `type: string` in the OpenAPI schema
      (components.yaml:4200-4204) with NO `maxLength`, NO `pattern`, NO
      `description`. The generated Java model carries no `@Size`,
      `@NotBlank`, or `@Pattern`. The controller method
      (GenAIController.java:19-23) has no `@Valid` on the `Mono<GenAIRequest>`
      parameter. An authenticated user can POST a multi-megabyte body
      which is forwarded verbatim to the external service. Combined with
      the no-auth-gate finding and no-rate-limit finding, this is a
      cost-injection vector — a single API call with size=50MB charges
      the operator's external LLM account for tokens that may exhaust
      the LLM's context window.
    expected: |-
      Either (a) `@Size(max=N)` on the body field + `maxLength: N` in the
      OpenAPI schema (typical LLM context windows are 4K-128K tokens —
      a 50KB cap on the input body is reasonable), OR (b) the live doc
      states no body-size cap exists at the platform layer.
    drift_class: request_body_unbounded_no_maxlength_no_validate
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar
      bugs_limitations_corner_cases[1] + security.known_security_gaps[1].
      Evidence: components.yaml:4200-4204 + GenAIController.java:19-23.
      Severity: HIGH.
  - facet: |-
      ServerWebExchange parameter exposed but discarded — Cat F fix-anchor
    observed: |-
      GenAIController.java:19-20 — the controller method signature takes
      `ServerWebExchange exchange` (auto-injected by Spring as part of
      the generated GenaiApi interface signature), but the body never
      references it. `exchange.getPrincipal()` returns the user, but no
      log captures it. `exchange.getRequest().getHeaders()` returns
      headers (X-Forwarded-For, User-Agent, X-Tenant-Id), but no policy
      consumes them. The trace context is available but never propagated.
      This is the canonical Category F available-but-unused smell — the
      fix-anchor for adding audit logging, rate-limit-by-user, or
      per-user permission checks.
    expected: |-
      The controller body reads the exchange and either (a) logs the
      Principal + question, or (b) wraps the call in a rate-limited
      decorator, or (c) calls a permission service for a GENAI_USE
      check.
    drift_class: server_web_exchange_exposed_but_discarded_fix_anchor_for_audit
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar
      bugs_limitations_corner_cases[8] + stress_findings.request_inputs
      (the body field Q5 available-but-unused). Evidence:
      GenAIController.java:19-23 (exchange parameter declared but
      unreferenced in method body). Severity: MEDIUM (the fix is small;
      the operator-visible consequence depends on which gap closes
      first).
  - facet: |-
      No max-in-memory-size override on genAiWebClient — 256KB default
      cuts off long-form LLM responses
    observed: |-
      WebClientConfiguration.java:26-29 — the `WebClient.builder()` chain
      does NOT call `.codecs(c -> c.defaultCodecs().maxInMemorySize(...))`.
      The WebClient uses Spring WebFlux default 256KB. The application-wide
      `spring.codec.max-in-memory-size: 20MB` (application.yml:14-15) is
      NOT inherited onto this client because the builder chain doesn't
      apply it. Verbose LLM answers (long-form summaries, multi-paragraph
      explanations) > 256KB throw DataBufferLimitException mid-stream,
      collapsing through `.onErrorResume` to a generic GenAIException →
      HTTP 500 with the raw DataBufferLimitException.getMessage().
    expected: |-
      Either (a) explicit `.codecs(c -> c.defaultCodecs().maxInMemorySize(20*1024*1024))`
      on the genAiWebClient builder (matching the platform-wide setting),
      OR (b) the live doc disclosures the 256KB cap so operators
      requesting long-form LLM responses configure a smaller-output prompt.
    drift_class: no_max_in_memory_size_override_256kb_default_long_form_response_fails
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar
      bugs_limitations_corner_cases[7] + performance.resource_allocation[2].
      Evidence: WebClientConfiguration.java:26-29 + application.yml:14-15.
      Severity: MEDIUM.
  - facet: |-
      genai.url accepts any string — no scheme allowlist, no SSRF guard
    observed: |-
      GenAIProperties.java:10 — `String url` field with no `@URL` constraint,
      no `@Pattern` for scheme/host allowlist. WebClientConfiguration.java:28
      sets `.baseUrl(genAIProperties.getUrl())` with no validation. An
      operator (or an attacker with config-write access) can point the
      outbound POST at any reachable URL, including the platform's own
      internal network. The WebClient runs in the platform's JVM, so
      requests originate from the platform's egress identity — an SSRF
      surface via configuration if config is operator-mutable at runtime.
    expected: |-
      Either (a) `@URL` constraint + scheme/host allowlist on the url
      field, OR (b) the live config page states the SSRF caveat and
      operators must validate `genai.url` against their trust boundary.
    drift_class: genai_url_no_scheme_allowlist_ssrf_surface
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar
      bugs_limitations_corner_cases[6]. Evidence: GenAIProperties.java:10
      (no @URL, no @Pattern) + WebClientConfiguration.java:28 (baseUrl
      passes through). Severity: MEDIUM (operator-configured, not
      user-supplied; the operator owns the config trust boundary).
  - facet: |-
      API-only today — no UI consumer, zero test coverage
    observed: |-
      Grep over odd-platform-ui/src for `GenaiApi|genAiQuestion|/genai/`
      returns zero matches at commit 4ec2b20. Live config page documents
      "API-only today (no in-app UI affordance calls the endpoint)".
      Grep over odd-platform-api/src/test for `GenAI|genai|/api/genai`
      returns zero matches at commit 4ec2b20. The endpoint is reachable
      only by operators who read the OpenAPI spec; the discoverability
      of the security gaps is therefore lower for typical users, but
      the gaps are no less present — and a future UI consumer (an in-app
      "Ask GenAI" affordance, a sidebar chat panel) would EXPAND the
      reach to every authenticated user with a single deployment-time
      flip.
    expected: |-
      Either (a) the API surface gains the missing gates BEFORE a UI
      consumer ships (the audit + rate-limit + permission gate), OR (b)
      the absence of UI today is documented as the security-mitigation
      reason it's currently acceptable (the docs should NOT pretend the
      gaps don't exist; they exist regardless of UI presence).
    drift_class: api_only_today_no_ui_consumer_zero_test_coverage
    provenance: |-
      PRIMARY-SOURCE — GenAIController batch-ZG sidecar
      bugs_limitations_corner_cases[9] + tests_coverage_semantic.gaps.
      Evidence: grep over odd-platform-ui/src + odd-platform-api/src/test
      (zero matches) + live config page WebFetch 2026-05-25 status 200
      (explicit "API-only today"). Severity: LOW (information-only —
      surfaces the trajectory risk if a UI consumer is added later).
