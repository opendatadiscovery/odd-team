name: Term Linkage
canonical_in_docs: false
canonical_candidate: true
description: Per-(data-entity, term) edge stored in data_entity_to_term, with PK (data_entity_id,
  term_id, is_description_link). Allows manual link (is_description_link=FALSE) AND
  description-parsed link ([[ns:term]] regex match, is_description_link=TRUE) to coexist
  as separate rows. Created via POST /api/dataentities/{id}/terms or via the description-edit
  pipeline.
nodes:
- odd-platform java DataEntityController controller-method:addDataEntityTerm
- odd-platform java DataEntityController controller-method:upsertDataEntityInternalDescription
contributing_files:
- odd-platform__java__DataEntityController__controller-method__addDataEntityTerm.md
- odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription.md
evidence:
- addDataEntityTerm.md:concepts.entities[DataEntityTermFormData, LinkedTerm, DataEntityToTermPojo,
  TermAssignmentUpdated]
- upsertDataEntityInternalDescription.md:concepts.operations[parse-and-link-glossary-terms]
- addDataEntityTerm.md:implicit_adrs.[3] (manual vs description-link separation)
axes_present:
- controllers
- openapi_paths
security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  authorization_consistency:
    verdict: INCONSISTENT
    detail: 'INTENDED: DATA_ENTITY_ADD_TERM/DELETE_TERM via SecurityRule (SecurityConstants.java:237-242).
      ACTUAL: NEVER ENFORCED due to path mismatch (singular /term vs plural /terms
      in OpenAPI). Falls through to .authenticated(). ALSO bypassable via DATA_ENTITY_DESCRIPTION_UPDATE
      → [[ns:term]] mention auto-creates term_relations.'
  owner_scoping:
    verdict: BYPASSES
    detail: Cross-namespace term assignment is unconstrained; even with path fix,
      term_id has no per-term permission gate
  strengths:
  - Description-link rows protected from DELETE via API (filter is_description_link=FALSE
    in TermRelationsRepositoryImpl.java:84)
  - Duplicate-prevention graceful (onDuplicateKeyIgnore + switchIfEmpty → 400 BadUserRequest,
    not 5xx)
  - '@ActivityLog(TERM_ASSIGNMENT_UPDATED) emits BEFORE/AFTER state for audit'
  weaknesses:
  - 'HEADLINE: SecurityRule path mismatch (/term singular vs /terms plural) silently
    disables DATA_ENTITY_ADD_TERM + DATA_ENTITY_DELETE_TERM (HIGH)'
  - Term-linking side-effect via description-write path bypasses DATA_ENTITY_ADD_TERM
    dedicated permission
  - Cross-namespace term assignment unconstrained even when path is fixed
  - DISABLED-mode anonymously reachable — anyone can corrupt term linkage
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - Activity-handler captures BEFORE+AFTER terms-list by RE-querying twice (2x O(N)
    per call) — quadratic-shape cost at extreme term counts
  - No method-level observability (no @Timed, no Micrometer counter)
