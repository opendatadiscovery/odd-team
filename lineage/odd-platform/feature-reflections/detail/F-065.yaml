- id: H-011
  hypothesis: |-
    When a developer reads the leader-election entry point, the second argument to
    `acquire(advisoryLockId, <flag>)` clearly communicates whether the call is blocking — so a
    maintainer adding a fifth subsystem knows whether acquisition can wedge.
  derivation: |-
    Cross-layer naming check (Rule 4). The feature-flow narrates the boolean as if it might be a
    blocking flag (partition passes false, notifications/DC pass true); the actual semantics
    matter for the wedge analysis. Negative-space / maintainer-facing.
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      The boolean is NOT a blocking flag — it is `replicationConnection`
      (PostgreSQLLeaderElectionManagerImpl.java:18, source-read this run): it selects whether
      PGConnectionFactory opens a replication-mode connection (true for the WAL subscriber and
      the two DC workers, false for the partition job). The acquisition is ALWAYS blocking
      regardless of the flag — every caller runs `pg_advisory_lock(%d)` and can wedge. The
      partial: the parameter name is accurate at the declaration site, but a reader skimming the
      callsites (`acquire(id, false)` vs `acquire(id, true)`) could easily MISREAD the boolean
      as "non-blocking vs blocking" — which would lead them to believe the partition job's
      `false` is a safe non-blocking acquire when it is exactly as wedge-prone as the others.
      The feature-flow hop-2 evidence text itself flirts with this ambiguity by foregrounding the
      blocking behaviour next to the boolean.
    evidence:
      - sidecar: source_read_for_validation
        section: PostgreSQLLeaderElectionManagerImpl
        cite: "PostgreSQLLeaderElectionManagerImpl.java:18-23"
        note: "acquire(long advisoryLockId, boolean replicationConnection); pg_advisory_lock is unconditionally blocking — the flag only picks the connection type"
      - sidecar: odd-platform__java__ActivityTablePartitionManager__config-key-consumer__odd_activity_partition-period@L11.md
        section: tests_coverage_semantic.gaps[4]
        cite: "PostgreSQLPartitionCreationJob.java:31 (acquire(activityLockId, false))"
        note: "partition path passes false (regular connection) yet still blocks on the same pg_advisory_lock"
    operator_visible_failure: |-
      Maintainer-facing, not operator-facing: a future maintainer adding a single-leader
      subsystem could misread the `false`/`true` argument as a blocking toggle and wrongly assume
      one acquisition mode is wedge-safe, propagating the silent-wedge hazard to the new
      subsystem. The risk is documentation/naming clarity, not a runtime defect today — hence
      partial.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar
    coverage: unverified
    test_ref: null
    test_demand: functional
    coverage_note: |-
      No test or javadoc disambiguates the flag. Routes to a caveat (clarify the param /
      add javadoc that acquisition is always blocking) + a light functional-test-demand only if
      the registry refactor (PLT-089) renames or wraps acquire.

