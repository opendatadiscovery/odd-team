# Application Toolbar — product-owner reflection

## product_owner_narrative

The **Application Toolbar** is the single global navigation chrome of the ODD Platform SPA — the
fixed-position bar mounted exactly once in `App.tsx:56`, above the `<Routes>` block, on every
authenticated route (per `AppToolbar.md`:understanding + invariants). To a new customer it is the
thing they see on every screen: the ODD logo, a row of nine tabs that name the platform's surfaces,
an information icon, and their own name with a dropdown in the top-right corner. It is the
operator-visible shell through which every other pillar is reached — Discovery, Lineage, Glossary,
Quality, Modelling, Master Data, Management, Active Platform Features — and it is owned by the
Management & Administration pillar because the Management tab is the chrome's entry into
`/management/*` (Owner / Role / Policy / Tag / Lookup-Table / Identity-Provider admin, per the F-041
cross_pillar_relationship P-08:composes).

A user interacts with it through four sub-surfaces (per `AppToolbar.md`:understanding). The **brand
block** (logo + "Platform" h4) links home to `/`. The **primary tab strip** (`ToolbarTabs`, 9 tabs
hard-coded in a useMemo array at `ToolbarTabs.tsx:34-82`) is the public taxonomy of the platform —
clicking a tab navigates to that surface; two tabs (Catalog and Dictionary) mint a fresh server-side
search session on click before navigating, the other seven are plain `<Link>` navigations. The
**App Info menu** (`AppInfoMenu.tsx:71-122`) is an information-icon popover composing five surfaces:
a Documentation link, a Slack invite, the deployment's project version (from `GET /api/appInfo`),
a Leave-feedback link, and the operator-configured additional links (from `GET /api/links` — the
F-035 surface). The **user cluster** shows `owner?.name ?? identity?.username` (`AppToolbar.tsx:74`)
with a dropdown opening a language switcher (`SelectLanguage`, six locales en/es/ch/fr/ua/hy) and a
Logout item (`window.location.href = '/logout'`, `AppToolbar.tsx:35-37`).

The working parts the product owner would demo: navigate anywhere via the nine tabs; switch the UI
language across six locales; open the info popover to find the docs/version/feedback/operator links;
and log out from the user menu. The mechanics behind the chrome are sparse-but-load-bearing: tab
selectedness is a substring scan over the pathname (`ToolbarTabs.tsx:100-104`); the Activity tab
carries a pre-baked 5-day-window query computed at SPA-bundle-load time (`Activity/common.ts:33-41`);
the language preference persists only to `localStorage('i18nextLng')` with no server-side binding
(`SelectLanguage.tsx:30`); and four HTTP calls fire on mount (whoami + features/active + appInfo +
links, per the F-041 feature-flow amplification_factor).

The integration story is unusually wide: the toolbar is the named entry point into nearly every
pillar (the live Search doc literally instructs users to "select the Catalog tab", per
`ToolbarTabs.md`:docs_link_semantic), and it surfaces backend state owned by F-011 (principal
identity), F-034 (feature flags — fetched on mount but ignored by tab rendering), F-035 (operator
links), and F-009 (project version). The chrome composes these but owns none of their semantics — it
owns the rendering.

Edge cases a senior product owner would put on the demo slide as risks rather than features: the
toolbar renders **identically and unconditionally for every user and auth mode**, so under
`auth.type=DISABLED` (the bundled default per `application.yml:34`) an anonymous network caller is
shown as **"admin"** with no warning; the **Logout link 404s** under that same default mode; the
**Management tab** is visible to every authenticated user regardless of permission; three of the nine
tab labels (Data Quality / Data Modelling / Master Data) are **missing from every locale** and render
in English even for a Ukrainian user; the App Info menu opens on **hover only** (unreachable by
keyboard or touch); and the language switcher is **browser-local** (a user re-logging-in on a new
device is back to English). Per the senior-product-owner stance (APPROACH.md §0.2), these are not
footnotes — for a chrome that every user lives inside on every screen, "does the user understand it,
is it convenient, intuitive, consistent, customisable, and how does it behave across devices?" is the
load-bearing question, and the answers expose the gaps below.

