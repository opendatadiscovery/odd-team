security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - DISABLED
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - S2S
  ingestion_filter_relevance: MIXED
  authorization_consistency:
    verdict: INCONSISTENT
    detail: 'The four `auth.type` modes have asymmetric authentication AND authorization
      wiring. **OAUTH2 + LDAP wire AuthorizationCustomizer** (Policies/Permissions/Roles/Owners
      framework) — `OAuthSecurityConfiguration.java:98` and `LDAPSecurityConfiguration.java:145`
      both call `.authorizeExchange(new AuthorizationCustomizer(permissionService,
      extractors))`. **LOGIN_FORM does NOT wire AuthorizationCustomizer** — `LoginFormSecurityConfiguration.java:55-57`
      runs `.authorizeExchange(... .pathMatchers("/**").authenticated())` only; combined
      with `getAuthorities(true)` at line 81 every form-authenticated user is ADMIN.
      **DISABLED bypasses both** (`DisabledAuthSecurityConfiguration.java:13-18` is
      `.anyExchange().permitAll()`). The composite AuthorizationManagerCondition correctly
      maps the OAUTH2-or-LDAP disjunction but is dead code. (Per-mode wiring matrix
      verified across the four canonical *SecurityConfiguration sidecars: AuthorizationManagerCondition@L11.md:bugs_limitations_corner_cases.[0,1]
      + LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[0] +
      OAuthSecurityConfiguration@L71.md:implicit_adrs.[0] + LDAPSecurityConfiguration@L51.md:implicit_adrs.[AuthorizationCustomizer
      mode-agnostic])'
  owner_scoping:
    verdict: MIXED
    detail: Auth Mode itself is not data-scoped; the modes determine WHETHER any owner-scoping
      downstream applies. Under DISABLED, no owner-scoping (no authenticated principal).
      Under LOGIN_FORM, owner-scoping requires authentication only — but every user
      is ADMIN, so the Policies/Permissions/Roles/Owners framework is inert. Under
      OAUTH2/LDAP, owner-scoping operates via the Policies/Permissions/Roles/Owners
      framework gated by AuthorizationCustomizer.
  strengths:
  - Four explicit modes declared in `application.yml:33` as a YAML comment (`# DISABLED,
    LOGIN_FORM, OAUTH2, LDAP`) — operators reading the file see the enumeration
  - Default value `DISABLED` is in `application.yml:34` (not absent) — explicit choice,
    not accidental
  - Mutually-exclusive `@ConditionalOnProperty(value="auth.type", havingValue="...")`
    on the four SecurityConfiguration classes — clean Spring idiom (DisabledAuthSecurityConfiguration.java:10
    + LoginFormSecurityConfiguration.java:31 + OAuthSecurityConfiguration.java:71
    + LDAPSecurityConfiguration.java:51 — parallel structure consistently authored
    across the four files)
  - DISABLED mode is INTENTIONALLY an explicit-chain construction (not a no-bean fall-through
    to Spring autoconfig) — `DisabledAuthSecurityConfiguration.java:13-18` carries
    the permit-all chain in code so the posture is statement-of-intent rather than
    emergent. (DisabledAuthSecurityConfiguration@L10.md:implicit_adrs.[1])
  - Live `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security`
    enumerates the four values verbatim; per-mode sub-pages exist for DISABLED / LOGIN_FORM
    / OAUTH2 / LDAP / S2S
  - OAUTH2 + LDAP both apply `AuthorizationCustomizer` and run at `Ordered.HIGHEST_PRECEDENCE`
    (LDAP) — production modes carry the strongest enforcement; the asymmetry is downward
    (LOGIN_FORM ↓ DISABLED)
  weaknesses:
  - '**11-sidecar triangulated insecure-default failure mode (HIGH severity — most-corroborated
    insecure-default in the whole catalog)** — ELEVEN independent sidecars converge
    on the same operator trap (4 from batch B/C wiring side + 4 from batch E RBAC-primary-surface
    side + 3 from batch F DataEntity primary-surface side): WIRING (batch B/C): (a)
    `application.yml:34` ships `auth.type: DISABLED` as the default (DisabledAuthSecurityConfiguration@L10
    + AppInfoController@L18 + AuthorizationManagerCondition@L11 all anchor on this;
    DisabledAuthSecurityConfiguration is the CANONICAL evidence — the chain is literally
    `.csrf(...disable).anyExchange().permitAll()` with no CORS, no AuthorizationCustomizer,
    no S2S wiring); (b) `application.yml:48` ships `auth.ingestion.filter.enabled:
    false` (IngestionDataEntitiesFilter@L20 not registered → `/ingestion/entities`
    unauthenticated regardless of `auth.type`); (c) NO `matchIfMissing=true` on any
    of the four `*SecurityConfiguration` classes'' `@ConditionalOnProperty`; (d) DISABLED
    is ALSO silent — no `@Slf4j` boot WARN. **RBAC PRIMARY SURFACE (batch E corroboration)**:
    (e) RoleController.createRole — `POST /api/roles` reachable unauthenticated under
    DISABLED (createRole.md:security.known_security_gaps.[2]); (f) PolicyController.createPolicy
    — `POST /api/policies` reachable unauthenticated under DISABLED, full MANAGEMENT/ALL
    escalation chain open via Role + Policy CRUD both bypassed (createPolicy.md:security.known_security_gaps.[0]);
    (g) OwnerController.createOwner — `POST /api/owners` reachable unauthenticated
    under DISABLED, anonymous directory-population unrestrained (createOwner.md:security.known_security_gaps.[3]);
    (h) PermissionController.getResourcePermissions — under DISABLED the response
    is EMPTY (UI shows ''no permissions'') WHILE mutation endpoints are simultaneously
    `.permitAll()`-reachable — UI-vs-API contradiction (getResourcePermissions.md:security.known_security_gaps.[0]).
    **DATAENTITY PRIMARY SURFACE (batch F corroboration — widest blast radius)**:
    (i) getDataEntityDetails — `GET /api/dataentities/{id}` anonymous read of EVERY
    entity''s full 34-field details payload under DISABLED, including soft-deleted
    entities (getDataEntityDetails.md:security.known_security_gaps.[1] HIGH); (j)
    createOwnership — `POST /api/dataentities/{id}/ownership` anonymously reachable:
