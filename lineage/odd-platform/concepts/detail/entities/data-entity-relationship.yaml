notes: |-
  Distinct from `data-entity` (general catalog row) and
  `data-entity-group-membership-edge` (DEG membership). A Data Entity
  Relationship is itself a data_entity with class 9, plus a sibling
  relationships table row with type + source/target + payload.
  Per implicit_adrs[2] of RelationshipController, ERD vs GRAPH is
  a first-class URL-level distinction (two endpoints, not one).

  STRENGTHENED batch ZI (2026-05-26) — UI route layer adds the operator-
  facing surface and surfaces TWO net-new findings:
    (a) `invariant:relationships-list-target-column-copy-paste-source-data`
        — HIGH UI bug at RelationshipsListItem.tsx:73-81 (Target column
        renders Source data for every row). 3-line fix; no test catches
        it; doc-vs-code drift (doc is correct).
    (b) Cross-link to `invariant:ui-route-no-permission-guard-data-quality-
        vs-lookup-tables-contrast` (now 12-route triangulation) +
        `invariant:withpermissionsprovider-context-seed-not-route-gate`
        (the Relationships route is the only inner Data Modelling route
        BARE end-to-end — no wrapper at all, not even the non-blocking
        kind).
