control_summary: |-
  PARTIAL unit + PARTIAL integration + GAP performance + GAP security.
  Batch X-TAGGING recomposes F-018's flow from SEVEN newly-enriched
  tag-mutation-surface sidecars — the four /api/tags directory-CRUD
  controller methods (createTag / getPopularTagList / updateTag /
  deleteTag), the two sibling relation-write endpoints
  (TermController.createTermTagsRelations + DatasetFieldController
  .updateDatasetFieldTags), and the `tag` OpenAPI rollup. Prior batches
  (N repository, VAL-LSN-019 service+repository+controller-class,
  W controller-class, Z stats-path) carried the persistence + service
  evidence; X-TAGGING closes the controller-method tier at primary
  source AND adds the two NON-/api/tags relation-write endpoints that
  complete the side-channel enumeration.

  The feature is the user-observable "Manual Object Tagging" capability
  per system-mission.md P-01's sub-feature seed; the chain begins at the
  five write entry points (createTag + setDataEntityTags +
  createTermTagsRelations + updateDatasetFieldTags + the ingestion path)
  and terminates at db-write on the global `tag` directory plus its
  three relation tables, plus the FTS search-vector side effects.

  The drift facets cluster around four load-bearing themes:
  (1) write-side-channel access amplification — REFACTOR-223 is the
  headline; X-TAGGING confirms ALL THREE relation-write endpoints at
  controller-method primary source (DATA_ENTITY_TAGS_UPDATE /
  TERM_TAGS_UPDATE / DATASET_FIELD_TAGS_UPDATE) plus the ingestion path
  all mint global directory rows without TAG_CREATE; createTag IS gated
  but is one of five paths;
  (2) directory-CRUD auth + contract gaps — GET /api/tags has NO
  SecurityRule (open-read to any authenticated user); TagServiceImpl
  is zero-auth at every method; the `tag` OpenAPI tag declares no 4xx,
  no securitySchemes, and is a bare name: entry; status-code drift
  200-vs-201 on createTag + updateTag;
  (3) destructive / asymmetric mechanics — listMostPopular ranking lie
  (LSN-019, now confirmed at controller + spec tier); deleteTag's
  doubly-asymmetric cascade (tag_to_dataset_field orphaned + the FTS
  refresh runs too late so it no-ops); the !external guard reading only
  the data-entity aggregate; updateDatasetFieldTags' CRITICAL unset-origin
  INSERT reliance on a DB column default;
  (4) cross-channel audit asymmetry — now a THREE-WAY picture: the
  data-entity path audits with the dataEntityId param only, the
  dataset-field path audits with FULL before/after tag state, the term
  path audits NOT at all; the directory-CRUD operations emit no
  @ActivityLog either.

  POSITIVE invariants confirmed at primary source this batch: the
  `!external` guard protects Collector-pushed tags from UI overwrite
  (X-TAGGING re-confirms on update + delete); EXTERNAL / EXTERNAL_STATISTICS
  dataset-field tag relations survive a UI replace-all
  (updateDatasetFieldTags); auto-created tags get `important = false`
  hardcoded so the side-channel cannot mint promoted tags.

  PROMISE-LAYER COVERAGE (LSN-030, feature-reflector v0.3.0, 2026-06-04):
  use_case_coverage = 2/15 verified. The ONLY guarded promises are the
  directory-CRUD happy path through the management Tags page (F-018-UC-015,
  Playwright e2e add/change/delete-tag.spec.ts) + the directory-soft-delete
  arm of F-018-UC-009. EVERY contradicted / partial / probe-needed promise
  is unverified — including the fully-CONFIRMED Collector-ownership guardrail
  (F-018-UC-014), which has no regression test (the canonical LSN-030
  hand-proven-but-unguarded demand). 13 missing-functional test demands are
  routed via the reflection's functional_test_demands block.

  Highest-leverage probe candidates (all LOCAL docker-compose +
  Testcontainers-Postgres executable): P-030 (the CRITICAL dataset-field
  unset-origin INSERT — endpoint may be dead for any non-empty payload);
  P-010 (the LSN-019 ranking lie at the REST boundary); P-032 + P-033
  (the deleteTag asymmetric cascade + too-late FTS refresh); P-026 (the
  createTag bulk-INSERT atomicity); P-027 + P-028 (the term-tag replace-all
  + unique-index race); P-029 (getPopularTagList degenerate inputs);
  P-025 (the updateTag search-vector overwrite-vs-append). The REFACTOR-223
  side-channel regression-pin (mint via a non-TAG_CREATE permission, assert
  visibility in another user's GET /api/tags) remains the single
  highest-value security probe. Local probe stack: ODD platform + Postgres
  + two seeded Owners + a collector-mock + curl scripts for the UI-side
  endpoints.
batch_extensions:
- batch: ui-review-2026-05-26
  entry_point_added: |-
    ui-component:TopTagsList — the HOME-PAGE TAG STRIP that renders
    the curated tag taxonomy returned by GET /api/tags. The 12-slot
    chip strip at the top of Overview.tsx (between MainSearch and
    Domains). Clicking ANY tag chip launches a Search with the tag
    pre-selected as a filter (cross-pillar feed into F-017). This is
    the operator-observable READ side of F-018; previously F-018 was
    anchored on the WRITE side (POST /api/dataentities/{id}/tags).
  contributing_nodes_added:
    - odd-platform ts react-component:TopTagsList
  notes: |-
    UI-review-2026-05-26 walks TopTagsList.tsx (46 LOC).

    (A) RANKING DRIFT FROM BACKEND — TopTagsList.tsx:24-33 re-sorts the
    incoming `tags` prop CLIENT-SIDE by `usedCount` DESC, with
    `important: true` as the secondary sort. This DUPLICATES backend
    sorting (per F-018 facet
    `name_behavior_drift_list_most_popular_paginate_inside_cte_yields_oldest_by_id_not_most_popular_by_count`)
    — the backend's paginate-inside-CTE bug returns the OLDEST tags by
    ID ASC instead of by count DESC; the client-side re-sort here is
    a SILENT WORKAROUND. If the backend ranking lie is ever fixed, the
    client re-sort becomes redundant (and any sort-stability changes
    surface as user-visible chip reordering). The client sort is
    defensive against backend ranking incorrectness, but masks the
    primary defect — operators never see the backend's actual ranking
    error because the UI silently reorders.

    (B) IMPORTANT FLAG SECONDARY SORT REVERSED — line 31:
    `return b.important ? 1 : -1`. Both sides reduce to NUMBERS but the
    semantics are inverted: when `b.important === true`, returns 1
    meaning "b sorts AFTER a" — i.e. unimportant tags BEFORE important
    tags. This is the OPPOSITE of the apparent intent ("important tags
    first when counts tie"). The defect is hidden under the primary
    sort because counts rarely tie, but on a fresh deployment with few
    tags the important markers may visually appear at the BOTTOM of
    the strip.

    (C) CLICK LAUNCHES SEARCH WITH SINGLE-TAG FILTER —
    TopTagsList.tsx:13-22 `handleTagClick(id, name)` dispatches
    `createSearch({query: '', filters: {tags: [{entityId, entityName,
    selected: true}]}})`. ONE click = ONE tag filter; the user cannot
    select multiple tags from the home strip (would require returning
    to the strip after the search lands — which means re-rendering
    with the new search context, losing the multi-select intent).
    Cross-pillar feed into F-017 (Search Filter Facets). Per F-141
    facet `home_page_composition_no_skeleton_alignment...`, the
    TopTagsList is a key search-launcher in the home-page constellation.

    (D) NO IMPORTANT BADGE / VISUAL DIFFERENTIATION — TagItem (the
    `<TagItem important={tag.important} count={tag.usedCount}>` chip)
    is the rendering primitive. The `important` flag is passed but
    the UX consequence depends on TagItem's internal rendering (not
    walked here). Sidecar enrichment of `TagItem` would resolve;
    flagged ui_unverified.

    (E) USEDCOUNT NULL FALLBACK — line 28: `(b.usedCount ?? 0) -
    (a.usedCount ?? 0)`. A tag with `usedCount: null` is sorted as
    `0` — meaning it could appear ABOVE tags with explicit 0 usedCount
    only via the important-flag secondary sort, but the inverted
    secondary sort (B above) means it actually goes to the BOTTOM.
    The combined effect of (B) + (E) is sort-stability on freshly-minted
    tags (no usedCount yet) ending up at the bottom of the strip —
    invisible to operators glancing at the top 12.

    (F) STATIC LIMIT VIA OVERVIEW PARENT — Overview.tsx:20-23
    `useGetPopularTags({page: 1, size: 30})` requests 30 tags; the
    strip renders ALL of them (no slice to top-12). The TagsContainer
    styling (S.TagsContainer) is presumably wrap-based; on a tag-rich
    deployment the strip may take multiple visual rows, eating
    above-the-fold real estate. No "show more" / "see all tags" link.

    Coherence sweep STRENGTHENS:
      - F-018 facet `list_most_popular_globally_scoped_no_per_owner_filter`
        — confirmed at UI tier (no client-side owner filter on the strip)
      - F-018 facet `name_behavior_drift_list_most_popular_paginate_inside_cte_yields_oldest_by_id_not_most_popular_by_count`
        — silently masked by client-side re-sort
      - F-018 facet `get_popular_tag_list_no_security_rule_open_read_to_any_authenticated_user`
        — confirmed UI render path is unconditional (no permission gate
        at TopTagsList; rendered on every Overview mount)
- batch: ui-review-2026-05-26-slice-M
  entry_point_added: |-
    ui-shell-widget:TagItem — the 56-line shared tag-chip render
    primitive at components/shared/elements/TagItem/TagItem.tsx that
    every tag-bearing surface threads through (TopTagsList chips,
    TagsList rows, Search Tag facet chips, entity-detail Tags
    sub-tabs). RESOLVES the batch ui-review-2026-05-26 point (D)
    ui_unverified flag on the `important` flag's UX consequence —
    primary-source confirmed.
  contributing_nodes_added:
    - "odd-platform ts components/shared/elements/TagItem ui-shell-widget:TagItem"
  notes: |-
    TagItem.tsx primary-source walk (TagItem.tsx:1-60, TagItemStyles for
    the styled wrapper) — four UI-tier behaviours surfaced:

    (1) IMPORTANT FLAG STYLED-COMPONENT PROP, NOT VISIBLE BADGE — line
    33-40 — the `important` boolean is passed to the styled S.Container
    via the `$important` transient prop. The visual differentiation
    lives in the styled-component (TagItemStyles, not walked at
    primary source this pass — `ui_unverified` whether the
    differentiation is colour / border / weight). The `important` flag
    therefore has NO icon, NO badge, NO accessible label — only a
    style-only visual cue. RESOLVES batch ui-review-2026-05-26's
    point (D) on the important-flag UX consequence: TagItem renders
    important as a STYLE-ONLY signal, no ARIA announcement, no separate
    badge slot. NEW drift facet candidate.

    (2) REMOVABLE CHIP RENDERS NESTED BUTTON — line 48-55 — when
    `removable: true` AND NOT `systemTag`, the chip renders a nested
    `<Button>` with `<ClearIcon>` and an `onRemoveClick` handler. The
    NESTED-CLICKABLES pattern (parent chip has `onClick`, nested button
    has its own `onClick` — line 53 onRemoveClick) — if a caller wires
    BOTH onClick props, clicking the X button propagates to the chip's
    onClick handler unless the caller calls
    `event.stopPropagation()`. The widget itself does not stopPropagation;
    callers must handle this. Bug-class anchor.

    (3) SYSTEM-TAG CHIP NON-REMOVABLE BY DESIGN — line 41-47, 48 —
    `systemTag` causes `<SystemIcon />` to render AND the removable
    button is suppressed (the `&& !systemTag` clause). System tags are
    immutable from the UI. The doc surface does NOT name what
    constitutes a system tag vs operator-tag (per the F-018 +
    SecurityConstants gates discussion — `SYSTEM` origin? `external`?
    TagOrigin.EXTERNAL_STATISTICS?). The widget makes the distinction
    visible AND visible-only-via-icon; the UX cue is the SystemIcon
    presence, not a label.

    (4) COUNT NUMERIC SUFFIX — line 43-47 — when `count !== undefined`,
    the chip appends `count` as a subtitle1 Typography component. This
    is the surface that TopTagsList uses to show usedCount per tag.
    With count=0 the suffix still renders (the `!isUndefined(count)`
    guard accepts 0). On a tag with `usedCount: null` (the F-018
    TopTagsList facet E), the count slot is absent — visually identical
    to a tag intentionally without a count, but semantically distinct.

    NEW UI-tier drift facets:
      - `tag_item_important_style_only_no_aria_no_badge` — important
        flag lacks accessible affordance (LOW severity, accessibility
        regression candidate)
      - `tag_item_nested_click_handlers_no_stop_propagation_burden_on_caller`
        — the X-button click bubbles to chip onClick unless caller
        handles it (LOW severity, defensive-coding anchor)
      - `tag_item_system_tag_distinction_via_icon_only_no_label` —
        system-tag vs operator-tag distinction is icon-only; the
        operator UX clarity depends on the SystemIcon being recognisable
        (LOW severity, UX clarity)
      - `tag_item_count_zero_rendered_count_null_omitted_silent_semantic_difference`
        — count=0 renders the suffix; count=null omits it; the visual
