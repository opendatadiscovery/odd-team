behaviour: |-
  **DirectoryServiceImpl REFLECTS OVER ODDRN PathField TO EMIT EVERY DATASOURCE-SIDE PROPERTY — no redaction step, no allow-list, no per-property visibility gate.** `DirectoryServiceImpl.java:138-171` uses Java reflection (`getDeclaredFields` + `getMethod 'get'+CapitalisedName` + `invoke`) over the `OddrnPath` subclass annotated with `@PathField` to extract every per-datasource property: for a PostgreSQL datasource that is `host`, `database`, `port` (when set); for Snowflake that adds `account`, `warehouse`; for Kafka adds `cluster`, `topic`. The properties surface in the `/api/directory/datasources?prefix={...}` (level 2) response without any redaction step. **Combined with the cross-owner reachability** (DirectoryController has no `@PreAuthorize`, no SECURITY_RULES entry — verified in the sidecar): any authenticated user (or any caller under `auth.type=DISABLED`) gets the FULL ODDRN-derived infrastructure map of the catalog — every Postgres source's hostname + database name, every Snowflake account, every Kafka cluster + topic list. **For deployments where the data-source registration intentionally avoids exposing internal hostnames in the UI, the Directory leaks them.** The reflection-based extractor walks every `@PathField` annotation; a future OddrnPath subclass that adds a sensitive field (e.g. password-bearing connection URI, internal service token) WILL surface in the Directory response without any review gate. The existing `DirectoryTest.java:141-149` actually ASSERTS that `host` and `database` appear in the response — it pins the leak as intentional behaviour. **No test catches the reflection-walk attack surface**: there is no test that adds a synthetic `@PathField` to a test-only OddrnPath subclass and asserts whether NEW fields leak too. STRENGTHENS REFACTOR-024 family (cross-owner reads) by adding the infrastructure-revealing dimension — the leaked payload is infrastructure-revealing, not just metadata-revealing.
