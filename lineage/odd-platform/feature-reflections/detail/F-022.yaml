# Per-dataset DQ Test Reports & SLA badge — product-owner reflection

## product_owner_narrative

Per-dataset Data Quality Test Reports & SLA is Pillar P-04's first user-observable read+mutate surface: it is where a data team **looks at the quality signal for one specific dataset** and where a downstream BI dashboard **pulls a one-glance trust colour** for that dataset. It serves four overlapping audiences the live doc names explicitly: the platform end-user opening a dataset's detail page and clicking the "Test reports" tab to see which Great-Expectations / dbt / profiler checks ran and how they fared; the data-quality engineer who classifies each test as Minor / Major / Critical to tune what "failing" means for the dataset's SLA; the data-engineer/analyst who owns the dataset and reads the aggregate colour; and the viz/BI engineer who embeds the dataset's SLA colour as a PNG badge next to a dashboard tile (per `DataQualityController.md` concepts.audiences, anchored to the live `data-quality` + `sla-statuses` pages WebFetched 2026-06-01 status 200). The pillar's load-bearing constraint is that **the platform is an aggregator, not a test runner** — "Quality checks are not performed inside ODD Platform" (per WebFetch `data-quality` 2026-06-01) — and the controller embodies that constraint by exposing zero test-execution endpoints (per `DataQualityController.md` implicit_adrs[4]).

A user reaches this feature through two surfaces that the live doc disambiguates as distinct from the catalog-wide Quality Dashboard (F-032 at `/data-quality`): the in-platform **"Test reports" tab** at `/dataentities/{id}/test-reports` (per F-022 batch-ZH notes + batch-UI-L `DataEntityDetailsRoutes.tsx:56-69`), and four REST endpoints under `/api/datasets/{data_entity_id}/...` plus one mutation. The five endpoints are: `GET .../dataqatests` (the list of DQ tests for the dataset), `GET .../test_report` (a count-per-status aggregate), `GET .../sla` (the SLA colour rendered as an `image/png` badge for BI embed), `GET .../sla_report` (the same colour plus severity-weight breakdown as JSON), and `PUT .../dataqatests/{tid}/severity` (operator-set severity classification) (per `DataQualityController.md` understanding + concepts.operations). In the UI, the tab renders an expandable list of test suites (`TestReportItem`), and clicking a test opens a right-hand detail pane (`TestReportDetails` → `TestReportDetailsOverview`) carrying the severity dropdown, the last-run summary, and a JSON dump of the test's expectation parameters (per F-022 batch-UI-L notes).

The working parts a product owner would demo: the SLA colour is **computed, not stored** — `SLACalculator` runs an 8-branch deterministic algorithm that compounds severity buckets hierarchically (Major count multiplies Minor count; Critical count multiplies the resulting Major weight), so "changing one test from Major to Critical can flip the dataset Yellow→Red with no test pass/fail status changing" (per `DataQualityController.md` implicit_adrs[3] + the live doc's matching description). A dataset with **zero defined tests** is YELLOW, not GREEN — the platform errs cautious (per implicit_adrs invariant). A test with **no operator-set severity defaults to MAJOR** in the weight calculation (per `DataQualityController.md` invariant + `ReactiveDataQualityRepositoryImpl.java:142-148` cited through the controller sidecar). The badge endpoint returns one of three classpath PNGs (`sla_red.png` / `sla_yellow.png` / `sla_green.png`) cached in memory at bean-init (per implicit_adrs[2] + `CachingByteArraySLAResourceResolver.java:30-54`).

The integration story has four cross-pillar legs (per F-022 frontmatter `cross_pillar_relationships` + `system-mission.md` P-04 block): the feature **feeds P-07 Alerting** — failed DQ test runs emit `FAILED_DQ_TEST` alerts via AlertActionResolver, so this read surface and the alert surface show two faces of the same signal; it **feeds-from P-10 Integrations** — every test result it displays was pushed via `POST /ingestion/entities/datasets/stats`, never produced inside the platform; it **shares data with P-09 Security** — the lone mutation (`setDataQATestSeverity`) is owner-scoped via the `DATA_ENTITY` AuthorizationManagerType + `DATASET_TEST_RUN_SET_SEVERITY` permission, while the four reads are unscoped (read-collaborative); and it **shares the entity-detail page with P-01 Data Discovery** — the Test-reports tab sits adjacent to the dataset's description, ownership, and lineage tabs. A notable NEGATIVE leg: severity mutation produces **no Activity Feed row** (F-021), even though the dataset IS a data entity and the `activity.data_entity_id` schema would permit it — the audit-silence-on-mutations pattern (F-006) extends here.

Three edge cases a product owner would flag in a demo: (a) the **"Test reports" tab is HIDDEN for soft-deleted datasets at the UI route** — `RestrictedRoute isAllowedTo={!isStatusDeleted} redirectTo='../overview'` silently bounces the operator to Overview, even though the backend deliberately PRESERVES DQ visibility for soft-deleted datasets via `existsIncludingSoftDeleted` (a direct UI-vs-backend contradiction; per F-022 batch-UI-L note 1); (b) the **severity dropdown mutates on every selection change** with no save button, no confirmation, and no pending state — an operator who opens the dropdown to read the current value and scrolls through options accidentally fires a mutation for each intermediate option (per batch-UI-L note 3); (c) the **expectation parameters are dumped as raw unredacted JSON** in the detail pane — Great-Expectations / dbt expectations can carry failed-row samples, sensitive thresholds, or operator regexes, all rendered verbatim with no truncation or copy-control (per batch-UI-L note 5). Two of these three are UI-tier findings that exist ONLY in the feature-flow's batch-UI-L notes — the UI components have no enriched sidecar, which is itself the first validation gap below.

