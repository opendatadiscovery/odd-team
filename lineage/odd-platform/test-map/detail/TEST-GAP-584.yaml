proposed_action: |-
  Testcontainers + spied repository. (a) Boot with `auth.ingestion.filter.enabled=true`. (b) Spy `ReactiveDataSourceRepository` to count `getDtoByOddrn` invocations. (c) Submit 100 sequential `POST /ingestion/entities` with the SAME datasource ODDRN + valid token. (d) Assert `getDtoByOddrn` invoked exactly 100 times (one per request — no cache). (e) Pin the no-cache contract; future short-TTL Caffeine cache flips the assertion to expect fewer invocations (e.g. 1 + TTL-expirations).
