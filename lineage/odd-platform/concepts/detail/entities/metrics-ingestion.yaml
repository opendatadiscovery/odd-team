name: Metrics Ingestion
canonical_in_docs: false
canonical_candidate: true
description: |-
  Operator-selected metrics-storage subsystem driven by `metrics.storage`
  (`INTERNAL_POSTGRES` default vs `PROMETHEUS`). The HTTP entry point is
  `POST /ingestion/metrics` (per BaseIngestionTest.java:92 ground-truth;
  this SUPERSEDES the prior catalog claim of `/ingestion/metric_sets` —
  the path-naming was authored from the MetricSetList payload typename,
  not from the actual contract path; corrected batch 2026-05-20-Z by the
  ingestMetrics controller-method sidecar). PROMETHEUS mode writes
  Prometheus-shaped time series via the Prometheus remote-write protocol
  to `metrics.prometheus-host`/api/v1/write (Snappy-compressed) and
  queries via `/api/v1/query`. Mirrored bean structure:
  `extractors/external/Counter|Gauge|Histogram|SummaryTimeSeriesExtractor`
  (gated `havingValue="PROMETHEUS"`) vs `extractors/internal/Counter|...|MetricsSeriesExtractor`
  (gated `havingValue="INTERNAL_POSTGRES", matchIfMissing=true`). Service-
  tier dispatch via mirrored `@ConditionalOnProperty` on the two
  IngestionMetricsService implementations (boot-time selection). Per-MetricType
  extractor dispatch via `extractors.stream().filter(canExtract).findFirst()` —
  new MetricType support is add-a-class. vocabulary_status:
  codebase-anchored, doc-side-covered (live `/configuration-and-deployment/odd-platform#metric-storage-backend`
  enumerates both modes and documents `metrics.prometheus-host` + the
  Prometheus `--web.enable-remote-write-receiver` runtime requirement —
  verified WebFetch 2026-05-20). **STRENGTHENED batch 2026-05-20-Z** by
  the ingestMetrics controller-method sidecar — adds the controller-layer
  view above the extractor layer the existing contributor covers.
vocabulary_status: codebase-anchored, doc-side-covered
axes_present:
- config_prefixes
- controllers
nodes:
