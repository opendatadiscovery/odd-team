name: |-
  No React error boundary AND no path='*' catch-all route — blank-page root cause for 4 failure classes
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW HIGH-severity INVARIANT, batch ZJ (2026-05-26) — the platform
  UI has TWO ARCHITECTURAL ABSENCES that compose into a uniform
  failure-mode pattern: any URL or render-error that doesn't reach
  one of the 23 page-level components that mount `<AppErrorPage>`
  produces a BLANK PAGE below the toolbar.

  **Absence #1 — No React error boundary anywhere in the platform
  UI**. Grep across `odd-platform-ui/src/` for `ErrorBoundary|
  componentDidCatch|getDerivedStateFromError` returns ZERO matches.
  The closest is `AppSuspenseWrapper` (`AppSuspenseWrapper.tsx:1-23`)
  which is Suspense only, no error handling. `AppErrorPage` is a
  functional component with no class lifecycle methods and is
  rendered as a SIBLING inside page subtrees, not as an ANCESTOR.

  **Absence #2 — No `path='*'` catch-all `<Route>` in App.tsx**.
  `App.tsx:59-89` declares exactly 11 `<Route>` entries; none has
  `path='*'`, none uses `<NotFound>` or `<Page404>` (grep for
  `path=['"]\*['"]|NotFound|Page404|404Page|NoMatch` over
  odd-platform-ui/src returns NO matches). React Router DOM v6's
  NO-MATCH behaviour is to render nothing inside `<Routes>`.

  **Compose into 4 failure-mode classes producing blank pages**:

  (a) **Bare URLs that don't match any explicit route**: typing
      `/master-data` (no parent route declared in App.tsx) or
      `/terms` (parent route exists but with no index/element)
      produces blank-below-toolbar (per the
      `bare-base-url-behavior-divergence-redirect-vs-blank`
      invariant). No 404 surface.

  (b) **Synchronous JS render errors**: if any component in the
      route subtree throws during render, React 18's default
      behaviour is to unmount the entire tree to the closest
      boundary (NONE -> unmounts the whole App), leaving a blank
      page or console error. AppErrorPage cannot catch these
      because it is a sibling, not an ancestor.

  (c) **Lazy chunk-load failures**: `React.lazy(() => import(...))`
      at App.tsx:30-41 + AppSuspenseWrapper means chunk-load
      failures surface as uncaught promise rejections in
      development AND as INDEFINITELY-PENDING Suspense fallbacks
      in production. Same blank-page-from-no-boundary mechanism.

  (d) **Unknown URLs typed by an operator** — bookmark, copy-paste,
      hand-typed, any URL not in the 11 explicit routes produces
      blank-below-toolbar with no error, no 404, no redirect.

  **The user-visible failure is identical across all four classes**:
  the AppToolbar (line 56) still renders because it sits OUTSIDE
  `<Routes>`, but the route-body area is empty. No 404 code, no
  status text, no Home Page link.

  **AppErrorPage's scope is intentionally limited** — it is the
  per-page-component-owned controlled render helper. Its design
  is the right choice for async-thunk-rejection (where the parent
  page knows what failed). The architectural-absence is that the
  ROUTING-LAYER fall-through + SYNCHRONOUS-RENDER-ERROR class is
  not covered by ANY component.

  **A 5-line fix would close ALL FOUR failure classes simultaneously**:

      // App.tsx:89 (just before </Routes>)
      <Route
        path="*"
        element={
          <AppErrorPage
            showError
            error={{
              status: 404,
              statusText: 'Page Not Found',
              url: '',
              message: '',
            }}
          />
        }
      />

  Plus optionally an `<ErrorBoundary>` wrapper around `<Routes>` for
  class (b) and (c). The fix is named in the AppErrorPage sidecar
  bugs_limitations_corner_cases.[0].

  **The architectural-absence has been the structural root cause
  of every blank-page operator report in batches ZH + ZI + ZJ**:

    - batch ZH bare /master-data + bare /terms (per
      `bare-base-url-behavior-divergence-redirect-vs-blank` invariant)
    - batch ZJ same observations, now pinned to the structural
      cause via the AppErrorPage.tsx primary source

  **Cross-batch coherence (LSN-018)**: the
  `bare-base-url-behavior-divergence-redirect-vs-blank` invariant
  identifies the OBSERVATIONS (some routes redirect, some blank);
  this invariant identifies the CAUSE (architectural absence of
  catch-all + error boundary). The two are sibling concepts —
  observation + root-cause.
