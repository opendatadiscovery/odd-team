control_summary: |-
  0 of 4 cells PROBED — feature emerged from batch-H primary-source audit; no
  probe authored yet. The headline behaviour (soft-deleted policy continues to
  grant permissions when role_to_policy edges survive) is the highest-leverage
  candidate for the next probe round. Proposed P-NNN — local docker-compose
  stack + seed policy + bind to role + DIRECT DB UPDATE setting deleted_at +
  assert getRolesPolicies still returns the policy AND a subsequent
  /authorization-gated request succeeds.

  Batch-I closes hop-2 with PolicyServiceImpl primary-source confirmation —
  lost-update race PRIMARY-SOURCE PROVEN at lines 71-81 (no @ReactiveTransactional;
  sibling RoleServiceImpl IS annotated — the asymmetry is the canonical platform
  regression risk). Three NEW facets surfaced — (1) the race
  PRIMARY-SOURCE-PROVEN + sibling asymmetry; (2) cascade-delete check non-atomic
  with the delete itself (race-window for concurrent role-binding mutations);
  (3) schema-validation failure surfaces as 500 not 400 (IllegalArgumentException
  missing ControllerAdvice handler).

  Batch-N adds ReactiveRoleRepositoryImpl primary-source — the ROLE half of
  the RBAC mutation surface, structurally paired with batch-H ReactivePolicyRepositoryImpl
  as the POLICY half. Four NEW drift facets, three direct MIRRORS of batch-H
  Policy findings: (1) LEFT JOIN against POLICY without `policy.deleted_at IS
  NULL` filter at three sites (ReactiveRoleRepositoryImpl.java:45-48, 67-70,
  87-90) — soft-deleted policies surface in RoleDto.policy_relations via the
  `/api/roles` admin UI + transitively contribute to permission computation
  if the dto view is ever consumed by the extractor chain; (2) Administrator/User
  name asymmetry — RoleServiceImpl.create has NO name check while .update/.delete
  do (the partial unique index frees the names on soft-delete, exactly mirroring
  the Policy half); (3) case-sensitivity mismatch — RoleServiceImpl.update uses
  case-SENSITIVE `.equals(...)`, RoleServiceImpl.delete uses case-INSENSITIVE
  `.equalsIgnoreCase(...)` — an operator can create 'administrator' (lowercase),
  cannot delete it, can update it. FOURTH facet: the 4-SIDECAR audit-silence
  pattern is now CONFIRMED (RoleController batch E + PolicyController batch E +
  ReactivePolicyRepositoryImpl batch H + ReactiveRoleRepositoryImpl batch N) —
  the cross-batch concept-catalog entry
  `no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f`
  is refined to "4-sidecar" with the recommendation to elevate the audit-log gap
  to first-priority. ZERO direct unit tests for any path through this repository
  (verified via Grep against `<odd-platform-repo>/odd-platform-api/src/test/**/*Role*`).
  Two-half RBAC coverage of the mutation surface is now PRIMARY-SOURCE COMPLETE.

  Batch-K adds OwnershipServiceImpl primary-source — REFACTOR-199 PRIMARY-SOURCE
  PROVEN at line 52 (the `OWNER_CREATE` bypass via `ownerService.getOrCreate`
  on the /api/dataentities/{id}/ownership path — `DATA_ENTITY_OWNERSHIP_CREATE`
  is a SECOND undocumented path into the Owner directory). REFACTOR-206
  PRIMARY-SOURCE PROVEN at line 53 (Title directory has no allowlist + no
  TITLE_CREATE permission). Cross-batch CORRECTION: the batch-F sidecar's
  '5xx surface' claim for ownership-duplicate is REPLACED by the verified
  surface — HTTP 400 USR003 ("Ownership for this data entity and owner already
  exists") via ExceptionUtils.translateDatabaseException → UniqueConstraintException
  → ControllerAdvice.handleUniqueConstraint → HttpStatus.BAD_REQUEST. Seven NEW
  facets surface: OWNER_CREATE bypass + Title-no-allowlist + USR003 correction
  + self-grant decoupling (owner_name principal-independent) + DEG-propagation
  cascade audit absent below parent + DELETE search-vector-not-refreshed +
  DELETE no NotFound validation (silent 204). Note: this batch broadens
  F-006's scope from POLICY lifecycle to the full RBAC lifecycle including
  OWNERSHIP — the pillar-anchored feature is "Role-Based Access Control" and
  the ownership-binding endpoints are the operative authorization mutations
  governed by the same pillar. A future maintainer triage may split F-006
  into per-resource sub-features (POLICY / ROLE / OWNERSHIP / OWNER) but the
  current shape preserves the pillar anchor.

  Batch-P adds OwnerController.deleteOwner primary-source — the 5TH
  CORROBORATING SIDECAR for the audit-silence pattern, refining the
  cross-batch concept catalog entry from '4-sidecar' to '5-sidecar'
  with the recommendation to elevate the audit-log gap to first-priority.
  Six new drift facets (audit-silence + owner_association_request
  orphan + delete_search_vector_not_refreshed_owner_side +
  delete_no_not_found_validation_owner_side + soft_deleted_owner_visible_by_id_only +
  cascade_check_non_atomic_owner_delete_mirror) + one positive
  case-law contrast facet (OWNER_TO_ROLE hard-delete CLOSES the
  orphan-binding pattern on the Owner side — F-006's headline drift
  is done CORRECTLY on this surface, contrast with the POLICY/ROLE
  half where soft-delete leaves orphan grants). Cross-batch correction:
  createOwner sidecar's claim that `owner.name UNIQUE` is non-partial
  is SUPERSEDED — the index IS partial per V0_0_64; after soft-delete
  the name is freed for re-creation. Per LSN-018 the supersede note
  is recorded on the createOwner sidecar via the `superseded_by`
  protocol. The Owner side of the RBAC mutation surface is now
  PRIMARY-SOURCE at controller-method tier — together with the
  earlier batch-K OwnershipServiceImpl + batch-N two-half Policy/Role
  coverage, F-006 spans the full RBAC lifecycle (Policy + Role +
  Ownership + Owner) at the primary-source tier. A future maintainer
  triage may split F-006 into per-resource sub-features (POLICY /
  ROLE / OWNERSHIP / OWNER lifecycle); the current shape preserves
  the pillar anchor.

  Batch U adds the SECOND ROOT CAUSE for the audit-silence finding.
  The batch-R schema-FK NOT NULL constraint on `activity.data_entity_id`
  was the FIRST root cause; this batch adds the ENUM-LAYER root cause
  beneath it. `ActivityEventTypeDto.java:3-31` has NO enum values for
  TERM/NAMESPACE/OWNER/POLICY/ROLE/DATASOURCE/COLLECTOR lifecycle —
  even with a schema fix making `activity.data_entity_id` nullable,
  the @ActivityLog machinery routes via this enum and cannot emit the
  missing event types. The complete fix is 4-tier coordinated: schema
  migration + enum extension + ActivityHandler implementations +
  @ActivityLog annotations across ~25 mutating service methods. 9-SIDECAR
  AUDIT-SILENCE PATTERN now spans controller (E) + repo Policy (H) +
  repo Role (N) + UI Q + repo Activity R + service Owner P→S + service
  Policy S + service Role S + service Term U — 9 layers of plaintext
  audit-silence across RBAC + Term + Owner + Namespace + Datasource
  + Collector mutations. Recommend ADR-drafting BEFORE implementation
  to enumerate cross-team Activity Feed consumer impacts.
