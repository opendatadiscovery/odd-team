# Management Section Top-Level Chrome — product-owner reflection

## product_owner_narrative

The Management section is the operator's control room inside the running ODD Platform —
where namespaces, datasources, collectors and their tokens, owners, tags, RBAC roles, and
authorization policies are administered (per system-mission.md P-08, "Operator-facing UI for
everything an operator configures inside the running platform"). F-161 is not any one of
those nine surfaces; it is the **chrome** the operator lives inside while using them: the
"Management" entry in the global toolbar opens a two-pane screen — a fixed left sidebar of
vertical tabs and a right content pane — composed by `Management.tsx` and mounted at the
wildcard `/management/*` route (per route__management:understanding, `App.tsx:62`). A new
operator would describe the screen they see as "the list of everything I can administer, down
the left, with the selected one open on the right."

The way the user reaches and reads this chrome is the load-bearing fact of the feature. There
is one URL into the whole section; landing on it (or on bare `/management`) redirects to
`/management/namespaces` and paints the Namespaces tab pre-selected, with the full vertical
strip of tab labels alongside (per route__management:bugs_limitations_corner_cases —
`ManagementRoutes.tsx:151` Navigate fallback). What that strip shows depends on exactly ONE
permission: `ManagementTabs.tsx:14-17` derives `hideAssociations` from
`!hasAccessTo(OWNER_ASSOCIATION_MANAGE)` and that flag hides the Associations tab and only
the Associations tab — the other eight labels (Namespaces, Datasources, Integrations,
Collectors, Owners, Tags, Roles, Policies) carry no `hidden` flag and render to every
authenticated session regardless of any permission (per route__management:stress_findings.
auth_gates, DISABLED branch: "all eight non-associations sub-tabs visible and the Associations
tab HIDDEN"). The operator perceives this as "permission-aware tabs," and the live
`/features/management` doc now names it exactly that way ("Tab visibility is permission-aware
(Associations is the explicit case today; other tabs are visible to any signed-in operator)",
WebFetched 2026-06-03, status 200).

The working parts a product owner would walk through: the chrome itself does no data
fetching, no rendering gate, and no redirect — it is a layout plus a context seed (per
route__management:understanding, "owns NO rendering, NO authorization, NO data fetching"). Its
one behavioural lever beyond layout is the outer `WithPermissionsProvider
allowedPermissions={[OWNER_ASSOCIATION_MANAGE]}` it wraps everything in (`Management.tsx:9-12`),
which publishes that permission set as the default CONTEXT inherited by any descendant that
does not install its own provider — and the Integrations sub-area at `ManagementRoutes.tsx:150`
is mounted bare, with no provider of its own, so any future `hasAccessTo()` call deep inside it
resolves against the OWNER_ASSOCIATION_MANAGE context (per route__management:security.
known_security_gaps[1]). The layout is a fixed `xs=3` sidebar + `xs=9` content with
`wrap='nowrap'` (`Management.tsx:13-19`) and a vertically-oriented `AppTabs` strip
(`ManagementTabs.tsx:57-62`) — no responsive breakpoint, no hamburger, no collapse.

This chrome composes with the rest of P-08 and is the parent of two siblings that own the
behaviours BEHIND its surfaces: F-105 owns the route-level gating (every tab except
Associations renders its full catalog because `WithPermissionsProvider` is context-only, not a
gate), and F-074 owns the cross-cutting read-collaborative posture of the seven directory-list
ENDPOINTS those tabs call. F-161's distinct contribution is the chrome the operator perceives
*before* any of that fires: what the sidebar advertises, what context the shell seeds, and how
the two-pane layout behaves on the operator's actual screen. It also shares a boundary with
F-041 (the platform-wide AppToolbar that hosts the "Management" entry the user clicks to get
here) and F-033 (the Integration Wizard that mounts inside the unwrapped Integrations subtree).

The edge a product owner would flag in a demo: the asymmetry is the worst of both worlds for a
non-admin. Hiding only Associations does not protect anything (its endpoint is ungated anyway,
per F-074:H-006) — but it DOES teach the non-admin that "Associations is the one surface
gated," while leaving the labels "Policies" and "Roles" in plain sight as reconnaissance that
those admin catalogs exist (and, per F-105, are then fully readable on click). And the operator
who works on a laptop split-pane or a tablet has no usable Management UI at all: the
three-column sidebar crushes the tab labels and the content pane is too narrow for the dense
Datasources / Collectors / Policies rows — a UX gap the live doc is entirely silent on
(WebFetched 2026-06-03: responsive/mobile support is ABSENT from the page).

## hypotheses

- id: H-001
  hypothesis: |-
    When a user with zero Management-tier permissions opens /management, the
    sidebar shows ONLY the tabs they can meaningfully act on (or a curated subset),
    so the UI does not advertise the existence of admin surfaces (Policies, Roles)
    the user has no business with.
  derivation: |-
    UI-label + pillar: the pillar frames Management as the operator-facing admin
    surface; the Associations tab IS hidden by permission (hideAssociations), which
    sets the expectation that tab visibility tracks permission. A non-admin seeing
    "Policies" learns an admin surface exists.
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |-
      ManagementTabs.tsx:14-50 hides ONLY the Associations tab (the sole entry with
      hidden: hideAssociations at lines 42-43, derived from
      !hasAccessTo(OWNER_ASSOCIATION_MANAGE) at 14-17). The other eight tab entries
      (Namespaces, Datasources, Integrations, Collectors, Owners, Tags, Roles,
      Policies) carry no hidden flag and render to every authenticated user,
      including one with an empty permission set. The visibility model is therefore
      asymmetric: Associations is hidden when forbidden; every other admin surface
      is advertised by name when forbidden. This is NOT the route-bypass (that is
      F-105's H-001) — it is the front-door RECON leak: the label itself discloses
      the surface before any click.
    evidence:
      - sidecar: odd-platform__ts__routes__route__management.md
        section: stress_findings.auth_gates
        cite: "ManagementTabs.tsx:14-17 (hideAssociations) + ManagementTabs.tsx:19-50 (9-tab list, sole hidden flag on Associations)"
        note: "8 of 9 tab labels render to every authenticated session; only Associations hides."
      - sidecar: odd-platform__ts__routes__route__management.md
        section: security.data_exposure
        cite: "Management.tsx:9-12 + ManagementTabs.tsx:14-50"
        note: "tab label strings are emitted to every session; the asymmetry tells a non-admin which surface is gated and which exist."
    operator_visible_failure: |-
      (1) A non-admin user opening /management reads the labels "Policies," "Roles,"
      "Owners," "Collectors," "Datasources" — learning the platform's full
      admin-surface catalog exists, which is reconnaissance for a user who (per the
      operator's least-privilege intent) was meant to see none of it. (2) The
      asymmetry is actively misleading: because Associations DOES hide, the non-admin
      infers "the hidden tabs are the ones I lack permission for" and reads the eight
      visible labels as "surfaces I am entitled to" — but those eight are visible to
      everyone regardless of permission, and (per F-105) fully readable on click. The
      hide-only-Associations design teaches a false mental model AND discloses the
      catalog. (3) The recon compounds with F-105: the label is the entry point; the
      click reads the full Policy/Role catalog.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-002
  hypothesis: |-
    When a user lacks OWNER_ASSOCIATION_MANAGE, the Associations tab is hidden from
    the sidebar strip (so the user does not see a tab whose route would redirect
    them away).
  derivation: |-
    UI-label + consistency (Rule 9): a tab whose route redirects (F-105:H-002 /
    RestrictedRoute) should not render as a clickable affordance. The sidecar names
    a hideAssociations memo on exactly this permission.
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |-
      ManagementTabs.tsx:42-43 carries hidden: hideAssociations on the Associations
      entry, and hideAssociations = !hasAccessTo(OWNER_ASSOCIATION_MANAGE)
      (ManagementTabs.tsx:14-17). A user without the permission does not see the
      Associations tab; the same permission gates the RestrictedRoute redirect
      (F-105:H-002). So tab visibility and route gating AGREE for this one sub-area:
      the user never sees a dead Associations affordance. This is the single
      sub-area where the chrome's visibility and the route's gate are consistent —
      and it is precisely what makes the OTHER eight tabs' visibility (H-001)
      anomalous by contrast.
    evidence:
      - sidecar: odd-platform__ts__routes__route__management.md
        section: stress_findings.auth_gates
        cite: "ManagementTabs.tsx:14-17 + 42-43"
        note: "hideAssociations memo removes the tab when OWNER_ASSOCIATION_MANAGE absent; agrees with the route redirect."
    severity: LOW
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: |-
    When the platform later ships a permission-gated control inside the
    /management/integrations sub-area (e.g. a wizard step wrapped in
    hasAccessTo(<an integration permission>)), that control evaluates against the
    user's real integration permissions — not the chrome's outer
    OWNER_ASSOCIATION_MANAGE context.
  derivation: |-
    The chrome's outer WithPermissionsProvider seeds OWNER_ASSOCIATION_MANAGE as the
    fallback context; ManagementRoutes.tsx:150 mounts Integrations with NO provider
    override, so an inner check inherits the wrong context. This is the F-161a
    facet outer_provider_owner_association_manage_leaks_into_integrations_sub_area.
  seed_source: view-mode
  validation:
    verdict: contradicted
    actual_behavior: |-
      Every ManagementRoutes sub-route except /integrations/* installs its own
      per-route WithPermissionsProvider (ManagementRoutes.tsx:29-149); the
      integrations route at line 150 mounts <Integrations /> bare. Per
      WithPermissionsProvider/PermissionProvider.tsx:27-32, hasAccessTo resolves via
      allowedPermissions.includes(...) against the NEAREST provider context — which,
      for the bare Integrations subtree, is the chrome's outer Management.tsx context
      seeded with [OWNER_ASSOCIATION_MANAGE] only. A check for any
      integration-relevant permission (e.g. DATA_SOURCE_UPDATE) therefore
      deny-by-defaults regardless of the user's real grants. This is the SAME
      structural fact F-105:H-006 owns from the route-gating angle; F-161 owns it as
      the CHROME defect — the outer provider seed is the chrome's, and the fix lands
      on the chrome's child route, not on F-105's gate model.
    evidence:
      - sidecar: odd-platform__ts__routes__route__management.md
        section: security.known_security_gaps
        cite: "Management.tsx:9-12 (outer seed) + ManagementRoutes.tsx:150 (bare integrations) + PermissionProvider.tsx:27-32 (includes() resolution)"
        note: "bare integrations subtree inherits the chrome's OWNER_ASSOCIATION_MANAGE context; any inner hasAccessTo(<integration perm>) denies."
    operator_visible_failure: |-
      Latent today (no Integration control is confirmed to call hasAccessTo — the
      grep is a P-162 follow-up, per route__management:security gap[1]). The day a
      permission-gated integration affordance ships, it is DEAD for every user: an
      admin holding the correct integration permission but not OWNER_ASSOCIATION_MANAGE
      sees the control hidden (hide-not-disable, so it simply never appears, with no
      error). It would present as "the new integration toggle isn't there / does
      nothing." This is a chrome-topology foot-gun baked in now. Cross-references
      F-105:H-006 (same root, route-gating framing); the dedup is recorded below.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-004
