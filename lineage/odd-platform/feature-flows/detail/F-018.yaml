feature_name: Manual Object Tagging — operator + ingestion-driven Tag directory with side-channel mint paths
discovered_from_entry_point: rest:POST /api/dataentities/{id}/tags (UI tag-assign surface that side-channels into the global Tag directory)
description: |-
  Manual Object Tagging is the operator-facing capability listed in
  system-mission.md P-01's sub-feature seed as "Manual Object Tagging (3
  TAG_* permissions)". Users apply tags to data entities (and to dataset
  fields and terms) via the UI's tag-assign surfaces; collectors push tags
  with their ingested entities via the S2S ingestion pipeline. The Tag
  directory itself is a global, namespace-free vocabulary surfaced via
  `GET /api/tags` (the Catalog Overview's Top-Tags strip + the tag-search
  facet) and the tag-dropdown on every entity-detail page. The directory
  CRUD lives behind the `tag` OpenAPI tag — four operations (createTag /
  getPopularTagList / updateTag / deleteTag) generating the `TagApi`
  interface that `TagController` implements.

  The doc-anchored intent (live tagging.md page, WebFetched 2026-05-21
  status 200): three role-based permissions govern tag management —
  TAG_CREATE ("Create a new tag in the catalog vocabulary"), TAG_UPDATE
  ("Edit tag names or Important flag status"), TAG_DELETE ("Remove tags
  from vocabulary"). Additionally, TAG_ASSIGNMENT_UPDATED activity events
  track when tag assignments change on entities. The doc describes apply-flow
  as "opening an entity detail surface and selecting from existing
  vocabulary or creating new labels on the spot."

  The user-observable reality, per the X-TAGGING-batch controller-method
  primary-source code-walk (createTag + deleteTag + getPopularTagList +
  updateTag + createTermTagsRelations + updateDatasetFieldTags + the `tag`
  openapi rollup) on top of the batch-N repository audit: any user with an
  entity-level tag-update permission (DATA_ENTITY_TAGS_UPDATE /
  TERM_TAGS_UPDATE / DATASET_FIELD_TAGS_UPDATE) can mint NEW rows in the
  global `tag` directory by submitting novel tag names; all four
  relation-write paths reach `tagService.getOrCreateTagsByName` /
  `getOrInjectTagByName`, none of which consults `TAG_CREATE`. The
  directory CRUD operations are also entirely controller-perimeter-gated
  (zero @PreAuthorize, zero programmatic checks at the service or
  repository tier), and `GET /api/tags` carries NO SecurityRule at all —
  any authenticated user enumerates the whole directory.

  Multiple secondary drifts compound and are now confirmed at primary
  source across the controller tier: the `listMostPopular` ranking lie
  (paginate-inside-CTE yields OLDEST-by-tag.id-ASC, not most-popular —
  LSN-019, empirically reproduced 2026-05-20); the asymmetric `deleteTag`
  cascade (tag_to_dataset_field orphaned); the asymmetric FTS refresh on
  delete (only 1 of 3 vectors, AND it runs after the tag_to_term rows are
  gone so it no-ops); the `!external` guard reading only the data-entity
  aggregate; the `ids` parameter misdescribed as "Entity ids"; and a
  three-way activity-audit asymmetry (data-entity path audits with the
  dataEntityId param only, dataset-field path audits with full before/after
  tag state, term path does NOT audit at all).
