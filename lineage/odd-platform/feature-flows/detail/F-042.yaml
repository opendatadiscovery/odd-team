discovered_from_entry_point: |-
  ui_shell:AppErrorPage (the 40-line controlled-render widget mounted by 23
  page-level components on async-thunk rejection — DataEntityDetails.tsx:116,
  TermDetails.tsx:80, Search/Results/Results.tsx:168, Alerts/AlertsList.tsx:101,
