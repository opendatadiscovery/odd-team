  # KNOWN-BUG PIN (status: pins-known-bug) — characterization tripwire for PLT-086 Defect 2 /
  # LSN-002. The test asserts MinioConfig's CURRENT (incorrect) behaviour: no .region(...) and
  # no attachment.remote.region key. GREEN while the bug exists; RED the instant the behaviour
  # changes. On the intentional fix, invert the test to assert the correct behaviour and move
  # PLT-086 from `pins:` to `regresses:`. NOT @Disabled — a disabled test is blind.
  # See the test-source javadoc + retrospectives/LSN-029.
  odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/config/MinioConfigRegionTest.java::MinioConfigRegionTest:
    pins:
    - PLT-086
    covers:
    - odd-platform java config:MinioConfig (LSN-002 — region must be configurable, currently is not)
