# Data Entity Overview Tab — product-owner reflection

## product_owner_narrative

The **Overview tab** is the single most-used reading surface in ODD: it is the
default landing tab for any data entity, reached identically from Search, the
Directory, a Catalog-Overview tile, a lineage node, or an Activity-feed link
(per `Overview.tsx` mounted at `/dataentities/{id}/overview`, the default route
per `dataEntitiesRoutes.ts:66-73`, cited in the feature-flow detail). Its
product promise — reasoned from the composer source and corroborated by the
canonical `entity-detail-page.md` — is "open a data entity and see everything
the catalog knows about it on one cohesive page": its identifiers and view
count, who owns it, the tags and glossary terms attached, the description, the
attachments, the custom and predefined metadata, and (for datasets) the
data-quality test report — arranged as a two-column reading surface (per
`Overview.tsx:53-149`).

A user interacts with it by navigating to an entity; there is no input form at
this layer (the composer takes only the route's `dataEntityId` — `Overview.tsx:32`).
What the user provides is the *entity they clicked*; what they get back is the
composed surface. The page is read-first: each panel additionally exposes an
*edit affordance* (edit description, add tag, link term, upload attachment, add
owner, add metadata, add-to-group) gated by that panel's own permission set —
seven of the panels are individually wrapped in a `<WithPermissionsProvider>`
with a DIFFERENT `allowedPermissions` array (per `Overview.tsx:67-147`).

The working parts a product owner would demo: (1) a **class-conditional stats
panel** at the top of the main column that renders one block per recognised
entity class — Dataset / Transformer / Consumer / QualityTest / Input /
Relationship / EntityGroup (per `OverviewStats.tsx:23-83`); (2) a **DQ test
report** in the right sidebar that appears only for datasets that have test
results (per `Overview.tsx:105`); (3) **expectations**, **metrics**, and the
sidebar **owners / tags / terms / groups** panels; (4) a **skeleton** shown
while the top-level details fetch is in flight (per `Overview.tsx:151-155`).
The non-obvious truth — which the canonical doc now states and this reflection
confirms — is that there is *no single manifest* of "what renders for which
class"; the decision is spread across four conditional sites plus the
OverviewStats switch, and several of those conditions render **nothing,
silently** when the entity is misclassified or its DQ report is absent.

The integration story: this tab is **hop-1-downstream of `DataEntityDetails`**
(F-001), which fetches the details object the whole tab reads, plus three
independent sidebar selectors (alerts, DQ test report, SLA report) in a second
`useEffect` (per `DataEntityDetails.tsx:66-76`). That parent fetch carries the
platform-wide canonical LSN-017 bug: it fires **twice** per page-open (the
`details.status?.status` dep-array re-fire, empirically pinned by probe P-004),
so the **View count** the operator reads on this tab's General panel
(`OverviewGeneral.tsx:74-76`) is inflated by the same +2 that inflates the
Popular ranking. Every panel that mutates (description / tags / terms /
metadata / owners / attachments / groups) is itself a separate feature flow
(F-004 / F-018 / F-002 / F-013 / F-027) that this tab hosts but does not own.

Edge cases a demo should highlight: a dataset with **zero** quality tests looks
identical to one whose test report is **still loading** (both render empty
space); an entity with an **unrecognised or empty class** renders no stats
panel with no placeholder; and the two-column grid is **desktop-first** with no
responsive collapse declared, so the surface's behaviour on a phone-width
viewport is unverified (per `Overview.tsx:54,93` — `xs={9}` / `xs={3}` with no
`md`/`sm` overrides).

