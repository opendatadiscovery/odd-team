name: |-
  Audit-table bifurcation — OwnerAssociationRequest workflow HAS a dedicated audit table; RBAC mutations DO NOT (2-tier audit story refined to 3-tier with the bifurcation)
canonical_in_docs: false
canonical_candidate: true
