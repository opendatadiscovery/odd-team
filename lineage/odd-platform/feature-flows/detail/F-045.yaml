control_summary: |-
  1/4 cells PARTIAL, 3/4 GAP. The schema-revision feature is
  documented as one of the highest-leverage operator-facing surfaces
  (the primary tool for downstream-impact analysis after a breaking
  change), but the implementation has TWO HIGH-severity correctness
  defects sharing the same root cause (path component is
  documentation-only) AND a separate MEDIUM-severity
  doc-overstates-security defect on the sibling relationships
  endpoint. Fix is small (one .and() predicate per path); test
  coverage is the bigger gap.
