    SECOND COVERAGE FRONTIER (verified promises / total promises) — distinct from the
    line/method coverage and from the test_matrix cells. 0/12: F-154 ships with
    test_matrix all-GAP (unit/integration/performance/security) and related_test_gaps:[],
    and there is NO TermsForm test of any kind in odd-platform-ui (no .test.tsx), NO
    term-create/edit Playwright spec in odd-platform/tests, and NO term-create/edit IT in
    odd-team/integration-tests (IT-016/019/032/033/034 cover entity-terms-display /
    term-search / term-detail / term-linked-entities / term-query-examples — none covers
    authoring). This is the F-056-class hole: a behaviourally complex, security-relevant
    authoring feature (the entry point for a HIGH stored-XSS surface) with NO functional
    test obligation anywhere. All 12 promises are hand-proven by the reflection
    (3 confirmed / 6 contradicted / 2 partial / 1 probe-needed) yet UNVERIFIED by any
    test. The 12 missing-functional TEST-GAP demands are listed in
    feature-reflections/detail/F-154.yaml cross_references.functional_test_demands; the
    five bug-class promises (H-003/H-005/H-006/H-007/H-008) double as regression guards
