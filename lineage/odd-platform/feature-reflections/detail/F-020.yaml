- id: H-002
  hypothesis: "When an operator looks at the Collectors tab and sees no Add / Edit / Delete / Regenerate buttons, that means the deployment does not permit those mutations — i.e. what the UI shows reflects what the platform allows."
  derivation: "UI labels (the WithPermissions HOC returns null → buttons absent) + the operator's reasonable mental model that an admin UI's affordances reflect the platform's actual authorization state."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      Under the SHIPPED default auth.type=DISABLED, the UI and the API diverge in
      the most security-critical direction: the UI is QUIETER than the API. With
      DISABLED, /api/identity returns empty `permissions`, so every WithPermissions
      wrapper returns null and all four mutation buttons are absent — the operator
      sees a read-only screen. But DisabledAuthSecurityConfiguration.java:11-19 sets
      `.anyExchange().permitAll()`, bypassing SecurityConstants.SECURITY_RULES
      entirely. A direct `curl -X POST /api/collectors` (or PUT / DELETE /
      token-rotate) succeeds with no auth and returns the 40-char plaintext token in
      the body. This is the 19th sidecar surface of the platform-wide REFACTOR-185
      UI-vs-API asymmetry pattern. The repository sidecar shows the reach extends
      through the whole boot-of-self chain: the minted token is accepted verbatim by
      the always-on IngestionDataSourceFilter on POST /ingestion/datasources.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "security.known_security_gaps[0] + coupling.UI-vs-API-asymmetry"
        cite: "CollectorsList.tsx:91-101 + WithPermissions.tsx:11-32 + DisabledAuthSecurityConfiguration.java:11-19 + SecurityConstants.java:127-137"
        note: "UI hides every button under DISABLED; backend permits every anonymous mutation."
      - sidecar: odd-platform__java__CollectorController__controller-class__CollectorController.md
        section: "security.known_security_gaps[5]"
        cite: "SecurityConstants.java:127-137 + DisabledAuthSecurityConfiguration.java"
        note: "All four COLLECTOR_* gates are bypassed under DISABLED."
    operator_visible_failure: |
      (1) The headline trap: an operator running the bundled default sees a
      read-only Collectors tab, concludes "this deployment is locked down," and
      ships it on a reachable network — while anyone on that network can mint
      collectors, copy their plaintext tokens, and rotate existing tokens
      (breaking ingestion). (2) The minted token bootstraps a hostile collector
      identity via the always-on POST /ingestion/datasources (per F-008), so the
      compromise is not read-only — it is a write/identity foothold. (3) An
      operator who enabled OAuth2 for the UI but left auth.type effectively
      permissive on a sibling path gets no signal that the two surfaces are
      independent. The de-facto control is the network perimeter, invisible from
      any ODD screen or config value.
    severity: HIGH
    confidence: HIGH
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    routes_to_finding: caveat-candidate
    routes_note: |-
      Caveat tracked via DOC-252 (done) AS BEFORE. v0.3.0 ALSO routes a functional regression-pin
      demand: under DISABLED, the UI renders no buttons AND a direct mutation succeeds — pin the
      asymmetry so a future fix to EITHER side (UI banner, or backend honouring SECURITY_RULES under
      DISABLED) surfaces in the test signal rather than silently changing.

