behaviour: |-
  **GitHub username-rename orphans USER_OWNER_MAPPING — silent loss of owner-link.** GitHub allows free login renames (the old name enters 90-day escrow then becomes available to others). The handler uses `login` as the username (line 36 `USER_LOGIN = "login"` + line 56 default `adminAttribute = USER_LOGIN`). A user `alice` who logs in once (USER_OWNER_MAPPING row created with `oidc_username='alice', provider='github'`), then renames her GitHub login to `alice2`, presents `(alice2, 'github')` to AuthIdentityProviderImpl.java:29-30 on next login. The lookup at ReactiveUserOwnerMappingRepositoryImpl.java:116-127 builds `WHERE OIDC_USERNAME = 'alice2' AND PROVIDER = 'github'` — the prior `(alice, github)` row is orphaned. NO `id`-based fallback (GitHub's stable numeric `id` is in the OAuth2User attributes but not used as the username). NO migration tool. NO doc warning. Live docs WebFetched 2026-05-19 status 200 silent on rename behaviour. This is the GitHub-specific facet of the F-011 `compound_key_silent_in_docs` finding and the AuthIdentityProviderImpl `no_auto_create_on_first_login` cross-cut: after rename, the renamed user appears as a NEW first-time user with NO `My Objects` / `My Alerts` / activity.
