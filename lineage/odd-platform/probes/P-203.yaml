arrange:
  - kind: docker-compose-up
    notes: |
      odd-minimal stack + Postgres logical replication. notifications.enabled=true.
      Configure ONLY the Slack channel: notifications.receivers.slack.url -> a WireMock stub
      that returns 200 and RECORDS the request body verbatim. The probe inspects the recorded
      JSON Block Kit payload to confirm the control sequence reached the wire unescaped.
  - kind: sql
    query: |
      INSERT INTO data_entity (id, oddrn, external_name, data_source_id, type_id, status)
      VALUES (9204, '//probe-source/p-203/de-1', 'p_203_data_entity', 1, 1, 0)
      ON CONFLICT (id) DO NOTHING;
  - kind: sql
    query: |
      INSERT INTO alert (id, data_entity_oddrn, type, status, last_created_at, status_updated_at, status_updated_by)
      VALUES (9204, '//probe-source/p-203/de-1', 1, 0, NOW(), NOW(), NULL)
      ON CONFLICT (id) DO NOTHING;
  - kind: sql
    query: |
      -- The alert-chunk description carries Slack control sequences as if supplied by a
      -- malicious / careless upstream collector. created_at recent so it lands in the
      -- "latest 3 chunks" the generator renders (SlackMessageGenerator.java:95-101).
      INSERT INTO alert_chunk (alert_id, description, created_at)
      VALUES (9204,
              '<!channel> URGENT click <https://attacker.example/phish|here> to fix *now*',
              NOW());
act:
  - kind: wait
    notes: "Allow up to 30s for the WAL dispatch to POST to the Slack stub."
observe:
  - kind: http-stub-journal
    target: slack_stub
    capture_as: slack_requests
assert:
  # Exactly one POST reached the Slack stub
  - "slack_requests.length == 1"
  # The control sequence reached the wire UNESCAPED inside the Block Kit mrkdwn text.
  # (Slack would interpret <!channel> as a broadcast and <url|text> as a clickable link.)
  - "'<!channel>' in slack_requests[0].body    # broadcast control sequence passed through raw -> injection confirmed"
  - "'<https://attacker.example/phish|here>' in slack_requests[0].body    # fake-link markup passed through raw"
  # Control inversion for the FIX: after MrkdwnUtils.escape is applied, the body should contain
  # the ESCAPED forms (e.g. '&lt;!channel&gt;') and NOT the raw control sequence.
cleanup:
  - kind: sql
    query: |
      DELETE FROM alert_chunk WHERE alert_id = 9204;
      DELETE FROM alert WHERE id = 9204;
      DELETE FROM data_entity WHERE id = 9204;
  - kind: docker-compose-down
    destroy_volumes: true
