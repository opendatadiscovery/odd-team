proposed_action: |-
  Local docker-compose probe: set auth.s2s.enabled=true + auth.type=OAUTH2.
  curl -H "X-API-Key: <token>" GET /api/policies → expect 2xx with full
  catalogue. POST /api/policies with payload → expect creation succeeds.
  GET /api/identity/whoami with X-API-Key → expect username='ADMIN'
  (uppercase) + permissions = admin set.
notes: |-
  Genuinely new feature shape — distinct from F-008 (Batch Ingestion S2S
  API, which anchors the /ingestion/entities surface) AND from F-011
  (the principal-resolution chokepoint that consumes the synthetic
  principal). This feature is the OPERATOR-VISIBLE NAMING DRIFT: the
  property is called `auth.s2s.enabled` and the documentation page is
  `/authentication/s2s` — operators reasonably believe the scope is
  ingestion-shaped server-to-server; the actual scope is global
  admin-equivalent. Cross-link with F-008 (ingestion side), F-011
  (chokepoint), F-085 (whoami).
