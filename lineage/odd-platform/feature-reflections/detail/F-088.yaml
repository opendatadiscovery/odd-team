    S2S synthetic principal is the literal uppercase 'ADMIN' (provider=null);
    when an operator has named a human user 'ADMIN' (case-sensitive eq), the S2S
    caller silently inherits that human's Owner-scoped data — machine/human
    identity isolation is broken.
  dedup_status: already_tracked
  tracked_as: PLT-072
  proposed_fix_anchor: |
