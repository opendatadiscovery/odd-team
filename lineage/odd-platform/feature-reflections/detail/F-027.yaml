      possible but UNTRACEABLE. (3) An auditor or compliance reviewer asking "who attached this PII sample
      and who downloaded it" gets no answer from the platform.
    severity: MEDIUM
    confidence: HIGH
    use_case_kind: teardown
    coverage: unverified   # no test asserts an activity event is emitted on attachment mutation (none is); the regression guard for the fix is missing.
    test_ref: null
