behaviour: |-
  **HIGH — Generic webhook treats 201 / 202 / 204 as FAILURE.** The parent `AbstractNotificationSender.sendAndValidate` at lines 26-29 checks `response.statusCode() != HttpStatus.OK.value()` — i.e. **exactly 200**. Any other 2xx status is wrapped as `NotificationSenderException`.

  **Receiver-side reality**:
  - **PagerDuty Events API v2**: returns **202 Accepted** on successful event ingestion (queued for async processing).
  - **AWS API Gateway → Lambda async invocation**: returns **202 Accepted**.
  - **Kafka REST Proxy** (the `confluentinc/cp-kafka-rest` shape): returns **204 No Content** on POST success.
  - **Custom async-accept webhook receivers** (queue-backed processors common in event-driven architectures): typically return **201 Created** or **202 Accepted**.

  **Result chain**:
  1. Operator points `notifications.receivers.webhook.url` at PagerDuty.
  2. ODD fires an alert.
  3. PagerDuty's Events API accepts the event and returns 202.
  4. ODD treats 202 as a failure: `NotificationSenderException` raised.
  5. The alert is logged at ERROR ("Notification sender response didn't complete with 200 status code") — misleading: the alert IS being processed by PagerDuty.
  6. Operator looking at logs sees `log.error(...)` lines for every alert, concludes "PagerDuty integration is broken", investigates for hours.
  7. The alerts ARE actually being processed — but ODD's logs say otherwise.

  **The error message is structurally misleading**: per `AbstractNotificationSender.java:26-29`, the exception message is `"Notification sender response didn't complete with 200 status code"` — it does NOT include the actual status code. Operators cannot diagnose from the log alone whether the receiver returned 202 (success but reported as failure) vs 500 (genuine failure).

  **Promoted to HIGH** (sidecar rates MEDIUM) because:
  - The fix is one line (`response.statusCode() / 100 != 2` or `HttpStatus.valueOf(...).is2xxSuccessful()`).
  - The cost of NOT fixing is operator-onboarding friction with **the most popular generic webhook receivers** (PagerDuty, AWS, Kafka REST Proxy).
  - Compounds with TEST-GAP-799 (no signature) and TEST-GAP-800 (no Content-Type) — the webhook channel collectively feels broken to anyone evaluating it against incumbent alternatives.

  **Test gap shape**: regression-pin asserting 201 / 202 / 204 are treated as failure. PINS the current state; pairs with REFACTOR-NNN broadening to "any 2xx success".
