proposed_action: |-
  Add `AttachmentCrossEntityUrlSpoofingTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods (one per mutation surface, plus one consolidation):
  1. `deleteFile_urlDataEntityIdMismatchesFileIdsParent_succeeds_pinsCurrentBypass` — seed entity A (caller has DATA_ENTITY_ATTACHMENT_MANAGE) + entity B (caller has NO permission); upload a file to B; DELETE /api/dataentities/{A}/files/{file_from_B_id}; assert HTTP 204 (the file is deleted DESPITE the path's dataEntityId mismatching the file's parent). PIN the current bypass.
  2. `updateLink_urlDataEntityIdMismatchesLinkIdsParent_succeeds_pinsCurrentBypass` — sister test on the update-link surface.
  3. `deleteLink_urlDataEntityIdMismatchesLinkIdsParent_succeeds_pinsCurrentBypass` — sister test on the delete-link surface.
  4. `downloadFile_urlDataEntityIdMismatchesFileIdsParent_succeeds_pinsCurrentBypass` — sister test on the download surface (cross-entity READ via WRITE-permission-only path).
  5. `completeFileUpload_urlDataEntityIdMismatchesUploadIdsTargetEntity_succeeds_pinsCurrentBypass` — sister test on the complete-upload surface (compounds with TEST-GAP-022).

  Pair with a follow-up backlog item proposing the fix: at the service layer, for each mutation method, fetch the file/link's parent dataEntityId BEFORE the operation; if it does NOT match the URL's dataEntityId, raise `AccessDeniedException`. This adds one DB round-trip per mutation but closes the bypass. When the fix lands, all five tests #1-#5 invert to assert HTTP 403.

  Cross-pair with DOC-NNN: surface the cross-entity-URL-spoofing class in the attachments doc + the permissions doc — operators authoring RBAC policies need to know that DATA_ENTITY_ATTACHMENT_MANAGE on entity A is effectively a platform-wide attachment-mutate today, NOT entity-scoped. Until the code fix lands, the docs are the only surface that can warn operators.
