- id: H-011
  hypothesis: "When an entity's ownership title is changed and the entity is a Data Entity Group, the title change cascades to children — and each child's ownership change is recorded in the Activity Feed."
  derivation: "Cross-pillar (P-07 Activity Feed): the DEG-propagation feature re-titles child ownerships; an auditor expects the audit trail to reflect each affected entity."
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |
      DEG-propagation does cascade the new title to children via createOrUpdate with
      onConflict doUpdate set(TITLE_ID, EXCLUDED.TITLE_ID), so the title change DOES
      reach child rows. But @ActivityLog(OWNERSHIP_*) annotates only the three
      top-level service methods; the cascade at lines 121-149 inserts/updates N child
      rows with NO per-child activity emission. An auditor querying the Activity Feed
      for "who became/retitled an owner of this child entity" sees only the parent DEG
      event and must infer the cascade.
    evidence:
      - sidecar: odd-platform__java__service__service__OwnershipServiceImpl.md
        section: invariants[6]
        cite: "OwnershipServiceImpl.java:48,77,100 (@ActivityLog top-level only) + :121-149 (cascade, no per-child event)"
        note: "parent-only audit; children's ownership changes invisible at activity layer"
    operator_visible_failure: |
      Audit incompleteness on DEG-cascaded ownership: a security/compliance auditor
      reconstructing ownership history for a child entity of a DEG cannot see the
      cascaded title change as a discrete event — only the parent's event exists.
      This compounds the F-006 audit-silence pattern. Scope is limited to DEG members
      with propagate=true, so MEDIUM, not HIGH.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-012
  hypothesis: "When a user calls GET /api/titles?page=0 (or a negative/overflowing page), they receive a clear client error (400), not a server error or unpredictable rows."
  derivation: "Endpoint-shape: page is 1-based; a senior engineer expects boundary validation rather than a leaked 500 or silent integer-overflow offset."
  seed_source: endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |
      page has no @Min(1); offset is computed (page-1)*size with int arithmetic. At
      page=0 the offset is -size (Postgres rejects negative offset). At page=INT_MAX
      the (page-1)*size multiplication can overflow silently to a small/negative
      offset → unpredictable rows. Static analysis confirms the ABSENCE of validation
      and the overflow surface; the exact wire outcome (driver error class, 500 vs
      something else, overflow row-set) requires running the endpoint against a real
      Postgres — pinned by P-129.
    evidence:
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: stress_findings.tunables[page]
        cite: "TitleController.java:18 + ReactiveAbstractCRUDRepository.java:91 + P-129"
        note: "no @Min(1); (page-1)*size int overflow at INT_MAX; negative offset at page=0"
    operator_visible_failure: |
      Degraded UX rather than a security/correctness breach: a malformed page yields
      an opaque 500 (page=0) or unpredictable rows (overflow) instead of a 400 with a
      clear message. LOW severity; surfaced primarily because the same uncapped/raw
      Integer pattern recurs platform-wide.
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-036-1
    routes_to_finding: validation-gap
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: PENDING-F-036-1

