- id: H-002
  hypothesis: "When a user lands on /terms/{id}/overview, exactly ONE GET /api/terms/{id} request fires — the page does not redundantly re-fetch the term it already has."
  derivation: "A senior product owner expects one page-open to cost one load of the data; the shell already fetches the term for the header before the Overview sub-route mounts."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      TWO independent GET /api/terms/{id} requests fire on every Overview page-open: the
      shell's fetchTermDetails Redux thunk (TermDetails.tsx:37-45) AND the Overview sub-route's
      useGetTermByID tanstack-query hook (Overview.tsx:19-21). They use different state stores
      (Redux vs tanstack-query) with no shared cache key, so neither dedupes the other. Both route
      through ReactiveTermRepositoryImpl.getTermDetailsDto — the 11-LEFT-JOIN + 4-countDistinct +
      7-jsonArrayAgg hot path. Net = 2 invocations of the platform's most expensive query per
      page-open. This is the F-151 facet overview_tab_double_fetch_on_12_join_hot_path and the
      cross-component sibling of LSN-017 (different mechanism — two components, not a useEffect
      dep-array — same per-page-open multiplier on a backend hot path).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__TermDetails.md
        section: bugs_limitations_corner_cases
        cite: "TermDetails.tsx:37-45 + Overview.tsx:19-21 + ReactiveTermRepositoryImpl.java:194-238"
        note: "two independent fetchers, same expensive endpoint, no shared cache key"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveTermRepositoryImpl.md
        section: docs_link_semantic
        cite: "ReactiveTermRepositoryImpl.java:194-238 (REPOSITORY-DOC-GAP-C — no documented perf ceiling)"
        note: "hot path has no documented linked-entity-count ceiling; doubling amplifies fan-out"
    operator_visible_failure: |
      For a typical Term (<100 linked entities) the doubled fetch is sub-200ms total — invisible.
      For a heavily-linked Term (a 'Customer' term linked to 500+ datasets across namespaces with
      200 tags + 50 owners), the 11-JOIN fan-out runs TWICE per page-open, doubling the DB work and
      the time-to-interactive with no caching layer between. At scale this is a per-page-open
      latency tax operators experience as "the Customer term page is slow"; under load it doubles
      the DB pressure of the glossary's hottest read. No data corruption (it is a SELECT, no
      view_count-style side effect), so severity is MEDIUM, not HIGH.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

