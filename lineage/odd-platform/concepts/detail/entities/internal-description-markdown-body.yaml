name: Internal Description (Markdown body)
canonical_in_docs: false
canonical_candidate: true
description: Free-text Markdown stored verbatim in data_entity.internal_description
  (Postgres text, unbounded) — the largest per-entity free-text write surface on the
  platform. Distinct from Description (external/ingested), which is owned by the collector
  ingestion pipeline.
nodes:
- odd-platform java DataEntityController controller-method:upsertDataEntityInternalDescription
contributing_files:
- odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription.md
evidence:
- upsertDataEntityInternalDescription.md:concepts.entities[DataEntityPojo.internalDescription,
  InternalDescription, InternalDescriptionFormData]
- upsertDataEntityInternalDescription.md:invariants[no-backend-sanitisation, empty-to-null,
  UPDATE-not-UPSERT]
axes_present:
- controllers
- openapi_paths
security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  authorization_consistency:
    verdict: CONSISTENT
    detail: 'SecurityRule(DATA_ENTITY, ''/api/dataentities/{id}/description'', PUT,
      DATA_ENTITY_DESCRIPTION_UPDATE) is correctly wired (SecurityConstants.java:194-197),
      DataEntityPermissionExtractor resolves per-entity, supports ''is: dataEntity:owner''
      Policy scope.'
  owner_scoping:
    verdict: RESPECTS
    detail: Per-entity authorization via DataEntityPermissionExtractor
  strengths:
  - 'Two-permission split: DATA_ENTITY_DESCRIPTION_UPDATE distinct from DATA_ENTITY_INTERNAL_NAME_UPDATE'
  - Reactive @ReactiveTransactional boundary atomic
  weaknesses:
  - 'Stored-XSS surface (HIGH): no backend Markdown/HTML sanitisation + UI rehype-raw@6.1.1
    without rehype-sanitize'
  - No length cap on description body (Postgres text unbounded; no @Size on form DTO)
  - DISABLED-mode anonymously reachable wholesale content-injection vector
  - 'Term-linking side effect: DATA_ENTITY_DESCRIPTION_UPDATE bypasses DATA_ENTITY_ADD_TERM
    via [[ns:term]] mentions'
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - No length cap → unbounded heap allocation per call + unbounded FTS-index write
    + unbounded activity-row size
  - FTS rebuild is FULL entity tsvector (re-reads ~8 related tables) on every description
    edit
  - Activity-event payload includes FULL description body TWICE (oldState + newState)
    — N edits of 1MB = 2N MB activity-table growth
