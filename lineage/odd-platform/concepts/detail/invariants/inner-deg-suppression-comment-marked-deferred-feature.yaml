name: Inner-DEG suppression in DEG-lineage — comment-marked deferred feature
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19I (LineageServiceImpl sidecar)** —
  `LineageServiceImpl.getDataEntityGroupLineage` (lines 59-85) deliberately FILTERS
  OUT edges whose endpoint is itself a Data Entity Group AND removes DEG-typed entries
  from the metadata dictionary (lines 71-75). The maintainer''s explicit intent
  anchor is the source-level comment at line 71: `// Remove this when we will
  support inner DEGs for DEG lineage`. The current behaviour does NOT recurse into
  nested DEGs; this is an explicit DEFERRED-FEATURE marker, NOT an accidental absence.
  **Confirmed by file:line evidence**: LineageServiceImpl.java:71-75 — the conditional
  filter is `.filter(r -> !isDegODDRN(r.getChildOddrn(), dict) && !isDegODDRN(r.getParentOddrn(),
  dict))` followed by `dict.entrySet().removeIf(e -> isDEG(e.getValue().getDataEntity()))`.
  The 3-arg private overload of `getLineageStream` (lines 181-198) always passes
  `List.of()` as groups and `Map.of()` as groupsRelations (line 197) — DEG-lineage
  results NEVER surface group memberships in the response, only the underlying
  edge graph. The API contract: clients see a DEG''s lineage as a FLAT graph of
  non-DEG members, NOT a recursive graph of nested DEGs. **Operator-facing consequence**:
  a third-party caller building tooling on `getDataEntityGroupsLineage` for a DEG
  that CONTAINS nested DEGs will silently observe MISSING edges with no contract
  description of why. The live `/features/data-lineage` and `/developer-guides/api-reference/lineage`
  pages (per batch-F neighbour sidecar 2026-05-12 status 200) do NOT describe this
  carve-out. **Test-coverage gap**: there is NO `@Disabled` regression-prevention
  test pinning the current contract ("inner DEGs filtered out"). A future maintainer
  attempting the lift will have no test feedback when they accidentally break the
  existing API consumers; the lift will silently change the response shape from
  "flat graph of non-DEG members" to "recursive graph including DEG nodes". **Severity**:
  MEDIUM — coverage gap on an undocumented contract carve-out; the deferred feature
  is real but the missing-test-anchor + missing-doc-section combo makes the eventual
  refactor brittle.'
