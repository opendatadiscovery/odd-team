behaviour: |-
  **ActivityController EXPOSES THE GLOBAL CROSS-OWNER AUDIT TRAIL TO ANY AUTHENTICATED USER — no `@PreAuthorize`, no SECURITY_RULES entry, no programmatic permission check. UNDER `auth.type=DISABLED` this becomes anonymous read of every recorded change on every entity across all owners.** The class is registered with `@RestController` only (`ActivityController.java:18-19`); SecurityConstants.java:95-356 has been read end-to-end (357 lines) and contains ZERO matches for 'activity' / 'Activity' / 'ACTIVITY' / `/api/activity`. The two paths fall through to LoginFormSecurityConfiguration.java:57's `.pathMatchers('/**').authenticated()` (and AuthorizationCustomizer.java:29-30 for OAUTH2/LDAP). The default request (no `type` parameter or `type=ALL`) bypasses owner filtering entirely — `ActivityServiceImpl.fetchAllActivities` at lines 168-182 has no owner filter. Only `type=MY_OBJECTS` consults `authIdentityProvider.fetchAssociatedOwner()`. The Activity payload (`components.yaml:2861-2935`) includes structured `old_state`/`new_state` before/after for descriptions, business names, internal names, custom-metadata key/value pairs, tag/term assignments, ownership transitions, alert halt-config changes — every cross-owner read leaks free-text content that may include incident notes, customer identifiers, or internal tickets. The live `documentation/docs/active-platform-features/activity-feed.md` page (WebFetched 2026-05-20 status 200) makes NO statement about visibility, ownership scoping, or audit-trail sensitivity. No test catches this: `find <odd-platform> -path '*test*' -name 'ActivityController*'` returned no matches 2026-05-20; the only adjacent tests are activity-table-partition-manager and ingestion-side AlertIngestionTest (which covers the WRITE path via @ActivityLog AOP, not the controller READ path). STRENGTHENS REFACTOR-024 family (read-collaborative cross-owner enumeration posture) with a NEW invocation vector — the controller-tier test pin for the global audit-trail.
