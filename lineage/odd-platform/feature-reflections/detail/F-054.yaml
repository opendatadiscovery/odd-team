    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
    note: "Tracked PLT-042 (controller @Max(20) + UI click-through clamp) and PLT-100 (no-cap half). Convergent corroboration."

