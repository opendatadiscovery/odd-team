name: Service-tier transaction asymmetry between siblings
canonical_in_docs: false
canonical_candidate: true
description: '**NEW CANDIDATE, batch 2026-05-19I (cross-batch — PolicyServiceImpl
  + RoleServiceImpl + AlertServiceImpl + DataEntityServiceImpl + IngestionServiceImpl
  + LineageServiceImpl)** — the architectural-hygiene observation that sibling
  services owning structurally similar CRUD surfaces apply `@ReactiveTransactional`
  asymmetrically. `RoleServiceImpl.{create,update,delete}` all annotated; `PolicyServiceImpl.{create,update,delete}`
  NONE annotated — creates concrete lost-update + orphan-binding race windows.
  `AlertServiceImpl.handleExternalAlerts` + `applyAlertActions` annotated; `updateStatus`
  DELIBERATELY not annotated (the AOP-injected `@ReactiveTransactional` from `ActivityAspect.monoActivityAspect`
  provides the compensating mechanism). The pattern is the platform IDIOM — service-tier
  transactional boundary, repositories untransactional, atomicity at the SERVICE
  layer — but the application is uneven. Surfaced as a canonicalisation candidate
  because: (a) the IDIOM is real and stable (DataEntityServiceImpl''s 8 occurrences
  confirm it); (b) the EXCEPTIONS are intentional (AlertServiceImpl.updateStatus
  + AOP) AND oversight (PolicyServiceImpl); (c) docs do not yet name the convention;
  (d) the convention is the highest-leverage doc + tooling target — a `developer-guides/persistence-conventions`
  page naming the rule would prevent future cases like PolicyServiceImpl.update''s
  lost-update race. proposed_canonical: yes — add a `developer-guides/persistence-conventions`
  page; alternatively extend the existing `configuration-and-deployment/enable-security/authorization`
  page with a "Transaction boundaries on RBAC mutations" subsection.'
proposed_canonical: Service-tier transaction boundary convention
rationale: 'The convention is the platform IDIOM. Documenting it as a canonical
  rule + listing the current sites + flagging the known exceptions (intentional
  vs oversight) is the highest-leverage cleanup. PolicyServiceImpl''s lost-update
  + orphan-binding races are concrete instances of the gap; the doc-side fix
  + the one-annotation code fix together close a real risk.'
contributing_concepts:
- 'PolicyServiceImpl.md:concepts.invariants.[3] + bugs_limitations_corner_cases.[0,5]
  — concrete lost-update + orphan-binding race instances'
- 'AlertServiceImpl.md:concepts.invariants.[0] + implicit_adrs.[0] — intentional
  exception with named compensating mechanism'
- 'DataEntityServiceImpl.md:concepts.invariants.[0] + implicit_adrs.[0] — the
  platform IDIOM (8 occurrences)'
- 'IngestionService.md:concepts.invariants.[0] + implicit_adrs.[0] — single-transaction-per-batch
  variant'
- 'LineageServiceImpl.md:concepts.invariants.[7] + implicit_adrs.[1] — atomic-rewrite-by-establisher
  variant'
- 'RoleServiceImpl.java:50, 64, 77 (cross-batch reference — the symmetric
  sibling that PolicyServiceImpl should mirror)'
suggested_add_to_docs: true
notes: |
  This canonicalisation candidate is the most leverage-bearing of the batch-I
  cross-batch findings — the IDIOM is universal, the gaps are concrete, and
  the doc + code cleanups are both one-touch.

  Recommended cleanup paths:

    (a) Doc: add `developer-guides/persistence-conventions` page (or extend
        existing internal architecture doc) naming the convention + listing
        every Reactive*Repository class + every @ReactiveTransactional service
        method in the codebase.

    (b) Code: add @ReactiveTransactional to PolicyServiceImpl.update / delete
        (one-line fix, mirrors RoleServiceImpl).

    (c) Tooling: surface a project-internal `@RequiresTransaction` annotation
        on repository methods that MUST be called inside a transaction; check
        at compile time.

  See companion invariants:
    - `repository-transactional-boundary-at-service-layer-not-repository`
      (batch H — the repository-side convention).
    - `service-tier-transactional-asymmetry-between-sibling-services`
      (batch I — the cross-batch observation).
    - `reopen-conflict-server-enforced-application-logic-not-db-constraint`
      (batch I — the AlertServiceImpl.updateStatus intentional exception).
