proposed_action: |-
  Add `AlertManagerWebhookIdempotencyTest.handleExternalAlerts_postSamePayloadTwice_createsTwoRowsNotOne_pinsNoIdempotencyContract` as a WebTestClient integration test. (a) Construct a valid AlertManager payload with `labels.entity_oddrn=<known existing entity oddrn>` + `alertname=DistributionAnomalyOnFreshness`. (b) POST `/ingestion/alert/alertmanager` with the payload. Assert HTTP 204. Query `SELECT COUNT(*) FROM alert WHERE data_entity_oddrn = ? AND status = 'OPEN'`. Expect 1. (c) Sleep 100ms. POST THE SAME PAYLOAD AGAIN. Assert HTTP 204. Query the same count. Expect 2 (the current buggy behaviour). (d) Add a `// REGRESSION-PIN — handleExternalAlerts has NO idempotency guard. Two POSTs of the same payload create TWO rows. The de-dup asymmetry (in-platform path de-dupes; webhook path does not) is the F-007 no_idempotency_no_audit facet. A REFACTOR adding ON CONFLICT OR a hash-based de-dup will FLIP this test from 2 to 1 — making the fix deliberate.` comment block. Pair with the in-platform-path test that asserts 1 (de-dupe via AlertActionResolver works).
