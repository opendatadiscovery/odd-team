realism_caveats: |
  The probe pins the DRIFT and the dialog-recovery hypothesis. If the active-
  source assertions PASS, the DataSource UI ships an operator-hostile delete
  failure path (stuck modal + jargon toast) — a HIGH product defect for F-031.
  If `active_delete_dialog_still_open` or `active_delete_confirm_button_loading`
  comes back false, the recovery hypothesis is wrong and the ConfirmationDialog
  / DialogWrapper interaction must be re-read (DialogWrapper was not read this
  pass — it may reset isLoading on its own).
  The probe runs under auth.type=DISABLED so the permission gate is open; it
  does NOT exercise the cross-auth-mode permission matrix (that is P-080). It
  also does not cover the collector-re-ingest race (an actively-collected
  source whose children are soft-deleted then re-created mid-delete) — that is
  a dynamic-timing scenario beyond this static-precondition probe.
