name: |-
  Data Quality Dashboard 'Test Results' counts TESTS by latest-run status, NOT RUNS (live doc says 'count of test runs')
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch ZG (2026-05-25,
  DataQualityRunsController class-level primary source). The Data
  Quality Dashboard's `testResults` (the breakdown ring + per-category
  result tiles) counts TESTS keyed on their latest-run status — NOT
  RUNS. This contradicts the live doc verbatim and the user-facing
  UI label.

  THE DOC SIDE (verbatim from
  https://docs.opendatadiscovery.org/features/data-quality/dashboard
  WebFetched 2026-05-25 status 200):
    "Test Results Breakdown — the count of test runs broken down by
     status (passed / failed / skipped)."

  THE UI SIDE:
    DataQualityContent.tsx:110 renders the chart title verbatim as
    'Test Results Breakdown'.
    OpenAPI summary at openapi.yaml:1975-1976: 'Get Data Quality tests
    runs'.
    Wire response field name: `test_results` (components.yaml:3748-3759).

  THE CODE SIDE:
    ReactiveDataQualityRunsRepositoryImpl.java:76, 95 — the SQL JOINs
    `data_entity_task_last_run` (NOT `data_entity_task_run`).
    V0_0_45__last_runs_table.sql:9 — task_oddrn is PRIMARY KEY,
    guaranteeing one row per test.
    GROUP BY (category, status), COUNT(*) — the count IS therefore
    the number of TESTS whose latest run has status X, not the number
    of TEST RUNS with status X.

  CONCRETE CONSEQUENCE:
    A test that ran 100 times (90 SUCCESS, 10 FAILED, latest=FAILED)
    contributes ONE row to FAILED bucket — not 90+10. A test that
    succeeded for years and just started failing shows as ONE FAILED,
    eclipsing the success history. A test that flapped 50/50 over
    its history but most recently succeeded contributes ONE SUCCESS.

    The dashboard cannot distinguish 'one transient failure on a
    stable test' from 'a test that fails every run'. The operator
    triaging will see a count and assume it reflects run volume;
    the count actually reflects test count whose most recent
    execution had that status.

  THIS IS THE LSN-019 CLASS — mechanical-transcription drift from
  name to behaviour. The OpenAPI operation name 'getDataQualityTestsRuns',
  the URL segment '/runs', the UI label 'Test Results Breakdown', and
  the wire field name `test_results` ALL imply per-run granularity;
  the implementation delivers per-test granularity. The denormalisation
  table `data_entity_task_last_run` (captured in
  `entitie:data-entity-task-last-run`) IS the intentional design choice
  that drives the semantic — but the surface labels have not been
  updated to reflect the choice.

  SEVERITY: HIGH — both the operator-visible label and the live doc
  describe a per-run count; the platform delivers a per-test count
  keyed on the latest run.

  RECOMMENDED REMEDIATION (cite-anchored, not adopted):
    EITHER (a) rename the chart title + the wire field + the doc to
    'Test Status' or 'Tests by Latest-Run Status' — i.e. match the
    label to the implementation;
    OR (b) restore per-run semantics — recompute from
    `data_entity_task_run` at query time with a window function (the
    perf cost the denormalisation was avoiding); update the live doc
    with the correctness statement.

    Option (a) is the cheap fix that matches operator expectation
    today; option (b) is the expensive fix that matches the doc's
    verbatim definition. The maintainer decides routing.
