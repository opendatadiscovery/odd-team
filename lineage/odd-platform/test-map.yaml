# Maintainer notes (preserved across refreshes)

maintainer_notes: |
  First test-coverage-mapper pass over odd-platform substrate (15 sidecars,
  65 Java tests, 7 in-scope TS tests). Substrate's last_scan_commit = ede5d277.

  Top-line findings:

  1. ZERO controller-level tests for 5 of 6 controllers, and only 2/40
     endpoints covered for the 6th (DataEntityController). The single most
     impactful gap: the SECURITY_RULES path-pattern wiring has no test —
     the `/term` vs `/terms` mismatch (verified production failure) shipped
     because there is no compile-time or test-time guard against path drift.

  2. 12 CRITICAL gaps map to HIGH-severity security weaknesses in concepts.yaml
     aggregates. They cluster in three concepts: Attachment (4 — read-path
     auth asymmetry, server-side cap bypass, uploadId hijack, filename
     injection), GenAI (3 — prompt-injection/SSRF, DISABLED-reachable,
     LSN-002 class), AlertManager Webhook Receiver (3 — silent_orphan,
     anonymous-by-design assertion, alert spoofing).

  3. 14 HIGH gaps map to HIGH-severity performance or MEDIUM-severity security
     weaknesses. The recurring pattern: "covered by code-reading, not by an
     integration test" — the platform's behaviour is correct on paper but
     not test-pinned. A field rename or YAML key rename anywhere would slip
     past CI and only surface at runtime.

  4. The 6 cross-cutting patterns are themselves the strongest signal that
     this is a tests-pillar problem, not a per-controller one. The remedies
     compound: a single `@WebFluxTest`-with-security harness + a SECURITY_RULES
     meta-test + a `GenAIThreatModelTest` + the three Attachment Testcontainers
     integration tests + the OpenAPI CI lint set up the foundation that 50+
     of the 69 individual gaps then depend on.

  5. All 15 sidecars' `test_files` claims verify; no hallucinations. The
     substrate's tests_coverage_semantic accuracy is HIGH.

  When the tests pillar activates, recommend:
  - Triage the 12 CRITICAL gaps first (security HIGH-severity per concept).
  - Pick one cross-cutting pattern as the foundation (proposal: pattern #2,
    SECURITY_RULES meta-test + WebFluxTest matrix) — its scaffolding unlocks
    the per-gap tests at lower per-test cost.
  - Slot the LSN-001 / LSN-002 Testcontainers tests (TEST-GAP-024, 051, 052)
    as a single Attachment-integration test class — three retrospectives'
    worth of regression-prevention in one harness.
