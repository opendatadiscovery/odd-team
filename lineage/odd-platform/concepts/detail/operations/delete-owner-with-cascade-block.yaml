notes: |-
  This is the 5TH corroborating sidecar in the
  `no-audit-log-on-rbac-mutations` pattern at the OWNER mutation surface
  (after createRole/createPolicy/createOwner/ReactivePolicyRepositoryImpl
  + the batch-N additions). The deletion is invisible to the activity
  feed; combined with the role-binding hard-delete (irreversible) and
  the soft-delete-on-owner-row (name freed for re-creation), the audit
  story is silent — an operator can delete an owner and re-create
  another owner with the same name, with NO trace anywhere except
  (a) the DB row's `deleted_at` timestamp and (b) the absence of
  OWNER_TO_ROLE rows.

  The live `/permissions` page (WebFetched 2026-05-20 status 200)
  defines `OWNER_DELETE: 'Allows deleting an owner.'` but says nothing
  about the cascade-delete contract, the soft-delete semantics, the
  role-binding hard-delete (irreversible), the search-vector staleness,
  the orphan owner_association_request rows, or the idempotency
  semantics — six distinct contracts undocumented on a permission
  page that names the operation.
