- id: H-005
  hypothesis: "When an operator (or a script) sends PUT /api/dataentities/{id}/description for a data-entity id that does not exist, the platform returns 404 Not Found."
  derivation: "REST convention + sibling-endpoint parity: updateStatus and createMetadata both switchIfEmpty(NotFoundException) on a missing entity. A product owner expects a wrong id to be a 404, not a silent success."
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The platform returns 200 OK with an EMPTY body. setInternalDescription is a bare
      DSL.update(...).where(ID.eq(dataEntityId)).returning() — on a missing id it touches 0 rows, returns
      Mono.empty, the whole reactive chain (FTS rebuild, filled-flag, term-handling, activity emission) short-
      circuits via empty-mono propagation, and the controller emits 200 with no body — NOT 404. There is no
      switchIfEmpty(Mono.error(new NotFoundException)) on this path, unlike the sibling updateStatus (line 467)
      and createMetadata (line 257-258) which DO guard. The "upsert" operationId is also misleading — the
      endpoint is a pure UPDATE, never an INSERT.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription
        section: invariants[2] + bugs_limitations_corner_cases[1]
        cite: "ReactiveDataEntityRepositoryImpl.java:432-435 + DataEntityServiceImpl.java:324-333 (no NotFound path)"
        note: "UPDATE-only, silent no-op; contrast updateStatus line 467"
      - sidecar: odd-platform__java__service__service__DataEntityServiceImpl
        section: invariants[5] + downstream_side_effects[F-004]
        cite: "DataEntityServiceImpl.java:257-258 (createMetadata DOES guard) vs upsertDescription (does NOT)"
        note: "catalog-wide asymmetry — description path is the one that silently no-ops"
    operator_visible_failure: |
      (a) A script scraping ids from search results and PUTting descriptions cannot distinguish "wrote
      successfully" from "id was wrong / soft-deleted" — both return 200. (b) The activity feed shows nothing
      for the no-op (the @ActivityLog AOP advice doesn't fire on an empty Mono), so the auditor is ALSO blind.
      (c) The 200-vs-403 distinction leaks the permission-decision shape even for non-existent ids (a probe-by-id
      side-channel). NOTE: this is a CAVEAT-or-bug judgment call — the silent-200 may be a deliberate
      idempotent contract; changing it to 404 would break any existing client depending on the 200. DOC-GAP-097
      already tracks this as a documentation gap; the maintainer's triage decides bug-fix vs documented-contract.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_ref: null
    test_demand: functional
    use_case_note: "No test asserts the 200-on-missing-id contract for the DATA-ENTITY description path. (DatasetFieldInternalInformationServiceImplTest.updateDescription_nonExistentField_errorsNotFound pins the SIBLING dataset-field path, which correctly returns 404 — the two surfaces DIVERGE, and only the dataset-field divergence is tested.)"

