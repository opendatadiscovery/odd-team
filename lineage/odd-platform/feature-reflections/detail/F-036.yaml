- id: H-004
  hypothesis: "When a user types a brand-new title string into the ownership form and submits, they are simply labelling this one ownership — they are not creating a permanent platform-wide vocabulary entry, and certainly not one they lack permission to create."
  derivation: "UI-label seed: the control is labelled as a title field on an ownership form (a per-grant attribute), not as a 'create directory entry' action. A senior PO asks whether the user understands the consequence of typing a new value."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      Typing a never-seen string mints a permanent `title` row via
      `OwnershipServiceImpl.create → titleService.getOrCreate(titleName)` at line 53.
      There is NO `TITLE_CREATE` permission in the codebase at all (grep zero
      matches); the only gate is the per-data-entity DATA_ENTITY_OWNERSHIP_CREATE
      that authorises the GRANT, not directory growth. There is no allowlist, no
      pattern, no length cap beyond the varchar(128) column, no normalisation, and
      NO @ActivityLog on the directory mutation itself (only the parent OWNERSHIP_*
      event fires). The user believes they labelled one ownership; they amended the
      platform-wide authorization vocabulary that Policy conditions reference.
    evidence:
      - sidecar: odd-platform__java__service__service__OwnershipServiceImpl.md
        section: invariants[2]
        cite: "OwnershipServiceImpl.java:53 + TitleServiceImpl.java:19-22"
        note: "auto-create on miss, no permission consulted"
      - sidecar: odd-platform__java__service__service__OwnershipServiceImpl.md
        section: invariants[3]
        cite: "SecurityConstants.java:143 (OWNER_CREATE bound only to /api/owners POST)"
        note: "no TITLE_CREATE equivalent exists; REFACTOR-206 verified grep zero matches"
    operator_visible_failure: |
      (1) Vocabulary sprawl: every distinct string typed becomes a permanent row; the
      directory never tombstones in production (no UI/API delete caller). (2) Silent
      authorization surface mutation: the typed string is now selectable in Policy
      conditions, so a low-privilege ownership-granter shapes the vocabulary a
      security admin will later reference — without holding any directory-management
      permission and without an audit trail of the mint. (3) No undo: an operator who
      mistypes "Data Stewrd" cannot remove it through any UI; it lingers in every
      future autocomplete. (4) Cross-feature leak (F-074): because GET /api/titles is
      ungated, an attacker can enumerate the full vocabulary an admin's Policies rely
      on.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
    sme_consultation_recommended: true
    sme_consultation_question: "In peer data catalogs (DataHub ownership types, Amundsen, OpenMetadata), is the owner-relationship 'title/type' vocabulary an admin-curated controlled list or a free-text per-grant attribute, and is it gated by a distinct permission from the grant itself?"
    sme_consultation_archetype: comparative

- id: H-005
  hypothesis: "When a user writes a Policy `dataEntity:owner:title == 'Data Steward'`, every owner whom operators intended as a data steward receives the granted permission."
  derivation: "Pillar P-09 primary action ('author Policies that gate by an owner's title') + the cross-pillar promise that the title vocabulary is coherent enough to match against."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      Policy title matching is case-sensitive exact string equality. Because
      getOrCreate stores the typed string verbatim with no normalisation, the
      directory accumulates 'Data Steward', 'data steward', 'DATA STEWARD',
      ' Data Steward ', 'data-steward' as DISTINCT rows with distinct ids. A Policy
      on 'Data Steward' matches ONLY the exactly-cased variant; every owner bound to
      a different-cased row silently lacks the permission. The operator intended
      "all data stewards"; the outcome is "only the exactly-cased ones".
    evidence:
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: bugs_limitations_corner_cases[4]
        cite: "V0_0_3__add_ownership.sql:4 + TitleServiceImpl.java:19-22"
        note: "varchar(128), no CHECK; getOrCreate stores verbatim, no case-fold/trim"
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: dependencies_semantic.requires-feature[Policies]
        cite: "REFACTOR-624 + live Policies page (2026-06-04, status 200)"
        note: "owner:title is a case-sensitive Policy condition field"
    operator_visible_failure: |
      Silent permission DENIAL (not escalation): an owner the operator believed
      covered by the Policy is denied access with no error, no log, and no
      operator-visible signal of the miss. The blast radius scales with how many
      cased/whitespace variants have accumulated. The admin assumes everyone has
      access; the affected user just silently cannot do the thing. This is the
      REFACTOR-624 silent-policy-leak class observed in real deployments.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

