- id: H-005
  hypothesis: |-
    When an operator types an oidcUsername that does NOT correspond to any real identity
    in the IdP (a typo, or a user who has never logged in), the form rejects it (or at
    least warns) rather than silently creating a binding that can never resolve.
  derivation: |-
    The oidcUsername field is free text with only required:true — no format / existence
    validator (feature-flow facet form_lacks_validation_on_oidc_username_...). The
    consumer F-011 silently never matches a dangling mapping. A product owner demoing
    onboarding would expect at least a "no such user" guard.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      No existence check exists anywhere on this path. The form's oidcUsername Controller
      has only defaultValue:'' + rules:{required:true} (OwnerAssociationForm.tsx:62-76, per
      feature-flow facet + scanner finding F-172b). The service createManualAssociationRequest
      maps (oidcUsername, provider, ownerId) straight into an OwnerAssociationRequestPojo
      and on to userOwnerMappingService.createRelation with NO AuthIdentityProvider.lookupUser
      or LDAP/OIDC existence lookup (controller sidecar bugs[2],
      OwnerAssociationRequestServiceImpl.java:109-114). The mapping is created speculatively.
      The repository createRelation accepts any arbitrary string (its implicit_adrs[3]:
      "accepts arbitrary strings including SQL-injectable input — sanitisation lives upstream
      at jOOQ parameter-binding"). So a typo'd or non-existent username produces a permanent
      active user_owner_mapping row that F-011's getAssociatedOwner
      (ReactiveUserOwnerMappingRepositoryImpl.getAssociatedOwner, case-sensitive .eq() on
      oidc_username) will only ever match if a real user logs in under EXACTLY that
      case-sensitive username + provider.
    evidence:
      - sidecar: odd-platform__java__OwnerAssociationRequestController__controller-class__OwnerAssociationRequestController
        section: "bugs_limitations_corner_cases[2]"
        cite: "OwnerAssociationRequestServiceImpl.java:109-114"
        note: "no existence check on oidcUsername; mapping created speculatively"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveUserOwnerMappingRepositoryImpl
        section: "invariants (case-sensitive .eq) + implicit_adrs[3]"
        cite: "ReactiveUserOwnerMappingRepositoryImpl.java:116-127"
        note: "getAssociatedOwner is case-sensitive .eq on oidc_username — a typo never matches"
      - sidecar: unresolved-ui-hop
        section: "feature-flow F-172 facet form_lacks_validation_on_oidc_username + scanner F-172b"
        cite: "OwnerAssociationForm.tsx:62-76"
        note: "oidcUsername field: required:true only, no format/existence validator"
    operator_visible_failure: |-
      (1) Silent orphan binding: an operator who fat-fingers the username (e.g. "alce"
      instead of "alice", or wrong case "Alice" vs "alice") creates a permanent active
      user_owner_mapping row that never resolves. The intended user logs in, gets NO owner
      association, and their My Objects / My Alerts / owner-scoped RBAC roles all collapse
      to empty (per F-064 silent-empty + the repository sidecar's "empty Flux silently
      returned when user-owner_mapping is missing — no 401/403/404 signal"). (2) No
      diagnostic affordance: the operator's History tab shows the bind as a successful
      "Approved" row (per H-003), so the audit trail says the bind worked — there is no
      surface anywhere that flags "this username does not match any known identity". (3)
      Provider mismatch compounds it: an operator who picks the wrong provider from the
      dropdown (e.g. binds alice@LOGIN_FORM when alice actually authenticates via
      OAUTH2:github) creates a row that never matches the real login, AND under the
      provider-null collapse a LOGIN_FORM/LDAP/S2S user named "alice" would silently inherit
      it. (4) The orphan accumulates: the soft-delete-only persistence means a corrected
      re-bind leaves the bad row soft-deleted, growing the table monotonically.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

