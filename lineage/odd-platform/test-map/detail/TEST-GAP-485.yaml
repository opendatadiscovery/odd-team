proposed_action: |-
  Six Mockito unit tests in OwnershipDEGPropagationTest.java. (A) `create_propagateTrue_DEGWith3Children` — assert createOrUpdate invoked with 3 OwnershipPojos. (B) `create_propagateFalse_DEGWith3Children` — assert createOrUpdate NOT invoked. (C) `create_propagateTrue_nonDEG` — assert silent no-op (propagateIfDEG short-circuits to Mono.just(List.of())). (D) `create_propagateTrue_DEGNoChildren` — assert no-op cascade. (E) `update_propagateTrue` — assert CREATE-action used (title-overwriting). (F) `delete_propagateTrue` — assert deleteByDataEntityAndOwner invoked. Locks all six paths.
