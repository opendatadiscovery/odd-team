name: |-
  Data Modelling ERD is a SUB-tab inside Relationships, NOT a peer of Query Examples + Relationships (operator navigation hierarchy clarity)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-02
description: |-
  NEW LOW-severity NAVIGATION-CLARITY INVARIANT, batch ZL
  (2026-05-26) — the Data Modelling pillar at /data-modelling/*
  presents a TWO-tab vertical-sidebar navigation:
    1. Query Examples (link: /data-modelling/query-examples)
    2. Relationships (link: /data-modelling/relationships)

  Per `components/DataModelling/DataModellingTabs.tsx:11-23`. ERD
  is NOT a peer tab here.

  ERD lives as a SUB-tab WITHIN Relationships at
  `components/DataModelling/Relationships/RelationshipsTabs.tsx:14-15`:
    - ALL: type query param undefined or 'ALL'
    - ERD: type query param 'ERD'
    - Graph: type query param 'GRAPH'

  All three sub-tabs are `type` query-parameter values used by
  `Relationships.tsx:18-19` to filter the relationship list (per
  the existing batch ZE RelationshipController sidecar +
  relationships route sidecar). The URL becomes
  `/data-modelling/relationships?type=ERD` when the user clicks
  the ERD sub-tab.

  **The live doc page reinforces the two-feature framing** — per
  WebFetch of `https://docs.opendatadiscovery.org/features/data-modelling`
  2026-05-26 status 200:

      "The Data Modelling section serves as a 'curated space for
      documenting how datasets are intended to be used.' It focuses
      on two key areas: canonical query examples and entity-to-
      entity relationships."

      "Sub-sections and Tabs:
      1. Query Examples — operator-created SQL/KQL/Spark code
         snippets attached to entities and terms;
      2. Relationships — entity-to-entity links shown as ERD
         diagrams, covering two relationship types:
         ENTITY_RELATIONSHIP and GRAPH_RELATIONSHIP."

  So the doc's framing is also two-feature; ERD is described as
  one of two visualisation modes of Relationships, not a peer.

  **The operator-visible consequence**: a first-time operator
  visiting /data-modelling expects ONE of these UX shapes:
    (a) A pillar overview screen describing what Data Modelling
        offers and pointing to its sub-features (canonical
        landing-page pattern);
    (b) A three-tab pillar with Query Examples / Relationships /
        ERD as peers (matching the data-modelling vocabulary
        commonly used in BI tools);
    (c) A two-tab pillar with ERD as a SUB-tab of Relationships
        (the actual implementation).

  The implementation is (c). The doc page describes (c). But an
  operator reading 'entity-to-entity links shown as ERD diagrams'
  may infer 'ERD is a peer of Relationships' — leading them to
  search for an ERD tab and not find one. The navigation
  hierarchy IS consistent doc-to-code, but the hierarchy is
  NESTED in a way operators may not anticipate.

  **The structural cause is the two-axis taxonomy** — Data
  Modelling has TWO sub-features (Query Examples + Relationships)
  at one axis, and Relationships has THREE display modes (ALL /
  ERD / Graph) at a perpendicular axis. The UI surfaces axis 1
  in the Sidebar tabs and axis 2 in the page-level tabs. This
  is a sound design for the actual data shape, but it requires
  operators to internalise two navigation levels.

  **Operator-visible consequences** (two patterns):

  (a) **Operator searching for 'ERD' in the codebase** finds the
      RelationshipsTabs.tsx primary source but NOT a top-level
      ERD route or tab. They may incorrectly conclude ERD is
      'broken' or 'missing'. The actual surface is reachable
      via /data-modelling/relationships?type=ERD.

  (b) **Operator reading the doc** sees ERD described, navigates
      to /data-modelling, sees Query Examples + Relationships
      tabs, expects to find ERD ALONGSIDE them. They may click
      Relationships and see the ALL view by default — only after
      noticing the page-level tabs do they discover the ERD
      sub-view. This is an extra navigation step the doc does
      not explicitly call out.

  **Not a bug per se** — the navigation IS consistent doc-to-code.
  But the navigation hierarchy is non-trivial and worth a doc
  clarification.

  **Fix surfaces** (maintainer-triage):

  1. **Add a 'Where to find it' doc note** — extend the
     data-modelling doc page with a 'How to navigate' section:
     "Navigate to /data-modelling → Click Relationships in the
     left sidebar → Choose ERD or Graph in the top-of-page
     tabs". LOW-cost; high operator value.

  2. **Add an in-app onboarding tooltip** — first-time visitors
     to /data-modelling/relationships see a brief callout
     pointing to the page-level tabs ('Toggle between All,
     ERD, and Graph views above'). UI work; one-time.

  3. **Promote ERD to a peer tab** — fundamental UX redesign;
     the doc framing would also need updating. NOT recommended
     unless operator-research shows the nested hierarchy is
     actively confusing.

  vocabulary_status: codebase-anchored AND live-doc-confirmed.
  The doc page's framing matches the code's two-tab + three-
  sub-view structure. The clarity gap is operator navigation
  expectation, not a doc-vs-code drift.
