mitigations_unimplemented:
  - |-
    SIMPLE FIX option A (close the bypass at SQL): modify
    ReactiveDatasetVersionRepositoryImpl.getDatasetVersion to JOIN
    DATA_ENTITY on DATA_ENTITY.ID = datasetId AND DATASET_VERSION.ID
    = datasetVersionId. The query becomes parent-scoped; a
    cross-dataset request returns Mono.empty (the service-tier
    wraps as NotFoundException). Same fix for getDatasetVersionWithFields.
  - |-
    SIMPLE FIX option B (close the bypass at service): in
    DatasetVersionServiceImpl.getDatasetVersion, fetch the
    DatasetVersionDto then assert
    `pojo.getDatasetVersionPojo().getDatasetOddrn().equals(parentEntityOddrn)`
    where parentEntityOddrn is resolved from datasetId. If mismatch,
    throw NotFoundException. Higher-cost (extra DataEntity lookup
    per request) but localised to the service tier.
  - |-
    SIMPLE FIX option C (accept the shortcut, document the intent):
    add a comment in ReactiveDatasetVersionRepositoryImpl
    explaining that dataset_version.id is a globally unique
    surrogate so the URL's parent path is cosmetic. Update the
    OpenAPI spec to deprecate the parent path (use
    /api/datasets/versions/{version_id} instead). This is a
    contract change for downstream SDKs but is the cheapest
    correctness fix.
  - |-
    Add a regression test asserting either bypass behaviour OR
    closed behaviour:
      Test A (pins the BUGGY state): authenticate, hit
        /api/datasets/{wrong_id}/structure/{valid_version_id_for_other_dataset},
        assert 200 + structure of the OTHER dataset.
      Test B (after fix): same request, assert 404
        NotFoundException.
    Both tests pinned; the fix toggles which passes.
  - |-
    Fix the 500-on-missing-version-id in
    DatasetVersionServiceImpl.buildDataSetVersionDiffList:
    replace the generic RuntimeException at line 69-71 with
    NotFoundException("Dataset version", missingVersionId). The
    error becomes 404 consistent with the other endpoints.
  - |-
    Add an /developer-guides/api-reference/datasets sub-page on
    the live docs site. Document the 4 endpoints. Decide and
    document the per-entity-scoping policy (bug vs intent).
    DOC-NNN candidate. Sibling to the DataSource sub-page
    request (THIS BATCH, sibling invariant).
  - |-
    Cross-pillar audit follow-up — enumerate every controller
    endpoint where the URL implies parent-scoping (`/parent/{parent_id}/child/{child_id}`)
    AND verify the underlying SQL/service enforces the parent
    relationship. The DatasetController bypass is unlikely to be
    unique; the same pattern may exist at other per-data-entity
    surfaces (e.g., per-data-entity attachments, per-data-entity
    tags-update, per-data-entity ownership). Close the cross-pillar
    inventory.

notes: |-
  This invariant captures the FIRST documented instance of a
  per-entity-scoping bypass at the controller surface where the
  URL implies parent-child scoping. The 5-step picture
  (URL → controller → service → repository → SQL) shows the
  parent-id is consumed only at the controller method signature
  and the service-tier error-message-string — but lost before
  it reaches the SQL. The bug is invisible from any single layer.

  The 3-shape ASYMMETRY within the SAME REPOSITORY file is the
  load-bearing observation. The author chose to scope ONE of three
  related SQL queries by data_entity_id; the other two are NOT
  scoped. Either the asymmetry is INTENTIONAL (the scoped query
  has a semantic reason — there is no 'single latest version' without
  a dataset anchor — and the unscoped queries are correct because
  the version_id is globally unique) OR it is OVERSIGHT (the scoped
  query is the right shape for ALL three, the unscoped ones are
  bugs). The maintainer's call.

  Cross-cutting connections:
    - Pairs with read-collaborative-cross-owner-enumeration (THIS
      endpoint family — all 4 GET endpoints — joins the catalogue
      of 24+ no-SecurityRule read surfaces; the cross-owner read
      class is compounded by the per-entity-scoping bypass on TWO
      of them)
    - Pairs with f-004-stored-xss-extends-to-... family (the
      DatasetController GET endpoints are the read-side closure
      for the F-004 column-level XSS write surface at
      DatasetFieldController PUT /api/datasetfields/{id}/description;
      cross-owner readability + verbatim-store + no-rehype-sanitize
      compound)
    - Pairs with dataset-field-versioning-by-reference-no-soft-delete-orphan-accumulation
      (the parent-field cascade DELETE+CREATE in diff IS the visible
      surface of the versioning-by-reference persistence model)
    - Pairs with openapi-200-vs-201-status-code-drift (DatasetController
      doesn't have a write surface, so it doesn't add new vertices;
      but the 500-on-missing-version-id is a SIBLING drift class:
      runtime exceptions surfacing as 500 instead of 404 NotFoundException)

  Four DOC-NNN candidates:
    (a) /developer-guides/api-reference/datasets NEW page — the 4
        endpoints + the dataSet OpenAPI tag rendering
    (b) /features/data-discovery — admonition under 'Dataset schema
        diff' explicitly noting cross-owner readability + the
        cross-dataset diff possibility (or, post-fix, the
        parent-scoping guarantee)
    (c) /configuration-and-deployment/enable-security/authorization
        — explicit text on the read-collaborative posture +
        per-entity-scoping caveats
    (d) /features/data-discovery + /features/data-lineage — same
        admonition explaining how dataset_version_id is a global
        surrogate (or, post-fix, a per-dataset-scoped key)

batch_zg_addendum: |-
  ## STRENGTHENS — batch ZG (2026-05-26)

    The DataSetController class-level v0.4.0 sidecar (batch ZG) RE-CONFIRMS
    this invariant at primary-source class level, adding three new pieces
    of evidence:

      (a) Stress Protocol Cat F (Request Input Naming Drift) surfaces the
          bypass as a FORMAL DRIFT_INPUT_NAME_VS_IMPLEMENTATION classification
          on the dataEntityId path parameter — codifying the "URL implies
          scoping, SQL ignores it" pattern as a measurable defect class.

      (b) The "available-but-unused smell" inspection identified
          DATASET_VERSION.DATASET_ODDRN as the canonical fix-anchor —
          already joined in the latest-version path at
          ReactiveDatasetVersionRepositoryImpl.java:163-168, already
          filterable, missing only from the by-id and diff WHERE clauses.
          A one-line predicate per endpoint closes the bypass: e.g.
          `AND DATASET_VERSION.DATASET_ODDRN = (SELECT ODDRN FROM
          DATA_ENTITY WHERE ID = :datasetId)`.

      (c) The diff path adds a secondary observation: the size != 2 case
          (one or both version_ids missing) throws RuntimeException →
          HTTP 500, distinct from the identical-ids case which throws
          BadUserRequestException → HTTP 400. Asymmetric status codes
          for two equally-recoverable error modes.

    Three probes pin the invariant: P-147 (cross-dataset response shape),
    P-148 (latest vs max-version semantic), P-149 (400-vs-500 asymmetry).

