proposed_action: |-
  Unit test on TermServiceImpl.findTermsInDescription. Pass each edge-case description: (a) `"[[finance:Customer]]"` → exactly 1 mention, (b) `"[[foo[bar]:baz]]"` → DOCUMENT the actual behaviour (likely 1 mention with namespace="foo[bar]"), (c) `"[[:foo]]"` → ?, (d) `"[[foo:]]"` → ?, (e) `"[[CUSTOMER:nóm]]"` → assert Unicode handling, (f) multi-line `"line1\n[[finance:Customer]]\nline3"` → assert matched, (g) escaped `"\\[\\[finance:Customer\\]\\]"` → currently matched (no escaping mechanism). LOCKS each behaviour AS-IS; documents the contract for future improvement.
