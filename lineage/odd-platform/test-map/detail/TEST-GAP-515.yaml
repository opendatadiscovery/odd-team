proposed_action: |-
  Testcontainers integration test. (a) Pre-seed 10 entities (e1..e10) all reachable upstream of user uA's owned set. (b) GET /api/dataentities/my/upstream?page=1&size=5 → record response IDs. (c) Update e3.updated_at to NOW (the underlying table has changed). (d) GET /api/dataentities/my/upstream?page=2&size=5 → record response IDs. (e) Assert (the unstable contract): either (i) the second page contains entities NOT seen in the first page AND missing entities NOT in the second page, OR (ii) entries appear duplicated across pages. (f) Test comment 'LOCKS the no-ORDER-BY pagination instability contract as of 2026-05-19. When an .orderBy clause is added to listByOddrns, this test FLIPS to assert page 1 ∪ page 2 = {e1..e10} with no duplicates and no missing entries.' Pair with a /my/downstream symmetric test.
