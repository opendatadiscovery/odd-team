behaviour: |-
  **MEDIUM — Two-transaction cascade non-atomic on Lookup Table delete: a failure between the catalog-side DELETE and the physical DROP TABLE leaves the catalog inconsistent with the data store. Plus, the cascade-on-parent-DataEntity-delete is NOT enforced — deleting the parent DataEntity via `/api/dataentities/{id}` orphans the lookup_tables_schema rows.** Primary-source confirmed in the batch-V ReferenceDataController sidecar:

  **Two-transaction non-atomic delete**:
  - `LookupDataServiceImpl.java:113` declares `deleteLookupTable` as `@ReactiveTransactional` (one transaction). The body orchestrates: (a) `lookupTableSearchEntrypointRepository.deleteByTableId`; (b) `tableDefinitionRepository.deleteByTableId`; (c) `tableRepository.delete` (catalog-side delete).
  - `ReferenceDataRepositoryImpl.java:267` declares its own `@ReactiveCustomTransactional` on `deleteLookupTable` (DDL DROP TABLE) — a SEPARATE transaction.
  - `ReferenceDataServiceImpl.java:154-158` composes the two: `referenceDataRepository.deleteLookupTable(table).then(lookupDataService.deleteLookupTable(table))` — TWO sequential transactions, ONE Mono chain, no rollback semantics across the boundary.
  - **Failure mode**: if the physical DROP TABLE (transaction A) succeeds and the catalog-side delete (transaction B) FAILS (e.g. transient network error, statement timeout), the physical table is gone but the `lookup_tables` row still references it. Subsequent reads against the lookup_table fail with `relation "n_X__name" does not exist`.

  **Cascade-on-parent-DataEntity-delete is NOT enforced by FK**:
  - When an operator deletes the parent DataEntity via `DELETE /api/dataentities/{id}` OR via ingestion soft-delete-TTL, the cascade stops at the DataEntity tier. The `lookup_tables.data_entity_id` FK has NO `ON DELETE CASCADE` clause. The `lookup_tables_schema.n_X` physical tables remain. The catalog row in `lookup_tables` remains, now pointing to a tombstoned DataEntity.
  - **Result**: orphaned lookup_tables rows + orphaned physical tables + orphaned search-entrypoint rows. The only cleanup path is via `DELETE /api/referencedata/table/{lookup_table_id}` — but the operator who deleted the parent DataEntity may have no awareness that the child Lookup Tables exist.

  **Compound failure modes**:
  - Operator deletes DataEntity 100; DataEntity tombstoned; Lookup Table 555 (whose `data_entity_id = 100`) becomes orphaned. Listing `/api/referencedata/table` filters out tables linked to deleted entities IF the listing query applies the `DELETED_AT IS NULL` filter on the JOIN — verified per sister gap analysis that the JOIN does NOT apply this filter. So orphan tables surface in the list response with a soft-deleted parent reference.
  - The physical Postgres table `lookup_tables_schema.n_X__name` consumes storage indefinitely until the orphan is detected.

  **Why MEDIUM not HIGH**: the failure mode is a DATA-INTEGRITY hazard, not a security or operational-outage class. The orphan rows are eventually-detectable via tooling. The two-transaction non-atomic deletion is a corner-case (requires a specific failure between two consecutive transactions). MEDIUM at the per-instance severity.

  **Test gap shape**: regression-pin asserting (a) the parent-DataEntity-delete cascade leaves orphan rows; (b) the two-transaction non-atomic deletion leaves catalog-vs-data-store inconsistency on simulated mid-chain failure. Pin both shapes.
