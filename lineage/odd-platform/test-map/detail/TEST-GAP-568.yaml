behaviour: |-
  **Soft-delete-aware recreation invariant + Administrator/User-name asymmetry compound risk — mirror of batch-H Policy finding.** create(rolePojo) with name='Administrator' (the predefined seed already present) raises UniqueConstraintException with message 'Role with this name already exists' — verify the ExceptionUtils translation path. BUT create with a name colliding against a SOFT-DELETED role SUCCEEDS (the partial unique index excludes deleted_at IS NOT NULL rows per `role_name_unique`). This is the soft-delete-aware recreation invariant the platform relies on. The repository's correct partial-unique-index design MAKES the create-path gap exploitable: if a direct DB UPDATE soft-deletes the seeded Administrator row, the partial unique index frees the name AND roleRepository.create succeeds with attacker-chosen policy bindings. RoleServiceImpl.create (line 51-61) has NO name-protection check.
