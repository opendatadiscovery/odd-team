name: Active Feature Flag (boot-resolved Feature enum)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
  - P-08
description: |-
  NEW ENTITY, batch ZE — the deployment-wide on/off flag for an
  optional platform feature surface, exposed to the UI via
  GET /api/features/active. The Feature enum at components.yaml:115-119
  carries EXACTLY TWO values:
    - DATA_COLLABORATION — gated by datacollaboration.enabled config
    - ALERT_NOTIFICATIONS — gated by notifications.enabled config
  Both default to false per application.yml:173, 205, so a stock
  install returns items=[] from the endpoint.

  IMMUTABLE BOOT SNAPSHOT — FeatureResolverImpl.java:14, 16-31
  captures the @Value-injected booleans into a `private final
  Set<Feature>` in the constructor. Runtime mutation of the
  config keys (via /actuator/refresh, JVM system properties,
  environment update) is NOT reflected — the resolver returns
  the boot snapshot until process restart.

  Consumed by every UI WithFeature wrapper (WithFeature.tsx:15-36
  uses `activeFeatures.includes(featureName)`). Hot-path: App.tsx:49
  fires once per app-mount; populates appInfo.slice; feeds every
  Open-in-Slack button, DataCollaboration thread surface, etc.

  Information-disclosure scope: under DISABLED the endpoint is
  anonymously reachable (per the DisabledAuthSecurityConfiguration
  permitAll) — external scanners can fingerprint which optional
  features the operator has enabled. PROVIDER-NULL-BLEED-LIMITED-RISK
  FACET of REFACTOR-185: the payload is operator-policy-configurable
  booleans (NOT principal-impersonation like IdentityController, NOT
  internal-hostname leak like IntegrationController), so severity is
  reduced relative to the other REFACTOR-185 facets.

  Intentionally NARROW — the Feature enum has only 2 values even
  though application.yml carries other feature-shaped toggles
  (genai.enabled, metrics.export.enabled, housekeeping.enabled,
  auth.s2s.enabled, auth.ingestion.filter.enabled); the asymmetry
  is intentional — the Feature enum is the contract for 'flags the
  UI cares about'.
axes_present:
