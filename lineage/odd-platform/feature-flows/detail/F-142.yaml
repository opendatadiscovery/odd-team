companion_to:
  - feature_id: F-064
    relationship: prerequisite-for-my-views
    note: |-
      F-064 anchors the SILENT-EMPTY CONSEQUENCE for users without a
      user_owner_mapping. F-142 anchors the LIFECYCLE that creates that
      mapping. The two together describe the full identity-binding
      experience — F-142 is the workflow operator must complete BEFORE
      F-064's My-views populate.
  - feature_id: F-011
    relationship: writes-the-mapping-row-that-this-feature-resolves
    note: |-
      F-011 (Principal-to-Owner Resolution) reads user_owner_mapping at
      AuthIdentityProviderImpl.java:50-53. F-142 is the UI side that
      WRITES that row (via createOwnerAssociationRequest →
      OwnerAssociationRequestController on the backend).
