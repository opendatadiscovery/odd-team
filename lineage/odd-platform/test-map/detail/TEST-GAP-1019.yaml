proposed_action: |-
  Four-test wedge:
  (a) catalog_click_thunk_rejection — mock createDataEntitiesSearch
  to reject with a Network Error; click Catalog tab; assert (i) the
  current route did NOT change, (ii) an error toast was dispatched
  (or alternatively a specific catch-handler was invoked). RED today
  on assertion (ii). Pins the desired behaviour: rejected click
  produces a user-visible error.
  (b) dictionary_click_thunk_rejection — same shape against
  createTermSearch.
  (c) catalog_click_resolved — mock thunk resolution returning a
  search-id; assert navigate('/search/<id>') was called.
  (d) dictionary_click_resolved — same against /termsearch/<id>.
  Fix per (a)/(b): add a `.catch(err => dispatch(showServerErrorToast(err)))`
  on each .unwrap().then() chain. The toast wiring already exists
  elsewhere in the SPA (per TEST-GAP-424); the fix is a 2-line
  addition per click handler.
