name: ActivityHandler.getUpdatedState(parameters, List<Long>) default throws at RUNTIME
  not compile time — 16 of 18 concrete impls inherit the throwing default
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
description: |-
  **NEW INVARIANT, batch VAL-LSN-019-B (2026-05-20)** — surfaced by
  primary-source examination of ActivityHandler interface combined with
  Glob enumeration of the 18 concrete handler implementations.

  **THE INTERFACE CONTRACT** (`ActivityHandler.java:17-21`):
    ```java
    default Mono<Map<Long, String>> getUpdatedState(
        Map<String, Object> parameters, List<Long> dataEntityIds) {
      return Mono.error(new UnsupportedOperationException(
          "getUpdatedState for multiple ids is not implemented yet for this handler"));
    }
    ```

  **THE COVERAGE HOLE**: only 2 of 18 concrete impls OVERRIDE this default:
    - `DataEntityCreatedActivityHandler.getUpdatedState(parameters,
       List<Long>)` (`:46-49`)
    - `DataEntityStatusUpdatedActivityHandler.getUpdatedState(parameters,
       List<Long>)` (`:51-55`)

  The other 16 inherit the throwing default:
    BusinessNameUpdatedActivityHandler, AlertHaltConfigUpdatedActivityHandler,
    CustomGroupCreatedActivityHandler, DatasetFieldTermAssignmentActivityHandler,
    OwnershipCreatedActivityHandler, TagActivityHandlerImpl,
    AlertStatusUpdatedHandler, OwnershipUpdatedActivityHandler,
    DatasetFieldInformationUpdatedActivityHandler,
    DescriptionUpdatedActivityHandler, OwnershipDeletedActivityHandler,
    DatasetFieldValuesUpdatedActivityHandler, CustomGroupUpdatedActivityHandler,
    TermAssignmentActivityHandler — plus 2 abstract bases
    (AbstractOwnershipActivityHandler, AbstractCustomGroupActivityHandler)
    which also inherit.

  **THE SINGLE CALLER OF THE MULTI-ID PATH**:
    `ActivityIngestionRequestProcessor.process` (`:25-32`) — the S2S
    ingestion pipeline's DATA_ENTITY_CREATED emit. The processor calls
    `activityService.getUpdatedInfo(emptyMap(), request.getNewIds(),
    ActivityEventTypeDto.DATA_ENTITY_CREATED)` — dispatches to
    `DataEntityCreatedActivityHandler.getUpdatedState(...)` which is
    one of the two override impls. **Current runtime is safe.**

  **THE LATENT REGRESSION**: a future @ActivityLog method that
  passes a multi-id parameters bag for ANY OTHER event type (e.g.
  bulk-OWNERSHIP_UPDATED, bulk-TAG_ASSIGNMENT_UPDATED) would
  dispatch to a handler that inherits the throwing default —
  throwing `UnsupportedOperationException` at FIRST SUBSCRIPTION
  with the misleading message "getUpdatedState for multiple ids is
  not implemented yet for this handler".

  **WHY THE COMPILE-TIME CONTRACT IS WRONG**:
    The default method shape advertises a polymorphic batch path that
    the compiler accepts AT EVERY CALL SITE — `handler.getUpdatedState(
    params, dataEntityIds)` compiles regardless of the runtime handler
    type. There is no `@MustOverride`-style annotation in Java; the
    default-implementation pattern is widely used for "optional"
    methods, but here the default is fundamentally broken (throws
    immediately).

    The interface contract should EITHER:
    (a) Not declare the multi-id method at all — make it a separate
        BatchedActivityHandler subinterface that only specific impls
        implement, with a `instanceof BatchedActivityHandler` check
        at the call site
    (b) Implement the multi-id method correctly at the interface
        level by composing the single-id method: `Mono<Map<Long,
        String>> getUpdatedState(parameters, ids) {
          return Flux.fromIterable(ids)
              .flatMap(id -> getUpdatedState(parameters, id).map(s ->
                  Map.entry(id, s))).collectMap(Entry::getKey,
                  Entry::getValue); }`
        Cost: N DB reads instead of 1 batch read; correctness gain.
    (c) Throw at construction (not at first subscription) — the
        default-implementation could be `@Bean`-validated at startup
        if any reachable @ActivityLog event type has not overridden
        the multi-id path

  **THE OPERATOR-VISIBLE MANIFESTATION**:
    A maintainer adds a bulk operation (e.g. `bulkUpsertTags(List<
    Entity>)`) and decorates it with `@ActivityLog(event =
    TAG_ASSIGNMENT_UPDATED)`. The bulk operation calls
    `activityService.getUpdatedInfo(parameters, allTouchedIds,
    TAG_ASSIGNMENT_UPDATED)` — at runtime, this resolves to
    `TagActivityHandlerImpl.getUpdatedState(parameters, List<Long>)`
    which inherits the throwing default. The bulk operation 500s on
    its first invocation; the caller (e.g. the ingestion pipeline)
    rolls back the whole batch (per
    `activity-write-tx-coupled-emit-failure-rolls-back-business-mutation`
    invariant). The maintainer has to override the multi-id method
    on TagActivityHandlerImpl + every other handler that bulk
    operations will touch.

  **NO CI-TIME CHECK**:
    No test asserts that every ActivityEventTypeDto value's matching
    handler overrides the multi-id path. The bug surfaces at first
    invocation in production. Per the ActivityHandler sidecar's
    uncovered_behaviours, severity HIGH (would-be-test:
    `ActivityHandlerContractTest.testMultiIdGetUpdatedState_UnsupportedHandlers_ThrowsUnsupportedOperation`).
