- id: H-010
  hypothesis: "When a 0-indexed API caller requests GET /api/relationships?page=0, they receive the first page of results (graceful), not an error."
  derivation: "Negative-space + endpoint-shape: page is the conventional 0-or-1-indexed pagination knob; a JavaScript-default caller sends page=0; the OpenAPI PageParam lacks minimum:1."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      ReactiveDataEntityRelationshipRepositoryImpl.java:79 computes offset = (page - 1) * size with no
      Math.max(0,...) guard. For page=0 the offset is -size (negative); Postgres rejects a negative
      OFFSET with 'OFFSET must not be negative', surfacing as an opaque HTTP 500 (or 400 if WebFlux
      wraps the SQLException). The OpenAPI PageParam does not declare minimum:1 and Spring's binding
      accepts page=0. The page=null case throws an NPE at the Integer unboxing. (The exact HTTP status
      is PROBE-NEEDED at P-130, but that a non-graceful error occurs is statically certain.)
    evidence:
      - sidecar: odd-platform__java__RelationshipController__controller-class__RelationshipController.md
        section: bugs_limitations_corner_cases[2]
        cite: "ReactiveDataEntityRelationshipRepositoryImpl.java:79 + RelationshipController.java:20-26"
        note: "(page-1)*size produces negative offset for page=0; no minimum:1 on PageParam; no validation."
    operator_visible_failure: |
      A third-party developer following the typical 0-indexed pagination convention (the JavaScript
      default) sends page=0 on their first call and receives an opaque 500 instead of the first page,
      with no hint that pages are 1-indexed. The published list endpoint is hostile to the most common
      pagination assumption. page=null produces a 500 (NPE) as well.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

