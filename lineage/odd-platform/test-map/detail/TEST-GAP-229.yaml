gap_id: TEST-GAP-229
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java PolicyController controller-method:createPolicy
surfaced_by:
- createPolicy.md:tests_coverage_semantic.uncovered_behaviours.[3]
behaviour: 'POLICY_CREATE is the keys-to-the-kingdom permission — `{resource: {type:
  MANAGEMENT}, permissions: [ALL]}` is a legal policy shape identical to the seeded
  Administrator. Bound to a role and that role attached to an owner-user mapping,
  it grants full administrative power. SECURITY_RULES wires POLICY_CREATE NO_CONTEXT
  MANAGEMENT-tier at SecurityConstants.java:163-164; no integration test asserts the
  gate fires for an authenticated user WITHOUT POLICY_CREATE.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/PolicyAuthorizationTest.java
  name: createPolicy_callerWithoutPOLICY_CREATE_returns403
evidence:
- 'createPolicy.md says: ''Integration test of the auth gate: an authenticated user
  WITHOUT POLICY_CREATE Permission gets 403'''
- createPolicy.md:bugs_limitations_corner_cases.[DISABLED bypass] severity HIGH
- 'concepts.yaml:entities[Policy (Authorization)].security_aggregate.weaknesses.[1]
  verbatim: ''**No anti-elevation guard (HIGH)** — `{resource: {type: MANAGEMENT},
  permissions: [ALL]}` is a legal policy shape identical to the seeded Administrator.
  POLICY_CREATE is functionally root-on-the-platform'''
cross_references:
- concepts.yaml:entities[Policy (Authorization)].security_aggregate.weaknesses.[1]
proposed_action: 'Add `@WebFluxTest`-driven test asserting `403 Forbidden` for an
  authenticated caller without POLICY_CREATE hitting POST /api/policies. Companion
  test for caller WITH POLICY_CREATE creating a MANAGEMENT/ALL policy → 200. Pair
  with anti-elevation test: assert current behaviour (no guard), flip to expect 400
  once an anti-elevation guard is added.'
