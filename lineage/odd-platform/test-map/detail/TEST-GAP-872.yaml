behaviour: |-
  **HIGH — Ingestion-path and scheduler-driven activity events silently write `activity.created_by = NULL`; under DISABLED auth.type, anonymous mutations ALSO write NULL — and there is NO way at the schema level to distinguish "system event" from "auth-context-lost-due-to-bug" from "anonymous-mutation".** `ActivityServiceImpl.createActivityEvent` (`:46-49`) uses `authIdentityProvider.getCurrentUser().map(UserDto::username).switchIfEmpty(Mono.defer(() -> Mono.just(activityMapper.mapToPojo(event, activityCreateTime, null))))` — the `switchIfEmpty` fires when `ReactiveSecurityContextHolder.getContext()` is empty, which happens in THREE distinct cases: (a) `ActivityIngestionRequestProcessor.process` runs on the ingestion thread with NO SecurityContext (S2S path); (b) `AlertServiceImpl` scheduler-driven flows that lose the SecurityContext across reactor thread boundaries; (c) under `auth.type=DISABLED` (anonymous mutations). The `ActivityCreateEvent.systemEvent` boolean (`:13`) DOES propagate to `activity.is_system_event` per the MapStruct mapper at `ActivityMapper.java:79-81` — but the ingestion processor and AlertService set `systemEvent=true` explicitly, and a future caller forgetting that flag would silently produce an indistinguishable NULL-username row. **The Activity Feed has no schema-level way for an operator to determine whether a NULL-created_by row is genuinely systemic OR is a real-user mutation whose auth context was silently lost.**

  **Primary-source chain**:
  - `ActivityServiceImpl.java:46-50` (createActivityEvent single-row write):
    - Line 47: `authIdentityProvider.getCurrentUser().map(UserDto::username)` — only username (not provider; cross-mode bleed mechanism per implicit_adrs.[1])
    - Line 49: `.switchIfEmpty(Mono.defer(() -> Mono.just(activityMapper.mapToPojo(event, activityCreateTime, null))))` — the SILENT NULL fallback
    - Line 50: `activityRepository.saveReturning(pojo)` — persists with created_by=NULL
  - `ActivityServiceImpl.java:54-63` (createActivityEvents batch write) — same `.switchIfEmpty` pattern at line 60
  - `ActivityIngestionRequestProcessor.process` (`service/ingestion/processor/ActivityIngestionRequestProcessor.java:24-32`):
    - Sets `.systemEvent(true)` explicitly when building ActivityCreateEvent (per ActivityHandler.md:concepts.audiences — line 53 reference)
    - Runs WITHOUT @ReactiveTransactional / SecurityContext on the ingestion path
  - `AlertServiceImpl.registerNewAlertsActivityEvents` (`:309-325`) + `registerAutomaticallyResolvedAlertsActivityEvents` (`:247-258`):
    - Both set `.systemEvent(true)` (per ActivityServiceImpl.md:concepts.audiences)
  - `V0_0_48__add_activity.sql:10` — `created_by varchar(512)` NULLABLE
  - `V0_0_48__add_activity.sql:8` — `is_system_event boolean NOT NULL`

  **The structural ambiguity** (per ActivityHandler.md:bugs_limitations_corner_cases.[System-event username silently null]):
  - NULL `created_by` + `is_system_event=true` → "this was an ingestion / AlertService scheduler event" ✓ (intentional)
  - NULL `created_by` + `is_system_event=false` → AMBIGUOUS:
    - (1) Anonymous mutation under DISABLED auth.type (operator-visible mutation, ABSENT operator identity)
    - (2) A bug elsewhere caused SecurityContext to be lost across reactor boundaries on an authenticated request (silent auth-context drift)
  - The `is_system_event` column EXISTS in the schema but **only the ingestion + alert paths set it to true**; the `@ActivityLog` AOP path goes through `createActivityEvent` (singular) which receives the `event.systemEvent` from `ActivityCreateEvent` — but `ActivityAspect.postActivity` (per ActivityHandler.md:concepts.entities) does NOT set `systemEvent`, so the AOP-path defaults to false. A regression that drops the explicit `.systemEvent(true)` on an ingestion call would produce indistinguishable rows.

  **Operator-visible consequences**:
  - **Forensic ambiguity**: a security reviewer investigating "who changed entity X" sees null-created_by, is_system_event=false → cannot distinguish "the platform did this autonomously" from "user Y did this but their auth context was lost".
  - **DISABLED-mode operational fingerprint**: a dev/test deployment under `auth.type=DISABLED` accumulates indistinguishable-from-system activity rows for every anonymous mutation. If those activity rows are LATER copied to production (e.g. via DB export/import for debugging), the production audit log is contaminated with anonymous mutations indistinguishable from genuine system events.
  - **Compliance shape**: SOX/GDPR records-of-processing requires actor attribution; NULL + ambiguous-flag means "platform" attribution for some real-user actions.

  **Why HIGH not MEDIUM (sidecar says MEDIUM)**:
  - The sidecar rates this MEDIUM because the current behaviour is intentional for the system-event path AND the symptom (null actor) is operator-visible.
  - **We elevate to HIGH because**: (a) the schema-level ambiguity is STRUCTURAL — there's no `actor_kind` column distinguishing "auth-lost" from "anonymous" from "system"; (b) the regression risk is INVISIBLE (a future ingestion-path refactor that forgets `.systemEvent(true)` produces indistinguishable rows); (c) compliance frameworks (SOX/GDPR) explicitly require actor attribution.

  **Connection to probe P-020**:
  - The sidecar emits P-020 to verify the null-username persistence empirically and to characterise the UI rendering (does the UI show "system" or "unknown user" or blank?)
  - This TEST-GAP is the regression-pin AFTER P-020 confirms the storage and UI behaviour

  **Connection to TEST-GAP-869**:
  - TEST-GAP-869 pins the TX-coupling for the @ActivityLog path
  - This gap (872) pins the AUTH-context fallback (the OTHER side of the createActivityEvent contract)
  - Together they characterise the full write-side contract (TX coupling + actor-resolution fallback)
