# Post-Logout Redirect Provenance — product-owner reflection

## product_owner_narrative

When a user clicks "logout" in the ODD Platform UI under an OAuth2/OIDC deployment, the platform does not simply drop the local session — it hands the browser onward to the identity provider's end-session endpoint so the IdP can clear its own session too, and it tells the IdP where to send the user afterward. That "afterward" address is the `post_logout_redirect_uri` (Azure / Google / GitHub / ODD_IAM) or `logout_uri` (Cognito) query parameter. The product-owner framing of this feature is: *"after you log out, we bounce you through your identity provider and bring you back to the platform you started on."* The audience is the **odd-platform-ui-end-user** clicking logout and the **platform-operator** who deploys the platform behind a reverse proxy (per `system-mission.md:249-266` P-09 + the cross-pillar logout surface). The non-obvious design choice — and the entire subject of this feature flow — is *where the "platform you started on" address comes from*: it is computed at runtime from the inbound HTTP request's own Host, not read from any configured platform base URL (per the AzureLogoutSuccessHandler sidecar `implicit_adrs[2]`, MEDIUM-confidence implicit ADR, and the CognitoLogoutSuccessHandler sidecar `implicit_adrs[2]`).

A user interacts with this feature with **one on-screen control and no further choices** — and that is the first thing a senior product owner notices. The only UI affordance is the logout link in the app toolbar (`AppToolbar.tsx:35-37` issues `window.location.href = '/logout'`, per the PLT-073 / DOC-236 evidence). There is no field where the user types or sees the post-logout destination, no confirmation of where they will land, no signal of whether that destination was validated. The destination is derived server-side from the Host header the browser presented, via `UriUtils.getBaseUri(requestUri)` which strips path/query/fragment and keeps scheme + host[+port] + "/" (per both sidecars' `concepts.operations` + the Rule-8 read of `UriUtils.java:11-23`). So the user's "screen" gives them no provenance information at all — Rule 9's "reflect from the screen" resolves here to "the screen shows nothing about the redirect target," which is itself the finding (H-010). **Note (Rule 9, validation_gap below): the one UI hop that exists — the AppToolbar logout link — is NOT in this feature flow's chain; the chain is the five backend handlers + UriUtils + the application.yml absence. This reflection is therefore API/handler-grounded, and the UI-experience hypotheses (H-010) are reasoned from the sidecars' cross-references to `AppToolbar.tsx`, not from an enriched UI sidecar in the chain.**

The working parts, traced through the chain (`F-089.yaml` hops 1-3 + the Azure/Cognito sidecars). **Dispatch**: `OAuthLogoutSuccessHandler` selects the provider-specific handler via `shouldHandle(provider)` (per AzureLogoutSuccessHandler sidecar `implicit_adrs[1]`). **Redirect construction**: each handler appends the redirect parameter built from `UriUtils.getBaseUri(exchange.getRequest().getURI())` to the operator-configured IdP logout endpoint — `AzureLogoutSuccessHandler.java:38-44`, `CognitoLogoutSuccessHandler.java:43`, `GoogleLogoutSuccessHandler.java:40`, `GithubLogoutSuccessHandler.java:45`, `ODDIAMLogoutSuccessHandler.java:38` (per F-089.yaml `primary_subject` + the Rule-8 read). **Provenance**: the host inside that redirect parameter is whatever Host the inbound request carried — `example.com` from a well-behaved browser, or `attacker.example.com` if a reverse proxy trusted and forwarded a user-controlled `X-Forwarded-Host` (per F-089.yaml hop-2 evidence). **The missing guard**: a repo-wide grep for `platform.base-url` / `odd.platform-url` / `allowed.redirect` returns zero matches — there is no platform-side base-URL to cross-check the inbound Host against (per F-089.yaml hop-3 + the Azure sidecar `bugs_limitations_corner_cases[1]`). The platform contributes the unsanitised value; the IdP's own allowlist of registered logout URLs is the sole boundary (per F-089.yaml `terminal_side_effect`).

The integration story (per `system-mission.md` P-09 + F-089 `related_features`): this feature is one of three facets of "what does logout actually do?" on the Security & Access Control pillar. F-086 (Logout Token-Revocation Semantics) carries the COMPOUNDING gap — for Azure / Cognito / ODD_IAM the IdP-issued OAuth2 tokens are not revoked at logout (Azure v2.0 lacks RFC 7009; Cognito's revoke endpoint exists but the handler does not call it), so even if this open-redirect lands the user on an attacker domain, previously-captured tokens stay valid for the rest of their TTL (per F-089.yaml facet `combines_with_shb_107...` + the Cognito sidecar `bugs_limitations_corner_cases[3]` + PLT-073). F-011 batch O carries the Azure-NPE-on-null-logout-uri facet of the same handler chain (a different drift — PLT-130). The three features together describe the full logout surface; this one owns the redirect-provenance question.

A product owner would flag five edge cases in a demo. (a) **The redirect destination is whatever Host the request presented — there is no platform-side allowlist** (H-002, the headline; severity HIGH). (b) **The exposure is conditional on TWO operator-side switches the platform does not control**: the reverse proxy must trust `X-Forwarded-Host` (Spring default is `none`, so this requires opt-in), AND the IdP allowlist must be permissive (e.g. a wildcard `*.example.com` shared across dev/staging/prod) — when either is tight, the attack is blocked (H-003, H-008; this is what makes it `partial`/conditional, not unconditional). (c) **`getBaseUri` always strips the path to "/"**, so an attacker cannot plant a specific path-shaped phishing page through the platform — the redirect is root-only, which bounds (but does not eliminate) the phishing value (H-004). (d) **The exposure compounds with the token-revocation gap** — landing on an attacker domain post-logout while captured tokens remain valid is worse than either alone (H-009, cross-link F-086 / PLT-073). (e) **The user sees nothing on screen about where they are going or whether it was checked** — the logout link is fire-and-forget (H-010).

## hypotheses

- id: H-001
  hypothesis: |
    When the platform is deployed behind a load balancer / internal hostname and
    a user logs out, the post-logout redirect brings them back to the SAME
    externally-reachable hostname they were using — WITHOUT the operator having to
    enumerate every external hostname in ODD's own configuration.
  derivation: |
    Implicit-ADR seed — the AzureLogoutSuccessHandler sidecar implicit_adrs[2] +
    F-089 facet handler_choice_to_derive_dynamic_uri_undocumented_in_intent state
    the dynamic-host derivation was chosen precisely so multi-hostname deployments
    work with no ODD-side hostname list. This is the LEGITIMATE capability the
    design delivers; a reflection that only catalogues the open-redirect misuse
    would miss why the code is shaped this way.
  seed_source: pillar-mission
  validation:
    verdict: confirmed
    actual_behavior: |
      Each handler builds the redirect target from UriUtils.getBaseUri(requestUri)
      where requestUri is the inbound request's own URI (AzureLogoutSuccessHandler.java:38-44,
      CognitoLogoutSuccessHandler.java:43, and the three siblings at the cited
      lines). getBaseUri keeps scheme+host[+port] and strips the path to "/"
      (UriUtils.java:11-23, Rule-8 read). So a user who reached the platform at
      https://odd-prod.example.com/some/path is redirected back to
      https://odd-prod.example.com/ after the IdP clears its session — and an
      operator running the SAME ODD instance behind several external hostnames
      never has to list those hostnames in ODD config (only in the IdP's allowlist).
      The capability is real and is the documented intent of the design choice.
    evidence:
      - sidecar: "odd-platform__java__auth__logout__AzureLogoutSuccessHandler.md"
        section: "implicit_adrs[2]"
        cite: "AzureLogoutSuccessHandler.java:40 + UriUtils.java:11-22"
        note: "Inbound-request-derived redirect chosen so multi-hostname deployments need no ODD-side hostname enumeration."
      - sidecar: "odd-platform__java__auth__logout__CognitoLogoutSuccessHandler.md"
        section: "implicit_adrs[2]"
        cite: "CognitoLogoutSuccessHandler.java:43"
        note: "Same pattern across all four UriUtils.getBaseUri handlers; operators declare the target once in the IdP allowlist, not in ODD config."
    confidence: HIGH
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-002
  hypothesis: |
    When a user logs out, the post-logout redirect target sent to the IdP is the
    platform's own canonical URL — i.e. the platform validates/pins the redirect
    host so a user-controlled Host header cannot redirect a just-logged-out user
    off-platform after the IdP's end-session step.
  derivation: |
    Endpoint/response-shape (the post_logout_redirect_uri / logout_uri parameter)
    + Category-F naming alignment — the parameter is named "post_logout_redirect
    URI" and the feature is the platform's own logout; a senior reviewer expects
    the value to be the platform's pinned URL, not whatever the request presented.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The redirect host is the INBOUND request's Host, derived via
      UriUtils.getBaseUri(requestUri) with NO platform-side validation, NO
      allowlist, NO scheme enforcement, and NO configured base URL to cross-check
      against (grep of platform.base-url / odd.platform-url / allowed.redirect
      returns zero matches — F-089.yaml hop-3 + Azure sidecar
      bugs_limitations_corner_cases[1]). Under a reverse proxy that trusts and
      forwards a user-controlled X-Forwarded-Host (Spring forward-headers-strategy
      native/framework — many K8s-native deployments enable this), the request URI
      carries the attacker-supplied host, and the handler propagates it verbatim
      into the IdP end-session redirect (F-089.yaml facet[0]+[1]). If the IdP's
      registered logout-URL allowlist is permissive (e.g. a wildcard *.example.com
      shared across dev/staging/prod under one Azure App Registration), the IdP
      then 302s the just-logged-out user to https://attacker.example.com/. The
      platform contributes the unsanitised value; the IdP allowlist is the sole
      boundary (F-089.yaml terminal_side_effect).
    evidence:
      - sidecar: "odd-platform__java__auth__logout__AzureLogoutSuccessHandler.md"
        section: "bugs_limitations_corner_cases[1] + security.known_security_gaps[1]"
        cite: "AzureLogoutSuccessHandler.java:40 + UriUtils.java:11-22 + grep(no platform.base-url)"
        note: "No platform-side allowlist; Host-header-derived; IdP allowlist is the only mitigation."
      - sidecar: "(unresolved — F-089.yaml facets[0]+[1] + Rule-8 read)"
        section: "observed_vs_expected.facets[0]+[1]"
        cite: "Cognito :43 / Google :40 / Github :45 / ODDIAM :38 + UriUtils.java:11-23"
        note: "Uniform across all 5 handlers; the X-Forwarded-Host hijack scenario is enumerated in the facet."
    source_read_for_validation: true
    operator_visible_failure: |
      (a) A user who clicks "logout" on the platform they trust is, after the IdP's
          end-session step, deposited on an attacker-controlled domain — with the
          elevated trust that comes from having just been bounced through their
          identity provider and from having their session cookie freshly cleared
          (the classic post-authenticated-logout open-redirect; F-089.yaml facet[1]).
      (b) The attacker domain can mount a convincing re-login phishing page ("your
          session expired, please sign in again") that harvests credentials the
          user re-enters, believing the IdP sent them there.
      (c) The exposure is invisible to the operator at deploy time: there is no ODD
          config knob, no boot warning, and no UI signal that the post-logout target
          is taken from an untrusted header — the operator's only defences are
          reverse-proxy Host hardening and a tight IdP allowlist, neither of which
          ODD prompts for.
    severity: HIGH
    confidence: HIGH
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional
    routes_to_finding: caveat-candidate

- id: H-003
  hypothesis: |
    When a user logs out through a CORRECTLY configured reverse proxy (one that
    sets/overwrites the Host to the platform's canonical hostname and does not
    honour client-supplied X-Forwarded-Host), the post-logout redirect lands on
    the platform's own URL and the open-redirect is not reachable.
  derivation: |
    View-mode / deployment-posture seed — F-089 facet
    spring_webflux_forward_headers_strategy_default_none_but_k8s_overrides notes
    the vulnerability surface depends on deployment-side header trust. A senior
    reviewer separates the platform default from the operator override to size the
    real exposure.
  seed_source: view-mode + negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      Spring WebFlux's default server.forward-headers-strategy is `none` (confirmed:
      application.yml does NOT set it — Rule-8 grep), so out of the box ODD does NOT
      honour X-Forwarded-Host — the request URI's host is the actual TLS-terminating
      host, which a well-behaved proxy sets to the platform's canonical hostname. In
      that posture UriUtils.getBaseUri returns the platform's own URL and the
      redirect target is correct (F-089.yaml facet[3]). The open-redirect (H-002)
      becomes reachable ONLY when the operator opts into forward-headers-strategy
      native/framework AND the proxy trusts client X-Forwarded-Host AND the IdP
      allowlist is permissive — i.e. the SAFE default holds unless three operator-
      side conditions all flip. The platform itself does not enforce a stance; the
      operator-side proxy configuration is the load-bearing surface.
    evidence:
      - sidecar: "(unresolved — F-089.yaml facet[3] + Rule-8 read)"
        section: "observed_vs_expected.facets[3]"
        cite: "Spring WebFlux default forward-headers-strategy=none + application.yml (unset)"
        note: "Default does not honour X-Forwarded-Host; exposure requires operator opt-in + permissive IdP allowlist."
    source_read_for_validation: true
    confidence: MEDIUM
    use_case_kind: "empty/no-match"
    coverage: unverified
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-004
  hypothesis: |
    When the post-logout redirect target is derived from the request, an attacker
    cannot inject an arbitrary path-shaped phishing URL (e.g.
    https://platform/fake-login?...) through the platform — only a host.
  derivation: |
    Endpoint-shape seed — F-089 facet getbaseuri_strips_path_phishing_restricted
    _to_root claims the path is always stripped. A senior reviewer verifies the
    bound on the attack to size it accurately (it reduces, not eliminates, the risk).
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      UriUtils.getBaseUri (UriUtils.java:11-23, Rule-8 read; corroborated by both
      sidecars' concepts.operations "strips path/query/fragment, replaces path with
      '/'") always reduces the inbound URI to scheme+host[+port]+"/". So the redirect
      parameter the platform contributes can carry a different HOST but never a
      crafted PATH or QUERY — an attacker exploiting H-002 lands the user on
      https://attacker.example.com/ (root), not on a specific attacker-authored
      page-path served through the platform's own redirect. This bounds the
      phishing value to whatever the attacker serves at the root of the host they
      control (still meaningful, but not a platform-path-spoofing primitive).
    evidence:
      - sidecar: "odd-platform__java__auth__logout__CognitoLogoutSuccessHandler.md"
        section: "concepts.invariants[3] + implicit_adrs[2]"
        cite: "UriUtils.java:11-23 (replacePath('/'))"
        note: "Path always stripped to '/'; operators never whitelist per-page URIs; bounds the attack to host-only."
    source_read_for_validation: true
    confidence: HIGH
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-005
  hypothesis: |
    When an Azure operator follows the docs but leaves logout-uri unset, the
    logout flow degrades safely (no redirect, stay logged in / clear error) rather
    than crashing the logout endpoint.
  derivation: |
    Negative-space + cross-feature (F-011 batch O / PLT-130) — the Azure sidecar
    bugs_limitations_corner_cases[0] flags an NPE on null logout-uri; a senior
    reviewer expects a half-configured optional-looking key to fail safe, and
    checks whether this handler chain does.
  seed_source: negative-space + cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      AzureLogoutSuccessHandler.java:39 calls URI.create(provider.getLogoutUri())
      with NO null-guard; URI.create(null) throws NullPointerException per the JDK
      contract, so an Azure user's first logout returns HTTP 500 — the logout
      endpoint crashes rather than degrading (Azure sidecar
      bugs_limitations_corner_cases[0], severity HIGH; the live oauth2-oidc docs
      state "leaving logout-uri unset raises a NullPointerException and the logout
      flow returns a 500 response"). The sibling CognitoLogoutSuccessHandler.java:33-35
      DOES carry the StringUtils.isEmpty(logoutUri) early-return guard; Azure does
      not — an inconsistent guard, not a deliberate design (the validator at
      ODDOAuth2Properties.java:17-28 checks clientId + provider, NOT logoutUri).
    evidence:
      - sidecar: "odd-platform__java__auth__logout__AzureLogoutSuccessHandler.md"
        section: "bugs_limitations_corner_cases[0]"
        cite: "AzureLogoutSuccessHandler.java:39 + CognitoLogoutSuccessHandler.java:33-35 + ODDOAuth2Properties.java:17-28"
        note: "URI.create(null) → NPE → HTTP 500; Cognito has the guard, Azure does not; validator omits logoutUri."
    operator_visible_failure: |
      (a) An Azure operator who treats logout-uri as optional (it reads as optional
          in the YAML) ships a deployment where EVERY logout click returns 500 —
          users cannot log out at all, and the failure surfaces only at the first
          runtime logout attempt, not at boot.
      (b) The inconsistency with Cognito means an operator's mental model from a
          working Cognito setup ("missing logout-uri is a graceful no-op") is wrong
          for Azure (it is a crash).
    severity: HIGH
    confidence: HIGH
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: |
    When a Cognito operator leaves logout-uri unset, clicking logout still logs
    the user out locally (the platform-side session is cleared) even if the IdP
    redirect cannot be built.
  derivation: |
    Negative-space — the Cognito sidecar bugs_limitations_corner_cases[0] +
    implicit_adrs[1] describe a silent-no-op short-circuit. A senior reviewer
    checks whether "graceful degradation" actually preserves the core promise of
    logout (terminating the local session) — here it does NOT.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      CognitoLogoutSuccessHandler.java:33-35 returns Mono.empty() when
      StringUtils.isEmpty(logoutUri) — BEFORE the WebSession::invalidate() call at
      line 49. So an empty logout-uri short-circuits the ENTIRE handler: no redirect
      AND no local session invalidation. The user clicks logout, the request returns
      200 with an empty body, and the user remains logged in to ODD with no error
      and no log line (Cognito sidecar bugs_limitations_corner_cases[0], severity
      HIGH; security.known_security_gaps[1] — "the second half of the logout flow
      (WebSession::invalidate) is gated on the first half (logoutUri presence)").
      The "graceful degradation" is not graceful: it silently disables logout.
    evidence:
      - sidecar: "odd-platform__java__auth__logout__CognitoLogoutSuccessHandler.md"
        section: "bugs_limitations_corner_cases[0] + security.known_security_gaps[1]"
