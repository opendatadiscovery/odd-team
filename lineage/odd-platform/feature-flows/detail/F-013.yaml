description: |-
  Operators edit a data entity's custom metadata field values via
  `PUT /api/dataentities/{data_entity_id}/metadata/{metadata_field_id}` with
  body `{value: <String>, origin?: MetadataFieldOrigin}`. The endpoint is
  the per-row mutator on the custom-metadata write surface (paired with
  `createDataEntityMetadataFieldValue` POST for bulk-add and
  `deleteDataEntityMetadataFieldValue` DELETE for per-row removal).
  Authorization IS enforced — `SecurityConstants.java:204-207` registers
  a SecurityRule binding `DATA_ENTITY_CUSTOM_METADATA_UPDATE` to this
  exact path under DATA_ENTITY-scoped Policy resolution. Live Permissions
  doc WebFetched 2026-05-19 status 200 confirms the permission.

  The user-observable promise (per OpenAPI operationId "upsert", per the
  Permissions doc, per the UI's redux thunk hardcoding "Metadata
  successfully updated." on any 200): the call REPLACES an existing value
  or CREATES a new one for the named field on the named entity.

  The user-observable reality, per batch-L primary-source code-walk of
  the controller + service + repository + OpenAPI schema + DB migration:

  (1) **The endpoint is an UPDATE, NOT an UPSERT** —
  ReactiveMetadataFieldValueRepositoryImpl.update (lines 95-104) issues
  `DSL.update(METADATA_FIELD_VALUE).set(VALUE, ...).set(ACTIVE,
  pojo.getActive()).where(METADATA_FIELD_ID.eq(...).and(DATA_ENTITY_ID.eq(...))).returning()`.
  If no row exists for the (dataEntityId, metadataFieldId) pair, the
  UPDATE matches zero rows, the inner Mono collapses to empty, the rest
  of the pipeline (search-vector refresh, mapper) is short-circuited via
  empty-mono propagation, and the controller returns **200 OK with empty
  body** rather than 404. SAME SHAPE as upsertDataEntityInternalDescription
  (batch G; F-004). The UI's `metadata.thunks.ts:51-54` shows
  "Metadata successfully updated." on this empty-body 200.

  (2) **No data-entity existence check either** — unlike createMetadata
  (DataEntityServiceImpl.java:257-258 does
  `reactiveDataEntityRepository.get(dataEntityId).switchIfEmpty(NotFoundException)`),
  the upsert path at lines 287-305 NEVER validates that the data entity
  exists. A PUT against a non-existent entity returns 200-with-empty-body.

  (3) **No type validation against metadata_field.type** —
  formData.getValue() is a raw String written verbatim into the `text`
  column regardless of the field's declared MetadataTypeEnum (INTEGER /
  FLOAT / BOOLEAN / DATETIME / ARRAY / JSON / STRING / UNKNOWN per
  MetadataTypeEnum.java:3-12). A user can write "not a number" to an
  INTEGER-typed field or "true" to a JSON-typed field. Downstream readers
  must defend against arbitrary string content regardless of declared type.

  (4) **EXTERNAL-origin fields are writable** — the upsert path does NOT
  check MetadataFieldPojo.getOrigin(). EXTERNAL fields are populated by
  collectors during ingestion (MetadataFieldServiceImpl.java:62-71
  ingestMetadataFields creates origin=EXTERNAL); a user with
  `DATA_ENTITY_CUSTOM_METADATA_UPDATE` can overwrite the
  collector-ingested value, and the override persists until the next
  ingestion cycle replaces it.

  (5) **No @ActivityLog annotation despite ActivityEventTypeDto.CUSTOM_METADATA_UPDATED
  existing** — DataEntityServiceImpl.upsertMetadataFieldValue (lines
  287-305) lacks `@ActivityLog(event = CUSTOM_METADATA_UPDATED)` even
  though ActivityEventTypeDto.java:18 declares the enum value and sibling
  write methods on this controller DO emit activity (upsertBusinessName
  line 336 BUSINESS_NAME_UPDATED; upsertTags line 358 TAG_ASSIGNMENT_UPDATED).
  The createMetadata (line 245) and deleteMetadata (line 307) siblings
  are ALSO un-annotated — the entire CUSTOM_METADATA_* family is
  reserved-but-never-fired.

  (6) **`active` column dropped to NULL on every UPDATE** —
  ReactiveMetadataFieldValueRepositoryImpl.java:98 writes
  `.set(METADATA_FIELD_VALUE.ACTIVE, pojo.getActive())`, but the
  upsert path's pojo construction at DataEntityServiceImpl.java:292-295
  never calls `setActive(...)`. The jOOQ-generated
  MetadataFieldValuePojo.getActive() returns boxed Boolean null when
  unset. The DB column is `boolean DEFAULT TRUE` (V0_0_1__init.sql:180),
  but DEFAULTs apply on INSERT only — an UPDATE that sets the column
  writes the explicit NULL, dropping a previously-TRUE row to NULL. Every
  edit silently drops the row's active flag.
facets_summary: |-
  11 substantive drifts: silent 200-on-missing-pair + silent 200-on-missing-entity
  + no type validation against MetadataTypeEnum + EXTERNAL-origin writable
  (silently overwrites collector-ingested values) + forensic-silence (no
  @ActivityLog despite CUSTOM_METADATA_UPDATED existing) + active=NULL
  regression on every UPDATE + OpenAPI `origin` field silently dropped +
  spec-says-upsert / impl-does-update + DISABLED-mode bypass + unbounded
  value length at every layer + metadata_field GLOBALLY unscoped (no
  tenant/owner namespacing).
