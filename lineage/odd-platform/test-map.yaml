  - gap_id: TEST-GAP-093
    category: missing-edge-case
    criticality: HIGH
    node_ids:
      - "odd-platform java DataCollaborationController controller-method:postMessageInSlack"
    surfaced_by:
      - "postMessageInSlack.md:tests_coverage_semantic.uncovered_behaviours.[5,6]"
      - "postMessageInSlack.md:bugs_limitations_corner_cases.[1] (severity MEDIUM)"
    behaviour: "Body-size attack — `MessageRequest.text` has no max-length cap, no sanitisation; 4 MB body accepted by the controller, persisted to the `messages` table, and only fails at Slack's `chat.postMessage` boundary (Slack's per-message text limit is ~40 KB). Caller is told `202 Accepted` but the message ends up `ERROR_SENDING` after the retry budget exhausts."
    test_files_existing: []
    test_files_proposed:
      path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/DataCollaborationOversizedMessageTest.java"
      name: "postMessageInSlack_oversized4MBText_returns202ButFailsAsyncWithMsgTooLong"
    evidence:
      - "postMessageInSlack.md says: 'A 4 MB request body would be accepted by the controller, persisted to the messages table, and only fail at Slack's chat.postMessage boundary'"
      - "concepts.yaml:entities[Slack collaboration app].security_aggregate.weaknesses.[3] verbatim: 'No body validation: MessageRequest.text is required only ... 4MB body accepted and persisted; Slack's per-message ~40KB limit only hits AFTER 202 has returned (severity MEDIUM)'"
    cross_references:
      - "concepts.yaml:entities[Slack collaboration app].security_aggregate.weaknesses.[3]"
    proposed_action: "Add test posting MessageRequest with 4MB `text`; assert 202 with `state=PENDING_SEND`, then assert the persisted row flips to `ERROR_SENDING` with `failure_reason='msg_too_long'` after the sender drains. Locks both the size-acceptance and the async-failure-only-detectable contracts."

