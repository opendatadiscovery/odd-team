proposed_action: |-
  Add `TagNameValidationAbsenceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Parameterised across the four write paths. For EACH of `POST /api/tags`, `PUT /api/tags/{id}`, `PUT /api/terms/{id}/tags`, `PUT /api/datasetfields/{id}/tags`:
  1. `*_emptyStringName_pinsCurrentBehaviour` — submit `""`; assert the CURRENT behaviour (per sidecars: accepted).
  2. `*_whitespaceOnlyAndPaddedName_createsDistinctDirectoryRows` — submit `[" x ", "x"]` (where the path is array-shaped); assert two distinct `tag` rows result (the whitespace-fragmentation bug).
  3. `*_unboundedLengthName_pinsCurrentBehaviour` — submit a 10K-character name; assert the current behaviour (accepted up to the DB column limit).
  4. `*_controlCharacterName_pinsCurrentBehaviour` — submit a name with embedded control characters.

  The test pins the CURRENT no-validation behaviour. Pair with REFACTOR-NNN: add a shared tag-name validator (trim + non-empty + maxLength) at `getOrCreateTagsByName` / `bulkCreate` — one fix covers all five tag-name write surfaces (this gap's four + TEST-GAP-305's data-entity path). When the fix lands, the tests invert to assert rejection.
