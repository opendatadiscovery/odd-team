behaviour: |-
  **HIGH — `TagServiceImpl.updateRelationsWithDataEntity` (lines 96-121, `@ReactiveTransactional`) implements a DIFF that filters CURRENT relations to `!external` only (line 102), then hardcodes `external = false` (line 109) on all new relations. The architectural invariant: the Collector OWNS its `external=true` relations; the UI cannot delete them, modify them, or impersonate them. No test pins this invariant. A future refactor that removes the `.filter(!external)` clause at line 102 would compile, pass all existing tests, and silently let UI users overwrite Collector-pushed external tag relations on the next PUT.**

  **Primary-source chain** (per TagServiceImpl.md:stress_findings.B.S-B-2):
  - **Line 102**: `Mono<List<TagToDataEntityPojo>> currentRelations = reactiveTagRepository.listTagRelations(List.of(dataEntityId)).map(rs -> rs.stream().filter(r -> !r.getExternal()).toList());` — the diff input is restricted to non-external relations.
  - **Line 109**: `.map(tag -> new TagToDataEntityPojo().setTagId(tag.getId()).setDataEntityId(dataEntityId).setExternal(false))` — new relations created with `external = false` HARDCODED.
  - **Lines 112-119**: `Mono.zip(currentRelations, updatedRelations).flatMap(function((current, updated) -> { List<TagToDataEntityPojo> toDelete = current.stream().filter(r -> !updated.contains(r)).toList(); ... }))` — diff via `.contains()` on the relation rows.

  **What this protects** (the contract the test must pin):
  - **Symmetric immutability for external rows**: a tag with both EXTERNAL and INTERNAL relations to the same data entity stays EXTERNAL after a UI-driven PUT.
  - **External-relation count invariant**: PUT `/api/dataentities/{id}/tags` with `tagNames = ['A']` against an entity with `[(tagA, external=false), (tagB, external=true)]` ends with `[(tagA, external=false), (tagB, external=true)]` — NOT just `[(tagA, external=false)]`.
  - **UI cannot impersonate a Collector**: there is no way through this surface to write a row with `external = true`. The OpenAPI spec accepts only tag names, not the external flag — and even if a malicious caller posted JSON like `{"tags": [{"name": "x", "external": true}]}`, the unmarshalling discards unknown fields, and the service hardcodes `false`.

  **Operator-visible consequences if the invariant breaks**:
  - **Collector-pushed tags silently overwritten**: a Collector pushes tag "PII" with `external = true` on entity X; an analyst PUTs `tagNames: ['public']` on entity X via the UI; the "PII" relation is silently deleted. On the Collector's next push, "PII" is re-created — but only after the operator already shipped wrong governance signal downstream.
  - **Audit-trail inversion**: an investigator chasing "who removed PII tag from entity X?" finds the UI user — but the architectural intent was that UI users cannot remove Collector-owned tags. The investigator's mental model is broken.
  - **The dual-write coordination breaks**: REFACTOR-223 (Tag side-door) catalogues 5 paths into the Tag directory; this gap is the CASCADE-side complement. If the `!external` filter is removed, the UI suddenly has the ability to mutate Collector-owned relations at the per-entity level, even though the directory-level TAG_UPDATE remains gated.

  **Why HIGH not MEDIUM**:
  - The defense is a 1-line `.filter()` (line 102) + a 1-line `.setExternal(false)` (line 109). Both are easy targets for an "innocent" refactor that consolidates create paths.
  - The architectural intent is captured in the implicit_adr (TagServiceImpl.md:implicit_adrs.[EXTERNAL relations are immutable to UI users]) — explicitly. But there is no test gate.
  - A regression here cross-pillar drains: P-01 governance signal correctness + P-10 ingestion-source-of-truth + P-07 audit-feed semantics. Three pillars affected at once.
