mitigations_unimplemented:
  - |-
    Emit a Prometheus gauge notification_wal_backlog_bytes (sourced from
    pg_wal_lsn_diff against confirmed_flush_lsn for the slot) — operators
    can alert on growing backlog before disk exhaustion.
  - |-
    Document the disk-exhaustion failure mode on the live
    /features/active-platform-features/notifications page with operator-facing
    remediation: monitor slot lag, set up Postgres-side disk alerts on
    pg_wal volume, separate WAL volume from data volume per Postgres
    best-practice.
  - |-
    Add a notifications.poison-skip.enabled config flag + an operator API
    endpoint to manually advance setAppliedLSN past a known-bad LSN range.
    Operators retain auditability (the skipped LSNs are logged) AND avoid
    the disk-exhaustion path.
  - |-
    Pair with the existing poison-skip mitigation candidate on the
    poison-message-wal-replay-loop invariant — implementing skip-poison
    at the dispatcher closes BOTH the delivery-blocked layer AND the
    disk-exhaustion layer simultaneously.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20Y from the
  NotificationSubscriber sidecar's primary-source evidence at the WAL listener
  thread itself. The disk-exhaustion path is implicit in the existing
  poison-message-wal-replay-loop invariant but was never explicitly named —
  this invariant pins it as a distinct, more-severe consequence with a
  different MTTD, different remediation urgency, and different blast radius.

  Cross-cutting connections:
    - Pairs with poison-message-wal-replay-loop (batch K primary source) —
      both describe the same root cause but at different layers
      (delivery-blocked vs storage-exhausted)
    - Pairs with lazy-create-no-drop-replication-artefacts (batch C) — the
      operator-owns-cleanup posture means there is NO automated path to
      release WAL retention; combined with poison-replay this becomes a
      latent disk-exhaustion bomb
    - Cross-cutting case-law for "operator-owns-cleanup posture combined
      with no observability surface" — a class of architectural decisions
      where the platform relies on operator vigilance with no automation
      and no telemetry surface

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the disk-exhaustion failure mode on the live
        notifications page with operator-facing remediation
    (b) Document the pg_wal volume separation as a Postgres-side
        prerequisite for production deployment
