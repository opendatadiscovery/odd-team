cross_pillar_relationships:
- pillar_id: P-07
  kind: shares_data_with
  via: |-
    Three of the four advisory locks live inside P-07 Active Platform
    Features sub-features: notifications.wal.advisory-lock-id (F-009 WAL
    notification delivery), datacollaboration.receive-event-advisory-lock-id
    + datacollaboration.sender-message-advisory-lock-id (F-038 Data
    Collaboration). The fourth — partition.advisory-lock-id — is shared
    by F-010 Housekeeping + the activity-table partition rotation that
    F-021 Activity Feed depends on. A collision SILENTLY breaks one or
    more P-07 features.
- pillar_id: P-08
