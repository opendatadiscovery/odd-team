behaviour: |-
  **Infinite-scroll cursor + non-ADMIN single-page termination unit gap.** `PolicyList.tsx:47-50` defines `fetchNextPage` that dispatches `fetchPolicyList({page: page+1, size:100, query})` IF `hasNext === true`; the InfiniteScroll wrapper at lines 110-117 triggers this when the user scrolls within 200px of the bottom (`scrollThreshold='200px'`). For non-ADMIN users, `PolicyServiceImpl.java:115` builds `new Page<>(filteredPolicies, filteredPolicies.size(), false)` — `hasNext` is HARDCODED FALSE regardless of size. The UI's infinite-scroll terminates correctly after one page even for non-ADMINs with >100 role-attached policies, but the contract is unobvious. No test asserts (a) `hasNext === true` + scroll-near-bottom dispatches `fetchPolicyList({page: page+1, size, query})`; (b) `hasNext === false` short-circuits the dispatch (the line 48 `if (!hasNext) return`); (c) the non-ADMIN single-page path: a stubbed server returning `hasNext: false` after the initial page never receives a page-2 request even if the user scrolls. A regression that broke the `!hasNext` short-circuit would cause runaway fetches for non-ADMIN users; a regression that broke the page-counter increment would refetch page 1 repeatedly.
