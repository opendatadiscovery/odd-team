name: Activity Feed
canonical_in_docs: false
canonical_candidate: true
description: |-
  Platform-wide audit-trail surface exposing append-only events tracking who
  changed what (descriptions, business names, ownership, tags, terms, custom
  metadata, dataset fields, alerts, halt-config). Reached via GET /api/activity
  (windowed by beginDate/endDate + 9 filter facets) and GET /api/activity/counts
  (aggregate totals). Four visibility modes via `type` query parameter (ALL /
  MY_OBJECTS / DOWNSTREAM / UPSTREAM). Cursor pagination via `(lastEventId,
  lastEventDateTime)` — the typo `lasEventId` exists on the public controller
  signature (ActivityController.getActivity.md
  bugs_limitations_corner_cases[0]). Persisted in the range-partitioned
  `public.activity` table managed by ActivityTablePartitionManager (partition
  WIDTH controlled by `odd.activity.partition-period`, default 30 days; no
  retention/DROP path — table grows monotonically).

  **STRENGTHENED batch 2026-05-20T (ActivityController class sidecar)** — adds
  controller-class layer evidence anchoring the 2-method controller surface
  shape (getActivity + getActivityCounts) as the COMPLETE read surface for the
  global Activity Feed: there is no admin variant, no bulk export, no streaming
  alternative, and no programmatic API-reference page (WebFetch 2026-05-20:
  /developer-guides/api-reference/activity → 404). 4 of the 27 ActivityEventType
  enum values (OPEN_ALERT_RECEIVED, RESOLVED_ALERT_RECEIVED, ALERT_STATUS_UPDATED,
  ALERT_HALT_CONFIG_UPDATED) originate from AlertServiceImpl flows — cross-link
  to F-007. The 27-vs-20 enum-cardinality puzzle from batch R is RECONCILED in
  this batch (20 named global types + 7 categorical internal types = 27); see
  invariant activity-event-enum-20-named-plus-7-categorical-equals-27.

  **STRENGTHENED batch 2026-05-20 VAL-LSN-019-B (5-sidecar Activity stress canary)**:
  the Activity Feed concept is now anchored at SEVEN sidecars covering the full
  read-side AND write-side of the feature (HTTP → service → repository →
  handler-differ → housekeeping). Headline cross-tier additions:
    (a) The WRITE-PATH funnel is `ActivityServiceImpl.createActivityEvent` /
        `createActivityEvents` (single + batched). The activity row is in
        the SAME @ReactiveTransactional as the originating business mutation
        — emit failure rolls back the user's change (S-E-1, captured as a new
        invariant `activity-write-tx-coupled-emit-failure-rolls-back-business-mutation`).
    (b) The SNAPSHOT-DIFF mechanism (the wrongly-named ActivityHandler interface;
        canonicalisation candidate `activity-event-state-differ-vs-activityhandler-name-drift`):
        17 concrete implementations each capture pre+post snapshots of the
        affected data entity; the diff is JSON-string equality at
        ActivityAspect.java:86; emit fires only when oldState != newState.
    (c) The CONCURRENT-OLDSTATE-CAPTURE race (handler-tier; new invariant
        `activity-handler-concurrent-oldstate-capture-race`): two concurrent
        @ActivityLog mutations on the same data entity capture the SAME
        pre-mutation oldState; the second handler's diff records the WRONG
        attribution.
    (d) The HOUSEKEEPING side: `ActivityEmptyPartitionsHousekeepingJob` is
        the SOLE reaper but a near-no-op on steadily-used platforms (60-day
        windows rarely empty out); the count-check-then-DROP is
        non-transactional (race window — new invariant
        `activity-empty-partitions-race-window-between-count-check-and-drop`).
    (e) The cross-mode bleed via provider-agnostic LEFT JOIN to
        USER_OWNER_MAPPING (existing invariants
        `provider-null-cross-mode-bleed` +
        `cross-provider-username-row-duplication-in-external-joins`) is
        confirmed at the service layer: `UserDto::username` mapping
        at ActivityServiceImpl.java:47,58 DROPS the provider tag before
        persistence.
    (f) `getActivityCounts` accepts null dates while `getActivityList`
        rejects them — asymmetric validation (new invariant
        `activity-counts-asymmetric-null-date-validation`).

  vocabulary_status: codebase-anchored, doc-side-partially-covered (live
  `features/active-platform-features/activity-feed` describes the UI surface but
  main-concepts.md does not name 'Activity Feed' as a canonical term).
vocabulary_status: codebase-anchored, doc-side-partially-covered
