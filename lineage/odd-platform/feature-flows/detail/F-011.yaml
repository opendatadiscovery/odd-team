      LOGIN_FORM to OAUTH2 (or vice versa) discovers their existing user-owner
      mappings no longer match because the OAuth2 user has (alice, github)
      whereas the LOGIN_FORM user had (alice, null).
    expected: |-
      Documentation should spell out the compound key explicitly + a migration
