behaviour: |-
  **MEDIUM — the `tag` OpenAPI tag's four operations carry two spec-conformance defects with zero CI coverage: (1) `getPopularTagList` reuses the SHARED `IdsParam` component whose `description` reads "Entity ids" — but the implementation binds `ids` as a TAG-id-set filter on the `tag` directory. A consumer reading the rendered spec for `getPopularTagList` would supply DATA-ENTITY ids and receive empty/nonsensical results (the LSN-020 input-name-vs-implementation drift class). (2) No `tag`-tagged operation declares ANY `4xx` response — `getPopularTagList` declares only `200`, `createTag`/`updateTag` only `201`, `deleteTag` only `204` — so a spec consumer cannot anticipate `401`/`403`/`404`/`400` error envelopes from the contract.** Primary source from the batch-X-TAGGING `tag` openapi-tag sidecar:

  - **IdsParam misdescription**: `getPopularTagList` references the shared `IdsParam` component (`openapi.yaml:351` -> `components.yaml:4239-4248`), whose `description` reads `Entity ids` (`components.yaml:4242`). `TagController` binds it as `List<Long> ids` -> `tagService.listMostPopular(query, ids, page, size)` (`TagController.java:36-44`); the `TagController` + `TagServiceImpl` sidecars establish `ids` is a TAG-id-set filter on the tag directory (`TAG.ID.in(ids)`, `ReactiveTagRepositoryImpl.java:141-142`). The `IdsParam` component IS shared and IS accurate for its other consumer (`openapi.yaml:139`, a data-entity-scoped operation) — so the defect is operation-LOCAL: a tag-scoped operation reuses an entity-scoped parameter component without an operation-level description override.
  - **No 4xx declared**: every `tag`-tagged operation declares ONLY its success status (`openapi.yaml:352-421`). `updateTag`/`deleteTag` raise `NotFoundException` (a 404), `createTag` raises `UniqueConstraintException` (a 4xx), and all four can return `401`/`403` — none of these is in the contract. The `ErrorResponse` component exists in `components.yaml` but no `tag` operation references it.

  **Two distinct sub-behaviours, both unpinned:**
  - **`ids` parameter semantics (LSN-020 class)** — `GET /api/tags?ids=1,2,3` filters by TAG id, NOT by entity id as the spec's `IdsParam` description claims. A consumer supplying data-entity ids gets empty/nonsensical results. The drift survives cross-data scenarios: when a value is BOTH a valid data-entity id AND a valid tag id, the operation silently returns the (wrong) tag, masking the misunderstanding. P-031 (placeholder probe) pins this.
  - **No-4xx contract gap** — a spec-conformance check (a CI lint, or a `WebTestClient` test cross-referencing the spec) asserting that the operations the implementation CAN return a 4xx for actually declare it. Today the spec under-declares; a generated strict client has no typed model for the error envelopes.

  **Why MEDIUM**: spec-vs-code conformance defects — a consumer reading the published contract builds wrong expectations (wrong `ids` semantics; no error-envelope model). Functional impact is zero (the implementation works); contract impact is non-zero (consumers driving against the spec misbehave). The drift is silent — no test reconciles spec and code at any layer.

  **Test gap shape**: a `WebTestClient` / spec-conformance test asserting (a) `GET /api/tags?ids={tagId}` filters by TAG id (returns the tag with that id), and `GET /api/tags?ids={dataEntityId-that-is-not-a-tag-id}` returns empty — PINNING the LSN-020 drift as the current state; (b) `updateTag`/`deleteTag` on a non-existent id returns 404 while the OpenAPI operation declares no 404 — surfacing the contract gap; (c) `createTag` with a duplicate name returns a 4xx while the spec declares no 4xx. The current state is PINNED.
