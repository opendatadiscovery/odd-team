name: |-
  Search route mounts at `/search/*` wildcard with no UUID-shape validation — any string routes to Search; doomed API call surfaces as empty Catalog
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
description: |-
  **NEW MEDIUM-severity GRACEFUL-DEGRADATION INVARIANT, batch ZI
  (2026-05-26)** — the Search/Catalog UI surface mounts at `/search/*`
  (wildcard) in `App.tsx:61`:

      <Route path={`${searchPath()}/*`} element={<Search/>}/>

  The `/*` wildcard suffix means React Router matches ANY URL beginning
  with `/search` to the `<Search/>` component, regardless of what
  follows the prefix. `/search`, `/search/abc-def`, `/search/anything/
  nested/garbage/123` ALL route to `<Search/>`. React Router 6's
  wildcard semantics capture ONLY the first path segment into
  `useParams().searchId` — subsequent segments are discarded.

  **There is NO validation that the `:searchId` segment is a real
  (or even well-formed) UUID before mounting `<Search/>`.** The
  declared path template `${BASE_PATH}/${SEARCH_ID_PARAM}` does not
  carry React Router's parameter-pattern syntax (`:searchId(\\w{8}-...)`)
  that would enforce a shape.

  **The downstream failure path** is observable but not surfaced as
  an error to the operator:

    1. User opens `/search/<garbage-string>` (typo, stale bookmark,
       shared link to a deleted session).
    2. `<Search/>` mounts; `useSearchRouteParams()` returns
       `{searchId: '<garbage-string>'}`.
    3. `Search.tsx:44-48` sees `routerSearchId` is truthy and
       dispatches `getDataEntitiesSearch({searchId: <garbage>})`.
    4. `searchApi.getSearchFacetList({searchId: <garbage>})` produces
       `GET /api/search/<garbage>`.
    5. Backend at `SearchController.getFacetList(searchId)` → service
       layer attempts `UUID.fromString(<garbage>)` which throws
       `IllegalArgumentException`; OR the service queries
       `search_facets WHERE id = <garbage>::uuid` and Postgres rejects
       the cast; either way the controller returns a 400-class error.
    6. The redux thunk's `handleResponseAsyncThunk` (per
       `redux/lib/handleResponseThunk` pattern) either surfaces the
       error as a toast OR silently swallows it (NOT pinned by the
       search route sidecar — depends on which error-handler path
       fires).
    7. **The user sees an EMPTY CATALOG (zero results) which is
       INDISTINGUISHABLE from 'no matches' for an authentic search.**
       No error page, no "session expired" message, no "invalid URL"
       indicator.

  **The graceful-degradation gap is operator-facing**: a typo'd URL or
  a stale bookmark (after the 30-day TTL reaper deletes the
  `search_facets` row — see
  `invariant:search-id-route-param-is-session-uuid-not-saved-search-category-f`)
  renders a CATALOG that LOOKS EMPTY rather than one that indicates a
  navigation failure. Operators have no signal that their URL is
  malformed or expired.

  **Compounding factor — the wildcard `/*` is broader than necessary**.
  The Search component tree has NO nested routes. The mount could be
  `/search/:searchId?` (optional param) instead, which would limit
  matches to exactly `/search` and `/search/{one-segment}`. The
  wildcard accepts `/search/anything/nested/garbage` (renders Search
  with `searchId='anything'`, ignores the rest) — harmless today but
  invites future drift (a developer adding a nested route in the
  Search subtree may not realise the wildcard already matched the URL).

  **Cross-batch context**: the same wildcard-broader-than-necessary
  pattern exists at multiple sites:
    - `App.tsx:61` `/search/*` (this finding)
    - `App.tsx:72` `${directoryPath()}/*` (directory subtree DOES use
      nested Routes for level-2/3/4 — legitimate use)
    - `App.tsx:74` `${dataModellingPath()}/*` (Data Modelling subtree
      uses nested Routes — legitimate)
    - `App.tsx:75-88` `lookupTablesPath()/*` (Lookup Tables subtree
      uses nested Routes — legitimate)

  Search is the ONLY top-level pillar where the `/*` wildcard mounts
  a component with no nested routes — the wildcard accepts garbage
  silently and the result is the empty-catalog failure mode.

  **Fix surfaces**:

    1. **Replace the wildcard with an optional-param mount**:

           <Route path={searchPath()} element={<Search/>}/>
           <Route path={`${searchPath()}/:searchId`} element={<Search/>}/>

       Two discrete routes; React Router matches one or the other; no
       wildcard. URLs like `/search/anything/nested/garbage` no longer
       match Search and instead fall through to the 404 / NotFound
       route.

    2. **Add a UUID-shape validator in `useSearchRouteParams`**:

           const { searchId } = useParams<keyof SearchRouteParams>();
           if (searchId && !isValidUuid(searchId)) {
             return { searchId: undefined };  // treat as no-UUID
           }
           return { searchId };

       The Search.tsx orchestrator already handles the `!routerSearchId`
       case by creating a fresh session; treating malformed UUIDs as
       no-UUID makes the failure mode "operator gets a fresh session"
       which is at least a navigable state.

    3. **Surface the 404 explicitly** at `Search.tsx:44-48` — when the
       `getDataEntitiesSearch` thunk returns 404 or 400, render an
       AppErrorPage with a "Search session not found — start a new
       search?" message. Cost: one error-handler branch.

  **Test gap**: no integration test asserts the empty-catalog failure
  mode. A Playwright test that navigates to `/search/garbage` and
  asserts EITHER an explicit error message OR a fresh-session URL
  redirect would catch this regression.

  vocabulary_status: codebase-anchored. The live doc page at
  `/features/data-discovery/search` (WebFetched 2026-05-26 status 200)
  does NOT mention the URL form at all (see also
  `invariant:search-id-route-param-is-session-uuid-not-saved-search-category-f`).
  Operators have no documented signal that URLs can be malformed.
