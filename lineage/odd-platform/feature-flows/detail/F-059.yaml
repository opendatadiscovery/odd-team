terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Postgres DDL: `ALTER TABLE lookup_tables_schema.n_{nsId}__{old_name}
    RENAME TO lookup_tables_schema.n_{nsId}__{new_name}`. Downstream
    pipelines (dbt models, BI dashboards, notebooks, Airflow DAGs) that
    joined against the old name receive `relation
    "lookup_tables_schema.n_5__customer_lookups" does not exist` on their
    next run. No deprecation alias, no rename view, no notification, no
    audit emission, no UI warning.
  evidence: 'ReferenceDataRepositoryImpl.java:181-202 — ALTER TABLE DDL'
observed_vs_expected:
  facets:
    - facet_id: rename_cascade_breaks_documented_public_surface_silently
      drift_class: ui_metadata_edit_silently_renames_documented_public_postgres_surface
      severity: HIGH
      observed: |-
        Operator edits a lookup table's NAME through the UI (a metadata
        action). The service-tier rebuilds the physical table name and the
        DDL renames the underlying Postgres table. Downstream pipelines
        joining against the documented public surface
        (lookup_tables_schema.{name}, per docs.opendatadiscovery.org/features/master-data-management/lookup-tables)
        break with no signal. Operator renaming "Customer Lookups" to
        "Customer Lookup Codes" to clarify the concept can break the
        company's revenue dashboard with no UI warning, no audit event, no
        notification fan-out.
      expected: |-
        Layered mitigation per SHB-047 Notes:
        (a) UI rename-time WARNING dialog naming the affected physical
        table + offering (cancel / rename-with-alias / rename-without-alias);
        (b) Backend CREATE VIEW lookup_tables_schema.n_5__customer_lookups
        AS SELECT * FROM lookup_tables_schema.n_5__customer_lookup_codes as
        a deprecation alias with configurable TTL;
        (c) Decouple business-name from physical-name entirely (immutable
        n_{nsId}__lt_{lookupTableId} physical name; business-name metadata
        only) — breaking change vs documented public surface;
        (d) Audit emission via ActivityEvent — same shape as F-057's
        DQ severity audit-silence finding (cross-pillar pattern).
      evidence:
        - 'ReferenceDataServiceImpl.java:107-124, 191-194 (rebuilds physical table name)'
        - 'ReferenceDataRepositoryImpl.java:181-202 (ALTER TABLE DDL)'
        - 'documentation/docs/features/master-data-management/lookup-tables — "Lookup tables are directly queryable via the lookup_tables_schema PostgreSQL schema" (per ReferenceDataController sidecar implicit_adrs[3])'
        - 'LookupTableForm.tsx:84-93 (single name field; no warning UI)'
      ui_unverified: false
    - facet_id: lsn_001_class_default_footgun_at_operator_action_layer
      drift_class: operator_action_layer_silent_data_contract_break_lsn_001_class
      severity: HIGH
      observed: |-
        LSN-001-class default-footgun pattern at the operator-action layer
        (vs the deployment-config layer where LSN-001's attachment-ephemeral
        default originated). Shape: operator takes a CORRECT-LOOKING action;
        the action does something correct (renames metadata) AND a hidden
        side-effect (renames physical table) that breaks something they
        care about (downstream pipelines).
      expected: |-
        The operator-action layer matches the deployment-config layer in
        caveat-clarity — every UI action that has a non-obvious side-effect
        carries a UI warning AND a doc-side caveat AND an audit event.
        Three layers of defence; today there are zero.
      evidence:
        - 'retrospectives/LSN-001-attachment-ephemeral-default.md (case-law anchor for the default-footgun pattern)'
        - 'SHB-047 Notes (LSN-001-class characterisation)'
      ui_unverified: false
    - facet_id: no_audit_emission_on_lookup_table_rename
      drift_class: audit_silence_on_gated_mutation_with_external_blast_radius
      severity: MEDIUM
      pending_fix: "FIXED by CTRIB-023 / odd-platform #1753 Defect 2 — updateLookupTable now emits a LOOKUP_TABLE_RENAMED ActivityEvent (old->new name) via LookupTableRenamedActivityHandler; the feed records who renamed when. Release-gated: still LIVE until 0.29.0 ships; flips resolved at the release gate. Regression guard: odd-team IT-137. NOTE: this fixes ONLY the rename audit; the other lookup-table mutations remain unaudited (the wider audit-asymmetry, tracked PLT-229). The sibling facets here (rename_cascade_breaks_documented_public_surface_silently / lsn_001_class_default_footgun) are NOT fixed — the destructive physical rename stands."
      observed: |-
        The rename emits no ActivityEvent, no last_modified_by, no version
        increment. Post-mortem on a "why did the revenue dashboard break
        last Tuesday" investigation cannot answer "who renamed which lookup
        table when" from the platform. Same audit-silence pattern as F-057
        (DQ severity) — applied to a different mutating surface with
        cross-system blast radius via the documented public SQL schema.
      expected: |-
        ActivityEvent.builder().eventType(LOOKUP_TABLE_RENAMED)
        .oldState(...).newState(...).principal(...) emission inside
        ReferenceDataServiceImpl.updateLookupTable. F-021 (Activity Feed)
        is the canonical sink. Cross-cuts F-057's DQ severity audit-silence
        finding as the next invocation site of the canonicalisation
        candidate 3 pattern (audit-log presence asymmetry).
      evidence:
        - 'ReferenceDataServiceImpl.java:107-124 (no @ActivityLog)'
        - 'system-mission.md canonicalisation candidate 3'
      ui_unverified: false
