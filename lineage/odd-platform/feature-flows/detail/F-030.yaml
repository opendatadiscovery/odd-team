- pillar: P-09
  kind: shares_data_with
  via: |-
    The endpoint is whitelisted by P-09's `SecurityConstants.WHITELIST_PATHS`
    `/ingestion/**` entry — the read-collaborative posture (REFACTOR-024
    family) extends to the ingestion-side whitelist on the WRITE half.
    The asymmetric ingestion-filter coverage (only `/ingestion/entities`
    matched by IngestionDataEntitiesFilter; only `/ingestion/datasources`
    matched by IngestionDataSourceFilter; `/ingestion/metrics` matched
    by NEITHER) is the structural source of the false-sense-of-security
    drift documented at F-008 batch-O + batch-P.
- pillar: P-10
  kind: shares_data_with
  via: |-
    Metrics ingestion is one of THREE ingestion intake shapes —
    alongside `POST /ingestion/entities` (F-008 Batch Ingestion) and
    `POST /ingestion/entities/datasets/stats` (the stats path
    catalogued at F-018 batch-Z extension). The three paths share the
    `IngestionController` class, the same OpenAPI-driven
    `IngestionApi` interface, and the same `/ingestion/**` whitelist —
    but with THREE distinct authentication postures, THREE distinct
    transactional shapes, and THREE distinct empty-payload contracts.
    The asymmetry IS the architectural finding.
- pillar: P-08
  kind: shares_data_with
  via: |-
    Operators configure `metrics.storage` (INTERNAL_POSTGRES vs
    PROMETHEUS) + `metrics.prometheus-host` at deployment time per the
    P-08 operator-facing configuration surface
    (`configuration-and-deployment/odd-platform` page). The storage
    backend choice is a one-way migration today (no operator tooling
    to migrate data from INTERNAL_POSTGRES to PROMETHEUS); operators
    switching storage backends lose access to pre-switch metric
    history.
