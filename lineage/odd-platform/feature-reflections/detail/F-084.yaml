- id: H-010
  hypothesis: |-
    When an operator sets BOTH `admin-principals` and `admin-groups` on a base-class provider
    (Cognito/Azure), a user who matches EITHER is granted ADMIN.
  derivation: |-
    Both knobs are exposed uniformly; an operator expects them to be additive (either path
    grants admin), not mutually exclusive.
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |-
      In AbstractOIDCUserHandler (Cognito/Azure/Custom-OIDC) BOTH checks run sequentially and
      either sets isAdmin=true (admin-principals at lines 33-43, admin-groups at lines 44-55) —
      so on the base-class providers the hypothesis holds: either path grants ADMIN, no
      short-circuit. BUT the behaviour is NOT uniform across the matrix the operator sees as
      uniform: on Google, admin-groups is a no-op (H-002) so only admin-principals can grant
      ADMIN; on GitHub, admin-principals fires FIRST and bypasses the org gate (H-003) and
      admin-groups is only evaluated for org members who did not already match admin-principals.
      So "either knob grants admin, consistently" is true for base-class providers and false
      for Google and GitHub.
    evidence:
      - sidecar: "unresolved (AbstractOIDCUserHandler — source read for validation)"
        section: enrichUserWithProviderInformation
        cite: "AbstractOIDCUserHandler.java:33-55"
        note: "admin-principals AND admin-groups both evaluated; either sets isAdmin (no short-circuit)"
        source_read_for_validation: true
      - sidecar: odd-platform__java__auth__handler__GithubUserHandler.md
        section: concepts.invariants (admin-principals-bypass-org)
        cite: "GithubUserHandler.java:54-67"
        note: "GitHub diverges — admin-principals short-circuits before org+team evaluation"
    operator_visible_failure: |-
      The unmet part: an operator who learns the additive both-knobs behaviour on a Cognito
      client and carries that mental model to a Google or GitHub client will be wrong. On
      Google their admin-groups silently does nothing (only admin-principals works); on GitHub
      the evaluation order means admin-principals is a bypass and admin-groups is conditional on
      org membership. The matrix presents as uniform but the admin-resolution algebra differs
      per provider — the exact asymmetry this feature exists to surface.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: |-
    When two provider handlers could both claim a login (e.g. a future OktaUserHandler plus the
    Custom-OIDC catch-all), a deterministic, configured order decides which one wins.
  derivation: |-
    Operators (and the maintainers extending the handler set) expect dispatch precedence to be
    explicit, not accidental, on a security-critical decision.
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      The dispatcher iterates the Spring-autowired `List<OAuthUserHandler>` and picks the FIRST
      `shouldHandle == true` (OAuthSecurityConfiguration.java:185-197, per feature-flow chain hop
      1). There is NO @Order annotation anywhere in the handler hierarchy, so list order is
      Spring's bean-collection order. TODAY this is safe because each handler matches a disjoint
      provider string and CustomOIDCUserHandler matches only providers NOT in the enum — so
      first-match-wins has no ambiguity. The hypothesis is "deterministic AND configured":
      deterministic-in-practice is true today; configured/explicit is false — the safety is by
      luck of disjoint matching, not by a pinned order.
    evidence:
      - sidecar: "feature-flow F-084 facet handler_dispatch_order_unspecified_first_match_wins"
        section: observed_vs_expected.facets
        cite: "OAuthSecurityConfiguration.java:185-197 + CustomOIDCUserHandler.java:28-34"
        note: "first-match-wins over an unordered List; no @Order; Custom catch-all"
      - sidecar: odd-platform__java__auth__handler__GoogleUserHandler.md
        section: bugs_limitations_corner_cases (shouldHandle first-match-wins)
        cite: "GoogleUserHandler.java:38-40 + OAuthSecurityConfiguration.java:185-189"
        note: "current bean set uniquely-disjoint, so safe today"
    operator_visible_failure: |-
      Latent, not live: a future maintainer adding an OktaUserHandler (shouldHandle true for
      'okta') depends on Spring listing it BEFORE the Custom-OIDC catch-all in an unordered
      list — but Custom-OIDC's catch-all does not exclude 'okta' until the list is iterated. If
      ordering shifts (a refactor, a Spring upgrade changing scan order), the new handler could
      be shadowed by the catch-all and silently lose its provider-specific admin-detection. The
      security decision rests on an unpinned dependency.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

