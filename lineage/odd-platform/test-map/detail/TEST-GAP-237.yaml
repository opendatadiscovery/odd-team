gap_id: TEST-GAP-237
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java OwnerController controller-method:createOwner
surfaced_by:
- createOwner.md:tests_coverage_semantic.uncovered_behaviours.[5]
behaviour: Under `auth.type=DISABLED`, the SecurityRule for `OWNER_CREATE` still nominally
  exists in the rules list, but the DISABLED authentication mode bypasses the entire
  WebFlux security filter chain. DISABLED is documented as dev-only, but operators
  who run with `auth.type=DISABLED` on a network-reachable port expose unauthenticated
  owner-creation; combined with absence of rate-limit and absence of audit log, the
  directory can be populated with arbitrary names without trace.
