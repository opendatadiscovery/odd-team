notes: |-
  Distinct from the broader `odd-platform-ui-end-user` audience: the
  Data Quality Engineer is a SPECIALISED role whose daily workflow lives
  on the DQ pillar (P-04) surfaces. An odd-platform-ui-end-user is anyone
  authenticated; a data-quality-engineer is someone whose JOB is to
  watch the dashboard, triage failures, and annotate severity.

  The live use-case page (use-cases/use-cases/dq-visibility) is the
  canonical doc reference. The audience entry is named verbatim there,
  making this audience `canonical_in_docs: true`.

  Surface gaps for this audience that batch ZC captured:
    - Title filter binding (LSN-020 class) confuses operators who expect
      to filter by dataset name and instead filter by ownership role
    - Empty-state ambiguity (no error UI) confuses operators when a
      backend outage masquerades as an empty catalog
    - Access-control silence in docs leaves operators without a clear
      mental model of who else sees the dashboard
    - Run-status doc-drift (3 documented, 6 in code) leaves operators
      without an explanation when they see BROKEN / ABORTED / UNKNOWN
maintainer_curated: false
