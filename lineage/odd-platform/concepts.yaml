# concepts.yaml — refreshed concept-merger pass after batch 2026-05-12C
#
# This catalog clusters concepts surfaced across 30 per-node enrichment sidecars
# spanning five substrate axes (controllers, openapi_tags, ui_routes, ui_shell,
# config_prefixes). Concepts that match canonical names in
# `documentation/docs/main-concepts.md` use the canonical name verbatim;
# extensions to the vocabulary (concepts not yet named in the docs) carry
# `canonical_candidate: true` and surface in `canonicalisation_candidates`.
#
# Per-concept security_aggregate / performance_aggregate fields aggregate
# sparse per-file signals into feature-level posture. Confidence drops where
# contributing sidecars carry incomplete signals.
#
# Batch 2026-05-10A added 5 method-level sidecars (Alert / Attachment / Activity
# Feed / Slack / Collector Token).
#
# Batch 2026-05-10B added 5 config-key-consumer sidecars — the layer that
# consumes Spring `@ConditionalOnProperty` / `@Value` config keys to wire
# runtime behaviour. Each surfaced a LSN-001/002-class concern:
#   - AppInfoController @Value("auth.type") @L18
#   - AuthorizationManagerCondition @ConditionalOnProperty(auth.type=OAUTH2) @L11
#   - CounterTimeSeriesExtractor @ConditionalOnProperty(metrics.storage=PROMETHEUS) @L20
#   - IngestionDataEntitiesFilter @ConditionalOnProperty(auth.ingestion.filter.enabled=true) @L20
#   - ActivityTablePartitionManager @Value("odd.activity.partition-period:30") @L11
#
# Batch 2026-05-12C adds 5 new sidecars — 4 `*SecurityConfiguration` classes
# (one per auth mode) plus a new NotificationsProperties config-properties-class:
#   - DisabledAuthSecurityConfiguration @ConditionalOnProperty(auth.type=DISABLED) @L10 (Auth Mode DISABLED branch — permit-all chain, no CSRF, no CORS, no S2S wiring, no boot WARN)
#   - LoginFormSecurityConfiguration @ConditionalOnProperty(auth.type=LOGIN_FORM) @L31 (Auth Mode LOGIN_FORM branch — VALIDATES REFACTOR-073: runs WITHOUT AuthorizationCustomizer; ADMIN-for-all; plaintext credentials; open-redirect surface)
#   - OAuthSecurityConfiguration @ConditionalOnProperty(auth.type=OAUTH2) @L71 (Auth Mode OAUTH2 branch — WIRES AuthorizationCustomizer; S2S composes-not-mutex; S2S X-API-Key grants ADMIN across all /**)
#   - LDAPSecurityConfiguration @ConditionalOnProperty(auth.type=LDAP) @L51 (Auth Mode LDAP branch — WIRES AuthorizationCustomizer; containsIgnoreCase admin match → substring-collision admin escalation; no LDAPS scheme enforcement; auth.ldap.password leaks via /actuator/env)
#   - NotificationsProperties — NEW concept area: Notifications subsystem (off-by-default; per-channel URL-presence activation; leader-elected WAL consumer; lazy-create-no-drop replication slot; fail-soft fan-out)
#
# CRITICAL CROSS-CUTTING FINDINGS triangulated by batch C (3+ independent sidecars):
#
# 1) Default-DISABLED + no-fail-fast — 4-sidecar triangulated. AppInfoController +
#    AuthorizationManagerCondition + IngestionDataEntitiesFilter + DisabledAuthSecurityConfiguration
#    all converge on the same operator trap. The Auth Mode concept's security_aggregate
#    marks this as a HIGH-severity load-bearing weakness, with all 4 sidecars cited.
#
# 2) S2S composes-not-mutex (privilege escalation across auth modes) — 4-sidecar
#    triangulated. OAuthSecurityConfiguration explicit ADR + LDAPSecurityConfiguration
#    "S2S composable across modes" ADR + LoginFormSecurityConfiguration "additive S2S"
#    ADR + DisabledAuthSecurityConfiguration "S2S silently ignored under DISABLED".
#    The S2S filter is composable with each interactive mode rather than exclusive — and
#    when composed, X-API-Key requests grant ADMIN across the ENTIRE /** surface (not
#    just /ingestion/**). Surfaced in the Auth Mode + Ingestion Filter security_aggregate.
#
# 3) Lazy-create-no-drop replication artefacts — 2-sidecar triangulated.
#    ActivityTablePartitionManager partitions (batch B) + NotificationsProperties
#    replication slot + publication (batch C). Operator-cleanup is the stated policy.
#    Surfaced as a cross-cutting invariant.
#
# 4) Dead code in load-bearing positions — 2-sidecar triangulated.
#    AuthorizationManagerCondition (batch B, dead Condition class) +
#    NotificationsProperties.webhookUrl (batch C, dead top-level config field).
#    Surfaced as a cross-cutting invariant for future hygiene scans.
#
# 5) 202+queue+Postgres-advisory-lock single-sender pattern — 2-sidecar triangulated.
#    postMessageInSlack (batch A, DataCollaborationMessageSenderJob) + NotificationsProperties
#    (batch C, leader-elected WAL consumer at advisory-lock-id=100). Established
#    concurrency convention; surfaced as a cross-cutting invariant.
#
# 6) Legacy-vs-canonical doc-path drift — 2-sidecar triangulated.
#    DataCollaboration (batch A, active-platform-features/data-collaboration 404 vs
#    features/active-platform-features/data-collaboration 200) + Notifications (batch C,
#    active-platform-features/notifications 404 vs features/active-platform-features/notifications
#    200). Same GitBook IA drift class; surfaced as a cross-cutting invariant for doc-gap-finder.

