- pillar: P-01
  kind: shares_data_with
  via: |-
    The DEG (Data Entity Group) primitive lives in P-01 Data Discovery
    (the DEG is a first-class Data Entity with class DATA_ENTITY_GROUP).
    DEG membership writes flow through batch-L F-012 (DEG Membership
    feature); this endpoint READS that membership graph to compute the
    inter-member lineage view. The DEG itself is also a Data Entity
    surfaced via Discovery search/directory. The read-collaborative
    posture exposed here amplifies P-01's read-collaborative posture into
    the lineage layer — co-membership in a DEG produces a wider blast
    radius than the per-entity lineage cross-owner leak (REFACTOR-203
    family).
description: |-
  The platform exposes a DEG-anchored lineage endpoint at
  `GET /api/dataentitygroups/{data_entity_group_id}/lineage` — a six-line
  pass-through (DataEntityController.java:275-281) that returns the
  lineage relationships AMONG the entities that belong to the named
  group. Per the live API-reference doc: "Returns the lineage graph for
  the group's children — i.e. the lineage relationships among the
  entities that belong to the given group. Use it to inspect what a
  group aggregates without first expanding each member entity through
  the per-entity endpoints above."

  The user-observable promise (per the live API-reference + the live
  Data Lineage feature page): operators with access to a DEG can open
  the Group Lineage tab on the DEG detail page to see the lineage union
  across its child entities.

  The user-observable reality, per primary-source code-walk of
  getDataEntityGroupsLineage controller-method + LineageServiceImpl +
  ReactiveGroupEntityRelationRepositoryImpl:

  (1) **Co-membership leakage — wider blast radius than REFACTOR-203
  per-entity** — the endpoint has NO @PreAuthorize, NO entry in
  `SecurityConstants.SECURITY_RULES` for the path (verified by Grep
  `dataentitygroups.*lineage` against SecurityConstants.java — zero
  matches), and falls through to AuthorizationCustomizer's catch-all
  `.pathMatchers("/**").authenticated()` at lines 29-30. The service
  performs no `fetchAssociatedOwner()` call (verified
  `LineageServiceImpl.java:54-57` has no AuthIdentityProvider field).
  An authenticated user who knows a DEG ID can read the full
  inter-member lineage graph for that DEG regardless of owner relationship
  to the DEG itself OR to any of its members. The blast radius is
  STRICTLY WIDER than per-entity REFACTOR-203 because a DEG-member can
  share members with multiple owners — by enumerating DEG IDs, a caller
  enumerates the cross-owner co-membership graph of the entire catalogue.

  (2) **Inner-DEG suppression — undocumented carve-out** —
  `LineageServiceImpl.java:71-75` filters edges where either endpoint
  is a DEG and removes DEG-typed metadata entries from the response
  dictionary. The comment at line 71 reads `// Remove this when we will
  support inner DEGs for DEG lineage` — an explicit deferred-feature
  marker. Live API-reference + feature pages do NOT disclose this carve-out;
  a third-party caller against a DEG containing nested DEGs silently
  observes the nested DEGs missing from the response.

  (3) **404 conflation — three conditions, one error** — `LineageServiceImpl.java:62`
  raises `NotFoundException("Data entity group", dataEntityGroupId)` via
  `.switchIfEmpty(...)` when the member-resolution Flux is empty. Three
  semantically different conditions trigger this single 404: (a) the DEG
  ID does not exist; (b) the DEG exists but has zero members; (c) the
  path parameter is a Data Entity that exists but is NOT a DEG (the SQL
  CTE returns empty for any ID that doesn't have group_entity_relations
  rows). Operators debugging "why is my call returning 404?" have no
  way to discriminate.

  (4) **Bidirectional edge filter loses external lineage** —
  `ReactiveLineageRepositoryImpl.getLineageRelations(List<String>)` at
  lines 112-119 filters `LINEAGE.PARENT_ODDRN.in(oddrns).and(LINEAGE.CHILD_ODDRN.in(oddrns))`
  — only edges where BOTH endpoints are in the DEG's member set appear.
  Edges exiting the DEG (member -> non-member) and edges entering the
  DEG (non-member -> member) are dropped. For a "what does this DEG
  consume?" operator question, this is the wrong shape — but the docs
  don't say which question the endpoint answers.

  Substrate-named regression cases flow through this endpoint with
  zero test feedback at any layer (HTTP / service / repository — Grep
  verified zero matches for `getDataEntityGroupsLineage|getDataEntityGroupLineage`
  in `<odd-platform>/odd-platform-api/src/test`).
facets_summary: |-
  10 substantive drifts: co-membership leakage (DEG-internal lineage
  graph cross-owner — wider blast than per-entity REFACTOR-203 because
  a DEG can have many cross-owner members) + inner-DEG suppression
  undocumented carve-out (the explicit deferred-feature comment is
  silent in docs) + 404 conflation across 3 semantically distinct
  conditions (DEG-not-found / empty-DEG / non-DEG-typed-ID) + bidirectional
  IN-clause edge filter silently drops external edges (operator-surprising)
  + JVM-stack recursion unbounded for wide connected components +
  non-transactional metadata fetch race (hard-delete window between
  member-resolution and metadata fetch) + per-connected-component
  partitioning is the response shape (undocumented) + bounded-member-set
  optimisation chooses simpler edge-fetch over recursive CTE (intentional
  asymmetry with per-entity lineage that callers may not realise) + zero
  test coverage at any layer + Data Lineage + API-reference docs silent
  on read-collaborative posture.
