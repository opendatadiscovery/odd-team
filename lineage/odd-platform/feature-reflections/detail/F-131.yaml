- id: H-001
  hypothesis: "When a user clicks 'Add query example' with the Definition field empty (or whitespace-only), the dialog refuses to submit and the create request is never sent."
  derivation: "Both Controllers carry `rules={{ required: true, validate: value => !!value.trim() }}` and the submit button is `disabled={!formState.isValid}` with `mode: 'onChange'` live validation (QueryExampleForm.tsx:83, 94, 124, 45)."
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |
      The form's submit button is disabled whenever `formState.isValid` is false, and validity
      requires BOTH `definition` and `query` to pass `required: true` AND `value => !!value.trim()`.
      A whitespace-only entry trims to empty and fails the validator, so the button stays disabled
      and `handleSubmit(onSubmit)` never fires the mutation. The client-side gate is real and
      enforced before any network call.
    evidence:
      - sidecar: "(source_read_for_validation) QueryExampleForm.tsx"
        section: formContent + actionButton
        cite: "QueryExampleForm.tsx:83,94,124"
        note: "presence+trim rules on both fields; disabled={!formState.isValid} on the submit button"
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    source_read_for_validation: true

