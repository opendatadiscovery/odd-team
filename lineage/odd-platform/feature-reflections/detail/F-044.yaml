- id: H-002
  hypothesis: |-
    When an entity is flipped to DELETED (by the scheduler OR by a manual PUT), it
    is permanently hard-deleted after the 30-day retention window
    (housekeeping.ttl.data_entity_delete_days), reclaiming storage and removing
    every cascading row — i.e. the documented two-stage retirement actually
    completes stage two.
  derivation: |-
    Pillar mission ("soft-delete TTL") + the live doc's verbatim 30-day-then-
    hard-delete promise + the existence of housekeeping.ttl.data_entity_delete_days
    as a tunable retention knob.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The hard-delete NEVER fires for any entity transitioned through this
      feature. DataEntityMapperImpl.applyStatus executes `pojo.setStatus(
      statusDto.getId())` BEFORE the change-detection guard `if (statusDto.getId()
      != pojo.getStatus())`. At the guard, pojo.getStatus() already equals the
      just-written value, so the condition is ALWAYS false and
      `pojo.setStatusUpdatedAt(...)` is unreachable. Every status transition leaves
      status_updated_at NULL. The housekeeping reaper selects `WHERE STATUS =
      DELETED AND STATUS_UPDATED_AT.lessOrEqual(now - dataEntityDeleteDays)`. In SQL
      three-valued logic, NULL <= cutoff evaluates to NULL (not TRUE), so every
      NULL-timestamp row is silently excluded from the delete set. The soft-delete
      is permanent; stage two never runs. This is now a PINNED known bug:
      DataEntityStatusKnownBugTest.applyStatusMutatesBeforeChangeGuard_knownBug_PLT027
      asserts setStatus's index < guard's index — GREEN while the bug exists, RED
      when the order is fixed (LSN-029 characterization pin, @pins PLT-027).
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: bugs_limitations_corner_cases.[0]
        cite: "DataEntityMapperImpl.java:242-253 + DataEntityHousekeepingJob.java:73-82"
        note: "the sidecar pins the ordering bug + the NULL-exclusion mechanism as HIGH severity"
      - sidecar: odd-platform__java__housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: dependencies_semantic.requires-feature + concepts.invariants
        cite: "DataEntityHousekeepingJob.java:71-80 (TTL query keyed on STATUS_UPDATED_AT)"
        note: "the TTL surface depends on STATUS_UPDATED_AT being maintained; this feature never maintains it"
      - sidecar: source_read_for_validation
        section: DataEntityStatusKnownBugTest (the pin)
        cite: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/mapper/DataEntityStatusKnownBugTest.java:38-54"
        note: "characterization pin of the ordering bug; GREEN=bug present. The CORRECT behaviour (status_updated_at set) is NOT tested"
    operator_visible_failure: |-
      (1) Storage never reclaimed: `SELECT count(*) FROM data_entity WHERE status
      = 'DELETED'` grows monotonically and never drops; the table and its cascading
      child tables grow unbounded. (2) Compliance violation: an operator under a
      "delete records 30 days after retire" policy who trusts the doc silently
      violates it. (3) Skewed analytics: DELETED entities remain FK-referenced and
      counted in statistics rollups / Catalog Overview tile counts (zombie rows).
      (4) Re-ingestion hazard: re-creating an entity at a previously-DELETED oddrn
      hits FK paths that should have been cleared. The failure is invisible until
      the operator runs the count query by hand — no UI signal, no metric, no log.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional   # the flip-target test: assert status_updated_at IS set post-fix + the reaper then matches

