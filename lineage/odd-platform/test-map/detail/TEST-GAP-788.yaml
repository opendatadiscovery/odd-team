proposed_action: |-
  Add `NotificationConfigurationSmtpTimeoutsUnsetRegressionPinTest`. One test method using Testcontainers + a slow-responder TCP server:

  1. `javaMailSender_underHungSmtpRelay_blocksUntilJvmTestTimeout_pinsInfiniteTimeoutDefault` — Testcontainers `GenericContainer` exposing TCP 25 with a slow-responder shell command; `@SpringBootTest(properties = { "notifications.enabled=true", "notifications.receivers.email.host=<container-ip>", "notifications.receivers.email.port=25", ... })`; trigger an alert; assert that the JavaMail send call blocks longer than 10s before the JUnit @Timeout(value=15, unit=SECONDS) fires (the test PASSES if blocking detected, FAILS if not — pinning the timeout-unset surface).

  Add a `// COMPOUND-RISK-PIN — SMTP timeouts unset means a hung relay blocks the single-threaded notification subscriber, stalling ALL channels (slack + webhook + email). This test pins the current behaviour until REFACTOR-NNN adds explicit timeout properties.` comment block.

  Pair with: (a) REFACTOR-NNN — three lines at NotificationConfiguration.java:61-69 setting connectiontimeout/read-timeout/write-timeout to e.g. 5000ms each, configurable via `notifications.receivers.email.timeout.{connect,read,write}.ms` with sensible defaults; (b) test the COMPOSITE with TEST-GAP-775 (case-sensitivity) — the operator using uppercase SMTP currently has neither STARTTLS NOR timeouts.
