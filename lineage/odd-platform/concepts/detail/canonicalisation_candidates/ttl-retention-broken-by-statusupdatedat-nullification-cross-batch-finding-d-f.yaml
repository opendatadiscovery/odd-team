proposed_canonical: TTL retention broken by statusUpdatedAt nullification (cross-batch
  finding D + F)
rationale: 'NEW cross-batch invariant from batch 2026-05-12F. Load-bearing defect
  that emerges only when batch D''s HousekeepingTTLProperties + batch F''s updateStatus
  are combined: the 30-day data-entity-delete retention TTL relies on `DATA_ENTITY.STATUS_UPDATED_AT`,
  which is NEVER bumped on status transition because of an ordering bug in `DataEntityMapperImpl.applyStatus`
  (sets the status BEFORE the prior-status check; condition is always false). The
  HousekeepingTTLProperties feature documentation says 30-day retention; the code
  does not deliver it. Second cross-batch invariant in the catalog (after ''Retention
  claim vs code drift'' which combined batches B + D). Trivial 3-line fix in DataEntityMapperImpl.applyStatus
  + regression test. HIGH-priority refactoring-scope item.'
contributing_concepts:
- DataEntityMapperImpl.applyStatus ordering bug (updateStatus batch F)
- HousekeepingTTLProperties.data_entity_delete_days TTL (batch D)
- DataEntityHousekeepingJob STATUS_UPDATED_AT predicate
suggested_add_to_docs: true
