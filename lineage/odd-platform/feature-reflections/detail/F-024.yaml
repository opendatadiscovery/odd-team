- id: H-005
  hypothesis: "When a user rapidly clicks several facet filters in a row, the UI coalesces them and sends ONE update to the server after the user stops clicking (the 1500ms debounce the code advertises) — not one network call per click."
  derivation: "Endpoint shape — TermSearch.tsx wraps updateTermSearch in useDebouncedCallback(...,1500,{leading:true}); a debounce promises rate-limiting."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The debouncer is wrapped in a useCallback whose deps include
      termSearchFacetParams, which changes on EVERY facet click — so each click
      constructs a NEW useDebouncedCallback instance and the prior instance's pending
      trailing timer is garbage-collected before it can fire. With {leading:true} the
      new instance fires immediately on its first call. Net effect: every facet click
      dispatches updateTermSearch immediately; the 1500ms "debounce" rate-limits
      nothing (TermSearch.md bugs_limitations_corner_cases[2] + amplification_factor_
      provenance on the feature flow). The identical anti-pattern recurs at
      MultipleFilterItemAutocomplete.tsx:97-116 (the facet-OPTION autocomplete) per
      the F-024 batch-2026-05-26-ui-review-F entry.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__TermSearch.md
        section: bugs_limitations_corner_cases
        cite: "TermSearch.tsx:50-64"
        note: "useCallback deps include termSearchFacetParams -> debouncer rebuilt per click."
    operator_visible_failure: |
      A user doing the canonical faceted-exploration workflow — clicking through five
      facets in two seconds to narrow the catalog — fires five PUT /api/termsearch/
      {id} round-trips instead of the intended one. On a slow connection this shows up
      as five in-flight requests and laggy facet toggling; on a busy term catalog the
      server-side per-PUT facet recompute cost (updateFacets merges + re-counts) is
      multiplied across the click burst. No correctness loss (updateFacets merges the
      delta) but the rate-limit guarantee the operator's UX implies is silently absent.
    severity: MEDIUM
    confidence: HIGH
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional
    routes_to_finding: bug-candidate

