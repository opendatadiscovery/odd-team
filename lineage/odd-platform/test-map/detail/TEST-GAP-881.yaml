proposed_action: |-
  Add `ActivityHandlerMultiIdContractTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/activity/handler/` using JUnit 5 + Spring Context. Three test methods:

  1. **`getUpdatedStateMultiId_for14NonOverridingImpls_throwsUnsupportedOperationExceptionWithDocumentedMessage`** (HEADLINE):
     - Arrange: autowire `List<ActivityHandler> handlers` (16 + 2 = 18 impls); use reflection to enumerate the 16 that do NOT override `getUpdatedState(Map, List)`.
     - Act: for each non-overriding handler, call `handler.getUpdatedState(Map.of(), List.of(1L, 2L)).block()`
     - Assert: each call throws `UnsupportedOperationException` with the exact message `"getUpdatedState for multiple ids is not implemented yet for this handler"`. PIN the documented error message contract.

  2. **`getUpdatedStateMultiId_forDataEntityCreated_returnsMapping_pinHappyPathOverride`** (CONTROL):
     - Arrange: seed 3 data_entity rows; obtain `DataEntityCreatedActivityHandler` from context.
     - Act: `handler.getUpdatedState(Map.of(), List.of(id1, id2, id3)).block()`
     - Assert: returns `Map<Long, String>` with all 3 entries; PIN the multi-id override works.

  3. **`activityHandlerInterface_enumerateAllOverridesAtBootTime_pinContractMatrix`** (META):
     - Arrange: autowire `List<ActivityHandler>`; reflectively enumerate each impl × `getUpdatedState(Map, List).getDeclaringClass()`.
     - Act: for each (eventType, impl) pair via `handler.isHandle(eventType)`, log whether the impl overrides the multi-id path.
     - Assert: the matrix has EXACTLY 2 overrides (DataEntityCreated + DataEntityStatusUpdated). If a future PR adds another override OR removes one, this test FAILS — surfacing the contract change as a coordinated decision.

  Cross-pair with REFACTOR-NNN to introduce type-level enforcement (split interface) OR boot-time validation. The test then becomes the regression-pin for either approach.
