name: LSN-017 useEffect dep-array doubling anti-pattern ABSENT in Management list components (positive — verified across PolicyList + RolesList + OwnersList + CollectorsList)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  **NEW POSITIVE INVARIANT, batch 2026-05-20-Q (PolicyList + RolesList
  + OwnersList + CollectorsList primary sources — 4-component
  refutation)**. The LSN-017 anti-pattern (useEffect dep-array
  including a fetch-result-derived value, causing call-doubling on
  every fetch response) is verified ABSENT in the four Management
  list components scanned in batch Q. This is a positive
  cross-component finding: the pattern that bit `DataEntityDetails`
  (the original LSN-017 case-law site) is NOT generalised across the
  codebase — at least the Management UI surface is structurally safe.

  **The LSN-017 anti-pattern**: `useEffect(() => { fetch(); }, [x])`
  where `x` is DERIVED from the fetch's response. Each fetch updates
  `x` → effect re-fires → another fetch → another update → unbounded
  (or doubled-per-render) calls. The case-law site is
  `DataEntityDetails.tsx:56-64` where `details.status?.status` was both
  fetched-by-the-effect and IN the deps array — verified at
  `f-005-ui-realisation-point-anchor-set-defence-not-used-by-canvas`
  invariant.

  **The four refutations** (per the 4 batch-Q list-component sidecars'
  coherence_check sections):

    1. **PolicyList** (PolicyList.tsx:39-66): `useEffect(() => { if
       (!query) dispatch(fetchPolicyList({page:1, size})); },
       [fetchPolicyList, query])`. `fetchPolicyList` is a stable
       module-level thunk reference. `query` is local state (set by
       the user, NOT by the fetch response). Refutes LSN-017 — one
       fetch per page-open under normal usage. PolicyList sidecar's
       `coherence_check` section pins this with the explicit verdict
       "Refutes — verified by reading PolicyList.tsx:39-66 end-to-end".

    2. **RolesList** (RolesList.tsx:40-42): same structural shape
       `useEffect(() => { if (!query) dispatch(fetchRolesList({page:
       1, size: 100})) }, [fetchRolesList, query])`. `fetchRolesList`
       is stable; `query` is local state. Refutes LSN-017 — RolesList
       sidecar's `coherence_check` ANSWER on critical question (d)
       explicitly states "NO. The useEffect at RolesList.tsx:40-42 has
       deps [fetchRolesList, query], BUT the dispatch is GUARDED by
       if (!query). The fetchRolesList reference is stable so the
       effect's dep change is driven only by query."

    3. **OwnersList** (OwnersList.tsx:44-46): dep array
       `[isOwnerCreating, isOwnerDeleting, query]`. The two
       mutation-status flags AND the local query state — NONE are
       derived from the fetchOwnersList response (`{ items, pageInfo
       }` per `owners.thunks.ts:34-44`). OwnersList sidecar's
       `bugs_limitations_corner_cases.[0]` explicitly states "The
       LSN-017 useEffect dep-array pattern does NOT apply: the deps
       here are primitive booleans (isOwnerCreating, isOwnerDeleting)
       and a primitive string (query); these are not produced by the
       fetch response, so the LSN-017 multiplier shape is absent."

    4. **CollectorsList** (CollectorsList.tsx:44-46): dep array
       `[isCollectorDeleting, query, size]`. `isCollectorDeleting`
       is the mutation-status flag; `size` is a hardcoded constant
       (`const size = 30`); `query` is local state. CollectorsList
       sidecar's `bugs_limitations_corner_cases.[10]` ("N/A severity —
       NEGATIVE finding") explicitly states "no dependency on
       collectorsList, pageInfo.page, pageInfo.total, total in the
       effect at :44-46". The neighbouring effect at :48-50 (`if
       (!query) setTotalCollectors(total)`) DOES depend on `total`
       (a fetch result), but it only calls `setTotalCollectors` (a
       setter that doesn't dispatch another fetch), so no amplification
       loop exists.

  **The shared safe pattern across all four components**:
    - Mount-effect dep array contains primitives (booleans, strings,
      stable thunk references) — never fetch-response-derived values.
    - The "search-clear refetch" guard (`if (!query)`) inside the
      effect body further protects against incidental re-fires.
    - Mutation-status flags (`isXCreating`, `isXDeleting`) are
      derived from the slice's loading state — they FLIP at most
      twice per mutation (true → false), not on every response.

  **Why this matters**: a maintainer reviewing one of these
  components and seeing `[fetchXList, query]` as the dep array may
  assume LSN-017 applies (because `fetchXList` "looks like" it could
  be a fetch-result reference). The refutation is structural — the
  thunk reference is module-level constant, not slice state. This
  invariant documents the safe pattern explicitly so future scans
  do NOT re-discover LSN-017 in these components.

  **Cross-batch coherence (LSN-018)**: this sidecar STRENGTHENS the
  LSN-017 retrospective (`retrospectives/LSN-017-*.md`) by adding
  4 SAFE-pattern reference points. The retrospective is per-node-scan
  cross-layer effects; the Management list components are the
  positive counterexample to the DataEntityDetails-LSN-017 anti-
  pattern.
