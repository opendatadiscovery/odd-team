name: |-
  AppInfoMenu opens on hover only; ARIA attributes claim keyboard support that does not exist (WCAG 2.1 SC 2.1.1 violation)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW MEDIUM-severity ACCESSIBILITY INVARIANT, batch ZJ (2026-05-26) —
  the AppInfoMenu widget opens its 5-surface popup on `onMouseEnter`
  ONLY (AppInfoMenu.tsx:81). There is NO `onClick`, NO `onKeyDown`,
  NO `onFocus`, NO touch-event handler. The ARIA attributes on the
  trigger button claim keyboard support that does not exist:

    - `aria-haspopup='true'` (line 80)
    - `aria-controls={menuId}` (line 79)

  These attributes signal to assistive technology (screen readers,
  keyboard navigation) that the button opens a menu and that the
  menu is identified by `menuId`. AT users press Enter or Space to
  activate the trigger — but no Enter/Space handler is wired, so
  nothing happens. The widget is keyboard-inaccessible.

  **Touch-device users are also locked out**. iOS Safari and
  Android Chrome do not generate `mouseenter` events on touch.
  Tablet and phone users cannot reach the App Info menu's 5
  surfaces (Documentation / Slack / Project Version / Leave a
  feedback / operator-configured links).

  **The widget contains operator-critical information** —
  projectVersion (for bug reports), GitHub link (for issue
  filing), Slack link (for community support), operator-configured
  links (for runbooks, wikis). Locking AT users and touch-device
  users out of this surface excludes them from those affordances.

  **WCAG 2.1 SC 2.1.1 (Keyboard) violation** — the success
  criterion requires that 'all functionality of the content is
  operable through a keyboard interface'. The App Info menu's
  functionality is NOT operable through keyboard.

  **The fix is minimal**:

    (a) Add `onClick={handleAppMenuOpen}` to the button
        (line 78-82). One line.

    (b) OR add `onClick` + `onKeyDown` handlers explicitly. ~3 lines.

    (c) MUI's IconButton component supports keyboard activation
        by default if the button receives focus and the
        `aria-haspopup` is paired with an onClick handler. The
        current widget uses only `onMouseEnter`, so the default
        MUI keyboard support is bypassed.

  **The ARIA claim is the worst part** — declaring
  `aria-haspopup='true'` without wiring keyboard activation is
  MORE damaging than declaring no ARIA at all. Screen readers
  announce 'this button opens a menu — press Enter to open' and
  then the activation fails silently. AT users have no way to
  diagnose why.

  **Cross-batch coherence**: this invariant is the accessibility
  sibling of the `additional-links-no-rel-noopener-and-no-url-
  validation` invariant. Both invariants ride on the same widget
  (AppInfoMenu); both are bounded by the 'this widget never
  received an accessibility review' framing.
