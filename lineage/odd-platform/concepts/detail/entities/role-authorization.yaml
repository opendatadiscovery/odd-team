name: Role (Authorization)
canonical_in_docs: true
canonical_candidate: false
description: |-
  A named bundle of Policy references that can be attached to an Owner
  (and through the user→owner mapping, to authenticated users) to grant
  authorization permissions. Two predefined roles seeded by V0_0_56:
  `Administrator` (all permissions on every resource type) and `User`
  (regular user with no permissions by default). Custom roles are
  created via `POST /api/roles` (gated by `ROLE_CREATE` NO_CONTEXT,
  SecurityConstants.java:169) and bound to Policies via `role_to_policy`.
  The platform's authoritative mapping from policy graphs to authenticated
  subjects. Canonical doc anchor:
  `configuration-and-deployment/enable-security/authorization/roles`
  (200, 2026-05-12).

  **STRENGTHENED BATCH N (2026-05-19N) — REPOSITORY-LAYER PRIMARY SOURCE
  NOW PINNED.** ReactiveRoleRepositoryImpl
  (`repository/reactive/repository/ReactiveRoleRepositoryImpl.java`,
  94 lines) adds exactly three custom methods that return the role-with-
  joined-policies view — `getDto(id)`, `listDto(page, size, nameQuery)`,
  `getByName(name)` — each issuing a `SELECT role.* + jsonArrayAgg(POLICY.*)`
  aggregated through `ROLE_TO_POLICY`. Standard CRUD is inherited from
  `ReactiveAbstractSoftDeleteCRUDRepository` (lines 28-29); soft-delete
  means `delete(id)` is an UPDATE setting `deleted_at = NOW()`, never a
  `DELETE FROM`, and every `get` / `list` is auto-scoped to
  `WHERE deleted_at IS NULL`. The three custom methods DO carry the
  soft-delete filter on the ROLE table — `addSoftDeleteFilter(ROLE.ID.eq(id))`
  at lines 47, `listCondition(nameQuery)` at line 56, and
  `addSoftDeleteFilter(ROLE.NAME.eq(name))` at line 89 — but NONE of
  them filter `POLICY.deleted_at IS NULL` on the joined policy table.

  **NEW HIGH-SEVERITY FINDING BATCH N**: the SYMMETRIC MIRROR of
  batch-H's ReactivePolicyRepositoryImpl.getRolesPolicies finding. Both
  repositories exhibit the SAME bug class — a soft-deleted Policy with
  surviving `role_to_policy` bindings shows up aggregated into the
  policy_relations JSON returned by getDto/listDto/getByName. Combined
  with no `ON DELETE CASCADE` on the role_to_policy FK
  (V0_0_55__add_policies_and_roles.sql:52), a UI screen rendering a
  Role's bound policies displays soft-deleted policy entries to operators
  with no indication that the policy is gone — AND the in-memory
  permission-extractor chain computes permissions FROM those
  soft-deleted policies' statements if the dto view is consumed
  transitively. The single-line fix is symmetric across BOTH
  repositories: `AND policy.deleted_at IS NULL` in the LEFT JOIN's
  ON-clause.

  The DB-side counterpart is a partial UNIQUE INDEX `role_name_unique
  ON role(name) WHERE deleted_at IS NULL`
  (`V0_0_55__add_policies_and_roles.sql:42`, recreated by
  `V0_0_58__rename_constraints.sql:3-9` then by
  `V0_0_64__remove_is_deleted_field.sql:88-90`) — the SQL-layer
  recreation-after-soft-delete invariant that the controller-layer
  `Administrator`-name asymmetry (batch E) depends on. **Batch N
  STRENGTHENS the Administrator-name-asymmetry finding**: the
  partial-unique-index design MAKES the create-side gap exploitable —
  if a direct DB UPDATE soft-deletes the seeded Administrator row
  (bypassing the service-layer protection on .delete), the index frees
  the name AND `RoleServiceImpl.create` succeeds with attacker-chosen
  policy bindings (DRIFT-FACET-C in the batch-N sidecar's
  bugs_limitations_corner_cases). The schema is correct; the gap is at
  the service create path.
