feature_name: Manual Object Tagging — operator + ingestion-driven Tag directory with side-channel mint paths
discovered_from_entry_point: rest:POST /api/dataentities/{id}/tags (UI tag-assign surface that side-channels into the global Tag directory)
description: |-
  Manual Object Tagging is the operator-facing capability listed in
  system-mission.md P-01's sub-feature seed as "Manual Object Tagging (3
  TAG_* permissions)". Users apply tags to data entities (and to dataset
  fields and terms) via the UI's tag-assign surfaces; collectors push tags
  with their ingested entities via the S2S ingestion pipeline. The Tag
  directory itself is a global, namespace-free vocabulary surfaced via
  `GET /api/tags/popular` (the Catalog Overview's popular-tags strip) and
  the tag-dropdown on every entity-detail page.

  The doc-anchored intent (live tagging.md page, WebFetched 2026-05-19
  status 200): three role-based permissions govern tag management —
  TAG_CREATE ("Create a new tag in the catalog vocabulary"), TAG_UPDATE
  ("Edit tag names or Important flag status"), TAG_DELETE ("Remove tags
  from vocabulary"). Additionally, TAG_ASSIGNMENT_UPDATED activity events
  track when tag assignments change on entities. The doc describes apply-flow
  as "opening an entity detail surface and selecting from existing
  vocabulary or creating new labels on the spot."

  The user-observable reality, per batch-N primary-source code-walk of
  ReactiveTagRepositoryImpl: any user with DATA_ENTITY_TAGS_UPDATE on a
  single data entity can mint NEW rows in the global `tag` directory by
  submitting novel tag names via `POST /api/dataentities/{id}/tags`;
  TagServiceImpl.getOrCreateTagsByName uses bulkCreate (no TAG_CREATE
  consultation). The same side-channel exists from TermServiceImpl.upsertTags
  (TermServiceImpl.java:257 — `tagService.getOrCreateTagsByName(names)`
  on TERM_UPDATE) and from the ingestion path
  (`ExternalTagIngestionRequestProcessor` → `tagService.getOrInjectTagByName`
  → repository.ingestData upsert). The repository is the persistence-tier
  substrate of three independent write paths into a global vocabulary.

  Multiple secondary drifts compound: TOCTOU between listByNames and
  bulkCreate creates a 500-error surface on concurrent novel-name submits;
  case-sensitive listByNames silently mints duplicate rows for case
  variants (`PII` vs `pii`); no tag-name validation enables DoS via
  pathological inputs; listMostPopular is globally-scoped (no per-owner /
  per-namespace filter); resurrection of soft-deleted tags loses all
  prior relations; the ingestion-side mutation path emits NO activity-feed
  entry while the UI-side path DOES (cross-channel audit asymmetry).
