notes: |-
  The decision to make ERD vs GRAPH a first-class URL-level
  distinction (vs a query-parameter discriminator) is captured
  in implicit_adrs[2]. The Category F drift would require a
  coordinated change to BOTH the SQL filter (relationships.id)
  AND the list-endpoint mapper (return relationships.id as `id`)
  — either half alone breaks the round-trip.
