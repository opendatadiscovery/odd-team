behaviour: 'ShedLock multi-instance race: two instances boot simultaneously, both
  attempt to run housekeeping at minute 0 — only one acquires the lock; the other
  no-ops (HousekeepingJobManager.java:26 `@SchedulerLock(name="housekeepingJob", lockAtLeastFor="14m",
  lockAtMostFor="14m")`). The 14-minute upper bound is dangerously close to the 15-minute
  schedule; a job running 14m 1s releases the lock prematurely. No multi-process test
  verifies the single-leader invariant.'
