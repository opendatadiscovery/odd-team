proposed_action: |-
  Testcontainers integration test. (1) Configure `auth.type=OAUTH2` + `auth.oauth2.client.github.provider=github` with a stub GitHub OAuth flow. (2) Authenticate user 'alice' via GitHub — first login. (3) Verify USER_OWNER_MAPPING row `(alice, github, owner=X)` is created (via Management UI or test bootstrap). (4) Simulate GitHub login rename: mock GitHub `/user` response to return `login: alice2` on the next login. (5) Re-authenticate via GitHub. (6) Assert: (a) AuthIdentityProviderImpl.fetchAssociatedOwner returns empty for (alice2, github); (b) `GET /api/dataentities/my` returns empty list; (c) the prior `(alice, github)` row is STILL in user_owner_mapping (orphaned); (d) NO warning log; NO header X-Identity-Orphaned. Pin the silent-data-loss; future fix introducing GitHub numeric id as the stable identifier flips this test.
