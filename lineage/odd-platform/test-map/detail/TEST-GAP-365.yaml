evidence:
- 'AlertServiceImpl.md says: ''The AlertManager webhook payload''s `entity_oddrn` label
  is trusted verbatim and never validated against the calling principal or the data-entity
  registry (severity HIGH)'''
- 'postAlerts.md says (bugs_limitations_corner_cases.[1]): ''The method delegates
  `req.getAlerts()` verbatim to AlertService.handleExternalAlerts. Downstream at
  AlertServiceImpl.java:178 the `entity_oddrn` label is mapped directly to `AlertPojo.dataEntityOddrn`
  with no check that (a) the entity_oddrn refers to an existing DataEntity row, (b)
  the calling principal (if any) is authorised to alert on it.'''
- 'AlertServiceImpl.java:178 verbatim: `setDataEntityOddrn(externalAlert.getLabels().get("entity_oddrn"))`
  — no validation'
- 'AlertManagerController.java:24 — verbatim delegation with no validation step'
