proposed_action: |-
  Add `DataQualityContentCategoryOrderingTest` under `odd-platform-ui/src/components/DataQuality/__tests__/`. Three pinning methods:
  (a) `categoryRowsRenderInAlphabeticalOrder_regardlessOfApiOrder`: mock `useGetDataQualityDashboard` to return a `DataQualityResults` whose `testResults` arrives in REVERSE alphabetical category order (e.g. Volume Anomalies first, Assertion Tests last). Render `<DataQualityContent>`. Assert the rendered category headings are in alphabetical order (Assertion Tests first, Volume Anomalies last). PINS the toSorted override of backend order.
  (b) `categoryRowsRenderStably_acrossRerenders`: render twice with the same prop reference; assert the rendered order is identical (no random shuffling).
  (c) `categoryRowsRenderInLocaleSafeOrder_withNonAsciiCategoryLabel`: mock with a non-ASCII category label (e.g. 'Çritical Tests'); render; assert the resulting order is deterministic against a specific locale. If the test runs in CI under a different locale than dev, the test will catch the missing locale arg (per DataQualityContent.md:bugs_limitations_corner_cases.[2]).

  Add a `// REGRESSION-PIN — DataQualityContent.tsx:75-77 — category rows are sorted client-side by localeCompare(category). The backend imposes no ORDER BY. If you switch to backend order, this test breaks AND documentation/docs/features/data-quality/dashboard.md must be updated to disclose the new ordering. If you add a non-ASCII category label, you must add a locale argument to localeCompare for cross-user stability.` block. Pair with DOC-GAP-NNN (state the ordering on the dashboard page).
