      Not a security finding — graceful-degradation gap at the routing
      layer.
  owner_scoping:
    verdict: N/A
    detail: ''
  strengths:
    - |-
      The downstream failure is bounded — the backend correctly rejects
      malformed UUIDs with 4xx (no crash, no exception leakage). The
      gap is at the UI's error-surfacing layer.
    - |-
      The 30-day TTL on `search_facets` IS finite — a stale bookmark
      eventually fails clearly (404 at the backend) rather than
      returning stale data.
  weaknesses:
    - |-
      The empty-catalog rendering is INDISTINGUISHABLE from "no
      matches" for an authentic search. Operators have no signal
      their URL is malformed.
    - |-
      The wildcard `/*` accepts garbage segments that aren't part of
      any nested route — invites future drift (a developer adding
      nested routes may not realise the wildcard already matched).
