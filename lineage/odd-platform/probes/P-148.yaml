expected_outcome: |
  Stress question (Category C — "latest" ordering; Category B — name vs
  behavior): getLatestDatasetVersion at ReactiveDatasetVersionRepositoryImpl
  line 161 picks the row with `max(DATASET_VERSION.VERSION)`. The version
  column is a manually-managed bigint, incremented +1 per re-ingestion (per
  DatasetStructureIngestionRequestProcessor.incrementDatasetVersion line 176).
  created_at is recorded but never used in the ORDER BY.

  Two scenarios this probe verifies:
    (a) baseline — latest is the row with highest `version`, which matches
        the row with most-recent created_at when ingestion is sequential
        (normal case);
    (b) drift case — if an operator manually backfills a higher version number
        on an OLDER row (e.g. via direct SQL fix-up, or via re-running an
        ingestion against a restored snapshot of the dataset_version table),
        the "latest" returned has an OLDER created_at than another existing
        row. The endpoint returns the higher-version row, not the
        latest-by-time row. The UI label "Latest" is then misleading.

  Operator-visible consequence: the "Latest" terminology in the doc page
  ("Get latest version's DataSet structure information") and the UI flow
  (`fetchDataSetStructureLatest` on the Structure tab) implicitly assume
  version-number monotonicity == time-monotonicity. ODD's normal ingestion
  guarantees this; ad-hoc admin SQL or replay scenarios do not.
