behaviour: |-
  **RBAC Role.getDto missing policy.deleted_at filter — SYMMETRIC mirror of batch-H Policy finding (TEST-GAP-345).** getDto/listDto/getByName do NOT filter soft-deleted POLICIES on the LEFT JOIN. The SQL at ReactiveRoleRepositoryImpl.java:45-48, 67-70, 87-90 joins `policy` without `policy.deleted_at IS NULL` predicate, so a soft-deleted policy with surviving `role_to_policy` edges shows up in the aggregated `policy_relations` JSON returned to the caller. Combined with the absence of a cascade between `policy.deleted_at` and `role_to_policy` (V0_0_55__add_policies_and_roles.sql:52 — FK only on hard-delete), a UI screen rendering 'this Role's policies' will display soft-deleted entries to operators with no indication that the policy is gone. **Today PolicyServiceImpl.delete defends by raising CascadeDeleteException if `isPolicyAttachedToRole` returns true, but: (a) direct DB UPDATE setting `policy.deleted_at` bypasses the defence; (b) a future refactor weakening the cascade check would silently re-open the gap.** This is the structural mirror of batch-H Policy finding — both halves of the RBAC mutation surface have the same shape of asymmetry. CRITICAL via mirror — same gap, second confirming sidecar across both halves.
