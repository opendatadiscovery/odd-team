proposed_action: |-
  Add `SlackNotificationSenderMrkdwnInjectionRegressionPinTest`. Unit test stubbing `HttpClient.send(...)` to capture the outbound JSON body:

  1. `alertChunkDescriptionContainsAtChannel_reachesSlackPostBody_pinsMrkdwnInjectionVector` —
     - Build an `AlertNotificationMessage` with `alertChunks = [{ description: '@channel test message' }]`.
     - Stub `HttpClient.send(...)` to capture the outbound body.
     - Invoke `slackSender.send(message)`.
     - Assert the captured JSON body literally contains `@channel` (proves no escaping).
     - PINS the current injection vector.

  2. `alertChunkDescriptionContainsFakeLink_reachesSlackPostBody_pinsPhishingVector` —
     - Same setup; `description = 'Click here for help: <https://attacker.example/|safe-looking-text>'`.
     - Assert the captured body contains the `<https://attacker.example/|...>` mrkdwn link syntax verbatim.
     - PINS the phishing-via-fake-link vector.

  3. `alertChunkDescriptionContainsBoldMarkup_reachesSlackPostBody_pinsAuthoritySpoofing` —
     - Same setup; `description = '*CRITICAL OPERATOR-REQUIRED ACTION*'`.
     - Assert the body contains the asterisk-wrapped string verbatim.
     - PINS the authority-spoofing vector.

  4. `alertChunkDescriptionEscapedByMrkdwnUtils_renderedAsLiteral_confirmsFixDirection` — (UPDATE this test once REFACTOR-NNN adds the escape helper)
     - After REFACTOR-NNN: assert that `@channel` is escaped to `@channel` (or whatever escape strategy chosen) in the body.
     - CONFIRMS the fix's effectiveness.

  Pair with REFACTOR-NNN (MrkdwnUtils.escape) and DOC-GAP-NNN (live doc security caveat).

  Coherence note (LSN-018 Rule 6): This finding adds a 6th surface to F-004 (cross-pillar XSS / injection family). It does NOT contradict any prior F-004 finding — extends the family laterally to the outbound-Slack sink. NET-NEW finding.
