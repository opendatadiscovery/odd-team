  matrix + permission gap), P-161 (zero-timeout default).

  The HIGHEST-LEVERAGE probe candidates, all executable on the maintainer's
  local workstation (local docker-compose ODD platform + WireMock for the
  external LLM stub — NO cloud infrastructure):

  (a) auth-mode + permission gap pin (P-160) — boot probe stack with
      auth.type=LOGIN_FORM + create user-bob with default Role / no
      permissions / no owner association; POST /api/genai/ask with valid
      body; assert HTTP 200 with response body forwarded. Pins the
      any-authenticated-user finding end-to-end.

  (b) zero-timeout silent-misconfiguration pin (P-161) — set
      genai.enabled=true + genai.url=<wiremock-stub> + leave
      genai.request_timeout unset; POST /api/genai/ask; assert HTTP 500
      with body containing "Gen AI request take longer that 0 min" (note
      typo). Pins the LSN-002-class regional analogue.

  (c) prompt-injection forward pin (P-158) — POST with body containing
      a recognizable jailbreak-marker text; wiremock captures the outbound
      payload; assert the question is forwarded VERBATIM and no platform
      log captured the marker. Pins the no-filter + no-audit findings.

  (d) concurrency burst pin (P-159) — fire 100 concurrent POSTs with a
      slow wiremock that sleeps 90s + request_timeout=2min; assert
      requests 21+ produce a connection-acquire-timeout-class error
      message DISTINCT from the read-timeout-class friendly message,
      confirming the .onErrorResume narrow branch.

