    behaviour: |-
      CRITICAL — Destructive token-rotation BINARY-CUTOVER untested. After PUT
      /api/datasources/{id}/token, the OLD data-source token must start 401-ing POST
      /ingestion/entities and the NEW token must start authenticating — no two-valid
      and no zero-valid window. The single most operationally important uncovered
      behaviour on the node; the load-bearing operator + security contract of token
      rotation. Endpoint + service + repository + ingestion-filter integration all
      zero-coverage. Pinned by P-051.
    test_class: integration
    criticality: CRITICAL
    node_ids:
      - "odd-platform java DataSourceController controller-method:regenerateDataSourceToken"
    feature_id: F-008
    related_doc_gap_ids: [DOC-GAP-034]
    detail_path: detail/TEST-GAP-898.yaml

