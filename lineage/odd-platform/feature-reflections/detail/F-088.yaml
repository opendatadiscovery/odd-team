- id: H-008
  hypothesis: |
    When an attacker on the same low-latency network probes the X-API-Key
    endpoint with guessed tokens, the token comparison does not leak match-prefix
    length through response-timing — i.e. the secret is compared in constant time.
  derivation: |
    Negative-space + a platform-wide security-pattern seed — a senior security
    reviewer checks every secret comparison for constant-time discipline; the
    sibling IngestionDataEntitiesFilter has the same pattern (F-088 facet).
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      S2sTokenProvider.isValidToken does `s2sToken.equals(token)`
      (S2sTokenProvider.java:20) — Java String.equals short-circuits on the first
      unequal char, so comparison time correlates with the matching-prefix length.
      There is NO MessageDigest.isEqual / constant-time comparator (F-088 facet
      token_not_constant_time_compared_timing_oracle_low_severity). On a realistic
      deployment topology (network jitter >> per-char timing delta) this is
      LOW-severity, but the pattern is platform-wide (shared with the ingestion
      filter) so it is worth a single shared fix.
    evidence:
      - sidecar: "(source_read_for_validation)"
        section: "Rule-8 confirmation read"
        cite: "S2sTokenProvider.java:20"
        note: "s2sToken.equals(token) — non-constant-time; no MessageDigest.isEqual."
    source_read_for_validation: true
    operator_visible_failure: |
      (a) On a low-latency / co-located network (an attacker container in the same
          cluster), repeated timing measurements could in principle narrow the
          token character-by-character — a theoretical secret-recovery path with no
          rate-limit or lockout to slow it (there is none on this filter).
      (b) The risk compounds with token-singleton-no-rotation (H-009): a recovered
          token cannot be quietly revoked — rotation needs a platform restart.
    severity: LOW
    confidence: HIGH
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional
    routes_to_finding: caveat-candidate

- id: H-009
  hypothesis: |
    When an operator needs to rotate the S2S secret (routine hygiene, or an
    incident response after a suspected leak), they can do so without downtime and
    can issue distinct per-caller tokens so a single leak does not compromise
    every automation.
  derivation: |
    Pillar-mission (operator credential lifecycle) + negative-space — a senior
    operator of a security credential expects rotation-without-downtime and
    per-caller scoping as table stakes for incident response.
  seed_source: pillar-mission + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      auth.s2s.token is a SINGLE static string read once via
      @Value("${auth.s2s.token:#{null}}") at startup (S2sTokenProvider.java:10);
      isValidToken compares against that one value (:20). There is no per-caller
      token, no token list, no scope, no expiry, and no live-reload — rotating
      requires editing the config and RESTARTING the platform (F-088 facet
      token_singleton_no_rotation_no_per_caller_no_audit_trail; the live docs
      confirm "Rotating it requires restarting the platform"). Every automation
      consumer shares the one secret.
    evidence:
      - sidecar: "(source_read_for_validation)"
        section: "Rule-8 confirmation read"
        cite: "S2sTokenProvider.java:10,15-21"
        note: "Single @Value-bound static string; equality compare; no list/scope/expiry/reload."
    operator_visible_failure: |
      (a) After a suspected leak, the operator must (i) generate a new token, (ii)
          update EVERY automation consumer that holds the old one, and (iii)
          restart the platform — a coordinated-downtime event, during which the old
          token still works until the restart lands.
      (b) Because the token is shared, the operator cannot revoke ONE compromised
          caller without breaking all of them; per-caller-tier rotation (which the
          docs suggest as a practice) is not enforceable by the platform.
    severity: MEDIUM
    confidence: HIGH
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional
    routes_to_finding: caveat-candidate

- id: H-010
  hypothesis: |
    When an S2S key performs a mutation (creates a policy, edits an entity, deletes
    an owner), the platform records WHICH automation / caller did it and when — so
    an operator auditing "what did my machine accounts change" has a trail.
  derivation: |
    Pillar-mission (audit posture, P-09) + negative-space — a senior operator
    expects privileged machine actions to be attributable; an unattributed admin
    credential is an audit blind spot.
  seed_source: pillar-mission + negative-space
  validation:
    verdict: partial
    actual_behavior: |
      Every S2S caller is the SAME principal `ADMIN` (S2sAuthenticationFilter.java:31)
      — there is no per-caller identity to attribute to, so even where an action is
      audited it is recorded as 'ADMIN' with no way to distinguish caller A from
      caller B (F-088 facet token_singleton..._no_audit_trail). PARTIAL because
      ODD's audit story is itself 2-tier (per concepts.yaml + F-006/F-011): DataEntity
      MUTATIONS do emit activity events (attributed to the actor string 'ADMIN'),
      but RBAC mutations (policy/role/owner create/edit/delete) emit NO audit log at
      all (F-006 headline) — so an S2S key creating a Policy is recorded NOWHERE,
      while an S2S key editing an entity is recorded as the undifferentiated 'ADMIN'.
    evidence:
      - sidecar: "(unresolved — F-088.yaml facet + F-006 audit-silence + F-011)"
        section: "observed_vs_expected.facets[5]"
        cite: "S2sAuthenticationFilter.java:31 (single 'ADMIN' actor) + F-006 (RBAC audit silence)"
        note: "No per-caller identity; RBAC mutations unaudited; entity mutations attributed to undifferentiated 'ADMIN'."
    operator_visible_failure: |
      (a) An operator auditing machine activity cannot tell which automation made a
          change — every S2S action is 'ADMIN'. After a leak, forensics cannot
          attribute the attacker's actions to a specific stolen caller.
      (b) For the highest-privilege actions (RBAC mutations) there is no record at
          ALL — an S2S key that grants itself a root policy leaves no audit trace
          (the F-006 schema+enum gap; not fixable by attribution alone).
    severity: MEDIUM
    confidence: HIGH
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    routes_to_finding: caveat-candidate

- id: H-011
  hypothesis: |
