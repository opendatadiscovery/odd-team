    feature_id: F-021
    detail_path: detail/TEST-GAP-881.yaml

  - gap_id: TEST-GAP-882
    behaviour: |
      **HIGH — CROSS-CUTTING META: the ENTIRE Activity Feed feature (P-07:F-003) has ZERO direct
