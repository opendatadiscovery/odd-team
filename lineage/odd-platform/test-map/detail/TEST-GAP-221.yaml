proposed_action: Add a parameterised `RBACMutationAuditTrailTest` covering create/update/delete
  on Role / Policy / Owner. Assert current behaviour (zero log lines, zero events,
  zero audit-table inserts). Once the maintainer adds @Slf4j or @ActivityLog, flip
  assertions to expect the log emission. Locks the audit-trail invariant against silent
  removal AND drives the audit-log addition as a deliberate test update.
