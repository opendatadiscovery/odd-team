description: |-
  NEW ENTITY, batch 2026-05-20U — surfaced by the TermDetails sidecar
  in batch U as the third user-curated Markdown surface on the platform
  (after data-entity internal_description and dataset-field
  internal_description). The Term backend stores TermFormData.definition
  verbatim in the term.definition column with no Jsoup.clean, no
  Encode.html, no allowlist, no length cap; the UI renders via the
  platform's shared Markdown.tsx wrapper which uses rehype-raw without
  rehype-sanitize — the same F-004 fingerprint as the two prior
  surfaces.

  CHAIN END-TO-END:
    Write path: TermFormData.definition → TermServiceImpl.createTerm /
                updateTerm (TermServiceImpl.java:99-145) → ReactiveTermRepositoryImpl
                .create / .update → term.definition column (PostgreSQL TEXT).
                NO sanitisation at any layer.
    Read path: ReactiveTermRepositoryImpl.getTermDetailsDto (lines 194-238) →
               TermDetails Redux store → Overview.tsx:39-44 →
               TermDefinition.tsx:16-47 → Markdown.tsx:113-124 →
               MDEditor.Markdown from @uiw/react-md-editor with
               rehype-raw bundled at pnpm-lock.yaml:3900,5922,8843 +
               NO rehype-sanitize anywhere (Grep-verified zero matches).

  THE ENTITY'S DISTINCTIVE PROPERTIES:
    - Operator-curated (authored by users with TERM_UPDATE on the term).
    - Read-collaborative (every authenticated user reads every term's
      definition regardless of namespace, owner, or permission set —
      per the read-collaborative-cross-owner-enumeration master invariant
      + the F-002 cross-namespace pollution drift facet).
    - Markdown-rendered with rehype-raw — XSS surface.
    - Used as the SOURCE for [[ns:term]] mention parsing via
      TermServiceImpl.findTermsInDescription (line 67) — the same
      regex consumes the unsanitised body.
    - Persisted verbatim into the term_search_entrypoint.term_vector
      tsvector column on every write (FTS materialisation via
      ReactiveTermSearchEntrypointRepositoryImpl.updateTermVectors).

  THE COMPOUND XSS CHAIN:
    The definition payload reaches viewers via THREE distinct paths:
      (a) Direct view — landing on /terms/term_id/overview renders
          TermDefinition.tsx → Markdown.tsx.
      (b) Mention staging — a payload like open-bracket-open-bracket-script-tag-payload-close-script-tag-colon-foo-close-bracket-close-bracket
          parses cleanly via the regex char class excluded-colon-star-eager
          and persists in data_entity_description_unhandled_term + analogous
          staging rows; the staging-row content is RETURNED by subsequent
          getDataEntityTerms calls.
      (c) FTS index — the tokenised tsvector is inert in storage, but
          the FTS write surface inherits ANY future fix scope choices
          (per the REFACTOR-229 WRITE-vs-READ disambiguation invariant).

  Three propagation paths from one writer to many readers across
  potentially different namespaces; the read-collaborative posture
  means the impact set is the entire authenticated-user population.

  SEVERITY HIGH — same as the master F-004 invariant; this entity
  records the term-side surface explicitly so the F-004 3-surface
  closure is visible at the entity layer of the concept catalog.
