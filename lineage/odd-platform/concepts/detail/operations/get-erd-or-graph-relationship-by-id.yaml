name: Get ERD or Graph Relationship By Id (detail endpoints)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-02
description: |-
  NEW OPERATION, batch ZE — TWO endpoints implementing the URL-level
  type distinction:
    - GET /api/relationships/erd/{relationship_id} →
      getERDRelationshipById
    - GET /api/relationships/graph/{relationship_id} →
      getGraphRelationshipById
  Both return DataEntityRelationshipDetails (allOf
  DataEntityRelationship + ERDRelationshipDetails OR
  GraphRelationshipDetails). HTTP 404 via NotFoundException on miss.

  IMPLEMENTATION: RelationshipController.java:29-43 →
  RelationshipsServiceImpl.java:38-49 → ReactiveRelationshipsRepository
  .getRelationshipByIdAndType (the two service methods hardcode
  RelationshipsType.ERD / GRAPH respectively; the type goes into
  the SQL WHERE at line 178). Same SQL site for both paths.

  CATEGORY F DRIFT — the `relationship_id` path parameter NAME
  promises the relationships-table primary key; the SQL at
  ReactiveRelationshipsRepositoryImpl.java:194 filters by
  `relationshipsDataEntity.field(DATA_ENTITY.ID).eq(relationshipId)`
  — the data_entity.id, NOT relationships.id. The list endpoint
  also returns id = data_entity.id (RelationshipMapper.java:53)
  so the UI round-trip is self-consistent; a third-party API
  consumer reading the OpenAPI spec literally and supplying
  relationships.id gets a 404. Pinned by P-128.

  Cross-link: invariant:relationship-id-name-vs-data-entity-id-translates-silently
  is the canonical write-up of the drift; this operation is the
  controller-tier surface.

  Type-mismatch negative — calling /erd/{data_entity_id} on a
  GRAPH-type relationship row returns 404 (the SQL WHERE
  additionally filters by relationship_type=ERD).
