- id: H-009
  hypothesis: |-
    When an operator deletes a DataSource successfully, its connection token is
    invalidated / removed so a stale credential is not left behind.
  derivation: |-
    A DataSource owns a connection token (a secret); deleting the source should
    not leave a usable/stale secret at rest.
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      The soft-delete sets only data_source.deleted_at; it never touches the
      token row, and the token table has NO deleted_at column (V0_0_28:1-9) so it
      cannot even be soft-deleted. No code path GCs orphan tokens. Each
      register-then-delete cycle leaks one token row — a 40-char plaintext token
      value persisting unreferenced (deleteDataSource.md:bugs[1] + security;
      tracked PLT-087).
    evidence:
      - sidecar: odd-platform__java__DataSourceController__controller-method__deleteDataSource.md
        section: security.known_security_gaps
        cite: "V0_0_28__add_token.sql:1-13 + ReactiveAbstractSoftDeleteCRUDRepository.java:106-110"
        note: "orphan plaintext token persists after delete; stale-secret-at-rest"
    operator_visible_failure: |-
      A DB-level reader of the token table sees credentials that no longer map to
      any live data source; the table grows without bound across register/delete
      cycles. An operator who deletes a source believing they revoked its access
      has actually left the token valid-shaped at rest. Deduped to PLT-087.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

- id: H-010
