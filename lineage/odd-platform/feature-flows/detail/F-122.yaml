discovered_from_entry_point: |-
  rest:GET /actuator/{env,health,prometheus,info} — Spring Boot Actuator
  exposed on the same HTTP port as the application. `/actuator/**` is in
  `SecurityConstants.WHITELIST_PATHS` (reachable BEFORE auth in every
  mode). `/actuator/env` enumerates every resolved property value
  including S3 / LDAP / OAuth2 / R2DBC / custom-datasource passwords.
