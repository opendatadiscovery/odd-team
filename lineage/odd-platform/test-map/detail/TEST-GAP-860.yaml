proposed_action: |-
  Add `TagServiceImplDeleteRelationsWithTermRaceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/` using Testcontainers + `@SpringBootTest`. Two test methods:

  1. **`deleteRelationsWithTerm_concurrentAdditionDuringRead_additionSurvives_pinsNonTransactionalReadThenWrite`** (HEADLINE):
     - Arrange: 1 term. Seed `tag_to_term` rows: `(tag-A, term)`, `(tag-B, term)`.
     - Act: launch a reactive pipeline `tagService.deleteRelationsWithTerm(term.id, Set.of("tag-A"))` (intent: keep ONLY tag-A). Use a Sinks.One + a controlled delay between the read step (line 126) and the write step (line 132) to interleave a CONCURRENT `tagService.createRelationsWithTerm(term.id, [tag-C])` between them (the test fixture can do this by injecting an artificial reactor delay or by spinning a second thread).
     - Assert: query `SELECT tag_id FROM tag_to_term WHERE term_id = ?`. Result: `[tag-A, tag-C]` (NOT just `[tag-A]`). The keep-only intent was VIOLATED by the concurrent addition. PIN: the non-transactional race window survives.

  2. **`deleteRelationsWithTerm_singleThreadedNoConcurrency_keepsOnlySpecifiedTags_pinsHappyPath`**:
     - Arrange: 1 term, 3 tag_to_term rows for tag-A, tag-B, tag-C.
     - Act: `tagService.deleteRelationsWithTerm(term.id, Set.of("tag-A")).block()`.
     - Assert: only `(tag-A, term)` remains. PIN: the happy path works as expected absent concurrency.

  After landing the test: pair with REFACTOR-NNN — make the explicit decision either (a) add `@ReactiveTransactional` AND serialise (then test #1 inverts to "addition is rejected"), OR (b) keep the current behavior AND document the design intent via a code comment + an ADR. The test forces the choice to be coordinated. Cross-pair with DOC-NNN: surface the race window on the Term Tag assignment doc page.
