security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      SecurityRule correctly wired; permission is DATA_ENTITY-scoped on
      dataEntityId; supports dataEntity:owner Policy scope. Path matches
      OpenAPI surface.
  owner_scoping:
    verdict: RESPECTS
    detail: |-
      Permission resource-scoped on dataEntityId via DataEntityPermissionExtractor.
      No global-list semantics.
  weaknesses:
    - |-
      MEDIUM — silent 200-on-missing-pair / missing-entity (operators can't
      verify writes)
    - |-
      MEDIUM — no type validation; EXTERNAL fields overrideable;
      `active=NULL` regression; NO audit log
    - HIGH under DISABLED — anonymous writes including EXTERNAL fields
    - LOW — spec/code drift (origin field silently dropped)
  strengths:
    - |-
      Three distinct permissions (CREATE / UPDATE / DELETE) — administrators
      grant edit independently
    - |-
      @ReactiveTransactional on the metadata-field lookup, value UPDATE,
      and FTS-vector refresh — atomicity guaranteed
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Per-row metadata UPDATE — composite PK (data_entity_id,
      metadata_field_id) provides O(log N) index lookup; one B-tree
      probe + one row update
    - |-
      FTS vector refresh — `updateMetadataVectors(dataEntityId)` reads
      ALL metadata for the entity to rebuild the tsvector; cost grows
      with metadata-row count
  weaknesses:
    - |-
      MEDIUM — FTS rebuild on every write; for entities with many
      metadata fields the cost is amplified per per-row edit
notes: |-
  NEW operation captured in batch 2026-05-19L. The endpoint surface is
  small (one-line controller, one-update repository) but the contract
  has SIX substantive defects + a spec drift — combined, the upsert
  path is the platform's least-defended write surface for catalog
  metadata.

  Cross-cutting connections:
    - Related entity: custom-metadata-field-value (NEW)
    - Related invariants:
      - silent-200-on-missing-pair-or-entity-on-upsert-family (NEW)
      - external-metadata-overwrite-silent-no-origin-check (NEW)
      - active-column-null-regression-on-metadata-update (NEW)
    - Cross-references "Upsert Internal Description (Markdown)"
      operation — same silent-200-on-missing pattern; this is the
      second instance in the upsert family
    - Cross-references "Operation name vs behaviour drift —
      create*-shaped operationId for replace-all semantic tag relations"
      — same class of OpenAPI-operationId-vs-implementation drift

  Four DOC-NNN candidates:
    (a) Fix or rename the upsert operation (UPDATE-only contract should
        match the operationId)
    (b) Document the EXTERNAL-overwrite semantics + the no-audit gap
    (c) Document the type-non-validation behaviour
    (d) Fix the active=NULL regression
