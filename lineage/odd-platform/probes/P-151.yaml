  - "if (r1_status == 500) then DOCUMENT_FINDING 'RUNNING-state-poisons-runs-history — operator sees blank page while test is in flight; this is a HIGH-severity silent-availability bug; fix: add @ValueMapping or filter status=RUNNING out at SQL layer'"
