feature_id: F-002
feature_name: Term linking with permission gate
discovered_from_entry_point: rest:POST /api/dataentities/{id}/terms
description: 'The platform exposes a term-linking endpoint at POST /api/dataentities/{id}/terms.

  The maintainer-documented intent is for DATA_ENTITY_ADD_TERM permission to

  gate this endpoint (per /authorization/permissions doc). The implementation

  registers the permission at the SINGULAR path `/api/dataentities/{id}/term`

  while OpenAPI exposes the PLURAL path `/api/dataentities/{id}/terms`. The

  AuthorizationCustomizer''s path-matcher never matches; the gate never fires.

  '
contributing_nodes:
- odd-platform java DataEntityController controller-method:addDataEntityTerm
- odd-platform java SecurityConstants (the SECURITY_RULES singular path declaration
  — line 237-242)
- odd-platform java AuthorizationCustomizer (the dispatch chain with .authenticated()
  fall-through)
terminal_side_effect:
  side_effect_class: db-write
  description: INSERT row into data_entity_to_term with is_description_link=false
  evidence: TermServiceImpl.linkTermWithDataEntity; ReactiveTermRelationsRepository
    INSERT
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: permission-gate enforcement under DISABLED
    observed: anonymous caller successfully creates term-link; data_entity_to_term
      row appears with no auth check
    expected: either documented anonymous-OK posture OR 401/403
    drift_class: auth_layer_hides_endpoint
    provenance: MEASURED — P-005 (run R-20260519T011344Z-P-005) created a term + POSTed
      the link as anonymous; observed final_term_count - initial_term_count == 1
