proposed_action: |-
  Add `ReferenceDataNoContextPermissionResolverTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `updateLookupTable_callerHoldsLOOKUP_TABLE_UPDATEViaOwnerA_canMutateTableLinkedToOwnerB_pinsNoContextScope` — seed two Owners (A and B); seed two Lookup Tables (one linked to A, one linked to B); authenticate as a user with `LOOKUP_TABLE_UPDATE` Policy attached to Owner A only; PUT `/api/referencedata/table/{B-linked-table-id}` with new form data; assert HTTP 200 (the mutation succeeds across owner-scope). PIN the current NO_CONTEXT behaviour.
  2. `updateTerm_callerHoldsTERM_UPDATEViaOwnerA_cannotMutateTermOwnedByOwnerB_pinsTermScopedContract` — sister test on the TERM surface to demonstrate the asymmetry: a TERM_UPDATE caller scoped to Owner A is REJECTED for a term owned by B (per TERM_RESOLVER). HTTP 403.
  3. `updateLookupTable_callerWithoutAnyLOOKUP_TABLE_UPDATEPolicy_returns403_pinsBaselineDeny` — pin the baseline: WITHOUT the permission, the endpoint returns 403.
  4. `updateLookupTableField_columnFromTableA_butUrlPathTableB_succeedsBypassingPathBinding_compoundWithNoContext` — pin the COMPOUND vulnerability with TEST-GAP-744: combine NO_CONTEXT permission grant + path-id-spoofing in URL; assert the mutation succeeds.

  Add a `// REGRESSION-PIN — LOOKUP_TABLE_* permissions are platform-global (NO_CONTEXT resolver), asymmetric with TERM/DATA_ENTITY/DEG owner-scoping in the same SecurityConstants table. A REFACTOR changing LOOKUP_TABLE_* to DATA_ENTITY resolver (looking up the lookup_table's parent DataEntity owner) will break test #1 (now 403) and align with the platform asymmetric scoping model.` comment block.

  Pair with REFACTOR-NNN: align LOOKUP_TABLE_* scoping with DATA_ENTITY (the natural choice given Lookup Tables ARE Data Entities); pair with DOC-NNN updating the doc-side mental model.
