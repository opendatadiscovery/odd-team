proposed_action: |-
  Add `AlertManagerGeneratorUrlXssTest.handleExternalAlerts_javascriptSchemeGeneratorUrl_persistsAsChunkDescription_pinsXssSurface` as a WebTestClient test. (a) POST `/ingestion/alert/alertmanager` with body `{ "alerts": [{ "labels": { "alertname": "x", "entity_oddrn": "<known-oddrn>" }, "startsAt": "2026-01-01T00:00:00", "generatorURL": "javascript:alert(1)" }] }`. (b) Assert HTTP 204. (c) Query `SELECT description FROM alert_chunk WHERE alert_id = (SELECT MAX(id) FROM alert WHERE data_entity_oddrn = '<known-oddrn>')`. (d) Assert the description CONTAINS the literal string `javascript:alert(1)`. (e) GET `/api/dataentities/<entity-id>/alerts` as an authenticated user. (f) Assert the alert is returned with the JS-scheme URL in the description payload. (g) Add a `// REGRESSION-PIN — handleExternalAlerts accepts ANY URL scheme in generatorURL and embeds it verbatim in the chunk description. UriComponentsBuilder does NOT block javascript: scheme. Combined with the unauthenticated webhook, ANY caller can plant a stored payload. UI tier must defend (sanitise on render); the API tier currently does not. A REFACTOR adding scheme validation at AlertServiceImpl.java:168 (e.g., reject non-http/https schemes) will flip this test, making the fix deliberate.` comment block. Pair with a UI-tier `e2e/xss-resilience.spec.ts` test once the UI render path is mapped.
