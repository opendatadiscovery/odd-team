name: Update alert status with reopen-conflict guard
canonical_in_docs: true
canonical_candidate: false
description: |-
  NEW OPERATION, batch 2026-05-20S (AlertServiceImpl primary source).
  PUT /api/alerts/{alert_id}/status — user-driven mutation through
  AlertController.changeAlertStatus → AlertServiceImpl.updateStatus
  (AlertServiceImpl.java:111-136). The only @ActivityLog-annotated
  method on AlertServiceImpl (line 112 — `@ActivityLog(event = ALERT_STATUS_UPDATED)`).

  THE REOPEN-CONFLICT GUARD (lines 124-131): when the target status is
  OPEN, the service calls `alertRepository.openAlertWithTheSameTypeExistsForDataEntity(alertId)`
  and raises `BadUserRequestException("Cannot reopen alert since the
  system already has an open alert of the same type")` if true. The guard
  is server-enforced APPLICATION LOGIC, not a DB constraint — no
  `UNIQUE (data_entity_oddrn, type) WHERE status = OPEN` partial-index
  exists at the schema layer.

  THE RACE WINDOW: both the read (line 124 — openAlertWithTheSameTypeExistsForDataEntity)
  and the write (line 134 — updateAlertStatus) are unfenced at every
  layer — no FOR UPDATE on the read (ReactiveAlertRepositoryImpl.java:397-420),
  no FOR UPDATE on the UPDATE (ReactiveAlertRepositoryImpl.java:297-306),
  no DB-level unique constraint backing the invariant. Two concurrent
  reopen requests for sibling alerts of the same type on the same data
  entity can BOTH pass the check and BOTH proceed to UPDATE — the
  application invariant "one OPEN alert of the same type per data entity"
  is briefly violated.

  TRANSACTIONAL BOUNDARY: `updateStatus` does NOT carry @ReactiveTransactional
  itself (deliberate asymmetry with `handleExternalAlerts` at line 152
  and `applyAlertActions` at line 201). The transaction wraps via the
  `ActivityAspect.monoActivityAspect` AOP at `ActivityAspect.java:42`
  which synthetically applies `@ReactiveTransactional` to the intercepted
  Mono. The read-then-write composition therefore runs inside the AOP s
  synthetic transaction; a refactor removing the AOP would leave the
  composition unfenced AND would stop activity emission.

  AUDIT EMISSION: the @ActivityLog(ALERT_STATUS_UPDATED) AOP captures
  oldState BEFORE the update via AlertStatusUpdatedHandler.getContextInfo
  and newState AFTER via AlertStatusUpdatedHandler.getUpdatedInfo. The
  AOP filters newState==oldState emissions (ActivityAspect.java:86
  `.filter(newState -> !info.getOldState().equals(newState))`) — no
  activity row on no-op updates. Per call: 5 DB round-trips total (1
  conditional reopen-conflict read for OPEN-target only, 1 UPDATE, 1
  refresh read, 2 activity-related SELECTs via the AOP, 1 activity-row
  INSERT IF state changed).

  AUTHORIZATION: gated by SECURITY_RULES at SecurityConstants.java:295-296
  on AuthorizationManagerType.ALERT, resolved via AlertResourceExtractor
  → alertRepository.getDataEntityIdByAlertId → permission check on that
  data entity. A direct service call (CLI tool, admin endpoint, future
  ingestion adapter) bypasses this rule because the service carries
  NO programmatic @PreAuthorize / permissionService check.

  ANONYMOUS FALLBACK: under `auth.type=DISABLED`, `authIdentityProvider.getCurrentUser()`
  returns Mono.empty(); the switchIfEmpty fallback (line 119) calls
  `alertRepository.updateAlertStatus(alertId, status, null)` proceeding
  with `status_updated_by=null`. Audit-attribution loss on anonymous
  callers.
