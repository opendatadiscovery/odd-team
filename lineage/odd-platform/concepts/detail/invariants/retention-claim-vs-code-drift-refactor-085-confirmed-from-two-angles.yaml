name: Retention claim vs code drift (REFACTOR-085 confirmed from FIVE angles — batch
  VAL-LSN-019-B fifth angle PRIMARY-SOURCE pin at ActivityEmptyPartitionsHousekeepingJob)
canonical_in_docs: false
canonical_candidate: true
description: |-
  Cross-cutting doc-vs-code-drift invariant for retention claims. The
  live `/features/active-platform-features/activity-feed#configuration` page claims
  `odd.activity.partition-period` controls 'retention and partitioning'. 2-sidecar
  primary-source confirmed in batch 2026-05-12D that this is unsupported by the codebase:
  (a) ActivityTablePartitionManager (batch B): the partition-period config controls
  CADENCE only — there is no `dropPartition` / `getEmptyPastPartitions` invocation
  for the activity table (`PartitionService.dropPartition` exists on the interface
  but is never called from the activity-table side); the activity table grows monotonically.
  (b) HousekeepingTTLProperties (batch D): the entire housekeeping TTL surface has
  exactly three fields (`resolved_alerts_days`, `search_facets_days`, `data_entity_delete_days`)
  — NO `activity*Days` field. The only activity-touching housekeeping path is `ActivityEmptyPartitionsHousekeepingJob`
  which drops EMPTY past partitions only (`COUNT(*) = 0` check at PartitionServiceImpl.java:133-141)
  — partitions with even one row are retained indefinitely. Time-based retention for
  the ACTIVITY table does not exist anywhere in the platform codebase from BOTH the
  partition-WIDTH angle AND the housekeeping-coverage angle. Same applies to the MESSAGE
  table (no `messageDays` field on HousekeepingTTLProperties; only `MessageEmptyPartitionsHousekeepingJob`
  drops empty past partitions).

  **STRENGTHENED batch 2026-05-20-R — SQL-tier PRIMARY SOURCE (third
  angle)**: ReactiveActivityRepositoryImpl batch-R sidecar pins the
  monotonic-growth posture at the **SQL repository tier**.
  bugs_limitations_corner_cases.[0] (HIGH severity — the activity
  table grows monotonically): no `deleteFrom(ACTIVITY)` anywhere in
  the repository file (grep verified zero matches). The repository
  WRITES but does NOT DELETE. Combined with the housekeeping job that
  only drops empty partitions (batch B + D confirmation) AND the
  absence of a per-row TTL field (batch D confirmation), the activity
  table has NO ROW-LEVEL DELETION PATH AT ALL. Once a partition has
  any activity row, it persists forever. A high-volume deployment
  (1M events/day) accumulates ~365GB+/year of audit data with no
  recovery path short of manual `DROP TABLE activity_YYYYMMDD_YYYYMMDD`.
  performance.known_performance_gaps.[0] HIGH (unbounded growth of
  activity table — mirror of ActivityTablePartitionManager
  bugs_limitations_corner_cases.[0] from the upstream sidecar; the
  repository writes; nothing deletes; multi-year deployments
  accumulate 100s of GB of audit data with no recovery path).

  **STRENGTHENED batch VAL-LSN-019-B (2026-05-20) — HOUSEKEEPING-JOB
  PRIMARY SOURCE (fourth angle) + functional-near-no-op finding (fifth
  angle)**: ActivityEmptyPartitionsHousekeepingJob FRESH sidecar adds
  TWO new angles:

    Angle 4 (housekeeping-JOB primary-source pin): the reaper
      companion to ActivityTablePartitionManager is now LINE-CITED
      verbatim at ActivityEmptyPartitionsHousekeepingJob.java:9-17
      with the concrete @Component shape (binds Tables.ACTIVITY.getName(),
      no exclusions). The empty-only contract is structurally
      enforced by the abstract base's template method (`partitionService.
      getEmptyPastPartitions` at line 21-22 of the base; the AND-guard
      `isPartitionInPast && isPartitionEmpty` at PartitionServiceImpl.java:110)
      — verified PRIMARY SOURCE.

    Angle 5 (functional-near-no-op finding): the reaper honors its
      name AT THE CENTRE (real count(*)=0 check) but is functionally
      a near-no-op on steadily-used platforms. Verbatim from
      ActivityEmptyPartitionsHousekeepingJob.md:bugs_limitations_corner_cases.[0]
      (HIGH — silent-data-growth class; LSN-001 shape on activity audit
      trail): "every activity_% partition spans 2 × odd.activity.partition-
      period = 60 days. For this job to drop ANYTHING, the deployment
      must have produced ZERO activity events across a 60-day window
      AND that window must already be in the past. On a platform with
      daily activity, NO partition ever empties out; the job runs every
      15 minutes (96×/day, 35K×/year), scans information_schema.tables
      and runs SELECT count(*) = 0 per past partition, and reaps
      nothing. The combined effect with the no-drop-path in
      ActivityTablePartitionManager is monotonic growth of the activity
      table on any non-dormant platform."

  **Five-angle confirmation**:
    Angle 1 (partition-WIDTH side, batch B): no DROP for non-empty
      partitions; partition-period controls width only
    Angle 2 (housekeeping-coverage side, batch D): no `activity*Days`
      TTL field; ActivityEmptyPartitionsHousekeepingJob requires
      partitions to already be EMPTY before dropping
    Angle 3 (SQL repository tier, batch R): no `deleteFrom(
      ACTIVITY)` anywhere in the codebase; the repository writes
      via `save` + `saveReturning` and reads via 7 SELECT paths;
      there is no DELETE-from-activity path
    Angle 4 (housekeeping-JOB primary-source pin, batch VAL-LSN-019-B):
      the reaper bean structure pinned verbatim — Tables.ACTIVITY
      binding, no exclusions, no transactional wrapper; the empty-only
      contract is structurally enforced; PRIMARY SOURCE
    Angle 5 (functional-near-no-op finding, batch VAL-LSN-019-B):
      the empty-only check is honored AT THE CENTRE but the
      60-day-wide window rarely empties on steadily-used platforms —
      the reaper is functionally a no-op on busy deployments. PRIMARY
      SOURCE for the operational severity of the retention drift.

  REFACTOR-085 is now triangulated at the doc-page side + the
  configuration-side + the partition-job-creator side + the
  housekeeping-TTL-properties side + the **SQL repository tier** + the
  **housekeeping-job-reaper side** + the **functional-near-no-op
  primary source**. Seven-evidence-point primary source for what the
  maintainer should consider a CONFIRMED bug class.

  Recommended remediation: rewrite the activity-feed docs Configuration
  section to say 'partitioning is controlled by `odd.activity.partition-period`;
  ODD does NOT currently retention-delete activity rows — operators
  with high-volume activity must manually drop old partitions or
  implement application-level archival.' Refactoring-side: a new
  `housekeeping.ttl.activity_days` field + corresponding
  `ActivityHousekeepingJob` would close the gap; the abstract base
  `EmptyPartitionsHousekeepingJob` already supports the per-partition-drop
  primitive — but the per-row deletion (for partitions still receiving
  current-window writes) would require a separate
  `delete-from-activity-where-created_at-older-than-X` query path
  that does NOT currently exist in ReactiveActivityRepositoryImpl.
