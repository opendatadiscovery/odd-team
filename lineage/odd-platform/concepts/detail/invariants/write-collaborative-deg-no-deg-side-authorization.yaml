mitigations_unimplemented:
  - |-
    Document the write-collaborative DEG posture on the live
    /features/data-discovery/groups-domains page (DOC-NNN — operators
    deploying ODD in multi-team / multi-domain environments need to know
    the cross-DEG pollution risk).
  - |-
    Document the child-side scope explicitly on the
    /configuration-and-deployment/enable-security/authorization/permissions
    page — the line for DATA_ENTITY_ADD_TO_GROUP / DATA_ENTITY_DELETE_FROM_GROUP
    should disambiguate (CHILD vs PARENT DEG) and include the cross-DEG
    addability example.
  - |-
    Introduce a DEG-side permission (e.g. DATA_ENTITY_GROUP_MEMBERSHIP_MANAGE)
    that gates "can callers add entities to MY DEG" — orthogonal to the
    existing child-side gate. Higher scope; requires schema-level change to
    SECURITY_RULES + the Permission enum.
  - |-
    Add a regression test that asserts a caller with
    DATA_ENTITY_ADD_TO_GROUP on entity X but ZERO permissions on DEG Y can
    successfully POST entity X into DEG Y (current behaviour; pin the
    write-collaborative posture explicitly so the next maintainer cannot
    silently tighten the contract without a test failure).
  - |-
    Audit shipped default Policies: identify Policies granting
    DATA_ENTITY_ADD_TO_GROUP via dataEntity:owner scope; warn operators
    that those Policies enable cross-DEG pollution.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-19L. Surfaced by
  the primary-source examination of the DEG-membership write pair
  (addDataEntityDataEntityGroup + deleteDataEntityFromDataEntityGroup).
  The pattern is independent of REFACTOR-217 (the term path-mismatch bug);
  here the SecurityRule is correctly wired AND the path matches the
  OpenAPI surface AND the permission is correctly evaluated — but the
  scope is the CHILD entity, not the parent DEG, so the gate doesn't
  defend the resource an operator believes it defends.

  Cross-cutting connections:
    - Pairs with the "Read-collaborative cross-owner enumeration"
      invariant — the READ side of the same posture; together they
      characterize ODD's "collaborative" stance applied to BOTH read
      and the DEG-membership write surface
    - Companion of "Permission-bypass via Owner auto-create" — that
      invariant covers the directory-growth side-door; this covers
      the membership-write cross-DEG pollution
    - Cross-references "ADD/DELETE permission asymmetry on DEG-membership"
      (sibling invariant) — that captures the policy-asymmetry
      observation; this captures the resource-scope observation

  Three DOC-NNN candidates flow from this invariant:
    (a) /features/data-discovery/groups-domains.md — add a Permissions
        / Audit / Cross-Domain subsection
    (b) /configuration-and-deployment/enable-security/authorization/permissions
        page — disambiguate the scope (CHILD vs DEG) for the two
        DEG-membership permissions
    (c) Possibly a new ADR formalizing the write-collaborative DEG posture
        as deliberate (matching the read-collaborative ADR pattern)
