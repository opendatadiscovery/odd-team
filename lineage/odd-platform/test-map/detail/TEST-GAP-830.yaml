evidence:
  - "openapi-spec.md says (bugs_limitations_corner_cases.[6]): 'SecurityConstants path-mismatch class — openapi.yaml:973 PLURAL /terms vs SecurityConstants /term SINGULAR silently disables DATA_ENTITY_ADD_TERM authorization. The spec declares the PLURAL form (the URL clients actually hit); SecurityConstants registers the SINGULAR form (a typo). Result: the SecurityRule never matches, the permission check is skipped, the SecurityWebFilterChain falls through to .authenticated(). ANY authenticated user under LOGIN_FORM/OAUTH2/LDAP can link any term to any entity.' (severity HIGH)"
  - "openapi-spec.md says (security.known_security_gaps.[3]): 'SecurityConstants path-mismatch confirmation point — the spec's /terms PLURAL path is the source of truth; the SecurityConstants registration of /term SINGULAR is the silent bug. The spec IS correct; the security registration is wrong. This direction matters: the remedy per REFACTOR-217 is to change SecurityConstants to match the spec, not the spec to match SecurityConstants. The gap is structurally caught at the spec layer — a build-time validator that compares SECURITY_RULES paths against OpenAPI paths would catch every such drift.' (severity HIGH)"
  - "Verified at primary source: openapi.yaml:973 (PLURAL `/api/dataentities/{data_entity_id}/terms`) + openapi.yaml:1042 (PLURAL `/api/dataentities/{data_entity_id}/terms/{term_id}`) + REFACTOR-217 + TEST-GAP-017 + TEST-GAP-489"
