realism_caveats: |
  The probe pins the 60-second cache staleness window for the single-replica
  case. Multi-replica verification is sketched but not executed inside this
  probe — running a 2-replica compose-up would require Postgres-shared session
  state which odd-platform-api does NOT have (the Caffeine cache is per-JVM by
  design; the LoginForm UserDetailsService is a MapReactiveUserDetailsService
  per `LoginFormSecurityConfiguration.java:68-86`, not a shared store). A
  separate test class running 2 replicas + a shared LB would confirm the
  N-times-Slack-call hypothesis.

  The probe does NOT exercise:
  - The blocking-vs-stale-during-refresh question with concurrent calls
    (asserts the cache-miss happens once via the call-count). A follow-up
    probe with `concurrent_callers: 10` after eviction + a delay_ms of 2000 on
    the Slack mock would isolate the blocking behaviour.
  - The "member_left_channel" reverse case (a channel that was visible
    becomes invisible after 60s). The shape is symmetric to the
    "member_joined_channel" case so it's not separately exercised here.
  - The cache behaviour with `nameLike` non-empty — the probe omits the
    `channelName` query parameter; the filter is exercised by a separate
    Category F probe on the startsWith semantics.

  The probe assumes the wiremock-up step is supported by the probe-runner
  harness; if not, a Testcontainers-based MockServer/WireMock setup is
  equivalent.

  If the platform ever adds an event-driven cache-invalidation hook (e.g.,
  EventApiController parses `member_joined_channel` and invalidates the
  Caffeine cache), this probe MUST be re-run; the current claim is correct
  only for the (no-event-invalidation) state at commit 4ec2b20.
