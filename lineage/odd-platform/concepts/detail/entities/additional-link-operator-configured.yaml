name: Additional Link (operator-configured global navigation catalogue)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-08
description: |-
  NEW ENTITY, batch ZE — operator-supplied external URLs surfaced in
  the App Info menu (the toolbar information icon) of every page in
  the SPA. Bound at boot via Spring @ConfigurationProperties from
  odd.links[].{title,url} (AdditionalLinkProperties.java:6).

  Documented on docs/configuration-and-deployment/odd-platform (200
  OK 2026-05-25) — the live page describes the feature as
  'pointers to internal wikis, runbooks, dashboards, or any other
  page', each entry requiring title + url with opening-in-new-tab.

  STATIC PER-PROCESS — the record-of-records is captured at boot;
  runtime YAML / env mutation requires container restart. No
  /actuator/refresh hot-reload path.

  Audience: every authenticated user (or anonymous under DISABLED)
  receives the SAME list — no per-role / per-owner filtering.

  Distinct from the per-data-entity attachment link surface at
  /api/dataentities/{id}/links (which is per-entity, user-managed,
  and gated by DATA_ENTITY_ATTACHMENT_MANAGE). The name 'links' is
  reused at two semantically distinct scopes — the OpenAPI tags
  ('links' vs 'dataEntityAttachment') disambiguate at the spec
  layer but not at the path layer.

  Doc drift surfaced by sidecar — live doc says 'opening in a new
  tab' but code does NOT set rel='noopener noreferrer'
  (AppInfoMenu.tsx:60-66); doc says 'absolute URL' but code does
  NOT validate URL scheme — operator-configured `javascript:` or
  `data:text/html` URLs are passed unsanitised. The reverse-tabnabbing
  + URL-scheme gap is the load-bearing operator-trust finding.
axes_present:
  - controllers
  - config_consumers
  - ui_components
nodes:
  - odd-platform java LinksController controller-class:LinksController
contributors:
  - 'LinksController.md:concepts.entities — AdditionalLink + Link DTO'
  - 'LinksController.md:implicit_adrs.[0,1] — STATIC catalogue (no persistence, no admin UI) + GLOBAL (no per-role gating)'
evidence:
  - LinksController.md:concepts.entities
  - LinksController.md:dependencies_semantic.requires-config (odd.links[].title + odd.links[].url)
  - LinksController.md:bugs_limitations_corner_cases.[0,2,4] (rel=noopener missing + URL scheme unvalidated + boot-time bind)
notes: |-
  Operator-configured external links are a STATIC catalogue, not a
  runtime-mutable feature; the absence of any persistence layer or
  admin UI is the explicit decision (implicit_adrs[0]). For
  per-data-entity links (the DATA_ENTITY_ATTACHMENT_MANAGE surface),
  see `attachment` and related concepts.
related_features: []
