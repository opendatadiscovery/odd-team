notes: |-
  Pairs with:

    - `entity-oddrn-trust-from-alertmanager-webhook` invariant — the
      third ingestion endpoint (`/ingestion/alert/alertmanager`) is
      covered by NEITHER filter; the three-way asymmetry is
      always-on / opt-in / always-off.

    - `collector-identity-via-websession-attribute-not-principal`
      invariant (new in this batch) — explains WHY the
      IngestionDataSourceFilter must be unconditional (it
      sets the WebSession state the controller depends on).

    - `upsert-by-oddrn-partial-merge-collector-driven-only-name-description`
      invariant (new in this batch) — the merge semantics that the
      always-on filter enables.

  Doc-side recommended action: extend
  `/configuration-and-deployment/enable-security/authentication/s2s`
  with an explicit "scope of ingestion-filter properties" subsection:
  enumerate the THREE ingestion endpoints and the THREE different
  auth postures.
