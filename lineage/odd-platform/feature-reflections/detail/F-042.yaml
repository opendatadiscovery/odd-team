# Page-level UI Error Display — product-owner reflection

## product_owner_narrative

The Page-level UI Error Display is the platform's **failure-path chrome** — the surface a user sees
when a page they opened cannot load. It is the sibling of the Application Toolbar (F-041): the toolbar
is the success-path chrome rendered while a page works; AppErrorPage is the widget rendered in its place
when that page's data fetch fails. Its audience is everyone who uses the platform — a data engineer whose
glossary term 404s, an operator whose datasource list 403s, an analyst whose search results time out — and
its job is to turn an opaque failed request into a legible "something went wrong, here is the HTTP code,
here is the way back home" (per AppErrorPage sidecar `understanding` + `audiences`).

A user never invokes this feature directly; it appears reactively. When any of 23 page-level components
fires an async data fetch and that fetch rejects, the component reads the error out of the redux loader
slice and conditionally mounts `<AppErrorPage showError error={...} />` in its own subtree (per
`upstream_callers`, 23 enumerated caller files; canonical pattern at `DataEntityDetails.tsx:116-119`). What
the user then sees is a single full-height pane: a large HTTP status code on the left (e.g. `404`), a short
status-text heading on the right (e.g. `Not Found`), and a "Return to the Home Page" link
(`AppErrorPage.tsx:20-37`, confirmed at primary source). The widget reads no global state — the parent
decides whether to show it and supplies the error (per `invariants`: "CONTROLLED component, not subscriber").

The working part a product owner would highlight in a demo is the **information-disclosure boundary**: the
error object carries four fields — `{status, statusText, url, message}` — populated upstream by
`getErrorResponse` (`errorHandling.tsx:12-26`), but the page renders only the two least-sensitive ones. The
failing API URL and the backend's response-body message — which can carry stack-trace fragments, SQL exception
text, or echoed PII — are never placed in the DOM (`AppErrorPage.tsx:24-29`, confirmed). The backend `message`
gets a separate, short-lived channel: a `react-hot-toast` shown for 6 seconds (`errorHandling.tsx:48-68` +
`App.tsx:55` 6000ms default). This two-channel split (status code persistent on the page, message ephemeral
in a toast) is the feature's load-bearing safety property — and it is entirely undocumented in the code (no
JSDoc, no comment) and untested.

The feature's defining characteristic, however, is **structural absence** — what is NOT here. There is NO
React error boundary anywhere in the SPA (Grep `ErrorBoundary|componentDidCatch|getDerivedStateFromError`
over `odd-platform-ui/src` returns zero matches; confirmed). And there is NO `<Route path='*'>` catch-all in
the route registry (`App.tsx:59-89` declares 11 routes, none with `path='*'`; confirmed at primary source).
AppErrorPage is reached ONLY when an async thunk rejects — never when React-Router fails to match a URL, and
never when a component throws synchronously during render. The consequence is two distinct blank-page failure
modes the user can hit: (a) typing/sharing a bare URL the router does not match (bare `/terms`, bare
`/master-data`, any unknown path) renders the toolbar plus an empty pane (per terms + masterData route
sidecars); (b) any render-time exception in any view unmounts the entire React tree to the closest boundary —
of which there are none — white-screening the whole console, nav chrome included.

This feature is cross-cutting: it composes with F-041 (the success-path toolbar) and shares its surface with
the Discovery pillar (P-01 — DataEntityDetails and 7 sub-tabs), the Data Glossary (P-06 — TermDetails, where
`fetchTermDetails` sets `switchOffErrorMessage: true` so AppErrorPage is the ONLY error surface for term
failures, per the feature-flow cross_pillar block), and Alerts/Activity (P-07). Because it is the only error
affordance every one of those pillars relies on, its structural gaps are not local — a blank page on a
glossary fetch and a blank page on a datasource fetch are the same missing safety net seen from two pillars.

