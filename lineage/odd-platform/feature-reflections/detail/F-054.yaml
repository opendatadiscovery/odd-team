  derivation: "A senior product owner / operator carries a per-tenant RBAC mental model: operational topology is sensitive, so a user expects to see only their teams' microservice call graphs unless catalog-public-by-design is stated (implicit-requirements seed, Rule 10 archetype implicit-requirements)."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      getLineage applies NO owner-scoping. It resolves the root via
      reactiveDataEntityRepository.getDataEntityWithDataSourceAndNamespace (LineageServiceImpl.java:92) WITHOUT calling
      authIdentityProvider.fetchAssociatedOwner(); the service has no AuthIdentityProvider field (lines 54-57) and the
      recursive-CTE walk applies no owner predicate at any layer (ReactiveLineageRepositoryImpl.java:122-176). This is
      the negative-case sibling of the anchor-set owner-scoping pattern (DataEntityRelationsServiceImpl does call
      fetchAssociatedOwner; this service does not). Under LOGIN_FORM/OAUTH2/LDAP any authenticated user reads any
      microservice's full reachable call graph; under auth.type=DISABLED any unauthenticated network probe can.
