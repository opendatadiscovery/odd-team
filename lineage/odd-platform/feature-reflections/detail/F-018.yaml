# Manual Object Tagging — product-owner reflection

## product_owner_narrative

Manual Object Tagging is the platform's **free-form labelling capability** inside the Data
Discovery pillar (P-01:F-006, "Manual Object Tagging (3 TAG_* permissions)" in
`system-mission.md`'s P-01 sub-feature seed). The product promise to a new customer is
simple: "put your own vocabulary on the catalog — apply tags like `pii`, `gold-layer`, or
`deprecated` to any data entity, dataset field, or glossary term, and use those tags to
find things again." Three role-based permissions govern the tag *vocabulary* — TAG_CREATE
("Create a new tag in the catalog vocabulary"), TAG_UPDATE ("Edit tag names or Important
flag status"), TAG_DELETE ("Remove tags from vocabulary") — exactly as the live tagging.md
page describes (per WebFetch 2026-05-21 status 200, via the createTag sidecar
docs_link_semantic). The audience is the whole catalog readership: data engineers, analysts,
stewards, and ML engineers who annotate entities and then search by tag (per the P-01
audiences list).

A user interacts with tagging through **two faces of the same global directory**. The READ
face is `GET /api/tags` (the `getPopularTagList` operation): it feeds the Catalog Overview's
"Top Tags" chip strip, the Search page's Tag filter facet, and the tag dropdown on every
entity-detail page (per `getPopularTagList.md`:understanding + audiences). The WRITE face is
not one endpoint but **five**: the dedicated `POST /api/tags` directory-create (TAG_CREATE),
plus four side paths that mint directory rows as a side effect of *assigning* a tag —
`PUT /api/dataentities/{id}/tags` (DATA_ENTITY_TAGS_UPDATE), `PUT /api/terms/{id}/tags`
(TERM_TAGS_UPDATE), `PUT /api/datasetfields/{id}/tags` (DATASET_FIELD_TAGS_UPDATE), and the
unauthenticated Collector ingestion path — all four of which route through
`TagServiceImpl.getOrCreateTagsByName` / `getOrInjectTagByName` (per `TagServiceImpl.md`:
understanding + upstream_callers; `TagServiceImpl.java:80-94, 144-159`). The directory itself
is **flat, global, and namespace-free** — the `tag` table has no `owner_id` column, so every
tag any user mints is immediately visible to every other user (per `TagServiceImpl.md`:
invariants; `getPopularTagList.md`:security.owner_scoping `N/A`).

The working parts a product owner would demo: there is a **dedicated management surface** at
`/management/tags` where stewards create, rename, important-flag and delete tags — and this
is the ONE part of the feature that has real end-to-end test coverage (the Playwright suite
`tests/features/tags/{add,change,delete}-tag.spec.ts` drives this page through the modals,
confirmed this run). You can **search the tag list** by substring (`query`,
case-insensitive), **filter by tag id** (`ids`), and **paginate** (`page`/`size`); you can
**rename** a tag or toggle its **Important** flag (which floats it in some views); you can
**delete** a tag; and Collector-pushed (`external`) tags are **protected from UI overwrite** —
a tag the ingestion pipeline owns cannot be renamed or deleted from the UI (per `updateTag.md`
+ `deleteTag.md`:invariants — the `!external` guard, a genuine positive invariant). Tag
*assignment* is a **SET, not an APPEND**: `PUT .../tags` replaces the tag set on the target,
and submitting `[]` clears it (per `createTermTagsRelations.md` +
`updateDatasetFieldTags.md`:invariants — replace-all / delete-then-recreate).

The integration story: tagging **feeds Search** (F-017) — every tag becomes a top-level
Search facet, making the tag the catalog-wide enumeration surface; it **feeds the Catalog
Overview** home page (the Top Tags strip launches a tag-filtered Search); and it is **fed by
Integrations** (P-10) — Collectors push tags with their ingested entities. It shares the
activity-audit surface with the Activity Feed (P-07), but only partially — see below.

Edge cases the product owner would (or should) highlight in a demo, all of which turn out to
be where the assembled chain diverges from the promise: the "Top Tags" surface does not
actually show the most-popular tags once the directory grows past one page (it shows the
OLDEST); the four side paths quietly grant directory-mint power to anyone who can assign a
tag; deleting a tag leaves orphan dataset-field relations and a stale search index; and the
UI surface that does the minting (the tag-assign autocomplete) gives no hint that typing a
new name adds it to a global vocabulary everyone sees. **The decisive product-quality fact
this refresh surfaces (LSN-030): the e2e suite that DOES exist guards only the directory-CRUD
happy path through the management Tags page — create-and-it-appears, rename-and-it-changes,
delete-and-it-disappears-from-the-list — and NONE of the ten contradicted promises, the two
partials, or the probe-needed path is guarded by any test at all.** Two of fifteen
user-facing promises are verified; the most behaviourally dangerous behaviours (the ranking
lie, the silent global-mint side-channel, the open read, the incomplete Collector guard) ship
unguarded, and even the one fully-confirmed guardrail (H-014) has no regression test. Finally,
the tag-directory UI surfaces — the Top Tags strip (TopTagsList), the tag chip (TagItem), the
per-entity tag editor (OverviewTags / TagsEditForm / TagsEditFormAutocomplete) — are NOT
enriched as standalone sidecars in this chain (the `PopularStrip.md` sidecar that exists is the
popular *data-entity* strip, confirmed by reading it). The UI evidence used below comes from
the feature-flow's `batch_extensions` inline primary-source walks (TopTagsList.tsx:13-46,
TagItem.tsx:1-60, OverviewTags.tsx:43-68, TagsEditFormAutocomplete.tsx) — substantial, with
file:line citations, but not the same as enriched, stress-protocol'd sidecars. This caps the
confidence of the UI-facing verdicts and is surfaced as a validation_gap (Rule 9).

## hypotheses

- id: H-001
  hypothesis: |
    "When a user opens the 'Top Tags' strip on the Catalog Overview (or pages GET /api/tags
    with default size), they see the tags currently applied to the MOST data entities — the
    most-used tags in the catalog right now."
  derivation: |
    The endpoint is named getPopularTagList; the service method listMostPopular; the OpenAPI
    description reads "Gets the list of existing tags sorted by popularity"; the UI labels it
    "Top Tags". Endpoint-shape + pillar promise ("curate tags") + doc-claim seeds all converge.
  seed_source: endpoint-shape + doc-claim + ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The chain returns the OLDEST `size` tags by `tag.id ASC` (creation order, serial PK),
      re-ranked among themselves by usage count — NOT the globally most-used tags — whenever
      the directory holds more than `size` tags. ReactiveTagRepositoryImpl.listMostPopular
      paginates the candidate pool with paginate(query, [OrderByField(TAG.ID, ASC)],
      (page-1)*size, size) at :148 BEFORE the UNION-ALL usage-count CTE is computed; the outer
      orderBy(COUNT_FIELD.desc()) at :158 can only re-rank rows that already survived the
      inner LIMIT. listMostPopular -> TagServiceImpl.listMostPopular -> getPopularTagList are
      straight-through delegations with no upstream re-sort. Maintainer empirical test
      (LSN-019:23-32, 2026-05-20): 35 equally-popular tags, size=30 -> the 30 oldest returned,
      the 5 youngest absent. The TopTagsList UI then re-sorts the (already-wrong) 30 rows
      client-side by usedCount DESC (TopTagsList.tsx:24-33) — a silent workaround that MASKS
      the backend error so operators never see the ranking is wrong. The repository unit test
      testListMostPopular (TagRepositoryImplTest:237-267) is structurally blind: size=8 with
      only 4 matching tags so the LIMIT never fires, and it asserts containsExactlyInAnyOrder
      (order-agnostic) — it cannot catch the drift.
    evidence:
      - sidecar: odd-platform__java__TagController__controller-method__getPopularTagList
        section: stress_findings.name_behavior_pairs[0] + invariants
        cite: "ReactiveTagRepositoryImpl.java:148 (inner paginate by TAG.ID ASC) + :158 (outer count DESC re-rank)"
        note: "inner LIMIT selects oldest size before counts; outer re-rank cannot reach excluded tags"
      - sidecar: odd-platform__java__service__TagServiceImpl
        section: understanding + operations
        cite: "TagServiceImpl.java:72-77"
        note: "listMostPopular is straight-through; the drift propagates 1:1 to the controller"
      - sidecar: odd-platform__openapi__tags__openapi-tag__tag
        section: invariants
        cite: "openapi.yaml:345"
        note: "the spec description 'sorted by popularity' is the false contract claim"
      - source_read_for_validation: true
        cite: "TagRepositoryImplTest.java:237-267 (read this run) + retrospectives/LSN-019:23-32"
        note: "the only listMostPopular test is structurally blind (size=8, 4 matches, order-agnostic assert); maintainer empirical reproduction against demo.oddp.io 2026-05-20"
    operator_visible_failure: |
      The "Top Tags" tile and the Tag-facet seed render OLD-and-possibly-unused tags as the
      catalog's headline vocabulary on any deployment with >30 tags. A freshly-minted, heavily-
      used tag is INVISIBLE on page 1 until it becomes one of the 30 lowest serial ids — i.e.
      never, unless the directory shrinks. Because the UI re-sorts client-side, the operator
      cannot even tell the ranking is broken — they see a plausibly-ordered list of the WRONG
      tags. An operator using "Top Tags" to assess vocabulary health draws wrong conclusions.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-002
  hypothesis: |
    "When a user passes ids=[1,2,3] to GET /api/tags, the response is restricted to those
    three tags — and an OpenAPI-spec consumer reading the parameter docs understands ids to
    mean tag ids."
  derivation: |
    The query parameter is named `ids` on a tag-list endpoint; endpoint-shape seed (one
    hypothesis per named parameter) + the response is a list of Tag.
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The IMPLEMENTATION is correct: ids binds to TAG.ID.in(ids) (ReactiveTagRepositoryImpl.java
      :141-142), an empty collection is treated as no-filter, and the page total honours the
      filter. So a caller who knows ids means tag ids gets exactly what they expect. BUT the
      CONTRACT misleads: getPopularTagList reuses the SHARED IdsParam component whose
      description reads "Entity ids" (components.yaml:4239-4248), while the implementation
      filters by tag.id. A spec consumer who reads "Entity ids" and supplies DATA-ENTITY ids
      gets an empty response (or, when an id value happens to collide with a real tag id, a
      nonsensical wrong tag). The same IdsParam IS accurate for its other (data-entity-scoped)
      consumer — the defect is operation-local: a tag-scoped operation reusing an entity-scoped
      parameter component with no description override (LSN-020 class).
    evidence:
      - sidecar: odd-platform__java__TagController__controller-method__getPopularTagList
        section: stress_findings.request_inputs[ids]
        cite: "ReactiveTagRepositoryImpl.java:141-142 (TAG.ID.in(ids))"
        note: "implementation binds ids to the tag PK — correct against the name"
      - sidecar: odd-platform__openapi__tags__openapi-tag__tag
        section: concepts + bugs_limitations_corner_cases
        cite: "components.yaml:4239-4248 (IdsParam description 'Entity ids') + openapi.yaml:351"
        note: "the spec parameter description says Entity ids; getPopularTagList filters by tag id"
    operator_visible_failure: |
      An API-gateway / SDK-generator / third-party integration author reading the rendered
      OpenAPI for getPopularTagList sees `ids: Entity ids` and supplies data-entity
      identifiers; the parameter filters the tag directory by tag.id, so the response is empty
      — a silent wrong-results bug. The misunderstanding is masked only when an id is BOTH a
      valid data-entity id AND a valid tag id, which produces a nonsensical (but non-empty)
      result that looks like success.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: |
    "When a user searches the tag list for 'finance' (query=finance), they see the tag they
    created as 'Finance' — searching and tagging treat tag names case-insensitively, the way
    a user expects vocabulary to behave."
  derivation: |
    The `query` parameter is a tag-name search; pillar promise ("curate tags") implies one
    coherent vocabulary. Negative-space + endpoint-shape: does the read path agree with the
    write path on case?
  seed_source: negative-space + endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The READ path is case-INSENSITIVE: query uses nameField.containsIgnoreCase (ReactiveAbstract
      CRUDRepository.java:243), so query=finance matches both 'Finance' and 'finance'. The WRITE
      path is case-SENSITIVE: divideTagsByExistence -> listByNames uses TAG.NAME.in(names)
      (case-sensitive SQL IN), and the tag_name_unique partial index is a binary text
      comparison, not lower(text). A user who has 'Finance' and then assigns 'finance' to an
      entity mints a SECOND distinct directory row; both coexist; both appear in Top Tags / the
      Tag facet as if they were different tags. There is no normalization layer anywhere.
    evidence:
      - sidecar: odd-platform__java__service__TagServiceImpl
        section: bugs_limitations_corner_cases + operations[divideTagsByExistence]
        cite: "TagServiceImpl.java:144-159 (case-sensitive listByNames) + ReactiveTagRepositoryImpl.java:120-125"
        note: "write existence-check is case-sensitive; mints a second row for a case variant"
      - sidecar: odd-platform__java__TagController__controller-method__getPopularTagList
        section: invariants
        cite: "ReactiveAbstractCRUDRepository.java:242-243 (containsIgnoreCase)"
        note: "read query is case-insensitive — the asymmetry with the write path"
    operator_visible_failure: |
      The vocabulary silently fractures by case: `PII`/`pii`/`Pii` become three independent
      tags, each tagging a different subset of entities, each its own Search facet bucket. A
      user filtering by `PII` misses entities tagged `pii`. Tag-health and governance reporting
      double-counts. The duplicate is invisible at mint time (the autocomplete shows the
      existing 'Finance' but the user's 'finance' still creates a new row). DOC-190's AC adds a
      doc-side case-sensitivity caveat (`finance` != `Finance`), so this is documented — but the
      behaviour itself contradicts the user's reasonable expectation.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |
    "When a user submits PUT /api/datasetfields/{id}/tags with a tag list, the dataset field's
    tags are updated and the call succeeds."
  derivation: |
    The endpoint exists, is named updateDatasetFieldTags, is gated and documented as "add or
    remove tags from a dataset field". Endpoint-shape — the most basic happy-path promise.
  seed_source: endpoint-shape + pillar
  validation:
    verdict: probe-needed
    actual_behavior: |
      Whether this endpoint WORKS AT ALL for a non-empty payload is statically undetermined.
      DatasetFieldServiceImpl.getUpdatedRelations (:264-271) builds each TagToDatasetFieldPojo
      with only tagId + datasetFieldId and NEVER calls .setOrigin(...); createDatasetFieldRelations
      maps each pojo via jooqReactiveOperations.newRecord(TAG_TO_DATASET_FIELD, p) and INSERTs.
      The origin column is `varchar NOT NULL DEFAULT 'INTERNAL'` (V0_0_82:12). If jOOQ's
      newRecord-from-pojo omits the unset column, the DB default applies and the endpoint works;
      if jOOQ emits an explicit NULL, the INSERT violates NOT NULL and EVERY non-empty PUT
      fails. The data-entity sibling sidesteps this by explicitly calling .setExternal(false)
      (TagServiceImpl.java:109); the dataset-field path relies on the default. This is the
      single CRITICAL untested path on the feature (F-018 HIGH-severity facet); pinned by P-030.
    evidence:
      - sidecar: odd-platform__java__DatasetFieldController__controller-method__updateDatasetFieldTags
        section: understanding + invariants
        cite: "DatasetFieldServiceImpl.java:264-271 (no .setOrigin) + ReactiveTagRepositoryImpl.java:355-368 (newRecord INSERT) + V0_0_82__add_tag_to_dataset_field.sql:12"
        note: "relation INSERT relies on jOOQ omitting the unset origin column so the DB default applies"
    operator_visible_failure: |
      If jOOQ emits the explicit NULL: every attempt to tag a dataset field returns a 500 — the
      feature is dead for any real payload (empty-payload clears still work). If origin persists
      as something other than 'INTERNAL': the next call's deleteDatasetFieldInternalRelations
      (WHERE origin='INTERNAL') misses those rows and the field accumulates orphan internal
      relations. Either way the operator hits a hard failure or silent relation drift.
    severity: HIGH
    confidence: LOW
    probe_id: P-030
    routes_to_finding: bug-candidate
    use_case_kind: happy-path
    coverage: unverified
    test_demand: P-030 (the unset-origin INSERT probe — resolve first; the integration test that pins origin=INTERNAL is the regression guard once green)

