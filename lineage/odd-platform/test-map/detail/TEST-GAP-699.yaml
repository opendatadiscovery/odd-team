evidence:
  - "DataSourceIngestionServiceImpl.md says (tests_coverage_semantic.uncovered_behaviours.[3]): '@ReactiveTransactional rollback semantic — if any of the chained DB calls fails (e.g. bulkUpdate raises an exception), the whole transaction rolls back. The existing tests mock all DB calls to succeed; no failure-injection test exercises rollback.'"
  - "DataSourceIngestionServiceImpl.md says (implicit_adrs.[2]): 'Single-transaction-per-batch with @ReactiveTransactional — partial failure rolls back entire batch; no per-item error report. The annotation is APPLIED to the highest-level method (createDataSources) rather than the individual repository calls — the maintainer''s deliberate choice is `the batch is the unit of consistency`.' confidence: HIGH"
  - "DataSourceIngestionServiceImpl.md says (bugs_limitations_corner_cases.[3]): 'Single-transaction-per-batch rollback on per-item failure: 1 bad ODDRN in a 100-datasource payload rolls back ALL 100. The operator-facing surface is HTTP 5xx with no per-item indication of which datasource caused the collision.' severity: MEDIUM"
  - "Source: DataSourceIngestionServiceImpl.java:40 (@ReactiveTransactional annotation wrapping createDataSources) + ReactiveTransactional.java:11 (the platform's reactive transaction manager binding)"
