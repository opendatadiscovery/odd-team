    - no_debounce_dashboard_refetch_per_filter_change
  retrospectives: [LSN-017]
realism_caveats: |
  This probe measures REDUNDANT BACKEND LOAD, not a correctness defect — the
  dashboard renders the right data either way; it just fetches it more times
  than the operator's one perceived page-open warrants. The deeplink double-fetch
  is the SAME drift class (LSN-017) as the entity-detail double-fetch filed
  upstream as PLT-104, but a DIFFERENT code locus: PLT-104 is the
  status-dependency useEffect on DataEntityDetails; this is the searchParams-sync
  mount useEffect on DataQualityFilters.tsx:28-43. If n_deeplink_prod comes back
  == 1, the static trace is wrong (react-query deduped the second fetch because
  the queryKey was identical before the searchParams resolved) and H-013 flips to
  CONFIRMED-as-single-fetch; if == 2 (the hypothesis), the reflection's
  contradicted-leaning verdict stands and the fix is to derive the initial
  filtersAtom synchronously from searchParams before the first render. The
  StrictMode arm is dev-only and does not reflect production load; it is captured
  to explain why a developer testing locally may observe 4 fetches and
  mis-attribute the count.
