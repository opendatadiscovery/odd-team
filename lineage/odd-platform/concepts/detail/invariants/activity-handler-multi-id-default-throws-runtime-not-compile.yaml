- |-
  ActivityHandler.md:concepts.invariants.[4] — verbatim: "The default
  multi-id getUpdatedState throws at runtime, not at compile time.
  Concrete impls that do not need batch behaviour silently inherit the
  throw. A caller (specifically ActivityServiceImpl.getUpdatedInfo(parameters,
  List<Long>, eventType) at :72-76) that dispatches to an event type
  whose handler doesn't override the multi-id path would receive
  UnsupportedOperationException at the first subscription. The current
  code dispatches only DATA_ENTITY_CREATED to this path (verified via
  Grep — ActivityIngestionRequestProcessor is the only caller, line
  27-28); adding a second multi-id event type without overriding
  would be a latent NPE-class regression."
- |-
  ActivityHandler.md:tests_coverage_semantic.uncovered_behaviours
  — "Multi-id getUpdatedState default-throws — no test asserts that
  the 16 concrete impls inheriting the default getUpdatedState(parameters,
  List<Long>) throw UnsupportedOperationException with the documented
  message when called. A future code path that mistakenly calls the
  multi-id variant for, say, OWNERSHIP_UPDATED would NPE/throw with
  a poor message; no test guards the contract." Severity HIGH.
- |-
  ActivityIngestionRequestProcessor.process (`:25-31`) is the SOLE
  caller of the multi-id path; it dispatches DATA_ENTITY_CREATED
  only (confirmed via Grep across the codebase).
