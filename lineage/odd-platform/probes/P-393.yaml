  - kind: sql
    query: "SELECT version();"
    capture_as: pg_version
  - kind: sql
    note: |
      Enough indexed rows that the planner has a real choice. Below a few thousand
      rows Postgres prefers a Seq Scan regardless, which would make H2/H3
      unfalsifiable — this is the load-bearing arrange step.
    query: |
      INSERT INTO data_entity (id, oddrn, external_name, type_id, entity_class_ids,
                               hollow, status, exclude_from_search)
      SELECT 993000 + i,
             '//probe/p393/row' || i,
             CASE WHEN i % 100 = 0 THEN 'customer guardsubject ' || i
                  ELSE 'unrelated guardfiller ' || i END,
             1, ARRAY[1], false, 1, false
      FROM generate_series(1, 20000) AS i;
  - kind: sql
    note: Populate search_entrypoint via the same generated/derived vector path production uses.
    query: |
      INSERT INTO search_entrypoint (data_entity_id, data_entity_vector)
      SELECT id, setweight(to_tsvector(coalesce(external_name, '')), 'A')
      FROM data_entity WHERE id BETWEEN 993001 AND 1013000;
  - kind: sql
    query: "ANALYZE search_entrypoint; ANALYZE data_entity;"
act:
  - kind: sql
    id: h1_querytree_render
    note: H1 — does querytree() return the literal 'T' for a negation-only tsquery?
    query: |
      SELECT querytree(!! plainto_tsquery('test'))                AS negation_only,
             querytree(!! phraseto_tsquery('some phrase'))         AS negated_phrase,
             querytree(to_tsquery('customer:*'))                   AS positive_prefix,
             querytree(to_tsquery('customer:*') && (!! plainto_tsquery('test')))
                                                                   AS mixed_branch,
             querytree(plainto_tsquery('the'))                     AS stop_word_only,
             querytree(plainto_tsquery('the') && (!! plainto_tsquery('test')))
                                                                   AS stopword_plus_negation;
    capture_as: querytree_renders
  - kind: sql
    id: h2_unguarded_plan
    note: |
      H2 — the plan WITHOUT the guard. This is the expression the pre-guard code
      would have produced for the user query `-test`.
    query: |
      EXPLAIN (FORMAT JSON, ANALYZE, BUFFERS)
      SELECT data_entity_id FROM search_entrypoint
      WHERE search_vector @@ (!! plainto_tsquery('test'));
    capture_as: unguarded_plan
  - kind: sql
    id: h3_guarded_plan
    note: |
      H3a — the plan WITH the guard, exactly as JooqFTSHelper.java:214-216 renders it
      for the user query `-test`.
    query: |
      EXPLAIN (FORMAT JSON, ANALYZE, BUFFERS)
      SELECT data_entity_id FROM search_entrypoint
      WHERE search_vector @@ (CASE WHEN querytree(!! plainto_tsquery('test')) = 'T'
                                   THEN CAST('' AS tsquery)
                                   ELSE (!! plainto_tsquery('test')) END);
    capture_as: guarded_plan
  - kind: sql
    id: h3_two_branch_plan
    note: |
      H3b — the per-branch payoff: `customer or -test`. The guard must drop the
      negation-only branch WITHOUT costing the `customer` branch its index scan.
    query: |
      EXPLAIN (FORMAT JSON, ANALYZE, BUFFERS)
      SELECT data_entity_id FROM search_entrypoint
      WHERE search_vector @@ (
        (CASE WHEN querytree(to_tsquery('customer:*')) = 'T'
              THEN CAST('' AS tsquery) ELSE to_tsquery('customer:*') END)
        ||
        (CASE WHEN querytree(!! plainto_tsquery('test')) = 'T'
              THEN CAST('' AS tsquery) ELSE (!! plainto_tsquery('test')) END));
    capture_as: two_branch_plan
