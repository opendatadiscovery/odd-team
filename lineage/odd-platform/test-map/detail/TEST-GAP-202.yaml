behaviour: '**SMTP timeouts unset** — `NotificationConfiguration.java:51-71` has no
  `mail.smtp.connectiontimeout` / `mail.smtp.timeout` / `mail.smtp.writetimeout`.
  JavaMail''s documented defaults are infinite. A hung SMTP relay blocks the WAL subscriber
  thread INDEFINITELY, stopping ALL notification delivery (Slack/webhook too — fan-out
  is sequential on a single thread). Live-doc-documented. 2-sidecar primary-source
  confirmed (NotificationsProperties batch C + EmailSenderProperties batch D).'
