  - 'odd-platform__java__IntegrationController__controller-class__IntegrationController.md:bugs_limitations_corner_cases.[6]'
behaviour: |-
  **Under auth.type=DISABLED both /api/integrations endpoints are anonymously
  reachable — the wizard registry (including the substituted platform_url
  value) is readable to any network caller; under LOGIN_FORM/OAUTH2/LDAP every
  authenticated user reads the full wizard surface regardless of role because
  NO INTEGRATION_* permission exists in SecurityConstants.SECURITY_RULES or
  PolicyPermissionDto.** The cluster is the 20th-21st REFACTOR-185 facet:
  DisabledAuthSecurityConfiguration.java:13-18 .anyExchange().permitAll()
  passes anonymous callers through; AuthorizationCustomizer.java:29-30
  catch-all .authenticated() admits any signed-in user under the three
  authenticated modes. The wizard surface ships verbatim collector-configuration
  YAML templates with the operator-configured platform_url interpolated in.
  If operators set odd.platform-base-url to an internal hostname (typical for
  notification + slack paths that share the property), the internal URL leaks
  via this anonymous-readable surface under DISABLED. The cluster's blast
  radius: the wizard exposes the platform's RBAC posture, internal hostname,
  and copy-paste collector setup secrets-shape.
