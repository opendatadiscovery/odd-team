behaviour: |-
  **HIGH — Cross-path silent-overwrite class: an operator's UI edit via `PUT /api/datasources/{id}` (full-form replace via MapStruct's `@MappingTarget`) is OVERWRITTEN on the next collector ingestion via `POST /ingestion/datasources` (partial-merge of name + description ONLY). NO warning at the UI write time, NO warning at the collector overwrite time, NO audit log of either event.** Primary-source confirmed across batch-W DataSourceController sidecar + cross-link to batch-P IngestionController + batch-S DataSourceIngestionServiceImpl + batch-R ReactiveDataSourceRepositoryImpl sidecars (the 5-vertex triangulation per the sidecar's coherence_check):

  **The two paths**:
  - **UI path** (`DataSourceController.updateDataSource` lines 38-45 → `DataSourceServiceImpl.update` lines 68-83 → `DataSourceMapper.applyToPojo` at `DataSourceMapper.java:49-56`): MapStruct's `@MappingTarget` over the entire DataSourceUpdateFormData. ALL fields written: name, description, connectionUrl, active flag, namespace_id, etc.
  - **S2S path** (`IngestionController.createDataSourceEntity` → `DataSourceIngestionServiceImpl.prepareForUpdate` at `DataSourceIngestionServiceImpl.java:74-92` per batch-S sidecar): `new DataSourcePojo(a).setName(i.getName()).setDescription(i.getDescription())`. ONLY name + description written. The collector OVERWRITES whatever was there with the collector's own representation of those two fields.

  **Operator-impact scenario** (the operator-cliff failure mode per LSN-001 / LSN-002 framing):
  1. Operator opens the Management → Datasources tab, locates the `snowflake-prod` datasource.
  2. Operator edits the description to "Production warehouse — DO NOT REPORT TO SLACK alert channel" and saves. UI confirms 200; the description is persisted.
  3. The collector running `odd-collector` (configured with its `odd-collector-config.yaml` containing the canonical name and the legacy description) restarts overnight (a routine deployment).
  4. On startup, the collector sends `POST /ingestion/datasources` with `name: 'snowflake-prod'` and `description: 'Snowflake production'` (the value from its config file).
  5. The S2S service path applies the partial merge — name and description are overwritten. The operator's edit is GONE.
  6. **No notification.** No audit log entry. No "config drift detected" alert. The operator next sees their description and finds it has reverted; they have no signal about what happened.

  **Cross-tier evidence**:
  - **DataSourceMapper.java:49-56** (`applyToPojo` — UI side): `@Mapping(target = ..., ignore = false)` over every field. Confirmed by batch-W sidecar's primary-source reading.
  - **DataSourceIngestionServiceImpl.java:74-92** (`prepareForUpdate` — S2S side, per batch-S sidecar): explicit field narrowing to `setName + setDescription`.
  - **NO audit log on either path** (per batch-W sidecar's downstream_side_effects.[8]: "NO Activity Event emission for ANY data_source mutation. No activityEventEmitter call in DataSourceServiceImpl (verified by Grep — the class imports no ActivityEvent + emits no Activity)"). The Datasources tab shows CURRENT row state, NOT a change history. The two paths' interleaving is invisible to operators.

  **Why HIGH not MEDIUM (the sidecar's own rating)**: this is the canonical operator-cliff failure mode (LSN-001 / LSN-002 family): the operator follows the documented UI workflow, gets a 200 OK, believes the change is persisted, then the next routine collector restart silently reverts the change. The operator has no doc-side anchor warning them that the platform has TWO mutation paths with DIFFERENT field-set semantics — the Management page (live-fetched 2026-05-20) describes only the UI flow.

  **Test gap shape**: regression-pin asserting: (a) `PUT /api/datasources/{id}` writes ALL DataSourceUpdateFormData fields (verifiable by DB read after); (b) a subsequent `POST /ingestion/datasources` for the same ODDRN overwrites ONLY name + description (the operator's other-field edits SURVIVE); (c) NO Activity Event is emitted by either path. The current state is PINNED — failures land if a future maintainer either (a) narrows the UI mapper to match S2S (breaking operator full-form-replace), or (b) broadens the S2S mapper to match UI (breaking collector-tenant constraint), or (c) adds Activity Event emission (changing the audit story).
