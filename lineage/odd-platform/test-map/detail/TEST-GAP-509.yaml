proposed_action: |-
  Testcontainers integration test. (a) Create DEG D with members m1, m2 (BOTH in D). (b) Create non-member entity ext1 (NOT in D). (c) Create lineage edges: m1->m2 (internal), ext1->m1 (entering), m2->ext1 (exiting). (d) GET /api/dataentitygroups/D.id/lineage. (e) Assert response contains the m1->m2 edge. (f) Assert response does NOT contain the ext1->m1 edge. (g) Assert response does NOT contain the m2->ext1 edge. (h) Assert response nodes do NOT contain ext1 (only DEG members appear). (i) Test comment 'LOCKS the DEG-internal-only edge scope as of 2026-05-19 (implicit_adrs.[4]). If a future refactor loosens the bidirectional filter to .or(...) — exposing cross-boundary edges — this test FLIPS the response shape; if a future refactor adds explicit cross-boundary visualisation, the proposed test for that feature would supersede this one.'
