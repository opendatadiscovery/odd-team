name: External LLM Service
canonical_in_docs: true
canonical_candidate: false
description: The operator-run AI service the platform proxies natural-language questions
  to (`POST {genai.url}/query_data`). The platform sends no authentication and does
  not modify question text — just rewraps `body` → `question`. Outbound consumer of
  platform-forwarded prompts; main-concepts.md `## AI aspects` describes this as 'an
  external AI service the operator runs (the platform does not embed an LLM)' (GenAIController
  + GenAIProperties sidecars).
axes_present:
- controllers
- config_prefixes
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:GenAIController
- odd-platform java org.opendatadiscovery.oddplatform.config.properties config-properties-class:GenAIProperties
contributors:
- 'GenAIController.entities: external ''genai service'' (an opaque HTTP endpoint addressed
  by genai.url)'
- 'GenAIProperties.requires-feature: external AI service that accepts POST {url}/query_data
  with JSON body {"question": "..."} and returns a string'
evidence:
- GenAIController.md:concepts.entities.[external genai service]
- GenAIProperties.md:dependencies_semantic.requires-feature
