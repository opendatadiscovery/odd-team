notes: |-
  Cross-references:

    - `no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f`
      invariant — the role-stripping leaves NO audit trail. An operator
      cannot reconstruct "Owner X had roles [A, B] before, now has []"
      after the fact.

    - `update-owner-with-role-rebind` operation (new in this batch) — the
      operation that hosts this bug.

  Doc-side recommended action: extend the live owners page and the
  permissions page with an explicit warning: "API consumers calling
  PUT /api/owners/{owner_id}: the `roles` field is treated as a
  REPLACE-SET. Omitting `roles` or sending `roles: []` STRIPS ALL
  role bindings from the Owner. Always send the complete current
  `roles` list." Equivalent severity to LSN-001 (the attachment-
  storage default that wiped production data on restart) — same
  shape: a reasonable expectation produces destructive behaviour
  silently.

  Backlog action proposed: file DOC-NNN follow-up + log upstream
  GitHub issue for the OpenAPI contract: mark `roles` as required,
  OR introduce a PATCH endpoint for partial updates.
