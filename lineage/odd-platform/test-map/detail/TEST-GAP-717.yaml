behaviour: |-
  **CROSS-CUTTING SYSTEMIC GAP — ALL FOUR BATCH-T CONTROLLERS HAVE ZERO DIRECT WebFluxTest / WebTestClient HTTP-TIER TESTS.** Grep verification 2026-05-20 across `odd-platform-api/src/test`:
  - `find -name 'ActivityController*'` → 0 matches; `Grep 'ActivityController|getActivity|api/activity'` → 0 files
  - `find -name 'AppInfoController*'` and `Grep 'AppInfoController|getAppInfo|api/appInfo'` → 0 files
  - `find -name 'DataQualityController*'` → 0 matches; the only DQ tests are calculator-tier (`SLAColourTest`, `SLAReportTest`) and repository-tier — NO HTTP boundary
  - `find -name 'DirectoryTest*'` → 1 file at `odd-platform-api/src/test/java/.../api/DirectoryTest.java:30-159` — covers levels 1+2 only; level-3 (entity types) and level-4 (paged entities) are untouched
  **What's lost by the absence**: every regression at the OpenAPI-binding boundary (parameter name / type / required, content-negotiation, content-type, error-status mapping), every regression in the SecurityConstants → SecurityWebFilterChain wiring (path matcher → permission gate composition), every regression in WebFlux → service → repository plumbing (Mono signature preservation, reactive backpressure, exception translation), every regression in OpenAPI-generated DTO serialisation (Jackson polymorphism, optional-field nullability) goes UNDETECTED. The platform's test posture is calculator-tier + repository-tier-strong; the integration boundary that combines them is unstrung. The 4 batch-T controllers expose 12 endpoints (Activity: 2, AppInfo: 1, DataQuality: 5, Directory: 4); ALL TWELVE are reachable in production without a single contract-level test asserting the HTTP-binding wiring. **Why CRITICAL not HIGH**: of the 12 endpoints, at least 4 are security-relevant (TEST-GAP-706 — ActivityController cross-owner audit, TEST-GAP-708 — AppInfo DISABLED-mode fingerprint, TEST-GAP-709 — DataQuality owner-scoping asymmetry, the lone PUT setDataQATestSeverity owner-gate). The combination of unsecured-by-pattern + untested-at-the-boundary is precisely what LSN-001 and LSN-002 warned about: a future maintainer changes the boundary, the change ships, the breakage manifests in operator deployments before any test gate catches it. **Pattern, not just isolated gap**: this is the controller-tier instance of the systemic pattern documented in TEST-GAP-001 (AlertController HTTP-tier smoke) — repeating across the four new controllers brings the cumulative gap count to 16+ controllers across the batch-T sidecar set with zero HTTP-tier coverage.
