name: |-
  Broken debouncer pattern — useDebouncedCallback recreated on every render loses rate-limit semantics (TermSearch primary source)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-06
  - P-01
description: |-
  NEW INVARIANT, batch 2026-05-20U — surfaced by primary-source
  examination of TermSearch.tsx in batch U. The Dictionary tab's
  filter-sidebar facet-state debouncer is structurally broken: the
  intended 1500ms leading-edge debounce does NOT actually rate-limit
  facet-state PUT requests because the useDebouncedCallback instance
  is RECREATED on every facet-state change. Every click constructs
  a NEW debouncer; the prior debouncer's pending timer is garbage-collected;
  with leading-edge, every NEW instance fires immediately on first
  call.

  THE BATCH-U PRIMARY-SOURCE EVIDENCE (TermSearch.tsx sidecar):

    TermSearch.tsx:50-64 — the debouncer wiring:
      const updateSearchFacets = useCallback(
        useDebouncedCallback(
          () => dispatch(updateTermSearch({
            searchId: termSearchId,
            termSearchFormData: {
              query: termSearchQuery,
              filters: mapValues(termSearchFacetParams, values),
            },
          })),
          1500,
          { leading: true },
        ),
        [termSearchId, termSearchFacetParams],
      );

    The useCallback deps array includes termSearchFacetParams — which
    CHANGES on every facet click (a user toggling a facet flips the
    syncedState of one facetOption, which mutates the
    state.termSearch.facetState selected reference). Each click
    constructs a NEW useDebouncedCallback(...) instance; the prior
    debouncer's pending timer is GARBAGE COLLECTED because the new
    function reference is what the next render uses.

    With { leading: true }, the new debouncer fires on its FIRST call
    (immediately, before the 1500ms wait). The intended 1500ms
    trailing-coalesce never fires because the next click constructs
    yet another debouncer.

  THE NET BEHAVIOUR:

    Intended: a user rapidly clicking 5 facets in 2 seconds dispatches
    1 PUT to /api/termsearch (the leading-edge fires on the first
    click; subsequent clicks coalesce into the same dispatch).

    Actual: each click constructs a new debouncer + each new debouncer
    fires immediately on its first call. 5 clicks in 2 seconds
    produce 5 PUT requests. The 1500ms is not rate-limiting anything.

  WHY THIS IS A REAL BUG (not academic):

    Server-side cost: each PUT /api/termsearch/searchId hits
    TermSearchService.updateFacets which recomputes the facet state
    server-side per the search-session model. Per the
    search-catalog-faceted-session-as-server-state operation, the
    server cost scales O(# facet options x # facets). For a moderate
    catalog (e.g., 1000 terms x 7 facet types), each PUT may take
    50-200ms server-side. 5 unintended PUTs per 2-second window add
    250-1000ms of unnecessary server work.

    User-visible latency: the optimistic UI applies the local facet
    change immediately, but the SERVER-side state lags by 5 PUTs.
    During the 2-second window, the search results show stale state
    relative to the facet sidebar — each PUT response overwrites the
    Redux state with the server's view, which may not include the
    latest facet click yet in flight.

    Race shape: per the TermSearch batch U sidecar's
    downstream_side_effects table — 'Concurrent facet changes during
    in-flight PUT: the slice's updateTermsSearchState merger preserves
    local selected !== syncedState divergences, so the in-flight
    server response does NOT overwrite the user's newest selection.
    Eventually consistent.' The merger absorbs the racing PUTs; the
    visible failure is wasted server work, not corrupted UI state.

  THE PATTERN GENERALISATION:

    The useDebouncedCallback-recreated-on-every-render pattern is a
    KNOWN React anti-pattern across the ecosystem (the use-debounce
    library's documentation explicitly warns against including the
    debounced-handler-state in useCallback deps). In odd-platform-ui,
    THIS is the FIRST primary-source instance the substrate has
    surfaced — batch U is the disclosure point. Other debouncer
    use-sites across the codebase (e.g., the data-entity search input
    at /search/*, the Management list search inputs at /policies,
    /roles, /owners, /collectors) should be audited for the same
    shape.

    Cross-batch coherence check: the batch-Q invariant
    manage-management-catalogue-list-with-debounced-search-and-infinite-scroll-permission-gated-mutations
    documents the Management list search debouncer pattern but does
    NOT explicitly verify the deps array's correctness — a follow-up
    audit per this invariant is warranted.

  THE REMEDIATION OPTIONS:

    (a) Move termSearchFacetParams OUT of the useCallback deps and
        capture it via a ref:
          const facetParamsRef = useRef(termSearchFacetParams);
          useEffect(() => { facetParamsRef.current = termSearchFacetParams; });
          const updateSearchFacets = useCallback(
            useDebouncedCallback(
              () => dispatch(updateTermSearch({
                ...,
                filters: mapValues(facetParamsRef.current, values),
              })),
              1500, { leading: true },
            ),
            [termSearchId], // ← STABLE deps; debouncer survives across renders
          );
        Cost: ref-mechanic adds complexity; the leading-edge fires
        based on the FIRST instance's first call which is correct.

    (b) Use useMemo for the debouncer instance with stable deps:
          const updateSearchFacets = useMemo(
            () => debounce(
              () => dispatch(updateTermSearch({...})),
              1500, { leading: true },
            ),
            [termSearchId], // STABLE deps
          );
        Inside the debouncer body, read termSearchFacetParams via
        useAppSelector at dispatch time (NOT via closure). Cost: the
        dispatch logic shifts to a thunk that reads state directly.

    (c) Switch to a useEffect-driven debounce — coalesce facet
        clicks into a setTimeout, clearTimeout on each new click:
          useEffect(() => {
            if (termSearchFacetsSynced) return;
            const handle = setTimeout(() => dispatch(updateTermSearch({...})), 1500);
            return () => clearTimeout(handle);
          }, [termSearchFacetParams]);
        Cost: trailing-only (no leading); the FIRST click waits 1500ms
        before the first dispatch — different UX from the current
        intent.

    (d) Live measurement first (per the LSN-017 measurement-truth
        principle): promote the LSN-017 P-N probe shape to count
        dispatch cardinality per N facet clicks in M seconds. Pin
        the buggy count, then re-run after the fix to confirm.

  SEVERITY MEDIUM — functional bug (the rate-limit intent is not
  realised); server-side cost is real but bounded; the slice's
  merger logic absorbs the racing PUTs so the visible failure is
  wasted server work, not corrupted UI state.

  CROSS-COMPONENT EXTENSION CANDIDATE:

    Per the batch U sidecar's coherence_check, additional debouncer
    sites likely exist at:
      - Search.tsx (Discovery pillar's data-entity search at /search/*).
      - Management list search inputs (PolicyList, RolesList, OwnersList,
        CollectorsList — batch Q).
      - DataQuality dashboard filters (P-04 — batch T DataQualityController
        does not surface UI evidence; UI sidecars not yet enriched).

    Each is a candidate for the same broken-debouncer pattern. A
    follow-up audit batch should enumerate every useDebouncedCallback
    + every debounce call across odd-platform-ui/src and verify the
    deps array discipline. The bug class is bigger than this one
    component.

  ## STRENGTHENED — batch ZL (2026-05-26) — Search.tsx SECOND PRIMARY INSTANCE confirmed

  Batch ZL adds the Search.tsx primary-source sidecar
  (odd-platform__ts__react-component__component__Search.md) confirming
  the IDENTICAL bug at the data-entity Catalog page. The
  CROSS-COMPONENT EXTENSION CANDIDATE above explicitly named
  Search.tsx as a likely site; batch ZL is the disclosure point.

  THE SEARCH.TSX PRIMARY-SOURCE EVIDENCE:

    Search.tsx:50-65 — the debouncer wiring (verbatim):
      const updateSearchFacets = useCallback(
        useDebouncedCallback(
          () => dispatch(updateDataEntitiesSearch({
            searchId,
            searchFormData: {
              query: searchQuery,
              myObjects: searchMyObjects,
              pageSize: 30,
              filters: mapValues(searchFacetParams, values),
            },
          })),
          1500,
          { leading: true },
        ),
        [searchId, searchFacetParams],
      );

    Structural shape is IDENTICAL to TermSearch.tsx:50-64. Same
    useCallback wrapping useDebouncedCallback. Same 1500ms
    leading-edge intent. Same deps array including the facet-
    params reference that mutates on every click. Same bug:
    the debouncer is recreated on every click; the rate-limit
    intent is unrealised.

  BOTH FILES WERE AUTHORED FROM THE SAME TEMPLATE:
    Verified via Grep `PageWithLeftSidebar.MainContainer` returning
    both files. Search.tsx is the CANONICAL/OLDER instance;
    TermSearch.tsx is the term-catalog clone (per Search.tsx
    sidecar implicit_adrs note). The bug PROPAGATED through
    clone.

  PER-CLICK BACKEND COST AT SEARCH.TSX IS LIKELY HIGHER:
    The data-entity catalog faceted search has 7 facets per
    docs WebFetch 2026-05-20 vs TermSearch's 4-5 facets. Each
    PUT triggers per-facet aggregate count recomputation; the
    fan-out cost scales with facet count. Search.tsx is the
    more expensive instance of the bug.

  CROSS-LINK — security compound: per batch ZL Search.tsx is
  the entry surface for the FTS-injection / session-poisoning
  chain (REFACTOR-229 family) and the TRUE SQL injection at the
  highlightDataEntity path. The broken-debouncer compounds the
  security cost: every click forwards the raw user-controlled
  query text to the backend (no client-side sanitisation), so
  5 clicks instead of 1 means 5 attempts at the injection
  sinks per user attempt.

  THE FIX MUST LAND AT BOTH SITES — a maintainer fixing one
  but not the other ships partial relief. The two PRs can
  travel together; the refactor strategy is structurally
  identical at both call sites.

  REVISED EXTENSION-CANDIDATE LIST (post-batch-ZL):
    - Search.tsx — CONFIRMED batch ZL (this strengthening)
    - TermSearch.tsx — CONFIRMED batch U (original primary)
    - LookupTables.tsx — per-keystroke search dispatch via
      SearchInput.onSearch; debounce policy in shared infra;
      PROBE-NEEDED
    - Management list components — per batch Q; follow-up
      audit candidate
    - DataQuality dashboard filters (P-04) — batch ZC may
      already capture the shape

  POST-STRENGTHEN TRIANGULATION: 2 primary instances
  (TermSearch + Search). Audit cost reduced; one PR fixes both;
  one regression test covers both.
