proposed_action: 'Add a parameterised `SearchFTSQuerySyntaxTest` covering: (a) `foo!bar`
  → 500 syntax-error; (b) `(foo)` → 500; (c) `a<->b` → 500; (d) `foo:` → 500; (e)
  `foo & bar` (balanced) → 200 with re-interpreted semantics. Drives the fix (either
  sanitise via `quote_literal` + `phraseto_tsquery`, or catch and translate to 400
  BadUserRequest). Note batch M adds TEST-GAP-520 for the facet endpoint invocation
  surface specifically (4 facet aggregators + 1 aggregate endpoint = 5 additional
  call sites) — that test pins the PERSISTENCE half (the /search endpoint malforms
  transiently; the facet endpoints malform persistently). The two tests together
  cover the full attack surface.'
