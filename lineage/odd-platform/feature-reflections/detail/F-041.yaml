- id: H-009
  hypothesis: |-
    When an operator edits the App Info "additional links" (odd.links) in config and restarts the backend,
    users see the updated link list.
  derivation: |-
    Negative-space — operators expect a config change to reach the UI; the senior-PO customisability
    question (the only operator-customisable part of the chrome is odd.links).
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      The link list IS updated on a fresh page load, but NOT within a long-lived SPA tab. AppInfoMenu uses
      MUI keepMounted (line 90) — the menu DOM stays mounted for the SPA's lifetime after the first hover.
      useAppInfo / useAppLinks (lib/hooks/api/appInfo.ts:4-17) set no staleTime and no refetchInterval, and
      no invalidateQueries references 'appInfo'/'appLinks' anywhere in the codebase — so the first mount
      populates the list and it is never re-fetched. Combined with the backend's boot-immutable
      @ConfigurationProperties (odd.links bound once at startup), an operator who edits odd.links and restarts
      the backend will STILL see the OLD list in any SPA tab opened before the restart, until a full page
      reload. Partial: the change reaches new sessions; existing sessions are silently stale.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: bugs_limitations_corner_cases + stress_findings.resource_boundaries (cache)
        cite: "AppInfoMenu.tsx:90 (keepMounted) + lib/hooks/api/appInfo.ts:11-17 (no staleTime/refetchInterval)"
        note: "first-mount-only fetch + keepMounted → operator edits invisible until full reload; cross-ref REFACTOR-631 + F-035."
    operator_visible_failure: |-
      An operator updates a runbook/dashboard link in odd.links, restarts, and tells the team "the new link is
      live" — but every user with a long-lived ODD tab continues to see the old list (or a removed link) until
      they happen to full-reload. Failure modes: (1) a removed/corrected link persists in active sessions,
      including a stale link the operator intended to retract; (2) the staleness window is unbounded (it ends
      only on manual reload), so it can persist for days on a kept-open tab; (3) the operator has no way to
      know which users are stale. The boot-immutable backend is the documented root (REFACTOR-631 / F-035); the
      chrome's keepMounted + staleTime=0-never-refetched is the UI amplifier.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_ref: ""

- id: H-010
  hypothesis: |-
    When a user switches the UI language from the toolbar and later returns — even on a different device or
    after clearing browser data — the platform remembers their language choice.
  derivation: |-
    Senior-PO customisability + cross-device question — language is a per-user preference; a user expects
    it to follow their account, as it does for most platform settings.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      Language preference is persisted CLIENT-SIDE ONLY: SelectLanguage.tsx:30 writes
      localStorage.setItem('i18nextLng', lang); locales/i18n.ts:22 reads it back on next page-load. There is
      no backend call, no user-profile binding, no cookie — a grep for 'i18nextLng' across
      odd-platform-api/src/main/java returns zero matches. A user signing in on a new device, a new browser, in
      private mode, or after clearing site data lands on default English regardless of how many times they
      previously chose another locale elsewhere. Additionally, the first-visit language never consults
      navigator.language (i18n.ts:22 falls back to a hardcoded 'en'), so a Spanish-browser user sees English
      on first visit and must find the switcher (which is itself in English) to change it.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar__ui-shell-widget__SelectLanguage.md
        section: implicit_adrs + bugs_limitations_corner_cases
        cite: "SelectLanguage.tsx:30 (localStorage write) + locales/i18n.ts:22 (read) + grep i18nextLng in odd-platform-api = 0"
        note: "browser-local only; no server-side preference; navigator.language never consulted on first visit."
    operator_visible_failure: |-
      An operator deploying ODD for a non-English team must rely on EVERY user finding the toolbar menu and
      choosing their language on EVERY device they use — there is no org default and no per-account
