behaviour: |-
  **`DataEntityRunController` has ZERO HTTP-tier test coverage** — the controller is the entry point for the per-DQ-test / per-transformer `/history` UI tab (`TestRunsHistory.tsx:24-122`) plus the test-report-details first-10-runs preview (`TestReportDetailsHistory.tsx:30-32`) plus any third-party API consumer hitting `GET /api/dataentities/{data_entity_id}/runs`. The repository tier IS covered (`DataEntityRunRepositoryImplTest.java:34-93` exercises ordering, pagination, status filter at the SQL layer), but the controller HTTP boundary is unverified.

  **Uncovered HTTP paths**:
  - **404 path**: `dataEntityRepository.get(dataEntityId).switchIfEmpty(NotFoundException("Data entity", id))` (`DataEntityRunServiceImpl.java:32-34`) — never asserted at the wire.
  - **400 path**: entity-class gate at `DataEntityRunServiceImpl.java:35-44` throws `BadUserRequestException("Data entity with id %d is not supposed to have runs due to its class")` when the entity is neither DATA_TRANSFORMER (id 2) nor DATA_QUALITY_TEST (id 4) — never asserted at the wire.
  - **200-with-empty-list path**: a transformer / DQ-test with zero historical runs returns `DataEntityRunList{items:[], pageInfo:{total:0, hasNext:false}}` — never asserted at the wire.
  - **Wire-enum unmarshal failure path** (P-151 hypothesis): a result set containing a RUNNING row triggers MapStruct's `Enum.valueOf()` `IllegalArgumentException` → HTTP 500 → page UNAVAILABLE during in-flight tests (see TEST-GAP-979 for the pinned version).
  - **Mapper output shape**: every row's `statusReason` is rendered verbatim from `data_entity_task_run.status_reason` — the controller's content-negotiation, Jackson serialisation of `OffsetDateTime` fields, and the wire-enum mapping are all unverified.

  A regression in: WebFlux routing, OpenAPI-generated `@RequestParam` deserialisation of the `status` query param, the `Mono.map(ResponseEntity::ok)` composition, content-negotiation, Jackson serialisation of the nested envelope — would silently break the `/history` UI tab with the build still green.
