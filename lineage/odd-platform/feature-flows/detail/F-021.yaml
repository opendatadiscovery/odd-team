      (info.getOldState().equals(newState) at ActivityAspect.java:86)
      and persistence (activityRepository.saveReturning at
      ActivityServiceImpl.java:50) happen OUTSIDE the handler. The
      18 concrete impls verified read-only. The interface SHOULD be
      named ActivityStateDiffer / ActivitySnapshotProvider.
    expected: |-
      Either (a) rename interface to reflect snapshot-differ
      semantics, OR (b) JavaDoc on the interface name that the
      "handler" word is colloquial — the actual contract is read
      snapshot pair + the AOP advice does the diff and write.
    drift_class: activity_handler_interface_misnamed_state_snapshot_differ_not_write_handler
    provenance: |-
      PRIMARY-SOURCE — ActivityHandler.java:9-22 (4-method
      interface, all read-only) + 18 concrete impl Glob
      verification + ActivityAspect.java:86 (diff lives outside
      handler) + ActivityServiceImpl.java:50 (write lives outside
      handler). Severity: MEDIUM (name-vs-behaviour drift class —
      the LSN-019 recurring shape; surfaced via Stress Protocol
      Category B). Source batch: VAL-LSN-019-B.
  - facet: Activity emit couples rollback to business mutation
    observed: |-
      `ActivityAspect.monoActivityAspect` carries
      `@ReactiveTransactional` at ActivityAspect.java:42, wrapping
      the WHOLE @ActivityLog-annotated business method PLUS the
      `postActivity` call to `activityService.createActivityEvent`
      in ONE transaction. ActivityServiceImpl itself has NO local
      @ReactiveTransactional. Activity-repository write failure
      rolls back the user's actual business mutation; the user
