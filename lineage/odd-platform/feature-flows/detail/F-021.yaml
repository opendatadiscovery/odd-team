    (2) NEW UI-TIER DRIFT FACET — `User` FILTER LABEL MISLEADS COMPLIANCE
    REVIEWERS (HIGH, the F-021 LSN-020 surface MANIFESTS AT THE OPERATOR
    INPUT). `Filters.tsx:93-98` labels the filter `t('User')`; live doc
    at `https://docs.opendatadiscovery.org/features/active-platform-features/activity-feed`
    (WebFetched 2026-05-26 status 200) describes it as "show events
    PERFORMED BY one or more selected users" — both promises imply
    filtering by who-performed-the-action. The backend SQL (per
    F-021's existing `provider_agnostic_actor_resolution_cross_mode_bleed`
    + LSN-020) binds `userIds` to `USER_OWNER_MAPPING.OWNER_ID.in(userIds)`
    — filters by owner-of-entity via the user-owner mapping, NOT by
    the actual actor (`activity.created_by`). A security/compliance
    reviewer setting `userIds=[insider-suspect-id]` to audit that
    user's actions gets rows of activity on entities OWNED BY that
    user-via-mapping, NOT actions PERFORMED BY that user. Misses the
    actual actor entirely. The UI label + the doc both reinforce the
    wrong promise; the SQL silently translates. **This is the F-021
    LSN-020-class semantic drift at the UI input surface where
    operators first encounter the misleading label** — distinct from
    F-021's existing facet which captured the SQL-side translation.
    NEW DRIFT FACET to add to drift_class_summary:
    `user_filter_label_promises_actor_axis_sql_binds_owner_of_entity_axis_ui_doc_both_misleading`.

    (3) NEW UI-TIER DRIFT FACET — DEFAULT-WINDOW URL-SHARE TIME-RELATIVE
    DRIFT (MEDIUM, share-time semantics). `Activity/common.ts:33-41`
    recomputes `beginDate`/`endDate` at module-eval time via
    `addDays(new Date(), -5)` / `+1` — NOT URL-stamped. The route does
    NOT redirect from bare `/activity` to `/activity?<defaults>`;
    visiting `/activity` directly relies on `ActivityResults.tsx:26`
    calling `useQueryParams<ActivityQuery>(defaultActivityQuery)` to
    fill in defaults at React-state layer. The URL bar stays bare
    `/activity` while the page renders the default 6-day window with
    `type=ALL`. Sharing the URL with a colleague then surfaces the
    same default 6-day window relative to THEIR `now`, NOT the
    original visitor's `now` — silent semantic drift across share-time.
    Operators who expect "the URL I shared = the view I saw" will be
    surprised when forensic-investigation contexts span days. NEW
    DRIFT FACET candidate (intersects F-021's existing
    `doc_silence_on_visibility_type_filter_pagination_ordering_partition_lifecycle`).

    (4) DOC-PAGE TABS-NOT-DOCUMENTED (LOW, doc-gap). The doc page does
    not enumerate the four tabs `ActivityType.ALL` / `MY_OBJECTS` /
    `DOWNSTREAM` / `UPSTREAM` implemented at `ActivityTabs.tsx:29-51`.
    The page's only navigation discussion is the global-vs-per-entity
    split. STRENGTHENS F-021's existing
    `doc_silence_on_visibility_type_filter_pagination_ordering_partition_lifecycle`
    facet from the UI-layer angle: operators do not know the 4 tabs
    exist or the owner-scoping each implies.

    (5) DOC-PAGE ACCESS-CONTROL SILENCE (HIGH, refinement). The doc
    page contains NO discussion of access control / who can view the
    global Activity page. Reachable by every authenticated user (and
    every caller under `auth.type=DISABLED`); an operator reading the
    doc would not know the global audit trail is platform-wide visible.
    STRENGTHENS F-021's existing `doc_silence_on_cross_owner_default_read`
    facet with the WebFetch 2026-05-26 status 200 confirmation that
    the doc page still has no Visibility section.

    (6) `WithPermissionsProvider` NON-BLOCKING SYSTEMIC FINDING APPLIES
    HERE TOO (LOW, contextual). Even where `WithPermissionsProvider`
    IS used elsewhere (e.g. `lookupTablesPath`), it provides a
    permission CONTEXT for descendants to consult; it does NOT block
    render or redirect on its own (`WithPermissionsProvider.tsx:12-49`
    — all three render branches unconditionally render the child).
    For Activity there is no protection at all. The ZH systemic finding
    (the wrapper is named like a gate but behaves like a context)
    applies inherently; recorded so a future fix wrapping `/activity`
    in `WithPermissionsProvider` is recognised as INSUFFICIENT — it
    would need to be combined with a render-block check at the
    wrapped component's top.

    Probe emitted by the sidecar: P-166 pins the auth-mode visual
    outcome on /activity end-to-end (unauthenticated under DISABLED;
    no-owner/no-role authenticated under LOGIN_FORM/OAUTH2/LDAP).

    Coherence sweep STRENGTHENS=3 (F-021 existing facets reaffirmed at
    UI tier; F-011 provider-agnostic JOIN cross-mode bleed extended
    to UI-input layer; F-007 sibling Active Platform Features pillar
    posture confirmed). SUPERSEDES=0. CONFLICTS=0.
