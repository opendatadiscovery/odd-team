  expected_outcome: |
    Run locally (Testcontainers Postgres + the platform): fire two concurrent PUT edits to the same
    data source id, each changing a different field. EXPECTED (hypothesis): the platform detects the
    conflict (optimistic-lock / version) and one edit is rejected or both merge. ACTUAL (static
    prediction to confirm): no version column exists (DataSourceServiceImpl.java:68-83), so it is
