proposed_action: |-
  Add `RoleServiceImplTest.create_administratorOrUserName_succeedsAtServiceLayer_onlyDbUniqueIndexDefends_pinsCreatePathAsymmetry`. (a) Testcontainers integration test. (b) Authenticate as a user with `ROLE_CREATE` permission. (c) FIRST: POST /api/roles with `{"name": "Administrator"}` — assert HTTP 400 with body containing 'Role with this name already exists' (the DB UNIQUE constraint kicks in because the seeded Administrator row is live). (d) SECOND: directly soft-delete the seeded Administrator role via DB UPDATE (simulating an out-of-band soft-delete). (e) POST /api/roles with `{"name": "Administrator"}` — assert HTTP 200 with a NEW role id (the create-path service has NO name-guard; the DB unique index no longer fires because the seeded row is soft-deleted). (f) Add a `// REGRESSION-PIN — RoleServiceImpl.create has NO name-reservation guard. Administrator and User are reserved against UPDATE/DELETE but NOT CREATE. The DB partial UNIQUE INDEX is the only defence and is bypassable on out-of-band soft-delete. A REFACTOR adding a service-layer name-guard at lines 50-51 will break step (e), making the fix deliberate.` comment block.
