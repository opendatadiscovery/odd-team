behaviour: |-
  **HIGH — Duplicate ODDRNs within a single `DataEntityList` payload CRASH the entire ingestion with `IllegalStateException: Duplicate key`. Caller receives 5xx with no structured 400 error message.**

  Mechanism (`IngestionServiceImpl.java:86`):
  ```java
  ingestionDtoMap = items.stream()
      .map(d -> mapper.createIngestionDto(d, dataSourceId))
      .collect(Collectors.toMap(DataEntityIngestionDto::getOddrn, identity()));  // ← two-arg → throwing merger
  ```

  The `Collectors.toMap(keyMapper, valueMapper)` overload uses Java's default throwing merge function (per `Collectors.uniqKeysMapMerger`). If the same ODDRN appears twice in the inbound `items` list, the merger throws `IllegalStateException("Duplicate key " + key)`.

  **Failure chain**:
  1. Collector emits two `DataEntity` records with the same ODDRN in one `DataEntityList` (e.g. a Postgres collector enumerating the same table via two different schemas due to a search_path bug).
  2. `IngestionServiceImpl.persistDataEntities` throws `IllegalStateException: Duplicate key urn:...` mid-stream.
  3. The exception escapes the `@ReactiveTransactional` boundary; Postgres rolls back the entire batch (per TEST-GAP-831).
  4. WebFlux default error handler returns HTTP 500 with the stack trace in the response body.
  5. Operator sees a 500 with `IllegalStateException` — confusing, because they expected either a 400 "Duplicate ODDRN" structured error OR silent dedup.

  **Why HIGH** (the sidecar rates this as untested behaviour without a severity):
  - The crash is DETERMINISTIC for the duplicate-ODDRN input — every retry with the same input fails the same way.
  - The error message is OPAQUE — collectors must reverse-engineer "Duplicate key in toMap" → "your payload has duplicate ODDRNs".
  - The decision (crash vs silently dedup vs return 400) is undocumented + untested + load-bearing for every collector's idempotency story.

  **Test gap shape**: regression-pin test that
  1. POSTs a `DataEntityList` with 5 entities where two share the same ODDRN.
  2. Asserts 5xx (the current crash behaviour).
  3. Asserts the response body / log line contains `Duplicate key` (the implementation detail leak).
  4. Pairs with REFACTOR-NNN (either structured 400 OR silent dedup; the choice is the maintainer's).

  PINS the current behaviour so future refactors (silent dedup) are deliberate.
