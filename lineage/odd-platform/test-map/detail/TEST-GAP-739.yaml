surfaced_by:
  - "ReferenceDataController.md:security.known_security_gaps.[2] (Permission scope is global (NO_CONTEXT resolver) — a Policy granting LOOKUP_TABLE_UPDATE permits modifying ANY lookup table, not just those owned by the user's Owner. Inconsistent with TERM (TERM resolver) and DATA_ENTITY (DATA_ENTITY resolver) scoping in the same SecurityConstants table — severity MEDIUM)"
  - "ReferenceDataController.md:security.authorization_assertions (All 9 rules use NO_CONTEXT resolver — the lookup_table_id in the URL is NOT used to scope the permission to the specific table's owners — any user with the LOOKUP_TABLE_* permission via ANY Policy can mutate ANY lookup table)"
  - "ReferenceDataController.md:bugs_limitations_corner_cases.[5] (updateLookupTableField discards the lookupTableId path parameter — a client could PATCH /api/referencedata/table/999/column/{column_id} and the update succeeds regardless of whether columnId belongs to table 999)"
behaviour: |-
  **MEDIUM — All 9 LOOKUP_TABLE_* SecurityRules use the `NO_CONTEXT` permission resolver, meaning a Policy granting `LOOKUP_TABLE_UPDATE` permits modifying ANY lookup table platform-wide, NOT scoped to the user's Owner-attached lookup tables.** Primary-source confirmed in the batch-V ReferenceDataController sidecar:

  - **Permission scope is global**: `SecurityConstants.java:114, 325-354` declare 9 `SecurityRule` entries for the Lookup Tables controller. Every entry uses `NO_CONTEXT` as the first argument to `new SecurityRule(NO_CONTEXT, ...)`. The `NO_CONTEXT` resolver means: when authorizing a request, the manager checks whether the caller holds the named permission VIA ANY POLICY — without resolving the URL's `lookup_table_id` to the table's owner context.
  - **Contrast with TERM and DATA_ENTITY scoping**: `SecurityConstants.java:174-193` declares TERM-scoped rules (using `TERM` resolver) — these resolve the URL's `term_id` to the term's owner, then check whether the caller holds the permission VIA A POLICY ATTACHED TO AN OWNER MATCHING THE TERM'S OWNER. Similarly `SecurityConstants.java:194-227` declares DATA_ENTITY-scoped rules. The Lookup Tables surface is the ONLY ASYMMETRIC ENTRY in the SECURITY_RULES table — every other resource has resource-scoped permissions.
  - **Effective grant blast radius**: an operator who authors a Role "Lookup Tables Steward" with `LOOKUP_TABLE_UPDATE` attached to an Owner "finance-team" expects the Role to grant mutation rights on lookup tables owned by `finance-team`. The code grants mutation rights on EVERY lookup table in the platform.

  **Compound with `updateLookupTableField` discarded-path-param (TEST-GAP-744)**: the NO_CONTEXT permission grant + the discarded `lookupTableId` parameter at `updateLookupTableField` (per `bugs_limitations_corner_cases.[5]`) compound: even if the operator authored a Policy that would restrict to specific table IDs, the PATCH endpoint would bypass that restriction because the service signature discards the path's lookupTableId.

  **Operator-observable consequences**:
  - An operator authoring `LOOKUP_TABLE_DEFINITION_UPDATE` for a single team-owner expects scoped grant. The actual grant is platform-wide. A team-steward inadvertently modifies a sibling team's reference data with the WRONG team's-name in their commit message.
  - The Lookup Tables surface contains operator-curated reference data — historically sensitive (employee-tier mappings, customer-segment codes, etc.). Cross-team blast radius means data-quality compromises spill across teams.
  - The asymmetry with TERM/DATA_ENTITY/DEG scoping is architecturally inconsistent — operators familiar with the platform's other scoping models may not realise Lookup Tables are platform-global.

  **Why MEDIUM not HIGH**: the bug is a PERMISSION-MODEL asymmetry, not a per-call bypass. Users still need `LOOKUP_TABLE_*` permissions to mutate. The asymmetry is between "scoped permission" (the operator's mental model) and "global permission" (the actual gate). This is a MEDIUM-severity scoping bug. Cross-pillar P-03 + P-09 keeps it from being LOW.

  **Test gap shape**: regression-pin asserting that a user holding `LOOKUP_TABLE_UPDATE` via a Policy attached to Owner A can MUTATE a lookup table whose linked DataEntity is owned by Owner B (the cross-owner mutation). Pin the asymmetry with a sister test asserting that TERM_UPDATE / DATA_ENTITY-UPDATE require owner-scoping.
