proposed_action: Add an `AlertServiceImplExternalAlertSpoofTest` that POSTs an AlertManager
  payload with a known-good `entity_oddrn` AND an unrelated victim `entity_oddrn`; assert
  the platform records a DISTRIBUTION_ANOMALY alert on the victim entity with no error
  return path. Pin the current behaviour so a future principal-validation fix is detected.
