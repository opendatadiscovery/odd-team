behaviour: |-
  Unbounded-pagination-size DoS-amp regression-pin for getDataEntityAlerts (HIGH — audit-export workaround amplification). The controller does NOT validate `page` or `size` (DataEntityController.java:317-318 — `Integer page, Integer size` without validation annotations); the OpenAPI `PageParam`/`SizeParam` at components.yaml:4213-4229 carry NO `minimum:` or `maximum:`; the repository computes `OFFSET = (page - 1) * size` (ReactiveAlertRepositoryImpl.java:189) with NO clamping. A caller passing `size=1000000` triggers a single jOOQ query bounded only by what Postgres / network buffers tolerate. The audit-export workaround use case from the live alerting doc (WebFetched 2026-05-19) AMPLIFIES the risk: operators naturally want large pages to complete an export with fewer round-trips. Combined with the AlertManager-derived alert_chunk_list (raw generator-URL strings which can be arbitrarily long), peak memory is proportional to caller-supplied size × per-chunk-length, which has NO upper bound either. Under DISABLED auth-mode the endpoint is anonymously reachable (TEST-GAP-493 cross-ref) AND unbounded — a single curl with `size=1000000` against `/api/dataentities/{id}/alerts` becomes a DoS vector. The deep-pagination cost is O((page-1)*size) — even a moderate page query at page=100, size=1000 forces Postgres to scan 100k rows. Cross-pillar P-07 (Alerts performance) + P-09 (DoS-amp security boundary).
