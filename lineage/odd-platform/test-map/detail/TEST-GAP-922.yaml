behaviour: |-
  **MEDIUM — `DataQualityFilters` instantiates each of the 5 sub-filter components TWICE (one per side), passing a distinct `filterKey` prop typed `keyof DataQualityRunsApiGetDataQualityTestsRunsRequest` (`DataQualityFilters.tsx:70-89`). A copy-paste swap (e.g. `<TitleFilter filterKey='titleIds'/>` placed in the TABLES block where it should be `deTitleIds`) routes the operator's selection to the WRONG side. Both `titleIds` and `deTitleIds` are valid members of the union type — TypeScript compiles cleanly. No test pins the 10 (side × dimension) wiring.**

  **The wiring** (statically certain):
  - Tables block (`DataQualityFilters.tsx:70-74`):
    - `<NamespaceFilter filterKey='deNamespaceIds' />`
    - `<DatasourceFilter filterKey='deDatasourceIds' />`
    - `<OwnerFilter filterKey='deOwnerIds' />`
    - `<TitleFilter filterKey='deTitleIds' />`
    - `<TagFilter filterKey='deTagIds' />`
  - Tests block (`DataQualityFilters.tsx:85-89`):
    - `<NamespaceFilter filterKey='namespaceIds' />`
    - `<DatasourceFilter filterKey='datasourceIds' />`
    - `<OwnerFilter filterKey='ownerIds' />`
    - `<TitleFilter filterKey='titleIds' />`
    - `<TagFilter filterKey='tagIds' />`

  **What can silently break**:
  - Swap two keys within the same block: a maintainer copy-pastes and accidentally writes `<NamespaceFilter filterKey='deDatasourceIds'/>` in the tables block. The Namespace autocomplete now writes its selections to `formFiltersAtom.deDatasourceIds`. The dashboard then filters by datasource where the operator selected a namespace. Compiles cleanly because both are valid request keys.
  - Swap a key across blocks: a maintainer puts `<TitleFilter filterKey='titleIds'/>` in the tables block (should be `deTitleIds`). The operator selects a tables-side filter that mutes the TESTS ring instead of the TABLES rings. Compiles cleanly.
  - Both classes of swap are operator-visible (the dashboard reacts wrongly) but the operator may not realise the cause — the result is "the filter doesn't seem to do what I expected".

  **No test pins this**: the entire DataQuality subtree has zero tests.

  **Test gap shape**: unit test using React Testing Library to render `<DataQualityFilters>` and assert each of the 10 rendered filter component instances has the EXPECTED `filterKey` prop. Either snapshot-test or explicit assertion on each of the 10 slots.
