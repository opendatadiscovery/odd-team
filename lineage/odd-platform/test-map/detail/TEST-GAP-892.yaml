behaviour: |-
  **MEDIUM — the `PUT /api/tags/{tag_id}` (updateTag) response body is a `Tag` with `external` and `usedCount` UNPOPULATED (null/absent). `TagServiceImpl.update` ends with `.map(tagMapper::mapToTag)` applied to a bare `TagPojo` (`:54`); the `mapToTag(TagPojo)` overload (`TagMapper.java:26`) can only map `id, name, important` because `TagPojo` has no `usedCount` or `external` field. The OpenAPI `Tag` schema declares `external` and `usedCount` — so a consumer of `PUT /api/tags/{tag_id}` receives those two fields as null, inconsistent with `getPopularTagList`'s `Tag` items (mapped from `TagDto` via the `mapToTag(TagDto)` overload, which DOES populate them). The `mapToTag(TagDto)` overload is AVAILABLE but unused on this path.** Method-level primary source from the batch-X-TAGGING `updateTag` controller-method sidecar:

  - `TagServiceImpl.update` (`:54`): terminal `.map(tagMapper::mapToTag)` on a bare `TagPojo`.
  - `TagMapper.java:26`: the `mapToTag(TagPojo)` overload — maps `id, name, important` ONLY (`TagPojo` lacks `usedCount` / `external`).
  - `TagMapper.java:23-24`: the `mapToTag(TagDto)` overload — DOES populate `external` and `usedCount` (used by `listMostPopular`).
  - The OpenAPI `Tag` schema (`components.yaml:302-320`) declares `id, name, important, external, usedCount` — so the `updateTag` response under-fills the declared schema (LESS than declared, not over-exposed).

  **Operator-visible consequence**: a UI that re-renders a tag chip from the `updateTag` response loses the usage count and the `external` flag (the chip would show no usage badge and lose its Collector-owned indicator until a `getPopularTagList` refresh). A generated client typed against the OpenAPI `Tag` schema gets two null fields it expects to be populated. Cross-endpoint inconsistency: the SAME `Tag` JSON shape is fully populated by `GET /api/tags` and partially populated by `PUT /api/tags/{id}`.

  **Why this is a real contract gap, not cosmetic**: the OpenAPI schema is the published contract; a partial-fill is a silent spec-vs-code divergence. The fix is trivial (use the available `mapToTag(TagDto)` overload) but no test pins the current behaviour OR the corrected behaviour.

  **Test gap shape**: a `WebTestClient` / `@SpringBootTest` test asserting the `updateTag` response body's `external` and `usedCount` fields — pinning the CURRENT behaviour (both null/absent) so a future maintainer switching to the `mapToTag(TagDto)` overload makes a coordinated, test-visible change.
