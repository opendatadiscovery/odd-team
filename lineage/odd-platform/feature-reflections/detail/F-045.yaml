# Dataset Schema Revision History — product-owner reflection

## product_owner_narrative

Dataset Schema Revision History is a Data Discovery (P-01) sub-feature and one of the platform's highest-leverage operator surfaces: the audit trail of how a dataset's *shape* has changed over time. The promise to a customer is concrete — *every time a collector re-ingests a dataset and its structure has changed, ODD captures a new revision; you can open any dataset, see its current columns (names, types, descriptions, tags, glossary terms, lookup-table definitions), browse the list of past revisions, and pick any two revisions to see exactly which fields were added, removed, or changed* (per the live schema-diff doc page and `DataSetController` sidecar `understanding`). The audience is the data-engineer/analyst doing downstream-impact analysis after a breaking change and the platform UI end-user browsing a dataset (per system-mission.md P-01 audiences). It is the read-side companion of Batch Ingestion (F-008): the `DatasetStructureIngestionRequestProcessor` is the only writer of `dataset_version` rows, monotonically incrementing `version` by +1 on each structure-changing re-ingest (`DatasetStructureIngestionRequestProcessor.java:171-178`, per `DataSetController.md` invariants).

The user reaches it from the per-dataset detail page's **Structure** tab and its **Revision compare** sub-tab (UI route `/dataentities/{id}/structure[/{versionId}]` and `.../structure/compare`, per the F-045 batch-extension ui-review-2026-05-26-K). Four wire-level endpoints back the surface, all `GET /api/datasets/{data_entity_id}/...`: get-latest-structure, get-structure-by-version-id, diff-two-versions, and list-relationships (`DataSetController.java:22-59`, per the hop-1 sidecar). On first mount with no version in the URL, the UI dispatches `fetchDataSetStructureLatest`, then silently rewrites the URL to pin the resolved version id (`DatasetStructureOverview.tsx:32-37`, batch-extension facet 1). The compare viewer seeds its two pickers with the oldest and newest version ids and reads the actual ids from URL query-params (`DatasetStructureCompareHeader.tsx:69-73` + `DatasetStructureCompare.tsx:24-26`).

The working parts a product owner would demo: (a) **latest** — open the Structure tab, see the current schema; (b) **revision pick** — choose an older revision from a dropdown, the table re-renders that revision's columns; (c) **compare** — pick two revisions, see a per-field CREATED / DELETED / UPDATED / NO_CHANGES diff with a client-side "show changes only" filter; (d) **relationships** — a sibling tab listing ERD/foreign-key and graph edges the dataset participates in. The diff is computed server-side by loading both versions' full field lists into memory and walking the nested-field tree to convergence (`DatasetVersionServiceImpl.java:156-180`).

The integration story: Schema Revision History reads what Batch Ingestion (F-008) writes; the schema payload it returns carries the tags and glossary terms applied via Manual Object Tagging (F-018) — so the leak surface (below) is wider than column metadata. It sits inside the data-entity detail page that Detail-Page View Tracking (F-001) enters. Schema changes also feed Alerting (P-07): a backwards-incompatible structure change at ingestion raises a `BACKWARDS_INCOMPATIBLE_SCHEMA` alert (system-mission.md P-05→P-07 edge) — the same revision data, surfaced as an event.

Edge cases a senior product owner would flag in a demo, all load-bearing here: what does the URL's dataset id actually scope (it turns out: nothing, on three of four endpoints — the headline finding)? What does "Latest" mean after an operator replays an old version (it returns the highest version *number*, which may not be the most recent)? What does the user see when they paste a stale or wrong compare URL (an undifferentiated error page, or worse, a 200 nonsensical diff)? And — the question that frames the whole feature for a security reviewer — *can a user see the schema of a dataset their team does not own?* The answer (yes, any authenticated user, anonymous under DISABLED) is the spine of this reflection.

