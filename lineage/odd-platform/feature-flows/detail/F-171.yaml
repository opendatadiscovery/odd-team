pillar_anchored_feature_name: Operator-Facing Owner-Association Triage Workflow (approve/decline pending requests)
feature_name: |-
  Operator-Facing Owner-Association Triage Workflow — the Management →
  Associations UI's "New requests" tab lists every PENDING
  OwnerAssociationRequest (status = PENDING) with per-row Accept / Reject
  affordances gated by Permission.OWNER_ASSOCIATION_MANAGE. The
  operator-USE side of F-075's two-step branch (A): an admin reviews
  newly-submitted self-requests and confirms or rejects them via a
  ConfirmationDialog → PUT /api/owner_association_request/{id} with
  status APPROVED or DECLINED. Distinct from F-075 (the user-self-CREATE
  surface), F-172 (the admin direct-bind that bypasses the request flow),
  and F-173 (the unbind operation on already-approved associations).
