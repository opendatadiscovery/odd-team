name: |-
  Attachment GET endpoints have NO SecurityRule — any authenticated user can list + download any data entity's files/links (DataEntityAttachmentController HIGH)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20V — surfaced by primary-source
  examination of the attachment-read endpoints in DataEntityAttachmentController
  batch V. Three of the controller's ten endpoints are READS (getAttachments,
  getUploadOptions, downloadFile). NONE of them have a SecurityRule entry in
  SecurityConstants.java:247-276 (which lists ONLY POST/PUT/DELETE matchers
  for /files/** and /links/**). The reads fall back to the global authentication
  filter — any authenticated user (LOGIN_FORM / OAUTH2 / LDAP) can list and
  download files attached to ANY data entity, regardless of Owner or RBAC
  permissions.

  THE EVIDENCE — file:line citations from the batch V sidecar:

    Three read endpoints with NO SecurityRule entry:
      DataEntityAttachmentController.java:31-35 (getAttachments —
        GET /api/dataentities/{id}/attachments → returns files + links
        lists for the entity)
      DataEntityAttachmentController.java:38-42 (getUploadOptions —
        GET /api/dataentities/{id}/files/uploads → returns max-file-size
        configuration value)
      DataEntityAttachmentController.java:73-80 (downloadFile —
        GET /api/dataentities/{id}/files/{file_id} → streams file contents)

    SecurityConstants.java:247-276 — the six SecurityRule entries cover:
      POST /api/dataentities/{data_entity_id}/files/** → DATA_ENTITY_ATTACHMENT_MANAGE
      PUT /api/dataentities/{data_entity_id}/files/** → DATA_ENTITY_ATTACHMENT_MANAGE
      DELETE /api/dataentities/{data_entity_id}/files/{file_id} → DATA_ENTITY_ATTACHMENT_MANAGE
      POST /api/dataentities/{data_entity_id}/links → DATA_ENTITY_ATTACHMENT_MANAGE
      PUT /api/dataentities/{data_entity_id}/links/{link_id} → DATA_ENTITY_ATTACHMENT_MANAGE
      DELETE /api/dataentities/{data_entity_id}/links/{link_id} → DATA_ENTITY_ATTACHMENT_MANAGE
    Six write rules; ZERO read rules. The read endpoints fall through to
    AuthorizationCustomizer's catch-all pathMatchers /** authenticated().

  THE ATTACK SHAPE — cross-owner file download:

    1. User U is authenticated (any UI auth mode) and holds NO RBAC
       permissions at all (a brand-new user awaiting Owner-association).
    2. User U calls GET /api/dataentities/{id}/files/{file_id} for some
       data entity owned by team B in namespace N.
    3. The catch-all rule passes (U is authenticated); the controller
       routes to attachmentService.downloadFile(file_id); the file is
       streamed to U.
    4. The file may contain: PII (uploaded customer data CSVs as 'sample
       data' on a customer-data dataset), credentials (a developer
       accidentally uploaded a .env file), internal documents (uploaded
       runbook PDFs containing on-call rotation, escalation paths,
       admin contacts), screenshots (Slack message screenshots with
       chat-history disclosed).

  THE COMPOUNDING WITH OTHER BATCH-V FINDINGS:

    1. Combined with the cross-entity-privilege-escalation finding (the
       URL-hierarchy-discard bug): even WRITE access becomes cross-owner.
       Read access is cross-owner via the catch-all; write access is
       cross-owner via the URL spoof. Together, ANY authenticated user
       can list + read + download any file on the platform AND any user
       with MANAGE on one entity can mutate any file.
    2. Combined with the no-MIME-validation finding (separate batch-V
       invariant): the downloaded files may include HTML/JS/SVG that the
       browser may execute on download. The controller forces application/
       octet-stream which mitigates browser-side execution at the in-platform
       download path, but the catch-all read on REMOTE-mode storage means
       operators who expose the S3 bucket externally enable the MIME-based
       execution.
    3. Combined with the LSN-001 chunk staging residue: the catch-all read
       does NOT extend to /tmp/odd/chunks (the chunks are not exposed via
       any endpoint), but in-flight chunks visible at /tmp/odd/chunks
       inside a compromised container could be readable.

  THE INTENT VS THE BUG:

    The platform-wide read-collaborative posture (per
    read-collaborative-cross-owner-enumeration invariant + system-mission.md
    line 267) is well-named for DATA ENTITY METADATA — descriptions, tags,
    terms, business names, ownership labels — content that's intended for
    cross-team discovery. Attachments are DIFFERENT — they're operator-uploaded
    binary files with no intrinsic read-collaborative intent. The platform's
    pattern was applied uniformly without distinguishing the content-class
    sensitivity.

    Note from the live doc: 'Operators and users can attach files and links
    to any data entity to carry additional context — runbook PDFs, sample
    CSVs, dashboard screenshots, links to internal wikis, ticketing references'
    (data-discovery/attachments.md per batch-V WebFetch 2026-05-20). The
    doc explicitly enumerates 'runbook PDFs' — operator-uploaded operational
    documents — which carry sensitivity beyond catalog metadata.

  THE MITIGATION SCOPE:

    Layer 1 — add three SecurityRule entries:
      GET /api/dataentities/{data_entity_id}/attachments → DATA_ENTITY_ATTACHMENT_VIEW
      GET /api/dataentities/{data_entity_id}/files/uploads → DATA_ENTITY_ATTACHMENT_VIEW
      GET /api/dataentities/{data_entity_id}/files/{file_id} → DATA_ENTITY_ATTACHMENT_VIEW
      Create the new DATA_ENTITY_ATTACHMENT_VIEW permission in
      PolicyPermissionDto + the live docs.

    Layer 2 — for operators preferring read-collaborative attachments:
      explicit config flag attachment.read-collaborative=true (default
      false) — when true, reads remain unrestricted; when false, the
      VIEW permission is required.

    Layer 3 — file-content sensitivity classification: every file at
    upload time gets a sensitivity label (PUBLIC / INTERNAL / SECRET) and
    the read endpoints check the caller's clearance vs the file's label.
    Substantial design work; deferred.

  SEVERITY: HIGH — direct cross-owner read of operator-uploaded files.
  The live doc explicitly mentions PDFs / CSVs / screenshots / wiki links
  — exactly the content classes operators do NOT expect to be cross-owner
  readable. The catch-all rule is invisible at the docs surface (the live
  attachment-feature doc does NOT discuss read-side authorization, only
  the MANAGE permission for writes).
