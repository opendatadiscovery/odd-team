behaviour: |-
  **CRITICAL — LSN-001 family extends: even after operators correctly configure `attachment.storage=REMOTE` per the post-LSN-001 doc fix, the chunk-staging path is HARD-CODED to `/tmp/odd/chunks` regardless. In-flight uploads silently lose chunks on container restart even with REMOTE persistence configured.** Primary-source confirmed via the batch-V DataEntityAttachmentController sidecar + verified at code: `/home/raman/work/odd/odd-platform/odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/utils/FileUtils.java:24`:
  ```
  private static final String CHUNK_BASE_PATH = "/tmp/odd/chunks";
  ```

  **Two failure modes on REMOTE deployments**:
  - **Single-replica REMOTE**: an operator correctly configures `attachment.storage=REMOTE` per the LSN-001-remediated docs. They observe that COMPLETED uploads land in S3/MinIO and persist across container restarts. They do NOT observe that an in-flight 3-step upload (initiate → N chunks → complete) interrupted between `initiate` and `complete` by a Kubernetes eviction/restart LOSES every staged chunk in `/tmp/odd/chunks/<uploadId>/`. The next `complete` for that uploadId fails because the chunk files are gone. The operator's mental model — "REMOTE storage means uploads persist across restart" — is wrong for the chunk window. LSN-001 is partially-mitigated: completed files persist; uploads-in-progress do not.
  - **Multi-replica REMOTE**: an operator deploys two platform instances behind a non-sticky load balancer. They configure `attachment.storage=REMOTE` and reason "S3 is shared; both instances can serve uploads." But `/tmp/odd/chunks/<uploadId>/` is NODE-LOCAL: when `initiateFileUpload` lands on instance A, the upload-id row + the chunk directory are on A. When the next `uploadFileChunk` lands on instance B (no sticky routing), `Paths.get(CHUNK_BASE_PATH, uploadId.toString())` exists ONLY on instance A; on B it returns a non-existent path. `FilePart.transferTo(path)` raises `NoSuchFileException` mid-stream. The user sees a generic 5xx with no diagnostic. Operators following the docs which speak of REMOTE storage as a shared persistence layer have no signal that the chunk-staging layer requires sticky-routing OR a shared volume — the documentation does not surface this constraint.

  **What the docs claim vs what the code enforces**: the live `documentation/docs/configuration-and-deployment/odd-platform.md` page (WebFetched 2026-05-20, status 200 per sidecar `docs_link_semantic.inferred_docs[1]`) discloses LOCAL ephemeral semantics + the LSN-002 us-east-1 region pin, BUT makes NO mention of CHUNK_BASE_PATH being node-local or that multi-replica deployments need sticky routing or a shared volume mount at `/tmp/odd/chunks`. The post-LSN-001 doc remediation closed the LOCAL-default loop but left this latent issue invisible at the YAML level. **This is exactly the substrate's value-add: LSN-001 closed the doc-side loop on the visible default; the code-side residue (CHUNK_BASE_PATH) is invisible at the YAML level and is the kind of finding only consumer-read of the implementation surfaces.**

  **Why CRITICAL not HIGH**: LSN-001 was rated CRITICAL operational. This gap extends the LSN-001 failure class to: (a) a NEW combination (REMOTE storage + container restart) NOT remediated by the doc fix; (b) a NEW combination (REMOTE storage + multi-replica) NOT remediated. Both produce silent user-data-loss (in-flight uploads vanish + completed-but-not-yet-completed chunks lost) WITH NO operator-visible signal. The operator-cliff narrative (CLAUDE.md "an attachment-storage default that silently wiped production data on container restart") applies precisely here: an operator who followed our REMEDIATED guide off the cliff to a SECOND cliff. The cross-pillar nature (P-01 user-data + P-08 operator-config) elevates severity. Note: TEST-GAP-076 covers the multi-instance routing aspect at method-tier; THIS gap is the CONTROLLER-tier compound LSN-001 extension (chunk-staging-on-REMOTE-restart + multi-replica) recorded with the cumulative coherence.

  **Test gap shape**: integration test using Testcontainers to: (a) configure `attachment.storage=REMOTE` + MinIO container; (b) initiate an upload; (c) post 3 chunks; (d) restart the platform container (simulate Kubernetes eviction) WITHOUT completing the upload; (e) attempt to complete after restart; (f) assert the completion fails (no chunks); (g) assert the existing `DataEntityFileUploadPojo` row is left in PROCESSING state forever (no housekeeping cleanup; verified in batch-V sidecar). Pin the silent-failure shape. Pair with the multi-instance variant from TEST-GAP-076.
