- id: H-010
  hypothesis: |-
    When an operator renames a popular reference table that downstream dashboards query
    frequently, the rename does not stall concurrent reads of that table.
  derivation: |-
    Performance/UX seed: a metadata edit should not be a maintenance event. The controller
    sidecar flags ACCESS EXCLUSIVE locks on the rename DDL.
  seed_source: pillar
  sme_consultation_recommended: false
  validation:
    verdict: partial
    actual_behavior: |-
      The rename runs as ALTER TABLE on a Postgres relation, which takes an ACCESS EXCLUSIVE
      lock — blocking all concurrent reads and writes of that physical table for the lock
      duration. For a small reference table the window is sub-second and effectively
      invisible; for a large, hot reference table under read-heavy BI traffic, the rename
      stalls every concurrent query until it completes (and the rename also waits to ACQUIRE
      the lock behind in-flight long readers). There is no advisory-lock queue, no
      offline-rebuild, and no operator signal that the edit is a locking operation. The
      hypothesis holds for the common (small-table) case and fails for the
      large-hot-table case.
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: performance.known_performance_gaps[0] + resource_allocation
        cite: "ReferenceDataRepositoryImpl.java:181-202"
        note: "Rename DDL takes ACCESS EXCLUSIVE LOCK; no advisory-lock queue / offline rebuild."
    operator_visible_failure: |-
      On a large, frequently-queried reference table, a metadata rename behaves like an
      unannounced maintenance event: concurrent BI queries block (and the operator sees the
      edit hang while it waits for the lock). The UI gives no indication that "rename" is a
      table-locking operation. Acceptable for typical operator-curated tables (small N);
      a latent scaling cliff for large ones.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: |-
    Because LOOKUP_TABLE_UPDATE is documented as "renaming a lookup table or editing its
    description," the permission scopes the rename to lookup tables the granting policy
    actually intends — i.e. an operator granted UPDATE for their team's tables cannot rename
    another team's table.
  derivation: |-
    Doc-claim + endpoint-shape seed: the permission name implies a bounded mutation right;
    verify scope against the SecurityConstants resolver (Rule 4 param-vs-implementation).
  seed_source: doc-claim
  sme_consultation_recommended: false
  validation:
    verdict: confirmed
    actual_behavior: |-
      The hypothesis as worded is CONFIRMED in the narrow sense that LOOKUP_TABLE_UPDATE
      does gate the rename endpoint (PUT /api/referencedata/table/{id} -> LOOKUP_TABLE_UPDATE
      at SecurityConstants), AND the platform's actual scoping model is global by design and
      the doc states this honestly: "LOOKUP_TABLE_* permissions are global — there is no
      per-table RBAC today." So the permission behaves exactly as documented. The
      product-owner caveat (surfaced, not a contradiction here because the doc is honest):
      "their team's tables" is not a real boundary — any user with LOOKUP_TABLE_UPDATE via
      any policy can rename ANY lookup table in any namespace (NO_CONTEXT resolver). The
      blast radius of H-001 is therefore platform-wide, not team-scoped.
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: security.authorization_assertions + known_security_gaps[2]
        cite: "SecurityConstants.java:326-327 (UPDATE rule) + :114,325 (NO_CONTEXT resolver)"
        note: "PUT .../table/{id} requires LOOKUP_TABLE_UPDATE; all LOOKUP_TABLE_* rules use NO_CONTEXT (global, not entity-scoped)."
      - sidecar: "(WebFetch cross-reference)"
        section: live doc page
        cite: "docs.opendatadiscovery.org/features/master-data-management/lookup-tables"
        note: "Doc confirms global scope: 'no per-table RBAC today.'"
    operator_visible_failure: ""
    severity: ""
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

