    database can set the three keys; the SHIPPED default ships
    one PG database with two schemas (`public` + `lookup_tables_schema`)
    served by two distinct R2DBC pools. NEW drift facet for
    F-026:
    `lookup_tables_three_key_fallback_default_same_database_two_pools_one_schema_isolation`.

    (3) **TWO POOLS × DEFAULT MAX-SIZE=10 CEILING PER REPLICA —
    SPRING BOOT FRAMEWORK DEFAULT IS UNDOCUMENTED PLATFORM
    GUARANTEE (MEDIUM — performance gap)** — Lines 41-50 +
    75-84 are BYTE-IDENTICAL `PropertyMapper.alwaysApplyingWhenNonNull()`
    blocks applying ALL ten `R2dbcProperties.Pool` defaults to
    both pools. `application.yml:1-15` ships ZERO
    `spring.r2dbc.pool.*` keys; the pool ceiling is whatever
    Spring Boot 3.x's framework default for `R2dbcProperties.Pool.maxSize`
    happens to be (10 connections per pool at the current
