notes: |
  Cross-batch test-coverage + doc-coverage + design-intent observation. The
  carve-out is presumed intentional (microservices are endpoint-shaped, not
  data-shaped — schema-diff doesn't map cleanly) but the rationale is not
  surfaced anywhere; a regression that removes the filter would change behaviour
  silently.

  Recommended cleanup paths:

    (a) Code: add a defending comment at IngestionServiceImpl.java:103
        explaining the carve-out rationale (e.g. "// Microservice entities
        are endpoint-shaped — schema-diff via specific_attributes does not
        map cleanly; BIS alerts from this path are intentionally suppressed.").

    (b) Test: add an integration test pinning the current behaviour with a
        MICROSERVICE entity payload + changed specific_attributes; assert
        zero BIS alerts are raised.

    (c) Doc: if the carve-out is intentional and operator-visible, surface
        it in the ingestion documentation under "Alert candidate generation"
        — name the exclusions explicitly.

