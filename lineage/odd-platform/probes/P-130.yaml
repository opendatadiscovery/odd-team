expected_outcome: |
  Stress question (Category F — input-name vs implementation alignment;
  AND Category A — tunable boundary at page=0):
  GET /api/relationships?page=0&size=30 — the controller forwards
  page=0 unchecked (`RelationshipController.java:25`); the repository
  applies `(page - 1) * size` as the JOOQ offset
  (`ReactiveDataEntityRelationshipRepositoryImpl.java:79`). When page=0,
  offset = -30 (negative). Postgres rejects a negative `OFFSET` clause
  with `ERROR: OFFSET must not be negative`. Question: does this 500
  the request, or is it intercepted earlier?

  Additionally: page=null → NPE at the `(page - 1) * size` arithmetic
  (Integer.intValue() unboxing on null). The OpenAPI spec at
  `components.yaml/PageParam` declares it required, but the controller's
  reactive binding may still permit null if the framework routes the
  request through unset.

  AND the SearchParam type is documented as `required: false`
  (components.yaml:4235), so query=null is the routine case — verify
  no NPE on null query path (the StringUtils.isBlank check at
  `ReactiveDataEntityRelationshipRepositoryImpl.java:68` should handle
  it, but pin the behaviour).
