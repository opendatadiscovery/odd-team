      OverviewGroups.tsx:32,91 DATA_ENTITY_ADD_TO_GROUP). The collection render is OUTSIDE the
      WithPermissions wrapper, consistent with read-collaborative. BUT whether `WithPermissions` is a
      RENDERING GATE (hides children when the permission is absent) or a CONTEXT-ONLY provider depends
      on the `WithPermissions` implementation — and the sibling `WithPermissionsProvider` in the
      Overview HOME-PAGE sidecar is documented (Overview.md implicit_adr[3]) to be CONTEXT-ONLY (it
