behaviour: |-
  **HIGH — `NAMESPACE_CREATE` is bypassed by 4 sister services × 2 method × 8 call sites total via the platform's `getOrCreate` side-door pattern. A caller holding `TERM_CREATE` / `TERM_UPDATE` / `DATA_SOURCE_CREATE` / `DATA_SOURCE_UPDATE` / `COLLECTOR_CREATE` / `COLLECTOR_UPDATE` / `DATA_ENTITY_GROUP_CREATE` / `DATA_ENTITY_GROUP_UPDATE` can submit a parent form with a NEVER-SEEN `namespaceName` and SILENTLY CREATE the namespace. The dedicated `NAMESPACE_CREATE` permission (gated at `POST /api/namespaces`) is NEVER consulted on these paths.** Primary-source confirmed across batches K, U (Term-side) AND batch W (full 4-sister aggregate via NamespaceController + DataSourceController sidecars):

  **The 4-sister-service / 8-call-site aggregate** (per NamespaceController.md:bugs_limitations_corner_cases.[1] — primary source for the aggregate):
  - **Sister 1 — Term**: `TermServiceImpl.createTerm` (line 103) + `TermServiceImpl.updateTerm` (line 138) → `namespaceService.getOrCreate(formData.getNamespaceName())`
  - **Sister 2 — DataSource (BATCH W ADDITION)**: `DataSourceServiceImpl.create` (line 57) + `DataSourceServiceImpl.update` (line 75) → `namespaceService.getOrCreate(...)`. Permission gate: DATA_SOURCE_CREATE / DATA_SOURCE_UPDATE.
  - **Sister 3 — Collector (BATCH W EVIDENCE FROM NAMESPACE SIDECAR)**: `CollectorServiceImpl.create` (line 43) + `CollectorServiceImpl.update` (line 57) → `namespaceService.getOrCreate(...)`. Permission gate: COLLECTOR_CREATE / COLLECTOR_UPDATE.
  - **Sister 4 — DataEntityGroup (BATCH W EVIDENCE FROM NAMESPACE SIDECAR)**: `DataEntityGroupServiceImpl.createDataEntityGroup` (line 65) + `DataEntityGroupServiceImpl.updateDEG` (line 84) → `namespaceService.getOrCreate(...)`. Permission gate: DATA_ENTITY_GROUP_CREATE / DATA_ENTITY_GROUP_UPDATE.

  **NEW BATCH W FILE:LINE evidence**:
  - `DataSourceServiceImpl.java:56-60` (`if (StringUtils.isNotEmpty(form.getNamespaceName())) { namespaceService.getOrCreate(form.getNamespaceName()).zipWith(token)... }`).
  - `DataSourceServiceImpl.java:73-77` (update path — same pattern).
  - NamespaceController.md:bugs_limitations_corner_cases.[1] enumerates ALL 4 sisters × 2 methods × 8 call sites.

  **TAG_CREATE side-door** (continuing from prior batch-U finding, also strengthened in batch W via TagController.md):
  - `TermServiceImpl.upsertTags` (line 257) — TERM_TAGS_UPDATE → `tagService.getOrCreateTagsByName`.
  - `TagServiceImpl.updateRelationsWithDataEntity` (line 105) — DATA_ENTITY_TAGS_UPDATE → same.
  - `TermServiceImpl.upsertTags` (line 257) — TERM_TAGS_UPDATE → same.
  - `DatasetFieldServiceImpl.java:202, 266` — DATASET_FIELD_TAGS_UPDATE → same.
  - `ExternalTagIngestionRequestProcessor.java:104` — S2S ingestion → `getOrInjectTagByName`.

  **What the docs claim vs what the code enforces** (extended in batch W):
  - Business Glossary docs (live-fetched 2026-05-20 per batch-U sidecars): `TERM_CREATE` gates "Create a new term in the Dictionary" — does NOT disclose namespace side-door.
  - **Management page (BATCH W ADDITION, WebFetch 2026-05-20 status 200)**: describes the Datasources / Collectors / DEGs tabs as operator-facing surfaces; does NOT disclose that `DATA_SOURCE_CREATE` / `COLLECTOR_CREATE` / `DATA_ENTITY_GROUP_CREATE` permissions implicitly include `NAMESPACE_CREATE`.
  - **Authorization page (BATCH W, WebFetch 2026-05-20 status 200)**: "The current page only lists the authorization documentation structure with links to detailed sections on Policies, Permissions, Roles, Owners, and User-owner association, but does not include the specific permission names or policy types you're seeking." — operators have no doc-side anchor to the 4 *_CREATE permissions involved.

  **Architectural pattern — cross-pillar reach**:
  - REFACTOR-199 (Owner auto-create via `ownerService.getOrCreate` — gateway for `OWNER_CREATE` bypass via OwnerController#createOwner)
  - REFACTOR-222 (TAG_CREATE bypass via `upsertTags` in OwnerController#createOwner)
  - REFACTOR-223 (NAMESPACE_CREATE bypass via `getOrCreate` in TermServiceImpl#createTerm — original site)
  - REFACTOR-486 (TITLE auto-create via `titleService.getOrCreate` — `TitleServiceImpl.getOrCreate`)
  - **BATCH W**: the 4-sister-service NAMESPACE_CREATE side-door is now PRIMARY-SOURCE confirmed at the controller-class scope (NOT just term-side). The aggregate finding: the platform's `getOrCreate*` pattern systematically allows tag/namespace/owner/title creation through ANY endpoint that touches those entities, bypassing the dedicated `*_CREATE` permissions. THIS finding brings the cumulative cross-pillar count to FIVE getOrCreate bypass sites with the 4-sister NAMESPACE_CREATE aggregate at the centre.

  **Why HIGH not MEDIUM** (unchanged from prior batches; reinforced by batch W aggregate):
  - Individual side-doors are MEDIUM in sidecars; cumulative cross-pillar pattern is HIGH because: (a) side-doors are NOT documented anywhere in operator-facing site (sidecar's doc_drift_findings confirm); (b) operators reasoning about access control via the documented `*_CREATE` permissions are SYSTEMATICALLY DECEIVED about what permissions a Role actually allows; (c) the read-collaborative posture means EVERY authenticated user with any *_CREATE write permission can pollute the namespace + tag taxonomies indefinitely. The Management UI's Namespace + Tag tabs (intended as the controlled-vocabulary surfaces per P-08) are EFFECTIVELY UNGATED because every other pillar's write endpoints can bypass them.
  - **BATCH W reinforcement**: the same pattern now visible across P-06 (Glossary), P-08 (Datasources + Collectors + DEGs) — every catalog-mutation pillar has at least one NAMESPACE_CREATE side-door. The Management UI's Namespaces tab is effectively ungated across 4 sister pillars.

  **Test gap shape**: regression-pin asserting:
  - **Term-side** (unchanged from prior batch-U): (a) `createTerm` with a never-seen `namespaceName` succeeds for a caller holding TERM_CREATE but NOT NAMESPACE_CREATE; (b) `createTermTagsRelations` with never-seen tag names succeeds for a caller holding TERM_TAGS_UPDATE but NOT TAG_CREATE; (c) `updateTerm` with a never-seen `namespaceName` succeeds for a caller holding TERM_UPDATE but NOT NAMESPACE_CREATE.
  - **BATCH W ADDITION**: (d) `registerDataSource` with a never-seen `namespaceName` succeeds for a caller holding DATA_SOURCE_CREATE but NOT NAMESPACE_CREATE (per TEST-GAP-751 for the file-local instance); (e) `registerCollector` with a never-seen `namespaceName` succeeds for a caller holding COLLECTOR_CREATE but NOT NAMESPACE_CREATE; (f) `createDataEntityGroup` with a never-seen `namespaceName` succeeds for a caller holding DATA_ENTITY_GROUP_CREATE but NOT NAMESPACE_CREATE.

  Each test PINS the current (bypass) behaviour — failures land if a future maintainer adds explicit `NAMESPACE_CREATE` / `TAG_CREATE` checks at the service layer at ANY of the 8 call sites.
