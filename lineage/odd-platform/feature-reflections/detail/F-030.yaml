- id: H-007
  hypothesis: |-
    When the PROMETHEUS remote-write fails (Prometheus returns 5xx / is unreachable) for a
    batch, the platform's ODD-side bookkeeping writes (external_metric_last_value upserts)
    are rolled back, so the platform's record of "last value written" stays consistent
    with what Prometheus actually holds.
  derivation: |-
    Response-shape / consistency expectation: an operator reasoning about storage
    consistency assumes the bookkeeping and the remote write succeed or fail together.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The @ReactiveTransactional boundary wraps the ODD-side bookkeeping writes, but the
      Prometheus remote-write is OUTSIDE the transaction — it is a chained .flatMap AFTER
      savedMetricFamilies, the terminal WebClient step. A Prometheus failure does NOT roll
      back the bookkeeping writes; a bookkeeping failure prevents the Prometheus write.
      There is no retry, no backoff, no DLQ — onErrorMap rethrows PrometheusException and
      the entire batch is lost. The two storage layers can diverge: ODD believes it wrote
      a value Prometheus never received.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics.md
        section: dependencies_semantic.requires-feature
        cite: "ExternalIngestionMetricsServiceImpl.java:84 (txn open) + :100 (Prometheus write outside txn) + :213-218 (onErrorMap, no retry)"
        note: "bookkeeping txn does not span the Prometheus write"
      - sidecar: odd-platform__java__CounterTimeSeriesExtractor__config-key-consumer__metrics_storage@L20.md
        section: performance.known_performance_gaps
        cite: "ExternalIngestionMetricsServiceImpl.java:206-219 — no retry/backoff/DLQ — severity MEDIUM"
        note: "transient Prometheus outage loses the batch with no replay"
    operator_visible_failure: |-
      (1) On a transient Prometheus outage (rolling restart, network blip), the collector's
      batch is dropped with a 500 and no replay — metric history has a hole the operator
      cannot recover without re-pushing from the collector side. (2) The bookkeeping table
      can record a last-value the remote store never received, so a future delta-based
      computation off external_metric_last_value is skewed. (3) Operators cannot reason
      about cross-layer consistency from the docs (the split is undocumented).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

