  sidecar enrichment. The destructive surfaces (silent metadata-delete + lineage-replace)

  were visible at the processor layer in earlier batches but the FULL CHAIN —

  controller → ingestion service → metadata processor / lineage processor → service

  → repository — required the service-tier primary-source confirmation to surface

