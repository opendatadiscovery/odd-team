behaviour: 'Missing-key / typo silent-fail across the four `*SecurityConfiguration`
  siblings: none uses `matchIfMissing=true`, and `havingValue` matching is case-sensitive.
  `AUTH_TYPE=` empty-string or `auth.type=DSIABLED`/`disabled`-lowercase typo silently
  produces a deployment with NO user-defined `SecurityWebFilterChain` bean — Spring
  Boot reactive-security autoconfig fall-through then either permits-all or authenticate()s
  depending on classpath. Runtime behaviour, not statically determinable from one
  file.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/config/MisconfiguredAuthTypeTest.java
  name: authType_emptyOrTypoed_noSecurityWebFilterChainBeanWired
evidence:
- 'DisabledAuthSecurityConfiguration@L10.md says: ''An operator who unsets auth.type
  (empty string via AUTH_TYPE= or removing the key from a customised application.yml)
  does NOT get this DISABLED bean — they get no bean from any of the four *SecurityConfiguration
  classes, since none of the four uses matchIfMissing=true'''
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[0] (4-sidecar triangulated)
