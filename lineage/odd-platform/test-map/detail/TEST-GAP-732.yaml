proposed_action: |-
  Add `QueryExampleStoredXssBackendContractTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `createQueryExample_definitionWithScriptTag_persistsVerbatim` — POST `/api/queryexample` with `{ definition: "<script>alert('xss')</script>", query: "SELECT 1" }`; assert HTTP 200; fetch the example via `GET /api/queryexample/{id}`; assert `definition` byte-equals `<script>alert('xss')</script>` (the storage is verbatim).
  2. `createQueryExample_queryFieldWithScriptTag_persistsVerbatim` — sister test on the query field.
  3. `createQueryExample_definitionWithImgOnerror_persistsVerbatim` — pin the `<img onerror=...>` payload class.
  4. `createQueryExample_queryFieldWithJavascriptUrlInLinkSyntax_persistsVerbatim` — pin `[click](javascript:alert(1))` Markdown-link-with-javascript-URL persistence.

  Add a `// CONTRACT PIN: This test asserts the documented F-004 verbatim-storage architectural choice. The defence lives at the UI render layer (DefiniteDOMSanitiserPipeline + DOMPurify) per P-009 / F-004 sidecars. The Markdown.tsx wrapper applies the same defence as the entity description path — but the surface has NOT been independently dynamic-verified. A REFACTOR introducing backend sanitization will flip these tests to assert the chosen sanitiser output. A REFACTOR weakening the UI defence will require this storage layer to gain sanitisation; the test pair documents both ends of the contract.` comment block.

  Pair with: (a) a P-009 dynamic-verification probe extension covering the QueryExample render surfaces (catalog list, details page, dataset tab, term tab); (b) a DOC-NNN candidate disclosing the Markdown-rendering of the SQL body (the doc currently shows it as code-block-rendered).
