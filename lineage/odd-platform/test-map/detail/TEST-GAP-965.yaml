behaviour: |-
  **MEDIUM — `GET /api/messages/{message_id}/url` returns 200 OK with empty body (NOT 404) for two distinct error paths: (a) a non-v1 UUID input, (b) a non-existent UUIDv1 input. Both cases are semantically 404 but the controller chain emits 200.**

  Two compounding code paths:

  1. **UUIDv1 requirement**: `ReactiveMessageRepositoryImpl.getMessageProviderIdentity` (`:171-185`) binds an extra `MESSAGE.CREATED_AT.eq(UUIDHelper.extractDateTimeFromUUID(messageId))` condition alongside `MESSAGE.UUID.eq(messageId)`. A non-v1 UUID extracts a wrong (or null) timestamp from `UUIDHelper.extractDateTimeFromUUID`; the WHERE clause matches zero rows; the inner Mono is empty.

  2. **No `switchIfEmpty(NotFoundException)`**: The controller chain (`DataCollaborationController.java:42-48`) is `dataCollaborationService.resolveMessageUrl(messageId).map(providerUrl -> ResponseEntity.status(FOUND).headers(...).build())`. When the inner Mono is empty (no row found), the `.map` is never invoked; the outer Mono completes empty; WebFlux's default reactive Mono-empty-handling renders the response as **200 OK with empty body**, NOT 404.

  **Operator-visible consequences**:
  - API consumer (script, OpenAPI codegen client) expecting 404 for missing message gets 200 instead — silent data-shape drift; client code that decides 'redirect succeeded → open in new tab' gets a hung browser tab on `about:blank`.
  - UI consumer (`Message.tsx:60-66`) clicks 'Open in Slack' button → opens new tab pointing at `/api/messages/<deleted-uuid>/url` → gets 200 with no Location header → browser sits on a blank tab.
  - Forensics: no trace in logs (no @Slf4j, no metrics) — the failure mode is invisible.

  **Why MEDIUM (not LOW)**: the bug is UX-shaped, not data-loss-shaped. But (a) it compounds with the open-redirect class TEST-GAP-963 (silent empty redirect masks the open-redirect concern), and (b) the OpenAPI spec implicitly contracts a 4xx response for missing resources (every other `/messages/*` endpoint declares 404 explicitly per the api-reference fetch).

  **Distinguishes**:
  - TEST-GAP-411 — `getLineage` NotFoundException propagation. Different controller.
  - TEST-GAP-376 — `getDetails` NotFoundException path. Different.
  - This entry is the **DataCollaboration class instance** of the missing-`switchIfEmpty` family.
