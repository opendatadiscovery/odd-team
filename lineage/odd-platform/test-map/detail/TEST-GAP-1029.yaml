proposed_action: |-
  Integration test with `@SpringBootTest(properties = {"housekeeping.ttl.resolved_alerts_days=-1"})`. Assert (a) the bean binds successfully (current behaviour: no fail-fast), (b) `properties.getResolvedAlertsDays() == -1`, (c) the cutoff `DSL.currentOffsetDateTime().minus(-1)` renders SQL `current_timestamp - interval '-1 days'` which PG evaluates to `current_timestamp + interval '1 day'`. Pin the current silent-acceptance contract. When the maintainer adds `@Min(0)` + `@Validated`, the test fails with a `ConstraintViolationException` at context startup; the maintainer rewrites the test to assert the new fail-fast posture.
