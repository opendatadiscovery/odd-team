behaviour: |-
  **WebClient is field-initialised, not Spring-managed — bypasses Spring's WebClient.Builder + operator-configured connection-pool / SSL / proxy.** Line 39: `private final WebClient webClient = WebClient.create("https://api.github.com");`. The WebClient is created at field-init time by EACH bean instance (currently 1 per process), bypassing Spring's `WebClient.Builder` bean and any operator-configured connection-pool / SSL context / proxy settings. A platform deployment behind a corporate proxy needs proxy-aware HTTP — this WebClient has no such hook. No `.responseTimeout(...)`, no `.codec()` customisation, no `.exchangeFunction()` instrumentation. Operationally unusual but real for some enterprise deployments (proxy-required, SSL-pinning, custom user-agent for audit purposes). Pin the field-init contract; future REFACTOR migrating to `WebClient.Builder`-injected pattern flips the test.
