# Scheduled housekeeping cycle — product-owner reflection

## product_owner_narrative

ODD Platform's housekeeping is the platform's self-maintenance subsystem: every 15 minutes, a single ShedLock-elected instance fires a cycle that permanently deletes data the operator has chosen to age out, so that a long-lived PostgreSQL catalog does not grow without bound (per `odd-platform__java__service__service__HousekeepingJobManager.md`:understanding + live `/configuration-and-deployment/odd-platform`). The audience is operators sizing their database, DBAs, and compliance reviewers who need to know what is purged and when. The user-facing promise is a retention policy: "resolved alerts, search-facet history, and soft-deleted data entities are kept for N days (default 30), then permanently removed" — expressed through three `housekeeping.ttl.*` knobs an operator tunes (per `HousekeepingTTLProperties.md`:understanding + live doc verbatim "Defaults to 30").

An operator interacts with this feature almost entirely through configuration, not a screen — this feature has NO UI surface (see the validation_gap below). The inputs are `housekeeping.enabled` (master gate, default `true`) and the three `housekeeping.ttl.*` day-counts; the observable outputs are bounded table growth and, on failure, an ERROR log line. There is no dashboard, no "what will be deleted" preview, no per-cycle report, and no metric (per `HousekeepingJobManager.md`:bugs_limitations_corner_cases[4] — all per-job logging is `log.debug`, default-off in production). The operator's mental model of "I set 30 days, so data lives 30 days" is the load-bearing user expectation this reflection tests.

The working parts: the orchestrator injects a `List<HousekeepingJob>` and discovers FIVE beans (per `HousekeepingJobManager.md`:understanding) — three TTL-driven row reapers (`AlertHousekeepingJob`, `SearchFacetsHousekeepingJob`, `DataEntityHousekeepingJob`) that hard-DELETE rows past `now() - ttl days`, plus two `EmptyPartitionsHousekeepingJob` subclasses (`ActivityEmptyPartitionsHousekeepingJob`, `MessageEmptyPartitionsHousekeepingJob`) that drop EMPTY past partitions only and consume NO TTL key (per `ActivityEmptyPartitionsHousekeepingJob.md`:concepts.invariants). The five run SEQUENTIALLY on one shared raw JDBC connection inside a 14-minute ShedLock against the 15-minute schedule (per `HousekeepingJobManager.md`:concepts.operations). `DataEntityHousekeepingJob` is the heavy one: a ~25-table cascade inside a single jOOQ transaction that also blocks on `fileUploadService.deleteFiles(...).block()` to remove S3 attachments (per F-010 chain hop 3c evidence + `HousekeepingJobManager.md`:coupling[3]).

This feature is the operational counterpart to two other pillars (per system-mission.md cross-pillar map + F-010 `cross_pillar_relationships`): it owns the retention of the Data Quality pillar's (P-04) resolved-alert table via `resolved_alerts_days`, and it is the SOLE reaper of the Active-Platform-Features pillar's (P-07) Activity table via the empty-partition drop — coordinating across orchestrators with `ActivityTablePartitionManager` (which creates partitions nightly). A SIXTH housekeeping-shaped job exists outside the orchestrator entirely: `PostgreSQLSessionHousekeepingJobHandler` purges expired `SPRING_SESSION` rows hourly, gated by `session.provider=INTERNAL_POSTGRESQL`, with no leader-election guard (per F-010 batch-X notes + live doc verbatim 2026-06-01).

The edge cases a product owner would flag in a demo are the dangerous ones: a partial config override silently rebinds all three TTLs to `0` and the next cycle deletes everything (LSN-001 shape, per `HousekeepingTTLProperties.md`:bugs_limitations_corner_cases[2]); the Activity and Message tables have NO time-based retention knob at all and grow monotonically on any busy platform (per `ActivityEmptyPartitionsHousekeepingJob.md`:bugs_limitations_corner_cases[0]); and — the deepest one — the soft-delete-grace TTL the whole feature advertises never fires for data entities because of a status-mutation ordering bug two layers upstream (per `concepts.yaml` cross-batch invariant D+F, line 185-192; tracked as PLT-027 / SHB-004).

## hypotheses

- id: H-001
  hypothesis: >-
    When an operator sets `housekeeping.ttl.resolved_alerts_days=30`, an alert
    the operator MANUALLY marked RESOLVED is retained for 30 days after its
    status-update before housekeeping deletes it (symmetric with auto-resolved
    alerts).
  derivation: >-
    The config key is named `resolved_alerts_days` and the doc states it is
    "intended to apply to both RESOLVED (manual) and RESOLVED_AUTOMATICALLY
    (system) states" — the user expects the retention window to cover all
    resolved alerts.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The jOOQ predicate at AlertHousekeepingJob.java:28-34 chains
      `.where(STATUS.eq(RESOLVED)).or(STATUS.eq(RESOLVED_AUTOMATICALLY)).and(STATUS_UPDATED_AT.lessOrEqual(cutoff))`.
      jOOQ fluent-builder precedence binds `.and(...)` to the most recent
      `.or(...)`, emitting `WHERE (STATUS='RESOLVED') OR (STATUS='RESOLVED_AUTOMATICALLY'
      AND STATUS_UPDATED_AT <= cutoff)`. The TTL cutoff therefore applies ONLY to
      RESOLVED_AUTOMATICALLY rows; a manually-RESOLVED alert matches the bare
      first clause and is hard-deleted on the VERY NEXT 15-minute cycle,
      regardless of `resolved_alerts_days`.
    evidence:
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: bugs_limitations_corner_cases[1]
        cite: "AlertHousekeepingJob.java:28-34"
        note: "the operator-precedence predicate chain; PRIMARY-SOURCE confirmation of REFACTOR-142"
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: bugs_limitations_corner_cases[3]
        cite: "AlertHousekeepingJob.java:28-34 + WebFetch /configuration-and-deployment/odd-platform"
        note: "second-angle confirmation; live doc acknowledges the bug verbatim"
    operator_visible_failure: |
      (1) An operator clicking "RESOLVED" on a production alert loses the alert —
      and its audit trail — within ~15 minutes, not 30 days. (2) Raising
      `resolved_alerts_days` to 90 for a compliance requirement buys longer
      retention for auto-resolved alerts ONLY; manual resolutions silently ignore
      the setting entirely. (3) The data has been silently lost since 2023 (commit
      c8dc0544) on every deployment — older deployments have years of vanished
      manual-resolution audit history. SOC2/SOX/HIPAA alert-retention claims built
      on `resolved_alerts_days` are unsound for manual-resolved rows.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

