note: |-
  Graduated 2026-05-26 from SHB-044. Pillar P-04 sub-feature seed
  "Dataset Quality Statuses (SLA)" per system-mission.md:158 — F-022 owns the
  read surface (Test Reports tab + SLA badge); this feature owns the
