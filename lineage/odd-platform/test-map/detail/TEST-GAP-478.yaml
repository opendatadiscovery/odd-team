  - "TermServiceImpl.md:tests_coverage_semantic.uncovered_behaviours.[9] (handleDataEntityDescriptionTerms)"
behaviour: |-
  Auto-link side-channel — description edit bypasses DATA_ENTITY_ADD_TERM permission. A user holding `DATA_ENTITY_DESCRIPTION_UPDATE` (the gate on `PUT /api/dataentities/{id}/description`) can paste `[[finance:Customer]]` into a description; `handleDataEntityDescriptionTerms` (TermServiceImpl.java:201-207) parses the mention and INSERTs into `data_entity_to_term` with `is_description_link=TRUE`. The `DATA_ENTITY_ADD_TERM` permission that gates the direct-link endpoint is NEVER consulted on this path. Even if REFACTOR-217 were fixed at the controller tier (TEST-GAP-017), this side-channel would remain — the auto-link path is SERVICE-tier, not controller-tier, so a service-tier permission check is needed (or a doc admission that description-mention is part of the description-update permission's scope). Cross-pillar P-06+P-09 because the bypass spans glossary semantics + permission model.
test_class: missing-security
