proposed_action: |-
  Testcontainers integration test, parameterised over the four facet aggregators. (a) Authenticate user A. (b) POST /api/search with query 'foo ) | (bar' (containing unbalanced paren + tsquery operators) → A receives session_id S. (c) Assert that the POST succeeds and persists the row (the bug is at READ time, not write time). (d) For each facet_type in {TAGS, OWNERS, TYPES, GROUPS, STATUSES}: GET /api/search/S/facet/{facet_type} → assert HTTP 500 with body containing 'syntax error in tsquery'. (e) Re-fetch GET /api/search/S (the aggregate endpoint) → assert HTTP 500 (the session is permanently poisoned). (f) Test comment 'LOCKS the tsquery operator-injection DoS at the FACET endpoint surface as of 2026-05-19 (TEST-GAP-250 STRENGTHENED with 4 facet aggregator invocation sites + 1 aggregate endpoint = 5 invocation sites at this controller alone). When JooqFTSHelper.tsQuery sanitises input or escapes metacharacters, this test FLIPS to expect either (a) 400 BadUserRequest at write time, or (b) 200 with the syntax-meaningless input treated as literal text.' Pair with batch H's TEST-GAP-250 test if existing — this is the second/third/fourth invocation surface in the same code path.
