  - F-008 observed_vs_expected facets [silent metadata-delete-on-absence, silent lineage-replace-on-each-call]

arrange:
  - Build odd-platform from main against docker-compose Postgres with the BUNDLED
    defaults (auth.type=DISABLED, auth.ingestion.filter.enabled=false — the shipped
    posture; this also exercises H-001's anonymous-reach surface in the same run).
  - Register a datasource D (POST /ingestion/datasources with a collector token, OR
    seed it directly) so D.oddrn resolves.
  - TICK 1: POST /ingestion/entities a DataEntityList for D containing one DATA_SET
    entity E (oddrn E.oddrn) with metadata {owner: "team-a", pii: "true"} and a
    DATA_TRANSFORMER entity T whose targetList = [E.oddrn] (establishing a lineage
    edge T -> E established by T).
  - Confirm via GET /api/dataentities/{E.id}/metadata that BOTH metadata fields are
    present, and via the lineage read surface that the T -> E edge exists.

act:
  - TICK 2 (metadata subtraction): POST /ingestion/entities a DataEntityList for D
    containing the SAME entity E but with metadata {owner: "team-a"} ONLY (pii field
    OMITTED — simulating a partial scrape). No change to T.
  - TICK 3 (lineage subtraction): POST /ingestion/entities a DataEntityList for D
    containing the SAME transformer T but with targetList = [] (the T -> E edge
    OMITTED — simulating a transient source read that returned no downstream).

observe:
  - kind: rest_response
    target: TICK 2 + TICK 3
    capture:
      - status_code              # expect 200/201 on both — the destruction is silent
      - response_body            # expect Mono<Void> empty body — no diff of what was removed
  - kind: rest_response
    target: GET /api/dataentities/{E.id}/metadata AFTER TICK 2
    capture:
      - metadata_fields_present  # is `pii` still present (merge) or GONE (replace)?
  - kind: rest_response
    target: lineage read AFTER TICK 3
    capture:
      - edge_T_to_E_present      # is the T -> E edge still present (merge) or GONE (replace)?
  - kind: log_scan
    target: platform stdout during TICK 2 + TICK 3
    capture:
      - warn_on_delete           # any log.warn naming the deleted binding/edge? (expected: NONE — @Slf4j unused)
  - kind: db_state
    target: activity table AFTER TICK 2 + TICK 3
    capture:
      - activity_event_on_delete # any ACTIVITY row recording the metadata/lineage deletion? (expected: NONE)

oracle:
  confirms_hypothesis_if:
    - metadata_fields_present includes `pii` AFTER TICK 2 AND edge_T_to_E_present == true
      AFTER TICK 3 (merge semantics — the hypothesis H-013 holds).
  contradicts_hypothesis_if:
    - metadata_fields_present does NOT include `pii` AFTER TICK 2 (the omitted field
      was DELETED) OR edge_T_to_E_present == false AFTER TICK 3 (the omitted edge was
      DELETED) — REPLACE semantics confirmed; H-013 CONTRADICTED. This is the expected
      outcome per the static trace.
  records_silence_if:
    - warn_on_delete == false AND activity_event_on_delete == false (the destruction
      is forensically silent — strengthens the F-008 audit-silence facet + the
      @Slf4j-unused finding).

