- id: H-002
  hypothesis: |-
    When a collector sends a batch containing a CLIENT error the author could fix (the same
    ODDRN twice in one payload), the platform returns a 4xx that names the problem — so the
    author's code can branch to "fix my payload, do NOT retry" rather than "platform is down,
    retry with backoff".
  derivation: |-
    REST convention: a malformed request is the client's fault → 4xx; retry-with-backoff
    (the documented collector pattern) is correct ONLY for 5xx. The author's branch logic
