behaviour: |-
  **No retry, timeout, or rate-limit handling on outbound GitHub calls — transient flake = hard login failure.** GitHub's REST API enforces rate limits (5000 req/hr authenticated default; secondary limits for abuse). A 403 with `X-RateLimit-Remaining: 0`, a 429 status, OR a transient network flake will surface to the user as a HARD login failure — `.bodyToMono(...)` fails-out the Mono via WebClientResponseException propagated to the OAuth2 login flow. NO `.retryWhen` (lines 76-85, 104-113), NO `.timeout(...)`, NO `.onErrorResume(...)`, NO fallback to cached membership signal. The handler hard-codes `WebClient.create(...)` (line 39) without `.responseTimeout(...)` — relies on Reactor Netty default timeouts. A high-traffic login surface (e.g. a SAML-like flow with thousands of automated re-logins, or a shared NAT-IP egress) CAN exhaust the rate limit. Per-user rate-limit is the binding constraint (token is per-user); aggregate platform GitHub-API usage is bounded by sum of per-user limits.
