- id: H-011
  hypothesis: "When the same operator detaches a query example from a term then re-attaches it, the re-attach succeeds (the link lifecycle is idempotent/repeatable)."
  derivation: "Negative-space + endpoint-shape — DELETE then POST on /api/terms/{term_id}/queryexample; the link table's duplicate-handling determines whether re-attach after detach works cleanly."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      Detach is DELETE /api/terms/{term_id}/queryexample/{example_id} →
      TermController.deleteQueryExampleToTermRelationship → QueryExampleService.removeTermFromQueryExample,
      which HARD-deletes the query_example_to_term row (QueryExampleController sidecar
      implicit_adrs.hard-delete-of-links: link rows are hard-deleted, not soft-deleted). Because the link
      row is physically removed, a subsequent POST (re-attach) inserts a fresh row with no
      unique-constraint collision against a tombstone. So detach-then-reattach is clean and repeatable.
      (The duplicate-relation guard only fires when the link STILL exists.)
    evidence:
      - sidecar: odd-platform__java__TermController__controller-class__TermController.md
        section: operations
        cite: "TermController.java:229-234 (deleteQueryExampleToTermRelationship → removeTermFromQueryExample, returns 204)"
        note: "detach hard-deletes the link row"
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController.md
        section: implicit_adrs
        cite: "QueryExampleServiceImpl.java:84-92 (link rows hard-deleted) — same hard-delete-of-links ADR"
        note: "no tombstone on link rows → re-attach is clean"
    severity: null
    confidence: HIGH
    routes_to_finding: none
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

