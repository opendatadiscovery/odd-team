  - 'terms.md says (bugs_limitations_corner_cases): Sub-route literal "overview" is hard-coded as the default arg in termDetailsPath rather than referenced via TermDetailsRoutes.OVERVIEW. Line 37: path: TermDetailsRoutesType = "overview". The literal "overview" appears 3 times in this file (line 26, line 37, and implicitly in TermDetailsRoutes.tsx:29 + line 46 Navigate target). Renaming the OVERVIEW tab key in TermDetailsRoutes would NOT propagate to the default-arg value; the maintainer must remember to update both. severity: LOW'
  - 'Verified at primary source: termsRoutes.ts:25-31 (the SoT object) + components/Terms/TermDetails/TermDetailsRoutes/TermDetailsRoutes.tsx:29-34 (re-hardcoded slugs in the renderer) + line 46 (Navigate fallback hard-coded "overview")'
