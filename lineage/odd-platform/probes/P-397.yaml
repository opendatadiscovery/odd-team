  # Overview page warms the SHARED ['appInfo'] cache key via FavoritesColumn.tsx:45 /
  # RecentlyViewedColumn.tsx:32 / Overview.tsx:27, which hides the transient entirely.
  - kind: dom-probe
    steps:
      - open a fresh browser context (no service worker, no cache)
      - route-intercept GET **/api/info and delay the response by 1500 ms, setting an `injected`
        flag on the page so the assertion can prove the interception actually applied
        (reference_odd_platform_e2e_route_interception — an unapplied route false-greens)
      - navigate to {BASE_URL}/search
      - sample the filter row at +300 ms (before /api/info can resolve)
      - wait for the GET /api/info response, then sample again
    capture_as: cold_mount
  # H2 — the outage. /api/info returns 500 once; retry:false means there is no second attempt.
  - kind: dom-probe
    steps:
      - open a fresh browser context
      - route-intercept GET **/api/info -> 500, with the same `injected` applied-guard
      - navigate to {BASE_URL}/search
      - wait for network idle, then wait a further 3 s (retry:false — nothing more will be sent)
    capture_as: info_outage
