- id: H-009
  hypothesis: "When an operator configures attachment.storage=REMOTE against an AWS S3 bucket in their own region (e.g. eu-west-1), file uploads and downloads work — the platform talks to the bucket they configured."
  derivation: "Pillar mission anchor (P-08 'operators configure storage') + cross-layer drift (region absent from the SDK builder) — REMOTE promises persistence against the operator's bucket."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
