name: Silent-204-on-no-op-DELETE vs 400-duplicate-on-no-op-ADD contract asymmetry
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-11
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-19L** — surfaced by
  cross-reading the addDataEntityDataEntityGroup + deleteDataEntityFromDataEntityGroup
  sidecar pair. The HTTP response contract is asymmetric across the CRUD
  pair of DEG-membership writes, in a way that operators writing
  reconciliation / automation scripts will observe and stumble on.

  **The two response shapes**:

    - **POST (ADD) on duplicate membership** → HTTP `400 Bad Request` with
      the message `"Data entity is already in this DEG"`. Mechanism:
      `ReactiveGroupEntityRelationRepositoryImpl.createRelationsReturning`
      (lines 67-90) uses `onDuplicateKeyIgnore` so the conflict-affected
      row is silently skipped at the DB layer, returning an empty Flux;
      `DataEntityServiceImpl.java:402` consumes the emptiness with
      `.switchIfEmpty(Mono.error(new BadUserRequestException))` → 400.

    - **DELETE on non-existent membership** → HTTP `204 No Content` with
      empty body. Mechanism: `deleteRelationsReturning` (lines 57-65)
      returns an empty Flux when no row matches the
      `(groupOddrn, entityOddrn)` predicate; the pipeline `collectList()`
      → empty list → `Flux.fromIterable(emptyList)` → completes empty →
      controller emits 204 (`DataEntityController.java:343-349`). There is
      NO `switchIfEmpty` check; the caller cannot distinguish "successfully
      removed" from "wasn't a member".

  **Operator-facing manifestation**:

    - A script that runs idempotent reconciliation ("ensure entity X is in
      DEG Y") finds the ADD endpoint NON-idempotent: re-running the
      script after a successful first run produces 400 on the second
      iteration. The script must catch and ignore the 400, OR pre-check
      existence via `getDataEntityGroupsItems`.

    - A script that runs idempotent removal ("ensure entity X is NOT in
      DEG Y") finds the DELETE endpoint IDEMPOTENT in HTTP surface but
      ambiguous in observability: success (204) is indistinguishable
      from no-op (also 204), AND no activity event is emitted (per the
      sibling "DEG-membership writes are forensically silent" finding),
      so the script cannot verify whether the removal actually happened.

  **The asymmetry is intentional** (per addDataEntityDataEntityGroup
  implicit_adrs.[3]):

    - ADD uses `onDuplicateKeyIgnore` + service-layer `switchIfEmpty` →
      400 with a friendly message — a deliberate choice over plain
      INSERT raising USR003 (DB-level duplicate-key).

    - DELETE accepts the no-op silently — matches the common REST
      convention "DELETE is idempotent" and avoids a 404-on-empty
      decision that the maintainer chose not to make.

  **Cross-batch shape**: the **silent-200-on-missing-pair pattern** for
  `upsertDataEntityMetadataFieldValue` (batch L NEW HIGH) and
  `upsertDataEntityInternalDescription` (batch G) is a structural sibling
  — both expose "this write looks successful but no row was touched"
  semantics for the upsert family. The silent-204-on-DELETE is the
  matching shape for the delete family. Together they form a pattern: at
  ODD, the load-bearing assumption of HTTP semantics ("a 2xx means
  something happened") is selectively false on no-op DELETE paths and on
  no-op-target UPSERT paths.

  **Pairs with**: the documentation drift finding on no audit trail for
  DEG membership flips (the silent-204 + no-activity-event combination
  produces a doubly-ambiguous operational signal).
