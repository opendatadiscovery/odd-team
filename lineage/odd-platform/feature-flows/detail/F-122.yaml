    The other 9 promises stay UNGUARDED: HealthAPITest covers only /actuator/health liveness;
    SecurityRulesAuthzGapsKnownBugsTest pins unrelated whitelist gaps (PLT-054/020/012). The
    value/credential-leak invariants (H-003 unmasked JDBC URL, H-005 provider schema
    fingerprint, H-010 masking-coverage meta-test) are NOT verifiable over HTTP today because
    /actuator/env returns 500 (no body) on :latest — the leak angle is refuted on Spring Boot
