proposed_action: Parameterised `@SpringBootTest` over `auth.type ∈ {"", "disabled",
  "DSIABLED", null}`; for each value assert NO `SecurityWebFilterChain` bean is wired
  by any of the four config classes. Pair with a fail-fast assertion when the maintainer
  adds it (currently the deployment silently falls through to Spring autoconfig).
