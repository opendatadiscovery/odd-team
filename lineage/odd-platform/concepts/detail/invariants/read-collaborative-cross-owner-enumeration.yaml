notes: "STRENGTHENED in batch 2026-05-12F from 3-sidecar to 5-sidecar\ntriangulated.\
  \ Lineage adds the GRAPH-shaped cross-owner enumeration\n(causal-connection leak\
  \ via reachable downstream graphs); getDataEntityDetails\nadds the CENTERPIECE READ\
  \ — the single hottest endpoint with the\nwidest blast radius (full 34-field detail\
  \ payload).\n\nADR-CANDIDATE-003 (read-collaborative borderline) was originally\n\
  surfaced via getAllAlerts + getActivity in batch B. Batch E promoted\nthis to a\
  \ 3-sidecar pattern. **Batch F RESOLVES the borderline_flag**\nvia the getDataEntityDetails\
  \ primary-source: the posture is\nINTENTIONAL on the centerpiece read, consistent\
  \ with 27+ other GETs\non the same controller. The platform DELIBERATELY ships\n\
  read-collaborative; the doc-gap is doc-side, not code-side.\n\n**Batch H** adds\
  \ THREE repository-layer SQL primary-source\nconfirmations: ReactiveAlertRepositoryImpl\
  \ (listAllWithStatusOpen\nat lines 143-145 has no owner predicate); ReactiveLineageRepositoryImpl\n\
  (recursive-CTE walks lineage edges with is_deleted filter only —\nthe lineage table\
  \ has no owner column at all); ReactiveDataEntityRepositoryImpl\n(every list-shape\
  \ method on the repository returns rows with no per-tenant\nfilter; the repository's\
  \ 982 lines + 35+ methods contain ZERO authorization\nannotations and ZERO principal\
  \ parameters in any signature).\n\n**Batch I** adds THREE service-layer service-tier confirmations:\nDataEntityServiceImpl (10 of 22 public methods + listAssociated counter-example);\n\
  AlertServiceImpl (listAll + getTotals.total + getDataEntityAlerts BYPASSES);\n\
  LineageServiceImpl (NEGATIVE-CASE SIBLING — getLineage + getDataEntityGroupLineage\n\
  apply no anchor-set; the positive case is DataEntityRelationsServiceImpl).\n\n\
  The catalog now has the controller-layer + service-layer + repository-layer + SQL-layer\
  \ confirmation\nthat the read-collaborative posture is uniform end-to-end — every\
  \ tier\nbypasses caller-identity for the list-shape reads. The ONE exception\n\
  at each tier is the explicit fetchAssociatedOwner pathway (anchor-set\ndefence-in-depth),\
  \ applied SPARSELY: listAssociated (DataEntity);\nlistByOwner (Alert); DataEntityRelationsServiceImpl.getDependentDataEntityOddrns\n\
  (Relations service); findByState's optional OwnerPojo (DataEntityServiceImpl).\n\
  \nSix DOC-NNN candidates flow from this invariant:\n  (a) `/features/alerts` page:\
  \ add a 'Who can see this' section\n      naming the read-collaborative posture\
  \ explicitly.\n  (b) `/features/active-platform-features/activity-feed` page:\n\
  \      same treatment; emphasise that the activity feed exposes\n      who-changed-what\
  \ across owners.\n  (c) `/features/data-discovery/search` page: same treatment;\n\
  \      the catalog search surface is the WIDEST single-page\n      cross-owner enumeration\
  \ vector.\n  (d) `/features/data-lineage` page: same treatment; lineage\n      edges\
  \ leak causal connections even when individual entity\n      visibility would otherwise\
