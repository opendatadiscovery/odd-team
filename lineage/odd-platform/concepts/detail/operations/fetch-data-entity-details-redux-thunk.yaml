notes: |-
  New concept captured in batch 2026-05-19J. This thunk is the operational hop
  that closes the F-001 view_count chain on the UI side. Combined with the LSN-017
  dep-array bug at DataEntityDetails.tsx:56-64, the thunk fires 2x per page-open
  in steady state — the empirical doubling pinned by probe P-004.

  The thunk's behaviour is well-understood; the gap is zero test coverage. A
  vitest + @testing-library/react suite mocking `dataEntityApi.getDataEntityDetails`
  and asserting (a) happy-path fulfilled lands in byId, (b) fan-out to 3 slices,
  (c) rejected sets AppError, (d) switchOffErrorMessage suppresses toast not
  reject — would lock down every invariant and ground the regression baseline.
