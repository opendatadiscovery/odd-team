notes: |-
  This invariant captures a doc-gap class — controller APIs missing
  from the /developer-guides/api-reference hub. Batch W's discovery
  is 5-controller-wide; this invariant is the DatasetController
  vertex of the broader cross-controller pattern.

  The architectural shape: every OpenAPI-generated controller
  carries a TAG (the OpenAPI top-level grouping). The API-reference
  hub uses TAGs as the per-feature sub-page anchor. A controller
  whose TAG has no sub-page is invisible from the docs even when
  its endpoints exist in the published spec.

  The gap is operator-facing — operators wiring custom integrations
  or scripts need to know the endpoints' caveats (RBAC scope,
  per-entity scoping, cross-owner readability, error contracts).
  The docs say none of this for the 5 controllers in scope.

  Cross-cutting connections:
    - Pairs with datasetcontroller-per-entity-scoping-bypass-data-entity-id-not-enforced-at-sql
      (THIS BATCH sibling — the bypass IS the kind of caveat that
      should be documented; the doc-gap hides the bypass from
      operators)
    - Pairs with f-004-read-side-surface-at-column-level-via-datasetcontroller-batch-w
      (THIS BATCH sibling — the F-004 read surface SHOULD be
      documented)
    - Pairs with datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation
      (THIS BATCH sibling — the DataSource controller has the same
      doc-gap class; both surfaces' 5-vertex picture is undocumented)
    - Pairs with read-collaborative-cross-owner-enumeration (the
      platform-wide pattern; the docs DO NOT describe the
      read-collaborative posture per-controller; the doc-gap
      compounds the security-awareness gap)

  Five DOC-NNN candidates (one per missing sub-page):
    (a) /developer-guides/api-reference/datasets
    (b) /developer-guides/api-reference/data-sources
    (c) /developer-guides/api-reference/namespaces
    (d) /developer-guides/api-reference/tags
    (e) /developer-guides/api-reference/collectors
  Plus the meta-gap closure: update the
  /developer-guides/api-reference HUB page to either add the 5
  missing sub-pages OR explicitly note they are intentionally
  omitted with the reason.
