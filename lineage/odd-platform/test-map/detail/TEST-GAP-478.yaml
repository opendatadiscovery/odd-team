  - "DOC-NNN candidate: description-mention side-channel and permissions"
proposed_action: |-
  Testcontainers integration test. (1) Grant test user `DATA_ENTITY_DESCRIPTION_UPDATE` ONLY (NOT `DATA_ENTITY_ADD_TERM`). (2) Pre-create term `finance:Customer`. (3) Invoke `PUT /api/dataentities/{id}/description` with body `{"description": "Refer to [[finance:Customer]]"}`. (4) Assert HTTP 200. (5) Query `SELECT count(*) FROM data_entity_to_term WHERE data_entity_id=? AND is_description_link=TRUE` returns 1. (6) Verify NO permission check fired for DATA_ENTITY_ADD_TERM. EXPOSES the side-channel; fix at TermServiceImpl service tier (or doc admission of the side-channel as intended) flips the assertion.
