name: Create Role
canonical_in_docs: true
canonical_candidate: false
description: 'POST /api/roles — gated by ROLE_CREATE NO_CONTEXT Permission via SECURITY_RULES
  (SecurityConstants.java:169). RoleServiceImpl.create runs under `@ReactiveTransactional`:
  INSERT into `role` + N INSERTs into `role_to_policy` (where N = `policies[]` length)
  + read-back via `roleRepository.getDto(id)`. Returns 200 OK with `Role`. Note: spec
  declares 201 (openapi.yaml:3629) but controller returns 200 — same drift as POST
  /api/policies + POST /api/owners. Predefined Administrator + User names are protected
  from UPDATE + DELETE but NOT from CREATE (see Administrator-name reservation asymmetry
  invariant). Bypassed under `auth.type=DISABLED`.'
