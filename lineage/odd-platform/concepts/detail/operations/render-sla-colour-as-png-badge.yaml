name: Render SLA colour as PNG badge
canonical_in_docs: true
canonical_candidate: false
description: |-
  GET /api/datasets/{data_entity_id}/sla returns image/png — a hardcoded
  sla_red.png / sla_yellow.png / sla_green.png byte-array shipped as a classpath
  resource (odd-platform-api/src/main/resources/sla/sla_{red,yellow,green}.png).
  Bytes are cached in memory at bean init via CachingByteArraySLAResourceResolver
  (lines 30-42); per-request cost is the SQL aggregation against
  ReactiveDataQualityRepositoryImpl.getSLA + a byte-array copy. NEW operation,
  batch 2026-05-20T (DataQualityController class sidecar).

  The deliberate intent is BI-tool embeddability — Confluence pages, Excel cells,
  any img-src renderer can display the SLA badge without parsing JSON or computing
  colour mapping. Companion to compute-detailed-sla-report-as-json which serves
  the same SLA computation as JSON for programmatic consumers.

  vocabulary_status: codebase-anchored + doc-side-covered-with-drift (live
  https://docs.opendatadiscovery.org/features/data-quality/sla-statuses 2026-05-20
  status 200 names the endpoint verbatim BUT misdescribes the response shape —
  see invariant sla-as-png-vs-jsonsla-report-drift).
axes_present:
- controllers
nodes:
- odd-platform java DataQualityController controller-class:DataQualityController
