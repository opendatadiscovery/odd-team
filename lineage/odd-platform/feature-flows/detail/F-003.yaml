      OwnerAssociation wrapper does NOT render — meaning the Recommended panel
      (including Popular) is HIDDEN from the home page on DISABLED deployments.
      Live doc says the opposite: "on auth-disabled deployments the panel is
      visible but the per-user filtering does not apply" (catalog-overview.md:43).
      Under DISABLED the UI-driven inflation path is CLOSED on the home page,
      but the API path `/api/dataentities/popular` remains anonymous-reachable
      (per F-001 + the batch-G `getPopular` sidecar). PRIMARY-SOURCE CONFIRMED
      batch J.
    expected: docs match code — probably docs need fixing; the code gate is
      the correct behaviour for an owner-association-dependent feature
    drift_class: spec_says_X_impl_does_Y
    provenance: STATIC — primary-source verification at Overview.tsx:25-27,
      :53-59 + PopularStrip sidecar doc_drift_findings[1] (WebFetch
      2026-05-19 status 200). NEW DOC-GAP candidate.
  - facet: Popular tile API exposes 9 fields, view_count NOT among them (batch J)
    observed: |-
      The Popular API endpoint `GET /api/dataentities/popular` returns a
      `DataEntityRef[]` payload with a 9-field projection (id, oddrn,
      externalName, internalName, entityClasses[], manuallyCreated, status,
      isStale, hasAlerts) — view_count is NOT in the projection (per
      PopularStrip sidecar concepts.entities[0] + batch-G getPopular sidecar
      data_exposure[0]). The UI therefore cannot display "X views" on the
      Popular tile because the API does not surface the signal. From an
      operator perspective: the "Popular" ranking is opaque — they see the
      list ordering but not the underlying score. From an attacker
      perspective: inflation is still observable (the ordering shifts),
      but the magnitude is hidden. PRIMARY-SOURCE CONFIRMED batch J.
    expected: documented opacity OR view_count exposed for transparency
    drift_class: null
    provenance: STATIC — primary-source verification at PopularStrip sidecar
      concepts.entities[0] + batch-G getPopular sidecar data_exposure[0].
  - facet: "'Popular = most-viewed or most-used' doc framing misleads (batch J)"
    observed: |-
      Live doc (`catalog-overview.md:50`): "the most-viewed or most-used data
      entities across the catalog". Code (per batch-G `getPopular` + this
      sidecar): the ranking signal is EXCLUSIVELY `view_count DESC`. There is
      no 'most-used' signal — no usage-frequency counter, no time-weighted
      usage, no edit-count, no API-call-count, just the singular `view_count`
      field that increments only on `GET /api/dataentities/{id}`. The "or
      most-used" disjunction misleads operators into thinking the ranking
      blends multiple signals; in reality the ranking is monotonically driven
      by detail-reads only. An entity that has never been viewed (but is
      heavily INGESTED, EDITED, ALERTED on, or appears in many lineage walks)
      has view_count=0 and cannot reach Popular regardless of any other
      'use'. This is the F-001 inflatability surface restated in doc terms.
    expected: doc precision — "Popular ranks by view_count DESC; view_count
      increments on detail-page open"
    drift_class: spec_says_X_impl_does_Y
    provenance: STATIC — primary-source verification at PopularStrip sidecar
      doc_drift_findings[2] + the singular view_count ranking confirmed
      at batch-G getPopular sidecar. NEW DOC-GAP candidate.
  - facet: service tier is a 1-line pass-through (batch I — STATIC)
    observed: 'DataEntityServiceImpl.listPopular (lines 227-231) is `reactiveDataEntityRepository.listPopular(page,

      size).map(dataEntityMapper::mapRef)` — ONE line, NO @ReactiveTransactional, NO

      caller-identity check, NO enrichment, NO owner filter. The service tier adds

      ZERO defence; the producer-side amplification (F-001''s view_count inflation)

      flows DIRECTLY into the consumer-side ranking signal at the repository CTE.

      The cross-feature loop closes at this layer.'
    expected: same — the 1-line pass-through is the design choice; fixes belong at the repository CTE (EXCLUDE_FROM_SEARCH)
