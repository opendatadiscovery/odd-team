proposed_action: |-
  Add to `OwnersList.test.tsx`: (a) `infinite_scroll_no_dispatch_when_hasNext_false` — mount with `pageInfo: {hasNext: false, page: 5}`; trigger InfiniteScroll's `next`; assert ZERO dispatches; (b) `infinite_scroll_dispatches_next_page_when_hasNext_true` — mount with `hasNext: true, page: 5`; trigger; assert one `fetchOwnersList({page: 6, size: 100, query: ''})`; (c) `dep_array_does_not_double_fire_LSN_017_regression_pin` — render component; flip `isOwnerCreating` from false→true→false within a single tick; assert exactly one extra dispatch (the create-completion refetch, NOT two). Pair with `debounce_coalesces_search_keystrokes` mirroring TEST-GAP-640 shape.
