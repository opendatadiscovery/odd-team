  validation:
    verdict: partial
    actual_behavior: |-
      The per-button outcome IS correct: the Edit button is gated by WithPermissions(UPDATE) and
      the Delete button by WithPermissions(DELETE) separately (QueryExampleDetailsContainerActions.tsx:40,53),
      and PermissionProvider.getHasAccessTo checks the specific permission — so an UPDATE-only user
      gets Edit-only, a DELETE-only user gets Delete-only. BUT the route-level
      WithPermissionsProvider uses `allowedPermissions.every(...)` AND-semantics (PermissionProvider.tsx:19-31),
      so the context-level `isAllowedTo` is true only when the user holds BOTH — any descendant that
      consumed the context-level boolean (rather than getHasAccessTo for a specific permission) would
      mis-gate. The detail page itself ALSO renders fully for a user holding NEITHER permission (the
      page never 403s — read-collaborative). So the hypothesis holds for the two action buttons but
      the underlying every()-AND context is a latent mis-gating shape, and the page-level read is
      ungated.
    evidence:
      - sidecar: odd-platform__ts__routes__route__queryExamples
