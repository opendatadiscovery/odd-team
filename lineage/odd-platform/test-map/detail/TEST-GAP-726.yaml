proposed_action: |-
  Add `TermControllerSideDoorPermissionTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `createTerm_withNeverSeenNamespaceName_succeedsForUserHoldingTermCreateButNotNamespaceCreate` — authenticate as a user with TERM_CREATE on the target namespace BUT NO NAMESPACE_CREATE; POST `/api/terms` with `namespaceName: 'fresh-namespace-' + UUID.randomUUID()`; assert 200/201 AND assert `SELECT COUNT(*) FROM namespace WHERE name = ?` returns 1 (the side-door wrote the namespace). PIN the bypass.
  2. `updateTerm_withNeverSeenNamespaceName_succeedsForUserHoldingTermUpdateButNotNamespaceCreate` — sister test on the update path.
  3. `createTermTagsRelations_withNeverSeenTagNames_succeedsForUserHoldingTermTagsUpdateButNotTagCreate` — authenticate as a user with TERM_TAGS_UPDATE on the target term BUT NO TAG_CREATE; PUT `/api/terms/{term_id}/tags` with `names: ['fresh-tag-' + UUID.randomUUID()]`; assert 200 AND assert `SELECT COUNT(*) FROM tag WHERE name = ?` returns 1.
  4. `createTerm_withNeverSeenNamespaceNameWithSpecialCharacters_assertsAcceptedVerbatimNoValidation` — pin the absence of namespace-name validation (compounds with the broader observation that namespace names accept arbitrary strings).
  5. `createTermTagsRelations_withFiftyNeverSeenTagNames_allCreatedInSingleCall_assertsBulkSideDoor` — pin the BULK bypass capability (a single call can create N tags).

  Pair with a follow-up backlog item proposing a SERVICE-LAYER fix: split `getOrCreate` into `get + create`, require the caller to hold the dedicated `*_CREATE` permission for the create branch. When the fix lands, tests #1-#5 invert to assert 403 unless the dedicated permissions are granted.

  Cross-pair with a documentation fix: surface the side-door in `documentation/docs/features/data-glossary/business-glossary.md` and `documentation/docs/features/management.md` so operators authoring RBAC policies see the current ground truth. Without the doc note, RBAC architects authoring policies cannot avoid the cliff.
