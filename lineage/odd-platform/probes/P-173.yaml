    attr: rel
    capture_as: github_link_rel
  - kind: dom-attr
    of: menu_dom_authn
    css: 'a[href*="runbook.internal"]'
    attr: rel
    capture_as: operator_link_rel
  - kind: dom-attr
    of: menu_dom_authn
    css: 'a[href*="javascript"]'
    attr: href
    capture_as: js_url_href_sanitised
  - kind: dom-attr
    of: menu_dom_authn
    css: 'a[href*="data:"]'
    attr: href
    capture_as: data_uri_href
  - kind: dom-text
    of: menu_dom_anon
    css: ':text("ODD Platform version")'
    capture_as: anon_sees_version_label
  - kind: dom-text
    of: menu_dom_anon
    css: '#app-info-menu h4:first-of-type'
    capture_as: anon_version_value
  - kind: bool
    of: keyboard_activation
    capture_as: keyboard_opens_menu
assert:
  # (1) Tabnabbing — none of the rendered links carry rel="noopener noreferrer"
  - "github_link_rel == null  # DRIFT — should be 'noopener noreferrer'"
  - "operator_link_rel == null  # DRIFT — operator-configured URL has no rel guard"

  # (2) URL-scheme passthrough
  - "js_url_href_sanitised == null OR js_url_href_sanitised.startsWith('javascript:') == false  # React should strip"
  - "data_uri_href != null  # data: passes through React's sanitiser"

  # (3) Anonymous version disclosure under DISABLED
  - "anon_sees_version_label != null  # the label IS rendered to anonymous viewers"
  - "anon_version_value != null AND anon_version_value matches /\\d+\\.\\d+\\.\\d+/  # full project version exposed"

  # (4) Keyboard inaccessibility
  - "keyboard_opens_menu == false  # tab+enter does NOT open the menu (onMouseEnter only)"
cleanup:
