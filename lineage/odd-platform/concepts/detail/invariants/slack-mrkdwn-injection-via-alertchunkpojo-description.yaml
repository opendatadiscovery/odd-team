mitigations_unimplemented:
  - |-
    Add MrkdwnUtils.escape(String input) that backslash-escapes Slack
    mrkdwn metacharacters: * _ ~ < > @ ! and the special <!channel> /
    <!here> / <@USER_ID> token forms. Apply at
    SlackMessageGenerator.java:77 immediately before
    markdownText(escapedDescription).
  - |-
    Document the Slack mrkdwn injection risk on the live
    /features/active-platform-features/notifications page with operator-
    facing mitigation guidance — pending the code fix, operators can
    deploy a Slack-side workspace policy that strips @channel from bot
    posts (most Slack workspace admins have this control via Apps &
    integrations).
  - |-
    Add a unit test at SlackMessageGenerator level that asserts a
    description containing @channel / @here / <url|text> tokens is
    delivered verbatim NOT (after the fix) escaped — pins the contract.
  - |-
    Cross-cutting case-law extension: extend the F-004 master mitigation
    "add rehype-sanitize to Markdown.tsx" to also include "add
    MrkdwnUtils.escape to SlackMessageGenerator" — the two fixes close
    the operator-supplied-content surface end-to-end across web AND
    Slack rendering.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20Y from the
  SlackNotificationSender sidecar's primary-source evidence at the
  SlackMessageGenerator rendering site. STRENGTHENS the F-004 stored-XSS
  family from 4-surface (web Markdown) to 5-surface coverage with the
  Slack mrkdwn destination added as a new dialect.

  THE 5-SURFACE F-004 PICTURE — refined:
    Surface 1-4 share rehype-raw-without-rehype-sanitize at Markdown.tsx
    (single fix-point; the closure invariant
    no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic covers them).
    Surface 5 uses a DIFFERENT rendering pipeline (Slack mrkdwn via
    SlackMessageGenerator.markdownText) — the closure invariant does NOT
    extend to it; a SECOND fix-point (MrkdwnUtils.escape) is required
    to close surface 5.

  Cross-cutting connections:
    - Extends the F-004 master invariant
      markdown-rendering-via-rehype-raw-without-rehype-sanitize-stored-xss-surface-on-internal-description
      to a 5th surface with a different rendering dialect
    - Pairs with the cross-tenant-exposure-one-url-per-deployment
      invariant (also batch Y) — the broadcast blast radius is set by
      the channel membership, which is determined by the operator's
      single Slack URL choice
    - Pairs with the unconditional broadcast / pii passthrough drift
      class — operator-supplied content reaches every recipient with no
      scoping

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the Slack mrkdwn injection risk on the live
        notifications page (or fix the code at SlackMessageGenerator.java:77)
    (b) Extend the F-004 master documentation to name surface 5 — the
        operator-trust posture document needs a non-web rendering
        destination example
