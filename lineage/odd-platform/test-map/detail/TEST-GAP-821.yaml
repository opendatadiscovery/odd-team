proposed_action: |-
  Add `PostDataSetStatsListEmptyNullPayloadAsymmetryRegressionPinTest`. Three test methods, no Testcontainers needed (mock the service tier):

  1. `post_nullItems_returnsHTTP500_NPE_pinsCurrentBehavior` — POST `{items: null}` (or `{}` so Jackson default-nulls `items`) → assert 500 + assert NPE stack-frame contains `DatasetFieldServiceImpl.updateStatistics`. PINS the leak.
  2. `post_emptyItems_returns201_pinsSilentNoOp` — POST `{items: []}` → assert 201 + assert NO write to `dataset_field.stats` (DB count comparison before/after).
  3. `post_validItems_returns201_pinsHappyPath` — POST `{items: [valid]}` → assert 201 + assert DB write.
  4. **Asymmetry pin**: `post_postDataEntityList_emptyItems_returns400_pinsTheSiblingDoesGuard` — for contrast, hit POST `/ingestion/entities` with `{items: []}` → assert 400 + body contains "Ingestion payload is empty". The pair-test makes the asymmetry concrete; a future REFACTOR adding a guard here MUST flip the (1) and (2) assertions to 400.

  Coherence note (LSN-018 Rule 6): NET-NEW. Pairs with TEST-GAP-825 for the ingestMetrics empty-payload variant. TEST-GAP-398 covers DataEntityStatisticsTest boundary conditions at MEDIUM but does NOT name the null-NPE or the empty-201 specifically — this entry SUPERSEDES TEST-GAP-398's first bullet ("what happens when the dataset doesn't exist") with the more general empty/null contract; TEST-GAP-398's second bullet (activity events) remains valid as a sibling concern. Add `superseded_by_aspect: TEST-GAP-821` to TEST-GAP-398's coherence_note. Or treat the two as parallel — they pin different aspects of the same boundary. Default position: parallel (this is not a contradiction).
