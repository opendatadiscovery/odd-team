test_matrix:
  unit:
    state: GAP
    covered: []
    uncovered:
      - TermDetailsView mount-fires fetchTermDetails + fetchResourcePermissions exactly once per termId change
      - TermDetailsTabs auto-hide logic — assert tab hidden when count == 0; visible when count > 0
      - Overview double-fetch — assert N=2 invocations of getTermDetailsDto per page open (pin the current shape OR fix and assert 1)
      - TermDetailsRoutes navigate-to-overview default — assert empty path redirects to /overview
  integration:
    state: GAP
    covered: []
    uncovered:
      - End-to-end navigation /terms/:termId mount → /overview redirect → sub-route mount → API calls observed
      - Tab visibility assertion — Term with linked entities renders the tab; Term without does not
      - Query-examples sub-route permission gate — caller without QUERY_EXAMPLE_TERM_CREATE sees the linked-list but no Add button
  performance:
    state: GAP
    covered: []
    uncovered:
      - Double-fetch latency pin — measure latency to first interactive on /terms/:termId/overview for a heavily-linked Term (target N=1000 linked entities)
      - Tab switching latency — assert lazy-route activation time vs eager-mount baseline
  security:
    state: GAP
    covered: []
    uncovered:
      - Query-examples sub-route — unauthorized caller bypasses WithPermissionsProvider via direct route hit and observes content
      - Overview tab linked-terms panel — TERM_UPDATE leak via DOM inspection on the Add-term button visibility
