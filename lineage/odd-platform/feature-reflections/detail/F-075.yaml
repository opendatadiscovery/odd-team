    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: |-
    When DIRECT_OWNER_SYNC is granted, it reflects an authoritative IdP/OIDC group mapping —
    i.e. the platform verifies the user genuinely belongs to the owner's group before
    auto-binding, matching the "trust the IdP" design intent.
  derivation: |-
    implicit_adrs[2] states the intent: DIRECT_OWNER_SYNC exists for "OIDC-group-mapped users
    where the IdP authoritatively binds users to owners"; a product owner expects the
    auto-approve to be conditioned on that mapping.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      No OIDC group mapping is consulted anywhere in the branch. The check is purely
      `permissions.contains(Permission.DIRECT_OWNER_SYNC)` against
      getNonContextualPermissionsForCurrentUser(MANAGEMENT) (lines 60-64). DIRECT_OWNER_SYNC is
      an ordinary MANAGEMENT permission grantable via any ad-hoc Policy in the Policies tab
      (PolicyPermissionDto.java:70; the PermissionController sidecar confirms MANAGEMENT
      permissions flow from the policy graph, hasContext=false). The owner the user requests
      is the owner they get bound to — there is no cross-check that the user's IdP groups
      include that owner. The "trust the IdP" framing is an aspiration the code does not enforce.
    evidence:
      - sidecar: SOURCE_READ
        section: source_read_for_validation
        cite: "OwnerAssociationRequestServiceImpl.java:60-67"
        note: "Branch keys on the permission set only; no group-claim lookup, no owner↔group cross-check."
      - sidecar: odd-platform__java__PermissionController__controller-class__PermissionController.md
        section: "docs_link_semantic.fetched_excerpts(b) + concepts"
        cite: "PolicyPermissionDto.java:70 (DIRECT_OWNER_SYNC MANAGEMENT) + PolicyTypeDto.java:12 (MANAGEMENT hasContext=false)"
        note: "DIRECT_OWNER_SYNC is a normal MANAGEMENT permission resolvable from any policy — not gated on IdP group membership."
    operator_visible_failure: |-
      An operator who grants DIRECT_OWNER_SYNC believing it only takes effect for IdP-mapped
      users actually grants the holder the ability to auto-bind to ANY owner of their choosing.
      In LOGIN_FORM mode the seeded admin holds ALL MANAGEMENT permissions (incl.
      DIRECT_OWNER_SYNC) statically, so the "IdP" precondition does not even exist — the branch
      fires for a local admin. The permission's name and the doc line ("without an approval
      request") undersell that it is a self-bind primitive, not an IdP-sync convenience.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

