behaviour: |-
  **POLICY SCHEMA-VALIDATION FAILURE SURFACES AS HTTP 500 — operator sees `Internal Server Error` for a CLIENT mistake.** `PolicyJSONValidator.validate` throws `IllegalArgumentException("Policy is not valid: " + errors)` at PolicyJSONValidator.java:28-32. `ControllerAdvice` has handlers for `BadUserRequestException` → 400, `UniqueConstraintException` → 400, `CascadeDeleteException` → 400, `WebExchangeBindException` → 400, and a CATCH-ALL `Exception.class` → 500 with body `"Internal Server Error"`. `IllegalArgumentException` has NO dedicated handler — it falls through to the catch-all at ControllerAdvice.java:61-66 and surfaces as HTTP 500 with body `"Internal Server Error"` (NOT the validator's actual error message). An operator POSTing a malformed policy body gets a generic server error and must read server logs to see the schema violation. The fix is one-line: either `PolicyJSONValidator` throws `BadUserRequestException`, or `ControllerAdvice` adds an `IllegalArgumentException` handler. The test pins the CURRENT mis-mapping behaviour so the fix breaks the test deliberately.
