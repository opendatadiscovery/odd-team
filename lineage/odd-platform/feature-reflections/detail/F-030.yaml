- id: H-010
  hypothesis: |-
    When a collector pushes a payload that exceeds the platform's body-size limit, it
    receives HTTP 413 Payload Too Large with a clear "reduce batch size" message it can
    act on.
  derivation: |-
    Endpoint-shape; a client over a size cap expects the canonical 413 contract, not an
    opaque 500.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      CONFIRMED that the hypothesis is FALSE in the user's favour's-opposite direction:
      the implementation returns 500, not 413. Body is buffered to spring.codec.max-in-memory-size:
      20MB; over-cap payloads throw DataBufferLimitException → HTTP 500 (grep for a
      DataBufferLimitException @ExceptionHandler returns 0 matches). Compounded on the
      PROMETHEUS path: a high-cardinality batch may serialise to <20MB inbound but fan out
      to a >20MB Snappy-compressed WriteRequest that silently fails at the outbound codec
      layer BEFORE the POST is sent. The verdict is confirmed-as-a-known-behaviour (the
      500-not-413 mapping is real and pinned by the sidecar evidence); it is a contract
      gap shared with the postDataEntityList sibling.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics.md
        section: bugs_limitations_corner_cases
        cite: "IngestionController.java:90 (Mono<MetricSetList>) + application.yml:14-15 + grep DataBufferLimitException handler = 0 matches"
        note: "over-cap → 500 not 413; no custom handler"
      - sidecar: odd-platform__java__CounterTimeSeriesExtractor__config-key-consumer__metrics_storage@L20.md
        section: performance.resource_allocation
        cite: "ExternalIngestionMetricsServiceImpl.java:76 (no .codecs override) + application.yml:14-15"
        note: "outbound Prometheus write also bounded by the 20MB codec; >20MB fails silently pre-POST"
    operator_visible_failure: |-
      (1) A collector exceeding 20MB gets an opaque 500 it cannot distinguish from a server
      error, with no signal to reduce batch size. (2) On the PROMETHEUS path the failure is
      WORSE: an inbound-OK / outbound->20MB batch fails silently at the codec layer before
      the Prometheus POST — the collector may see success-shaped behaviour or an opaque
      error with no indication that the write never left the platform. (3) No doc surfaces
      the 20MB cap.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

