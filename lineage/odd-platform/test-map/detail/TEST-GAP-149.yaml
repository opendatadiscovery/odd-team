behaviour: '**S2S composes-not-mutex — X-API-Key grants ADMIN across ALL /** paths
  under LOGIN_FORM/OAUTH2/LDAP**: `S2sAuthenticationFilter.java:31-39` hard-codes
  `User.withUsername("ADMIN")...roles("ADMIN")` (admin=true) on `X-API-Key` match.
  The filter is added at `SecurityWebFiltersOrder.HTTP_BASIC` order in EACH of the
  three interactive modes BEFORE the interactive-auth challenge. A single shared `auth.s2s.token`
  string grants ADMIN across the ENTIRE `/**` UI/API surface (not just `/ingestion/entities`).
  Live S2S page documents ''any endpoint that admins can call'' but per-mode pages
  do not cross-link or warn. 4-sidecar triangulated HIGH per concept.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/S2SAdminAcrossAllPathsTest.java
  name: s2sEnabled_validXApiKey_grantsAdminAcrossUiAndApiSurface
evidence:
- 'OAuthSecurityConfiguration@L71.md says: ''an unauthenticated request bearing a
  valid X-API-Key is processed as ADMIN for the entire request lifecycle — including
  all UI endpoints, not just /ingestion/entities'''
- 'LDAPSecurityConfiguration@L51.md says: ''an S2S token grants ADMIN to the ENTIRE
  /api/** and /ingestion/** surface, not just ingestion'''
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[2] HIGH (3-sidecar
  triangulated)
cross_references:
