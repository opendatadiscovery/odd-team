proposed_action: |-
  Add `ManagementRoutesWrapperConsistency.test.tsx`:

  (a) `integrationsSubroute_renderedWithoutPermissionContextProvider_pinsCurrentWiringDrift`: assert that `<Route path='integrations/*'>` at ManagementRoutes.tsx:150 is NOT wrapped in `<WithPermissionsProvider>` while ALL OTHER sub-routes at ManagementRoutes.tsx:29-149 ARE wrapped (use snapshot or DOM traversal of the rendered route tree); pins the asymmetry so a future maintainer either fixes it intentionally or has to update this test.

  (b) `integrationsSubroute_innerHasAccessTo_fallsBackToOuterContextOnly`: mount `<Integrations />` under the actual `<Management />` route tree with an authenticated user holding `DATA_SOURCE_UPDATE` (a non-Management-tier permission); inject a test-only `<TestComponent>` that calls `usePermissions().hasAccessTo(Permission.DATA_SOURCE_UPDATE)` and assert it returns FALSE (the outer context does not include the permission). Pins the BROKEN-CLOSED failure mode explicitly so a fix has a target.

  Add a TODO comment at ManagementRoutes.tsx:150 documenting: 'Integrations sub-route omits the per-sub-route <WithPermissionsProvider> by historical accident (retro-fit). Inner `usePermissions().hasAccessTo` calls fall back to the OUTER Management.tsx context (allowedPermissions=[OWNER_ASSOCIATION_MANAGE]). If you add permission-gated affordances inside Integrations, wrap the route in <WithPermissionsProvider allowedPermissions={[...]}> with the appropriate permissions vector.'
