behaviour: |-
  **HIGH — META cross-cutting finding: the ENTIRE `components/DataQuality/` subtree of `odd-platform-ui/src` has ZERO test files. F-032 (P-04:F-002 Catalog-wide Data Quality Dashboard) is shipped to operators with no unit tests, no integration tests, no smoke tests, no story files. Verified by `find /home/raman/work/odd/odd-platform/odd-platform-ui/src/components/DataQuality -type f` — 21 source files, 0 test files (2026-05-22). Verified by `grep -rln 'DataQuality' /home/raman/work/odd/odd-platform/odd-platform-ui/src --include='*.test.*' --include='*.spec.*'` — zero matches.**

  **The 21 untested source files**:
  - `DataQuality.tsx` (route entry)
  - `DataQuality.styles.ts`
  - `DataQualityContent.tsx` (dashboard body — 147 lines)
  - `interfaces.ts`
  - `DataQualityStore/DataQualityStore.ts` (filter atoms — 66 lines)
  - `DataQualityStore/DataQualityProvider.tsx` (the jotai Provider wrapper)
  - `DataQualityFilters/DataQualityFilters.tsx` (filter panel — 93 lines)
  - `DataQualityFilters/DataQualityFiltersStyles.ts`
  - `TestResults/TestCategoryResults.tsx` (per-category row — 48 lines)
  - `TestResults/TestCategoryResults.styles.ts`
  - `DataQualityFilters/FilterItem/{Namespace,Datasource,Owner,Title,Tag}Filter.tsx` (5 filter components)
  - `DataQualityFilters/hooks/index.ts` (the useFilter shared hook — 47 lines)
  - `DataQualityFilters/FilterItem/MultipleFilterItem/MultipleFilterItem.tsx`
  - `DataQualityFilters/FilterItem/MultipleFilterItem/MultipleFilterItemAutocomplete/MultipleFilterItemAutocomplete.tsx` (the autocomplete — 178 lines, where the stale-closure bug TEST-GAP-923 lives)
  - `DataQualityFilters/FilterItem/MultipleFilterItem/MultipleFilterItemAutocomplete/MultipleFilterItemAutocompleteStyles.ts`
  - `DataQualityFilters/FilterItem/MultipleFilterItem/SelectedFilterOption/SelectedFilterOption.tsx`
  - `DataQualityFilters/FilterItem/MultipleFilterItem/SelectedFilterOption/SelectedFilterOptionStyles.ts`

  **The wider context** (`odd-platform-ui/src` test landscape):
  - Total test files in the entire UI tree: 7 (verified: `find /home/raman/work/odd/odd-platform/odd-platform-ui/src -type f \( -name "*.test.tsx" -o -name "*.test.ts" -o -name "*.spec.ts" -o -name "*.spec.tsx" \)`).
  - All 7 are in just two areas: `shared/elements/{NumberFormatted, TextFormatted, EntityClassItem, BooleanFormatted}` (4) and `Overview/DataEntitiesUsageInfo/...` (3).
  - This is the project-wide UI test pattern — most React components have no test files.
  - DataQuality is the FIRST tier-1 feature surface comprehensively scanned (5 sidecars covering route entry, body, filter panel, store, and per-category row) — and it surfaces the SHARED systemic gap.

  **Why HIGH not CRITICAL**: cross-pillar (P-04 + P-09 — the dashboard surface AND the read-collaborative auth posture), and it triangulates the 17 individual TEST-GAPs in this batch (910-926) into one strategic anchor. Not CRITICAL because the systemic absence is project-wide and not a security vector on its own.

  **This gap is the META-anchor for batch ZC's TEST-GAPs 910-926**. Each individual gap in the 910-926 range can be cited in isolation — but the systemic answer is "the DataQuality subtree needs a test foundation, not 17 individual files". The maintainer's first priority should be a single `DataQuality/__tests__/setup.ts` (testing-library/jotai/MSW boilerplate) and a "smoke" test (`DataQualityDashboardSmokeTest` — mount the dashboard with mocked endpoints, assert the three DonutCharts render). With that foundation, the 16 specific gaps in this batch become small individual fix-items.

  **What this signals about the project's UI test posture** (a separate, larger finding):
  - 17 sidecars across 5 components surfaced 17 distinct test gaps + this META gap.
  - The 7 existing test files cover 7 small primitives across the ENTIRE UI surface.
  - A maintainer's natural reading of this state: "UI tests are not part of this project's culture" — a doc-as-product candidate observation that would feed a project-wide test-pillar activation discussion.

  **Test gap shape**: this is an INFRASTRUCTURE gap, not a single-test gap. The actionable item is: (a) create `odd-platform-ui/src/components/DataQuality/__tests__/setup.ts` with shared MSW handlers + jotai test-Provider helpers + render utilities; (b) author a single "smoke" test that mounts <DataQuality> with mocked APIs and asserts the three rings render; (c) iteratively close TEST-GAPs 910-926 against that foundation.
