behaviour: |-
  **Rejection emits literal `'Domain null doesn't match with allowed domain odd.com'` for personal @gmail.com accounts.** When a non-Workspace user tries to log in to an allowedDomain'd deployment, the `hd` claim is null → the error message at line 53 literally interpolates `null` via `String.format("Domain %s doesn't match with allowed domain %s", domain, provider.getAllowedDomain())`. The end-user sees the string 'Domain null doesn't match with allowed domain odd.com' in the Spring OAuth2 error page. Two issues: (a) UX: 'null' is an implementation detail leaked to the user; (b) minor info-disclosure: the attacker learns the deployment's allowedDomain is set (which they could already infer from the `?hd=odd.com` query parameter on the authorize URL, so the disclosure is marginal). The fix is one-line: branch on `domain == null` → friendlier 'Your account is not part of an allowed organization' message.
