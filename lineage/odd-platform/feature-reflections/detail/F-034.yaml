- id: H-010
  hypothesis: "If a deployment override removes the datacollaboration.enabled / notifications.enabled keys entirely (a minimal externalized application.yml), the platform still boots and the feature is treated as off."
  derivation: "Negative-space: operators frequently write a slim override config; the @Value SpEL uses the bare ${...} form with no :false default."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The behaviour splits on WHICH config layer the key is missing from. BooleanUtils.isTrue(null) is
      null-tolerant, so the RESOLVER logic is fail-soft (treats absence as false). BUT the @Value bindings
      ${datacollaboration.enabled} / ${notifications.enabled} carry NO SpEL-level default (FeatureResolver.java:6-10),
      so if the key is absent from BOTH the override AND the bundled application.yml, Spring fails the @Component
      constructor at boot with 'Could not resolve placeholder' — the app does not start (FeatureController sidecar
      bugs_limitations_corner_cases[5] + dependencies_semantic.requires-config). The bundled application.yml supplies
      false, so a stock install is safe; an operator who writes a fresh application.yml without copying these keys
      bricks startup with an opaque error. So: 'still boots, treated as off' is TRUE when the bundled defaults remain
