name: Exception-type asymmetry between notification senders
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
description: |-
  **NEW INVARIANT, batch 2026-05-19K** — a silent contract-violation between
  the dispatcher's per-sender catch and one sender implementation. The
  dispatcher (`AlertNotificationMessageProcessor.process()` at lines 29-35)
  catches `NotificationSenderException` (a checked exception extending
  `Exception`) per-sender, logs at ERROR, and continues to the next sender —
  the documented "one bad channel does not block the others" stance. Slack
  and Webhook senders correctly throw `NotificationSenderException`
  (per AbstractNotificationSender.java:24-29 wrapping HTTP failures).
  **EmailNotificationSender VIOLATES this contract** at
  `EmailNotificationSender.java:58-60`: catches `MessagingException |
  TemplateException | IOException` and throws `new RuntimeException(...)` —
  NOT `NotificationSenderException`. The unchecked `RuntimeException`
  BYPASSES the dispatcher's `catch (NotificationSenderException e)` clause
  and propagates upward, aborting `process()` mid-fan-out. Any senders AFTER
  email in the iteration order do NOT receive the alert. The
  `List<NotificationSender>` iteration order is Spring-bean-injection-order,
  which is package-scan-order-dependent and undefined — operators cannot
  predict whether email runs first, middle, or last. **The contract
  violation is doc-side and code-side undocumented.** The live
  `/features/active-platform-features/notifications` page describes "next
  channel still runs" behaviour as a uniform property of all channels,
  contradicted by this one bypass. Operator-facing remediation: either
  (a) fix EmailNotificationSender to wrap as NotificationSenderException;
  (b) broaden the dispatcher's catch to `catch (Exception e)`; OR (c)
  introduce explicit `@Order` annotations to put email LAST so the bypass
  blast-radius is minimised. Cross-batch implication: any new
  `NotificationSender` implementation inherits this latent hazard unless
  the author audits the exception contract.
