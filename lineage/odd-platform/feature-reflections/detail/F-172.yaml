# Admin Direct-Bind UserOwnerMapping Create — product-owner reflection

## product_owner_narrative

The **Associations** tab under Management is where an operator wires authenticated
platform users to catalog-side **Owner** identities — the binding that lets
owner-scoped behaviours (My Objects, owner-filtered alerts, ownership badges, and
RBAC role resolution) resolve a logged-in principal to a team. Most of that wiring
happens through a request-and-approve workflow, but this feature is the operator's
**fast lane**: a "+ Create association" button in the tab header (visible only to
operators holding `OWNER_RELATION_MANAGE` — a HIDE posture, the button is absent for
everyone else) opens a small modal that binds a user to an owner in one shot, with no
pending state and no second approver (per the feature-flow chain hop-1/hop-2,
`OwnerAssociationsHeader.tsx:29-39` + `OwnerAssociationForm.tsx:22-26`, and confirmed
verbatim in the live doc this invocation: "operators holding the `OWNER_RELATION_MANAGE`
permission see a **Create association** button" that "writes the binding directly —
there is no intermediate 'pending' state").

A user interacts with it by filling three required fields: an **Owner** picked from an
autocomplete over existing owners (`OwnerIdAutocomplete`), an **oidcUsername** typed as
free text, and a **provider** picked from the active-provider list (`ProviderAutocomplete`)
(per feature-flow hop-2, `OwnerAssociationForm.tsx:56-76`). On submit the form fires the
`useCreateUserOwnerMapping` mutation, which the feature-flow hop-3 inferred targets
`POST /api/user_owner_mapping`. That inference is **wrong**: the actual endpoint is
`POST /api/owners/mapping`, gated by `OWNER_RELATION_MANAGE`, served by the SAME
`OwnerAssociationRequestController` that serves the request-and-approve workflow (per
`SecurityConstants.java:155-158`, read this invocation, and the controller sidecar's
`coherence_notes[F-011]` enumerating `createUserOwnerMapping (POST /api/owners/mapping)`).

The working part the product owner would foreground in a demo: the binding is real and
immediate, but it is **speculative**. The operator picks an existing owner from the
autocomplete, so they cannot mint a bogus owner from this form — but they type the
username free-hand with no existence check against the IdP, so they can bind an owner to
a username that does not yet exist (or never will), and that orphan mapping sits silent
until the matching user logs in — if they ever do (per controller sidecar
`bugs_limitations_corner_cases[2]`, `OwnerAssociationRequestServiceImpl.java:109-114`).
The other demo caveat is the success affordance: on success the modal just closes — no
toast, no redirect, no inline confirmation that the row exists (per feature-flow facet
`submit_success_no_toast_no_redirect_modal_silently_closes`,
`OwnerAssociationForm.tsx:108`).

This feature is one of THREE write-paths into `user_owner_mapping`, and that is the
integration story that matters: F-075 owns branch A (a user self-requests and an admin
approves via the F-171 triage UI) and branch B (a `DIRECT_OWNER_SYNC` holder
auto-approves their own request); this is branch C (an admin binds directly). The row
this flow writes is consumed by F-011 (the principal-to-owner resolver that turns a
login into an Owner) and reversed by F-173 (the Active-tab Remove that calls
`DELETE /api/owners/mapping/{owner_id}`). The `ReactiveUserOwnerMappingRepositoryImpl`
sidecar is the shared persistence floor for all three branches: `createRelation`
soft-deletes any active row for the owner then inserts (clear-active-then-insert, not
upsert), and the `(oidc_username, provider)` compound key with its provider-null collapse
is the same cross-mode-bleed surface all three branches inherit.

The product owner's headline caveat — and the load-bearing finding of this top-down pass
— is that **the feature was modelled bottom-up as forensically silent, and it is not**.
Slice-H's ui-review inferred audit silence from a UI signal (the form calls
`useCreateUserOwnerMapping`, not `useCreateOwnerAssociationRequest`, so it looked like a
different controller bypassing the request audit). The backend reality is the opposite:
`createUserOwnerMapping` calls `createManualAssociationRequest` FIRST, which stamps an
`owner_association_request` row with `status=APPROVED` and writes a
`REQUEST_MANUALLY_APPROVED` activity row, THEN creates the mapping (per
`OwnerAssociationRequestServiceImpl.java:109-148`, read this invocation). The admin
direct-bind DOES show up in the History tab — and the live doc now says so explicitly
("All three write-paths are recorded here … Direct admin bindings appear as 'Approved'
rows attributed to the administrator"). The audit-silence premise the whole F-172 feature
flow is built around is contradicted on both the code axis and the doc axis.

