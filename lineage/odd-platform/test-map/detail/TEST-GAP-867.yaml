proposed_action: |-
  Add `TagRepositoryImplTiebreakAbsenceTest extends BaseIntegrationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/`. Three test methods:

  1. **`listMostPopular_equalUsageCountsWithinSize_orderInheritsTagIdAscFromCte_pinsTiebreakAbsence`** (HEADLINE):
     - Arrange: seed 10 tags (tag-001..tag-010) with serial IDs. Tag every entity with all 10 (every tag has usage_count = N entities).
     - Act: `reactiveTagRepository.listMostPopular(null, List.of(), 1, 30)`. (size > total, so no LSN-019 exclusion.)
     - Assert: response contains 10 elements in tag.id ASC order — i.e. IDs [1, 2, ..., 10]. PIN: the secondary sort defaults to CTE row order = tag.id ASC.

  2. **`listMostPopular_mixedEqualAndDistinctCounts_distinctCountsRankFirst_equalCountsTiebreakByIdAsc_pinsHybridSort`**:
     - Arrange: 5 tags with counts [3, 5, 3, 5, 3] respectively (IDs 1..5).
     - Act: `listMostPopular(null, List.of(), 1, 30)`.
     - Assert: response order is [tag-002 (count=5), tag-004 (count=5), tag-001 (count=3), tag-003 (count=3), tag-005 (count=3)] — count DESC first, tag.id ASC tiebreak within each equal-count group. PIN: the tiebreak is observable in practice.

  3. **`listMostPopular_equalCountsAcrossPagination_stableOrderAcrossPages_pinsImplementationDefinedStability`**:
     - Arrange: 60 tags all with usage_count = 1.
     - Act: `listMostPopular(null, List.of(), 1, 30)` + `listMostPopular(null, List.of(), 2, 30)`.
     - Assert: page 1 contains IDs 1..30 in ascending order; page 2 contains IDs 31..60 in ascending order. PIN: the tiebreak is STABLE across pagination (no random shuffling).

  Cross-pair with REFACTOR-NNN: add EXPLICIT secondary ORDER BY (1-line fix). When the fix lands, tests #1-3 still pass (the explicit ORDER BY ASC matches the current implementation-defined behavior); the test now PINS the explicit guarantee. Cross-pair with DOC-NNN to surface the tie-break behavior on the API Reference page.
