- id: H-001
  hypothesis: "When an operator sets `auth.ldap.groups.admin-groups: ['ops']` and the directory has groups `devops`, `noops`, `appops`, every member of those groups is promoted to ADMIN (substring containment), so a short admin-group token silently over-promotes."
  derivation: "The feature-flow's HIGHEST-severity facet `ldap_admin_groups_substring_match_overpromotion` + the LDAPSecurityConfiguration + ODDLDAPProperties sidecars + the concept-catalog candidate + PLT-081 all assert a case-insensitive SUBSTRING match at `LDAPSecurityConfiguration.java:96` via `OperationUtils.containsIgnoreCase`."
  seed_source: negative-space
