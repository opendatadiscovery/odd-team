notes: |-
  This is a CROSS-LAYER BUG PATTERN (LSN-017 class) — the wire spec
  declares 6 values, the persistence layer accepts 7, the mapper at
  the boundary doesn't know about the divergence. Adjacent in spirit
  to:
    - invariant:run-status-three-vs-six-status-doc-drift-dashboard
      (the DOC says 3, the CODE renders 6 — different angle on the
      same enum; CODE-WIRE-DOC three-way drift)
    - invariant:run-status-palette-type-error-on-out-of-enum-status-blanks-dashboard
      (the UI palette also breaks on out-of-enum status)

  The THREE FAILURE MODES OF DataEntityRunStatus:
    Mode 1 (this invariant) — backend mapper 500 on RUNNING row
      reaching the per-entity runs-history endpoint;
    Mode 2 (run-status-palette-type-error) — UI palette TypeError on
      an out-of-enum status value reaching the dashboard render;
    Mode 3 (run-status-three-vs-six doc drift) — doc names 3 values,
      code renders 6, operator has no source for BROKEN/ABORTED/UNKNOWN.

  Three FAILURES, ONE ENUM. The hardening recommendation (option A
  above) closes Mode 1 + Mode 2 simultaneously and provides the doc
  hook for closing Mode 3.

  ROUTES TO FOLLOW-UP: REFACTOR-NNN — extend the wire enum to match
  the DB enum (add RUNNING), regenerate UI bindings, update the
  palette, update the dashboard.md doc with the full 7-value table.
