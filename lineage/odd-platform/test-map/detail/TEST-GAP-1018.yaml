proposed_action: |-
  Two complementary tests:
  (a) AppInfoMenu.disabledModeLeak.test.tsx — mount AppInfoMenu with a
  DISABLED-mode redux store (no authenticated identity) AND a mocked
  useAppInfo() returning a fixed projectVersion; assert the version
  label is rendered in the menu. RED-on-fix: if a hardening change
  adds auth-gating, the test flips to assert the version is NOT
  rendered to anonymous users.
  (b) AppInfoControllerAnonymousAccessTest — under @ActiveProfiles
  binding auth.type=DISABLED, an unauthenticated GET /api/appInfo
  returns 200 with a non-empty projectVersion. Pins the current
  open-network behaviour at the controller tier; surfaces the
  REFACTOR-185 finding to any future hardening review.
  Both tests serve as documentation-driven regression pins for the
  REFACTOR-185 disclosure pattern.
