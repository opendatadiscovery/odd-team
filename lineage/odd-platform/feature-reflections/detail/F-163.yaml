- id: H-007
  hypothesis: |-
    The masked/plaintext detection is robust: if the backend's token mask format
    ever changes, the UI continues to correctly show Regenerate on masked tokens
    and the reveal warning on fresh plaintext tokens.
  derivation: |-
    A user expects the credential UX to keep working across backend evolution; a
    server-side mask change is a normal maintenance event a senior owner would
    expect the UI to survive.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The detection is a verbatim, replicated string-prefix bet hard-coupled to
      the backend mask format, with NO shared constant, NO helper, and NO
      server-supplied isMasked discriminator on the Token DTO. The literal
      '******' is duplicated between DataSourceItemToken.tsx:26 and
      CollectorItemToken.tsx:26. If TokenMapper.mapValue ships any format change
      (5 or 7 or 8 asterisks, a unicode bullet U+2022, a "last 4 only"
      redaction), substring(0,6) === '******' returns false for a masked value,
      isHidden stays false, and the UI mis-classifies a masked token as
      plaintext — offering Copy on a useless masked string. Conversely, if the
      mask happened to start with six asterisks but be longer, plaintext could be
      mis-read as masked, hiding the one-shot reveal. Both surfaces break
      identically and silently because the contract lives in two string literals,
      not one owner.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken.md
        section: bugs_limitations_corner_cases[1] + stress_findings.tunables
        cite: "DataSourceItemToken.tsx:26 + TokenMapper.java:15-18"
        note: "Fragile string-prefix coupling; mask change silently breaks classification."
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: concepts.invariants
        cite: "CollectorItemToken.tsx:26 (identical substring sniff)"
        note: "Replicated verbatim on the Collector surface; both break together."
    operator_visible_failure: |-
      After a future backend mask-format change (e.g. a "show last 4 only"
      redaction request, or a PII-masking toolbar), BOTH tabs silently break: the
      operator who registers a new data source/collector NEVER sees the one-shot
      reveal warning (isHidden stays at its mis-classified state), so they never
      learn they had a one-time copy window — they get a masked-looking string and
      a Copy button that copies garbage. The failure is invisible at ship time
      (today's format matches) and surfaces only when an unrelated backend change
      lands — a latent cross-surface regression no test guards.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

