name: Dashboard 'Namespace' filter widens via datasource-namespace OR-clause (undisclosed)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The Data Quality Dashboard's `t('Namespace')` filter
  (NamespaceFilter.tsx:29) binds at the SQL layer to BOTH the entity's
  own namespace AND its datasource's namespace via an OR-clause:
  `NAMESPACE.ID.in(namespaceIds).and(NAMESPACE.ID.eq(DATA_ENTITY.NAMESPACE_ID)
  .or(NAMESPACE.ID.eq(DATA_SOURCE.NAMESPACE_ID)))`
  (ReactiveDataQualityRunsRepositoryImpl.java:288-293). NEW invariant,
  batch ZC (2026-05-22).

  An operator filtering by namespace X sees MORE entities than expected:
  every entity whose DATASOURCE is in namespace X is included even if
  the entity itself has no namespace or a different one. Result counts
  in the rings are WIDER than 'entities in namespace X' alone implies.

  The drift is over-inclusion, not mis-binding: `DATA_ENTITY.NAMESPACE_ID`
  IS used (the literal-match interpretation is partially honoured) — the
  widening is the addition of `DATA_SOURCE.NAMESPACE_ID` via OR. The
  dataset/entity has its OWN namespace column AND inherits a namespace
  from its datasource; the dashboard's Namespace filter matches either.

  Severity is lower than the Title-binds-OWNERSHIP_TITLE_ID drift
  (which is a CATEGORY mismatch: "Title=dataset name" expected, "Title=
  ownership role" delivered) — here the operator gets RELATED but
  wider results, not unrelated results. But the dashboard.md doc page
  is SILENT on the widening; an operator counting entities in a namespace
  and comparing the dashboard's number to a separate query will see
  inflation with no doc explanation.

  vocabulary_status: codebase-anchored, doc-side-gap. The live
  https://docs.opendatadiscovery.org/features/data-quality/dashboard
  (WebFetched 2026-05-22 status 200) names 'Namespace' as one of the
  five filter dimensions but does NOT state that the filter also matches
  the datasource's namespace.

  Suggested fix: document the widening on the dashboard.md doc page
  ("Namespace matches both an entity's own namespace AND its datasource's
  namespace"). No code change recommended — the widening is the
  intended behaviour (else the OR-clause would not be there); it just
  needs disclosure.
