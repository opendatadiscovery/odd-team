feature_name: Term linking with permission gate
discovered_from_entry_point: rest:POST /api/dataentities/{id}/terms
description: 'The platform exposes a term-linking endpoint at POST /api/dataentities/{id}/terms.

  The maintainer-documented intent is for DATA_ENTITY_ADD_TERM permission to

  gate this endpoint (per /authorization/permissions doc). The implementation

  registers the permission at the SINGULAR path `/api/dataentities/{id}/term`

  while OpenAPI exposes the PLURAL path `/api/dataentities/{id}/terms`. The

  AuthorizationCustomizer''s path-matcher never matches; the gate never fires.

  '
contributing_nodes:
- odd-platform java DataEntityController controller-method:addDataEntityTerm
- odd-platform java SecurityConstants (the SECURITY_RULES singular path declaration — line 237-242)
- odd-platform java AuthorizationCustomizer (the dispatch chain with .authenticated() fall-through)
- odd-platform java service service:TermServiceImpl
- odd-platform java ReactiveTermRepositoryImpl
- odd-platform java DataEntityDescriptionUnhandledTermRepository
- odd-platform java TermAssignmentActivityHandler
chain:
- hop: 1
  node: odd-platform java DataEntityController controller-method:addDataEntityTerm
  sidecar: '(batch-G enrichment; not re-read this batch)'
  multiplicity_per_trigger: 1
  evidence: |-
    POST /api/dataentities/{id}/terms (PLURAL — openapi.yaml:973). The
    SecurityRule registered at SecurityConstants.java:237-239 binds to /term
    (SINGULAR) — the matcher never fires; the gate never sees the request.
  unresolved: false
- hop: 2
  node: odd-platform java service service:TermServiceImpl
  sidecar: odd-platform__java__service__service__TermServiceImpl.md
  multiplicity_per_trigger: 1
  evidence: |-
    TermServiceImpl.linkTermWithDataEntity (lines 170-179) — `@ReactiveTransactional`
    + `@ActivityLog(TERM_ASSIGNMENT_UPDATED)`. INSERTs `data_entity_to_term` with
    `is_description_link=FALSE`. On PK collision the repo emits empty; the
    service translates via `.switchIfEmpty(BadUserRequestException 'Term already
    assigned to data entity')`. Marks `data_entity_filled.TERMS`. The service
    performs NO permission check; the controller-tier gate is the SOLE
    authorization point and it does not fire (REFACTOR-217). The auto-link
    side-channel `handleDataEntityDescriptionTerms` (lines 201-207) is the
    OTHER entry into `data_entity_to_term`, invoked from
    DataEntityServiceImpl.upsertDescription (line 328) when the description
    body contains `[[ns:term]]` mentions — it bypasses
    `DATA_ENTITY_ADD_TERM` entirely (only `DATA_ENTITY_DESCRIPTION_UPDATE` is
    consulted upstream).
  unresolved: false
  resolved_in_batch: K
- hop: 3
  node: odd-platform java ReactiveTermRepositoryImpl
  sidecar: '(referenced from TermServiceImpl sidecar coupling)'
  multiplicity_per_trigger: 1
  evidence: |-
    ReactiveTermRepositoryImpl.java:162-179 — the cross-namespace lookup
    `getByNameAndNamespace(List)` (no tenant filter). Lines 408-433 —
    `hasDescriptionRelations` (the description-mention guard query). Line 143
    — `.where(TERM.DELETED_AT.isNull())` on every fetch (soft-delete-aware).
  unresolved: false
- hop: 4
  node: odd-platform java TermAssignmentActivityHandler
  sidecar: '(referenced from TermServiceImpl sidecar bugs_limitations_corner_cases[4])'
  multiplicity_per_trigger: 3 (per-link or per-de-link)
  evidence: |-
    TermAssignmentActivityHandler.java:30-43 — the triple-re-query pattern.
    `getContextInfo` calls `getDataEntityTerms` (1st full-list) BEFORE the
    annotated method; the method itself calls `getDataEntityTerms` at line 188
    (2nd full-list — drives `markEntityUnfilled` decision for de-link path);
    the handler's `getUpdatedState` re-queries again (3rd full-list) AFTER.
    For an entity with 100 terms, a single de-link = 3 full-list re-queries +
    1 DELETE. REFACTOR-228 primary-source.
  unresolved: false
  resolved_in_batch: K
