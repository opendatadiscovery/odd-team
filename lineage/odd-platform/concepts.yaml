    canonical_in_docs: false
    canonical_candidate: true
    description: "Repository-wide ADR: no controller carries `@PreAuthorize` / `@Secured` / programmatic permission calls. Authorization is enforced externally via `SecurityConstants.SECURITY_RULES` — a list of `(AuthorizationManagerType, PathPatternParserServerWebExchangeMatcher, PolicyPermissionDto)` triples consumed by `AuthorizationCustomizer`. Trade-off: centralised matrix view vs path-string coupling that breaks silently when paths drift (the `/term` vs `/terms` mismatch documented under DataEntityController is the canonical failure mode)."
