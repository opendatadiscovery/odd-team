behaviour: |-
  **CRITICAL — `POST /api/slack/events` is reachable by ANY internet caller AND no `X-Slack-Signature` / `X-Slack-Request-Timestamp` verification exists in the controller, the parser, or the service. Forged Slack events can be injected by any HTTP caller able to reach the platform's port.**

  Three independent vulnerabilities compound:

  1. **No signature verification in code path**: Grep `X-Slack-Signature|x-slack-signature|SLACK_SIGNING_SECRET|signing-secret` against `/home/raman/work/odd/odd-platform/odd-platform-api/src/main/java/`: 0 hits (verified 2026-05-25). The controller `EventApiController.java:18-57` reads the raw JSON body via `JSONSerDeUtils.deserializeJson` (SlackEventParser.java:23) and acts on its contents without verifying the request actually came from Slack.

  2. **Path is whitelisted in EVERY auth mode**: `/api/slack/events` is in `LoginFormSecurityConfiguration.WHITELIST_PATHS` and `SecurityConstants.WHITELIST_PATHS` (per the sidecar's verified grep). Under LOGIN_FORM/OAUTH2/LDAP, the path bypasses the SecurityWebFilterChain. Under `auth.type=DISABLED`, every path is anonymous anyway.

  3. **No bot/installation-id check**: even if Slack DID send the event, there's no check that `team_id` / `app_id` / `api_app_id` match the configured Slack app — a forged payload with the right shape gets accepted regardless of origin.

  **Exploit shape**: An attacker who learns the platform's base URL (e.g. via the published Slack manifest template at `docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#enable-data-collaboration`) can POST a crafted JSON body:
  ```
  POST /api/slack/events
  {"type":"event_callback","event":{"type":"message","subtype":null,"thread_ts":"<existing-message-provider-id>","channel":"<bot-channel>","text":"forged content","user":"<spoof-user-id>","ts":"<ts>"}}
  ```
  → `SlackEventParser` classifies as PAYLOAD → `DataCollaborationService.enqueueMessageEvent` inserts a row into `message_provider_event` with state=PENDING → the asynchronous `DataCollaborationMessageEventProcessor` materialises a child `message` row attributed to the spoofed user → the UI's Discussions tab shows the forged message thread-attached to a real ODD message.

  **Blast radius**:
  - Inject arbitrary thread-reply messages onto any Data Entity's Discussions thread.
  - Forge author attribution (the `user` field is consumed verbatim per SlackMessageProviderEventHandler.java:31).
  - Inject `message_changed` subtypes to alter visible history.
  - Combined with TEST-GAP-960 (no idempotency), an attacker can flood the platform with millions of forged events.

  **Slack's mandate**: per `https://api.slack.com/authentication/verifying-requests-from-slack` (WebFetched 2026-05-25), production Slack integrations MUST verify the HMAC-SHA256 signature in the `X-Slack-Signature` header against the bot's signing secret, using the timestamp from `X-Slack-Request-Timestamp` to prevent replay (5-minute window). ODD Platform implements none of this.

  **Why CRITICAL**: this is a P-07 Data Collaboration multi-class vulnerability (forged content + author spoofing + UI deception) gated only by feature-flag enablement (`datacollaboration.enabled=true`). The sidecar's `uncovered_behaviours.[4]` notes: 'this is the load-bearing untested behaviour'. There's no live doc warning operators that enabling Discussions means publishing an unauthenticated webhook receiver to the public internet.
