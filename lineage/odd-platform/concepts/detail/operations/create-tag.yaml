name: Create Tag (bulk, fail-on-duplicate)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-08
  - P-09
description: |-
  NEW OPERATION, batch X-TAGGING (2026-05-21) — captures
  `POST /api/tags` at the operation-concept level. Previously the
  operation was only implicit inside the Tag entity; the `createTag`
  controller-method sidecar promotes it to a first-class catalog
  citizen. The `get-popular-tag-list` operation's notes already
  reference "Pairs with create-tag" — this entry fills that referenced
  but previously-unminted slot.

  THE ENDPOINT:
    POST /api/tags -> HTTP 200 (de facto; OpenAPI declares 201).
    Gated by TAG_CREATE permission (Management scope, NO_CONTEXT) via
    SecurityConstants.SECURITY_RULES at SecurityConstants.java:138.

  THE CHAIN:
    TagController.createTag (TagController.java:22-28) — 3-line
    reactive delegation: `tagFormData.collectList()` materialises the
    inbound `Flux<TagFormData>` bulk body, hands the `List<TagFormData>`
    to `tagService.bulkCreate`, wraps the resulting `Flux<Tag>` in
    `ResponseEntity::ok`.
    -> TagServiceImpl.bulkCreate (TagServiceImpl.java:37-42) —
       single-step delegation, NO `@ReactiveTransactional` of its own.
    -> inherited ReactiveAbstractCRUDRepository.bulkCreate
       (:114-126, `@ReactiveTransactional`) — empty-collection
       short-circuit to `Flux.just()`, else stamps
       `DateTimeUtil.generateNow()` and emits a single
       `insertManyReturning` multi-row INSERT with NO `ON CONFLICT`.

  THE OPERATION SHAPE — bulk + fail-on-duplicate:
    The request body is `BulkTagFormData` (a `type: array` of
    `TagFormData`), so a single call creates N tags. The operation
    is FAIL-ON-DUPLICATE, NOT upsert: a `name` already present in the
    non-deleted directory hits the partial unique index
    `tag_name_unique` and translates to
    `UniqueConstraintException("Tag with this name already exists")`
    via ExceptionUtils.java:54-56. This is the deliberate counterpart
    to the upsert-shaped `getOrInjectTagByName` the Collector path
    uses (see the `spec-documented-auto-create-with-scope-asymmetry`
    invariant for the side-door write paths).

  TWO DRIFTS A CAREFUL OPERATOR SHOULD KNOW:
    Drift 1 — status-code: the controller returns HTTP 200 via
    `ResponseEntity::ok` (TagController.java:27); the OpenAPI operation
    declares `201` (openapi.yaml:372). Same drift class as `updateTag`
    and `TermController.createTerm`. See the
    `openapi-200-vs-201-status-code-drift-codebase-wide` candidate.
    Drift 2 — response-shape: the controller returns
    `Mono<ResponseEntity<Flux<Tag>>>` (a nested reactive shape); the
    OpenAPI operation declares `TagList`, a static array
    (openapi.yaml:377). Behaviourally equivalent at the buffered HTTP
    wire but a spec-vs-code shape drift.

  IN-BATCH DUPLICATE ATOMICITY — UNVERIFIED (probe P-026):
    A payload `[{"name":"a"},{"name":"a"}]` hits `tag_name_unique` on
    the second row. Whether the whole `insertManyReturning` INSERT
    rolls back atomically (zero rows) or partially commits (the
    distinct names land) is NOT statically determinable — it depends
    on R2DBC's emission shape + Spring's reactive-TX rollback
    semantics. A partial-commit outcome would be a silent data-shape
    surprise. Pinned by probe P-026 (lineage/odd-platform/probes/P-026.yaml).

