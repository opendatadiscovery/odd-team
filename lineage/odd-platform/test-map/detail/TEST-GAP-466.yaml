gap_id: TEST-GAP-466
category: missing-edge-case
criticality: MEDIUM
node_ids:
  - "odd-platform java service service:HousekeepingJobManager"
pillars_affected: [P-08]
surfaced_by:
  - "HousekeepingJobManager.md:bugs_limitations_corner_cases.[6] (@ConditionalOnProperty no matchIfMissing)"
  - "HousekeepingJobManager.md:tests_coverage_semantic.uncovered_behaviours.[1] (master gate corner)"
  - "HousekeepingJobManager.md:implicit_adrs.[3] (strict opt-in mechanism)"
behaviour: |-
  Master-gate strict-opt-in contract. `@ConditionalOnProperty(value = "housekeeping.enabled", havingValue = "true")` at HousekeepingJobManager.java:18 has NO `matchIfMissing` attribute. The shipped application.yml:166 ships `housekeeping.enabled: true`, so deployments using the bundled config get housekeeping by default. Deployments overriding application.yml WITHOUT re-supplying the key (e.g. `--spring.config.location=/etc/odd/myconfig.yml` omitting the key) get strict-opt-in semantics: bean is NOT registered, housekeeping silently does not run, NO log warning at boot. Docs framing as 'defaults to true' is technically correct but masks the strict-opt-in mechanism. A regression that added `matchIfMissing = true` (changing semantics to default-on regardless) OR that removed `@ConditionalOnProperty` entirely would alter operator deployments without breaking any test.
test_class: missing-edge-case
test_files_existing: []
test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/housekeeping/HousekeepingMasterGateTest.java"
  name: "enabledKeyAbsent_managerBeanNotRegistered_silentNoOp_strictOptIn"
evidence:
  - |-
    HousekeepingJobManager.md says: 'The Java declares strict opt-in (no matchIfMissing). An operator-customised application.yml that omits the key silently disables the subsystem. A Spring-context test asserting that with the key absent the HousekeepingJobManager bean is NOT in the ApplicationContext would document the actual semantic.'
  - "HousekeepingJobManager.java:18 (`@ConditionalOnProperty(value = \"housekeeping.enabled\", havingValue = \"true\")` — no matchIfMissing)"
  - "application.yml:166 ships `housekeeping.enabled: true`"
  - "application-integration-test.yml:7-8 flips to `housekeeping.enabled: false`"
cross_references:
  - "concepts.yaml:entities[housekeeping-ttl-retention]"
  - "DOC-NNN candidate: docs framing 'defaults to true' vs strict-opt-in mechanism"
proposed_action: |-
  Three Spring-context slice tests. (A) Boot with `housekeeping.enabled=true` → assert `ctx.getBean(HousekeepingJobManager.class)` succeeds. (B) Boot with `housekeeping.enabled=false` → assert `ctx.getBean(HousekeepingJobManager.class)` throws NoSuchBeanDefinitionException. (C) Boot WITHOUT the key (absence) → assert NoSuchBeanDefinitionException — this is the strict-opt-in pin. The test surfaces the 'absence = disabled' semantic that the live docs do not name.
