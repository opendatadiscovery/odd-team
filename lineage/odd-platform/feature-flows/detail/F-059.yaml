note: |-
  Graduated 2026-05-26 from SHB-047. The third feature in pillar P-03's
  graduated surface (F-026 RBAC + per-table mutations; F-058 listing UX;
  F-059 rename-cascade lifecycle). The rename is a LIFECYCLE / DATA-CONTRACT
  gap, not an RBAC gap — distinct from F-026 (which is RBAC + cross-table
  jump). The shared audit-silence pattern with F-057 (DQ severity) is
  cross-pillar evidence for the system-mission.md canonicalisation candidate 3
  (audit-log presence asymmetry — 2-tier audit story).

  PRD-shape decision per SHB-047 Next:
  - (a) UI warning + (d) audit emission as the cheap short-term fix;
  - (b) alias-view as the medium-term fix;
  - (c) decouple business-from-physical name as a deferred major-version
    migration. Recorded for maintainer; the feature flow anchors the
    operator-visible expectation regardless of implementation choice.
