behaviour: |-
  **MEDIUM — `GET /api/datasets/{id}/structure*` (all three variants: by-version, latest, diff) return `dataset_field.internal_description` VERBATIM, including user-supplied Markdown / HTML / script payloads. The DatasetField description PUT path (per batch-V DatasetFieldController + batch-R ReactiveDatasetFieldRepositoryImpl.updateDescription sidecars) writes verbatim with no sanitization, no length cap, no allowlist. THIS controller is the canonical READ surface for those payloads.** Primary-source confirmed in batch-W DatasetController sidecar:

  - `DatasetController.getDataSetStructureByVersionId` (lines 23-30) → response `DataSetStructure` includes `List<DataSetField>` where each `DataSetField.internalDescription` is the verbatim string.
  - `DatasetController.getDataSetStructureLatest` (lines 33-41) → same.
  - `DatasetController.getDataSetStructureDiff` (lines 43-50) → response `DataSetVersionDiffList` includes the verbatim before / after snapshots of each column's description.
  - `ReactiveDatasetVersionRepositoryImpl.java:97-144` — NO sanitisation on the returned `internal_description` field; NO length cap; NO allowlist.

  **The cross-tier picture** (F-004 surface aggregated across 3 batches):
  - **WRITE side (batch-V DatasetFieldController PUT)**: operator-supplied Markdown / HTML lands in `dataset_field.internal_description` column verbatim.
  - **AT-REST (batch-R ReactiveDatasetFieldRepositoryImpl.updateDescription)**: column accepts any string; no sanitisation.
  - **READ side (THIS gap — DatasetController)**: the verbatim string returns through the controller to the UI.
  - **UI render defence (probe P-009 — Markdown.tsx)**: the OPERATIVE safeguard — the UI's Markdown render pipeline applies a Markdown allowlist that strips most XSS vectors. PROBE P-009 PASSED for the entity-description render path (batch-Q).
  - **Cross-tab coverage gap**: the DatasetField description render path (the dataset structure view's per-column description) has NOT been verified to use the same Markdown.tsx pipeline. The Discovery UI's Dataset → Structure tab renders the column descriptions inside a different React component subtree.

  **Why MEDIUM not HIGH**:
  - The READ path is verbatim, but the UI defence-in-depth (probe P-009 Markdown.tsx) IS the operative safeguard for the dominant rendering path.
  - The MEDIUM rating reflects: (a) the platform DOES have UI mitigations; (b) the cross-tab coverage of DatasetField render is UNVERIFIED — a separate verification (a fresh probe targeting the Dataset → Structure tab) is needed; (c) any API consumer NOT going through the Markdown.tsx pipeline (e.g., a custom BI tool reading `/api/datasets/{id}/structure`) sees the verbatim payload.
  - The HIGH rating would apply if the UI mitigation were also absent. Currently the UI mitigation is present for the entity-description path; the DatasetField path is unverified.

  **Test gap shape**: regression-pin asserting: (a) seed a `dataset_field.internal_description` with `<script>alert(1)</script>` via the DatasetFieldController PUT path; (b) `GET /api/datasets/{id}/structure` returns the payload verbatim in the response body; (c) `GET /api/datasets/{id}/structure/{version_id}` returns the payload verbatim; (d) `GET /api/datasets/{id}/structure/diff` returns the payload verbatim in both the before and after snapshots. The current state is PINNED — failures land if a future maintainer adds API-tier sanitisation (which would be a defense-in-depth improvement).
