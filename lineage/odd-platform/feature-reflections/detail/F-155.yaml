      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController.md
        section: security
        cite: "QueryExamplesListItem.tsx:45,52 (Markdown render of definition + query) + Markdown.tsx:1-127 (no sanitiser) + V0_0_84__create_query_example.sql:5 (verbatim storage)"
        note: "F-004 stored-XSS family 4th surface, reached via the term tab"
    operator_visible_failure: |
      A user holding QUERY_EXAMPLE_CREATE (granted broadly via the Administrator role per
      V0_0_88__add_query_example_policy.sql) can author a query example with a payload in its definition
