# Catalog Overview Home Page — product-owner reflection

## product_owner_narrative

The Catalog Overview is **the platform's front door** — the SPA home page mounted at the `/` route, the first surface every operator sees after they sign in (and, on `auth.type=DISABLED` deployments, the first surface any anonymous network caller reaches) (per Overview.md understanding + upstream_callers). Its job is to orient a newly-arrived user: "here is what's in this catalog, and here are the ways in." It belongs to the Data Discovery pillar (P-01), whose one-line capability is "find existing data entities in the catalog — by typing a term (Search), walking a structure (Directory), or landing on the home page (Catalog Overview)" (per system-mission.md P-01). The Catalog Overview is the third of those three entry paths, and it threads the other two inline.

A user interacts with it as a **constellation of launchers**. The page composes six surfaces in a fixed vertical sequence (per Overview.md concepts.operations.fixed-sequence, Overview.tsx:44-60): a `MainSearch` box at the top (type a term, jump into Search / F-017); a `TopTagsList` strip of the 30 most-used tags (click a tag, launch a tag-filtered search / F-018); a `Domains` card (catalog-domain inventory, launches a domain-filtered search); a `DataEntitiesUsageInfo` per-class dashboard (click a class cell, launch a class-filtered search — each cell prefills `entityClasses` and, per-type, `types` facets per F-141 chain hop 3b); a mini `Directory` strip (datasource-type cards, cross-link into the full Directory / F-023); and, conditionally, an `OwnerAssociation` panel that — for a signed-in user linked to an Owner — renders the four-column "Recommended" surface (My Objects / Upstream / Downstream / Popular) (per PopularStrip.md understanding). The user provides no inputs to the home page itself beyond arriving; the page reads `appInfo.authType` and the popular-tags list, and every other widget self-loads its own data.

The working parts the operator experiences: a **loading skeleton** that is supposed to represent the page's shape while it loads; six **independent data fetches** that fan out on mount (appInfo, popularTags, domains, entities-usage, datasource-types, and — when the Recommended panel mounts — four My-entities thunks, totalling 9-10 HTTP calls on a cold authenticated mount per Overview.md downstream_side_effects); an **auth-mode gate** that decides whether the OwnerAssociation/Recommended panel appears at all (`isShowOwnerAssociation = Boolean(appInfo?.authType && appInfo.authType !== 'DISABLED')`, Overview.tsx:25-27); and **silent self-hiding** of the Domains and Directory cards when their data is empty (each renders `null` on an empty array, per Overview.md implicit_adrs[1] + Directory.md). There is no route-level permission check and no error boundary at this layer (Overview.md bugs[6]).

The integration story is dense: the Catalog Overview is where **most of the platform's other pillars surface their entry affordance**. TopTagsList renders the Manual Object Tagging taxonomy (F-018); the per-class dashboard and Domains and MainSearch all feed Search Filter Facets (F-017); the mini Directory cross-links the Directory feature (F-023); the Recommended panel's Popular column is the UI closure of the Popular Entities Ranking inflation loop (F-001/F-003) and the OwnerAssociation gate is the entry point of the user-owner-association lifecycle (F-142). The home page is therefore not a leaf feature — it is the **composition root** through which a half-dozen features are first discovered.

In a demo, a product owner would highlight the edge cases candidly: on a **fresh deployment** with no Domains seeded and no datasources registered, the Domains and Directory cards simply vanish — there is no "add your first datasource" call-to-action, so a brand-new admin cannot learn from the home page that those features exist (F-141 facet `domains_directory_widgets_silently_hide_when_empty`). On a **slow network**, the skeleton lifts as soon as the two fast calls (identity + tags) resolve, then the other four widgets pop in asynchronously, shifting the layout (F-141 facet `no_skeleton_alignment`). On an **auth-disabled deployment**, the whole page is anonymously reachable and leaks the tag taxonomy, domain names, per-class counts, and datasource-type inventory to any caller (Overview.md security.known_security_gaps). And the live documentation makes at least two user-facing claims the code does not honour (the Recommended panel's DISABLED-mode visibility, and the Popular-tile click destination — both per Overview.md doc_drift_findings).

