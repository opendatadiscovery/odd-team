notes_for_maintainer: |-
  Probe-needed (local-only docker-compose stack): boot default-config
  platform, `curl localhost:8080/actuator/env`, capture JSON keys to confirm
  the enumeration above. Verify `show-values` defaults to NEVER empirically.

  Follow-up scope candidates:
  - SEC-NNN: add `@ToString.Exclude` on every `password|secret|key|token`
    field across ODDLDAPProperties / ODDOAuth2Properties.OAuth2Provider /
    any other `@Data`-annotated Properties class.
  - SEC-NNN: restrict `management.endpoints.web.exposure.include` to
    `health, prometheus` by default; require opt-in to `env, info`.
  - DOC-NNN: add operator-page admonition: actuator is on main port with
    public whitelisting; configure a separate `management.server.port`
    for production.
  - SEC-NNN: startup self-check scanning every `@Value`-bound credential
    against the actuator masker pattern; fail-fast or warn if a key would
    render unmasked.

  Cluster_with [SHB-173, SHB-174, F-029] per source SHB. F-119 (SHB-173
  graduation just minted in this same triage) carries the AppInfo
  fingerprint surface; F-122 carries the broader actuator schema fingerprint
  surface. The two are complementary.
