proposed_action: |-
  Add `DataSourceIngestionServiceImplFtsAbsenceTest.createDataSources_updatePath_doesNotCallSearchEntrypointRepository_pinsFtsAbsenceContract`. (a) Mockito-style unit test. (b) Mock `reactiveCollectorRepository`, `reactiveDataSourceRepository`, `dataSourceIngestionMapper`, AND `searchEntrypointRepository`. (c) POST a payload that triggers the UPDATE path (an ODDRN that matches an existing DataSourceDto). (d) Invoke `createDataSources`. (e) `verify(searchEntrypointRepository, never()).updateChangedDataSourceVector(anyLong())`. (f) Add a `// REGRESSION-PIN — DataSourceIngestionServiceImpl deliberately does NOT refresh the FTS search-vector on update. The UI path (DataSourceServiceImpl.update) DOES. The asymmetry is intentional but UNSTATED. A REFACTOR adding the refresh call here (e.g. unifying with the UI path) will break this test; a REGRESSION that accidentally adds the call via copy-paste from the UI path will ALSO break this test. Pair with TEST-GAP-682 and TEST-GAP-625 for the full Owner / DataSource FTS-asymmetry picture.` comment block.
