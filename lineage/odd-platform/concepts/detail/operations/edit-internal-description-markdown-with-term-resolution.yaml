name: Edit Internal Description (Markdown with term-resolution)
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
- P-01
- P-06
description: |-
  **NEW CONCEPT, batch 2026-05-19J** — the UI edit operation for entity internal
  descriptions. Initiated by the Edit/Add button (gated by
  `<WithPermissions permissionTo={Permission.DATA_ENTITY_DESCRIPTION_UPDATE}>`)
  which calls `toggleEditMode` from `useTermWiki` — flips editMode state AND
  re-syncs `internalDescription` from the redux-stored `description` (cancel-then-reopen
  reverts in-progress edits with NO confirm prompt). In edit mode, `<Markdown
  editor value={value} onChange={handleMarkdownChange} height={200} />` mounts —
  `onChange` is wired to `handleRealtimeMarkdownChange` which deduplicates against
  the previous value, schedules `handleMarkdownChange` (the term-resolving
  validator), and updates local state. **Term resolution on every keystroke**:
  for each `[[Namespace:TermName]]` match, `handleMarkdownChange` calls
  `useGetTermByNamespaceAndName` ONCE per unique term (cached in `fetchedTerms` /
  `unsuccessfulTerms`); a failed lookup sets `error = 'Term {termName} not found
  in namespace {namespaceName}'`. Save fires via (a) the Save button or (b) the
  **undocumented Shift+Enter shortcut** (`handleSaveMarkdownOnEnter` requires
  `e.key === 'Enter' && e.shiftKey`). Save builds the
  `DataEntityApiUpsertDataEntityInternalDescriptionRequest` from `entityId` +
  `internalDescription` and dispatches `updateDataEntityInternalDescription` →
  `PUT /api/dataentities/{id}/description`. **On success**: `setError('')` +
  `setEditMode(false)`. **On error**: `setError(response.statusText || 'Unable to
  update description')` — edit mode stays open so the user can retry. **Save
  does NOT block on unresolved term mentions** — operators can save broken
  mentions; backend silently drops them.
