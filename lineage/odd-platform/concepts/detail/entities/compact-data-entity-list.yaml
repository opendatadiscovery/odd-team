security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - INTERNAL_ONLY
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      The endpoint that emits CompactDataEntityList
      (`GET /ingestion/entities/{deg_oddrn}`) carries ZERO authorization
      at ZERO layers (per REFACTOR-185 AUTH-MODE-ORTHOGONAL facet —
      unauthenticated in every shipped deployment posture).
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      No owner consult at any layer; cross-owner reachability is the
      default. Per the `read-collaborative-cross-owner-enumeration`
      pattern extended to the S2S surface.
  strengths:
  - |-
    Minimal projection — fewer fields exposed than the UI surface. An
    attacker enumerating the catalog through this endpoint learns
    ODDRNs + types, not names or namespaces; the leakage surface is
    narrower than a comparable UI response.
  weaknesses:
  - |-
    Combined with sequential ODDRN id enumeration (DEG ids are
    monotonically increasing per ODDPlatformDataEntityGroupPath
    generation), the full DEG-to-members graph is enumerable in O(N)
    requests with no rate-limit, no audit-log, no per-IP throttle.
  - |-
    Soft-deleted members surface in the response — deviates from the
    platform's `getDataEntityDefaultConditions` pattern; attackers can
    enumerate intentionally-hidden entities through this endpoint.
  cross_file_inconsistencies: []
  contributing_files:
  - getDataEntitiesByDEGOddrn.md
  evidence:
  - getDataEntitiesByDEGOddrn.md:security.data_exposure
  - getDataEntitiesByDEGOddrn.md:security.known_security_gaps.[0,1,2]
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    Single SELECT against `GROUP_ENTITY_RELATIONS` joined to `DATA_ENTITY`
    filtered by `GROUP_ODDRN.eq(:degOddrn).and(IS_DELETED.isFalse())`. No
    OWNERSHIP join, no recursive CTE, no aggregation. For a DEG with N
    members, the query returns N rows; the controller maps them to N
    CompactDataEntity objects.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One DEG per request — no batch `?deg_oddrns=a,b,c` parameter. The
      `Collection<String>` overload at ReactiveDataEntityRepository.java:60
      exists at the repository layer but is NOT wired to any controller
      endpoint.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      No pagination — a 10K-member DEG returns a 10K-item list in one
      response. Sibling `listDEGItems` paginates; this endpoint does
      not. Operator-clarity gap.
  strengths:
  - |-
    Stateless controller; non-blocking reactive Mono signature; no
    @ReactiveTransactional (read-only path); horizontally scalable.
  - |-
    Per-member projection is small (~200 bytes per CompactDataEntity).
  weaknesses:
  - |-
    No pagination + unbounded payload — pathological DEGs (10K+ members)
    produce large responses; no operator-facing way to chunk the read.
  - |-
    No caching — repeated reads of the same DEG (common during catalog-
    walk integrations) re-query the DB each time.
  - |-
    No batching — enumerating N DEGs costs N HTTP roundtrips.
  cross_file_inconsistencies: []
  contributing_files:
  - getDataEntitiesByDEGOddrn.md
  evidence:
  - getDataEntitiesByDEGOddrn.md:performance.hot_paths
  - getDataEntitiesByDEGOddrn.md:performance.known_performance_gaps.[0,1,2]
notes: |-
  Surfaced batch 2026-05-20Z by the getDataEntitiesByDEGOddrn sidecar.
  CompactDataEntityList is the canonical S2S READ projection — distinct
  from the UI/API DataEntityRef + DataEntityList shapes (which carry
  name + namespace + ownerships).

  The two projections being symmetrically named at the model-package
  level (`ingestion.contract.model.CompactDataEntityList` +
  `ingestion.contract.model.DataEntityList`) is a load-bearing observation
  for future contract evolution — they evolve together via the
  external opendatadiscovery-specification repository.

  Cross-references:
    - F-008 (the symmetric WRITE side — POST /ingestion/entities)
    - F-016 DEG-Anchored Lineage (the architectural sibling read shape)
    - REFACTOR-185 AUTH-MODE-ORTHOGONAL facet (the S2S surface)
