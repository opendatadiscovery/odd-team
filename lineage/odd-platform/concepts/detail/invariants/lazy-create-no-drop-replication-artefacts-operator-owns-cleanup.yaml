name: Lazy-create-no-drop replication artefacts (operator owns cleanup)
canonical_in_docs: false
canonical_candidate: true
description: 'Cross-cutting invariant for Postgres-resident server-side artefacts
  created on-demand at runtime: partitions, replication slots, publications. ODD Platform
  creates them lazily on first use if absent (idempotent `CREATE IF NOT EXISTS` /
  existence-check + conditional create), but NEVER drops them on shutdown / uninstall
  / config-rename. Operator owns cleanup. Triangulated across 2 sidecars in 2026-05-12C:
  (a) `ActivityTablePartitionManager` partitions (batch 2026-05-10B) — `PartitionService.dropPartition`
  + `getEmptyPastPartitions` exist on the service interface but are NEVER invoked
  for the activity table; activity table grows monotonically. (b) `NotificationsProperties`
  replication slot + publication — `NotificationSubscriber.java:99-153` exists-check
  + conditional CREATE; live doc explicitly tells operators ''ODD Platform doesn''t
  clean up replication slot it has created.'' Sibling `MessageTablePartitionManager`
  (DataCollaboration) extends the partition pattern. Failure mode: a rename or uninstall
  without manual cleanup leaks Postgres-resident state (disk growth or orphaned WAL
  retention) silently.'
axes_present:
- config_prefixes
nodes:
