  hypothesis: "When a relationship-class data_entity is somehow associated with more than one relationships row, the detail endpoint returns a single, well-defined relationship (or a clear error), not silent/undefined behaviour."
  derivation: "Negative-space + schema: V0_0_87 declares data_entity_id with FK but no UNIQUE; the detail repository uses mono() expecting exactly one row."
