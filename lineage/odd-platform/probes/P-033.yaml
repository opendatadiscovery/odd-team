realism_caveats: |
  H2 is the sharper claim and depends on the ordering of the delete chain:
  Flux.zip at TagServiceImpl.java:64-65 (which contains deleteTermRelations)
  is composed with .then(...) before the .flatMap that runs the term-side
  vector refresh at :68-69 — so the tag_to_term rows are deleted before the
  refresh observes them. If term_vector_after_delete DROPS to 0 instead of
  staying equal, the refresh somehow still found the terms (e.g. the buildVector
  Upsert deletes-then-inserts and the empty CTE caused a delete of the stale
  rows) — in that case H2 is wrong and the term-side IS cleaned, just by an
  empty-upsert side effect rather than a positive re-index; re-read
  jooqFTSHelper.buildVectorUpsert to classify. The probe assumes to_tsquery
  with the platform's FTS config; if the search uses a non-default text-search
  config the query operator may need the explicit regconfig. The warmup PUT
  assumes 'p033zzqxtag' tokenises as a single lexeme under that config (it is
  an alnum string with no separators, chosen to survive stemming).
