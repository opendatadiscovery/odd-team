notes: |-
  Pinned by P-164 (terms blank page) and P-163 (masterData
  WithPermissionsProvider behaviour confirmation).

  Coherence (Rule 6): No existing concept describes the redirect /
  blank divergence — this is a new pattern observation. The
  redirect convention IS recorded (per dataModelling sidecar's
  implicit_adrs cross-referencing the alerts sidecar) but the
  blank divergence on masterData + terms is novel to batch ZH.

  Maintainer-triage: minimum-viable correction is index routes
  on the terms parent (e.g. Navigate to the most-recent-viewed
  term or redirect to /termsearch). For masterData, add a
  /master-data parent route with Navigate to=lookup-tables.
