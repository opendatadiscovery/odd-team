description: |-
  STRENGTHENED INVARIANT, batch 2026-05-20X — adds the DIRECT MinioConfig sidecar
  primary source on top of the batch V citation (which was through the
  DataEntityAttachmentController class-level sidecar). The retrospective LSN-002's
  named file is now ANCHORED AT THE FILE ITSELF — `MinioConfig` is now a
  first-class config-class sidecar in the catalog.

  THE LSN-002 ORIGINAL FAILURE:

    retrospectives/LSN-002-minio-region-unset.md captured: the MinioAsyncClient
    builder is instantiated with .endpoint(url) + .credentials(accessKey,
    secretKey) but NOT .region(region). The MinIO SDK's default region is
    'us-east-1' (the SDK uses MinIO's default region resolution — independent
    of AWS SDK env-var / config-file chains). Operators running ODD against
    AWS S3 in another region (eu-west-1, us-west-2) see opaque signature/redirect
    errors at runtime (`AuthorizationHeaderMalformed`, `PermanentRedirect`).
    The doc was remediated to mention the us-east-1 pin (verified by batch V
    WebFetch at the live attachment-storage-configuration page; re-confirmed
    batch X WebFetched 2026-05-20 status 200).

  THE PRIMARY-SOURCE EVIDENCE — batch X DIRECT verification at MinioConfig.java:19-25
  (MinioConfig sidecar, batch X — config-class layer):

    The MinioAsyncClient builder construction at lines 19-25:
      MinioAsyncClient.builder()
        .endpoint(url)
        .credentials(accessKey, secretKey)
        .build();
    The chain has EXACTLY THREE method calls (`.endpoint`, `.credentials`,
    `.build`). The `.region(...)` call is ABSENT. The `.httpClient(...)`
    call is ABSENT. The `.credentialsProvider(...)` call is ABSENT (the
    two-arg `.credentials(accessKey, secretKey)` constructs a `StaticProvider`
    implicitly — IAM-role / IRSA / DefaultCredentialsProvider unsupported).

    The Gate-5 unset-parameter audit on this builder (per the MinioConfig
    sidecar's unset_parameter_audit table) classifies:
      - `.endpoint(String)` — `configured` from attachment.remote.url
      - `.credentials(String accessKey, String secretKey)` — `configured`
      - `.region(String)` — `caveat-defaulted`, doc-mitigated, code-unmitigated
        (LSN-002 canonical anchor; REFACTOR-027)
      - `.httpClient(OkHttpClient)` — `caveat-defaulted`, neither doc nor
        code mitigated (REFACTOR-034)
      - `.credentialsProvider(Provider)` — `caveat-defaulted`, neither doc
        nor code mitigated (operator-flexibility gap; ADR-CANDIDATE-013 stance)

    Three silent-default findings strengthen the LSN-002 lineage:
      1. .region(...) — the LSN-002 canonical; code-unmitigated
      2. .httpClient(...) — the no-knob HTTP timeout/pool gap
      3. .credentialsProvider(...) — the no-IAM-role gap

  THE OPERATIONAL FAILURE MODE — captured from the original retrospective:

    1. Operator configures attachment.storage=REMOTE with credentials for
       an S3 bucket in eu-west-1.
    2. Application boots — bean wiring succeeds (no region check at startup;
       no boot-time S3 head-bucket check per the asymmetric-validation finding
       below).
    3. First file upload triggers MinioAsyncClient.putObject(...) with the
       SDK default region (us-east-1) baked into the request signature.
    4. AWS S3 returns 400 / 301 redirect with a 'PermanentRedirect' or
       'AuthorizationHeaderMalformed' error referencing the bucket's
       actual region.
    5. The application's error surface shows an opaque MinIO SDK exception;
       operators investigate auth credentials, network access, IAM policies
       — never the region.

  THE BATCH X ASYMMETRIC-VALIDATION FINDING (PRIMARY SOURCE — MinioConfig sidecar):

    RemoteFileUploadServiceImpl.java:45-50 has a `@PostConstruct validate()`
    that fail-fasts on empty `bucket`. NO equivalent guard exists on `region`,
    `url`, or `credentials` at the MinioConfig level. The validation pattern
    WAS established for one parameter; extending it to region (the LSN-002
    surface) is the natural next step. The asymmetry is itself the finding:
    BUCKET is required-and-validated, REGION is silently-defaulted, URL is
    required-but-not-validated-as-reachable, CREDENTIALS are required-but-
    not-validated-against-the-endpoint.

  THE BATCH X CHUNK-STAGING CROSS-LINK (PRIMARY SOURCE — MinioConfig sidecar):

    Even when an operator follows the LSN-001-remediated doc and switches to
    `attachment.storage=REMOTE`, FileUtils.java:24 declares
    `CHUNK_BASE_PATH = "/tmp/odd/chunks"` as a static-final constant that
    applies to BOTH LOCAL and REMOTE modes. REMOTE persistence covers
    completed uploads but NOT in-flight chunks. The cross-link is informational —
    NOT a MinioConfig direct gap, but the natural place an operator following
    LSN-001 remediation lands. Cross-references:
    `chunk-base-path-hardcoded-tmp-storage-mode-independent-lsn-001-in-code-residue`
    invariant.

  THE PATTERN ALIGNMENT with LSN-002-class:

    Same shape as the lsn-002-class-primitive-default-ships-disabled-but-broken-when-enabled
    invariant: a typed config field (here: region — explicit method call
    on the builder) with no maintainer-set value ships an SDK-default that
    is legal at boot but broken at first use. The disciplined counter-example
    is DataCollaborationConfiguration's explicit fail-fast on empty
    slack-oauth-token (throws IllegalArgumentException at boot). The batch X
    MinioConfig sidecar confirms the asymmetric-validation pattern: the
    bucket-empty fail-fast at RemoteFileUploadServiceImpl is the disciplined
    example WITHIN THIS SAME FEATURE — extending the discipline to region
    is the natural one-line fix.

  THE GAP-WIDENING OBSERVATION (batch X confirmation):

    Batch V's primary-source examination was indirect (via DataEntityAttachmentController).
    Batch X's primary-source examination is DIRECT — MinioConfig is now a
    first-class config-class sidecar. The LSN-002 case-law is no longer
    documentation-side-only; it has a DIRECT in-code anchor at MinioConfig.
    A maintainer auditing the LSN-002 lineage can now cite the MinioConfig
    sidecar's `unset_parameter_audit` Gate-5 table directly (rather than
    triangulating through the attachment controller's bugs-corner-cases).

  SEVERITY: MEDIUM — documented externally in the live config doc (the
  doc-side remediation is healthy); latent in-code with no fail-fast (the
  code-side remediation is unimplemented). The retrospective's lesson — Gate
  3 + Gate 4 + Gate 5 (unset-parameter audit for SDK integrations) — fires
  exactly here: every SDK builder parameter must be classified as
  configured | safely-defaulted | caveat-defaulted. The region IS
  caveat-defaulted but the caveat lives only in docs, not in code.
