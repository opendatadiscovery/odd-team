- id: H-011
  hypothesis: "When a fresh ODD deployment with no user traffic loads the home page, the Popular column communicates that there is not yet popularity data (rather than presenting newest-ingested entities as if they were genuinely popular)."
  derivation: "Negative-space empty/bootstrap state — view_count defaults to 0 for all rows, so the ranking degenerates."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      On a fresh deployment every row has view_count=0 (Liquibase V0_0_10 DEFAULT 0; V0_0_37 backfill).
      With all view_counts equal, the id-DESC tiebreaker (lines 945-967) takes over and the Popular
      column shows the most-recently-ingested entities first — presented identically to a genuine
      popularity ranking, with NO empty-state and NO 'no popularity data yet' affordance. The UI empty
      placeholder ('No information to display') only shows when the list is truly empty (zero eligible
      rows), not when view_counts are uniformly zero. So the hypothesis as stated (the UI communicates
      the bootstrap state) is FALSE for the magnitude but the CONFIRMED finding is: the chain produces
      newest-first under zero traffic with no signal that this is a degenerate ranking. (Confirmed = the
      bootstrap behaviour is exactly as the chain dictates; the user-facing gap is the absence of any
      degeneracy signal, which is a documentation caveat.)
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: bugs_limitations_corner_cases[6]
        cite: "ReactiveDataEntityRepositoryImpl.java:945-967 + V0_0_10__add_counters.sql:1-2"
        note: "view_count=0 everywhere -> id DESC tiebreaker -> newest-first, no degeneracy signal."
      - sidecar: odd-platform__ts__react-component__component__PopularStrip.md
        section: bugs_limitations_corner_cases
        cite: "DataEntityList.tsx:65-67 + EmptyContentPlaceholder.tsx:46"
        note: "Generic 'No information to display' only on a truly empty list; no 'no traffic yet' state."
    operator_visible_failure: |
      A new operator demoing ODD sees 'Popular' showing recently-ingested entities and may conclude the
      ranking is working when it is degenerate (no traffic). Undocumented bootstrap behaviour. This is a
      caveat to document, not a code defect.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-012
  hypothesis: "When a third-party API consumer calls GET /api/dataentities/popular without authenticating (on a LOGIN_FORM / OAUTH2 / LDAP deployment), the platform rejects the call with 401."
  derivation: "endpoint-shape + cross-pillar P-09 — a catalog endpoint on an auth-enabled deployment should require authentication."
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |
      On the three authenticated modes the endpoint requires authentication — it has no entry in
      SecurityConstants.SECURITY_RULES and falls through to pathMatchers('/**').authenticated()
      (AuthorizationCustomizer.java:29-30), so an unauthenticated caller gets 401. BUT under
      auth.type=DISABLED (the shipped default), DisabledAuthSecurityConfiguration permitAll() makes the
      endpoint anonymously reachable — any caller able to reach the HTTP port reads the full Popular
      ranking (names, oddrns, statuses, alert flags, staleness). The hypothesis holds for 3 of 4 modes
      and fails for the default mode.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: security.auth_mode_relevance
        cite: "AuthorizationCustomizer.java:29-30 + DisabledAuthSecurityConfiguration.java:14-17"
        note: "Auth-required fall-through on 3 modes; anonymous under DISABLED default."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: security.authorization_assertions
        cite: "SecurityConstants.java:90-355"
        note: "No SECURITY_RULES entry for GET /api/dataentities/popular."
    operator_visible_failure: |
      On the shipped DISABLED default, the home-page recommendation surface (and its alert/staleness
      disclosure) is anonymously readable over the HTTP port — the LSN-001-shape default-deployment
      exposure. This is the documented read-collaborative posture under DISABLED, part of the
      8-sidecar DISABLED-bypass family (REFACTOR-073). It is a posture to document for this surface,
      with the auth-enabled behaviour being correct.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

