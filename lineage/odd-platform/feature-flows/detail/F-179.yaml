control_summary: |-
  0 of 4 cells PROBED — feature minted at ui-review-2026-05-26 to anchor
  a recurring UI defect class observable at primary source on THREE
  sibling Overview sidebar panels (Tags / Terms / Groups). All three
  panels share the slice-then-sort bug; Groups additionally has a
  no-comparator sort call that does effectively nothing.

  The fix is one-line per call-site (sort then slice). The
  operator-visible consequence is real and material — important tags
  invisible below the visible cut violates the Tags panel's apparent
  promise. Cross-link F-018's existing facet taxonomy (Manual Object
  Tagging) — F-018 owns the TAG DIRECTORY side; F-179 owns the PER-
  ENTITY READ side of the same data via the Overview sidebar.

