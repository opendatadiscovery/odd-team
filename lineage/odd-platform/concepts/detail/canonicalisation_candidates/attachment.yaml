proposed_canonical: Attachment
rationale: 'First-class platform feature with its own live doc page (`features/data-discovery/attachments`),
  per-entity REST surface, RBAC permission (DATA_ENTITY_ATTACHMENT_MANAGE), config-prefix
  (`attachment.*`), and two retrospectives (LSN-001 LOCAL-ephemeral, LSN-002 us-east-1
  pin). Four sidecars (controller + service-layer config-consumer + config-prefix
  + uploadFileChunk method) consistently use ''attachment'' as the noun. main-concepts.md
  does not register it as either a canonical term or alias — recommend extension.
  Method-level uploadFileChunk sidecar adds new doc-gap findings: chunked-upload wire
  protocol undocumented, max-file-size cap unenforced, cross-entity hijack vulnerability.'
contributing_concepts:
- DataEntityAttachments / DataEntityFile / DataEntityLink (controller)
- DataEntityUploadOptions (service)
- attachment storage backend / S3-compatible bucket / local filesystem path / attachment
  upload session / attachment file size cap (config-prefix)
- uploadId / index / Part / chunk staging path (uploadFileChunk)
suggested_add_to_docs: true
