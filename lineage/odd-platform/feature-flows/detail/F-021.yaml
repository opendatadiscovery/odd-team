cross_pillar_relationships:
- pillar: P-01
  kind: feeds
  via: |-
    The Activity Feed surfaces lifecycle events on Data Entities to the
    Data Discovery pillar — every DATA_ENTITY_CREATED / DESCRIPTION_UPDATED
    / BUSINESS_NAME_UPDATED / etc activity row is visible on the entity
    detail page's Activity tab AND on the global Activity Feed page.
    The READ DEFAULT is cross-owner (every authenticated user sees every
    data entity's activity); only MY_OBJECTS is owner-scoped, and that
    along OWNERSHIP not USER_OWNER_MAPPING.
- pillar: P-07
  kind: siblings
  via: |-
    Sibling sub-feature within the Active Platform Features pillar —
    distinct from F-007 (AlertManager Integration) which is the ingress
    surface for alert payloads, F-009 (WAL-driven Notification Delivery)
    which is the outbound communication surface, and F-014 (Per-Entity
    Alert View) which is the alert-history read surface. Activity Feed
    is the change-history read surface; alert-events surface here via
    AlertServiceImpl batch write path with `is_system_event=true`.
- pillar: P-08
  kind: feeds
  via: |-
    Operationally coupled to Housekeeping (F-010) — the
    ActivityEmptyPartitionsHousekeepingJob (the FOURTH job in F-010's
    enumerated set) drops EMPTY past partitions of the activity table.
    Non-empty partitions never drop; the activity table grows
    monotonically. F-010 batch-R confirms this at SQL primary source.
- pillar: P-09
  kind: shares_data_with
  via: |-
    Activity Feed is the audit-trail consumer of Principal-to-Owner
    Resolution (F-011) — every read path LEFT JOINs USER_OWNER_MAPPING
    by OIDC_USERNAME without provider qualifier. F-011 batch-R adds the
    activity-side primary source for the cross-mode bleed pattern.
    Audit-silence on RBAC mutations (F-006 family) is rooted in this
    feature's schema (activity.data_entity_id NOT NULL FK).
