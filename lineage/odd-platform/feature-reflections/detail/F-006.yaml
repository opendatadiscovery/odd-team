          policy from the screen — the editor offers codes with no explanation, so
          the operator either over-grants (picks ALL to be safe — defeating
          least-privilege) or under-grants (and files a ticket when a user can't do
          their job).
      (b) Correctness failure compounding the usability one: even the operator who
          does the homework (reads the code) is misled — DATASET_FIELD_ADD_TERM
          holders cannot link field-level terms (the gate is wired to
          DATA_ENTITY_ADD_TERM) and any DATASET_FIELD_ADD_TERM holder can resolve
