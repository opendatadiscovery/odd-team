mitigations_unimplemented:
- |-
  Code-side (immediate): change `tagService.getOrCreateTagsByName(...)`
  call to `tagService.getTagsByName(...)` (lookup-only, no auto-create)
  on the stats-ingestion path. Tags absent from the catalog are silently
  dropped from the per-field stat's tag list. Surface affected count in
  the response body. Closes the side-channel; requires UI flow to create
  the tag explicitly via the Tags tab first.
- |-
  Code-side (composition): scope this fix to the AUTH-MODE-ORTHOGONAL
  facet — once the endpoint is brought under auth (via filter broadening,
  whitelist removal, or per-endpoint filter), the side-channel concern
  reduces to 'authenticated user creates tag without TAG_CREATE
  permission via stats path' which is fixable via a programmatic
  `permissionService.hasPermission(TAG_CREATE)` check at the create
  branch.
- |-
  Doc-side: extend the Data Quality page's reference to
  POST /ingestion/entities/datasets/stats with explicit naming of the
  tag-as-side-effect contract: 'Tags submitted in DataSetFieldStat.tags
  populate the catalog's tag taxonomy with EXTERNAL_STATISTICS origin —
  no TAG_CREATE permission is checked'. Operators relying on TAG_CREATE
  for tag-creation control must be aware of this side channel.
severity: MEDIUM
