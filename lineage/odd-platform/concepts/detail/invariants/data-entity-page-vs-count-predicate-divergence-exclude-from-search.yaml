name: ReactiveDataEntityRepository page-vs-count predicate divergence on EXCLUDE_FROM_SEARCH (Directory level-4)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
- P-08
description: |-
  **NEW MEDIUM-severity INVARIANT, batch 2026-05-20T (DirectoryController class
  sidecar)** — STRUCTURALLY ANALOGOUS to REFACTOR-425 (ReactiveDataSourceRepositoryImpl.listDto
  page-vs-count divergence) but at a DISTINCT site. The Directory level-4 endpoint
  GET /api/directory/datasources/{data_source_id} delegates to
  DataEntityServiceImpl.getDataEntitiesByDatasourceAndType (DataEntityServiceImpl.java:164-179)
  which composes the page query via reactiveDataEntityRepository.listByDatasourceAndType
  (line 170) with the count query via reactiveDataEntityRepository.countByDatasourceAndType
  (line 173). The two queries use DIFFERENT predicate sets:

    PAGE path (ReactiveDataEntityRepositoryImpl.java:595-613):
      - `cteConditions` includes only `DATA_SOURCE_ID = ?` (+ optional `TYPE_ID = ?`)
      - `baseDimensionsSelect → cteDataEntitySelect` (lines 909-939) adds
        `addSoftDeleteFilter(...)` (deleted_at IS NULL, STATUS != DELETED — derived
        from getDeleteChangedFields override at lines 110-116 + addSoftDeleteFilter
        override at lines 118-122) PLUS `DATA_ENTITY.HOLLOW.isFalse()` (line 918).
      - **Missing**: `DATA_ENTITY.EXCLUDE_FROM_SEARCH.isNull() OR .isFalse()`
        (the third filter from `getDataEntityDefaultConditions` at lines 970-976).

    COUNT path (ReactiveDataEntityRepositoryImpl.java:616-627):
      - `getDataEntityDefaultConditions()` returns THREE conditions:
        HOLLOW.isFalse() + STATUS != DELETED.getId() + EXCLUDE_FROM_SEARCH IS NULL
        or = FALSE. The page path applies the first two but NOT the third.

  **Operator surface manifestation**: any DataEntity with `EXCLUDE_FROM_SEARCH = TRUE`
  (a flag the platform sets on certain entities — e.g. transformer runs that should
  not appear in search results) will be RETURNED by the page query but NOT COUNTED
  by the count query. UI renders 'X of Y entities' where X > Y is possible, AND a
  `page=2` request can return rows that 'shouldn't exist' according to the count.
  The bug is INVISIBLE for catalogs whose per-datasource entities are all
  EXCLUDE_FROM_SEARCH = FALSE (the common case); manifests in deployments using
  EXCLUDE_FROM_SEARCH to hide intermediate entities (runs, transient inputs, hollow
  placeholders).

  **Cross-cutting bug class**: PREDICATE-DIVERGENCE-IN-PAGINATION-WRAPPERS, same
  root pattern as REFACTOR-425 (which targets ReactiveDataSourceRepositoryImpl.listDto's
  page-vs-count). The bug class is now confirmed at TWO sites; an audit sweep
  across all repository `list*/count*` pairs in the codebase is the defensible
  follow-up. Candidates to audit per the DirectoryController sidecar:
  ReactiveCollectorRepositoryImpl (clean per batch R), ReactiveTermRepositoryImpl,
  ReactiveTagRepositoryImpl, ReactiveOwnerRepositoryImpl, ReactiveRoleRepositoryImpl,
  ReactivePolicyRepositoryImpl, ReactiveNamespaceRepositoryImpl.

  **The fix is small** — align the predicate sets. Recommended: update
  cteDataEntitySelect (or listByDatasourceAndType specifically) to apply
  EXCLUDE_FROM_SEARCH filter, matching getDataEntityDefaultConditions. Alternative:
  drop EXCLUDE_FROM_SEARCH from the count predicate (matches existing page behaviour
  but changes the count semantics — riskier; breaks the implicit contract that the
  count is a 'search-eligible entity count').

  Severity: MEDIUM (correctness AND UX — pagination math breaks visibly in deployments
  using EXCLUDE_FROM_SEARCH; invisible otherwise).
