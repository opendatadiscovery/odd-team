      the parameter filters the tag directory by tag.id, so the response is
      empty — or, when an id value collides with a real tag id, a nonsensical
      wrong tag. The misunderstanding is masked when an id is BOTH a valid
      data-entity id AND a valid tag id.
    observed: |-
      `getPopularTagList` references the SHARED `IdsParam` component
      (`openapi.yaml:351` -> `components.yaml:4239-4248`), whose `description`
      reads `Entity ids`. `TagController.getPopularTagList` binds it as
      `List<Long> ids` and passes it to `tagService.listMostPopular(query,
      ids, page, size)`; `ReactiveTagRepositoryImpl.listMostPopular`
      (`:141-142`) adds `TAG.ID.in(ids)` — a TAG-id filter. The `IdsParam`
      component IS shared and IS accurate for its OTHER consumer
      (`openapi.yaml:139`, a data-entity-scoped operation) — so the defect
      is operation-LOCAL: a tag-scoped operation reuses an entity-scoped
      parameter component without an operation-level description override.
    expected: |-
      Either (a) declare a dedicated `TagIdsParam` component (description
      'Tag ids') for getPopularTagList, OR (b) add an operation-level
      parameter description override.
    drift_class: ids_param_entity_ids_description_filters_by_tag_id_lsn020_class_input_name_drift
    evidence:
    - 'openapi.yaml:351 — getPopularTagList references IdsParam'
    - 'components.yaml:4239-4248 — IdsParam description: Entity ids'
    - 'openapi.yaml:139 — the OTHER (data-entity-scoped) consumer for which Entity ids IS accurate'
    - 'ReactiveTagRepositoryImpl.java:141-142 — TAG.ID.in(ids) — the implementation binds it as a tag-id filter'
    cross_references:
      probes:
      - P-031
    provenance: |-
      STATIC+PROBE-NEEDED — primary-source X-TAGGING `tag` openapi sidecar
      bugs_limitations_corner_cases "IdsParam describes the ids query parameter
      as Entity ids but getPopularTagList filters by TAG id (LSN-020 class)"
      + getPopularTagList sidecar `ids` request-input. Severity: MEDIUM.
      Probe P-031 pins the SQL-bind column + the collision case.
  - facet_id: F-018-DRIFT-XTAGGING-updateTag-response-omits-external-usedcount
    facet: |-
      updateTag's response Tag omits `external` and `usedCount` — the terminal
      `.map(tagMapper::mapToTag)` uses the bare-TagPojo overload; the available
      mapToTag(TagDto) overload that populates them is not used
    category: response-shape-drift
    severity: MEDIUM
    headline: |-
      PUT /api/tags/{id} returns a Tag with external/usedCount null; the
      sibling getPopularTagList returns Tag items WITH those fields populated.
    operator_visible_consequence: |-
      A UI (or API consumer) that re-renders a tag chip from the updateTag
      response loses the usage count and the external flag — both come back
      null. The OpenAPI Tag schema declares both fields, so a spec-conformant
      consumer expects them. updateTag exposes LESS than the schema declares.
    observed: |-
      `TagServiceImpl.update` ends with `.map(tagMapper::mapToTag)` applied to
      a bare `TagPojo` (`TagServiceImpl.java:54`); the `mapToTag(TagPojo)`
      overload (`TagMapper.java:26`) maps only `id, name, important` because
      `TagPojo` has no `usedCount` / `external` field. The `mapToTag(TagDto)`
      overload (`TagMapper.java:23-24`) WOULD populate them and is used by
      `listMostPopular` — it is available but not used by `update`.
    expected: |-
      Either (a) re-read the TagDto after the update and map via
      mapToTag(TagDto) so the response is complete, OR (b) document that
      updateTag's response omits external/usedCount.
    drift_class: update_tag_response_tag_omits_external_and_usedcount_maptotag_pojo_overload
    evidence:
    - 'TagServiceImpl.java:54 — .map(tagMapper::mapToTag) on a bare TagPojo'
    - 'TagMapper.java:26 — mapToTag(TagPojo) maps only id/name/important'
    - 'TagMapper.java:23-24 — mapToTag(TagDto) overload (available, unused by update) populates external/usedCount'
    provenance: |-
      STATIC — primary-source X-TAGGING updateTag sidecar
      bugs_limitations_corner_cases "updateTag's response Tag omits external
      and usedCount". Severity: MEDIUM.
  - facet_id: F-018-DRIFT-XTAGGING-update-dataset-field-tags-unset-origin-insert
    facet: |-
      updateDatasetFieldTags' relation INSERT builds TagToDatasetFieldPojo
      with `origin` UNSET and relies on the DB column default 'INTERNAL' — if
      jOOQ emits an explicit NULL the INSERT violates NOT NULL and the endpoint
      is broken for any non-empty tags payload (CRITICAL untested path)
    category: fragile-db-default-reliance
    severity: HIGH
    headline: |-
      The dataset-field tag-relation INSERT never sets origin in code; whether
      the endpoint works at all depends on jOOQ omitting the unset column so
      the DB default applies — statically uncertain, untested (P-030).
    operator_visible_consequence: |-
      If jOOQ's newRecord-from-pojo emits an explicit NULL for the unset
      `origin`, every non-empty PUT /api/datasetfields/{id}/tags fails the
      `origin varchar NOT NULL` constraint — the endpoint is dead for any
      real payload. If the persisted `origin` ends up something other than
      'INTERNAL', the next call's `deleteDatasetFieldInternalRelations` filter
      (`WHERE origin = 'INTERNAL'`) misses those rows and the field accumulates
      orphan internal relations.
    observed: |-
      `DatasetFieldServiceImpl.getUpdatedRelations` (`:264-271`) builds
      `TagToDatasetFieldPojo` with only `tagId` + `datasetFieldId`, never
      `.setOrigin(...)`. `createDatasetFieldRelations` maps each pojo via
      `jooqReactiveOperations.newRecord(TAG_TO_DATASET_FIELD, p)` then INSERTs
      (`ReactiveTagRepositoryImpl.java:355-368`). The column is
      `origin varchar NOT NULL DEFAULT 'INTERNAL'` (`V0_0_82__add_tag_to_dataset_field
      .sql:12`). The data-entity sibling path side-steps this entirely by
      explicitly calling `.setExternal(false)` on its relation pojo
      (`TagServiceImpl.java:109`); the dataset-field path relies on the DB
      default. Whether jOOQ omits the unset column (default applies — correct)
      or emits an explicit NULL (constraint violation — endpoint dead) is not
      statically determinable.
    expected: |-
      Explicitly call `.setOrigin(TagOrigin.INTERNAL.toString())` on the
      TagToDatasetFieldPojo (mirror the data-entity path's explicit
      `.setExternal(false)`), removing the reliance on jOOQ null-field
      handling.
    drift_class: update_dataset_field_tags_relation_insert_relies_on_unset_origin_pojo_plus_db_column_default
    evidence:
    - 'DatasetFieldServiceImpl.java:264-271 — getUpdatedRelations builds TagToDatasetFieldPojo with no .setOrigin'
    - 'ReactiveTagRepositoryImpl.java:355-368 — createDatasetFieldRelations newRecord-from-pojo INSERT'
    - 'V0_0_82__add_tag_to_dataset_field.sql:12 — origin varchar NOT NULL DEFAULT INTERNAL'
    - 'TagServiceImpl.java:106-109 — the data-entity sibling DOES set its discriminator explicitly (.setExternal(false))'
    cross_references:
      probes:
      - P-030
    provenance: |-
      STATIC — primary-source X-TAGGING updateDatasetFieldTags sidecar
      bugs_limitations_corner_cases "Relation INSERT relies on an UNSET pojo
      field plus a DB column default" + tests_coverage_semantic CRITICAL
      uncovered behaviour. Severity: HIGH. Probe P-030 pins the relation-INSERT
      question.
  - facet_id: F-018-DRIFT-XTAGGING-dataset-field-tags-delete-all-recreate-churn
    facet: |-
      updateDatasetFieldTags discards and rebuilds ALL internal tag relations
      on every call (delete-all-then-recreate), even for a no-op save — unlike
      the data-entity path which computes a current-minus-updated diff
    category: relation-churn
    severity: LOW
    headline: |-
      The dataset-field tag-relation save is delete-all-then-recreate, not a
      diff; a re-submit of the identical set still issues a full DELETE +
      full INSERT.
    operator_visible_consequence: |-
      A no-op 'save' (re-submitting the same dataset-field tags) issues a full
      DELETE + full INSERT of the INTERNAL relation rows; PK churn and any
      DELETE/INSERT triggers fire needlessly. Under concurrency two
      simultaneous saves of the same field interleave delete/insert pairs and
      the loser's INSERT can land before the winner's DELETE.
    observed: |-
      `DatasetFieldServiceImpl.updateDatasetFieldTags` (`:124-126`) calls
      `deleteDatasetFieldInternalRelations(datasetFieldId)` — an unconditional
      `DELETE ... WHERE origin = 'INTERNAL'` (`ReactiveTagRepositoryImpl.java
      :289-295`) — then re-inserts the full submitted set. The data-entity
      sibling `updateRelationsWithDataEntity` (`TagServiceImpl.java:113-120`)
      computes `current \ updated` and deletes only the genuinely-removed
      subset. The dataset-field path discards and rebuilds; the data-entity
      path diffs.
    expected: |-
      Adopt the data-entity path's diff approach for the dataset-field path
      (delete only the removed subset, insert only the added subset).
    drift_class: update_dataset_field_tags_delete_all_then_recreate_churns_internal_relation_rows_no_diff
    evidence:
    - 'DatasetFieldServiceImpl.java:124-126 — delete then create, no diff'
    - 'ReactiveTagRepositoryImpl.java:289-295 — unconditional DELETE WHERE origin = INTERNAL'
    - 'TagServiceImpl.java:113-120 — the contrasting data-entity diff path'
    provenance: |-
      STATIC — primary-source X-TAGGING updateDatasetFieldTags sidecar
      invariants "Delete-all-then-recreate, NOT a diff" +
      bugs_limitations_corner_cases "Delete-then-recreate churns relation
      rows on every call". Severity: LOW.
  - facet_id: F-018-DRIFT-XTAGGING-three-way-activity-audit-asymmetry
    facet: |-
      three-way activity-audit asymmetry across the tag-relation-write trio:
      the data-entity path audits with the dataEntityId param only, the
      dataset-field path audits with FULL before/after tag state, the term
      path does NOT audit at all
    category: cross-channel-audit-asymmetry
    severity: MEDIUM
    headline: |-
      DATA_ENTITY_TAGS_UPDATED (param-only) vs DATASET_FIELD_TAGS_UPDATED
      (full before/after state) vs term-tag-change (no @ActivityLog) — three
      tag-relation-write endpoints, three different audit stories.
    operator_visible_consequence: |-
      An operator auditing 'who changed the tags on term X?' via the Activity
      Feed finds NO record — the term-tag path emits no @ActivityLog (even
      though sibling term mutations linkTermWithDataEntity / removeTermFromDataEntity
      DO). The data-entity tag path records the change but only the parent
      dataEntityId — the diff must be reconstructed. Only the dataset-field
      path gives a complete, self-contained audit (full before/after tag
      list). The directory-CRUD operations (createTag / updateTag / deleteTag)
      also emit no @ActivityLog — a tag rename or delete is untraceable.
    observed: |-
      `DatasetFieldServiceImpl.updateDatasetFieldTags` carries
      `@ActivityLog(event = DATASET_FIELD_TAGS_UPDATED)` (`:119`) +
      `@ActivityParameter` on the datasetFieldId; `DatasetFieldInformationUpdatedActivityHandler
      .getState` serialises the field's COMPLETE tag list (id + name per tag)
      into both oldState and newState (`:53-67`). `DataEntityServiceImpl
      .upsertTags` carries `@ActivityLog(TAG_ASSIGNMENT_UPDATED)` (`:358`)
      capturing only the dataEntityId parameter. `TermController
      .createTermTagsRelations` / `TermServiceImpl.upsertTags` carry NO
      @ActivityLog at all — asymmetric within TermServiceImpl itself (its
      `linkTermWithDataEntity` `:169` / `removeTermFromDataEntity` `:183`
      DO emit TERM_ASSIGNMENT_UPDATED). The directory-CRUD methods
      (createTag / updateTag / deleteTag) emit no @ActivityLog.
    expected: |-
      Either (a) make the three relation-write paths symmetric — emit a
      tag-assignment activity event with full before/after state on all three
      (the dataset-field path is the model), OR (b) document the audit-scope
      asymmetry explicitly (which surfaces are audited, which are not).
    drift_class: term_tags_update_third_relation_write_path_no_activity_log_no_external_carve_out
    evidence:
    - 'DatasetFieldServiceImpl.java:119 — @ActivityLog(DATASET_FIELD_TAGS_UPDATED)'
    - 'DatasetFieldInformationUpdatedActivityHandler.java:53-67 — serialises full before/after tag list'
    - 'DataEntityServiceImpl.java:358 — @ActivityLog(TAG_ASSIGNMENT_UPDATED) captures only dataEntityId'
    - 'TermController.java:129-136 + TermServiceImpl.java:252-264 — NO @ActivityLog on the term-tag path'
    - 'TermServiceImpl.java:169, 183 — sibling term mutations DO emit @ActivityLog(TERM_ASSIGNMENT_UPDATED)'
    provenance: |-
      STATIC — primary-source X-TAGGING createTermTagsRelations sidecar
      bugs_limitations_corner_cases "No activity-feed audit for term-tag
      changes" + updateDatasetFieldTags implicit_adrs "Activity audit captures
      full before/after tag state at the dataset-field surface" + deleteTag /
      createTag / updateTag sidecars (directory-CRUD no @ActivityLog).
      Severity: MEDIUM. Extends system-mission.md canonicalisation_candidate
      "Audit-log Presence Asymmetry (2-tier audit story)" to a 4-surface
      picture.
  - facet_id: F-018-DRIFT-XTAGGING-tag-openapi-no-4xx-no-securityschemes
    facet: |-
      the `tag` OpenAPI tag declares NO 4xx response on any of the four
      operations, NO security: block, and NO securitySchemes — every failure
      mode and every authorization requirement is invisible to the contract;
      the tag itself is a bare `name:` entry with no description / externalDocs
    category: contract-illegibility
    severity: MEDIUM
    headline: |-
      A spec consumer of the tag directory CRUD cannot derive auth
      requirements (which write op needs which TAG_* permission), cannot
      anticipate 401/403/404/400, and gets a blank tag heading in Swagger UI.
    operator_visible_consequence: |-
      An API-gateway / contract-test generator / third-party SDK builder
      consuming the OpenAPI spec derives ZERO access control for /api/tags
      (the three write ops need TAG_CREATE / TAG_UPDATE / TAG_DELETE, the read
      needs only authenticated() — none of it encoded). A generated client
      has no typed model for the forbidden / not-found / duplicate-name cases.
      Swagger UI / ReDoc render the `tag` tag heading with no blurb and no
      link to the docs site.
    observed: |-
      The `tag` tag is declared as a bare `name: tag` (`openapi.yaml:19` — no
      `description`, no `externalDocs`). The contract carries no top-level
      `security:` block and no `components.securitySchemes` (verified by
      exhaustive grep on openapi.yaml + components.yaml at `ede5d277`). No
      `tag`-tagged operation declares any 4xx: getPopularTagList declares only
      200, createTag / updateTag only 201, deleteTag only 204 — yet the
      controller raises NotFoundException (404) on updateTag/deleteTag and
      UniqueConstraintException (400) on createTag/updateTag, and the
      SecurityRule chain produces 401/403.
    expected: |-
      Add `description` + `externalDocs.url` (-> features/data-discovery/tagging)
      to the `tag` tag; declare 4xx response shapes referencing the existing
      `ErrorResponse` component on all four operations; add a `security:`
      block / `securitySchemes` so the auth requirement is machine-readable.
    drift_class: tag_openapi_tag_no_4xx_response_declared_failure_modes_invisible_to_contract
    evidence:
    - 'openapi.yaml:19 — the tag is a single-line `- name: tag` with no description / externalDocs'
    - 'openapi.yaml:1-49 — no top-level security: block'
    - 'openapi.yaml:352-421 — every tag operation declares only its success status; no 4xx'
    - 'components.yaml grep at ede5d277 — no securitySchemes'
    provenance: |-
      STATIC — primary-source X-TAGGING `tag` openapi sidecar
      bugs_limitations_corner_cases (no-4xx + no-description-no-externalDocs)
      + security.known_security_gaps (no-security). Severity: MEDIUM. Aligns
      with the alert + dataEntity openapi-tag sidecars' identical findings;
      cross-link F-029 (Platform Public API Contract — the spec-wide
      no-securitySchemes gap).
  - facet_id: F-018-DRIFT-XTAGGING-create-tag-in-batch-duplicate-atomicity-unverified
    facet: |-
      createTag's bulk INSERT (no ON CONFLICT) has UNVERIFIED in-batch
      duplicate atomicity — a payload with a self-duplicate or a cross-batch
      duplicate may roll back wholly or partially commit; a partial commit is
      a silent data-shape bug
    category: atomicity-unverified
    severity: MEDIUM
    headline: |-
      POST /api/tags with [{name:a},{name:a}] hits tag_name_unique on the
      second row; whether the whole multi-row INSERT rolls back or the
      distinct names land is not statically determinable (P-026).
    operator_visible_consequence: |-
      An operator submits a 5-tag batch, one name collides, the request
      returns a 4xx — and (if the INSERT partially commits) 4 tags exist
      anyway. A retry of the batch then hits a duplicate error on the names
      that already landed. The fail-on-duplicate contract gives no indication
      WHICH name collided.
    observed: |-
      `TagController.createTag` -> `TagServiceImpl.bulkCreate` -> inherited
      `ReactiveAbstractCRUDRepository.bulkCreate` (`:114-126`) emits a single
      `insertManyReturning` multi-row INSERT with NO `ON CONFLICT` clause. A
      payload `[{name:a},{name:a}]` hits the `tag_name_unique` partial index
      on the second row. Whether the whole INSERT rolls back atomically
      (zero rows) or partially commits (the distinct names land) depends on
      the R2DBC `insertManyReturning` emission shape and Spring's reactive-TX
      rollback semantics — NOT statically determinable.
    expected: |-
      Confirm via P-026 whether the bulk INSERT is atomic. If it partially
      commits, either wrap it so it is atomic, OR document the partial-commit
      behaviour. Cross-batch duplicate should either be reported per-name or
      switched to create-or-ignore semantics.
    drift_class: create_tag_in_batch_duplicate_atomicity_unverified_no_on_conflict_partial_commit_risk
    evidence:
    - 'TagController.java:22-28 — createTag delegates to bulkCreate'
    - 'ReactiveAbstractCRUDRepository.java:114-126 — insertManyReturning, NO ON CONFLICT'
    - 'V0_0_64__remove_is_deleted_field.sql:105 — tag_name_unique partial index'
    cross_references:
      probes:
      - P-026
    provenance: |-
      STATIC+PROBE-NEEDED — primary-source X-TAGGING createTag sidecar
      bugs_limitations_corner_cases "In-batch duplicate-name atomicity is
      UNVERIFIED" + stress_findings resource_boundaries (PROBE-NEEDED).
      Severity: MEDIUM (HIGH if P-026 shows partial commit). Probe P-026
      pins the data-shape contract.
