expected_outcome: |
  Stress question (Category F — input-name vs implementation drift on the
  `query` field): the user types a search string into <MainSearchInput>; that
  text is dispatched verbatim as `searchFormData.query` (MainSearchInput.tsx:
  37-48) into POST /api/search → SearchServiceImpl.search → eventually
  `JooqFTSHelper.tsQuery(query)` at JooqFTSHelper.java:164-168 which
  splits-on-space, appends `:*` to each token, joins on `&`, and passes the
  result to `to_tsquery(?)` UNESCAPED. The user-facing input is labelled
  "Search" (`<MainSearch placeholder={t('Search')} ...>` Search.tsx:80) —
  promising a friendly text-search interface. The implementation is
  Postgres tsquery (an expression language with metacharacters !, |, &, (,
  ), :, *, <->). Hypothesis: typing a query containing a tsquery
  metacharacter (e.g. `foo )(`, `bar | (`, `:` alone) raises Postgres
  42601 (syntax error in tsquery), poisoning the session UUID such that
  every subsequent read on that UUID 500s. Operator-visible: the user
  sees a generic error toast (if any); refreshing the page repeats the
  error because the URL still carries the poisoned UUID; the session is
  permanently broken until the user manually navigates away to `/search`
  (sans UUID). The drift is `DRIFT_INPUT_NAME_VS_IMPLEMENTATION`: input
  name says "Search" (free-text); implementation is tsquery (expression
  language).
