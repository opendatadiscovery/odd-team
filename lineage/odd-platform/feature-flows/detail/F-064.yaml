feature_id: F-064
pillar_id: P-07
pillar_anchored_id: P-07:F-007
pillar_anchored_feature_name: User-Owner Association Discoverability
feature_name: |-
  "My objects" silent-empty across Activity / Alerts / Owned views — users
  without a user_owner_mapping see the feature as broken, indistinguishable
  from "no activity / no alerts in window"
seeded_from: SHB-060
seeded_at: '2026-05-26'
primary_drift_class: silent_empty_for_unmapped_users_no_ui_affordance_no_diagnostic_signal
drift_class_summary:
- silent_empty_for_unmapped_users_no_ui_affordance_no_diagnostic_signal
- count_badge_returns_zero_reinforces_appears_broken
- cross_feature_uniform_silent_empty_pattern_activity_alerts_my_objects_views
- doc_does_not_flag_user_owner_association_prerequisite_for_my_views
- onboarding_workflow_gap_admin_sets_up_rbac_for_others_but_not_themselves
cross_pillar_relationships:
- pillar_id: P-09
  kind: shares_data_with
  via: |-
    The silent-empty pattern surfaces because user_owner_mapping is the
    catalog-side identity binding for the authenticated principal — the
    same data model that gates RBAC ownership scoping. F-011 (Principal-to-
    Owner Resolution) is the underlying chokepoint; F-064 is the
    user-observable consequence at the Activity/Alerts UI.
- pillar_id: P-08
  kind: feeds_from
  via: |-
    The user_owner_mapping rows are authored via the Management UI's
    Associations tab (per system-mission.md P-08 sub-feature seed). A
    platform-operator audience configures these mappings; without that
    config step the "My" views silently degrade.
batch_origin: shoebox-graduation-2026-05-26
created_in_batch: shoebox-graduation-2026-05-26
status: ui-incomplete
status_reason: |-
  The feature is composed from backend code-walk evidence (ActivityServiceImpl.fetchMyActivities,
  AlertServiceImpl.listByOwner, AuthIdentityProviderImpl.fetchAssociatedOwner)
  plus shoebox seed evidence (SHB-060). The UI half — confirming how
  Activity.tsx and Alerts.tsx render the silent-empty payload, and whether
  any inline banner / global widget surfaces the missing association —
  is referenced via existing F-021 batch-ZL Activity.tsx sidecar but NOT
  yet enriched at the dedicated UI component layer for the silent-empty
  affordance. Drift facets that depend on UI behaviour carry
  ui_unverified: true.
