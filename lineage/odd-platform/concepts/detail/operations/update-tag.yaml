name: Update Tag (rename + Important-flag toggle, search-vector-symmetric)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-08
  - P-09
description: |-
  NEW OPERATION, batch X-TAGGING (2026-05-21) — captures
  `PUT /api/tags/{tag_id}` at the operation-concept level. Previously
  the operation was only implicit inside the Tag entity and referenced
  obliquely by the `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
  invariant; the `updateTag` controller-method sidecar promotes it to
  a first-class catalog citizen.

  THE ENDPOINT:
    PUT /api/tags/{tag_id} -> HTTP 200 (de facto; OpenAPI declares 201).
    Gated by TAG_UPDATE permission (Management scope, NO_CONTEXT) via
    SecurityConstants.SECURITY_RULES at SecurityConstants.java:138-142.

  THE CHAIN:
    TagController.updateTag (TagController.java:46-52) — 2-line
    reactive delegation: `tagFormData.flatMap(fd -> tagService.update(tagId, fd)).map(ResponseEntity::ok)`.
    -> TagServiceImpl.update (TagServiceImpl.java:44-55, @ReactiveTransactional):
       Step 1: getDto(tagId) -> NotFoundException if absent.
       Step 2: `!external` filter -> BadUserRequestException
               ("Can't update tag which has external relations") if the
               tag has any Collector-set data-entity relation. See the
               `external-relations-immutable-to-ui-users-cross-method-guard-tagserviceimpl`
               invariant.
       Step 3: tagMapper.applyToPojo(formData, pojo) applies BOTH name
               and important.
       Step 4: reactiveTagRepository.update persists.
       Step 5: updateSearchVectors (TagServiceImpl.java:161-167) — a
               Mono.zip of THREE concurrent FTS-vector refreshes.

  SEARCH-VECTOR SYMMETRY — update refreshes 3, delete refreshes 1:
    Renaming a tag propagates the new name into
    search_entrypoint.tag_vector of every data entity carrying it
    (ReactiveSearchEntrypointRepositoryImpl.java:319-341 joins
    TAG -> TAG_TO_DATA_ENTITY -> DATA_ENTITY). The `update` path
    refreshes all three vectors (entity tag_vector + dataset-structure
    vector + term-side vector); the sibling `delete` path refreshes
    only one. The asymmetry is a delete-side gap, NOT an updateTag
    gap — updateTag is the search-index-consistent operation. See the
    `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
    invariant.

  DRIFTS / LIMITATIONS A CAREFUL OPERATOR SHOULD KNOW:
    Drift 1 — status-code: the controller returns HTTP 200 via
    `ResponseEntity::ok` (TagController.java:51); the OpenAPI operation
    declares 201 (openapi.yaml:400). Same drift class as createTag.
    Limitation 2 — response Tag omits external + usedCount: the
    terminal `.map(tagMapper::mapToTag)` uses the bare-pojo overload
    (TagMapper.java:26), which maps only id/name/important; the
    OpenAPI Tag schema declares external + usedCount, so a consumer
    of PUT /api/tags/{tag_id} receives those two fields as null —
    inconsistent with getPopularTagList's Tag items (which DO populate
    them). The mapToTag(TagDto) overload that WOULD populate them is
    available but unused on this path.
    Limitation 3 — `!external` guard reads only the data-entity
    aggregate: boolOr(tag_to_data_entity.external) — it does NOT
    consult tag_to_dataset_field origins. A tag with INTERNAL
    data-entity relations but EXTERNAL tag_to_dataset_field relations
    passes the guard and is renamable. Same gap shape as deleteTag.
    Limitation 4 — TOCTOU window between getDto and update — no
    SELECT ... FOR UPDATE, no optimistic-lock version column; a
    concurrent Collector ingestion attaching an external relation
    between the read and the write is not detected.

