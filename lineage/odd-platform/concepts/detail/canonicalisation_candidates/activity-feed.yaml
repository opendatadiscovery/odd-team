proposed_canonical: Activity Feed
rationale: 'ActivityController.getActivity is a first-class platform surface — global
  audit trail with 12 query parameters, four-way type dispatch (ALL/MY_OBJECTS/UPSTREAM/DOWNSTREAM),
  cursor pagination, and a live UI page (`features/active-platform-features/activity-feed`,
  verified 200, 2026-05-10). main-concepts.md does not name ''Activity Feed'' as a
  canonical term; the only doc-side coverage is the feature page that omits the `type`
  parameter, the visibility model, and pagination mechanics. The `/developer-guides/api-reference/activity`
  page returns 404 — there is NO first-party API-reference home for this surface.
  HIGH-priority canonicalisation candidate: extend main-concepts.md AND create the
  missing api-reference page.'
contributing_concepts:
- Activity (getActivity)
- ActivityType (getActivity)
- ActivityEventType (getActivity)
- ActivityState (getActivity)
- AssociatedOwner / DataEntityRef (getActivity)
suggested_add_to_docs: true
