behaviour: |-
  **META — CROSS-CUTTING DIRECTORY-WIDE GAP — `odd-platform-ui/src/routes/` has ZERO test coverage at any level.** Verified across batch ZH (5 sidecars + 1 already-processed alerts sidecar): every single route-module sidecar emits `test_files: []`, and every sidecar's `gaps` section says the same: no `*.test.*` / `*.spec.*` file under `odd-platform-ui/src/routes/` references `managementPath` / `associationsPath` / `integrationsPath` / `dataModellingPath` / `queryExamplesPath` / `relationshipsPath` / `dataQualityPath` / `lookupTablesPath` / `termsPath` / `termsSearchPath` / `termDetailsPath` / `useTermsRouteParams` / `useIntegrationRouteParams` / `useDataEntityRouteParams` / `alertsPath`.

  **Verified via Grep against the running repository (2026-05-26)**:
  ```
  $ find /home/raman/work/odd-platform/odd-platform-ui/src/routes -name '*.test.*' -o -name '*.spec.*' | wc -l
  0
  $ find /home/raman/work/odd-platform/odd-platform-ui/src -name '*.test.*' -o -name '*.spec.*' \
      | xargs grep -lE 'managementPath|dataModellingPath|dataQualityPath|lookupTablesPath|termsPath|termsSearchPath'
  (no output — 0 matches)
  ```

  **Why this is a HIGH-LEVERAGE meta-gap, not just an aggregation**:
  - The routes/ directory is the URL-shape contract of the ENTIRE SPA. Every operator-facing surface — Catalog, Directory, Data Quality, Data Modelling, Master Data, Management, Dictionary, Alerts, Activity, Lookup Tables, Terms — addresses through these builders.
  - A typo in any `BASE_PATH` (e.g. `/manage` for `/management`) silently breaks every link without a build error or a test failure; discovery is human-only.
  - The directory hosts the project-wide anti-pattern surfaced in TEST-GAP-422 / TEST-GAP-849 / TEST-GAP-997 / TEST-GAP-1000 (`useParams<T>() as T` casts + parseInt without guards) — without a test class targeting the directory, the anti-pattern compounds with every new route.
  - The asymmetry between routes that have BASE_PATH (8 modules) and the outlier without (1 module — TEST-GAP-1002) goes silently undetected by the build.
  - The cross-cutting `WithPermissionsProvider` semantic drift (TEST-GAP-994) lives at THIS layer — without route-layer tests, the deliberate any-authenticated-user read posture has no regression-pin.

  **Eight pillars affected**: P-01 (DataEntities route) + P-02 (DataModelling) + P-03 (MasterData / LookupTables) + P-04 (DataQuality) + P-06 (Terms) + P-07 (Alerts) + P-08 (Management) + P-09 (Auth-and-Access — the route-level permission posture across all of the above).

  **What a route-tier test scaffold would unlock**: TEST-GAPs 994-1005 in this batch alone would have CONCRETE TEST FILES. The next 10 batches of UI sidecars (dashboard sub-pages, individual route consumers, hooks) would have a precedent + scaffold to follow.
test_class: missing-unit
criticality_rationale: |-
  Bumped from sidecar-rated LOW (individually, per-route-module) to MEDIUM as a META-aggregator across 6 sidecars + 8 pillars. NOT bumped to HIGH because: (a) the build does catch SOME failure modes (TypeScript type errors on `as T` casts when the asserted type is wrong); (b) the operator-facing impact is REGRESSION-RISK rather than current-bug; (c) backend RBAC catches every real authorization issue regardless of UI-test posture. NOT bumped to CRITICAL because no data-loss or credential-leak vector. The 8-pillar cross-pillar amplification IS recorded but NOT used for an additional bump — the meta-anchor purpose (be a single entry point for the route-tier test-authoring effort) is the priority, not severity inflation.
