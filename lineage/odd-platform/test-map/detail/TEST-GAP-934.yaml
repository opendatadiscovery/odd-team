behaviour: |-
  **The four RoleController endpoints × four auth modes × three caller-shape
  scenarios = 48-cell RBAC gate-coverage matrix is untested.** POST /api/roles
  is gated by ROLE_CREATE (SecurityConstants.java:169); PUT and DELETE by
  ROLE_UPDATE / ROLE_DELETE (lines 170-173); GET has NO SECURITY_RULES entry.
  Under DISABLED the entire SECURITY_RULES table is INERT
  (DisabledAuthSecurityConfiguration permitAll) — all four endpoints are
  anonymously reachable. Under LOGIN_FORM / OAUTH2 / LDAP the gate fires.
  Under any non-DISABLED mode with auth.s2s.enabled, ANY X-API-Key holder is
  injected as ADMIN globally (REFACTOR-108 — TEST-GAP-219). The compound risk:
  a hijacked X-API-Key can create a Role granting MANAGEMENT/ALL, bind it to
  any Owner, escalate to platform admin — all WITHOUT an audit trail (the
  controller emits zero log lines — TEST-GAP-221/573/659 cluster). Zero test
  exercises this matrix.
