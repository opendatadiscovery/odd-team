      - hard-delete-on-relationship-edges-confirmed-cross-batch (NEW)
      - deg-is-manually-created-deg-defensive-check (NEW)
    - Cross-references "Manage Ownership Lifecycle (create/update/delete
      with DEG cascade)" operation — both touch DEG-related write
      surfaces; ownership has DEG-propagation cascade, this has
      DEG-membership direct write
