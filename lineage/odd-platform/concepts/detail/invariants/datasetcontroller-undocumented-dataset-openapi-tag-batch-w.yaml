  - P-01
  - P-05
  - P-11
description: |-
  NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20W — documents a
  doc-gap class where the DatasetController's 4 GET endpoints are
  defined in the OpenAPI spec under the `dataSet` tag
  (openapi.yaml:1793-1878) but NO live documentation page describes
  them. Sister to the DataSourceController doc-gap THIS BATCH;
  same architectural class.

  THE DOC-GAP — what the live docs do and do not say:

    Live /developer-guides/api-reference (WebFetched 2026-05-20,
    status 200):
      The API Reference hub lists 9 per-feature sub-pages:
        - Alerts
        - Data Collaboration
        - Directory
        - Glossary
        - Integrations
        - Lineage
        - Query Examples
        - Reference Data
        - Relationships
      The dataSet OpenAPI tag has NO sub-page. Verbatim from the
      fetched response: 'The reference hub documents these feature
      areas: Alerts, Data Collaboration, Directory, Glossary,
      Integrations, Lineage, Query Examples, Reference Data,
      Relationships. None of these sections mention dataset-specific
      CRUD operations, versioning, or diff functionality.'

    Live /developer-guides/api-reference/relationships (WebFetched
    2026-05-20, status 200):
      Lists THREE endpoints: GET /api/relationships, GET
      /api/relationships/erd/{id}, GET /api/relationships/graph/{id}.
      DOES NOT list GET /api/datasets/{data_entity_id}/relationships
      — the dataset-scoped relationships endpoint. Verbatim:
      'Regarding GET /api/datasets/{data_entity_id}/relationships
      — No, this endpoint is not mentioned on this page.'

    Live /features/data-discovery (WebFetched 2026-05-20, status
    200):
      Names 'Dataset schema diff' as a sub-feature under
      'change-and-freshness-signals'. Verbatim text describing the
      UI behaviour: 'visual side-by-side comparison of dataset
      schema revisions, with backwards-incompatible changes
      additionally raising an alert.' But provides NO API anchor,
      permission model, or operator-scoping commentary.

  THE FOUR ENDPOINTS NOT SURFACED IN ANY LIVE DOC PAGE:

    Endpoint 1: GET /api/datasets/{data_entity_id}/structure/{version_id}
      DatasetController.getDataSetStructureByVersionId
      openapi.yaml location: 1793-1878 (the dataSet tag block)

    Endpoint 2: GET /api/datasets/{data_entity_id}/structure
      DatasetController.getDataSetStructureLatest
      openapi.yaml location: 1793-1878

    Endpoint 3: GET /api/datasets/{data_entity_id}/structure/diff
      DatasetController.getDataSetStructureDiff
      openapi.yaml location: 1793-1878

    Endpoint 4: GET /api/datasets/{data_entity_id}/relationships
      DatasetController.getDataSetRelationships
      openapi.yaml location: 1810-1826
      (LIVE /api-reference/relationships explicitly OMITS this
      one despite documenting its 3 sibling endpoints)

  WHAT THIS DOC-GAP ACTUALLY HIDES:

    1. The endpoints exist and are RBAC-ungated (any authenticated
       user can hit them). Cross-link to read-collaborative-cross-owner-enumeration.

    2. The endpoints expose the F-004 column-level read surface
       (cross-link to f-004-read-side-surface-at-column-level-via-datasetcontroller-batch-w).

    3. The endpoints have a PER-ENTITY-SCOPING BYPASS on two of
       three structure variants (cross-link to
       datasetcontroller-per-entity-scoping-bypass-data-entity-id-not-enforced-at-sql).

    4. The endpoints have ASYMMETRIC error contracts (404 on
       getDatasetVersion-not-found, 500 on missing-version-id-in-diff)
       — undocumented.

    5. The endpoints have NON-LINEAR diff payload size (parent-field
       cascade DELETE+CREATE for nested struct types) — undocumented.

    6. The endpoints can be reached anonymously under
       auth.type=DISABLED.

    Operators discovering the 4 endpoints rely on Swagger UI at
    `{platform-base-url}/api/v3/api-docs` — but Swagger UI shows
    only the OpenAPI shape, NOT the operational caveats above.

  THE SIBLING DOC-GAP — DataSourceController (THIS BATCH):

    The same architectural class: DataSourceController has 5
    endpoints in openapi.yaml:425-527 under the dataSources OpenAPI
    tag; NO sub-page on the API Reference hub documents them.
    Verbatim from the live page: 'Data Sources endpoints are not
    included in this particular documentation page.' Both
    controllers' endpoints carry RBAC-relevant + behavior-relevant
    caveats that operators cannot discover from the docs.

  THE BROADER PATTERN — controllers without docs:

    Five controllers' API surfaces are missing from the
    /developer-guides/api-reference hub (batch W discovery):
      - DataSourceController (5 endpoints) — sibling THIS BATCH
      - DatasetController (4 endpoints) — THIS INVARIANT
      - NamespaceController (5 endpoints) — batch W
        bugs_limitations_corner_cases note
      - TagController (4 endpoints) — batch W
        bugs_limitations_corner_cases note + the live
        /features/data-discovery/tagging page documents the
        Tag feature but NOT the API
      - CollectorController (5 endpoints) — batch W
        bugs_limitations_corner_cases note + the live
        /integrations/integrations/odd-collector page touches
        on tokens but not the F-020 lifecycle API

    Five Management-tier controller APIs (the operator's daily-ops
    surface) have no doc-anchor on the API Reference hub. The
    operator must read the spec or Swagger UI.

  SEVERITY MEDIUM — the gap blocks operators from discovering
  the endpoints' caveats; the spec is published; Swagger UI
  is the runtime fallback. Severity is MEDIUM (not HIGH) because
  the endpoints THEMSELVES are not broken; the OPERATIONAL doc
  layer is incomplete.

