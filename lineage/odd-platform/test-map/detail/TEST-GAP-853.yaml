proposed_action: |-
  **Vitest empty-state tests** (2 tests):

  1. `renderSearch_zeroCatalogEntities_currentlyRendersNoMatchesFound_pinsOnboardingUXGap` — render Search with mocked API returning `{total: 0, items: []}` AND a separate check on `useGetCatalogStats` returning 0. Assert the placeholder text is 'No matches found'. PINS the current ambiguous copy.

  2. `renderSearch_filterReturnsZeroResults_rendersNoMatchesFound_pinsHappyPath` — render Search with non-zero catalog AND zero filtered results. Assert same copy. PINS the existing intended behaviour for the "real" no-matches case.

  **Architectural fix**:
  - Distinguish the two states: `totalCatalogEntities === 0` → onboarding-shaped copy "No data entities exist yet — start by deploying a collector"
  - Add the same logic to TermSearch (clone-propagated)
  - Tests then flip the first assertion to the new copy
  - Doc-side fix: add "First-time use" subsection to docs/features/data-discovery/search.md

  Coherence note (LSN-018 Rule 6): STRENGTHENS TermSearch batch-U bugs[8] by establishing the clone-propagation. NO contradiction with existing artefacts.
