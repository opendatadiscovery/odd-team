  - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/utils/SecurityConstants.java:95-96"
  - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/config/MinioConfig.java:14-17 (@Value access-key/secret-key)"
  - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/auth/properties/ODDLDAPProperties.java:10,14 (@Data password)"
  - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/auth/properties/ODDOAuth2Properties.java:30,34 (clientSecret no @ToString.Exclude)"
  - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/config/R2DBCConfiguration.java:35,58"
