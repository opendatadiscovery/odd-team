    sidecar: unresolved
    evidence: |-
      odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/datacollaboration/SlackEventParser.java:22-23
      — `parse(final String rawJson)` takes only the raw body string; no
      headers, no timestamp, no signature.
    multiplicity_per_trigger: 1
  - hop: 3
    node: "WHITELIST_PATHS contains /api/slack/events"
    sidecar: unresolved
    evidence: |-
      odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/utils/SecurityConstants.java:95-96
      — WHITELIST_PATHS contains `/api/slack/events` (verified per
