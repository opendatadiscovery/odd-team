proposed_action: |-
  Add `ActivityControllerSizeParamBoundaryTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` using `@WebFluxTest(ActivityController.class)` + `WebTestClient`. Four test methods (one per boundary value):

  1. **`getActivity_sizeNull_pinsUnboundedLimitDespiteOpenApiRequiredTrue`** (HEADLINE):
     - Arrange: seed 1000 activity rows
     - Act: `webTestClient.get().uri("/api/activity?begin_date={b}&end_date={e}", b, e).exchange()` (NO size param)
     - Assert (PIN current behaviour): `.expectStatus().isOk()`; response body length = 1000 (full table scan, no LIMIT)
     - Comment: this is the DOC-vs-CODE drift PIN. A future refactor that adds `@NotNull` to the size parameter changes this to HTTP 400; the test then becomes the regression-pin demonstrating the fix.

  2. **`getActivity_sizeZero_returnsEmptyFlux_pinDegenerate`** (CONTROL):
     - Act: `size=0`
     - Assert: 200 OK; response body length = 0

  3. **`getActivity_sizeNegativeOne_returns500NotBadRequest_pinUnhandledError`**:
     - Act: `size=-1`
     - Assert: PIN the HTTP 500 outcome (the OpenAPI spec implies 400 for invalid input; the actual behaviour is 500). After P-016 confirms, lock the test to the empirical outcome.

  4. **`getActivity_sizeIntegerMaxValue_returns200WithFullDataset_pinDoSAmp`**:
     - Arrange: seed 100K rows
     - Act: `size=2147483647`
     - Assert: 200 OK; response body length = 100K. PIN the unbounded-scan amplification surface.

  After P-016 measures each boundary empirically, refine the test assertions. Cross-pair with REFACTOR-NNN to introduce `@NotNull @Min @Max` constraints. Cross-pair with DOC-NNN to surface the size-param semantics on activity-feed.md AND the OpenAPI spec.
