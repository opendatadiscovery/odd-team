name: TermServiceImpl service-tier zero permission checks
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-06
- P-09
description: |-
  **NEW INVARIANT, batch 2026-05-19K** — the entire 552-line `TermServiceImpl`
  (the service-tier orchestrator for the Business Glossary across 17 methods
  spanning Term CRUD, Term-to-DataEntity / DatasetField / Term linkage,
  description-mention auto-link reconciliation, and tag-relation upserts)
  carries ZERO service-tier permission checks. Verified by Grep:
  `grep -n '@PreAuthorize\|hasPermission\|hasRole\|permissionService'
  TermServiceImpl.java` returns ZERO matches. All authorization is
  controller-tier via `SecurityConstants.SECURITY_RULES` matchers in
  `AuthorizationCustomizer`. The service blindly trusts the call.
  **Combined with REFACTOR-217** (the SecurityRule path-mismatch `/term`
  singular vs OpenAPI `/terms` plural at SecurityConstants.java:237-242),
  the entire term-linkage surface — `linkTermWithDataEntity`,
  `removeTermFromDataEntity`, `linkTermWithDatasetField`,
  `removeTermFromDatasetField`, `linkTermWithTerm`,
  `removeTermToLinkedTermRelation` — is effectively
  unauthenticated-mutation-allowed for any authenticated user. **The
  service-tier absence is the structural enabler**: even if REFACTOR-217
  were fixed at the controller-tier, the auto-link side-channel via
  `handleDataEntityDescriptionTerms` (TermServiceImpl.java:201-207) would
  STILL bypass DATA_ENTITY_ADD_TERM (because it's invoked from
  DataEntityServiceImpl.upsertDescription which is gated by
  DATA_ENTITY_DESCRIPTION_UPDATE). The service-tier-zero-checks architecture
  forces ALL authorization decisions onto the controller-perimeter — a
  failure mode for any future service-to-service invocation pattern (e.g.,
  if an internal job or admin tool invokes TermService methods directly,
  there is NO defence-in-depth). Additionally: cross-namespace pollution is
  unconstrained (neither TermServiceImpl nor ReactiveTermRepositoryImpl
  references odd.tenant-id or any tenant scoping); read endpoints
  (getTerms, getTermByNamespaceAndName, getTermDetails, listByTerm,
  getDataEntityTerms, getDatasetFieldTerms) return every Term across every
  namespace to every authenticated user (consistent with the platform's
  read-collaborative posture per system-mission.md:267, but
  worth-recording given the namespace concept implies team isolation).
