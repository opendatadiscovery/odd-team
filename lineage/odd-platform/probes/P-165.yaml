expected_outcome: |
  Stress question (Category B name-vs-behavior drift): the
  `WithPermissionsProvider` wrapper at
  `components/DataModelling/DataModellingRoutes.tsx:19-25` (around the
  `/data-modelling/query-examples` route) declares
  `allowedPermissions={[Permission.QUERY_EXAMPLE_CREATE]}`. A reader sees
  this and reasonably concludes the route is GATED for users without
  `QUERY_EXAMPLE_CREATE`. The file-analyser's static analysis claims the
  opposite: `WithPermissionsProvider` only seeds a React Context
  (`WithPermissionsProvider.tsx:11-49` + `PermissionProvider.tsx:12-46`
  unconditionally render their children) and the actual gate is the SEPARATE
  `WithPermissions` component at `WithPermissions.tsx:27-29` used inside
  `QueryExamples.tsx:36-46` to hide the 'Add query example' button.

  This probe pins the hypothesis: a user authenticated without
  `QUERY_EXAMPLE_CREATE` who navigates to `/data-modelling/query-examples`
  STILL SEES the page (search input, list of query examples, count
  indicator) and only LOSES the Add button. If the hypothesis is confirmed,
  the `WithPermissionsProvider` naming is misleading and the methodology
  should record this as a documented architectural pattern (the route
  surface is intentionally read-collaborative; the wrapper is misnamed)
  AND a doc-gap-finder note to clarify in the operator-facing docs that
  "RBAC-gated by QUERY_EXAMPLE_CREATE" means "the Add button is gated",
  not "the page is gated".

  Sibling hypothesis (same probe, second assertion block): the
  `/data-modelling/query-examples/:id` route wraps with
  `allowedPermissions={[QUERY_EXAMPLE_UPDATE, QUERY_EXAMPLE_DELETE]}` which
  uses `every()` (`PermissionProvider.tsx:21-25`). A user with ONLY
  `QUERY_EXAMPLE_UPDATE` and NOT `QUERY_EXAMPLE_DELETE` (or vice versa) —
  STILL sees the page (wrapper doesn't block) but their `isAllowedTo`
  evaluates to FALSE because every() requires both. The probe confirms
  this asymmetry.
