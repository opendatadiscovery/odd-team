    When a collector POSTs a large batch, the platform accepts it quickly (e.g. 202 Accepted +
    async processing) so the collector is not blocked holding an HTTP connection open for the full
    server-side processing time — a collector author does not have to tune long client-side timeouts
    to match the platform's per-batch processing duration.
  derivation: |-
    Large-batch ingestion is the documented common case (collectors batch a tick's results); a
    product owner would expect an intake/processing decoupling (202 + status endpoint) for a
    high-volume write surface.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      Ingestion is fully SYNCHRONOUS: the controller's `.thenReturn(ResponseEntity.ok().build())`
      fires only AFTER the entire `@ReactiveTransactional` pipeline (body parse → datasource resolve
      → upsert → 14 processors → OTLP export) completes (IngestionController.java:38-45 +
      IngestionServiceImpl.java:65-74). There is no 202-Accepted / queue / async mode and no
      status-check endpoint. The HTTP connection AND the DB transaction are held open for the full
      processing duration.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataEntityList.md
        section: performance.throughput_characteristics + known_performance_gaps[0]
        cite: "IngestionController.java:38-44 + IngestionServiceImpl.java:65-74"
        note: "Synchronous .thenReturn after the full pipeline; no 202+queue mode."
      - sidecar: odd-platform__java__service__service__IngestionService.md
        section: understanding (closing)
        cite: "IngestionServiceImpl.java:72"
        note: "\"The whole pipeline including OTLP metric export completes BEFORE the 200 OK fires — no async-accept / 202 mode.\""
    operator_visible_failure: |-
      A collector author must size their HTTP client read-timeout to the platform's WORST-CASE
      per-batch processing time (which scales with batch size, datasource contention H-006, and OTLP
      backend latency). Set it too short and a batch that is actually committing server-side trips a
      client timeout → the author retries → a duplicate concurrent ingestion that contends on the
      row lock. There is no backchannel to learn "your batch is still processing". This is an
      intentional design posture (the test suite depends on synchronous outcomes) — so it routes to
      caveat, not bug — but it is undocumented and directly shapes how an author must configure their
      collector. drift class `sync_ingestion_no_202_accept_mode_http_connection_held_for_full_pipeline`.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-009
  hypothesis: |-
    When an ingestion fails and rolls back, an operator can open the platform logs and find a
    log line naming the failure cause + a discriminator (which collector / which datasource /
    how many entities) — so the platform side can diagnose a collector's failed ingestion without
    needing the collector author's cooperation.
  derivation: |-
    Standard operability expectation for a destructive write path; a rollback that wipes a whole
    batch is exactly the event an SRE expects to find logged at WARN.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      `IngestionServiceImpl` carries `@Slf4j` (line 53) but a grep for `log.` in the file returns
      ZERO matches (service sidecar requires-runtime + bugs_limitations_corner_cases[3], verified
      this run per the feature-flow scanner_review F-096c). Every behavioural decision and every
      rollback path executes silently. The only artefacts of a failure are the exception stack trace
      (on the platform application log, via the default handler) and the absence of committed rows.
    evidence:
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: requires-runtime + bugs_limitations_corner_cases[3] + implicit_adrs[3]
        cite: "IngestionServiceImpl.java:53"
        note: "@Slf4j present, zero log.* calls in the body (grep-verified)."
    operator_visible_failure: |-
      An SRE paged for "ingestion 5xx spike" sees only generic exception traces with no
      collector-id / datasource-oddrn / entity-count discriminator to scope the failure to a
      specific collector or batch — the SRE response window is doubled because they must
      cross-reference traces by timestamp instead of filtering by a tagged WARN line. A security
      review of "is someone probing the unauthenticated endpoint" cannot be answered from logs at
      all. Fix: structured WARN log on every rollback path with the batch tag (collector-id +
      datasource_oddrn + entity count). drift class `silent_failure_no_log`.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-010
  hypothesis: |-
    When a collector retries a failed batch (the documented response to a 5xx) against a payload
    that is in fact a permanent client error, the retry storm does not take the platform — or
    co-tenant collectors' ingestion — down with it.
  derivation: |-
    Combines H-002/H-003/H-004 (client errors return retry-triggering 5xx) with H-006 (per-datasource
    row lock) — the compound behaviour under a real retry storm is the operator's actual risk and can
    only be known by running it.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Statically: a permanent-error payload returns 5xx → the author's retry-with-backoff fires →
      the same crash → retry again, while the failing transaction re-acquires the `data_source` row
      lock each attempt (held for the full pipeline up to the crash point), blocking co-tenant
      ingestion to that datasource. Whether this collapses into a sustained denial (heap pressure
      from 20 MB re-buffering per attempt + lock contention) or degrades gracefully cannot be settled
      from the sidecars — it depends on R2DBC pool sizing, transaction-timeout values, and the
      collector's actual backoff curve. Requires a local load injection to measure.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataEntityList.md
        section: performance.known_performance_gaps + security.known_security_gaps[4]
        cite: "IngestionController.java:38-44 + application.yml:14-15"
        note: "20MB buffered per attempt; no rate limit; row lock re-acquired per retry."
    operator_visible_failure: |-
      Potential: one collector with a permanent-error payload + naive retry takes down ingestion for
      every other collector sharing that datasource — a co-tenant denial-of-service from a single
      misbehaving (or compromised, given the default-OFF auth) caller. Measuring the actual blast
      radius is the probe's job.
    severity: HIGH
    confidence: LOW
    probe_id: PENDING-F-096-1
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: "probe PENDING-F-096-1"

- id: H-011
  hypothesis: |-
    When a collector sends a batch where all items are JOB_RUN-typed and the inbound entity set
    (after the JOB_RUN split) is empty, the ingestion completes cleanly rather than failing on an
    empty `IN ()` query or a downstream null/empty-collection path.
  derivation: |-
    The service splits JOB_RUN items into a separate flow (IngestionServiceImpl.java:84-91), then
    fetches existing pojos by the remaining ODDRN set (line 93) — an all-JOB_RUN payload makes that
    set empty, an edge case a collector emitting only task-runs would hit on every tick.
  seed_source: endpoint-shape
  validation:
