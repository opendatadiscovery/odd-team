proposed_action: 'Add `@ConfigurationProperties` binding parameterised test: assert
  `username-attribute: alice` binds to `usernameAttribute` (NOT `userNameAttribute`);
  assert `user-name-attribute: alice` binds to `userNameAttribute`. Locks both spellings
  AS-IS so a future strict-binding migration or relaxed-binding rule change is caught.'
