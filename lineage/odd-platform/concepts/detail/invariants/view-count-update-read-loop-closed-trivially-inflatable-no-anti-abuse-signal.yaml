name: view_count UPDATE→READ loop closed; trivially inflatable; no anti-abuse signal
canonical_in_docs: false
canonical_candidate: true
description: 'Producer half: getDataEntityDetails increments data_entity.view_count
  on every read (ReactiveDataEntityRepositoryImpl.java:173-180; no rate-limit, no
  idempotency key, no client-id-based debouncing). Consumer half: listPopular ranks
  exclusively by view_count DESC (ReactiveDataEntityRepositoryImpl.java:633, sole
  orderBy; id DESC tiebreaker only). Neither endpoint carries an authorization gate
  beyond .authenticated() (UNGATED under LOGIN_FORM/OAUTH2/LDAP; ANONYMOUS under DISABLED).
  No anti-abuse signal exists anywhere in the chain: no IP throttling, no signed-request,
  no sampling, no time-decay, no per-user view-count cap. A scripted loop of N calls
  to GET /api/dataentities/{id} pushes entity {id} to the top of GET /api/dataentities/popular.
  Under DISABLED the attacker need not authenticate. Additionally: no index on data_entity.view_count
  (verified across all 91 migration files) — every Popular page render is a sequential
  scan + in-memory sort. REFACTOR-201 confirmed from primary source (the closure of
  the loop). **Batch H — SQL PRIMARY-SOURCE TRIANGULATED**: ReactiveDataEntityRepositoryImpl
  batch-H sidecar provides the canonical SQL for BOTH halves of the loop: incrementViewCount
  (lines 173-180) is bare `UPDATE data_entity SET view_count = view_count + 1 WHERE
  id = ?` with no rate-limiting layer; listPopular ORDER BY DATA_ENTITY.VIEW_COUNT.sort(SortOrder.DESC)
  is the SOLE order signal at line 633. The repository sidecar adds two performance
  observations: (a) `view_count = view_count + 1` IS atomic per-statement in Postgres
  (no lost-update race even under concurrent calls); but (b) Postgres row-locks on
  popular entities become write-bottlenecks, and the missing view_count index degrades
  popular-list rendering to full-table scan + top-N sort for catalogs >100K entities.
  The closure is uniform: producer + consumer share one SQL file, one method per side,
  no anti-abuse defence at any layer.'
