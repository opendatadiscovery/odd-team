behaviour: |-
  Stale-response protection — when a user rapidly navigates A to B to C, the late-arriving A fetch can overwrite C's fresh data in state.dataentities.byId. The project's handleResponseAsyncThunk wrapper does not propagate or check Redux Toolkit's built-in requestId tracking. The slice reducer at dataentities.slice.ts:49-66 writes payload.id unconditionally with no in-flight tracking. Combined with the LSN-017 doubling, rapid navigation can issue 4-6 concurrent dispatches that each +1 view_count. Test asserts the LAST fulfilled is the one that lands.
test_class: missing-edge-case
test_files_existing: []
test_files_proposed:
  path: "odd-platform-ui/src/redux/thunks/__tests__/dataentities.thunks.requestId.test.ts"
  name: "fetchDataEntityDetails_rapidNavigation_lastResponseLands"
evidence:
  - "fetchDataEntityDetails.md says: 'rapid entity-id change (user clicks through 3 entities quickly) — confirm the last fulfilled is the one that lands (no stale-response overwrite of a newer fetch)' — uncovered_behaviours[8]"
  - "fetchDataEntityDetails.md bugs_limitations_corner_cases.no-requestId: 'No requestId-based stale-response protection. Redux Toolkit's createAsyncThunk ships with built-in requestId tracking... but handleResponseAsyncThunk does not propagate or check this'"
  - "fetchDataEntityDetails.md performance.known_performance_gaps.[1]: 'No in-flight de-dup or cache — rapid entity-id flips or group-mutation cycles can fire 4-6 concurrent dispatches'"
cross_references:
  - "TEST-GAP-417 (LSN-017 doubling compounds with rapid navigation)"
  - "F-001"
proposed_action: |-
  Vitest test dispatching fetchDataEntityDetails({ dataEntityId: 1 }), then dispatchFetchDataEntityDetails({ dataEntityId: 2 }), then dispatching the 1-result fulfilled action SECOND (out of order). Assert state.dataentities.byId[1] gets populated (current behaviour); assert byId[2] is preserved (no overwrite of unrelated id). Documents current behaviour; promotes to a regression-pin once requestId is opted-in via the wrapper.
