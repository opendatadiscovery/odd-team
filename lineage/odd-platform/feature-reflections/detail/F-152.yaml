        section: bugs_limitations_corner_cases
        cite: "TermController.java:237-249"
        note: "the write endpoints feeding this tab's data are also un-RBAC'd (DOC-033)."
    operator_visible_failure: |
      An auditor investigating "who linked term A to term B" (or who removed a
      link) has NO audit trail — the Activity Feed records term-to-DATA-ENTITY
      assignment changes but not term-to-TERM changes. Combined with the unguarded
      write surface, the term-to-term graph can be reshaped by any authenticated
