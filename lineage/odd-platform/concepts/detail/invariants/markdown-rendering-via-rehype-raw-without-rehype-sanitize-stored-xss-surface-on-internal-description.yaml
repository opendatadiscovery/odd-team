name: Markdown rendering via rehype-raw without rehype-sanitize → stored-XSS surface
  on internal_description
canonical_in_docs: false
canonical_candidate: true
description: Backend stores the description body verbatim (no Jsoup.clean, no Encode.html,
  no allowlist, no length cap). UI renders via @uiw/react-markdown-preview@4.2.2 which
  transitively pulls in rehype-raw@6.1.1 (parses raw HTML embedded inside Markdown
  into AST nodes). NO rehype-sanitize configured anywhere in the UI (grep -rln 'rehype-sanitize'
  returns 0). NO skipHtml prop set. Every authenticated reader of an entity (DATA_ENTITY_VIEW
  = effectively every catalog visitor) is downstream of the writer's payload. A future
  minor-version bump of any rendering library can widen the surface invisibly with
  no test catching the regression.
contributing_files:
