proposed_action: |-
  Performance-boundary test (use a marker — these tests run separately). (a) Pre-seed 10,000 alerts on entity X. (b) GET /api/dataentities/X/alerts?page=1&size=1000000. (c) Assert HTTP 200 (current contract — the request is accepted). (d) Measure response time and response body size; record as baseline. (e) Test comment 'LOCKS the unbounded-size contract as of 2026-05-19. When REFACTOR-NNN adds maximum: clamp, this test FLIPS to expect 400 (validation rejection) or response-truncation at the clamp value.' Secondary test: POST with `size=-1`, `page=0`, `size=0` exercises edge-case boundary values. Cross-pillar HIGH because the DoS-amp vector is reachable by any authenticated user (TEST-GAP-493 cross-owner read) AND by anonymous callers under DISABLED.
