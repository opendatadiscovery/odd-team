test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/processor/AlertNotificationUnconditionalBroadcastTest.java"
  name: "dispatcherFanOut_consultsNeitherOwnerNorSeverity_everyChannelGetsEveryAlert"
evidence:
  - |-
    NotificationsDispatcher.md says: 'Every alert goes to every configured channel. An operator wanting Critical to Slack, all to email cannot express that — no filter / predicate / config key for routing exists between the dispatcher and the senders.'
  - "AlertNotificationMessageProcessor.java:25-36 (loop iterates notificationSenders unconditionally)"
  - "AlertNotificationMessageTranslator.java:73-83 (owners populated but never used for routing)"
  - "Live doc WebFetch 2026-05-19 status 200: 'An alert dispatched to multiple channels is delivered to every channel that is enabled.'"
