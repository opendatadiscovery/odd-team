      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityDownstreamLineage.md
        section: security.known_security_gaps + bugs_limitations_corner_cases[DISABLED]
        cite: "DataEntityController.java:255-263 (no owner arg); DisabledAuthSecurityConfiguration.java:16"
        note: "No @PreAuthorize; DISABLED-mode widens reach to unauthenticated probes."
      - sidecar: "doc-understanding/data-lineage__microservices.md"
