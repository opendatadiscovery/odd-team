name: Partial Permission Gating — Edit Affordance Gated, Content Unconditional
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
- P-01
description: |-
  **NEW INVARIANT, batch 2026-05-19J — UI-side semantic surfaced across multiple
  components**. The platform's UI pattern is to gate MUTATION affordances (Edit
  buttons, Save buttons, mutation menu items) on resource-scoped permissions via
  `<WithPermissions permissionTo={Permission.X}>`, while leaving the rendered
  CONTENT unconditional. **The DataEntityDescription cluster is the canonical
  example**: `InternalDescriptionHeader.tsx:40-50` wraps the Edit/Add button in
  `<WithPermissions permissionTo={Permission.DATA_ENTITY_DESCRIPTION_UPDATE}>`;
  `InternalDescriptionPreview.tsx:32-40` wraps the empty-state "Add Description"
  button identically. The `<Markdown value={value} />` render at
  `InternalDescriptionPreview.tsx:21` runs unconditionally for ANY caller with
  `DATA_ENTITY_VIEW`. The description CONTENT (and any embedded HTML) reaches
  every reader's browser regardless of whether they can edit it. **DataEntityDetails
  follows the same pattern**: the component wraps the header in
  WithPermissionsProvider carrying 3 permissions
  (`DATA_ENTITY_INTERNAL_NAME_UPDATE`, `DATA_ENTITY_GROUP_UPDATE`,
  `DATA_ENTITY_STATUS_UPDATE`) for descendant mutation affordances, but the
  READ of the entity payload + the rendered tab content is unguarded. **The
  semantic IS the read-collaborative posture realised at the UI layer** — the
  partial-gating is INTENTIONAL (the platform deliberately ships cross-owner-readable
  per ADR-CANDIDATE-003). **Fragility**: the gating semantic is SUBTLE enough
  that a refactor "simplifying" the cluster (e.g. wrapping `OverviewDescription`
  in `<WithPermissions>`) would silently break LEGITIMATE READ ACCESS for
  non-editors — and would be undetectable by existing probes (which exercise
  authenticated-writer flows, not authenticated-reader-without-write flows). A
  reviewer reading the source easily mistakes the `WithPermissions` placement as
  "description gating" rather than "edit-button gating". **No UI-side signal**:
  the user does not see a "You don't have permission to edit this entity" banner;
  the edit affordances simply disappear. A user uncertain about why they can/can't
  edit cannot self-diagnose, and operators auditing a user's intent have no log
  trail.
contributing_files:
- DataEntityDetails.md
- DataEntityDescription.md
triangulation_count: 2
cross_batch: false
severity: MEDIUM
severity_dim: security
evidence:
- 'DataEntityDescription.md:concepts.invariants[Permission gating is partial —
  only the Edit affordance is gated, NEVER the rendered content; the description
  CONTENT (and any embedded HTML) reaches every reader''s browser regardless of
  whether they can edit it]'
- 'DataEntityDescription.md:bugs_limitations_corner_cases.[1] MEDIUM — Permission
  gating is PARTIAL; the gating semantic is subtle enough that a refactor
  "simplifying" the cluster by wrapping OverviewDescription in <WithPermissions>
  would silently break legitimate read access for non-editors'
- 'DataEntityDescription.md:implicit_adrs.[1] Description editing is a per-entity-scoped
  permission distinct from description VIEWING — the Edit affordance is gated,
  but the rendered content is universally visible'
- 'DataEntityDetails.md:concepts.entities[permission context — resourcePermissions
  for the DATA_ENTITY resource type, filtered against three permissions:
  DATA_ENTITY_INTERNAL_NAME_UPDATE, DATA_ENTITY_GROUP_UPDATE, DATA_ENTITY_STATUS_UPDATE]'
- 'DataEntityDetails.md:security.authorization_assertions[the component itself
  enforces no authorization; passes a 3-permission vector to WithPermissionsProvider
