  - odd-platform java repository reactive repository:ReactiveCollectorRepositoryImpl
  notes: |-
    Three new drift facets surface, all confirming or extending F-010's
    existing scope:
    (1) ACTIVITY TABLE MONOTONIC GROWTH CONFIRMED AT REPO TIER (HIGH,
