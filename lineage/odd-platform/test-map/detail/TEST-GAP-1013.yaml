proposed_action: |-
  Three-test wedge:
  (a) RED-pin the current behaviour: AppRoot.errorBoundary.test.tsx —
  mount <App /> with a child component that throws synchronously during
  render; assert the rendered DOM is empty (no <body>-level content).
  This is the regression-pin documenting the CURRENT state — every
  child throw blanks the entire UI.
  (b) GREEN target state: wrap <App> children in a global
  ErrorBoundary that catches getDerivedStateFromError and renders an
  AppErrorPage instance with showError=true and an "Unknown render
  error" message. Test that mount + throw produces the AppErrorPage
  fallback with toolbar STILL VISIBLE.
  (c) Per-dashboard isolation: DashboardErrorBoundary.test.tsx —
  wrap individual dashboard widgets (DataQualityDashboard, etc.) in
  their own ErrorBoundary so a single widget crash leaves the rest of
  the page interactive (the F-032 recommendation).
  The fix is two files added (one global, one per-widget HOC) plus a
  ~30-line ErrorBoundary class. This is the single highest-leverage
  robustness change in the SPA's shell.
