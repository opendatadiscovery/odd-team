mitigations_unimplemented:
- |-
  Document the audit-or-fail semantic on the activity-feed feature page
  + add a dedicated "Activity Feed reliability guarantees" section on
  the operator reference. Until documented, operators assuming
  best-effort audit will be surprised when a mutation surfaces 500 on
  a transient activity DB error.
- |-
  Add an integration test ActivityAspectIntegrationTest.testEmitFailureRollsBackWrappedMutation
  that injects failure on activityRepository.saveReturning inside the
  aspect's @ReactiveTransactional and asserts (a) the business
  mutation is rolled back, (b) the caller sees 500, (c) no activity
  row is persisted.
- |-
  Add an observability metric `activity_emit_failure_total{phase=
  context_capture|business_mutation|state_capture|persist}` so
  operators can detect emit-failure-driven rollbacks separately from
  business-mutation failures. Currently both surface as 500 with no
  way to distinguish.
- |-
  Consider refactor: decouple via @Async @TransactionalEventListener.
  Trade-off documented:
    - Pro: business mutations commit independently of audit; transient
      audit errors don't lose user changes
    - Pro: ingestion blast radius reduced (audit emit failure during
      ingestion no longer rolls back the whole batch)
    - Con: partial-state (mutation succeeded, audit didn't) becomes
      possible; forensic completeness suffers
    - Con: requires durable queueing / DLQ for failed emits
notes: |-
  NEW invariant captured in batch VAL-LSN-019-B. Surfaced by primary-source
  examination of ActivityServiceImpl + ActivityHandler combined with
  cross-file verification of AlertServiceImpl and
  ActivityIngestionRequestProcessor as the three caller paths.

  This is the OPERATOR-SURPRISING shape of the audit-trail feature.
  Most maintainers of audit-trail systems pick best-effort audit; ODD
  picks audit-or-fail. The choice has real operational implications
  (ingestion batch failures on activity-DB transients; user-facing
  500s on what should be successful business mutations) that the docs
  do not surface.

  Three cross-cutting connections:
    - Pairs with `activity-handler-concurrent-oldstate-capture-race`
      — the same TX boundary makes the race concrete (both racers
      committed pre-snapshot in their own TX before the conflict
      resolved)
    - Pairs with new operation
      `write-activity-event-snapshot-diff-emit` — describes the
      four-step pipeline this TX wraps
    - Pairs with `retention-claim-vs-code-drift-refactor-085-confirmed-from-two-angles`
      — both findings highlight discrepancies between operator
      mental-model of audit-trail behaviour and the code reality

  PRIMARY-SOURCE confidence: HIGH (line-by-line verification at three
  caller paths; no contradictions; the @ReactiveTransactional
  annotations are explicit at all three call sites).
