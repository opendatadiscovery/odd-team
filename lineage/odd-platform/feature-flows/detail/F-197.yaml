feature_name: |-
  Data Collaboration UI Tab — three-panel Slack-thread mirror anchored to a
  data entity. Surfaces F-038's backend chain (incoming-webhook + outbound
  Slack-message-sender + DB-backed thread store) as an operator-visible
  Discussion tab with infinite-scroll messages list, channel selector, and
  per-message thread drilldown.
