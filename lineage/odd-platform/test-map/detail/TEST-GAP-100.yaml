gap_id: TEST-GAP-100
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
surfaced_by:
- regenerateCollectorToken.md:bugs_limitations_corner_cases.[1] (severity HIGH)
- regenerateCollectorToken.md:security.known_security_gaps.[2] (severity HIGH)
behaviour: Token rotation is not audit-logged. No `@Slf4j` log at INFO/WARN/AUDIT
  on the regenerate path. The TOKEN row's `updated_by` column is the only forensic
  trail and is overwritten on each rotation — single-state, not append-only. A security
  incident review of 'who rotated token X 30 days ago' cannot answer 'who rotated
  it before that' from production data.
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/audit/CollectorTokenRotationAuditTest.java
  name: regenerateCollectorToken_persistsToAuditLogWithCallerAndTimestamp
evidence:
- 'regenerateCollectorToken.md says: ''Token-rotation operation is NOT audit-logged
  ... grep for log.(info|warn|debug|error) against CollectorController, CollectorServiceImpl,
  TokenGeneratorImpl, ReactiveTokenRepositoryImpl returned zero matches'''
- 'concepts.yaml:entities[Collector].security_aggregate.weaknesses.[3] verbatim: ''Token
  rotation not audit-logged (severity HIGH)'''
- concepts.yaml:entities[Collector Token].security_aggregate.weaknesses.[4] (same
  finding, second concept-level rediscovery)
cross_references:
