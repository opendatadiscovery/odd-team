proposed_action: |-
  Add `ReactiveActivityRepositoryImplDdlLockCollisionTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/reactive/` using Testcontainers + Postgres + a concurrency harness with `pg_locks` introspection. Three test methods:

  1. **`concurrentSelectDuringPartitionDrop_pinLockWaitLatency`** (HEADLINE):
     - Arrange: seed `activity` table with 3 past partitions; populate 1000 rows into the middle partition; mark the OLDEST partition as past + empty. Use a controllable barrier in the housekeeping job (via reflection / spied PartitionService).
     - Act:
       - Thread A (SELECT): start `repo.findAllActivities(beginDate=spanningOldestPartition, endDate=NOW, size=1000)` — this requires ACCESS SHARE on the empty past partition
       - Thread B (DROP): the housekeeping cycle's `dropPartition` tries to acquire ACCESS EXCLUSIVE on the same partition
     - Assert: query `pg_locks` view DURING the interleaved execution; assert that Thread B's session shows a `granted=false` lock-wait entry whose `mode=AccessExclusiveLock` is queued behind Thread A's `granted=true` `mode=AccessShareLock`. PIN the lock-collision mechanic.
     - Assert: Thread B completes only AFTER Thread A completes; measure latency Δ = (Thread B completion time) − (Thread B start time) ≥ (Thread A duration). PIN the stall measurement.

  2. **`concurrentInsertDuringPartitionDrop_pinLockWaitLatency`**:
     - Same shape with `repo.saveReturning(pojo)` instead of SELECT; ROW EXCLUSIVE vs ACCESS EXCLUSIVE. The INSERT blocks the DROP; if the INSERT commits first, the DROP proceeds (potentially dropping a now-non-empty partition per TEST-GAP-870).

  3. **`partitionDropNoConcurrentLoad_completesWithinMillis_pinHappyPath`** (CONTROL):
     - Arrange: same empty past partition; no concurrent traffic.
     - Act: run the housekeeping cycle.
     - Assert: cycle completes in < 100ms; no lock-wait entries in pg_locks. Pins the happy-path performance.

  After P-022 measures the empirical timing on production-sized partitions, refine the test's latency thresholds. Cross-pair with REFACTOR-NNN to introduce a `NOWAIT` LOCK strategy OR schedule-windowing fix. Cross-pair with DOC-NNN to surface the housekeeping latency impact.
