proposed_action: 'Parameterised test over (`provider: google` / `provider: Goggle`
  / `provider: okta`): assert (a) all three bind cleanly to the `provider` field,
  (b) only `google` reaches `GoogleUserHandler.shouldHandle`. Locks the silent-routing
  AS-IS and converts a future enum-tightening refactor into a deliberate test update.'
