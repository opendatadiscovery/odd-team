behaviour: |-
  **MEDIUM — `QueryExampleController` has ZERO controller-tier HTTP test coverage across all 13 endpoints — the 3-of-13 security gating asymmetry, the spec/code response-code drift, the broken-pagination-by-design, and the search-session-via-UUID-only-no-caller-binding contracts are ALL unverified at the HTTP boundary.** Primary-source confirmed in the batch-V QueryExampleController sidecar:

  **The 13 untested endpoints**:
  - 4 CRUD: `createQueryExamples`, `updateQueryExample`, `deleteQueryExample`, `getQueryExampleDetails`
  - 2 read-by-relationship: `getQueryExampleByDatasetId`, `getQueryExampleByTermId`
  - 1 list: `getQueryExampleList`
  - 5 search: `queryExamplesSearch`, `getQueryExampleSearchFacetList`, `getQueryExampleSearchResults`, `updateQueryExampleSearchFacetList`, `getQueryExampleSearchSuggestions`
  - 1 by-term: included in read-by-relationship above

  **The 3 specific contracts left untested** (per the sidecar `tests_coverage_semantic.gaps`):
  - Status-code shape: `createQueryExamples` + `updateQueryExample` return 200 (controller) but OpenAPI declares 201 (spec).
  - Security-rule gating: 3 of 13 endpoints have SecurityRules (CREATE, UPDATE, DELETE); the other 10 fall through to `authenticated()`. The asymmetry is INTENTIONAL per `system-mission.md:267` read-collaborative posture, but undocumented.
  - Search-session-ownership: a search session created by user A is reachable by user B if B obtains the searchId UUID (URL leak, screenshot). No explicit caller-id binding.

  **Existing partial coverage**: `QueryExampleServiceTest` covers `createQueryExample`, `getQueryExampleDetails`, `deleteQueryExample`, `createQueryExampleToDatasetRelationship` (a method NOT exposed by this controller — that endpoint lives on `DataEntityController.createQueryExampleToDatasetRelationshipNew`), and a `BadUserRequestException` duplicate-relation path — but the HTTP wiring is untested.

  **Sister-controller pattern**: this gap is part of the systemic HTTP-floor gap across multiple controllers — TEST-GAP-001 (AlertController), TEST-GAP-016 (DataEntityController 37-of-40), TEST-GAP-717 (DataQualityController), etc. The pattern is consistent: thin proxy controllers implementing OpenAPI-generated interfaces with NO direct HTTP test surface.

  **Why MEDIUM not LOW**: the 3-of-13 security gating asymmetry is the load-bearing finding — a SecurityConstants regression (e.g. moving the create-rule line) would silently expose the createQueryExamples endpoint to any authenticated user. The asymmetry is intentional today but invisibly fragile to refactors. Cross-pillar P-02 + P-11.

  **Test gap shape**: `@WebFluxTest(QueryExampleController.class)` driving the 13 endpoints' HTTP contract: status codes, security-rule gating, content-type negotiation, request-body validation, search-session-ownership-via-UUID.
