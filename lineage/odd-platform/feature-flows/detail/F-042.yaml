amplification_factor: |-
  0 for healthy pages (the widget is invisible). 1 page-render +
  0..1 redirect-issue per error event (the user may click Home Page).
  Cardinality is bounded by terminal-state semantics — once a fetch has
  rejected, the user remains on the error pane until they navigate away.
amplification_note: |-
  AppErrorPage itself is a cheap render. The blast radius is structural —
  the absence of a global error boundary OR a path='*' catch-all means
  fall-through errors produce blank pages (no widget to render). The
  amplification is in the SILENCE: an uncaught React render error in any
  route subtree unmounts the entire SPA to the closest boundary; with no
  boundaries, it unmounts the whole App, leaving the user with a blank page
  and no recourse short of a hard reload.
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render — the error pane (viewport-clearing grid with status code +
    statusText heading + Home-Page CTA) renders ONLY when a parent's async
    thunk has rejected AND the parent component is mounted on the matched
    route. Returns null otherwise. The widget contributes no DOM and no
    whitespace when there is no error. Cardinality: 0 for healthy pages,
    1 per error event (terminal state until route change). For the
    fall-through case (bare URLs not matched by any <Route>), the widget
    is NOT rendered — the page-render is ZERO (the load-bearing structural
    drift facet).
  evidence: |-
    AppErrorPage.tsx:20-37 — the conditional render. 23 caller files
    enumerated in upstream_callers (the canonical per-page-component-owned
    pattern). App.tsx:59-89 — the route registry that does NOT mount this
    widget on `path='*'` (the fall-through case produces a blank page).
  cardinality_per_call: 0 for healthy pages, 1 per error event
observed_vs_expected:
  facets:
    - facet_id: bare_url_fall_through_produces_blank_page_no_route_path_star_catch_all
      drift_class: ui_router_no_match_renders_nothing_no_404_widget
      severity: MEDIUM
      observed: |-
        App.tsx:59-89 declares 11 <Route> entries; NO `<Route path='*'>`
        catch-all. React-Router-DOM v6's NO-MATCH behaviour is to render
        nothing inside <Routes>. The AppToolbar (line 56) still renders,
        but the route-body area is empty. Verified by Grep
        `path=['\"]\\*['\"]|NotFound|Page404|404Page|NoMatch` over
        odd-platform-ui/src returning ZERO matches.
      expected: |-
        Either add a `<Route path='*' element={<AppErrorPage showError
        error={{status:404, statusText:'Page Not Found', url:'', message:''}}
        />} />` to App.tsx:89 (the 5-line fix), OR explicitly document
        bare-URL fall-through as undefined behaviour. Operator-conventional
        default is the former.
      operator_visible_consequence: |-
        Hitting bare /terms, bare /master-data, or any unknown URL produces
        a blank page below the toolbar. The user sees a working chrome
        with no content and no error message; the only signal is the
        address bar. Cross-batch finding with ZH+ZI bare-URL observations.
    - facet_id: no_react_error_boundary_anywhere_in_spa_uncaught_throw_unmounts_entire_app
      drift_class: ui_no_error_boundary_uncaught_throw_unmounts_app
      severity: HIGH
      observed: |-
        Grep `ErrorBoundary|componentDidCatch|getDerivedStateFromError`
        over odd-platform-ui/src returns ZERO matches. The closest thing
        is AppSuspenseWrapper.tsx:1-23 (Suspense only, no error handling).
        AppErrorPage.tsx:13-38 is a functional component with no class,
        no error-boundary lifecycle methods.
      expected: |-
        Every production React app wraps its <Routes> in at least one
        error boundary. Operator-conventional defaults: top-level
        boundary around the SPA root that renders AppErrorPage on
        synchronous render-time throws; per-route boundaries for
        granular recovery.
      operator_visible_consequence: |-
        Any synchronous render error in any route subtree (undefined
        access, type error, thrown component) unmounts the entire
        component tree to the closest boundary — none exists — so React 18
        unmounts the whole App, leaving the user with a blank page.
        Lazy-chunk-load failures (React.lazy at App.tsx:30-41) surface
        as uncaught promise rejections in dev + indefinitely-pending
        Suspense fallback in production. AppErrorPage CANNOT catch any
        of these because it is a sibling within page subtrees, not an
        ancestor wrapping the Routes.
    - facet_id: error_url_and_error_message_fields_silently_dropped_information_disclosure_boundary
      drift_class: ui_information_disclosure_boundary_undocumented_in_code
      severity: MEDIUM
      observed: |-
        AppErrorPage.tsx:24-29 accesses ONLY `error?.status` and
        `error?.statusText`. The `error.url` (failing API URL) and
        `error.message` (backend response body) fields populated upstream
        by `getErrorResponse` (errorHandling.tsx:12-26) are NEVER
        rendered. The 2-of-4-field display is the load-bearing safety
        property of the widget. But there is NO JSDoc, NO comment in
        AppErrorPage.tsx defending the omission, and NO test pinning the
        contract.
      expected: |-
        Either codify the contract with a JSDoc + a regression test (the
        test class-security uncovered behaviour), OR add the fields with
        operator-configurable redaction. The current state is "implicit-
        but-undocumented guard" — a future maintainer "improving" the
        page by adding the URL or the backend message would silently leak.
      operator_visible_consequence: |-
        Today: the boundary holds, no leak observed. Tomorrow: a PR
        adding `<Typography>{error.message}</Typography>` to surface the
        backend's hint to operators would land silently — no test
        catches it, no review checklist names it.
    - facet_id: react_query_error_cast_to_redux_errorstate_undefined_behaviour_at_runtime
      drift_class: type_cast_hides_react_query_vs_redux_errorstate_mismatch
      severity: LOW
      observed: |-
        Integration.tsx:33 passes a `useIntegration({integrationId})`
        react-query error to AppErrorPage — which is NOT a redux
        ErrorState; the cast works at compile time but produces undefined
        behaviour at runtime if the react-query error shape doesn't
        include status/statusText. IntegrationPreviewList.tsx:70 does
        the same: `error={error as ErrorState}` (explicit cast).
        AppErrorPage.tsx:10 declares `error?: ErrorState` — the typed
        parameter.
      expected: |-
        Either AppErrorPage accepts a discriminated union (`ErrorState |
        QueryError`) with a type-narrowing branch, or the two react-query
        callers map their error to ErrorState explicitly.
      operator_visible_consequence: |-
        Today: works because react-query happens to populate status /
        statusText in practice. Tomorrow: a react-query version upgrade
        or a different fetch wrapper could change the shape — the
        AppErrorPage would render an empty status code with "Unknown
        Error" title for integration-page failures.
    - facet_id: unknown_error_fallback_when_showError_passed_without_error_prop
      drift_class: ui_widget_degraded_display_on_partial_caller_inputs
      severity: LOW
      observed: |-
        8 caller files pass `showError={isError}` with NO `error` prop
        (OwnerAssociationsActive.tsx:99, OwnerAssociationsNew.tsx:95,
        OwnerAssociationsResolved.tsx:103). The widget's render at line
        24-26 produces `{error?.status}` — empty when error undefined.
        Line 29 falls back to `t('Unknown Error')`. The visual outcome:
        a centered grid with an empty 72px-tall left column and a
        centered 'Unknown Error' heading.
      expected: |-
        Either a lint rule that flags `<AppErrorPage showError>` without
        `error`, or a default `error={{status:0, statusText:''}}`
        that produces a cleaner fallback display.
      operator_visible_consequence: |-
        Operator sees a degraded display — 'Unknown Error' with no
        status code, no context. Strictly worse than the normal pane.
    - facet_id: no_retry_cta_only_home_page_navigation
      drift_class: ui_error_widget_no_retry_only_home_page_button
      severity: LOW
      observed: |-
        AppErrorPage.tsx:8-13 — no `onRetry` prop. AppErrorPage.tsx:31-32
        — only 'Return to the Home Page' button (hard-coded `to='/'`).
        Users hitting a transient backend hiccup must either click
        Home Page + navigate back manually, OR press browser refresh.
      expected: |-
        A 'Try Again' CTA that re-fires the parent's fetching thunk.
        Operator-conventional default for transient-failure UX.
      operator_visible_consequence: |-
        Users encounter a permanent-looking error UI for transient
        failures (network blip, brief 502). The Home Page navigation
        loses any in-progress state (form data, filter selections).
    - facet_id: toast_side_channel_carries_message_for_6s_then_lost
      drift_class: ui_error_message_short_side_channel_then_lost
      severity: LOW
      observed: |-
        errorHandling.tsx:48-68 emits a toast carrying the backend
        `message`; the toast duration is App.tsx:55's 6000ms global
        default. If the user blinks or a second toast dismisses the
        first, the only place that ever carried the backend's hint is
        gone. AppErrorPage does NOT recapitulate the message.
      expected: |-
        Either the message persists on the page (in a less-prominent
        affordance — collapsible "Details" disclosure), or the toast
        duration scales with message length.
      operator_visible_consequence: |-
        Asymmetry — message on screen for 6s, status code on screen
        indefinitely. Users see "Forbidden" or "Not Found" but cannot
        recover the backend's specific hint after the toast vanishes.
