feature_name: Popular entities ranking — exclude-from-search filter consistency
discovered_from_entry_point: rest:GET /api/dataentities/popular
description: 'The Popular ranking surface (Catalog Overview''s "Popular" strip) ranks

  entities by view_count DESC. 9 other list-shape sites in the codebase

  apply the data_entity.exclude_from_search filter to hide internal/staging

  entities; the Popular CTE does NOT. An entity marked hidden-from-search

  with high view_count surfaces on the platform''s home page.

  Batch-H primary-source confirmation: the inconsistency is wider than F-003

  initially surfaced. `cteDataEntitySelect` (the CTE-builder helper consumed

  by 9 list-shape methods — `listPopular`, `listByOwner`, `listByTerm`,

  `getDEGExperimentRuns`, `getDimensions(id|oddrns|ids)`, `getDetails(id)`,

  `getQuerySuggestions`) ALL omit the EXCLUDE_FROM_SEARCH predicate. Only

  `findByState` (via `JooqFTSHelper.resultFacetStateConditions`) and the

  `getDataEntityDefaultConditions` helper (used by count/statistics paths)

  apply the filter. The popular tab is therefore one of MANY surfaces

  affected — operators marking `exclude_from_search=true` cannot reliably

  hide an entity from any of the 9 affected list shapes.

  '
contributing_nodes:
- odd-platform java DataEntityController controller-method:getPopular
