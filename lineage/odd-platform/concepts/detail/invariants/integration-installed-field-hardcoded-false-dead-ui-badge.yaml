notes: |-
  NEW invariant captured in batch 2026-05-25-ZD. Single
  highest-leverage UX/contract mismatch on the Integration Wizard
  surface — the field is declared, the UI uses it, but the value
  is structurally dead. The fix is small (path A or B above) but
  the absence of either has shipped silently for the lifetime of
  the feature.

  Refactoring-scope candidate: REFACTOR-NNN for either (A) or (B).
  Path (A) aligns to reality; path (B) delivers the promised UX.
  Maintainer's call.
