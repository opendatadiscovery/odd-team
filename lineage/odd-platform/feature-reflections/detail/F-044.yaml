- id: H-008
  hypothesis: |-
    When an operator RESTORES a soft-deleted entity (DELETED → STABLE), the
    status_updated_at clock resets cleanly so that, if later re-deleted, the 30-day
    window starts fresh from the new deletion.
  derivation: |-
    Negative-space (restore is an explicitly supported transition per the live doc
    and updateStatus.md; an operator expects the lifecycle clock to behave
    consistently across restore).
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The restore path (DELETED → STABLE/DRAFT/DEPRECATED/UNASSIGNED) routes
      through the SAME applyStatus mapper (per updateStatus.md:understanding —
      restore-on-undelete is handled in changeStatusForDataEntities, which calls
      applyStatus). The applyStatus ordering bug means status_updated_at is NEVER
      written on restore either. So: an entity restored from DELETED keeps whatever
      status_updated_at it had (NULL, from the original broken delete). There is no
      clean clock at all — the column is uniformly NULL across the entire lifecycle.
      This is a NEW facet not separately enumerated in the F-044 drift_class_summary
      (restore_from_deleted_also_leaves_status_updated_at_null). The PLT-027 pin
      tests the mapper at the structural level, so it implicitly covers the restore
      direction too; but no test asserts the CORRECT restore-clock behaviour, and
      updateStatus.md:tests_coverage_semantic lists the restore path as uncovered.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: understanding + tests_coverage_semantic.uncovered_behaviours
        cite: "DataEntityInternalStateServiceImpl.java:73-98 (restore branch routes through applyStatus); restore path is explicitly UNCOVERED by tests"
        note: "restore is a status transition → inherits the same mapper bug; untested"
      - sidecar: source_read_for_validation
        section: DataEntityStatusKnownBugTest (covers the mapper for any transition)
        cite: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/mapper/DataEntityStatusKnownBugTest.java:38-54"
        note: "the guard is unconditionally false for ANY transition, restore included"
    operator_visible_failure: |-
      Because status_updated_at is uniformly NULL, the column carries NO usable
      lifecycle timestamp for any entity touched by this feature — not just for
      deletes. Any future feature that reasons about "when did this entity's status
      last change?" (audit, staleness, SLA) reads NULL. The restore case makes
      clear the bug is not "deletes don't get reaped" but "the status-change
      timestamp is dead platform-wide." Severity MEDIUM (no immediate data-loss on
      restore itself, but a load-bearing column is silently always-NULL).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional   # flip-target: assert status_updated_at IS set on a restore (DELETED→STABLE) and on a non-delete transition

- id: H-009
  hypothesis: |-
    An operator can see, ahead of time, which entities are scheduled to auto-flip
    to DELETED in the near future (e.g. a "scheduled transitions" view or a
    preview), so a mistaken switch-time can be caught before the reaper acts.
  derivation: |-
    Negative-space + senior-product-owner UX question ("can the user understand /
    control this from what is on screen?") — a destructive scheduled action with
    no preview is a UX gap.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      There is no GET endpoint exposing the set of entities with a pending
      status_switch_time (the F-044 chain + the DataEntityController surface have no
      scheduled-transitions / upcoming-flip read; getPojosForStatusSwitch is an
      internal repository method called only by the job, not surfaced via any
      controller — ReactiveDataEntityRepositoryImpl.md:upstream_callers lists only
      DataEntityStatusSwitchJob). Operators must inspect entities one-by-one on
      their detail pages to learn what will auto-delete. There is no batch preview,
      no dry-run, no "what flips in the next 24h" surface.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveDataEntityRepositoryImpl.md
        section: upstream_callers (getPojosForStatusSwitch)
        cite: "ReactiveDataEntityRepositoryImpl.java:256 — upstream caller is DataEntityStatusSwitchJob ONLY"
        note: "the only reader of the elapsed-switch-time set is the internal job; nothing exposes it to operators"
    operator_visible_failure: |-
      An operator who fat-fingers a status_switch_time (e.g. picks the wrong date)
      has no surface to catch it before the 10-minute reaper acts and soft-deletes
      the entity (with its cascade). Recovery requires manually restoring each
      entity. For a large catalog there is no way to audit "what is scheduled to
      disappear." This is a UX / observability gap, not a data-correctness bug —
      severity LOW. NOTE: this finding is dampened by H-002 — because the
      hard-delete never fires, a mistaken flip is currently recoverable (the row
      persists forever as DELETED); once H-002 is fixed, the absence of a preview
