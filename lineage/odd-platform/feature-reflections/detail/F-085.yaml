- id: H-002
  hypothesis: |-
    When an anonymous, unauthenticated caller hits GET /api/identity/whoami on a
    deployment running auth.type=DISABLED, they receive 200 OK and a synthetic `admin`
    identity carrying EVERY Permission the platform defines — granting full read AND
    mutation reach to any caller on the network.
  derivation: |-
    DisabledAuthSecurityConfiguration wires permitAll + no security context; the
    controller's switchIfEmpty returns dummyOwner() with Permission.values(). Endpoint-shape
    + negative-space (default-insecure) seed. Pillar P-09 "pick a UI auth mode" action.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      This is the documented, intended behaviour of DISABLED mode — but it CONTRADICTS the
      reasonable user/operator expectation that an "identity" endpoint requires an identity.
      DisabledAuthSecurityConfiguration.java:11-19 builds a SecurityWebFilterChain whose only
      rule is `.anyExchange().permitAll()`, so no principal is ever established; the
      controller's `.switchIfEmpty(Mono.just(new ResponseEntity<>(dummyOwner(), OK)))`
      (IdentityController.java:27) fires, and dummyOwner() (lines 30-33) returns
      `new Identity().username("admin").permissions(Arrays.asList(Permission.values()))`.
      Permission.values() is the FULL enum (~70+ values per components.yaml), so the grant
      is maximal and DYNAMIC — any Permission added later is auto-granted with no controller
      change. Already tracked: PLT-072 Defect 1 (F-085a).
    evidence:
      - source_read_for_validation: true
        cite: "odd-platform-api/.../config/DisabledAuthSecurityConfiguration.java:13-17"
        note: ".anyExchange().permitAll(); no ServerSecurityContextRepository wired"
      - source_read_for_validation: true
        cite: "odd-platform-api/.../controller/IdentityController.java:27-33"
        note: "switchIfEmpty → dummyOwner() with Permission.values()"
    operator_visible_failure: |-
      (1) Any caller on the network reaching a DISABLED deployment is admin — every
      state-changing endpoint (Owner/Policy/Role mutation, Lookup-table data writes,
      attachment uploads, term writes) accepts their requests with no auth; data integrity
      depends entirely on operator-side network isolation. (2) Dynamic blast radius: a
      future release that adds a new sensitive Permission silently widens the anonymous
      grant — the maintainer adding the Permission gets no signal that it just entered the
      default-insecure surface. (3) A deployment that accidentally inherits DISABLED from a
      template (the application.yml default) has ZERO defence and no fail-fast warning.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # PLT-072 fix has no regression guard yet

