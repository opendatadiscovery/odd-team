proposed_action: Add Testcontainers-Postgres test driving two replicas; assert only
  one acquires the advisory lock and drains the queue. Pair with a retry-budget test
  that asserts an Exception is retried `sending-messages-retry-count` times with a
  1-second sleep, then `markMessageAsFailed`.
