  - "CollectorsList.md says (bugs_limitations_corner_cases.[1]): 'The Add collector button + Edit / Delete / Regenerate buttons are hidden under auth.type=DISABLED because /api/identity returns empty permissions, but the underlying REST endpoints accept anonymous mutations regardless (DisabledAuthSecurityConfiguration bypasses all SECURITY_RULES). Operators clicking around the UI on a DISABLED deployment will see a READ-ONLY surface and may infer this is locked down; an attacker bypassing the UI with curl POST /api/collectors succeeds with no auth.'"
  - "CollectorsList.md says (coherence_check): 'strengthens: REFACTOR-185 (now 18→19 SIDECAR via the COLLECTOR_* UI-side permission family observation); ADR-CANDIDATE-140 (the asymmetric ingestion postures finding gains a UI-axis source — the UI hands out one credential that two different filters consume).'"
  - "CollectorsList.md says (back_links.refactoring-scope): 'REFACTOR-185 (DISABLED-mode bypass) — this sidecar adds the 19th supporting sidecar to the catalog's strongest finding. The compound surface under default auth.type=DISABLED: anyone on the network can POST /api/collectors (no UI signal), copy the response token, and (per ADR-CANDIDATE-141) POST /ingestion/datasources with that token to bootstrap a hostile collector identity — the DISABLED-mode bypass extends through the ENTIRE collector boot-of-self chain.'"
