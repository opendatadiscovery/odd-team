proposed_action: |-
  Testcontainers test. (a) Pre-seed tags ["postgres", "PII"]. (b) listByNames(["Postgres", "postgres"]) → returns [{name:"postgres"}] only (case-sensitive). (c) Call TagServiceImpl.getOrCreateTagsByName(["Postgres"]) → mints NEW row "Postgres" with different id. (d) Assert directory now contains 3 rows: "postgres", "PII", "Postgres". (e) GET /api/tags/popular returns both "postgres" and "Postgres" simultaneously to UI. Test pins this UX defect.
