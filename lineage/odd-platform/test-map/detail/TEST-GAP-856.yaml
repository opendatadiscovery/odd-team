proposed_action: |-
  Add `TagControllerLSN019Test` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` using `WebTestClient` against a full `@SpringBootTest` with Testcontainers Postgres. Four test methods:

  1. **`getPopularTagList_directoryExceedsSize_equalUsageCounts_returnsOldestSizeByTagIdAscNotMostPopular_pinsLSN019DriftAtHttpBoundary`** (HEADLINE):
     - Arrange: via repository test fixture, seed 35 tags 'http-tag-001..http-tag-035' with serial IDs. For each tag, insert a single `tag_to_data_entity` row → every tag has usedCount=1.
     - Act: `webTestClient.get().uri("/api/tags?page=1&size=30").exchange()`.
     - Assert: HTTP 200; response body `TagsResponse.items` has exactly 30 elements. Map items to `id` field; assert IDs are exactly `[1, 2, ..., 30]` in ascending order. PIN the LSN-019 drift at the HTTP boundary.

  2. **`getPopularTagList_directoryExceedsSize_unevenUsageCounts_returnsOldestSizeReorderedByCountDesc_pinsInnerSelectionOuterSortAtHttp`**:
     - Arrange: 35 tags. OLDEST 5 have usedCount=1; middle 25 have usedCount=10; YOUNGEST 5 (IDs 31-35) have usedCount=100.
     - Act: `webTestClient.get().uri("/api/tags?page=1&size=30").exchange()`.
     - Assert: response contains IDs 1..30 (NOT 31..35); WITHIN the response, items are ordered by usedCount DESC. PIN both the inner ID-ASC selection AND the outer count-DESC sort within the page at the HTTP layer.

  3. **`getPopularTagList_userWithoutTagPermissions_returns200_pinsOpenReadPostureFromLSN019`**:
     - Arrange: 35 tags as in #1. Authenticate as a user with NO `TAG_*` permissions.
     - Act: same GET request.
     - Assert: HTTP 200 (NOT 403); response body returns the same LSN-019-affected oldest-30. PIN the cross-cutting open-read posture compounded with the LSN-019 drift (sister to TEST-GAP-763).

  4. **`openApiSpec_declaresSortedByPopularity_butControllerReturnsSortedByIdAsc_documentsSpecVsCodeDrift`**:
     - Parse `openapi.yaml`; locate `/api/tags` GET operation; assert description contains the phrase "sorted by popularity" (the spec-side promise that the code does NOT keep).
     - Cross-reference assertion: this is a documentation-test that the spec disagrees with the code. PIN the spec-vs-code drift as a regression target — when REFACTOR-NNN lands, EITHER the spec changes OR the code changes; this test forces the maintainer to do BOTH.

  After landing the test: pair with REFACTOR-NNN (same as TEST-GAP-855 — push ORDER BY count INSIDE the paginate window, OR update spec + name + UI label to match actual semantics). When the fix lands, tests #1, #2 INVERT (assert "youngest 5 with count=100 plus oldest 25 with count=10" or similar); test #4 INVERTS (assert the spec description matches the code).
