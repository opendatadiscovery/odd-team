    collapses into a drawer/hamburger or reflows — so the tab labels stay legible
    and the content pane stays usable.
  derivation: |-
    Senior-PO UX seed (Rule 9: "how does it behave across device types?"). The
    feature-flow facet management_section_uses_fixed_3_9_grid_no_responsive_breakpoint
    flags a fixed xs=3/xs=9 grid; the pillar serves a platform-operator audience who
    may work split-pane.
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |-
      Management.tsx:13-19 uses <S.Container container wrap='nowrap'> with a fixed
      xs=3 sidebar and xs=9 content — no md=/lg= responsive variant and no
      hamburger/collapse. ManagementTabs renders the strip vertically (AppTabs
      orientation='vertical' type='menu', ManagementTabs.tsx:57-62). On a narrow
      viewport the 3-column sidebar crushes the tab labels and the 9-column content
      pane is too narrow for the dense Datasources/Collectors/Policies rows. There is
      no breakpoint at which the layout reflows. The live /features/management doc is
      SILENT on responsive behaviour (WebFetched 2026-06-03 — "No discussion of
      responsive design, mobile compatibility, or narrow viewport behaviour appears
      in the documentation"), so it is neither adaptive nor documented as
      desktop-only.
