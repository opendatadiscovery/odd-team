name: Traverse Lineage Graph (recursive-CTE)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
- P-05
description: |-
  `GET /api/dataentities/{data_entity_id}/lineage/downstream` (sibling `/upstream`)
  — NO SECURITY_RULES entry, falls through to `.authenticated()`. Three-line
  delegation to `LineageService.getLineage(dataEntityId, lineageDepth, expandedEntityIds,
  LineageStreamKind.DOWNSTREAM)`. Service issues a single Postgres `WITH RECURSIVE`
  CTE walking `lineage` table rows from the root entity's `oddrn` for `depth` hops
  (`ReactiveLineageRepositoryImpl.lineageCte`); UNIONed with a depth-1 fan-out
  around any IDs in `expandedEntityIds`; merged + distinct; per-oddrn metadata
  fetch; children-count / parents-count maps; assemble + map to `DataEntityLineage`
  graph DTO. Two client-driven inputs: `lineage_depth` (recursion depth bound —
  `@Min(1)`, no `@Max`) + `expandedEntityIds` (depth-1 fan-out around selected
  nodes for UI progressive expansion). No streaming variant; full graph is
  `.collectList()`-materialised in heap before serialisation. No cycle guard in
  the recursion (only outer `selectDistinct`). **Batch H — SQL PRIMARY-SOURCE
  CONFIRMATION**: the CTE (lineageCte at lines 150-176) has seed = edges touching
  the root oddrn set; recursive step = JOIN cte on direction-appropriate equality,
  depth+1, `tDepth < lineageDepth` AND not deleted. Soft-delete filter
  `IS_DELETED.isFalse()` at both seed (line 167) and recursive step (line 174).
  Outer `selectDistinct` deduplicates the FINAL projection but does NOT prune
  intermediate CTE rows. The depth bound is the SOLE termination mechanism.
  **Batch J — UI TRAVERSAL OPERATION END-TO-END**: the UI caller is the
  `<Lineage />` component family at `DataEntityDetails/Lineage/`. The dispatch
  shell (`Lineage.tsx:12-25`) routes between DEGLineage (for Data Entity Groups)
  and HierarchyLineage (for all other entity classes). `HierarchyLineage` issues
  two sequential thunks: `fetchDataEntityDownstreamLineage` then on `.then()`
  resolution `fetchDataEntityUpstreamLineage` (then optional
  expandEntitiesFromDownstreamGroup + expandEntitiesFromUpstreamGroup). The UI
  ALWAYS sends `lineageDepth=d` (defaultLineageQuery.d=1 at constants.ts:77) —
  the null-lineage_depth NPE is unreachable from the UI but the default of 1
  gives an artificially shallow first impression. LoadMore expansion uses
  `lineageDepth: 1` (depth-1 fan-out around clicked node); slice MERGES new
  nodes/edges into local state monotonically with no collapse affordance. Click-through
  on a node title navigates to that node's own Lineage tab with `d: node.depth
  || 1` — clicking deep into a graph and navigating opens a NEW view with
  d=clicked-node's-depth (compounds REFACTOR-202 cost). The UI uses the NEGATIVE
  case of the anchor-set defence-in-depth pattern: fetches via
  `/api/dataentities/{id}/lineage/{downstream|upstream}`, NOT the owner-scoped
  `/my` variant — the user-observable consequence of REFACTOR-203 is realised
  at the canvas.
