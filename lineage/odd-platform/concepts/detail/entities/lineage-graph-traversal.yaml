name: Lineage Graph Traversal
canonical_in_docs: false
canonical_candidate: true
description: '**NEW CONCEPT, batch 2026-05-12F** — the platform''s lineage-graph read
  interface. `GET /api/dataentities/{id}/lineage/downstream` (sibling `/upstream`)
  returns the FULL reachable lineage subgraph from a rooted data entity, walked via
  a single Postgres `WITH RECURSIVE` CTE (`ReactiveLineageRepositoryImpl.java:122-176`).
  Two client-driven inputs control the traversal: `lineage_depth` (recursion depth
  bound) + `expandedEntityIds` (depth-1 fan-out around selected nodes for UI progressive
  expansion). Edges are persisted as `LineagePojo` rows in the `lineage` table (parent_oddrn
  ↔ child_oddrn ↔ establisher_oddrn directed-edge rows with an is_deleted soft-delete
  flag). Response is a `DataEntityLineage` graph DTO (root + downstream + upstream
  + nodes + edges + children-count/parents-count maps). **Batch H adds the SQL primary-source
  persistence layer**: 177-line repository with 11 public methods + 1 private CTE-assembly
  helper. The CTE is a hand-written `WITH RECURSIVE` (lineageCte at lines 150-176)
  walking from a root oddrn set for at most `lineageDepth.getDepth()` hops in the
  chosen direction (DOWNSTREAM follows parent→child, UPSTREAM follows child→parent),
  filtering soft-deleted edges in both seed and recursive step. The depth bound is
  the **only** recursion terminator — no visited-set guard, no Postgres WITH ... CYCLE
  clause, no upper cap on the depth value. Soft-delete is canonical: every read filters
  `IS_DELETED.isFalse()` (7 sites); only hard-delete path is ingestion''s rewrite-by-establisher.
  The `lineage` table has NO owner column (V0_0_2 + V0_0_17 + V0_0_79 confirmed) —
  owner-scoping at the data-entity level cannot be applied at the lineage table directly;
  the batch-G anchor-set pattern at DataEntityRelationsServiceImpl.java:34 (passing
  `LineageDepth.empty()`) is the ONLY caller that applies owner-scoping at the seed
  set, and even that is anchor-set defence-in-depth, NOT JOIN-side owner filter. main-concepts.md
  names `Data Lineage` as a Data Governance pillar (`### Data Lineage`) but does NOT
  name the API surface, the recursion-bound mechanism, the dual-input expansion model,
  or the cross-owner enumeration semantics. The closest doc anchor is `/features/data-lineage`
  (verified 200, 2026-05-12) which describes lineage as a discoverable graph and refers
  readers to `/developer-guides/api-reference/lineage` (also 200) for API details.
  **The API-reference page contains TWO doc-drift findings** (per getDataEntityDownstreamLineage.md:docs_link_semantic.doc_drift_findings):
  (1) claims `lineage_depth` defaults to platform''s default when unset — UNIMPLEMENTED
  (null-Integer NPE on the service boundary; batch H confirms at SQL: value flows
  directly into `tDepth.lessThan(lineageDepth.getDepth())` with no defensive Math.min);
  (2) describes `expanded_entity_ids` as ''IDs of Data Entity Group entities'' — code
  accepts ANY data-entity IDs (parameter is `List<Long>` with no group-class filter).
  Sibling features replicate the lineage pattern: DataEntityGroup lineage (`/api/dataentitygroups/{id}/lineage`)
  accepts no depth parameter at all (openapi.yaml:2418-2433); microservices lineage
  via OpenTelemetry; ML experiment/model lineage.'
