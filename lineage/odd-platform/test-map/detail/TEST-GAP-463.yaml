surfaced_by:
  - "NotificationsDispatcher.md:bugs_limitations_corner_cases.[5] (sender-iteration order undefined)"
behaviour: |-
  Sender iteration order is undefined / Spring-bean-order-dependent. List<NotificationSender> is injected as a bean collection. The order — Slack first? Email last? — depends on Spring's bean-registration order, which is class-scan-order-dependent in practice. A change to the codebase (rename, package move, conditional registration order change) can silently flip the order. Combined with TEST-GAP-456 (email throws RuntimeException, aborting subsequent senders), the email's position in the iteration order is load-bearing: if email is LAST, Slack and webhook still receive every alert; if email is FIRST, Slack and webhook receive NONE on email failure. No @Order annotation, no Comparator, no explicit sort.
test_class: missing-edge-case
test_files_existing: []
test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/config/NotificationSenderInjectionOrderTest.java"
  name: "senderListInjectionOrder_isUndefined_dependsOnSpringBeanRegistration"
evidence:
  - |-
    NotificationsDispatcher.md says: 'List<NotificationSender> is injected as a bean collection. The order depends on Spring's bean-registration order, which is class-scan-order-dependent in practice.'
  - "AlertNotificationMessageProcessor.java:19 (private final List<NotificationSender<AlertNotificationMessage>> notificationSenders; — no @Order annotation, no Comparator, no explicit sort)"
cross_references:
  - "TEST-GAP-456 (related: email RuntimeException — order determines blast radius)"
  - "REFACTOR-NNN candidate: explicit @Order or @Priority on each sender bean"
proposed_action: |-
  Spring context-load test in a slice configuration with all three senders registered. Inject List<NotificationSender>. Assert size == 3. Probe via getClass().getSimpleName() and DOCUMENT the observed order. The test FAILS if the order changes — surfacing the implicit contract. The fix is to add @Order(1)/@Order(2)/@Order(3) to the three sender classes, and update this test to assert the explicit order.
