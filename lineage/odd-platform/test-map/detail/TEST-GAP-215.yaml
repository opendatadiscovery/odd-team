behaviour: '`ActivityEmptyPartitionsHousekeepingJob` / `MessageEmptyPartitionsHousekeepingJob`
  drop only EMPTY past partitions. Corner case: non-empty past partition with even
  one row is RETAINED indefinitely. The empty-check (PartitionServiceImpl.java:133-141
  `COUNT(*) = 0`) is the guard against data loss. Confirms activity-retention drift
  from second angle — there is NO row-delete-by-age path. No test pins the empty-check
  guard against a future refactor that drops it.'
