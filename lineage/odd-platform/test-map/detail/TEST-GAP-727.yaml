behaviour: |-
  **HIGH — TermServiceImpl.delete leaves stale tsvector rows in `term_search_entrypoint`, and the entire repository has effectively ZERO direct test coverage.** Primary-source confirmed in the batch-U ReactiveTermSearchEntrypointRepositoryImpl sidecar:

  **Stale-FTS-on-delete bug**: `TermServiceImpl.delete(long id)` (`TermServiceImpl.java:153-165`) deletes `term_to_term`, `data_entity_to_term`, `dataset_field_to_term` relations and the `term` row itself (soft-delete via `deleted_at`), but **NEVER calls any method on `ReactiveTermSearchEntrypointRepository`** to drop the term's row from `term_search_entrypoint` or clear its vector contents. Verified by reading the delete method end-to-end + verifying the interface at `ReactiveTermSearchEntrypointRepository.java:5-20` has only 7 UPDATE methods, NO delete / clear-vectors method.

  **Operational consequences**:
  - Soft-deleted terms (where `term.deleted_at IS NOT NULL`) keep their last-known tsvector contents in the FTS table indefinitely.
  - Readers that JOIN `term` (filtering by `TERM.DELETED_AT.isNull()`) will not surface them — masking the bug in normal operation.
  - BUT any reader that queries `term_search_entrypoint` directly without joining `term` would surface deleted terms.
  - The bug is exactly the shape called out by the sidecar's `tests_coverage_semantic.gaps` as "deleted term still in autocomplete" — visible to operators as inconsistent search/autocomplete state, invisible in CI.

  **Compound gap — REPOSITORY-WIDE zero direct coverage**: this is one of SEVEN methods on the repository, none of which have a direct test. The only test reference is `NamespaceServiceImplTest.java:175, 186, 205` — MOCK-ONLY interactions that verify `updateChangedNamespaceVector` was CALLED but NOT what SQL produces. So the seven SQL-heavy methods (CTEs, aggregates, `INSERT ... ON CONFLICT`, `tsvector_agg` remapping) are entirely unverified end-to-end. A future maintainer's well-intentioned change to JooqFTSHelper for the REFACTOR-229 family (FTS injection mitigation) could silently break the WRITE-side aggregation for every multi-tag term, with no test catching it before deploy.

  **Why HIGH not MEDIUM**: cross-pillar surface — P-01 (Discovery's search) consumes the FTS index this repository maintains. Stale vectors on the WRITE side surface as wrong-ranking / phantom-result behaviour on the READ side that P-01 owns. The bug is silent in CI but operator-visible in production. Plus the cumulative absence of direct test coverage on seven SQL-heavy methods amplifies regression risk. Cross-batch-link to F-002 (P-06 Glossary feature) + P-01 (Discovery search-ranking).

  **Test gap shape**: regression-pin asserting that AFTER `TermServiceImpl.delete(termId)`, querying `term_search_entrypoint` directly (without joining `term`) does NOT return the deleted term's row. Plus separate regression-pins on the seven repository methods exercising real SQL execution against a Postgres test container.
