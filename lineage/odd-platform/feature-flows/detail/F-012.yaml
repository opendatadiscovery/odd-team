description: |-
  The platform exposes a paired DEG-membership write surface on every data entity:
  `POST /api/dataentities/{data_entity_id}/data_entity_group` (with body
  `{data_entity_group_id: <long>}`) ADDs the child as a member of the target
  manually-created DEG, and `DELETE /api/dataentities/{data_entity_id}/data_entity_group/{data_entity_group_id}`
  removes it. Both endpoints are reactive thin proxies into
  `DataEntityServiceImpl.addDataEntityToDEG` / `deleteDataEntityFromDEG`
  (`DataEntityServiceImpl.java:387-408, 411-438`), wrapped in
  `@ReactiveTransactional`.

  The user-observable promise (per the live `data-discovery/groups-domains`
  feature page WebFetched 2026-05-19 status 200 + the live Permissions page):
  "operators with `DATA_ENTITY_ADD_TO_GROUP` / `DATA_ENTITY_DELETE_FROM_GROUP`
  curate DEG membership; the Catalog Overview's Domain tiles surface the
  curated groupings".

  The user-observable reality, per batch-L primary-source code-walk of BOTH
  controller methods + the service + repository + SecurityConstants:

  (1) **Write-collaborative DEG surface** — the SecurityRule paths
  (`SecurityConstants.java:228-236`) bind to the CHILD `data_entity_id` from
  the URL path; the target `data_entity_group_id` (in the BODY for ADD, in the
  PATH for DELETE) has NO authorization check. A caller holding
  `DATA_ENTITY_ADD_TO_GROUP` on entity X can place X into ANY manually-created
  DEG in the catalog, including DEGs owned by completely unrelated teams.
  Owners of a "Finance Domain" have no veto on drive-by membership writes.

  (2) **Forensic silence** — neither `addDataEntityToDEG` nor
  `deleteDataEntityFromDEG` carries `@ActivityLog` despite
  `ActivityEventTypeDto.DATA_ENTITY_RELATION_UPDATED` existing at enum line 12
  AND despite every other write method on this controller emitting activity
  (`upsertTags`, `upsertBusinessName`, `updateStatus`, `addDataEntityTerm` —
  cited at `:358, :239, :198, :153`). An operator querying
  `GET /api/dataentities/{id}/activity` to answer "who added this entity to the
  Finance Domain on date Z" finds nothing.

  (3) **ADD/DELETE permission asymmetry** — `SecurityConstants.java:228-236`
  registers `DATA_ENTITY_ADD_TO_GROUP` for POST and
  `DATA_ENTITY_DELETE_FROM_GROUP` for DELETE as TWO separate permissions
  (`PolicyPermissionDto.java:22-23`). Policy P1 granting only ADD allows the
  caller to add but not remove; Policy P2 granting only DELETE allows the
  caller to remove but not add. Operators wishing to delegate "manage DEG
  memberships" must grant BOTH; the live Permissions doc does not flag this
  as a compound capability.

  (4) **Idempotence asymmetry** — ADD raises `400 "Data entity is already in
  this DEG"` on duplicate (`DataEntityServiceImpl.java:402` —
  `switchIfEmpty` on the empty-Flux signal from `onDuplicateKeyIgnore`);
  DELETE silently returns 204 on a no-op (no `switchIfEmpty`, the empty Flux
  is `ignoreElements().thenReturn(noContent())`). Callers face different
  idempotence contracts for write-symmetric operations.

  (5) **Soft-delete + re-add lockout** — the `(group_oddrn, data_entity_oddrn)`
  PK does NOT include `is_deleted` (`V0_0_21__add_data_entity_group_relation.sql:6`
  + `V0_0_79__data_deprecation.sql:14-15` added the column later). When the
  child entity is soft-deleted via the cascade (`softDeleteRelationsForDeletedDataEntities`,
  `ReactiveGroupEntityRelationRepositoryImpl.java:92-101`) the relation row
  remains with `is_deleted=true`; on re-add of the same `(group, entity)`
  pair the `onDuplicateKeyIgnore` skips the INSERT, `switchIfEmpty` fires
  the "already in this DEG" error — but `getManuallyCreatedRelations`
  (filtered by `is_deleted=false`) reports zero memberships. The error
  message is misleading; the workaround is `restoreRelationsForDataEntities`
  which is NOT invoked from `addDataEntityToDEG`.

  (6) **HARD vs soft-delete cascade semantic gap** — user-initiated DELETE
  HARD-deletes (`ReactiveGroupEntityRelationRepositoryImpl.java:57-65` —
  `DSL.deleteFrom(...)`); entity-deletion cascade soft-deletes
  (`:92-101`). If the data-entity is ingestion-deleted and later restored,
  `restoreRelationsForDataEntities` resurrects memberships removed by
  cascade but NOT memberships removed by an operator click — same operator
  visible behaviour ("entity removed from group"), different durability.

facets_summary: |-
  9 substantive drifts: write-collaborative DEG (no DEG-side auth) + forensic
  silence + ADD/DELETE permission asymmetry + 204-on-no-op-DELETE vs
  400-on-duplicate-ADD + soft-deleted-membership-blocks-re-add misleading
  error + HARD-vs-soft-delete cascade gap + conflated 400 on DEG-type
  pre-check + optional `data_entity_group_id` produces "id null" error +
  empty DEG persists + DISABLED-mode bypass + dead `DATA_ENTITY_RELATION_UPDATED`
  enum value (reserved-but-never-fired).
