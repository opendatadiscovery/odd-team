    `/ingestion/**` (lines 95-96) — which exempts the entire namespace
    from UI-mode authorization (LOGIN_FORM/OAUTH2/LDAP) — the
    class-level posture is: under DEFAULT deployment, 4 of 5 endpoints
    accept unauthenticated POSTs from ANY caller able to reach port
    8080; under MOST-HARDENED deployment (OAUTH2 + s2s.enabled=true +
