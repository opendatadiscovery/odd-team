mitigations_unimplemented:
- |-
  Fix EmailNotificationSender to wrap `MessagingException | TemplateException
  | IOException` as `NotificationSenderException` (matching the AbstractNotificationSender
  pattern at lines 24-29).
- |-
  Broaden AlertNotificationMessageProcessor's catch from
  `catch (NotificationSenderException e)` to `catch (Exception e)` — a
  one-line fix that closes the bypass at the dispatcher level.
- |-
  Add an `@Order(Ordered.LOWEST_PRECEDENCE)` on EmailNotificationSender
  to push it to the END of the iteration order, minimising the bypass
  blast-radius (Slack + Webhook would run BEFORE email regardless of
  Spring's scan order).
- |-
  Add a unit test that injects a throwing email sender and asserts the
  next sender in the list still receives the message — pins the contract.
notes: |-
  NEW invariant captured in batch 2026-05-19K. The bypass is a code-bug
  rather than an architectural decision — the doc-side intent (per the
  live notifications page) and the code-side intent (per implicit_adrs.[0]
  on the dispatcher) both describe catch-and-continue as uniform across
  channels. EmailNotificationSender's RuntimeException wrap is a
  copy-paste error or an oversight.

  Cross-cutting connections:
    - Pairs with the "WAL Consumer + Postgres Replication Slot" entity
      concept — this is the entity's fail-soft path's gap; the
      fail-loud path's gap is the poison-message replay loop invariant
    - Companion of the "Sender iteration order undefined" finding —
      both surface the operator's inability to predict per-channel
      behaviour
    - Cross-cutting case-law for "exception-type contract violations
      between interface implementors" — a single-line code-style audit
      surface

  One DOC-NNN candidate flows from this invariant:
    (a) Document the failure mode on the live notifications page (or
        fix the code) — operators choosing channel order benefit from
        knowing the asymmetry exists, OR the asymmetry should not exist
