- getDataEntityDetails.md:concepts.operations + concepts.invariants.[0-3]
- getDataEntityDetails.md:implicit_adrs.[0-3]
- DataEntityDetails.md:concepts.operations + concepts.invariants + bugs_limitations_corner_cases.[0]
  + downstream_side_effects (empirical probe P-004 evidence)
- fetchDataEntityDetails.md:concepts.operations + concepts.invariants + bugs_limitations_corner_cases.[self-feeding-loop]
  + implicit_adrs.[0,1,2]
security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      No @PreAuthorize at controller; UI thunk has no client-side check (DataEntityDetails.tsx:56-64
      dispatches without validation). DISABLED-mode = anonymous reachable from both API and UI.
      Under LOGIN_FORM/OAUTH2/LDAP every authenticated user can fetch every entity (read-collaborative).
  owner_scoping:
    verdict: BYPASSES
    detail: Backend GET applies no owner predicate; UI passes only dataEntityId
      to the thunk; no owner / namespace / role filter at any layer.
  strengths:
  - 'Reactive @ReactiveTransactional boundary at the backend service guarantees
    atomic view_count UPDATE + payload read'
  - 'Soft-deleted entities surfaced deliberately for UI isStale rendering — defensible
    UX intent'
  weaknesses:
  - 'Read-collaborative cross-owner enumeration (HIGH) — every authenticated user reads
    every entity full 34-field payload'
  - 'LSN-017 — view_count inflation 2x cheaper from UI than from API (HIGH under default
    config) — empirically pinned by P-004'
  - 'DISABLED-mode anonymous page-open inflates view_count with no audit trail
    (probe P-002 empirically confirmed)'
  - 'No client-side dataEntityId validation — negative / zero / NaN flow through
    the API'
  - 'AppError.url reflection — backend response URL surfaces in <AppErrorPage>
    banner; for direct-exposed deployments this reveals internal API paths'
performance_aggregate:
  overall: LOW
  hot_paths:
  - 'Backend GET /api/dataentities/{id} p50=106ms p95=202ms p99=1539ms (50-call
    sample from probe P-003 baseline; p99 driven by JIT warmup)'
  - 'UI page-mount fires 5 parallel thunks per route navigation (this thunk + 4
    in the second useEffect); 6 HTTP calls per mount with LSN-017'
  - 'Backend view_count UPDATE in same @ReactiveTransactional as the SELECT;
    every read is also a write at the DB layer'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single-request-per-mount; no batching, no GraphQL coalescing
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Stateless backend and UI; LSN-017 amplifies backend view_count UPDATE
      contention by 2x — the hot-row problem documented in F-001 facet[5] is
      multiplied by the UI bug
  weaknesses:
  - 'LSN-017 doubles network round-trip cost per page-open (MEDIUM) — fix is 1
    line at DataEntityDetails.tsx:63'
  - 'No client-side cache between Redux and the network — every dispatch issues
    a fresh fetch even though Redux already holds the prior payload'
  - 'No in-flight de-dup or coalescing at the thunk layer'
  - 'No requestId-based stale-response protection — rapid entity-id switching
    can overwrite fresh data with late-arriving stale fetches'
notes: |-
  Strengthened in batch 2026-05-19J with TWO UI-side sidecars (DataEntityDetails
  + fetchDataEntityDetails) closing the F-001 chain UI half end-to-end. LSN-017
  is now empirically pinned by probe P-004 (xhr_count=2 + DB delta=2; regex-filtered
  exact path match) — the cross-layer bug fingerprint (UI dep-array + backend
  read-as-write) is the canonical example of "cross-layer user-effects invisible
  to per-node scans" (the LSN-017 retro title).

  Three doc-gap candidates flow from this strengthen:
    (a) /features/data-discovery/catalog-overview does NOT mention that opening
        a detail page inflates Popular ranking by +2 view_count.
    (b) Operators tuning Popular ranking or auditing read-only access paths
        have no published signal that opening a detail page mutates state.
    (c) The LSN-017 2x inflation baseline is documented only in retros; the
        public docs page makes no mention of the bug or the bug's effect on
        Popular ranking.
