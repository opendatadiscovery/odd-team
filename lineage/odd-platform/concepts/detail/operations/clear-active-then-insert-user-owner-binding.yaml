notes: |-
  NEW operation captured in batch N. The operation is one of three
  distinguishable write paths into user_owner_mapping (alongside
  deleteRelation and deleteActiveRelationByOwner) but is the LOAD-BEARING
  one — every successful owner-association request, every operator-manual
  mapping, and every admin-fast-track binding flows through this
  operation.

  Cross-cutting connections:
    - Pairs with the user-owner-mapping entity concept — this is the
      operation that PRODUCES the active row
    - Cross-references the provider-null-cross-mode-bleed invariant —
      the same provider-null branch in getConditions applies to BOTH
      the read (getAssociatedOwner) and the write (the inner clear-by-
      owner-id step does NOT use provider, but the outer service-tier
      clear-by-(username, provider) DOES — and that uses the same
      branch via getConditions)
    - Pairs with the audit-log-presence-asymmetry invariant — the
      operation emits NO audit log on success; an operator auditing
      "who linked alice to owner X on date Y" has no in-application
      answer

  Recommended documentation:
    (a) Document the two-step pattern on the user-owner-association
        operator page — operators need to know that creating a new
        binding ALSO clears any prior binding for the same user OR the
        same owner (and that the prior binding's soft-delete record
        is preserved in the table)
    (b) Add a regression test pinning the contract: insert (alice, X);
        insert (alice, Y); assert the (alice, X) row is now soft-deleted
        AND the (alice, Y) row is active
    (c) Add @ReactiveTransactional to UserOwnerMappingServiceImpl
        OR document the partial-failure case at the operator surface
