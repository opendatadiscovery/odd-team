    When an operator edits a lookup table and the namespace field is shown disabled,
    the namespace is not part of the update sent to the server. ACTUAL: the edit form
    submits the CREATE-shape body (namespace_name included) to the UPDATE endpoint
    though LookupTableUpdateFormData (components.yaml:3853-3862) defines only
