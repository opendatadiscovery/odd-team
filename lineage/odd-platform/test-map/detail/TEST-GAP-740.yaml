proposed_action: |-
  Add `ReferenceDataUpdateColumnPathParamDiscardedTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `updateLookupTableField_pathTableIdDoesNotMatchColumnsParentTable_succeeds_pinsCurrentBypass` — seed table A (id=100) with column 999; seed table B (id=200) with column 888; authenticate with LOOKUP_TABLE_DEFINITION_UPDATE; PATCH `/api/referencedata/table/100/column/888` with new form data; assert HTTP 200 (the column 888 update succeeds despite the URL claiming it's under table 100). PIN the current bypass.
  2. `getLookupTableField_pathTableIdDoesNotMatchColumnsParentTable_returns400_pinsAsymmetryWithUpdate` — GET `/api/referencedata/table/100/column/888`; assert HTTP 400 BadUserRequestException (the READ contract enforces). PIN the asymmetric contract.
  3. `deleteLookupTableField_pathTableIdDoesNotMatchColumnsParentTable_succeedsOrFails_TBD` — sister test on the DELETE surface to surface the symmetric contract OR discover that DELETE also bypasses (the sidecar does not explicitly note DELETE's behaviour — this test surfaces the missing third surface).
  4. `updateLookupTableField_callerHoldsPermissionViaPolicyOnTableA_butColumnBelongsToTableB_succeeds_compoundWithNoContextScope` — pin the COMPOUND with TEST-GAP-739: authentication has LOOKUP_TABLE_DEFINITION_UPDATE via Policy on table A; column belongs to table B; assert HTTP 200.

  Add a `// REGRESSION-PIN — updateLookupTableField discards path-param lookupTableId; the service signature is asymmetric with the READ contract. A REFACTOR adding the parent-table cross-check at the service layer will break test #1 (now 400 BadUserRequest) and align with the READ contract.` comment block.

  Pair with REFACTOR-NNN closing the bypass; pair with TEST-GAP-739 fix; the two REFACTORs must ship together.
