behaviour: |-
  **No-predefined-name-validation unit gap.** RoleItem.tsx:24-25 defines `isUser = name === 'User'` and `isAdministrator = name === 'Administrator'` with case-SENSITIVE strict equality matching `RoleServiceImpl.java:68` (case-sensitive `.equals('Administrator')` for update) but MIS-matching `RoleServiceImpl.java:82` (case-INSENSITIVE `.equalsIgnoreCase` for delete). RoleForm.tsx:28 + 90 disables the name `Input` when `isUser` (case-sensitive on `User`). The cross-layer mismatch is documented as F-006 drift_class `role_service_predefined_name_case_sensitivity_mismatch` and confirmed at the UI tier. No test asserts (a) an `Administrator`-named row hides Edit + Delete buttons (the positive path); (b) an `administrator` (lowercase) row shows BOTH Edit and Delete (the mismatch); (c) clicking Delete on the lowercase `administrator` row submits to the backend and receives `BadUserRequestException('Role is predefined and cannot be deleted')` because the backend delete-guard IS case-insensitive — UI accepts the attempt, server rejects, UX displays the error. The asymmetry is observable but unverified. A regression that fixed the UI to be case-insensitive without aligning the backend `.update`/`.create` guards would break this test (good) but the test would also serve as a forced-discussion point on cross-layer alignment.
test_files_existing: []
test_files_proposed:
  path: "odd-platform-ui/src/components/Management/RolesList/RoleItem/__tests__/RoleItem.test.tsx (NEW file)"
  name: "predefined_role_name_check_is_case_sensitive_at_ui_with_backend_delete_mismatch"
evidence:
  - "RolesList.md says (concepts.invariants.[5]): 'Predefined-role name protection is UI-only. RoleItem.tsx:24-25 defines isUser = name === User and isAdministrator = name === Administrator. The Edit button is hidden when isAdministrator (line 56-57); the Delete button is hidden when isUser || isAdministrator (line 74-75). These are CASE-SENSITIVE string matches against the literal name Administrator / User — a role named administrator (lowercase) would NOT be matched by isAdministrator and WOULD show Edit/Delete buttons. Server-side RoleServiceImpl.update (line 68) uses case-SENSITIVE .equals(Administrator) (consistent with UI); RoleServiceImpl.delete (line 82) uses case-INSENSITIVE .equalsIgnoreCase(role.getName()) (INCONSISTENT with the UI's case-sensitive check on Delete).'"
  - "RolesList.md says (implicit_adrs.[2]): 'Case-sensitive UI predefined-name check matches server-side update-side check; misaligns with server-side delete-side check. RoleItem.tsx:24-25 uses name === Administrator. RoleServiceImpl.java:68 uses case-SENSITIVE .equals(Administrator) for the update guard. RoleServiceImpl.java:82 uses case-INSENSITIVE .equalsIgnoreCase(...) for the delete guard.'"
cross_references:
  - "F-006 (drift_class role_service_predefined_name_case_sensitivity_mismatch)"
  - "TEST-GAP-639 (PolicyList isAdministrator brittleness — symmetric)"
proposed_action: |-
  Add `RoleItem.test.tsx` (NEW file) with parameterised test over names: (a) `Administrator` — assert Edit + Delete both hidden; (b) `administrator` — assert Edit + Delete both VISIBLE (mismatch with backend delete-guard); (c) `User` — assert Delete hidden, Edit visible (per RoleItem.tsx:57 — only Delete is hidden for `User`); (d) `user` — both visible; (e) `Administrator Policy` — both visible (rename hazard). Pair with a separate integration test `lowercase_administrator_delete_attempt_returns_backend_error` that submits Delete and asserts the server's 400 response with `BadUserRequestException('Role is predefined and cannot be deleted')` text — pins the cross-layer mismatch end-to-end.
