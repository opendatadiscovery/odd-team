suggested_canonical_choice: |-
  Path A — fix the implementation (move ORDER BY count DESC inside the
  paginate window). The UI label "Top Tags" stays as the operator's
  truthful name for what the surface delivers AFTER the fix. The
  LSN-019 invariant's recommended FIX A captures the implementation
  shape.

  If Path A is deferred (the SQL refactor has non-trivial cost),
  recommend Path C (doc admonition) as the interim — operators reading
  the doc at least learn the truth; the operator's mental model can
  adapt. Path B (relabel UI) is NOT recommended — the UI label is the
  truthful name for the operator's actual need; the platform should
  deliver what the UI promises, not lower the promise to match the
  buggy delivery.

suggested_add_to_docs: true

rationale: |-
  This is a Cornerstone 1 (doc-product editorial coherence) AND
  Cornerstone 2 (canonical vocabulary) finding. The UI label "Top Tags"
  IS canonical operator vocabulary — operators trust it; the platform
  should deliver what it promises. The mismatch with the implementation
  is a real-world bug class that the LSN-019 Stress Protocol caught
  mechanically.

  Surfaced via the maintainer's empirical 2026-05-20 test against
  demo.oddp.io which CONFIRMED the drift at the operator surface
  (35 tags, all equally popular, response returns oldest 30 in tag.id
  ASC order). The maintainer's empirical reproduction validates that
  the drift is not just a theoretical SQL trace — it's operator-
  visible.

evidence:
  - 'TagController.md:concepts.invariants[getPopularTagList misnamed at the SQL layer — returns OLDEST 30 tags by TAG.ID ASC, NOT 30 most-popular]'
  - 'TagController.md:doc_drift_findings[LSN-019 — UI surface labels the response "Top Tags" / "popular tags"; method name is listMostPopular; the implementation selects the OLDEST 30 tags by TAG.ID ASC]'
  - 'TagController.md:stress_findings.name_behavior_pairs[0].operator_visible_consequence — "The UI''s Top Tags label is operator-misleading"'
  - 'TagController.md:stress_findings.orderings[the UI (Catalog Overview / search-facet) renders items in the order delivered — no client-side re-sort observed]'
  - 'TagServiceImpl.md:stress_findings.S-B-1 — service propagates the drift one-to-one to the UI surface'
  - 'ReactiveTagRepositoryImpl.md:bugs_limitations_corner_cases.[0] — "The UI''s TopTagsList chip strip on the Discovery overview surface is effectively ''oldest 30 tags'' — silently"'
  - 'retrospectives/LSN-019:23-32 (empirical confirmation — 35 tags → oldest 30 returned)'
  - 'odd-platform-specification/openapi.yaml:345 (the spec promise vs the SQL truth)'

notes: |-
  CAPTURED batch VAL-LSN-019 (2026-05-20) — the audience-facing
  manifestation of the LSN-019 drift. Distinct concept from the
  underlying invariant because the operator-visible surface drives a
  DIFFERENT remediation track (UI/doc) than the underlying code bug
  (SQL refactor).

  Operator-facing concept paired-but-distinct from the technical
  invariant. The maintainer can:
    (a) Fix the implementation now AND keep this concept as the
        operator-facing record of the historic drift (useful for
        the doc page describing the platform's tag ranking).
    (b) Defer the implementation fix AND add a doc admonition
        (this concept then becomes the canonical source for what
        the doc should say).

  Either way, this concept's existence at the catalog layer ensures
  that the audience-facing label is tracked separately from the
  underlying code. The pairing pattern follows
  `popular-ranking-signal-most-viewed-or-most-used-doc-claim-misleading`
  (the Data Entity equivalent — same shape).

  Three DOC-NNN candidates:
    (a) /features/data-discovery/tagging — admonition on the "Top
        Tags" UI label's actual behavior (or, after Path A fix lands,
        explicit text confirming that the label is now truthful).
    (b) /features/data-discovery/catalog-overview — admonition on
        the "Top Tags" chip strip surface specifically.
    (c) /developer-guides/api-reference/tagging NEW page — explicit
        documentation of the endpoint's ordering semantic AND the
        UI surface's interpretation.
