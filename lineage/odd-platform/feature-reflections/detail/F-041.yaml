      machine and gets English; (2) a Spanish-only user's first visit is entirely in English (navigator.language
      ignored), and the switcher they must locate is labelled in English; (3) clearing browser data silently
      resets the choice. For a six-locale product this materially undercuts the multilingual feature's value.
