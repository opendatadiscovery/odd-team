mitigations_unimplemented:
- |-
  Per the master invariant — DISABLED mode is dev-only per docs; the existing
  mitigation surface is operator discipline ("don't run DISABLED in production").
  Batch X does NOT add new mitigations for DISABLED; it ADDS the LOGIN_FORM
  facet's mitigations.
- |-
  **NEW batch X — LOGIN_FORM facet mitigations**:
  (a) Code-side: wire AuthorizationCustomizer into LoginFormSecurityConfiguration.java
      similar to OAuth/LDAP siblings — makes SECURITY_RULES active under LOGIN_FORM
  (b) Code-side: replace the hard-coded `true` at line 81 with per-user role logic
  (c) Code-side: boot-time fail-fast guard — if `auth.type=LOGIN_FORM` AND default
      credentials AND non-loopback bind, throw IllegalStateException
  (d) Doc-side: add to /enable-security/authorization the precondition statement
      'The Policies/Permissions/Roles/Owners framework is wired only in OAUTH2
      and LDAP modes. Under LOGIN_FORM and DISABLED, RBAC is INERT.'
- |-
  Optional code-side mitigation for the AppInfo fingerprinting surface
  specifically: NOT echo projectVersion under DISABLED (assume DISABLED is
  dev-only; minimise the fingerprinting surface). One-method change at
  AppInfoController.java:25-28 — return projectVersion only if the session
  is authenticated, OR move version field behind a separate authenticated-only
  endpoint. Cross-link to the expose-mode-hide-provider invariant's mitigation_unimplemented.
- |-
  Per the master invariant — UI BANNER under DISABLED would warn operators of
  the asymmetry. Batch T adds the controller-class layer evidence that the
  UI banner is the right place for the warning (the SPA reads /api/appInfo
  on boot and could trivially render a fixed banner when
  appInfo.authType === 'DISABLED' OR appInfo.authType === 'LOGIN_FORM'
  — the LOGIN_FORM facet adds a second condition).
notes: |-
  STRENGTHENED batch 2026-05-20X — REFACTOR-185 is now a 24-sidecar pattern
  covering TWO of the four auth modes (DISABLED + LOGIN_FORM). The LOGIN_FORM
  facet adds the config-class layer primary source for the
  ADMIN-for-everyone-with-no-AuthorizationCustomizer mechanism — same effective
  end-state as DISABLED's `.anyExchange().permitAll()` but via a different
  code path.

  The 24-sidecar pattern is the platform's most thoroughly-enumerated security
  pattern. The actionable surface remains the same as in the master invariant —
  doc-side disclosure + UI banner + optional code-side fingerprinting reduction
  on AppInfo + LOGIN_FORM-facet code-side fix to wire AuthorizationCustomizer.

