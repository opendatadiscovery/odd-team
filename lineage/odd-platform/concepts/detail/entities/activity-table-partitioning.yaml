name: Activity Table Partitioning
canonical_in_docs: false
canonical_candidate: true
description: 'Operational concept covering the range-partitioning lifecycle of the
  `public.activity` table — partition WIDTH set by `odd.activity.partition-period`
  (default 30 days; each partition spans 2× the period for deliberate forward-overlap),
  CREATE driven by `ActivityTablePartitionManager` extending `AbstractPartitionManager`,
  orchestrated by `PostgreSQLPartitionCreationJob` at boot (under Postgres advisory
  lock id `partition.advisory-lock-id` default 90) AND nightly via Spring `@Scheduled(cron="0
  1 0 * * *")` (under ShedLock `partitionCreationJob` with lockAtLeastFor=10m / lockAtMostFor=10m).
  **No retention/DROP path for non-empty partitions** — the activity table grows
  monotonically on any deployment that generates activity events. `PartitionService.dropPartition`
  + `getEmptyPastPartitions` exist on the service interface; the EMPTY-ONLY
  drop is invoked by `ActivityEmptyPartitionsHousekeepingJob`, but only fires
  for partitions whose count(*)=0 AND whose end-date is in the past. On a
  steadily-used deployment with 60-day-wide partitions, partitions rarely
  empty out — the housekeeping job is functionally a near-no-op (verified
  PRIMARY SOURCE batch VAL-LSN-019-B). Sibling `MessageTablePartitionManager`
  (under `@ConditionalOnDataCollaboration`) uses the same pattern for the
  messages table. vocabulary_status: codebase-anchored, doc-side-partially-covered
  (the partition-period config key is documented at `/configuration-and-deployment/odd-platform#metric-storage-backend`
  adjacent — verified WebFetch 2026-05-10 — but the doc claim ''retention and partitioning
  are controlled by'' is INCORRECT: setting controls WIDTH only).'
vocabulary_status: codebase-anchored, doc-side-partially-covered
axes_present:
- config_prefixes
- housekeeping
- repositories_reactive
nodes:
