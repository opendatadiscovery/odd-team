discovered_from_entry_point: ui-component:OverviewTags
description: |-
  Three sibling Overview sidebar panels — Tags, Terms, Groups — share an
  identical "top-N visible + 'View All' collapse for overflow" rendering
  pattern. Per primary-source `OverviewTags.tsx:54-65` and twin
  `OverviewTerms.tsx:48-58`:

      tags
        .slice(0, visibleLimit)   // ← slice first
        .sort(tagsCompare)         // ← THEN sort only the slice
        .map(tag => <TagItem ... />)

  The slice runs BEFORE the sort. Result: the top-20 visible tags are
  the first 20 in array order (the server's return order — which is
  insertion / database order, NOT importance order). The `tagsCompare`
  comparator (lines 27-32) — sorting by importance then alphabet — runs
  only on the already-truncated window. A tag marked `important: true`
  positioned at array index 25 is INVISIBLE in the top-20 cut; the user
  must click "View All (N)" to see it.

  Operator-observable promise (inferred from the `tagsCompare`
  comparator's existence — sort by importance then alphabet): "Important
  tags appear first so you can see what matters about this entity at
  a glance."

  Operator-observable reality: the top-20 visible at first paint are
  in insertion/database order; the comparator only re-orders within
  that 20-element window. For an entity with 25 tags where the
  important ones happen to be at indices 22-24, the visible top-20
  contains no important tags at all. The same bug shape recurs on
  OverviewTerms.tsx:48 (terms with `.sort()` — bare no-comparator
  call, defaulting to lexicographic-on-stringified-element).

  OverviewGroups.tsx:49-54 is the same shape with a different bug:
  `.slice(0, visibleLimit).sort()` — `.sort()` on an array of
  `DataEntityRef` objects with no comparator. Per ECMAScript: default
  comparator converts elements to strings via toString(). For
  objects this yields "[object Object]" for every element → no
  ordering effect. The Groups panel sorts in NAME ASC order ONLY by
  accident if the objects happen to have a `toString()` override
  (they don't — DataEntityRef is a plain DTO).

  Combined, all three Overview list panels have a top-N display
  whose ordering does NOT match the panel's apparent UX promise.
