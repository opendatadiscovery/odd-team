proposed_action: |-
  Add `DataQualityRoutePermissionPostureTest` under `odd-platform-ui/src/components/DataQuality/__tests__/`. Use Vitest + React Testing Library + a `<MemoryRouter>` to drive the full `<App>` route tree. Three pinning methods:
  (a) `dataQualityRoute_isReachableByMinimumPrivilegeUser_pinsCurrentUngatedPosture`: mount `<App>` with an authenticated user carrying ZERO `Permission`s and zero ownership associations; navigate to `/data-quality`; assert `<DataQuality>` renders fully (the sidebar + content panes mount; the DonutChart placeholders appear). PINS the current any-authenticated posture.
  (b) `lookupTablesRoute_isGated_pinsContrastAsymmetry`: same minimum-privilege user; navigate to `/lookup-tables`; assert the page does NOT mount the LookupTables editor (the `WithPermissionsProvider` blocks it). The two tests together PIN the deliberate asymmetry: a regression that adds a guard to `/data-quality` OR removes the guard from `/lookup-tables` breaks one of the two.
  (c) `dataQualityTopBarTab_isShownToMinimumPrivilegeUser_pinsToolbarUnconditionalRender`: assert the "Data Quality" tab text is present in the rendered toolbar for the minimum-privilege user. Pins `ToolbarTabs.tsx:45-49`'s unconditional render.

  Add a `// REGRESSION-PIN — App.tsx:73 — /data-quality is INTENTIONALLY ungated (read-collaborative posture). If you want to gate this dashboard, you must (1) update this test, (2) update documentation/docs/features/data-quality/dashboard.md to document the new gate, (3) update F-032's drift_class_summary to remove ungated_dashboard_route_no_permission_guard, and (4) coordinate with the backend half (probe P-090) to keep the frontend gate and the backend gate aligned.` block.

  Pair with DOC-GAP-NNN that fixes the doc-side silence (the `dashboard.md` page should say "visible to any authenticated user — catalog-wide quality posture is a read-collaborative surface").
