mitigations_unimplemented:
  - |-
    Extend the @PostConstruct validate() at ODDLDAPProperties.java:40-49
    with the missing cross-field rules:
      - if (activeDirectory.isEnabled() && StringUtils.isEmpty(activeDirectory.getDomain())) throw new IllegalStateException("active-directory.domain is required when active-directory.enabled=true")
      - if (!url.matches("^ldaps?://.*")) throw new IllegalStateException("auth.ldap.url must use ldap:// or ldaps:// scheme")
      - optional: log.warn (not fail) when adminGroups is empty under LDAP-as-sole-auth-path
  - |-
    Promote ODDLDAPProperties to @Validated + add
    jakarta.validation.constraints annotations (@NotBlank on url + dnPattern;
    @URL on url; @Pattern("^ldaps?://") on url; custom cross-field validator
    for AD pairing). Spring fires all errors at once.
  - |-
    Docs-side: document on the LDAP config-page the EXACT list of what
    validate() checks AND the list of what it does NOT check (a 4-item
    enumeration). Operators learn the contract.
  - |-
    Add a regression test asserting that boot fails with the expected
    IllegalStateException for each of: url=null, url=empty, dnPattern+filter both
    null, AD.enabled=true+domain=null, adminGroups=null under LDAP-as-sole.
