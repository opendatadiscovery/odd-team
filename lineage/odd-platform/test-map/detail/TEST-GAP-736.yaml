behaviour: |-
  **HIGH — `GET /api/owner_association_request/activity` has NO SecurityRule entry — the audit-trail surface is reachable by ANY authenticated user, exposing forensic data about WHO requested association with WHICH Owner, WHO approved/declined, WHEN.** Primary-source confirmed in the batch-V OwnerAssociationRequestController sidecar:

  - The controller method (`OwnerAssociationRequestController.java:47-53`) returns `OwnerAssociationRequestActivityList` — a paginated history of every owner-association request + status-update across the platform.
  - `SecurityConstants.java:148-162` declares the 5 path-pattern entries for this controller's protected paths: GET /api/owner_association_request (OWNER_ASSOCIATION_MANAGE), PUT /api/owner_association_request/{id} (same), POST /api/owners/mapping (OWNER_RELATION_MANAGE), DELETE /api/owners/mapping/{id} (same). **NO entry for `/api/owner_association_request/activity`.**
  - The endpoint falls through to the global `pathMatchers("/**").authenticated()` catch-all. Any authenticated user with ZERO RBAC permissions can call this endpoint.

  **Asymmetric with the LIST endpoint**: GET `/api/owner_association_request` (the PENDING/APPROVED/DECLINED list view) REQUIRES `OWNER_ASSOCIATION_MANAGE`. GET `/api/owner_association_request/activity` (the audit/historical view) requires NO permission. The activity view is strictly a SUPERSET of the list view in sensitivity — it exposes the same data PLUS the historical status-change audit trail. The asymmetry is unintentional (the activity view is more sensitive, not less). Per `OwnerAssociationRequestController.md:security.known_security_gaps.[1]` verbatim: "The asymmetry is unintended (the activity view is strictly a superset of the list view in sensitivity)."

  **Operator-observable consequences**:
  - An authenticated user with no permissions (e.g. a newly-onboarded user awaiting approval, an unprivileged programmatic client) can fetch the full forensic history of platform owner-association events: WHO requested association with WHICH owner, WHO approved/declined, WHEN, plus the role list per request.
  - In a deployment where `owner.name` carries sensitive PII or organisational structure (e.g. team-name = project-codename indicating an unannounced product), the activity feed leaks the organisational chart to every authenticated user.
  - In a deployment with operator-direct manual-mapping (per the MANUAL flow at POST /api/owners/mapping — see TEST-GAP-738 sister gap), every `REQUEST_MANUALLY_APPROVED` row reveals "admin X bound user Y to owner Z at time T" — full audit trail leaked to anyone authenticated.

  **Compound with the audit-trail-is-the-ONLY-forensic-record finding**: per `OwnerAssociationRequestController.md:coherence_notes.[2]` (the F-006 audit-presence asymmetry POSITIVE half), the OwnerAssociationRequest workflow IS one of the few RBAC-adjacent surfaces with a DEDICATED audit table. The asymmetry framing: RBAC mutations (Role create, Policy edit) have NO audit log; OwnerAssociation mutations DO. But the BENEFIT of the audit log is undermined when the audit log itself is READ by any authenticated user. The forensic surface exists but is not RBAC-gated.

  **Why HIGH not CRITICAL**: the leaked information is metadata about owner-association requests + their status transitions + approver identities. It does NOT directly enable a mutation (the attacker cannot ESCALATE via this read). But it provides reconnaissance for further attacks (which admins to target, which owners exist, which requests are pending). HIGH information disclosure.

  **Test gap shape**: regression-pin asserting the endpoint is reachable by an authenticated user with zero MANAGEMENT permissions. Pin the asymmetry with the LIST endpoint (which requires OWNER_ASSOCIATION_MANAGE).
