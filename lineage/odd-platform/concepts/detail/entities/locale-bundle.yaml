name: Locale Bundle
canonical_in_docs: false
canonical_candidate: true
description: Multilingual UI's per-language resource bundle — JSON dictionary of translation
  keys → localised strings, statically imported and registered with i18next at app
  boot. Six locales ship today (en/es/ch/fr/ua/hy), each ~16-25 KB; total ~120 KB
  in main JS bundle (i18n.ts + SelectLanguage sidecars `concepts.entities`).
axes_present:
- ui_shell
nodes:
- odd-platform ts locales ui-shell-bootstrap:i18n.ts
- odd-platform ts components/shared/elements/AppToolbar ui-shell-widget:SelectLanguage
contributors:
- 'i18n.ts: entities[locale resource bundle, language code, i18n singleton, persisted
  language preference]'
- 'SelectLanguage: entities[language code (Lang = key of LANGUAGES_MAP), friendly
  language name, country flag code, persisted language preference, i18next runtime
  instance]'
evidence:
- i18n_ts.md:concepts.entities.[locale resource bundle]
- SelectLanguage.md:concepts.entities.[language code, persisted language preference]
security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - DISABLED
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  ingestion_filter_relevance: N/A
  authorization_consistency:
    verdict: UNKNOWN
    detail: Both sidecars are TS modules running in the browser — INTERNAL_ONLY for
      auth_mode_relevance. Authorization is irrelevant by design at this layer; no
      @PreAuthorize, no permissionService call (those are Java/Spring constructs).
  owner_scoping:
    verdict: N/A
    detail: Code is not data-scoped. The widget operates on a six-element static locale
      list; no DataEntity, Owner, or other ODD domain object is queried, filtered,
      or exposed.
  strengths:
  - localStorage value 'i18nextLng' is unsigned/unencrypted but carries only a 2-letter
    locale code drawn from a fixed whitelist (en | es | ch | fr | ua | hy) — XSS attacker
    reading/writing key gains nothing operationally beyond changing victim's UI language
  - 'Whitelist guard on read-back: stored value accepted only if it matches one of
    the six imported locale keys; any other value is replaced by the default ''en'''
  weaknesses:
  - Bootstrap calls localStorage.getItem('i18nextLng') unguarded; in privacy-mode
    browsers where localStorage access throws, the import-for-side-effects raises
    before <App /> renders → entire UI unreachable, including login screen (severity
    LOW availability concern, not confidentiality)
  - Live `enable-security` doc does not mention browser-side preference persistence
    — operators implementing a CSP that disables localStorage break this widget's
    persistence path with no docs warning (severity LOW)
  cross_file_inconsistencies: []
  contributing_files:
  - i18n_ts.md
  - SelectLanguage.md
  evidence:
  - i18n_ts.md:security.known_security_gaps.[0,1]
  - SelectLanguage.md:security.known_security_gaps.[0,1]
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - Module-load runs once per app boot — synchronously imports six locale JSON bundles,
    constructs resources map, reads localStorage, calls i18n.use(initReactI18next).init({...});
    on critical path of first paint via index.tsx:23 side-effect import — i18n.ts
  - Every React component that calls useTranslation() reads from i18next singleton
    on each render, walking in-memory resources map for active language and (on cache
    miss) the six-element fallbackLng chain — fires hundreds of times per render cycle
    on typical platform pages — i18n.ts
  - 'Render path: dialog body iterates i18n.languages and applies substring filter;
    click handler awaits i18n.changeLanguage which triggers full app rerender via
    react-i18next provider — SelectLanguage'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: User-event-driven, very low frequency — typical session opens dialog 0-1
      times. No batching or queuing concern. Module-load is one-shot at boot.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Stateless across the platform backend — no API call, no per-user server
      record, no DB row touched by language preference. Lives entirely in browser
      localStorage. Switching browsers/devices/clearing site data resets to 'en'.
      Backend horizontal scaling unaffected.
  strengths:
  - Single i18next instance held in module-scope memory — bounded footprint, not per-user,
    not per-render
  - Pure function `alertsPath` (sibling pattern) — referentially transparent, scales
    with React render tree at zero cost
  - No network I/O on language-change click path — purely localStorage.setItem
  weaknesses:
  - No code-splitting on locale — every user pays full ~120 KB locale payload in main
    JS bundle even though only one locale is active. Adding a seventh locale grows
    main bundle linearly (severity LOW)
  - fallbackLng is the full six-element array `['en','es','ch','fr','ua','hy']` rather
    than conventional `'en'`. On a missing key, i18next walks all six locales in order
    before giving up. Per-render cost small but for a key genuinely missing across
    all locales the lookup does six failed map probes (severity LOW)
  - i18n.changeLanguage triggers full app rerender via react-i18next provider — single
    broadcast rather than incremental segment swapping; on deeply-mounted pages (lineage
    graph with 100+ nodes) perceived latency to first paint after language click is
    noticeable (severity LOW)
  - No debounce on search input — every keystroke runs filter on the full locale list;
    acceptable today (N=6) but a contributor adding 50+ locales would push every keystroke
    to a 50-element re-render (severity LOW)
  cross_file_inconsistencies: []
  contributing_files:
  - i18n_ts.md
  - SelectLanguage.md
  evidence:
  - i18n_ts.md:performance.hot_paths.[0,1]
  - i18n_ts.md:performance.known_performance_gaps.[0,1]
  - SelectLanguage.md:performance.known_performance_gaps.[0,1]
notes: 'Concept emerges from two sidecars consistently (i18n.ts and

  SelectLanguage). main-concepts.md does not name "Locale Bundle"

  or "Multilingual UI" or "i18n" — both sidecars surface canonical

  F-047 finding (multilingual UI undocumented on the public site).

  Surface as a canonicalisation candidate: doc-side extension,

  not a vocabulary-drift merge.

  '
