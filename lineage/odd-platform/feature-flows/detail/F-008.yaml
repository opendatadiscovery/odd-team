terminal_side_effect:
  side_effect_class: db-delete
  description: 'Two distinct destructive writes per ingest: (a) metadata_field_value DELETE

    of bindings missing from the new payload (MetadataIngestionRequestProcessor.java:72-80);

    (b) lineage DELETE of all edges by the establishers in the payload

    (ReactiveLineageRepositoryImpl.batchDeleteByEstablisherOddrn). Both happen

    INSIDE the same Postgres transaction that ALSO inserts the new payload; partial

    failure rolls back ALL writes including the deletes.'
  evidence: 'MetadataIngestionRequestProcessor.java:72-80 (the difference-then-delete

    sequence) + LineageIngestionRequestProcessor.java:17 (replaceLineagePaths verb)

    + LineageServiceImpl.java:124-133 (the delete-then-insert atomic rewrite) +

    IngestionServiceImpl.java:66 (the outer @ReactiveTransactional binding the

    entire pipeline) + cross-ref to ReactiveLineageRepositoryImpl batch-H sidecar

    + IngestionService batch-I sidecar downstream_side_effects table.'
  cardinality_per_call: 'N + M per call (N = count of metadata bindings dropped from the payload, M =

    count of lineage establishers in the payload). Both can be zero on a perfectly-merged

    re-ingestion, or arbitrarily large on a partial-state re-ingestion.'
amplification_factor: 1
amplification_factor_provenance: 'STATIC — confirmed from primary source. The amplification is structural: ONE

  ingestion call atomically PRODUCES new state AND DESTROYS prior state in the

  same transaction, with no signal to the caller about which prior bindings were

  removed. No active probe yet; per-call multiplicity is 1 against the payload,

  N+M against the prior state.'
observed_vs_expected:
  facets:
  - facet: silent metadata-delete-on-absence
    observed: 'Re-ingesting an entity with a partial metadata set silently DELETES the

      metadata fields NOT present in the new payload, inside the same transaction

      that creates the new payload''s fields. No log.warn on the delete branch

      (verified — @Slf4j is present at MetadataIngestionRequestProcessor.java:30

      but no log call on the delete path). No activity event on the deletion

      (ActivityIngestionRequestProcessor.java:24-37 only emits DATA_ENTITY_CREATED

      for new entities). The 200/201 HTTP response carries no payload-level diff

      showing what was removed.'
    expected: 'MERGE semantics OR a deliberate "destructive ingestion" mode flag with audit

      logging of the dropped bindings'
    drift_class: silent_destructive_write_on_replace
    provenance: STATIC — primary-source verification in batch-I IngestionService sidecar bugs_limitations_corner_cases[0]
      + dependencies_semantic.requires-feature MetadataIngestionRequestProcessor. Proposed local probe — POST entity E with
      metadata {a:1, b:2}, POST E with metadata {a:1}, GET E + assert metadata for b is GONE (NOT preserved).
  - facet: silent lineage-replace-on-each-call
    observed: 'Re-ingesting an entity with a partial source/target list silently DELETES

      the omitted lineage edges via lineageService.replaceLineagePaths (the verb

      is REPLACE, primary-source confirmed at LineageServiceImpl.java:124-133 in

      batch-I + LineageIngestionRequestProcessor.java:17 the call site). No log,

      no activity event, no payload-level diff in the response. The full reachable-subgraph

      from the establisher''s perspective is rewritten on every ingestion call.'
    expected: 'MERGE semantics OR a deliberate "destructive ingestion" mode flag with audit

      logging of the dropped edges'
    drift_class: silent_destructive_write_on_replace
    provenance: STATIC — primary-source verification in batch-I LineageServiceImpl sidecar implicit_adrs[1] (establisher-keyed
      atomic-rewrite contract) + IngestionService sidecar bugs_limitations_corner_cases[1]. Proposed local probe — POST entity
      E with lineage to A,B, POST E with lineage to A only, GET E lineage + assert the B edge is GONE.
  - facet: default-OFF auth posture means unauthenticated destruction reachable
    observed: 'application.yml:48 ships `auth.ingestion.filter.enabled: false` as the bundled

      default. Under that posture, IngestionDataEntitiesFilter is NOT installed

      and `/ingestion/entities` POST is reachable by any HTTP caller. The service

      itself has NO principal check (IngestionServiceImpl.java:67-74 — no

      SecurityContext consultation, no per-caller scoping). Combined with the

      silent-destructive-write facets, ANY caller able to hit the port can specify

      any `data_source_oddrn` in the payload AND erase that datasource''s metadata

      + lineage by re-ingesting an empty partial state.'
    expected: 'Either ship filter-ON by default, OR document the destruction risk on the

      operator-facing integration docs with a "before going live" hardening

      checklist'
    drift_class: destruction_under_default_off_auth
    provenance: STATIC — primary-source verification in batch-I IngestionService sidecar bugs_limitations_corner_cases[2]
      + security.known_security_gaps[0] + application.yml:48 + LSN-001 (the bundled-default-causes-data-loss case law from
      2026-04). Proposed local probe — start the platform with bundled defaults, POST AlertManager-equivalent destruction
      payload anonymously, GET the resulting empty state.
  - facet: all-or-nothing batch transaction — no per-entity error isolation
    observed: 'IngestionServiceImpl.ingest (line 66 @ReactiveTransactional) wraps the entire

      pipeline (14 processors + 2 direct writes + OTLP export) in ONE transaction.

      A single failing processor (constraint violation in dataset_version, OOM in

      metadata processing, deadlock against another concurrent ingestion) rolls

      back ALL the other entities in the batch. The HTTP response is binary —

      200 OK (all writes committed) or 5xx (everything rolled back). No 207 Multi-Status,

      no per-entity error payload, no DLQ.'
    expected: 'Either documented all-or-nothing contract OR per-entity transaction isolation

      with partial-success response shape'
    drift_class: batch_atomicity_without_signal
    provenance: STATIC — primary-source verification in batch-I IngestionService sidecar bugs_limitations_corner_cases[5]
      + implicit_adrs[0] (single-transaction-per-batch is intentional, but the maintainer-visible consequence is undocumented).
  - facet: soft-delete restore is silent
    observed: 'IngestionServiceImpl.java:127-136 — if an existing-ODDRN entity''s previous

      status was DELETED, the entity is silently un-archived and its relations

      restored (dataEntityInternalStateService.restoreDeletedDataEntityRelations).

      No log.info records the restore. No activity event is emitted

      (ActivityIngestionRequestProcessor only emits DATA_ENTITY_CREATED for new

      entities — restored entities live in `existingEntities`). An operator who

      soft-deleted an entity via UI admin action and didn''t update their collector

      sees the entity silently return on the next ingestion tick.'
    expected: 'Either an admin-tier hold flag preventing re-ingestion of soft-deleted

      entities, OR an activity event on restore so the audit trail records the

      event'
    drift_class: silent_undelete_on_re_ingestion
    provenance: STATIC — primary-source verification in batch-I IngestionService sidecar bugs_limitations_corner_cases[3]
      + invariants[5].
  - facet: MICROSERVICE specific-attributes exclusion is undocumented
    observed: 'IngestionServiceImpl.java:103 — `filter(e -> DataEntityTypeDto.MICROSERVICE

      != e.getValue().getType())`. MICROSERVICE entities are excluded from the

      specificAttributesDeltas list, so they can never trigger BACKWARDS_INCOMPATIBLE_SCHEMA

      alerts via the specific-attributes path, regardless of how their attributes

      change. No comment defends the exclusion; no doc page mentions it. A regression

      that removes the filter would suddenly emit alerts for every microservice

      ingestion.'
    expected: 'Documented carve-out OR a backlog citation linking the filter line to a

      triaged decision'
    drift_class: undocumented_carve_out
    provenance: STATIC — primary-source verification in batch-I IngestionService sidecar bugs_limitations_corner_cases[4]
      + invariants[6].
  - facet: body-buffered-before-auth DoS surface (batch O — filter-layer primary source)
    observed: |-
      IngestionDataEntitiesFilter.java:37-44 — the auth check requires
      the body's `dataSourceOddrn` to resolve the per-datasource TOKEN,
      so the filter MUST materialise + parse the body BEFORE the token
      comparison at line 56. With `spring.codec.max-in-memory-size: 20MB`
      (application.yml:14-15), an attacker can repeatedly send 20MB
      invalid-token payloads — each request forces full body buffer
      + Jackson parse + datasource-by-ODDRN lookup before rejection.
      No rate-limit, no per-IP throttle, no concurrent-request cap.
      Sustained attack saturates heap.
    expected: |-
      Either (a) require `X-Datasource-Oddrn` header so the filter can
      authenticate without body materialisation (breaks the Ingestion
      API contract); OR (b) per-IP rate-limit; OR (c) max-failed-auth
