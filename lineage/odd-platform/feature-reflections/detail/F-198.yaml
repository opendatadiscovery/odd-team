# Notification Settings dialog — product-owner reflection

## product_owner_narrative

The Notification Settings dialog is the operator's single control for **silencing alerts on one data entity for a bounded window**. The pillar (P-07 Active Platform Features, "the platform is itself an actor — detect a condition and raise an alert … per-entity halt config") names "per-entity halt config" as a primary user action; this dialog is its only authoring surface (per system-mission P-07 sub-feature seed "Alerting … per-entity halt config"). An operator on a noisy entity — say a dataset whose nightly job is known-flaky during a migration — opens the dialog and, per alert type, sets a "disable until" timestamp; when the window expires the alert type re-arms automatically (per F-198 feature-flow chain hop 2 evidence: the dialog's footer caption "When the time is up, disabled alert types will turn on automatically"). It is the *write* sibling of F-014's per-entity alert *read* tab — they live on the same data-entity detail surface.

How the operator reaches and uses it. The dialog mounts on the per-entity **Alerts** tab (the `DataEntityAlerts` component), and its trigger button is wrapped in `<WithPermissions permissionTo={DATA_ENTITY_ALERT_CONFIG_UPDATE}>` — so an operator without that permission is intended to see no trigger (per feature-flow chain hop 1 evidence: `DataEntityAlerts.tsx:53`). Opening the dialog clones the trigger and injects an `onClick` that dispatches `fetchDataEntityAlertsConfig({dataEntityId})` to populate the form (per chain hop 2 evidence: `NotificationSettings.tsx:127`). The dialog (`NotificationSettings`, a `DialogWrapper`) renders four `AlertTypeRange` controls — one per alert type (incompatibleSchema / failedDqTest / failedJob / distributionAnomaly), each bound to a react-hook-form `Control<FormData>` and serialised to a numeric epoch via `SerializeDateToNumber` (per chain hops 2-3 evidence: `NotificationSettings.tsx:21-23` + `AlertTypeRange.tsx`). Submitting dispatches `updateDataEntityAlertsConfig({dataEntityId, dataEntityAlertConfig})` → `PUT /api/dataentities/{id}/alert_config` (per chain hop 2 evidence: `NotificationSettings.tsx:50`).

The working parts, as the operator experiences them. The form has **four independent halt-until pickers**; each writes one `*HaltUntil` column. The write reaches a service (`AlertHaltConfigService.saveAlertHaltConfig`) whose repository performs an **`INSERT … ON CONFLICT (data_entity_id) DO UPDATE SET <all four halt columns>`** upsert (per source read `AlertHaltConfigRepositoryImpl.java:50-64`) — so saving is idempotent on the entity but **unconditional**: whatever the form holds at submit time becomes the new row, with no version check and no field-level merge. The PUT endpoint itself **IS** permission-gated — `SecurityConstants.SECURITY_RULES` carries `PUT /api/dataentities/{data_entity_id}/alert_config` at `SecurityConstants.java:304-307` paired with `DATA_ENTITY_ALERT_CONFIG_UPDATE` (per the getDataEntityAlerts sidecar `security.known_security_gaps[1]`), which is the structural opposite of the sibling *read* endpoint (`GET …/alerts`) that has no rule entry at all. The same tab also hosts each alert row's **Resolve/Reopen** button (`DataEntityAlertItem`, hop 4), which mutates `PUT /api/alerts/{alert_id}/status` (per the changeAlertStatus sidecar) with a reopen-conflict guard but no owner-scoping and no confirmation prompt.

The integration story places this dialog inside the alert lifecycle. The halt-until values it writes are *consumed* downstream by the alert-generation path (F-007 / the ingestion `AlertIngestionRequestProcessor`) which suppresses an alert type while its halt window is active — so a misconfigured or silently-blanked halt config means alerts the operator believed suppressed will fire (or alerts they believed armed stay silent). The Resolve button on the same tab is coupled to housekeeping (F-010): manually-resolved alerts are hard-deleted on the next cleanup cycle (per the F-014 sibling reflection narrative + DOC-200), which is what makes the Resolve button's missing confirmation a *destructive* defect rather than a cosmetic one.

Edge cases a product owner would flag in a demo. (1) **Concurrent edit** — two operators on the same entity overwrite each other with no warning, because the write is last-writer-wins at the SQL tier (the feature-flow flagged this `ui_unverified`; this reflection resolves it as confirmed at `AlertHaltConfigRepositoryImpl.java:50-64`). (2) **Failed on-open fetch** — the dialog renders a spinner while fetching but has no error branch, so a rejected fetch drops to an empty form whose submit blanks the server config (feature-flow facet `notification_settings_silent_open_failure_no_fetch_error_handling`). (3) **Permission affordance** — `WithPermissions` is a context provider, not a render-gate (PLT-034 family), so the gating depends on a descendant consulting it and can flash on first render. (4) **i18n** — the dialog title/helper/footer are hardcoded English while the parent trigger button is translated (feature-flow facet, F-198c). (5) **Zero round-trip test coverage** — the only automated coverage is a *mocked* service unit test (`AlertHaltConfigServiceImplTest`); there is no UI test, no `@WebFluxTest` of `updateAlertConfig`, and no integration protocol (IT-027/IT-030 cover the *read* and the *global list*, not this dialog) — so every behaviour below is traced from primary source, not guarded by a passing test.

