notes: |
  Operation vocabulary captured for the lineage-ingestion primitive. Three doc
  + test gaps surface:

    (a) Test: no test asserts the @ReactiveTransactional rollback contract for
        replaceLineagePaths. A failure in batchInsertLineages should roll back
        batchDeleteByEstablisherOddrn — no test pins this.

    (b) Doc: no operator-facing page documents the per-establisher scope (the
        safety net for multi-producer ingestion). A collector author reading
        the OpenAPI spec cannot infer the semantics.

    (c) Code-quality: the empty-input no-op (wasted round-trip) is a low-severity
        defensive-early-return candidate.

