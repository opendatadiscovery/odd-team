cross_references:
  related_sidecars: [odd-platform__java__DataSetController__controller-class__DataSetController]
  retrospectives: [LSN-020]
realism_caveats: |
  This probe verifies the per-endpoint exposure. It does NOT verify whether
  this is actually exploited at scale (a real attacker would need to enumerate
  version_ids from another dataset — feasible since version_id is bigserial
  and sequential across the platform). The "leak" is on the order of "table
  schema + field types + tag list + metadata + term linkage" — i.e. the full
  DataSetStructure payload. No row-level data leaks; ODD does not store
  dataset rows.
