realism_caveats: |
  The probe assumes the DB column has no CHECK constraint forcing
  the six-value enum. Confirmed by grepping migrations — no enum-type
  constraint on data_entity_task_run.status; it is a free-form text
  column populated by IngestionTaskRunStatus.toString().

  The MapStruct-generated mapper at compile time emits a switch case
  per source-enum literal. Whether it throws or silently returns null
  on an unknown source literal depends on MapStruct's NullValueMappingStrategy
  + ValueMappings + the source field being a String (not an enum). In
  THIS mapper the source is the pojo's String `status` field, not an
  enum — so MapStruct emits a String->enum conversion that uses
  Enum.valueOf() under the hood. valueOf() throws IllegalArgumentException
  for unknown literals; the controller's reactive chain has no
  onErrorResume, so the failure surfaces as HTTP 500 via Spring's
  default error handler.

  This probe IS reproducible from the code: the failure mode is
  deterministic. The only question is whether some upstream layer
  (a custom @ValueMapping, a Jackson configuration, a global exception
  handler) intercepts and softens the failure. The probe surfaces the
  ACTUAL observed status_code so the run produces ground truth.
