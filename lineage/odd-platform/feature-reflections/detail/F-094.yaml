- id: H-008
  hypothesis: "When a collector POSTs `/ingestion/entities` (filter ON) with a payload whose `data_source_oddrn` is unregistered, the platform returns a 4xx (the datasource/credential could not be resolved), not a 5xx server error."
  derivation: "Endpoint-shape — a caller supplying an unknown identifier expects a client-error status, not a server-crash status; a security reviewer expects no info-leak in the status differential. Negative-space + response-shape seed."
  seed_source: response-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      When the payload's data_source_oddrn does not resolve (or the fallback
      collector lookup is empty), the filter throws NotFoundException — but the
      parent AbstractIngestionFilter only catches AccessDeniedException to write a
      401. NotFoundException propagates to the default reactive error handler and
      surfaces as 5xx (500). An attacker can therefore distinguish "datasource
      exists, wrong token" (401) from "datasource does not exist" (5xx) — a minor
      info-leak — and a half-configured collector gets a misleading server-error
      status instead of a credential/4xx status.
    evidence:
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: concepts.invariants[6] + bugs_limitations_corner_cases[7]
        cite: "IngestionDataEntitiesFilter.java:43-51 + AbstractIngestionFilter.java:40"
        note: "Only AccessDeniedException → 401; NotFoundException → 5xx (info-leak + misleading status)."
    operator_visible_failure: |
      (a) Operator-debug: a collector pointed at a datasource not yet registered
      gets HTTP 500 ("server is broken") rather than a 4xx telling them the
      datasource/credential is the problem — a confusing on-call signal. (b)
      Security: the 401-vs-5xx differential lets an unauthenticated prober
      enumerate which data_source_oddrns are registered.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-009
  hypothesis: "When the ingestion filter is ON, a collector holding datasource A's token cannot ingest entities into datasource B (cross-tenant write is blocked)."
  derivation: "Multi-tenant deployments expect per-datasource token scoping — a stolen/misused token for A should not authorise writes to B. Negative-space + cross-actor seed."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      The filter resolves the datasource by the PAYLOAD's data_source_oddrn, then
      validates the supplied bearer token against THAT datasource's token (or its
      parent collector's). A token valid for datasource A authenticates only
      payloads naming datasource A; a payload naming datasource B requires B's
      token. So cross-datasource ingestion is blocked AS LONG AS per-datasource
      tokens differ. (The isolation holds only while the filter is ON — which, by
      H-003, it is not, by default.)
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataEntityList.md
        section: tests_coverage_semantic.uncovered_behaviours[cross-tenant] + concepts.invariants[3]
        cite: "IngestionDataEntitiesFilter.java:46-58"
        note: "Token compared to the payload-named datasource's token; cross-tenant write blocked when filter ON and tokens differ. Explicitly noted UNTESTED."
    severity: ~
    confidence: MEDIUM
    routes_to_finding: functional-test-demand
