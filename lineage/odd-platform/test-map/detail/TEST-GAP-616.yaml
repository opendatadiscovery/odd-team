proposed_action: |-
  Unit test on GoogleUserHandler. (a) provider.adminAttribute='emale' (typo) + adminPrincipals=['john@odd.com']. (b) Mock IdToken with claim email='john@odd.com' (the actual email, not the typo). (c) Invoke enrichUserWithProviderInformation. (d) Assert resulting authorities = {USER} (the typo causes token.getClaim('emale') to return null; isAdmin stays false; admin demoted silently). (e) Pin the silent-no-op-on-typo. Future fix introducing claim-name validation (e.g. against a known set) flips assertion.
