- id: H-013
  hypothesis: |
    When one operator deletes an Owner at the same moment another operator (or an
    ingestion call) attaches a new ownership to that same Owner, the platform
    serialises the two so the result is consistent — either the delete is blocked
    by the new ownership, or the new ownership is rejected because the Owner is
    being deleted; it never produces an ownership row pointing at a deleted Owner.
  derivation: |
    Negative-space (concurrency): the cascade-block reads three existence checks
    then writes the soft-delete; a senior engineer asks whether that read-then-
    write is atomic against a concurrent ownership insert (the TOCTOU class).
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      Static analysis shows the cascade-check (3 existsBy* reads, lines 90-91)
      and the soft-delete UPDATE (line 98) run inside one @ReactiveTransactional
      boundary (line 88) but with NO row-level lock (no SELECT FOR UPDATE, no
      Postgres advisory lock on owner_id) and under READ COMMITTED isolation
      (Spring/R2DBC default). The structure is consistent with a TOCTOU window:
      a concurrent POST /api/dataentities/{id}/ownership could insert an
      OWNERSHIP row after the existence read and before the soft-delete commits,
      producing an OWNERSHIP row pointing at a soft-deleted OWNER. Whether the
      window is actually observable depends on R2DBC connection-per-transaction
      semantics, statement timing, and Postgres MVCC snapshot behaviour under
      READ COMMITTED — which require RUNNING the system to confirm, not reading
      it. The Owner branch is the least-bad of the cross-Management cascade family
      (Owner/Namespace/DataSource); F-076 is the structural-class anchor.
      Verdict deferred to a local probe (PENDING-F-019-1).
    evidence:
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: concepts.invariants (cascade-block non-atomic) + coherence_notes (REFACTOR-430)
        cite: "OwnerServiceImpl.java:88-100 (no forUpdate; @ReactiveTransactional under READ COMMITTED)"
        note: "Static evidence of a TOCTOU window; observability requires a concurrency probe."
      - sidecar: '(F-019 feature-flow detail — SHB-093)'
        section: shoebox_extensions_2026_05_26[SHB-093]
        cite: "F-076 (cross-Management cascade TOCTOU structural-class anchor)"
        note: "Owner is the least-bad branch (3-leg @ReactiveTransactional); Namespace is worst (no transaction)."
    probe_id: PENDING-F-019-1
    local_execution_blocked: false
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: "probe PENDING-F-019-1 (local Testcontainers concurrency probe — TOCTOU window observability requires RUNNING the system)"
    routes_to_finding: bug-candidate

