name: DataSource listDto page-vs-count predicate divergence (REFACTOR-425)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-08
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20R** — surfaced by the
  ReactiveDataSourceRepositoryImpl batch-R sidecar's coherence sweep
  (conflicts_surfaced.[0]). The `listDto(page, size, nameQuery)` method
  has DIFFERENT predicates on the page-fetching branch and the
  count-fetching branch when `nameQuery` is non-null. The page query
  uses `DATA_SOURCE.NAME.startsWithIgnoreCase(nameQuery)` (private
  `queryCondition` at ReactiveDataSourceRepositoryImpl.java:156); the
  count query uses the INHERITED base `nameField.containsIgnoreCase(
  nameQuery)` (ReactiveAbstractCRUDRepository.java:243), reached via
  `fetchCount(nameQuery)` at line 80 + the soft-delete base override
  at ReactiveAbstractSoftDeleteCRUDRepository.java:87-89.

  **The pagination math breaks** for any non-null nameQuery. For a
  catalog with datasources named `['snowflake-prod', 'my-snowflake-dev',
  'redshift-prod']` and `nameQuery='snow'`:
    - Page query returns 1 row (only 'snowflake-prod' STARTS WITH
      'snow')
    - Count query reports 2 (both 'snowflake-prod' AND
      'my-snowflake-dev' CONTAIN 'snow')
    - UI renders page.data.size == 1 with page.total == 2 — operator
      sees "1 of 2 results" but cannot reach page 2 (the next-page
      cursor produces empty results because the page query has
      already exhausted the startsWith matches)

  **Operator surface manifestation**: the Management → Datasources tab
  filter input populates `nameQuery`. Operators searching by substring
  see misleading "X of Y" counts; pagination jumps appear broken. The
  bug is invisible on small catalogs (where startsWith and contains
  return similar results) but compounds with catalog size — at 50+
  datasources the discrepancy becomes operationally significant.

  **The fix is a one-line change** at either site — choose one
  predicate and align the other. The natural choice is
  `containsIgnoreCase` (matches the inherited base, matches operator
  intuition about substring search). The alternative (force
  `startsWithIgnoreCase` everywhere) breaks compatibility with the
  inherited count path and would require an override of the parent's
  `nameField` shape.

  **Why the divergence exists**: the private `queryCondition` was
  introduced (likely intentionally) to make the dedicated CTE-pagination
  path narrower than the generic listCondition the count path uses.
  The private helper became out of sync with the inherited base once
  the latter was changed to `containsIgnoreCase`; no test exercises
  the page-vs-count parity. The bug is invisible to the existing test
  suite (`DataSourceRepositoryImplTest`) because no test calls listDto
  with `nameQuery != null` against a catalog populated with names
  containing the query as substring but NOT starting with it.
