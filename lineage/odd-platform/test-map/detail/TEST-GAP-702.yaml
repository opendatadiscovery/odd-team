  - "OwnerServiceImpl.md:security.known_security_gaps.[5] (Soft-deleted owner visible via getOwnerDtoById but hidden from list)"
behaviour: |-
  **`OwnerServiceImpl.getOwnerDtoById` RETURNS SOFT-DELETED OWNERS — `list` HIDES THEM — VISIBILITY ASYMMETRY (service-tier confirmation of deleteOwner sidecar's bugs[6]).** `list` at lines 44-52 calls `ownerRepository.list` which routes through `enrichSelect → listCondition` (inherited from `ReactiveAbstractSoftDeleteCRUDRepository`) adding `deleted_at IS NULL`. `getOwnerDtoById` at lines 102-107 calls `ownerRepository.getDto(ownerId)` which (per ReactiveOwnerRepositoryImpl.java:65-83) does NOT filter on `deleted_at IS NULL` for the OWNER side. A soft-deleted owner is INVISIBLE from `GET /api/owners` but VISIBLE from `GET /api/owners/{id}`. The `.switchIfEmpty(NotFoundException)` at line 105 fires ONLY when the id does not exist at all — not when it's soft-deleted. **If a soft-deleted Owner's name carries PII or sensitive info, the by-id surface leaks it.** Sister of TEST-GAP-628 (which pins the same surface at the controller-tier); THIS batch-S entry pins the SERVICE-TIER PRIMARY-SOURCE explicitly.
