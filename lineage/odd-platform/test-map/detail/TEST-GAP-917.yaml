  (c) `networkError_rendersConnectionErrorBanner_NOT_emptyDonuts`: same as (a) but with network rejection. EXPECTED TO FAIL.
  (d) `genuineEmptyCatalog_rendersEmptyStateExplanatoryCopy_NOT_silentGreyDonuts`: mock successful fetch with empty testResults; assert an explanatory message ("This catalog has no Data Quality tests yet — see <link> to start ingesting"). EXPECTED TO FAIL.

