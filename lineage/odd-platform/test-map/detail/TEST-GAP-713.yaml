behaviour: |-
  **`GET /api/datasets/{id}/dataqatests` RETURNS 404 NOT FOUND FOR A DATASET THAT EXISTS BUT HAS ZERO DATA-QUALITY TESTS — instead of `200 OK` with an empty list.** `DataQualityServiceImpl.java:38-42` throws `NotFoundException` when the `getDataQualityTestOddrnsForDataset` flux is empty (the dataset has no DQ tests associated). This is an unusual REST-API shape — empty collections typically return 200 with `[]`. A UI rendering the "Test reports" tab for a dataset with no defined tests will receive 404 on the test-list call, which it must distinguish from the dataset-not-found 404 returned by sibling endpoints (`DataQualityServiceImpl.java:55-58` for `getDatasetTestReport`). The error messages differ ("Data quality tests for dataset with id %d not found" vs "Dataset {id}"), but a client doing only status-code-based handling treats them identically. The OpenAPI spec at `openapi.yaml:1932-1947` does NOT document the 404-on-empty behaviour. **No test catches this**: `find <odd-platform> -path '*test*' -name 'DataQualityController*'` returned no matches 2026-05-20; the only DQ tests (`SLAColourTest`, `SLAReportTest`, `DataQualityRepositoryImplTest`, `ReactiveDataQualityRunsRepositoryTest`) exercise the calculator/repository tier, not the HTTP boundary's empty-list shape. **Why this matters**: a regression that changes the behaviour from 404 to 200-with-empty (the more conventional REST shape) would silently break any client doing `if (response.status === 404)` to drive empty-state UI; conversely, a regression that adds 404 to OTHER read endpoints (currently 200 with empty payload for the same dataset-with-no-tests case at `getDatasetTestReport` and `getSLA`) would silently shift the API surface. The test pins the asymmetry across the four read endpoints so the maintainer must choose which side the harmonisation moves.
