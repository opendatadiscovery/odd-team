name: Integration Wizard Manifest (classpath META-INF/wizard/*.yaml)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
- P-10
description: |-
  **NEW ENTITY, batch 2026-05-25-ZD** — the wizard manifest is a
  YAML file on the application classpath at
  `META-INF/wizard/*.yaml`. Each manifest describes ONE integration
  surface (Snowflake, Postgres, etc.) and provides:

    - `id` (String) — the wizard identifier (used as the path-param
      on `GET /api/integrations/{id}`)
    - `name` (String) — display name
    - `description` (String) — short description
    - `content_blocks` (List) — ordered sections, each with
      `{title, content, code_snippets[]}`
    - `code_snippets` (per block) — parameterised templates with
      `{template, arguments[]}`
    - `arguments` (per snippet) — `{parameter, name, type:
      enum<INTEGER|STRING|BOOLEAN|FLOAT>, static_value}`; `static_value`
      is the substitution point for `platform_url` (only registered
      static parameter; see related concept)

  ## Lifecycle

  Manifests are loaded ONCE at boot by
  `IntegrationRegistryFactory.createResourceFilesIntegrationRegistry`
  (`IntegrationRegistryFactory.java:26-40`). Spring's
  `PathMatchingResourcePatternResolver` scans
  `classpath*:META-INF/wizard/*.yaml` — the `classpath*:` prefix
  is the multi-jar variant, scanning ALL jars on the classpath.
  Manifests live OUTSIDE this repo by design: vendor jars, docker
  image overlays, or operator-supplied classpath additions
  contribute them. A default-checkout build of
  `<odd-platform-repo>` has ZERO wizard manifests (Glob across the
  entire repo returns no `META-INF/wizard/` directory).

  ## Deserialisation

  Each YAML file is parsed via Jackson's YAMLFactory through
  `IntegrationDeserializer` — a custom Jackson
  `StdDeserializer<IntegrationOverviewDto>` that walks the JSON
  tree and constructs an `IntegrationOverviewDto(preview, contentBlocks)`.

  ## Storage

  The registry is a `TreeMap<String, IntegrationOverviewDto>` keyed
  by `id` with case-insensitive ordering
  (`Comparator.comparing(String::toLowerCase)`). The map is built
  at boot and IS IMMUTABLE at runtime — there is no admin API to
  add/remove wizards.

  ## Read-only by type
  `IntegrationRegistry` interface (`IntegrationRegistry.java:8-12`)
  exposes only `get(String id)` and `list()` — no `add`,
  `remove`, `update`, or `replace` methods exist. The
  immutable-at-runtime commitment is encoded in the type system,
  not just by convention.

  ## Failure modes

  - **Single corrupt manifest aborts boot**:
    `IntegrationRegistryFactory.readManifest` (`:53-61`) catches
    IOException and rethrows as
    `IllegalStateException("Couldn't read wizard manifest: %s")`.
    A single malformed YAML in ANY classpath overlay takes the
    entire application context construction down. No skip-broken
    semantics.

  - **Case-insensitive id collision silently merges (last-wins)**:
    two manifests with same-lowercased ids (e.g. `Snowflake` +
    `snowflake`) collapse into ONE entry. The merge function
    `(o1, o2) -> o2` (`IntegrationRegistryFactory.java:35`) picks
    the later-loaded one. Load order is jar-dependent and
    non-deterministic across deployments.

  ## Audiences

  - Integration authors / custom-collector developers (who
    AUTHOR manifests as YAML files contributed via classpath
    overlays)
  - Platform operators (who CONSUME manifests through the
    Management → Integrations UI)
  - Custom platform packagers (who ASSEMBLE a deployable image
    by combining the platform repo with vendor jars carrying
    wizard manifests)
