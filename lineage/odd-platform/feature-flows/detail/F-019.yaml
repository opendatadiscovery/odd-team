  contributing_nodes_added:
  - odd-platform java OwnerController controller-class:OwnerController
  notes: |-
    THREE new class-level findings + ONE strengthens-by-consolidation
    on existing F-019 facets. Listed in descending architectural
    leverage:

    (1) OWNER_CREATE PERMISSION SIDE-DOOR VIA getOrCreate FROM THREE
    SERVICE-TIER CALLSITES (HIGH severity, NEW FINDING) —
    OwnerServiceImpl.java:38-42 (`getOrCreate` impl: getByName →
    switchIfEmpty → create) is reached from THREE separate callers,
    each gated by a DIFFERENT permission:
    (a) OwnerAssociationRequestServiceImpl.java:57 via
        `POST /api/owner_association_request` — verified via Grep that
        this POST path is NOT in SecurityConstants.SECURITY_RULES;
        reachable by ANY AUTHENTICATED USER (similar to getOwnerList);
    (b) OwnershipServiceImpl.java:52 via
        `POST /api/dataentities/{data_entity_id}/ownerships` — gated
        by DATA_ENTITY_OWNERSHIP_CREATE per SecurityConstants;
    (c) TermOwnershipServiceImpl.java:35 via
        `POST /api/terms/{term_id}/ownerships` — analogous gating.
    A caller holding only DATA_ENTITY_OWNERSHIP_CREATE (or just
    authenticated for the association-request POST) can supply a
    never-seen `ownerName`, the service `getOrCreate` silently inserts
    a new row into OWNER, and the new Owner appears in
    `GET /api/owners` immediately. **The Owner directory is writable
    from THREE permission paths, only ONE of which is documented at
    the live `/permissions` page** (WebFetched 2026-05-25 status 200 —
    OWNER_CREATE: "Allows creating a new owner entity." Permissions
    page is silent on the side-channel). Combined with the no-@ActivityLog
    finding (REFACTOR-426), the side-channel writes are also
    audit-silent. Operator-visible consequence: a caller without
    OWNER_CREATE can spam the Owner directory with arbitrary names.
    Cross-link to F-006 (RBAC) — the side-door is the negative
    counterpoint to F-019's positive owner_to_role hard-delete cascade
    closure. NEW drift facet:
    `owner_create_permission_side_door_via_getorcreate_three_service_tier_callsites`.

    (2) GET /api/owners IS UNAUTHENTICATED-READ AT THE RULE LAYER
    (MEDIUM severity, CLASS-LEVEL CONSOLIDATION) —
    SecurityConstants.SECURITY_RULES[143-147] registers POST + PUT +
    DELETE against `/api/owners*`; the GET `/api/owners` path has NO
    rule (verified by Grep `/api/owners` against SecurityConstants.java
    2026-05-25 — exactly four mutation-path matches, zero GET matches).
    `getOwnerList` (OwnerController.java:30-38) has no `@PreAuthorize`,
    no programmatic auth check, no SecurityRule. Any authenticated
    user under LOGIN_FORM/OAUTH2/LDAP can enumerate the entire Owner
    directory, including names that may carry PII (e.g.
    `alice@acme.com`, `[Pseudonymous Researcher]`, internal team-name
    strings); under `auth.type=DISABLED` the endpoint is anonymously
