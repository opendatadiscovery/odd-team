name: Audit-silence applies at webhook INGRESS only — alert state-transitions ARE audited (refinement to F-007 + F-006)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-09
description: |-
  NEW INVARIANT, batch 2026-05-20S (AlertServiceImpl primary source + cross-batch
  refinement). The "audit-silence" pattern that surfaces across F-006 (RBAC
  mutations) and F-007 (AlertManager webhook) is NOT uniform. This invariant
  refines the prior catch-all "RBAC mutations are unaudited" framing by
  distinguishing TWO sub-shapes:
    (a) FORENSIC SILENCE AT THE INGRESS — no `log.info` / `@Timed` /
        correlation-id capture of WHO POSTed WHAT WHEN to a write endpoint.
        Applies to: AlertManager webhook (POST /ingestion/alert/alertmanager
        per batch P controller-tier + batch S service-tier);
        S2S /ingestion/entities (per batch H IngestionDataEntitiesFilter +
        batch S DataSourceIngestionServiceImpl — only DEBUG log at
        DataSourceIngestionServiceImpl.java:53,62 — most operators do not
        see DEBUG logs).
    (b) STATE-TRANSITION SILENCE AT THE PERSISTENCE — no activity-feed row,
        no @ActivityLog AOP, no programmatic activityService.createActivityEvents
        call when state changes. Applies to: RBAC mutations (Policy, Role,
        Owner directory create / update / delete per the 9-sidecar pattern
        spanning batches E + H + I + N + P + Q + R + S).

  BATCH R + BATCH S REFINEMENT — the AlertManager webhook surface has
  TYPE (a) silence BUT NOT TYPE (b) silence:
    - The webhook INGRESS is unaudited (no log of WHO POSTed; no correlation
      id captured) — F-007 facet `no_idempotency_no_audit` aspect (a).
    - But the resulting alert-state-transitions ARE audited via the activity-
      feed batch save path. AlertServiceImpl.java:309-325 constructs
      ActivityCreateEvent with `systemEvent=true`; activityService.createActivityEvents
      is called at lines 258, 324; these reach the activity table via
      ReactiveActivityRepositoryImpl.save(List<ActivityPojo>) line 57-71
      with `is_system_event=true` discriminator.

  CONSEQUENCE OF THE REFINEMENT: an operator post-incident reconstruction
  of "an attacker forged a Distribution Anomaly alert on entity X" can:
    - SEE the alert row (via /api/alerts) — visible.
    - SEE the `OPEN_ALERT_RECEIVED` activity event with system=true and
      timestamp — visible.
    - CANNOT identify the source of the POST (no log of network origin,
      no log of correlation id, no user identity since the endpoint is
      unauthenticated by design).

  Cross-reference batch R schema-level finding: `activity.data_entity_id`
  is `bigint NOT NULL` with FK to `data_entity(id)` per V0_0_48__add_activity.sql:4,12.
  The activity table STRUCTURALLY ENFORCES "data-entity-scoped events
  only" — non-data-entity events (RBAC, datasource registration, collector
  token rotation) CANNOT physically be stored. AlertManager-derived
  alerts ARE data-entity-scoped (each maps to one entity via the
  `entity_oddrn` label) → they emit through the existing schema. RBAC
  mutations are NOT data-entity-scoped → they are schema-blocked.

  IMPLICATIONS FOR F-006 AND F-007 REMEDIATION:
    - F-006 remediation requires SCHEMA migration FIRST (NULLable
      data_entity_id OR a separate platform_event table) — annotation
      sprinkle would fail at the FK constraint.
    - F-007 remediation can proceed at the INGRESS layer alone — adding
      @Timed observability + log.info at the AlertManagerController +
      DataSourceIngestionController controller method tier closes the
      ingress audit gap. The state-transition audit is ALREADY in place.

  This invariant is the bridge artefact between F-006 and F-007 — it
  resolves the apparent contradiction where the audit-silence pattern
  seemed to apply uniformly across two unrelated features. The unifying
  invariant is "audit applies at the state-transition layer if and only
  if the event has data-entity context"; F-006 mutations lack context
  AND have no ingress log; F-007 webhook payloads HAVE context (per-
  alert entity_oddrn) but lack ingress log.

  Severity: MEDIUM (per-feature remediation paths differ; this invariant
  unblocks the maintainer s mental model for the remediation scope).
