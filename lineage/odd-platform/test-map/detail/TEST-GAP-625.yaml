  - "updateOwner.md says (implicit_adrs.[3]): 'Search-vector refresh is INSIDE the update transaction, not deferred to a background job — updateChangedOwnerVectors × 2 are awaited via Mono.zip inside the @ReactiveTransactional boundary. The choice trades response latency for read-after-write consistency.'"
  - "deleteOwner.md says (bugs_limitations_corner_cases.[2]): 'FTS search vector NOT refreshed on owner delete — OwnerServiceImpl.update calls updateSearchVectors(owner) refreshing BOTH searchEntrypointRepository.updateChangedOwnerVectors and termSearchEntrypointRepository.updateChangedOwnerVectors. OwnerServiceImpl.delete does NOT.'"
  - "Source: OwnerServiceImpl.java:82, 109-114 (update path) + 89-100 (delete path) + ReactiveSearchEntrypointRepository.updateChangedOwnerVectors + ReactiveTermSearchEntrypointRepository.updateChangedOwnerVectors"
