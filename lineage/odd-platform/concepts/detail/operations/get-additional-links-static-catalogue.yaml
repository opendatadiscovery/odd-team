notes: |-
  Endpoint name `links` is reused at two semantically distinct
  scopes — operator-global at /api/links (this operation) and
  per-entity at /api/dataentities/{id}/links (DATA_ENTITY_ATTACHMENT_MANAGE
  gated). The OpenAPI tag is `links` for the global scope;
  `dataEntityAttachment` for the per-entity scope.
