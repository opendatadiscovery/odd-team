discovered_from_entry_point: ui_route:/dataentities/{id}/overview
description: |-
  The per-entity Overview tab is the operator-observable surface "open an
  entity → see everything-about-it on one page" — the default landing
  route for any data entity detail page (per `dataEntitiesRoutes.ts:66-73`
  default path = 'overview'; per F-001 batch J PopularStrip facet, the
  Popular tile click target). The composition is a single React component
  (`Overview.tsx`) that arranges 12+ sub-panels across a two-column
  grid (xs={9} main column + xs={3} sidebar) with conditional rendering
  by entity-class and load-state, each panel wrapped in its own
  `<SectionContainer>` and (for editable panels) its own
  `<WithPermissionsProvider>` with the panel-specific permission set.

  Operator-observable promise (inferred from the live docs Data Discovery
  page + the SectionContainer + skeleton chrome): "Open a data entity and
  see everything we know about it — its identifiers, lineage stats, who
  owns it, what tags it has, what terms it links to, the description,
  attachments, custom metadata, and (for datasets) DQ test report — all
  on one cohesive surface."

  Operator-observable reality, per primary-source `Overview.tsx:1-159`:

  1. The composition has TWO load lifecycles. The top-level
     `<DataEntityDetails>` (F-001 chain hop 1) fetches `details` via
     `fetchDataEntityDetails` and gates Overview's MAIN body on
     `isDataEntityDetailsFetching` (Overview.tsx:52, :151-155). But the
     Attachments panel uses its OWN `useDataEntityAttachments` hook
     (OverviewAttachments.tsx:14) with an independent isLoading /
     isError state. The DQ-report panel is gated on a SEPARATE
     `getDatasetTestReport(dataEntityId)` selector populated by
     `fetchDataSetQualityTestReport` (DataEntityDetails.tsx:68); the
     SLA-report selector is a THIRD lifecycle. A user landing on the
     page sees the skeleton flip to populated MAIN body while
     attachments / DQ-report panels can still be loading or in error.

  2. The right column's DQ panel is gated on
     `isDataset && datasetQualityTestReport?.total` (Overview.tsx:105).
     An entity that IS a dataset but has zero test reports renders an
     entirely missing DQ section — visually indistinguishable from "DQ
     not loaded yet" while the rest of the surface is populated.

  3. Permission gating happens INSIDE the composer per panel via
     `<WithPermissionsProvider>` (Overview.tsx:67, :74, :81, :95, :112,
     :127, :134) — each panel gets its own provider with a DIFFERENT
     allowedPermissions set. There is NO single provider at the
     composer level. A reviewer cannot derive the full permission map
     of the surface from a single grep — they must walk every panel.

  4. The CLASS-CONDITIONAL semantic is non-obvious. `<OverviewStats>`
     iterates `entityClasses` and switches on each class name (SET /
     TRANSFORMER / CONSUMER / QUALITY_TEST / INPUT / RELATIONSHIP /
     ENTITY_GROUP per OverviewStats.tsx:23-83). Default branch returns
     null — an entity with an unrecognised class name or with empty
     `entityClasses` renders NO stats panel at all, silently.

  5. The two-column grid (xs={9} / xs={3} per Overview.tsx:54, :93)
     has NO explicit `md` / `sm` breakpoint overrides. On small
     viewports MUI's xs only collapses if no other breakpoints are
     set — the surface is implicitly assumed desktop-first.
