use_case_coverage:
  verified: 0
  total: 11
  note: |-
    SECOND COVERAGE FRONTIER (verified promises / total promises) = 0/11. F-086 is a
    high-stakes user-facing promise (sign-out semantics, acutely so on shared/public
    workstations) with ZERO of its eleven promises guarded by a test — the feature-flow
    carried related_test_gaps: [] and the test tree has no *Logout* test at all
    (re-verified at reflection time). Four promises are CONTRADICTED (UC-02/04/05/07/09/11),
    three PARTIAL (UC-03/06/08), one PROBE-NEEDED (UC-10), and even the one CONFIRMED
    promise (UC-01, Google/GitHub revoke) has no regression guard — the textbook LSN-030
    hole. Every promise routes to a missing-functional TEST-GAP candidate via the
    reflection's cross_references.functional_test_demands. Full hypotheses + validations
