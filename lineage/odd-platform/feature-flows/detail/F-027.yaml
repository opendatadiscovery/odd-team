terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Mutation chain: initiateFileUpload → INSERT INTO `file` (status
    PROCESSING + uploadId UUID); uploadFileChunk → write chunk file to
    `/tmp/odd/chunks/{uploadId}/{index}`; completeFileUpload → for
    LOCAL: rename chunks to final path under `attachment.local.path`;
    for REMOTE: read all chunks + `DataBufferUtils.join` + PUT to
    MinIO/S3 bucket; UPDATE `file` SET status=COMPLETED + path =
    final-path. deleteFile → DELETE FROM `file` + DELETE physical file
    (storage backend). saveLinks → INSERT INTO `link` for each item.
    updateLink / deleteLink → mutate single row by linkId.
    downloadFile → READ `file` + stream Resource as
    application/octet-stream with `Content-Disposition: attachment;filename=<dto.fileName()>`.
  evidence: |-
    DataEntityAttachmentController.java:31-116 + AttachmentServiceImpl.java:1-89
    + FileServiceImpl.java:33-103 + LocalFileUploadServiceImpl.java:1-79
    + RemoteFileUploadServiceImpl.java:1-141 + LinkServiceImpl.java:31-46
  cardinality_per_call: 1 per file (or N for chunks); 1 per link (or N for bulk saveLinks); 1 page (per list read)
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — confirmed from primary source. No per-trigger multiplier
  observed at the chain level — the chunked-upload protocol's N chunks
  per file are explicit per-trigger calls from the client, not an
  amplification multiplier. The 3-step protocol (initiate → N chunks →
  complete) is intentional state-machine design.
observed_vs_expected:
  facets:
  - facet: LSN-001 canonical surface — chunk staging hard-coded /tmp regardless of REMOTE
    observed: |-
      `FileUtils.java:24` declares `CHUNK_BASE_PATH = "/tmp/odd/chunks"`
      as a HARD-CODED constant. Even when operators run with
      `attachment.storage=REMOTE` and configure S3/MinIO for persistence,
      the chunk staging path still uses `/tmp` (consumed by
      `LocalFileUploadServiceImpl.java:34` AND `RemoteFileUploadServiceImpl.java:55`).
      An in-flight upload (initiate done, chunks uploaded, complete not
      yet called) will FAIL on container restart even with REMOTE
      persistence configured — silent partial-upload data loss for the
      chunk window. This is the LSN-001 partial-remediation gap:
      LSN-001 closed the doc-side loop on the visible default
      (operators now know LOCAL is ephemeral); the code-side residue
      (`CHUNK_BASE_PATH`) is invisible at the YAML level. The
      retrospective's case-law is correctly anchored on the
      consumer-read principle — only reading the implementation
      surfaces this.
    expected: |-
      Either (a) parameterise `CHUNK_BASE_PATH` via a new
      `attachment.chunk.path` config key with a documented default OR
      (b) bake the chunk-staging path into the storage strategy (LOCAL
      = local fs; REMOTE = direct streaming upload without chunk
      staging, OR a separate REMOTE chunk bucket). The fix is a
      coordinated migration; the documented operational consequence
      should be added to the live operator-facing page until then.
    drift_class: attachment_lsn_001_canonical_surface_chunk_staging_node_local_tmp
    provenance: |-
      STATIC — primary-source at DataEntityAttachmentController batch V
      sidecar bugs_limitations_corner_cases[5] + pre_emit_coherence_check
      block + FileUtils.java:24 + LocalFileUploadServiceImpl.java:34 +
      RemoteFileUploadServiceImpl.java:55 + cross-link LSN-001.
      Severity HIGH (LSN-001 class — silent partial data loss on
      container restart).
  - facet: READ endpoints have NO SecurityRule — any authenticated user downloads any file
    observed: |-
      Three READ endpoints (`GET /api/dataentities/{id}/attachments`,
      `GET .../files/uploads`, `GET .../files/{file_id}` download) have
      NO SecurityRule in SecurityConstants.java — they fall back to the
      global authentication filter only. Any authenticated user
      (including the lowest-privilege role) can LIST AND DOWNLOAD files
      attached to ANY data entity, regardless of owner or role. Per the
      sidecar's security.known_security_gaps[0] HIGH-severity finding.
    expected: |-
      Either (a) add SecurityRule entries gating the 3 read endpoints
      on `DATA_ENTITY_ATTACHMENT_VIEW` (new permission) OR (b) document
      explicitly that "attachment contents are read-collaborative
      across the catalog; operators uploading sensitive PDFs should
      treat them as cross-tenant visible". Recommend (a) for sensitive
      attachment use cases.
    drift_class: attachment_read_endpoints_no_security_rule_three_of_ten
    provenance: |-
      STATIC — primary-source at DataEntityAttachmentController batch V
      sidecar bugs_limitations_corner_cases[0] + security.known_security_gaps[0]
      + SecurityConstants.java:247-276 Grep.
      Severity HIGH.
  - facet: mutation endpoints discard dataEntityId — cross-entity privilege escalation
    observed: |-
      Five mutation endpoints (`deleteFile`, `updateLink`, `deleteLink`,
      `completeFileUpload`, `downloadFile`) accept `dataEntityId` in the
      URL path but discard it; the service methods take only `fileId` /
      `linkId` (AttachmentServiceImpl.java:71-88). Authorization on
      `DATA_ENTITY_ATTACHMENT_MANAGE` is granted per-data-entity (`DATA_ENTITY`
      AuthorizationManagerType per SecurityConstants.java:248), so a
      user with MANAGE on entity A but NOT entity B can delete entity
      B's files by issuing `DELETE /api/dataentities/{A}/files/{file_id_of_B}`.
      Same shape for the update + delete link verbs + completeFileUpload
      + downloadFile.
    expected: |-
      Either (a) the service methods take `dataEntityId` + verify the
      file/link belongs to it (BadUserRequestException on mismatch) OR
      (b) the AuthorizationManagerType resolver resolves to the
      file's/link's parent data entity (not the URL's data entity).
      Recommend (a) — explicit cross-check at the service tier.
    drift_class: attachment_mutation_dataentityid_discarded_cross_entity_jump
    provenance: |-
      STATIC — primary-source at DataEntityAttachmentController batch V
      sidecar bugs_limitations_corner_cases[4] + security.known_security_gaps[1]
      + DataEntityAttachmentController.java:65-114 +
      AttachmentServiceImpl.java:71-88 + SecurityConstants.java:248.
      Severity HIGH (cross-entity privilege escalation — REFACTOR-024
      class).
  - facet: filename unsanitised — path-traversal write/read + CRLF header injection
    observed: |-
      File-name is propagated raw from the user-supplied
      `DataEntityUploadFormData.fileName` into:
      (a) storage path — `FileMapper.java:30-31` calls
        `pathConstructor.getFilePath(fileMetadata.getFileName(),
        dataEntityId)`; `LocalFilePathConstructor.java:31-33` returns
        `getFileDirectory(dataEntityId).resolve(fileName).toString()`
        — for LOCAL writes/reads, a filename like
        `../../../etc/odd-secret.txt` resolves outside
        `attachment.local.path`.
      (b) Content-Disposition header on download —
        `DataEntityAttachmentController.java:76-79` emits
        `.header(HttpHeaders.CONTENT_DISPOSITION, "attachment;filename=" + dto.fileName())`
        — RFC 6266 quoting is absent; a filename containing CRLF could
        inject headers.
      No sanitization, no path-traversal rejection, no NUL-byte filter,
      no length cap, no quoting/encoding of the header value.
    expected: |-
      Sanitize fileName at initiateFileUpload — reject `../`, `/`, `\\`,
      NUL bytes, control characters, leading dot; cap length; quote
      Content-Disposition per RFC 6266; consider hashing-as-storage-name
      to fully decouple user-supplied name from storage path.
    drift_class: attachment_filename_unsanitised_path_traversal_crlf_header_injection
    provenance: |-
      STATIC — primary-source at DataEntityAttachmentController batch V
      sidecar bugs_limitations_corner_cases[1] + security.known_security_gaps[2]
      + FileMapper.java:30-31 + LocalFilePathConstructor.java:31-33 +
      DataEntityAttachmentController.java:76-79.
      Severity HIGH.
  - facet: no MIME validation, no quota, no rate limit
    observed: |-
      No MIME-type check, no extension allowlist, no magic-byte sniffing
      exists in the upload path (verified across AttachmentServiceImpl +
      FileServiceImpl + LocalFileUploadServiceImpl + RemoteFileUploadServiceImpl).
      The doc claims "no restriction on file type" — the code confirms
      this is literally true. On `downloadFile` the response is forced
      to `application/octet-stream` (mitigates browser-side execution
      ON the in-platform download path) — but stored files are also
      reachable via direct S3/MinIO URL or filesystem path if operators
      expose the storage backend, where the original extension governs
      MIME serving. No per-user or per-data-entity quota; the only
      ceiling is `attachment.max-file-size` PER FILE. No rate-limit on
      any endpoint — single-user upload-storm saturates `/tmp` or
      REMOTE-bucket bandwidth.
    expected: |-
      Either (a) add MIME allowlist + per-user / per-entity quota +
      rate-limit OR (b) document the unbounded surface explicitly so
      operators understand the storage-fill DoS surface. Recommend (a)
      for production-grade deployments; the OSS default may continue
      with (b).
    drift_class: attachment_no_mime_validation_no_quota_no_rate_limit
    provenance: |-
      STATIC — primary-source at DataEntityAttachmentController batch V
