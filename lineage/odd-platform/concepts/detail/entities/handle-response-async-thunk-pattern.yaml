name: handleResponseAsyncThunk Pattern (project's standardised redux-thunk wrapper)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
- P-05
description: |-
  **NEW CONCEPT, batch 2026-05-19J** — the project's UI-wide pattern for async data
  fetching. **All** async data-fetching is standardised through `handleResponseAsyncThunk`
  (a thin wrapper around Redux Toolkit's `createAsyncThunk` at
  `redux/lib/handleResponseThunk.ts:19-43`). The wrapper bakes in the
  success-toast / error-toast / `rejectWithValue(AppError)` triad. **Grep counts**:
  `setSuccessOptions` occurrences across 15 thunk files; `switchOffErrorMessage`
  14 occurrences across 10 thunk files; **ZERO direct `createAsyncThunk` usage
  outside this helper** (project does not call `createAsyncThunk` from any non-helper
  file). The helper's TYPE SIGNATURE makes `setSuccessOptions` and `switchOffErrorMessage`
  first-class options of the thunk-factory (`HandleResponseAsyncThunkOptions<ThunkArg>`
  interface at `handleResponseThunk.ts:14-17`). **Selective error-toast suppression**
  (`switchOffErrorMessage: true`) is the project's pattern for handling "expected
  failure" loads — 10 thunks share this stance: fetchDataEntityDetails,
  fetchTermDetails, fetchPolicy, fetchDataEntityAlertList, fetchDatasetStructure,
  fetchAlerts, fetchActivity, fetchPolicyList, fetchDataEntityLineage,
  fetchDataQualityTest. The decision is encoded in the type: setting the flag true
  is an opt-in; the rest of the codebase reads the field on the error path
  (`if (!options.switchOffErrorMessage) { await showServerErrorToast(...); }`).
  Errors are PERSISTED in store EVEN WHEN the toast is suppressed —
  `switchOffErrorMessage: true` only short-circuits the toast, not `rejectWithValue`.
  **The wrapper does NOT propagate `requestId`** — Redux Toolkit's `createAsyncThunk`
  ships built-in `requestId` tracking that lets reducers reject stale fulfilled
  actions, but `handleResponseAsyncThunk` does not propagate or check it. A user
  clicking through entities A → B → C rapidly can land in a state where A's
  late-arriving response overwrites C's fresh data in `state.dataentities.byId`.
