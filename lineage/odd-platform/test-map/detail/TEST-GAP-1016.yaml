proposed_action: |-
  Three-test wedge (extended in batch ZL):
  (a) Filters.UserLabel.test.tsx (UI) — assert the rendered filter
  label is the operator-honest text. RED today on the current
  "User" rendering; GREEN after the en.json + es.json + ch.json +
  fr.json + ua.json + hy.json values are renamed to "Entity Owner"
  (or analogous in each locale). Pins the cross-locale uniform
  correction.
  (b) Filters.UserDropdown.shows.owners.test.tsx (UI integration) —
  render Filters with mocked fetchOwnersList returning a known
  owner set + mocked fetchUsersList returning a different known
  user set; click the User filter; assert the dropdown options
  match the OWNERS set (not the USERS set). Pins the current
  Category-F drift; flips assertion direction after the wiring
  is corrected.
  (c) ReactiveActivityRepositoryImplUserFilterTest (backend) —
  assert the SQL binding remains USER_OWNER_MAPPING.OWNER_ID
  (regression pin on current behaviour, so renaming the label
  does NOT silently flip the SQL semantics).
  (d) ReactiveActivityRepositoryImplUserMappingRetroactiveTest
  (backend) — insert an activity row with created_by='alice' at
  time T1 when alice maps to owner-42; at time T2 reassign alice
  to owner-43; filter by userIds=[42] and userIds=[43] — assert
  the historical row appears under [43] (the new mapping),
  pinning the retroactive-rewrite forensic drift.
  Optional (e): add an "Actor" filter that binds to the ACTIVITY's
  CREATED_BY column directly; pin its presence and SQL behaviour
  separately. This is the documented-fix track if operators want
  both axes.
