- id: H-011
  hypothesis: "When an operator sets LDAP `admin-groups` against a directory where the relevant group has more members than the directory's server-side size limit, every member of the admin group is reliably promoted to ADMIN on each login."
  derivation: "Negative-space + LDAPSecurityConfiguration sidecar — `LdapTemplate.setIgnoreSizeLimitExceededException(true)` silently truncates group searches; an operator expects deterministic admin promotion."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      `LdapTemplate.setIgnoreSizeLimitExceededException(true)` (LDAPSecurityConfiguration.java:131) makes
      group-membership searches that exceed the directory's size limit TRUNCATE silently rather than error.
      Combined with `DefaultLdapAuthoritiesPopulator` resolving the user's group memberships, a user whose
      admin-group membership row falls beyond the truncation cutoff could be silently omitted from the returned
      authorities and thus demoted to USER on that login — non-deterministically, depending on directory paging.
      The sidecar flags this as a security gap but marks the exact triggering conditions as uncovered. Whether,
      and under what directory size/paging configuration, an admin is actually demoted requires a local LDAP
      harness with a large group to observe — routed to a probe rather than asserted.
