behaviour: 'View-count side effect — no test asserts that `data_entity.view_count`
  is incremented exactly once per successful call (or NOT incremented when the entity
  does not exist). The side effect is invisible to the existing happy-path read-back.
  STRENGTHENED batch I — the DataEntityServiceImpl sidecar confirms PRIMARY-SOURCE
  composition: the @ReactiveTransactional boundary wraps {repository.getDetails(id)
  + incrementViewCount(id) + 5-way Mono.zip enrichment + 4-way Mono.zip details-enrichment}
  (DataEntityServiceImpl.java:196-209). The +1-per-call contract is empirically proven
  by P-001 / P-004 but unverified by JVM tests. STRENGTHENED batch ZA — the DataEntityDetails
  sidecar (the platform-wide canonical LSN-017 source-code anchor at file:line 56-64)
  PRIMARY-SOURCE CONFIRMS that the UI tier currently violates the +1-per-call contract
  by dispatching TWO `fetchDataEntityDetails` per page-open — producing TWO backend
  invocations of getDetails, each correctly incrementing +1, yielding +2 cumulative per
  page-open. The composite regression-pin must therefore test BOTH layers: (a) backend
  +1-per-call (test pins the existing service contract); (b) UI +1-per-mount (test pins
  the LSN-017 fix at DataEntityDetails.tsx:63). Without both, a fix at either layer
  leaves the other unverified. TEST-GAP-836 is the batch-ZA UI-tier primary-source anchor.'
