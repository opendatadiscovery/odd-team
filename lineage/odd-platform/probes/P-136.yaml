realism_caveats: |
  The probe is a HIGH-impact security verification. If Shape A
  succeeds (pg_sleep delay observed), the platform has a critical
  SQL injection at the highlight endpoint that could be turned
  into data exfiltration, DDL, or service disruption.

  The probe does NOT test:
  - Filter-element-bound injection (e.g. tag name containing single quote)
  - The tsquery parser-level DoS (covered structurally by the
    facets sidecar's bugs_limitations_corner_cases[4])
  - Injection via the dataset version's schema columns (a deeper
    integration test on the DatasetVersionRepository contribution)

  Authentication assumes LOGIN_FORM on odd-minimal; under DISABLED
  no /login call is needed but the same payload sequence applies.

  If both assertions PASS (no injection observed), the probe has
  proven the path is SAFE despite the .formatted() shape — likely
  because tsQuery's split-on-space + `:*` + `&`-join post-processing
  happens to strip the dangerous characters. Recording the proof
  IS the contribution; the methodology should NOT rely on the
  post-processing as a security measure. Fix anchor regardless:
  parameterise the ts_headline binding via jOOQ's safe API
  (`field("ts_headline(?, ?, ?, ?)", literal("english"), val(text), val(tsQuery), literal("HighlightAll=true"))`).

  If either assertion FAILS, route the finding to a HIGH-severity
  refactoring scope IMMEDIATELY.
