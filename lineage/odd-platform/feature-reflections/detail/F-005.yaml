      lookup filters `WHERE DATASET_VERSION.ID = datasetVersionId` only
      (ReactiveDatasetVersionRepositoryImpl.java:129); the `datasetId` argument is used only
      in the NotFoundException message text. A request to
      `GET /api/datasets/{anyId}/structure/{validVersionIdForAnotherDataset}` returns the
      OTHER dataset's structure. The diff endpoint has the same defect (filters
      `DATASET_VERSION.ID IN (first, second)` only — cross-dataset diff is possible). No
      SecurityRule covers these paths; they fall through to authentication-only
