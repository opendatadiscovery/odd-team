proposed_action: |-
  Stand up the Management-tier UI test infrastructure baseline: (a) add Vitest + React-Testing-Library + jsdom configuration to `odd-platform-ui/vitest.config.ts` (or extend the existing Vite config); (b) author `redux-test-utils.ts` providing `renderWithRedux(<Component />, { initialState })` helper that wires the slice infrastructure required by every Management component; (c) author `permissions-mock.ts` providing `mockUsePermissions(perms: Permission[])` to short-circuit `hasAccessTo` for permission-gated affordance testing; (d) author `api-mock.ts` providing per-thunk stub responses for `policyApi`, `roleApi`, `ownerApi`, `collectorApi`. With the baseline shipped, the 23 per-component test gaps in batch Q (TEST-GAP-634 through TEST-GAP-656) all become single-file authoring tasks. The infrastructure cost is one engineer-week; the per-test cost drops to <1hr each. The pillar's test-tier activation depends on this baseline.
