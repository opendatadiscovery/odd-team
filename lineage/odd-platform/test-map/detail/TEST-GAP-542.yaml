proposed_action: |-
  Testcontainers test. (a) Pre-seed tags ["alpha", "beta"]; soft-delete "alpha" via the service. (b) listByNames(["alpha", "beta"]) → returns ONLY "beta". (c) Assert this matches the partial-unique-index predicate `WHERE tag.deleted_at IS NULL` used by ingestData (lines 199-210).
