        note: "Single 'No matches found' copy for both onboarding-empty and filtered-zero."
      - sidecar: odd-platform__ts__react-component__component__TermSearch.md
        section: concepts.invariants
        cite: "TermSearch.tsx:71-86 (PageWithLeftSidebar; shared with Search.tsx)"
        note: "Layout + session model consistent with the Discovery search surface."
    operator_visible_failure: |
      The platform-consistency half is a strength; the onboarding half is the gap. A
      new operator's first encounter with the glossary is an empty table labelled
