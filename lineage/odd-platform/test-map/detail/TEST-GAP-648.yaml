proposed_action: |-
  Add `list_refetches_on_create_delete_completion_but_not_on_update_completion` to `OwnersList.test.tsx`. Method (a): mount with `isOwnerCreating: false`, render; flip `isOwnerCreating: true → false` via redux state update; assert one new `fetchOwnersList({page: 1, size})` dispatch. (b): same for `isOwnerDeleting`. (c): mount with `isOwnerUpdating: false`; flip `isOwnerUpdating: true → false`; assert NO new dispatch (the asymmetry pin). (d): set `query: 'foo'`; flip `isOwnerCreating: true → false`; assert NO refetch (the `!query` guard). The asymmetry pin freezes the contract; a future fix that adds `isOwnerUpdating` to the dep array would break (c), forcing explicit re-authoring AND a discussion of whether update completion should clobber the search context.
