- id: H-007
  hypothesis: "When the platform is under high authenticated request load, the connection pool is sized so that authorization resolution (the per-request RBAC JOINs) is not the first thing to saturate."
  derivation: "Cross-pillar: concept invariant `authorization-hot-path-getcurrentuserroles-per-request-no-cache` states `spring.r2dbc.pool.max-size` is the upper bound and the auth path saturates the pool first under load (lines 44-47)."
  seed_source: cross-pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      The hypothesis's PREMISE (that the pool would be sized to protect auth throughput) is false in the
      shipped default, and that confirms the underlying claim: the authorization hot path runs on the
      primary pool and IS the first thing to saturate. Every authenticated request resolves
      getCurrentUserRoles -> getCurrentUserPolicies = 2 uncached DB JOINs (a 5-table + a 2-table JOIN) on
      the primary pool BEFORE any business query (concept invariant lines 40-47). At the default ceiling
      of 10 on the primary pool, ~5 concurrent fully-RBAC requests can consume the pool on auth-resolution
      alone (2 borrows/request). The ceiling is therefore the hard authorization-throughput limit, exactly
      as the feature flow's `authorization_hot_path_bound_by_pool_ceiling` drift_class states.
    evidence:
      - sidecar: null
        section: "concept invariant authorization-hot-path-getcurrentuserroles-per-request-no-cache"
        cite: "authorization-hot-path-...yaml:40-47"
        note: "2 JOIN roundtrips per authorized request, uncached; pool max-size is the upper bound; saturates auth-resolution first."
      - sidecar: "R2DBCConfiguration"
        section: "performance.hot_paths[0]"
        cite: "R2DBCConfiguration.java:27-52 + concept-catalog reference"
        note: "Primary pool serves every reactive jOOQ call including the authorization hot path."
    operator_visible_failure: |
      Under load, request latency degrades on AUTHORIZATION RESOLUTION — not on the business work the
      operator is watching. An operator profiling slow requests sees the controller/service spans look
      fine and the time disappearing into DB-acquire waits, with no pool gauge (H-008) to reveal that the
      pool is the bottleneck. Raising replica count makes H-003 worse (more pools at PG). The correct
      lever is BOTH `spring.r2dbc.pool.max-size` (undocumented — H-006) AND a request-scoped/short-TTL
      auth cache (tracked PLT-063) — the operator can find neither from the product.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

