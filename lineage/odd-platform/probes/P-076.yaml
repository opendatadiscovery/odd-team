expected_outcome: |
  Stress question (name_behavior_pairs — "Edit datasource" vs REPLACE-not-MERGE,
  reached FROM the UI): the updateDataSource backend sidecar's P-043 establishes
  that the PUT is a full-form REPLACE — an omitted/blank field nulls the column.
  This probe confirms that hazard is reachable through the actual DataSourceForm
  edit modal: open "Edit datasource" on a data source that HAS a stored
  description, change ONLY the Name, leave the Description field exactly as the
  modal pre-filled it, and — separately — clear the Description field. Hypothesis:
  the modal submits whatever Description it holds; if the operator clears
  Description (or it was not pre-filled), Save nulls the stored description.
  The operator gets no warning that a blank field overwrites. This is the UI
  half of the data-loss-on-partial-edit class.
