  - "OwnersList.md says (tests_coverage_semantic.uncovered_behaviours.[7]): 'Search-while-paginating race — typing a search query while the user is mid-scroll triggers BOTH a debounced fetch (page 1, query) AND potentially an in-flight fetchNextPage (page N, prior query). No test asserts which response wins or that the store correctly reconciles. Out-of-order responses would mix unrelated owners into the list.'"
