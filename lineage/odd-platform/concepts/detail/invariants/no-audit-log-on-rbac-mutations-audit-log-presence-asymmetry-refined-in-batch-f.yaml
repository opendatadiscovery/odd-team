name: No-audit-log on RBAC mutations (audit-log presence asymmetry — REFINED in batch
  F + further confirmed batch H + batch L extension)
canonical_in_docs: false
canonical_candidate: true
description: |-
  **REFINED INVARIANT, batch 2026-05-12F** (originally surfaced in batch
  E as 'codebase-wide hygiene gap' — REFINEMENT: the gap is NOT codebase-wide; the
  platform has a 2-tier audit story). **Tier 2 (RBAC mutations) — UNAUDITED**: no
  Role / Policy / Owner mutation emits an audit signal. 3-sidecar primary source from
  batch E: (a) `RoleServiceImpl.create/.update/.delete` (lines 39-92) emit NO `@Slf4j`
  log calls, publish NO events, and INSERT into NO audit table; (b) `PolicyServiceImpl.create/.update/.delete`
  (lines 62-95) have the same absence; (c) `OwnerServiceImpl.create` is missing `@ActivityLog`
  annotation. The platform's activity feed (`/api/activity` per batch A getActivity)
  covers DataEntity-side activity but does NOT extend to Role / Policy / Permission
  / Owner-directory mutations. **Tier 1 (DataEntity mutations) — AUDITED (REFINED
  in batch F)**: batch F's primary-source updateStatus + createOwnership sidecars
  CONFIRM that DataEntity mutations DO emit audit signals: (i) `DataEntityInternalStateServiceImpl.changeStatusForDataEntities`
  (lines 73-98) PROGRAMMATICALLY constructs and emits `DATA_ENTITY_STATUS_UPDATED`
  activity events with `oldState`/`newState` JSON payloads (not via AOP `@ActivityLog`
  because the mutation is bulk and oldState must be captured per-pojo before the in-place
  mutation — explicit per implicit_adrs.[4]); (ii) `OwnershipServiceImpl.create` is
  annotated `@ActivityLog(event = OWNERSHIP_CREATED)` and `OwnershipCreatedActivityHandler`
  captures BEFORE/AFTER ownership state for the data-entity. **The 2-tier audit asymmetry**:
  DataEntity-scoped writes (status / ownership / description / business-name / tags
  / terms / metadata / alert-config / DataEntityGroup membership) are TIER-1 AUDITED
  — these are the data-content changes operators expect to see in the activity feed.
  RBAC-scoped writes (Policy / Role / Owner-directory) are TIER-2 UNAUDITED — these
  are the authorization-model changes that should be MORE audited, not less. The asymmetry
  is the INVERSE of what a security-conscious operator would expect. **Consequence**:
  a hijacked admin account or any S2S API-key holder (which gets ADMIN by default
  per S2sAuthenticationFilter — REFACTOR-108) can rewrite the authorization model,
  create new high-privilege Roles, attach them to existing Owners through other endpoints,
  or replace Policy bindings — and leave no trail in the platform's logs. Highest-leverage
  audit gap in the RBAC surface. **Batch H — SQL PRIMARY-SOURCE CONFIRMATION at the
  persistence layer**: ReactivePolicyRepositoryImpl batch-H sidecar confirms the persistence-layer
  silence on the RBAC mutation path. ZERO log lines on any of {create, update, delete}.
  ExceptionUtils.translateDatabaseException emits one `log.error` ONLY on non-uniqueness
  DB errors (ExceptionUtils.java:34). The repository carries no `@Slf4j` import beyond
  the inherited base class. The 3-sidecar batch-E pattern is now 4-sidecar (3 service-layer
  + 1 repository-layer) at the SQL primary source. By contrast, batch H's ReactiveAlertRepositoryImpl
  + ReactiveDataEntityRepositoryImpl sidecars confirm that DataEntity-side and Alert-side
  activity emission lives at the SERVICE layer (by composition, not by inheritance);
  the repositories emit nothing but the service layer takes care of activity events
  via @ActivityLog AOP and programmatic ActivityCreateEvent construction. The 2-tier
  asymmetry is uniform across HTTP / service / persistence layers.

  **BATCH L EXTENSION — TIER-1 EXCEPTIONS DISCOVERED**: the
  refinement-claim that Tier-1 (DataEntity-scoped writes) is uniformly
  audited is contradicted at three specific sub-surfaces uncovered by
  batch L primary sources. These TIER-1 EXCEPTIONS are entity-side
  writes that ALSO lack audit:

    - **DEG membership writes** (addDataEntityToDEG +
      deleteDataEntityFromDEG; `DataEntityServiceImpl.java:387-438`) carry
      NO `@ActivityLog` despite the `DATA_ENTITY_RELATION_UPDATED` enum
      value existing at `ActivityEventTypeDto.java:12` (reserved but
      never fired). An operator auditing "who placed entity X into the
      Finance Domain on date Z" via `ActivityController.getActivity`
      sees NOTHING. Pairs with the
      write-collaborative-DEG-no-deg-side-authorization invariant.

    - **Custom-metadata writes** (upsertMetadataFieldValue + create/delete;
      `DataEntityServiceImpl.java:287-305, 245-283, 307-326`) carry NO
      `@ActivityLog` despite the `CUSTOM_METADATA_CREATED / UPDATED /
      DELETED` enum values existing at `ActivityEventTypeDto.java:17-19`
      (all three reserved but never fired). Pairs with the
      external-metadata-overwrite-silent-no-origin-check invariant —
      the no-audit gap compounds the no-origin-check gap: EXTERNAL
      values can be silently overwritten with no audit record of who
      did it or when.

    - **Term-unlink no-op DELETE emits an activity event with BEFORE=AFTER
      state** — the existing observation from `deleteTermFromDataEntity`
      (`TermAssignmentActivityHandler` re-queries state regardless of
      whether the row was deleted) is a DIFFERENT-shaped audit defect:
      activity events ARE emitted, but they cannot distinguish real
      removals from no-op DELETEs. Audit-trail-NOISE rather than
      audit-trail-ABSENCE.

  The Tier-1 partial-audit story is now: **Tier 1a (audited)** — status,
  ownership, description, business-name, tags, term-link, alert-status
  changes; **Tier 1b (unaudited despite reserved enum values)** — DEG
  membership writes, custom-metadata writes; **Tier 1c (audit-noisy)**
  — term-unlink (events fire on no-op). The original "DataEntity
  mutations are AUDITED" claim is partly false; a future refinement
  should rename this invariant from a 2-tier story to a 4-tier story
  (1a / 1b / 1c / 2).
