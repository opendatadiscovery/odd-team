behaviour: |-
  **HIGH — `TagServiceImpl.getOrInjectTagByName` (lines 88-94) is the SIBLING of `getOrCreateTagsByName` (lines 79-86) with IDENTICAL signature but FUNDAMENTALLY DIFFERENT race semantics: `getOrCreateTagsByName` uses `bulkCreate` (fail-on-duplicate → `UniqueConstraintException`), `getOrInjectTagByName` uses `ingestData` (upsert with `ON CONFLICT (name) WHERE deleted_at IS NULL DO UPDATE` → silent race resolution returning the existing row). The contract: under concurrent novel-name submissions, BOTH callers of `getOrInjectTagByName` must receive the SAME tag id; the race is silenced.** No test pins the upsert-silenced contract. A future refactor that "unifies" the two paths into `bulkCreate` (perhaps for code-deduplication) would break the Collector ingestion path: every concurrent Collector pushing the same novel tag name would surface `UniqueConstraintException`, with no caller-side retry.

  **Primary-source chain**:
  - `TagServiceImpl.java:88-94` (`getOrInjectTagByName`): `divideTagsByExistence` → `reactiveTagRepository.ingestData(tagsToCreate)` → union with existing tags.
  - `ReactiveTagRepositoryImpl.java:180-213` (`ingestData`): `INSERT INTO tag (name, ...) VALUES (?), (?), ... ON CONFLICT (name) WHERE deleted_at IS NULL DO UPDATE SET name = excluded.name RETURNING *`.
  - **Conflict-target**: `Indexes.TAG_NAME_UNIQUE.getFields()` (`:199-202`) — dynamically resolved from the jOOQ-generated handle.
  - **Conflict predicate**: hardcoded `WHERE TAG.DELETED_AT.isNull()` (`:207`) — matches the partial-index predicate at `V0_0_64__remove_is_deleted_field.sql:105`.
  - **Race protection** (per ReactiveTagRepositoryImpl.md:stress_findings.E1): the partial unique index `tag_name_unique` serialises by-name conflicts at the PostgreSQL B-tree level. Two parallel TXs inserting the same novel name: one wins, one routes to `DO UPDATE`. Both callers get the SAME `tag.id` via RETURNING.

  **Why the test is HIGH**:
  - **Critical for the Collector path** (`ExternalTagIngestionRequestProcessor.java:104` calls `getOrInjectTagByName` for every batch).
  - A concurrent UI write + Collector ingest of the same novel name: `getOrCreateTagsByName` (UI path) surfaces `UniqueConstraintException` (per TEST-GAP-540); `getOrInjectTagByName` (Collector path) silently returns the existing id. The TWO PATHS ARE INTENTIONALLY ASYMMETRIC — this is the architectural choice that the test must lock in.
  - **The methods have identical names + Java signatures**: a maintainer reading the interface (`TagService.java:14-36`) cannot distinguish which has which race semantic without reading both implementations. The CI test is the only stable contract documentation.

  **The bridging contract**:
  - Two parallel `getOrInjectTagByName(Set.of("novelTag"))` calls → BOTH return a `Flux<TagPojo>` containing ONE TagPojo with the SAME id. The partial unique index serialises; one INSERT, one UPDATE; both have the same RETURNING.
  - The sister `getOrCreateTagsByName(Set.of("novelTag"))` under the same concurrency → ONE caller returns the tag id; the OTHER caller surfaces `UniqueConstraintException` (per TEST-GAP-540).
  - This asymmetry IS the design; the test pins it.
