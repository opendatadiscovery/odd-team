proposed_action: |-
  Add `ReferenceDataCascadeNonAtomicTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `deleteParentDataEntity_orphansLookupTableRow_pinsCascadeIncompleteness` — seed a Lookup Table linked to DataEntity 100; DELETE `/api/dataentities/100`; assert the lookup_tables row still exists pointing to soft-deleted DataEntity 100; assert the physical table `lookup_tables_schema.n_X__name` still exists. PIN the orphan persistence.
  2. `deleteLookupTable_failureBetweenPhysicalDropAndCatalogDelete_leavesInconsistentState` — mock the JOOQ executor to throw a transient error AFTER the DROP TABLE succeeds but BEFORE tableRepository.delete completes; call `DELETE /api/referencedata/table/{id}`; assert the physical table is GONE but the lookup_tables row REMAINS; verify the catalog/data-store inconsistency. PIN the non-atomic contract.
  3. `getLookupTableById_afterOrphanedState_returnsCatalogRowButFollowUpReadOfRowDataFails` — pin the read-tier consequence: after the cascade-incompleteness or the non-atomic failure, GET `/api/referencedata/table/{id}` returns the lookup_tables row; subsequent GET `/api/referencedata/table/{id}/data` raises a Postgres error because the physical table is gone.
  4. `getReferenceDataSearchResults_afterOrphanedState_continuesToSurfaceOrphanedTable_pinsListReadAsymmetry` — pin the LIST-side read behaviour: the listing surfaces the orphaned table in search results because the search-entrypoint row was not cleaned up.

  Add a `// REGRESSION-PIN — Two cascade-incompleteness classes on the Lookup Tables controller: (a) parent-DataEntity-delete leaves orphan child rows; (b) two-transaction delete is non-atomic. A REFACTOR adding ON DELETE CASCADE or saga-style rollback compensations will break tests #1 and #2 respectively.` comment block.

  Pair with REFACTOR-NNN: unify the two-step delete OR add boot-time orphan cleanup. Pair with DOC-NNN: surface the orphan-on-parent-delete behaviour.
