notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` and
  `feature-flows/` for "searchId" + "session UUID" + "saved search" —
  found `entitie:search-session`, `invariant:search-facets-bearer-token-shaped-no-user-binding`,
  `operation:search-catalog-faceted-session-as-server-state`. None
  describe the DRIFT at the URL-PARAM-NAME layer specifically. The
  existing concepts pin the schema/service/controller bearer-token
  semantic; this new invariant pins the OPERATOR-FACING URL drift
  that is the FIRST encounter point with the semantic.

  STRENGTHENS the existing search-facets-bearer-token-shaped invariant
  by adding the UI-route-layer evidence. Adds the operator-visible
  consequences (bookmark fragility, cross-user share exposure, tab
  drops session) as concrete UX manifestations of the schema gap.

  Class membership: LSN-020 (Category F drift class — input name
  promises one semantic, implementation provides another). Same shape
  as `dashboard-title-filter-binds-ownership-title-not-dataset-name`
  (the Title filter LSN-020 instance). Operator-facing surface
  variant.
