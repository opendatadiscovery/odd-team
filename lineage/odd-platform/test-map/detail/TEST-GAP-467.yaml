proposed_action: |-
  Testcontainers-Postgres + WireMock-S3 integration test. Configure attachment storage REMOTE; insert ~5 DELETED data entities with associated file rows. Configure WireMock to hang on DELETE for 5s. Invoke DataEntityHousekeepingJob.doHousekeeping. Assert (a) the call blocks for ≥5s waiting on .block(), (b) after WireMock returns 500, the entire transaction is rolled back (verify by SELECT count(*) FROM data_entity WHERE status='DELETED' returns the same N rows as before), (c) log.error captures the exception at the outer manager. The test pins the hang+rollback contract; promotes to a fix-required regression when .block(Duration) timeout lands.
