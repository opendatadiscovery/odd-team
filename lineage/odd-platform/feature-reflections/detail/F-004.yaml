        section: security.known_security_gaps[1]
        cite: "feature-flows/detail/F-004.yaml:797-833 (slice-6 measurement) + probes/P-009.yaml:151-167"
        note: "execution closed by browser+framework, not by app; SVG/CSS/href vectors unmeasured"
