  proposed_fix_anchor: "AbstractNotificationSender.java:24-29 — read Retry-After on 429 and apply a bounded client-side rate-limit / token bucket; OR coalesce bursts of alerts on the same entity into one message."
- hypothesis_id: H-009
  severity: HIGH
