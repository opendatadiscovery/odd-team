security_aggregate:
  overall: MEDIUM
  auth_modes_relevant: []
  ingestion_filter_relevance: N/A
  authorization_consistency:
    verdict: N/A
    detail: |-
      Handlers run inside the wrapping `ActivityAspect` reactive flow on
      @ActivityLog-annotated business methods, OR are invoked directly by
      `ActivityIngestionRequestProcessor.process` (S2S ingestion path).
      The handler interface itself carries no auth concept. Authorization
      is inherited from the wrapping context: the @ActivityLog method's
      own @PreAuthorize (e.g.
      `DataEntityServiceImpl.upsertBusinessName` carries
      `@PreAuthorize(DATA_ENTITY_BUSINESS_NAME_UPDATE)`); the ingestion
      processor inherits the S2S filter at the controller boundary.
  owner_scoping:
    verdict: N/A
    detail: |-
      Handlers read data_entity / ownership / tag / term state to produce
      JSON snapshots. They do not enforce caller ownership; they trust the
      wrapping context to have done so.
  strengths:
  - |-
    @ReactiveTransactional wrapping at the aspect makes audit emit atomic
    with the business mutation — no partial-state (mutation succeeded but
    audit didn't) is structurally possible (ActivityAspect.java:42, 62)
  - |-
    Snapshot-differ shape lets future maintainers extend audit coverage
    by adding a single @Component class (no orchestrator change)
  weaknesses:
  - |-
    **JSON-string equality, not semantic equality** (ActivityAspect.java:86):
    a field-order change in a *ActivityStateDto class (Lombok upgrade, IDE
    field reorder, `@JsonPropertyOrder` introduction) silently changes
    `oldState` bytes for identical underlying state — every active diff
    comparator emits a spurious activity. Conversely, two semantically-
    different states that serialize to identical JSON silently NOT emit.
    Severity MEDIUM (audit-trail truthfulness depends on JSON byte-stability)
  - |-
    **System-event auth-context auto-degradation** (ActivityServiceImpl.java:46-49):
    when no SecurityContext is present (ingestion thread, scheduler,
    DISABLED-mode anonymous), the `switchIfEmpty` fallback writes
    `created_by = NULL` SILENTLY — no warning logged, no metric, no
    fail-fast. The resulting ActivityPojo is permanently anonymous in
    the audit trail. Severity MEDIUM (forensics — operator cannot
    distinguish 'unattributable system event' from 'lost SecurityContext
    via reactive boundary')
  - |-
    **Concurrent oldState capture race** (handler-tier, see new invariant
    activity-handler-concurrent-oldstate-capture-race): two parallel
    @ActivityLog mutations on the same data entity both capture the SAME
    pre-mutation oldState; the second handler's diff records wrong
    attribution. Discoverable as "the audit log shows X changed twice"
    even though only one change happened. Severity HIGH at scale
  - |-
    **Multi-id default-throws-at-runtime**: 16 of 18 concrete impls
    inherit the throwing default for `getUpdatedState(parameters,
    List<Long>)`. Current code dispatches only DATA_ENTITY_CREATED to
    this path, but a future @ActivityLog passing a multi-id parameters
    bag for ANY other event throws `UnsupportedOperationException` at
    first subscription. Severity MEDIUM (latent regression class)
  cross_file_inconsistencies:
  - |-
    Three ActivityEventTypeDto values (DATA_ENTITY_OVERVIEW/METADATA/SCHEMA/
    RELATION_UPDATED, CUSTOM_METADATA_CREATED/UPDATED/DELETED, OPEN/RESOLVED_
    ALERT_RECEIVED) are not covered by any handler under
    service/activity/handler/. Some are handled via direct
    `createActivityEvents` calls bypassing the aspect (Alert events from
    AlertServiceImpl.applyAlertActions); others are dead. No CI-time check
    asserts complete coverage.
  contributing_files:
  - ActivityHandler.md
  - ActivityServiceImpl.md
  evidence:
  - ActivityHandler.md:concepts.invariants.[0,1,4,5,6]
  - |-
    ActivityServiceImpl.md:concepts.operations.[10] (linear-scan dispatch
    with RuntimeException on miss — handler missing surfaces at first
    invocation as 500)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    Linear-scan handler dispatch — `ActivityServiceImpl.getActivityHandler`
    (`:260-264`) iterates all 17-18 handler beans calling `isHandle(eventType)`
    until one returns true. Average dispatch cost ~9 isHandle calls. Runs
    twice per @ActivityLog method invocation (once for getContextInfo,
    once for getUpdatedInfo). No caching, no event-type-to-handler lookup
    Map.
  - |-
    Per-handler DB reads — each `getContextInfo` AND each `getUpdatedState`
    typically issues ONE DB read against the affected entity's repository
    (e.g. `dataEntityRepository.get(dataEntityId)`). Two reads per
    @ActivityLog method invocation, in addition to the wrapped business
    mutation's own DB ops.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Each handler invocation runs once per @ActivityLog method invocation,
      sequentially in the reactive chain. No batching at the handler tier.
      The multi-id path exists (`getUpdatedState(parameters, List<Long>)`)
      but only 2 of 18 impls override it; the rest throw
      UnsupportedOperationException.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless beans — instances scale horizontally. Per-call cost is
      bounded by the underlying entity repository's read cost; no in-memory
      cache, no per-instance counter.
  strengths:
  - |-
    Two-snapshot pattern with `oldState == newState` filter at
    ActivityAspect:86 — idempotent same-value writes do NOT emit redundant
    activity rows (the diff is empty, so the emit is skipped)
  - |-
    Reactive Mono/Flux signature — non-blocking on the wrapped business
    method's thread
  weaknesses:
  - |-
    **O(N) linear dispatch per invocation** (N=18) — each @ActivityLog
    mutation incurs ~9 isHandle predicate calls × 2 (for context + updated)
    = ~18 calls. Low absolute cost (microseconds) but a quietly recurring
    overhead on every audit-emitting mutation. A future Map<EventType,
    ActivityHandler> would O(1) the lookup. Severity LOW
  - |-
    **Per-handler 2 DB reads per @ActivityLog method** — for high-throughput
    paths (e.g. bulk-update tags), the activity emission cost equals or
    exceeds the underlying mutation cost. Severity LOW (deployment-dependent;
    the handlers are inside the wrapping TX so the reads are TX-cheap)
  - |-
    **Multi-id batch path exists but only 2/18 impls support it** —
    ActivityIngestionRequestProcessor uses the path for DATA_ENTITY_CREATED;
    other bulk update paths fall back to N×single-emit which is N×2 DB reads.
    A future bulk operation that emits N OWNERSHIP_UPDATED events would do
    2N DB reads instead of 2; refactoring 16 handlers to support multi-id
    is a non-trivial change. Severity LOW (no current high-throughput
    multi-id user)
  cross_file_inconsistencies: []
  contributing_files:
  - ActivityHandler.md
  - ActivityServiceImpl.md
  evidence:
  - ActivityHandler.md:concepts.invariants.[2] + downstream_side_effects (DB
    reads from each handler; pattern uniformity across impls)
  - |-
    ActivityServiceImpl.md:concepts.operations.[10] (linear-scan dispatch
    cost characterisation)
notes: |-
  Promoted to a first-class entity in batch VAL-LSN-019-B because the
  handler-tier mechanism is load-bearing for the Activity Feed feature and
  was previously implicit (mentioned in the Activity Feed concept's
  contributors but not its own entry).

  The name 'ActivityHandler' is the canonicalisation candidate's
  proposal target — see canonicalisation_candidates entry
  `activity-event-state-differ-vs-activityhandler-name-drift`. The
  interface should be renamed to `ActivityStateSnapshotter` or
  `ActivityStateDiffer` to match its actual contract (read-only
  state-capture, not event-handling). Until then, document the name
  trap in the feature page.
