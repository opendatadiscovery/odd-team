proposed_action: |-
  Add `NotificationSubscriberPublicationNameDDLInjectionRegressionPinTest`. Three test methods:

  1. `registerPublication_publicationNameContainsQuotedSQL_reachesDDLString_pinsCurrentBypass` — unit test injecting a `WalProperties` with `publicationName='odd"; DROP TABLE alert; --'`. Stub the JDBC `Statement.execute(...)` and capture the SQL passed in. Assert the captured SQL literally contains `DROP TABLE alert` (proves the injection reaches the JDBC layer). PINS the current vulnerability.
  2. `registerPublication_publicationNameMatchesPGIdentifierRules_acceptsHappyPath` — unit test injecting `publicationName='odd_alert_publication'`; assert the captured SQL is the well-formed `CREATE PUBLICATION odd_alert_publication FOR TABLE public.alert`. Confirms valid-input acceptance.
  3. `registerPublication_publicationNameContainsCRLF_reachesDDL_pinsLogInjection` — sister test: `publicationName='odd_alert\nLOG INJECTED LINE'`; assert the captured DDL contains the embedded newline. PINS the log-injection sibling surface.

  Pair with REFACTOR-NNN: add `validatePublicationName(String)` (and sister `validateReplicationSlotName(String)`) enforcing PG identifier rules + length cap + fail-fast at boot if invalid. The TEST-GAP test method #1 should then be UPDATED to assert the boot-time exception rather than the captured SQL — converting the test from "pin the current bypass" to "pin the fix".

  Coherence note (LSN-018 Rule 6): This finding does NOT contradict any existing artefact. It is NET-NEW because no prior TEST-GAP names the publication-name DDL injection vector. Sister TEST-GAP-173 (replication-slot rename → disk exhaustion) is the only adjacent finding; both share root cause "notifications.wal.* keys are operator-supplied identifiers reaching Postgres without validation".
