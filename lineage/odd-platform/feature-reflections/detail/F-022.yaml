      Overview from the Test-reports tab (and 6 other tabs); the API would serve the
      forensic DQ data, but the operator can never reach the screen that requests it.
      The forensic preservation the backend pays for is undone at the UI for the
      human operator (a non-UI API caller still gets it). The contradiction is real;
