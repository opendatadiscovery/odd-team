gap_id: TEST-GAP-112
category: missing-edge-case
criticality: CRITICAL
node_ids:
- odd-platform java CounterTimeSeriesExtractor config-key-consumer:metrics.storage@L20
surfaced_by:
- CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[0]
- CounterTimeSeriesExtractor@L20.md:security.known_security_gaps.[0]
behaviour: Read/write tenant-id label asymmetry on empty-string. Write side `AbstractTimeSeriesExtractor.java:60`
  uses `if (tenantId != null)` (empty string PASSES — writes `tenant_id=""`). Read
  side `ExternalMetricReader.java:111` uses `StringUtils.isNotEmpty(tenantId)` (empty
  string FAILS — omits the tenant filter). Operator supplying `ODD_TENANT_ID=` (empty,
  not unset) writes series tagged `tenant_id=""` but reads query across all tenants.
  Multi-tenant guarantee silently breaks.
test_files_existing:
- odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ingestion/PrometheusMetricsIngestionTest.java
  (covers happy path; does NOT exercise tenantId='' edge case)
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ingestion/PrometheusTenantLabelAsymmetryTest.java
  name: metricsTenantId_emptyString_writesLabelButReadsDoNotFilter
evidence:
- 'CounterTimeSeriesExtractor@L20.md says: ''Write side AbstractTimeSeriesExtractor.java:60
  uses if (tenantId != null): an empty string PASSES the guard and writes a tenant_id=""
  label. Read side ExternalMetricReader.java:111 uses StringUtils.isNotEmpty(tenantId):
  an empty string FAILS the guard'' (severity HIGH)'
- 'concepts.yaml:entities[Multi-Tenant Configuration (odd.tenant-id)].security_aggregate.weaknesses.[0]
  verbatim: ''Read/write tenant-id label asymmetry on empty-string (HIGH severity)'''
cross_references:
