evidence:
  - "AppToolbar.md says (bugs_limitations_corner_cases.[0]): 'Navigation tabs are rendered unconditionally with NO permission gating — every authenticated user sees every tab including Management. ToolbarTabs.tsx:34-82 (no useAppSelector(getGlobalPermissions) predicate around any tabs entry; all 9 tabs always present).'"
  - "AppToolbar.md says (security.known_security_gaps.[0]): 'Management / Alerts / Activity / etc. tabs are rendered to ALL authenticated users regardless of permission set — the <ToolbarTabs> enumerator does not consult getGlobalPermissions. severity: MEDIUM'"
  - "ToolbarTabs.md says (tests_coverage_semantic.uncovered_behaviours.[5]): 'Every authenticated user (regardless of Role / Permission / feature-flag state) sees ALL 9 tabs — security; HIGH; There is no test asserting that a READ_ONLY user sees the same tabs as an ADMIN; the tab visibility model is structurally unconditional.'"
  - "AppToolbar.md says (batch-ZJ bugs_limitations_corner_cases.[1]): 'no <WithPermissionsProvider> wrapper around the Management tab — every authenticated user (and every anonymous caller under DISABLED) sees the Management tab and can click into it; backend authorization gates whatever they try to do, but the tab presence leaks the existence of an admin surface'"
  - "Glob verified: zero AppToolbar*.test.* / zero ToolbarTabs*.test.* files under odd-platform-ui/src (run 2026-05-26)"
