chain:
  - hop: 1
    node: "odd-platform ts components/Management/Management.tsx react-component:Management"
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      Management.tsx:8-22 — the section shell mounts at App.tsx:62 under
      `<Route path={managementPath()}/*` />`. Renders a
      `<WithPermissionsProvider allowedPermissions={[Permission.OWNER_ASSOCIATION_MANAGE]} resourcePermissions={[]}>`
      around a Grid container holding ManagementTabs (sidebar, xs=3)
      and ManagementRoutes (content, xs=9). NO route-level
      RestrictedRoute, NO redirect-on-deny, NO auth predicate on the
      shell itself. The outer permission-provider publishes
      OWNER_ASSOCIATION_MANAGE as the default permission context to
      every descendant.
    unresolved: true
  - hop: 2
    node: "odd-platform ts components/Management/ManagementTabs/ManagementTabs.tsx react-component:ManagementTabs"
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      ManagementTabs.tsx:14-50 — composes a 9-entry AppTabItem[] list:
      Namespaces, Datasources, Integrations, Collectors, Owners, Tags,
      Associations, Roles, Policies. Each entry is a managementPath()
      link. Associations is the SOLE entry carrying a `hidden:
      hideAssociations` flag (line 42-43), derived from
      `!hasAccessTo(Permission.OWNER_ASSOCIATION_MANAGE)` (lines 14-17).
      The other eight entries have no `hidden` flag — every authenticated
      user, including users with zero Management-tier permissions, sees
      eight tab labels and can click any of them.
    unresolved: true
  - hop: 3
    node: "odd-platform ts components/Management/ManagementRoutes/ManagementRoutes.tsx react-component:ManagementRoutes"
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      ManagementRoutes.tsx:23-156 — the React Router v6 Routes block
      mounts 10 sub-routes (namespaces, datasources, collectors,
      owners, tags, associations/*, roles, policies, policies/:policyId,
      integrations/*) + a default `<Navigate to='namespaces' replace />`
      at line 151. Per F-105's documented chrome-level reachability gap,
      every sub-route is wrapped in either a per-route
      WithPermissionsProvider (8 sub-routes, context-only, non-blocking)
      or a RestrictedRoute (1 sub-route — associations/* at line 101-110,
      the SOLE working rendering gate) or NOTHING (integrations/* at
      line 150 — relies on the outer Management.tsx context).
    unresolved: true
observed_vs_expected:
  facets:
    - facet_id: management_tab_label_visibility_leaks_admin_surface_existence_to_every_authenticated_user
      drift_class: management_tab_label_visibility_leaks_admin_surface_existence_to_every_authenticated_user
      severity: MEDIUM
      observed: |-
        ManagementTabs.tsx:14-50 hides the Associations tab from users
        lacking OWNER_ASSOCIATION_MANAGE (line 42-43 `hidden:
        hideAssociations`), but does NOT hide the other eight tab
        labels (Namespaces / Datasources / Integrations / Collectors /
        Owners / Tags / Roles / Policies). Every authenticated user
        sees the tab label "Policies" — reconnaissance information
        for a non-admin user that an admin surface exists for that
        platform-tier resource. The pattern is asymmetric:
        Associations is hidden when forbidden; every other tab is
        VISIBLE when forbidden. Compounded by F-105: clicking the
        visible label deep-links to the route, which renders the full
        list (per F-105 chrome-level reachability finding).
      expected: |-
        Either (a) the tab visibility for each label honours the
        corresponding sub-area's create/update/delete permission set
        (matching the Associations pattern), making the sidebar
        operator-tier-aware; OR (b) the read-collaborative posture is
        documented and the asymmetry between Associations and the
        other eight is explicitly justified (live `/features/management`
        doc page Cornerstone-3 caveat); OR (c) the Associations
        carve-out is removed and every tab is uniformly visible,
        accepting that the sidebar advertises the platform's admin
        surface catalog to every reader.
      evidence:
        - "ManagementTabs.tsx:14-17 (hideAssociations derivation)"
        - "ManagementTabs.tsx:42-43 (the SOLE `hidden:` flag, on Associations)"
        - "ManagementTabs.tsx:19-50 (the 9-tab definition)"
      operator_visible_consequence: |-
        A non-admin user lands at /management → ManagementRoutes.tsx:151
        redirects to /management/namespaces, the sidebar shows 8 admin
        tabs plus a hidden Associations, the user can click "Policies"
        and read the policy catalog (per F-105).
      ui_unverified: false
    - facet_id: outer_provider_owner_association_manage_leaks_into_integrations_sub_area_via_context_fallback
      drift_class: outer_provider_owner_association_manage_leaks_into_integrations_sub_area_via_context_fallback
      severity: MEDIUM
      observed: |-
        Management.tsx:9-12 seeds the outer WithPermissionsProvider
        with `allowedPermissions={[OWNER_ASSOCIATION_MANAGE]}`. Every
        ManagementRoutes sub-route except `/integrations/*` overrides
        this context with its own per-route WithPermissionsProvider
        (ManagementRoutes.tsx:29-149). The `/integrations/*` route at
        line 150 mounts `<Integrations />` WITHOUT any
        WithPermissionsProvider wrapper. Any `usePermissions().hasAccessTo()`
        call deep in the Integrations sub-tree (none today — but a
        future permission-gated wizard affordance) resolves against
        the OWNER_ASSOCIATION_MANAGE context — the wrong context for
        integration features. An admin holding INTEGRATION-tier
        permissions but lacking OWNER_ASSOCIATION_MANAGE would see
        integration affordances DENIED.
      expected: |-
        Either (a) wrap Integrations in its own
        WithPermissionsProvider with an integration-relevant
        permission set (mirroring the pattern used by every other
        sub-route in ManagementRoutes.tsx); OR (b) document the
        outer-context fall-through as a deliberate architectural
        choice (no integration permissions exist today; today the
        gap is benign); OR (c) refactor WithPermissionsProvider so
        the absence of an inner override does not silently route
        permission checks against an unrelated outer context.
      evidence:
        - "Management.tsx:9-12 (outer provider seed)"
        - "ManagementRoutes.tsx:150 (integrations route with NO provider)"
        - "Integrations.tsx:10-17 (Routes wrapper, no permission HOC)"
      operator_visible_consequence: |-
        Today's INTEGRATION surface has no permission gates (per F-033),
        so the gap is latent — but the day someone adds an
        INTEGRATION_CONFIGURE permission to a wizard step, every
        check fires against OWNER_ASSOCIATION_MANAGE instead, creating
        a surprising deny-by-default UX. Cross-link to F-105 facet
        `integrations_sub_area_has_no_permission_context_at_all`.
      ui_unverified: false
    - facet_id: management_section_uses_fixed_3_9_grid_no_responsive_breakpoint_no_collapse_for_narrow_viewports
      drift_class: management_section_uses_fixed_3_9_grid_no_responsive_breakpoint_no_collapse_for_narrow_viewports
      severity: LOW
      observed: |-
        Management.tsx:13-19 uses `<S.Container container wrap='nowrap'>`
        with a fixed xs=3 sidebar + xs=9 content. There is no responsive
        breakpoint (no md=/lg= variant) and no hamburger / collapse
        affordance on narrow viewports. ManagementTabs is rendered
        vertically (AppTabs `orientation='vertical' type='menu'` per
        ManagementTabs.tsx:58-59). On a narrow viewport (mobile / tablet
        portrait / split-pane operator workflow) the 3-column sidebar
        crushes the tab labels and the 9-column content pane becomes
        too narrow for the dense Datasources / Collectors / Policies
        item rows.
      expected: |-
        Either (a) introduce a responsive breakpoint that collapses
        the sidebar into a hamburger drawer below a threshold viewport
        width; OR (b) the Management section is intentionally
        desktop-only and the live docs say so (Cornerstone-3 caveat).
      evidence:
        - "Management.tsx:13-19 (fixed xs=3/xs=9 grid, no breakpoint)"
        - "ManagementTabs.tsx:57-62 (vertical AppTabs)"
      operator_visible_consequence: |-
        Operators working on a laptop split-pane (browser + collector
        logs) experience the Management UI as cramped; phone-based
        ops have no usable Management surface.
      ui_unverified: true
      ui_unverified_reason: |-
        The exact narrow-viewport breakage threshold + the AppTabs
        styling at small widths depend on shared MUI / theme tokens
        not read in this UI pass. Confirmed at /enrich time.
