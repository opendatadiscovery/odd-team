proposed_action: |-
  Add `WebhookNotificationSenderNoSSRFGuardRegressionPinTest`. Boot-test parametrised cases:

  1. `configBootsWithRFC1918URL_beanInstantiatedSuccessfully_pinsSSRFSurface` —
     - `@SpringBootTest` with property `notifications.receivers.webhook.url=http://10.0.0.5/internal`.
     - Assert the context loads without error.
     - Assert the `WebhookNotificationSender` bean is present.
     - PINS the current acceptance of RFC1918 URLs.

  2. `configBootsWithAWSIMDSURL_beanInstantiated_pinsAWSCredentialExfiltrationSurface` —
     - Property `notifications.receivers.webhook.url=http://169.254.169.254/latest/meta-data/iam/security-credentials/odd-platform-role`.
     - Assert context loads, bean exists.

  3. `configBootsWithFileScheme_beanInstantiated_pinsLocalFileScheme` —
     - Property `notifications.receivers.webhook.url=file:///etc/passwd`.
     - Assert context loads, bean exists (the JDK HttpClient will reject at send-time, but boot accepts).

  4. `configBootsWithLocalhostURL_beanInstantiated_pinsLoopbackAcceptance` —
     - Property `notifications.receivers.webhook.url=http://localhost:8500/v1/kv/`.
     - Assert context loads, bean exists.

  5. `configBootsWithRFC1918URL_failsValidation_confirmsFixDirection` — (UPDATE once REFACTOR-NNN lands)
     - After REFACTOR-NNN: assert context fails to load with `IllegalStateException` mentioning "RFC1918".

  Pair with REFACTOR-NNN (boot-time validation) and DOC-GAP-NNN (SSRF posture docs).

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP names the boot-time SSRF acceptance. Sister gap TEST-GAP-808 covers the SlackNotificationSender side. No contradiction.
