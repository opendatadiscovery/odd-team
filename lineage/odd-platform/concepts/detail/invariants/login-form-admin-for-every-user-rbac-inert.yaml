mitigations_unimplemented:
- |-
  Code-side: wire AuthorizationCustomizer into LoginFormSecurityConfiguration.java
  similar to OAuth/LDAP siblings (`.authorizeExchange(new AuthorizationCustomizer(
  permissionService, extractors))`). The change makes SECURITY_RULES active under
  LOGIN_FORM and the ADMIN-for-all hard-code at line 81 becomes the lone bypass
  surface (still LOGIN_FORM-specific but contained to authority not authorization
  wiring).
- |-
  Code-side: replace the hard-coded `true` at line 81 with per-user role logic.
  Today every LOGIN_FORM user is ADMIN; a future iteration could parse `user:pass:role`
  triples from the credential string OR look up the user in the Owner directory.
- |-
  Doc-side: add to /enable-security/authorization a clear precondition: 'The
  Policies/Permissions/Roles/Owners framework is wired only in OAUTH2 and LDAP
  modes. Under LOGIN_FORM and DISABLED, RBAC is INERT and every authenticated user
  can call every endpoint.'
- |-
  Code-side: boot-time fail-fast guard — if `auth.type=LOGIN_FORM` AND default
  credentials (`admin:admin,root:root`) AND non-loopback bind, throw a clear
  `IllegalStateException` rather than silently accepting the shipped insecure
  defaults.
notes: |-
  STRENGTHENING + NEW INVARIANT captured in batch 2026-05-20X via the
  LoginFormSecurityConfiguration config-class sidecar. The pre-existing
  canonicalisation_candidate (login-form-without-authorizationcustomizer-refactor-073-validated)
  was single-sidecar evidence at the config-key-consumer layer; this invariant
  promotes that evidence to multi-sidecar triangulation at the config-class
  layer + the sibling SecurityConfiguration contrast points.

  Cross-cutting connections:
    - REFACTOR-185 (DISABLED-mode anonymous-bypass batch T 19-sidecar) — same
      effective end-state via different mechanism (DISABLED uses .anyExchange().permitAll();
      LOGIN_FORM uses hard-coded ADMIN + absent AuthorizationCustomizer)
    - REFACTOR-073 (login-form-without-authorizationcustomizer) — this invariant
      IS the consolidated REFACTOR-073 with config-class layer primary source
    - provider-null-cross-mode-bleed — under LOGIN_FORM the provider=null bleed
      compounds with the ADMIN-for-all; a LOGIN_FORM 'alice' AND an LDAP 'alice'
      both produce provider=null AND both are ADMIN under LOGIN_FORM, so the
      bleed pairs with no per-user RBAC distinction
    - LSN-001 + LSN-002 case-law precedents — operator-discipline-as-mitigation
      is the only line of defence

  Three DOC-NNN candidates flow:
    (a) /enable-security/authorization needs the precondition statement
    (b) /enable-security/authentication/login-form needs the RBAC-inert warning
    (c) Code-side fail-fast on shipped-default-credentials + non-loopback bind
