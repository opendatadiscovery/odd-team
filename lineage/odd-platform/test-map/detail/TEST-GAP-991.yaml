behaviour: |-
  **`DELETE /api/datasetfields/{id}/terms/{term_id}` returns 204 No Content but the term may REMAIN VISIBLE in the linked-terms tab** — when the term is linked via BOTH (a) explicit POST /terms (manual link) AND (b) `[[namespace/name]]` marker in the description body (description-link), there are TWO `dataset_field_to_term` rows. The DELETE filters on `IS_DESCRIPTION_LINK.isFalse()` (`TermRelationsRepositoryImpl.java:179`) — removing ONLY the manual row. The description-link row survives.

  **Operator-visible failure**:
  - User clicks 'X' on a term tag in the UI.
  - UI dispatches DELETE.
  - Backend returns 204.
  - UI removes the tag from local state (it was "deleted").
  - User refreshes the page (or another user opens the field).
  - The term list re-fetches from the backend.
  - The description-link row is returned by the GET endpoint.
  - The term REAPPEARS in the linked-terms tab.

  Operator's mental model: "I deleted the term but the platform won't let me — it keeps coming back." The actual remedy (edit the description and remove the `[[ns/name]]` marker) is undocumented; the operator has no signal from the API or UI that the term is description-linked.

  **Why HIGH**:
  - **Operator-trust erosion**: "delete succeeded but term is still there" reads as platform malfunction. Repeated occurrences erode confidence in the platform's correctness.
  - **Cross-pillar coupling (P-01 × P-06)**: dataset-field metadata (P-01) and term-linkage (P-06) intersect at the `dataset_field_to_term` table; the dual-source-of-truth model isn't surfaced at either pillar's doc.
  - **The endpoint description is incomplete**: live docs read "Delete term from current dataset field terms list" — does NOT warn that this removes only manual links.
  - **Cross-class effect**: a sibling `addDatasetFieldTerm` adds a manual row even if a description-link already exists (`onDuplicateKeyIgnore` short-circuits the manual insert); the asymmetry is: ADD creates one row OR no-ops; DELETE removes one row OR no-ops; but the description-link row is INVISIBLE to both operations from the term-tab perspective.
  - **Probe P-155 pins this directly**.

  Distinct from TEST-GAP-295 (term-linking side-channel through description) and TEST-GAP-288/290 (other term-linkage gaps) — those are about ADDING term links via description; this gap is about FAILING TO REMOVE them via the explicit DELETE endpoint.
