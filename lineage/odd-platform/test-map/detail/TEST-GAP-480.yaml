proposed_action: |-
  Testcontainers integration test. (a) Create data entity with description `"Refer to [[finance:Customer]]"` — `finance:Customer` does NOT yet exist. (b) Query `SELECT count(*) FROM data_entity_unhandled_term WHERE namespace_name='finance' AND name='Customer'` returns 1. (c) Create term `finance:Customer`. (d) Query `SELECT count(*) FROM data_entity_to_term WHERE term_id=? AND is_description_link=TRUE` returns 1 (auto-materialised). (e) Query `SELECT count(*) FROM data_entity_unhandled_term WHERE term_id=?` returns 0 (consumed). LOCKS the staging + auto-resolve contract.
