surfaced_by:
- createPolicy.md:tests_coverage_semantic.uncovered_behaviours.[4]
behaviour: 'Under `auth.type=DISABLED`, `POLICY_CREATE` is bypassed entirely — `anyExchange().permitAll()`
  short-circuits the entire SECURITY_RULES registry. Any caller able to reach the
  platform on a DISABLED deployment can POST /api/policies and create a MANAGEMENT/ALL
  policy. Combined with TEST-GAP-218 (DISABLED bypass on POST /api/roles), the full
  RBAC escalation chain is open: create MANAGEMENT/ALL policy → create role attaching
  it → bind to attacker-controlled owner.'
