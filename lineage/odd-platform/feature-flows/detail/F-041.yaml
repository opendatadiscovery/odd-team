amplification_factor: |-
  4 HTTP calls per SPA mount (whoami + features/active + appInfo + links)
  + 1 page-render of the toolbar chrome + 0..1 redirect-issue on logout
  click + 0..1 cache-mutate on language switch. Tab clicks dispatch 0..1
  thunk (Catalog + Dictionary mint a fresh search/term-search session)
  + 1 history push for the other 7 tabs.
amplification_note: |-
  The toolbar's amplification factor is multiplied by the per-tab user
  click rate (a power user clicks Catalog/Dictionary 20+ times per session,
  each minting a NEW server-side search-id with no de-duplication or
  cleanup — see ToolbarTabs.tsx:107-126 + downstream search/term-search
  endpoints). Orphan search-id rows accumulate at the rate of 1 per click;
  housekeeping eviction governed by F-010 SearchFacetsHousekeepingJob
  (default 30 days TTL).
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render — the global navigation chrome (toolbar + 9 tabs + info menu
    + user cluster) renders above every authenticated route. The chrome is
    visible to every authenticated user AND every anonymous caller under
    DISABLED. Composes 4 external-call hops on mount (whoami + features/active
    + appInfo + links) + 0..1 redirect-issue on logout click + 0..1 cache-mutate
    on language switch + 0..1 thunk dispatch per Catalog/Dictionary click.
  evidence: |-
    AppToolbar.tsx:50-120 (the chrome layout) + ToolbarTabs.tsx:128-135 (the
    9-tab strip) + AppInfoMenu.tsx:71-122 (the info popup) + AppToolbar.tsx:35-37
    (the logout redirect) + SelectLanguage.tsx:28-33 (the language cache mutation)
    + ToolbarTabs.tsx:107-126 (the Catalog / Dictionary thunk dispatch).
  cardinality_per_call: 1 page-render per route mount; per-click side effects bounded by user action rate
observed_vs_expected:
  facets:
    - facet_id: ui_shell_unconditional_rendering_no_role_or_feature_or_permission_gating
      drift_class: ui_shell_unconditional_rendering_no_role_or_feature_or_permission_gating
      severity: HIGH
      observed: |-
        ToolbarTabs.tsx:34-82 hardcodes 9 tabs in a useMemo array with no
        permission predicate, no feature-flag check, no role discrimination.
        AppToolbar.tsx:18-121 reads identity + owner from Redux but never
        consults permissions / activeFeatures / role. App.tsx:56 mounts the
        toolbar unconditionally above the <Routes> block — the chrome
        renders for every authenticated user (and every anonymous caller
        under DISABLED).
      expected: |-
        For a Management & Administration pillar surface that exposes admin
        affordances (Management tab → /management/* leads into Owner / Role
        / Policy administration), a role-gated visibility model is the
        operator-conventional default: hide the Management tab from users
        with zero *_MANAGE permissions.
      operator_visible_consequence: |-
        Every authenticated user sees the Management tab and can click into
        it. Backend authorization gates whatever actions they attempt, but
        the tab presence leaks the EXISTENCE of an admin surface to every
        user — reconnaissance information for instances with strict
        separation-of-duties requirements.
    - facet_id: tabs_render_regardless_of_active_features_set
      drift_class: tabs_render_regardless_of_active_features_set
      severity: MEDIUM
      observed: |-
        App.tsx:49 dispatches fetchActiveFeatures on every SPA mount, populating
        the Redux activeFeatures slice with the F-034 boot-immutable Set<Feature>
        (DATA_COLLABORATION / ALERT_NOTIFICATIONS). ToolbarTabs.tsx:34-82 does
        NOT consume this slice — no useAppSelector(getActiveFeatures) read, no
        WithFeature wrapping. Tabs whose destination pages ARE feature-gated
        downstream (Data Modelling's Query Examples sub-features wrap
        children in <WithFeature featureName={Feature.DATA_COLLABORATION}>)
        remain visible regardless of whether datacollaboration.enabled=false.
      expected: |-
        The presence of WithFeature.tsx in the codebase + the dispatch of
        fetchActiveFeatures on mount suggest the design INTENT was a
        feature-flag-aware UI. The implementation stops at sub-page level
        — the tab entry points are not gated.
      operator_visible_consequence: |-
        Under default deployment (datacollaboration.enabled=false), the Data
        Modelling tab leads the user to an empty/non-functional Query
        Examples surface. The operator who turned the flag off has no
        indication at the chrome layer.
    - facet_id: hardcoded_logout_route_404s_under_auth_type_disabled
      drift_class: hardcoded_logout_route_404s_under_auth_type_disabled
      severity: MEDIUM
      observed: |-
        AppToolbar.tsx:35-37 issues `window.location.href = '/logout'` on
        Logout click. The /logout handler is registered ONLY when a
        Spring-Security formLogin chain is configured —
        LoginFormSecurityConfiguration.java:59 (.logout(Customizer.withDefaults()))
        and LDAPSecurityConfiguration.java:146 (same). OAUTH2 uses a custom
        chain. DisabledAuthSecurityConfiguration.java:11-19 has NO
        .logout(...) call — under auth.type=DISABLED (the bundled default
        per application.yml:34), clicking Logout produces a 404.
      expected: |-
        Either the toolbar suppresses the Logout link under DISABLED, or
        DisabledAuthSecurityConfiguration adds a Customizer.withDefaults
        logout chain that redirects to '/'. The link is shown universally;
        the backend handler is mode-conditional.
      operator_visible_consequence: |-
        Under the default deployment mode, clicking Logout shows a 404
        error page. The user must back out of it; their "session" (there
        isn't one) is unchanged. UX-confusing but security-neutral.
    - facet_id: app_toolbar_renders_admin_literal_under_disabled_mode_ui_symptom_of_refactor_185
      drift_class: app_toolbar_renders_admin_literal_under_disabled_mode_ui_symptom_of_refactor_185
      severity: HIGH
      observed: |-
        AppToolbar.tsx:74 renders `{owner?.name ?? identity?.username}` as
        the top-right user label. Under auth.type=DISABLED the backend
        returns dummyOwner with username='admin' (IdentityController.java:30-33);
        owner is null; the nullish-coalescing falls through to identity.username
        = 'admin'. Every anonymous network caller reaching the SPA sees
        themselves rendered as 'admin' in the user cluster — the UI symptom
        of the broader REFACTOR-185 19-sidecar cluster (anonymous reachability
        under DISABLED across the entire platform).
      expected: |-
        Either the toolbar renders a "DISABLED MODE — auth turned off" banner
        when identity.username='admin' AND owner=null (the diagnostic signal),
        or the backend stops returning a synthetic dummyOwner and DISABLED-mode
        callers see an empty user cluster.
      operator_visible_consequence: |-
        The UI presents an anonymous network caller as if they were an
        authenticated admin. Operators auditing screenshots / shared
        terminals have NO chrome-level signal that the user is unauthenticated.
        Cross-link REFACTOR-185.
    - facet_id: app_info_menu_hover_only_wcag_2_1_violation_no_keyboard_activation
      drift_class: app_info_menu_hover_only_wcag_2_1_violation_no_keyboard_activation
      severity: MEDIUM
      observed: |-
        AppInfoMenu.tsx:78-82 declares the icon button with `onMouseEnter`
        ONLY — no onClick, no onKeyDown, no onFocus. ARIA attributes
        (aria-haspopup='true', aria-controls={menuId}) suggest the
        author EXPECTED keyboard accessibility, but no handler is wired.
        Touch-device users (iOS Safari, Android Chrome) generate NO
        mouseenter on the icon button; the menu is unreachable.
      expected: |-
        WCAG 2.1 SC 2.1.1 (Keyboard) — every menu activation must be
        keyboard-reachable. A button claiming aria-haspopup='true' must
        respond to Enter/Space in addition to mouse hover.
      operator_visible_consequence: |-
        AT users (screen-reader + keyboard navigation) cannot reach the
        version display, the documentation link, or the operator-configured
        links. Touch-device users cannot hover. The menu is exclusively
        mouse-keyboard-not-allowed.
    - facet_id: tabnabbing_target_blank_without_rel_noopener_across_all_5_link_sites
      drift_class: tabnabbing_target_blank_without_rel_noopener_across_all_5_link_sites
      severity: MEDIUM
      observed: |-
        AppInfoMenu.tsx:41, 61, 95, 103, 112 — every external link site
        uses `<Link target='_blank'>` WITHOUT `rel='noopener noreferrer'`.
        Operator-configured URLs (line 61, F-035 cross-reference) AND the
        four hardcoded targets (docs.opendatadiscovery.org, slack,
        github.com/opendatadiscovery/odd-platform, producthunt.com) all
        leak window.opener to the destination tab. The opened page can use
        window.opener.location to navigate the ODD Platform tab to a
        phishing target.
      expected: |-
        Every target='_blank' anchor should set rel='noopener noreferrer'
        — the operator-conventional default since 2017.
      operator_visible_consequence: |-
        F-035 covers the operator-configured surface (one mitigation is
        operator discipline). The 4 hardcoded surfaces are first-party-trusted
        today; the defence-in-depth gap is reverse-tabnabbing from a future
        XSS on any of the four destination domains.
    - facet_id: dictionary_label_vs_termsearch_url_drift_through_i18n_natural_keys
      drift_class: ui_label_vocabulary_disagrees_with_url_vocabulary
      severity: LOW
      observed: |-
        ToolbarTabs.tsx:66 — `{ name: t('Dictionary'), link: termsSearchPath() }`.
        en.json:115 — `"Dictionary": "Dictionary"`. termsRoutes.ts:6 —
        `TERMS_SEARCH_PATH = '/termsearch'`. The label says Dictionary; the
        URL says termsearch. The drift is uniform across all 6 locales
        (natural-keys + i18next fallback).
      expected: |-
        Either rename the URL to /dictionary (breaks deep-linked bookmarks)
        or rename the i18n key to "Term Search" everywhere (two t() call
        sites in ToolbarTabs.tsx + en.json + 5 other locales). Live docs
        (`features/data-glossary/business-glossary`) reinforce the label;
        the URL drift is silent.
      operator_visible_consequence: |-
        Cross-link DOC-GAP-300/301 + F-024. Bookmarks adopt the URL; deep
        links shared in Slack adopt the URL; tutorial documentation must
        explain the discrepancy.
    - facet_id: catalog_label_vs_search_url_drift_through_i18n_natural_keys
      drift_class: ui_label_vocabulary_disagrees_with_url_vocabulary
      severity: LOW
      observed: |-
        ToolbarTabs.tsx:37-39 — `{ name: t('Catalog'), link: searchPath() }`.
        en.json:78 — `"Catalog": "Catalog"`. searchRoutes.ts:3 —
        `BASE_PATH = '/search'`. The label says Catalog; the URL says search.
        Live docs say "select the Catalog tab" to reach the search bar
        (`features/data-discovery/search` WebFetched 2026-05-26 status 200).
      expected: |-
        Either rename the i18n key or rename the URL. The docs reinforce
        the LABEL — operator confusion accumulates at the URL boundary.
      operator_visible_consequence: |-
        Minor confusion when users bookmark a /search/{uuid} URL while
        thinking of the surface as "Catalog".
    - facet_id: data_modelling_label_lands_on_query_examples_specifically_not_pillar_overview
      drift_class: tab_label_promises_pillar_overview_implementation_lands_on_specific_sub_feature
      severity: LOW
      observed: |-
        ToolbarTabs.tsx:50-54 — `{ name: t('Data Modelling'), link: queryExamplesPath() }`.
        queryExamplesPath() returns /data-modelling/query-examples. There is
        NO /data-modelling overview / landing page mounted in App.tsx —
        clicking the tab lands the user on Query Examples specifically.
        Same pattern at Master Data (lookupTablesPath() → /master-data/lookup-tables;
        no /master-data index).
      expected: |-
        For pillars with multiple sub-features (Data Modelling has Query
        Examples + Relationships per dataModelling/relationshipsRoutes.ts),
        a pillar-overview landing surfacing each sub-feature is the
        operator-conventional default.
      operator_visible_consequence: |-
        Users expecting a Data Modelling overview land on a specific
        sub-feature. Relationships (also a Data Modelling sub-feature) is
        reachable only from within Query Examples or from a Data Entity
        Details page — no top-level entry from the toolbar.
    - facet_id: three_tab_labels_missing_from_all_six_locales_natural_keys_fallback_silent
      drift_class: i18n_missing_key_drift_at_navigation_chrome_locale_silent
      severity: MEDIUM
      observed: |-
        ToolbarTabs.tsx:46 — `t('Data Quality')`; line 51 — `t('Data Modelling')`;
        line 56 — `t('Master Data')`. None of these three keys exist in
        en.json or in any of the 5 non-English locales. Per the en.json
        sidecar's bugs_limitations_corner_cases[0] grep verification —
        the missing-key set is uniform across all 6 locales.
      expected: |-
        Every t() call site has a matching key in en.json + every non-English
        locale.
      operator_visible_consequence: |-
        A Ukrainian / Spanish / French / Chinese / Armenian user opens
        the toolbar, sees 6 of 9 tabs in their language + 3 tabs in
        English. The natural-keys pattern + fallbackLng chain hides the
        bug — i18next returns the KEY STRING after exhausting the chain.
        Localisation-quality drift; consistent across locales.
    - facet_id: keepmounted_combined_with_no_staletime_renders_yaml_edits_invisible_until_reload
      drift_class: react_query_keepmounted_combined_with_no_staletime_silent_staleness
      severity: LOW
      observed: |-
        AppInfoMenu.tsx:90 — `keepMounted` on the MUI Menu. The DOM tree
        stays mounted forever after the first hover. useAppInfo /
        useAppLinks (lib/hooks/api/appInfo.ts:4-17) set NO staleTime, NO
        refetchInterval — TanStack Query defaults to staleTime=0 (refetch
        on every mount). But the widget never UNMOUNTS — so subsequent
        operator edits to odd.links are invisible until the user does a
        full page reload.
      expected: |-
        Either staleTime: Infinity (correct given both endpoints are
        boot-immutable at the backend) + an operator-visible "this list
        is bound at boot" caveat, OR a refetchInterval that picks up
        config edits within a window.
      operator_visible_consequence: |-
        Operator edits odd.links in YAML + restarts the backend; users
        in long-lived SPA tabs continue to see the OLD list until they
        manually reload. Documented in F-035 + REFACTOR-631; F-041
        observes the chrome-side consequence.
    - facet_id: tab_selectedness_substring_match_fragile_under_route_rename
      drift_class: ui_tab_selectedness_substring_match_fragile_under_route_rename
      severity: LOW
      observed: |-
        ToolbarTabs.tsx:100-104 — selected-tab detection uses
        `pathname.includes(tab.value)` (substring match), with two
        special-case branches for the root path '/' (selectedTab=-1) and
        the search/dataentities/* family (selectedTab=0). The
        substring-match is fragile-by-design — a future route like
        /management-history or /data-quality-old would falsely match
        the wrong tab.
      expected: |-
        Exact-prefix match or explicit route-to-tab mapping table.
      operator_visible_consequence: |-
        No false-positive in the current route corpus, but the structural
        fragility ships silently — a route rename in routes/*.ts without
        updating the matching value field at ToolbarTabs.tsx:42-79 silently
        stops the tab from highlighting.
    - facet_id: tab_thunk_silent_failure_no_catch_orphan_search_id_mint
      drift_class: tab_thunk_silent_failure_no_catch_orphan_search_id_mint
      severity: MEDIUM
      observed: |-
        ToolbarTabs.tsx:112-117 — Dictionary handler:
        `dispatch(createTermSearch(...)).unwrap().then(({searchId}) => navigate(...))`
        — no `.catch`. Catalog handler `useCreateSearch.ts:14-19` shares the shape.
        On backend 5xx the rejected promise produces no toast (handleResponseAsyncThunk
        path-dependent), no navigation, no error pane — the click appears unresponsive.
        Rapid repeat clicks mint repeat orphan search-id rows server-side (no in-flight
        de-dup, no idempotency key, no client-side cleanup).
      expected: |-
        Either a `.catch(showServerErrorToast)` on each handler, or a chain-level
        AbortController + an idempotency key. Orphan search-id rows should be evicted
        by a housekeeping job (F-010 currently enumerates 5 jobs — no orphan-search-id
        TTL evictor today).
      operator_visible_consequence: |-
        Backend down → Catalog/Dictionary clicks fail silently; user has no signal
        the request was even attempted. Compounds with SHB-153 (no path='*'
        catch-all) — if the user did somehow land on the destination, the
        downstream search result page would then potentially show AppErrorPage
        but the entry-point click never reached navigate(). Seeded from SHB-145.
    - facet_id: module_load_time_date_snapshot_stale_window_across_spa_session
      drift_class: module_load_time_date_snapshot_stale_window_across_spa_session
      severity: LOW
      observed: |-
        Activity/common.ts:33-41 — `defaultActivityQuery` is a module-level
        constant; `beginDate: addDays(new Date(), -5)`, `endDate: new Date()`
        are evaluated at MODULE-IMPORT TIME (SPA bundle load), not at click time.
        ToolbarTabs.tsx:75-79 builds the Activity tab's href via
        `activityPath(activityQueryString)` where activityQueryString defaults
        to defaultActivityQuery. On a long-lived SPA tab (laptop-suspend over
        days), the Activity tab carries a window that slides further out of
        date with each day since bundle load.
      expected: |-
        Replace the module-level constants with a function call inside
        `useQueryParams` defaults, OR redirect to a stable URL that lets
        the Activity page itself compute the now-time window.
      operator_visible_consequence: |-
        SRE checking "what changed today" via Activity tab after a multi-day
        SPA session sees a window that ends N days ago (N = days since bundle
        load). The bug surfaces only after the SPA has been idle >24h — class
        an integration test would never catch without mocking Date.now across
        module reload boundaries. Seeded from SHB-146.
test_matrix:
  unit:
    state: GAP
    covered: []
    uncovered:
      - AppToolbar userName falls back from owner.name to identity.username when owner is null (AppToolbar.tsx:74)
      - AppToolbar scroll-elevation kicks in at exactly 10px (useScrollTrigger threshold)
      - ToolbarTabs renders 9 tabs in fixed order regardless of permissions / activeFeatures
      - ToolbarTabs selected-tab heuristic handles each pathname → tab mapping correctly
      - ToolbarTabs Catalog click dispatches createSearch then navigates
      - ToolbarTabs Dictionary click dispatches createTermSearch then navigates
      - AppInfoMenu hover opens the menu and renders 5 surfaces
      - AppInfoMenu projectVersion suppresses when appInfo undefined
      - SelectLanguage persists choice to localStorage and triggers i18n.changeLanguage
  integration:
    state: GAP
    covered: []
    uncovered:
      - AppToolbar userName renders 'admin' literal under DISABLED (DISABLED → dummyOwner → owner=null → identity.username='admin')
      - Clicking Logout under DISABLED produces a 404 (no /logout handler registered)
      - All 9 tabs render unconditionally regardless of role (READ_ONLY sees the same as ADMIN)
      - Tab destinations honour feature-flag state (Data Modelling tab leads to non-functional page when datacollaboration.enabled=false)
      - Language switch persists across full page reload (localStorage round-trip)
      - AppInfoMenu icon is keyboard-reachable AND opens menu on Enter/Space (WCAG 2.1 SC 2.1.1)
      - Catalog tab onClick succeeds when backend search-create POST succeeds; user lands at /search/{newId}
      - Dictionary tab onClick succeeds when backend term-search-create POST succeeds
      - Three tab labels (Data Quality / Data Modelling / Master Data) render in English regardless of selected locale (missing-key drift)
  performance:
    state: GAP
    covered: []
    uncovered:
      - AppToolbar re-render cost per route change (single mounted instance, no React.memo)
      - useMemo dep array stability — ToolbarTabs rebuild frequency under Activity-page query changes
      - TanStack Query staleTime not set on useAppInfo / useAppLinks — refetch cost on other component remounts
  security:
    state: GAP
    covered: []
    uncovered:
      - Under DISABLED, the toolbar renders 'admin' as username to anonymous viewers (REFACTOR-185 UI symptom)
      - Management tab is visible to every authenticated user regardless of permission (admin-surface reconnaissance leak)
      - All 5 link sites in AppInfoMenu use target='_blank' without rel='noopener noreferrer' (reverse-tabnabbing surface)
      - Under DISABLED the projectVersion + operator-configured links render to anonymous viewers (information disclosure)
      - Logout link 404s under DISABLED — operator may believe they've logged out when no session exists
control_summary: |-
  0 of 16 cells COVERED — zero tests reference AppToolbar / ToolbarTabs /
  AppInfoMenu / SelectLanguage in the odd-platform-ui repo (Grep returned 0
  matches across `*test*.{ts,tsx}` + `cypress/**`). The chrome is on the
  critical path for every user interaction (every tab click, every logout,
  every language switch) yet has zero coverage — exactly the class of
  widget where a refactor regression goes unnoticed until production.
  Highest-leverage probe candidates: P-174 (AppToolbar DISABLED-mode render
  matrix), P-173 (AppInfoMenu tabnabbing + keyboard-accessibility + URL-scheme
  + anonymous-version-disclosure), P-175 (ToolbarTabs all-tabs-unconditional
  across auth modes + roles). All three are local-only per Rule 7 —
  docker-compose ODD platform + Playwright headless-browser probe; no remote
  infrastructure.
