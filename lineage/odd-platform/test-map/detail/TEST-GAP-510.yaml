proposed_action: |-
  WebTestClient integration test. (a) Create DEG D with 3 members m1, m2, m3 (NO lineage edges between any of them). (b) GET /api/dataentitygroups/D.id/lineage. (c) Assert HTTP 200. (d) Assert response body parses as `DataEntityGroupLineageList` with `items` being an empty array. (e) Assert HTTP 200 is NOT 404 (the contract asymmetry — DEG has members so it exists, just no edges). (f) Test comment 'LOCKS the 200/empty-items contract for DEG-with-members-but-no-edges as of 2026-05-19. The contract is asymmetric: zero members → 404 (TEST-GAP-507), zero edges → 200 with empty items. A regression conflating the two would FAIL this test.'
