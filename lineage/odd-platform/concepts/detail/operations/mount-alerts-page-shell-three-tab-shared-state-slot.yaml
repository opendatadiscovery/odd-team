notes: |-
  NEW operation captured in batch ZL (2026-05-26). The page-root
  composition pattern is shared across the SPA (Activity.tsx,
  DataModelling.tsx, LookupTables.tsx all use similar shell+tab+
  routed-children patterns), but Alerts.tsx is distinctive because
  of the shared-Redux-slot + explicit-clear-on-tab-switch pattern.

  Cross-batch follow-ups:
    - The other pillar roots (Activity / DataModelling / LookupTables
      / Management / DataQuality / Overview) should each have a
      dedicated 'mount-X-page-shell' operation to make the UI-layer
      taxonomy complete; today only this Alerts operation is
      anchored.
    - The 'three thunks share one slot' pattern is reusable; future
      tab-based features that don't need per-tab isolation could
      adopt the same shape and save Redux slot count.
