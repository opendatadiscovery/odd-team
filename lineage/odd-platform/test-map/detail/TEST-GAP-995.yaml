proposed_action: |-
  Add `ManagementRoutePosture.test.tsx` under `odd-platform-ui/src/components/Management/__tests__/`:

  (a) `eightSubAreas_renderForMinimumPrivilegeUser_pinsReadCollaborativePosture`: drive `<App>` in a MemoryRouter with a minimum-privilege authenticated user (zero Permissions, zero Owners); for each of the 8 ungated sub-routes (`/management/namespaces`, `/management/datasources`, `/management/integrations`, `/management/collectors`, `/management/owners`, `/management/tags`, `/management/roles`, `/management/policies`), assert the corresponding list component MOUNTS; pins the deliberate posture.

  (b) `policiesDetail_renderForMinimumPrivilegeUser_pinsRBACMatrixVisibility`: assert `/management/policies/:id` mounts the policy detail/JSON view to the minimum-privilege user; pins the RBAC-reconnaissance surface for explicit awareness.

  (c) `associations_redirectsForMinimumPrivilegeUser_pinsTheSingleRouteGate`: assert `/management/associations/new` redirects to `/management/namespaces` via `RestrictedRoute`; pins the SOLE hard gate.

  (d) `writeButtonsHidden_pinsTheInListGates`: assert the `Add` / `Edit` / `Delete` buttons on each of the 8 surfaces are NOT rendered to the minimum-privilege user (inner `<WithPermissions>` gates) — proves the "writes blocked but reads open" invariant.

  Add a REGRESSION-PIN comment in ManagementRoutes.tsx:29 documenting: 'Management surface is INTENTIONALLY read-collaborative. The 8 non-associations sub-routes are reachable to any authenticated user (only write actions are gated). If you want to gate any sub-route at the route level, (1) update this test, (2) update documentation/docs/configuration-and-deployment/enable-security/authorization.md to document the new gate, (3) coordinate with the backend half (probe P-162) to ensure the API-tier matches.'
