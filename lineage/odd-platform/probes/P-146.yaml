realism_caveats: |
  The probe verifies the 4-mode disjointness by running the SAME 5
  endpoints under LOGIN_FORM and OAUTH2. LDAP is omitted as it
  shares the AuthorizationCustomizer with OAUTH2 (LDAPSecurityConfiguration.java:145
  uses the same `new AuthorizationCustomizer(permissionService, extractors)`)
  — testing it would be redundant if the AuthorizationCustomizer is the
  sole gating mechanism. If LDAP behaves differently from OAUTH2,
  that's an additional finding outside this probe's scope.

  The probe assumes:
  - LOGIN_FORM mode can be exercised with anonymous (no cookie) POSTs;
    Spring Security's default behaviour is 302-to-/login for protected
    paths, OR 401 if the request signals it doesn't accept HTML redirects
    (Accept: application/json). The probe accepts either status code as
    "auth required".
  - OAUTH2 mode requires a real OAuth provider; the probe uses a mock
    Okta issuer URL — this MAY fail at platform startup if the issuer
    URL discovery (.well-known/openid-configuration) is unreachable.
    If the OAUTH2 stack cannot boot without a real provider, the probe
    needs a Keycloak sidecar or a static mock-OIDC server (WireMock with
    OIDC fixture).

  The probe does NOT test:
  - DISABLED mode (already known to permit everything; tested implicitly
    by the existing test profile)
  - The interaction with auth.ingestion.filter.enabled=true (the filter
    matches /ingestion/entities exactly, so toggling it changes endpoint
    1's behaviour but not 2-4)
  - The interaction with auth.s2s.enabled=true (S2S adds the X-API-Key
    filter which grants ADMIN but does not affect the whitelist;
    confirmed by reading the 3 SecurityConfiguration classes)

  If the probe PASSES (all 7 assertions match), the controller-class
  sidecar's downstream_side_effects + stress_findings auth-gate matrix
  is verified for LOGIN_FORM vs OAUTH2. The asymmetry IS real; LOGIN_FORM
  is incidentally stricter for 3 of 5 ingestion endpoints. Route the
  finding to a REFACTOR-NNN: "4-mode auth disjointness on /ingestion/*
  is inconsistent — LOGIN_FORM uses an explicit permittedPaths array,
  OAUTH2/LDAP use a wildcard in WHITELIST_PATHS; unify on one approach".

  If the probe FAILS (any assertion mismatches), update the controller-
  class sidecar's stress_findings.auth_gates question_1 with the actual
  observed behaviour and lower the controller's confidence_per_field for
  upstream_callers + security accordingly.
