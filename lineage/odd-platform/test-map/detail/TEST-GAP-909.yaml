behaviour: |-
  **HIGH (META — DataSourceController test-package anchor) — the ENTIRE DataSourceController
  endpoint surface (all 5 endpoints) AND its service `DataSourceServiceImpl` have ZERO
  direct controller-tier OR service-tier tests. Five batch-ZB method-level sidecars
  (`getDataSourceList`, `registerDataSource`, `updateDataSource`, `deleteDataSource`,
  `regenerateDataSourceToken`) each report `covered_behaviours: []`. There is NO
  `DataSourceControllerTest.java`, NO `DataSourceServiceImplTest.java`, NO
  `TokenGeneratorImplTest.java`. The only DataSource-related test in the repo is
  `DataSourceRepositoryImplTest.java` — repository-tier only.** This META anchor records the
  AGGREGATE coverage hole; the individual behaviours are pinned by TEST-GAP-898 through
  TEST-GAP-908 (this batch) plus the existing TEST-GAP-749..753 (batch W).

  **The verified absence** (Glob this batch, under `odd-platform-api/src/test`):
  - `DataSourceControllerTest.java` — `Glob **/DataSourceControllerTest.java` returns NO
    files. The HTTP perimeter of all 5 endpoints (RBAC gating, HTTP status, request/response
    shape, the masked-vs-plaintext token rendering, the cascade-block, the REPLACE-not-MERGE
    semantics, the token-rotation cutover) is entirely unverified end-to-end.
  - `DataSourceServiceImplTest.java` — `Glob **/DataSourceServiceImplTest.java` returns NO
    files. The service tier — `@ReactiveTransactional` atomicity on create / update /
    delete, the missing `@ReactiveTransactional` on `regenerateDataSourceToken`, the
    `switchIfEmpty(NotFoundException)` guards — has zero coverage.
  - `TokenGeneratorImplTest.java` — `Glob **/TokenGeneratorImplTest.java` returns NO files.
    The `regenerateToken` / `regenerate(null)` / `generate` paths shared by BOTH the
    data-source and the collector token surfaces are uncovered.
  - The only DataSource test, `DataSourceRepositoryImplTest.java` (under
    `odd-platform-api/src/test/.../repository/`), is repository-tier — VERIFIED present this
    batch: 7 test methods (`getDtoWithNamespaceTest`, `getDtoWithoutNamespaceTest`,
    `listDtoTest`, `listDtoNameQueryTest`, `getDtoByOddrnTest`, `getDtoByOddrnsTest`,
    `existsByNamespaceTest`). It exercises the SQL `listDto` / `getDto` exercises the
    repository tier — NOT the HTTP endpoints, NOT the service-tier transaction posture,
    NOT the auth gating.

  **Why a META anchor and not a duplicate of the 11 individual gaps**: this entry is the
  single backlog item the maintainer triages into the tests-pillar effort to STAND UP the
  DataSource API + service test classes. The individual TEST-GAP entries (898-908 this
  batch + 749-753 batch W) are the behaviour-level test methods; this META anchor is the
  "create the test classes, wire the Testcontainers fixture, establish the RBAC + S2S
  ingestion test harness" parent task. It parallels TEST-GAP-897 (the F-018 tag-management
  META anchor) and TEST-GAP-814 (the F-009 notification-subsystem META anchor) in role.

  **Operator-visible consequence**: every drift the batch-ZB sidecars surfaced — the
  destructive token-rotation cutover, the DISABLED-bypass credential-rotation-hijack, the
  masked-token one-line-flip leak surface, the REPLACE-not-MERGE silent field-wipe, the
  cascade-block, the orphan-token leak, the 201-vs-200 spec drift, the no-permission list
  posture — is SILENT in CI. A refactor touching ANY of them compiles and passes every
  existing test. The Datasources management surface (P-08) is a fully-shipped operator +
  S2S-credential capability with NO controller-tier or service-tier regression net.

  **Test gap shape**: stand up the DataSource test classes — a `DataSource*Test` family in
  `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` (HTTP-tier) and
  `.../service/` (service-tier) — with a Testcontainers `@SpringBootTest` base (reuse
  `BaseIntegrationTest` / `BaseIngestionTest`) and an RBAC-permission test fixture able to
  inject a caller holding a specified `DATA_SOURCE_CREATE` / `DATA_SOURCE_UPDATE` /
  `DATA_SOURCE_DELETE` / `DATA_SOURCE_TOKEN_REGENERATE` permission set, plus an
  `auth.type=DISABLED` context for the bypass cells. The package houses the test classes
  proposed by TEST-GAP-898..908 and TEST-GAP-749..753. This META gap is "done" when the
  classes exist, the fixtures work, and at least the HTTP-floor smoke tests pass (200 on
  GET, register, update, regenerate; 204 on delete).
