- id: H-013
  hypothesis: |-
    "When I send a Discussion message with empty or whitespace-only text, the
    platform rejects it (I cannot post a blank message)."
  derivation: |-
    Endpoint shape: MessageRequest.text is the message body; a user expects blank
    messages to be rejected, and Slack itself rejects empty text.
  seed_source: endpoint-shape
  sme_consultation_recommended: false
  validation:
    verdict: probe-needed
    actual_behavior: |
      Two layers disagree and the resolution needs running. UI side (F-197):
      CreateMessageForm enforces `text` required with a custom
      `validate: value => !!value.trim()` trim-blank guard, so the FORM blocks
      blank submits. Backend side (postMessageInSlack sidecar): MessageRequest.text
      is `required` only (components.yaml) with NO max-length, NO server-side
      non-blank check — so a direct API caller bypassing the form can POST
      whitespace text, which is persisted and only fails at Slack's boundary AFTER
      the 202. The user-facing verdict (does a blank message get rejected?) is
      `confirmed` via the UI form but `contradicted` via the raw API; which one
      governs the operator-visible outcome depends on whether the deployment is
      reachable by non-UI callers (true under DISABLED / for any authenticated
      API client). Pinning the end-to-end behaviour requires a probe.
    evidence:
      - sidecar: lineage/odd-platform/feature-flows/detail/F-197.yaml
        section: chain hop 3
        cite: "CreateMessageForm.tsx:23-122 (validate: value => !!value.trim())"
        note: "UI form blocks blank text"
      - sidecar: odd-platform__java__DataCollaborationController__controller-method__postMessageInSlack.md
        section: bugs_limitations_corner_cases[1]
        cite: "components.yaml:3410-3423 (text required only; no length/blank cap)"
        note: "backend accepts whitespace text; only fails at Slack boundary post-202"
    operator_visible_failure: |
      A direct API client (or any caller under DISABLED) can persist blank /
      oversized messages that the UI form would have blocked, which then fail at
      Slack post-202 and clutter the messages table as ERROR_SENDING rows. The
      UI-form guard is not a server-side contract. Surfaced probe-needed because
      the governing behaviour depends on the caller path.
    severity: LOW
    confidence: MEDIUM
    probe_id: P-381
    routes_to_finding: none

