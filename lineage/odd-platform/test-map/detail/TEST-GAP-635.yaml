proposed_action: |-
  Add `AppToolbar.test.tsx` with the standard React-Testing-Library shape: mount AppToolbar with a fake redux store, click the user-identifier label to open the popup menu, click the Logout item, and assert that the test's `window.location.assign` (or `window.location.href` setter) mock was called with exactly `/logout`. The mock isolates the navigation side-effect without actually unloading the test page. Pair with a second test covering the no-confirmation-prompt path (verifying clicking Logout does NOT mount a confirmation modal — pins the current UX).
