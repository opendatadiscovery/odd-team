description: |-
  **HIGH-SEVERITY INVARIANT, batch 2026-05-19N — SQL-LAYER PRIMARY
  SOURCE from ReactiveTagRepositoryImpl; STRENGTHENED batch R with
  MetadataField SIBLING INSTANCE at ReactiveMetadataFieldRepositoryImpl;
  STRENGTHENED batch VAL-LSN-019 with TagServiceImpl SERVICE-TIER
  PRIMARY SOURCE pinning the read-then-write pattern at the
  service-orchestration layer** — the auto-create-on-miss UX for
  tag-relations has a Time-Of-Check / Time-Of-Use race window between
  `TagServiceImpl.getOrCreateTagsByName` and the underlying repository
  primitives.

  **The race window** (TAG instance):
    1. `TagServiceImpl.divideTagsByExistence` (TagServiceImpl.java:144-159)
       calls `tagRepository.listByNames(tagNames)` — returns the set of
       existing tag rows for the candidate names.
    2. `TagServiceImpl.getOrCreateTagsByName` filters the input by the
       existing-set and calls `tagRepository.bulkCreate(tagsToCreate)`
       (TagServiceImpl.java:80-86 → ReactiveAbstractCRUDRepository.bulkCreate
       at lines 113-126) for the remainder.
    3. Between (1) and (2), a CONCURRENT caller can insert the same
       novel name. Under PostgreSQL READ COMMITTED isolation (the
       default for R2DBC + jOOQ-Reactive), the first caller's listByNames
       snapshot does NOT see the second caller's uncommitted INSERT.
    4. The first caller's `bulkCreate` reaches Postgres with the
       now-conflicting name; hits the `tag_name_unique` partial index
       (V0_0_64__remove_is_deleted_field.sql:105); receives a
       `unique_violation` SQLSTATE 23505 which the
       `ExceptionUtils.translateDatabaseException` chain
       (ExceptionUtils.java:54-56) translates to a
       `UniqueConstraintException("Tag with this name already exists")`.
    5. **There is no caller-side retry** — neither `TagServiceImpl`
       nor any upstream service catches the exception to re-fetch and
       re-attempt. The user sees a 5xx-level error on a normal-looking
       PUT request (the OpenAPI shape is `200 OK` for happy path; the
       race surfaces as the global ControllerAdvice catch-all).

  **NEW BATCH VAL-LSN-019 — SERVICE-TIER CONFIRMATION**: the
  TagServiceImpl sidecar confirms the race pattern at the
  service-orchestration layer:
    - `getOrCreateTagsByName` (TagServiceImpl.java:79-86) has NO
      `@ReactiveTransactional` annotation, so the read+write pair is
      NOT atomic. The lack of TX is INTENTIONAL per the maintainer's
      dual-method design (the TX should not span the listBy/bulkCreate
      pair because the design accepts the race-exception-driven
      resolution).
    - Companion finding NEW batch VAL-LSN-019: TagServiceImpl
      enumerates THE FULL CALL-SITE GRAPH for the side-door write
      surface that triggers the TOCTOU window: the 4 side-doors are
      (a) DATA_ENTITY_TAGS_UPDATE via DataEntityServiceImpl.upsertTags,
      (b) TERM_TAGS_UPDATE via TermServiceImpl.upsertTags,
      (c) DATASET_FIELD_TAGS_UPDATE via DatasetFieldServiceImpl
          (multiple call sites), and (d) S2S ingestion via
      ExternalTagIngestionRequestProcessor (which goes through
      `getOrInjectTagByName`, the SAFE upsert variant — not the
      race-prone `getOrCreateTagsByName`).
    - The dual-method design (`getOrCreateTagsByName` race-prone
      vs `getOrInjectTagByName` race-safe) is now triple-anchored:
      ReactiveTagRepositoryImpl.implicit_adrs.[6] (repository tier)
      + TagServiceImpl.implicit_adrs[bulk-create-as-side-door]
      (service tier confirms the deliberate split) + TagController
      sidecar implicit_adrs.[5] (controller tier observes the dual
      shape).

  **The ingestData upsert path is SAFE**: the parallel write path used by
  `ExternalTagIngestionRequestProcessor` calls `tagRepository.ingestData`
  which issues `INSERT ... ON CONFLICT (name) WHERE deleted_at IS NULL DO
  UPDATE SET name = EXCLUDED.name RETURNING *`
  (ReactiveTagRepositoryImpl.java:191-213). The `ON CONFLICT` clause
  serialises concurrent novel-name inserts at the DB level and returns
  the existing row's id — no race surface. The asymmetry between
  `bulkCreate` (no ON CONFLICT) and `ingestData` (ON CONFLICT DO UPDATE)
  is INTENTIONAL per the batch-N repository sidecar's implicit_adrs.[6]:
  `TagController.createTag` (operator-explicit creation gated by
  `TAG_CREATE`) MUST fail on duplicate to surface the error; ingestion-
  side calls MUST not fail because a tag with the same name was added
  moments earlier by a parallel pipeline. **The race surface is at the
  bulkCreate (UI tag-assignment) path**.

  **BATCH R EXTENSION — METADATAFIELD SIBLING INSTANCE (STRUCTURALLY
  IDENTICAL TOCTOU SHAPE)**: ReactiveMetadataFieldRepositoryImpl batch R
  sidecar surfaces the SAME race shape at a second site:
    1. `MetadataFieldServiceImpl.getOrCreateMetadataFields`
       (MetadataFieldServiceImpl.java:42-59) calls
       `reactiveMetadataFieldRepository.listByKey(metadataMap.keySet())` —
       returns existing rows matching the candidate `(name, type)` keys
       (case-SENSITIVE exact match).
    2. The service filters by existing-set and calls
       `reactiveMetadataFieldRepository.bulkCreate(metadataFieldsToCreate)`
       (inherited from ReactiveAbstractCRUDRepository.bulkCreate
       lines 113-126) for the remainder.
    3. Between (1) and (2), a concurrent caller can insert the same
       novel `(name, type)` pair.
    4. The first caller's `bulkCreate` hits the `IX_UNIQUE_INTERNAL_NAME`
       partial index (`metadata_field(name) WHERE origin = 'INTERNAL'`,
       V0_0_1__init.sql:242-244); receives SQLSTATE 23505; the
       `ExceptionUtils.translateDatabaseException` translates to
       `UniqueConstraintException("Internal metadata with this name
       already exists")` (ExceptionUtils.java:63-65).
    5. NO service-tier retry. The race-window-resolves-via-exception
       behaviour is structurally identical to Tag.

  **The ingestData upsert is the SAFE counterpart** for collector-tier
  metadata writes — `ReactiveMetadataFieldRepositoryImpl.ingestData`
  (lines 73-109) pins to `IX_UNIQUE_EXTERNAL_NAME_TYPE` with the
  matching `.where(ORIGIN.ne(INTERNAL))` clause and uses `ON CONFLICT
  ... DO UPDATE SET name = EXCLUDED.name RETURNING *`. The asymmetry
  between INTERNAL (UI-tier, race-prone) and EXTERNAL (collector-tier,
  race-tolerant) is INTENTIONAL per ReactiveMetadataFieldRepositoryImpl
  batch R implicit_adrs.[2]: UI writes are operator-intentional and a
  collision should surface as an error; ingestion writes must be
  idempotent.

  **Three-sidecar primary source for the same bug class**: the
  identification of the bug as a CROSS-CUTTING pattern (not a Tag-specific
  bug) is now THIRD-INSTANCE confirmed (Tag + metadata_field + service-tier).
  The pair (Tag + metadata_field) share:
    - The listBy → bulkCreate two-step at the service tier
    - The race-window-resolves-via-UniqueConstraintException at the
      partial-unique-index
    - The intentional dual-method design (UPSERT for ingestion;
      fail-on-duplicate for UI-tier)

  **Triggering scenarios in real deployments** (same shape for both
  Tag and MetadataField):
    (a) Two end-users concurrently apply a novel tag/field to two
        different entities. One succeeds; the other hits the race;
        the loser sees the 5xx-level surface.
    (b) A single user double-clicks a UI submit. React state may
        deduplicate; if the UI does NOT debounce, the second click
        races the first.
    (c) An automation script applies a tag/field to many entities in
        parallel. The first batch wins; subsequent batches with the
        same novel name race.

  **The DB-side partial unique index is the PROTECTION** (in both
  cases) — without it, both racers would succeed and produce two
  distinct rows with the same name (the silent-duplicate case is
  WORSE than the explicit 5xx surface, so the protection is
  appropriate at the DB layer). The gap is in the SERVICE layer's
  failure-handling: a UniqueConstraintException loser should re-read
  via listBy and reuse the now-existing id, not surface as a 5xx
  error to the user.

  **Pair with REFACTOR-223 (Tag side-door class)** — the auto-create
  surface is wide-open per the spec-documented design intent, but the
  TOCTOU race surfaces the operational fragility: the wide-open
  auto-create UX produces 5xx errors under concurrent load. The
  pairing is the diagnostic — the side-door creates the bug class;
  the TOCTOU surfaces it operationally.

  **Companion finding — same auto-create-on-miss class affects other
  tables**:
    - Owner auto-create at OwnerServiceImpl.getOrCreate (batch F finding;
      Owner has a similar partial unique index `owner_name_unique` per
      V0_0_64).
    - Namespace auto-create at NamespaceServiceImpl (batch K finding via
      TermServiceImpl.upsertTags transitive path);
      `namespace_name_unique` partial index per V0_0_64.
    - Title auto-create at OwnershipServiceImpl path (similar shape).
    - **MetadataField INTERNAL auto-create at
      MetadataFieldServiceImpl.getOrCreateMetadataFields (batch R —
      primary source).**
  **The TOCTOU race shape applies to every "auto-create-on-miss"
  service-tier method that does listBy → bulkCreate without the
  DB-side ON CONFLICT protection.** This invariant now captures THREE
  PRIMARY SOURCES for the class — the Tag instance (batch N + batch
  VAL-LSN-019 service-tier confirmation), the MetadataField INTERNAL
  instance (batch R), and the service-tier orchestration evidence
  (TagServiceImpl batch VAL-LSN-019). The cross-cutting
  auto-create-class finding is captured at the
  spec-documented-auto-create-with-scope-asymmetry invariant.
