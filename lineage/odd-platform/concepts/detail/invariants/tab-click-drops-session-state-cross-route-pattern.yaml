name: |-
  Top-nav tab click DROPS UI session state — Search Catalog tab and Activity tab both link to bare base path, dropping URL session parameters
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-09
description: |-
  **NEW LOW-severity UX INVARIANT, batch ZI (2026-05-26)** — the
  AppToolbar's top-nav tabs (rendered globally on every navigation via
  `ToolbarTabs.tsx`) consistently link to BARE base paths via the
  `*Path()` builders called with no arguments. This DROPS any URL
  session state the user accumulated and forces a fresh-mount of the
  destination page.

  **Two confirmed instances in batch ZI**:

  (a) **Search/Catalog tab** (`ToolbarTabs.tsx:38`):

          { name: t('Catalog'), link: searchPath(), value: 'search' }

      `searchPath()` (no-arg) returns `/search`. When a user is on
      `/search/{uuid}` (a session URL) and clicks the Catalog tab,
      the URL bar becomes `/search` (no UUID). `Search.tsx:37-42`
      sees no `routerSearchId` and dispatches
      `createDataEntitiesSearch(...)` -> `POST /api/search` -> a NEW
      `search_facets` row -> navigates to `/search/{new-uuid}`. The
      previous session UUID is dropped; the previous row stays in
      the database (orphaned until the 30-day TTL housekeeping
      reaper deletes it per
      `invariant:search-facets-bearer-token-shaped-no-user-binding`).

  (b) **Activity tab** (`ToolbarTabs.tsx:77`):

          link: activityPath(activityQueryString)

      Here `activityQueryString` IS derived from `defaultActivityQuery`
      (`components/shared/elements/Activity/common.ts:36-41`) — the
      default 6-day window with `type=ALL`. The session state on the
      Activity page is encoded in URL QUERY parameters (not a session
      UUID), so clicking the tab re-applies the DEFAULT filter set
      regardless of what the user had configured. A user on
      `/activity?type=MY_OBJECTS&beginDate=...&endDate=...&datasourceId=5`
      clicks the Activity tab and lands on the default 6-day ALL view.
      Their custom filters are dropped.

  **The architectural posture is consistent — top-nav tabs are
  "homecoming" affordances**. The intent is to give users a reliable
  "take me to a known-clean state of this pillar" entry point. The
  trade-off: users who EXPECTED their current session/filter state
  to persist across tab-switches are surprised. The doc pages at
  `/features/data-discovery/search` and
  `/features/active-platform-features/activity-feed` (both WebFetched
  2026-05-26 status 200) do NOT mention this UX (neither documents
  the URL form OR the tab-click semantics).

  **Compounding factor — the Search "Catalog" tab IS a NAME drift**
  (per the search route sidecar's `stress_findings.name_behavior_pairs.[searchPath]`):
  the tab label is `t('Catalog')` (in ODD's vocabulary the page is
  called "Catalog") but the URL is `/search` and the route module
  is `searchRoutes.ts`. A new developer or operator searching for
  "Catalog" in the codebase finds NOTHING; the URL bar shows
  `/search`; the doc page at
  `https://docs.opendatadiscovery.org/features/data-discovery/search`
  uses "Search and Filtering" as the feature label. Three different
  names for one feature.

  **Cross-tab consistency observation**: the Activity tab does NOT
  do the same NAME drift (`t('Activity')` ~ `/activity` URL ~ Activity
  Feed feature name) — the names align. The Search/Catalog tab is
  the only top-nav tab in batch ZI with this triple name divergence.

  **NOT a security finding** — the tab-drop-session pattern is
  intentional homecoming behaviour. Recorded as UX consistency
  observation. Operator awareness is the relevant lever.

  **Fix surfaces** (maintainer-triage):

    1. **Document the homecoming pattern** in
       `/features/data-discovery/search` and
       `/features/active-platform-features/activity-feed` — "Clicking
       this tab returns to the default view; URL filters are dropped".

    2. **Consider preserving non-session state on Activity tab**: the
       Activity tab COULD encode the user's last visited
       `type`+`beginDate`+`endDate` in localStorage and reapply when
       the tab is clicked. This would diverge from the homecoming
       posture but match many catalog UIs' tab semantics.

    3. **Resolve the Search/Catalog name drift** — either rename the
       URL (`/catalog`), rename the routes module (`catalogRoutes.ts`),
       or document the synonym mapping in
       `documentation/docs/main-concepts.md`.

  vocabulary_status: codebase-anchored. The "Catalog" / "Search" /
  "Search and Filtering" naming inconsistency surfaces here as the
  first cross-batch evidence; recommend a maintainer triage on the
  canonical name. The "drop session on tab click" pattern is NOT
  documented at the doc-product level.

  ## STRENGTHENED — batch ZJ (2026-05-26)

  Batch ZJ adds the ToolbarTabs.tsx primary-source sidecar
  (odd-platform__ts__components_shared_elements_AppToolbar_ToolbarTabs__ui-shell-widget__ToolbarTabs.md)
  with the IMPLEMENTATION-SHAPE evidence:

  **Two of the nine tabs have non-trivial onClick handlers** that
  fire CREATE thunks before navigation, generating a new session UUID
  for EACH click:

    - 'ToolbarTabs.tsx:121-123' — Catalog click dispatches
      `createDataEntitiesSearch(initialParams)` via useCreateSearch,
      mints a server-side searchId, then navigates.

    - 'ToolbarTabs.tsx:111-119' — Dictionary click dispatches
      `createTermSearch`, mints a server-side termSearchId, then
      navigates to `/termsearch/<id>`.

  **The orphan-id consequence is multiplicative**: every click of
  Catalog OR Dictionary mints a new server-side row, then drops the
  previous session's row. The ToolbarTabs sidecar's
  resource_boundaries.idempotency block explicitly records 'Clicking
  Catalog 5 times in 2 seconds creates 5 orphaned search-id rows
  server-side' — the housekeeping reaper recovers but the visibility
  of the orphan is the steady-state result of normal use.

  **The silent-failure surface is wider than batch ZI named**: both
  create-thunk-then-navigate handlers call `.unwrap().then(...)`
  WITHOUT a `.catch(...)` ('ToolbarTabs.tsx:112-117' for Dictionary
  + 'useCreateSearch.ts:14-19' for Catalog). If the thunk rejects
  (backend unavailable, 5xx on the search-create POST), the user
  clicks the tab and NOTHING happens. No error toast (the toolbar
  itself has no showServerErrorToast surface), no navigation, no
  state change. Silent failure on a primary nav action — exactly
  the failure-mode class LSN-019 / LSN-020 documented for the
  backend ordering / user-filter respectively. Captured separately
  as `toolbar-create-thunk-no-catch-silent-failure` invariant
  (batch ZJ).

  **Cross-tab consistency (corrected)**: ALL nine tabs render
  unconditionally; ONLY TWO of nine (Catalog, Dictionary) carry the
  mint-new-id-on-click pattern. The other seven (Directory, Data
  Quality, Data Modelling, Master Data, Management, Alerts, Activity)
  are pure `<Link to=...>` navigations. The mint-on-click subset is
  precisely the one with backend session state to manage. The
  homecoming pattern is therefore TWO-SHAPED:
    - Catalog + Dictionary: full session reset (drop URL +
      mint new server-side id);
    - Activity: parameter-default reset (drop URL query string,
      apply defaults at module-eval time);
    - Other six: no session state to drop (pure navigation).
