proposed_action: |-
  Stand up `RolesList.integration.test.tsx` test `create_role_named_Administrator_with_attacker_policies_after_seed_soft_delete`. Use Testcontainers Postgres for the integration; pre-load V0_0_56 seed migration; soft-delete the seeded `Administrator` row via direct UPDATE; assert `role_name_unique WHERE deleted_at IS NULL` permits a new `Administrator` row; via the React-Testing-Library shell, click Create-role, fill name=`Administrator`, select 2 policies including any `MANAGEMENT_CONTROL` policy; submit; assert (a) the form submits successfully (no client-side block), (b) the DB now has two rows (one soft-deleted seed, one active attacker-controlled), (c) `getRolesPolicies` for the new role returns the attacker policies. Pin AS the current dangerous-but-shipping contract; surface to /review and the security pillar for an explicit ADR + fix that adds either a UI-side case-insensitive predefined-name reject (matching `UserProviderRole.values()`) OR a backend `RoleServiceImpl.create` UserProviderRole guard. Two probes for the case-sensitivity mismatch (lowercase admin) should accompany this test.
