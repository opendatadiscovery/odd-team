mitigations_unimplemented:
  - |-
    Consolidate to one fetcher per term detail page-open. Recommended
    shape (c) from the description — a shared useTermDetails(termId)
    hook that selects from Redux if populated, fetches if not.
    Coordinated change at TermDetails.tsx:37-45 (replace
    fetchTermDetails dispatch with the new hook) + Overview.tsx:19-21
    (replace useGetTermByID with the same hook).
  - |-
    Vitest + react-testing-library regression test pinning 'opening
    /terms/termId/overview produces EXACTLY ONE GET /api/terms/termId
    request'. Mock the API layer; count network calls; assert count
    is 1. The test would FAIL today (2 requests) and serve as the
    regression-pin for any future consolidation fix.
  - |-
    A live integration probe (sibling to P-004 for the LSN-017 case)
    that opens /terms/termId/overview against a populated test database
    and counts xhr_calls + database queries. Measurement-truth
    consistent with the LSN-017 precedent — empirically pin the
    double-fetch count, then re-run after the fix to confirm the
    flip from 2 to 1.
  - |-
    Codify the platform's detail-page composition convention — one
    fetcher per detail page; sub-tabs read from Redux. Document at
    /odd-platform-ui/src/components/README.md or sibling. The
    convention prevents future detail-page surfaces from inheriting
    the same shape.
