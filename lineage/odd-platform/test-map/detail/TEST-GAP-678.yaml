behaviour: |-
  **`listByTerm` enumerates EVERY dataset_field linked to a term across all owners, all data sources, all parent statuses — with NO filter on the parent DataEntity's `status` / `hollow` / `exclude_from_search`.** Lines 169-189 chain joins DATASET_FIELD → DATA_ENTITY → NAMESPACE / DATA_SOURCE / OWNERSHIP / OWNER / TITLE but apply NO filter on the parent. A field on a soft-deleted DataEntity (`STATUS = DELETED`) still appears in `listByTerm` results — terms remain backlinked to columns of deleted datasets via the API. This is consistent with `ReactiveDataEntityRepositoryImpl` invariant 3 (`EXCLUDE_FROM_SEARCH` is INCONSISTENTLY APPLIED) — another endpoint where the predicate is missing. The aggregation `jsonArrayAgg(field(OWNER.asterisk()))` lines 165-167 SURFACES every owner of every entity to every caller — visible-to-all is the explicit design, matching the read-collaborative posture pillar P-09 documents ("every authenticated user can enumerate the entire catalog"). The documentation surface does NOT warn operators that term lookups reveal cross-tenant column metadata.
