  disables auth — every @ConditionalOnProperty(havingValue=...) fails to match, no
  SecurityWebFilterChain bean is created, AND /api/appInfo echoes the typo back to
  clients'''
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[0] (triangulated
