behaviour: |-
  **CRITICAL — `POST /ingestion/entities/datasets/stats` is unauthenticated AND allows cross-dataset / cross-owner stats overwrites in EVERY deployment posture.**

  Three compounding failures:

  1. **Endpoint unauthenticated**: same root cause as TEST-GAP-815 (GET) — `IngestionDataEntitiesFilter.java:28` is hard-coded to `POST /ingestion/entities` (exact-literal); the sub-path `/ingestion/entities/datasets/stats` does NOT match. `/ingestion/**` is in `SecurityConstants.WHITELIST_PATHS` so UI auth (LOGIN_FORM/OAUTH2/LDAP) bypasses it. The controller has no `@PreAuthorize`. Live security docs (WebFetched 2026-05-20, status 200) EXPLICITLY list this endpoint: "/ingestion/entities/datasets/stats ... remain outside the ingestion filter's coverage".

  2. **Cross-dataset stats-write**: the payload's `dataset_oddrn` field is used ONLY to compute the FTS-recalc set (`DatasetFieldServiceImpl.java:168-170, 179`); the actual writes target `dataset_field` rows resolved BY FIELD ODDRN from the payload's `fields` map (`line 172-174`). An attacker who knows a target field's ODDRN can write arbitrary statistics to that field's `stats` JSONB column AND create EXTERNAL_STATISTICS tag relations on it — REGARDLESS of which dataset's ODDRN they declare in the parent `DataSetStatistics.datasetOddrn`. There is no parent-child consistency check.

  3. **Cross-owner stats-write**: combined with (1), collector A can post stats payloads targeting fields owned by team B (or no team / unowned). The `Owner` entity model exists but is NOT consulted on this ingestion path — no `currentUser` / `currentOwner` / `dataset.owner` cross-check. The whole `DatasetFieldServiceImpl.updateStatistics` body (lines 158-181) operates on payload-supplied ODDRNs.

  **Blast radius**:
  - Attacker scrapes the catalog's public-doc page or follows known ODDRN-generator conventions (`{datasource_oddrn}/datasets/{dataset_name}/fields/{field_name}`) to discover target field ODDRNs.
  - Issues `POST /ingestion/entities/datasets/stats` with `tags: [{name: "attacker-controlled"}]` and overwritten `stats: {nulls_count: 999999, mean: NaN}`.
  - Result: any authenticated viewer of the catalog's Dataset Structure tab sees corrupted statistics; downstream BI tools reading `dataset_field.stats` render nonsense.
  - The Quality Dashboard's rings + anomaly classes consume these stats (per P-04 Data Quality) — corruption propagates to the DQ surface.

  **Why CRITICAL**: this is the WRITE-side analog of TEST-GAP-815. The unauthenticated write to a load-bearing data column (used by P-04 Data Quality + UI Dataset Structure + downstream BI) compounds with cross-dataset blast radius. **Confirmed by live docs** (the security docs page surfaces the filter-coverage gap explicitly) — but **the live docs don't surface it on the DQ page where operators first encounter the endpoint** (DOC-GAP-NNN).

  **Test gap shape**: WebTestClient matrix test pinning unauthenticated reach × cross-dataset write × cross-owner write. Plus a sister `tags-as-side-effect` test (TEST-GAP-820) covering the tag-creation bypass.
