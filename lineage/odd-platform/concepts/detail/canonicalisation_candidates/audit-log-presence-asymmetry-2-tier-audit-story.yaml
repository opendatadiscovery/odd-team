proposed_canonical: Audit-log presence asymmetry (2-tier audit story)
rationale: 'REFINED cross-cutting invariant from batch 2026-05-12F. Originally surfaced
  in batch E as a 3-sidecar ''codebase-wide no-audit-log-on-RBAC-mutations'' hygiene
  gap; batch F primary-source corroboration on DataEntity-side updateStatus + createOwnership
  shows the gap is NOT codebase-wide. The platform has a 2-TIER AUDIT STORY: DataEntity-scoped
  writes (status updates, ownership-binding, description, etc.) ARE audited (TIER
  1 — via @ActivityLog or programmatic emission). RBAC-scoped writes (Policy / Role
  / Owner-directory) are NOT audited (TIER 2 — no @Slf4j, no events, no audit table).
  The asymmetry is the INVERSE of what a security-conscious operator would expect:
  data-content changes get audit; authorization-model changes (which control WHO can
  do what) do NOT. Three DOC-NNN candidates flow: audit-trail expectation undocumented
  across `/authorization/policies`, `/authorization/roles`, `/authorization/owners`.'
contributing_concepts:
- 'Tier 1 AUDITED: updateStatus + createOwnership (batch F)'
- 'Tier 2 UNAUDITED: createRole + createPolicy + createOwner (batch E)'
- Activity feed (batch A getActivity) covers DataEntity activity but NOT RBAC
suggested_add_to_docs: true
