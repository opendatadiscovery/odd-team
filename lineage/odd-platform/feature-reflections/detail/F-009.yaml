## maintainer_notes

(none — net-new reflection. Observations for the maintainer:

1. This feature has NO in-platform UI surface — the entry point is a WAL event, the operator
   surface is application.yml, and the recipient surface is the external channel. Per Rule 9
   this is NOT a `ui-incomplete` gap: the feature is genuinely headless by design (a CDC-driven
   outbound subsystem). The senior-product-owner UX questions were applied to the OPERATOR's
   configuration experience (H-009 protocol casing, H-013 live-reload) and the RECIPIENT's
   message experience (H-010 email payload parity, H-011 Slack injection), which is the correct
   reframing of "from the screen" for a feature whose "screen" is the channel.

2. 7 of 13 hypotheses are contradicted, 5 of them HIGH severity — an unusually high contradiction
   density. Three independent HIGH failures (H-002 cross-channel abort, H-007 poison-replay,
   H-008 thread death) are SILENT total-or-partial alerting loss with no telemetry; together they
   make "is alerting actually working right now?" unanswerable from ODD itself (compounded by
   H-012's audit silence). The maintainer should weigh a single observability+resilience epic
   (subscriber health metric + delivery audit row + poison-quarantine) over piecemeal fixes.

3. The live doc has been materially improved since the sidecars were written (2026-05-20 -> the
   2026-06-01 WebFetch): cross-channel abort, mrkdwn injection, unsigned webhook, no-audit, SMTP
   timeouts, AND the lowercase-smtp trap are all now documented. Several sidecar doc_drift_findings
   are therefore STALE (closed on the doc side) — a file-analyser refresh of the six notification
   sidecars should re-verify against the current live doc and downgrade those drift findings.
   The CODE gaps they describe all remain; only the doc-side mirror changed.

4. Two new drift classes proposed: email_channel_payload_omits_owners_and_downstream_doc_claims_parity
