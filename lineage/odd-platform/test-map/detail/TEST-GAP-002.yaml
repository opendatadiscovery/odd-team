surfaced_by:
- AlertController.md:tests_coverage_semantic.uncovered_behaviours.[1]
behaviour: Owner-scoped endpoints (`/my`, `/dependents`) take no principal parameter
  — they rely on the reactor `Context` carrying the authenticated principal through
  to `AlertService`. A regression in WebFlux security filter chain would silently
  degrade `/my` and `/dependents` to either empty or unscoped output without any controller-layer
  alarm.
