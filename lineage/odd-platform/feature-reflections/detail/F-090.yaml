# Permission Read Surface — Contextual vs Non-Contextual Split — product-owner reflection

## product_owner_narrative

The Permission Read Surface answers a question every authenticated user's UI silently asks on every page it renders: *"what is this person allowed to do on the thing they're looking at right now?"* A product owner frames it like this: "When you open a Data Entity, a Term, or a Query Example, the platform asks the backend — against the live policy graph, not a stale cache — which actions you may perform, and uses the answer to enable or disable buttons (edit description, change ownership, add a tag). When you need to know your *global* management powers (can I create a Policy? edit a Lookup Table? manage owners?), that answer rides on your identity payload instead." The audience is the **odd-platform-ui-end-user** (whose buttons this drives) and the **odd-api-consumer / integration-author** compiling an SDK against the Platform API (per `system-mission.md:249-266` P-09 + the P-11 developer surface). It is the READ-side dual of F-006's RBAC write side — same policy-evaluation graph, asked "what do I have" instead of "is this mutation allowed" (per `getResourcePermissions` sidecar `understanding` + `implicit_adrs[0]`).

The first thing a senior product owner notices is that **this one user-facing capability is delivered by TWO endpoints, and which one you hit depends on a property of the resource type you ask about** — a fact invisible from the OpenAPI surface. Contextual permissions (for a specific entity/term/query-example) come from `GET /api/resource/{permission_resource_type}/{resource_id}/permissions` (per `PermissionController.java:20-25`, a single-method delegating controller). Global management permissions come from `GET /api/identity/whoami`, whose `Identity.permissions` field is populated by `IdentityServiceImpl.getAssociatedOwner` calling `permissionService.getNonContextualPermissionsForCurrentUser(PermissionResourceType.MANAGEMENT)` (per `IdentityServiceImpl.java:42-43`, source-read this invocation). The discriminator that routes between them is `PolicyTypeDto.hasContext` — `DATA_ENTITY/TERM/QUERY_EXAMPLE` carry `true`, `MANAGEMENT` carries `false` (per `PolicyTypeDto.java:8-12`).

The working parts as a product owner would demo them, traced through the chain. **Dispatch**: the contextual endpoint computes `PolicyTypeDto.valueOf(resourceType.name())` then, `if (!policyTypeDto.isHasContext())`, throws `BadUserRequestException("Resource type " + resourceType + " does not have context")` (per `PermissionServiceImpl.java:24-27`). **Evaluation** (contextual happy path): for a real `DATA_ENTITY`, it loads the caller's roles -> policies, builds the resource context (entity dimensions + tags + the caller's associated owner), evaluates every policy statement, and emits the union as a `Flux<Permission>` (per `getResourcePermissions` sidecar `understanding` + `concepts.invariants[2]`). **The whoami half** hardcodes `MANAGEMENT` (the only non-contextual type) and cannot be parameterised by the caller (per `IdentityServiceImpl.java:42`). **The UI orchestration**: `getGlobalPermissions` reads `profile.owner?.identity.permissions` (the whoami half) and a separate selector reads `profile.permissions[resourceType][resourceId]` (the contextual half) — `WithPermissionsProvider` stitches the two (per `profile.selectors.ts:17-20,27`, source-read this invocation).

The integration story (per `system-mission.md` P-09 cross-pillar graph + F-090 `related_features`): F-006 is the WRITE side of the same policy graph; F-085 owns the whoami surface this feature shares; F-026 (Lookup Tables) depends on this split because `LOOKUP_TABLE_*` permissions are folded into the MANAGEMENT bucket and are therefore reachable ONLY through the whoami half — a Lookup-Table page cannot ask "what can I do on lookup table X?" contextually (per `getResourcePermissions` sidecar `bugs_limitations_corner_cases[2]`). F-029 (Platform Public API Contract, P-11) is the upstream owner of the OpenAPI-vs-runtime drift class that this feature instantiates for `PermissionResourceType`.

A product owner would flag four edge cases in a demo. (a) **The spec lies to an SDK author**: `components.yaml:3381-3387` declares MANAGEMENT a valid `PermissionResourceType`, so a generated client offers a four-way switch; calling the MANAGEMENT arm against the runtime returns HTTP 400 USR001, not a permission list (H-001). (b) **A latent operator-maintainer trap**: a future maintainer who adds a contextual `PolicyTypeDto` value but forgets the extractor bean gets `IllegalArgumentException("No extractor...")`, which — because `ControllerAdvice` has no handler for it — surfaces as HTTP 500 "Internal Server Error", not the descriptive 400 the MANAGEMENT path gets (H-005, source-confirmed at `ControllerAdvice.java:61-66`). (c) **Under DISABLED the contextual endpoint returns `[]`** (no SecurityContext -> empty policy chain) while mutation endpoints are simultaneously open — the UI greys out every button while the API accepts every write (H-006). (d) **There is no single "tell me everything I can do" call** — an integrator must orchestrate both endpoints themselves (H-007); the live docs now describe this orchestration (WebFetched 2026-06-03, the DOC-243 outcome) but the API offers no unified surface.

## hypotheses

- id: H-001
  hypothesis: |
    When a third-party integrator who compiled an SDK from openapi.yaml calls
    GET /api/resource/MANAGEMENT/{id}/permissions (MANAGEMENT being a value the
    PermissionResourceType spec declares valid), they receive HTTP 200 with the
    caller's management-scope permission list — the same four-way switch the spec
    presents actually works four ways at runtime.
  derivation: |
    Endpoint-shape — components.yaml:3381-3387 declares a 4-value enum
    (DATA_ENTITY/TERM/QUERY_EXAMPLE/MANAGEMENT) on the getResourcePermissions
    operation (openapi.yaml:3681-3702); an SDK consumer believes all four are
    callable. Category-F naming alignment: does the runtime honour the spec's
    declared input domain?
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      PermissionServiceImpl.getResourcePermissionsForCurrentUser computes
      PolicyTypeDto.valueOf("MANAGEMENT") -> MANAGEMENT(hasContext=false), and
      `if (!policyTypeDto.isHasContext()) throw new BadUserRequestException("Resource
      type MANAGEMENT does not have context")` (PermissionServiceImpl.java:24-27,
      source-read). ControllerAdvice.java:24-28 maps BadUserRequestException ->
      HTTP 400 (error code USR001). So a MANAGEMENT call returns HTTP 400 with body
      "Resource type MANAGEMENT does not have context", NOT a 200 permission list.
      Three of the four spec-declared enum values work on this endpoint; the fourth
      is rejected. The management permissions the integrator wanted live on a
      DIFFERENT endpoint (GET /api/identity/whoami -> Identity.permissions, hardcoded
      to MANAGEMENT at IdentityServiceImpl.java:42).
    evidence:
      - sidecar: "odd-platform__java__PermissionController__controller-method__getResourcePermissions.md"
        section: "concepts.invariants[0] + bugs_limitations_corner_cases"
        cite: "PermissionServiceImpl.java:24-27"
        note: "hasContext==false -> BadUserRequestException; sidecar states MANAGEMENT (and any non-contextual type) is rejected."
      - sidecar: "(source_read_for_validation)"
        section: "Rule-8 confirmation read"
        cite: "ControllerAdvice.java:24-28 + components.yaml:3381-3387 + IdentityServiceImpl.java:42"
        note: "BadUserRequestException->400; spec declares 4-value enum; MANAGEMENT permissions reachable only via whoami."
    source_read_for_validation: true
    operator_visible_failure: |
      (a) An integrator generates a Platform-API SDK, sees PermissionResourceType
          with four constants, and writes `getResourcePermissions(MANAGEMENT, id)`
          to discover the caller's management powers. At runtime every such call
          returns HTTP 400 USR001 — the SDK compiled cleanly, the contract lied.
      (b) The error message ("does not have context") explains the SYMPTOM but not
          the REMEDY: nothing in the 400 response, the spec, or the generated SDK
          points the integrator at whoami -> Identity.permissions. They must read
          PermissionServiceImpl + IdentityServiceImpl source to discover the actual
          mechanism. (The live permissions docs page NOW documents the orchestration,
          per DOC-243 — but an SDK author working from the spec alone never sees it.)
      (c) A Swagger-UI explorer hitting "Try it out" with MANAGEMENT selected gets a
          400 with no hint that the operation simply does not accept that enum value.
    severity: HIGH
    confidence: HIGH
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional
    routes_to_finding: caveat-candidate

- id: H-002
  hypothesis: |
    When the UI (or any authenticated caller) requests
    GET /api/resource/DATA_ENTITY/{id}/permissions for an entity that exists, the
    response is the caller's actual resolved permission set on THAT entity —
    correctly powering the enable/disable state of the action buttons on that
    entity's page.
  derivation: |
    Pillar-mission — P-09's read-side authorization-discovery (the UI button-enable
    capability) + the contextual-half of the split. This is the LEGITIMATE promise
    the feature exists to deliver; a reflection that catalogued only the spec drift
    would miss what the feature correctly does for its real consumer (the UI).
  seed_source: pillar-mission
  validation:
    verdict: confirmed
    actual_behavior: |
      For a contextual type (hasContext==true), PermissionServiceImpl delegates to
      the matching ContextualPermissionExtractor.getContextualResourcePermissions
      (PermissionServiceImpl.java:28-29, source-read). The DataEntity extractor
      loads the caller's roles -> policies (PolicyService.getCurrentUserPolicies),
      builds the resource context (entity dimensions + tags + the caller's associated
      owner), evaluates every policy statement, and emits the union as a
      Flux<Permission> (getResourcePermissions sidecar understanding +
      concepts.invariants[2]). The response is authoritative and recomputed per call
      (no cache), so a role change is observable on the next call; and the UI reads
      it via profile.permissions[resourceType][resourceId] (profile.selectors.ts:27).
      The contextual happy path delivers exactly what the feature promises.
    evidence:
      - sidecar: "odd-platform__java__PermissionController__controller-method__getResourcePermissions.md"
        section: "understanding + concepts.invariants[2] + implicit_adrs[1]"
        cite: "PermissionServiceImpl.java:28-29 + AbstractContextualPermissionExtractor.java:25-35"
        note: "Contextual extractor evaluates policies x context -> permission union; authoritative, uncached."
      - sidecar: "(source_read_for_validation)"
        section: "Rule-8 confirmation read"
        cite: "profile.selectors.ts:27"
        note: "UI reads profile.permissions[resourceType][resourceId] — the contextual half feeds button-enable state."
    source_read_for_validation: true
    confidence: HIGH
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional
    routes_to_finding: functional-test-demand

