- batch: N
  entry_point_added: |-
    repository-tier:ReactiveTermRepositoryImpl (the persistence-layer hub for every
    term read + the three link-table read shapes that drive P-06:F-001 + the
    TermPermissionExtractor hot path; 15 public methods across single-row lookups,
    paginated lists, FTS-ranked suggestions, faceted search, and the
    hasDescriptionRelations rename-protection guard)
  contributing_nodes_added:
  - odd-platform java repository reactive repository:ReactiveTermRepositoryImpl
  notes: |-
    Six new drift facets surface from primary-source repository-tier audit:
    (1) V0_0_76 vs V0_0_91 link-table schema asymmetry — V0_0_76__term_relations_hard_delete
    DROPPED `deleted_at` from data_entity_to_term / dataset_field_to_term /
    tag_to_term / term_ownership, but V0_0_91__add_term_to_term re-introduced
    `deleted_at` on term_to_term per line 6; (2) term_to_term.deleted_at is
    NEVER filtered at 7 read sites (lines 198-199, 227-231, 324-325, 345,
    429-430, 448-454, 472-491, 510-523) — either dead schema or missing filter;
    (3) hasDescriptionRelations parent-soft-delete corner — lines 415, 425
    filter `DATA_ENTITY.STATUS.ne(DELETED.getId())`, so a Term mentioned only
    in a soft-deleted entity's description CAN be renamed/hard-deleted, then
    restoring the entity leaves the `[[ns:term]]` text dangling; (4)
    getTermDetailsDto 12-JOIN + 7 jsonArrayAgg + 4 countDistinct query
    (lines 194-238) invoked by TermPermissionExtractor.getContext on EVERY
    authorized request to a TERM-scoped endpoint (HOT PATH for permission
    resolution); (5) countByState unconditional JOIN to TERM_SEARCH_ENTRYPOINT
    even when state.getQuery() is empty (line 361 vs findByState conditional
    join at 296-298) — count-vs-list desynchronisation for Terms missing FTS
    rows; (6) listTermRefDtos count-vs-list filter mismatch — `fetchCount(nameQuery)`
    ignores the `updatedAt` date range filter that the paginated list DOES
    respect (lines 113-114, 133), reported `total` higher than actual. Hop-3
    (ReactiveTermRepositoryImpl) — previously '(referenced from TermServiceImpl
    sidecar coupling)' — now PRIMARY-SOURCE CONFIRMED. ZERO direct test
    coverage (NamespaceServiceImplTest mocks existsByNamespace; no
    *RepositoryTest* class exists). The repository-tier read-collaborative
    posture is now SQL-anchored: every read returns Terms across every
    namespace to every authenticated user, paginated, with no per-namespace
    or per-owner scoping at this layer.
- batch: U
  entry_point_added: |-
    Controller-class:TermController (the HTTP entry point for the entire
    P-06 Business Glossary surface — 23 endpoints, 251 lines, implementing
    the OpenAPI-generated TermApi). Closes the 5-LAYER chain for P-06:F-001
    Term-to-Entity Linkage: controller-class + service + repository + UI
    list (TermSearch — see F-024) + UI detail (TermDetails) + FTS write
    repo (ReactiveTermSearchEntrypointRepositoryImpl — the term-side
    counterpart of the DataEntity FTS write surface). Plus
    ReactiveTermSearchEntrypointRepositoryImpl as the FTS-write companion
    maintaining 4 tsvector columns of `term_search_entrypoint` via 7
    INSERT ON CONFLICT DO UPDATE methods, one per refresh trigger
    (term-create/update, namespace rename, tag rename, tag-to-term link,
    ownership create/update/delete, owner edit).
  contributing_nodes_added:
  - odd-platform java TermController controller-class:TermController
  - odd-platform java repository reactive repository:ReactiveTermSearchEntrypointRepositoryImpl
  - odd-platform ts react-component:TermDetails
  notes: |-
    NINE new drift facets surface this batch, closing the 5-layer pillar
    coverage AND extending the cross-batch audit-silence finding to the
    SCHEMA-LAYER ENUM root cause. Listed in descending severity:
    (1) TERM-TO-TERM LINKAGE NO SECURITY RULE (HIGH) — TermController.java:237-249
    declares POST `/api/terms/{term_id}/term` and DELETE
    `/api/terms/{term_id}/term/{linked_term_id}` with NO SecurityRule entry
    in SecurityConstants.java (verified by grep — lines 174-193 cover TERM_*
    permissions for OTHER endpoints; the term-to-term paths are absent).
    Falls through to AuthorizationCustomizer's catch-all
    `pathMatchers("/**").authenticated()` (lines 29-30). Net effect: ANY
    authenticated user (LOGIN_FORM / OAUTH2 / LDAP) can create or delete
    term-to-term links regardless of the seven TERM_* permissions held.
    The Business Glossary docs (live-fetched 2026-05-20 status 200) declare
    TERM_UPDATE gates "directly-linked terms" — operators authoring RBAC
    policies based on the docs will silently fail-open on term-to-term
    linkage. DISTINCT from REFACTOR-217 (singular-vs-plural path mismatch
    on /api/dataentities/.../term[s]) — this is a COMPLETELY MISSING rule,
    not a misregistered one.
    (2) TERM-TO-TERM LINKAGE NO ActivityLog — INVISIBLE TO AUDIT FEED
    (MEDIUM) — TermServiceImpl.linkTermWithTerm (line 290) and
    removeTermToLinkedTermRelation (line 299) carry NO @ActivityLog
    annotation. Sibling linkage methods (linkTermWithDataEntity line 169,
    linkTermWithDatasetField line 211, removeTermFromDataEntity line 183,
    removeTermFromDatasetField line 225) ALL carry
    @ActivityLog(TERM_ASSIGNMENT_UPDATED). Term-to-term family is the SOLE
    linkage type missing the audit emission. Auditors investigating "who
    linked term A to term B" have no audit trail.
    (3) TERM DELETE CASCADE OMITS term_to_term ROWS (MEDIUM) —
    TermServiceImpl.delete (lines 155-164) cleans up data_entity_to_term +
    dataset_field_to_term but NOT term_to_term. Combined with the batch-N
    schema-drift invariant (7 read sites never filter
    term_to_term.deleted_at IS NULL), orphan term_to_term rows remain
    visible on getTermLinkedTerms indefinitely. Operators deleting a term
    that had term-to-term linkages will see the deleted term still appear
    in OTHER terms' linked-terms lists.
    (4) TERM CREATE/UPDATE STATUS-CODE DRIFT (MEDIUM) — TermController
    returns 200 on createTerm (line 74) and updateTerm (line 82); OpenAPI
    declares 201 for both (openapi.yaml:2760-2761, 2798-2799). Existing
    OpenAPI-generated clients expecting 201 may treat 200 as
    "not the expected success" — typed-client edge case.
    (5) TERM SEARCH SESSION NO PER-CALLER OWNERSHIP CHECK (MEDIUM) — the
    6 search-state endpoints (TermController.java:166-216) authenticate
    via `pathMatchers("/**").authenticated()` and rely on the unguessable
    `searchId` UUID as session ownership. No rate-limit on session
    creation, no per-caller session count, no confirmation the caller is
    the session creator on updateTermSearchFacets. Pattern lives in the
    new F-024 Term Search & Browse feature minted this batch.
    (6) TERM LIFECYCLE AUDIT-SILENCE — ENUM-ROOTED (HIGH, schema-layer)
    — `ActivityEventTypeDto.java:3-31` enum has NO `TERM_CREATED`,
    `TERM_UPDATED`, `TERM_DELETED`, `TERM_DESCRIPTION_UPDATED`,
    `TERM_TAGS_UPDATED`, or `NAMESPACE_CREATED` values defined.
    TermServiceImpl createTerm / updateTerm / delete (lines 99-165) emit
    NO @ActivityLog annotations. The activity feed shows term-to-data-entity
    LINK changes (TERM_ASSIGNMENT_UPDATED) but never term LIFECYCLE changes.
    REFINES F-006 batch-R `audit_silence_schema_rooted_activity_data_entity_fk_not_null`:
    the audit-silence is not JUST a NOT-NULL FK problem on
    `activity.data_entity_id`, it is ALSO an enum-roots problem — even if
    a schema migration made data_entity_id nullable, the @ActivityLog
    mechanism routes via ActivityEventTypeDto values and there are NO
    values defined for term lifecycle events. The fix requires BOTH a
    schema-layer change AND new enum values + new ActivityHandler
    implementations. Cross-link to F-006 batch-U extension.
    (7) TERM DEFINITION XSS SURFACE — F-004 CLASS 3RD SURFACE (HIGH) —
    cross-link to F-004 batch-U extension for the primary documentation.
    Term definitions flow through TermDefinition.tsx → Markdown.tsx →
    MDEditor.Markdown with rehype-raw (no rehype-sanitize anywhere in
    odd-platform-ui). The XSS surface previously documented for entity
    descriptions (F-004) + dataset-field descriptions (F-004 batch R) now
    extends to TERM DEFINITIONS. An operator with TERM_UPDATE can plant
    XSS that fires for any authenticated viewer (read-collaborative).
    Cross-link: F-004 primary documentation; the F-002 facet exists
    because Term lifecycle is THIS feature's domain.
    (8) FTS WRITE PATH — TERM DELETE LEAVES STALE VECTOR (MEDIUM) —
    `TermServiceImpl.delete` (lines 153-165) calls NO method on
    ReactiveTermSearchEntrypointRepositoryImpl to drop the term's row
    from `term_search_entrypoint`. Soft-deleted terms keep their last-known
    tsvector contents in the FTS table indefinitely. Readers that join
    `term` with `DELETED_AT.isNull()` won't see them, but any reader
    querying `term_search_entrypoint` directly (without the join) would
    surface deleted terms. Pattern mirrors the DataEntity-side
    `delete_search_vector_not_refreshed` family from earlier batches.
    (9) FTS WRITE PATH — TERM_OWNERSHIP soft-delete NOT FILTERED (LOW)
    — `updateChangedOwnershipVectors` + `updateChangedOwnerVectors`
    (ReactiveTermSearchEntrypointRepositoryImpl.java:180-195, 222-237)
    use `leftJoin(TERM_OWNERSHIP)` with NO
    `TERM_OWNERSHIP.DELETED_AT.isNull()` filter. The
    `term_ownership.deleted_at` column exists
    (V0_0_35__add_terms.sql:36); in practice TermOwnershipServiceImpl.delete
    hard-deletes the ownership row so this is masked, but the absent
    filter is a latent bug if any code path soft-deletes a
    term_ownership row.
    Cross-batch coherence (LSN-018 Rule 6):
    STRENGTHENS=5 (F-006 audit-silence enum-rooted refinement;
    F-004 XSS 3rd surface; F-002 cross_namespace_term_pollution via
    TermSearch UI; F-002 get_term_details_dto_12_join_hot_path via
    TermDetails+Overview double-fetch; F-017 search-session pattern
    parallel via F-024). SUPERSEDES=0. CONFLICTS=0.
