proposed_action: |-
  Parameterised unit test on GoogleUserHandler. Six cases: (1) adminPrincipals=['john@odd.com'] + IdToken.email='john@odd.com' → ADMIN; (2) adminPrincipals=['john@odd.com'] + IdToken.email='JOHN@ODD.COM' → ADMIN (containsIgnoreCase); (3) adminAttribute='sub' + adminPrincipals=['sub-12345'] + IdToken.sub='sub-12345' → ADMIN; (4) adminAttribute UNSET + adminPrincipals=['alice'] + IdToken.email='alice' + IdToken.<userNameAttribute>='different' → ADMIN matches by EMAIL (not userNameAttribute) — the Google-specific default; (5) adminPrincipals=['john@odd.com'] + IdToken.email='alice@odd.com' → USER; (6) adminPrincipals=[] + IdToken.* arbitrary → USER. Pin all six.
