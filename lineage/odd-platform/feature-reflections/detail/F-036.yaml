- id: H-009
  hypothesis: "When two users concurrently grant ownership using the same brand-new title name, both grants succeed (the title is created once and reused)."
  derivation: "Negative-space: a getOrCreate dimension should converge under concurrency; a user should not be punished for a directory race they cannot see."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      getOrCreate is read-then-insert with NO ON CONFLICT handler. Two parallel
      OwnershipServiceImpl.create calls naming the same unseen title both observe
      getByName empty, both attempt create; one wins, the other hits the
      TITLE_NAME_UNIQUE constraint → UniqueConstraintException → HTTP 400 USR003.
      Because the @ReactiveTransactional boundary wraps the whole grant, the losing
      side's ENTIRE ownership grant rolls back, not just the title insert. The
      losing user's grant fails with a generic 400.
    evidence:
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: stress_findings.resource_boundaries
        cite: "TitleServiceImpl.java:19-22 + ExceptionUtils.java:22-23,72-74"
        note: "read-then-insert, no ON CONFLICT; UNIQUE violation -> 400 USR003"
      - sidecar: odd-platform__java__service__service__OwnershipServiceImpl.md
        section: invariants[4]
        cite: "ControllerAdvice.java:36-40 + @ReactiveTransactional at OwnershipServiceImpl.java:49"
        note: "losing side's whole grant rolls back atomically"
    operator_visible_failure: |
      A transient, retry-resolvable HTTP 400 USR003 with a message about a uniqueness
      violation that does not explain the race — the user did not knowingly create a
      duplicate title; they were granting ownership. The window is narrow (two grants
      of the same NEW string within the same instant) so it is LOW frequency, but the
      error shape is opaque and the failure is the whole grant, not a recoverable
      partial. A retry succeeds because the row now exists.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

