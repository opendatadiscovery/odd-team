use_case_coverage:
  verified: 2
  partial: 1
  total: 11
  note: "SECOND COVERAGE FRONTIER (verified promises / total promises). 2/11 verified + 1 partial as of IT-078 (specs/schema-revision-compare.spec.ts, 2026-06-07): UC-003 (status-coded CREATED/DELETED diff rows render side-by-side) and UC-006 (identical-version-id corner = 4xx + no diff row, not a broken screen) are now verified; UC-001 is partial (diff-render half covered; the Revision-compare button-click + disabled-below-2 affordance still untested). Was 0/11 — the Compare viewer previously had ZERO tests of any kind: no .test.* unit test for any of the 4 components, no Playwright e2e (IT-023 covers only the Structure-tab column render, not compare/diff), and the only backend diff test (F-045 DatasetVersionDiffTest) does not exercise this UI. 2 contradicted promises (UC-004/UC-005) are the PLT-028 Thread B + D defect set (need regression guards FOR the fix); 5 confirmed promises (UC-001/002/003/006/007) are hand-proven-but-untested (the exact LSN-030 hole — including the central status-coded-diff happy path UC-003); 1 contradicted perf caveat (UC-008, net-new); 1 partial (UC-009 Close-navigation, net-new caveat); 2 probe-needed (UC-010 responsive, UC-011 bad-id-vs-empty). A user-facing UI feature this behaviourally rich sitting at 0/11 verified is itself the finding. See feature-reflections/detail/F-191.yaml functional_test_demands."
