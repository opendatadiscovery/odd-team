control_summary: |-
  0 of 4 cells COVERED. Feature emerges from batch-M primary-source audit
  of getDataEntityGroupsLineage controller-method + LineageServiceImpl
  (the unique getDataEntityGroupLineage path, distinct from the per-entity
  getLineage path) + ReactiveGroupEntityRelationRepositoryImpl recursive
  CTE + the bidirectional-IN getLineageRelations(List<String>) overload
  + the per-member metadata fetch + the DEGLineage UI component. Ten
  substantive drift facets cluster around three load-bearing themes:
  (1) co-membership leakage — DEG-internal lineage cross-owner; wider
  blast radius than per-entity REFACTOR-203 because DEGs commonly span
  owner boundaries; HIGH severity; (2) undocumented carve-outs — inner-DEG
  suppression + 404 conflation + bidirectional edge filter + per-connected-component
  partitioning + bounded-member-set optimisation — five distinct contract
  ambiguities the docs don't address; MEDIUM-LOW severity; (3) zero test
  coverage at any layer — the recursive CTE that walks nested DEGs is
  the platform's most-fragile single-purpose SQL query for this surface
  and has no test feedback. The highest-leverage probe candidates are:
  (a) co-membership leakage — local docker-compose with ODD platform +
  Postgres + 2 seeded owners + a DEG containing entities from both +
  cross-owner lineage edges + invoke as user A (no DEG / member ownership)
  + assert response contains cross-owner edges; (b) inner-DEG suppression
  regression — seed DEG-A containing DEG-B containing entity E + lineage
  edges + GET /api/dataentitygroups/{A}/lineage + assert DEG-B is NOT
  in the response (pins the current carve-out so the future lift has
  an explicit migration); (c) 404 conflation — invoke with non-existent
  DEG-ID + empty-DEG + non-DEG-typed-ID + assert same 404 message in
  all three (pins the operator-visible conflation). Local probe stack:
  docker-compose with ODD platform + PostgreSQL + 2 seeded owners +
  cross-owner DEG + nested DEGs.
batch_extensions:
- batch: Z
  entry_point_added: |-
    controller-method:getDataEntitiesByDEGOddrn — the S2S READ-SIDE
    companion to the /api/dataentitygroups/{id}/lineage endpoint
    catalogued in F-016. The two endpoints answer different operator
    questions (lineage among members vs flat member list) but share
    the DEG-member-resolution call AND the read-collaborative posture.
    The architectural ASYMMETRY surfaced this batch: the lineage
    endpoint raises NotFoundException on empty membership (404); the
    membership endpoint returns 200 OK with empty items — TWO endpoints
    on the same platform produce TWO different contracts for the SAME
    semantic situation ("DEG exists but has no members").
  contributing_nodes_added:
  - odd-platform java IngestionController controller-method:getDataEntitiesByDEGOddrn
  notes: |-
    TWO new drift facets surface from the S2S read-side sibling +
    one STRENGTHENS on the existing 404 conflation facet. Listed in
    order of architectural leverage:

    (1) **CONTRACT ASYMMETRY between sibling DEG-read endpoints —
    404 vs empty-200 on the SAME semantic condition** (MEDIUM
    severity, NEW FINDING) — `LineageServiceImpl.java:62`
    (getDataEntityGroupLineage, on the /api/ namespace) raises
    `NotFoundException("Data entity group", dataEntityGroupId)` via
    `.switchIfEmpty(...)` when the member-resolution Flux is empty.
    `DataEntityGroupServiceImpl.java:92-108` (listEntitiesWithinDEG,
    on the /ingestion/ namespace) has NO switchIfEmpty — returns
    `CompactDataEntityList(items=[])` 200 OK for the same empty-
    membership condition. A third-party integration that probes both
    endpoints with the same DEG ODDRN must handle TWO different
    contracts. No docs name the asymmetry. The lineage-side raises
    on "empty member resolution"; the membership-side returns empty.
    Two methods on different services produce different shapes for
    the same input. NEW drift facet:
    `sibling_deg_read_endpoint_contract_asymmetry_lineage_404_vs_membership_empty_200`.

    (2) **Single-level (non-recursive) DEG-member projection vs
    recursive lineage walk — intentional asymmetry, undocumented at
    the S2S read surface** (LOW severity, NEW FINDING) —
    `ReactiveDataEntityRepositoryImpl.getDEGEntities(String)` at
    lines 318-326 is a flat SELECT with no `WITH RECURSIVE` CTE,
    contrasting `ReactiveGroupEntityRelationRepositoryImpl.java:177-204`
    (the recursive-CTE used by getDataEntityGroupLineage). A DEG-A
    containing nested DEG-B containing entity E:
    - GET /ingestion/entities/<DEG-A oddrn> returns DEG-B as a
      DATA_ENTITY_GROUP-typed CompactDataEntity (single-level
      membership);
    - GET /api/dataentitygroups/<DEG-A id>/lineage walks nested DEGs
      via the recursive CTE then strips DEG-typed entries via the
      LineageServiceImpl.java:71-75 filter (the inner-DEG suppression
      F-016 cataloged) — the response carries entity E.
    The MEMBERSHIP read returns DEG-B (parent's direct child) and
    HIDES E; the LINEAGE read returns E and HIDES DEG-B. Same
    nested structure, opposite projections. Architecturally
    intentional but undocumented at the S2S read surface. NEW drift
    facet:
    `single_level_membership_vs_recursive_lineage_projection_asymmetry_undocumented`.

    (3) **404 conflation STRENGTHENED — same operator-debug shape
    extends to the SIBLING membership endpoint** (existing facet
    `404_conflation_three_conditions_one_error` STRENGTHENED by
    cross-endpoint mirror) — F-016's existing 404 conflation facet
    documents three conditions (DEG-not-found / empty-DEG / non-DEG-
    typed-ID) producing the same 404. The sibling membership
    endpoint produces the SAME conflation but with the INVERTED
    polarity (200 with empty items instead of 404). All FOUR
    conditions across the two endpoints surface as
    indistinguishable shapes:
    - lineage endpoint: 404 for {DEG-not-found, empty-DEG, non-DEG-typed-ID}
    - membership endpoint: 200 empty-list for {DEG-not-found, empty-DEG, non-DEG-typed-ID, malformed ODDRN}
    The DOC GAP DOUBLES — operators debugging "why am I getting
    empty results?" cannot discriminate from EITHER endpoint, and
    the two endpoints disagree on the polarity. STRENGTHENS via
    PRIMARY-SOURCE LINE-ANCHOR:
    `404_conflation_extends_to_sibling_membership_endpoint_with_inverted_polarity_empty_200`.

    Coherence (LSN-018 Rule 6 sweep):
