behaviour: |-
  **Delete-refetch + search-clear pagination quiescence unit gap.** CollectorsList.tsx:44-46 uses `useEffect(() => { if (!query) dispatch(fetchCollectorsList({page: 1, size})); }, [isCollectorDeleting, query, size])`. The dep array includes `isCollectorDeleting` (a redux deletion-status flag) — when a delete completes (`true → false`), the effect re-fires and refetches page 1. `size` is hardcoded `30` (line 40). The dep array notably OMITS `dispatch` (ESLint lint suppression — functionally harmless because dispatch is stable). When the user clears the search input (`setQuery('')` via X button or backspace), the effect at :44-46 fires `if (!query) dispatch(fetchCollectorsList({page: 1, size}))`, silently REWINDING pagination back to page 1. A user who has scrolled to page 5 and clears the search loses their scroll position with no warning toast — no undo. The 500ms debounce at :52-57 + Enter-key bypass at :63-65 round out the search behaviour. NO test asserts (a) delete-refetch: `isCollectorDeleting` flip `true → false` re-fires `fetchCollectorsList({page: 1, size})` under `!query`; (b) under active query, delete-refetch is SKIPPED; (c) clearing the search input rewinds to page 1 (pagination-state-lost regression-pin); (d) Enter-key in the search input fires immediately (bypasses 500ms debounce); (e) the dispatch-missing-from-deps lint suppression does not break behaviour. A regression that added `dispatch` to the dep array would (incorrectly) cause an infinite refetch loop; a regression removing the `!query` guard would clobber active searches on delete.
