realism_caveats: |
  This probe verifies the END-TO-END VISUAL OUTCOME of the AppToolbar surface
  under the default DISABLED-mode deployment. It does NOT verify the
  LOGIN_FORM / OAUTH2 / LDAP rendering paths — those are separate auth-mode
  configurations and would require alternative docker-compose stacks. The
  closest single-stack approximation would be LOGIN_FORM with a seeded admin
  user; that is OUT OF SCOPE for this probe (covered by sibling probes in
  the auth-mode sweep — e.g. P-169 for the Directory case, which targets
  LOGIN_FORM minimum-privilege).

  This probe verifies HYPOTHESIS (3) — Data Modelling tab visible despite
  datacollaboration.enabled=false — but it does NOT verify the SYMMETRIC
  hypothesis that ALL feature-gated tab entrypoints lack <WithFeature>
  wrapping (i.e. that this is a systemic pattern, not just a Data
  Modelling-specific oversight). The static analysis already confirms the
  pattern (ToolbarTabs.tsx:34-82 has no WithFeature wrapping for ANY tab);
  the probe pins the Data Modelling case as the highest-leverage concrete
  example.

  The DOM-probe portion is necessary; pure backend REST probes catch
  hypotheses (1) and (2) at the API layer but not the frontend rendering
  (which is the operator-visible surface). The integration is the value:
  hypothesis (1) at the API layer is already established by the
  IdentityController sidecar; the value of THIS probe is confirming the
  frontend ACTUALLY renders 'admin' (no intervening filter strips it).

  If hypothesis (2) shows logout_status != 404 (e.g. 200 with a stub page,
  or 302 to /), the configuration somehow registered a default handler;
  re-read the Spring-Security default-chain configuration to find it.

  If hypothesis (1) shows ui_body.toolbar_username_text != 'admin', a
  middleware or selector transformation is stripping/replacing the username;
  re-read profile.slice.ts and the AppToolbar render. The likely candidate
  is a WithPermissionsProvider or a redux middleware not yet inspected.
