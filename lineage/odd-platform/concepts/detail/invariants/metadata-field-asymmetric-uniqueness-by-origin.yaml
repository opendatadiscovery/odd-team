mitigations_unimplemented:
- |-
  Add the IX_UNIQUE_EXTERNAL_NAME_TYPE constraint name to
  ExceptionUtils.formatMessage's translation cascade so EXTERNAL
  collisions surfacing as exceptions (any future write path
  bypassing ingestData) get a clear message
  ("External metadata with this (type, name) pair already exists").
  Single-line addition; closes the ergonomics gap relative to
  Tag's `TAG_NAME_UNIQUE` handling.
- |-
  Document the asymmetric uniqueness model on the operator-facing
  custom-metadata feature page. Operators creating fields via the
  UI deserve to know that INTERNAL fields are name-unique
  regardless of type. Collector authors deserve to know that
  EXTERNAL fields are (type, name)-unique and can coexist across
  types.
- |-
  Add a UI-tier validation hint: when an operator types a new
  INTERNAL metadata field name in the create form, query
  `listInternalMetadata(query)` and disable submission if a row
  exists with the same name (regardless of the type the operator
  intends). Reduces the opaque-error surface.
- |-
  Add the regression test from the test-coverage proposal:
    INTERNAL-name-uniqueness-vs-type test: `bulkCreate({name='foo',
    type='STRING', origin='INTERNAL'})` followed by
    `bulkCreate({name='foo', type='INTEGER', origin='INTERNAL'})`
    expects UniqueConstraintException.
    EXTERNAL-name-allows-multi-type test: `ingestData({name='foo',
    type='STRING', origin='EXTERNAL'})` AND `ingestData({name='foo',
    type='INTEGER', origin='EXTERNAL'})` expects two distinct rows
    to coexist.
- |-
  Consider whether the asymmetry should be DOCUMENTED-AS-INTENDED or
  REVISITED. Two possible directions:
    Option A (preserve current behaviour): document the asymmetry as
    a deliberate design — operator vocabulary curation enforces
    single-type per name; collector vocabulary allows multi-type for
    real-world flexibility.
    Option B (unify): switch the INTERNAL side to ALSO key by
    (type, name) — symmetric uniqueness, simpler mental model.
    Risk: existing deployments with INTERNAL `foo:STRING` rows would
    not block re-creating `foo:INTEGER` after the migration; the
    operator vocabulary may FRAGMENT.
notes: |-
  This invariant is a NARROW MEDIUM-severity finding — it affects
  operators creating metadata fields via the UI and developers
  trying to understand the type semantics. The bug class is
  ASYMMETRIC-SCHEMA-ENFORCEMENT-WITH-OPAQUE-CONSEQUENCES: the
  schema encodes a deliberate distinction but the operator surface
  does not expose it.

  **Why the asymmetry exists (likely)**: the platform's GENESIS
  schema (V0_0_1) was authored with two distinct stakeholder
  audiences in mind — operators curating metadata for stewardship
  (one canonical `cost_centre` per platform), and collectors
  ingesting metadata from external systems (any metadata-key
  vocabulary their source defines, with possibly-conflicting
  types). The two-index design lets BOTH audiences coexist without
  rule-conflict.

  Cross-cutting connections:
    - Pairs with the metadata-field-soft-delete-partial-unique-index-mismatch
      invariant — both concern the partial indexes; this one
      captures the BUSINESS-DOMAIN intent; the other captures the
      SOFT-DELETE-CONVERGENCE miss
    - Pairs with the tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race
      invariant — both Tag and metadata_field have TOCTOU race
      surfaces in their respective `getOrCreate` patterns; the
      asymmetric-uniqueness model adds extra race surfaces for the
      INTERNAL-vs-EXTERNAL boundary
    - Pairs with the ingestdata-upsert-with-returning-conflict-trigger
      operation — the no-op upsert pattern (`set(NAME, EXCLUDED.NAME)`)
      is shared with Tag's ingestData; both maintain the RETURNING
      contract for the caller

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the asymmetric uniqueness model on the operator-
        facing custom-metadata page — operators creating fields
        deserve to know the rule
    (b) Document the absence of operator-facing custom-metadata
        documentation entirely — the live Data Discovery page does
        not mention custom metadata at all per the
        ReactiveMetadataFieldRepositoryImpl batch R
        docs_link_semantic.doc_drift_findings.[0] (LIVE 2026-05-20
        WebFetch); operators evaluating the feature can only find
        it via the permissions reference
    (c) Cross-link the asymmetric-uniqueness rule to the collector
        author docs (developer-guides/build-and-run/custom-collectors)
        — collectors emitting custom metadata need to know that
        (type, name) uniqueness applies to their side, NOT name-only
