- id: H-005
  hypothesis: >-
    When an operator soft-deletes a data entity (sets it to DELETED status), the
    entity is permanently purged 30 days later by `data_entity_delete_days` — the
    "oops I clicked delete" 30-day recovery window the feature advertises.
  derivation: >-
    The key `data_entity_delete_days` (default 30) + the soft-delete grace ADR
    (HousekeepingTTLProperties.md:implicit_adrs[1] "30 days is operator-comfortable
    for 'oops I clicked delete' recovery") promise time-based purge of DELETED
    entities. This is the core capability of the data-entity reaper.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The purge NEVER fires. DataEntityHousekeepingJob's cutoff predicate filters
      on `DATA_ENTITY.STATUS_UPDATED_AT <= now() - data_entity_delete_days` — but
      `STATUS_UPDATED_AT` is NEVER bumped on the transition INTO DELETED status,
      because `DataEntityMapperImpl.applyStatus` calls `pojo.setStatus(...)` BEFORE
      the change-detection guard `if (statusDto.getId() != pojo.getStatus())` — the
      guard's condition is therefore always false and the `statusUpdatedAt` write
      is skipped (concepts.yaml cross-batch invariant D+F, lines 185-192 +
      lines 124-127). With STATUS_UPDATED_AT left at its original (creation-era)
      value or null, the cutoff predicate either matches nothing relevant or
      behaves unpredictably, and DELETED entities persist indefinitely. The
      feature advertises a 30-day soft-delete-grace purge; the code delivers
      no purge at all.
    evidence:
      - sidecar: concepts.yaml (cross-batch invariant, the reducer-aggregated finding)
        section: "lines 185-192 (TTL retention broken by statusUpdatedAt nullification) + 124-127"
        cite: "DataEntityMapperImpl.applyStatus (setStatus before the prior-status check)"
        note: "the upstream ordering bug; DataEntityHousekeepingJob query depends on STATUS_UPDATED_AT"
        source_read_for_validation: false
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: dependencies_semantic.requires-feature[2]
        cite: "DataEntityHousekeepingJob.java:71-80 consumes DataEntityStatusDto.DELETED + STATUS_UPDATED_AT"
        note: "confirms the reaper's cutoff is keyed on STATUS_UPDATED_AT"
    operator_visible_failure: |
      (1) The soft-delete "recovery window then permanent purge" the feature exists
      to provide is a no-op: DELETED data entities accumulate forever, defeating
      the bounded-growth purpose of housekeeping for the single largest cascade
      table-set in the platform. (2) An operator who soft-deletes sensitive data
      expecting it to be permanently gone after 30 days (a GDPR right-to-erasure
      workflow) is silently NOT erased — a compliance failure, not just a growth
      problem. (3) The two failure surfaces compound: even if H-002 (TTL=0) were
      fixed, the data-entity reaper still would not fire because its cutoff column
      is dead. This is the highest-severity catch in this reflection because the
      feature's central promise is contradicted by a bug two layers upstream that
      no single housekeeping-tier sidecar can see.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: >-
    When a platform generates activity events continuously, the `activity` audit
    table is bounded by housekeeping the same way alerts and search facets are —
    old activity ages out.
  derivation: >-
    The feature is a "housekeeping cycle that purges stale data" and the live
    Activity-Feed Configuration page frames `odd.activity.partition-period` as
    controlling "retention and partitioning"; the operator expects activity to be
    retention-bounded.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      There is NO time-based retention for the `activity` table anywhere in the
      codebase. `HousekeepingTTLProperties` has exactly three fields and NO
      `activityDays`. The only activity-touching housekeeping path,
      `ActivityEmptyPartitionsHousekeepingJob`, drops a partition ONLY when it is
      BOTH past-end-date AND empty (`SELECT count(*) = 0`, PartitionServiceImpl.java:133-142).
      Each partition spans `2 × odd.activity.partition-period = 60 days`. On a
      steadily-used platform a 60-day window is never empty by the time it is past,
      so NO partition is ever dropped; the activity table grows monotonically (the
      repo-tier ReactiveActivityRepositoryImpl has zero `deleteFrom(ACTIVITY)`
      calls — F-010 batch-R). `odd.activity.partition-period` controls partition
      WIDTH only, not retention.
    evidence:
      - sidecar: odd-platform__java__housekeeping__job__ActivityEmptyPartitionsHousekeepingJob.md
        section: bugs_limitations_corner_cases[0]
        cite: "ActivityEmptyPartitionsHousekeepingJob.java:14-17 + PartitionServiceImpl.java:82-118"
        note: "near-no-op on steadily-used platforms → monotonic growth; LSN-001-shape silent-data-growth"
      - sidecar: odd-platform__java__housekeeping__job__ActivityEmptyPartitionsHousekeepingJob.md
        section: stress_findings Q-B.3
        cite: "WebFetch /features/active-platform-features/activity-feed#configuration"
        note: "the 'retention and partitioning' framing drifts; retention is volume-conditional, not time-based"
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: bugs_limitations_corner_cases[0]
        cite: "HousekeepingTTLProperties.java:8-12 (no activity field)"
        note: "second-angle confirmation — no activity*Days field exists"
    operator_visible_failure: |
      (1) A high-volume deployment (e.g. 1M events/day) accumulates hundreds of GB
      of audit data per year with NO recovery path short of manual
      `DROP TABLE activity_YYYYMMDD_YYYYMMDD` — eventual storage exhaustion. (2) An
      operator who reads "retention and partitioning are controlled by
      partition-period" and sets it expecting old activity to be purged gets WIDTH
      control only; nothing ages out. (3) Compliance frameworks requiring BOUNDED
      audit-log retention (SOX, GDPR records-of-processing) cannot be satisfied —
      there is no time-based mechanism to bound activity retention. The symmetric
      gap applies to the `message` table (DataCollaboration, default-off — narrower
      blast radius).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-007
  hypothesis: >-
    When an empty past `activity` partition is dropped, no concurrently-written
    activity row is lost — the "empty partitions only" name guarantees the drop is
    safe against in-flight writes.
  derivation: >-
    The class name `ActivityEmptyPartitionsHousekeepingJob` promises it only drops
    EMPTY partitions; an operator trusts that an audit row being written at the
    same moment is not silently destroyed.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The empty-check (`SELECT count(*) = 0`) and the `DROP TABLE` (no `IF EXISTS`)
      are TWO separate statements on the shared connection, NOT wrapped in a
      transaction and holding no pre-emptive lock (PartitionServiceImpl.java:108-127;
      EmptyPartitionsHousekeepingJob does NOT wrap in `transaction(...)`, unlike
      AlertHousekeepingJob/DataEntityHousekeepingJob). An `INSERT INTO activity`
      that lands AFTER the count-zero check but BEFORE the DROP would succeed
      (committed on the writer's autocommit connection), then DROP TABLE destroys
      the just-inserted row with no recheck and no error to the original caller.
      Static analysis says the race window is real (Q-E.3, Q-B.2); whether it is
      reachable under realistic write timing requires running the system.
    evidence:
      - sidecar: odd-platform__java__housekeeping__job__ActivityEmptyPartitionsHousekeepingJob.md
        section: bugs_limitations_corner_cases[1] + stress_findings Q-E.3 / Q-B.2
        cite: "PartitionServiceImpl.java:108-127 (two-statement non-transactional pattern)"
        note: "race window between empty-check and DROP; silent row loss if INSERT wins"
    operator_visible_failure: |
      If confirmed: silent loss of an audit-trail row that the writing code saw as
      committed-success — the worst kind of audit defect (the record the operator
      believes was saved is gone, with no error and no compensating undo). Severity
      HIGH if reachable.
    severity: HIGH
    confidence: MEDIUM
    probe_id: P-022
    routes_to_finding: bug-candidate

- id: H-008
  hypothesis: >-
    When ODD is deployed with multiple replicas, exactly one housekeeping cycle
    runs per 15-minute slot — ShedLock guarantees no two instances purge
    concurrently.
  derivation: >-
    The doc states housekeeping "uses ShedLock so only one platform instance runs
    it at a time in a multi-instance deployment"; the operator expects safe
    multi-replica behaviour.
  seed_source: doc-claim
  validation:
    verdict: probe-needed
    actual_behavior: |
      The orchestrator's lock is `lockAtLeastFor="14m" / lockAtMostFor="14m"`
      against a `fixedRate=15` schedule (HousekeepingJobManager.java:25-26) — only
      60 seconds of slack between maximum lock and next invocation. A cycle running
      ≥14 minutes (a large DataEntityHousekeepingJob cascade, especially with the
      `.block()` on S3 deletions) releases the lock BEFORE it commits, and a second
      instance can acquire at the 15-minute mark while the first is still
      finalising — two instances running housekeeping concurrently. Most row
      DELETEs are idempotent, but the data-entity cascade reads-then-deletes, so
      two concurrent snapshots could diverge; the empty-partition DROP (no
      IF EXISTS) raises an error on the loser. Whether a real cascade exceeds 14
      minutes (and thus whether the race is reachable) requires running the system.
    evidence:
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: bugs_limitations_corner_cases[3] + implicit_adrs[2]
        cite: "HousekeepingJobManager.java:25-26 (14m lock vs 15m schedule)"
        note: "razor-thin window; lock can release before commit on slow cycles"
      - sidecar: odd-platform__java__housekeeping__job__ActivityEmptyPartitionsHousekeepingJob.md
        section: stress_findings Q-E.1
        cite: "EmptyPartitionsHousekeepingJob.java:30-32 + HousekeepingJobManager.java:25-26"
        note: "two concurrent instances → DROP TABLE error on the loser, log noise, wasted work"
    operator_visible_failure: |
