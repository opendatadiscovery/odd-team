  Add `MetadataFieldControllerAuthMatrixTest`:

  1. `get_apiMetadataFields_authDisabled_anonymousCaller_returns200_withFullCatalogue_pinsAnonymousReach` — WebTestClient under `auth.type=DISABLED`; seed 5 fields (3 INTERNAL + 2 EXTERNAL); assert 200 + 3 items returned.
  2. `get_apiMetadataFields_authLoginForm_authenticatedNoPermissions_returns200_pinsAuthenticatedReachUngated` — same seed; login as user with ZERO permissions; assert 200 + 3 items.
  3. `get_apiMetadataFields_authOauth2_callerSeesFieldsCreatedByOtherUserOnUnrelatedDataEntity_pinsCrossUserExposure` — User A creates a custom-metadata value with field-name `org_secret_acquisition` on data entity X; assert User B (who has access to data entity Y but NOT X) sees `org_secret_acquisition` in the autocomplete catalogue. Pins the cross-user exposure contract.
  4. `get_apiMetadataFields_currentImplementation_noOWNERREAD_orCUSTOM_METADATA_FIELD_READ_permission_exists` — assert via grep that `SecurityConstants.SECURITY_RULES` has zero entries matching `/api/metadata/fields`.
  5. Pair with DOC-GAP-NNN-candidate (live docs must explicitly note the read posture) and REFACTOR-NNN-candidate (consider scoping by ownership for hardened deployments).

