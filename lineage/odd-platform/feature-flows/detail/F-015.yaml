description: |-
  The platform exposes a triplet of owner-anchored discovery endpoints on
  DataEntityController: `GET /api/dataentities/my`,
  `GET /api/dataentities/my/upstream`, and `GET /api/dataentities/my/downstream`.
  Each takes only `(page, size, exchange)` — no Authentication, no
  Principal, no owner-id parameter — and resolves the caller's owner
  identity via reactor Context propagation inside the service chain. The
  /my endpoint returns the set of entities the caller's Owner row directly
  owns (defended at SQL via JOIN OWNERSHIP WHERE OWNERSHIP.OWNER_ID = ?).
  The /my/upstream and /my/downstream variants compose a DIFFERENT chain:
  (a) resolve owner via authIdentityProvider.fetchAssociatedOwner(); (b)
  list owned entities via listByOwner (JOIN-defended at this anchor); (c)
  traverse one lineage hop via getLineageRelations(oddrns,
  LineageDepth.empty(), {UP|DOWN}STREAM) — recursive CTE base step only;
  (d) flatten parent+child oddrns, distinct; (e) EXCLUDE the anchor via
  `Predicate.not(oddrns::contains)`; (f) fetch entity rows for the
  derived set via listByOddrns(oddrns, false, false, page, size) — which
  has NO OWNERSHIP join, NO owner predicate, only DATA_ENTITY.ODDRN.in(...)
  + soft-delete + hollow filters.

  The user-observable promise (per `openapi.yaml:843-844` summary):
  "Returns list of data entities owned by current user with upstream
  dependencies". The user-observable reality, per primary-source code-walk
  of DataEntityRelationsServiceImpl.java:25-39: the response is the
  NON-owned-but-reachable upstream-adjacent set — entities the caller
  does NOT own that are referenced as upstream parents of entities they
  own. The OpenAPI summary is literally INVERSE of the actual semantic;
  the UI label `Upstream dependents` (OwnerEntitiesList.tsx:87) is
  semantically correct but the API contract layer external consumers
  read disagrees with both the code and the UI.

  Beyond the contract inversion, the architecture has a structural
  defence-in-depth gap: the owner-scoping invariant is enforced at
  EXACTLY ONE site (DataEntityRelationsServiceImpl.java:26 —
  `authIdentityProvider.fetchAssociatedOwner()`). The downstream
  `listByOddrns` projection at ReactiveDataEntityRepositoryImpl.java:228-253
  has NO OWNERSHIP join — the SQL trusts the input oddrn set. Contrast
  with the base `/my` endpoint's repository method
  `listByOwner` (lines 515-534) which DOES JOIN OWNERSHIP with
  `WHERE OWNERSHIP.OWNER_ID = ?`. The structural inconsistency between
  the two paths is the architectural finding: a regression at
  fetchAssociatedOwner (fallback owner-id for DISABLED mode, misordered
  WebFilter dropping the SecurityContext, USER_OWNER_MAPPING corruption,
  flatMap-vs-map typo) silently leaks the lineage neighbourhood of an
  unintended anchor. Today the code is correct; the architecture
  provides ZERO defence against a future regression at this single
  load-bearing call site (REFACTOR-225 PRIMARY-SOURCE).
facets_summary: |-
  10 substantive drifts: anchor-set single-point-of-failure (REFACTOR-225
  PRIMARY-SOURCE) + OpenAPI summary inversion (DOC-GAP-099 inverse-semantic
  4-angle triangulated — controller for upstream + controller for downstream
  + thunk + UI label) + no JOIN-side defence-in-depth contrast with /my
  endpoint's listByOwner + silent empty-set indistinguishable from
  no-owner-link from unlinked-user from no-lineage-data + unbounded
  IN-clause anchor fan-out (admin-owner / CI-bot DoS) + in-memory dedup
  defeats SQL pagination (cost O(anchor) not O(page)) + unstable
  pagination from missing ORDER BY on listByOddrns + hollow+soft-delete
  silent exclusion despite live LINEAGE rows + Data Lineage / Permissions
  doc-product silent on the owner-anchored lineage view + LineageDepth.empty()
  fragile sentinel encoding.
