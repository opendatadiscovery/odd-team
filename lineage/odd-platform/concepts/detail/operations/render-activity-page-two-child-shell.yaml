notes: |-
  NEW operation captured in batch ZL (2026-05-26). Activity is
  the UI surface where LSN-020's User-filter drift is FIRST
  encountered by an operator — the existing
  activity-user-filter-doc-promises-performed-by-sql-binds-owner-mapping
  invariant captures the SQL-layer drift; this operation
  captures the UI orchestration that surfaces it.

  Cross-batch follow-up: the 5-query-per-filter-change pattern
  (fetchActivityCounts via Mono.zip + fetchActivityList) is a
  hot path worth probing. Same shape as the LSN-017 view_count
  doubling family — multiple dispatches per single user action.
  A debouncer at the queryParams effect would reduce DB load by
  approximately N (for N rapid filter changes) at zero UX cost.
