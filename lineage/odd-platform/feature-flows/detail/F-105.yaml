amplification_factor: |-
  8 unguarded sub-area list endpoints × 1 list-fetch per mount × N entities
  per surface. For a 1000-entity-per-surface deployment: 8000 entities readable
  to every authenticated (or anonymous-under-DISABLED) network caller. Policy
  JSON detail fetches: 1 per policy ID navigated.
amplification_note: |-
  The amplification is in the gap between operator mental model and
  reality. Operators see "Management" as admin-only chrome (per tab
  visibility under F-041 + intuition + every doc page that mentions
  Management UI). Reality: only the WRITE PATH is admin-only.
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render — every Management sub-area renders its full list to any
    authenticated user. Detail-page navigation renders the full JSON of
    the selected entity (Policy contents, Role bundles, Collector token
    names, DataSource ODDRNs). Create/edit/delete buttons hide; the
    DOM-visible read is complete.
  evidence: |-
    NamespaceList.tsx:46-48 (canonical list-fetch shape) +
    ManagementRoutes.tsx:29-149 (the 9 sub-routes) +
    WithPermissionsProvider.tsx:12-48 (the non-blocking provider).
  cardinality_per_call: '1 page-render per sub-area visit; 1 detail-render per detail-navigation'
observed_vs_expected:
  facets:
    - facet_id: management_section_route_gating_reads_bypass_authorization_only_associations_gated
      drift_class: management_section_route_gating_reads_bypass_authorization_only_associations_gated
      severity: HIGH
      observed: |-
        Of 9 Management sub-areas, ONLY /management/associations/* has a
        working RestrictedRoute gate (ManagementRoutes.tsx:101-110).
        The other 8 — owners, roles, policies (+ policies/{id}),
        namespaces, datasources, collectors, tags, integrations —
        render their full catalog to any authenticated user (or any
        anonymous caller under DISABLED). NamespaceList.tsx:46-48 is
        the canonical fetch-on-mount shape across all 8.
      expected: |-
        Either every Management sub-area is gated by a RestrictedRoute
        for a Management-tier permission set, OR the read-collaborative
        posture is explicitly documented as the deliberate design
        choice (an implicit ADR surfaced + a doc-page caveat).
      operator_visible_consequence: |-
        A user with zero Management permissions deep-links to
        `/management/policies/{id}` and reads the Policy JSON (permission
        grants, ODDRN selectors, role attachments). Create/edit/delete
        buttons hide; the disclosure is real. Same for the other 7
        sub-areas. Under DISABLED this leaks to anonymous network callers.
        Seeded from SHB-163.
      ui_unverified: false
    - facet_id: with_permissions_provider_is_context_only_not_a_rendering_gate
      drift_class: with_permissions_provider_is_context_only_not_a_rendering_gate
      severity: HIGH
      observed: |-
        WithPermissionsProvider.tsx:12-48 — returns `children` unconditionally
        in every branch. The name suggests rendering-gate semantics;
        the implementation provides only React Context.
      expected: |-
        Either rename the component to clarify (e.g., WithPermissionsContext)
        OR introduce a sibling WithPermissionsGate that actually blocks
        rendering when the required permissions are absent.
      operator_visible_consequence: |-
        A reviewer reading the Management code sees `<WithPermissionsProvider>`
        wraps and assumes rendering is gated; the implementation does
        not match the inferred contract. Compound failure with the
        Integrations sub-area (which has NO provider at all).
      ui_unverified: false
    - facet_id: integrations_sub_area_has_no_permission_context_at_all
      drift_class: integrations_sub_area_has_no_permission_context_at_all
      severity: MEDIUM
      observed: |-
        Per managementRoutes sidecar bug #2 — /management/integrations
        has NO permission-context wrapping in ManagementRoutes.tsx.
        Inner `usePermissions().hasAccessTo` falls back to the outer
        Management.tsx context (OWNER_ASSOCIATION_MANAGE only), producing
        surprising deny-by-default for any integration-specific permission
        check.
      expected: |-
        Either wrap /integrations in its own permission context with
        an integration-specific allowedPermissions, OR explicitly
        document the fall-through as deliberate.
      operator_visible_consequence: |-
        Integrations features that gate on a custom permission key
        ALWAYS deny by default — the gate fires on the wrong context.
        Tomorrow a permission-gated integration feature ships and
        no admin can use it without explicitly granting
        OWNER_ASSOCIATION_MANAGE.
      ui_unverified: false
    - facet_id: admin_surface_existence_disclosed_to_non_admin_users_recon_information
      drift_class: admin_surface_existence_disclosed_to_non_admin_users_recon_information
      severity: MEDIUM
      observed: |-
        The Management list pages leak the EXISTENCE of admin surfaces
        + the catalog of admin-tier resources (Policy names, Role names,
        Collector identities). For deployments with strict separation-
        of-duties requirements, this is reconnaissance information.
      expected: |-
        Either a route-level gate hides the lists, or the operator-facing
        docs (Cornerstone-3 caveat) explicitly note the leak.
      operator_visible_consequence: |-
        Compound with F-041 toolbar's Management tab visibility — any
        authenticated user can browse the admin surface's catalog
        even when they cannot mutate it.
      ui_unverified: false
    - facet_id: docs_do_not_document_management_ui_permission_model_at_all
      drift_class: docs_do_not_document_management_ui_permission_model_at_all
      severity: MEDIUM
      observed: |-
        `docs.opendatadiscovery.org` does not document the Management UI's
        permission visibility model. No per-tab visibility statement,
        no Cornerstone-3 caveat, no screenshot showing the
        "non-admin sees full Policy list" reality. Per SHB-163 evidence.
      expected: |-
        Either a doc-page caveat ("Management section reads are not
        gated by permission") + a behaviour table, OR the gates are
        added and the doc page describes the gated behaviour.
      operator_visible_consequence: |-
        Cross-link DOC-NNN candidate. Operators rely on intuition +
        toolbar chrome ("Management is admin-only") which the
