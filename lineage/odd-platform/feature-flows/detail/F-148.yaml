observed_vs_expected:
  facets:
  - facet: |-
      Class-tab dispatch mixes string sentinels ('all' / 'my') with numeric
      class IDs in the SAME entityClasses facet payload
    observed: |-
      SearchResultsTabs.tsx:24-64 lists tabs as
      `{name: 'All', value: 'all'}` / `{name: 'My Objects', value: 'my'}`
      / `{name: 'Datasets', value: totals[SET]?.id}` (number) etc.
      Results.tsx:84-87 hands the same value through to
      `facetOptionId` (with the dataEntityClassesDict fallback). Both
      string and numeric values flow through the SAME changeDataEntitySearchFacet
      action on the SAME entityClasses facet. The backend's FacetStateDto.entityClasses
      is documented (per F-017) as an array of class IDs (numeric); the
      string 'all' / 'my' values are UI-internal sentinels that should
      NEVER reach the backend payload.
    expected: |-
      Either (a) the dataEntitySearch.slice reducer normalises 'all' → null
      / removes the entityClasses constraint, and 'my' → flips FacetStateDto.myObjects
      boolean instead of pushing to entityClasses; OR (b) the UI uses
      DIFFERENT dispatch actions for the 'all' / 'my' tabs vs the class-
      id tabs (e.g. clearSearchClass / setMyObjects vs changeDataEntitySearchFacet).
    drift_class: search_class_tab_string_sentinel_my_all_vs_numeric_class_id_mixed_in_same_facet_dispatch_payload
    provenance: |-
      STATIC — SearchResultsTabs.tsx + Results.tsx walk.
    severity: HIGH
    ui_unverified: true
    ui_unverified_reason: |-
      Backend semantics depend on the changeDataEntitySearchFacet reducer
      (out of slice). If the reducer normalises 'all' / 'my' to proper
      forms BEFORE the PUT payload is built, the bug is UI-internal; if
      not, the string values reach the backend.
  - facet: |-
      My Objects tab dispatches entityClasses facet — NOT the
      FacetStateDto.myObjects boolean — possible silent double-toggle
    observed: |-
      The FacetStateDto (per F-017 backbone + openapi.yaml) has TWO
      separate fields: `entityClasses` (array of class IDs) and
      `myObjects` (boolean). The UI's My Objects tab dispatches on the
      entityClasses facet — there's NO separate dispatch on
      FacetStateDto.myObjects in the SearchResultsTabs path. The
      Search.tsx:32 selector `getSearchMyObjects` references the boolean
      but the tab click does not appear to write it.
    expected: |-
      Either the My Objects tab dispatches on a SEPARATE myObjects
      facet/setter that flips FacetStateDto.myObjects (the SearchServiceImpl
      consumer per F-017 backbone), OR the entityClasses passthrough
      string 'my' is normalised in the reducer.
    drift_class: my_objects_tab_dispatches_entityClasses_facet_not_myObjects_boolean_silent_double_toggle
    provenance: |-
      STATIC — SearchResultsTabs.tsx:24-32 + Results.tsx:83-100 + the
      Search.tsx getSearchMyObjects selector reference at line 32 (which
      proves the myObjects field IS in the slice state).
    severity: MEDIUM
    ui_unverified: true
    ui_unverified_reason: |-
      The reducer body is out of slice. The double-toggle risk is real
      based on the surface dispatch — verification needs the reducer.
  - facet: |-
      9-tab strip appears as navigation — actually a facet mutation;
      browser Back does NOT undo a tab click
    observed: |-
      SearchResultsTabs.tsx + Results.tsx — tab clicks fire dispatch
      actions but do NOT push to the URL (the router-side searchId stays
      the same; the new state is server-side row mutation). The user's
      mental model: tabs = navigation, Back = previous tab. The reality:
      tabs = facet mutation; Back navigates away from /search entirely
      without restoring the previous facet state. URL is no help in
      bookmarking a class-tab view (compounding the F-017
      `searchid_url_param_promises_saved_search_id_translates_silently_to_mutable_session_row_uuid_bookmark_share_tab_all_break`
      finding).
    expected: |-
      Either (a) tab clicks push to URL (`/search/{id}/class/datasets`)
      so Back works as expected; OR (b) the UI surface is renamed to
      "Class Filter" so the mental model doesn't conflate with navigation.
    drift_class: 9_tabs_appears_as_navigation_actually_facet_mutation_tab_back_does_not_undo
    provenance: |-
      STATIC — SearchResultsTabs.tsx walk + cross-link to F-017
      batch-ZI URL semantics finding.
    severity: MEDIUM
    ui_unverified: false
  - facet: |-
      searchClass type — number 0 (entity-class id 0?) is falsy and may
      collide with string 'all' tab semantics
    observed: |-
      Results.tsx:104-114 — the grid type lookup branches on
      `typeof searchClass === 'string'` vs `=== 'number'`. The
      `searchClass > 0` check at Filters.tsx:53 implies class id 0 is
      reserved or absent. If a backend response ever yields a numeric
      class id of 0, the truthy/falsy checks throughout (e.g.
      `tabValue ? ... : null` in Results.tsx:84) would treat it as
      no-class-selected — collision with the 'all' tab.
    expected: |-
      Either (a) the backend guarantees class ids start at 1 (verify
      via a probe against the DataEntityClassNameEnum); OR (b) the UI
      checks `tabValue !== undefined` instead of truthy.
    drift_class: tab_value_numeric_zero_falsy_compared_with_truthy_string_searchClass_zero_vs_all_collision
    provenance: |-
      STATIC — SearchResultsTabs.tsx + Filters.tsx:53 + Results.tsx:84.
    severity: LOW
    ui_unverified: true
    ui_unverified_reason: |-
      Backend class id allocation needs verification against
      DataEntityClassNameEnum substrate.
  - facet: |-
      SearchResultsTabs.tsx setTabs useEffect — no memoization, re-mints
      tabs array on every totals change (perf-class hint)
    observed: |-
      SearchResultsTabs.tsx:24-64 — useEffect with dep `[totals]`
      reconstructs the 9-element array on every render where totals
      changes reference (which is on every search-facet sync per F-017
      backbone). React re-renders the AppTabs child with a fresh `items`
      prop on every facet sync. For a 9-element list this is negligible;
      shapes the perf-class smell that fires more aggressively on
      heavier-cardinality lists elsewhere.
    expected: |-
      useMemo wrapping the tabs array based on totals + i18n function.
    drift_class: searchresultstabs_setTabs_use_effect_no_memoization_re-mints_tabs_array_on_every_totals_change
    provenance: |-
      STATIC — SearchResultsTabs.tsx:24-64.
    severity: LOW
    ui_unverified: false
  - facet: |-
      Relationships tab present only when backend returns the
      RELATIONSHIP class count — silently missing otherwise
    observed: |-
      SearchResultsTabs.tsx:59-62 — the Relationships tab uses
      `totals[DataEntityClassNameEnum.RELATIONSHIP]?.id` as its value.
      If the response totals doesn't include RELATIONSHIP (e.g. an older
      backend, or a deployment with feature-disabled Relationships per
      P-02 pillar disable-mode), the tab value is `undefined` and the
      tab renders with hint=0 + value=undefined. Clicking it dispatches
      with facetOptionId=undefined.
    expected: |-
      Either (a) explicitly check totals[RELATIONSHIP]?.id and omit the
      tab when undefined; OR (b) verify the backend always emits the
      RELATIONSHIP key with id=0 + count=0.
    drift_class: relationships_tab_present_only_when_backend_returns_RELATIONSHIP_count_silently_missing_otherwise
    provenance: |-
      STATIC — SearchResultsTabs.tsx:59-62.
    severity: LOW
    ui_unverified: true
  - facet: |-
      9-tab horizontal strip — no overflow indicator on narrow viewports
    observed: |-
      No explicit overflow / scroll-indicator on the AppTabs container
      visible from SearchResultsTabs.tsx; on viewports under ~900px the
      9 tabs (All / My Objects / Datasets / Transformers / Data Consumers
      / Data Inputs / Quality Tests / Groups / Relationships) likely
      either wrap to two rows or get cut off by overflow:hidden.
    expected: |-
      Either (a) horizontal-scroll affordance via the AppTabs primitive;
      OR (b) a "More" overflow menu at >N tabs.
    drift_class: tab_strip_horizontal_overflow_no_scroll_indicator_9_tabs_may_exceed_viewport_on_narrow_screens
    provenance: |-
      STATIC — SearchResultsTabs.tsx — flagged at ui_unverified pending
      AppTabs primitive walk.
    severity: LOW
    ui_unverified: true
    ui_unverified_reason: |-
      AppTabs is a shared primitive; its overflow behaviour is out of
      slice E.
  - facet: |-
      Tab names hardcoded English — i18n gap for 6 of 9 tabs
    observed: |-
      SearchResultsTabs.tsx:24-64 — `name: 'All'`, `'My Objects'`,
      `'Datasets'`, `'Transformers'`, `'Data Consumers'`, `'Data Inputs'`,
      `'Quality Tests'`, `'Groups'`, `'Relationships'` — NONE wrapped
      in `t()`. The `useTranslation` hook is NOT even imported in this
      component. By contrast, TableHeader.tsx wraps every column in
      `t()`. Six of the nine tabs use multi-word English-only labels
      that NEVER localise.
    expected: |-
      Import useTranslation + wrap every name in t(...).
    drift_class: t_function_not_used_on_tab_names_Datasets_Transformers_etc_i18n_gap_six_tabs
    provenance: |-
      STATIC — SearchResultsTabs.tsx:1-95 line-by-line (no useTranslation
      import).
    severity: LOW
    ui_unverified: false
