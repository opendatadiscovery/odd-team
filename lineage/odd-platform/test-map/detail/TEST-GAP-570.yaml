proposed_action: |-
  Testcontainers test. (a) Seed R1; soft-delete it. (b) Bypass service and call repository.update(R1 with new name). Mono completes empty — no error, no rows updated. (c) Confirm R1's deleted_at is still set, name still original. (d) Service-mediated call (RoleServiceImpl.update) → NotFoundException. Pin both contracts. (e) Update mutate-attempt of created_at and id → both ignored (getNonUpdatableFields excludes them).
