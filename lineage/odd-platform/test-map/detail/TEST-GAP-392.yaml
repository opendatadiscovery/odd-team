gap_id: TEST-GAP-392
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java service service:IngestionService
surfaced_by:
- IngestionService.md:tests_coverage_semantic.uncovered_behaviours.[3]
- IngestionService.md:bugs_limitations_corner_cases.[2]
- IngestionService.md:security.known_security_gaps (item 1, 3)
behaviour: 'Cross-tenant ingestion under filter-OFF — a payload with `data_source_oddrn`
  belonging to a different tenant''s datasource — the service blindly writes into
  that datasource (no principal check; service.IngestionService:8 takes payload only,
  no auth context). Under default-deployment `auth.ingestion.filter.enabled=false`,
  ANY caller able to reach the HTTP port can write or destroy data via this service.
  Same class as LSN-001 (silent destructive default) but on the ingestion plane. No
  test asserts the cross-tenant write actually goes through; a fix that adds principal-based
  scoping would not break any test.'
test_class: missing-security
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ingestion/IngestionCrossTenantTest.java
  name: ingest_filterOff_anyCallerCanWriteToAnyDatasource_pinsDefaultPosture
evidence:
- 'IngestionService.md says: ''cross-tenant exposure is undocumented in the test suite''
  + ''The bundled deployment ships with the entire write surface reachable by any
  caller able to hit the HTTP port'''
- 'IngestionServiceImpl.java:68 (datasource lookup by payload ODDRN, no principal check)
  + IngestionService.java:8 (interface takes payload only)'
- 'application.yml:48 (auth.ingestion.filter.enabled: false default)'
cross_references:
- LSN-001 (silent operator data destruction on default deployment)
- TEST-GAP-388 (silent metadata-delete-on-absence — the destructive operation enabled
  by this gap)
- TEST-GAP-389 (silent lineage-replace — same)
- IngestionDataEntitiesFilter sibling sidecar (the upstream filter, default-OFF)
proposed_action: Add `IngestionCrossTenantTest` with two seeded datasources (DSx, DSy);
  POST to `/ingestion/entities` with no auth, payload naming DSy; assert (a) write
  succeeds, (b) the entity is now visible to anyone authenticated to view DSy. Pin
  the current cross-tenant posture so a fix that adds principal scoping is detected.
