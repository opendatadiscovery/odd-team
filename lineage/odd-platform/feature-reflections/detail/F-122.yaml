# Operator Management-Endpoint Exposure Surface — product-owner reflection

## product_owner_narrative

This "feature" is not a screen a user opens; it is an **operator-infrastructure
surface** that exists by inheritance — ODD Platform mounts Spring Boot Actuator on
the same HTTP port as the application, exposes four endpoints by default
(`health`, `prometheus`, `env`, `info`), and places the entire `/actuator/**` tree
ahead of the authentication chain in every auth mode. The capability a security
reviewer or operator cares about is the inverse of a normal feature: not "what can
the user do" but "what does an unauthenticated network caller learn about this
deployment by hitting `/actuator/env`." The pillar anchor is P-09 Security & Access
Control (per `system-mission.md` P-09, "three independently-configured
authentication surfaces … gating mutations") — but this surface sits *outside* all
three: it is reachable BEFORE any of them runs (per the WHITELIST_PATHS membership
at SecurityConstants.java:95-96, confirmed by source read). The cross-pillar note
in the feature-flow detail is precise: actuator is "operator-infrastructure rather
than user-facing API; the P-11 API Reference page does not enumerate them."

There is no UI hop. The terminal side effect is an `HTTP 200 JSON` response
(per feature-flow `terminal_side_effect`), consumed by ops tooling (Prometheus
scrapers, debugging operators) or by an attacker who has reached the port. The
inputs are not user inputs — they are the *shipped configuration defaults*: a
well-known database password (`odd-platform-password` at application.yml:7), a
JDBC URL that names the PG host/port/database (application.yml:5), and every
`@Value`/`@ConfigurationProperties`-bound credential across the auth providers
(S3 access/secret keys per `MinioConfig` sidecar:14-17; LDAP password per
`ODDLDAPProperties` sidecar:14; OAuth2 client secrets per `ODDOAuth2Properties`
sidecar:34; R2DBC passwords per `R2DBCConfiguration` sidecar:35,58). The
"working parts" are three defence layers that each have a gap: (1) value masking
(`show-values`, which the framework defaults to `NEVER` and which masks only
key-names matching `password|secret|key|token`); (2) the whitelist (which makes
the endpoint reachable pre-auth); and (3) the absence of a separate management
port (so operators cannot trivially firewall actuator off the public surface).

A senior product owner reasons about this surface from the *operator's deployment
moment*: an operator clones the compose file, brings the stack up, and — if they
skip the hardening steps — ships a deployment where an attacker scanning the
network can (a) confirm which auth providers are wired (Google + Azure + LDAP
keys appear as distinct prefixes — schema fingerprinting per the
`field_name_leak_credential_schema_enumeration` drift class), (b) read the
unmasked JDBC URL to locate the database (per `jdbc_url_unmasked_pg_host_leak`),
and (c) — if the operator also skipped rotating the password — combine the two
into a one-line-away PG compromise (per `shipped_default_database_password_well_known_credential`).
This is the LSN-001/LSN-002 class: a convenient dev/demo default that is unsafe
in production, with safety resting entirely on operator discipline that two prior
retrospectives proved insufficient (per the concept-invariant
`plaintext-db-credentials-default-with-actuator-env-exposed-default.yaml`).

The integration story is cross-pillar by construction. Every Properties class that
binds a credential — across P-08 Management, P-09 Security, P-10 Integrations
(attachment storage), and P-07 Active Platform Features (notification webhook
URLs) — surfaces through this single endpoint (per the feature-flow
`cross_pillar_relationships` P-08 entry, and per the concept-invariant's
5-sidecar triangulation). F-119 (the AppInfo fingerprint surface, SHB-173) is the
complementary narrower surface; F-122 is the broader schema fingerprint. A
defence-in-depth gap in any one Properties class (a missing `@ToString.Exclude`)
compounds here: a future `log.info("props={}", properties)` line would emit the
LDAP password or OAuth2 client-secret in cleartext (per `ODDLDAPProperties`
sidecar bugs[0] and `ODDOAuth2Properties` sidecar bugs[3]).

The product owner's demo edge cases are the auth-mode permutations: under DISABLED,
`/actuator/env` is anonymously reachable; under LOGIN_FORM, it requires auth but
every form-authenticated user is ADMIN (so any user reads it, plus the plaintext
`auth.login-form-credentials`); under OAUTH2/LDAP, it is unauthenticated via the
`/actuator/**` whitelist even though the UI auth chain runs (per the concept-invariant
"COMPOUND WITH AUTH MODE" section). The honest summary: the masking is real but is
a framework default, not a platform guarantee; the whitelist is a deliberate choice
that shifts the trust boundary to the operator's network discipline; and — the
finding this reflection adds — the feature-flow's own facet text claims a
platform-authored `show-values=WHEN_AUTHORIZED` that does not exist in the YAML.

