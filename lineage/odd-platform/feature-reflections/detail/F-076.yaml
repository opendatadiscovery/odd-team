- id: H-011
  hypothesis: |-
    When an operator deletes the same parent twice (or deletes one that was
    already deleted), the second delete is a harmless no-op — not an error and
    not a double-effect.
  derivation: |-
    Idempotency seed — a double-click or a stale card should not corrupt state or
    produce a confusing error.
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |-
      At the data layer it is idempotent: the soft-delete UPDATE carries
      WHERE id = ? AND deleted_at IS NULL, so a second delete matches 0 rows and
      mutates nothing (deleteDataSource.md:stress_findings.resource_boundaries;
      OwnerServiceImpl.md:bugs[5]). BUT the response/UX is asymmetric and
      under-specified: Owner delete has NO switchIfEmpty(NotFoundException), so a
      delete of a non-existent OR already-deleted owner returns a silent HTTP 204
      — the caller cannot distinguish "deleted it", "already gone", and "never
      existed" (REFACTOR-429). The non-existent-id response shape for DataSource
      is statically undetermined (204 vs 404 vs 500 — P-049).
    evidence:
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: bugs_limitations_corner_cases
        cite: "OwnerServiceImpl.java:88-100 (no switchIfEmpty) vs :69-85 (update has it)"
        note: "silent-204 idempotency; delete vs update asymmetry"
      - sidecar: odd-platform__java__DataSourceController__controller-method__deleteDataSource.md
        section: bugs_limitations_corner_cases
        cite: "DataSourceServiceImpl.java:87-95 + ReactiveAbstractSoftDeleteCRUDRepository.java:50-58"
        note: "non-existent-id response shape statically undetermined (P-049)"
    operator_visible_failure: |-
      The data layer is safe, but a script or integration cannot tell from the
      204 whether its delete had any effect — a missing-id typo and a successful
      delete look identical. Two operators on stale cards both get success-shaped
      responses for the same row. The gap is contract clarity, not corruption.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

