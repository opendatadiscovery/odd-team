pillar_anchored_feature_name: Integration Wizard Argument-Form Authoring
feature_name: |-
  Integration Wizard argument-form UX — IntegrationCodeSnippetWithForm
  compiles a Handlebars template (server-supplied via the integration
  manifest YAML loaded by F-033's classpath registry) and renders a
  client-only argument-collection form. Each declared argument becomes
  a Controller-based field whose type is dispatched at render time
  by the `arg.type` enum (STRING / number fallback / BOOLEAN /
  staticValue). Submitting the form transitions the panel from
  "showForm" to "Reconfigure" view, where the compiled template is
  rendered as Markdown (typically a YAML code-fence). Distinct
  feature from F-033 (the registry / classpath-load chain) and
  F-033's `installed` dead-field finding: F-162 is the AUTHORING
  surface — the operator typing values into the wizard, then
  copy-pasting the resulting Markdown into their collector config.
