notes: |-
  Cross-batch architectural-hygiene invariant surfaced ONLY by triangulating
  the 4 batch-H repository sidecars together. None of the individual sidecars
  name the platform-wide inconsistency — each sidecar describes its own mechanism
  as a deliberate ADR, but the catalog reveals the platform ships 3 DIFFERENT
  soft-delete mechanisms + 1 hard-delete pattern across what reads as a uniform
  Reactive*Repository naming convention.

  **STRENGTHENED batch 2026-05-19L** — the HARD-DELETE relationship-edge
  cluster is now multi-site primary-source confirmed across 3 tables
  (data_entity_to_term + group_entity_relations + ownership; plus the
  term_ownership migration). The dedicated
  hard-delete-on-relationship-edges-confirmed-cross-batch invariant
  captures the relationship-edge cluster pattern; this invariant
  remains the platform-wide-mechanism map.

  **STRENGTHENED batch 2026-05-19N** — FOUR ADDITIONAL deleted_at sites
  now primary-source pinned (Term, Tag, Role, UserOwnerMapping). The
  platform's persistence-layer deletion shape is now 4-mechanism ×
  8-repository-site primary-source confirmed:
    Mechanism 1 (deleted_at timestamp): 6 sites — Policy, Role, Tag,
      Term, UserOwnerMapping, and historically Owner
    Mechanism 2 (is_deleted boolean): 1 site — Lineage
    Mechanism 3 (STATUS state-machine): 1 site — DataEntity (subclass
      override)
    Mechanism 4 (HARD-DELETE): 3 sites — Ownership, data_entity_to_term,
      group_entity_relations (+ term_ownership migration drop site)

  **The FIFTH-MECHANISM ASYMMETRY**: term_to_term (V0_0_91) retains
  deleted_at despite V0_0_76's hard-delete commitment for the sibling
  link tables. Captured at the dedicated
  `term-to-term-deleted-at-schema-drift-v0_0_76-vs-v0_0_91` invariant
  (batch N).

  **STRENGTHENED batch 2026-05-20R** — TWO NEW DELETION SHAPES:

  **Mechanism 6 (NO-DELETION-AT-ALL with M:N-edge lifecycle)**: 1 site
  — dataset_field. The lifecycle is driven by hash-diff partitioning
  at the service tier; old rows persist forever in the table referenced
  by historical dataset_versions. Captured at the dedicated
  `dataset-field-versioning-by-reference-no-soft-delete-orphan-accumulation`
  invariant.

  **V0_0_64 CONVERGENCE OUTLIERS** (2 sites — INCOMPLETE-convergence):
  collector.name + metadata_field.{name+type|name} are FULL unique
  constraints, not partial-on-live-rows. The bug class is captured
  at the dedicated
  `metadata-field-soft-delete-partial-unique-index-mismatch`
  invariant.

  **The platform's persistence-layer deletion shape is now
  6-mechanism × 10+-repository-site primary-source confirmed**:
    Mechanism 1 (deleted_at timestamp + partial unique index): 6+ sites
      — Policy, Role, Tag, Term, UserOwnerMapping, Owner, data_source,
      namespace, ...
    Mechanism 2 (is_deleted boolean): 1 site — Lineage
    Mechanism 3 (STATUS state-machine): 1 site — DataEntity (subclass
      override)
    Mechanism 4 (HARD-DELETE on relationship-edge tables): 3-4 sites —
      Ownership, data_entity_to_term, group_entity_relations,
      term_ownership
    Mechanism 5 (deleted_at WITHOUT application-tier filter — ASYMMETRIC
      EXCEPTION): 1 site — term_to_term
    **Mechanism 6 (NO-DELETION-AT-ALL with M:N-edge lifecycle — NEW
      batch R): 1 site — dataset_field**

  **V0_0_64 CONVERGENCE OUTLIERS** (separate sub-finding): 2 sites
  where the partial-unique-index pattern was not aligned with the
  deleted_at addition — collector.name (FULL unique) and
  metadata_field.{name,type} partial indexes that filter only by
  origin, not by deleted_at.

