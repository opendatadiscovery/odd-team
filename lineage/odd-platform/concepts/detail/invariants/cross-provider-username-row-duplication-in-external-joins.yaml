name: |-
  Cross-provider username row-duplication in external JOINs (Alert / Activity / Owner / OwnerAssociationRequest)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
- P-07
- P-08
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-19N — surfaced by
  primary-source examination of ReactiveUserOwnerMappingRepositoryImpl
  combined with cross-file grep across FOUR sibling repositories that
  consume USER_OWNER_MAPPING for display-name resolution.**

  ReactiveUserOwnerMappingRepositoryImpl is the AUTHORITATIVE site for the
  (oidc_username, provider) compound key — `getConditions` at lines 116-127
  always pairs `OIDC_USERNAME.eq(oidcUsername)` with a provider
  discriminator (`PROVIDER.eq(provider)` OR `PROVIDER.isNull()`). The
  authoritative compound-key shape is the load-bearing contract.

  **HOWEVER**: FOUR sibling repositories LEFT JOIN
  `USER_OWNER_MAPPING` for display-name resolution WITHOUT carrying
  the provider half of the compound key:

    Site 1 — ReactiveAlertRepositoryImpl.java:83-86 — joins on
      `ALERT.STATUS_UPDATED_BY = USER_OWNER_MAPPING.OIDC_USERNAME AND
       USER_OWNER_MAPPING.DELETED_AT.isNull()`. NO provider equality
       predicate.

    Site 2 — ReactiveActivityRepositoryImpl.java:156-158 — joins on
      `USER_OWNER_MAPPING.OIDC_USERNAME = ACTIVITY.CREATED_BY AND
       USER_OWNER_MAPPING.DELETED_AT.isNull()`. Same shape.

    Site 3 — ReactiveOwnerAssociationRequestRepositoryImpl.java:80-84 —
      same LEFT JOIN shape, OIDC_USERNAME-only.

    Site 4 — ReactiveOwnerRepositoryImpl.java:77-78 — same LEFT JOIN
      shape, OIDC_USERNAME-only.

  **Consequence — row duplication**: if two ACTIVE user_owner_mapping rows
  exist for the SAME `oidc_username` under DIFFERENT providers (e.g.
  `(alice, null, owner=X)` from LOGIN_FORM and `(alice, GITHUB, owner=Y)`
  from OAUTH2), the LEFT JOIN matches BOTH rows for any alert / activity /
  ownership-request / owner row whose author/updater field equals
  'alice'. The result set produces a Cartesian product — the SAME alert /
  activity event is duplicated once per matching mapping, with the owner
  display column populated non-deterministically (depending on Postgres
  physical row order; depending on the planner's hash-join build side;
  depending on tuple visibility under MVCC).

  **The schema permits the two-row coexistence**: V0_0_89's partial
  unique index `user_owner_mapping_oidc_username_provider_deleted_key`
  is on `(oidc_username, provider) WHERE deleted_at IS NULL` — meaning
  (alice, null) and (alice, GITHUB) are DISTINCT tuples both permitted
  by the index. The authoritative compound key was DESIGNED to support
  this case (per the maintainer's batch-K OAuth2-only-non-null-provider
  ADR); the display-side JOINs in the four sibling repositories were
  apparently authored WITHOUT awareness of the compound-key intent.

  **Triggering scenarios**:
    (a) Operator runs LOGIN_FORM + OAUTH2 concurrently (a valid
        composition per the live authentication doc; both modes share
        the same SECURITY_RULES skeleton and can be combined per
        SecurityConstants.java:33-50). A user 'alice' authenticates via
        LOGIN_FORM AND via OAUTH2 at different times, with both Owner
        bindings active. Alert / activity entries authored by either
        identity duplicate-render under both Owner display names.
    (b) Operator migrates LOGIN_FORM → OAUTH2 retaining usernames; the
        old (alice, null) mapping is left in place per the soft-delete-
        only design; the new (alice, github) mapping is added.
        Subsequent alert reads duplicate every alice-authored alert
        across the two mappings until an operator manually clears the
        old row.
    (c) An operator MANUALLY inserts a user_owner_mapping row via
        `POST /api/owners/associations/manual` with an empty-string
        provider value — that row coexists with a true-null-provider
        row in the same partial unique index (Postgres treats empty
        string and null as distinct in unique constraints, per
        bugs_limitations_corner_cases.[3] in the batch-N sidecar). Two
        rows; both match the LEFT JOIN's OIDC_USERNAME predicate.

  **What makes this MEDIUM-going-on-HIGH rather than just MEDIUM**:
  ReactiveAlertRepositoryImpl is on the ALERT-LISTING + PER-ENTITY-
  ALERT-LIST hot paths (cross-references batch-L per-entity-alert-listing
  + batch-D/F getAllAlerts read-collaborative posture). A row-duplication
  bug at this layer means:
    (i) operators auditing 'who resolved which alert' see duplicate
        entries with inconsistent author attribution — incident-review
        forensics fails for the cross-provider username case;
    (ii) the per-entity Alert tab in the UI shows duplicate Slack-style
         notifications for each alert lifecycle event when the resolver
         user is cross-provider-named;
    (iii) the count surfaces (`/api/alerts/totals/*`) over-count when
          duplicates inflate the rowset.
  ReactiveActivityRepositoryImpl is on the GLOBAL ACTIVITY FEED — the
  central audit-trail surface (per system-mission.md line 207). A
  duplicated activity-feed render makes the GLOBAL audit feed
  forensically unreliable for cross-provider-named users.

  **The bug is DORMANT in the common case** (a deployment running a
  single auth mode with no migration history has at most one active row
  per oidc_username, so no JOIN duplication fires). It SURFACES on
  composed deployments and on auth-mode migrations.
