name: |-
  Webhook channel ships NO HMAC, NO signature, NO shared secret — operator receiver cannot verify ODD as payload origin (batch Y)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
  - P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20Y — surfaced by primary-source
  examination of WebhookNotificationSender.java + the live notifications doc.
  The generic-webhook channel POSTs the full AlertNotificationMessage JSON
  to the operator-configured URL with NO HMAC signature, NO shared-secret
  header, NO Authorization header, NO X-ODD-Signature, NO Content-Digest.
  The operator's webhook receiver has NO platform-supplied mechanism to
  verify that the payload originated from ODD Platform versus an attacker
  who learned the webhook URL.

  THE PRIMARY-SOURCE EVIDENCE — WebhookNotificationSender batch Y:

    WebhookNotificationSender.java:18-23 (the entire send chain):
      final HttpRequest request = HttpRequest.newBuilder()
          .uri(webhookUrl)
          .POST(BodyPublishers.ofString(serializeJson(message)))
          .build();
      sendAndValidate(request);
    The HttpRequest builder is invoked with exactly two calls beyond the
    constructor: .uri(...) and .POST(...). NO .header(...) call appears
    in the entire class body (verified by reading WebhookNotificationSender.java:1-30
    end-to-end). The only headers on the outbound request are the JDK
    HttpClient defaults (User-Agent: Java-http-client/<version>, Content-Length).

  CONTRAST WITH ESTABLISHED WEBHOOK PROTOCOLS:

    Industry-standard webhook senders ship signed payloads:
      - Slack incoming webhooks: ship X-Slack-Signature (HMAC-SHA256 of
        the body using the workspace's signing secret)
      - GitHub webhooks: ship X-Hub-Signature-256 (HMAC-SHA256 of the body
        using the configured webhook secret)
      - Stripe webhooks: ship Stripe-Signature (HMAC-SHA256 of timestamp
        + body using the endpoint signing secret)
      - AlertManager webhooks (the INBOUND counterpart for ODD): support
        webhook_config with HTTP Basic auth, bearer token, or custom
        Authorization header
    The ODD platform's outbound webhook ships NONE of these. The receiver
    has no platform-side mechanism to distinguish "legitimate ODD alert"
    from "attacker who learned the URL".

  THE ATTACK SURFACE:

    The URL itself is a bearer credential (anyone who can POST to it can
    deliver a payload). The URL leaks in multiple paths:
      - /actuator/env if exposed (Spring Boot's default mask list does
        NOT include the substring "url"; the webhook URL appears in the
        env response verbatim — verified at WebhookNotificationSender batch
        Y security.known_security_gaps.[4])
      - deployment artefacts (Helm values.yaml, Kubernetes ConfigMaps,
        Docker container env files) — all leaked the moment the cluster
        is mis-configured
      - container images that bake in the env (a non-trivial pattern for
        platform-team-managed ODD deployments)
    Once leaked, the URL is a key to:
      - replay attack: an attacker POSTs forged alerts to the operator's
        receiver, claiming whatever AlertNotificationMessage payload they
        choose
      - denial-of-service: an attacker floods the receiver with junk
        alerts (no rate limit at the operator side either, typically)
      - phishing surface: an attacker POSTs alerts with attacker-controlled
        dataEntity.name / dataSourceName / namespaceName containing
        social-engineering content; recipients of the alert see what
        appears to be a real ODD-platform alert

  THE OPERATOR REMEDIATION BURDEN — what the platform DOES NOT provide:

    Pending a platform-side fix, operators must implement the webhook
    receiver's authentication out-of-band:
      - mTLS at the HTTP gateway: requires CA management, certificate
        rotation, client cert handling
      - IP allowlisting: requires static-IP egress from ODD (NAT gateway
        or similar) + receiver-side allowlist; couples deployment topology
        to security
      - VPN / private network: requires ODD and receiver in the same
        network; precludes SaaS-deployment models
      - HTTP gateway with HMAC: requires the operator to deploy a
        sidecar/relay that signs requests AND configure ODD's webhook
        URL to point at the relay rather than the real receiver
    Each option DOUBLES the failure surface. The live doc does not
    surface any of these options (verified WebFetch 2026-05-20 status
    200, batch Y docs_link_semantic).

  THE LIVE DOC CONTRAST — silence vs the absence:

    Live `/features/active-platform-features/notifications` describes the
    generic-webhook channel as "POSTs the full alert payload (JSON) to an
    operator-supplied URL" — the doc framing creates the operator
    expectation of a STANDARD webhook contract, which on every major
    platform INCLUDES signing. The platform's silent omission is therefore
    a CONTRACT DRIFT against operator expectations, not merely a
    missing-feature gap.

    Live `/configuration-and-deployment/odd-platform` is similarly silent
    on signing (verified batch Y WebhookNotificationSender
    docs_link_semantic.inferred_docs[1].fetched_excerpts: 'Page does NOT
    specify authentication or signing mechanism for outbound webhooks').

  CROSS-LINK TO REFACTOR-498 (batch X):

    The existing "no URI scheme allowlist on notifications.receivers.*.url"
    finding (REFACTOR-498) covers the boot-time configuration validation
    gap (any URL accepted). THIS invariant covers the RUNTIME PAYLOAD
    AUTHENTICATION gap (no signature on the wire). They are siblings:
    REFACTOR-498 is about the OPERATOR's ability to mis-set the URL;
    this invariant is about the RECEIVER's inability to verify the
    payload AFTER the URL is correctly set.

  THE EXTENSION POINT — would a single fix close this?

    Yes — a single change at AbstractNotificationSender.send (or at
    WebhookNotificationSender.send) that:
      (a) reads a new config key notifications.receivers.webhook.signing-secret
      (b) computes HMAC-SHA256 of the body using the secret
      (c) sets X-ODD-Signature: sha256=<hex> header on the outbound
          HttpRequest
    The fix is small (~15 lines). The operator-visible change is a new
    config key. The doc-side cost is a documentation update naming the
    signing convention and giving a receiver-side verification example.

  SEVERITY HIGH — the platform's outbound-webhook surface has the same
  trust-model gap that every other webhook protocol explicitly closes.
