  Add `WebhookNotificationSenderNoContentTypeRegressionPinTest`. Unit test stubbing `HttpClient.send(...)` to capture the outbound `HttpRequest`:

  1. `send_outboundRequestHasNoContentTypeHeader_pinsReceiverRejection` —
     - Stub `HttpClient.send(...)` capturing the request.
     - Invoke `webhookSender.send(message)`.
     - Assert the captured `HttpRequest.headers().firstValue("Content-Type")` is empty (or returns Optional.empty()).
