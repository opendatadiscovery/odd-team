feature_id: F-074
pillar_id: P-08
pillar_anchored_id: P-08:F-014
pillar_anchored_feature_name: Management-Tab Read-Collaborative Posture
feature_name: |-
  Management directory list endpoints are universally ungated reads — every
  Management tab (Owners / Datasources / Collectors / Titles / Namespaces /
  Owner-Association activity / IdP-providers list) returns its full
  directory to any authenticated user, and to any anonymous caller under
  `auth.type=DISABLED`. The implicit ADR-CANDIDATE-003 "read-collaborative
  posture" is operator-invisible: the live `/permissions` page names no
  `*_READ` permissions and is silent on the cross-Management-tab read
  posture; least-privilege expectations (withholding `*_CREATE` should
  restrict reads) silently fail.
seeded_from: SHB-085
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  controller-class chain (read endpoints on seven Management controllers):
   - GET /api/owners (OwnerController#list)
   - GET /api/datasources (DataSourceController#list)
   - GET /api/collectors (CollectorController#list — masked-token last-6-chars in response)
   - GET /api/titles (TitleController#list)
   - GET /api/namespaces (NamespaceController#list)
   - GET /api/owner_association_request/activity (OwnerAssociationRequestController#activityLog)
   - GET /api/owners/providers (OwnerAssociationRequestController#providersList)
  All seven share the identical security posture: NO entry in
  SecurityConstants.SECURITY_RULES → falls through to the catch-all
  `pathMatchers("/**").authenticated()` (AuthorizationCustomizer:29-30);
  under DISABLED the SecurityWebFilterChain bypasses (DisabledAuthSecurityConfiguration:13-18 permitAll).
