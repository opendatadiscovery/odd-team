proposed_action: |-
  Add `DataQualityRunsTestResultsCountSemanticTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `testResults_count_equalsNumberOfTestsByLatestRunStatus_notNumberOfHistoricalRuns_pinsLSN019Drift` — seed 1 DQ-test with 100 historical runs (99 SUCCESS, 1 latest FAILED); GET dashboard; assert testResults[CATEGORY].results[FAILED].count = 1 (NOT 1; NOT 100). PIN the per-test-not-per-run semantics.
  2. `testResults_count_flapMostRecentlySuccess_singleSuccess_pinsLatestRunOverride` — seed 1 test with 50 SUCCESS + 50 FAILED runs, MOST RECENT = SUCCESS; assert count[SUCCESS]=1, count[FAILED]=0 (the historical 50 FAILED runs are invisible). PIN the most-recent-overrides semantics.
  3. `testResults_count_zeroRunsButTestExists_pinsTestVsRunDistinction` — seed 1 DQ-test entity with category set but NO task_run rows; assert count[*]=0 (the test exists but has no latest_run row to contribute). PIN the latest-run-required clause.
  4. `testResults_count_acrossMultipleCategories_pinsCategoryPartition` — seed 5 tests across 3 categories with varying latest-run statuses; GET; assert per-category counts match a manually-computed aggregation; PIN the per-category partition correctness.

  Pair with DOC-NNN: correct the live dashboard doc to match — either rename to "Tests by Latest Status" OR change the implementation to count historical runs (Option A is far cheaper). Pair with REFACTOR-NNN: rename the response field if the doc owner chooses Option A.

  When Option A lands: test #1 inverts but #2-4 do not (the latest-run semantics is preserved; only the LABEL changes).
