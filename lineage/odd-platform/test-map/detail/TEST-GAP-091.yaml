behaviour: Async-send failure invisibility — controller returns `202 Accepted` with
  `state=PENDING_SEND`; downstream Slack failures (auth revoked, channel archived,
  text too long, rate-limited beyond retry budget) flip the row to `ERROR_SENDING`
  but no notification or push to the original caller.
