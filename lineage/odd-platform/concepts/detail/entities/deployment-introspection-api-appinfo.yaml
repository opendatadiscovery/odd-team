name: Deployment Introspection (/api/appInfo)
canonical_in_docs: false
canonical_candidate: true
description: |-
  GET /api/appInfo is a pre-auth (under DISABLED) / post-auth (under
  LOGIN_FORM/OAUTH2/LDAP) endpoint that returns `{projectVersion, authType}` —
  used by the frontend SPA to discover which auth mode the backend is running
  so it can render the appropriate login flow. The endpoint is the REPORTER
  of the active auth mode (it READS `auth.type` and echoes the string in the
  response body). Distinct from the consumer-of-mode pattern used by the four
  *SecurityConfiguration classes. Carries deployment metadata that is
  operator-sensitive under `auth.type=DISABLED` (the application.yml default) —
  passive fingerprinting surface for network attackers.

  **STRENGTHENED batch 2026-05-20T (AppInfoController class sidecar)** — adds
  controller-class layer evidence anchoring two cross-batch invariants:
    (a) the expose-mode-hide-provider SPA runtime-config contract (NEW invariant
        in batch T) — AppInfo and Identity together encode the deliberate
        'expose auth mode, hide provider' design across two endpoints;
    (b) REFACTOR-185 reaches 19-sidecar (DISABLED-mode anonymous-mutation surface)
        with this controller-class layer view of the same surface — AppInfo
        under DISABLED echoes BOTH `authType` and `projectVersion` to anonymous
        network callers; the controller-class sidecar makes the 19th supporting
        evidence point at the controller-class axis layer.

  vocabulary_status: codebase-anchored, doc-side-absent (live `enable-security`
  does NOT name `/api/appInfo` or document the auth-mode echo).
vocabulary_status: codebase-anchored, doc-side-absent
axes_present:
