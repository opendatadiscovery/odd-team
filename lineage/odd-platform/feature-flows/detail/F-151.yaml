feature_id: F-151
pillar_id: P-06
pillar_anchored_id: P-06:F-004
pillar_anchored_feature_name: Term Detail Page Composition (Overview / Linked Entities / Linked Columns / Linked Terms / Query Examples)
feature_name: |-
  Term Detail Page — five-tab composition with affordance-gated tab
  visibility, lazy-loaded sub-routes, and double-fetch shape on the
  Overview tab
seeded_from: ui-review-2026-05-26
seeded_at: 2026-05-26
discovered_from_entry_point: ui_route:/terms/:termId/*
primary_subject:
