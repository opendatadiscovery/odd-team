proposed_canonical: No-audit-log on RBAC mutations
rationale: '3-sidecar primary-source triangulated cross-cutting hygiene gap from batch
  2026-05-12E. None of `RoleServiceImpl.create/.update/.delete`, `PolicyServiceImpl.create/.update/.delete`,
  `OwnerServiceImpl.create` emit @Slf4j log lines, publish events, or insert into
  any audit table. `@ActivityLog` is absent from OwnerServiceImpl (grep-verified —
  applied only to Alert/AlertHaltConfig/DataEntity/DataEntityGroup/DataEntityInternalState
  services). The activity feed (`/api/activity`) does NOT cover Role/Policy/Permission/Owner-directory
  mutations. A hijacked admin (or any S2S API-key holder which gets ADMIN by default
  — REFACTOR-108) can rewrite the authorization model invisibly. HIGH-priority cleanup:
  add @Slf4j audit log calls (cheapest), OR add @ActivityLog annotations (medium scope,
  surfaces in existing audit UI), OR introduce a dedicated rbac_audit table (largest
  scope, fully forensic).'
contributing_concepts:
- 'RoleServiceImpl.create/.update/.delete: no @Slf4j, no events, no audit table (batch
  E)'
- 'PolicyServiceImpl.create/.update/.delete: same absence (batch E)'
- 'OwnerServiceImpl.create: missing @ActivityLog (grep-verified, batch E)'
- Activity feed does NOT cover RBAC mutations (cross-axis from batch A getActivity)
suggested_add_to_docs: true
