behaviour: |-
  **CROSS-CUTTING PATTERN: ALL 5 BATCH-Q UI COMPONENTS HAVE ZERO TEST FILES.** Verified across all five sidecars in batch Q + independent Glob over `<odd-platform-ui>/src/**/*.test.tsx` returning 7 test files total (all in DataEntitiesUsageInfo + shared/elements primitives — BooleanFormatted / EntityClassItem / NumberFormatted / TextFormatted). The five Management surfaces (PolicyList, RolesList, OwnersList, CollectorsList) plus the SPA shell (AppToolbar) — which together compose the operator-facing Management tab AND the auth-affordance surface — have ZERO test coverage at any layer (component, child item, form, slice, thunk, selector). The Management UI tree as a whole is sparsely tested: `Glob <odd-platform-ui>/src/components/Management/**/*.test.*` returns ZERO matches; `Glob <odd-platform-ui>/src/components/shared/elements/AppToolbar/**/*.test.*` returns ZERO matches. This is consistent with the 5-sidecar F-006 RBAC mutation surface audit-silence pattern + the F-019 6-sidecar Owner-lifecycle audit-silence — the audit silence extends to the UI tier as TEST SILENCE. The implications: (a) every UI invariant pinned by batches D / E / F / H / N / P at the backend tier has NO UI-side regression-pin; (b) the 19th REFACTOR-185 sidecar (CollectorsList UI-vs-API asymmetry under DISABLED) has no test; (c) the catalogue-vs-grant differential render (TEST-GAP-637 + TEST-GAP-642) cannot be regression-pinned without UI test infrastructure; (d) the destructive-empty-roles UPDATE UI hazard (TEST-GAP-647) cannot be regression-pinned. The systemic gap is not "this component lacks tests" but "the Management UI tier as a class lacks tests" — a JEST/Vitest + React-Testing-Library + Testcontainers infrastructure baseline is missing. Until it is stood up, every per-component test-gap in batches Q-onward will require parallel infrastructure work.
