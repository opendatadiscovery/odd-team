name: SMTP protocol case-sensitivity trap — silent STARTTLS + AUTH bypass on uppercase 'SMTP'
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20X — surfaces a doc-vs-code
  case-sensitivity drift in the notification subsystem's SMTP wiring that
  silently disables STARTTLS and SMTP-AUTH on operator deployments that copy
  the live-doc Gmail example verbatim.

  **THE PRIMARY SOURCE — NotificationConfiguration.java:63**:
    The mailSender bean's protocol branch performs `if (emailProperties.getProtocol()
    .equals("smtp")) { ... populate mail.smtp.auth + mail.smtp.starttls.enable
    keys in Properties bag ... } else { props.put("mail.transport.protocol",
    emailProperties.getProtocol()); }`. The `.equals("smtp")` comparison is
    CASE-SENSITIVE LOWERCASE.

  **THE DOC GMAIL EXAMPLE — WebFetched 2026-05-20 status 200**:
    The live `/configuration-and-deployment/odd-platform` page's Gmail example
    YAML writes `protocol: SMTP` (UPPERCASE — JavaMail's documented convention).
    An operator copying the doc YAML VERBATIM produces a deployment where:
      - The code's `.equals("smtp")` branch returns false (uppercase != lowercase)
      - The ELSE branch fires, populating only `mail.transport.protocol` with
        the literal string 'SMTP'
      - `mail.smtp.auth` and `mail.smtp.starttls.enable` are NEVER set in the
        Properties bag, regardless of the operator's `smtp.auth: true` and
        `smtp.starttls: true` configuration

  **NET EFFECT**:
    - STARTTLS does NOT engage even when configured (`smtp.starttls: true` is
      ignored)
    - SMTP AUTH does NOT negotiate even when configured (`smtp.auth: true` is
      ignored)
    - Depending on the relay:
        - If the relay requires STARTTLS to accept the connection, delivery
          fails plaintext
        - If the relay accepts plaintext SMTP-AUTH, credentials travel in clear
          text on the wire
    - There is NO boot warning, NO log line, NO IllegalArgumentException —
      the misconfiguration is SILENT
    - The operator discovers the misconfiguration only after the first failed
      delivery (or worse, never — if their relay accepts plaintext AUTH and
      logs the password)

  **WHY THIS IS A LSN-001-CLASS PATTERN**:
    The shape mirrors the LSN-002 retrospective + the lsn-002-class-primitive-default
    invariant: a typed config field accepts a value that is legal at boot but
    silently broken at first use. Here the cause is doc-vs-code case-sensitivity
    drift rather than a missing default, but the failure pattern (silent
    misconfiguration, operator-invisible, doc-as-the-only-surface) is identical.

  **THE COMPOUND WITH OTHER NOTIFICATION CONFIG GAPS** (per the NotificationConfiguration
  sidecar):
    - SMTP timeouts are unset (JavaMail defaults infinite — confirmed by live doc
      'Known limitations')
    - No implicit-TLS support (STARTTLS-only — Gmail port 465 et al cannot work
      even when correctly cased)
    - No custom-CA trust path (`mail.smtp.ssl.trust` not surfaced)
    - boxed Boolean fields on SmtpProperties accept null (operator omitting the
      key disables AUTH/STARTTLS silently)
  The case-sensitivity trap is the WORST of the family because it produces
  the SILENT plaintext-AUTH scenario rather than just a failed connection.

  **DOC DRIFT FINDING**:
    Captured on the NotificationConfiguration sidecar as the headline doc-drift
    item. The drift is operator-copy-paste-from-docs-silently-fails — the
    canonical cross-cutting concept the catalog already names. This instance
    is particularly hazardous because the failure mode includes credentials in
    plaintext on the wire.
