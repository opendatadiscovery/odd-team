notes: |-
  STRENGTHENED batch ZE — the 12+ endpoint pattern is now
  pillar-wide. The original 5-endpoint RBAC-read pattern
  generalises to ALL non-mutation read surfaces across the
  platform. The doc-vs-code asymmetry compounds because every
  read endpoint is silently catch-all authenticated; only
  write endpoints carry the explicit SECURITY_RULES entry.

  STRENGTHENED batch ZF — Owner directory + MetadataField catalog
  reads bring the count to 14+ endpoints. The Owner directory read
  is architecturally REQUIRED for the Management UI to function
  (OwnersList depends on it), so the closure path is doc-side, not
  code-side. The MetadataField catalog read powers the
  MetadataCreateFormItem autocomplete and is similarly UI-critical;
  also doc-side closure.

  DOC-NNN + REFACTOR-NNN candidates as enumerated in the
  Mitigation candidates section.
