- id: H-005
  hypothesis: |-
    When the user clicks a class tab, exactly one PUT /api/search/{id}/facets
    request is sent (the tab click is a single facet mutation).
  derivation: |-
    The terminal_side_effect of the F-148 flow claims "1 PUT + 1 GET per tab
    click". But the F-017 batch-ZL debouncer-recreated bug amplifies facet
    dispatches. Endpoint-shape + negative-space seed.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The tab dispatch goes through the SAME Search.tsx facet path as the
      sidebar (changeDataEntitySearchFacet → searchFacetParams change →
      Search.tsx:67-71 debounced updateSearchFacets). F-017 batch-ZL established
      that the 1500ms debouncer is RECREATED on every facet-state change
      (useCallback deps include searchFacetParams), with `{leading: true}`, so
      each facet mutation fires a PUT immediately and the debounce does not
      coalesce. A single tab click produces a single searchFacetParams change,
      so on the deliberate-single-click path one PUT is expected — but rapid
      tab-clicking (e.g. clicking through All→Datasets→Transformers within
      1.5s) would fire N PUTs, not the coalesced 1. Whether a single tab click
      ALSO double-fires via the LSN-017 smell #3 re-fire vector
      (Search.tsx:67-71, searchFacetsSynced read but not in deps) cannot be
      determined statically — it depends on selector reference stability during
      the in-flight PUT window. This requires running the system.
    evidence:
      - sidecar: feature-flows/detail/F-017.yaml
        section: "batch ZL notes (2) debouncer-recreated + (1) LSN-017 smell #3"
        cite: "Search.tsx:50-65 + Search.tsx:67-71"
        note: "debouncer-recreated defeats throttling; smell #3 is an active re-fire vector"
    operator_visible_failure: |-
      If the tab strip double-fires or N-fires under rapid clicking, the server
      sees amplified PUT load on the search_facets row (which also re-runs the
      tsquery aggregators) and the result list may flicker through intermediate
      states. Severity inherited from F-017's debouncer finding (MEDIUM).
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-148-1
    routes_to_finding: bug-candidate
    use_case_kind: happy-path
