- id: H-009
  hypothesis: |
    When the open-redirect (H-002) is exploited, the impact is limited to "user
    lands on the wrong page" — the user's IdP-issued tokens are already invalidated
    by the logout, so the attacker gains no live session/token.
  derivation: |
    Cross-feature compounding seed — F-089 facet
    combines_with_shb_107_idp_token_validity_compounds_post_compromise + F-086
    (Logout Token-Revocation) + the Cognito/Azure sidecars' no-revoke findings. A
    senior reviewer checks whether two individually-bounded gaps compound.
  seed_source: cross-pillar + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      For Azure / Cognito / ODD_IAM the logout does NOT revoke the IdP-issued OAuth2
      tokens — Azure v2.0 lacks RFC 7009 revocation (Azure sidecar
      bugs_limitations_corner_cases[2]); Cognito's /oauth2/revoke endpoint EXISTS
      but the handler does not call it (Cognito sidecar bugs_limitations_corner_cases[3]
      + PLT-073 + DOC-236 Facet 1); ODD_IAM is session-only. Only the local
      WebSession is invalidated. So a previously-captured access/refresh token stays
      valid (Cognito access ~1h, refresh up to ~90d; Azure access ~1h) AFTER logout.
      Combined with H-002, an attacker who open-redirects a just-logged-out user is
      working against a user whose IdP tokens (if previously exfiltrated) are STILL
      LIVE — the residual exploitation window is real, not merely cosmetic
      (F-089.yaml facet combines_with_shb_107... + DOC-236 Facet 5).
    evidence:
      - sidecar: "odd-platform__java__auth__logout__CognitoLogoutSuccessHandler.md"
        section: "bugs_limitations_corner_cases[3] + security.known_security_gaps[0]"
        cite: "CognitoLogoutSuccessHandler.java:33-50 (no /revoke) + GoogleLogoutSuccessHandler.java:43-54 (contrast)"
        note: "Cognito session-only; revoke endpoint exists but uncalled; tokens valid post-logout."
      - sidecar: "odd-platform__java__auth__logout__AzureLogoutSuccessHandler.md"
        section: "bugs_limitations_corner_cases[2]"
        cite: "AzureLogoutSuccessHandler.java:31-48 (no outbound revocation)"
        note: "Azure v2.0 lacks RFC 7009; local session only; compounds the redirect gap (F-086 cluster)."
    operator_visible_failure: |
      (a) The two gaps compound into a sharper attack than either alone: a user is
          deposited on an attacker domain immediately after logout WHILE their
          IdP-issued tokens (if captured earlier via XSS / a non-HttpOnly store /
          a browser-extension compromise) remain usable against IdP-protected
          resources for the rest of their TTL.
