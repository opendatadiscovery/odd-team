batch_origin_note: |-
  2026-05-26 ui-review batch — minted from slice-B DataModelling UI
  primary-source walk. The Query Example Details Tab Navigation is a
  distinct operator-observable surface from F-025's controller-anchored
  feature: three sub-views (Overview Markdown render + Linked Entities
  table + Linked Terms table) selected by URL-param state, with
  count-hint badges derived from the pre-fetched details payload. The
  observed asymmetry between linkedEntities pageInfo.total and
  linkedTerms items.length is a cross-pillar UX consistency
  observation; the read-only nature of the tabs (no inline unlink
  affordance) is the operator-relevant workflow paper-cut for
  multi-link management.
