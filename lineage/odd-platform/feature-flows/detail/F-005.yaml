  - facet: d3-hierarchy renders diamond-DAG duplicates at the UI (batch J)
    observed: |-
      `LineageGraph.tsx:40-44` invokes `generateTree(parseData(data), ...)`
      which builds a `d3-hierarchy` TREE (not a DAG). The `hierarchy(root,
      childAccessor)` at `generateGraph.ts:68-76, 108-116` walks edges
      recursively from each node with NO visited-set check; if entity D is
      reachable from root R via two paths (R→B→D + R→C→D), D appears
      TWICE in the rendered tree — each instance is a distinct
      `HierarchyPointNode` with its own `d3attrs.id` UUID. React keys at
      `LineageGraph.tsx:91` use `node.x${node.y}` (DIFFERENT positions ARE
      distinct keys), so React mounts two SVG nodes. Cumulative effect:
      AMPLIFIES the REFACTOR-202 backend recursive-CTE diamond
      amplification into the UI render layer. Backend produces N rows for
      a depth-D diamond with branching B; the UI renders all N visually.
      No client-side dedupe BEFORE the tree builder runs. PRIMARY-SOURCE
      CONFIRMED batch J via LineageGraph sidecar
      bugs_limitations_corner_cases[0] + invariants[0].
    expected: deduplication at the UI (visited-set in generateTree) OR a
      DAG-aware layout (e.g. dagre, react-flow) OR backend-side
      canonicalisation that flattens diamonds before serialisation
    drift_class: diamond_DAG_amplification
    provenance: STATIC — primary-source verification at generateGraph.ts:68-76,
      108-116 + LineageGraph.tsx:84-110 (node-per-instance rendering) +
      LineageGraph sidecar bugs_limitations_corner_cases[0]. Proposed
      local probe — seed A→B→D and A→C→D + GET lineage + assert
      duplicate-D in render tree count == 2.
  - facet: UI silently masks F-005 default-depth NPE — d=1 hardcoded (batch J)
    observed: |-
      `constants.ts:74-84` — `defaultLineageQuery: { d: 1, ... }`. The UI
      ALWAYS sends `lineage_depth=1` even when the URL omits `?d=` —
      `useQueryParams` at `useQueryParams.ts:38-44` returns `d: 1` for a
      URL with no query string, and `HierarchyLineage.tsx:47` reads `d`
      from that. The F-005 NPE-on-null-lineage_depth bug (facet 1 above)
      surfaces ONLY for direct API callers; FROM THE UI THE FAILURE MODE
      IS SILENT — the UI silently picks 1, which is BELOW any reasonable
      "platform default depth" value and may give an artificially shallow
      first impression of the lineage graph. The "Unset returns the
      platform's default depth" branch advertised by the live API-reference
      doc is UNREACHABLE from the UI. PRIMARY-SOURCE CONFIRMED batch J via
      LineageGraph sidecar invariants[2] + implicit_adrs[0].
    expected: |-
      Backend provides a canonical default depth value (via
      `@RequestParam(defaultValue=)`); UI removes the hardcoded `d=1`
      override and lets the backend control the default.
    drift_class: ui_default_masks_backend_caveat
    provenance: STATIC — primary-source verification at constants.ts:74-84
      + HierarchyLineage.tsx:40-47 + useQueryParams.ts:38-44 +
      LineageGraph sidecar invariants[2] + implicit_adrs[0]. The d=1
      default is applied across 7 components — a coordinated decision
      not an accident.
  - facet: No upper-bound on `?d=` URL param (batch J)
    observed: |-
      `useQueryParams.ts:36` uses `parseNumbers: true` which converts
      `?d=999999999` to `d: 999999999`; `HierarchyLineage.tsx:47` passes
      the value straight to the API. The UI's depth `<AppSelect>` at
      `LineageControls.tsx:113-117` only EXPOSES [1..20] (per
      `constants.ts:97-99`) but the URL accepts ANY positive integer. A
      user hand-editing `?d=10000` triggers a backend recursive-CTE walk
      to depth 10000 — REFACTOR-202 amplification UNGATED at the UI.
      Combined with the absence of upper-bound at service+repo tiers
      (per F-005 batch-I + batch-H facets) and the absence of owner-scope
      filtering (cross-owner enumeration above), the URL is the maximal
      attack surface against the lineage subsystem. PRIMARY-SOURCE
      CONFIRMED batch J.
    expected: UI clamps `d` to a hard maximum (e.g. Math.min(parseInt(d, 10),
      20)) OR validates and rejects out-of-range values
    drift_class: structural_amplification_surface
    provenance: STATIC — primary-source verification at useQueryParams.ts:33-36
      + constants.ts:97-99 + LineageGraph sidecar
      bugs_limitations_corner_cases[1] (severity HIGH —
      "combined with backend REFACTOR-202 absence of upper bound") +
      security.known_security_gaps[2] (severity HIGH).
  - facet: LoadMore monotonic accumulation has no collapse affordance (batch J)
    observed: |-
      `dataEntityLineage.slice.ts:206-220` MERGES new nodes into
      `localDownstreamState.allNodes` via `if (!localDownstreamState.nodeIds.has(node.id))
      localDownstreamState.allNodes.push(node)`. No remove-this-expansion
      action, no LRU eviction, no max-size cap. A user clicking LoadMore
      on 100 leaf nodes in a 10K-node graph accumulates 100×(per-leaf-payload-size)
      of nodes/edges in the slice AND in the rendered SVG tree until they
      navigate away. The LoadMoreButton hides itself after click
      (Node.tsx:174 — `setHideLoadMore(true)`) but the underlying data
      stays. Module-level mutable globals (`localUpstreamState`,
      `localDownstreamState` at slice.ts:30-48) live OUTSIDE Redux's
      Immer drafts — they are NOT in DevTools timeline, NOT in any
      snapshot. PRIMARY-SOURCE CONFIRMED batch J.
    expected: collapse-this-branch affordance OR LRU eviction OR
      max-node-count cap in the slice
    drift_class: structural_amplification_surface
    provenance: STATIC — primary-source verification at
      dataEntityLineage.slice.ts:30-48, 206-220, 285-299 +
      LoadMoreButton.tsx:55-65 + LineageGraph sidecar
      bugs_limitations_corner_cases[3] + implicit_adrs[5] (the
      module-level globals trade Redux observability for accumulator
      performance — deliberate).
  - facet: Click-through compounds depth — node.depth becomes new `d` (batch J)
    observed: |-
      `Node.tsx:46-52` — clicking a graph node title navigates to
      `dataEntityLineagePath(entityId, lineageQueryString)` where
      `lineageQueryString` is built from `useQueryParams({...defaultLineageQuery,
      d: node.depth || 1})`. The new view opens with `d` set to the
      CLICKED NODE'S DEPTH — for a node 5 hops out from root, the new
      view loads with depth=5 (NOT the original `d`). Compounds REFACTOR-202
      on every click: drill 5 hops in → click → new view fetches lineage
      to depth=5 around that new root → drill another 5 → click → depth=5
      again. A casual user clicking through the canvas can rapidly trigger
      arbitrarily-expensive recursive CTE walks WITHOUT touching the
      depth slider. PRIMARY-SOURCE CONFIRMED batch J.
    expected: documented behaviour OR depth-on-click is preserved (not
      compounded) OR an explicit UI prompt before high-depth navigation
    drift_class: structural_amplification_surface
    provenance: STATIC — primary-source verification at Node.tsx:49-52
      + LineageGraph sidecar implicit_adrs[4] (the click-compounds-depth
      decision is deliberate per intent_anchor) +
      bugs_limitations_corner_cases (the consequence is real).
  - facet: Sequential fetch + 500-class brittle error mode (batch J)
    observed: |-
      `HierarchyLineage.tsx:44-67` issues downstream FIRST, then `.then()`
      upstream — if downstream returns 500 (e.g. the F-005 NPE branch),
      upstream NEVER fires. The user sees ONE error (downstream) but the
      UI cannot recover by retrying just upstream. Failure is BINARY:
      either both succeed (canvas renders) or AppErrorPage shows. No
      automatic retry, no exponential backoff, no "retry" button on the
      error page. A flaky network sees the user navigate away. PRIMARY-SOURCE
      CONFIRMED batch J.
    expected: parallel fetch (Promise.allSettled) + per-stream error states
      OR an explicit retry affordance
    drift_class: null
    provenance: STATIC — primary-source verification at
      HierarchyLineage.tsx:44-67, 129-133 + LineageGraph sidecar
      bugs_limitations_corner_cases[4] + [9].
  - facet: LineageDepth.empty() semantics (batch H — STATIC corner case)
    observed: '`LineageDepth.empty()` returns `new LineageDepth(-1, true)`. The `tDepth.lessThan(-1)` recursive-step termination
      is FALSE on the first iteration (depth starts at 1), so recursion terminates after the SEED step — i.e. only the depth-1
      edges touching the anchor oddrn set are returned. The `boolean empty` flag is NEVER read inside lineageCte; only the
      depth integer matters. A reader of DataEntityRelationsServiceImpl.java:34 who sees `LineageDepth.empty()` and assumes
      "zero edges returned" would be wrong — the actual behaviour is "seed-only one-hop expansion".'
    expected: Self-documenting code — either rename `.empty()` to `.seedOnly()` or add Javadoc clarifying the actual semantics
    drift_class: misleading_api_naming
    provenance: STATIC — primary-source verification in batch-H ReactiveLineageRepositoryImpl sidecar bugs_limitations_corner_cases[7]
