evidence:
  - "DataSourceIngestionServiceImpl.md says (tests_coverage_semantic.uncovered_behaviours.[1]): 'Namespace inheritance from Collector NOT from payload — the test creates a CollectorDto with `new NamespacePojo()` (DataSourceIngestionServiceTest.java:78) — a NamespacePojo with id = null. The mapper then receives null as the namespaceId. The test does NOT verify that the payload''s hypothetical namespace_name field is dropped — because the test uses the simple DataSource().oddrn(...).name(...) (lines 100-105) without any namespace field. A regression that read namespace_name from the payload would NOT be caught.'"
  - "DataSourceIngestionServiceImpl.md says (bugs_limitations_corner_cases.[2]): 'Silent namespace drop: payload''s `namespace_name` field is NEVER read. Line 106 hardcodes the namespace_id to the Collector''s namespace via MappingUtils.extractFieldFromNullableObject(c.namespace(), NamespacePojo::getId). A custom-collector author following the OpenAPI contract sets namespace_name = my-team and expects the datasource to land under my-team; in reality it lands under the Collector''s configured namespace. No log, no warning, no UI surface.' severity: MEDIUM"
  - "DataSourceIngestionServiceImpl.md says (implicit_adrs.[1]): 'Namespace inheritance from Collector — collector-tenancy model, payload namespace_name silently ignored. The design choice: (a) the upstream Ingestion API contract''s DataSource model has a namespace_name field; (b) the platform''s mapper takes namespaceId as a parameter, NOT a derived value; (c) this service explicitly passes the COLLECTOR''s namespace_id from CollectorDto.namespace(); (d) the protective invariant: a stolen Collector A token cannot register datasources into Collector B''s namespace.' confidence: HIGH"
  - "Source: DataSourceIngestionServiceImpl.java:99-111 (mapDataSources — invokes mapper with collector-side namespace) + DataSourceIngestionMapperImpl.java:9-19 (mapper signature takes namespaceId; never reads from ds payload)"
