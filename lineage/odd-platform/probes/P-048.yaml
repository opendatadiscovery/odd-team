realism_caveats: |
  The probe assumes the FTS index for data sources is the `search_entrypoint`
  table keyed by `data_source_id` — confirmed indirectly via
  DataSourceServiceImpl.updateSearchVectors (updateChangedDataSourceVector /
  clearNamespaceVector) but the exact `search_entrypoint` column name was not
  read in this sidecar's scope; the probe-runner must confirm the column
  against the search-entrypoint schema before running, and adjust the SQL.
  The probe does NOT verify whether catalog SEARCH (the user-facing query)
  excludes the soft-deleted data source — that requires hitting the search
  endpoint and is a follow-on. If `fts_after.n == 0`, a delete-time FTS
  cleanup exists that the static walk missed.
