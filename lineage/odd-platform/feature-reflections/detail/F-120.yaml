  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      Statically provable part (confirmed): the reactive stack borrows one connection per query and releases
      on Mono completion; beyond `maxSize`, r2dbc-pool's acquire is a Mono that does not complete until a
      connection frees OR `maxAcquireTime` elapses. So the dominant default behaviour is graceful queueing
      with a latency penalty (no error) — the feature-flow terminal_side_effect and sidecar
      scaling_characteristics both state this. The SECONDARY question — whether a request that waits beyond
      `maxAcquireTime` fails with `R2dbcTimeoutException`, and what that default timeout actually is at
      r2dbc-pool 1.0.0.RELEASE — is the framework default the platform never pins and the sidecar explicitly
      flags as needing a runtime check (sidecar scaling_characteristics: 'Spring Boot default unbounded? not
      asserted'). The graceful-queueing promise HOLDS up to maxAcquireTime; the behaviour AT the timeout
      boundary is the embedded probe below.
    evidence:
      - sidecar: "R2DBCConfiguration"
        section: "performance.scaling_characteristics + throughput_characteristics"
        cite: "R2DBCConfiguration.java:38-50 (maxAcquireTime via PropertyMapper) + feature-flow terminal_side_effect"
        note: "Queue-on-saturation via Mono backpressure; maxAcquireTime governs the failover-to-timeout boundary; default not pinned by the platform."
    operator_visible_failure: |
      The graceful path is also the SILENT path: saturation manifests as creeping tail latency with no
      error and no gauge (H-008), so the operator does not learn they are pool-bound until users complain.
      At the (unpinned) maxAcquireTime boundary, the failure mode flips from latency to `R2dbcTimeoutException`
      — a different operator-visible symptom (5xx vs slow) whose threshold the platform does not control or
      document. Pinning `spring.r2dbc.pool.max-acquire-time` is itself an undocumented knob (H-006).
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-120-1
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: "PENDING-F-120-1 (local docker-compose: drive 21+ concurrent slow queries at a single replica with maxSize=20; observe queue-vs-timeout and the maxAcquireTime default)"

- id: H-010
  hypothesis: "When an operator points `spring.custom-datasource.url` at a SEPARATE database to isolate Lookup-Tables storage, their data lands where they expect (in the public schema of that separate database)."
  derivation: "Endpoint-shape: the `spring.custom-datasource.*` keys promise a separate Lookup-Tables datastore; an operator setting them expects normal placement in the target DB."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The fallback + separate-DB wiring works (the custom pool connects to the operator's URL with credentials
      falling back per-key to the primary). BUT the connection's `search_path` is silently rewritten:
      R2DBCConfiguration.java:112-119 appends `?schema=lookup_tables_schema` via UriComponentsBuilder to EVERY
      custom-pool connection, and the schema name is a hard-coded constant (line 25) that is NOT operator-
      configurable. So in the operator's separate database, Lookup-Tables data lands inside a
      `lookup_tables_schema` schema (which must exist / be migratable there), not `public`. The behaviour is
      correct-and-deliberate but unexpected for an operator who pre-created `public` tables — and the docs do
      not mention the query-param injection (sidecar doc_drift_findings[2], severity LOW).
    evidence:
      - sidecar: "R2DBCConfiguration"
        section: "concepts.invariants[2] (lookup_tables_schema hard-coded) + docs_link_semantic.doc_drift_findings[2]"
        cite: "R2DBCConfiguration.java:25,112-119"
        note: "?schema=lookup_tables_schema injected on every custom-pool URL; schema name hard-coded, not configurable."
    operator_visible_failure: |
      An operator deliberately separating Lookup-Tables storage who pre-creates tables in `public` finds them
      invisible to ODD (every query lands in `lookup_tables_schema`), and must know to create/migrate that
      exact schema in the separate DB. This is the unusual-but-real separate-DB deployment case; the common
      same-DB default is unaffected. Routes to a caveat on the Lookup-Tables / custom-datasource docs.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: "When the platform upgrades its Spring Boot / r2dbc-pool dependency, the deployed connection-pool ceiling stays the value operators have been running with."
  derivation: "Negative-space + framework_default_inheritance drift_class: the platform pins no pool value, so the ceiling is inherited from the framework version."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      The platform makes NO platform-side pin: `application.yml` ships zero `spring.r2dbc.pool.*` keys and
      the PropertyMapper applies framework defaults via `.alwaysApplyingWhenNonNull()` (only non-null source
      values override, and the source is empty). So ODD's deployed ceiling is exactly whatever
      `R2dbcProperties.Pool.maxSize` defaults to in the bundled Spring Boot / r2dbc-pool version. A future
      upgrade (SB 4.x, r2dbc-pool 2.0) that changes that framework default would silently change ODD's
      per-replica connection ceiling with no ODD-side PR, changelog entry, or migration note — and no test
      guards the value (the only R2DBC test, DependencyPostureTest/ADR-0072, asserts R2DBC is on the
      classpath, NOT the pool size).
    evidence:
      - sidecar: "R2DBCConfiguration"
        section: "bugs_limitations_corner_cases[3] + implicit_adrs[3] (pool defaults inherited from Spring Boot)"
        cite: "R2DBCConfiguration.java:41-50 + application.yml:1-15 (no spring.r2dbc.pool.* keys)"
        note: "PropertyMapper.alwaysApplyingWhenNonNull() over an empty source = pure framework default; no platform pin."
      - sidecar: null
        section: "source_read_for_validation"
        cite: "odd-platform-api/src/test/.../config/DependencyPostureTest.java:90-92 (ADR-0072 asserts io.r2dbc.spi.ConnectionFactory on classpath only)"
        note: "Rule-8 read this session — the existing R2DBC test guards dependency presence, NOT the pool ceiling; so a default-shift is structurally undefended."
    operator_visible_failure: |
      An operator who has carefully sized PostgreSQL `max_connections` against the observed (or, worse,
      inferred — H-002) ceiling can have that ceiling moved out from under them by a routine ODD version bump.
      If the framework default rises, replicas silently demand more PG slots (re-triggering H-003's exhaustion);
      if it falls, throughput silently drops (re-triggering H-007's auth saturation at lower RPS). The change
      is invisible at upgrade time — no diff in `application.yml`, no test failure, no changelog line.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: render
    coverage: unverified
    test_demand: functional

