proposed_action: |-
  Testcontainers integration test. (a) Pre-create metadata field F (so the field side resolves). (b) DO NOT create the data entity X. (c) PUT /api/dataentities/99999/metadata/F with body {value: 'test'} where 99999 is unused. (d) Assert HTTP 200 with empty/null response body (current contract). (e) Query `SELECT count(*) FROM metadata_field_value WHERE data_entity_id=99999 AND metadata_field_id=F` returns 0. (f) Test comment 'LOCKS the silent-200-on-missing-data-entity contract as of 2026-05-19. The contrast: createMetadata at DataEntityServiceImpl.java:257-258 DOES validate; upsert at line 287-305 does NOT. When REFACTOR-NNN aligns the two paths, this test FLIPS to expect 404.'
