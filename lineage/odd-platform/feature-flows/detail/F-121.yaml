notes_for_maintainer: |-
  Probe-needed (local-only): empirically verify Spring's default cron-misfire
  behaviour when a long-running task blocks the executor across the cron
  trigger time. Sidecar emits P-183. Set up a docker-compose stack with a
  contrived 30-minute housekeeping cycle and observe the partition-creation
  scheduling at the cron boundary.

  The fix IS one line of YAML: `spring.task.scheduling.pool.size: 4`. The
  substantive work is operator-page documentation + the `@SchedulerLock`
  convention defence on the session-housekeeping handler.

  Cluster_with F-010 (Housekeeping TTL Enforcement) — same source SHB
  flagged. F-010 names WHAT runs in the housekeeping cycle; this feature
  names HOW the executor schedules across the four-job set. The two cover
  different boundaries and should remain distinct.

  feature-reflector v0.3.0 (2026-06-03) severity-correction write-back (H-006):
  reading partition/PostgreSQLPartitionCreationJob.java:29-51 shows partitions
  are created at BOTH @PostConstruct (boot, behind the leader-election advisory
  lock — ADR-0028) AND the nightly cron, and each partition spans 2×partition-period
  (~60 days forward). This materially BLUNTS the cron-misfire INSERT-failure blast
  radius in terminal_side_effect: a fresh boot re-creates the window independent of
  the scheduler, and the imminent window is rarely the one being created tonight.
  Realistic symptom is a LATE partition under sustained backlog, not an INSERT
  failure. Proposed new drift class:
  partition_creation_double_coverage_boot_postconstruct_plus_nightly_cron_blunts_cron_misfire_blast_radius.
  Also correct the stale chain path: the job lives at partition/PostgreSQLPartitionCreationJob.java,
  NOT leader_election/ (primary_subject + contributing_nodes + chain hop 3 carry the wrong path),
  and the chain omits the @PostConstruct boot-creation hop. See the reflection's validation_gaps.
