notes: |-
  NEW operation captured in batch N. The upsert is the architectural
  counterpart to the (race-prone) bulkCreate path on the same table —
  the maintainer's deliberate dual-method design.

  Cross-cutting connections:
    - Pairs with the Tag entity — this is one of two write paths into
      the Tag directory
    - Pairs with the spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create
      invariant — the side-door creates the wide-open surface; this
      upsert is the SAFE write path that the side-door routes through
      for the ingestion case
    - Pairs with the tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race
      invariant — the recommended mitigation for the TOCTOU race is
      to MIGRATE the bulkCreate path to use this upsert
    - Cross-references the architectural pattern: every Reactive*Repository
      that needs auto-create-on-miss semantics should consider the
      RETURNING-trigger pattern; today only Tag uses it (Owner +
      Namespace + Title etc. use the race-prone bulkCreate path)

  Recommended documentation:
    (a) Document the dual-method design (ingestData vs bulkCreate) at
        the internal architecture page on persistence-layer conventions
        — the contrast is load-bearing and operators can confuse the
        two
    (b) Migrate the other auto-create-on-miss service-tier methods
        (OwnerServiceImpl.getOrCreate, NamespaceServiceImpl.getOrCreate,
        etc.) to the RETURNING-trigger pattern; closes the
        cross-cutting TOCTOU bug class
    (c) Add a regression test asserting the RETURNING clause's
        behaviour on concurrent novel-name inserts (the maintainer's
        intent: both racers receive the same row's id)
