  - P-03
description: |-
  P-03 Master Data Management was previously catalogued in system-mission.md
  (lines 125-141) but had NO controller-layer sidecar anchor in the concept
  catalog. Batch V's ReferenceDataController class-level sidecar is the
  PRIMARY-SOURCE anchor for the pillar; this entity entry promotes the
  Lookup Table to a first-class catalog concept with cross-pillar
  relationships, security/performance aggregates, and the substrate-level
  observations the controller surfaces.

  ## STRENGTHENED — batch ZH (2026-05-26)

  Batch ZH adds the URL-shape contract: `masterDataRoutes.ts` exports
  `lookupTablesPath()` returning the literal `/master-data/lookup-tables`.
  The route module declares an internal `BASE_PATH = '/master-data'`
  but exports no helper for the bare base — visiting `/master-data`
  directly produces no element match (per the
  `bare-base-url-behavior-divergence-redirect-vs-blank` invariant).
  The Lookup Tables route is mounted at App.tsx:75-88 under a
  WithPermissionsProvider that — per the
  `withpermissionsprovider-context-seed-not-route-gate` invariant —
  does NOT block rendering; only the inner `+Add new` button is
  actually gated by `<WithPermissions permissionTo={LOOKUP_TABLE_CREATE}>`.

  The route module is the SOT for the Master Data pillar's URL surface
  (currently single-feature; the BASE_PATH reservation signals intent
  for future MDM sub-features). Three consumers: App.tsx route mount,
  ToolbarTabs.tsx Master Data tab link, LookupTableForm.tsx post-create/
  post-edit redirect.

  ## ORIGINAL — batch V

  THE CANONICAL CONCEPT — directly from system-mission.md + the live docs
  at /features/master-data-management/lookup-tables (WebFetched 2026-05-20
  status 200):

    Lookup Tables are operator-curated reference data — the canonical lists,
    lookup values, and code tables that downstream pipelines and BI tools
    join against. They are first-class Data Entities of subtype LOOKUP_TABLE
    (DataEntityClassDto.java:43) whose row storage is physical Postgres
    tables in lookup_tables_schema with names n_{namespaceId}__{lowercased_underscored_name}.

  THE PRIMARY-SOURCE ANCHOR — file:line citations from
  ReferenceDataController batch V:

    Controller surface — 14 endpoints across /api/referencedata/*:
      Table CRUD: createLookupTable, getLookupTableById, updateLookupTable,
        deleteLookupTable (4 endpoints)
      Column CRUD: addLookupTableField, updateLookupTableField,
        deleteLookupTableField (3 endpoints)
      Row CRUD: getLookupTableRowList, addDataToLookupTable,
        updateLookupTableRow, deleteLookupTableRow (4 endpoints)
      Search: referenceDataSearch (create-session), getReferenceDataSearchFacetList,
        updateReferenceDataSearchFacetList, getReferenceDataSearchResults
        (4 endpoints — total 15 with overloaded GETs)

    Authorization model — RBAC:
      9 LOOKUP_TABLE_* permissions across three surfaces (table / definition /
      data) with _CREATE / _UPDATE / _DELETE per surface. The split lets
      operators grant 'edit-the-data' without 'edit-the-schema' — per the
      live doc.

    Physical storage — lookup_tables_schema:
      Each lookup table backs a Postgres table named via buildTableName
      (lossy lowercase-replace-space-with-underscore). Direct SQL access
      from downstream pipelines is the documented BI integration use case.

    9 PostgreSQL field types — per LookupTableColumnTypes.java:30-50:
      TYPE_VARCHAR / TYPE_INTEGER / TYPE_SERIAL / TYPE_DECIMAL /
      TYPE_BOOLEAN / TYPE_DATE / TYPE_TIME / TYPE_JSON / TYPE_UUID
      (9 enum constants; 8 distinct SQL types since INTEGER and SERIAL
      share INTEGER per the doc-drift finding)

  CROSS-PILLAR RELATIONSHIPS:

    feeds: [P-01]  # Lookup Tables are Data Entities — surface in Discovery
    feeds_from: [] # operator-curated; no external producer
    shares_data_with: [P-09]  # gated by 9 LOOKUP_TABLE_* permissions

  SUB-FEATURES (single-sub-feature pillar):

    Lookup Tables (the single user-observable surface — CRUD + faceted
    search; physical Postgres storage; 9 LOOKUP_TABLE_* permissions across
    3 RBAC surfaces; direct PG access via lookup_tables_schema; cascade
    on delete; rename via ALTER TABLE breaks downstream JOINs).

  AUDIENCES:
    odd-platform-ui-end-user (Master Data tab)
    platform-operator (curates reference lists)
    data-engineer-analyst (downstream BI joins; direct PG access)

  THIS ENTITY ENTRY IS THE LANDING PAGE for P-03 in the catalog — any
  future enrichment of MDM-related surfaces (e.g. additional CRUD endpoints,
  cascade-rename-fix, BI-integration documentation) anchors here.
