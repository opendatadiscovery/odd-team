proposed_action: |-
  Add `DatasetFieldAddTermWrongPermissionTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `addDatasetFieldTerm_callerWithOnlyDATA_ENTITY_ADD_TERM_succeeds_pinsCurrentBug` — authenticate as a user with `DATA_ENTITY_ADD_TERM` on the parent DataEntity BUT NO `DATASET_FIELD_ADD_TERM`; POST `/api/datasetfields/{id}/terms` with `termId: 100`; assert HTTP 200 (the current bug; PINS the wrong-permission grant).
  2. `addDatasetFieldTerm_callerWithOnlyDATASET_FIELD_ADD_TERM_returns403_pinsCurrentInversion` — authenticate as a user with `DATASET_FIELD_ADD_TERM` on the parent DataEntity BUT NO `DATA_ENTITY_ADD_TERM`; POST `/api/datasetfields/{id}/terms` with `termId: 100`; assert HTTP 403 (the current inversion of the documented contract; PINS the documented-permission denial).
  3. `addDatasetFieldTerm_underAuthDisabled_anonymousUserCanLinkTermToField` — pin the DISABLED-mode behaviour. Under auth.type=DISABLED, all UI auth gates fall away; the SecurityConstants permission check is moot; any caller can link.

  When the fix lands (swap `DATA_ENTITY_ADD_TERM` → `DATASET_FIELD_ADD_TERM` at SecurityConstants.java:299), both tests #1 and #2 invert — that lockstep IS the verification that the wiring matches the docs. Pair with TEST-GAP-477 fix; submit BOTH bug fixes in one PR; bind a new `SecurityRule`-table-consistency unit test asserting every endpoint's wired permission matches the docs' published permission catalog (an enumerated test against the docs' Permission catalog page).
