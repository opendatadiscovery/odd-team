behaviour: '**`EmailNotificationSender#send`** iterates `notificationsEmails` reusing
  the same `MimeMessage` and calling `helper.setTo(email); emailSender.send(mimeMessage);`
  per iteration (`EmailNotificationSender.java:53-61`). Any thrown `MessagingException`
  at recipient N aborts the loop — recipients N+1, N+2, … never receive the alert.
  Live doc names this as a known limitation; code has no fault-tolerance (no continue-on-error,
  no per-recipient try/catch). 2-sidecar primary-source confirmed (NotificationsProperties
  batch C + EmailSenderProperties batch D).'
