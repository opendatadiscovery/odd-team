      - "IngestionDataEntitiesFilter@L20: the ingestion-token verification path is ORTHOGONAL to `auth.type` — every UI/API security config explicitly puts `/ingestion/entities` in permittedPaths or in `WHITELIST_PATHS = /ingestion/**`, so authentication on the ingestion endpoint depends EXCLUSIVELY on `auth.ingestion.filter.enabled` regardless of `auth.type`. When that property is `false` (the application.yml:48 default), `/ingestion/entities` is unauthenticated under ALL four UI auth modes."
      - "DisabledAuthSecurityConfiguration@L10: CANONICAL sidecar for the DISABLED branch — the bean produces a `securityWebFilterChainDisabled` that calls `.csrf(...disable).authorizeExchange(... .anyExchange().permitAll())`; NO `.cors(...)`, NO `AuthorizationCustomizer`, NO `S2sAuthenticationFilter` wiring (S2S silently ignored even when `auth.s2s.enabled=true`), NO `@Slf4j` boot WARN, NO `matchIfMissing`. The shortest of the four SecurityConfiguration siblings (19 lines). Under DISABLED, `/actuator/{health,prometheus,env,info}` are reachable on the same HTTP port."
      - "LoginFormSecurityConfiguration@L31: CANONICAL sidecar for the LOGIN_FORM branch — VALIDATES REFACTOR-073: `LoginFormSecurityConfiguration.java:55-57` configures only `.pathMatchers(permittedPaths).permitAll().pathMatchers(\"/**\").authenticated()` — NO `AuthorizationCustomizer`. Every form-authenticated user is granted ADMIN authorities via `getAuthorities(true)` at line 81; CSRF disabled at line 54; S2S additively composable at HTTP_BASIC order at line 61-63; `auth.login-form-redirect` is an open-redirect surface (no scheme/host validation); plaintext credentials leak via `/actuator/env`."
      - "OAuthSecurityConfiguration@L71: CANONICAL sidecar for the OAUTH2 branch — WIRES `AuthorizationCustomizer(permissionService, extractors)` at line 98 (the Policies/Permissions/Roles/Owners framework). CSRF disabled at line 96. S2S COMPOSES (not mutex) at HTTP_BASIC at line 108-110 — and when composed, the S2sAuthenticationFilter grants ADMIN role across all `/**` paths (not just `/ingestion/entities`). Multi-client login chooser at `GET /login` is public. Provider enum carries only Cognito/GitHub/Google/Azure/ODD_IAM — Okta/Keycloak operators (per live docs) get no provider-specific user enrichment or logout."
      - "LDAPSecurityConfiguration@L51: CANONICAL sidecar for the LDAP branch — WIRES `AuthorizationCustomizer(permissionService, extractors)` at line 145; SecurityWebFilterChain runs at `Ordered.HIGHEST_PRECEDENCE` at line 136. Admin-group match uses `containsIgnoreCase` (line 96) — a SUBSTRING match enabling substring-collision admin escalation (`admin-groups: ['ops']` matches `devops`/`oopsgroup`). NO scheme enforcement on `auth.ldap.url` (plaintext `ldap://` accepted; bind creds + end-user creds in cleartext). `auth.ldap.password` exposed via `/actuator/env`. Active Directory branch silently ignores `dn-pattern` and `user-filter` config. S2S additively composable at HTTP_BASIC at line 149-151."
