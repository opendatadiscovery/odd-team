name: Attachment Storage Backend
canonical_in_docs: false
canonical_candidate: true
description: 'Operator-configured storage tier for attachment uploads — `LOCAL` (filesystem
  path inside container, default `/tmp/odd/attachments`) vs `REMOTE` (S3-compatible
  object storage). Selected via `attachment.storage` `@ConditionalOnProperty` switch
  on MinioConfig / LocalFile* / RemoteFile* beans. Note: chunk staging path `/tmp/odd/chunks`
  is hardcoded and applies to BOTH modes (uploadFileChunk method-level finding) (attachment
  config-prefix sidecar `concepts.entities` + `implicit_adrs[0]` + uploadFileChunk
  sidecar).'
axes_present:
- config_prefixes
- controllers
nodes:
- odd-platform yaml application.yml config-prefix:attachment
- odd-platform java DataEntityAttachmentController controller-method:uploadFileChunk
contributors:
- 'attachment config-prefix: entities[attachment storage backend, S3-compatible bucket,
  local filesystem path]'
- 'uploadFileChunk: finding that chunk staging path /tmp/odd/chunks is independent
  of attachment.storage (FileUtils.CHUNK_BASE_PATH constant)'
evidence:
- attachment-config-prefix.md:concepts.entities.[attachment storage backend, S3-compatible
  bucket]
- attachment-config-prefix.md:implicit_adrs.[0] (storage-mode @ConditionalOnProperty)
- attachment-config-prefix.md:bugs_limitations_corner_cases.[0,1] (LSN-001, LSN-002)
- uploadFileChunk.md:bugs_limitations_corner_cases.[0] (chunk path storage-mode-independent)
notes: 'Storage backend is a sub-concept of Attachment but operationally

  distinct enough to merit its own catalog entry: it carries its own

  ADR (LOCAL is matchIfMissing default), its own retrospectives

  (LSN-001 ephemerality, LSN-002 us-east-1 pin), and its own

  operator configuration surface. The Attachment concept''s

  security_aggregate and performance_aggregate already aggregate

  storage-backend signals. Method-level uploadFileChunk sidecar adds

  a critical finding: the chunk-staging path is NOT switched by

  attachment.storage — it''s a hardcoded `/tmp/odd/chunks` constant,

  so REMOTE-storage deployments still suffer the per-instance

  multi-replica failure mode.

  '
