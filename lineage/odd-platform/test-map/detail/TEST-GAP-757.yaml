behaviour: |-
  **HIGH — F-020 Collector Lifecycle has ZERO audit logging across the entire surface: no Activity Feed entries, no `@Slf4j` logger statements, no record of who registered / updated / deleted / rotated any collector. The `TOKEN.updated_by` column captures the LAST actor on rotation (single-state, not append-only) — overwritten on each rotation. Forensic incident response cannot reconstruct collector-lifecycle history from production data alone.** Primary-source confirmed in batch-W CollectorController sidecar:

  **Audit-tier evidence (the absence)**:
  - `CollectorController.java:1-52` — NO `@Slf4j` annotation, NO `log.info`/`log.warn`/`log.debug`/`log.error` calls (verified by Grep returning zero matches).
  - `CollectorServiceImpl.java:1-110` — same. No log statements at any severity.
  - `TokenGeneratorImpl.java:1-53` — same.
  - `ReactiveTokenRepositoryImpl.java` — same on the relevant paths.
  - **No `@ActivityLog` annotation** on any of the 5 endpoint methods (register / update / delete / regenerate-token; the GET-list path doesn't need one but mutations do).
  - **No `activityEventEmitter` call** anywhere in the F-020 surface.

  **The TOKEN.updated_by column** captures the LAST actor on the last rotation, single-state. If operator A rotates the token, then operator B rotates again, the column shows B. The forensic question "did operator A rotate this token in 2024-Q3?" is unanswerable from production data alone.

  **Cross-pillar context** — this is the same audit-log-presence-asymmetry pattern surfaced in the canonicalisation candidate at system-mission.md §"Audit-log Presence Asymmetry (2-tier audit story)":
  - **Tier 1 (Activity Feed)**: records entity-side metadata changes (description edits, tag assignments, ownership changes).
  - **Tier 2 (NO audit log)**: RBAC mutations (Role create/edit, Policy edit, Owner role-attach) — and now F-020 Collector Lifecycle — and F-008 Datasource Lifecycle (per batch-W DataSourceController sidecar: "NO Activity Event emission for ANY data_source mutation").

  **Why HIGH not MEDIUM**:
  - **Incident response**: an operator investigating "someone rotated the collector token at 02:14 UTC on 2026-05-15 — who?" gets the last rotator from `TOKEN.updated_by` but cannot tell if there were intermediate rotations or who-did-what.
  - **Compliance**: SOX, GDPR, ISO 27001 all require auditability of credential lifecycle events. The platform's audit story for collector tokens is "the last rotator's name". This is insufficient for compliance auditors.
  - **Operator deception**: the Activity Feed in the UI shows "entity X was tagged at 14:32 by user Y" — operators reasonably expect the same audit trail for "collector X was registered at 14:32 by user Y" or "token X was rotated at 14:32 by user Y". The asymmetry is invisible until an operator goes looking.
  - **Cross-pillar reach**: the audit-log absence on F-020 (Collector Lifecycle) AND F-008 (Datasource Lifecycle) AND RBAC mutations means the ENTIRE Management tab surface — the place operators expect the highest audit-trail granularity — has the LOWEST audit-trail granularity. The canonicalisation candidate in system-mission.md captures this as an open question; this test gap is the F-020-specific instance pinning the regression.

  **Test gap shape**: regression-pin asserting: (a) `POST /api/collectors` produces NO Activity Feed entries; (b) `PUT /api/collectors/{id}` produces NO Activity Feed entries; (c) `DELETE /api/collectors/{id}` produces NO Activity Feed entries; (d) `PUT /api/collectors/{id}/token` produces NO Activity Feed entries; (e) `CollectorServiceImpl` carries NO `@Slf4j` annotation (verifiable via reflection); (f) the `TOKEN.updated_by` column is overwritten on each rotation (not append-only). The current state is PINNED — failures land if a future maintainer adds Activity Event emission OR moves `TOKEN.updated_by` to an append-only history table.
