proposed_action: |-
  Unit test with three sender mocks + an AlertNotificationMessage whose dataEntity.owners contains only OwnerA. Drive dispatcher.process(...). Assert all three senders received the SAME AlertNotificationMessage — no filtering, no scoping. LOCKS the current contract; when conditional routing lands (per-channel filters / owner scoping), this test must be updated AND a fix-required regression promoted.
