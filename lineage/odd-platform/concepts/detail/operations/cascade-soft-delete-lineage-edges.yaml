name: Cascade soft-delete lineage edges
canonical_in_docs: false
canonical_candidate: true
description: '**NEW OPERATION, batch 2026-05-19H** — the entity status-change soft-delete
  / restore cascade for lineage edges. When an entity transitions to DELETED state
  (or is restored), every lineage edge touching the entity oddrn on EITHER end is
  flipped via `softDeleteLineageRelations(Collection<String> dataEntityOddrns)` (UPDATE
  is_deleted=true) or `restoreLineageRelations(...)` (UPDATE is_deleted=false). The
  canonical implementation is `ReactiveLineageRepositoryImpl.softDeleteLineageRelations`
  (lines 92-99) + `restoreLineageRelations` (lines 102-109) — paired symmetric methods
  with identical OR-predicate shape: `LINEAGE.CHILD_ODDRN.in(dataEntityOddrns).or(LINEAGE.PARENT_ODDRN.in(dataEntityOddrns))`.
  The WHERE clause matches edges where AT LEAST ONE endpoint is in the input list.
  Both methods use `.returning()` to emit the flipped rows back as a Flux. Caller:
  `DataEntityInternalStateServiceImpl.softDeleteDataEntities` (line 126) + `restoreDeletedDataEntityRelations`
  (line 133) — both invoked under `@ReactiveTransactional` at the parent method (DataEntityInternalStateServiceImpl.java:101).
  The cascade is the lineage-side of the entity STATUS state-machine: when DataEntityInternalStateServiceImpl
  changes an entity to DELETED, this method ensures all incident lineage edges are
  soft-deleted in the same transaction; on restore, the symmetric operation runs.
  **Important asymmetry with the lineage repository''s OTHER soft-delete mechanism**:
  the SOFT-DELETE-VIA-IS_DELETED-FLAG approach (used by the cascade methods + every
  read''s `IS_DELETED.isFalse()` filter) is DIFFERENT from the ingestion''s ESTABLISHER-KEYED
  HARD-DELETE primitive (`batchDeleteByEstablisherOddrn` + `batchInsertLineages` with
  onConflictDoNothing — physical DELETE + idempotent batch INSERT). The lineage table
  carries BOTH mechanisms: cascade soft-deletes for entity-lifecycle events; rewrite-by-establisher
  hard-deletes for ingestion-rewrite. The two mechanisms coexist; the activity-feed
  audit trail bridges them by capturing each entity status change. **NEW BATCH H —
  no covering index for the OR-predicate**: `LINEAGE.CHILD_ODDRN.in(...).or(LINEAGE.PARENT_ODDRN.in(...))`
  cannot use the (parent_oddrn, child_oddrn, establisher_oddrn) PK efficiently for
  the CHILD_ODDRN leg (PK starts with parent_oddrn); a separate index on `(child_oddrn,
  is_deleted)` would help. For a soft-delete cascade involving many entity oddrns,
  may degrade to sequential scan. (V0_0_79__data_deprecation.sql:11-12 adds is_deleted
  with NO covering index.)'
