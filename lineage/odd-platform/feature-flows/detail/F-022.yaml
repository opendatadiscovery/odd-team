observed_vs_expected:
  facets:
  - facet: PNG vs JSON doc drift on /api/datasets/{id}/sla
    observed: |-
      `GET /api/datasets/{id}/sla` returns `image/png` — a hardcoded
      `sla_{red,yellow,green}.png` byte-array (per
      `openapi.yaml:1880-1896` content-type declaration +
      `DataQualityController.java:42-48` PNG path +
      `CachingByteArraySLAResourceResolver.java:30-54` resource cache).
      The live `sla-statuses.md` page (WebFetched 2026-05-20 status
      200) describes the same endpoint as returning "a `DataSetSLAReport`
      that includes [JSON fields]". The JSON `DataSetSLAReport` is in
      fact returned by the SIBLING endpoint
      `GET /api/datasets/{id}/sla_report` (operationId
      `getDatasetSLAReport`, `openapi.yaml:1898-1913`). A BI engineer
      following the docs verbatim writes a JSON-parsing client that
      receives a PNG byte stream.
    expected: |-
      Either (a) the doc page corrects the response-shape claim to
      name `/sla_report` for the JSON shape, OR (b) the PNG endpoint
      gains a content-negotiation path that returns JSON on
      `Accept: application/json`.
    drift_class: png_vs_json_doc_drift
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T
      bugs_limitations_corner_cases[1] + WebFetch sla-statuses.md
      2026-05-20 + openapi.yaml:1880-1896. Severity: HIGH (canonical
      "operator follows our guide off a cliff" for the BI-tool
      integration audience the page explicitly targets).
  - facet: four read endpoints unscoped — REFACTOR-024 family extension to P-04
    observed: |-
      `getDataEntityDataQATests`, `getDatasetTestReport`, `getSLA`,
      `getDatasetSLAReport` have NO entry in
      `SecurityConstants.SECURITY_RULES` (verified across the 357-line
      file; only the PUT `setDataQATestSeverity` is registered, lines
      243-246). The four endpoints fall through to
      `AuthorizationCustomizer.java:29-30` catch-all `.authenticated()`.
      The downstream `ReactiveDataQualityRepositoryImpl` queries apply
      only `HOLLOW.isFalse()` + `STATUS.ne(DELETED)` (lines 55-56, 78,
      122) — NO OWNERSHIP join, NO principal-derived predicate. Any
      authenticated caller reads any dataset's DQ tests, test reports,
      and SLA. The live docs (data-quality.md, sla-statuses.md,
      test-results-import.md, all WebFetched 2026-05-20 status 200)
      are SILENT on access control.
    expected: |-
      Either (a) the live data-quality page discloses the
      read-collaborative posture explicitly (mirror of the
      activity-feed and alerting cross-owner reads documented at the
      doc-product editorial level), OR (b) per-dataset DQ reads gain
      OWNERSHIP-derived predicates matching the lone PUT's
      DATA_ENTITY-scoped permission.
    drift_class: cross_owner_dq_read_no_security_rule
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T
      bugs_limitations_corner_cases[0] + SecurityConstants.java:98-355
      + ReactiveDataQualityRepositoryImpl.java:46-58, 62-84, 105-126,
      130-138 + WebFetch 2026-05-20. Severity: MEDIUM (under
      ADR-CANDIDATE-003 read-collaborative posture this is intentional;
      doc-side silence is the actionable finding). Cross-link to
      F-014 (Per-Entity Alert View) batch-L for the structurally
      identical pattern on alerts.
  - facet: 404 on empty DQ test list — unusual REST shape
    observed: |-
      `getDataEntityDataQATests` for a dataset that exists but has
      zero defined DQ tests returns 404 NotFound, NOT 200+[].
      `DataQualityServiceImpl.java:39-42` throws
      `NotFoundException('Data quality tests for dataset with id %d
      not found')` when the empty-list stream completes. A UI rendering
      the `Test reports` tab on a dataset with zero tests receives 404
      indistinguishable (by status code) from the dataset-not-found
      404 returned by sibling reads (line 55-58, 67-77 for
      `getDatasetTestReport`).
    expected: |-
      Either (a) return 200 + [] (REST convention for empty
      collections), OR (b) document the 404-on-empty behaviour
      explicitly + have the UI distinguish the two 404 sources via
      message-body parsing.
    drift_class: 404_on_empty_dq_test_list_unusual_rest_shape
    provenance: |-
      PRIMARY-SOURCE — DataQualityServiceImpl.java:38-42 (the
      empty-stream NotFoundException) + comparison with sibling
      `getDatasetTestReport` path at lines 54-60. Severity: MEDIUM.
  - facet: default-MAJOR severity fallback silently inflates SLA
    observed: |-
      `ReactiveDataQualityRepositoryImpl.java:142-148` (`mapLastRunDto`
      function) returns `DataQualityTestSeverity.MAJOR` for tests with
      NO row in `DATA_QUALITY_TEST_SEVERITY`. The SLA colour an
      operator sees is computed AS IF every unset test were Major —
      possibly inflating Red/Yellow outcomes when most tests are
      low-importance. The platform exposes NO operator-facing signal
      distinguishing 'default-MAJOR contribution' from 'operator-set
      MAJOR'. A dataset with 100 unset tests + 1 critical-failing test
      will be RED; the operator-mental-model 'most tests are minor;
      one critical failed; some yellow' is wrong without disclosing
      the default-MAJOR.
    expected: |-
      Either (a) the SLA-statuses doc states the default-MAJOR rule
      explicitly, OR (b) the SLA payload distinguishes default vs
      operator-set severity (a `severity_source` discriminator), OR
      (c) the calculator excludes default-severity tests from the
      compound weight when the operator has explicitly set
      severities on at least one test in the dataset.
    drift_class: default_major_severity_inflates_sla_silent
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T
      bugs_limitations_corner_cases[6] +
      ReactiveDataQualityRepositoryImpl.java:142-148 +
      SLACalculator.java:144-149. Severity: MEDIUM.
  - facet: setDataQATestSeverity audit-silence — sixth-sidecar corroboration
    observed: |-
      `setDataQATestSeverity` upserts the severity row via
      `onDuplicateKeyUpdate` (ReactiveDataQualityRepositoryImpl.java:90-101)
      — idempotent in outcome but NO `ActivityEvent` emission, NO
      `@ActivityLog` annotation on the service method
      (DataQualityServiceImpl.java:62-81), NO `last_modified_by`, NO
      version increment. A maintainer auditing 'who set this severity
      to Critical?' has no answer from the platform. The
      `audit-silence-on-mutations` pattern (F-006 family, 8-sidecar
      pattern at batch S — controller PolicyController/RoleController
      batch E + repo PolicyController batch H + UI batch Q + repo
      Activity batch R + service Policy/Role batch S + Owner Service
      batch S) extends here as a SIXTH-sidecar mutation surface (the
      DQ-severity write).
    expected: |-
      Either (a) add `@ActivityLog` to `setDataQualityTestSeverity` so
      severity changes emit on the dataset's Activity tab (the
      `activity.data_entity_id` schema PERMITS this since the dataset
      IS a data entity — F-021 schema-rooted scope allows it), OR (b)
      add a separate `platform_event` audit surface (the proposed
      remediation for the audit-silence-on-RBAC family).
    drift_class: audit_silence_on_severity_mutation
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T
      bugs_limitations_corner_cases[4] +
      ReactiveDataQualityRepositoryImpl.java:87-102 +
      DataQualityServiceImpl.java:62-81. Severity: MEDIUM.
      Cross-link to F-006 `eight_sidecar_audit_silence_pattern...`
      family + F-021 schema-rooted scope (V0_0_48 NOT NULL FK to
      data_entity).
  - facet: no pagination on getDataEntityDataQATests
    observed: |-
      The OpenAPI spec for `GET /api/datasets/{id}/dataqatests`
      (`openapi.yaml:1932-1947`) declares NO `page` / `size`
      parameters. The controller method
      (`DataQualityController.java:25-31`) takes only `dataEntityId`
      + ServerWebExchange. A dataset with 10K+ defined tests returns
      10K+ rows in one response, with no client-side hint or
      server-side clamp.
    expected: |-
      Add pagination parameters to the OpenAPI spec + the controller
      method + the underlying repository query, consistent with the
      Directory's level-4 mandatory page+size pattern (F-023) and
      the broader catalog's pagination convention.
    drift_class: page_only_count_mismatch_no_pagination_on_test_list
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T
      known_performance_gaps[0] +
      DataQualityController.java:25-31 + openapi.yaml:1932-1947.
      Severity: MEDIUM.
  - facet: existsIncludingSoftDeleted preserves DQ visibility for soft-deleted datasets
    observed: |-
      `DataQualityServiceImpl.java:55, 67, 96` — three call sites use
      `existsIncludingSoftDeleted` (NOT the `exists` variant). A
      dataset that was soft-deleted (STATUS = DELETED, but not yet
      hard-purged by housekeeping) still surfaces its DQ tests, test
      reports, and SLA via this controller — intentional forensic
      coverage. Combined with F-014's batch-L finding
      `soft-delete-inclusive existence check` on the per-entity alert
      view, this is a deliberate cross-channel pattern: hide entity
      from catalog browse, preserve historical signals for audit.
    expected: |-
      Either (a) document the soft-delete-inclusive DQ visibility on
      the data-quality page (today silent), OR (b) intentionally hide
      DQ for soft-deleted datasets matching the catalog visibility
      semantics.
    drift_class: existsIncludingSoftDeleted_dq_visibility_preserved
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T
      implicit_adrs[1] +
      DataQualityServiceImpl.java:55, 67, 96. Severity: LOW (the
      design is intentional; the doc-side silence is the
      finding). Cross-link to F-014 batch-L
      `soft_delete_inclusive_existence_check` facet.
  - facet: SLA aggregation hierarchical-multiplicative (positive case-law)
    observed: |-
      `SLACalculator.java:37-60` encodes hierarchical-multiplicative
      weight aggregation — Major count multiplies by Minor count
      when Minors exist; Critical count multiplies by the resulting
      Major weight, then by Minor weight. The algorithm encodes
      'severity buckets compound' rather than 'severities sum
      independently'. Operator-visible consequence (per live doc
      sla-statuses.md:44): 'changing a single test's severity from
      Major to Critical can flip the dataset from Yellow to Red
      without any test pass/fail status changing'. The code-doc
      match is exact + the test suite (`SLAColourTest`,
      `SLAReportTest`) treats the algorithm as the spec.
    expected: same
    drift_class: sla_calculator_aggregation_hierarchical_multiplicative
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T
      implicit_adrs[3] + SLACalculator.java:80-121 +
      documentation/docs/data-quality/sla-statuses.md:44. Severity:
      N/A (positive case-law; documents the intentional algorithm).
  - facet: classpath PNG resource fragility (fail-fast at bean init)
    observed: |-
      `CachingByteArraySLAResourceResolver.java:30-54` loads three
      classpath PNG resources at bean construction; absence is
      detected only at startup via `IllegalStateException`. No test
      asserts the resources are present in the classpath; no
      integration test exercises `getSLA` end-to-end against an
      embedded server. The failure mode for a misconfigured build
      pipeline (Maven resource-filter mis-config, Docker COPY
      excluding the `sla/` subdirectory, fat-JAR shading dropping
      binary resources) is 'platform won't boot' — fail-fast, but no
      regression test exists.
    expected: |-
      Add a resource-presence assertion to the controller test suite
      (paired with the missing `@WebFluxTest(DataQualityController.class)`
      smoke tests) so a misconfigured build pipeline is caught at
      CI, not at production boot.
    drift_class: classpath_png_resource_fragility
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T
      bugs_limitations_corner_cases[3] +
      CachingByteArraySLAResourceResolver.java:30-54. Severity: LOW.
  - facet: read-collaborative-posture P-04 application — implicit ADR
    observed: |-
      The asymmetry — four reads unscoped, one write owner-scoped —
      is consistent with ADR-CANDIDATE-003 (read-collaborative
      catalog) applied symmetrically to P-04. The deliberate
      SecurityRule registration of ONLY the PUT (and not the four
      GETs) at `SecurityConstants.java:243-246` is the
      intent_anchor: a maintainer made the deliberate decision to
      add ONE rule, not five.
    expected: same (positive case-law)
    drift_class: read_collaborative_posture_p04_application
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T implicit_adrs[0] +
      SecurityConstants.java:243-246. Severity: N/A (positive
      case-law).
  - facet: aggregator-only pillar invariant — code-anchored
    observed: |-
      The controller exposes ZERO endpoints that execute tests,
      schedule test runs, or define test logic. Every endpoint reads
      or aggregates already-ingested test-result data via repository
      queries. The mutation (`setDataQATestSeverity`) modifies
      metadata on an existing test, not the test itself. This
      matches the load-bearing pillar constraint stated at
      `documentation/docs/data-quality.md:9` — 'Quality checks are
      not performed inside ODD Platform — the platform integrates
      with leading tools in the field and surfaces their results'.
    expected: same (positive case-law — the architectural shape is
      intentional and visible in the controller's bounded operation
      surface)
    drift_class: aggregator_only_pillar_invariant_code_anchored
    provenance: |-
      PRIMARY-SOURCE — DataQualityController batch T implicit_adrs[4] +
