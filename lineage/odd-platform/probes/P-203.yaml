expected_outcome: |
  Hypothesis under test (F-009 reflection H-011, verbatim):
  "When the text describing why an alert fired (the alert-chunk description, supplied by an
   upstream collector) contains Slack control sequences such as @channel or a fake link, the
   Slack message renders those as plain text — it does not broadcast-notify the whole channel
   or render an attacker-controlled clickable link."

  Predicted code behaviour (CONTRADICTS the hypothesis): the alert-chunk description is
  rendered into the Slack mrkdwn body via markdownText(...) at SlackMessageGenerator.java:77
  with NO escaping (MrkdwnUtils.java:1-14 exposes only bold(...) and buildLink(...) for
  platform-controlled strings; there is no escape(...) helper). Slack interprets @channel,
  @here, <!channel>, <!here>, *bold*, _italic_, and <url|text> as markup. AlertChunkPojo
  .description is populated from ingestion-side AlertActionResolverImpl.java:162 (upstream
  collector content — dbt test description, GE expectation string, schema-diff narrative).
  An upstream actor who controls a description string can broadcast-notify the entire Slack
  channel membership (@channel / <!here>) or inject a fake clickable link. The verdict in the
  reflection is `contradicted` (severity HIGH); this probe upgrades the STATIC finding to a
  runtime-confirmed regression-pin so a future fix (MrkdwnUtils.escape applied at
  SlackMessageGenerator.java:77 before markdownText) flips the assertion from "control
  sequence rendered as markup" to "control sequence rendered as inert text".

  The live doc (WebFetched 2026-06-01) now WARNS about this ("Slack notification bodies pass
  alert descriptions verbatim into Slack markdown — @channel, <!here>, and fake-link payloads
  render") — so the verdict routes to caveat-confirmed-but-bug-candidate, not a doc-gap.
  Cross-feature: this is the 6th surface of F-004's description-XSS family.
