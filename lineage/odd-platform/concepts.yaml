      overall: LOW
      auth_modes_relevant: []
      ingestion_filter_relevance: "N/A"
      authorization_consistency:
        verdict: "N/A"
        detail: "Config-key isolation surface. No HTTP gating; tenant isolation is by-label-convention at the metrics-storage layer."
      owner_scoping:
        verdict: BYPASSES
        detail: "Tenant identity is operator-config-supplied at startup, NOT user-scoped at request time. No server-side validation, no allowlist, no uniqueness check across ODD Platform instances sharing the same Prometheus."
      strengths:
        - "Live doc at `/configuration-and-deployment/odd-platform#prometheus-tenant-label-odd-tenant-id` documents the intent (shared-Prometheus multi-tenancy enabler)"
        - "Default empty (no label applied) is a sane default for single-tenant deployments"
      weaknesses:
        - "**Read/write tenant-id label asymmetry on empty-string (HIGH severity)** — Write side `AbstractTimeSeriesExtractor.java:60` uses `if (tenantId != null)`: an empty string PASSES the guard and writes a `tenant_id=\"\"` label. Read side `ExternalMetricReader.java:111` uses `StringUtils.isNotEmpty(tenantId)`: an empty string FAILS the guard and the read filter omits the tenant_id clause. Net: if an operator supplies `ODD_TENANT_ID=` (env var set to empty, NOT unset), every write goes to a series tagged `tenant_id=\"\"` but reads query across all tenants. In a shared-Prometheus multi-tenant deployment this either (a) buries this tenant's series under an unfilterable label that other tenants don't have, or (b) causes this tenant's reads to return series from co-tenants whose tenantId was null. (CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[0])"
        - "**Tenant isolation is by-label-convention, not enforcement (MEDIUM severity)** — no server-side validation that two ODD Platform deployments don't accidentally share the same `odd.tenant-id` against the same `metrics.prometheus-host`. Their series merge silently. Mid-life rebrand / typo correction makes historical series at the old label unreachable from `ExternalMetricReader` reads. (CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[1])"
        - "**No hot-reload** — `tenantId` is `@Value` constructor-injected once; Spring Cloud Config refresh would NOT propagate to live extractor instances. Platform restart required to change tenant. Severity LOW (CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[4])"
        - "**Shared-Prometheus tenant-isolation depends on operator-supplied tenant_id discipline (HIGH severity)** — combined with the empty-string asymmetry, the multi-tenant guarantee is brittle. Severity HIGH (CounterTimeSeriesExtractor@L20.md:security.known_security_gaps.[0])"
      cross_file_inconsistencies: []
