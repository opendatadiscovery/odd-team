proposed_action: |-
  Add `TagControllerSecurityTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `createTag_callerWithoutTagCreate_returns403` — caller holding only `DATA_ENTITY_TAGS_UPDATE`; `POST /api/tags`; assert 403.
  2. `updateTag_callerWithoutTagUpdate_returns403` — `PUT /api/tags/{id}`; assert 403.
  3. `deleteTag_callerWithoutTagDelete_returns403` — `DELETE /api/tags/{id}`; assert 403.
  4. `getPopularTagList_callerWithNoTagPermission_returns200WithFullDirectory_pinsOpenRead` — caller with NO `TAG_*`; `GET /api/tags`; assert 200 + items populated. PINS the intentional open-read posture.
  5. `tagEndpoints_unauthenticatedCaller_returns401Or302_underAuthenticatingMode` — no token; assert 401/302 on all four operations.

  Pair with REFACTOR-217 awareness: this test is the regression catcher for a `/api/tags` path rename that un-gates the writes. When such a rename is proposed, this test fails until the `SECURITY_RULES` entries are updated in lockstep.
