expected_outcome: |
  Stress question (Category E, the per-OR-branch guard at
  JooqFTSHelper.java:214-216): "Does the querytree() guard actually buy the
  index scan the comment claims it buys?"

  The guard's entire justification is a PLAN-level claim written in a comment:

    "A branch with no positive term (`-test`, and the subtle `<stop word> -test`)
     is not index-searchable -- Postgres falls back to a sequential scan of the
     entire search index -- and querytree() returns 'T' for exactly that shape."
     (JooqFTSHelper.java:208-211)

  The existing tests pin RESULTS, never PLANS: JooqFTSHelperTest.java:178-188
  asserts the generated SQL contains `querytree`, and
  AssetSearchServiceIntegrationTest.java:377-409 asserts the returned rows. Both
  would still pass if `querytree()` returned something other than 'T' for a
  negation-only branch on the deployed Postgres, because the fallback in that
  case is "the branch stays as written" — which returns the same (empty) row set
  by a much more expensive route.

  Three hypotheses this probe has not been able to confirm from the code:
    H1. `querytree(!! plainto_tsquery('test'))` renders as the literal 'T' on the
        Postgres version the platform actually ships against (the comment says it
        was measured on postgres:13.2-alpine; the shipped compose file may differ).
    H2. WITHOUT the guard, `search_vector @@ (!! plainto_tsquery('test'))` plans as
        a Seq Scan over the FTS entrypoint table.
    H3. WITH the guard, the same user query plans without a Seq Scan on that table,
        and the two-branch query `customer or -test` still uses the GIN index for
        the `customer` branch (the reason the guard is per-branch, not global).

  If H1 fails on the shipped Postgres, the guard is inert: every negation-only
  branch silently degrades to the sequential scan the guard exists to prevent, and
  no test in the repository would go red.
