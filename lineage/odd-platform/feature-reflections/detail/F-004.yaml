# Data entity description — Markdown content storage — product-owner reflection

## product_owner_narrative

**What the feature is.** Every data entity in the catalog (a dataset, a table, a job, a DEG, an ML
experiment) carries an operator-authored *description* — a free-text Markdown body that explains, in human
language, what the entity is for. This is the single richest annotation surface in Data Discovery: where a
tag is one word and a status is one enum, the description is the place an owner writes the paragraph a new
joiner reads first. Its audience is everyone — any authenticated user with `DATA_ENTITY_VIEW` on the entity
reads the rendered description on the entity's Overview tab (per `DataEntityDescription.md:understanding` +
`InternalDescriptionPreview.tsx:21`). Its authors are the entity's owners (or anyone an operator grants
`DATA_ENTITY_DESCRIPTION_UPDATE` to via a Policy, typically scoped `dataEntity:owner` — per
`upsertDataEntityInternalDescription.md:security.authorization_assertions`).

**How a user interacts with it.** On the entity Overview tab, the Description panel shows the rendered
Markdown; an Edit/Add button (gated by `DATA_ENTITY_DESCRIPTION_UPDATE`) opens an in-page Markdown editor
(`@uiw/react-md-editor`, with a live preview and spell-check); the user types Markdown, can link a glossary
term inline by writing `[[Namespace:TermName]]` (the syntax is surfaced only in an InformationIcon tooltip —
`InternalDescriptionHeader.tsx:22-28`), and saves via a Save button or the undocumented Shift+Enter shortcut
(`useTermWiki.ts:179-184`). The save fires `PUT /api/dataentities/{id}/description`; the body is stored
verbatim in `data_entity.internal_description` (Postgres `text`, unbounded — `V0_0_1__init.sql:80`), with the
sole transformation being empty→NULL normalisation (`ReactiveDataEntityRepositoryImpl.java:431`).

**The working parts.** A single description save fans out to *seven* side effects inside one reactive
transaction (per `upsertDataEntityInternalDescription.md:performance.hot_paths` +
`DataEntityServiceImpl.md:downstream_side_effects[F-004]`): (1) the `UPDATE data_entity` write; (2) a
full-entity FTS-vector rebuild (description indexed at weight `B` — `FTSConstants.java:40`); (3) a
`data_entity_filled.internal_description_filled` toggle; (4) a regex scan of the body for `[[ns:term]]`
mentions; (5) `term_relations` row create/remove for each mention (`is_description_link=TRUE`); (6) a
`DESCRIPTION_UPDATED` activity event; and (7) — when mentions are present — a SECOND
`TERM_ASSIGNMENT_UPDATED` activity event. The rendered description flows through the platform's *sole*
Markdown renderer (`Markdown.tsx:84-127`), which bundles `rehype-raw` and configures NO `rehype-sanitize`
(grep-verified 0 matches across the UI) — the feature's load-bearing security property.

**The integration story.** This feature sits at a crossroads of four pillars. It is anchored in **P-01 Data
Discovery** (entity-metadata authoring), but the description body is also (a) a write-path into **P-06 Data
Glossary** via the `[[ns:term]]` auto-link side-channel; (b) a content source for **P-07 Active Platform
Features** — the activity feed replays the verbatim old/new description text to any authenticated user
(`upsertDataEntityInternalDescription.md:security.data_exposure[1]`); and (c) gated by **P-09 Security &
Access Control** through `DATA_ENTITY_DESCRIPTION_UPDATE` and the four auth modes. The render component
(`Markdown.tsx`) is the single fix anchor for three of the six XSS-class surfaces in the F-004 family
(entity description + dataset-field description + term definition; per the ui-review-2026-05-26 facet).

**Edge cases a product owner would highlight in a demo.** Clearing a description (submitting empty) stores
NULL but echoes `""` back to the caller — the response reflects the request, not the DB
(`DataEntityServiceImpl.md:concepts.invariants[3]`). Editing a description that no longer exists (wrong/typoed
id) returns `200 OK` with an empty body — not `404` — and emits no activity event, so both the operator and
the auditor are blind to the wrong-id write
(`upsertDataEntityInternalDescription.md:bugs_limitations_corner_cases[1,6]`). A single edit that adds a term
mention produces TWO activity-feed rows at the same timestamp. And a malicious/careless writer can plant HTML
that reaches every reader's DOM (tags pass; event-handler attributes are stripped by React; script execution
is closed only by Chromium's HTML-parser policy — measured by probe P-009, not by the application).

