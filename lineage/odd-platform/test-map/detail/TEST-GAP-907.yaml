behaviour: |-
  **MEDIUM — `PUT /api/datasources/{data_source_id}/token` has two unverified error edges:
  (a) a non-existent `data_source_id` → 404 NotFoundException; (b) a data source whose
  `token_id` resolves to a missing/deleted `token` row → an OPAQUE HTTP 500 with no
  actionable message. The data-integrity edge (b) is the more interesting gap — the data
  source cannot have its token rotated and the error does not say why.** Method-level
  primary source from the batch-ZB `regenerateDataSourceToken` controller-method sidecar:

  - **404 path**: `DataSourceServiceImpl.regenerateDataSourceToken` (line 101) applies
    `.switchIfEmpty(Mono.error(new NotFoundException("Data source", id)))` — a non-existent
    `data_source_id` returns a clean 404 via `ControllerAdvice` (ControllerAdvice.java:30-34).
  - **500 path (the data-integrity edge)**: if the resolved data source's `token` is null
    (a `data_source` row whose `token_id` points at a missing or deleted token), then
    `tokenGenerator.regenerateToken(dto.token().tokenPojo())` first NPEs on `dto.token()`
    being null OR `TokenGeneratorImpl.regenerate` throws `RuntimeException("Token is null")`
    (TokenGeneratorImpl.java:45-47). Either way the operator gets an OPAQUE HTTP 500
    "Internal Server Error" (the catch-all `ControllerAdvice` handler at lines 61-66) with
    NO actionable message. `DataSourceServiceImpl.java:102` does `dto.token().tokenPojo()`
    with NO null guard on `dto.token()`.

  **Why MEDIUM**: the 404 path is a standard contract worth a regression pin. The 500 path
  is a genuine unguarded data-integrity edge — a data source can be left structurally
  un-rotatable and the operator gets no diagnostic. It is reachable: the platform's own
  delete path leaves orphan tokens (TEST-GAP-905), and a data_source with a dangling
  `token_id` is exactly the shape that triggers this 500. Neither edge is tested
  (Glob-verified — no `DataSourceControllerTest`, no `DataSourceServiceImplTest`, no
  `TokenGeneratorImplTest`). Not HIGH — the 500 is a degenerate-data edge, not a normal
  operational path, and produces no data loss or security breach; but the opaque error is
  an operator-experience defect worth pinning so a future maintainer adds a clear message.

  **Test gap shape**: (a) a unit/integration test asserting `PUT /api/datasources/999999/token`
  returns HTTP 404 (NotFoundException); (b) a UNIT test on `TokenGeneratorImpl.regenerateToken(null)`
  asserting it throws `RuntimeException("Token is null")`, plus a service/integration test
  seeding a `data_source` row whose `token_id` references no live token, then `PUT
  /api/datasources/{id}/token` and asserting HTTP 500 with the (currently opaque) body —
  PIN the current behaviour so a future maintainer who adds a clear 4xx + actionable
  message sees the test invert.
