behaviour: |-
  **CRITICAL — Per-entity-scoping bypass at `getDataSetStructureDiff`: a client calling `GET /api/datasets/{any_id}/structure/diff?first_version_id=A&second_version_id=B` where A and B belong to two DIFFERENT datasets receives a cross-dataset structural diff. The `data_entity_id` URL parameter is NOT enforced against the two `version_id` parameters at the SQL level.** Primary-source confirmed in batch-W DatasetController sidecar:

  **Persistence-tier evidence**:
  - `DatasetController.getDataSetStructureDiff` (lines 43-50): accepts `dataEntityId` from URL path; passes BOTH version ids to `datasetVersionService.getDatasetVersionDiff(dataEntityId, firstVersionId, secondVersionId)`.
  - `DatasetVersionServiceImpl.getDatasetVersionDiff` (lines 55-64): the `datasetId` argument is consumed ONLY by the identical-versions guard's error context — the SQL call ignores it.
  - `ReactiveDatasetVersionRepositoryImpl.getDatasetVersionWithFields` (lines 146-157): the WHERE clause at line 154 is `DATASET_VERSION.ID IN (firstVersionId, secondVersionId)` — NO `DATA_ENTITY.ID = datasetId` join condition.

  **Attack scenario**:
  ```
  # Attacker has authenticated access. Datasets A=100 (owned by team X) and B=200 (owned by team Y).
  # Attacker has NO ownership on EITHER.

  curl -X GET "https://platform/api/datasets/100/structure/diff?first_version_id=999&second_version_id=1001" \
       -H "Authorization: Bearer $TOKEN"

  # If version_id=999 belongs to dataset A and version_id=1001 belongs to dataset B:
  # The diff computation operates on the raw column lists keyed by oddrn.
  # Columns from dataset A compare by oddrn-mismatch with dataset B as DELETED+CREATED.
  # The response is a nonsensical-but-well-formed structural diff payload.
  ```

  **Blast radius**:
  - **Nonsensical-but-useful enumeration vector**: even when the diff is semantically meaningless (datasets A and B have unrelated schemas), the response carries information — a caller can PROVE which version_ids exist by observing the diff status fields (`CREATED` / `DELETED` / `NO_CHANGES` per `DataSetFieldDiffState`).
  - **Cross-tenant column enumeration**: the response includes the verbatim before/after snapshots of each column, including `internal_description` (the F-004 verbatim-description field), `internal_name`, tags, terms.
  - **Compound with TEST-GAP-767** (sister per-entity-scoping bypass at by-version): the two bypasses TOGETHER mean the entire catalog's dataset-structure history is readable to any authenticated user.

  **What the docs claim vs what the code enforces**:
  - Live `https://docs.opendatadiscovery.org/features/data-discovery` (status 200, 2026-05-20): describes "Dataset schema diff" as "visual side-by-side comparison of dataset schema revisions, with backwards-incompatible changes additionally raising an alert" — NO mention of who-can-view, no permission model, no owner-scoping commentary.
  - Live `https://docs.opendatadiscovery.org/developer-guides/api-reference` (status 200): NO `dataSet` sub-page; the diff endpoint is undocumented at the operator-facing API reference.

  **Why CRITICAL not HIGH (the sidecar's own rating)**:
  - The sidecar rates this HIGH. We elevate to CRITICAL because:
  - **Combined with TEST-GAP-767** (sister bypass at by-version): the TWO bypasses together cover the full surface of the controller's primary read endpoints. The blast radius is the entire catalog's column-level history.
  - **The diff payload INCLUDES `internal_description` verbatim** (the F-004 read-side surface — TEST-GAP-770). An attacker observing diffs can read every operator-supplied Markdown / HTML payload in the catalog.
  - **Useful even when nonsensical**: a defender's mental model "the diff is meaningless across unrelated datasets so an attacker gains nothing" is wrong — the response IS information (version_id existence proofs, column-level snapshots, oddrn enumeration).

  **Test gap shape**: regression-pin asserting: (a) `GET /api/datasets/{C}/structure/diff?first_version_id={A_version}&second_version_id={B_version}` returns HTTP 200 with a well-formed diff payload comparing A and B (NOT 404); (b) the response contains BOTH A's and B's `internal_description` / `internal_name` payloads verbatim; (c) the SQL WHERE clause is over `dataset_version.id IN (...)` only. The current state is PINNED — failures land if a future maintainer adds a `data_entity_id` WHERE clause.
