control_summary: |-
  0 of 12 cells PROBED. F-146 graduates SHB-001's data-entity-staleness
  thread to a real feature anchored on the SEARCH-RESULT-LIST UI render
  surface. The cross-surface coverage (10 UI consumers per SHB-001) is
  the OUTER scope; F-146 covers the search-list anchor specifically + the
  shared MetadataStale primitive + the shared DataEntityStaleDetector
  predicate. Sister F-NNN candidates for the other 9 UI consumers can
  cluster_with F-146 or share the same backend chain.

  Status: ui-incomplete. The UI half (ResultItem + MetadataStale) is
  resolved at primary source; the backend half (DataEntityStaleDetector +
  the 5 mapper-tier imprints) is anchored from SHB-001 evidence but no
  dedicated sidecar exists. The four canonical caveats (unset-config
  silent-default + never-ingested misleading + ingestion-forgery
  integrity + clock-skew flicker) inherit from SHB-001 — the predicate
  sidecar enrichment on next /enrich pass will resolve them to
  primary-source.

  Probe candidates: (P-shb001-1) **Unset-config silent-default pin** —
  bootstrap docker-compose ODD platform + Postgres + REMOVE
  odd.data-entity-stale-period from application.yml → seed entity with
  lastIngestedAt 30 days ago → GET /api/search/.../results → assert
  is_stale=false (PINS the LSN-001-class silent-default bug). (P-shb001-2)
  **Never-ingested edge pin** — create a Data Entity via manual UI
  (no Collector push) → GET search results → assert is_stale=false
  (PINS the "fresh-looking empty" surface). (P-shb001-3) **Threshold-
  boundary regression** — seed entities at threshold ± 1 second → 2
  sequential GETs on a 2-node cluster → assert no flicker (PINS the
  clock-skew gap).
