proposed_action: |-
  Two-assertion integration test using Testcontainers PG. **Assert A** — Spring-context test: `applicationContext.getBean(LockProvider.class)` is `instanceof JdbcTemplateLockProvider`. **Assert B** — Behavioural pin: declare a test-only `@SchedulerLock(name = "dbTimeProbeLock", lockAtMostFor = "PT10S")` method; sleep 1 second after first fire; query `SELECT lock_until - now() FROM shedlock WHERE name = 'dbTimeProbeLock'`; assert the delta is within `[8s, 10s]` (anchored to PG-time at acquisition). When the maintainer refactors LockProvider construction, both assertions break — forcing a deliberate re-validation of the clock-arbitration semantics.
