name: Manage Management-catalogue list (debounced-search + infinite-scroll + permission-gated mutation affordances)
canonical_in_docs: false
canonical_candidate: true
description: |-
  **NEW OPERATION CONCEPT, batch 2026-05-20-Q (PolicyList + RolesList
  + OwnersList + CollectorsList primary sources — 4-component
  shared shape)**. The canonical operator-facing read+mutate shape
  for every Management → {Collectors, Owners, Policies, Roles} tab
  in the platform.

  **The shape, in 7 elements**:

    1. **Default-mount fetch**: `useEffect(() => { if (!query)
       dispatch(fetchXList({page: 1, size})); }, [fetchXList, query])` —
       fires on mount AND whenever the search query is cleared. Each
       component hardcodes `size`: PolicyList 100, RolesList 100,
       OwnersList 100, CollectorsList 30.

    2. **Debounced search**: `useDebouncedCallback(() => dispatch(fetchXList({page:
       1, size, query})), 500)` at the user's keystroke handler.
       500ms trailing-edge debounce.

    3. **Enter-key bypasses debounce**: `handleKeyDown` triggers
       handleSearch immediately on Enter.

    4. **Infinite-scroll cursor pagination**: `<InfiniteScroll>`
       wrapper from `react-infinite-scroll-component` with
       `scrollThreshold='200px'`. `fetchNextPage` dispatches `page+1`
       when `hasNext === true`.

    5. **Permission-gated Create CTA**: `<WithPermissions
       permissionTo={Permission.X_CREATE}>` wraps the Create button.
       Returns null when permission absent (HIDE-not-DISABLE convention).

    6. **Permission-gated per-row Edit + Delete**: each list item
       (`PolicyItem` / `RoleItem` / `EditableOwnerItem` / `CollectorItem`)
       wraps its Edit affordance in `<WithPermissions
       permissionTo={Permission.X_UPDATE}>` and its Delete affordance
       in `<WithPermissions permissionTo={Permission.X_DELETE}>`.

    7. **Total-count subtitle frozen during search**: `useEffect(() =>
       { if (!query) setTotalXs(total) }, [total])` — local state
       shadows the slice's total so "N {Xs} overall" shows the
       catalogue size, not the filtered result size. Per the
       `OwnersList.bugs_limitations_corner_cases.[3]` finding, this
       is a deliberate ergonomic choice (consistent with the
       "overall" label) but the UX may mislead operators into thinking
       the search filtered nothing.

  **The shared safety properties**:
    - LSN-017 anti-pattern ABSENT (per the
      `lsn-017-doubling-anti-pattern-absent-in-management-list-components`
      positive invariant — verified across all 4 components)
    - LSN-001 silent-no-op pattern observable on PolicyList catalogue-
      vs-grant soft-delete asymmetry (per F-006 drift class)
    - Page-1 refetch on create/delete completion preserves search
      query: `if (!query) dispatch(fetchXList({page:1, size}))` — the
      search-aware guard prevents clobbering active filters

  **The shared hazards**:
    - All 4 components are FORENSICALLY SILENT — no audit log on any
      mutation (per the 7-sidecar `no-audit-log-on-rbac-mutations`
      pattern after this batch's UI tier addition)
    - All 4 components exhibit the UI-vs-API asymmetry under DISABLED
      (per the new `ui-vs-api-asymmetry-under-disabled-...` invariant)
    - OwnersList specifically reaches the destructive-empty-roles
      UPDATE hazard in 3 clicks (per the new
      `destructive-empty-roles-update-reachable-from-ui-three-clicks-no-confirmation`
      invariant)
    - CollectorsList specifically renders plaintext tokens into DOM +
      uses fragile substring-prefix-sniff masking (per the new
      `plaintext-token-rendered-into-dom-...` invariant)
    - PolicyList + RolesList specifically surface the catalogue-vs-
      grant soft-delete asymmetry (per the strengthened
      `rbac-soft-delete-persistence-role-policy-aggregation-...`
      invariant)

  **Cross-batch coherence (LSN-018)**: this operation catalogues the
  COMMON SHAPE that the 5 batch-Q sidecars all conform to. Future
  Management UI scans should consult this entry to know what the
  baseline pattern looks like + where the per-component hazards
  diverge from the baseline.
