name: Term-mention Syntax `[[Namespace:TermName]]`
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-06
- P-01
description: |-
  **NEW CONCEPT, batch 2026-05-19J** — the platform's UI-side inline
  term-mention syntax for linking Glossary terms from any Markdown body.
  The pattern `[[Namespace:TermName]]` is parsed by both the UI (via
  `TERM_PATTERN` regex at `lib/constants.ts:177` —
  `/\[\[([^:\]]+):([^\]]+)\]\]/g`) and the backend (via
  `Pattern.compile("\\[\\[([^:]*?):([^\\]]*?)\\]\\]")` at
  TermServiceImpl.java:67). **The UI regex is STRICTER than the backend
  regex**: UI requires non-empty namespace AND non-empty term-name
  (character class `[^:\]]+` forces ≥1 char excluding `:` and `]`);
  backend allows empty groups (non-greedy `*?` matches zero chars). A
  description like `[[:foo]]` or `[[foo:]]` is rendered verbatim in UI
  as raw text (no match) but the backend's `findTermsInDescription` still
  parses it (with empty group it short-circuits in
  `handleDataEntityDescriptionTerms`). The asymmetry is a latent
  inconsistency. **Operator-facing documentation is ONLY a tooltip** at
  InternalDescriptionHeader.tsx:22-25: "You can link an existing term by
  entering information about the term according to the pattern
  [[NamespaceName:TermName]]". No public doc page covers the syntax. The
  `useTermWiki` hook (useTermWiki.ts:30-228) is the UI-side parser +
  resolver: scans both persisted description and in-progress editor value;
  resolves each match against
  `GET /api/terms/namespaces/{namespaceName}/names/{termName}`; replaces
  matches with `[name](termPath "definition")` Markdown links on render.
  Failed resolution shows inline error `'Term {termName} not found in
  namespace {namespaceName}'`. **Save does NOT block on unresolved
  mentions** — operators can save descriptions containing broken term
  mentions; the backend silently drops them in
  handleDataEntityDescriptionTerms. **Side effect: mentioning a term
  auto-creates a `term_relations` row regardless of `DATA_ENTITY_ADD_TERM`
  permission** — DATA_ENTITY_DESCRIPTION_UPDATE bypasses
  DATA_ENTITY_ADD_TERM via [[ns:term]] mentions (per batch-G
  upsertDataEntityInternalDescription.md:bugs_limitations_corner_cases.[3]).
  **STRENGTHENED batch 2026-05-19K** — TermServiceImpl primary-source
  pinned at the SERVICE LAYER:
    - The regex compile site is now PRIMARY-SOURCE pinned to
      `TermServiceImpl.java:67` (static-final Pattern, compiled once at
      class load; per-call cost is the regex match O(N))
    - The auto-link reconciliation runtime is `handleDataEntityDescriptionTerms`
      at TermServiceImpl.java:201-207 + `updateDataEntityDescriptionTermsState`
      at lines 362-389
    - Forward-compat side-effect: mentions for non-existent terms are NOT
      silently dropped; staged in `data_entity_description_unhandled_term`
      table via `buildDataEntityUnknownTerms` at lines 501-512; when
      matching term is later created, `resolveUnhandledDescriptionMentions`
      at lines 421-442 materialises the link row automatically
    - Description-mention guard: a term CANNOT be renamed or deleted
      while any active description mentions it (HTTP 400
      BadUserRequestException "Can't update/delete term, which was
      mentioned in description"); the guard filters parent status != DELETED
    - Bonus latent bug: backend regex has NO escaping for nested or
      escaped brackets — `[[foo[bar]:baz]]` matches `[foo[bar]:baz]`
      against the FIRST inner `]]`-like pattern, producing unexpected
      term lookups
