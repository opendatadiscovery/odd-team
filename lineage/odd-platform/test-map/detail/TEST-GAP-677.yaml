behaviour: |-
  **The most load-bearing read shape — `getLastVersionDatasetFieldsByOddrns` — has ZERO test coverage.** Lines 92-113 use a window-function CTE: `MAX(DATASET_VERSION.VERSION).OVER(PARTITION BY DATASET_FIELD.ODDRN).AS(maxVersion)` to pick "the dataset_field row that belongs to the most recent dataset_version for each oddrn". The result drives the UPDATE-vs-INSERT decision in `DatasetFieldServiceImpl.buildDatasetFieldIngestionDto` (lines 375-396) for EVERY ingestion request containing dataset entities — called from BOTH `DatasetStructureIngestionRequestProcessor` (via `DatasetFieldServiceImpl.createOrUpdateDatasetFields` line 141) AND `DatasetFieldMetadataIngestionServiceImpl.ingestMetadata` (line 47). If the window function or the `version = max_version` filter returns a non-maximal row (due to a future jOOQ planner change, a Postgres version upgrade, or a maintainer's refactor), every subsequent UPDATE-vs-INSERT decision is skewed, leading to silent orphan-row creation OR in-place edits of the WRONG historical version. **Severity: HIGH because the failure mode is silent data corruption in the dataset_structure / dataset_field relationship — no exception, no log, no alert.** Partition-batching at 1000 oddrns adds further untested complexity: the same oddrn appearing twice across batches would receive TWO separate CTE evaluations.
