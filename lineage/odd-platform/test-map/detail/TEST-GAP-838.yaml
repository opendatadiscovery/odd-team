behaviour: |-
  **HIGH — REFACTOR-229 UI-side FTS injection on the typed search-query text. The third invocation site of the same architectural gap — batch H (getHighlightedResult) + batch M (facet aggregators) + batch ZA (Search.tsx UI-side dispatch).** MainSearchInput.tsx:42-44 builds `searchFormData = { query, pageSize: 30, filters: {} }` and dispatches verbatim. Server-side `JooqFTSHelper.tsQuery` at `JooqFTSHelper.java:164-168` performs `plainQuery.split(' ').map(q -> q + ':*').join('&')` — **NO escaping of tsquery metacharacters** (`!`, `(`, `)`, `:`, `<->`, `&`, `|`, `'`, `\`).

  A typed query of `foo ) | (bar` reaches `to_tsquery(?)` and Postgres raises `42601 syntax error in tsquery`. The session UUID is then **permanently poisoned**: every subsequent facet read (`GET /api/search/{poisoned_uuid}/facet/{any}`) 500s per batch-M SearchController.facets sidecar bugs[4] + REFACTOR-229 strengthening (batch M).

  **The UI offers ZERO mitigation** — no max-length, no metacharacter filter, no client-side `to_tsquery` validation. Search.tsx accepts arbitrary text from MainSearchInput and submits it as-is. **Combined with REFACTOR-344** (no user binding on `search_facets` row), the poisoned UUID can be shared as a denial-of-service vector — a malicious caller can poison a UUID, share it in a Slack channel, and break every recipient's facet reads.

  **Why HIGH (security + availability)**:
  - **Security**: Reflected operator-controlled text reaches database query language without sanitisation. The class is SQL-injection-adjacent (the metacharacters are tsquery-specific, not generic SQL, but the structural cause — unescaped operator-controlled text in DB query layer — is the same).
  - **Availability**: Poisoned UUIDs DoS every subsequent facet read on the session. With session-sharing patterns (Slack-linked filtered Catalog views), the DoS propagates by sharing.

  **Test gap shape**: TWO surfaces:
  1. **Unit test on Search.tsx** asserting that a typed query containing tsquery metacharacters is REJECTED at the UI before dispatch (the fix point — currently the UI accepts it and the test PINS the unmitigated bypass).
  2. **Integration test** asserting that submitting a poisoned query results in a backend 500 AND the UI surfaces an error message (currently the UI does NOT surface the failure — bugs section[7]).

  The architectural fix point is the BACKEND (`JooqFTSHelper.tsQuery` — single source of truth for the FTS-escape). But UI-side defense-in-depth is the natural complement: the operator typing `foo ) | (bar` should see a "invalid characters in search query" prompt at the input field, not silently submit and get a frozen broken Catalog page.
