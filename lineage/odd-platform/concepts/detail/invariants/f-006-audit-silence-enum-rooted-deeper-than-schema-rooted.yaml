mitigations_unimplemented:
  - |-
    Coordinated enum + schema extension (the five-layer scope):
      (1) Add enum values TERM_CREATED, TERM_UPDATED, TERM_DELETED,
          TERM_DESCRIPTION_UPDATED, TERM_TAGS_UPDATED, NAMESPACE_CREATED,
          NAMESPACE_DELETED, TAG_CREATED, TAG_DELETED, POLICY_CREATED,
          POLICY_UPDATED, POLICY_DELETED, ROLE_CREATED, ROLE_UPDATED,
          ROLE_DELETED, OWNER_CREATED, OWNER_UPDATED, OWNER_DELETED,
          COLLECTOR_TOKEN_REGENERATED, DATASOURCE_REGISTERED, etc. to
          ActivityEventTypeDto.java + components.yaml.
      (2) Schema migration — make activity.data_entity_id NULLABLE +
          add an event_scope discriminator column (DATA_ENTITY / RBAC /
          DATASOURCE / COLLECTOR / TERM / NAMESPACE / TAG).
      (3) Service-tier @ActivityLog annotations on the 6 unannotated
          TermServiceImpl methods plus the analogous RBAC + Owner +
          Datasource methods.
      (4) Read-path queries reshaped to handle the optional FK; the
          existing INNER JOIN to data_entity at
          ReactiveActivityRepositoryImpl.java:219 becomes a conditional
          LEFT JOIN.
      (5) UI Activity Feed extended to render non-data-entity events
          (the global Activity Feed page + the per-entity tab).
  - |-
    Alternative: separate audit surface (catalog_audit table) with its
    own FK shape — avoids breaking the existing INNER JOIN read path
    but means TWO audit surfaces and the operator-facing Activity Feed
    UI needs to merge them.
  - |-
    Document the silent-by-structure framing on the
    /features/active-platform-features/activity-feed live doc page —
    operators reading the page currently see 'every platform change is
    audited' implicit framing; the explicit framing is 'the Activity
    Feed records data-entity-scoped events; non-data-entity events
    (term/tag/namespace/RBAC mutations) are NOT recorded by design.'
  - |-
    Add a build-time invariant scanner that flags any @ActivityLog
    annotation referencing an enum value that does not exist in
    ActivityEventTypeDto. (Currently the compile fails — but the
    scanner catches the failure earlier and with a clearer message.)
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20U from the
  TermServiceImpl sidecar's primary-source Grep verification across
  ActivityEventTypeDto.java + the TermServiceImpl @ActivityLog
  presence/absence audit. This invariant DEEPENS the batch-R schema-rooted
  root cause by surfacing the second structural barrier at the enum
  type layer.

  The combined 5-layer F-006 audit silence model explains why the
  audit-coverage gap for Term + Tag + Namespace + RBAC + Datasource +
  Collector lifecycle is NOT a maintenance follow-up. It is a coordinated
  architectural decision touching enum + schema + service-tier +
  repository + UI tiers simultaneously.

  Cross-cutting connections:
    - DEEPENS the batch-R schema-rooted invariant
      (f-006-audit-silence-schema-rooted-data-entity-id-not-null-fk)
      with the enum-type-layer evidence
    - DEEPENS the batch-S 9-sidecar pattern invariant
      (f-006-audit-silence-batch-s-9-sidecar-pattern-extension) with
      the type-layer root cause that explains why the 9 sidecars all
      cluster around the same architectural gap
    - Pairs with activity-event-enum-20-named-plus-7-categorical-equals-27
      (batch T) — the 27-value enum CARDINALITY is now augmented with
      the MISSING-VALUES list at the structural-barrier layer
    - Pairs with audit-silence-applies-at-webhook-ingress-not-state-transitions
      (batch S) — the Alert ingress audit gap is at the INGRESS-event-shape
      layer; this enum-rooted gap is at the TYPE-VALUES layer; two
      different audit-gap shapes within the same overall pattern

  Three DOC-NNN candidates flow from this invariant:
    (a) Five-layer remediation — coordinated work at enum + schema +
        service + repo + UI tiers
    (b) Doc admission — disclose on /features/active-platform-features/activity-feed
        that the audit surface is data-entity-scoped by design
    (c) Build-time scanner — invariant check for @ActivityLog enum
        value existence
