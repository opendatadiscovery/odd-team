name: Replace-All Term Tag Relations (term-side, no external carve-out)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-06
  - P-01
  - P-09
description: |-
  NEW OPERATION, batch X-TAGGING (2026-05-21) — captures
  `PUT /api/terms/{term_id}/tags` (operationId `createTermTagsRelations`)
  at the operation-concept level. This is the TERM-side member of the
  tag-relation write trio; it is a DISTINCT operation from the existing
  `upsert-internal-tag-relations-replace-all` concept (which is the
  DATA-ENTITY-side path) and from `replace-internal-dataset-field-tag-relations`
  (the dataset-field-side path). The three share the auto-create-on-miss
  side-door but differ materially in cascade scope, audit emission, and
  external-tag handling — they are kept as separate concepts.

  THE ENDPOINT:
    PUT /api/terms/{term_id}/tags -> HTTP 200, Flux<Tag>.
    Gated by the DEDICATED TERM_TAGS_UPDATE permission (NOT TERM_UPDATE),
    resolved per-term through the TERM AuthorizationManagerType, via
    SecurityConstants.SECURITY_RULES at SecurityConstants.java:185-186.

  THE CHAIN — replace-all, despite the create*-shaped operationId:
    TermController.createTermTagsRelations (TermController.java:129-136)
    — 5-line reactive handler reading Mono<TagsFormData>.
    -> TermServiceImpl.upsertTags (TermServiceImpl.java:254-264,
       @ReactiveTransactional) — two-phase delete-then-recreate:
       Phase 1: tagService.deleteRelationsWithTerm(termId, names)
                (TagServiceImpl.java:124-134) — reads CURRENT term tags
                via listByTerm, computes idsToDelete = currentTags whose
                NAME is absent from the submitted tag_name_list, and
                HARD-deletes those tag_to_term rows.
       Phase 2: getOrCreateTagsByName auto-creates any submitted name
                not in the global tag directory, then createRelationsWithTerm
                (re)inserts tag_to_term rows for the full submitted set
                with onDuplicateKeyIgnore.
       Phase 3: termSearchEntrypointRepository.updateTagVectorsForTerm
                refreshes the term search vector.

  TWO MATERIAL DIVERGENCES FROM THE DATA-ENTITY SIBLING:
    Divergence 1 — NO activity-feed event: there is no @ActivityLog
    anywhere on the upsertTags chain. The data-entity tag path emits
    TAG_ASSIGNMENT_UPDATED; sibling term mutations (linkTermWithDataEntity,
    removeTermFromDataEntity) emit TERM_ASSIGNMENT_UPDATED. The absence
    on the term-tag path is asymmetric WITHIN TermServiceImpl itself —
    most likely an oversight. See the new `term-tag-relation-has-no-external-carve-out`
    invariant + the F-006 audit-silence invariant.
    Divergence 2 — NO external/internal tag distinction: tag_to_term
    has no `external` column and no `origin` column
    (V0_0_35__add_terms.sql:18-28). Unlike tag_to_data_entity (which
    carries `external`) and tag_to_dataset_field (which carries
    `ORIGIN`), the replace-all diff has NO ingested-tag carve-out and
    removes EVERY tag relation not in the submitted list — there is no
    Collector-set set to preserve, because terms are a UI/API-authored
    concept with no ingestion-side tagging path.

  THE NAME-VS-BEHAVIOUR DRIFT (DRIFT_INPUT_NAME_VS_IMPLEMENTATION):
    The operationId (`createTermTagsRelations`), the OpenAPI summary
    (`Creates tags relations for term`, openapi.yaml:3185), and the
    body field name (`tag_name_list`) all promise an ADDITIVE create.
    The implementation treats the SAME list as an EXHAUSTIVE replace-all
    set (the TagService parameter is even renamed to `tagsToKeep`). An
    EMPTY list `[]` is a valid request body (no `minItems`) and silently
    clears ALL term tags. Pinned by probe P-027.

