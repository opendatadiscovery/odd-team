terminal_side_effect:
  side_effect_class: external-call
  description: |-
    Outbound HTTP POST to `{genai.url}/query_data` with JSON body
    `{"question": <user-supplied verbatim text>}`. Runs on the platform's
    egress identity (no Authorization header attached; operator must
    enforce network-layer controls). Single attempt per inbound call —
    no retry, no exponential backoff, no circuit breaker. Response is
    quote-trimmed + JSON-unescaped and returned to the caller as
    GenAIResponse.body.
  evidence: |-
    GenAIServiceImpl.java:41-47 (the outbound POST + response unwrap).
    WebClientConfiguration.java:26-29 (the baseUrl-only WebClient builder).
    On disabled (`genai.enabled=false`), service short-circuits at line 37
    with HTTP 400 BadUserRequestException — no outbound call fires.
  cardinality_per_call: |-
    1 outbound POST per inbound request when genai.enabled=true; 0 when
    disabled (BadUserRequestException at service tier). No retry, no
    parallel calls, no fan-out — the operation is single-shot.
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC-INFERRED HIGH. Each `POST /api/genai/ask` produces exactly ONE
  outbound POST to `{genai.url}/query_data` on the enabled path; ZERO
  outbound calls on the disabled path (service-tier short-circuit at HTTP
  400). The cardinality is constant by construction — there is no retry
  loop, no fan-out, no parallel sub-call, no response polling. The hop-by-hop
  product is 1 × 1 × 1 × 1 = 1. The hot-path observation is at the OUTBOUND
  layer (operator's external LLM cost) not at the platform layer — N replicas
  behind a load balancer multiply effective rate by N because there is no
  cross-instance rate limit or shared cache.
observed_vs_expected:
  facets:
  - facet: |-
      Any authenticated user can call /api/genai/ask and drive cost on the
      operator's external LLM account
    observed: |-
      GenAIController.java:13-24 has NO @PreAuthorize; PolicyPermissionDto
      has no GENAI_USE Permission (grep over PolicyPermissionDto.java for
      `GENAI` returns zero matches at commit 4ec2b20); SecurityConstants.SECURITY_RULES
      has no entry for `/api/genai/**` (grep over SecurityConstants.java:98-355
      returns zero matches). The endpoint falls through to AuthorizationCustomizer.java:29-30
      `.pathMatchers("/**").authenticated()` under OAUTH2/LDAP, and
      LoginFormSecurityConfiguration.java:57 `.pathMatchers("/**").authenticated()`
      under LOGIN_FORM (since `/api/genai/ask` is not in `permittedPaths`
      at lines 49-51). Three of four auth modes require authentication
      only — no Permission, no Role, no owner scope — and the fourth
      (DISABLED) requires nothing.
    expected: |-
      Either (a) introduce a `GENAI_USE` Permission gating the endpoint,
      OR (b) the live feature page disclosures the any-authenticated-user
      reach explicitly so operators know any read-only viewer can drive
      external-LLM cost.
    drift_class: free_text_proxy_no_authorization_no_audit_no_rate_limit_no_pii_redaction
    provenance: |-
