proposed_action: |-
  Add `DataEntityRunPageSizeBoundsTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `getRuns_sizeOneMillion_acceptedVerbatim_pinsUnboundedDoSSurface` — GET `?page=1&size=1000000` against a DQ-test entity (seed with 5 runs); assert HTTP 200 with items.size()=5 (because there are only 5 runs) + measure response latency. PIN the no-cap posture — the SQL accepts the LIMIT, returns what exists, no rejection.
  2. `getRuns_sizeZero_observedBehaviour_pinsCurrentBoundaryBehaviour` — GET `?page=1&size=0`; capture observed behaviour (likely HTTP 200 with empty items OR 400 from JOOQ). PIN the lower-bound posture.
  3. `getRuns_sizeNegative_observedBehaviour_pinsCurrentBoundaryBehaviour` — GET `?page=1&size=-1`; capture observed behaviour (likely 500 from JOOQ NegativeArraySizeException or similar). PIN the negative-size posture.

  Pair with REFACTOR-NNN: add `maximum: 1000` to `SizeParam` definition in `components.yaml`; flip test 1 to assert HTTP 400 "size exceeds maximum 1000". Pair with DOC-NNN: document the per-endpoint max in the live data-quality / API reference.
