realism_caveats: |
  Route interception simulates a backend that 500s POST /api/search while the rest
  of the stack stays healthy — a partial-outage shape (e.g. search_facets table
  lock/exhaustion) rather than a full platform outage. The probe does NOT verify
  the loop under real backend failure modes (DB down would also fail the selectors'
  other fetches), nor the production-build React behaviour vs dev StrictMode
  (run against the production UI bundle, as odd-minimal serves it, to avoid
  dev-double-mount noise). Rate assertions are machine-dependent; >=5 in 10s is a
  conservative floor for a localhost round-trip.
