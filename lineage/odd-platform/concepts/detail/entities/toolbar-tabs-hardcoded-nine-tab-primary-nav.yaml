security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      No @PreAuthorize-equivalent; no programmatic permission check;
      no Role / Permission read. Grep verification: 0 matches for
      `usePermissions|getGlobalPermissions|hasGlobalPermission|Permission\.`
      inside the AppToolbar subtree. Tab visibility is structurally
      unconditional.
  owner_scoping:
    verdict: 'N/A'
    detail: |-
      Code is not data-scoped. The widget renders 9 hard-coded labels
      + their route helpers; no data-entity lookups, no per-owner
      filtering, no PII exposure.
  strengths:
    - 'The hard-coded shape IS resistant to per-user metadata-tampering attacks (no input flows from the network into the tab-list construction)'
    - 'Stress-finding analysis returns 14/17 STATIC-INFERRED answers — the widget shape is fully analysable without runtime'
  weaknesses:
    - 'Tab visibility is structurally unconditional — READ_ONLY users see the Management tab the same as ADMIN. Discovery affordance leaked to every authenticated user (MEDIUM)'
    - 'Tab visibility does NOT participate in Active Features — WithFeature exists but is NEVER used to wrap any tab. Operator disabling a backend feature does not auto-hide the corresponding tab (LOW)'
    - 'Selected-tab heuristic is substring-match — structurally fragile against future route renames (LOW)'
    - 'Catalog + Dictionary click handlers .unwrap().then() with no .catch() — silent failure on a primary nav action if backend rejects (MEDIUM)'
  cross_file_inconsistencies: []
  contributing_files:
    - 'odd-platform__ts__components_shared_elements_AppToolbar_ToolbarTabs__ui-shell-widget__ToolbarTabs.md'
  evidence:
    - 'ToolbarTabs.md:security.known_security_gaps.[0,1]'
    - 'ToolbarTabs.md:bugs_limitations_corner_cases.[0,2,5,8]'
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'useEffect at lines 86-105 runs on EVERY pathname change — substring scan over all 9 tabs. With 9 tabs cost is trivial (9 string includes); scales poorly if tabs grew to dozens.'
    - 'useMemo at lines 34-82 rebuilds the tabs array whenever activityQueryString or t changes — both can be referentially unstable. Each rebuild creates 9 new object literals — minor GC pressure.'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: 'Stateless per-render — no batching, no streaming.'
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless component — instances scale per-tab not per-user.
      Selected-tab state lives in the component, not in Redux, so
      reload resets selectedness (then re-derives from URL via the
      useEffect).
  strengths:
    - '9 object literals + 1 numeric state + 1 effect — negligible'
  weaknesses:
    - 'useMemo dep array includes the entire t translation function (referentially unstable across i18next re-inits) AND activityQueryString — the tabs array can be rebuilt more often than strictly necessary (LOW)'
    - 'Each Catalog tab click produces an unconditional INSERT into search_facets — orphan rows until 30-day TTL reaper. Frequent tab-switching accumulates housekeeping work (LOW)'
  cross_file_inconsistencies: []
  contributing_files:
    - 'odd-platform__ts__components_shared_elements_AppToolbar_ToolbarTabs__ui-shell-widget__ToolbarTabs.md'
  evidence:
    - 'ToolbarTabs.md:performance.hot_paths'
    - 'ToolbarTabs.md:performance.known_performance_gaps.[0]'
