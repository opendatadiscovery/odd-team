behaviour: |-
  **`getTitleList(page, size, query)` controller and service `list` path
  has ZERO direct test coverage — only the lower-level repository CRUD
  is exercised (TitlesRepositoryImplTest), and the Ownership test covers
  the auto-create write side-effect (`getOrCreate`), NOT the read.** A
  regression that broke the ORDER BY id ASC contract, the soft-delete
  filter (deleted_at IS NULL), OR the case-insensitive substring filter
  semantics would land silently.

  The implicit contract:
  (a) Order: `id ASC` at the OUTER select (insertion order; bigserial PK
  → unique deterministic; the autocomplete shows oldest titles first).
  This is operator-surprising — operators expecting alphabetical or
  relevance-ranked ordering are wrong. Pin the ID-ASC contract before
  someone "improves" it to alphabetical and breaks 30+ downstream
  autocomplete consumers.
  (b) `query` filter: case-insensitive substring containment
  (`LOWER(name) LIKE LOWER('%query%')`). Empty/null returns ALL
  non-deleted titles. Typing 'data' returns 'Data Steward' AND
  'Metadata Owner' (both substring matches), ordered by id ASC. This
  is NOT prefix-match priority and NOT FTS — operators expecting
  prefix-priority get noisy results.
  (c) Soft-delete: titles with deleted_at IS NOT NULL are filtered out.

  No test pins any of these. The TitlesRepositoryImplTest covers
  create/update/delete/getByName CRUD but NOT the paginated list
  contract.
