behaviour: |-
  **HIGH — TermSearch's `useDebouncedCallback(...)` is recreated every render, so the 1500ms debouncer never coalesces multiple facet-change events.** Sidecar reasoning (verified from static reading per LSN-017 measurement-truth principle, with live probe recommended for confirmation):

  The component at `TermSearch.tsx:50-64` declares a `useDebouncedCallback` to debounce dispatching `updateTermSearch` to the server. The `useCallback` wrapping the debouncer reads `termSearchFacetParams` and `termSearchQuery` from Redux — closures over per-render values. When the user clicks a facet, the slice updates `termSearchFacetParams` → the component re-renders → `useDebouncedCallback` returns a NEW debounced function with the new closure → the previous debouncer's pending invocation is discarded → the new debouncer fires the dispatch immediately on the next render.

  **Net behaviour**: instead of "1500ms after last facet-change, fire ONE coalesced PUT", the actual behaviour is "every facet-change fires a fresh PUT immediately". For a user clicking 5 facets in rapid succession (typical UX pattern when narrowing a search), the server sees 5 separate PUTs instead of 1.

  **Compound cost**: each PUT runs through `TermController.updateTermSearchFacets` → `TermSearchService.updateFacets` which hits Postgres to rewrite the session row's facet state. 5× the DB writes for the same logical user intent. On a heavily-used Dictionary tab during operator curation, this multiplies into hundreds of unnecessary PUTs per session.

  **Test gap shape**: a unit test that mounts `<TermSearch/>`, simulates 5 rapid facet-changes within a 2-second window, and asserts the count of `PUT /api/termsearch/{searchId}` calls. If the debouncer were working, count == 1 (or 2 with leading-edge — depending on `useDebouncedCallback`'s configuration); if the bug stands, count == 5 (one per facet-change).

  **Why HIGH not MEDIUM**: this is one of TWO LSN-017-class dep-array smells in this single sidecar (the other being `termSearchFacetsSynced` read in condition but missing from useEffect deps at lines 66-68 — a latent regression-vector). The bug is currently MASKED in normal operator usage (a single facet-click works fine because the 1500ms window doesn't matter for one event), and surfaces only at burst-click frequency. Without a regression-pin, a future maintainer "optimising" the dep array of the facet-sync useEffect or the `useCallback` wrapping could either: (a) accidentally fix the bug (silent behavioural change — operators report "search facets feel different now"); or (b) make it worse by introducing additional re-renders that fire PUTs even outside the debouncer's intended window. Either case lands undetected without a test gate.

  **Sister LSN-017 class but NOT identical**: LSN-017 canonical is a useEffect dep array doubling the firing of a side-effect. This is a `useCallback` dep array that re-creates a debounced function on every render — same root class (dep-array semantics) but different symptom (debouncer ineffective rather than effect double-fire). Per the sidecar's coherence_check section, this is a NEW sibling under the LSN-017 umbrella that LSN-017's canonical doc-page would benefit from cross-referencing.
