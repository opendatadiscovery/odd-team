behaviour: 'Datasource-without-token fallback to collector token: when the datasource
  has `token_id IS NULL`, the filter looks up the parent collector''s token (IngestionDataEntitiesFilter.java:50-51)
  and validates against it. The collector-fallback path is unique to this filter;
  a regression that broke the fallback would force every operator to migrate to per-datasource
  tokens silently.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ingestion/IngestionFilterCollectorFallbackTest.java
  name: ingestionEntities_datasourceTokenNull_collectorTokenValidated
evidence:
- 'IngestionDataEntitiesFilter@L20.md says: ''when the datasource has token_id IS
  NULL, the filter looks up the parent collector''s token from collectorRepository.getDto(...)'''
cross_references:
- concepts.yaml:entities[Ingestion Filter]
proposed_action: 'Add integration test: seed datasource with `token_id IS NULL`, parent
  collector with a valid token; assert (collector''s bearer → 2xx, wrong bearer →
  401). Pair with a negative: collector also missing → `NotFoundException("collector",
  id)` → 5xx (misleading status code, sidecar''s bugs_limitations_corner_cases.[4]).'
