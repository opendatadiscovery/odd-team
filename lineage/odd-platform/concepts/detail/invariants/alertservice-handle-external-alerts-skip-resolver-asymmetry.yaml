notes: |
  This invariant is the SERVICE-TIER vertex of the F-007 triangulation:
    - HTTP / controller (batch P) — method signature carries no idempotency-key
      path; receiver is AlertManager-shape-driven and silent on retries.
    - SERVICE (this invariant, batch S) — handleExternalAlerts skips the
      AlertActionResolver that applyAlertActions uses.
    - SQL / repository (batch H) — createAlerts is bulk INSERT with no ON CONFLICT.

  End-to-end (HTTP → service → SQL): all three layers tolerate duplicates.
  The audit refinement (batch R + batch S correction) narrows the F-007 gap
  to INGRESS ONLY — the resulting alert-state-transitions are audited via the
  batch activity-feed save path; reconstruction of "what state changed when"
  is possible, but reconstruction of "who POSTed which webhook payload when"
  requires external network-tier logs.

  Recommended cleanup:
    (a) Doc: extend `/configuration-and-deployment/odd-platform#prometheus-alertmanager-integration`
        with an "Idempotency" subsection: "AlertManager retries (on transient
        network errors) produce duplicate alerts. Configure AlertManager's
        `repeat_interval` and `group_wait` accordingly. Resulting alert-state
        transitions ARE recorded in the activity feed; the webhook ingress
        itself is not audited."
    (b) Code: add a DB-level partial unique index on (data_entity_oddrn, type,
        labels_hash) WHERE status = OPEN AND deleted_at IS NULL — closes the
        gap at the persistence layer; cheaper than re-routing the webhook
        path through AlertActionResolver.
    (c) Code: route handleExternalAlerts through AlertActionResolver — closes
        the gap at the service layer but adds the snapshot-read cost to every
        AlertManager webhook call. Likely-acceptable trade-off given low
        webhook frequency.

  Cross-references:
