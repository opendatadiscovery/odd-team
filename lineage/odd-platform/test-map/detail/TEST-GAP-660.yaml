behaviour: |-
  **SQL-TIER PRIMARY-SOURCE: collector tokens are stored as 40-char alphanumeric plaintext in `token.value varchar(40) NOT NULL`** (V0_0_28__add_token.sql:1-9) with NO hashing (TokenGeneratorImpl.java:34-42 writes `RandomStringUtils.randomAlphanumeric(40)` verbatim) and NO UNIQUE constraint at the SQL layer. `ReactiveCollectorRepositoryImpl.getByToken(token)` (line 89-97) issues `SELECT collector.* FROM collector JOIN token ON token.id = collector.token_id WHERE token.value = $1 AND collector.deleted_at IS NULL` — a parameterised plaintext-equality match. This is the SQL-tier substrate consumed by the ALWAYS-ON `IngestionDataSourceFilter` (IngestionDataSourceFilter.java:33, no `@ConditionalOnProperty`) and the opt-in `IngestionDataEntitiesFilter` (IngestionDataEntitiesFilter.java:55-58 with `tokenPojo.getValue().equals(token)`). A DB-side reader (replica, backup, pg_dump operator, jOOQ log leak, application log leak via DEBUG-level R2DBC bind logging) recovers every live collector credential in clear text. STRENGTHENS TEST-GAP-613 (filter-class plaintext-equality pin) with the REPOSITORY-LAYER SQL anchor + the always-on filter coupling + the storage-at-rest implication. The full plaintext-everywhere chain spans (1) TokenGeneratorImpl write → (2) ReactiveTokenRepositoryImpl persistence → (3) THIS repository's SQL-layer equality match → (4) IngestionDataSourceFilter always-on consumption + IngestionDataEntitiesFilter opt-in consumption. No test pins the full stack; the gap is the cross-layer integration regression-pin that would catch a partial fix (e.g. someone hashing at the write layer but leaving the read layer to plaintext-compare, OR vice versa).
test_files_existing:
  - "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/CollectorRepositoryImplTest.java (covers getByToken happy path only — does NOT pin storage shape or constraint absence)"
