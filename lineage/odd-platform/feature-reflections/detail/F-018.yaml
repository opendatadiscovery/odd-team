- id: H-009
  hypothesis: |
    "When an operator deletes a tag, it is removed cleanly — its assignments disappear from every
    surface (entities, dataset fields, terms) and the tag name stops appearing in full-text
    search results."
  derivation: |
    TAG_DELETE is documented as "Remove tags from vocabulary"; a user expects delete to be
    complete and consistent. Pillar promise + negative-space (clean teardown).
  seed_source: pillar + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The delete is DOUBLY asymmetric and leaves debris. TagServiceImpl.delete (:57-70,
      @ReactiveTransactional) soft-deletes the tag row but HARD-deletes only tag_to_term and
      tag_to_data_entity via Flux.zip (:64-65); tag_to_dataset_field is NEVER touched
      (deleteDatasetFieldRelations(long) exists at ReactiveTagRepositoryImpl.java:299-306 but is
      not called) — so a tag attached to dataset fields leaves ORPHAN tag_to_dataset_field rows
      pointing at the soft-deleted tag id, invisible to UI reads (joined through addSoftDeleteFilter)
      but persistent forever (no reaper). Separately, the delete refreshes only the term-side FTS
      vector (:68-69), NOT the data-entity-side search_entrypoint.tag_vector (update refreshes all
      three) — so the deleted tag's name token lingers across previously-tagged entities; AND the
      one term-side refresh it does run executes AFTER the tag_to_term rows are already deleted, so
      its discovery CTE (SELECT term_id FROM tag_to_term WHERE tag_id=?) finds nothing and re-indexes
      zero terms — a no-op. The deleted tag name therefore stays searchable on both the entity and
      term surfaces until an unrelated write happens to refresh each row. NOTE: the e2e
      delete-tag.spec.ts ("Delete unimportant/important tag") DOES verify the tag disappears from
      the management Tags LIST after delete — but that is only the directory-row soft-delete +
      list-refresh arm; it asserts NOTHING about the orphan dataset-field rows or the lingering
      search-index token, so the "clean" half of the promise is unguarded.
    evidence:
      - sidecar: odd-platform__java__TagController__controller-method__deleteTag
        section: invariants + bugs_limitations_corner_cases + operations
        cite: "TagServiceImpl.java:64-65 (hard-delete term + data-entity only) + ReactiveTagRepositoryImpl.java:299-306 (unused deleteDatasetFieldRelations)"
        note: "tag_to_dataset_field orphaned after soft-delete (P-032)"
      - sidecar: odd-platform__java__service__TagServiceImpl
        section: bugs_limitations_corner_cases
        cite: "TagServiceImpl.java:68-69 (delete refreshes only term vector) + :161-167 (update refreshes all three)"
        note: "asymmetric FTS refresh + too-late ordering (P-033 H1/H2)"
      - source_read_for_validation: false
        cite: "odd-platform/tests/features/tags/delete-tag.spec.ts:16-49 (read this run)"
        note: "the delete e2e verifies only list-disappearance; the orphan + FTS arms are untested"
    operator_visible_failure: |
      After a delete: (1) orphan tag_to_dataset_field rows accumulate silently in the DB,
      consuming space and risking confusion if the soft-deleted tag id is ever reused; (2) a
      global full-text search for the deleted tag name still surfaces previously-tagged data
      entities AND terms — the index is stale for an unbounded per-entity window. An operator who
      deletes a tag to retract it (e.g. a mistakenly-applied `pii` label) finds the name still
      searchable, undermining the whole point of the delete.
    severity: MEDIUM
    confidence: HIGH
    probe_id: P-033
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified   # the directory-soft-delete arm IS e2e-tested (-> H-015); the CLEAN-teardown promise (orphans + FTS) is NOT
    test_demand: functional

- id: H-010
  hypothesis: |
    "When a Collector pushes a tag (an external tag), that tag is protected from UI users — a
    platform user cannot rename or delete a Collector-owned tag out from under the ingestion
    pipeline."
  derivation: |
    The existence of an `external` flag + BadUserRequestException messages ("Can't update/delete
    tag which has external relations") names a deliberate ownership contract. Response-shape +
    implicit-ADR.
  seed_source: response-shape + cross-pillar (Integrations boundary)
  validation:
    verdict: partial
    actual_behavior: |
      The guard works for the DATA-ENTITY side and is a genuine positive invariant: update (:49)
      and delete (:62) both .filter(!tagDto.external()), where external = boolOr(tag_to_data_entity
      .external) — a tag with any Collector-set data-entity relation cannot be renamed or deleted
      via the UI. BUT the guard reads ONLY the data-entity aggregate; getDto joins only
      TAG_TO_DATA_ENTITY (ReactiveTagRepositoryImpl.java:54-66). The tag_to_dataset_field table
      uses a separate TagOrigin enum (INTERNAL / EXTERNAL / EXTERNAL_STATISTICS), which getDto
      never joins. So a tag whose ONLY Collector-set origin is an EXTERNAL tag_to_dataset_field
      row (with no external data-entity relation) PASSES the !external guard and CAN be renamed
      via PUT /api/tags/{id} or deleted via DELETE /api/tags/{id} by any UI user holding
      TAG_UPDATE / TAG_DELETE — silently mutating or destroying the Collector-owned dataset-field
      tag.
    evidence:
      - sidecar: odd-platform__java__TagController__controller-method__deleteTag
        section: invariants + bugs_limitations_corner_cases
        cite: "TagServiceImpl.java:49,62 (!external guard) + ReactiveTagRepositoryImpl.java:54-66 (getDto joins only TAG_TO_DATA_ENTITY)"
        note: "guard consults only the data-entity-side aggregate"
      - sidecar: odd-platform__java__service__TagServiceImpl
        section: invariants
        cite: "ReactiveTagRepositoryImpl.java:84-93 (listDatasetFieldDtos — tag_to_dataset_field uses ORIGIN, a separate concept)"
        note: "the dataset-field external origin the guard never joins"
    operator_visible_failure: |
      A tag pushed by a Collector exclusively at the dataset-field level (EXTERNAL /
      EXTERNAL_STATISTICS origin) is unprotected: a UI user can rename it (breaking the Collector's
      next reconcile, which keys on the name) or delete it (so the next ingestion re-creates it,
      churning). The protection the operator believes is uniform ("Collector tags are read-only in
      the UI") holds only for the data-entity side. The positive invariant is real but incomplete.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional

