behaviour: |-
  **LOW — `ActivityEmptyPartitionsHousekeepingJob`'s 15-minute cycle runs `SELECT count(*) = 0 FROM <partition>` per past partition — a SEQUENTIAL SCAN on every populated partition that isn't past-and-empty.** `PartitionServiceImpl.java:133-142` builds `SELECT count(*) = 0 FROM <partition>` (NOT `SELECT EXISTS (SELECT 1 FROM <partition> LIMIT 1)`). Postgres has no fast `count(*)` shortcut for partitioned tables; the planner uses sequential scan unless an index-only scan applies (rare for `count(*)` without WHERE). For a NON-empty partition, this counts EVERY visible tuple — even though the count is then compared to 0 and the partition is NOT dropped. **The job runs this expensive check on every past partition every 15 minutes (96 times/day, 35K times/year)** — on a multi-year deployment with 60+ partitions (default `partition_period=30`) or 365+ partitions (operators tuning down per the docs' "narrower partitions for performance" guidance), this is significant hidden DB load.

  **Primary-source chain**:
  - `PartitionServiceImpl.java:134` — `SELECT count(*) = 0 FROM %s.formatted(partitionName)` — the SEQUENTIAL SCAN
  - `PartitionServiceImpl.java:89-105` — the partition list query (`information_schema.tables LIKE 'activity_%'`) returns N past partitions
  - `EmptyPartitionsHousekeepingJob.java:21-22, 24-27` — iterates the past-partition list, calls `isPartitionEmpty` per partition
  - `HousekeepingJobManager.java:25-26` — 15-minute fixedRate (96 cycles/day)
  - Default `partition_period=30` (application.yml:213) → 60-day-wide partitions; deployment age (years) determines N
  - The empty-check is the ONLY filter — non-empty partitions are scanned anyway

  **The performance cost**:
  - Per past partition: full sequential scan to count visible tuples
  - Per 15-min cycle: N scans (where N = past partition count)
  - At default `partition_period=30`, a 5-year deployment has ~61 partitions; assuming half are past + 10M rows each: 30 partitions × 10M rows = 300M-tuple scan per cycle
  - 96 cycles/day × 300M tuples = 28.8 BILLION tuples scanned per day, ALL to determine count = 0 vs > 0
  - The fix is trivial: `WHERE NOT EXISTS (SELECT 1 FROM <partition>)` (or `LIMIT 1` + check result) short-circuits on first row — O(1) for non-empty partitions vs O(N) for the current implementation

  **Operator-visible consequences**:
  - **Hidden DB load**: the housekeeping subsystem's "I/O footprint" is not surfaced in the docs — operators sizing their Postgres expecting "small periodic maintenance work" get sustained sequential-scan I/O
  - **Partition-tuning paradox**: an operator following the docs' "narrower partitions for performance" advice tunes `partition_period=1` (daily) → 365 partitions/year → 365 sequential scans every 15 min × 96 cycles/day = 35K scans/day — the opposite of what they sought
  - **Steady-state IOPS**: the empty-check accounts for a measurable fraction of DB IOPS on active deployments; no metric exposes this

  **Why LOW not MEDIUM**:
  - The performance cost IS hidden but the symptoms are NOT catastrophic (no user-visible latency spike unless the DB is saturated)
  - The fix is trivial and isolated (one query rewrite)
  - We rate LOW because: (a) the impact is hidden DB load, not user-visible latency; (b) the fix is well-understood; (c) the regression risk is low (a one-line query rewrite is unlikely to introduce correctness issues).

  **Connection to probe P-013**:
  - The sidecar emits P-013 to MEASURE the actual I/O cost on a populated activity table
  - This TEST-GAP is the regression-pin AFTER P-013 confirms the empirical cost

  **Connection to TEST-GAP-870 + TEST-GAP-875**:
  - TEST-GAP-870 (the data-loss race), TEST-GAP-875 (the lock-collision latency), and TEST-GAP-877 (this — the sequential-scan cost) all stem from the SAME code path (`PartitionServiceImpl.getEmptyPastPartitions` → `isPartitionEmpty` → `dropPartition`)
  - The three probes (P-012, P-022, P-013) characterise three different facets of the same DDL lifecycle: data integrity, lock latency, and steady-state I/O
