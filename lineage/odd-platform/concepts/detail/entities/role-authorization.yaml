performance_aggregate:
  overall: HIGH
  hot_paths:
  - 'Single POST per role-creation: 3 DB calls (roleRepository.create → roleToPolicyRepository.createRelations(N
    rows) → roleRepository.getDto). N = policies.length, typically 1-10 (createRole.md:performance.hot_paths.[0])'
  - |-
    **NEW batch N — Role.getByName on AUTHORIZATION HOT PATH**:
    PolicyServiceImpl.getCurrentUserPolicies → RoleServiceImpl.getCurrentUserRoles
    → roleRepository.getByName(role.getValue()) is invoked on EVERY
    authorized HTTP request whose user has no explicit owner-attached
    roles. The query is a 3-table JOIN (ROLE LEFT JOIN ROLE_TO_POLICY
    LEFT JOIN POLICY) with jsonArrayAgg(policy.*). Sub-millisecond on
    typical row counts (single-digit policies per role). No caching at
    repository, service, or extractor level.
    (ReactiveRoleRepositoryImpl.md:dependencies_semantic.coupling — the
    AUTHORIZATION HOT PATH via getByName)
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: No batch-create endpoint; admin migrating 100 Roles issues 100 POSTs (createRole.md:performance.throughput_characteristics.[0])
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Stateless controller; concurrent creates of the same name race at the
      DB unique-index (createRole.md:performance.scaling_characteristics.[0])
  strengths:
  - Reactive Mono signature — non-blocking I/O preserved
  - |-
    **NEW batch N — jsonArrayAgg single-query density**. The dto-aggregation
    methods use jsonArrayAgg(POLICY.asterisk()) to materialise the
    policies-attached-to-a-role view in a SINGLE query rather than N+1
    round-trips. Consistent across every Reactive*Repository that
    returns a multi-table dto (Grep returned 16 files using the same
    pattern).
    (ReactiveRoleRepositoryImpl.md:implicit_adrs.[4])
  weaknesses:
  - No bulk-create endpoint (LOW)
  - No upper bound on `RoleFormData.policies[]` size (components.yaml:3368-3379) —
    a 10000-policy request produces 10000 INSERTs into role_to_policy in one transaction
    (createRole.md:performance.known_performance_gaps.[1])
  cross_file_inconsistencies: []
  contributing_files:
  - createRole.md
  - ReactiveRoleRepositoryImpl.md
  evidence:
  - createRole.md:performance.known_performance_gaps.[0,1]
  - ReactiveRoleRepositoryImpl.md:dependencies_semantic.coupling
notes: |-
  STRENGTHENED batch 2026-05-19N — REPOSITORY-LAYER PRIMARY SOURCE
  PINNED. The 94-line ReactiveRoleRepositoryImpl is the structural
  mirror of batch-H's ReactivePolicyRepositoryImpl — both adding exactly
  custom dto JOIN methods on top of the inherited soft-delete CRUD; both
  exhibit the SAME bug class on the LEFT JOIN against POLICY (missing
  deleted_at filter); both forensically silent on the RBAC mutation
  path; both have the partial-unique-index design that makes the
  service-tier create-path name-asymmetry exploitable.

  The symmetric pair (Role-repo + Policy-repo) now anchors the cross-batch
  observations:
    - no-audit-log-on-rbac-mutations: 4-sidecar at batches E + H + L,
      now 5-sidecar at batch N (Role-repo confirms persistence-layer
      silence)
    - three-soft-delete-mechanisms-across-the-repository-layer: the
      Role-repo extends the same ReactiveAbstractSoftDeleteCRUDRepository
      base as Policy-repo
    - repository-transactional-boundary-at-service-layer: Role-repo
      confirms the no-@ReactiveTransactional convention at the
      persistence layer

  Anchored on `configuration-and-deployment/enable-security/authorization/roles`
  live page (200, 2026-05-12). Live page omits API-creation guidance,
  ROLE_CREATE Permission name, predefined-name protection rules,
  spec-vs-code drift, audit-logging absence, and Role-row-vs-LDAP/OAuth-group
