name: |-
  Audit-log presence asymmetry — batch W extends Tier-2 unaudited surface to Management-tier tabs (DataSource + Collector + Tag + Namespace + Dataset structure mutations silent)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
  - P-08
  - P-09
description: |-
  STRENGTHENED INVARIANT, batch 2026-05-20W — extends the existing
  audit-log-presence-asymmetry-2-tier-audit-story canonical_candidate
  (and the related no-audit-log-on-rbac-mutations-... master
  invariant) by confirming Tier-2 (unaudited) at 4 NEW Management-tier
  controllers from batch W. The audit-log gap is broader than
  RBAC mutations alone — it extends across the Management-tier
  admin surfaces uniformly.

  THE EXPANDED ENUMERATION — Tier 2 (Unaudited):

    Previously (per the existing master at batch E + H + L + N +
    P + Q + R + V):
      - Role mutations (RoleServiceImpl)
      - Policy mutations (PolicyServiceImpl)
      - Owner-directory mutations (OwnerServiceImpl)

    NEW THIS BATCH:
      - DataSource mutations (DataSourceServiceImpl) — all 4 paths
        (create / update / delete / regenerate-token) emit NO
        Activity events. Verified by Grep across the file +
        cross-confirmed at the batch S sidecar.
      - Collector mutations (CollectorServiceImpl) — all 5 paths
        (list / register / update / delete / regenerate-token)
        emit NO Activity events. NO @Slf4j, NO @ActivityLog, NO
        programmatic emission. Confirmed at batch W primary source.
      - Tag directory mutations (TagServiceImpl) — createTag /
        updateTag / deleteTag emit NO Activity events. The
        @ActivityLog(event = TAG_ASSIGNMENT_UPDATED) annotation
        exists at DataEntityServiceImpl.java:358 (per-entity
        tag-assignment) but NOT at the controller-side
        directory-vocabulary path. Confirmed at batch W primary
        source.
      - Namespace mutations (NamespaceServiceImpl) — create /
        update / delete emit NO Activity events. Confirmed at
        batch W primary source.
      - Dataset structure mutations (DatasetController doesn't
        write directly, but cross-link: dataset_field.internal_description
        writes via DatasetFieldController PUT at batch V emit
        @ActivityLog(event = DATASET_FIELD_INTERNAL_DESCRIPTION_UPDATED)
        — this IS Tier 1; the asymmetry is per-mutation-type, not
        per-controller).

    Updated Tier 2 enumeration: 7+ surfaces (3 previously + 4 new)
    confirmed unaudited.

  STRENGTHENED batch 2026-05-21ZB — the four DataSourceController
  METHOD-level sidecars (registerDataSource / updateDataSource /
  deleteDataSource / regenerateDataSourceToken) CONFIRM at
  method-scoped primary source what the batch-W class sidecar
  asserted at class scope: each of the 4 DataSource mutating methods
  emits NO Activity Event. Each method sidecar carries the absence
  as an explicit downstream-side-effect entry (cardinality 0) AND a
  bugs_limitations_corner_cases / security.known_security_gaps entry.
  The regenerateDataSourceToken sidecar additionally confirms NO
  log.info/warn line exists anywhere on the rotation path
  (DataSourceController / DataSourceServiceImpl / TokenGeneratorImpl /
  ReactiveTokenRepositoryImpl) — the `token.updated_by` column is the
  ONLY forensic trail and it is OVERWRITTEN on each rotation
  (single-state, not append-only). This is a method-scoped
  re-verification at commit 80637ed; it does NOT widen the Tier-2
  enumeration (the class node already enumerated all 4 DataSource
  paths) — it raises confidence from class-level Grep to
  method-level primary source.

  THE EXPANDED ENUMERATION — Tier 1 (Audited):

    Previously confirmed:
      - DataEntity status updates (DATA_ENTITY_STATUS_UPDATED)
      - DataEntity ownership creates (OWNERSHIP_CREATED)
      - DataEntity description updates (DATA_ENTITY_INTERNAL_DESCRIPTION_UPDATED)
      - DataEntity tag assignments (TAG_ASSIGNMENT_UPDATED at the
        per-entity scope)
      - DataEntity term-link mutations (TERM_ASSIGNMENT_UPDATED)
      - DataEntity DEG-membership flips (per batch L) — partial
        (see note in master)
      - DataEntity custom-metadata mutations (per batch L)
      - DataEntity halt-config mutations
      - Dataset-field internal_description (batch V — Tier-1c
        sibling)

  THE NEW ARCHITECTURAL PATTERN OBSERVATION:

    Tier 1 (Audited) = DataEntity-mutating endpoints. The
    @ActivityLog AOP framework + programmatic emission patterns
    are concentrated at DataEntityServiceImpl + DataEntityAttachmentServiceImpl
    + OwnershipServiceImpl + DatasetFieldServiceImpl.

    Tier 2 (Unaudited) = Management-tier admin surfaces +
    RBAC-tier mutations. NamespaceServiceImpl, DataSourceServiceImpl,
    CollectorServiceImpl, TagServiceImpl, OwnerServiceImpl,
    RoleServiceImpl, PolicyServiceImpl — all 7 SERVICES are
    Tier 2 unaudited.

    The pattern's PRINCIPLE: 'audit follows the data, not the
    config'. The Activity Feed records changes to CATALOG DATA
    (entities + their attached metadata); it does NOT record
    changes to the CATALOG CONFIG (namespaces + datasources +
    collectors + tags + roles + policies + owners). This is the
    INVERSE of what a security-conscious operator would expect —
    config changes (RBAC roles, ownership of datasources, tag
    vocabulary) are precisely the changes a security audit would
    need to reconstruct.

  THE COMPOUND WITH F-006 AUDIT-SILENCE-ENUM-ROOTED (cross-link):

    Per the f-006-audit-silence-enum-rooted-deeper-than-schema-rooted
    invariant (batch U), the underlying ActivityEventTypeDto enum
    has NO values defined for:
      - TAG_CREATED / TAG_UPDATED / TAG_DELETED
      - NAMESPACE_CREATED / NAMESPACE_UPDATED / NAMESPACE_DELETED
      - DATA_SOURCE_CREATED / DATA_SOURCE_UPDATED / DATA_SOURCE_DELETED
      - COLLECTOR_CREATED / COLLECTOR_UPDATED / COLLECTOR_DELETED
      - COLLECTOR_TOKEN_REGENERATED / DATA_SOURCE_TOKEN_REGENERATED

    Adding @ActivityLog to the Tier-2 services WITHOUT ALSO
    adding the corresponding enum values would not help — the
    schema-rooted constraint precludes the row insertion. The
    fix is FIVE LAYERS deep:
      1. Add enum values to ActivityEventTypeDto.
      2. Add the FK-valid rows to the activity_event_type table.
      3. Add @ActivityLog annotations to the 7 Tier-2 services.
      4. Add corresponding ActivityHandler classes for each new
         event type.
      5. Update the Activity Feed UI to surface the new event types
         (no UI-tier filter mechanism for config-mutation events
         currently).

  THE OPERATOR-FACING CONSEQUENCE:

    Operator-facing question: 'Who deleted the production namespace
    yesterday at 3am?' — currently UNANSWERABLE. Operator-facing
    question: 'Who rotated the staging collector token after the
    incident?' — currently UNANSWERABLE. Operator-facing question:
    'Which user created the tag-vocabulary entry "DEPRECATED" that
    shows up on every entity now?' — currently UNANSWERABLE.

    The TOKEN.updated_by column does capture the LAST actor on
    rotation (single-state, not append-only); but the moment the
    operator rotates AGAIN, the prior actor's identity is lost.
    No append-only history exists for any of the 7 Tier-2 services.

  SEVERITY MEDIUM (cross-pillar) — the audit-log gap is intentional
  in the platform's design (per ADR-CANDIDATE-003 + the doc-side
  framing); the cross-pillar consequence for Tier-2 services is
  not enumerated anywhere; operators must read the source code
  to discover the gap.

