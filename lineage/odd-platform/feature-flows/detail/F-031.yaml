terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Per-call, varying by verb:
    - REGISTER (POST /api/datasources): 1x INSERT token + 0-or-1x INSERT
      namespace + 1x INSERT data_source; all inside one @ReactiveTransactional.
      Plus a page-render returning the DataSource with the token in
      PLAINTEXT (HTTP 200).
    - UPDATE (PUT /api/datasources/{id}): 1x SELECT getDto + 0-or-1x INSERT
      namespace + 1x UPDATE data_source (full-form REPLACE of
      name/description/namespace_id) + 2x UPDATE search_entrypoint (FTS
      refresh); all inside one @ReactiveTransactional. Page-render HTTP 200.
    - DELETE (DELETE /api/datasources/{id}): 1x SELECT EXISTS (cascade-guard)
      + 1x UPDATE data_source SET deleted_at = NOW() (soft-delete) — OR a
      400 CascadeDeleteException with no mutation. Leaves the token row
      ORPHANED and the FTS vector UNCLEARED. Returns 204.
    - REGENERATE-TOKEN (PUT /api/datasources/{id}/token): 1x SELECT getDto
      + 1x UPDATE token SET value = <new 40-char> (NOT @ReactiveTransactional;
      atomic at statement level). Page-render returns the new token in
      PLAINTEXT (HTTP 200). Indirectly invalidates the credential a
      separate POST /ingestion/entities depends on.
    - LIST (GET /api/datasources): 0 writes — pure paginated read; but no
      SecurityRule. Page-render returns the DataSourceList with MASKED
      tokens.
    NO Activity Event is emitted by ANY of the 5 verbs — the data_source
    lifecycle is fully invisible to the Activity Feed.
  evidence: |-
    DataSourceServiceImpl.java:38-43 (list) + 51-66 (create) + 68-83 (update)
    + 85-96 (delete) + 99-106 (regenerate-token) + ReactiveTokenRepositoryImpl.java:20-27,30-39
    + ReactiveDataSourceRepositoryImpl.java:58-82 + ReactiveAbstractSoftDeleteCRUDRepository.java:50-58,106-110
    + ReactiveDataEntityRepositoryImpl.java:158-163 + V0_0_28__add_token.sql:1-13
    + SecurityConstants.java:116-126.
  cardinality_per_call: 0-5 writes per call (varies by verb; LIST=0, REGISTER=2-3, UPDATE=3-4, DELETE=0-1, REGENERATE=1)
amplification_factor: 1
