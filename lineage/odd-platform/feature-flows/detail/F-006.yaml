    drift_class: delete_search_vector_not_refreshed
    provenance: STATIC — primary-source in batch K OwnershipServiceImpl sidecar
      bugs_limitations_corner_cases[2] + OwnershipServiceImpl.java:69, 116 vs 81-96
  - facet: DELETE flow does NOT validate the ownership existed (silent 204)
    observed: |-
      Line 81 calls `ownershipRepository.delete(ownershipId)`; per batch-H
