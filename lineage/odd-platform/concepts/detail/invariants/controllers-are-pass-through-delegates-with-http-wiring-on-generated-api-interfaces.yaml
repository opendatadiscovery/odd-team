name: Controllers are pass-through delegates with HTTP wiring on generated *Api interfaces
canonical_in_docs: false
canonical_candidate: true
description: |-
  Repository-wide convention: controllers carry only `@RestController`
  + `@RequiredArgsConstructor` + `@Override` on each method. HTTP method/path/produces/consumes
  annotations live on the OpenAPI-generated `*Api` interface, NOT on the controller
  class. AlertController, DataEntityController, DataEntityAttachmentController, DirectoryController,
  GenAIController, ActivityController, DataCollaborationController, CollectorController
  all follow this. AlertManagerController is the sole exception (hand-coded, no `*Api`
  interface, has explicit `// TODO: define OpenAPI spec` comment).

  ## STRENGTHENED — batch ZD (RBAC class-level controller-tier confirmation)

  Batch ZD adds FIVE new class-level confirmations of the same shape
  at the RBAC + Integration controller cluster. All five files are
  thin two-line-per-method reactive delegates implementing
  OpenAPI-generated `*Api` interfaces:

    - IdentityController (28 lines, 1 endpoint — `whoami`):
      single method body is
      `identityService.whoami().map(ResponseEntity::ok).switchIfEmpty(...)`;
      no `@PreAuthorize`, no `@Slf4j`, no controller-level logic.
      Implements `IdentityApi`.

    - PermissionController (27 lines, 1 endpoint —
      `getResourcePermissions`): single method body is
      `Mono.just(permissionService.getResourcePermissionsForCurrentUser(...)).map(ResponseEntity::ok)`;
      no `@PreAuthorize`, no `@Slf4j`. Implements `PermissionApi`.

    - RoleController (52 lines, 4 endpoints — create / list /
      update / delete): every method is `serviceCall.map(ok)` or
      `serviceCall.thenReturn(noContent)`; no `@PreAuthorize`, no
      `@Slf4j`, no logging on any of the 4 endpoints. Implements
      `RoleApi`.

    - PolicyController (64 lines, 6 endpoints — create / get / list
      / update / delete / schema): every method is a flatMap/map
      delegate to `policyService.*`; no `@PreAuthorize`, no
      `@Slf4j`. Implements `PolicyApi`.

    - IntegrationController (28 lines, 2 endpoints — `getIntegration`
      + `getIntegrationPreviews`): both methods are two-line
      `integrationService.X().map(ok)` delegates; no
      `@PreAuthorize`, no `@Slf4j`. Implements `IntegrationApi`.

  Across all FIVE files: every method takes `ServerWebExchange exchange`
  as a parameter (required by the OpenAPI-generated `*Api` signature)
  but NONE of the methods read the parameter — the parameter is dead
  weight forwarded from the interface contract. Five additional
  confirmations bring the pattern to 11+ controller-class sidecars
  end-to-end.

  ## STRENGTHENED — batch ZE (Discovery + Search + Links + Feature + Relationship + Title)

  Batch ZE adds FIVE MORE class-level confirmations of the same
  shape at the discovery / search / feature-flag / relationship /
  title cluster:

    - SearchController (92 lines, 7 endpoints — search / facets /
      results / facet-options / suggestions / update / highlight):
      every endpoint body is the 3-line
      `svc.call(...).map(ResponseEntity::ok)` shape; no
      `@PreAuthorize` anywhere on the class; no `@Slf4j`; no
      controller-level error mapping; ServerWebExchange parameter
      received but unread on every method. Implements `SearchApi`.

    - TitleController (24 lines, 1 endpoint — `getTitleList`):
      single method body is
      `titleService.list(page, size, query).map(ResponseEntity::ok)`;
      no `@PreAuthorize`, no `@Slf4j`. Implements `TitleApi`.

    - FeatureController (21 lines, 1 endpoint —
      `getActiveFeatures`): single method body is
      `Mono.just(featureResolver.resolveActiveFeatures()).map(ResponseEntity::ok)`;
      no `@PreAuthorize`, no `@Slf4j`. Implements `FeatureApi`.

    - RelationshipController (44 lines, 3 endpoints — list / ERD /
      GRAPH): every method body is `service.call(...).map(ok)`; no
      `@PreAuthorize`, no `@Slf4j`. Implements `RelationshipApi`.

    - LinksController (37 lines, 1 endpoint — `getLinks`): single
      method body is `Mono.just(linkProperties.links().stream()
      .map(...).toList()).map(LinkList::new).map(ResponseEntity::ok)`
      shape; no `@PreAuthorize`, no `@Slf4j`. Implements `LinksApi`.

  All five files confirm: zero `@PreAuthorize`, zero `@Slf4j`,
  ServerWebExchange dead-weight on every method. The pattern is
  now confirmed across 16+ controller-class sidecars end-to-end.

  ## STRENGTHENED — batch ZF (Ingestion + Owner + MetadataField + DataCollaboration + EventApi)

  Batch ZF adds FIVE MORE class-level confirmations across the
  ingestion + ownership + metadata + collaboration + Slack-events
  cluster — bringing the pattern's full triangulation to 21+
  controller-class sidecars:

    - IngestionController (103 lines, 5 endpoints — postDataEntityList /
      createDataSource / getDataEntitiesByDEGOddrn /
      postDataSetStatsList / ingestMetrics): every method `@Override`s
      an IngestionApi method with NO @PostMapping/@GetMapping
      annotations; the 5 methods range from 1-line proxies
      (`getDataEntitiesByDEGOddrn`) to 14-line compositions
      (`createDataSource` — the only method that reads
      ServerWebExchange, for the WebSession state read). NO
      @PreAuthorize anywhere; auth lives in two separate filter
      classes. NO log.* calls despite @Slf4j annotation (line 30 —
      dead annotation; auditability of ingestion at the controller
      layer is ZERO). FOUR distinct services injected (most
      service-fan-out of any controller on the platform): IngestionService,
      DataEntityGroupService, DataSourceIngestionService,
      IngestionMetricsService. Implements `IngestionApi` (sourced
      from the EXTERNAL opendatadiscovery-specification Gradle dep —
      not in-tree).

    - OwnerController (55 lines, 4 endpoints — createOwner /
      getOwnerList / deleteOwner / updateOwner): every method is
      a 4-line `@Override` delegate to OwnerService; no
      @PreAuthorize, no @Slf4j, no controller-tier validation;
      the only ServerWebExchange parameter is bound by the
      generated interface and NEVER read inside any method body.
      Implements `OwnerApi`. Single OwnerService field injected.
      Class-level sidecar surfaces the THREE-WAY service-tier
      getOrCreate side-door (cross-link to
      permission-bypass-via-owner-auto-create-side-door-write-path).

    - MetadataFieldController (24 lines, 1 endpoint —
      `getMetadataFieldList`): single 2-line method body
      `metadataFieldService.listInternalMetadata(query).map(MetadataFieldList::new).map(ResponseEntity::ok)`;
      no @PreAuthorize, no @Slf4j; ServerWebExchange declared at
      line 20 but unread in the body (line 21-22). Implements
      `MetadataApi`.

    - DataCollaborationController (50 lines, 3 endpoints —
      getSlackChannels / postMessageInSlack / redirect):
      class-gated by `@ConditionalOnDataCollaboration` (line 21);
      every method body is a 2-to-4-line `dataCollaborationService.X`
      reactive delegation; no @PreAuthorize, no @Slf4j; single
      DataCollaborationService injected. ServerWebExchange present
      on every signature but unread on all three. Implements
      `DataCollaborationApi`. The DataCollab controller is the
      reactive-pass-through pattern's load-bearing exemplar of
      "class-level conditional gate via @ConditionalOnDataCollaboration"
      — the bean is not registered when datacollaboration.enabled=false,
      and the routes 404 by default.

    - EventApiController (57 lines, 1 endpoint — `handleSlackEvent`
      POST /api/slack/events): class-gated by
      `@ConditionalOnDataCollaboration` (line 15); single
      method body reads raw JSON body, delegates to SlackEventParser
      + DataCollaborationService.enqueueMessageEvent; no
      @PreAuthorize, no @Slf4j (only log.debug deep in the parser);
      route is whitelisted in EVERY auth mode (SecurityConstants
      WHITELIST_PATHS + LoginFormSecurityConfiguration
      permittedPaths). Implements (informally) the OpenAPI
      generated event-api contract.

  ZF observations confirming the broader pattern:
    - Every method takes ServerWebExchange but reads it only on
      ONE endpoint (createDataSource in IngestionController, for
      the WebSession bridge) — same dead-parameter pattern as
      every prior batch
    - Zero `@Slf4j` log calls inside any of the five files
      (despite presence of the annotation on IngestionController
      — dead annotation pattern surfaces explicitly here)
    - Zero @PreAuthorize across all 14 methods across the 5
      controllers — auth lives elsewhere (filter classes for
      ingestion + slack-events; SECURITY_RULES central table for
      the others)
    - Two class-level conditional gates surface
      (`@ConditionalOnDataCollaboration` on DataCollaborationController
      + EventApiController) — bean-not-registered pattern is
      the conditional-feature-flag analog of the thin-delegate
      convention
