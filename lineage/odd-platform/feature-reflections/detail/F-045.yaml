- id: H-003
  hypothesis: "When a user opens GET /api/datasets/{X}/structure (no version_id) — or the Structure tab with no revision selected — the system shows the MOST RECENTLY INGESTED revision of dataset X."
  derivation: "The doc and UI label this the 'latest'/current structure; a user expects 'latest' to mean most-recent-in-time."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      "Latest" is computed as max(DATASET_VERSION.VERSION) via a subquery joined back
      to the row with that version number (ReactiveDatasetVersionRepositoryImpl.java:160-217);
      created_at exists in the table but is never referenced. Under NORMAL ingestion the
      version number is monotonically +1 per re-ingest
      (DatasetStructureIngestionRequestProcessor.java:171-178), so max(version) ==
      most-recently-created and the promise holds. Under manual SQL fixup, collector
      replay of an older version, or restore-from-backup, the highest-version row can
      have an older created_at than another row — and "Latest" returns the
      higher-numbered-but-older row. So: TRUE in the common case, FALSE under
      replay/fixup. dataEntityId DOES correctly scope this endpoint (the only one of the
      four that uses it).
    evidence:
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: stress_findings.name_behavior_pairs[getLatestDatasetVersion]
        cite: "ReactiveDatasetVersionRepositoryImpl.java:160-217 + DatasetStructureIngestionRequestProcessor.java:171-178"
        note: "drift MINOR — max(version) diverges from max(created_at) only under non-monotonic ingestion."
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: stress_findings.request_inputs[dataEntityId].Q3
        cite: "ReactiveDatasetVersionRepositoryImpl.java:166-167"
        note: "getLatestDatasetVersion MATCHES — datasetId reaches SQL and filters DATA_ENTITY.ID.eq(datasetId)."
    operator_visible_failure: |
      An operator who has just replayed/restored an older version (or done a manual SQL
      fixup) opens the Structure tab expecting the most-recently-applied schema and is
      shown the highest-version row, which may be the OLDER one. The divergence is silent
      — no banner, no timestamp warning. The UI compounds it (see H-010): on latest-fetch
      success the URL is rewritten to pin that max-version id with replace:true, so the
      operator's URL bar now carries a version they did not pick and which may not be the
      newest by time.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: "When a user requests a diff with a version_id that does not exist, the system returns 404 (the version was not found) — a typed, distinguishable error."
  derivation: "Negative-space: a not-found id is the canonical 404 case; the identical-id case already returns a typed 400, so a missing id should be equally typed."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      A missing version_id yields HTTP 500. When the id-list query returns size != 2,
      buildDataSetVersionDiffList throws a bare RuntimeException("Query returned %s rows
      for diff request") (DatasetVersionServiceImpl.java:69-71) which ControllerAdvice
      maps to 500. The identical-version-id case, by contrast, throws a typed
      BadUserRequestException → 400 (DatasetVersionServiceImpl.java:59-61). The error
      model is asymmetric: 400 for "you sent the same id twice", 500 for "you sent an id
      that doesn't exist".
    evidence:
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: bugs_limitations_corner_cases[2]
        cite: "DatasetVersionServiceImpl.java:56-71"
        note: "Missing id → bare RuntimeException → 500; identical id → BadUserRequestException → 400."
    operator_visible_failure: |
      A caller (or the UI behind it) cannot distinguish "I typed a wrong/stale version id"
      (a 4xx user error) from "the platform is broken" (a 5xx outage) by the status code
      alone — the debugging workflow is defeated. 500s also tend to page on-call / inflate
      error-rate dashboards for what is actually user input error.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: "When a user views or diffs a dataset's structure, the system enforces per-dataset visibility — a user can only read the schema of datasets they (or their team/role) are entitled to see."
  derivation: "Pillar P-01 + the relationships doc page's opening line ('every relationship the user can see') imply role/owner-scoped visibility on the dataset-read surface."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      No layer enforces per-dataset visibility. The four endpoints carry no @PreAuthorize,
      no programmatic permissionService check, and SecurityConstants declares no rule for
      /api/datasets/*/structure* or /api/datasets/*/relationships; they fall through to the
      catch-all .pathMatchers('/**').authenticated() (AuthorizationCustomizer.java:29-30).
      Every authenticated user — any role, any owner association, or none — reads every
      dataset's structure. Under DisabledAuthSecurityConfiguration (auth.type=DISABLED)
      anyExchange().permitAll(), so it is anonymous. This is the read-collaborative posture
      shared with REFACTOR-024/REFACTOR-203 across the catalog read surface.
    evidence:
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: stress_findings.auth_gates
        cite: "AuthorizationCustomizer.java:20-32 + SecurityConstants.java:243-289 + DisabledAuthSecurityConfiguration.java:13-17"
        note: "All four endpoints: any authenticated user 200; DISABLED → anonymous 200; no role gating."
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: security.owner_scoping
        cite: "DatasetController.java:1-60"
        note: "BYPASSES — dataset owner has no bearing on visibility."
    operator_visible_failure: |
      (1) A multi-team / multi-tenant deployment CANNOT restrict schema visibility by team
      or role — the platform has no mechanism to do so on this surface; operators must
      enforce at the network perimeter. (2) A "read-only viewer" role and an "admin" role
