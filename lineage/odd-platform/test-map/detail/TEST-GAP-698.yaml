behaviour: |-
  **`DataSourceIngestionServiceImpl.prepareForUpdate` PRESERVES collector_id / namespace_id / token_id from the EXISTING row — the partial-merge invariant is THE SECURITY-CRITICAL CROSS-COLLECTOR OWNERSHIP-PRESERVATION CONTRACT.** Lines 74-92 `new DataSourcePojo(a).setName(i.getName()).setDescription(i.getDescription())` — explicit COPY-CONSTRUCT from existing then explicit setter on ONLY two fields. THE STOLEN-TOKEN ATTACK SCENARIO: Collector A originally registered ODDRN X (existing pojo has `collector_id = A`); attacker steals Collector B's token + re-POSTs `/ingestion/datasources` containing ODDRN X. The expected (protective) outcome: the bulkUpdate input's pojo MUST still have `collector_id = A` (the existing collector_id is preserved through the copy-construct at line 86; the mapper's output at line 107 sets `collector_id = B` but is DISCARDED on the update path). The existing test (`DataSourceIngestionServiceTest`) echoes the bulkUpdate input via `Flux.fromIterable(i.getArgument(0))` (line 85), so the SHAPE of items passed to bulkUpdate is verified only via the `expectNextSequence` assertion — the test does NOT explicitly assert that the `DataSourcePojo` passed to bulkUpdate has the SAME `collector_id` / `namespace_id` / `token_id` as the EXISTING pojo. A regression that changed `prepareForUpdate` to `new DataSourcePojo().setName(...).setDescription(...)` (WITHOUT the copy-construct from `a`) would NOT be caught — the bulkUpdate input would have null collector_id, but the mock would echo it back and the test's `expectNextSequence` would still pass. The TEST PINS THE CROSS-COLLECTOR OWNERSHIP-PRESERVATION CONTRACT explicitly: a stolen Collector B token CANNOT take over a datasource originally registered by Collector A.
