name: |-
  TagServiceImpl asymmetric search-vector refresh — update triggers 3 vectors, delete triggers 1
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
description: |-
  NEW INVARIANT, batch VAL-LSN-019 (2026-05-20) — captures an
  asymmetry in the search-vector refresh discipline across the
  `update` and `delete` methods of TagServiceImpl. Operator-visible
  consequence: after a tag delete, the platform's main search-entrypoint
  table still contains the deleted tag's tokens until the next
  entity-level refresh; the UI tag-search facet may surface the
  deleted tag's name until the index naturally refreshes.

  THE THREE SEARCH VECTORS — global registry:

    The platform maintains THREE search-vector tables that index
    tag-related text for FTS lookup:

      Vector 1 — `search_entrypoint` (main entity-search FTS):
        Updated via `reactiveSearchEntrypointRepository.updateChangedTagVectors`.
        Surfaces tag tokens on the main Catalog search.

      Vector 2 — `search_entrypoint_structure` (structure search FTS):
        Updated via `reactiveSearchEntrypointRepository.updateChangedTagStructureVector`.
        Surfaces tag tokens on the structure-search side (column /
        dataset-field tag context).

      Vector 3 — `term_search_entrypoint` (term-search FTS):
        Updated via `reactiveTermSearchEntrypointRepository.updateChangedTagVectors`.
        Surfaces tag tokens on the Glossary term-search side.

  THE ASYMMETRIC REFRESH — what the code actually does:

    Update path (TagServiceImpl.update at :44-55):
      Line 53: `.flatMap(this::updateSearchVectors)` — invokes the
      private helper.
      updateSearchVectors at :161-167: `Mono.zip` of all THREE
      vector-refresh calls (concurrent, awaited). Latency is
      max(v1, v2, v3) rather than sum.

    Delete path (TagServiceImpl.delete at :57-70):
      Line 68-69: `.flatMap(... -> reactiveTermSearchEntrypointRepository.updateChangedTagVectors(tagId))`
      — invokes ONLY vector 3 (term-search). Does NOT call
      `updateChangedTagVectors` or `updateChangedTagStructureVector`
      on the main `search_entrypoint` repository.

    Create path (TagServiceImpl.bulkCreate at :37-42):
      NO search vector refresh. The newly-created tags are not
      indexed for FTS until the next entity-level write that
      touches them.

    Side-door write paths (getOrCreateTagsByName / getOrInjectTagByName
    at :79-94):
      NO search vector refresh. The novel tags minted via the
      side-doors are not FTS-indexed until the next entity-level
      write.

  THE OPERATOR-VISIBLE CONSEQUENCES:

    Consequence 1 — Deleted-tag stale FTS tokens:
      After `DELETE /api/tags/{id}`, the main entity-search FTS
      vector still contains tokens from the deleted tag. The UI
      tag-search facet (which queries the main `search_entrypoint`)
      may auto-suggest the deleted tag's name from the FTS index.
      The drift resolves only on the NEXT data-entity write that
      touches the search_entrypoint refresh path.

    Consequence 2 — Created-tag missing FTS tokens:
      After `POST /api/tags` or any side-door create, the new tag's
      name is NOT in the FTS vectors. A user typing the new tag's
      name into the search box gets ZERO hits until the next
      entity-level write triggers a refresh. Behaviour-by-design
      consequence: tag-vocabulary writes are NOT search-visible
      until they are also applied to an entity.

    Consequence 3 — Side-door-mint visible only in DB:
      A user with DATA_ENTITY_TAGS_UPDATE who mints a novel tag via
      the per-entity side-door gets the tag attached to the entity,
      but the global FTS index is updated only by the
      `updateRelationsWithDataEntity` flow's downstream calls (which
      DO include a search-vector refresh at the relations-create
      path; the directory-side mint via getOrCreateTagsByName itself
      does NOT update the vectors directly — the refresh comes from
      the per-entity-relations refresh).

  WHY THE ASYMMETRY MIGHT BE INTENTIONAL — alternate interpretation:

    The delete path's single-vector refresh COULD be intentional under
    the assumption that:
      - The main `search_entrypoint` vector is refreshed by the
        downstream `tag_to_data_entity` cleanup (Step 3 of the
        delete cascade — hard-deletes the relations) which ITSELF
        should trigger an entity-side refresh on every affected
        entity.
      - The dataset-field-side relations are NOT cleaned up (per the
        `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field`
        invariant) — so the structure-search vector intentionally
        does not refresh for a no-op.
      - The term-search vector IS refreshed because `tag_to_term`
        relations are cleaned up but the Term row itself is not
        modified — the cleanup happens at a tier that doesn't
        cascade to term-side FTS automatically.

    However: NO COMMENT in the source code defends this rationale.
    The asymmetry could equally be a code-omission — the maintainer
    wrote the update path with three refreshes, then wrote the delete
    path by referring to the update path, then forgot two of the three.

    Without source-code commentary, we cannot distinguish "intentional"
    from "code-omission". The architectural risk is the same in either
    case: a future maintainer adding a fourth search-vector would
    need to know which-path-refreshes-which.

  THE COMPOUND WITH THE CASCADE ASYMMETRY:

    The delete path has TWO known asymmetries:
      (a) Three relation tables, two cleaned up, one orphaned
          (the `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field`
          invariant).
      (b) Three search vectors, one refreshed, two stale (THIS
          invariant).

    Both are code-omissions visible only at the cross-method-vs-helper
    boundary. The delete method LOOKS coherent in isolation —
    `Flux.zip` of two deletes + soft-delete + one vector refresh.
    The asymmetry surfaces only by enumerating ALL relation tables
    + ALL search vectors and matching the delete method against
    each.

