security_aggregate:
  overall: HIGH
  auth_modes_relevant: []
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: 'N/A'
    detail: |-
      The table is internal storage maintained by the ingestion path;
      not directly user-facing. Its surface visibility is determined
      by the controllers that read it (DataQualityRunsController +
      DataQualityController + per-dataset SLA endpoints), all of
      which carry their own auth posture.
  owner_scoping:
    verdict: 'N/A'
    detail: |-
      The table has no owner column; ownership scoping (when applied)
      happens at the JOIN to OWNERSHIP via the consuming queries.
  strengths:
    - |-
      PK-per-task constraint guarantees deterministic dashboard semantics
      — exactly one row per test, no fan-out, no GROUP-BY-DISTINCT.
    - |-
      Steady-state update via ON CONFLICT DO UPDATE is atomic and
      idempotent at the ingestion path; no race between back-fill and
      live writes.
  weaknesses: []
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityRunsController.md
performance_aggregate:
  overall: HIGH
  hot_paths:
    - |-
      DATA_ENTITY_TASK_LAST_RUN is the single-row-per-task hot read for
      the catalog-wide DQ dashboard's three sub-queries (testResults,
      tablesHealth, monitoredTables). The denormalisation IS THE
      PERFORMANCE WIN — the alternative (DISTINCT ON over
      data_entity_task_run at every dashboard load) would scale
      linearly with ingestion volume.
  throughput_shape:
    verdict: BATCH_FRIENDLY
    detail: |-
      Steady-state writes are batched at the ingestion path's
      TaskRunIngestionRequestProcessor; the denormalisation has no
      per-request cost beyond a single INDEXED PK lookup.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Row count is bounded by the number of DQ tests / transformers
      in the catalog (typically thousands, not millions); the
      denormalisation means dashboard query time is independent of
      historical run-count.
  strengths:
    - |-
      Denormalisation traded write-time work (ON CONFLICT DO UPDATE
      per incoming run) for read-time correctness — every dashboard
      load is O(test count) instead of O(run count).
    - |-
      PK on task_oddrn means the JOIN to data_entity is index-driven;
      no full-table scan.
  weaknesses:
    - |-
      The denormalisation introduces a semantic shift the live doc has
      NOT updated to reflect — "count of test runs" (doc) vs
      "count of tests by latest-run status" (code). A future maintainer
      reverting the denormalisation (e.g. switching to a JOOQ window
      function over data_entity_task_run) would silently CHANGE the
      dashboard's meaning back to "count of runs" — captured in the
      `dq-dashboard-test-results-counts-tests-not-runs` invariant.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityRunsController.md
