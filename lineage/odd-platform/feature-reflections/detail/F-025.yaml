- id: H-012
  hypothesis: "When a user opens a shared/bookmarked link to a specific query example whose URL segment is non-numeric or malformed (e.g. /data-modelling/query-examples/abc), the UI shows a clear not-found / error state."
  derivation: "Negative-space + UI device behaviour — links get shared in chat and edited by hand; a product owner expects graceful degradation, not a hang."
  seed_source: negative-space
