description: |-
  Data Source Lifecycle Management is the operator-facing CRUD +
  token-rotation surface under Management → Datasources (the
  /management/datasources SPA route). Five endpoints on DataSourceController
  (DataSourceController.java:21-59, each a 3-5 line thin proxy implementing
  the OpenAPI-generated DataSourceApi) compose the full UI-admin lifecycle:

  - List and search data sources (GET /api/datasources?page=&size=&query=,
    getDataSourceList) — paginated read backing the Datasources tab. NO
    SecurityRule entry — any authenticated user enumerates the full
    catalog. Tokens render MASKED ("******" + real last 6 chars) via the
    1-arg TokenDto constructor (showToken=false).
  - Register a data source (POST /api/datasources, registerDataSource) —
    gated by DATA_SOURCE_CREATE. Mints a fresh 40-char plaintext token,
    optionally get-or-creates the named namespace, rejects an empty ODDRN
    with HTTP 400, INSERTs the data_source row, returns the DataSource
    with the token in PLAINTEXT.
  - Edit a data source (PUT /api/datasources/{id}, updateDataSource) —
    gated by DATA_SOURCE_UPDATE. Full-form REPLACE of name / description /
    namespace_name on an existing live row; 404 if absent or soft-deleted.
  - Delete a data source (DELETE /api/datasources/{id}, deleteDataSource)
    — gated by DATA_SOURCE_DELETE. Guarded soft-delete: 400
    CascadeDeleteException if any live data_entity child exists, else
    UPDATE data_source SET deleted_at = NOW(); returns 204.
  - Regenerate the ingestion token (PUT /api/datasources/{id}/token,
    regenerateDataSourceToken) — gated by DATA_SOURCE_TOKEN_REGENERATE.
    Destructive in-place UPDATE of the single token row's value; no grace
    window; returns the new 40-char token in PLAINTEXT.

  All behaviour lives in DataSourceServiceImpl (DataSourceServiceImpl.java) —
  create at lines 51-66, update at 68-83, delete at 85-96, list at 38-43,
  regenerateDataSourceToken at 99-106. The repository tier is
  ReactiveDataSourceRepositoryImpl (listDto + getDto + inherited
  soft-delete) + ReactiveTokenRepositoryImpl (token create + updateToken) +
  TokenGeneratorImpl (40-char RandomStringUtils minting). Token
  visibility is decided API-side by the TokenDto.showToken boolean —
  plaintext on register/regenerate, masked on list.

  This feature is the FOURTH P-08 UI-admin lifecycle sibling — F-019
  (Owner), F-020 (Collector), F-028 (Namespace), and now F-031 (Data
  Source) — each a distinct operator-facing CRUD surface composed of a
  thin-delegate controller + MapStruct-mapped service. It is DISJOINT
  from F-008 (Batch Ingestion / S2S API): the UI-admin registration path
  POST /api/datasources is a separate endpoint, separate service class,
  separate auth model, and separate merge semantics from the S2S
  collector-driven path POST /ingestion/datasources
  (IngestionController.createDataSourceEntity). The batch-W
  DataSourceController class sidecar established that disjointness as a
  counterfactual extension of F-008; this ZB batch mints F-031 as the
  feature for the UI-admin half, with its 5 endpoint-method sidecars
  giving the full lifecycle picture.

  The user-observable reality, per the 5 batch-ZB endpoint-method
  sidecars, surfaces 19 load-bearing drift facets. The HIGH-severity
  headline cluster: (a) updateDataSource is REPLACE-not-MERGE — a
  partial PUT body silently nulls the omitted fields (MapStruct default
  SET_TO_NULL, MapperConfig sets no nullValuePropertyMappingStrategy);
  (b) registerDataSource opens a permission side-door — the
  namespace_name field mints a namespace under DATA_SOURCE_CREATE,
  bypassing NAMESPACE_CREATE; (c) regenerateDataSourceToken is a
  destructive rotation with NO grace period — the collector still using
  the old token starts 401-ing the instant the UPDATE commits; (d) under
  auth.type=DISABLED all four mutating verbs (register / update /
  delete / regenerate-token) are anonymously reachable. Secondary:
  deleteDataSource orphans the token row (token table has no deleted_at,
  no GC path) and leaves the FTS vector uncleared; the 200-vs-201 status
  drift spans register AND update; the list endpoint leaks the real last
  6 chars of every token to read-only users and is itself ungated.
