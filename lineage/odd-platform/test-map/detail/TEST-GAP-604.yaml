proposed_action: |-
  Unit + integration test. (a) Stub a Cognito User Pool with Google as a federated IdP. (b) Authenticate via the Cognito → Google chain. (c) Trigger logout via the ODD endpoint. (d) Assert the 302 Location is Cognito's `/logout?client_id=...&logout_uri=...` (correct). (e) Assert NO outbound HTTP to `accounts.google.com/logout` or similar Google signout endpoint. (f) Pin the local-signout-only behaviour; future REFACTOR introducing federated-signout enumeration flips assertions.
