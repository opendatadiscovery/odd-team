behaviour: 'Soft-delete restore semantics — ingesting an entity whose previous row
  had `status=DELETED` re-instates it AND restores its relations (lineage, DQ-test
  relations, etc.) via IngestionServiceImpl.java:127-131 + DataEntityInternalStateServiceImpl.restoreDeletedDataEntityRelations
  + dataEntityStatisticsService.updateStatistics. The path is exercised only INDIRECTLY.
  No direct test asserts: (a) restored entity is searchable, (b) previously-broken
  lineage edges are restored, (c) statistics counters increment correctly, (d) no
  activity event is emitted (per ActivityIngestionRequestProcessor.java:27 — only
  `request.getNewIds()` excludes restored). Silent restore means operators who soft-deleted
  an entity and forgot to update their collector will see it silently return.'
