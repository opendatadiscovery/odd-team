name: |-
  deleteTag cascade ASYMMETRIC — tag_to_dataset_field rows NOT cleaned up (HIGH severity, batch W primary source; STRENGTHENED batch VAL-LSN-019 with TagServiceImpl service-tier primary source)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-08
description: |-
  HIGH-SEVERITY INVARIANT, batch 2026-05-20W — surfaces the
  cascade asymmetry in TagServiceImpl.delete that leaves orphaned
  tag_to_dataset_field rows referencing a soft-deleted tag id.
  STRENGTHENED batch VAL-LSN-019 (2026-05-20) — TagServiceImpl
  promoted to SERVICE-TIER PRIMARY SOURCE; the full 6-step delete
  pipeline + the omission are now triple-anchored across
  controller + service + repository sidecars.

  THE CASCADE PATH — what TagServiceImpl.delete actually does
  (TagServiceImpl.java:57-70, @ReactiveTransactional):

    Step 1: fetch the tag DTO via reactiveTagRepository.getDto(tagId)
            and validate !external (line 62-63). External tags
            (any tag_to_data_entity row with external=true) are
            rejected with BadUserRequestException — these are
            collector-owned tags that UI cannot delete.

    Step 2: HARD-delete tag_to_term rows via
            reactiveTagRepository.deleteTermRelations(tagId)
            (ReactiveTagRepositoryImpl.java:280-286). This removes
            the term-side bindings.

    Step 3: HARD-delete tag_to_data_entity rows via
            reactiveTagRepository.deleteDataEntityRelations(tagId)
            (ReactiveTagRepositoryImpl.java:235-241). This removes
            the data-entity-side bindings. Steps 2 and 3 run
            concurrently via Flux.zip (line 64-65).

    Step 4: SOFT-delete the tag row via the inherited
            ReactiveAbstractSoftDeleteCRUDRepository.delete (UPDATE
            tag SET deleted_at = NOW()).

    Step 5: Update term-side search vectors via
            reactiveTermSearchEntrypointRepository.updateChangedTagVectors(tagId)
            (line 68-69).

  WHAT IS MISSING — the asymmetry:

    `ReactiveTagRepositoryImpl.deleteDatasetFieldRelations(tagId)`
    EXISTS at lines 299-306 — fully implemented method that would
    HARD-delete tag_to_dataset_field rows. But it is NOT INVOKED
    from TagServiceImpl.delete. Verified by Grep:
    `deleteDatasetFieldRelations` returns no caller in TagServiceImpl.

    NEW BATCH VAL-LSN-019 — the absence is now confirmed by reading
    TagServiceImpl end-to-end (line-by-line for 168 lines). The
    Flux.zip at line 64-65 carries exactly two relation-delete calls
    (deleteTermRelations + deleteDataEntityRelations); the
    deleteDatasetFieldRelations method at the repository is uncalled
    from this service file. The TagServiceImpl sidecar
    explicitly enumerates the cascade asymmetry as
    bugs_limitations_corner_cases[delete cascade does NOT touch
    tag_to_dataset_field — the Flux.zip at :64-65 hard-deletes two
    relation tables; the third relation table is silently skipped].

    A tag attached to dataset fields via the side-door
    DATASET_FIELD_TAGS_UPDATE path (DatasetFieldServiceImpl invokes
    tagService.getOrCreateTagsByName, then writes
    tag_to_dataset_field rows), when deleted via this controller,
    leaves orphaned tag_to_dataset_field rows referencing the
    soft-deleted tag id.

  WHY THIS IS HIGH (not MEDIUM) — the load-bearing observations:

    1. The orphan rows are UI-INVISIBLE — reads via
       ReactiveTagRepositoryImpl.listDatasetFieldDtos filter with
       addSoftDeleteFilter on the join (lines 84-98), so the
       orphaned rows are NOT visible in the UI tag list for that
       dataset field. But they PERSIST in the DB indefinitely.

    2. NO HOUSEKEEPING JOB exists to clean them up. Verified by
       cross-checking the HousekeepingTTLProperties + the 5-job
       SchedulerConfig — none scan for orphan tag_to_dataset_field
       rows.

    3. The orphans accumulate WITH NO RETENTION LIMIT. Long-running
       deployments accumulate tag_to_dataset_field rows pointing at
       soft-deleted tags monotonically. Database disk usage grows
       silently.

    4. Future garbage-collection migrations would need to address
       this; right now no cleanup task exists. The pattern is
       SAME-CLASS as the orphan TOKEN rows after collector
       soft-delete (collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
       invariant — that one is also unbounded; same architectural
       fingerprint).

    5. The cascade ASYMMETRY is invisible to operators — the live
       /features/data-discovery/tagging page does NOT mention any
       cascade behaviour. An operator deleting a tag via the
       Management → Tags tab has no way to know SOME bindings are
       cleaned up (tag_to_term, tag_to_data_entity) and OTHERS are
       not (tag_to_dataset_field).

    6. The bug is NOT visible from any single layer — only by
       cross-referencing the TagServiceImpl.delete method against
       the available repository methods. A maintainer working on
       TagServiceImpl would not realize deleteDatasetFieldRelations
       exists. A maintainer working on ReactiveTagRepositoryImpl
       would see the unused method but might think it's reserved
       for future use.

    7. NEW BATCH VAL-LSN-019 — the bug COMPOUNDS with the
       asymmetric search-vector refresh (THIS BATCH sibling
       invariant `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`).
       The delete method has TWO known asymmetries: cascade incomplete
       AND search-vector refresh incomplete. The delete path is the
       single most-asymmetric method in TagServiceImpl. A future
       maintainer extending the cascade to include tag_to_dataset_field
       SHOULD also update the search-vector refresh path in the same
       commit.

  THE THREE TAG-RELATION TABLES — relationship to architecture:

    tag_to_data_entity: HARD-deleted on tag-delete (cleaned up).
                        Created via DATA_ENTITY_TAGS_UPDATE side-door
                        OR ExternalTagIngestionRequestProcessor.

    tag_to_term:        HARD-deleted on tag-delete (cleaned up).
                        Created via TERM_TAGS_UPDATE side-door.

    tag_to_dataset_field: NOT HARD-DELETED on tag-delete (ORPHANS).
                          Created via DATASET_FIELD_TAGS_UPDATE side-door
                          (the F-004 column-level write surface).

    The three tables exist as parallel binding edges — same
    architectural class. The cascade on delete is symmetric for
    TWO of three; the third is the bug. This is a code-omission
    bug, not an intentional design (no comment in the file frames
    the omission as deliberate).

  THE COMPOUND WITH PER-ENTITY SIDE-DOORS (cross-link):

    The DATASET_FIELD_TAGS_UPDATE side-door creates novel tag
    directory rows via tagService.getOrCreateTagsByName (a Permission
    bypass — see namespace-create-tag-create-side-doors invariant).
    The same per-entity-tag-editor can:
      (a) MINT new global Tag rows without TAG_CREATE (the side-door
          write path),
      (b) BIND them to dataset fields via tag_to_dataset_field,
      (c) When the operator (with TAG_DELETE) deletes the tag, the
          tag_to_dataset_field rows DO NOT get cleaned up.
    The per-entity-tag-editor's actions persist as orphan rows after
    the operator's cleanup; the operator believes the tag is gone,
    the orphan rows say otherwise. Combined with the open-read on
    getPopularTagList (any authenticated user enumerates the tag
    directory regardless of TAG_* permissions), the per-entity-editor
    can re-discover their own orphan-bound dataset fields by guessing
    soft-deleted tag ids.

  SEVERITY HIGH — operational (unbounded DB growth) + integrity
  (orphan binding rows referencing soft-deleted parents) + audit
  (no record of which dataset fields had which tag attached at
  delete time, since tag_to_data_entity emits TAG_ASSIGNMENT_UPDATED
  Activity but tag_to_dataset_field does NOT — same audit-log
  asymmetry as the data_source side).

