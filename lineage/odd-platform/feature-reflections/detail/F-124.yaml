# Cross-Provider ADMIN Promotion Semantics — product-owner reflection

## product_owner_narrative

**What the feature is.** "ADMIN Promotion Across Auth Providers" (P-09:F-009) is the operator-facing surface for the single most consequential decision in an ODD deployment: *which authenticated humans get platform-administrator privilege.* An ODD ADMIN can reach every `*_MANAGE` endpoint in `SecurityConstants.SECURITY_RULES` — RBAC policy authoring, role binding, owner administration, the lot (per `LDAPSecurityConfiguration@L51`:security.authorization_assertions[2]). The feature has no single screen and no single config key; it is a *family* of six structurally different admin-detection mechanisms — one per supported identity source — plus a seventh, distinct shape under `LOGIN_FORM` where admin is granted by binding the seeded `Administrator` Role to a user's Owner through the Management UI rather than by any config (per F-124 facet `login_form_admin_via_seeded_administrator_role_not_via_config`). The audience is the `platform-operator` (per system-mission P-09 audiences), not the end user.

**How an operator interacts with it.** There is no "make this person an admin" button anywhere in the chain. The operator edits `application.yml` (or env vars / Helm values) under `auth.ldap.groups.admin-groups` (LDAP) or `auth.oauth2.client.{id}.admin-groups` / `.admin-principals` / `.admin-attribute` (OAuth2), and the admin decision is then computed *per login* by the auth-mode-specific code path: `LDAPSecurityConfiguration.authoritiesMapper` for LDAP (per `LDAPSecurityConfiguration@L51`:understanding), or the matched `*UserHandler.enrichUserWithProviderInformation` for each OAuth2 provider (per `GithubUserHandler`:understanding, `GoogleUserHandler`:understanding). The inputs are operator config + the claims/groups the external IdP returns; the output is a `USER` or `ADMIN` `SimpleGrantedAuthority` materialised into the request's `SecurityContext`. Because this is config + external-IdP-claim driven, the **operator's mental model** — not an on-screen affordance — is the product. A senior product owner reflecting on this feature asks the operator's questions: *"If I list a group in admin-groups, exactly which directory groups does that match? If I pick Okta, do my admin knobs work? If I omit a field, will the platform tell me, or silently give me a broken deployment?"* Those questions are this reflection's hypothesis seeds.

**The working parts.** Six mechanisms, each with its own matching rule (per F-124 chain hop 2 + the per-handler sidecars): (a) **LDAP** — the directory-returned authorities are matched against `admin-groups` via `OperationUtils.containsIgnoreCase` (`LDAPSecurityConfiguration.java:96`); (b) **Cognito** — `cognito:groups` claim exact-matched against `admin-groups`; (c) **GitHub** — a two-pass GitHub REST API flow (`/user/orgs` then `/user/teams`) gating ADMIN by team-name within `organization-name`, plus an `admin-principals` fast-path that bypasses the org gate entirely (per `GithubUserHandler`:invariants); (d) **Google** — `allowed-domain` (the `hd` ID-token claim) plus `admin-principals` matched against the `email` claim; `admin-groups` is silently ignored (per `GoogleUserHandler`:invariants[6]); (e) **Azure** — a `roles` (or `groups`) claim exact-match; (f) **ODD_IAM** — a boolean `admin-user-info-flag` claim. The `provider` field that selects the mechanism is a free `String`, not an enum, so a typo routes silently to generic OIDC (per `ODDOAuth2Properties`:invariants[2]).

**The integration story.** F-124 PRODUCES the authority that F-006 (RBAC Policy Lifecycle) consumes as the gate-pass and that F-011 (Principal-to-Owner Resolution) consumes when it resolves the `(username, provider)` tuple to an Owner (per F-124 cross_pillar_relationships + `GithubUserHandler`:coupling). The three are complementary: F-124 mints the ADMIN authority, F-011 maps the identity to a catalog Owner, F-006 enforces what the authority can do. The same `OperationUtils.containsIgnoreCase` helper is shared across LDAP and GitHub admin matching (per `GithubUserHandler`:coupling) — which makes the helper's *actual* semantics load-bearing for two providers at once.

**Edge cases an operator demo would hit.** The platform fails *silently* in five distinct ways an operator cannot diagnose from logs or boot output: GitHub missing the `read:org` scope (no admin, no clue), Azure omitting `logout-uri` (NPE 500 on first logout), Okta/Keycloak users never reaching ADMIN (the handlers don't exist), a `provider:` typo routing to generic OIDC, and an LDAP deployment with `admin-groups` unset where *no one* can become admin (per F-124 facets + the sidecars). Crucially, this reflection also finds that the feature-flow's stated HIGHEST-severity *over*-promotion bug (LDAP substring matching) **does not exist in the code** — the helper is full-string equality. The feature's promise layer is therefore mostly about *under*-promotion and *silent* failure, not over-promotion.

