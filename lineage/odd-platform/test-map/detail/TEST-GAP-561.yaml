proposed_action: |-
  Testcontainers cross-cutting integration test. (a) Seed user_owner_mapping (alice, null, X) AND (alice, GITHUB, Y) — two ACTIVE mappings, distinct owners. (b) Create an alert with `STATUS_UPDATED_BY = 'alice'`. (c) Call ReactiveAlertRepositoryImpl.listAllWithStatusOpen / list — the LEFT JOIN matches BOTH user_owner_mapping rows. Assert: the alert appears TWICE in the result with different owner_id values. (d) Mirror for ActivityRepositoryImpl with `CREATED_BY = 'alice'`. (e) Mirror for OwnerAssociationRequestRepository. (f) Assert each cross-pillar surface is corrupted. This pins the CRITICAL cross-provider row-duplication contract. Pair with TEST-GAP-553. Future REFACTOR-NNN adding provider equality clauses to all 4 JOINs would FLIP all four asserts to expect single-row results.
