      gate; both must succeed for the principal-to-Owner association
      UI to mount) + AppInfoController.java:18 (no `@Value` default;
      cross-link to batch-T AppInfoController finding) + the four
      `@ConditionalOnProperty(value="auth.type", havingValue=...)`
      SecurityConfigurations (no `matchIfMissing` on any per
      REFACTOR-073). Cross-link: F-001/F-003 batch-ZA facets pin the
      same gating predicate at the Popular-column surface; this F-011
      facet pins the SAME gate at the OwnerAssociation surface (the
      principal-to-Owner association UI). The Overview gate is the
      common ancestor of BOTH downstream features. Severity: HIGH.
      No probe required — the four failure modes are structurally
      anchored at file:line.
