notes: |-
  Coherence (Rule 6): No existing concept describes this pattern
  outside this invariant. Pure batch-ZH net-new + batch-ZI
  extension. The 5-instance triangulation across four different
  pillars (P-01 Discovery, P-02 Data Modelling, P-06 Glossary, P-08
  Management) confirms the pattern is conventional — additional
  route modules with `:id` params likely exhibit the same drift but
  the batches did not enrich them.

  Surfaced for future batches: any new `use*RouteParams` hook
  authored in a route module SHOULD include an isNaN guard or
  honest Partial<>-aware return type. A repository-wide audit + uniform
  fix would close the foot-gun class in one batch.

  Batch ZI's queryExamples instance is the SHARPEST observable
  failure mode (AppLoadingPage hangs indefinitely on NaN-id URLs)
  — recommend prioritising the queryExamples fix as a leading
  example. Same fix shape applies to the other four.
