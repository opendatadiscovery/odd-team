    verdict: contradicted
    actual_behavior: |-
      IntegrationCodeSnippetWithForm.tsx:69-77 renders any staticValue argument as
      `<input {...register(arg.parameter)} value={arg.staticValue} style={{display:'none'}} />`.
      The field is registered into the form (so its value reaches the template) but is
      `display:none` — the operator NEVER sees it. The doc's word "pre-fills" implies a visible
      pre-populated field; the implementation injects it invisibly. There is no badge, preview,
      or "static substitutions" disclosure block. This is the platform_url-injection mechanism:
      the doc confirms "exactly one parameter is wired up this way: platform_url, read from
      odd.platform-base-url".
    evidence:
      - sidecar: "(unresolved — source_read_for_validation)"
        section: render
        cite: "IntegrationCodeSnippetWithForm.tsx:69-77 (display:none registered input)"
        note: "static arg injected but invisible; no operator-facing disclosure"
      - sidecar: "(doc cross-reference)"
        section: doc
        cite: "WebFetch docs.opendatadiscovery.org/integrations/integrations/integration-wizard"
        note: "doc says 'pre-fills any static parameter' — implies visible; code hides it"
    operator_visible_failure: |-
      (1) Under a misconfigured `odd.platform-base-url` (the doc explicitly warns operators to
      set it before opening the wizard; F-033 records a placeholder default), the operator copies
      a snippet that silently bakes in a wrong/placeholder platform URL — the collector then
      cannot reach the platform at run time, and the operator has no on-screen signal at copy
      time that a URL was even injected. (2) Trust/verifiability gap: an operator who wants to
      confirm exactly what is in the snippet before pasting cannot see the injected value in the
      form; they only see it if they read the rendered Markdown carefully, where it is mixed into
      the YAML. (3) The doc says "pre-fills", the operator looks for a pre-filled field, finds
      none, and may conclude the static parameter is missing.
