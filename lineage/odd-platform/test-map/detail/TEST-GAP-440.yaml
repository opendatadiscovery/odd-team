behaviour: |-
  Mount-once fetch correctness + lifecycle-fetch-cadence. (a) The popular thunk fires exactly once on OwnerEntitiesList mount with { page: 1, size: 5 } and NOT on remount-with-same-props. (b) Mounting then unmounting then remounting OwnerEntitiesList within the same Redux session fires the thunk again (per the useEffect [] deps). The current behaviour is intentional (per implicit_adrs.[0] — "fetch once per mount, then the slice acts as the cache"). A future React Query / RTK Query refactor introducing staleTime would change this; the regression test locks in current behaviour and surfaces drift.
