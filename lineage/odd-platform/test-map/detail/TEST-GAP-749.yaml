behaviour: |-
  **CRITICAL — `regenerateDataSourceToken` is the ONE non-transactional mutation in DataSourceServiceImpl (lines 98-106), creating a split-state failure where the operator receives a NEW token in the API response while the DB retains the OLD token.** Primary-source confirmed in batch-W DataSourceController sidecar:

  - `DataSourceServiceImpl.create` (line 52) — IS `@ReactiveTransactional`
  - `DataSourceServiceImpl.update` (line 69) — IS `@ReactiveTransactional`
  - `DataSourceServiceImpl.delete` (line 86) — IS `@ReactiveTransactional`
  - **`DataSourceServiceImpl.regenerateDataSourceToken` (lines 98-106) — is NOT `@ReactiveTransactional`** (verified by sidecar primary-source line-by-line read of the file)

  The service method chain: `getDto(id)` → `tokenGenerator.regenerateToken(existingTokenPojo)` (in-memory) → `tokenRepository.updateToken(newToken)` (DB write).

  **Split-state failure scenario**:
  1. Step 1 succeeds: `getDto(id)` resolves the existing datasource + token.
  2. Step 2 succeeds: `tokenGenerator.regenerateToken` creates a new TokenDto in memory.
  3. Step 3 fails: `tokenRepository.updateToken(newToken)` raises a transient DB error (network blip, statement timeout, lock conflict).
  4. **The reactive chain bubbles a 500 to the controller.** The Mono fails after step 3 — but **the NEW TokenDto has already been emitted into the response stream** if the chain composition uses `.map(ResponseEntity::ok)` before the DB write completes. Per the controller code at lines 53-59, the response IS constructed from the service's emitted token DTO. The exact failure mode depends on the WebFlux response buffering: a partial response with the new token may reach the client before the 500 propagates.
  5. **The OLD token remains in the DB.** The collector authenticating with the OLD token continues working. The operator (who captured the NEW token from the partial response) tries to use it — and discovers the collector is still authenticating with the OLD token. **There is no mechanism to recover the in-memory NEW token** because it never persisted.

  **Why CRITICAL not LOW (the sidecar's own rating)**: this gap is INDIVIDUALLY low (rare failure mode), but compounds CRITICALLY with two other adjacent findings:
  - **TEST-GAP-750 (this batch — end-to-end plaintext token chain at controller tier)**: the new token IS emitted plaintext in the response body. A 500-after-emit can leak the unused token via response logging / APM tools while DB still holds the OLD token. The leaked token has no counterpart — it can't be used to authenticate.
  - **Per the sidecar's `concept-link to shared-secret-tokens-stored-plaintext`**: the operator's only recovery is to retry the rotation. But retries are NOT idempotent — each retry generates a fresh new token. The DB write that eventually succeeds reflects the LATEST token, but the operator may have copied an earlier one. **Multiple failed-then-retried rotations create a sequence of in-memory tokens that NEVER reach DB but DO reach the response stream.** Forensic investigation cannot reconstruct which token reached which response.
  - **The destructive rotation has no grace period (per sidecar implicit_adrs.[3])**: there is no "old token still valid for N hours" — once the DB write succeeds, the old token is dead. So the operator's mitigation window is exactly the duration of the failing rotation: zero.

  **Test gap shape**: regression-pin asserting: (a) the service method DOES NOT have `@ReactiveTransactional`; (b) on simulated DB-write failure, the operator's response carries a token that is NOT in the DB; (c) the OLD token still authenticates against `IngestionDataSourceFilter`; (d) a follow-up successful retry creates a DIFFERENT new token, breaking the operator's captured-from-failed-response token. The current state is PINNED to make the design intent visible — any future maintainer adding `@ReactiveTransactional` will see the test invert (the response no longer carries an uncommitted token).
