proposed_action: |-
  Add `TagControllerPopularityDriftTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Promote probe P-010 to CI:
  1. `getPopularTagList_directoryLargerThanSize_returnsOldestByIdNotMostPopularByCount_pinsLSN019` — seed 35 tags; attach data-entity / dataset-field relations so the 5 YOUNGEST tags each have a higher usage count than any of the oldest 30; `GET /api/tags?page=1&size=30`; assert the 30 returned tag ids are the 30 LOWEST ids and the 5 youngest (most-popular) ids are absent.
  2. `getPopularTagList_directorySmallerThanSize_ordersByCountDescCorrectly_pinsNonDriftedCase` — seed 10 tags with distinct usage counts; `GET /api/tags?size=30`; assert all 10 returned AND ordered by count desc (the non-truncated case where popularity ordering DOES hold).
  3. `getPopularTagList_pageInfoTotalReflectsFullDirectory_notPageSize` — assert `pageInfo.total` equals the full filtered directory size even when the page is truncated (the total IS correct; only WHICH rows drift).

  When the implementation is fixed (count-ordering moved inside the paginate window), test #1 inverts to assert the 5 most-popular ARE returned. Pair with a DOC-NNN to reconcile the `openapi.yaml:345` description.
