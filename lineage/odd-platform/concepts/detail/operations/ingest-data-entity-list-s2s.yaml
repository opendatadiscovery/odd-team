name: Ingest Data Entity List (S2S)
canonical_in_docs: true
canonical_candidate: false
description: '`POST /ingestion/entities` — canonical S2S ingestion entry point. Path
  is in `SecurityConstants.WHITELIST_PATHS` (`/ingestion/**`), so exempted from the
  UI authentication chain in every mode. Authentication delegated EXCLUSIVELY to the
  path-scoped `IngestionDataEntitiesFilter` (gated by `auth.ingestion.filter.enabled`,
  defaults FALSE). Bundled deployment ships UNAUTHENTICATED. Controller is a 4-line
  proxy: deserialise `Mono<DataEntityList>` (carrying `data_source_oddrn` + `items:
  List<DataEntity>`), reject empty `items` with 400 (`BadUserRequestException`), delegate
  to `IngestionServiceImpl.ingest(...)` inside `@ReactiveTransactional`, return 200
  OK (NOTE: spec declares 201 — 2-sidecar status-code drift). Datasource scoping is
  PAYLOAD-DRIVEN: the service resolves the datasource via `dataSourceRepository.getIdByOddrnForUpdate(dataEntityList.getDataSourceOddrn())`
  — the caller chooses by writing the ODDRN in the body. Dedup-by-ODDRN at the data
  layer (existing entities UPDATEd, new ones INSERTed) — idempotent at the upsert
  level.'
