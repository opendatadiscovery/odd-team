### bug_candidates
- hypothesis_id: H-001
  severity: HIGH
  one_line: |-
    Lookup Tables list silently caps at 30 rows — InfiniteScroll scrollableTarget
    'directory-entities-list' references a non-existent DOM id (should be
    'lookup-tables-list'); fetchNextPage never fires; 100% of P-03's sole UX is
    degraded for any >30-table tenant.
  dedup_status: net_new
  recommended_log_as: PLT-NNN
  proposed_fix_anchor: |-
    LookupTablesList.tsx:53 — rename scrollableTarget 'directory-entities-list' ->
    'lookup-tables-list' to match the container id at :51. Regression-resistant
    fix: pair the container id and scrollableTarget via a single shared constant so
    they cannot drift again. Convergent with scanner finding F-058a (docs/coverage/
    undocumented-features, SR-20260527T1800Z) — independent re-derivation, raises
    confidence; that finding is a scanner annotation, not yet a filed item.
- hypothesis_id: H-005
  severity: MEDIUM
  one_line: |-
