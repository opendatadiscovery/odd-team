# Ingestion-replace destruction surface (Batch Ingestion / S2S API) — product-owner reflection

## product_owner_narrative

Batch Ingestion is the front door through which every piece of metadata enters Open Data Discovery. It is the platform's largest surface boundary by code: a collector (or a push adapter, or a custom script speaking the ODD Specification) sends a `DataEntityList` payload to `POST /ingestion/entities`, names the datasource it is writing into via a `data_source_oddrn` field in the body, and the platform writes the entities, their metadata, their lineage edges, their data-entity-group bindings, and their data-quality-test relations into that datasource's namespace (per the IngestionServiceImpl sidecar `understanding` + the feature-flow chain). A sibling endpoint, `POST /ingestion/datasources`, lets a collector register the datasources it owns before it starts ingesting into them. The product promise — what the live integration docs and the Catalog Overview imply, and what every collector author expects from a "re-publish my current view" API — is **merge**: a collector publishes whatever subset of fields it scraped this tick, and the platform integrates that with what it already knew (per F-008 `description`, the user-observable-promise paragraph).

A platform operator interacts with this feature in two seats. As the *consumer* of ingestion, they watch their catalog fill up — datasources appear in the Management → Datasources tab, entities appear in Discovery search and the Directory. As the *administrator* of the credential, they use the Management → Collectors tab (the CollectorsList component) to register a collector, copy its 40-character bearer token once on creation, and later rotate or revoke it (per the CollectorsList sidecar `understanding`). The token they copy is the secret a collector presents on every ingestion call.

The working parts the operator would expect to be able to reason about: an `auth.ingestion.filter.enabled` toggle that "locks down ingestion" (per the property name); a per-collector token that authenticates and authorises a collector to write only to its own datasources; merge semantics so a flaky collector tick never loses catalog state; and a re-registration path so a collector can update a datasource's connection details when a hostname changes. A senior product owner would also expect the audit trail to record who wrote what, and the security posture to be consistent across the platform's auth modes.

This feature feeds Discovery (P-01), Data Quality (P-04), Lineage (P-05), and Alerting (P-07) — the entities it writes are the substrate every other pillar reads (per system-mission.md cross-pillar relationships). It feeds from Management (P-08, which issues the tokens) and is gated by Security (P-09, the ingestion filter). The system-mission file flags the load-bearing implicit decision: *"datasource scoping is payload-driven, NOT principal-driven"* — a security-relevant choice the operator cannot see from any screen.

The edge cases a product owner would highlight in a demo are exactly the ones that turn out to be load-bearing and surprising: what happens on the SHIPPED default deployment (it is wide open — the filter is off, and every UI auth mode whitelists `/ingestion/**`); what happens when a collector re-publishes a partial view (it silently deletes the omitted metadata and lineage — REPLACE, not merge); what happens when a collector tries to update a datasource's `connection_url` (it cannot — only name and description propagate, and the operator's own UI edits to name/description are silently overwritten on the next collector startup); and what happens to the token an operator carefully rotates (on the default deployment it has zero security effect, because the write path is anonymous regardless). The live `enable-security` doc page (WebFetched 2026-06-01, status 200) has been substantially improved and now documents the auth-coverage asymmetry honestly — but it remains silent on the storage shape of the token and on the destruction-replace semantics.

## hypotheses

- id: H-001
  hypothesis: "When the platform is deployed with its shipped defaults (auth.type=DISABLED, auth.ingestion.filter.enabled=false) and reachable on a network, an unauthenticated caller who knows or guesses a datasource's ODDRN can POST /ingestion/entities and write metadata/entities into that datasource — and the calling identity is in no way required or checked."
  derivation: "Endpoint shape (POST /ingestion/entities, no auth element in the contract) + pillar P-10 maintainer-note 'datasource scoping is payload-driven, NOT principal-driven' + the filter being @ConditionalOnProperty default-false."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The hypothesis predicts a wide-open endpoint, and the implementation confirms exactly that — which makes the SECURITY EXPECTATION (a write endpoint should require a credential) contradicted by the shipped default. IngestionDataEntitiesFilter is registered ONLY when auth.ingestion.filter.enabled=true (no matchIfMissing); application.yml:48 ships the literal `false`, so the bean is not registered. Every UI auth mode independently permits the path: LoginFormSecurityConfiguration.java:50 lists /ingestion/entities; SecurityConstants.WHITELIST_PATHS line 96 contains /ingestion/** for OAUTH2/LDAP; DisabledAuthSecurityConfiguration.java:13-18 calls .anyExchange().permitAll(). IngestionServiceImpl.ingest does no principal check (sidecar invariants — "No principal check at this layer", line 95-151 reads only the payload-resolved datasource id). So on the bundled deployment there is zero credential check anywhere in the chain.
    evidence:
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: bugs_limitations_corner_cases[0]
        cite: "IngestionDataEntitiesFilter.java:20 + application.yml:46-48 + SecurityConstants.java:95-96 + DisabledAuthSecurityConfiguration.java:11-19"
        note: "Default-OFF + all four UI modes whitelist the path = no auth on the bundled deployment."
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: "concepts.invariants (No principal check at this layer)"
        cite: "IngestionServiceImpl.java:68 + 95-151"
        note: "Service resolves the datasource from the payload ODDRN only; no SecurityContext, no caller-to-datasource binding."
    operator_visible_failure: |
      (1) Catalog poisoning: any party with network reach injects spec-valid metadata into existing datasources; consumers see it as authoritative. (2) Combined with H-013 (REPLACE semantics), the same anonymous caller can ERASE a datasource's metadata and lineage by re-ingesting an empty/partial payload. (3) An operator who enabled OAuth2 for the UI reasonably believes the platform is locked down — but the write endpoint is still open (the two auth surfaces are independent). The de-facto control is the network perimeter, which is invisible from the platform's own configuration.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate

