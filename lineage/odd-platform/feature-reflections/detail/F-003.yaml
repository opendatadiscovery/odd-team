- id: H-005
  hypothesis: "When a malicious or careless caller scripts repeated detail-reads of one entity, that entity is NOT promoted to the top of the Popular column (the ranking resists inflation)."
  derivation: "A 'Popular' surface a product owner presents as trustworthy implies anti-abuse; negative-space test of the ranking's integrity."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The ranking is monotonically pumpable. (a) getDataEntityDetails increments view_count on every
      successful read (ReactiveDataEntityRepositoryImpl.java:173-180) with no rate-limit, no idempotency
      key, no per-caller cap. (b) listPopular ranks exclusively by view_count DESC (line 633). (c) Neither
      endpoint carries an authorization gate beyond .authenticated(), and under auth.type=DISABLED (the
      shipped default) the producer endpoint is anonymously reachable. (d) No anti-abuse signal exists
      anywhere in the chain (no IP throttle, no sampling, no time-decay, no distinct-viewer count, no index
      on view_count). Worse, opening a detail page registers +2 not +1, because the SPA's useEffect
      dependency array re-fires the fetch (LSN-017 double-fetch, empirically pinned by probe P-004 per
      PLT-104). A scripted loop pushes any chosen entity to position 0.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: bugs_limitations_corner_cases[0]
        cite: "ReactiveDataEntityRepositoryImpl.java:633 + :173-180; DataEntityController.java:307-313"
        note: "Sole orderBy + unconditional increment + no rate-limit on either endpoint = trivially inflatable. Confirms REFACTOR-201."
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: downstream_side_effects
        cite: "DataEntityDetails.tsx:56-64"
        note: "LSN-017 double-fetch makes a single page-open register +2 view_count."
    operator_visible_failure: |
      (1) The home-page first impression of every ODD deployment is publicly manipulable: an attacker
      promotes a deceptively-named entity (e.g. one mimicking a credentials store) to the top of Popular
      where new users click first. (2) The signal is doubly distorted: +2 per legitimate open means the
      displayed-and-ranked count is roughly 2x actual opens, so even honest comparison between entities
      is skewed. (3) Under DISABLED (default) no authentication is even required to pump the counter.
      (4) Forensic confusion — a count cannot distinguish operator views from scripted inflation.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

