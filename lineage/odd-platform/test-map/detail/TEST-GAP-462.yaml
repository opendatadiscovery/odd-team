proposed_action: |-
  Unit test on AlertNotificationMessageProcessor with three @Mock senders [slack, webhook, email] where webhook.send is configured to block for 500ms (Thread.sleep). Measure wallclock for one process(...) call. Assert total elapsed time >= 500ms (proves sequential) AND assert order: slack invoked before webhook invoked before email. Pins the sequential contract; when parallelism lands (thread pool / reactive concatMap → flatMap conversion), this test must be updated AND the new contract pinned.
