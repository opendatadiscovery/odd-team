description: |-
  NEW OPERATION, batch 2026-05-19M (controller-method PRIMARY SOURCES at
  getMyObjectsWithUpstream + getMyObjectsWithDownstream) — the
  two-phase derived-set computation that powers
  GET /api/dataentities/my/upstream and GET /api/dataentities/my/downstream.
  **Phase 1 (anchor set resolution)**: resolve the caller owner via
  authIdentityProvider.fetchAssociatedOwner() at
  DataEntityRelationsServiceImpl.java:26 then list the owner's owned data
  entities via dataEntityRepository.listByOwner(o.getId()) (no-page overload
  at line 27); project to oddrns and collect into a Set<String>. **Phase 2
  (derived set expansion)**: one-hop lineage traversal via
  lineageRepository.getLineageRelations(oddrns, LineageDepth.empty(),
  UPSTREAM|DOWNSTREAM) at line 34 — the LineageDepth.empty() encoding
  produces depth=-1 which makes the recursive CTE termination predicate
  tDepth.lessThan(lineageDepth.getDepth()) at
  ReactiveLineageRepositoryImpl.java:174 always-false (the seed step's
  tDepth=0 is NOT less than -1), so the recursion terminates after the
  seed step — single-hop only. Flatten edges via
  flatMap(lp -> Flux.just(parentOddrn, childOddrn)).distinct() at lines
  35-36; EXCLUDE the anchor set via
  filter(Predicate.not(oddrns::contains)) at line 37 — this is the line
  that makes the response semantically NON-owned. Fetch the resulting
  oddrn list via reactiveDataEntityRepository.listByOddrns(oddrns, false,
  false, page, size) at DataEntityServiceImpl.java:223 — NO owner filter
  at this SQL layer (a pure WHERE DATA_ENTITY.ODDRN IN (?, ...) scan).
  **Three structural posture findings**:
    (a) **Owner-scoping is SINGLE-POINT-OF-FAILURE** — the anchor
        fetchAssociatedOwner is the SOLE owner-defence; everything
        downstream trusts the anchor was correct (REFACTOR-225);
    (b) **OpenAPI summary is the INVERSE of the semantic** — the spec
        declares "data entities OWNED BY current user with upstream
        dependencies"; the response is the entities the user does NOT own
        that are reachable from owned (DOC-GAP-099, 4-angle triangulated);
    (c) **LineageDepth.empty() is fragile magic-number encoding** — the
        boolean empty field is not consumed by the CTE; only the int
        depth=-1 is; a future refactor changing the termination predicate
        silently expands the endpoint to two hops.
  **Severity**: HIGH (latent today; security and contract findings).
