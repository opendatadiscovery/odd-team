behaviour: '**No rate-limiting**: bursty alert events translate 1:1 into outbound
  deliveries. A burst of 10k alerts fires 10k Slack messages + 10k webhook POSTs +
  10k emails. Slack will 429 — platform has no retry-with-backoff; logs the failure,
  drops the alert from that channel.'
test_files_existing: []
test_files_proposed:
