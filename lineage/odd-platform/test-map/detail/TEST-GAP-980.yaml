behaviour: |-
  **`status_reason` PII broadcast across owner boundaries — any authenticated user on the platform can enumerate every Data Quality test's diagnostic stream regardless of which team owns the dataset.** The endpoint is NOT listed in `SecurityConstants.SECURITY_RULES` (verified by grep over SecurityConstants.java:98-355 returning zero matches for `/runs`); the path falls through to `AuthorizationCustomizer.java:29-30` `.pathMatchers("/**").authenticated()`. No owner predicate exists at the SQL layer (`ReactiveDataEntityTaskRunRepositoryImpl.java:161-191` — every WHERE clause is derived from request params, not principal-derived).

  **What leaks**:
  - **Test execution timeline**: the full history of when DQ tests run, succeed, fail across every dataset in the catalog — useful for enumerating which teams have failing pipelines, monitoring schedules, and operational cadence across owner boundaries.
  - **`status_reason` free-form text**: this is the diagnostic field set by the test framework. Common content:
    - **Great Expectations**: failed-row sample values (column names + actual cell values that violated the expectation — directly PII if the violated column is `email`, `phone_number`, `ssn`, `customer_address`).
    - **dbt tests**: failing SQL query text + sample rows from the failure (same PII vector).
    - **Custom frameworks**: free-form operator-supplied diagnostics that may include internal table/column names, query snippets, or pasted-in error logs containing customer IDs.

  **Why CRITICAL not HIGH**:
  - **PII regulatory exposure**: A GDPR-bound operator deploying ODD with a Great Expectations check that fails on PII-bearing columns will leak that PII to every authenticated user on the platform — including users whose own teams have no business with the failing dataset. This is a DPA-violation surface that the live data-quality doc does NOT flag.
  - **Compound with TEST-GAP-979**: even if RUNNING-row 500-bug doesn't fire (operator catches the runs page during a non-RUNNING moment), the security leak persists across every successful page-load.
  - **Cross-pillar amplification**: P-04 (Data Quality) × P-09 (Security) — a maintainer auditing P-04 alone misses the security half; a maintainer auditing P-09 alone misses the operationally-realistic failure mode.

  No test pins this. A pure security-class test fixing the assertion ("bob can read alice's DQ run history with status_reason") locks the current posture; future hardening (add owner predicate at SQL OR add `@PreAuthorize` at controller OR add a redaction filter on `status_reason`) inverts the assertion deliberately.
