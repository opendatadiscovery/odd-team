proposed_action: |-
  Add `SlackNotificationSenderNoSchemeAllowlistRegressionPinTest`. Boot-test parametrised cases analogous to TEST-GAP-807:

  1. `configBootsWithRFC1918SlackURL_beanInstantiatedSuccessfully_pinsSSRFSurface` —
     - `@SpringBootTest` with property `notifications.receivers.slack.url=http://10.0.0.5/internal`.
     - Assert context loads, `SlackNotificationSender` bean exists.
     - PINS RFC1918 acceptance.

  2. `configBootsWithFileSchemeSlackURL_beanInstantiated_pinsLocalFileScheme` —
     - Property `notifications.receivers.slack.url=file:///etc/passwd`.
     - Assert context loads.

  3. `configBootsWithIMDSSlackURL_beanInstantiated_pinsAWSCredentialExfiltrationSurface` —
     - Property `notifications.receivers.slack.url=http://169.254.169.254/latest/meta-data/`.
     - Assert context loads.

  4. `configBootsWithHooksSlackComURL_beanInstantiated_pinsHappyPath` —
     - Property `notifications.receivers.slack.url=https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXX`.
     - Assert context loads, bean exists, no warning.

  5. `configBootsWithRFC1918SlackURL_failsValidation_confirmsFixDirection` — (UPDATE once REFACTOR-NNN lands)
     - After REFACTOR-NNN: assert context fails to load.

  Pair with REFACTOR-NNN (boot-time validation; applies to both Slack + Webhook URL keys) and DOC-GAP-NNN.

  Coherence note (LSN-018 Rule 6): NET-NEW; sister of TEST-GAP-807. No contradiction.
