behaviour: |-
  **WithPermissions affordance-hide unit gap (three permissions: OWNER_CREATE / OWNER_UPDATE / OWNER_DELETE).** OwnersList wraps the Create button in `<WithPermissions permissionTo={Permission.OWNER_CREATE}>` (OwnersList.tsx:88-98); EditableOwnerItem wraps Edit in `OWNER_UPDATE` (EditableOwnerItem.tsx:41-54) and Delete in `OWNER_DELETE` (EditableOwnerItem.tsx:55-74). `WithPermissions.tsx:27-29` returns `null` when `hasAccessTo` is false. The implicit ADR is "HIDE (not disable)" — the buttons are entirely absent from the DOM. No test asserts (a) Create button is present when `OWNER_CREATE`=true; (b) Create button is absent (not greyed-out) when `OWNER_CREATE`=false; (c) Edit button is present per-row only when `OWNER_UPDATE`=true; (d) Delete button is present per-row only when `OWNER_DELETE`=true; (e) the user with ALL THREE permissions sees all three affordances; (f) the user with NONE sees a read-only list with no action buttons. Cross-cuts every Owner-lifecycle mutation surface — the security boundary lives at the backend SECURITY_RULES (not the UI) but the UX contract is the WithPermissions wrap. A regression broadening any of the three permission checks (e.g. accidentally rendering Create without OWNER_CREATE) would surface the create URL to operators without the permission; backend rejects, UI degrades.
test_files_existing: []
