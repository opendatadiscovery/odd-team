proposed_action: |-
  Add `OwnershipListOrderingActivityNoiseTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/activity/handler/` using Testcontainers + a Postgres VACUUM-trigger harness. Three test methods:

  1. **`ownershipUpdate_idempotentReSaveWithVacuumBetween_emitsNoSpuriousActivity`** (HEADLINE):
     - Arrange: seed `data_entity` with 5 ownership rows (owners A, B, C, D, E, with assorted titles). Disable autovacuum on the test schema.
     - Act:
       - Step 1: call `OwnershipServiceImpl.update` with the EXACT current 5-ownership set (idempotent update).
       - Step 2: run `VACUUM FULL public.ownership` (forces row re-layout).
       - Step 3: call `OwnershipServiceImpl.update` again with the SAME 5-ownership set.
     - Assert: count rows in `activity` table where `event_type=OWNERSHIP_UPDATED` AND `data_entity_id=<seed>`; PIN that the count is **at most 1** (the diff filter SHOULD have caught both idempotent updates as no-op).
     - Comment: this test will likely FAIL in the current code (extra spurious row). The failure IS the regression-pin: a future fix that adds ORDER BY to the underlying query makes this test pass; the test then serves as a no-regression guarantee.

  2. **`tagAssignmentUpdate_idempotentReSaveAfterStorageShift_emitsNoSpuriousActivity`**:
     - Same shape, with `DataEntityServiceImpl.upsertTags` and `ReactiveTagRepositoryImpl.listDataEntityDtos` as the queried path.

  3. **`ownershipDtoSerialisation_sortedByName_pinsCanonicalOrder`** (UNIT support):
     - Direct unit test of the serialization layer: confirm that `OwnershipDto` list serialization is sorted (or NOT) by name; lock in the current behaviour as the contract.

  After P-018 measures the empirical hit rate on a production-sized DB, refine the test. Cross-pair with REFACTOR-NNN to add the `.orderBy` clauses (a multi-repository coordinated fix); this test then proves the fix.
