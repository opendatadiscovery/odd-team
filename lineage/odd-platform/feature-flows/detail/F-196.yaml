# CTRIB-010 / odd-platform#1657 (2026-06-13, contrib/CTRIB-010-activity-actor-filter): the LSN-020 'User'
# filter mislabel surfaced in this flow is ADDRESSED in v2 - the feed now exposes THREE explicit actor/asset
# filters (asset Owner=ownerIds / 'Made by (owner)'=userIds, the actor's current owner / 'Made by (user)'=
# usernames -> ACTIVITY.CREATED_BY, immutable, lists unmapped users via GET /api/activity/users), each with an
# (i) popover, and rows show BOTH the username and the current owner name. user_ids kept (un-deprecated). The
# drift facets below are the historical bug record; locks: ReactiveActivityRepositoryActorFilterTest + IT-129.
