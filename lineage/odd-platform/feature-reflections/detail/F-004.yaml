- id: H-007
  hypothesis: "When a viewer opens an entity whose description was authored by a malicious writer with an embedded HTML payload, the platform protects the viewer from script execution by application-layer sanitisation."
  derivation: "A product owner of a multi-tenant catalog expects the platform itself to sanitise untrusted user content before rendering it to other users — defence-by-design, not defence-by-browser."
  seed_source: negative-space + pillar (P-09)
  validation:
    verdict: partial
    actual_behavior: |
      The viewer IS protected from script EXECUTION today (P-009 measured xss_dialog_fired == 0, xss_leak_count
      == 0) — but NOT by the application. The protection is two mitigations external to ODD: Chromium's policy
      of not executing <script> inserted via innerHTML, plus React's attribute filtering stripping event-handler
      attributes on the rehype-raw render path. The application layer applies NO sanitisation at EITHER tier
      (no backend Jsoup/Encode; no UI rehype-sanitize). The promise of application-layer defence is unmet; the
      effective-today protection is fragile (a CSP relaxation, a switch to dangerouslySetInnerHTML, a non-React
      renderer, or an SVG-onload / CSS-expression / href-javascript payload re-opens the surface — none of
      which P-009 currently pins). The fix (rehype-sanitize at the shared Markdown.tsx) closes three of six
      surfaces in one commit (REFACTOR-218).
