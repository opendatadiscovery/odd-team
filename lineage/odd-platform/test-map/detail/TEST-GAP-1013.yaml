behaviour: |-
  **CRITICAL — no React error boundary exists anywhere in the SPA. ANY
  uncaught render-time exception in ANY mounted component produces a
  completely blank page across the WHOLE UI (toolbar + content area
  both disappear). The user has no recovery affordance except a full
  manual browser reload.**

  Verified at primary source 2026-05-26: a repo-wide `grep -rn
  "componentDidCatch|ErrorBoundary|getDerivedStateFromError"` over
  `odd-platform-ui/src/` returns ZERO matches. There is no global
  error boundary in `App.tsx`, no per-route error boundary, no
  per-component error boundary on the dashboard widgets, no fallback
  UI on the toolbar, and no fallback on the route container.
  React's default behaviour when a render-time exception bubbles
  uncaught is to UNMOUNT the entire React tree from the root — i.e.
  the user sees a blank document.body with no DOM content. The
  AppErrorPage widget is NOT a React ErrorBoundary; it is a redux-
  state-keyed presentational banner that depends on the parent
  component still rendering (e.g. DataEntityDetails.tsx:116-119
  conditionally renders <AppErrorPage> on a slice-stored
  fetchDataEntityDetails rejection). If the parent itself throws
  during render, AppErrorPage is never reached.

  Cross-cutting consequences enumerated by sidecars across batches:
  (a) Data Quality Dashboard (F-032 lines 480, 677) — a single
  null-cell crash in the dashboard's render tree blanks the whole UI;
  the fix recommended in F-032 is "ErrorBoundary around the
  dashboard" — none exists.
  (b) DataQualityFilters.tsx:31-39 JSON.parse without try/catch
  (TEST-GAP-925) — malformed query-param JSON throws SyntaxError
  during render, blanks the whole UI.
  (c) AppInfoMenu hover-only menu activation (batch-ZJ
  uncovered_behaviours.[6]) — if i18n key resolution throws (locale
  bundle load race during init), the toolbar itself unmounts.
  (d) Bare /terms or /master-data URLs (batch-ZH/ZI/ZJ) — route
  fall-through produces a blank page; the OPERATOR cannot distinguish
  a runtime crash from a missing route fallback.

  This is the SINGLE LARGEST robustness gap in the SPA's shell layer.
  No test exists for ANY of (i) the absence (current state), (ii) a
  hypothetical future ErrorBoundary catching a child-render exception
  and rendering AppErrorPage as fallback (the desired state), (iii)
  the per-pillar boundaries the dashboards / management surfaces
  ought to have.
