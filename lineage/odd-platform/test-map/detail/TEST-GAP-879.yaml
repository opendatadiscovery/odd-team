behaviour: |-
  **MEDIUM — The `size` parameter on `GET /api/activity` is declared `required: true` in the OpenAPI spec (`components.yaml:4226` — `SizeParam`) but the Java method signature accepts `final Integer size` (boxed, NULLABLE, no `@Max`, no `@NotNull`). Spring's parameter binding uses the boxed type from the generated `ActivityApi` interface — null binding is silently allowed. A caller submitting `size=null` produces `JOOQ .limit(null)` which translates to NO LIMIT clause — an unbounded scan of the activity table for the date window. The OpenAPI spec's `required: true` is NOT enforced at the controller boundary.** This is a DOC-vs-SPEC-vs-CODE inconsistency where the spec contract is one shape and the code accepts another.

  **Primary-source chain**:
  - `ActivityController.java:26` — `final Integer size` (boxed, NULLABLE)
  - `components.yaml:4226` — `SizeParam` declared `required: true`
  - `openapi.yaml:3273` — `$ref './components.yaml/#/components/parameters/SizeParam'`
  - `ActivityServiceImpl.java:179-181` — passes `size` through unchanged to repository
  - `ReactiveActivityRepositoryImpl.java:292` — `.limit(size)` with NO null guard
  - jOOQ documentation: `.limit(null)` translates to "no LIMIT clause"
  - PostgreSQL: with no LIMIT clause, returns ALL matching rows

  **The four boundary cases** (per ActivityController.md:STRESS_A1 + A2 + ReactiveActivityRepositoryImpl.md:A1):
  - `size=null` → `.limit(null)` → no LIMIT clause → full result set scan (potentially millions of rows on a long-running deployment)
  - `size=0` → `LIMIT 0` → empty Flux; controller returns 200 OK with empty array. Harmless degenerate.
  - `size=-1` → `LIMIT -1`; PostgreSQL behavior per docs: rejects negative LIMIT with `LIMIT must not be negative` error → propagates to controller as Reactor onError → ControllerAdvice's generic Exception handler returns HTTP 500. Operator-visible: -1 yields 500, not 400. (Probe P-016 confirms empirically.)
  - `size=Integer.MAX_VALUE` (2.1B) → `LIMIT 2147483647` → Postgres clamps to actual row count; same effect as `size=null`

  **Operator-visible consequences**:
  - **Spec vs code drift**: an OpenAPI-generated SDK that requires `size` (per the spec's `required: true`) may not even compile without the parameter; but a hand-crafted HTTP request omits it without error
  - **Unbounded scan accidentally**: a UI bug that fails to pass size yields a full-table scan rather than a 400 error
  - **Unsupported negative values**: a caller submitting `size=-1` (e.g. as a "no limit" convention) gets HTTP 500 with no useful error message
  - **DoS-amp**: a hostile caller submitting `size=null` or `size=Integer.MAX_VALUE` triggers wide DB scans

  **Why MEDIUM not HIGH**:
  - The behaviour is bounded by Postgres LIMIT semantics and is well-understood
  - The fix is straightforward: add `@NotNull @Min(1) @Max(N)` annotations to the controller parameter OR add programmatic guards in the service
  - We rate MEDIUM because: (a) the spec/code drift is operator-visible and confusing; (b) the unbounded-scan amplification is real; (c) the inconsistency is at a primary API surface

  **Connection to probe P-016**:
  - The sidecar emits P-016 to verify the empirical behavior at each boundary value (null, 0, -1, MAX_VALUE)
  - This TEST-GAP is the regression-pin AFTER P-016 confirms the per-boundary outcomes

  **Connection to existing TEST-GAPs**:
  - There is no prior gap that specifically pins the size REQUIRED-vs-NULLABLE drift
  - TEST-GAP-879 establishes the contract test for the boundary parameter behaviour
