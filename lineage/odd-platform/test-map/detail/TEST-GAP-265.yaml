gap_id: TEST-GAP-265
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java DataEntityController controller-method:createOwnership
surfaced_by:
- createOwnership.md:tests_coverage_semantic.uncovered_behaviours.[5], createOwnership.md:security.known_security_gaps.[0]
behaviour: Owner-name auto-create permission-bypass — a caller with `DATA_ENTITY_OWNERSHIP_CREATE`
  for any single data-entity can mint new Owner directory rows WITHOUT holding `OWNER_CREATE`
  by submitting an owner_name not yet in the directory. The `OwnerService.getOrCreate(name)`
  invocation at `OwnershipServiceImpl.java:52` is a second write path into the Owner
  directory parallel to `POST /api/owners`.
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/OwnerAutoCreateBypassTest.java
  name: createOwnership_withNovelOwnerName_mintsOwnerWithoutOwnerCreatePermission
evidence:
- 'createOwnership.md says: ''A caller with `DATA_ENTITY_OWNERSHIP_CREATE` for any
  data-entity can therefore mint new Owner directory entries without holding `OWNER_CREATE`,
  by side-effecting through this endpoint.'''
- OwnershipServiceImpl.java:52 (`ownerService.getOrCreate(formData.getOwnerName())`)
- OwnerServiceImpl.java:39-42 (getOrCreate calls create on miss)
- SecurityConstants.java:215-217 (this endpoint's gate uses `DATA_ENTITY_OWNERSHIP_CREATE`,
  not `OWNER_CREATE`)
cross_references:
- concepts.yaml:entities[Owner (Authorization directory entry)].security_aggregate.weaknesses
- 'concepts.yaml NEW INVARIANT: Permission-bypass via Owner auto-create (batch F)'
proposed_action: 'Test grants caller `DATA_ENTITY_OWNERSHIP_CREATE` only (NO `OWNER_CREATE`),
  POSTs createOwnership with `owner_name: ''NovelName''`, asserts the `owner` table
  now contains ''NovelName''. Pins the bypass; promotes to a fix-required regression
  when REFACTOR for permission-bypass triages.'
