# Probe-stack: ODD platform with AUTH_TYPE=LOGIN_FORM (an enforcing auth mode), to
# contrast against odd-minimal's DISABLED mode for the ADR-0074 auth-mode boundary test
# (TEST-GAP-778): non-DISABLED modes wire `.anyExchange().authenticated()`, so a
# protected route requires authentication (vs DISABLED's permitAll).
#
# Distinct container names + ports + project (-p oddlf) from odd-minimal (18080/15432)
# and odd-minio (18081/15433), so all three coexist. Ephemeral, local-only.
#
# NB (ADR-0074): LOGIN_FORM grants EVERY credential the ADMIN role and does NOT wire the
# AuthorizationCustomizer (SECURITY_RULES are inert) — so this stack proves the
# AUTHENTICATION boundary, not per-user RBAC. RBAC needs LDAP (group→role mapping).
version: "3.3"

services:
  probe-database-lf:
    image: postgres:13.2-alpine
    container_name: probe-database-lf
    restart: "no"
    environment:
      POSTGRES_USER: odd-platform
      POSTGRES_PASSWORD: odd-platform-password
      POSTGRES_DB: odd-platform
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odd-platform -d odd-platform"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  probe-odd-platform-lf:
    image: ${ODD_PLATFORM_IMAGE:-ghcr.io/opendatadiscovery/odd-platform:latest}
    container_name: probe-odd-platform-lf
    restart: "no"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://probe-database-lf:5432/odd-platform
      SPRING_DATASOURCE_USERNAME: odd-platform
      SPRING_DATASOURCE_PASSWORD: odd-platform-password
      # The enforcing auth mode under test. Credentials are dev-only (admin:admin).
      AUTH_TYPE: LOGIN_FORM
      AUTH_LOGIN_FORM_CREDENTIALS: admin:admin
    depends_on:
      probe-database-lf:
        condition: service_healthy
    ports:
      - "18082:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
