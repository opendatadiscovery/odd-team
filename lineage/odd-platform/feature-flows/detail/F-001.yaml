- ts react-component:DataEntityDetails.tsx (UNRESOLVED — sidecar not yet enriched; ref only)
- ts redux/thunks:dataentities.thunks.ts:35-40 (UNRESOLVED — sidecar not yet enriched; ref only)
- odd-platform java DataEntityController controller-method:getDataEntityDetails
- odd-platform java service service:DataEntityServiceImpl
- odd-platform java repository reactive repository:ReactiveDataEntityRepositoryImpl
- odd-platform java DataEntityController controller-method:getPopular
chain:
- hop: 1
  node: ts react-component:DataEntityDetails.tsx
  sidecar: (not yet enriched)
  multiplicity_per_trigger: 2
  evidence: DataEntityDetails.tsx:56-64 — useEffect dependency-array contains details.status?.status (derived from fetch response),
    causing the effect to re-fire after the first fetch resolves
  unresolved: true
- hop: 2
  node: ts thunk:fetchDataEntityDetails
  sidecar: (not yet enriched)
  multiplicity_per_trigger: 1
  evidence: dataentities.thunks.ts:35-40 — handleResponseAsyncThunk wrapping dataEntityApi.getDataEntityDetails
  unresolved: true
- hop: 3
  node: odd-platform java DataEntityController controller-method:getDataEntityDetails
  sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityDetails.md
  multiplicity_per_trigger: 1
  evidence: DataEntityController.java:139-147 — thin reactive pass-through to DataEntityServiceImpl.getDetails
  unresolved: false
- hop: 3.5
  node: odd-platform java service service:DataEntityServiceImpl
  sidecar: odd-platform__java__service__service__DataEntityServiceImpl.md
  multiplicity_per_trigger: 1
  evidence: 'DataEntityServiceImpl.getDetails (lines 196-209) is the SOLE read method on the

    service that carries @ReactiveTransactional (line 197). The body chains repository.getDetails(id)

    → switchIfEmpty(NotFoundException, line 200) → enrichEntityClassDetails (5-way Mono.zip

    at line 513-532) → enrichParentGroups (line 604-614) → enrichDataEntityDetails (4-way

    Mono.zip at line 616-631) → incrementViewCount (helper at line 488-495 → repository.incrementViewCount).

    The read AND the view_count UPDATE share ONE transaction; rollback on enrichment failure

    would release the +1 increment. incrementViewCount is fail-soft on the post-read race

    (line 494 switchIfEmpty(Mono.just(dto))) so a between-call hard-delete of the entity

    after the read returns the DTO with its pre-call view_count rather than throwing.'
  unresolved: false
  resolved_in_batch: I
- hop: 4
  node: odd-platform java repository reactive repository:ReactiveDataEntityRepositoryImpl
  sidecar: odd-platform__java__repository_reactive__repository__ReactiveDataEntityRepositoryImpl.md
  multiplicity_per_trigger: 1
  evidence: 'ReactiveDataEntityRepositoryImpl.java:173-180 — `incrementViewCount` issues `UPDATE data_entity SET view_count
    = view_count + 1 WHERE id = ?`. Batch-H primary-source confirmation: the method is invoked by `DataEntityServiceImpl.getDetails`
    inside `@ReactiveTransactional` (DataEntityServiceImpl.java:197, 207, 488-495) — the +1 mutation is wrapped in the same
    transaction as the read; the post-mutation value is read back via `Mono<Long>` return and propagated to the response DTO
    at line 488-495. No defensive existence check at the repo layer; missing-id silently no-ops (Mono.empty).'
  unresolved: false
  resolved_in_batch: H
terminal_side_effect:
  side_effect_class: db-write
  description: Increments data_entity.view_count by 1 per call; per-row hot UPDATE
  evidence: ReactiveDataEntityRepositoryImpl.java:173-180 (incrementViewCount) — confirmed from primary source via batch-H
    repository sidecar
  cardinality_per_call: 1
amplification_factor: 2
amplification_factor_provenance: FULLY MEASURED end-to-end — P-004 (run R-20260519T010758Z-P-004) observed xhr_count=2 AND
  view_count delta=2 in a single UI page-open via headless Chromium. The full chain product is empirically confirmed. LSN-017's
  headline (`opening a detail page registers as +2 views`) is no longer inferred — it is the measured truth. Batch-H adds
  primary-source SQL confirmation at ReactiveDataEntityRepositoryImpl.java:173-180 for hop-4.
observed_vs_expected:
  facets:
  - facet: backend per-call delta
    observed: +1 view_count per GET /api/dataentities/{id}
    expected: +1 (matches intent)
    drift_class: null
    provenance: MEASURED — P-001 ran 5 sequential GETs; observed final_view_count - initial_view_count = 5 (run R-20260519T003701Z-P-001).
      Primary-source SQL confirmation in batch-H ReactiveDataEntityRepositoryImpl sidecar (line 173-180).
  - facet: UI page-open delta
    observed: +2 view_count per page-open; UI fires 2 sequential GET /api/dataentities/{id} per mount
    expected: +1 per logical page-open (per the operator-facing UX intent)
    drift_class: ui_amplification
    provenance: MEASURED — P-004 (run R-20260519T010758Z-P-004) launched headless Chromium, navigated to /dataentities/1004,
      observed xhr_count=2 (regex-filtered to exact `/api/dataentities/1004` matches) AND view_count delta=2. LSN-017's headline
      empirically proven; fix would flip xhr_count to 1 + delta to 1.
  - facet: anonymous reachability under DISABLED
    observed: anonymous caller successfully fetches detail AND increments view_count; 10 anon calls → +10 view_count
    expected: either documented anonymous-OK posture OR 401/403
    drift_class: disabled_mode_bypass
    provenance: MEASURED — P-002 ran 10 unauthenticated GETs against probe-stack with AUTH_TYPE=DISABLED; observed final_view_count
      - initial_view_count = 10 (run R-20260519T003811Z-P-002)
  - facet: detail-read latency baseline (small seed, single entity)
    observed: p50=106ms, p95=202ms, p99=1539ms (50 calls; the p99 outlier is JIT/warmup on the first call)
    expected: establish a baseline; bound is empirical, not documented
    drift_class: null
    provenance: MEASURED — P-003 ran 50 sequential GETs against :latest image (run R-20260519T003916Z-P-003)
  - facet: inflation-attack surface confirmed at repo layer (batch H)
    observed: No rate limit at any layer of the chain — repository `incrementViewCount` is method-only (no per-caller throttle);
      consumer `listPopular` orders exclusively by `view_count`; under DISABLED auth, any anonymous network probe can pump
      views. Combined with F-003's missing EXCLUDE_FROM_SEARCH filter on the popular CTE, a single attacker can drive ANY
      entity (including hidden ones) to top-1 of the home page.
    expected: rate-limit / authz / popular-CTE-exclusion at SOME layer
    drift_class: structural_amplification_surface
    provenance: STATIC — ReactiveDataEntityRepositoryImpl.java:173-180 + 630-649 (no throttle, no auth, no exclude_from_search)
      per batch-H sidecar's known_security_gaps[3]. A future Type-7 probe pumping 10K views from one caller and verifying
      ranking shift would close the empirical proof — proposed local k6 + curl + DB SELECT probe.
  - facet: read-then-write atomicity at service tier confirmed (batch I)
    observed: 'DataEntityServiceImpl.getDetails (lines 196-209) wraps the read+enrichment+UPDATE

      in @ReactiveTransactional (line 197). The view_count increment is therefore

      INSIDE the same transaction as the metadata read — a downstream enrichment failure

      would roll back the +1. Practical consequence: at the service tier, the +2-per-page-open

      bug (P-004) is NOT caused by a fail-and-retry pattern (the txn would absorb that);

      it is a UI-side double-fetch that issues TWO independent HTTP requests, each of

      which commits its own +1. The service-tier confirmation rules out one class of

      candidate-causes (txn retry, optimistic-concurrency loop) and re-affirms the

      UI-amplification root cause (LSN-017).'
    expected: same — the @ReactiveTransactional is correct shape; the bug is UI-side
    drift_class: null
    provenance: STATIC — primary-source verification at DataEntityServiceImpl.java:197 (@ReactiveTransactional on getDetails
      — the ONLY read method with the annotation) + 488-495 (the incrementViewCount helper called inside that boundary at
      line 207). No new probe needed; P-004 already pinned the +2 user-visible amplification.
  - facet: hot-row contention at service tier (batch I — STATIC, perf consequence)
    observed: 'The @ReactiveTransactional on getDetails (line 197) means concurrent reads of

      the SAME entity serialise on the data_entity row write-lock for the duration

      of the entire transaction (read + 9 enrichment SELECTs + UPDATE + mapper). For

      a popular entity (e.g. a high-traffic table the platform''s stewards are watching),

      two concurrent operators opening the detail page block each other.'
    expected: either fire-and-forget view_count (sacrifice transactional atomicity for throughput) OR sampling strategy OR
      async aggregation
    drift_class: structural_amplification_surface
    provenance: STATIC — DataEntityServiceImpl.java:196-209 (the txn scope includes incrementViewCount). Proposed Type-7 perf
      probe — k6 + 100 concurrent GETs against the SAME entity id + measure p99 latency vs the per-call baseline from P-003.
  surfaced_by:
