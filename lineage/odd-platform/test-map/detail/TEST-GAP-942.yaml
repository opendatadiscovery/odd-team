proposed_action: |-
  Author IntegrationMapperTest pinning the installed=false constant on both
  mappings. The test is GREEN today; it documents the current
  contract-violation-by-design state. A future fix detecting actually-installed
  integrations (matching wizard id to a registered DataSource via
