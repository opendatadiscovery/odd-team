    - odd-platform__java__service__service__OwnershipServiceImpl
  retrospectives: [LSN-019, LSN-020]
realism_caveats: |
  The probe pins (a) the unbounded-size class-A absence and (b) the
  ORDER BY id ASC class-C contract. It does NOT verify what the React
  OwnerTitleAutocomplete renders to the operator — that is a UI-side
  probe (Playwright) for a sibling sidecar to enqueue. The probe also
  does NOT exercise the `query` substring filter (containsIgnoreCase) —
  that is a Category F follow-up to test whether typing 'data' returns
  'Data Steward' before 'Metadata Owner' (the answer is: id ASC, so the
  oldest matching id wins, not the most-relevant — but that is a
  separate failure-mode probe).
