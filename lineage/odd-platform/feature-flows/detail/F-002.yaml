control_summary: |-
  2 of 4 cells PROBED — integration (PROBED-PINNING-BUG) + security
  (PROBED-PINNING-BUG). Batch K extends the chain with full TermServiceImpl
  service-tier hop primary-source confirmation — the auto-link side-channel
  (description-mention `[[ns:term]]` → INSERT `data_entity_to_term` with
  `is_description_link=TRUE`) is the SECOND endpoint bypassing
  `DATA_ENTITY_ADD_TERM`, and a SECOND independent SecurityConstants bug
  surfaces (`/api/alerts/{id}/status` PUT gated by `DATASET_FIELD_ADD_TERM` —
  copy/paste error, alert-status authorization is effectively misrouted).
  Seven new drift facets surface: description-edit auto-link bypass +
  misrouted alert-status permission + zero service-tier permission checks +
  TermAssignmentActivityHandler triple-re-query (REFACTOR-228 primary-source) +
  TAG_CREATE bypass via upsertTags + NAMESPACE_CREATE bypass via getOrCreate +
  cross-namespace term pollution + asymmetric duplicate-INSERT handling
  between data-entity and dataset-field link methods. The unit/performance
  cells remain GAP — `TermServiceImpl` has ZERO direct test coverage
  (TermServiceImplTest does not exist; `DataEntityServiceTest.java:80` mocks
  TermService but never exercises it).

  Batch N extends with repository-tier PRIMARY-SOURCE CONFIRMATION at
  ReactiveTermRepositoryImpl (hop-3 — previously a coupling reference, now
  fully resolved). Six NEW drift facets surface: (1) V0_0_76 vs V0_0_91
  link-table schema asymmetry (term_to_term retains `deleted_at` while
  sibling link tables had it dropped — either dead schema or missing filter);
  (2) term_to_term.deleted_at is NEVER filtered at 7 distinct read sites
  (lines 198-199, 227-231, 324-325, 345, 429-430, 448-454, 472-491, 510-523)
  — a regression vector for any future soft-delete activation; (3)
  hasDescriptionRelations parent-soft-delete corner — lines 415, 425 exclude
  `DATA_ENTITY.STATUS = DELETED` from the existence guard, so a Term mentioned
  only in a soft-deleted entity's description can be renamed/hard-deleted,
  leaving a dangling `[[ns:term]]` reference on restore; (4) getTermDetailsDto
  12-JOIN + 7 jsonArrayAgg + 4 countDistinct (lines 194-238) is the
  TermPermissionExtractor HOT PATH invoked on every TERM-scoped authorized
  request — Cartesian intermediate fan-out O(N×M×P×Q×R×S) before reduction,
  no caching; (5) countByState unconditional FTS JOIN (line 361) creates
  count-vs-list desynchronisation against findByState's conditional JOIN
  (296-298); (6) listTermRefDtos fetchCount ignores the `updatedAt` date
  filter (113-114, 133), producing wrong pagination ceiling. ZERO direct
  test coverage at the repository tier (NamespaceServiceImplTest mocks
  existsByNamespace only; no *RepositoryTest* class). The repository
  policy-agnostic invariant is preserved — every business rule (rename
  protection, duplicate prevention, FTS refresh orchestration) lives in
  TermServiceImpl; the repository is a thin persistence shell.

  Batch L extends the feature with the DELETE half PRIMARY-SOURCE CONFIRMED.
  The SecurityConstants path-mismatch bug is symmetric — line 240-242
  registers `/term/{term_id}` SINGULAR while openapi.yaml:1042 declares
  `/terms/{term_id}` PLURAL — making DATA_ENTITY_DELETE_TERM equally
  uncheckable. REFACTOR-217 now covers BOTH halves in one fix. Five new
  drift facets surface: (1) SYMMETRIC DELETE path mismatch (auth uncheckable
  on remove just like on add); (2) HARD-DELETE finality (migration
  V0_0_76__term_relations_hard_delete dropped the soft-delete column +
  irreversibly deleted any tombstoned rows; no audit-restore path beyond
  the activity-event JSON state); (3) description-link protection silent
  via API (UI hides the X button via WithPermissions + !isDescriptionLink
  guards but API call to DELETE on a description-linked term returns 204
  with no actual change — same misleading idempotence); (4) activity event
  fires on no-op DELETE (@ActivityLog fires unconditionally; BEFORE=AFTER
  state in audit log on zero-row deletion — degrades forensic
  signal-to-noise ratio); (5) silent-204 on non-existent ids (no
  NotFoundException translation). Combined with the path-mismatch bug,
  the worst-case shape under DISABLED is: anonymous caller mass-deletes
  every term-to-data-entity relation in the catalog, leaving only
  activity-event JSON state as forensic trail; the HARD-delete finality
  means there is no row-level restore. The unit/performance cells remain
  GAP — neither addDataEntityTerm nor deleteTermFromDataEntity has
  HTTP-level test coverage (`find ... -name 'DataEntityController*'`
  + grep for `removeTermFromDataEntity` both returned zero matches).

  Batch U CLOSES the 5-LAYER chain for P-06:F-001 with controller-class
  (TermController) + FTS-write companion repository
  (ReactiveTermSearchEntrypointRepositoryImpl) + UI detail-page shell
  (TermDetails) primary-source confirmation. NINE new drift facets
  surface: (1) term-to-term linkage NO SecurityRule (HIGH — completely
  missing rule, not a misregistered one like REFACTOR-217); (2) term-to-term
  linkage NO @ActivityLog (MEDIUM — sole linkage type missing audit
  emission); (3) TermDelete cascade omits term_to_term (MEDIUM —
  compounds the batch-N schema-drift); (4) createTerm/updateTerm
  status-code drift (MEDIUM — controller 200 vs spec 201); (5) term
  search session no per-caller ownership check (MEDIUM — UUID-only
  authority on `/api/terms/search/**`); (6) term lifecycle audit-silence
  ENUM-ROOTED (HIGH — ActivityEventTypeDto has NO TERM_CREATED /
  TERM_UPDATED / TERM_DELETED / NAMESPACE_CREATED values; refines F-006
  batch-R schema-FK finding with a SECOND root cause); (7) term
  DEFINITION XSS surface extension (HIGH — F-004 class 3rd surface;
  Term definition through Markdown+rehype-raw without sanitisation);
  (8) FTS-write-path term DELETE leaves stale vector (MEDIUM —
  ReactiveTermSearchEntrypointRepository has no delete method); (9)
  FTS-write-path TERM_OWNERSHIP soft-delete not filtered (LOW — latent).
  Unit/performance cells remain GAP — ZERO direct test coverage at
  the controller, service, repository, OR FTS-write tier (verified by
  grep for TermController, TermServiceImpl, ReactiveTermRepositoryImpl,
  ReactiveTermSearchEntrypointRepositoryImpl in src/test).
  P-06:F-001 Term-to-Entity Linkage is now FULLY ANCHORED at every
  layer: UI list (F-024 TermSearch — minted this batch) + UI detail
  (TermDetails) + controller-class (TermController) + service
  (TermServiceImpl batch K) + main repository (ReactiveTermRepositoryImpl
  batch N) + FTS write repository
  (ReactiveTermSearchEntrypointRepositoryImpl batch U) + DataEntityController
  controller-methods (batches G + L). 5-LAYER PILLAR CLOSURE for
  Data Glossary.

  2026-05-26 UI-Review-F (slice_F_Terms.txt — 38 components walked,
  Terms subsystem) — three NEW UI-layer drift facets surface
  reinforcing existing service/repo-tier findings:

  (1) TermDefinition.tsx form-handler wired to dataset-field thunk
  (LOW, dead-code OR typo). TermDefinition.tsx:5-23 imports
  `updateDataSetFieldDescription` and passes it as `updateDescription`
  into `useTermWiki`, with `isDatasetField: false`. If the hook
  ever fires the update branch on a Term page, the WRONG thunk runs.
  Inline-edit appears currently disabled on the Term detail page
  (Markdown rendered read-only), but the wiring is a latent bug —
  any future change enabling inline-edit on Term definitions will
  silently mutate a dataset-field description instead. NEW DRIFT
  FACET: `term_definition_form_wires_dataset_field_thunk_dead_code_or_typo`.

  (2) Asymmetric description-link visual indicator — present on
  term-to-term, ABSENT on term-to-entity (MEDIUM, UX coherence).
  TermItem.tsx:53 renders `<LinkedTermIcon />` when
  `linkedTerm.isDescriptionLink === true`, hiding the X delete via
  `!isDescriptionLink` (line 61). LinkedEntity.tsx (TermLinkedEntitiesList
  row component) renders NO equivalent `isDescriptionLink` indicator
  and NO conditional delete affordance — the linked-entities tab
  silently presents description-linked entities identically to
  manually-linked ones. Operators viewing the linked-entities list
  see the entity name + namespace + datasource but cannot tell
  whether the link was authored manually (via DATA_ENTITY_ADD_TERM)
  or auto-created via a description `[[ns:term]]` mention bypassing
  DATA_ENTITY_ADD_TERM. Cross-link F-056 facet
  `is_description_link_invisible_in_ui_audit_invisible` — F-056
  marks that facet `ui_unverified: true` pending UI walk; THIS
  batch CONFIRMS primary source. NEW DRIFT FACET:
  `ui_asymmetric_description_link_indicator_term_to_term_vs_term_to_entity`.

  (3) TermsForm client-side duplicate check loads 1000 terms into
  memory (MEDIUM, scalability + correctness). TermsForm.tsx:71-75
  dispatches `fetchTermsSearchResults({searchId, page:1, size:1000})`
  on form mount to enable a client-side duplicate detector that
  compares `existingTerm.name === data.name && existingTerm.namespace.name
  === data.namespaceName` (lines 84-94). Three issues stack:
  (i) hard-coded `size: 1000` ceiling — a catalog of 1001+ terms
  silently bypasses the check for the 1001th+ term; (ii) the check
  ONLY fires in CREATE mode (line 84 `if (!term?.id)`) — the EDIT
  path can rename a term to collide with another in the same
  namespace without any client-side warning; (iii) the backend's
  uniqueness constraint is the authoritative gate, but
  TermServiceImpl.createTerm has no documented graceful-error path
  for the duplicate case — the client check is meant to PREVENT
  reaching the backend rejection. Current shape gives operators a
  false sense of validation that silently breaks at scale + on
  rename. NEW DRIFT FACET:
  `ui_term_create_client_duplicate_check_loads_1000_terms_in_memory`.

  Coherence sweep STRENGTHENS=2 (F-056
  `is_description_link_invisible_in_ui_audit_invisible` now PRIMARY-SOURCE
  for the term-to-entity surface; F-002 batch-N
  `list_term_ref_dtos_count_vs_list_filter_mismatch` interacts with
  the size=1000 ceiling at the same query). SUPERSEDES=0. CONFLICTS=0.
