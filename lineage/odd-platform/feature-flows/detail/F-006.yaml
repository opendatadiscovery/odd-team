amplification_factor: 1
amplification_factor_provenance: 'STATIC — confirmed from primary source. No active probe yet for this feature. The amplification
  factor of 1 reflects per-request authorization resolution: one DELETE-policy call produces one UPDATE, but the soft-deleted
  policy continues to influence permission resolution on EVERY subsequent authorized request (N requests after the delete)
  because getRolesPolicies has no deleted_at filter. The structural ''amplification'' is the silent-permission-grant persistence,
  not a per-request mathematical product.'
