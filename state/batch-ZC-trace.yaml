  - target: DataQuality
    status: success
    sidecar: lineage/odd-platform/understanding/odd-platform__ts__react-component__component__DataQuality.md
    probes: [P-090]
    headline: |-
      confidence HIGH. The `/data-quality` route is mounted at App.tsx:73 with
      NO client-side permission guard — a bare `<Route>`, in direct contrast to
      `/lookup-tables` at App.tsx:75-88 which IS wrapped in
      `WithPermissionsProvider`; the "Data Quality" top-bar tab is also rendered
      unconditionally. Any authenticated user can open the catalog-wide aggregate
      quality view. Live `dashboard.md` doc page exists with accurate structure
      but every Data Quality doc page is SILENT on access control (MEDIUM
      doc-gap). 13 stress questions (10 STATIC-INFERRED / 2 PROBE-NEEDED / 1
      REFERENCE), 0 drift flags. P-090 pins whether the backend dashboard
      endpoint compensates.
  - target: DataQualityContent
    status: success
    sidecar: lineage/odd-platform/understanding/odd-platform__ts__react-component__component__DataQualityContent.md
    probes: [P-100, P-101]
    headline: |-
      confidence MEDIUM. Single-fetch projection: GET /api/dataqatests/runs →
      DataQualityRunsController → DataQualityResults DTO → 3 donuts + N category
      cards. **HIGH-severity latent crash** at line 48:
      `palette.runStatus[status].color` throws uncaught TypeError that blanks
      the whole dashboard if backend returns a DataEntityRunStatus outside the
      6-member enum; the `?? palette.dataQualityDashboard.unknown` fallback is
      mis-written (guards a missing `.color` on a present entry, never a
      missing entry) and is therefore DEAD. Plus 4 doc-drift findings: the live
      dashboard page uses Table Health labels (success/failed/broken) that do
      NOT match the rendered slices (Healthy/Warning/Error), describes the
      breakdown ring as 3 statuses where the code renders up to 6, and is
      silent on category-ordering + empty-state. 19 stress questions (13
      STATIC-INFERRED / 2 PROBE-NEEDED / 4 REFERENCE).
  - target: DataQualityFilters
    status: success
    sidecar: lineage/odd-platform/understanding/odd-platform__ts__react-component__component__DataQualityFilters.md
    probes: [P-110, P-111]
    headline: |-
      confidence MEDIUM. **LSN-020 class headline**: the dashboard's "Title"
      sidebar filter — its bare label `t('Title')` reads as "filter by dataset
      name" but `titleIds`/`deTitleIds` bind at the SQL layer to
      `OWNERSHIP.TITLE_ID` (ownership *role*, e.g. "Data Steward"), traced
      end-to-end DataQualityFilters → filtersAtom → DataQualityRunsController
      → DataQualityTestFiltersMapper → ReactiveDataQualityRunsRepositoryImpl
      .java:301,309. Secondary: the "Namespace" filter silently widens to
      datasource-inherited namespaces (...:288-293); the live dashboard doc
      page documents neither. 43 stress questions (37 STATIC-INFERRED / 2
      PROBE-NEEDED / 4 REFERENCE), 3 drift flags (2 Category-F
      TRANSLATES_SILENTLY on Title and Namespace, 1 MINOR on formFiltersAtom
      naming).
  - target: DataQualityStore
    status: success
    sidecar: lineage/odd-platform/understanding/odd-platform__ts__jotai-store__store__DataQualityStore.md
    probes: [P-120]
    headline: |-
      confidence HIGH. **jotai-vs-redux verdict: implicit_adr, not a bug.**
      Grep found 26 files importing jotai across 4 distinct feature areas
      (OwnerAssociations / DEGLineage / DatasetStructure ×2 / DataQuality),
      each with identical `*Store/*Atoms.ts` + `*Provider.tsx`
      `<Provider>`-wrapper pattern. The intent_anchor is decisive:
      `OwnerAssociationsAtomProvider` is byte-for-byte identical to
      `DataQualityAtomProvider` — a convention copied verbatim across features
      is intentional. **Headline corner-case (MEDIUM):** the dashboard filter
      store is per-Provider-mount, not global — `/data-quality` is a single
      non-wildcard lazy Route, so navigating away unmounts the Provider and
      the next visit resets all 10 filters; only URL search params persist.
      11 stress questions (10 STATIC-INFERRED / 1 PROBE-NEEDED), 1 minor
      drift flag.
  - target: TestCategoryResults
    status: success
    sidecar: lineage/odd-platform/understanding/odd-platform__ts__react-component__component__TestCategoryResults.md
    probes: []
    headline: |-
      confidence HIGH. Leaf display node — closes one of the previously-zero
      dashboard sidecars. Headline: doc gap/drift pair — live
      `data-quality/dashboard` page documents the breakdown as 3 statuses
      ("passed / failed / skipped") but code renders a tile for every value
      of the 6-valued DataEntityRunStatus enum
      (SUCCESS/FAILED/SKIPPED/BROKEN/ABORTED/UNKNOWN), and the per-category
      result row this component renders is undocumented entirely. Undocumented
      cross-tier coupling: column alignment depends on backend
      DataQualityCategoryMapperImpl.addMissingStatuses six-status guarantee
      that nothing in the UI asserts. 11 STATIC-INFERRED / 0 PROBE-NEEDED / 0
      REFERENCE (4 triggers, 1 MINOR drift flag — `sortedResults` name says
      "sorted" but the code also filters).
