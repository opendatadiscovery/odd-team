behaviour: |-
  Sequential synchronous fan-out — one slow sender stalls all subsequent senders for the same alert. The dispatcher iterates List<NotificationSender> with a for loop and BLOCKS per sender on .send(...). A misconfigured webhook with a 30s SLA blocks Slack and email delivery for THAT alert. Combined with NotificationSubscriber's single-thread executor (NotificationSubscriberStarter.java:21-23), backpressure on the WAL stream means subsequent ALERT-row WAL messages buffer in stream.readPending() until the synchronous loop returns. End-to-end per-alert latency = (DB roundtrips for translate) + Σ (per-channel network RTT). No timeout per sender (`.send(...)` is blocking with no Duration cap); no parallelism (no thread pool, no async, no per-channel SLA budget).
