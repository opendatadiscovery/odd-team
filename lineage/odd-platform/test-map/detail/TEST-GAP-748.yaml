behaviour: |-
  **MEDIUM — `updateLookupTable` rebuilds the physical Postgres table name on rename via `ALTER TABLE ... RENAME TO`, silently breaking downstream pipelines that hardcoded the old `lookup_tables_schema.n_X__name` reference. No deprecation alias / view is left behind.** Primary-source confirmed in the batch-V ReferenceDataController sidecar:

  - `ReferenceDataServiceImpl.java:107-124` (`updateLookupTable`): the service rebuilds `tableName` by re-running `buildTableName(formData.getName(), table.namespacePojo())` — the lossy lowercased + underscore-replaced name. If the operator renamed the lookup table, the resulting `tableName` differs from the old one.
  - `ReferenceDataRepositoryImpl.java:181-202`: the repository issues `ALTER TABLE lookup_tables_schema.{old_name} RENAME TO {new_name}` DDL. The physical Postgres table is renamed.
  - **No deprecation alias / view**: nothing is left at the old name. Downstream pipelines, BI dashboards, or external tools that hardcoded `lookup_tables_schema.n_5__customer_lookups` in their SQL break silently on the rename.

  **Compound failure with DDL ACCESS EXCLUSIVE LOCK**:
  - The `ALTER TABLE RENAME TO` DDL takes Postgres ACCESS EXCLUSIVE LOCK on the lookup table. Concurrent read-heavy traffic on a popular reference table blocks during the rename.
  - The lock is held for the duration of the transaction. Under load, this can stall every consumer of the lookup table for the lock window.

  **Operator-observable consequences**:
  - An operator renames "Customer Lookups" → "Customer Reference Codes" in the Master Data tab. The catalog reflects the new name. Downstream pipelines querying `SELECT * FROM lookup_tables_schema.n_5__customer_lookups` fail with `relation does not exist`. The operator has no doc warning that rename is BREAKING for downstream consumers.
  - Under load, a rename can stall reads for multiple seconds (or longer if the table is in a hot path).
  - The doc page (per sidecar `doc_drift_findings`) does NOT discuss rename semantics.

  **Why MEDIUM not HIGH**: rename is an operator-curation action; the downstream-breakage requires a downstream consumer hardcoding the schema name. The DDL lock is bounded by table size + transaction duration. MEDIUM at the per-instance severity. Cross-pillar P-03.

  **Test gap shape**: regression-pin asserting (a) rename produces a new physical table name; (b) the old name is NOT preserved as an alias / view; (c) under load, the DDL lock blocks concurrent reads.
