realism_caveats: |
  This is the HIGHEST-leverage F-011 probe the control_summary names as unrealized. The
  two-phase LOGIN_FORM→LDAP restart against a shared Postgres volume is the realistic
  migration scenario; the bleed also manifests in a SINGLE deployment running both modes
  concurrently (a simpler arrange that skips the restart). The OwnerAssociation admin
  direct-bind path (act #1) may require an authenticated admin session under LOGIN_FORM —
  if the test harness cannot drive that flow, substitute the SQL-seed fallback
  (INSERT INTO user_owner_mapping (oidc_username, provider, owner_id, deleted_at) VALUES
  ('alice', NULL, 8501, NULL)) which produces the identical phase-1 state. If
  ldap_alice_whoami.owner.id resolves to something OTHER than 8501, re-read
  AuthIdentityProviderImpl.java:29-33 — a code change emitting a distinct provider literal
  for LDAP since commit 43d13eb would (correctly) close the bleed and invalidate the
  CONTRADICTED prediction.
