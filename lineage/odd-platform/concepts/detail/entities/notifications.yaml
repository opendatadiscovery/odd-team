name: Notifications
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
description: |-
  Outbound alert-notification subsystem — a feature-flagged, off-by-default
  service that streams `ALERT` table changes via PostgreSQL logical-replication
  WAL and fans them out to Slack (incoming webhook), generic webhook (JSON
  POST), and SMTP email channels. Each channel is independently activated by
  the presence of its URL/sender key. Disabled by default at
  `notifications.enabled=false` (read by `NotificationsFeatureCondition`
  from the Spring `Environment` — bypassing `NotificationsProperties.enabled`
  field on the boot path). The WAL subscriber is a leader-elected
  single-thread consumer gated by Postgres advisory lock id
  `notifications.wal.advisory-lock-id` (default 100), running ONE thread
  named `notification-subscriber-thread` on the elected leader. Replication
  slot + publication are created LAZILY on first run if absent; ODD never
  drops them on shutdown — operator owns cleanup. Fan-out through
  `List<NotificationSender>` is sequential and fail-soft: per-sender
  exceptions are caught at the processor and the loop continues. Distinct
  from the platform's internal `Alert` lifecycle (this is the OUTBOUND
  delivery surface for alerts) and from the `Slack collaboration app`
  (which is bidirectional in-app Discussions, not alert notifications).
  vocabulary_status: codebase-anchored, doc-side-feature-page-covered
  (`features/active-platform-features/notifications` returns 200;
  `active-platform-features/notifications` returns 404 — GitBook IA drift).
  main-concepts.md names `Slack alert webhook` in Terms & Aliases (outgoing
  variant) but does NOT name `Notifications` as a first-class canonical
  feature. Batch 2026-05-12D adds `EmailSenderProperties` as the canonical
  typed-config surface for the EMAIL CHANNEL — 6 top-level fields (sender
  / password / host / port / protocol / smtp) + nested `SmtpProperties`
  (auth + starttls). Recipient list
  `notifications.receivers.email.notification.emails` is NOT modelled on
  this POJO — partial-home pattern (consumed via raw `@Value` in
  `NotificationConfiguration.java:104`). **STRENGTHENED batch
  2026-05-19K**: AlertNotificationMessageProcessor (the dispatcher, sole
  implementor of PostgresWALMessageProcessor) is now primary-source pinned
  — the dispatcher's 3-step body (translate-uncaught → fan-out-sequential
  → per-sender-catch-and-continue) is the runtime of every claim on the
  live notifications doc page. Two NEW HIGH-severity findings: (a)
  poison-message WAL replay loop — translation failure propagates to
  NotificationSubscriber's outer catch which waits 10s and re-acquires
  the lock; the SAME WAL LSN is re-delivered indefinitely, blocking
  subsequent messages; (b) exception-type asymmetry — EmailNotificationSender
  wraps as RuntimeException (NOT NotificationSenderException), bypassing
  the dispatcher's per-sender catch and aborting fan-out mid-message.
vocabulary_status: codebase-anchored, doc-side-feature-page-covered
axes_present:
