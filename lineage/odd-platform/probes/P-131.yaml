expected_outcome: |
  Stress question (Category D — authorization gate posture):
  RelationshipController has NO @PreAuthorize, NO programmatic permission
  check, NO owner-scoping filter at any layer. The list/detail endpoints
  return ALL relationships across ALL data sources to ANY authenticated
  caller — no SECURITY_RULES entry exists for `/api/relationships/**`
  (verified via grep of `SecurityConstants.java:95-355` — only paths
  ending in `relationships` appear as DATASET-scoped under
  `/api/datasets/{data_entity_id}/relationships`, which is the
  DatasetController endpoint, NOT this controller's three endpoints).
  Under auth.type=DISABLED the endpoints are reachable unauthenticated
  (`DisabledAuthSecurityConfiguration` skips the AuthorizationCustomizer
  chain entirely).

  The downstream SQL at `ReactiveDataEntityRelationshipRepositoryImpl.java:74-75`
  filters ONLY by `entity_class_ids = [DATA_RELATIONSHIP.getId()]` and
  the optional `external_name` query string — no `OWNERSHIP` JOIN, no
  `data_source_id`-by-permission filter, no namespace-by-permission
  filter. Hypothesis: the relationships list is a global directory of
  every catalogued relationship-class data entity across every collected
  data source. This is intentional for ODD's data-cataloging model but
  surfaces an INFORMATION-LEAK class if the operator assumed that the
  user-visibility model of /api/dataentities (which respects HOLLOW +
  EXCLUDE_FROM_SEARCH filters per batch-T REFACTOR-425) ALSO applies here.

  Specifically test (a) the cross-tenant case — relationship A from
  data_source_1, relationship B from data_source_2; a user with no
  policy granting data_source_2 visibility nonetheless sees both;
  (b) the EXCLUDE_FROM_SEARCH case — a relationship-class data entity
  with `exclude_from_search = true` is NOT filtered out here (the
  conditionList doesn't include EXCLUDE_FROM_SEARCH); (c) the HOLLOW
  case — `hollow = true` data entities are NOT filtered out either.
  Each of these is a NoOwnerScopingFinding for the doc-drift surface.
