proposed_action: |-
  Integration test (Testcontainers + WebTestClient). (a) Set up two Policies: PA grants DATA_ENTITY_ADD_TO_GROUP on entity X to user U; PB grants nothing to user U on DEG Y. (b) Pre-create DEG Y with manuallyCreated=true via DataEntityGroupServiceImpl as a different owner. (c) As user U, POST /api/dataentities/X/data_entity_group with body {data_entity_group_id: Y_id}. (d) Assert HTTP 200 with the parent DEG ref returned (current contract — write-collaborative). (e) Assert membership row exists in group_entity_relations with (Y.oddrn, X.oddrn). (f) Test comment: 'LOCKS the write-collaborative DEG surface as of 2026-05-19. When REFACTOR-NNN adds DEG-side gating, this test FLIPS to expect 403 and the doc updates.' Cross-pillar critical because it pins the operator-vs-enforcement asymmetry that crosses P-01 + P-09.
