proposed_canonical: LSN-002-class config default failure pattern
rationale: 'Two sidecars (GenAIProperties + AttachmentServiceImpl@L27) embody the
  same architectural pattern: a typed config field with no Java initializer ships
  a primitive default (`int` 0, boxed `Integer` null) that is legal at boot but broken
  at first use. LSN-002 retrospective names the regional variant (MinIO us-east-1);
  the `requestTimeout=0` and `maxFileSize` unset cases are the same root cause in
  different domains. postMessageInSlack provides the disciplined counter-example:
  explicit fail-fast empty-check on slack-oauth-token. Useful as a pattern-recognition
  anchor for future enrichments.'
contributing_concepts:
- silent misconfiguration when genai.enabled=true is the only key set (GenAIProperties)
- boot-time crash if attachment.max-file-size is unset (AttachmentServiceImpl@L27)
- LSN-002-class concern flagged in input prompt (GenAIProperties.performance.known_performance_gaps[0])
- fail-fast on empty slack-oauth-token at boot (postMessageInSlack implicit_adrs[0]
  — counter-example)
suggested_add_to_docs: false
