name: Management tab visible to all authenticated users (unpermissioned tab visibility — read-collaborative UX manifestation)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-08
description: |-
  **NEW MEDIUM-severity INVARIANT, batch 2026-05-20-Q (AppToolbar
  primary source)**. The SPA's top-level navigation tabs are rendered
  UNCONDITIONALLY by `<ToolbarTabs>` (ToolbarTabs.tsx:34-82) — every
  authenticated user sees ALL NINE tabs (Catalog / Directory / Data
  Quality / Data Modelling / Master Data / **Management** / Dictionary
  / Alerts / Activity) regardless of their permission set. The
  ToolbarTabs enumerator does NOT consult `getGlobalPermissions` or
  any permission predicate — every tab entry is unconditionally pushed
  into the rendered list.

  **The Management tab is the highest-stakes example**: an operator
  with zero `*_MANAGE` permissions (e.g. a regular user with only
  `DATA_ENTITY_VIEW`) still sees the `Management` tab in the toolbar.
  Clicking through routes to `/management/*` where the page-level
  `WithPermissionsProvider` (per `pillars/documentation/cornerstones.md`
  Cornerstone 3 — configuration is a separate audience surface)
  injects context but does NOT gate route rendering — they see the
  page, but the individual Create/Edit/Delete buttons are hidden via
  `<WithPermissions>` wrappers returning `null`.

  **The UX consequence**: an operator sees a tab labelled "Management"
  but clicking through reveals only read-only views (the per-button
  WithPermissions wrappers hide every mutation affordance). They have
  no UI affordance explaining "this tab exists because the platform's
  read-collaborative posture (REFACTOR-024) lets you READ the role
  catalog / owner catalog / policy catalog but not MUTATE it". The
  tab appears "broken" to the user (a tab with no actions).

  **This is internally consistent with the platform's read-collaborative
  posture** catalogued at `read-collaborative-cross-owner-enumeration`
  invariant (REFACTOR-024, REFACTOR-203, REFACTOR-201 cross-pillar
  reads bypass per-owner scoping). The Management tab being visible
  follows the same posture: READ across the platform is collaborative;
  WRITE is permission-gated. But the UX manifestation is operator-
  surprising — the maintainer should either:
    (a) add a per-tab permission predicate to ToolbarTabs.tsx (hide
        the Management tab from users with zero Management permissions);
    (b) add a banner on the Management routes explaining "you can
        read this catalogue but not edit it without {required
        permission}".

  **Cross-batch coherence (LSN-018)**: This sidecar STRENGTHENS the
  `read-collaborative-cross-owner-enumeration` invariant by adding
  the FIRST UI-layer evidence point — the read-collaborative posture
  is not just an HTTP/service/SQL-layer architectural choice; it is
  visible to every user as a tab in the toolbar they may not
  understand the role of.
