behaviour: 'Body-buffered-before-auth: filter reads the FULL request body via `collectList()`
  to extract `dataSourceOddrn` BEFORE validating the token. An attacker submitting
  maximum-size 20MB payloads (`spring.codec.max-in-memory-size: 20MB`) with invalid
  tokens forces the platform to buffer + parse before rejecting — low-effort heap-pressure
  DoS vector. Auth-first ordering would shed bad traffic earlier but would require
  knowing dataSourceOddrn before body parse.'
test_files_existing: []
