notes: |-
  **STRENGTHENED batch 2026-05-19M to 19-sidecar** with the anchor-set-defence
  audit family. Batch M adds 4 new surfaces (getMyObjectsWithUpstream,
  getMyObjectsWithDownstream, getDataEntityGroupsLineage, facets) confirming
  the read-collaborative posture is uniform even at endpoints DESIGNED to be
  owner-anchored.

  **STRENGTHENED batch 2026-05-20-Q to 24-sidecar** with the cross-cutting
  catalogue-read enumeration:
    - **Owner directory** (OwnersList — 20th sidecar)
    - **UI shell** (AppToolbar — 21st sidecar)
    - **Policy catalogue** (PolicyList — 22nd sidecar)
    - **Role catalogue** (RolesList — 23rd sidecar)
    - **Collector catalogue** (CollectorsList — 24th sidecar)

  **STRENGTHENED batch VAL-LSN-019-B to 27-sidecar** with the Activity
  feature three-tier cross-tier evidence:
    - **ActivityController controller-class (25th sidecar — HTTP class-tier)**:
      verifies the read-collaborative posture extends to the controller-CLASS
      layer (not just the prior method-level getActivity sidecar). The
      class-level evidence (no @PreAuthorize on class; no SecurityConstants
      entry; no admin variant) cross-confirms what the method-level sidecar
      already established.
    - **ActivityServiceImpl (26th sidecar — service-tier)**: line-by-line
      verifies ZERO authorization annotations or programmatic checks across
      273 lines. The service-tier confirmation completes the HTTP-tier
      finding: not just the controller is unauthorized, the WHOLE flow
      (HTTP entry → service-tier dispatch → repository read) is uniformly
      ungated.
    - **ReactiveActivityRepositoryImpl (27th sidecar — repository-tier SQL
      primary source)**: confirms the SQL-tier read paths are cross-owner
      with no row-level filter. The 'my activities' SQL semantic (filter
      by data entities the caller owns, NOT by activities the caller
      performed) is a distinct axis-mismatch finding that affects how
      operators interpret the MY_OBJECTS view-mode.

  The catalog now has end-to-end (UI shell → UI page → UI thunk → API →
  service → SQL) UNIFORM confirmation across TWENTY-SEVEN surfaces that
  the read-collaborative posture is the platform INTENTIONAL design
  choice AND that no UI affordance compensates for the absence of
  owner-scoping in the backend.

  **Three posture sub-classes** now visible in the catalog (UPDATED batch VAL-LSN-019-B):
    (1) **UNAPPLIED at every layer** — getActivity, ActivityController class,
        ActivityServiceImpl, ReactiveActivityRepositoryImpl (Activity feature
        family); getAllAlerts, getDataEntityDownstreamLineage,
        getDataEntityDetails, getDataEntityAlerts; Owner directory; UI shell;
        4 Management catalogue lists; the canonical REFACTOR-024 / 203
        family expanded;
    (2) **POSITIVE-CASE-WITH-SINGLE-POINT-OF-FAILURE** —
        getMyObjectsWithUpstream / Downstream;
    (3) **APPLIED-AS-ADDITIVE-SCOPE** — facets aggregator suite;
    (4) **WIDEST-BLAST DEG-ANCHORED** — getDataEntityGroupsLineage;
    (5) **PRINCIPAL-AWARE FILTER WITH SILENT UI** —
        RolesList + PolicyList (non-ADMIN branch); the read DOES apply a
        principal filter (via filterUserRoles / getRolePolicies in-memory),
        but the UI gives NO operator-facing signal that filtering is
        happening;
