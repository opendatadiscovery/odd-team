    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match  # the guard-rail-against-destructive-misconfiguration promise (a fail-fast / preview / dry-run that prevents the destructive no-match-everything case)
