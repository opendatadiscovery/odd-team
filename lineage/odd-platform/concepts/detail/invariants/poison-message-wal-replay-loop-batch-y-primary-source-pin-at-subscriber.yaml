name: |-
  Poison-message WAL replay loop — STRENGTHENED batch Y with primary source at NotificationSubscriber inner-outer loop (lines 77-100) + bridge-seam (PostgresWALMessageProcessor void return)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
description: |-
  STRENGTHENS the existing poison-message-wal-replay-loop invariant (batch K)
  by PRIMARY-SOURCE pinning the failure mode at TWO new layers identified
  in batch Y:
    Layer A — NotificationSubscriber side (batch Y NotificationSubscriber
      sidecar): the inner-outer loop architecture at lines 77-100 that
      converts an uncaught exception in process() into a 10s back-off
      + re-acquire cycle with LSN un-advanced.
    Layer B — PostgresWALMessageProcessor side (batch Y
      PostgresWALMessageProcessor sidecar): the void-return + narrow-
      throws SPI seam shape that DENIES the dispatcher a typed channel
      to signal "this LSN is poison, please skip" to the subscriber.

  The batch-K invariant identified the SYMPTOM (a persistently-bad
  ALERT row blocks all subsequent WAL messages indefinitely) at the
  dispatcher-implementor level. Batch Y root-causes at TWO layers
  bracketing the symptom:
    BELOW the symptom (subscriber/inner-loop side) — the architecturally
    fixed 10s retry cadence + LSN-advance-after-process pattern;
    ABOVE the symptom (seam/contract side) — the void return that
    denies expressivity.

  THE NEW PRIMARY-SOURCE EVIDENCE — NotificationSubscriber batch Y:

    NotificationSubscriber.java:77-91 (inner loop):
      final ByteBuffer buffer = stream.readPending();
      if (buffer == null) { ...sleep 10ms... continue; }
      final Optional<DecodedWALMessage> decodedMessage = messageDecoder.decode(buffer);
      if (decodedMessage.isPresent()) {
          messageProcessor.process(decodedMessage.get());
      }
      stream.setAppliedLSN(stream.getLastReceiveLSN());
      stream.setFlushedLSN(stream.getLastReceiveLSN());
    The LSN advance at lines 83-84 is POSITIONED AFTER process(). A throwing
    process() bypasses the LSN advance entirely. No try/catch is wrapped
    around the process() call in this inner block.

    NotificationSubscriber.java:90-100 (outer catch + 10s retry):
      } catch (final Exception e) {
          log.error("Error occurred while subscribing", e);
      }
      log.debug("Released a lock, waiting 10 seconds for next iteration");
      try {
          TimeUnit.SECONDS.sleep(10L);
      } catch (final InterruptedException ex) {
          Thread.currentThread().interrupt();
          throw new NotificationSubscriberException(ex);
      }
    The catch is generic — ALL Exception subtypes converge to the same
    log line + same 10s sleep + same lock re-acquire. SQLException
    (connection drop), RuntimeException (translator poison), Postgres-
    side replication-protocol violation, decoder out-of-bounds read —
    all converge.

    NotificationSubscriber.java:46-92 (outer while loop):
      while (!Thread.interrupted()) {
          try (final Connection connection = leaderElectionManager
                  .acquire(walProperties.getAdvisoryLockId(), true)) {
              ...
              // inner while-true at line 60-85
              ...
          } catch (final Exception e) { ... }
          ... 10s sleep + retry ...
      }
    On retry: the lock is re-acquired (or block-waits if another instance
    grabbed it), the slot existence check fires, the publication
    existence check fires, the stream is rebuilt — and then the SAME WAL
    LSN is re-delivered (because confirmed_flush_lsn was never advanced
    past the bad row).

  THE NEW PRIMARY-SOURCE EVIDENCE — PostgresWALMessageProcessor batch Y:

    PostgresWALMessageProcessor.java (the entire 7-line file):
      void process(final DecodedWALMessage message) throws InterruptedException;
    The seam declares:
      - return: void (no per-call status)
      - throws: only InterruptedException (cooperative shutdown only)
    The wider exception surface that the implementor actually throws
    (IllegalArgumentException, IllegalStateException, RuntimeException
    from a JSON-serialise error path) is UNDECLARED at the seam.

  THE COMPOUND FAILURE MODE — primary-sourced across the seam:

    Step 1 — A persistently-bad ALERT row triggers
             AlertNotificationMessageTranslator.translate(...) to throw
             IllegalArgumentException (unknown alert-type code) or
             IllegalStateException (missing FK, NULL type_id).
    Step 2 — The translate is invoked from
             AlertNotificationMessageProcessor.process(...) BEFORE the
             per-sender catch (the dispatcher's intentional bifurcation
             between fail-loud-on-data-integrity-errors and fail-soft-
             on-delivery-errors per batch-K implicit_adrs.[3]).
    Step 3 — The unchecked exception bubbles out of process() —
             undeclared at the seam (only InterruptedException is
             declared per PostgresWALMessageProcessor.java:6).
    Step 4 — NotificationSubscriber.run()'s inner loop sees the throw;
             the LSN advance at lines 83-84 is bypassed; the outer
             catch at line 90 fires; the lock is released via the
             try-with-resources Connection close at line 92; the
             outer-loop 10s sleep + re-acquire fires.
    Step 5 — The next outer iteration: leader-elect-acquire, slot/pub
             probes, new stream open, polling resumes — and the SAME WAL
             LSN is re-delivered because confirmed_flush_lsn never
             advanced.
    Step 6 — Loop forever until operator intervenes.

  THE NEW INSIGHTS BEYOND BATCH K:

    Insight 1 — The 10s retry cadence is HARDCODED (no operator knob):
      NotificationSubscriber.java:96 — TimeUnit.SECONDS.sleep(10L). No
      config key surfaces this value. Operators cannot stretch the
      cadence to reduce log spam (6 retries/minute under sustained
      poison) or shorten it for faster failover-after-fix.
      Batch-K implicit framing was "10s back-off"; batch-Y primary-
      sources the hardcoded constant.

    Insight 2 — The seam's void return is the architectural reason
      no "skip poison" path exists:
      Even a maintainer wanting to add poison-skip logic at the
      dispatcher cannot signal "I have decided this LSN is unparseable;
      please advance past it" to the subscriber via the current seam.
      The seam's void return forces poison-skip into a side-channel
      (e.g. a dedicated alert_notification_poison table that the
      dispatcher writes to and the subscriber consults before
      processing) rather than an in-seam contract. The architectural
      change required is non-trivial.

    Insight 3 — Generic catch (Exception e) at line 90 absorbs ALL
      Exception subtypes uniformly:
      Operators cannot distinguish 'transient PG connectivity blip'
      (sleep 10s, retry, fixed in next cycle) from 'persistent poison
      message' (sleep 10s, retry, fails again, forever). Both produce
      the same log line. No error-class taxonomy, no Prometheus counter,
      no structured field. Batch-Y NotificationSubscriber
      bugs_limitations_corner_cases.[6] explicitly captures this as
      MEDIUM severity.

    Insight 4 — The poison-replay loop pins setAppliedLSN, which means
      Postgres retains WAL on the primary until the operator
      intervenes:
      The slot-side WAL retention is unbounded under sustained
      poison-replay. Pair this with the rename-orphan failure mode
      (lazy-create-no-drop replication artefacts) and the platform has
      TWO distinct unbounded-WAL-retention paths that both lead to
      Postgres-primary disk exhaustion. Batch-Y wal-retention-disk-
      exhaustion-under-poison-replay-no-bound invariant primary-sources
      this consequence in full.

  THE 4-LAYER PICTURE (was 1-layer at batch K, now 4-layer):

    Layer 1 (dispatcher batch K — symptom):
      translate() runs uncaught BEFORE per-sender fan-out; data-integrity
      errors propagate up.
    Layer 2 (subscriber batch Y inner+outer loop — mechanism):
      LSN-advance-after-process unconditionally; generic catch
      (Exception); 10s retry cadence hardcoded; lock re-acquired AFTER
      sleep.
    Layer 3 (seam batch Y — architectural root cause):
      void return + only InterruptedException declared = no expressivity
      for poison-skip / partial-success signalling.
    Layer 4 (consequence batch Y — disk exhaustion):
      Sustained poison-replay = unbounded WAL retention on primary =
      eventual platform-wide write outage.

  SEVERITY remains HIGH (inherited from batch-K); this strengthening
  does not change severity but provides the full 4-layer architectural
  picture.
