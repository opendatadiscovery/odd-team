behaviour: |-
  update on a soft-deleted role: idCondition adds `deleted_at IS NULL` filter so no rows match; the returning UPDATE produces no record and the Mono completes empty rather than raising NotFoundException. The NotFound semantic lives at the SERVICE layer (RoleServiceImpl.java:67 `.switchIfEmpty(Mono.error(new NotFoundException("Role", id)))`) — a service-bypassing caller silently no-ops. Also: update never mutates `created_at` or `id` (getNonUpdatableFields excludes them); `deleted_at` immutability via update is a defence against accidentally undeleting.
