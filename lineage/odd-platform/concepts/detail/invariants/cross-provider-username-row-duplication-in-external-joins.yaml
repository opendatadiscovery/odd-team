mitigations_unimplemented:
- |-
  Add a `provider` column equality predicate to each of the four external
  JOIN sites:
    Site 1 — ReactiveAlertRepositoryImpl.java:83-86: change LEFT JOIN to
      include `AND USER_OWNER_MAPPING.PROVIDER = ALERT.STATUS_UPDATED_BY_PROVIDER`
      (requires adding a `status_updated_by_provider` column to alert
      table, or correlating via the user_owner_mapping table on a
      pre-resolved owner_id at write time)
    Sites 2-4: similar shape change — requires either a new schema
      column to carry the provider, OR a write-time pre-resolution of
      owner_id (the better fix — resolve the principal to an OwnerPojo
      at write time and store owner_id on the alert/activity/etc., then
      LEFT JOIN on OWNER.id without the user_owner_mapping intermediate)
- |-
  Add a build-time invariant scanner that flags any new repository LEFT
  JOIN against USER_OWNER_MAPPING that lacks a PROVIDER predicate — the
  cross-provider row-duplication bug class repeats every time a new
  display-name surface is added without awareness of the compound key.
- |-
  Document the multi-row-per-oidc_username schema permission on the
  user-owner-association doc page; the operator's mental model is
  "one user, one mapping" but the schema is "one user-per-provider, many
  rows can coexist for the same oidc_username string." A future operator
  inspecting USER_OWNER_MAPPING wondering "why does alice have two rows"
  needs the docs.
- |-
  Add an operator-facing audit-script in the operations playbook that
  scans `SELECT oidc_username, COUNT(*) FROM user_owner_mapping WHERE
  deleted_at IS NULL GROUP BY oidc_username HAVING COUNT(*) > 1` —
  surface every overlap to the operator at audit time so they can plan
  the migration cleanup.
- |-
  Add regression tests at each of the four offending repositories
  exercising the two-row scenario:
    (a) Insert (alice, null, owner=X);
    (b) Insert (alice, GITHUB, owner=Y);
    (c) Insert an alert with STATUS_UPDATED_BY='alice';
    (d) Read `/api/alerts` — assert exactly ONE row is returned
        (the fix) OR assert TWO rows (the current — buggy — behaviour)
        as a pin until the fix lands.
notes: |-
  NEW invariant captured in batch 2026-05-19N. Surfaced by triangulating
  the ReactiveUserOwnerMappingRepositoryImpl PRIMARY SOURCE (the
  authoritative compound key contract) against the four external sibling
  repositories that violate the compound-key contract on JOIN.

  The bug is DORMANT in single-auth-mode deployments — every operator
  running just LOGIN_FORM or just LDAP or just OAUTH2 has at most one
  active row per oidc_username and the LEFT JOIN's missing provider
  predicate never matters. The bug SURFACES on:
    (a) auth-mode migrations
    (b) composed auth-mode deployments
    (c) operator-manual cleanup mistakes (the empty-string-vs-null
        provider case via the manual association endpoint)

  Cross-cutting connections:
    - Pairs with "LOGIN_FORM/LDAP provider=null cross-mode bleed" —
      both stem from the (oidc_username, provider) compound key being
      load-bearing while inconsistently consumed
    - Cross-references "user-owner-mapping" entity — the compound key
      shape's two-row coexistence is the schema-side enabler
    - Cross-references read-collaborative-cross-owner-enumeration —
      the same Alert + Activity + Owner repositories are the read
      surfaces that already exhibit cross-owner posture; this finding
      adds a CORRECTNESS bug on top of the documented POSTURE

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the two-row schema permission on user-owner-association
    (b) Document the cross-provider username audit query on the
        operations playbook
    (c) Update the FOUR offending repository JOINs to carry the provider
        predicate (CODE FIX preferred over DOC-only mitigation)
