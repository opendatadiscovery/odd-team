- id: H-010
  hypothesis: "The Associations tab is hidden from operators who do not hold OWNER_ASSOCIATION_MANAGE (as the live doc states), so non-privileged operators never see pending-request data."
  derivation: "Doc-claim seed — the live page asserts 'The Associations tab is hidden from operators who do not hold the OWNER_ASSOCIATION_MANAGE permission.'"
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      The code does NOT hide the tab/list from non-holders. The list is reachable to
      any authenticated user (feature-flow hop 1: the outer WithPermissionsProvider
      gates only the Header on OWNER_RELATION_MANAGE, NOT the list — F-171.yaml:40-45;
      cross-link F-074 read-collaborative posture). Within a row, the Accept/Reject
      buttons are DISABLED, not hidden, for non-holders (NewAssociationRequest.tsx:84,101).
      So a non-OWNER_ASSOCIATION_MANAGE operator who reaches /management/associations/new
      can SEE every pending request (a privileged read the doc says they cannot reach)
      and merely cannot act. The doc claim is doubly wrong: wrong mechanism (hidden vs
      disabled) and arguably wrong permission for the surrounding Header gate
      (OWNER_RELATION_MANAGE).
    evidence:
      - sidecar: feature-flows/detail/F-171.yaml
        section: chain hop 1 + facet permission_gate_disables_button_but_does_not_hide_row
        cite: "F-171.yaml:40-45, 156-172"
        note: "Outer permission provider wraps the Header only; list reachable to any authed user; buttons disabled not hidden."
      - sidecar: NewAssociationRequest.tsx
        section: button disabled gate
        cite: "NewAssociationRequest.tsx:84, 101"
        note: "disabled (not absent) for non-holders."
        source_read_for_validation: true
      - sidecar: WebFetch user-owner-association
        section: tab visibility claim
        cite: "WebFetch 2026-06-03 status 200 — 'Associations tab is hidden ... OWNER_ASSOCIATION_MANAGE'"
        note: "Doc claims hidden; code disables and lists to any authed user."
    operator_visible_failure: |
      Doc-vs-code drift on a security-relevant claim. An operator (or auditor)
      reading the doc believes pending-request data — requester usernames, target
      owners, requested roles, providers — is invisible to non-privileged users.
      Under the read-collaborative posture it is NOT: any authenticated user can
      enumerate it. The truth is whatever the code does (per Rule 1); the doc claim
      becomes a doc-gap. This is a partial overlap with the broader read-collaborative
      doc-silence already tracked, but the specific "tab is hidden" assertion is a
      fresh factual error on this page.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: doc-gap-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: "When two operators approve two different pending requests for the same single-user Owner at the same moment, the system resolves to a single consistent binding without a lost update, a deadlock, or a half-cascade."
  derivation: "Negative-space + performance — the controller sidecar flags concurrent approvals on the same Owner can deadlock on lock-acquisition order (performance.scaling_characteristics)."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      updateOwnerAssociationRequest runs under @ReactiveTransactional
      (OwnerAssociationRequestServiceImpl.java:89) and the cascade-cancel
      (:192-203) takes row locks on N owner_association_request rows. The controller
      sidecar performance section explicitly notes "concurrent approvals on the same
      Owner can deadlock on owner_association_request lock acquisition order (not
      currently observed; not currently guarded)". Whether two concurrent approvals
      deadlock, serialise cleanly, or produce a lost cascade cannot be determined by
      reading — it requires running two concurrent transactions against PostgreSQL.
    evidence:
      - sidecar: OwnerAssociationRequestController (controller sidecar)
        section: performance.scaling_characteristics + known_performance_gaps[1]
        cite: "OwnerAssociationRequestServiceImpl.java:89, 192-203 (per controller sidecar perf block)"
        note: "Cascade-cancel holds O(N) row locks under one transaction; concurrent same-Owner approvals unguarded."
    operator_visible_failure: |
      If a deadlock occurs, one operator's approve fails with a transaction error
      (recoverable but confusing); if a cascade race loses an update, a request the
      operator believes declined could remain pending or vice-versa. Severity is
      contingent on the measured outcome — hence probe-needed.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-171-1
    routes_to_finding: functional-test-demand
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: "PENDING-F-171-1 (probe)"

- id: H-012
  hypothesis: "An operator searching the pending list (e.g. typing a requester name) keeps their filter as they move between the New, Active, and History tabs, so they don't lose their place mid-triage."
  derivation: "UI-label + senior-PO UX seed (is the interaction convenient/consistent?) — facet tab_switch_resets_search_query_to_empty."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      The search atop the list filters the pending set (OwnerAssociationsNew.tsx:28-33
      passes debouncedQuery into useGetOwnerAssociationRequestList). On tab change,
      OwnerAssociationsTabs.onTabChange explicitly calls setQuery('') and invalidates
      the ownerAssociationRequestList query key (per feature-flow facet
      tab_switch_resets_search_query_to_empty, OwnerAssociationsTabs.tsx:44-47). So
      within a tab the search works as promised; CROSSING tabs deliberately clears
      it. The reset is intentional (explicit setQuery('')), not a state-management
      accident — but from the operator's seat it means a filter typed on New is gone
      after a glance at Active.
    evidence:
      - sidecar: feature-flows/detail/F-171.yaml
        section: drift facet tab_switch_resets_search_query_to_empty
        cite: "F-171.yaml:173-188 (OwnerAssociationsTabs.tsx:44-47 onTabChange setQuery(''))"
        note: "Explicit reset on tab change; intentional, not structural."
    operator_visible_failure: |
      An operator who filters New-requests to "alice", clicks Active to check an
      existing binding, and returns to New finds the filter cleared and the full
      pending list back. Low-severity inconvenience, not data-incorrect; it is the
      explicit product choice rather than a bug, so it routes to a caveat. (This is
      the in-chain UI hop reading the flow can confirm; the broader experiential
      flow remains H-000-UI-GAP.)
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

