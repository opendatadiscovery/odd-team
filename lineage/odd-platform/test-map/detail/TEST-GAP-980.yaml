proposed_action: |-
  Add `DataEntityRunCrossOwnerReadTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `getRuns_callerIsNotOwner_returns200WithStatusReasonTextVerbatim_pinsBroadcast` — seed alice (owner) creates a DQ-test; ingest a FAILED run with `status_reason = "Failed assertion: email=alice@example.com violated UNIQUE constraint"`; switch principal to bob (no ownership); GET `/api/dataentities/{id}/runs`; assert HTTP 200 + items[0].statusReason contains "alice@example.com" verbatim. PIN the broadcast.
  2. `getRuns_callerHasNoOwnershipAnywhere_returns200WithFullExecutionTimeline_pinsEnumeration` — seed multiple datasets owned by alice + carol + david; switch principal to bob with no ownership; GET runs for EACH dataset; assert HTTP 200 each time. PIN the catalog-wide enumeration vector.
  3. `getRuns_authTypeDISABLED_anonymousCaller_returns200WithStatusReasonAndPII_pinsWorstCase` — under DISABLED, no authentication; GET runs of any dataset; assert HTTP 200 with `status_reason` verbatim. PIN the worst-case anonymous PII leak.
  4. `getRuns_callerIsDirectOwner_returns200_baselineNonRegressionAssertion` — alice as owner GETs her own DQ-test runs; assert HTTP 200. Baseline so that future hardening (when read is restricted) flips tests 1+2+3 but NOT this one.

  Pair with REFACTOR-024 follow-up: introduce optional `DATA_ENTITY_VIEW_RUNS` permission + parent-DataEntity owner-scoping predicate at the SQL layer. Pair with DOC-NNN: surface the cross-owner read posture + PII broadcast caveat on the data-quality doc page (currently silent per the sidecar's doc_drift_findings).
