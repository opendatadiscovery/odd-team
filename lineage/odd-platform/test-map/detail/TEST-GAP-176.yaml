gap_id: TEST-GAP-176
category: missing-edge-case
criticality: HIGH
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties
surfaced_by:
- NotificationsProperties.md:bugs_limitations_corner_cases.[2]
behaviour: 'Advisory-lock-id collision risk: `notifications.wal.advisory-lock-id=100`
  vs `partition.advisory-lock-id=90` + `datacollaboration.receive-event-advisory-lock-id=110`
  + `datacollaboration.sender-message-advisory-lock-id=120`. Distinct in shipped defaults,
  but operator-customisation can collide — the notification subscriber would either
  never get leadership OR collide with another subsystem. No collision detection at
  boot.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/AdvisoryLockIdCollisionTest.java
  name: configuredCollidingLockIds_subscriberNeverElectedAndNoBootFailure
evidence:
- 'NotificationsProperties.md says: ''advisory-lock-id collision risk: notifications.wal.advisory-lock-id
  defaults to 100 ... if an operator customises any of these and reuses 100, the notification
  subscriber will never get leadership (or will collide with another subsystem)'''
cross_references:
- concepts.yaml:entities[Notifications].security_aggregate.weaknesses.[9]
proposed_action: Configure `notifications.wal.advisory-lock-id` equal to `partition.advisory-lock-id`;
  boot the platform; assert (a) boot succeeds (no collision detection), (b) only one
  of the two subsystems' leader is elected. Drives a boot-time collision-detection
  hardening as a deliberate test update.
