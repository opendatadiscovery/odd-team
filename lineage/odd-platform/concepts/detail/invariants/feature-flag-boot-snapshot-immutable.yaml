notes: |-
  STRENGTHENED batch 2026-05-25-ZF — the @ConditionalOnDataCollaboration
  class-gates on DataCollaborationController + EventApiController
  show the COMPLEMENTARY mechanism: feature-flag resolution affects
  BOTH /features/active (the snapshot endpoint) AND the routes the
  feature controls (404 OR live). The pattern is architecturally
  uniform across the platform's feature surface.

  The boot-snapshot stance is INTENTIONAL — operators expecting
  hot-reload behavior would be silently misled. Doc-side closure
  should name the boot-resolution semantics explicitly so operators
  know to expect process restart.
