discovered_from_entry_point: |-
  ui_route:/management/* (the React-Router-DOM v6 wildcard mount that
  hosts the 9 Management sub-area routes — owners, roles, policies,
  namespaces, datasources, collectors, tags, integrations, associations).
  App.tsx:62 mounts <Route path={`${managementPath()}/*`} element={<Management />} />
  with no route-level RestrictedRoute or redirect guard.
description: |-
  The Management UI is conceptually admin-tier in every published doc and
  every conventional ODD-deployment runbook — but the SPA implements
  AUTHORIZATION ONLY ON THE MUTATING ENDPOINTS, not on the read-side
  navigation. Eight of nine Management sub-areas (/management/owners,
  /roles, /policies, /policies/{id}, /namespaces, /datasources, /collectors,
  /tags, /integrations) fetch and render the full catalog of that
  surface on mount, regardless of the user's permission set. Only
  /management/associations/* is route-gated via a RestrictedRoute
  redirect.

  The structural reason: `Management.tsx:9-12` wraps the entire section
  in `<WithPermissionsProvider allowedPermissions={[OWNER_ASSOCIATION_MANAGE]}>`,
  but `WithPermissionsProvider.tsx:12-48` is a CONTEXT PROVIDER, not a
  rendering gate — it returns `children` unconditionally in every branch.
  The inner ManagementRoutes (`ManagementRoutes.tsx:29-149`) likewise
  wraps each sub-route in a per-route WithPermissionsProvider, which
  again only provides context.

  The single working route-gate in the entire Management section is at
  `ManagementRoutes.tsx:101-110` — `RestrictedRoute` on `/associations/*`
  with a redirect destination. Every other sub-route just renders.

  Concrete observable consequences:
  (a) `/management/policies` renders the full Policy LIST; non-admin
      users see Policy names + their owners. Clicking through to
      `/management/policies/{id}` renders the full Policy JSON
      (permission grants, ODDRN selectors, role bindings). No
      mutation can be performed (create/edit/delete buttons hide via
      `hasAccessTo(POLICY_MANAGE)` calls), but the disclosure is real.
  (b) `/management/integrations` is the WORST case — there is NO
      permission-context wrapping at all on the route. Inner
      `usePermissions().hasAccessTo` calls fall back to the OUTER
      Management.tsx context (`OWNER_ASSOCIATION_MANAGE`), producing
      a surprising deny-by-default for any integration-specific
      permission check.
  (c) Under `auth.type=DISABLED`, every anonymous network caller
      reaches every Management sub-area; the deployment's RBAC model
      is fully visible to the public (when the platform is exposed
      to the public network — REFACTOR-185 19-sidecar cluster
      anchors this).

  The drift is structural: the platform exposes the Management UI as an
  "admin" affordance in its toolbar (F-041 tab visibility) but does not
  implement that affordance with the gate operators would expect. The
  read-collaborative posture (per P-09 maintainer notes: "every
  authenticated user can enumerate the entire catalog") IS the platform-
  wide stance — F-105 is the Management-section-specific instance
  worth documenting + considering whether to harden.

  Doc-side: `docs.opendatadiscovery.org/features/management` does NOT
  document the Management UI's permission visibility model, does not
  warn that READS are not gated, does not list per-tab visibility
  rules. The doc reinforces the operator's mistaken model.
