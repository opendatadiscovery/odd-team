  - gap_id: TEST-GAP-250
    category: missing-security
    criticality: HIGH
    node_ids:
      - "odd-platform java SearchController controller-method:search"
    surfaced_by:
      - "search.md:bugs_limitations_corner_cases.[1]"
    behaviour: "Postgres `to_tsquery` syntax-error vector — `JooqFTSHelper.tsQuery` (lines 164-168) splits the inbound query string on a single space character, appends `:*` to each non-empty token, joins with `&`, and passes the joined string verbatim into `to_tsquery(?)` (lines 103, 158). A user query containing `tsquery`-meaningful metacharacters not separated by a space (`foo!bar`, `foo|bar`, `(foo)`, `a<->b`, `foo:`, unbalanced `(`) yields a malformed `to_tsquery` argument and Postgres raises `syntax error in tsquery: ...` surfacing as 500. Conversely, a balanced `tsquery` expression silently re-interprets as that expression (operator chaining, prefix-globbing via `:*` is user-controllable). No input sanitisation, no escape of metacharacters, no error mapping. `SearchFormData.query` carries no `@Size`/`@Pattern`/max-length constraint."
    test_files_existing: []
    test_files_proposed:
      path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/SearchFTSQuerySyntaxTest.java"
      name: "search_queryWithUnbalancedParen_returns500_withRawPostgresError"
    evidence:
      - "search.md says: 'A user query containing tsquery-meaningful metacharacters not separated by a space ... yields a malformed to_tsquery argument and Postgres raises `syntax error in tsquery`'"
      - "search.md:bugs_limitations_corner_cases.[1] severity MEDIUM"
      - "concepts.yaml:entities[Search Session].security_aggregate.weaknesses.[1] verbatim: '**`to_tsquery` syntax-error vector via raw user input (MEDIUM)**'"
    cross_references:
      - "concepts.yaml:entities[Search Session].security_aggregate.weaknesses.[1]"
    proposed_action: "Add a parameterised `SearchFTSQuerySyntaxTest` covering: (a) `foo!bar` → 500 syntax-error; (b) `(foo)` → 500; (c) `a<->b` → 500; (d) `foo:` → 500; (e) `foo & bar` (balanced) → 200 with re-interpreted semantics. Drives the fix (either sanitise via `quote_literal` + `phraseto_tsquery`, or catch and translate to 400 BadUserRequest)."

