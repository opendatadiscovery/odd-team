gap_id: TEST-GAP-156
category: missing-integration
criticality: HIGH
node_ids:
- odd-platform java OAuthSecurityConfiguration config-key-consumer:auth.type@L71
surfaced_by:
- OAuthSecurityConfiguration@L71.md:bugs_limitations_corner_cases.[6]
- OAuthSecurityConfiguration@L71.md:performance.known_performance_gaps.[0]
behaviour: 'Multi-replica session breakage: Spring default `WebSession` is in-memory
  per JVM. No `@EnableSpringWebSession`/Redis session store. OAuth2 callback may hit
  a different pod than the initiating `/oauth2/authorization` redirect → ''authorization
  request not found'' errors. No doc-side prerequisite.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/integration/OAuth2MultiReplicaSessionTest.java
  name: oauth2_redirectOnPodAndCallbackOnPodB_authorizationRequestNotFound
evidence:
- 'OAuthSecurityConfiguration@L71.md says: ''a user''s OAuth2 access token is tied
  to whichever pod handled the initial callback — subsequent requests routed to other
  pods would not find the session'''
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[9]
proposed_action: 'Add Testcontainers-based dual-instance test: instance A handles
  `/oauth2/authorization/{regId}` and stores the auth request in its in-memory session;
  instance B receives the callback at `/login/oauth2/code/{regId}`; assert B returns
  the ''authorization request not found'' error. Locks the multi-replica failure mode;
  drives shared session-store hardening as a deliberate test update.'
