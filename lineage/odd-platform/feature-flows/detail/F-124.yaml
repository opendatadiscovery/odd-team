feature_id: F-124
feature_name: "Cross-Provider ADMIN Promotion Semantics — six distinct admin-detection mechanisms diverge per auth provider"
pillar_id: P-09
pillar_anchored_id: P-09:F-009
pillar_anchored_feature_name: "ADMIN Promotion Across Auth Providers"
seeded_from: SHB-181
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  auth-handler:{LDAP,Cognito,GitHub,Google,Azure,ODD_IAM}UserHandler — six
  distinct `*UserHandler.shouldHandle() + extractAdminAuthorities()`
  implementations across LDAP + 5 OAuth2 providers. Plus LOGIN_FORM where
  admin is granted at user-creation time via UI rather than via config.
