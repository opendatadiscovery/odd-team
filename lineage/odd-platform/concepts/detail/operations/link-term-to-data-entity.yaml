name: Link Term to Data Entity
canonical_in_docs: false
canonical_candidate: false
description: POST /api/dataentities/{id}/terms — write a single (data_entity, term)
  edge with is_description_link=FALSE into data_entity_to_term. Service is @ReactiveTransactional
  + @ActivityLog(TERM_ASSIGNMENT_UPDATED). Duplicate-prevention via onDuplicateKeyIgnore
  + switchIfEmpty → 400 BadUserRequest. AUTHORIZATION IS BROKEN (path-mismatch /term
  singular vs /terms plural).
nodes:
- odd-platform java DataEntityController controller-method:addDataEntityTerm
contributing_files:
- odd-platform__java__DataEntityController__controller-method__addDataEntityTerm.md
evidence:
- addDataEntityTerm.md:concepts.operations[link-term-to-data-entity]
axes_present:
- controllers
- openapi_paths
security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: Path mismatch silently disables DATA_ENTITY_ADD_TERM. Falls through to
      .authenticated().
  owner_scoping:
    verdict: BYPASSES
    detail: Any authenticated caller can link any term to any data entity
  weaknesses:
  - SecurityRule path mismatch — HIGH severity
  - No bulk-link variant; N terms = N HTTP calls
