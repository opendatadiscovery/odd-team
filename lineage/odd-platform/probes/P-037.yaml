realism_caveats: |
  The probe pins boundary behaviour of the unbounded `size` parameter. If
  max_size_status is 200 with all rows, the endpoint has no DoS guard — a caller
  can request the whole catalog in one query (the contract advertises no max).
  This is LOW severity for typical catalogs (<500 sources) but the absence of a
  clamp is a documentable fact. The probe seeds only 5 rows; it does NOT measure
  latency / memory at a 100k-row catalog — a performance variant under
  stack_profile odd-load would be needed to characterise the actual DoS surface.
  The negative-size and zero-page asserts use `in (400, 500)` because the exact
  status is genuinely not statically determinable (depends on R2DBC driver
  coercion of a negative LIMIT/OFFSET) — that is the probe's job to resolve.
