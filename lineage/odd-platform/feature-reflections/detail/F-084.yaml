- id: H-007
  hypothesis: |-
    When an operator sets `admin-groups: [admins]` on a GitHub client, only members of the
    team named exactly `admins` (within organization-name) are granted ADMIN — not members of
    teams whose names merely contain "admins" (e.g. `team-admins`, `data-admins`).
  derivation: |-
    Operators read `admin-groups` as an exact-match allowlist; whether the match is exact or
    substring decides how many users are silently promoted.
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      The GitHub admin-team check resolves through `OperationUtils.containsIgnoreCase`, which
      is `collection.stream().anyMatch(element::equalsIgnoreCase)` — i.e. it returns true only
      when an `adminGroups` ENTRY case-insensitively EQUALS the team name (full-string), NOT a
      substring containment. So `admin-groups: [admins]` matches a team named `Admins` /
      `ADMINS` but NOT `team-admins` or `data-admins`. The match is exact (case-insensitive),
      as the operator expects. NOTE: this directly contradicts the premise of the
      already-tracked HIGH issue PLT-081, which asserts these sites do SUBSTRING matching — see
      bug_candidates (net-new correction) and validation_gaps below.
    evidence:
      - sidecar: odd-platform__java__auth__handler__GithubUserHandler.md
        section: concepts.invariants (admin-team-match-full-string-eq) + coupling note flagging the conflicting candidate
        cite: "GithubUserHandler.java:114-120, 122-131 + OperationUtils.java:7-10"
        note: "containsIgnoreCase = anyMatch(equalsIgnoreCase) — full-string, not substring"
      - sidecar: "OperationUtils.java (source read for validation)"
        section: containsIgnoreCase
        cite: "OperationUtils.java:9"
        note: "return collection.stream().anyMatch(element::equalsIgnoreCase) — definitively exact-match"
        source_read_for_validation: true
    severity: ""
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: |-
    When an operator types a provider value with a typo (`provder: google`) or picks an
    unsupported value, the platform fails to start (fail-fast) so the operator notices before
    shipping.
  derivation: |-
    The `@PostConstruct` validator already fails boot for empty clientId/provider
    (ODDOAuth2Properties sidecar invariant 1) — an operator expects the same fail-fast for an
    invalid provider value.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      `OAuth2Provider.provider` is a free `String`, not the `Provider` enum (ODDOAuth2Properties
      .java:32). The `@PostConstruct` validator checks only non-empty clientId + non-empty
      provider; it does NOT check membership in any allowlist. So `provder: google` binds
      cleanly, fails every handler's `shouldHandle(...equalsIgnoreCase(Provider.X.name()))`,
      and silently routes through CustomOIDCUserHandler — a working generic-OIDC deployment
      with none of Google's provider-specific enrichment (no allowed-domain, no email-default
      admin-attribute). Boot succeeds; the misconfiguration is invisible.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_auth__config-properties-class__ODDOAuth2Properties.md
        section: implicit_adrs[2] + bugs_limitations_corner_cases (provider-typo-silent) + security.known_security_gaps[2]
        cite: "ODDOAuth2Properties.java:32 + ODDOAuth2Properties.java:16-28 (validator skips enum membership)"
        note: "free String, no enum constraint, validator does not check allowlist"
    operator_visible_failure: |-
      A single-character typo in the most security-load-bearing config key produces a
      deployment that "appears to be Google" but is actually generic Custom-OIDC: allowed-domain
      is silently off, the email-default admin-attribute does not apply, and the operator's
      admin policy may not fire. The platform boots green, so the operator gets no signal until
      an admin can't log in or an out-of-domain user gets in.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-009
  hypothesis: |-
    When an operator follows the docs for Azure and omits `logout-uri` (or relies on defaults),
    logout works without error.
  derivation: |-
    The fail-fast validator enforces clientId+provider; an operator expects either enforcement
    of, or a safe default for, any provider-required field.
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      The docs state Azure `logout-uri` is mandatory ("An unset logout-uri raises a
      NullPointerException and the logout flow returns a 500 response" — ODDOAuth2Properties
      sidecar doc excerpt). The `@PostConstruct` validator checks ONLY clientId+provider, NOT
      logoutUri (ODDOAuth2Properties.java:16-28). AzureLogoutSuccessHandler.java:39 calls
      `URI.create(provider.getLogoutUri())` with no null guard — `URI.create(null)` throws NPE
      per the JDK contract. CognitoLogoutSuccessHandler has the matching isEmpty guard; Azure
      does not. So an Azure operator who omits logout-uri boots successfully and hits a 500 at
      first logout.
