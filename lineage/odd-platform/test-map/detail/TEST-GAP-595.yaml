behaviour: |-
  **admin-principals BYPASS organization-name gate — explicit allowlist beats org gate, but UNDOCUMENTED.** Lines 54-67 fire BEFORE the org check at lines 68-96. If the user's `admin-attribute` claim (default `login`) full-string-case-insensitive-matches any `adminPrincipals` entry, the handler returns ADMIN with NO `/user/orgs` HTTP call AND NO organization-name verification. An operator's `adminPrincipals: [external-consultant]` makes `external-consultant` ADMIN even if NOT a member of `organizationName` — by design (implicit_adrs[1]). The maintainer's intent: grant ADMIN to a specific user outside the org (a consultant, an external admin) via the explicit allowlist. Live docs WebFetched 2026-05-19 status 200: `admin-principals` described as 'Direct list of users granted ADMIN role' WITHOUT flagging the org-bypass semantic. Operator threat model: a misuse can elevate an out-of-org user. The doc drift is MEDIUM severity (deliberate design but undocumented; counter to a reasonable operator mental model where `organization-name` is a global gate).
