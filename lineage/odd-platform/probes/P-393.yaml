realism_caveats: |
  The EXPLAIN statements reconstruct the expression BY HAND rather than capturing
  the SQL jOOQ actually emits. That is deliberate — it isolates the guard from the
  surrounding CTE/join machinery so a Seq Scan cannot be attributed to an unrelated
  part of the query — but it means a divergence between this reconstruction and the
  rendered jOOQ SQL would go unnoticed. Pair it with a one-off capture of the real
  statement (jOOQ DEBUG logging, or `log_statement = 'all'`) on the first run and
  diff the tsquery expression.

  20000 rows is enough to make the planner prefer the GIN index but is not a
  production-scale catalog; the ABSOLUTE numbers are not a capacity statement, only
  the RELATIVE guarded-vs-unguarded comparison is load-bearing.

  Postgres may also choose a Seq Scan for the unguarded case purely because the
  predicate matches nearly every row rather than because the tsquery is
  un-indexable. If assertion H2 fails, re-run with a negated term that is present
  in only a handful of rows before concluding the comment is wrong.
