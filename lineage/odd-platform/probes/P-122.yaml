expected_outcome: |
  Stress question: under `auth.type=DISABLED`, `DisabledAuthSecurityConfiguration` wires NO
  `ServerSecurityContextRepository` (DisabledAuthSecurityConfiguration.java:11-19), so
  `ReactiveSecurityContextHolder.getContext()` emits empty inside
  `AuthIdentityProviderImpl.getCurrentUser` (line 25). The downstream chain
  `IdentityServiceImpl.whoami → authIdentityProvider.getCurrentUser().flatMap(...)` collapses
  to `Mono.empty()` (IdentityServiceImpl.java:30-33). `IdentityController.whoami`
  then fires `.switchIfEmpty(Mono.just(new ResponseEntity<>(dummyOwner(), HttpStatus.OK)))`
  (IdentityController.java:27) producing a fallback `AssociatedOwner` with
  `identity.username = "admin"` and `identity.permissions = Arrays.asList(Permission.values())`
  (IdentityController.java:30-33). The hypothesis: a totally unauthenticated network
  caller (no cookie, no token, no header) hitting `GET /api/identity/whoami` under
  default deployment receives a 200 OK body containing a hardcoded admin identity AND
  every Permission enum value the platform defines (70+ permissions). The UI consumes
  this exact response (App.tsx:48 dispatches fetchIdentity once-on-mount) to populate
  `WithPermissionsProvider` — every UI control gated by `Permission.X` therefore
  evaluates `isAllowedTo: true` for an anonymous caller. This is the IDENTITY-LAYER
  FACET of REFACTOR-185 (DISABLED bypasses authorization): the user-identity exposure
  surface explicitly REMOVES the only remaining guardrail (empty principal → empty
  response) by substituting an all-permissions admin identity. The probe asserts:
  (a) the response is 200; (b) `identity.username == "admin"`; (c)
  `identity.permissions.length` equals the Permission enum value-count
  (currently 70+, verified against components.yaml:158-235); (d) the permissions
  list contains every Permission enum string the OpenAPI spec defines. Secondary
  hypothesis: there is NO `Cache-Control: no-store` header on the response, so an
  intermediate cache (NGINX, browser, CDN) could serve a stale admin-identity body
  to a later authenticated caller hitting the same URL.
---
arrange:
  - kind: docker-compose-up
    config: |
      auth.type: DISABLED
      auth.ingestion.filter.enabled: false
      # default deployment posture per application.yml:32-48
  - kind: env
    POSTGRES_USERNAME: odd
    POSTGRES_PASSWORD: odd
    POSTGRES_DB: odd
act:
  - kind: rest
    method: GET
    path: /api/identity/whoami
    headers: {}  # no cookie, no bearer, no header — fully anonymous
    capture_as: anon_response
    capture_headers_as: anon_response_headers
  - kind: rest
    method: GET
    path: /api/identity/whoami
    headers:
      Cookie: "SESSION=invalid-session-id"  # invalid session — under DISABLED no validation
    capture_as: invalid_session_response
observe:
  - kind: read-file
    path: odd-platform-specification/components.yaml
    extract: |
      yq '.components.schemas.Permission.enum | length' components.yaml
    capture_as: permission_enum_count
assert:
  - "anon_response.status == 200"
  - "anon_response.body.identity.username == 'admin'"
  - "anon_response.body.identity.permissions.length == permission_enum_count"
  - "anon_response.body.identity.permissions contains 'POLICY_CREATE'"
  - "anon_response.body.identity.permissions contains 'ROLE_CREATE'"
  - "anon_response.body.identity.permissions contains 'OWNER_CREATE'"
  - "anon_response.body.identity.permissions contains 'DATA_SOURCE_TOKEN_REGENERATE'"
  - "anon_response.body.identity.permissions contains 'COLLECTOR_TOKEN_REGENERATE'"
  - "anon_response.body.identity.permissions contains 'DATA_ENTITY_STATUS_UPDATE'"
  - "anon_response.body.owner == null  # no Owner under empty SecurityContext (no USER_OWNER_MAPPING lookup ran)"
  - "anon_response.body.associationRequest == null"
  - "anon_response_headers['Cache-Control'] does NOT contain 'no-store'  # SECONDARY: response is cacheable"
  - "invalid_session_response.status == 200  # confirms 'invalid session' is indistinguishable from 'no session' under DISABLED"
  - "invalid_session_response.body.identity.username == 'admin'"
cleanup:
  - kind: docker-compose-down
    destroy_volumes: true
cross_references:
  related_sidecars:
    - odd-platform__java__IdentityController__controller-class__IdentityController
