behaviour: |-
  Empty-senders silent no-op with continued DB cost. When notifications.enabled=true but ZERO receivers are configured (no notifications.receivers.{slack.url | webhook.url | email.sender}), the @ConditionalOnProperty-gated sender beans never register; List<NotificationSender> is empty. The dispatcher still RUNS — calls messageTranslator.translate(message) on every WAL event (multi-statement jOOQ read incl. recursive CTE on LINEAGE) and then no-ops the empty fan-out loop. DB cost is paid for zero delivery, with no operator-visible warning at boot or per-message. Boot-time validation (e.g. `@Validated` on NotificationsProperties requiring at least one receiver) is absent.
test_class: missing-edge-case
test_files_existing: []
test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/processor/AlertNotificationEmptySendersTest.java"
  name: "emptyReceivers_translateRuns_dbReadCost_zeroDelivery_noBootWarning"
evidence:
  - |-
    NotificationsDispatcher.md says: 'When notifications.enabled=true but ZERO receivers are configured, List<NotificationSender> is empty. The dispatcher still RUNS — it calls messageTranslator.translate(message) on every WAL event (multi-statement jOOQ read incl. recursive CTE) and then no-ops the empty fan-out loop.'
  - "AlertNotificationMessageProcessor.java:23 (translate runs before sender-count check)"
  - "NotificationConfiguration.java:36 / 69 / 83 (each sender bean is @ConditionalOnProperty-gated, so absence = bean not registered = empty collection)"
cross_references:
  - "concepts.yaml:entities[NotificationSender] — sender bean conditional registration"
  - "TEST-GAP-455 (related: WAL replay loop — same dispatcher entry point)"
proposed_action: |-
  Spring slice test with notifications.enabled=true + zero receivers configured. Inject a Testcontainers-Postgres and INSERT one valid ALERT row. Spy AlertNotificationMessageTranslator. Assert (a) translate(...) is invoked exactly once (verify the wasted DB-read cost is real), (b) NO sender invocations, (c) NO log.warn or log.error at boot warning about misconfiguration. Pins the silent no-op; promotes to a fix-required regression when boot-time validation lands.
