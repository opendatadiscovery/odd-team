notes: |-
  NEW operation captured in batch 2026-05-25-ZD. This is the HTTP
  boundary for the SPA's principal-resolution flow; pairs with
  `operation:resolve-current-principal-and-associated-owner` which
  is the service-tier chokepoint with 15 callsites.

  Three load-bearing observability gaps surfaced by the batch-ZD
  sidecar:
    (1) No `Cache-Control: no-store` header — the identity-bearing
        response is the canonical case for explicit no-store; bare
        `ResponseEntity::ok` (line 26) emits none; under DISABLED
        no Spring Security header injection fires either.
    (2) No audit log on whoami invocation — `@Slf4j` is declared
        (line 19) but the body emits no log statements; combined
        with REFACTOR-185, an operator cannot detect anonymous
        reconnaissance against the identity surface from logs alone.
    (3) The `ServerWebExchange exchange` parameter is RECEIVED at
        line 24 but UNUSED — the entire per-exchange handle
        (headers, cookies, remote address) is right there in the
        method signature, free for the taking, but discarded. This
        is the available-but-unused mechanism for any future
        instrumentation (Cache-Control injection, audit logging,
        rate-limit annotation).

  DOC-NNN candidate: the live `authentication`,
  `disabled-authentication`, and `authorization` doc pages
  (WebFetched 2026-05-25, status 200) are silent on this
  endpoint's existence; the auth-flow walkthrough that operators
  need (mount-time whoami + permission gating) is undocumented.
