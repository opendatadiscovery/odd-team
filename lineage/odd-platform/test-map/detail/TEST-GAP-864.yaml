proposed_action: |-
  Add `TagRepositoryImplListMostPopularBoundaryTest extends BaseIntegrationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/`. Seven test methods covering each boundary:

  1. **`listMostPopular_sizeZero_returnsEmptyDataWithCorrectTotal_pinsCountWindowSemantic`**:
     - Arrange: seed 10 tags.
     - Act: `listMostPopular(null, List.of(), 1, 0)`.
     - Assert: data is empty, total = 10, hasNext = false. PIN: size=0 is the "I want only the total count" semantic.

  2. **`listMostPopular_sizeNegativeOne_throwsDataAccessExceptionWithSqlState22023_pinsPostgresRejection`**:
     - Act: `listMostPopular(null, List.of(), 1, -1)`.
     - Assert: `StepVerifier.expectError(DataAccessException.class)`. PIN: the SQL state 22023.

  3. **`listMostPopular_sizeLargerThanTotalTagCount_returnsAllInCountDescOrder_pinsLSN019DriftThreshold`**:
     - Arrange: 10 tags with usage counts [1, 5, 3, 4, 2, 8, 6, 9, 7, 10].
     - Act: `listMostPopular(null, List.of(), 1, 30)`.
     - Assert: data has 10 elements in count-DESC order. PIN: when size > total, the inner paginate selects all rows, and the outer count-DESC is effective. This is the LSN-019 threshold pin.

  4. **`listMostPopular_sizeOneHundredThousand_returnsAllTagsNoSizeCap_pinsDoSAmpSurface`**:
     - Arrange: 100 tags.
     - Act: measure latency of `listMostPopular(null, List.of(), 1, 100000)`.
     - Assert: completes successfully; data has 100 elements. PIN: the size parameter is unguarded. NOTE: do NOT assert latency (too flaky); the gap is structural.

  5. **`listMostPopular_pageZero_throwsDataAccessExceptionFromNegativeOffset_pinsPostgresRejection`**:
     - Act: `listMostPopular(null, List.of(), 0, 30)`.
     - Assert: `StepVerifier.expectError(DataAccessException.class)`. PIN: page=0 → SQL state 22023.

  6. **`listMostPopular_pageNegative_throwsDataAccessExceptionFromNegativeOffset_pinsPostgresRejection`**:
     - Sister test for page=-1.

  7. **`listMostPopular_sizeOne_returnsOldestTagSingleRow_pinsLowerBoundaryWithLSN019Behavior`**:
     - Arrange: 5 tags with distinct usage counts.
     - Act: `listMostPopular(null, List.of(), 1, 1)`.
     - Assert: data has 1 element, and that element is the OLDEST tag (by tag.id ASC) — NOT the most-popular. PIN: at size=1, the LSN-019 drift is the OLDEST-1 selection.

  Cross-pair with REFACTOR-NNN: when the maintainer adds `@Max(100)` and OpenAPI `maximum: 100`, tests #4 INVERTS (HTTP 400 instead of full response). Cross-pair with DOC-NNN to surface the size semantic.
