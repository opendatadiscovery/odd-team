batch_extensions:
- batch: P
  entry_point_added: |-
    controller-method:updateOwner (PUT /api/owners/{owner_id}) — the
    Owner directory's rename + role-rebind surface. This is the LOAD-BEARING
    CONTRAST to the batch-O F-011 drift facet
    `github_ghes_hard_coded_login_rename_orphan`: the OIDC_USERNAME side
    of the rename hazard surface ORPHANS USER_OWNER_MAPPING (REFACTOR-391
    — handler uses `oidc_username='login'` which is a free-rename string;
    no stable-id fallback). This batch-P entry-point closes the SAFE
    half of the hazard surface: PUT /api/owners/{owner_id} renames
    OWNER.NAME without orphaning USER_OWNER_MAPPING because the FK is
    by `owner.id` (the bigserial PK, stable across name changes), NOT
    by name. The two findings together describe the complete rename
    hazard surface: OIDC_USERNAME side is dangerous, OWNER.NAME side
    is safe.
  contributing_nodes_added:
  - odd-platform java OwnerController controller-method:updateOwner
  - odd-platform java OwnerServiceImpl
  notes: |-
    The load-bearing finding is the DISAMBIGUATION between the OIDC_USERNAME
    rename hazard (REFACTOR-391, batch O) and the OWNER.NAME rename
    safety (this batch). Five distinct concerns surface on the OWNER.NAME
    rename surface — the rename itself is SAFE for USER_OWNER_MAPPING
    but the five other concerns are real:
    (1) **USER_OWNER_MAPPING SURVIVES RENAME (SAFETY INVARIANT, NO
    SEVERITY)** — `user_owner_mapping.owner_id REFERENCES owner(id)`
    (V0_0_4__add_user_owner_mapping.sql:3) — the FK is by the bigserial
    PK, stable across name changes. PUT /api/owners/{owner_id} renames
    `owner.name` via `OwnerMapper.applyToPojo` + `ReactiveAbstractCRUDRepository.updateOne`;
    USER_OWNER_MAPPING rows continue to point at the same Owner
    identity. This is the LOAD-BEARING CONTRAST to REFACTOR-391's
    GitHub-login-rename orphan: OIDC_USERNAME rename ORPHANS the
    mapping (irreparable without stable-id fallback); OWNER.NAME
    rename PRESERVES the mapping. Surface for documentation: "Owner
    rename is safe for user-owner associations; OIDC username rename
    is hazardous — see REFACTOR-391".
    (2) **OWNER UPDATE EMITS NO ACTIVITY-FEED EVENT (MEDIUM)** —
    `OwnerServiceImpl.update` (lines 68-85) has NO `@ActivityLog`
    annotation. The activity feed does NOT record "owner X renamed
    from A to B by C at T" or "owner X had roles [A,B] before, now
    has [B,C]". The role-rebind is silently destructive of audit
    history. Mirrors batch-K + batch-P audit-silence pattern; this
    is the 6TH corroborating sidecar (Owner CREATE + Owner UPDATE +
    Owner DELETE + Policy CRUD + Role CRUD + Repository tiers all
    audit-silent) — refining the cross-batch concept catalog entry
    to "6-sidecar audit-silence pattern" for the Owner side of the
    RBAC mutation surface specifically.
    (3) **EMPTY `roles` FIELD SILENTLY DESTROYS ROLE BINDINGS (HIGH)** —
    `OwnerFormData.roles` is OpenAPI-optional (`components.yaml:419-422`,
    no `required` marker); `getRoleIdsList` (`OwnerServiceImpl.java:117-122`)
    collapses both null AND empty list to `List.of()`. The update
    transaction then calls `deleteOwnerRelationsExcept(ownerId, List.of()).then(
    createRelations(ownerId, List.of()))` — the first half DELETES
    all current role-links (since no existing link is in the empty
    set); the second half INSERTS nothing. **An operator updating
    ONLY the owner name (omitting `roles` to mean "don't touch")
    INSTEAD REMOVES ALL role assignments.** This is a silent,
    destructive UX hazard: the form's `roles` is treated as
    REPLACE-NULL-WITH-EMPTY, not as IGNORE-IF-OMITTED. The UI in
    practice always sends the current `roles` list, so the hazard
    is masked in normal UI flows — but any API consumer (script,
    integration) that omits `roles` will silently strip ALL roles
    from the Owner. Severity HIGH because it is destructive AND
    silent.
    (4) **RENAME COLLISION IS PROPAGATED AS USR003/HTTP 400, NOT
    409 Conflict (MEDIUM)** — the `owner_name_unique` partial unique
    index (V0_0_64__remove_is_deleted_field.sql:70) catches the
    second rename to the same active name; jOOQ raises `DataAccessException`
    → `ExceptionUtils.translateDatabaseException` →
    `UniqueConstraintException` → `ControllerAdvice.handleUniqueConstraint`
    → HTTP 400 with `ErrorCode.UNIQUE_CONSTRAINT` (per F-006 batch-K
    cross-batch-correction enumeration). The client receives 400,
    not the canonically-correct 409 Conflict. NO test verifies this
    code path; NO API doc indicates which code the client should
    expect on collision.
    (5) **OPENAPI DECLARES HTTP 201 FOR AN UPDATE — IMPLEMENTATION
    RETURNS 200 (MEDIUM)** — `openapi.yaml:196` declares `responses.'201':
    'The resource has been successfully updated'` for the `updateOwner`
    operationId. The controller returns `ResponseEntity.ok = 200`
    (`OwnerController.java:53`). Doubly anomalous: (a) declaring 201
    for a PUT-update is itself unusual (201 canonically signals
    POST-creation); (b) the implementation disagrees with the spec.
    Class-wide pattern: createOwner sibling has the IDENTICAL 201-vs-200
    drift. Not a per-method oversight.
    Additional finding (5th distinct concern, refined per LSN-018):
    OWNER_UPDATE permission scope is GLOBAL (`SecurityConstants.java:144-145`
    uses `NO_CONTEXT`) — a caller with OWNER_UPDATE can rename ANY
    Owner row, including unrelated owners they have no
    USER_OWNER_MAPPING-association with. There is NO per-Owner scoping
    at this gate; consistent with the read-collaborative posture
    documented elsewhere but undocumented for the WRITE side. The
    live permissions doc names `OWNER_UPDATE` as 'Allows editing an
    existing owner.' — silent on which owners.
- batch: O
  entry_point_added: |-
    oauth-handler-tier: 5 sidecars resolving the UPSTREAM-of-hop-1 OAuth
    handler layer that PRODUCES the OAuth2AuthenticationToken consumed
    by AuthIdentityProviderImpl.java:29-33. Two enrichment handlers
    (GoogleUserHandler, GithubUserHandler) — per-provider OIDC/OAuth2
    role-enrichment that decides ADMIN-or-USER + (where applicable)
    rejects logins not matching org/domain gates. Two logout handlers
    (AzureLogoutSuccessHandler, CognitoLogoutSuccessHandler) — provider-
    specific logout flow that may or may not revoke tokens at the IdP.
    The 5th handler is the filter-tier IngestionDataEntitiesFilter, which
    surfaces under F-008 (the Batch Ingestion pillar feature) and is
    counted there; only the OAuth-handler-tier four contribute to F-011.
  contributing_nodes_added:
  - odd-platform java auth handler:GoogleUserHandler
  - odd-platform java auth handler:GithubUserHandler
  - odd-platform java auth logout:AzureLogoutSuccessHandler
  - odd-platform java auth logout:CognitoLogoutSuccessHandler
  notes: |-
    Five new drift facets surface at the OAuth-handler tier (the UPSTREAM
    layer of the F-011 chain). Each facet is a provider-specific drift
    on the principal-resolution capability — the handlers PRODUCE the
    OAuth2AuthenticationToken that F-011's hop-2 (AuthIdentityProviderImpl)
    consumes. The Provider-Quirks-Strategy pattern (ADR-CANDIDATE-034)
    is the architectural shape that unifies them. The 5 facets are:
    (1) Google admin-groups silent no-op — GoogleUserHandler does NOT
    extend AbstractOIDCUserHandler and never reads
    `provider.getAdminGroups()` (verified Grep against the 74-line class
    body). Cognito + Azure + Custom + ODDIAM DO read it via the abstract
    base. An operator setting
    `auth.oauth2.client.google.admin-groups: [workspace-admins]` sees the
    field bind on the POJO (ODDOAuth2Properties.java:49) and silently
    ignored at every login — the user is unconditionally USER unless
    they match `adminPrincipals` (full-string equality). Live OAuth2/OIDC
    docs (WebFetched 2026-05-19, status 200) explicitly state
    `admin-groups` is documented "for AWS Cognito and GitHub only,
    not for Google" — but the POJO accepts the field. Silent-no-op
    config = operator hostility; the expected ADMIN-by-group never
    activates. Severity MEDIUM.
    (2) GitHub login-rename orphan + GHES hard-coded incompatibility —
    GithubUserHandler.java:36 + line 56 default `user-name-attribute:
    login` is the GitHub-mutable username string (free rename, 90-day
    escrow). A renamed user on next login presents (alice2, github)
    to AuthIdentityProviderImpl.java:29-30; the prior (alice, github)
    USER_OWNER_MAPPING row is orphaned. NO id-based fallback. Additionally:
    line 39 hard-codes `WebClient.create("https://api.github.com")` —
    GitHub Enterprise Server (GHES) deployments at
    `https://github.example.com/api/v3` are STRUCTURALLY incompatible
    (DNS/cert errors on every login). No `@Value`, no operator property,
    no comment defending the hard-code. Live docs silent on both. The
    rename-orphan generalises the F-011 compound-key-silent-in-docs
    finding to the GitHub-specific case; the GHES hard-code is a new
    operator-class lockout. Severity HIGH (rename-orphan) / MEDIUM (GHES).
    (3) Azure logout NPE — no token revocation, local-only — Azure
    handler does NOT extend the abstract base's logout pattern;
    AzureLogoutSuccessHandler.java:39 calls
    `URI.create(provider.getLogoutUri())` with NO null-guard. The
    validator at ODDOAuth2Properties.java:17-28 checks `clientId` +
    `provider` for non-empty but NOT `logoutUri`. An Azure operator
    omitting `logout-uri` boots successfully and hits NPE → 500 at
    first logout attempt. Live docs document this requirement
    operationally ("'logout-uri must be set for Azure SSO. ... unset
    raises NullPointerException and the logout flow returns a 500'")
    but the platform does NOT validate. Additionally: the handler
    invalidates ONLY the local Spring WebSession (line 47) — there
    is NO call to revoke the Azure access/refresh/id token at any
    Microsoft endpoint. Tokens remain valid at Azure until natural
    TTL (60-90 min access; up to 90 days refresh). Compare:
    GoogleLogoutSuccessHandler.java:43-54 POSTs to
    `oauth2.googleapis.com/revoke`; GithubLogoutSuccessHandler.java:51-63
    DELETEs `/applications/{client_id}/grant`. The NPE + no-revoke
    asymmetry surfaces as principal-resolution-mode-specific drift on
    F-011's logout half. Severity HIGH (NPE) / MEDIUM (no-revoke).
    (4) Cognito logout silent no-op on empty logout-uri —
    CognitoLogoutSuccessHandler.java:33-35 carries
    `if (StringUtils.isEmpty(provider.getLogoutUri())) return Mono.empty();`
    — the ONLY sibling handler with this graceful-degradation guard
    (Azure has none → NPE; ODDIAM uses `getIssuerUri()` differently;
    Google + GitHub do not use `logoutUri`). The asymmetric guard means
    Cognito deployments missing `logout-uri` see the logout button
    "work" (no error) but the user STAYS LOGGED IN — no redirect, no
    local session invalidation, no warning. Same LSN-001-pattern as
    the F-008 default-OFF facet: permissive default hides operator
    misconfiguration. Severity MEDIUM.
    (5) OAuth provider-quirks-strategy diverges from abstract base —
    Cognito, Azure, Custom, ODDIAM all extend `AbstractOIDCUserHandler`;
    Google + GitHub do NOT. The divergence reasons: Google has the hd
    domain-claim verification + provider-specific admin-attribute
    default (`email` not the username attribute) + userNameAttribute
    read from Spring's ClientRegistration instead of the ODD POJO;
    GitHub uses non-OIDC `OAuthUserHandler<OAuth2User, OAuth2UserRequest>`
    (no id_token) + outbound HTTP to /user/orgs + /user/teams (3
    total calls per login including Spring's pre-handler /user fetch)
    + admin-principals BYPASS the organization-name gate (lines 54-67
    fire BEFORE the org check at line 68). The pattern is the
    architectural ADR-CANDIDATE-034 (provider-quirks accumulate ≥2 →
    handler drops the abstract base; each handler is bespoke). The
    F-011 drift implication: provider-resolution behaviour is
    NON-UNIFORM across the 6 providers — a refactor that touches the
    abstract base does NOT touch Google or GitHub; a refactor that
    adds admin-groups support for Google requires ENTIRELY new code
    (no inheritance shortcut). Severity LOW (architecturally
    intentional; named for cross-batch coherence).
    All four handlers feed into AuthIdentityProviderImpl.java:29-33
    via OAuth2AuthenticationToken.authorizedClientRegistrationId
    (the REGISTRATION key like `google_corp`, NOT the literal
    `google`); the registrationId becomes the `provider` field on
    UserDto and partitions USER_OWNER_MAPPING lookups. This is the
    UPSTREAM-of-hop-1 evidence for F-011's existing
    compound_key_silent_in_docs facet.
- batch: N
  entry_point_added: |-
    repository-tier:ReactiveUserOwnerMappingRepositoryImpl (the persistence-layer
    bean owning every read and write to the `user_owner_mapping` table — the
    PRIMARY SOURCE for the provider-null cross-mode bleed at the SQL layer.
    The companion vertex to batch-K's AuthIdentityProviderImpl primary-source —
    the principal-layer producer of `(username, null)` for LOGIN_FORM/LDAP/S2S
    + the SQL-layer consumer that resolves them to a single OwnerPojo via the
    `WHERE OIDC_USERNAME=? AND DELETED_AT IS NULL AND PROVIDER IS NULL`
    pattern.)
  contributing_nodes_added:
  - odd-platform java repository reactive repository:ReactiveUserOwnerMappingRepositoryImpl
  notes: |-
    Six new drift facets surface from the SQL-layer side of the
    Principal-to-Owner Resolution chokepoint:
    (1) provider-null cross-mode bleed PRIMARY-SOURCE at SQL layer —
    `getConditions(oidcUsername, provider)` helper at lines 116-127 builds
    the WHERE clause `OIDC_USERNAME.eq(oidcUsername) AND DELETED_AT.isNull()
    AND (StringUtils.isNotEmpty(provider) ? PROVIDER.eq(provider) :
    PROVIDER.isNull())` — empty-string AND null both produce the IS-NULL
    predicate. This is the SQL-layer twin of AuthIdentityProviderImpl.java:32
    that produces UserDto(name, null) for LOGIN_FORM/LDAP/S2S. The
    architectural triangle is closed at three points: principal layer (Auth
    sidecar), SQL layer (this sidecar), schema (V0_0_55__add_policies_and_roles.sql:1-2
    `ADD COLUMN IF NOT EXISTS provider VARCHAR(255)` nullable).
    (2) cross-provider username row-duplication in external JOINs — four
    OTHER repositories (ReactiveAlertRepositoryImpl.java:83-86,
    ReactiveActivityRepositoryImpl.java:156-158,
    ReactiveOwnerAssociationRequestRepositoryImpl.java:80-84,
    ReactiveOwnerRepositoryImpl.java:77-78) LEFT JOIN `user_owner_mapping ON
    OIDC_USERNAME` only (no provider equality clause). If two ACTIVE rows
    exist for (alice, null) AND (alice, GITHUB), the LEFT JOIN matches BOTH
    rows and produces row duplication — alerts/activity feeds duplicate the
    same event, and Owner display becomes non-deterministic (Postgres
    physical row order). RARE in practice but ROW-DUPLICATION is more severe
    than incorrect display.
    (3) Positional INSERT schema-evolution fragility — line 45
    `.values(ownerId, oidcUsername, provider, DSL.val(null, DATE))` passes
    values positionally without column names. A future migration that
    REORDERS columns (jOOQ regen would silently keep working) would target
    wrong columns.
    (4) No @ReactiveTransactional on multi-statement createRelation — line 41-51
    issues TWO SQL statements (deleteActiveRelationByOwner UPDATE + INSERT)
    chained via `.then()`. The reactive `.then()` operator does NOT imply
    a single transaction; if the UPDATE succeeds and the INSERT fails (partial
    unique index violation against `user_owner_mapping_oidc_username_provider_deleted_key`),
    the UPDATE's soft-delete of the previous mapping is NOT rolled back —
    the user is left unmapped. Depends on whether the caller's service is
    @ReactiveTransactional (UserOwnerMappingServiceImpl is NOT;
    OwnerAssociationRequestServiceImpl IS).
    (5) Soft-delete-only table growth — every binding-change soft-deletes
    the prior row and inserts a new one; the table grows monotonically with
    NO operator-driven pruning (`DELETE FROM user_owner_mapping WHERE
    deleted_at < NOW() - INTERVAL '...'` lives nowhere in the codebase).
    Operationally a 1000-user platform churning mappings monthly accumulates
    ~12K rows annually — bounded by partial unique indexes but undocumented.
    (6) TYPE MISMATCH on `deleted_at` INSERT — line 45 declares
    `DSL.val(null, DATE)` but the schema column is `TIMESTAMP WITHOUT TIME
    ZONE`. Postgres tolerates the null cast; a future non-null literal in
    the same position would break. Code smell + latent migration-time bug.
    Hop-3 (ReactiveUserOwnerMappingRepositoryImpl) is now PRIMARY-SOURCE
    CONFIRMED at every method body. ZERO direct unit tests
    (`ReactiveOwnerAssociationRequestRepositoryImplTest.java:50` uses it as
    fixture setup only, not a test of this repository).
- batch: Q
  entry_point_added: |-
    UI-tier: react-component:AppToolbar (the SPA's persistent top-of-viewport
    fixed-position bar mounted unconditionally on every authenticated route at
    `App.tsx:56`). This is the CLIENT-SIDE RENDER of the principal-to-owner
    resolution result. `AppToolbar.tsx:74` reads `{owner?.name ??
    identity?.username}` — the user-identifier label that displays the resolved
    Owner name (preferred) or the auth-provider username (fallback). The same
    precedence convention is used in 5 OTHER components
    (ActivityItem.tsx:184/77, DataEntityAlertItem.tsx:60, AlertItem.tsx:86,
    ActiveAssociationRequest.tsx:65-67). The substitute target replaces a
    PHANTOM original target — there is NO `LoginForm` React component anywhere
    in `odd-platform-ui/src` (verified by Grep returning ZERO matches); LOGIN_FORM
    + LDAP login UI are rendered by Spring Security framework defaults at
    `LoginFormSecurityConfiguration.java:58` + `LDAPSecurityConfiguration.java:147`.
    Recording 'UI has NO local login form' as an invariant.
  contributing_nodes_added:
  - odd-platform ts react-component:AppToolbar
  notes: |-
    THREE findings surface from the UI tier of the principal-to-owner
    resolution capability, all of which STRENGTHEN existing F-011 facets +
    one POSITIVE NEGATIVE finding (the toolbar is NOT a leak surface).
    Listed by polarity:
    (1) POSITIVE NEGATIVE — UI IS NOT A LEAK SURFACE FOR PROVIDER-NULL
    CROSS-MODE BLEED (no severity; positive case-law) — The Identity wire
    schema at `components.yaml:131-139` has NO `provider` field on Identity
    (verified by direct read). The toolbar at AppToolbar.tsx:74 reads only
    `identity?.username`. So the SPA cannot render the active provider,
    cannot expose `(null)` for provider, and is NOT a leak surface for the
    provider-null cross-mode bleed F-011 catalogues. The cross-mode bleed
    risk is invisible at this UI tier — provider-rendering surfaces that DO
    exist (AssociatedUser at `components.yaml:370-376` — owner-association
    request flow) need separate scrutiny. Rules out provider-null leak at
    UI surface for the user-identifier label specifically. POSITIVE case-law
    contrast to the SQL layer (batch-N row duplication in external JOINs):
    the UI tier doesn't propagate provider null-ness because it doesn't
    consume provider at all.
    (2) UI HAS NO LOCAL LOGIN FORM (NEW INVARIANT) — Grep on `login|Login`
    across `odd-platform-ui/src` returns ZERO matches. The `auth.type=
    LOGIN_FORM` mode renders Spring Security's framework-default form
    (`LoginFormSecurityConfiguration.java:58` — `.formLogin(formLoginSpec
    -> formLoginSpec.authenticationSuccessHandler(authHandler))`); the
    `LDAP` mode uses `LDAPSecurityConfiguration.java:147` —
    `.formLogin(Customizer.withDefaults())`. The `OAUTH2` mode redirects
    to the provider's hosted login. The `DISABLED` mode skips login. **The
    SPA's primary auth-affordance surface is AppToolbar** — it shows the
    authenticated-user identifier + exposes the Logout affordance.
    AppToolbar is mounted unconditionally regardless of auth state (App.tsx
    has no auth predicate around the mount), which means under DISABLED
    the toolbar still renders. New invariant for the F-011 chain: there is
    NO SPA-side reauth dialog; `redux/lib/unauthenticatedMiddleware.ts:3-9`
    reloads the page on any 401 payload (the convention is 'hard-reload on
    auth failure').
    (3) MANAGEMENT TAB RENDERED TO ALL AUTHENTICATED USERS — UX VISIBILITY
    OF READ-COLLABORATIVE POSTURE (MEDIUM) — `ToolbarTabs.tsx:34-82`
    enumerates ALL nine top-level navigation tabs (Catalog / Directory /
    Data Quality / Data Modelling / Master Data / Management / Dictionary /
    Alerts / Activity) UNCONDITIONALLY — no `useAppSelector(getGlobalPermissions)`
    predicate. The downstream Management UI is permission-gated at the
    PAGE level (e.g. `WithPermissionsProvider` wraps `<LookupTables>` in
    App.tsx:78-87), but the TAB itself is visible to every authenticated
    user. Operators with zero `*_MANAGE` permissions still see the
    `Management` tab; clicking through yields a permission-denied page
    rather than a hidden-tab UX. STRENGTHENS the F-019 drift facet
    `per_owner_authorization_scoping_absent_global_owner_crud_permission`
    and the F-011-related read-collaborative posture (ADR-CANDIDATE-003 /
    REFACTOR-024 family). UI-side evidence that the posture is also
    UX-visible.
    (4) LOGOUT BUTTON IS FULL-PAGE NAVIGATION — IMPLICIT ADR (no severity;
    convention-of-platform) — `AppToolbar.tsx:35-37` issues
    `window.location.href = '/logout'` rather than a redux dispatch +
    state-cleanup sequence. The intent: defer ALL session-termination
    logic to the backend handler chain (OAuthSecurityConfiguration.java:100
    `logoutSuccessHandler(logoutHandler)` + 7 handler classes in
    `org.opendatadiscovery.oddplatform.auth.logout.*`). The SPA does not
    attempt to participate in revocation, it simply hands off. STRENGTHENS
    the batch-O F-011 drift facets `azure_logout_npe_no_token_revoke_local_only`
    + `cognito_logout_silent_no_op_on_empty_uri` — the SPA-side click
    handler is IDENTICAL across all 4 auth modes; the asymmetry is
    entirely backend-handler-controlled. The UI provides NO operator
    feedback that Azure logout doesn't revoke at the IdP — operators may
    believe they've fully logged out when they haven't, especially on
    shared workstations.
    Additionally: silent identity-fetch failure renders an EMPTY username
    label (App.tsx:48 swallows error via `.catch(() => {})` + AppToolbar.tsx:74
    falls through to empty string when both owner and identity are null);
    `identity.permissions` is imported but UNUSED on this surface — gated
    UI affordances would be the natural place to consume this and don't.
    Cross-batch coherence: STRENGTHENS the F-011 chain by closing the
    UI-tier rendering of the resolution result + records the POSITIVE
    negative finding (UI tier is NOT a leak surface for provider-null).
    No conflicts; no supersedes. The phantom-target substitution
    (LoginForm → AppToolbar) yields a new invariant ('UI has no local
