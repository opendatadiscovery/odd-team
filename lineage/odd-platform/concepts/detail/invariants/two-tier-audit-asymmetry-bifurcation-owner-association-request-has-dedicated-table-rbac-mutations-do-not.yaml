mitigations_unimplemented:
  - |-
    Operator documentation — disclose the THREE audit surfaces on the live
    docs: (a) /api/activity for data-entity-scoped events; (b)
    /api/owner_association_request/activity for user-owner-binding events;
    (c) NONE for RBAC mutations. Operators wanting compliance audit need
    to know BOTH where to look AND where the gaps are.
  - |-
    Code-level remediation — extend the owner_association_request_activity
    table (or build a sibling rbac_activity table) to cover policy / role /
    owner-directory mutations. The OwnerAssociationRequest pattern is the
    precedent. Pair with @ActivityLog (or a new annotation @RbacAuditLog)
    on the relevant service methods. Estimated effort: a 3-week ticket for
    a single engineer.
  - |-
    Unified audit-feed UI surface — the platform-wide Activity Feed UI page
    consumes /api/activity; build a sibling page consuming the user-owner
    + RBAC audit surfaces; OR build a unified endpoint /api/audit/full that
    surfaces all three tiers in a single feed (cursor-paginated; filterable
    by tier). Reduces operator surface area.
  - |-
    Schema-rooted remediation — extend activity table with NULLable
    data_entity_id + event_scope discriminator column. Allows the platform-wide
    activity-feed UI to surface ALL events including RBAC + user-owner
    mappings. The most invasive option but the most ergonomic for operators.
