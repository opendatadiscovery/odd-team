expected_outcome: |
  Stress question (Category B, name-behavior drift): the DataSourceItem card's
  "Delete" control promises to delete the data source. The backend
  deleteDataSource is a GUARDED soft-delete that returns HTTP 400
  (CascadeDeleteException, "Data source cannot be deleted: there are still data
  entities attached") whenever the source still has at least one non-soft-
  deleted data_entity child. This probe drives the actual UI to find out what
  the operator sees on that 400.

  Hypothesis (from the static read of DataSourceItem.tsx:58-74,
  ConfirmationDialog.tsx:25-35, handleResponseThunk.ts:34-42,
  errorHandling.tsx:48-68): clicking Delete then confirming on an
  actively-ingested data source produces (a) a generic red error toast
  carrying the raw backend message verbatim, and (b) a ConfirmationDialog that
  STAYS OPEN with its confirm button stuck in the loading state — because
  ConfirmationDialog.onClose does `.then(() => { setIsLoading(false);
  handleClose(); }).catch(() => {})`, so on rejection neither handleClose nor
  setIsLoading(false) ever runs. The happy-path control (delete of a source
  with no live children) is also exercised to confirm the dialog DOES close
  and a success toast appears.

  If the hypothesis holds, the DataSource UI surface ships an operator-hostile
  failure path for the single most likely delete attempt (deleting a source
  that is still being collected) — a HIGH-severity product defect feeding
  F-031.
