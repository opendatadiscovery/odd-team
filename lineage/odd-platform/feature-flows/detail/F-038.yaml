  - facet: under auth.type=DISABLED all four endpoints anonymously reachable
    observed: |-
      DisabledAuthSecurityConfiguration.java:13-17 sets
      `.anyExchange().permitAll()`; under DISABLED ALL FOUR endpoints
      reach the controller without auth. The feature flag
      `datacollaboration.enabled` is the SOLE defence in DISABLED
      mode — turning Discussions on in a DISABLED-mode deployment
