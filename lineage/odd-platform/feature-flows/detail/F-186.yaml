terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render with new node shape — DEG branch RE-LAYOUTS (cost O(N) +
    re-measure refs); Hierarchy branch only RE-RENDERS (no layout change).
  evidence: |-
    DEGLineageLayouter.tsx:47-55 layoutDEGLineage(...) call +
