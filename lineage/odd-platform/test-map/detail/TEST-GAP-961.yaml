  Add `EventApiControllerChallengeHandshakeTest`:

  1. `post_slackEvents_urlVerificationChallenge_returns200_withEchoedChallengeValue` — WebTestClient `.post().uri("/api/slack/events").bodyValue(challengeBody).exchange().expectStatus().isOk().expectBody().jsonPath("$.challenge").isEqualTo("<random-value>")`. Use a fresh random value each run to ensure no caching artefact.
  2. `post_slackEvents_urlVerificationChallenge_responseTimeUnder3Seconds_pinsSlackTimeoutContract` — measure elapsed; assert < 3000ms.
  3. `post_slackEvents_urlVerificationChallenge_responseContentTypeApplicationJson_pinsResponseShape` — assert `Content-Type: application/json` (Slack's docs require JSON response).
  4. Document each assertion with `// REGRESSION-PIN — Slack handshake contract. If this fails, the Discussions sub-feature is silently broken in production.`

