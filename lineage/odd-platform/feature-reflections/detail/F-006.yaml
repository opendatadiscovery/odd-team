- id: H-005
  hypothesis: |
    When an operator deletes an Owner, that owner's previously-attached roles no
    longer confer their permissions to anyone — the deletion fully revokes the
    owner's access.
  derivation: |
    Endpoint-shape — DELETE /api/owners/{id}; pillar-mission "create owners and
    attach roles" implies the inverse (delete owner = remove the role attachment).
    The negative-space concern is the orphan-binding family pattern (does deletion
    leave a granting binding?).
  seed_source: endpoint-shape + negative-space + pillar-mission
  validation:
    verdict: confirmed
    actual_behavior: |
      Owner deletion HARD-DELETES the owner_to_role rows via
      ownerToRoleRepository.deleteOwnerRelationsExcept(id, List.of())
      (OwnerServiceImpl.java:97 -> ReactiveOwnerToRoleRepositoryImpl.java:52-56
      DSL.delete) — a physical DELETE, not a soft-delete. The F-006 family pattern
      permission_persistence_after_soft_delete is closed CORRECTLY on the OWNER
      side: a deleted Owner does NOT continue to confer their previously-attached
      roles' permissions because the binding row is physically removed. This is the
      POSITIVE case-law contrast to the POLICY/ROLE half (where soft-delete leaves
      orphan grants). The Owner ROW itself is soft-deleted (name freed for reuse via
      the partial unique index) but the role BINDINGS are hard-gone.
    evidence:
