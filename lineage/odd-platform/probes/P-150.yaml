assert:
  # Q-NULL (NULLS FIRST on DESC, Postgres default): the RUNNING run with NULL end_time appears first
  - "r1_names[0] == 'run_A_running' # Postgres DESC default is NULLS FIRST — confirms RUNNING tops the list"
  - "r1_statuses[0] == 'RUNNING' # CAVEAT: this MAY 500 due to MapStruct enum unmarshal — see P-151"
  - "r1_end_times[0] == null"
  # The two SUCCESS rows with identical end_time follow somewhere — order between them is implementation-defined
  - "r1_names[1] == 'run_D_recent' # D has the most-recent NON-NULL end_time (30 min ago)"
  - "set(r1_names[2], r1_names[3]) == {'run_B_tie', 'run_C_tie'} # B and C share end_time; order between them is non-deterministic"
  - "r1_names[4] == 'run_E_oldest' # E has the oldest end_time"
  # Q-TIE on pagination: when ties split across pages, the assignment is non-deterministic;
  - "len(set(r2_names + r3_names)) == 4 # combining page 1 (size 2) + page 2 (size 2) should yield 4 DISTINCT items"
  - "if (len(set(r2_names + r3_names)) < 4) then FAIL 'tie-breaker non-determinism produces duplicates across pages — the InfiniteScroll consumer accumulates a corrupted list'"
  # Status filter removes RUNNING + FAILED
  - "'run_A_running' not in r4_names"
  - "'run_D_recent' not in r4_names"
  - "set(r4_names) == {'run_B_tie', 'run_C_tie', 'run_E_oldest'}"
