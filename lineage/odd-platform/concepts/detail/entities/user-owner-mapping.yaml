security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Single mechanism: ReactiveSecurityContextHolder.getContext() →
      Authentication.getName() + provider → SELECT user_owner_mapping
      WHERE oidc_username=? AND deleted_at IS NULL AND (provider=? OR
      provider IS NULL) → Owner. STRENGTHENED batch K: the runtime
      resolver is now primary-source pinned at
      AuthIdentityProviderImpl.java:23-53; the case-sensitive .eq()
      lookup at ReactiveUserOwnerMappingRepositoryImpl.java:116-127 is
      the load-bearing SQL.
  owner_scoping:
    verdict: RESPECTS
    detail: Owner-id is the principal-derived parameter passed into the OWNERSHIP
      JOIN at the SQL layer
  strengths:
  - Composite-key (oidc_username, provider) correctly isolates owner identity across
    OAuth2 providers
  - 'Single Mono lookup per request — architectural posture: one user, one Owner identity'
  - clear-active-then-insert pattern ensures only ONE active mapping per (user, provider)
  - |-
    **STRENGTHENED batch K**: the runtime resolver is a single chokepoint
    at AuthIdentityProviderImpl — 15 callsites all funnel through three
    Monos (getCurrentUser / getCurrentUserProviderRole /
    fetchAssociatedOwner)
  weaknesses:
  - |-
    **LOGIN_FORM and LDAP both produce provider=null → cross-mode user-identity
    bleed during auth.type migrations (HIGH severity — RAISED from previous
    LOW-MEDIUM, batch K primary-source confirmation)**. Two HIGH-severity
    scenarios:
      (a) Migration LOGIN_FORM → LDAP retaining usernames silently inherits
          old user-owner mappings without invalidation
      (b) Concurrent LOGIN_FORM + LDAP deployments with overlapping
          usernames silently collide
    No mode-check, no warning log, no fail-fast.
    (AuthIdentityProviderImpl.md:bugs_limitations_corner_cases.[0])
  - |-
    **S2S 'ADMIN' literal collision with operator-named users (NEW HIGH
    severity, batch K)** — S2sAuthenticationFilter.java:31 hardcodes
    username="ADMIN" (uppercase) → provider=null. If an operator created
    a LOGIN_FORM/LDAP user 'ADMIN' (case-sensitive exact match), the S2S
    caller resolves to THAT user's Owner. Case-sensitivity mitigates but
    does not eliminate.
    (AuthIdentityProviderImpl.md:bugs_limitations_corner_cases.[1])
  - DISABLED mode = no SecurityContext = empty Flux degradation indistinguishable
    from owning-nothing
  - No fail-fast for unlinked user — 200 OK with [] body is the only signal (silent
    UX trap)
  - Per-request principal lookup (no session cache) — multiplicative on /my call rate
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - Per-request DB round-trip for principal lookup — short-lived session cache would
    eliminate this for high-RPS callers
  - |-
    **STRENGTHENED batch K**: the per-request DB round-trip is multiplicative
    across 15 callsites; a single page-load (catalog home rendering
    Recommended + My Objects + My Alerts) triggers 3-5 sequential
    identical queries.
    (AuthIdentityProviderImpl.md:performance.hot_paths.[0])
notes: |-
  STRENGTHENED batch 2026-05-19K. The runtime resolver
  AuthIdentityProviderImpl is now primary-source pinned at the SERVICE
  layer; the persistence-layer USER_OWNER_MAPPING row is the gate, and
  this concept captures both the row and the runtime contract.

  New invariants surfaced in batch K (each promoted to its own
  invariant concept):
    - LOGIN_FORM/LDAP provider=null cross-mode bleed (NEW HIGH)
    - S2S 'ADMIN' username literal collision (NEW HIGH)
    - AuthIdentityProvider (per-request principal resolution chokepoint)
      [new entity concept]
    - Resolve Current Principal and Associated Owner [new operation]

  Three DOC-NNN candidates flow from the new findings:
    (a) Document the (username, provider) compound key shape on
        user-owner-association doc page
    (b) Document the auth-mode migration playbook on the authentication
        doc page (audit user_owner_mapping for overlapping usernames
        before migrating)
    (c) Document the S2S username='ADMIN' literal on the S2S auth doc
        page until the code-fix lands
