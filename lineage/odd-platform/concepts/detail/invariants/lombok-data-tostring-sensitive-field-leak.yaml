notes: "Promoted to a NEW cross-cutting invariant in batch 2026-05-12D after\nthe\
  \ third + fourth primary-source sidecars confirmed the pattern.\nThe earlier batch-C\
  \ actuator-env claim was too broad; the actual\ndurable leak surface is Lombok-toString.\
  \ Recommended cleanup (single\nchange touching 4+ files):\n  - Add `@ToString.Exclude`\
  \ annotations to `password` (ODDLDAPProperties,\n    EmailSenderProperties) and\
  \ `clientSecret` (ODDOAuth2Properties.\n    OAuth2Provider).\n  - OR introduce a\
  \ `Credential` sealed type / record that overrides\n    `toString` to emit `Credential[****]`.\n\
  Either approach makes the masking discipline opt-out (the default is\nsafe), rather\
  \ than the current opt-in via `@ToString.Exclude`.\n"
