observed_vs_expected:
  facets:
  - facet_id: relationship_id_translates_silently_to_data_entity_id
    drift_class: drift_input_name_vs_implementation_path_param_target_column_mismatch
    severity: HIGH
    observed: "OpenAPI relationship_id + Java relationshipId PROMISE the relationships\ntable primary key; SQL at ReactiveRelationshipsRepositoryImpl.java:194\nfilters by relationshipsDataEntity.field(DATA_ENTITY.ID).eq(relationshipId)\n\
      \u2014 the data_entity.id column. List endpoint mapper returns\nid = data_entity.id (RelationshipMapper.java:53); UI round-trip works.\nThird-party API consumer reading the spec literally + supplying\
      \ actual\nrelationships.id gets 404 OR a payload for an UNRELATED relationship."
  - facet_id: no_authorization_gate_at_any_layer_full_catalog_visibility
    drift_class: read_collaborative_posture_undocumented_cross_pillar
    severity: HIGH
    observed: 'No @PreAuthorize; no SECURITY_RULES entry for /api/relationships/**

      (verified by reading full 357-line SecurityConstants); no service

      check; no OWNERSHIP JOIN; no data_source_id filter; no namespace_id

      filter; no EXCLUDE_FROM_SEARCH = false filter; no HOLLOW = false

      filter. Every authenticated caller sees every relationship in the

      catalog including hidden + cross-tenant. Asymmetric to /api/dataentities

      (which DOES apply EXCLUDE_FROM_SEARCH per batch-T REFACTOR-425).'
  - facet_id: page_zero_boundary_500_not_graceful_first_page
    drift_class: arithmetic_pagination_no_min_page_validation
    severity: MEDIUM
    observed: '(page - 1) * size at ReactiveDataEntityRelationshipRepositoryImpl.java:79

      produces negative offset for page=0; Postgres rejects with

      `OFFSET must not be negative`. OpenAPI PageParam lacks minimum:1;

      Spring binding accepts page=0. A JavaScript-style 0-indexed caller

      hits opaque 500 instead of first page.'
  - facet_id: no_unique_constraint_on_data_entity_id_admits_multi_row_undefined_mono
    drift_class: schema_admits_multi_row_match_application_expects_single
    severity: MEDIUM
    observed: 'V0_0_87__create_relation_tables.sql:1-10 declares data_entity_id bigint

      with only FK, no UNIQUE. ReactiveRelationshipsRepositoryImpl.java:197

      uses mono() expecting one row; on multi-match behaviour is

      JOOQ-driver-specific. No current collector produces multi-row but

      schema admits it.'
  - facet_id: search_query_filters_relationship_name_not_source_target_entity_names
    drift_class: feature_gap_search_scope_under_documents
    severity: LOW
    observed: 'query param filters by DATA_ENTITY.EXTERNAL_NAME.containsIgnoreCase

      against the relationship-class data_entity (entity_class_ids=[9]), NOT

      source/target entity names. Operator typing ''orders'' to find every

      relationship involving the ORDERS table is silently violated.'
