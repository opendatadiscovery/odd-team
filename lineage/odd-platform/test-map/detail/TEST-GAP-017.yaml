proposed_action: |-
  Add `@WebFluxTest`-driven test asserting `403 Forbidden` for an authenticated caller without DATA_ENTITY_ADD_TERM hitting POST /api/dataentities/{id}/terms — currently passes anonymously due to path mismatch. Add a paired service-tier integration test driving TermServiceImpl.linkTermWithDataEntity directly to LOCK the absence of service-tier permission check; the fix (controller-tier path correction OR service-tier defence-in-depth) must update BOTH tests. Pair-test with TEST-GAP-489 (the DELETE-half controller-method-scoped entry); the REFACTOR-217 fix must validate end-to-end.
