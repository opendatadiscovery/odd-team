behaviour: |-
  PolicyPojo deserialization from `jsonArrayAgg(POLICY.asterisk().toString())` relies on the Postgres → JSON → Jackson roundtrip preserving field names. Any divergence between PolicyPojo field names and the POLICY table columns (e.g. a Flyway-renamed column without corresponding jOOQ-regeneration) silently corrupts the deserialised result. There is no schema-version check at boot. Same shape as batch-H Policy mirror.
