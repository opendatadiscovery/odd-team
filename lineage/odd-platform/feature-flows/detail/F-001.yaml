      dep re-fired the effect; 6 calls/mount; +2/open). Batch-Q + batch-U
      negative-findings stand: DataEntityDetails was the SOLE platform-wide
      instance of the response-derived-dep-array bug — now zero remain.
    expected: |-
      +1 per page-open (matches intent). The pre-fix facet's expected
      ("fix is 1 line — remove `details.status?.status` at line 63;
      xhr_count 2→1, delta +2→+1") shipped verbatim as #1764.
    drift_class: null
    provenance: |-
      STATIC + MEASURED — re-verified primary source at
