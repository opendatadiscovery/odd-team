behaviour: |-
  **CASE-SENSITIVITY PIN on oidc_username AND provider.** Set up (alice, GITHUB, X). Assert getAssociatedOwner('Alice', 'GITHUB') → empty; getAssociatedOwner('alice', 'github') → empty. The `.eq()` is case-sensitive. This pin matters for the S2S literal-collision invariant: S2sAuthenticationFilter hardcodes username='ADMIN' (uppercase, case-sensitive) — a case-sensitive lookup means 'admin' / 'Admin' lowercase variants do NOT collide, but 'ADMIN' exact-uppercase collisions WILL match an operator-named LOGIN_FORM/LDAP user 'ADMIN'. A regression flipping to .equalIgnoreCase() would also collide on 'admin' / 'Admin' — quietly broadening the S2S literal-collision surface.
