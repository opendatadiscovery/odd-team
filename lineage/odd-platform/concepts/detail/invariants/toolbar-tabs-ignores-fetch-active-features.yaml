notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "ToolbarTabs" + "feature" + "Active" — found
  `invariant:management-tab-visible-to-all-authenticated-users-
  unpermissioned-tab-visibility` (the permission-side sibling;
  same root cause — hardcoded array with no redux state
  consumption). No existing concept covers the feature-flag-side
  variant specifically.

  This invariant compounds with the permission-side sibling: the
  9-tab array is BOTH permission-unaware AND feature-flag-unaware.
  A maintainer triaging the management-tab-visibility issue should
  treat both invariants as ONE fix-shape — extend the `tabs` array
  entries to carry permission + featureName predicates uniformly.
