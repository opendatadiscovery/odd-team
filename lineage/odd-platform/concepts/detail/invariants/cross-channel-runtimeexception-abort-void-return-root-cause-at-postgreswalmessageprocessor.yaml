mitigations_unimplemented:
  - |-
    Widen the seam's return type from void to a typed ProcessResult enum
    (ALL_DELIVERED / PARTIAL_DELIVERED_RETRYABLE / POISON_SKIP /
    TRANSIENT_RETRYABLE) — the subscriber consumes the result to decide
    LSN-advance vs replay vs skip. Closes Gap 3 (per-channel partial
    failure) AND enables operator-facing remediation for Gaps 1 and 2.
  - |-
    Widen the seam's throws clause to declare RuntimeException-derived
    types the implementor actually surfaces (IllegalArgumentException,
    IllegalStateException) so a maintainer reading the interface knows
    the wider exception surface. Closes the documentation-leak half of
    Gap 1.
  - |-
    Add a per-message correlation-id to the seam signature — e.g.
    process(DecodedWALMessage message, ProcessContext context) where
    ProcessContext carries LSN + arrival-time + a correlation-uuid that
    the implementor can use for audit emission. Closes the audit-silence-
    on-notification-delivery half of F-006.
  - |-
    Broaden the dispatcher's per-sender catch from
    catch (NotificationSenderException e) to catch (Exception e) as
    an INTERIM fix — closes the email-bypass leak (Gap 1 symptom)
    without changing the seam. Leaves Gap 2 (translate-failure poison
    loop) and Gap 3 (partial-failure no signal) open but addresses the
    most operator-visible symptom.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20Y from the
  PostgresWALMessageProcessor sidecar's primary-source evidence at the
  7-line SPI interface. ROOT-CAUSES the existing batch-K
  exception-type-asymmetry-notification-senders invariant by identifying
  the architectural pattern — void return + narrow throws clause +
  hard-coded input type — that structurally precludes the dispatcher
  from signalling per-message status, per-channel partial failure, or
  poison-skip guidance to the subscriber.

  This is the F-009 LSN-class architectural finding — the 5-LAYER closure
  of F-009 surfaces three SYMPTOM invariants (exception asymmetry,
  poison-replay, retry-after-ignored) AND one ROOT-CAUSE invariant (the
  seam shape). The 5-layer picture is now:
    Layer 1 (config-layer batch C — NotificationsProperties): subsystem
      gate + WAL coordinates
    Layer 2 (subscriber-layer batch Y — NotificationSubscriber):
      WAL polling + LSN-advance-after-process + poison-replay outer loop
    Layer 3 (seam-layer batch Y — PostgresWALMessageProcessor — THIS
      INVARIANT): void return + narrow throws — the architectural root
      cause of multiple symptom findings
    Layer 4 (dispatcher-layer batch K — AlertNotificationMessageProcessor):
      translate-uncaught + per-sender catch + sequential fan-out
    Layer 5 (sender-layer batch Y — Slack/Webhook/Email NotificationSender
      impls): per-channel quirks (mrkdwn-injection, no-HMAC, RuntimeException
      bypass, fail-stop email recipients)

  Cross-cutting connections:
    - ROOT-CAUSES the batch-K exception-type-asymmetry symptom invariant
    - ROOT-CAUSES the batch-K poison-message-wal-replay-loop invariant's
      no-retry / no-DLQ shape
    - Cross-link to F-006 audit-silence at the type-layer (the seam's
      lack of a correlation-id is a sixth layer of audit silence)
    - Cross-cutting case-law for "narrow SPI seam designed for one
      caller-impl pair + the silent-narrowing of the impl's actual
      exception surface" — a class of architectural decisions that look
      fine at design time and fail at extension time

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the seam's void-return contract on the live
        notifications page — operators reading the page should know
        the F-009 architecture's expressivity limit
    (b) Cross-link from the F-009 feature-flow to this invariant as the
        ROOT_CAUSE node — the symptom invariants reference it as their
        cause
