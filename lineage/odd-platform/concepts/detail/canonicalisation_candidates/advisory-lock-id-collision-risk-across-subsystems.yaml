proposed_canonical: Advisory-lock-ID collision risk across subsystems
rationale: 'Now 3-sidecar triangulated cross-cutting concurrency-correctness invariant
  from batch 2026-05-12D. Four subsystems use Postgres advisory locks as single-leader
  election primitive — `partition.advisory-lock-id` (90 default, batch B), `notifications.wal.advisory-lock-id`
  (100 default, batch C), `datacollaboration.receive-event-advisory-lock-id` (110
  default, batch D), `datacollaboration.sender-message-advisory-lock-id` (120 default,
  batch D). All four are operator-tunable but UNVALIDATED — no startup assertion that
  the IDs stay disjoint. Operator override could silently collide subsystems. Failure
  mode operator-discoverable only after manifestation. Recommended cleanup: introduce
  `AdvisoryLockId` enum + `@PostConstruct` registry validator; central registry in
  docs.'
contributing_concepts:
- partition.advisory-lock-id=90 (ActivityTablePartitionManager batch B)
- notifications.wal.advisory-lock-id=100 (NotificationsProperties batch C)
- datacollaboration.receive-event-advisory-lock-id=110 (DataCollaborationProperties
  batch D)
- datacollaboration.sender-message-advisory-lock-id=120 (DataCollaborationProperties
  batch D)
suggested_add_to_docs: false
