# Global Alerts list page — product-owner reflection

## product_owner_narrative

The global **Alerts** page (mounted at `/alerts/*`, per `Alerts.md`:understanding + App.tsx:64) is ODD's
platform-wide alert inbox — the operator-visible read surface for the alert lifecycle that the AlertManager
webhook (F-007) and the ingestion pipeline (DQ-test failures, failed jobs, schema breaks) feed into. A
steward or data owner opens it to answer "what is currently broken across the data platform, and which of
it is mine to fix?". It is the symmetric Active-Platform read surface to the global Activity feed (F-021),
and it shares its per-row `AlertItem` component with the per-entity Alerts tab (F-014, per `Alerts.md`:dependencies_semantic).

A user interacts with the page through **three tabs** — All / My Objects / Dependents — backed by three
REST endpoints (`GET /api/alerts`, `/api/alerts/my`, `/api/alerts/my/dependents`) and a badge-counter call
(`GET /api/alerts/totals`) fired once on mount (per `Alerts.md`:downstream_side_effects + AlertServiceImpl.md
operations). Each tab renders a paginated list of alert cards — each card carries the alert's type, status,
last-reason, the data-entity it was raised on (a click-through link), a collapsible alert-chunk history, and
a Resolve / Reopen button. The list pages in fixed chunks of 30 via infinite-scroll; there is no filter UI
(no status, type, date, or entity-name search), no bulk-resolve, and no export (per `AlertsList` evidence in
the feature-flow + `Alerts.md`:bugs_limitations_corner_cases). The live alerting doc now documents this
explicitly: "hardcoded page size of 30, no filter UI, no status selector" (WebFetch 2026-06-03, status 200).

The working parts the product owner would demo: the **All tab** lists every OPEN alert across the whole
platform regardless of who owns the entity — the read-collaborative posture (REFACTOR-024) made operator-visible;
the **My Objects tab** filters to alerts on entities the signed-in user is a registered owner of (via an
`OWNERSHIP` join, per `ReactiveAlertRepositoryImpl.md`:owner_scoping); the **Dependents tab** walks a recursive
`LINEAGE` CTE from the user's owned entities to surface alerts on downstream dependents. The My/Dependents tabs
are hidden entirely when the signed-in user has no Owner association (`getOwnership` selector falsy → tab
`hidden`, per `Alerts.md`:implicit_adrs) — and the live doc now documents this requirement verbatim
("hidden unless the signed-in user is linked to an Owner"). A bare `/alerts` URL auto-redirects to `/alerts/all`
(AlertsRoutes.tsx:18, per `Alerts.md`:downstream_side_effects).

The integration story: F-126 is the read counterpart to F-007's webhook ingress — alerts forged via the
unauthenticated AlertManager webhook surface here on the All tab to every authenticated user (per the F-126
feature-flow cross_pillar_relationships P-01/P-07). It shares its actor-attribution model with the Activity
feed: the `status_updated_by` username (the human who triaged the alert) is resolved from `USER_OWNER_MAPPING`
with `DELETED_AT IS NULL` and rendered verbatim on each card (`AlertItem.tsx:86`, per `Alerts.md`:security.data_exposure).
The page sits behind no UI route-guard (unlike the LookupTables route which wraps `WithPermissionsProvider`),
and the backing list endpoints carry no `@PreAuthorize` — access falls through to the catch-all
`.authenticated()` (per `getAllAlerts.md`:implicit_adrs + AlertServiceImpl.md).

Edge cases a product owner would highlight in a demo: a **RESOLVED alert vanishes from every global tab the
moment it is resolved** (the data still exists on a single entity's Alerts tab, which has no status filter) —
the doc now warns of this; an operator with **30K open alerts** must scroll through ~1000 infinite-scroll pages
because there is no server-side filter; an operator who **resolves an alert watches the tab badge stay stale**
until a full page reload (totals fetched once on mount, never invalidated, per `Alerts.md`:bugs_limitations_corner_cases);
and an operator viewing **My Objects with zero owned-entity alerts** sees an empty list whose pagination total
silently reports the platform-wide open count, not zero (`ReactiveAlertRepositoryImpl.java:177`, per
`ReactiveAlertRepositoryImpl.md`:bugs_limitations_corner_cases).

