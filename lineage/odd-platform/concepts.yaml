      - "NotificationsProperties.md:bugs_limitations_corner_cases.[2] (advisory-lock-id collision risk)"
      - "DataCollaborationProperties.md:bugs_limitations_corner_cases.[2] (cross-subsystem lock-id collisions undetected)"
      - "DataCollaborationProperties.md:security.known_security_gaps.[1] (no validation against lock-id collisions)"
    notes: |
      Promoted to a NEW cross-cutting invariant in batch 2026-05-12D after
      the third primary-source sidecar (DataCollaborationProperties)
      surfaced this as a per-feature weakness. Now 3-sidecar triangulated
