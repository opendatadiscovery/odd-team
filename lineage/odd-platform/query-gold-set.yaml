# =============================================================================
# query-gold-set.yaml — the maiden-acceptance gold set for the graph query layer
# =============================================================================
#
# Per adrs/drafts/research/graph-query-layer/PROBES.md. This file is the
# retrieval-quality gate: ~60 MAINTAINER-AUTHORED queries with hand-labelled
# answer sets. The graph+vector layer replaces the grep/Python query path only
# once it beats (or matches) the baseline on every query class AND clears the
# absolute floors — see the maiden acceptance gate.
#
# AUTHORING RULES (PROBES.md §"The query gold set"):
#   1. MAINTAINER-AUTHORED. The query layer's implementer must not author the
#      scored set — that is reverse-fitting. The single `status: example` entry
#      below is a format demo only; the harness SKIPS it. Delete it or leave it.
#   2. ~60 queries, ≥50 (Stanford IR-book minimum), spread across the 6 classes.
#   3. Each `answer_set` is hand-labelled and pinned to a commit SHA.
#   4. Grow it by one query per LSN blind-spot incident — permanent regression.
#
# SIX QUERY CLASSES and the metric each is scored by:
#   feature-locate   -> MRR        (one canonical home; first hit is the answer)
#   depends-on       -> recall@20  (a missed dependent is a silent gap)
#   concept-discuss  -> recall@20  (completeness over a cross-axis join)
#   dedup-nearest    -> MRR        (succeeds registry-search's core job)
#   impact-of-change -> nDCG@10    (graded — direct callers outrank 3-hop)
#   cross-axis-join  -> recall@20  (deterministic; answer set is exhaustive)
#
# ABSOLUTE FLOORS the candidate must clear (PROBES thresholds table):
#   feature-locate / dedup-nearest : MRR      >= 0.75
#   depends-on / concept-discuss   : recall@20 >= 0.90
#   impact-of-change               : nDCG@10  >= 0.80
#   cross-axis-join                : exact-set match = 100%
#
# Run the harness:  lineage-extractor query-probe odd-platform
# =============================================================================

meta:
  status: TEMPLATE                       # flip to `authored` once the real set is in
  pinned_commit: null                    # the substrate commit the answer sets are labelled against
  authored_by: null
  authored_at: null
  query_count_target: 60

queries:
  # --- format demo — `status: example` entries are SKIPPED by the harness -----
  - id: GQ-000
    status: example
    question: "What depends on AlertController?"
    intent: depends-on
    metric: recall@20
    answer_set:
      - node: "odd-platform java AlertController controller-method:changeAlertStatus"
        grade: 3                          # 3 = primary, 1 = peripheral (graded classes only)
      - node: "odd-platform java AlertController controller-method:getAllAlerts"
        grade: 3
    notes: >
      Format demonstration only. A real entry omits `status: example`, pins
      `meta.pinned_commit`, and is authored by the maintainer before scoring.

  # --- maintainer: author ~60 real entries below, across the 6 classes --------
