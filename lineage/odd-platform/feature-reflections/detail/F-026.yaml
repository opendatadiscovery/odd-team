- id: H-005
  hypothesis: "When an operator edits an existing lookup table (changes its name or description), the namespace field — shown disabled in the form — is not transmitted and cannot be changed."
  derivation: "The form disables the namespace field on edit (disabled={!!lookupTable}) and the live doc says LOOKUP_TABLE_UPDATE covers only 'renaming or editing its description', implying namespace is fixed; a disabled field promises 'not transmitted'."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      The namespace is correctly NOT changeable server-side (the UPDATE contract LookupTableUpdateFormData,
      components.yaml:3853-3862, defines only name + description, and there is no updateNamespace path). BUT the
      form sends namespace_name on the wire on every edit anyway: LookupTableForm.tsx:49 types the form data as
      LookupTableFormData (the CREATE shape with required namespaceName), and the edit-submit branch
      (lines 60-66) posts that same shape to editLookupTable({ lookupTableUpdateFormData: data, lookupTableId }).
      The generated client serialises namespace_name into the JSON body. The server is assumed to silently discard
      the unknown field (Spring/Jackson FAIL_ON_UNKNOWN_PROPERTIES=false) — but whether it discards (no-op) or
      strict-rejects (400 on every edit) is not verifiable from the chain (see H-006). The UX promise (disabled =
      not editable) holds for the OUTCOME; the wire reality (field transmitted) contradicts the "not transmitted"
      reading.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: bugs_limitations_corner_cases[2] + docs_link_semantic.doc_drift_findings[0] + stress_findings.request_inputs[1]
        cite: "LookupTableForm.tsx:49,60-66,117-123 + components.yaml:3853-3862"
        note: "DRIFT_INPUT_NAME_VS_IMPLEMENTATION; namespace_name on wire though UPDATE schema rejects it. P-191."
    operator_visible_failure: |
      An operator inspecting the network tab on an edit sees namespace_name on the wire, contradicting the
      disabled-field UX cue and the doc's implication that namespace is not part of an update. If the server
      silently discards (the assumed behaviour), the consequence is cosmetic — confusing for an integrator reading
      the wire, but the namespace stays put. If the server strict-rejects, EVERY edit fails with a 400 (a HIGH
      functional break). The verdict is partial because the user-facing outcome is correct only under the
      discard assumption; H-006 carries the probe that decides which.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

