  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/handler/GithubUserHandlerTeamsPaginationTest.java"
  name: "enrichUser_userIn31Teams_adminTeamOnPage2_silentlyDemotedToUser_pinsPaginationLimitation"
evidence:
  - "GithubUserHandler.md says (bugs_limitations_corner_cases.[3]): '/user/teams pagination is silently truncated to the first page (default 30 items). Lines 104-113 fetch /user/teams with no ?page=N, no Link header handling, no recursion over pages. A user in 31+ teams may have their ADMIN team beyond the first page, silently demoting them to USER.' severity: LOW"
  - "GithubUserHandler.java:104-113 (no pagination handling)"
cross_references:
