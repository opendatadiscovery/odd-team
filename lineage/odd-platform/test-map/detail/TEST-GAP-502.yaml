proposed_action: |-
  Testcontainers integration test. (a) Create data entity X. (b) Pre-seed 2 alerts on X. (c) Soft-delete X (set STATUS=DELETED — the soft-delete state). (d) GET /api/dataentities/X/alerts?page=1&size=10. (e) Assert HTTP 200 with the 2 alerts in the response. (f) Confirm X does NOT appear in `getMyObjects` or general catalog list endpoints (validate the soft-delete is real and the asymmetry is real). (g) Test comment 'LOCKS the soft-delete-inclusive alert-read posture as of 2026-05-19 (intent_anchor: existsIncludingSoftDeleted). The behaviour underpins the audit-export workaround per the live alerting doc. A regression that tightened to exists() would FAIL this test.'
