  notes: |-
    NET-NEW feature anchored at the IntegrationController class-level
    walk. Twelve substantive drift facets cluster around four themes:
    DEAD-FIELD CONTRACT (`installed: false` hardcoded constant; the
    UI 'Integrated' badge at IntegrationPreviewItem.tsx:44-51 NEVER
    renders despite the OpenAPI declaring `installed: boolean` REQUIRED),
    UNGATED SURFACE (no RBAC permission for /api/integrations*;
    DISABLED-mode anonymous reachability; platform_url leak under
    internal-hostname deployments), RESPONSE-CODE DRIFT (silent 204
    on missing id rather than 404; no `switchIfEmpty(NotFoundException)`),
