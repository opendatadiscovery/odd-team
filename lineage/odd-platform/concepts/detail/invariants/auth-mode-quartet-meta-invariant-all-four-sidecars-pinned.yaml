- P-09
description: |-
  NEW META-INVARIANT, batch 2026-05-20X — captures the QUARTET-COMPLETION
  signal: with the LoginFormSecurityConfiguration config-class sidecar landing
  in batch X, all four `auth.type` mode SecurityConfiguration siblings have
  primary-source config-class layer evidence in the concept catalog. The
  quartet is the platform's central UI authentication branching point; the
  meta-invariant captures BOTH the structural consistency (CSRF disabled in
  all four; S2S compositional in three of four) AND the surface asymmetries
  (AuthorizationCustomizer wired in two, absent in two; hard-coded ADMIN
  granted to all users in one; mutex by `auth.type` value across all four).

  **THE FOUR PRIMARY SOURCES**:
    - DisabledAuthSecurityConfiguration@L10 (config-key-consumer, batch C):
      `.anyExchange().permitAll()`; the 19-line shortest sibling; NO CSRF, NO
      CORS, NO AuthorizationCustomizer, NO S2sAuthenticationFilter wiring (S2S
      silently ignored even when `auth.s2s.enabled=true`); NO `@Slf4j` boot WARN
    - LoginFormSecurityConfiguration config-class (batch X — NEW THIS BATCH):
      `.pathMatchers(permittedPaths).permitAll().pathMatchers("/**").authenticated()`;
      every user gets `getAuthorities(true)` ADMIN via GrantedAuthorityExtractor;
      NO AuthorizationCustomizer (the F-008 read-collaborative-posture wide-open
      LOGIN_FORM variant — CONFIRMS REFACTOR-073); CSRF disabled; S2S
      additively composable at HTTP_BASIC order
    - OAuthSecurityConfiguration@L71 (config-key-consumer, batch C): WIRES
      AuthorizationCustomizer(permissionService, extractors) at line 98;
      multi-client login chooser at GET /login is public; S2S composes
      additively (not mutex); CSRF disabled; Provider enum carries only 5
      of 7 doc-named providers (Okta + Keycloak unmapped)
    - LDAPSecurityConfiguration@L51 (config-key-consumer, batch C): WIRES
      AuthorizationCustomizer at line 145; SecurityWebFilterChain runs at
      Ordered.HIGHEST_PRECEDENCE; admin-group match is FULL-string-equality
      via OperationUtils.containsIgnoreCase (CORRECTED batch O — NOT
      substring); CSRF disabled; S2S additively composable

  **THE STRUCTURAL CONSISTENCY ACROSS ALL FOUR**:
    1. CSRF unconditionally disabled
       DisabledAuthSecurityConfiguration.java:15 + LoginFormSecurityConfiguration.java:54
       + OAuthSecurityConfiguration.java:96 + LDAPSecurityConfiguration.java:143
       — the same `.csrf(ServerHttpSecurity.CsrfSpec::disable)` call appears
       across all four files
    2. `@ConditionalOnProperty(value = "auth.type", havingValue = "...")` is
       the gating mechanism — exactly ONE of the four matches per boot;
       case-sensitive `.havingValue` ensures mutex
    3. `S2sAuthenticationFilter` registered AT `SecurityWebFiltersOrder.HTTP_BASIC`
       when `auth.s2s.enabled=true` (three of four — DISABLED skips S2S
       wiring entirely as a deliberate decision)
    4. permitAll for `/ingestion/entities`, `/ingestion/datasources`,
       `/api/slack/events`, `/actuator/health`, `/favicon.ico` — the bypass
       paths are consistent (though LOGIN_FORM uses a hand-rolled local
       list at lines 49-51 instead of SecurityConstants.WHITELIST_PATHS;
       the LDAP/OAuth chains reference the central WHITELIST_PATHS via
       AuthorizationCustomizer)

  **THE SURFACE ASYMMETRIES**:
    1. AuthorizationCustomizer wiring:
       - WIRED: OAUTH2 + LDAP (`new AuthorizationCustomizer(permissionService,
         extractors)`)
       - ABSENT: DISABLED + LOGIN_FORM
       This is the LOAD-BEARING asymmetry. The Policies/Permissions/Roles/Owners
       framework is INERT under two of the four modes. Confirmed by the
       login-form-admin-for-every-user-rbac-inert invariant (this batch X)
       AND the refactor-185-disabled-mode-bypass invariant (batch T 19-sidecar).
    2. ADMIN authority assignment:
       - HARD-CODED ADMIN for every user: LOGIN_FORM (`getAuthorities(true)`
         at line 81)
       - Per-user-via-OAuth-claim: OAUTH2 (GrantedAuthorityExtractor reads
         the provider-specific admin attribute / admin-groups)
       - Per-user-via-LDAP-group: LDAP (containsIgnoreCase against the
         admin groups Set)
       - No SecurityContext authority assignment: DISABLED
       Only LOGIN_FORM hard-codes ADMIN; the asymmetry is intentional per
       the `true` literal at line 81 and the live doc 'All users authenticated
       through this method receive ADMIN privileges'
    3. provider field on UserDto:
       - OAuth2: non-null registrationId
       - LOGIN_FORM, LDAP, S2S: null
       The null-provider compound — provider-null cross-mode bleed
       (batch K/N/R, strengthened to 4-vertex sidecar) — is the persistent
       security implication
    4. S2S filter wiring:
       - DISABLED: silently ignored (the S2sAuthenticationFilter is NOT
         registered into the chain even when `auth.s2s.enabled=true`)
       - LOGIN_FORM + OAUTH2 + LDAP: additively composable at HTTP_BASIC
       The DISABLED-mode S2S-silently-ignored is itself a finding
       captured in the existing DisabledAuthSecurityConfiguration sidecar

  **WHY THIS META-INVARIANT MATTERS**:
    The concept catalog now has primary-source evidence at the config-class
    layer for ALL FOUR auth modes, plus the config-key-consumer layer
    sidecars from earlier batches. A maintainer audit of the auth-mode
    surface is no longer dependent on reading the code — every claim about
    the per-mode behaviour is cited to specific lines across the four
    config-class sidecars. The quartet is the platform's most thoroughly-
    enumerated security pattern (alongside REFACTOR-185 at 24-sidecar after
    this batch).

  **THIS META-INVARIANT FEEDS** the broader Auth Mode entity (one of the
  highest-axes-present concepts in the catalog — `controllers + openapi_tags
  + ui_routes + ui_shell + config_prefixes + filters + config_classes`).
  After this batch, the Auth Mode entity adds the `config_classes` axis with
  the LoginFormSecurityConfiguration config-class node — the final piece of
  the quartet-completion picture.

  **SEVERITY**: META — informational meta-invariant; the security severity
  flows through to the per-mode invariants (LOGIN_FORM-ADMIN-for-every-user;
  REFACTOR-185 DISABLED-mode bypass; provider-null cross-mode bleed; etc.)
