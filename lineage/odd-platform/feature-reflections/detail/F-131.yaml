- id: H-012
  hypothesis: "When an author edits a snippet and saves, the dialog closes automatically on success (the author is not left to dismiss a dialog that has already saved)."
  derivation: "DialogWrapper receives handleCloseSubmittedForm={queryExampleDetails ? isUpdated : isCreated} (QueryExampleForm.tsx:137)."
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |
      The dialog is wired with `handleCloseSubmittedForm={queryExampleDetails ? isUpdated : isCreated}`
      (QueryExampleForm.tsx:137) — when the relevant mutation reports success (`isUpdated` for edit,
      `isCreated` for create), DialogWrapper closes the submitted form. In parallel `onSubmit`'s
      `.then()` calls `reset()` and navigates to the details page (QueryExampleForm.tsx:63-66). So
      on success the dialog closes AND the user is routed to the fresh details view. The auto-close
      promise holds.
    evidence:
      - sidecar: "(source_read_for_validation) QueryExampleForm.tsx"
        section: DialogWrapper props + onSubmit
        cite: "QueryExampleForm.tsx:137,63-66"
        note: "handleCloseSubmittedForm bound to isUpdated/isCreated; onSubmit resets + navigates on success"
    confidence: HIGH
