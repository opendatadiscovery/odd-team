- id: H-003
  hypothesis: |
    When a data entity has <= 20 tags, opening the Overview tab shows ALL its tags in
    importance-then-alphabetical order (the comparator's promise holds when nothing is truncated).
  derivation: |
    Endpoint/render shape: with no overflow, slice(0,20) is a no-op on a <=20 array, so
    sort(tagsCompare) orders the full list — the comparator's promise should hold in this regime.
  seed_source: response-shape
  sme_consultation_recommended: false
  validation:
    verdict: confirmed
    actual_behavior: |
      For a tags array of length L <= 20, `tags.slice(0, 20)` returns a shallow copy of the full
      array (slice past the end is clamped), and `.sort(tagsCompare)` then orders ALL L elements
      important-first then by localeCompare on name. The comparator's promise is fully honoured in
      the no-truncation regime. The overflow branch (tags.length > visibleLimit) is not entered, so
      the View-All defect (H-002) does not apply. This is the happy path the panel was designed for
      and is correct.
    evidence:
      - sidecar: "(source read)"
        section: render
        cite: "OverviewTags.tsx:52-65"
        note: "tags?.length ? slice(0,20).sort(tagsCompare).map — for L<=20 the slice is a full copy; comparator orders the whole list"
      - sidecar: "(source read)"
        section: comparator
        cite: "OverviewTags.tsx:26-32"
        note: "important===important → localeCompare(name); else important ? -1 : 1 — correct two-key sort"
    severity: LOW
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |
    When a data entity carries more than 20 linked Dictionary terms, the Overview Terms panel
    presents the visible 20 in a meaningful order (alphabetical by term name, mirroring the Tags
    panel's at-a-glance ordering intent the user has learned elsewhere on the platform).
  derivation: |
    UI-label + cross-platform-consistency: the Terms panel sits beside the Tags panel and has the
    identical slice/sort/View-All shape, so a user reasonably expects the same ordering discipline.
  seed_source: ui-label
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |
      The render expression is `terms.slice(0, visibleLimit).sort().map(...)` (OverviewTerms.tsx:48-51)
      — a BARE `.sort()` with NO comparator on an array of `LinkedTerm` objects. Per ECMAScript,
      Array.prototype.sort with no comparator converts each element to a string via String()/toString();
      a `LinkedTerm` plain object has no toString override, so every element stringifies to
      "[object Object]" and all compare equal. Under V8's stable TimSort the result is the pre-slice
      array position. NET: the panel shows terms in raw server insertion order, NOT alphabetical, and
      the `.sort()` call does nothing. The slice-then-sort flaw is moot here because the sort is itself
      a no-op — both the truncation AND the ordering fail.
    evidence:
      - sidecar: "(source read)"
        section: render
        cite: "OverviewTerms.tsx:48-51"
        note: "terms.slice(0, visibleLimit).sort().map(...) — bare no-arg sort on LinkedTerm[]"
      - sidecar: F-179.yaml
        section: chain.hop-1b.evidence
        cite: "F-179.yaml:105-111"
        note: "feature-flow: bare no-comparator sort on LinkedTerm objects → no effective ordering"
    operator_visible_failure: |
      The visible 20 terms are whatever order the backend returned (insertion order). For an entity
      with >20 linked terms, the visible window is an arbitrary slice with no ordering guarantee; a
      term the operator expects near the top (alphabetically) may be in the hidden overflow. The doc
      (entity-detail-page, fetched this run) now explicitly warns "do not rely on it being
      alphabetical" — confirming the contradiction is real, but the user-facing surface still presents
      a sorted-looking list that is not sorted.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

