pillars_affected: [P-01]
surfaced_by:
  - "upsertDataEntityMetadataFieldValue.md:bugs_limitations_corner_cases.[2] (No type validation against metadata_field.type)"
  - "upsertDataEntityMetadataFieldValue.md:concepts.invariants.[3] (No type validation)"
