control_summary: |-
  0 of 4 cells fully COVERED (unit + integration are PARTIAL with
  happy-path coverage only; performance + security are GAP). Feature
  MINTED this batch (Z) from the IngestionController.ingestMetrics
  controller-method sidecar + CounterTimeSeriesExtractor config-key
  consumer sidecar (extractor-tier evidence). 13 substantive drift
  facets cluster around three load-bearing themes: (1) AUTH GAPS —
  unauthenticated in every supported posture (HIGH) + live docs imply
  OAUTH2 protects but path is whitelisted (HIGH) + no audit log at any
  tier (MEDIUM); (2) TENANCY GAPS — tenant_id mechanism applies to
  PROMETHEUS only, not the default INTERNAL_POSTGRES (HIGH) + no
  payload-side ODDRN existence validation (MEDIUM) + PII labels
  propagated verbatim (MEDIUM); (3) CONTRACT GAPS — empty-payload
  silent 201 (LOW, asymmetric with postDataEntityList) + PROMETHEUS
  write outside transaction (MEDIUM) + invalid storage value boots
  silently (LOW) + storage migration one-way (MEDIUM) + body-size 500
  not 413 (LOW) + docs silent on endpoint (MEDIUM) + concept catalog
  path drift (LOW — supersedes the wrong path in metrics-ingestion
  concept entry).

  This pillar-anchor adds the FIFTH P-07 Active Platform Features
  sub-feature alongside F-007 (AlertManager Integration), F-009
  (WAL-driven Notification Delivery), F-014 (Per-Entity Alert View),
  F-021 (Activity Feed). Metrics Ingestion is the per-DataEntity
  data path BEHIND the Metrics tab on entity-detail pages; the live
  active-platform-features page (WebFetched 2026-05-20) does NOT
  list it as a sub-feature, despite the tab being a real UI surface
  — pillar-doc + spec gap closed by minting this feature.

  HIGHEST-LEVERAGE probe candidates: (a) unauthenticated-reach
  probe (POST /ingestion/metrics under every auth mode + every
  filter toggle; assert 201 in all cases — documents the gap +
  protects against a future hardening accidentally reverting);
  (b) cross-tenant ODDRN-write probe (push metrics for ODDRN owned
  by another team; assert no isolation on INTERNAL_POSTGRES — pins
  the documented gap); (c) PII-label propagation probe (push
  user_email=... label; assert verbatim storage). Local docker-compose
  probe stack: ODD platform + Postgres + prom/prometheus:v2.42.0
  testcontainer with --web.enable-remote-write-receiver.

  Cross-references: F-008 (Batch Ingestion) — sibling ingestion
  endpoint with the SAME unauthenticated default + the SAME audit-
  silence pattern + a DIFFERENT empty-payload contract (asymmetric);
  F-029 (Platform Public API Contract) — the platform-api spec
  catalogued in this batch declares no securitySchemes for the
  /api/** namespace, and the SIBLING ingestion-api spec for the
  /ingestion/metrics endpoint has the same gap. LSN-001 pattern
  (permissive-default-hides-operator-error) extends to the
  unauthenticated-by-default metrics ingestion endpoint.
