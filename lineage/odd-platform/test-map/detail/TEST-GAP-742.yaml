proposed_action: |-
  Add `QueryExampleCascadeIncompletenessTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `deleteQueryExample_leavesSearchEntrypointRow_pinsFTSLeak` — create a query example; delete it; query `SELECT COUNT(*) FROM query_example_search_entrypoint WHERE query_example_id = ?`; assert returns 1 (the dangling row). PIN the storage leak.
  2. `parentDataEntitySoftDelete_leavesOrphanLinkRowInDataEntityToQueryExample` — create a query example linked to DataEntity 100; soft-delete DataEntity 100; query `SELECT COUNT(*) FROM data_entity_to_query_example WHERE query_example_id = ?`; assert returns 1; assert `getQueryExampleDatasetRelations` surfaces the orphan reference in the response.
  3. `deleteQueryExample_hardDeletesLinkRowsButSoftDeletesEntity_pinsAsymmetry` — assert post-delete: (a) `data_entity_to_query_example` rows for the example are GONE (hard delete); (b) `query_example_to_term` rows for the example are GONE; (c) `query_example` row IS still present with `deleted_at` populated and `is_deleted = TRUE` (soft delete).
  4. `deleteQueryExample_underAuthDisabled_anonymousUserCanDelete` — pin the DISABLED-mode behaviour.

  Add a `// REGRESSION-PIN — deleteQueryExample has three cascade-incompleteness classes: search-entrypoint leak, hard/soft asymmetry, orphan link rows on parent soft-delete. A REFACTOR adding entrypoint cleanup will break test #1; a REFACTOR adding soft-delete filter on the JOIN will break test #2.` comment block.

  Pair with REFACTOR-NNN closing the entrypoint leak; pair with the SISTER fix from TEST-GAP-727 (Term FTS leak) — both follow the same architectural pattern.
