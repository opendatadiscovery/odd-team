discovered_from_entry_point: rest:POST/GET/PUT/DELETE /api/dataentities/{data_entity_id}/{attachments|files|links}* (10-endpoint controller-class surface)
description: |-
  Attachment Lifecycle is the operator-facing capability that lets users
  attach files (PDFs, CSVs, screenshots) and links (runbook URLs, ticket
  references) to any data entity to carry additional context. The
  feature exposes 10 endpoints on DataEntityAttachmentController across
  three resource groups:
  - Attachments aggregate (GET list, GET upload-options) — 2 endpoints
  - Files (POST initiate / POST chunk / POST complete / GET download /
    DELETE) — 5 endpoints
  - Links (POST save-bulk / PUT update / DELETE) — 3 endpoints

  The feature is the LSN-001 CANONICAL SURFACE — the attachment-storage
  default that silently wiped production data on container restart. The
  remediation work landed: the live operator-facing page now carries
  both the LOCAL-ephemeral warning + the Kubernetes-specific operator
  guidance + the spring.codec.max-in-memory-size transport ceiling +
  the us-east-1 region pin (LSN-002 sibling). The doc-side rule (Gate 3
  caveats captured as admonitions) is healthy.

  The user-observable reality, per batch-V primary-source audit of the
  DataEntityAttachmentController class sidecar, surfaces THIRTEEN
  load-bearing drift facets. The HIGH-severity findings: (a) the
  LSN-001 partial-remediation gap — chunk staging at /tmp/odd/chunks
  is HARD-CODED regardless of `attachment.storage` mode (FileUtils.java:24);
  even with REMOTE persistence configured, in-flight uploads still
  depend on /tmp for the chunk window — partial-upload data loss for
  the chunk window on container restart; (b) READ endpoints
  (`getAttachments`, `getUploadOptions`, `downloadFile`) have NO
  SecurityRule entry — any authenticated user can list AND download
  files attached to ANY data entity; (c) mutation endpoints discard
  the URL's `dataEntityId` and operate on `fileId` / `linkId` alone —
  cross-entity privilege escalation (REFACTOR-024 class); (d)
  filenames are propagated raw into storage path + Content-Disposition
  header — path-traversal write/read + CRLF header injection on
  download.

  The 3-step chunked upload (initiate → upload-part(s) → complete) with
  a server-issued `uploadId` UUID is the deliberate architectural
  shape; clients cannot inject their own upload identifier. Storage
  strategy (LOCAL vs REMOTE) is selected via @ConditionalOnProperty on
  bean wiring — LOCAL is the default-on stance via `matchIfMissing=true`
  (the LSN-001 root). Duplicate fileName-per-dataentity is rejected at
  initiate time, not at complete time — the platform treats
  (dataEntityId, fileName) as a logical primary key for visible files.
