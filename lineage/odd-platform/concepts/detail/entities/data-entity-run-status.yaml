name: DataEntityRunStatus (six-value run-outcome enum)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The shared run-outcome enum SUCCESS | FAILED | SKIPPED | BROKEN | ABORTED |
  UNKNOWN that classifies every data-quality test run AND every general
  task-run in ODD. Defined at `components.yaml:1407-1415` as the wire-side
  authoritative shape; code-generated into TypeScript and Java. NEW entity,
  batch ZC (2026-05-22).

  The enum is load-bearing across THREE UI surfaces and TWO backend
  consumers — yet the live documentation is silent on the full six-value
  set (the dashboard.md doc describes only 'passed / failed / skipped',
  three values; the docs do not name BROKEN, ABORTED, or UNKNOWN at all).
  This is the second-largest doc-gap on the /data-quality surface
  (after access-control silence).

  Where the enum appears verbatim:
    - frontend status colour map: `theme.palette.runStatus[$status]`
      (palette.ts:122-129); a `Record<DataEntityRunStatus, ItemColors>`
      keyed by all six values (interfaces.ts:55). A status outside the
      six values causes a TypeError at DataQualityContent.tsx:48 that
      blanks the dashboard — see the
      `run-status-palette-type-error-on-out-of-enum-status-blanks-dashboard`
      invariant.
    - `TestCategoryResults.tsx:21` — enum-iteration drives the fixed
      tile order (`Object.values(DataEntityRunStatus)`) per category row;
      see `enum-driven-tile-position-stabilises-categorical-ui-comparison`
      invariant.
    - `DataQualityContent.tsx:43-51, 83` — the breakdown ring slices and
      the dashboard legend both iterate the enum.
    - backend `DataEntityRunStatusEnum` Java type (code-generated) — the
      SQL aggregations group by it (ReactiveDataQualityRunsRepositoryImpl
      `getLatestDataQualityRunsResults`); `DataQualityCategoryMapperImpl
      .addMissingStatuses` (lines 45-60) injects a zero-count row for
      every absent enum value, guaranteeing each category's `results[]`
      carries all six.

  vocabulary_status: codebase-anchored, doc-side-gap. The live
  https://docs.opendatadiscovery.org/features/data-quality/dashboard
  (WebFetched 2026-05-22 status 200) describes the breakdown ring as
  'broken down by status (passed / failed / skipped)' — a three-value
  subset that omits BROKEN, ABORTED, UNKNOWN. The
  https://docs.opendatadiscovery.org/introduction/main-concepts page
  does not enumerate the run-status enum at all.
vocabulary_status: codebase-anchored, doc-side-gap
