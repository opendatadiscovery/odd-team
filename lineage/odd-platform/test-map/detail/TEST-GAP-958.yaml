behaviour: |-
  **CRITICAL — class-level 4-of-5 unauthenticated-in-all-modes matrix: NO test exists that runs IngestionController under multiple `auth.type` modes to demonstrate the 5-endpoint × 2-filter × 4-auth-mode reachability matrix.**

  The current test profile fixes `auth.type=DISABLED` + `auth.ingestion.filter.enabled=false` (BaseIngestionTest.java) — meaning EVERY existing ingestion test runs against the most-open posture. The production-recommended postures (OAUTH2/LDAP/LOGIN_FORM × filter-enabled true × s2s-enabled true) are completely untested at this controller's class surface.

  **The matrix the test absence preserves**:
  - 5 endpoints (`postDataEntityList`, `createDataSource`, `getDataEntitiesByDEGOddrn`, `postDataSetStatsList`, `ingestMetrics`)
  - × 4 auth modes (DISABLED, OAUTH2, LDAP, LOGIN_FORM)
  - × 2 filter toggle values (`auth.ingestion.filter.enabled` true/false)
  - × 2 s2s toggle values (`auth.s2s.enabled` true/false)
  = 80-cell reachability matrix, ZERO cells covered.

  **What the matrix would reveal**:
  - 4 of 5 endpoints reachable unauthenticated under default deployment (only `createDataSource` requires a collector token).
  - 3 of 5 endpoints (`postDataSetStatsList`, `ingestMetrics`, `getDataEntitiesByDEGOddrn`) REMAIN unauthenticated even with operator opt-in (`auth.ingestion.filter.enabled=true`), because `IngestionDataEntitiesFilter.java:28` hard-codes `POST /ingestion/entities` as exact-literal — does NOT match the other 3 paths.
  - `SecurityConstants.WHITELIST_PATHS = {.., "/ingestion/**", ..}` (SecurityConstants.java:95-96) exempts the entire ingestion namespace from UI auth.
  - Under the most-hardened deployment (OAUTH2 + s2s.enabled=true + filter.enabled=true), still 3 of 5 endpoints unauthenticated.

  **Operator-misleading consequence**: the property name `auth.ingestion.filter.enabled` reads as 'protect ingestion globally'. The truth is 'protect one endpoint exactly'. Without a class-level test matrix pinning the gap, operators believing they've hardened the surface are wrong. The live docs at `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security` flag the gap; the bundled defaults + the test suite both reinforce silence.

  **Distinguishes from existing IDs**:
  - TEST-GAP-815 (CRITICAL) — covers `getDataEntitiesByDEGOddrn` only, single-endpoint unauth reach.
  - TEST-GAP-823 (CRITICAL) — covers `ingestMetrics` only.
  - TEST-GAP-819 — covers `postDataSetStatsList` only.
  - TEST-GAP-618 — covers `createDataSource` vs `postDataEntityList` asymmetric posture (2 endpoints).
  - TEST-GAP-116 — covers default-off `auth.ingestion.filter.enabled` semantics on the filter alone.
  - TEST-GAP-579 — covers IngestionDataEntitiesFilter class default-OFF posture.

  This entry is the **CLASS-LEVEL META-ANCHOR**: instead of 5 single-endpoint reachability tests, a single parameterised test (5 endpoints × 4 modes × 2 toggles × 2 toggles = 80 cells) holds the matrix as the regression contract. A future refactor that widens the filter path-matcher OR removes `/ingestion/**` from WHITELIST_PATHS surfaces as a green/red mass-flip across this one file rather than five.
