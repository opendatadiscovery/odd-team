proposed_action: |-
  Add `GetDataEntitiesByDEGOddrn404VsEmptyContractAsymmetryRegressionPinTest`. Testcontainers integration test:

  1. **Setup**: seed one DEG with 3 members (DEG-A), one DEG with zero members (DEG-B), zero DEG for ODDRN "literally-nonexistent" (DEG-C unknown).
  2. **Assertions**:
     - `GET /ingestion/entities/{DEG-A.oddrn}` → 200 + items.length == 3.
     - `GET /ingestion/entities/{DEG-B.oddrn}` → 200 + items.length == 0 (pins empty-DEG contract).
     - `GET /ingestion/entities/{DEG-C.oddrn}` → 200 + items.length == 0 (pins unknown-DEG contract).
     - `GET /ingestion/entities/` (empty path segment) → routing-level 404 or 405 (whichever; pins URL shape).
     - `GET /ingestion/entities/garbage-string-not-an-oddrn` → 200 + items.length == 0 (pins no-validation).
     - `GET /ingestion/entities/%20%20` (URL-encoded blanks) → 200 + items.length == 0.
  3. **Sibling contract pin**: `GET /api/dataentitygroups/{DEG-B.id}/lineage` → 404 (pins the F-016 contract that DOES raise 404 on the same empty-membership condition).

  Pair with DOC-GAP-NNN (live S2S page describes the four-way conflation + the F-016 asymmetry).

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP pins the 404-vs-empty contract on this endpoint. Sister to TEST-GAP-815/816 (security half) and TEST-GAP-818 (soft-delete half) — together they form a 4-entry cluster pinning the full uncovered_behaviours surface for getDataEntitiesByDEGOddrn. STRENGTHENS F-016 detail YAML by establishing the contract-asymmetry as a load-bearing comparison.
