notes: |-
  Two-line fix: `palette.runStatus[status]?.color ?? palette.dataQualityDashboard.unknown`
  at DataQualityContent.tsx:48. The change is mechanical, no semantic shift.
  The HARDER fix (and the right one) is to wrap every render path in a
  React `ErrorBoundary` so that a single bad data point doesn't blank the
  page — but the line-48 patch is the minimum-viable correction.

  An integration test asserting the component renders without throwing
  when the API returns a status outside the DataEntityRunStatus enum would
  pin this. None exists today.
