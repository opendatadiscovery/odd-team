behaviour: '**Email per-recipient silent partial delivery**: `EmailNotificationSender.java:53-61`
  iterates `notificationsEmails` in order, reusing the same `MimeMessage`, calling
  `helper.setTo(email); emailSender.send(mimeMessage);` per iteration. Any thrown
  `MessagingException` aborts the loop via the surrounding try/catch — recipients
  after the failing one never receive the alert. Live doc names this as a known limitation;
  code has no fault-tolerance. Concept-flag HIGH.'
