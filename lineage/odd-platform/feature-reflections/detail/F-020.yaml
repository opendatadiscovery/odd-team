- id: H-004
  hypothesis: "When an operator clicks Regenerate on a collector's token, the new token takes over and the collector keeps working — i.e. rotation is a clean swap with a short overlap so a running collector is not knocked offline."
  derivation: "UI label ('Regenerate token') + the operator's standard mental model of credential rotation (issue-new-then-retire-old) + the live doc phrase 'rotate a leaked token'."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      Rotation is an in-place single-statement UPDATE of the one TOKEN row, with NO
      grace window and NO old/new overlap. TokenGeneratorImpl mutates the existing
      TokenPojo to a fresh RandomStringUtils.randomAlphanumeric(40) value;
      ReactiveTokenRepositoryImpl.java:30-39 issues `UPDATE token SET value=?,
      updated_at=? WHERE id=?`. The moment that commits, the
      IngestionDataEntitiesFilter's `tokenPojo.getValue().equals(token)`
      (IngestionDataEntitiesFilter.java:55-58) fails for the old token — in-flight
      ingestion using the prior secret 401s on its very next request with "Token is
      not correct." There is no previous_value column, no valid_until window. The UI
      ConfirmationDialog (CollectorItemToken.tsx:37-50) reads only "Are you sure you
      want to regenerate token for this collector?" — it warns of none of this.
    evidence:
      - sidecar: odd-platform__java__CollectorController__controller-method__regenerateCollectorToken.md
        section: "bugs_limitations_corner_cases[0] (no rotation grace period)"
        cite: "TokenGeneratorImpl.java:44-52 + ReactiveTokenRepositoryImpl.java:30-39 + IngestionDataEntitiesFilter.java:55-58"
        note: "In-place UPDATE; old token 401s the instant the rotation commits."
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "bugs_limitations_corner_cases[3] (no UI warning on no-grace rotation)"
        cite: "CollectorItemToken.tsx:38-49"
        note: "ConfirmationDialog text surfaces none of the operational consequence."
    operator_visible_failure: |
      (1) An operator rotating a token during active ingestion knocks their own
      collector offline — ingestion fails until the collector is reconfigured with
      the new value and restarted (typically a config-file change + redeploy).
      (2) Datasets that arrive during the rotation window are silently dropped (no
      default retry queue for auth failures at the collector level). (3) Because the
      UI's only prompt is "Are you sure?", an operator treating rotation as a
      reversible click discovers the no-grace semantic only from the ingestion
      incident. The clean-swap mental model the word "Regenerate" invites is wrong.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-005
  hypothesis: "When an operator rotates a token because it was leaked, doing so meaningfully reduces the attack surface on a default deployment — i.e. the rotated credential is what actually gates metadata ingestion."
  derivation: "Pillar mission ('rotate a leaked token' as a primary operator action) + the operator's reasonable belief that a credential the UI lets them rotate is load-bearing for the path it authenticates."
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |
      Rotation matters for ONE ingestion path and is a no-op for the other on the
      shipped default. The token gates two endpoints via two filters:
      IngestionDataSourceFilter (POST /ingestion/datasources) is ALWAYS-ON (no
      @ConditionalOnProperty), so a rotated token does take effect there. But
      IngestionDataEntitiesFilter (POST /ingestion/entities — the bulk metadata-write
      path) is @ConditionalOnProperty on auth.ingestion.filter.enabled, which ships
      `false` (application.yml:48). With the default config the filter bean is not
      registered, so /ingestion/entities is anonymously reachable REGARDLESS of the
      token value — rotating a "leaked" token has ZERO security effect on the
      bulk-ingestion path. So the hypothesis holds for /ingestion/datasources and is
      false for /ingestion/entities under defaults: the operator fixes half the
      attack surface believing they fixed all of it.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveCollectorRepositoryImpl.md
        section: "coupling[3] (asymmetric ingestion auth)"
        cite: "IngestionDataSourceFilter.java:15-22 (no @ConditionalOnProperty) + IngestionDataEntitiesFilter.java:19-20 (@ConditionalOnProperty) + application.yml:48"
        note: "Always-on datasource filter vs opt-in entities filter; the entities filter is off by default."
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "bugs_limitations_corner_cases[4] + requires-config"
        cite: "application.yml:48 + IngestionDataEntitiesFilter.md bugs_limitations_corner_cases[0]"
        note: "UI promises a security property (rotation) the default deployment does not enforce on /ingestion/entities."
    operator_visible_failure: |
      (1) An operator responding to a token leak on a default deployment rotates the
      credential, sees the UI succeed, and believes the incident is contained — while
      the bulk metadata-write endpoint remains anonymously writable. (2) The
      asymmetry between the two ingestion filters is invisible from the UI and from
      the property name (`auth.ingestion.filter.enabled` reads as a global ingestion
      lock; it gates one endpoint). The fix is to set the flag true AND rotate; the
      UI signals neither half.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate

