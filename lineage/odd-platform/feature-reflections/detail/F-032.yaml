        section: security.known_security_gaps
        cite: "App.tsx:73 vs App.tsx:75-88 + ToolbarTabs.tsx:45-49"
        note: "bare route vs the gated /lookup-tables sibling; unconditional tab"
    confidence: HIGH
    probe_id: P-090
    routes_to_finding: caveat-candidate
    # LSN-030 promise-layer projection
    use_case_projection:
      uc_id: F-032-UC-01
      kind: cross-actor
      promise: "A minimum-privilege authenticated user (no Permissions, no ownership) who opens /data-quality sees the full catalog-wide DQ aggregate — the dashboard is read-collaborative, not owner-scoped."
      coverage: unverified
      test_ref: null
      test_demand: functional   # CONFIRMED-but-untested — Rule 11: a security e2e pinning the read-collaborative reach (min-priv user => 200 + full aggregate) under LDAP/LOGIN_FORM. Probe P-090 firms the static trace; the TEST is the standing guard.
      test_demand_note: "Confirmed by static trace + P-090, but NO test pins that a zero-privilege principal reaches the catalog-wide aggregate. The regression guard matters precisely because the posture is read-collaborative-by-design — a future owner-scoped tightening must not silently break it (or silently widen it). Security cell of the test_matrix is GAP."

