amplification_factor_provenance: |-
  STATIC — confirmed from primary source. Single create or update per
  dialog submission; no per-keystroke debouncer-recreate observed at the
  form layer. The Markdown editor onChange callback updates form state
  in-place via `field.onChange(value)` (line 107); react-hook-form
  manages the re-render shape internally.
observed_vs_expected:
  facets:
  - drift_class: query_example_form_no_client_side_length_cap_or_allowlist_on_definition_or_query_authoring_xss_chain_first_intervention_point_uncaptured
    description: |-
      QueryExampleForm.tsx accepts arbitrary Markdown / HTML / inline
      JavaScript via the `definition` Input and the `query` Markdown
      editor. The only client validation is `required: true, validate:
      value => !!value.trim()` (lines 83, 94). Authoring is the FIRST
      point in the XSS chain where an allowlist could intervene cheaply;
      the form passes raw user input straight to the API. Companion to
      F-025's existing
      `markdown_render_no_sanitisation_xss_surface_extension_f_004_4th`
      facet — the F-025 facet is RENDER-time; this one is AUTHORING-time.
      The defence-in-depth gap is the same.
    evidence:
    - QueryExampleForm.tsx:83 (definition required + non-empty validation)
    - QueryExampleForm.tsx:94 (query required + non-empty validation)
    - QueryExampleForm.tsx:105-111 (Markdown editor renders user input verbatim)
    - Markdown.tsx:103-111 (editor mode = MDEditor preview='edit' — no input sanitization)
    ui_unverified: false
    severity: MEDIUM
  - drift_class: query_example_form_post_submit_navigates_to_details_url_no_optimistic_invalidation_visible_to_caller_unless_react_query_invalidates_list_cache
    description: |-
      QueryExampleForm.tsx:63-66 post-submit calls `reset(); navigate(
      queryExamplesPath(qe.id))` — the form resets and the user lands on
      the details page. The QueryExamplesList component (the list view)
      caches via react-query; if the create hook does NOT invalidate the
      list query key, a user navigating back via browser-Back sees the
      stale list without the new example. Unverified — depends on
      `useCreateQueryExample` hook contract (NOT read in this slice;
      ui_unverified=true).
    evidence:
    - QueryExampleForm.tsx:63-66 (post-submit navigation pattern)
    ui_unverified: true
    severity: LOW
  - drift_class: query_example_form_edit_mode_no_dirty_check_warning_dialog_closes_silently_on_navigation
    description: |-
      The DialogWrapper at QueryExampleForm.tsx:128-141 has no
      `handleNavigationWarning` or dirty-form-detection. A user in the
      middle of authoring a query example who clicks outside or hits
      Escape (per DialogWrapper default behaviour) loses their draft
      silently. No autosave, no draft persistence in localStorage. For
      a Markdown body of moderate size this is a UX paper-cut; for a
      long custom SQL snippet it's a real loss.
    evidence:
    - QueryExampleForm.tsx:128-141 (DialogWrapper has no dirty-form warning hook)
    ui_unverified: true  # depends on DialogWrapper internals not read in this slice
    severity: LOW
  - drift_class: query_example_form_definition_is_plain_input_not_markdown_inconsistent_render_will_render_definition_as_markdown
    description: |-
      QueryExampleForm.tsx:85-87 renders `definition` as a plain
      `<Input>` — NOT a Markdown editor. But the render site
      QueryExampleDetailsOverview.tsx:19 renders `definition` through
      `<Markdown value={definition} />` — Markdown-rendered. An author
      typing `**bold**` into the Definition field sees plain text in
      the form preview; on the details page they see rendered bold.
      Mode-mismatch between authoring and render UX. Either the form
      should use a Markdown editor for definition (matching render) OR
      the render should be plain (matching authoring). Cross-link to
      F-025's `markdown_render_no_sanitisation` facet — the same
      asymmetry creates a footgun for XSS payloads typed naively into
      a "plain" field.
    evidence:
    - QueryExampleForm.tsx:85-87 (definition is plain Input)
    - QueryExampleDetailsOverview.tsx:19 (definition is rendered through Markdown)
    ui_unverified: false
    severity: LOW
