gap_id: TEST-GAP-367
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java service service:AlertServiceImpl
surfaced_by:
- AlertServiceImpl.md:bugs_limitations_corner_cases.[3]
behaviour: 'AlertManager webhook `generatorURL` XSS / open-redirect — line 168 builds
  the URL via `UriComponentsBuilder.fromUri(externalAlert.getGeneratorURL())`; line
  185 embeds it in the alert chunk description as `String.format("Distribution Anomaly.
  URL: %s", queryUrl)`. The URI type does not block `javascript:` scheme or arbitrary
  host URLs. If the UI renders the description as a clickable link or innerHTML, this
  is a stored-XSS / open-redirect surface — and the AlertManager endpoint is unauthenticated
  (combined with TEST-GAP-365 spoof), so any caller can plant the payload. Cross-references
  the F-004 XSS finding (TEST-GAP-293) but on a different ingress surface.'
test_class: missing-security
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/AlertManagerWebhookXSSTest.java
  name: handleExternalAlerts_javascriptSchemeGeneratorURL_storesVerbatim
evidence:
- 'AlertServiceImpl.md says: ''The AlertManager webhook payload''s `generatorURL` is
  propagated verbatim into the alert chunk description rendered in the UI (severity
  MEDIUM — escalates to HIGH if the UI renders description as innerHTML)'''
- 'AlertServiceImpl.java:168 (URL build) + 185 (description embedding)'
- 'AlertManagerController.java:21-26 — unauthenticated endpoint'
cross_references:
- TEST-GAP-293 (F-004 description XSS — sibling stored-XSS surface)
- TEST-GAP-365 (spoof angle — same webhook surface)
- P-009 (XSS render probe — existing dynamic-verification probe; could be extended
  to this surface)
proposed_action: Add `AlertManagerWebhookXSSTest` POSTing payloads with `generatorURL`
  values of (a) `javascript:alert(1)`, (b) `https://attacker.example/?x=<script>`,
  (c) a control https URL; assert the stored alert chunk description preserves the
  payload verbatim and pin the current behaviour. Pair with a UI-render-path verification
  probe (browser_events observe kind from the dynamic-verification slice 8 protocol).
