        a client-only search (no debouncing — line 23-24
        `setQuery(e.target.value)` fires on every keystroke;
        line 26-29 filter runs on `data?.items` array). For a
        future deployment with hundreds of integrations on classpath,
        the per-keystroke re-filter cost is acceptable. The empty
        state under the F-033 "empty registry default checkout state
        undocumented" finding renders via EmptyContentPlaceholder
        (line 71-74) — confirmed at file:line; the placeholder is
        generic ("No content") and does NOT explain "this is a
        default ODD platform checkout with no wizards on classpath".
    (3) WIZARD CONTENT NAVIGATION — Integration.tsx:13-51 mounts
        IntegrationHeader + IntegrationTabs + IntegrationRoutes.
        IntegrationRoutes.tsx:11-29 navigates to the first
        contentByTitle key by default. The TAB ORDER is
        Object.keys(contentByTitle) — JSON object key insertion
        order. For a wizard manifest with multiple titles, the order
        is server-controlled. No alphabetic / explicit-priority sort.
    (4) ARGUMENT FORM UX (NEW DISTINCT SURFACE — graduated to F-162)
        — IntegrationCodeSnippetWithForm.tsx:13-133 is the wizard's
