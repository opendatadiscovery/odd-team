control_summary: |-
  0 of 4 cells PROBED — feature emerged from batch-H primary-source
  audit; no probe authored yet. The headline behaviour (anonymous AlertManager
  POST creating cross-tenant alerts visible on the platform-wide All tab) is the
  highest-leverage candidate for the next probe round. Proposed P-NNN — POST
  AlertManager-shaped payload to the docker-compose stack with AUTH_TYPE=DISABLED
  + verify alert row appears in GET /api/alerts AND assert attacker-chosen entity_oddrn
  was accepted verbatim. Batch-I closes hop-2 with AlertServiceImpl primary-source
  confirmation — entity_oddrn-trusted path PROVEN at line 178, AlertActionResolver
  asymmetry PROVEN (handleExternalAlerts skips the resolver, applyAlertActions uses
  it). Three NEW facets surface — (1) AlertActionResolver asymmetry; (2) generator-URL-embedded-in-chunk
  UI render surface; (3) ExternalAlert.startsAt timezone-naive (embedded Prometheus
  query window misaligned).

  Batch P closes hop-1 at the METHOD TIER with PRIMARY-SOURCE confirmation
  of the three load-bearing drift facets (unauthenticated_payload_trust,
  cross_tenant_alert_creation, no_idempotency_no_audit) directly at the
  4-line `alertManagerWebhook` body (AlertManagerController.java:21-26). The
  method has zero auth annotations, zero validation annotations, zero
  header inspection, zero audit logging, and the inner static
  `AlertManagerRequest` DTO is the deliberate hand-rolled alternative
  to OpenAPI-contract generation (per the explicit
  `// TODO: define OpenAPI spec based on alert provider contract` at line 20).
  Hop-1 is now PRIMARY-SOURCE at both the class tier (batch H) AND the
  method tier (batch P). NEW SUPERSEDE recorded — the live doc page
  `https://docs.opendatadiscovery.org/features/active-platform-features/alerting`
  was 404 in the batch-H 2026-05-08 enrichment; refreshed 2026-05-20 in
  batch P returns status 200. The page now cross-links to this endpoint
  and documents the Distribution Anomaly halt-toggle limitation. The prior
  404 finding is superseded; the doc-product surface has improved between
  batches H and P. Two new SECONDARY drift facets (timestamp offset stripping
  + DTO silently drops wire fields including `status: resolved`) are
  evidence-anchored at the controller-method tier and complement the
  existing chain's primary facets without changing the headline.
  The HIGHEST-LEVERAGE probe candidates remain unchanged from batch H/I —
  anonymous POST under DISABLED for the headline regression-pin, the
  cross-tenant attribution surface for the entity_oddrn-trust contract,
  and the duplicate-POST surface for the missing-idempotency contract.
  The doc-side improvement (the alerting page now exists) does NOT
  reduce the security-side findings — the verbatim doc text confirms
  the unauthenticated posture is INTENDED-as-documented, which makes
  the operator-side network-controls reliance EXPLICIT but does not
  reduce the cross-pillar compound surface (F-007 + REFACTOR-024 forge-and-display).
