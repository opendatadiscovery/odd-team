      permissionTo={QUERY_EXAMPLE_TERM_CREATE} (TermQueryExamples.tsx:33). Both are client-side conditional
      renders — an operator inspecting the DOM or hitting the API directly bypasses them (F-155 facet
      query_examples_link_query_button_visible_in_dom_inspection). The AUTHORITATIVE gate is the backend:
      TermController.createQueryExampleToTermRelationship carries a SecurityRule
      QUERY_EXAMPLE_TERM_CREATE on resource term_id (TermController sidecar
      security.authorization_assertions, SecurityConstants.java:187-189). So the WRITE is backend-enforced
      — partial only because (1) the enforcement is not test-pinned, and (2) sibling term-linkage gates in
      this controller cluster have a documented path-mismatch class (REFACTOR-217 per the F-151 reflection
      H-009), so the specific QUERY_EXAMPLE_TERM_CREATE path-to-rule binding warrants a probe rather than a
      confirmed verdict.
    evidence:
      - sidecar: odd-platform__java__TermController__controller-class__TermController.md
        section: security
        cite: "SecurityConstants.java:187-189 (QUERY_EXAMPLE_TERM_CREATE on /api/terms/{term_id}/queryexample POST)"
        note: "backend SecurityRule is the authoritative gate"
      - sidecar: "(source_read_for_validation — UI hop unresolved)"
        section: ui
        cite: "TermQueryExamples.tsx:33 (WithPermissions UI-only hide) + TermDetailsRoutes.tsx:33-44 (route gate)"
        note: "client-side hides only; DOM/API bypass possible"
    operator_visible_failure: |
      The UI-only hide leaks permission state: an operator without QUERY_EXAMPLE_TERM_CREATE can infer the
      permission's existence (and that others hold it) by inspecting the DOM — aligned with the
