behaviour: |-
  **CRITICAL — Cross-entity privilege escalation: a user with `DATA_ENTITY_ATTACHMENT_MANAGE` on entity A can mutate (delete file, update link, delete link, download file) ANY file or link in the catalog by spoofing entity A's id in the URL while supplying a fileId/linkId belonging to entity B.** Primary-source confirmed in the batch-V DataEntityAttachmentController sidecar:

  - `deleteFile(dataEntityId, fileId)` (`DataEntityAttachmentController.java:83-88`) accepts `dataEntityId` in the URL path but ONLY passes `fileId` to `attachmentService.deleteFile(fileId)` — `dataEntityId` is discarded silently.
  - `updateLink(dataEntityId, linkId, formData)` (`DataEntityAttachmentController.java:100-107`) — same pattern, `dataEntityId` discarded.
  - `deleteLink(dataEntityId, linkId)` (`DataEntityAttachmentController.java:110-114`) — same.
  - `downloadFile(dataEntityId, fileId)` (`DataEntityAttachmentController.java:73-80`) — same.
  - `completeFileUpload(dataEntityId, uploadId)` (`DataEntityAttachmentController.java:65-70`) — same.

  The `DATA_ENTITY_ATTACHMENT_MANAGE` permission is wired on `(subject=DATA_ENTITY, dataEntityId)` per `SecurityConstants.java:247-276` — the authorization manager resolves the permission by checking the caller's grant on the URL's `dataEntityId`. The check PASSES if the caller has the permission on entity A. The service then operates on `fileId` (which belongs to entity B). Authorization passes for the wrong entity.

  **Attack scenario**:
  ```
  # Attacker has DATA_ENTITY_ATTACHMENT_MANAGE on entity 100 only.
  # File 999 belongs to entity 200 (attacker has NO permission on entity 200).

  curl -X DELETE https://platform/api/dataentities/100/files/999 \
       -H "Authorization: Bearer $TOKEN"

  # Result: file 999 is deleted. Authorization manager checked permission on entity 100 (granted).
  #         Service deleted file 999 (which belongs to entity 200, not 100). Cross-entity write.
  ```

  **Compound with the existing TEST-GAP-022 (uploadId hijack — sister surface at the chunked-upload state machine)**: TEST-GAP-022 covers the chunk-upload variant where the uploadId belongs to a different entity than the path's dataEntityId. THIS gap covers the FILE/LINK mutation variants: an entirely different class of methods (delete, update-link, delete-link, downloadFile, completeFileUpload) all share the same architectural bug — URL-path-only-as-layout, fileId/linkId-is-the-real-key. The two gaps together demonstrate the pattern is SYSTEMIC across the controller, not isolated to one method.

  **Why CRITICAL not HIGH**: this is the WRITE-side privilege escalation across all four mutation surfaces of an attachment subsystem. Combined with TEST-GAP-022 (uploadId hijack on chunk upload), TEST-GAP-027 (Content-Disposition CRLF/path-traversal — see TEST-GAP-735 for the new path-traversal extension), and TEST-GAP-028 (read endpoints have no SecurityRule — every authenticated user reads attachments cross-entity), the WRITE-side cross-entity escalation completes the picture: an attacker with one DATA_ENTITY_ATTACHMENT_MANAGE grant has effective full-platform attachment-CRUD on every entity. The blast radius is the entire catalog's attachment surface. Five surfaces × one bug class = CRITICAL.

  **Test gap shape**: regression-pin asserting that each of the four mutation methods + downloadFile succeeds when the URL's dataEntityId is one the caller has permission on but the fileId/linkId belongs to a DIFFERENT entity the caller has NO permission on. Pin five surfaces in lockstep.
