    actual_behavior: |
      The LDAP sidecar reports that `AuthIdentityProviderImpl.getCurrentUser()` returns `UserDto(username, null)`
      for LDAP users (provider=null), because only the OAuth2 branch sets a provider; and the user-owner mapping
      joins on `(username, provider)`. So an owner-mapping row created under OAUTH2 (`provider='google_corp'`) will
      NOT match an LDAP login of the same username (`provider=null`), and vice versa — a mode migration silently
      invalidates owner linkage and any Role bound to the old Owner. Whether ADMIN specifically carries over
      depends on whether the new mode's admin-detection (LDAP admin-groups) independently re-grants it — which it
      does if the directory groups are configured, but does NOT inherit the prior Role-bound ADMIN. The exact
      cross-mode behaviour (does provider=null collide with LOGIN_FORM's provider value? does S2S admin username
      'admin' collide?) is a multi-mode runtime interaction the sidecars describe statically but cannot fully
      resolve without standing up two modes against the same DB. Routed to a probe.
