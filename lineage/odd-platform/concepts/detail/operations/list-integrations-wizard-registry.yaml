notes: |-
  NEW operation captured in batch 2026-05-25-ZD. The Integration
  Wizard surface is the operator-facing copy-paste tool for
  collector configuration. Three live doc pages cover it:
    - /integrations/integrations/integration-wizard (mechanism)
    - /integrations/integrations (overview)
    - /developer-guides/api-reference/integrations (API ref)

  All three are silent on:
    - The auth posture (open-read across all modes including
      anonymous DISABLED)
    - The 204-on-missing-id behaviour
    - The empty-registry default-build state
    - The `installed: false` hardcoded constant
    - The case-insensitive id collision
    - The boot-time fail-fast on malformed YAML

  DOC-NNN candidates for each. The wizard doc page is the
  canonical home for the mechanism caveats; the api-reference
  page is the canonical home for the HTTP status/auth caveats.
