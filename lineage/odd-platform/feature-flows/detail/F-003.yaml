feature_id: F-003
feature_name: Popular entities ranking — exclude-from-search filter consistency
discovered_from_entry_point: rest:GET /api/dataentities/popular
description: 'The Popular ranking surface (Catalog Overview''s "Popular" strip) ranks

  entities by view_count DESC. 9 other list-shape sites in the codebase

  apply the data_entity.exclude_from_search filter to hide internal/staging

  entities; the Popular CTE does NOT. An entity marked hidden-from-search

  with high view_count surfaces on the platform''s home page.

  '
contributing_nodes:
- odd-platform java DataEntityController controller-method:getPopular
- odd-platform java ReactiveDataEntityRepositoryImpl.listPopular — the CTE that omits
  EXCLUDE_FROM_SEARCH
terminal_side_effect:
  side_effect_class: page-render
  description: Returns ranked DataEntityRef list to the home-page strip
  evidence: DataEntityController.getPopular → DataEntityServiceImpl.listPopular →
    repository CTE
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: EXCLUDE_FROM_SEARCH consistency
    observed: entity with exclude_from_search=true + view_count=999 appears in /api/dataentities/popular
      response
    expected: hidden-from-search entities consistently excluded across all list-shape
      surfaces (9 sites apply the filter)
    drift_class: filter_application_inconsistency
    provenance: MEASURED — P-006 (run R-20260519T011813Z-P-006) seeded the entity,
      GET'd /api/dataentities/popular, asserted appears_in_popular == True
