behaviour: |-
  **DirectoryServiceImpl.getDataSourcePrefix SWALLOWS ALL EXCEPTIONS (catch Exception) AND BUCKETS UNDER `UNKNOWN_DATASOURCE_TYPE` — a transient ODDRN parser bug or malformed ODDRN silently lands sources in the "Other" bucket rather than surfacing.** `DirectoryServiceImpl.java:101-110` catches `Exception` and returns `UNKNOWN_DATASOURCE_TYPE`; `DirectoryServiceImpl.java:112-122` (`getDataSourceName`) does the same. The intent (per implicit_adrs[2]) is failure-tolerant fallback — show the source under "Other" rather than erroring the entire Directory landing page. **But the swallow is unconditional**: a transient ODDRN parser bug (e.g., a runtime exception thrown by the upstream `oddrn-generator` library on a previously-parseable ODDRN due to a library version upgrade) would silently re-bucket sources from their correct prefix to "Other" with no log warning, no exception surfacing, no operator alarm. **The existing `DirectoryTest.java:79-85` covers the FORMAT case** (two ODDRNs whose syntax is unknown to the parser correctly bucket under "Other") but does NOT cover the EXCEPTION case (a known-format ODDRN where the parser throws on something else). Operators investigating "why is my postgres source under Other?" have only the error log to go on — and there is no INFO/WARN log emitted on the catch-block. **No test injects an exception-raising ODDRN path** to assert the fallback works under exception (not just format-mismatch). **Why this matters**: a refactor that replaces the `try/catch(Exception)` with `try/catch(SpecificException)` to surface parser-bug failures explicitly would silently change behaviour on Directory landing pages; the test should pin the current swallow as intentional.
