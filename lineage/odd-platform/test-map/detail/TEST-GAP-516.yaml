behaviour: |-
  Silent empty-Flux 200/`[]` degradation regression-pin (LOW — P-09). A caller with: (a) no `USER_OWNER_MAPPING` row, (b) owner with zero owned entities, (c) owned entities with no upstream/downstream LINEAGE edges, (d) no SecurityContext (e.g. DISABLED mode) — ALL receive HTTP 200 + `[]`. There is no 401, no 403, no `OwnerNotAssociatedException`, no signal in the response distinguishing the four cases. A new operator who runs this endpoint and gets `[]` has no signal whether the platform thinks they own nothing, the platform thinks they're not linked to an owner, or there's no upstream/downstream lineage data. The information-quality issue is the same shape as the base `/my` endpoint per batch G — inherited from the silent-empty-Flux degradation at `DataEntityServiceImpl.java:212-216`. NO test pins the contract — a future refactor adding `.switchIfEmpty(Mono.error(new OwnerNotAssociatedException(...)))` would silently flip the contract for callers expecting `[]`. The test should pin both the current silent contract AND the fail-fast alternative.
