# Ingestion API Authentication Coverage Matrix — product-owner reflection

## product_owner_narrative

The Ingestion Authentication feature is the single security control standing between the public internet and the ODD Platform's write surface. ODD's catalog is fed by collectors and push adapters that `POST` to the `/ingestion/*` path family — entity definitions, dataset statistics, per-entity metrics, datasource registrations, DEG-membership reads. Of the five `/ingestion/*` endpoints on `IngestionController`, four MUTATE the catalog (and per F-008's destruction-surface analysis, a partial-state `DataEntityList` payload can SILENTLY DELETE metadata and lineage). The one knob an operator reaches for to protect this surface is `auth.ingestion.filter.enabled` (per `config-key-consumer:auth.ingestion.filter.enabled@L20.md:understanding`). The feature's product promise, read from the property name, is "authenticate ingestion." The reality, read from the code, is "authenticate exactly one of the five ingestion endpoints." That gap between the name's promise and the implementation's scope is the load-bearing finding this reflection exists to surface.

The user of this feature is not an end-user clicking a screen — it is the **platform operator** hardening a deployment (reading `application.yml`, picking an `auth.type`, deciding whether to flip the filter on), the **collector / push-adapter HTTP client** sending tokens, and the **security reviewer** auditing "which of my endpoints require a credential?" The interaction surface is a YAML file and an HTTP wire, not a form or a modal. An operator hardens ingestion by setting `auth.ingestion.filter.enabled: true` (default `false` per `application.yml:46-48`); a collector then sends `Authorization: Bearer <per-datasource-token>` and the `IngestionDataEntitiesFilter` validates it via plaintext `String.equals` against the datasource's (or parent collector's) TOKEN row, returning 401 on mismatch (per `auth__filter__IngestionDataEntitiesFilter.md:invariants[3,4]`). The observable outcome the operator and reviewer see is the per-endpoint HTTP status code, and the YAML value they trust to predict it.

The working parts decompose along four dimensions that compose into an 80-cell matrix: 5 endpoints × 4 UI auth modes (`DISABLED / LOGIN_FORM / OAUTH2 / LDAP`) × 2 filter-toggle states × 2 S2S-toggle states (per `IngestionController__controller-class.md:understanding` + `feature-flow F-094:terminal_side_effect`). The single ingestion filter (`IngestionDataEntitiesFilter`) binds a HARD-CODED EXACT-LITERAL matcher to `/ingestion/entities` POST (`auth__filter__IngestionDataEntitiesFilter.md:invariants[1]` — line 28); its sibling `IngestionDataSourceFilter` is unconditional and covers `/ingestion/datasources`; the other three endpoints (`postDataSetStatsList` → `/ingestion/entities/datasets/stats`, `ingestMetrics` → `/ingestion/metrics`, `getDataEntitiesByDEGOddrn`) are matched by NO filter. All four UI auth modes whitelist `/ingestion/**` entirely (`SecurityConstants.WHITELIST_PATHS` line 95-96, applied by `AuthorizationCustomizer:22` for OAUTH2/LDAP and `LoginFormSecurityConfiguration:50` for LOGIN_FORM), so the UI auth mode never protects ingestion regardless of `auth.type`. The net class-level posture (per `IngestionController__controller-class.md:coherence_check.strengthens[0]`): under default deployment, 4 of 5 endpoints accept unauthenticated POSTs; under the MOST-hardened deployment (OAUTH2 + S2S + filter ON), 3 of 5 endpoints REMAIN unauthenticated.

This feature is the integration spine's gatekeeper: P-10 (Integrations & Ingestion) feeds P-01 (Discovery), P-04 (Quality), P-05 (Lineage), and P-07 (Active Platform Features) through these exact endpoints (per `system-mission.md` cross-pillar graph `P-10→P-01/P-04/P-05/P-07`). The AlertManager webhook (`POST /ingestion/alert/alertmanager`, F-007) is a sixth `/ingestion/*` path that is unauthenticated in every configuration (per `AlertManagerController__postAlerts.md:invariants[2]`). The metrics endpoint (F-030) carries the same posture plus PII-label-passthrough and tenant-isolation-absence on the default INTERNAL_POSTGRES backend (per PLT-051 / DOC-GAP-240). The platform-API contract (F-029) exposes all five endpoints in the OpenAPI spec without any auth annotation. This feature is therefore the causal root of a cluster: its property-name misdirection is the trap, and the sibling-endpoint coverage gaps are the blast radius.

The edge cases a product owner would highlight in a demo are the silent ones: an operator who flips the filter on and audits the ticket as "done" never sees that stats/metrics/alertmanager stayed open (no boot-time WARN, no startup log — `IngestionController__controller-class.md:coupling` notes the `@Slf4j` annotation is dead code); an operator who "turns on auth" by switching `auth.type` to OAUTH2 is surprised that ingestion stays open (the whitelist precedes the auth check); an operator who follows the live S2S doc's defence-in-depth recommendation (combine S2S with the filter) finds S2S does not protect ingestion either (the `/ingestion/**` whitelist `permitAll` short-circuits BEFORE the S2S `addFilterAt`); and a future maintainer who adds `/ingestion/entities/batch` silently ships it unprotected because the matcher is an exact literal with no wildcard. Every one of these is invisible until a request hits the open endpoint — which is exactly the LSN-001 / LSN-002 class (a silent insecure default the docs of the day did not warn about).

## hypotheses

- id: H-001
  hypothesis: "When an operator sets `auth.ingestion.filter.enabled=true` in application.yml, reads the property name as 'ingestion is authenticated', and ships the deployment, all five `/ingestion/*` endpoints require a credential."
  derivation: "The property is named `auth.ingestion.filter.enabled` (namespace-wide reading); the pillar P-09 promise is 'enable the Ingestion filter for production deployments'. Endpoint-shape + pillar-mission seed."
  seed_source: pillar + endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      Setting the property `true` registers exactly ONE filter bean
      (`IngestionDataEntitiesFilter`) whose matcher is the hard-coded exact
      literal `/ingestion/entities` POST (filter sidecar invariants[1], line 28).
      `postDataSetStatsList` (/ingestion/entities/datasets/stats), `ingestMetrics`
      (/ingestion/metrics), and `getDataEntitiesByDEGOddrn` are matched by NO
      filter and stay unauthenticated even with the toggle ON. The unconditional
      sibling `IngestionDataSourceFilter` covers only /ingestion/datasources. So
      enabling the toggle authenticates 2 of 5 endpoints, not 5.
    evidence:
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: concepts.invariants[1] + coupling[0]
        cite: "IngestionDataEntitiesFilter.java:28"
        note: "Hard-coded exact-literal /ingestion/entities POST matcher; sibling paths unmatched."
      - sidecar: odd-platform__java__IngestionController__controller-class__IngestionController.md
        section: coherence_check.strengthens[1]
        cite: "IngestionController.java:31-103 + SecurityConstants.java:95-96"
        note: "Class-level roll-up: 3 of 5 endpoints remain unauthenticated even with the toggle enabled."
    operator_visible_failure: |
      The operator files the security audit as "ingestion locked down" and ships
      a deployment where /ingestion/entities/datasets/stats, /ingestion/metrics,
      and (via the F-007 sibling) /ingestion/alert/alertmanager accept arbitrary
      payloads from any network-reachable caller. Concrete consequences: (a) an
      attacker mints catalog tags via the postDataSetStatsList tag side-channel,
      bypassing the TAG_CREATE RBAC gate (IngestionController sidecar
      downstream_side_effects); (b) an attacker mints arbitrary metric_entity
      rows / Prometheus series (cardinality DoS, PLT-051 Defect 3); (c) the
      AlertManager webhook accepts forged anomaly alerts. None of these surfaces
      a boot-time warning — the misperception persists until exploited.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-002
  hypothesis: "When the operator enables the filter and a collector POSTs `/ingestion/entities` with a valid `Authorization: Bearer <per-datasource-token>`, the request is accepted (2xx); a missing or wrong token is rejected with 401."
  derivation: "The filter's purpose per its understanding is per-datasource bearer-token auth; the happy + 401 paths are the feature's core contract. Endpoint-shape seed."
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      When registered, the filter requires `Authorization: bearer <token>`
      (case-insensitive prefix), resolves the datasource by the payload's
      data_source_oddrn, and compares the supplied token via plaintext
      String.equals to the datasource's TOKEN row (or, when datasource.token()
      is null, the parent collector's TOKEN row). Mismatch throws
      AccessDeniedException → 401 with the verbatim body "Token is not correct";
      a missing/malformed header throws "Token is missed" → 401. A correct token
      admits the request and re-emits the buffered body to the controller.
    evidence:
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: concepts.invariants[2,3] + security.authorization_assertions
        cite: "IngestionDataEntitiesFilter.java:41,46-58 + AbstractIngestionFilter.java:45-51,66-72"
        note: "Bearer-token resolution + plaintext compare + 401 wire shapes confirmed at primary source."
    severity: ~
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: "When the operator runs the BUNDLED DEFAULTS (auth.type=DISABLED + auth.ingestion.filter.enabled=false) and a caller POSTs `/ingestion/entities` with no credential, the platform rejects it."
  derivation: "Negative-space — an operator who has not customised config would HOPE the write endpoint is not open to the internet. Pillar P-09 'enable the ingestion filter for production deployments' implies a safe default."
  seed_source: negative-space + pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      The hypothesis predicts a REJECTION; the code ACCEPTS. With the bundled
      defaults the filter bean is not registered (havingValue="true", no
      matchIfMissing, application.yml ships explicit false), and the
      SecurityWebFilterChain under DISABLED does anyExchange().permitAll() — so
      the request reaches the controller and IngestionService.ingest with no
      credential check. The verdict is "confirmed" in the sense that the code's
      behaviour is unambiguous and fully traced (the endpoint IS open by
      default); it directly CONTRADICTS the safe-default a careful operator
      would hope for, which is why it routes to a caveat as well as a test.
    evidence:
      - sidecar: odd-platform__java__IngestionDataEntitiesFilter__config-key-consumer__auth_ingestion_filter_enabled@L20.md
        section: concepts.invariants[0,1,2] + bugs_limitations_corner_cases[0]
        cite: "IngestionDataEntitiesFilter.java:20 + application.yml:46-48 + LoginFormSecurityConfiguration.java:50 + SecurityConstants.java:95-96"
        note: "Default-off posture: bean not registered; endpoint anonymously reachable in all four UI modes."
    operator_visible_failure: |
      A deployment run straight from the install guide (the LSN-001 shape) ships
      with the platform's largest write surface open to any caller that reaches
      port 8080. Per F-008, partial-state payloads silently DELETE metadata and
      lineage. The live docs NOW disclose this (mitigated 2026-05-27), but the
      YAML surface still carries no inline comment (F-094a / PLT-043). This is
      "confirmed" as code behaviour and a caveat the maintainer tracks.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

