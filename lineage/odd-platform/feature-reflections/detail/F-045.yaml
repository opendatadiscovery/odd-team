- id: H-010
  hypothesis: "When the Structure tab resolves 'latest', the URL the user sees stays stable / reflects what they intended — the user is not silently handed a URL pointing at a version they did not choose."
  derivation: "Rule 9 UX seed (consistency / no surprise) + batch-extension NEW UI-tier facet 1."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      On first mount with no version_id, DatasetStructureOverview dispatches
      fetchDataSetStructureLatest and, on success, calls navigate(datasetStructurePath(id,
      resolvedVersionId), {replace:true}) — silently rewriting the URL to embed the
      resolved (max-version) id (DatasetStructureOverview.tsx:32-37). This is partly good
      UX (a now-shareable deep link) but the replace is silent and, combined with H-003's
      max(version)≠max(created_at) divergence, pins the URL to the highest-version row with
      NO signal that it might not be the most-recent-by-time revision. The user's URL bar
      now carries a version they never selected.
    evidence:
      - sidecar: "(feature-flow batch extension)"
        section: "batch_extensions[ui-review-2026-05-26-K] facet 1"
        cite: "DatasetStructureOverview.tsx:32-37"
        note: "replace:true URL rewrite on latest-resolve; no replay-divergence signal."
    operator_visible_failure: |
      An operator who copies the URL after landing on "latest" shares a link pinned to a
      specific (max-version) revision, not a "give me latest" link — so a colleague opening
      it later, after a newer ingest, sees the OLD revision and may not realise it. Under
      the replay/fixup case the pinned version can be the older-by-time row. UX surprise +
      a correctness trap, not a crash.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: "When a compare request fails, the user sees an error that tells them what went wrong (wrong/stale version id vs platform outage) so they can self-correct."
  derivation: "Rule 9 UX seed (intuitive error recovery) + batch-extension NEW UI-tier facet 2."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      DatasetStructureCompare renders a single undifferentiated <AppErrorPage> whenever the
      diff hook returns ANY error (DatasetStructureCompare.tsx:46-51). It does not branch on
      4xx vs 5xx. Paired with H-004's backend asymmetry (missing id → 500, identical id →
      400) and H-001/H-002's cross-dataset 200s, every failure mode collapses to the same
      full-page error: "wrong id" looks identical to "platform down". Worse, the most
      dangerous case (cross-dataset 200 nonsense diff) is NOT an error at all and renders as
      a normal diff. The UI also does not validate URL-supplied firstVersionId/secondVersionId
      against the loaded datasetVersions list (DatasetStructureCompare.tsx:24-26), so the
      URL-paste attack of H-002 reaches the backend unchecked.
    evidence:
      - sidecar: "(feature-flow batch extension)"
        section: "batch_extensions[ui-review-2026-05-26-K] facet 2 + corroboration 3"
        cite: "DatasetStructureCompare.tsx:24-26,46-51"
        note: "One AppErrorPage for all errors; no 4xx/5xx branch; no client-side version-id validation."
    operator_visible_failure: |
      (1) A user who pastes a stale/wrong compare URL sees a full-page outage-style error and
      cannot tell it was their input — they may escalate to support thinking the platform is
      down. (2) The no-validation gap is the client-side half of the H-002 cross-dataset leak:
      the compare viewer faithfully renders a 200 nonsense diff from a forged URL with no
      warning, which is the more damaging failure because it looks legitimate.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

