    drives the entire UI's permission gating from that single response — so what a user
    can and cannot click is decided by whoami's `permissions` list, not by any per-control
    server check at click time.
  derivation: |-
    App.tsx dispatches fetchIdentity() on mount; profile.selectors.getGlobalPermissions
    reads the stored permissions; PermissionProvider.isAllowedTo tests membership in that
    list. Endpoint-shape + UI-data-flow seed.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      App.tsx:46-51 dispatches fetchIdentity() inside a mount useEffect (empty dep array).
      The thunk (profile.thunks.ts:6-9) calls identityApi.whoami() and stores the
      AssociatedOwner in the profile slice. getGlobalPermissions (profile.selectors.ts:17-19)
      returns profile.owner?.identity.permissions. PermissionProvider.isAllowedTo
      (PermissionProvider.tsx:19-25) returns true iff every required permission is in
      [...globalPermissions, ...resourcePermissions]. The UI gate is purely client-side
      off this one stored list; the SERVER still independently enforces SECURITY_RULES at
      mutation time (AuthorizationCustomizer.java:24-30), so the UI list is a convenience
      gate, not the authorization boundary.
