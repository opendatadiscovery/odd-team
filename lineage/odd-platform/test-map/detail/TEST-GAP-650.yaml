  - "OwnersList.md says (security.authorization_assertions): 'WithPermissions(Permission.OWNER_CREATE) wraps the Create-Owner button (OwnersList.tsx:88-98). UI hides the button when the current user lacks OWNER_CREATE; the API enforces the gate at SecurityConstants.java:143. WithPermissions(Permission.OWNER_UPDATE) wraps the Edit-Owner button on each row. WithPermissions(Permission.OWNER_DELETE) wraps the Delete-Owner button + ConfirmationDialog on each row.'"
  - "OwnersList.md says (implicit_adrs.[0]): 'Client-side permission-gated affordance HIDING (not disabling) — the UX convention is to omit forbidden affordances from the DOM rather than render them with disabled styling.'"
cross_references:
