mitigations_unimplemented:
  - |-
    Codify the safe pattern as a project convention: ALL Management
    list components use `useEffect(() => { if (!query) dispatch(fetchXList({...})); }, [fetchXList, query])` as the
    mount-and-search-clear refetch shape. Document the pattern at
    `<odd-platform-ui>/src/components/Management/README.md` (or
    similar) so future maintainers do NOT introduce fetch-result
    derived values into mount-effect deps.
  - |-
    Add a custom ESLint rule (or extend `react-hooks/exhaustive-deps`
    with a custom flag) that warns when a `useEffect` deps array
    contains a value sourced from a Redux selector that the same
    effect's dispatch would modify. This is the structural shape of
    LSN-017; a lint rule prevents recurrence.
  - |-
    Add Vitest tests on at least one Management list component
    (PolicyList or RolesList) that assert "calling fetchXList once
    + receiving a response does NOT trigger a second fetchXList
    dispatch" — pins the safe pattern as a regression test.
notes: |-
  Positive findings are catalogued because they evidence STRUCTURAL
  safety. Future scans of Management list components should consult
  this invariant before flagging the `[fetchXList, query]` deps
  pattern as a smell — the smell is COSMETIC (incorrect dep list per
  linting hygiene) NOT a runtime hazard.

