notes: |-
  STRENGTHENED batch 2026-05-19L with the per-entity-alerts (P-07-shaped)
  surface. The pattern is now 9-surface (8 controller / openapi-tag
  surfaces + the per-entity-alerts surface added this batch). The
  audit-export-workaround amplification on `getDataEntityAlerts` is the
  most operationally-significant single-surface observation — operators
  following the documented workaround silently expose themselves to
  unbounded query risk.

  Recommended cleanup paths (in increasing scope):
    - Document a recommended size value on the audit-export workaround
      section of the alerting page
    - Add @Min/@Max validation annotations to controller params
    - Standardise a service-layer clamp helper that every paginated
      controller method invokes
    - Constrain the OpenAPI PageParam / SizeParam at the spec level
      (would require regenerating clients)
