behaviour: |-
  **MEDIUM — both the dashboard re-fetch AND the filter autocompletes fire ONE network request per micro-action with no debounce / batch-apply, generating request bursts on the operator's primary interaction surface.**

  **Two distinct un-debounced surfaces** (statically certain):

  1. **Autocomplete per-keystroke list-API**: `MultipleFilterItemAutocomplete.tsx:57-66` calls `setSearchText(query)` directly on every `'input'` event. `searchText` is passed straight into `useFilter`'s `useHook({ page: 1, size: 30, query: searchText })` (`hooks/index.ts:13-17`); `searchText` is the React-Query key (`namespace.ts:7`). Each character types a fresh GET. Typing "production" (10 chars) into the Namespace filter fires up to 10 calls to `/api/namespaces`. With 5 filters × 2 sides = 10 autocompletes, an operator filling out the panel can generate a substantial burst.
     - React-Query dedupes IDENTICAL keys, not distinct prefixes — "p", "pr", "pro", ..., "production" are all distinct keys.

  2. **Dashboard re-fetch per filter chip toggle**: every select/deselect mutates `formFiltersAtom`; `filtersAtom` re-derives; react-query sees a new key; new `GET /api/dataqatests/runs` fires (`DataQualityStore.ts:32-42` + `DataQualityContent.tsx:23-24`). No debounce, no "Apply" gate. An operator building a multi-chip filter slice fires one full backend dashboard query per chip rather than one on a deliberate "Apply" action. The dashboard query is multi-CTE multi-join SQL fanning to THREE repository queries server-side (`DataQualityRunsServiceImpl.java:36-39`).

  **What the operator sees today**: typing into a filter shows a "results update as you type" UX (good); typing into the autocomplete fires a burst of API calls (less good); selecting 4 chips fires 4 full dashboard fetches (3 wasted).

  **No test pins either**. A regression that ACCIDENTALLY adds a debounce delays UX (could be detected as a UX regression); a regression that REMOVES an existing debounce silently widens the burst.

  **Test gap shape**: integration test using fake timers + spy on the relevant query functions. Two assertions: (a) typing 10 characters into a filter autocomplete fires the list-API ≤ 10 times (PINS the current state) — pair with a TODO comment requesting a debounce. (b) selecting N chips in succession fires the dashboard fetch N times (PINS the current state) — pair with TODO requesting an Apply-button or debounce.
