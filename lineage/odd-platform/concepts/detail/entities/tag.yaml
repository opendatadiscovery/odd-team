name: Tag
canonical_in_docs: true
canonical_candidate: false
description: 'Global, cross-tenant directory entry for taxonomic labelling of data
  entities. Schema: (id, name UNIQUE WHERE NOT deleted, important boolean, deleted_at).
  Created either via the dedicated POST /api/tags (TAG_CREATE-gated, MANAGEMENT scope)
  OR side-door via the upsertTags flow (DATA_ENTITY_TAGS_UPDATE on any single entity
  is sufficient; spec-documented at openapi.yaml:1174).'
nodes:
- odd-platform java DataEntityController controller-method:createDataEntityTagsRelations
contributing_files:
- odd-platform__java__DataEntityController__controller-method__createDataEntityTagsRelations.md
evidence:
- createDataEntityTagsRelations.md:concepts.entities[Tag, TagsFormData, TagPojo, TagToDataEntityPojo,
  TagDto]
- createDataEntityTagsRelations.md:invariants[side-effecting auto-creation; important
  = false; replace-all internal only]
axes_present:
- controllers
- openapi_paths
security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  authorization_consistency:
    verdict: INCONSISTENT
    detail: 'Scope asymmetry: TAG_CREATE is MANAGEMENT-scoped (unconditional), DATA_ENTITY_TAGS_UPDATE
      is DATA_ENTITY-scoped (grantable via ''is: dataEntity:owner''). The latter can
      mint Tag rows in the global directory without holding TAG_CREATE.'
  owner_scoping:
    verdict: BYPASSES
    detail: Tag directory is global; no per-tenant/per-namespace scoping at the Tag
      layer
  strengths:
  - Auto-create IS spec-documented at openapi.yaml:1174 — intentional UX trade-off
  - important = false hardcoded for auto-created tags — admin-curated 'important'
    distinction preserved
  - External tag relations PROTECTED from this endpoint (filter !external in TagServiceImpl.java:100-103)
  weaknesses:
  - Tag side-door past TAG_CREATE via DATA_ENTITY_TAGS_UPDATE — per-data-entity-owner
    can globally pollute the Tag directory (MEDIUM)
  - Cross-tenant Tag pollution — no per-tag ACL; mint a tag for entity X in tenant
    A, it appears in tenant B's popular-tags surface (MEDIUM)
  - Unique-index race on concurrent novel-tag creation surfaces as UniqueConstraintException;
    UI must retry-on-conflict
  - Soft-deleted tag recreation produces NEW row (orphans history; data-entity relations
    stay frozen at old id)
  - No length/character-set/whitespace validation on tag names (homoglyph/typo pollution
    accumulates)
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - No cap on tag_name_list size — abusive caller can submit million-string list (Postgres
    parameter limit ~32K breaks at driver layer)
  - Tag directory grows monotonically with tag-related activity; popular-tags query
    latency degrades over years
