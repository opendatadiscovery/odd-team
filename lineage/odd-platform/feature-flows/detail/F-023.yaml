cross_pillar_relationships:
- pillar: P-10
  kind: feeds_from
  via: |-
    The Directory surfaces what F-008 (Batch Ingestion) producers
    populate — every registered Datasource, every ingested DataEntity,
    every ODDRN-derived property. This is the READ counterpart of the
    P-10 producer-side ingestion surface; the relationship is
    feeds_from at the catalog-content level. Directory is NOT a
    contributing_node of F-008 (no chain extension); it is the read
    consumer.
- pillar: P-01
  kind: siblings
  via: |-
    Sibling sub-feature within Data Discovery alongside F-001/F-003
    (Popular Ranking), F-004 (Description Editing), F-012 (DEG
    Membership), F-013 (Custom Metadata Field), F-017 (Search Filter
    Facets), F-018 (Manual Object Tagging). Directory is the
    HIERARCHY-driven browse surface — distinct from F-017 (Search)
    which is QUERY-driven and from F-001/F-003 (Popular) which is
    RANKING-driven. The doc-product framing is explicit at
    `documentation/docs/data-discovery.md:7` and at the live page
    'Where Search is query-driven … the Directory is hierarchy-driven'.
- pillar: P-09
  kind: shares_data_with
  via: |-
    All 4 endpoints fall to the global `.authenticated()` rule
    (DirectoryController has no `@PreAuthorize`; no
    `SecurityConstants.SECURITY_RULES` entry for `/api/directory*`).
    The read-collaborative posture (REFACTOR-024 family, ADR-CANDIDATE-003)
    applies; under `auth.type=DISABLED` (REFACTOR-185 family) all 4
    endpoints become anonymously reachable. Directory adds a 5TH+
    enumeration vector to the cross-owner read posture family —
    DISTINCT in dimension from alerts (F-007 / F-014), search
    (F-017), per-entity reads (F-001 family), lineage (F-005 / F-016)
    by being the DATASOURCE-INVENTORY enumeration vector (every
    registered Datasource's ODDRN + ODDRN-derived host / database /
    port / cluster / account / warehouse / topic).
- pillar: P-05
  kind: complements
  via: |-
    REFACTOR-203 is the GRAPH-shaped enumeration vector (lineage
    edges leak pipeline topology); Directory is the FLAT-LIST
    enumeration sibling — no edges, but a fully-walkable inventory
    of every Datasource + ODDRN + host + database + prefix + per-type
    entity counts. The two together exhaust the catalog-shape
    enumeration surface: graph-via-lineage (REFACTOR-203) +
    flat-via-directory (this feature). An authenticated attacker
    enumerates BOTH the topology AND the inventory roster.
