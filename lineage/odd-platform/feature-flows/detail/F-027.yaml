    IAM roles, MUST use static keys). Three caveat-defaulted
    parameters with NO in-code fail-fast / NO in-code comment / NO
    `attachment.remote.*` knob; only `.region(...)` has a live-doc
    admonition. NEW drift facet for F-027:
    `minio_builder_three_caveat_defaulted_params_region_httpclient_credentialsprovider_only_region_doc_mitigated`.

    (4) **NO FAIL-FAST AT BOOT — DEFERRED-FAILURE PATTERN PRIMARY
    SOURCE (HIGH severity — LSN-001 CLASS)** —
    MinioConfig.java:9-25 has NO `@PostConstruct`, NO boot-time
    S3 reachability call, NO bucket-existence check; the three
    `@Value` fields fail-fast only if blank (Spring placeholder
    resolution). The platform boots "green" under REMOTE mode with
    unreachable endpoint, wrong credentials, missing bucket, OR
    wrong region; first upload reveals the issue. The only
