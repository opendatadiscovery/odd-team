- id: H-002
  hypothesis: "When an operator has wired up an integration (e.g. registered a Snowflake datasource), the wizard card for that integration shows an 'Integrated' badge so they can tell at a glance which integrations are done versus pending."
  derivation: "The OpenAPI contract declares installed:boolean REQUIRED on every IntegrationPreview, and the UI gates an 'Integrated' badge on {installed && (...)} at IntegrationPreviewItem.tsx:44-51 — the field name + UI affordance promise an install-state indicator."
  seed_source: response-shape + ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      `IntegrationMapper.java:27` and `:30` hardcode `@Mapping(target = "installed", constant =
      "false")` on BOTH the full Integration and the preview shape. No code path anywhere in
      `odd-platform-api/src/main` detects whether an integration is actually wired into the
      platform (grep `installed` returns ONLY the two mapper constant lines — no
      DataSourceRepository lookup, no comparison against registered collectors). The field is
      structurally dead: REQUIRED-by-contract and always-false. The UI badge code path
      `{installed && (...)}` therefore NEVER executes for any integration.
    evidence:
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: stress_findings.name_behavior_pairs[installed-constant]
        cite: "IntegrationMapper.java:27, 30 + components.yaml:64-70 + IntegrationPreviewItem.tsx:44-51"
        note: "DRIFT_NAME_VS_BEHAVIOR — installed is a REQUIRED-and-meaningless contract field."
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: bugs_limitations_corner_cases[installed-constant]
        cite: "grep installed in odd-platform-api/src/main returns only the two mapper lines"
        note: "No install-detection code exists anywhere."
    operator_visible_failure: |
      The 'Integrated' badge — a checkmark icon with a translated label — never appears on any
      integration card, for any deployment, regardless of how many datasources the operator has
      actually connected. The operator cannot distinguish 'wizard exists, integration done' from
      'wizard exists, integration pending' anywhere in the product; the entire visual affordance
      and its i18n key are dead weight. Worse, an operator reading the API contract is actively
      misled: `installed: boolean` is documented as a meaningful REQUIRED field on the
      api-reference page with no warning that it is always false, so a third-party SDK consumer
      who filters integrations by `installed == true` will always get an empty set and may
      conclude (wrongly) that nothing is integrated.
