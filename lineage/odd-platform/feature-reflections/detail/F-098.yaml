- id: H-010
  hypothesis: |-
    The platform does not let an unauthenticated caller use `/api/slack/events`
    as a fingerprinting oracle to confirm "this host is an ODD platform."
  derivation: |-
    A product owner expects an unauthenticated endpoint not to leak the
    platform's identity to scanners. The URL-verification echo is a candidate
    oracle.
  seed_source: negative-space + the CHALLENGE response-shape
  validation:
    verdict: partial
    actual_behavior: |-
      The URL-verification challenge echo (H-002) is REQUIRED by Slack's protocol
      and cannot be removed — any caller can POST `{type:url_verification,
      challenge:X}` and receive `{challenge:X}` with 200, confirming an
      `/api/slack/events` endpoint is alive and echoes arbitrary content
      (EventApiController:security.data_exposure[0]). So the fingerprinting
      oracle genuinely exists and is partly unavoidable. BUT it would be
      substantially mitigated by signature verification (H-001): with a
      signing-secret check, the echo would only fire for correctly-signed
      challenges, closing the oracle to unauthenticated scanners. The hypothesis
      is partly honoured (the platform behaves per Slack's contract) and partly
      violated (the absence of signature verification leaves the oracle open to
      anyone, not just Slack).
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: security.data_exposure[0]
        cite: "EventApiController.java:44-56 (challenge echo) + bugs_limitations_corner_cases[0] (no signature gate)"
        note: "echo is protocol-mandated; the gap is that it is ungated"
    operator_visible_failure: |-
      A network scanner can distinguish ODD installations from other HTTP hosts
      at scale by POSTing a url_verification probe and matching the echoed
      challenge — useful reconnaissance for an attacker selecting targets,
      especially given the forge-able write path behind the same endpoint
      (H-001). Mitigation is the same signing-secret check that fixes H-001:
      Slack mandates validating the signature BEFORE responding to the
      url_verification challenge.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

