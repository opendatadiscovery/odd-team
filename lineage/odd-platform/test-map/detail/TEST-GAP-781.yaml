behaviour: |-
  **HIGH — SessionConfiguration's IN_MEMORY default (the shipped value `session.provider: IN_MEMORY` per application.yml:30) breaks the `/ingestion/datasources` collector-identity bridge in multi-instance deployments WITHOUT sticky sessions. The platform does NOT fail-fast or warn on this misconfiguration class.** This is the THIRD-tier primary source (after the controller + repository tiers — REFACTOR-419) of the cluster-fragility finding.

  **Concretely**:
  1. `IngestionDataSourceFilter.java:36-38` writes `SessionConstants.COLLECTOR_ID_SESSION_KEY` into the WebSession backed by whichever provider SessionConfiguration wires.
  2. `IngestionController.createDataSource` at IngestionController.java:50-58 reads the same key back.
  3. Under `session.provider=IN_MEMORY` (the shipped default), the WebSession lives in the JVM's `ConcurrentHashMap` — per-process, NOT replicated across instances.
  4. A load balancer WITHOUT sticky sessions routes the second request (the controller's read) to a DIFFERENT instance than the first (the filter's write).
  5. The second instance sees a NULL `collectorId` session attribute and throws `IllegalStateException("Collector id is null")` at line 54 — propagating as HTTP 500.
  6. The collector retries → may hit a third instance → same failure → exponential backoff → operator-visible collector outage.

  **The ADR is implicit**: this sidecar's `related_implicit_adrs` block names ADR-CANDIDATE-141 (Collector identity via WebSession attribute, not Spring Security Principal). That ADR's THIRD facet is rooted at SessionConfiguration.java:46-49 — the IN_MEMORY default. Together with REFACTOR-419 (cluster-fragility, HIGH severity, batch P + strengthen-batch-R), the cluster-fragility surface is the canonical operator-cliff scenario.

  **Compound risk** (cross-batch composition):
  - This is the SAME class as LSN-001 (LOCAL ephemeral attachment storage default — silent insecure default) and LSN-002 (us-east-1 region default — silent operational failure). All three are "shipped-as-default" choices with no boot-time warning when the operator's deployment-shape contradicts the default's assumption.
  - The `/ingestion/datasources` path is also UNAUTHENTICATED (whitelisted in `SecurityConstants.WHITELIST_PATHS:95-96` — verified at primary source by the SessionConfiguration sidecar's `dependencies_semantic.coupling-with-other-config-classes` block + the LoginForm sidecar's permit-all paths block). The combination means: the collector's identity-carrying mechanism is BOTH (a) provider-dependent (cluster-fragile) AND (b) unauthenticated (no SecurityContext fallback).

  **STRENGTHENS REFACTOR-419 with the CONFIG-CLASS PRIMARY SOURCE.** Prior batches surfaced this from the filter + controller tiers; this sidecar pins the shipped DEFAULT that drives the fragility (application.yml:30 `provider: IN_MEMORY`). The three-tier triangulation (controller + repository + config-class) is now complete.

  **Test gap shape**: integration test running the full flow on a SIMULATED multi-instance deployment (two `@SpringBootTest` ApplicationContexts in the same JVM sharing a load-balancer-style request router). Confirm:
  - Under `session.provider=IN_MEMORY` + non-sticky routing: `/ingestion/datasources` 2nd request → HTTP 500.
  - Under `session.provider=INTERNAL_POSTGRESQL` + non-sticky routing: succeeds (cluster-safe).
  - Under `session.provider=REDIS` + non-sticky routing: succeeds (cluster-safe).

  The test PINS the cluster-fragility shape AND documents the cluster-safe providers as alternatives.
