description: |-
  STRENGTHENED INVARIANT, batch 2026-05-20W — extends the existing
  read-collaborative-cross-owner-enumeration master invariant
  (which was at 24 corroborating surfaces after batch Q) by adding
  FIVE NEW NO-SECURITY-RULE GET endpoints from the Management-tier
  controller class-level batch-W sidecars:

    Surface 25 — GET /api/datasources (DataSourceController.getDataSourceList,
    batch W): NOT in SecurityConstants.SECURITY_RULES (only
    POST/PUT/DELETE on /api/datasources* are at lines 116-126);
    falls through to AuthorizationCustomizer.java:29-30
    `pathMatchers('/**').authenticated()`. ANY authenticated user
    can list all datasources in the catalog regardless of role/policy.
    The Management → Datasources tab affordance.

    Surface 26 — GET /api/collectors (CollectorController.getCollectorList,
    batch W): NO SecurityRule for /api/collectors GET; same
    authentication-only gate. Any authenticated user can list every
    collector + masked-token last-6 chars + namespace + descriptions.
    The 26th corroborating surface; reveals Collector inventory to
    every authenticated user.

    Surface 27 — GET /api/namespaces (NamespaceController.getNamespaceList,
    batch W): NO SecurityRule for /api/namespaces GET. Any
    authenticated user can list every namespace + count + name.
    The 27th corroborating surface.

    Surface 28 — GET /api/tags (TagController.getPopularTagList,
    batch W): NO SecurityRule for /api/tags GET. Any authenticated
    user can enumerate the entire global tag directory regardless
    of `TAG_*` permissions. Compounds with the side-door write
    paths (see getpopulartaglist-open-read-plus-side-door-compose-to-write-read-directory-bypass
    THIS BATCH).

    Surface 29 — DatasetController's 4 GET endpoints
    (getDataSetStructureByVersionId / getDataSetStructureLatest /
    getDataSetStructureDiff / getDataSetRelationships) — NO
    SecurityRule entry for any of /api/datasets/{data_entity_id}/structure*
    or /api/datasets/{data_entity_id}/relationships paths (verified
    by reading SecurityConstants.java:98-355 end-to-end — only
    /api/datasets/{data_entity_id}/dataqatests/{dataqa_test_id}/severity
    PUT line 244-246 is in the list). The 29th corroborating surface.
    Note: this surface adds 4 ENDPOINTS but expands to the F-004
    read-side cross-owner surface — every dataset's verbatim
    internal_description fields are readable by every authenticated
    user.

  THE FULL ENUMERATION — 29 corroborating surfaces (was 24 at batch Q):

    Original 24 surfaces from previous batches (per master invariant):
    (a-x covered batches D / F / H / J / L / M / Q).

    Batch W adds 5 new surfaces:
    (y) DataSourceController.getDataSourceList
    (z) CollectorController.getCollectorList
    (aa) NamespaceController.getNamespaceList
    (bb) TagController.getPopularTagList
    (cc) DatasetController's 4 structure + relationships endpoints

  THE MANAGEMENT-TIER PATTERN — what batch W's discovery reveals:

    Batch W's 5 new surfaces are ALL Management-tier list endpoints.
    The architectural shape:
      - Management writes (POST/PUT/DELETE) are explicitly gated by
        Management-tier permissions in SECURITY_RULES.
      - Management reads (GET) are NOT gated; the read-collaborative
        posture says every authenticated user enumerates.

    This is a UNIFORM pattern across the 5 Management tabs covered
    THIS BATCH:
      - Datasources tab → DataSource list (open-read)
      - Collectors tab → Collector list (open-read; with masked
        tokens visible — see collector-plaintext-token-chain master)
      - Namespaces tab → Namespace list (open-read)
      - Tags tab → Tag list (open-read; with compound side-door
        write bypass — see THIS BATCH compound invariant)

    AND the same pattern extends to per-data-entity read endpoints
    (DatasetController's structure variants).

    The pattern's CONSEQUENCE: the read-collaborative posture is
    NOT just for catalog browsing — it ALSO applies to the
    Management-tier admin surfaces. An operator wiring an RBAC
    policy that 'restricts user X to view-only on the Datasources
    tab' achieves NOTHING — the user can already view all
    datasources without holding any DATA_SOURCE_* permission.

    The doc-side framing is consistently 'mutating Management
    requires Management-tier permissions'. The implementation
    extends this to: 'reading Management requires authentication'
    — NOT Management-tier permissions. The two framings differ
    materially.

  THE 5-CONTROLLER DOC-GAP COMPOUND (cross-link to THIS BATCH
  sibling):

    The 5 controllers WITH the Management-tier read open posture
    are EXACTLY the 5 controllers missing API-reference sub-pages
    (per the datasetcontroller-undocumented-dataset-openapi-tag-batch-w
    sibling invariant). The compound: the read-open posture is
    invisible to operators because (a) the controllers' endpoints
    are not documented on /developer-guides/api-reference, AND
    (b) the controllers' read posture is not described on
    /features/management or /features/data-discovery / etc.
    Operators MUST read the source code to discover both.

  SEVERITY MEDIUM — the read-collaborative posture is the
  platform's documented intent (ADR-CANDIDATE-003); the SPECIFIC
  consequences at the 5 Management-tier surfaces are NOT documented;
  operators wiring RBAC policies for Management-tier read scoping
  cannot discover the posture from the docs.

