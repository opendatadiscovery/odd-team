name: Lombok @Data toString() sensitive-field leak
canonical_in_docs: false
canonical_candidate: true
description: 'Cross-cutting code-hygiene invariant: ODD''s @ConfigurationProperties
  POJOs that carry credentials / secrets uniformly use Lombok `@Data` (which auto-generates
  `toString()` covering ALL fields) WITHOUT applying `@ToString.Exclude` / `@JsonIgnore`
  to the sensitive fields. 4-sidecar triangulated in batch 2026-05-12D: (a) NotificationsProperties
  (batch C — `sender / password` hint); (b) EmailSenderProperties (batch D — `private
  String password` + `@Data`, no `@ToString.Exclude`); (c) ODDLDAPProperties (batch
  D — `private String password` + `@Data`, no `@ToString.Exclude`); (d) ODDOAuth2Properties
  (batch D — `private String clientSecret` on nested `OAuth2Provider` + `@Data` on
  both outer and nested classes, no `@ToString.Exclude`). The Spring Boot 3.4.10 default
  for `/actuator/env` IS sanitised (`management.endpoint.env.show-values: NEVER` is
  the framework default; `keys-to-sanitize` masks `password|secret|token|key` patterns)
  — so the actuator surface is SAFE. The DURABLE leak surface is `toString()` invocation
  in: (i) explicit `log.*("props = {}", properties)` (zero current call sites in the
  repo, but the @Data boundary is fragile against future additions); (ii) Spring Boot
  Actuator''s `/actuator/configprops` text rendering for non-default exposure configurations;
  (iii) accidental serialiser registration (a future Jackson `ObjectMapper` configured
  WITHOUT credential-suffix sanitisation); (iv) IDE / debugger / heap-dump inspection
  feeding into a log capture. Recommended cross-cutting remediation: add `@ToString.Exclude`
  to every sensitive field across the four POJOs OR (cleaner) wrap credentials in
  a sealed `Credential` type that overrides `toString` with masking. The CORRECT actuator-env
  claim is: ''Spring Boot defaults DO sanitise /actuator/env keys named password/secret/token
  — the durable leak risk is Lombok-toString, not actuator-env.'' Earlier batch-C
  narratives that said ''auth.ldap.password leaks via /actuator/env'' should be read
  as ''auth.ldap.password leaks via Lombok-toString IF logged, AND actuator-env is
  safe by Spring''s default sanitiser.'' This is the ONE invariant that should be
  cited whenever a sidecar surfaces a credential-field exposure claim. **STRENGTHENED
  batch ZK (2026-05-26)** — ODDLDAPProperties REV-2 (file-analyser/0.4.0) re-enriches
  the batch-D anchor with Stress Protocol Category F request-input analysis. The
  `password` field is now formally classified as TRANSLATES_SILENTLY
  (DRIFT_INPUT_NAME_VS_IMPLEMENTATION) with explicit operator-visible-consequences
  enumeration: (a) log.info("ldap config = {}", ldapProperties) puts password in
  INFO-level logs that are routinely shipped to log aggregators; (b) custom
  @RestControllerAdvice or diagnostic endpoint serialising the bean leaks password;
  (c) actuator env DOES mask under Spring Boot 3.4.10 default (CORRECT — restates
  the invariant''s framing); (d) future maintainer adding keys-to-sanitize config
  or upgrading Spring Boot lifts the only protection. NEW probe P-186 emitted to
  empirically pin the dual surface (env-protected, log-unprotected). No change to
  the 4-sidecar triangulation count; batch ZK supersedes the batch-D rev-1 anchor.'
