notes: |-
  This operation is the FACET-COUNTS sibling of the search-creation
  operation (Search Catalog faceted session-as-server-state). The two
  operations share the same search_facets session row and the same
  cross-owner-enumeration posture; the facet-counts surface is the
  CATALOG-CARDINALITY discovery vector (REFACTOR-024 family extension),
  the search-creation operation is the SESSION-CREATION primitive.

  Operator-relevant compounding from this operation:
    (a) per-keystroke hot path on the Catalog tab — dozens of facet
        queries per user-minute;
    (b) each getSearchFacetList = 4 DB calls (3 aggregators + the
        UPDATE-RETURNING side-effect);
    (c) each getFiltersForFacet = 2 DB calls (UPDATE-RETURNING + aggregator);
    (d) no caching at any layer; no Cache-Control, no ETag;
    (e) every read is a write (last_accessed_at UPDATE) — under concurrent
        UI tabs the row-lock contention can serialise writes;
    (f) the tsquery-operator-injection vector reaches all FIVE aggregators —
        a poisoned session_facets.query value permanently breaks the session.

  Cross-references:
    - Search Catalog (faceted, session-as-server-state) — the parent
      operation that creates the session row this operation consumes.
    - Search Session — the entity that this operation is the
      cardinality-aggregation surface for.
    - Cross-owner facet-count enumeration via drill-down — the security
      invariant this operation embodies.
    - tsquery operator-injection via persisted state — the DoS class this
      operation amplifies via FIVE aggregator invocations.
    - Search-facets bearer-token-shaped — no user binding — the
      session-state invariant this operation depends on.
    - Read-collaborative cross-owner enumeration — the broader posture;
      this operation is one of the catalog-wide read surfaces.
    - Pagination parameters declared but unconstrained — the
      cross-cutting pagination invariant this operation is one site for.
