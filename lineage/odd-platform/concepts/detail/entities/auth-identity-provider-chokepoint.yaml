name: AuthIdentityProvider (per-request principal resolution chokepoint)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW CONCEPT, batch 2026-05-19K** — the load-bearing per-request identity
  resolution service for ODD Platform's RBAC + owner-scoping model.
  `AuthIdentityProviderImpl` (the sole implementation of the `AuthIdentityProvider`
  interface — `auth/AuthIdentityProvider.java:8-14`) exposes three parameter-less
  reactive Monos: `getCurrentUser()` (returns UserDto(username, provider)),
  `getCurrentUserProviderRole()` (returns UserProviderRole.ADMIN|USER), and
  `fetchAssociatedOwner()` (returns OwnerPojo by resolving the
  user_owner_mapping table). Every callsite invokes a Mono with NO Authentication
  / Principal / ServerWebExchange parameter — the principal is read inside the
  service via `ReactiveSecurityContextHolder.getContext()` (lines 25, 39). This
  is the ARCHITECTURAL ANCHOR for ADR-CANDIDATE-015 (owner-scoped routes via
  reactor Context). The service is called by 15 internal classes: 9 service
  classes (SearchServiceImpl, AlertServiceImpl, DataEntityServiceImpl,
  DataEntityRelationsServiceImpl, ActivityServiceImpl,
  DataCollaborationServiceImpl, OwnerAssociationRequestServiceImpl,
  IdentityServiceImpl, RoleServiceImpl) + TokenGeneratorImpl + 4
  permission/extractor classes (DataEntityPermissionExtractor,
  TermPermissionExtractor, QueryExamplePermissionExtractor,
  ManagementPermissionExtractor) + PolicyService + ActivityServiceImpl. **ALL
  owner-scoped business logic flows through these three Monos.** The service is
  stateless / no-caching by design — every invocation goes through
  ReactiveSecurityContextHolder.getContext() AND (for fetchAssociatedOwner) a DB
  round-trip via ReactiveUserOwnerMappingRepository#getAssociatedOwner. The
  service is the POSITIVE side of the anchor-set defence-in-depth pattern (per
  batch-G implicit_adrs[6]): every owner-scoped read path that calls
  fetchAssociatedOwner feeds the resolved owner-id into a downstream SQL
  `WHERE OWNERSHIP.OWNER_ID = ?` JOIN; paths that DO NOT call
  fetchAssociatedOwner (LineageServiceImpl per batch I, ReactiveLineageRepositoryImpl
  per batch H) are the NEGATIVE case producing unmitigated cross-owner reads.
  **OAuth2 is the ONLY auth flow that produces a non-null `provider` string** —
  LOGIN_FORM and LDAP and S2S all produce UserDto(username, null) via the
  else-branch at line 32. The single-Mono shape (not Flux) reflects the
  doc-side invariant "one user can be associated only with one owner and vice
  versa" (live user-owner-association page WebFetched 2026-05-19 status 200).
  Schema enforcement is application-side via the clear-active-then-insert
  pattern (createRelation/deleteActiveRelationByOwner at
  ReactiveUserOwnerMappingRepositoryImpl.java:65-74) — NOT a partial unique
  index. vocabulary_status: codebase-anchored, doc-side-silently-covered (live
  user-owner-association page describes the binding contract but does NOT name
  the implementation site, the (username, provider) compound key, the
  cross-mode bleed risk, or the S2S username='ADMIN' literal collision).
nodes:
- odd-platform java service service:AuthIdentityProviderImpl
- odd-platform java DataEntityController controller-method:getMyObjects
