behaviour: 'DEG propagation — no test verifies (a) `propagate: true` on a Data Entity
  Group cascades ownership to every child via `createOrUpdate(pojos).onConflictOnConstraint(...).doUpdate.set(TITLE_ID,
  excluded)`, (b) `propagate: false` leaves children untouched, (c) propagation collisions
  re-title existing child ownership rows (RE-TITLE not skip). STRENGTHENED batch H
  — the repository sidecar confirms `createOrUpdate` is unconditionally title-overwriting:
  `.onConflictOnConstraint(OWNERSHIP_DATA_ENTITY_ID_OWNER_ID_KEY).doUpdate().set(OWNERSHIP.TITLE_ID,
  DSL.excluded(OWNERSHIP.TITLE_ID))` (lines 77-80). There is NO parallel `createIgnore`
  or `createIfMissing` method — every batch caller MUST accept the title-overwriting
  semantic. A regression dropping `.doUpdate()` (turning it into `onConflictDoNothing()`)
  would silently break DEG ownership propagation.'
