name: EXCLUDE_FROM_SEARCH is broadly applied but NOT to /popular
canonical_in_docs: false
canonical_candidate: true
description: 'data_entity.exclude_from_search is the platform''s standard mechanism
  to hide internal/staging entities from list-shaped surfaces. Applied at: ReactiveSearchEntrypointRepositoryImpl.java:91,
  117, 149, 181, 555; ReactiveSearchFacetRepositoryImpl.java:167, 461, 575; JooqFTSHelper.java:149;
  ReactiveDataEntityRepositoryImpl.java:448 (countByState) + 974 (getDataEntityDefaultConditions).
  Total: 9 application sites. EXCEPT: listPopular''s cteDataEntitySelect (ReactiveDataEntityRepositoryImpl.java:909-939)
  does NOT apply EXCLUDE_FROM_SEARCH — internal/staging entities marked hidden-from-search
  ARE surfaced on the platform''s home page if they have a high view_count. Inconsistency:
  Popular is the SOLE list-shape that ignores this widely-respected flag. **Batch
  H — SQL PRIMARY-SOURCE CONFIRMATION + EXTENDS the inconsistency to 8 list-shape
  methods**: ReactiveDataEntityRepositoryImpl batch-H sidecar confirms cteDataEntitySelect
  (lines 909-939) is the CTE-builder helper consumed by 9 list-shape methods (`listPopular`,
  `listByOwner`, `listByTerm`, `getDEGExperimentRuns`, `getDimensions(id|oddrns|ids)`,
  `getDetails(id)`, `getQuerySuggestions`). All 9 of these OMIT EXCLUDE_FROM_SEARCH;
  only `findByState` re-adds the predicate via `JooqFTSHelper.resultFacetStateConditions`
  line 149 to satisfy facet-search semantics. The inconsistency is therefore not unique
  to Popular — it''s the cteDataEntitySelect helper itself that omits the predicate,
  and 8 list-shape surfaces inherit the omission. By contrast `getDataEntityDefaultConditions`
  (lines 970-976) APPLIES the predicate — used by countByState, countByDatasourceAndType,
  getDataSourceEntityTypeIds, getCountByDataSources, getDataEntityDomainsInfo, getDataEntityWithOwnership.
  Entities flagged exclude_from_search=true are therefore COUNTED OUT of statistics
  but COUNTED IN of list/detail surfaces. The cteDataEntitySelect helper is the single
  fix-site that closes 8 inconsistencies in one edit.'
