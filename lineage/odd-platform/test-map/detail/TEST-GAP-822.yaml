proposed_action: |-
  Add `PostDataSetStatsListReplayRemovesAbsentTagsSilentDestructionRegressionPinTest`. Testcontainers integration test:

  1. **Setup**: dataset D-A with field F-1. Empty tag namespace at start.
  2. **Step 1**: POST stats with `tags: [{name: "PRODUCTION"}, {name: "PII"}, {name: "CRITICAL"}]` → assert 201; assert `SELECT count(*) FROM tag_to_dataset_field WHERE dataset_field_id = F-1.id AND origin = 'EXTERNAL_STATISTICS'` returns 3.
  3. **Step 2** (UI side): manually attach `tags: [{name: "MANUAL-INTERNAL"}]` (via the Tags UI API) → assert that relation has `origin = 'INTERNAL'`. Total tag relations on F-1: 4.
  4. **Step 3**: re-POST stats with `tags: [{name: "PRODUCTION"}]` only → assert 201.
  5. **Assert silent destruction**:
     - `SELECT count(*) FROM tag_to_dataset_field WHERE ... AND origin = 'EXTERNAL_STATISTICS'` returns 1 (only PRODUCTION).
     - The PII and CRITICAL relations are GONE.
     - The MANUAL-INTERNAL relation (origin INTERNAL) is INTACT — pins the origin-filter asymmetry.
     - `SELECT count(*) FROM activity_event WHERE ...` returns 0 — no audit row.
     - No application log line from `DatasetFieldServiceImpl` mentions the removal.

  Pair with REFACTOR-NNN (warn-or-event-on-removal during replay) and DOC-GAP-NNN.

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP names the stats-replay silent-destruction class. STRENGTHENS F-008's `silent_destruction_replace_not_merge` drift facet by adding the stats-path variant. STRENGTHENS TEST-GAP-820 (tag creation side-channel) — together the two pin the full create + silent-destroy lifecycle.
