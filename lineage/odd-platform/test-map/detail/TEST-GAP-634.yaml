proposed_action: |-
  Add `ToolbarTabs.test.tsx` with two test methods: (a) `renders_all_nine_navigation_tabs_for_authenticated_user_regardless_of_permissions` — mount with `usePermissions().hasAccessTo` stub returning false for ALL Management/Alerts/Activity permissions; assert all 9 tab elements are present (pinning current behaviour); (b) `tab_render_does_not_consult_permission_context` — assert no `usePermissions` hook subscription is established by ToolbarTabs (read via React-Testing-Library + dependency-trace). Test (a) freezes the contract; test (b) provides a regression-pin for "if we ever add tab-level gating, the dep must be intentional and visible". Add a third test: (c) `under_disabled_mode_anonymous_caller_sees_management_tab` — set redux store to DISABLED-mode synthetic identity; assert all 9 tabs present including Management; pin the operator-visible information-leak observed in batch-ZJ ToolbarTabs sidecar.
