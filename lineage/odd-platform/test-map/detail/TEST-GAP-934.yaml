proposed_action: |-
  Author RoleControllerAuthMatrixTest as a @SpringBootTest parameterised over
  (auth.type ∈ {DISABLED, LOGIN_FORM, OAUTH2, LDAP}) × (caller ∈ {anonymous,
  authenticated-no-permission, authenticated-with-permission, s2s-api-key}) ×
  (endpoint ∈ {POST, GET, PUT, DELETE} /api/roles). 64-cell matrix; assert the
  expected response (200/204 success / 302-401 unauth / 403 forbidden / 200
  s2s-admin-bypass) per cell. Tests serve as load-bearing regression pins for
  REFACTOR-185 (DISABLED cells) AND REFACTOR-108 (s2s cells). The matrix is
  the canonical implementation example for SecurityConstants.SECURITY_RULES
  gate coverage on RBAC mutation endpoints.
