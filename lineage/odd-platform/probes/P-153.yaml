expected_outcome: |
  Stress questions surfaced by Category D (authorization) on
  DatasetFieldController: two coupled permission-wiring bugs at
  SecurityConstants.java:295-303.

  (a) /api/datasetfields/{id}/terms POST is wired in code to
      DATA_ENTITY_ADD_TERM (SecurityConstants.java:297-299) but the
      published permission catalog at
      https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions
      declares DATASET_FIELD_ADD_TERM as the gate.

  (b) /api/alerts/{alert_id}/status PUT is wired to DATASET_FIELD_ADD_TERM
      (SecurityConstants.java:295-296) — copy-paste leak from the
      dataset-field auth block immediately preceding it; the published
      permission catalog declares DATA_ENTITY_ALERT_RESOLVE as the
      natural gate for alert state mutation.

  Hypothesis: a user assigned exactly ONE of (DATA_ENTITY_ADD_TERM,
  DATASET_FIELD_ADD_TERM) experiences a permission matrix that contradicts
  the documented model. Specifically:

   - User holding DATA_ENTITY_ADD_TERM but NOT DATASET_FIELD_ADD_TERM
     CAN add a term to a dataset field (because code wires the endpoint
     to DATA_ENTITY_ADD_TERM) — but the docs say they cannot.
   - User holding DATASET_FIELD_ADD_TERM but NOT DATA_ENTITY_ADD_TERM
     CANNOT add a term to a dataset field — but the docs say they can.
   - User holding ONLY DATASET_FIELD_ADD_TERM (and no ALERT permission)
     CAN resolve alerts via PUT /api/alerts/{id}/status — a permission
     the docs do not connect to alert resolution.

  This probe asserts each of those mismatches at the HTTP boundary,
  pinning the bugs from the operator's perspective rather than from
  inspection of SecurityConstants.java alone.
