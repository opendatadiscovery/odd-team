  side_effect_class: page-render (4 read endpoints) + db-write (severity upsert)
  description: |-
    READS: 200 OK with JSON DataEntityList (per-dataset DQ tests) +
    JSON DataSetTestReport (count-per-status aggregate) + image/png
    classpath PNG byte-array (SLA badge — the BI-embeddable trust
    signal) + JSON DataSetSLAReport (severity weights + colour +
    slaRef). WRITES: 204 (or similar) after `onDuplicateKeyUpdate`
    on `data_quality_test_severity` with NO Activity Feed row, NO
    `lastModifiedBy`, NO version increment.
  evidence: |-
    DataQualityController.java:25-68 (the 5 method bodies) +
    openapi.yaml:1880-1971 (the 5 operationIds and content-types —
    `image/png` declared on `getSLA` at lines 1888-1894) +
    ReactiveDataQualityRepositoryImpl.java:90-101 (the upsert with
    no audit emission).
  cardinality_per_call: |-
    READ getDataEntityDataQATests: 1 query for ODDRNs + 2 parallel
    sub-queries (severities + dimensions) zipped via Mono.zip; no
    pagination on the test list. READ getDatasetTestReport: 1 SQL
    GROUP BY at most 6 rows. READ getSLA / getSLAReport: 1 SQL +
    in-memory Counter aggregation. WRITE: 1 upsert + 0 audit rows.
