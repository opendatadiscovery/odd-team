behaviour: |-
  **MEDIUM — the per-category result rows on `/data-quality` are sorted client-side by `data.testResults.toSorted((a,b) => a.category.localeCompare(b.category))` (`DataQualityContent.tsx:75-77`) — alphabetical by category label, NOT by severity / failure count / backend order. The backend imposes NO ORDER BY on `testResults` (`DataQualityRunsServiceImpl.java:36-42`). No test pins the alphabetical ordering, the locale-stability, or the override of backend order.**

  **What the operator sees vs the alternative orderings**:
  - Today: rows render in alphabetical category-name order (Assertion Tests, Column Values Anomalies, Freshness Anomalies, Schema Changes, Unknown category, Volume Anomalies). The operator scrolls all 6 to find "which is failing worst".
  - Alternative (severity-first): would surface the WORST category at the top — the actual operational question for a DQ engineer triaging catalog health.
  - The doc-side silence (live `dashboard.md` lists categories in alphabetical order but does not STATE the ordering is alphabetical — DataQualityContent.md:docs_link_semantic.doc_drift_findings.[2]) means an operator cannot tell from reading whether the order is meaningful or accidental.

  **Locale instability sub-finding** (sidecar bugs_limitations_corner_cases.[2]): `localeCompare` is called with no locale argument — the runtime default locale drives the collation. The 6 current category labels are ASCII-only so all locales agree TODAY. A future accented or non-Latin category name would sort differently per user (`en-US` vs `tr-TR`), and the doc's stated order would be wrong for some users. Severity LOW on its own — folded into this gap because the same test would cover both.

  **No test pins either**:
  - A regression switching to a plain `results.map` (backend order) silently makes the dashboard tile order dependent on backend row order — different per request if the SQL is unordered.
  - A regression specifying `localeCompare(b, 'en-US')` is invisible today (all ASCII) — but a test would force the decision.

  **Why MEDIUM**: the ordering does not produce wrong DATA, only a UX trade-off (alphabetical optimises "find by name", not "find the worst"); the sidecar self-classifies the ordering MEDIUM and the locale sub-finding LOW. No cross-pillar bump. MEDIUM stands.

  **Test gap shape**: a unit test on `DataQualityContent` (or extracted-helper if refactored). Build a `DataQualityResults` whose `testResults` arrives in REVERSE alphabetical order; render; assert the rendered category headings are in alphabetical order. Second test: build a `testResults` with a non-ASCII category label and assert the locale-default produces a deterministic result.
