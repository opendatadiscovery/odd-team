    advisor but each method must OPT IN via `@SchedulerLock` to
    participate. STRENGTHENS F-010 batch-X drift facet
    `postgresql_session_housekeeping_job_no_scheduler_lock_multi_instance_race_load_n_times_inconsistent_with_5_jobs_pattern`
    with primary-source confirmation at the config tier.

