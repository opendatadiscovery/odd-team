proposed_action: |-
  Add `DataQualitySeverityChangeAuditAbsenceTest` with three regression-pin methods:
  (a) `setDataQATestSeverity_returns200_emitsNoActivityRow_pinsAuditSilence`: seed Owner A owning dataset D + DQ test T; authenticate as Owner A; pre-snapshot `SELECT COUNT(*) FROM activity` = N; WebTestClient PUT `/api/datasets/{D}/dataqatests/{T}/severity` with `{"severity": "CRITICAL"}`; assert response 200; post-snapshot `SELECT COUNT(*) FROM activity` = N (no new row). Then assert the severity DID persist via `GET /api/datasets/{D}/sla_report` reflecting the new weight. Pins the WRITE-succeeded-with-no-audit asymmetry.
  (b) `setDataQATestSeverity_idempotency_repeatedPutsConvergeOnSameRow`: same fixture; PUT `{severity: MINOR}` then PUT `{severity: MAJOR}` then PUT `{severity: CRITICAL}`; assert SQL `SELECT COUNT(*) FROM data_quality_test_severity WHERE data_quality_test_id = ? AND dataset_id = ?` equals 1 (upsert converged); assert the current severity is CRITICAL. Pins idempotency.
  (c) `setDataQATestSeverity_flipsCriticalToFromMajor_changesSLAColour_butLeavesNoForensicTrail`: seed dataset with one passing-status DQ test; PUT severity=CRITICAL; assert SLA colour flipped from GREEN to RED (per SLACalculator algorithm); assert `SELECT COUNT(*) FROM activity WHERE data_entity_id = ?` is unchanged. Pins the compliance-blindspot: the operator-visible SLA changed but the forensic trail is silent.
  Add `// REGRESSION-PIN — DataQualityController.setDataQATestSeverity is an OWNER-SCOPED mutation that changes the operator-visible SLA colour but emits ZERO audit signal. This pins the current audit-silence; the fix is to add @ActivityLog to DataQualityServiceImpl.setDataQualityTestSeverity (after the schema-root-cause from batch R is resolved — activity.data_entity_id NOT NULL is satisfied here since DQ test belongs to a dataset). When the maintainer ships the fix, methods (a) and (c) flip from asserting silence to asserting an activity row appears. Pair with TEST-GAP-232 (RBAC audit silence) as the parent pattern.` comment block.
