notes: |-
  Trade-off is explicit in the code: the model assumes (a) TLS protects
  transport, (b) the DB is trusted, (c) operators rotate when a token
  is compromised. The catalog records this as an invariant so future
  audits know the threat model the maintainers chose. Open question:
  should rotation use a CSPRNG and offer a grace window? Batch 2026-05-10B
  adds the verify-side corroboration: the same plaintext-equality stance
  is implemented identically on both ends, so any change to one MUST
  coordinate with the other (e.g. adding a hashing layer at rotate
  requires changing the verify-side from .equals to BCrypt.matches).

  Batch 2026-05-19-O adds the third axis: the IngestionDataEntitiesFilter
  filter-class-layer sidecar (auth/filter axis) carries the stance at the
  primary code site (line 56). Now triangulated across rotate-side
  (CollectorController.regenerateCollectorToken), verify-side annotation
  (IngestionDataEntitiesFilter config-key-consumer @L20), AND verify-side
  filter-class (IngestionDataEntitiesFilter auth/filter batch O). Three
  sidecars for the same invariant — any future change to the token model
  must update three sidecars in lockstep.

  **Batch 2026-05-20-R adds the FOURTH axis: the SQL primary source**.
  ReactiveCollectorRepositoryImpl.getByToken (lines 89-97) is the SQL
  bridge query for the always-on IngestionDataSourceFilter (used on
  every POST /ingestion/datasources). The plaintext-equality
  `TOKEN.VALUE.eq(token)` at line 94 is the SQL-tier manifestation
  of the same architectural decision. Now any future change to the
  token model must update FOUR sidecars in lockstep:
    1. CollectorController.regenerateCollectorToken (rotate-side)
    2. IngestionDataEntitiesFilter@L20 (verify-side annotation)
    3. IngestionDataEntitiesFilter (batch O — verify-side filter class)
    4. **ReactiveCollectorRepositoryImpl (batch R — SQL primary
       source; also the IngestionDataSourceFilter bridge)**

  **The batch-R sidecar surfaces the FULL end-to-end exposure chain
  (combined with batch Q UI tier findings)**: the plaintext credential
  passes through SIX exposure points (PG row at rest; backup/replica/
  pg_dump; jOOQ debug log; application log on stack traces; browser
  DOM after creation/rotation; network transport between platform and
  collector). The complete chain is captured at the dedicated
  `collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain`
  invariant.

  **Additional finding from batch R — the IngestionDataSourceFilter
  is ALWAYS-ON irrespective of auth.ingestion.filter.enabled**. This
  means the plaintext-equality stance applies to EVERY datasource
  registration request regardless of the operator's configuration
  choice. The opt-in flag governs the SIBLING IngestionDataEntitiesFilter
  on /ingestion/entities; the IngestionDataSourceFilter on
  /ingestion/datasources is unconditional. Captured at the dedicated
  `two-ingestion-filters-asymmetric-auth` invariant — this concept
  cross-references it.
