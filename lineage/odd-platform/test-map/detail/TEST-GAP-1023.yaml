behaviour: |-
  **Four unit-class behaviours of the AppErrorPage widget are
  entirely untested — these together pin the "displayed-field
  contract" that 23 caller pages depend on:**

  (a) `showError=false` → renders `null` (the dominant invisible
  state). A regression to always-render would push a placeholder
  banner into every successful page — visible regression but no
  test catches it.

  (b) `error={status, statusText}` provided → renders the status
  code and status text exactly as passed. A regression that
  formatted the status code, abbreviated the statusText, or
  swapped them silently would slip through.

  (c) `error=undefined` OR `error.statusText` empty → fallback
  message is `t('Unknown Error')` (translated). Multiple callers
  (e.g. `OwnerAssociationsActive.tsx:99`) pass `showError` only and
  rely on this fallback path. No test pins it; a change that
  hardcoded "Something went wrong" or rendered an empty banner
  would break the non-English locales silently.

  (d) "Home Page" button navigates to `/` via react-router (client-
  side history navigation, NOT a full-page reload via
  `<a href='/'>`). A regression to anchor-tag navigation would
  cause a full SPA reload — fetching all bundles again — which is
  visible-as-flicker but no test catches the architectural
  intent.

  These are pure-unit tests on the AppErrorPage widget in
  isolation. They are LOW-individual but HIGH-aggregate because
  the widget has 23 callers; any regression in the contract
  surfaces 23× in production. Severity MEDIUM in aggregate.

  Companion to TEST-GAP-1021 (the security-class no-leak
  contract). Both gaps target the same widget; together they
  comprise the full AppErrorPage behavioural specification.
