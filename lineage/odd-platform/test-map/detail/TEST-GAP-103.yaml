behaviour: Typo in `auth.type` (e.g. `OUATH2`, `LOGINFORM`) silently disables ALL
  `@ConditionalOnProperty(havingValue=...)` matches and produces the same no-SecurityWebFilterChain
  deployment as the empty-string case, with `/api/appInfo` echoing the typo back to
  clients. No validation, no boot-time fail-fast.
