mitigations_unimplemented:
  - |-
    Layer 1 — input validation at AttachmentService.initiateFileUpload OR
    the OpenAPI schema: reject filenames containing path-separator chars
    (/ \\ NUL CR LF), reject filenames starting with '.', cap length at
    255, reject Windows-reserved names (CON, PRN, AUX, NUL, COM1-9, LPT1-9).
  - |-
    Layer 2 — server-generated UUID as the storage path: persist the
    user-supplied filename in the file.name DB column for the display side,
    but use UUID.randomUUID().toString() as the on-disk + S3-object-key
    filename. The basePath.resolve(uuid).toString() construction is
    traversal-immune by construction.
  - |-
    Layer 3 — Content-Disposition using WebFlux's ContentDisposition
    builder. Replace the string concatenation at DataEntityAttachmentController.java:76-79
    with:
      ContentDisposition cd = ContentDisposition.attachment()
        .filename(dto.fileName(), StandardCharsets.UTF_8)
        .build();
      .header(HttpHeaders.CONTENT_DISPOSITION, cd.toString())
    The builder applies RFC 6266 + RFC 5987 encoding and rejects CRLF.
  - |-
    Regression tests — three tests:
      (a) Upload a filename containing ../../../etc/passwd — assert the
          upload is rejected OR the stored path remains inside basePath.
      (b) Upload a filename containing CRLF + X-Frame-Options header
          — assert the downloaded response does NOT contain the injected
          header.
      (c) Upload a filename containing UTF-8 multi-byte characters —
          assert the download Content-Disposition correctly encodes via
          RFC 5987.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20V from the
  DataEntityAttachmentController class-level sidecar. The finding identifies
  three independent exploit paths (path traversal write, path traversal
  read, CRLF header injection) all reachable from a single weak point: the
  raw filename pipeline.

  Cross-cutting connections:
    - Companion attachment finding: attachment-read-endpoints-no-securityrule-cross-owner-file-download
      (any authenticated user can download files; combined with this
      finding, the path-traversal read is reachable cross-owner)
    - Companion attachment finding: cross-entity-privilege-escalation-via-discarded-data-entity-id-in-attachment-urls
      (the URL-discard means a user with MANAGE on one entity can upload
      malicious filenames targeting any storage path)
    - F-004 stored-XSS family: the link-URL field has a sibling sanitisation
      gap (link URL accepts javascript: scheme without filter) — same
      class of input-validation gap, different surface
    - LSN-001 retrospective: this finding compounds the LSN-001 attack
      surface — a path-traversal write that escapes /tmp/odd/attachments
      may NOT be wiped on container restart if the escaped path lands on
      a mounted volume

  Four DOC-NNN candidates flow:
    (a) Code fix — Layer 2 (UUID storage path) — single highest-leverage
        fix; closes path traversal at the construction layer
    (b) Code fix — Layer 3 (ContentDisposition builder) — closes CRLF +
        RFC encoding issues
    (c) Code fix — Layer 1 (input validation) — defence-in-depth
    (d) Regression tests pinning all three exploit paths
