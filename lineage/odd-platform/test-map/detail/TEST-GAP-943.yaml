behaviour: |-
  **GET /api/integrations/{unknown-id} returns 204 No Content (NOT 404)** —
  ResourceFilesIntegrationRegistry.java:15-17 `Mono.justOrEmpty(registry.get(id))`
  returns Mono.empty on missing-id; .map is short-circuited; the controllers
  Mono.empty.map(ResponseEntity::ok) produces Mono.empty; Spring WebFlux
  translates to 204. The OpenAPI declares ONLY 200 response
  (openapi.yaml:75-81); no 404 is contracted. Operators cannot distinguish
  "integration exists but has empty body" (currently impossible —
  non-existent state) from "integration does not exist". Compounded by the
  case-insensitive id collision bug: IntegrationRegistryFactory.java:32-37
  builds a TreeMap with `Comparator.comparing(String::toLowerCase)` AND merge
  function `(o1, o2) -> o2` — two YAMLs with ids `Snowflake` and `snowflake`
  collapse into ONE entry, last-loaded wins. With classpath*: scanning
  multiple jars the load order is filesystem-dependent and non-deterministic
  across deployments. An operator overlaying `snowflake.yaml` to override a
  vendor's `Snowflake.yaml` may succeed or fail depending on jar order, with
  no log, no warning.
