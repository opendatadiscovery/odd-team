proposed_action: |-
  Reflection-based test. (a) Inspect Spring context to identify ALL `AbstractIngestionFilter` subclasses. (b) For each instance, reflect the `mapper` field. (c) Assert each subclass's ObjectMapper is a DISTINCT instance (not shared with Spring's ObjectMapper bean). (d) Pin the per-class allocation pattern. Future REFACTOR injecting Spring's ObjectMapper flips the assert.
