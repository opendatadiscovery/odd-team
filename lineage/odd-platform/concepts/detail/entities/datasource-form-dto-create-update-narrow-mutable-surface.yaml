axes_present:
  - controllers
security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
    - S2S
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      The DTOs themselves carry no authorization; the consuming
      endpoints (POST/PUT /api/datasources) are path-gated by
      DATA_SOURCE_CREATE / DATA_SOURCE_UPDATE. The DTO's
      namespace_name field is the security-relevant surface — it
      drives the NAMESPACE_CREATE side-door because the contract
      offers only name-based (never id-based) namespace selection.
  owner_scoping:
    verdict: N/A
    detail: DataSource form bodies are not owner-scoped.
  strengths:
    - |-
      No token field on either DTO — the caller can never supply a
      token; token issuance is platform-owned (registerDataSource.md
      implicit_adrs.[0])
  weaknesses:
    - |-
      DataSourceFormData omits oddrn from the `required` block while
      the runtime rejects an empty oddrn — a spec-driven client
      omitting oddrn receives a surprising HTTP 400
      (registerDataSource.md bugs_limitations_corner_cases.[3] LOW)
    - |-
      Neither DTO offers a `namespace_id` field — name-only namespace
      selection forces every consumer through namespaceService.getOrCreate,
      which is the NAMESPACE_CREATE side-door
      (registerDataSource.md request_inputs[namespace_name])
  cross_file_inconsistencies: []
  contributing_files:
    - registerDataSource.md
    - updateDataSource.md
  evidence:
    - registerDataSource.md:concepts.entities + bugs_limitations_corner_cases.[3,6]
    - updateDataSource.md:concepts.entities.[DataSourceUpdateFormData]
performance_aggregate:
  overall: HIGH
  hot_paths: []
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Both DTOs carry a single data source; there is no bulk-register
      or bulk-update DTO on the UI side. Per-call payload is KB-sized
      (4 / 3 short string fields).
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless request bodies; spring.codec.max-in-memory-size (20MB)
      caps deserialization — not a realistic limit for a 3-4-string-field
      DTO.
  strengths:
    - Tiny fixed-shape payloads — no pagination, no nesting, no collections
  weaknesses: []
  cross_file_inconsistencies: []
  contributing_files:
    - registerDataSource.md
    - updateDataSource.md
  evidence:
    - registerDataSource.md:stress_findings.tunables[spring.codec.max-in-memory-size]
    - updateDataSource.md:stress_findings.tunables[spring.codec.max-in-memory-size]
notes: |-
  Surfaced as a canonicalisation candidate. The two Form DTOs are
  codebase-anchored; main-concepts.md names "Data source" as a concept
  but does not enumerate the operator-mutable field-set. The entity
  is minted (rather than folded into the existing Register/Update
  operations) because BOTH the create and update operations consume
  it, AND because the method-level reading of the spec CORRECTS a
  stale class-node claim — the class node named a non-existent
  `connectionUrl` field; the spec has 4 create fields / 3 update
  fields and the connection_url column is gone (V0_0_71).

  Cross-cutting connections:
    - Pairs with operation register-data-source (consumes the CREATE DTO)
    - Pairs with operation update-data-source-ui-admin-replace
      (consumes the UPDATE DTO — NEW THIS BATCH)
    - Pairs with invariant datasource-update-replace-not-merge-mapstruct-set-to-null
      (the UPDATE DTO's all-optional shape is the structural enabler)
    - Pairs with invariant namespace-create-side-doors-cross-pillar-4-sister-services-batch-w-closure
      (the name-only namespace_name field forces the getOrCreate side-door)

  One DOC-NNN candidate: the OpenAPI spec should mark
  DataSourceFormData.oddrn as `required` (it is de-facto required at
  runtime); currently the contract understates the requirement and a
  spec-driven client omitting oddrn receives an unexplained HTTP 400.
