  - odd-platform ts react-component:TermDetailsTabs
  - odd-platform ts react-component:TermDetailsRoutes
contributing_nodes:
  - odd-platform ts react-component:TermDetailsView
  - odd-platform ts react-component:TermDetailsTabs
  - odd-platform ts react-component:TermDetailsRoutes
