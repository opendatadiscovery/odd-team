realism_caveats: |
  Part A — env-masking confirmation:
    The Spring Boot 3.4.10 default `management.endpoint.env.show-values: NEVER`
    is the protective contract. The probe verifies the SHIPPED platform.yml
    does not override this default (grep `show-values` on application.yml
    confirmed zero hits 2026-05-26). If a future maintainer adds
    `show-values: ALWAYS` (or even `WHEN_AUTHORIZED`), the env endpoint will
    leak the password verbatim under LDAP — this probe would catch that
    regression by failing the `env_ldap_anon_masked` assertion.

  Part A — actuator path whitelist amplification:
    Under LDAP/OAUTH2/LOGIN_FORM, /actuator/** is whitelisted via
    SecurityConstants.java:95-96 + AuthorizationCustomizer.java:22-23 — the
    env endpoint is reachable to ANY network caller without auth. The
    protection is masking ALONE. The probe confirms masking holds; a separate
    probe could confirm whether the whitelist itself is a documented choice
    (which it is not — see LSN-002-class actuator-exposure findings).

  Part B — Lombok toString leak realism:
    The current platform code has ZERO log lines that serialise the
    ODDLDAPProperties bean (verified by grep on LDAPSecurityConfiguration.java
    2026-05-26 — no log.info/debug/warn lines with properties as a slf4j arg).
    The probe's `boot_log_leaks_password == False` assertion is the CURRENT
    correct behaviour; the assertion exists to DETECT a future regression
    (a maintainer adding a debug log line). If the assertion FLIPS to True,
    the team should immediately apply `@ToString.Exclude` to the password
    field — the probe gives an early-warning signal.

  What this probe does NOT verify:
    - Whether `/actuator/configprops` (currently UN-exposed) would leak — that
      endpoint is not in the bundled exposure list (application.yml:226-231).
      A future maintainer adding `configprops` to the exposure list would
      need a follow-up probe.
    - Whether a custom @RestControllerAdvice or info-contributor that
      serialises the bean would leak — those are hypothetical attack surfaces
      that don't exist in the current codebase.
    - Whether the JSON-serialisation path (Jackson with no @JsonIgnore)
      would leak — Jackson is not invoked on @ConfigurationProperties beans
      by the actuator's env endpoint; it would only leak if a custom
      controller exposed the bean directly.
