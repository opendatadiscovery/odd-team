proposed_action: |-
  Two complementary tests:
  (a) Static-asserter test in ToolbarTabs.localization.test.tsx —
  collect the 9 tab-label string literals from ToolbarTabs.tsx
  (or expose them as an exported constant for testability), then
  for each language file in odd-platform-ui/src/locales/translations/
  assert that every tab label is a key in that file. RED today on
  3 labels × 6 locales = 18 missing entries; GREEN after all 18
  entries are added.
  (b) Render-side test — mount ToolbarTabs with i18next switched to
  fr; assert the Data Quality tab label renders as a non-English
  translation (or as a specific French string if defined). RED
  today because the literal "Data Quality" shows; GREEN after the
  locale entry is added in fr.json.
  Fix: add the 18 missing entries (3 tabs × 6 locales). The
  translations should be reviewed by native speakers where
  possible OR left in English with a TODO marker until reviewed.
