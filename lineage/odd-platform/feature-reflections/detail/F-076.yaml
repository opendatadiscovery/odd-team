# Cross-Management cascade-on-delete protection pattern — product-owner reflection

## product_owner_narrative

The Management section of ODD Platform gives an operator three sibling parent
entities they can delete from a list of cards or rows: an **Owner** (the
Management → Owners tab), a **Namespace** (Management → Namespaces), and a
registered **DataSource** (Management → Datasources). Each parent has dependent
"referent" rows — an Owner is referenced by ownership / term-ownership /
user-owner-mapping rows; a Namespace by data sources / collectors / terms /
data entities; a DataSource by ingested data entities (and a connection token).
F-076 is not a single user feature — it is the **structural class** that all
three delete paths belong to: each one runs an existence-check across its
referents, blocks the delete with `CascadeDeleteException` (HTTP 400, USR004) if
any referent is live, and otherwise SOFT-deletes the parent
(`UPDATE … SET deleted_at = NOW()`) (per OwnerServiceImpl.md:understanding;
NamespaceController.md:concepts.invariants; deleteDataSource.md:understanding).

From the operator's seat, the feature is "I am cleaning up the catalog — let me
remove this owner / namespace / datasource I no longer use." They reach it from
a card or row with a Delete affordance gated by the matching
`*_DELETE` permission, click it, and get a `ConfirmationDialog` that says the
thing "will be deleted permanently" (per F-076.yaml:ui_review_2026_05_26 — the
three dialogs ship near-identical terse text; DataSourceItem.md:implicit_adrs
confirms the DataSource dialog). On confirm, the UI dispatches a single DELETE
request. The promised outcome is removal.

The working parts the operator depends on, phrased as they would describe them:
"if this thing still has stuff attached to it, the platform should stop me from
orphaning that stuff" (the cascade-BLOCK — the protective half), and "if it has
nothing attached, it should go away" (the soft-delete — the destructive half).
The cascade-block is a 3-leg parallel `Mono.zip` of `existsBy*` predicates for
Owner (OwnerServiceImpl.java:90-93), a 4-leg zip for Namespace
(NamespaceServiceImpl.java:75-87), and a single `existsNonDeletedByDataSourceId`
check for DataSource (DataSourceServiceImpl.java:88-95). Where the operator's
expectation and the implementation diverge is the load-bearing finding of this
reflection: the check and the soft-delete are not atomic against a concurrent
referent INSERT (no row lock, no advisory lock, READ COMMITTED), and the
Namespace path is not even wrapped in a transaction at HEAD
(NamespaceServiceImpl.java:74 — `delete` has no `@ReactiveTransactional`, while
`update` at line 63 does — confirmed at commit 107c9aa this session).

This feature shares data with Security & Access Control (P-09 — every delete is
gated by a MANAGEMENT-tier `*_DELETE` permission with NO per-owner scoping) and
with Active Platform Features (P-07 — the Activity Feed, which records NONE of
these three deletes; OwnerServiceImpl and DataSourceServiceImpl emit no
`@ActivityLog`, per OwnerServiceImpl.md:bugs[1] + deleteDataSource.md:bugs). The
edge cases a senior product owner would demo: deleting an actively-ingested
datasource (it 400s, and the UI dialog gets stuck — DataSourceItem.md:bugs);
deleting an Owner that still has a pending association request (it succeeds and
orphans the request — OwnerServiceImpl.md:bugs[3]); and deleting a Namespace
through a network blip (it can leave the row half-deleted with no compensation —
NamespaceController.md:bugs[6]).

