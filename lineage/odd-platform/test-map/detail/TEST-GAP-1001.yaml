proposed_action: |-
  Add `lookupTablesRoutePermissionEnumeration.test.tsx`:

  (a) `lookupTablesRoute_allowedPermissions_pinsThe3OfTablePermissions`: parse `App.tsx` (or import the route declaration directly) and assert the `allowedPermissions` prop on the LookupTables-route `WithPermissionsProvider` is EXACTLY `[LOOKUP_TABLE_CREATE, LOOKUP_TABLE_UPDATE, LOOKUP_TABLE_DELETE]` — pins the current enumeration; a future addition (e.g. adding `LOOKUP_TABLE_DEFINITION_CREATE`) breaks the test deliberately to force an audit pass.

  (b) `lookupTables_innerGatesCoverThe6DefinitionAndDataPermissions`: snapshot every `<WithPermissions>` inside `components/LookupTables/**/*.tsx`; assert the COMPLETE set of `permissionTo` values mentioned across the subtree covers all 6 of `LOOKUP_TABLE_DEFINITION_{CREATE,UPDATE,DELETE}` and `LOOKUP_TABLE_DATA_{CREATE,UPDATE,DELETE}` (or pins the current state if some are not yet UI-gated). Catches the regression "we removed an inner gate AND didn't notice it was the only gate for that permission".

  Add a comment at App.tsx:79 documenting: 'allowedPermissions here is intentionally the TABLE TIER ONLY (3 of 9 LOOKUP_TABLE_* permissions per the backend). The other 6 (DEFINITION + DATA) are enforced backend-side via SECURITY_RULES and component-side via <WithPermissions> in LookupTables.tsx descendants. If you change this list, also update TEST-GAP-1001.test and verify the inner <WithPermissions> still cover the remaining 6.'
