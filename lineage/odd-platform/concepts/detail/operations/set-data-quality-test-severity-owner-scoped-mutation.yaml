notes: |-
  The owner-scoped mutation pattern is consistent with the platform-wide convention
  (mutations centralised in SecurityConstants.SECURITY_RULES, owner-scoping via
  DATA_ENTITY AuthorizationManagerType). The audit-silence on this mutation is the
  weakness — it follows the F-006 audit-silence pattern (no @ActivityLog on the
  service method, no row in the activity table for severity changes) extending the
  9-sidecar pattern to a DATA-ENTITY-SCOPED mutation rather than only the RBAC /
  Owner / Datasource mutations the F-006 pattern previously enumerated.
