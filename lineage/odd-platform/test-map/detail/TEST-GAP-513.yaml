proposed_action: |-
  WebTestClient integration test. (a) Create Owner A with entity a1; Owner B with entity b1; lineage edge a1->b1 AND b1->a1 (creating a 2-cycle for both directions). (b) Authenticate as user uA (associated with Owner A). (c) GET /api/dataentities/my/upstream — assert response body contains b1 (the upstream entity) and does NOT contain a1 (the owned entity excluded per Predicate.not). (d) GET /api/dataentities/my/downstream — assert symmetric. (e) Test comment 'LOCKS the DOC-GAP-099 inverse-semantic contract as of 2026-05-19. The OpenAPI summary says response contains owned entities WITH upstream/downstream — IMPLEMENTATION returns non-owned upstream/downstream EXCLUDING the owned set. When the OpenAPI summary is corrected to match the implementation (or vice versa — the implementation is fixed to match the spec), THIS test FLIPS to expect a1 in the response (if implementation changes) or remains green (if only the OpenAPI doc is fixed).' Pair with a contract test in `odd-platform-specification` that asserts the OpenAPI summary text matches a known-correct phrasing — this is the natural complement and the test pair pins both halves of the inversion.
