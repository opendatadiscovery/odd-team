proposed_action: |-
  Stand up the Tag API test package at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`:
  1. Create a Testcontainers-backed `@SpringBootTest` base class (or reuse `BaseIntegrationTest`) and an RBAC-permission test fixture that can inject a caller holding a specified `TAG_*` / `DATA_ENTITY_TAGS_UPDATE` / `TERM_TAGS_UPDATE` / `DATASET_FIELD_TAGS_UPDATE` permission set.
  2. Add HTTP-floor smoke tests: `POST` / `GET` / `PUT` / `DELETE /api/tags` each return their expected status for an authorised caller; `PUT /api/terms/{id}/tags` and `PUT /api/datasetfields/{id}/tags` each return 200.
  3. House the behaviour-level test classes proposed by TEST-GAP-883..896 (popularity drift, bulk atomicity, perimeter security, term/dataset-field replace-all, unset-origin, parent-scoped auth, soft-delete semantics, external-guard coverage, FTS propagation, response shape, spec conformance, name validation, DISABLED bypass, term-tag audit) and TEST-GAP-762..766 in this package.

  This META gap is the parent backlog item for the tests-pillar F-018 effort. Triage the 14+5 individual gaps as child test-authoring tasks under it.
