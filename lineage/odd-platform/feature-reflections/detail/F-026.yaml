- id: H-007
  hypothesis: "When an operator creates a lookup table named 'Customer Lookups' and another named 'customer_lookups' in the same namespace, they get a clear, friendly error explaining the name collision (e.g. a 409 with a readable message)."
  derivation: "Endpoint shape — buildTableName performs lossy normalisation (lowercase + space-to-underscore); a senior product owner expects a name-collision case to be handled with an actionable error, not a stack trace."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Both names normalise to the same physical table name n_{nsId}__customer_lookups via
      name.toLowerCase().replace(" ","_") (ReferenceDataServiceImpl.java:191-194). createLookupTable
      (lines 73-86) does NOT pre-check for an existing table with that normalised name before issuing
      DSL.createTable. Postgres raises `relation already exists`, which surfaces to the user as a generic
      HTTP 500 — no friendly 409, no BadUserRequestException, no message naming the collision or the
      conflicting table.
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: bugs_limitations_corner_cases[2]
        cite: "ReferenceDataServiceImpl.java:191-194 (lossy normalisation) + 73-86 (no pre-check)"
        note: "No uniqueness pre-check; collision becomes a raw Postgres error → generic 500."
    operator_visible_failure: |
      An operator hits an opaque "something went wrong" 500 when creating a table whose name collides with an
      existing one after normalisation. They have no way to know WHY (the names look different to them —
      "Customer Lookups" vs "customer_lookups"), so they cannot self-correct; they may retry, file a support
      ticket, or assume the feature is broken. The lossy normalisation itself is undocumented at the UI layer,
      so the operator also cannot anticipate that "My Reference Tables" becomes n_5__my_reference_tables.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: "When the parent DataEntity of a lookup table is deleted (via /api/dataentities/{id} or ingestion soft-delete TTL), the lookup table's catalog row and its physical lookup_tables_schema table are cleaned up too — the catalog and the data store stay consistent."
  derivation: "Negative-space + data-integrity — a Lookup Table IS a Data Entity (DataEntityClassDto.java:43); deleting the entity should not leave a half-deleted artefact. An operator expects catalog and storage to agree."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The cleanup cascade is service-orchestrated ONLY on the DELETE /api/referencedata/table/{id} path
      (LookupDataServiceImpl.java:114-118 deletes search-entrypoint → table-definitions → tableRepository row →
      DataEntity, then ReferenceDataRepositoryImpl drops the physical table). It is NOT enforced by an FK on
      the inverse direction (lookup_tables.data_entity_id has no ON DELETE CASCADE). Deleting the parent
      DataEntity via /api/dataentities/{id}, OR a soft-delete via STATUS=DELETED / housekeeping TTL, bypasses
      this orchestration entirely — leaving orphan rows in lookup_tables_schema.n_* AND an orphan lookup_tables
      row. Additionally, the two-step delete on the canonical path is two separate transactions
      (@ReactiveTransactional service + @ReactiveCustomTransactional repository) with no compensation, so a
      failure between catalog DELETE and physical DROP also drifts the two stores.
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: bugs_limitations_corner_cases[3] + [4]
        cite: "LookupDataServiceImpl.java:114-118 + ReferenceDataRepositoryImpl.java:268-277; no inverse FK"
        note: "Cleanup only on the controller delete path; parent-entity delete + soft-delete orphan; 2-tx no-compensation."
    operator_visible_failure: |
      The catalog UI shows the lookup table as gone (or the operator never sees it), but the underlying PostgreSQL
      table is still present and queryable from BI/ETL — a stewardship and compliance hazard: "deleted" reference
      data keeps serving downstream joins. Conversely an orphaned lookup_tables row with no live parent entity is
      a dangling catalog record. The orphaned physical table also continues to consume schema space with no
      catalog handle to clean it up. Because two soft-delete mechanisms (STATUS + housekeeping TTL) both bypass the
      cleanup, this can happen without any explicit operator delete action at all.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

- id: H-009
  hypothesis: "When an operator renames a lookup table that downstream BI/ETL already joins against, the platform protects the downstream consumer (a deprecation alias/view, a rename-block, or at minimum a warning) so the join does not silently break."
  derivation: "The feature's SQL-joinable promise (the whole reason rows are stored as real Postgres tables) implies the physical name is a contract; a senior product owner expects rename to preserve or warn about that contract."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      Rename rebuilds the physical table name from the new display name (buildTableName) and issues
      ALTER TABLE ... RENAME TO (ReferenceDataRepositoryImpl.java:181-202). There is no Postgres VIEW alias on
      the old name, no rename-blocker, and no warning at the rename UI. The operative `updateLookupTable`
      additionally emits no ActivityEvent (no @ActivityLog, no last_modified_by), so there is not even an audit
      record of who renamed what when.
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: bugs_limitations_corner_cases[7]
        cite: "ReferenceDataServiceImpl.java:107-124 + ReferenceDataRepositoryImpl.java:181-202"
        note: "Rename = ALTER TABLE RENAME TO against the documented public schema; no alias/block/warning."
    operator_visible_failure: |
      An operator renames a lookup table from the UI for a perfectly normal reason (typo fix, naming convention)
      and every downstream BI dashboard / ETL job that hardcoded `lookup_tables_schema.n_5__old_name` breaks
      immediately and silently — the rename succeeds with no warning that external consumers exist. Because there
      is no audit emission on rename, the post-mortem on the broken pipeline cannot answer "who renamed which table
      when" from platform logs. This directly contradicts the SQL-joinable-stable-table promise that motivates the
      feature.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-010
  hypothesis: "When a user with LOOKUP_TABLE_DEFINITION_UPDATE on table A submits a PATCH to /api/referencedata/table/A/column/{column_id} where {column_id} actually belongs to table B, the update is rejected (the column-belongs-to-table invariant is enforced on writes as it is on reads)."
  derivation: "Endpoint shape — the URL carries {lookup_table_id}, promising the operation is scoped to that table; the read path getLookupTableField already enforces the parent-table linkage, so a consumer expects the write path to do the same."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      updateLookupTableField discards the {lookup_table_id} path parameter: the controller passes lookupTableId
      in (ReferenceDataController.java:131-141) but the service signature is updateLookupTableField(Long columnId,
      LookupTableFieldUpdateFormData) — no table-id (ReferenceDataServiceImpl.java:126-143). So a client can PATCH
      /api/referencedata/table/999/column/{column_id} and the update succeeds regardless of whether column_id
      belongs to table 999. This is asymmetric with the READ path getLookupTableField (lines 58-70), which DOES
      validate the linkage and raises BadUserRequestException — and that read-side check IS unit-tested
      (ReferenceDataServiceImplTest.getLookupTableField_columnBelongsToDifferentTable_errorsBadRequest). The write
      path has no equivalent guard, and the NO_CONTEXT permission (H-002) does not catch the cross-table jump.
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: bugs_limitations_corner_cases[5] + security.known_security_gaps[3]
        cite: "ReferenceDataController.java:131-141 + ReferenceDataServiceImpl.java:126-143 vs 58-70"
        note: "Write path drops table-id; read path enforces it (and the read check is unit-tested)."
      - sidecar: source_read_for_validation
        section: ReferenceDataServiceImplTest
        cite: "odd-platform-api/.../service/ReferenceDataServiceImplTest.java:74-82"
        note: "READ-side column-belongs-to-table is GREEN-tested; the symmetric WRITE-side guard is absent + untested."
    operator_visible_failure: |
      A caller authorized (even legitimately) on table A's columns can mutate a column belonging to table B by
      spoofing the table-id segment of the URL — a cross-resource integrity break. Combined with the NO_CONTEXT
      global scope (H-002), the practical blast radius is large: any holder of LOOKUP_TABLE_DEFINITION_UPDATE can
      alter any column of any table. The read path validates the same linkage, so the asymmetry is also a
      correctness smell that a careful operator (or pen-tester) will notice and exploit.
    severity: MEDIUM
    confidence: HIGH
    source_read_for_validation: true
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

