proposed_action: |-
  Parameterised SpringBootTest. (a) Boot under EACH of (DISABLED / LOGIN_FORM / OAUTH2 / LDAP) auth modes in turn. (b) For each mode, POST `/ingestion/alert/alertmanager` with NO Authorization header. (c) Assert: DISABLED → 204; OAUTH2 → 204; LDAP → 204; LOGIN_FORM → 401 redirect-to-login (current). (d) Pin the divergence as the architectural finding; converge the two configurations to identical scope OR document the divergence explicitly. The test FAILS LOUDLY when the path lists drift further.
