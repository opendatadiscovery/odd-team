name: Batched UPSERT via onConflictDoUpdate (DEG-cascade primitive)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW OPERATION, batch 2026-05-19H** — the batched UPSERT primitive that
  ENABLES DataEntityGroup ownership propagation across child entities. The canonical
  implementation is `ReactiveOwnershipRepositoryImpl.createOrUpdate(Collection<OwnershipPojo>)`
  (lines 61-82) — batched via `executeInPartitionReturning` (1000-row partitions via
  `JooqReactiveOperations.BATCH_SIZE=1000`), each partition issues `INSERT ... ON
  CONFLICT ON CONSTRAINT ownership_data_entity_id_owner_id_key DO UPDATE SET title_id
  = EXCLUDED.title_id RETURNING *`. The semantic is **title-overwriting** (not insert-or-skip):
  for any row already existing with the same (data_entity_id, owner_id), the title
  gets RE-TITLED to the incoming value. This is the contract that makes DEG ownership
  propagation work — a parent DEG''s new-title cascade overwrites each existing child
  ownership''s title. **Sole caller**: `OwnershipServiceImpl.propagateOwnership.CREATE`
  at line 145 — the DEG-cascade entry point. There is no parallel `createIgnore` or
  `createIfMissing` method on this repository — every batch caller MUST accept the
  title-overwriting semantic. **Trade-off**: the choice prevents the alternative implementation
  (loop through children, check existence, insert if absent, update if present) from
  leaking into application code, but it also means there is NO way through this repository
  to "create a batch of ownerships if-and-only-if they don''t already exist". The
  caller cannot distinguish inserts-as-new from inserts-as-updates from the returned
  Flux — every record is the post-update state regardless of whether it was newly-inserted
  or conflicting-then-updated; there is no `xmax = 0` / `xmax <> 0` distinction. **Performance
  shape**: sequential partition execution via `Flux::concat` (NOT `Flux::merge`) at
  JooqReactiveOperations.java:81-83 — for O(10K)-child DEGs, 10 sequential INSERT-ON-CONFLICT
  batches inside a single @ReactiveTransactional hold the DB connection for cumulative
  duration. DEGs in practice have <1000 children (the 1000-row partition was sized
  for this regime); MEDIUM scope if any operator has DEGs with O(10K) children. **Distinct
  from the lineage repository''s SIMILAR pattern**: `ReactiveLineageRepositoryImpl.batchInsertLineages`
  (lines 50-58) uses `.onDuplicateKeyIgnore()` (jOOQ shorthand for `ON CONFLICT DO
  NOTHING`) against the (parent, child, establisher) PK — SILENT-DUPLICATE-SKIP semantic,
  NOT title-overwrite. Two different DEG-cascade primitives serving two different
  edge tables.'
