- id: H-011
  hypothesis: |-
    When the class palette and the class enum ever drift (a new class is added to the enum
    via OpenAPI regen but the theme palette is not extended in the same sweep), the chip
    degrades gracefully — a deterministic fallback colour, not a broken transparent chip.
  derivation: |-
    Facet entity_class_palette_baked_into_theme_not_data_driven: the ternary yields '' when the
    key is absent. The user-facing expectation is graceful degradation on partial regen.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Static reading: EntityClassItem.styles.ts:16 is `$entityClassName ? theme.palette.entityClass
      [$entityClassName] : ''`. The ternary only guards entityClassName being falsy — it does NOT
      guard the palette KEY being absent. If a new enum value exists but palette.ts has no matching
      key, `theme.palette.entityClass[newKey]` is `undefined`; MUI's styled-component would receive
      backgroundColor: undefined. Whether that renders as "no background" (transparent chip),
      inherits a parent background, or throws depends on the MUI/emotion runtime resolution of an
      undefined backgroundColor value at render — which I cannot determine from source alone.
      Today the palette IS complete (H-003: 9=9), so this path is unreachable until a future partial
      regen; the degradation behaviour must be OBSERVED, not inferred.
    evidence:
      - sidecar: EntityClassItem.styles.ts
        section: Content backgroundColor ternary
        cite: "EntityClassItem.styles.ts:16"
        note: "ternary guards entityClassName falsy, NOT a missing palette key → undefined backgroundColor on drift"
        source_read_for_validation: true
      - sidecar: F-206.yaml (feature-flow detail)
        section: observed_vs_expected.facets[entity_class_palette_baked_into_theme_not_data_driven]
        cite: "F-206.yaml facets[0]"
        note: "feature-flow flags the no-fallback contract; degradation behaviour is the open question"
    severity: LOW
    confidence: LOW
    routes_to_finding: caveat-candidate
