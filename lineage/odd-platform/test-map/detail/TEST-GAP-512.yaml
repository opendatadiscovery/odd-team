behaviour: |-
  REFACTOR-225 PRIMARY-SOURCE regression-pin (CRITICAL — controller-method primary-source for BOTH /my/upstream AND /my/downstream; cross-pillar P-05+P-09+P-01). The owner-scoping invariant for `getMyObjectsWithUpstream` and `getMyObjectsWithDownstream` is enforced at EXACTLY ONE SITE: `DataEntityRelationsServiceImpl.java:26` (`authIdentityProvider.fetchAssociatedOwner()`). The downstream `lineageRepository.getLineageRelations` recursive CTE has NO owner JOIN, NO owner predicate (per batch H ReactiveLineageRepositoryImpl sidecar at ReactiveLineageRepositoryImpl.java:122-176). The final `listByOddrns(oddrns, false, false, page, size)` at `ReactiveDataEntityRepositoryImpl.java:228-253` has NO owner JOIN — only `DATA_ENTITY.ODDRN.in(oddrns)` + soft-delete + hollow filters. **CONTRAST**: the base `/my` endpoint's repository method `listByOwner` (`ReactiveDataEntityRepositoryImpl.java:515-534`) JOINs against OWNERSHIP with `WHERE OWNERSHIP.OWNER_ID = ?` — a regression at `fetchAssociatedOwner` for that path would at worst leak entities the user genuinely co-owns; here the leak is the entire upstream/downstream lineage of an arbitrary anchor. A regression at the single load-bearing call site — e.g. (a) a future refactor adding a fallback owner-id for DISABLED mode, (b) a misordered WebFilter dropping the SecurityContext and `fetchAssociatedOwner` defaulting to a global anchor, (c) a corrupted USER_OWNER_MAPPING row resolving to the wrong owner, (d) a `flatMap`-vs-`map` typo passing through to a hardcoded fallback — leaks the lineage neighbourhood of an unintended anchor to the caller. The downstream `listByOddrns` scan has NO owner filter, so a wrong anchor produces a wrong (but well-formed) response with no SQL-layer trip-wire. The cure is a `listByOddrnsAndOwner(oddrns, ownerId)` repository method (or adding `Long ownerId` to `listByOddrns`) that JOINs against OWNERSHIP — today there is no such method. The endpoint is LATENT today (current code correct) but the architecture provides ZERO defence against a future single-line regression. The /my/upstream and /my/downstream are SYMMETRIC siblings — both inherit the full vulnerability. Cross-pillar bump: P-05 (Data Lineage data exposure) + P-09 (Security — REFACTOR-225 single-point-of-failure) + P-01 (Discovery — base /my path uses JOIN-defended repository; the lineage variants do NOT, the architectural inconsistency is the load-bearing finding).
