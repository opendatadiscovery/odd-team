discovered_from_entry_point: |-
  ui_pattern:jotai-Provider-wrapper (the structural ADR-shaped pattern
  applied at 4 feature areas — DataQuality, OwnerAssociations, DEGLineage,
  DatasetStructure-compare — wrapping each feature root in a per-feature
  jotai `<Provider>` so atoms are scoped to the mount tree).
description: |-
  Four UI feature areas in odd-platform-ui adopt a deliberate
  state-management deviation from the platform's Redux-Toolkit baseline:
  each wraps its feature root in a `<Provider>` from `jotai` so that its
  atom-scoped state is created fresh on every mount and destroyed on
  unmount. The rest of the SPA uses a single application-scoped Redux
  store where feature slices survive route changes for the SPA's
  lifetime.

  The four jotai-scoped feature areas as of 2026-05-26:
  (a) Data Quality Dashboard — `DataQualityProvider.tsx:4-6` wraps
      `<DataQualityFilters>` + `<DataQualityContent>` (DataQuality.tsx:8-17).
      10 filter dimensions (5 × 2 sides) live in `formFiltersAtom`
      (DataQualityStore.ts:11-22) with all-empty defaults.
  (b) OwnerAssociations (Management) — same shape; reviewer-tab + filter
      state in jotai atoms.
  (c) DEGLineage — same shape for the DEG-lineage cluster's expand/cursor.
  (d) DatasetStructure-compare — same shape for the revision-diff cursor.

  Operator-observable consequence: the four feature areas FORGET their
  current UI cursor / filter / selection state the moment the user
  navigates away (a route change unmounts the feature root, destroys
  the Provider, the atoms reset to defaults). The rest of the SPA does
  NOT forget — Redux slices persist for the SPA session. The asymmetry
  is invisible until the operator encounters it (the most common
  reproduction: pick filters on the DQ Dashboard, click an entity to
  drill in, click back, find an empty filter row).

  A partial mitigation: `DataQualityFilters.tsx:46-54` writes filter
  state to URL search params via a useEffect, so a back-navigation that
  preserves the URL reconstructs SOME of the state from the URL. P-120
  probe (DataQualityStore sidecar) is still open on whether the
  reconstruction is complete — the empirical answer determines whether
  the bug is "partial UX surprise" or "complete state loss".

  The intent of the per-feature jotai paradigm is deliberate (4 byte-
  identical Provider wrappers + ~26 files importing jotai across the
  4 areas is no accident); it is a candidate implicit-ADR ("per-feature
  jotai stores deliberately scoped to mount lifetime"). The drift is
  NOT that the choice was made; the drift is that it has NO doc-side
  caveat, NO consistency-of-pattern documentation, and NO UX signal
  telling the operator "your filters reset when you leave this page".
