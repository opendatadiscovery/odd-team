proposed_action: |-
  Author RbacMutationAuditTrailTest as a SLF4J-appender capture harness
  covering EVERY RBAC mutation endpoint plus the identity-exposure surface
  plus the integration-wizard reachability surface. The test is RED today
  (the production controllers emit zero lines). Fix path is incremental:
  (a) controller-tier @Slf4j + log.info on entry/exit (partial mitigation —
  insufficient for forensic reconstruction but documents the call);
  (b) schema-rooted fix per TEST-GAP-659 (the load-bearing change). The test
  serves as case-law that schema-rooted fixes are the right layer; per
  LSN-018 Rule 6 supersedes any future "add @Slf4j and call it audit" patch.
