- id: H-004
  hypothesis: |-
    When a third-party integrator generates an SDK from the published spec without overriding the
    base URL, the generated client targets the operator's deployment (a real placeholder), not a
    developer-machine localhost address.
  derivation: |-
    OpenAPI code generators read servers[0].url as the default base URL; the user expects a usable
    or clearly-templated default, not a dev stub.
  seed_source: response-shape (servers block)
  validation:
    verdict: contradicted
    actual_behavior: |-
      servers declares a single entry `- url: 'http://localhost' description: stub`
      (openapi.yaml:10-12, Read-verified 2026-06-03). openapi-generator-cli / openapi-typescript
      use servers[0].url as the default base URL, so a generated client targets http://localhost
      until the integrator manually corrects it. The spec sidecar notes that "operationally, clients
      pass an explicit base URL; the spec'd servers: is ignored in practice" — true for experienced
      integrators, but a footgun for a first-time SDK generation.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api.md
        section: bugs_limitations_corner_cases
        cite: "openapi.yaml:10-12"
        note: "servers: - url 'http://localhost' description: stub — dev-time placeholder, never updated"
      - sidecar: SELF
        section: source_read_for_validation
        cite: "openapi.yaml:10-12 (Read 2026-06-03 — url 'http://localhost' description: stub)"
        note: "Verified verbatim this run"
    operator_visible_failure: |-
      (1) A freshly generated SDK silently issues requests to http://localhost — every call fails
      (connection refused, or hits an unrelated local service) until the integrator discovers the
      override. (2) The failure is non-obvious: the SDK compiles and runs; only the network target
      is wrong. (3) This is the distinct-from-PLT-007/008 case: those track the runtime
      `odd.platform-base-url` config default; THIS is the published-spec servers entry consumed by
      code generators — a different locus and a different consumer.
    severity: LOW
    confidence: HIGH
    source_read_for_validation: true
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
