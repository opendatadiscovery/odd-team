name: Establisher-keyed lineage replacement convention — assembly site is IngestionServiceImpl.extractLineageRelations
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-05
- P-10
description: |-
  **NEW INVARIANT, batch 2026-05-20-Z (IngestionServiceImpl sidecar)** —
  the platform's "REPLACE NOT MERGE" lineage contract has a clearly-identified
  payload-assembly site at `IngestionServiceImpl.extractLineageRelations`
  lines 233-274. The method assembles `LineagePojo` instances from three
  DTO branches: DATA_SET → `parentDatasetOddrn` (line 238-246),
  DATA_TRANSFORMER → `sourceList` + `targetList` (line 248-262),
  DATA_CONSUMER → `inputList` (line 264-271). At each of FOUR sites
  (line 243, 253, 260, 269), the `establisherOddrn` of the constructed
  LineagePojo is set to the DTO's OWN ODDRN — making the entity itself
  the establisher of every lineage edge it declares.

  **The downstream consequence (per the `silent-data-loss-replace-not-merge-ingestion-semantics`
  invariant)**: `LineageServiceImpl.replaceLineagePaths` (line 124-133) groups
  the incoming pojos by their `establisherOddrn`, batch-DELETEs all
  pre-existing edges keyed by those establishers, then INSERTs the supplied
  pojos. The destructive semantics are concentrated in the SERVICE layer
  (LineageIngestionRequestProcessor + LineageServiceImpl), but the
  ESTABLISHER-KEYED PAYLOAD that DRIVES the destruction is built at THIS
  assembly layer (IngestionServiceImpl.extractLineageRelations).

  **Why this assembly site is the load-bearing primary source**: the
  destructive semantics could in principle be neutralised at any layer.
  Changing the lineage replacement contract from "replace by establisher"
  to "merge" requires either (a) modifying LineageServiceImpl.replaceLineagePaths
  to detect+preserve existing edges by establisher, OR (b) modifying
  THIS assembly site to compose multi-establisher payloads (e.g. set
  the establisher to a per-edge-id rather than per-entity). The
  per-establisher safety net (an establisher absent from the input list
  has its edges LEFT UNTOUCHED — confirmed at the F-008 multi-producer
  invariant) is the platform's defence against cross-producer destruction;
  the THIS-ENTITY-IS-ITS-OWN-ESTABLISHER convention enacted at this
  assembly site is what makes it WORK.

  **Severity MEDIUM**: this invariant is INTENT documentation, not a bug
  finding. The replace-not-merge contract is deliberate and load-bearing
  for the multi-producer safety net. Recording the assembly site lets
  future refactors trace the convention from the SERVICE-layer
  description down to the ESTABLISHER-CONSTRUCTION sites.
