name: Activity write has no idempotency / replay-safety — caller retries create duplicate
  audit rows
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
description: |-
  **NEW INVARIANT, batch VAL-LSN-019-B (2026-05-20)** — surfaced by
  primary-source examination of ActivityServiceImpl + ActivityHandler +
  ReactiveActivityRepositoryImpl. The activity write path has no
  idempotency mechanism — caller-side retries produce duplicate rows.

  **THE WRITE PATH** (ActivityServiceImpl.java:43-63):
    `createActivityEvent(event)` / `createActivityEvents(events)` —
    both delegate to `activityRepository.saveReturning(pojo)` /
    `activityRepository.save(list)`. Per the
    ReactiveActivityRepositoryImpl batch-R sidecar, these issue:
      saveReturning: `DSL.insertInto(ACTIVITY).set(record).returning()`
        — unconditional INSERT, no `ON CONFLICT` clause
      save: batched INSERT (1000-row chunks), no `ON CONFLICT` clause

  **THE LACK OF IDEMPOTENCY KEY**:
    The ActivityCreateEvent shape:
      `{long dataEntityId, ActivityEventTypeDto eventType, String oldState,
       String newState, boolean systemEvent}`
    NO idempotency key, NO request-id, NO content hash, NO event-id at
    the create-side. The persisted ActivityPojo carries a DB-assigned
    `id` (bigserial sequence) — different `id` on every retry, even for
    semantically-identical retries.

  **THE PARTIAL PROTECTION VIA ASPECT-FILTER**:
    The `ActivityAspect:86` filter `!info.getOldState().equals(newState)`
    provides partial protection in the SERIAL retry case: a retry that
    fires AFTER the first attempt succeeded finds the state already
    changed (oldState now equals newState because the previous emit
    already moved the underlying entity). The filter blocks the emit;
    no duplicate row is written. This works ONLY for the @ActivityLog
    AOP path, NOT for the AlertService or Ingestion paths.

  **THE TRUE-CONCURRENT-RETRY CASE**:
    Two requests arriving before either has committed:
      Request 1: user clicks "Update description" → starts
        @ReactiveTransactional + getContextInfo captures S0 + business
        mutation runs (state → S1) + getUpdatedState reads S1 + filter
        passes (S0 != S1) + INSERT activity row → COMMIT
      Request 2: user clicks "Update description" AGAIN (double-click
        within the latency window of Request 1):
        starts own @ReactiveTransactional + getContextInfo captures
        S0 (because Request 1 has not yet committed under READ
        COMMITTED) + business mutation runs (idempotent: state already
        S1 or S2-with-same-content) + getUpdatedState reads S1 or S2
        + filter MAY pass (S0 != S2) + INSERT another activity row
        → COMMIT
    Two activity rows with sequential ids and indistinguishable
    payloads (or near-indistinguishable, depending on the underlying
    entity's idempotency).

  **OPERATOR-VISIBLE MANIFESTATION**:
    A compliance reviewer reading the activity feed for data entity X
    sees TWO description-update events with the same actor + same
    diff at nearly the same timestamp. The reviewer assumes a server
    issue (mistakenly recorded twice) or a UX bug (user double-clicked,
    both recorded). Both interpretations are correct — the audit
    feed cannot distinguish them.

  **AT-SCALE MANIFESTATIONS**:
    Source 1 — Spring Retry / @Retryable: a future maintainer adding
    `@Retryable` to an @ActivityLog method (legitimate use case for
    transient DB failures) would amplify the duplicate-row rate
    proportionally to the retry count.
    Source 2 — RestTemplate / WebClient retry: a UI or programmatic
    client retrying on 5xx (any 5xx, including a transient activity
    DB error) would amplify the duplicate-row rate.
    Source 3 — Scheduler re-fire: a future scheduled job that emits
    activity rows (e.g. "weekly digest of ownership changes") and
    fires twice due to ShedLock race or operator manual re-trigger
    would emit duplicates.
    Source 4 — User double-click: the most common in UX.

  **THE FIX SHAPES** (mutually exclusive options):
    (a) Add an idempotency key to ActivityCreateEvent + a unique
        constraint on `(idempotency_key)` in the activity table.
        Caller-side: hash the (entity_id, event_type, oldState,
        newState, actor, timestamp_truncated_to_minute) and pass as
        idempotency_key. Server-side: ON CONFLICT (idempotency_key)
        DO NOTHING. Cost: schema migration; producer code change;
        carry-key-through-AspectJ.
    (b) Add a content-hash-based deduplication INSIDE the aspect:
        before emitting, query `SELECT 1 FROM activity WHERE
        data_entity_id = ? AND event_type = ? AND old_state = ? AND
        new_state = ? AND created_at > NOW() - INTERVAL '5 minutes'`;
        skip if exists. Cost: extra DB read per emit; semantic
        ambiguity (what if a legitimate second mutation produced an
        identical diff?).
    (c) Document the lack of idempotency on the activity-feed feature
        page; advise operators to deduplicate at read time.

  **PROBE-EMITTED**: per ActivityServiceImpl sidecar
  stress_findings.S-B-4, this is STATIC-INFERRED with HIGH confidence
  (saveReturning is unconditional INSERT; no `ON CONFLICT`; the aspect
  filter only catches the serial-retry case, not the true-concurrent
  case).
