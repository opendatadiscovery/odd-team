  dedup_status: net_new
  distinct_from: "PLT-042 (lineage_depth clamp — a different endpoint/parameter, same no-upper-bound CLASS / DOC-GAP-105)"
  recommended_log_as: upstream-issue (opendatadiscovery/odd-platform)
