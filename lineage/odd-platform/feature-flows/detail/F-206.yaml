feature_id: F-206
pillar_id: P-01
pillar_anchored_id: P-01:F-014
pillar_anchored_feature_name: Entity Class / Type Badge Encoding
feature_name: |-
  Entity Class / Type Badge — the operator-visible class+type encoding
  rendered as a coloured chip across Search results, Directory list,
  Detail header, Linked Entities, Lineage nodes, and every list/detail
  surface that displays a DataEntity. Anchored on the shared
  EntityClassItem + EntityTypeItem primitives — a cross-cutting widget
  that encodes the platform's primary categorical taxonomy (SET / TRANSFORMER /
  CONSUMER / QUALITY_TEST / INPUT / ENTITY_GROUP / etc.).
seeded_from: ui-review-2026-05-26
seeded_at: '2026-05-26'
discovered_from_entry_point: |-
  ui-component:EntityClassItem (the 28-line shared badge primitive at
  components/shared/elements/EntityClassItem/EntityClassItem.tsx) +
  ui-component:EntityTypeItem (the 16-line sibling at
  components/shared/elements/EntityTypeItem/EntityTypeItem.tsx). Mounted
  by the Search ResultItem, the Directory EntityItem, the
  DataEntityDetailsHeader, the LinkedEntities lists, the Lineage node
  cards, and every list/detail surface where a DataEntity is rendered —
  the platform's primary class taxonomy lives at this single widget.
