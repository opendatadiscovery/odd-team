proposed_action: |-
  Three React-Testing-Library tests:
  (a) Mount AppErrorPage with showError=true and an error envelope
  carrying url="/api/dataentities/12345/permissions"; assert the URL
  string is NOT present anywhere in the rendered DOM (no innerHTML
  match, no attribute match).
  (b) Mount with error.message="java.lang.NullPointerException at
  com.foo.Bar.baz(Bar.java:42)"; assert the message string is NOT
  in the DOM.
  (c) Mount with error.status=404, error.statusText="Not Found";
  assert both ARE in the DOM (positive contract).
  Tests (a) and (b) are GREEN today (current implementation correctly
  omits). The value is the REGRESSION-PIN — a future change that
  adds `{error.url}` or `{error.message}` to AppErrorPage.tsx
  trips these tests immediately.
