behaviour: |-
  **MEDIUM — `PUT /api/terms/{term_id}/tags` (createTermTagsRelations) produces ZERO Activity Feed entries — a term's tag changes are invisible to the audit trail. This is an ASYMMETRY within `TermServiceImpl` itself: the SAME service's sibling mutations `linkTermWithDataEntity` (`:169`) and `removeTermFromDataEntity` (`:183`) DO carry `@ActivityLog(event = TERM_ASSIGNMENT_UPDATED)`, and the data-entity tag-assignment sibling emits `TAG_ASSIGNMENT_UPDATED`. Only the term-tag path is unaudited. An operator auditing "who changed the tags on term X?" through the Activity Feed finds NO record.** Method-level primary source from the batch-X-TAGGING `createTermTagsRelations` controller-method sidecar:

  - NO `@ActivityLog` on `TermController.createTermTagsRelations` (`:129-136`), on `TermServiceImpl.upsertTags` (`:252-264`), or on any `TagServiceImpl` method it calls.
  - Sibling term mutations on the SAME controller/service DO carry `@ActivityLog` — `linkTermWithDataEntity` (`TermServiceImpl.java:169`) and `removeTermFromDataEntity` (`:183`) emit `TERM_ASSIGNMENT_UPDATED`.
  - The data-entity tag-assignment sibling (`DataEntityServiceImpl.java:358`) carries `@ActivityLog(event = TAG_ASSIGNMENT_UPDATED)`.
  - The asymmetry — term-tag change UNAUDITED, term-data-entity link AUDITED, data-entity-tag change AUDITED — is, per the sidecar, most likely an oversight: no comment, exception, or convention defends the absence.
  - Note the dataset-field tag path (`updateDatasetFieldTags`) DOES carry `@ActivityLog(event = DATASET_FIELD_TAGS_UPDATED)` with full before/after tag state — making the term-tag path the lone unaudited tag-ASSIGNMENT surface among the three.

  **Operator-visible consequence**: a stewardship investigation ("who changed term X's tags, and when?") has no answer from the Activity Feed. Compliance reports demonstrating catalog-vocabulary change history cannot be reconstructed for the term-tag surface. Compound with TEST-GAP-895: under `auth.type=DISABLED`, the term-tag path is DOUBLY invisible — no auth AND no audit.

  **Why this is a real gap, not cosmetic**: the Activity Feed is a user-facing accountability surface; an asymmetric audit story (two of three tag-assignment surfaces audited, one not) is a forensic blind spot that is invisible until an operator goes looking. The fix is well-scoped (add an `@ActivityLog` with an appropriate event type) but no test pins the current absence OR a future presence.

  **Test gap shape**: a `WebTestClient` / `@SpringBootTest` test asserting (a) `PUT /api/terms/{id}/tags` produces ZERO activity-feed rows (the current absence); (b) the sibling `linkTermWithDataEntity` DOES produce a `TERM_ASSIGNMENT_UPDATED` row (asserting the asymmetry exists); (c) the dataset-field tag path DOES produce a `DATASET_FIELD_TAGS_UPDATED` row (asserting the term-tag path is the lone unaudited tag-assignment surface). The current state is PINNED — a future maintainer adding term-tag audit instrumentation makes a coordinated, test-visible change.
