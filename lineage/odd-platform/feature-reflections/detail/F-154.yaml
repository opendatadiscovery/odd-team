# Term Create / Edit Form — product-owner reflection

## product_owner_narrative

The **Term Create / Edit form** is where an operator actually authors the catalog's
vocabulary — the single dialog that turns "I want a `finance/Customer` term" into a
real Term entity in the Data Glossary (pillar P-06; `system-mission.md:182-198`
"create a Term; assign owner / namespace; author rich description"). It is the
authoring counterpart of F-024 (the Dictionary search surface that *finds* terms): a
user opens it two ways — the **"Add term"** call-to-action on the Dictionary header
(`TermSearchHeader`) for create mode, and the **"Edit"** call-to-action on a term's
detail page (`TermDetailsHeader`) for edit mode (per F-154 feature-flow
`discovered_from_entry_point` + `chain` hop-1, TermsForm.tsx:31-219). The same
component serves both modes, branching on whether the route carries a `termId`.

The user has three fields in their hands (TermsForm.tsx:31-219, per the F-154 UI-walk
facets): a **Name** (required, non-whitespace), a **Namespace** entered through a
`NamespaceAutocomplete` combo-box (required), and a **Definition** authored in a
**Markdown editor** (required, non-whitespace, rendered via `<Markdown editor
height={200}>` at TermsForm.tsx:168-186). On submit the form dispatches
`createTerm` (`POST /api/terms`) or `updateTerm` (`PUT /api/terms/{term_id}`), which
land in `TermController` → `TermServiceImpl.createTerm` / `updateTerm`
(TermServiceImpl.java:99-117, 119-145, per the TermServiceImpl sidecar). Term-CRUD
itself is correctly RBAC-gated by `TERM_CREATE` / `TERM_UPDATE` / `TERM_DELETE`
(SecurityConstants.java:111, 174-176 — verified in the sidecar) — this dialog is NOT
in the unguarded-linkage-path class that afflicts the term-to-entity endpoints.

The working parts the operator perceives versus what the chain does are where this
feature diverges. Before submit, the form fires a **client-side duplicate check** —
on mount it fetches up to 1000 existing terms (`fetchTermsSearchResults({page:1,
size:1000})`, TermsForm.tsx:71-75) and warns if the typed name collides
(TermsForm.tsx:84-94). On submit it runs an `.unwrap().then(...)` chain with **no
`.catch`** (TermsForm.tsx:100-111), then **invalidates a react-query cache slot keyed
by the route `termId`** (TermsForm.tsx:105-108) and navigates to the new term's
detail page. Each of these three mechanisms carries a defect the F-154 feature-flow
already recorded (facets 1-3). Behind the Namespace combo-box, a *novel* namespace the
user types flows to `namespaceService.getOrCreate(namespaceName)`
(TermServiceImpl.java:103, 138) — the platform's documented `getOrCreate` soft-create
pattern (rev-8/rev-19 UX-pattern ADR: a select-or-create combo-box is a deliberate
affordance, not a side-door) — but the UI gives no signal that typing a new name will
*create* a namespace, and the backend never consults `NAMESPACE_CREATE`.

The integration story: this dialog feeds F-024 (the Dictionary search index refreshes
via `updateSearchVectors` on every create/edit, TermServiceImpl.java:324-329), feeds
F-056 (on create, `resolveUnhandledDescriptionMentions` drains any
`[[namespace:term]]` mentions that other descriptions parked before this term existed,
TermServiceImpl.java:116), and shares the F-004 stored-XSS surface (the Markdown
definition is persisted verbatim and is a third Term-specific authoring entry point
for that family). For a demo, the product owner would flag five edges a new customer
will hit within their first week: a catalog past 1000 terms where the duplicate check
silently goes blind; an edit-mode rename that collides with no warning at all; a
backend rejection that leaves the dialog frozen with no error; a `<script>` in a
definition that fires for every later viewer; and a TERM_CREATE-only operator who
silently mints platform-wide namespaces by typing them. Every one of these is the gap
between the promise the form makes and what the assembled chain delivers — and none of
them has a single test of any kind (the F-154 test_matrix is all-GAP across unit /
integration / performance / security).

