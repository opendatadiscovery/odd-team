behaviour: '`updateStatus` anonymous-username-null audit-attribution fallback — line
  117 calls `authIdentityProvider.getCurrentUser()` returning `Mono.empty()` under
  DISABLED auth mode; line 119''s `switchIfEmpty(alertRepository.updateAlertStatus(alertId,
  status, null))` proceeds with `username=null`. The audit trail loses the actor; the
  activity-feed row (via the AOP) records the change with no attribution. Combined with
  the absence of any controller-layer access check (per AlertController.changeAlertStatus
  neighbour sidecar, severity HIGH), under DISABLED an anonymous caller can mutate
  any alert with no actor attribution. The `switchIfEmpty` branch is unpinned.'
