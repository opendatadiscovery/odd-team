proposed_action: |-
  Two-PR strategy. PR-1 ships the three regression-pin tests
  (backend + UI + doc-vs-impl), all PINNING the current behaviour.
  After the tests are GREEN, decide on the fix-path:
  (a) Conservative: update the docs to say "every OPEN alert across
      the platform; per-entity Alerts tab shows the full history
      (open + resolved)" — flip the doc-vs-impl test assertion to
      match the new docs.
  (b) Progressive: add a status filter to the page (UI control
      stored in URL query param), making the docs claim achievable.
      Flip the UI regression-pin assertion to match the new
      behaviour.
  (c) Cross-link path: keep the OPEN-only filter, but update the
      page's empty-state message to read "no open alerts; see the
      per-entity Alerts tab for resolved history" with a deep-link.
      Flip the doc test assertion to match a documented design.

  Maintainer recommendation per pillar bar (DOC pillar Cornerstone 1
  — Discoverability without context): path (b) is the operator-honest
  fix. Path (a) is the minimum-velocity fix. Path (c) is the
  best-of-both for OSS velocity.
