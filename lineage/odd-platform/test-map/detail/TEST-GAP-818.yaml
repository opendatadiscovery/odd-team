behaviour: |-
  **MEDIUM — Soft-deleted DATA_ENTITY rows surface in the GET /ingestion/entities/{degOddrn} response.**

  The SELECT at `ReactiveDataEntityRepositoryImpl.java:319-322` filters `GROUP_ENTITY_RELATIONS.IS_DELETED.isFalse()` — the EDGE soft-delete — but does NOT filter the joined `DATA_ENTITY` rows by `STATUS != DELETED` or `HOLLOW = false`. A DEG that contains a soft-deleted entity returns that entity in the response.

  **Deviates from the platform's default-filters pattern**: `getDataEntityDefaultConditions` is applied across every UI-side search/listing endpoint (per existing search-facet + DataEntity sidecars) to hide soft-deleted entities from UI users. The S2S read surface here applies NEITHER `STATUS != DELETED` NOR `HOLLOW = false` — operators integrating against the S2S read see a different view of "what counts as a member" than UI users see.

  **Security dimension**: a soft-deleted entity is operationally hidden from UI users (its presence in the catalog is intentionally suppressed). An attacker with anonymous reach to this endpoint (TEST-GAP-815) can observe the existence + ODDRN + DataEntityType of every soft-deleted entity in any DEG. The data is "intentionally hidden" but mechanically accessible.

  **Promoted from LOW (the sidecar rates this MEDIUM) to MEDIUM** because: the leak compounds with the unauthenticated reach (TEST-GAP-815) AND the cross-owner enumeration (TEST-GAP-816). The composition is: attacker enumerates ANY DEG → sees EVERY ITS member including soft-deleted ones → builds a fuller catalog map than UI users see. The deviation from the default-filters pattern is silent — there is no comment in the repository code defending the choice.

  **Test gap shape**: regression-pin test that:
  1. Creates a DEG with 3 active members + 2 soft-deleted members.
  2. Asserts the GET response includes all 5 members.
  3. Asserts the equivalent `/api/dataentities/...` UI-side query returns 3 members only.

  PINS the asymmetry; pairs with REFACTOR-NNN (add `STATUS != DELETED` + `HOLLOW = false` to the SQL — or document the deviation explicitly as intended).
