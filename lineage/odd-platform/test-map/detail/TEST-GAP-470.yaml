proposed_action: |-
  Testcontainers integration test. Spy or wrap PGConnectionFactory; inject a throwing HousekeepingJob. Invoke runHousekeepingJobs(). Assert (a) PGConnectionFactory.getConnection() called exactly once, (b) Connection.close() called exactly once even though the inner job threw, (c) HikariCP's pool size metric is unchanged (the connection did NOT come from HikariCP). Pins the DriverManager-not-Hikari + try-with-resources cleanup contract.
