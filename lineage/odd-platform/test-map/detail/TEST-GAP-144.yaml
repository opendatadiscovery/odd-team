gap_id: TEST-GAP-144
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java LoginFormSecurityConfiguration config-key-consumer:auth.type@L31
surfaced_by:
- LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[5]
- LoginFormSecurityConfiguration@L31.md:security.known_security_gaps.[2]
behaviour: 'Plaintext credentials leak via `/actuator/env`: `auth.login-form-credentials`
  is resolved at boot as a plain string; `management.endpoint.env.enabled: true` is
  the shipped default; `/actuator/health` is permit-all''d in LOGIN_FORM''s chain
  (line 50). If the operator inadvertently exposes the management port to the network
  without restricting `/actuator/env`, credentials leak.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/LoginFormCredentialsLeakViaEnvTest.java
  name: loginForm_anonymousActuatorEnv_disclosesAuthLoginFormCredentialsKey
evidence:
- 'LoginFormSecurityConfiguration@L31.md says: ''Plain-text credentials in auth.login-form-credentials
  resolved at boot → any caller able to read the platform''s resolved environment
  (e.g. /actuator/env if management.endpoint.env.enabled: true ... which is the shipped
  default) sees the credentials'''
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[6]
proposed_action: Send anonymous `GET /actuator/env` under `auth.type=LOGIN_FORM`;
  assert response body contains the key `auth.login-form-credentials` (Spring masks
  the VALUE but the key existence is disclosed). Locks the leakage surface.
