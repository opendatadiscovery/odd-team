feature_id: F-035
name: Operator-Configured Additional Links
pillar_anchored_id: P-08:F-009
discovered_at_batch: ZE
discovered_at_commit: 25e66b1
discovered_from_entry_point: "ui_route:* \u2014 every page that renders AppToolbar mounts AppInfoMenu which\nfires GET /api/links via TanStack Query."
terminal_side_effect:
  side_effect_class: page-render
  description: "page-render \u2014 LinkList items[]{title,url} renders as `<a target='_blank'>`\ninside the App Info menu (toolbar information icon) at AppInfoMenu.tsx:60-66."
contributing_nodes:
- node_id: odd-platform java LinksController controller-class:LinksController
  role: controller-class
  enriched_at_batch: ZE
  sidecar: lineage/odd-platform/understanding/odd-platform__java__LinksController__controller-class__LinksController.md
- node_id: odd-platform java config:AdditionalLinkProperties
  role: config-properties-class
  unresolved: true
  note: '@ConfigurationProperties("odd"); record-of-record at boot'
- node_id: odd-platform ts react-component:AppInfoMenu.tsx
  role: ui-render-surface
  unresolved: true
  note: inline-verified in LinksController sidecar lines 18, 55-69, 60-66
- node_id: odd-platform yaml config:application.yml
  role: config-source
  note: odd.links[].{title,url}
amplification_factor: 1
amplification_note: '1 per AppToolbar mount. TanStack Query default staleTime=0 triggers a refetch

  on every component remount even though the underlying list is boot-time immutable.'
observed_vs_expected:
  facets:
  - facet_id: reverse_tabnabbing_target_blank_without_rel_noopener_noreferrer
    drift_class: ui_security_default_missing_against_operator_configured_external_url
    severity: MEDIUM
    observed: 'AppInfoMenu.tsx:60-66 renders `<Link target=''_blank''>` with NO

      rel=''noopener noreferrer''. Operator-configured URLs can use

      window.opener to navigate the ODD Platform tab to a phishing page.'
    operator_visible_consequence: 'Bounded by trust of who controls odd.links config; amplified if operator

      config is editable by a less-trusted role.'
  - facet_id: url_scheme_not_validated_javascript_data_uris_passthrough
    drift_class: input_passthrough_no_schema_allowlist
    severity: MEDIUM
    observed: 'AdditionalLinkProperties.java:8 `record Link(String title, String url)`

      has NO @URL constraint, no @Pattern. React 17+ neutralises javascript:

      in <a href> but data:text/html,... still renders in some browsers.'
  - facet_id: config_properties_boot_time_only_runtime_yaml_change_silent_until_restart
    drift_class: boot_immutable_drift_no_actuator_refresh_path
    severity: LOW
    observed: 'AdditionalLinkProperties bound once at boot; /actuator/refresh not in

      default actuator exposure per application.yml:228-231.'
  - facet_id: disabled_mode_anonymous_links_disclosure
    drift_class: disabled_mode_bypass
    severity: LOW
    observed: "Under DISABLED the configured link list (potentially containing\ninternal-network URLs \u2014 runbooks, Grafana, wikis) is anonymously reachable."
