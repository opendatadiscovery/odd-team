proposed_action: |-
  Testcontainers integration test. (a) Authenticate user A. (b) POST /api/search → A receives session_id S. (c) Query `SELECT last_accessed_at FROM search_facets WHERE id = S` → record timestamp T1. (d) Sleep 100ms. (e) GET /api/search/S. (f) Query `SELECT last_accessed_at FROM search_facets WHERE id = S` → record T2. (g) Assert T2 > T1 (the UPDATE-on-read fired). (h) Sleep 100ms. (i) GET /api/search/S/facet/OWNERS?page=1&size=10. (j) Query `SELECT last_accessed_at FROM search_facets WHERE id = S` → record T3. (k) Assert T3 > T2 (facet GET also writes). (l) Test comment 'LOCKS the GET-is-a-WRITE contract for search-session reads as of 2026-05-19. The last_accessed_at field is updated but not consumed (no TTL eviction). When the TTL eviction job is added, this test stays green AND a new test verifies eviction; when the UPDATE-on-read is removed, this test FLIPS to expect T1==T2==T3.'
