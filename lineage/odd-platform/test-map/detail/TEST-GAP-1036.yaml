behaviour: |-
  **HIGH — CREATE-DTO submitted to UPDATE endpoint. The form
  conflates CREATE and UPDATE shapes; the discarded field is
  invisible to the user but visible on the wire.**

  `LookupTableForm.tsx:49` types form data as
  `LookupTableFormData` — the CREATE shape with REQUIRED
  `namespaceName: string`. On edit (lines 60-66), the form submits
  the SAME shape to `editLookupTable({lookupTableUpdateFormData:
  data, ...})`. The OpenAPI contract for UPDATE
  (`LookupTableUpdateFormData`, components.yaml:3853-3862) defines
  ONLY `name` + `description` — `namespace_name` is NOT in the
  schema.

  **What actually happens on the wire**: the request body on every
  edit includes `{name, description, namespace_name}` — the
  namespace_name is sent. Spring's WebFlux Jackson binding (per
  the project default — no strict-binding configuration found in
  the platform) is lenient by default: unknown JSON fields are
  silently ignored on deserialisation. So `namespace_name` is sent
  but silently discarded by the server.

  **The form-visual `disabled={!!lookupTable}` (line 120) hides
  this from the user**. The Namespace field IS rendered (so the
  user sees what the table's namespace is) but is greyed out and
  unfocusable. The UX signal: "this field is not editable in
  this mode". The wire signal: "this field is on the wire on
  every submission".

  **Why HIGH**:
  - **Schema drift**: the UI does not respect the OpenAPI schema
    boundary. A future contract tightening (Jackson FAIL_ON_UNKNOWN_PROPERTIES
    flipped to true; or the schema getting `additionalProperties:
    false`) breaks every UPDATE silently. The form would 400 and
    no test would catch the regression at PR time.
  - **Doc-side drift**: the live doc page at
    `https://docs.opendatadiscovery.org/features/master-data-management/lookup-tables`
    (WebFetched 2026-05-26 status 200) describes LOOKUP_TABLE_UPDATE
    as "Renaming a lookup table or editing its description" —
    implying namespace is NOT updateable. An operator inspecting
    the network tab during an edit sees namespace_name on the
    wire and concludes the docs are wrong (or worse, that they
    CAN edit namespace via curl).
  - **Forensic-integrity**: any future audit log of the UPDATE
    payload (e.g. via a Spring `@RequestBody` log filter) records
    a misleading `namespace_name` field that was never honoured.
    Investigators reading the log assume an UPDATE-with-namespace
    was attempted; the wire-level data tells a different story
    than the actual behaviour.
  - **Trivial fix**: change the form's submit handler to construct
    a `LookupTableUpdateFormData` (just `{name, description}`) on
    the edit branch. One line of code.

  **Probe P-191** (emitted in batch ZL): boot the platform, edit
  an existing lookup table, inspect the PUT request body,
  observe `namespace_name` on the wire. Probe RED today
  (namespace_name present); GREEN after the fix (only name +
  description on the wire).

  **Cross-pillar pattern**: this is the second instance of
  "frontend submits a CREATE-shape DTO to an UPDATE endpoint
  that the server silently truncates" found in this batch
  series. The architectural recommendation is to enforce strict
  Jackson binding (FAIL_ON_UNKNOWN_PROPERTIES=true) globally;
  this surfaces every silent-discard at request time. Surface
  as REFACTOR-NNN candidate.

  **Compounds with TEST-GAP-697** (
  DataSourceIngestionServiceImpl SILENTLY DROPS PAYLOAD
  namespace_name) — that's a backend silent-discard of the SAME
  namespace_name field on a DIFFERENT endpoint
  (/ingestion/datasources). The systemic pattern: the platform
  has a recurring "namespace_name is silently dropped" failure
  mode across multiple surfaces.
