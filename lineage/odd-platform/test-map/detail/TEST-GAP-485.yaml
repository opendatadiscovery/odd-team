behaviour: |-
  DEG-propagation path is ENTIRELY uncovered. No test sets `formData.propagate = true` and verifies (a) `dataEntityRepository.get(dataEntityId)` is invoked, (b) the `DATA_ENTITY_GROUP` entity-class membership check (`ArrayUtils.contains(pojo.getEntityClassIds(), DATA_ENTITY_GROUP.getId())` at line 127) is exercised, (c) the cascade reads `groupEntityRelationRepository.getDEGEntitiesOddrns(dataEntityId)` and `dataEntityRepository.listByOddrns(...)`, (d) the per-child `OwnershipPojo` construction with the parent's `(owner_id, title_id)` is correct, (e) `ownershipRepository.createOrUpdate(pojos)` is invoked on CREATE-side propagation (with title-overwriting per batch-H), (f) `ownershipRepository.deleteByDataEntityAndOwner(pojos)` is invoked on DELETE-side propagation. NO test asserts the non-DEG short-circuit (silent no-op when entityClassIds does NOT contain DATA_ENTITY_GROUP). NO test asserts the empty-children short-circuit. The DEG-propagation cascade is the load-bearing P-01+P-08 cross-pillar feature for managing ownership on a Data Entity Group. Cross-references batch-H repository sidecar's title-overwriting `createOrUpdate` semantics.
