supersedes:
  - claim: 'createOwner sidecar bugs_limitations_corner_cases.[2] + security.known_security_gaps.[2]
      (severity MEDIUM each) — both claim that `owner.name UNIQUE` is non-partial AND
      that ''Soft-deleted owners block re-creation under the same name''.'
    correction: 'WRONG. The unique index IS partial. `V0_0_64__remove_is_deleted_field.sql:68-70`
      does `DROP INDEX IF EXISTS owner_name_unique; CREATE UNIQUE INDEX IF NOT EXISTS
      owner_name_unique ON owner (name) WHERE owner.deleted_at IS NULL;` — the predicate
      excludes soft-deleted rows. After soft-delete via `DELETE /api/owners/{owner_id}`,
      the name is FREED and a subsequent `POST /api/owners` with the same name succeeds.
      The partial-unique-index pattern is the SAME as `policy_name_unique` /
      `role_name_unique` / `tag_name_unique` / `title_name_unique` in the same
      migration. The createOwner sidecar''s MEDIUM-severity claim is fully superseded.'
    superseded_by: deleteOwner sidecar (batch P, session-2026-05-20-P) — coherence_summary.supersedes
    evidence:
      - 'V0_0_64__remove_is_deleted_field.sql:68-70 — `CREATE UNIQUE INDEX IF NOT EXISTS owner_name_unique ON owner (name) WHERE owner.deleted_at IS NULL;`'
      - 'deleteOwner.md (batch P):docs_link_semantic.doc_drift_findings.[3] — explicit cross-batch correction note'
      - 'deleteOwner.md (batch P):requires-runtime — `partial unique index on name` listed verbatim'
      - 'updateOwner.md (batch P):dependencies_semantic.requires-runtime — same partial-unique-index citation'
      - 'updateOwner.md (batch P):bugs_limitations_corner_cases.[2] — confirms USR003-via-partial-unique-on-rename path'
    impact:
      - 'The createOwner sidecar''s severity MEDIUM claim on this concern should be downgraded to RESOLVED.'
      - 'The recovery story (delete-then-recreate-with-same-name) is now CONFIRMED across three sidecars (createOwner, updateOwner, deleteOwner) — a legitimate operator workflow.'
      - 'The partial-unique index applies symmetrically across the four entities (owner / policy / role / tag) — useful pattern reference for future canonicalisation.'
notes: 'Operation vocabulary captured for future DOC-NNN follow-ups on
  `/authorization/owners`. The live owners page documents what an
  Owner IS but explicitly disclaims coverage of: creation mechanics,
  OWNER_CREATE permission, association-request mechanics, sprawl
  prevention. Five doc-drift findings flow from this operation
  (createOwner.md:docs_link_semantic.doc_drift_findings.[0-2]).

  **Batch P SUPERSEDE NOTE (2026-05-20)**: the createOwner sidecar''s
  prior claim that `owner.name UNIQUE` is non-partial — and the
  derived security/usability concerns about soft-deleted owners
  blocking re-creation — were INCORRECT. The partial-unique-index
  pattern at `V0_0_64__remove_is_deleted_field.sql:68-70` makes the
  index conditional on `deleted_at IS NULL`, so soft-deleted owners
  do NOT reserve their name against future re-creation. The
  recovery workflow (delete-then-recreate-with-same-name) is
  legitimate and intentional, mirroring the partial-unique pattern
  applied uniformly across owner / policy / role / tag / title in
  the same migration. The two superseded findings should be cleared
  from createOwner.md on the next sidecar refresh.

  This SUPERSEDE is captured at the operation level (rather than
  individually rewriting the sidecar) because the operation is the
  cross-batch concept-catalog entry; future readers of this
  operation arrive HERE first, and the SUPERSEDE block immediately
  surfaces the correction.
  '
