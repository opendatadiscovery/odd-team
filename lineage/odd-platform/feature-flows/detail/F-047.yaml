  - bulk_replace_enum_value_no_concurrency_control_last_writer_wins
companion_to:
  - feature_id: F-004
    relationship: per-entity-vs-per-column-twin
    note: |-
      F-004 anchors the PER-ENTITY description editing surface (markdown
      XSS-class verbatim storage). F-047 is the PER-COLUMN twin —
      same XSS-class fingerprint, separate render path
      (DatasetField description in the Structure tab).
discovered_from_entry_point: |-
  rest:7 endpoints under /api/datasets/{data_entity_id}/fields/{dataset_field_id}/*
  (DatasetFieldController) — three PUTs (description, internal-name,
  tags), one POST (enum_values bulk-replace), two GETs, two
  term-related (POST term, DELETE term).
  UI entry-point: per-column row on the Structure tab of the data
  entity detail page; clicking a column opens the per-column edit panel.
