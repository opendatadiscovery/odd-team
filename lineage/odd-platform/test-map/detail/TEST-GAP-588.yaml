proposed_action: |-
  Unit test on GoogleUserHandler with mocked `OidcUser` + `OidcUserRequest`. Cases: (a) provider.allowedDomain='odd.com' + IdToken.hd='other.com' → OAuth2AuthenticationException with code='invalid_token'; (b) provider.allowedDomain='odd.com' + IdToken.hd=null (personal @gmail.com) → REJECTED; (c) provider.allowedDomain='odd.com' + IdToken.hd='ODD.COM' → ACCEPTED (case-insensitive); (d) provider.allowedDomain=null + IdToken.hd='anything' → ACCEPTED (skip check); (e) Defence-in-depth: even if test mocks the URL hint as bypassed, the handler still enforces. Pin all five branches.
