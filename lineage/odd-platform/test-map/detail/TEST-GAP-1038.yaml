behaviour: |-
  **MEDIUM — Catalog-cardinality info-leak on the global Lookup
  Tables H1 counter.**

  `LookupTables.tsx:60-62` renders the page H1:
  ```jsx
  <NumberFormatted value={facets?.total} />
  {' '}{t('lookup tables overall')}
  ```

  `facets.total` is populated by
  `LookupDataSearchServiceImpl.countByState` (line 62-68) which
  counts ALL reference-data rows matching the current facet
  state (initially empty / open query). There is NO owner-filter,
  NO namespace-scope, NO per-permission filter applied on the
  COUNT query — it returns the catalog-wide population size.

  **Operator-visible consequence**: every authenticated user (in
  the read-collaborative posture per the ReferenceDataController
  sidecar batch H known_security_gaps[0]) sees the global lookup-
  table count. A tenant with 1,247 lookup tables has that number
  visible to every authenticated user — even users who:
  - Cannot CREATE lookup tables (no LOOKUP_TABLE_CREATE)
  - Cannot UPDATE existing tables (no LOOKUP_TABLE_UPDATE)
  - Cannot DELETE tables (no LOOKUP_TABLE_DELETE)
  - Cannot edit DEFINITION or DATA tiers (6 missing inner gates
    per TEST-GAP-1001)

  **The TRUE info-leak shape** is this: an external operator
  conducting reconnaissance (e.g. one of multiple consultancies
  given temporary platform access) cannot enumerate the rows
  themselves (the list is paginated and the row contents may
  require additional permissions), but they CAN observe the
  COUNTER. Two such operators visiting the same tenant a week
  apart can compare counters and infer "lookup tables were added/
  deleted between visits — what changed?" — a catalog-cardinality
  oracle.

  **Why MEDIUM** (not HIGH):
  - The information leak is bounded — a SINGLE NUMBER. The
    table contents are NOT exposed via this surface.
  - The read-collaborative posture is the documented intent
    per ReferenceDataController sidecar; this is consistent
    with the broader pillar's open-to-read design.
  - The doc page at
    `https://docs.opendatadiscovery.org/features/master-data-management/lookup-tables`
    (WebFetched 2026-05-26 status 200) does not explicitly
    document the count visibility, but the page's general
    "every lookup table the user can read" phrasing implies
    enumeration is possible.
  - The structural fix is per-permission filtering on
    countByState (gate on LOOKUP_TABLE_DATA_READ at minimum) —
    a non-trivial backend refactor that touches the facet
    aggregator.
  - The MEDIUM rating reflects "info-leak is real and operator-
    observable, but the leak surface is narrow and the
    documented posture explains the openness".

  **The COMPOUND with TEST-GAP-1001 + TEST-GAP-994** (route's
  WithPermissionsProvider non-blocking + partial permission
  enumeration): a user with ZERO of the 9 LOOKUP_TABLE_*
  permissions visits /master-data/lookup-tables, sees the
  counter, sees the search input, sees the list (paginated),
  but cannot Add (button hidden), cannot Edit (action gated),
  cannot Delete (action gated). The page is "look-but-don't-
  touch" — but the LOOKING is the leak. The doc page does
  not enumerate this posture.

  **Test gap shape**:
  1. **UI regression-pin (existence of counter)**: render
     <LookupTables/> with a user fixture having ZERO
     LOOKUP_TABLE_* permissions, assert the H1 counter STILL
     renders with the catalog-wide count. PINS the current
     posture; flips if the fix-path makes the counter
     permission-gated.
  2. **Backend regression-pin (countByState)**: GET
     /api/referencedata/search/{id} with an empty query as a
     user with zero LOOKUP_TABLE_* permissions; assert the
     response includes `total` matching the catalog-wide
     count. PINS the backend posture.
