status_reason: |-
  All facets are file:line confirmable from primary source. The
  slice-then-sort pattern is the exact same `.slice(0, visibleLimit).sort(...)`
  shape on three sibling components (OverviewTags.tsx:54-65,
  OverviewTerms.tsx:48-58, OverviewGroups.tsx:49-54). Operator-observable
