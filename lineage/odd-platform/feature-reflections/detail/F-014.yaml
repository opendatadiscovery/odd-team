        section: invariants (USER_OWNER_MAPPING DELETED_AT IS NULL join) + implicit_adrs[2]
        cite: "ReactiveAlertRepositoryImpl.java:83-86, 499-502"
        note: "username → owner via LEFT JOIN; NULL owner on unlink → raw username durable on the row"
    operator_visible_failure: |
