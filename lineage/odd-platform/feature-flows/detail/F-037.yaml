batch_extensions:
- batch: ZH
  entry_point_added: |-
    route-module:routes/dataModelling/relationshipsRoutes.ts — the URL-shape
    contract declaring `relationshipsPath()` = '/data-modelling/relationships'.
    Sibling to F-025's `queryExamplesRoutes.ts` under the shared `BASE_PATH`
    module (dataModelling.ts:3). DataModellingRoutes.tsx:40 mounts
    `<Route path='relationships' element={<Relationships />} />` — a BARE
    route with NO `WithPermissionsProvider` wrapping (contrast lines 19-25
    + 31-37 which DO wrap the query-examples sub-routes).
  contributing_nodes_added:
  - odd-platform ts routes route:dataModelling
  notes: |-
    hop-0 (UI route module) PRIMARY-SOURCE resolved this batch via the
    batch-ZH dataModelling route sidecar. The route layer CORROBORATES
    F-037's existing `no_authorization_gate_at_any_layer_full_catalog_visibility`
    HIGH-severity finding from the UI direction:
    (a) The `/data-modelling/relationships` route is UNGATED end-to-end at
        the UI layer too — no `<WithPermissionsProvider>` wrapper at
        DataModellingRoutes.tsx:40, no `<WithPermissions>` block around
        Relationships.tsx, no SECURITY_RULES entry for `/api/relationships/**`
        (verified by reading SecurityConstants per the batch-ZH dataModelling
        sidecar security.known_security_gaps[1]). Any authenticated user
        sees every relationship across every data source.
    (b) The live doc (`https://docs.opendatadiscovery.org/features/data-modelling`
        WebFetched 2026-05-26 status 200) describes Relationships as
        "entity-to-entity links rendered as ERD diagrams" — confirms F-037's
        pillar anchor (P-02 sub-feature seed "Relationships and ERDs" per
        system-mission.md:119). The doc DOES NOT specify view permissions
        for Relationships — consistent with the code's end-to-end ungated
        posture; the doc-side silence is the surfaced doc-gap.
    (c) The route module exposes the URL unconditionally; the AppToolbar
        tab "Data Modelling" navigates to QueryExamples (the canonical
        first tab per the redirect at DataModellingRoutes.tsx:16) —
        Relationships is reachable only via the in-page tab
        (DataModellingTabs.tsx:13-22) or direct URL.

    Coherence sweep STRENGTHENS=2:
    - F-037 `no_authorization_gate_at_any_layer_full_catalog_visibility` —
      now extended UI-layer: route declaration + UI shell + backend all
      consistently ungated.
    - F-005 sibling — Relationships participate in the lineage graph
      alongside lineage edges (per system-mission.md P-02 cross-pillar
      feeds P-05); the lineage REFACTOR-203 cross-owner enumeration
      finding shares the same architectural posture.

- batch: ZI
  entry_point_added: |-
    ui_route:/data-modelling/relationships — URL-shape contract module
    `routes/dataModelling/relationshipsRoutes.ts` (7 lines) exporting
    `relationshipsPath()` which returns the literal
    `/data-modelling/relationships`. Mounted at
    `DataModellingRoutes.tsx:40` as
    `<Route path='relationships' element={<Relationships />} />` — BARE,
    NO `WithPermissionsProvider` wrapper (contrast siblings at
    DataModellingRoutes.tsx:19-25 and 31-37 which DO wrap the
    query-examples sub-routes). Consumed at exactly two sites:
    `DataModellingTabs.tsx:19` (the in-page Sidebar tab, second after
    Query Examples) + the inner Routes literal (HARD-CODED, not derived
    from `relationshipsPath()`). hop-0 UI entry-point of the
    Relationships list page; the AppToolbar "Data Modelling" tab
    deep-links to QueryExamples (the canonical first tab) — Relationships
    is reachable ONLY via the secondary in-page tab or direct deep-link.
  contributing_nodes_added:
  - odd-platform ts routes route:relationships
  notes: |-
    The route module sidecar
    (session-2026-05-26-ZI-relationships-route) corroborates F-037's
    existing `no_authorization_gate_at_any_layer_full_catalog_visibility`
    posture from the UI direction AND surfaces a HIGH-SEVERITY
    STATICALLY-VISIBLE UI BUG plus FOUR additional findings:

    (1) **NEW HIGH-SEVERITY UI BUG — TARGET COLUMN ON RELATIONSHIPS LIST
    DISPLAYS SOURCE DATA**.
    `RelationshipsListItem.tsx:73-81` renders the Target cell with
    `dataEntityId={item.sourceDataEntity.id}` +
    `name={item.sourceDataEntity.internalName || item.sourceDataEntity.externalName || ''}` +
    `oddrn={item.sourceDataEntity.oddrn || ''}` — identical to the
    Source cell at lines 64-72. The `item.targetDataEntity` field IS
    present on the `DataEntityRelationship` interface and IS consumed
    correctly by sibling components at
    `elements/Relationships/RelationshipTypes/EntityRelationship.tsx:33-35`
    and `RelationshipTypes/GraphRelationship.tsx:32-34`. The bug is a
    COPY-PASTE in the list-item renderer; the user sees the same
    dataset in BOTH columns for every row. The live doc at
    `https://docs.opendatadiscovery.org/features/data-modelling/relationships`
    (WebFetched 2026-05-26 status 200) describes the table as having
    distinct "Source entity, Target entity" columns — the doc is
    CORRECT; the code is WRONG. The user cannot see what each
    relationship POINTS TO from this list page. Backend correctness
    unaffected; bug is in the row renderer only. P-167 Block D pins
    the runtime observation. NEW DRIFT FACET to add to
    drift_class_summary:
    `relationships_list_target_column_copy_paste_renders_source_data_doc_correct_code_wrong`.

    (2) F-037 EXISTING `no_authorization_gate_at_any_layer_full_catalog_visibility`
    REAFFIRMED AT UI ROUTE TIER (HIGH, refinement). The route at
    `DataModellingRoutes.tsx:40` is UNWRAPPED end-to-end at the UI
    layer too: no `<WithPermissionsProvider>` wrapper, no
    `<WithPermissions>` block around `Relationships.tsx`, no
    SECURITY_RULES entry for `/api/relationships/**` (verified by
    reading SecurityConstants per the batch-ZH dataModelling sidecar).
    Any authenticated user sees every relationship across every data
    source; under `auth.type=DISABLED` any caller does. The doc-side
    silence on visibility is the operator-relevant DOC-GAP-NNN
    candidate.

    (3) NEW UI-TIER DRIFT FACET — `size: 30` HARD-CODED AT `Relationships.tsx:23`
    (LOW, ux limitation). No URL parameter, no user-configurable
    control, no client-side override. A power-user on a large catalog
    cannot increase page size to reduce scroll fatigue; a small-catalog
    operator cannot decrease it for visual density. The 30 matches
    the documented value but a runtime-tunable would be more flexible.

    (4) NEW UI-TIER DRIFT FACET — INNER ROUTES LITERAL DECOUPLED FROM
    `relationshipsPath()` (LOW, structural fragility).
    `DataModellingRoutes.tsx:40` hard-codes the sub-path `'relationships'`;
    `relationshipsRoutes.ts:5` concatenates it against `BASE_PATH`.
    Refactoring `relationshipsPath` to return
    `/data-modelling/relations` (typo) would update the toolbar tab
    href but NOT the mount path; the user clicking the tab would land
    on a route that no longer exists. Same shape as the ZH parent
    sidecar's `silent sibling coupling` finding.

    (5) NEW UI-TIER OBSERVATION — `?q` AND `?type` QUERY PARAMS ARE
    URL-STATE WITH SEARCH SCOPE LIMITATION (LOW, search-scope drift).
    `?q` free-text search filter binds at the SQL layer to
    `DATA_ENTITY.EXTERNAL_NAME.containsIgnoreCase` on the
    relationship-class data_entity row at
    `ReactiveDataEntityRelationshipRepositoryImpl.java:69` (per ZE
    sidecar) — matches relationship-row external_name, NOT
    source/target entity names. The UI label is "Search relationships"
    (`RelationshipsSearchInput.tsx:17`) which aligns with the SQL
    behaviour — but the doc page does describe a "Search functionality
    for filtering by name" without specifying which name. STRENGTHENS
    F-037's existing
    `search_query_filters_relationship_name_not_source_target_entity_names`
    facet from the UI-route angle.

    (6) NEW UI-TIER DRIFT FACET — DOC OVERSTATES TYPE-SPECIFIC ROW-CLICK
    ROUTING (MEDIUM, doc-drift). The live doc says "Users can click
    any row to open the relationship's detail page, with routing
    determined by the relationship type." The code at
    `RelationshipsListItem.tsx:52` ALWAYS navigates to
    `dataEntityDetailsPath(item.id)` (the data-entity overview page),
    NOT to a relationship-type-specific detail URL. The ZE-documented
    endpoints `/api/relationships/erd/{id}` and
    `/api/relationships/graph/{id}` are reached by the data-entity
    overview page's relationship-card rendering, NOT by the row click
    on this list page. The doc's "routing determined by the
    relationship type" phrasing is misleading. NEW DRIFT FACET
    candidate:
    `relationships_list_row_click_doc_says_type_specific_routing_code_always_navigates_to_data_entity_overview`.

    Probe emitted by the sidecar: P-167 pins (Block A) the route render
    for a reader-only user with no write permissions; (Block B+C) the
    `?type` tab switch translates into distinct backend calls and row
    subsets; (Block D) the Target column copy-paste bug at runtime.

    Coherence sweep STRENGTHENS=2 (F-037 existing
    `no_authorization_gate_at_any_layer_full_catalog_visibility` +
    `search_query_filters_relationship_name_not_source_target_entity_names`
    facets reaffirmed; F-025 sibling — query-examples and relationships
    share the BASE_PATH + the asymmetric WithPermissionsProvider
    wrapping pattern). SUPERSEDES=0. CONFLICTS=0.
- batch: ZL
  entry_point_added: |-
    react-component:DataModelling (the COMPONENT-LAYER pillar root
    that composes BOTH F-025 Query Examples + this F-037 Relationships
    surface). 17-line two-column shell at App.tsx:74. The
    Relationships sub-feature is reached via DataModellingTabs.tsx:17-22
    (second sidebar entry) + DataModellingRoutes.tsx:40 — the
    Relationships inner Route is BARE (no WithPermissionsProvider
    wrapper, contrast lines 19-25 + 31-37 for query-examples).
    This is the COMPONENT-LAYER confirmation of F-037's existing
    `no_authorization_gate_at_any_layer_full_catalog_visibility`
    facet — the asymmetric route-mount shape (query-examples wrapped
    + relationships bare) is the structural cause.
  contributing_nodes_added:
  - odd-platform ts react-component component:DataModelling
  notes: |-
    The batch-ZL DataModelling.tsx + DataModellingRoutes.tsx
    primary-source walk closes F-037's pillar-root composition tier.
    Three findings — two reaffirm existing facets, one is a NEW
    cross-pillar observation:

    (1) F-037 `no_authorization_gate_at_any_layer_full_catalog_visibility`
    REAFFIRMED AT COMPONENT LAYER (HIGH, refinement). The asymmetric
    permission wrapping at DataModellingRoutes.tsx is now PRIMARY-SOURCE
    confirmed at the component tier — lines 19-25 wrap `query-examples`
    in `<WithPermissionsProvider allowedPermissions=[QUERY_EXAMPLE_CREATE]>`,
    lines 31-37 wrap `query-examples/:queryExampleId` in
    `<WithPermissionsProvider allowedPermissions=[QUERY_EXAMPLE_UPDATE,
    QUERY_EXAMPLE_DELETE]>` BUT line 40 declares
    `<Route path='relationships' element={<Relationships />} />` BARE,
    NO `<WithPermissionsProvider>`, NO `<WithPermissions>` block. The
    asymmetry is INTENTIONAL by the route author — there is NO
    `RELATIONSHIP_VIEW` / `RELATIONSHIP_*` permission in the Permission
    enum (verified — Grep returned no matches), so a route-level gate
    has nothing to anchor against. The structural cause is the
    ABSENCE of a Relationships read permission, NOT this component.
    But the COMPOSITION SURFACES the asymmetry to the operator: any
    authenticated user reaching `/data-modelling/relationships` sees
    every relationship across every data source; under DISABLED any
    caller does. STRENGTHENS F-037's existing facet with the
    component-tier structural-cause anchor.

    (2) NEW UI-COMPONENT-TIER OBSERVATION — RELATIONSHIPS TAB SHOWN
    IN SIDEBAR EVEN WHEN OPERATOR LACKS ALL QUERY_EXAMPLE_*
    PERMISSIONS (LOW, asymmetric permission exposure). The DataModellingTabs.tsx
    Sidebar renders BOTH tabs (Query Examples + Relationships)
    unconditionally for any authenticated user reaching the route.
    A READ_ONLY operator with no QUERY_EXAMPLE_* permissions still
    sees the Query Examples tab (and the list inside it, modulo the
    Add button gate); they ALSO see the Relationships tab (and the
    full Relationships list inside, with no per-action gate). The
    Sidebar makes the Relationships feature DISCOVERABLE even to
    operators whose role grants them no Query Examples ability —
    but THAT pillar (P-02 Relationships) genuinely has no view
    permission to enforce; the discovery is intentional. The
    operator-mental-model gap is that a READ_ONLY role grants
    SAME visibility on Relationships as an ADMIN role — there is
    no view-level discrimination. NEW DRIFT FACET to add to
    drift_class_summary —
    `data_modelling_sidebar_renders_relationships_tab_unconditionally_no_relationship_view_permission_exists_to_gate_against_operator_mental_model_asymmetric_with_query_examples_permission_gating`.

    (3) `lvh` VIEWPORT UNIT + 3REM TOOLBAR-HEIGHT LITERAL COUPLING
    (LOW, structural fragility). The component renders the Sidebar
    with `$position='sticky'` which depends on
    `LayoutContainer`'s `overflow: auto` + `height: calc(100lvh -
    3rem)` (layout.ts:3-11). If LayoutContainer's `overflow` is
    changed to `visible` OR its `height` is removed, sticky
    positioning degrades silently across EVERY pillar using this
    shell (Alerts, Activity, Management, MasterData, DataModelling).
    The `3rem` literal is HARDCODED — it does not consume the
    `toolbarHeight` from lib/constants; refactor of toolbarHeight
    requires parallel edit to layout.ts. Cross-pillar coupling
    documented for refactor awareness. NOT specific to F-037 but
    surfaced here because the DataModelling sidecar walks this
    chain. STRENGTHENS F-037 with the layout-coupling observation.

    Coherence sweep STRENGTHENS=2 — F-037 existing
    `no_authorization_gate_at_any_layer_full_catalog_visibility`
    extended to component tier; F-025 sibling (Query Examples) gets
    the same DataModelling composition root added at this batch.
    SUPERSEDES=0. CONFLICTS=0.

    No new probes emitted from this component (findings are
    statically certain from JSX inspection). F-037 retains its
    existing P-128 / P-130 / P-131 + the batch-ZI P-167 probe.

