  - node_id: odd-platform ts react-component:HierarchyLineage
    role: ui-non-deg-renderer
    sidecar: '(referenced from Lineage.tsx coupling)'
    note: Single non-DEG renderer; no class-aware sub-components.
  - node_id: odd-platform ts react-component:LineageGraph
    role: ui-rendering-layer
    sidecar: lineage/odd-platform/understanding/odd-platform__ts__react-component__component__LineageGraph.md
    note: |-
      bugs[7]: "Microservices ARE data entities... same `<Lineage />` component,
      same `/api/dataentities/{id}/lineage/downstream` endpoint. No mode flag,
      no class-based override... microservices-specific affordances (e.g. service
      name vs operation name, trace timing) are NOT rendered — they are silently
      dropped if the response has them."
  - node_id: odd-platform java service:LineageServiceImpl
    role: backend-service
    sidecar: lineage/odd-platform/understanding/odd-platform__java__service__service__LineageServiceImpl.md
    note: |-
      getLineage accepts LineageStreamKind (UPSTREAM/DOWNSTREAM only); no
      EntityClass parameter, no microservices-specific projection. Same SQL,
      same response shape for every class. The cross-owner enumeration gap
      (REFACTOR-203) amplifies because microservices' operational data
      (latency, error rate) is often more sensitive than table schemas.
