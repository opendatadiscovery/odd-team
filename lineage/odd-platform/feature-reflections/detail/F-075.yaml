- id: H-010
  hypothesis: |-
    When two users concurrently submit auto-approve requests for the SAME never-seen owner
    name under DIRECT_OWNER_SYNC, exactly one Owner row is created and both users bind to the
    same Owner (no duplicate Owner rows, no lost binding).
  derivation: |-
    getOrCreate is getByName.switchIfEmpty(create) with no lock; the OwnerServiceImpl sidecar
    notes the partial unique index owner_name_unique serialises concurrent creates but a
    race window exists between getByName and create.
  seed_source: endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Static trace: getOrCreate has no row lock or advisory lock; two concurrent calls for the
      same unseen name can both pass getByName (empty) and both attempt create. The partial
      unique index owner_name_unique ON owner(name) WHERE deleted_at IS NULL (V0_0_64:70) would
      cause the second INSERT to throw UniqueConstraintException (USR003) rather than silently
      duplicate — so the likely outcome is one success + one error, NOT two rows. But whether the
      losing request then fails entirely (no binding for that user) or retries-and-binds is not
      statically determinable — getOrCreate does not catch the unique violation to re-read. This
      needs a running instance to confirm the loser's user_owner_mapping outcome.
    evidence:
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: "downstream_side_effects(INSERT into owner) + invariants(partial unique index)"
        cite: "OwnerServiceImpl.java:38-42 + V0_0_64:70 (partial unique index)"
        note: "No lock in getOrCreate; unique index serialises but getOrCreate does not catch+re-read the violation."
    operator_visible_failure: |-
      Possible: under a concurrent first-bind to a new owner name, one user receives a 400
      USR003 (unique violation) instead of a successful association, with no automatic retry —
      a confusing transient failure on the auto-approve happy path. Severity depends on the
      loser's outcome (transient error vs lost binding), which the probe resolves.
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-075-2
    routes_to_finding: probe-needed
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: "PENDING-F-075-2"

