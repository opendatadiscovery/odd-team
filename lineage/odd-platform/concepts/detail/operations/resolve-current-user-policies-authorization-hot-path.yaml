notes: |
  Operation vocabulary captured for the platform's authorization hot path. The
  operation is the per-request permission-resolution primitive — every authorized
  HTTP request that traverses the permission framework hits this method.

  Recommended cleanup paths:

    (a) Code: add a one-line fix at `ReactivePolicyRepositoryImpl.getRolesPolicies`:
        AND policy.deleted_at IS NULL in the JOIN's WHERE clause. Closes the
        orphan-binding permission leak.

    (b) Code: add a request-scoped or user-scoped cache (TTL ~30s) to absorb
        per-request authorization cost. Invalidation hooks: PolicyServiceImpl
        update/delete, RoleServiceImpl update/delete.

    (c) Code: add `log.info` at the resolution boundary so an incident reviewer
        can reconstruct permissions at the moment of an event.

