  - P-09
description: |-
  NEW INVARIANT, batch 2026-05-20V — STRENGTHENS the master F-004 stored-XSS
  invariant from 3-surface (data-entity description + dataset-field description +
  term definition, batch U closure) to 4-surface coverage by adding QueryExample
  as the FOURTH user-curated Markdown surface that flows through the shared
  rehype-raw-without-rehype-sanitize pipeline.

  THE F-004 FINGERPRINT REMAINS IDENTICAL on the fourth surface:

    Backend tier — QueryExampleController + QueryExampleServiceImpl write
    BOTH 'definition' (the human prose field) AND 'query' (the executable SQL/KQL
    body) verbatim:
      - QueryExampleController.java:26-32 (createQueryExamples) +
        QueryExampleController.java:35-42 (updateQueryExample) accept
        QueryExampleFormData with no Jsoup.clean, no Encode.html, no allowlist,
        no length cap.
      - QueryExampleServiceImpl.java:42 (mapToPojo) is a MapStruct field-to-field
        copy with no transformation.
      - V0_0_84__create_query_example.sql:4-5 stores both fields as PostgreSQL
        'text NOT NULL' (up to 1GB; no maxLength enforced).
      - components.yaml:2799-2808 (QueryExampleFormData OpenAPI schema) declares
        required: [definition, query] but has no maxLength, no pattern, no format
        constraint.

    UI tier — QueryExampleDetailsOverview.tsx + QueryExamplesListItem.tsx
    render BOTH fields through the platform's shared Markdown.tsx which wraps
    MDEditor.Markdown from @uiw/react-md-editor with rehype-raw enabled and NO
    rehype-sanitize:
      - QueryExampleDetailsOverview.tsx:19, 25 — definition AND query rendered
        via Markdown component (the catalog-detail page).
      - QueryExamplesListItem.tsx:45, 52 — definition AND query rendered via
        Markdown component (the catalog table row AND the per-entity tab AND
        the per-term tab).
      - Markdown.tsx:1-127 — uses default MDEditor.Markdown config; no sanitiser
        plugin configured (verified by reading the file end-to-end in the
        batch-V sidecar).
      - The catalog has the same shared Markdown.tsx single-fix-point as the
        prior three surfaces — the closure invariant
        'no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic' (batch U)
        covers this surface automatically.

  THE NET ATTACK CHAIN — operationally equivalent to F-004 on prior 3 surfaces:

    1. Adversary holds QUERY_EXAMPLE_CREATE or QUERY_EXAMPLE_UPDATE on any
       example they can reach. The 3 SecurityRules at SecurityConstants.java:112-113,
       312-317 gate these operations but apply NO owner-scoping (a holder
       can update any example owned by anyone — see the cross-owner-edit
       gap in the QueryExampleController bugs_limitations_corner_cases).
    2. Adversary submits a payload like script tag alert one in EITHER the
       definition or the query field. (Backticks avoided in this YAML scalar
       per LSN-018 emit safety.)
    3. The mapper writes the payload to query_example.definition and
       query_example.query verbatim.
    4. Any subsequent viewer:
       - Visiting the catalog Query Examples tab triggers QueryExamplesListItem.tsx
         mount → Markdown.tsx → MDEditor.Markdown with rehype-raw → arbitrary
         HTML+JS execution for EVERY authenticated user on the platform.
       - Visiting a specific query example's detail page triggers
         QueryExampleDetailsOverview.tsx mount → same chain.
       - Visiting a dataset's Query Examples tab triggers
         DataEntityDetailsQueryExamples.tsx → same chain.
       - Visiting a term's Query Examples tab triggers TermQueryExamples.tsx →
         same chain.
    5. Four distinct UI surfaces all render the same vulnerable payload.

  THE 4-SURFACE CLOSURE means F-004 now spans the FULL operator-authored
  Markdown inventory:
    Surface 1 — data-entity internal_description (batch F primary source)
    Surface 2 — dataset-field internal_description (batch R primary source)
    Surface 3 — term definition (batch U primary source)
    Surface 4 — query-example definition + query (batch V — THIS INVARIANT)

  THE READ-COLLABORATIVE COMPOUNDING (same shape as surfaces 1-3):

    Per system-mission.md line 267 read-collaborative posture, every
    authenticated user sees every Query Example across every namespace.
    The QueryExampleController has NO read-side RBAC gates — 10 of 13
    endpoints (all reads + all search-session endpoints) fall through to
    'authenticated()' (per the QueryExampleController batch V invariant
    'Read endpoints inherit the read-collaborative posture').
    Effect: an XSS payload planted by a single operator with QUERY_EXAMPLE_CREATE
    fires for EVERY authenticated viewer who reaches any of the four UI
    surfaces above, regardless of namespace, owner, or RBAC.

  THE SENSITIVITY DELTA vs prior 3 surfaces:

    The query body is SQL/KQL/Spark — it often contains internal table names,
    internal column names, sometimes (in poor practice) embedded credentials.
    The information-disclosure surface from cross-owner read of query
    examples is HIGHER than the prior 3 Markdown surfaces (which carry
    user-authored prose, term definitions, column descriptions). The XSS
    surface and the information-disclosure surface compound on this 4th
    member.

  THE BROWSER MITIGATION CAVEAT (inherited from F-004 master):

    P-009 slice-5/-6 probe (run R-20260519T020610Z-P-009) confirmed for the
    data-entity surface that dangerous tags REACH THE DOM but execution is
    blocked by Chromium HTML-parser policy and React attribute filtering.
    The 4th surface has NOT been probed independently in batch V — the
    inference is structural (same shared Markdown.tsx element) and the
    probe inference should hold. A targeted probe pinning the QueryExample
    detail surface specifically is recommended.

  THE SINGLE-FIX-POINT REMAINS Markdown.tsx — adding rehype-sanitize there
  closes ALL FOUR surfaces simultaneously plus any future Markdown affordance
  the platform adds (alert descriptions, owner descriptions, attachment
  link descriptions, etc.).

  SEVERITY: HIGH — extends the existing F-004 HIGH severity to a fourth
  surface; combined with the read-collaborative posture and the sensitivity
  delta of SQL content, the impact set of a single QUERY_EXAMPLE_CREATE-holder
  is the entire authenticated user population, reading SQL bodies that
  may contain internal schema vocabulary.
