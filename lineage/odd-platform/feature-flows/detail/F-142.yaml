chain:
  - hop: 1
    node: ts react-component:OwnerAssociation (state machine root)
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
      OwnerAssociation.tsx:19-92 — composes a 4-branch state machine via
      `getContent()` (line 32-89). Branches:
        (1) identity && !ownership && !requestStatus → OwnerAssociationForm
            (line 35-41 — "no association yet, no pending request")
        (2) identity && !ownership && status=PENDING → "Request being
            checked" pending screen (line 43-59)
        (3) identity && !ownership && status=DECLINED → dismissable
            "rejected" banner + OwnerAssociationForm (line 61-82)
        (4) identity && ownership → <OwnerEntitiesList /> (the populated
            Recommended panel — line 84-86)
      Falls through to `return null` (line 88) for any other combination
      (loading, error, no identity at all). The state machine reads from
      FOUR Redux selectors (lines 22-26 — getIdentity, getOwnership,
      getAssociationRequestStatus, getSupposedOwnerName). NO useEffect —
      it is a pure render-time switch over the slice. The `showRejectMsg`
      local state (line 28) drives the dismissable banner; no persistence
      — refreshing the page re-shows the banner.
    unresolved: false
  - hop: 2
    node: ts react-component:OwnerAssociationForm
    sidecar: unresolved
    multiplicity_per_trigger: 1
    evidence: |-
