behaviour: |-
  **MEDIUM — `DELETE /api/datasources/{id}` cascade-delete behaviour is unverified at the HTTP boundary. The block-on-live-children path AND the allow-when-no-children-or-all-deleted path are both uncovered by tests.** Primary-source confirmed in batch-W DataSourceController sidecar:

  - `DataSourceServiceImpl.delete` (lines 85-96, `@ReactiveTransactional`) line 88: calls `dataEntityRepository.existsNonDeletedByDataSourceId(id)` (per batch-D `ReactiveDataEntityRepositoryImpl.java:158` sidecar).
  - If TRUE → throws `CascadeDeleteException("Data source cannot be deleted: there are still data entities attached")` (line 93-94) → mapped to HTTP 400 via `ControllerAdvice.java:42-46`.
  - If FALSE → calls `dataSourceRepository.delete(id)` → soft-delete via `ReactiveAbstractSoftDeleteCRUDRepository.delete` lines 50-58 → `UPDATE data_source SET deleted_at = NOW() WHERE id = ? AND deleted_at IS NULL`.

  **Behaviour to pin**:
  - **Cascade-delete block**: a datasource with ANY non-soft-deleted data_entity child returns HTTP 400. The error message is a literal string "Data source cannot be deleted: there are still data entities attached" — the operator gets NO hint about WHICH children block deletion (boolean check, not list).
  - **Cascade-delete allow**: a datasource with NO data_entity children OR all-soft-deleted children returns HTTP 204 No Content.
  - **Soft-delete verification**: after a successful delete, `data_source.deleted_at IS NOT NULL`; the row is excluded from `GET /api/datasources` by the soft-delete filter.
  - **Orphan-children semantic**: the delete does NOT cascade — soft-deleted data_entity children remain with `data_entity.data_source_id = soft-deleted data_source.id`. The FK is NOT cascaded by Postgres (no `ON DELETE CASCADE` in the schema), NOT nulled by application logic. (Per the sidecar's downstream_side_effects.deleteDataSource: "the data_entity.data_source_id remains the soft-deleted data_source.id; the FK is NOT cascaded by Postgres, NOT nulled by application logic.")

  **Why MEDIUM not HIGH**: cascade-delete is a non-destructive failure mode (operator gets a clear 400 with a message). The behaviour is consistent with FOUR other cascade-delete guards in the codebase (Collector, Namespace, Policy, Role, Owner — all use the same `existsByX` + `CascadeDeleteException` pattern). The MEDIUM rating reflects the operator-experience-friction (operator must use Discovery UI to find and remove children) and the un-cascaded orphan semantics — but no security or correctness issue.

  **Test gap shape**: regression-pin asserting: (a) DELETE for a datasource with live data_entity children returns HTTP 400 with the canonical message; (b) DELETE for a datasource with no children returns HTTP 204; (c) post-delete, `data_source.deleted_at IS NOT NULL`; (d) post-delete, a fresh registerDataSource with the same ODDRN succeeds (the partial unique index `data_source_oddrn_unique WHERE deleted_at IS NULL` excludes the soft-deleted row).
