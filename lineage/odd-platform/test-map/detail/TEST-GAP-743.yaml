behaviour: |-
  **MEDIUM — Spec/code response-code drift across THREE PUT endpoints: OpenAPI declares HTTP 201 (`'201': description: OK`); the controller returns HTTP 200 via `ResponseEntity::ok`.** Primary-source confirmed in the batch-V DatasetFieldController sidecar + verified at code:

  - `PUT /api/datasetfields/{id}/description`: OpenAPI declares 201 at `openapi.yaml:2465`; controller returns 200 at `DatasetFieldController.java:42`.
  - `PUT /api/datasetfields/{id}/name`: OpenAPI declares 201 at `openapi.yaml:2488`; controller returns 200 at `DatasetFieldController.java:52`.
  - `PUT /api/datasetfields/{id}/tags`: OpenAPI declares 201 at `openapi.yaml:2511`; controller returns 200 at `DatasetFieldController.java:62`.

  **Asymmetric POST behaviour**: the FOURTH endpoint, POST `/api/datasetfields/{id}/enum_values`, CORRECTLY returns 201 via `HttpStatus.CREATED` (controller line 71); the OpenAPI also declares 201 at `openapi.yaml:2549`. This is the asymmetric outlier — the controller author followed the spec for one endpoint but not the three PUTs. Per the sidecar `bugs_limitations_corner_cases.[5]`: "The asymmetry implies the controller author followed the spec for one endpoint but not the other three."

  **Operator-observable consequences**:
  - Generated client SDKs (Java / Python / TypeScript from OpenAPI Generator) typically branch on response codes. SDK clients expecting 201 for the PUT endpoints would interpret the actual 200 as failure or fall through to a default error branch. The drift is SILENT at compile time and at runtime — neither side warns the operator.
  - Pythonic SDK consumers using `response.status_code == 201` checks for the PUT endpoints see `False` and may log false errors or skip the success-handler.
  - JavaScript fetch consumers checking `response.ok` (200-299 range) pass through, but consumers checking `response.status === 201` fail silently.
  - Documentation that quotes the OpenAPI spec verbatim ("PUT returns 201") is wrong; documentation that follows the runtime behaviour ("PUT returns 200") contradicts the spec.

  **Compound with sister status-code drifts** (referenced in batch sibling sidecars):
  - TermController.createTerm / updateTerm: same status-code drift class per the TermController sidecar.
  - QueryExampleController.createQueryExamples / updateQueryExample: same drift per `QueryExampleController.md:bugs_limitations_corner_cases.[0]`.
  - **Pattern emerging across controllers** — the OpenAPI generator emits the `MapStruct`-generated interface's response-code declarations, but the controllers' `.map(ResponseEntity::ok)` overrides them. The drift is a SYSTEMIC controller-vs-spec issue, not isolated.

  **Why MEDIUM not LOW**: while individual SDK consumers may tolerate the drift, the drift is a SPEC-VS-CODE CONTRACT violation. The OpenAPI spec is the documented contract; the runtime behaviour disagrees. Operators relying on the spec for SDK generation, API documentation, or contract testing cannot trust the spec. MEDIUM.

  **Test gap shape**: regression-pin asserting each PUT endpoint returns 200, the POST returns 201; pair with a contract-comparison assertion that the spec at `openapi.yaml:2465, 2488, 2511` declares 201 while the controller returns 200 (the asymmetry).
