name: |-
  Locale-set parity drift — en=418 vs others=414/415; non-English locales silently fall back to English on 3-4 keys
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW MEDIUM-severity INVARIANT, batch ZJ (2026-05-26) — the six
  locale JSON files in `odd-platform-ui/src/locales/translations/`
  have drifted in entry count:

    - en.json: 418 entries (the canonical English source)
    - ch.json: 415 entries (3 fewer)
    - fr.json: 415 entries (3 fewer)
    - es.json: 414 entries (4 fewer)
    - hy.json: 414 entries (4 fewer)
    - ua.json: 414 entries (4 fewer)

  Three to four keys exist in en.json but NOT in the other five
  non-English locales. The natural-keys pattern (per the
  `i18n-missing-key-drift-silent-fallback-natural-keys-contract`
  invariant) hides this drift — the missing entries fall through
  to English via the `fallbackLng: ['en','es','ch','fr','ua','hy']`
  chain (i18n.ts:30). Until a non-English-locale user encounters
  a key that DOES NOT EXIST in their locale but DOES in English,
  the divergence is invisible.

  **The structural risk**: a contributor adding a new key to
  en.json today does NOT receive any signal that the other five
  locales need updating. The natural-keys pattern + fallbackLng +
  no `missingKey` event handler combination silently ships a
  multilingual feature where non-English users see English text
  intermittently.

  **The drift IS NOT additive over time** — the gap is currently
  3-4 keys but the SAME natural-keys + no-handler combination
  applies on EVERY new contributor PR. Future PRs adding new
  en.json keys will widen the gap unless the contributor manually
  propagates to the other five locales (no automation enforces
  this).

  **The audit method**: file-size drift is detectable via `wc -l`
  on the six locale files. The specific missing keys are
  detectable via cross-file diff (`comm -23` on sorted key lists).
  A full audit is out of scope for the en.md primary-source
  sidecar (probe P-170 emitted for runtime confirmation across
  all six locales).

  **One observed cross-locale divergence** — the `"Statuses"` key
  is present in en.json (line 418, natural-keys: `"Statuses":
  "Statuses"`) AND in es.json (line 410: `"Statuses": "Estado"` —
  Spanish singular translating an English plural). The other four
  locales (ch/fr/hy/ua) carry the English source. This is NOT a
  missing-key drift (the key exists in 6 of 6 locales) but a
  TRANSLATION-QUALITY drift — Spanish singular vs English plural
  on a multi-select widget. A Spanish-locale user sees 'Estado'
  on a multi-select status facet — inconsistent with what the
  widget does.

  **One observed content-quality drift** — the
  `"main search placeholder"` key (line 381) has a non-key value
  in all six locales but with semantic drift:

    - en.json: 'Search data tables, feature group, jobs and ML
      models via keywords' (enumerates 4 entity types)
    - fr.json: 'espace de recherche principal' (= 'main search
      space' — does not enumerate the 4 entity types)
    - es.json + ch.json + hy.json + ua.json: similar short generic
      placeholders without entity-type enumeration

  Non-English users do not see the four-entity-type guidance that
  English users see. This is a localisation-quality drift, not a
  defect.

  **The fix has two shapes**:

    (a) **Mechanical fix** — `wc -l` on the six locale files;
        cross-diff the key sets; add missing entries to the
        smaller locales (preserve English source as a starting
        point if no translation is available).

    (b) **Tooling fix** — add a CI script that asserts equal key
        sets across the six locale bundles. ~10 lines.

  Approximate cost of both fixes: 1 hour of audit + automation
  authoring.
