proposed_action: |-
  Add `ActivityAspectTransactionCouplingTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/activity/` using Testcontainers + `@SpringBootTest` + a fault-injecting test double for `ReactiveActivityRepository`. The HEADLINE test method:

  1. **`activityRowWriteFailure_rollsBackWrappedBusinessMutation_pinAuditOrFailContract`** (HEADLINE):
     - Arrange: spy/replace `ReactiveActivityRepository` with a test double that throws `R2dbcException("simulated partition coverage failure")` on `saveReturning(...)`. Seed a `data_entity` row with a known description "before".
     - Act: invoke `DatasetFieldInternalInformationServiceImpl.updateDescription(dataEntityId, "after")` (a `@ActivityLog`-annotated method) and `.block()`.
     - Assert (1): the call surfaces `R2dbcException` (Mono.error propagated up the reactive chain).
     - Assert (2): after the exception, query the `data_entity` row's description column — **PIN that it equals "before"** (the mutation was ROLLED BACK due to the activity-write failure).
     - Assert (3): query the `activity` table for `event_type=DATASET_FIELD_DESCRIPTION_UPDATED` matching the test fixture — **PIN that ZERO rows exist** (no partial commit).

  2. **`activityRowWriteSuccess_commitsBothMutationAndAuditRow_pinHappyPath`** (CONTROL):
     - Arrange: real `ReactiveActivityRepository`; same fixture as (1).
     - Act: invoke `updateDescription(dataEntityId, "after")` and block.
     - Assert: description column equals "after" AND exactly ONE activity row exists with event_type=DATASET_FIELD_DESCRIPTION_UPDATED. Pin the happy-path coupling.

  3. **`businessMutationFailure_alsoRollsBackActivityEmit_pinInverseDirection`**:
     - Arrange: real `ReactiveActivityRepository`; seed fixture where the `data_entity` row will fail an FK check (e.g. linked-term ID does not exist).
     - Act: invoke `TermServiceImpl.linkTermWithDataEntity(invalidTermId, dataEntityId)` (an @ActivityLog method).
     - Assert: call fails with FK violation; the `activity` table contains ZERO new rows for TERM_ASSIGNMENT_UPDATED on this data_entity. PIN the inverse direction of the audit-or-fail coupling.

  4. **`activityEmitFailure_under_AlertServiceImpl_applyAlertActions_pin_systemEvent_path_too`**:
     - Arrange: replace `ReactiveActivityRepository.save` (the BATCH path) to throw on a specific alert ID.
     - Act: invoke `AlertServiceImpl.applyAlertActions(...)` with a batch of 3 alerts.
     - Assert: NONE of the alerts have their status updated (the outer @ReactiveTransactional on applyAlertActions also rolls back). Pins that the AlertServiceImpl path inherits the same TX-coupling semantic as the @ActivityLog path.

  After this test lands, REFACTOR-NNN can formally decide whether to keep audit-or-fail (status quo) OR move to best-effort audit (TX-decoupled). Cross-pair with DOC-NNN to surface the choice on the activity-feed.md doc page so operators understand the trade-off.
