  hypothesis: "When the Dictionary tab fails to create or restore its search session (server 500, network drop, auth token expired mid-session), the user sees an error message or a retry path — not a silently frozen empty page."
  derivation: "Negative-space — the create-session promise chain at the orchestrator has no .catch and the slice has no .rejected reducer."
  seed_source: negative-space
  validation:
