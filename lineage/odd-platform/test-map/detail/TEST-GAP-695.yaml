behaviour: |-
  **`AlertServiceImpl.getTotals` USES `Mono.zipDelayError` — partial-failure semantics not pinned.** Line 104 uses `Mono.zipDelayError` rather than `Mono.zip` — a failure of one count does not abort the others; the failure propagates AFTER all three complete. The user-facing result is the `AlertTotals` payload assembled only after success of all three. If `countDependentObjectsAlerts` fails on a malformed lineage graph (e.g. an entity with a cycle in the LineageRepository's `getDependentEntities` query — see batch H sidecar), the operator sees a 500 — but the All-tab badge could have worked fine. A future shift to `Mono.zip` (eager-abort) would change the user-facing behaviour silently: the user-facing wait time changes from "max of three" to "first failure", but more importantly the partial-result data is no longer available. The test pins the CURRENT zipDelayError semantics so a future maintainer "simplifying" to `Mono.zip` knows the trade-off.
