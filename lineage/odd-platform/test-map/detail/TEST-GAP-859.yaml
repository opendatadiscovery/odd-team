proposed_action: |-
  Add `TagServiceImplGetOrInjectRaceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/` using Testcontainers + `@SpringBootTest`. Three test methods:

  1. **`getOrInjectTagByName_concurrentNovelName_bothCallersReceiveSameId_pinsUpsertSilencedRace`** (HEADLINE):
     - Arrange: empty tag directory.
     - Act: launch two parallel reactive pipelines (e.g. `Mono.zip(getOrInjectTagByName(Set.of("raceTag")).collectList(), getOrInjectTagByName(Set.of("raceTag")).collectList()).block()`).
     - Assert: both lists contain exactly 1 `TagPojo`; both have the SAME `id` value. Query raw DB: `SELECT COUNT(*) FROM tag WHERE name = 'raceTag'` → exactly 1. PIN: the partial unique index + ON CONFLICT DO UPDATE silences the race.

  2. **`getOrCreateTagsByName_concurrentNovelName_oneCallerThrowsUniqueConstraintException_pinsBulkCreateNoSilencing`**:
     - Arrange: empty tag directory.
     - Act: launch two parallel reactive pipelines `getOrCreateTagsByName(Set.of("raceTag"))`; capture both outcomes via `Mono.zip` with `.materialize()` or `StepVerifier`-equivalent.
     - Assert: ONE pipeline succeeds with a non-empty `TagPojo` list; the OTHER pipeline surfaces `UniqueConstraintException` (the unsilenced TOCTOU). Query raw DB: `SELECT COUNT(*) FROM tag WHERE name = 'raceTag'` → exactly 1. PIN: the bulkCreate path does NOT silence the race (sister to TEST-GAP-540).

  3. **`getOrInjectAndGetOrCreate_mixedConcurrency_demonstratesPathSpecificRaceSemantic_pinsTwoSiblingMethodsBehavingDifferently`**:
     - Arrange: empty tag directory.
     - Act: launch one `getOrInjectTagByName(Set.of("raceTag"))` AND one `getOrCreateTagsByName(Set.of("raceTag"))` IN PARALLEL.
     - Assert: BOTH callers receive a non-empty `TagPojo` list AND BOTH have the SAME id (the inject path silences; the create path may succeed first OR may surface UniqueConstraintException — but if it succeeds, both ids match because the index protects). Document the test as "the two paths converge to the same row identity, but via different race resolution strategies".

  Cross-pair with REFACTOR-NNN: if the maintainer decides to UNIFY the two methods (under `ON CONFLICT DO NOTHING / RETURNING` semantics), tests #1 + #2 INVERT — both methods become race-safe. The test pinning is the explicit gate. Cross-pair with DOC-NNN: surface the sibling-method asymmetry on the developer-guides API page; explain why a Collector author should call `getOrInjectTagByName` and a UI author should handle `UniqueConstraintException` from `getOrCreateTagsByName`.
