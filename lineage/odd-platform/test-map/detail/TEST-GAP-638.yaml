behaviour: |-
  **Soft-deleted-hidden filter + Create-CTA permission gate unit gap.** Two intertwined invariants of PolicyList are unverified by any test:
  (a) The list view shows ONLY soft-undeleted policies because `policyRepository.list(...)` auto-applies `WHERE deleted_at IS NULL` via `ReactiveAbstractSoftDeleteCRUDRepository`. The UI has no surface for showing soft-deleted policies — no status filter UI control, no toggle, no 'show deleted' switch (verified by reading PolicyList.tsx lines 73-125 end-to-end: only one Input variant=search-m plus one Button — Create policy). A regression that surfaced deleted policies (or removed the soft-delete filter) would slip through.
  (b) The Create-policy CTA at PolicyList.tsx:91-98 is wrapped in `<WithPermissions permissionTo={Permission.POLICY_CREATE}>`; `WithPermissions` returns `null` when `hasAccessTo` is false. No test asserts the rendered/hidden contract — that a user WITHOUT POLICY_CREATE sees no Create button (no greyed-out button), a user WITH the permission sees it. A regression broadening the permission check (e.g. accidentally rendering Create for all authenticated users) would expose the create-policy URL to operators without the permission; the backend SECURITY_RULES would still 403 the submission but the UX would degrade. Both invariants are documented in the sidecar and uncited by any test.
