behaviour: |-
  **Fragile masking-sniff edge cases unit gap.** `CollectorItemToken.tsx:25-27` runs `useEffect(() => { setIsHidden(collector.token.value.substring(0, 6) === '******'); }, [collector.token.value]);` — a string-prefix sniff for SIX EXACT STARS, no whitespace, no Unicode dash, no regex. The backend masks tokens as `"******" + value.substring(value.length() - 6)` (TokenMapper.java:15-18). If a future backend change masked tokens with a different sentinel — `***…` (4 stars, e.g. shortening), `▒▒▒▒▒▒` (Unicode block character), `XXXXXX` (placeholder change), or any whitespace variation — the substring sniff would silently FALSE-NEGATIVE and the UI would offer the Copy button on a masked value, leaking `******abc123`-style fragments to the operator's clipboard. The UI has no regex, no version-negotiation with the backend, no automated test guarding the contract. NO test asserts (a) the SIX EXACT STARS contract (`****** + last6` → `isHidden = true`); (b) FIVE stars (`***** + last6`) → `isHidden = false` (regression-pin against mask shortening); (c) `XXXXXX{last6}` → `isHidden = false` (mask change); (d) edge cases like a real token that happens to start with `******` (vanishingly unlikely but worth pinning) → `isHidden = true` (false positive case worth documenting). A regression on either side (backend mask format OR UI sniff logic) breaks the security contract silently — operators copy stars, or the Copy button leaks plaintext.
