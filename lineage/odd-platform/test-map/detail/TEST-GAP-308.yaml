behaviour: 'Lineage-variant single-point-of-failure — getMyObjectsWithUpstream/Downstream
  rely on anchor-set correctness; NO JOIN-side owner filter on the response set. A
  regression in fetchAssociatedOwner() leaks lineage neighbours. STRENGTHENED batch
  I — the LineageServiceImpl sidecar is the NEGATIVE-CASE PRIMARY SOURCE: `LineageServiceImpl`
  has no `AuthIdentityProvider` field, no `fetchAssociatedOwner` call, no owner check
  anywhere in getLineage or getDataEntityGroupLineage. `DataEntityRelationsServiceImpl.getDependentDataEntityOddrns`
  IS the positive-case sibling — it calls `fetchAssociatedOwner()` BEFORE the same
  repository. The negative case is the entire LineageServiceImpl class. The lineage
  canvas read path (getLineage) and the DEG-lineage read path (getDataEntityGroupLineage)
  both lack the anchor-set defence — REFACTOR-203 confirmed at the service tier.'
