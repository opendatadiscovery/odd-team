proposed_action: |-
  Testcontainers concurrency test. (a) Two parallel pipelines: createRelation(alice, null, X) AND createRelation(bob, null, X) at the same time using Mono.zip. (b) Assert: one succeeds, one fails with UniqueConstraintException (the per-owner partial index). (c) Verify the surviving row is one of {alice, bob} — non-deterministic but exactly ONE. (d) Mirror test: two simultaneous createRelation(alice, null, X) AND createRelation(alice, null, Y) — fires on the (username, provider) partial index. Both pin the load-bearing DB-side safety nets.
