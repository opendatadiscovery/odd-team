mitigations_unimplemented:
- |-
  Code-side: change `spring.session.timeout` default to a finite duration
  (e.g., 8h or 24h). Document the trade-off (UX friction of more frequent
  logins vs operational hygiene of bounded session storage) on the docs side.
- |-
  Code-side: log a WARN at SessionConfiguration boot if
  `spring.session.timeout=-1` AND session.provider != IN_MEMORY (the
  INTERNAL_POSTGRESQL / REDIS paths produce monotonic external storage growth
  that operators may not anticipate).
- |-
  Code-side: add a boot-time `@PostConstruct` assertion that, if
  spring.session.timeout: -1, the PostgreSQLSessionHousekeepingJob also
  fail-fasts (or at minimum logs 'housekeeping job is a no-op under
  spring.session.timeout: -1') so the inertness is operator-visible.
- |-
  Doc-side: extend the /select-session-provider live doc page to make the
  compound dependency explicit — 'Under spring.session.timeout: -1 (default),
  the PostgreSQLSessionHousekeepingJob does nothing. Tables / heap will grow
  monotonically. Configure a finite timeout for production deployments.'
- |-
  Doc-side: add operator-facing telemetry — emit a metric for SPRING_SESSION
  row count (and IN_MEMORY map size) so operators can observe the growth via
  /actuator/prometheus without running ad-hoc DB queries.
notes: |-
  NEW HIGH-SEVERITY INVARIANT captured in batch 2026-05-20X surfaced by
  SessionConfiguration batch X primary-source examination of the compound chain:
  the link from a single application.yml default through the JooqSessionRepository
  expiry computation into the housekeeping job's SQL predicate. The live doc
  documents each step independently but does NOT make the dependency explicit.

  Cross-cutting connections:
    - session-cookie-security-attributes-unset (batch X) — both compound with
      a stolen-cookie scenario; under -1 timeout AND no Secure flag the cookie
      is valid forever after disclosure
    - housekeeping-job-no-scheduler-lock-multi-instance-amplification (batch X) —
      separate operational gap on the same housekeeping job
    - housekeeping-ttl-retention (existing entity) — sibling pattern for the
      TTL/retention story; this invariant is the SESSION-specific case
    - collector-identity-via-websession-attribute-not-principal — the COLLECTOR_ID
      session attribute is a payload that benefits from session-state cleanup
      (which doesn't happen under -1 timeout)

  Two DOC-NNN candidates:
    (a) Cross-link the two adjacent doc paragraphs on /select-session-provider
        to make the dependency explicit
    (b) Add a session-storage-observability section (metrics for row count /
        map size) so operators can monitor what the housekeeping job is NOT
        doing
