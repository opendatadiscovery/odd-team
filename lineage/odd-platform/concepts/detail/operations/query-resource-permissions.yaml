name: Query Resource Permissions
canonical_in_docs: true
canonical_candidate: false
description: 'GET /api/resource/{permission_resource_type}/{resource_id}/permissions
  — NO SECURITY_RULES entry, falls through to `pathMatchers(''/**'').authenticated()`.
  PermissionService delegates to a per-resource-type `ContextualPermissionExtractor`;
  the extractor (a) loads the caller''s roles → policies via `PolicyService.getCurrentUserPolicies`,
  (b) loads the resource context (e.g. data-entity dimensions + tags + caller''s associated
  owner), (c) evaluates every policy statement against the context via `PolicyPermissionExtractor`,
  (d) emits the union as a `Flux<Permission>`. Authoritative-not-UI-hint: same evaluation
  graph the mutation enforcer uses, so a forged response does NOT bypass mutation
  gating. BUT auth-mode-coupled: under DISABLED returns empty (UI silent-divergence);
  under LOGIN_FORM returns full admin set (every caller is admin). Hot path on every
  UI permission-check (4 DB round-trips per call).'
axes_present:
