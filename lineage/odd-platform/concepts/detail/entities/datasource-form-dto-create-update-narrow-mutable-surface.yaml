name: |-
  DataSource Form DTOs — DataSourceFormData (create) + DataSourceUpdateFormData (update); the narrow mutable surface
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  NEW ENTITY, batch 2026-05-21ZB — the two OpenAPI request-body DTOs
  for the UI-admin DataSource write surface, surfaced at primary source
  by the registerDataSource + updateDataSource method-level sidecars.
  Both are codebase-anchored (generated from the spec); main-concepts.md
  names "Data source" but not the operator-facing mutable field-set.

  THE TWO DTOs — exact contracts read from the spec this batch:

    DataSourceFormData (the CREATE body — components.yaml:1303-1315):
      EXACTLY 4 fields — `name` (the ONLY `required` field), `oddrn`,
      `namespace_name`, `description`. There is NO token field — the
      caller cannot supply a token; the platform mints one
      unconditionally server-side (registerDataSource.md
      implicit_adrs.[0]). There is NO `namespace_id` field — namespace
      selection is name-based only, which is what makes the
      getOrCreate side-door structurally unavoidable
      (registerDataSource.md request_inputs[namespace_name]).

    DataSourceUpdateFormData (the UPDATE body — components.yaml:1317-1325):
      EXACTLY 3 fields — `description`, `name`, `namespace_name`. NO
      `required` block at all (every field is optional). NO `oddrn`
      (the ODDRN is immutable post-registration). NO token field
      (rotation is the separate regenerateDataSourceToken endpoint).

  WHY THIS ENTITY IS MINTED (corrects the class-node's stale framing):

    The DataSourceController class sidecar (batch W) described the
    create + update field-sets inferentially as "oddrn, name,
    description, namespaceName, connectionUrl etc." — naming a
    `connectionUrl` and a `pullingInterval` field. The two method
    sidecars READ THE SPEC and correct this: neither DTO carries a
    `connection_url` field, and the `connection_url` COLUMN was
    dropped from `data_source` by V0_0_71 (per the
    ReactiveDataSourceRepositoryImpl batch-R sidecar). The mutable
    surface of a data source in odd-platform is NARROWER than the
    class node implied — 4 fields on create, 3 on update.

  THE CONTRACT-UNDERSTATEMENT ON `oddrn`:

    DataSourceFormData marks only `name` as `required`, so a
    spec-driven client treats `oddrn` as optional. The runtime code
    rejects an empty `oddrn` with HTTP 400 BadUserRequestException
    ('ODDRN must be filled for data source', DataSourceServiceImpl.java:119-120).
    `oddrn` is de-facto required; the OpenAPI contract understates
    the requirement. The contract should mark `oddrn` required.

  THE UPDATE DTO'S OPTIONAL-FIELD HAZARD:

    Because DataSourceUpdateFormData has NO `required` block and the
    update path is REPLACE-not-MERGE (see the dedicated invariant
    `datasource-update-replace-not-merge-mapstruct-set-to-null`), an
    omitted optional field deserialises to null and is written as
    null onto the existing row. The DTO's optionality is the
    structural enabler of the silent-partial-edit-data-loss bug.
