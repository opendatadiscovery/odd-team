behaviour: '**Known platform bug — `AlertHousekeepingJob.java:28-34`** reads `.where(STATUS.eq(RESOLVED)).or(STATUS.eq(RESOLVED_AUTOMATICALLY)).and(STATUS_UPDATED_AT.lessOrEqual(cutoff))`.
  jOOQ''s fluent-builder precedence binds `.and(...)` to the most recent `.or(...)`,
  producing `(STATUS=RESOLVED) OR (STATUS=RESOLVED_AUTOMATICALLY AND STATUS_UPDATED_AT
  <= cutoff)`. TTL applies ONLY to RESOLVED_AUTOMATICALLY; manual RESOLVED rows are
  hard-deleted on the very next 15-minute cycle, regardless of `resolved_alerts_days`.
  Docs acknowledge the bug verbatim but no test pins CURRENT behaviour and no test
  asserts INTENDED behaviour. STRENGTHENED batch H — the repository sidecar confirms
  the consumer-side observability: this repository''s reads will silently shrink as
  the housekeeping job purges past TTL; `get(alertId)` returns Mono.empty() for hard-deleted
  alerts. The bug remains on the housekeeping job; the repository confirms the consumer-side
  surface.'
