proposed_action: |-
  Unit + Spring-context test. (a) Configure `auth.oauth2.client.google.provider=google` + `admin-groups: [workspace-admins]`. (b) Verify the field binds: `provider.getAdminGroups()` returns the set non-empty. (c) Mock OidcUser with the `groups` claim containing 'workspace-admins'. (d) Invoke `enrichUserWithProviderInformation`. (e) Assert the resulting authorities contain ONLY `SimpleGrantedAuthority('USER')` — admin-groups silently ignored, NOT ADMIN. (f) Pin the silent-no-op. Future fix adding admin-groups support OR boot-time rejection flips the assert.
