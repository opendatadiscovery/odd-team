name: SecurityConstants bug — /api/alerts/{id}/status PUT gated by DATASET_FIELD_ADD_TERM
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-09
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-19K.** A second independent
  SecurityConstants wiring bug surfaced by primary-source examination of
  `SecurityConstants.java:295-296`. The SecurityRule entry reads:
  `new SecurityRule(ALERT, new PathPatternParserServerWebExchangeMatcher("/api/alerts/{alert_id}/status", PUT), DATASET_FIELD_ADD_TERM)`
  This wires the `PUT /api/alerts/{alert_id}/status` endpoint (the alert-status
  change endpoint backed by `AlertController.changeAlertStatus` per the
  batch-A AlertController sidecar) to the `DATASET_FIELD_ADD_TERM`
  permission — a TERM permission applied to an ALERT path. Almost certainly
  a copy/paste error: the intended permission is plausibly
  `DATA_ENTITY_ALERT_RESOLVE` (the named permission for the alert-status
  action) or a comparable ALERT-domain permission. Net effect:
    (a) An operator with `DATASET_FIELD_ADD_TERM` (a Glossary permission
        that should NEVER let them touch alerts) can change alert
        statuses on any data entity.
    (b) An operator with `DATA_ENTITY_ALERT_RESOLVE` (the named permission
        operators would assume gates this endpoint) cannot change alert
        statuses unless they ALSO hold `DATASET_FIELD_ADD_TERM`.
  Cross-policy implication: a Policy granting "data-quality engineers"
  `DATASET_FIELD_ADD_TERM` (for the legitimate purpose of linking glossary
  terms to dataset fields) accidentally grants them alert-status-change
  on any data entity. Conversely, a Policy granting "incident-response
  team" `DATA_ENTITY_ALERT_RESOLVE` does NOT actually let them resolve
  alerts. Both Policies are bug-impacted. **The live docs are silent.**
  Neither the alerting feature page nor the permissions doc page name
  the actual permission gating this endpoint. Cross-batch implication:
  this is the SECOND SecurityConstants wiring bug (the first being
  REFACTOR-217 — `/term` singular vs `/terms` plural for
  `DATA_ENTITY_ADD_TERM`); two such bugs in the same authorization
  wiring file suggest a class of failures that warrants a startup-time
  invariant (cross-check SECURITY_RULES paths AND permissions against
  OpenAPI operation tags + a per-permission name-prefix sanity rule).
  Severity: HIGH because the bypass is silent, the bug is two-way
  (one permission grants too much, another grants too little), and
  both permissions are common in real Policies.
