proposed_action: |-
  Add `CollectorLifecycleAuditSilenceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `registerCollector_produceZeroActivityFeedEntries_pinsAuditSilence` — register an ActivityEventEmitter mock; POST `/api/collectors`; assert ZERO ActivityEvent invocations.
  2. `updateCollector_produceZeroActivityFeedEntries_pinsAuditSilence` — sister test on update.
  3. `deleteCollector_produceZeroActivityFeedEntries_pinsAuditSilence` — sister test on delete.
  4. `regenerateCollectorToken_produceZeroActivityFeedEntries_pinsAuditSilence` — sister test on rotate.
  5. `collectorServiceImpl_carriesNoSlf4jAnnotation_pinsLoggerAbsence` — use reflection to assert `CollectorServiceImpl.class.isAnnotationPresent(lombok.extern.slf4j.Slf4j.class)` returns false. PIN the logger-absence at the service-tier.
  6. `tokenUpdatedByColumn_overwrittenOnEachRotation_notAppendOnly_pinsSingleStateAuditTrail` — sequentially rotate the same collector's token as user A, then user B; assert `SELECT updated_by FROM token WHERE id = ?` returns 'B' (not 'A,B' or a list); demonstrate the audit trail loses the intermediate rotator.

  Pair with REFACTOR-NNN: add `@ActivityLog(event = COLLECTOR_LIFECYCLE_EVENT)` annotations to CollectorController's 4 mutating methods + add the enum value to ActivityEventTypeDto. Mirror for DataSourceController (TEST-GAP-749/750/752 family).

  Cross-pair with DOC-NNN: surface the audit-log-presence-asymmetry on the Management doc + Security Architecture doc. Operators expecting forensic-grade collector-lifecycle history must know the current state.

  Consider LSN-NNN: write a retrospective on the Management-tab audit-silence as a recurring class of findings worth its own framework attention.
