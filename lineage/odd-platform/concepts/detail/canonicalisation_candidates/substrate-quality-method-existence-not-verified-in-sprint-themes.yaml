proposed_canonical: Substrate-quality — synthetic-node walker must verify method existence
  before enrichment fires
rationale: |-
  **NEW SUBSTRATE-QUALITY CANONICALISATION CANDIDATE, batch 2026-05-20-P**
  — surfaced by the PermissionController.getPolicyPermissions PHANTOM
  NODE in this batch's enrichment set. The synthetic-node enumeration
  walker (per `state/sprint-themes.yaml:210-212`) produced a candidate
  node-id `PermissionController.getPolicyPermissions` based on a
  `rationale` field ("Permission catalogue read. RBAC observability.")
  without verifying that the method actually exists on
  `PermissionController.java`. **The method does not exist.** The
  controller has ONE method (`getResourcePermissions`); the entire
  file is 27 lines including imports. The phantom enrichment burned
  one full file-analyser run, produced a sidecar that documents the
  methodology gap, and surfaced a real-but-orthogonal operator
  question (the legitimate catalogue-read surface lives on
  `PolicyController.getPolicySchema`, NOT on `PermissionController`).

  **The required substrate amendment**: the synthetic-node walker
  must — BEFORE emitting an enrichment candidate — assert that the
  named method appears in the target source file. Implementation
  options:

    (a) **In the walker**: match synthetic-node ids against the
        file's actual method list (via tree-sitter / regex / Java
        parser). Skip emission if the method is absent. The walker
        retains the synthetic-node rationale entry for visibility,
        but does not produce an enrichment-queue entry.

    (b) **In sprint-themes.yaml**: annotate synthetic-node entries
        with `provenance: synthesis-from-rationale` so file-analyser
        invocations know to short-circuit with an explicit
        phantom-node sidecar (the current batch-P approach — useful
        but expensive at scale because it still burns a file-analyser
        run).

    (c) **In the orchestrator**: pre-flight existence check before
        invoking file-analyser. If the method is absent, surface
        the synthetic-node rationale to the maintainer for triage
        WITHOUT firing the enrichment.

  **Recommendation**: (a) + (c). The walker's method-existence
  assertion is the cheapest single-pass guard; the orchestrator's
  pre-flight check is the safety net for cases the walker missed
  (rename / refactor between walker run and enrichment run).

  **Severity**: MEDIUM (substrate quality, not platform quality).
  The cost of the miss is small (one phantom sidecar) but the
  pattern recurring at scale would inflate the enrichment backlog
  with non-existent nodes. A sprint with 50 synthetic-node entries
  and a 10% phantom rate burns 5 file-analyser runs to learn
  nothing about the platform.

  **The operator-question that motivated the synthetic node IS
  legitimate**: 'how do I list all permissions I could grant in a
  policy I'm authoring?' has no direct answer in the live docs. The
  resolution path is `GET /api/policies/schema` (which IS
  authentication-gated but not policy-gated) — operators can
  enumerate permissions via the embedded JSON-Schema enum. The
  phantom node encoded the right question; the implementation lives
  at a different controller. The substrate's walker should escalate
  these to a maintainer-question artefact (NOT to enrichment) so
  the doc-product side picks up the question separately from the
  code-walk side.
contributing_concepts:
  - PermissionController.getPolicyPermissions.md (PHANTOM NODE — this batch's full sidecar documenting the gap)
  - state/sprint-themes.yaml:210-212 (synthetic-node entry rationale that produced the candidate)
  - PermissionController.java:1-27 (the entire 27-line file; one method only)
  - PolicyController.getPolicySchema (the legitimate catalogue-read surface — operationId at openapi.yaml:3586-3599)
  - PolicyServiceImpl.java:28, 37-45, 97-100 (the static schema-load pattern; load-once-at-boot)
  - getResourcePermissions.md (batch E sidecar — the LEGITIMATE method on PermissionController)
suggested_add_to_docs: false
notes: |-
  **Required follow-up actions**:

    - Substrate maintainer: amend the synthetic-node walker per
      recommendation (a) — add a method-existence assertion before
      emission.

    - Orchestrator maintainer: consider recommendation (c) — a
      pre-flight existence check in the orchestration layer as a
      safety net.

    - Doc-product maintainer: file DOC-NNN follow-up to extend the
      live `/authorization/permissions` page with a "How to discover
      available permissions" subsection pointing operators at
      `GET /api/policies/schema` as the runtime catalogue surface.
      The synthetic-node walker correctly identified an operator
      question; the resolution is doc-side, not code-side.

    - Future-batch maintainer: when enrichment is requested on a
      synthetic-node candidate, file-analyser should produce an
      explicit `enrichment_status: phantom-node` sidecar (the
      pattern established in batch P) — useful for traceability
      and for the substrate walker's next iteration.

  This canonicalisation candidate is METHODOLOGY-level, NOT
  platform-level. It documents how the enrichment pipeline fails
  rather than how the platform fails. The doc-side suggestion is
  marked `suggested_add_to_docs: false` because the substrate's
  walker amendment is the actionable change; the operator-facing
  doc gap is filed separately as DOC-NNN.
