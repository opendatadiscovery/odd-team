behaviour: |-
  **AppErrorPage MUST NOT render `error.url` or `error.message` to the
  DOM, even though both fields are present in the AppError shape
  passed in by 23 callers.** The current widget only renders
  `error.status` and `error.statusText` — a deliberate
  information-disclosure-boundary decision. The implicit ADR per
  AppErrorPage.md is: status code + status text only; the URL (which
  may contain ownership / entity-id leakage) and the backend
  message (which may contain stack-trace fragments or PII) MUST
  stay invisible to the end user.

  But: no test pins this contract. A maintainer "improving" the
  error pane by adding `{error.url}` or `{error.message}` for
  better debugging would silently land a data-disclosure
  regression. The risk surface includes:
  (a) error.url leakage — paths like
  `/api/dataentities/{id}/permissions` reveal entity IDs that the
  caller does not have permission to view directly; reveal the
  owner-association URL space; etc.
  (b) error.message leakage — 5xx responses from the backend may
  carry stack-trace fragments, query plans, or PII in body.message;
  4xx auth-failure responses may reveal which permission was
  missing (a privilege-mapping disclosure).

  The 23 caller sites (DataEntityDetails, TermDetails, Search,
  Alerts, Activity, Directory, DatasetStructure*, DataEntityAlerts,
  TestReport, IntegrationPreviewList, Integration, PolicyDetails,
  OwnerAssociations{Active,New,Resolved}, Term*, HierarchyLineage
  per AppErrorPage.md upstream_callers) all pass the full
  4-field AppError envelope; the widget's no-leak contract is the
  load-bearing boundary.

  Severity HIGH because (i) every callsite is on the platform's
  primary failure-mode UX, (ii) the leak is silent — the renderer
  decides what to show, (iii) the "improvement" temptation is
  realistic — every maintainer's first instinct when debugging
  a generic 500 is "let me see the backend message".

  This is the F-005 security boundary that TEST-GAP-425 partially
  covers (via the fetchDataEntityDetails-specific path) but does
  NOT pin as a cross-cutting widget invariant. This new test pins
  the widget itself.
