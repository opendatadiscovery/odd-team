behaviour: 'Under `auth.type=DISABLED`, this endpoint returns an empty Flux<Permission>
  regardless of the resource — DisabledAuth''s `permitAll()` skips the security filter
  chain, so `ReactiveSecurityContextHolder.getContext()` is empty in `AuthIdentityProviderImpl.getCurrentUser`
  (lines 24-35) and `getCurrentUserProviderRole` (lines 37-47). The reactive chain
  in `RoleServiceImpl.getCurrentUserRoles` cascades through empty switchIfEmpty branches
  to `Mono.just(List.of())`; the policy resolver emits no permissions. The UI consuming
  this endpoint renders every action button as DISABLED — while server-side mutation
  endpoints under DISABLED accept any caller (`.permitAll()`). The UI says ''you can
  do nothing''; the API says ''anyone can do anything''. Silent contradiction: no
  error, no log, no admonition. Concept-flag HIGH per Permission.security_aggregate.weaknesses.[0].'
