axes_present:
  - controllers
  - services
  - schema_migrations
security_aggregate:
  overall: MEDIUM
  auth_modes_relevant: [LOGIN_FORM, OAUTH2, LDAP, DISABLED]
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      9 mutating endpoints HAVE SecurityRule; 5-6 read endpoints have NO
      rule. All 9 mutating rules use NO_CONTEXT — no per-owner scoping.
      No _READ permission exists.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      NO_CONTEXT resolver applies uniformly to all 9 LOOKUP_TABLE_*
      permissions. Reads bypass owner-scoping by absent SecurityRule.
  strengths:
    - 9 mutating endpoints fully gated
    - Three-surface permission split (table / definition / data)
  weaknesses:
    - Read endpoints have NO RBAC (HIGH for sensitive reference data)
    - F-004 stored-XSS family extends to row values + column names + table
      names + descriptions
    - Permission scope is global (NO_CONTEXT) — operator-scoped Policies
      not possible
    - updateLookupTableField discards lookupTableId — cross-table PATCH attack
  contributing_files:
    - ReferenceDataController.md
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'getLookupTableRowList: full-table COUNT(*) per page request —
      ReferenceDataController.md'
    - 'Search results via tsvector @@ tsquery on the search-entrypoint —
      ReferenceDataController.md'
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      Hardcoded 50-row response cap on insert/update. fetchCount(*) per
      page read. DDL serialization risk on rename / delete (ACCESS EXCLUSIVE
      LOCK).
  contributing_files:
    - ReferenceDataController.md
notes: |-
  This operation entry captures the 14-endpoint Lookup Table CRUD surface
  for P-03. The entity entry (master-data-management-lookup-table-pillar-p-03-anchored.yaml)
  carries the cross-pillar semantics; this operation entry carries the
  per-endpoint behaviour.

  Cross-cutting connections:
    - Entity: master-data-management-lookup-table-pillar-p-03-anchored.yaml
    - Companion HIGH invariant: lookup-table-rename-via-alter-table-breaks-downstream-sql-consumers
    - F-004 stored-XSS family: row values on a non-Markdown surface
    - F-006 audit-silence: no @ActivityLog on LookupTable mutations
    - Cross-pillar: P-03 feeds P-01 (Lookup Tables = Data Entities)
