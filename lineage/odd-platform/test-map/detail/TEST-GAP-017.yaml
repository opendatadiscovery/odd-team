behaviour: |-
  REFACTOR-217 path-mismatch — DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM gates SILENTLY DISABLED. SecurityConstants.java:237-239 registers a matcher on `/api/dataentities/{data_entity_id}/term` (singular); OpenAPI declares the operation at `/api/dataentities/{data_entity_id}/terms` (plural — openapi.yaml:973, 1042). The matcher never fires; the linkTermWithDataEntity service method (TermServiceImpl.java:170-179) is reachable by any authenticated user. Same applies to DELETE — SecurityConstants.java:240-242 singular vs openapi.yaml:1042 plural — removeTermFromDataEntity (TermServiceImpl.java:184-196) is similarly unenforced. STRENGTHENED batch K — the TermServiceImpl sidecar PRIMARY-SOURCE confirms the service-tier dimension: the service has ZERO @PreAuthorize / hasPermission / permissionService imports (grep verified). Authorization SHOULD fire at the controller-perimeter SECURITY_RULES matcher; it does NOT. The full surface of `linkTermWithDataEntity`, `removeTermFromDataEntity`, `linkTermWithDatasetField`, `removeTermFromDatasetField` is effectively unauthenticated-mutation-allowed. The path-mismatch is the canonical authorization-path-string-drift failure mode in production today, with the service tier offering NO defence-in-depth (no second permission check downstream). Cross-pillar P-06 dimension because TermServiceImpl is the P-06 service-tier consumer. Cross-tier — auth-mode matrix probes per pillar P-06+P-09. STRENGTHENED batch L — the deleteTermFromDataEntity controller-method sidecar PRIMARY-SOURCE confirms the DELETE half via FOUR independent sources: (1) SecurityConstants.java:240-242 (singular path), (2) openapi.yaml:1042 (plural path), (3) DataEntityController.java:158-163 (@Override inheriting the plural path from generated DataEntityApi), (4) AuthorizationCustomizer.java:24-30 + line 29-30 (path-pattern dispatch + fallback to `.pathMatchers(/**).authenticated()`). Permissions doc (live 2026-05-19, status 200) verbatim describes `DATA_ENTITY_DELETE_TERM` as 'Allows removing a term from a data entity' — the intended access model — and is silent on the wiring bug. Combined with HARD-DELETE semantics (migration V0_0_76 removed soft-delete column AND tombstoned existing rows), unauthorized callers can mass-delete term taxonomy with NO row-level restore path. See TEST-GAP-489 for the controller-method-scoped DELETE-half regression-pin (this entry is the SUM AGGREGATE; 489 is the DELETE-specific entry).
