- postMessageInSlack.md:security.known_security_gaps.[0] (severity HIGH)
behaviour: POST `/api/datacollaboration/providers/slack/messages` has NO authorization
  gate — no `@PreAuthorize`, no SECURITY_RULES entry, no programmatic `permissionService.hasPermission(...)`
  call. Falls through to `AuthorizationCustomizer.pathMatchers('/**').authenticated()`
  catch-all. Any authenticated user can post a message to any Slack `channel_id` the
  bot can reach, attached to any `data_entity_id`.
