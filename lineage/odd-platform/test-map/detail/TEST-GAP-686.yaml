behaviour: |-
  **AUTHORIZATION HOT PATH HAS NO CACHING — every authorized HTTP request triggers TWO 5-table JOINs via `roleService.getCurrentUserRoles` → `getUserRolesByOwner` (ReactiveUserOwnerMappingRepositoryImpl.java:99-114) AND `policyRepository.getRolesPolicies` (ReactivePolicyRepositoryImpl.java:32-35). PolicyServiceImpl.java:102-107 + RoleServiceImpl.java:94-101.** The platform's permission resolution: ManagementPermissionExtractor.java:33 + AbstractContextualPermissionExtractor.java:27 invoke `policyService.getCurrentUserPolicies()` on EVERY authorized request that traverses the permission framework. `getCurrentUserPolicies` in turn invokes `roleService.getCurrentUserRoles()`. NO request-scoped cache. NO user-scoped cache. NO Caffeine / Redis layer. The cost is 2N DB roundtrips per N authorized requests — orthogonal to the actual request's business work. For a busy platform at 100 RPS, this is 200 permission-resolution JOINs per second. For a peak-load platform at 1000 RPS, it is 2000. The current behaviour is CORRECT (always fresh) but observable cost is LOAD-BEARING. No test pins the cost shape; a maintainer optimising via cache (e.g., adding a 5-second `Caffeine` cache on `getCurrentUserPolicies` to reduce permission JOINs to ~1 per 5 seconds per user) would silently change the freshness contract (a permission revoke takes up to 5 seconds to propagate to the user's next request). Both ADD and REMOVE of a cache must be DELIBERATE — the test pins the CURRENT no-cache contract.
