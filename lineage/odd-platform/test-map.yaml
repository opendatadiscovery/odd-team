# Cross-cutting test patterns missing across multiple sidecars

cross_cutting_patterns:

  - pattern: "No controller-level integration test exists for ANY of the six controller sidecars beyond the two end-to-end tests at DataEntityStatusChangeTest (2 of 40 endpoints) and DirectoryTest (3 of 4 endpoints). Five of six controllers (AlertController, AlertManagerController, DataEntityAttachmentController, GenAIController, plus DataEntityController's other 38 endpoints) have ZERO controller-boundary smoke test. A regression in the OpenAPI generator template, the WebFlux/MVC config, the Jackson configuration, or the security path-matcher list could silently break entire controller surfaces with the build still passing."
    affected_node_count: 6
    contributing_sidecars:
      - "AlertController.md"
      - "AlertManagerController.md"
      - "DataEntityController.md"
      - "DataEntityAttachmentController.md"
      - "DirectoryController.md"
      - "GenAIController.md"
    proposed_remedy: "Establish a baseline pattern: one `@WebFluxTest(<Controller>.class)` per controller asserting each endpoint returns its expected status for an authenticated request and 401/403 for an unauthenticated one. Captures the OpenAPI-generator → WebFlux-binding contract that today is unverified end-to-end."

  - pattern: "No test exists for the Spring Security configuration / SecurityConstants.SECURITY_RULES path-matcher wiring. The `/term` vs `/terms` mismatch is a verified production failure mode (Data Entity concept's CRITICAL security weakness) where a path-string typo silently disabled DATA_ENTITY_ADD_TERM and DATA_ENTITY_DELETE_TERM gates. The mismatch shipped because authorization is wired by path-string match, NOT by annotation on the controller method, and there is no compile-time or test-time guard against drift."
    affected_node_count: 5
    contributing_sidecars:
      - "DataEntityController.md (the canonical case; verified production failure)"
      - "AlertController.md (no SECURITY_RULES entries; same drift class for any future ones)"
      - "DataEntityAttachmentController.md (DATA_ENTITY_ATTACHMENT_MANAGE gates only writes, GETs slip)"
      - "DirectoryController.md (no @PreAuthorize, drift surfaces if SECURITY_RULES is added)"
      - "GenAIController.md (no SECURITY_RULES entry; drift surfaces if added)"
    proposed_remedy: "Add a meta-test that loads SECURITY_RULES, walks every PathPatternParserServerWebExchangeMatcher, and asserts each path resolves to an actual controller method (round-trip the path string back through the OpenAPI-generated *Api interface annotations). A typo would surface as 'no controller method matches /term' at build time. Pair with a `WebTestClient` matrix asserting (endpoint × {authorized, unauthorized}) → expected status."

  - pattern: "i18n / locale bundle bootstrap has 0 test coverage. Six locales ship in the main JS bundle; the language-switcher widget and the i18next module-load both have zero tests. A regression where (a) `i18nextLng` storage key is renamed, (b) localStorage access throws in private mode and crashes the import-for-side-effects before <App /> renders (entire UI unreachable, including login screen — TEST-GAP-069), or (c) a contributor adds a seventh locale to `resources` but forgets `LANGUAGES_MAP` would ship silently."
    affected_node_count: 2
    contributing_sidecars:
      - "i18n_ts.md"
      - "SelectLanguage.md"
    proposed_remedy: "Add a basic `i18n.test.ts` covering localStorage fallback and the localStorage-throws-on-access case (TEST-GAP-069); add `SelectLanguage.test.tsx` covering the change-language click path. Both are tractable with jest + React Testing Library."

  - pattern: "GenAI controller has no test coverage for the security threat model — prompt-injection, SSRF, DISABLED-anonymous-reachability, outbound-auth absence, request_timeout=0 LSN-002-class regression. Concept aggregates flag SEVEN HIGH-severity weaknesses; ZERO are test-pinned at any layer. The class of regression most likely to ship: a config-rename or field-rename that breaks Spring binding silently (request_timeout=0 → all requests immediately time out; the platform boots cleanly and the feature is 'enabled' from the operator's standpoint)."
    affected_node_count: 2
    contributing_sidecars:
      - "GenAIController.md"
      - "GenAIProperties.md"
    proposed_remedy: "Add (a) a `GenAIThreatModelTest` covering prompt-injection/SSRF/DISABLED-reachability (TEST-GAP-039, TEST-GAP-036); (b) a `GenAIRequestTimeoutTest` (TEST-GAP-034) explicitly testing the request_timeout=0 LSN-002-class regression; (c) a `WebClientConfigurationTest` (TEST-GAP-041) asserting Reactor Netty's responseTimeout matches the configured value."

  - pattern: "Attachment subsystem has no test coverage for storage-tier × file-size × multi-instance interactions — the precise failure modes of LSN-001 (LOCAL ephemeral default) and LSN-002 (us-east-1 region pin). Both retrospectives describe failures that a Testcontainers-MinIO integration test parameterised over (storage-backend, region, restart) would have caught. The current absence means a future region-default change, a future LOCAL-vs-REMOTE refactor, or a future MinIO SDK upgrade ships with no safety net."
    affected_node_count: 3
    contributing_sidecars:
      - "DataEntityAttachmentController.md"
      - "AttachmentServiceImpl@L27.md"
      - "attachment-config-prefix.md"
    proposed_remedy: "Add the integration tests proposed in TEST-GAP-024 (LOCAL vs REMOTE parity), TEST-GAP-051 (round-trip across container restart), and TEST-GAP-052 (non-default region). All three are Testcontainers-feasible."

  - pattern: "OpenAPI spec has no CI-side lint asserting basic contract invariants (per-operation security block, pagination bounds, lineage_depth bound, summary/description completeness, tag-scope coherence, tag-vs-controller method-count parity). The spec is the contract the platform ships — if a maintainer wires a new endpoint without an authorization gate, without a size cap, or without bounding lineage depth, codegen passes silently. This is the single largest contract-level drift surface flagged by both openapi-tag sidecars."
    affected_node_count: 2
    contributing_sidecars:
      - "openapi-tag-alert.md"
      - "openapi-tag-dataEntity.md"
    proposed_remedy: "Add a `npm exec openapi-cli lint` (or equivalent) CI step in odd-platform-api-contract enforcing per-operation security, pagination maximums, lineage_depth maximum, summary/description completeness, and tag-scope coherence (TEST-GAP-053 through TEST-GAP-058)."

  # ----- Batch 2026-05-10A — new cross-cutting patterns -----

  - pattern: "Cross-owner audit-trail / cross-tenant content surfaces are systemically untested. Three method-level sidecars (getAllAlerts, getActivity, postMessageInSlack) each surface a HIGH-severity 'any authenticated user reads / mutates / posts cross-owner data' weakness, with ZERO test coverage at any layer. The class lives one layer below the Quality Bar's Cornerstone: 'audit-trail' is a feature; 'cross-owner audit-trail readable by any authenticated user' is a default-permissive failure mode that ships under 'undocumented feature' severity in retrospectives but is the LSN-001 / LSN-002 family. A `CrossOwnerExposureMatrixTest` covering (auth.type × user-owner-link × endpoint) for the eight cross-owner-readable endpoints would lock posture across all three sidecars at once."
    affected_node_count: 4
    contributing_sidecars:
      - "getAllAlerts.md"
      - "getActivity.md"
      - "postMessageInSlack.md"
      - "DataEntityController.md (already in slice 7 — same family)"
    proposed_remedy: "Establish a CrossOwnerExposureMatrixTest pattern. Each row: (endpoint, auth.type, user-has-owner-link, expected-behaviour). Initial population: getAllAlerts, getActivity, getDataEntityActivity, getDataEntityMessages, getDataEntityDetails, getAttachments, downloadFile, postMessageInSlack. Locks 12+ TEST-GAPs with one harness."

  - pattern: "Decoupled-write pattern (`accept-202 + queue + single-leader-elected sender`) — postMessageInSlack is the only example in the catalog so far, but its scaffolding has zero test coverage across THREE failure modes: (a) advisory-lock contention / leader election under multi-replica deployments, (b) retry-budget accounting under non-discriminating Slack-error handling, (c) async failure invisibility from the HTTP caller's perspective (the user is told 202; the message ends up ERROR_SENDING; no notification path). When this pattern is reused for other queued integrations, the test scaffolding should be reusable too."
    affected_node_count: 1
    contributing_sidecars:
      - "postMessageInSlack.md"
    proposed_remedy: "Build a `DecoupledWriteSenderTestHarness` test class (Testcontainers-Postgres + a fake Slack server) covering: (a) advisory-lock single-leader assertion; (b) retry-budget exhaustion → ERROR_SENDING; (c) 202 response shape vs eventual state. Locks TEST-GAP-091, TEST-GAP-092, TEST-GAP-093 in one harness; reusable for any future queued integration."

  - pattern: "Token-rotation operational contract (regenerateCollectorToken) has zero test coverage across SEVEN distinct failure modes, four flagged HIGH-severity in concepts.yaml. The contract is unique: in-place UPDATE no overlap window, plaintext stored, plaintext returned in response body, non-CSPRNG entropy source, no audit log, no rotation grace period, no rate limit, DISABLED-mode bypass. Adding even a single end-to-end `rotate → verify-old-token-401 → verify-new-token-200` integration test would lock the most operationally significant contract; layer in CSPRNG entropy + audit-log + DISABLED-bypass tests as separate concerns. The Collector concept's `authorization_consistency: CONSISTENT` posture (gate IS wired) makes this the cleanest CRITICAL cluster: the gate is correctly defined; what's missing is the test that catches its silent removal."
    affected_node_count: 1
    contributing_sidecars:
      - "regenerateCollectorToken.md"
    proposed_remedy: "Build a `CollectorTokenRotationContractTest` covering: (a) gate enforcement (no-permission → 403); (b) S2S filter coupling (rotate → old token 401, new token 200); (c) token entropy source assertion; (d) audit-log emission; (e) DISABLED-mode bypass posture. Locks TEST-GAP-094 through TEST-GAP-100 (seven gaps). Highest-leverage tests-pillar batch in the catalog."

  - pattern: "Method-level sidecars surface gaps the class-level scan missed because they encode runtime invariants (state machines, identity-key decoupling, lineage-graph walks) that aren't visible from the class shape alone. Examples: uploadFileChunk's chunk-staging path universality finding (REMOTE storage also affected by multi-instance breakage; class-level scan said LOCAL-only); getActivity's two-branch dispatch refactor risk (`type=null` AND `type=ALL` both lead to fetchAllActivities — neither alone obvious); regenerateCollectorToken's DISABLED-mode bypass via `TokenGeneratorImpl.java:30-31` falling through to NULL `updated_by`. The test-pillar must therefore cover both class-level smoke + method-level invariants. Method-level enrichment is not redundant; it's where the silently-shipping defaults live."
    affected_node_count: 5
    contributing_sidecars:
      - "uploadFileChunk.md"
      - "getActivity.md"
      - "regenerateCollectorToken.md"
      - "getAllAlerts.md"
      - "postMessageInSlack.md"
    proposed_remedy: "Continue method-level enrichment for the platform's most operationally-significant methods (the substrate's controller-method axis) — the pattern of class-level + method-level enrichment is itself a Quality Bar mechanism for catching structural drift. Allocate the next 5 method-level sidecars to: changeAlertStatus (already done — refresh against new aggregates), the chunked-upload initiate + complete methods, the lineage / dependent-entities readers, and the AlertManager webhook receive method."

