surfaced_by:
  - "PolicyList.md:security.known_security_gaps.[2] (`isAdministrator` UI guard is case-sensitive + name-string-coupled — severity MEDIUM)"
  - "PolicyList.md:concepts.invariants.[2] (isAdministrator defence is a pure-NAME string check — brittle by design)"
behaviour: |-
  **Predefined-policy-name UI guard (`name === 'Administrator'`) unit gap.** `PolicyItem.tsx:23` checks `isAdministrator = name === 'Administrator'` to hide Edit/Delete on the seeded Administrator policy. `PolicyForm.tsx:28` duplicates the same check. The check is case-SENSITIVE strict-equality matching the backend `PolicyServiceImpl.java:29` (`ADMINISTRATOR_POLICY = "Administrator"`) + lines 76, 87 (case-sensitive `.equals('Administrator')` for update + delete guards). NO test asserts (a) the seeded `Administrator` row hides Edit + Delete (the positive path); (b) a row named `administrator` (lowercase) shows BOTH Edit and Delete (the case-sensitivity mismatch — exploitable per F-006 batch-N drift_class `role_service_predefined_name_case_sensitivity_mismatch`); (c) a row named `Administrator Policy` (a renamed-seeded scenario) shows BOTH Edit and Delete (the brittleness). The partial unique index `policy_name_unique WHERE deleted_at IS NULL` permits creating a fresh `Administrator` policy after the seeded row is soft-deleted (per F-006 batch-H finding) — the UI guard then fires on the WRONG row. A test pinning the case-sensitive contract surfaces the brittleness; a future fix making the guard case-insensitive at the UI tier would break the test, forcing intentional re-authoring AND alignment with the cross-layer mismatch on the delete-side (which is `.equalsIgnoreCase`).
test_files_existing: []
test_files_proposed:
  path: "odd-platform-ui/src/components/Management/PolicyList/PolicyItem/__tests__/PolicyItem.test.tsx (NEW file)"
  name: "predefined_administrator_name_check_is_case_sensitive_strict_equality"
evidence:
  - "PolicyList.md says (security.known_security_gaps.[2]): '`isAdministrator` UI guard is case-sensitive + name-string-coupled. PolicyItem.tsx:23 + PolicyForm.tsx:28 hardcode `name === Administrator` to hide Edit/Delete. Per F-006 batch-N case-sensitivity-mismatch finding, an operator who creates a policy named administrator (lowercase) bypasses the UI guard AND the backend's update guard (case-sensitive) BUT NOT the backend's delete guard (case-INsensitive). Net: the lowercase variant policy is editable (no UI/backend guard fires) but undeletable. severity: MEDIUM'"
  - "PolicyList.md says (concepts.invariants.[2]): 'isAdministrator defence is a pure-NAME string check. The check is brittle by design: it depends on the literal name Administrator matching PolicyServiceImpl.ADMINISTRATOR_POLICY (PolicyServiceImpl.java:29) — if the seeded policy is ever renamed in a migration OR if a SECOND policy named Administrator is ever created, the UI guard fires on the WRONG row.'"
  - "Glob verified: zero PolicyItem*.test.* files (run 2026-05-20)"
cross_references:
  - "F-006 (drift_class role_service_predefined_name_case_sensitivity_mismatch)"
  - "ReactivePolicyRepositoryImpl batch-H (partial-unique-index permits Administrator re-creation after soft-delete)"
proposed_action: |-
  Add `PolicyItem.test.tsx` (NEW file) with a parameterised test `predefined_name_check_is_case_sensitive_strict_equality` over four names: (a) `Administrator` — assert Edit + Delete are hidden; (b) `administrator` (lowercase) — assert BOTH visible (the case-sensitivity mismatch); (c) `Administrator Policy` — assert BOTH visible (the rename-the-seeded-row hazard); (d) `Custom Policy` — assert BOTH visible (the positive non-predefined path). Pair with a separate test `policyItem_edit_button_navigates_when_visible` to pin the navigation contract. The case-sensitivity test serves as a cross-layer drift regression-pin: if a future fix makes the UI case-insensitive, the test breaks AND the maintainer must also fix the backend update-guard alignment.
