      nodes_count: 1
      contributors_count: 1
      security_aggregate_overall: null
      performance_aggregate_overall: null
      description: |-
        NEW MEDIUM-SEVERITY INVARIANT, batch ZB — DELETE /api/datasources/{id} is
        a guarded soft-delete that does NOT cascade and does NOT clean up adjacent
        rows. The soft-delete sets ONLY data_source.deleted_at; it leaves (1) the
        TOKEN ROW orphaned — data_source.token_id FKs the token table, the token
        table has NO deleted_at column so the token cannot even be soft-deleted,
        no code GCs orphan tokens, each register/delete cycle leaks one plaintext
        token row (stale-secret-at-rest + unbounded growth); (2) the FTS
        search_entrypoint vector UNCLEARED — delete calls no searchEntrypointRepository
        method, unlike update; (3) HISTORICAL data_entity children FK-attached to
        the soft-deleted parent (no ON DELETE clause). SAME orphan-token pattern
        batch W confirmed for the Collector delete. Probes P-046 + P-048. The
        soft-delete catalogue tells a maintainer data_source uses deleted_at; this
        invariant adds the incomplete-cleanup fact.
      detail_path: detail/invariants/datasource-delete-incomplete-cleanup-orphan-token-uncleared-fts.yaml
