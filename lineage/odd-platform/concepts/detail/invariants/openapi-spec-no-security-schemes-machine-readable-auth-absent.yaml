name: OpenAPI spec declares no securitySchemes and zero per-operation security blocks — machine-readable auth absent
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
- P-11
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20-Z (odd-platform-public-api
  spec sidecar)** — the platform-api OpenAPI spec (4212 lines of `openapi.yaml`
  + 2937 lines of `components.yaml`) declares ZERO `components.securitySchemes`
  entries and ZERO per-operation `security:` declarations across all 194
  operations (verified by Grep across both files — 0 matches for
  `securitySchemes` and 0 matches for `security:`). The platform supports 4
  UI auth modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP) + S2S (X-API-Key) +
  Ingestion filter — NONE of these are declared in the spec.

  **The structural consequence**: SDK generators (openapi-generator-cli,
  swagger-codegen) consuming this spec produce typed CLIENT classes for
  every endpoint with NO authentication code — no Bearer-token wiring,
  no session-cookie handling, no X-API-Key injection. Third-party consumers
  must hand-author auth glue, which is the most error-prone surface in any
  client integration. Operators who federate this spec into an API gateway
  (Apigee, Kong, AWS API Gateway) get NO machine-readable auth policy to
  configure.

  **The promotion-strengthens-batch-Z evidence**: this invariant promotes the
  prior `spec-carries-no-security-block-authorization-is-wholly-out-of-band-of-the-openapi-contract`
  finding from a tag-axis observation (alert + dataEntity tags both declare
  zero `security:` blocks) to a SPEC-LEVEL primary source observation
  (the ENTIRE 194-operation surface across all 35 tags carries no security
  declarations; the `components.securitySchemes` block is completely absent
  from both files). The pattern is documented at the spec layer for the
  first time.

  **The directional remedy**: spec-side is the source of truth for path /
  method / shape; security wiring lives in SecurityConstants.SECURITY_RULES.
  Adding `securitySchemes` + per-operation `security:` to the spec would
  make the contract machine-readable AND would surface drift (the
  spec saying 'this op requires DATA_ENTITY_ADD_TERM' vs SecurityConstants
  registering a different permission for the same path would be catchable
  at build time). This is the same directional remedy as REFACTOR-217
  (the spec is authoritative for the path; SecurityConstants is the bug).

  **Severity**: MEDIUM in absolute terms (auth IS enforced server-side; the
  gap is in SDK quality + third-party integration, not in actual security
  boundary failure) BUT HIGH composition with REFACTOR-217 + the
  AUTH-MODE-ORTHOGONAL facet: a `security:` block on `/ingestion/**`
  operations would have surfaced the WHITELIST_PATHS exemption as a
  three-way asymmetry (spec says 'require X-API-Key', code says 'permitAll
  via whitelist') — making the gap machine-discoverable instead of
  prose-discoverable.
