  Add `DataCollaborationControllerRedirectOpenRedirectTest`:

  1. `get_messageUrl_slackReturnsEvilDotComUrl_currentImplementationEmits302ToEvilCom_pinsOpenRedirectVulnerability` — mock `SlackAPIClient.exchangeForUrl` to return `https://evil.com/forged`; assert WebTestClient response is 302 with `Location: https://evil.com/forged`. Comment: '// REGRESSION-PIN — open-redirect class. When TEST-GAP-963 is fixed, this test MUST FLIP to expectStatus().is5xxServerError() (or 4xx, depending on fix shape).'
  2. `get_messageUrl_slackReturnsJavascriptScheme_currentImplementationEmits302ToJavascript_pinsSchemeBypassClass` — mock the SDK to return `javascript:alert(1)`; assert 302 emitted.
  3. `get_messageUrl_slackReturnsMalformedURI_currentImplementationBubbles5xx_pinsErrorMode` — mock the SDK to return `not-a-uri`; assert response is 5xx (not 4xx).
  4. `get_messageUrl_slackReturnsLegitimateSlackComUrl_currentImplementationEmits302Correctly_pinsHappyPath` — the contrast happy path; mock returns `https://workspace.slack.com/archives/...`; assert 302 emitted with correct Location.
  5. Pair with REFACTOR-NNN-candidate (FIX: validate URL host ends in `.slack.com` AND scheme equals `https`; fail-fast 5xx otherwise; log warn-level event for forensics).

