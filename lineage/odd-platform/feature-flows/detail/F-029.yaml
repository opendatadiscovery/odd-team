feature_name: |-
  Platform Public API Contract — single OpenAPI 3.0.3 document for 194 operations across 35 tags
discovered_from_entry_point: |-
  openapi-spec:odd-platform-public-api (odd-platform-specification/openapi.yaml + components.yaml)
description: |-
  The Platform Public API Contract is the developer-facing surface
  promised by pillar P-11 (Platform API & Developer Surface) per
  system-mission.md:300-322 — "Two OpenAPI specifications (Ingestion API
  + Platform API) plus an interactive Swagger UI on every running
  deployment". This feature anchors the PLATFORM-API half of that
  promise — the 4212-line `odd-platform-specification/openapi.yaml` +
  its sibling 2937-line `components.yaml`, which together declare 194
  HTTP operations across 35 tags under the `/api/**` URL space.

  The user-observable promise (per the live API-reference hub page,
  WebFetched 2026-05-20 status 200): "the canonical reference hub for
  every HTTP endpoint exposed by the ODD Platform" — third-party
  programmatic clients, the React UI's generated TypeScript client, and
  every running platform's Swagger UI consume this spec as the wire
  contract for shape (HTTP method / path / request / response).

  The user-observable reality, per batch-Z primary-source code-walk of
  odd-platform-public-api OpenAPI spec sidecar:

  (1) **ZERO `securitySchemes` block — auth invisible to SDK generators**
  — Grep across `openapi.yaml` + `components.yaml` returns zero matches
  for `securitySchemes` and zero for `security:` declarations. The
  platform supports four UI auth modes (DISABLED / LOGIN_FORM / OAUTH2 /
  LDAP per system-mission.md P-09) + S2S `X-API-Key` + Ingestion filter
  — NONE are declared in the spec. Generated SDKs contain no
  authentication code; third-party consumers must reverse-engineer
  auth from the running service. The platform's auth posture is
  machine-illegible to its own contract surface.

  (2) **Only 3 of 194 operations declare 4xx/5xx — clients reverse-
  engineer error shapes** — Grep on `openapi.yaml` returns 2 matches
  for `'4..':` (lines 172 + 3433) and 1 for `'5..':` (line 152). The
  remaining 191 operations declare ONLY their 2xx happy path. The
  platform DOES return 4xx and 5xx in production (per every controller
  sidecar across batches D-X) but the spec is silent on the error
  shapes. SDK clients consuming the spec have no typed error model.

  (3) **Status-code drift at 7+ controllers / 9+ endpoint-level
  instances** — Grep on `openapi.yaml` returns 31 occurrences of
  `'201':` and 137 of `'200':`. Batch-W primary-source enumeration
  closes the drift at 7+ controller pairs: Owner / Role / Policy /
  Ingestion postDataEntityList / Term createTerm + updateTerm /
  DataSource registerDataSource + updateDataSource (openapi.yaml:454,
  482) / Collector registerCollector + updateCollector (openapi.yaml:558,
  586) / Tag createTag + updateTag (openapi.yaml:372, 400). Controllers
  uniformly return 200 via `ResponseEntity::ok`; tests assert `isOk()`,
  locking in 200. The drift is pervasive AND uncoordinated — spec
  author chose 201 by REST convention, controller authors chose 200 by
  Spring convention, test authors locked in 200; no review reconciled
  the three. A single directional-fix PR (align spec→code OR align
  code→spec) closes the entire cluster.

  (4) **REFACTOR-217 / F-002 path mismatch — spec PLURAL `/terms`
  vs SecurityConstants SINGULAR `/term`** — `openapi.yaml:973` declares
  PLURAL `/api/dataentities/{data_entity_id}/terms`, `openapi.yaml:1042`
  declares PLURAL `/api/dataentities/{data_entity_id}/terms/{term_id}`,
  but `SecurityConstants.java:237-242` registers PathPatternParserServer
  WebExchangeMatcher entries for `/term` and `/term/{term_id}` (SINGULAR).
  The spec is the source of truth for the path the client hits; the
  SecurityRule never matches; the authorization check is silently
  skipped. Any authenticated user can link any term to any data entity
  regardless of `DATA_ENTITY_ADD_TERM`. The spec side is CORRECT; the
  SecurityConstants side is wrong. A build-time validator comparing
  SECURITY_RULES paths against OpenAPI paths would catch every such
  drift class.

  (5) **API-reference hub abdicates to Swagger UI — 9 doc sub-pages
  vs 35 spec tags** — live API-reference page (WebFetched 2026-05-20)
  enumerates 9 per-feature sub-pages (Alerts / Data Collaboration /
  Directory / Glossary / Integrations / Lineage / Query Examples /
  Reference Data / Relationships) but the spec partitions operations
  across 35 tags. 26 tags have no doc-side sub-page — `dataEntity`
  (45+ ops, the largest tag), `dataSet`, `dataSource`, `owner`, `tag`,
  `namespace`, `policy`, `role`, `permission`, `collector`, `activity`,
  `search`, `alert`, `dataCollaboration`, `dataQuality`,
  `dataQualityRuns`, `ownerAssociationRequest`, `metadata`,
  `dataEntityAttachment`, `feature`, `identity`, `title`,
  `dataEntityRun`, `dataInput`, `dataConsumer`, `links`, `genai`. The
  doc hub abdicates to Swagger UI for these 26 surfaces — third-party
  API consumers reading the spec hub miss the bulk of the platform's
  API surface as canonical content.

  (6) **DOC-GAP-099 inverse-semantic — `getMyObjects*` summaries are
  the INVERSE of the implementation** — `openapi.yaml:842-878`
  summaries say "Returns list of data entities owned by current user
  with [upstream|downstream] dependencies" but the implementation
  returns NON-owned entities reachable from the owned set. 4-angle
  triangulation (spec layer + service layer at
  DataEntityRelationsServiceImpl + repository SQL + controller-method
  sidecars) confirms. The spec is the LOAD-BEARING source of the
  misframe — SDK clients consuming the spec for multi-tenant
  deployments would assume tenant isolation that does not exist.

  (7) **Spec publicly served at `{platform-base-url}/api/v3/api-docs`
  — reconnaissance surface** — every running platform serves the
  spec via springdoc-openapi. Under `auth.type=DISABLED` (the shipped
  default per system-mission.md P-09) the URL is reachable
  unauthenticated; even under LOGIN_FORM/OAUTH2/LDAP the Swagger UI's
  reachability is not specified by the spec or doc. The full
  194-operation surface (incl. operation IDs, paths, DTO shapes,
  contact email `ndementev@provectus.com` per `openapi.yaml:5-9`) is
  the easiest reconnaissance target before any authentication.

  Multiple secondary drifts compound: `info.title:
  ProspectLog data catalog HTTP API contract` (line 3) carries a
  legacy project name visible in every Swagger UI; `servers:` is the
  stub literal `'http://localhost' description: stub`
  (openapi.yaml:10-12) — SDK generators using the spec'd value target
  localhost; no `x-rate-limit` / `x-throttle` declarations + no
  `maximum:` on `PageParam`/`SizeParam` mean clients cannot discover
  rate limits or pagination caps from the spec; QueryExampleFormData
  (components.yaml:2799-2808) lacks a `name` field — query examples
  rendered by short label in the UI cannot be authored via the spec'd
  API; the `createDataEntityTagsRelations` operationId is "create"
  but the controller semantic is replace-all-internal-tags.

  ZERO end-to-end conformance test exists between this spec and the
  running platform. DOC-GAP-099 (5-shape drift family: inverse-semantic,
  operationId-misnamed, coverage-gap, response-shape-contradiction,
  status-code-drift) is the direct consequence — drift accumulates
  between spec and controllers because nothing structurally guards
  their alignment. A spec-driven contract test (fire every spec'd
  operation against a running platform instance, assert status-code +
  response-DTO field-set) would catch every triangulated drift
  currently logged AND surface unknowns.
facets_summary: |-
  Pillar-anchor feature for P-11 (Platform API & Developer Surface) —
  the LAST UNCOVERED PILLAR. 14 substantive drifts: zero
  securitySchemes (auth illegible to SDK generators) + only 3 of 194
  operations declare 4xx/5xx (no typed error model) + 201-vs-200
  status code drift across 7+ controllers (single directional-fix PR
  closeable) + UPDATE-with-201-description copy/paste at 5 spec
  locations + REFACTOR-217 path mismatch silently disables term-link
  authorization + 9 doc sub-pages abdicate 26 tags to Swagger UI +
  DOC-GAP-099 inverse-semantic 4-angle triangulated on getMyObjects
  family + spec publicly served as reconnaissance surface + servers:
  stub localhost + no rate-limit / pagination-cap declarations +
  QueryExampleFormData missing name field + ProspectLog legacy
  branding + zero contract test exists. Single-cluster-fix PRs
  feasible for the status-code drift (one direction per controller
  family) and for the REFACTOR-217 path mismatch.
