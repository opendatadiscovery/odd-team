name: Mount Quality Dashboard (two-pane layout with scoped jotai Provider)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The page-mount operation for `/data-quality` — a pure-composition
  React route entry that establishes the dashboard's page skeleton in
  three steps: (1) wrap the entire subtree in a fresh
  `DataQualityAtomProvider` (a nested jotai `<Provider>`), giving the
  dashboard's filter atoms a lifetime bounded by the page mount;
  (2) render a sticky left `Sidebar` (`<DataQualityFilters/>` — the
  writer side of the shared atom); (3) render a flex-grow `Content`
  pane (`<DataQualityContent/>` — the reader side + dashboard data
  fetch). NEW operation, batch ZC (2026-05-22).

  The operation issues no data fetch, holds no state, and renders no
  data of its own. Its evidence-of-intent is the deliberate
  `<DataQualityAtomProvider>` wrapper at DataQuality.tsx:8 — a no-op
  pass-through whose only reason to exist is to name and localise the
  atom scope. The wrapper is byte-identical to
  `OwnerAssociationsAtomProvider`, `DEGLineageAtomProvider`,
  `DatasetStructureAtomProvider` — the consistently-applied per-feature-
  store convention (see `jotai-feature-scoped-store` entity).

  The route is lazy-loaded + code-split (`App.tsx:39`, `React.lazy`),
  mounted under the app-wide `AppSuspenseWrapper`, and — unlike the
  sibling `/lookup-tables` route — is NOT wrapped in any permission
  guard, so any authenticated user who can reach the app shell renders
  this page (see `ui-route-no-permission-guard-data-quality-vs-lookup-tables-contrast`
  invariant).
vocabulary_status: codebase-anchored
