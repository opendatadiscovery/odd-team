  Testcontainers integration test (4-sidecar cross-batch confirming pattern). (a) Authenticate as administrator. (b) POST /api/roles to create a new role. (c) PUT /api/roles/{id} to update. (d) DELETE /api/roles/{id}. (e) Query the activity-feed table for any RBAC-related events within the window. Assert: ZERO entries. (f) Query application logs for any role-mutation INFO/WARN lines. Assert: ZERO entries. (g) Pin the audit-asymmetry: tag-assignment changes DO emit activity events; role mutations do NOT. (h) Future REFACTOR-NNN flips this test to expect events.
