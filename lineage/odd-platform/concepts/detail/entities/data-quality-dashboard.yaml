name: Data Quality Dashboard (catalog-wide aggregate quality view)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-04
description: |-
  The standalone catalog-wide Data Quality dashboard mounted at the `/data-quality`
  UI route — the GLOBAL aggregate quality view, DISTINCT from the per-dataset
  "Test reports" tab (the F-022 / data-quality-test surface). NEW entity, batch ZC
  (2026-05-22), the first concept-catalog contributor for pillar feature P-04:F-002.

  The page is a two-pane composition: a sticky left filter sidebar
  (DataQualityFilters) and a content pane (DataQualityContent) that renders three
  DonutChart breakdown rings — Table Health, Test Results Breakdown, Monitored
  Tables — plus one per-test-category result row (TestCategoryResults). The whole
  subtree is wrapped in a dedicated jotai `<Provider>` (DataQualityAtomProvider)
  so the dashboard's filter atoms are scoped per page mount.

  The single backend contract behind the entire page is
  GET /api/dataqatests/runs (operationId getDataQualityTestsRuns), served by
  DataQualityRunsController and returning the DataQualityResults DTO
  (`testResults[]` per-category run-status counts + `tablesDashboard` table-health
  and monitored-tables aggregates). One aggregate fetch serves all three rings and
  every category card — a single atomic snapshot, no partial-load skew. The
  backend zips three repository queries (getLatestDataQualityRunsResults /
  getLatestTablesHealth / getMonitoredTables) into one response DTO.

  vocabulary_status: codebase-anchored + doc-side-covered. The live
  https://docs.opendatadiscovery.org/features/data-quality/dashboard sub-page
  (WebFetched 2026-05-22 status 200) names the `/data-quality` route verbatim as
  "the catalog's cross-entity quality view" and describes the three breakdown
  rings; the pillar landing https://docs.opendatadiscovery.org/features/data-quality
  (same date, status 200) distinguishes the top-level "Data Quality" tab
  (aggregate dashboard) from the per-entity "Test reports" tab.
