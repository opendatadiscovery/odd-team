notes: |-
  Architecturally significant pattern not seen elsewhere in the
  catalog so far. Surface as a canonicalisation candidate; the
  maintainer may promote to ADR if future features (e.g., outbound
  webhooks, email notifications) adopt the same shape.

  STRENGTHENED batch ZF — the EventApiController INBOUND mirror is
  the most economical evidence to surface the pattern as an
  architectural commitment rather than a per-feature decoration.
  The two advisory-lock-IDs (sender=120, receive=110) are
  documented in `DataCollaborationProperties`; the symmetry of
  the two sub-systems is intentional.

  Potential MERGE candidate: this invariant overlaps with
  `202-queue-postgres-advisory-lock-single-sender-pattern` (same
  shape described from a slightly different angle). The
  maintainer call is whether to consolidate the two yamls or
  retain both for triangulation. Recommended: consolidate, keep
  this name (more descriptive).
