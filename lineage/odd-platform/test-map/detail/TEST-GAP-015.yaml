behaviour: |-
  Caller chooses arbitrary `entity_oddrn`; no check that the caller is authorised
  to raise a DISTRIBUTION_ANOMALY against that entity. Fabricated alerts surface to
  all authenticated users on the target entity's page. STRENGTHENED batch P — the
  AlertManagerController#postAlerts sidecar PRIMARY-SOURCE confirms the spoof surface
  at the method-tier with THREE independent anchors: (1) AlertManagerController.java:24
  passes `req.getAlerts()` verbatim into AlertServiceImpl with no validation step
  between; (2) AlertServiceImpl.java:178 maps `externalAlert.getLabels().get("entity_oddrn")`
  directly to `AlertPojo.dataEntityOddrn` with no entity-existence check, no caller-identity
  binding; (3) compound surface confirmed at method tier — combined with REFACTOR-024's
  cross-owner read on `GET /api/alerts` (every authenticated user sees forged alerts
  on the platform-wide All tab). The live doc verbatim 2026-05-20: "Anyone with
  network reach to the platform can POST arbitrary AlertManager-shaped payloads
  and create alerts on any data entity." This is the F-007 `cross_tenant_alert_creation`
  facet — NOW PRIMARY-SOURCE at the method tier. STRENGTHENED batch S — the AlertServiceImpl
  service-tier closure sidecar (2026-05-20) PRIMARY-SOURCE confirms three negations
  at the SERVICE TIER: (a) no lookup against DATA_ENTITY to confirm the oddrn refers
  to a real entity; (b) no caller-identity check (the AlertManager path has no SecurityContext
  to consult by design); (c) no ownership/permission check that the (anonymous-or-authenticated)
  caller is authorised to alert on the named entity. The service-tier line `setDataEntityOddrn(externalAlert.getLabels().get("entity_oddrn"))`
  at AlertServiceImpl.java:178 is the LOAD-BEARING line; combined with the unauthenticated
  webhook (per batch P AlertManagerController.postAlerts security.known_security_gaps[2,3])
  and the cross-owner read at `listAll` (REFACTOR-024 family), this is the canonical
  forge-and-display compound. The orphan case (label missing → null entity FK) is
  documented on the live page; the spoof case (label present but referencing an entity
  the caller has no business creating alerts on) is NOT.
