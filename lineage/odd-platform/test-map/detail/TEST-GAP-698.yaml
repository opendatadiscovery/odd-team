proposed_action: |-
  Add `DataSourceIngestionServiceImplCrossCollectorOwnershipPreservationTest.prepareForUpdate_existingRowFromCollectorA_currentRequestFromCollectorB_preservesCollectorIdA_pinsStolenTokenDefence`. (a) Mockito-style test. (b) Mock `reactiveCollectorRepository.getDto(collectorB_id)` to return Collector B's CollectorDto. (c) Mock `reactiveDataSourceRepository.getDtosByOddrns([oddrnX])` to return an EXISTING DataSourceDto whose pojo has `collector_id = collectorA_id` + `namespace_id = nsA` + populated `token_id`. (d) POST payload with `{ oddrn: oddrnX, name: "newName", description: "newDesc" }`. (e) Capture the `DataSourcePojo` passed to `bulkUpdate(...)` via ArgumentCaptor. (f) Assert the captured pojo has `collectorId == collectorA_id` (NOT collectorB_id), `namespaceId == nsA` (NOT Collector B's namespace), `tokenId == original tokenId` (NOT null and NOT Collector B's). Assert `name == "newName"`, `description == "newDesc"`. (g) Add a `// REGRESSION-PIN — Cross-collector ownership preservation is a SECURITY-CRITICAL INVARIANT. A stolen Collector B token CANNOT take over a datasource originally registered by Collector A by re-POSTing with the same ODDRN. The defence lives in the copy-construct at lines 86-88 (new DataSourcePojo(a)). A REFACTOR that changes prepareForUpdate to use new DataSourcePojo() (without the copy-construct) would silently allow the attack. This test pins the invariant against that REFACTOR.` comment block.
