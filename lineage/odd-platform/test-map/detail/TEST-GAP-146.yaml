gap_id: TEST-GAP-146
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java LoginFormSecurityConfiguration config-key-consumer:auth.type@L31
surfaced_by:
- LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[5]
- LoginFormSecurityConfiguration@L31.md:security.known_security_gaps.[4]
behaviour: 'CSRF disabled on a session-cookie auth mode: line 54 calls `.csrf(ServerHttpSecurity.CsrfSpec::disable)`.
  A logged-in user visiting a malicious page can have state-changing requests issued
  via their session cookie. Mitigated only if downstream endpoints reject cookie-bearing
  POSTs without an additional header (they do not).'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/LoginFormCSRFDisabledTest.java
  name: loginForm_postWithSessionCookieNoCsrfToken_returns2xx
evidence:
- 'LoginFormSecurityConfiguration@L31.md says: ''CSRF is unconditionally disabled
  at line 54 — even though LOGIN_FORM is a session-based authentication mode where
  CSRF is the canonical defense vector'''
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[5]
proposed_action: Authenticate via form login; capture the session cookie; POST to
  a state-changing endpoint with NO CSRF token + the session cookie; assert HTTP 2xx
  (current posture). Locks the CSRF-disabled posture.
