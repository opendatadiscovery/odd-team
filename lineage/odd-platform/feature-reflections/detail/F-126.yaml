    downstream (via lineage) of the entities they own.
  derivation: |-
    Tab label "Dependents" + endpoint /api/alerts/my/dependents (listDependentObjectsAlerts) which walks a
    recursive LINEAGE CTE from the owner's oddrns; live doc confirms "downstream ... via lineage".
  seed_source: view-mode
  validation:
    verdict: partial
    actual_behavior: |-
      The query is correct: listDependentObjectsAlerts resolves the owner's oddrns via getObjectsOddrnsByOwner
      then walks a recursive LINEAGE CTE (WITH RECURSIVE, LINEAGE.IS_DELETED=false) to find downstream
      entities and filters STATUS=OPEN. The gap is a silent-empty: the tab is shown to any owner (showMyAndDepends
