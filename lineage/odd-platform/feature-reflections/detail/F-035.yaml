- id: H-004
  hypothesis: |-
    "When the operator types url='javascript:alert(1)' (or pastes a malformed/non-http URL) into
    odd.links, the platform rejects it — either at config load (boot fails fast) or by refusing to
    render a dangerous link — because 'url' promises an addressable web resource."
  derivation: |-
    The field is named 'url'; the live doc says 'absolute URL'; an operator's reasonable assumption
    (and a Principal-engineer default) is that a field named url is validated against a URL schema
    before it ships to users' browsers.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      Nothing validates the scheme at any layer. AdditionalLinkProperties.Link.url is a bare String
      with NO @URL, @Pattern, @NotBlank, @Validated (per the record). The Spring binder accepts
      javascript:, data:text/html, file:, vbscript:, empty string, null, and relative paths
      (wiki.internal). LinksController passes the string through verbatim. AppInfoMenu sets it as the
      <Link to=...> which becomes the <a href>. The ONLY defence is React 17+'s runtime sanitiser
      (strips javascript: from href, leaving a no-op clickable link) plus the browser (modern Chrome
      refuses top-level data: navigation). Neither is a platform guarantee; both are invisible to the
      operator; both could regress on a React or browser change.
    evidence:
      - sidecar: odd-platform__java__config_properties__config-properties-class__AdditionalLinkProperties.md
        section: stress_findings.request_inputs[1]
        cite: "AdditionalLinkProperties.java:8 (no @URL, no @Pattern, no scheme check)"
        note: "DRIFT_INPUT_NAME_VS_IMPLEMENTATION — 'url' accepts any String; the chain flows it unmodified to <a href>."
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: stress_findings.request_inputs[0]
        cite: "AppInfoMenu.tsx:61"
        note: "Link.to accepts the string verbatim; defence is React's runtime sanitiser, not the app."
    operator_visible_failure: |-
      (1) An operator typo'd 'wiki.internal' (forgetting https://) ships a menu item that
      relative-navigates within the SPA to /wiki.internal -> route-not-found page; no warning at any
      layer. (2) A javascript: URL renders as a clickable title that silently does nothing (React
      neutralises it) — the operator believes the link is broken with no diagnostic. (3) A data:text/html
      URL renders an <a href> the operator did not anticipate; modern browsers sandbox it but the
      behaviour is surprising and version-dependent. (4) Compounded with H-005 (missing title
      validation) and H-007 (reverse tabnabbing), an unvalidated operator-supplied (or
      less-trusted-role-supplied) URL becomes a workspace-wide attack surface. The fix is one
      annotation (@Pattern('^https?://.*') + @Validated) at AdditionalLinkProperties.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    "When the operator omits the title for a link (sets url but no title), the platform rejects the
    entry rather than rendering an invisible-but-clickable menu item — because every link the user
    sees must carry a visible label."
  derivation: |-
    The doc calls title a 'required field'. A menu item with no visible text but a live click target
    is a phishing-vector enabler and a UX defect; an operator assumes 'required' is enforced.
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      The doc says title is 'required' but the record has NO @NotBlank on title. The binder accepts an
      entry with url set and title null/empty. The UI renders <Typography variant='h4'>{link.title}</Typography>
      with empty content inside a live <Link to={url}> — producing a menu item that is (near-)invisible
      but clickable. 'Required' is documented but enforced exactly nowhere.
    evidence:
      - sidecar: odd-platform__java__config_properties__config-properties-class__AdditionalLinkProperties.md
        section: security.known_security_gaps[2]
        cite: "AdditionalLinkProperties.java:8 (no @NotBlank on title)"
        note: "Operator can configure url-without-title -> invisible-but-clickable menu item; phishing-vector enabler."
      - sidecar: odd-platform__java__config_properties__config-properties-class__AdditionalLinkProperties.md
        section: docs_link_semantic.doc_drift_findings[0]
        cite: "AdditionalLinkProperties.java:8"
        note: "Doc says title/url are 'required fields'; record has no JSR-303 constraint -> doc-vs-code claim mismatch."
    operator_visible_failure: |-
      An operator (or a less-trusted role with ConfigMap-edit access) plants an entry with no title;
      the menu shows an apparently-blank row that is nonetheless clickable, navigating an unsuspecting
      user to the configured URL. Even benignly, a fat-fingered missing title produces a confusing
      blank menu row with no boot-time error to alert the operator. Fix: @NotBlank on title +
      @Validated on the class (same one-PR fix as H-004; tracked in PLT-088 Defect 1).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: |-
    "A keyboard-only user (Tab to the information icon, press Enter) and a touch-device user (tap the
    icon on a phone or tablet) can open the App Info menu and reach the operator-configured links —
    the same way they reach every other control in the platform."
  derivation: |-
    Senior-product-owner UX seed (mandatory per Rule 9): "Does the user understand how to use this
    from what is on screen? How does it behave across device types?" The icon button declares
    aria-haspopup='true' + aria-controls — the author SIGNALLED keyboard support — so a user (and an
    assistive technology) reasonably expects Enter/Space to open it.
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |-
      The icon button wires onMouseEnter ONLY (AppInfoMenu.tsx:81) — there is NO onClick, NO onKeyDown,
      NO onFocus handler. Keyboard users can focus the button but pressing Enter/Space does nothing;
      the menu never opens. Touch devices generate no mouseenter on the button, so tapping it does
      nothing. The aria-haspopup='true' (line 80) and aria-controls={menuId} (line 79) attributes claim
      a keyboard affordance that is not wired — the ARIA lies. This is a WCAG 2.1 SC 2.1.1 (Keyboard)
      violation AND a total mobile-UX failure, not a degradation.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: bugs_limitations_corner_cases[1]
        cite: "AppInfoMenu.tsx:78-82"
        note: "Button declares aria-haspopup='true' + aria-controls but wires only onMouseEnter; no keyboard/touch handler."
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: security.known_security_gaps[3]
        cite: "AppInfoMenu.tsx:74-82"
        note: "WCAG 2.1 SC 2.1.1 violation; ARIA attributes claim support that does not exist."
    operator_visible_failure: |-
      (1) Every keyboard-only and screen-reader user is locked out of the ENTIRE App Info menu — not
      just operator links, but the Documentation link, the Slack link, the project version, and the
      Feedback link. (2) Every phone and tablet user (iOS Safari, Android Chrome) cannot open the menu
      by tapping — the feature is invisible to all mobile traffic. (3) ODD deployments serving
      accessibility-required audiences (US federal Section 508, EU public sector EN 301 549, enterprise
      compliance) cannot pass an accessibility audit with this widget. The aria-haspopup attribute makes
      it WORSE: automated AT announces "menu available, press to open" and then nothing happens. Fix:
      add onClick + onKeyDown(Enter/Space) handlers, keep onMouseEnter for hover-discoverability
      (tracked in PLT-088 Defect 3).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: |-
    "When a user clicks an operator-configured link and it opens in a new tab, the destination page
    CANNOT control or redirect the original ODD Platform tab (the parent tab is isolated)."
  derivation: |-
    Standard target='_blank' security expectation. A user clicking an internal-wiki link trusts that
    opening it cannot hijack their authenticated ODD session tab. rel='noopener noreferrer' is the
    platform-portable defence.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      All five link sites in AppInfoMenu (operator-links at line 61 AND the four hardcoded targets at
      41/95/103/112) use <Link target='_blank'> WITHOUT rel='noopener noreferrer'. The newly-opened
      page receives a non-null window.opener pointing at the ODD tab and can run
      window.opener.location = 'https://phishing.example.com' to silently navigate the parent. Modern
      Chrome/Firefox/Safari apply noopener-by-default for target='_blank' since 2020, BUT react-router
      <Link>'s pass-through is not guaranteed and compatibility-trailing browsers are unprotected; the
      explicit rel is the portable defence and it is absent.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: bugs_limitations_corner_cases[0]
        cite: "AppInfoMenu.tsx:41, 61, 95, 103, 112"
        note: "All 5 link sites render target='_blank' without rel; window.opener leaks to every destination."
      - sidecar: odd-platform__java__LinksController__controller-class__LinksController.md
        section: bugs_limitations_corner_cases[0]
        cite: "AppInfoMenu.tsx:60-66"
        note: "Reverse-tabnabbing vector from any operator-configured URL; bounded by who controls odd.links."
    operator_visible_failure: |-
      A user clicks an operator-configured link to a compromised internal wiki (or any future-XSS'd
      destination); they switch tabs to read it; meanwhile the wiki page's JS has redirected their ODD
      tab to a pixel-perfect fake login page. When they switch back, they re-enter credentials into the
      attacker's form. The four hardcoded first-party targets (docs/slack/github/producthunt) inherit
      the same window.opener leak as a defence-in-depth gap. Compounds with H-004 (no scheme validation)
      and H-005 (no title validation): an unvalidated operator link becomes a workspace-wide
      reverse-tabnab vector. Fix: add rel='noopener noreferrer' to all 5 sites (one mechanical edit per
      site; tracked in PLT-088 Defect 2 / REFACTOR-629).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: |-
    "When the operator edits odd.links in a running deployment (adds a new runbook link) and the
    change is applied, users see the new link on their next page navigation."
  derivation: |-
    An operator's default mental model for a config change is "edit the YAML/ConfigMap and it takes
    effect" — many platforms hot-reload config. The operator expects the new link to appear without a
    disruptive restart.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The change is invisible until a full process restart AND, for already-open tabs, until a full
      browser reload. Two compounding layers: (a) AdditionalLinkProperties is a Spring
      @ConfigurationProperties record bound once at context refresh into a final field on a singleton
      bean — there is no @RefreshScope, and /actuator/refresh is not exposed by default; the JVM holds
      the boot-time list for its lifetime. (b) Even after the operator restarts the backend, AppInfoMenu
      sets keepMounted on the MUI menu (line 90) and useAppLinks sets no staleTime/refetchInterval, so
      the widget never unmounts and never refetches for the SPA tab's lifetime — users with an open tab
      keep seeing the OLD list until they hard-reload.
    evidence:
      - sidecar: odd-platform__java__config_properties__config-properties-class__AdditionalLinkProperties.md
        section: stress_findings.resource_boundaries
        cite: "AdditionalLinkProperties.java:6 + AdditionalLinkConfiguration.java:8 (no @RefreshScope)"
        note: "Boot-time bind; runtime YAML edits invisible until restart — a structural property of @ConfigurationProperties."
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: bugs_limitations_corner_cases[2]
        cite: "AppInfoMenu.tsx:90 + lib/hooks/api/appInfo.ts:11-17"
        note: "keepMounted + no staleTime -> widget never unmounts/refetches; YAML edits invisible until full page reload."
    operator_visible_failure: |-
      The operator adds a link, refreshes their own page, sees nothing change, and burns 5-10 minutes
      suspecting a typo or a broken endpoint before discovering a restart is required. Worse, after the
      restart, colleagues with long-lived tabs STILL don't see the new link and report it as missing,
      so the operator cannot trust "it's deployed" even after restarting. There is no in-product signal
      ("config changed, please restart" / "reload to see new links"). The boot-immutability is an
      intentional architectural default (per implicit_adrs) — so the right remediation is a doc caveat
      (already shipped via REFACTOR-631/DOC-257) PLUS optionally a UI staleTime fix; the contradiction
      against the user's expectation stands regardless.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-009
  hypothesis: |-
    "The operator-configured links are a navigation convenience visible to every signed-in user — the
    operator can put internal-wiki/runbook URLs here knowing they are gated behind authentication."
  derivation: |-
    Pillar P-08 primary-user-action: operator configures catalog wiring. The doc states the links are
    'exposed through the authenticated GET /api/links endpoint and are visible to every user signed in'.
    Tests the boundary: is 'authenticated' actually enforced, and is 'every user' the intended scope?
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |-
      TRUE under LOGIN_FORM/OAUTH2/LDAP: /api/links has no SECURITY_RULES entry and is not in
      WHITELIST_PATHS, so it falls through to the framework-default pathMatchers('/**').authenticated()
      rule — every authenticated user (regardless of role/owner) reads the identical list, matching the
      doc's 'visible to every user signed in'. FALSE under auth.type=DISABLED: DisabledAuthSecurity
