oracle:
  - For Scenario A — `autocommit=true` AND first 5 partitions dropped AND
    6th partition NOT dropped (corrupt parse error during the LIST phase
    means none would be attempted) OR `autocommit=true` AND first 5
    dropped AND remaining {7..10} skipped (corrupt parse error during the
    DROP loop short-circuits the rest of the cycle).
  - For Scenario B — Postgres returns "relation does not exist" to the
