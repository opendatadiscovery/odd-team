behaviour: |-
  **SCHEMA-ROOTED REGRESSION-PIN: the activity audit log STRUCTURALLY CANNOT record RBAC / Owner / Datasource / Collector-token mutations.** This is NOT a missing-annotation gap — `V0_0_48__add_activity.sql:4` declares `data_entity_id bigint NOT NULL` and `V0_0_48__add_activity.sql:12` declares the FK constraint `activity_data_entity_id_fk FOREIGN KEY (data_entity_id) REFERENCES data_entity (id)`. Activity rows physically cannot exist without a `data_entity_id`. RBAC mutations (Role.create / Role.update / Policy.create / Owner.create / Owner.delete / role-to-owner attach / policy-to-role attach), Collector token rotation, Datasource registration — none of these have a `data_entity` context, so they cannot emit to this table even if a future `@ActivityLog` annotation were added. STRENGTHENS the 4-sidecar audit-silence pattern at the REPOSITORY-SCHEMA tier with the structural impossibility anchor: TEST-GAP-573 (Role-side audit-silence) + TEST-GAP-238 family (Owner audit-silence) + TEST-GAP-549 (Tag ingestion audit asymmetry) all share the same root cause but only this one is the SCHEMA-rooted PRIMARY-SOURCE pin. The remediation requires either: (a) a separate platform-event audit surface (e.g. `audit_event` table), (b) a NULLable `data_entity_id` with a discriminator, OR (c) acceptance that the activity table is the "data-entity audit log" not the "platform audit log" — with doc-side acknowledgement. No test currently pins this invariant; a future maintainer "fixing" the audit gap by adding `@ActivityLog` to RoleServiceImpl.create would discover the FK violation at runtime via an unhandled DataAccessException.
