  was empty at the isPartitionEmpty check but a concurrent INSERT
  lands BEFORE the DROP TABLE (the race), Postgres behaviour: DROP
  TABLE acquires ACCESS EXCLUSIVE lock; if a concurrent INSERT is in
  flight, the DROP waits behind it OR vice-versa depending on
  lock-arrival order — when DROP wins the race, the in-flight INSERT
  (which holds RowExclusiveLock on a partition that's about to vanish)
  errors with 'relation activity_YYYYMMDD_YYYYMMDD does not exist'. NO
  TEST EXISTS for this race."
