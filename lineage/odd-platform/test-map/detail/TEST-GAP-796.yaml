proposed_action: |-
  Add `NotificationSubscriberStarterNoThreadDeathDetectionRegressionPinTest`. Testcontainers-Postgres setup:

  1. `subscriberInterruptedDuringOuterSleep_threadDiesSilently_noRestart_pinsSilentSubsystemLoss` —
     - Boot platform with `notifications.enabled=true` and a stub `NotificationSender` recording every send invocation.
     - Force the subscriber into the outer 10s back-off by injecting a poison ALERT.
     - During the back-off window, `Thread.interrupt(...)` the subscriber's worker thread.
     - Wait 5 s.
     - Assert the subscriber thread is no longer alive (`executor.getActiveCount() == 0`).
     - Assert NO restart fires (executor's queue is empty, no new submission).
     - PINS the silent subsystem-loss.

  2. `subscriberDead_newAlertInserted_noNotificationFires_pinsAlertLossWhileDead` —
     - Continue from test 1's dead-subscriber state.
     - INSERT a valid ALERT row (well-formed type_id, valid data_entity_oddrn).
     - Wait 30 s.
     - Assert the stub `NotificationSender` did NOT receive `.send(...)`.
     - PINS the alert-loss-while-subscriber-dead.

  3. `subscriberDead_walSlotLsnFrozen_pinsWalRetentionAfterDeath` —
     - Continue from test 2's dead-subscriber state.
     - Query `SELECT confirmed_flush_lsn FROM pg_replication_slots WHERE slot_name = '<configured>'`.
     - Wait 30 s.
     - Re-query.
     - Assert the LSN is the SAME (i.e. frozen — no advance because no subscriber to advance it).
     - PINS the WAL retention compound failure.

  4. `subscriberDead_jvmRestart_subscriberResumes_pinsOnlyRecoveryPath` —
     - Continue from test 3.
     - Restart the entire platform (Spring context refresh).
     - Wait 15 s.
     - Assert the stub sender received the alert from test 2 (proves recovery is via restart only).
     - CONFIRMS the recovery is JVM-restart-only.

  Pair with REFACTOR-NNN (retain Future + auto-restart) — after the fix, test 1 should be updated to assert the restart fires within bounded time; the test transitions from "pin the absence of recovery" to "pin the auto-restart".

  Coherence note (LSN-018 Rule 6): This finding does NOT contradict TEST-GAP-455 (poison-replay loop). Both can coexist: the poison-replay loop is what KEEPS the subscriber spinning on a bad message; this gap is what happens when the subscriber's worker thread DIES (e.g. SIGTERM hits the outer sleep, InterruptedException re-throws). Distinct failure modes; both load-bearing for F-009. NET-NEW finding — no prior TEST-GAP pins the thread-death-no-detection pathology.
