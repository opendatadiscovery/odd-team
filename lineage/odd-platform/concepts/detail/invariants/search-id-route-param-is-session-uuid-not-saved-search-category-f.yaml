name: |-
  searchId URL route-param is a session UUID, NOT a saved-search id (Category F drift — UI-layer instance)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
description: |-
  **NEW MEDIUM-severity Category F INVARIANT, batch ZI (2026-05-26)** —
  the SPA's `/search/{searchId}` URL form exposes a route parameter
  called `searchId` whose NAME promises a saved-search/durable-handle
  semantic but whose IMPLEMENTATION binds to a server-side transient
  session row in `search_facets` with NO user binding, NO TTL guarantee
  visible at the UI layer, and mutated by every facet change.

  **Trace** (from searchRoutes batch ZI):

    - URL form: `searchRoutes.ts:4-5` declares
      `SEARCH_ID_PARAM = ':searchId'`. The path template at line 9 is
      `generatePath('${BASE_PATH}/${SEARCH_ID_PARAM}')` → produces
      `/search/{uuid}`.
    - Param hook: `useSearchRouteParams()` at lines 18-19 returns
      `{searchId: string}` via `useParams<keyof SearchRouteParams>()`.
    - Consumer: `Search.tsx:27` reads `routerSearchId`; at lines 44-48
      dispatches `getDataEntitiesSearch({searchId: routerSearchId})`.
    - Thunk: `dataentitiesSearch.thunks.ts:43-50` calls
      `searchApi.getSearchFacetList({searchId})` → `GET /api/search/{searchId}`.
    - Backend: `SearchController.getFacetList(searchId)` per batch-M
      class-level sidecar — `SearchServiceImpl.fetchFacetState(searchId)`
      → `ReactiveSearchFacetRepositoryImpl.get(id)` →
      `SELECT * FROM search_facets WHERE id = {uuid}::uuid` (raw
      UUID-keyed lookup, no owner predicate, no created_by predicate).

  **The NAME `searchId` promises**:
    1. A SAVED-SEARCH IDENTIFIER (operator's mental model: "search #42",
       like Jira's saved-filter ids or Splunk's report ids — durable,
       bookmarkable, user-owned).
    2. A USER-MEANINGFUL HANDLE (operator's mental model: shareable,
       like a Twitter status URL where every viewer sees the same
       canonical thing).
    3. A QUERY-DEFINITION POINTER (operator's mental model: the URL
       encodes WHAT was searched, even if results change as data
       evolves).

  **The IMPLEMENTATION provides**:
    1. **A server-side TRANSIENT SESSION ROW** in `search_facets`
       (`V0_0_1__init.sql:204-211` — no `owner_id`, no `created_by`,
       no `user_id` column; the UUID IS the sole identifier). NOT a
       saved-search; the table HAS the
       `housekeeping.ttl.search_facets_days` (default 30 days)
       reaper which deletes the row asynchronously. Bookmark fragility
       at week 5+.
    2. **A BEARER-TOKEN-SHAPED HANDLE** (per existing
       `search-facets-bearer-token-shaped-no-user-binding` invariant)
       — any authenticated user with any other user's `searchId` UUID
       can READ + UPDATE + DRIVE that session. Cross-user link sharing
       exposes the recipient to whatever state the session has at
       fetch time (which may differ from when the link was sent).
    3. **A MUTABLE STATE POINTER** — every facet change calls `PUT
       /api/search/{searchId}/facets` mutating the SAME row. The URL
       does NOT encode WHAT was searched; it points to a row whose
       contents change. User A clicking around their UI mutates the
       row in real time; User B opens the URL 30 seconds later and
       sees state B never expected.

  **Operator-visible consequences** (three patterns):

  (a) **Bookmark fragility**. A user bookmarks `/search/{uuid}`. After
      30 days the housekeeping job deletes the row. The bookmark
      returns 404. The user sees an empty Catalog (or a toast) and
      doesn't understand why their "saved search" disappeared. The
      doc page at `/features/data-discovery/search` does NOT mention
      the URL form, does NOT mention the TTL, does NOT warn about
      bookmark fragility (WebFetched 2026-05-26 status 200).

  (b) **Cross-user sharing exposes whatever state the session has at
      fetch time**. User A shares `/search/{uuid}` with User B; B
      (authenticated) opens it. If A is concurrently clicking around
      their UI (mutating the same row via PUT /facets), B sees the
      session in whatever state it happens to be in — not necessarily
      what A intended to share. The URL behaves like a pointer, not
      a snapshot.

  (c) **Tab navigation drops the session**. The Catalog top-nav tab
      (`ToolbarTabs.tsx:38`) links to `searchPath()` (no UUID). Clicking
      the tab navigates to `/search` (no param). Search.tsx:37-42 sees
      no UUID and dispatches `createDataEntitiesSearch(...)` →
      `POST /api/search` → server INSERTs a NEW `search_facets` row →
      navigates to `/search/{new-uuid}`. The previous session's UUID
      is dropped from the URL bar; the previous session row still
      exists in the database (and is reachable by direct URL until
      the TTL reaper deletes it).

  **The same Category F drift class — but at a different layer.** The
  existing `LSN-020` family captures drift at the SQL layer (e.g.
  `userIds` filter binding to `USER_OWNER_MAPPING.OWNER_ID` instead of
  `activity.created_by`; the `Title` filter binding to
  `OWNERSHIP.TITLE_ID` instead of dataset name). This invariant is the
  drift at the URL-PARAM-LAYER — same shape, different surface. The
  operator first encounters the misleading name in the URL bar; they
  never see the SQL.

  **Fix surfaces** (maintainer-triage):

    1. **Rename the URL param** (high-churn). `/search/{searchSessionId}`
       or `/search/session/{id}` would more accurately encode the
       transient-session semantic. Breaking change for any external
       link or third-party deep-link target.

    2. **Document the semantic on the doc page**. The
       `/features/data-discovery/search` page does NOT mention URLs at
       all today. A "Session URLs" section explaining that the URL
       represents a transient session (not a saved search), that
       URLs are session-handles (not bookmark-safe beyond 30 days by
       default), and that URL sharing exposes whatever state the
       session has at fetch time. LOW-churn; high operator value.

    3. **Implement a real saved-search feature** if operator demand
       exists. The current `search_facets` row IS the persistent
       session; adding a `name` + `owner_id` + a "Save" affordance
       in the UI would transform it into a true saved-search. This is
       a feature, not a fix.

  vocabulary_status: codebase-anchored, NOT in docs. The live doc page
  uses the phrase "search and filtering" but does NOT name the URL
  form, the session semantics, or the bookmark fragility.
vocabulary_status: codebase-anchored
