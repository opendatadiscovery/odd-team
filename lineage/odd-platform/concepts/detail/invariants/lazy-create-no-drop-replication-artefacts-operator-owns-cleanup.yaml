notes: 'Surface as a cross-cutting invariant for future enrichments — any new

  Postgres-resident server-side artefact (a new publication, a new

  logical-replication subscriber, a new range-partitioned table) is

  likely to inherit this same shape. The maintainer may eventually want

  to formalise this as a code-side stance: "lazy-create-no-drop is the

  ODD convention; document it in enable-deployment + provide a manual

  cleanup checklist for uninstall."

  '
