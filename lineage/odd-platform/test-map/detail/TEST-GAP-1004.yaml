behaviour: |-
  **LOW — bare `/data-modelling` URL redirects to `/data-modelling/query-examples` via `<Navigate to='query-examples' replace />`** at `components/DataModelling/DataModellingRoutes.tsx:16`. The redirect is the PATTERN-DONE-RIGHT counterpart to TEST-GAP-998 (bare /terms blank) + TEST-GAP-999 (bare /master-data blank).

  **Why this is operator-relevant**:
  - The deliberate UX shape: typing `/data-modelling` lands directly on Query Examples (not a chooser, not a 404).
  - This pattern is shared with Management (`/management` → `/management/namespaces` via `<Navigate>` at ManagementRoutes.tsx:151) and Alerts (`/alerts` → `/alerts/all` per the alerts sidecar `implicit_adrs.[4]`).
  - A regression that REMOVES the Navigate (regressing to blank, like /terms and /master-data) ships green and silently degrades operator UX for any code path that uses `dataModellingPath()` and navigates (e.g. a future post-create redirect).
  - A regression that CHANGES the redirect target (e.g. `relationships` instead of `query-examples` — a deliberate product decision documented in dataModelling sidecar `implicit_adrs.[Query Examples is canonical first tab]`) ships green and the operator silently lands on the wrong tab.

  **No test pins this**: there is no integration test that asserts the redirect happens, no test that asserts the redirect TARGET is `query-examples` (not `relationships`).

  **The cross-route consistency** (per dataModelling sidecar): the redirect-not-blank pattern is the documented project-wide convention; the blank-page outliers (`/terms`, `/master-data`) are deviations. A single test pinning the redirect anchors the deliberate design choice across the routes/ directory.
test_class: missing-integration
criticality_rationale: |-
  Sidecar rates this LOW and held LOW: (a) trivial pure-redirect behaviour, no operator consequence today; (b) the redirect target is intentional product choice (Query Examples canonical first tab — documented in implicit_adrs[3]); (c) regression risk bounded (a redirect-target change would be reviewer-visible). Logged to pin the deliberate target so a future "let's make Relationships the canonical landing" PR has a regression-pin to flip explicitly. NOT escalated for cross-pillar — sticks within P-02.
