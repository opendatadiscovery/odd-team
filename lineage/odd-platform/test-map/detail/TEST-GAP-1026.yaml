  Two-test approach. **Test 1** — `SchedulingThreadPoolTest.twoScheduledJobsDueSimultaneously_secondWaitsForFirst`: declare two `@Scheduled(fixedRate = 1s)` test components, one sleeping for 5 seconds; assert via Micrometer or simple System.currentTimeMillis differencing that the second's `start` is ≥ first's `end`, not concurrent. Locks the single-thread contract. **Test 2** — `SchedulingPoolSizeOverrideTest.springTaskSchedulingPoolSize4_jobsRunConcurrently`: same fixture but with `spring.task.scheduling.pool.size: 4` in test properties; assert both jobs' wall-clock windows overlap. Locks the operator-mitigation contract. When the maintainer ships an explicit `@Bean public TaskScheduler` declaration (REFACTOR-NNN), both tests anchor the new behaviour.
