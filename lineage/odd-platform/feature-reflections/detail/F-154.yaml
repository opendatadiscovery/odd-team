- id: H-005
  hypothesis: |-
    When the backend rejects the submit (duplicate name 400, validation error, or
    server 5xx), the operator sees an error message explaining why the term was not
    saved.
  derivation: |-
    Negative-space + the existing Alert scaffold — every authoring dialog in the
    platform is expected to report a failed save. TermsForm already has an Alert
    component (TermsForm.tsx:50, 122-147) used for the client-side duplicate warning, so
    a backend error has an obvious home.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The submit chain at TermsForm.tsx:100-111 is `dispatch(createTerm|updateTerm)
      .unwrap().then(...)` with NO `.catch(...)`. When the backend rejects (a duplicate
      name surfaces BadUserRequestException from TermServiceImpl, or any 4xx/5xx), the
      promise chain rejects, the `.then` never runs, navigation never happens, and
      nothing renders the error. The dialog stays open with the form filled and the
      operator gets no feedback. This is the LSN-024-shaped silent-empty failure class
      (cross-link F-064). The Alert component that could surface the error already exists
      (TermsForm.tsx:50, 122-147) but is wired only to the client-side duplicate path.
    evidence:
      - sidecar: F-154 feature-flow facet no_error_handler_on_dispatch_chain_silent_failure_on_backend_reject
        section: observed
        cite: "TermsForm.tsx:100-111"
        note: "dispatch chain with no .catch — backend rejection swallowed"
      - sidecar: F-154 feature-flow facet no_error_handler_on_dispatch_chain_silent_failure_on_backend_reject
        section: observed
        cite: "TermsForm.tsx:50, 122-147"
        note: "Alert scaffolding already present, only used for client-side duplicate"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: security.data_exposure
        cite: "TermServiceImpl.java:110-111"
        note: "backend returns BadUserRequestException 'Term already...' the UI never shows"
    operator_visible_failure: |-
      An operator who hits ANY backend rejection (the very duplicate the client check
      missed at scale per H-003, a transient 5xx, a uniqueness race with another author)
      clicks Save and nothing visible happens. The dialog does not close, no error
      appears, the term is not created. They click Save again, get the same silence, and
      conclude the feature is broken. There is no diagnostic path short of opening the
      browser network tab. This compounds H-003: the two defects together mean a
      large-catalog duplicate is invisible both before AND after submit.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: |-
    When a new term is created, its detail page (and the data it depends on) shows the
    just-saved values immediately — the operator does not see stale cache after the
    navigate.
  derivation: |-
    Cache-correctness — TermsForm invalidates a react-query cache slot on success
    (TermsForm.tsx:105-108) specifically so the destination page is fresh. The user
    expects the term they just authored to display correctly.
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |-
      TermsForm.tsx:105-108 calls `queryClient.invalidateQueries({queryKey: ['term',
      termId]})` where `termId` comes from useTermsRouteParams() — the URL termId. In
      CREATE mode the form is mounted from /termsearch/* where the route termId is
      `undefined` (or NaN per the termsRoutes.ts parseInt propagation noted in F-024
      batch ZH), so the invalidation fires for queryKey `['term', undefined]` — it
      invalidates nothing relevant, OR pollutes a wrong slot. The newly-created term's
      detail still renders correctly because the navigate to termDetailsPath(response.id)
      triggers a fresh fetch on a NEW key — so the user-visible page is correct (the
      promise holds for the rendered page), but the intended invalidation is a no-op and
      `['term', undefined]` accumulates dead cache entries over repeated creates. In EDIT
      mode the route termId IS defined, so the invalidation is correct there.
    evidence:
      - sidecar: F-154 feature-flow facet query_client_invalidate_by_undefined_termid_in_create_mode
        section: observed
        cite: "TermsForm.tsx:36"
        note: "termId from useTermsRouteParams() — the URL termId"
      - sidecar: F-154 feature-flow facet query_client_invalidate_by_undefined_termid_in_create_mode
        section: observed
        cite: "TermsForm.tsx:105-108"
        note: "invalidate by route termId; undefined/NaN in CREATE mode"
    operator_visible_failure: |-
      The user-visible term-detail page is correct after create (the navigate refetches
      on the real id), so the immediate UX is not broken — this is why the verdict is
      partial, not contradicted. The latent failure is (i) accumulating dead
      `['term', undefined]` cache entries across a session of multiple creates, and
      (ii) any OTHER view depending on the create-time invalidation (e.g. a cached list)
      is not refreshed in create mode. An operator creating several terms in a row and
      switching between cached views may see one stale until a hard reload.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: |-
    When an operator authors a term Definition, the Markdown they type is treated as
    content — a pasted HTML/JS snippet is NOT executed as live script for later viewers
    of the term.
  derivation: |-
    Response-shape / negative-space — the Definition is a <Markdown editor> field
    (TermsForm.tsx:168-186) whose value round-trips to other users' screens when they
    view the term. A senior product owner assumes authored rich text is sanitised before
    it renders for a different user (the universal stored-XSS expectation).
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The definition field is `<Markdown {...field} editor height={200}>`
      (TermsForm.tsx:183) which accepts arbitrary Markdown including raw HTML + <script>.
      On submit the raw string round-trips through TermServiceImpl.createTerm /
      updateTerm with no Jsoup.clean, no allowlist, no length cap (per the F-154 facet
      definition_markdown_editor_xss_surface_extension_f_004 + the TermServiceImpl
      sidecar's F-004 intersection finding). PLT-059 confirms the editor has no
      rehype-sanitize. This dialog is the AUTHORING entry point for the third
      Term-specific surface of the F-004 stored-XSS family: an operator with TERM_UPDATE
      can plant a payload here and it executes for every authenticated viewer who later
      opens the term. The mention-parser staging path compounds it (a [[<script>:foo]]
      payload persists verbatim in *_unhandled_term staging rows per the TermServiceImpl
      F-004-XSS-intersection finding, TermServiceImpl.java:67, 513-522).
    evidence:
      - sidecar: F-154 feature-flow facet definition_markdown_editor_xss_surface_extension_f_004
        section: observed
        cite: "TermsForm.tsx:168-186"
        note: "Markdown editor with `editor` prop — accepts raw HTML/JS, no sanitiser"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: bugs_limitations_corner_cases
        cite: "TermServiceImpl.java:67, 201-207, 513-522"
        note: "F-004 stored-XSS intersection; raw definition persisted + staging-row payload persistence"
    operator_visible_failure: |-
      Stored XSS: an operator with TERM_UPDATE (or, via the description side-channel, a
      lower-privileged user) pastes <script>...</script> or an onerror img payload into a
      term definition; it is persisted verbatim; every authenticated user who opens that
      term's detail page (or any data entity whose Terms section surfaces the mention)
      executes the script in their session. Consequences span session-token theft,
      catalog defacement, and the SQL-injection-token-exfiltration class already
      confirmed exploitable elsewhere in the platform (PLT-109). This is the
      highest-severity finding on the form because the authoring surface is exactly where
      the payload enters.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: |-
    When an operator with TERM_CREATE permission (but WITHOUT NAMESPACE_CREATE) types a
    namespace name that does not yet exist into the Namespace combo-box and submits, the
    platform tells them they cannot create a namespace (or the combo-box does not let
    them type a novel one).
  derivation: |-
    Cross-pillar promise — namespaces are a Management (P-08) entity gated by
    NAMESPACE_CREATE (system-mission.md P-08). A user with only the Glossary's
    TERM_CREATE should not be able to mint a Management-tier entity. The NamespaceAuto-
    complete combo-box is the control whose meaning this hypothesis tests.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The NamespaceAutocomplete (TermsForm.tsx:161-167) accepts a novel namespace name
      the user types. On submit the string flows to TermServiceImpl.createTerm /
      updateTerm → namespaceService.getOrCreate(namespaceName)
      (TermServiceImpl.java:103, 138), which creates the namespace if it does not exist —
      and NEVER consults NAMESPACE_CREATE. So a TERM_CREATE-only operator silently mints
      a platform-wide namespace by typing it. The select-or-create combo-box backed by a
      getOrCreate is itself a deliberate, legitimate UX pattern (rev-8/rev-19 ADR — NOT a
      "side-door" in the LSN-023 sense), so the PATTERN is intended; the DEFECT is the
      RBAC gap (no NAMESPACE_CREATE check on the create branch) plus the absent UI signal
      that typing a new name will create one. This is tracked at the backend layer in
      PLT-101 and at the form layer in PLT-059 (defect F-154e).
    evidence:
      - sidecar: F-154 feature-flow facet namespace_create_via_namespace_autocomplete_bypass_at_authoring_time
        section: observed
        cite: "TermsForm.tsx:161-167"
        note: "NamespaceAutocomplete with no creation gate / no novel-input signal"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: security.known_security_gaps
        cite: "TermServiceImpl.java:103, 138"
        note: "NAMESPACE_CREATE bypass via getOrCreate on the term write path"
    operator_visible_failure: |-
      (i) RBAC bypass: an operator scoped to TERM_CREATE only mints platform-wide
      namespaces (a Management-tier entity) merely by typing a new name — the namespace
      taxonomy an admin curates can be polluted by any term author. (ii) Accidental
      namespace creation: an operator who fat-fingers an existing namespace name
      (`finace` for `finance`) silently creates a near-duplicate namespace with no
      confirmation, fragmenting the term space. The combo-box looks like a pure selection
      affordance, so neither consequence is anticipated by the user.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

- id: H-009
  hypothesis: |-
    When an operator creates a term whose definition contains a [[namespace:term]]
    mention of a term that does not yet exist, and that mentioned term is later created,
    the mention auto-links — and conversely, creating THIS term resolves any earlier
    parked mentions of IT.
  derivation: |-
    Terminal side-effect — the F-154 feature-flow terminal_side_effect names
    resolveUnhandledDescriptionMentions (TermServiceImpl.java:116) draining the staging
    table on create (cross-time auto-link, F-056). A glossary author expects forward
    references they typed to reconcile when the term arrives.
  seed_source: cross-pillar
  validation:
    verdict: confirmed
    actual_behavior: |-
      On createTerm, TermServiceImpl.java:116 calls resolveUnhandledDescriptionMentions,
      which drains the *_unhandled_term staging rows whose (ns, name) matches the newly
      created term and materialises real is_description_link=TRUE link rows
      (TermServiceImpl.java:421-442, per the sidecar's unhandled-staging-with-auto-resolve
      implicit ADR). This is the intended forward-compatibility behaviour: descriptions
      authored before a term existed reconcile automatically when the term is created via
      this form. The behaviour is confirmed in the chain but, per the TermServiceImpl
      sidecar, has ZERO test coverage and is undocumented (F-056 / the data-glossary doc
      page does not describe it).
    evidence:
      - sidecar: F-154 feature-flow terminal_side_effect
        section: description
        cite: "TermServiceImpl.java:116"
        note: "resolveUnhandledDescriptionMentions on create — cross-time auto-link drain"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: implicit_adrs
        cite: "TermServiceImpl.java:421-442"
        note: "unhandled-mention staging auto-resolves on term-create (intentional)"
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

- id: H-010
  hypothesis: |-
    When an operator successfully creates or edits a term, the action is recorded in the
    Activity feed so an auditor can later see who authored/changed which term and when.
  derivation: |-
    Pillar / cross-pillar promise — P-07 Active Platform Features positions the Activity
    feed as the audit-trail surface; the glossary is a governance pillar. A senior
    product owner assumes term authoring is auditable.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      createTerm, updateTerm, and delete carry NO @ActivityLog annotation, and the
      ActivityEventTypeDto enum (ActivityEventTypeDto.java:3-31) defines no TERM_CREATED
      / TERM_UPDATED / TERM_DELETED value at all — the audit-silence is schema-rooted,
      not merely a service-side omission (per the TermServiceImpl
      F-006-audit-silence-enum-rooted finding). Term LINK changes do emit
      TERM_ASSIGNMENT_UPDATED, but term LIFECYCLE (the create/edit this form performs) is
      structurally invisible in the Activity feed. An operator who deletes or renames a
      term leaves no forensic trace.
    evidence:
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: implicit_adrs
        cite: "TermServiceImpl.java:99-117, 121-145, 154-165"
        note: "createTerm/updateTerm/delete carry no @ActivityLog"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: bugs_limitations_corner_cases
        cite: "ActivityEventTypeDto.java:3-31"
        note: "enum has no TERM_CREATED/UPDATED/DELETED — schema-rooted audit silence"
    operator_visible_failure: |-
      A governance operator auditing "who changed the glossary" sees term LINK events but
      no term CREATE / EDIT / DELETE events. A renamed or deleted business term has no
      activity-feed trace; reconstructing the change requires DB introspection. For a
      data-governance product this is a real audit-completeness gap, though it is a
      design-level decision (the enum is hand-curated) rather than a code bug — hence it
      routes to a caveat/doc finding alongside the test demand.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: |-
    When the form successfully creates a term, the HTTP response status is 201 Created
    (the REST convention for a created resource), so API consumers and the generated
    client treat it as a creation.
  derivation: |-
    Endpoint shape + doc-claim — POST /api/terms is a create operation; the OpenAPI spec
    (per F-002 batch U) specifies 201. The form's API consumer (and any external
    odd-api-consumer) expects the spec'd status.
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      TermController.createTerm returns `.map(ResponseEntity::ok)` (TermController.java:74
      per the F-154 chain hop-2a evidence + F-002 batch U facet
      term_create_update_status_code_drift_controller_returns_200_spec_201) — it returns
      HTTP 200, not the spec'd 201. updateTerm has the same drift. The UI form does not
      depend on the distinction (it reads the body, not the status), so the form's UX is
      unaffected — but an external odd-api-consumer coding against the OpenAPI contract
      (expecting 201 on create) sees 200, and any client that branches on status code
      misclassifies the create. This is a spec-vs-code drift, not a UI defect.
    evidence:
      - sidecar: F-154 feature-flow chain hop-2a
        section: chain.evidence
        cite: "TermController.java:74"
        note: ".map(ResponseEntity::ok) returns 200; F-002 batch U status-code-drift facet"
    operator_visible_failure: |-
      An API consumer (odd-api-consumer audience) building against the published
      Platform API spec expects 201 on POST /api/terms and gets 200; a strict client that
      asserts 201 fails, and a client that branches create-vs-update on status code
      misroutes. The UI is unaffected. Surfaces as a spec/doc drift the API-reference
      page should either correct (document 200) or the controller should fix to 201.
    severity: LOW
    confidence: HIGH
    routes_to_finding: doc-gap-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-012
  hypothesis: |-
    When an operator submits the form with a blank or whitespace-only Name or
    Definition, the form blocks the submit and tells them the field is required.
  derivation: |-
    Form fields — the F-154 chain hop-1 records Name as "required + non-whitespace" and
    Definition as "required + non-whitespace". Required-field validation is the universal
    expectation and is consistent across the platform's forms.
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |-
      Per the F-154 feature-flow chain hop-1 (TermsForm.tsx:31-219): Name is required +
      non-whitespace, namespaceName is required (NamespaceAutocomplete), Definition is
      required + non-whitespace. These are react-hook-form field rules enforced before
      the dispatch fires, so a blank/whitespace Name or Definition blocks submit and
      surfaces the required-field message. Consistent with the platform's other authoring
      dialogs. No contradiction surfaced; the gap is purely the absence of a test pinning
      the whitespace-rejection edge.
    evidence:
      - sidecar: F-154 feature-flow chain hop-1
        section: chain.evidence
        cite: "TermsForm.tsx:31-219"
        note: "Name + Definition required + non-whitespace; namespaceName required"
    confidence: MEDIUM
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

