  repository sidecars + invariants sections + concept-catalog cross-refs).
  Graduation threshold easily met. SME consultation flagged because the
  hypothesis depends on knowing operator-intent (deliberate vs accidental
  schema drift) which is not resolvable from code alone. Per slice-discipline,
  the existing F-019/020/028/031/006 lifecycle features are not modified
