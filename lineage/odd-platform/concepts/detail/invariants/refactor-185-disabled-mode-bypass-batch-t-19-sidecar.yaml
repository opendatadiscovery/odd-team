mitigations_unimplemented:
- |-
  Per the master invariant — DISABLED mode is dev-only per docs; the existing
  mitigation surface is operator discipline ("don't run DISABLED in production").
- |-
  **batch X — LOGIN_FORM facet mitigations**: wire AuthorizationCustomizer into
  LoginFormSecurityConfiguration; replace hard-coded `true` at line 81;
  boot-time fail-fast guard on default-credential + non-loopback bind;
  doc-side: precondition statement that RBAC is wired only in OAUTH2 and LDAP.
- |-
  **BATCH Z NEW — AUTH-MODE-ORTHOGONAL facet mitigations**:
  (a) Code-side: REMOVE `/ingestion/**` from SecurityConstants.WHITELIST_PATHS
      line 95-96; the legacy reason for the whitelist (skip UI auth for
      collector-driven calls) is structurally obsolete because the
      IngestionDataEntitiesFilter / IngestionDataSourceFilter chain provides
      the S2S auth surface. After removal, the four sibling /ingestion/*
      endpoints inherit UI auth fall-through behaviour from the wider
      SecurityWebFilterChain.
  (b) Code-side: BROADEN IngestionDataEntitiesFilter's path matcher from
      exact-literal `/ingestion/entities` POST to the
      pattern `/ingestion/**` ANY-METHOD — but this requires per-endpoint
      auth carve-outs (AlertManagerController is a third-party-shaped
      webhook with no collector token to validate).
  (c) Code-side: introduce per-endpoint IngestionFilter subclasses
      (`IngestionMetricsFilter`, `IngestionStatsFilter`,
      `IngestionDEGReadFilter`) each gated by its own property — quadruples
      the operator-facing configuration surface but produces a per-endpoint
      opt-in story that mirrors the existing two-filter pattern.
  (d) Doc-side: CROSS-LINK from the Data Quality page + the
      configuration-and-deployment/odd-platform page (metrics storage section)
      to the Security page's filter-coverage caveat — at the point of
      endpoint discovery, not in a separate location.
  (e) Network-side: operator-documented runbook for fronting the
      `/ingestion/**` namespace with reverse-proxy auth (mTLS / API key
      validation at the LB layer) — already the only mitigation operators
      can apply today without code changes; surface it explicitly.
- |-
  **BATCH Z NEW — at the OPENAPI SPEC layer**:
  (f) Declare a `securitySchemes` block in openapi.yaml AND per-operation
      security: declarations — would make SDK generators produce typed auth
      clients AND would surface the auth-mode posture machine-readably to
      third-party consumers; structurally addresses
      `spec-carries-no-security-block-authorization-is-wholly-out-of-band-of-the-openapi-contract`
  (g) Build-time validator: compare SECURITY_RULES path patterns to OpenAPI
      paths; fail-fast on mismatch. Would have caught REFACTOR-217
      (term/terms) and the second SecurityConstants bug (alert-status
      DATASET_FIELD_ADD_TERM mis-permission) at build time.
notes: |-
  STRENGTHENED batch 2026-05-20Z — REFACTOR-185 is now a 27-sidecar pattern
  covering THREE structurally distinct facets:
    (1) DISABLED facet — `.anyExchange().permitAll()`; UI surface;
        operator-discipline mitigation; 19 sidecars baseline
    (2) LOGIN_FORM facet — `.authenticated() + getAuthorities(true)`;
        UI surface; default-credential dependency + wire-the-customizer
        mitigation; +5 sidecars
    (3) AUTH-MODE-ORTHOGONAL facet — `/ingestion/**` in WHITELIST_PATHS
        + exact-POST-only IngestionDataEntitiesFilter matcher; S2S
        surface; NO TOGGLE CLOSES IT — network-layer or code-side
        mitigations only; +3 sidecars (this batch)
  The third facet is qualitatively different from the prior two — it cannot
  be mitigated by operator discipline because the property name
  auth.ingestion.filter.enabled suggests broader scope than it has, AND
  the live docs surface the gap only at the Security page (not where
  operators encounter the endpoints). The directional remedy
  candidates (a)-(e) all require code-side changes.

