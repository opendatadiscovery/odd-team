behaviour: 'No cycle-detection inside the recursive CTE — `UNION ALL` body without
  visited-set guard; termination depends solely on `tDepth.lessThan(lineageDepth.getDepth())`.
  For graphs with cycles or diamond-shaped DAGs, intermediate row counts grow multiplicatively
  before the outer `selectDistinct` deduplicates. STRENGTHENED batch H — the repository
  sidecar confirms this at the SQL primary source: `lineageCte` (lines 150-176) uses
  UNION ALL with no inner DISTINCT, no Postgres `WITH ... CYCLE` clause (PG 14+ feature
  not used here), no LIMIT inside the CTE, no row-count cap. The outer `selectDistinct`
  (line 127) deduplicates the FINAL result but does NOT prune the CTE intermediate
  work — confirming REFACTOR-202 amplification at the SQL layer.'
