behaviour: |-
  **HIGH — the deep-link / shareable-URL round-trip is unverified — the `DataQualityFilters` bidirectional `useEffect` sync (URL ↔ `formFiltersAtom`, `DataQualityFilters.tsx:28-54`) is the load-bearing contract that bookmarked dashboards survive a reload, and there is NO test pinning either direction.**

  **The contract** (statically certain):
  - On mount: `DataQualityFilters.tsx:28-43` iterates `searchParams`, `JSON.parse`s each value, and writes the parsed `FilterOption[]` into `formFiltersAtom[key]` for each `key in newFilters` (i.e., known filter keys only). This is the URL→atom direction — what happens when an operator opens a bookmarked or pasted `/data-quality?...` URL.
  - On every `formFilters` change: `DataQualityFilters.tsx:46-54` iterates `formFilters`, `JSON.stringify`s every non-empty array, calls `setSearchParams(newSearchParams, { replace: true })`. This is the atom→URL direction — what happens when the operator selects a filter chip.
  - The `replace: true` flag avoids polluting browser history (no Back button needed to walk through every keystroke).

  **What can silently break**:
  - URL→atom regression: a maintainer changes the JSON-encoding shape, or renames a filter key, or accidentally early-exits the loop. The next time an operator follows a bookmark, the dashboard renders empty filters even though the URL has filter params — operator-visible regression, no error message.
  - atom→URL regression: a maintainer removes the `JSON.stringify` or changes the `replace: true` flag. Bookmarks generated AFTER the regression silently differ from bookmarks generated BEFORE; OR the browser history fills up with every keystroke.
  - **The keys are JSON-encoded FilterOption[]** carrying `{id, name}` PAIRS (not just ids) — so a URL bookmark carries names. A maintainer who decides to URL-encode only ids breaks bookmarked URLs without realising they relied on the name half.

  **This is the operator-facing deep-link contract**. The `dashboard.md` live doc (WebFetched 2026-05-22 status 200) is SILENT on filter persistence / deep-linking (DataQualityFilters.md:docs_link_semantic.doc_drift_findings.[2]) — operators have to discover it. A regression that breaks the contract removes a discoverable-but-undocumented feature with no signal.

  **Why HIGH not MEDIUM**: this is a load-bearing UX contract for the dashboard's primary audience (data-quality engineers triaging catalog health) — bookmark / share / paste a filtered dashboard is HOW the team uses the surface day-to-day. A regression here ships green; the operator's only signal is "my bookmark stopped working". Sister to TEST-GAP-911 (the auth posture) — both are operator-facing posture contracts that are deliberate but unguarded.

  **Test gap shape**: integration test mounting `<DataQuality>` in a `<MemoryRouter>` with seeded initial entries. Three assertions: (a) URL→atom: mount at `/data-quality?namespaceIds=[{"id":42,"name":"prod"}]`; assert `formFiltersAtom.namespaceIds` equals `[{id:42, name:"prod"}]`. (b) atom→URL: select a filter chip; assert `setSearchParams` was called with the chip's value JSON-stringified into the param. (c) round-trip: select a chip, then unmount + remount the same component at the URL produced by step (b); assert the atom hydrates back to the same state.
