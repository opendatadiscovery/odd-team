proposed_action: |-
  Author PolicyControllerConcurrencyTest using two parallel WebTestClient
  invocations to drive simultaneous PUTs against the same policy_id with
  different bodies. Assert both return 200, then GET the policy and assert
  the body equals exactly ONE of the two posted bodies (second-wins). Add a
  separate test for the cascade-binding orphan race (concurrent DELETE +
  POST /api/roles/{r}/policies binding the same policy). The tests SHIP RED
  if and when the maintainer adopts ETag/If-Match/@Version optimistic locking;
  the current behaviour pin lets the fix be a deliberate test rewrite.
