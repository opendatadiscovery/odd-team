# Microservices lineage — product-owner reflection

## product_owner_narrative

Microservices Lineage is the second of the two sub-features under the Data Lineage pillar (P-05); the first is Data Objects Lineage (F-005 / F-016). To a new customer the pitch is one of ODD's five headline differentiators — "End-to-end microservices lineage support" — and it answers the question *"when service A calls service B which calls the orders database, can I see that whole call chain on one screen alongside my datasets and jobs?"* The answer is yes: a microservice instrumented with OpenTelemetry emits trace spans; the standalone `odd-tracing-gateway` push adapter (the platform's only standalone-gateway integration) infers the service topology and ingests `MICROSERVICE`-class transformer entities plus their call edges through the Ingestion API; those nodes then render in the catalog and on the lineage canvas (per system-mission.md P-05 + per WebFetch https://docs.opendatadiscovery.org/features/data-lineage/microservices 2026-06-03).

The user reaches it exactly like any other entity's lineage: open a catalogued microservice's detail page and click the **Lineage** tab — route `/dataentities/{id}/lineage` (per Lineage.md:understanding). The same depth slider, the same upstream/downstream canvas, the same pan/zoom, the same `Load N more` expansion, the same click-through-to-navigate behaviour apply. There is no separate "microservices view", no mode toggle, no `?ms=` flag, and no microservice-specific affordance anywhere in the chain (per Lineage.md bugs[2] "No microservices-specific branch"; LineageGraph.md bugs[7]). The single UI dispatcher (`Lineage.tsx:14,19-25`) branches ONLY on `isDEG` (data-entity-group vs everything-else); a microservice's entity class is not `ENTITY_GROUP`, so it falls through to the `HierarchyLineage` renderer identically to a Postgres table or a Spark job (per Lineage.md:understanding + concepts.invariants.no-microservices-branch). In the catalog, "Microservice" is only a type label in the type-name enum (per odd-platform-ui/src/lib/constants.ts:110 `[TypeNameEnum.MICROSERVICE, { normal: 'Microservice', plural: 'Microservices' }]`) — it changes the icon/label text, not the lineage rendering or the response shape.

The working parts are entirely inherited from the data-object lineage chain. The backend read is class-agnostic end-to-end: the controller `GET /api/dataentities/{id}/lineage/downstream` (and `/upstream`) is a three-line pass-through (per getDataEntityDownstreamLineage.md:understanding); the service `LineageServiceImpl.getLineage(long, int, List<Long>, LineageStreamKind)` accepts NO `EntityClass` parameter and produces ONE `DataEntityLineage` shape for every class (per LineageServiceImpl.md:understanding, LineageServiceImpl.java:87-122); the recursive-CTE walk in `ReactiveLineageRepositoryImpl` (java:122-176) filters only by `IS_DELETED.isFalse()` with no owner predicate and no class predicate. The terminal projection is the class-agnostic `lineageMapper.mapLineageDto` (LineageServiceImpl.java:121) — so any microservice-specific payload field a tracing gateway emits (operation_name, span_kind, error_rate, p95_latency, callsPerMinute, service-call cardinality) has no slot in the response DTO and is silently dropped at the mapper (per LineageGraph.md:182 bugs[7] + doc-understanding/data-lineage__microservices.md doc_claim_vs_code[0]).

The integration story: this surface is the consuming end of P-10 → P-05 (`odd-tracing-gateway` emits microservice edges via OTel/OTLP — the only ingestion path). It shares the exact same HTTP surface, security posture, and DoS profile as F-005 — including the cross-owner read posture (REFACTOR-203) and the unbounded-depth / null-default-NPE defects on the lineage endpoints (per LineageServiceImpl.md bugs + getDataEntityDownstreamLineage.md bugs). Because microservice lineage encodes *operational call topology* rather than schema structure, the cross-owner read posture is materially more sensitive on this class than on datasets: leaking that service X (team A) calls service Y (team B) reveals team B's internal architecture even when team B's individual entities are not otherwise enumerable.

A product owner demoing this would highlight the empty state (a microservice with no ingested traces shows an empty canvas — same as any entity with no lineage, verified by IT-029's negative case) and would have to caveat, honestly, that the "microservices lineage" promise is satisfied by *participation in the uniform lineage model*, not by a bespoke operational view. The live microservices doc page has been rewritten (doc HEAD 30795b4) to say exactly this — "the same UI surface as Data Objects Lineage" — so the original "doc promises a distinct surface" framing of this feature is now largely doc-mitigated (per WebFetch 2026-06-03 + doc-understanding/data-lineage__microservices.md). The reflection below tests what the uniform surface actually delivers for a microservice.

