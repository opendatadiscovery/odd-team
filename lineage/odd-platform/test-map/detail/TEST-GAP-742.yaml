behaviour: |-
  **MEDIUM — `deleteQueryExample` has THREE cascade-incompleteness issues: (a) leaks `query_example_search_entrypoint` rows; (b) leaves the soft-deleted entity's name in FTS; (c) leaves orphan link rows when the parent DataEntity is soft-deleted.** Primary-source confirmed in the batch-V QueryExampleController sidecar:

  **Search-entrypoint leak on delete**:
  - `query_example_search_entrypoint` rows are CREATED/UPDATED on every create + update via `updateQueryExampleVectors` (`QueryExampleServiceImpl.java:166-167`).
  - `deleteQueryExample` (`QueryExampleServiceImpl.java:84-92`) — the 3-step delete chain (a) hard-deletes link rows in `data_entity_to_query_example`, (b) hard-deletes link rows in `query_example_to_term`, (c) soft-deletes the example itself via the abstract soft-delete CRUD base. NO step touches `query_example_search_entrypoint`.
  - **Search filters DO check** `QUERY_EXAMPLE.DELETED_AT IS NULL` (`ReactiveQueryExampleRepositoryImpl.java:80, 99`), so the leaked entrypoint row doesn't surface in search results — BUT the storage leak is real and unbounded over time.
  - No housekeeping job exists. The leak accumulates linearly with query-example-deletion rate.

  **Hard-delete-of-links + soft-delete-of-entity asymmetry**:
  - The hard-deleted link rows (`data_entity_to_query_example`, `query_example_to_term`) are GONE — no recovery path for those relationships.
  - The soft-deleted query_example row tombstones with `deleted_at` populated, NULL relationship references.
  - If the platform ever adds an "undelete query example" affordance, the restored example would have NO linked datasets or terms — context lost.

  **Orphan link rows after DataEntity soft-deletion**:
  - `data_entity_to_query_example` has FK constraint to `data_entity` (`V0_0_84__create_query_example.sql:21-22`) with NO `ON DELETE CASCADE`. The DataEntity uses soft-delete (`is_deleted = TRUE`, not DELETE FROM).
  - When a DataEntity is soft-deleted, its `data_entity_to_query_example` rows remain valid at the FK level but point to a tombstoned entity.
  - The `getQueryExampleDatasetRelations` query (`ReactiveDataEntityQueryExampleRelationRepositoryImpl.java:62-72`) does NOT filter on `DATA_ENTITY.IS_DELETED = FALSE`, so the query example continues to report a linked-entity reference to a deleted entity.

  **Operator-observable consequences**:
  - Slow storage growth in `query_example_search_entrypoint` table; bounded by query-example deletion rate.
  - Orphan link rows surface as "ghost references" in query example details: a Query Example detail page shows "Linked to: TombstonedDataEntity" until housekeeping picks up the parent entity.
  - The asymmetric delete (links hard, entity soft) is undocumented; operators planning recovery scenarios cannot anticipate it.

  **Why MEDIUM not HIGH**: each individual incompleteness is bounded — search filters catch the FTS leak in user-facing search; orphan link rows surface in detail pages but don't block reads; storage growth is slow. MEDIUM at the per-instance severity. Cross-pillar P-02 (Data Modelling — Query Examples surface).

  **Test gap shape**: regression-pin asserting (a) search-entrypoint row remains after delete; (b) orphan link rows persist after parent DataEntity soft-delete; (c) hard-deleted link rows are not recoverable.
