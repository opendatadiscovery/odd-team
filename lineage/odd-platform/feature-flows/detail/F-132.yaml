feature_id: F-132
feature_name: |-
  Query Example Details Tab Navigation — Overview / Linked Entities /
  Linked Terms tabs with `?tab` URL-state + count-hint badges; per-tab
  pure-render sub-views
pillar_id: P-02
pillar_anchored_id: P-02:F-001
pillar_anchored_feature_name: Query Example Detail Page Navigation
seeded_from: ui-review-2026-05-26
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  ui-component:QueryExampleDetailsTabs — the tab navigation within the
  Query Example Details page at /data-modelling/query-examples/:queryExampleId.
  Three tabs: Overview (Markdown render of definition + query), Linked
  Entities (data-entity table view of `linkedEntities.items`), Linked
  Terms (term table view of `linkedTerms.items`). Tab selection
  persisted via `?tab=overview|linked-entities|linked-terms` URL param.
