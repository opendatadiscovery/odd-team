proposed_action: |-
  Add `MinioConfigBuilderRegressionPinTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/attachment/config/`. Two test methods:

  1. `minioAsyncClient_builderChainContainsExactlyEndpointCredentialsBuild` — `@SpringBootTest(properties = { "attachment.storage=REMOTE", "attachment.remote.url=http://localhost:9000", "attachment.remote.access-key=test", "attachment.remote.secret-key=test", "attachment.remote.bucket=test" })`; inject `MinioAsyncClient` bean; reflect on the client's internal state OR record the builder calls via a `@MockBean` `MinioAsyncClient.Builder` and assert the call sequence is exactly `endpoint() → credentials() → build()`. Assert NO `region()` call. PIN the LSN-002 in-code state.

  2. `minioAsyncClient_signaturesAreSignedAsUsEast1` — `@SpringBootTest` + Testcontainers MinIO (which ignores the region header — happy path proves wiring) + a stub `httpClient` that captures the outgoing SigV4 `Authorization` header; assert the `Credential` scope string ends with `/us-east-1/s3/aws4_request`. PIN the runtime consequence.

  Add a `// REGRESSION-PIN — LSN-002 — MinioAsyncClient.builder() never calls .region(...). AWS S3 buckets outside us-east-1 fail. This test pins the current behaviour until REFACTOR-027 lands an operator-configurable attachment.remote.region key. When the fix lands, change the assertion from \"no .region() call\" to \"the configured region OR documented default\". Live-doc cross-link: https://docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#attachment-storage-configuration` comment block.

  Pair with: (a) REFACTOR-027 implementation (add `attachment.remote.region` config key with `:us-east-1` default and `.region(operatorRegion)` builder call); (b) live-doc update once fix lands — change the warning to "operators MUST set `attachment.remote.region` for buckets outside us-east-1".
