behaviour: '**SQL-INJECTION VECTOR.** `getHighlightedResult` interpolates the `text`
  and `tsQuery(query)` arguments into raw SQL via `String.formatted(text, tsQuery)`
  at ReactiveDataEntityRepositoryImpl.java:799-806. Both parameters can contain single
  quotes (the server-built searchableString includes user-controllable fields; the
  user query passes through `tsQuery` which only adds prefix-matching, not escaping).
  No parameter binding, no quote-escaping, no allow-list. No test currently exists;
  a future maintainer "improving" the highlight feature without recognising the raw-format
  SQL would not catch a regression that broadens the surface, AND a fix that adds
  parameterisation would be unverifiable. test_class: security.'
test_files_existing: []
test_files_proposed:
