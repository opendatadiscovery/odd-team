      The UI is QUIETER than the API. Under auth.type=DISABLED, /api/identity returns an empty permissions array, so the WithPermissions wrappers hide every COLLECTOR_* affordance (Add/Edit/Delete/Regenerate). But DisabledAuthSecurityConfiguration sets .anyExchange().permitAll() and the SecurityConstants COLLECTOR_* rules are bypassed — a direct `curl POST /api/collectors` succeeds anonymously, returns a Collector with a fresh plaintext token, and that token is a legitimate credential the always-on IngestionDataSourceFilter accepts on POST /ingestion/datasources. So an attacker bypassing the UI mints collectors and bootstraps a hostile collector identity, while the operator sees a read-only-looking surface.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "coupling (UI-vs-API asymmetry) + requires-config (auth.type DISABLED)"
        cite: "DisabledAuthSecurityConfiguration.java:11-19 + SecurityConstants.java:127-137 + CollectorsList.tsx:91-101"
        note: "UI hides buttons under DISABLED; backend accepts anonymous mutations regardless."
    operator_visible_failure: |
      An operator running a DISABLED-mode demo or staging instance reachable on a network sees no mutation buttons and infers safety; anyone on the network can POST /api/collectors, copy the response token, and register hostile datasources. The UI's silence is a false safety signal. This is the REFACTOR-185 19th-surface finding (UI-vs-API asymmetry under DISABLED). The compound bypass extends through the entire collector boot-of-self chain.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-011
  hypothesis: "When a collector deployment is clustered behind a non-sticky load balancer, POST /ingestion/datasources works correctly regardless of which platform instance each request lands on."
  derivation: "Cross-pillar / negative-space — a horizontally-scaled platform is an expected production deployment; an S2S endpoint should not depend on session affinity."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      POST /ingestion/datasources is structurally unsupported on a non-sticky cluster. IngestionDataSourceFilter writes the matched collector id into the WebSession (COLLECTOR_ID_SESSION_KEY, stringly-typed, non-final); IngestionController reads it back from the session on the SAME request. But the session store defaults to IN_MEMORY (application.yml:30 + SessionConfiguration's ReactiveMapSessionRepository(new ConcurrentHashMap)) — a per-process map with no cluster replication. A request landing on a different node finds no session entry and IngestionController.java:54 throws IllegalStateException("Collector id is null"), which surfaces as HTTP 500 (the parent filter catches only AccessDeniedException → 401). Compounded by spring.session.timeout=-1 (sessions never expire).
    evidence:
      - sidecar: odd-platform__java__service__service__DataSourceIngestionServiceImpl.md
        section: "coherence_check REFACTOR-419 (cluster-fragility session-bridge)"
        cite: "IngestionDataSourceFilter.java:36-38 + IngestionController.java:50-58 + application.yml:28-30"
        note: "Session-attribute identity bridge over an IN_MEMORY per-process store; cross-instance hop = 5xx."
    operator_visible_failure: |
      A clustered operator (the canonical production shape) sees intermittent 5xx on datasource registration with the message "Collector id is null" — which reads as a platform crash, not "switch session.provider to REDIS/INTERNAL_POSTGRESQL or enable sticky sessions." The live doc DOES document the three session providers + cluster caveat, but the SHIPPED default is cluster-fragile. Tracked as PLT-074 (IN_MEMORY default breaks multi-replica collector bridge + session.timeout=-1).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-012
  hypothesis: "When an entity is ingested via POST /ingestion/entities (created, updated, restored-from-soft-delete, or has its metadata/lineage destroyed), the platform records an audit-trail entry an operator can later consult to answer 'what happened during this ingestion?'."
  derivation: "Negative-space + pillar — an audit surface is expected for a write API; a security investigation should be able to reconstruct ingestion-driven mutations."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The audit trail records ONLY entity CREATION, and nothing else. ActivityIngestionRequestProcessor emits DATA_ENTITY_CREATED for new entities, but: updates emit nothing; soft-delete RESTORE is silent (IngestionServiceImpl.java:135-136 un-archives with no activity event); the metadata-delete-on-absence and lineage-replace destructions emit nothing; datasource registration/overwrite emits nothing. @Slf4j is present on IngestionServiceImpl and IngestionController but UNUSED (zero log.* calls) — so even the application log is empty. So the hypothesis holds for the create case and fails for every other mutation, including the destructive ones.
    evidence:
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: "requires-runtime (@Slf4j unused) + dependencies_semantic (restore is silent)"
        cite: "IngestionServiceImpl.java:53,135-136"
        note: "@Slf4j dead code; soft-delete restore + destructive paths emit no activity event and no log."
      - sidecar: odd-platform__java__IngestionController__controller-class__IngestionController.md
        section: "feature-flow batch-ZF finding (7) — @Slf4j dead code across 5 handlers"
        cite: "IngestionController.java:30"
        note: "Controller layer is also forensically silent; entire S2S surface has zero application-log auditability."
    operator_visible_failure: |
      An operator investigating "why did 3 entities I deleted reappear last night?" or "who erased the lineage on this dataset?" has NO answer at the service or controller log level and no Activity Feed entry — only the resulting DB state. The audit trail's apparent completeness (a DATA_ENTITY_CREATED event exists) is misleading: the destructive and restore operations are exactly the ones an investigator needs and exactly the ones that are silent. Joins the platform-wide audit-silence pattern (cross-link F-006, PLT-062).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-013
  hypothesis: "When a collector re-ingests an entity via POST /ingestion/entities with a metadata set or lineage edge list that OMITS a field/edge present last tick, the platform PRESERVES the previously-ingested metadata and lineage (merge semantics) — a transient partial scrape does not lose catalog state."
  derivation: "Pillar mission + the user-observable promise in F-008's description ('merge semantics: a collector re-publishes a SUBSET of fields per tick and the platform integrates them with what it already knew')."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The chain is REPLACE, not merge. MetadataIngestionRequestProcessor.java:72-80 computes bindingsToDelete = existing.difference(current) and DELETES the omitted metadata bindings inside the same transaction. LineageIngestionRequestProcessor.java:17 calls replaceLineagePaths; LineageServiceImpl.java:124-133 extracts the establishers in the payload, batchDeleteByEstablisherOddrn(establishers), then batchInsertLineages(pojos). The establisher_oddrn is hard-coded to each entity's own ODDRN (IngestionServiceImpl.java:243/253/260/269), so re-ingesting an entity replaces ALL edges it established last tick. A collector that drops a field (network flake, OOM, partial scrape, code bug) silently deletes it. No log.warn, no activity event, no payload-level diff (response is Mono<Void>).
    evidence:
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: "concepts.invariants[8] (establisher-keyed rewrite — assembly-layer enactment)"
        cite: "IngestionServiceImpl.java:243,253,260,269 + MetadataIngestionRequestProcessor.java:72-80 + LineageServiceImpl.java:124-133"
        note: "Establisher-keyed payload drives the destruction; difference-then-delete for metadata."
      - sidecar: odd-platform__java__service__service__LineageServiceImpl.md
        section: "implicit_adrs (establisher-keyed atomic-rewrite contract)"
        cite: "LineageServiceImpl.java:124-133"
        note: "delete-by-establisher then insert — the REPLACE verb."
    operator_visible_failure: |
      (1) A collector tick that returns a partial view (any transient failure) silently erases the omitted metadata and lineage; the catalog loses curated state with no warning. (2) Combined with H-001 (anonymous default), an attacker erases a datasource's metadata + lineage by re-ingesting an empty payload. (3) The destruction is forensically silent (H-012). (4) The integration suite never exercises the subtraction surface, so a regression that "fixes" delete-on-absence to merge would land green in CI — there is no regression guard. Probe P-224 emitted to pin the contract with a reproduced artefact (the static verdict is unambiguous; the blast radius has never been measured — F-008 test_matrix 0/4 probed).
    severity: HIGH
    confidence: HIGH
    probe_id: P-224
    routes_to_finding: caveat-candidate

- id: H-014
  hypothesis: "When a collector restarts and two of its instances briefly run concurrently, each POST-ing the same datasource ODDRN to /ingestion/datasources, both registrations succeed (or one cleanly wins) without a 5xx."
  derivation: "Negative-space — concurrent collector restarts are routine in orchestrated deployments; an idempotent registration should tolerate the race."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The static read shows a race window but cannot determine the runtime outcome. DataSourceIngestionServiceImpl resolves existing rows via getDtosByOddrns (line 47) which does NOT use forUpdate (unlike the entity path's getIdByOddrnForUpdate). Two concurrent transactions can both partition the same ODDRN into their toCreate bucket; one wins the bulkCreate, the other races a bulkCreate that violates the partial unique index data_source_oddrn_unique (WHERE deleted_at IS NULL, V0_0_31:29) and the WHOLE batch rolls back with a 5xx to the losing collector. Whether READ COMMITTED isolation + the transaction timing actually produces this, or whether the window is too narrow to hit in practice, requires a measured concurrent run.
    evidence:
      - sidecar: odd-platform__java__service__service__DataSourceIngestionServiceImpl.md
        section: "coherence_check conflicts_surfaced[1] (concurrent re-registration race)"
        cite: "DataSourceIngestionServiceImpl.java:47,57,66 + V0_0_31:29"
        note: "getDtosByOddrns has no forUpdate; concurrent same-ODDRN registration can violate the partial unique index mid-transaction."
    operator_visible_failure: |
      If the race materialises: a collector restart in a rolling-deploy or HPA-scale event intermittently 5xx's on datasource registration, and because the whole batch rolls back, NONE of that collector's datasources register on the losing instance — the collector then fails to ingest until the next restart. The operator sees a flaky startup with a generic 5xx. Severity depends on the race width, which is why a probe is required rather than a static verdict.
    severity: MEDIUM
    confidence: LOW
    probe_id: P-240
    routes_to_finding: caveat-candidate

