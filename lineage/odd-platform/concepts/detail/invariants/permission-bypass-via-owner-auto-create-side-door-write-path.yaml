- P-09
- P-06
description: |-
  **NEW INVARIANT, batch 2026-05-12F** — codebase-wide structural permission-bypass
  pattern. The documented `OWNER_CREATE` permission is supposed to gate Owner directory
  growth via `POST /api/owners` (per batch E createOwner). But `DataEntityController.createOwnership`
  (`POST /api/dataentities/{id}/ownership`) accepts a free-text `owner_name` and calls
  `OwnerService.getOrCreate(name)` which silently INSERT-s a fresh `OwnerPojo` when
  the name is novel (`OwnerServiceImpl.java:39-42`). Any caller with `DATA_ENTITY_OWNERSHIP_CREATE`
  on any data entity can mint Owner directory entries WITHOUT holding `OWNER_CREATE`.
  SAME pattern on Title — `TitleService.getOrCreate(title_name)` (`TitleServiceImpl.java:19-22`)
  auto-creates Title rows; there is NO documented Title-create permission gate at
  all (Title is fully free text — no enum, no allowlist, no length cap on the `title_name`
  field, `components.yaml:450-451` declares only `type: string`). **The codebase has
  a 2-tier directory-growth story**: explicit-path-grow via `POST /api/owners` (gated
  by `OWNER_CREATE` per SECURITY_RULES) AND side-door-grow via `POST /api/dataentities/{id}/ownership`
  (gated only by `DATA_ENTITY_OWNERSHIP_CREATE`). The asymmetry is silent: no doc
  warns operators; no @Slf4j log call captures the side-effect; the `@ActivityLog(OWNERSHIP_CREATED)`
  audit event fires for the ownership-binding but NOT for the Owner/Title-directory
  growth. **STRENGTHENED batch 2026-05-19K** — OwnershipServiceImpl primary-source
  pinned at the SERVICE LAYER (lines 52-53) confirming `getOrCreate` semantics; the
  service-tier-zero-permission-checks (lines 35-37) is the structural enabler. NEW
  service-tier instances surfaced this batch (the codebase-wide audit findings the
  invariant predicted):
    - TermServiceImpl.upsertTags (line 257) — TAG_CREATE bypass via
      tagService.getOrCreateTagsByName (operator with TERM_TAGS_UPDATE can
      create tags without TAG_CREATE)
    - TermServiceImpl.createTerm + updateTerm (lines 103, 138) — NAMESPACE_CREATE
      bypass via namespaceService.getOrCreate (operator with TERM_CREATE /
      TERM_UPDATE can create namespaces without NAMESPACE_CREATE)
  **Codebase-wide analog risk**: any future endpoint with auto-create-on-missing
  semantics (`getOrCreate`, `findOrInsert`, `ensureExists`) inherits this side-door
  pattern unless it explicitly checks the create-side permission. Recommended remediation:
  extend `OwnerService.getOrCreate(...)` to take a `caller-must-hold(OWNER_CREATE)`
  constraint OR factor the auto-create into an explicit `createIfAbsent` method that
  checks the permission AND emits an audit signal. Same for `TitleService.getOrCreate`,
  `TagService.getOrCreateTagsByName`, `NamespaceService.getOrCreate`.

  ## STRENGTHENED batch 2026-05-25-ZF — OwnerController CLASS-LEVEL roll-up identifies the THIRD service-tier callsite

  Batch ZF's OwnerController class-level sidecar adds the controller-class
  view of the OWNER_CREATE gate AND surfaces a new finding: the
  `ownerService.getOrCreate` side-door has THREE confirmed service-tier
  callsites (the original batch K + batch F enumerated TWO):

    (1) `OwnershipServiceImpl.create` line 52 — Owner auto-create via
        Ownership binding (REFACTOR-199, batch F + batch K primary
        source; gated by DATA_ENTITY_OWNERSHIP_CREATE)
    (2) `TermOwnershipServiceImpl.create` line 35 — Owner auto-create via
        Term ownership binding (NEW batch ZF — third service-tier
        callsite; gated by what permission? Per OwnerController class-
        level sidecar, no SecurityRule covers /api/terms/{id}/ownership
        POST except inheriting TERM_UPDATE; the gate set is narrower
        than DATA_ENTITY_OWNERSHIP_CREATE)
    (3) `OwnerAssociationRequestServiceImpl.createOwnerAssociationRequest`
        line 57 — Owner auto-create via the self-service association
        flow (NEW batch ZF — fourth class-of-bypass: a USER REQUESTING
        ownership association with a novel owner_name effectively mints
        an Owner row, bypassing OWNER_CREATE entirely; no permission
        required for self-service association requests)

  The OwnerController class-level sidecar (batch ZF) explicitly surfaces
  this as a NEW finding distinct from the per-method observations
  because the asymmetry is only visible at the class-level when the
  reader sees the FULL OwnerService interface (6 methods — getOrCreate +
  list + create + update + delete + getOwnerDtoById) and the controller's
  consumption of FIVE of the six (NOT getOrCreate). The 6th method
  (`getOrCreate`) is the side-door surface; the controller does NOT
  expose it but THREE separate service-tier callers reach it.

  The class-level sidecar also clarifies the LIVE DOCS GAP: the live
  `/configuration-and-deployment/enable-security/authorization/owners`
  page (WebFetched 2026-05-25, status 200) documents the Owner concept
  but is SILENT on:
    - the three service-tier callsites that bypass OWNER_CREATE
    - the unauthenticated read of the Owner directory
      (getOwnerList has NO SecurityRule per the second-NEW class-level
      finding — surfaced as the
      `get-list-unauthenticated-read-of-entire-owner-directory` concept)
    - the soft-delete + partial-unique-index name-reuse story
