  - "system-mission.md:P-07 Active Platform Features > Notifications"
proposed_action: |-
  Testcontainers-Postgres integration test. (1) Configure notifications.enabled=true with a single in-memory NotificationSender stub. (2) INSERT a poison ALERT row with type_id NOT in the AlertTypeEnum range (forces IllegalArgumentException in translate). (3) Start NotificationSubscriber. (4) Assert: (a) the stub sender's send(...) is NOT invoked, (b) the setAppliedLSN is NOT advanced past the poison LSN within 30 seconds, (c) the same LSN appears in the subscriber's replay attempts at ≥10s cadence, (d) NO log advances past 'Error processing decoded message'. Pins the WAL-replay-loop contract; a future fix that introduces a poison-message bypass MUST update this test.
