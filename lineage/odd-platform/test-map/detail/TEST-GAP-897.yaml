behaviour: |-
  **HIGH (META — F-018 chain-authoring anchor) — the ENTIRE tag-management controller surface has ZERO direct controller-tier OR service-tier tests. Seven batch-X-TAGGING sidecars (4 `TagController` methods, `TermController.createTermTagsRelations`, `DatasetFieldController.updateDatasetFieldTags`, the `tag` openapi-tag) each report `covered_behaviours: []`. There is NO `TagControllerTest.java`, NO `TagServiceImplTest.java`, NO `TermControllerTest.java`, NO `DatasetFieldControllerTest.java`. The ONLY tag-related test in the repo is `TagRepositoryImplTest.java` — repository-tier only, 10 methods covering `bulkCreate` / `listByNames` / `createDataEntityRelations` / `deleteDataEntityRelations(Collection)` / `update` / `listMostPopular`. The controller perimeter — RBAC gating, HTTP status, request/response shape, the replace-all and side-channel semantics, the FTS-propagation chains — is entirely unverified end-to-end.** This META anchor records the AGGREGATE coverage hole; the individual behaviours are pinned by TEST-GAP-883 through TEST-GAP-896 (this batch) plus the existing TEST-GAP-762..766 (batch W).

  **The verified absence** (across the 7 sidecars + a direct Glob this batch):
  - `TagController` (4 methods): `Grep TagController` in `odd-platform-api/src/test` returns zero matches (per the createTag/getPopularTagList/updateTag/deleteTag sidecars).
  - `TagServiceImpl`: no `TagServiceImplTest.java` (verified by two Glob invocations per the sidecars; independently re-confirmed this batch).
  - `TermController`: `grep upsertTags / createTermTagsRelations / deleteRelationsWithTerm` in `odd-platform-api/src/test` returns no matches; no `Term*.java` test file exists (Glob-confirmed this batch).
  - `DatasetFieldController`: `grep updateDatasetFieldTags / DatasetFieldTagsUpdate / deleteDatasetFieldInternalRelations` returns zero matches; no `DatasetField*.java` test file exists (Glob-confirmed this batch).
  - The only tag test, `TagRepositoryImplTest.java` (285 lines, 10 methods), is repository-tier — verified by reading the file end-to-end.

  **Why a META anchor and not a duplicate of the 14 individual gaps**: this entry is the single backlog item the maintainer triages into the tests-pillar effort to STAND UP the `odd-platform-api/src/test/.../api/` Tag test package. The 14 individual TEST-GAP entries (883-896 + 762-766) are the behaviour-level test methods; this META anchor is the "create the test classes, wire the Testcontainers fixture, establish the RBAC test harness" parent task. It parallels TEST-GAP-814 (the F-009 notification-subsystem META anchor) in role.

  **Operator-visible consequence**: every drift this batch surfaced — the LSN-019 popularity drift, the term/dataset-field replace-all silent-clear, the unset-`origin` CRITICAL fragility, the `!external`-guard dataset-field gap, the four side-channel + perimeter auth holes, the audit asymmetries — is silent in CI. A refactor touching ANY of them compiles and passes every existing test. The tagging feature (F-018, P-01:F-006 Manual Object Tagging) is a fully-shipped operator capability with no controller-tier regression net.

  **Test gap shape**: stand up the Tag API test package — `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` Tag* classes — with a Testcontainers `@SpringBootTest` base and an RBAC-permission test fixture. The package houses the test classes proposed by TEST-GAP-883..896. This META gap is "done" when the package exists, the fixture works, and at least the HTTP-floor smoke tests (200 on each of the 4 `TagController` operations + the 2 side-channel endpoints) pass.
