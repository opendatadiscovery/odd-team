    description: "Operational concept covering the range-partitioning lifecycle of the `public.activity` table — partition WIDTH set by `odd.activity.partition-period` (default 30 days; each partition spans 2× the period for deliberate forward-overlap), CREATE driven by `ActivityTablePartitionManager` extending `AbstractPartitionManager`, orchestrated by `PostgreSQLPartitionCreationJob` at boot (under Postgres advisory lock id `partition.advisory-lock-id` default 90) AND nightly via Spring `@Scheduled(cron=\"0 1 0 * * *\")` (under ShedLock `partitionCreationJob` with lockAtLeastFor=10m / lockAtMostFor=10m). **No retention/DROP path** — the activity table grows monotonically; `PartitionService.dropPartition` + `getEmptyPastPartitions` exist on the service interface but are never invoked for this table. Sibling `MessageTablePartitionManager` (under `@ConditionalOnDataCollaboration`) uses the same pattern for the messages table. vocabulary_status: codebase-anchored, doc-side-partially-covered (the partition-period config key is documented at `/configuration-and-deployment/odd-platform#metric-storage-backend` adjacent — verified WebFetch 2026-05-10 — but the doc claim 'retention and partitioning are controlled by' is INCORRECT: setting controls WIDTH only)."
