name: Get Active Feature List (boot-snapshot exposure)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
  - P-09
description: |-
  NEW OPERATION, batch ZE — GET /api/features/active. Returns the
  FeatureList of currently-enabled Feature enum values (each from
  the 2-value enum: DATA_COLLABORATION, ALERT_NOTIFICATIONS).
  Fired by App.tsx:46-51's useEffect ONCE per app-mount; populates
  the appInfo slice; consumed by every WithFeature wrapper across
  the SPA.

  IMPLEMENTATION: FeatureController.java:17-20 delegates to
  FeatureResolverImpl.resolveActiveFeatures() (lines 33-36) which
  wraps the boot-time-resolved Set<Feature> in a fresh FeatureList
  payload. The set itself is captured at @Component instantiation
  (FeatureResolverImpl.java:14, 16-31) — runtime mutation of
  datacollaboration.enabled / notifications.enabled has NO effect
  on subsequent responses until process restart.

  DRIFT NAME vs BEHAVIOR — the endpoint summary 'Get active
  features' / 'getActiveFeatures' implies a runtime-current view;
  the implementation returns the boot snapshot. An operator who
  runs /actuator/refresh after toggling YAML would reasonably
  expect the new value to surface but it does not. Cross-link:
  invariant:feature-flag-boot-snapshot-immutable is the canonical
  write-up.

  AUTH POSTURE: no @PreAuthorize; not in WHITELIST_PATHS, not in
  LoginFormSecurityConfiguration.permittedPaths; falls through to
  `pathMatchers('/**').authenticated()`. Under LOGIN_FORM / OAUTH2
  / LDAP: 401/302 to anonymous; 200 to any authenticated user
  regardless of role. Under DISABLED: 200 to anonymous —
  PROVIDER-NULL-BLEED-LIMITED-RISK FACET of REFACTOR-185
  (operator-policy-configurable booleans, narrower information
  disclosure than IdentityController principal-grant or
  IntegrationController hostname-leak).

  No Cache-Control, no audit logging on access, no role
  differentiation, no per-user scoping. The response is uniform
  for every caller.
