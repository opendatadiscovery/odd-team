security_aggregate:
  overall: MEDIUM
  auth_modes_relevant: []
  ingestion_filter_relevance: N/A
  authorization_consistency:
    verdict: N/A
    detail: Partition-lifecycle code, not HTTP-surface. `@Component` bean wired unconditionally;
      runs in Spring scheduling context.
  owner_scoping:
    verdict: N/A
    detail: DDL-surface, not data-row-surface. No caller-user context inside `createPartitionsIfNotExists`.
  strengths:
  - 'Dual-mechanism concurrency safety: Postgres advisory lock id `90` at boot, ShedLock
    `partitionCreationJob` with 10m hold at nightly cron — defence-in-depth against
    multi-instance races on CREATE TABLE'
  - Spring `List<PartitionManager>` collection injection is the extensibility seam
    — adding a new table-partition manager only requires creating a new `@Component`
    extending AbstractPartitionManager
  - Default partition WIDTH (`:30`) is in the `@Value` annotation itself — operator
    who unsets the key still gets sensible behaviour
  weaknesses:
  - '**Partition creation requires CREATE TABLE privilege on `public` schema** — deployment
    doc does not surface this requirement. Operator running ODD against a managed
    Postgres with least-privileged DB role (INSERT/SELECT but no DDL) fails partition
    creation at boot, logs ERROR, silently degrades. Deployment-pre-req documentation
    gap with security-policy implications. Severity MEDIUM (ActivityTablePartitionManager@L11.md:security.known_security_gaps.[0])'
  - No audit log on partition CREATE / DROP operations — unlike data-mutation paths
    covered by `@ActivityLog`, schema-level DDL is silent. Debug-level log line only.
    Severity LOW (ActivityTablePartitionManager@L11.md:security.known_security_gaps.[1])
  - Boot-time advisory-lock path has NO `:default` for `partition.advisory-lock-id`
    — `@Value("${partition.advisory-lock-id}")` carries no fallback. Operator who
    removes the key from customised application.yml fails bean wiring at boot. Docs
    do NOT list this key. Severity LOW (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[5])
  cross_file_inconsistencies: []
  contributing_files:
  - ActivityTablePartitionManager@L11.md
  evidence:
  - ActivityTablePartitionManager@L11.md:security.known_security_gaps.[0,1]
  - ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[5]
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - Boot-time `@PostConstruct` blocks application startup until partition advisory
    lock is acquired AND all partition managers complete. Multi-instance deployment
    where a slow leader holds lock 90 makes follower instances unable to reach readiness
    probe until lock release — startup latency unbounded under contention
  - Nightly cron at `00:01` local-server-time, once per 24h per ShedLock-electable
    instance. 10m lock window prevents intra-instance re-fire and inter-instance double-fire
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single-shot per cycle. Each manager's createPartitionsIfNotExists issues
      a small fixed number of CREATE TABLE statements (typically 0-1 per cycle, since
      the previous cycle covered the next-period window). Synchronous JDBC, not reactive.
  scaling_shape:
    verdict: STATEFUL_LOCKED
    detail: Postgres advisory lock id 90 is a global serialisation point at boot.
      ShedLock `partitionCreationJob` is a global serialisation point at nightly cron.
      Adding a third partition manager would serialise behind activity + message managers.
      Advisory-lock-id values managed by convention, not central registry.
  strengths:
  - Postgres-advisory-lock and ShedLock both use Postgres as the coordination point
    — preserves Postgres-as-only-dependency posture
  - '@PostConstruct + @Scheduled dual-execution path covers boot AND nightly without
    external scheduler'
  - DDL `CREATE TABLE IF NOT EXISTS` is idempotent — re-running the same partition
    window is safe
  weaknesses:
  - '**Unbounded monotonic growth of `public.activity`** — no DROP, no retention,
    no cleanup (cross-references Activity Feed concept''s weakness). Severity HIGH
    at scale (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[0]).
    **Now 2-sidecar primary-source confirmed in batch 2026-05-12D**: HousekeepingTTLProperties
    has exactly three TTL fields (`resolved_alerts_days`, `search_facets_days`, `data_entity_delete_days`)
    and NO `activity*Days` field. The only activity-touching housekeeping bean is
    `ActivityEmptyPartitionsHousekeepingJob` which drops EMPTY past partitions only
    (`isPartitionEmpty` at PartitionServiceImpl.java:133-141) — partitions with even
    one row are retained indefinitely. Drift confirmed from two angles: partition-WIDTH
    side AND housekeeping-coverage side. Live docs page''s ''retention and partitioning''
    claim is unsupported by the code. (HousekeepingTTLProperties.md:bugs_limitations_corner_cases.[0]
    — drift CONFIRMED from second angle)'
  - '**Silent-fail on CREATE failure** — log ERROR + continue. Severity HIGH (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[2])'
  - '**No `@Min(1)` validation on `partition-period`** — `0` silently skips creation;
    negative values fail Postgres at CREATE time. Severity MEDIUM (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[1])'
  - '**No Micrometer / health-check observability** on partition lifecycle — operators
    have no metric to alert on ''partition creation has been failing silently for
    30 days''. Severity MEDIUM (ActivityTablePartitionManager@L11.md:performance.known_performance_gaps.[1])'
  - '**Boot-time partition init blocks application readiness** — no async / background
    variant. Severity LOW under normal operation (ActivityTablePartitionManager@L11.md:performance.known_performance_gaps.[0])'
  - '**Tables.ACTIVITY hardcoded to public schema** — `PartitionServiceImpl.DEFAULT_SCHEMA
    = "public"`. Multi-tenant or schema-isolated deployments not supported. Severity
    LOW (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[3])'
  - '**Partition naming parser-coupled** — split-on-underscore expects exactly 3 parts;
    manually-created partitions with other names crash the parser. Severity LOW (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[4])'
  cross_file_inconsistencies: []
  contributing_files:
