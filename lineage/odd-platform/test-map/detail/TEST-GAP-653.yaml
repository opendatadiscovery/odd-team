behaviour: |-
  **Plaintext-token-render unit gap.** `CollectorItemToken.tsx:34` renders `<Token $isHidden={isHidden}>{collector.token.value}</Token>` — when `isHidden === false`, the token value is the FULL 40-char plaintext alphanumeric, written DIRECTLY as a text-node child. No `<input type='password'>`-style obfuscation, no Reveal-on-hover affordance, no auto-hide-after-N-seconds timer. Browser extensions, screenshot tools, accessibility screen readers, and any DOM-inspection tool capture the credential by default. The warning admonition at CollectorItem.tsx:87-98 ("Save token in a secure location. You will not be able to retrieve it again.") is the sole mitigation. The one-shot visibility (per the sidecar's invariants[1]: "a freshly created or regenerated collector arrives with token.value as the full 40-char plaintext; once the page reloads, the API returns ******{last6} and the UI flips into isHidden === true mode") means the operator MUST copy on first display. No test asserts (a) a Collector with a 40-char alphanumeric token flips `isHidden` to `false` (the substring-prefix sniff says `value.substring(0, 6) !== '******'`); (b) the rendered DOM contains the FULL 40-char value as a text-node child; (c) the warning admonition is rendered alongside; (d) the Copy button is present and functional. A regression that broke the visibility detection would silently offer Copy on masked values OR hide tokens that should be visible.
