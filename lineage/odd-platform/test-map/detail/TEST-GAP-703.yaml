proposed_action: |-
  Add `PolicyServiceImplAntiElevationGuardAbsenceTest.createPolicy_managementAllStatement_byPolicyCreateOnlyUser_succeeds_pinsNoAntiElevationGuard` as a Testcontainers integration test. (a) Seed user U with role R that has ONLY `POLICY_CREATE` permission (NOT MANAGEMENT/ALL). (b) Authenticate as U. (c) POST /api/policies with body containing a MANAGEMENT/ALL statement (identical shape to the seeded Administrator policy). (d) Assert HTTP 200 + the policy is created. (e) Demonstrate the elevation chain: POST /api/roles with the new policy bound (requires ROLE_CREATE; if U doesn't have it, simulate by directly INSERTing the role_to_policy row). (f) Add a `// REGRESSION-PIN — POLICY_CREATE is functionally root: no anti-elevation guard at PolicyServiceImpl.create (lines 62-69). The current behaviour is INTENTIONAL per the design (an administrator can author administrator policies) but UNSTATED — operators auditing the trust model assume policy authoring is constrained to "permissions you hold". This test surfaces the truth: it is NOT. A REFACTOR adding an anti-elevation guard will close the elevation chain; the test will flip; the change will be deliberate.` comment block. Pair with documentation update: surface the contract at /authorization/policies as "POLICY_CREATE is functionally root; restrict the assignment of POLICY_CREATE accordingly".
