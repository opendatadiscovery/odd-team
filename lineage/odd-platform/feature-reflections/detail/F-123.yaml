- id: H-009
  hypothesis: "When a DataEntity is deleted, it progresses cleanly through its lifecycle to final removal within the configured TTL window — the operator-set 30-day data-entity-delete retention is honoured."
  derivation: "DataEntity has a documented 4-state machine (LIVE → status=DELETED → deleted_at → purge) driven by scheduled jobs; the operator expects deterministic progression to purge."
  seed_source: pillar
  validation:
    verdict: probe-needed
    actual_behavior: |
      The state machine is driven by TWO `@Scheduled` jobs on separate cadences —
      `DataEntityStatusSwitchJob` (10min) flips switchable statuses to DELETED, and
      `HousekeepingJobManager` (15min, holding a 14-minute ShedLock, running
      `DataEntityHousekeepingJob`'s ~25-table cascade) purges past the
      `data_entity_delete_days` TTL. Per F-121 / SHB-176 these jobs contend on a
      single-thread executor; the ShedLock's `lockAtMostFor=14m` against `fixedRate=15min`
      leaves only 60s of slack, so a cascade running >=14min can release the lock early
      and let a second instance start while the first is still committing
      (`HousekeepingJobManager.md` invariants). Whether the state machine actually STALLS
      under sustained backlog — and whether the TTL window is honoured at scale — requires
      running the system with a large soft-deleted backlog and observing progression.
      SEPARATELY, the `updateStatus` ordering bug (DataEntityMapperImpl.applyStatus
      L242-253 sets status BEFORE the if-check → statusUpdatedAt never bumped) is
      independently documented as breaking the 30-day TTL (concepts.yaml DataEntity
      aggregate); that is a confirmed code defect, but its end-to-end effect on purge
      timing is the probe target.
    evidence:
      - sidecar: "HousekeepingJobManager.md"
        section: "understanding + invariants (ShedLock window) + the F-121 cross-link"
        cite: "HousekeepingJobManager.java:25-26 (@Scheduled 15min, lockAtMostFor=14m) + DataEntityStatusSwitchJob.java:21 (@Scheduled 10min)"
        note: "Two-cadence state machine; single-thread contention per F-121."
    operator_visible_failure: |
      (1) If the machine stalls, soft-deleted DataEntities accumulate past their TTL and
      are never purged — storage growth + soft-deleted entities lingering in housekeeping
      limbo. (2) The statusUpdatedAt ordering bug means the 30-day delete TTL is measured
      from a never-updated timestamp, so entities may be purged on the wrong schedule
      (too early or never). (3) Operator-invisible: there is no metric / structured audit
      on job failure (failures log at ERROR and continue), so a stalled machine is silent.
    severity: HIGH
    confidence: MEDIUM
    probe_id: PENDING-F-123-1
    routes_to_finding: probe-needed
    use_case_kind: teardown
    coverage: unverified
    test_demand: "probe PENDING-F-123-1"
- id: H-010
  hypothesis: "When an operator deletes a dataset field (column metadata) it is removed; and a deleted column's historical metadata is not silently lost."
  derivation: "dataset_field is per-column metadata an operator edits (internal name/description); delete-means-gone + history expectation."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      `dataset_field` has NO soft-delete column at all (no `deleted_at`/`is_deleted`/
      `status` — `ReactiveDatasetFieldRepositoryImpl` invariant 1; confirmed against
      V0_0_1:148-164 + all ALTERs). `delete(id)` is a HARD DELETE. PARTIAL because in
      normal operation the platform does NOT hard-delete dataset_field on column removal —
      instead the version-fork model creates a NEW row on structure change and LEAVES the
      old row pointed-at by the old dataset_version (invariant 2), and operator-curated
      internal name/description are CARRIED FORWARD to the new row
      (`getDatasetFieldUpdatedCopy` restores them). So column *history* is preserved by
      versioning, not by soft-delete — but any actual hard `delete(id)` (no production
      caller does this today, but the method exists) is irreversible with no audit. There
      is also no orphan-cleanup for old dataset_field rows, so they accumulate.
    evidence:
      - sidecar: "ReactiveDatasetFieldRepositoryImpl.md"
        section: "understanding + invariants[1][2][3][4]"
        cite: "V0_0_1__init.sql:148-164 (no soft-delete column) + DatasetFieldServiceImpl.java:385-394 (hash-diff version fork) + 308-322 (internal-name/desc carried forward)"
        note: "No soft-delete; history via version-fork; hard-delete path exists but unused; old rows accumulate."
    operator_visible_failure: |
      (1) The version-fork model means old dataset_field rows are never cleaned up —
      unbounded accumulation of historical column rows (no janitor), a slow storage leak.
      (2) If any future caller invokes the inherited hard `delete`, the column metadata
      (including operator-curated internal name/description) is gone with no audit trail —
      unlike the data_entity / datasource soft-delete posture. (3) The cross-link SHB-182
      / F-125 token-housekeeping gap shares this 'no soft-delete column at all' shape.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional
