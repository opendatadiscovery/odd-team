mitigations_unimplemented:
  - |-
    Validate publication-name at boot via @ConfigurationProperties
    validator with a strict identifier regex (e.g. ^[a-z_][a-z0-9_]*$);
    fail fast on a pathological value.
  - |-
    Quote the publication name with double-quotes AND escape embedded
    double-quotes by doubling them in the registerPublication DDL
    construction at L151.
  - |-
    Add a build-time invariant scanner that flags String.formatted /
    String.format calls whose first argument contains the literal "CREATE
    " or "DROP " or "ALTER " (rough heuristic for DDL construction
    sites) — current count of such sites in odd-platform is small enough
    to enumerate.
  - |-
    Document the publication-name as a privileged identifier on the live
    /configuration-and-deployment/odd-platform page — operators choosing
    custom names should be told to use lowercase alphanumerics + underscore
    only.
notes: |-
  NEW MEDIUM-severity invariant captured in batch 2026-05-20Y from the
  NotificationSubscriber sidecar's primary-source examination of the
  registerPublication helper. The probe-vs-create asymmetry is the most
  load-bearing finding (a maintainer reading just the parameterised probe
  could reasonably assume the create is also safe — it is not).

  Cross-cutting connections:
    - Pairs with the sibling Lookup Tables DDL-identifier-injection
      invariant (batch P) — both surface the same class of vulnerability
      at different feature surfaces; the broader case-law is "operator-
      controlled DDL identifiers must be either allowlist-validated or
      double-quote-escaped"
    - Companion to the WAL-retention disk-exhaustion invariant (batch Y) —
      both findings are PRIMARY-SOURCE pinned at the
      NotificationSubscriber file; the file's role as the F-009 hop-1
      anchor surfaces both findings simultaneously

  One DOC-NNN candidate flows from this invariant:
    (a) Document the publication-name (and slot-name) as privileged
        identifiers on the live configuration page — operators choosing
        custom names benefit from the allowlist guidance
