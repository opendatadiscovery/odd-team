name: data_source.name partial-unique silent rollback on collector-driven rename
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-10
- P-08
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20R** — surfaced by the
  ReactiveDataSourceRepositoryImpl batch-R sidecar's coherence sweep
  (conflicts_surfaced.[1]). The `data_source.name` column carries a
  PARTIAL UNIQUE INDEX `data_source_name_unique ON data_source(name)
  WHERE deleted_at IS NULL` per `V0_0_31__add_deleted_at_field.sql:27`.
  The constraint history: V0_0_18__pull_push_data_sources.sql:1-3
  DROPPED the original `data_source_name_key` UNIQUE constraint;
  V0_0_31__add_deleted_at_field.sql:27 RE-CREATED uniqueness as a
  partial index scoped to live rows only. Soft-deleted datasources
  with the same name DO NOT count against uniqueness.

  **The silent-rollback path**: a collector POSTing
  `/ingestion/datasources` with a `DataSourceList` payload triggers
  `DataSourceIngestionServiceImpl.createDataSources` (lines 35-72).
  Per the UPSERT-by-ODDRN partial-merge invariant, an existing row
  matched by ODDRN has its `name` overwritten from the payload
  (`prepareForUpdate` at line 74-92 sets `.setName(payload.getName()))`.
  If the operator (or an unaware collector deployment) sends a payload
  that renames an existing datasource to a `name` already held by ANOTHER
  LIVE row, the bulk `UPDATE … SET name = ?, …` issued by inherited
  `bulkUpdate` (ReactiveAbstractCRUDRepository.java:128-142 →
  updateMany at 203-223) hits the `data_source_name_unique` partial
  index → `SQLSTATE 23505` → `UniqueConstraintException`.

  **The transaction rolls back ALL of it**: `bulkUpdate` is
  `@ReactiveTransactional` (parent line 129). The paired `bulkCreate`
  for any genuinely-new ODDRNs in the same payload is ALSO rolled back
  (Datasource ingestion runs as ONE transaction per ingestion call).
  An operator who sent a 50-datasource payload — 49 unchanged + 1
  renaming to a colliding name — sees the ENTIRE batch fail with a
  500 Internal Server Error. The 49 unchanged datasources DO get
  re-touched (their `updated_at` advances) but the rolled-back
  transaction means even those touches are undone.

  **The operator-facing message is misleading**: the surface error is
  `UniqueConstraintException` translated by `ExceptionUtils`, but the
  collector-side log line typically shows "ingestion failed: HTTP
  500" with no clear indication that "name collision with another
  datasource" was the root cause. The collector's automation pipeline
  retries with the SAME payload → same failure → same 500. No
  remediation path short of the operator manually identifying the
  name conflict and adjusting the collector configuration.

  **The UI path is differently broken**: `POST /api/datasources` via
  `DataSourceController.createDataSource` → `DataSourceServiceImpl.create`
  → inherited `create(pojo)` from ReactiveAbstractCRUDRepository.java:103-106.
  This path issues a single `INSERT INTO data_source` with NO
  `onDuplicateKey` clause. A name collision against a live row raises
  `SQLSTATE 23505` → `UniqueConstraintException` mapped via
  `ExceptionUtils.translateDatabaseException`. The UI-side error is
  visible to the operator immediately ("datasource with this name
  already exists"), but the cause is the SAME partial unique index.
  The UI and collector paths share the index; only their error-surface
  ergonomics differ.

  **The collector-side ergonomics gap is the operational hazard**:
  the SQL constraint protects the platform's integrity (prevents
  duplicate-name datasources), but the collector-driven path surfaces
  it as an opaque 500. The remediation path (deduplicate the name)
  is operator-only — collectors cannot reliably detect another
  datasource holding the desired name without a pre-write GET pass
  (which races with concurrent collector activity).

  **Cross-collector preservation is also affected**: the partial-merge
  invariant preserves `collector_id` on UPSERT (the copy-construct in
  `prepareForUpdate` retains the existing collector_id). So a name
  collision between datasources owned by DIFFERENT collectors fails
  the same way. Collector A's payload trying to rename its
  ODDRN-matched row to a name held by collector B's datasource → 500.
