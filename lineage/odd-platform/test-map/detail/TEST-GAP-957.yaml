behaviour: |-
  **Cross-cutting pagination boundary gap — four endpoints across batch
  ZE all share the same unbounded-input class.** Each is a separate
  test target but the class is one:

  (1) GET /api/relationships (page, size) — `(page-1)*size` arithmetic
  at ReactiveDataEntityRelationshipRepositoryImpl.java:79; page=0 →
  negative OFFSET → Postgres rejects (500 likely; P-130 pins). size
  unbounded.
  (2) GET /api/search/{id}/results (page, size) AND GET
  /api/search/{id}/facet/{type} (page, size) — same unbounded-size
  class (REPEAT of TEST-GAP-503 / TEST-GAP-864 family across the
  catalog).
  (3) GET /api/titles (page, size) — size unbounded, page=0 → negative
  offset (TitleController.java:18-22; P-129 pins).
  (4) GET /api/links — no pagination at all; mid-sized link list
  (50+) returned without truncation. Not strictly a boundary test but
  belongs to the same architectural gap class.

  The cross-cutting pattern: NO endpoint in batch ZE has a server-side
  max-size cap, an @Min(1) on page, or an @Max on size. The OpenAPI
  PageParam / SizeParam carry no min/max constraints either. A future
  fix at the framework level (e.g. WebFlux argument-resolver max-size
  default) would silently cap every list endpoint; pinning the current
  unbounded behaviour at four sites would catch regressions to either
  the framework default OR the per-endpoint override pattern.

  This gap is filed at MEDIUM criticality (rather than enumerating
  four separate gaps) because the pattern is architectural — one cross-
  cutting test class with one case per endpoint covers the class. The
  alternative (one TEST-GAP per endpoint) would inflate the catalog
  without surfacing the systemic angle.
