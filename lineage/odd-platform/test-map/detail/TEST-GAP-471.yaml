behaviour: |-
  LOGIN_FORM ↔ LDAP cross-mode bleed via provider=null. A LOGIN_FORM user `alice` and an LDAP user `alice` both produce `UserDto("alice", null)` at AuthIdentityProviderImpl.java:32 (the else branch of the OAuth2AuthenticationToken instanceof check at lines 29-33 hard-codes null). The downstream lookup at ReactiveUserOwnerMappingRepositoryImpl.java:116-127 builds `WHERE OIDC_USERNAME = 'alice' AND DELETED_AT IS NULL AND PROVIDER IS NULL`. If both auth modes are configured to point at users whose usernames overlap (operator naming convention or migration scenario), the second-mode user silently inherits the first-mode user's Owner-link. The codepath has NO mode-check, NO warning log, NO fail-fast. The migration step (LOGIN_FORM → LDAP, or vice versa) is silent. Cross-pillar bump P-09 because every owner-scoped read path that calls fetchAssociatedOwner inherits this — 15 callsites including SearchServiceImpl, AlertServiceImpl, DataEntityServiceImpl, DataEntityRelationsServiceImpl, ActivityServiceImpl, DataCollaborationServiceImpl, three Permission extractors.
test_class: missing-security
test_files_existing: []
test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/AuthIdentityProviderProviderNullCrossModeBleedTest.java"
  name: "loginFormAlice_ldapAlice_resolveToSameOwnerViaProviderNullLookup"
evidence:
  - |-
    AuthIdentityProviderImpl.md says: 'A LOGIN_FORM user alice and an LDAP user alice both produce UserDto("alice", null). The downstream lookup builds WHERE OIDC_USERNAME = "alice" AND PROVIDER IS NULL. If both auth modes are configured to point at users that overlap (operator naming convention or a migration scenario), the second-mode user inherits the first-mode user's Owner-link.'
  - "AuthIdentityProviderImpl.java:29-33 (instanceof check + else branch produces null)"
  - "ReactiveUserOwnerMappingRepositoryImpl.java:116-127 (the SQL WHERE clause that bleeds)"
  - "LoginFormSecurityConfiguration.java:30-34 + LDAPSecurityConfiguration.java:50-57 (both produce UsernamePasswordAuthenticationToken — both branch to the null else)"
  - "Grep `AuthIdentityProvider` under odd-platform-api/src/test returns 0 matches"
cross_references:
  - "concepts.yaml:entities[Auth Mode (LOGIN_FORM branch)].security_aggregate.weaknesses"
  - "concepts.yaml:entities[Auth Mode (LDAP branch)].security_aggregate.weaknesses"
  - "TEST-GAP-472 (related: S2S ADMIN collision — same provider=null bucket)"
  - "DOC-NNN candidate: (username, provider) compound key is silent in docs"
proposed_action: |-
  Testcontainers-Postgres integration test. (1) Configure both LoginFormSecurityConfiguration AND LDAPSecurityConfiguration simultaneously (a transitional migration scenario). (2) Seed two `owner` rows: owner-a + owner-b. (3) INSERT one `user_owner_mapping` row: (oidc_username='alice', provider=null, owner_id=owner-a.id, deleted_at=null). (4) Issue an authenticated request impersonating an LDAP-mode `alice` user. (5) Assert fetchAssociatedOwner() returns owner-a. (6) Repeat with a LOGIN_FORM-mode `alice` — assert ALSO returns owner-a. The test EXPOSES the bleed; the fix requires schema migration (add provider='LOGIN_FORM' / 'LDAP' columns) + AuthIdentityProviderImpl distinguishing the two modes. The test then asserts they resolve to DIFFERENT owners.
