control_summary: |-
  0 of 4 cells PROBED — feature minted at ui-review-2026-05-26 to anchor the
  Overview-tab composition that 11 child sub-panel features (F-001 / F-004 /
  F-013 / F-018 / F-002 / F-027 / plus the new F-178 entry-name surface)
  all converge on. Status: ui-incomplete per Rule 0b — drift facets that
  describe RUNTIME outcomes (skeleton-while-panel-async, class-silent-absence,
  responsive-layout-on-mobile, DQ-zero-vs-loading) carry ui_unverified: true.

  The highest-leverage probe candidate is a Playwright-style scripted page-
  open against a docker-compose stack with seeded entities of EACH class
  (SET / TRANSFORMER / CONSUMER / QUALITY_TEST / INPUT / RELATIONSHIP /
  ENTITY_GROUP) — assert the per-class panel set matches the OverviewStats
  switch + the Overview.tsx conditional gates. This single probe pins the
  "what renders for which class" composition matrix in observable form.

  This F-NNN is the SHARED ANCHOR for: gap #4 (maintainer-reported — the
  per-entity Overview tab was previously feature-invisible). Closing the
  gap means the surface is now substrate-traceable from Overview.tsx →
  the 12 sub-panel components → existing F-NNN.
