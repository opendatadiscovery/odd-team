name: Spring Container
canonical_in_docs: false
canonical_candidate: true
description: The Spring Boot application context performing bean-definition evaluation
  at startup. Surfaces in the per-mode `*SecurityConfiguration` sidecars (audiences
  for the `@ConditionalOnProperty` evaluations) and in AuthorizationManagerCondition@L11
  (the dead Condition class whose audience is the container only). main-concepts.md
  does not name this — it is an internal framework audience surfaced because the auth-mode
  wiring layer has design-time-only consumers.
axes_present:
- config_prefixes
nodes:
- odd-platform java AuthorizationManagerCondition config-key-consumer:auth.type@L11
- odd-platform java DisabledAuthSecurityConfiguration config-key-consumer:auth.type@L10
- odd-platform java LoginFormSecurityConfiguration config-key-consumer:auth.type@L31
- odd-platform java OAuthSecurityConfiguration config-key-consumer:auth.type@L71
- odd-platform java LDAPSecurityConfiguration config-key-consumer:auth.type@L51
contributors:
- 'AuthorizationManagerCondition@L11.audiences: Spring container during bean-definition
  phase — design-time intent was for the authorization-manager wiring path, but no
  consumer is actually wired'
- 'DisabledAuthSecurityConfiguration@L10.audiences: Spring container at bean-registration
  time (evaluates `@ConditionalOnProperty(auth.type=DISABLED)`)'
- 'LoginFormSecurityConfiguration@L31.audiences: Spring container at context-refresh
  time (resolves the Condition for `auth.type=LOGIN_FORM`)'
- 'OAuthSecurityConfiguration@L71.audiences: Spring container during bean-definition
  phase (`@ConditionalOnProperty` consumer for `auth.type=OAUTH2`)'
- 'LDAPSecurityConfiguration@L51.audiences: Spring Boot''s autoconfiguration (consumes
  `@ConditionalOnProperty` to decide whether the LDAP chain is the active one)'
evidence:
- AuthorizationManagerCondition@L11.md:concepts.audiences
- DisabledAuthSecurityConfiguration@L10.md:concepts.audiences
- LoginFormSecurityConfiguration@L31.md:concepts.audiences
- OAuthSecurityConfiguration@L71.md:concepts.audiences
- LDAPSecurityConfiguration@L51.md:concepts.audiences
notes: 'Surface as canonicalisation candidate ONLY for completeness — this

  is an internal framework audience that becomes visible because the

  sidecar''s design-intent is for the Spring container, not for a

  human consumer. The catalog records it so that future architectural

  reviews of bean-wiring patterns have a discoverable anchor.

  '
