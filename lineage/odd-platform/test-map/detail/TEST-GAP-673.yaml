behaviour: |-
  **TOCTOU race window in UI-tier custom-metadata auto-create.** `MetadataFieldServiceImpl.getOrCreateMetadataFields` (line 42-59) calls `listByKey` (READ) then `bulkCreate` (WRITE). Two concurrent calls from two parallel `createMetadata` requests with the same novel `(name, type, INTERNAL)` key will both see "doesn't exist" and both attempt INSERT; the second hits `IX_UNIQUE_INTERNAL_NAME` and raises `UniqueConstraintException("Internal metadata with this name already exists")`. Same race-shape as the Tag TOCTOU (`tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race` concept — TEST-GAP-NNN family at the Tag tier). Resolution is exception-driven; the calling `DataEntityServiceImpl.createMetadata` does NOT catch and retry — the user sees a 500 (or 422 if the GlobalExceptionHandler maps it). The race window is small (sub-millisecond between SELECT and INSERT in the same TX) but reliably reproducible under bench load. The ingestion path (`MetadataFieldServiceImpl.ingestMetadataFields` → `ingestData`) is race-TOLERANT via the partial-unique-index `ON CONFLICT DO UPDATE`; the UI path is race-EXCEPTION. Inconsistent UX behaviour by code path.
