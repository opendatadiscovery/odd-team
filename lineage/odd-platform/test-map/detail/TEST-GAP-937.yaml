proposed_action: |-
  Extend the existing TEST-GAP-216 proposed OpenAPIStatusCodeConformanceTest
  to be parameterised over EVERY (operationId, controller-method,
  expected-spec-code, actual-impl-code) tuple in the codebase. Seed
  population: createRole/updateRole/createPolicy/updatePolicy/createOwner/
  updateOwner/createTag/updateTag (8 endpoints). Drives reconciliation: the
  test is RED today; maintainer must either flip the controller to
  ResponseEntity.status(201).body(...) OR amend the spec to 200. Either
  choice is deliberate — the test prevents silent drift on future endpoints.
  STRENGTHENS multiple existing TEST-GAPs into one cross-controller harness.
