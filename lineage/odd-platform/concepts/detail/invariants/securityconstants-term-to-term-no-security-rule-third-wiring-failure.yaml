mitigations_unimplemented:
  - |-
    Add two SecurityRule entries to SecurityConstants.java covering the
    POST and DELETE on /api/terms/term_id/term/optional-linked_term_id paths.
    Likely intended permission is TERM_UPDATE on the source term_id (per
    Business Glossary docs WebFetched 2026-05-20 stating TERM_UPDATE
    gates 'directly-linked terms').
  - |-
    Build-time scanner that cross-checks SECURITY_RULES against OpenAPI
    operation paths. Three different shapes of failure have surfaced
    in one file across batches K and U — a single scanner closes the
    failure class. Required checks:
      - Every operation declared in openapi.yaml under tags=term + path=/api/terms/**
        has a matching SecurityRule entry (catches THIS bug).
      - Every SecurityRule path string parses against an OpenAPI operation
        path including singular-vs-plural exactness (catches REFACTOR-217).
      - Every SecurityRule permission name has a prefix matching the
        first URL segment after /api/ (catches the alerts-status mis-gate).
  - |-
    Add a service-tier @PreAuthorize on TermServiceImpl.linkTermWithTerm
    and removeTermToLinkedTermRelation as defence-in-depth. Per the
    term-service-tier-zero-permission-checks invariant, the entire
    TermServiceImpl carries no service-tier authorization — fixing this
    invariant alone would close this gap regardless of SecurityConstants
    correctness.
  - |-
    Regression test pinning the current behaviour:
    (a) Authenticate as a user with NO TERM_* permission;
    (b) Call POST /api/terms/100/term with body containing linkedTermId=200;
    (c) Assert 403 (under the fix) OR 200 (under the current bug — pins
        the buggy state as the regression baseline so a future fix is
        evidence-based).
  - |-
    Add @ActivityLog(TERM_LINK_ASSIGNMENT_UPDATED) to TermServiceImpl.linkTermWithTerm
    and removeTermToLinkedTermRelation — the missing audit trail compounds
    the missing authorization gate. Note this requires extending
    ActivityEventTypeDto with a new value AND extending the schema beyond
    the F-006 data-entity-rooted constraint (per the
    f-006-audit-silence-enum-rooted-deeper-than-schema-rooted invariant
    from this same batch U).
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20U from the
  TermController class-level sidecar. The two unguarded term-to-term
  endpoints were not visible at the prior controller-method granularity
  because no controller-method sidecar covered addLinkedTermToTerm or
  deleteLinkedTermFromTerm individually — the class-level read in batch
  U surfaces them.

  Cross-cutting connections:
    - Companion of REFACTOR-217 and the alerts-status mis-gate — three
      failures of the same architectural family
    - Pairs with term-service-tier-zero-permission-checks (batch K) —
      the service-tier absence amplifies every controller-perimeter
      failure
    - Pairs with f-006-audit-silence-enum-rooted (batch U) — the
      audit trail on these endpoints is structurally absent because
      ActivityEventTypeDto has no TERM_LINK_ASSIGNMENT_UPDATED value;
      even fixing the SecurityRule does NOT add forensic coverage
    - Pairs with the read-collaborative posture invariant (batch L
      28-sidecar) — even after this fix, reading term-to-term links
      remains uniformly unscoped

  Four DOC-NNN candidates flow from this invariant:
    (a) Code fix — add the two SecurityRule entries
    (b) Build-time scanner — cross-check SECURITY_RULES vs OpenAPI
    (c) Docs admission — until the fix lands, document that the
        Business Glossary's TERM_UPDATE does NOT gate term-to-term
        linkage at runtime
    (d) Regression test pinning the current vs intended state
