- id: H-011
  hypothesis: "When a producer POSTs an empty or malformed body (`items: []` or `{}`), the platform responds with a clean client error (4xx), not a 500."
  derivation: "Endpoint shape — the sibling `postDataEntityList` short-circuits empty payloads with `CollectionUtils.isNotEmpty`; a product owner expects symmetric graceful handling."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      Partial by input shape: `items: []` commits a harmless no-op transaction and
      returns 201 (not a 4xx, but not a crash). `items: null` (a bare `{}` body)
      flows into `datasetStatisticsList.getItems().stream()` which NPEs at
      DatasetFieldServiceImpl.java:161/168 -> reactive default error handler -> HTTP
      500. There is NO empty-payload guard at the controller, unlike the sibling
      `postDataEntityList` (IngestionController.java:40-42).
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: concepts.invariants[1]
        cite: "DatasetFieldServiceImpl.java:161,168 (null-unsafe stream) + IngestionController.java:40-42 (sibling guard this method lacks)"
        note: "null body NPEs to 500; empty list is a 201 no-op"
    operator_visible_failure: |
      A malformed `{}` body returns an opaque 500 (server error) rather than a 4xx
      (your-request-was-bad), misdirecting a producer's debugging toward a platform
      fault. The `items: []` no-op silently returns 201 with no indication nothing
      happened. Both are minor, but the asymmetry with the sibling endpoint is
      undocumented.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-012
  hypothesis: "When a producer names a heavy dataset as the parent `datasetOddrn` but pushes trivial or no resolvable field stats, the platform does NOT perform expensive work proportional to the named parent."
  derivation: "Negative-space / cross-pillar (FTS recompute cost) — a product owner expects work to be proportional to the data actually written, not to an arbitrary parent claim; an uncoupled cost is a DoS amplifier."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      FTS structure-vector recompute runs on EVERY ingest for every dataset ODDRN in
      the payload, computed from `DataSetStatistics.datasetOddrn`, NOT from the
      actually-resolved field rows (line 179, fed by 168-170). A payload with bogus
      (unresolvable) field ODDRNs but a real, heavy `datasetOddrn` still triggers
      `updateStructureVectorForDataEntitiesByOddrns` on that dataset. Combined with
      the unauthenticated posture (H-003), repeated invocations naming a heavy
      dataset drive Postgres CPU on its FTS recompute while writing nothing.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: performance.known_performance_gaps[1]
        cite: "DatasetFieldServiceImpl.java:158-181,179 (no early-exit before FTS recalc; FTS keyed on payload datasetOddrn)"
        note: "FTS recompute fires on the lying parent even with zero writes"
    operator_visible_failure: |
      A cheap unauthenticated DoS amplifier: an attacker names the catalog's largest
      dataset(s) as parents and posts empty/bogus stats in a loop, forcing repeated
      FTS-vector recomputes and Postgres CPU load with near-zero attacker cost and no
      audit trail. Honest producers are unaffected unless they over-broadly batch.
      The exact per-request FTS cost on a large dataset wants a runtime probe to
      quantify, but the mechanism (recompute on lying parent) is statically certain.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

