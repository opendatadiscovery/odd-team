observed_vs_expected:
  facets:
    - drift_class: unbind_payload_carries_only_ownerid_no_username_or_provider_disambiguation_concern
      description: |-
        The handleDelete callback fires `deleteAssociation({ownerId})`
        with ONLY the ownerId — no username, no provider. The
        ActiveAssociationRequest row has all three (username, ownerId,
        provider) in its props, so the omission is intentional. The
        question: if user "alice@local" and user "alice@oauth2" are BOTH
        bound to owner X (different provider rows), does
        DELETE /api/user_owner_mapping/{ownerId} drop ONE row or ALL
        rows? The UI assumes the backend disambiguates — high probability
        the backend uses ownerId + the AUTHENTICATED user's identity to
        scope the delete, but if the operator is an ADMIN acting on
        behalf of another user, the disambiguation is implicit and could
        accidentally unbind the wrong row.
      evidence:
        - "ActiveAssociationRequest.tsx:34-39 — handleDelete passes only {ownerId}"
        - "ActiveAssociationRequest.tsx:10-18 — row props include username + provider, intentionally not passed downstream"
      ui_unverified: true
      ui_unverified_reason: |-
        Backend resolution semantics of DELETE /api/user_owner_mapping/{ownerId}
        not Read. Highest-leverage probe candidate: bootstrap two users
        bound to the same Owner, have an admin click Remove on one, observe
        which row(s) disappear.
    - drift_class: positive_finding_confirm_dialog_present_for_destructive_unbind
      description: |-
        Positive finding: the Remove affordance lives behind a
        ConfirmationDialog (ActiveAssociationRequest.tsx:77-94) BEFORE
        firing the destructive mutation. Symmetric with F-171's
        Accept/Reject confirmations. Contrast with F-019 batch-Q empty-
        roles-update destructive UPDATE which had NO confirmation; the
        OwnerAssociations subtree maintains a CONSISTENT confirm-on-
        destructive posture that the Owners CRUD subtree breaks.
      evidence:
        - "ActiveAssociationRequest.tsx:77-94 (ConfirmationDialog wrapping the Remove button)"
      ui_unverified: false
    - drift_class: confirm_dialog_silent_on_consequence_no_explanation_what_my_views_will_show
      description: |-
        The ConfirmationDialog text is "User X will stop being associated
        with owner Y" — TRUE but minimal. It does not state what
        EFFECTS the unbind has on the user's experience: their "My
        objects" Activity view goes silent-empty (F-064), their Alerts
        "My" view goes silent-empty (F-064), they lose the
        ownership-scoped permissions they had through that Owner's
        Role bundles (F-006, F-011). The operator-facing description
        is local-correct but globally under-explained.
      evidence:
        - "ActiveAssociationRequest.tsx:80-84 (dialog actionText)"
        - "Cross-link F-064 silent-empty pattern + F-011 Principal-to-Owner Resolution consumers"
      ui_unverified: false
    - drift_class: bulk_remove_not_available_one_at_a_time_only
      description: |-
        The Active tab presents a paginated list with per-row Remove
        buttons. There is no multi-select checkbox, no "Remove all
        bound to Owner X" affordance, no bulk-action toolbar. An admin
        decommissioning a team member's access across many Owner rows
        clicks Remove + Confirm for each row. Operationally O(rows)
        UX; for a heavy user this is friction. Adjacent to a UX-bar
        finding rather than a correctness bug.
      evidence:
        - "OwnerAssociationsActive.tsx:73-97 (no multi-select state in the list component)"
        - "ActiveAssociationRequest.tsx:42-97 (per-row UI structure)"
      ui_unverified: false
terminal_side_effect:
  side_effect_class: db-write
  description: |-
    DELETE on user_owner_mapping row(s) keyed by ownerId + authenticated
    user identity (presumed). The corresponding owner_association_request
    row is NOT touched (the request remains APPROVED in the DB even
    though the binding is gone — operator should not see this in the
    History tab since History reads owner_association_request_activity,
    not owner_association_request directly). If the unbind emits NO
    activity entry of its own, the operator-facing audit trail SILENT
    on unbind events — a symmetric finding to F-172's audit-silence
    drift facet.
  evidence: "ActiveAssociationRequest.tsx:32-39 + inferred backend"
