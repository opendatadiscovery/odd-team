  name: getActivityList_typeNullAndTypeALL_dispatchToSameUnderlyingPath
evidence:
- 'getActivity.md says: ''A refactor that only updates one branch (e.g. adds owner-scoping
  to ALL but not to null) would silently bypass the new gate when callers omit the
  parameter'''
- concepts.yaml:entities[Activity Feed].security_aggregate.weaknesses.[2] (two-branch
  dispatch refactor risk)
cross_references:
- concepts.yaml:entities[Activity Feed].security_aggregate.weaknesses.[2]
proposed_action: Add unit test on `ActivityServiceImpl.getActivityList` asserting
  both `type=null` and `type=ALL` produce identical observable behaviour (delegate-target
  equality). Locks the dispatch-equivalence invariant.
