- id: H-003
  hypothesis: |-
    When the partition orchestrator runs, the activity-table partition manager and the
    message-table partition manager BOTH operate under the single shared partition advisory
    lock (90) — i.e. the deliberate cross-subsystem share is honoured, and a collision
    validator (if one existed) would treat lock 90 as legitimately shared rather than a defect.
  derivation: |-
    ActivityTablePartitionManager sidecar dependencies_semantic.coupling[0] states the two
    partition managers share the boot-time advisory lock for serial CREATE PARTITION; the
    feature-flow facet `cross_subsystem_share_by_intent_is_legal` makes this load-bearing for
    any future validator.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      Both managers are discovered into one `List<PartitionManager>` by
      PostgreSQLPartitionCreationJob, which acquires lock 90 ONCE
      (PostgreSQLPartitionCreationJob.java:31, acquire(activityLockId, false)) and runs every
      manager inside that single lock-holding connection. The two tables are coupled through the
      shared scheduler + shared lock but independent in their CREATE semantics. The share is
      intentional and structural — a "pairwise-distinct" validator would falsely reject it,
      exactly as the feature-flow warns. PLT-089's proposed fix (b) explicitly encodes the
      partition share as legal.
    evidence:
      - sidecar: odd-platform__java__ActivityTablePartitionManager__config-key-consumer__odd_activity_partition-period@L11.md
        section: dependencies_semantic.coupling
        cite: "PostgreSQLPartitionCreationJob.java:22,26-27 + MessageTablePartitionManager.java:17,19"
        note: "both partition managers discovered into one List, share advisory-lock-id 90 + ShedLock name + cron"
      - sidecar: source_read_for_validation
        section: PostgreSQLLeaderElectionManagerImpl
        cite: "PostgreSQLPartitionCreationJob.java:31"
        note: "acquire(activityLockId, false) — single acquisition of lock 90 wraps all partition managers"
    severity: null
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: cross-actor
    coverage: unverified
    test_ref: null
    test_demand: functional
    coverage_note: |-
      AdrPartitionLifecycleScanTest pins (structurally) that creation runs behind
      `leaderElectionManager.acquire(activityLockId` at boot — it does NOT assert that BOTH
      partition managers run under the ONE lock, nor that the share is legal. Confirmed-but-
      untested → functional-test-demand: this is the exact case a future collision validator
      must not break, so it needs a guard before the validator is written.

