notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "magic string" + "sentinel" + "in-band" — found
  `invariant:lineage-depth-empty-sentinel-magic-number` (the lineage
  sentinel is a NUMERIC magic value, not a string literal). No
  existing concept describes the Directory's specific cross-three-files
  string-literal sentinel pattern.

  STRENGTHENS the broader RENAME-FRAGILITY pattern in the route layer.
  Cross-link to `invariant:directory-level-3-url-via-navigate-redirect-not-builder`
  (the architectural decision) — these two invariants TOGETHER explain
  the level-3 surface's full posture (the redirect-driven shape PLUS
  the magic-string-literal rename surface).

  Next-batch surface: similar magic-string patterns in `alertsRoutes`
  (path-segment literals) and `dataModellingRoutes` (sub-path literal
  duplication) — worth a follow-up audit if a refactor of the route
  layer is contemplated.
