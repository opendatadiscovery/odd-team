description: |-
  NEW INVARIANT, batch 2026-05-20S (DataSourceIngestionServiceImpl primary
  source — the SERVICE-TIER vertex of the 4-LAYER ADR-CANDIDATE-142 + 143
  triangulation, COMPLETING the controller (batch P) + service (this batch S)
  + repository (batch R) + SQL/migration end-to-end chain).

  THE TWO ENACTED ADRs:

  ADR-CANDIDATE-142 (partial-merge UPSERT — ONLY `name` + `description` from
  payload propagate; everything else is preserved from existing row). The
  SERVICE-TIER ENACTMENT POINT is DataSourceIngestionServiceImpl.java:86-88:
  `new DataSourcePojo(a).setName(i.getName()).setDescription(i.getDescription())`
  — a COPY-CONSTRUCT from the existing pojo (`new DataSourcePojo(a)`) followed
  by EXPLICIT-SETTER on only `name` + `description`. The intent is structurally
  visible: a maintainer adding a new payload-driven field MUST add
  `.setXxx(i.getXxx())` here; the repository would faithfully propagate it.
  The narrowing happens HERE; the repository (batch R primary source —
  ReactiveDataSourceRepositoryImpl) confirms the SQL-tier would NOT have
  constrained it.

  ADR-CANDIDATE-143 (namespace inherited from Collector, NOT from payload —
  collector-tenancy model). The SERVICE-TIER ENACTMENT POINT is
  DataSourceIngestionServiceImpl.java:99-111 (`mapDataSources`), line 106
  specifically: `MappingUtils.extractFieldFromNullableObject(c.namespace(),
  NamespacePojo::getId)`. The mapper takes `namespaceId` as a parameter,
  NOT a derived value from `ds`; this service explicitly passes the COLLECTOR's
  namespace_id from `CollectorDto.namespace()`. The DataSource payload's
  hypothetical `namespace_name` field is NEVER read by this code path —
  the payload-side namespace info is SILENTLY DROPPED in favor of the
  Collector's pre-configured namespace_id.

  THE 4-LAYER END-TO-END TRIANGULATION:
    1. Controller (batch P, IngestionController.createDataSource) — observes
       the service call but does NOT enforce either ADR; it is a 25-line
       proxy delegating to the service.
    2. Service (this batch S, DataSourceIngestionServiceImpl) — the
       PRIMARY-SOURCE ENACTMENT vertex; lines 74-92 (prepareForUpdate
       narrows to 2 fields) + lines 99-111 (mapDataSources stamps namespace
       from Collector). The deliberate structural choice lives HERE.
    3. Repository (batch R, ReactiveDataSourceRepositoryImpl) — confirms
       the SQL-tier would propagate ANY column the service supplies; the
       narrowing happens upstream. Inherits bulkUpdate / bulkCreate from
       ReactiveAbstractCRUDRepository.
    4. SQL / migration — `data_source.namespace_id` is the ONLY namespace
       column on `data_source` (V0_0_11__add_namespace_support.sql:1-2);
       no `namespace_name` column exists; the SQL layer cannot receive
       payload-side namespace info even if the service-layer narrowing
       were removed.

  THE PROTECTIVE INVARIANTS ENFORCED HERE:
    (a) Cross-collector namespace stealing BLOCKED. A stolen Collector A
        token cannot register datasources into Collector B's namespace
        because the mapper hard-codes namespace_id from the matched
        Collector via line 106.
    (b) Cross-collector ownership preservation. The COPY-CONSTRUCT at line
        86 (`new DataSourcePojo(a)`) preserves the EXISTING collector_id
        (which may differ from the current request's collector); only
        name + description are overwritten. A stolen Collector A token
        CANNOT "take over" a datasource originally registered by Collector
        B by re-POSTing with the same ODDRN.

  THE OPERATOR-FACING TRADE-OFFS:
    - REFACTOR-422 silent no-propagation of `connection_url` / `type` /
      `active`: a collector whose source's hostname genuinely changed
      has NO mechanism to push the new connection_url through this
      endpoint. Operator must use the UI's PUT /api/datasources/{id}.
    - REFACTOR-423 silent overwrite of operator UI edits: a collector's
      next POST overwrites operator-renamed `name` via the partial-merge
      path. Operator confusion is operationally common.
    - REFACTOR-424 silent namespace drop: payload `namespace_name` field
      is silently dropped. Custom-collector authors following the OpenAPI
      contract are surprised.

  Severity: MEDIUM (the ENACTED ADRs are architecturally defensible — the
  tenancy model is the protective half — but the operator-facing trade-offs
  are undocumented at every live doc page; the service-tier file:line
  evidence makes this the canonical anchor for future doc updates).
