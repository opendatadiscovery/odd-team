  \ correct WITHIN\ntheir own scope but the operator-facing landing page does NOT\n\
  explain which scope they apply to (or worse: implies they apply\nto a different\
  \ scope). The operator's path of least resistance\n(copy-paste verbatim) lands in\
  \ a different code path.\n\nCodebase-wide audit candidate:\n  - WebFetch every live\
  \ `/configuration-and-deployment/*` page.\n  - Extract every YAML key and curl example.\n\
  \  - Cross-reference YAML keys against `@Value(...)` + `@ConfigurationProperties`\
  \ consumer code via Spring relaxed-binding semantics.\n  - Cross-reference curl\
  \ headers against `Filter` / `WebFilter` / controller-annotation consumers.\n\n\
  Two DOC-NNN candidates flow from this invariant:\n  (a) `/configuration-and-deployment/enable-security/authentication/oauth2-oidc`\n\
  \      page: correct `username-attribute` → `user-name-attribute`\n      in the\
  \ Common-to-All-Providers section.\n  (b) `/configuration-and-deployment/enable-security/authentication/s2s`\n\
  \      page: distinguish between `X-API-Key` (global S2S) and\n      `Authorization:\
  \ Bearer` (path-scoped IngestionDataEntitiesFilter)\n      in the curl example;\
  \ the conflated recommendation\n      'combining S2S with auth.ingestion.filter.enabled:\
  \ true'\n      currently obscures which header to use for which filter.\n\nSurface\
  \ as canonicalisation candidate (DOC-NNN-shape).\n"
