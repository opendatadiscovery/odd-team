proposed_action: |-
  Testcontainers integration test. (a) Provision two user_owner_mapping rows: `(oidc_username='alice', provider='LOGIN_FORM', owner_id=42, deleted_at=NULL)` and `(oidc_username='alice', provider='LDAP', owner_id=43, deleted_at=NULL)`. (b) Insert ONE activity row with `created_by='alice'` referencing data_entity_id=1. (c) Call `activityRepository.findAllActivities(...)` and read the resolved OwnerPojo. (d) Assert: the returned OwnerPojo is DETERMINISTIC across runs (it always resolves to ONE of the two, not both — the LEFT JOIN multiplicity produces 2 rows; the activity row appears DUPLICATED in the result set). (e) Pin the duplication-or-arbitrary-pick failure mode: the read path has NO DISTINCT and NO ORDER BY on the USER_OWNER_MAPPING join, so the duplication is observable. (f) Add a `// REGRESSION-PIN — Cross-mode bleed CURRENT behaviour: the username-only JOIN produces ambiguous owner resolution. REFACTOR-NNN will add a provider-aware predicate; this test will then flip to assert deterministic resolution by (username, provider).` comment block.
