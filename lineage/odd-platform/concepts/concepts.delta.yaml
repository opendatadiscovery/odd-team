    - P-026 / P-027 / P-028 / P-029 / P-030 / P-031 / P-032 / P-033 probes
    - openapi.yaml:345 (popularity-sort claim) + components.yaml IdsParam
  result: NO-CONTRADICTIONS-FOUND
  strengthens_count: 4
  supersedes_count: 0
  conflicts_surfaced: 0
  notes: |-
    Every claim in the 7 new sidecars STRENGTHENS existing registry content
    (the Tag entity + Delete Tag + Get Popular Tag List operations + the
    LSN-019 / side-door / cascade-asymmetry invariant family). No claim
    contradicts an existing concept. One REFINEMENT was surfaced (not a
