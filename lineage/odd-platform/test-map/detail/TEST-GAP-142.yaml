gap_id: TEST-GAP-142
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java LoginFormSecurityConfiguration config-key-consumer:auth.type@L31
surfaced_by:
- LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[1]
- LoginFormSecurityConfiguration@L31.md:security.known_security_gaps.[1]
behaviour: '`auth.login-form-redirect` open-redirect surface: line 41 reads raw string
  with `@Value`, line 89 invokes `URI.create(redirectUri)` without scheme/host/path
  validation, line 46 invokes `DefaultServerRedirectStrategy().sendRedirect(...)`.
  No allowlist. In deployments where this value comes from a templated source (helm
  chart, env-var substitution), there is no boundary that rejects an attacker-controlled
  value.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/LoginFormOpenRedirectTest.java
  name: authLoginFormRedirect_attackerUrl_sentVerbatimToSendRedirect
evidence:
- 'LoginFormSecurityConfiguration@L31.md says: ''URI.create(redirectURIString) at
  line 89 is invoked WITHOUT any allowlist or origin check'''
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[5]
proposed_action: 'Add unit test on the post-login redirect handler: configure `auth.login-form-redirect:
  https://attacker.example.com/`; assert `ServerWebExchange` redirect target equals
  that value verbatim. Locks the no-allowlist posture; a future hardening (scheme/host
  allowlist) deliberately flips the test.'
