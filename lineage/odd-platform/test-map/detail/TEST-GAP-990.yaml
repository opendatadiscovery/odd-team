proposed_action: |-
  Add `CreateEnumValueConcurrencyRaceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `createEnumValue_concurrentTwoPosts_oneWritesSilentlyLost_pinsLastWriteWins` — seed field F with [A]; concurrently POST body=[A,B] AND body=[A,C] via `Flux.parallel(2).flatMap(...)`; await both responses; GET field's enum values; assert the final state contains EITHER [A,B] OR [A,C] but NOT [A,B,C] (one set silently lost). PIN the race window.
  2. `createEnumValue_concurrentTenPosts_silentDestructionAmplifies_pinsSustainedRace` — concurrently POST 10 different bodies; verify the survivor count is far less than 10 cumulative items (each loser's items are destroyed by the next softDeleteExcept). Stress-test the race window.
  3. `createEnumValue_responseAndActivityEvents_noConflictSignal_pinsSilentLossContract` — execute test 1 and capture both responses + activity events; assert BOTH return HTTP 201 success (no 409, no warning) AND TWO `DATASET_FIELD_VALUES_UPDATED` activity events fire. PIN the no-conflict-signal contract.

  Pair with REFACTOR-NNN: introduce advisory lock on dataset_field_id via `SELECT pg_advisory_xact_lock(?)` at start of @ReactiveTransactional method, OR add optimistic-version on the dataset_field row + check-and-update pattern. When the fix lands, test 1 inverts (one POST returns 409 OR both serialise correctly).
