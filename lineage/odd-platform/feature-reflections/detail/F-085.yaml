- id: H-005
  hypothesis: |-
    When an operator names a real user `admin` (LOGIN_FORM/LDAP) or `ADMIN` (any mode),
    that user's identity does NOT collide with the DISABLED synthetic `admin` or the S2S
    `ADMIN` literal — the platform keeps operator-named identities distinct from its
    built-in synthetic ones.
  derivation: |-
    dummyOwner uses lowercase literal "admin"; S2sAuthenticationFilter uses uppercase
    "ADMIN"; user-owner mapping compares names case-sensitively. Negative-space + doc-claim
    (Reserved usernames) seed.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The controller hardcodes lowercase `"admin"` (IdentityController.java:32). The S2S
      filter hardcodes uppercase `"ADMIN"` (S2sAuthenticationFilter.java:31-34 per the
      feature-flow + PLT-072 Defect 3 — not re-read this run; cited from the tracked item).
      The user-to-owner mapping compares OIDC_USERNAME case-sensitively (F-011 / PLT-065).
      An operator-provisioned user literally named `admin` or `ADMIN` therefore shares the
      synthetic literal and can inherit whatever Owner the synthetic principal resolves to.
      The platform does NOT reserve or guard these names. Already tracked: PLT-072 Defect 3
      (F-085c) + the live doc's "Reserved usernames" section (which warns operators rather
      than the platform enforcing).
    evidence:
      - source_read_for_validation: true
        cite: "odd-platform-api/.../controller/IdentityController.java:32"
        note: 'lowercase literal "admin" in dummyOwner()'
      - sidecar: feature-flow F-085 drift facet
        cite: "S2sAuthenticationFilter.java:31-34 (uppercase 'ADMIN') — via PLT-072 Defect 3"
        note: "second hardcoded identity literal; not re-read this run"
    operator_visible_failure: |-
      An operator who provisions a user `admin` in LOGIN_FORM/LDAP, or any user `ADMIN`,
      sees that user silently inherit a synthetic principal's Owner mapping after an
      auth-mode flip — wrong attribution and potential privilege bleed, with no error and no
      log. The collision is undocumented in-product (only the security doc page warns).
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

