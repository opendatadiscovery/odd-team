proposed_action: |-
  Add `ActivitySystemEventNullUsernameTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/activity/` using Testcontainers + `@SpringBootTest` + Spring Security test-fixtures. Four test methods:

  1. **`createActivityEvent_noSecurityContext_persistsNullCreatedByAndIsSystemEventDistinguishability`** (HEADLINE):
     - Arrange: clear `ReactiveSecurityContextHolder` before invocation.
     - Act: invoke `ActivityServiceImpl.createActivityEvent(ActivityCreateEvent.builder().dataEntityId(...).eventType(DESCRIPTION_UPDATED).oldState("{}").newState("{X:1}").systemEvent(true).build())` and `.block()`.
     - Assert: query activity table for the resulting row; `created_by` IS NULL; `is_system_event` IS TRUE. PIN the system-event path's distinguishability.

  2. **`createActivityEvent_systemEventFalseNoSecurityContext_persistsNullCreatedByAndIsSystemEventFalse_LEAKAGEPIN`**:
     - Arrange: clear ReactiveSecurityContextHolder; build event with `.systemEvent(false)` (as @ActivityLog AOP path would).
     - Act: invoke createActivityEvent.
     - Assert: `created_by` IS NULL; `is_system_event` IS FALSE. PIN the structural ambiguity: a row in this state is INDISTINGUISHABLE from a "user-context-lost" bug or an anonymous DISABLED mutation.
     - Comment: this is the LEAKAGE PIN — locking in the current ambiguity so a future schema migration (e.g. `actor_kind` column) is a coordinated decision.

  3. **`createActivityEvent_authenticatedUser_persistsUsernameAsCreatedBy_pinHappyPath`** (CONTROL):
     - Arrange: ReactiveSecurityContextHolder populated with `UserDto.builder().username("alice").provider("LOGIN_FORM").build()`.
     - Act: invoke createActivityEvent with `.systemEvent(false)`.
     - Assert: `created_by="alice"`; `is_system_event=false`. PIN the happy-path attribution.

  4. **`createActivityEvent_alertServicePathAuto_setsSystemEventTrue_pinSchedulerSemantic`** (INTEGRATION):
     - Arrange: trigger an `AlertServiceImpl.applyAlertActions` flow that emits OPEN_ALERT_RECEIVED activity events on the scheduler thread (no SecurityContext).
     - Assert: every emitted activity row has `created_by=NULL` AND `is_system_event=TRUE`. PIN the alert-emitted system-event contract.

  5. **`createActivityEvent_ingestionPath_setsSystemEventTrue_pinIngestionSemantic`** (INTEGRATION):
     - Arrange: trigger a `POST /ingestion/entities` flow with auth.ingestion.filter.enabled=false (S2S path). The ingestion processor at FINALIZING phase fires DATA_ENTITY_CREATED activity events.
     - Assert: every emitted activity row has `created_by=NULL` AND `is_system_event=TRUE`. PIN the ingestion-emitted system-event contract.

  After P-020 measures the UI rendering of NULL-created_by rows, refine the test to assert the UI behaviour too. Cross-pair with REFACTOR-NNN to introduce an `actor_kind` schema column (or equivalent disambiguator). Cross-pair with DOC-NNN to surface the null-actor semantics on activity-feed.md.
