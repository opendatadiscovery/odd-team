notes: |-
  Generic UI pattern (URL as application state) instantiated on the DQ
  Dashboard. Sibling `url-as-source-of-truth-for-lineage-view-state`
  invariant uses URL state for lineage-view canvas params with a
  different mechanism (URL is the primary state container). This entry's
  pattern uses URL as a SIDE-CHANNEL for jotai-atom values — a related
  but distinct shape worth recording independently.

  Operator-visible behaviour worth documenting on a docs refresh:
    (1) The dashboard view is deep-linkable — paste a /data-quality?... URL
        to share a filtered view.
    (2) Filter state survives reload — no need to re-select chips.
    (3) Browser Back / Forward does NOT scrub through filter changes
        (replace:true policy) — it navigates the parent navigation only.
