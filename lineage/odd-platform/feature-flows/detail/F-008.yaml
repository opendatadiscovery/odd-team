feature_name: Ingestion-replace destruction surface — silent metadata-delete + lineage-replace-on-call
discovered_from_entry_point: webhook:POST /ingestion/entities
description: "The platform's primary S2S ingestion endpoint `POST /ingestion/entities` accepts a\n`DataEntityList` payload\
  \ from collectors and writes the entities, their metadata,\ntheir lineage edges, their group bindings, and their DQ-test\
  \ relations into the\nnamed datasource's namespace. The user-observable promise (per the live Catalog\nOverview page + the\
  \ live integration docs) is \"merge\" semantics: a collector\nre-publishes a SUBSET of fields per tick and the platform\
  \ integrates them with\nwhat it already knew.\n\nThe user-observable reality, per batch-I primary-source code-walk of IngestionServiceImpl\n\
  + MetadataIngestionRequestProcessor + LineageIngestionRequestProcessor: the\ningestion path is REPLACE, not merge.\n\nTWO\
  \ destructive surfaces are confirmed PRIMARY-SOURCE:\n\n1. METADATA DELETE-ON-ABSENCE — MetadataIngestionRequestProcessor.java:72-74\
  \ computes\n   `bindingsToDelete = existingMetadataBindings.difference(currentBindings)` and\n   deletes the omitted bindings\
  \ inside the SAME transaction (lines 76-80). A\n   collector that re-emits a partial metadata set (network flake, OOM mid-stream,\n\
  \   code bug, partial scrape) SILENTLY DELETES the rest of the entity's metadata.\n   No `log.warn` on the delete branch\
  \ (verified — MetadataIngestionRequestProcessor.java:30\n   @Slf4j is present but the delete path has no log call).\n\n\
  2. LINEAGE REPLACE-ON-EACH-CALL — LineageIngestionRequestProcessor.java:17 calls\n   `lineageService.replaceLineagePaths(request.getLineageRelations())`.\
  \ The verb\n   is REPLACE, not MERGE. LineageServiceImpl.replaceLineagePaths (lines 124-133,\n   @ReactiveTransactional)\
  \ extracts the SET of establishers from the payload,\n   deletes ALL edges by those establishers (batchDeleteByEstablisherOddrn\
  \ at line\n   131), then inserts the supplied pojos (batchInsertLineages at line 132). A\n   collector that fails to re-emit\
  \ a lineage edge silently removes it from the\n   platform.\n\nThe destruction is invisible at the HTTP response (which\
  \ is a Mono<Void> — 200/201\non success, 5xx on failure, no payload-level error report identifying which\nbindings were\
  \ removed). Combined with the default-OFF upstream filter\n(`auth.ingestion.filter.enabled: false` per application.yml:48\
  \ + batch-I primary-source\nbugs_limitations_corner_cases[2]), under the bundled deployment posture ANY HTTP\ncaller able\
  \ to hit the port can write or DESTROY data via this endpoint by\nspecifying any `data_source_oddrn` in the payload.\n\n\
  The transaction boundary is the entire `ingest(...)` call — a single bad entity\nrolls back the entire batch (1000-entity\
  \ payload, one constraint violation, 999\nlegitimate entities lost). There is no DLQ, no partial-success response shape,\n\
  no per-entity error reporting.\n\nThis is the canonical example of layer-4 composition catching what per-node\nscans miss:\
  \ each of the three processors looked fine in isolation; together they\nform a destruction surface no operator-facing doc\
  \ warns about."
