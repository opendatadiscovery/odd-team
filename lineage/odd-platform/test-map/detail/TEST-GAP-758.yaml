behaviour: |-
  **MEDIUM — The CollectorController's 5 endpoints have asymmetric token-visibility semantics that are unverified at the HTTP boundary: POST and PUT-token MUST return full plaintext (the operator's only chance to capture the credential); GET-list and PUT-update MUST return masked `******{last6}` form (the directory enumeration MUST NOT leak credentials). The contract is intentional per the sidecar's implicit_adrs.[2] but NO test asserts the asymmetry.** Primary-source confirmed in batch-W CollectorController sidecar:

  - `POST /api/collectors` (registerCollector lines 27-31): `ReactiveTokenRepositoryImpl.create` line 21 returns `new TokenDto(r.into(TokenPojo.class), true)` — the `showToken=true` flag triggers `TokenMapper.mapValue` (line 15-18) to return the FULL plaintext.
  - `PUT /api/collectors/{id}/token` (regenerateCollectorToken lines 47-51): `ReactiveTokenRepositoryImpl.updateToken` line 30 returns `new TokenDto(..., true)` — same FULL plaintext path.
  - `GET /api/collectors` (listCollectors lines 19-25): `ReactiveCollectorRepositoryImpl.listDto` line 124 returns `new TokenDto(tokenPojo)` — defaults to `showToken=false` — TokenMapper returns `******{last6chars}`.
  - `PUT /api/collectors/{id}` (updateCollector lines 33-40): `ReactiveCollectorRepositoryImpl.getDto` line 114 returns `new TokenDto(tokenPojo)` — defaults to `showToken=false` — masked.

  **The asymmetry is intentional design** per CollectorController.md:implicit_adrs.[2]: "Response shape for token-issuing operations returns plaintext token by design; read operations return masked tokens. TokenDto.visibleToken(...) is a deliberately-named static factory and the boolean field is named showToken (not isPersisted or isFresh) — the visibility decision is an intentional per-call-site policy."

  **The contract that must be pinned**:
  - Register / regenerate-token → FULL PLAINTEXT in response (operator captures the credential ONCE; there is no "show token again" surface).
  - List / update → MASKED in response (the directory enumeration must NOT leak credentials).
  - A regression that accidentally flips `showToken=true` on the list-endpoint code path would leak every collector's plaintext token to every authenticated user (combined with TEST-GAP-763's "GET endpoint has no Permission gate" finding, that's full-catalog credential leak to any authenticated user).
  - A regression that accidentally flips `showToken=false` on the register/regenerate path would prevent operators from capturing the new credential — they'd see masked output and the platform would lock them out.

  **Why MEDIUM not LOW**: the contract is correct as-is; the gap is purely "regression-pin to keep it that way". MEDIUM rather than LOW because:
  - A code-review tool cannot see the difference between `new TokenDto(p, true)` and `new TokenDto(p)` — both compile, both pass tests if no test exists.
  - The asymmetry is in 4 different files (`ReactiveTokenRepositoryImpl`, `ReactiveCollectorRepositoryImpl`, `TokenDto`, `TokenMapper`) — a refactor touching any one of these can flip the visibility unintentionally.
  - The "leak" failure mode is CRITICAL but the "lock-out" failure mode is also operator-affecting.

  **Test gap shape**: regression-pin asserting that: (a) `POST /api/collectors` response → `token.value` is the full 40-char plaintext; (b) `PUT /api/collectors/{id}/token` response → full plaintext; (c) `GET /api/collectors` response → all tokens are `******{last6chars}` masked; (d) `PUT /api/collectors/{id}` response → masked; (e) the full-plaintext token from #1 IS the same value as what `IngestionDataEntitiesFilter` will accept (cross-link to F-008 S2S contract); (f) the masked token from #3 is NOT a valid `IngestionDataEntitiesFilter` credential (the substring fails the equality check).
