status_reason: |-
  Surface is operator-observable and UI-tier RESOLVED (15 components +
  selection-driver + Redux slice references enumerated). Backend chain
  pre-existing in F-047. Status `ui-complete` because composition shape
  is resolvable from .tsx; reducer-tier drift facets carry `ui_unverified`
  pending slice enrichment. F-192 is the COMPOSITION-LAYER feature that
  F-047 anchors at the backend layer — the two are paired
  (F-047 backend ⇄ F-192 composer UI).
control_summary: |-
  0/4 cells COVERED. The composer is the user-observable entry-point for
  every F-047 drift facet — six sub-editors against one selected field.
  Six drift facets enumerated; three carry ui_unverified pending slice /
  reducer enrichment. The composer's mixed Redux-thunk + React-Query
  state-management coexistence is a refactor candidate; the absence of
  unsaved-changes warning on field switch is the highest-leverage UX
  defect. Operator workflow most exposed: keyboard-only navigation
  (Gate 6 a11y candidate per documentation pillar).
