mitigations_unimplemented:
- |-
  Add an idempotency_key column to the activity table + a UNIQUE
  index on the column. Add idempotency_key to ActivityCreateEvent;
  caller-side compute it (e.g. SHA-256 of canonical-serialized
  (entity_id, event_type, oldState, newState, actor, request_id)).
  Server-side `saveReturning` uses `ON CONFLICT (idempotency_key)
  DO NOTHING`. Schema migration + producer code change.
- |-
  Add a UNIQUE partial index on `(data_entity_id, event_type,
  created_by, md5(new_state), date_trunc('minute', created_at))`
  WHERE deleted_at IS NULL. Approximate dedup based on content +
  actor + minute-truncated time. Lighter-weight than the
  idempotency-key approach; catches the user-double-click case;
  misses the legitimate-second-same-diff case.
- |-
  Add an integration test
  `ActivityServiceImplConcurrencyTest.testConcurrentSameDoubleClick_Deduplicates`
  that exercises the user-double-click race directly. Pin the
  current behaviour (TWO rows) until the fix lands.
- |-
  Add a metric `activity_emit_duplicate_pairs_total` — count pairs
  of activity rows in the last hour with the same `(data_entity_id,
  event_type, created_by, md5(new_state))` and `created_at` within
  500ms of each other. Operators can detect duplicate-emit rate.
- |-
  Document the lack of idempotency on the activity-feed feature
  page: "ODD's activity-trail does not currently deduplicate
  near-simultaneous identical mutations. Operators reading the feed
  may see duplicate entries for user double-clicks or programmatic
  retries; the underlying state is correct."
notes: |-
  NEW invariant captured in batch VAL-LSN-019-B. Surfaced by
  primary-source examination of ActivityServiceImpl + cross-referenced
  with ReactiveActivityRepositoryImpl.

  This is an audit-integrity invariant — the audit feed's
  "trustworthiness" depends on the ratio of duplicate rows to real
  rows. Single-user-UX deployments rarely hit it; high-throughput
  + retry-prone deployments hit it routinely.

  The aspect filter provides partial protection (the serial-retry
  case is correctly suppressed), making the invariant less severe
  than it would be without the filter. The remaining attack surface
  is the true-concurrent case, which is rare in normal UX but
  amplifies with ingestion-heavy deployments.

  Cross-cutting connections:
    - Pairs with `activity-handler-concurrent-oldstate-capture-race`
      — the concurrent case is the SAME shape; this finding is
      "the underlying writes are not deduplicated" and that finding
      is "the snapshot pair is wrong" — both manifest in the audit
      log as multiple wrong rows for a single user action
    - Pairs with `service-tier-multi-step-writes-without-reactivetransactional-toctou-surface`
      — TOCTOU surfaces in service-tier writes; this finding is
      the audit-tier equivalent
    - Cross-references LSN-019 Stress Protocol Category E (resource
      boundaries — idempotency / replay-safety) as the
      diagnostic-class anchor

  PRIMARY-SOURCE confidence: HIGH (saveReturning is unconditional
  INSERT per the repository sidecar; aspect filter shape verified
  line-by-line at ActivityAspect.java:86; the partial-protection
  vs full-protection distinction is rigorously stated in the
  service sidecar's stress findings).
