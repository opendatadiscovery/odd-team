feature_id: F-141
pillar_id: P-01
pillar_anchored_id: P-01:F-012
pillar_anchored_feature_name: Catalog Overview Home Page composition
feature_name: |-
  Catalog Overview Home Page — Overview.tsx SPA home shell that composes
  the catalog-wide landing surfaces (MainSearch + TopTagsList +
  Domains + DataEntitiesUsageInfo + Directory + OwnerAssociation) into
  one route. The composition orchestrates 6 independent data fetches +
  one feature-flag gate predicate, and is the operator's first visual
  impression of the platform after login.
