      requires either (a) switching MDEditor.Markdown to the shared
      Markdown.tsx OR (b) applying rehype-sanitize at MDEditor.Markdown
      separately.
    drift_class: markdown_render_no_sanitisation_xss_surface_extension_f_004_4th
    provenance: |-
