name: Plaintext-equality shared-secret token model (STRENGTHENED batch R — SQL-tier
  primary source via Collector repo)
canonical_in_docs: false
canonical_candidate: true
description: |-
  Collector authentication uses a 40-char alphanumeric token stored in
  plaintext in the TOKEN table; IngestionDataEntitiesFilter validates incoming /ingestion/entities
  requests via literal `.equals(...)` against the in-DB value. No hashing layer, no
  HMAC, no per-request signature. Rotation is in-place UPDATE — no overlap window.
  The model is consistent with the token being a long-random opaque string used over
  TLS-protected transport, but DB compromise / backup / replica carries credentials
  in the clear. RandomStringUtils.randomAlphanumeric(40) uses ThreadLocalRandom (non-CSPRNG);
  should be .secure().nextAlphanumeric(40). Triangulated across WRITE-side (regenerateCollectorToken)
  AND VERIFY-side (IngestionDataEntitiesFilter@L20) sidecars in 2026-05-10B.
  **STRENGTHENED batch 2026-05-19-O** — the new IngestionDataEntitiesFilter filter-class-layer
  sidecar (auth/filter axis) confirms the plaintext-equality stance at the CONSUMER
  site for a third time (line 56 `dto.tokenPojo().getValue().equals(token)`),
  and surfaces the corresponding architectural-pattern claim in its implicit_adrs[1].
  The model is now triangulated across THREE sidecar axes: config-key-consumer
  (auth.ingestion.filter.enabled@L20), auth/filter (filter class layer batch O),
  and controller-method (regenerateCollectorToken write side).

  **STRENGTHENED batch 2026-05-20-R** — FOURTH axis added: the
  ReactiveCollectorRepositoryImpl batch-R sidecar pins the
  plaintext-equality stance at the **SQL primary source** in
  `getByToken(token)` (lines 89-97). The SQL emitted is
  `SELECT collector.* FROM collector JOIN token ON token.id =
  collector.token_id WHERE token.value = ? AND collector.deleted_at
  IS NULL` — `TOKEN.VALUE.eq(token)` at line 94 binds the inbound
  token verbatim to a Postgres-stdlib text-equality predicate. This
  `getByToken` method is called by the ALWAYS-ON
  `IngestionDataSourceFilter` (per IngestionDataSourceFilter.java:33,
  NO `@ConditionalOnProperty`) on every `POST /ingestion/datasources`
  request — establishing that the plaintext-equality stance applies
  IRRESPECTIVE of `auth.ingestion.filter.enabled` for the
  datasource-registration path. The model is now triangulated across
  FOUR sidecar axes:
    1. controller-method (regenerateCollectorToken — rotate-side)
    2. config-key-consumer (auth.ingestion.filter.enabled@L20 —
       verify-side annotation)
    3. auth/filter (IngestionDataEntitiesFilter batch O — verify-side
       filter class)
    4. **repository (ReactiveCollectorRepositoryImpl batch R — SQL
       primary source for the always-on IngestionDataSourceFilter
       auth path)** — NEW

  **Additional batch-R findings on the same model**:
    - **No UNIQUE constraint on TOKEN.value** (V0_0_28__add_token.sql:1-9):
      two TOKEN rows could share the same `value` (a collision from
      RandomStringUtils.randomAlphanumeric(40) is astronomically
      improbable, but no schema-level defence prevents it; no
      application-level pre-check either). If `getByToken(t)` ever
      sees two matching rows, the jOOQ `mono(query)` returns the
      FIRST row's matched COLLECTOR with no determinism guarantee
      (no ORDER BY at lines 90-94). Cross-collector data-source
      registration becomes silently possible.
    - **No index on TOKEN.value**: `getByToken` falls back to a
      sequential scan of the TOKEN table. For small deployments
      this is negligible; for 10K+ collector deployments the
      lookup becomes O(N).
    - **Orphan TOKEN rows after collector soft-delete**: TOKEN has no
      soft-delete column; soft-deleted collector's token_id still
      points to a TOKEN row with the plaintext credential still
      readable via `SELECT * FROM token`. No housekeeping job
      removes these. Historical credentials persist indefinitely.
    - **No `regenerateToken` audit trail**: per the F-006 audit-silence
      pattern + the schema-rooted root cause (
      `f-006-audit-silence-schema-rooted-data-entity-id-not-null-fk`
      invariant), token rotations cannot emit to the activity table
      (no data_entity_id context) and no @Slf4j log line exists.
      Forensic reconstruction requires only TOKEN.updated_at +
      TOKEN.updated_by (which CAN be null in auth.type=DISABLED
      deployments per TokenGeneratorImpl.java:27-32 fallback).

  **The complete end-to-end exposure chain** is captured at the
  dedicated
  `collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain`
  invariant which combines the SQL substrate (this concept's
  fourth axis) with the UI-tier DOM-render finding from batch Q.
