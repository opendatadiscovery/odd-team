notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "tab click" + "session" + "drop" + "homecoming" — found
  `invariant:bare-base-url-behavior-divergence-redirect-vs-blank`
  (different concept: pillar mount-time behaviour at bare base URLs,
  not top-nav tab semantics) and
  `invariant:url-as-source-of-truth-for-lineage-view-state` (a CONTRAST
  pattern: lineage page DOES preserve URL state across navigation).
  No existing concept describes the toolbar's drop-session pattern.

  STRENGTHENS the broader URL-state-management posture. The
  `url-as-source-of-truth-for-lineage-view-state` invariant says the
  Lineage page treats URL as authoritative state; the
  `tab-click-drops-session-state` invariant says the AppToolbar tabs
  drop URL state. The two patterns coexist: pillars' INTERNAL navigation
  preserves URL state; cross-pillar tab navigation drops it.

  Worth a future audit: do other pillar tabs (DataModelling, DataQuality,
  Management) drop session state on tab click? The pattern is likely
  uniform but only the Search + Activity tabs are confirmed in batch ZI.
