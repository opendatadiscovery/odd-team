description: |-
  NEW INVARIANT, batch 2026-05-19M (4-ANGLE TRIANGULATED at the controller-method
  layer). The OpenAPI specification at openapi.yaml:843-844 (upstream) and 859-871
  (downstream) declares the response semantics for /api/dataentities/my/upstream and
  /api/dataentities/my/downstream as "Returns list of data entities OWNED BY current
  user with upstream/downstream dependencies". The actual implementation returns the
  **INVERSE** — entities the user does NOT own that are reachable in one lineage hop
  from entities they DO own (the Predicate.not(oddrns::contains) filter at
  DataEntityRelationsServiceImpl.java:37 explicitly EXCLUDES the owned set). The UI
  consumer (OwnerEntitiesList.tsx:87) labels the panel CORRECTLY as "Upstream
  dependents" — semantically accurate; the UI inherits the right semantic. The
  OpenAPI summary (the contract layer third-party API consumers read) does not.
  **4-angle triangulation**: (a) batch G controller-method sidecar getMyObjects
  (architectural sibling); (b) batch H repository sidecar ReactiveLineageRepositoryImpl
  (no-owner-JOIN SQL primary source); (c) batch I service sidecar LineageServiceImpl
  (NEGATIVE-case lineage read sibling); (d) batch M controller-method primary
  sources getMyObjectsWithUpstream (PRIMARY SOURCE) + getMyObjectsWithDownstream
  (SYMMETRIC SIBLING). **Operator-facing consequence**: a multi-tenant deployment
  reading the OpenAPI summary and treating ownership as a tenancy boundary expects
  tenant-isolated results; receives cross-tenant lineage neighbours. The
  doc-vs-code inversion is the most directly-falsifiable security claim in this
  slice of the API surface. **Severity**: HIGH.
