name: Browse Data Entities by Hierarchy (4 levels)
canonical_in_docs: true
canonical_candidate: false
description: 'Four-level hierarchical browse complementing Search: GET /api/directory
  (level 1: types grouped by ODDRN prefix with counts) → GET /api/directory/datasources?prefix={prefix}
  (level 2: data sources per type) → GET /api/directory/datasources/{id}/types (level
  3: entity types per data source) → GET /api/directory/datasources/{id} (level 4:
  paged entities). DirectoryController forwards to DirectoryService for levels 1-3
  and DataEntityService for level 4.'
axes_present:
- controllers
