proposed_action: |-
  Performance-boundary test (marker test — runs separately). (a) Pre-seed 10,000 owned entities for user uA (large anchor set). (b) Add 50,000 single-hop upstream LINEAGE edges (large derived set). (c) GET /api/dataentities/my/upstream?page=1&size=5. (d) Measure: (i) JVM heap allocation, (ii) DB query time on anchor fetch, (iii) DB query time on lineage CTE, (iv) response time. (e) Assert: cost is O(anchor + derived), NOT O(page * size). (f) Repeat with `size=1_000_000`. (g) Test comment 'LOCKS the unbounded-anchor + unbounded-page DoS-amp vector as of 2026-05-19. When the anchor-fetch is paginated AND the controller adds @Max(1000), this test FLIPS to expect O(page * size) cost AND a 400 on size=1000000.' Pair with a `/my/downstream` symmetric test.
