- id: H-004
  hypothesis: |
    When an SDK client reads MetadataFieldList.page_info.has_next, it can tell whether more fields
    exist beyond this response and page through them; page_info.total reports the true catalogue size.
  derivation: |
    The OpenAPI response schema embeds PageInfo{total, has_next} (components.yaml:2111-2120) — the
    universal ODD pagination contract every other list endpoint honours.
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      page_info is theatre. MetadataFieldMapperImpl.java:29-33 constructs
      `new PageInfo().total((long) pojos.size()).hasNext(false)` — total is ALWAYS items.length and
      has_next is the constant false, on every response. The SQL has no LIMIT/OFFSET (no paging is
      possible to begin with). A genuinely paginated endpoint builds PageInfo from Page<T>.total() /
      Page<T>.hasNext(); this one builds it from a raw List<T>.
    evidence:
      - sidecar: odd-platform__java__MetadataFieldController__controller-class__MetadataFieldController
        section: stress_findings.name_behavior_pairs + bugs_limitations_corner_cases[0]
        cite: "MetadataFieldMapperImpl.java:29-33 + components.yaml:2111-2120 + ReactiveMetadataFieldRepositoryImpl.java:44-56"
        note: "total=items.length, hasNext=false constant; no LIMIT/OFFSET in SQL"
    operator_visible_failure: |
      (1) An SDK author implementing an infinite-scroll / "load more" field picker against the spec
      cannot detect overflow — has_next is permanently false, so they render the first response as the
      complete set even when 10k fields exist. (2) A monitoring client treating page_info.total as a
      catalogue-size metric reads back exactly the array length it already has — a useless signal dressed
      as a count. (3) The contract-vs-runtime mismatch is invisible until an integrator hits it in
      production; the OpenAPI spec is silent about the theatre. (PLT-025 Defect 3 tracks this.)
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional
    coverage_note: |
      MetadataFieldMapperTest.mapPojosTest asserts total==2 and hasNext==false for a 2-pojo input —
      but that test PINS the theatre as if correct (with 2 items, total==2 is coincidentally right).
      No test asserts the FAILURE: total != true-row-count when the catalogue exceeds the response, or
      that has_next stays false when more rows logically exist. The bug is mapper-pinned but not
      regression-protected against the contract it violates.

- id: H-005
  hypothesis: |
    Only a user granted a custom-metadata permission can read the deployment's custom-metadata field
    catalogue; a user with no relevant permission (or an anonymous caller) cannot enumerate it.
  derivation: |
    Pillar P-09 gates mutations across the catalog; the Permissions page documents
    DATA_ENTITY_CUSTOM_METADATA_{CREATE,UPDATE,DELETE}. A read of the vocabulary would normally have a
    matching READ permission or owner-scoping.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      `/api/metadata/fields` has NO SecurityRule in SecurityConstants and no @PreAuthorize — it falls
      through to `pathMatchers("/**").authenticated()`. Any authenticated user (any role, any policy,
      any owner scope, or none) gets the full INTERNAL catalogue. Under auth.type=DISABLED the endpoint
      is anonymous (DisabledAuthSecurityConfiguration permitAll). There is NO CUSTOM_METADATA_FIELD_READ
      permission anywhere in the codebase, and the live Permissions page (verified 2026-05-25 status 200)
      documents only the three write-side permissions.
    evidence:
      - sidecar: odd-platform__java__MetadataFieldController__controller-class__MetadataFieldController
        section: stress_findings.auth_gates + security
        cite: "SecurityConstants.java:95-355 (no /api/metadata/fields rule) + AuthorizationCustomizer.java:29-30 + DisabledAuthSecurityConfiguration.java:13-18"
        note: "authenticated() fallback in every non-DISABLED mode; anonymous under DISABLED"
    operator_visible_failure: |
      (1) Every authenticated user enumerates the full deployment vocabulary — field names like
      `pii_indicator`, `salary_band`, `legal_hold` leak the existence of governance concerns to users
      who cannot see the entities they apply to. (2) Operators wiring policies for the per-VALUE write
      surface reasonably assume the catalogue read is similarly scoped — it is not, and nothing tells
      them. (3) On a dev/sandbox deployment running DISABLED, an unauthenticated network scan of
      GET /api/metadata/fields dumps the entire custom-metadata schema. This is the read-collaborative
      posture surfacing on the metadata-vocabulary surface (same class as F-018's tag directory).
      (PLT-025 Defect 4 tracks this.)
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

