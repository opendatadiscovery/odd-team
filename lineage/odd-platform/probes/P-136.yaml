expected_outcome: |
  Stress question (Category F + E): SearchController.highlightDataEntity
  delegates to DataEntityHighlightServiceImpl which calls
  ReactiveDataEntityRepositoryImpl.getHighlightedResult(text, query).
  The implementation at ReactiveDataEntityRepositoryImpl.java:798-806
  is:

    final String tsQuery = jooqFTSHelper.tsQuery(query);
    final String sql = "ts_headline('english', '%s', to_tsquery('%s'), 'HighlightAll=true')"
        .formatted(text, tsQuery);

  Both `text` (the catalog entity's searchable string) and
  `tsQuery` (derived from the search session's persisted query) are
  String.formatted-interpolated into raw SQL WITHOUT escaping. This
  is a TRUE SQL injection vector, not just a tsquery parser DoS.

  Hypothesis: a caller POSTs `/api/search` with a crafted `query`
  parameter that, after passing through tsQuery's split-on-space +
  `:*` + `&`-join, produces a string that breaks out of the
  to_tsquery quote in the .formatted SQL and executes arbitrary
  Postgres statements. Two attack shapes to test:

  Shape A — quote escape via single-quote in the query: the user's
  query persists in search_facets.query_string as raw text;
  tsQuery preserves quote characters; the .formatted concatenation
  injects them into the SQL string.

  Shape B — quote escape via the catalog entity's searchable text:
  a maliciously-named data entity (e.g. internal name containing
  a single quote) flows into `text` and breaks the outer
  ts_headline argument.

  PASS = both injection attempts return a normal highlight
  response with the malicious payload safely escaped or rejected.
  FAIL = SQL syntax error indicates partial parsing (DoS surface);
  successful side-effect of injected statement (e.g. observable
  log line, pg_sleep delay, or DDL) indicates TRUE injection.
---
arrange:
  - kind: docker-compose-up
    services: [postgres, odd-platform-api]
  - kind: sql
    description: "Seed two probe data entities: (a) a benign one for legitimate highlight; (b) one with a malicious internal_name to test Shape B"
    query: |
      DELETE FROM search_entrypoint WHERE data_entity_id IN
        (SELECT id FROM data_entity WHERE oddrn LIKE '//probe-source/p136/%');
      DELETE FROM data_entity WHERE oddrn LIKE '//probe-source/p136/%';
      INSERT INTO data_entity (id, oddrn, external_name, internal_name, data_source_id, type_id, entity_class_ids, status, hollow, manually_created, exclude_from_search, created_at, updated_at) VALUES
        (22001, '//probe-source/p136/benign', 'p136benign entity', NULL, 1, 1, ARRAY[1], 1, false, false, false, NOW(), NOW()),
        (22002, '//probe-source/p136/quoted', 'p136quoted', 'has '' in name p136quoted', 1, 1, ARRAY[1], 1, false, false, false, NOW(), NOW());
      INSERT INTO search_entrypoint (data_entity_id, search_vector) VALUES
        (22001, to_tsvector('english', 'p136benign entity')),
        (22002, to_tsvector('english', 'p136quoted entity'));
  - kind: rest
    method: POST
    path: /login
    body: "username=admin&password=admin"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    capture_as: session_cookie
  - kind: rest
    description: "Baseline: create session with benign query, expect normal highlight"
    method: POST
    path: /api/search
    headers:
      Cookie: "${session_cookie}"
      Content-Type: "application/json"
    body: |
      {"query": "p136benign", "myObjects": false, "filters": {}}
    capture_as: benign_session
  - kind: extract
    from: benign_session
    field: "searchId"
    capture_as: benign_search_id
  - kind: rest
    description: "Shape A: create session with quote-injection payload. The malicious query attempts to break out of the to_tsquery argument string"
    method: POST
    path: /api/search
    headers:
      Cookie: "${session_cookie}"
      Content-Type: "application/json"
    body: |
      {"query": "PAYLOAD_WITHHELD__see_private_advisory_GHSA-rjp9-9vgm-q94c", "myObjects": false, "filters": {}}
    capture_as: shape_a_session
  - kind: extract
    from: shape_a_session
    field: "searchId"
    capture_as: shape_a_search_id
act:
  - kind: rest
    description: "Baseline highlight call — proves the path works"
    method: GET
    path: "/api/search/${benign_search_id}/data_entities/22001/highlights"
    headers:
      Cookie: "${session_cookie}"
    capture_as: baseline_highlight
  - kind: rest
    description: "Shape A: highlight with malicious persisted query. If the SQL injects, pg_sleep(5) will add 5+ seconds to the response. If escaped, the request returns normally with no observable delay"
    method: GET
    path: "/api/search/${shape_a_search_id}/data_entities/22001/highlights"
    headers:
      Cookie: "${session_cookie}"
    timeout_ms: 10000
    capture_as: shape_a_highlight
    capture_duration_as: shape_a_duration_ms
  - kind: rest
    description: "Shape B: highlight the entity with the quote in its name. The quote in `text` may break out of the ts_headline argument quote"
    method: GET
    path: "/api/search/${benign_search_id}/data_entities/22002/highlights"
    headers:
      Cookie: "${session_cookie}"
    capture_as: shape_b_highlight
observe:
  - kind: extract
    from: baseline_highlight
    field: "(any field)"
    capture_as: baseline_status
  - kind: extract
    from: shape_a_highlight
    field: "(any field)"
    capture_as: shape_a_status
  - kind: extract
    from: shape_b_highlight
    field: "(any field)"
    capture_as: shape_b_status
assert:
  - "baseline_status != null  # baseline path works"
  - "shape_a_duration_ms < 4000  # if pg_sleep(5) injects, this fails (the injection succeeded). If escaped, baseline timing applies (typically < 500ms)"
  - "if (shape_a_duration_ms >= 4000) then FAIL 'TRUE SQL INJECTION CONFIRMED — pg_sleep was executed via the persisted query. Critical security defect at ReactiveDataEntityRepositoryImpl.java:798-806 — parameterise the ts_headline binding'"
  - "shape_b_highlight != null  # the quote-in-name should NOT crash the highlight pipeline; if it 500s, that's a DoS via maliciously-named entity"
  - "if (shape_b_status indicates 500) then FAIL 'DoS via maliciously-named entity: the text parameter to ts_headline is not escaped'"
