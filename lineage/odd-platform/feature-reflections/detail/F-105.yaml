  hypothesis: |-
    When a non-admin user reads the Management catalogs (the read-collaborative
    posture), this aligns with how comparable data-catalog platforms (DataHub,
    Amundsen, OpenMetadata) treat metadata-read access — i.e. metadata reads are
    conventionally open within an authenticated tenant.
