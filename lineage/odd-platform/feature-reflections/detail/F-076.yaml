    When an operator deletes an Owner / Namespace / DataSource that still has a
    live referent attached (a live ownership/term/user-mapping for Owner; a live
    datasource/collector/term/data-entity for Namespace; a live data-entity for
    DataSource), the platform blocks the delete with an error and does NOT
    remove the parent — protecting the referent from being orphaned.
  derivation: |-
    The cascade-block is the protective promise of the whole pattern; each
    service runs existence predicates and throws CascadeDeleteException before
    any soft-delete write.
