notes: |-
  This is a UI-architecture pattern recorded as its OWN concept because the
  convention is independently observable across 4 feature areas — naming it
  separately makes the next sidecar in OwnerAssociations / DEGLineage /
  DatasetStructure able to STRENGTHEN this concept without minting yet
  another duplicate. The full enumeration of all 4 feature areas would
  require strengthening this concept's `nodes:` and `contributors:` lists
  as those feature areas get enriched in future batches.

  The convention's primary purpose is feature-local state isolation;
  per-mount reset is a CONSEQUENCE (sometimes desired — sensitive selections
  shouldn't leak; sometimes undesired — operator's filter slice resets on
  navigate-away). The DataQuality feature partially mitigates the reset
  consequence by also writing filter state to the URL query string
  (DataQualityFilters.tsx:46-54) — a separate concept entry
  (`dashboard-filter-url-roundtrip-deep-link-with-replace-true`).
maintainer_curated: false
