mitigations_unimplemented:
- |-
  Add a `components.securitySchemes` block declaring (at minimum) the S2S
  `X-API-Key` apiKey scheme + the LOGIN_FORM session-cookie scheme +
  the OAUTH2 authorizationCode scheme. The four declarations are operator-
  facing — they describe what AUTH the server expects, not WHICH auth-mode
  is configured on a given deployment.
- |-
  Add per-operation `security:` declarations. For UI/API endpoints under
  `/api/**`, declare the relevant auth scheme(s) + (for RBAC-gated
  operations) an x-required-permission extension naming the SECURITY_RULES
  permission. This would make a build-time validator possible (compare
  spec's x-required-permission to SecurityConstants.SECURITY_RULES entries).
- |-
  Build-time validator: walk the OpenAPI spec's per-operation `security:`
  declarations; for each declaration, verify there exists a corresponding
  SECURITY_RULES entry with the same path pattern. Fails fast on
  REFACTOR-217-class drift (singular vs plural, mistyped permission name,
  missing rule entry).
- |-
  Doc-side: at the developer-guides/api-reference hub, add a 'Spec security
  is currently out-of-band' caveat naming the absent `securitySchemes` block
  AND naming where the auth model IS canonically documented
  (configuration-and-deployment/enable-security). Third-party API consumers
  reading the spec need this signpost.
severity: MEDIUM
