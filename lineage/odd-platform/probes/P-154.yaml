realism_caveats: |
  The probe pins three intertwined claims:

  (1) "createEnumValue" name promises CREATE; implementation is BULK-REPLACE.
      The arm3 assertion (partial body → 1 surviving row) confirms this from
      the operator's perspective.

  (2) Replay-safe-for-state but not for audit-trail: arm1+arm2 identical
      bodies churn row ids and emit 2 activity events. If the assertion
      `arm1_ids != arm2_ids` FAILS (ids identical), it would mean the
      repository preserves row identity on bulkCreate-after-softDelete,
      which contradicts the read of softDeleteExcept + bulkCreate at
      EnumValueServiceImpl.java:105-108 — re-read those lines.

  (3) Concurrent-write last-write-wins: race_4 sends A-set and B-set
      simultaneously; the assertion that exactly one set survives confirms
      the absence of optimistic locking or advisory lock at the
      `dataset_field_id` level. If BOTH sets survive (`len(live) == 10`)
      it means the platform DOES serialise concurrent writes — unlikely
      given the lack of `SERIALIZABLE` isolation declarations in the service
      code, but the probe is designed to discover that case rather than
      assume.

  The probe does NOT verify the EXTERNAL-origin enum-value path
  (EnumValueServiceImpl.java:51-82) — that needs an additional arrange step
  that creates external-origin rows via the ingestion-side, which is a
  separate probe.

  The probe assumes administrator-level auth (full permissions) so it
  isolates the BULK-REPLACE + CONCURRENT-WRITE semantics without confounding
  the test with the authorization wiring (covered separately by P-153).

  Per Rule 8 the probe runs entirely on the local Testcontainers + docker
  compose stack.
