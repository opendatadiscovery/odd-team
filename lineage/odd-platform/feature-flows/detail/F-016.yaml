  - facet: per-connected-component partitioning is the response shape (undocumented)
    observed: |-
      The response is `List<DataEntityLineageStream>` — one stream per
      starting-oddrn connected component (NOT one per DEG member). The
      partitioning at `establishDEGRelations` lines 200-216 tracks
      `participatedOddrns` so each connected component is emitted
      exactly once, anchored on the first DEG-member oddrn discovered
      in iteration order. A DEG with 3 disconnected sub-graphs produces
      3 streams; a DEG with 1 fully-connected member graph produces 1
      stream. The live API-reference says "Returns the lineage graph"
      (singular) — the actual shape is a LIST of streams. Operators
      may write client code assuming a single stream and silently
      truncate to the first.
    expected: |-
      Document the per-connected-component shape on the live
      API-reference page + the OpenAPI schema description.
    drift_class: per_component_partitioning_undocumented
    provenance: |-
