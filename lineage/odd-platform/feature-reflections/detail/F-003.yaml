# Popular entities ranking — product-owner reflection

## product_owner_narrative

The **Popular** surface is the platform's "what matters here right now" introduction — the column a returning user glances at on the catalog home page to re-enter the entities the wider team has been looking at. As a product owner I would pitch it as: *"when you land on the ODD home page, the Recommended panel shows you four quick-jump columns — your own objects, their upstream and downstream neighbours, and a catalog-wide **Popular** list of the entities everyone is viewing most"* (per `odd-platform__ts__react-component__component__PopularStrip.md` understanding + `system-mission.md` P-01 sub-feature seed "Recommended panel"). It serves the data-engineer / analyst / data-scientist audiences browsing after sign-in (per PopularStrip sidecar audiences).

A user interacts with it passively: it appears on home-page mount, fetches the top 5 entities once (`page=1, size=5`, hardcoded), and each tile is a link into that entity's detail page (per PopularStrip sidecar invariants + operations). There is no filter control, no sort toggle, no "view more", no per-column refresh — the four Recommended columns are rendered by a single symmetric `<DataEntityList>` component and Popular has no column-specific behaviour by design (per PopularStrip sidecar implicit_adrs[2]). The list is reached only when the signed-in user has an associated Owner AND the deployment auth mode is not `DISABLED` (per PopularStrip sidecar invariants "rendering gate" + Overview sidecar understanding).

The working part a product owner would describe is the ranking itself: **Popular ranks entities by cumulative view count, descending** — `cteConfig.orderBy(DATA_ENTITY.VIEW_COUNT.sort(SortOrder.DESC))` is the sole ranking signal, with `id DESC` as the only tiebreaker (per getPopular sidecar invariants[0] + repository line 633). The view count is incremented as a read-as-write side-effect of opening any entity's detail page (the F-001 producer half), so Popular is the consumer-side closure of the F-001 loop (per getPopular sidecar understanding + Overview sidecar downstream_side_effects). The CTE that builds the list excludes soft-deleted and hollow entities — but, unlike the nine other list-shape surfaces that share helper code, it does **not** exclude entities flagged `exclude_from_search=true` (per getPopular sidecar invariants[3] + feature-flow facet "EXCLUDE_FROM_SEARCH wider inconsistency surface").

The integration story: Popular sits inside Data Discovery (P-01) and depends on the F-001 view_count tracking feature for its signal; it shares the read-collaborative posture of the whole catalog (every authenticated caller sees the same catalog-wide ranking, no owner scoping) and is anonymously reachable at the API layer under `auth.type=DISABLED` even though the home-page UI hides the panel in that mode (per Overview sidecar + getPopular sidecar security). The cross-pillar relationship that bites is with P-09 Security: the home-page panel's visibility is gated by a raw-string `auth.type` comparison in the SPA that compounds with an unvalidated backend `@Value` to produce surprising visibility on misconfigured deployments (per Overview sidecar understanding + invariants + bugs_limitations_corner_cases[0]).

The edge cases a product owner should flag in a demo: on a fresh deployment with no traffic, every entity has `view_count=0` and the "Popular" list degenerates to "newest entities first" via the id-DESC tiebreaker — the demo shows recently-ingested rows, not genuinely popular ones (per getPopular sidecar bugs_limitations_corner_cases[6]). And the ranking is trivially gameable: any caller can script detail-reads to pump any entity (including a deceptively-named one) to the top, +2 per page-open because of the LSN-017 double-fetch (per getPopular sidecar bugs_limitations_corner_cases[0] + Overview sidecar downstream_side_effects line 108 + tracked issue PLT-104).

