status: ui-incomplete
ui_incomplete_reason: |-
  UI surface of OAuth admin-detection: the SPA reads identity.permissions
  via WithPermissionsProvider; admin/USER distinction surfaces only via
  the resulting permission set. No UI component reflects the per-provider
  configuration. Backend chain is complete; UI consumption is via
  /api/identity/whoami → identity.permissions (covered by F-011 batch Q
  AppToolbar sidecar). The drift facets here are ALL backend-only — no
  UI-layer claim is made.
