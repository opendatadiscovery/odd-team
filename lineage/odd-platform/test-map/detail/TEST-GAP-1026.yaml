  - 'SchedulingConfiguration.md says (performance.known_performance_gaps.[1]): ''The operator''s mental model "I have four scheduled jobs, they run in parallel" is wrong by default. A 14-minute housekeeping cycle delays the 10-minute status-switch job — over a sustained heavy backlog, the status-switch cadence drifts from 10min to 24min or worse. The mitigation (spring.task.scheduling.pool.size: 4) is a one-line config change that is not documented anywhere.'''
