behaviour: |-
  **admin-groups silently NO-OP for Google — operator's intended ADMIN-by-group never activates.** The `ODDOAuth2Properties.OAuth2Provider.adminGroups : Set<String>` field (line 49) BINDS successfully from `auth.oauth2.client.google.admin-groups: [workspace-admins]` YAML. `GoogleUserHandler.java:1-74` NEVER reads `provider.getAdminGroups()` — the value is silently ignored at every login (compare AbstractOIDCUserHandler.java:44-55 which DOES read `getAdminGroups()`; CognitoUserHandler / AzureUserHandler extend the abstract base, Google does not). An operator copying the Cognito/GitHub admin-groups pattern to Google gets ZERO behaviour change AND ZERO warning at boot — every user remains USER role regardless of group membership. Security-policy gap: the intended group-based ADMIN never activates. Combined with no `admin-principals` configured = no admins at all. Live docs WebFetched 2026-05-19 status 200 confirm `admin-groups` documented for AWS Cognito and GitHub only — silence-confirms-silence in the docs is internally consistent BUT the field bind succeeds, which is the operator-hostility trap.
