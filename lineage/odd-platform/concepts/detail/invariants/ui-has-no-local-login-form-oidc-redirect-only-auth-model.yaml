name: UI has NO local login form (OIDC-redirect-only / framework-rendered LOGIN_FORM auth model)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  **NEW HIGH-severity INVARIANT, batch 2026-05-20-Q (AppToolbar primary
  source)**. There is NO React component anywhere in `odd-platform-ui/src`
  that renders a username/password form. Verified by Grep for
  `login|Login` across `odd-platform-ui/src` returning ZERO matches.
  The four `auth.type` modes render their login UI as follows:

    - `DISABLED` — no login surface; the SPA mounts and the backend
      permits all exchanges (DisabledAuthSecurityConfiguration.java:13-18).

    - `LOGIN_FORM` — Spring Security's FRAMEWORK-DEFAULT login form
      rendered server-side, NOT application-authored React
      (LoginFormSecurityConfiguration.java:58 wires
      `formLogin(formLoginSpec -> formLoginSpec.authenticationSuccessHandler(authHandler))`
      — no custom `loginPage()` reroute).

    - `LDAP` — Spring Security's FRAMEWORK-DEFAULT login form
      rendered server-side (LDAPSecurityConfiguration.java:147 wires
      `formLogin(Customizer.withDefaults())` — no custom login page).

    - `OAUTH2` — redirects the browser to the IdP's hosted login page;
      no SPA-side login UI involved.

  **The single user-facing auth affordance in the SPA is `AppToolbar`**
  (AppToolbar.tsx:1-123) — it shows the authenticated-user identifier
  + the logout button. There is no Login button, no sign-in form, no
  pre-auth landing page. The auth model is "the backend serves either
  a framework login form, an OIDC redirect, or no challenge — never an
  application-authored login UI".

  **Operator-facing implication**: every operator interaction with login
  style (branding, password requirements, error messages, MFA prompts)
  is governed by the backend's `auth.type` knob + the IdP's hosted
  pages, NOT by SPA code. A maintainer wishing to customise the login
  experience needs to:
    (a) for OAUTH2 — customise the IdP's hosted login page (out-of-band);
    (b) for LOGIN_FORM / LDAP — author a custom `loginPage()` chain
      via Spring Security configuration, then author the matching React
      page (currently does not exist);
    (c) for DISABLED — N/A (dev-only mode per docs).

  **Cross-batch coherence (LSN-018)**: This invariant is the ABSENCE
  evidence underlying the AppToolbar sidecar's substitution_note
  finding — the phantom `LoginForm` React component does NOT exist.
  Future scanners should record the absence, not re-discover the
  phantom.

  **Doc-side gap**: the live `/configuration-and-deployment/enable-security/authentication`
  page does not record this — operators reading the auth-mode docs
  may reasonably expect an application-rendered login form (most
  modern SaaS products provide one). The framework-default form
  carries Spring Security's generic CSS, with no ODD branding.
