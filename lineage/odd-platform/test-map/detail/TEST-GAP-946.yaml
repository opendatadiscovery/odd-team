behaviour: |-
  **CRITICAL HTTP-ENTRY-POINT REGRESSION-PIN — SearchController.highlightDataEntity
  is the operator-visible HTTP entry that drives the TRUE SQL-injection vector at
  ReactiveDataEntityRepositoryImpl.java:798-806 (`.formatted(text, tsQuery)` raw
  string-interpolation into ts_headline SQL).** STRENGTHENS TEST-GAP-316 (the
  repository-level finding) by adding the FULL request-shape attack chain:

  (1) attacker calls POST /api/search with a body whose
  `SearchFormData.query` field contains a crafted payload [exploit payload
  withheld from this public workspace - private advisory GHSA-rjp9-9vgm-q94c] — the platform persists this verbatim into
  `search_facets.query_string` (SearchServiceImpl.java:74-82); no validation
  at controller, service, or repository layer;

  (2) attacker (OR ANY OTHER AUTHENTICATED USER WHO SEES THE searchId UUID)
  calls GET /api/search/{searchId}/data_entities/{data_entity_id}/highlights
  (SearchController.java:85-91); SearchController has no @PreAuthorize, the
  searchId is a bearer-token UUID with no owner_id binding (cross-link
  TEST-GAP-252), and any catalog data_entity_id is reachable;

  (3) DataEntityHighlightServiceImpl.java:36 zips (session-state read, data
  entity searchable string, latest dataset version) into a single Mono that
  calls getHighlightedResult(text, queryString) at line 44;

  (4) ReactiveDataEntityRepositoryImpl.java:798-806 builds the SQL via
  `String.formatted(text, tsQuery)` — both arguments interpolated raw into
  ts_headline('english', '%s', to_tsquery('%s'), ...). The persisted
  query_string from step (1) reaches `to_tsquery('%s')` directly; the
  closing-quote terminator + arbitrary-SQL injection payload runs on the
  read connection.

  TEST-GAP-316 frames the gap at the repository layer — useful for unit
  testing the SQL builder but blind to the FULL chain. This gap is the HTTP
  contract regression-pin: a future maintainer reviewing
  SearchController.highlightDataEntity in isolation would not see the
  repository-level SQL site; the chain only surfaces when the test drives
  the request through the controller. THIS test fails today (production
  vulnerability) and SHOULD fail forever (regression-pin) until the
  String.formatted call is replaced by jOOQ parameterised binding per
  TEST-GAP-316.proposed_action.
