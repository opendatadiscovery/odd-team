evidence:
- |-
  DataQualityController.md:concepts.entities.[DataQualityTestSeverity] + .[DataQualityTestSeverityForm]
- |-
  DataQualityController.md:concepts.invariants.[4] (severity defaults to MAJOR when
  no explicit severity exists for a (test, dataset) pair)
- |-
  DataQualityController.md:bugs_limitations_corner_cases.[6] (default-MAJOR fallback
  silently inflates SLA Red/Yellow outcomes)
- |-
  DataQualityController.md:bugs_limitations_corner_cases.[4] (audit-trail absence
  on severity changes — onDuplicateKeyUpdate idempotent but no ActivityEvent emission)
security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      The lone gate at SecurityConstants.java:243-246 — `new SecurityRule(DATA_ENTITY,
      PathPattern '/api/datasets/{data_entity_id}/dataqatests/{dataqa_test_id}/severity'
      PUT, DATASET_TEST_RUN_SET_SEVERITY)`. Owner-scoped via DATA_ENTITY
      AuthorizationManagerType (caller must be associated with one of the dataset's
      owners). The registration is the intent_anchor — a maintainer made the
      deliberate decision to add ONE rule (the PUT) and not five.
  owner_scoping:
    verdict: RESPECTS
    detail: |-
      DATA_ENTITY AuthorizationManagerType resolves the caller's ownership chain
      against the dataset; only owners (or admin) can set severity. This is the
      MUTATING half of the asymmetrical owner-scoping pattern (reads cross-owner,
      mutations owner-scoped).
  strengths:
  - |-
    The PUT is gated via the centralised SecurityRule table — explicit, reviewable,
    not method-level annotation. Owner-scoping is enforced.
  - |-
    setDataQATestSeverity is @ReactiveTransactional — existence check (existsIncludingSoftDeleted)
    and upsert run in a single reactive transaction (DataQualityServiceImpl.java:63-81)
  weaknesses:
  - |-
    onDuplicateKeyUpdate at ReactiveDataQualityRepositoryImpl.java:90-101 — repeated
    PUTs converge on the same row but NO ActivityEvent emission, NO audit log, NO
    last_modified_by, NO version increment. A maintainer auditing 'who set this
    severity to Critical?' has no answer (audit-log presence asymmetry instantiated
    on the DQ surface) — severity MEDIUM
  - |-
    Default-MAJOR fallback is silent — the SLA an operator sees is computed AS IF
    every unset test were Major. Correctness depends on operator awareness of the
    default; UI signals nothing about provenance (operator-set vs default).
  - |-
    Under auth.type=DISABLED the rule is bypassed; anonymous PUT is accepted.
  cross_file_inconsistencies: []
  contributing_files:
  - DataQualityController.md
  evidence:
  - DataQualityController.md:bugs_limitations_corner_cases.[4]
  - DataQualityController.md:bugs_limitations_corner_cases.[6]
performance_aggregate:
  overall: HIGH
  hot_paths: []
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Single (test, dataset, severity) tuple per PUT. No bulk variant — an operator
      setting severities for 50 tests issues 50 PUTs.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless. Upsert via onDuplicateKeyUpdate — single SQL statement, no advisory
      lock, no row-level lock beyond Postgres's implicit unique-constraint check.
      Concurrent PUTs to the same (test, dataset) converge on whichever wins the
      upsert.
  strengths:
  - |-
    Single SQL statement per mutation; deterministic latency
  weaknesses:
  - |-
    No batch endpoint — bulk severity updates are N round-trips
  cross_file_inconsistencies: []
  contributing_files:
  - DataQualityController.md
  evidence: []
notes: |-
  Default-MAJOR fallback is a silent correctness concern. Recommended remediation
  has TWO options: (a) surface 'unset' as a distinct UI state so operators distinguish
  default-MAJOR contributions from operator-set MAJOR, OR (b) change the fallback to
  MINOR (cautious) instead of MAJOR (the current load-bearing assumption inflates
  Yellow/Red outcomes). Either change requires SLA-test re-baseline and a doc update
  on sla-statuses.md.
