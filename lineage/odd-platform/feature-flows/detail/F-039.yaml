batch_extensions:
- batch: ZK
  entry_point_added: |-
    config-properties-class:GenAIProperties (org.opendatadiscovery.oddplatform.config.properties
    path) — the config-tier PRIMARY-SOURCE for the `genai.*` namespace
    (`enabled` + `url` + `requestTimeout`). F-039 batch-ZG cited
    GenAIProperties via the GenAIController sidecar's
    dependencies_semantic references but did not enrich the props
    record as primary-source. Batch ZK closes the config tier by
    promoting the GenAIProperties sidecar to a contributing node
    with its own primary-source evidence chain (the LSN-002-class
    silent-misconfiguration shape is now anchored at the field-declaration
    tier, not just the controller-side observation tier).
  contributing_nodes_added:
  - odd-platform java org.opendatadiscovery.oddplatform.config.properties config-properties-class:GenAIProperties
  notes: |-
    THREE primary-source confirmations + ONE new drift facet surface
    at the config tier, all anchored at GenAIProperties.java:1-13 +
    application.yml:17-20 + WebClientConfiguration.java:14-31:

    (1) **LSN-002 SILENT-MISCONFIGURATION CONFIRMED AT THE
    FIELD-DECLARATION TIER (STRENGTHENS F-039 batch-ZG
    `silent_misconfiguration_zero_timeout_default_immediate_failure`)** —
    GenAIProperties.java:8-12 declares `boolean enabled` (line 9),
    `String url` (line 10), `int requestTimeout` (line 11). The two
    UNSAFE-WHEN-ENABLED defaults are PROVABLE FROM THE FIELD
    DECLARATIONS: `String url` with no `=` initializer defaults to
    Java's `null`; `int requestTimeout` with no `=` initializer
    defaults to Java's `0`. The `application.yml:19-20` "examples"
    are COMMENTED OUT (`# url: http://localhost:5000`,
    `# request_timeout: 5`) — they are NOT YAML defaults, they are
    operator-hints. The `application.yml:18` `enabled: false` IS a
    real YAML default for the boolean. The LSN-002 silent-misconfiguration
    surface is therefore: enable the feature without explicitly
    setting `url` + `request_timeout` and the WebClient is built
    with `baseUrl(null)` + `Duration.ofMinutes(0)` — both legal at
    bean-construction time, both fatal on the first request.
    F-039 batch-ZG observed this from the controller-side
    error-path angle; this batch confirms from the
    field-declaration-side angle (the LSN-002 shape is structurally
    provable from the props record itself). STRENGTHENS F-039 batch-ZG
    drift facet via primary-source at the config tier.

    (2) **NO `@Validated`, NO `@NotBlank`, NO `@URL`, NO `@Min(1)`,
    NO `@PostConstruct validate()` (STRENGTHENS F-039 batch-ZG
    `silent_misconfiguration_zero_timeout_default_immediate_failure`
    + `genai_url_no_scheme_allowlist_ssrf_surface`)** —
    GenAIProperties.java:1-12 carries ONLY `@ConfigurationProperties`
    + `@Data`. No `@Validated` annotation, no `jakarta.validation.constraints.*`
    annotations on any field, no `@PostConstruct validate()` (contrast:
    the SIBLING ODDLDAPProperties class — also enriched this batch
    under F-006 + F-011 — DOES carry `@PostConstruct validate()` for
    URL + search-method invariants; the inconsistency is real). An
    operator-supplied `genai.request_timeout: -5` (typo, intentional)
    silently binds and is consumed as `Duration.ofMinutes(-5)`
    (Reactor Netty's behaviour on negative duration is undefined —
    documented Duration semantics say negative durations subtract,
    so `responseTimeout(-5min)` is equivalent to immediate
    timeout). No fail-fast at boot. The `genai.url` field is
    similarly unvalidated — `javascript:`, `data:`, `file:`,
    `vbscript:`, malformed strings all bind. STRENGTHENS BOTH the
    timeout-default and the SSRF-surface facets via the
    field-declaration-tier primary source.

    (3) **NO `apiKey` / `token` / `authorization` FIELD ON THE
    PROPS RECORD — NO EXTENSION POINT TODAY (STRENGTHENS F-039
    batch-ZG cross-pillar relationship to P-09 (Security))** —
    GenAIProperties.java:8-12 declares EXACTLY three fields. There
    is no `apiKey`, no `token`, no `authorization`, no `defaultHeaders`,
    no `clientCertPath`. The downstream WebClient builder at
    WebClientConfiguration.java:26-29 carries NO
    `defaultHeader(HttpHeaders.AUTHORIZATION, ...)`, NO
    `ExchangeFilterFunction` for auth. F-039 batch-ZG observed
    "the platform sends no authentication to the external service";
    this batch confirms the absence is structural at the
    field-declaration tier (not just an oversight on the WebClient
    builder). Operators deploying the feature MUST front the
    external service with their own auth proxy or rely on
    network-layer controls; the platform has no extension point for
    bearer-token auth without code changes to add a field. NEW
    drift facet for F-039:
    `genai_properties_no_auth_field_no_extension_point_for_external_service_credentials_platform_change_required`.

    (4) **STARTUP-BAKED `url` + `requestTimeout` — CONFIG CHANGES
    REQUIRE RESTART (STRENGTHENS F-039 batch-ZG
    `live_doc_acknowledges_no_authentication_no_retry_but_silent_on_no_authorization_no_rate_limit_no_audit_no_pii_redaction`)** —
    GenAIProperties.java:9-11 + WebClientConfiguration.java:20-30
    together encode: `enabled` is re-read on every request (the
    request-time gate at GenAIServiceImpl.java:37); `url` and
    `requestTimeout` are baked into the `genAiWebClient` `@Bean`
    at construction time and CANNOT be changed without a Platform
    restart. The live config page documents the three keys
    individually but does NOT call out the asymmetry. Operators
    tuning timeout in response to an LLM-vendor's intermittent
    slow-response pattern must restart Platform to apply changes
    — a discoverability gap because the docs make the three keys
    look symmetric. STRENGTHENS F-039 batch-ZG doc-silence facet
    with the startup-baked-config sub-finding.

    Coherence sweep STRENGTHENS=4 (F-039 batch-ZG
    `silent_misconfiguration_zero_timeout_default_immediate_failure`
    — re-confirmed at field-declaration tier; F-039 batch-ZG
    `genai_url_no_scheme_allowlist_ssrf_surface` — re-confirmed at
    field-declaration tier; F-039 batch-ZG cross-pillar
    `shares_data_with P-09` — extended with structural absence
    of extension-point for credentials; F-039 batch-ZG
    `live_doc_acknowledges_no_authentication_no_retry_but_silent_on_no_authorization_no_rate_limit_no_audit_no_pii_redaction`
    — extended with the startup-baked-config restart-required
    asymmetry). SUPERSEDES=0. CONFLICTS=0. The new drift facet
    (genai_properties_no_auth_field) is a STRUCTURAL extension
    of the existing platform-to-EXTERNAL no-authentication finding;
    not a duplicate.
