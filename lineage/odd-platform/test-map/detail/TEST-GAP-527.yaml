behaviour: |-
  getByNameAndNamespace (batch) — empty input returns Mono.just(List.of()) without DB round-trip (lines 163-165); non-empty input builds OR-chain with case-insensitive predicates; 10K-element input does not exceed Postgres parameter limit. This batch method is the heart of TermServiceImpl.findTermsInDescription (line 350) — the regex-parsed `[[ns:term]]` mention resolution. A regression that removed the empty short-circuit would issue an INSERT-with-zero-rows runtime SQL error on every description edit with no mentions. A regression that disabled case-insensitive matching would silently fail to resolve description-mention links typed with different casing than the DB row, causing the term-linkage UI to display "unresolved mentions" for legitimate references.
