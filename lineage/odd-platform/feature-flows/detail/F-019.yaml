cross_pillar_relationships:
- pillar_id: P-09
  kind: feeds
  via: |-
    Owner Lifecycle mutations are the operative authorization mutations
    governed by the Security pillar's RBAC model (F-006). The 3 Owner
    CRUD permissions (OWNER_CREATE / OWNER_UPDATE / OWNER_DELETE) +
    OWNER_RELATION_MANAGE are defined in SecurityConstants.SECURITY_RULES
    and consumed by the centralised authorization pipeline. Cross-link
    to F-006's RBAC family.
- pillar_id: P-09
  kind: feeds
  via: |-
    The destruction verb (DELETE /api/owners/{id}) hard-deletes
    owner_to_role rows — closing the orphan-binding pattern on the
    Owner side that F-006 surfaces on the Policy/Role side. The Owner
    side is the POSITIVE case-law contrast (orphan-binding closure
    DONE CORRECTLY) to F-006's permission_persistence_after_soft_delete
    drift on the Policy/Role half.
- pillar_id: P-09
  kind: feeds
  via: |-
