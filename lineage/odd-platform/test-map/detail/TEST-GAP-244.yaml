proposed_action: Add a test that boots under `auth.type=LOGIN_FORM`, authenticates
  a non-admin user (LOGIN_FORM has no real non-admin distinction — every user is ADMIN
  by hard-coding), then calls GET /api/resource/DATA_ENTITY/{id}/permissions; asserts
  the response contains the full permission set including `DATA_ENTITY_OWNERSHIP_UPDATE`,
  `DATA_ENTITY_ADD_TERM`, etc. Locks the LOGIN_FORM admin-for-all posture against
  silent regression.
