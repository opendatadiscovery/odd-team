name: SPA AppToolbar (primary auth-affordance surface)
canonical_in_docs: false
canonical_candidate: true
description: |-
  The persistent top-of-viewport fixed-position bar rendered on every
  authenticated route by the SPA shell (mounted unconditionally at
  `App.tsx:56` ahead of the `<Routes>` block). Three responsibilities:

    1. **Brand / logo + product name + home link** — left-side identity.

    2. **`<ToolbarTabs>` — the nine top-level navigation tabs**
       (Catalog / Directory / Data Quality / Data Modelling / Master
       Data / Management / Dictionary / Alerts / Activity). Rendered
       UNCONDITIONALLY regardless of permission set (per the
       `management-tab-visible-to-all-authenticated-users-unpermissioned-tab-visibility`
       invariant). Operators with zero Management permissions still
       see the Management tab.

    3. **Right-side actions cluster**:
       - `<AppInfoMenu>` — external-links menu (docs / GitHub / Slack
         / version / feedback / custom links via `odd.links[]`).
       - Clickable user-identifier label (renders
         `owner?.name ?? identity?.username` per AppToolbar.tsx:74 —
         the SPA's primary identity-rendering surface).
       - Popup menu containing `<SelectLanguage>` (i18n switcher) +
         `Logout` item that performs an unconditional client-side
         navigation to `/logout` (`window.location.href = '/logout'`).

  **Why this is the primary auth-affordance surface**: in the
  platform's OIDC-redirect-only auth model (per the
  `ui-has-no-local-login-form` invariant — no React component renders
  a username/password form anywhere in `odd-platform-ui/src`),
  AppToolbar IS the SPA's primary auth UI surface. It tells the
  operator:
    - **Who they are signed in as** (the identifier label).
    - **How to sign out** (the Logout item — defers to backend
      handler chain per `logout-side-token-revocation-asymmetric-defence-in-depth`).

  No Sign-in UI exists in this SPA — when the user is logged out,
  the framework default login form (LOGIN_FORM / LDAP) or the IdP
  redirect (OAUTH2) handles re-authentication.

  **Cross-component identity-render convention**: the
  `owner?.name ?? identity?.username` precedence at line 74 is
  REPEATED across 5 OTHER components (ActivityItem.tsx:184,
  ActivityItem.tsx:77, DataEntityAlertItem.tsx:60, AlertItem.tsx:86,
  ActiveAssociationRequest.tsx:65-67). The 6-location consistency is
  intentional — catalog identity preferred for human-readability,
  auth-provider username as fallback for users with no user-owner
  mapping.

  **Cross-batch coherence (LSN-018)**: this entity records the
  ARCHITECTURAL POSITION of the AppToolbar in the SPA — the single
  user-facing auth surface that ties together (a) the
  ui-has-no-local-login-form invariant (no Login UI exists), (b)
  the identity-wire-has-no-provider-field positive (no provider
  string rendered), (c) the management-tab-visible-to-all invariant
  (read-collaborative posture surfaced as tab visibility), and (d)
  the logout-side-token-revocation-asymmetric-defence-in-depth
  invariant (the Logout button defers entirely to backend handlers).
