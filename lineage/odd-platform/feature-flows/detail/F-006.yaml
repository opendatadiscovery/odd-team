terminal_side_effect:
  side_effect_class: db-write
  description: UPDATE policy SET deleted_at = NOW() ON DELETE — soft-delete that silently retains permission-granting capability
    via the orphan role_to_policy edges + the unfiltered getRolesPolicies JOIN
  evidence: ReactivePolicyRepositoryImpl.java:19 (extends ReactiveAbstractSoftDeleteCRUDRepository) + ReactiveAbstractSoftDeleteCRUDRepository.java:50-59
    (soft-delete UPDATE) + ReactivePolicyRepositoryImpl.java:32-35 (getRolesPolicies JOIN without deleted_at filter on policy
    side). The terminal effect is the soft-delete UPDATE; the SECURITY-RELEVANT consequence is that subsequent getRolesPolicies
    reads still surface the deleted policy as long as role_to_policy edges exist.
  cardinality_per_call: 1
amplification_factor: 1
amplification_factor_provenance: 'STATIC — confirmed from primary source. No active probe yet for this feature. The amplification
  factor of 1 reflects per-request authorization resolution: one DELETE-policy call produces one UPDATE, but the soft-deleted
  policy continues to influence permission resolution on EVERY subsequent authorized request (N requests after the delete)
  because getRolesPolicies has no deleted_at filter. The structural ''amplification'' is the silent-permission-grant persistence,
  not a per-request mathematical product.'
observed_vs_expected:
  facets:
  - facet: soft-deleted policy continues to grant permissions
    observed: 'getRolesPolicies(roleIds) returns soft-deleted policies via the unfiltered JOIN — if any role_to_policy edge
      survives the policy''s soft-delete, the policy''s statements continue to grant permissions to every user holding that
      role on every authorized request. PolicyServiceImpl.delete blocks the normal soft-delete path via CascadeDeleteException
      when isPolicyAttachedToRole returns true, but: (a) a direct DB UPDATE setting deleted_at bypasses the defence; (b) a
      future refactor weakening the cascade check re-opens the gap.'
    expected: A soft-deleted policy should NOT grant permissions. The repository-layer defence is to add `AND policy.deleted_at
      IS NULL` to the JOIN at line 32-35.
    drift_class: soft_delete_aware_visibility_inconsistency
    provenance: STATIC — primary-source verification in batch-H ReactivePolicyRepositoryImpl sidecar known_security_gaps[0]
      + bugs_limitations_corner_cases[0]. Proposed Type-7 probe — seed a policy + bind to role + soft-delete via direct DB
      UPDATE + assert getRolesPolicies still returns the policy + assert hasManagementPermission still returns true (local
      docker-compose probe stack).
  - facet: Administrator policy name asymmetry compound risk (cross-batch finding)
    observed: 'Batch-E surfaced PolicyServiceImpl.update / .delete reject `Administrator` by name (lines 76, 87) but create
      (lines 62-69) does NOT. Batch-H confirms: the repository layer enforces policy_name_unique WHERE deleted_at IS NULL
      — the partial unique index frees the name on soft-delete. If the seeded Administrator row is ever soft-deleted by any
      path (today no service-layer path does so because of the rejection; a direct DB UPDATE setting deleted_at on the Administrator
      row could), the name is freed AND PolicyServiceImpl.create has no name-protection — a new policy named `Administrator`
      with attacker-chosen statements could be created. The repository''s soft-delete-aware uniqueness design is correct in
      isolation; the gap is the missing service-layer create-time name check.'
    expected: Symmetric name protection across create/update/delete OR a non-soft-deletable seeded-row mechanism (e.g. immutable
      flag on the policy row)
    drift_class: cross_phase_protection_asymmetry
    provenance: STATIC — primary-source verification in batch-H ReactivePolicyRepositoryImpl sidecar known_security_gaps[2]
      + batch-E sibling sidecar known_findings on Administrator-name asymmetry
  - facet: RBAC mutations are forensically silent
    observed: ZERO log.info / log.warn / audit-table-write on policy create/update/delete at the repository, service, AND
      controller layers (batch-E + batch-H consistent finding). A security incident reviewer reconstructing 'who created/modified/deleted
      the MANAGEMENT/ALL policy on date X' has zero in-application records. The only log line is `log.error("Database exception",
      e)` in ExceptionUtils.translateDatabaseException on non-uniqueness DB errors.
    expected: At minimum, INFO-level structured log on every policy mutation with principal, target id, name, action. Ideally,
