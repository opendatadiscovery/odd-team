security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      No SecurityRule entry for /api/dataentitygroups/{id}/lineage (verified
      Grep dataentitygroups.*lineage in SecurityConstants.java returns zero
      matches). Falls through to pathMatchers("/**").authenticated() at
      AuthorizationCustomizer.java:29-30. No @PreAuthorize, no @Secured, no
      programmatic permissionService.hasPermission call. Crucially the
      WRITE side IS gated (DATA_ENTITY_ADD_TO_GROUP /
      DATA_ENTITY_DELETE_FROM_GROUP at SecurityConstants.java:228-236) —
      the read-vs-write asymmetry is the load-bearing finding.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The returned DEG-lineage graph is not filtered by the caller owner
      relationships at any layer. LineageServiceImpl has no AuthIdentityProvider
      field (verified by reading LineageServiceImpl.java:54-57). The DEG ID
      itself becomes the anchor; visibility of the DEG implies visibility of
      its full member-graph + reachable edges + per-member metadata.
  strengths:
    - |-
      WRITE side IS RBAC-gated (DATA_ENTITY_ADD_TO_GROUP /
      DATA_ENTITY_DELETE_FROM_GROUP) — the asymmetry is INTENTIONAL
      consistent with the read-collaborative posture
    - |-
      Inner-DEG suppression is bounded — only the IMMEDIATE inter-member
      edge graph is exposed; nested DEG structure does not surface
  weaknesses:
    - |-
      Anchor-set defence-in-depth NOT applied at the service tier — the
      service has no AuthIdentityProvider field; cross-owner read is
      unmitigated (HIGH severity)
    - |-
      Graph-shaped CO-MEMBERSHIP leakage — for a multi-team DEG / Domain,
      the per-connected-component partitioning surfaces "team A and team B
      both contribute to the Finance DEG" (HIGH severity — wider blast
      than per-entity REFACTOR-203 because the DEG itself is a conceptual
      grouping)
    - |-
      404 conflates three semantically distinct conditions — DEG-not-found
      vs DEG-has-no-members vs non-DEG-typed-ID (MEDIUM severity —
      operator-debuggability gap)
    - |-
      Inner-DEG suppression is comment-marked deferred-feature with no
      backlog / ADR / @Disabled regression test anchor (MEDIUM severity —
      lift-time regression vector)
    - |-
      DEG-lineage reads are UNAUDITED — no Activity-Feed event; an operator
      asking "who read this Finance DEG lineage last quarter?" has no
      source-of-truth (LOW severity)
  cross_file_inconsistencies:
    - |-
      Live /features/data-lineage feature page (200, 2026-05-19) names the
      Group lineage entry point but is silent on the cross-owner-readable
      posture AND on the inner-DEG suppression carve-out — operators
      reading the doc have no signal that nested DEGs are silently
      flattened
    - |-
      Live /developer-guides/api-reference/lineage page (200, 2026-05-19)
      documents the endpoint verbatim with operationId but does not surface
      permissions, owner-scoping, the inner-DEG suppression, or the
      empty-DEG vs DEG-not-found error shape
    - |-
      WRITE-side endpoints (addDataEntityDataEntityGroup +
      deleteDataEntityFromDataEntityGroup per batch L) carry SecurityRule
      entries; the matching READ-side endpoint does NOT — operators
      auditing the SecurityConstants catalogue see RBAC protection on the
      WRITE half and reasonably assume the READ half is similarly gated
  contributing_files:
    - getDataEntityGroupsLineage.md
    - LineageServiceImpl.md
    - addDataEntityDataEntityGroup.md
    - deleteDataEntityFromDataEntityGroup.md
  evidence:
    - getDataEntityGroupsLineage.md:security.* (full block)
    - LineageServiceImpl.md:security.known_security_gaps.[0,1]
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Three DB round-trips per call — (a) getDEGEntitiesOddrns recursive CTE
      on group_entity_relations, (b) getLineageRelations(List<String>)
      SELECT-DISTINCT on lineage, (c) getDataEntitiesWithDataSourceAndNamespace
      for per-member metadata — fully sequential at the service layer
    - |-
      In-memory partitioning via establishDEGRelations (BFS-shaped
      recursion) — cost scales with DEG-member-graph size, not pagination
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One DEG ID per request; no batch endpoint, no streaming variant. The
      response is fully assembled in heap before serialisation.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      No lineage_depth parameter, no expanded_entity_ids, no
      pagination — the response shape is bounded by the DEG member
      cardinality + the inter-member edge count; for a Domain spanning
      hundreds of entities the response can be large.
  strengths:
    - |-
      SQL-layer recursive CTE walks nested DEGs in ONE round-trip — single
      RTT for unbounded-depth member resolution
    - |-
      Simpler edge query (List<String>-based) avoids the recursive-CTE
      cost of the per-entity lineage path — bounded by DEG size, not by
      graph reachability
    - |-
      Stateless controller scales horizontally
  weaknesses:
    - |-
      JVM-stack recursion in getRelationsForEntities — tail-shaped but no
      TCO in Java; very-wide connected components approach default JVM
      stack limit (~5000 frames) for DEG diameter > ~5000 (LOW severity)
    - |-
      Full-graph in-memory materialisation — no streaming, no pagination
      (MEDIUM)
    - |-
      No statement_timeout enforcement at repository layer (MEDIUM)
    - |-
      Hard-delete race window — entity hard-deleted between
      getDEGEntitiesOddrns and getDataEntityWithDatasourceMap surfaces as
      generic 500 (LOW)
  cross_file_inconsistencies: []
  contributing_files:
    - getDataEntityGroupsLineage.md
  evidence:
    - getDataEntityGroupsLineage.md:performance.* (full block)
notes: |-
  This entity is the DEG-anchored sibling of the broader lineage-graph-traversal
  concept; the per-entity Lineage tab and the DEG Lineage tab are sibling UI
  surfaces over the same underlying lineage table but with materially different
  query shapes, parameter sets, and security postures.

  Cross-references:
    - Lineage Graph Traversal (entity) — the broader concept; this entity is
      the DEG-anchored variant.
    - Get data entity group lineage (operation) — the operation primitive
      this entity is the response shape for.
    - Inner-DEG suppression — comment-marked deferred feature (invariant) —
      one carve-out within this entity's response semantics.
    - DEG-membership read vs write authorization asymmetry — the
      authorization-asymmetry finding that this entity is the primary
      surface for.
    - REFACTOR-225 anchor-set single-point-of-failure — adjacent finding;
      this entity is the WIDEST blast (no anchor-set at all, not just
      single-point-of-failure).
    - Read-collaborative cross-owner enumeration — this entity is the
      SEVENTEENTH read-collaborative surface.
