  hypothesis: "When an author opens the dialog expecting the three fields the documentation describes (a Name, a Description, and the Query body), they find a field to name the snippet."
  derivation: "doc-claim seed — the live doc still describes snippets as having 'a name, description, and the query body' (WebFetch 2026-06-03); the form has only definition + query (QueryExampleForm.tsx:79-113)."
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      The form has exactly TWO fields — "Definition" (a plain Input) and "Query" (the Markdown
      editor) — and NO "Name" field (QueryExampleForm.tsx:79-113). The DB schema and OpenAPI carry
      only `definition` + `query` (no `name` column, controller sidecar `docs_link_semantic.doc_drift_findings.[0]`).
      The live doc's "name, description, and the query body" framing is therefore still partly
      fiction: what the doc calls "description" is the `definition` field, and the "name" does not
      exist — the snippet is identified only by its integer id ("Query Example #{id}"). The author
      cannot name a snippet. This is the same residual doc drift recorded on F-025 H-011; F-131
      corroborates it from the authoring screen.
    evidence:
      - sidecar: "(source_read_for_validation) QueryExampleForm.tsx"
        section: formContent
        cite: "QueryExampleForm.tsx:79-113"
        note: "exactly two fields: Definition (Input) + Query (Markdown editor); no Name field"
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController.md
        section: "docs_link_semantic.doc_drift_findings.[0]"
        cite: "V0_0_84__create_query_example.sql:4-5 + components.yaml:2799-2808"
        note: "schema has only definition + query; no name column"
    operator_visible_failure: |
      An operator who read the doc and expects to give each snippet a human-friendly name to find
      it later cannot — the only identifier in the catalog list is the `definition` text and the
      integer id. They may file a "can I rename a query example?" request to which the answer is
