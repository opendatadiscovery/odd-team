- id: H-005
  hypothesis: "When an author types the canonical thing this feature is for — an executable SQL/Spark snippet — into the Query field, the editor presents it as code (syntax-aware code editing), not as prose to be Markdown-formatted."
  derivation: "The feature's whole purpose is authoring executable query bodies (pillar P-02 'author SQL / KQL / Spark snippets'); the Query field is a Markdown editor (preview='edit'), not a code editor (QueryExampleForm.tsx:105-111)."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The Query field — the field that by the pillar's own definition holds "the executable code"
      (system-mission.md:109; live doc "the query body — the executable code") — is wired to a
      Markdown PROSE editor (`@uiw/react-md-editor`, preview='edit'), not a SQL/code editor. It
      offers Markdown affordances (bold/italic/heading toolbar, Markdown preview) and spellcheck
      (Markdown.tsx editor mode, flow hop-2: "Renders a textarea with spellcheck enabled"). It
      offers NO SQL syntax highlighting, NO code-mode, NO monospace-by-default code affordance
      beyond what Markdown fenced blocks give. The authoring affordance is mismatched to the
      content type: the user is asked to write code in a prose editor that will also Markdown-render
      that code on the details page.
    evidence:
      - sidecar: "F-131 flow"
        section: "chain hop 1 + hop 2 evidence"
        cite: "F-131.yaml:38-55 + QueryExampleForm.tsx:105-111 + Markdown.tsx:103-111"
        note: "query field = Markdown editor preview='edit' with spellcheck, not a code editor"
      - sidecar: "system-mission.md"
        section: "Pillar P-02 primary user actions"
        cite: "system-mission.md:109"
        note: "the feature is for authoring executable SQL/KQL/Spark snippets"
    operator_visible_failure: |
      An author writing a multi-line SQL statement gets prose-editor ergonomics: no SQL keyword
      highlighting, no bracket matching, spellcheck red-underlining every table/column identifier
      as a misspelling, and the risk that Markdown-significant characters in their SQL (e.g. a
      leading `#` in a comment becoming an H1, `*wildcard*` becoming italic, `_snake_case_`
      becoming italic) are silently reinterpreted when the snippet is rendered. The feature
      promises a place to pin canonical query code; the editor treats that code as a blog post.
      This is a UX/affordance defect, not a data-corruption bug — the raw text IS stored verbatim
      — but it degrades the core authoring task and compounds the H-004 Markdown-render surprise.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    sme_consultation_recommended: true
    sme_consultation_question: "Do operators of data-catalog query-snippet surfaces (DataHub queries, Amundsen, OpenMetadata) expect a SQL/code editor with syntax highlighting for the executable body, vs a Markdown editor — and does treating the executable body as Markdown-rendered violate the industry-canonical expectation for a 'query example' surface?"
    sme_consultation_archetype: comparative

