proposed_action: |-
  Add `termsRoutes.useTermsRouteParams.test.tsx`:

  (a) `useTermsRouteParams_inMatchingRoute_returnsNumericTermId`: render the hook inside `<MemoryRouter initialEntries={['/terms/42/overview']}>` with route `<Route path='/terms/:termId/*' element={<TestHookConsumer />}>`; assert `termId === 42` (typeof number).

  (b) `useTermsRouteParams_nonNumericSegment_returnsNaNTypedAsNumber`: render inside `<MemoryRouter initialEntries={['/terms/foo/overview']}>`; assert `termId` is `NaN` and `Number.isNaN(termId) === true`; documents the swallowing explicitly.

  (c) `useTermsRouteParams_calledFromTermsearchSubtree_returnsNaNAndIgnoredByConsumer`: render inside `<MemoryRouter initialEntries={['/termsearch/uuid-abc']}>` (no `:termId` in path); assert `termId` is `NaN` (the cross-route reuse anti-pattern); assert `termSearchId === 'uuid-abc'`.

  Add a comment at termsRoutes.ts:58 documenting: 'parseInt without isNaN guard returns NaN typed as Term[id] number. The hook assumes the caller is inside /terms/:termId/*. If you call this from another route or the URL has a non-numeric segment, expect NaN — currently propagates to fetchTermDetails as termId=NaN. Backend returns 404. See TEST-GAP-1000 + TEST-GAP-422 + TEST-GAP-849 + TEST-GAP-997 for the project-wide route-param anti-pattern.'
