behaviour: |-
  No caching of getByName. The result for stable seeded role names ('Administrator', 'User') is essentially never-invalidated for the lifetime of the seeded rows. On a busy platform with N authorized req/s, this is N DB calls (resolving the user-provider-role). A short-TTL request-scoped or process-wide cache (or a Caffeine LoadingCache scoped to seeded-role-name lookups) would significantly reduce DB load on this exact pattern. Today's behaviour is correct (always fresh) but not optimised — particularly because PolicyRepository.getRolesPolicies is ALSO called per-request, making 2 DB round-trips per authorized request the authorization-hot-path cost.
