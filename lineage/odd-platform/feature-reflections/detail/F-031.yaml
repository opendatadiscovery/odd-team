- id: H-013
  hypothesis: "When two operators (or one operator double-clicking Save) submit changes to the same data source concurrently, the platform serialises them so no change is silently lost."
  derivation: "Negative-space + resource-boundary: the Save button is not isLoading-guarded; no optimistic lock on the row."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      Static evidence establishes the create path is protected by the ODDRN
      partial-unique index (a concurrent duplicate register 400s — the second loses
      cleanly) and that the Save button is disabled only by form validity, not by
      isLoading (DataSourceForm.tsx:153), so a fast double-click CAN fire two POSTs
      before the first resolves (P-077). But the UPDATE (PUT) path has NO optimistic
      lock / version column — two concurrent edits to the same id are last-write-wins
      with no detection, and combined with H-003's REPLACE semantics a later edit
      can silently clobber an earlier operator's field changes. Whether the
      double-click guard / last-write-wins is observable in practice (and whether
      the ConfirmationDialog's in-flight isLoading reliably blocks a double-confirm
      on delete/regenerate) requires running the system — pinned by the
      already-authored P-077 (double-submit register), P-079 (double-confirm
      delete), P-050 (concurrent token rotation). One genuinely-uncovered case — two
      concurrent PUT edits to the same id producing a lost-update with no
      optimistic-lock detection — has no dedicated probe; a new probe
      (PENDING-F-031-1) is recorded.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceForm
        section: stress_findings.resource_boundaries (idempotency)
        cite: "DataSourceForm.tsx:146-155"
        note: "Save not isLoading-guarded; double-click can fire 2 POSTs (P-077)"
      - sidecar: odd-platform__java__DataSourceController__controller-method__updateDataSource
        section: observed_vs_expected facet (concurrent_update_lost_update_no_optimistic_lock)
        cite: "DataSourceServiceImpl.java:68-83"
        note: "no version column; two concurrent PUTs = last-write-wins, no detection"
    probe_id: PENDING-F-031-1
    use_case_kind: edit-reconcile
    coverage: unverified
    coverage_rationale: |
      probe-needed -> unverified; the test obligation IS the emitted probe
