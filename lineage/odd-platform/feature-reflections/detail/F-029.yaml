- id: H-009
  hypothesis: "When a developer reads the operationId createDataEntityTagsRelations, the CRUD verb 'create' accurately names the operation's semantic — it ADDS tag relations to a data entity without removing existing ones."
  derivation: "Endpoint-shape (operationId naming) — an operationId is the primary handle an SDK consumer reasons about; a 'create' verb that actually replaces-all is a contract surprise."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The operationId createDataEntityTagsRelations (openapi.yaml:867-925 area) names a 'create'
      operation, but the controller semantic is replace-all-internal-tags (per the
      createDataEntityTagsRelations sidecar + DOC-GAP-098). A POST that the developer believes ADDS
      tags actually REPLACES the entity's full internal-tag set — tags not present in the request
      are removed. The operationId actively misleads about the CRUD semantic. (The true semantic IS
      reachable by reading the operation body, so this is lower severity than an inverted summary —
      but the operationId is the handle most SDK consumers read first.)
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: docs_link_semantic.doc_drift_findings[5]
        cite: "openapi.yaml:867-925 area + createDataEntityTagsRelations.md (DOC-GAP-098)"
        note: "operationId 'create' but the controller semantic is replace-all-internal-tags."
      - sidecar: feature-reflector test-tree Grep (v0.3.0 coverage check)
        section: tests_coverage_semantic (cross-check)
        cite: "no test in the odd-platform tree asserts the replace-all-internal-tags semantic (Grep replace|TagsRelations -> unrelated loci)"
        note: "The replace-all semantic — the one that surprises a 'create'-trusting consumer — has no behavioural test."
    operator_visible_failure: |
      A developer calling createDataEntityTagsRelations with the one new tag they want to add
      silently DELETES every other internal tag on that entity — a destructive replace masquerading
      as an additive create. This is the same shape as the createEnumValue mis-naming (PLT-029,
      enum-values locus) but on the internal-tags locus; the UI avoids the trap by always sending
      the full set, leaving direct API consumers as the only victims.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: bug-candidate
    use_case_id: F-029-UC-9
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

