    observed: |-
      `openapi.yaml:10-12` declares
      `servers: - url: 'http://localhost' description: stub`. The
      spec's `servers:` field is meant to be a programmatic discovery
      surface ("the API is hosted at X"); declaring `http://localhost`
      is a development-time placeholder, never updated for live
      deployments. SDK generators using the spec'd value target
      localhost. Operationally clients pass an explicit base URL; the
      spec'd value is ignored in practice — but the field is
      misleading and signals authoring quality.
    expected: |-
      Either (a) drop the `servers:` block entirely (let SDK
      consumers configure the base URL externally), OR (b) declare
      `{platform-base-url}` as a server variable with description
