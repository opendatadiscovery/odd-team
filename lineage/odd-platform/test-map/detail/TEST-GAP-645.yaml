evidence:
  - "RolesList.md says (concepts.invariants.[0]): 'Empty-string search-clear refetch invariant — useEffect(..., [fetchRolesList, query]) (RolesList.tsx:40-42) fires when either the thunk reference or the query string changes. Because the thunk reference is stable across renders and the dispatch is GUARDED by if (!query), the effect emits a NEW fetchRolesList({page: 1, size: 100}) ONLY at initial mount AND whenever query transitions to '' (e.g. the user clears the search box). It does NOT fire on every keystroke. This is the LSN-017-shape question: the deps array is broader than strictly needed (fetchRolesList is a stable Redux thunk reference — including it adds no real refetch trigger) but the if (!query) guard prevents the LSN-017 double-fetch pattern. One fetch per page-open under normal usage.'"
