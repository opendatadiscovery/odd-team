name: Slack collaboration app
canonical_in_docs: true
canonical_candidate: false
description: 'Full Slack app for in-app per-entity Discussions threads — bidirectional
  integration via OAuth bot token (`datacollaboration.slack-oauth-token`) plus the
  Slack Events API webhook to read replies back into the platform (main-concepts.md
  Terms & Aliases: ''Slack collaboration app'' aka ''Slack Events API'', ''Slack OAuth
  integration'', ''Data Collaboration Slack''). Outbound delivery is decoupled from
  HTTP request via `202 Accepted` + Postgres-advisory-lock-elected sender queue (DataCollaborationMessageSenderJob);
  inbound Slack events are consumed by a second leader-elected thread (DataCollaborationMessageEventProcessor).
  Both leader-election locks are operator-tunable advisory-lock-IDs (sender=120, receiver=110
  by default). Batch 2026-05-12D adds `DataCollaborationProperties` — typed config-POJO
  that binds 3 of 7 `datacollaboration.*` keys (sender-message-advisory-lock-id, receive-event-advisory-lock-id,
  sending-messages-retry-count); the other 4 keys (`enabled`, `slack-oauth-token`,
  `message-partition-period`) are `@Value`-scattered across four different files.
  Partial-home pattern.'
axes_present:
- controllers
- config_prefixes
nodes:
