behaviour: |-
  Owner-association UI gate — when identity is present AND ownership is missing, the user sees OwnerAssociationForm INSTEAD OF OwnerEntitiesList (OwnerAssociation.tsx:33-41, :84-86). The gate is UX, NOT security — the same user can curl /api/dataentities/popular with their session cookie and get the full popular list (server has no identity-AND-ownership precondition per batch-G getPopular sidecar). Tests must pin the UI gate (form vs list) AND document that the API path is bypassable; this surfaces the defence-in-depth misconception when an operator audits the gate.
test_class: missing-security
test_files_existing: []
test_files_proposed:
  path: "odd-platform-ui/src/components/Overview/OwnerAssociation/__tests__/OwnerAssociation.test.tsx"
  name: "OwnerAssociation_uiGate_isUXNotSecurity"
evidence:
  - "PopularStrip.md says: 'owner-association gate — no test asserts that an identity AND !ownership user sees the OwnerAssociationForm instead of OwnerEntitiesList' — uncovered_behaviours[5]"
  - "PopularStrip.md security.known_security_gaps.[2]: 'Owner-association gate is bypassable via direct API call. A signed-in user with no Owner association sees the OwnerAssociationForm instead of OwnerEntitiesList on the home page. But that same user can curl /api/dataentities/popular with their session cookie and get the full popular list — the API has no identity AND ownership precondition. The UI gate is purely a discoverability decision'"
cross_references:
