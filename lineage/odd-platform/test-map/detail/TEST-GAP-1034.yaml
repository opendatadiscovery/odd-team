behaviour: |-
  **HIGH — Late-binding permission check on the Resolve/Reopen
  button. Operator-visible UX leak + structural deviation from the
  documented RBAC posture.**

  `AlertItem.tsx:159-166` renders a Resolve / Reopen button
  UNCONDITIONALLY for every Alert row in the list. The button text
  varies based on alert status, but the BUTTON ITSELF is rendered
  for every authenticated caller (per Alerts.md:auth_gates "No
  role concept at this layer; the DATA_ENTITY_ALERT_RESOLVE
  permission gate is per-action, post-click").

  At click time, `AlertItem.tsx:48-70` calls
  `fetchResourcePermissions({dataEntityId})` and inspects the
  returned globalPermissions array for `DATA_ENTITY_ALERT_RESOLVE`.
  If absent, the UI displays a `No access!` caveat
  (`AlertItem.tsx:55-67`). The action is denied; the click is
  consumed.

  **Why this is HIGH (and not LOW)**:
  - **UX leak — affordance visibility**: users who cannot perform
    the action see the affordance. The "click to learn you cannot"
    pattern is the canonical anti-pattern for affordance design
    (Nielsen heuristic #6 — recognition rather than recall;
    affordances should be VISIBLE for what the user CAN do, not
    what they cannot).
  - **Information leak — alert existence**: a viewer with
    DATA_ENTITY_READ-only sees the OPEN alert population for any
    data entity they can read. The OPEN-alert population is
    operationally sensitive (it discloses health-state — "this
    entity has unresolved issues"). The doc page at
    `https://docs.opendatadiscovery.org/features/active-platform-features/alerting`
    does not enumerate this visibility scope (sidecar
    docs_link_semantic.doc_drift_findings.[1]: 'live doc page
    does NOT document the permission needed to Resolve / Reopen').
  - **Deviation from sibling patterns**: the dataModelling pillar
    wraps its DELETE / UPDATE affordances in `<WithPermissions>`
    (per QueryExamples.tsx:36-46) which HIDES the affordance
    rather than rendering+denying. The alerts pillar diverges
    without a documented reason.
  - **Doc-side compounding** (docs_link_semantic.doc_drift_findings.[1]):
    the doc page does NOT document the permission needed for
    Resolve/Reopen. An operator deploying ODD with RBAC
    expectations has no signal that READ-only viewers see the
    Resolve buttons.

  **The CORRECT pattern is `<WithPermissions
  permissionTo={Permission.DATA_ENTITY_ALERT_RESOLVE}>` wrapping
  the Button** — this is the affordance-hide pattern used across
  the codebase (verified across QueryExamples.tsx, LookupTables.tsx
  Add-new button, OwnersList.tsx, etc.). The wrapper consults the
  PermissionContext seeded at mount and returns null if the
  permission is absent — the Button never renders.

  **Test gap shape**:
  1. **UI affordance-hide regression-pin**: render `<AlertItem/>`
     with a user fixture missing `DATA_ENTITY_ALERT_RESOLVE` and
     assert the Resolve button is NOT in the DOM. RED today
     (button renders); GREEN after the fix (button is wrapped in
     `<WithPermissions>`).
  2. **Per-action permission contract test**: render with the
     permission present and assert the Resolve button is in the
     DOM. PINS the positive case.
  3. **Backend regression-pin**: `AlertControllerResolveAccessTest`
     — POST a Resolve as a user without DATA_ENTITY_ALERT_RESOLVE,
     assert 403. PINS the backend gate (the UI affordance hide is
     defense-in-depth; the backend remains the source of truth).
