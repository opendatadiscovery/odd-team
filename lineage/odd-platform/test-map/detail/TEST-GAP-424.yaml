behaviour: |-
  switchOffErrorMessage opt-in contract — handleResponseAsyncThunk's switchOffErrorMessage option (set true at dataentities.thunks.ts:41) SHORT-CIRCUITS the showServerErrorToast call but MUST still write AppError to loader.errors[fetchDataEntityDetails]. The contract is asymmetric — error state persists in store, but toast is suppressed; the AppErrorPage is the user-facing surface, not a transient toast. A regression that broke this contract (writes nothing to errors OR shows the toast anyway) would silently leak diagnostic context or noise the operator. 14 thunk files share this opt-in pattern; a single test pins the helper's behaviour for all of them.
