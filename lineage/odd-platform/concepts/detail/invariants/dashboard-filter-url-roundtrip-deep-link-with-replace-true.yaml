name: Dashboard filter URL round-trip — deep-linkable view with replace:true
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The Data Quality Dashboard's filter panel mirrors `formFiltersAtom`
  into the URL query string (`DataQualityFilters.tsx:46-54`, JSON-
  encoded FilterOption[] including names) and hydrates from
  `searchParams` on mount (`DataQualityFilters.tsx:28-43`). The
  `setSearchParams(newSearchParams, { replace: true })` flag avoids
  pushing a new history entry per chip — the dashboard view becomes
  bookmarkable, shareable, and reload-survivable. NEW invariant, batch
  ZC (2026-05-22).

  The invariant is the dashboard's PRIMARY persistence channel: the
  jotai store is per-mount (the `<DataQualityAtomProvider>` is
  destroyed on navigation away, see the `jotai-feature-scoped-store`
  entity), so the URL is the ONLY surface that survives navigation.
  Without this round-trip the dashboard would lose filter state every
  time the operator navigates to another page and back.

  The two-way binding is also the deep-link mechanism: an operator can
  paste `/data-quality?namespaceIds=%5B%7B%22id%22%3A1%2C%22name%22%3A%22prod%22%7D%5D`
  into Slack or an email, the recipient opens it, the mount-effect
  hydrates `formFiltersAtom` from the searchParams, and the same
  filtered dashboard renders. The URL carries the FULL FilterOption[]
  (id + name) so the autocomplete chip can render its label without
  re-querying the list API for the id.

  Composition with `replace: true`: history navigation (Back / Forward)
  is intact across the dashboard's parent navigation but does NOT
  scrub through per-chip filter changes. A user pressing Back after 30
  filter toggles returns to where they were BEFORE opening the
  dashboard, not to the previous filter state.

  Failure mode: the mount effect does `JSON.parse(value)` on each
  query-param value WITHOUT try/catch (DataQualityFilters.tsx:35). A
  user who hand-edits `/data-quality?namespaceIds=foo` (not valid JSON)
  causes JSON.parse to throw inside the effect; React surfaces this as
  an uncaught render-time error. Recorded under the
  `sync-dashboard-filters-with-url` operation's weaknesses.

  vocabulary_status: codebase-anchored, doc-side-gap. The live
  https://docs.opendatadiscovery.org/features/data-quality/dashboard
  (WebFetched 2026-05-22 status 200) does NOT document the deep-linking
  behaviour. An operator cannot discover from the docs that their
  filter state survives reload or can be shared via URL.
vocabulary_status: codebase-anchored, doc-side-gap
