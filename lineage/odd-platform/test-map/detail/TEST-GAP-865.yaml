behaviour: |-
  **HIGH — CROSS-CUTTING META: `TagServiceImpl` has ZERO test coverage at the service tier. NO `TagServiceImplTest.java` exists; Glob `**/TagServiceImpl*Test*.java` returns 0 matches; Glob `**/Tag*Test*.java` returns ONLY `TagRepositoryImplTest.java` (the repository-tier test) — verified by 2 independent Globs. The service-tier orchestration is the LARGEST untested surface in the Tag chain: the `!external` guards (lines 49-50, 62-63), the in-memory diff in `updateRelationsWithDataEntity` (lines 96-121), the asymmetric cascade in `delete` (lines 57-70 — only 2 of 3 relation tables hard-deleted), the TOCTOU race window in `getOrCreateTagsByName` (lines 79-86), the case-sensitivity drift in `divideTagsByExistence` (lines 144-159), the triple search-vector refresh on `update` (lines 161-167), the asymmetric search-vector refresh on `delete` (lines 68-69), the absence of service-tier auth gates (5 of 9 methods are side-door surfaces) — NONE of these are tested.**

  **What the absence means** (per TagServiceImpl.md:tests_coverage_semantic.gaps): "A future refactor that, e.g., removes the `.filter(tagDto -> !tagDto.external())` guard (lines 49-50, 62-63) would compile, pass all existing tests, and silently let UI users mutate Collector-owned tags — a permission-bypass regression with zero CI signal."

  **The 12 individual uncovered behaviors** (per TagServiceImpl.md:tests_coverage_semantic.uncovered_behaviours) split between this META gap and the per-finding gaps:

  | Behavior | Pinned by |
  |---|---|
  | `update` !external guard | partially TEST-GAP-765 (controller-tier); not service-tier |
  | `delete` !external guard | partially TEST-GAP-765 (controller-tier) |
  | `delete` cascade asymmetry | TEST-GAP-762 (controller-tier) |
  | `update` triple-zip search-vector | **TEST-GAP-861 (NEW VAL-LSN-019)** |
  | `getOrCreateTagsByName` TOCTOU | TEST-GAP-540 (existing) |
  | `getOrInjectTagByName` TOCTOU silenced | **TEST-GAP-859 (NEW VAL-LSN-019)** |
  | `divideTagsByExistence` case-sensitivity | TEST-GAP-541 (repository) — sister at service tier still untested |
  | `updateRelationsWithDataEntity` diff correctness | NOT YET COVERED (this META anchor) |
  | `updateRelationsWithDataEntity` !external invariant | **TEST-GAP-857 (NEW VAL-LSN-019)** |
  | `updateRelationsWithDataEntity` hardcoded external=false | **TEST-GAP-857 (NEW VAL-LSN-019)** |
  | `listMostPopular` drift | **TEST-GAP-855, TEST-GAP-856 (NEW VAL-LSN-019)** |
  | `bulkCreate` duplicate-name | NOT YET COVERED (this META anchor) |
  | `deleteRelationsWithTerm` case-sensitive | NOT YET COVERED (sister to TEST-GAP-860 race) |

  **This gap is the META-ANCHOR** for the service-layer test-pillar effort. The individual gaps above pin the highest-risk surfaces. This entry pins the META-finding: NONE of the cross-cutting service-layer orchestration is tested.

  **Why HIGH not CRITICAL**:
  - Sister META findings (TEST-GAP-814 F-009 notification, TEST-GAP-835 F-008 ingestion, TEST-GAP-854 batch-ZA UI) are HIGH for similar cross-cutting absences.
  - CRITICAL is reserved for security-flagged uncovered behaviors with concept-aggregate HIGH severity. The Tag concept's security_aggregate.overall = MEDIUM (per concepts.yaml:3282) — so the absence is HIGH, not CRITICAL.
  - The individual gaps (855, 856) carry CRITICAL where appropriate (LSN-019 drift); this META gap carries the cross-cutting anchor at HIGH.

  **Authoring effort estimate**: ~3-5 sprint-weeks to author the full TagServiceImpl test suite. The individual gaps cover ~50% of the surface; the remaining surface (`updateRelationsWithDataEntity` diff correctness, `bulkCreate` duplicate handling, `divideTagsByExistence` case-sensitivity at the SERVICE tier, `deleteRelationsWithTerm` case-sensitivity, `getDto` for soft-deleted, `update` happy path, `delete` happy path) needs a comprehensive `TagServiceImplTest`.
