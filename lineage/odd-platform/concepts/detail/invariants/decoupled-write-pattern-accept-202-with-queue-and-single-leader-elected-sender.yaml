name: Decoupled-write pattern — accept-202 with queue-and-single-leader-elected-sender
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-08
description: |-
  Outbound integrations that depend on an unreliable external service
  (Slack) accept the inbound request, persist intent to Postgres in
  PENDING state, return 202 Accepted immediately, and let a
  single-leader-elected background job drain the queue with retries.
  The leader election uses a Postgres advisory lock (configurable
  `datacollaboration.sender-message-advisory-lock-id`, default 120).
  This preserves the Postgres-as-only-dependency posture while still
  decoupling caller latency from external service availability.

  Originally surfaced from the OUTBOUND DataCollaborationMessageSenderJob
  for Slack messages. Pattern documented at:
  postMessageInSlack.implicit_adrs[3] (explicit 202+queue+sender
  decomposition) + postMessageInSlack.implicit_adrs[4] (Postgres
  advisory lock for single-sender ordering preserves
  Postgres-as-only-dependency posture).

  ## STRENGTHENED batch 2026-05-25-ZF — EventApiController INBOUND analog mirrors the same shape

  Batch ZF's EventApiController class-level sidecar confirms the
  EXACT SAME ARCHITECTURAL PATTERN on the INBOUND-WEBHOOK side: Slack
  events delivered to POST /api/slack/events are accepted (returns
  200 OK immediately per Slack's contract requirement), enqueued into
  `message_provider_event` (state=PENDING) via
  `DataCollaborationService.enqueueMessageEvent`, and processed
  asynchronously by `DataCollaborationMessageEventProcessor` — which
  uses a SEPARATE Postgres advisory lock
  (`datacollaboration.receive-event-advisory-lock-id` default 110)
  for leader election.

  The mirror is intentional and complete:

  **OUTBOUND (Slack message send)**:
    - Inbound HTTP: POST /api/datacollaboration/providers/slack/messages
    - Controller: DataCollaborationController.postMessageInSlack
      returns 202 ACCEPTED with no Slack-side wait
    - Queue table: `messages` (state=PENDING_SEND)
    - Processor: DataCollaborationMessageSenderJob (single-leader)
    - Advisory lock: datacollaboration.sender-message-advisory-lock-id = 120
    - External call: Slack chat.postMessage (with retries up to
      `datacollaboration.sending-messages-retry-count` default 3)

  **INBOUND (Slack event receive)**:
    - Inbound HTTP: POST /api/slack/events
    - Controller: EventApiController.handleSlackEvent acks 200 OK
      with Slack's expected challenge / ack contract immediately
    - Queue table: `message_provider_event` (state=PENDING)
    - Processor: DataCollaborationMessageEventProcessor (single-leader)
    - Advisory lock: datacollaboration.receive-event-advisory-lock-id = 110
    - Internal action: materialise event into child `message` row
      with FK to parent message (only if parent is tracked)

  EventApiController's implicit_adr.[0] verbatim: "Inbound Slack
  events are persisted to a queue table (message_provider_event)
  and materialised asynchronously by a leader-elected processor
  thread rather than handled synchronously on the request path."
  The decomposition is INTENTIONAL: ack-fast on the HTTP path AND
  honour Slack's 3-second ack-or-retry contract; absorb processing
  latency via the queue.

  ## Cross-pillar pattern recognition

  The pattern composes TWO Postgres-advisory-lock-elected
  single-leader processors for the data-collaboration feature:
  one for OUTBOUND, one for INBOUND. Both advisory lock IDs are
  configurable via `DataCollaborationProperties` (lines 10-11)
  AND validated at `@PostConstruct validate()` (lines 14-20)
  against the constraint `>=0`. Operators can re-tune the lock IDs
  if their deployment collides on the default global lock ID
  space (e.g., setting both equal to the
  `partition.advisory-lock-id` default 90 would serialise all
  three jobs onto one leader connection — observable only via
  pg_advisory_lock-table inspection per EventApiController
  stress_findings.tunables.[0].q[1]).

  The 202-vs-200 contract distinction is also operator-relevant:
    - Outbound: returns 202 (explicit `HttpStatus.ACCEPTED` line 38
      of DataCollaborationController) — async-with-promise semantics
    - Inbound: returns 200 OK — Slack's webhook protocol REQUIRES
      2xx ack within 3 seconds, and Slack treats 202 vs 200
      identically (per Slack Events API docs); the controller
      chooses 200 to match the standard receiver convention

  ## The pattern's architectural commitment

  Postgres-as-only-dependency: BOTH the outbound queue + sender
  AND the inbound queue + processor live entirely in Postgres
  (jOOQ + R2DBC for the queue table; pg_advisory_lock for leader
  election; no Redis, no Kafka, no SQS). The pattern preserves
  the platform's single-runtime-dependency commitment while
  still decoupling caller latency from external service
  availability AND enabling at-most-once-per-leader processing
  semantics on the materialise side.
