proposed_canonical: ODD API Consumer
rationale: Every controller and openapi-tag sidecar names this audience as a distinct
  group from UI end-users. main-concepts.md does not register 'API consumer' or 'API
  client' as canonical audience vocabulary. The audience has its own concerns (programmatic
  access, OpenAPI-generated SDKs, error contract visibility, rate-limit awareness)
  that the docs surface implicitly but never bundle under a named audience concept.
contributing_concepts:
- API consumers building integrations (multiple controller sidecars)
- platform integrations writing back metadata (openapi-tag:dataEntity)
- operators inspecting alerts/runs/activity (openapi-tag:dataEntity)
- API consumers implementing the 3-step chunked-upload protocol (uploadFileChunk)
suggested_add_to_docs: true
