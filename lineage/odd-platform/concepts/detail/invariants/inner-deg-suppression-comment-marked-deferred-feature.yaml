    (b) Doc: extend `/features/data-lineage` (or a sub-page) with a 'DEG lineage'
        section naming the inner-DEG suppression contract; warn that nested
        DEGs are flattened to their non-DEG members.

    (c) Backlog: log a tracked item (REFACTOR-NNN) for the inner-DEG-support
        feature lift, citing the LineageServiceImpl.java:71 comment as the
        primary marker.

