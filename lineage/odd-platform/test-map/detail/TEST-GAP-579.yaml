proposed_action: |-
  Parameterised WebTestClient test. (a) For each of the four UI auth modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP), boot the app with `auth.ingestion.filter.enabled` unset OR explicitly false. (b) POST `/ingestion/entities` with a valid DataEntityList payload but NO Authorization header. (c) Assert all four modes return 2xx (current vulnerable posture). (d) Optionally pair with a SpringBootTest assertion that `ApplicationContext.getBean(IngestionDataEntitiesFilter.class)` throws `NoSuchBeanDefinitionException`. Future REFACTOR-185 boot-time validator that REJECTS this combination will flip every assert to expect a startup failure or a 401. Pin the canonical LSN-001-class insecure-default as a CI-visible assertion.
