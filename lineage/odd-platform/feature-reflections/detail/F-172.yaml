- id: H-009
  hypothesis: |-
    When a second operator concurrently binds a DIFFERENT user to the SAME owner that a
    first operator is binding, exactly one active mapping survives and neither operator's
    request silently corrupts the other (the clear-active-then-insert is race-safe).
  derivation: |-
    Negative-space concurrency seed. The repository sidecar's invariants explicitly flag
    "No race-window-safe primitives" and a concurrent-INSERT uncovered_behaviour. A
    product owner of a multi-admin Management surface would want to know the concurrent
    behaviour.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The repository createRelation is clear-active-then-insert with NO @ReactiveTransactional
      on the repository or UserOwnerMappingServiceImpl — BUT this MANUAL path enters through
      OwnerAssociationRequestServiceImpl.createUserOwnerMapping which IS @ReactiveTransactional
      (line 108), so each call is one transaction. The repository sidecar states the
      partial unique indexes (unique_deleted_at_per_owner + the (oidc_username,provider)
      key) are the load-bearing safety net and that a concurrent second INSERT "will raise
      UniqueConstraintException via JooqReactiveOperations.translateDatabaseException". What
      the sidecars CANNOT tell me without running it: whether two concurrent manual binds to
      the same owner under R2DBC connection-pool isolation actually serialise correctly
      (one commits, the other gets a 4xx from the constraint violation) or whether the
      inner clear-active soft-deletes the first commit's row before the second's INSERT in a
      lost-update window. The repository sidecar lists this exact scenario as an uncovered
      CONCURRENCY behaviour with no test.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveUserOwnerMappingRepositoryImpl
        section: "invariants (No race-window-safe primitives) + tests_coverage_semantic (CONCURRENT INSERT)"
        cite: "ReactiveUserOwnerMappingRepositoryImpl.java:41-51 + 47-51"
        note: "clear-active-then-insert; partial unique index is the only safety net; no concurrency test"
    operator_visible_failure: |-
      If the concurrent path is NOT safe: a lost binding (operator A binds Alice to Owner-X,
      operator B simultaneously binds Bob to Owner-X; the partial unique index on owner_id
      means only one active row may exist for Owner-X, so one operator's bind is silently
      superseded) OR a partial-failure (the inner clear-active soft-deletes a row, then the
      INSERT fails the constraint, leaving Owner-X with NO active mapping despite both
      operators believing they bound a user) — though the enclosing @ReactiveTransactional
      should roll the latter back. Severity is conditional on the probe outcome.
    severity: MEDIUM
    confidence: LOW
    probe_id: PENDING-F-172-1
    routes_to_finding: functional-test-demand
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: "PENDING-F-172-1 (probe)"
    local_execution_blocked: false

- id: H-010
  hypothesis: |-
    When an operator deletes (soft-deletes) an Owner that has an active manual binding,
    they are blocked OR the binding's audit history survives so an auditor can still
    reconstruct who was bound to the now-deleted Owner.
  derivation: |-
    Negative-space + cross-feature seed (F-019 Owner Lifecycle / F-173 Remove). The
    repository sidecar shows isOwnerAssociated cascade-blocks Owner delete, and
    OwnerAssociationRequest orphan-rows (REFACTOR-427) are a known F-019/F-171 finding. A
    product owner would want the teardown-constraint behaviour pinned.
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |-
      Owner delete IS cascade-blocked when an ACTIVE user_owner_mapping exists:
      OwnerServiceImpl.delete calls userOwnerMappingRepository.isOwnerAssociated(id)
      (ReactiveUserOwnerMappingRepositoryImpl.java:88-96) as one leg of a 3-leg Mono.zip and
      returns HTTP 400 CascadeDeleteException if true (repository sidecar upstream_callers +
      downstream_side_effects). So an operator CANNOT delete an Owner that currently has a
      manual binding — the binding must be removed first (F-173). HOWEVER, per the controller
      sidecar's REFACTOR-427 finding, the cascade-check has 3 legs (term-ownership,
      ownership, user-owner-mapping) but NOT owner_association_request — so the
      owner_association_request + activity rows this manual flow wrote are NOT part of the
      cascade-block and become orphan rows pointing at a soft-deleted Owner once the mapping
      is removed and the Owner is deleted. The audit HISTORY survives (rows are soft-deleted,
      never hard-deleted, per the repository's soft-delete-only invariant), so an auditor can
      still reconstruct the past bind — but the orphan request rows are an F-019/F-171 known
      defect, not unique to this flow.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveUserOwnerMappingRepositoryImpl
        section: "upstream_callers (OwnerServiceImpl.delete) + downstream_side_effects (isOwnerAssociated)"
        cite: "ReactiveUserOwnerMappingRepositoryImpl.java:88-96"
        note: "active mapping cascade-blocks Owner delete (HTTP 400)"
      - sidecar: odd-platform__java__OwnerAssociationRequestController__controller-class__OwnerAssociationRequestController
        section: "bugs_limitations_corner_cases (REFACTOR-427)"
        cite: "OwnerAssociationRequestServiceImpl.java:184-190 + F-019 detail"
        note: "owner_association_request NOT in the cascade-block — orphan rows persist (F-019/F-171 finding)"
    operator_visible_failure: |-
      The teardown is mostly safe (active binding blocks delete; audit history survives the
      soft-delete). The residual operator-visible defect is the F-019/F-171 orphan-row class:
      after the mapping is removed and the Owner deleted, the owner_association_request +
      REQUEST_MANUALLY_APPROVED activity rows this flow wrote point at a soft-deleted Owner,
      and a subsequent list/activity read may surface a row whose owner_id no longer resolves
      to a listable Owner. This is already tracked under F-019/F-171 (REFACTOR-427); not a
      net-new F-172 defect.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional

