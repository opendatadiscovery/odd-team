# RBAC Frontend Affordance (WithPermissions / WithPermissionsProvider) — product-owner reflection

## product_owner_narrative

This is not a feature a customer asks for by name — it is the cross-cutting UX
primitive that decides, on every screen of the platform, whether you SEE a button
at all. ODD Platform's RBAC model (Policies x Permissions x Roles x Owners x
User-owner association) gates mutations across the catalog (per system-mission.md
P-09 "an RBAC model ... gating mutations across the catalog"). The frontend
expression of that model is a pair of React higher-order components: every
create / edit / delete affordance in the SPA is wrapped in `<WithPermissions
permissionTo={...}>`, and each Management page (Policies, Roles, Owners,
Associations) plus each entity-detail action cluster wraps its subtree in a
`<WithPermissionsProvider>` that names the permissions relevant to that scope
(per F-207 chain hop 1-2 + the `discovered_from_entry_point` note). To the
operator this is invisible plumbing; to a Principal reviewing the product it is
the single most-mounted UI component on the platform.

The way a user experiences it is the load-bearing fact, and it is a deliberate
UX choice with a sharp edge: `WithPermissions` HIDES the control rather than
disabling it. Its default branch returns `hasAccessTo(permissionTo) ? children
: null` (per F-207 chain hop 2 — `WithPermissions.tsx:11-34`; corroborated at
`WithPermissions.tsx:28` by the sibling F-105 reflection and verified verbatim
in DOC-176's review). A user who lacks a permission does not see a greyed-out
button with a tooltip explaining why — the affordance is removed from the DOM
entirely. The predicate `hasAccessTo` is supplied by a `usePermissions()` hook
reading the surrounding `PermissionProvider` context; the context, in turn, is
seeded from the server's answer to "what can I do on this resource right now?"
— the `GET /api/resource/{type}/{id}/permissions` endpoint
(`PermissionController.getResourcePermissions`, per its class + method sidecars).

The working parts a product owner perceives as "permission gating" are three
layers, and only one of them is actually a gate. (1) `WithPermissions` hides
individual buttons — this is the dominant, working pattern. (2)
`WithPermissionsProvider` ANNOUNCES a permission context to descendants but does
NOT block rendering — every branch (render-prop / Component / children) returns
its child unconditionally (per F-207 facet
`provider_unconditionally_renders_children_no_top_level_route_gate`, confirmed at
`WithPermissionsProvider.tsx:12-48` by the F-105 reflection). (3) Route-level
gating is a SEPARATE concern owned by F-105 (Management Section Route Gating) —
only `/management/associations/*` actually redirects an unpermitted user; the
other eight Management sub-areas render their full catalog. The crucial truth,
and the reason this feature exists as a methodology anchor, is that NONE of these
three is the authorization boundary. The boundary is server-side: the
`AuthorizationCustomizer` enforces `SecurityConstants.SECURITY_RULES` on mutation
endpoints (per PermissionController sidecar `implicit_adrs[0]` — the same
`PermissionService` bean is wired into both the read-side controller and the
mutation enforcer). A forged or stale UI permission set cannot bypass mutation
gating — IT-010 pins exactly this: a non-admin LDAP user calling
`DELETE /api/owners/{id}` directly is denied 403, not silently allowed.

This feature composes with the entire platform rather than with one pillar. It is
the UI affordance layer for F-006 (RBAC policy lifecycle — PolicyList / RolesList
buttons), F-018 (Manual Object Tagging — the DATA_ENTITY_TAGS_UPDATE button),
F-004 (Entity description — the Edit affordance on DATA_ENTITY_DESCRIPTION_UPDATE),
F-031 (Data Source Lifecycle), and every per-entity action. It shares its predicate
source with F-105's route gating and with the server-side enforcement of P-09. Its
sibling HOC `WithFeature` (F-034) applies the identical hide-not-disable shape to
feature flags rather than permissions.

The edge a product owner would flag in a demo, and the negative-space hypotheses
below pursue it, is the gap between what the user SEES and what the platform
actually ENFORCES. Under `auth.type=DISABLED` the read-side permission endpoint
returns an EMPTY set (no SecurityContext → empty cascade, per PermissionController
method sidecar `bugs_limitations_corner_cases[0]`), so the UI hides every mutation
button — yet the mutation endpoints are simultaneously `permitAll()`, so a direct
API caller can do anything. The UI says "you can do nothing"; the API says "anyone
can do anything." Under `auth.type=LOGIN_FORM` the inverse holds: every credential
is granted ADMIN and the endpoint returns the FULL permission set regardless of any
policy revocation (per the same sidecar `bugs_limitations_corner_cases[1]`), so the
UI shows every button. In both modes the UI affordance visibility diverges from the
real enforcement posture — a divergence that is silent, undocumented at the UI
surface, and exactly the class of "the UI lied to me about what I could do" that
erodes operator trust.

