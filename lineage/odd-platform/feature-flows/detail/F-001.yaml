      + Overview sidecar downstream_side_effects (the Popular click is
      two layers downstream — Overview mounts the chain; the bug locus
      is DataEntityDetails) + Overview sidecar bugs_limitations_corner_cases[1]
      severity HIGH (cross-owner enumeration via the Popular tile
      rendered downstream — REFACTOR-024 family at the home-page level)
      + Overview sidecar bugs_limitations_corner_cases[2] severity LOW
      (no LSN-017 dep-array exposure at THIS layer — Overview has NO
      useEffect, only one useMemo with correct deps).
  - facet: hot-row contention at service tier (batch I — STATIC, perf consequence)
    observed: 'The @ReactiveTransactional on getDetails (line 197) means concurrent reads of

      the SAME entity serialise on the data_entity row write-lock for the duration

      of the entire transaction (read + 9 enrichment SELECTs + UPDATE + mapper). For

      a popular entity (e.g. a high-traffic table the platform''s stewards are watching),

      two concurrent operators opening the detail page block each other.'
    expected: either fire-and-forget view_count (sacrifice transactional atomicity for throughput) OR sampling strategy OR
      async aggregation
    drift_class: structural_amplification_surface
    provenance: STATIC — DataEntityServiceImpl.java:196-209 (the txn scope includes incrementViewCount). Proposed Type-7 perf
      probe — k6 + 100 concurrent GETs against the SAME entity id + measure p99 latency vs the per-call baseline from P-003.
  - facet: Directory level-4 EntityItem ALSO closes the F-001 inflation loop (ui-review-2026-05-26)
    observed: |-
      `Directory/Entities/EntitiesList/EntityItem/EntityItem.tsx:44`
      renders `<Link to={dataEntityDetailsPath(id)}>` — the SAME path
      builder PopularStrip uses to navigate to a clicked tile (per the
      "PopularStrip closes the F-001 inflation loop at the UI" facet
      above). Clicking ANY entity in the Directory level-4 list
      navigates to the entity's Overview tab → mounts
      `DataEntityDetails` → fires `fetchDataEntityDetails` → +1
      view_count (with the hop-1 dep-array bug doubling it to +2).
      The Directory is a SECOND UI-tier closure point of the F-001
      inflation loop (in addition to the PopularStrip / home-page
      Recommended panel). Operators using the Directory to BROWSE
      the catalog hierarchically are simultaneously INFLATING
      view_count on every entity they open — which influences the
      home-page Popular ranking the next time they visit.
    expected: |-
      Either (a) client-side defence at SOME layer (per-session
      "already counted" guard, analytics-only mode that does NOT
      trigger incrementViewCount), OR (b) docs explicitly note that
      Directory browse navigations contribute to the Popular ranking
      score. The UI exposes the inflation loop at MULTIPLE entry
      points; the defence (if added) needs to span all of them.
    drift_class: ui_amplification
    provenance: |-
      STATIC — primary-source verification at EntityItem.tsx:44 +
      dataEntityDetailsPath helper (same as F-001 hop-1 closure
      analysis). UI-review-2026-05-26 pass. The Directory inflation-
