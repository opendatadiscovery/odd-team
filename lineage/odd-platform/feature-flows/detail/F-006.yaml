- batch: N
  entry_point_added: |-
    repository-tier:ReactiveRoleRepositoryImpl (the ROLE half of the RBAC mutation
    surface — paired structurally with batch-H ReactivePolicyRepositoryImpl as the
    POLICY half. Three custom dto methods getDto / listDto / getByName + inherited
    CRUD with soft-delete. The getByName method is the AUTHORIZATION HOT PATH for
    every authorized HTTP request whose user has no explicit owner-attached role,
    resolving 'Administrator' or 'User' seeded names to RoleDto with attached policies.)
  contributing_nodes_added:
  - odd-platform java repository reactive repository:ReactiveRoleRepositoryImpl
  notes: |-
    Four new drift facets surface, three of them DIRECT MIRRORS of batch-H Policy
    findings — closing the symmetric coverage of the RBAC mutation surface
    (Policy + Role together):
    (1) Role-repo LEFT JOIN without `policy.deleted_at IS NULL` filter (mirror of
    batch-H drift on `ReactivePolicyRepositoryImpl.getRolesPolicies`) — the three
    custom dto methods (getDto/listDto/getByName at lines 45-48, 67-70, 87-90)
    aggregate policies via LEFT JOIN with NO deleted_at filter on POLICY. A
    soft-deleted policy with surviving role_to_policy edges shows up in the
    returned RoleDto's policy_relations array — UI displays it to operators with
    no indication that the policy is gone. PolicyServiceImpl.delete CASCADE
    defence covers normal flows; direct DB UPDATE setting `policy.deleted_at`
    bypasses it.
    (2) Role-create `Administrator` / `User` name asymmetry (mirror of batch-H
    Policy name asymmetry) — V0_0_55__add_policies_and_roles.sql:42 +
    V0_0_64__remove_is_deleted_field.sql:88-90 enforce `role_name_unique WHERE
    deleted_at IS NULL` which FREES the predefined names if the seeded rows are
    ever soft-deleted. RoleServiceImpl.update (line 68) and .delete (lines 81-84)
    reject the predefined names; RoleServiceImpl.create (lines 51-61) has NO
    name check. A direct DB UPDATE soft-deleting the seeded Administrator row
    leaves the name available + roleRepository.create succeeds with
    attacker-chosen policy bindings.
    (3) RoleService predefined-name case-sensitivity mismatch — line 68 uses
    case-SENSITIVE `.equals(UserProviderRole.ADMIN.getValue())`; line 82 uses
    case-INSENSITIVE `.equalsIgnoreCase(role.getName())`. An operator can
    CREATE a role named 'administrator' (lowercase) bypassing the unique index
    (it's a different string), CANNOT delete it (case-insensitive guard
    matches), CAN update it (case-sensitive guard does NOT match) — the
    case-sensitivity-mismatch DRIFT recorded in batch E now confirmed at the
    service-vs-repo schema-byte-comparison level.
    (4) FOUR-SIDECAR audit-silence pattern confirmation — the
    "no-audit-log-on-RBAC-mutations" cross-batch concept catalog entry is
    REFINED with a fourth corroborating sidecar (RoleController batch E +
    PolicyController batch E + ReactivePolicyRepositoryImpl batch H + this
    ReactiveRoleRepositoryImpl batch N). Both halves of the RBAC mutation
    surface (Policy + Role) are forensically silent at the repository layer.
    Hop on the Role half is now PRIMARY-SOURCE — adds the symmetric mirror of
    the Policy half batch-H established. ZERO direct unit tests for any path
    through this repository (Grep verified — only OwnerRepositoryImplTest:37
    uses bulkCreate for fixture setup, no Role-specific test class exists).
- batch: P
  entry_point_added: |-
    controller-method:deleteOwner (DELETE /api/owners/{owner_id}) — the
    directory-level destruction verb for the Owner entity, sibling of
    createOwner + updateOwner on the same controller. The endpoint
    runs a transactional three-leg cascade-block check
    (termOwnership.existsByOwner + ownership.existsByOwner +
    userOwnerMapping.isOwnerAssociated) and either soft-deletes the
    Owner row AND hard-deletes ALL of the Owner's role bindings — or
    fails with HTTP 400 USR004 CascadeDeleteException. This is the
    FIFTH corroborating sidecar for the audit-silence pattern: the
    4-sidecar pattern from batch N (RoleController + PolicyController
    + ReactivePolicyRepositoryImpl + ReactiveRoleRepositoryImpl) is
    EXTENDED to 5-sidecar with OwnerServiceImpl.delete (no
    @ActivityLog) as the corroborating addition. Positive case-law
    contrast: unlike the POLICY/ROLE half (where soft-delete leaves
    orphan grants), the OWNER delete HARD-DELETES owner_to_role rows
    — F-006's permission_persistence_after_soft_delete family pattern
    is done CORRECTLY on this surface.
  contributing_nodes_added:
  - odd-platform java OwnerController controller-method:deleteOwner
  - odd-platform java OwnerServiceImpl
  cross_batch_corrections:
  - prior_claim: |-
      createOwner sidecar (batch session-2026-05-12-E)
      bugs_limitations_corner_cases[2] + security.known_security_gaps[2]
      claim owner.name UNIQUE is non-partial and that 'Soft-deleted
      owners block re-creation under the same name' (both severity
      MEDIUM).
    correction: |-
      Both claims are WRONG. V0_0_64__remove_is_deleted_field.sql:68-70
      drops the original index and recreates it as PARTIAL
      (`CREATE UNIQUE INDEX IF NOT EXISTS owner_name_unique ON owner
      (name) WHERE owner.deleted_at IS NULL;`). After soft-delete via
      DELETE /api/owners/{id}, the name is freed and a subsequent
      POST /api/owners with the same name succeeds. The createOwner
      sidecar's MEDIUM-severity claims are SUPERSEDED by the batch-P
      deleteOwner sidecar; the partial-unique-index pattern is the
      same as policy_name_unique / role_name_unique / tag_name_unique
      / title_name_unique in the same migration. Per LSN-018
      coherence-supersede protocol the supersede note is recorded as
      `superseded_by: deleteOwner sidecar (session-2026-05-20-P)` on
      the createOwner sidecar's two entries.
  notes: |-
    Seven new drift facets surface from the Owner-deletion destruction
    verb. The HIGH-severity audit-silence finding (5th corroborating
    sidecar) refines the cross-batch concept catalog entry from
    '4-sidecar' to '5-sidecar' with the recommendation to ELEVATE the
    audit-log gap to first-priority. Listed in descending severity:
    (1) FIVE-SIDECAR AUDIT-SILENCE PATTERN (HIGH) —
    OwnerServiceImpl.delete (lines 87-100) has NO @ActivityLog
    annotation. The activity feed does NOT record 'owner named X was
    deleted by Y at T'. Combined with the role-binding HARD-delete
    (irreversible) and the soft-delete-on-Owner-row (name freed for
    re-creation), the audit story is: an operator can delete an
    Owner and then re-create a different Owner with the same name,
    with NO trace anywhere except (a) the row's deleted_at timestamp
    (no operator-readable surface) and (b) the absence of OWNER_TO_ROLE
    rows (no historical record). The 5-sidecar audit-silence pattern
    (RoleController + PolicyController + ReactivePolicyRepositoryImpl
    + ReactiveRoleRepositoryImpl + OwnerServiceImpl) is now CONFIRMED;
    the audit-log gap is the highest-priority RBAC drift in the
    catalog.
    (2) OWNER_TO_ROLE HARD-DELETE CLOSES ORPHAN-BINDING (POSITIVE
    CASE-LAW, NO SEVERITY) — Owner deletion HARD-DELETES owner_to_role
    rows via ownerToRoleRepository.deleteOwnerRelationsExcept(id,
    List.of()) (OwnerServiceImpl.java:97 →
    ReactiveOwnerToRoleRepositoryImpl.java:52-56 DSL.delete). The
    F-006 family pattern permission_persistence_after_soft_delete is
    closed CORRECTLY on the OWNER side: a deleted Owner does NOT
    continue to confer their previously-attached roles' permissions
    because the role-binding row is physically removed. This is the
    POSITIVE case-law contrast to the POLICY/ROLE half (where
    soft-delete leaves orphan grants). Surface for documentation:
    'Owner deletion hard-deletes role bindings; Policy and Role
    deletions use soft-delete + leave bindings'.
    (3) OWNER_ASSOCIATION_REQUEST ORPHAN ROWS PERSIST (HIGH) — the
    cascade-block at OwnerServiceImpl.java:90-91 checks termOwnership
    + ownership + userOwnerMapping but NOT owner_association_request.
    The table has an FK to owner(id) with NO ON DELETE clause;
    Owner uses soft-delete (UPDATE deleted_at) so the FK is never
    consulted. A PENDING or APPROVED owner_association_request for
    the just-deleted Owner persists. If an operator re-creates an
    Owner with the same name (partial-unique-index allows it), the
    orphan request is NOT automatically re-linked — they have
    different ids; the orphan continues pointing into soft-deleted
    space. Mirrors F-006's cascade-incompleteness pattern (batch I
    PolicyServiceImpl.delete).
    (4) FTS SEARCH-VECTOR NOT REFRESHED ON DELETE (MEDIUM) —
    OwnerServiceImpl.update (line 82) calls updateSearchVectors(owner)
    refreshing both searchEntrypointRepository and
    termSearchEntrypointRepository. OwnerServiceImpl.delete does
    NOT. The FTS index continues to surface the deleted Owner's
    name in catalog search results until other events refresh the
    affected entities' vectors. MIRRORS the existing
    delete_search_vector_not_refreshed facet from batch K
    OwnershipServiceImpl — now on the OWNER side too.
    (5) DELETE NO NotFound VALIDATION — IDEMPOTENCY INDISTINGUISHABLE
    (MEDIUM) — OwnerServiceImpl.delete has no switchIfEmpty(Mono.error(
    NotFoundException)) on ownerRepository.delete(id). The soft-delete
    UPDATE returns empty Mono if no row matched; the .then() and
    .thenReturn(noContent()) propagate empty as success → HTTP 204.
    Caller cannot distinguish 'I deleted it', 'it was already
    deleted', 'it never existed'. The update path DOES switchIfEmpty
    (line 73); the asymmetry between delete and update is unstated.
    MIRRORS the existing delete_no_not_found_validation facet from
    batch K OwnershipServiceImpl — now on the OWNER side too.
    (6) SOFT-DELETED OWNER VISIBLE VIA GET-BY-ID BUT HIDDEN FROM
    LIST (MEDIUM) — getOwnerList uses enrichSelect which adds
    deleted_at IS NULL. getDto does NOT apply the soft-delete filter
    on OWNER side. Direct GET /api/owners/{id} returns the soft-deleted
    row + switchIfEmpty(Mono.error(NotFoundException)) only fires
    when the ID does not exist at all. Visibility of a soft-deleted
    Owner is INCONSISTENT across list vs by-id queries — list hides
    them, by-id surfaces them. If a soft-deleted Owner's name is
    sensitive PII the by-id surface leaks it.
    (7) CASCADE-CHECK NON-ATOMIC WITH DELETE (LOW) — the three
    existsBy* reads and ownerRepository.delete run inside one
    @ReactiveTransactional boundary but the reads do NOT acquire
    row-level locks (no SELECT FOR UPDATE, no advisory lock). Under
    READ COMMITTED a concurrent POST /api/dataentities/{id}/ownership
    racing with DELETE /api/owners/{id} is theoretically able to
    slip a fresh OWNERSHIP row past the existence check. Mirrors
    F-006 batch I cascade_check_non_atomic facet — same shape,
    different table.
    Cross-batch correction recorded: createOwner sidecar's claim
    that owner.name UNIQUE is non-partial is SUPERSEDED — the index
    IS partial (WHERE deleted_at IS NULL per V0_0_64); after
    soft-delete the name is freed for re-creation. Both
    bugs_limitations_corner_cases[2] and security.known_security_gaps[2]
    on the createOwner sidecar are flagged `superseded_by: batch-P
    deleteOwner sidecar (session-2026-05-20-P)`.
- batch: Q
  entry_point_added: |-
    UI-tier (2 sidecars): react-component:PolicyList (Management →
    Policies tab) + react-component:RolesList (Management → Roles tab).
    The two UI-tier sidecars close the SPA-side render of the RBAC
    catalogue surfaces. PolicyList consumes GET /api/policies through
    `fetchPolicyList` thunk → `PolicyController.getPolicyList` →
    `PolicyServiceImpl.list` (ADMIN branch → `policyRepository.list`;
    non-ADMIN branch → in-memory `getRolePolicies`). RolesList consumes
    GET /api/roles through `fetchRolesList` thunk →
    `RoleController.getRolesList` → `RoleServiceImpl.list` (principal-aware
    fork — ADMIN vs non-ADMIN). The two UI surfaces are STRUCTURALLY
    SYMMETRIC — identical WithPermissions wrapping pattern, identical
    InfiniteScroll + debounced-search shell, identical `WithPermissions
    permissionTo={Permission.X_CREATE}` for the Create CTA, identical
    name-string-coupled 'Administrator' / 'User' guards.
  contributing_nodes_added:
  - odd-platform ts react-component:PolicyList
  - odd-platform ts react-component:RolesList
  notes: |-
    SIX new drift facets surface from the UI tier of the RBAC
    surface, plus the SIX-SIDECAR audit-silence refinement (the 5-sidecar
    pattern from batch P + the UI tier this batch = 6-sidecar). Listed
    in descending severity:
    (1) SIX-SIDECAR AUDIT-SILENCE PATTERN — UI TIER IS FORENSICALLY
    SILENT TOO (HIGH) — verified by Grep on `mixpanel|amplitude|segment
    |gtag|posthog|track(` across `<odd-platform-ui>/src` returning ZERO
    matches. PolicyList + RolesList neither emit analytics events on
    mutations NOR display authorship metadata on rows (only id + name
    rendered; no created_at, no created_by). The successful create /
    update / delete toasts vanish in ~5 seconds with no persistent UI
    audit panel. The 5-sidecar pattern (RoleController batch E +
    PolicyController batch E + ReactivePolicyRepositoryImpl batch H +
    ReactiveRoleRepositoryImpl batch N + OwnerServiceImpl batch P) is
    REFINED to 6-SIDECAR with the addition of the UI tier. This is the
    FIRST UI-side corroboration of the cross-batch audit-silence
    finding; the audit-silence is platform-wide across server AND
    client.
    (2) CATALOGUE-VS-GRANT RENDER ASYMMETRY UI-VISIBLE HALF (HIGH) —
    PolicyList renders the catalogue auto-filtered by `deleted_at IS
    NULL` (the inherited soft-delete base-class filter in
    `policyRepository.list`); the LIST UI shows a CONSISTENT view —
    soft-deleted policies are GONE. The OPERATING reality per
    F-006 batch-H + batch-N + this batch's UI evidence: a role bound
    to a soft-deleted policy continues to confer permissions via the
    unfiltered `getRolesPolicies` JOIN. **The UI is the surface where
    the misperception manifests** — operator sees 'gone', backend keeps
    granting. PolicyList.tsx:1-128 cannot surface this drift at this
    layer; it is invisible to operators who never inspect the SQL
    layer. UI manifestation of F-006 drift_class
    `soft_delete_aware_visibility_inconsistency`.
    (3) SOFT-DELETED POLICIES STILL VISIBLE IN PER-ROW POLICY CHIPS
    (MEDIUM) — RolesList renders Role rows via `RoleItem.tsx:42-48`
    which maps `policies.map(policy => policy.name)`. The underlying
    `roleRepository.listDto` LEFT JOIN against POLICY has NO
    `policy.deleted_at IS NULL` predicate (per batch-N invariants[1] +
    F-006 drift_class `role_repo_left_join_no_policy_deleted_at_filter_mirror`).
    A Role whose Policy has been soft-deleted but whose `role_to_policy`
    edge survives WILL render the deleted Policy's name in the chip
    list, with no visual differentiation. Operational-intelligence
    leak: an attacker reading the role catalog can enumerate historical
    Policy names that were once attached and then deleted.
    (4) ADMINISTRATOR-NAME UI GUARD IS CASE-SENSITIVE STRING MATCH +
    INHERITS BACKEND CASE-SENSITIVITY MISMATCH (MEDIUM) — PolicyItem.tsx:23
    + PolicyForm.tsx:28 + RoleItem.tsx:24-25 + RoleForm.tsx:28, 90 all
    hardcode `name === 'Administrator'` (or `=== 'User'`) for hide-Edit/Delete
    affordance. Server-side: `RoleServiceImpl.update` (line 68) uses
    case-SENSITIVE `.equals` (consistent with UI); `RoleServiceImpl.delete`
    (line 82) uses case-INSENSITIVE `.equalsIgnoreCase` (INCONSISTENT
    with UI). Net effect — an operator who creates 'administrator'
    (lowercase) sees Edit AND Delete buttons in the UI (UI is
    case-sensitive — doesn't match 'Administrator'), clicks Delete →
    server-side rejects 'Role is predefined and cannot be deleted',
    UI shows server error. UI manifestation of F-006 drift_class
    `role_service_predefined_name_case_sensitivity_mismatch`.
    (5) CREATE-PATH NAME ASYMMETRY UI ENABLES THE F-006 ADMINISTRATOR-NAME
    RE-CREATION ATTACK (HIGH) — RolesList → RoleForm.tsx:80-95 declares
    only `rules={{required: true, validate: value => !!value.trim()}}`
    for the Role name field. NO predefined-name reject, NO length cap,
    NO charset filter, NO case-insensitive predefined-name check. The
    UI is the operator-facing trigger of F-006 drift_class
    `role_create_administrator_name_asymmetry_mirror` — an attacker
    with ADMIN role or S2S API key can (a) direct-DB-UPDATE the seeded
    Administrator row's `deleted_at`, (b) open
    `/management/roles/createRole`, (c) name the new role 'Administrator'
    + attach any Policy from the autocomplete (including
    MANAGEMENT/ALL), (d) submit succeeds — the partial unique index
    permits re-use of the freed name. UI is COMPLICIT.
    (6) PRINCIPAL-AWARE LIST FORK IS UI-SILENT (MEDIUM) — both PolicyList
    and RolesList have a server-side principal-aware fork
    (`PolicyServiceImpl.list` ADMIN vs non-ADMIN branching; same shape
    in `RoleServiceImpl.list`). The UI renders the filtered set with
    NO 'showing N of M' messaging, NO admin contact-CTA, NO
    'filtered-by-your-access' disclaimer. A non-ADMIN seeing one Role
    labelled 'User' may reasonably conclude 'the platform has only one
    role configured' — they have no UI affordance indicating the list
    is principal-filtered. UX defect with security implications: an
    attacker can argue 'role X doesn't exist' citing the empty UI
    surface.
    Additionally, the `WithPermissions` HOC convention (`return
    hasAccessTo(permissionTo) ? <>{children}</> : null`) HIDES
    forbidden affordances rather than DISABLING them — operators
    without RBAC permissions see a read-only list with NO buttons,
    no visual cue that the affordance exists. The UI side of the
    read-collaborative posture (ADR-CANDIDATE-003 / REFACTOR-024).
    Cross-batch coherence: the UI-side findings STRENGTHEN F-006's
    existing drift_classes
    `soft_delete_aware_visibility_inconsistency`,
    `role_repo_left_join_no_policy_deleted_at_filter_mirror`,
    `role_service_predefined_name_case_sensitivity_mismatch`,
    `role_create_administrator_name_asymmetry_mirror`, and
    `four_sidecar_audit_silence_pattern_role_repo_confirmation` /
    `five_sidecar_audit_silence_pattern_owner_delete_confirmation`
    (the latter pair refined to 6-SIDECAR). No conflicts; no
    supersedes. NEW finding only on the UI tier specifically: the
    LSN-017 dep-array doubling pattern is EXPLICITLY ABSENT from both
    PolicyList and RolesList — the `useEffect([fetchX, query])` is
    GUARDED by `if (!query)`, so the effect fires on mount + on
    query-clear, NOT on every keystroke. Recorded as a NEGATIVE
    finding (LSN-017-safe by structure) so a future scan need not
    re-investigate.
- batch: R
  entry_point_added: |-
    repository-tier:ReactiveActivityRepositoryImpl — the SQL-tier
    primary source for the audit-silence finding. The Activity Feed's
    write surface (saveReturning / save) is the funnel every
    `@ActivityLog`-annotated service method flows through (18 enumerated
    methods across DataEntityServiceImpl + OwnershipServiceImpl +
    TermServiceImpl + DatasetFieldServiceImpl + etc). RBAC mutation
    services (RoleServiceImpl + PolicyServiceImpl + OwnerServiceImpl)
    carry NO @ActivityLog annotations — the 6-sidecar audit-silence
    pattern (batch Q's UI tier corroboration) refines to 7-SIDECAR
    with the SCHEMA-LAYER ROOT CAUSE: `activity.data_entity_id` is
    NOT NULL with FK constraint to `data_entity(id)`
    (V0_0_48__add_activity.sql:4,12). The audit table CANNOT physically
    store an event that lacks a data_entity reference. RBAC mutations
    have no data-entity context — they CANNOT emit to this table even
    if a future @ActivityLog were added to the service methods. The
    audit-silence is not a missing-annotation gap; it is a SCHEMA-LEVEL
    IMPOSSIBILITY requiring a separate audit surface (or a NULLable
    data_entity_id with a discriminator column).
  contributing_nodes_added:
  - odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl
  notes: |-
    Two new drift facets surface from the repository-tier primary source,
    both elevating the existing audit-silence finding from
    "missing-annotation gap" to "schema-rooted impossibility":
    (1) AUDIT-SILENCE SCHEMA-ROOTED — ACTIVITY.DATA_ENTITY_ID NOT NULL
    FK (HIGH, structural) — V0_0_48__add_activity.sql:4 declares
    `data_entity_id bigint NOT NULL`; line 12 declares the FK constraint
    `activity_data_entity_id_fk FOREIGN KEY (data_entity_id) REFERENCES
    data_entity (id)`. The schema author committed to data-entity-scoped
    audit; the FK constraint name (`activity_data_entity_id_fk`) is
    verbose and schema-evolution-aware — both line 4 (NOT NULL) and
    line 12 (the named FK) are EXPLICIT choices over the alternative
