name: |-
  Slack Events INBOUND webhook ships NO signing-secret verification — anyone can forge events to POST /api/slack/events (batch ZF)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
  - P-09
description: |-
  **NEW HIGH-severity INVARIANT, batch 2026-05-25-ZF** — the
  EventApiController endpoint (`POST /api/slack/events`) is the
  INBOUND Slack Events API webhook receiver for the Data
  Collaboration feature, AND it is the INBOUND ANALOG of the
  OUTBOUND `webhook-no-hmac-no-signature-no-payload-origin-verification`
  invariant (batch Y). The endpoint ships NO X-Slack-Signature
  verification, NO Slack signing-secret check, NO HMAC-SHA256
  computation, AND is path-whitelisted in EVERY auth mode — so
  ANY internet caller able to reach the platform's port can forge
  Slack events with arbitrary payload shape.

  ## THE PRIMARY-SOURCE EVIDENCE — EventApiController batch ZF

  EventApiController.java:22-27 (the entire handler body):
    public Mono<ResponseEntity<SlackEventResponse>> handleSlackEvent(
            @RequestBody final Mono<String> body,
            final ServerWebExchange exchange) {
      return body
          .map(slackEventParser::parse)
          .flatMap(this::route);
    }

  The signature evidence:
    - `@RequestBody final Mono<String> body` — receives the raw
      JSON body
    - `final ServerWebExchange exchange` — has access to
      `exchange.getRequest().getHeaders()` BUT THIS IS NEVER READ
    - `SlackEventParser.parse(String rawJson)` — parser signature
      takes ONLY the JSON; no headers, no timestamp, no signature

  Grep of the entire codebase 2026-05-25:
    - `X-Slack-Signature` — ZERO matches
    - `signing.secret` / `signingSecret` — ZERO matches
    - `HMAC.SHA256` / `Mac.getInstance("HmacSHA256")` — ZERO matches
    - `MessageDigest.getInstance("HmacSHA256")` — ZERO matches
    - `X-Slack-Request-Timestamp` — ZERO matches

  The endpoint deserialises the JSON body and routes by `type`
  field into CHALLENGE/FILTER/ERROR/PAYLOAD; for PAYLOAD it
  enqueues a `message_provider_event` row. No verification of
  payload origin happens anywhere in the chain.

  ## CONTRAST WITH SLACK'S DOCUMENTED PROTOCOL

  Slack's Events API protocol (`https://api.slack.com/authentication/verifying-requests-from-slack`)
  requires receivers to:
    (1) Read `X-Slack-Request-Timestamp` and `X-Slack-Signature`
        headers
    (2) Compute `v0={timestamp}:{raw body}`
    (3) HMAC-SHA256(v0, signing-secret) → hex
    (4) Compare to the value in `X-Slack-Signature` (constant-time)
    (5) Reject if mismatch OR timestamp drift > 5 minutes

  Slack provides the signing secret per app (separate from the
  bot OAuth token); operators copy it from the Slack app config
  into the receiver's config. The mechanism mirrors what GitHub
  webhooks (X-Hub-Signature-256), Stripe webhooks (Stripe-Signature),
  AlertManager (custom Authorization), and every other webhook
  receiver implements as a defence against URL leakage.

  ODD's EventApiController implements NONE of steps 1-5.

  ## CONTRAST WITH THE LIVE DOCS

  Live docs at `https://docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#enable-data-collaboration`
  (WebFetched 2026-05-25, status 200) publish the Slack app
  manifest with `request_url: https://<ODD_PLATFORM_BASE_URL>/api/slack/events`
  AND bot scopes `channels:history, channels:read, chat:write,
  users:read, incoming-webhook` AND bot event subscription
  `message.channels` — but contain NO MENTION of:
    - signing-secret configuration property
    - signature verification
    - X-Slack-Signature handling
    - operator-side mitigation for the unsigned-webhook stance

  Quoted from EventApiController.md
  docs_link_semantic.doc_drift_findings.[0]: "the docs publish a
  deployment instruction that exposes a publicly-reachable
  endpoint — but the docs are silent about (a) the absence of
  Slack signing-secret signature verification in the code, (b)
  the endpoint being whitelisted from authentication in all auth
  modes (SecurityConstants.java:96 + LoginFormSecurityConfiguration.java:50),
  and (c) Slack's at-least-once delivery model producing duplicate
  downstream message_provider_event rows because the schema lacks
  a uniqueness constraint on the Slack event_id."

  ## THE COMPOUND ATTACK SURFACE

  Three composable gaps surface at this endpoint:

    (1) NO signature verification (this invariant)
    (2) NO authentication gate in ANY auth mode (whitelisted in
        SecurityConstants.WHITELIST_PATHS line 96; explicitly listed
        in LoginFormSecurityConfiguration permittedPaths line 49-51;
        catch-all in OAUTH2/LDAP/DISABLED)
    (3) NO idempotency / event_id dedup on at-least-once delivery
        (`message_provider_event` table V0_0_59__data_collaboration.sql:25-39
        has no unique constraint on Slack event_id; the INSERT has
        no ON CONFLICT — duplicate Slack deliveries insert N rows
        which materialise into N child message rows)

  An attacker who:
    - Discovers the platform URL (e.g., shodan.io scan, leaked
      from a deployment manifest, learned from Slack app config
      if they have access to the workspace)
    - POSTs a forged `event_callback` payload with `type=event_callback`,
      `event.type=message`, `event.subtype=message_changed` (or
      vanilla message), and a crafted `thread_ts` matching a
      known tracked ODD-platform message UUID
    - Repeats the POST N times to amplify

  Successfully injects N rows into `message_provider_event` per
  POST, each materialising into a child `message` row on the
  parent ODD message. The downstream processor's
  `SlackMessageProviderEventHandler` (`SlackMessageProviderEventHandler.java:25-43`)
  performs no signature check at the consumer-side either — the
  enqueue + materialise chain trusts the queue row entirely.

  The `thread_ts` filter at parse-time (`SlackEventParser.java:65-74`)
  only ENUMS the requirement that the message be a thread reply;
  it does not gate by signature. An attacker who guesses or
  observes any tracked thread_ts (visible in any Slack message URL
  the ODD UI has rendered) can inject indefinitely.

  ## THE OPERATOR REMEDIATION BURDEN

  Pending a platform fix, operators must implement defence-in-depth
  out-of-band:

    - mTLS at HTTP gateway with Slack's IP allowlist
      (https://api.slack.com/robots#ip_allowlisting — Slack publishes
      egress CIDR ranges; operators allowlist these AND require
      client cert for inbound)
    - VPN / private network: requires ODD and Slack's egress in
      the same network (impossible — Slack is multi-tenant SaaS)
    - HTTP gateway with signing verification: deploy a sidecar
      that validates X-Slack-Signature using the workspace's
      signing-secret and forwards verified requests to ODD; reject
      everything else

  Each option requires operator investment + ongoing maintenance.
  The live docs surface NONE of these options.

  ## THE FIX SURFACE — what a small remediation looks like

  A single change at EventApiController.handleSlackEvent that:
    (a) Adds a new config property
        `datacollaboration.slack-signing-secret` (REQUIRED when
        datacollaboration.enabled=true; fail-fast at boot if unset
        — mirror the existing slack-oauth-token pattern at
        DataCollaborationConfiguration.java:23-25)
    (b) Reads `X-Slack-Signature` + `X-Slack-Request-Timestamp`
        from `exchange.getRequest().getHeaders()`
    (c) Computes HMAC-SHA256(`v0:{timestamp}:{body}`,
        signing-secret) → hex, compares constant-time to the
        signature header
    (d) Rejects with 401 Unauthorized if mismatch OR if timestamp
        skew > 5 minutes

  Estimated 30-50 lines of code (handler change + new property +
  config validation). The operator-visible change is an additional
  required config property when enabling Data Collaboration. The
  doc-side cost is a documentation update naming the signing
  convention.

  ## SEVERITY HIGH

  The platform's inbound-webhook surface has the same trust-model
  gap that every other webhook protocol explicitly closes. The
  load-bearing observation: combined with the missing RBAC + the
  missing idempotency + the live docs publishing the request URL
  as part of the operator-facing install instructions, the
  endpoint is INSTRUCTED-TO-BE-PUBLIC by the docs but has NO
  AUTHENTICATION OF ORIGIN. Operators following the install
  guide land on a public unsigned webhook by design — same
  class-of-failure as LSN-001 (silent insecure default shipped
  in the install path).
