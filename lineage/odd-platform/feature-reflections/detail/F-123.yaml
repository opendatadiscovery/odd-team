# Platform-Wide Deletion Semantics Catalog — product-owner reflection

## product_owner_narrative

ODD Platform's **Management** section lets an operator delete the things they configure — datasources, collectors, owners, namespaces, RBAC roles and policies, the tag taxonomy, custom metadata fields (per the P-08 pillar "Primary user actions": create / edit / *delete* namespaces; issue / rotate tokens; create owners; curate tags; author roles + policies — `system-mission.md:225`). To the operator, "delete" is one verb with one mental model: the thing goes away, and if I made a mistake I can re-create it. **This feature is the catalog of how that single verb actually behaves, resource by resource — and the headline finding is that it does NOT behave as one verb.** There is no single deletion contract: there are three distinct mechanisms wearing the same "Delete" button (per the feature flow's `three_distinct_soft_delete_mechanisms_no_schema_level_documentation` facet, evidenced across the contributing repository sidecars).

A user interacts with deletion entirely through the Management tabs: a "Delete" action on a row (Datasources, Collectors, Owners, Roles, Policies, Tags), and a separate "create" form on the same tab. There is no "deletion-semantics" surface, no "recover" affordance anywhere, and no warning text on any delete confirmation that says "this name will be permanently reserved" or "this is reversible." The user supplies an id (the row they clicked) and observes one of three outcomes: the row vanishes and the name frees up (the `deleted_at` soft-delete convergence — role, policy, datasource, namespace, tag, term, metadata_field, user_owner_mapping; per `ReactiveDataSourceRepositoryImpl` invariants and `V0_0_64`); the row vanishes but the name stays reserved forever (collector — FULL UNIQUE on `collector.name` per `V0_0_29:4`; the `owner` table — non-partial `name UNIQUE` per `concepts.yaml:256`; metadata_field INTERNAL — partial-unique missing `deleted_at` per `ReactiveMetadataFieldRepositoryImpl` invariants); or the row is physically gone with no history at all (ownership, token, dataset_field, every M:N join — hard-delete, per `ReactiveOwnershipRepositoryImpl.java:85-91` and `ReactiveDatasetFieldRepositoryImpl` invariant 1).

The working parts an operator would describe in a demo: (1) **cascade-block** — deleting a datasource/collector/owner/namespace is rejected with `CascadeDeleteException` if dependents exist (`ReactiveDataSourceRepositoryImpl` `existsByCollector`/`existsByNamespace`; `OwnerServiceImpl.delete` via `existsByOwner`), which the operator *can* see and act on; (2) **recreate-after-delete** — works for the `deleted_at` family (the partial-unique index `WHERE deleted_at IS NULL` frees the name slot), silently fails for collector/owner/metadata-field; (3) **token lifecycle** — a soft-deleted Collector or Datasource leaves its TOKEN row orphaned forever (the `token` table has no `deleted_at` per `V0_0_28:1-9`), and token *regeneration* mutates the row in place, destroying the prior secret with no grace period (`ReactiveDataSourceRepositoryImpl` bugs_limitations_corner_cases + `ReactiveCollectorRepositoryImpl` invariant 7); (4) **DataEntity's four-state machine** — `status='DELETED'` then `deleted_at` then physical purge, driven by two `@Scheduled` jobs on separate cadences (`DataEntityStatusSwitchJob` 10min + `HousekeepingJobManager` 15min, the latter holding a 14-minute ShedLock — `HousekeepingJobManager.md`) that per F-121 share a single-thread executor and can stall.

The integration story is cross-cutting: this catalog is the substrate the **RBAC lifecycle** (P-09 — role/policy soft-delete), **Discovery** (P-01 — data_entity status + deleted_at read predicates), **Collector Lifecycle** (F-020), **Token Housekeeping** (F-125), and **Owner-Association** (F-076 cascade completeness) all inherit. A reader of any one of those features cannot tell, from that feature alone, which deletion mechanism applies — which is exactly why the catalog exists as its own feature.

The edge case a product owner would flag first in a demo (and the case-law this reflection is built to surface): an operator who deletes a collector named `prod-snowflake` after a typo, then tries to re-create `prod-snowflake`, gets a hard error that looks identical to the error they'd get creating a genuine duplicate — but the cause is a soft-deleted ghost row they cannot see, cannot recover, and cannot clear without raw DBA SQL. The same operator deleting and re-creating a *role* named `prod-snowflake` succeeds. Nothing on screen and nothing in the docs explains the difference.

## hypotheses

- id: H-001
  hypothesis: "When an operator deletes a DataSource (or Role, Policy, Namespace, Tag, Term) and then creates a new one with the same name, the create SUCCEEDS — the deleted resource's name is freed for reuse."
  derivation: "The `deleted_at` convergence (V0_0_64) added partial unique indexes `WHERE deleted_at IS NULL` to these tables; a soft-deleted row is excluded from the uniqueness constraint."
  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      For the `deleted_at`-family tables, `delete(id)` is `UPDATE … SET deleted_at = NOW()`
      (soft-delete base class), and the partial unique index `data_source_name_unique ON
      data_source(name) WHERE deleted_at IS NULL` (V0_0_31:27) / `role_name_unique …
      WHERE deleted_at IS NULL` (V0_0_55:42 + V0_0_64:88-90) / `tag_name_unique …
      WHERE deleted_at IS NULL` (V0_0_64:103-105) excludes the dead row. A new create
      with the same name does not collide. The live Management doc independently states
      this for namespace ("soft-deleted and re-created with the same name later").
    evidence:
