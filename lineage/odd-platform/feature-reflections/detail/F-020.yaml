# Collector Lifecycle Management — product-owner reflection

## product_owner_narrative

Collector Lifecycle Management is the operator-facing surface under **Management → Collectors** (`/management/collectors`) where an operator registers the metadata collectors that feed the catalog, issues and rotates their authentication tokens, and retires collectors that are no longer in use. It is, in product terms, the credential desk for the whole ingestion pillar: a collector cannot push metadata to ODD until an operator has minted it here and handed it the secret it presents on every ingestion call (per `CollectorsList.md:understanding` + the feature-flow `description`). The `system-mission.md` P-08 daily-ops sequence lists Collectors as the second-most-frequently-used operator surface after Datasources — this is a screen operators live in.

A user interacts with five capabilities, all composed on one page by `CollectorsList.tsx` plus its siblings `CollectorForm.tsx` (the create/edit modal), `CollectorItem.tsx` (the per-row card), and `CollectorItemToken.tsx` (the token-display strip): **Register** a collector (`POST /api/collectors`, gated by `COLLECTOR_CREATE`) — which mints a row and auto-issues a 40-character plaintext token shown once; **Edit** name/description/namespace (`PUT /api/collectors/{id}`, `COLLECTOR_UPDATE`) — the form deliberately has no token field; **Delete** (`DELETE /api/collectors/{id}`, `COLLECTOR_DELETE`); **Regenerate** the token (`PUT /api/collectors/{id}/token`, `COLLECTOR_TOKEN_REGENERATE`); and **List/search** (`GET /api/collectors/list`), which has no permission rule at all (per `CollectorController.md:concepts.invariants[1]` + `regenerateCollectorToken.md`). The form collects three fields (name required, namespace via an autocomplete, description optional); the token is server-owned end-to-end (per `CollectorsList.md:implicit_adrs[2]`).

The working parts an operator would expect to reason about: a permission model that mirrors what the backend enforces, so hiding a button means the action is forbidden; a token that is a real, rotatable, revocable secret; a "regenerate" action that swaps the secret cleanly; and an edit form that changes the field you touched. A senior product owner would also expect the credential desk to keep an audit trail (who minted/rotated/deleted which collector and when) and to behave the same way whether the deployment runs with authentication on or off. The token-display surface itself was reviewed at primary source (`ui_review_2026_05_26`, status `ui-complete`) — the reveal/mask/copy/regenerate UX is real and graduated its cross-surface pattern to F-163, so this reflection is NOT API-only; it judges what the operator sees on screen.

This feature lives inside Management (P-08) but **feeds** Integrations & Ingestion (P-10): the token minted here is the credential the always-on `IngestionDataSourceFilter` (on `POST /ingestion/datasources`) and the opt-in `IngestionDataEntitiesFilter` (on `POST /ingestion/entities`, default-off per `application.yml:48`) both consume (per F-008 cross-pillar block + `ReactiveCollectorRepositoryImpl.md:coupling`). It also **feeds** Security (P-09): the four COLLECTOR_* permissions are wired in `SecurityConstants.SECURITY_RULES`, and the UI's `WithPermissions` HOC is the UX mirror of that registry. The repository sidecar names the load-bearing seam: a single persistence bean (`ReactiveCollectorRepositoryImpl`) serves BOTH the catalog-mutation path and the always-on ingestion auth path, with no in-file marker of the divergence.

The edge cases a product owner would put in the demo are exactly the ones that turn out to be surprising and load-bearing: what an operator sees on the SHIPPED default deployment (the UI looks locked-down while the API is wide open — the headline contradiction); what happens to the token after the page reloads (it is gone — masked to `******{last6}`, recoverable only by rotation, which invalidates it everywhere); what happens to in-flight ingestion the moment a token is rotated (immediate 401, no grace window); what happens to the description when an operator edits just the name (it is silently nulled — full-replace, not patch); and what survives a collector deletion (the plaintext token row, orphaned forever in the `token` table, in every backup). None of these is visible from the screen, and most are now documented as caveats (DOC-252, done) rather than fixed.

