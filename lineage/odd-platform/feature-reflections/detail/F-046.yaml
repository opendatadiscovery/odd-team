- id: H-008
  hypothesis: |
    When two users concurrently save a value under the SAME brand-new field name, the catalogue ends up
    with exactly one field row and both saves succeed.
  derivation: |
    Negative-space + concurrency: the get-or-create path is read-then-write (listByKey then bulkCreate);
    a naive implementation races.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The UI tier uses plain inherited bulkCreate with NO ON CONFLICT clause (unlike the ingestion path's
      idempotent ingestData). Two concurrent createMetadata requests with the same novel
      (name, type, INTERNAL) key both pass listByKey ("absent"), both INSERT; the second collides on
      IX_UNIQUE_INTERNAL_NAME and raises UniqueConstraintException → the losing user's ENTIRE createMetadata
      operation rolls back (DataEntityServiceImpl.createMetadata is @ReactiveTransactional). Exactly one row
      results, but the loser's whole metadata save fails, not just the field mint.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveMetadataFieldRepositoryImpl
