terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Housekeeping DELETEs + partition CREATEs + status UPDATEs + session
    cleanup DELETEs against PostgreSQL. Cron-misfire failure mode:
    PostgreSQLPartitionCreationJob's daily 00:01 partition CREATE-TABLE-IF-NOT-EXISTS
    deferred behind a long housekeeping cycle → if queue exceeds 23:59:59 of
    the partition's first-use day, INSERTs against ACTIVITY / MESSAGE fail
    with `no partition exists for the given key`.
  evidence:
    - "HousekeepingJobManager (15-min cycle)"
    - "PostgreSQLPartitionCreationJob (daily 00:01)"
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
    - drift_class: single_thread_executor_default_undocumented
      description: |-
        Spring's default TaskScheduler poolSize=1 is the deployed reality;
        operator docs at `docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#housekeeping`
        mention the 15-minute housekeeping cadence + ShedLock multi-instance
        coordination but do NOT mention single-thread executor OR the
        `spring.task.scheduling.pool.size` knob. Mitigation is one line of
        YAML; documenting it is the substantive gap.
      evidence:
        - "SchedulingConfiguration.java:12-26 (no @Bean TaskScheduler)"
        - "application.yml (zero spring.task.* keys)"
        - "WebFetch docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#housekeeping (verified 2026-05-26 status 200)"
    - drift_class: cron_misfire_partition_creation_blocked_behind_housekeeping
      description: |-
        PostgreSQLPartitionCreationJob daily 00:01 cron creates next-day
        ACTIVITY / MESSAGE partitions. If long housekeeping runs past
        00:01 — and the four jobs share ONE thread — the partition CREATE
        is queued. Spring's default `MissedTaskBehavior` is queue-and-execute-ASAP
        (PROBE-NEEDED per SchedulingConfiguration sidecar P-183). If queue
        exceeds 23:59:59 of partition's first-use day, INSERT failures cascade
        with no obvious cause.
      evidence:
        - "PostgreSQLPartitionCreationJob.java:40 (@Scheduled cron 0 1 0 * * *)"
        - "HousekeepingJobManager.java:25 (@SchedulerLock lockAtLeastFor 14m)"
    - drift_class: session_housekeeping_lacks_schedulerlock_asymmetric_pattern
      description: |-
        PostgreSQLSessionHousekeepingJobHandler is `@Scheduled` WITHOUT
        `@SchedulerLock` — runs on EVERY replica simultaneously every hour.
        Today the DELETE-by-expired-timestamp is idempotent so operationally
        harmless; convention violation is real. A new maintainer adding a
        `@Scheduled` method may copy this pattern and inherit the gap. The
        `@EnableSchedulerLock(defaultLockAtMostFor="1h")` NAME promises
        "enable scheduler lock" but mechanically only enables the AOP
        advisor — bare `@Scheduled` is not locked.
      evidence:
        - "PostgreSQLSessionHousekeepingJobHandler.java:13-18 (no @SchedulerLock)"
        - "SchedulingConfiguration.java (@EnableSchedulerLock defaultLockAtMostFor=1h — dead code today)"
    - drift_class: defaultlockatmostfor_one_hour_dead_code
      description: |-
        `@EnableSchedulerLock(defaultLockAtMostFor="1h")` is DEAD CODE today —
        all three `@SchedulerLock`-annotated methods (housekeeping 14m,
        status-switch 9m, partition-creation 10m) declare their own
        `lockAtMostFor`. Latent safety floor only.
      evidence:
        - "SchedulingConfiguration.java:12-26"
    - drift_class: graceful_shutdown_lock_held_for_lockatmostfor_window
      description: |-
        `kubectl delete pod` mid-housekeeping rolls back the in-flight jOOQ
        transaction (safe) but leaves the shedlock row held until
        lockAtMostFor expires (~14min). No replica can run housekeeping
        during the lock-hold window. `spring.task.scheduling.shutdown.await-termination`
        is unset; Spring default interrupts running threads.
      evidence:
        - "HousekeepingJobManager @SchedulerLock(lockAtMostFor=14m)"
    - drift_class: no_lockprovider_or_executor_micrometer_metrics
      description: |-
        ShedLock LockProvider has NO Micrometer instrumentation; lock-acquisition
        outcomes + lock-hold duration are not surfaced. ThreadPoolTaskExecutor
        active threads + queued tasks similarly invisible. Operators cannot
        answer "is replica B failing to acquire because replica A is holding?"
        from metrics.
      evidence:
        - "SchedulingConfiguration.java (entire — no MeterBinder)"
use_cases:
  # LSN-030 / feature-reflector v0.3.0 (Rule 11) — the executor's PROMISE LAYER, projected from the
  # F-121 reflection (lineage/odd-platform/feature-reflections/detail/F-121.yaml, hypotheses H-001..H-011).
  # The "actor" is the platform-operator (P-08); there is no UI surface (infra feature — Rule 9). The full
  # hypothesis + validation lives in the reflection; this is the compact projection the test-coverage-mapper
  # Step 2b reads. coverage=verified ONLY where a real test for the promise exists.
  - uc_id: F-121-UC-001
    kind: render
    promise: "The four background jobs run on independent threads — a long housekeeping cycle does not starve the status-switch or partition-creation jobs."
    actor: platform-operator
    trace: "SchedulingConfiguration.java:12-26 (no @Bean TaskScheduler) + application.yml (no spring.task.scheduling.pool.size) -> Spring default poolSize=1 -> the four @Scheduled jobs serialise"
    coverage: unverified
    test_demand: "functional (TEST-GAP pending mint): two @Scheduled beans sleeping 20s, both due at once; assert the second is delayed ~20s under shipped config and runs concurrent once pool.size>=2"
  - uc_id: F-121-UC-002
    kind: cross-actor
    promise: "A ShedLock-guarded job never runs concurrently on two replicas within its scheduled window."
    actor: platform-operator
    trace: "SchedulingConfiguration.java:18-25 (.usingDbTime LockProvider) confirms atomic acquisition; HousekeepingJobManager.java:25-26 (lockAtMostFor=14m vs fixedRate=15m, 60s slack) is the breach condition for a >=14m cycle"
    coverage: unverified
    test_demand: "functional (TEST-GAP pending mint): Testcontainers + 2 JVMs; inject a 15-min sleep into one housekeeping job on replica A; assert replica B does not acquire while A holds AND surfaces the 14m/15m overrun breach"
  - uc_id: F-121-UC-003
    kind: cross-actor
    promise: "On a simultaneous two-replica lock race, exactly one wins and the loser no-ops cleanly with no error."
    actor: platform-operator
    trace: "SchedulingConfiguration.java:18-25 (atomic INSERT-OR-UPDATE on shedlock PK + usingDbTime) — PROBE-NEEDED (sidecar P-182 / reflection PENDING-F-121-1)"
    coverage: unverified
    test_demand: "functional (TEST-GAP pending mint) + probe PENDING-F-121-1: 2 JVMs boot simultaneously; assert one wins, loser no-ops, winner lock_until ≈ PG now()+14m (pins usingDbTime)"
  - uc_id: F-121-UC-004
    kind: resolve-later
    promise: "The activity/message partition for the next day always exists before INSERTs need it."
    actor: platform-operator
    trace: "partition/PostgreSQLPartitionCreationJob.java:29-51 (@PostConstruct boot creation behind leader-election lock + nightly cron) + 60-day-forward partition width (ActivityTablePartitionManager.java:11) blunt the cron-misfire INSERT-failure blast radius — PROBE-NEEDED (sidecar P-183 / reflection PENDING-F-121-2)"
    coverage: unverified
    test_demand: "functional (TEST-GAP pending mint) + probe PENDING-F-121-2: assert next-day partition exists at boot independent of cron; then a long housekeeping past 00:01 — assert INSERT still succeeds via the 60-day-forward window"
  - uc_id: F-121-UC-005
    kind: cross-actor
    promise: "Expired Spring sessions are purged exactly once per hour cluster-wide (coordinated like the other three jobs)."
    actor: platform-operator
    trace: "PostgreSQLSessionHousekeepingJobHandler.java:13-18 (NO @SchedulerLock) — CONTRADICTED: runs N-fold on N replicas; tracked PLT-083 Defect 2 + DOC-250 Caveat 4 (done)"
    coverage: verified
    test_ref: "DOC-250 Caveat 4 (done, live-verified 2026-06-03) documents the asymmetry; code fix PLT-083"
  - uc_id: F-121-UC-006
    kind: grammar
    promise: "@EnableSchedulerLock means every @Scheduled job in the platform is leader-elected."
    actor: platform-operator
    trace: "SchedulingConfiguration.java:14 + PostgreSQLSessionHousekeepingJobHandler.java:13-18 — CONTRADICTED: @SchedulerLock is opt-in per method; the session job is unguarded; tracked PLT-083"
    coverage: verified
    test_ref: "config.FeatureGatingDefaultsTest (gating-default family) + DOC-250 Caveat 4; code fix PLT-083"
  - uc_id: F-121-UC-007
    kind: happy-path
    promise: "Multi-replica ShedLock coordination is correct under JVM clock skew (lock validity judged by PostgreSQL's clock)."
    actor: platform-operator
    trace: "SchedulingConfiguration.java:22 (.usingDbTime()) — CONFIRMED; lock_until/locked_at written from PG current_timestamp, neutralising cross-replica clock drift"
    coverage: unverified
    test_demand: "functional (TEST-GAP pending mint): Spring-context test asserting the LockProvider is a JdbcTemplateLockProvider configured with usingDbTime (guards a silent refactor to a non-DB-time provider)"
  - uc_id: F-121-UC-008
    kind: grammar
