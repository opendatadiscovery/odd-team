notes: |-
  **STRENGTHENED batch 2026-05-19M with controller-layer PRIMARY-SOURCE
  confirmation**. The operation is now characterised at both the service
  tier (batch I) and the controller tier (batch M); ten distinct
  bugs/limitations are documented across the two sidecars.

  Five headline test + doc + code gaps surface:

    (a) NO unit test on this method exists in LineageServiceTest.java;
        NO controller-boundary test exists either. The DEG-lineage path
        is entirely untested at every layer.

    (b) Doc: operator-facing feature page does not document the inner-DEG
        suppression behaviour; third-party caller building tooling on
        getDataEntityGroupsLineage for a DEG containing nested DEGs will
        silently observe missing edges.

    (c) Code: getRelationsForEntities is tail-recursive but Java has no
        TCO; for wide-component DEGs this can blow the stack. A defensive
        iteration-based BFS would close.

    (d) **NEW batch M** — 404 error message conflates three distinct
        conditions; operators debugging "why is my DEG-lineage call
        returning 404?" cannot discriminate DEG-not-found vs
        DEG-has-no-members vs non-DEG-typed-ID.

    (e) **NEW batch M** — bidirectional edge filter silently drops
        edges exiting / entering the DEG boundary; operators viewing a
        DEG lineage cannot tell that "this DEG has external context";
        the UI affordance for the external context is to open the
        per-entity lineage endpoint on individual members, but the
        DEG-lineage view itself does not surface that there IS external
        context.

