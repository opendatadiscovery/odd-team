name: Jotai Feature-Scoped Store (per-feature atom store inside a nested Provider)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-11
description: |-
  A consistently-applied per-feature client-state convention in odd-platform-ui:
  a feature mounts its OWN bare `jotai` `<Provider>` (a thin wrapper named
  `{Feature}AtomProvider`, almost byte-identical across features), and its
  atoms RESOLVE against that nested scope rather than jotai's global default
  store. NEW concept, batch ZC (2026-05-22).

  The decision makes the feature's state feature-local + mount-lifetime-bound:
  navigating away from the feature destroys the Provider and the next visit
  starts a fresh atom scope. The convention diverges from the redux +
  redux-thunk store the rest of `odd-platform-ui` uses (the `handle-response-
  async-thunk-pattern` concept records the global redux side of the divide).
  Four feature areas use this jotai-store convention: OwnerAssociations,
  DEGLineage, DatasetStructure (Overview + Compare), and DataQuality —
  26 files importing `jotai` across the four areas, all wrapping their
  subtree in an `{Feature}AtomProvider`.

  Provider shape (byte-for-byte identical across features):
    `const {Feature}AtomProvider: React.FC<React.PropsWithChildren> =
       ({ children }) => <Provider>{children}</Provider>;`

  Stores typically expose:
    - one or more source-of-truth atoms (e.g. `formFiltersAtom`)
    - derived read-only atoms via `atom(get => ...)` projecting source state
      into another shape (e.g. `filtersAtom` projecting form state into
      the request shape consumed by the fetch hook)
    - write-only "action" atoms via `atom(null, (get, set) => ...)`
      (e.g. `clearTableFiltersAtom`, `clearTestFiltersAtom`) — used for
      multi-key resets and other mutation patterns the source atom cannot
      express ergonomically
    - sometimes a `getFieldFilterAtom(key)` focused-atom factory for
      per-key subscriptions (DataQualityStore exports one but DataQualityFilters
      does not USE it — see the `dashboard-filter-panel` weakness)

  vocabulary_status: codebase-anchored. The convention is purely a UI
  architectural choice; it is not user-facing and is not named anywhere in
  the live ODD docs. Surface a CANONICALISATION CANDIDATE — worth recording
  in a future maintainer-facing UI architecture page if one is ever authored.
vocabulary_status: codebase-anchored
