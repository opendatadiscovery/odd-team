name: Resolve Current Principal and Associated Owner
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW OPERATION, batch 2026-05-19K** — the per-request identity-resolution
  operation that turns the active Spring SecurityContext into a UserDto +
  UserProviderRole + OwnerPojo. The operation is implemented as three
  parameter-less reactive Monos on `AuthIdentityProviderImpl` (the sole
  implementation of `AuthIdentityProvider`):
    1. **`getCurrentUser()`** — `ReactiveSecurityContextHolder.getContext()`
       → `SecurityContext::getAuthentication` → if `OAuth2AuthenticationToken`,
       construct `UserDto(name, authorizedClientRegistrationId)`; else
       construct `UserDto(name, null)` (lines 25-34). The else-branch
       collapses LOGIN_FORM, LDAP, and S2S all into the null-provider
       bucket — the source of the cross-mode bleed invariant.
    2. **`getCurrentUserProviderRole()`** —
       `ReactiveSecurityContextHolder.getContext()` →
       `SecurityContext::getAuthentication` →
       `authorities.iterator().next().getAuthority()` →
       `UserProviderRole.valueOf(authority)` (lines 38-46). Reads ONLY
       the first GrantedAuthority; subsequent authorities silently
       dropped. Returns the enum ADMIN | USER.
    3. **`fetchAssociatedOwner()`** — `getCurrentUser()` chained via
       `.flatMap(user -> userOwnerMappingRepository.getAssociatedOwner(
       user.username(), user.provider()))` (lines 50-53). The
       downstream `getAssociatedOwner` issues `SELECT owner.* FROM
       user_owner_mapping JOIN owner ON user_owner_mapping.owner_id =
       owner.id WHERE oidc_username = ? AND deleted_at IS NULL AND
       (provider = ? OR provider IS NULL)` per
       ReactiveUserOwnerMappingRepositoryImpl.java:116-127.
  **All three Monos take NO Authentication parameter** — the principal is
  read inside this service via `ReactiveSecurityContextHolder.getContext()`.
  This is the ARCHITECTURAL ANCHOR for ADR-CANDIDATE-015. The 15 callsites
  span service-tier owner-scoped reads (SearchServiceImpl, AlertServiceImpl,
  DataEntityServiceImpl etc.) + permission/extractor classes
  (DataEntityPermissionExtractor etc.). **Empty-context contract**: if
  ReactiveSecurityContextHolder.getContext() emits empty (DISABLED mode +
  no ServerSecurityContextRepository; misordered WebFilter regression),
  ALL three Monos emit empty (not error). Downstream consumers degrade to
  empty results with HTTP 200, not 401/403/404. **No-cache contract**:
  every invocation goes through ReactiveSecurityContextHolder.getContext()
  AND (for fetchAssociatedOwner) a DB round-trip. Stateless / no-caching
  by deliberate omission per implicit_adrs.[3].
