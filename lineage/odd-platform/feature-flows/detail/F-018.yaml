  - facet_id: F-018-DRIFT-LSN019-listMostPopular-ranking
    facet: |-
      listMostPopular: NAME-vs-BEHAVIOUR drift — paginate-inside-CTE yields
      OLDEST-by-tag.id-ASC, NOT MOST-POPULAR-by-count when directory size
      exceeds the page size (LSN-019 SMOKING-GUN — Stress Protocol canary
      batch VAL-LSN-019)
    category: name-behavior-drift
    severity: HIGH
    headline: |-
      tagService.listMostPopular returns the oldest tags by tag.id ASC,
      not the most-popular by usage_count, when the directory size exceeds
      the page size. The OpenAPI spec promises 'sorted by popularity'.
    operator_visible_consequence: |-
      UI 'Top Tags' tile on the Catalog Overview shows the OLDEST tags in
      the directory when N > 30, regardless of usage. A newly-minted
      high-usage tag is INVISIBLE on /api/tags/popular page 1 until it
      becomes one of the oldest 30 by serial id — i.e., NEVER unless the
      directory shrinks. Catalog Search Tag facet (F-017 consumer) inherits
      the same ranking lie when seeded from this endpoint.
    observed: |-
      ReactiveTagRepositoryImpl.listMostPopular (lines 137-167) chain:
      (a) lines 144-145 build a homogeneous `selectFrom(TAG).where(conditions)`;
      (b) line 148 wraps with `paginate(homogeneousQuery,
      [OrderByField(TAG.ID, ASC)], (page-1)*size, size)` — JooqQueryHelper
      .paginate (`:63-90`) emits inner `ORDER BY tag.id ASC LIMIT size
      OFFSET (page-1)*size` BEFORE counts are computed; (c) line 150
      materialises this as `tag_cte`; (d) `getDataEntityWithDatasetFields`
      (`:373-391`) builds `WITH tag_cte AS (size-truncated-paginated-select)
      SELECT ... LEFT JOIN tag_to_data_entity GROUP BY tag_cte.fields
      UNION ALL ... LEFT JOIN tag_to_dataset_field GROUP BY tag_cte.fields
      AS union_usages`; (e) line 158 the outer `cteSelect.orderBy(field(
      COUNT_FIELD).desc())` re-ranks among the already-truncated window only.
      Empirical proof (`retrospectives/LSN-019:23-32`, 2026-05-20 maintainer
      test against demo.oddp.io): 35 tags created with known IDs; every
      entity tagged by all 35; size=30 → the 30 oldest tags (IDs 1-30) are
      returned in tag.id ASC order; the 5 newest tags (IDs 31-35) are
      missing from the response despite being equally popular.
    expected: |-
      Either (a) move ORDER BY usage_count DESC OUTSIDE the paginate
      (compute the count aggregate over the FULL directory then truncate),
      OR (b) update the OpenAPI description + UI label to honestly
      describe the actual behaviour ("Returns up to `size` of the oldest
      tags, re-ordered by usage_count desc within that window"). The
      method-name `listMostPopular` and the spec promise
      `'Gets the list of existing tags sorted by popularity'` ARE the
      operator-facing contract; the implementation cannot satisfy it.
    drift_class: name_behavior_drift_list_most_popular_paginate_inside_cte_yields_oldest_by_id_not_most_popular_by_count
    evidence:
    - 'ReactiveTagRepositoryImpl.java:148 — paginate(homogeneousQuery, [OrderByField(TAG.ID, ASC)], (page-1)*size, size) — inner pagination orders by tag.id ASC, LIMIT 30'
    - 'ReactiveTagRepositoryImpl.java:158 — outer cteSelect.orderBy(COUNT_FIELD.desc()) — only re-ranks the already-truncated window'
    - 'JooqQueryHelper.java:63-90 — the paginate primitive emits ORDER BY tag.id ASC LIMIT size BEFORE the count aggregation; the LIMIT happens on tag.id ASC'
    - 'odd-platform-specification/openapi.yaml:344-346 — spec promises ''sorted by popularity'''
    - 'TagController.java:36-44 + TagServiceImpl.java:72-77 — straight-through delegation; no re-sort at controller or service tier'
    - 'retrospectives/LSN-019:23-32 — maintainer''s 2026-05-20 empirical test: 35 tags all equally popular, size=30 → response = oldest 30 by tag.id ASC; 5 youngest absent'
    cross_references:
      retrospectives:
      - LSN-019
      probes:
      - P-010
      - P-LSN019-listMostPopular-drift
      refactoring_scopes:
      - 'REFACTOR-LSN019-listMostPopular-ranking (created by adr-archaeologist this batch — name-vs-behaviour mismatch + paginate-inside-CTE structural anchor)'
      doc_gaps:
      - 'DOC-GAP-LSN019-listMostPopular-ranking (created by doc-gap-finder this batch — OpenAPI spec `''sorted by popularity''` promise vs implementation; live tagging.md page silent on Top-Tags semantics)'
      test_gaps:
      - 'TEST-GAP-LSN019-listMostPopular-ranking (created by test-coverage-mapper this batch — TagRepositoryImplTest.testListMostPopular is structurally blind: uses containsExactlyInAnyOrder + size=numberOfTestTags so the LIMIT never fires)'
    provenance: |-
      MEASURED+STATIC — empirical confirmation 2026-05-20 (LSN-019:23-32);
      static trace through ReactiveTagRepositoryImpl.java:138-167 + JooqQueryHelper
      .java:63-90; promoted to F-018 headline drift facet by batch VAL-LSN-019
      (the LSN-019 Stress Protocol canary). Severity: HIGH — operator-visible
      ranking lie on the Catalog Overview Top-Tags tile + Catalog Search Tag
      facet. Pinned permanently by P-010 + P-LSN019-listMostPopular-drift.
