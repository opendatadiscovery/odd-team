behaviour: |-
  **HIGH — Generic webhook sends UNSIGNED, UNAUTHENTICATED payloads.** The `HttpRequest` construction at `WebhookNotificationSender.java:20-22` carries ONLY `.uri(...)` + `.POST(BodyPublishers.ofString(...))` + `.build()`. There is:
  - **NO `Authorization` header** — no Bearer token, no API key, no Basic auth.
  - **NO `X-ODD-Signature` / `X-Hub-Signature-256` / `X-Slack-Signature`-style HMAC** — no shared-secret-derived signature, no body hash, no replay-protection nonce.
  - **NO operator config knob** — no `notifications.receivers.webhook.secret`, no `notifications.receivers.webhook.headers.*`, no signing-algorithm option.
  - **NO User-Agent identifying ODD** — receivers cannot programmatically distinguish ODD alerts from any other tool POSTing to the same URL.

  **The threat model**:
  1. An attacker learns the webhook URL via:
     - `/actuator/env` exposure (Spring's default sanitisation does NOT mask the substring `url` — verified at Spring Boot framework level).
     - Deployment artefacts in CI/CD logs.
     - Leaked container images / Kubernetes ConfigMaps.
     - A stolen `application.yml` from a developer's laptop.
  2. The attacker POSTs a forged `AlertNotificationMessage`-shaped payload to the URL.
  3. The operator's receiver — built assuming "only ODD reaches this URL" — accepts the forged payload as legitimate.
  4. The receiver may trigger automated downstream actions: PagerDuty escalation, OpsGenie alert, automated rollback scripts, etc.

  **Comparison to industry standards**:
  - **GitHub Webhooks**: ship HMAC-SHA256 in `X-Hub-Signature-256` header. Receivers SHOULD reject mismatched signatures.
  - **Slack Events API**: ships HMAC-SHA256 in `X-Slack-Signature` header. Receivers MUST validate.
  - **Stripe Webhooks**: ship HMAC-SHA256 in `Stripe-Signature` header with timestamp.
  - **AlertManager Webhooks**: support `basic_auth`, `bearer_token`, `tls_config.client_cert_file` in `webhook_config`.
  - **ODD Generic Webhook**: ships NONE.

  **Operator mitigations available today** (none in-platform):
  - Deploy ODD and the receiver in a private network (eliminates external reach but doesn't prevent insider impersonation).
  - Place an HTTP gateway (nginx, envoy) between ODD and the receiver to inject auth headers — doubles deployment complexity.
  - Use mTLS at the network layer — ODD has NO config knob for client-side certs.
  - Use a unique URL per deployment + strict IP allowlist on receiver — relies on URL secrecy (the failure mode this gap addresses).

  **The live doc is SILENT on this**: per WebFetched live `/features/active-platform-features/notifications` (status 200, 2026-05-20), the webhook section describes the URL key and that "the platform POSTs the full alert payload (JSON)" but does NOT warn operators that ODD does not sign payloads OR recommend operator-side mitigations.

  **Test gap shape**: regression-pin asserting that the outbound POST has NO Authorization / Signature / HMAC headers. PINS the current vulnerability; pairs with REFACTOR-NNN adding `notifications.receivers.webhook.secret` + HMAC-SHA256 signing.
