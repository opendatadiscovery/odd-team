terminal_side_effect:
  side_effect_class: db-write
  description: |-
    INSERT row into data_entity_to_term with is_description_link=false
    (ADD path), OR HARD DELETE row from data_entity_to_term filtered by
    is_description_link=false (DELETE path, batch L). Both paths emit
    TERM_ASSIGNMENT_UPDATED activity event (DELETE path emits even on
    no-op zero-row deletion — BEFORE=AFTER audit noise).
  evidence: |-
    ADD: TermServiceImpl.linkTermWithDataEntity (lines 170-179) +
    ReactiveTermRelationsRepository INSERT. DELETE: TermServiceImpl.removeTermFromDataEntity
    (lines 181-196) + TermRelationsRepositoryImpl.deleteRelationWithDataEntity
    (lines 80-88) — HARD DELETE via DSL.deleteFrom(...).
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: permission-gate enforcement under DISABLED
    observed: anonymous caller successfully creates term-link; data_entity_to_term row appears with no auth check
    expected: either documented anonymous-OK posture OR 401/403
    drift_class: auth_layer_hides_endpoint
    provenance: MEASURED — P-005 (run R-20260519T011344Z-P-005) created a term + POSTed the link as anonymous; observed final_term_count
      - initial_term_count == 1
  - facet: description-edit auto-link side-channel bypasses DATA_ENTITY_ADD_TERM (batch K — PRIMARY-SOURCE)
    observed: |-
      TermServiceImpl.handleDataEntityDescriptionTerms (lines 201-207) is
      invoked from DataEntityServiceImpl.upsertDescription (line 328) whenever
      a description body contains `[[ns:term]]` mentions. The regex
      `\[\[([^:]*?):([^\]]*?)\]\]` at TermServiceImpl.java:67 parses mentions
      and synthesises `DataEntityToTermPojo` rows with
      `is_description_link=TRUE` via the `*_unhandled_term` staging tables.
      A user holding ONLY `DATA_ENTITY_DESCRIPTION_UPDATE` (the gate on PUT
      /api/dataentities/{id}/description) can paste `[[finance:Customer]]`
      into a description and create term-link rows — `DATA_ENTITY_ADD_TERM` is
      NEVER consulted on this path. Even if REFACTOR-217 (the /term vs /terms
      path mismatch on the direct endpoint) were fixed, this side-channel
      would remain — the auto-link path is service-tier, not controller-tier.
    expected: |-
      Either a service-tier permission check inside handleDataEntityDescriptionTerms
      (consult `DATA_ENTITY_ADD_TERM` before INSERTing the link rows) OR a
      documented "description-mention is part of DATA_ENTITY_DESCRIPTION_UPDATE's
      scope" framing in the Business Glossary doc.
    drift_class: description_edit_auto_link_side_channel
    provenance: STATIC — primary-source in batch K TermServiceImpl sidecar
      bugs_limitations_corner_cases[2] + security.known_security_gaps[2] +
      TermServiceImpl.java:201-207, 67 + DataEntityServiceImpl.java:323-333 +
      SecurityConstants.java:194-197 (the description-update gate) +
      SecurityConstants.java:237-239 (the link-term gate the side-channel bypasses)
  - facet: second independent SecurityConstants bug — /api/alerts/{id}/status PUT gated by DATASET_FIELD_ADD_TERM
    observed: |-
      SecurityConstants.java:295-296 registers
      `new SecurityRule(ALERT, new PathPatternParserServerWebExchangeMatcher(
      "/api/alerts/{alert_id}/status", PUT), DATASET_FIELD_ADD_TERM)` — a Term
      permission applied to an alert-status path. Almost certainly a
      copy/paste error: the AlertController.changeAlertStatus endpoint should
      gate on `DATA_ENTITY_ALERT_RESOLVE`. Effect: an operator with
      `DATASET_FIELD_ADD_TERM` can change alert statuses on any data entity;
      an operator with `DATA_ENTITY_ALERT_RESOLVE` (the named permission for
      that operation) cannot.
    expected: |-
      `SecurityRule(... , DATA_ENTITY_ALERT_RESOLVE)` at SecurityConstants.java:295-296
      replacing the misrouted permission.
    drift_class: second_security_constants_misrouted_path
    provenance: |-
      STATIC — primary-source in batch K TermServiceImpl sidecar
      understanding (the headline finding) + bugs_limitations_corner_cases[1] +
      security.known_security_gaps[1] + SecurityConstants.java:295-296.
      Cross-reference: AlertController sidecar should be augmented with this finding.
  - facet: zero service-tier permission checks (architectural)
    observed: |-
      TermServiceImpl performs NO `@PreAuthorize`, no programmatic
      `permissionService.hasPermission(...)`, no role gate, no policy lookup
      at the service layer. All authorization is supposed to happen at the
      controller perimeter via SecurityConstants.SECURITY_RULES matchers in
      AuthorizationCustomizer. Per REFACTOR-217 the controller-tier gate does
      NOT fire for POST/DELETE /api/dataentities/{id}/terms — making the
      entire term-linkage surface effectively unauthenticated-mutation-allowed
      under DISABLED + read-collaborative-with-no-gate under LOGIN_FORM/OAUTH2/LDAP.
    expected: |-
      Defence-in-depth: service-tier permission checks as a backstop against
      controller-tier path-mismatch bugs. Or alternatively, an integration test
      that asserts SecurityConstants paths match every OpenAPI path (preventing
      the singular/plural divergence class entirely).
    drift_class: no_service_tier_permission_checks
    provenance: STATIC — primary-source in batch K TermServiceImpl sidecar
      security.authorization_assertions + the absence of any `@PreAuthorize` in TermServiceImpl
  - facet: TermAssignmentActivityHandler triple-re-query (REFACTOR-228 PRIMARY-SOURCE)
    observed: |-
      `removeTermFromDataEntity` (TermServiceImpl.java:184-196) emits
      `TERM_ASSIGNMENT_UPDATED`; `TermAssignmentActivityHandler.getContextInfo`
      re-queries `getDataEntityTerms` (1st full-list) BEFORE method execution;
      the method itself calls `getDataEntityTerms` at line 188 (2nd full-list,
      drives the markEntityUnfilled decision); the handler's `getUpdatedState`
      re-queries AGAIN (3rd full-list) AFTER. For a data entity with 100
      linked terms, a single de-link produces 3 full-list re-queries plus 1
      DELETE. Same pattern applies to `removeTermFromDatasetField` (lines 226-239).
    expected: |-
      Cache the BEFORE state in the activity-feed AOP context so getUpdatedState
      can compute the diff without a re-query, OR fold the markEntityUnfilled
      decision into the BEFORE-state query (already fetching the full list).
    drift_class: term_assignment_handler_triple_re_query
    provenance: STATIC — REFACTOR-228 PRIMARY-SOURCE in batch K TermServiceImpl
      sidecar bugs_limitations_corner_cases[4] + TermServiceImpl.java:184-196 +
      TermAssignmentActivityHandler.java:30-43
  - facet: TAG_CREATE bypass via upsertTags
    observed: |-
      TermServiceImpl.upsertTags (line 257) calls `tagService.getOrCreateTagsByName(names)`
      which creates new tags as needed — bypassing the `TAG_CREATE` permission
      that gates `POST /api/tags`. Cross-ref: same pattern in OwnerController#createOwner
      and the broader `getOrCreate*` family across the platform.
    expected: |-
      Either consult `TAG_CREATE` inside `tagService.getOrCreateTagsByName` (move
      the gate from the controller perimeter to the upsert primitive) OR document
      "TERM_TAGS_UPDATE includes tag-create scope" explicitly.
    drift_class: tag_create_bypass_via_upsert_tags
    provenance: STATIC — primary-source in batch K TermServiceImpl sidecar
      bugs_limitations_corner_cases[10] + TermServiceImpl.java:257
  - facet: NAMESPACE_CREATE bypass via createTerm / updateTerm
    observed: |-
      TermServiceImpl.createTerm (line 103) and .updateTerm (line 138) call
      `namespaceService.getOrCreate(name)` — silently creating namespaces when
      the caller-supplied name is novel. Bypasses the `NAMESPACE_CREATE`
      permission that protects POST /api/namespaces.
    expected: |-
      Either consult `NAMESPACE_CREATE` inside `namespaceService.getOrCreate`
      OR document the `TERM_CREATE / TERM_UPDATE` permissions as inclusive of
      namespace-create scope.
    drift_class: namespace_create_bypass_via_get_or_create
    provenance: STATIC — primary-source in batch K TermServiceImpl sidecar
      bugs_limitations_corner_cases[10] + TermServiceImpl.java:103, 138
  - facet: cross-namespace term pollution / no per-tenant scoping
    observed: |-
      Neither TermServiceImpl nor ReactiveTermRepositoryImpl references
      `odd.tenant-id` or any tenant scoping. `getByNameAndNamespace(List)`
      (ReactiveTermRepositoryImpl.java:162-179) joins `term` and `namespace`
      with NO tenant filter. A description in team-A's namespace that
      references `[[team-B-ns:term]]` silently auto-links to team-B's term.
    expected: |-
      Per-tenant or per-namespace scoping at the service or repository layer
      OR documented "the namespace concept is informational, not isolating"
      framing.
    drift_class: cross_namespace_term_pollution
    provenance: STATIC — primary-source in batch K TermServiceImpl sidecar
      bugs_limitations_corner_cases[3] + ReactiveTermRepositoryImpl.java:162-179 +
      TermServiceImpl.java:350-359
  - facet: linkTermWithDataEntity vs linkTermWithDatasetField asymmetric on duplicate-INSERT
    observed: |-
      `linkTermWithDataEntity` (TermServiceImpl.java:173-174) translates the
      empty INSERT result to `BadUserRequestException 'Term already assigned
      to data entity'`. `linkTermWithDatasetField` (line 215) has NO
      `.switchIfEmpty` — a duplicate INSERT silently succeeds, returning an
      empty Mono that flatMaps onwards into
      `termRepository.getTermRefDto(relation.getTermId())` with `relation==null`
      (NullPointerException risk).
    expected: |-
      Symmetric `.switchIfEmpty` on both link methods — either both emit 400
      on duplicate OR both silently succeed (idempotent semantics) with a
      documented contract.
    drift_class: asymmetric_duplicate_insert_handling
    provenance: STATIC — primary-source in batch K TermServiceImpl sidecar
      bugs_limitations_corner_cases[5] + TermServiceImpl.java:173-174 vs 215
  - facet: SYMMETRIC DELETE path mismatch — REFACTOR-217 covers BOTH halves
    observed: |-
      DELETE /api/dataentities/{data_entity_id}/terms/{term_id} (PLURAL
      per openapi.yaml:1042) is gated by SecurityRule at
      SecurityConstants.java:240-242 registered with PathPatternParserServerWebExchangeMatcher
      for SINGULAR `/api/dataentities/{data_entity_id}/term/{term_id}`.
      The mismatch is symmetric with the ADD endpoint (batch G):
      AuthorizationCustomizer.customize (AuthorizationCustomizer.java:24-30)
      only invokes the manager(...) permission check when `rule.matcher()`
      matches — the singular `term/{term_id}` matcher does NOT match the
      plural `terms/{term_id}` URL. The customizer's fallback at lines
      29-30 is `.pathMatchers("/**").authenticated()` — any authenticated
      user passes. Net effect: ANY authenticated user under
      LOGIN_FORM/OAUTH2/LDAP can DELETE any term-to-data-entity relation
      regardless of their Policy set. REFACTOR-217 (the upstream backlog
      item) covers BOTH POST and DELETE in one fix — changing the
      SecurityRule path strings to plural. Live Permissions doc WebFetched
      2026-05-19 status 200 documents the permission verbatim
      ("DATA_ENTITY_DELETE_TERM: Allows removing a term from a data
      entity"); the doc describes the intended access model — the
      code wiring is wrong.
    expected: |-
      Change `SecurityConstants.java:240-242` to register the path as
      `/api/dataentities/{data_entity_id}/terms/{term_id}` (PLURAL) +
      add a WebFluxTest regression that asserts a no-permission user
      receives 403 for DELETE.
    drift_class: symmetric_delete_path_mismatch_refactor_217
    provenance: |-
      STATIC — primary-source in batch L deleteTermFromDataEntity sidecar
      understanding (the headline finding) +
      bugs_limitations_corner_cases[0] +
      security.known_security_gaps[0] + SecurityConstants.java:240-242 +
      openapi.yaml:1042 + DataEntityController.java:158-163 +
      AuthorizationCustomizer.java:24-30. Severity: HIGH.
  - facet: HARD-DELETE finality — no audit-restore path
    observed: |-
      Once a term-relation is removed via this endpoint, the only record
      of its prior existence is the TermAssignmentActivityHandler
      BEFORE/AFTER JSON state in `activity` rows. The row in
      `data_entity_to_term` is PHYSICALLY GONE — migration
      V0_0_76__term_relations_hard_delete.sql:1-6 dropped the
      `deleted_at` column AND deleted any rows where `deleted_at IS NOT
      NULL` (irreversibly). An operator wanting to restore a removed
      term-link must inspect the activity log and re-issue an
      addDataEntityTerm call (which writes a NEW row, not a
      restoration — the relation has no continuity-id). For high-stakes
      deployments with extensive term taxonomies, accidental removals
      via the path-mismatch-bug-enabled unauthorized caller require
      manual restoration via API calls.
    expected: |-
      Either: (a) re-introduce a soft-delete column with a documented
      restore endpoint, OR (b) keep the HARD-DELETE finality and
      document the constraint operationally ("Term-link removal is
      permanent; restore requires re-link via the add endpoint").
    drift_class: hard_delete_finality_no_audit_restore_path
    provenance: |-
      STATIC — primary-source in batch L sidecar implicit_adrs[1] +
      bugs_limitations_corner_cases[4] +
      V0_0_76__term_relations_hard_delete.sql:1-6 (migration that
      removes the soft-delete column and deletes tombstoned rows) +
      TermRelationsRepositoryImpl.java:80-88. Severity: MEDIUM (LOW for
      typical deployments; HIGH if combined with the auth-bypass and
      unauthorized mass-deletion).
  - facet: description-link protection silent via API — UI gates the button but API call returns 204
    observed: |-
      The DELETE WHERE clause filters `IS_DESCRIPTION_LINK.isFalse()`
      (TermRelationsRepositoryImpl.java:84); a term linked to a data-entity
      ONLY via a `[[namespace:name]]` description mention cannot be
      detached via this endpoint. The UI gates the X button with
      `!linkedTerm.isDescriptionLink` (TermItem.tsx:46), so a UI user
      never sees the X for description-linked terms. However, an API
      caller bypassing the UI (curl, DevTools, custom script — and per
      the path-mismatch bug, ANY authenticated user) calls DELETE on a
      description-linked term and gets 204 with no actual change. To
      remove a description-link, the user must edit the description
      (which routes through `handleDataEntityDescriptionTerms` →
      `updateDataEntityDescriptionTermsState` → `deleteTermDataEntityRelations`
      at TermServiceImpl.java:362-385). This is INTENTIONAL (the
      description/manual separation ADR) but UNDOCUMENTED at the
      operator-facing surface. Pairs with REFACTOR-227
      (description-mention auto-link interaction).
    expected: |-
      Either: (a) return 400 ("Cannot remove description-linked term;
      edit the description instead") when the DELETE WHERE clause matches
      a description-link row, OR (b) document the description-link
      protection in the dictionary feature docs + the API reference.
    drift_class: description_link_protection_silent_204_via_api
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[3] +
      TermRelationsRepositoryImpl.java:80-88 (`IS_DESCRIPTION_LINK.isFalse()`
      predicate) + TermItem.tsx:46-56 (UI gating) +
      TermServiceImpl.java:198-207, 362-385 (description-edit pipeline).
      Severity: LOW (intentional design; gap is in documentation, not
      behaviour).
  - facet: activity event fires on no-op DELETE — audit noise
    observed: |-
      `@ActivityLog(event = TERM_ASSIGNMENT_UPDATED)` annotates the
      service method unconditionally (TermServiceImpl.java:183). The
      handler re-queries the data-entity's terms-list BEFORE invocation
      and AFTER (TermAssignmentActivityHandler.java:29-43); a no-op
      DELETE yields BEFORE = AFTER but the event row is still written.
      Auditors investigating "who removed term T from entity E" see an
      activity event that LOOKS like a real removal but where nothing
      actually changed. The signal-to-noise ratio of GET /api/activity
      is degraded for term-management investigations. Pairs with the
      silent-204 bug below — together they make the audit trail
      unreliable for term-unlinking forensics.
    expected: |-
      Either: (a) skip the @ActivityLog emission when the DELETE matches
      zero rows (move the annotation logic to fire only on actual
      mutation), OR (b) include a `change_count` field in the event
      payload so consumers can filter no-op events.
    drift_class: activity_event_fires_on_no_op_delete
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[2] + TermServiceImpl.java:181-196
      (no early-exit for zero-row DELETE before `@ActivityLog` triggers)
      + TermAssignmentActivityHandler.java:23-43 (state captured
      regardless of caller intent or outcome). Severity: MEDIUM.
  - facet: silent-204 on non-existent ids — no 404 surface
    observed: |-
      `Long dataEntityId` and `Long termId` come as path variables from
      the URL; there is no validation that either id exists in the DB.
      The DELETE WHERE clause matches zero rows for non-existent ids
      (no FK-violation; DELETE on non-matching rows is a no-op in SQL);
      the response is 204. Callers cannot distinguish "I unlinked
      successfully" from "I targeted a non-existent entity" from "the
      term was only description-linked, no-op". Pairs with the silent-204
      pattern observed across the platform (cross-ref F-013
      upsertMetadataFieldValue silent-200, F-004 upsertDescription).
    expected: |-
      Pre-check `reactiveDataEntityRepository.get(dataEntityId).switchIfEmpty(NotFoundException)`
      + `reactiveTermRepository.get(termId).switchIfEmpty(NotFoundException)`
      before issuing the DELETE.
    drift_class: silent_204_on_non_existent_ids
    provenance: |-
      STATIC — primary-source in batch L sidecar
      bugs_limitations_corner_cases[6] + TermRelationsRepositoryImpl.java:81-87
      (no existence check) + TermServiceImpl.java:184-195 (no
      NotFoundException translation). Severity: LOW.
