behaviour: 'Partition naming parser coupling: `PartitionServiceImpl.getLastPartitionDate`
  (lines 72-80) splits the partition name on `_` and expects exactly 3 parts (`activity_YYYYMMDD_YYYYMMDD`).
  An operator-created partition with a different name (e.g. `activity_archive_old`)
  becomes the lexicographically-greatest match for `WHERE table_name LIKE ''activity_%''`
  and crashes the parser at next boot/cron — abstract base wraps and ERROR-logs, partition
  creation skipped.'
