observed_vs_expected:
  facets:
    - facet_id: tags_slice_then_sort_ordering_bug_important_tags_silently_hidden
      drift_class: ui_slice_before_sort_bug_visible_limit_hides_top_items
      severity: MEDIUM
      observed: |-
        OverviewTags.tsx:47-49 — `tags.slice(0, visibleLimit).sort(tagsCompare)`.
        The slice is applied BEFORE the sort. The `tagsCompare`
        function (lines 20-26) sorts by `important` first then
        alphabetic — so the intent is "show the most important 20 tags".
        But `.slice(0, 20)` takes the FIRST 20 tags by insertion-order
        (i.e. `id`-order from the backend payload), THEN sorts those
        20. If a Term has 50 tags with the 25th-inserted tag being
        marked `important`, that important tag is silently hidden
        beneath the "View All" collapse. Operators looking at the
        Overview right-rail tag chips see what looks like a definitive
        prioritised list but it's actually 20-arbitrary-then-sorted.
      expected: |-
        `[...tags].sort(tagsCompare).slice(0, visibleLimit)` — sort
        FIRST, then take the top 20. The same bug in the second slice
        path at line 63 (`?.slice(visibleLimit).sort(tagsCompare)`)
        should also flip.
      evidence:
        - 'OverviewTags.tsx:47-49 (slice then sort — primary bug)'
        - 'OverviewTags.tsx:62-64 (same bug in the collapsed-tags path)'
      ui_unverified: false
    - facet_id: tags_compare_function_recreated_per_render_no_useMemo
      drift_class: ui_pure_helper_function_recreated_each_render_no_memoisation
      severity: LOW
      observed: |-
        OverviewTags.tsx:20-26 — `tagsCompare` is declared inside the
        function component, recreated on every render. Passed to
        `.sort(tagsCompare)` which means every render does a full
        re-sort with a fresh comparator. Pure function, no captured
        closure dependencies — safely memoisable with `useCallback` or
        moved outside the component.
      expected: |-
        Move `tagsCompare` outside the component, OR wrap in `useCallback([])`.
      evidence:
        - 'OverviewTags.tsx:20-26 (inline declaration)'
      ui_unverified: false
    - facet_id: tag_create_bypass_via_tagsEditForm_authoring_entry
      drift_class: ui_authors_tag_create_bypass_per_f_002_batch_k
      severity: MEDIUM
      observed: |-
        TagsEditForm is the AUTHORING entry point for the F-002 batch K
        facet `tag_create_bypass_via_upsert_tags`. An operator with
        TERM_TAGS_UPDATE (but without TAG_CREATE) types a novel tag
        name in the edit form, submits, and the backend
        `tagService.getOrCreateTagsByName` silently creates a tag.
        The UI provides no signal that typing a novel tag name will
        create a new tag.
      expected: |-
        Either (a) the TagsEditForm autocomplete restricts to existing
        tags + surfaces a "Create new tag" affordance gated by
        TAG_CREATE; OR (b) the affordance is documented as
        "TERM_TAGS_UPDATE includes tag-create scope".
      evidence:
        - 'TagsEditForm.tsx (the form — full read deferred to next pass)'
        - 'F-002 batch K tag_create_bypass_via_upsert_tags'
      ui_unverified: true
      ui_unverified_reason: |-
        TagsEditForm not read in this UI walk; the novel-tag-input handling
        shape determines confirmation OR refinement.
    - facet_id: ownership_form_resetState_dependency_array_empty_stale_closure
      drift_class: ui_useCallback_empty_deps_captures_initial_closure
      severity: LOW
      observed: |-
        OwnershipForm.tsx:47-49 —
        `const resetState = React.useCallback(() => {methods.reset();}, [])`.
        Empty deps array; `methods` is captured from the initial render.
        If `methods` is ever re-created across renders (e.g. on dialog
        open/close cycle), `resetState` uses the stale `methods`
        reference. Probably not a live bug today (react-hook-form's
        `useForm` returns stable refs), but a code-smell that future
        contributors should fix.
      expected: |-
        `React.useCallback(() => {methods.reset();}, [methods])` OR
        drop the useCallback wrapper.
      evidence:
        - 'OwnershipForm.tsx:47-49'
      ui_unverified: false
