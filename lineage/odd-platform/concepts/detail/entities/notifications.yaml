name: Notifications
canonical_in_docs: false
canonical_candidate: true
description: 'Outbound alert-notification subsystem — a feature-flagged, off-by-default
  service that streams `ALERT` table changes via PostgreSQL logical-replication WAL
  and fans them out to Slack (incoming webhook), generic webhook (JSON POST), and
  SMTP email channels. Each channel is independently activated by the presence of
  its URL/sender key. Disabled by default at `notifications.enabled=false` (read by
  `NotificationsFeatureCondition` from the Spring `Environment` — bypassing `NotificationsProperties.enabled`
  field on the boot path). The WAL subscriber is a leader-elected single-thread consumer
  gated by Postgres advisory lock id `notifications.wal.advisory-lock-id` (default
  100), running ONE thread named `notification-subscriber-thread` on the elected leader.
  Replication slot + publication are created LAZILY on first run if absent; ODD never
  drops them on shutdown — operator owns cleanup. Fan-out through `List<NotificationSender>`
  is sequential and fail-soft: per-sender exceptions are caught at the processor and
  the loop continues. Distinct from the platform''s internal `Alert` lifecycle (this
  is the OUTBOUND delivery surface for alerts) and from the `Slack collaboration app`
  (which is bidirectional in-app Discussions, not alert notifications). vocabulary_status:
  codebase-anchored, doc-side-feature-page-covered (`features/active-platform-features/notifications`
  returns 200; `active-platform-features/notifications` returns 404 — GitBook IA drift).
  main-concepts.md names `Slack alert webhook` in Terms & Aliases (outgoing variant)
  but does NOT name `Notifications` as a first-class canonical feature. Batch 2026-05-12D
  adds `EmailSenderProperties` as the canonical typed-config surface for the EMAIL
  CHANNEL — 6 top-level fields (sender / password / host / port / protocol / smtp)
  + nested `SmtpProperties` (auth + starttls). Recipient list `notifications.receivers.email.notification.emails`
  is NOT modelled on this POJO — partial-home pattern (consumed via raw `@Value` in
  `NotificationConfiguration.java:104`).'
vocabulary_status: codebase-anchored, doc-side-feature-page-covered
axes_present:
- config_prefixes
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:EmailSenderProperties
contributors:
- 'NotificationsProperties: entities[NotificationsProperties, WalProperties, EmailSenderProperties
  (sibling), AlertNotificationMessage, DecodedWALMessage, NotificationSender (Slack
  | Webhook | Email)]; operations[feature-flag gating, WAL replication-slot coordinates
  carrier, fan-out alert delivery, leader-elected single-thread WAL consumer]; invariants[subsystem
  disabled by default; feature-condition reads notifications.enabled from Spring Environment
  directly; WAL subscriber leader-elected via advisory lock id 100; replication-slot
  + publication lazily created; never dropped; fan-out sequential + fail-soft per
  channel]'
- 'EmailSenderProperties (batch 2026-05-12D): entities[EmailSenderProperties, SmtpProperties
  (nested), JavaMailSenderImpl (Spring), MimeMessage (Jakarta Mail)]; operations[SMTP-credential
  carrier, JavaMail Properties bag population, boot-time blank-field validation (sender
  / host / protocol throw IllegalArgumentException), STARTTLS toggle]; invariants[channel
  only activates when notifications.receivers.email.sender is set (@ConditionalOnProperty);
  no JavaMail SMTP timeout configured — defaults are infinite (LSN-002-shape — corroborates
  batch C); STARTTLS-only TLS (no implicit-TLS / port 465 support); no mail.smtp.ssl.trust
  override; SmtpProperties.auth + .starttls are boxed Boolean — null is binding-legal
  and produces Properties#put-NPE at first send; recipient list (notifications.receivers.email.notification.emails)
  NOT modelled on this POJO — read via raw @Value at NotificationConfiguration.java:104
  (partial-home pattern); password leak via Lombok @Data toString() — no @ToString.Exclude
  annotation (matches NotificationsProperties + ODDLDAPProperties + ODDOAuth2Properties
  pattern — 4-sidecar triangulated)]'
