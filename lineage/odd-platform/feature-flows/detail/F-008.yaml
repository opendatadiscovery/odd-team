    expected: |-
      Either (a) widen the matcher to `/ingestion/**` excluding
      `/ingestion/datasources` (which has its own filter), OR
      (b) add per-endpoint sub-toggles
      (`auth.ingestion.filter.alertmanager.enabled`), OR
      (c) document the path scope explicitly + cross-link to
      F-007 AlertManager webhook ingestion's `unauthenticated_payload_trust`
      facet.
    drift_class: ingestion_filter_path_coverage_incomplete_alertmanager_uncovered
    provenance: |-
      STATIC — primary-source in batch O IngestionDataEntitiesFilter
      sidecar bugs_limitations_corner_cases[1,2] +
      security.known_security_gaps[1] + coupling note +
      IngestionDataEntitiesFilter.java:28 + AlertManagerController.java:17-26
      + IngestionDataSourceFilter.java:15-20. Cross-link: F-007
      facet `unauthenticated_payload_trust` is the alertmanager-side
      mirror. Severity: HIGH.
  - facet: NotFoundException surfaces as 5xx — info-leak + operator-debug misleading (batch O)
    observed: |-
      `AbstractIngestionFilter.filter` (parent at AbstractIngestionFilter.java:40)
      catches ONLY `AccessDeniedException` to emit a 401 with the
      message verbatim. The two `NotFoundException` throws in
      IngestionDataEntitiesFilter.java:43-51 (one on unknown
      datasource_oddrn; one on empty fallback collector lookup)
      propagate to the default reactive error handler and surface
      as 500 Internal Server Error. An attacker probing with valid
      bearer-token + arbitrary `dataSourceOddrn` distinguishes:
      (a) datasource EXISTS but wrong token → 401 with
      "Token is not correct"; (b) datasource DOES NOT EXIST → 5xx;
      (c) datasource EXISTS but collector lookup fails → 5xx. The
      5xx-vs-401 dichotomy leaks the datasource registry shape.
    expected: |-
      Either (a) map `NotFoundException` to 401 (defend operator-side
      probing); OR (b) catch and convert to 401 with a generic
      "Token is not correct" message; OR (c) document the 5xx-on-unknown-datasource
      contract explicitly.
    drift_class: notfoundexception_surfaces_as_5xx_info_leak
    provenance: |-
      STATIC — primary-source in batch O IngestionDataEntitiesFilter
      sidecar bugs_limitations_corner_cases[7] + invariants[7] +
      IngestionDataEntitiesFilter.java:43-51 + AbstractIngestionFilter.java:40.
      Severity: LOW (info-leak) / MEDIUM (operator-debug misleading).
  - facet: cross-mode reachability divergence for /ingestion/alert/alertmanager (batch O)
    observed: |-
      Under `auth.type=LOGIN_FORM`, the explicit `permittedPaths`
      list at LoginFormSecurityConfiguration.java:50 contains EXACTLY
      `/ingestion/entities` + `/ingestion/datasources` (no wildcard).
      `/ingestion/alert/alertmanager` falls through to
      `.pathMatchers("/**").authenticated()` and REJECTS anonymous
      callers (302 to login page). Under `auth.type=OAUTH2` /
      `LDAP`, the dispatcher uses
      `SecurityConstants.WHITELIST_PATHS` (line 96) which contains
      `/ingestion/**` (wildcard) and explicitly `permitAll()`s the
      alertmanager path. Under `DISABLED`, every path is permitted.
      The reachability of the alertmanager webhook DIFFERS
      mode-by-mode WITHOUT operator-facing documentation. An
      operator migrating from LOGIN_FORM to OAUTH2 might silently
      open the alertmanager webhook to anonymous callers.
    expected: |-
      Either (a) unify the permit lists (LOGIN_FORM should also use
      a wildcard, OR OAUTH2/LDAP should restrict to the same exact
      paths as LOGIN_FORM), OR (b) document the cross-mode divergence
      + the AlertManager-specific consideration in the live
      enable-security/authentication index page.
    drift_class: cross_mode_login_form_vs_wildcard_alertmanager_divergence
    provenance: |-
      STATIC — primary-source in batch O IngestionDataEntitiesFilter
      sidecar bugs_limitations_corner_cases[3] +
      docs_link_semantic.doc_drift_findings[2] +
      LoginFormSecurityConfiguration.java:49-51 +
      SecurityConstants.java:95-96 + AuthorizationCustomizer.java:22
      + DisabledAuthSecurityConfiguration.java:13-18. Severity: MEDIUM.
