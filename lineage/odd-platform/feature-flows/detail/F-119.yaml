notes_for_maintainer: |-
  This thread is the PER-ENDPOINT UX manifestation of REFACTOR-185 (the
  broader 19-sidecar DISABLED-mode bypass pattern). The general fix is
  three operator-facing follow-ups:
  - SEC-NNN: document the fingerprint risk on the live security page
  - SEC-NNN: add enum constraint on `auth.type`
  - DOC-NNN: add `/api/appInfo` to the developer-guides/api-reference page

  Probe candidate (local-only): replay a typo'd auth.type (`OUATH2`) against
  a local docker-compose stack and observe (a) AppInfo response (echoes typo),
  (b) downstream `@ConditionalOnProperty` resolution (no chain match), (c)
  actual HTTP behaviour (does Spring Security autoconfiguration default-on,
  or is there NO chain at all?).
