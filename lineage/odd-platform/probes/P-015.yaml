  - ActivityServiceImpl.java:98-100 — `Flux.error(BadUserRequestException)`
  - ControllerAdvice.java:24-28 — @ExceptionHandler maps BadUserRequestException → HTTP 400
  - Asymmetry with line 53's `.map(ResponseEntity::ok)` on a Mono (NOT wrapped in Mono.just)

