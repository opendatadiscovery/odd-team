control_summary: |-
  0 of 4 cells COVERED — feature emerges from batch-K primary-source audit of
  HousekeepingJobManager. The entire 48-line orchestrator + the five job
  implementations have NO direct test coverage (verified via grep of
  `<odd-platform-repo>/odd-platform-api/src/test` for `Housekeeping` returning
  zero matches). The integration-test profile exists to OPT OUT of housekeeping
  (`housekeeping.enabled: false` at application-integration-test.yml:8), not to
  test it. The highest-leverage probe candidates are: (a) the
  AlertHousekeepingJob jOOQ-precedence bug regression-pin (seed a manual
  RESOLVED alert older than the TTL + assert it is hard-deleted on the next
  cycle — PINS the current bug; replacing the assertion when the bug is fixed
  becomes a single-line edit); (b) the 14m / 15m ShedLock race (multi-instance
  docker-compose with an injected 15-minute sleep in one job, assert second
  instance does NOT acquire); (c) the `.block()` + unreachable S3 cycle stall
  (mock-S3 with infinite hang, assert cycle stalls + entire DataEntity cascade
  rolls back). Local docker-compose probe stack is sufficient: ODD platform +
  Postgres + mock-S3 (MinIO with network policy blocking egress) + seeded
  ALERT / DATA_ENTITY / SEARCH_FACET rows.
