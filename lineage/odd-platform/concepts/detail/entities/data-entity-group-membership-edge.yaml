name: Data Entity Group Membership Edge
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
description: |-
  **NEW ENTITY, batch 2026-05-19L** — the per-(child-data-entity, DEG)
  binding edge stored as a row in `public.group_entity_relations` with PK
  `(group_oddrn, data_entity_oddrn)` per
  `V0_0_21__add_data_entity_group_relation.sql:6` + an `is_deleted`
  boolean (DEFAULT FALSE, added by `V0_0_79__data_deprecation.sql:14-15`
  for the entity-deletion cascade soft-delete only — NOT part of the PK).

  **What lives in the edge row**: just the two ODDRNs (parent DEG ODDRN
  + child data-entity ODDRN) and the `is_deleted` cascade-soft-delete
  flag. The edge carries NO metadata of its own — no `created_at`, no
  `created_by`, no audit fields, no edge-id surrogate key.

  **Write surfaces** (the per-edge CRUD):
    - POST /api/dataentities/{data_entity_id}/data_entity_group
      (`addDataEntityToDEG` → `createRelationsReturning` with
      `onDuplicateKeyIgnore` + RETURNING)
    - DELETE /api/dataentities/{data_entity_id}/data_entity_group/{data_entity_group_id}
      (`deleteDataEntityFromDEG` → `deleteRelationsReturning` — HARD DELETE)

  **Read surfaces** (the edge is queryable from BOTH sides):
    - `getDataEntityGroupsItems` (`DataEntityController.java:109-116`)
      lists children for a DEG
    - `getDataEntityGroupsChildren` (lines 100-106) — ML-experiment-runs
      slice
    - `getDataEntityGroupLineage` (lines 275-281) — lineage joined across
      the DEG's children
    - `getDataEntityDetails` (lines 140-147) returns the child entity's
      `parentGroups` list via `enrichParentGroups` (lines 144-146)

  **Cascade soft-delete**: the entity-deletion path
  (`softDeleteRelationsForDeletedDataEntities` at
  `ReactiveGroupEntityRelationRepositoryImpl.java:92-101`) flips
  `is_deleted = true` when the underlying data-entity is deleted (e.g.
  via `STATUS = DELETED` cascade); the paired
  `restoreRelationsForDataEntities` (lines 104-112) is the only path
  to flip the bit back. User-initiated unlink (via the DELETE endpoint
  above) is HARD-DELETE — physically removes the row.

  **Six DATA_ENTITY_GROUP sub-types share this binding edge**
  (per `DataEntityClassDto.java:50`): DEG / Domain / ML Experiment / DAG
  / DATABASE_SERVICE / API_SERVICE / KAFKA_SERVICE — the membership
  binding is identical across all subtypes; the rendering and
  pillar-affinity differ.

  **Key intent properties**:
    - The PK `(group_oddrn, data_entity_oddrn)` does NOT incorporate
      `is_deleted`, so a soft-deleted prior membership row BLOCKS re-add
      via `onDuplicateKeyIgnore` even when `getManuallyCreatedRelations`
      (which filters `is_deleted=false`) shows zero memberships. This is
      the soft-deleted-membership-confuses-duplicate-detection corner
      case (per addDataEntityDataEntityGroup
      bugs_limitations_corner_cases.[2]).
    - The membership row carries NO audit trail — no `@ActivityLog` on
      the write paths, no `created_by`, no edge-id. The
      `DATA_ENTITY_RELATION_UPDATED` enum value exists in
      `ActivityEventTypeDto.java:12` but no `@ActivityLog` references
      it; the enum is reserved-but-never-fired.
