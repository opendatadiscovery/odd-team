# Lookup Tables (Reference Data Management) — product-owner reflection

## product_owner_narrative

Lookup Tables is the single user-observable surface of the Master Data Management pillar (P-03). It lets an operator (a data steward, or a data engineer) create and curate **reference data inside the platform itself** — the canonical lists, code tables, and lookup values that downstream pipelines and BI tools join against (per `system-mission.md:125-141` + `odd-platform__java__ReferenceDataController...md` understanding). The promise that makes the feature distinctive: the rows you curate in the UI are stored as a **real, SQL-joinable PostgreSQL table** in a dedicated `lookup_tables_schema`, named `n_{namespaceId}__{lowercased_underscored_name}`, so a BI tool can `JOIN` against it directly (per the controller sidecar `implicit_adrs[3]` + `ReferenceDataServiceImpl.java:191-194`). Unlike every other catalog entity, the operator is BOTH the author and the storage owner.

A user reaches the feature by clicking the "Master Data" toolbar tab, which routes to `/master-data/lookup-tables` (per `odd-platform__ts__routes__route__masterData.md`). The page (`LookupTables.tsx`, the de-facto pillar root per LSN-018) shows an H1 with a live count badge ("X lookup tables overall"), a global free-text search box, a permission-gated "+ Add new" button that opens a modal create/edit form, and a virtualised infinite-scroll list with Name / Description / Namespace columns plus per-row Edit and Delete buttons (per the `LookupTables` sidecar understanding + `LookupTablesList`/`LookupTablesListItem` referenced through it). Behind the screen, every action dispatches to a 14-path (17-operation) REST surface on `ReferenceDataController` at `/api/referencedata/*`, split into Table CRUD, Column CRUD, Row CRUD, and a faceted-search session (POST creates the session, GET/PUT operate on it, `/results` paginates — the same session-id pattern as the catalog Search, F-017).

The working parts the product owner would demo: you create a table by naming it and picking a namespace; you define typed columns (the docs name 9 PostgreSQL field types, the code carries 9 enum constants resolving to 8 distinct SQL types since SERIAL is INTEGER+sequence — per `LookupTableColumnTypes.java:30-50`); you add and edit rows in a Data tab; you search the list as you type; and operators can grant a three-surface RBAC split — table-level, definition-level (the schema), data-level (the rows) — so a steward can be given "edit the data" without "edit the schema" (per the controller sidecar `implicit_adrs[2]` + the live doc quote). The pillar is intentionally narrow: one feature today, with `/master-data` reserved as a URL namespace for future siblings (per the masterData route sidecar `implicit_adrs[0]`).

The feature integrates outward as a Data Entity: a Lookup Table is a `DATA_SET` sub-type (`DataEntityClassDto.java:43`), so it surfaces in Discovery search, the Directory, Catalog Overview entity reports, and participates in lineage (cross-pillar feeds P-01 + P-05 per `system-mission.md`). The per-row name links into the dataset-details page via `dataEntityDetailsPath(item.datasetId)`. It is operator-curated only — nothing pushes Lookup Tables in via ingestion (P-03 has no `feeds_from`).

The edge cases a senior product owner would flag in the demo, before any code is read: what happens when a tenant has more than one page of tables (does the list show them all)? What does a user with no LOOKUP_TABLE permissions see? When two operators name tables that normalise to the same physical name, what error do they get? When the operator renames a table that BI already joins against, what breaks? And — the load-bearing governance question for a feature sold as "multi-tenant-safe reference data" — when an operator is granted edit on *their team's* tables, can they edit *everyone's*? Each of these becomes a falsifiable hypothesis below; several of them are where the assembled feature does NOT deliver what the screen and the endpoint shape promise.

