behaviour: '**KNOWN BUG REGRESSION-PIN**: `DataEntityMapperImpl.applyStatus` sets
  `pojo.setStatus(statusDto.getId())` on line 247 BEFORE the `if (statusDto.getId()
  != pojo.getStatus())` check on line 249 — at the point of the check, `pojo.getStatus()`
  already equals `statusDto.getId()`, so the condition is always false and `statusUpdatedAt`
  is NEVER set on any status transition. The housekeeping TTL `STATUS_UPDATED_AT.lessOrEqual(now
  - N days)` relies on the column; with it always NULL, no soft-deleted entity ever
  hard-deletes.'
