control_summary: |-
  0 of 4 cells PROBED — feature emerged from batch Q primary-source
  audit of the CollectorsList UI-tier sidecar paired with prior
  CollectorController backend sidecars. The trinity-plus-rotation
  converged on 2026-05-20 (batch Q) — the user-observable Collector
  Lifecycle Management feature is now ENUMERATED at the UI tier with
  full primary-source citations across the four CRUD-plus-rotation
  verbs.

  The HIGHEST-LEVERAGE probe candidates are:
  (a) **UI-vs-API asymmetry regression-pin (REFACTOR-185 19th surface)**
      — under auth.type=DISABLED, render the /management/collectors
      page (no Add button visible) AND issue a direct
      `curl POST /api/collectors` from the same network namespace +
      assert the curl succeeds with no auth + the token returned is
      a valid 40-char string. Pin the asymmetry as a regression-pin
      so a future fix to EITHER side surfaces in the test signal.
  (b) **Token rotation no-grace-period regression-pin** — register
      a collector + start an ingestion loop using the token + rotate
      the token + assert the ingestion loop receives 401 on the
      NEXT request (no grace period; no in-flight tolerance). Pin
      the current operational contract so a future grace-period
      addition doesn't silently break audit-export pipelines.
  (c) **Token rotation no-security-effect-on-default regression-pin**
      — under default `auth.ingestion.filter.enabled: false`, rotate
      a token + assert `/ingestion/entities` STILL ACCEPTS the OLD
      token (because the filter is not registered). Pin the
      operational shape so operators reading the test signal
      understand the dependency between rotation and filter-enable.

  Local docker-compose probe stack is sufficient: ODD platform +
  Postgres + a pre-seeded Collector + a curl client. No external
  auth required (in fact, DISABLED-mode is the load-bearing test
  context for facet 1).

  Cross-feature coherence: this feature LIVES INSIDE pillar P-08
  Management & Administration but FEEDS pillar P-10 Integrations &
  Ingestion via the credential the two ingestion filters consume.
  Cross-link partners: F-008 (Batch Ingestion — the credential
  consumer pair; architectural-asymmetry finding under batch P;
  the 19th REFACTOR-185 surface anchored here), F-019 (Owner
  Lifecycle Management — sibling P-08 Management UI surface with
  matching WithPermissions pattern + audit-silence + DISABLED-mode
  bypass), F-006 (RBAC — COLLECTOR_* permission family is governed
  by the same SecurityConstants gating mechanism), F-011
  (Principal-to-Owner Resolution — the auth-mode posture this
  feature inherits via the central auth pipeline).

  REFACTOR-185 advances from 18-SIDECAR to 19-SIDECAR with this
  feature's UI-tier evidence. The compound attack surface under
  default DISABLED extends through the entire collector boot-of-self
  chain: anyone on the network can POST /api/collectors (no UI
  signal), copy the response token, and POST /ingestion/datasources
  with that token (per F-008 batch P architectural asymmetry —
  IngestionDataSourceFilter is always-on but accepts the just-minted
  legitimate token).
