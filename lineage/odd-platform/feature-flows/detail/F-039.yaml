description: |-
  GenAI Assistant is the FIRST GenAI/LLM surface in the ontology — the
  thin reactive proxy from any authenticated ODD user to an external
  Generative AI service. POST /api/genai/ask receives a free-text question,
  gates on the request-time `genai.enabled` flag, forwards the question
  verbatim as `{"question": "..."}` to `POST {genai.url}/query_data`, and
  returns the response unwrapped (CharMatcher trim-quote +
  StringEscapeUtils.unescapeJava). The endpoint is API-only today (no UI
  consumer); it is the canonical example of a feature whose advertised
  "GenAI assistant" surface is, in reality, a free-text-forwarder with no
  catalog context, no prompt template, no PII scrubbing, no safety filter,
  no retry, no cache, no audit, no rate limit, and no permission gate
  beyond generic `.authenticated()`.

  Per Rule 0 evaluation against `system-mission.md`: P-07 Active Platform
  Features explicitly enumerates GenAI assistant in its sub-feature seed
  ("GenAI assistant (`POST /api/genai/ask` → forwards to operator-run
  `genai.url`; disabled by default; API-only today)") with maintainer notes
  citing the GenAIController + GenAIProperties sidecars. The natural slot
  is therefore P-07:F-005 — fifth sub-feature inside the Active Platform
  Features pillar, sibling of F-007 (P-07:F-001 AlertManager Integration),
  F-009 (P-07:F-002 WAL-driven Notification Delivery), F-014 (P-07:F-003
  Per-Entity Alert View), F-021 (P-07:F-004 Activity Feed).

  The user-observable promise (per live `features/active-platform-features/genai`
  WebFetched 2026-05-25 status 200): "The platform sends no authentication
  to the external service. Operators must enforce network-layer controls
  (mesh, ingress, NetworkPolicy)" + "No prompt modification: Questions are
  forwarded verbatim; the external service handles prompt construction and
  RAG entirely" + "No retry logic: Single attempt per request; external
  service must be reliable" + "the platform is a thin proxy".

  The user-observable REALITY, per the batch-ZG GenAIController controller-class
  sidecar: TWELVE load-bearing drift facets cluster around three load-bearing
  themes — (a) security posture undocumented on the platform-to-USER axis
  (any-authenticated-user reach + no rate-limit + no audit + no PII
  redaction + no body-size cap + DISABLED-mode anonymous reach + SSRF
  surface via unrestricted genai.url + ServerWebExchange exposed-but-
  discarded — the canonical fix-anchor for per-user audit/rate-limit/gate);
  (b) silent-misconfiguration via LSN-002-class zero-defaults (genai.url=null
  → outbound fails before any external call; genai.request_timeout=0 →
  Duration.ofMinutes(0) is legal and trips ReadTimeoutException immediately
  on every call, surfacing the typo "Gen AI request take longer that 0 min"
  as the user-visible diagnostic); (c) response-shape brittleness
  (CharMatcher quote-trim + StringEscapeUtils.unescapeJava assumes the
  external service returns a JSON-quoted string, NOT a structured JSON
  object — undocumented compatibility constraint on the external service).

  Plus the architectural asymmetry: the enabled gate lives at the SERVICE
  tier (BadUserRequestException → HTTP 400 when `genai.enabled=false`),
  NOT at the CONTROLLER bean registration (HTTP 404 via
  @ConditionalOnProperty) like the sibling DataCollaboration EventApiController.
  The route is ALWAYS REACHABLE; only the response code changes by config.
  This is a deliberate framing — "feature flag off" rather than "feature
  not deployed" — but the asymmetry between sibling controllers is
  operator-visible drift.

  Live docs DO disclose: thin-proxy, no authentication-to-external, no
  retry, no prompt modification. Live docs DO NOT disclose: any-authenticated
  -user reach, no rate limit, no audit log, no PII redaction, no body-size
  cap, response-unwrap contract on external service shape, SSRF surface
  via genai.url, no UI consumer / API-only-today (the latter IS in the
  config page but not the feature page).

  Status: NOT ui-incomplete per Rule 0b — the live config page explicitly
  states "API-only today (no in-app UI affordance calls the endpoint)"; the
  feature is INTENTIONALLY backend-only-today; no UI hop exists or is
  expected; classification confidence HIGH per the docs.
