realism_caveats: |
  Limitations:
  (a) The probe runs under auth.type=LOGIN_FORM for simplicity — the static admin
      authority short-circuits to ALL permissions on contextual types. To verify
      the OAUTH2/LDAP behaviour (live policy evaluation), a separate probe with a
      seeded user + non-admin role + custom policy is needed. The MANAGEMENT-rejection
      assertion is auth-mode-independent (the discriminator runs BEFORE the auth-aware
      extractor chain) so the rejection assertion is valid across all auth modes.
  (b) The "permissions.length >= 1" assertion is a minimum-bar check, NOT a full
      catalogue check. A FUTURE probe could pin the EXACT expected permission
      set under admin for each resource type — but doing so couples to V0_0_56
      seed contents and would break on any policy seed evolution. The minimum-bar
      shape is more durable.
  (c) The 99999999 missing-resource id may collide with a future seed; pick a
      provably-unused id at probe-runner time.
  (d) The probe DOES NOT verify the existence-asymmetry across TERM and QUERY_EXAMPLE
      extractors (the static read showed TermPermissionExtractor.java:44-45 throws
      via switchIfEmpty, but QueryExamplePermissionExtractor.java:37-48 does not
      have an observable switchIfEmpty in the trace — a separate probe should pin
      whether missing QUERY_EXAMPLE returns 404 or 200-empty). That asymmetry is
      a separate stress-question lifted out of scope of this probe to keep the
      MANAGEMENT-rejection assertion the primary signal.
