proposed_action: |-
  Testcontainers integration test. (a) Pre-create data entity X, metadata field F, and a metadata_field_value row with (X, F, value='initial', active=TRUE). (b) PUT /api/dataentities/X/metadata/F with body {value: 'edited'}. (c) Assert HTTP 200. (d) Query `SELECT active FROM metadata_field_value WHERE data_entity_id=X AND metadata_field_id=F` returns NULL (current contract — the bug). (e) Test comment 'LOCKS the silent-active-to-NULL regression as of 2026-05-19. When REFACTOR-NNN adds pojo.setActive(true) or fixes the SET clause, this test FLIPS to expect TRUE.' (f) Optional second assertion: query a hypothetical downstream filter that uses `WHERE active = TRUE` and confirm the row is excluded after edit — explicit proof of the downstream impact.
