behaviour: |-
  **HIGH — `GET /api/messages/{message_id}/url` (redirect) emits `ResponseEntity.status(FOUND).headers(h -> h.setLocation(URI.create(providerUrl)))` (DataCollaborationController.java:42-48) where `providerUrl` comes from Slack's `chat.getPermalink` response (SlackAPIClientImpl.java:84-95) UNCONDITIONALLY. No host check, no scheme check, no allowlist. The platform is an open-redirect surface dependent SOLELY on Slack API integrity.**

  Verified by reading the four files in the chain: `DataCollaborationController.java:42-48` (the controller), `DataCollaborationServiceImpl.java:72-77` (the service), `SlackMessageProviderClient.java:64-66` (the client), `SlackAPIClientImpl.java:83-95` (the SDK wrapper) — none of them validate the URL. The trust assumption is 'Slack returns slack.com URLs'.

  **Three concrete bug classes the absence enables**:
  1. **Scheme bypass**: if Slack's API ever returns `javascript:` / `data:` / `file:` URLs, the controller emits 302 to them. `URI.create` accepts any valid URI scheme.
  2. **Host smuggling**: if Slack's API is compromised, returns an attacker-controlled URL (`https://evil.com/...`), the platform redirects every user clicking 'Open in Slack' on every Discussions thread.
  3. **Malformed URI propagation**: `URI.create(providerUrl)` throws `IllegalArgumentException` on malformed strings; failure bubbles to WebFlux's default exception handler → 5xx, not 4xx. Operator-confusing.

  **No defence in depth**:
  - No `URI.create(providerUrl).getHost().endsWith(".slack.com")` check.
  - No `URI.create(providerUrl).getScheme().equals("https")` check.
  - No allowlist of known-good URL prefixes (e.g. `https://*.slack.com/archives/...`).
  - No catch-and-fallback for `IllegalArgumentException`.

  **OWASP class**: A01:2021 Broken Access Control — Open Redirect sub-class. See `https://owasp.org/Top10/A01_2021-Broken_Access_Control/`.

  **Why HIGH (not CRITICAL)**: the attack surface depends on Slack's API integrity. Slack has a strong reputation for not returning attacker-controlled permalinks. But the platform's failure to defend in depth means a single Slack incident (e.g. workspace token rotation gone wrong, Slack's response cache poisoning, MITM if outbound TLS pinning is missed) produces an immediate platform-wide pivot vector. With TEST-GAP-959 (no inbound signature verification) + TEST-GAP-960 (no idempotency) compounding, the trust-the-Slack-API anti-pattern is **the dominant security weakness in P-07 Data Collaboration**.

  **Distinguishes from existing IDs**:
  - TEST-GAP-142 (HIGH) — `auth.login-form-redirect` open-redirect class via `@Value`. SAME CLASS-OF-BUG, different ingestion surface (config-key consumer vs Slack API consumer).
  - TEST-GAP-738 (HIGH) — link URL `javascript:` scheme bypass. Different controller surface (DataEntity link UI), same class.
  - TEST-GAP-807 / 808 — Webhook / Slack URI no scheme allowlist. Sister gaps in the **outbound** direction (notification sender).
  - This entry is the **redirect endpoint in the Discussions sub-feature** class instance.
