proposed_action: |-
  A single CLI script + jest test:
  (a) odd-platform-ui/scripts/i18n-key-parity.ts — walks
  odd-platform-ui/src/ recursively, greps `t\\(['"]([^'"]+)['"]\\)`
  call sites, collects the key list, compares against the keys in
  odd-platform-ui/src/locales/translations/en.json. Outputs a list of
  unresolved keys (in code but missing from en.json) AND unused keys
  (in en.json but never called from code).
  (b) i18n-key-parity.test.ts — runs the script and asserts the
  unresolved-keys list is empty. Failing the test surfaces every drift
  case that the en.md sidecar enumerates today.
  Wire as a `pnpm i18n:check` script + a GitHub Actions step on PR.
  The fix per drift case is either (i) add the missing en.json entry
  OR (ii) replace the t(...) call with a literal (if the string is
  intentionally not translatable). The test pins both directions.
