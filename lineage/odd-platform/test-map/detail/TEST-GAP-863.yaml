proposed_action: |-
  Add `TagServiceImplEmptyInputContractTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/` using Testcontainers + `@SpringBootTest`. Five test methods (one per entry point):

  1. **`listByNames_withEmptyCollection_returnsEmptyFluxNoSqlError_pinsImplicitFalseInSemantic`**:
     - Act: `reactiveTagRepository.listByNames(Set.of()).collectList().block()`.
     - Assert: result is empty list. PIN: the SQL `IN ()` evaluation behavior.

  2. **`ingestData_withEmptyList_returnsEmptyFluxAndDoesNotIssueSql_pinsExplicitGuard`**:
     - Use a SQL logger / hibernate stats hook to capture issued statements during the call.
     - Act: `reactiveTagRepository.ingestData(List.of()).collectList().block()`.
     - Assert: result is empty list AND zero INSERT statements were issued. PIN: the explicit guard at line 181-183 is load-bearing.

  3. **`bulkCreate_withEmptyList_returnsEmptyFluxAndDoesNotIssueSql_pinsInheritedGuard`**:
     - Same shape as #2 for `reactiveTagRepository.bulkCreate(List.of())`.
     - PIN: the inherited guard at ReactiveAbstractCRUDRepository.java:115-117.

  4. **`getOrCreateTagsByName_withEmptySet_returnsEmptyFluxNoCreateAttempts_pinsServiceLayerShortCircuit`**:
     - Act: `tagService.getOrCreateTagsByName(Set.of()).collectList().block()`.
     - Assert: result is empty list. Use a Mockito spy on `reactiveTagRepository.bulkCreate` to verify ZERO invocations. PIN: the service-layer behaves as expected (no bulkCreate call) on empty.

  5. **`getOrInjectTagByName_withEmptySet_returnsEmptyFluxNoIngestAttempts_pinsServiceLayerShortCircuit`**:
     - Same shape as #4 for `getOrInjectTagByName` and `ingestData` Mockito spy.

  Cross-pair with TEST-GAP-858 (the DESTRUCTIVE empty-input on updateRelationsWithDataEntity): the asymmetry is now explicit — 4 entry points are no-ops, 1 is destructive. Cross-pair with REFACTOR-NNN to standardise OR document explicitly.
