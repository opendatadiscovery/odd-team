security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      ALL SEVEN /api/search* endpoints fall through to .authenticated();
      none has a SECURITY_RULES entry. Under DISABLED, anonymously
      reachable end-to-end. Batch ZE class-level confirms the seven-
      endpoint surface. Batch ZI confirms the UI-route layer ALSO has
      no permission gate — `/search/*` is mounted bare at App.tsx:61
      without WithPermissionsProvider; the route is reachable by every
      authenticated user and anonymously under DISABLED.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Default my_objects=false path returns aggregations over the ENTIRE
      catalog; facet counts always catalog-wide; owner-filter only on
      explicit toggle. Catalog enumeration is the default behaviour
      across all 7 endpoints (batch ZE class-level confirmation).
  strengths:
    - |-
      Server-generated v4 UUID — unguessable in O(2^60) attempts
    - |-
      TTL-bounded retention via housekeeping.ttl.search_facets_days
      (default 30 days)
  weaknesses:
    - |-
      Catalog-wide cross-owner enumeration HIGH — same shape as
      REFACTOR-024 with WIDER blast radius across the 7-endpoint
      surface (batch ZE class-level)
    - |-
      to_tsquery syntax-error vector HIGH — the persisted query_string
      is the poison-pill source for FIVE facet aggregator invocations
      PLUS getSearchResults + getSearchSuggestions (batch ZE adds the
      7th and 8th invocation sites)
    - |-
      Unbounded query length + unbounded search_facets writes MEDIUM
    - |-
      Search-session UUID has no per-user owner-binding HIGH — promoted
      from LOW by batch M; reconfirmed by batch ZE class-level
    - |-
      Persistent query text — PII concern LOW depending on threat model
    - |-
      Under auth.type=DISABLED, anonymously reachable MEDIUM
    - |-
      NEW batch ZE — highlightDataEntity is a TRUE SQL-injection vector
      via .formatted direct interpolation (NOT just DoS); the persisted
      query_string flows through .formatted to raw SQL on every highlight
      call. Cross-link
      invariant:get-highlighted-result-formatted-sql-injection.
    - |-
      NEW batch ZE — DataEntityList.pageInfo.hasNext is hardcoded true
      regardless of remaining rows on getSearchResults; third-party API
      consumers pagination-loop indefinitely. Category B drift.
      Cross-link invariant:has-next-true-contract-bug-pagination-loop.
    - |-
      NEW batch ZI — URL-layer Category F drift exposes the bearer-
      token semantic to the operator as a misleading `searchId` route
      param. Operators bookmarking, sharing, and tab-navigating with
      saved-search expectations get session-handle behaviour. The
      WORST-EXPERIENCE-FIRST surface — operators see the misleading
      URL before they see anything else. Cross-link
      invariant:search-id-route-param-is-session-uuid-not-saved-search-category-f
      AND invariant:tab-click-drops-session-state-cross-route-pattern.
    - |-
      NEW batch ZI — `/search/*` wildcard accepts garbage URL segments;
      malformed URLs render an empty Catalog INDISTINGUISHABLE from
      "no matches" rather than surfacing an explicit "session expired"
      or "invalid URL" message. Graceful-degradation gap. Cross-link
      invariant:search-route-wildcard-accepts-garbage-no-uuid-validation.
  cross_file_inconsistencies:
    - Live features/data-discovery/search page (200) silent on WHO can search;
      code enforces "any authenticated user"; facet counts catalog-wide; doc-vs-code
      asymmetry across all 7 endpoints.
    - |-
      Live page enumerates 7 facets but FacetType enum carries additional
      ENTITY_CLASSES facet AND top-level my_objects boolean flag.
    - |-
      NEW batch M + ZE — live page does not mention search-session UUIDs
      at all; bearer-token risk undocumented.
    - |-
      NEW batch ZI — live page ALSO does not mention the `/search/{searchId}`
      URL form at all (separate doc-gap confirmed at the UI-route layer);
      cross-batch: doc page is silent on UUID structure AND on URL form
      AND on access model — three independent doc gaps converge at the
      Search/Catalog page.
  contributing_files:
    - search.md
    - facets.md
    - HousekeepingTTLProperties.md
    - SearchController-class.md
    - odd-platform__ts__routes__route__search.md
  evidence:
    - search.md:security.known_security_gaps.[0-3]
    - search.md:bugs_limitations_corner_cases.[0-8]
    - facets.md:security.known_security_gaps + bugs_limitations_corner_cases + implicit_adrs
    - SearchController-class.md:security.known_security_gaps.[0-5] + bugs_limitations_corner_cases.[0-10]
    - "odd-platform__ts__routes__route__search.md (full sidecar — UI-route layer evidence; Category F drift, tab-drops-session, wildcard accepts garbage, bookmark fragility)"
performance_aggregate:
  overall: LOW
  hot_paths:
    - |-
      POST /api/search — THREE concurrent queries per call via Mono.zip
    - |-
      GET /api/search/{id} — 4 parallel DB calls; every GET is also a
      WRITE (side-effect UPDATE)
    - |-
      NEW batch ZE — GET /api/search/{id}/results — InfiniteScroll
      hot-path; 1 jOOQ findByState + 1 count + 4 enrichment passes per
      page
    - |-
      NEW batch ZE — GET /api/search/suggestions — 500ms-debounced
      per-keystroke; CTE + LIMIT 5 + outer order
    - |-
      NEW batch ZE — GET /api/search/{id}/data_entities/{id}/highlights —
      3-Mono zip + ts_headline CPU-intensive SQL
    - |-
      NEW batch ZI — searchPath()/useSearchRouteParams() at UI render
      time — O(1) per render; module-init at App.tsx:61. Negligible.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Single-request per call across every endpoint; no batch endpoint,
      no streaming.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      Stateless controller scales horizontally. search_facets grows
      monotonically until housekeeping. NO pagination cap on /results
      or /facet/{type} or /suggestions; size=Integer.MAX_VALUE structurally
      accepted. Batch ZE adds — every paginated endpoint shares the
      pillar-wide pagination-unbounded weakness.
  strengths:
    - Reactive non-blocking signature throughout
  weaknesses:
    - Unconditional my_objects aggregation cost MEDIUM
    - No max-size on pagination (size=1_000_000 admissible) MEDIUM
    - to_tsquery reconstruction per request LOW
    - No HTTP-level caching LOW
    - Side-effect UPDATE on every facet read LOW
    - Deep-pagination cost on OFFSET LOW
    - NEW batch ZE — `ts_headline` CPU cost not cached
    - NEW batch ZE — per-keystroke autocomplete cost (no client cache)
    - |-
      NEW batch ZI — Top-nav Catalog tab DROPS the session UUID on each
      click → unconditional INSERT into search_facets. Frequent tab-
      switching by a single user accumulates orphan rows at a rate
      proportional to tab clicks — bounded by 30-day TTL but visible
      as housekeeping job work.
  cross_file_inconsistencies: []
  contributing_files:
    - search.md
    - facets.md
    - SearchController-class.md
    - odd-platform__ts__routes__route__search.md
  evidence:
    - search.md:performance.known_performance_gaps.[0-3]
    - facets.md:performance.* (full block)
    - SearchController-class.md:performance.known_performance_gaps.[0-8]
    - "odd-platform__ts__routes__route__search.md:performance (UI-route layer; tab-drops-session orphan-row weakness)"
