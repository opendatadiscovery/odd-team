behaviour: |-
  **MEDIUM — `GET /api/datasources` has ZERO HTTP-tier coverage: the happy-path list
  response, the read-collaborative no-permission posture, and the `data_source.id ASC`
  ordering contract are all unverified at the endpoint.** Method-level primary source from
  the batch-ZB `getDataSourceList` controller-method sidecar:

  - **Happy-path** — `GET /api/datasources?page=1&size=10` returns HTTP 200 with a
    `DataSourceList` (`items: List<DataSource>` + `page_info{total, has_next}`); each item
    carries `id / name / oddrn / namespace / token`. The OpenAPI contract declares only the
    `200` response (openapi.yaml:434-440). No test exercises this.
  - **Read-collaborative posture** — `GET /api/datasources` has NO entry in
    `SecurityConstants.SECURITY_RULES` (Grep-confirmed — SecurityConstants.java:116-126 has
    only POST/PUT/DELETE rules for `/api/datasources*`). ANY authenticated user lists the
    entire catalog (ids, ODDRNs, namespaces, masked tokens) with NO MANAGEMENT permission
    and NO owner scope. This is an intentional posture (sidecar `implicit_adrs[1]`) but it
    is untested — there is no parametrized auth-mode controller security test in the repo.
  - **Ordering** — `listDto` calls the 3-arg `jooqQueryHelper.paginate` which delegates to
    the default overload `ORDER BY data_source.id ASC` (ReactiveDataSourceRepositoryImpl.java:62
    + JooqQueryHelper.java:42-45). The list is creation-order (ascending PK); the OpenAPI
    spec states NO ordering. A maintainer switching to a name-ordered or recency-ordered
    `paginate` overload changes operator-visible behaviour with no contract change and no
    test to catch it.

  **Why MEDIUM**: this is the HTTP-floor regression net for the read endpoint of the
  Datasources management surface — no security or correctness defect, but the endpoint is
  entirely unguarded against a contract-altering refactor. The only protection underneath
  is the repository-tier `DataSourceRepositoryImplTest.listDtoTest`, which exercises the
  SQL but NOT the HTTP endpoint, NOT the auth posture, and NOT the operator-visible
  ordering. The id-ASC ordering is also a documented-feature gap (the management doc page
  is silent on it — see `docs_link_semantic.doc_drift_findings`).

  **Test gap shape**: a `@SpringBootTest` / `WebTestClient` integration test that: (1)
  registers ≥3 data sources, `GET /api/datasources?page=1&size=10` → asserts 200, a
  `DataSourceList` with the expected `items` and `page_info`; (2) asserts the `items` are
  ordered by ascending `id` (creation order) — NOT name-alphabetical, NOT recency; (3)
  authenticates as a user holding NO `DATA_SOURCE_*` / MANAGEMENT permission and `GET
  /api/datasources` → asserts HTTP 200 with the FULL list (pinning the read-collaborative
  posture — the GET is intentionally not permission-gated). Pinned by probes P-034
  (ordering) and the happy-path floor.
