mitigations_unimplemented:
- |-
  Distinguish LOGIN_FORM, LDAP, S2S, and DISABLED at the AuthIdentityProvider
  layer by adding explicit per-mode tags (e.g.
  UserDto(username, "LOGIN_FORM") / UserDto(username, "LDAP") /
  UserDto(username, "S2S") instead of UserDto(username, null)). The
  downstream user_owner_mapping schema requires a non-null provider for
  this to be persistable; today provider IS persistable as null per the
  schema, so a migration would need to backfill provider for existing rows.
- |-
  Add a startup-time validator that fails fast if multiple non-OAUTH2 auth
  modes are active simultaneously AND ANY user_owner_mapping row has
  provider IS NULL — operator-deployment hygiene check.
- |-
  Document the (username, provider) compound key in
  `/configuration-and-deployment/enable-security/authorization/user-owner-association`
  — operators migrating between auth modes need to know existing user-owner
  mappings break (the (alice, null) row from LOGIN_FORM does NOT
  automatically invalidate when migrating to OAUTH2 where the user is
  identified as (alice, github)).
- |-
  Add a docs admonition on `/configuration-and-deployment/enable-security/authentication`
  for the auth-mode migration playbook - "Before changing auth.type from
  LOGIN_FORM to LDAP, audit user_owner_mapping for overlapping usernames
  and explicitly clear/recreate the bindings."
- |-
  Add a regression test that:
    (a) Creates a user_owner_mapping row with oidc_username='alice',
        provider=null, owner_id=X;
    (b) Authenticates a request via LOGIN_FORM as user 'alice';
    (c) Authenticates a request via LDAP as user 'alice';
    (d) Asserts BOTH resolve to the same Owner X (pins the current
        behaviour explicitly) OR asserts the second resolves to empty
        (under the proposed fix).
  **STRENGTHENED batch N** — the test now has the SQL-layer ground truth
  to assert at (ReactiveUserOwnerMappingRepositoryImpl.getAssociatedOwner
  is the canonical resolver) and the test schema can be set up directly
  via the repository.
notes: |-
  STRENGTHENED batch 2026-05-19N — SQL-LAYER GROUND TRUTH NOW PINNED.
  The invariant was 1-sidecar inferred at batch K (the principal-layer
  primary source); batch N adds the SQL-layer primary source at
  ReactiveUserOwnerMappingRepositoryImpl. The architectural triangle is
  now SQL-anchored end-to-end:
    Vertex 1 — Principal layer (AuthIdentityProviderImpl batch K)
    Vertex 2 — Persistence layer (ReactiveUserOwnerMappingRepositoryImpl
                batch N — NEW)
    Vertex 3 — Schema layer (V0_0_55 + V0_0_89 migrations)

  Original batch K notes (preserved):
  NEW HIGH-severity invariant captured in batch 2026-05-19K. The first of
  three security-related findings on AuthIdentityProviderImpl (the other
  two: S2S username='ADMIN' literal collision; no auto-create on first
  login). All three share a root cause: the else-branch at line 32 that
  collapses all non-OAuth2 auth flows into provider=null.

  The maintainer's design intent (per implicit_adrs.[1]) is consistent
  and reasoned: OAuth2 is the only auth flow that federates per-IDP, so
  the registrationId is the natural namespace differentiator; LOGIN_FORM
  and LDAP are each "local" to the deployment and the maintainer chose
  not to distinguish them. The trade-off is the migration-time bleed.
  But the trade-off is UNDOCUMENTED at the operator-facing docs layer —
  operators cannot make an informed choice without reading the code.

  Cross-cutting connections:
    - Pairs with the "AuthIdentityProvider (per-request principal
      resolution chokepoint)" entity concept — this is one of three
      load-bearing security gaps on that entity
    - Companion of the "S2S 'ADMIN' username literal collision" invariant
      — both rely on the same else-branch
    - Cross-references the "User-Owner Mapping" entity — the compound key
      shape is the persistence-layer manifestation of this invariant
    - **NEW batch N** — pairs with
      "cross-provider-username-row-duplication-in-external-joins"
      invariant — both rely on the (oidc_username, provider) compound
      key but the FOUR external repositories (Alert / Activity /
      OwnerAssociationRequest / Owner) JOIN on OIDC_USERNAME alone,
      surfacing a SECOND class of cross-provider collision

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the compound key shape on the user-owner-association doc
    (b) Add an auth-mode migration playbook to the authentication doc
    (c) Either fix the code (distinguish modes at the principal layer) OR
        publish the trade-off as an explicit ADR
