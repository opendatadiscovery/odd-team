proposed_action: |-
  **Vitest dispatcher contract suite** (5 tests in one file — the 30-line pin):

  1. `renderLineage_threeStateSnapshot_pinsDispatcherContract` — the headline snapshot test: 3 render states, 3 assertions.
  2. `renderLineage_isDEGtrue_mountsDEGLineageInsideJotaiProvider_pinsProviderScope` — assert jotai Provider wraps DEGLineage on DEG branch.
  3. `renderLineage_isDEGfalse_mountsHierarchyLineageWithoutProvider_pinsBranchDistinction` — assert NO jotai Provider on non-DEG branch.
  4. `renderLineage_isLoadedFalse_returnsNullRegardlessOfIsDEG_pinsLoadingGuard` — assert `null` return when not loaded.
  5. `renderLineage_isDEGFlipsMidSession_unmountsOldSubtreeMountsNew_pinsReclassificationContract` — assert subtree unmount/remount on `entityClasses` mutation.

  **Implementation cost**: ~1 hour for one engineer; ~30 lines + Redux mock helpers. This is the SINGLE highest-leverage test in the Lineage subsystem.

  Coherence note (LSN-018 Rule 6): NO contradiction with existing artefacts. STRENGTHENS Lineage.md:tests_coverage_semantic.gaps by establishing the contract pin as a concrete authoring target.
