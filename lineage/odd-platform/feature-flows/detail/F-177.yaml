observed_vs_expected:
  facets:
  - facet: class badge renders bare enum value — no tooltip explaining what each class unlocks
    observed: |-
      `<EntityClassItem entityClassName={entityClass.name} />` at
      DataEntityDetailsHeader.tsx:80-84 renders the enum value (e.g.
      `SET`, `TRANSFORMER`) as the badge label. There is no
      title/tooltip/aria-label explaining "SET means dataset — has
      Structure tab + DQ tests + schema diff" or "TRANSFORMER means
      job — surfaces source/target lineage." The operator-visible
      consequence: clicking through to a TRANSFORMER for the first
      time, the user sees "TRANSFORMER" badge, no Structure tab (the
      tab is hidden per DataEntityDetailsTabs.tsx — `hidden: !isDataset`),
      Sources/Targets panel under Overview (OverviewTransformerStats),
      and has no in-page explanation linking the badge to the panel
      set.
    expected: |-
      Either (a) tooltip/title on each class badge explaining the
      consequences (which tabs, which panels), OR (b) a doc page
      cross-linked from the badge surface explaining the class
      taxonomy + their per-class affordances.
    drift_class: class_badge_renders_array_of_enums_no_tooltip_explaining_what_each_class_unlocks
    evidence:
    - 'DataEntityDetailsHeader.tsx:79-85 — EntityClassItem render with just entityClassName prop'
    - 'DataEntityDetailsTabs.tsx:54 — Structure tab hidden when !isDataset (operator must know SET = dataset)'
    provenance: STATIC.
    severity: MEDIUM
    ui_unverified: true
  - facet: type badge renders freeform string — no categorical visual distinction from class badge
    observed: |-
      Line 86 — `{type && <EntityTypeItem sx={{ ml: 1 }}
      entityTypeName={type.name} />}`. The type badge sits adjacent to
      the class badges in the same `flexWrap='nowrap'` row. There is no
      visual cue (different color, separator, prefix label, grouping
      container) signalling that "TYPE: MICROSERVICE" is categorically
      different from "CLASS: CONSUMER". An operator scanning the badge
      row interprets them uniformly. (Slice M owns the per-component
      style; the integration-level drift is the absence of categorical
      separation at the header layer.)
    expected: |-
      Either (a) explicit "Class:" / "Type:" labels prefixed to each
      group, OR (b) a visual separator between class array and type,
      OR (c) the type badge rendered in a visually-distinct way (icon,
      shape) signalling "this is a sub-classification, not the
      load-bearing class enum."
    drift_class: type_badge_renders_freeform_string_no_categorical_visual_distinction_from_class
    evidence:
    - 'DataEntityDetailsHeader.tsx:79-86 — class array + type render adjacent in same row'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
  - facet: multi-class entity renders multiple badges — visual load + no overflow collapse
    observed: |-
      Line 74-75 — `<Grid container alignItems='center' flexWrap='nowrap'>`.
      `flexWrap: nowrap` means a horizontal overflow doesn't wrap to the
      next line. An entity classified with 4+ classes (technically
      supported by the data model — the array is unbounded) overflows
      the `lg={7}` allocation (line 75). No "+N more" affordance, no
      tooltip on overflow, no horizontal scroll. The internalName +
      Edit button (lines 76, 87-101) live in the SAME grid cell, so
      class-badge overflow can also compress the entity name. (Real-
      world data: multi-class entities are uncommon but exist —
      e.g. an ML model that is BOTH ENTITY_GROUP and TRANSFORMER.)
    expected: |-
      Either (a) max-N visible classes + "+N more" collapse, OR (b)
      `flexWrap: wrap` to allow badge overflow to a second line, OR
      (c) a max-classes-per-entity invariant at the data layer.
    drift_class: multi_class_entity_renders_multiple_badges_visual_load_no_overflow_collapse
    evidence:
    - 'DataEntityDetailsHeader.tsx:74-75 — flexWrap nowrap on the badge row'
    - 'DataEntityDetailsHeader.tsx:79-85 — unbounded entityClasses.map'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
    ui_unverified_reason: |-
      Empirically uncommon (multi-class is rare in seeded data) but
      structurally reachable; live observation against a multi-class
      entity would confirm visual impact.
  - facet: class array empty renders no badge — silent indistinguishable from unclassified entity
    observed: |-
      `entityClasses?.map(...)` (line 79) — the `?.` short-circuits when
      `entityClasses` is undefined; an empty array `.map` produces no
      children. An entity with no classes renders no class badge. Type
      badge still renders if `type` is truthy (line 86). Operator sees
      just a type badge — visually indistinguishable from an
      operator-deleted-class scenario or a corrupted payload. Combined
      with F-176 facet `class_conditional_render_silent_when_class_unknown`,
      the entire entity surface degrades silently when classes are
      missing.
    expected: |-
      Either (a) explicit "Unclassified" badge when entityClasses is
      empty + a hint, OR (b) backend invariant that every entity
      surfaces at least one class.
    drift_class: class_array_empty_renders_no_badge_silent_indistinguishable_from_unclassified
    evidence:
    - 'DataEntityDetailsHeader.tsx:79 — entityClasses?.map (no fallback for empty)'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
  - facet: header class badges drive Overview composition but no visual link between the two surfaces
    observed: |-
      The class badges in the header are the OPERATOR-VISIBLE projection
      of the same `entityClasses` array that drives Overview composition
