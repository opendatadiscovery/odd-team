mitigations_unimplemented:
- |-
  Align the predicate sets. Concrete fix: update `cteDataEntitySelect` at
  ReactiveDataEntityRepositoryImpl.java:909-939 to apply the EXCLUDE_FROM_SEARCH
  filter, matching getDataEntityDefaultConditions. Single-method change; no schema
  impact; no migration needed.

  Implementation sketch:
    REPLACE (line ~918):
      ...
      .where(DATA_ENTITY.HOLLOW.isFalse())
      .and(addSoftDeleteFilter(...))
      ...
    WITH:
      ...
      .where(getDataEntityDefaultConditions())  // ← unified predicate
      .and(addSoftDeleteFilter(...))            // ← still needed for the deleted_at scope
      ...
- |-
  Add the regression test: create test fixtures with a datasource containing
  entities split between EXCLUDE_FROM_SEARCH=FALSE and EXCLUDE_FROM_SEARCH=TRUE;
  call /api/directory/datasources/{id}?type_id={t}&page=1&size=10; assert
  pageData.size <= count.total (parity); under the proposed fix the test passes,
  under the current bug the test fails when the population contains
  EXCLUDE_FROM_SEARCH=TRUE entities.
- |-
  Pagination-wrapper predicate audit sprint (recommended) — sweep all repository
  list*/count* pairs in `odd-platform-api/src/main/java/.../repository/reactive/`
  for predicate divergence between the page query and the count query. Build a
  test harness that confirms parity for each pair. Recommended grouping:
  REFACTOR-425 (DataSource site) + this finding (DataEntity-by-datasource site)
  + the audit's deliverable.
notes: |-
  This is the SECOND known instance of the PREDICATE-DIVERGENCE-IN-PAGINATION-WRAPPERS
  bug class — REFACTOR-425 was the first (ReactiveDataSourceRepositoryImpl.listDto's
  page query uses startsWithIgnoreCase, count query uses containsIgnoreCase). Both
  sites share the root cause: a repository overrides one half of the page/count pair
  (page query inline + count via inherited base, OR page via custom CTE + count via
  default conditions) and the two halves drift over time as one branch is updated
  without the other.

  Cross-references:
    - Sibling site: `datasource-listdto-page-vs-count-predicate-divergence-refactor-425`
    - Cross-link to ReactiveDataEntityRepositoryImpl batch-H sidecar (page query
      mechanics) and batch-O sidecar (overall repository structure)
    - DOC-NNN candidate: surface 'paginated lists may show X of Y where X > Y in
      deployments using EXCLUDE_FROM_SEARCH' as a known limitation on the Directory
      doc page (low severity) OR fix the divergence first and document the
      EXCLUDE_FROM_SEARCH semantic separately
