proposed_action: |-
  Add `WebhookNotificationSenderNoSignatureRegressionPinTest`. Unit test stubbing `HttpClient.send(...)` to capture the outbound `HttpRequest`:

  1. `send_outboundRequestHasNoSignatureOrAuthHeader_pinsForgeryVulnerability` —
     - Stub `HttpClient.send(...)` capturing the request.
     - Invoke `webhookSender.send(message)`.
     - Assert the captured `HttpRequest.headers()` does NOT contain any of: `Authorization`, `X-ODD-Signature`, `X-Hub-Signature-256`, `X-Slack-Signature`, `Stripe-Signature`.
     - Assert the captured headers also do NOT contain `User-Agent` (or contain only the JDK default).
     - PINS the current shipping-unsigned vulnerability.

  2. `send_payloadCanBeForged_pinsMatchingSemantics` —
     - Build TWO `AlertNotificationMessage` instances: one constructed by the platform, one constructed by a "forger" Test class.
     - Stub `HttpClient.send(...)`; capture both POST bodies.
     - Assert the two captured bodies are byte-identical when the forger sends an identical message shape.
     - PINS that a forger with the URL produces wire-indistinguishable traffic.

  3. `send_hmacSignedHeader_presentInCapturedRequest_confirmsFixDirection` — (UPDATE this test once REFACTOR-NNN adds signing)
     - After REFACTOR-NNN: configure `notifications.receivers.webhook.secret=test-secret-32-bytes-minimum`.
     - Assert the captured request has `X-ODD-Signature: sha256=<hex>` header.
     - Assert the hex matches `HMAC-SHA256(test-secret-32-bytes-minimum, body)`.
     - CONFIRMS the fix's effectiveness.

  Pair with REFACTOR-NNN (HMAC signing + custom headers config) and DOC-GAP-NNN (security caveat + operator mitigations on live doc).

  Coherence note (LSN-018 Rule 6): This finding is NET-NEW — no prior TEST-GAP pins the no-HMAC / no-signature surface for the generic webhook channel. Sister gaps at the same node (TEST-GAP-800 / TEST-GAP-801) cover other single-method HttpRequest builder shortcomings. No contradiction with any existing artefact.
