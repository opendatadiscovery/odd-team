feature_id: F-147
pillar_id: P-01
pillar_anchored_id: P-01:F-002
pillar_anchored_feature_name: Search Result Row Click-Target — second UI closure point of the F-001 inflation loop
feature_name: |-
  Search Result Row tile — entire row onClick navigates to
  /dataentities/{id}/overview. Like F-001's PopularStrip tile closure on
  the home page, the Search result row is the SECOND UI surface that
  fires the +1 view_count side effect on every click. Operators browsing
  the search results page accidentally inflate the same view_count column
  that drives F-003's Popular Entities Ranking — even when the operator
  is just scrolling-by-the-name to find what they want.
seeded_from: ui-review-2026-05-26-slice-E (extension of F-001 inflation-loop topology)
seeded_at: '2026-05-26'
batch_origin: ui-review-2026-05-26-slice-E
created_in_batch: ui-review-2026-05-26-slice-E
status: ui-complete
status_reason: |-
  Both the UI half (ResultItem.tsx — the row onClick at line 75 + the
  detailsLink construction at line 42) and the backend half (F-001's
  resolved chain at DataEntityController.getDataEntityDetails →
  DataEntityServiceImpl.getDetails @ReactiveTransactional →
  ReactiveDataEntityRepositoryImpl.incrementViewCount) are at primary
  source. F-147 is the SEARCH-LIST analog of F-001's PopularStrip closure
  facet — same chain, different mounting site. The composition formula
  is (search-row click) → (navigate to /dataentities/{id}/overview) →
  (DataEntityDetails.tsx mounts) → (LSN-017 useEffect fires twice) →
  (+2 view_count per click). The UI half is closed; what's "ui-complete"
  here is the search-row click-target — not the F-001 chain itself.
