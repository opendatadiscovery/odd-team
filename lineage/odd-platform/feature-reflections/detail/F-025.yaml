- id: H-003
  hypothesis: "When a user holding QUERY_EXAMPLE_UPDATE but NOT QUERY_EXAMPLE_DELETE opens a snippet's detail page, they see an Edit button but no Delete button (and vice-versa for DELETE-only)."
  derivation: "Endpoint shape — the details route is wrapped in WithPermissionsProvider([QUERY_EXAMPLE_UPDATE, QUERY_EXAMPLE_DELETE]); a product owner expects per-action affordances, not all-or-nothing."
