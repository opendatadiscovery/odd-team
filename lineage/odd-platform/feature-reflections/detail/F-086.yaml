      - sidecar: WebFetch
        section: oauth2-oidc live page
        cite: "https://docs.opendatadiscovery.org/.../oauth2-oidc"
        note: "Doc now documents the GitHub + Google revocation calls explicitly."
    confidence: MEDIUM
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
