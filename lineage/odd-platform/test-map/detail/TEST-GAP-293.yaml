behaviour: 'Stored-XSS / Markdown-HTML round-trip through PUT /api/dataentities/{id}/description
  must round-trip sanitised content; today no sanitisation at server OR client (rehype-raw
  without rehype-sanitize). STRENGTHENED batch H — the repository sidecar confirms
  setInternalDescription stores Markdown / HTML verbatim with NO Jsoup.clean, NO Encode.html,
  NO length cap, NO allowlist; sole transformation is the empty-string→NULL normalisation.
  STRENGTHENED batch I — the DataEntityServiceImpl sidecar primary-source confirms
  the service-tier orchestration: upsertDescription (lines 323-333) carries @ReactiveTransactional
  + nested @ReactiveTransactional at DataEntityInternalStateServiceImpl + @ActivityLog(DESCRIPTION_UPDATED).
  The response binds from `formData.getInternalDescription()` NOT from the post-write
  pojo (line 329-332) — confirming the F-004 silent-200-on-missing fingerprint flows
  cleanly through this orchestration tier. P-009 already runs against the upstream
  GET that re-reads the description column after a P-007 write probe.'
