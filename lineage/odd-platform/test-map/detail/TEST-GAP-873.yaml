behaviour: |-
  **MEDIUM — Spurious Activity-Feed rows emitted when ownership / tag / term lists serialize in different Postgres row orders despite identical underlying state.** `OwnershipUpdatedActivityHandler` (via `AbstractOwnershipActivityHandler.java:19-22`), `TagActivityHandlerImpl.java:41-50`, and any handler reading list-shaped state (terms, custom-metadata, dataset-field enum values) issue queries with NO `ORDER BY` clause: `ReactiveOwnershipRepositoryImpl.getOwnershipsByDataEntityId` (`:130-145`) and `ReactiveTagRepositoryImpl.listDataEntityDtos` (`:69-81`) both lack `ORDER BY`. The `Flux<*Dto>.collectList()` collects in arrival order; Jackson serializes the list in iteration order. Postgres returns rows in storage order — which **can change** after `VACUUM`, `UPDATE`-MOVE relocations, or query-plan changes. The diff check at `ActivityAspect.java:86` is `!info.getOldState().equals(newState)` — STRING equality. A row-order flip emits a SPURIOUS activity row showing the same owners "changed" to the same owners in different order. Operator confidence in the Activity Feed degrades.

  **Primary-source chain**:
  - `ActivityAspect.java:86` — `.filter(newState -> !info.getOldState().equals(newState))` — STRING equality, NOT JSON-semantic equality
  - `AbstractOwnershipActivityHandler.java:19-22` — collects `Flux<OwnershipDto>` to `List` then serializes as JSON
  - `ReactiveOwnershipRepositoryImpl.java:130-145` — `getOwnershipsByDataEntityId` query — **NO `ORDER BY` clause** (per ActivityHandler.md citation)
  - `ReactiveTagRepositoryImpl.java:69-81` — `listDataEntityDtos` query — **NO `ORDER BY`** (only `groupBy(TAG.fields())`)
  - `TagActivityHandlerImpl.java:41-50` — list → JSON serialization for TAG_ASSIGNMENT_UPDATED
  - `utils/JSONSerDeUtils.java:56-66` + `:14-20` — Jackson with `SNAKE_CASE` PropertyNamingStrategy; serialization in collection iteration order
  - `ActivityAspect.java:81-95` (postActivity) — orchestrates getContextInfo + getUpdatedState + diff filter

  **The race window structure** (per ActivityHandler.md:stress_findings.S-E-4):
  1. Handler.getContextInfo runs `getOwnershipsByDataEntityId(123)` → returns `[Owner-A, Owner-B]` (storage order at T=0)
  2. Time passes; the data entity's underlying storage may shift after VACUUM or `UPDATE` storage moves (TOAST relocation, HOT updates that overflow into a new TID)
  3. Handler.getUpdatedState runs the SAME `getOwnershipsByDataEntityId(123)` → returns `[Owner-B, Owner-A]` (storage order at T=1)
  4. Both produce identical OwnershipDto **content** but different JSON string output:
     - Snapshot 1: `[{"name":"A"},{"name":"B"}]`
     - Snapshot 2: `[{"name":"B"},{"name":"A"}]`
  5. `String.equals` returns FALSE → spurious OWNERSHIP_UPDATED activity row emitted → operator sees "ownership changed" in the feed when nothing actually changed semantically

  **Operator-visible consequences**:
  - **Activity Feed noise**: spurious "ownership changed" / "tag changed" rows that operators investigate but find no semantic change. Erodes trust in the audit log.
  - **False compliance/audit trail entries**: a SOX reviewer sees "ownership row updated by user X at time T" with old_state == new_state semantically — but the JSON strings differ. Forensic investigation wastes time.
  - **Idempotency violation**: an "identity" mutation (re-saving the same owners list) should produce NO activity event per the design intent. Currently, a Postgres VACUUM between snapshots can produce one with no underlying change.

  **Why MEDIUM not HIGH**:
  - The empirical hit rate depends on Postgres workload (VACUUM frequency, UPDATE-MOVE rate, query-plan flux). In steady-state low-volume deployments, hits are rare.
  - The data-side impact is "extra audit row" not "data loss" or "permission bypass".
  - We rate MEDIUM (not LOW) because: (a) the failure mode is INVISIBLE to operators (they cannot tell a "ghost" event from a real one); (b) the fix is a one-line `.orderBy(OWNER.NAME.asc())` per repository query — but multi-tier coordination is needed; (c) compliance audit-quality is degraded.

  **Connection to probe P-018**:
  - The sidecar emits P-018 to MEASURE empirically whether the row-order flip actually occurs on a production-sized DB
  - This TEST-GAP is the regression-pin AFTER P-018 confirms the mechanism

  **Connection to TEST-GAP-868**:
  - TEST-GAP-868 pins the cross-mutation race (different states, same row)
  - This gap (873) pins the same-state row-order flux (same state, different serialization)
  - Both produce wrong-attribution-class activity rows; the mechanisms are different

  **Cross-cutting affected handlers** (per ActivityHandler.md):
  - OwnershipUpdatedActivityHandler (ownership list)
  - OwnershipCreatedActivityHandler (ownership list)
  - OwnershipDeletedActivityHandler (ownership list)
  - TagActivityHandlerImpl (tag list)
  - TermAssignmentActivityHandler (term list)
  - DatasetFieldTermAssignmentActivityHandler (dataset-field term list)
  - DatasetFieldValuesUpdatedActivityHandler (enum-values list)
  - Any future handler reading list-shaped state
