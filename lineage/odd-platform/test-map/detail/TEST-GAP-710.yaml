proposed_action: |-
  Add `ActivityControllerUnboundedSizeAndRateLimitTest` with three regression-pin methods:
  (a) `getActivity_sizeIntegerMaxValue_returns200_pinsAbsentUpperBound`: WebTestClient GET `/api/activity?beginDate=...&endDate=...&size=2147483647`; assert response 200 (NOT 400 or 422). The test is a regression-pin: a future maintainer adding `@Max(1000)` to size will flip this to 400/422, and the test (with an updated `// REGRESSION-PIN` comment) becomes the asserter of the new clamp.
  (b) `getActivity_sizeIntegerMaxValueAndTypeNull_returnsCrossOwnerActivitySetWithoutFilter_pinsAmplifiedDump`: seed multiple Owners each with activity events; GET with `size=Integer.MAX_VALUE` and `type=null`; assert the response contains events from ALL owners (not just the caller's). Pins the DoS amplifier surface — combined with cross-owner unscoping (TEST-GAP-706), the per-call work is unbounded.
  (c) `getActivity_500RequestsInOneSecond_allReturn200_pinsAbsentRateLimit`: fire 500 sequential WebTestClient calls within a 1-second window; assert all return 200 (no rate-limit response). Then `verify`-style assertion: zero `@RateLimit` annotations on the controller class or method (use reflection or a static grep gating test). Pins the no-rate-limit reality.
  Add `// REGRESSION-PIN — ActivityController.getActivity has NO size upper-bound, NO rate-limit; combined with the cross-owner audit-trail (TEST-GAP-706) this is the DoS amplifier on the most-sensitive read endpoint. If the maintainer adds @Max(N) or a RateLimiter, methods (a) and (c) will fail with informative messages; update the assertions to pin the new clamp. The current asserts pin the absent-clamp reality so future regressions adding-then-removing the clamp are caught.` comment block.
