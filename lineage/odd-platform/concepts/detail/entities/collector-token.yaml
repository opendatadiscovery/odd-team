name: Collector Token
canonical_in_docs: false
canonical_candidate: true
description: '40-character alphanumeric shared-secret bearer token used by an ODD
  collector to authenticate `POST /ingestion/entities` requests against the S2S `IngestionDataEntitiesFilter`.
  Stored in plaintext in the TOKEN table; compared via literal `.equals(...)` (no
  hashing layer). Rotation is an in-place UPDATE; no overlap window between old and
  new (regenerateCollectorToken sidecar `concepts.invariants.[1-3]`). vocabulary_status:
  codebase-anchored, doc-side-partially-covered (main-concepts.md mentions S2S authentication
  but not the token-rotation contract; live `/permissions` names COLLECTOR_TOKEN_REGENERATE
  Permission). **BATCH Q EXTENSION** — UI-tier hazards added (plaintext token
  rendered into DOM as text node + fragile substring-prefix-sniff masking detection
  per CollectorsList sidecar — see new sibling invariant
  `plaintext-token-rendered-into-dom-fragile-substring-prefix-sniff-masking`).
  **BATCH ZB EXTENSION** — the DataSource token IS A Collector Token per
  the schema (`data_source.token_id` and `collector.token_id` BOTH FK the
  same `token` table). The DataSourceController method-level sidecars
  (getDataSourceList / registerDataSource / regenerateDataSourceToken /
  deleteDataSource) close the DataSource-side of the same plaintext-everywhere
  chain — see the new contributors below.'
vocabulary_status: codebase-anchored, doc-side-partially-covered
axes_present:
  - controllers
  - ui_components
nodes:
  - odd-platform java CollectorController controller-method:regenerateCollectorToken
  - odd-platform ts react-component component:CollectorsList
  - odd-platform java DataSourceController controller-method:getDataSourceList
  - odd-platform java DataSourceController controller-method:registerDataSource
  - odd-platform java DataSourceController controller-method:regenerateDataSourceToken
  - odd-platform java DataSourceController controller-method:deleteDataSource
contributors:
  - 'regenerateCollectorToken: entities[Token (40-char alphanumeric shared secret),
    TokenPojo]; invariants[in-place UPDATE no overlap; plaintext in DB; plaintext in
    response; .equals-based filter check]'
  - |-
    **NEW batch Q — CollectorsList.md (UI-tier credential hazards)**:
    bugs_limitations_corner_cases.[0] (MEDIUM — substring-prefix sniff
    masking detection at CollectorItemToken.tsx:25-27; a backend mask
    format change would silently break detection) +
    bugs_limitations_corner_cases.[2] (MEDIUM — Token plaintext rendered
    into DOM as text node at CollectorItemToken.tsx:34 — no <input
    type='password'>-style obfuscation, no Reveal-on-hover affordance,
    no auto-hide-after-N-seconds timer) +
    security.known_security_gaps.[1] (MEDIUM — Token plaintext rendered
    into DOM) + security.known_security_gaps.[2] (MEDIUM — Token-
    visibility detection is a literal substring prefix sniff) +
    implicit_adrs.[0] (HIGH — Token visibility is detected client-side
    via a substring-prefix sniff, not via a backend-supplied flag)
  - |-
    STRENGTHENS — getDataSourceList.md (batch ZB — DataSource-side
    token RESOLVED): the class sidecar left the token-redaction layer
    AMBIGUOUS (UI-side vs API-side). This method sidecar RESOLVES it:
    the redaction is API-SIDE, in TokenMapper.mapValue (TokenMapper.java:15-18),
    gated by the TokenDto.showToken boolean. The LIST path constructs
    the 1-arg `new TokenDto(tokenPojo)` (showToken=false —
    ReactiveDataSourceRepositoryImpl.java:167) so TokenMapper returns
    the MASKED form `"******" + the real last 6 plaintext chars`. The
    masked form LEAKS the real trailing 6 characters of every token to
    every authenticated user (the list endpoint has no permission gate).
    implicit_adrs.[0] (the named `TokenDto.visibleToken` factory vs the
    default constructor is the deliberate per-call-site visibility
    toggle) + security.data_exposure (masked token → any authenticated
    user). Probe P-035 guards the masked-form regression.
  - |-
    STRENGTHENS — registerDataSource.md (batch ZB — DataSource-side
    plaintext-on-create): the create response returns the token in
    FULL PLAINTEXT — `create` sets showToken=true
    (ReactiveTokenRepositoryImpl.java:26 — `new TokenDto(pojo, true)`).
    implicit_adrs.[0] (token unconditionally minted server-side; the
    FormData has no token field — the caller cannot supply one) +
    implicit_adrs.[1] (showToken flag controls API-side rendering) +
    implicit_adrs.[2] (token.created_by falls back to null username
    when no principal — register succeeds under DISABLED with empty
    attribution) + security.data_exposure (plaintext token in the POST
    response body — any middleware on the response path persists a
    live credential). Probe P-040 guards plaintext-in-create-response.
  - |-
    STRENGTHENS — regenerateDataSourceToken.md (batch ZB — DataSource-side
    rotation): the rotation response returns the new 40-char token in
    PLAINTEXT (showToken=true — ReactiveTokenRepositoryImpl.java:38);
    the credential is validated downstream by a literal plaintext
    `.equals` at IngestionDataEntitiesFilter.java:56-57 — confirming NO
    hashing layer end-to-end on the data-source token, the same posture
    found for the collector token. security.known_security_gaps — token
    stored in plaintext in the `token` table (HIGH); entropy source is
    RandomStringUtils.randomAlphanumeric(40) — NOT a CSPRNG by default
    (HIGH); no audit log on rotation, updated_by overwritten in place
    (HIGH). The data-source and collector token-rotation paths share
    TokenGeneratorImpl + ReactiveTokenRepositoryImpl.
  - |-
    STRENGTHENS — deleteDataSource.md (batch ZB — DataSource-side
    orphan-token-on-delete): a successful data-source soft-delete
    ORPHANS the token row — `data_source.token_id` FKs the `token`
    table (V0_0_28__add_token.sql:13); the soft-delete touches only
    `data_source.deleted_at`; the `token` table has NO `deleted_at`
    column so the token cannot even be soft-deleted; no code path GCs
    orphan tokens. Each register-then-delete cycle leaks one plaintext
    token row — a stale-secret-at-rest surface (token.value varchar(40)
    persists unreferenced). SAME orphan-token pattern batch W confirmed
    for the Collector delete. Probe P-046 guards the orphan-token
    persistence.
