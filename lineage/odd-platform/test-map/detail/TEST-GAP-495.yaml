behaviour: |-
  EXTERNAL-origin metadata overwrite regression-pin (MEDIUM — silent data-quality risk). The upsert path does NOT check `MetadataFieldPojo.getOrigin()`. EXTERNAL fields are populated by collectors during ingestion (`MetadataFieldServiceImpl.java:62-71` `ingestMetadataFields`); a user with DATA_ENTITY_CUSTOM_METADATA_UPDATE can overwrite the collector-ingested value through PUT /api/dataentities/{id}/metadata/{field_id}. The next ingestion cycle will replace it, but until then the catalog shows the user's edit as authoritative. The user-facing distinction between 'discovered' (EXTERNAL) and 'curated' (INTERNAL) metadata is therefore NOT enforced at write time. Combined with TEST-GAP-491 (no @ActivityLog) the audit-trail gap, this creates a silent data-quality risk: the catalog can show fabricated 'source-system' values for fields with `origin=EXTERNAL` and no record of the fabrication. Cross-pillar P-01 (Discovery / catalog metadata authority) + P-10 (Integrations / ingestion-vs-UI metadata authority boundary). The current single happy-path test (DataEntityServiceTest) mocks a STRING-typed INTERNAL field — the EXTERNAL-origin path is unexercised; a future tightening that added `if (pojo.getOrigin() == EXTERNAL) throw BadUserRequestException` would have no test to validate against.
