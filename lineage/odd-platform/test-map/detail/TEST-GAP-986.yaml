proposed_action: |-
  Add `DataEntityTaskLastRunDenormalisationInvariantTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/`. Four test methods:
  1. `lastRunsTable_singleRowPerTask_pinsDenormalisationInvariant` — issue `SELECT count(*), count(DISTINCT task_oddrn) FROM data_entity_task_run_last_run`; assert both equal. PIN the single-row-per-task invariant at the data layer.
  2. `lastRunsTable_primaryKeyOnTaskOddrn_pinsSchemaConstraint` — query `INFORMATION_SCHEMA.table_constraints` for the table; assert a PRIMARY KEY exists with constraint name matching `data_entity_task_run_last_run_pkey` and the constrained column is `task_oddrn`. PIN the DDL constraint.
  3. `lastRunsTable_concurrentUpsertSameTaskOddrn_resultsInOneRowOnly_pinsIngestionRaceSafety` — concurrent two upserts into the same task_oddrn; assert exactly one row exists after both commit. PIN the race-safety guarantee.
  4. `testResults_dashboardCount_matchesLastRunRowCount_pinsLastRunsCardinalityInvariant` — seed 100 historical runs across 5 tests (so 100 rows in `data_entity_task_run` but only 5 in `data_entity_task_run_last_run`); GET dashboard; assert total testResults count = 5 (NOT 100). PIN the count-from-last-runs contract.

  Pair with REFACTOR-NNN: add a Flyway migration test that runs `V0_0_45` against a populated `data_entity_task_run`; assert the back-fill produces exactly DISTINCT ON tasks.
