notes: "REFINED cross-cutting hygiene invariant in batch 2026-05-12F. Originally\n\
  captured in batch E as a 3-sidecar 'codebase-wide' hygiene gap; batch F\nprimary-source\
  \ corroboration on DataEntity-side updateStatus + createOwnership\nshows the gap\
  \ is NOT codebase-wide — it is specifically the RBAC primary\nsurface. **Batch H**\
  \ adds the SQL-layer confirmation via ReactivePolicyRepositoryImpl\n— persistence-layer\
  \ silence on {create, update, delete} of policies.\n\nThe platform has a 2-tier audit\
  \ story:\n\n  Tier 1 (DataEntity-scoped writes — AUDITED):\n    - status updates (programmatic\
  \ logStatusChangeEvents)\n    - ownership-bindings (@ActivityLog OWNERSHIP_CREATED)\n\
  \    - description / business-name updates (per Activity Feed concept)\n    - tag\
  \ / term additions and removals (per Activity Feed concept)\n    - custom-metadata\
  \ updates (per Activity Feed concept)\n    - alert-config updates (per Activity Feed\
  \ concept)\n    - DataEntityGroup membership changes (per Activity Feed concept)\n\
  \    - alert status changes (@ActivityLog ALERT_STATUS_UPDATED — batch H confirmed\n\
  \      at AlertServiceImpl.java:112)\n\n  Tier 2 (RBAC-scoped writes — UNAUDITED\
  \ end-to-end):\n    - Policy create / update / delete (service + persistence layers)\n\
  \    - Role create / update / delete\n    - Owner directory create (Owner-controller\
  \ side, not ownership binding)\n\nThe asymmetry is the INVERSE of what a security-conscious\
  \ operator\nwould expect: data-content changes (which are themselves audit-trail-shaped\n\
  via the activity feed) are TIER-1 AUDITED; authorization-model changes\n(which control\
  \ WHO can do what) are TIER-2 UNAUDITED.\n\nHighest-leverage gap in the RBAC surface\
  \ — every other security\nweakness assumes attack visibility via logs; this one says\
  \ logs\ndon't exist for the most-load-bearing mutations. Batch H confirms\nthe gap\
  \ at the SQL primary source: no `log.info` / `log.warn` / audit-table-write\non any\
  \ of {create, update, delete} from ReactivePolicyRepositoryImpl.\n\nRecommended cleanup\
  \ options (in increasing scope):\n\n  - Add `@Slf4j` log.info(\"created policy {name}\
  \ by {currentUser}\")\n    to PolicyServiceImpl.create, RoleServiceImpl.create,\n\
  \    OwnerServiceImpl.create. Minimum-cost, log-only audit trail.\n\n  - Add `@ActivityLog`\
  \ annotations matching the existing pattern in\n    AlertServiceImpl + DataEntityServiceImpl\
  \ + OwnershipServiceImpl\n    (the batch F + H evidence shows the pattern is alive\
  \ and proven on\n    the DataEntity + Alert sides). Surfaces in the activity feed.\
  \ Requires\n    extending the ActivityEventType enum to cover RBAC mutations +\n\
  \    extending the ActivityState renderer to handle\n    Role/Policy/Owner-mutation\
  \ payloads.\n\n  - Introduce a dedicated `rbac_audit` append-only table written via\n\
  \    `BaseSoftDeleteCRUDRepository`'s mutation lifecycle hooks. Full\n    forensic\
  \ trail; coordinates with the existing soft-delete pattern.\n\nSurface as canonicalisation\
  \ candidate AND a refactoring-scope item.\nThree DOC-NNN candidates flow from this\
  \ invariant (audit-trail\nexpectation undocumented across `/authorization/policies`,\n\
  `/authorization/roles`, `/authorization/owners` live pages).\n"
