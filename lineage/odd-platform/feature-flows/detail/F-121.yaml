    actor: platform-operator
    trace: "SchedulingConfiguration.java:14 (defaultLockAtMostFor=1h) — PARTIAL: true for a future omit-the-timing job, DEAD CODE today (all 3 guarded jobs override it)"
    coverage: unverified
    test_demand: "functional (TEST-GAP pending mint, LOW): a test @Component declaring @SchedulerLock without timing attrs asserting shedlock.lock_until ≈ now()+1h (locks the inheritance contract; cosmetic today)"
