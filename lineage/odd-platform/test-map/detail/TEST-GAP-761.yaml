proposed_action: |-
  Add `NamespaceSoftDeleteReincarnationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `deleteNamespace_thenCreateSameName_succeedsWithNewDistinctId_pinsReincarnation` — POST `/api/namespaces` `{name: 'finance'}` → id_first; DELETE `/api/namespaces/{id_first}`; POST again `{name: 'finance'}` → id_second; assert `id_first != id_second`.
  2. `softDeletedNamespaceRow_deletedAtIsNotNull_pinsSoftDeleteSemantic` — after the DELETE in #1, query `SELECT deleted_at FROM namespace WHERE id = ?` and assert NON-NULL.
  3. `reincarnatedNamespace_doesNotInheritTagsFromSoftDeletedPredecessor_pinsOrphanAssignmentSemantic` — seed namespace with tags before delete; after reincarnation, query tags for the new namespace id; assert tags are NOT inherited (the old row's tags remain at the old namespace_id).
  4. `partialUniqueIndexExpression_isOverNameWhereDeletedAtIsNull_pinsDbConstraint` — query `pg_indexes` for `namespace_unique`; assert the index definition includes `WHERE deleted_at IS NULL`.

  Pair with DOC-NNN: surface the soft-delete reincarnation behaviour in the Management → Namespaces doc; explain the operator-impact on external references (BI tools, bookmarks).
