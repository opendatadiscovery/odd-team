  strengths:
    - 'Bounded leak surface — only HTTP status code (numeric) and HTTP status text (short string) placed in the DOM. error.url and error.message are populated upstream but NEVER rendered'
    - 'No raw exception / stack-trace surface — the widget is not an error boundary; cannot reach React error info object'
    - 'Stateless render — replay-safe, idempotent, no shared mutable state'
  weaknesses:
    - 'The 2-of-4 information-disclosure boundary is undocumented in the code (no JSDoc, no inline comment defends the omission). A future improvement PR adding url or message rendering would silently leak (MEDIUM)'
    - 'The toast-side channel that DOES carry error.message is fire-and-forget — the user has 6 seconds to read it; if they blink, the only place that ever carried the backend hint is gone. AppErrorPage does NOT recapitulate the message (LOW)'
