  - "TEST-GAP-218 (DISABLED-mode RBAC bypass — sister pattern)"
proposed_action: |-
  Integration test under `auth.type=DISABLED`. (a) POST /api/collectors creates a new Collector via the UI (no auth required); (b) copy the issued token from the response body; (c) POST /ingestion/datasources with `Authorization: Bearer <new-token>` and a DataSourceList payload; (d) assert 200 OK; (e) GET /api/datasources should return the newly-registered datasource. Pins the composition surface; future fix that adds UI-auth-required on /api/collectors will break this test (deliberately — re-author the test for the new posture).
