- id: H-002
  hypothesis: "When an operator scales the platform to N replicas, each ShedLock-guarded background job (housekeeping, status-switch, partition-creation) runs on exactly ONE replica per scheduled window — never concurrently on two replicas."
  derivation: "@EnableSchedulerLock + the JdbcTemplateLockProvider promise multi-instance coordination; the operator scaling replicas relies on this to avoid duplicate destructive work."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The guarantee holds for the COMMON case via PostgreSQL atomic INSERT-OR-UPDATE on the
      `shedlock(name)` PK with `.usingDbTime()` (only one replica wins a given lock name;
      clock skew is neutralised because lock_until comes from PG's now()). BUT the housekeeping
      job's lock window (`lockAtLeastFor=lockAtMostFor=14m`) is only 60 seconds below its
      `fixedRate=15m`. A cycle that runs >=14 minutes (a DataEntityHousekeepingJob cascade over
      a large soft-delete backlog, worsened by the `.block()` on S3 deletes) releases the lock
      BEFORE the transaction commits; a second replica can acquire at the 15-minute mark while
      the first is still committing — two concurrent housekeeping runs. Single-thread per
      replica prevents intra-JVM concurrency; ShedLock prevents inter-replica concurrency ONLY
      while the lock is held, and the 14m/15m ratio makes the held-window narrowly short.
    evidence:
      - sidecar: odd-platform__java__config__config-class__SchedulingConfiguration.md
        section: "stress_findings.resource_boundaries[lock] + implicit_adrs[0]"
        cite: "SchedulingConfiguration.java:18-25 (.usingDbTime LockProvider) + V0_0_52__introduce_housekeeping.sql:10-18 (shedlock PK)"
        note: "Atomic lock acquisition is the confirmed half — only one replica wins per name."
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: "bugs_limitations_corner_cases[3] + performance.scaling_characteristics"
        cite: "HousekeepingJobManager.java:25-26 (fixedRate=15m vs lockAtMostFor=14m — 60s slack)"
        note: "The narrow window is the partial-failure half — a >=14m cycle is the breach condition."
    operator_visible_failure: |
      For an operator at single-replica or light-load scale: no observable failure (the
      lock holds for any sub-14-minute cycle). For an operator at multi-replica + heavy
      soft-delete throughput: a >=14-minute housekeeping cycle can run concurrently on two
      replicas — AlertHousekeepingJob/SearchFacetsHousekeepingJob DELETEs are idempotent, but
      DataEntityHousekeepingJob's SELECT-then-cascade-DELETE could read divergent snapshots.
      The contract silently relies on operators sizing the backlog to keep cycles below 14
      minutes, which is undocumented. A safer `lockAtMostFor >= 2 x fixedRate` (e.g. 30m) is
      the fix; document the current fragility as a caveat in the interim.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

