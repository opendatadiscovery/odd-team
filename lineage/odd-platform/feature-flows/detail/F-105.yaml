pillar_anchored_feature_name: Management Section Route Gating (reads bypass authorization)
feature_name: |-
  Management Section Route Gating — every Management sub-area except
  /management/associations is reachable by deep-link for any authenticated
  user (or any anonymous caller under auth.type=DISABLED), and renders
  the FULL CATALOG of that surface (Owners / Roles / Policies / Namespaces /
  Tags / Collectors / DataSources / Integrations). WithPermissionsProvider
  wrappers provide context but do NOT block rendering; only the
  create/edit/delete buttons hide. Policy NAMES + JSON contents +
  Collector token names + DataSource ODDRNs are all readable to every
  user without a Management permission.
