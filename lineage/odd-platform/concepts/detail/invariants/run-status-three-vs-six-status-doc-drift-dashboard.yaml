name: Run-status three-vs-six doc drift on the dashboard (docs say 3, code renders 6)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  The live https://docs.opendatadiscovery.org/features/data-quality/dashboard
  page (WebFetched 2026-05-22 status 200) describes the Test Results
  Breakdown ring as 'broken down by status (passed / failed / skipped)'
  — THREE statuses. The code renders a tile (in TestCategoryResults)
  and a legend / ring slice (in DataQualityContent) for every value of
  `DataEntityRunStatus`, which has SIX values: SUCCESS, FAILED,
  SKIPPED, BROKEN, ABORTED, UNKNOWN (components.yaml:1407-1415,
  iterated at TestCategoryResults.tsx:21 and DataQualityContent.tsx:83-89).
  NEW invariant, batch ZC (2026-05-22).

  Doc says 3, code renders 6. An operator reading the docs expects
  three slices in the breakdown ring and three columns of tiles per
  category row; they see six. The three statuses the doc names
  (passed / failed / skipped) ARE a subset that maps to (SUCCESS /
  FAILED / SKIPPED) — so the doc is INCOMPLETE rather than contradictory.
  But the operator who sees BROKEN, ABORTED, or UNKNOWN in their data
  has no documentation explaining what those mean.

  Severity MEDIUM: doc-gap on the standalone dashboard's primary
  surface. The three statuses named are a subset, so an operator who
  only ever sees those three never notices; an operator with a more
  diverse ingested test set (a Great Expectations suite that emits
  ABORTED, a malformed run that surfaces as UNKNOWN) has no doc.

  Recommended fix: a 6-row table on dashboard.md naming all six
  DataEntityRunStatus values with one-line semantics each:
    - SUCCESS — the test passed
    - FAILED — the test ran and produced a failing result
    - SKIPPED — the test was skipped (e.g. dependency unsatisfied)
    - BROKEN — the test itself errored (could not produce a result)
    - ABORTED — the test was aborted mid-run
    - UNKNOWN — the test result was malformed or could not be
      classified

  vocabulary_status: codebase-anchored, doc-side-gap.
