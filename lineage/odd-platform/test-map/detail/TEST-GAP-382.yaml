behaviour: |-
  `deleteDataEntityFromDEG` `markEntityUnfilled(CUSTOM_GROUP)` invariant — lines 431-433 toggle the CUSTOM_GROUP filled-flag to unfilled ONLY when no other manually-created DEG memberships remain. A regression that flipped the condition would silently break the filled-flag invariant. No test pins the invariant. STRENGTHENED batch L — the controller-method sidecar (deleteDataEntityFromDataEntityGroup) confirms the conditional branch as a structural invariant: 'after the HARD DELETE, the service queries getManuallyCreatedRelations(dataEntityOddrn) (ReactiveGroupEntityRelationRepositoryImpl.java:127-137, filtered by IS_DELETED.isFalse() AND DEG.MANUALLY_CREATED.isTrue()); if the resulting list is empty, markEntityUnfilled(dataEntityId, CUSTOM_GROUP) flips the flag (DataEntityServiceImpl.java:430-434). If the entity still participates in at least one other manual DEG, the flag remains true. The ADD path unconditionally calls markEntityFilled(CUSTOM_GROUP) on success (line 406) — no symmetric idempotence concern.' The asymmetry between ADD (unconditional filled-toggle) and DELETE (conditional unfilled-toggle) is the load-bearing intent. Cross-pillar P-01 (Discovery / DEG completeness signal depends on this flag being consistent with actual link-rows).
