proposed_action: |-
  Within the same `AppToolbar.test.tsx`, add two methods: (a) `renders_empty_username_when_identity_and_owner_null` — provide a redux store with both fields null; assert the `<S.UserName>` element exists, its textContent is empty, the popup-menu trigger is still clickable; (b) `renders_owner_name_when_owner_present_else_identity_username` — pin the 6-component precedence convention by parameterizing over (owner.name + identity.username, owner.name only, identity.username only, both null) and asserting the correct render in each case.
