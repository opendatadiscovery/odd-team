  - name: "202+queue+Postgres-advisory-lock single-sender pattern"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Cross-cutting concurrency convention for outbound integrations / async consumers that must serialise to ONE worker across a multi-replica deployment. The pattern: (a) inbound endpoint accepts request, persists intent to Postgres, returns 202 Accepted immediately (OR a WAL row gets emitted as a side-effect of a different mutation); (b) a background thread acquires a Postgres advisory lock (different ID per subsystem) to elect itself as the single cluster-wide leader; (c) the leader drains the queue / consumes the WAL stream / processes events serially; (d) on lock release (JVM shutdown / failure) another replica acquires leadership. Triangulated across 2 sidecars in 2026-05-12C: (a) DataCollaborationMessageSenderJob (batch 2026-05-10A, postMessageInSlack sidecar implicit_adrs[3,4]) — Slack outbound message queue draining at advisory lock id `datacollaboration.sender-message-advisory-lock-id` (default 120). (b) NotificationSubscriber (batch 2026-05-12C, NotificationsProperties sidecar implicit_adrs[3]) — leader-elected WAL consumer at advisory lock id `notifications.wal.advisory-lock-id` (default 100). Sibling ActivityTablePartitionManager uses advisory lock id 90 for partition creation (boot-time short-window lock, not the steady-state single-sender lock). The convention preserves Postgres-as-only-dependency posture while still decoupling external-service latency from the inbound HTTP critical path. Advisory-lock ID convention is operator-tunable (each subsystem has its own config key) but unmanaged — collision avoidance is via the shipped defaults plus the operator's discipline."
    axes_present:
