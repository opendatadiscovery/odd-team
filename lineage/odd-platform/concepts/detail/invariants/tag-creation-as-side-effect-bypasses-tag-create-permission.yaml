name: Tag-creation-as-side-effect bypasses TAG_CREATE permission via EXTERNAL_STATISTICS-origin stats ingest
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
- P-04
- P-01
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20-Z (postDataSetStatsList sidecar)** —
  the `POST /ingestion/entities/datasets/stats` endpoint accepts a
  `DatasetStatisticsList` payload of per-dataset records, each carrying
  per-field `DataSetFieldStat` entries with an optional
  `tags: List<Tag>` array. The implementation
  (`DatasetFieldServiceImpl.updateFieldsTags` line 191-231) calls
  `tagService.getOrCreateTagsByName(...)` (line 202) which CREATES catalog
  tag rows for any tag name in the payload that doesn't already exist.
  The created tags are stamped `TagOrigin.EXTERNAL_STATISTICS` (TagOrigin.java:6;
  `createExternalStatisticsRelation` at DatasetFieldServiceImpl.java:273-278).

  **The bypass**: the normal Tags-management flow is the Tags tab in
  Management UI (P-08 sub-feature), RBAC-gated by `TAG_CREATE` permission.
  The stats-ingestion path is the SIDE-CHANNEL — tags are created as a
  side-effect of stats writing, NO TAG_CREATE permission is checked. The
  tags created via this path are functionally identical to UI-created tags
  EXCEPT for the `origin` discriminator: they are discoverable in the
  catalog's tag search and filter facets, they participate in tag-based
  data-entity classification, they appear in the per-data-entity Tags
  panel — but they were created without authorization.

  **Composition with REFACTOR-185 AUTH-MODE-ORTHOGONAL facet**: the
  endpoint is unauthenticated in every shipped deployment posture
  (per the batch-Z REFACTOR-185 27-sidecar extension). Combined with
  this side-channel: ANY HTTP caller able to reach the platform's port
  can populate the catalog's tag taxonomy with arbitrary tag names by
  submitting `DatasetStatisticsList` payloads. The tags persist; they
  are discoverable by all authenticated users; they cannot be
  distinguished from legitimate tags at the catalog-search layer
  (only at the per-relation `origin` discriminator).

  **Why the EXTERNAL_STATISTICS origin matters (but doesn't help here)**:
  the origin discriminator is load-bearing for the reconciliation
  semantics — `relationsToDelete = existingRelations.filter(r ->
  !relationsToCreate.contains(r))` (DatasetFieldServiceImpl line 221-223)
  operates ONLY on EXTERNAL_STATISTICS-origin relations, leaving INTERNAL
  (UI-curated) tags intact (per the
  `external-metadata-overwrite-silent-no-origin-check` companion invariant
  family). The origin discriminator is the safety net for re-ingest
  reconciliation; it does NOT protect tag-creation: getOrCreateTagsByName
  creates the tag if it doesn't exist regardless of intended origin.

  **Severity MEDIUM**: the consequence is tag-namespace pollution rather
  than direct data loss. But the pollution is operationally visible
  (tags appear in search facets) and operationally costly to clean up
  (the Tags UI doesn't surface origin to operators by default; rows
  must be cleaned via SQL or via repeated stats payloads with smaller
  tag sets).
