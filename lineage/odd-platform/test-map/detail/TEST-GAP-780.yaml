behaviour: |-
  **HIGH — PostgreSQLSessionHousekeepingJob is the SOLE `@Scheduled` job in the entire codebase that does NOT use `@SchedulerLock` / advisory-lock-based leader election. On a multi-instance INTERNAL_POSTGRESQL deployment, EVERY instance runs the housekeeping job hourly, multiplying DB load by N replicas.** Sidecar primary-source confirms the asymmetry:

  - **PostgreSQLSessionHousekeepingJobHandler.java:13** declares `@Scheduled(fixedRate = 1, timeUnit = TimeUnit.HOURS)` — NO `@SchedulerLock` annotation.
  - **Contrast** (cross-batch evidence already in concepts.yaml):
    - `notifications.wal.advisory-lock-id` (application.yml:177) — leader-election on notification subscriber.
    - `odd.activity.partition-advisory-lock-id` (application.yml:198) — leader-election on partition manager.
    - `datacollaboration.sender.advisory-lock-id` + `datacollaboration.receive-event.advisory-lock-id` (application.yml:201-202) — leader-election on data-collaboration jobs.
    - `HousekeepingJobManager.java:18` uses Postgres advisory-lock leader-election for the platform-wide housekeeping cycle (SearchFacetsHousekeepingJob et al — per F-010).
  - **Session housekeeping is the SOLE outlier** — verified via grep `@SchedulerLock` over odd-platform-api/src/main/java; the annotation is present on 4 jobs; absent on PostgreSQLSessionHousekeepingJobHandler.

  **Operator-impact scenario**:
  - Single-instance deployment: housekeeping runs once per hour, DELETE WHERE `expiry_time < now()` executes once. Idempotent SQL — first run deletes the matching rows, no harm.
  - 5-instance deployment: housekeeping runs 5 times per hour across the 5 replicas. The DELETE SQL is idempotent (the second run sees no rows matching that the first hasn't already deleted), so CORRECTNESS is preserved. But the DB load is 5× the intended rate. For a busy `SPRING_SESSION` table, the DELETE + index maintenance + WAL writes amplify.
  - 10-instance deployment: 10× load. Combined with `spring.session.timeout=-1` (TEST-GAP-779 — predicate never matches, so the DELETE has no rows to scan but still incurs the planning + lock-acquisition cost), the DB receives 240 useless DELETE statements per day per 10 replicas.

  **Correctness is OK, performance is NOT.** Idempotency is a CONSEQUENCE, not an INVARIANT — a future change adding side-effects to the housekeeping job (e.g., emitting an activity event for each deletion, incrementing a metric counter, persisting an audit row) immediately becomes load-bearing. Without leader-election, N replicas duplicate the side-effects N times.

  **Architectural-consistency gap**: the platform's other `@Scheduled` jobs ALL use either `@SchedulerLock` (ShedLock library) or Postgres advisory locks. The session-housekeeping outlier is an UNDOCUMENTED architectural inconsistency that future maintainers will notice and either fix (good) or replicate (bad — establishing a precedent for unguarded `@Scheduled` jobs).

  **Test gap shape**: parametrised test running a `@SpringBootTest` under N=2 instances (or equivalent — two separate ApplicationContexts in the same JVM sharing a Testcontainers PG) and asserting that ONLY ONE instance's housekeeping job acquires the advisory lock per scheduled tick. The test is CURRENTLY FAILING (no lock exists) — it pins the gap. The fix is one annotation: `@SchedulerLock(name = "sessionHousekeepingJob", lockAtLeastFor = "PT55M", lockAtMostFor = "PT55M")` on the handler.
