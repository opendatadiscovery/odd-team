notes: |
  Cross-batch architectural-hygiene observation. The pattern is INTENTIONAL
  (the literal English error message is the contract; the architecture chose
  application-layer invariant over DB-layer constraint) but operationally
  vulnerable under high-concurrency multi-operator deployments.

  The 3-layer composition is structurally:

    OUTERMOST: AlertServiceImpl.updateStatus — deliberately non-transactional
               at the SERVICE annotation layer (the AOP-injected @ReactiveTransactional
               provides the wrapping transaction but no row lock).

    MIDDLE:    ActivityAspect.monoActivityAspect — the AOP that adds the
               synthetic @ReactiveTransactional wrapping the intercepted Mono.

    INNERMOST: ReactiveAlertRepositoryImpl — no FOR UPDATE on read or UPDATE;
               no DB-level partial unique index on (data_entity_oddrn, type)
               WHERE status = 'OPEN'.

  The deliberately-server-enforced shape is also visible in the AdministratorPolicy
  reservation, the cascade-binding defence on PolicyServiceImpl.delete, and the
  microservice-specific-attributes exclusion at IngestionServiceImpl — a pattern
  the codebase prefers application-layer invariants over DB-layer constraints.
  In each case the trade-off is: simpler schema, more flexible application logic,
  more concurrency races to manage.

  Recommended cleanup paths:

    (a) Add a partial unique index at the DB layer:
        CREATE UNIQUE INDEX alert_open_unique_per_data_entity_and_type
        ON alert (data_entity_oddrn, type)
        WHERE status = 'OPEN' AND deleted_at IS NULL;

    (b) Add @ReactiveTransactional + SELECT ... FOR UPDATE to AlertServiceImpl.updateStatus
        — closes the race window at the application layer without schema change.

    (c) Add an integration test using Testcontainers + ReactivePostgres to fire
        two concurrent reopen requests; assert one succeeds and one fails with
        the 400 BadUserRequestException.

  Cross-references:
    - Companion invariant: `service-tier-transactional-asymmetry-between-sibling-services`
      (AlertServiceImpl.updateStatus is the DELIBERATE exception; PolicyServiceImpl
      is the OVERSIGHT shape).
    - Companion invariant: `administrator-name-reservation-asymmetry-on-crud`
      (same pattern of server-enforced invariant over DB constraint).
