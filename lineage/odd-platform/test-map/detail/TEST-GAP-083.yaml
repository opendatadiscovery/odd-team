gap_id: TEST-GAP-083
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java ActivityController controller-method:getActivity
surfaced_by:
- getActivity.md:tests_coverage_semantic.uncovered_behaviours.[5]
- getActivity.md:security.known_security_gaps.[0] (severity HIGH)
behaviour: '`/api/activity` and `/api/activity/counts` are globally readable by ANY
  authenticated user — exposes who-changed-what audit trail across every owner including
  ActivityState old/new diffs of descriptions, business names, ownership changes,
  custom metadata. No `@PreAuthorize`, no programmatic permissionService check, no
  SECURITY_RULES entry.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ActivityFeedAuthorizationTest.java
  name: getActivity_authenticatedCallerNotOwnerOfAnyEntity_returns200WithCrossOwnerAuditTrail
evidence:
- 'getActivity.md says: ''any authenticated user can read the GLOBAL activity feed
  across every owner in the platform — including audit trails for resources they have
  no ownership association with, exposing actor identity (created_by) and full old-state/new-state
  diffs'''
- 'concepts.yaml:entities[Activity Feed].security_aggregate.weaknesses.[0] verbatim:
  ''Global /api/activity returns audit trails across every owner ... to ANY authenticated
  user (severity HIGH)'''
- 'Grep against `odd-platform-api/src/test` for `ActivityController|fetchAllActivities`:
  0 matches (verified 2026-05-10)'
cross_references:
- concepts.yaml:entities[Activity Feed].security_aggregate.weaknesses.[0]
- concepts.yaml:entities[Data Entity].security_aggregate.weaknesses.[2,3] (per-entity
  activity, related family)
- doc-gaps.md:DOC-GAP-025 (per-entity getDataEntityActivity exposure — same family,
  prior coverage)
proposed_action: Add `@WebFluxTest`-driven matrix asserting (anonymous-with-DISABLED,
  authenticated-no-owner-link, authenticated-with-owner-link) all return 200 with
  cross-owner activity. Lock the posture; expose the gap; convert to deliberate fail-cases
  when an authorization model is added.
