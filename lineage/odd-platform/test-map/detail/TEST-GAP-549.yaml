  name: "externalTagIngestion_writesToTagDirectory_emitsNoActivityFeedEntry_pinsAuditAsymmetry"
evidence:
  - "ReactiveTagRepositoryImpl.md says (known_security_gaps.[0]): 'The ingestion-side path (ExternalTagIngestionRequestProcessor) writes via this repository directly and produces NO activity-feed entry.' severity: MEDIUM"
