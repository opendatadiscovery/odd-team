      ReactiveActivityRepositoryImpl.java:156-158 +
      ReactiveOwnerAssociationRequestRepositoryImpl.java:80-84 +
      ReactiveOwnerRepositoryImpl.java:77-78 +
      ReactiveUserOwnerMappingRepositoryImpl.java:116-127. Severity: MEDIUM.
  - facet: Positional INSERT schema-evolution fragility (batch N)
    observed: |-
      `ReactiveUserOwnerMappingRepositoryImpl.createRelation` at line 45
      uses `.values(ownerId, oidcUsername, provider, DSL.val(null, DATE))`
      — passing values POSITIONALLY without column names. The schema order
      MUST be (owner_id, oidc_username, provider, deleted_at) for this to
      be correct. Per V0_0_4__add_user_owner_mapping.sql:3-4 +
      V0_0_55__add_policies_and_roles.sql:1-2 + V0_0_89__update_user_owner.sql:1-2
      the actual current order matches — but a future migration that
      ADDS a column BETWEEN existing columns (e.g. `created_at TIMESTAMP
      DEFAULT NOW()` inserted between `provider` and `deleted_at`) would
      cause jOOQ codegen to update its model AND the literal `.values(...)`
      call would silently insert into the wrong columns. Latent migration-time
      bug — only triggered by future schema evolution. The maintainer should
      have used `.set(USER_OWNER_MAPPING.OWNER_ID, ownerId).set(...)` or
      `.columns(...).values(...)` form.
    expected: |-
      Refactor to `.set(...)` per-column form for schema-evolution safety.
    drift_class: positional_insert_schema_evolution_fragility
    provenance: |-
      STATIC — primary-source in batch N ReactiveUserOwnerMappingRepositoryImpl
      sidecar bugs_limitations_corner_cases[4] + concepts.invariants[5] +
      ReactiveUserOwnerMappingRepositoryImpl.java:44-46 +
      V0_0_4__add_user_owner_mapping.sql:3-4 +
      V0_0_89__update_user_owner.sql:1-2. Severity: LOW.
  - facet: No @ReactiveTransactional on multi-statement createRelation (batch N)
    observed: |-
      `createRelation` (lines 41-51) issues TWO SQL statements
      (deleteActiveRelationByOwner UPDATE + INSERT) chained via `.then()`.
      The reactive `.then()` operator chains Monos but does NOT imply
      a single transaction — the two statements happen on potentially
      different R2DBC connections under reactive backpressure. If the
      UPDATE succeeds and the INSERT fails (partial unique index
      violation against
      `user_owner_mapping_oidc_username_provider_deleted_key` because the
      outer service-layer clear-by-(username, provider) was not applied),
      the UPDATE's soft-delete of the previous mapping is NOT rolled back.
      The user is left UNMAPPED. Depends on whether the caller's service
      is @ReactiveTransactional: UserOwnerMappingServiceImpl is NOT;
      OwnerAssociationRequestServiceImpl IS (line 53 — so the standard
      approval path is atomic; the operator-manual path
      UserOwnerMappingServiceImpl.createRelation directly is NOT).
    expected: |-
      Either @ReactiveTransactional on the repository's createRelation OR
      on UserOwnerMappingServiceImpl.createRelation. Either fix is one-line.
    drift_class: no_reactive_transactional_multi_statement_create_relation
    provenance: |-
      STATIC — primary-source in batch N ReactiveUserOwnerMappingRepositoryImpl
      sidecar bugs_limitations_corner_cases[6] + concepts.invariants[7] +
      ReactiveUserOwnerMappingRepositoryImpl.java:41-51 +
      UserOwnerMappingServiceImpl.java:14-18 +
      OwnerAssociationRequestServiceImpl.java:53. Severity: MEDIUM.
  - facet: soft-delete-only table growth — no operator pruning path (batch N)
    observed: |-
      All three 'delete' methods (deleteRelation, deleteActiveRelationByOwner,
      the embedded clear in createRelation) are UPDATE statements setting
      `DELETED_AT = generateNow()`. No `DELETE FROM user_owner_mapping`
      exists in the codebase (Grep-verified). Every binding-change
      soft-deletes the prior row and inserts a new one — the table grows
      MONOTONICALLY. A 1000-user platform churning mappings monthly
      accumulates ~12K rows annually. Partial unique indexes bound query
      times for the operationally-active subset, but the soft-deleted
      historical rows accumulate forever with no documented operator-
      driven pruning path (no Housekeeping job exists for this table).
    expected: |-
      Either (a) add a HousekeepingJob entry for user_owner_mapping with a
      configurable TTL on deleted_at (mirror of the existing AlertHousekeepingJob),
      OR (b) document the safe-to-prune semantic for operators
      (`DELETE FROM user_owner_mapping WHERE deleted_at IS NOT NULL`).
    drift_class: soft_delete_only_table_growth_no_pruning
    provenance: |-
      STATIC — primary-source in batch N ReactiveUserOwnerMappingRepositoryImpl
      sidecar implicit_adrs[0] + docs_link_semantic.doc_drift_findings[2] +
      performance.known_performance_gaps[1] +
      ReactiveUserOwnerMappingRepositoryImpl.java:56-74 +
      V0_0_89__update_user_owner.sql:1-15. Severity: LOW.
  - facet: type mismatch on deleted_at INSERT — DATE vs TIMESTAMP (batch N)
    observed: |-
      Line 45 of ReactiveUserOwnerMappingRepositoryImpl declares the type
      of the null literal as `DSL.val(null, DATE)`. The schema column is
      `TIMESTAMP WITHOUT TIME ZONE` (V0_0_89__update_user_owner.sql:2).
      Postgres tolerates this because casting NULL to either type is
      equivalent — but the type mismatch is a code smell that would cause
      confusion or breakage if someone later changes the value to a non-null
      literal (e.g. for an audit-export or restoration utility).
    expected: |-
      Change to `DSL.val(null, TIMESTAMP)` to match the schema.
    drift_class: type_mismatch_deleted_at_insert_DATE_vs_TIMESTAMP
    provenance: |-
