pillar_anchored_feature_name: Feature-Local State Persistence (jotai per-Provider stores vs Redux global store paradigm split)
feature_name: |-
  Feature-Local State Persistence — four UI feature areas (Data Quality
  Dashboard / OwnerAssociations / DEGLineage / DatasetStructure compare)
  use jotai atoms scoped via per-feature `<Provider>` wrappers that produce
  a fresh empty state on every route mount; the rest of odd-platform-ui
  uses a single global Redux store whose feature-slice state survives
  navigation. The operator-observable consequence is that the four
  jotai-scoped feature areas FORGET their UI state (filter selections,
  selection cursors, expand/collapse states) the moment the user
  navigates away and back, while every other feature retains.
primary_drift_class: ui_state_management_paradigm_split_jotai_per_provider_resets_filters_on_navigate_away
drift_class_summary:
