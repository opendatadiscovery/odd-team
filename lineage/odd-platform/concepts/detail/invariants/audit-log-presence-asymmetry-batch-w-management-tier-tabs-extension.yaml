notes: |-
  This invariant captures the FIRST cross-Management-tier
  enumeration of the Tier-2 unaudited surface. Previous batches
  framed the pattern as RBAC-specific (Role + Policy + Owner);
  batch W's 5 Management-tier controller class-level sidecars
  reveal the pattern is CROSS-PILLAR — Tier-2 spans ALL Management-tier
  admin surfaces, not just RBAC.

  The architectural pattern's load-bearing observation: the
  Activity Feed is designed for DATA mutations, not CONFIG
  mutations. This is a DELIBERATE design choice per the platform's
  documented architecture (ADR-CANDIDATE-003). The operator-facing
  consequence is the inverse of security-conscious expectation:
  the AUTHORIZATION model is precisely the surface a security
  audit would need to reconstruct, and it is precisely the surface
  with no audit log.

  STRENGTHENED batch 2026-05-21ZB — the 4 DataSourceController
  method sidecars re-verify the Tier-2 data_source surface at
  method-scoped primary source (commit 80637ed). This is a
  confidence-raising re-verification, not an enumeration widening —
  the class node already named all 4 DataSource paths as Tier-2.

  Cross-cutting connections:
    - STRENGTHENS the master no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f
      (extends from RBAC-only to all Management-tier admin
      surfaces; 4 NEW Tier-2 services confirmed)
    - STRENGTHENS the canonicalisation candidate
      audit-log-presence-asymmetry-2-tier-audit-story
      (extends the 2-tier framing to 7 confirmed Tier-2 services)
    - Pairs with f-006-audit-silence-enum-rooted-deeper-than-schema-rooted
      (the SCHEMA-rooted root cause; THIS invariant adds the
      cross-pillar surface enumeration)
    - Pairs with collector-plaintext-token-chain-controller-tier-closure
      (the token rotation is forensically dark per THIS invariant;
      operators investigating an incident cannot reconstruct
      rotation history)
    - Pairs with namespace-create-side-doors-cross-pillar-4-sister-services
      (the side-door namespace creations are forensically dark; the
      side-door bypasses NAMESPACE_CREATE gate AND emits no Activity
      event)
    - Pairs with deletetag-cascade-asymmetric-orphans-tag-to-dataset-field
      (the tag deletion is forensically dark; orphan rows persist
      with no audit trail of when the parent tag was deleted)
    - Pairs with operations register-data-source / update-data-source-ui-admin-replace
      / delete-data-source-ui-admin-guarded-soft-delete /
      regenerate-data-source-token (all 4 DataSource UI-admin write
      operations are Tier-2 unaudited)

  Three DOC-NNN candidates:
    (a) /configuration-and-deployment/enable-security/authorization
        — explicit text on the audit-log gap + recommended
        external audit logging
    (b) /features/active-platform-features/activity-feed — explicit
        enumeration of captured vs uncaptured event types
    (c) /features/management — admonition on each Management tab
        page: 'Mutations on this tab do NOT produce Activity Feed
        entries.'
