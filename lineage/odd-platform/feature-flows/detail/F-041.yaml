    kind: feeds
    via: |-
      The toolbar's Catalog tab is the user's primary entry into Data
      Discovery (P-01) — searchPath() → /search/{newSessionId}. The toolbar
      is the named entry point in the live docs' Search page ("navigate to
      the main page of ODD Platform and select the Catalog tab").
  - pillar_id: P-06
    kind: feeds
    via: |-
      The toolbar's Dictionary tab is the entry point to Data Glossary
      (P-06) — termsSearchPath() → /termsearch/{newSessionId}. The
      label/URL drift (Dictionary → /termsearch) is anchored at the i18n
      key + the route constant. F-024 owns the downstream surface; F-041
      owns the navigation chrome that lands the user there.
  - pillar_id: P-08
    kind: composes
    via: |-
      The toolbar is THE Management & Administration pillar's user-facing
      chrome — Management tab routes into /management/* (Owner / Role /
      Policy / Tag / Lookup-Table / Identity-Provider admin). Visibility
      of the Management tab is UNCONDITIONAL — every authenticated user
      (and every anonymous caller under DISABLED) sees it.
  - pillar_id: P-09
    kind: feeds
    via: |-
      The toolbar renders the principal-identity label (owner.name ??
      identity.username) — the UI surface of F-011 Principal-to-Owner
      Resolution. Under DISABLED the rendered label is the literal "admin"
      string (IdentityController.dummyOwner — REFACTOR-185 19-sidecar
      cluster). The Logout link is a HARDCODED /logout — under DISABLED
      no Spring-Security handler is registered; the click 404s.
  - pillar_id: P-07
    kind: shares_data_with
    via: |-
      The toolbar's tab visibility is INDEPENDENT of F-034 Platform
      Feature-Flag Exposure — App.tsx:49 dispatches fetchActiveFeatures
      on mount but ToolbarTabs.tsx:34-82 does NOT consume the result.
      Data Modelling / Data Collaboration features can be disabled at
      the backend yet the tabs still render and navigate to empty pages.
