        - "postMessageInSlack.md:security.known_security_gaps.[2] (cross-owner posting)"
        - "getActivity.md:security.known_security_gaps.[0] (global activity cross-owner)"
    performance_aggregate:
      overall: LOW
      hot_paths:
        - "GET /api/dataentities/{id} (getDataEntityDetails) — single hottest endpoint, multi-table JOIN, every UI navigation hits it — DataEntityController"
        - "GET /api/dataentities/{id}/lineage/{downstream|upstream} — graph walk with caller-controlled depth, no upper bound — DataEntityController + openapi-tag:dataEntity"
        - "GET /api/dataentities/popular and /api/dataentities/my* — recommendation-panel hot paths invoked on every catalog-overview render — DataEntityController"
        - "GET /api/dataentities/{id}/metrics — Prometheus-style metric query on Metrics tab open — DataEntityController"
        - "GET /api/directory and /api/directory/datasources?prefix={prefix} — Directory landing/drill down loads ALL data sources via dataSourceRepository.list() (no pagination) — DirectoryController"
        - "POST /api/dataentities/{id}/files/uploads/{uploadId}/chunks — N invocations per upload (1 per chunk); per-chunk DB SELECT via checkProcessingUploadById + filesystem write to /tmp/odd/chunks/{uploadId}/{index} — uploadFileChunk"
        - "GET /api/activity (and /api/activity/counts) — global audit-feed listing; 4 parallel aggregation queries on counts call; on critical path of activity-feed UI render — getActivity"
      throughput_shape:
        verdict: SINGLE_ITEM_ONLY
        detail: "All 40 mutating endpoints take a single dataEntityId path variable; no bulk-update endpoint for description/name/status/ownership/tags/terms/metadata/alert config. Bulk operator workflows (tag-namespace, status-batch) require N round-trips. Per-chunk upload is single-chunk-per-request (no batch chunk endpoint). Activity feed is single-window per call (no batch / multi-window endpoint)."
      scaling_shape:
        verdict: UNPAGINATED
        detail: "Lineage endpoints unbounded `lineageDepth` + unbounded `expandedEntityIds`. Page/Size pagination required but unconstrained at controller (no @Max). Directory landing has no pagination on type-card list. `getDataEntityClasses`/`getDomains`/`getDataEntitiesUsage` are platform-wide aggregates with no caching. Activity feed `size` parameter unbounded (no @Max). Attachment chunk staging keyed only by uploadId (per-instance local filesystem) regardless of attachment.storage mode."
      strengths:
        - "All 40 endpoints reactive Mono<ResponseEntity<...>> — non-blocking I/O, request thread released during DB await (DataEntityController.java:84-453)"
        - "Stateless controller — instances scale horizontally; no in-memory state, no locking, no advisory locks (DataEntityController.java:71-81)"
        - "Activity stream uses cursor pagination (`lastEventId` + `lastEventDateTime`) — appropriate for append-only audit data, avoids deep-offset cliffs (DataEntityController.java:351-365 + ActivityController.java:34-35)"
      weaknesses:
        - "No upper bound on pagination `size` parameter at the controller — caller can pass `size=2147483647` per spec (components.yaml:4213-4229)"
        - "No max-depth bound on lineage endpoints; `lineageDepth=1000000` reaches LineageService unmodified (DataEntityController.java:256-273)"
        - "DataEntityGroup lineage (`/api/dataentitygroups/{id}/lineage`) accepts no depth parameter at all (openapi.yaml:2418-2433)"
        - "No caching on platform-wide aggregates `getDataEntityClasses` / `getDomains` / `getDataEntitiesUsage`"
        - "No `@Timed` / Micrometer / structured logging at the controller layer — latency regressions invisible at controller boundary"
        - "No bulk-operation endpoints for any per-entity attribute — UI bulk workflows pay N round-trips"
        - "Directory landing page loads all data sources unfiltered into memory (DirectoryServiceImpl.java:48-50) — O(N) memory + parsing on every hit"
        - "Reflection-based ODDRN-property extraction in Directory is unmemoised (DirectoryServiceImpl.java:153-171)"
        - "Multi-instance attachment chunk staging broken for BOTH LOCAL and REMOTE storage backends — chunk path /tmp/odd/chunks is hardcoded, not config-driven (uploadFileChunk.md:performance.known_performance_gaps.[0])"
        - "Activity counts endpoint issues 4 parallel aggregation queries per call — 4x DB load on every counts refresh (getActivity.md:performance.known_performance_gaps.[1])"
      cross_file_inconsistencies:
        - "Activity stream uses cursor pagination; everything else uses offset pagination — single inconsistent shape across the controller's 40 endpoints"
        - "Directory carries platform-wide aggregates without pagination; DataEntityController list endpoints carry pagination but no caps — different unscoped patterns for the same Data Entity concept"
        - "Chunk staging path /tmp/odd/chunks is the same for LOCAL and REMOTE storage; class-level Attachment sidecar identified LOCAL multi-instance risk, method-level uploadFileChunk sidecar reveals it's storage-mode-independent"
      contributing_files:
        - "DataEntityController.md"
        - "openapi-tag-dataEntity.md"
        - "DirectoryController.md"
        - "DataEntityAttachmentController.md"
        - "uploadFileChunk.md"
        - "getActivity.md"
      evidence:
