  - facet_id: F-018-DRIFT-XTAGGING-deleteTag-fts-too-late
    facet: |-
      deleteTag FTS refresh runs AFTER the tag_to_term rows are hard-deleted —
      the discovery CTE finds nothing, so the single term-side search-vector
