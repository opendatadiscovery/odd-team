behaviour: Policy correctness — no test asserts the join across roles → policies →
  statements → context returns the expected permission set for canonical fixtures.
  A regression in `DataEntityPermissionExtractor`, in `AbstractContextualPermissionExtractor.getContextualResourcePermissions`'s
  zip/flatMap, in the `Permission ↔ PolicyPermissionDto` name mapping, or in the `getRolesPolicies`
  jOOQ query would silently change what the UI shows as 'you can do this'. The DataEntity
  case is especially fragile because the policy resolver depends on the caller's associated
  *owner* — if the user-owner association is missing or stale, the resolved permissions
  diverge from what the same user receives after re-association.
