expected_outcome: |
  Quoting hypothesis H-013 verbatim:
  "Performance of the Popular strip stays acceptable as the catalog grows —
  opening the home page does not get materially slower at 50K-100K entities."

  The Popular query is `ORDER BY view_count DESC` against data_entity with NO
  index on view_count (verified across all 91 migration files in getPopular.md).
  At small N, the LIMIT lets Postgres use a top-N sort; at 50K-100K+ entities
  every home-page render becomes a sequential scan + sort over the whole table,
  on the platform's hottest surface, with no caching layer to absorb repeated
  home-page loads / back-button re-fetches.

  This probe seeds a large catalog and measures GET /api/dataentities/popular
  p50/p95/p99 latency, and captures the query plan, to settle whether the home
  page degrades at scale.

  PASS (H-013 -> confirmed) if p95 stays under a documented bound (300ms is the
  reflection's working threshold for "materially slower"; the maintainer may
  retune). FAIL/CONTRADICTED if p95/p99 climbs materially above the small-seed
  P-003 baseline (p50=106ms) — in which case the missing-index REFACTOR-221 is
  the empirically-confirmed root cause and the fix anchor is the partial index
  on (view_count DESC) WHERE hollow=false AND status != DELETED.
