notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "label" + "URL" + "drift" + "Catalog" — found
  `invariant:tab-click-drops-session-state-cross-route-pattern`
  (covers the Search/Catalog name drift as a compounding factor,
  not as a primary invariant). No existing concept enumerates the
  four label-vs-URL drift cases as a structural pattern.

  This invariant unifies the four discrete label-URL drift
  observations into ONE pattern — the ToolbarTabs hard-coded
  literal array consistently names labels in one vocabulary while
  the routes/* helpers use different vocabulary. The pattern
  affects 4 of 9 tabs; the fix shape is per-tab and per-deployment-
  cost.
