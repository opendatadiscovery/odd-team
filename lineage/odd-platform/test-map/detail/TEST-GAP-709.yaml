behaviour: |-
  **DataQualityController EXEMPLIFIES THE READ-COLLABORATIVE-ASYMMETRIC OWNER-SCOPING PATTERN: 4 GETs unscoped, lone PUT owner-scoped via `DATA_ENTITY` AuthorizationManagerType.** The four read endpoints (`getDataEntityDataQATests` GET `/api/datasets/{id}/dataqatests`, `getDatasetTestReport` GET `/api/datasets/{id}/test_report`, `getSLA` GET `/api/datasets/{id}/sla`, `getDatasetSLAReport` GET `/api/datasets/{id}/sla_report`) have NO `@PreAuthorize` and NO entry in `SecurityConstants.SECURITY_RULES`; they fall through to `.pathMatchers('/**').authenticated()` (`AuthorizationCustomizer.java:29-30`). The downstream `ReactiveDataQualityRepositoryImpl` queries apply only `dataset.HOLLOW.isFalse()` + `dataQualityTest.STATUS.ne(DELETED)` filters (`ReactiveDataQualityRepositoryImpl.java:46-58, 62-84, 105-126`) — no owner join, no principal-derived predicate. The PUT `setDataQATestSeverity` IS registered with `DATA_ENTITY` resource type + `DATASET_TEST_RUN_SET_SEVERITY` permission (`SecurityConstants.java:243-246`) — owner-scoped through the AuthorizationManagerType.DATA_ENTITY wiring. **The asymmetry is intentional** (per DataQualityController.md implicit_adrs[0] — "a maintainer made the deliberate decision to add ONE rule and not five"), consistent with ADR-CANDIDATE-003 (read-collaborative posture), and corroborates the platform-wide REFACTOR-024 family. **It is also undocumented**: the live `data-quality.md` + `sla-statuses.md` + `test-results-import.md` pages (all WebFetched 2026-05-20 status 200) make NO statement about who can view per-dataset DQ tests, test reports, or SLA colour, NOR about why setting severity requires ownership. **No test pins this**: the only DQ tests are calculator-tier (`SLAColourTest`, `SLAReportTest`) and repository-tier (`DataQualityRepositoryImplTest`, `ReactiveDataQualityRunsRepositoryTest`); no test invokes the WebFlux controller boundary, asserts the four-reads-unscoped behaviour, the one-PUT-owner-scoped behaviour, or the 403 path on the PUT for a non-owner caller. A future regression that adds `@PreAuthorize` to the four reads OR removes the PUT gate would slip through.
