- id: H-008
  hypothesis: "When an operator clicks Remove on a binding that was already removed (e.g. a second admin removed it, or a double-click), the operation behaves consistently and the operator is told it no longer exists (404)."
  derivation: "Concurrent-admin / double-click edge on a destructive op; the response contract on already-removed should be defined."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The delete is idempotent at the data layer (the soft-delete UPDATE WHERE deleted_at IS NULL is a no-op when no
      active row matches) and the call is atomic (@ReactiveTransactional at OwnerAssociationRequestServiceImpl.java:117).
      BUT there is no .switchIfEmpty(NotFoundException) on the cancel-then-delete chain
      (OwnerAssociationRequestServiceImpl.java:118-122) — so removing an already-removed binding returns success (204)
      rather than 404, and the 204-vs-404 distinction is undefined and untested
      (OwnerAssociationRequestController.md bugs_limitations_corner_cases). The UI would show the success toast
      "Association removed successfully" even though nothing was removed. Works (no crash, no double-effect); does not
      tell the operator the row was already gone.
    evidence:
      - sidecar: OwnerAssociationRequestController
        section: bugs_limitations_corner_cases
        cite: "OwnerAssociationRequestServiceImpl.java:118-122"
        note: "no .switchIfEmpty(NotFoundException); 204-vs-404 untested"
      - sidecar: ReactiveUserOwnerMappingRepositoryImpl
        section: invariants
        cite: "ReactiveUserOwnerMappingRepositoryImpl.java:65-74"
        note: "UPDATE WHERE deleted_at IS NULL is a safe no-op on already-removed rows"
    operator_visible_failure: |
      Two admins racing to revoke the same user, or a double-click, both get "Association removed successfully" — the
      second one removed nothing but is told it succeeded. Harmless to data (idempotent no-op) but the false-positive
      success toast can mislead an operator into thinking their action took effect when the prior state already held.
    severity: LOW
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

