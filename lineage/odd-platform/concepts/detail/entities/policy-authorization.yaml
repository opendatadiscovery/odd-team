security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: INCONSISTENT
    detail: 'SECURITY_RULES wires POLICY_CREATE / POLICY_UPDATE / POLICY_DELETE at
      lines 163-168 (NO_CONTEXT MANAGEMENT-tier), but the gate is bypassed under `auth.type=DISABLED`
      (DisabledAuthSecurityConfiguration.java:13-18 — `anyExchange().permitAll()`).
      Sibling `GET /api/policies/schema` (PolicyController.java:60-63) has NO SECURITY_RULES
      entry — falls through to `.authenticated()`. Under `auth.type=LOGIN_FORM` the
      AuthorizationCustomizer is NOT wired (cross-ref Auth Mode aggregate) so SECURITY_RULES
      is INERT — every form-authenticated user is ADMIN with effective POLICY_CREATE.
      **Batch H confirms at SQL primary source**: ReactivePolicyRepositoryImpl has
      NO authorization annotations whatsoever; defence-in-depth is null; a direct
      service-bypass invocation reaches the SQL with no caller-ID check. Authorization
      is the upstream controller / service layer''s responsibility. **Batch I service-layer
      confirms**: PolicyServiceImpl has NO @PreAuthorize, NO @Secured, NO programmatic
      `permissionService.hasPermission(...)` call on any method (verified PolicyServiceImpl.java:1-117).
      The Administrator-name reservation at lines 76, 87 IS a runtime authorization-shaped
      check (it blocks an authenticated, POLICY_UPDATE/POLICY_DELETE-bearing user
      from mutating a specific protected row) but it is not framework-level —
      it is service-coded logic, bypassable by any direct service caller.'
  owner_scoping:
    verdict: N/A
    detail: 'Policies are global authorization documents; the `policy` table has no
      `owner_id` column. MANAGEMENT-tier permission gates them globally. **Batch H
      SQL primary source confirms**: V0_0_55__add_policies_and_roles.sql:19-28 — no
      tenant column, no owner column; ReactiveAbstractCRUDRepository global selects.
      **Batch I service layer confirms**: list path branches by user role IN MEMORY
      (PolicyServiceImpl.java:52-60) — for admin users, takes repository.list path;
      for non-admin, takes the in-memory branch IGNORING page/size. NOT owner-scoping
      — role-based filtering.'
  strengths:
  - JSON-Schema-at-write-time invariant — PolicyJSONValidator loads the schema once
    at construction (V201909) and validates per request; persisted text column is
    always schema-valid (createPolicy.md:implicit_adrs.[1])
  - Administrator policy reserved by name on UPDATE + DELETE (createPolicy.md:implicit_adrs.[3])
  - Soft-delete-aware partial UNIQUE INDEX `policy_name_unique` on `policy(name) WHERE
    deleted_at IS NULL` (V0_0_55__add_policies_and_roles.sql:30) — deleted policy's
    name reusable; live duplicates rejected at DB layer
  - '**Batch H — centralised friendly-error translation via ExceptionUtils.translateDatabaseException**
    (JooqReactiveOperations.java:41) — every R2DBC query maps `DataAccessException`
    → `UniqueConstraintException` with per-constraint human-readable message (e.g.
    POLICY_NAME_UNIQUE → "Policy with this name already exists"). No raw Postgres
    errors leak to the API. (ReactivePolicyRepositoryImpl.md:implicit_adrs.[2])'
  - '**Batch H — soft-delete-via-deleted_at is the consistent pattern across every
    CRUDable platform entity** (role, owner, data_source, collector, namespace, tag,
    term, data_entity NB — DataEntity overrides to STATUS-state-machine via subclass).
    The architectural commitment: every operator-facing entity is soft-delete-recoverable;
    only join tables and immutable audit-like tables use hard delete. (ReactivePolicyRepositoryImpl.md:implicit_adrs.[0])'
  - '**Batch I — service-layer cascade-binding defence on DELETE** — PolicyServiceImpl.delete
    (lines 89-92) issues `roleToPolicyRepository.isPolicyAttachedToRole(id)` and
    raises `CascadeDeleteException("Policy is attached to a role")` if any role_to_policy
    row references the policy. The SOLE service-layer defence against the orphan-binding
    permission leak that batch H established at the SQL layer. Surfaces as HTTP 400
    via ControllerAdvice with the friendly message.'
  weaknesses:
  - '**Administrator-name reservation asymmetry (HIGH for defence-in-depth)** — `update`
    + `delete` reject mutations against the seeded Administrator name; `create` does
    NOT. If the seeded row is ever soft-deleted, a custom Administrator policy with
    arbitrary statements becomes creatable. Cross-cutting NEW invariant — see ''Administrator-name
    reservation asymmetry''. (createPolicy.md:security.known_security_gaps.[5] +
    batch I PolicyServiceImpl.md:security.known_security_gaps.[1] PRIMARY-SOURCE
    confirmation at SERVICE LAYER)'
  - '**No anti-elevation guard (HIGH)** — `{resource: {type: MANAGEMENT}, permissions:
    [ALL]}` is a legal policy shape identical to the seeded Administrator. POLICY_CREATE
    is functionally root-on-the-platform; the docs do not flag this. (createPolicy.md:security.known_security_gaps.[2]
    + batch I PolicyServiceImpl.md:security.known_security_gaps.[5])'
  - '**No audit log on policy mutations (HIGH)** — `PolicyServiceImpl.create` has
    no `@Slf4j` log calls, no event publication, no audit-table insert (createPolicy.md:bugs_limitations_corner_cases.[1]).
    A security incident reviewer cannot answer ''who authored this MANAGEMENT/ALL
    policy on date X?'' Cross-cutting invariant — see ''No-audit-log on RBAC mutations''.
    **Batch H confirms at SQL primary source**: ReactivePolicyRepositoryImpl + its
    soft-delete + abstract-CRUD parents emit ZERO security-relevant log lines on
    {create, update, delete} — ExceptionUtils.translateDatabaseException emits one
    log.error ONLY on non-uniqueness DB errors (ExceptionUtils.java:34). Persistence-layer
    code is forensically silent on the RBAC mutation path. **Batch I confirms at
    SERVICE primary source**: PolicyServiceImpl has NO @Slf4j annotation, NO Logger
    field, NO `log.info / .warn / .error` call (verified PolicyServiceImpl.java:1-117
    end-to-end). Create, update, delete of policies produce ZERO application-level
    log lines. The entire policy-mutation stack (controller + service + repository)
    is forensically dark — incident review must consult external DB audit.'
  - '**Under `auth.type=DISABLED`, POLICY_CREATE is bypassed entirely (HIGH on DISABLED
    deployments)** — `anyExchange().permitAll()` short-circuits SECURITY_RULES. Any
    network-reachable caller can create MANAGEMENT/ALL policies; full escalation requires
    also creating + binding a role (POST /api/roles is similarly bypassed). DISABLED
    + reachable network port + RBAC primary-surface = catastrophic exposure. (createPolicy.md:security.known_security_gaps.[0])'
  - '**PolicyJSONValidator raises IllegalArgumentException, not BadUserRequestException
    (MEDIUM)** — invalid schema may surface as 500 rather than 400. (createPolicy.md:security.known_security_gaps.[3])
    **Batch I PRIMARY-SOURCE confirmation**: PolicyServiceImpl.java:64, 73 invoke
    `policyJSONValidator.validate(...)` which throws `IllegalArgumentException("Policy
    is not valid: " + errors)` (PolicyJSONValidator.java:28-32). ControllerAdvice.java:23-66
    has NO `@ExceptionHandler(IllegalArgumentException.class)` — falls through to
    catch-all at lines 61-66; surfaces as HTTP 500 with body "Internal Server Error"
    (NOT 400 with detail). One-line fix: either PolicyJSONValidator throws BadUserRequestException
    or ControllerAdvice adds IllegalArgumentException handler.'
  - '**Duplicate-name POST surfaces as DB UNIQUE-constraint violation (MEDIUM)** —
    service has no pre-check; second POST with same name falls through to repository
    INSERT and hits `unique_violation` SQLSTATE 23505 unhandled (createPolicy.md:security.known_security_gaps.[4]).
    **Batch H REFINES**: actual surface is HTTP 400 (USR003) with friendly message
    "Policy with this name already exists" via ExceptionUtils.translateDatabaseException
    + ControllerAdvice.handleUniqueConstraint mapping to HttpStatus.BAD_REQUEST —
    NOT 5xx as some prior sidecars suggested. (ReactivePolicyRepositoryImpl.md:concepts.invariants.[2]
    + ExceptionUtils.java:60-62)'
  - '**NEW BATCH H — getRolesPolicies returns SOFT-DELETED policies that still have
    surviving role bindings (HIGH)**: the SQL JOIN at ReactivePolicyRepositoryImpl.java:32-35
    selects every policy row where `policy.id = role_to_policy.policy_id AND role_to_policy.role_id
    IN (...)` with NO `policy.deleted_at IS NULL` predicate. Combined with the absence
    of a cascade between `policy.deleted_at` and `role_to_policy`, a soft-deleted
    policy with surviving role bindings continues to confer permissions on users in
    those roles. Today PolicyServiceImpl.delete defends by raising CascadeDeleteException
    if `isPolicyAttachedToRole` returns true (PolicyServiceImpl.java:89-92), BUT:
    (a) any DB-direct UPDATE setting deleted_at (operator hot-fix, schema migration
    mistake, broken admin script) bypasses the defence; (b) any future refactor weakening
    the service-layer check re-opens the gap. The correct repository-layer defence
    is `AND policy.deleted_at IS NULL` in the JOIN''s WHERE clause. Combined with
    no audit-log on policy mutations, an orphan-binding-leaked permission would be
    forensically invisible. (ReactivePolicyRepositoryImpl.md:security.known_security_gaps.[0]
    + bugs_limitations_corner_cases.[0])'
  - '**NEW BATCH H — Soft-delete recreation invariant + Administrator-name asymmetry
    compound risk (MEDIUM)**: PolicyServiceImpl.update / .delete reject `Administrator`
    by name, but `create` does NOT. The repository layer enforces uniqueness via `policy_name_unique
    WHERE deleted_at IS NULL`, so a duplicate-Administrator INSERT against the live
    seeded row will fail with UniqueConstraintException. HOWEVER, if the seeded Administrator
    row is ever soft-deleted by any path (today no service-layer path soft-deletes
    Administrator because of the rejection at PolicyServiceImpl.java:87-88, but a
    direct DB UPDATE setting `policy.deleted_at` on the Administrator row could do
    it), the partial unique index would free the name AND PolicyServiceImpl.create
    has no name-protection check — a new policy named `Administrator` with attacker-chosen
    statements could be created. The repository''s partial-unique-index design is
    correct; the gap is in the service layer''s create-path missing-symmetry, but
    the repository''s soft-delete-aware uniqueness rule MAKES the gap exploitable.
    (ReactivePolicyRepositoryImpl.md:security.known_security_gaps.[2])'
  - '**NEW BATCH I — No service-layer transaction boundary across read-then-write
    update path (MEDIUM)**: PolicyServiceImpl.update (lines 71-81) issues `policyRepository.get(id)`
    then `policyRepository.update(...)` — two separate R2DBC calls outside any @ReactiveTransactional.
    A concurrent UPDATE of the same policy by a different caller can interleave: client
    A reads policy v1, client B reads v1, A writes v2, B writes v3 BASED ON v1 (success,
    but A''s v2 was clobbered). The `update_at` column moves monotonically so no exception
    is raised. Lost-update race. Sibling RoleServiceImpl IS transactional — the
    asymmetry is captured in companion invariant `service-tier-transactional-asymmetry-between-sibling-services`.
    One-line fix: add @ReactiveTransactional to PolicyServiceImpl.update. (PolicyServiceImpl.md:bugs_limitations_corner_cases.[0])'
  - '**NEW BATCH I — Cascade-delete check non-atomic with soft-delete (MEDIUM)**:
    PolicyServiceImpl.delete (lines 83-95) issues get + isPolicyAttachedToRole + conditional
    CascadeDeleteException + delete — four separate R2DBC calls outside any transaction.
    A concurrent role-binding mutation between the check (line 89) and the soft-delete
    (line 93) leaves a soft-deleted policy with surviving role bindings — the exact
    state batch H identified at the repository layer. The defence at lines 89-92
    closes the gap in the SEQUENTIAL operator case but NOT in the concurrent-mutation
    case. (PolicyServiceImpl.md:bugs_limitations_corner_cases.[5])'
  - '**NEW BATCH I — Read-side endpoints not gated (MEDIUM)**: `GET /api/policies`,
    `GET /api/policies/{id}`, `GET /api/policies/schema` are NOT in SECURITY_RULES.
    Any authenticated user can enumerate every policy by id and read every statement.
    The list-path branches by role (line 52-60) is a partial defence — non-admin
    users see only their role-attached policies in the LIST — but `getPolicyDetails(id)`
    (line 45-50) does NOT apply role-based scoping; any authenticated user with a
    valid id can fetch any policy''s full details. Confidentiality issue: a non-admin
    user can iterate ids and read MANAGEMENT/ALL policy statements, learning which
    permissions are bundled into which role. (PolicyServiceImpl.md:security.known_security_gaps.[4])'
  cross_file_inconsistencies:
  - Policy schema endpoint `GET /api/policies/schema` is NOT gated by any Permission
    — any authenticated user can fetch the live JSON Schema. Not a vulnerability per
    se, but the docs do not document the endpoint at all. (createPolicy.md:bugs_limitations_corner_cases.[5])
  - 'Pattern parallels Role + Owner: all three have the same Administrator-name-on-update-but-not-create
    asymmetry, and none of three emit audit logs. The catalog records this cross-pattern
    via the ''Administrator-name reservation asymmetry'' and ''No-audit-log on RBAC
    mutations'' cross-cutting invariants.'
  - '**Batch H — is_deleted boolean DDL column is dead schema**: V0_0_55__add_policies_and_roles.sql:26
    declares `is_deleted boolean NOT NULL DEFAULT FALSE` but the soft-delete base
    repository (ReactiveAbstractSoftDeleteCRUDRepository.java:106-110) only writes
    `deleted_at`. A schema reader expecting is_deleted to track delete state will
    reach a wrong conclusion. Either remove the column or trigger-mirror it. (ReactivePolicyRepositoryImpl.md:bugs_limitations_corner_cases.[3])'
  - '**Batch I — service-tier transactional asymmetry between Role + Policy**:
    PolicyServiceImpl.{create,update,delete} ALL UNANNOTATED; sibling RoleServiceImpl.{create,update,delete}
    ALL @ReactiveTransactional. The platform IDIOM (per `repository-transactional-boundary-at-service-layer-not-repository`
    invariant) is service-tier @ReactiveTransactional. PolicyServiceImpl is the
    OUTLIER. (PolicyServiceImpl.md:concepts.invariants.[3] + implicit_adrs.[4])'
  - '**Batch I — non-admin list path silently ignores pagination** (LOW): PolicyServiceImpl.list
    for non-admin users takes the in-memory branch which builds a Page<PolicyPojo>
    with `total = filteredPolicies.size()` and `hasNext = false` regardless of page/size
    request parameters. A non-admin with 1000 effective policies receives a 1000-element
    response on GET /api/policies?page=1&size=20. Pagination contract differs by
    role. (PolicyServiceImpl.md:bugs_limitations_corner_cases.[3])'
  contributing_files:
  - createPolicy.md
  - getResourcePermissions.md
  - ReactivePolicyRepositoryImpl.md
  - PolicyServiceImpl.md
