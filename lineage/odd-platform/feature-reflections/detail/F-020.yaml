- id: H-009
  hypothesis: "When an operator edits a collector and changes only its name, the other fields they did not touch (description, namespace) are preserved."
  derivation: "Endpoint shape (the edit form + PUT /api/collectors/{id}) + the universal operator expectation that an edit form changes the field you edited and leaves the rest alone."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      Update is full-replace, not patch. CollectorServiceImpl.update (lines 50-69)
      calls `collectorMapper.applyToDto(collectorDto.collectorPojo(), form)` and
      CollectorMapper.java:41-47 uses MapStruct @MappingTarget — a whole-pojo
      overwrite. Any field absent (null) in the incoming CollectorFormData nulls the
      corresponding column. So a PUT that carries only the name will null the
      description and namespace. The UI form (CollectorForm.tsx) populates all three
      fields from the existing collector when editing, which masks the hazard in the
      happy UI path — but any partial-update flow (a future UI refactor, a scripted
      caller, an API consumer building a PATCH-shaped request against this PUT)
      silently destroys the unsent fields. The OpenAPI verb is PUT (full-replace is
      technically correct HTTP), but the field semantics are documented nowhere a UI
      or API author would find them before writing a partial update.
    evidence:
      - sidecar: odd-platform__java__CollectorController__controller-class__CollectorController.md
        section: "bugs_limitations_corner_cases[2] (update semantics are full-replace, not PATCH)"
        cite: "CollectorController.java:33-40 + CollectorServiceImpl.java:50-69 + CollectorMapper.java:41-47"
        note: "MapStruct @MappingTarget whole-pojo overwrite; null form fields null the columns."
    operator_visible_failure: |
      (1) A scripted or API consumer sending a name-only update wipes the
