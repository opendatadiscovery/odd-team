proposed_action: |-
  Author IdentityControllerAuditLoggingTest using SLF4J appender capture
  (LoggerFactory testing pattern) to assert that every /api/identity/whoami
  invocation emits at least one log line containing the remote address + the
  resolved auth mode + the resolved principal-or-dummy distinction. Under
  DISABLED specifically, assert a WARN-level line indicating the dummyOwner
  fallback fired. The test STRENGTHENS the cross-batch audit-silence finding
  to a 10-sidecar pattern across IdentityController + the policy/role mutation
  stack (TEST-GAP-221/573/659 covered the RBAC mutation half; this extends to
  the read/identity half). FIX-REQUIRED — the production controller needs the
  log call added before the test can pass.
