mitigations_unimplemented:
  - |-
    The REFACTOR-229 fix scope is unchanged from the master invariant —
    patch JooqFTSHelper.tsQuery (lines 164-168) with either:
      (a) Whitelist — accept only word characters + whitespace; reject
          any input containing tsquery metacharacters.
      (b) Escape — prefix each metacharacter with backslash before
          passing the joined query to to_tsquery.
    Both approaches close the READ-side surface AND THIS INVARIANT
    CONFIRMS THE SCOPE IS BOUNDED TO THIS ONE FUNCTION. Do NOT extend
    the patch to write paths.
  - |-
    Add a regression test that:
      (a) Authors a term with definition containing a tsquery-metacharacter
          payload via POST /api/terms.
      (b) Asserts the write succeeds (because the write path is correct
          — tokenisation handles it).
      (c) Searches for the term via GET /api/termsearch with a query
          containing tsquery metacharacters.
      (d) Asserts the search returns a structured result rather than
          42601 (post-fix) — or asserts 42601 to pin the buggy state
          (pre-fix regression baseline).
    The test pins BOTH the WRITE-path correctness AND the READ-path
    fix.
  - |-
    Watchpoint — track the setweight format-string finding. Add a
    code comment at JooqFTSHelper.java:188 noting that the weight
    letter is currently static and non-user-controlled; if a future
    feature makes the weight operator-configurable, the format string
    becomes an injection surface and must be parameter-bound or
    sanitised.
  - |-
    Documentation: surface the WRITE-vs-READ disambiguation in any
    REFACTOR-229 remediation PR description — maintainers reviewing
    the fix should see the scope justification (one function patch,
    not a whole-codebase audit).
notes: |-
  NEW invariant captured in batch 2026-05-20U from the
  ReactiveTermSearchEntrypointRepositoryImpl primary-source
  examination. The role disambiguation is load-bearing for the
  REFACTOR-229 patch scope decision — without it, a maintainer
  scoping the fix might either over-scope (patching write paths that
  do not need patching) or under-scope (missing that the term-side
  read path is symmetric to the data-entity-side and needs the same
  fix).

  Cross-cutting connections:
    - REFINES the master tsquery-operator-injection-via-persisted-state
      invariant (batch M) by ROLE-DISAMBIGUATING the term-side WRITE
      surface as UPSTREAM but not in-scope
    - Pairs with REFACTOR-229 (the formal refactoring scope)
    - Pairs with the FTS shared-helper pattern — JooqFTSHelper is one
      file with TWO distinct architectural roles (writer + reader);
      conflating them in security scope assessment is the common
      pitfall this invariant guards against

  Three implications for the maintainer's DOC-NNN queue:
    (a) The REFACTOR-229 patch PR scope is now defined precisely —
        one function (JooqFTSHelper.tsQuery), one file.
    (b) The term-side read path inherits the fix without additional
        code change — the fix at one site closes both surfaces.
    (c) The watchpoint at setweight (line 188) is tracked but not
        actionable today; flag it in REFACTOR-229's discussion notes
        for future-feature reviewers.
