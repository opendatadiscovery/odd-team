name: |-
  F-004 read-side surface at column level — DatasetController.getDataSetStructure* exposes verbatim dataset_field.internal_description (write-side complement closure, batch W)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-09
description: |-
  NEW INVARIANT, batch 2026-05-20W — STRENGTHENS the F-004 master
  invariant by adding the READ-SIDE complement at the column level.
  Previous batches established the F-004 fingerprint at the WRITE
  side across 4 surfaces (data-entity description batch F/H, dataset-field
  description batch V via DatasetFieldController, term definition
  batch U, query-example definition+query batch V). Batch W (DatasetController
  class-level) confirms the READ-side closure at the column level:
  every call to GET /api/datasets/{id}/structure* surfaces the
  dataset_field.internal_description field verbatim to the calling
  client.

  THE FULL F-004 PICTURE — column-level vs entity-level:

    The F-004 master class captures stored-XSS-class risk for
    user-curated Markdown / HTML payloads at FIVE surfaces:
      Surface 1 (entity description, batch F/H):
        WRITE: upsertDataEntityInternalDescription endpoint writes
               data_entity.internal_description verbatim
        READ: getDataEntityDetails surfaces the description back
              to the UI
      Surface 2 (dataset-field description, batch V/W):
        WRITE: DatasetFieldController PUT /api/datasetfields/{id}/description
               writes dataset_field.internal_description verbatim
        READ: DatasetController GET /api/datasets/{id}/structure*
              endpoints surface dataset_field.internal_description
              back to the UI (THIS INVARIANT)
      Surface 3 (term definition, batch U):
        WRITE: TermController POST/PUT writes term.definition
               verbatim
        READ: TermController GET surfaces term.definition back
      Surface 4 (query-example definition + query, batch V):
        WRITE: QueryExampleController POST/PUT writes
               query_example.definition + query_example.query verbatim
        READ: QueryExampleController GET surfaces both back
      Surface 5 (every Markdown-rendered field in the UI, batch U):
        Cross-cutting: NONE of the surfaces above use rehype-sanitize
        in the UI render path (Markdown.tsx is the shared component;
        the no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic
        invariant covers this)

  THE COLUMN-LEVEL READ PATH — batch W primary source:

    Read entrypoint 1: DatasetController.getDataSetStructureByVersionId
      URL: GET /api/datasets/{data_entity_id}/structure/{version_id}
      Returns: DataSetStructure { dataSetVersion: DataSetVersion,
               fieldList: List<DataSetField> }
      Per DataSetField: includes the INTERNAL_DESCRIPTION field —
      the F-004 verbatim-storage column.

    Read entrypoint 2: DatasetController.getDataSetStructureLatest
      URL: GET /api/datasets/{data_entity_id}/structure
      Returns: same DataSetStructure shape; same DataSetField
               payload; same INTERNAL_DESCRIPTION field included.

    Read entrypoint 3: DatasetController.getDataSetStructureDiff
      URL: GET /api/datasets/{data_entity_id}/structure/diff?...
      Returns: DataSetVersionDiffList { fieldList:
               List<DataSetVersionDiff> }
      Per DataSetVersionDiff: includes the per-version states
               (Map<versionId, DataSetFieldDiffState>); each
               DataSetFieldDiffState carries the
               INTERNAL_DESCRIPTION field FROM ALL VERSIONS BEING
               DIFFED — multiplying the F-004 read surface by the
               number of versions in the diff.

  NO SANITIZATION IN THE READ PATH:

    ReactiveDatasetVersionRepositoryImpl.java:97-144 +
    DatasetVersionMapper::mapDatasetStructure +
    DatasetVersionServiceImpl.getDatasetVersion all pass
    `internal_description` verbatim from the SQL row to the response.
    No `Jsoup.clean()`, no allowlist, no length cap, no
    XSS-prevention encoding. The UI render path (per the F-004
    master at batches V + U) is the SOLE defence — and the
    no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic
    invariant says that defence is single-point-of-failure at
    Markdown.tsx.

  THE COMPOUND WITH PER-ENTITY-SCOPING BYPASS (cross-link to THIS
  BATCH sibling):

    The DatasetController bypass at getDataSetStructureByVersionId
    + getDataSetStructureDiff means a client can request any
    version of any dataset by guessing version_ids — the
    `data_entity_id` URL parameter is NOT enforced at SQL. Combined
    with the F-004 read-side surface, ANY authenticated user can
    READ the F-004-vulnerable internal_description fields ACROSS
    ALL DATASET VERSIONS in the catalog. The cross-owner exposure
    is broader than the F-004 master invariant suggests at the
    entity level — for column-level descriptions, the read surface
    crosses both ownership AND version boundaries.

  THE COMPOUND WITH READ-COLLABORATIVE POSTURE (cross-link to
  existing master):

    All 4 DatasetController endpoints fall through to global
    authentication-only (no SecurityRule). The cross-owner read
    posture is consistent with the 24+ corroborating sidecars in
    read-collaborative-cross-owner-enumeration. Combined with the
    F-004 read surface, the read-collaborative posture extends to
    the F-004 column-level write surface — any UI user can read
    cross-owner DataSetField descriptions.

  WHY THIS CLOSES THE F-004 CHAIN:

    Prior batches established the F-004 WRITE surfaces. Batch W's
    DatasetController surfaces is the READ-side closure for the
    column-level write surface. The full F-004 chain at the column
    level is now visible:

      WRITE (batch V): DatasetFieldController PUT
                       /api/datasetfields/{id}/description
                       (gated by DATA_ENTITY_FIELD_DESCRIPTION_UPDATE,
                        scoped to the per-field-owner)
                       → DatasetFieldServiceImpl writes verbatim
                       → dataset_field.internal_description text
                         column (PostgreSQL TEXT, no maxLength)

      READ (batch W): DatasetController GET
                      /api/datasets/{id}/structure*
                      (NO SecurityRule; any authenticated user)
                      → DatasetVersionServiceImpl reads verbatim
                      → DataSetField response payload
                      → UI render via Markdown.tsx
                        (no-rehype-sanitize per batch U)

    Every link in the chain is plaintext + verbatim. The defence-
    in-depth opportunity is at the UI render tier (rehype-sanitize).
    Today: no defence at any tier; F-004 payloads round-trip
    successfully from write to render.

  SEVERITY MEDIUM (consistent with the F-004 master severity at
  other surfaces; HIGH if combined with per-entity-scoping bypass +
  cross-owner read enabling a payload to reach any user's
  Markdown.tsx renderer).

