behaviour: |-
  **AppInfoController DOES NOT VALIDATE `authType` AGAINST THE DOCUMENTED ENUM — empty-string + typo branches silently break the UI's auth-mode gate.** `AppInfoController.java:18` declares `@Value("${auth.type}") final String authType` — NO default, NO `@NotBlank`, NO normalisation to the four-value enum (`DISABLED | LOGIN_FORM | OAUTH2 | LDAP`). The controller round-trips whatever Spring resolved — empty string from `AUTH_TYPE=` env-var override, typo `OUATH2` or `LOGINFORM`, even arbitrary strings like `disabled` (case-sensitive lowercase doesn't match `DISABLED`). The downstream consequences cascade:
  - **All four `*SecurityConfiguration` classes use `@ConditionalOnProperty(value="auth.type", havingValue="...")`** (`DisabledAuthSecurityConfiguration.java:10`, `LoginFormSecurityConfiguration.java:31`, `AuthorizationManagerCondition.java:11,15`). A typo/empty value fails ALL FOUR matches — producing a deployment with NO `SecurityWebFilterChain` bean wired. Behaviour of the no-chain deployment is not statically determinable (depends on Spring Boot's autoconfiguration fall-through).
  - **The SPA's `Overview.tsx:26`** uses `appInfo?.authType && appInfo.authType !== 'DISABLED'` to gate the OwnerAssociation card. Empty string makes the first conjunct falsy → card hidden. Typo `OUATH2` makes the second conjunct truthy → card SHOWN in a deployment with no working auth.
  - **`application.yml:34`** sets `auth.type: DISABLED` as the default; this is the ONLY thing preventing the empty-string failure mode in a stock deployment. An operator unsetting the key hits an undocumented silent failure mode.
  **No test catches any of these branches**: no `AppInfoControllerTest` exists; the SPA's Overview.tsx gating logic has no integration test pairing the backend AppInfo contract with the UI consumption.
