    test_demand: functional

- id: H-006
  hypothesis: "When a burst of alerts fires (e.g. a single failed dbt run flags 50+ datasets at once), all of them reach the configured Slack channel."
  derivation: "Pillar primary user action 'receive alerts on failed DQ'; a DQ run producing many alerts is a normal operational event; the user expects all of them."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The dispatcher sends one synchronous Slack POST per alert with no batching, no client-side
      rate-limit, no token bucket. Slack documents incoming webhooks at ~1 msg/sec per webhook and
      returns 429 + Retry-After on excess. AbstractNotificationSender checks only statusCode() !=
      200, so a 429 is an undifferentiated NotificationSenderException; Retry-After is never read
      (no HttpResponse.headers() call anywhere in the send path), there is no retry, and the
      dispatcher logs and moves on. A burst therefore loses most messages to rate-limiting.
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__SlackNotificationSender.md
        section: bugs_limitations_corner_cases[0] + known_performance_gaps[1]
        cite: "SlackNotificationSender.java:43-48 + AbstractNotificationSender.java:24-29"
        note: "429 undifferentiated from 4xx/5xx; Retry-After ignored; no rate-limit, no retry"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: bugs_limitations_corner_cases[2]
        cite: "AlertNotificationMessageProcessor.java:25-36"
        note: "synchronous loop, no batching, 1:1 alert->POST"
    operator_visible_failure: |
      During exactly the incident when alerting matters most (a mass failure producing a burst),
      the operator silently receives only the first ~1/second of alerts on Slack; the rest are
      429-dropped with no operator-visible counter — only repeated ERROR log lines. The operator
      believes alerting is working (some alerts arrive) while most are lost. The live doc (2026-06-01)
      now states the platform "does not honour Slack's rate limit" and treats 429 as generic failure
      — doc-gap closed; code gap remains.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_ref: null
    coverage_note: |-
      CONTRADICTED. Net-new for the notification feature (cross-links REFACTOR-129 'no rate-limiting
      at any layer'). The fix (read Retry-After + a bounded client-side rate-limit, OR coalesce
      bursts) wants a behavioural guard that 429-then-Retry-After is honoured. test_demand: functional.
    test_demand: functional

- id: H-007
  hypothesis: "When one alert row is malformed in a way the translator rejects (e.g. it references a data-entity oddrn that no longer exists), the platform skips that one alert and continues delivering subsequent alerts."
  derivation: "Negative-space + robustness expectation: a single bad record should not take down the whole subsystem; an alerting system that stalls on one row is operationally unusable."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The malformed alert is a POISON MESSAGE that stalls the entire WAL stream cluster-wide
      forever. The translator throws IllegalStateException on a missing/duplicate alerted-entity
      row (AlertNotificationMessageTranslator.java:94-101) and IllegalArgumentException on an
      unknown alert-type code (line 87); both are UNCAUGHT in the dispatcher
      (AlertNotificationMessageProcessor.java:23-24) and propagate to NotificationSubscriber's
      outer catch (NotificationSubscriber.java:90). process() is NOT wrapped in try/catch and the
      LSN advances ONLY after process() returns successfully (NotificationSubscriber.java:77-84),
      so the lock is released, a hardcoded 10s sleep fires, the lock is re-acquired, and the SAME
      un-advanced LSN re-delivers -> the translator throws again -> infinite 10s replay. Every
      alert inserted after the poison row is deferred forever, and Postgres retains all WAL since
      confirmed_flush_lsn on the slot (primary disk grows). The void return on the SPI seam
      (PostgresWALMessageProcessor.java:6) is the structural root: the dispatcher has no channel to
      tell the subscriber "skip this LSN".
    evidence:
      - sidecar: odd-platform__java__notification__class__NotificationSubscriber.md
        section: bugs_limitations_corner_cases[0] + implicit_adrs[3]
        cite: "NotificationSubscriber.java:77-91"
        note: "no try/catch around process(); LSN advances only on success -> replay loop"
      - sidecar: odd-platform__java__notification__processor__class__PostgresWALMessageProcessor.md
        section: bugs_limitations_corner_cases[0]
        cite: "PostgresWALMessageProcessor.java:6 + NotificationSubscriber.java:83-84"
        note: "void return; no failure/skip signal -> unconditional LSN advance is the only shape"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: bugs_limitations_corner_cases[6]
        cite: "AlertNotificationMessageProcessor.java:23-24"
        note: "translate() uncaught; translator throws on unknown type / missing entity"
    operator_visible_failure: |
      A single bad ALERT row (an alert pointing at a hard-deleted entity — which the translator
      comment at line 95 admits can happen "despite the foreign key constraint", or an unknown
      alert-type code) halts ALL alert delivery on ALL channels for the entire cluster, indefinitely,
      with no operator-visible signal beyond log inspection. Meanwhile the platform keeps accepting
      alerts (rows pile up) and Postgres WAL grows on the primary until the disk fills — at which
      point the whole database (not just notifications) is at risk. The only remediations are
      deleting the bad row, or pg_drop_replication_slot (which loses every in-flight undelivered
      alert). There is no DLQ, no skip-poison API, no operator console to advance past the bad LSN.
      This is the load-bearing fragility of the entire F-009 feature.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_ref: null
    coverage_note: |-
      CONTRADICTED — the headline. Tracked as PLT-016 Defect 1; TEST-GAP-455 already names the
      poison pin. The fix (skip-and-advance the LSN on a non-transient processor failure, OR widen
      the SPI seam to a per-message disposition) wants a behavioural regression guard: inject a
      poison row, assert subsequent alerts still deliver and the LSN advanced past the poison.
      test_demand: functional (this is the single highest-value test to write for F-009).
    test_demand: functional

- id: H-008
  hypothesis: "When the notification subscriber thread dies (e.g. an InterruptedException during its retry sleep), the platform detects it and restarts delivery — alerts do not silently stop forever."
  derivation: "Negative-space + reliability expectation: a single-thread leader-elected worker is a single point of failure; an alerting subsystem should self-heal or at least surface its own death."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      NotificationSubscriberStarter submits the subscriber to a single-thread ExecutorService but
      never retains the returned Future and has no exception handler / restart logic
      (NotificationSubscriberStarter.java:33-35). If run() exits — e.g. an InterruptedException
      during the inner sleep or the outer 10s retry sleep re-thrown as
      NotificationSubscriberException (NotificationSubscriber.java:87-89, 95-100) — the sole worker
      dies and the subscriber is gone for the rest of the JVM lifetime. The platform keeps INSERTing
      alert rows, Postgres keeps retaining WAL on the slot, and NO notifications fire. There is no
      log line tracking the dead subscriber. NOTE: IT-012 verifies CRASH failover (a whole pod dies
      and a standby takes the advisory lock) — but that is a DIFFERENT failure mode: it does not
      cover in-process thread death where the JVM lives but the subscriber thread is gone (the
      advisory lock is still held by the live-but-dead-thread JVM, so no standby takes over).
    evidence:
      - sidecar: odd-platform__java__notification__class__NotificationSubscriber.md
        section: bugs_limitations_corner_cases[7]
        cite: "NotificationSubscriber.java:87-100 + NotificationSubscriberStarter.java:33-35"
        note: "run() exits on InterruptedException re-throw; no Future retained; no death detection"
    operator_visible_failure: |
      An operator whose subscriber thread died (transient interrupt, an unexpected throw path)
      experiences total silent alerting loss with no telemetry: no log line, no metric, no
      health-check signal. They discover it only when an alert they expected never arrives —
      potentially long after the incident it was meant to warn about. Combined with H-007's WAL
      retention, a dead subscriber also exhausts the primary disk over time. IT-012's crash-failover
      does NOT save this case: the JVM is alive and still holds the advisory lock, so no standby
      promotes — the lock is held by a process whose worker thread is dead.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_ref: "IT-012 covers CRASH failover only (a DIFFERENT mode); does NOT cover in-process thread death"
    coverage_note: |-
      CONTRADICTED. Net-new bug-candidate (distinct from PLT-016's six defects; TEST-GAP-796 names
      the silent thread-death gap, and PLT-139 references it as an interacting fragility). IT-012
      gives the false impression of coverage — it verifies advisory-lock crash failover, NOT the
      thread-death-without-process-death case where the lock stays held. The fix (retain the Future
      + a supervisor that resubmits on unexpected exit + a liveness metric) wants a behavioural
      guard: kill the subscriber thread (not the JVM), assert it is resubmitted and a liveness
      indicator flips. test_demand: functional.
    test_demand: functional

- id: H-009
  hypothesis: "When the operator follows the docs' Gmail example and sets `protocol: SMTP` (uppercase), STARTTLS and SMTP AUTH engage as configured, so credentials are sent securely."
  derivation: "Doc-claim seed + config endpoint-shape: the `protocol` key promises to select the mail transport; JavaMail's documented convention is uppercase SMTP."
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      NotificationConfiguration.java:63 performs a case-sensitive `.equals("smtp")` (lowercase)
      check; only on that exact lowercase match are `mail.smtp.auth` and `mail.smtp.starttls.enable`
      added to the Properties bag. `protocol: SMTP` (uppercase) falls through to the else branch
      where neither is set — STARTTLS does not engage and SMTP AUTH is not negotiated, regardless of
      how smtp.auth / smtp.starttls are configured. There is no boot warning. (Confirmed per F-009
      batch-X facet 1; the live doc Gmail example historically used uppercase SMTP.)
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__EmailNotificationSender.md
        section: docs_link_semantic.inferred_docs[1].fetched_excerpts
        cite: "NotificationConfiguration.java:63"
        note: "case-sensitive lowercase 'smtp' check; uppercase SMTP disables AUTH+STARTTLS"
    operator_visible_failure: |
      An operator copying a Gmail example with uppercase SMTP gets a connection that either fails
      plaintext or — worse — sends SMTP AUTH credentials in the clear (no STARTTLS) to the relay,
      with no warning at boot and no log line. They discover the misconfiguration only after the
      first failed/insecure delivery. NOTE: the live doc (WebFetched 2026-06-01) has been FIXED — it
      now explicitly warns "The `protocol` value must be lowercase `smtp` — `SMTP` silently disables
      AUTH and STARTTLS". So the doc-vs-code drift is CLOSED; the brittle case-sensitive code remains
      (a one-line `.equalsIgnoreCase` would harden it).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_ref: null
    coverage_note: |-
      CONTRADICTED. Net-new code-hardening (doc side already fixed; not in PLT-016). The fix
      (.equalsIgnoreCase or normalise the protocol value) wants a guard: configure protocol=SMTP
      uppercase, assert mail.smtp.auth + mail.smtp.starttls.enable ARE set. test_demand: functional.
    test_demand: functional

