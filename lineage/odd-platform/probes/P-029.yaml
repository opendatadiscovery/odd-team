expected_outcome: |
  Stress question (Category A — tunables, getPopularTagList page/size):
  what exact HTTP status does GET /api/tags return for degenerate page/size
  inputs?

  Static trace from the code (ReactiveTagRepositoryImpl.java:148 computes the
  SQL OFFSET as `(page - 1) * size`; the LIMIT is `size`; the service
  signature TagServiceImpl.java:73-74 is primitive `int page, int size`):

    - page=0  -> OFFSET = (0-1)*size = -size -> PostgreSQL rejects a negative
      OFFSET (SQL state 22023) -> DataAccessException -> hypothesised HTTP 500.
    - page=-1 -> OFFSET = (-1-1)*size = -2*size -> negative OFFSET -> same.
    - size=0  -> LIMIT 0 -> a VALID query: empty `items`, correct
      `pageInfo.total`. Hypothesised HTTP 200.
    - size=-1 -> LIMIT -1 -> PostgreSQL rejects a negative LIMIT ->
      DataAccessException -> hypothesised HTTP 500.

  The controller (TagController.java:37-42) applies no @Valid / @Min / @Max,
  so none of these is caught before the SQL executes. The HYPOTHESIS to
  confirm: the four cases surface as 500 / 500 / 200 / 500 respectively.
  This probe pins the actual statuses so the methodology records measured
  truth rather than a static guess, and so a future input-validation fix
  (turning the 500s into clean 400s) surfaces as a probe-state change.

  Out of scope: the literal-`null` page/size case (NullPointerException on
  unboxing at the int-param service boundary) is not exercised here — a
  Spring @RequestParam typically supplies the OpenAPI default rather than a
  literal null, so reproducing the NPE requires a non-standard request that
  is better covered by a focused unit test than this integration probe.
