security_aggregate:
  overall: HIGH
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      Child-side gate IS wired correctly (SecurityRule path matches
      OpenAPI surface; permission is DATA_ENTITY-scoped via
      DataEntityPermissionExtractor). DEG-side gate is ABSENT entirely.
      Cross-DEG pollution permitted by design — any DATA_ENTITY_ADD_TO_GROUP
      holder can write into any manually-created DEG.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Owner-scope is the CHILD, not the parent DEG. Domain owners
      cannot defend their DEG from drive-by membership writes.
  weaknesses:
    - HIGH — write-collaborative DEG (no DEG-side authorization)
    - MEDIUM — forensic silence (no @ActivityLog despite enum value exists)
    - MEDIUM — soft-deleted membership produces misleading 400
    - HIGH under DISABLED — anonymous Domain pollution
  strengths:
    - |-
      Defensive predicate isManuallyCreatedDEG prevents accidental
      ingested-DEG corruption — the structural divergence from
      REFACTOR-199/206/223 auto-create-on-miss family
    - |-
      @ReactiveTransactional boundary at the service guarantees
      atomicity across the 4 DB writes
    - |-
      Centralised duplicate detection via onDuplicateKeyIgnore →
      switchIfEmpty → 400 with friendly message (vs DB-level
      USR003 generic)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      4 DB round-trips per call (2× GET + 1× INSERT + 1× markEntityFilled).
      Cost is constant per call; no bulk endpoint at this controller.
  weaknesses:
    - |-
      LOW — no bulk variant; reorganising 50 entities = 100 round-trips
      across the add + delete pair
    - LOW — no @Timed / Micrometer / structured log observability
  strengths:
    - |-
      Reactive non-blocking I/O end-to-end; no thread held during DB awaits
notes: |-
  NEW operation captured in batch 2026-05-19L. Pairs with the symmetric
  unbind-data-entity-from-DEG operation; together they form the
  per-entity DEG-membership CRUD surface.

  Cross-cutting connections:
    - Related entity: data-entity-group-membership-edge (NEW)
    - Related invariants:
      - write-collaborative-deg-no-deg-side-authorization (NEW HIGH)
      - add-delete-permission-asymmetry-on-deg-membership (NEW)
      - silent-204-on-no-op-delete-vs-400-duplicate-on-no-op-add (NEW)
      - deg-is-manually-created-deg-defensive-check (NEW)
    - Cross-references the existing "Bind Owner to Data Entity (with
      optional DEG propagation)" operation — both write to per-entity
      child rows; bind-owner uses DEG propagation as a cascade, this
      uses the DEG-membership table directly
