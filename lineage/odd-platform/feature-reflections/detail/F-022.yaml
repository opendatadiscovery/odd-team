- id: H-004
  hypothesis: |
    When a dataset's tests mostly have NO operator-set severity, the SLA colour
    the operator sees reflects "unclassified" / low-weight tests — i.e. the
    platform does not treat unclassified tests as if they were high-importance.
  derivation: |
    Response-shape + negative-space seed: an operator reading a Red/Yellow/Green
    badge assumes the colour reflects the severities they actually set. The
    default-MAJOR fallback (per `DataQualityController.md` invariant +
    `ReactiveDataQualityRepositoryImpl.java:142-148`) is the structural surface
    this interrogates.
  seed_source: response-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Tests with no row in `DATA_QUALITY_TEST_SEVERITY` default to MAJOR in the
      SLA weight calculation (`ReactiveDataQualityRepositoryImpl.java:142-148`
      cited through the sidecar invariant + bugs_limitations_corner_cases[6]).
      The SLA colour is therefore computed AS IF every unclassified test were
      Major — a dataset with 100 unset tests and 1 critical-failing test is RED;
      the operator's mental model ("most of my tests are minor; one critical
      failed") is wrong, and there is no operator-facing signal distinguishing a
      default-MAJOR contribution from an operator-set MAJOR. As with H-001, the
      DOC has since been corrected: WebFetch 2026-06-01 now states "Tests
      without an operator-set severity contribute to the SLA aggregate as Major.
      The platform's mapper returns MAJOR as the default severity." So the
      hypothesis (the naive operator expectation) is contradicted by the code,
      but the live doc now discloses the rule — the surprise is documented.
    evidence:
      - sidecar: odd-platform__java__DataQualityController__controller-class__DataQualityController.md
        section: concepts.invariants + bugs_limitations_corner_cases[6]
        cite: "ReactiveDataQualityRepositoryImpl.java:142-148 + SLACalculator.java:144-149"
        note: "default-MAJOR fallback in the left-join mapper; unset == Major in the weight calc"
      - sidecar: '(WebFetch live doc — RE-VERIFIED)'
        section: Default severity section
        cite: "https://docs.opendatadiscovery.org/features/data-quality/sla-statuses (2026-06-01 status 200)"
        note: "Doc NOW discloses default-MAJOR (silent at 2026-05-20 baseline)"
    operator_visible_failure: |
      An operator who has classified only their handful of important tests, and
      left the long tail unclassified, sees an SLA colour skewed toward Red/Yellow
      because every unclassified test pulls MAJOR weight. The badge a BI
      dashboard embeds therefore over-states the dataset's risk relative to the
      operator's intent. The doc now warns about this, but the platform exposes
      no `severity_source` discriminator and no UI affordance to see which
      contributions are default vs explicit — so even a doc-aware operator
