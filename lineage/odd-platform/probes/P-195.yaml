realism_caveats: |
  - The bug is storage-mode-independent (the service discards dataEntityId for both
    LOCAL and REMOTE); LOCAL is used here purely because it needs no MinIO container.
  - The same cross-entity shape applies to updateLink / deleteLink / downloadFile /
    completeFileUpload — this probe verifies DELETE file as the representative case;
    a thorough pin would parametrise across all five mutation/read verbs.
  - The probe assumes a working RBAC seed that scopes DATA_ENTITY_ATTACHMENT_MANAGE
    to a single entity. If the local stack cannot express per-entity scoping for this
    permission, set local_execution_blocked and fall back to a service-tier unit test
    asserting AttachmentServiceImpl.deleteFile ignores any entity binding.
  - Read-side sibling (any-authenticated-user-downloads-any-file, H-004) is a
    distinct probe: it needs NO special RBAC — any logged-in low-privilege user
    GET-ing /api/dataentities/{any}/files/{any} should succeed. Emit a follow-up
    probe for the read path if the maintainer wants both pinned.
