    or "is housekeeping keeping up with the soft-delete rate?", the platform
    exposes an observable surface (metric, log, or report).
  derivation: >-
    A retention subsystem that permanently deletes data is expected, by any
    operator of a system of this class, to expose what it deleted (an implicit
    operational + compliance requirement).
