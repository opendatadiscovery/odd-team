# OAuth Logout Token-Revocation Semantics — product-owner reflection

## product_owner_narrative

OAuth Logout Token-Revocation Semantics is not a feature an operator switches on — it is the **observable behaviour of the single "Logout" affordance** that every OAuth2-mode deployment of ODD Platform ships in its top toolbar. When a signed-in user clicks Logout, the SPA performs one action: a full-page browser navigation to the backend `/logout` URL (`AppToolbar.tsx:35-37` — `window.location.href = '/logout'`, per the AppToolbar sidecar). Everything that happens next is decided entirely on the backend by a chain of five provider-specific handlers, and the central, undocumented-until-recently truth of this feature is that **the five providers do five materially different things, and the user cannot tell which one they got** (per the AppToolbar sidecar `security.known_security_gaps[3]` + the Azure/Cognito sidecars). The audience is every `platform-operator` and `odd-platform-ui-end-user` on an OAUTH2 deployment, and the people most exposed are those on shared or public workstations who trust "Logout" to mean "my session is dead everywhere."

A user interacts with the feature through exactly one button. They provide no input; they observe a redirect that lands them back at a login page. There is no per-provider UI, no confirmation prompt (`AppToolbar.tsx:117`, AppToolbar sidecar `bugs[2]`), and no message telling them whether their IdP tokens were revoked. The backend dispatch is a chain-of-responsibility: `OAuthLogoutSuccessHandler` reads the active token's provider and routes to the matching `*LogoutSuccessHandler.shouldHandle(provider)` (`OAuthLogoutSuccessHandler.java:36-48`, per the Azure sidecar), falling back to Spring's `OidcClientInitiatedServerLogoutSuccessHandler` for any provider without a dedicated handler (`OAuthSecurityConfiguration.java:180-183`).

The working parts, described as a product owner would demo them: for **Google**, Logout actively revokes the access token by POSTing to `oauth2.googleapis.com/revoke` (`GoogleLogoutSuccessHandler.java:43-54`, sibling-cited in the Azure sidecar `implicit_adrs[0]`); for **GitHub**, it revokes the whole grant via `DELETE /applications/{client_id}/grant` (`GithubLogoutSuccessHandler.java:51-63`). For **Cognito**, it redirects to Cognito's `/logout` endpoint and invalidates the local Spring `WebSession`, but it does **not** call Cognito's documented `/oauth2/revoke` endpoint — so the access token (≈1h TTL) and refresh token (up to 90 days) stay valid at AWS (`CognitoLogoutSuccessHandler.java:33-50`, Cognito sidecar `bugs[3]`). For **Azure**, it redirects to the end-session endpoint and invalidates the local session, with no revocation call — and here the platform's hands are partly tied: Azure AD v2.0 does not expose an RFC-7009 revocation endpoint at all (`AzureLogoutSuccessHandler.java:31-48`, Azure sidecar `implicit_adrs[0]`). For **ODD_IAM** and for any **Okta / Keycloak / Custom-OIDC** provider with no dedicated handler, only the local session is invalidated (`OAuthSecurityConfiguration.java:180-183`, OAuthSecurityConfiguration sidecar `security.known_security_gaps[5]`).

This feature does not feed other features so much as it **terminates the session lifecycle** that the cross-pillar P-09 mission opens: `system-mission.md` P-09 frames authentication as "three independently-configured authentication surfaces … Enabling one does not protect the other," and logout is the dual of authentication — every auth mode that mints a session needs a teardown path. F-011 (Principal-to-Owner Resolution) is the login-side chokepoint; F-086 is the logout-side surface; F-089 (Post-Logout Redirect Provenance) is the redirect half of the same flow. The Cognito sidecar's `back_links` makes the bookend relationship explicit.

The edge cases a product owner would flag in a demo are exactly where this feature hurts. A Cognito deployment that omits the optional-looking `logout-uri` makes the Logout button a **silent no-op** — the handler returns `Mono.empty()` before it ever reaches session invalidation, so the user clicks Logout and stays logged into ODD itself, with no error (`CognitoLogoutSuccessHandler.java:33-35`, Cognito sidecar `bugs[0]`). An Azure deployment that omits the same parameter does the opposite extreme — an unguarded `URI.create(null)` NPE returns HTTP 500 and nobody can log out at all (`AzureLogoutSuccessHandler.java:39`, Azure sidecar `bugs[0]`). And under `auth.type=DISABLED`, the Logout button points at an endpoint with no handler wired at all (`DisabledAuthSecurityConfiguration` has no `.logout(...)`, AppToolbar sidecar `bugs[3]`). Across all six production classes there is **zero test coverage** — `find … -name '*Logout*.java'` in the test tree returns nothing (verified live this run; F-086 `zero_logout_test_coverage` facet).

## hypotheses

- id: H-001
  hypothesis: |-
    When a Google-authenticated or GitHub-authenticated user clicks Logout, the
    OAuth2 token the IdP issued is actively revoked at the IdP (not merely the
    local ODD session ended), so a previously-copied token stops working against
    Google/GitHub-protected resources promptly after logout.
  derivation: |-
    Endpoint/handler shape: GoogleLogoutSuccessHandler POSTs to a /revoke endpoint;
    GithubLogoutSuccessHandler DELETEs the grant. The pillar mission ("logout is the
    dual of authentication") implies a real teardown.
  seed_source: pillar + response-shape
