proposed_action: |-
  Unit test. (a) provider.organizationName='secret-org' + adminPrincipals=['outsider'] + OAuth2User.login='outsider'. (b) Invoke enrichUserWithProviderInformation. (c) Mock WebClient — assert NO `/user/orgs` HTTP call was made (the fast-path skipped it). (d) Assert resulting authorities = {ADMIN}. (e) Pin the bypass. (f) Negative: provider.organizationName='secret-org' + adminPrincipals=[] + OAuth2User.login='outsider' → /user/orgs is called → if user not in org, REJECT. Pin the contrast.
