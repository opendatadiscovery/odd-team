proposed_action: |-
  Add `DatasetVersionLatestSemanticPinTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `getDataSetStructureLatest_higherVersionWithOlderCreatedAt_returnsByVersion_pinsMaxVersionSemantics` — seed dataset D with version=5 (created_at=yesterday) AND version=4 (created_at=today); GET `/api/datasets/D/structure`; assert response.version=5 (NOT 4). PIN the max-version-over-max-created-at contract.
  2. `getDataSetStructureLatest_normalMonotonicIngestion_returnsMostRecentlyIngested_baselineNonRegression` — seed dataset D with versions 1, 2, 3 ingested in temporal order; GET; assert response.version=3 (matches both max-version AND max-created-at because of monotonicity). Baseline so test 1 is unambiguous.
  3. `getDataSetStructureLatest_emptyDataset_returnsNotFound_pinsAbsenceContract` — seed a dataset D with NO dataset_version rows; GET; assert HTTP 404. Locates the not-found path.

  Pair with DOC-NNN: define "Latest" on the live schema-diff doc page with explicit language ("highest version number, which under normal ingestion matches most-recently-ingested"). Pair with REFACTOR-NNN if the operator-mental-model alignment is prioritised.
