name: |-
  Cross-controller permission split — QueryExample owns _CREATE/_UPDATE/_DELETE, DataEntity owns _DATASET_*, Term owns _TERM_* link permissions (pattern invariant from batch V)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-02
  - P-06
  - P-09
description: |-
  NEW PATTERN INVARIANT, batch 2026-05-20V — surfaces a structural pattern
  visible only by cross-reading the QueryExampleController + DataEntityController
  + TermController SecurityRules layout. The 7-permission Query Examples grid
  (per the live docs at /features/data-modelling/query-examples) is INTENTIONALLY
  SPLIT across THREE controllers, mirroring the resource the permission scopes.

  THE SPLIT — file:line citations from the QueryExampleController batch V
  sidecar and corroborating evidence from existing TermController sidecar:

    Cluster 1 — Query Example itself (CRUD):
      QUERY_EXAMPLE_CREATE — gated at QueryExampleController.createQueryExamples
        via SecurityConstants.java:112-113 (NO_CONTEXT resolver since the
        example doesn't yet exist)
      QUERY_EXAMPLE_UPDATE — gated at QueryExampleController.updateQueryExample
        via SecurityConstants.java:312-314 (QUERY_EXAMPLE resource extractor;
        resolves the per-example policy context via QueryExamplePermissionExtractor)
      QUERY_EXAMPLE_DELETE — gated at QueryExampleController.deleteQueryExample
        via SecurityConstants.java:315-317 (QUERY_EXAMPLE resource extractor)

    Cluster 2 — Query Example to Dataset linkage:
      QUERY_EXAMPLE_DATASET_CREATE — gated at DataEntityController.createQueryExampleToDatasetRelationshipNew
        via SecurityConstants.java:318-321 (DATA_ENTITY resource extractor)
      QUERY_EXAMPLE_DATASET_DELETE — gated at DataEntityController.deleteQueryExampleToDatasetRelationshipNew
        via SecurityConstants.java:322-324 (DATA_ENTITY resource extractor)

    Cluster 3 — Query Example to Term linkage:
      QUERY_EXAMPLE_TERM_CREATE — gated at TermController.createQueryExampleToTermRelationship
        via SecurityConstants.java:187-189 (TERM resource extractor)
      QUERY_EXAMPLE_TERM_DELETE — gated at TermController.deleteQueryExampleToTermRelationship
        via SecurityConstants.java:190-192 (TERM resource extractor)

  THE LOAD-BEARING DESIGN OBSERVATIONS:

    Resolver-coupling drives the split:
      - QUERY_EXAMPLE_* permissions use QUERY_EXAMPLE resolver — keyed on
        example_id; the resource is the example itself.
      - QUERY_EXAMPLE_DATASET_* permissions use DATA_ENTITY resolver —
        keyed on data_entity_id; the resource is the dataset, not the
        example. Granting QUERY_EXAMPLE_DATASET_CREATE on a Policy applies
        to a SPECIFIC dataset (the one being linked), not to all datasets.
      - QUERY_EXAMPLE_TERM_* permissions use TERM resolver — keyed on
        term_id; granting QUERY_EXAMPLE_TERM_CREATE applies to the SPECIFIC
        term being linked.

    Operator-side consequence:
      Policies can scope linkage permissions FINELY: 'allow user U to
      attach query examples to datasets owned by team A but not team B'
      via Policy with QUERY_EXAMPLE_DATASET_CREATE on datasets owned by A.
      The split makes this kind of fine-scope possible.

    Doc-side framing:
      The live docs at /features/data-modelling/query-examples present
      the 7 permissions as a flat grid. The split is INVISIBLE in the doc
      — an operator reading the page sees 7 permissions and assumes they're
      enforced uniformly. The actual enforcement runs through 3 different
      controllers + 3 different resource extractors + 3 different
      DTOs at the SecurityConstants level.

  THE GENERALISED PATTERN — observed in 3 sub-graphs:

    Sub-graph 1 — Query Examples (batch V — primary observation):
      QueryExampleController owns CREATE/UPDATE/DELETE on the example itself
      DataEntityController owns DATASET_CREATE/DELETE on the (example,dataset) link
      TermController owns TERM_CREATE/DELETE on the (example,term) link

    Sub-graph 2 — Terms (batch K + batch U):
      TermController owns TERM_CREATE/UPDATE/DELETE on the term itself
      DataEntityController owns DATA_ENTITY_ADD_TERM/_REMOVE_TERM on the
        (term,entity) link
      DatasetFieldController owns DATASET_FIELD_ADD_TERM/_REMOVE_TERM on
        the (term,field) link
        — and Failure 4 from the SecurityConstants 5-failure invariant is
        the WRONG permission wired at this surface

    Sub-graph 3 — Attachments (batch V — DataEntityAttachmentController):
      DataEntityAttachmentController owns DATA_ENTITY_ATTACHMENT_MANAGE
        on attachments scoped to the parent DataEntity. There is no separate
        Attachment-CRUD controller; attachments are inherently child entities
        of DataEntity. The pattern here is COLLAPSED rather than SPLIT —
        attachment owns no top-level resource because it doesn't exist
        independently of its parent.

  THE LSN-018 RULE-6 OBSERVATION:

    Operator-facing docs MUST disclose the split. The current doc surface
    (single flat grid of permissions per feature) hides where each permission
    is enforced; a Policy author cannot determine the resource scope from
    docs alone. Two doc-NNN candidates flow:
      (a) Each feature's permission grid should show the resolver
          (QUERY_EXAMPLE / DATA_ENTITY / TERM) alongside the permission
          name — operators authoring Policies need this to scope correctly.
      (b) The SecurityConstants wiring failure modes (the 5-failure invariant)
          become more discoverable when paired with the cross-controller
          split observation — wrong-resolver wiring would be visible at
          docs-vs-code review.

  SEVERITY: LOW (the split itself is sound design; the finding is the doc-side
  invisibility + the operator-facing risk that fine-scope Policy authoring is
  not enabled by the current documentation). This invariant promotes the
  observation to a first-class catalog entry for cross-pillar discoverability.
