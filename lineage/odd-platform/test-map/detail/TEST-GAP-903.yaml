behaviour: |-
  **HIGH — `PUT /api/datasources/{data_source_id}` for a never-existed OR soft-deleted id
  MUST return a clean HTTP 404, NEVER a silent HTTP 200. This anti-silent-write guard is
  entirely untested — and the codebase contains a documented counter-example
  (`DataEntityServiceImpl.upsertDescription`) that deliberately silent-200s on a missing
  id, so a routine refactor copying that pattern would silently flip this endpoint.**
  Method-level primary source from the batch-ZB `updateDataSource` controller-method
  sidecar:

  - `DataSourceServiceImpl.update` (DataSourceServiceImpl.java:68-83) loads the existing
    row via `dataSourceRepository.getDto(id)` and applies an explicit
    `.switchIfEmpty(Mono.error(new NotFoundException("Data source", id)))`
    (DataSourceServiceImpl.java:71-72) — the deliberate anti-silent-write guard. `getDto`
    filters `deleted_at IS NULL` (per the `ReactiveDataSourceRepositoryImpl` sidecar), so
    a soft-deleted id resolves to empty → the same 404.
  - `ControllerAdvice` maps `NotFoundException` → HTTP 404. The endpoint NEVER creates a
    row — it is strictly an UPDATE-of-existing operation (sidecar `concepts.invariants`).
  - **The regression surface** (sidecar `gaps`): the same `getDto(...).switchIfEmpty(...)`
    shape is the guard `DataEntityServiceImpl.createMetadata` uses — and it is the guard
    `DataEntityServiceImpl.upsertDescription` deliberately OMITS (the F-004 silent-200
    finding). A regression that added a `switchIfEmpty(Mono.just(...))` fail-soft to
    `update` — mirroring `DataEntityServiceImpl.incrementViewCount` — would convert the
    clean 404 into a silent no-op with HTTP 200. Nothing tests the guard.

  **Why HIGH**: a silent-200-on-missing is the operator-cliff shape — an operator (or a
  script) PUTting against a stale data-source id believes the edit landed (200 OK) when in
  fact no row was touched. The endpoint has ZERO direct test coverage (Glob-verified — no
  `DataSourceControllerTest`, no `DataSourceServiceImplTest`). The guard is one
  `switchIfEmpty(Mono.error(...))` line; the catalog-wide silent-UPDATE-on-missing pattern
  the `DataEntityServiceImpl` sidecar tracks proves the codebase has BOTH the guarded and
  the unguarded shape — exactly the condition under which an unguarded refactor lands
  unnoticed.

  **Test gap shape**: a `@SpringBootTest` / `WebTestClient` integration test that: (1)
  PUTs `/api/datasources/999999999` (a never-existed id) with a valid body → asserts HTTP
  404 (NotFoundException), NOT 200; (2) registers a data source, soft-deletes it via
  `DELETE /api/datasources/{id}`, then PUTs the same id → asserts HTTP 404 (the `getDto`
  `deleted_at IS NULL` filter excludes the soft-deleted row); (3) asserts NO `data_source`
  row was mutated in either case (the WHERE-clause matched nothing). Pinned by probe P-042.
test_class: missing-integration
criticality_rationale: |-
  HIGH per Rule 3: the updateDataSource sidecar rates both the never-existed-id and the
  soft-deleted-id uncovered behaviours HIGH and flags the 404-on-missing contract (P-042)
  as a highest-leverage gap. The silent-200-on-missing is the operator-cliff shape
  (LSN-001 / LSN-002 family — a routine action reports success while doing nothing). The
  codebase demonstrably contains the unguarded counter-pattern (DataEntityServiceImpl.
  upsertDescription, F-004), so the regression is realistic, not hypothetical. Not CRITICAL
  — no security boundary is crossed and the guard IS present today; the gap is the absence
  of a regression net. pillars_affected len 1 (P-08) — no cross-pillar bump.
