control_summary: |-
  0 of 4 cells COVERED. Feature emerges from batch-M primary-source audit
  of getMyObjectsWithUpstream + getMyObjectsWithDownstream sidecars + the
  symmetric chain to DataEntityRelationsServiceImpl orchestrator + the
  AuthIdentityProviderImpl resolver + the ReactiveLineageRepositoryImpl
  CTE generator + the ReactiveDataEntityRepositoryImpl scan + the
  OwnerEntitiesList UI realisation. Ten substantive drift facets cluster
  around three load-bearing themes: (1) REFACTOR-225
  anchor-set-single-point-of-failure — owner-scoping enforced at exactly
  one site with no JOIN-side defence-in-depth; latent regression vector;
  HIGH severity; (2) DOC-GAP-099 OpenAPI-summary inversion — "owned by
  current user" is inverse of the actual "non-owned-but-reachable"
  semantic; 4-angle triangulated PRIMARY-SOURCE; HIGH severity; (3)
  performance + correctness gaps — unbounded anchor fan-out, in-memory
  dedup defeating SQL pagination, missing ORDER BY producing unstable
  pagination, silent hollow+soft-delete exclusion; MEDIUM severity each.
  The highest-leverage probe candidates are: (a) REFACTOR-225 regression
  vector — local docker-compose with ODD platform + Postgres + two
  seeded Owners + lineage edges between their owned entities + invoke
  /my/upstream as user A while AuthIdentityProvider is patched to return
  user B's owner-id + assert response leaks user B's upstream
  neighbourhood (pins the architecture's defence-in-depth gap); (b)
  OpenAPI-summary inversion — POST /api/search + populate sample
  catalog + invoke GET /api/dataentities/my/upstream as a user with N
  owned entities + M upstream-LINEAGE-edges + assert response is
  precisely the M distinct non-owned upstream-adjacent entities (NOT
  the user's owned entities); (c) admin-owner DoS — seed CI-bot owner
  with 10k owned entities + invoke /my/upstream + size=5 + measure
  response time vs typical-owner baseline. Local probe stack:
  docker-compose with ODD platform + PostgreSQL + 2 seeded owners +
  cross-owner lineage edges + Playwright for end-to-end UI mounting
  via Recommended panel.
