behaviour: |-
  **`TitleServiceImpl.getOrCreate` is a read-then-insert race that
  produces a transient HTTP 400 USR003 on concurrent owner-grants
  naming the SAME brand-new title.** Two parallel `OwnershipServiceImpl.create`
  calls naming the same unseen title both call
  `titleRepository.getByName(name)` (returns empty), then both call
  `titleRepository.create(new TitlePojo().setName(name))`. The DB
  constraint `TITLE_NAME_UNIQUE` (per ExceptionUtils.java:22-23) rejects
  one; the losing side surfaces as `UniqueConstraintException("Title
  with this name already exists")` per ExceptionUtils.java:72-74 →
  ControllerAdvice → HTTP 400 USR003. The
  `OwnershipServiceImpl.@ReactiveTransactional` boundary rolls back the
  entire ownership-grant on the losing side.

  No test currently exercises the concurrent path; the existing
  OwnershipServiceImplTest covers single-threaded flow. The race
  surfaces in production as a transient 400 that operators see as
  "create owner failed — try again" with no documentation. Pairs with
  TEST-GAP-571 (sibling Tag-shaped race), TEST-GAP-540 (TOCTOU on
  TagServiceImpl.getOrCreateTagsByName), TEST-GAP-575
  (UniqueConstraintException mapping), TEST-GAP-859 (TagServiceImpl
  sibling read-then-insert) — this is the Title-specific instance of
  the read-then-insert race-condition class.

  Mitigation candidates: (a) ON CONFLICT DO NOTHING semantics at the
  SQL layer with a re-fetch on conflict; (b) DB-level UPSERT
  (insertOnConflictDoUpdate); (c) idempotent retry at the
  OwnershipServiceImpl layer that catches USR003 and re-runs the
  ownership-grant after re-fetching the now-existing title.
