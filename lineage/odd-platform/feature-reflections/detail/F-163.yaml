- id: H-004
  hypothesis: |-
    When the operator clicks Regenerate and confirms, the confirmation step tells
    them — before they commit — that rotation immediately invalidates the current
    token and that any running collector still using it will stop ingesting until
    it is reconfigured and redeployed.
  derivation: |-
    A destructive irreversible production action should disclose its consequence
    at the point of decision; the ConfirmationDialog is that point. The pillar's
    "rotate collector tokens" action implies the operator understands what
    rotation costs.
  seed_source: negative-space + ui-label + pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The ConfirmationDialog body is verbatim minimal on BOTH surfaces:
      title "Are you sure you want to regenerate token for this {datasource|
      collector}?" + body "Regenerate token for \"{name}\"?" (DataSourceItemToken.tsx:
      37-49 + CollectorItemToken.tsx:37-49 per the feature-flow chain). It names
      only the entity; it says NOTHING about (a) the old token dying instantly
      (no grace window), (b) the running collector 401-ing on the next ingestion
      call, or (c) the need to redeploy the collector with the new token. The
      backend confirms the consequence is real and immediate: regeneration is a
      destructive in-place UPDATE with no old/new overlap, and
      IngestionDataEntitiesFilter rejects the old token the moment the UPDATE
      commits (regenerateDataSourceToken backend sidecar
      bugs_limitations_corner_cases[1], severity HIGH).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken.md
        section: bugs_limitations_corner_cases[0] + name_behavior_pairs (Regenerate)
        cite: "DataSourceItemToken.tsx:37-49 (dialog body) — DRIFT_NAME_VS_BEHAVIOR"
        note: "Dialog mitigates an accidental click but does NOT inform an intentional one."
      - sidecar: odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken.md
        section: bugs_limitations_corner_cases[1] + downstream_side_effects (external-call)
        cite: "ReactiveTokenRepositoryImpl.java:30-39 + IngestionDataEntitiesFilter.java:56-57"
        note: "In-place UPDATE, no grace window; old token 401s immediately."
    operator_visible_failure: |-
      Obvious failure: an operator rotates a token believing it is a benign
      additive "get a new one" action (the label "Regenerate" reads as safe), and
      the running collector stops ingesting within seconds with a 401; paging
      fires; the operator does not connect the outage to the rotation they just
      did because the dialog never warned them. Subtle failure: an operator
      rotating to mitigate a SUSPECTED leak on a DEFAULT deployment
      (auth.ingestion.filter.enabled=false) takes the ingestion outage for ZERO
      security benefit on the bulk path — the filter that validates the token is
      off by default, so rotation fixes only half the surface (per DOC-252
      Caveat 3) while still breaking the pipeline. Compounding: the rotation is
      not audit-logged, so post-incident "who rotated this and when" is
      unanswerable.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    When the operator is shown the one-time plaintext token, the system protects
    that copy long enough to use it — it does not silently discard the only copy
    of the credential if the operator's attention lapses or a background refresh
    fires.
  derivation: |-
    A "you can never see this again" secret demands that the reveal persist until
    the operator acknowledges/copies it; otherwise the warning is a trap.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The warning banner and the plaintext value are gated entirely on the
      transient isHidden=false state, which is recomputed from token.value on
      every render. ANY list refetch (post-mount fetch, search clear, delete
      completion, background refetch) overwrites the redux store with masked
      tokens (TokenMapper '******'+last6), the useEffect re-fires, isHidden flips
      to true, the Copy button and the warning banner both disappear, and the
      plaintext is gone from the UI (DataSourceItem.tsx:110-121 +
      DataSourceItemToken.tsx:25-27 + datasources.slice.ts:41-42). There is no
      local persistence, no "I have saved it" acknowledgement, no auto-copy, no
      focus-the-Copy-button, no navigation block. To recover the operator must
      Regenerate AGAIN — another destructive rotation (the H-004 footgun).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken.md
        section: bugs_limitations_corner_cases[2]
        cite: "DataSourceItemToken.tsx:25-27,51-53 + DataSourceItem.tsx:110-121 + datasources.slice.ts:41-42"
        note: "One-time reveal with no copy prompt; re-masks on refetch, plaintext unrecoverable."
    operator_visible_failure: |-
      An operator who registers a data source, gets distracted (a Slack ping, a
      tab switch, a colleague's question), and comes back after a background
      refetch finds the token masked and the warning gone. They now hold a data
      source whose token they never copied, and the ONLY recovery is a
      destructive Regenerate — which, per H-004, breaks any collector already
      wired to a prior value and is unaudited. The "you will not be able to
      retrieve it again" warning is literally true and actively hostile: it warns
      of a trap the UI does nothing to prevent the operator falling into.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

