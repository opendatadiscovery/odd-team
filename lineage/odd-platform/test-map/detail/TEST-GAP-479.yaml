behaviour: |-
  Description-mention guard on rename/delete — the load-bearing invariant. A term cannot be renamed or deleted while any active (non-soft-deleted parent) description mentions it via `[[ns:term]]`. The guard at TermServiceImpl.java:125-134 (update) and 156-160 (delete) raises `BadUserRequestException("Can't update/delete term, which was mentioned in description")` — a 400 surface. The `nameOrNamespaceHasChanged` helper (TermServiceImpl.java:331-335) returns TRUE when BOTH name AND namespace are UNCHANGED — semantically inverted from its name; correctly used at line 125 (`if returnTrue → unchanged → skip the description-relation guard`). A future refactor reading the call site by the method name and 'fixing' the if-branch direction would invert the logic and silently allow rename-while-referenced — breaking `[[ns:term]]` resolution across every description in the catalog. NO test pins the guard, NO test pins the misnamed-helper semantics.
