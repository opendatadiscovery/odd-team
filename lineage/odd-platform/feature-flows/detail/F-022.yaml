cross_pillar_relationships:
- pillar: P-07
  kind: feeds
  via: |-
    DQ test failures flow into Alerting (F-007 AlertManager Integration)
    via AlertActionResolver — failed DQ test runs emit FAILED_DQ_TEST
    alerts (per AlertServiceImpl batch-I primary-source +
    AlertActionResolver concept). This feature is the READ surface that
    SURFACES the per-dataset DQ signal; the alert pillar is the EVENT
    surface that REACTS to it. Cross-link to F-007 for the
    `FAILED_DQ_TEST` alert type origin.
- pillar: P-07
  kind: feeds
  via: |-
    Severity mutation (PUT /api/datasets/{id}/dataqatests/{tid}/severity)
    produces NO Activity Feed row (F-021 Audit-Trail Surface) — verified
    via `ReactiveDataQualityRepositoryImpl.java:87-102` upsert + grep
    `DataQualityServiceImpl.java:62-81` (no @ActivityLog, no
    activityService.createActivityEvent). Per F-021's schema-rooted
    activity scope (V0_0_48 NOT NULL FK to data_entity), severity changes
    on TESTS could theoretically attach to the parent dataset's
    data_entity_id — but the platform does NOT emit. Adds a SIXTH-sidecar
    corroboration to F-006's audit-silence-on-RBAC-mutations pattern,
    extended to per-dataset DQ-severity mutations.
- pillar: P-10
  kind: feeds_from
  via: |-
    DQ test results are pushed via P-10 Integrations (`POST
    /ingestion/entities/datasets/stats` plus DataEntityList items with
    DataQualityTest entity-class). This feature is the read counterpart
    of that ingestion path. The `aggregator-only` pillar invariant
    ('Quality checks are not performed inside ODD Platform' —
    `documentation/docs/data-quality.md:9`) is enforced by the absence
    of any test-execution endpoint on DataQualityController.
- pillar: P-09
  kind: shares_data_with
  via: |-
    The lone write endpoint `setDataQATestSeverity` is owner-scoped via
    DATA_ENTITY AuthorizationManagerType + DATASET_TEST_RUN_SET_SEVERITY
    permission (SecurityConstants.java:243-246) — the only registered
    SecurityRule for this controller. The four READS are unscoped,
    matching the read-collaborative posture (REFACTOR-024 family
    extension to P-04).
- pillar: P-01
  kind: shares_data_with
  via: |-
    Per-entity test reports surface on the data-entity detail page's
    `Test reports` tab — adjacent to the entity's main metadata
    (description, ownership, lineage). The DQ read default mirrors the
    rest of P-01's per-entity reads (cross-owner / read-collaborative).
