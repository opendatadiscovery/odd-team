name: |-
  Alerts page root (three-tab shell with shared Redux slot)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
description: |-
  NEW ENTITY, batch ZL (2026-05-26) — the canonical UI page-root
  for the Alerts feature (P-07 Alerting pillar). Alerts.tsx
  (`components/Alerts/Alerts.tsx`, 33 lines) is mounted at
  `App.tsx:64` via `<Route path={alertsPath()}/* element={<Alerts/>}/>`
  (lazy import at App.tsx:36). It is the SINGLE user-observable
  surface for the global Alerts feed — every operator interaction
  with the Alerts feature (browsing, filtering by tab, resolving)
  begins here.

  **STRUCTURE**:
    - H1 title `t('Alerts')` (Alerts.tsx:22) — page heading
    - <AlertsTabs/> (Alerts.tsx:23) — three-tab vertical primary
      nav: All / My Objects / Dependents. Last two HIDDEN when
      the user has no owner association.
    - <AlertsRoutes/> (Alerts.tsx:26) — nested <Routes> mapping
      /all → AlertsList(fetchAllAlertList);
      /my → AlertsList(fetchMyAlertList);
      /dependents → AlertsList(fetchMyDependentsAlertList);
      index → <Navigate to='all' replace />

  **PROVENANCE**:
    The entity is the canonical anchor for the pillar's UI; the
    backend operation `operation:list-alerts-three-visibility-scopes`
    is the data-fetch side. This entity entry is the operator-
    visible side.

  **STATE COUPLING**:
    All three tabs SHARE `state.alerts.items` via the slice's
    `updateAlerts` reducer (alerts.slice.ts:42-49 — three
    addCase entries for three thunk types). Tab navigation
    explicitly clears the slot via `changeAlertsFilterAction`
    before fetching the new tab's first page.

  **BOOTSTRAP**:
    A single useEffect with empty deps (Alerts.tsx:15-17)
    dispatches fetchAlertsTotals once on mount, populating the
    three tab badges. The badges NEVER refresh after this fetch
    (see `invariant:alerts-tab-badge-totals-stale-mount-fetch-only`).

  **CROSS-FEATURE RELATIONSHIPS**:
    - feeds: [] — this is an end-user surface, not an upstream
    - feeds_from: [P-09]   — Authorization framework (DATA_ENTITY_ALERT_RESOLVE
      permission gates the per-row Resolve button at click time)
    - shares_data_with: [P-07] — the pillar's data is alert.* tables
    - couples_to: [P-08]   — SearchFacetsHousekeepingJob TTL eviction
      does NOT apply (alerts have their own retention model)

  **AUDIENCES**:
    - data-platform-operator (browses alerts as the primary
      audit surface)
    - data-platform-administrator (alerts triage)
    - data-owner (My Objects + Dependents tabs — owner-scoped)
    - data-governance-reviewer (alerts are the audit trail of
      backend events)

  **KNOWN ISSUES** (cross-link):
    1. `invariant:alerts-all-tab-name-vs-implementation-drift-open-only`
       — Category B drift, HIGH severity (docs promise
       open+resolved; SQL filters OPEN only)
    2. `invariant:alerts-resolve-button-rendered-before-permission-check-ux-leak`
       — MEDIUM severity UX/security (button visible to users
       who cannot resolve; permission probe fires only after
       click)
    3. `invariant:alerts-tab-badge-totals-stale-mount-fetch-only`
       — MEDIUM severity UX (badges fetched once, never refreshed
       after Resolve actions)
    4. `invariant:second-securityconstants-bug-alerts-status-wrong-permission`
       — HIGH severity backend bug (PUT /api/alerts/{id}/status
       gated by DATASET_FIELD_ADD_TERM, not DATA_ENTITY_ALERT_RESOLVE)

    Four known issues at one feature surface = a Quality Bar
    hot spot. Worth a maintainer audit of the entire /alerts
    subtree.

