notes: |-
  Cross-references:

    - `no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f`
      invariant — the role-stripping leaves NO audit trail. An operator
      cannot reconstruct "Owner X had roles [A, B] before, now has []"
      after the fact.

    - `update-owner-with-role-rebind` operation (new in batch P) — the
      operation that hosts this bug.

    - **NEW batch Q** —
      `destructive-empty-roles-update-reachable-from-ui-three-clicks-no-confirmation`
      invariant — the sibling UI-tier elevation; documents the
      operator-facing trigger surface as a distinct invariant.

    - **NEW batch Q** — `hard-delete-on-relationship-edges-confirmed-cross-batch`
      invariant — the owner_to_role row hard-deletion semantic that
      makes the destruction irreversible.

  Doc-side recommended action: extend the live owners page and the
  permissions page with an explicit warning: "API consumers calling
  PUT /api/owners/{owner_id}: the `roles` field is treated as a
  REPLACE-SET. Omitting `roles` or sending `roles: []` STRIPS ALL
  role bindings from the Owner. Always send the complete current
  `roles` list. The UI's Edit-Owner dialog allows removing all role
  TagItems via the X icon — Save with an empty roles array triggers
  the same destructive behaviour. No confirmation modal warns the
  operator." Equivalent severity to LSN-001 (the attachment-storage
  default that wiped production data on restart) — same shape: a
  reasonable expectation produces destructive behaviour silently.

  Backlog action proposed: file DOC-NNN follow-up + log upstream
  GitHub issue for the OpenAPI contract: mark `roles` as required,
  OR introduce a PATCH endpoint for partial updates. **PLUS NEW batch
  Q** — file UI-side follow-up to add a confirmation modal in the
  OwnerForm when `roles.length === 0 && previousRoles.length > 0`.
