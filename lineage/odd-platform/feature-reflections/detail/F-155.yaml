      cross-team surface, this is a high-reach stored-XSS vector. The live data-modelling doc page is
      silent on Markdown rendering of the query body, so operators do not know to sanitise snippets before
      pasting. Mitigation is shared with the rest of the F-004 family (apply rehype-sanitize in
