security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      The route is mounted bare at App.tsx:73 with NO `WithPermissionsProvider`
      wrapper — contrast the sibling `/lookup-tables` route at App.tsx:75-88
      which IS wrapped and gates on LOOKUP_TABLE_* permissions. The 'Data Quality'
      top-bar tab (ToolbarTabs.tsx:45-49) is rendered unconditionally with no
      permission check. The mount operation imposes no gate; whoever can reach
      the SPA shell renders the page.
  owner_scoping:
    verdict: N/A
    detail: |-
      Layout-only operation; no data fetched at this tier. The dashboard data
      fetch (and any owner-scoping decision) lives in the child
      DataQualityContent's `useGetDataQualityDashboard` call.
  strengths:
    - |-
      Idempotent mount — re-entering /data-quality starts with a fresh atom
      scope and the same skeleton; no side effects to compensate for on a
      remount.
  weaknesses:
    - |-
      No client-side permission guard on a sibling-route-contrasting bare
      mount — see the dedicated invariant entry for the load-bearing observation.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQuality.md
  evidence:
    - DataQuality.md:security.known_security_gaps.[0]
    - DataQuality.md:bugs_limitations_corner_cases.[0]
performance_aggregate:
  overall: HIGH
  hot_paths:
    - |-
      DataQuality.tsx is on the render critical path the first time a user
      navigates to /data-quality, but its own render cost is negligible —
      a 4-element static JSX tree with no data, no computation, no effects
      (DataQuality.tsx:7-18). The real per-render cost lives in the
      DataQualityContent child (the dashboard fetch + three DonutChart SVG
      renders + per-category result rows).
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One mount per page-open; no batching, no streaming.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless pure-composition — no instance state, no shared mutable state.
      Each mount creates an independent jotai Provider scope.
  strengths:
    - |-
      Code-split — the /data-quality JS chunk (this component + the dashboard
      subtree + the jotai store + the charts) is NOT in the initial bundle;
      downloads on first navigation, with AppLoadingPage shown during fetch.
    - |-
      Independent atom scope per mount means two browser tabs each get their
      own store; no cross-tab interference.
  weaknesses:
    - |-
      A broken or slow /data-quality lazy chunk shows the global AppLoadingPage
      fallback with no timeout and no error boundary at this node — if the
      dynamic import() fails (chunk 404 after a redeploy that changed chunk
      hashes, or a network drop), the user sees the loading page indefinitely
      or an uncaught error, with no retry affordance. Severity LOW; generic
      consequence of the app-wide lazy pattern.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQuality.md
  evidence:
    - DataQuality.md:performance.resource_allocation (code-split chunk)
    - DataQuality.md:bugs_limitations_corner_cases.[1] (no error boundary on lazy chunk)
related_features:
