behaviour: |-
  **`save(List<ActivityPojo>)` partial-commit semantics under reactive-Mono.zip error** — line 62-70 dispatches to `executeInPartition` which chunks at 1000 rows and reduces via `.zipWith(Integer::sum)` (`JooqReactiveOperations.java:62-66`). If chunk 3 of 5 fails (e.g. partition coverage gap on chunk-3's rows because they straddle a midnight rotation boundary), `.zipWith` propagates the chunk-3 error — but chunks 1, 2, and any chunk that completed before chunk-3's error already INSERTed to PG (no transaction wraps the chunked save at this level). The result: a `save(List<ActivityPojo>)` call that surfaces an error to the caller has nonetheless committed PARTIAL audit data. `AlertServiceImpl` which calls this method twice (lines 258, 324) with multiple alert events could see N/2 alert-receive activity rows committed and N/2 lost, with no compensating delete. **An attacker triggering ingestion-side errors at midnight rotation could exploit this to hide individual events behind a partial-commit failure.** The forensic-completeness gap is HIGHER than the read-side bleed because the bleed is a query problem; this is a write-side data integrity problem.
