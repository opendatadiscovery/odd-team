behaviour: |-
  **MEDIUM — the Data Quality dashboard's Namespace filter (`namespaceIds` / `deNamespaceIds`) silently WIDENS the match beyond what the bare "Namespace" label implies: the SQL joins `NAMESPACE.ID.in(namespaceIds)` against `DATA_ENTITY.NAMESPACE_ID` **OR** `DATA_SOURCE.NAMESPACE_ID` (`ReactiveDataQualityRunsRepositoryImpl.java:288-293`). An operator who selects "namespace X" sees BOTH entities directly in namespace X AND entities whose DATASOURCE carries namespace X — a wider result set than "Namespace" alone implies. No test pins the widening; the live `dashboard.md` (WebFetched 2026-05-22 status 200) does not document it.**

  **The widening chain** (statically certain):
  - Operator selects "namespace X" in the Namespace filter → `formFiltersAtom.namespaceIds = [{id:X, name:"X"}]`.
  - `filtersAtom` projects to `request.namespaceIds = [X]` → `GET /api/dataqatests/runs?namespaceIds=X`.
  - `DataQualityRunsController.java:19-32` binds.
  - `DataQualityTestFiltersMapper` 1:1 pass.
  - `ReactiveDataQualityRunsRepositoryImpl.java:288-293` builds:
    `NAMESPACE.ID.in(namespaceIds).and(NAMESPACE.ID.eq(DATA_ENTITY.NAMESPACE_ID).OR(NAMESPACE.ID.eq(DATA_SOURCE.NAMESPACE_ID)))`.
  - The OR-clause widens: entity E is in the result if EITHER `E.NAMESPACE_ID = X` (direct membership) OR `E.DATA_SOURCE.NAMESPACE_ID = X` (datasource inheritance).

  **What the operator sees vs expects**:
  - Expectation: "Namespace X" → entities whose direct namespace is X.
  - Reality: "Namespace X" → entities whose direct namespace is X PLUS entities with no namespace (or a different one) whose datasource is in namespace X.
  - The operator's count is WIDER than they think. On a catalog where most entities inherit their datasource's namespace, the two are nearly the same; on a catalog where entities are individually re-namespaced, the two diverge.

  **The drift class** is the same FAMILY as the Title-filter LSN-020 (TEST-GAP-912) but a different MECHANISM: this is an OVER-INCLUSION drift (the column matches partially correctly, but an OR-clause silently widens), where LSN-020 is a MIS-BINDING drift (the column matches the wrong concept entirely). The sidecar classifies this as MEDIUM (datasource-inheritance widening) where Title is HIGH (full mis-binding).

  **Test gap shape**: integration test seeding (a) entity E1 with namespace X directly, (b) entity E2 with no namespace but datasource DS-X (with namespace X), (c) entity E3 with namespace Y and datasource DS-Y. POST `/api/dataqatests/runs?namespaceIds={X.id}`; assert the tablesDashboard aggregates cover BOTH E1 AND E2 (PINS the widening) but NOT E3.
