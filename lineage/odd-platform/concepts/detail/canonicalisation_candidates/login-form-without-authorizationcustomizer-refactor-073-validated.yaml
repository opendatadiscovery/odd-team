proposed_canonical: LOGIN_FORM without AuthorizationCustomizer (REFACTOR-073 validated)
rationale: |
  Originally single-sidecar evidence from batch C (LoginFormSecurityConfiguration@L31 — the
  config-key-consumer layer view of the gate). **STRENGTHENED batch 2026-05-20X with the
  CONFIG-CLASS layer primary source** (LoginFormSecurityConfiguration config-class sidecar)
  closing the bean-topology view. Now 2-sidecar at the file level + cross-cited against
  three sibling SecurityConfiguration config-class / config-key-consumer files.

  Combined evidence (verbatim citations from the LoginFormSecurityConfiguration config-class
  sidecar):
    - LoginFormSecurityConfiguration.java:55-57 — only `pathMatchers("/**").authenticated()`
      — NO AuthorizationCustomizer wired
    - LoginFormSecurityConfiguration.java:81 — `getAuthorities(true)` hard-codes ADMIN for
      every form-authenticated user (GrantedAuthorityExtractor.java:12-17 returns
      UserProviderRole.ADMIN for the `isAdmin=true` flag)
    - OAuthSecurityConfiguration.java:98 — the OAUTH2 sibling DOES wire
      `new AuthorizationCustomizer(permissionService, extractors)` (the contrast point)
    - LDAPSecurityConfiguration.java:145 — the LDAP sibling DOES wire AuthorizationCustomizer
      (the second contrast point)

  Net effect: every form-authenticated user can call every endpoint regardless of any
  operator-authored Policy/Permission/Role configuration. The Policies/Permissions/Roles/Owners
  framework is INERT under LOGIN_FORM mode. THIS IS PROMOTED to a full invariant in batch X
  via `login-form-admin-for-every-user-rbac-inert.yaml`; this canonicalisation_candidate is
  superseded by that invariant. Retained here for cross-batch traceability — the maintainer
  can review the canonicalisation_candidate against the promoted invariant.

  HIGH-priority doc + code change candidate: live `/enable-security/authorization` should
  name OAUTH2-or-LDAP as the precondition for the Policies/Permissions/Roles/Owners
  framework. WebFetched 2026-05-20 status 200 confirmed the doc is silent on this
  precondition.
contributing_concepts:
- LoginFormSecurityConfiguration.java:53-66 (the authorize-exchange chain without
  AuthorizationCustomizer)
- GrantedAuthorityExtractor.getAuthorities(true) — ADMIN-for-all
- AuthorizationManagerCondition@L11 (the dead Condition that was supposed to gate it)
- LoginFormSecurityConfiguration config-class sidecar (batch X) — CONFIG-CLASS layer
  primary source CLOSING the bean-topology view
- OAuthSecurityConfiguration.java:98 + LDAPSecurityConfiguration.java:145 — contrast
  points (the two siblings that DO wire AuthorizationCustomizer)
suggested_add_to_docs: true
supersedes: |
  Promoted to canonical invariant in batch 2026-05-20X — see
