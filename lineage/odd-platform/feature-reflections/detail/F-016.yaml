- id: H-002
  hypothesis: "When user A — who has no ownership relation to a DEG or to any of its members — requests that DEG's group lineage, the system denies or restricts the response, so a team cannot read another team's inter-member data flow merely by knowing a DEG id."
  derivation: "Operators reasoning about a multi-team Domain expect ownership to gate cross-team visibility; the DEG is a conceptual grouping that often spans owner boundaries, so the default user expectation is that visibility is owner-scoped."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      There is NO owner check at any layer. The controller has no @PreAuthorize, there is NO
      SecurityConstants.SECURITY_RULES entry for the path (Grep `dataentitygroups.*lineage` → zero matches),
      and the request falls through to AuthorizationCustomizer's catch-all `.pathMatchers("/**").authenticated()`
      (lines 29-30). The service has no AuthIdentityProvider field and makes no fetchAssociatedOwner() call
      (LineageServiceImpl.java:54-57, 59-85). The member-resolution CTE has no OWNERSHIP join. Any authenticated
      principal under LOGIN_FORM/OAUTH2/LDAP — and any caller at all under auth.type=DISABLED — reads the full
      inter-member lineage graph of ANY DEG, including its members' metadata, regardless of ownership. This is
      the DEG-anchored instance of the platform read-collaborative posture (ADR-CANDIDATE-003 family), but the
      blast radius is STRICTLY WIDER than per-entity REFACTOR-203: per-entity lineage exposes one root's
      neighbourhood; DEG lineage exposes the inter-member edge graph across ALL members of a grouping that
      deliberately spans owner boundaries.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityGroupsLineage.md
        section: security.owner_scoping / known_security_gaps[0]
        cite: "LineageServiceImpl.java:54-57 + AuthorizationCustomizer.java:29-30 + SecurityConstants.java (no rule, Grep verified)"
        note: "No AuthIdentityProvider, no SECURITY_RULES entry, catch-all .authenticated() is the only gate."
      - sidecar: odd-platform__java__service__service__LineageServiceImpl.md
        section: security.owner_scoping / bugs_limitations_corner_cases
        cite: "LineageServiceImpl.java:59-85"
        note: "DEG id is the anchor; no owner filter at service or repository; cross-owner enumeration unmitigated."
