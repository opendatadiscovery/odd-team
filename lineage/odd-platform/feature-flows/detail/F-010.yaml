    state: GAP
    covered: []
    uncovered:
    - housekeeping.enabled=false does NOT register HousekeepingJobManager (no positive assertion)
    - housekeeping.enabled ABSENT silently no-ops (no matchIfMissing)
    - '@Scheduled(fixedRate=15min) cadence under slow-cycle conditions'
