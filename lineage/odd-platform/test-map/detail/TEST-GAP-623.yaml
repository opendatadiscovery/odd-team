proposed_action: |-
  Add `OwnerRenameSafetyTest`. (a) Seed: create Owner with id O, name "Alice"; create USER_OWNER_MAPPING (user U, owner O); (b) PUT /api/owners/{O} with `{name: "Alice2"}`; (c) assert SELECT FROM user_owner_mapping WHERE owner_id = O returns the original row (FK intact); (d) simulate user U login; assert the resolved Owner.id equals O AND Owner.name equals "Alice2". Pins the load-bearing safe-rename invariant. Plus a contrast test: name-rename does NOT touch the OIDC_USERNAME-side mapping key (cross-link REFACTOR-391's UserOwnerMapping test).
