    actual_behavior: |
      V0_0_87__create_relation_tables.sql:1-10 declares relationships.data_entity_id as bigint with
      only an FK constraint, no UNIQUE — so one relationship-class data_entity COULD own multiple
      relationships rows. ReactiveRelationshipsRepositoryImpl.java:197 uses jooqReactiveOperations.mono(query),
      which expects a single row; on a multi-row match the behaviour is JOOQ-driver-specific — either a
      TooManyResultsException (an error the user sees) or a silent first-row return (silent wrong data).
      No current collector produces multi-row (the doc ingestion matrix lists only Postgres + Snowflake),
      but the schema admits it (e.g. a collector regression or a manual SQL UPSERT). Which branch the
      driver takes cannot be determined from the code alone — it requires running the system with a
