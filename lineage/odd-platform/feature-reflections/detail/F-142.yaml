- id: H-011
  hypothesis: |-
    When an operator INTENDS to enable authentication but the auth.type value is malformed
    (lowercase 'disabled', a typo like 'OUATH2', leading whitespace, or empty), the association
    workflow behaves predictably and safely — it does NOT render an apparently-working binding
    form on a deployment that has no security filter wired.
  derivation: |-
    Feature-flow drift owner_association_predicate_string_equality_disabled… + Overview.md bugs[0]
    (HIGH). The entry gate is Boolean(appInfo?.authType && appInfo.authType !== 'DISABLED') with
    no enum validation at either layer.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      The gate (Overview.tsx:25-27) is a raw case-sensitive string-equality against the single
      literal 'DISABLED' with no normalisation and no enum validation, and the backend AppInfo
      consumer (AppInfoController.java:18) has no @Value default and no enum constraint (Overview.md
      bugs[0]; PLT-077). The four misconfiguration scenarios produce opposite-and-surprising
      outcomes: (a) AUTH_TYPE='' → gate false → form HIDDEN even though the operator meant to
      enable auth (and every @ConditionalOnProperty fails → NO SecurityWebFilterChain wired); (b)
      AUTH_TYPE='OUATH2' (typo) → gate TRUE → form RENDERS on a deployment with no security filter
      — a brand-new user "successfully" requests/auto-binds an owner on an unauthenticated platform;
      (c) AUTH_TYPE='disabled' lowercase / (d) ' DISABLED' whitespace → gate TRUE → form shows even
      though the operator's clear intent was to DISABLE auth. No console.warn, no fallback render,
      no diagnostic. The two layers (no backend default + no SPA enum validation) compound.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: "bugs_limitations_corner_cases[0] + invariants"
        cite: "Overview.tsx:25-27 + AppInfoController.java:18"
        note: "Case-sensitive string-equality gate; no @Value default; no enum validation — four misconfig outcomes."
    operator_visible_failure: |-
      (1) Silent insecure deployment: a typo'd auth.type wires NO SecurityWebFilterChain, yet the
      association form renders and a user binds an owner — the operator looking at a working-looking
      home page has no signal the platform is unauthenticated (HIGH; the worst case in the F-001/
      F-142 gate-mis-gating family). (2) Silent hidden form: empty auth.type hides the workflow
      entirely, so new users on a deployment the operator MEANT to secure cannot request association
      and conclude the feature is broken. The root (auth.type unvalidated at both layers) is already
      tracked as PLT-077; this hypothesis confirms the user-facing consequence ON THIS WORKFLOW
      (the association form is one of the two surfaces the broken gate flips).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

