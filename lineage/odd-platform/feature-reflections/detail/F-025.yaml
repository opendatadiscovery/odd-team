# Query Examples (CRUD + Faceted Search) — product-owner reflection

## product_owner_narrative

Query Examples is the Data Modelling pillar's way of letting a team write down *how a dataset is meant to be queried* and pin that knowledge next to the data itself. A data engineer who knows the canonical join, the right partition filter, or the one Spark snippet that produces the monthly rollup authors it once as a Query Example — a short `definition` (a human, prompt-style description of what the snippet does) plus a `query` body (the executable SQL / KQL / Spark code) — and attaches it to the datasets and glossary terms it concerns (per `QueryExampleController` sidecar understanding; `system-mission.md:108-123`). The next analyst who lands on that dataset's detail page, or browses the central Query Examples catalog, finds vetted query knowledge instead of reinventing it. The audience is broad: authors are data engineers and stewards; readers are analysts, BI engineers, and anyone exploring the catalog (per controller sidecar `concepts.audiences`).

A user reaches the feature two ways. The global "Data Modelling" toolbar tab deep-links straight to `/data-modelling/query-examples` — the catalog list, which is the pillar's canonical landing surface (there is no separate pillar-overview screen; per `DataModelling` component sidecar `stress_findings.name_behavior_pairs`). From the list they search the catalog with a faceted-search session (POST `/queryexample/search` issues a `searchId` UUID; subsequent GET/PUT operate against that session — per controller `operations.queryExamplesSearch`), open any snippet's detail page at `/data-modelling/query-examples/{id}`, and — if they hold the right permission — open a modal dialog to author or edit. The same snippets also surface in-context: a "Query Examples" tab on every dataset detail page (via `getQueryExampleByDatasetId`) and on every glossary term page (via `getQueryExampleByTermId`) (per controller `dependencies_semantic.requires-feature`, cross-pillar to P-01 + P-06).

The working parts a product owner would demo: **authoring** (a two-field modal — "Definition" as a single-line input, "Query" as a live Markdown editor — opened by an "Add query example" button on the list, per `QueryExampleForm.tsx:77-126` read directly); **faceted search** (FTS-ranked, with a Terms facet and a Datasets facet, per controller `docs_link_semantic` + `ReactiveQueryExampleRepositoryImpl`); **reverse lookup** (find every snippet attached to this dataset / this term); **edit and delete** (gated by `QUERY_EXAMPLE_UPDATE` / `QUERY_EXAMPLE_DELETE` action buttons on the detail page, per `queryExamples` route `audiences`); and **a seven-permission RBAC grid** the docs enumerate (`QUERY_EXAMPLE_CREATE/_UPDATE/_DELETE/_DATASET_CREATE/_DATASET_DELETE/_TERM_CREATE/_TERM_DELETE`, per WebFetch 2026-06-03 status 200).

The feature sits at a busy crossroads. It *feeds* P-01 Data Discovery (a snippet is part of a dataset's detail page) and P-06 Data Glossary (a snippet attaches to a term); the dataset-link write side actually lives on `DataEntityController` and the term-link write side on `TermController`, so the seven-permission grid is split across three controllers (per controller understanding + `system-mission.md` P-02 cross-pillar). It shares the platform-wide read-collaborative posture with the F-014 / F-015 / F-017 family — every authenticated user reads every snippet across every namespace — and it shares the faceted-search-session-by-UUID pattern with F-017 / F-024 / F-026. It is the fourth member of the F-004 stored-XSS family because both text fields render through `@uiw/react-md-editor`'s Markdown pipeline.

In a demo the product owner would highlight the edge cases honestly: an empty catalog with no search-id on the URL renders a placeholder for a tick; deleting a snippet is *irreversible at the link level* (the dataset/term associations are hard-deleted while the snippet row is only soft-deleted); none of these mutations appear on the Activity Feed, so "who created this snippet, and when" is unanswerable from the platform's own audit surface; and the feature has zero HTTP-layer, UI-layer, and integration-layer automated tests — every endpoint's status code, every permission gate, and every screen behaviour is verified only by a human clicking (per controller `tests_coverage_semantic.gaps` + the directory-wide zero-coverage Grep in the `DataModelling` component sidecar).

