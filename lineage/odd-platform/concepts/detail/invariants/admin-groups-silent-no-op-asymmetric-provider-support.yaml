  - GoogleUserHandler.md:bugs_limitations_corner_cases.[0] (silent no-op operator hostility)
  - GoogleUserHandler.md:docs_link_semantic.doc_drift_findings.[3] (live docs cite admin-groups for Cognito + GitHub only)
  - GoogleUserHandler.md:security.known_security_gaps.[0] (silent policy failure)
  - GithubUserHandler.md:dependencies_semantic.requires-config.admin-groups (full implementation with team-org scoping)
  - 'Code anchors: GoogleUserHandler.java:1-74 (no getAdminGroups call); ODDOAuth2Properties.java:49 (field binds); AbstractOIDCUserHandler.java:44-55 (the supported analogue); GithubUserHandler.java:99-120 (org-scoped team-membership check)'
notes: |-
  Related to the OAuth Provider-Quirks Strategy Pattern (sibling invariant).
  When the maintainer adopts the recommended fix path, the BEST option for
  documentation discipline is to ADD a Google-side admin-groups implementation
  (via the OIDC `groups` custom claim, which Google Workspace supports via
  custom-claims directory configuration) — this preserves operator mental
  model parity across all OAuth providers. Second-best is a boot-time
  validation rejection (fail-fast) so the operator hears about the misconfiguration
  at deployment time. Worst is the current silent-no-op state, which is
  the LSN-001 pattern instantiated at the OAuth authorization layer.
  Surfaces a follow-up DOC-NNN: the live `oauth2-oidc` page should make
  the per-provider support matrix for `admin-groups` explicit (currently
  reader infers absence-of-mention = absence-of-support).
