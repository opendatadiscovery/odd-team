name: DQ Dashboard doc silent on access control (every live data-quality page)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  Every live Data Quality documentation page (live URLs verified
  2026-05-22 status 200) is SILENT on access control / permissions /
  who can view the dashboard:
    - https://docs.opendatadiscovery.org/features/data-quality/dashboard
      (the dashboard sub-page) — no statement about access control.
    - https://docs.opendatadiscovery.org/features/data-quality
      (the pillar landing) — no statement about access control.

  The CODE is unambiguous: the `/data-quality` route is mounted at
  `App.tsx:73` with NO `WithPermissionsProvider` wrapper (contrast
  `/lookup-tables` at `App.tsx:75-88`, which IS wrapped); the 'Data
  Quality' top-bar tab is rendered unconditionally (`ToolbarTabs.tsx:45-49`);
  any authenticated user can open the catalog-wide aggregate quality
  view. Under `auth.type=DISABLED` the page is anonymously reachable.

  NEW invariant, batch ZC (2026-05-22).

  The doc-side silence is consistent with the platform's documented
  read-collaborative posture (the per-dataset DataQualityController
  sidecar records the same silence for its four read endpoints), but
  the dashboard page is the NATURAL place to disclose 'visible to any
  authenticated user' and it does not. An operator deploying ODD and
  reading the dashboard doc has no signal that the page leaks the
  catalog-wide quality posture to every authenticated principal.

  Severity MEDIUM: operator-facing surprise, not a guide-off-a-cliff.
  No data loss, no security boundary violation — the visibility IS the
  intended posture; only the silence is the gap. For deployments where
  the operator's threat model includes per-team confidentiality of
  quality data, the missing disclosure is the difference between an
  informed decision and an uninformed exposure.

  Recommended fix: add a CAVEAT block to dashboard.md and data-quality.md:
    "Access control: the Data Quality Dashboard is visible to any
    authenticated user. Under `auth.type=DISABLED` it is anonymously
    reachable. The view is read-only; no per-owner or per-role
    filtering is applied at the backend. This is consistent with ODD's
    read-collaborative catalog posture (ADR-CANDIDATE-003)."

  vocabulary_status: codebase-anchored, doc-side-gap — explicit absence
  of documentation about an operator-visible property.
vocabulary_status: codebase-anchored, doc-side-gap
