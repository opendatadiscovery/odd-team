# Operator-Facing Owner-Association Triage Workflow — product-owner reflection

## product_owner_narrative

The Owner-Association Triage Workflow is the operator's inbox for a single
administrative chore: deciding who is allowed to *act as* a catalog Owner. In
ODD, an Owner is a directory entity that data entities are stewarded by; before
a logged-in person can be treated as that Owner (to get "My Objects",
owner-scoped alerts, ownership badges), a `user_owner_mapping` row must tie
their identity to the Owner. Most users obtain that row by self-requesting it
(F-075) and waiting for an admin to approve. This feature is the *approval seat*:
an operator holding `OWNER_ASSOCIATION_MANAGE` opens Management → Associations →
"New requests" and sees one row per PENDING request, each with an Accept and a
Reject button (per OwnerAssociationRequestController sidecar `understanding`;
chain hop 3 NewAssociationRequest.tsx:33-104).

A user interacts with this feature by landing on the New-requests tab, scanning
the list, and clicking Accept or Reject on a row. Each click pops a
ConfirmationDialog, and on confirm fires `PUT /api/owner_association_request/{id}`
with `status: APPROVED` or `status: DECLINED` (NewAssociationRequest.tsx:33-49,
70-104). Approve creates the `user_owner_mapping` row and stamps the request
APPROVED; Reject is a status-only update (per OwnerAssociationRequestServiceImpl.java:90-105,
184-190). Both outcomes are written to a dedicated typed audit table,
`owner_association_request_activity`, which the History sub-tab reads — this is
the *positive* half of the platform's two-tier audit story (per controller
sidecar coherence-note re F-006; concept `audit-log-presence-asymmetry-2-tier-audit-story`).

The working parts the operator can see are deliberately spare: the row shows the
requester username, the Owner name, the requested Role(s), and the auth Provider
— four read-only strings and two buttons (NewAssociationRequest.tsx:53-104). The
search box atop the list filters the pending set; switching tabs explicitly
clears it (per feature-flow facet `tab_switch_resets_search_query_to_empty`,
OwnerAssociationsTabs.tsx:44-47). The buttons are *disabled*, not hidden, for an
operator lacking `OWNER_ASSOCIATION_MANAGE` — the list itself is reachable to any
authenticated user under the platform-wide read-collaborative posture (per
feature-flow facet `permission_gate_disables_button_but_does_not_hide_row`,
cross-link F-074).

This feature is one leg of a four-leg quartet over the same `user_owner_mapping`
state: F-075 is the user-self-CREATE side that feeds this inbox; F-172 is the
admin direct-bind that bypasses the inbox entirely; F-173 is the Active-tab
Remove that reverses an Approve; F-174 is the History audit consumer that reads
what this feature writes (related_features). Downstream, the binding this feature
creates is consumed by F-011 (principal-to-Owner resolution) and gates
owner-scoped reads across the catalog (P-08 → P-09 cross-pillar relationship in
system-mission.md).

In a demo a careful product owner would flag three edge cases. First, the row
gives the operator *no context to decide with* — no submission timestamp, no
stated reason, no requester history (facet
`triage_ui_no_request_context_preview`); the operator approves on four identity
strings. Second, the Accept dialog is silent about consequences — it does not say
the action is reversible only via a different tab, and it does not warn that
approving this request will silently auto-decline every *other* pending request
for the same Owner (OwnerAssociationRequestServiceImpl.java:192-203). Third, a
request can outlive its Owner: if the target Owner was soft-deleted, the row may
still be approvable, binding the user to a dead Owner (per controller sidecar
bug `[1]`; tracked PLT-132).

