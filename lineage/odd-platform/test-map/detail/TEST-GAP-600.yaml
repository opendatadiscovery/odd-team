behaviour: |-
  **`post_logout_redirect_uri` derived from inbound Host header — NO platform-side allowlist; depends entirely on IdP-side enforcement.** Both Azure AND Cognito logout handlers compute the post-logout redirect target via `UriUtils.getBaseUri(requestUri)` (`UriUtils.java:11-22`) which strips path/query/fragment from the INBOUND HTTP request URI and returns scheme+host+port. The Host header is operator-controlled at deployment (via the reverse proxy) but request-controlled at runtime — a forwarded `X-Forwarded-Host` that the proxy trusts and synthesizes into the request URI propagates to the logout endpoint's `post_logout_redirect_uri` (Azure) / `logout_uri` (Cognito) query param. The platform carries NO `odd.platform-url` / `platform.base-url` config to cross-check against (verified by Grep against application.yml). Mitigations: (a) Azure's standard App Registration "Logout URL" validation; (b) Cognito's "Allowed sign-out URLs" app-client allowlist. If an operator has registered wildcard or multiple Logout URLs on the IdP side (e.g. multi-environment App Registration sharing), the IdP-side bound is removed and the inbound Host becomes the open-redirect target. Same shape across 4 sibling OIDC handlers using the same `UriUtils.getBaseUri` helper. Docs silent on the operator-side dependency.
