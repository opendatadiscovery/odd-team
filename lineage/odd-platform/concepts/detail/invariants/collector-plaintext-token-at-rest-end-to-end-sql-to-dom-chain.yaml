name: Collector plaintext token at-rest — end-to-end SQL-to-DOM exposure chain
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-08
- P-09
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20R** — combines the
  SQL-tier substrate (ReactiveCollectorRepositoryImpl batch R) with
  the UI-tier surface (CollectorsList batch Q) to map the COMPLETE
  exposure path of a Collector's 40-char alphanumeric token. The
  token is plaintext at every layer it touches:

  **Write side** (TokenGeneratorImpl.java:34-42):
    `RandomStringUtils.randomAlphanumeric(40)` is written verbatim to
    `token.value` (40-char alphanumeric, `ThreadLocalRandom`-backed —
    NOT a CSPRNG; should be `.secure().nextAlphanumeric(40)`). No
    hashing, no salt, no `BCryptPasswordEncoder.encode`, no MAC.

  **At rest in PostgreSQL** (V0_0_28__add_token.sql:1-9):
    `token.value varchar(40) NOT NULL` — plaintext column. NO `UNIQUE`
    constraint on `value` (the only uniqueness anywhere in the
    token-collector relationship is the partial unique index
    `collector_token_unique ON collector(token_id) WHERE deleted_at
    IS NULL` per V0_0_33:1 — one TOKEN row CANNOT bind to two LIVE
    collectors, but two TOKEN rows MAY share the same `value`). NO
    index on `token.value` — `getByToken(token)` queries fall back to
    a sequential scan of the TOKEN table.

  **Verify side at SQL** (ReactiveCollectorRepositoryImpl.java:89-97):
    `getByToken(token)` runs on EVERY `POST /ingestion/datasources`
    request via the ALWAYS-ON `IngestionDataSourceFilter` (per
    IngestionDataSourceFilter.java:15-22 — NO `@ConditionalOnProperty`,
    irrespective of `auth.ingestion.filter.enabled`). The SQL is
    `SELECT collector.* FROM collector JOIN token ON token.id =
    collector.token_id WHERE token.value = ? AND collector.deleted_at
    IS NULL` — PLAINTEXT EQUALITY MATCH via `TOKEN.VALUE.eq(token)`
    at line 94. The Postgres-stdlib text-equality short-circuits on
    first mismatching byte (timing channel, practically negligible
    against 40-char alphanumeric tokens with ≈ 62^40 keyspace, but
    academically present).

  **Verify side at filter** (IngestionDataEntitiesFilter.java:55-58):
    The opt-in filter (gated by `auth.ingestion.filter.enabled=true`)
    fetches the CollectorDto via `collectorRepository.getDto(collectorId)`
    and performs `tokenPojo.getValue().equals(token)` — `String.equals`
    which ALSO short-circuits on length mismatch and first byte mismatch.

  **UI surface — CollectorsList batch Q sidecar** (CollectorItemToken.tsx:34):
    A freshly-created or freshly-regenerated collector token is
    rendered DIRECTLY INTO THE DOM as plaintext via
    `<Token>{collector.token.value}</Token>`. NO `<input type='password'>`
    obfuscation, NO Reveal-on-hover affordance, NO auto-hide timer,
    NO copy-to-clipboard-and-immediately-mask pattern. Any browser
    extension, screenshot tool, accessibility screen reader,
    DOM-inspection tool, or browser cache captures the credential.
    Sole mitigation: the visible warning admonition "Save token in a
    secure location. You will not be able to retrieve it again."
    (CollectorItem.tsx:87-98).

  **Rotation is in-place UPDATE** (CollectorServiceImpl.java:82-90 +
  ReactiveTokenRepositoryImpl.java:33-36): `regenerateToken` reads
  the existing TokenPojo, mutates `value` to a fresh 40-char string,
  persists via `tokenRepository.updateToken` — an `UPDATE token SET
  value = ?, updated_at = ?`. The PRIOR token value is LOST — NO
  history table, NO audit-log row, NO ActivityEvent. The COLLECTOR
  row's `updated_at` is NOT touched — investigators looking at the
  collector won't see the rotation timestamp.

  **The end-to-end chain has SIX exposure points**:
    1. PostgreSQL row at rest — readable via `SELECT * FROM token`
    2. Backup / replica / pg_dump — credential travels with the row
    3. jOOQ query log if enabled at DEBUG / TRACE level — bound
       parameter would surface
    4. Application log if any code path log-prints the TokenPojo
       (no current path, but no defence either)
    5. Browser DOM after token creation or rotation — until full
       page unmount
    6. Network transport between platform and collector — TLS-only;
       no application-layer signing or HMAC

  **The plaintext-everywhere assumption is the load-bearing
  implicit ADR** (per ReactiveCollectorRepositoryImpl batch R
  implicit_adrs.[0]). Every component of the bearer-token flow assumes
  plaintext-at-rest. Introducing token hashing requires coordinated
  changes at ALL FIVE write+read sites (TokenGeneratorImpl + TokenRepo
  + CollectorRepo.getByToken + IngestionDataEntitiesFilter.equals +
  the UI's one-shot display). No single component can be retrofitted
  in isolation.

  **The IngestionDataSourceFilter is ALWAYS-ON** — the asymmetric
  auth invariant. Disabling `auth.ingestion.filter.enabled` removes
  the symmetric filter on `/ingestion/entities` but DOES NOT remove
  the asymmetric filter on `/ingestion/datasources`. An operator
  reading the live doc at `configuration-and-deployment/enable-security`
  (which describes the opt-in filter family) cannot infer that
  `IngestionDataSourceFilter` is unconditional.

  **No audit trail for rotation OR for soft-delete** — neither
  `regenerateToken` nor `delete` emits an ActivityEvent / audit-log
  row. Combined with the F-006 audit-silence pattern, token-rotation
  is forensically dark.

  **Soft-deleted collector orphan TOKEN row** — the TOKEN table has
  NO soft-delete column. When a Collector is soft-deleted, the FK
  reference `collector.token_id` remains pointing at an orphaned
  TOKEN row that is now permanent. The partial unique index
  `collector_token_unique ON collector(token_id) WHERE deleted_at
  IS NULL` (V0_0_33:1) ALLOWS this (only enforces uniqueness on
  LIVE collectors). NO housekeeping job removes TOKEN rows orphaned
  by collector soft-delete; historical credentials persist
  indefinitely as DB-level exposure surface.
