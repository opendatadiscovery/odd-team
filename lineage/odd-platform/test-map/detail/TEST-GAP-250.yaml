proposed_action: 'Add a parameterised `SearchFTSQuerySyntaxTest` covering: (a) `foo!bar`
  → 500 syntax-error; (b) `(foo)` → 500; (c) `a<->b` → 500; (d) `foo:` → 500; (e)
  `foo & bar` (balanced) → 200 with re-interpreted semantics. Drives the fix (either
  sanitise via `quote_literal` + `phraseto_tsquery`, or catch and translate to 400
  BadUserRequest).'
