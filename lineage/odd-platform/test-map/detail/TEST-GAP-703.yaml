gap_id: TEST-GAP-703
category: missing-security
criticality: HIGH
node_ids:
  - "odd-platform java service service:PolicyServiceImpl"
pillars_affected: [P-09]
surfaced_by:
  - "PolicyServiceImpl.md:security.known_security_gaps.[5] (No anti-elevation guard)"
behaviour: |-
  **`PolicyServiceImpl.create` HAS NO ANTI-ELEVATION GUARD — a POLICY_CREATE-bearing user can author a `MANAGEMENT/ALL` policy and (with ROLE_CREATE or ROLE_UPDATE) bind it to a role they belong to, completing a self-elevation chain.** The validator (`PolicyJSONValidator` + `policy_schema.json`) ACCEPTS MANAGEMENT/ALL as a legal shape — identical to the seeded Administrator. There is NO 'cannot grant permissions you don't already have' check. This is INTENTIONAL in the platform's design (an administrator can author administrator policies — that's the bootstrap) but the consequence is that POLICY_CREATE is FUNCTIONALLY ROOT ON THE PLATFORM. Carry-over from batch-E PolicyController.createPolicy known_security_gaps[2]; service-tier confirmation here. The current contract is documented at the concept-catalog level as INTENTIONAL but is NOT regression-pinned. A future refactor that pursued anti-elevation (e.g., reject policies granting permissions the caller does not already hold) would close the elevation chain — and breaks this test, making the security-tightening deliberate. The current test pins the PERMISSIVE behaviour so that operators auditing 'what does POLICY_CREATE enable' can read the test as the documented contract: POLICY_CREATE is platform-root.
test_files_existing: []
