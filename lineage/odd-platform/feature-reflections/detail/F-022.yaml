- id: H-012
  hypothesis: |
    When an operator opens the "Test reports" tab for a dataset with a very large
    number of DQ tests (thousands), the tab loads responsively (paginated or
    windowed) rather than fetching and rendering every test in one response.
  derivation: |
    Endpoint-shape + negative-space + performance seed: the OpenAPI spec declares no
    page/size params on `getDataEntityDataQATests` (per `DataQualityController.md`
    performance.scaling_characteristics + known_performance_gaps[0]); the natural
    user expectation on a list surface is bounded fetching.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      `getDataEntityDataQATests` has NO pagination — the OpenAPI spec
      (`openapi.yaml:1932-1947`) declares no `page`/`size`; the controller method
      takes only the dataset id; the full list is returned in one response with no
      server-side clamp and no client hint (per `DataQualityController.md`
      performance.known_performance_gaps[0] + scaling_characteristics). A dataset
      with 10K+ tests returns 10K+ rows in one payload, which the UI renders at once.
      This is the `page_only_count_mismatch_no_pagination_on_test_list` drift,
      inconsistent with the catalog's level-4 mandatory page+size pattern (F-023
      Directory).
    evidence:
      - sidecar: odd-platform__java__DataQualityController__controller-class__DataQualityController.md
        section: performance.known_performance_gaps[0] + scaling_characteristics[1]
        cite: "DataQualityController.java:25-31 + openapi.yaml:1932-1947"
        note: "No pagination params on the test-list endpoint; unbounded response"
    operator_visible_failure: |
      A dataset with thousands of tests (a wide table profiled column-by-column, or a
      long-running dbt suite) returns a multi-thousand-row payload the browser must
      parse and render in one shot — a slow tab open, high browser memory, and
      serialisation cost on the platform. Unlike the Activity Feed's unbounded `size`
      (a separate feature), here there is no size parameter to misuse — the absence
      is total. Routes to bug-candidate (add page+size to spec + controller +
      repository) consistent with the platform's pagination convention.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional   # after pagination is added, a test that the test-list endpoint respects page+size and clamps; until then a perf-pin of the unbounded response

- id: H-013
  hypothesis: |
    The `image/png` SLA badge endpoint is safe to embed cross-origin (e.g. in a
    third-party BI tool's HTML) without leaking a dataset's SLA colour to an
    untrusted embedding page beyond what the viewer is already authorised to see.
  derivation: |
    Cross-pillar (BI-embed) + security seed: the doc encourages `<img src=...>`
    embedding; the controller sidecar's security block flags cross-origin
    embeddability with cookie-bearing auth as a potential leak.
  seed_source: cross-pillar + endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |
      Static analysis (per `DataQualityController.md` security.known_security_gaps[1]):
      the PNG endpoint sets no `@CrossOrigin`, no `Cache-Control: private`, no
      `X-Frame-Options` at the method/path level; under cookie-based auth
      (LOGIN_FORM with a session cookie), a malicious page the victim visits while
      logged in could `<img src='{platform}/api/datasets/123/sla'>` and the browser
      would attach the auth cookie, returning the SLA colour for dataset 123 to the
      attacker's page (a cross-site read of the colour — not the full report, but the
      Red/Yellow/Green signal, which can itself be sensitive: "this finance dataset
      is failing"). Whether this actually leaks depends on the deployed CORS config,
      the auth mode, and whether cookies are SameSite — none determinable from the
      controller sidecar alone (the security config beans are not in this chain).
      Needs a measured run against a local instance.
    evidence:
      - sidecar: odd-platform__java__DataQualityController__controller-class__DataQualityController.md
        section: security.known_security_gaps[1]
        cite: "DataQualityController.java:42-48 (no @CrossOrigin / no X-Frame-Options / no Cache-Control: private)"
        note: "PNG badge embeddable cross-origin; cookie-bearing read could leak the SLA colour to an embedding page"
    operator_visible_failure: |
      IF the probe confirms cross-origin readability under cookie auth: any web page a
      logged-in operator visits could silently read the SLA colour of any dataset id
      (badges are keyed by sequential data_entity_id, so an attacker can enumerate).
      For deployments where the colour is business-sensitive this is a confidentiality
      leak; for deployments treating SLA as public it is benign. The verdict requires
      a run because the outcome is auth-mode-and-CORS-config dependent.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-022-4
    routes_to_finding: validation-gap
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: probe   # the test_demand IS the probe (PENDING-F-022-4); a local-only headless-browser cross-origin read against a cookie-auth instance

