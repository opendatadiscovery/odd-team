- concepts.yaml:entities[Collector Token].security_aggregate.weaknesses.[0]
proposed_action: Add unit test on `TokenGeneratorImpl` that introspects `RandomStringUtils`
  call site or asserts statistical entropy properties of N=10000 generated tokens.
  Pin the secure-RNG contract; convert to deliberate test update once `.secure().nextAlphanumeric(40)`
  lands.
