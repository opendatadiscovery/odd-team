# active-streams.yaml — the parallel-contribution coordination lock
# ============================================================================
# WHY THIS FILE EXISTS
# A `/contribute` or `/review` run used to assume it was the ONLY writer of a set
# of single-instance, machine-global resources (the odd-platform checkout, the SUT
# image tag, the compose stack/ports, the odd-team git index, and `lineage/**`).
# Two runs that share them corrupt each other, and — worse — a run that trusts
# another stream's RECORD (rather than the live working tree) mis-models what is
# safe to touch. Two real misses this session prove the need:
#   - CTRIB-028's ledger said its enrich was blocked by "CTRIB-029's lineage edits";
#     the real holder of the `lineage/**` lock was a /probe-run (P-001), not 029.
#   - CTRIB-028's record cited odd-platform 9d3de146 while the live head was
#     75fc06cd (a revert+reapply on the shared checkout the record never caught).
#
# This file is the single place every parallel run READS at intake and WRITES
# throughout, so all parties are MUTUALLY AWARE and every shared resource has a
# named current holder. It makes awareness bidirectional: a contributor sees the
# reviewer, the reviewer sees both contributors, and a starting run learns what is
# claimed before it picks a worktree / image tag / port pair / lineage window.
#
# Design source: adrs/drafts/parallel-contribution-infra.md (the maintainer's
# "make N-parallel possible" findings doc) §4 isolation model + §5.4 (this lock).
# That doc is the rationale; THIS file is the live state.
# ============================================================================
#
# PROTOCOL (the robust process)
#   1. READ at intake. Every `/contribute` and `/review` run reads this file
#      FIRST, before touching any shared resource. Trust the live working tree
#      over any record (`git -C ../odd-platform status/branch`, `docker ps`) and
#      reconcile this file if it has drifted.
#   2. REGISTER. Add (or refresh) your entry: a unique `id`, your `role`, the
#      work item, your isolation namespace, the paths/resources you will WRITE
#      (`owns_write`), and any serialized resource you are WAITING on (`wants`).
#   3. PICK NON-COLLIDING resources. Choose a worktree path, SUT image tag,
#      compose project, and port pair that no live entry holds (see
#      `shared_resources` for the next-free values).
#   4. UPDATE per phase. Keep `phase`/`status`/`updated` current as you progress.
#   5. RESPECT the serialized resources (see `shared_resources`): `lineage/**`
#      is single-writer; the heavy e2e regression runs one-at-a-time and never
#      concurrently with a possible maintainer run (G-C2); the odd-team git index
#      + PROGRESS.md take explicit-path atomic commits only (never `git add -A`;
#      new files stay untracked until the commit moment).
#   6. CLEAR at terminal state (GATE 2 merged / done / blocked / review complete):
#      remove your entry (or set `phase: complete`) and release any held resource.
#
# ADOPTION (not yet wired — maintainer's script/skill/agent pass)
#   This file is live + hand-maintained today. To make registration AUTOMATIC,
#   wire the read/register/clear steps into:
#     - .claude/skills/contribute/SKILL.md  Phase A (intake) + the GATE-2 close
#     - .claude/skills/review/SKILL.md       intake (register reviewer) + verdict
#   and pair it with the findings doc's §5.1-3 ergonomics (build-sut.sh ODD_SUT_TAG,
#   run-suite.sh stream-id mode, a parameterised compose) so a stream's namespace
#   is derived, not hand-rolled. Until wired, runs maintain this file by hand.
#
# SCHEMA (per stream entry)
#   id            short stream id (kebab); also the isolation namespace suffix
#   role          contributor | reviewer | probe-run | enrich | reducer | maintainer
#   work_item     CTRIB-NNN / DOC-NNN / "(none)"
#   issue         upstream issue URL, or "(n/a)"
#   phase         human phase label (intake|implementing|docs-done|reviewing|…)
#   status        the work-item's recorded status
#   started/updated  ISO timestamps
#   isolation     the per-stream namespace (worktree / image / compose / ports)
#   owns_write    explicit paths/resources THIS stream may write (others avoid)
#   reads_only    repos this stream only reads (reviewers)
#   wants         serialized resources this stream is WAITING/PENDING to write
#   notes         free text
# ============================================================================

