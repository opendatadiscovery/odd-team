name: Plaintext-equality shared-secret token model
canonical_in_docs: false
canonical_candidate: true
description: |-
  Collector authentication uses a 40-char alphanumeric token stored in
  plaintext in the TOKEN table; IngestionDataEntitiesFilter validates incoming /ingestion/entities
  requests via literal `.equals(...)` against the in-DB value. No hashing layer, no
  HMAC, no per-request signature. Rotation is in-place UPDATE — no overlap window.
  The model is consistent with the token being a long-random opaque string used over
  TLS-protected transport, but DB compromise / backup / replica carries credentials
  in the clear. RandomStringUtils.randomAlphanumeric(40) uses ThreadLocalRandom (non-CSPRNG);
  should be .secure().nextAlphanumeric(40). Triangulated across WRITE-side (regenerateCollectorToken)
  AND VERIFY-side (IngestionDataEntitiesFilter@L20) sidecars in 2026-05-10B.
  **STRENGTHENED batch 2026-05-19-O** — the new IngestionDataEntitiesFilter filter-class-layer
  sidecar (auth/filter axis) confirms the plaintext-equality stance at the CONSUMER
  site for a third time (line 56 `dto.tokenPojo().getValue().equals(token)`),
  and surfaces the corresponding architectural-pattern claim in its implicit_adrs[1].
  The model is now triangulated across THREE sidecar axes: config-key-consumer
  (auth.ingestion.filter.enabled@L20), auth/filter (filter class layer batch O),
  and controller-method (regenerateCollectorToken write side).
axes_present:
- controllers
- config_prefixes
- filters
nodes:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
- odd-platform java IngestionDataEntitiesFilter config-key-consumer:auth.ingestion.filter.enabled@L20
- odd-platform java auth filter:IngestionDataEntitiesFilter
contributors:
- 'regenerateCollectorToken.implicit_adrs[1]: token rotation is in-place UPDATE, not
  append-new-then-revoke-old'
- 'regenerateCollectorToken.implicit_adrs[2]: token returned in plaintext on rotation,
  masked on read'
- 'regenerateCollectorToken.implicit_adrs[3]: token authentication is plaintext-equality
  against in-DB string; no hashing layer'
- 'IngestionDataEntitiesFilter@L20.implicit_adrs[2]: VERIFY-side carry of the same
  stance — `if (!dto.tokenPojo().getValue().equals(token))` at line 56. Not BCrypt.matches,
  not MessageDigest.isEqual, not HMAC verification. The shared-secret-stored-plaintext
  stance carries across the rotate-side AND the verify-side.'
- 'IngestionDataEntitiesFilter (batch O — auth/filter axis).implicit_adrs[1]:
  Token verification is PLAINTEXT-EQUALITY against a shared secret stored unhashed
  in PostgreSQL. The `String.equals` choice on the verify-side mirrors the plaintext-
  write on the rotate-side; the project has CONSISTENTLY chosen shared-secret
  semantics over hashed-credential semantics for the entire collector-token model.
  The 40-char alphanumeric length (40 chars × log2(62) ≈ 238 bits of entropy)
  means brute-force is infeasible, but the timing-side-channel from non-constant-
  time comparison AND the at-rest-plaintext exposure are both architectural
  consequences of the shared-secret stance. The same stance applies to
  S2sAuthenticationFilter (sibling class — YAML-configured plaintext token
  compared via s2sTokenProvider.isValidToken).'
