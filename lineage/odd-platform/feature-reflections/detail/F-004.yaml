- id: H-008
  hypothesis: "When two operators concurrently edit the same entity's description and both save, the platform preserves both contributions or warns of the conflict."
  derivation: "A product owner of a collaborative editing surface expects either last-write-wins WITH a warning, or conflict detection — not silent loss."
  seed_source: negative-space
