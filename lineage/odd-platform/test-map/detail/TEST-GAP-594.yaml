behaviour: |-
  **Org-membership gate + admin-team gate — TERMINAL authorization decisions on GitHub OAuth2 login.** Two outbound HTTPS calls to api.github.com: (a) `GET /user/orgs` (line 78) to verify `team.organization.login` case-insensitively matches `provider.organizationName`; (b) `GET /user/teams` (line 106, conditional on adminGroups non-empty) to determine ADMIN by team-name membership within that org. Both responses are parsed and used to gate authentication: (1) user not in `organizationName` → `Mono.error(OAuth2AuthenticationException("invalid_token", "User doesn't belong to organization {orgName}"))` at line 90; (2) user in org + adminGroups empty → USER; (3) user in org + member of a team WHOSE NAME case-insensitively-equals any adminGroups entry AND whose team belongs to organizationName → ADMIN; (4) user in a team named the same as an adminGroups entry BUT in DIFFERENT org → team does NOT contribute to ADMIN (cross-org disambiguation at lines 114-119, 122-131). ZERO tests exist; the chain produces ADMIN-or-USER-or-reject decisions with NO downstream re-check.
test_class: missing-security
test_files_existing: []
test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/handler/GithubUserHandlerOrgAndTeamGateTest.java"
  name: "enrichUser_orgMembershipAndAdminTeamGates_fourBranches_pinsAllDecisions"
evidence:
  - "GithubUserHandler.md says (uncovered_behaviours.[4]): 'When organizationName is non-empty AND the user does not belong to that org per /user/orgs, the handler emits Mono.error(OAuth2AuthenticationException(invalid_token, ...))'"
  - "GithubUserHandler.md says (uncovered_behaviours.[6]): 'When the user belongs to organizationName AND adminGroups is non-empty AND the user is in a team whose organization.login matches organizationName and whose team.name case-insensitively equals any adminGroups entry, the handler returns ADMIN'"
  - "GithubUserHandler.md says (uncovered_behaviours.[7]): 'When the user is in a team named the same as an adminGroups entry BUT in a DIFFERENT organization (i.e., team.organization.login != organizationName), the team does NOT contribute to ADMIN'"
  - "GithubUserHandler.java:76-91 (org gate) + 99-120, 122-131 (team gate)"
