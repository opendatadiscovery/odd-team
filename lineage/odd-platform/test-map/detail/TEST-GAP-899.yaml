proposed_action: |-
  Add `DataSourceTokenRegenerateRbacMatrixTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods (one per matrix cell):
  1. `regenerateDataSourceToken_userWithoutPermission_returns403` — authenticate as a LOGIN_FORM user whose Policy does NOT grant DATA_SOURCE_TOKEN_REGENERATE; PUT /api/datasources/{id}/token; assert 403.
  2. `regenerateDataSourceToken_userWithPermission_returns200` — authenticate as a user whose Policy grants DATA_SOURCE_TOKEN_REGENERATE; PUT; assert 200 with a new plaintext token.
  3. `regenerateDataSourceToken_unauthenticated_returns401` — no session cookie; PUT; assert 401.
  4. `regenerateDataSourceToken_underDisabledAuthType_anyCallerSucceeds_pinsCredentialRotationHijack` — a separate @SpringBootTest context with `auth.type=DISABLED`; PUT with NO authentication; assert 200 and the response body carries the new 40-char plaintext token. PIN the bypass.

  Cell #4 PINS the credential-rotation-hijack surface. Pair with DOC-GAP-082 / DOC-GAP-034:
  the docs must warn that a DISABLED deployment exposes token rotation (and all
  token-issuing endpoints) anonymously on the network. When a fix lands (a DISABLED-mode
  hard block on token-issuing endpoints), cell #4 inverts to assert a non-200.
