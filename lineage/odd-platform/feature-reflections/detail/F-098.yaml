# Slack Events Webhook Inbound Integration Security — product-owner reflection

## product_owner_narrative

The Data Collaboration feature lets a catalog user hold a conversation about a
data entity in Slack and have that conversation mirrored onto the entity's
**Discussions** tab inside ODD. The half of that feature this reflection covers
is the **inbound receiver**: `POST /api/slack/events`, the webhook Slack calls
whenever a message is posted in a workspace channel the bot is in. An operator
turns the feature on with `datacollaboration.enabled=true`, supplies a Slack bot
OAuth token, and — following the live deployment docs — pastes
`https://<ODD_PLATFORM_BASE_URL>/api/slack/events` into their Slack app's Event
Subscriptions "request_url" field (per EventApiController:understanding +
WebFetch 2026-06-03 status 200). From the operator's seat this reads as "I have
wired up a private Slack callback." That mental model is the load-bearing
assumption this reflection tests.

A user never types into this endpoint — it is machine-to-machine, called by
Slack's delivery infrastructure, not by a browser form. So there is no UI input
control feeding it (the UI surface of Data Collaboration — the channel-picker
combobox, the "post message" form, the "Open in Slack" button — lives on the
*outbound* `DataCollaborationController` sibling, a different flow, F-038). What
the inbound receiver does have is a **user-visible OUTPUT**: a successfully
accepted event is parsed (`SlackEventParser.parse`), enqueued into the
`message_provider_event` table, and later materialised by a leader-elected
processor thread into a child `message` row that renders on the affected data
entity's Discussions tab (per EventApiController:downstream_side_effects[0,1]).
That output path is where a forged or duplicated inbound event becomes something
a real ODD user sees on a real screen.

The working parts, as a product owner would demo them: the receiver classifies
every inbound payload into one of four cases — a one-shot URL-verification
**challenge** (echo the `challenge` value back so Slack registers the callback),
a **filter**-ack (200 OK with no action, for events ODD does not care about, so
Slack does not retry), an **error** (400, only for a structurally-broken
payload), and a **payload** (a thread-reply `message` event on a thread ODD is
tracking — the only case that writes to the database)
(EventApiController:understanding + implicit_adrs[1,2]). The receiver is
deliberately whitelisted from authentication in every auth mode — it has to be,
because Slack cannot present an ODD login (EventApiController:security.auth_gates).

The integration story crosses two pillars. The receiver is the inbound boundary
of P-10 (Integrations & Ingestion) but its effect lands in P-07's Data
Collaboration / Discussions surface; the sibling outbound half (channel-picker,
post-message form, the Slack-permalink redirect) is the same DataCollaboration
package, and the two share the `message_provider_event` / `message` tables and
the `datacollaboration.*` config namespace
(DataCollaborationController:understanding + concepts).

The edge cases a product owner would flag in a demo are exactly the security
ones the substrate already surfaced and that this reflection re-derives from the
user's seat: there is no proof the caller IS Slack (no signature check), no
protection against the same Slack event being delivered twice (no `(provider,
event_id)` dedup — the schema confirms it, V0_0_59:25-39), and no forensic trail
to tell a forged event from a real one after an incident. The live docs as of
2026-06-03 now disclose the first two of these as "Known limitations" and
recommend reverse-proxy HMAC verification — a material change since the feature
was seeded, and one this reflection reconciles below.

## hypotheses

- id: H-001
  hypothesis: |-
    When an operator configures `/api/slack/events` as their Slack Event
    Subscriptions callback, only Slack can successfully POST events to it — a
    request from any other internet host that does not carry a valid Slack
    signature is rejected (401).
  derivation: |-
    The endpoint name and the docs-published `request_url` promise a "Slack
    callback"; Slack's own protocol mandates the receiver validate
    `X-Slack-Signature` HMAC-SHA256 over `v0:{timestamp}:{body}` using the app
    signing-secret. A "callback for Slack" implies "from Slack".
  seed_source: endpoint-shape + name-behavior (EventApiController name_behavior_pairs[handleSlackEvent])
  validation:
    verdict: contradicted
    actual_behavior: |-
      No signature verification exists anywhere in the codebase. The controller
      method signature binds ONLY `@RequestBody Mono<String>` and reads no
      header — X-Slack-Signature / X-Slack-Request-Timestamp are available on
      the ServerWebExchange but never bound (EventApiController:stress_findings.
      request_inputs — "available-but-unused"). `SlackEventParser.parse(final
      String rawJson)` takes only the body. A grep across the whole repo for
      X-Slack-Signature / signing.secret / signingSecret / verifySignature /
      HMAC.SHA256 returns ZERO matches (re-verified this session against
      src/test; the only references are in the WHITELIST + LoginForm config).
      The endpoint is additionally whitelisted from auth in all four modes
      (H-003). Any internet host that can reach the platform port can POST a
      Slack-shaped JSON and the receiver processes it as genuine.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: bugs_limitations_corner_cases[0]
        cite: "EventApiController.java:22-27 + SlackEventParser.java:22-23"
        note: "raw body only; no header binding; parse() takes only rawJson"
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: stress_findings.request_inputs
        cite: "EventApiController.java:22-25 (no @RequestHeader, no ServerWebExchange parameter)"
        note: "the Slack signature headers are available-but-unused — the canonical fix anchor"
      - source_read_for_validation: true
        cite: "grep X-Slack-Signature|signing.secret|signingSecret|verifySignature|HmacSha256|HMAC across odd-platform/**/src/test/** — 3 files match only as KNOWN-BUG PIN docstrings (DataCollabEventDedupKnownBugTest, SecurityRulesAuthzGapsKnownBugsTest, AdrContractScanTest), none implement verification"
        note: "confirms no verification implementation AND no behavioral test of forgery rejection"
    operator_visible_failure: |-
      The obvious failure: an operator who pastes the request_url into Slack
      believes they have a private callback, but they have published an
      unauthenticated write endpoint to the public internet — any host that can
      reach the port can forge events. The subtle failure: a forged thread-reply
      whose `thread_ts` matches a tracked ODD message's `provider_message_id`
      is enqueued and materialised into a child `message` row that renders
      attacker-controlled text + author on a real data entity's Discussions tab
      (EventApiController:security.data_exposure[1]) — forged content reaches a
      real ODD user's screen. There is no audit column to distinguish the
      forgery afterward (H-009).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    sme_consultation_recommended: false

- id: H-002
  hypothesis: |-
    When Slack sends the one-shot URL-verification challenge during callback
    setup, the platform echoes back the `challenge` value with 200 OK so the
    subscription registers successfully.
  derivation: |-
    Slack's documented URL-verification handshake is the only contract by which
    a callback registers; the receiver MUST echo the challenge. A product owner
    expects "setup just works" when the operator clicks Verify in Slack.
  seed_source: view-mode (the CHALLENGE branch) + doc-claim
  validation:
    verdict: confirmed
    actual_behavior: |-
      The CHALLENGE branch returns 200 with body `{"challenge":"<echoed-value>"}`
      via the SlackEventResponse record's single `challenge` field — matching
      Slack's url_verification contract exactly
      (EventApiController:stress_findings.name_behavior_pairs[SlackEventResponse]
      drift: NONE). This is the happy-path that makes setup work.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: stress_findings.name_behavior_pairs
        cite: "EventApiController.java:44-56 + EventApiController.java:29"
        note: "challengeResponse returns 200 + {challenge}; CHALLENGE branch at line 29"
    operator_visible_failure: |-
      None for the happy path. NOTE the coupled risk surfaced as H-010: the same
      echo, because it is unsigned (H-001), doubles as an endpoint-existence
      oracle for any unauthenticated caller.
    severity: LOW
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional
    note: |-
      The EventApiController sidecar flags this exact behaviour as the
      CRITICAL-criticality uncovered integration test: "If this regresses, Slack
      rejects the event subscription and the entire data-collaboration
      thread-reply ingest is silently dead." A confirmed happy-path promise with
      NO test guarding it (covered_behaviours: []) — the canonical LSN-030 case.

- id: H-003
  hypothesis: |-
    When the operator picks a real authentication mode (LOGIN_FORM / OAUTH2 /
    LDAP), the Slack events endpoint is protected by that auth like the rest of
    the platform API — an anonymous caller is rejected.
  derivation: |-
    A product owner reasoning from "the platform has auth modes" expects every
    write endpoint to sit behind the chosen mode. P-09's mission states auth
    gates every mutation.
  seed_source: pillar (P-09 primary user action "pick a UI auth mode") + cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      `/api/slack/events` is in SecurityConstants.WHITELIST_PATHS (line 95-96),
      consumed by AuthorizationCustomizer (OAUTH2 + LDAP, line 22-23) and listed
      in LoginFormSecurityConfiguration.permittedPaths (line 49-51); DISABLED
      permits everything anyway. The endpoint accepts unauthenticated POSTs in
      ALL FOUR modes (EventApiController:stress_findings.auth_gates). This is
      structurally INTENDED (Slack cannot authenticate as an ODD user), but the
      compensating control the whitelist presumes — a signature check — does not
      exist (H-001), so "whitelisted" here means "wide open", not "open-but-
      signature-gated".
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: security.known_security_gaps[1]
        cite: "SecurityConstants.java:95-96 + AuthorizationCustomizer.java:22-23 + LoginFormSecurityConfiguration.java:49-51 + DisabledAuthSecurityConfiguration.java:13-17"
        note: "all four modes whitelist the path"
      - source_read_for_validation: true
        cite: "SecurityRulesAuthzGapsKnownBugsTest.java:48-55 (slackEventsWebhookIsAuthWhitelisted_knownBug_PLT054) asserts the path IS in WHITELIST_PATHS"
        note: "a GREEN characterization pin proving the whitelist is present — guards the bug, not the user promise"
    operator_visible_failure: |-
      The operator selects OAUTH2 expecting a uniformly-protected API, but one
      write endpoint is anonymously reachable regardless. Combined with the
      missing signature check (H-001), enabling Data Collaboration in any mode
      publishes an unauthenticated write path. Under DISABLED, the
      `datacollaboration.enabled` flag is the ONLY thing standing between the
      network and the receiver.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |-
    When the same Slack event is delivered twice (Slack's at-least-once retry),
    the platform recognises it as a duplicate and the affected Discussions tab
    shows the message exactly once.
  derivation: |-
    Slack documents at-least-once delivery; a product owner expects exactly-once
    user-visible results (a message appearing twice in a thread is a visible
    defect). Exactly-once-display is the implicit promise of any webhook
    consumer.
  seed_source: negative-space + response-shape (the Discussions-tab output)
  validation:
    verdict: contradicted
    actual_behavior: |-
      The `message_provider_event` table has NO unique constraint on `(provider,
      event_id)` and no `event_id` column at all — only a BIGSERIAL PK and a
      parent-message FK (V0_0_59:25-39, re-read this session). The INSERT issues
      no `ON CONFLICT` (ReactiveMessageRepositoryImpl.java:136-155). A duplicated
      delivery inserts N rows; the processor materialises N child `message` rows
      with N distinct uuids but the same `provider_message_id`; downstream
      `getUUIDByProviderInfo` (line 188-195) has no LIMIT 1 and returns an
      arbitrary uuid under multi-row. Operator-observable: the same message
      appears multiple times on the Discussions tab.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: bugs_limitations_corner_cases[2]
        cite: "ReactiveMessageRepositoryImpl.java:136-155 + V0_0_59__data_collaboration.sql:25-39 + ReactiveMessageRepositoryImpl.java:188-195"
        note: "no UNIQUE, no ON CONFLICT, no LIMIT 1"
      - source_read_for_validation: true
        cite: "V0_0_59__data_collaboration.sql:25-39 (message_provider_event: id BIGSERIAL PK + parent FK only; no event_id; no UNIQUE)"
        note: "schema confirms the absence directly"
      - source_read_for_validation: true
        cite: "DataCollabEventDedupKnownBugTest.java:37-54 (messageProviderEventHasNoDedupConstraint_knownBug_PLT054) asserts the SQL doesNotContain UNIQUE / event_id / ON CONFLICT"
        note: "GREEN characterization pin proving the bug is present (schema-level); NOT a behavioral duplicate-delivery test"
    operator_visible_failure: |-
      A real Slack message double-delivered under load shows up twice (or N times)
      on the entity's Discussions tab — users reading the discussion see a
      duplicated conversation. Worse with H-001: an attacker who captures one
      genuine event payload can replay it N times to flood the thread, and there
      is no event_id to dedup on. The arbitrary-uuid return from
      getUUIDByProviderInfo can also mis-target a subsequent message_changed
      UPDATE.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    When a thread-reply `message` event arrives for a thread that ODD is NOT
    tracking (no parent `message` row whose `provider_message_id` equals the
    event's `thread_ts`), the platform ignores it and writes nothing.
  derivation: |-
    A product owner expects ODD to mirror only the conversations it started, not
    every message in every channel the bot can read (the bot holds
    `channels:history`). Scoping the mirror to tracked threads is the privacy-
    sane default.
  seed_source: view-mode (FILTER / switchIfEmpty) + negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      Two-stage filter: (1) parser-level — a message event with `thread_ts ==
      null` is FILTERed and 200-acked, never enqueued; (2) service-level —
      `SlackMessageProviderEventHandler` does `switchIfEmpty(Mono.empty())` when
      the thread_ts does not map to a tracked parent message, and the controller
      still ack-200s (EventApiController:implicit_adrs[2] + requires-runtime).
      So a reply on an untracked thread writes nothing.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: implicit_adrs[2]
        cite: "SlackEventParser.java:65-74, 86-95 + SlackMessageProviderEventHandler.java:31-35"
        note: "two-stage thread_ts filter; untracked thread → Mono.empty, ack 200"
    operator_visible_failure: |-
      None for the happy case — the scoping behaves as a user expects. The
      caveat (not a failure): the structural thread_ts match is the ONLY gate,
      and it is not an authorization gate — a forged event (H-001) whose
      thread_ts is guessed/observed to match a tracked thread passes this filter
      and DOES write. So the filter scopes honest traffic correctly but provides
      no defence against forgery.
    severity: LOW
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: |-
    When Slack sends an event type ODD does not handle (anything other than a
    `message.channels` thread reply), the platform acknowledges it with 200 and
    does not error — so Slack does not enter a retry storm.
  derivation: |-
    Slack retries on non-2xx. A product owner expects unhandled events to be
    silently accepted, not to trigger repeated redelivery that loads the
    endpoint.
  seed_source: view-mode (FILTER branch) + negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      Every unknown / unsupported outer or inner event type routes to
      ParseResultType.FILTER, which the controller acks with 200; only a
      structurally-broken `event_callback` with a null inner event returns 400
      (EventApiController:implicit_adrs[1]). The ack-200-on-filter is the
      explicit choice to avoid Slack-side retry storms.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: implicit_adrs[1]
        cite: "EventApiController.java:30-37 + SlackEventParser.java:38-43, 56-60, 107-110"
        note: "unknown types → FILTER → 200; only null-inner-event → 400"
    operator_visible_failure: |-
      None for the retry-avoidance intent. Coupled caveat (surfaced separately as
      a LOW substrate finding): an operator who subscribes additional Slack
      event types in the Slack UI sees them silently dropped at log.debug with
      no DLQ / metric / operator-visible signal — correct for retry-avoidance,
      surprising for observability.
    severity: LOW
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: |-
    When a caller sends a malformed JSON body (or a payload where `event` is a
    string/number rather than an object), the platform returns a clean 4xx
    rather than a 5xx server error.
  derivation: |-
    A product owner expects bad input to produce a client-error, not to look
    like the server broke (5xx invites Slack retry per H-006's contract, and a
    5xx on garbage input is a robustness smell).
  seed_source: negative-space + endpoint-shape (the raw-body input)
  validation:
    verdict: probe-needed
    actual_behavior: |-
      `JSONSerDeUtils.deserializeJson` is called inside `.map(slackEventParser::
      parse)` with no try/catch (SlackEventParser.java:23); an IOException-class
      failure propagates as a reactive error and the response shape is
      determined by the global Spring WebFlux error handler — untested. Likewise
      the unchecked `(Map<String,Object>) requestMap.get("event")` cast
      (SlackEventParser.java:45) throws ClassCastException on a non-object
      `event`. Whether the global handler renders 400 or 500 cannot be
      determined from the sidecars; it requires running the endpoint.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: bugs_limitations_corner_cases[5]
        cite: "SlackEventParser.java:22-23 (no try/catch on deserializeJson) + SlackEventParser.java:45 (unchecked cast)"
        note: "response shape depends on the global reactive error handler — untested"
    operator_visible_failure: |-
      If the global handler renders 5xx, Slack interprets it as "retry this
      event" (per H-006's contract) and the malformed payload is redelivered,
      compounding load — and a forged malformed payload (H-001) becomes a cheap
      way to trigger repeated server-error processing. Confirm the actual status.
    severity: MEDIUM
    confidence: LOW
    probe_id: PENDING-F-098-1
    routes_to_finding: validation-gap
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-098-1"

- id: H-008
  hypothesis: |-
    When an attacker floods `/api/slack/events` with forged events, the platform
    bounds the damage — a request-body size cap and/or a rate limit prevents the
    `message_provider_event` JSONB column from being filled without limit.
  derivation: |-
    A product owner running an internet-facing endpoint expects basic DoS
    hygiene (body-size cap, rate limit) on an unauthenticated surface.
  seed_source: negative-space + pillar (operator-facing robustness)
  validation:
    verdict: probe-needed
    actual_behavior: |-
      No request-body size limit is applied at the controller level (only Spring
      WebFlux defaults govern; a large JSON is read into memory by
      `@RequestBody Mono<String>` before dispatch); no rate-limit / interceptor /
      filter exists on the path (EventApiController:performance.
      known_performance_gaps). The JSONB `event` column stores the full payload
      with no size cap (V0_0_59:32). The static facts are clear; the realised
      backlog-growth rate and the processor-backlog behaviour under sustained
      forged-event volume require a load probe to quantify.
    evidence:
      - sidecar: odd-platform__java__EventApiController__controller-class__EventApiController.md
        section: performance.known_performance_gaps
        cite: "EventApiController.java:23-24 (no DataBuffer size cap) + V0_0_59__data_collaboration.sql:32 (unbounded JSONB)"
        note: "no body cap, no rate limit, unbounded JSONB"
    operator_visible_failure: |-
      An attacker fills the partitioned `message_provider_event` table at attacker
      rate; the single-leader processor backlog grows (adding controller
      instances does not add processing throughput — the processor holds
      advisory-lock 110); legitimate Slack events queue behind the flood and the
      Discussions tab stops updating in near-real-time. Quantify the fill rate
      and backlog growth.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-098-2
    routes_to_finding: validation-gap
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: "probe PENDING-F-098-2"

- id: H-009
  hypothesis: |-
    After a suspected forged-event incident, an operator can tell which
