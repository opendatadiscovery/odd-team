- pillar_id: P-09
  kind: shares_data_with
  via: |-
    Cross-owner read posture — the four GET endpoints in this controller
    (the lone runs-history endpoint AND its three sibling reads on
    DataQualityController) have NO entry in SecurityConstants.SECURITY_RULES;
    they fall through to `pathMatchers("/**").authenticated()`. Any
    authenticated user reads any DQ test's run history including
    status_reason diagnostic text (which commonly contains failed-row
    samples populated by the test framework — Great Expectations emits
    sample failing values; dbt emits table/column names). The status_reason
