- id: H-004
  hypothesis: "When a Term is linked to more than 50 dataset fields, the user can reach the columns past 50 by scrolling (the InfiniteScroll loads the next page)."
  derivation: "UI label / endpoint shape — the component wraps results in an InfiniteScroll and the backend takes page/size; a user with a heavily-linked term (PII, Revenue) expects to reach every linked column. Negative-space: the governance audit case."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The user CANNOT reach columns past 50, and gets no signal that they exist.
      Two independent blocks compound: (1) The InfiniteScroll `next` callback is a
      literal noop — `next={() => {}}` (LinkedColumnsList.tsx:77); the hook is a
      single-page `useQuery` fixed at `page:1, size:50` (terms.ts + LinkedColumnsList.tsx:16,27)
      with no `fetchNextPage`. (2) Even the noop would never be reached, because the
      InfiniteScroll's `hasMore={pageInfo.hasNext}` (LinkedColumnsList.tsx:78) is driven
      by a backend value that is HARD-CODED false: `DatasetFieldListMapperImpl.pageInfo`
      returns `new PageInfo(total, false)` (line 48). react-infinite-scroll-component
      does not invoke `next` when `hasMore` is false, so the scroll trigger never fires.
      Net: silent truncation at 50 rows with ZERO "more available" affordance.
    evidence:
      - sidecar: "(source read)"
        section: LinkedColumnsList
        cite: "LinkedColumnsList.tsx:74-82"
        note: "next={() => {}} + hasMore={pageInfo.hasNext}; single-page hook"
      - sidecar: "(source read)"
        section: DatasetFieldListMapperImpl
        cite: "DatasetFieldListMapperImpl.java:47-49"
        note: "pageInfo(total) => new PageInfo(total, false) — hasNext ALWAYS false"
      - sidecar: "feature-flows/detail/F-153.yaml"
        section: "observed_vs_expected.facet"
        cite: "F-153.yaml:62-89"
        note: "feature-flow facet ui_pagination_silently_broken_via_noop_callback (HIGH)"
    operator_visible_failure: |
      (1) GOVERNANCE MISS — a steward auditing "every column linked to PII" on a term
      with 200 linked fields sees 50 and believes that is the complete set; 150
      sensitive columns are invisible. This is the documented use case for the tab
      (business-glossary.md:181 names exactly this PII scenario). (2) NO AFFORDANCE —
      unlike a normal broken infinite-scroll that at least shows a spinner, here
      hasNext=false means the UI shows no "loading more" indicator at all, so there is
      not even a visual cue that more data exists. (3) The feature-flow facet's own
      text is itself WRONG on one point — it says "the UI PROMISES more pages" via
      hasMore; in reality hasNext is always false so the UI promises NOTHING; the
      truth (no affordance) is arguably worse than a false promise because the user
      has no reason to suspect truncation. Workaround exists only via the raw API
      with explicit page/size (business-glossary.md:181).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    source_read_for_validation: true
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

