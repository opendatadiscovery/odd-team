mitigations_unimplemented:
- |-
  Add `AND policy.deleted_at IS NULL` to the LEFT JOIN's ON-clause in
  EACH of the three custom Role methods:
    Site 1 — ReactiveRoleRepositoryImpl.java:45-48 (getDto)
    Site 2 — ReactiveRoleRepositoryImpl.java:67-70 (listDto)
    Site 3 — ReactiveRoleRepositoryImpl.java:87-90 (getByName)
  AND apply the same fix to the batch-H Policy-side mirror at
  ReactivePolicyRepositoryImpl.java:32-35 (getRolesPolicies).
  The bug is symmetric; the fix is symmetric.
- |-
  Add a build-time invariant scanner that flags any LEFT JOIN against
  the POLICY table that lacks a `policy.deleted_at IS NULL` predicate.
  The bug class repeats every time a new RBAC read surface is added.
- |-
  Add a Role-side defence symmetric to PolicyServiceImpl.delete: when
  reading a Role's policies via getDto/listDto/getByName, log a warning
  if any aggregated PolicyPojo has non-null deleted_at — operators
  auditing the system would see the warning even if the fix above
  hasn't landed.
- |-
  Add a regression test pinning the current behaviour:
    (a) Create a Policy, soft-delete it (UPDATE policy SET deleted_at = NOW());
    (b) Create a Role bound to the soft-deleted Policy via role_to_policy;
    (c) Call getByName(role.name) — assert the policy_relations array
        INCLUDES the soft-deleted policy (current — buggy — behaviour
        as regression baseline) OR EXCLUDES it (under the fix).
- |-
  Document the soft-delete-persistence behaviour on the Roles operator
  page until the fix lands — operators need to know that a soft-deleted
  Policy may still confer permissions transitively if a Role still binds
  it; the cascade-delete defence on PolicyServiceImpl.delete is the
  only barrier and is bypassable.
- |-
  **NEW batch Q — UI-side mitigations**:
  (a) On RolesList's chip list, render soft-deleted Policy names with
      a 'deleted' badge (strike-through + tooltip "This policy is
      soft-deleted; bindings should be removed via the Roles tab")
      so operators can visually distinguish.
  (b) On PolicyList, optionally render an "Include deleted" toggle to
      reveal soft-deleted policies — operators auditing 'why is X
      still granting' can confirm the soft-deleted policy exists.
  (c) On the Policy delete confirmation dialog, surface the
      cascade-check defence outcome: "This policy is bound to N roles;
      deleting will fail until you unbind from the Roles tab" — even
      if the backend rejects, the UI surfaces the operator-decisive
      information upfront.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-19N. The bug
  shape is the SYMMETRIC MIRROR of the batch-H ReactivePolicyRepositoryImpl
  finding. Both repositories (Role + Policy) exhibit the same shape of
  forensic-silent drift; both rely on the absent application-tier
  defence to compensate for the missing repository-tier filter; both
  are bypassable.

  The two-sidecar architectural-mirror is the diagnostic — the batch-H
  finding was a one-shot observation on the Policy side; batch N
  confirms the SAME bug class on the Role side. **Batch Q strengthens
  with the UI manifestation** — operators using the UI see the bug
  visually (RolesList chip array) OR are misled into thinking it's
  fixed (PolicyList list view). The 4-evidence-point invariant spans
  SQL layer (2 repos) + UI layer (2 components).

  Together they show that the platform's RBAC mutation surface is
  INCONSISTENTLY soft-delete-aware at the persistence layer (soft-delete
  column writes correctly; soft-delete filter at READ time is missing
  on the AGGREGATION JOINS).

  Cross-cutting connections:
    - Pairs with ReactivePolicyRepositoryImpl batch-H finding (same
      bug class, inverse direction)
    - Pairs with three-soft-delete-mechanisms-across-the-repository-layer
      — the architectural-mechanism map; this invariant is a specific
      instance of the broader inconsistency
    - Cross-references no-audit-log-on-rbac-mutations — the missing
      audit means the soft-delete event itself is forensically
      invisible, compounding the read-path bug
    - Cross-references resolve-roles-to-policies (the per-request
      authorization hot-path operation) — getByName's role-resolution
      path is on the AUTHORIZATION HOT PATH
    - **NEW batch Q** — Cross-references
      `manage-management-catalogue-list-with-debounced-search-and-infinite-scroll-permission-gated-mutations`
      (the operation that hosts the PolicyList + RolesList UIs that
      manifest this bug visually)

  Three DOC-NNN candidates flow from this invariant (UPDATED batch Q):
    (a) Add the deleted_at filter at all FOUR sites (3 in Role-repo,
        1 in Policy-repo) — same PR fixes both directions
    (b) Document the cascade-delete defence (PolicyServiceImpl.delete +
        isPolicyAttachedToRole) on the operator-facing Policies page
        with a caveat about the read-side gap
    (c) **NEW batch Q** — Document the catalogue-vs-grant asymmetry on
        both the Policies and Roles operator-facing live doc pages —
        "A policy soft-deleted via the Policies tab continues to grant
        permissions to users in any role still bound to it, until the
        role's policy binding is removed via the Roles tab. The Roles
        tab chip list MAY display soft-deleted policy names without
        visual differentiation."
