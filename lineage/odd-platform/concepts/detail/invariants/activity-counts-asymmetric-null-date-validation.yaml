mitigations_unimplemented:
- |-
  Apply the same null-date validation to getActivityCounts —
  add `if (beginDate == null || endDate == null) { return Mono.error(...); }`
  at ActivityServiceImpl.java:138-141. Consistent with getActivityList
  and getDataEntityActivityList. Run P-023 first to confirm the actual
  failure mode under load (and observe HTTP code emitted).
- |-
  Update OpenAPI spec: mark begin_date + end_date `required: true`
  on both `/api/activity` AND `/api/activity/counts`. Generated
  TypeScript / Java client SDKs will enforce the requirement at
  call sites; bring all callers into compliance.
- |-
  Add a regression test
  `ActivityServiceImplTest.testGetActivityCounts_NullDates_RejectedWith400`
  that mirrors the existing test for getActivityList (if any).
- |-
  Add a metric `activity_counts_unbounded_query_total` that increments
  whenever getActivityCounts is called with null begin_date OR null
  end_date — operators can detect existing bad callers in production
  before applying the validation fix.
- |-
  Document the asymmetry on the activity-feed feature page (until
  fixed):
    "The /api/activity/counts endpoint accepts queries without a
    date range, but doing so triggers a full-history aggregation
    against the activity table — an O(n) query in the table size.
    Operators should always supply begin_date AND end_date when
    calling the counts endpoint."
notes: |-
  NEW invariant captured in batch VAL-LSN-019-B. Surfaced by primary-source
  examination of ActivityServiceImpl line-by-line; cross-referenced
  against the existing ReactiveActivityRepositoryImpl
  getCommonConditions findings.

  This is a SIMPLE-TO-FIX invariant — the asymmetry is a 3-line code
  change at ActivityServiceImpl.java:138-141 + a spec change. The
  cost of the validation is zero (the validation passes by default
  for all current UI callers). The benefit is removing a performance
  cliff that materialises only for operators stepping outside the
  UI's default-date constructor.

  Cross-cutting connections:
    - Pairs with `retention-claim-vs-code-drift-refactor-085-confirmed-from-two-angles`
      — both findings concern the unbounded-growth shape of the
      activity table; this finding adds "the counts endpoint
      doesn't bound the query" as a SECOND surface where the growth
      becomes operationally painful
    - Pairs with `pagination-parameters-declared-but-unconstrained-at-spec-and-controller-layers`
      — both are "OpenAPI spec doesn't bound; code doesn't bound;
      operator pays at scale"
    - Cross-references the existing AlertController pattern (where
      `getAllAlerts` accepts unbounded date ranges with no validation)
      — the SHAPE is platform-wide; this finding is a specific
      instance

  PRIMARY-SOURCE confidence: HIGH (line citations to
  ActivityServiceImpl.java:98-100, 128-130, 138-166; cross-referenced
  with repository's getCommonConditions sidecar finding).
