behaviour: |-
  **MEDIUM — R2DBC database credentials enter the JVM as plaintext `@Value`-injected fields and are reachable via `/actuator/env`, which is exposed by default per application.yml:230-231. Spring's default masking covers `password|secret|key|token` substring matches in the property KEY name — but the masking is a convention, not a structural guarantee, and is not asserted by any test in the ODD codebase.**

  **Confirmed at primary source**:
  - R2DBCConfiguration.java:35 — `DataSourceProperties.getPassword()` reads `spring.datasource.password` (default `odd-platform-password` per application.yml:7).
  - R2DBCConfiguration.java:58 — `@Value("${spring.custom-datasource.password:}")` reads `spring.custom-datasource.password` (empty default with fallback to primary).
  - application.yml:230-231 — `management.endpoints.web.exposure.include: health, prometheus, env, info` exposes the env endpoint by default.
  - application.yml:237 — `management.endpoint.env.enabled: true` (implicit default).
  - Spring Boot 3.4+ default `management.endpoint.env.show-values=NEVER` — but the KEY name `password` is the only thing matched; rename to `spring.datasource.dbpass` and the masking BREAKS (as a hypothetical refactor).

  **Test gap shape**: integration test booting the platform with default actuator config + a custom non-default datasource password, then `WebTestClient.get("/actuator/env")`, then:
  1. Assert the response is HTTP 200 (env is exposed).
  2. Search for the literal password value in the response body — assert NOT FOUND (Spring's default masking IS working).
  3. Confirm the masking-by-substring rule: rename to a key NOT matching `password|secret|key|token` and confirm THAT renamed key would expose the value (documenting the convention boundary).

  PINS the current actuator-default-on + Spring-masking behaviour. A future change to either default trips the test and forces explicit policy decision.
