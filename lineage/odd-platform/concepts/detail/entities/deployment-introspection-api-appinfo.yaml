- |-
  AppInfoController@L18.md:concepts.entities + concepts.operations + concepts.invariants
- |-
  AppInfoController@L18.md:implicit_adrs.[0,1] (deliberate published-contract field
  for SPA + reporter-not-reactor pattern via @Value vs @ConditionalOnProperty)
- |-
  AppInfoController (class).md:implicit_adrs.[0] (AppInfo response intentionally
  exposes the active auth mode to clients — the SPA's `Overview.tsx:25-27` gates
