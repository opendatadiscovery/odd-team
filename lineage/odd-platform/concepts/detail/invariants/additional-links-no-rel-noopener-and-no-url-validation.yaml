name: Additional Links — no rel='noopener noreferrer' AND no URL scheme validation
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
  - P-09
description: |-
  NEW INVARIANT, batch ZE — TWO composed weaknesses on the
  operator-configured `odd.links` catalogue:

  (a) UI rendering at AppInfoMenu.tsx:60-66 sets
      `target='_blank'` but does NOT set
      `rel='noopener noreferrer'`. Any operator-configured URL can
      use `window.opener` from the opened tab to navigate the
      parent ODD Platform tab to a phishing page (reverse
      tab-nabbing).

  (b) Backend at AdditionalLinkProperties.java:8 does NOT validate
      URL scheme — operator-supplied `javascript:alert(1)`,
      `data:text/html,<script>...`, or `vbscript:...` URLs are
      passed unsanitised through LinksController.java:31-33
      (passthrough stream/map). React 17+ neutralises
      `javascript:` in <a href> at runtime, but `data:text/html`
      is admissible in many browsers and `vbscript:` is admissible
      in IE-style legacy contexts.

  THREAT MODEL — the operator-trust model assumes only the
  operator edits odd.links. In a deployment where the operator
  role is restricted (e.g. shared infrastructure team grants
  config-edit permission to ODD-application owners), a
  less-trusted role could weaponise (a) for tab-hijacking +
  weaponise (b) for cross-site-scripting style payload delivery.
  The combination is a phishing-vector amplifier rather than a
  direct exploit; severity bounded by who controls operator
  config.

  Doc drift — the live
  configuration-and-deployment/odd-platform page says
  'opening in a new tab' (matches the target='_blank') and
  'absolute URL' (matches the schema-omitted validation), but
  silently assumes operators only set http(s) URLs and never
  warns about the reverse-tabnabbing or URL-scheme vectors.

  FIX ANCHORS:
    (a) UI fix: AppInfoMenu.tsx:61 add `rel='noopener noreferrer'`
        to the `<a target='_blank'>` element;
    (b) Backend fix: add `@URL` or `@Pattern("^https?://")` to
        AdditionalLinkProperties.Link.url field; OR validate at
        @PostConstruct in AdditionalLinkConfiguration.

  Severity: MEDIUM (operator-trust amplifier; bounded by who
  controls operator config).
