proposed_action: |-
  Add `EmailNotificationSenderPayloadDocPromiseRegressionPinTest`. Unit test stubbing `JavaMailSender.send(...)` to capture the `MimeMessage`:

  1. `rendered_emailBody_doesNotContainOwnersBlock_pinsDocOverpromise` —
     - Build an `AlertNotificationMessage` with `dataEntity.owners=[{title:"Owner", name:"alice@example.com"}, {title:"Steward", name:"bob@example.com"}]`.
     - Stub `JavaMailSender.send(...)` to capture the MimeMessage.
     - Invoke `emailSender.send(message)`.
     - Extract the rendered HTML body.
     - Assert the body does NOT contain "alice@example.com" or "bob@example.com" or "Owner" or "Steward".
     - PINS the current owners-missing state.

  2. `rendered_emailBody_doesNotContainDownstreamBlock_pinsDocOverpromise` —
     - Build a message with `downstream=[{name:"orders_summary", dataSourceName:"prod-dwh"}]`.
     - Assert the body does NOT contain "orders_summary" or "prod-dwh" (from downstream).
     - PINS the current downstream-missing state.

  3. `rendered_emailBody_containsOwnersBlock_confirmsFixDirection` — (UPDATE once REFACTOR-NNN extends the template)
     - After REFACTOR-NNN: assert the body DOES contain the owner names.
     - CONFIRMS the fix's effectiveness.

  4. `rendered_emailBody_containsDownstreamBlock_confirmsFixDirection` — (UPDATE once REFACTOR-NNN extends the template)
     - After REFACTOR-NNN: assert the body DOES contain the downstream entity names.

  Pair with REFACTOR-NNN (template extension) OR DOC-GAP-NNN (live doc correction) — the maintainer must choose which side of the drift to align.

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP pins the doc-overpromise on the email channel specifically. TEST-GAP-461 is the sister at the cross-channel level (PII pass-through). No contradiction with any existing artefact.
