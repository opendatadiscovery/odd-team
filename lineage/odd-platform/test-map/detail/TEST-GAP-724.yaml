behaviour: |-
  **HIGH — V0_0_91's `term_to_term.deleted_at` column is a DEAD schema artefact: declared in migration, never written to by code, never filtered on read — confirming a missed migration NOT an intentional soft-delete.** Triangulated across all three batch-U Term-side sidecars + verified against the platform's primary source 2026-05-20:

  **Schema declaration**: `odd-platform-api/src/main/resources/db/migration/V0_0_91__add_term_to_term.sql:6` declares `deleted_at TIMESTAMP WITHOUT TIME ZONE` on the `term_to_term` table (verified by reading the migration file end-to-end). This pattern would suggest soft-delete intent.

  **Schema asymmetry — primary-source evidence the column is DEAD**: migration `V0_0_76__term_relations_hard_delete.sql:5-22` had already established the OPPOSITE pattern: it DROPPED `deleted_at` from `data_entity_to_term`, `tag_to_term`, and `term_ownership` and converted those tables to hard-delete-only semantics. V0_0_91 reverted that pattern WITHOUT JUSTIFICATION (no Javadoc / comment / commit-message context in the migration file).

  **Live-code evidence the column is DEAD**:
  - `TermRelationsRepositoryImpl.deleteTermToTermRelations` (line 204-219) calls `DSL.delete(TERM_TO_TERM)` — a hard DELETE
  - `deleteTermToLinkedTermRelation` (line 222-230) calls `DSL.deleteFrom(TERM_TO_TERM)` — also a hard DELETE
  - **No code path sets `TERM_TO_TERM.DELETED_AT`** (`grep -rn 'TERM_TO_TERM\.DELETED_AT' ../odd-platform/odd-platform-api/src/main/java` returns ZERO matches, per the sidecar's primary-source claim)
  - **No read path filters on it** (per the F-002 batch-N sidecar's 7-site enumeration of unfiltered reads — that batch surfaced the OPPOSITE interpretation: "the 7 read sites skip the filter, that's the bug"; this sidecar's primary-source clarification flips the interpretation to "the column is dead, the migration was incomplete")

  **Why HIGH not MEDIUM**: this is a PRIMARY-SOURCE SUPERSEDE on the batch-N interpretation. TEST-GAP-538 (existing, LOW criticality) frames the issue as "read sites should filter `deleted_at IS NULL` — pin the buggy current behaviour". This sidecar's clarification — confirmed via the V0_0_76-vs-V0_0_91 migration history — reveals the truth: the COLUMN ITSELF should be dropped. Pinning the current "bug" via TEST-GAP-538 would lock in a misinterpretation. The maintainer fix is: (a) a cleanup migration `ALTER TABLE term_to_term DROP COLUMN IF EXISTS deleted_at`, (b) a defensive schema-shape regression test that fails if a future maintainer reintroduces a `deleted_at` column on `term_to_term` without ALSO wiring code that USES it.

  **Compound gap with the term-itself-delete cascade**: `TermServiceImpl.delete` (`TermServiceImpl.java:154-165`) cascades to `data_entity_to_term` (line 162) and `dataset_field_to_term` (line 163), then soft-deletes the term — but does NOT call any `termRelationsRepository.deleteRelationsWithTerm(termId)` for `term_to_term`. So even with the dead `deleted_at` column dropped, dangling `term_to_term` rows pointing at soft-deleted terms persist indefinitely. The read paths `JOIN term` and filter on `term.deleted_at IS NULL` so the orphans are EFFECTIVELY HIDDEN from API responses — but the rows accumulate in the DB. A future maintainer adding direct `term_to_term` queries that bypass the JOIN would surface the orphans.

  **Test gap shape**: regression-pin asserting (a) `term_to_term` schema does NOT carry a `deleted_at` column (post-fix); (b) `TermServiceImpl.delete(termId)` results in zero `term_to_term` rows referencing the deleted term (cascading cleanup); (c) the 7 read sites from batch-N do NOT filter `term_to_term.deleted_at IS NULL` because there is no such column to filter on (post-fix). Pre-fix, this gap pins the CURRENT state via a schema-shape assertion + a cascade-cleanup-missing assertion as the canary for any maintainer reading this evidence.
