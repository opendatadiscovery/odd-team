- id: H-004
  hypothesis: |-
    When a data entity is classified with multiple classes (e.g. an ML model
    that is both an ENTITY_GROUP and a TRANSFORMER), the header renders all of
    its class badges in a way the operator can read without the badges
    overflowing or crowding out the entity name.
  derivation: |-
    Endpoint/response-shape seed — entityClasses is an unbounded array.
    Product-owner UX seed: "How does it behave across device types?" The data
    model permits multi-class entities (per the feature description).
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The class row is `<Grid container item lg={7} alignItems='center'
      flexWrap='nowrap'>` (DataEntityDetailsHeader.tsx:75) and the iteration
      `entityClasses?.map(...)` (lines 79-85) is unbounded — no max-N, no "+N
      more", no overflow collapse. Because the SAME lg={7} cell also holds the
      entity name `<Typography variant='h0' noWrap>` (line 76) and the
      business-name Edit/Add button (lines 87-101), a 3-4+ class entity pushes
      badges past the cell's horizontal allocation with `nowrap`, and the
      noWrap entity name is compressed. This compounds on narrow / mobile
      viewports where lg={7} has less absolute width to spend.
    evidence:
      - sidecar: "(source_read_for_validation)"
        section: layout
        cite: "DataEntityDetailsHeader.tsx:74-85"
        note: "flexWrap='nowrap' + unbounded map + name & button sharing the lg=7 cell"
    operator_visible_failure: |-
      (a) A multi-class entity's badges overflow horizontally with no wrap and
      no collapse — later badges can be clipped/pushed out of view. (b) The
      entity's own name (noWrap) gets compressed by the badge row in the same
      cell. (c) On mobile/narrow desktop the effect is worse. Multi-class
      entities are uncommon but reachable (e.g. ENTITY_GROUP + TRANSFORMER ML
      models). This is scanner finding F-177c, confirmed at primary source.
    severity: MEDIUM
    confidence: MEDIUM
    confidence_note: |-
      Static layout reasoning is HIGH-confidence; the visual SEVERITY (does it
      clip, does it scroll, how bad on mobile) needs a live multi-class render
      to grade — see probe PENDING-F-177-1 for the empirical pin.
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    source_read_for_validation: true

