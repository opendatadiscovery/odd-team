behaviour: 'Lineage-variant single-point-of-failure — getMyObjectsWithUpstream/Downstream
  rely on anchor-set correctness; NO JOIN-side owner filter on the response set. A
  regression in fetchAssociatedOwner() leaks lineage neighbours. STRENGTHENED batch
  I — the LineageServiceImpl sidecar is the NEGATIVE-CASE PRIMARY SOURCE: `LineageServiceImpl`
  has no `AuthIdentityProvider` field, no `fetchAssociatedOwner` call, no owner check
  anywhere in getLineage or getDataEntityGroupLineage. `DataEntityRelationsServiceImpl.getDependentDataEntityOddrns`
  IS the positive-case sibling — it calls `fetchAssociatedOwner()` BEFORE the same
  repository. The negative case is the entire LineageServiceImpl class. The lineage
  canvas read path (getLineage) and the DEG-lineage read path (getDataEntityGroupLineage)
  both lack the anchor-set defence — REFACTOR-203 confirmed at the service tier.
  STRENGTHENED batch M — controller-method PRIMARY SOURCE for BOTH /my/upstream AND
  /my/downstream variants now in place (getMyObjectsWithUpstream.md + getMyObjectsWithDownstream.md):
  the architecture INCONSISTENCY between base /my (JOIN-defended via listByOwner at
  ReactiveDataEntityRepositoryImpl.java:515-534) AND the lineage variants (NOT JOIN-defended
  via listByOddrns at lines 228-253) is the LOAD-BEARING finding. The owner-scoping
  invariant for the lineage variants is single-point-of-failure at DataEntityRelationsServiceImpl.java:26;
  the downstream listByOddrns scan has NO defence-in-depth WHERE clause. Criticality
  BUMPED from HIGH to CRITICAL given cross-pillar P-05+P-09+P-01 bump per REV-3 LAYER-0
  rule — the primary-source confirmation at controller-method tier makes the regression
  vector falsifiable + the architectural inconsistency between /my and /my/upstream-downstream
  is now documented at 4 angles (controller G + repository H + service I + controller-method
  M). See TEST-GAP-512 for the dedicated regression-pin proposal.'
