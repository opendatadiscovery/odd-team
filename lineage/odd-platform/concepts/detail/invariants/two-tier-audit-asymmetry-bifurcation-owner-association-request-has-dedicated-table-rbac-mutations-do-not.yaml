description: |-
  NEW INVARIANT, batch 2026-05-20V — REFINES the existing 2-tier audit-story
  + F-006-audit-silence-pattern with a NEW BIFURCATION: a third category of
  RBAC-adjacent mutations (the OwnerAssociationRequest workflow) which DOES
  have full audit-trail coverage via a DEDICATED audit table separate from
  the platform-wide Activity Feed. This is the POSITIVE half of the 2-tier
  audit story and was previously under-named in the catalog.

  THE THREE TIERS — refined picture:

    Tier 1 — DataEntity-scoped writes (full audit coverage):
      Activity table (V0_0_48__add_activity.sql) holds rows keyed on
      activity.data_entity_id (NOT NULL FK). 27 event types via
      ActivityEventType enum cover description / business-name / ownership /
      tags / terms / custom-metadata / dataset-field changes / halt config /
      alert state transitions. Surfaced via /api/activity and the per-entity
      Activity tab. The 10-sidecar F-006 audit-silence pattern (batch T)
      established the SCHEMA-ROOTED scope boundary: this table CANNOT hold
      non-data-entity events because data_entity_id is NOT NULL with FK to
      data_entity(id).

    Tier 2 — RBAC mutations (audit-SILENCE — F-006 pattern):
      Role create / update / delete, Policy create / update / delete, Owner
      create / update / delete via OwnerController (the directory CRUD —
      NOT the user-owner mapping), Datasource registration, Collector token
      rotation, AlertManager webhook ingestion — none carry @ActivityLog,
      none emit ActivityEvent, none have a sibling audit table. F-006
      master invariant covers this.

    Tier 3 — OwnerAssociationRequest workflow (audit-PRESENT but in a
    DEDICATED table — NEW TIER, batch V finding):
      The user-to-Owner binding workflow exposed by OwnerAssociationRequestController
      writes to a dedicated owner_association_request_activity table (per
      V0_0_51__add_owner_association_request.sql schema). Five typed event
      values via OwnerAssociationRequestActivityType.java:3-8:
        - REQUEST_CREATED — user submits a self-request
        - REQUEST_DECLINED — Admin declines a pending self-request
        - REQUEST_APPROVED — Admin approves a pending self-request
        - REQUEST_MANUALLY_APPROVED — Admin creates a user-owner mapping
            directly via POST /api/owners/mapping (bypassing the self-request
            flow)
        - REQUEST_MANUALLY_DECLINED — Admin manually revokes a mapping via
            DELETE /api/owners/mapping/{owner_id}
      The DEDICATED audit endpoint is GET /api/owner_association_request/activity
      (controller line 47-53). Operator audit story: 'who approved Alice's
      mapping to Owner-X at T' IS recoverable from this table. Contrast
      with Tier 2 where 'who renamed Owner-X from Alice to Bob at T' is NOT
      recoverable anywhere.

  THE BIFURCATION OBSERVATION:

    The platform's audit story is split across THREE distinct surfaces:
      (a) activity table (Tier 1 — data-entity-scoped)
      (b) owner_association_request_activity table (Tier 3 — user-owner-binding)
      (c) absence (Tier 2 — RBAC mutations)

    The bifurcation is INTENTIONAL design — the OwnerAssociationRequest
    audit table was specifically built for the binding-workflow (not retrofitted
    onto the activity-table). The dedicated typed event enum (5 values vs
    the 27-value ActivityEventType) confirms the separation is intentional.

    Operator surface: an operator looking at 'who did what when' must check
    BOTH the per-entity Activity tab AND the Associations tab activity-list
    view. There is NO unified audit surface. Two distinct UIs, two distinct
    HTTP endpoints, two distinct schemas, two distinct typed enums.

  WHY THE BIFURCATION EXISTS — load-bearing for the F-006 master:

    The OwnerAssociationRequest schema CAN audit because it has its own
    table; data_entity_id IS NULL FK constraint doesn't apply. The RBAC
    mutations CANNOT audit into the activity table because of that
    constraint (per F-006 schema-rooted master). Operators wanting RBAC
    audit have THREE remediation options (per F-006 mitigations):
      (a) extend activity table with NULLable data_entity_id + discriminator;
      (b) create rbac_activity table mirroring owner_association_request_activity;
      (c) reuse owner_association_request_activity (or extend it) to cover
          policy / role / owner-directory events.

    Option (c) is the cleanest precedent — the platform ALREADY has the
    pattern; the existing table covers user-owner mappings; extending it
    (with renaming + schema additions) to cover the full RBAC story would
    be the minimum-cost remediation.

  THE F-006 10-SIDECAR PATTERN — REFINED:

    The batch-T extension of F-006 to 10 sidecars stands. The OwnerAssociationRequest
    finding is COMPLEMENTARY — not a contradiction. F-006's silent surfaces
    do not include the OwnerAssociationRequest workflow; F-006 covers
    RBAC mutations (role/policy/owner-directory) which remain audit-silent.
    The new bifurcation refines the picture by NAMING the positive half
    (Tier 3) explicitly; F-006's negative half (Tier 2) is unchanged.

  THE READ-SIDE AUDIT EXPOSURE — companion finding:

    The GET /api/owner_association_request/activity endpoint has NO
    SecurityRule entry (per the OwnerAssociationRequestController batch V
    sidecar). Any authenticated user can read the full forensic trail of
    who requested which Owner, who approved/declined, when. The audit-list
    LIST endpoint (GET /api/owner_association_request) DOES require
    OWNER_ASSOCIATION_MANAGE; the audit-list HISTORY endpoint does NOT.
    The asymmetry is unintended — the activity view is a SUPERSET of the
    list view in sensitivity. Severity: HIGH for this companion finding;
    handled by a separate invariant (owner-association-request-three-ungated-endpoints).

  SEVERITY: MEDIUM (the bifurcation itself is design; the operator-facing
  cost of bifurcated audit surfaces is the finding). The companion finding
  on the ungated /activity endpoint is HIGH-severity and is captured
  separately.
