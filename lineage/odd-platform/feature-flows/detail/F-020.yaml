observed_vs_expected:
  facets:
  - facet: UI-vs-API asymmetry under DISABLED — REFACTOR-185 19th surface
    observed: |-
      Under `auth.type=DISABLED`, the UI HIDES Add / Edit / Delete /
      Regenerate buttons (because `/api/identity` returns empty
      `permissions` → `WithPermissions` returns null per
      `WithPermissions.tsx:27-29` → buttons absent from DOM, not
      rendered grayed-out). Operators inspecting the UI see a
      READ-ONLY surface and may infer 'this deployment is locked
      down'. The BACKEND endpoints ACCEPT ANONYMOUS MUTATIONS
      regardless — `DisabledAuthSecurityConfiguration.java:11-19`
      sets `.anyExchange().permitAll()` and bypasses
      `SecurityConstants.java:127-137`. A direct `curl POST /api/collectors`
      succeeds with no auth. The UI is QUIETER than the API on this
      surface — security-critical UI-vs-API asymmetry. NEW 19TH
      SIDECAR contribution to REFACTOR-185 (the COLLECTOR_* permission
      family was not in the prior 16/17/18-sidecar enumerations).
    expected: |-
      Either (a) align the UI to render a warning banner under
      DISABLED ('This deployment runs with auth.type=DISABLED — all
      mutations are anonymously reachable via direct REST calls')
      OR (b) align the BACKEND to honour the SecurityRule entries
      even under DISABLED, OR (c) document the asymmetry explicitly
      on the live `/configuration-and-deployment/enable-security` page.
      Current state: operators have no signal.
    drift_class: ui_vs_api_asymmetry_under_disabled_collector_permission_family_refactor_185_19th_surface
    provenance: |-
      STATIC — primary-source in CollectorsList sidecar (batch Q)
      bugs_limitations_corner_cases[1] + security.known_security_gaps[0]
      + DisabledAuthSecurityConfiguration.java:11-19 +
      SecurityConstants.java:127-137 + WithPermissions.tsx:11-32.
      Severity: HIGH.
  - facet: token rotation has NO UI warning about no-grace-period
    observed: |-
      The token-rotation ConfirmationDialog at
      `CollectorItemToken.tsx:37-50` reads only 'Are you sure you
      want to regenerate token for this collector?' / 'Regenerate
      token for "{collector.name}"?'. NEITHER line warns that
      in-flight ingestion using the prior token will start 401-ing
      IMMEDIATELY (per the existing
      `CollectorController.regenerateCollectorToken.md` sidecar's
      bugs_limitations_corner_cases[0]), NOR that the operator must
      redeploy the collector with the new token, NOR that rotation
      invalidates the prior secret platform-wide. The backend sidecar
      describes the operational consequence; the UI affordance does
      not surface it.
    expected: |-
      The ConfirmationDialog should warn 'Rotating this token has no
      grace period. Any collector or ingestion call using the prior
      token will start receiving 401 errors immediately. Make sure
      to update your collector deployment with the new token value
      before rotating.' Plus surface the no-security-effect-on-default
      caveat (separate facet below).
    drift_class: token_rotation_no_grace_period_old_token_401s_immediately
    provenance: |-
      STATIC — primary-source in CollectorsList sidecar (batch Q)
      bugs_limitations_corner_cases[3] + security.known_security_gaps[3]
      + CollectorItemToken.tsx:37-50 + the existing
      CollectorController.regenerateCollectorToken sidecar
      bugs_limitations_corner_cases[0] (HIGH severity).
      Severity: MEDIUM.
