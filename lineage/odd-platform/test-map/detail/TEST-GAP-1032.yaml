behaviour: |-
  **`AdditionalLinkProperties.java:8` declares `record Link(String title, String url)` with NO `@NotBlank`, NO `@NotNull`, NO `@URL`, NO `@Pattern`, NO `@Size` on either field.** Spring Boot's relaxed-binder accepts entries with one or both fields missing/null/empty; the operator's misconfiguration produces a silently-broken UI menu item rather than a fail-fast at boot.

  Concrete failure modes:
  1. `odd.links[0].title: "Documentation"` + `odd.links[0].url:` (unset) → binds `Link("Documentation", null)`. UI renders `<a href={null}>Documentation</a>` which most browsers interpret as a relative-empty href (same-page reload on click) or a literal `href="null"` (404).
  2. `odd.links[0].title:` (empty) + `odd.links[0].url: "https://example.com"` → binds `Link("", "https://example.com")`. UI renders a clickable but visually-empty `<a>` element (zero text width — operationally invisible, but still reachable via Tab key).
  3. `odd.links[0].title: null` + `odd.links[0].url: null` → binds `Link(null, null)`. The entry is in the list but renders nothing.

  The `LinksController.java:27` returns `Flux.empty()` when the whole list is null (via `CollectionUtils.isEmpty` guard), but it does NOT filter partially-populated entries; the broken `<a>` reaches the UI.

  Test gap shape: integration test driving `@ConfigurationProperties` binding with each partial-shape combination and asserting the bound state; pair with a UI-tier render test (under the AppInfoMenu sidecar surface) asserting the broken-link UX. The HIGHEST-LEVERAGE test would force a `@NotBlank` + `@Validated` refactor at the AdditionalLinkProperties layer, eliminating the broken-UI class of misconfiguration at boot.
