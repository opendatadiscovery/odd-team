  - "DOC-NNN candidate: GitHub admin-attribute framing OIDC-inherited"
proposed_action: |-
  Unit test. (a) Mock OAuth2User with attributes map = {'login': 'alice', 'name': 'Alice'}. (b) provider.adminAttribute='login' + adminPrincipals=['alice']. (c) Invoke enrichUserWithProviderInformation. (d) Assert resulting authorities = {ADMIN}. (e) The test pins: `admin-attribute` reads from `user.getAttributes()` (OAuth2User attributes map), NOT from any id_token (which doesn't exist for GitHub OAuth2). Future refactor introducing id_token-based reads (e.g. via Spring Security OIDC migration) flips this test.
