description: |-
  **STRENGTHENED INVARIANT, batch 2026-05-13G — 5-sidecar; ADR-CANDIDATE-003
  RESOLVED as DELIBERATE; batch 2026-05-19H — 8-sidecar with two repository-layer
  SQL primary-source confirmations; batch 2026-05-19I — 11-SIDECAR with FOUR
  service-layer service-tier confirmations; batch 2026-05-19J — 14-SIDECAR with
  THREE UI-LAYER REALISATION-POINT CONFIRMATIONS; batch 2026-05-19L —
  15-SIDECAR with a new PER-ENTITY ALERT-READ surface** — Repository-wide
  read-side posture: GET / read-shaped endpoints fall through to
  `pathMatchers('/**').authenticated()` and return data across owners with
  no owner predicate. **FIFTEEN corroborating surfaces** all share the
  same admin-path-without-admin-gate failure mode:
  (a) `getAllAlerts`; (b) `getActivity`; (c) `search`; (d)
  `getDataEntityDownstreamLineage`; (e) `getDataEntityDetails`
  (CENTERPIECE READ); (f) `ReactiveAlertRepositoryImpl.listAllWithStatusOpen`
  (REFACTOR-024 SQL); (g) `ReactiveLineageRepositoryImpl.getLineageRelations`
  (REFACTOR-203 SQL — graph-shaped enumeration sink); (h)
  `ReactiveDataEntityRepositoryImpl` (every list-shape method lacks
  principal/owner parameter); (i) `DataEntityServiceImpl` (10 of 22 public
  methods owner-unaware); (j) `AlertServiceImpl` (listAll + getTotals.total
  + getDataEntityAlerts BYPASSES); (k) `LineageServiceImpl`
  (NEGATIVE-CASE SIBLING — no anchor-set defence-in-depth); **(l)
  `DataEntityDetails` React component (batch J — UI REALISATION POINT)** —
  dispatches `fetchDataEntityDetails` for any `dataEntityId` without
  client-side authorization; no UI affordance surfaces that the user is
  reading another owner's entity (no banner, no permission-aware
  redirect, no soft-gate prompt); the component is the front-end
  embodiment of the read-collaborative posture; **(m)
  `fetchDataEntityDetails` redux-thunk (batch J — UI REALISATION POINT)**
  — passes only `{ dataEntityId }` to the API, no client-side owner /
  namespace / role filter; the cross-confirmation thunk of the platform's
  read-collaborative posture; **(n) `LineageGraph` React component family
  (batch J — UI REALISATION POINT)** — fetches via the NEGATIVE-case
  lineage endpoints (`/lineage/downstream` + `/upstream`), NOT the
  owner-scoped `/my` variants; the user-observable consequence of
  REFACTOR-203 is realised at this canvas; any authenticated user can
  click the Lineage tab on any entity and enumerate the full reachable
  subgraph; **(o) `getDataEntityAlerts` controller method (batch L — NEW
  PER-ENTITY ALERT-READ SURFACE)** — `GET /api/dataentities/{id}/alerts`
  has no SecurityRule entry; the SQL `getAlertsByDataEntityId`
  (ReactiveAlertRepositoryImpl.java:182-199) has NO `OWNERSHIP` join
  (contrast with the sibling `listByOwner` query at lines 160-178 which
  DOES); the existence-check is `existsIncludingSoftDeleted` (also
  un-scoped); any authenticated user can read every alert ever raised on
  every catalogued entity by enumerating data_entity_id; AMPLIFIED RISK
  via the audit-export workaround on the live alerting doc page (the
  page names this endpoint VERBATIM as the workaround but is silent on
  whether the cross-owner posture is intentional). **Live docs do not
  warn about this posture on any of the surfaces**. The pattern is the
  platform's deliberate stance (ADR-CANDIDATE-003 — read-collaborative
  tradeoff: ODD's catalog is intentionally cross-owner-readable to
  facilitate cross-team collaboration). Batches F/H/I confirmed the
  posture is uniform end-to-end (HTTP → service → SQL). Batch J confirms
  the posture is uniform UI → API → service → SQL — the UI provides no
  compensating defence, no permission-aware UI, no owner-scoping toggle.
  **Batch L** adds the per-entity Alert-read surface — the FIFTEENTH
  surface, applying the same posture to a documented audit-workaround
  endpoint (worst-case operator-trust shape: the docs recommend the
  endpoint without naming its posture).
