evidence:
  - "ActivityController.md says (security.known_security_gaps.[0]): '/api/activity and /api/activity/counts have no per-endpoint authorization wiring — no @PreAuthorize, no programmatic permission check, no entry in SecurityConstants.SECURITY_RULES. Any authenticated user reads the GLOBAL cross-owner audit trail, including audit events on resources they have no ownership association with. The Policies/Permissions/Roles/Owners framework documented at /enable-security/authorization is not applied. The user-facing activity-feed.md page contains no warning about this.' severity: HIGH"
  - "ActivityController.md says (bugs_limitations_corner_cases.[2]): 'No @PreAuthorize, no programmatic authorization gate at the controller layer, and no entry for either endpoint in SecurityConstants.SECURITY_RULES (verified: zero matches across the 357-line file for activity / ACTIVITY / Activity). The endpoints fall through to Spring's default .authenticated() rule; under DISABLED auth mode, anonymous traffic reaches them. The OpenAPI spec contains no security requirement annotation on either endpoint. The read-collaborative cross-owner enumeration posture concept in the catalog is rooted here.' severity: HIGH"
  - "ActivityController.md says (tests_coverage_semantic.uncovered_behaviours.[3]): 'Authorization: when auth.type=LOGIN_FORM (or OAUTH2 / LDAP) and the caller is unauthenticated, the SecurityWebFilterChain rejects the request before the controller runs (HTTP 401). When the caller IS authenticated, the request reaches the controller regardless of ownership association — there is no per-endpoint Permission gate to test.'"
