    DISTINCT and BROADER: (a) the Collector-side soft-delete (CollectorServiceImpl.delete) has the same orphan with NO
    tracked fix; (b) neither PLT-087 nor any item proposes the HOUSEKEEPING-CASCADE sweep F-125 notes_for_maintainer
    recommends — a new HousekeepingJob bean issuing `DELETE FROM token WHERE id NOT IN (SELECT token_id FROM collector WHERE
    deleted_at IS NULL) AND id NOT IN (SELECT token_id FROM data_source WHERE deleted_at IS NULL) AND id NOT IN (...every
    table with a token_id FK)`, scheduled daily, added to HousekeepingJobManager's List<HousekeepingJob>. The per-delete fix
    (PLT-087) and the housekeeping-sweep (this finding) are complementary; the sweep also reclaims tokens orphaned before the
