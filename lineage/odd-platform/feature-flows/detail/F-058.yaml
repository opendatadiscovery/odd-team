terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render — only the first page (30 rows) of lookup tables. Subsequent
    pages never requested because InfiniteScroll's fetchNextPage trigger
    never fires (the DOM id it watches doesn't exist on this page; falls
    back to window scroll but window scroll never fires for content inside
    a ScrollableContainer with overflow:auto).
  evidence: 'LookupTablesList.tsx:51-53 + react-infinite-scroll-component fallback semantics'
observed_vs_expected:
  facets:
    - facet_id: silent_30_row_cap_via_scrollable_target_mismatch
      drift_class: copy_paste_regression_dom_id_mismatch_silent_truncation
      severity: HIGH
      observed: |-
        Operator visiting /master-data/lookup-tables sees a list. For any
        tenant with >30 lookup tables the list APPEARS complete but shows
        only the first 30. No skeleton loader at the bottom, no "Load more"
        button, no pagination indicator — cap is silent and operator-invisible.
        Counter shows real total ("250 lookup tables overall") while list
        shows 30. Discrepancy IS the operator-visible signal once they look
        — but most won't notice.
      expected: |-
        scrollableTarget='lookup-tables-list' matches the container id,
        scroll within container triggers fetchNextPage, full catalog loads
        page-by-page. The fix is one-line: rename scrollableTarget from
        'directory-entities-list' → 'lookup-tables-list'. A
        regression-resistant test should pair the container id and the
        scrollable target via a single constant.
      evidence:
        - 'LookupTablesList.tsx:51-53 (mismatched id pair)'
        - 'LookupTablesList.tsx:23 (size=30)'
        - 'LookupTablesList.tsx:64 (EmptyContentPlaceholder only on isEmpty)'
        - 'LookupTables.tsx:60-62 (counter shows real total)'
        - 'LookupTables sidecar bugs_limitations_corner_cases[1] HIGH + probe P-192'
      ui_unverified: false
    - facet_id: zero_test_coverage_no_regression_anchor
      drift_class: tests_coverage_semantic_empty_no_test_files
      severity: MEDIUM
      observed: |-
        Per LookupTables sidecar tests_coverage_semantic.test_files: []. A
        @WebFluxTest or React-testing-library integration test that asserted
        "scroll fires fetchNextPage" would catch this in one screen. No such
        test exists. Same shape as F-026's zero-test gap — but F-026 is the
        per-table mutation lifecycle; this is the listing surface failure.
      expected: |-
        React Testing Library + jsdom integration test that mounts
        LookupTablesList with 35 seeded rows, scrolls to the bottom of the
        container, asserts the network mock observed page=2 fetch.
      evidence:
        - 'LookupTables sidecar tests_coverage_semantic.test_files: []'
      ui_unverified: false
    - facet_id: pillar_p_03_sole_surface_bug_blast_radius
      drift_class: full_pillar_user_facing_ux_defect_master_data_management
      severity: HIGH
      observed: |-
        Per system-mission.md:125-141, pillar P-03 Master Data Management is
        intentionally narrow (one child surface — Lookup Tables). The listing
        bug means 100% of P-03's user-facing UX is degraded for any tenant
        with >30 lookup tables. Even modest-sized organisations exceed 30
        (country codes, tier mappings, customer enumerations, etc. — one
        table per business-domain enumeration adds up). The "search to find
        what's missing" workaround works ONLY for operators who know the
        missing table exists; new operators or hand-over scenarios cannot
        discover what they cannot see.
      expected: |-
        The pillar's sole listing surface renders the full catalog reliably.
        Pillar P-03's narrowness is itself load-bearing — there is no
        alternate path to the same content (no Directory drill-down to
        lookup tables, no Search facet for entity_class=LOOKUP_TABLE that
        returns >30 rows). The fix MUST land.
      evidence:
        - 'system-mission.md:125-141 (P-03 pillar narrowness — "single-sub-feature pillar; doc landing explicitly states the narrow scope; pillar''s narrowness is itself load-bearing")'
      ui_unverified: false
