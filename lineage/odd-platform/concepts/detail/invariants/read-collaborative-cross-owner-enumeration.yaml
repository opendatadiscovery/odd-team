notes: |-
  STRENGTHENED in batch 2026-05-19J from 11-sidecar to 14-sidecar with three UI-layer
  realisation-point confirmations: DataEntityDetails component, fetchDataEntityDetails
  redux-thunk, and LineageGraph component family. The UI does NOT add any
  compensating defence — no permission-aware UI, no owner-scoping toggle, no
  restricted-view mode, no banner indicating cross-owner read. The user-observable
  consequence of REFACTOR-203 is realised at the lineage canvas (any authenticated
  user can enumerate the full reachable lineage subgraph from any entity).

  The catalog now has end-to-end (UI → API → service → SQL) UNIFORM confirmation
  that the read-collaborative posture is the platform's INTENTIONAL design choice
  AND that no UI affordance compensates for the absence of owner-scoping in the
  backend. The fix for each surface is a one-line WHERE clause at the SQL layer
  + the corresponding service-layer anchor-set principal resolution + a UI
  permission-aware view; today none of the three layers exists at any of the 14
  surfaces.

  Seven DOC-NNN candidates flow from this invariant (one more than batch I — a
  new UI-side doc-gap candidate emerged in batch J):
    (a) /features/alerts page: add a 'Who can see this' section
        naming the read-collaborative posture explicitly.
    (b) /features/active-platform-features/activity-feed page: same treatment.
    (c) /features/data-discovery/search page: same treatment;
        the catalog search surface is the WIDEST single-page
        cross-owner enumeration vector.
    (d) /features/data-lineage page: same treatment; lineage edges leak causal
        connections even when individual entity visibility would otherwise be
        limited; batch J adds UI realisation point.
    (e) /features/data-discovery (or /features/data-discovery/catalog-overview):
        CENTERPIECE READ posture — GET /api/dataentities/{id} returns the full
        34-field payload to any authenticated user; batch J adds UI realisation
        point (DataEntityDetails component is the front-end embodiment).
    (f) /configuration-and-deployment/enable-security/authorization: 'Persistence
        layer posture' subsection explaining the read-collaborative stance at the
        SQL layer.
    (g) **NEW from batch J** — /configuration-and-deployment/enable-security/authorization:
        'Frontend posture' subsection explaining that the UI does NOT compensate
        for backend read-collaborative posture — no permission-aware UI, no
        owner-scoping affordance, no banner indicating cross-owner read; operators
        deploying ODD in multi-tenant environments must understand the UI inherits
        the backend's posture.
