  - facet: JVM-stack recursion unbounded for wide connected components
    observed: |-
      `LineageServiceImpl.getRelationsForEntities` at lines 218-233
      is the tail-recursive BFS expansion that builds each connected
      component. JVM-stack frames accumulate per expansion step; for
      a DEG with a path-graph connected component of length ~5000+,
      the recursion approaches the default JVM stack limit
      (~512KB / 64-bit frame size). A `StackOverflowError` lifts as a
      generic 500 with no graceful degradation. No defensive depth
      cap, no iterative-rewrite, no chunked-expansion. The structure
      is invisible to the operator — a DEG that produces this shape
      is indistinguishable from a healthy DEG until the request lifts
      a 500.
    expected: |-
      Convert `getRelationsForEntities` to an iterative
      breadth-first-search using an explicit Deque<String> + visited
      Set<String>. OR add a defensive cap on connected-component
      depth.
    drift_class: jvm_stack_recursion_unbounded
    provenance: |-
      STATIC — primary-source in batch-M getDataEntityGroupsLineage sidecar
      downstream_side_effects section + LineageServiceImpl.java:218-233
      (the tail-recursive expansion). Severity: LOW (the trigger
      shape — path-graph length 5000+ inside a single DEG — is
      operationally uncommon; the architectural defence is absent).
  - facet: non-transactional metadata fetch race
    observed: |-
      `LineageServiceImpl.getDataEntityGroupLineage` is NOT annotated
      `@ReactiveTransactional` (verified the method body at lines
      59-85). The DEG-member resolution at line 61 happens BEFORE the
      metadata fetch at line 65; a hard-delete of a member entity
      between these two queries races the metadata fetch. The
      `Optional.orElseThrow` at lines 169-173 lifts a bare
      `RuntimeException("Entity with oddrn %s wasn't fetched")` → 500
      with no graceful degradation, no `NotFoundException` mapping,
      no retry. The race is operationally rare but possible during
      catalog cleanup operations.
    expected: |-
      Either: (a) annotate the method `@ReactiveTransactional` (read
      consistency via the DB snapshot); OR (b) handle the missing
      entity case gracefully — skip-and-warn rather than 500; OR (c)
      document the race condition explicitly.
    drift_class: non_transactional_metadata_fetch_race
    provenance: |-
      STATIC — primary-source in batch-M getDataEntityGroupsLineage sidecar
      downstream_side_effects section + LineageServiceImpl.java:59-85
      (no @ReactiveTransactional) + LineageServiceImpl.java:169-173
