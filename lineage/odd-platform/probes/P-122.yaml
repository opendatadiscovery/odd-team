realism_caveats: |
  The probe pins the most-load-bearing security hypothesis: under DISABLED + default
  deployment, an anonymous caller is told they are "admin" with every permission, and
  the UI permission-gate framework will believe it. The probe does NOT cover:
  (a) the LOGIN_FORM / OAUTH2 / LDAP authenticated paths (where the
  switchIfEmpty fallback should never fire because the SecurityContext is populated
  — but a separate probe should assert that the `dummyOwner()` fallback is
  UNREACHABLE under those modes, ruling out a defence-in-depth regression where a
  ContextLost reactor bug would deliver admin identity to a logged-in non-admin user);
  (b) whether the UI actually RENDERS the admin shortcut paths (DataQuality dashboard,
  Management → Roles/Policies/Owners) under DISABLED — those routes do not all carry
  WithPermissionsProvider wrappers, so the operator-visible effect at the UI surface
  needs a parallel UI probe;
  (c) the cache-header secondary assertion — even if Cache-Control is absent, real
  deployments may inject `Cache-Control: no-store` at an NGINX layer; the probe
  asserts the application emits no header, not that the wire response is uncached;
  (d) whether the response body leaks the OAuth2 registration provider name when
  fired against an OAUTH2-mode deployment (separate probe — read provider field on
  Identity DTO if/when added to the schema).
