mitigations_unimplemented:
- |-
  Codebase-wide consistency audit — sweep all service-tier reads in
  odd-platform-api/.../service for which choose existsIncludingSoftDeleted vs
  the regular `exists` variant. Classify each as
    (a) preserve-post-soft-delete (DQ-like — historical signal matters),
    (b) hide-post-soft-delete (search/list-like — soft-delete means 'gone'),
    (c) inconsistent (one of a pair of sibling methods uses one variant, the
        other uses the other — pick a primary intent and align).
  Deliverable: a documented per-feature 'soft-delete visibility policy' that
  future contributors can reference.
- |-
  Within DataQualityService, decide whether getDatasetTests should also use
  existsIncludingSoftDeleted (consistent with the other four methods) or whether
  its empty-list-NotFoundException behaviour is the deliberate intent (and the
  other four are over-cautious). The current asymmetry is a regression risk —
  a maintainer refactoring getDatasetTests to match its siblings could change
  the 404-on-empty-list behaviour without realising the implication.
- |-
  Documentation — surface a 'Soft-delete and feature visibility' section in
  documentation/docs/configuration-and-deployment/ explaining the three soft-delete
  mechanisms AND which features preserve vs hide soft-deleted entities. This is a
  defensible DOC-NNN candidate paired with the existing three-soft-delete
  architectural observation.
notes: |-
  This invariant codifies a positive architectural design — the DQ surface
  DELIBERATELY chose to preserve historical signal post-soft-delete, and the
  naming convention asserts the intent. It is NOT a bug; it IS a load-bearing
  decision that future contributors must understand before they touch the DQ
  service tier.

  Recommended ADR promotion: ADR-146 'Soft-delete Visibility per Feature' formalising
  the per-feature policy. Companion to the three-soft-delete-mechanisms observation
  from batch I (which described the WHAT — three mechanisms across the persistence
  layer — but not the WHO uses which under what condition).

  Cross-references:
    - Companion architectural observation: three-soft-delete-mechanisms (batch I)
    - Companion entity: `data-quality-test`
    - Cross-link to ReactiveDataEntityRepositoryImpl.java for the
      existsIncludingSoftDeleted method definition (the repository-tier
      definition of the primitive)
