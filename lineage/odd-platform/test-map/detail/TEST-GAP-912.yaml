behaviour: |-
  **HIGH — the Data Quality dashboard's "Title" filter (`titleIds` / `deTitleIds`) is the LSN-020 input-name-vs-implementation drift class instantiated on the dashboard: the UI label says "Title" (implying dataset title/name) but the SQL binds to `OWNERSHIP.TITLE_ID` (ownership ROLE — "Data Steward", "Owner", etc.). No test pins what the filter actually filters by, so the drift is invisible to CI and to any operator reading the label.**

  **The drift chain** (statically traced end-to-end):
  - UI label: `t('Title')` — a bare i18n key with no scope qualifier (`TitleFilter.tsx:29`).
  - filter atom write: `DataQualityFilters.tsx:73, 88` writes to `formFiltersAtom[titleIds]` / `formFiltersAtom[deTitleIds]`.
  - derived request shape: `filtersAtom` maps `FilterOption[]` → `number[]` and passes the ids verbatim into `DataQualityRunsApiGetDataQualityTestsRunsRequest.titleIds` / `.deTitleIds` (`DataQualityStore.ts:32-42`).
  - request issued: `DataQualityContent.tsx:23-24` calls `useGetDataQualityDashboard(filterState)` → `dataQualityRunsApi.getDataQualityTestsRuns(params)` → HTTP `GET /api/dataqatests/runs?titleIds=...`.
  - controller: `DataQualityRunsController.java:19-32` binds `titleIds: List<Long>`.
  - service + mapper: `DataQualityRunsServiceImpl.java:22-43` → `DataQualityTestFiltersMapper.java:9-26` 1:1 pass-through into `DataQualityTestFiltersDto`.
  - **SQL bind site**: `ReactiveDataQualityRunsRepositoryImpl.java:301, 309` builds `OWNERSHIP.TITLE_ID.in(titleIds)` — joining the `OWNERSHIP` table on `TITLE_ID`, the ownership ROLE foreign key (FK to the `TITLE` table — values like "Data Steward", "Data Owner").

  **What the operator sees vs what they expect**:
  - Expectation (reading "Title"): "narrow the dashboard to a named dataset" — the human-readable entity name. In a data catalog, "Title" maps most strongly to the entity's display name.
  - Reality: the dashboard narrows to entities where SOME owner holds the selected ownership ROLE. A completely different, far WIDER slice.
  - PARTIAL MITIGATION: a careful operator who opens the dropdown sees role names (the autocomplete is populated by `useGetTitleList`, which lists `TITLE` rows — `TitleFilter.tsx:4`), and can infer the meaning. The bare LABEL alone misleads; the open dropdown corrects.
  - **Compounding drift** (per sidecar): when BOTH Owner and Title are selected, the SQL puts them in ONE OWNERSHIP join with AND (`ReactiveDataQualityRunsRepositoryImpl.java:297-302`) — the result is entities where THAT owner holds THAT title, NOT "owned by Alice AND tagged with title X". An operator expecting two independent filters may get an empty dashboard if Alice's ownership row has a different title.

  **DOC-side silence amplifies the gap**: the live `documentation/docs/features/data-quality/dashboard.md` (WebFetched 2026-05-22 status 200) lists "Title" as one of the five filter dimensions but explicitly does NOT explain what it filters by. So an operator has no documentation that disambiguates — only the autocomplete dropdown content disambiguates, which is post-hoc.

  **The LSN-020 cross-surface family** (each instance is the SAME class on a DIFFERENT surface):
  - LSN-020 itself: Activity Feed `userIds` parameter binds to `OWNER_ID` (the original case).
  - TEST-GAP-893: `TagController.getPopularTagList` `ids` parameter described as "Entity ids" but binds to TAG id.
  - TEST-GAP-912 (THIS): Dashboard "Title" filter binds to `OWNERSHIP.TITLE_ID`, not dataset title.

  **Test gap shape**: integration test against the full chain. Seed dataset D with owner O carrying title T1. Seed another dataset D' with no owners. POST `/api/dataqatests/runs?titleIds={T1.id}` and assert the response's `tablesDashboard` counts include D but NOT D'. Then assert that filtering by `titleIds={existing-dataset-title-string-as-id}` (if such ID exists in DATA_ENTITY's name columns) returns EITHER empty OR the dataset whose ownership row has that exact title-id — pinning that the bind is the OWNERSHIP table, not the entity-name columns.
