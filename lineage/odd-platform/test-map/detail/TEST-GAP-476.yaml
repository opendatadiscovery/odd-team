  Testcontainers integration test. Spy ReactiveUserOwnerMappingRepository. Drive three sequential fetchAssociatedOwner() calls within one reactor chain. Assert getAssociatedOwner invoked exactly 3 times — no caching. LOCKS the no-cache contract; promotes to a fix-required regression when per-request memoization lands.
