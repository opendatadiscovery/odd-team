behaviour: |-
  **HIGH — `buildTableName` lossy normalisation collision: two lookup tables with names differing only in case or whitespace (Customer Lookups vs customer_lookups vs CUSTOMER_LOOKUPS) in the same namespace all resolve to the same physical Postgres table name `n_{namespaceId}__customer_lookups`, producing an opaque 500 `relation already exists` error with no friendly 409 / `BadUserRequestException`.** Primary-source confirmed in the batch-V ReferenceDataController sidecar:

  - **Lossy normalisation**: `ReferenceDataServiceImpl.java:191-194` declares `buildTableName(name, namespacePojo)` as `name.toLowerCase().replace(" ", "_")` — a lossy transformation. The catalog-side name (`lookup_tables.name`) is preserved verbatim; the physical-table name is the lossy version. Operators authoring `Customer Lookups`, `customer_lookups`, `CUSTOMER_LOOKUPS`, and `Customer-Lookups` (last one only if no spaces) get different catalog rows but COLLIDING physical table names.
  - **No pre-check**: `ReferenceDataServiceImpl.java:73-86` (`createLookupTable`) does NOT check for an existing table with the same `tableName` before calling `referenceDataRepository.createLookupTable`. The downstream `DSL.createTable(tableName)` raises a Postgres `relation already exists` error.
  - **No graceful translation**: the Postgres error surfaces as a generic 500 with no friendly user-facing message. Operators see a stack-trace dump (per the framework default behaviour).

  **Operator-observable consequences**:
  - An operator creates `Customer Lookups` in namespace `finance`. Success. Later (perhaps after a typo-correction or after the original operator left), a different operator creates `customer_lookups` in the same namespace. The CATALOG-side validation passes (no `UNIQUE(namespace_id, name)` constraint catches the case-difference). The DDL execution fails with `relation "n_5__customer_lookups" already exists`. The 500 response has no diagnostic message.
  - In a deployment with a steward-curated tag-cloud naming convention (e.g. `Country Codes`, `Currency Codes`, etc.), an operator inadvertently lowercase-creates `currency_codes` thinking it's a new table. The collision surfaces only at table-create time; the catalog has no warn-on-similar-name preview.
  - A multi-tenant deployment using `Namespace` for tenant separation (per the canonicalisation candidate `multi-tenant-configuration-odd-tenant-id`) experiences cross-tenant collision risk if the same Namespace ID is shared across tenants (this is NOT the platform's design, but worth noting that the collision is namespace-scoped — same namespace, different tenants would collide).

  **Compound failure with verbatim-storage XSS (TEST-GAP-733)**: a malicious operator can author a lookup table named `<script>alert(1)</script>` in namespace `finance`. The catalog stores the verbatim name. The physical table name resolves to `n_5__<script>alert(1)</script>` — a Postgres identifier that may fail to compile (Postgres identifiers have ASCII + numeric character constraints), surfacing a Postgres parsing error. The error message may itself be rendered in a UI context, potentially propagating the payload (a secondary XSS vector).

  **Why HIGH not MEDIUM**: the bug class is "naming-convention-incompatible silent collision" — operators experience an unfriendly UX (500 on table-create), and the ABSENCE of a friendly 409 message implies the platform has no input-validation pre-check. The compound with the verbatim-storage XSS class (sister gap TEST-GAP-733) extends the consequence beyond UX to potential XSS propagation through error message rendering. Cross-pillar P-03 (the lookup table itself) + P-08 (operator-workflow surface) elevates severity.

  **Test gap shape**: regression-pin asserting (a) the lossy normalisation behaviour (the case- + whitespace-collision class); (b) the absence of a pre-check at the service layer; (c) the resulting 500 vs the expected-401-or-409 contract. Pin the contract so a future maintainer adding the pre-check has a test to invert.
