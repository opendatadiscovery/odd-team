name: getHighlightedResult is a TRUE SQL-injection vector via String.formatted
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-09
description: |-
  NEW INVARIANT, batch ZE — ReactiveDataEntityRepositoryImpl.java:798-806
  builds raw SQL via direct String.formatted interpolation:

  ```
  final String sql = "ts_headline('english', '%s', to_tsquery('%s'),
    'HighlightAll=true')".formatted(text, tsQuery);
  ```

  BOTH `text` (catalog-supplied entity searchable string) AND
  `tsQuery` (user-derived from persisted session query) are
  interpolated WITHOUT parameterised binding.

  Distinct from the existing
  invariant:tsquery-operator-injection-via-persisted-state finding
  (which surfaces the to_tsquery PARSER DoS via unbalanced parens).
  THIS invariant is the SQL-injection class — the .formatted
  interpolation lets a malicious query escape the
  ts_headline argument into a raw SQL statement.

  ATTACK CHAIN:
    (1) POST /api/search with
        query=`X', NULL); DELETE FROM users WHERE 't' = ('`
    (2) The row persists (SearchServiceImpl.create writes the
        raw user-typed query verbatim with no sanitisation);
    (3) GET /api/search/{searchId}/data_entities/{deId}/highlights
        invokes getHighlightedResult — the `.formatted()` substitutes
        the crafted query into the SQL, escapes the to_tsquery
        argument context, and executes arbitrary statements on
        the READ connection.

  Distinct attack surface to the catalog-supplied `text` — a
  maliciously-named data entity (e.g. one ingested with an
  external_name containing SQL fragments) could also detonate
  through the same path; the entity-name vector is INGESTION-
  AUTHORITY-AMPLIFIED (an attacker controlling a collector or
  catalog ingestion source can mint hostile rows).

  FIX ANCHOR — replace `.formatted()` with jOOQ parameterised
  binding:
  `field("ts_headline(?, ?, to_tsquery(?), 'HighlightAll=true')",
   String.class, ...)` or use DSL.inline()-aware binding. The
  same codebase uses jOOQ parameterised binding everywhere
  else (verified in JooqFTSHelper.java:100-105 which uses
  parameterised binding); the .formatted site is the lone
  exception and a TRUE SQL-injection regression.

  Cross-link: batch H is the canonical write-up of the bug;
  this invariant is the controller-tier confirmation that
  SearchController.highlightDataEntity is the HTTP entry point.
  operation:highlight-data-entity-fts-headline is the surface
  this invariant defeats.

  Severity: HIGH (true SQL injection with the READ-connection
  privilege envelope — typically DML-capable in ODD's
  jOOQ-via-R2DBC stack).
