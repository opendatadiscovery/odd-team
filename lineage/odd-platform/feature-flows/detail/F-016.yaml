  - facet: bounded-member-set optimisation — intentional asymmetry with per-entity lineage
    observed: |-
      `LineageServiceImpl.getDataEntityGroupLineage` calls
      `lineageRepository.getLineageRelations(List<String>)` (lines
      112-119 — simpler edge fetch with bidirectional IN-clause) NOT
