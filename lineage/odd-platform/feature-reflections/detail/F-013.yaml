- id: H-011
  hypothesis: "Field-name matching is consistent: the dropdown search, the auto-create-on-miss diff, and the stored name all treat 'cost_centre' and 'Cost_centre' the same way (so a user typing the same field with different casing does not create two fields)."
  derivation: "Negative-space: a curator typing the same conceptual field across two entities expects one field, not two; the autocomplete shows matches case-insensitively, setting the user's expectation that casing is normalised."
