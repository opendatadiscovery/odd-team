behaviour: |-
  **MEDIUM — `POST /api/tags` and `PUT /api/tags/{tag_id}` return HTTP 200 OK (`ResponseEntity::ok`) but the OpenAPI spec declares HTTP 201 Created (`openapi.yaml:372` for create, `:400` for update). Consumers driving against the spec (e.g., generated SDK clients that check `if (response.status == 201)`) will see the wrong status code.** Primary-source confirmed in batch-W TagController sidecar:

  - `TagController.createTag` (line 27): `.collectList().flatMap(tagService::bulkCreate).map(ResponseEntity::ok)` — returns 200.
  - `TagController.updateTag` (line 51): `.flatMap(fd -> tagService.update(tagId, fd)).map(ResponseEntity::ok)` — returns 200.
  - `openapi.yaml:372` (createTag): declares `'201': description: The resource has been successfully created`.
  - `openapi.yaml:400` (updateTag): declares `'201': description: The resource has been successfully updated` — NOTE: 201 for an UPDATE is itself non-canonical (201 = created); the controller's 200 is more semantically correct but the spec is published as 201.

  **The drift class** — this is the same architectural drift class as:
  - TermController.createTerm + updateTerm (batch-U finding — declared 201, returns 200).
  - AlertController findings (batch-S — drift on alerts surface).
  - The systemic pattern across the controller package: `.map(ResponseEntity::ok)` is the conventional shape for ALL endpoints, regardless of whether the operation is a CREATE / UPDATE / DELETE / READ. The spec writers chose 201 for create/update; the implementers chose 200 uniformly.

  **Operator-visible consequences**:
  - **Generated SDK clients**: customers using `openapi-generator-cli` to generate clients against the published spec get methods that throw on unexpected status. A consumer checking `if (response.status != HttpStatus.CREATED) throw new RuntimeException(...)` fails.
  - **API consumer documentation**: an integrator reading the docs at `https://docs.opendatadiscovery.org/developer-guides/api-reference` and writing curl scripts that check the status code gets the wrong answer.
  - **Tooling-level drift**: post-generation client compilation passes; runtime fails. The failure is silent in CI (tests pass; SDK works against a mock); appears at first real API call.

  **Why MEDIUM not LOW**:
  - The functional impact is zero (the response body is correct, the action is performed).
  - The contract impact is non-zero (consumers reading the spec build wrong expectations).
  - The drift is silent (no test catches it; the spec and the code don't reconcile at any layer).

  **Test gap shape**: regression-pin asserting: (a) `POST /api/tags` returns HTTP 200; (b) `PUT /api/tags/{id}` returns HTTP 200; (c) the OpenAPI spec declares 201 for both. The test documents the drift as the current state. The current state is PINNED — failures land if a future maintainer either (a) changes the controller to return 201 (breaking long-standing consumers that may have adapted to 200), or (b) changes the spec to 200 (breaking spec-driven consumers).
