      in no ErrorBoundary (TermSearch.md bugs_limitations_corner_cases[3] +
      security.known_security_gaps[4]). On any rejection the rejection lands in the
      console / a missing error boundary, the slice stays empty, and the user sees a
      frozen empty page with no message. Auth-token-expired-mid-session is the
      canonical reproducer.
    evidence:
