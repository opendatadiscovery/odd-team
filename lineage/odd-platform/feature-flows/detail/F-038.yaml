control_summary: |-
  0 of 4 cells PROBED — NEW pillar-anchored feature minted in batch ZF
  from the convergence of two controller-class sidecars
  (DataCollaborationController + EventApiController) plus the earlier
  postMessageInSlack method-tier sidecar. 15 load-bearing drift facets
  cluster around SIX architectural concerns:

  (1) **Security** — no Slack signature verification on the events
      webhook; no RBAC gate on any of 4 endpoints; Slack OAuth token
      has no rotation hook; DISABLED-mode publishes the 4-endpoint
      surface anonymously. Combined this is the highest-leverage
      finding cluster.
  (2) **Open-redirect class** — redirect trusts Slack permalink
      verbatim; no host/scheme/structure validation.
  (3) **At-least-once delivery without idempotency** — schema lacks
      unique constraint on (provider, event_id); duplicate Slack
      deliveries materialise N child message rows.
  (4) **Silent-200 conflations** — non-UUIDv1 message_id returns 200
      not 404; malformed JSON returns undefined status; unchecked
      cast throws ClassCastException; unknown event types silently
      filtered without operator-visible signal.
  (5) **UX defects on autocomplete** — startsWith not contains filter;
      1-minute Caffeine cache + bot-must-be-invited gating.
  (6) **Documentation absence** — live feature page returns 404;
      configuration page documents the enable procedure but is silent
      on the security caveats.

  The HIGHEST-LEVERAGE probe candidates (deferred):

  (a) **Signature verification probe** — local docker-compose
      Discussions stack + curl-forged POST to /api/slack/events with
      empty/missing X-Slack-Signature + assert the endpoint accepts
      it; pins the current behaviour as a regression-pin AND becomes
      the assertion-flip target after the fix.

  (b) **DISABLED-mode anonymous reach probe** — local docker-compose
      with `auth.type=DISABLED` + `datacollaboration.enabled=true` +
      anonymous POSTs to all 4 endpoints + assert 200/202/302/200
      responses; pins the bypass behaviour.

  (c) **Duplicate delivery regression-pin** — local docker-compose +
      curl two identical Slack events with the same event_id + count
      message_provider_event rows in Postgres + assert exactly 2 are
      inserted (pinning the current bug) + after the unique-constraint
      fix the assertion flips to exactly 1.

  Local docker-compose probe stack: ODD platform + Postgres +
  MockServer for Slack API + a seeded `messages` row in PENDING_SENT
  state for the redirect happy-path test. No external Slack workspace
  required (all probes mock the SDK at the SlackAPIClient interface).

  Cross-feature coherence: STRENGTHENS F-009 (WAL-driven outbound
  alert fan-out) which is the SIBLING outbound-to-Slack feature on
  the same pillar (P-07:F-002 vs P-07:F-006); the two features share
  the Slack SDK dependency but have entirely different authentication
  models (Slack webhook URL vs Slack OAuth bot token) and entirely
  different reliability postures (in-process retry vs WAL-driven
  fan-out). Cross-link to F-008 (Batch Ingestion) — both features
  surface the REFACTOR-185 DISABLED-mode bypass cluster (this batch
  adds the 20th-22nd surface — the 3 outbound + 1 inbound Data
  Collaboration endpoints).
