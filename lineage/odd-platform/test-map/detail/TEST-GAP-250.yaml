behaviour: 'Postgres `to_tsquery` syntax-error vector — `JooqFTSHelper.tsQuery` (lines
  164-168) splits the inbound query string on a single space character, appends `:*`
  to each non-empty token, joins with `&`, and passes the joined string verbatim into
  `to_tsquery(?)` (lines 103, 158). A user query containing `tsquery`-meaningful metacharacters
  not separated by a space (`foo!bar`, `foo|bar`, `(foo)`, `a<->b`, `foo:`, unbalanced
  `(`) yields a malformed `to_tsquery` argument and Postgres raises `syntax error
  in tsquery: ...` surfacing as 500. Conversely, a balanced `tsquery` expression silently
  re-interprets as that expression (operator chaining, prefix-globbing via `:*` is
  user-controllable). No input sanitisation, no escape of metacharacters, no error
  mapping. `SearchFormData.query` carries no `@Size`/`@Pattern`/max-length constraint.'
