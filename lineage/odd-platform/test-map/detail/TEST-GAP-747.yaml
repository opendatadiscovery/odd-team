behaviour: |-
  **MEDIUM — F-006 audit-silence pattern extends to the QueryExample CRUD + linkage surface. `QueryExampleServiceImpl` carries NO `@ActivityLog` annotations across all 9 service methods. Creating, updating, deleting, and linking/unlinking query examples to datasets + terms produce NO Activity Feed entries.** Primary-source confirmed in the batch-V QueryExampleController sidecar:

  - Verified by reading `QueryExampleServiceImpl.java:1-169` — no `@ActivityLog` annotation anywhere.
  - Compare with `TermServiceImpl` which DOES emit `TERM_ASSIGNMENT_UPDATED` activities on term linkage operations (per the existing TermController sidecar evidence).
  - The asymmetry is canonical to the `audit-log-presence-asymmetry-2-tier-audit-story` concept (per system-mission.md:386-395).

  **Operator-observable consequences**:
  - An operator looking at "What changed on this dataset?" via the per-data-entity Activity tab will see TERM-related changes (TermServiceImpl emits) but NOT query-example-related changes. The query example surface is INVISIBLE in the activity feed.
  - An auditor investigating "who deleted the Q3 sales query example last quarter" has no answer from the activity feed.
  - Compliance frameworks (SOX, GDPR-derived data-cataloguing requirements) cannot demonstrate auditability for the query-example surface.
  - The asymmetry with TermServiceImpl (sister glossary-adjacent surface) is structurally inconsistent — operators familiar with the Term activity-feed coverage may not realise QueryExample is silent.

  **Sister gap context**:
  - **TEST-GAP-725** (batch U): Term-lifecycle audit silence + enum-rooted gap — the audit silence pattern at the SCHEMA level. THIS gap is similar but at the QueryExample surface.
  - **TEST-GAP-573** + TEST-GAP-666 (batch R): RBAC audit-silence + DatasetField audit (the latter superseded by TEST-GAP-744 — DatasetField IS audit-logged correctly).
  - **F-006 family**: this gap adds the QueryExample surface to the F-006 audit-silence enumeration.

  **Why MEDIUM not LOW**: the QueryExample surface is operator-curated content with cross-pillar reach (P-02 Data Modelling + linked to P-01 Data Discovery + P-06 Data Glossary via dataset and term links). The complete audit-silence across CRUD + linkage means no forensic trace of WHO authored a query example, WHO modified it, WHO deleted it, WHO linked it to which dataset/term. Operators with compliance requirements have an unrecoverable audit gap. Cross-pillar P-02 + P-07 (Active Platform Features — the Activity Feed surface itself).

  **Test gap shape**: regression-pin asserting (a) NONE of the QueryExample CRUD methods emit activity rows; (b) NONE of the linkage methods emit activity rows. Pair with the doc-disclosure follow-up: surface the audit-silence on the Query Examples doc page so operators understand the current ground truth.
