  CAPTURED batch X-TAGGING (2026-05-21). This is a SPEC-side drift,
  distinct from the LSN-019 popularity-ordering drift on the same
  operation (`get-popular-tag-list`). LSN-019 is a name-vs-BEHAVIOUR
  drift in the SQL; this is an input-NAME-vs-implementation drift in a
  shared OpenAPI parameter component. Both live on getPopularTagList
  but they are separate findings with separate probes (P-010 vs P-031).

  Cross-cutting connections:
    - Pairs with the `get-popular-tag-list` operation (the operation
      carrying the misdescribed parameter)
