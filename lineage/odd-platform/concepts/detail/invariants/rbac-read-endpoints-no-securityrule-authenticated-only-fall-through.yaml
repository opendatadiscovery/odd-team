  NEW invariant captured in batch 2026-05-25-ZD. Five-endpoint
  enumeration of the RBAC read surface posture; one of the five
  (getPolicyDetails) is the highest-leverage exposure because the
  response is NOT caller-scoped — any authenticated user reads
  the full policy by id.

