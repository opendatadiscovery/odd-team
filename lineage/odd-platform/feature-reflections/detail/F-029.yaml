      name promises namespace protection; its scope is one endpoint. Already tracked on the
      ingestion side (PLT-044 stats / PLT-051 metrics / PLT-003 alertmanager) — surfaced here as the
      cross-spec-boundary corroboration, not a new finding.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-014
  hypothesis: "When a developer reads the spec to learn an endpoint's HTTP method + path, the spec is authoritative — the running controller serves exactly that method+path (the controller does not override or re-route it), so a client built from the spec hits a live endpoint."
  derivation: "Pillar mission (the spec is 'the wire contract for shape') + implicit-ADR — the value of a contract-first stack is that the spec, not the Java, owns the routing; a developer can trust the path/method without reading controller source."
  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      The spec IS the path/method authority. Every enriched controller @Override-implements the
      OpenAPI-generated *Api interface (DataEntityController extends DataEntityApi, AlertController
      extends AlertApi, etc., verified across all controller sidecars including batch-W class-level
      audits) and NO controller declares its own @RequestMapping for spec'd operations — the
      HTTP method/path/produces/consumes annotations live on the generated interface, not the
      controller. The live ADR log corroborates: ADR-0001 (WebFetch 2026-06-01) states "ODD
      Platform's REST controllers are thin delegates over OpenAPI-generated interfaces — the HTTP
      contract lives in the spec, and routes change by regenerating it, not by editing controllers."
      So a client built from the spec's method+path hits a live endpoint (the path/method dimension
      of the contract IS guaranteed — it is the STATUS/RESPONSE-SHAPE/SUMMARY/AUTH dimensions that
      drift, per H-002..H-009).
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: implicit_adrs[0]
        cite: "openapi.yaml:1-49 + cross-batch controller sidecars (extends *Api pattern)"
        note: "Controllers implement the generated *Api interface; no controller declares its own @RequestMapping for spec'd ops."
      - sidecar: feature-reflector live cross-reference
        section: docs_cross_referenced
        cite: "WebFetch https://docs.opendatadiscovery.org/developer-guides 2026-06-01 (ADR-0001)"
        note: "ADR-0001 confirms the contract-first stance: routes change by regenerating the spec, not editing controllers."
    confidence: HIGH
    routes_to_finding: none

- id: H-015
  hypothesis: "When a developer needs the ingestion (producer-side) API versus the platform (consumer-side) API, the two are cleanly separated — the platform-api spec covers the /api/** consumer surface and a SEPARATE ingestion-api spec covers the /ingestion/** producer surface, so a developer reads the right contract for their integration."
  derivation: "Cross-pillar (P-10 'two OpenAPI specifications: Ingestion API + Platform API' + P-11) + implicit-ADR — the dual-spec architecture is a deliberate audience split a developer relies on."
  seed_source: cross-pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      The dual-spec split is real and intentional. This platform-api spec (info.title at
      openapi.yaml:2-9, the /api/** surface) is distinct from the ingestion-api spec, which lives in
      the separate opendatadiscovery-specification artefact (loaded as the
      ingestion-contract-server:0.1.40 gradle dep) and covers /ingestion/**. The live api-reference
      page (WebFetched 2026-05-20) stated verbatim: "The two definitions in Swagger UI are:
      ingestion-api: describes all ingestion endpoints and platform-api: describes all endpoints for
      the ODD platform." The three IngestionController nodes in this chain serve the INGESTION spec
      (postDataSetStatsList/ingestMetrics implement IngestionApi from the sibling artefact) —
      confirming the split holds at the code level. A developer building a collector reads the
      ingestion spec; a developer building a UI/automation client reads this platform spec.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: implicit_adrs[1]
        cite: "openapi.yaml:2-9 + live api-reference page WebFetched 2026-05-20 (ingestion-api vs platform-api split)"
        note: "Dual-spec architecture is intentional; ingestion is the producer wire contract, platform-api the consumer contract."
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics
        section: dependencies_semantic.requires-feature
        cite: "gradle/libs.versions.toml:6,65 (ingestion-contract-server:0.1.40)"
        note: "IngestionController implements the SIBLING ingestion spec's generated interface — the split is load-bearing at the code level."
    confidence: HIGH
    routes_to_finding: none

