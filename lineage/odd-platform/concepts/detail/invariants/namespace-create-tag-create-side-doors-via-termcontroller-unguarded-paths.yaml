mitigations_unimplemented:
  - |-
    Add service-tier permission checks at the namespaceService.getOrCreate
    + tagService.getOrCreateTagsByName call sites. The check should
    differentiate 'looking up an existing namespace/tag' (no permission
    needed; pure read) from 'creating a new namespace/tag' (requires
    NAMESPACE_CREATE / TAG_CREATE). The getOrCreate signature can be
    refactored to take a 'requireCreatePermission: boolean' flag OR
    split into two methods (getByName + create) so the side-door is
    explicit at call sites.
  - |-
    Add the namespace + tag CREATE-permission checks at the
    TermServiceImpl mutator methods before invoking the getOrCreate
    helpers. Defence-in-depth at the service tier.
  - |-
    Document the side-door pattern on the
    /features/data-glossary/business-glossary live doc page — operators
    authoring Policies should know that TERM_CREATE / TERM_UPDATE
    grants implicit NAMESPACE_CREATE; TERM_TAGS_UPDATE grants implicit
    TAG_CREATE. Surface as an admonition block.
  - |-
    Add a regression test asserting the side-door behavior:
      (a) Authenticate as a user with TERM_CREATE but NOT NAMESPACE_CREATE.
      (b) POST /api/terms with TermFormData containing a never-seen
          namespaceName.
      (c) Assert the namespace IS created and the term IS attached to
          it (pins the buggy/intentional state).
      (d) Re-author after a future fix: assert the request 403s (or
          409s) for missing NAMESPACE_CREATE.
  - |-
    Build-time scanner — enumerate every service-tier getOrCreate
    method invocation and flag any that touches an entity gated by a
    dedicated *_CREATE permission. The scanner would surface the full
    cross-pillar pattern (Owner / Tag / Namespace / and any other
    side-doors) so the maintainer has the complete inventory.
  - |-
    Audit batch follow-up — enumerate the remaining *_CREATE
    permissions (QUERY_EXAMPLE_CREATE, COLLECTOR_CREATE, POLICY_CREATE,
    ROLE_CREATE, etc.) and verify whether each is bypassed by a
    service-tier getOrCreate elsewhere. Close the cross-pillar
    inventory.
notes: |-
  NEW invariant captured in batch 2026-05-20U from the TermController
  class-level sidecar. The class-level read aggregates the
  NAMESPACE_CREATE + TAG_CREATE side-doors that the controller's
  three CRUD-ish endpoints (createTerm, updateTerm, createTermTagsRelations)
  expose; the TermServiceImpl batch K primary source had already
  documented the service-tier mechanism for TAG_CREATE, but the
  NAMESPACE_CREATE pairing was implicit and is now explicit.

  The architectural pattern (getOrCreate = side-door for the
  dedicated *_CREATE permission) is the load-bearing observation. It
  generalises beyond Term + Owner + Tag to ANY entity whose service-tier
  exposes a getOrCreate AND whose creation is gated by a dedicated
  *_CREATE permission. The follow-up audit batch should enumerate
  the full set.

  Cross-cutting connections:
    - STRENGTHENS the existing master
      spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create
      with the NAMESPACE_CREATE half + the architectural-pattern
      framing
    - Pairs with permission-bypass-via-owner-auto-create-side-door-write-path
      (batch H Owner-side door) — same architectural class
    - Pairs with f-006-audit-silence-enum-rooted-deeper-than-schema-rooted
      (batch U) — the side-doors are also silent in the Activity Feed
      because ActivityEventTypeDto has no TAG_CREATED or
      NAMESPACE_CREATED values
    - Pairs with the cross-namespace-term-pollution drift class
      (F-002) — the namespace side-door amplifies the cross-namespace
      pollution surface

  Three DOC-NNN candidates flow from this invariant:
    (a) Code fix — service-tier permission checks + getOrCreate
        signature refactor
    (b) Docs admission — admonition on business-glossary describing
        the implicit *_CREATE grants
    (c) Cross-pillar audit follow-up — enumerate every getOrCreate
        side-door across the platform
