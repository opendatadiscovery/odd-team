- batch: VAL-LSN-019-B
  entry_point_added: |-
    NONE — VAL-LSN-019-B is the SECOND Stress Protocol canary
    batch (Activity feed feature). Sister batch to VAL-LSN-019
    (Tag feature, F-018). Five new/rewritten sidecars carry the
    rev-4 `stress_findings` block surfacing eight new drift facets
    across the Activity feature. No new entry-points; the existing
    chain (ActivityController + ActivityServiceImpl +
    ReactiveActivityRepositoryImpl + ActivityIngestionRequestProcessor
    + AlertServiceImpl + ActivityEmptyPartitionsHousekeepingJob) is
    unchanged. What CHANGES is the operator-visible truth at the
    ActivityHandler dispatch interface (state-snapshot differ, not
    write-handler), the TX-coupling shape (audit-or-fail rather
    than best-effort), the empty-partition reaper concurrency
    contract, the concurrent-mutation oldState race, the
    service-tier auth posture, the row-order non-determinism in
    diff equality, the system-event attribution discriminator
    absence, and the doc-side silence on visibility / lifecycle.
  contributing_nodes_added:
  - odd-platform java service activity handler:ActivityHandler
  - odd-platform java housekeeping job:ActivityEmptyPartitionsHousekeepingJob
  contributing_nodes_re_enriched:
  - odd-platform java ActivityController controller-class:ActivityController
  - odd-platform java service:ActivityServiceImpl
  - odd-platform java repository reactive repository:ReactiveActivityRepositoryImpl
  notes: |-
    LSN-019 Stress Protocol VALIDATION CANARY — SECOND APPLICATION.
    Sister batch to VAL-LSN-019 (which validated the rev-4 schema
    against the Tag feature). This batch applies the same protocol
    to the Activity feed feature — a structurally distinct shape
    (audit-trail surface, aspect-driven write path, partition-based
    lifecycle) — proving the protocol fires CONSISTENTLY across
    feature shapes. Eight new drift facets surface; ordered by
    architectural leverage:

    (1) NEW MEDIUM — **ActivityHandler interface misnamed**
    (F-021-DRIFT-ACTIVITYHANDLER-MISNAMED). The dispatch interface
    name "ActivityHandler" lies — the 4-method contract is NOT a
    write-side handler ("handle(event) → write row"); it is a
    STATE-SNAPSHOT DIFFER. `getContextInfo(parameters)` captures
    PRE-mutation state; `getUpdatedState(parameters, dataEntityId)`
    captures POST-mutation state. Diff computation
    (`info.getOldState().equals(newState)` at ActivityAspect.java:86)
    and persistence (`activityRepository.saveReturning`) happen
    OUTSIDE the handler in ActivityAspect + ActivityServiceImpl.
    Evidence: ActivityHandler.java:9-22 (only READ methods declared)
    + 18 concrete impls verified read-only. Operator-visible
    consequence: a new contributor reading the interface name will
    look for a "handle write" hook that does not exist; the
    snapshot-pair semantics are the actual contract. Pin: the
    interface SHOULD be renamed `ActivityStateDiffer` or
    `ActivitySnapshotProvider` to match observed behaviour.

    (2) NEW HIGH — **Activity emit couples rollback to business
    mutation via shared @ReactiveTransactional**
    (F-021-DRIFT-ACTIVITY-EMIT-COUPLES-ROLLBACK). The ActivityAspect
    around-advice carries `@ReactiveTransactional` at
    ActivityAspect.java:42, wrapping the WHOLE @ActivityLog business
    method PLUS the postActivity emit (ActivityServiceImpl.java:50
    `activityRepository.saveReturning`) in ONE transaction. An
    activity-repository write failure rolls back the user's actual
    change. Evidence: ActivityAspect.java:42 + ActivityServiceImpl.java
    line-by-line absence of local TX. Operator-visible consequence:
    a transient repository error on the activity write surfaces as
    HTTP 500 to the user with the underlying business mutation
    silently rolled back. The same coupling holds for
    AlertServiceImpl.applyAlertActions (line 201
    @ReactiveTransactional) and ActivityIngestionRequestProcessor
    (IngestionServiceImpl.java:66 @ReactiveTransactional). The
    audit-or-fail semantic is intentional but UNDOCUMENTED and
    operationally surprising — operators expect audit to be
    best-effort. Cross-reference: REFACTOR-NNN (extract activity
    emit to compensating-action / outbox pattern) + TEST-GAP-NNN
    (no test asserts the rollback contract — a future refactor
    that decoupled the TX could silently break it).

    (3) NEW HIGH — **ActivityEmptyPartitionsHousekeepingJob check-then-drop
    race causes silent row loss**
    (F-021-DRIFT-EMPTY-PARTITIONS-RACE). The job's name honors its
    CENTRE meaning (only EMPTY past partitions dropped) — but the
    implementation is two non-transactional statements:
    `SELECT count(*) = 0 FROM <partition>` (PartitionServiceImpl.java:134)
    followed by `DROP TABLE <partition>` (line 122). A concurrent
    INSERT INTO activity that lands in the race window AFTER the
    count-zero check and BEFORE the DROP TABLE causes the
    just-inserted activity row to be DROPPED with the partition;
    the INSERT caller sees success and the row is gone. The parent
    template (EmptyPartitionsHousekeepingJob.java:16-33) does NOT
    wrap in `DSL.using(connection).transaction(...)`, unlike sibling
    AlertHousekeepingJob.java:25 which DOES. Evidence: structural
    diff with AlertHousekeepingJob. Cross-reference: LSN-018 (the
    structural analogue — coherence-check gap), F-010 (Housekeeping
    TTL) batch-R activity-monotonic-growth confirmation. P-022 probe
    emitted to pin empirically.

    (4) NEW HIGH — **Concurrent oldState capture race produces wrong
    attribution in second handler's diff**
    (F-021-DRIFT-CONCURRENT-OLDSTATE-RACE). When two concurrent
    @ActivityLog-annotated mutations target the SAME data entity
    (e.g. two operators editing description in parallel; the UI
    has no optimistic-concurrency check), both `getContextInfo`
    calls capture the SAME pre-mutation oldState. Mutation A runs;
    its `getUpdatedState` sees state after A. Mutation B runs after
    A; its `getUpdatedState` ALSO sees state after both — but B
    records diff (pre-A → after-A+B), claiming credit for A's
    change. Evidence: ActivityHandler.java:12-15 (read-before /
    read-after contract) + ActivityAspect.java:48-95 (the
    around-advice flow; no inter-snapshot locking) + the
    @ReactiveTransactional isolation is READ COMMITTED, NOT
    SERIALIZABLE — handlers can see each other's committed writes.
    Operator-visible consequence: the Activity Feed shows two rows
    each claiming credit for the other's change. Cross-reference:
    TEST-GAP-NNN (StepVerifier two-concurrent-OwnershipServiceImpl-update
    integration test) + P-019 (the structural-analogue concurrent
    write race surfaced at the Tag layer in VAL-LSN-019).

    (5) NEW HIGH — **Service-tier zero authorization → cross-owner
    visibility / multi-tenant data leak**
    (F-021-DRIFT-CROSS-OWNER-VISIBILITY). ActivityServiceImpl.java
    lines 33-273 verified line-by-line: zero @PreAuthorize, zero
    programmatic `permissionService.hasPermission(...)`, zero owner
    scoping on reads except `MY_OBJECTS` view-mode (and that scopes
    along OBJECT-OWNERSHIP, not ACTOR axis). `getDataEntityActivityList`
    (line 119-136) accepts a `dataEntityId` and unconditionally
    fetches activity for that ID — any authenticated user reads
    any data entity's audit trail including JSONB old/newState
    descriptions. In a multi-tenant scenario operators of tenant A
    see tenant B's lifecycle events including PII / credentials
    accidentally pasted into description fields. Evidence:
    ActivityServiceImpl.java:33-273 + ActivityController.java:1-58
    (no @PreAuthorize) + ReactiveActivityRepositoryImpl.java:128-145
    (no per-tenant filter). CROSS-CUTTING POSTURE CONFIRMATION:
    this is the SAME root cause finding as F-018's
    `tag_service_tier_zero_permission_checks_controller_perimeter_sole_authorization`
    (VAL-LSN-019 batch). The two findings are not Tag-specific or
    Activity-specific — they are the PLATFORM's service-tier auth
    posture: controller perimeter is the sole authorization gate;
    service tier is auth-free by design. The Activity feed proves
    the pattern generalises; future batches will likely find it on
    OwnershipServiceImpl, DataEntityServiceImpl, etc. Cross-reference:
    REFACTOR-547 (the Tag analogue — same root cause).

    (6) NEW MEDIUM — **Spurious activity events from Postgres row-order
    non-determinism in ownership / tag list queries leaks into
    JSON-string diff equality**
    (F-021-DRIFT-SPURIOUS-EVENTS-FROM-UNSTABLE-ORDERING).
    `getOwnershipsByDataEntityId` (ReactiveOwnershipRepositoryImpl.java:130-145)
    has NO `ORDER BY`; `listDataEntityDtos` (ReactiveTagRepositoryImpl.java:69-81)
    has only `groupBy(TAG.fields())`, NO `ORDER BY`. Both produce
    `List<*Dto>` that ActivityHandler concrete impls serialize as
    JSON (`AbstractOwnershipActivityHandler.java:19-22` collectList
    → JSON; `TagActivityHandlerImpl.java:41-50` list → JSON). The
    same underlying owner / tag set serializes as `[A, B]` or
    `[B, A]` depending on Postgres row order (storage order, can
    change after VACUUM, UPDATE-MOVE, or query-plan changes). The
    `info.getOldState().equals(newState)` filter at
    ActivityAspect.java:86 is STRING-equality — a row-order flip
    emits a spurious activity event recording "same owners changed
    to same owners in different order". Operator confidence in the
    Activity Feed degrades. Evidence: structural diff between
    repositories WITH `ORDER BY` and the two cited. Cross-reference:
    P-018 probe emitted to pin empirically.

    (7) NEW MEDIUM — **Ingestion-driven activity events persist
    created_by_user_id = NULL with no is_system_event flag**
    (F-021-DRIFT-INGESTION-ATTRIBUTION-NULL).
    ActivityServiceImpl.java:46-49 + line 60: the
    `switchIfEmpty(Mono.defer(() -> Mono.just(activityMapper.mapToPojo(event,
    activityCreateTime, null))))` fallback fires when
    `authIdentityProvider.getCurrentUser()` is Mono.empty() — for
    ActivityIngestionRequestProcessor (S2S ingestion path; no
    SecurityContext), AlertServiceImpl scheduler flows (background
    thread; SecurityContext lost across boundary), and DISABLED-mode
    anonymous mutations. The `ActivityCreateEvent` carries a
    `systemEvent: boolean` field (line 13) but it is NOT used to
    populate the activity row to discriminate "system did it" from
    "user did it but auth context was lost due to a bug". The
    schema's `is_system_event` column exists (V0_0_48__add_activity.sql:8)
    but the mapper does not appear to set it from
    `ActivityCreateEvent.systemEvent` in the create path. Operators
    cannot distinguish "ingestion event" from "user-action with
    auth-context bug". Evidence: ActivityServiceImpl.java:46-49,
    58-60 + ActivityCreateEvent.java:13 + V0_0_48__add_activity.sql:8.
    Cross-reference: TEST-GAP-NNN
    (testCreateActivityEvent_NoAuthContext_PersistsNullUserId + UI
    render of null user).

    (8) NEW HIGH (doc-class) — **Live activity-feed doc silent on
    visibility, type-filter values, pagination, ordering,
    partition-based lifecycle**
    (F-021-DRIFT-DOC-SILENCE-VISIBILITY-AND-LIFECYCLE). Live
    activity-feed.md (WebFetched 2026-05-20 status 200) returns
    "NOT MENTIONED" for FIVE categories: (a) authorization /
    visibility / who can access; (b) the `type` query parameter
    (ALL/MY_OBJECTS/UPSTREAM/DOWNSTREAM); (c) pagination / cursor /
    page size; (d) ordering / sort order / chronological; (e) the
    partition-based retention model (no row-level TTL; non-empty
    partitions never drop). Each of the FIVE is operator-visible
    behaviour the controller embodies. STRENGTHENS the existing
    F-021 doc_silence facets with the five-category enumeration
    closing the picture: this is not a single drift — it is a
    structurally INCOMPLETE doc page. Evidence: WebFetch
    /features/active-platform-features/activity-feed 2026-05-20
    inventory + ActivityController.java:1-58 (visibility surface)
    + ActivityServiceImpl.java:107-117 (type dispatch) +
    ReactiveActivityRepositoryImpl.java:285-291 (cursor +
    ordering) + ActivityEmptyPartitionsHousekeepingJob (lifecycle).
    Cross-reference: DOC-GAP-NNN (each of the 5 categories deferred
    to doc-gap-finder); REFACTOR-NNN (a dedicated visibility /
    authorization section on the feature page would close most).

    Coherence (LSN-018 Rule 6 sweep):
    STRENGTHENS=4 (F-018 service-tier-zero-auth posture extended
    by cross-feature CONFIRMATION; F-006 audit-silence schema-rooted
    invariant strengthened by service-tier auth-free confirmation;
    F-010 housekeeping-empty-partitions-race + activity-monotonic
    growth strengthened by sister jobs' transactional contrast;
    F-021 itself strengthened across all 8 new facets).
    SUPERSEDES=0 (no prior claim contradicted — all new findings
    are NEW DRIFT, not corrections).
    CONFLICTS=0.

    Methodology-meta: VAL-LSN-019-B is the SECOND application of
    the rev-4 Stress Protocol schema, after VAL-LSN-019 (Tag
    feature). The two batches together establish that the protocol
    surfaces DRIFT-CLASS findings consistently across feature
    SHAPES: a Discovery-pillar primary-write feature (Tag) AND an
    Audit-pillar primary-read feature (Activity). The 8 new facets
    are structurally distinct from F-018's 5 facets — different
    code paths, different operator-impact classes — but all surface
    from the SAME 5-category Stress Protocol exhaustion (A
    tunables, B name-vs-behaviour, C orderings/pagination, D auth
    gates, E resource boundaries). The protocol works.

    CROSS-FEATURE FINDING — service-tier zero-authorization posture:
    F-018 batch VAL-LSN-019 surfaced the finding ONCE as a
    Tag-specific facet. F-021 batch VAL-LSN-019-B independently
    surfaces the SAME root cause on an unrelated service tier
    (Activity). The two findings VALIDATE each other — this is not
    a Tag-specific or Activity-specific posture; it is the
    PLATFORM's service-tier auth contract. Future batches will
    surface the same pattern on additional services. The canonical
    home REMAINS on F-018 (where it was first surfaced); F-021
    adds a cross-reference back-link in the related_features block
    + a `related_features_cross_batch_confirmation:` note pinning
    that the two batches together prove system-wide applicability.
