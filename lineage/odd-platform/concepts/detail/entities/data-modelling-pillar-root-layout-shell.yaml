name: |-
  Data Modelling pillar root (purely presentational two-column layout shell)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-02
description: |-
  NEW ENTITY, batch ZL (2026-05-26) — the canonical UI page-root
  for the Data Modelling pillar (P-02). DataModelling.tsx
  (`components/DataModelling/DataModelling.tsx`, 17 lines) is
  mounted at `App.tsx:74` via
  `<Route path='/data-modelling/*' element={<DataModeling/>}/>`
  (note the typo'd local alias `DataModeling` — single L —
  vs the pillar's canonical double-L spelling). Lazy-loaded at
  App.tsx:40.

  **STRUCTURE**:
    A 17-line file. Single JSX expression returning the layout
    shell:
      <S.LayoutContainer>
        <S.Sidebar $alignSelf='flex-start' $position='sticky'>
          <DataModellingTabs/>
        </S.Sidebar>
        <S.Content>
          <DataModellingRoutes/>
        </S.Content>
      </S.LayoutContainer>

    Styled components from
    `components/shared/styled-components/layout.ts:3-31` (shared
    with Alerts, Activity, Management, DataQuality, etc.).

  **NO STATE, NO EFFECTS, NO PERMISSION CHECK**:
    - Zero useState calls
    - Zero useEffect calls
    - Zero useDispatch calls
    - Zero WithPermissions wrappers
    - Zero API calls
    - Single hook usage: implicit via styled-components

  **DELEGATION**:
    - Tab selection state: <DataModellingTabs/> child reads
      useLocation().pathname and matches against the link field
      of each tab entry via useSetSelectedTab.
    - URL routing: <DataModellingRoutes/> child declares the
      inner <Routes> with three Route entries — index redirect,
      query-examples wrapped in WithPermissionsProvider,
      relationships bare (no wrapper).

  **PROVENANCE**:
    The entity is the canonical anchor for the pillar's UI;
    Query Examples + Relationships are the two underlying
    sub-features. This entity entry represents the LAYOUT
    SHELL that surfaces them.

  **CROSS-FEATURE RELATIONSHIPS**:
    - feeds_from: [P-09]    — Authorization framework
      (QUERY_EXAMPLE_CREATE / _UPDATE / _DELETE permissions
      gate inner button actions)
    - feeds_to: []          — end-user surface
    - shares_data_with: [P-02] — the pillar's data is
      query_example.* and entity_relationship.* / graph_relationship.*
      tables

  **AUDIENCES**:
    - data-engineer-analyst (writes canonical Query Examples)
    - data-platform-operator (browses Relationships ERD)
    - data-governance-reviewer (audits curated documentation)
    - data-platform-administrator (RBAC config for the pillar's
      9 permissions across QueryExample + Relationships surfaces)

  **KNOWN ISSUES** (cross-link):
    1. `invariant:data-modelling-erd-is-sub-tab-not-peer-of-relationships`
       — LOW severity navigation-clarity (operator may expect
       ERD as a peer tab)
    2. `invariant:withpermissionsprovider-context-seed-not-route-gate`
       — HIGH severity permission-model (the wrappers inside
       DataModellingRoutes are context-only, NOT render gates)
    3. `invariant:relationships-list-target-column-copy-paste-source-data`
       — MEDIUM severity copy-paste UI bug at the Relationships
       child surface
    4. `invariant:bare-base-url-behavior-divergence-redirect-vs-blank`
       — /data-modelling redirects to /data-modelling/query-examples
       (the correct redirect-convention case; pairs with the
       blank-convention cases at /master-data and /terms)

  vocabulary_status: canonical-anchored (P-02 pillar); docs page
  exists at /features/data-modelling.
