behaviour: |-
  **TWIN-DEFECT class on the `odd.links` operator-configured external-URL
  surface — reverse tabnabbing AND URL-scheme passthrough.**

  (1) `AppInfoMenu.tsx:60-66` renders `<Link to={link.url} target='_blank'>`
  WITHOUT `rel='noopener noreferrer'`. Any URL the operator configures
  (typically internal wikis, runbooks, Grafana) opens with
  `window.opener` set; the destination page can navigate the ODD
  Platform tab to a phishing page (reverse tabnabbing). The realistic
  threat is a compromised internal wiki; severity is non-zero but
  bounded by who controls the URLs.

  (2) Neither the backend (`AdditionalLinkProperties.java:8` — no `@URL`
  / `@Pattern` constraint on the `url` field; no controller validation)
  nor the UI validates the URL scheme. An operator-supplied
  `javascript:alert(1)` or `data:text/html,<script>...</script>` URL is
  passed unsanitised. React 17+ neutralises `javascript:` in <a href>,
  but `data:text/html` and `vbscript:` may still render in some
  browsers. No allowlist of schemes.

  No test pins either defect. Both surface in the UI; both can be
  asserted in a test (the backend passthrough is testable via
  LinksController, the UI rendering is testable via the existing
  Playwright spec). Operator-relevant under any trust model where the
  `odd.links` YAML/env can be edited by a less-trusted role.
