mitigations_unimplemented:
  - |-
    Document the read-collaborative posture explicitly on every
    /features/management tab page. Admonition text per tab:
    'The {tab-name} list view is visible to every authenticated
    user. Mutating actions (Add / Edit / Delete) require the
    corresponding {ENTITY}_* permission.' Five DOC-NNN candidates
    (one per Management tab).
  - |-
    Document the read-collaborative posture on the
    /configuration-and-deployment/enable-security/authorization
    page. Explicit text: 'The platform is designed for cross-team
    collaboration; READ endpoints are gated only by authentication,
    not by per-entity ownership or Management-tier permissions.
    Operators requiring strict read-isolation between teams
    should deploy separate platform instances.' Single DOC-NNN
    candidate.
  - |-
    Add API-reference sub-pages for the 5 Management-tier
    controllers (cross-link to
    datasetcontroller-undocumented-dataset-openapi-tag-batch-w —
    same DOC-NNN list).
  - |-
    Build-time scanner: enumerate every GET endpoint at every
    controller and verify EITHER (a) the endpoint has a
    SecurityRule entry OR (b) the endpoint is explicitly marked
    'read-collaborative' in a documented allow-list. The current
    silent gap is too easy to grow as new endpoints land.

notes: |-
  This invariant extends the existing master
  read-collaborative-cross-owner-enumeration from 24 to 29
  surfaces by adding the 5 Management-tier read endpoints
  discovered at batch W. The architectural framing's new
  observation: the read-collaborative posture is NOT limited to
  catalog browsing surfaces — it extends to the Management-tier
  admin surfaces as well.

  This is a CRUCIAL OPERATOR-FACING NUANCE. Operators wiring RBAC
  policies for the Management surface typically reason: 'I gave
  user X DATA_SOURCE_UPDATE — they can edit datasources but cannot
  list them.' The reality is the opposite: they can list ALL
  datasources without DATA_SOURCE_UPDATE; they can't edit any
  without it. The Management-tier permissions are WRITE permissions,
  not READ permissions.

  Cross-cutting connections:
    - STRENGTHENS the master read-collaborative-cross-owner-enumeration
      (extends from 24 to 29 surfaces, with the Management-tier
      open-read posture explicitly framed)
    - Pairs with datasetcontroller-undocumented-dataset-openapi-tag-batch-w
      (the 5 controllers are the same 5 missing API-reference
      sub-pages)
    - Pairs with getpopulartaglist-open-read-plus-side-door-compose-to-write-read-directory-bypass
      (THIS BATCH — the Tag open-read is a vertex of the
      compound bypass)
    - Pairs with collector-plaintext-token-chain-controller-tier-closure
      (THIS BATCH — the Collector list returns masked tokens to
      every authenticated user; the read-collaborative posture
      includes the partially-redacted credential)

  One CONSOLIDATED DOC-NNN candidate that closes the
  Management-tier read-posture gap across all 5 surfaces:
    /features/management — single admonition section at the page
    head: 'Read posture on Management tabs: All five Management
    tabs (Namespaces, Datasources, Collectors, Owners, Tags) list
    views are visible to every authenticated user regardless of
    role. Mutating actions require the corresponding *_CREATE /
    *_UPDATE / *_DELETE permission.'

batch_zg_addendum: |-
  ## STRENGTHENS — batch ZG (2026-05-25/26, four NEW controller-class invocation sites)

    Batch ZG adds 4 NEW corroborating instances of the read-collaborative
    cross-owner enumeration posture:

      Surface 30 — DataEntityRunController.getRuns (GET /api/dataentities/{id}/runs):
        NOT in SecurityConstants.SECURITY_RULES (verified by grep over
        SecurityConstants.java:98-355 returning zero matches for `/runs`);
        no @PreAuthorize on the controller; no permissionService call in the
        service; no owner predicate in ReactiveDataEntityTaskRunRepositoryImpl
        lines 161-191. Any authenticated user reads any DQ test''s or
        transformer''s run history INCLUDING status_reason free-form text
        (which test frameworks like Great Expectations / dbt may populate
        with failed-row samples potentially containing PII). The 30th
        corroborating surface; first one with a diagnostic-text broadcast
        dimension on top of pure metadata enumeration.

      Surface 31 — DataQualityRunsController.getDataQualityTestsRuns
        (GET /api/dataqatests/runs — the CATALOG-WIDE DASHBOARD endpoint):
        NOT in SecurityConstants.SECURITY_RULES; no @PreAuthorize, no owner
        predicate in ReactiveDataQualityRunsRepositoryImpl lines 65-196.
        Any authenticated user gets the catalog-wide DQ aggregate including
        every namespace / datasource / owner / title / tag name (via the
        dashboard query''s filter completion path). The 31st corroborating
        surface — RESOLVES the previously-PROBE-NEEDED P-090 verdict in the
        data-quality-dashboard concept; backend mirrors the read-collaborative
        posture as hypothesised.

      Surface 32 — GenAIController.genAiQuestion (POST /api/genai/ask):
        NOT in SecurityConstants.SECURITY_RULES; no @PreAuthorize; no
        Permission entry exists in PolicyPermissionDto for GenAI usage.
        The catch-all .authenticated() is the entire gate. Any authenticated
        user can drive cost on the operator''s external AI account. The
        32nd corroborating surface; unique dimension: ECONOMIC cost on the
        operator''s external paid service, not just metadata enumeration.

      Surface 33 — DataSetController + DatasetFieldController class-level
        re-confirmation (no NEW endpoints; re-confirms previously-counted
        surfaces 29 + the DatasetFieldController read endpoints
        GET /enum_values + GET /metrics which were already counted under
        the master invariant). The DatasetField class-level v0.4.0 sidecar
        explicitly verifies SecurityConstants.java:282-303 contains rules
        only for the 6 MUTATION endpoints; the 2 GET endpoints fall through
        to .authenticated() — the read-collaborative posture is the design
        intent at this surface.

    THE EXPANDED COUNT: 29 → 32 distinct surfaces. The pattern continues to
    grow with every controller-class enrichment batch; the posture is
    uniform across the platform and is the load-bearing access-model
    decision (not an oversight). The standing recommendation: document the
    cross-owner-read posture on every read-side feature page (or in a single
    cross-cutting "Access model" doc page that the per-feature pages can
    cross-link to).

