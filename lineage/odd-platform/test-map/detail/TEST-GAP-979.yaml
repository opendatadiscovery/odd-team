proposed_action: |-
  Add `DataEntityRunStatusEnumAsymmetryTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `getRuns_resultSetContainsRUNNINGRow_observedBehaviour_pinsCurrentFailure` — seed a DQ-test + 1 completed run (SUCCESS) + 1 RUNNING task (end_time=NULL); GET via WebTestClient; capture the observed status — likely HTTP 500 with the message from `IllegalArgumentException("No enum constant DataEntityRunStatus.RUNNING")` propagated through ControllerAdvice. PIN the current vulnerable state — any fix flips this assertion.
  2. `getRuns_pureCompletedRuns_returns200_pinsNonRegressionPath` — seed a DQ-test + 3 completed runs (no RUNNING); GET; assert HTTP 200. Establishes the OK baseline so the bug-fix test 1 can be inverted.
  3. `dataEntityRunMapper_directInvocationWithRunningPojo_observedBehaviour_pinsMapperFailure` — direct unit-level test on the mapper: build a `DataEntityTaskRunPojo` with `status="RUNNING"`; call `dataEntityRunMapper.mapPojo(pojo)`; assert the exception OR the fallback (whichever the current impl exhibits). Locates the failure precisely at the mapper boundary.

  Pair with REFACTOR-NNN: add `RUNNING` to the wire enum, OR add a custom `@Named` MapStruct conversion that fall-back-maps RUNNING → UNKNOWN. Either fix flips the assertions in tests 1 + 3.
