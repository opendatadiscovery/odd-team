  - "tx_b_response.status in (200, 201)"
  - "len(final_ownership_set) == 3"
  - "now_activity_count - baseline_activity_count == 2"
  - "len(race_activity_rows) == 2"

  # PRIMARY ASSERTION (bug surface).
  # The LATER-committed TX's `old_state` should NOT equal the
  # EARLIER-committed TX's `new_state` (because each TX should capture
  # its OWN pre-this-mutation state, independent of other TXs).
  #
  # IF the bug exists:
  #   race_activity_rows[1].old_state == race_activity_rows[0].new_state
  #
  # IF the bug does NOT exist:
  #   race_activity_rows[1].old_state != race_activity_rows[0].new_state
  #
  # The probe encodes the bug surface — assertion expects equality
  # (current bug state). When fixed, assertion fails and surfaces the
