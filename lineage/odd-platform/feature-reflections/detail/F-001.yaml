- id: H-008
  hypothesis: "The Popular ranking is only available to authenticated users in a secured deployment (the home-page strip is gated, so the ranking data is too)."
  derivation: "Endpoint shape + the home-page UI gate: a user who sees the panel disappear under DISABLED would assume the data is gated; an operator would assume the catalog's popularity data follows the deployment's auth posture."
  seed_source: endpoint-shape
