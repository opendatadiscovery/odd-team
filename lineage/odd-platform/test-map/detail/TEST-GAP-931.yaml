  - 'IdentityController.java:25-28 (bare ResponseEntity::ok) + DisabledAuthSecurityConfiguration.java:11-19 (no header customization in DISABLED)'
  - 'Probe P-124 (stress_findings.probes_emitted) — cache-control posture across login state'
