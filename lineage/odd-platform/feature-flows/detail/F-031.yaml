control_summary: |-
  0 of 16 cells PROBED — feature MINTED this batch (ZB) from the 5
  DataSourceController endpoint-method sidecars. NINETEEN load-bearing
  drift facets, anchored on the full UI-admin DataSource lifecycle
  (list / register / update / delete / regenerate-token). The endpoint
  surface has ZERO direct test coverage at controller, service,
  repository, AND integration tiers — verified this batch: no
  DataSourceControllerTest, no DataSourceServiceImplTest, no
  TokenGeneratorImplTest (all Glob-confirmed absent). The only
  protection underneath is the repository-tier DataSourceRepositoryImplTest
  (exercises listDto at the repository tier, not the HTTP endpoint).

  The HIGHEST-LEVERAGE probe candidates, all executable on the
  maintainer's local workstation (a local docker-compose / Testcontainers
  ODD platform + Postgres stack — NO cloud infrastructure):

  (a) updateDataSource REPLACE-not-MERGE pin (P-043) — POST a complete
      data source, then PUT a body omitting `description`; assert the
      stored description is nulled. This is the operator-visible
      data-loss-on-partial-edit class; a routine global MapStruct
      IGNORE-on-null setting would silently flip REPLACE to MERGE with no
      guard. Highest priority — it is the headline drift.

  (b) regenerateDataSourceToken destructive-cutover pin (P-051) — register
      a data source, capture the token, enable
      auth.ingestion.filter.enabled, POST /ingestion/entities with the
      old token (expect non-401), rotate via PUT
      /api/datasources/{id}/token, then POST /ingestion/entities with the
      old token (expect 401) and the new token (expect non-401). Pins the
      no-grace-period contract — the single most operationally important
      uncovered behaviour.

  (c) namespace side-door regression-pin (P-039) — grant a test user only
      DATA_SOURCE_CREATE (NOT NAMESPACE_CREATE), POST /api/datasources
      with a never-seen namespace_name, then GET /api/namespaces and
      assert the row was minted. Repeat via PUT (updateDataSource side-door).

  (d) deleteDataSource cascade + orphan-token pin (P-046/P-047/P-048) —
      register a data source, attach a live data_entity, assert DELETE
      400; soft-delete the entity, assert DELETE 204; then assert (1) the
      data_source row carries deleted_at, (2) the token row is orphaned
      (still present), (3) the search_entrypoint vector is uncleared.

  (e) DISABLED-mode anonymous-mutation matrix (P-044/P-052) — bring up the
      stack with auth.type=DISABLED and assert all four mutating verbs
      (register / update / delete / regenerate-token) succeed with no
      principal; assert regenerate returns the new plaintext token.

  Probe ids P-034 through P-052 are already authored as probe skeletons
  by the 5 file-analyser sidecars (lineage/odd-platform/probes/P-0NN.yaml).
  This feature is the acceptance-target home for that probe range.

  Cross-feature coherence: F-031 LIVES INSIDE pillar P-08 Management &
  Administration as the FOURTH UI-admin lifecycle sibling alongside
  F-019 (Owner Lifecycle), F-020 (Collector Lifecycle), and F-028
  (Namespace Lifecycle) — per system-mission.md P-08 sub-feature seed
  "Datasources tab (audit, edit, link Collector + Namespace)". It is
  DISJOINT from F-008 (Batch Ingestion / S2S API): the UI-admin
  registration path POST /api/datasources is a separate endpoint +
  service class + auth model + merge semantic from the S2S
  collector-driven path POST /ingestion/datasources. The batch-W
  DataSourceController class sidecar established that disjointness as a
  counterfactual extension of F-008; F-031 is the feature for the
  UI-admin half. The token-handling posture (plaintext-everywhere,
  RandomStringUtils-not-SecureRandom, in-place destructive rotation,
  orphan-token-on-delete, audit silence) is STRUCTURALLY IDENTICAL to
  F-020 (Collector) because both rotation paths share TokenGeneratorImpl +
  ReactiveTokenRepositoryImpl — a SecureRandom / hash-at-rest /
  grace-period fix applies to both. The 200-vs-201 status drift is
  shared across F-019 / F-020 / F-028 / F-031 — a single platform-wide
  OpenAPI consistency fix.
