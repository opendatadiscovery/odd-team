name: Owner-scoped routes — controllers take NO principal parameter; principal flows
  via reactor Context
canonical_in_docs: false
canonical_candidate: false
description: 'PRIMARY-SOURCE confirmation of ADR-CANDIDATE-015. The three getMyObjects*
  methods on DataEntityController accept only (page, size, exchange); no Authentication,
  no Principal, no owner-id query/path/body parameter. Resolution happens at DataEntityServiceImpl.java:213
  via authIdentityProvider.fetchAssociatedOwner() which internally calls ReactiveSecurityContextHolder.getContext()
  (AuthIdentityProviderImpl.java:24-35). The contrast with sibling controllers'' read-collaborative
  cross-owner reads (getDataEntityDetails accepting only (id, exchange) and emitting
  identical payload for every authenticated caller) makes the deliberate asymmetry
  visible at the controller-method shape. Owner-scoped routes are intentionally NOT
  in SECURITY_RULES — they fall through to .pathMatchers(''/**'').authenticated()
  AND apply per-Owner filtering via JOIN OWNERSHIP at the SQL layer (defence-in-depth
  at the data layer, not the auth gate). Single-point-of-failure caveat: lineage variants
  (getMyObjectsWithUpstream/Downstream) do NOT apply the JOIN-side owner filter —
  they only filter the anchor set.'
