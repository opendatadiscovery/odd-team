evidence:
  - |-
    Alerts.md:understanding — 'The Alerts component is the
    page-root for ODD global Alerts surface mounted at /alerts/*
    (App.tsx:64). It is a thin shell: it dispatches one bootstrap
    thunk (fetchAlertsTotals) on mount to populate the All / My
    Objects / Dependents tab badges, then composes a fixed-page
    layout containing AlertsTabs (the three-tab primary navigation)
    and AlertsRoutes (the nested Routes that route /alerts/all,
    /alerts/my, /alerts/dependents to a single AlertsList instance
    pre-bound to the corresponding fetch* thunk).'
  - |-
    Alerts.md:upstream_callers — 'entry_point: ui_route:/alerts/*
    via App.tsx:64 (route mount, lazy import at App.tsx:36).'
  - |-
    Alerts.md:downstream_side_effects — six side-effect classes
    enumerated (external-call totals, list-fetch per tab,
    infinite-scroll, Resolve permission probe + status update,
    page-render, redirect-issue).
