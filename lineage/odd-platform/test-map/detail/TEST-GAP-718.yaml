behaviour: |-
  **CRITICAL — TermController term-to-term linkage endpoints (POST /api/terms/{term_id}/term + DELETE /api/terms/{term_id}/term/{linked_term_id}) have ZERO RBAC enforcement at any tier.** Verified by exhaustive Grep against `SecurityConstants.java` for the two paths: ZERO matches for `/api/terms/{term_id}/term` (the add-half) AND for `/api/terms/{term_id}/term/{linked_term_id}` (the delete-half). The catch-all `pathMatchers("/**").authenticated()` at `AuthorizationCustomizer.java:29-30` is the ONLY gate. The 9 OTHER write endpoints on this controller carry proper `TERM_*` SecurityRules (`SecurityConstants.java:111, 174-193` — verified line by line) — the term-to-term linkage pair is the asymmetric outlier.

  **What the Business Glossary docs claim vs what the code enforces:** the live-fetched 2026-05-20 docs page declares `TERM_UPDATE — Edit the term's name, description, namespace, or directly-linked terms.` Operators reading the docs and authoring an RBAC Policy that withholds `TERM_UPDATE` on a set of terms expecting term-to-term linking to be blocked WILL SILENTLY FAIL-OPEN — `TERM_UPDATE` is NEVER consulted on these two endpoints. Per the system-mission.md read-collaborative posture (line 267), any authenticated user can ALSO enumerate every term across every namespace; combined with the unguarded linkage write, ANY authenticated user (under LOGIN_FORM / OAUTH2 / LDAP — under DISABLED, anonymous users) can link any term in the catalog to any other term, including cross-namespace linkages that operators would expect to be team-isolated.

  **Compound failure with TermServiceImpl service-tier zero-permission-checks (batch-K invariant) + the term-mention auto-link side-channel:** the service tier carries NO `@PreAuthorize` or programmatic permission check (per batch-K — `term-service-tier-zero-permission-checks` invariant, verified by Grep returning zero matches). So bypass is two-layer: (a) the controller has no SecurityRule; (b) even if it did, the service trusts the caller blindly. There is also NO `@ActivityLog` annotation on `linkTermWithTerm` / `removeTermToLinkedTermRelation` (`TermServiceImpl.java:288-301` — separate from the gated linkage operations at lines 169, 183, 211, 225 which DO carry the annotation) — the term-to-term family is INVISIBLE to the Activity Feed (F-006 audit-silence pattern), so an attacker who exploits this has no forensic trail.

  **Pattern, not isolated gap:** the unguarded term-to-term linkage is a NEW invocation site for the path-mismatch / no-gate family that already includes REFACTOR-217 (data-entity-side `/term` singular vs `/terms` plural) and TEST-GAP-489 (REFACTOR-217 DELETE-half). REFACTOR-217 has a misregistered matcher; this gap has NO matcher at all — strictly worse. Both produce the same operator-observable surface: docs claim `TERM_UPDATE` / `DATA_ENTITY_ADD_TERM` gates work, code lets any authenticated user link unconditionally.
