- id: H-003
  hypothesis: "When an operator's deployment overlay (Helm / ConfigMap / Docker env) omits or empties `odd.data-entity-stale-period`, the stale indicator continues to work because the shipped application.yml provides a 7-day default."
  derivation: "Endpoint-shape — `@Value(\"${odd.data-entity-stale-period}\")` config binding; the feature-flow facet flagged this as needing verification against application.yml."
  seed_source: pillar + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The `@Value` at DataEntityStaleDetector.java:10 is `@Value("${odd.data-entity-stale-period}")`
      with NO `:default` fallback syntax (read directly — confirmed not `:7` and not `:#{null}`).
      The shipped application.yml:211 DOES carry `data-entity-stale-period: 7 # days`, so a STOCK
      deployment is fine. BUT Spring property resolution means an operator overlay that overrides the
      `odd:` block (or strips the line via env/ConfigMap) injects `null` into the `Integer stalePeriod`
      field. The predicate's `stalePeriod != null` guard (line 15) then returns FALSE for EVERY entity
      — the indicator dies platform-wide with no startup error, no log, no admin signal. The hypothesis
      ("continues to work because of the default") is FALSE in exactly the overlay case that production
      operators hit. This is the LSN-001 / LSN-002 silent-default family — same shape as the attachment-
      ephemeral and minio-region footguns.
    evidence:
      - sidecar: source_read_for_validation
        section: "@Value binding"
        cite: "DataEntityStaleDetector.java:10"
        note: "no :default fallback — bare ${odd.data-entity-stale-period}"
      - sidecar: source_read_for_validation
        section: shipped default
        cite: "application.yml:211"
        note: "data-entity-stale-period: 7 # days — present in stock yml, overridable away"
      - sidecar: source_read_for_validation
        section: guard
        cite: "DataEntityStaleDetector.java:15"
        note: "stalePeriod != null short-circuits to false → every entity reports is_stale=false"
    operator_visible_failure: |
      (1) An operator who manages config via Helm values / K8s ConfigMap / Docker `environment:` and
      does not carry the `odd.data-entity-stale-period` line gets a platform where the stale icon never
