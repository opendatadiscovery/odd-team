notes: |-
  New invariant captured in batch 2026-05-19J. LSN-017 is the canonical example
  of "cross-layer user-effects invisible to per-node scans" — the retro title.
  The bug exists for 1 reason: the dep-array contains a value populated by the
  effect's own fetched response, creating a self-feeding loop. No per-layer scan
  (UI-only or backend-only) catches the doubling; the empirical signal (probe
  P-004) is the only reliable surface.

  This invariant is the FIRST empirically-pinned cross-layer bug in the catalog;
  before batch J, the F-001 view_count inflation was understood as "API-level
  pumpable" without quantifying the UI-side amplification. LSN-017 quantifies
  it: +2 per page-open, not +1.
