      no check. The UI guards (RoleItem.tsx:24-25, PolicyItem.tsx:23, RoleForm.tsx:28)
      are all case-SENSITIVE `=== 'Administrator'`. Net effect: an operator who
      creates a role named `administrator` (lowercase — the partial unique index
      permits it because Postgres VARCHAR comparison is byte-for-byte case-sensitive)
