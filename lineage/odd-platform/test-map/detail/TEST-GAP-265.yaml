  - "createOwnership.md:tests_coverage_semantic.uncovered_behaviours.[5], createOwnership.md:security.known_security_gaps.[0]"
  - "OwnershipServiceImpl.md:bugs_limitations_corner_cases.[0] (REFACTOR-199 primary anchor)"
