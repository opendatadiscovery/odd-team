batch_origin_note: |-
  Net-new feature minted in batch R from the
  ReactiveActivityRepositoryImpl primary-source sidecar. Activity
  Feed is a distinct user-observable Active Platform Features
  sub-feature per system-mission.md P-07 ("Activity Feed (global
  page + per-entity tab; 7 filter facets; partition-period via
  `odd.activity.partition-period`)"). F-007 / F-009 / F-014
  occupy P-07:F-001/F-002/F-003 — Activity Feed is the next
  available slot at P-07:F-004. The repository sidecar
  related_pillar_features lookahead-cited "P-07:F-003 # Activity
  Feed sub-feature" which collides with the existing F-014
  Per-Entity Alert View; that lookahead is reconciled by minting
  F-021 at P-07:F-004 and updating cross-references.

  Per Rule 0 evaluation: the substitution from EXTEND-F-007 to
  MINT-F-021 is justified because (a) the Activity Feed is a
  USER-OBSERVABLE Active Platform surface in its own right — the
  live doc page is dedicated to it (`/features/active-platform-features/activity-feed`
  status 200), it has its own UI route, its own controller
  (ActivityController), its own service (ActivityServiceImpl), and
  its own repository (this batch); (b) F-007 carries the AlertManager
  webhook ingress contract — operators ingesting external alerts
  is a distinct user-observable contract from operators auditing
  data-entity changes; (c) the two share data (alert-received events
  write to the activity table) but encode different operator
  workflows. The cross-pillar `siblings` relationship is recorded
  in cross_pillar_relationships.

  The 13 load-bearing drift facets enumerated here close the
  audit-trail surface comprehensively at the repository tier; future
  batches refine via UI-tier (the Activity Feed page component, if
  enriched) or via probe verification of the highest-leverage probe
  candidates in `control_summary`. The batch-R related-feature
  back-links to F-006 / F-007 / F-010 / F-011 / F-014 / F-004 are
  recorded above; the corresponding batch-R extensions on
  F-006/F-007/F-010/F-011/F-004 record the back-link to F-021 in
  this batch's notes blocks.
