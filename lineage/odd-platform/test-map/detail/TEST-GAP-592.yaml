proposed_action: |-
  Parameterised unit test. shouldHandle returns: ('google'→true, 'GOOGLE'→true, 'Google'→true, 'GoOgLe'→true, 'GOOGL'→false, 'google '→false, ''→false, null→false (or NPE — pin actual), 'github'→false, 'azure'→false, 'cognito'→false, 'okta'→false). Pin the case-insensitive equalIgnoreCase contract. A regression to `.equals(...)` would silently break case-variant configurations.
