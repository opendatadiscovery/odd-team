behaviour: |-
  **MEDIUM — `ActivityController.getActivity`'s validation path uses `Flux.error(BadUserRequestException)` from the service (`ActivityServiceImpl.java:99`), wrapped by the controller as `Mono.just(<error-flux>).map(ResponseEntity::ok)` (`ActivityController.java:37-40`). The OUTER Mono successfully constructs a `ResponseEntity.ok(<error-flux>)` — `.ok()` produces a 200 status. The Flux body errors only when WebFlux subscribes to write the response body. Whether `@RestControllerAdvice.handleBadRequest(BadUserRequestException)` ACTUALLY catches this error and returns HTTP 400, or whether Spring commits HTTP 200 headers BEFORE subscribing to the body Flux (in which case the caller receives HTTP 200 with the error in the streaming body), is currently UNTESTED.** The body-subscription seam is a WebFlux internals concern that is not statically determinable.

  **Primary-source chain**:
  - `ActivityController.java:37-40` — `Mono.just(<flux from service>).map(ResponseEntity::ok)` — the OUTER Mono wraps the body Flux
  - `ActivityServiceImpl.java:98-100` — `if (beginDate == null || endDate == null) return Flux.error(new BadUserRequestException("Begin date and end date can't be null"))`
  - `controller/exception/ControllerAdvice.java:24-28` — `@ExceptionHandler(BadUserRequestException.class)` maps to HTTP 400 with ErrorResponse JSON
  - Spring WebFlux's `ResponseEntityResultHandler` subscribes to the body Flux to write it; the seam is between header commit and body subscription

  **The three possible outcomes** (per ActivityController.md:STRESS_B2):
  - **(a) Spring rescues**: HTTP 400 with ErrorResponse JSON body (per ControllerAdvice). The 200 headers were never committed because the Flux subscription failed pre-write. This is the INTENT behaviour.
  - **(b) Headers commit first**: HTTP 200 with the error materialising in the streaming body as a Reactor onError signal — client receives a 200 with a malformed JSON array or a connection-closed-mid-stream
  - **(c) Spring commits 500 with generic Internal Server Error**: the generic Exception handler catches what the BadUserRequestException handler missed due to the WebFlux body-subscription seam

  The current empirical behaviour is unknown. **Probe P-015 is emitted to measure**.

  **Operator-visible consequences**:
  - **If (a) — happy intent**: API client receives HTTP 400 with structured error; the response shape matches OpenAPI's documented error type
  - **If (b) — body-error leak**: API client gets HTTP 200 but cannot parse the response body — the OpenAPI-generated client SDK breaks because the expected `List<Activity>` shape isn't there. The SDK consumer's `getActivity(...)` call returns "" or throws a JSON parse error. Hard to diagnose because HTTP 200 implies success.
  - **If (c) — generic 500**: API client gets HTTP 500; the OpenAPI-documented 400 contract is silently broken; the error message ("Internal Server Error") leaks no information about the actual cause (null dates)

  **Why MEDIUM not HIGH (sidecar says HIGH)**:
  - The sidecar rates this HIGH because the validation-error response-shape is operator-visible
  - **We rate MEDIUM because**: (a) the actual behaviour is currently unknown (without P-015 we cannot rule out outcome (a) which would be the happy intent); (b) the test pins the CURRENT behaviour regardless of which of (a)/(b)/(c) wins — a future refactor that changes Spring version would flip the outcome without the test catching it; (c) the impact is shape-mismatch, not data-correctness

  **Connection to probe P-015**:
  - The sidecar emits P-015 to empirically determine which of (a)/(b)/(c) actually fires
  - This TEST-GAP is the regression-pin AFTER P-015 confirms the empirical outcome — the test PINS the current outcome so future Spring version upgrades are caught

  **Connection to TEST-GAP-079**:
  - TEST-GAP-079 pins the null-date validation behaviour at the SERVICE layer (BadUserRequestException raised)
  - This gap (878) pins the CONTROLLER-layer rendering of that exception across the WebFlux body-subscription seam
  - Together they fully characterise the validation-error contract end-to-end
