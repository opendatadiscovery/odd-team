control_summary: |-
  0 of 4 cells COVERED at the unit / performance / security level; integration
  is PARTIAL via the DataEntityDomainsTest DELETE-path coverage. Feature emerges
  from batch-L primary-source audit of both controller methods + the service
  implementation + the repository INSERT/DELETE + the SecurityConstants rule
  registrations. The 11 substantive drift facets cluster around three load-bearing
  themes: (1) write-collaborative DEG surface — the gate is on the CHILD entity
  not the DEG, enabling cross-owner pollution of Catalog Overview Domain tiles;
  (2) forensic silence — neither add nor delete emits an @ActivityLog event
  despite the matching `DATA_ENTITY_RELATION_UPDATED` enum value existing in
  ActivityEventTypeDto.java:12 (dead code); (3) ADD/DELETE asymmetry — different
  permissions, different idempotence contracts (400-on-duplicate-ADD vs
  204-on-no-op-DELETE), different durability (HARD-delete for user click,
  soft-delete + restore for ingestion cascade). The highest-leverage probe
  candidates are: (a) cross-owner DEG-membership write — configure two
  unrelated Owners + grant DATA_ENTITY_ADD_TO_GROUP only on entity X to user
  A who owns X, assert A can add X into a DEG owned by user B (the
  write-collaborative DEG headline); (b) soft-deleted membership re-add —
  ingest entity X into DEG Y, soft-delete X via STATUS=DELETED cascade,
  restore X, re-add X to Y, assert misleading "already in this DEG" 400
  (the soft-delete-blocks-re-add canonical case); (c) forensic-silence
  regression — POST membership write, assert GET /api/activity returns no
  DEG_RELATION_UPDATED event (pins the current behaviour against a
  silent regression in either direction). Local docker-compose probe stack is
  sufficient — ODD platform + Postgres + two seeded Owners + two seeded DEGs
  + an entity owned by Owner A.
