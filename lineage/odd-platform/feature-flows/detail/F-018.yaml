  notes: |-
    ELEVEN net-new drift facets + SEVEN STRENGTHENS on existing F-018
    facets. Ordered by architectural leverage:

    NET-NEW (11):
    (1) F-018-DRIFT-XTAGGING-update-dataset-field-tags-unset-origin-insert
    (HIGH) — the CRITICAL finding. updateDatasetFieldTags' relation INSERT
    builds TagToDatasetFieldPojo with `origin` UNSET and relies on the
    `origin varchar NOT NULL DEFAULT 'INTERNAL'` column default. If jOOQ's
    newRecord-from-pojo emits an explicit NULL the INSERT violates the
    NOT NULL constraint and the endpoint is DEAD for any non-empty `tags`
    payload. The data-entity sibling sidesteps this by explicitly calling
    .setExternal(false). Statically uncertain + untested — P-030 pins it.
    (2) F-018-DRIFT-XTAGGING-deleteTag-fts-too-late (MEDIUM) —
    TagServiceImpl.delete hard-deletes the tag_to_term rows in the
    Flux.zip BEFORE the term-side FTS refresh; the refresh's discovery
    CTE (SELECT term_id FROM tag_to_term WHERE tag_id=?) is keyed on the
    just-deleted rows, finds nothing, re-indexes zero terms. The single
    FTS refresh the delete path performs is a no-op. P-033 H2.
    (3) F-018-DRIFT-XTAGGING-deleteTag-data-entity-fts-not-refreshed
    (MEDIUM) — delete refreshes only the term-side vector; the
    data-entity-side search_entrypoint.tag_vector keeps the deleted tag's
    token (update refreshes all three; delete only one). P-033 H1.
    (4) F-018-DRIFT-XTAGGING-external-guard-data-entity-side-only (MEDIUM)
    — the !external guard on updateTag + deleteTag reads only
    boolOr(tag_to_data_entity.external); a tag whose only Collector-set
    origin is an EXTERNAL tag_to_dataset_field row passes the guard and
    can be renamed/deleted by a UI user. Cross-cuts both write paths.
    (5) F-018-DRIFT-XTAGGING-ids-param-entity-ids-misdescription (MEDIUM)
    — getPopularTagList's `ids` parameter reuses the shared IdsParam
    component ("Entity ids") but filters by tag.id (LSN-020 class).
    P-031 pins.
    (6) F-018-DRIFT-XTAGGING-updateTag-response-omits-external-usedcount
    (MEDIUM) — updateTag's response Tag omits external/usedCount (the
    bare-pojo mapToTag overload); the populating mapToTag(TagDto)
    overload is available but unused.
    (7) F-018-DRIFT-XTAGGING-tag-openapi-no-4xx-no-securityschemes
    (MEDIUM) — the `tag` OpenAPI tag declares no 4xx on any operation,
    no security: block, no securitySchemes, and is a bare name: entry.
    (8) F-018-DRIFT-XTAGGING-create-tag-in-batch-duplicate-atomicity-unverified
    (MEDIUM) — createTag's bulk INSERT (no ON CONFLICT) has unverified
    in-batch duplicate atomicity; a partial commit is a silent data-shape
    bug. P-026.
    (9) F-018-DRIFT-XTAGGING-dataset-field-tags-delete-all-recreate-churn
    (LOW) — updateDatasetFieldTags discards+rebuilds all INTERNAL
    relations on every call (no diff, unlike the data-entity path).
    (10) F-018-DRIFT-XTAGGING-three-way-activity-audit-asymmetry (MEDIUM)
    — the three relation-write endpoints have three different audit
    stories: data-entity (param-only), dataset-field (full before/after
    state), term (no @ActivityLog at all). Extends the Audit-log Presence
    Asymmetry canonicalisation candidate to a 4-surface picture.
    (11) the `tag` openapi tag's bare-name no-description / no-externalDocs
    shape — folded into facet (7); a Swagger-rendering finding (LOW).

    SEVEN STRENGTHENS on existing F-018 facets:
    — data_entity_tags_update_side_channel_into_global_tag_directory:
      X-TAGGING confirms ALL THREE relation-write endpoints at
      controller-method primary source (createTermTagsRelations
      TERM_TAGS_UPDATE + updateDatasetFieldTags DATASET_FIELD_TAGS_UPDATE
      + setDataEntityTags) — REFACTOR-223 was previously largely
      service/repository-anchored.
    — name_behavior_drift_list_most_popular...: the LSN-019 headline
      gains controller-method (getPopularTagList) AND OpenAPI-spec (`tag`
      sidecar — the description text is the wrong claim) primary-source
      tiers.
    — tag_service_tier_zero_permission_checks...: createTag / updateTag /
      deleteTag controller-method sidecars all independently cite the
      verified zero-auth TagServiceImpl posture.
    — tag_status_code_drift_controller_200_vs_spec_201...: createTag +
      updateTag sidecars + the `tag` openapi sidecar all confirm the
      200-vs-201 drift at primary source.
    — delete_tag_cascade_asymmetric_tag_to_dataset_field...: the deleteTag
      controller-method sidecar promotes this from controller-class to
      controller-method primary source + adds the available-but-unused
      deleteDatasetFieldRelations(long) fix anchor.
    — get_popular_tag_list_no_security_rule_open_read...: the
      getPopularTagList controller-method sidecar is the dedicated
      primary source for the no-GET-SecurityRule open-read posture.
    — tag_name_no_validation...: createTag + createTermTagsRelations +
      updateDatasetFieldTags sidecars confirm the no-validation gap is
      shared verbatim across all four write endpoints.

    Coherence (LSN-018 Rule 6 pre-emit sweep): STRENGTHENS=7,
    SUPERSEDES=0, CONFLICTS=0. The 7 new probes (P-025 / P-026 / P-029 /
    P-030 / P-031 / P-032 / P-033) and the LSN-020-class `ids`-parameter
    drift were grepped against the F-018 registry — all genuinely new,
    no duplicate. NO new feature minted — the seven sidecars are wholly
    within F-018's directory-CRUD + relation-write territory (the
    relation-write endpoints are the side-channels F-018 already
    enumerates; the directory CRUD is F-018's terminal surface). The
    HIGHEST-LEVERAGE finding is P-030: updateDatasetFieldTags may be
    structurally broken for every non-empty payload — a primary-source
    static read cannot resolve the jOOQ null-field-handling question, so
    the probe is load-bearing.
