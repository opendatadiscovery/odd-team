name: User-Owner Mapping
canonical_in_docs: true
canonical_candidate: false
description: 'user_owner_mapping table row — the gate that turns an authenticated
  principal (oidc_username + provider) into an Owner identity. Schema: (owner_id,
  oidc_username, provider, deleted_at). The PRIMARY mechanism for owner-scoped reads
  (getMyObjects family); also the per-data-entity authorization Policy''s anchor for
  ''is: dataEntity:owner'' scoping.'
nodes:
- odd-platform java DataEntityController controller-method:getMyObjects
contributing_files:
- odd-platform__java__DataEntityController__controller-method__getMyObjects.md
evidence:
- getMyObjects.md:concepts.entities[USER_OWNER_MAPPING row]
- getMyObjects.md:implicit_adrs.[0] (ADR-CANDIDATE-015 primary source)
- getMyObjects.md:invariants[oidc_username+provider composite key; single Mono lookup]
axes_present:
- controllers
- config_prefixes
security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: CONSISTENT
    detail: 'Single mechanism: ReactiveSecurityContextHolder.getContext() → Authentication.getName()
      + provider → SELECT user_owner_mapping WHERE oidc_username=? AND deleted_at
      IS NULL AND (provider=? OR provider IS NULL) → Owner'
  owner_scoping:
    verdict: RESPECTS
    detail: Owner-id is the principal-derived parameter passed into the OWNERSHIP
      JOIN at the SQL layer
  strengths:
  - Composite-key (oidc_username, provider) correctly isolates owner identity across
    OAuth2 providers
  - 'Single Mono lookup per request — architectural posture: one user, one Owner identity'
  - clear-active-then-insert pattern ensures only ONE active mapping per (user, provider)
  weaknesses:
  - LOGIN_FORM and LDAP both produce provider=null → cross-mode user-identity bleed
    during auth.type migrations (LOW-MEDIUM)
  - DISABLED mode = no SecurityContext = empty Flux degradation indistinguishable
    from owning-nothing
  - No fail-fast for unlinked user — 200 OK with [] body is the only signal (silent
    UX trap)
  - Per-request principal lookup (no session cache) — multiplicative on /my call rate
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - Per-request DB round-trip for principal lookup — short-lived session cache would
    eliminate this for high-RPS callers
