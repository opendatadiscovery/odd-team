      IMMEDIATELY on every selection (TestReportDetailsOverview.tsx:42-52,81-92). There is no Save
      button, no confirmation modal, no "are you sure", and the dispatch result is not awaited or
      surfaced — no success toast, no error toast, no inline state. A single click (or even a
      keyboard arrow + enter on the open select) commits the write that can flip the dataset RED.
      Compare F-019, where the methodology already flagged that the MORE-destructive owner
      operation lacked a confirmation while the reversible one had one — same inverted risk model
      here: this is among the highest-blast-radius writes in P-04 (visible cross-origin in BI
      tools) yet has the lightest-weight, zero-friction, zero-feedback control on the screen.
    evidence:
      - sidecar: '(absent — UI read for validation)'
        section: ui
        cite: 'TestReportDetailsOverview.tsx:42-52,81-92'
        note: 'AppSelect onChange dispatches write immediately; no save/confirm; dispatch result unhandled (no toast)'
        source_read_for_validation: true
    operator_visible_failure: |-
      Obvious: a mis-click or accidental arrow-key on the open dropdown silently reclassifies a
      test and can turn a green/yellow BI dashboard RED with no undo prompt and no record of who
      did it (H-001/H-006 compound this — there is not even a trail to discover the accidental
      change). Subtle: because the dispatch result is swallowed, if the write FAILS (e.g. lost
      permission, transient 5xx) the dropdown still optimistically shows the new value while the
      backend never changed it — the operator believes a severity is set that is not, and the SLA
      they expect to see never materialises, with no error surfaced. The control's weight on the
      screen does not match the weight of its consequence.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: |-
    The severity dropdown shows the test's current severity when the panel loads, so an operator
    can see the current classification before changing it.
  derivation: 'response-shape / UI-label — a select control should reflect server state on load.'
  seed_source: ui-label + response-shape
  validation:
    verdict: partial
    actual_behavior: |-
      The dropdown uses defaultValue={qualityTest?.severity || DataQualityTestSeverity.MAJOR}
      (TestReportDetailsOverview.tsx:84) — an UNCONTROLLED MUI select seeded once from the
      fetched test. For an unset test it shows MAJOR, which is consistent with the backend
      default (H-004) so the displayed value matches what the SLA actually uses — good. BUT
      because it is defaultValue (uncontrolled), the displayed value does not re-sync if the
      underlying qualityTest.severity changes after mount (e.g. a concurrent change by another
      operator, or a re-fetch) — the select keeps its mounted/last-picked value. So the control
      reflects current state ON INITIAL LOAD but can drift from server state during the panel's
      lifetime.
    evidence:
      - sidecar: '(absent — UI read for validation)'
        section: ui
        cite: 'TestReportDetailsOverview.tsx:81-92'
        note: 'uncontrolled AppSelect (defaultValue, not value) — does not re-sync to prop changes after mount'
        source_read_for_validation: true
    operator_visible_failure: |-
      In a single-operator session the initial display is correct. In a two-operator scenario (or
      after any background refresh of the test), the dropdown can show a stale severity while the
      server holds a different one; the next change the operator makes is computed from what they
      see, not from current truth, and — with no confirmation or echo (H-010) — they can overwrite
      a colleague's just-made classification without ever seeing it. Low-frequency, but the
      uncontrolled-select pattern is the mechanism behind several lost-update UX findings elsewhere
      in the platform.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-012
  hypothesis: |-
    Two operators changing the same test's severity at nearly the same moment converge on a
    well-defined final value (last write wins deterministically; no partial/torn state).
  derivation: 'resource-boundary — @ReactiveTransactional + upsert; a user expects concurrent edits to settle predictably.'
  seed_source: endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Static reading: each call is @ReactiveTransactional (DataQualityServiceImpl.java:63) and the
      write is a single-row INSERT ... ON DUPLICATE KEY UPDATE on the unique
      (DATA_QUALITY_TEST_ID, DATASET_ID) key (ReactiveDataQualityRepositoryImpl.java:90-97), which
      under Postgres serialises on the row's unique constraint, so last-committed-write should win
      with no torn state. BUT whether two concurrent transactions can deadlock or one can observe a
      serialization failure / retry under the platform's default isolation, and what the observable
      outcome + HTTP response is for the loser, requires running it — and there is no test for the
      severity write at all. Cannot be asserted from static reading alone per Rule 3.
    evidence:
      - sidecar: '(absent — source read for validation)'
        section: service+repository
        cite: 'DataQualityServiceImpl.java:63; ReactiveDataQualityRepositoryImpl.java:90-97'
        note: 'transactional single-row upsert on unique key; concurrent-outcome not determinable statically'
        source_read_for_validation: true
    operator_visible_failure: |-
      If concurrent writes can produce a serialization error surfaced as a raw 5xx, the loser
      operator gets an unexplained failure on a control that already gives no feedback (H-010). If
      last-write-wins cleanly, the only loss is the silent overwrite already covered by H-011. The
      probe distinguishes "predictable last-write-wins" (acceptable, document it) from "5xx / retry
      storm under contention" (a bug).
    severity: LOW
    confidence: LOW
    probe_id: PENDING-F-057-1
    routes_to_finding: validation-gap
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: 'probe PENDING-F-057-1'

