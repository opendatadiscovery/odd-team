      has no `termId`; edit mode when `term?.id` exists in redux. On
      mount fires `fetchTermsSearchResults({searchId, page:1, size:1000})`
      (lines 71-75) to populate `existingTerms` for client-side duplicate
      check (lines 84-94). Three Controller fields: name (required +
