behaviour: |-
  hasDescriptionRelations returns TRUE iff any of the three EXISTS subqueries match; pin the parent-status DELETED exclusion (a soft-deleted data-entity mentioning the Term does NOT block delete); pin the term-to-term path's `TARGET term not soft-deleted` filter as DIFFERENT semantics. This is the SINGLE point of enforcement for the Term-rename-protection / Term-delete-protection invariant — three nested EXISTS subqueries OR-combined at lines 409-438. The MOST IMPACTFUL regression that would land undetected at the repository layer: a refactor that drops a branch, or that flips a `STATUS.ne(DELETED)` to `STATUS.eq(DELETED)`, would let renames/deletes slip past description-mention guards — silently breaking the rename-protection contract that REFACTOR-217 already flagged as fragile.
