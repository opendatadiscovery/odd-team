behaviour: |-
  getDto(id) returns the role JOIN'd with its policies — including the edge cases of a role with zero bindings (empty `policy_relations`), a role bound to one policy, and a role bound to many policies. The empty-bindings case is particularly important because it stresses the jsonArrayAgg behavior with [null] as the empty marker — a regression in RoleRecordMapper.extractAggRelation that mishandled the [null] sentinel would propagate as an NPE or as a phantom one-element policy list.
