proposed_action: |-
  Add `DataSourceStatusCodeContractTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Two test methods:
  1. `registerDataSource_returns200_specDeclares201_pinsDrift` — POST /api/datasources with a valid body; assert the ACTUAL HTTP status is 200; pair with a comment / assertion documenting that `openapi.yaml:453-455` declares 201 for operationId `registerDataSource`.
