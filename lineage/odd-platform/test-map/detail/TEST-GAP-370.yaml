proposed_action: Add `AlertServiceImplUpdateStatusAuthTest` with two test methods —
  (a) authenticated caller with SecurityContext, assert `status_updated_by=<owner_id>`;
  (b) anonymous caller (mocked `authIdentityProvider.getCurrentUser()` returning empty),
  assert `status_updated_by=NULL` and the update STILL completes. Pin the current behaviour;
  surface the silent-attribution-gap to the maintainer.
