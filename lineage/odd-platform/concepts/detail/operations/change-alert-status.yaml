name: Change Alert Status
canonical_in_docs: true
canonical_candidate: false
description: PUT /api/alerts/{alert_id}/status — flip an alert's status to OPEN/RESOLVED/RESOLVED_AUTOMATICALLY
  via AlertStatusFormData. Service-layer reopen-guard rejects manual reopen with 400
  if an open alert of the same type already exists for the entity. AlertController.changeAlertStatus
  is the controller method; openapi-tag:alert specifies it.
axes_present:
- controllers
- openapi_tags
nodes:
