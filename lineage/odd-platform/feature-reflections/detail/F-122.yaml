    verdict: confirmed
    actual_behavior: |-
      application.yml:226-240 (source read): `management.endpoints.enabled-by-default:
      false`, then `web.exposure.include: health, prometheus, env, info`, then
      per-endpoint `enabled: true` for exactly health/prometheus/env/info. The
      `enabled-by-default: false` gate means an endpoint must be BOTH included AND
      individually enabled — so `beans`/`configprops`/`heapdump`/`threaddump` are
      off. This narrows the surface relative to a naive "expose env" config: the
      richer `/actuator/configprops` (which would dump bound Properties objects,
