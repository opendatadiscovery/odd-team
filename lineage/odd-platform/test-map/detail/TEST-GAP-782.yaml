behaviour: |-
  **HIGH — `@Value("${notifications.message.downstream-entities-depth}")` at NotificationConfiguration.java:123 has NO `:default` fallback. Operators who turn on `notifications.enabled=true` but forget to set the depth knob crash boot with Spring's generic `Could not resolve placeholder` BeanCreationException — a confusing failure mode distinct from the file's other validated paths.**

  **Asymmetric `@Value` defaults across the same file** (sidecar primary-source confirms):
  - `notifications.message.downstream-entities-depth` at L123 → `@Value("${notifications.message.downstream-entities-depth}")` — NO default → BeanCreationException if unset.
  - `odd.platform-base-url` at L105 → `@Value("${odd.platform-base-url:http://localhost:8080}")` — HAS default → silent fallback.
  - All four channel triggers (`notifications.receivers.{email.sender, slack.url, webhook.url}`) use `@ConditionalOnProperty` — NO BeanCreationException, just bean-not-registered.

  The asymmetry is unintentional inconsistency. `application.yml:174-175` SHIPS the default `notifications.message.downstream-entities-depth: 1` so an UNMODIFIED-config deployment works. But an operator overriding `application.yml` (e.g., via Helm values, ConfigMap merge, env-var substitution) and turning on `notifications.enabled=true` without supplying the depth value crashes Spring boot.

  **Operator-impact scenario**:
  1. Operator builds a custom Helm values file based on the docs.
  2. Operator sets `notifications.enabled=true` per the live `/configuration-and-deployment/odd-platform` page.
  3. Operator forgets to set `notifications.message.downstream-entities-depth` (the docs DO list it but the operator misses it).
  4. Platform fails to boot with: `BeanCreationException: Error creating bean with name 'alertNotificationMessageTranslator' ... IllegalArgumentException: Could not resolve placeholder 'notifications.message.downstream-entities-depth' in value "${notifications.message.downstream-entities-depth}"`.
  5. The error message names the placeholder but not the SOURCE (which bean's @Value caused the failure) — operator has to grep the codebase to find NotificationConfiguration.java:123.

  **Contrast with the CORRECT pattern at L105**: `@Value("${odd.platform-base-url:http://localhost:8080}")` ships a sensible default. The same file demonstrates the right way to handle the asymmetry.

  **Test gap shape**: parametrised boot-time test asserting:
  1. Boot SUCCEEDS with `notifications.enabled=true` + `notifications.receivers.email.sender=test@x` + all required keys + `notifications.message.downstream-entities-depth=2`.
  2. Boot SUCCEEDS with the same config but OMITTING `notifications.message.downstream-entities-depth` — and asserts the depth DEFAULTS TO 1 (matches application.yml:174-175). Note: under the current code this test FAILS — there is no @Value default; the YAML default supplies it. The test is meant to FAIL until a `:1` default is added at L123.
  3. Boot FAILS with the same config but OMITTING `notifications.message.downstream-entities-depth` AND overriding application.yml to remove the YAML default — expect `BeanCreationException` (CURRENT BEHAVIOUR — regression-pin).

  The compound test pins the asymmetry AND drives the fix (add `:1` default to L123 inline so the @Value carries its own default independent of YAML).
