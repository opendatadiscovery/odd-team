evidence:
  - |-
    Alerts.md:understanding — `Alerts` component is the page-root
    for ODD's global Alerts surface mounted at `/alerts/*`
    (App.tsx:64). Thin shell composing AlertsTabs + AlertsRoutes.
  - |-
    Alerts.md:concepts.invariants — 'All three tabs share
    state.alerts.items — tab switch always clears items via
    changeAlertsFilterAction'.
  - |-
    Alerts.md:implicit_adrs — three load-bearing decisions:
    (1) Tab visibility derived from owner association at UI layer;
    (2) Three list-fetch thunks share the SAME Redux slot via the
    `updateAlerts` reducer; (3) Tab-switch performs an explicit
    clear of items before the new fetch.
  - |-
    Alerts.md:downstream_side_effects — five side-effect classes
    (external-call totals, external-call list-fetch per tab,
    external-call infinite-scroll, external-call Resolve, page-
    render, redirect-issue).
  - |-
    Alerts.md:upstream_callers — entry_point: ui_route:/alerts/*
    via App.tsx:64 (route mount, lazy import at App.tsx:36).
