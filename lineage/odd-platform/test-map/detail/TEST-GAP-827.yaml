behaviour: |-
  **MEDIUM — Switching `metrics.storage` between INTERNAL_POSTGRES and PROMETHEUS is a ONE-WAY operation that makes pre-switch historical data UNREADABLE. No live doc warns operators.**

  Mechanism:
  - INTERNAL_POSTGRES writes to `metric_series` / `metric_point` Postgres tables.
  - PROMETHEUS writes to the operator's external Prometheus via remote-write.
  - Read-side routing (`metrics.storage` consumed by readers): `InternalMetricReader` reads Postgres, `ExternalMetricReader` reads Prometheus.

  **Failure modes**:
  1. **INTERNAL_POSTGRES → PROMETHEUS**: post-switch reads route through `ExternalMetricReader`, which queries Prometheus. Pre-switch metric_series rows in Postgres become INVISIBLE to the UI's per-DataEntity Metrics tab. No migration tooling exists to copy Postgres data to Prometheus.
  2. **PROMETHEUS → INTERNAL_POSTGRES**: post-switch reads route through `InternalMetricReader`, which queries Postgres. Pre-switch Prometheus series become orphaned (still in Prometheus, but ODD can't read them).

  **Live docs SILENT**: `/configuration-and-deployment/odd-platform` (WebFetched 2026-05-20 status 200) documents BOTH modes' configuration but does NOT mention the one-way migration semantics. An operator considering "let me try PROMETHEUS for performance, can roll back if it doesn't work" has NO warning that the rollback loses data.

  **Same shape as LSN-001 attachment-storage-migration drift**: a sensible-looking config change silently invalidates historical data.

  **Why MEDIUM**: rare event (operators don't switch storage backends often) BUT silent + irreversible when it happens; one operator burned per quarter is one too many.

  **Test gap shape**: integration test that:
  1. Configures INTERNAL_POSTGRES, ingests 100 metric series, asserts visible.
  2. Switches to PROMETHEUS (via property reload OR a new Spring context), ingests 50 NEW metric series.
  3. Asserts: the per-DataEntity Metrics tab shows only the 50 new PROMETHEUS series — the 100 INTERNAL_POSTGRES series are invisible (PINS the data-invisibility).
  4. Asserts: no migration tooling exists (no `MetricStorageMigrationService` class via reflection).

  Pair with REFACTOR-NNN (migration tooling or fail-fast guard) and DOC-GAP-NNN (live docs warn explicitly).
