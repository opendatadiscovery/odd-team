proposed_action: |-
  Add `CollectorIdSessionBridgeMultiInstanceContractTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods asserting cluster-safety per provider:

  1. `ingestionDataSources_underInMemoryAndNonStickyLB_secondHop_returns500_pinsClusterFragility` — two `@SpringBootTest` ApplicationContexts sharing a TestContainer PG (but NOT sharing JVM state), `session.provider=IN_MEMORY`; a custom load-balancer-style filter alternates routing 1st/2nd hops to different contexts; submit a token-bearing `POST /ingestion/datasources`; assert HTTP 500 with `IllegalStateException("Collector id is null")` in the second context's logs. PINS the cluster-fragility.

  2. `ingestionDataSources_underInternalPostgresqlAndNonStickyLB_succeeds_pinsClusterSafeAlternative` — same fixture but `session.provider=INTERNAL_POSTGRESQL`; assert HTTP 200 on both hops.

  3. `ingestionDataSources_underRedisAndNonStickyLB_succeeds_pinsClusterSafeAlternative` — same fixture but `session.provider=REDIS` with Testcontainers Redis; assert HTTP 200 on both hops.

  Add a `// CLUSTER-FRAGILITY-PIN — REFACTOR-419 third tier of primary source: the shipped default session.provider=IN_MEMORY in application.yml:30 drives the cluster-split-brain in /ingestion/datasources. This test pins the fragility under IN_MEMORY AND documents the cluster-safe providers as alternatives. Cross-link: ADR-CANDIDATE-141 facet 3.` comment block.

  Pair with: (a) DOC-GAP-NNN — live `/configuration-and-deployment/odd-platform#select-session-provider` MUST cross-link to the /ingestion/datasources bridge consequence; (b) REFACTOR-419 implementation (the actual fix is either to (1) move collector identity out of WebSession into a per-request token, OR (2) make INTERNAL_POSTGRESQL the shipped default for non-dev deployments via a deployment-profile mechanism).
