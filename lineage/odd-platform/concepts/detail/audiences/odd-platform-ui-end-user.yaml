name: ODD Platform UI End-User
canonical_in_docs: true
canonical_candidate: false
description: |-
  Authenticated platform users browsing the catalog, navigating entities,
  viewing alerts, downloading attachments, switching languages, posing GenAI
  questions, posting in-app Slack discussions, auditing platform activity, and
  inspecting the catalog-wide Data Quality Dashboard. Surfaces across every
  controller and UI sidecar.

  STRENGTHENED batch ZC (2026-05-22): adds the catalog-wide Data Quality
  Dashboard surface (/data-quality, pillar feature P-04:F-002) — reachable by
  any authenticated user via the top-bar 'Data Quality' tab (ToolbarTabs.tsx:45-49,
  rendered unconditionally) or by direct URL. The dashboard's reach makes the
  ODD Platform UI End-User a participant in the catalog-wide quality view
  whether or not their role is data-quality-focused; sensitive operators who
  should not see catalog-wide aggregates have no UI-tier gate today.
