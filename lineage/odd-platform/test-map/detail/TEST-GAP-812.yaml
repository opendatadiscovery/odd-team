behaviour: |-
  **LOW — Asymmetric SQL-parameterisation between publication-name probe + CREATE.** `NotificationSubscriber.java:133-135` uses a PreparedStatement to probe `pg_publication`: `SELECT EXISTS (SELECT oid FROM pg_publication WHERE pubname = ?)` — the `pubname` parameter is bound via `setString(1, ...)`, parameterised. `NotificationSubscriber.java:151` uses `String.formatted(...)` to build the CREATE PUBLICATION DDL — interpolated.

  **The asymmetry is structural** — Postgres bans parameterised DDL identifiers (you cannot `PREPARE create_pub AS CREATE PUBLICATION $1 FOR TABLE $2` and bind values). So the asymmetry is REQUIRED by Postgres's protocol. But it's worth noting:
  - The probe-statement gets the prepared-statement guard rail (free SQL-injection protection at the JDBC layer).
  - The create-statement does NOT — the operator-supplied `publicationName` is interpolated raw.

  **This is the structural sibling of TEST-GAP-794** (the publication-name DDL injection finding). TEST-GAP-794 covers the offensive consequence (injection); THIS gap covers the structural defensive-discipline observation (only ONE of the two statements gets the guard rail).

  **Severity is LOW because**:
  - The fix is NOT removing the asymmetry (Postgres forbids fixing the CREATE side).
  - The fix is adding validation on `publicationName` at boot — which is TEST-GAP-794's recommended REFACTOR.
  - This gap is mainly documentation: a defensive-discipline review noting that the prepared-statement guard rail is NOT comprehensive across the publication-setup code path.

  **Test gap shape**: static-analysis regression-pin asserting the parameterisation asymmetry. PINS the documented constraint.
