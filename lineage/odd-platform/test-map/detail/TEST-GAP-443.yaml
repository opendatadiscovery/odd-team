behaviour: |-
  Diamond DAG UI rendering — d3-hierarchy.hierarchy(root, childAccessor) builds a TREE, not a DAG. If entity D is reachable from root R via two paths (R to B to D and R to C to D), D appears TWICE in the rendered tree. React keys at LineageGraph.tsx:91 use position-based id so React mounts two SVG nodes. This amplifies REFACTOR-202 backend-cycle-amplification INTO the UI. Tests must pin the current behaviour AND surface the visual duplication as a known limitation (or — if the fix lands — assert d3-hierarchy is replaced with a DAG-aware layout and D renders once).
