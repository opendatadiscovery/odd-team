- id: H-009
  hypothesis: "When an API consumer reads the OpenAPI spec for getAppInfo, the spec encodes the intended security posture (e.g. that the endpoint is intentionally open under DISABLED / gated otherwise), so a reader does not assume it is unconditionally server-authenticated."
  derivation: "Doc-claim/spec seed — the feature flow's drift_class `openapi_no_security_element_on_appinfo_operation` (openapi.yaml:2704-2717 has no security: element)."
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      The OpenAPI operation `getAppInfo` (openapi.yaml:2704-2717) carries NO `security:` element,
      and the generated AppInfoApi interface has no @PreAuthorize — so the spec layer does not encode
      the "open under DISABLED, authenticated otherwise" posture at all; a reader sees an endpoint
      with no security marker and may assume it is server-authenticated. This is genuinely under-
      specified. It is tracked at SPC-002 (spec tightening for getAppInfo security: [] declaration,
      co-listed with PermissionResourceType). PARTIAL because the actual runtime posture is correct
      and now documented in prose (disabled-authentication page), but the machine-readable spec
      contract still does not express it.
    evidence:
      - sidecar: odd-platform__java__AppInfoController__controller-class__AppInfoController.md
        section: security.authorization_assertions
        cite: "openapi.yaml:2704-2717 (no security element) + AppInfoApi generated interface"
        note: "Spec encodes no security posture for getAppInfo; reader cannot infer the mode-dependent reachability."
      - sidecar: source_read_for_validation
        section: SPC-002 backlog item (workspace)
        cite: "backlog/docs/DOC-240.md:44 cross-ref to SPC-002"
        note: "SPC-002 tracks the getAppInfo security: [] spec-tightening."
    operator_visible_failure: |
      An API consumer reading the spec (or a generated SDK) cannot tell from the contract that
      /api/appInfo is reachable pre-auth under DISABLED and gated under the other three modes; they
      may build a client that assumes the endpoint is always authenticated (and breaks under
      DISABLED) or always open (and breaks under LOGIN_FORM). The runtime is correct; the spec is
      silent — a contract-vs-behaviour gap that surfaces only when the consumer reads the spec as
      truth.
    severity: LOW
    confidence: HIGH
    routes_to_finding: doc-gap-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

- id: H-010
  hypothesis: "When a user on a touch device or a keyboard-only / screen-reader user wants to see the platform version, they can open the App Info menu and read it — the disclosure that exists for the SPA is reachable by the humans it is rendered for."
  derivation: "Senior-PO UX seed (Rule 9 — 'does the user understand how to use this from what is on screen; how does it behave across device types') applied to the only user-facing render of the version."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The App Info menu opens ONLY on `onMouseEnter` of the icon button (AppInfoMenu.tsx:81) —
      there is no onClick, no onKeyDown, no onFocus. Touch-device users (iOS Safari, Android
      Chrome on phone/tablet) generate no mouseenter and cannot open the menu at all; keyboard and
      screen-reader users cannot open it either. The widget carries `aria-haspopup='true'` +
      `aria-controls` ARIA attributes that PROMISE keyboard activation the code does not wire — a
      WCAG 2.1 SC 2.1.1 (Keyboard) violation. So the version (and the operator-configured links in
      the same menu) are unreachable for an entire class of users and devices.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: bugs_limitations_corner_cases[1] + security.known_security_gaps[3]
        cite: "AppInfoMenu.tsx:78-82"
        note: "Hover-only activation; aria-haspopup/aria-controls present but no keyboard/click/focus handler — WCAG 2.1 SC 2.1.1."
    operator_visible_failure: |
      (1) A user on a phone or tablet can never open the App Info menu — the version, the
      Documentation/Slack/Feedback shortcuts, and any operator-configured navigation links are all
      unreachable. (2) A keyboard-only or screen-reader user is told by the ARIA attributes that the
      control is a popup-trigger but cannot activate it, which is both an accessibility regression
      and a broken-promise (the platform claims keyboard support it does not deliver). (3) A user
      filing a bug report cannot read the version they are asked to quote unless they are on a
      mouse-driven desktop.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: "When an operator edits the deployment's auth.type and restarts the backend, a user who already has the SPA open sees the change reflected after a normal page reload (the UI does not show a stale auth-mode-derived state indefinitely)."
  derivation: "Negative-space + UX seed — the AppInfo response is React-Query cached; the gate (Overview) and the version (AppInfoMenu) both derive from it, and AppInfoMenu uses keepMounted."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      useAppInfo() sets no staleTime, so a fresh mount refetches — a normal full page reload DOES
      pick up a changed auth.type. But the AppInfoMenu uses MUI `keepMounted` (AppInfoMenu.tsx:90)
      and there is no invalidateQueries('appInfo') anywhere in the UI, so within a single SPA
      session the menu's first-mount snapshot persists; and the Overview gate, while recomputed per
      render, only re-reads appInfo when the query refetches (on remount). So: across a full reload,
      correct; within a live session without reload, the auth-mode-derived UI can lag the actual
      deployment state. For auth.type specifically this is low-impact (operators restart the backend
      and reload), but it is the same staleness shape the sidecar flags for operator-configured links.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md
        section: stress_findings.resource_boundaries (cache) + bugs_limitations_corner_cases[2]
        cite: "AppInfoMenu.tsx:90 + lib/hooks/api/appInfo.ts:4-17"
        note: "keepMounted + no staleTime + no invalidateQueries → first-mount snapshot persists within a session."
      - sidecar: odd-platform__ts__react-component__component__Overview.md
        section: bugs_limitations_corner_cases[3]
        cite: "Overview.tsx:24-32"
        note: "appInfo not in the loading composition; gate re-reads only on query refetch (remount)."
    operator_visible_failure: |
      An operator who changes auth.type on a running deployment and tells a user 'refresh' will get
      correct behaviour on a true reload; a user who merely navigates within the SPA (no reload) may
      continue to see the old auth-mode-derived UI (e.g. the OwnerAssociation card present/absent per
      the pre-change mode) until they hard-reload. Low practical risk for auth.type (a backend
      restart forces reconnection), but a real staleness window for the same-session case.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

