control_summary: |-
  0 of 4 cells PROBED — feature MINTED this batch (V) from
  DataEntityAttachmentController class sidecar primary-source. THIRTEEN
  drift facets anchored on three load-bearing themes: (a) LSN-001 +
  LSN-002 canonical surface — the partial-remediation gap on chunk
  staging + the MinIO region default; (b) authorization + sanitisation
  gaps — read endpoints no SecurityRule, mutation endpoints discard
  data-entity-id (cross-entity privilege escalation), filename
  unsanitised (path-traversal + CRLF header injection), link URL
  unvalidated (javascript: scheme storable); (c) operational risk —
  REMOTE buffer full file to heap, chunk filename NumberFormatException
  aborts upload, no MIME validation / no quota / no rate limit.

  The HIGHEST-LEVERAGE probe candidates are:
  (a) **LSN-001 chunk-staging regression-pin** — initiate + upload
      chunk + simulate container restart (kill -9 the docker-compose
      stack) + complete + assert FAILURE. Pin the partial-remediation
      gap so a future fix to `CHUNK_BASE_PATH` parameterisation
      surfaces in test signal.
  (b) **Cross-entity URL spoofing regression-pin** — auth as user with
      DATA_ENTITY_ATTACHMENT_MANAGE on entity A + DELETE
      /api/dataentities/{A}/files/{file_id_of_B} + assert SUCCESS
      (pin the bug); after fix, assert REJECTION.
  (c) **Filename path-traversal regression-pin** — POST
      initiateFileUpload with `fileName: ../../../etc/passwd` + complete
