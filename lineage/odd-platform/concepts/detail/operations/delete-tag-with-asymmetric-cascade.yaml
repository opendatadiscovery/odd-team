security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Gated at the controller perimeter via SecurityConstants.SECURITY_RULES
      (TAG_DELETE permission). NO service-tier authorisation check.
      Per the audit pattern, controller-perimeter-only is the
      consistent platform shape for write endpoints.
  owner_scoping:
    verdict: N/A
    detail: Tag directory has no per-tag owner concept.
  strengths:
    - |-
      `!external` guard prevents UI users from deleting Collector-set
      tags (cross-method consistent with update + updateRelationsWithDataEntity).
    - |-
      @ReactiveTransactional boundary — the 6-step orchestration runs
      atomically.
  weaknesses:
    - |-
      **HIGH — cascade asymmetry**: tag_to_dataset_field rows NOT
      cleaned up; orphans persist indefinitely. See the
      `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field`
      invariant.
    - |-
      **LOW — search-vector asymmetry**: main FTS vectors not
      refreshed; deleted tag's tokens persist until next entity write.
      See the
      `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
      invariant.
    - |-
      No audit-log emission — deleteTag produces NO Activity Feed
      entry. See the
      `no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f`
      invariant.

performance_aggregate:
  overall: HIGH
  hot_paths:
    - |-
      Operator-explicit single-tag delete — typically low-frequency.
      Not a hot path under normal operation.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      The endpoint accepts a single tag_id; no bulk-delete shape
      exists. An operator deleting many tags issues one request per
      tag, each entering its own @ReactiveTransactional boundary.
  weaknesses:
    - |-
      The Flux.zip for the 2 relation deletes is concurrent — latency
      is max(deleteTermRelations, deleteDataEntityRelations) rather
      than sum. After the cascade-asymmetry fix lands, the zip would
      grow to 3 concurrent deletes — same architecture, one more arm.

notes: |-
  CAPTURED batch VAL-LSN-019 (2026-05-20). The delete operation is
  the most-asymmetric method in TagServiceImpl — TWO independent
  code-omissions live in the same method. The compound fix is the
  recommended remediation (touch both omissions in one commit).

  Cross-cutting connections:
    - Pairs with the Tag entity (lifecycle)
    - Pairs with `deletetag-cascade-asymmetric-orphans-tag-to-dataset-field`
      (cascade asymmetry)
    - Pairs with `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
      (search-vector asymmetry)
    - Pairs with `external-relations-immutable-to-ui-users-cross-method-guard-tagserviceimpl`
      (the !external guard at step 2)
    - Pairs with `no-audit-log-on-rbac-mutations` (the audit
      silence)
