  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      The leader-elected NotificationSubscriber polls the ALERT-table WAL stream, decodes
      INSERT/UPDATE messages, and synchronously calls messageProcessor.process(...), which
      translates the row to an AlertNotificationMessage and iterates the configured senders. With
      one channel configured and a well-formed alert, the single sender's .send(...) fires and the
      LSN advances. No user interaction is required — the chain is WAL-driven end to end. The
      channel-activation half ("configure a key ⇒ the channel turns on, no separate *.enabled
      flag") is pinned by ADR-0041 (AdrNotificationChannelContractTest), and the WAL-infra
      lifecycle (slot + publication created only when enabled) is the IT-011 gate. The END-TO-END
      delivery itself is real but FLAKY on fresh boot due to the PLT-139 create-order wedge
      (slot-before-publication → "publication does not exist", unrecoverable) — which is why
      IT-011 gates the lifecycle, not delivery. So the promise holds once the subsystem is past
