notes: |-
  **STRENGTHENED batch 2026-05-19M to 19-sidecar** with the anchor-set-defence
  audit family. Batch M adds 4 new surfaces (getMyObjectsWithUpstream,
  getMyObjectsWithDownstream, getDataEntityGroupsLineage, facets) confirming
  the read-collaborative posture is uniform even at endpoints DESIGNED to be
  owner-anchored.

  **STRENGTHENED batch 2026-05-20-Q to 24-sidecar** with the cross-cutting
  catalogue-read enumeration:
    - **Owner directory** (OwnersList — 20th sidecar): the FIRST OWNER-
      directory read evidence point; SecurityConstants.java:143-147 has
      only POST/PUT/DELETE rules; GET /api/owners is implicitly authenticated
      with no SecurityRule.
    - **UI shell** (AppToolbar — 21st sidecar): the FIRST UI-SHELL surface;
      the Management tab is visible to all authenticated users regardless
      of permission set; ToolbarTabs.tsx:34-82 has no permission predicate.
    - **Policy catalogue** (PolicyList — 22nd sidecar): the list is
      unconditional [no WithPermissions wrap around the row map]; non-ADMIN
      callers see only role-attached policies via the service-layer fork.
    - **Role catalogue** (RolesList — 23rd sidecar): same shape;
      principal-aware list fork at RoleServiceImpl.list lines 40-47 returns
      different row sets per caller; the UI is silent about the filter —
      a non-ADMIN with USER role sees ONE row (the USER role) and cannot
      tell from the UI that any other roles exist (misleading).
    - **Collector catalogue** (CollectorsList — 24th sidecar): GET
      /api/collectors/list is not in SECURITY_RULES; under DISABLED the
      list is anonymously reachable AND the mask-format leaks
      last-6-chars-of-token — additional informational disclosure surface.

  **Three posture sub-classes** now visible in the catalog (UPDATED batch Q):
    (1) **UNAPPLIED at every layer** — getActivity, getAllAlerts,
        getDataEntityDownstreamLineage, getDataEntityDetails,
        getDataEntityAlerts; **PLUS NEW batch Q — Owner directory + UI
        shell + 4 Management catalogue lists**; the canonical REFACTOR-024
        / 203 family expanded;
    (2) **POSITIVE-CASE-WITH-SINGLE-POINT-OF-FAILURE** —
        getMyObjectsWithUpstream / Downstream;
    (3) **APPLIED-AS-ADDITIVE-SCOPE** — facets aggregator suite;
    (4) **WIDEST-BLAST DEG-ANCHORED** — getDataEntityGroupsLineage;
    (5) **NEW batch Q — PRINCIPAL-AWARE FILTER WITH SILENT UI** —
        RolesList + PolicyList (non-ADMIN branch); the read DOES apply a
        principal filter (via filterUserRoles / getRolePolicies in-memory),
        but the UI gives NO operator-facing signal that filtering is
        happening. Distinct hazard from the unapplied case: a non-ADMIN
        operator may conclude "the platform has only one role" when in
        fact "I can only see my own role".

  STRENGTHENED batch 2026-05-19L to 15-sidecar with the per-entity
  alert-read surface — operator-recommended audit-export workaround at
  /features/active-platform-features/alerting.

  STRENGTHENED batch 2026-05-19J to 14-sidecar with three UI-layer
  realisation-point confirmations: DataEntityDetails component,
  fetchDataEntityDetails redux-thunk, and LineageGraph component family.

  The catalog now has end-to-end (UI shell → UI page → UI thunk → API →
  service → SQL) UNIFORM confirmation across TWENTY-FOUR surfaces that
  the read-collaborative posture is the platform INTENTIONAL design
  choice AND that no UI affordance compensates for the absence of
  owner-scoping in the backend.

  **Thirteen DOC-NNN candidates flow from this invariant** (one more than
  batch M — new doc gaps emerged in batch Q):
    (a) /features/alerts page: 'Who can see this' section.
    (b) /features/active-platform-features/activity-feed page: same.
    (c) /features/data-discovery/search page: 'Facet count scoping' AND
