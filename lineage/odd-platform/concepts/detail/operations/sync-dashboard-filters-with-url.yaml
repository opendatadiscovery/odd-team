security_aggregate:
  overall: LOW
  auth_modes_relevant: []
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: N/A
    detail: |-
      Client-side URL state-sync; no auth surface.
  owner_scoping:
    verdict: N/A
    detail: |-
      Sync operation — passes through whatever the operator selected.
  strengths:
    - |-
      Deep-linkable dashboard views support team collaboration use cases —
      an operator can paste a `/data-quality?...` URL into a Slack channel
      and a colleague lands on the same investigated slice.
  weaknesses:
    - |-
      Filter NAMES (not just ids) written verbatim to the URL — visible in
      browser history, server access logs, referer headers. Low-sensitivity
      catalog metadata, not credentials, but worth disclosing on a future
      docs refresh.
    - |-
      Unguarded `JSON.parse` on hand-edited / corrupt query-param values
      crashes the panel mount-effect rather than degrading gracefully.
      Severity LOW (an operator hand-editing the URL is the only realistic
      trigger; a corrupt value supplied by a shared link from a trusted
      colleague is unlikely).
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityFilters.md
  evidence:
    - DataQualityFilters.md:security.known_security_gaps.[0] (filter names in URL)
    - DataQualityFilters.md:bugs_limitations_corner_cases.[5] (JSON.parse crash on malformed query)
performance_aggregate:
  overall: HIGH
  hot_paths:
    - |-
      `replace: true` setSearchParams on every filter selection — each chip
      toggle writes the URL. Cheap (no history entry, just an address-bar
      update) but it does mean a fast-typing operator generates one URL
      update per chip. Bounded; not a perf concern.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One sync per selection event; no batching.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Client-only sync; no server resource consumption.
  strengths:
    - |-
      `replace: true` flag means the navigate stack stays clean across rapid
      filter edits — a user pressing Back after 30 filter toggles returns
      to the page they came from, not to 30 stale filter states.
    - |-
      The mount-time sync hydrates state from the URL in one pass before the
      first dashboard fetch fires (modulo the LSN-017 deeplink double-fire
      captured under `aggregate-catalog-wide-data-quality`).
  weaknesses: []
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityFilters.md
  evidence:
    - DataQualityFilters.md:downstream_side_effects.[1] (the URL update side-effect)
