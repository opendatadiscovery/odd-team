behaviour: |-
  **HIGH — `palette.runStatus[status].color` (DataQualityContent.tsx:48) throws an uncaught TypeError and blanks the WHOLE catalog-wide Data Quality dashboard if the backend returns a run-status value outside the 6-value `DataEntityRunStatus` enum.**

  The crash chain (statically certain):

  1. `useGetDataQualityDashboard(filterState)` returns `data.testResults[]` with one entry per backend category; each entry's `results[]` carries `(status, count)` pairs from the `DataEntityRunStatus` enum (`components.yaml:1407-1415` — SUCCESS, FAILED, SKIPPED, BROKEN, ABORTED, UNKNOWN).
  2. `calcTestResultsBreakdown` reduces across all categories, summing per-status counts into a `Map<DataEntityRunStatus, number>` (`DataQualityContent.tsx:28-41`).
  3. `testResultsBreakdownChartData` materialises the map for the DonutChart: each `[status, value]` entry maps to `color: palette.runStatus[status].color ?? palette.dataQualityDashboard.unknown` (`DataQualityContent.tsx:46-50`).
  4. `palette.runStatus` is typed `Record<DataEntityRunStatus, ItemColors>` (`interfaces.ts:55`) — keyed by EXACTLY the 6 enum values. If `status` is any other string (e.g. the backend ships a 7th `DataEntityRunStatus` value before the frontend types are regenerated, OR a stale `generated-sources` build, OR a malformed/proxy-injected value), `palette.runStatus[status]` is `undefined` and `.color` throws TypeError **before** the `??` evaluates.
  5. The error propagates out of the `useMemo`, React's error boundary at the route level is the AppSuspenseWrapper (NO ErrorBoundary — `App.tsx:39, 58` + `AppSuspenseWrapper.tsx:8-21`), and the whole `/data-quality` page blanks.

  The `?? palette.dataQualityDashboard.unknown` fallback is **mis-written defensive code** — it guards a missing `.color` attribute on a PRESENT entry, not a missing entry. The same risk does NOT apply to `tableHealthData` / `tableMonitoredTables` (lines 53-73), which read fixed `palette.dataQualityDashboard` keys, not status-indexed lookups.

  **Why HIGH not CRITICAL**: HIGH per Rule 3 because the SIDECAR self-classifies severity HIGH; the crash is latent (not exploitable as a security vector, no data loss), but it weaponises **any** future backend enum addition into an instant production outage on the Data Quality dashboard — a tier-1 operator surface (`docs.opendatadiscovery.org/features/data-quality/dashboard` 2026-05-22 status 200). No test exists; no type system catches it (the runtime backend can ship enum values the frontend's typed enum does not know about — that is precisely the surface that breaks).

  **Test gap shape**: an integration test mounts `<DataQuality>` inside a test router with a mocked `dataQualityRunsApi.getDataQualityTestsRuns` that returns a `DataQualityResults` whose `testResults[0].results` carries a status string NOT in `DataEntityRunStatus` (e.g. `"PENDING"` or `"TIMEOUT"`). Assertion: the dashboard renders without throwing (a graceful "unknown status" tile, or the donut excludes that slice — the test pins WHICHEVER behaviour the maintainer chooses as the correct one, but the test forces the choice).
