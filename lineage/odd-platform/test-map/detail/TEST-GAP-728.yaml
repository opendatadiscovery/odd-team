behaviour: |-
  **CRITICAL — `POST /api/datasetfields/{dataset_field_id}/terms` is gated by the WRONG permission, sister-class to the alerts-status copy-paste bug at TEST-GAP-477.** Primary-source verified at `/home/raman/work/odd/odd-platform/odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/auth/util/SecurityConstants.java:297-299`:

  ```
  new SecurityRule(DATASET_FIELD,
      new PathPatternParserServerWebExchangeMatcher("/api/datasetfields/{dataset_field_id}/terms", POST),
      DATA_ENTITY_ADD_TERM),
  ```

  The live `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions` page (WebFetched 2026-05-20, status 200 per DatasetFieldController sidecar) documents `DATASET_FIELD_ADD_TERM` as the gate for this endpoint verbatim: "Allows linking a business glossary term to a specific field within a dataset." The code wires `DATA_ENTITY_ADD_TERM` (the entity-scope permission). The permission catalog and the operative gate disagree.

  **Operator-observable consequences**:
  - An operator authoring a Role "Glossary Curator" with ONLY `DATASET_FIELD_ADD_TERM` (intended grant per docs) cannot link terms to dataset fields — the wrong permission gates the endpoint. The operation 403's, the operator is mystified.
  - An operator authoring a Role "Data Entity Manager" with `DATA_ENTITY_ADD_TERM` (intended for entity-level term-linking) ACCIDENTALLY also grants per-field term-linking on every column of every entity they can touch. The blast radius is wider than the policy author intended.

  **Why CRITICAL not HIGH**: this is a SECOND SecurityConstants wiring bug discovered in the same batch as TEST-GAP-477 (`/api/alerts/{id}/status PUT` mis-wired to `DATASET_FIELD_ADD_TERM` at SecurityConstants.java:295-296). The TWO bugs are adjacent in the file (consecutive `SecurityRule` entries — 295-296 and 297-299) — the maintainer clearly copy-pasted block 297-299 from 282-294, missed updating the permission constant on the next-to-last line, and then made the copy-paste-into-line-295 error producing the alerts bug. This is the **architectural** failure case: SecurityConstants is a static table of 13+ permissions wired to 60+ paths, the wiring is the SOLE defence on most endpoints (no service-tier @PreAuthorize per system-mission.md:267), and there is ZERO test that asserts the wiring is internally consistent. Two adjacent wiring bugs surfacing in the same batch — under the same scrutiny — strongly indicates more are latent. Compound effect: docs are the operator-visible contract, code is the actual gate; the two diverge silently.

  **Test gap shape**: regression-pin asserting (a) `POST /api/datasetfields/{id}/terms` returns 200 when the caller holds `DATA_ENTITY_ADD_TERM` but NOT `DATASET_FIELD_ADD_TERM` (PINS THE CURRENT BUG); (b) `POST /api/datasetfields/{id}/terms` returns 403 when the caller holds `DATASET_FIELD_ADD_TERM` but NOT `DATA_ENTITY_ADD_TERM` (PINS THE CURRENT INVERSION). Both inversions of the documented contract. When the fix lands (swap `DATA_ENTITY_ADD_TERM` → `DATASET_FIELD_ADD_TERM` at line 299), both tests INVERT in lockstep — that lockstep IS the verification that the wiring matches the docs.
