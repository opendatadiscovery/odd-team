proposed_action: |-
  Add `TagCreateBulkAtomicityTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Promote probe P-026 to CI:
  1. `createTag_inBatchSelfDuplicate_rollsBackAtomically_zeroRowsCreated` — `POST /api/tags` with `[{"name":"x"},{"name":"x"}]`; assert 4xx; then `GET /api/tags?query=x` returns zero rows. PINS atomic rollback (no partial commit).
  2. `createTag_crossBatchDuplicate_returns4xxNot500` — seed a tag `"existing"`; `POST /api/tags` with `[{"name":"existing"}]`; assert 4xx (NOT 500) with the UniqueConstraintException message.
  3. `createTag_mixedBatch_oneDuplicateAbortsWholeBatch` — seed `"existing"`; `POST /api/tags` with `[{"name":"novel1"},{"name":"existing"},{"name":"novel2"}]`; assert 4xx; then assert NEITHER `novel1` NOR `novel2` exists (fail-on-duplicate aborts the whole batch).
  4. `createTag_emptyBody_returns200WithEmptyList` — `POST /api/tags` with `[]`; assert HTTP 200 + empty items (the short-circuit at ReactiveAbstractCRUDRepository.java:115-117).

  If P-026 shows partial commit, tests #1 and #3 become FAILING regression-pins flagging a real bug (raise REFACTOR-NNN to add `ON CONFLICT` or a pre-flight dedup). If P-026 shows atomic rollback, the tests pin the correct behaviour.
