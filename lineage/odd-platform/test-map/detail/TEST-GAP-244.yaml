gap_id: TEST-GAP-244
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java PermissionController controller-method:getResourcePermissions
surfaced_by:
- getResourcePermissions.md:tests_coverage_semantic.uncovered_behaviours.[3] + bugs_limitations_corner_cases.[1]
behaviour: Under `auth.type=LOGIN_FORM`, the seeded admin user always receives the
  ADMIN authority — `GrantedAuthorityExtractor.getAuthorities(true)` (line 12-14)
  returns `Set.of(new SimpleGrantedAuthority(UserProviderRole.ADMIN.name()))`. `RoleServiceImpl.getCurrentUserRoles`
  falls through to `getUserProviderRole` which looks up the `Administrator` role by
  name; the seeded Administrator policy carries `ALL` on every contextual resource
  type. EVERY caller authenticates as admin and EVERY `getResourcePermissions` call
  returns the full permission set — regardless of whether the operator subsequently
  revoked policies in the UI. Operators using LOGIN_FORM for staging may believe per-resource
  gating is honoured when it is not.
