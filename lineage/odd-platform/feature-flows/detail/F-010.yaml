  notes: |-
    Three new drift facets surface, all primary-source at
    SessionConfiguration.java:1-66 + PostgreSQLSessionHousekeepingJobHandler.java:13:

    (1) **POSTGRESQL SESSION HOUSEKEEPING JOB IS THE 6TH JOB —
    F-010 FEATURE NAME UNDERCOUNTS BY ONE (MEDIUM severity —
    cross-pillar discoverability)** — The F-010 feature_name
    declares "5 jobs, every 15 minutes, ShedLock-coordinated" and
