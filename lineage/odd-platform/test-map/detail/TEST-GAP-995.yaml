behaviour: |-
  **HIGH — `/management/*` (App.tsx:62) is a SPLAT route with NO route-level permission guard.** Inside Management.tsx, the outer `<WithPermissionsProvider allowedPermissions={[OWNER_ASSOCIATION_MANAGE]}>` only provides a permission CONTEXT (per Management.tsx:9-12); it does NOT block. Each per-sub-route `WithPermissionsProvider` inside ManagementRoutes.tsx:29-149 does the same — provides context, does not block. The single route-level GUARD is `<RestrictedRoute>` around `/management/associations/*` (ManagementRoutes.tsx:101-110).

  **Eight of nine sub-areas read by ANY authenticated user**:
  - `/management/namespaces` — full namespace catalog rendered + `fetchNamespaceList` thunk fires (NamespaceList.tsx:46-48).
  - `/management/datasources` — full datasource catalog.
  - `/management/collectors` — full collector catalog.
  - `/management/owners` — full owner catalog.
  - `/management/tags` — full tag catalog.
  - `/management/roles` — full role catalog including SYSTEM-role tier.
  - `/management/policies` — full policy catalog INCLUDING `/management/policies/:id` (Policy JSON visible).
  - `/management/integrations` and `/management/integrations/:integrationId` — full integration catalog.

  **Only `/management/associations/*` is route-gated** (RestrictedRoute with `redirectTo='../namespaces'` on missing `OWNER_ASSOCIATION_MANAGE`).

  **Operator mental-model drift**: the docs at `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization` and `/permissions` (WebFetched 2026-05-26 status 200) describe 11 Management-tier permissions (COLLECTOR_*, DATA_SOURCE_*, NAMESPACE_*, OWNER_*, POLICY_*, ROLE_*, TAG_*, DIRECT_OWNER_SYNC, OWNER_RELATION_MANAGE, OWNER_ASSOCIATION_MANAGE) without ever stating that the Management UI is reachable to read by everyone authenticated. An operator forming the mental model "Management is admin-only" is wrong: the code says "any authenticated user reads everything; only Associations is admin-only".

  **The cross-pillar risk** (P-08 × P-09): The Roles / Policies / Permissions UI exposes the AUTHORIZATION CONFIG of the platform — a low-privilege user can enumerate the WHOLE RBAC matrix (policy JSON, role memberships, permission assignments) by deep-linking. This is RBAC-reconnaissance.

  **No test pins this** at any layer. A regression that ADDS a route-level gate (silently blocking the read-collaborative posture) OR REMOVES the `RestrictedRoute` around Associations (opening the audit-trail surface) ships green.

  Probe P-162 is the primary-source verifier (does the operator with no Management permissions actually reach `/management/policies/:id` and see the policy JSON?).
test_class: missing-security
criticality_rationale: |-
  Sidecar rates this HIGH; held HIGH (not CRITICAL) because: (a) the deliberate posture is documented under the read-collaborative cornerstone of REFACTOR-024; (b) no DATA-LOSS or credential-leak vector — the user reads but cannot write; (c) backend mutation endpoints are gated by SecurityConstants per the RoleController + PolicyController + NamespaceController sidecars (batches Q, W, ZD). HOWEVER the gap remains HIGH because the surface exposed (full RBAC matrix introspection) is reconnaissance-value for a malicious authenticated user, and the absence of a regression-pin test creates undetected drift risk in EITHER direction. Cross-pillar (P-08 × P-09) per Rule 3 — already at HIGH ceiling.
