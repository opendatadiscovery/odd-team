behaviour: |-
  **CRITICAL — UI route mount of `/activity` at `components/App.tsx:65` has
  NO `WithPermissionsProvider` wrapper.** The bare `<Route path={activityPath()}
  element={<Activity />} />` declaration renders the platform-wide audit-trail
  surface for every authenticated user under LOGIN_FORM/OAUTH2/LDAP, and for
  every caller able to reach the application port under `auth.type=DISABLED`.

  This is the UI-route-tier counterpart to TEST-GAP-706 (controller-tier
  ActivityController no @PreAuthorize) and TEST-GAP-083 (endpoint-tier no
  SecurityRules entry). The three together pin the chain end-to-end:

  - Backend `ActivityController.getActivity` (TEST-GAP-706) — no @PreAuthorize,
    no SECURITY_RULES match for `/api/activity` (verified ActivityController
    sidecar primary source: SecurityConstants.java:95-356, zero matches).
  - Backend default rule applies (TEST-GAP-083) — `pathMatchers('/**')
    .authenticated()` under LOGIN_FORM/OAUTH2/LDAP; `.anyExchange()
    .permitAll()` under DISABLED.
  - **UI route mount** (THIS GAP) — App.tsx:65 mounts `<Activity />` without
    `WithPermissionsProvider`, so the SPA shell loads and dispatches
    `fetchActivityList` + `fetchActivityCounts` for every caller that reaches
    the URL. Contrast App.tsx:75-87 (`lookupTablesPath()`) which IS wrapped.
  - **Even if WithPermissionsProvider WERE added** (TEST-GAP-994 cross-cutting),
    it does NOT block render — `WithPermissionsProvider.tsx:12-49` returns
    children unconditionally; it only seeds `PermissionContext` so descendants
    can gate UI actions. Adding the wrapper would NOT actually fix the gap.

  Operator-visible consequence: under DISABLED, anonymous traffic that reaches
  the application port can `GET /activity` in the browser, the SPA renders
  `<Activity />`, and `fetchActivityList` returns the platform-wide audit
  payload with `old_state`/`new_state` diffs of description text, tag
  assignments, ownership changes, custom-metadata values, dataset-field
  internal names, and business names (the full payload schema per
  ActivityController sidecar `security.data_exposure`).

  Compliance/security reviewers loading `/activity?type=ALL` (the default; the
  `defaultActivityQuery` per common.ts:36-41) see EVERY recorded change across
  EVERY owner. The `MY_OBJECTS` tab is the only owner-scoped branch
  (`ActivityServiceImpl.fetchMyActivities` consults
  `authIdentityProvider.fetchAssociatedOwner()`); `ALL` / `DOWNSTREAM` /
  `UPSTREAM` bypass owner scoping entirely.

  The doc page `https://docs.opendatadiscovery.org/features/active-platform-features/activity-feed`
  (WebFetched 2026-05-26, status 200) makes NO statement about visibility
  scoping; an operator deploying ODD with RBAC expectations from the
  `enable-security/authorization` doc has no signal that the global Activity
  page is exempt.
