name: Additional Links — no rel='noopener noreferrer' AND no URL scheme validation
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
  - P-09
description: |-
  NEW INVARIANT, batch ZE — TWO composed weaknesses on the
  operator-configured `odd.links` catalogue:

  (a) UI rendering at AppInfoMenu.tsx:60-66 sets
      `target='_blank'` but does NOT set
      `rel='noopener noreferrer'`. Any operator-configured URL can
      use `window.opener` from the opened tab to navigate the
      parent ODD Platform tab to a phishing page (reverse
      tab-nabbing).

  (b) Backend at AdditionalLinkProperties.java:8 does NOT validate
      URL scheme — operator-supplied `javascript:alert(1)`,
      `data:text/html,<script>...`, or `vbscript:...` URLs are
      passed unsanitised through LinksController.java:31-33
      (passthrough stream/map). React 17+ neutralises
      `javascript:` in <a href> at runtime, but `data:text/html`
      is admissible in many browsers and `vbscript:` is admissible
      in IE-style legacy contexts.

  THREAT MODEL — the operator-trust model assumes only the
  operator edits odd.links. In a deployment where the operator
  role is restricted (e.g. shared infrastructure team grants
  config-edit permission to ODD-application owners), a
  less-trusted role could weaponise (a) for tab-hijacking +
  weaponise (b) for cross-site-scripting style payload delivery.
  The combination is a phishing-vector amplifier rather than a
  direct exploit; severity bounded by who controls operator
  config.

  Doc drift — the live
  configuration-and-deployment/odd-platform page says
  'opening in a new tab' (matches the target='_blank') and
  'absolute URL' (matches the schema-omitted validation), but
  silently assumes operators only set http(s) URLs and never
  warns about the reverse-tabnabbing or URL-scheme vectors.

  FIX ANCHORS:
    (a) UI fix: AppInfoMenu.tsx:61 add `rel='noopener noreferrer'`
        to the `<a target='_blank'>` element;
    (b) Backend fix: add `@URL` or `@Pattern("^https?://")` to
        AdditionalLinkProperties.Link.url field; OR validate at
        @PostConstruct in AdditionalLinkConfiguration.

  Severity: MEDIUM (operator-trust amplifier; bounded by who
  controls operator config).

  ## STRENGTHENED — batch ZJ (2026-05-26)

  Batch ZJ adds the AppInfoMenu.tsx primary-source sidecar
  (odd-platform__ts__components_shared_elements_AppToolbar_AppInfoMenu__ui-shell-widget__AppInfoMenu.md)
  with a SIGNIFICANT scope-broadening: the rel-noopener gap is
  NOT only on operator-configured links (the batch ZE finding) —
  it is on ALL FIVE link sites rendered by the widget:

    - 'AppInfoMenu.tsx:41' — the GitHub link (hardcoded
      'opendatadiscovery/odd-platform')
    - 'AppInfoMenu.tsx:61' — each operator-configured `odd.links`
      entry (the batch ZE finding)
    - 'AppInfoMenu.tsx:95' — the GitBook docs link (hardcoded
      'docs.opendatadiscovery.org')
    - 'AppInfoMenu.tsx:103' — the Slack invite link (hardcoded
      'go.opendatadiscovery.org/slack')
    - 'AppInfoMenu.tsx:112' — the Product Hunt feedback link
      (hardcoded 'producthunt.com')

  All FIVE use `<Link to={...} target='_blank'>` WITHOUT
  `rel='noopener noreferrer'`. The four HARDCODED targets are
  first-party-trusted today (docs.opendatadiscovery.org,
  go.opendatadiscovery.org, github.com/opendatadiscovery,
  producthunt.com) but inherit the same `window.opener` leak
  as a defence-in-depth gap. A future XSS on any of those four
  hosts would gain lateral movement into the ODD Platform tab
  via `window.opener.navigate`.

  **Operator-trust threat model EXTENDED**: the batch ZE finding
  positioned this as an operator-config threat (operator weaponises
  odd.links). The batch ZJ broadening positions it ALSO as a
  third-party-XSS-amplifier — a future compromise of docs.opendatadiscovery.org
  (community wiki contributors) or producthunt.com (third-party SaaS)
  could pivot through the open `window.opener` reference.

  Probe P-173 emitted (batch ZJ) — UI-side probe verifying
  (a) tabnabbing-rel absence on all five link sites; (b) URL-scheme
  sanitisation behaviour for javascript:/data:/vbscript: under
  React's runtime sanitiser; (c) anonymous-DISABLED version
  disclosure in rendered DOM; (d) keyboard-activation
  inaccessibility (onMouseEnter only).

  **A sibling accessibility gap surfaces at this widget** (NOT
  security-class, but co-located): AppInfoMenu opens on
  `onMouseEnter` ONLY (line 81). No `onClick`, no `onKeyDown`,
  no `onFocus`. The ARIA attributes `aria-haspopup='true'` (line
  80) + `aria-controls={menuId}` (line 79) CLAIM keyboard support
  that does not exist. Captured separately as the
  `app-info-menu-hover-only-aria-claims-keyboard-support-absent`
  invariant (batch ZJ).

  FIX ANCHOR ADJUSTMENT (batch ZJ scope expansion):
    (a) UI fix: AppInfoMenu.tsx — add `rel='noopener noreferrer'`
        to ALL FIVE `<Link target='_blank'>` sites (lines 41, 61,
        95, 103, 112), not only line 61 as batch ZE originally
        named.

  ## STRENGTHENED — batch ZK (2026-05-26) — AdditionalLinkProperties binding-owner primary source

  Batch ZK adds the AdditionalLinkProperties config-properties-class
  primary-source sidecar (rev file-analyser/0.5.0) — the THIRD angle
  on the same composed-weakness invariant. Prior angles:
    - batch ZE: LinksController CONSUMER (the controller that serves
      odd.links to /api/links — the response-layer angle)
    - batch ZJ: AppInfoMenu UI RENDERER (the <Link target='_blank'>
      site missing rel=noopener — the DOM-emission angle, scope
      broadened to all 5 link sites at the widget)
    - batch ZK: AdditionalLinkProperties BINDING-OWNER (this batch —
      the `@ConfigurationProperties("odd")` record itself — the
      source-of-truth where operator-supplied URLs first enter the
      JVM)

  The binding-owner angle confirms and DEEPENS finding (b) from the
  binding side:

  - **NO validation annotations on the inner Link record**:
    AdditionalLinkProperties.java:8 is `record Link(String title, String
    url)` — zero JSR-303 annotations (no `@URL`, no `@Pattern`, no
    `@NotBlank`, no `@NotNull`, no `@Size`). The record-of-records
    is the SOLE binding owner of `odd.links[].{title,url}`; defence
    starts (or fails to start) here.
  - **NO `@Validated` activator on the outer record**: even if a future
    PR added JSR-303 constraints to Link's fields, they would not fire
    without `@Validated` at the AdditionalLinkProperties class level.
    Subtle gotcha for any future hardening PR.
  - **Backend-side fix anchor refined**: the fix shape from batch ZE
    ("add @URL or @Pattern at AdditionalLinkProperties.Link.url field")
    is correct AND requires the `@Validated` activator added to the
    outer class. Two-step fix, not one.

  The `stress_findings.request_inputs.[url]` analysis (DRIFT_INPUT_NAME_VS_IMPLEMENTATION,
  TRANSLATES_SILENTLY): the field name 'url' promises URL-shaped
  validation; the implementation accepts ANY String. The 'silent'
  aspect: no operator-facing surface (documentation, JSR-303 validation
  error, application log) warns about scheme restrictions or invalid
  URLs. Operator's typo (`wiki.internal` instead of
  `https://wiki.internal`) renders as `<a href="wiki.internal">` which
  the browser interprets as a relative path under the ODD host —
  clicking hits `/wiki.internal` and 404s.

  Five concrete failure-modes enumerated at the binding-owner angle:
    (1) `javascript:` URL — React 17+ strips at render but click
        handler may still fail / log console error
    (2) `data:text/html,<script>alert(document.cookie)</script>` —
        opens new tab rendering operator-supplied HTML
    (3) Empty string `url=''` — renders as `<a href=''>` (clicking
        reloads the ODD page)
    (4) `null` — produces `<a>` with no href (non-clickable; visible
        but inert)
    (5) Operator typing `wiki.internal` instead of `https://wiki.internal` —
        browser interprets as relative path

  Triangulation count rises from 2 to 3.
