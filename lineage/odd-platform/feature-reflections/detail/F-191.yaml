- id: H-008
  hypothesis: "When a user opens the compare on a pathologically wide/nested schema (e.g. 10K fields), the 'Show changes only' filter spares them the cost of transferring and rendering the unchanged fields."
  derivation: "Performance + negative-space — a senior PO asks whether the headline filter ALSO bounds the network/render cost, since the whole point of 'show changes only' on a huge schema is to cut the noise."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      It does NOT spare the transfer cost. Because showChangesOnly is a client-side prune over an
      already-downloaded full payload (H-007), the FULL diff fieldList is always fetched and held
      in memory regardless of the checkbox state (datasetApi.ts:22-32, source-read). On the backend
      side F-045 confirms the diff endpoint loads both versions' full field lists in-memory with no
      pagination and no row-count guard (DatasetVersionServiceImpl.java:156-180, diff_in_memory_
      load_no_pagination_no_row_count_guard). So for a 10K-field nested schema the cost is paid in
      full — the backend materialises everything, the wire carries everything, the browser builds
      the full tree in select(), and only the final render is filtered. The user's expectation that
      "show changes only" makes a huge diff cheap is wrong on every tier except the final paint.
    evidence:
      - sidecar: "(source read)"
        section: "datasetApi.ts"
        cite: "datasetApi.ts:22-32"
        note: "Full fieldList fetched + full tree built in select() before the client-side filter."
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController.md
        section: "performance.known_performance_gaps + bugs_limitations_corner_cases[5]"
        cite: "DatasetVersionServiceImpl.java:156-180"
        note: "Backend diff loads both versions' full field lists in-memory; no pagination/row-count guard."
    operator_visible_failure: |
      (1) On a wide/nested schema the compare page is slow to load and memory-heavy on both server
      and browser even when the user only wants the handful of changed fields — the filter does not
      help where it would matter most. (2) Pathological schemas risk exceeding
      spring.codec.max-in-memory-size on the response (F-045 performance note). This is a MEDIUM
      UX/perf caveat, not a correctness bug — the diff is correct, just not cheap.
    severity: MEDIUM
    confidence: HIGH
    source_read_for_validation: true
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

