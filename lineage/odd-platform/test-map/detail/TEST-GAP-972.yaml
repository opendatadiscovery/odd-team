behaviour: |-
  **MEDIUM — Empty-payload guard asymmetry across the 3 mutating non-datasource handlers: postDataEntityList short-circuits on `CollectionUtils.isNotEmpty(del.getItems())` (line 41) and returns 400 BadUserRequestException; postDataSetStatsList and ingestMetrics have NO empty-payload guard (lines 84-86, 92-94 are plain `body.flatMap(service::method).thenReturn(...)`). The asymmetry has no comment defending it. NO test covers the `items: []` no-op-201 path or the `items: null` NPE-in-service path for the unguarded methods.**

  Verified at primary source:
  - `IngestionController.java:41` — `postDataEntityList` guards: `if (!CollectionUtils.isNotEmpty(del.getItems())) { throw new BadUserRequestException("Ingestion payload is empty"); }`.
  - `IngestionController.java:84-86` — `postDataSetStatsList` has no guard.
  - `IngestionController.java:92-94` — `ingestMetrics` has no guard.

  **Operator-visible consequences**:
  - **`items: []` case**: postDataEntityList returns 400 ("Ingestion payload is empty"); postDataSetStatsList and ingestMetrics return 201 (silently no-op). A collector sending an empty batch as a "heartbeat" gets inconsistent error semantics across the three endpoints.
  - **`items: null` case**: postDataEntityList returns 400 (the guard fires before NPE); postDataSetStatsList and ingestMetrics throw NPE in service → propagate as 500 (per batch-Z postDataSetStatsList sidecar uncovered_behaviours[1]).
  - **Forensic ambiguity**: a 201 from postDataSetStatsList with `items: []` is INDISTINGUISHABLE from a 201 from postDataSetStatsList with `items: [a, b, c]` from the operator's perspective — both succeed.

  **Why MEDIUM**: not a security finding; semantic-correctness concern. But the inconsistency surfaces every time a collector implementation needs to decide "do I send empty batches or skip them?" — and the platform's answer differs across three sibling endpoints.

  **Distinguishes**: no prior TEST-GAP covers this specific asymmetry. NET-NEW.
