behaviour: |-
  **Soft-deleted collector leaves an orphaned TOKEN row with plaintext value persisting indefinitely.** The TOKEN table has no soft-delete column (`V0_0_28__add_token.sql:1-9` — only `id, value, created_at, created_by, updated_at, updated_by`). When a Collector is soft-deleted via the inherited `delete(id)` (`ReactiveAbstractSoftDeleteCRUDRepository:50-58` — `UPDATE collector SET deleted_at = NOW()`), the FK reference `collector.token_id` remains pointing at a TOKEN row that is now orphaned. The partial unique index `collector_token_unique ON collector(token_id) WHERE deleted_at IS NULL` (`V0_0_33__add_token_constraints.sql:1`) ALLOWS this — it only enforces uniqueness on LIVE collectors. **The TOKEN row's value is still in the table, still plaintext, still discoverable via `SELECT * FROM token`.** There is NO housekeeping job removing TOKEN rows orphaned by collector soft-delete; the row persists forever. A DB-side reader recovers historical credentials of decommissioned collectors as well as live ones. An operator-side cleanup script would need `DELETE FROM token WHERE id NOT IN (SELECT token_id FROM collector WHERE deleted_at IS NULL)`. No housekeeping job, no test, no doc-side caveat.
