- id: H-002
  hypothesis: "When two entities have the same view_count, the Popular list orders them deterministically (so paginating or refreshing does not skip or duplicate either)."
  derivation: "A ranking surface implies a stable order; the repository applies id DESC as a secondary sort."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The tiebreaker DATA_ENTITY.ID.desc() (getOrderFields, lines 945-967) makes the order
      deterministic FOR A SINGLE SNAPSHOT — equal-view_count rows sort by id DESC. However the
      read path carries NO @ReactiveTransactional and no isolation hint (DataEntityServiceImpl.java:227-231,
      single SELECT), so concurrent view_count UPDATEs from getDataEntityDetails can reorder the CTE
      result BETWEEN pages: a third-party consumer paging page=1, page=2, page=3 may see an entity on
      both page=1 and page=2 (if its count incremented past neighbours mid-walk) or miss one entirely.
      The UI consumer fetches page=1 only (size=5), so the determinism gap is latent for the home-page
      surface but real for API pagination.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: concepts.invariants[0]
        cite: "ReactiveDataEntityRepositoryImpl.java:945-967"
        note: "id DESC tiebreaker gives a deterministic single-snapshot order."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: bugs_limitations_corner_cases[8]
        cite: "DataEntityServiceImpl.java:227-231"
        note: "No transactional boundary; concurrent view_count writes reorder mid-pagination (duplicate/skip)."
    operator_visible_failure: |
      Within a single page (the UI's only fetch) the order is stable. A third-party API consumer
      iterating all Popular pages on a busy deployment can see the same entity twice or miss one,
      because view_count writes from concurrent detail-reads shift the sort under the paginator.
      No client can detect this because the response carries no pageInfo/total (bare DataEntityRef[]).
    severity: LOW
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

