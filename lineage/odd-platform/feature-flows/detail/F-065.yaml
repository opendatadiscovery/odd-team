control_summary: |-
  0 of 4 cells PROBED — feature SEEDED from SHB-065 shoebox thread +
  reaffirmed at multiple sidecar primary sources (NotificationSubscriber
  batch Y, ActivityTablePartitionManager batch K, DataCollaborationProperties
  batch ZF, application.yml). The headline behaviour — four hand-numbered
  Postgres advisory-lock IDs spread across three @ConfigurationProperties
  classes with no central registry and no boot-time collision validator
  — is a cross-cutting OPERATIONAL INFRASTRUCTURE concern that affects
  THREE pillar P-07 sub-features (F-009 Notifications, F-038 Data
  Collaboration, F-021 Activity Feed via F-010 partition rotation).

  The pillar slot is P-08:F-005 — fifth sub-feature inside Management &
  Administration, sibling to the operator-facing knobs for Roles,
  Policies, Owners, Collectors. The feature surfaces a missing
  cross-subsystem registry that operators tuning the platform encounter
  at the application.yml level.

  The HIGHEST-LEVERAGE probe candidate, executable on the maintainer's
  local workstation (per SHB-065 #1):
  (P-shb065-1) **Lock-id collision pin** — boot docker-compose ODD with
    `OVERRIDE_NOTIFICATIONS_WAL_ADVISORY_LOCK_ID=120` (deliberately
    colliding with the DataCollaboration sender lock); restart;
    observe (a) does ODD boot cleanly, (b) which subsystem actually
    acquires lock 120, (c) what does the OTHER subsystem look like
    to an operator via /actuator/beans + log lines + pg_locks.
    Pins the structural silent-deadlock contract.

  Cross-feature coherence: F-065 is the operational-infrastructure
  registry feature anchored on the system-mission.md "Platform-Internal
  Operational Infrastructure" canonicalisation candidate. Three of the
  four advisory-locks live inside P-07 features; one (partition) lives
  inside F-010 housekeeping. The registry feature provides the
  cross-cutting boot-time invariant that pillar-internal features rely
  on.
