      prior_verdict: probe-needed
      prior_probe_id: P-350
      prior_routes_to_finding: bug-candidate (recommended_log_as BUG-NNN, distinct_from PLT-085)
      changed_at: 2026-06-04T00:00:00Z
      reason: |-
        At commit 43d13eb the binding question ("which commons-lang at runtime") could not be
