proposed_canonical: LOGIN_FORM without AuthorizationCustomizer (REFACTOR-073 validated)
rationale: 'Single-sidecar canonical evidence from batch C (LoginFormSecurityConfiguration@L31).
  LOGIN_FORM mode runs `.pathMatchers("/**").authenticated()` only — no AuthorizationCustomizer
  wired (OAuth + LDAP do wire it). Combined with `getAuthorities(true)` at line 81
  (every LOGIN_FORM user is ADMIN), every form-authenticated user can call every endpoint.
  Confirms REFACTOR-073 originally surfaced via AuthorizationManagerCondition@L11
  (batch B). HIGH-priority doc + code change candidate: live `/enable-security/authorization`
  should name OAUTH2-or-LDAP as the precondition for the Policies/Permissions/Roles/Owners
  framework.'
contributing_concepts:
- LoginFormSecurityConfiguration.java:53-66 (the authorize-exchange chain without
  AuthorizationCustomizer)
- GrantedAuthorityExtractor.getAuthorities(true) — ADMIN-for-all
- AuthorizationManagerCondition@L11 (the dead Condition that was supposed to gate
  it)
suggested_add_to_docs: true
