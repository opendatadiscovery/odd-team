notes: |-
  New invariant captured in batch 2026-05-19J. The three-slice fan-out is a
  conscious normalisation choice — it lets components subscribe to the minimum
  slice they need without over-rendering. The trade-off is convention-based
  type safety: the OpenAPI-generated type owns the shape, the slice extraReducers
  own the partition, and the convention lives only in the verbatim comment at
  dataentities.slice.ts:55.

  This is well-understood; the gap is just the absence of a type-level partition
  test. Low priority but worth a 1-day cleanup when the maintainer touches the
  detail-page state model.
