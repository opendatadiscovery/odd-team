# Per-Column Annotation Editor Composition — product-owner reflection

## product_owner_narrative

The Per-Column Annotation Editor is the surface where a data curator gives a single
dataset column its *meaning* — its business name, its human description, its tags, its
allowed enum values, and its glossary-term links — without leaving the dataset's
Structure tab. The operator opens a dataset, clicks the **Structure** tab, picks a column
from the list on the left, and the right rail becomes an editor for exactly that column:
six stacked sections (header with business-name edit, read-only stats, description,
tags, enum values, glossary terms), each with its own edit affordance gated by its own
permission (per `DatasetFieldController` sidecar `understanding` + feature-flow chain
hop 1, `DatasetFieldOverview.tsx:54-98`). It is the column-level twin of the
entity-level annotation surface — same idea (annotate a catalog object), one level
deeper (a column inside a dataset).

The interaction the whole feature turns on is **field selection**. A single jotai atom,
`selectedFieldIdAtom`, is the one source of truth for "which column am I editing"
(feature-flow hop 0, `DatasetStructureOverviewProvider.tsx:35-42` hydrates it with the
first column; `DatasetStructureItem.tsx:71-74` mutates it on every row click). Clicking a
different row in the list silently re-points all six sub-editors at the new column. There
is no separate "open editor" step — selection *is* the edit context. This is convenient
for a curator sweeping across a wide table, but it is also the feature's structural
fault line: the sub-editors are mounted unconditionally and re-render against whatever
the atom currently points at, so what happens when the operator switches columns
mid-edit is the load-bearing UX question (feature-flow `observed_vs_expected`).

Every mutation the operator performs — save a description, add a tag, replace the enum
set, link a term, rename the column — routes to the **F-047 backend chain**: the seven
endpoints of `DatasetFieldController` under `/api/datasetfields/{id}/...` (feature-flow
hop 4; `DatasetFieldController` sidecar). That backend is where the column's annotations
are actually persisted, activity-logged, and search-indexed — and it is where the
documented behaviour and the implemented behaviour diverge in several places the curator
cannot see from the screen (the term-add permission gate, the enum bulk-replace
semantics, the tag delete-all-then-recreate). The composition shell is, in product
terms, the *front door* to every F-047 drift facet; the operator meets those drifts here
even though the bug lives in the backend.

The feature sits inside Data Discovery (P-01) — "annotate them with tags, statuses,
descriptions, and groupings" (`system-mission.md` P-01 one-line capability) — and shares
data with the Glossary (P-06, via the terms sub-editor) and is gated by Security (P-09,
via the six per-sub-editor permissions). A read-only user (no `DATASET_FIELD_*`
permissions) sees the whole composer with every edit affordance hidden — consistent with
the platform's read-collaborative posture, but with no banner explaining *why* the edit
buttons are gone (feature-flow drift facet
`each_sub_editor_separately_wrapped_in_with_permissions_no_composite_read_only_mode`).

In a demo, the product owner would flag three edge cases an operator hits in real use:
fast-switching between columns while a dialog is open (does the open dialog rebind or
submit against the wrong column?); the enum editor's "replace" semantics (sending a
partial set silently deletes the omitted values); and the keyboard-only path (the column
list is mouse-click-only — there is no arrow-key navigation). All three are
operator-observable, none are documented, and the most dangerous (the enum bulk-replace
and the silent term-add 403) are already tracked as **PLT-029** with a doc companion at
**DOC-193**.

