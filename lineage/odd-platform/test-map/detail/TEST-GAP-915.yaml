behaviour: |-
  **MEDIUM — the empty-state of the catalog-wide Data Quality dashboard (a fresh install with no ingested DQ tests, or a filter selection that excludes every entity) renders THREE grey "No data" donuts and ZERO category panels — distinct from both a successful render and an error state. No test pins this rendering, and the live `dashboard.md` (WebFetched 2026-05-22 status 200) makes NO statement about what the dashboard looks like with no DQ data.**

  **The empty-state chain** (statically certain):
  - `useGetDataQualityDashboard` supplies `initialData` (`dataQuality.ts:34-81`) — an all-zero `DataQualityResults` carrying 6 placeholder category names with zero-count results.
  - On a successful fetch with no real data, `data.testResults` is the empty array OR the 6-zero-count placeholders; `data.tablesDashboard.tablesHealth.{healthy,warning,error}Tables` are all 0.
  - `tableHealthData` / `tableMonitoredTables` / `testResultsBreakdownChartData` derive arrays whose values sum to 0 (`DataQualityContent.tsx:43-77`).
  - `DonutChart` self-handles the zero-total case — renders a single grey 'No data' slice (`DonutChart.tsx:88-98`).
  - `testResults.map(<TestCategoryResults>)` renders zero or six category cards depending on whether the backend returned the empty array or the zero-count placeholders.

  **What an operator sees on a fresh install**: three grey donuts and an otherwise blank or all-zero page with NO explanatory copy ("This catalog has no Data Quality tests yet. To ingest DQ tests, see ..."). The doc-side silence means an operator opening the dashboard for the first time has no signal whether the grey state is "nothing ingested" or "filter excludes everything" or "fetch failed silently" — the three are visually indistinguishable.

  **The "failed-fetch indistinguishable from empty catalog" risk** is recorded SEPARATELY in TEST-GAP-917 (a different test); THIS gap is the empty-but-honest case (no failure, just no data).

  **Why MEDIUM**: the empty-state is benign (no crash, no wrong data), but the operator-facing UX is below product standard — a fresh install opens a confusing page; the doc is silent. The sidecar self-classifies the doc-side drift LOW; bumping to MEDIUM because the integration test would also catch a regression that mistakenly renders empty content (no grey donuts) when data is genuinely absent.

  **Test gap shape**: integration test mocking `useGetDataQualityDashboard` to return both (a) the empty-array case (`testResults: []`, all-zero tablesDashboard) and (b) the zero-count placeholders case. Assertions: three DonutCharts render with the grey 'No data' slice; the legend renders; either zero or six TestCategoryResults cards render (depending on which empty-shape was returned) with zero totals.
