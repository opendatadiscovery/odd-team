notes: |-
  NEW entity captured in batch ZL (2026-05-26) FINAL refresh.
  This is the SIMPLEST pillar root enriched so far — 17 lines,
  zero state, zero effects. The template for 'pure
  presentational shell' pillar roots; contrast LookupTables.tsx
  (93 lines, full session orchestration inline) and Search.tsx
  (92 lines, three useEffects + a debouncer).

  Cross-batch: P-02 Data Modelling previously had QueryExamples
  + Relationships controller-tier sidecars but no UI page-root
  anchor; this entity fills that gap. The pillar's two sub-
  features (Query Examples + Relationships) each have their
  own primary sidecars (queryExamples + relationships route
  modules in batch ZI); this entity is the shell that surfaces
  them.
