name: Identity wire has NO provider field (positive — NOT a provider-null cross-mode bleed surface)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  **NEW POSITIVE INVARIANT, batch 2026-05-20-Q (AppToolbar primary
  source)**. The OpenAPI-generated `Identity` type at
  `components.yaml:131-139` has NO `provider` field — only `username`
  (required) + `permissions` (array of Permission enum values). This
  is a POSITIVE finding for the toolbar / SPA identity-rendering
  surfaces: they CANNOT render an auth provider string, so they
  CANNOT expose the `(null)` cross-mode bleed surface catalogued in
  F-011 batch-O drift class
  `provider_null_cross_mode_bleed_sql_primary_source`.

  **Context**: F-011 batch-O surfaced a SQL-primary-source drift on
  `user_owner_mapping.provider` being NULL for LOGIN_FORM and LDAP
  users (because the in-app login form does not populate the provider
  column). Any UI surface that renders `provider` text would expose
  the literal `(null)` string for those modes — confusing operators
  AND leaking implementation detail (raw NULL handling).

  **The AppToolbar's `owner?.name ?? identity?.username` precedence
  (AppToolbar.tsx:74)** consults ONLY username — never provider — so
  the cross-mode bleed is structurally invisible at this surface. The
  Identity wire schema's omission of provider FORCES this safety: no
  matter how a future maintainer wires the identity-render logic,
  they cannot accidentally expose provider-null.

  **Where the cross-mode bleed RISK DOES live**: the `AssociatedUser`
  type at `components.yaml:370-376` (the owner-association-request
  flow) DOES carry a `provider` field. That surface — and any UI
  component rendering an AssociatedUser — IS a potential leak path
  for the F-011 cross-mode bleed. The Management → Owners →
  Associations tab is the operator-facing surface for owner-association
  requests; it should be scrutinised separately.

  **Why this matters as an invariant**: a future refactor that adds
  `provider` to the Identity type (e.g. to support "logged in via X"
  display in the toolbar) would IMMEDIATELY become a leak surface for
  the cross-mode bleed unless the F-011 SQL drift is fixed first.
  Recording the wire-schema omission as an explicit invariant
  prevents the accidental regression.

  **Cross-batch coherence (LSN-018)**: This sidecar STRENGTHENS F-011
  by establishing that the AppToolbar (and the SPA's primary identity-
  rendering surface) is NOT in the cross-mode-bleed risk set — the
  Identity wire schema structurally prevents it. The risk continues
  to live at AssociatedUser-rendering surfaces, which need separate
  enumeration.
