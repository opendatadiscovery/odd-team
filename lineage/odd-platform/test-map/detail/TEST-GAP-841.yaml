behaviour: |-
  **HIGH — Bearer-token-shaped session UUID with no user binding. REFACTOR-344 family — extended by this batch to a new propagation surface (URL sharing / Slack-linking).** The `/search/{uuid}` URL contains the session UUID in clear visibility to:
  - The user (in their browser address bar)
  - Anyone they share the URL with (paste into Slack, save as bookmark, paste into a ticket)
  - Anyone who can read the user's browser history / clipboard
  - Anyone with network-traffic visibility (the UUID is in the URL, not just request body)

  **The server-side `search_facets` row has NO user-binding column** (per REFACTOR-344 batch-M evidence). Anyone who knows the UUID can:
  - **READ** the session via `GET /api/search/{uuid}` — sees the prior user's query text, facet selections, and result page state
  - **UPDATE** the session via `PUT /api/search/{uuid}/facets` — overwrites the prior user's facet state
  - **POISON** the session via `PUT /api/search/{uuid}/facets` with FTS-injection payload (per TEST-GAP-838 / REFACTOR-229) — every subsequent facet read 500s

  **Combined with REFACTOR-229 (FTS injection)**:
  - User A submits poisoned query, session UUID poisoned
  - User A shares Slack link with team B's analyst
  - Team B's analyst clicks link, lands on broken page (500s on facet reads)
  - Team B's analyst cannot recover (no fallback to fresh session per bugs section [7])

  **DoS amplification by sharing**: A single poisoned UUID can break every recipient's facet view. With Slack-message permanence + bookmark caches, the poisoning persists past the user's session — a 30-day-old Slack link from a poisoned session still 500s when clicked.

  **Why HIGH**:
  - **Security**: bearer-token-shaped without bearer-token semantics (no TLS-only flag, no HttpOnly cookie, no expiry beyond the 30-day TTL, no user binding for revocation)
  - **Availability**: the poisoning DoS vector propagates by social sharing — no defense
  - **Surface**: 100% of authenticated users have the bearer URL in their browser

  **Test gap shape**: Integration test that demonstrates: (a) two different users sharing a UUID can each read+update the session, (b) a poisoned UUID propagates the 500 to every subsequent caller, (c) the session has no per-user revocation path.
