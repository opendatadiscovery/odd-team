notes: |-
  NEW invariant captured in batch 2026-05-25-ZD. The open-read
  posture is INTENTIONAL but UNDOCUMENTED — the architectural
  consistency (every read-only controller is open; every
  write-only controller is gated) is internally coherent but
  not surfaced to operators.

  DOC-NNN candidate: a single admonition on the wizard live page
  + a cross-link to the security page's DISABLED caveat.
