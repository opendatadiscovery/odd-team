mitigations_unimplemented:
  - |-
    Add a separate notification_delivery_audit table with columns
    (id BIGSERIAL PK, alert_id BIGINT FK alert(id), channel VARCHAR(32),
    status VARCHAR(16) {SENT|FAILED|DROPPED|RETRIED}, attempt INT,
    body_hash VARCHAR(64), error_class VARCHAR(255), error_message TEXT,
    ts TIMESTAMP). Best-fit audit-table-bifurcation approach for the
    notification-delivery surface that AVOIDS the data-entity FK
    semantic-fit problem.
  - |-
    Widen PostgresWALMessageProcessor's signature to carry a correlation-id
    (a per-message UUID or the LSN itself) — closes Layer 6 root cause.
    Pairs with the new audit table to provide meaningful audit records.
  - |-
    Add enum values NOTIFICATION_DELIVERY_* to ActivityEventTypeDto for
    consistency with the existing categorical event types — closes Layer
    5 even though the actual storage is the new dedicated table.
  - |-
    Document the audit silence on the live notifications page — operators
    auditing "when did notifications last work" should know they have
    no platform-side answer.
  - |-
    Cross-cutting case-law: extend the F-006 audit-silence master invariant
    to include the OUTBOUND-ACTION subsystem (not just INBOUND-MUTATION
    subsystems); the 6-layer model is now the canonical structural
    explanation of audit-silence at ODD.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20Y from the
  PostgresWALMessageProcessor sidecar's primary-source evidence. EXTENDS
  the F-006 audit-silence ENUM-ROOTED master invariant from 11 categories
  (all INBOUND-MUTATION) to 12 categories with notification delivery as
  the first OUTBOUND-ACTION category included.

  The extension also surfaces a NEW STRUCTURAL LAYER (Layer 6 — SPI tier)
  — the PostgresWALMessageProcessor seam's narrow signature is the
  bridge-tier root cause for notification-delivery audit absence. Layer
  6 compounds with Layers 4 and 5 to produce a 6-layer structural
  picture of why audit silence on this subsystem is unfixable by partial
  remediation.

  Cross-cutting connections:
    - STRENGTHENS the batch-U enum-rooted invariant by adding the 12th
      category and the new Layer 6
    - Pairs with the cross-channel-runtimeexception-abort-void-return-root-cause
      invariant (also batch Y) — both findings root-cause to the
      PostgresWALMessageProcessor seam's narrow shape; the audit gap is
      one of several gaps the void+narrow-throws shape produces
    - Cross-link to F-009 drift facet no_retry_no_dlq_no_audit — the
      audit half of that facet is now PRIMARY-SOURCE pinned to this
      invariant

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the audit silence on the live notifications page
    (b) Extend the F-006 master doc-side framing from "audit covers
        data-entity events" to "audit covers data-entity events AND
        the Owner-association workflow; all other subsystems are
        unaudited"
    (c) Document the proposed notification_delivery_audit table shape
        as a future-evolution ADR (the audit-table-bifurcation pattern
        established in batch V is the precedent)
