proposed_action: |-
  Add `GenAIRateLimitPostureTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `genAiAsk_unboundedRequestFrequency_noRateLimitNoQuota_pinsCurrentPosture` — single authenticated user issues 100 sequential POSTs in 1 second; assert all 100 return HTTP 200 with no 429 / Retry-After / X-RateLimit-Remaining headers. PIN the no-limit posture.
  2. `genAiAsk_concurrentRequestsFromSameUser_allProceed_pinsAbsentConcurrencyCap` — same user fires 20 concurrent requests via `Flux.range(0, 20).parallel()`; assert all 20 reach the controller (verify via a mock external LLM counter). PIN the no-concurrency-cap posture.
  3. `genAiAsk_authTypeDISABLED_anonymousRequestFlood_noRateLimit_pinsWorstCase` — under DISABLED, anonymous caller fires 50 requests; assert all 50 reach the controller. PIN the worst-case posture (anonymous + unrate-limited + unbounded body).

  Pair with REFACTOR-NNN: introduce per-user token-bucket rate limit at the WebFlux layer + Micrometer counter for spend-tracking. Pair with DOC-NNN: surface the operator-network-policy responsibility on the live GenAI page (currently mentioned only in passing).
