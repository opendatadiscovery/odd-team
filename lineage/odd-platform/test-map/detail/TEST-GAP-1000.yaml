behaviour: |-
  **LOW — `useTermsRouteParams()` at termsRoutes.ts:60 calls `parseInt(termId, 10)` with NO `isNaN` / `Number.isFinite` guard and NO `Partial<>`-aware return shape.** Two failure modes:

  (a) **Non-numeric URL segment**: URL `/terms/foo/overview` → `termId = 'foo'` (string from useParams) → `parseInt('foo', 10) = NaN` → hook returns `termId: NaN` typed as `Term['id']` (= `number`). Downstream `TermDetails.tsx:38` dispatches `fetchTermDetails({termId: NaN})` which serialises to `termId=NaN` in the URL; backend `TermController.getTermDetails` (per the controller sidecar) returns 404 because path-bind from "NaN" to a `Long` parameter fails. The UI shows the AppErrorPage (TermDetails.tsx:80-83) — a slightly less helpful failure than "invalid term id".

  (b) **Hook reused outside `/terms/:termId/*` subtree**: TermSearch.tsx:26 calls `useTermsRouteParams` from `/termsearch/*` where React Router does NOT bind `:termId`. The destructure produces `termId = undefined`, `parseInt(undefined, 10) = NaN`, and the hook returns `{ termId: NaN, termSearchId: ... }`. TermSearch.tsx ignores the `termId` field, so the hook "works by accident". Its return shape is dishonest in this caller's context — a future TermSearch refactor that reads `termId` silently gets `NaN`.

  **Same shape as TEST-GAP-422 (DataEntityDetails parseInt NaN) and TEST-GAP-849 (LineageGraphView NaN propagation) and TEST-GAP-997 (useIntegrationRouteParams type-assertion lie)** — a PROJECT-WIDE PATTERN of `useParams<T>() as T` casts + parseInt without guards. The four findings together pin the anti-pattern across the routes/ directory.

  **No test pins either failure mode**: a regression that ADDS the `isNaN` guard (improving UX) ships green; a new TermSearch consumer that mistakenly reads `termId` ships green and emits a /api/terms/NaN request.
test_class: missing-edge-case
criticality_rationale: |-
  Sidecar rates this LOW and held LOW: (a) the current symptom is "404 + AppErrorPage", not data corruption; (b) the cross-route reuse (TermSearch.tsx) ignores termId by convention; (c) ZERO current operator-discovery evidence; (d) defence-in-depth at the backend (TermController returns 404 for unparseable IDs) bounds the impact. Logged primarily for PROJECT-WIDE PATTERN coverage — paired with TEST-GAP-422 / TEST-GAP-849 / TEST-GAP-997 (route-param type-assertion drift family). NOT escalated for cross-pillar — sticks within P-06.
