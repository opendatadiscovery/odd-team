- id: H-006
  hypothesis: "When a daily partition-creation cron (00:01) is queued behind a long-running housekeeping cycle on the shared single thread and slides past the next day's first-use window, INSERTs against the activity/message tables fail with 'no partition exists for the given key'."
  derivation: "The feature-flow's headline terminal_side_effect + drift_class cron_misfire_partition_creation_blocked_behind_housekeeping; the SchedulingConfiguration sidecar emitted P-183 for the cron-misfire mechanics."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The cron-misfire MECHANISM is real: Spring's default missed-task behaviour is
      queue-and-execute-ASAP (not skip), and the single-thread executor means a >00:01 housekeeping
      overrun queues the partition cron (PROBE-NEEDED P-183 for the empirical timing). HOWEVER
      the BLAST RADIUS the feature-flow fears (INSERT failures) is materially blunted by a fact
      the feature-flow chain omits: `PostgreSQLPartitionCreationJob` creates partitions NOT ONLY
      on the nightly cron but ALSO at boot via `@PostConstruct` behind the leader-election
      advisory lock, and `ActivityTablePartitionManager` uses `createPartitionsIfNotExists` with a
      partition WIDTH of `2 x partition-period` (default 60 days). So (a) a fresh boot immediately
      creates the needed partitions independent of the scheduler, and (b) each partition already
      spans ~60 days forward — the daily cron is a top-up, not the sole creator of the imminent
      window. The INSERT-failure scenario requires BOTH a 60-day-forward window to be exhausted
      AND the cron to be delayed past the boundary AND no replica restart in between — a far
      narrower corner than "housekeeping ran long once." (Confirmed by reading
      partition/PostgreSQLPartitionCreationJob.java:29-51 + AdrPartitionLifecycleScanTest + ADR-0028.)
    evidence:
      - sidecar: odd-platform__java__config__config-class__SchedulingConfiguration.md
        section: "stress_findings.tunables[poolSize] (PROBE-NEEDED P-183) + bugs_limitations_corner_cases[0]"
        cite: "PostgreSQLPartitionCreationJob.java:40 (cron) + HousekeepingJobManager.java:25 (15m cycle)"
        note: "Cron-misfire mechanism is static-inferred queue-and-delay; empirical timing is P-183."
      - sidecar: odd-platform__java__housekeeping__job__ActivityEmptyPartitionsHousekeepingJob.md
        section: "dependencies_semantic.requires-config[odd.activity.partition-period] + coupling"
        cite: "ActivityTablePartitionManager.java:11 (partition-period=30 -> 60-day width)"
        note: "60-day-forward partition width means the daily cron is a top-up; the imminent window is rarely the one being created tonight."
    operator_visible_failure: |
      The catastrophic INSERT-failure-on-activity scenario from the feature-flow headline is
      a NARROW corner, not the default expectation: it needs the 60-day-forward window
      exhausted AND the cron delayed past the boundary AND no boot/restart having re-created
      the window. The realistic operator-visible consequence is milder: partition-creation
      runs LATE (minutes-to-hours after 00:01) under sustained backlog, with no metric to
      observe the lateness (P-183 confirms the queueing; H-009 covers the metric gap). The
      severity downgrade vs the feature-flow headline is itself the finding — the chain
