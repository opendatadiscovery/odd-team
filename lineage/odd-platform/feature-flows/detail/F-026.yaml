  contributing_nodes_added:
  - odd-platform java R2DBCConfiguration config-class:R2DBCConfiguration
  notes: |-
    Five new drift facets surface, all primary-source at
    R2DBCConfiguration.java:1-121 + V0_0_86__create_schema_and_tables_for_custom_tables.sql:53:

    (1) **CUSTOM CONNECTION POOL WITH `?schema=lookup_tables_schema`
    URL QUERY-PARAM INJECTION (HIGH structural confidence —
    POSITIVE invariant, doc-anchored)** — R2DBCConfiguration.java:24-25
    declares `public static final String SCHEMA_PART_FOR_CUSTOM_DB_URL = "schema"`
