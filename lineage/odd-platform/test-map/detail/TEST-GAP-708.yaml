proposed_action: |-
  Add `AppInfoControllerDisabledModeFingerprintingTest` with three regression-pin methods:
  (a) `getAppInfo_authTypeDisabled_anonymousCallerReceivesProjectVersionAndAuthType_pinsFingerprintSurface`: configure `@TestPropertySource(properties = {"auth.type=DISABLED"})`; WebTestClient (NO authentication) GET `/api/appInfo`; assert response status 200; assert body contains both `projectVersion` (non-null, non-empty) AND `authType` equal to "DISABLED". Pins the current fingerprinting surface.
  (b) `getAppInfo_authTypeLoginForm_unauthenticatedCallerReceives302Or401_pinsAuthenticatedModeBehaviour`: configure `auth.type=LOGIN_FORM`; WebTestClient (no session) GET `/api/appInfo`; assert response is 302 (redirect to login) or 401 (Unauthorized) — NOT 200. Pins the authenticated-mode behaviour so a future regression that whitelists `/api/appInfo` is caught.
  (c) `getAppInfo_authTypeOAuth2OrLdap_authenticatedCallerReceives200WithCorrectAuthType`: configure `auth.type=OAUTH2` (or LDAP); WebTestClient with a valid session GET `/api/appInfo`; assert response 200, body's `authType` equals "OAUTH2" verbatim (the round-trip behaviour). Pins the no-normalisation contract (per AppInfoController.md implicit_adrs[1]).
  Add `// REGRESSION-PIN — AppInfoController under auth.type=DISABLED is anonymously reachable and exposes both projectVersion and authType — a high-signal-density fingerprint surface. The live enable-security docs do NOT disclose this. Pair with DOC-GAP-NNN that adds the caveat. If a future maintainer whitelists /api/appInfo into WHITELIST_PATHS (breaking authenticated-mode behaviour) OR removes the projectVersion field (breaking the SPA AboutMenu), test (b) or (a) will catch the change.` comment block.
