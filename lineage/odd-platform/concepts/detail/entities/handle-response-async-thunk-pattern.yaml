security_aggregate:
  overall: MEDIUM
  weaknesses:
  - 'AppError reflection — backend response URL surfaces in <AppErrorPage> banner
    via AppError.url field; for deployments exposing the platform directly this
    reveals internal API paths'
  - 'Generic error fallback message — AppError.message falls back to literal
    "An error occurred" when backend returns non-JSON body; a 502/504 becomes the
    same opaque banner as a real 404'
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - 'No requestId-based stale-response protection — rapid entity-id switching can
    produce stale-payload writes to byId state'
  - 'No retry, no debounce, no in-flight de-dup at the helper layer — each thunk
    instance is fire-and-await'
notes: |-
  New concept captured in batch 2026-05-19J. The handleResponseAsyncThunk wrapper
  IS the project's standard for async data-fetching — every UI fetch flows through
  it. Maintainer should consider:
    (a) Surfacing `requestId`-based stale-response protection in the wrapper —
        Redux Toolkit ships this out of the box; opt-in via thunkAPI.requestId
        check in extraReducers would prevent stale-payload writes.
    (b) Standardising error-message rendering across the codebase — the generic
        "An error occurred" fallback hides backend diagnostics; operators
        debugging from the UI have less signal than they could.
    (c) Documenting the pattern in /developer-guides for contributors writing
        new thunks — today the pattern is reverse-engineered from existing thunks.
