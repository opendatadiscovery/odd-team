behaviour: |-
  Cross-owner enumeration via Lineage tab — the UI fetches via getDataEntityDownstreamLineage / getDataEntityUpstreamLineage (thunks.ts:19, 36) hitting LineageServiceImpl.getLineage — the NEGATIVE case of the anchor-set defence-in-depth pattern. Any authenticated user (anonymous under DISABLED) can click into the Lineage tab on any entity and read the full reachable subgraph including edges into entities owned by other teams. The UI provides no restricted-view mode, no show-only-my-owners toggle. Tests must pin the bypasses-owner-scoping behaviour AND — when the fix lands (anchor-set defence) — pin that the UI uses the my-objects-with-lineage endpoint variant.
