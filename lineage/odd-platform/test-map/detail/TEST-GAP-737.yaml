behaviour: |-
  **HIGH — `POST /api/owners/mapping` (the MANUAL-mapping flow) allows an Admin holding `OWNER_RELATION_MANAGE` to bind ANY `(oidcUsername, provider)` tuple to ANY `ownerId` without (a) the target user's consent, (b) verification that the user identity actually exists in the auth source, (c) any disclosure on the live docs.** Primary-source confirmed in the batch-V OwnerAssociationRequestController sidecar:

  - **Endpoint** (`OwnerAssociationRequestController.java:65-72`): `createUserOwnerMapping(formData)` — accepts a `UserOwnerMappingFormData` carrying `{ oidcUsername, provider, ownerId }`. The Admin chooses ALL three fields.
  - **Service** (`OwnerAssociationRequestServiceImpl.java:109-114, 131-148`): the service creates a USER_OWNER_MAPPING row directly + writes a `REQUEST_MANUALLY_APPROVED` activity row.
  - **No existence verification**: there is NO check that a user with `(oidcUsername, provider)` actually exists in the platform's auth source (LDAP, OIDC provider, LOGIN_FORM password table). The Admin can bind a NON-EXISTENT user identity. A typo creates a dangling mapping; a deliberate non-existent identity creates a permanent dangling row.
  - **No consent**: the target user is NOT notified, NOT asked. The mapping takes effect on the target user's NEXT login.
  - **Side-effect — silent cancellation of colliding requests**: `OwnerAssociationRequestServiceImpl.java:144-145` calls `cancelAssociationByOwnerId + cancelAssociationByUsername` — every PENDING request from the target user OR for the target owner is silently DECLINED with `REQUEST_MANUALLY_APPROVED` audit-type framing. The cancellation activity-log entries are written, but the cancelled-request authors are NOT notified.

  **Self-bind escalation**: an Admin holding `OWNER_RELATION_MANAGE` can give THEMSELVES an extra Owner binding:
  ```
  POST /api/owners/mapping
  { "oidcUsername": "admin-username",   # Admin's own identity
    "provider": "OAUTH2_GOOGLE",         # Admin's own provider
    "ownerId": 42 }                      # ANY Owner id (e.g. the most-privileged Owner)
  ```
  The result: the Admin is now bound to Owner 42. Owner 42's attached Roles + Policies now grant the Admin those permissions in the per-request resolution chain. The only audit trace is a `REQUEST_MANUALLY_APPROVED` row that THE ADMIN THEMSELVES authored. There is no second-Admin-approval required, no detection mechanism for self-bind, no rate-limit. **An Admin can escalate to ANY Owner's privileges in one HTTP call** — and the audit-trail does not flag this as suspicious (the row looks like any operator-curation event).

  **Doc-drift**: the live `documentation/docs/configuration-and-deployment/enable-security/authorization/user-owner-association.md` page (WebFetched 2026-05-20 status 200 per sidecar) describes ONLY the SELF-request → Admin-approve flow. The MANUAL-mapping flow is **doc-invisible**. An operator reading the doc to understand "how my user gets associated with an Owner" cannot discover that Admins can bind users unilaterally. The compound (no consent + no existence check + no disclosure + self-bind possible) makes this a MEDIUM-severity-individual-finding aggregated to HIGH at gap-priority due to the cross-pillar reach + audit-disclosure asymmetry.

  **Why HIGH not CRITICAL**: the precondition is `OWNER_RELATION_MANAGE` — a MANAGEMENT permission typically granted to Admin/superuser Roles. An attacker compromising an Admin account has many escalation paths already; this is one. The CRITICAL escalation chain is TEST-GAP-729 (DIRECT_OWNER_SYNC, requires only the permission, not OWNER_RELATION_MANAGE). HIGH because: (a) audit-trail does not flag self-bind; (b) docs do not disclose the flow; (c) operators cannot author RBAC policies that prevent self-bind (the only way is to NOT grant OWNER_RELATION_MANAGE to anyone — impractical for operator workflows).

  **Test gap shape**: regression-pin asserting (a) MANUAL-mapping accepts non-existent oidcUsername + provider tuples; (b) Admin can self-bind to any Owner; (c) the audit-trail `REQUEST_MANUALLY_APPROVED` row is the only forensic record. Pin the contract; future Admin-on-Admin-approval or self-bind-prevention REFACTORs break the test.
