mitigations_unimplemented:
- |-
  Code-side: validate parent-child relationship in
  `DatasetFieldServiceImpl.updateStatistics` — for each resolved
  `dataset_field` row, verify its parent dataset's ODDRN matches the
  declared `dataset_oddrn` in the containing DataSetStatistics. Throw
  `BadUserRequestException` on mismatch. Surface affected count in the
  response body.
- |-
  Code-side: add `@ActivityLog(event = DATASET_FIELD_STATS_UPDATED)` to
  `DatasetFieldServiceImpl.updateStatistics`. Same shape as sibling
  `updateDatasetFieldTags` line 119. Closes the audit-trail gap.
- |-
  Code-side: add a per-field owner-scoping check — require the caller's
  associated Owner (when authenticated) to have write permission on the
  field's parent dataset's datasource. Composes with the
  AUTH-MODE-ORTHOGONAL fix (requires the path to be brought under auth
  in the first place).
- |-
  Doc-side: extend the Data Quality page's reference to
  POST /ingestion/entities/datasets/stats with the parent-child contract
  explicitly: the payload's dataset_oddrn is the FTS-recalc anchor; the
  per-field stats are written by FIELD ODDRN regardless of the parent;
  this is a writes-by-ODDRN contract, not a writes-under-the-named-dataset
  contract.
severity: HIGH
