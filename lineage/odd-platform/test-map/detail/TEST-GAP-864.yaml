behaviour: |-
  **MEDIUM — `listMostPopular(page, size)` has UNGUARDED boundary parameters at every layer (controller, service, repository). The page and size arguments flow directly into `paginate(...)` which constructs `LIMIT size OFFSET (page-1)*size` SQL. Degenerate inputs surface as: size=0 → empty page (with `total` correctly reflecting underlying count); size=-1 → PostgreSQL SQL state 22023; page=0 → `(0-1)*size = -size` → negative OFFSET → SQL state 22023; size=100000 → executes full-directory UNION-ALL CTE with no upper bound (DoS-amp); page=null / size=null → NumberFormatException at autoboxing.** No test pins the boundary contract; an SDK consumer submitting `size=0` (legitimate "I want the total count") gets an empty data array — possibly unexpected. An attacker submitting `size=100000` triggers a full directory aggregation per call.

  **Boundary behavior catalogue** (per the three sidecars' stress_findings):

  | Input | Behavior | Source |
  |---|---|---|
  | `size=0` | `LIMIT 0` → empty data; `_total` (COUNT() OVER()) correctly reflects underlying count | A2 + S-C-5 |
  | `size=-1` | `LIMIT -1` → PG raises SQL state 22023 → 500 to caller | A2 |
  | `size=100000` | Full-directory UNION-ALL CTE; no upper bound; DoS amp | A2 + performance.known_performance_gaps.[no-size-clamp] |
  | `size=null` | NumberFormatException at WebFlux parameter binding → 400 to caller | tunables[size] + A1 |
  | `page=0` | `OFFSET = -size` → PG raises SQL state 22023 → 500 to caller | A1 + S-C-6 |
  | `page=-1` | `OFFSET = -2*size` → same as page=0 | A1 |
  | `page=null` | Autobox throws NumberFormatException → 400 | A1 |
  | `size=N+1` (N = total tags) | Full directory returned in correct count-DESC order (LSN-019 only manifests when N > size) | tunables[size].questions[1].a |

  **Why the test pins MEDIUM not HIGH**:
  - The boundary failures surface as either 400 (validation-shaped) or 500 (SQL error leaked) — the latter is a UX problem (operator sees stack trace) but not a corruption surface.
  - The `size=100000` DoS-amp is real but bounded by single-request latency (the CTE runs in <1s for typical platforms).
  - The pinning catches a future refactor that adds clamping (HIGH-impact if it changes API behavior silently) OR removes the OpenAPI `minimum: 1` constraint (LOW-impact but operator-visible).

  **Connection to LSN-019**:
  - The size=N+1 boundary is the threshold where the LSN-019 drift VANISHES (the inner paginate selects ALL tags, so the outer count-DESC sort IS effective).
  - The test that asserts "size > total_tag_count returns correct popularity order" PINS the threshold semantics. A future LSN-019 fix should make this test stronger (NOT weaker) by pushing correctness to all sizes.
