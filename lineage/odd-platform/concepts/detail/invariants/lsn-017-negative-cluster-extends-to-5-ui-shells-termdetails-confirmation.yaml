description: |-
  NEW INVARIANT, batch 2026-05-20U — STRENGTHENS the existing
  lsn-017-doubling-anti-pattern-absent-in-management-list-components
  invariant (batch Q — 4-component negative cluster) by adding
  TermDetails as the 5th UI shell verified safe from the canonical
  LSN-017 within-component dep-array doubling. The cumulative negative
  cluster is now 5 components; DataEntityDetails remains the SOLE
  platform-wide instance of canonical LSN-017.

  THE BATCH-U PRIMARY-SOURCE EVIDENCE (TermDetails sidecar):

    TermDetails.tsx:37-45 — the mount-useEffect's deps array is
    EXACTLY [termId]. Verified by reading lines 37-45 end-to-end +
    tracing every dep. No fetch-result-derived value appears in the
    deps. The effect re-fires ONLY when termId changes (i.e., the
    URL parameter changes — externally driven, not response-derived).

    Compared to DataEntityDetails.tsx:56-64 (canonical LSN-017 site):
      Dep array: [dataEntityId, isDataEntityGroupUpdated,
                  isDataEntityAddedToGroup, isDataEntityDeletedFromGroup,
                  details.status?.status]
      The fifth element details.status?.status IS the fetch-response-derived
      value that closes the doubling loop. TermDetails has NO analogous
      fifth element — the deps are externally-driven only.

  THE 5-SHELL NEGATIVE CLUSTER:

    1. PolicyList (batch Q primary source) — deps [fetchPolicyList, query];
       both are externally-driven (stable thunk ref + local state).
    2. RolesList (batch Q) — deps [fetchRolesList, query]; same shape.
    3. OwnersList (batch Q) — deps [isOwnerCreating, isOwnerDeleting, query];
       primitives, not fetch-response-derived.
    4. CollectorsList (batch Q) — deps [isCollectorDeleting, query, size];
       primitives + a hardcoded constant.
    5. TermDetails (batch U primary source — THIS INVARIANT) — deps [termId];
       externally-driven URL parameter.

    The 5 shells span 4 distinct feature areas (Policy + Role + Owner +
    Collector + Term) and 4 distinct architectural shapes (Management
    list-with-create + detail-page-with-tabs). The negative finding is
    therefore STRUCTURALLY GENERALISED — the canonical LSN-017 doubling
    shape is NOT widespread; it is the IDIOSYNCRATIC choice of one
    specific component (DataEntityDetails).

  WHY THIS NARROWING MATTERS:

    Without the 5-shell confirmation, a maintainer auditing the
    codebase for LSN-017 instances might:
      (a) Over-scope — flag every component with a useEffect + a Redux
          dispatch as suspect, creating audit fatigue.
      (b) Under-scope — assume LSN-017 is fixed by the
          DataEntityDetails patch alone, missing that ~5 sibling shells
          also exist and need verification.

    The 5-shell negative cluster narrows the canonical instance to ONE.
    Future scans of additional detail-page or list components can
    consult this cluster + the safe-pattern documentation to verify
    structural safety quickly.

  TERMDETAILS' ADDITIONAL CONTRIBUTION — sibling class via cross-component:

    Per the companion batch-U invariant
    cross-component-fetch-duplication-shell-plus-tab-double-fire-hot-path,
    TermDetails DOES exhibit a SIBLING-CLASS bug: cross-component
    fetch duplication (shell + Overview both fire getTermDetailsDto on
    every page-open). This is a DIFFERENT shape from canonical LSN-017
    — same family (composition-multiplier on a hot path), different
    instance (cross-component vs within-component).

    Net: TermDetails is the FIRST UI shell confirmed to:
      (a) NOT exhibit canonical LSN-017 within-component doubling.
      (b) EXHIBIT cross-component fetch duplication (different shape,
          same family).

    The shape-disambiguation is load-bearing for the maintainer's
    DOC-NNN queue: the LSN-017 fix (one-line dep-array change) does
    NOT apply to TermDetails; the cross-component remediation
    (consolidate fetchers) does. Two different fixes for two different
    shapes within the same family.

  THE BROADER FAMILY EVIDENCE:

    The cross-layer/cross-component multiplier family has at LEAST
    two known shapes in the platform:
      (1) Within-component dep-array doubling — DataEntityDetails
          (LSN-017 canonical).
      (2) Cross-component fetch duplication — TermDetails (batch U
          primary source).

    Both are invisible to per-node scans; both require cross-node
    composition to surface (the LSN-018 retrospective's load-bearing
    finding). The retrospective LSN-018 records this as the
    coherence-cannot-be-self-detected-per-node lesson; the two
    instances (LSN-017 and cross-component fetch duplication) are
    the two known evidence points.

  SEVERITY LOW — same severity as the existing batch-Q negative
  cluster invariant; positive findings catalogued for STRUCTURAL
  SAFETY EVIDENCE.

  THE CLUSTER MAY EXPAND OR CONTRACT FURTHER:

    Additional UI shells await batch enrichment:
      - QueryExamplesList / QueryExampleDetails (P-02 Data Modelling).
      - LookupTables (P-03 Master Data Management).
      - DataQualityDashboard sub-components (P-04 Data Quality).
      - Lineage view shells (P-05).
      - Alerts list / detail shells (P-07).

    Each future shell verified safe extends the negative cluster;
    each future shell discovered to exhibit canonical LSN-017 (if
    any) becomes a SECOND positive instance. The current state at
    batch U: DataEntityDetails is the SOLE positive instance across
    6 enriched shells (5 negative + 1 positive). The pattern remains
    localised, not generalised.
