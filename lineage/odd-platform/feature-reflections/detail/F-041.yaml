- id: H-011
  hypothesis: |-
    When a user clicks the Catalog tab (or the Dictionary tab) and the backend is unavailable, the user
    gets a clear signal that the action failed, rather than an unresponsive click.
  derivation: |-
    Negative-space failure-path — Catalog/Dictionary dispatch a create-search thunk before navigating; the
    senior-PO question of how a primary nav action behaves under failure.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      Both create-thunk-then-navigate handlers call .unwrap().then(...) with NO .catch(...): the Dictionary
      handler (ToolbarTabs.tsx:112-117) dispatches createTermSearch then navigates inside the .then; the
      Catalog handler shares the shape via useCreateSearch.ts:14-19. On a backend 5xx / network failure the
      rejected promise produces no toast, no navigation, and no error pane — the click appears unresponsive.
      Worse, rapid repeat clicks mint repeat orphan search-id rows server-side (no in-flight de-dup, no
      idempotency key, no client-side cleanup); orphan rows accumulate at 1 per click and are evicted only by
      the F-010 housekeeping job's default-30-day TTL.
    evidence:
