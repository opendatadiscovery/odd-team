batch_origin: Z
created_in_batch: Z
feature_name: |-
  Metrics Ingestion — per-DataEntity OpenMetrics push via POST /ingestion/metrics with INTERNAL_POSTGRES default or PROMETHEUS remote-write
discovered_from_entry_point: |-
  webhook:POST /ingestion/metrics (IngestionController.ingestMetrics)
description: |-
  Metrics Ingestion is the user-observable capability the platform exposes
  for OpenMetrics-shaped per-entity metric series. Collectors push a
  `MetricSetList` payload (a list of `MetricSet` each carrying an entity
  ODDRN + one or more `MetricFamily` records — COUNTER / GAUGE / HISTOGRAM
  / SUMMARY / GAUGE_HISTOGRAM types) to `POST /ingestion/metrics`. The
  endpoint then routes the payload to one of two mutually-exclusive
  storage backends gated by `metrics.storage` config:
  `InternalIngestionMetricsServiceImpl` writes to the platform's PostgreSQL
  `metric_series` / `metric_point` tables (default-on,
  `matchIfMissing=true`); `ExternalIngestionMetricsServiceImpl` writes
  Prometheus-shaped TimeSeries via remote-write `POST /api/v1/write`
  against `metrics.prometheus-host`. Ingested data surfaces at the
  per-DataEntity Metrics tab via `GET /api/dataentities/{id}/metrics`.

  The doc-anchored intent (live `configuration-and-deployment/odd-platform`
  page, WebFetched 2026-05-20 status 200): "INTERNAL_POSTGRES (default) —
  metrics are written to and read from the ODD Platform's own PostgreSQL
  database" + "PROMETHEUS — metrics are remote-written to an external
  Prometheus instance (via the Prometheus remote-write protocol at
  `/api/v1/write`)" + "the platform appends `tenant_id={value}` as a
  label on every Prometheus instant query it issues. This lets a single
  shared Prometheus instance serve metric data for multiple ODD Platform
  deployments". The page documents the storage-backend config; it does
  NOT document the `/ingestion/metrics` endpoint itself.

  The user-observable reality, per batch-Z primary-source code-walk of
  `IngestionController.ingestMetrics` + `CounterTimeSeriesExtractor`
  config-key consumer:

  (1) **UNAUTHENTICATED in EVERY supported deployment posture** —
  `IngestionController.java:89-95` (the `ingestMetrics` method) carries
  no `@PreAuthorize`. `IngestionDataEntitiesFilter` exact-matches `POST
  /ingestion/entities` only (IngestionDataEntitiesFilter.java:28).
  `IngestionDataSourceFilter` exact-matches `POST /ingestion/datasources`
  only. `/ingestion/**` is in `SecurityConstants.WHITELIST_PATHS`
  (SecurityConstants.java:96), exempting it from UI auth (LOGIN_FORM /
  OAUTH2 / LDAP via `AuthorizationCustomizer.java:22`). Result: ANY
  caller able to reach the platform's HTTP port can POST a MetricSetList
  referencing ANY ODDRN with ANY labels — EVEN WITH `auth.type=OAUTH2`
  AND `auth.s2s.enabled=true` AND `auth.ingestion.filter.enabled=true`
  enabled simultaneously. The live security doc (WebFetched 2026-05-20)
  documents that "IngestionDataEntitiesFilter uses an exact path matcher
  (/ingestion/entities, POST)" + "sibling endpoints remain unprotected
  by this filter" — but does NOT name `/ingestion/metrics` explicitly;
  the principle applies.

  (2) **Tenant isolation NONEXISTENT on INTERNAL_POSTGRES (default
  storage)** — `odd.tenant-id` config is consumed at the EXTRACTOR layer
  (CounterTimeSeriesExtractor.java:22-25 + 3 sibling Gauge / Histogram /
  Summary extractors) and appended only as a Prometheus label on the
  PROMETHEUS path. The INTERNAL_POSTGRES path stores no tenant_id column
  on `metric_series` / `metric_point` tables — multi-tenant isolation
  on the Postgres backend is NONEXISTENT. A deployment configured with
  `odd.tenant-id=teamA` running in INTERNAL_POSTGRES mode does NOT scope
  its writes by tenant_id at all. The CounterTimeSeriesExtractor sidecar's
  `bugs_limitations_corner_cases[0]` HIGH-severity finding on
  read/write tenant-id label asymmetry on empty-string compounds this —
  even on PROMETHEUS, empty-string tenant-id is a no-op label that two
  unrelated deployments would conflate.

  (3) **No payload-side validation of ODDRN existence** — the controller
  passes the payload verbatim to `IngestionMetricsService.ingestMetrics(...)`.
  `InternalIngestionMetricsServiceImpl.java:87` calls
  `metricEntityRepository.registerMetricEntityOddrns(request.metricRelatedOddrns())`
  which creates `metric_entity` rows BY ODDRN regardless of whether a
  `data_entity` row with that ODDRN exists. PROMETHEUS path writes
  labels with whatever ODDRN string the caller supplied. Net effect: a
  caller can mint arbitrary `metric_entity` rows / arbitrary Prometheus
  series for non-existent ODDRNs, silently polluting the metrics
  namespace. No FK from `metric_entity.entity_oddrn` to `data_entity.oddrn`.

  (4) **Empty payload silently succeeds with 201** —
  `IngestionController.java:90-95` has NO `.filter(...)` / `.switchIfEmpty(...)`
  guard. Both implementations short-circuit to `Mono.empty()` on
  `CollectionUtils.isEmpty(metricSetList.getItems())`
  (InternalIngestionMetricsServiceImpl.java:80-82,
  ExternalIngestionMetricsServiceImpl.java:86-88) — returning 201 Created
  for a no-op. Contrast with `postDataEntityList` which 400s on empty
  items via `BadUserRequestException("Ingestion payload is empty")`.
  Implementation-side handling is ASYMMETRIC with the sibling endpoint
  and undocumented.

  (5) **PROMETHEUS write OUTSIDE the transaction — partial state on
  failure** — `ExternalIngestionMetricsServiceImpl.java:84,100`: the
  `@ReactiveTransactional` boundary wraps the ODD-side bookkeeping
  table writes (`external_metric_last_value` upserts) BUT the actual
  Prometheus remote-write is OUTSIDE the transaction (it is a chained
  `.flatMap` after `savedMetricFamilies` — the WebClient call is the
  terminal step). A Prometheus failure does NOT roll back the
  bookkeeping writes; a bookkeeping failure prevents the Prometheus
  write. The split is undocumented — operators cannot reason about
  storage-backend consistency from the docs.

  ZERO live ODD doc page describes the `/ingestion/metrics` endpoint
  itself — request payload shape, response status, failure modes,
  body-size limit (20 MB), authentication posture. Operators authoring
  custom metrics-push integrations have only the OpenAPI ingestion spec
  in the external `opendatadiscovery/opendatadiscovery-specification`
  repo, with no operator-facing narrative. The live
  `features/active-platform-features` page (WebFetched 2026-05-20)
  enumerates only 5 active subsystems (Alerting / Notifications /
  Activity Feed / Data Collaboration / GenAI assistant) — metrics
  ingestion is NOT listed as a sub-feature at all, despite the
  per-DataEntity Metrics tab being a real UI surface.
facets_summary: |-
  13 substantive drifts: UNAUTHENTICATED in every supported deployment
  posture (HIGH — even with all auth toggles ON the path is whitelisted)
  + tenant isolation NONEXISTENT on INTERNAL_POSTGRES (HIGH — no
  tenant_id column on the Postgres tables; the mechanism applies to
  PROMETHEUS only) + no payload-side ODDRN existence validation
  (MEDIUM — arbitrary metric_entity row minting) + empty payload silent
  201 no-op (LOW — asymmetric with postDataEntityList) + PROMETHEUS
  write outside transaction partial state on failure (MEDIUM) + invalid
  storage value boots with NoSuchBeanDefinitionException no warning
  (LOW — operator-debug surface) + PII labels propagated verbatim no
  sanitization (MEDIUM — cross-link to CounterTimeSeriesExtractor
  finding) + storage migration one-way (INTERNAL_POSTGRES data
  unreadable after PROMETHEUS switch; no operator warning) + no audit
  log at any layer (MEDIUM — joins the audit-silence pattern) + live
  docs silent on endpoint (MEDIUM) + live security docs imply OAUTH2
  protects the path actually whitelisted (HIGH — false-sense-of-security
  drift) + concept catalog path drift (`/ingestion/metric_sets` was
  wrong; ground-truth is `/ingestion/metrics`) + body-size
  DataBufferLimitException surfaces as 500 not 413 (LOW —
  same gap as postDataEntityList sibling).
