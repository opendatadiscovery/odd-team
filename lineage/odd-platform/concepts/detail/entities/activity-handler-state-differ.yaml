name: Activity Event State Differ (currently misnamed 'ActivityHandler')
canonical_in_docs: false
canonical_candidate: true
description: |-
  **NEW ENTITY, batch VAL-LSN-019-B (2026-05-20)** — first-class concept entry
  for the snapshot-differ component that produces the JSON `oldState` /
  `newState` payloads recorded on every ActivityPojo row. **The name
  'ActivityHandler' on the Java interface is misleading**: the interface does
  NOT handle events, write activity rows, or mutate state. It is a read-only
  state snapshotter — `getContextInfo(parameters)` captures the OLD state of
  the affected `data_entity` BEFORE the wrapped business mutation runs;
  `getUpdatedState(parameters, dataEntityId)` captures the NEW state AFTER
  the mutation runs; the wrapping `ActivityAspect` does JSON-string diff +
  persist + dispatch (`ActivityAspect.java:48-94`).

  **The shape**: 4-method interface (`ActivityHandler.java:9-22`):
    - `boolean isHandle(ActivityEventTypeDto)` — dispatch predicate
    - `Mono<ActivityContextInfo> getContextInfo(Map<String,Object> parameters)`
    - `Mono<String> getUpdatedState(parameters, Long dataEntityId)` (single-id)
    - `Mono<String> getUpdatedState(parameters, List<Long> dataEntityIds)` —
      DEFAULT method THROWS `UnsupportedOperationException`

  **The implementation set**: 18 concrete @Component impls (verified Glob)
  + 2 abstract bases (AbstractOwnershipActivityHandler,
  AbstractCustomGroupActivityHandler) located under
  `service/activity/handler/`. The 18 concrete classes are autowired into
  `ActivityServiceImpl.handlers` (`:41`) as a `List<ActivityHandler>` for
  linear dispatch via `getActivityHandler(eventType)` (`:260-264`):
  `handlers.stream().filter(h -> h.isHandle(eventType)).findFirst().orElseThrow(RuntimeException)`.

  **The contract — three implementation patterns**:
    (a) DB-snapshot pattern (most impls): `getContextInfo` reads the OLD
        state from the DB (e.g. `BusinessNameUpdatedActivityHandler:27-32`
        loads the current DataEntityPojo to capture its business_name).
        `getUpdatedState` re-reads the same DB shape AFTER the mutation.
        Two DB reads per handler invocation; within @ReactiveTransactional
        they see TX-consistent snapshots.
    (b) Parameter-snapshot pattern: `DataEntityStatusUpdatedActivityHandler:32-37`
        reads the OLD DataEntityPojo directly from the @ActivityParameter
        bag (no DB read for old state — caller passes pre-mutation pojo).
        Optimisation for hot paths where the caller already holds the
        pre-mutation entity.
    (c) Hardcoded-empty pattern: `DataEntityCreatedActivityHandler:31` and
        `CustomGroupCreatedActivityHandler:24` hard-code `oldState = "{}"`
        for CREATE events (no pre-existence to snapshot).

  **Coverage hole — multi-id default-throws-at-runtime**: only 2 of 18 impls
  override the multi-id `getUpdatedState(parameters, List<Long>)` —
  `DataEntityCreatedActivityHandler:46-49` and
  `DataEntityStatusUpdatedActivityHandler:51-55`. The other 16 inherit the
  default-throw from `ActivityHandler.java:18-21`. The ONLY caller of the
  multi-id path is `ActivityIngestionRequestProcessor.process` (`:25-32`)
  which dispatches `DATA_ENTITY_CREATED` only — so current runtime is safe,
  but the interface contract advertises a polymorphic batch path that 14
  of 16 impls do NOT support. A future @ActivityLog annotation passing a
  multi-id parameters bag for any other event type would throw at runtime
  with the misleading message "getUpdatedState for multiple ids is not
  implemented yet for this handler" — a latent NPE-class regression.

  **Three of 27 ActivityEventTypeDto values are NOT covered by any concrete
  handler in `service/activity/handler/`**: `DATA_ENTITY_OVERVIEW_UPDATED`,
  `DATA_ENTITY_METADATA_UPDATED`, `DATA_ENTITY_SCHEMA_UPDATED`,
  `DATA_ENTITY_RELATION_UPDATED`, `CUSTOM_METADATA_CREATED/UPDATED/DELETED`,
  `OPEN_ALERT_RECEIVED`, `RESOLVED_ALERT_RECEIVED`. An @ActivityLog-annotated
  method using one of these would throw `RuntimeException("Can't find handler
  for event type ...")` at `ActivityServiceImpl.java:263`. Some of these are
  handled via direct service calls (the AlertServiceImpl OPEN/RESOLVED paths
  via `createActivityEvents` skip the aspect entirely), some are dead.

  See also: canonicalisation candidate
  `activity-event-state-differ-vs-activityhandler-name-drift` for the name
  vs behavior drift; new invariant
  `activity-handler-concurrent-oldstate-capture-race` for the concurrent
  same-entity race; new invariant
  `activity-handler-multi-id-default-throws-runtime-not-compile` for the
  16-of-18 coverage hole.

  vocabulary_status: codebase-anchored, doc-side-absent (main-concepts.md
  does not name the snapshot-differ pattern; the live activity-feed.md
  page does not name 'ActivityHandler' or 'state differ').
vocabulary_status: codebase-anchored, doc-side-absent
