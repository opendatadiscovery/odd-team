behaviour: |-
  Unbounded-pagination-size on getFiltersForFacet regression-pin (MEDIUM — cross-pillar P-01+P-09; DoS-amp on hot path). Controller params `Integer page, Integer size` (`SearchController.java:33-34`) carry NO validation annotations; OpenAPI `PageParam` / `SizeParam` (`components.yaml:4213-4229`) have NO `minimum:` or `maximum:`; the repository computes `OFFSET = (page - 1) * size` at multiple sites (`ReactiveSearchFacetRepositoryImpl.java:129, 157, 315, 369, 404, 449, 515`) with NO clamping. A caller passing `size=1_000_000` triggers a single facet aggregator query bounded only by Postgres / network buffers and the underlying table cardinality. `page=0` produces a negative OFFSET — Postgres rejects with 'OFFSET must not be negative' → 500 (or the global exception handler's mapping) rather than 400 with a meaningful message. This is the SAME pattern as TEST-GAP-503 (`getDataEntityAlerts` size) and the AlertController.getAllAlerts size — pattern at MULTIPLE endpoint families. The facets endpoint is particularly impactful because: (a) every Catalog tab load fires `getSearchFacetList`, (b) every facet drill-down fires `getFiltersForFacet`, so this is on the platform's hottest read path, (c) combined with TEST-GAP-518 (cross-owner enumeration), an authenticated attacker can use `size=1_000_000` to enumerate the entire owner taxonomy with one request, (d) under DISABLED-mode the endpoint is anonymously reachable — a single curl saturates Postgres + JVM. The owner-facet aggregator (`ReactiveSearchFacetRepositoryImpl.java:339-372`) is a 4-way JOIN (OWNER LEFT JOIN OWNERSHIP LEFT JOIN SEARCH_ENTRYPOINT LEFT JOIN DATA_ENTITY) — the heaviest facet query, so the DoS-amp factor is highest here.
