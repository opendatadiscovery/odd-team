behaviour: |-
  REFACTOR-206 — no allowlist on `title_name` — the Title directory grows with arbitrary caller-supplied strings. OwnershipServiceImpl.java:53 calls `titleService.getOrCreate(formData.getTitleName())`. TitleServiceImpl.getOrCreate at lines 19-22 has NO allowlist, no enum, no `@Pattern`, no `@Size`, no length cap. Any non-existing name becomes a new Title row. There is NO `TITLE_CREATE` permission (verified: grep returns zero matches). Operators expecting a fixed Title vocabulary ('Owner', 'Steward', 'Reviewer') discover the directory accumulates typos, language variants, and free-text strings across the lifetime of the deployment. Sibling pattern to REFACTOR-199 (Owner auto-create) — same `getOrCreate` upsert-by-name antipattern. Cross-pillar P-08+P-09 because Title directory growth is uncontrolled by the auth model.
