- id: H-004
  hypothesis: "When an operator points the generic webhook at their incident-management endpoint, that endpoint can verify the POST genuinely came from ODD (a signature / HMAC / shared secret), so a third party who learns the URL cannot forge alerts."
  derivation: "Endpoint-shape (a generic webhook is a security boundary); industry-canonical webhook integrations (GitHub HMAC-SHA256, Slack signing secret, AlertManager auth headers) make origin-verification a default operator expectation."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      WebhookNotificationSender builds the request with .uri(...) + .POST(ofString(json)) +
      .build() only — no Authorization header, no X-ODD-Signature, no HMAC over the body, no
      shared-secret config knob, and not even a Content-Type header. There is no
      notifications.receivers.webhook.* config for headers or secrets. The operator's receiver
      cannot distinguish a genuine ODD alert from a forged AlertNotificationMessage-shaped
      payload POSTed by anyone who learned the URL (e.g. via an exposed /actuator/env — the
      URL is not masked by Spring's default sanitisation).
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__WebhookNotificationSender.md
        section: bugs_limitations_corner_cases[0] + security.known_security_gaps[0]
        cite: "WebhookNotificationSender.java:20-22"
        note: "no header / no signing on the HttpRequest builder"
      - sidecar: odd-platform__java__notification__sender__class__WebhookNotificationSender.md
        section: security.data_exposure[3]
        cite: "NotificationConfiguration.java:91"
        note: "webhook URL reachable via /actuator/env; Spring default mask does not cover 'url'"
    operator_visible_failure: |
      The webhook URL IS the only credential, and it is unsigned: any party who obtains it
      (leaked container image, deployment artefact, exposed actuator) can inject fabricated
      alerts into the operator's incident pipeline — triggering false pages, masking real
      incidents, or poisoning downstream automation. The operator's only defence is network
      isolation (VPN / private network / IP allowlist) which ODD does not enforce or surface.
      The live doc (as of 2026-06-01) NOW warns about this ("The generic webhook is unsigned
      ... no Authorization header, no X-ODD-Signature HMAC, no shared-secret challenge"), so
      the doc-gap is closed — the code gap remains.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-005
  hypothesis: "When an operator's webhook receiver accepts the alert and responds with a standard success code (201 Created, 202 Accepted, 204 No Content — common for async-accept receivers), ODD treats the delivery as successful."
  derivation: "Endpoint-shape: a generic webhook POST follows HTTP semantics where any 2xx is success; async incident receivers commonly return 202."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      AbstractNotificationSender.sendAndValidate checks `response.statusCode() !=
      HttpStatus.OK.value()` — i.e. exactly 200. Any other status, INCLUDING 201/202/204 and
      3xx redirects, raises NotificationSenderException and the alert is dropped from that
      channel with the message "Notification sender response didn't complete with 200 status
      code". A correctly-functioning async-accept receiver that returns 202 is treated as a
      failure. The same 200-only rule applies to Slack (where it is per-spec — Slack returns
      200) but for the generic webhook it is an unwarranted narrowing of the 2xx contract.
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__WebhookNotificationSender.md
        section: bugs_limitations_corner_cases[7] + invariants
        cite: "AbstractNotificationSender.java:26-29"
        note: "statusCode() != 200 -> exception; 2xx-non-200 treated as failure"
      - sidecar: odd-platform__java__notification__sender__class__WebhookNotificationSender.md
        section: docs_link_semantic.doc_drift_findings[1]
        cite: "WebhookNotificationSender.java:19-23"
        note: "delegates to the 200-only parent; no per-channel 2xx acceptance"
    operator_visible_failure: |
      Operators integrating ODD's generic webhook with queue-backed / async incident
      receivers (which return 202 Accepted) see EVERY alert reported as a failure in the logs
      and (depending on the receiver) the receiver may have actually processed the alert — so
      ODD's failure log is wrong, OR a strict receiver that returns 204 silently drops the
      alert. Either way the operator cannot use ODD's webhook with a 2xx-but-not-200 receiver
      without inserting an HTTP gateway that rewrites the status code.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: "When a burst of alerts fires (e.g. a single failed dbt run flags 50+ datasets at once), all of them reach the configured Slack channel."
  derivation: "Pillar primary user action 'receive alerts on failed DQ'; a DQ run producing many alerts is a normal operational event; the user expects all of them."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The dispatcher sends one synchronous Slack POST per alert with no batching, no
      client-side rate-limit, no token bucket. Slack documents incoming webhooks at ~1 msg/sec
      per webhook and returns 429 + Retry-After on excess. AbstractNotificationSender checks
      only statusCode() != 200, so a 429 is an undifferentiated NotificationSenderException;
      Retry-After is never read (no HttpResponse.headers() call anywhere in the send path),
      there is no retry, and the dispatcher logs and moves on. A burst therefore loses most
      messages to rate-limiting.
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__SlackNotificationSender.md
        section: bugs_limitations_corner_cases[0]
        cite: "SlackNotificationSender.java:43-48 + AbstractNotificationSender.java:24-29"
        note: "429 undifferentiated from 4xx/5xx; Retry-After ignored; no rate-limit, no retry"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: bugs_limitations_corner_cases[2]
        cite: "AlertNotificationMessageProcessor.java:25-36"
        note: "synchronous loop, no batching, 1:1 alert->POST"
    operator_visible_failure: |
      During exactly the incident when alerting matters most (a mass failure producing a
      burst), the operator silently receives only the first ~1/second of alerts on Slack; the
      rest are 429-dropped with no operator-visible counter — only repeated ERROR log lines.
      The operator believes alerting is working (some alerts arrive) while most are lost. The
      live doc (2026-06-01) now states the platform "does not honour Slack's rate limit" and
      treats 429 as generic failure — doc-gap closed; code gap remains.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-007
  hypothesis: "When one alert row is malformed in a way the translator rejects (e.g. it references a data-entity oddrn that no longer exists), the platform skips that one alert and continues delivering subsequent alerts."
  derivation: "Negative-space + robustness expectation: a single bad record should not take down the whole subsystem; an alerting system that stalls on one row is operationally unusable."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The malformed alert is a POISON MESSAGE that stalls the entire WAL stream cluster-wide
      forever. The translator throws IllegalStateException on a missing/duplicate alerted-
      entity row (AlertNotificationMessageTranslator.java:94-101) and IllegalArgumentException
      on an unknown alert-type code (line 87); both are UNCAUGHT in the dispatcher
      (AlertNotificationMessageProcessor.java:23-24) and propagate to NotificationSubscriber's
      outer catch (NotificationSubscriber.java:90). process() is NOT wrapped in try/catch and
      the LSN advances ONLY after process() returns successfully (NotificationSubscriber.java:
      77-84), so the lock is released, a hardcoded 10s sleep fires, the lock is re-acquired,
      and the SAME un-advanced LSN re-delivers -> the translator throws again -> infinite 10s
      replay. Every alert inserted after the poison row is deferred forever, and Postgres
      retains all WAL since confirmed_flush_lsn on the slot (primary disk grows). The void
      return on the SPI seam (PostgresWALMessageProcessor.java:6) is the structural root: the
      dispatcher has no channel to tell the subscriber "skip this LSN".
    evidence:
      - sidecar: odd-platform__java__notification__class__NotificationSubscriber.md
        section: bugs_limitations_corner_cases[0] + implicit_adrs[3]
        cite: "NotificationSubscriber.java:77-91"
        note: "no try/catch around process(); LSN advances only on success -> replay loop"
      - sidecar: odd-platform__java__notification__processor__class__PostgresWALMessageProcessor.md
        section: bugs_limitations_corner_cases[0]
        cite: "PostgresWALMessageProcessor.java:6 + NotificationSubscriber.java:83-84"
        note: "void return; no failure/skip signal -> unconditional LSN advance is the only shape"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: bugs_limitations_corner_cases[6]
        cite: "AlertNotificationMessageProcessor.java:23-24"
        note: "translate() uncaught; translator throws on unknown type / missing entity"
    operator_visible_failure: |
      A single bad ALERT row (an alert pointing at a hard-deleted entity — which the translator
      comment at line 95 admits can happen "despite the foreign key constraint", or an
      unknown alert-type code) halts ALL alert delivery on ALL channels for the entire cluster,
      indefinitely, with no operator-visible signal beyond log inspection. Meanwhile the
      platform keeps accepting alerts (rows pile up) and Postgres WAL grows on the primary
      until the disk fills — at which point the whole database (not just notifications) is at
      risk. The only remediations are deleting the bad row, or pg_drop_replication_slot (which
      loses every in-flight undelivered alert). There is no DLQ, no skip-poison API, no
      operator console to advance past the bad LSN. This is the load-bearing fragility of the
      entire F-009 feature.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-008
  hypothesis: "When the notification subscriber thread dies (e.g. an InterruptedException during its retry sleep), the platform detects it and restarts delivery — alerts do not silently stop forever."
  derivation: "Negative-space + reliability expectation: a single-thread leader-elected worker is a single point of failure; an alerting subsystem should self-heal or at least surface its own death."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      NotificationSubscriberStarter submits the subscriber to a single-thread ExecutorService
      but never retains the returned Future and has no exception handler / restart logic
      (NotificationSubscriberStarter.java:33-35). If run() exits — e.g. an InterruptedException
      during the inner 10ms sleep or the outer 10s retry sleep re-thrown as
      NotificationSubscriberException (NotificationSubscriber.java:87-89, 95-100) — the sole
      worker dies and the subscriber is gone for the rest of the JVM lifetime. The platform
      keeps INSERTing alert rows, Postgres keeps retaining WAL on the slot, and NO
      notifications fire. There is no log line tracking the dead subscriber.
    evidence:
      - sidecar: odd-platform__java__notification__class__NotificationSubscriber.md
        section: bugs_limitations_corner_cases[7]
        cite: "NotificationSubscriber.java:87-100 + NotificationSubscriberStarter.java:33-35"
        note: "run() exits on InterruptedException re-throw; no Future retained; no death detection"
    operator_visible_failure: |
      An operator whose subscriber thread died (transient interrupt, an unexpected throw path)
      experiences total silent alerting loss with no telemetry: no log line, no metric, no
      health-check signal. They discover it only when an alert they expected never arrives —
      potentially long after the incident it was meant to warn about. Combined with H-007's WAL
      retention, a dead subscriber also exhausts the primary disk over time.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

