behaviour: 'Name uniqueness — `owner.name varchar(255) NOT NULL UNIQUE` (V0_0_1__init.sql)
  was originally a plain (non-partial) unique constraint per the createOwner sidecar.
  CORRECTED batch P — the deleteOwner sidecar surface re-examined the migration
  history and found V0_0_64__remove_is_deleted_field.sql:68-70 EXPLICITLY drops
  the original implicit unique index AND recreates it as PARTIAL: `DROP INDEX IF
  EXISTS owner_name_unique; CREATE UNIQUE INDEX IF NOT EXISTS owner_name_unique
  ON owner (name) WHERE owner.deleted_at IS NULL;`. So a soft-deleted owner''s name
  IS freed for re-creation. The createOwner sidecar''s MEDIUM-severity claim of
  ''non-partial UNIQUE blocking re-creation'' is SUPERSEDED. **The current behaviour
  is: (a) `DELETE /api/owners/{id}` soft-deletes via UPDATE setting `deleted_at`;
  (b) the partial-unique-index predicate excludes the soft-deleted row; (c) a subsequent
  `POST /api/owners {name: X}` with the same X SUCCEEDS, creating a NEW Owner with
  a fresh id and the same name.** This is the SAME pattern as `policy_name_unique`,
  `role_name_unique`, `tag_name_unique`, `title_name_unique` in the same migration
  script. The test gap REMAINS — no test asserts the round-trip (create → soft-delete
  → re-create); a future migration that drops the partial predicate would silently
  break this operator workflow. The proposed test is REORIENTED: instead of asserting
  the CURRENT BUGGY behaviour, assert the CURRENT WORKING behaviour and pin it as
  contract.'
