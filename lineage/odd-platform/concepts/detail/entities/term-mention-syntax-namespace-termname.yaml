security_aggregate:
  overall: MEDIUM
  weaknesses:
  - 'Side-door write path — mentioning a term in a description auto-creates a
    term_relations row regardless of DATA_ENTITY_ADD_TERM permission (per
    batch-G finding); DATA_ENTITY_DESCRIPTION_UPDATE permission becomes a
    superset of DATA_ENTITY_ADD_TERM via this side door'
  - 'UI vs backend regex asymmetry — a description like [[:foo]] is rendered
    verbatim by UI but parsed by backend with empty namespace group; the
    asymmetry is a latent inconsistency'
  - |-
    **STRENGTHENED batch K — REFACTOR-227 PRIMARY-SOURCE**: the
    service-tier reconciliation runtime
    (handleDataEntityDescriptionTerms at TermServiceImpl.java:201-207)
    creates `data_entity_to_term` rows with `is_description_link=TRUE`
    WITHOUT consulting `DATA_ENTITY_ADD_TERM`. Persists even when
    REFACTOR-217 is fixed.
  - |-
    **NEW LOW batch K**: Regex has no escaping for nested or escaped
    brackets — `[[foo[bar]:baz]]` matches unexpectedly; operators
    writing prose with bracket-heavy content may produce unintended
    term mentions.
  - |-
    **NEW LOW batch K**: Cross-namespace pollution unconstrained — a
    description in namespace-A that references `[[namespace-B:term]]`
    will silently auto-link to namespace-B's term; no per-tenant scoping.
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - 'Term-resolution N+1 risk — handleMarkdownChange fires on every editor
    keystroke; for a description with 100 unique unresolved mentions, 100 parallel
    HTTP requests issue (memoised in fetchedTerms but NOT batched)'
  - |-
    **NEW LOW batch K**: Backend batch-lookup via `getByNameAndNamespace(List)`
    builds a single OR-chained WHERE clause; PG planner cost scales with
    OR count; at large mention counts (hundreds) the planner may degrade
    to seqscan. (TermServiceImpl.md:performance.known_performance_gaps.[5])
  - |-
    **NEW LOW batch K — REFACTOR-228 PRIMARY-SOURCE**: TermAssignmentActivityHandler
    triple-re-query — every link/unlink fires 3 full-list re-queries.
    For a description with multiple [[ns:term]] mentions, each
    description edit triggers reconciliation + triple-re-query per
    affected link. (TermServiceImpl.md:bugs_limitations_corner_cases.[4])
notes: |-
  STRENGTHENED batch 2026-05-19K. The term-mention syntax is now 3-way
  triangulated across the stack:
    - UI tier: TERM_PATTERN regex (DataEntityDescription batch J)
    - Controller tier: upsertDataEntityInternalDescription endpoint
      (batch G)
    - Service tier: findTermsInDescription + handleDataEntityDescriptionTerms
      + resolveUnhandledDescriptionMentions (TermServiceImpl batch K
      PRIMARY SOURCE)
  The third anchor (service-tier primary source) is where the rows
  actually get created — the regex compile site at TermServiceImpl.java:67
  and the INSERT site at updateDataEntityDescriptionTermsState.

  Companion new concepts surfaced this batch:
    - [[ns:term]] auto-link side-channel — REFACTOR-227 primary source
      [new invariant]
    - Handle Data Entity Description Terms (auto-link reconciliation)
      [new operation]
    - TermServiceImpl service-tier zero permission checks [new invariant]

  Recommended canonicalisation: document the syntax + its precedence
  rules + the auto-create side effect + the unhandled-mention staging +
  the description-mention guards in:
    (a) /features/data-glossary — the pillar that owns Term entities;
        describe how mentions auto-link from descriptions
    (b) /features/data-discovery — the pillar that owns Description
        editing; describe how to use [[ns:term]] mentions to wire terms
        inline
    (c) /developer-guides/api-reference/glossary — the API surface for
        term resolution endpoints used by the UI parser

  Also surface the UI-vs-backend regex asymmetry as a backlog item:
  either tighten the backend regex to match UI's character-class
  allowlist, or loosen the UI regex to match backend's non-greedy
  permissiveness — pick one to eliminate the latent inconsistency.
