name: runStatus palette TypeError on out-of-enum status blanks the whole dashboard
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  `testResultsBreakdownChartData` does
  `palette.runStatus[status].color ?? palette.dataQualityDashboard.unknown`
  (DataQualityContent.tsx:47-48). `palette.runStatus` is a
  `Record<DataEntityRunStatus, ItemColors>` (interfaces.ts:55) — keyed by
  exactly the 6 enum values SUCCESS / FAILED / SKIPPED / BROKEN / ABORTED /
  UNKNOWN. If `status` is any other string (a new backend enum value not
  yet in the generated frontend types, a stale generated-sources build,
  or malformed data), `palette.runStatus[status]` is `undefined` and
  `.color` throws TypeError BEFORE the `??` is evaluated. The error
  propagates out of the `useMemo` and crashes the component tree —
  the entire dashboard blanks. NEW invariant, batch ZC (2026-05-22).

  The `??` operator GUARDS a missing `.color` on a PRESENT entry, NOT a
  missing entry. This is the classic mis-written defensive code pattern:
  the developer added the fallback intending to handle "unknown status",
  but the fallback is unreachable under the actual failure mode (which
  is "status not in the map at all"). The right defence is optional
  chaining: `palette.runStatus[status]?.color ?? palette.dataQualityDashboard.unknown`.

  The same risk does NOT apply to `tableHealthData` / `tableMonitoredTables`
  (DataQualityContent.tsx:53-73) — those read fixed
  `palette.dataQualityDashboard` keys, not status-indexed lookups. The
  vulnerability is uniquely on the breakdown ring's per-status colour
  derivation.

  Realistic trigger scenarios:
    (a) Backend ships a new `DataEntityRunStatus` enum value (e.g. a
        7th status `PENDING`) and the frontend's `generated-sources`
        is not regenerated before the deployment. Mismatched-version
        deployment crashes the dashboard for every user on the platform.
    (b) Malformed test data uploaded via S2S ingestion carries a
        non-enum string in the `status` field, slips past validation,
        and hits the dashboard.

  Severity HIGH: a single bad row in `testResults[].results[]` blanks
  the dashboard for ALL users (the failure is on render of every page,
  not per-record). The component has no error boundary; an Error
  thrown inside `useMemo` propagates to the React render and falls
  through to the parent's nearest boundary (DataQuality.tsx has none,
  AppSuspenseWrapper handles Suspense only).
