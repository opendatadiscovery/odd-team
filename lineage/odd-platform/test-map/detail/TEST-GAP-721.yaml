proposed_action: |-
  Pillar-floor sprint addressing P-06 across four PRs (or one mega-PR if maintainer capacity permits):
  - **PR-1 — HTTP-tier**: `TermControllerWebFluxTest` covering the 23 endpoints + 3 SecurityRule modes (auth/no-auth/wrong-permission). At least: 1 happy-path per endpoint + the 2 unguarded term-to-term endpoints (pinning TEST-GAP-718) + the description-mention guard 400 surface (pinning TEST-GAP-479) + the NAMESPACE_CREATE + TAG_CREATE side-door (pinning TEST-GAP-726). 25-30 test methods.
  - **PR-2 — Service-tier**: `TermServiceImplTest` covering the 17 service methods + the description-mention guard + the auto-link side-channel + the unhandled-staging migration + the F-004 staging-XSS (pinning TEST-GAP-720) + the F-006 audit-silence (pinning TEST-GAP-725 — enum-level absence). 30-40 test methods.
  - **PR-3 — Repository-tier**: `ReactiveTermRepositoryImplTest` + `ReactiveTermSearchEntrypointRepositoryImplTest` covering the 15 + 7 methods, including the V0_0_91 missed-migration regression (pinning TEST-GAP-724) and the FTS vector stale-on-delete (pinning TEST-GAP-727). 25-30 test methods.
  - **PR-4 — UI-tier**: `TermSearch.test.tsx` + `TermDetails.test.tsx` + `TermDefinition.test.tsx` covering the broken-debouncer regression (pinning TEST-GAP-723), the double-fetch (pinning TEST-GAP-722), and the F-004 third surface (pinning TEST-GAP-719). 15-20 test methods.

  Cumulative: 95-120 test methods across 5 new test files; estimated 2-4 person-weeks of focused work. The investment pays for itself within the first regression caught — P-06 is a load-bearing pillar with no safety net today.
