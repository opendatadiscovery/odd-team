        section: "understanding + invariants[2]"
        cite: "V0_0_31__add_deleted_at_field.sql:27 (data_source_name_unique WHERE deleted_at IS NULL)"
        note: "Live row name unique; soft-deleted row excluded — recreation succeeds."
      - sidecar: "feature-flow F-123 observed_vs_expected.facets[collector_name_full_unique...]"
        section: "drift_class evidence"
        cite: "V0_0_55:42, V0_0_64:88-90 (role.name partial unique)"
        note: "Role contrast — partial-unique frees the slot on soft-delete."
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional
- id: H-002
  hypothesis: "When an operator deletes a Collector and then creates a new Collector with the same name, the create SUCCEEDS (same expectation a user carries from deleting/re-creating a DataSource or Role)."
  derivation: "Operator mental model: 'Delete' is one verb across Management tabs; the pillar lists collector create + delete as peer actions to datasource/role create + delete (system-mission.md:225). A user expects symmetric recreate-after-delete."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      `collector.name` is FULL UNIQUE (V0_0_29:4) — NOT scoped to `WHERE deleted_at IS
      NULL`. Collector delete is soft-delete (`ReactiveCollectorRepositoryImpl` inherits
      `ReactiveAbstractSoftDeleteCRUDRepository`; `delete(id)` → `UPDATE … SET deleted_at
      = NOW()`). The soft-deleted row's name STILL occupies the FULL UNIQUE index, so a
      new Collector with the same name hits SQLSTATE 23505 → UniqueConstraintException.
      The read side (`listDto`, auto-scoped to `deleted_at IS NULL`) shows no collector
      with that name — so the operator sees "it's gone" but "cannot create it." There is
      no UI affordance, no service method, and no repository method to hard-delete the
      soft-deleted collector row; recovery requires raw `UPDATE collector SET deleted_at =
      NULL` or `DELETE` by a DBA. The SAME operator action against a Role/DataSource
      succeeds (H-001).
    evidence:
      - sidecar: "ReactiveCollectorRepositoryImpl.md"
        section: "understanding + invariants[1]"
        cite: "ReactiveCollectorRepositoryImpl.java:31 (soft-delete base) + V0_0_29:4 (collector.name FULL UNIQUE)"
        note: "Soft-delete + FULL (not partial) unique = name permanently reserved on the dead row."
      - sidecar: "feature-flow F-123 observed_vs_expected.facets[collector_name_full_unique_blocks_recreate_after_soft_delete]"
        section: "drift_class description + evidence"
        cite: "V0_0_29:4 vs V0_0_55:42/V0_0_64:88-90"
        note: "Confirmed drift class — identical error shape to a genuine duplicate, different cause."
    operator_visible_failure: |
      (1) An operator who deletes a collector after a naming typo cannot re-create the
      corrected-name collector if they reuse the old name — hard error, no path forward in
      the UI. (2) The error message is the generic UniqueConstraintException ("collector
      with this name already exists"), which is FALSE from the operator's seat — there is
      no live collector with that name. (3) The operator is likely to conclude the platform
      is buggy / the row didn't delete, and may file a support ticket or, worse, pick a
      worse name (`prod-snowflake-2`) permanently polluting the namespace. (4) The
      asymmetry with Role/DataSource/Namespace (which DO allow recreate) makes the
      behaviour unpredictable — the operator cannot form a reliable mental model.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
