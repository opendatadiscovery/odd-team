terminal_side_effect:
  side_effect_class: external-call
  description: |-
    For each ALERT-row WAL event: 0..N outbound HTTP/SMTP delivery calls (one per
    configured NotificationSender bean). Each successful delivery is observed
    externally by the receiving Slack channel / webhook endpoint / email inbox.
    Side-effect-class is external-call (network egress); within the platform there
    is NO db-write to a delivery-audit table, NO activity-event emission, NO
    metric counter increment — only `log.debug` (default-off) per-send and
    `log.error` on per-sender catch.
  evidence: |-
    AlertNotificationMessageProcessor.java:25-36 (the fan-out loop) +
    SlackNotificationSender.java:40-49 + WebhookNotificationSender.java:18-23 +
    EmailNotificationSender.java:60-89 + AbstractNotificationSender.java:16-30
    (the shared send method) + AlertNotificationMessageProcessor.java:27
    (log.debug only) + lines 30-35 (log.error on catch only).
  cardinality_per_call: 'sum of configured-and-non-failing senders (0..3 typical)'
amplification_factor: 'configured_senders_count (0..3) per WAL event'
amplification_factor_provenance: |-
  STATIC — confirmed from primary-source in batch K NotificationsDispatcher sidecar.
  The mathematical product across hops is bounded by the number of registered
  NotificationSender beans (each gated by @ConditionalOnProperty on
  notifications.receivers.{slack.url | webhook.url | email.sender}). Per WAL
  event, ONE translate() runs (one recursive-CTE DB read) and N synchronous
  external-call hops fire (where N = configured senders count). The
  amplification_factor is intentionally configurable (operator-driven) but
  bounded by the conditional-bean count — there is no hidden multiplier.
observed_vs_expected:
  facets:
  - facet: per-channel exception-type asymmetry (email RuntimeException bypasses catch)
    observed: |-
      The dispatcher catches NotificationSenderException only
      (AlertNotificationMessageProcessor.java:31). EmailNotificationSender wraps
      MessagingException / TemplateException / IOException as raw `new RuntimeException(...)`
      at EmailNotificationSender.java:59 — NOT as NotificationSenderException. An email
      failure therefore BYPASSES the dispatcher's per-sender catch and aborts fan-out
      mid-message. If email is registered before Slack/webhook in
      `List<NotificationSender>` (Spring-bean-discovery-order, undefined), an email
      failure aborts delivery to subsequent channels for that alert. Live doc
      framing ("If recipient N fails ... the loop stops — recipients N+1, N+2, …
      never receive the alert. There is no retry and no partial-failure metric.")
      describes the WITHIN-EMAIL behaviour but does not describe the CROSS-CHANNEL
      abort for non-NotificationSenderException email failures.
    expected: |-
      One channel's failure should not block other channels (per the catch-and-continue
      implicit ADR). Either email should throw NotificationSenderException
      (symmetric with the other senders) OR the dispatcher should catch the broader
      Exception type.
    drift_class: exception_type_asymmetry_across_senders
    provenance: STATIC — primary-source in NotificationsDispatcher sidecar
      bugs_limitations_corner_cases[0] + AlertNotificationMessageProcessor.java:31
      + EmailNotificationSender.java:58-60
  - facet: translation failure causes infinite WAL re-delivery loop
    observed: |-
      `messageTranslator.translate(message)` (line 23-24) is UNCAUGHT. Translation
      throws IllegalArgumentException on unknown alert-type code
      (AlertNotificationMessageTranslator.java:87) and IllegalStateException on
      missing or duplicate alerted-entity rows (lines 94-101). Both bypass the
      dispatcher and reach NotificationSubscriber.java:90. The subscriber's outer
      catch logs, releases the lock, waits 10s, re-acquires, and the SAME WAL LSN
      is replayed. A persistently-bad row blocks the WAL stream indefinitely with
      10s back-off cycles, deferring every subsequent alert delivery behind the
      poison message.
    expected: |-
      A translation failure should poison-quarantine the offending WAL LSN
      (skip-and-advance with a structured warning) and unblock subsequent messages.
      The current behaviour is a fail-loud / stall-the-stream stance with no
      operator escape hatch short of database manipulation.
    drift_class: poison_message_replay_loop
    provenance: STATIC — primary-source in NotificationsDispatcher sidecar
      bugs_limitations_corner_cases[6] + AlertNotificationMessageProcessor.java:23-24
      + NotificationSubscriber.java:60-91
  - facet: unconditional broadcast — every channel gets every alert
    observed: |-
      The for-loop at lines 25-36 iterates `notificationSenders` unconditionally.
      There is no filter by alert type, severity, data-entity Owner, or namespace.
      An operator asking "can I route Critical to Slack and Minor to email?" finds
      no configuration knob. Live doc framing ("An alert dispatched to multiple
      channels is delivered to every channel that is enabled.") is accurate but
      invites the routing question; the absence of routing is not documented
      explicitly.
    expected: |-
      Either an operator-visible per-channel filter (alert-type predicate,
      severity threshold, owner-match rule) OR a documented "all-or-nothing"
      framing that names the absence as deliberate.
    drift_class: unconditional_broadcast_no_routing
    provenance: STATIC — primary-source in NotificationsDispatcher sidecar
      bugs_limitations_corner_cases[3] + AlertNotificationMessageProcessor.java:25-36
  - facet: no retry / no DLQ / no audit on delivery
    observed: |-
      A failed delivery (any channel, any reason) is logged at ERROR and the
      message is treated as delivered from the dispatcher's perspective. The WAL
      stream's setAppliedLSN / setFlushedLSN are advanced regardless
      (NotificationSubscriber.java:83-84) — the dispatcher has no way to signal
      "do not advance LSN." Operators have NO database record of delivery
      success/failure per alert per channel. There is no `notifications_sent_total`
      counter, no `delivery_latency_seconds` histogram, no `failure_rate_by_channel`
      metric. Operators cannot answer "how many alerts went to Slack last week?"
      without log greppable receiver-id strings.
    expected: |-
      At minimum: structured audit row per (alert, channel, status) in the same
      transaction OR Prometheus counter + log JSON with principal / channel /
      result. Operationally load-bearing for compliance reviews and incident
      reconstruction.
    drift_class: no_retry_no_dlq_no_audit
    provenance: STATIC — primary-source in NotificationsDispatcher sidecar
      bugs_limitations_corner_cases[1] + bugs_limitations_corner_cases[4] +
      AlertNotificationMessageProcessor.java:30-35 + NotificationSubscriber.java:83-84
  - facet: PII pass-through to every channel
    observed: |-
      AlertNotificationMessage carries `dataEntity.{id, name, dataSourceName,
      namespaceName, owners[]}` + downstream lineage entities to configured depth +
      alertChunks[]. Every configured channel receives the same payload — Slack
      (corporate workspace, potentially many viewers), webhook (operator-defined
      URL, security posture unknown to ODD), email (inbox security varies). No
      redaction hook, no PII-tag-aware filter, no allowlist. Owner-scoping is
      bypassed at the dispatcher level — `dataEntity.owners[]` is populated by
      AlertNotificationMessageTranslator but never consulted for routing.
    expected: |-
      Either an operator-configurable redaction filter (PII-tag-driven payload
      shaping) OR a documented "every channel sees everything" framing with
      operator guidance on channel selection given dataset PII exposure.
    drift_class: pii_passthrough_to_every_channel
    provenance: STATIC — primary-source in NotificationsDispatcher sidecar
      bugs_limitations_corner_cases[8] + AlertNotificationMessageProcessor.java:24-30 +
      AlertNotificationMessageTranslator.java:73-83
  - facet: empty-senders silent DB cost
    observed: |-
      When `notifications.enabled=true` but ZERO receivers are configured
      (`notifications.receivers.{slack.url, webhook.url, email.sender}` all absent),
      the conditionally-registered sender beans never instantiate and
      `List<NotificationSender>` is empty. The dispatcher still RUNS — translate()
      executes the multi-statement jOOQ read incl. the recursive downstream-lineage
      CTE on every WAL event — and then no-ops the empty fan-out loop. DB cost is
      paid for zero delivery. There is no boot-time warning, no per-message warning,
      no operator-visible signal that work is being wasted.
    expected: |-
      Either skip translate() when the sender collection is empty OR log a
      boot-time warning when `notifications.enabled=true` but no receivers
      are configured.
    drift_class: empty_senders_silent_db_cost
    provenance: STATIC — primary-source in NotificationsDispatcher sidecar
      bugs_limitations_corner_cases[7] + AlertNotificationMessageProcessor.java:23 +
      NotificationConfiguration.java:36,69,83
  - facet: sender iteration order is Spring-bean-discovery-order
    observed: |-
      `List<NotificationSender>` is injected as a bean collection
      (AlertNotificationMessageProcessor.java:19) with no `@Order` annotation,
      no Comparator, no explicit sort. Order depends on Spring's bean-registration
      sequence (class-scan-order-dependent in practice). A rename or package move
      can silently flip the order; combined with the email RuntimeException-bypass
      asymmetry, a change that puts email first could silently abort fan-out for
      every alert when email fails.
    expected: |-
      Either an explicit ordering contract (`@Order` annotations + a documented
      sender-priority sequence) OR an explicit no-order statement in code (sort
      by class name, log the resolved order at boot).
    drift_class: sender_iteration_order_undefined
    provenance: STATIC — primary-source in NotificationsDispatcher sidecar
      bugs_limitations_corner_cases[5] + AlertNotificationMessageProcessor.java:19
  - facet: DEBUG-level full-payload log leak
    observed: |-
      `log.debug("Sending notification message via {}: {}", notificationSender.receiverId(),
      notificationMessage)` at line 27 invokes Lombok @ToString on
      AlertNotificationMessage (declared at AlertNotificationMessage.java:21).
      Production INFO mitigates; a DEBUG-on incident exfiltrates the full payload
      (data-entity name, owners, downstream lineage entities) into log aggregation.
    expected: |-
      Either redact PII before toString OR drop the message payload from the
      log line (keep receiver id + LSN; details available via audit table
      if one is added).
    drift_class: debug_log_full_payload_leak
    provenance: STATIC — primary-source in NotificationsDispatcher sidecar
      bugs_limitations_corner_cases[9] + AlertNotificationMessageProcessor.java:27 +
      AlertNotificationMessage.java:21
