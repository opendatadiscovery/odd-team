- id: H-006
  hypothesis: |-
    When a user navigates to {platform-base-url}/api/v3/api-docs — the URL the docs, the pillar,
    and SHB-128 all call "the Swagger UI" / "the spec body" — they get the interactive Swagger UI
    (and the raw OpenAPI JSON document is served at a sibling /v3/api-docs-style path).
  derivation: |-
    The feature-flow hop-1/hop-2 evidence and the pillar both assert /api/v3/api-docs serves "the
    OpenAPI specification body"; springdoc conventionally serves the UI at /swagger-ui and the JSON
    at /v3/api-docs. This hypothesis tests the URL-to-artefact mapping the whole flow assumes.
  seed_source: endpoint-shape (the load-bearing cross-layer name check, Rule 4)
  validation:
    verdict: contradicted
    actual_behavior: |-
      The springdoc config INVERTS the two paths relative to their names and relative to every
      reference to them (application.yml:22-26, Read-verified 2026-06-03):
        springdoc.api-docs.path: /api/v3/swagger-ui.html   ← the OpenAPI JSON DOCUMENT is served here
        springdoc.swagger-ui.path: /api/v3/api-docs         ← the interactive Swagger UI HTML is served here
      So /api/v3/api-docs (the URL the pillar at system-mission.md:303,316, SHB-128, and the
      feature-flow hops 1-3 all call "the spec body" / "the OpenAPI specification body") actually
      serves the Swagger UI HTML page, while the machine-readable spec the feature-flow's
      terminal_side_effect describes ("HTTP 200 with the OpenAPI 3.0.3 specification body") is at
      /api/v3/swagger-ui.html. The springdoc UI itself then loads the grouped JSON from the default
      group endpoints (/v3/api-docs/platform-api, /v3/api-docs/ingestion-api per
      SwaggerUIConfiguration.java:10-22). The feature-flow's own hop evidence is anchored on the
      wrong URL-to-artefact mapping. The user-facing OUTCOME (a Swagger UI at /api/v3/api-docs) is
      what an operator wants — but the spec-discovery-via-/api/v3/api-docs claim that PLT-046's
      probe and the security facets all key off is describing the UI path, not the JSON path, and a
      curl-the-spec probe pointed at /api/v3/api-docs gets HTML, not JSON.
    evidence:
      - sidecar: SELF
        section: source_read_for_validation
        cite: "application.yml:22-26 (Read 2026-06-03)"
        note: "api-docs.path=/api/v3/swagger-ui.html (JSON) ; swagger-ui.path=/api/v3/api-docs (UI) — INVERTED vs the labels"
      - sidecar: SELF
        section: source_read_for_validation
        cite: "SwaggerUIConfiguration.java:10-22 (Read 2026-06-03)"
        note: "two GroupedOpenApi beans (platform-api=/api/**, ingestion-api=/ingestion/**) — JSON served at the default /v3/api-docs/{group}"
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api.md
        section: understanding
        cite: "openapi.yaml — served via springdoc at /api/v3/api-docs per the inferred doc"
        note: "the sidecar (and the now-404 doc) inherit the same /api/v3/api-docs='the spec' assumption — surfaced here as the inversion"
    operator_visible_failure: |-
      (1) Anyone (a probe author, a doc reader, a scanner) who curls /api/v3/api-docs expecting raw
      OpenAPI JSON receives the Swagger UI HTML shell instead — silently wrong content-type, no
      error. (2) PLT-046's proposed integration test ("anonymous GET on /api/v3/api-docs returns
      401/403") tests the UI path; the JSON-document path /api/v3/swagger-ui.html AND the group
