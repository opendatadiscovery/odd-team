security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: INCONSISTENT
    detail: 'Rendering pipeline downstream of write authorization; auth gate is the
      writer''s permission (DATA_ENTITY_DESCRIPTION_UPDATE for internal description),
      not the renderer''s. **Batch J UI confirms**: the partial-gating semantic
      (Edit button gated, content render NOT gated) is fragile — a refactor
      "simplifying" by wrapping the cluster in WithPermissions would silently break
      read access for non-editors.'
  owner_scoping:
    verdict: BYPASSES
    detail: Every reader of an entity-detail page (DATA_ENTITY_VIEW) is downstream
      of the writer's payload — one malicious writer reaches every reader. The
      UI provides no per-content authorization layer; the description content is
      universally visible.
  strengths:
  - 'P-009 empirically pinned: script execution blocked by defence-in-depth
    (Chromium HTML-parser policy + React attribute filtering)'
  weaknesses:
  - No backend sanitisation + rehype-raw on UI without rehype-sanitize = stored-XSS
    surface for description bodies (HIGH)
  - Activity-feed re-renders description payload in event-detail dialog — second exposure
    surface
  - Lineage tooltips (if they display descriptions) would be a third surface
  - Future minor-version bump of @uiw/react-markdown-preview or react-markdown can
    widen the surface invisibly with no test catching the regression
  - '**Batch J — `<Markdown>` is the SOLE Markdown renderer on the platform**;
    a rehype-pipeline change to fix THIS feature affects every Markdown surface in
    the UI (alerts, queries, term definitions, owner descriptions, dataset-field
    descriptions, attachments)'
  - '**Batch J — Partial permission gating** (HIGH UX-fragility): Edit button gated,
    content unconditional. The semantic is subtle enough that a refactor
    "simplifying" the cluster would silently break legitimate read access for
    non-editors.'
  - '**Batch J — Spellcheck DOM-mutation race**: Markdown.tsx:96-101 hard-codes
    `id="md-editor"` and queries `document.getElementById`; two simultaneous
    editors on the same page race on the same id.'
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - No client-side cap on Markdown body length (mirrors server-side gap) — large descriptions
    stall the render
  - '**Batch J — Term-resolution N+1 risk**: useTermWiki fetches `[[ns:term]]`
    mentions ONCE per unique term on every keystroke (memoised via fetchedTerms
    / unsuccessfulTerms but NOT batched); a description with 100 unique unresolved
    mentions issues 100 parallel HTTP requests on first render'
notes: |-
  Strengthened in batch 2026-05-19J with DataEntityDescription UI cluster sidecar
  closing the F-004 UI half. P-009 slice-5 empirically pinned the system-level
  behaviour: dangerous tags reach the rendered DOM but execution is blocked by
  defence-in-depth mitigations. The application-layer defence (rehype-sanitize)
  is absent — a future code change can re-open the surface invisibly.

  The DataEntityDescription cluster (InternalDescription, InternalDescriptionPreview,
  InternalDescriptionEdit, InternalDescriptionHeader, OverviewDescription, Markdown
  shared element, useTermWiki hook) is the canonical entry point for this rendering
  pipeline; sibling DatasetFieldDescription cluster shares the same useTermWiki
  hook.

  Four UI-side findings flow from the strengthen:
    (a) **Markdown is the SOLE renderer** — rehype-pipeline changes affect every
        surface globally.
    (b) **Partial permission gating** — Edit button gated, content unconditional.
    (c) **Term-resolution N+1 risk** — every keystroke fires per-unresolved-term
        HTTP calls without batching.
    (d) **Spellcheck DOM-mutation race** — hard-coded `id='md-editor'` collides
        across concurrent editor instances.
