notes: |-
  NEW operation captured in batch ZL (2026-05-26). This is the
  template instance for the 'pillar root is purely layout-only,
  delegates routing + tab selection + state to siblings' pattern.
  The Alerts.tsx pillar root is structurally similar but has the
  bootstrap-totals useEffect; Activity.tsx is similar but holds
  a useQueryParams hook; LookupTables.tsx is the OUTLIER because
  it carries the entire master-data search session bootstrap +
  per-keystroke search dispatch INSIDE the page-root.

  Cross-batch follow-up — when the next pillar root sidecar
  enriches (Overview, ManagementRoutes), capture each as its own
  operation and link them. The 'pure-presentational-shell vs
  state-orchestrator-shell' axis is one of the most useful
  classification dimensions at the UI layer.
