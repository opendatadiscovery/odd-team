behaviour: |-
  **`GenAIProperties` carries ONLY three fields (`enabled`, `url`, `requestTimeout`) — NO `apiKey`, NO `authToken`, NO `model`, NO `maxTokens`, NO `provider`, NO `rateLimit`, NO `temperature`.** Operators integrating ODD Platform's Gen AI Assistant with a paid LLM (OpenAI, Anthropic, Azure OpenAI, AWS Bedrock) MUST front the platform with their own auth-injecting proxy — there is no extension point in this POJO and `WebClientConfiguration.java:26-29` provides no `defaultHeader(HttpHeaders.AUTHORIZATION, ...)` and no `ExchangeFilterFunction` insertion hook.

  Additionally, `GenAIServiceImpl.java:22-23` hardcodes `QUERY_DATA = "/query_data"` and `QUESTION_FIELD = "question"`. The implicit contract is "an unauthenticated HTTP service reachable on the platform's egress, accepting JSON `{"question": "..."}` at `{genai.url}/query_data` and returning a string body." Off-the-shelf LLM provider APIs (OpenAI Chat Completions, Anthropic Messages, Azure OpenAI) do NOT match this shape — they require auth headers, model parameters, and structured request schemas (`messages: [...]` for OpenAI, `messages: [...]` + `system: ...` for Anthropic).

  The live docs page (verified via WebFetch in GenAIProperties sidecar) does NOT warn operators of:
  1. The complete absence of credential-injection surface in `GenAIProperties`.
  2. The hardcoded request path + field name making the feature un-pluggable to standard LLM SDKs.
  3. The implication that any production deployment requires deploying a separate proxy service (a doc-gap class — operators discover this AFTER they've configured `genai.url` and the feature 401s on first request).

  Test gap shape: security-class test asserting (a) `GenAIProperties` exposes no setter for `apiKey` / `authorization` / `model` (current absent-surface contract); (b) an integration test driving a real `POST /api/genai/ask` against a mock LLM endpoint that requires `Authorization: Bearer ...` — the request fails because no header is sent. Documents the proxy-required architecture.
