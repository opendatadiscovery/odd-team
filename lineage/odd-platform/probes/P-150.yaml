expected_outcome: |
  Stress question (Category C — ordering, ties, NULL ordering): the runs-history
  endpoint `GET /api/dataentities/{id}/runs` is paginated via
  `jooqQueryHelper.paginate(baseQuery, DATA_ENTITY_TASK_RUN.END_TIME, SortOrder.DESC, ...)`
  (ReactiveDataEntityTaskRunRepositoryImpl.java:176-182). The outer SELECT
  emits a single `ORDER BY end_time DESC` clause with NO tie-breaker, NO
  NULLS FIRST/LAST directive, and NO secondary sort key.

  Two operator-visible questions follow:

  Q-NULL: when a RUNNING task is in flight, its `end_time` is NULL
  (DataEntityRunRepositoryImplTest.java:52, 102 confirms RUNNING status
  produces end_time=null in the repository test fixture). Postgres
  default for ORDER BY ... DESC is NULLS FIRST. Hypothesis: a RUNNING
  task appears at the TOP of the runs list — labelled by its start_time
  (the UI key, TestRunItem.tsx:30) — with an empty Duration column
  (the formatDistance pair short-circuits on null endTime,
  TestRunItem.tsx:53-57).

  Q-TIE: two completed runs with IDENTICAL end_time (a backfill of historic
  runs ingested in the same batch — TaskRunIngestionRequestProcessor
  bulk-inserts records with timestamps from collector payload) have no
  deterministic secondary sort key. Postgres returns them in physical-
  storage order, which the operator perceives as random across paginated
  page fetches — and the InfiniteScroll consumer (TestRunsHistory.tsx:90-113)
  appends page 2 to page 1, so a duplicate or skipped run is possible
  when the natural-order tie-breaker shifts between successive page
  fetches.

  Probe verifies both: seed RUNNING + identical-end-time rows; fetch
  page 1 with default size=100 and split page 1 size=2 / page 2 size=2;
  assert the ordering behaviour observed.

  Drift class: ordering-vs-display-key-mismatch (UI shows start_time,
  backend orders by end_time); ordering-non-deterministic-on-ties;
  null-handling-undocumented.
