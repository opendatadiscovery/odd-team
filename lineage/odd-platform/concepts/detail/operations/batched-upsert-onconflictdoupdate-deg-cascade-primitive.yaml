notes: "NEW operation captured in batch H. The Ownership and Lineage repositories\
  \ both expose\nbatch-INSERT primitives, but with different ON CONFLICT semantics:\n\
  \n  - Ownership: onConflictOnConstraint.doUpdate.set(TITLE_ID, EXCLUDED) — title-overwriting\n\
  \    (DEG propagates parent's new title to children)\n  - Lineage: onDuplicateKeyIgnore\
  \ (ON CONFLICT DO NOTHING) — silent-duplicate-skip\n    (ingestion rewrite-by-establisher\
  \ is idempotent; duplicate edges are no-ops)\n\nBoth are 1000-row partitioned via\
  \ executeInPartitionReturning + Flux::concat (sequential\nround-trips, not parallel).\
  \ The Flux::concat choice is consistent: it preserves return-order\nsemantics so\
  \ callers can correlate input pojos to output records — but it serializes the\n\
  partitions, limiting throughput on very large DEG cascades.\n\nRecommended cleanup\
  \ paths:\n\n  - Consider adding a `createOrSkip` variant on ReactiveOwnershipRepositoryImpl\
  \ for callers\n    that want \"create new, leave existing unchanged\" semantics.\
  \ Symmetric to the lineage\n    repository's onDuplicateKeyIgnore. Useful for future\
  \ admin tools that import\n    ownership data without overwriting operator-curated\
  \ titles.\n\n  - For O(10K)-child DEG cascades, consider switching `Flux::concat`\
  \ to a bounded\n    `Flux::flatMap` (with concurrency=N) to parallelise partition\
  \ execution. Trade-off:\n    breaks return-order semantics; requires testing on\
  \ the assumption that callers don't\n    rely on the order.\n\n  - Document the\
  \ title-overwriting semantic on the DEG-propagation operator-facing doc\n    (if\
  \ one exists). Operators changing a DEG's title may not realize children's titles\n\
  \    are overwritten.\n\nDoc-gap candidate: extend the DataEntityGroup live doc\
  \ page with a 'Cascade behaviours\non DEG title change' subsection covering the\
  \ title-overwriting semantic.\n"
