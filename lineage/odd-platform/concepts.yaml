        detail: "Endpoint IS gated: SecurityConstants.java:135-137 registers `SecurityRule(NO_CONTEXT, PUT /api/collectors/{collector_id}/token, COLLECTOR_TOKEN_REGENERATE)`. Permission is MANAGEMENT-tier per PolicyPermissionDto.java:58. No @PreAuthorize on controller (consistent with the centralised-SECURITY_RULES pattern). Live `/configuration-and-deployment/enable-security/authorization/permissions` (verified 200, 2026-05-10) documents COLLECTOR_TOKEN_REGENERATE verbatim. The gate is correctly wired — the weakness is what the operation EXPOSES, not whether it's gated."
