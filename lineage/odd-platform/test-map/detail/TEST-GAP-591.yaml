behaviour: |-
  **userNameAttribute resolved via Spring ClientRegistration.ProviderDetails.UserInfoEndpoint, NOT via provider.getUserNameAttribute() — Google-specific divergence.** Lines 66-68: `request.getClientRegistration().getProviderDetails().getUserInfoEndpoint().getUserNameAttributeName()`. Spring auto-discovers this from `issuer-uri` `.well-known/openid-configuration` OR the explicit `auth.oauth2.client.google.user-name-attribute` YAML field via Spring's `ClientRegistrationProperties` binding. All other handlers (Cognito, Azure, ODDIAM, GitHub) read `provider.getUserNameAttribute()` (the ODD POJO field) directly. The divergence means: a Google client without `user-name-attribute` in YAML gets Spring's auto-discovery (typically `name` or `sub`); a Cognito/Azure client without `user-name-attribute` gets the abstract base's default (`cognito:username` / `name`). The inconsistency is an architectural irregularity — same config field, different read paths. Line 69 fallback to `IdTokenClaimNames.SUB` ('sub') when Spring's lookup returns null.
