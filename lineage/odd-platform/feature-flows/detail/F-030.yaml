      blocklist, no length-cap, no charset filter. Cross-link to
      CounterTimeSeriesExtractor sidecar
      `known_security_gaps[1]` MEDIUM. Combined with the
      unauthenticated reach: any caller can flood the metrics
      namespace with sensitive labels that other operators reading
