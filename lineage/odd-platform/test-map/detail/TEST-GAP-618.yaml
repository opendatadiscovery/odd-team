  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/IngestionDataSourceFilterIntegrationTest.java"
  name: "createDataSource_disabledAuth_attackerCreatesCollectorViaUIAndUsesTokenForIngestion_endToEndBypass"
evidence:
  - "createDataSourceEntity.md says (coherence_check.strengthens.[1]): 'REFACTOR-185 (16-sidecar DISABLED-mode bypass) — adds a NEW invocation site: this controller is the FIRST step in a collector's lifecycle. Under DISABLED + default deployment, the IngestionDataSourceFilter STILL runs (it's unconditional) and STILL requires a valid token (lines 31-38). But under DISABLED, there is no UI auth on the platform either — meaning an attacker who can REACH the platform can also create a new Collector via the UI (POST /api/collectors per CollectorController), copy the new token, and then call POST /ingestion/datasources with that token.'"
  - "createDataSourceEntity.md says (implicit_adrs.[1]): 'Datasource auth is ALWAYS-ON; data-entity ingestion auth is OFF-BY-DEFAULT — deliberate asymmetry — evidence: IngestionDataSourceFilter.java:15-20 (@Component, no @ConditionalOnProperty) vs IngestionDataEntitiesFilter.java:19-20 (@Component + @ConditionalOnProperty(value=auth.ingestion.filter.enabled, havingValue=true) + application.yml:48 explicit false)'"
  - "Source: IngestionDataSourceFilter.java:15-20, 31-38 + IngestionDataEntitiesFilter.java:19-20 + application.yml:48 + SecurityConstants.java:96 + CollectorController POST /api/collectors"
cross_references:
