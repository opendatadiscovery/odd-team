- id: H-010
  hypothesis: |
    The reset behaviour is consistent across device types: an operator on a tablet
    or phone who uses the browser/OS back-gesture (rather than a desktop Back
    button) experiences the same filter-reset and the same URL-reconstruction as
    on desktop.
  derivation: "Rule 9 device-type seed (mandatory UX question): a product owner asks how the feature behaves across device types, where back-navigation semantics differ."
  seed_source: ui-label
  validation:
    verdict: probe-needed
    actual_behavior: |
      Cannot be determined statically. The reset is driven by React Router
      unmounting the route element (App.tsx:73) and the URL round-trip by
      `setSearchParams(..., { replace: true })` (DataQualityFilters.tsx:46-54).
      On desktop the back BUTTON and a bookmarked URL behave differently
      (button -> may restore from history+URL; fresh open -> hydrate from URL).
      On mobile the OS/browser back-GESTURE, tab-suspension, and history
      restoration can interact differently with React Router's history and with
      `replace: true` (which deliberately does NOT push history entries) — and no
      sidecar covers a mobile/responsive code path. Whether the URL reconstruction
      that cushions H-001/H-002 holds under a mobile back-gesture is unverified.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataQualityFilters.md
        section: downstream_side_effects[1] (redirect-issue, replace:true)
        cite: "DataQualityFilters.tsx:46-54 (setSearchParams replace:true — no history push)"
        note: "replace:true changes how Back interacts with the filter URL; device-specific back semantics not analysed in any sidecar"
    operator_visible_failure: |
      If mobile back-gesture does NOT preserve the filter URL the way the desktop
      button does, a tablet/phone operator loses their slice with even less
      recourse (no address bar to bookmark on mobile). The platform serves a
      ui-spa from the platform process at `/` (system-mission architectural
      pillar ui-spa); responsive behaviour is in scope for a senior product
      owner and is currently unmeasured.
    severity: LOW
    confidence: LOW
