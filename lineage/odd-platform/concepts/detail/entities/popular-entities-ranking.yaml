name: Popular Entities Ranking
canonical_in_docs: true
canonical_candidate: true
description: Read-only list-shaped surface at GET /api/dataentities/popular ranking
  by view_count DESC. The CONSUMER half of the view_count loop opened by getDataEntityDetails
  (the producer). Surfaces 9-field DataEntityRef projection of the top-N most-viewed
  entities across all owners to every authenticated caller (and any anonymous caller
  under DISABLED).
nodes:
- odd-platform java DataEntityController controller-method:getPopular
contributing_files:
- odd-platform__java__DataEntityController__controller-method__getPopular.md
evidence:
- getPopular.md:concepts.entities[DataEntityRef, DataEntityRefList, DATA_ENTITY.VIEW_COUNT]
- getPopular.md:concepts.invariants[ranking is exclusively view_count DESC + id DESC
  tiebreaker]
- getPopular.md:implicit_adrs.[0]
axes_present:
- controllers
- openapi_paths
- ui_routes
security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: No @PreAuthorize, no SecurityRule entry, falls through to pathMatchers('/**').authenticated().
      DISABLED-mode = anonymous access.
  owner_scoping:
    verdict: BYPASSES
    detail: Returns popular entities across all owners; no per-user/per-tenant filter
  strengths:
  - Soft-deleted + hollow entities correctly excluded
  weaknesses:
  - 'INFLATABILITY (HIGH severity): view_count loop trivially pumpable by any authenticated
    caller. No rate-limit, no idempotency key, no per-user view-count cap, no time-decay,
    no anti-abuse signal in the chain.'
  - EXCLUDE_FROM_SEARCH is NOT applied — internal/staging entities marked hidden-from-search
    ARE surfaced on the platform's home page. Every other list-shape respects this
    flag (9 locations); Popular is the sole list-shape that ignores it.
  - DISABLED-mode anonymous read of the platform's home-page recommendation surface
  - Cross-owner visibility — multi-tenant deployments cannot constrain Popular to
    caller's own team
  - hasAlerts disclosure — coarse-grained platform-health signal leaks to every viewer
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - No index on data_entity.view_count — every Popular page render is sequential scan
    + in-memory sort
  - No caching at any layer (service / controller / HTTP) — every home-page refresh
    re-hits DB
  - No HTTP cache headers (no ETag, no Cache-Control, no Last-Modified)
  - Per-row hasAlerts EXISTS subquery — adds ALERT-table lookup per row
