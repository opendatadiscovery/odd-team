behaviour: |-
  **`GET /api/datasets/{id}/structure` returns the `max(DATASET_VERSION.VERSION)` row — NOT the `max(created_at)` row.** This is correct under normal monotonic ingestion (the ingestion path at `DatasetStructureIngestionRequestProcessor.java:171-178` increments `version.getVersion() + 1` per re-ingest, so highest-version IS the most-recently-created). But the load-bearing assumption — monotonicity — has NO test pinning it.

  **When monotonicity breaks**:
  - **Manual SQL fixup**: an operator running `UPDATE dataset_version SET created_at = ... WHERE id = ...` to repair a backfill.
  - **Replay**: re-ingestion of historical data that resets the version counter (e.g. a migration from V1 of an ingestion adapter to V2 where versions reset).
  - **Backfill**: bulk-loading historical structure snapshots that arrive with non-monotonic timestamps.
  - **Race in ingestion**: two concurrent ingestion paths writing to the same dataset_oddrn — if version counter is read+incremented without serialisation, both writes could land at the same `version` value (corruption — separate bug) OR one could land at a higher version with an earlier created_at.

  **Operator-visible failure mode**: An operator running a `terraform-odd-provider`-style bulk import that manipulates `dataset_version` records directly may see "Latest" returning the wrong row. The UI's `DatasetStructureOverview` (TestRunsHistory.tsx siblings) labels the displayed row "Latest" without surfacing the underlying ordering key — the operator assumes most-recently-ingested.

  **Why MEDIUM**:
  - **Code path is correct under intended use** (monotonic ingestion); the ADR `"Dataset structure versions are surfaced as a thin pass-through"` (`DatasetController.md:implicit_adrs.[0]`) implicitly accepts the monotonicity assumption.
  - **Doc-side**: the live schema-diff doc at `https://docs.opendatadiscovery.org/features/data-discovery/schema-diff` does NOT define "latest". An operator running fixup work has no documentation to refer to.
  - **Regression-pin matters**: a future maintainer "fixing" the ordering to use `max(created_at)` would flip this — and arguably more correctly match the operator's mental model. The test pins the current `max(version)` contract so the change becomes deliberate.

  Distinct from existing TEST-GAP-767 (cross-dataset by-version leak) and TEST-GAP-768 (cross-dataset diff leak) — those are CROSS-DATASET access bugs; this gap is WITHIN-DATASET ordering semantics.
