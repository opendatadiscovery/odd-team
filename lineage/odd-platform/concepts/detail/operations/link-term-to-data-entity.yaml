name: Link Term to Data Entity
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
  - P-06
  - P-09
description: |-
  POST /api/dataentities/{id}/terms — write a single (data_entity, term)
  edge with is_description_link=FALSE into data_entity_to_term. Service is
  @ReactiveTransactional + @ActivityLog(TERM_ASSIGNMENT_UPDATED).
  Duplicate-prevention via onDuplicateKeyIgnore + switchIfEmpty → 400
  BadUserRequest. AUTHORIZATION IS BROKEN (path-mismatch /term singular vs
  /terms plural). **PAIRS with unlink-term-from-data-entity (NEW batch L
  operation)** — the symmetric DELETE counterpart; the authorization bug
  affects BOTH halves of the term-linkage CRUD pair; REFACTOR-217 fix is
  one PR covering both SecurityRule paths.
nodes:
  - odd-platform java DataEntityController controller-method:addDataEntityTerm
contributing_files:
  - odd-platform__java__DataEntityController__controller-method__addDataEntityTerm.md
evidence:
  - addDataEntityTerm.md:concepts.operations[link-term-to-data-entity]
axes_present:
  - controllers
  - openapi_paths
security_aggregate:
  overall: HIGH
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      Path mismatch silently disables DATA_ENTITY_ADD_TERM. Falls through to
      .authenticated(). The DELETE-half PRIMARY SOURCE (batch L
      unlink-term-from-data-entity / deleteTermFromDataEntity) confirms the
      SYMMETRIC bug at SecurityConstants.java:240-242. The
      path-mismatch invariant is now 4-way triangulated (POST controller +
      DELETE controller + description-edit side-channel + service-tier
      consumer); REFACTOR-217 fix is one PR.
  owner_scoping:
    verdict: BYPASSES
    detail: Any authenticated caller can link any term to any data entity
  weaknesses:
    - SecurityRule path mismatch — HIGH severity (REFACTOR-217 — POST half;
      symmetric DELETE half confirmed batch L)
    - No bulk-link variant; N terms = N HTTP calls
notes: |-
  Pairs with the unlink-term-from-data-entity operation (NEW batch L).
  Together they form the per-entity term-linkage CRUD surface. The
  REFACTOR-217 authorization bug affects BOTH halves; the fix covers
  both in one PR.
