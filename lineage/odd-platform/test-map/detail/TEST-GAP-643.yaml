behaviour: |-
  **CRITICAL: Re-create-Administrator-after-soft-delete UI exploit chain.** Per F-006 batch-N drift_class `role_create_administrator_name_asymmetry_mirror`, `RoleServiceImpl.create` (batch-E sidecar bugs_limitations_corner_cases[0]) has NO `UserProviderRole.values()` check, unlike `.update` and `.delete`. The partial unique index `role_name_unique ON role(name) WHERE deleted_at IS NULL` permits re-creation of soft-deleted role names. RolesList's Create-role flow (RoleForm at RoleForm.tsx:24-152, dispatched from RolesList.tsx:92-102) provides NO client-side validation either: the `Input` rules `{required: true, validate: value => !!value.trim()}` (RoleForm.tsx:85) have no length cap, no charset filter, no case-insensitive predefined-name reject. The end-to-end exploit chain: (a) operator with DB access (or any path that allows direct row UPDATE) soft-deletes the seeded `Administrator` row by setting `deleted_at`; (b) operator with `ROLE_CREATE` permission opens this UI's Create-role button; (c) types `Administrator` (matching the seeded name); (d) selects any policy list including high-privilege ones; (e) submits — the backend creates a NEW role named `Administrator` with attacker-chosen policies, which is then attached to users via the Owners tab. The result is a privilege-escalation surface where an unprivileged role attached to a user is RENAMED to `Administrator` in the UI but binds attacker-controlled policies. NO test pins this contract. This is the highest-criticality security regression-pin for the F-006 mutation surface; it is reachable from the operator UI in five clicks.
