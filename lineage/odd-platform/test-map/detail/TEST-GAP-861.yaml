behaviour: |-
  **MEDIUM — `TagServiceImpl.update(tagId, formData)` (lines 44-55, `@ReactiveTransactional`) triggers THREE concurrent search-vector refreshes via `Mono.zip` in `updateSearchVectors` (lines 161-167): (1) `reactiveSearchEntrypointRepository.updateChangedTagVectors`, (2) `reactiveSearchEntrypointRepository.updateChangedTagStructureVector`, (3) `reactiveTermSearchEntrypointRepository.updateChangedTagVectors`. The triple-zip is intentional parallelism for latency; it is ALSO synchronously awaited as part of the TX, meaning a failure in any of the three rolls back the entire `update` operation. A regression replacing the zip with a single call (or with `.subscribe()` fire-and-forget) would silently break the term-search FTS index AND/OR change the TX-rollback semantics.** No test pins the triple-zip contract; no test pins that the THREE calls fire on every update.

  **Primary-source chain**:
  - `TagServiceImpl.java:44-55` (`update`): five-step flow (getDto → external check → applyToPojo → repository.update → updateSearchVectors).
  - **Line 53**: `.flatMap(this::updateSearchVectors)` — synchronously awaited, IN the `@ReactiveTransactional` boundary.
  - `TagServiceImpl.java:161-167` (`updateSearchVectors`, private):
    ```
    private Mono<TagPojo> updateSearchVectors(final TagPojo tag) {
      return Mono.zip(
        reactiveSearchEntrypointRepository.updateChangedTagVectors(tag.getId()),
        reactiveSearchEntrypointRepository.updateChangedTagStructureVector(tag.getId()),
        reactiveTermSearchEntrypointRepository.updateChangedTagVectors(tag.getId())
      ).thenReturn(tag);
    }
    ```
  - **Implicit ADR** (per TagServiceImpl.md:implicit_adrs.[Search-vector refresh is part of the update / delete contract]): the `flatMap` placement (vs `subscribe` for fire-and-forget) shows the maintainer explicitly chose to make search-index consistency PART OF the synchronous transaction boundary. A user who updates a tag and immediately searches sees the refreshed index. The triple-zip is concurrent (not sequential) — intentional parallelism for latency.

  **Operator-visible consequences if the contract regresses**:
  - **search-index drift**: if the refresh becomes fire-and-forget, an immediate search after an update may return stale results (the tag's old name still indexed).
  - **term-search drift**: if `reactiveTermSearchEntrypointRepository.updateChangedTagVectors` is dropped specifically, the term-search FTS surface lags behind tag renames. Terms tagged with the renamed tag still show the old tag's tokens.
  - **TX-rollback semantic change**: if any of the three is removed from the zip, the `@ReactiveTransactional` rollback boundary shrinks — a user who renames a tag and a downstream failure occurs would see a partial state.

  **Why MEDIUM not LOW**:
  - The triple-zip is a coordinated three-table write; "refactoring" to reduce redundancy is a plausible future change that could silently break one of the three.
  - The asymmetry vs `delete` (which only calls #3 — the term-side refresh — at line 68-69, per TagServiceImpl.md:bugs_limitations_corner_cases.[delete-search-vector-incomplete]) reveals that the search-vector refresh is NOT uniform across mutations. The test for `update` pins the triple-call contract; a sister test for `delete` (separately) would surface the asymmetry.
