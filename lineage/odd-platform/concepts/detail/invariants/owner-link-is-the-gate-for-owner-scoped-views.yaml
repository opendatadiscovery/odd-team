name: Owner-link is the gate for owner-scoped views
canonical_in_docs: true
canonical_candidate: false
description: 'Endpoints scoped to the current user''s owned/dependent entities (`/api/alerts/my`,
  `/api/alerts/dependents`, `/api/dataentities/my`, `/api/dataentities/my/upstream`,
  `/api/dataentities/my/downstream`, `/api/activity?type=MY_OBJECTS`, `POST /api/search
  { my_objects: true }`) require the signed-in user to be linked to an Owner record
  (Cornerstone of ODD''s `User-owner association` per the live security/authorization
  doc). Without the link, the endpoints return empty pages. UI-side `My Objects` and
  `Dependents` tabs are hidden entirely (alerts route + AlertController + DataEntityController
  + getActivity + search sidecars). NOTE batch E: Owner directory entries are created
  via `POST /api/owners` (gated by OWNER_CREATE), but NO auth-mode flow auto-creates
  Owners on first login — operators must MANUALLY pre-create per-user Owner rows OR
  accept association requests (createOwner.md:dependencies_semantic.couples-to → OwnerAssociationRequestServiceImpl
  is the SEPARATE user-claim flow). The ''Owner-link'' invariant therefore depends
  on a separate manual setup step that is undocumented as a prerequisite. **Batch
  F reinforcement**: a SECOND write path into the Owner directory exists via `DataEntityController.createOwnership`
  — `OwnerService.getOrCreate(owner_name)` silently creates Owner rows when the name
  is novel, BYPASSING the `OWNER_CREATE` permission gate (see cross-cutting invariant
  ''Permission-bypass via Owner auto-create''). Operators following the documented
  happy path (manual pre-create via `POST /api/owners`) are unaware that `POST /api/dataentities/{id}/ownership`
  can mint Owner directory entries as a side-effect of the binding operation. The
  Owner-link dependency becomes more confused: an Owner directory can grow via TWO
  orthogonal write paths, neither of which is documented as a creation surface in
  the live `/authorization/owners` page.'
