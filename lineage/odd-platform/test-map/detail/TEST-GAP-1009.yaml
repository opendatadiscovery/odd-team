behaviour: |-
  **CRITICAL pattern density — `useDirectoryRouteParams()` at
  `directoryRoutes.ts:37` calls `parseInt(dataSourceId, 10)` with NO `isNaN`
  guard.** A deep-link to `/directory/postgresql/abc/all` produces
  `dataSourceId: NaN` in **six consumers** (the highest count among all
  route-param NaN findings in the codebase):

  - `DataSourceList.tsx:27` reads `dataSourceId`
  - `Entities.tsx:20` reads `dataSourceId` (passes to
    `useGetDataSourceEntities({dataSourceId: NaN})` line 36-41 → backend
    `directoryApi.getDatasourceEntities({dataSourceId: NaN})` →
    `GET /api/directory/datasources/NaN/...`)
  - `DirectoryBreadCrumbs.tsx:13` reads `dataSourceId`
  - `EntitiesTabs.tsx:13` reads `dataSourceId`
  - `EntityItem.tsx:40` reads `dataSourceId`
  - `TableHeader.tsx:13` reads `dataSourceId`

  Plus the hook ALSO has a typeId coercion at line 34:
  `typeId === 'all' ? undefined : parseInt(typeId, 10)`. A URL
  `/directory/postgresql/1/garbage` yields `typeId: NaN`. The
  `TableHeader.tsx:22 if (!typeId)` check evaluates true on NaN (NaN is
  falsy in JavaScript), so the Type column renders — but `useGetDataSourceEntities`
  fires the backend call with `typeId: NaN`, the backend rejects, the UI
  surfaces an AppErrorPage. The UX path is inconsistent (column shows but
  data fails).

  **This is the FOURTH instance of the same project-wide anti-pattern**:
  `useDataEntityRouteParams()` (TEST-GAP-422, TEST-GAP-849), `useTermsRouteParams()`
  (TEST-GAP-1000), `useIntegrationRouteParams()` (TEST-GAP-997). The
  Directory case has the HIGHEST consumer count (six callers, each
  potentially propagating NaN to a backend call) — making it the most
  load-bearing instance of the pattern.

  **Why criticality is CRITICAL** (escalated from the sibling LOW
  classifications): the operator-impact-multiplier on Directory is HIGHER
  than the three sibling routes because:

  (a) Six consumers vs ≤2 in the sibling routes — each is a separate
  potential 400/404 error surface;
  (b) The Directory is the catalog's ENTRY POINT navigation surface
  (per the live doc page, the "browse drill-down" feature). A NaN-bearing
  bookmark / Slack-link / email-link fails more visibly than a single
  data-entity detail page;
  (c) The level-3 Navigate redirect (`<Navigate to='all' replace />` at
  `DirectoryRoutes.tsx:15-17`) fires BEFORE the NaN coercion, masking the
  bug — an operator typing `/directory/postgresql/abc` gets bounced to
  `/directory/postgresql/abc/all`, THEN the NaN propagates. The redirect
  makes the bug less debuggable;
  (d) The `'all'` literal at line 34 is the in-band sentinel; the
  parseInt(typeId, 10) branch handles all OTHER strings, NaN included,
  with no fallback — making this the same anti-pattern with a sentinel
  veneer.

  **A single-file fix** at `directoryRoutes.ts:34-37` adding
  `Number.isFinite(parsed) && parsed > 0` after each parseInt would close
  the six-consumer fan-out at the source. The unit test cost is one file;
  the leverage is preventing NaN propagation across the entire Directory
  feature.

  **Project-wide structural fix recommendation**: a shared
  `safeParseRouteParamId(raw): number | undefined` helper in
  `routes/index.ts` consumed by ALL `use*RouteParams` hooks would
  eliminate the four-instance pattern at the source. Pairs with the
  meta-anchor TEST-GAP-1003 (CROSS-CUTTING DIRECTORY-WIDE GAP) — a single
  scaffold change unlocks regression-pin tests on all four hooks.
