     SecurityWebFilterChain is wired under which `auth.type` value, and which
     `AuthorizationCustomizer` is present) is the load-bearing security
     invariant of the platform and the test suite asserts nothing. Highest-
     leverage test: `SecurityConfigurationBeanGraphTest` — a single
     parameterised `@SpringBootTest` over `auth.type` × `auth.s2s.enabled` that
     locks (a) bean materialisation per mode (TEST-GAP-133 + 138 + 139 + 148 +
     158), (b) AuthorizationCustomizer per-mode wiring (TEST-GAP-140 — REFACTOR-073),
     (c) S2S composition (TEST-GAP-149 + 166 + 135), (d) chain order (TEST-GAP-158).
     Locks 8+ CRITICAL/HIGH gaps in one harness.

  2. **S2S COMPOSES-NOT-MUTEX (HIGH severity — 4-sidecar triangulated)** — the
     `S2sAuthenticationFilter` grants ADMIN role across the ENTIRE `/**` UI/API
     surface (not just `/ingestion/**`) when `auth.s2s.enabled=true` is set
     under LOGIN_FORM/OAUTH2/LDAP. Under DISABLED it is silently ignored. Per-
     mode docs pages do not cross-link or warn. The two ingestion-flavoured
     filters (`IngestionDataEntitiesFilter` vs `S2sAuthenticationFilter`) use
     different headers + different config keys + different scope and are
     routinely conflated. The `S2SAdminAcrossAllPathsTest` (TEST-GAP-149 +
     TEST-GAP-166) is the canonical regression-prevention asset for the most
     subtle privilege-escalation surface in the platform.

  3. **LOGIN_FORM RUNS WITHOUT AUTHORIZATION (REFACTOR-073 VALIDATED)** —
     `LoginFormSecurityConfiguration.java:55-57` configures only
     `.pathMatchers("/**").authenticated()`. No `AuthorizationCustomizer`.
     Combined with `getAuthorities(true)` (ADMIN-for-every-user), the effective
     posture is 'any valid credential pair = full platform access regardless
     of any Policy/Permission/Role configured via the UI'. Live `/enable-
     security/authorization` describes the framework without naming the
     precondition (OAUTH2 OR LDAP). Production operator running LOGIN_FORM
     inherits authenticated-but-fully-authorized. TEST-GAP-140 + TEST-GAP-141
     lock the posture for regression-prevention.

  4. **LDAP SUBSTRING-COLLISION ADMIN ESCALATION (HIGH severity)** —
     `LDAPSecurityConfiguration.java:96` uses `containsIgnoreCase` (substring
     match) for admin-group matching, not equality. `admin-groups: ['ops']`
     matches `cn=devops`, `cn=oopsgroup`. TEST-GAP-159 locks the current
     substring behaviour AS-IS — a regression test that would catch ANY future
     widening of the matcher (or, if the maintainer ever tightens to equality,
     deliberately flip the test).

  5. **LDAP PLAINTEXT URL + ACTUATOR PASSWORD LEAK (HIGH severity)** —
     `ldap://` URLs accepted with NO scheme enforcement; `auth.ldap.password`
     surfaces in `/actuator/env`. TEST-GAP-160 + TEST-GAP-161 lock these
     posture defects. Live LDAP docs do not flag either surface.

