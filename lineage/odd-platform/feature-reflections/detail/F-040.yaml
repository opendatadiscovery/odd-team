# Per-data-entity DQ Test Run History — product-owner reflection

## product_owner_narrative

DQ Test Run History is the **per-test-execution timeline** surface of the Data Quality pillar. When a data-quality engineer opens a single DQ test (or a Data Transformer job) in the catalog and clicks the **History** tab, they see a paginated, most-recent-first list of every past run of that test: when it started, when it ended, whether it passed or failed, and the free-form `status_reason` diagnostic text the upstream framework (Great Expectations, dbt, a custom push adapter) wrote on that run (per the controller sidecar `understanding` + `DataEntityRunController.java:13-28`; `openapi.yaml:1363-1386`). It is the third read surface of P-04, sitting beside F-022 (per-DATASET test reports + SLA) and F-032 (the catalog-wide Quality Dashboard): F-022 lists the tests for a dataset, F-032 aggregates runs across all tests for all datasets, and F-040 drills into the run timeline of ONE test (per the feature-flow `cross_pillar_relationships[P-04]`). The pillar's load-bearing constraint is that ODD is an **aggregator only** — "Quality checks are not performed inside ODD Platform" (per `system-mission.md` P-04 doc excerpt) — so every row here is a record the platform received from outside, never one it computed.

A user reaches the data at two sites. The dedicated route `/dataentities/{id}/history` mounts `TestRunsHistory` with a status-filter dropdown, infinite scroll, and a hardcoded page size of 100 (per controller sidecar `upstream_callers[0]` + `TestRunsHistory.tsx:24-122`). The test-report tab mounts `TestReportDetailsHistory`, a fixed first-10-runs preview with no pagination and — critically — no "+N more" affordance (per `upstream_callers[1]` + `TestReportDetailsHistory.tsx:30-32`). Behind both, one GET endpoint `/api/dataentities/{data_entity_id}/runs` flows through a thin reactive controller → `DataEntityRunServiceImpl` (which 404s a missing entity and 400s an entity whose class is neither Data Transformer (2) nor Data Quality Test (4)) → `ReactiveDataEntityTaskRunRepositoryImpl` (a JOOQ `SELECT … ORDER BY end_time DESC LIMIT ? OFFSET ?` plus a COUNT subquery) → `DataEntityRunMapper` (MapStruct flat-map to the wire model). Clicking a row opens `TestRunStatusReasonModal`, which renders the `status_reason` text verbatim with no redaction and no "show raw" toggle (per batch UI-L extension note (4) + `TestRunStatusReasonModal.tsx:74-78`).

The working parts a product owner would demo: filter by status (a dropdown over SUCCESS / FAILED / SKIPPED / BROKEN / ABORTED / UNKNOWN), scroll back through history (infinite scroll on the /history route), and inspect a failure's diagnostic by clicking its row. The status values are the **six-value wire enum** `DataEntityRunStatus` (per `components.yaml:1407-1415`) — and this is where the feature's promise and its implementation diverge sharply: the database column `data_entity_task_run.status` accepts a **seventh** value, `RUNNING`, which the wire enum cannot represent (per controller sidecar `concepts.entities.DataEntityRunStatus` + `IngestionTaskRun.java:28-36`). The mapper's strict `Enum.valueOf()` conversion throws on it.

The integration story spans four pillars. The runs themselves are produced by the P-10 ingestion pipeline (`TaskRunIngestionRequestProcessor` bulk-inserts every `data_entity_task_run` row); F-040 is the READ counterpart of that WRITE path. A failing run here is the same signal F-007 (AlertManager) turns into a FAILED_DQ_TEST alert and F-021 (Activity Feed) could surface — F-040 is the read surface, F-007 the event surface, F-021 the audit surface, all over one underlying execution record (per feature-flow `cross_pillar_relationships`). And the read posture is shared with P-09 Security: the endpoint has **no entry in `SecurityConstants.SECURITY_RULES`** and falls through to the `.pathMatchers("/**").authenticated()` catch-all (per controller sidecar `security.authorization_assertions` + `SecurityConstants.java:98-355`), so any signed-in user reads any test's full diagnostic stream.

Edge cases a product owner must flag in the demo: while a test is **in flight**, the page does not show a tidy "running…" row — it (per the sidecar's HIGH-severity hypothesis) returns HTTP 500 for the entire list, because a `RUNNING` row trips the mapper; and even if that were fixed, Postgres's `NULLS FIRST` default puts the dateless in-flight row at the *top* of the timeline, labelled by its start time with an empty Duration, with no visual "in flight" badge (per feature-flow facets 2-3 + `TestRunItem.tsx:25-60`). A deleted DQ test loses its run history entirely on this surface (a bare `get(id)` excludes soft-deleted entities — diverging from F-022's deliberate forensic-preservation `existsIncludingSoftDeleted` pattern). Notably, since the sidecar's 2026-05-25 enrichment, the **documentation has caught up and is now ahead of the code**: the dedicated `/features/data-quality/test-run-history` page documents every one of these caveats accurately, including the 500, the cross-owner read, and the PII risk (per WebFetch 2026-06-04) — so the "endpoint undocumented" drift facet is now stale, and the actionable gap has flipped from "write the doc" to "fix the code the doc now warns about."

