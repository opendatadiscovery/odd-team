  Testcontainers test with concurrent reactor pipelines. (a) Two parallel Monos calling getOrCreateTagsByName(["NovelTag"]) at the same time (Mono.zip). (b) Assert ONE caller succeeds with the persisted Tag id; the OTHER caller surfaces UniqueConstraintException (the TOCTOU pin). (c) Test comment: 'PINS the TOCTOU contract. Future fix using INSERT … ON CONFLICT … DO NOTHING / DO UPDATE (or SELECT FOR UPDATE before INSERT) would FLIP this test to expect both callers to get the same id.' Also pair with the ingestData equivalent test that SHOULD succeed (proves ingestData's upsert is safe while bulkCreate is not).
