  - service/activity/handler/AbstractOwnershipActivityHandler.java:18-22 (collectList → JSON without ORDER BY)
  - repository/reactive/ReactiveOwnershipRepositoryImpl.java:130-145 (the 3-table JOIN with no ORDER BY)

