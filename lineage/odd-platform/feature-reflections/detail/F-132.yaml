    `sidecar: unresolved`: there is NO enriched react-component sidecar for QueryExampleDetailsContainer,
    QueryExampleDetailsTabs, QueryExampleDetailsLinkedEntities, QueryExampleDetailsLinkedTerms, or
    QueryExampleDetailsOverview. This reflection reasons from the feature-flow detail's own primary-source
    walk (the .tsx file:line citations embedded in `chain` + `observed_vs_expected`) plus the backend
    QueryExampleController sidecar — it CANNOT judge the rendered, pixel-level user experience (the active-tab
    styling, the badge layout, responsive/device behaviour, the AppTabs primary-variant look). Per Rule 9,
    confident `confirmed` verdicts for a user-facing feature must not be issued from the API + flow-walk
    alone for the experience-level questions; the structural promises (single-fetch, navigation targets,
    empty state) are traced through the flow evidence, but the lived-on-screen experience is not covered.
