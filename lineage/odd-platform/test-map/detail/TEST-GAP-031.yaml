gap_id: TEST-GAP-031
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:DirectoryController
surfaced_by:
- DirectoryController.md:tests_coverage_semantic.uncovered_behaviours.[2]
behaviour: DirectoryController carries no @PreAuthorize annotation; no test asserts
  whether anonymous or low-privilege users can browse the directory. An authenticated
  user with no Permissions and no Owner can enumerate every registered data source's
  ODDRN, host, database, and per-type entity count.
test_files_existing:
- odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/DirectoryTest.java
  (covers happy path only)
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/DirectoryAuthorizationTest.java
  name: getDataSourceTypes_authenticatedUserWithoutAnyPermission_returnsAllDataSources
evidence:
- 'DirectoryController.md says: ''Authorization regressions (e.g. a future @PreAuthorize
  being added or removed) have no coverage at all'''
- 'concepts.yaml:entities[Directory].security_aggregate.weaknesses.[0] verbatim: ''Directory
  is a reconnaissance surface ... can still enumerate every registered data source''s
  ODDRN, host, database, and per-type entity count (severity MEDIUM)'''
cross_references:
- concepts.yaml:entities[Directory].security_aggregate.weaknesses.[0]
proposed_action: Add `WebTestClient` test asserting full enumeration is reachable
  to a permission-less authenticated user (current posture). Surfaces the recon weakness;
  locks posture for fix.
