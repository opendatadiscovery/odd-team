proposed_action: |-
  Add `DirectoryLevel4PageCountDivergenceTest` extending `BaseIngestionTest` so the test exercises the real WebFlux + jOOQ + Postgres stack (mirroring DirectoryTest's existing harness). Three methods:
  (a) `getDatasourceEntities_excludeFromSearchTrue_pageReturnsButCountSkips_pinsBug`: ingest a datasource D with 10 data entities; mutate 3 of them to `EXCLUDE_FROM_SEARCH = TRUE` (direct SQL or via the ingestion-time flag if exposed); WebTestClient GET `/api/directory/datasources/{D}?page=1&size=20`; assert `pageInfo.total` equals 7 (the count predicate skips the 3) AND `items.size()` equals 10 (the page predicate returns all). Assert the divergence is present — `items.size() != pageInfo.total`. Pins the current bug.
  (b) `getDatasourceEntities_pageBoundaryAtCountTotal_returnsExtraRows`: same fixture; GET `/api/directory/datasources/{D}?page=1&size=7`; assert `items.size() == 7` AND `pageInfo.hasNext == false` (per the count) BUT GET `/api/directory/datasources/{D}?page=2&size=7`; assert `items.size() == 3` (rows the count said don't exist). Demonstrates the operator-visible "page 2 returns rows that shouldn't exist" symptom.
  (c) `getDatasourceEntities_noExcludeFromSearch_pageEqualsCount_pinsCommonCase`: same datasource with NO EXCLUDE_FROM_SEARCH entities; assert `items.size() == pageInfo.total`. Pins the common-case behaviour so the bug-fix path can be verified.
  Add `// REGRESSION-PIN — Cross-cutting bug class PREDICATE-DIVERGENCE-IN-PAGINATION-WRAPPERS (REFACTOR-425 family, second confirmed site). The bug-fix is to align cteDataEntitySelect's predicate set with getDataEntityDefaultConditions's third filter. This test PINS the current divergent behaviour. When the maintainer ships the fix, test (a) flips from 'divergence present' to 'parity'; the test should be updated to assert parity at that point.` comment block.
