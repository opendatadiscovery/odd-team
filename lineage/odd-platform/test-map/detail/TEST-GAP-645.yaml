behaviour: |-
  **useEffect quiescence + debounce unit gap (RolesList).** RolesList.tsx:40-42 declares `useEffect(() => { if (!query) dispatch(fetchRolesList({page: 1, size: 100})) }, [fetchRolesList, query])`. The dep array contains a STABLE module-level thunk reference + the `query` string. The intent is a one-shot mount fetch + a refetch whenever `query` returns to empty (e.g. user clears search). The `if (!query)` guard prevents the LSN-017-shape doubling pattern (no fetch-result triggering re-fetch). Lines 53-58 define a 500ms-debounced search dispatch; line 65-67 fires on Enter for explicit-intent search. No test asserts (a) `fetchRolesList({page: 1, size: 100})` fires exactly once on initial mount (NOT on every keystroke); (b) 6 keystrokes within 500ms produce exactly ONE dispatch; (c) Enter-key bypasses the debounce / fires immediately; (d) clearing the search input transitions `query` to `''` and re-fires `fetchRolesList({page: 1, size: 100})` (the explicit-no-query refetch path); (e) the dep array does not exhibit LSN-017 doubling (the broader-than-strictly-needed deps `[fetchRolesList, query]` are harmless because of the `!query` guard). Regression class: a refactor removing the `!query` guard would cause re-fetch on every render where `query` is empty — doubling cost on a route with frequent re-renders (e.g. permission-context re-renders). A refactor changing the dep array to include a derived object (e.g. `[useMemo(() => state.x), query]`) would trigger the LSN-017 doubling.
