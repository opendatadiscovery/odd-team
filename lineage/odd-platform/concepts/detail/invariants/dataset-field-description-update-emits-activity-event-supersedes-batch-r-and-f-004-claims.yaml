description: |-
  CORRECTION INVARIANT, batch 2026-05-20V — SUPERSEDES three prior factually-wrong
  claims that classified DatasetField description-edit as an F-006-audit-silence
  member or as an F-004 audit-emission gap. Primary-source examination of
  DatasetFieldController + the inner-service chain in batch V establishes the
  correct picture: DATASET_FIELD_DESCRIPTION_UPDATED IS emitted on every
  /api/datasetfields/{id}/description PUT; the prior claim 'NEVER emitted' was
  inferred from looking at DatasetFieldServiceImpl alone without descending into
  the inner DatasetFieldInternalInformationServiceImpl one layer deeper.

  THE CORRECTED PICTURE:

    Outer service — DatasetFieldServiceImpl.updateDescription (lines 87-95):
      Carries NO @ActivityLog annotation. Calls the inner service then chains
      termService.handleDatasetFieldDescriptionTerms for term re-extraction.

    Inner service — DatasetFieldInternalInformationServiceImpl.updateDescription
    (line 28):
      Carries @ActivityLog(event = DATASET_FIELD_DESCRIPTION_UPDATED). The
      annotation lives ONE LAYER DEEPER in the call chain than the outer
      DatasetFieldServiceImpl.updateInternalName / .updateDatasetFieldTags
      annotations — but it IS present, IS triggered, and IS dispatched to the
      activity-feed handler.

    Activity handler — DatasetFieldInformationUpdatedActivityHandler.java:27-29:
      Handles DATASET_FIELD_DESCRIPTION_UPDATED. The handler reads the new
      state and dispatches to the activity table.

    Live docs — https://docs.opendatadiscovery.org/features/active-platform-features/activity-feed
    (WebFetched 2026-05-20 status 200):
      Lists DATASET_FIELD_DESCRIPTION_UPDATED verbatim under 'Dataset fields
      (columns)' event types alongside DATASET_FIELD_INTERNAL_NAME_UPDATED,
      DATASET_FIELD_TAGS_UPDATED, DATASET_FIELD_TERM_ASSIGNMENT_UPDATED,
      DATASET_FIELD_VALUES_UPDATED.

  THE STRUCTURAL ASYMMETRY remains, but it has NO OPERATOR-VISIBLE IMPACT:

    The depth of @ActivityLog placement varies across DatasetField mutation
    operations: description's annotation is at the inner service
    (DatasetFieldInternalInformationServiceImpl.java:28); internal-name's
    is at the outer service (DatasetFieldServiceImpl.java:99); tags' is at
    the outer service (DatasetFieldServiceImpl.java:119). The structural
    asymmetry exists because description does extra work (term re-extraction
    via TermServiceImpl.handleDatasetFieldDescriptionTerms — itself emitting
    a separate DATASET_FIELD_TERM_ASSIGNMENT_UPDATED). The outer service
    delegates the inner-service-level emission to keep the annotation
    co-located with the write that actually mutates the field row.

    Operator-visible effect: ALL THREE events fire. The structural asymmetry
    is a code-organisation observation, NOT an audit gap.

  WHAT THIS SUPERSEDES:

    1. F-006 master invariant
       (no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f.yaml
       lines 264-280, 720-755, 829-895) — the 'Tier 1c on DatasetField surface'
       framing is WRONG. DatasetField description-edit is NOT a Tier 1c
       audit-silence example. The Tier 1c slot should be EMPTY (the
       audit-silence pattern is at RBAC + Owner + Datasource + Collector +
       AlertManager-ingress mutations exclusively; the dataset-field surface
       has FULL audit coverage).

    2. F-004 batch-R drift facets
       (feature-flows/detail/F-004.yaml lines 78-91) — the drift facet
       'dataset_field_description_edit_no_activity_log_asymmetric_with_internal_name'
       is WRONG. Re-classify as
       'dataset_field_description_edit_activity_log_at_inner_service_layer_structural_only_no_operator_impact'
       (low severity; cosmetic code-organisation observation; no remediation
       required).

    3. F-004 batch-R drift facet 'dataset_field_update_description_silent_no_op_on_missing_id'
       (lines 92-107) — WRONG. PUT /api/datasetfields/{id}/description on a
       missing id returns 404 NotFoundException, not 200 OK with empty body.
       The .switchIfEmpty(Mono.error(new NotFoundException('DatasetField',
       datasetFieldId))) lives at DatasetFieldInternalInformationServiceImpl.java:33
       BEFORE the activity-log emission. The outer service does NOT need
       its own switchIfEmpty because the inner service throws first.
       Re-classify as 'dataset_field_update_description_404_at_inner_service_layer_correct_behaviour'
       (RESOLVED; no defect; no remediation required).

    4. ReactiveDatasetFieldRepositoryImpl sidecar (batch-R):
        bugs_limitations_corner_cases.[1] — WRONG ('description edits NOT
          recorded in activity feed').
        bugs_limitations_corner_cases.[3] — WRONG ('switchIfEmpty missing
          → 200 OK on missing id').
        doc_drift_findings.[2] — WRONG (similar phrasing).
        dependencies_semantic.coupling.[5] — WRONG (analogous claim).
       All four should be SUPERSEDED-by-this-invariant on the next sidecar
       refresh.

  WHY THE PRIOR BATCH MISSED IT:

    Batch R read DatasetFieldServiceImpl.java alone (the outer service) and
    correctly observed no @ActivityLog on .updateDescription. Batch R DID
    NOT descend to DatasetFieldInternalInformationServiceImpl.java which
    DOES carry @ActivityLog at line 28. The inner-service split is a
    code-organisation choice without operator-visible consequence; a primary-
    source examination of ONLY the outer service produces the wrong picture.
    Batch V reads BOTH services and the activity-feed handler; cross-checks
    against the live activity-feed doc page; and reconciles the picture.

  PATTERN-LEVEL LESSON:

    Multi-layer service compositions (outer DatasetFieldServiceImpl → inner
    DatasetFieldInternalInformationServiceImpl) require @ActivityLog tracing
    at BOTH layers before declaring an audit gap. The pre-emit coherence
    check at batch V is exactly the LSN-018 Rule-6 ritual that surfaces
    such corrections; without that ritual the F-006 + F-004 mis-classifications
    would have propagated forward across more batches.

  SEVERITY: N/A (this invariant is a CORRECTION; it removes prior incorrect
  HIGH/MEDIUM claims and replaces them with a verified-correct-behaviour
  classification).
