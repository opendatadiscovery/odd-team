pillars_affected: [P-04]
surfaced_by:
  - 'dataQuality.md:bugs_limitations_corner_cases.[0] (convention break — dataQualityRoutes.ts is the ONLY route module that does NOT use a private BASE_PATH constant)'
behaviour: |-
  **LOW — `dataQualityRoutes.ts` is the ONLY route module that does NOT use a private `BASE_PATH` constant.** Every other sibling module declares its URL prefix as `const BASE_PATH = '/...'` and references the constant in its path builder:
  - `alertsRoutes.ts:1` — `const BASE_PATH = '/alerts'`
  - `activityRoutes.ts:1` — `const BASE_PATH = '/activity'`
  - `dataEntitiesRoutes.ts:4` — `const BASE_PATH = '/dataentities'`
  - `directoryRoutes.ts:4` — `const BASE_PATH = '/directory'`
  - `masterDataRoutes.ts:1` — `const BASE_PATH = '/master-data'`
  - `dataModelling/dataModelling.ts:3` — `export const BASE_PATH = '/data-modelling'`
  - `searchRoutes.ts:3` — `const BASE_PATH = '/search'`
  - `termsRoutes.ts:4` — `const BASE_PATH = '/terms'`

  This module inlines the literal `/data-quality` directly in the return statement (dataQualityRoutes.ts:2 — `return '/data-quality';`).

  **Why this is a defect, not just a cosmetic choice**:
  - The convention is the 8-of-9-sibling pattern; this module is the outlier.
  - If a future change adds a sub-path under `/data-quality/...` (e.g., a per-status drill-down at `/data-quality/failures`), the maintainer faces friction: either retrofit a `BASE_PATH` constant (a deliberate cleanup) OR copy-paste the literal `/data-quality` in TWO places (the existing builder + the new builder) — silently breaking the single-source-of-truth invariant.
  - Today the convention break is observable via `grep BASE_PATH odd-platform-ui/src/routes/*.ts` (8 sibling modules with BASE_PATH; this module is absent from the matches).

  **No test pins this** — a regression that aligns the convention (adds BASE_PATH) ships green; a regression that introduces a SECOND inlined-literal in a new builder ships green and degrades the maintainer-grep findability.
test_class: missing-unit
criticality_rationale: |-
