performance_aggregate:
  overall: HIGH
  hot_paths:
    - 'Mounted in AppToolbar; mounts on EVERY page of the SPA. Hover-on-icon triggers anchorEl state change which re-renders the menu — cheap (one MUI portal update). useAppInfo + useAppLinks fire once per SPA mount with TanStack Query defaults'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Two parallel HTTP requests (/api/appInfo + /api/links) on first
      mount; both tiny payloads; both cheap server-side (no DB).
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless React component — no client-side persistence beyond
      TanStack Query per-tab cache. Horizontal scaling N/A (UI-only).
  strengths:
    - 'Two useMemo blocks (projectVersion, projectLinks) recompute only when deps change — minimal recomputation'
    - 'keepMounted (line 90) keeps the menu DOM in the tree for the SPA lifetime — minor memory cost; trade-off for instant subsequent open'
  weaknesses:
    - 'TanStack Query staleTime not set on useAppInfo / useAppLinks — every component remount would trigger a refetch. keepMounted MITIGATES this (the widget does not unmount), but other components consuming useAppInfo (Overview.tsx) may pay the refetch cost. staleTime: Infinity would be correct given both endpoints are bound at backend boot (LOW)'
    - 'No pagination — N operator-configured links all render in one menu. Pathological N (1000+) degrades MUI Menu positioning (LOW)'
  cross_file_inconsistencies: []
  contributing_files:
