proposed_action: Add a `WebTestClient` test asserting POST /api/search by any authenticated
  user returns full-catalog aggregation, and that a follow-up `GET /api/search/{search_id}/results`
  with `my_objects=false` enumerates every non-EXCLUDE_FROM_SEARCH entity. Locks the
  read-collaborative posture; converts any future scope-tightening into a deliberate
  test update. Extend the existing `CrossOwnerExposureMatrixTest` (batch A cross-cutting
  pattern) with rows for SearchController.
