    multiplicity_per_trigger: 1
  - hop: 2
    node: "SecurityConstants.WHITELIST_PATHS contains `/actuator/**`"
    sidecar: "SecurityConstants"
    evidence: "SecurityConstants.java:95-96"
    multiplicity_per_trigger: 1
  - hop: 3
    node: "Spring Boot Actuator EnvEndpoint enumerates @Value-bound properties"
