      that does NOT pass the table-id to a permission-scope extractor.
      Contrast with TERM-scoped rules at lines 174-193 (TERM resolver
      passes term_id) and DATA_ENTITY-scoped rules at lines 194-227
      (DATA_ENTITY resolver passes data_entity_id). A Policy granting
      `LOOKUP_TABLE_UPDATE` permits modifying ANY lookup table, not just
      those owned by the user's Owner. The lookup_table_id in the URL
      is NOT used to scope the permission to the specific table's
      owners.
    expected: |-
      Either (a) add a LOOKUP_TABLE resolver that extracts the
      lookup_table_id from the URL + resolves to the parent DataEntity's
      owners (mirror of DatasetFieldResourceExtractor's parent-scoping
      pattern) OR (b) document explicitly that LOOKUP_TABLE_* permissions
      are GLOBAL (not per-table), so operators understand the privilege
      granularity.
