proposed_action: |-
  Service-layer unit test using mock repositories. (a) Mock `groupEntityRelationRepository.getDEGEntitiesOddrns` to return Flux.just(oddrn1, oddrn2). (b) Mock `reactiveDataEntityRepository.getDataEntitiesWithDataSourceAndNamespace(Collection)` to return a map containing ONLY oddrn1 (simulating that oddrn2 was hard-deleted between the two calls). (c) Call `lineageService.getDataEntityGroupLineage(degId)`. (d) Assert the resulting Mono errors with `RuntimeException` matching message regex 'Entity with oddrn .* wasn't fetched'. (e) Test comment 'LOCKS the hard-delete race 500 contract as of 2026-05-19. When the service adds .switchIfEmpty(Mono.empty()) to gracefully skip race-deleted entities, this test FLIPS to expect success with the remaining entity in the response.'
