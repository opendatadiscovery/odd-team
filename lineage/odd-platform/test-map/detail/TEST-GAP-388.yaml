behaviour: 'Silent metadata-delete-on-absence — re-ingesting an entity with a partial
  metadata set DELETES the metadata fields not present in the new payload (MetadataIngestionRequestProcessor.java:72-80
  — `bindingsToDelete = existingMetadataBindings.difference(currentBindings)` followed
  by `metadataFieldValueRepository.delete(bindingsToDelete)`). No `log.warn` on the
  delete path. No test catches this; a regression that "fixes" the delete semantics
  would not break any test. An operator whose collector occasionally emits incomplete
  metadata (network flake, OOM, code bug) sees metadata silently disappear. THIS IS
  LSN-001-shape: silent operator data-loss surface on a default deployment.'
test_class: missing-security
