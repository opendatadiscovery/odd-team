  drift_classes:
    - lost_update_race
    - service_tier_at_reactive_transactional_asymmetry_role_yes_policy_no
realism_caveats: |
  The probe pins the controller-tier-observable manifestation of the
  batch-S service-tier lost-update finding. Limitations: (a) two concurrent
  PUTs are issued from a SINGLE test client — true concurrency depends on
  the test harness's ability to overlap the requests at the WebFlux
  event-loop level; a single-threaded test driver may serialize them
  unobservably. Mitigation: issue both requests in parallel using
  CompletableFuture.allOf or its equivalent in the probe harness, and
  include a millisecond-resolution server-receive-timestamp capture
  through application-logging if available. (b) Even with annotated
  @ReactiveTransactional, the lost-update would not be CLOSED without
  SELECT...FOR UPDATE or a row-version column — the probe asserts the
  current bug shape, not the full set of fix-completeness criteria;
  follow-up probes should pin the fix surfaces independently. (c) The
  probe DOES NOT verify the orphan-binding-on-delete race (the
  isPolicyAttachedToRole-then-delete window at PolicyServiceImpl.java:89-93)
  because that requires THREE concurrent clients (one delete, one role
  bind, one read) — a separate probe should pin that surface (carry-over
  candidate from batch S bugs_limitations_corner_cases[5]).
