gap_id: TEST-GAP-461
category: missing-security
criticality: MEDIUM
node_ids:
  - "odd-platform java service service:NotificationsDispatcher"
pillars_affected: [P-07, P-09]
surfaced_by:
  - "NotificationsDispatcher.md:bugs_limitations_corner_cases.[8] (PII pass-through)"
  - "NotificationsDispatcher.md:security.known_security_gaps.[2] (PII pass-through)"
  - "NotificationsDispatcher.md:security.data_exposure.[0] (full payload to every channel)"
behaviour: |-
  PII pass-through — every channel gets full payload regardless of channel security posture. AlertNotificationMessage carries dataEntity.{id,name,dataSourceName,namespaceName,owners[]} + downstream[] lineage entities. Slack (corporate workspace, potentially many viewers), webhook (operator-defined URL, security posture unknown), email (inbox security varies) all receive the same payload. For organisations whose dataset names encode customer/PII identifiers, every dispatched alert leaks them to every channel. No redaction hook, no allowlist, no PII-tag-aware filter at dispatcher level. Cross-pillar P-09 dimension because the payload structure is uniform across channels with different threat models.
test_class: missing-security
