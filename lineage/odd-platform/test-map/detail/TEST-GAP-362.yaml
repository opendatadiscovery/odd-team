behaviour: 'getDataEntityIdByAlertId returns NULL for a non-existent alert — the method
  returns `Mono.empty()` on no match (lines 392-394). Downstream `AlertResourceExtractor`
  calls it with a String-to-Long conversion; if the alert is missing, the auth context
  resolves to empty and the security framework''s behaviour (deny vs allow vs error)
  is implementation-defined. A bug in this method (wrong join condition, wrong column,
  NULL handling) would resolve the wrong DataEntity and grant or deny the wrong permission
  on `PUT /api/alerts/{alert_id}/status`. test_class: security / integration.'
