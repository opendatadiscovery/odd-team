proposed_action: |-
  Add `ActivityControllerValidationErrorResponseShapeTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` using `@WebFluxTest(ActivityController.class)` + `WebTestClient` + a controlled Spring Boot test slice. The HEADLINE test method:

  1. **`getActivity_nullBeginDate_pinsBodyErrorShape_HTTP400orHTTP200streamingError`** (HEADLINE):
     - Act: `webTestClient.get().uri("/api/activity").exchange()` (no query params; both dates null)
     - Assert (PIN current behaviour — whichever of a/b/c wins):
       - Option A (intent): `.expectStatus().isBadRequest().expectBody().jsonPath("$.code").isEqualTo("BAD_USER_REQUEST")`
       - Option B (body-error leak): `.expectStatus().isOk()` then inspect body for malformed JSON OR connection-reset
       - Option C (generic 500): `.expectStatus().is5xxServerError()`
     - After P-015 measures which is actual, ONE assertion is locked in (the others removed). The test PINS that outcome as the contract.

  2. **`getActivity_nullEndDate_pinsBodyErrorShape`** (variant):
     - Same shape with only end_date null; verify the validation path fires for either-side-null.

  3. **`getActivityCounts_nullDates_pinsResponseShape_noAsymmetricValidation`** (CONTROL — pin TEST-GAP-876 outcome):
     - Act: `webTestClient.get().uri("/api/activity/counts").exchange()`
     - Assert: PIN that getActivityCounts returns 200 OK (the asymmetric path that lacks validation; TEST-GAP-876's contract)

  4. **`getDataEntityActivity_nullDates_pinsBodyErrorShape`** (variant on a sister endpoint):
     - Same shape with `/api/dataentities/{id}/activity`; validates that the body-subscription seam behavior is consistent across the per-entity tab too

  After P-015 confirms the empirical outcome (a, b, or c), refine the test assertions to lock that outcome in. Cross-pair with REFACTOR-NNN if the outcome is undesirable (e.g. if it's option b — body-error leak — the fix is to move the validation to the controller layer where Mono.error propagates cleanly).
