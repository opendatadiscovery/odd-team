  - 'odd-platform__java__IdentityController__controller-class__IdentityController.md:security.known_security_gaps.[1]'
behaviour: |-
  **No `Cache-Control: no-store` on the identity-bearing response.** The
  controller uses bare ResponseEntity::ok (line 26) and new ResponseEntity<>
  (dummyOwner(), HttpStatus.OK) (line 27) — no cache-control headers, no Pragma,
  no Expires. Any shared HTTP intermediate (NGINX, browser back/forward cache,
  mobile carrier proxy) caching on URL alone could serve the previous caller's
  identity body to a later caller. Under DISABLED no security chain runs
  (DisabledAuthSecurityConfiguration.java:14-17 only chains .csrf(disable) +
  .permitAll() — no header customization), so Spring Security's default
  no-cache header injection does NOT fire. Identity-bearing responses are the
  canonical case for explicit no-store; the ServerWebExchange parameter is
  RECEIVED (line 24) but UNUSED — exchange.getResponse().getHeaders().setCacheControl(
  CacheControl.noStore()) is available but discarded.
