proposed_action: |-
  Add `ActivityControllerDdlCancellationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` using Testcontainers + Postgres + manual TCP-level disconnect harness. Three test methods:

  1. **`getActivityWideWindowSizeMax_clientDisconnectDuringStream_pinsConnectionReleaseAndQueryCancel`** (HEADLINE):
     - Arrange: seed 1M activity rows in a single date partition. Start the controller. Configure R2DBC pool size = 5.
     - Act:
       - Start an HTTP/2 streaming request to `/api/activity?size=2147483647` with a sustained connection
       - After the first 100 rows have streamed (~50ms), forcibly close the TCP connection from the client side
     - Assert (1): query the Postgres `pg_stat_activity` view to verify the original SELECT's backend process is no longer running (within 1s of disconnect)
     - Assert (2): the R2DBC connection is returned to the pool within 5s (verify via pool metrics OR pool.usedConnections counter)
     - PIN the cancellation correctness contract

  2. **`getActivityDuringPartitionCreationDdl_pinsLockWaitAndProgress`**:
     - Arrange: trigger a `CREATE TABLE ... PARTITION OF activity` via the partition-creation job (or directly via JDBC) — this takes ACCESS EXCLUSIVE on parent.
     - Act: simultaneously call `/api/activity?begin_date=now&end_date=now+1d&size=10`
     - Assert: the read either (a) completes quickly because the DDL is metadata-only (milliseconds in PG 12+) OR (b) blocks for the DDL duration but eventually returns 200 OK. PIN the actual observed behaviour.

  3. **`getActivityClientDisconnectDuringDdlLockWait_pinsAbortion`**:
     - Arrange: hold the ACCESS EXCLUSIVE lock manually via a parallel JDBC connection running a long-running `LOCK TABLE activity IN ACCESS EXCLUSIVE MODE`.
     - Act: start a `/api/activity` request that will need the lock; the read blocks waiting. After 1s, disconnect the client.
     - Assert: query `pg_stat_activity`; verify the lock-wait entry is removed within 2s. PIN that client disconnect during lock-wait properly aborts.

  After P-014 + P-017 measure the empirical behaviour, refine the test thresholds. Cross-pair with REFACTOR-NNN to introduce R2DBC statement_timeout. Cross-pair with DOC-NNN to document the cancellation contract.
