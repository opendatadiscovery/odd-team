name: Traverse Lineage Graph (recursive-CTE)
canonical_in_docs: true
canonical_candidate: false
description: '`GET /api/dataentities/{data_entity_id}/lineage/downstream` (sibling
  `/upstream`) — NO SECURITY_RULES entry, falls through to `.authenticated()`. Three-line
  delegation to `LineageService.getLineage(dataEntityId, lineageDepth, expandedEntityIds,
  LineageStreamKind.DOWNSTREAM)`. Service issues a single Postgres `WITH RECURSIVE`
  CTE walking `lineage` table rows from the root entity''s `oddrn` for `depth` hops
  (`ReactiveLineageRepositoryImpl.lineageCte`); UNIONed with a depth-1 fan-out around
  any IDs in `expandedEntityIds` (`getLineageRelationsForDepthOne`); merged + distinct;
  per-oddrn metadata fetch (entity + datasource + namespace + group metadata); children-count
  / parents-count maps; assemble + map to `DataEntityLineage` graph DTO. Two client-driven
  inputs: `lineage_depth` (recursion depth bound — `@Min(1)`, no `@Max`) + `expandedEntityIds`
  (depth-1 fan-out around selected nodes for UI progressive expansion). No streaming
  variant; the full graph is `.collectList()`-materialised in heap before serialisation.
  No cycle guard in the recursion (only outer `selectDistinct`). **Batch H — SQL PRIMARY-SOURCE
  CONFIRMATION + REPOSITORY-LEVEL DETAIL**: ReactiveLineageRepositoryImpl batch-H
  sidecar provides the canonical implementation. The CTE (lineageCte at lines 150-176)
  has seed = edges touching the root oddrn set in the chosen direction at depth=1;
  recursive step = JOIN cte on direction-appropriate equality, depth+1, `tDepth <
  lineageDepth` AND not deleted. DOWNSTREAM direction follows parent→child; UPSTREAM
  follows child→parent. Soft-delete filter `IS_DELETED.isFalse()` applied at both
  seed (line 167) and recursive step (line 174). Outer query is `selectDistinct(cte.field(LINEAGE.PARENT_ODDRN),
  cte.field(LINEAGE.CHILD_ODDRN)).from(cte.getName())` — deduplicates the FINAL projection
  but does NOT prune intermediate CTE rows. The depth bound is the SOLE termination
  mechanism — no Postgres `WITH ... CYCLE` clause, no LIMIT, no visited-set guard.
  `LineageDepth.empty()` (value=-1, empty=true) caller-pattern terminates after seed
  step because `tDepth.lessThan(-1)` is FALSE on first iteration (this is the batch-G
  anchor-set defence-in-depth caller at DataEntityRelationsServiceImpl.java:34).'
