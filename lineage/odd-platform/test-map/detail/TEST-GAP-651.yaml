behaviour: |-
  **Search-while-paginating race window edge-case gap.** The user types `foo` (debounced 500ms); concurrent scroll fires `fetchNextPage({ page: N+1, size, query: '' })`. The 500ms-later debounced fire is `fetchOwnersList({ page: 1, size, query: 'foo' })`. If the network response order is REVERSED (the page-N+1 unfiltered response arrives AFTER the page-1 `foo` response), the reducer would APPEND unrelated owners after the `foo` results. The component does not include a request-id / cancellation guard; the reducer's behaviour under out-of-order responses is unverified from the OwnersList scope. The `handleResponseAsyncThunk` infrastructure handles per-request status flags but not response sequencing. NO test asserts (a) the typical-order resolution (page-N+1 first, then page-1 `foo`) — list shows ONLY `foo` matches; (b) the reversed-order resolution (page-1 `foo` first, then page-N+1 unfiltered) — list might show foo + page N+1 unrelated owners; (c) the regression-pin: a future fix introducing AbortController-based cancellation would break the current (no-cancellation) contract — pin that as `.todo` for the intentional re-authoring. Severity MEDIUM because it's racy in production but observable only under fast-typing + slow-network conditions; for the catalogue surface where mixing rows is a directory-correctness issue.
