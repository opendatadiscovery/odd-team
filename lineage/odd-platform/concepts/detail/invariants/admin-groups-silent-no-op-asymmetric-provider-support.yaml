name: admin-groups silent no-op (asymmetric provider support)
canonical_in_docs: false
canonical_candidate: true
description: |-
  `ODDOAuth2Properties.OAuth2Provider.adminGroups : Set<String>` (line 49 of the
  config-POJO) binds successfully from `auth.oauth2.client.{id}.admin-groups: [...]`
  YAML for EVERY provider — but the runtime READ of `provider.getAdminGroups()`
  is implemented ONLY in `AbstractOIDCUserHandler.java:44-55` (Cognito / Azure /
  Custom-OIDC, which all `extends AbstractOIDCUserHandler`) and in
  `GithubUserHandler.java:99-120` (with team-membership scoping). It is NOT
  implemented in `GoogleUserHandler.java:1-74` (which does NOT extend the abstract
  base and never calls `getAdminGroups()`) and NOT relevant to `ODDIAMUserHandler`
  (which uses a flag-based admin scheme). The live docs (WebFetched 2026-05-19,
  status 200) document `admin-groups` for AWS Cognito and GitHub ONLY, NOT for
  Google — consistent with the runtime behaviour, BUT the POJO field is provider-
  agnostic so YAML config DOES bind. The asymmetry produces silent operator
  hostility: an operator setting `auth.oauth2.client.google.admin-groups:
  [workspace-admins]` (perhaps following the Cognito/GitHub pattern) sees the
  field bind successfully at boot, no warning log, no rejection — and at runtime
  the intended ADMIN-by-group assignment NEVER takes effect. The user logs in as
  USER. This is the LSN-001-pattern miss applied to authorization: a silently-
  ignored security-policy config produces a deployment that LOOKS configured but
  is in a fail-OPEN state (intended admins do not get admin; intended-policy not
  enforced). Mitigations: (a) validate at boot — reject if `adminGroups` is non-
  empty for a `provider=google` client; (b) implement admin-groups for Google
  via the OIDC `groups` custom claim (Workspace supports this); (c) document the
  per-provider support matrix explicitly.
axes_present:
