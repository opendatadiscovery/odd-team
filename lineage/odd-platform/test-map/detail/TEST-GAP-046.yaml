gap_id: TEST-GAP-046
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java AttachmentServiceImpl config-key-consumer:attachment.max-file-size@L27
surfaced_by:
- AttachmentServiceImpl@L27.md:tests_coverage_semantic.uncovered_behaviours.[2]
behaviour: 'Server-side enforcement absence: a malicious or buggy client can upload
  chunks whose accumulated size exceeds `maxFileSize` because no service-layer code
  re-reads or enforces it. The cap is advertised via getUploadOptions but NOT enforced
  on the chunked upload path.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/AttachmentSizeLimitBypassTest.java
  name: uploadFileChunk_accumulatedSizeExceedsAdvertisedCap_succeedsWithoutEnforcement
evidence:
- 'AttachmentServiceImpl@L27.md says: ''absence of server-side enforcement — a malicious
  or buggy client can upload chunks whose accumulated size exceeds `maxFileSize`'''
- 'concepts.yaml:entities[Attachment].security_aggregate.weaknesses.[1] verbatim:
  ''Server-side attachment.max-file-size cap is advertised via getUploadOptions but
  NOT enforced on the chunked upload path — non-browser caller can submit arbitrary-size
  files (severity HIGH per consumer + controller sidecars)'''
cross_references:
- concepts.yaml:entities[Attachment].security_aggregate.weaknesses.[1]
proposed_action: Add test where `attachment.max-file-size=1` (MB) but client uploads
