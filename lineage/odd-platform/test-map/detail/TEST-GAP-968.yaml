behaviour: |-
  **MEDIUM — `GET /api/datacollaboration/providers/slack/channels` is fronted by a 1-minute TTL Caffeine cache with `maximumSize(1)` and `expireAfterWrite(1, MINUTES)` keyed on a fixed sentinel string. A freshly-invited bot-channel is invisible to the autocomplete for up to 60 seconds; the staleness contract is undocumented.**

  Verified at primary source: `SlackMessageProviderClient.java:36-44`:
  ```java
  this.cache = Caffeine.newBuilder()
      .maximumSize(1)
      .expireAfterWrite(Duration.ofMinutes(1))
      .buildAsync((key, executor) -> slackAPIClient.getSlackChannels());
  ```

  **Operator workflow consequence**:
  1. Operator invites the ODD platform bot to `#new-channel` via Slack.
  2. Operator immediately switches to ODD platform UI and tries to post a message in `#new-channel` via the Discussions tab.
  3. The Slack channels autocomplete does NOT show `#new-channel` — the platform still serves the cached pre-invite channel set.
  4. Operator waits 60 seconds → invites the bot to additional channels in the meantime → continues to see stale list.
  5. Eventually the cache expires; the autocomplete refreshes.
  6. Operator perceives the autocomplete as "broken" (because there's no documentation explaining the 60-second propagation delay).

  Combined with TEST-GAP-967 (startsWith filter drift), the autocomplete UX is doubly opaque: even when the cache refreshes, the user must guess the prefix to find the channel.

  **The cache is shared across ALL callers** (single-entry, sentinel-keyed): every request for any `channel_name` hits the same cached channel set. There's no per-caller cache, no cache-bypass query param.

  **Why MEDIUM (not LOW)**:
  - The staleness window (60s) is short enough that most operators eventually succeed.
  - But the staleness is UNDOCUMENTED at the live api-reference page (per sidecar's doc_drift_findings.[4]).
  - Cache-poisoning class concern: if a transient Slack API failure populates the cache with a partial channel set, the 60s window magnifies the operator confusion.

  **Distinguishes**: no prior TEST-GAP covers this cache behaviour.
