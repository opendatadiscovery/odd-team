    with no runtime check. A user navigating to
    `/data-modelling/relationships?type=foo` produces
    `type='foo'` typed as `RelationshipsType`; the value flows
    into the backend call at line 20. `RelationshipsTabs.tsx:27-32`
    computes `findInitTabIdx` via `tabs.findIndex(tab => tab.value === type)` —
    for `type='foo'` this returns `-1`, which `AppTabs` interprets
    as "no selection." The Tabs visually show NO active tab,
    while the data-fetch silently runs with `type='foo'` as the
    backend query param. The backend's RelationshipsType enum
    deserialiser would reject the value at controller bind time
    (Spring binding fails on unknown enum values) — the user
    sees an opaque 400. Same shape as the F-024 batch-U
    `lsn_017_latent_dep_array_facet_synced_missing_dep` family
    (URL-as-typed-state without runtime validation). NEW DRIFT
    FACET candidate:
    `relationships_type_url_param_no_runtime_validation_arbitrary_strings_propagate_to_backend_and_tabs_show_no_active_selection_silently`.

    (2) **NEW DRIFT FACET — CROSS-TENANT/CROSS-NAMESPACE
    RELATIONSHIPS ENUMERATION GAP (SHB-025 FACET)** (HIGH,
    information-disclosure refinement). The existing F-037
    `no_authorization_gate_at_any_layer_full_catalog_visibility`
    facet describes the lack of per-user gating end-to-end. This
    slice-B refinement names the SPECIFIC enumeration surface:
    `Relationships.tsx:20-24` fires `useSearchRelationships({
    query, type, size: 30 })` with NO namespace, NO data_source,
    NO ownership filter. The backend repository (per F-037's
    contributing_nodes entry on `ReactiveDataEntityRelationshipRepositoryImpl`)
    applies NO scoping. A multi-tenant deployment running ODD
    behind a single-auth layer (one IDP, multiple operator
    teams) exposes EVERY team's relationships to EVERY
    authenticated operator. The Relationships list page is a
    catalog enumeration oracle for cross-tenant inference (table
    names, relationship cardinalities, data-source identities).
    Companion to the system-mission.md "Read-collaborative
    catalog posture" canonical concept — but specifically the
    relationship surface lacks even the EXCLUDE_FROM_SEARCH=false
    filter applied to DataEntity search (per F-037 existing
    facet's asymmetry note). The shoebox SHB-025 cross-tenant
    enumeration facet pins this as the operator-relevant pillar
