name: IngestionRequestProcessor chain (three-phase pipeline)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW CANDIDATE, batch 2026-05-19I (IngestionService sidecar)** —
  the platform''s ingestion-side orchestration primitive: 14 `IngestionRequestProcessor`
  implementations grouped into 3 phases (INITIAL → MAIN → FINALIZING) by `IngestionProcessorChain`
  (`IngestionProcessorChain.java:17-56`). Within a phase, processors run in parallel
  via `Mono.zip` (line 36); between phases, sequential `.concatMap` (line 39).
  A new processor is added by writing `@Component implements IngestionRequestProcessor`
  with the right `getPhase()` value — no central registration list; Spring DI
  auto-discovery. The chain''s contract: every processor''s side-effects happen
  inside ONE outer `@ReactiveTransactional` (per `single-transaction-per-batch-ingestion`
  invariant) — one failure rolls back EVERYTHING. **Operator-facing concept gap**:
  the chain is invisible to operator docs and to the OpenAPI contract; a contributor
  adding a new processor must infer ordering / shouldProcess discipline from reading
  the existing 14 processors — there is no `developer-guides/...` page covering
  it. **Naming choice**: the file calls it "IngestionRequestProcessor chain"; an
  alternative naming "Ingestion pipeline" might match the operator-facing mental
  model better. proposed_canonical: yes — add a contributor-facing `developer-guides/ingestion-internals`
  (or similar) page naming the chain, the phase enum, the shouldProcess pattern,
  the 14 current processors, and the conventions for adding a 15th.'
proposed_canonical: IngestionRequestProcessor chain
rationale: 'The chain is a load-bearing internal abstraction with stable shape
  (3 phases, 14 processors, Mono.zip intra-phase, concatMap inter-phase). Adding
  a new processor is a recurring contributor activity. The docs do not yet name
  it; new contributors must reverse-engineer the conventions. Documenting it
  closes a contributor-experience gap and prevents the class of bugs where a
  new processor inadvertently breaks the within-phase ordering or registers
  in the wrong phase.'
contributing_concepts:
- 'IngestionService.md:concepts.entities — IngestionProcessorChain (TreeMap by IngestionProcessingPhase.order),
  IngestionProcessingPhase (enum INITIAL=1, MAIN=2, FINALIZING=3)'
- 'IngestionService.md:implicit_adrs.[1] — Three-phase processor chain with parallel
  execution WITHIN a phase, sequential BETWEEN phases'
- 'IngestionService.md:dependencies_semantic.requires-feature — 14 IngestionRequestProcessor
  implementations'
- 'IngestionService.md:dependencies_semantic.coupling.processor_chain_composition'
suggested_add_to_docs: true
notes: |
  Candidate for a future `developer-guides/ingestion-internals` page (or sibling
  to the existing `/integrations/ingestion-filters` operator page). The chain
  is one of those primitives the codebase clearly relies on but doesn't surface
  in any documentation.

  Companion candidate: `alert-action-resolver` (the alert-specific resolver
  consumed by AlertIngestionRequestProcessor in the FINALIZING phase).
