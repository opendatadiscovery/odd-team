  - name: "Controllers are pass-through delegates with HTTP wiring on generated *Api interfaces"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Repository-wide convention: controllers carry only `@RestController` + `@RequiredArgsConstructor` + `@Override` on each method. HTTP method/path/produces/consumes annotations live on the OpenAPI-generated `*Api` interface, NOT on the controller class. AlertController, DataEntityController, DataEntityAttachmentController, DirectoryController, GenAIController all follow this. AlertManagerController is the sole exception (hand-coded, no `*Api` interface, has explicit `// TODO: define OpenAPI spec` comment)."
    axes_present:
