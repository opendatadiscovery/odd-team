# Data Entity Header — product-owner reflection

## product_owner_narrative

The Data Entity Header is the **identity-and-action strip** that crowns every data-entity
detail page in the catalog. It answers, in one horizontal row, the four questions an
operator lands on the page to resolve: *what is this entity, when did it last sync, what
lifecycle state is it in, and what can I do to it right now?* The left column carries
identity (the entity's primary name, its class/type badges — owned by sibling F-177 — and
a "business name" authoring button); the right column carries the cross-cutting actions
(stale indicator, status badge/selector, Edit-group button, Share-to-Slack button). It
serves the full P-01 audience — the catalog browser, the data engineer running a
deprecation, and the operator triaging entity lifecycle (per system-mission.md P-01
"primary user actions": *flag entity statuses; attach business names; spot stale entities
by the orange-clock icon*).

A user interacts with the header by reading the heading and clicking one of up to seven
affordances. The heading itself is data-driven: it shows the operator-authored **business
name** (`internalName`) if one exists, falling back to the collector-ingested **external
name** otherwise (`DataEntityDetailsHeader.tsx:77` — `internalName || externalName`). When
BOTH exist, a small `Original: {externalName}` footer surfaces beneath, signalling that the
operator-chosen name is primary and the imported name is the secondary fact (lines 63-70).
The "Edit" / "Add business name" button (line 92) opens a dialog whose write path is
`DataEntityServiceImpl.upsertBusinessName` (DataEntityServiceImpl.java:338, emitting a
`BUSINESS_NAME_UPDATED` activity event). The status badge is rendered always, but its
`selectable` prop is the permission-check result (lines 113-122). The Edit-group button
(lines 123-131) and the Share-to-Slack button (lines 132-144) each open their own
write-path forms.

The working parts the operator must learn are a **filter lattice of gates**, not a flat
toolbar. Three independent classes of gate decide which of the seven affordances actually
render: (1) **permission gates** — `DATA_ENTITY_INTERNAL_NAME_UPDATE`, `DATA_ENTITY_STATUS_UPDATE`,
`DATA_ENTITY_GROUP_UPDATE` (resource-scoped, resolvable per-entity via the Policy framework,
per updateStatus.md security.authorization_assertions); (2) a **feature-flag gate** —
the Share button is wrapped in `<WithFeature DATA_COLLABORATION>` and the backend route
itself 404s when `datacollaboration.enabled=false`, the default (postMessageInSlack.md:
understanding); (3) a **lifecycle gate** — `!isStatusDeleted` spans the business-name edit
button, the Edit-group button, and (via sibling Overview-tab gates) the Tags/Groups edit
buttons (DataEntityDetailsHeader.tsx:47, :87, :123). The same surface therefore presents a
DIFFERENT affordance set to a viewer, an editor, a non-DataCollaboration deployment, and a
DELETED entity — with no on-screen legend reconciling the variants.

The header is the integration seam where five pillars meet on one row. The status flip
feeds P-07 (the `DATA_ENTITY_STATUS_UPDATED` activity event is the audit-feed row) and
P-08 (a DELETED transition opens the 30-day housekeeping TTL window). The Share button
is the P-07 Data Collaboration sub-feature's entry point (cross-link F-038). The stale
indicator reads a server-computed `isStale` boolean derived from the operator-owned
`odd.data-entity-stale-period` config (P-08 Management; default 7 days, per system-mission.md
P-01 sub-feature seed). The Overview tab beneath is F-176; the badge half of this very row
is F-177; the page-fetch lifecycle that populates it is F-001.

A product owner demoing this header would highlight three edge cases. First, the
**DELETED entity**: open one and every edit button silently disappears — there is no
banner explaining "this entity is soft-deleted and read-only; flip the status back to
edit it", so an operator reads the absence as a permission failure. Second, the
**non-permission viewer**: the status badge looks identical to the interactive one — same
chip, same colour — but clicks do nothing, with no lock icon to set expectations. Third,
the **stale threshold**: a quality test that runs hourly and a daily-ingested dataset are
both judged "stale" by the same global 7-day clock, so the orange-clock signal means
different things for different entity classes with no per-class tuning. The header
mechanically works; these are the seams where the user-visible promise and the
implementation reality drift apart.

