proposed_action: |-
  Repository-layer integration test. (a) Seed live datasource: `(id=1, name='snowflake-prod', oddrn='//snow/prod', description='original desc', namespace_id=10, collector_id=100, token_id=1000)`. (b) Construct a service-bypassing pojo: `new DataSourcePojo().setId(1).setName('snowflake-prod').setOddrn('//snow/prod').setDescription('new desc').setNamespaceId(99).setCollectorId(999).setTokenId(9999)` (deliberately changes namespace_id + collector_id + token_id). (c) Call `dataSourceRepository.bulkUpdate(List.of(pojo))` DIRECTLY (bypassing the service). (d) Read the row back. Assert: `namespace_id == 99` (CHANGED), `collector_id == 999` (CHANGED), `token_id == 9999` (CHANGED). (e) Pin the CONTRACT — the partial-merge protection is a SERVICE-tier guard, NOT a repository-tier guard. (f) Add a `// REGRESSION-PIN — bulkUpdate accepts ANY non-non-updatable column overwrite. The "only name + description" narrowing lives at DataSourceIngestionServiceImpl.prepareForUpdate. A future bulk-update endpoint that bypasses that mapper would silently break cross-collector preservation. REFACTOR-NNN could elevate the narrowing to the repository tier via a typed UpdateMask parameter.` comment block.
