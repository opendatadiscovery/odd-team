gap_id: TEST-GAP-014
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertManagerController
surfaced_by:
- AlertManagerController.md:tests_coverage_semantic.uncovered_behaviours.[4] (Auth
  surface)
behaviour: No test verifies that `/ingestion/alert/alertmanager` accepts anonymous
  requests (i.e. that `/ingestion/**` whitelisting still applies). A future security
  tightening (e.g. extending IngestionDataEntitiesFilter) could break the integration
  silently.
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/AlertManagerWebhookTest.java
  name: alertManagerWebhook_anonymousRequest_acceptedRegardlessOfAuthType
evidence:
- 'AlertManagerController.md says: ''A future security tightening could break the
  integration silently'''
- 'concepts.yaml:entities[AlertManager Webhook Receiver].security_aggregate.weaknesses.[0]
  verbatim: ''No application-layer authentication ... entirely operator-delegated
  to network layer (severity HIGH per sidecar)'''
cross_references:
- concepts.yaml:entities[AlertManager Webhook Receiver].security_aggregate.weaknesses.[0]
proposed_action: Add test posting AlertManager payload anonymously with each `auth.type`
  value (DISABLED/LOGIN_FORM/OAUTH2/LDAP) — assert all return 204 (current posture).
  If operator later adds a shared-secret filter, this test will fail and be updated
  explicitly rather than silently.
