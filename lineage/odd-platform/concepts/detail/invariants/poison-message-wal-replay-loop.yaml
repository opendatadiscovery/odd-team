mitigations_unimplemented:
- |-
  Catch translation exceptions at the dispatcher and route to a dedicated
  poison-message table (alert_notification_poison) instead of propagating;
  advance setAppliedLSN past the bad LSN to unblock subsequent messages.
- |-
  Emit a Prometheus counter (`notification_poison_total{alert_id, error_class}`)
  on each WAL replay-loop cycle so operators get alerted when the loop is
  active.
- |-
  Add a `notifications.poison-skip.enabled` config flag + an operator API
  endpoint to manually mark an ALERT row as poison-skip; the dispatcher
  consults the flag on translate failure and advances LSN past the row.
- |-
  Add a docs section on `/features/active-platform-features/notifications`
  explicitly naming this failure mode and the remediation steps (clean up
  the bad row or drop the replication slot).
notes: |-
  NEW invariant captured in batch 2026-05-19K. The most operationally
  consequential finding of the batch — a persistently-bad ALERT row blocks
  ALL outbound alert delivery cluster-wide with no observability surface
  beyond log inspection. The fragility is INTENTIONAL by the architectural
  posture (the bifurcation between data-integrity errors and delivery
  errors is deliberate per implicit_adrs.[3]) but the absence of a
  remediation path is the operational gap.

  Cross-cutting connections:
    - Pairs with the "WAL Consumer + Postgres Replication Slot" entity
      concept — this is the entity's load-bearing failure mode
    - Companion of the "Exception-type asymmetry between sender impls"
      invariant — both surface the bifurcation between fail-loud and
      fail-soft paths in the dispatcher
    - Companion of the "Lazy-create-no-drop replication artefacts"
      invariant — dropping the replication slot to remediate the poison
      loop also drops in-flight undelivered alerts

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the failure mode on the live notifications page with
        operator-facing remediation steps
    (b) Document a Prometheus alerting recipe for detecting the replay
        loop
    (c) Document the alternative architecture (poison-skip table + LSN
        advance) as a future-evolution ADR
