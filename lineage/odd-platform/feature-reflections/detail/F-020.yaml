- id: H-007
  hypothesis: "When an operator deletes a collector, its credential is destroyed too — deleting the collector retires the secret so a leaked backup can't resurrect it."
  derivation: "UI label ('Delete') + negative-space (a credential desk that leaves live secrets behind after a delete violates the operator's data-retention expectation)."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Delete is a soft-delete that orphans the token row permanently. The inherited
      ReactiveAbstractSoftDeleteCRUDRepository.delete issues `UPDATE collector SET
      deleted_at = NOW()`; CollectorServiceImpl.delete (lines 71-80) issues only
      `collectorRepository.delete(id)` with NO tokenRepository.delete. The TOKEN
      table has no soft-delete column at all (V0_0_28 declares only id, value,
      created_at, created_by, updated_at, updated_by), so the row referenced by
      collector.token_id is left in the table — value still plaintext, still
      discoverable via `SELECT * FROM token` — with no housekeeping job to purge it.
      The partial unique index collector_token_unique (WHERE deleted_at IS NULL)
      ALLOWS the orphan because it only constrains live collectors. The credential
      of a "deleted" collector persists forever in the table and in every backup,
      replica, and pg_dump.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveCollectorRepositoryImpl.md
        section: "bugs_limitations_corner_cases[1] (soft-deleted collector orphaned token row)"
        cite: "ReactiveAbstractSoftDeleteCRUDRepository.java:50-58 + V0_0_28__add_token.sql:1-9 + V0_0_33__add_token_constraints.sql:1"
        note: "Soft-delete UPDATEs only the parent; TOKEN has no soft-delete; no janitor."
      - sidecar: odd-platform__java__CollectorController__controller-class__CollectorController.md
        section: "bugs_limitations_corner_cases[0] (DELETE leaves orphan TOKEN row)"
        cite: "CollectorServiceImpl.java:71-80"
        note: "delete path issues no tokenRepository.delete; cross-confirmed at controller tier."
    operator_visible_failure: |
      (1) An operator who deletes a retired collector to "get rid of its access"
      leaves a live plaintext credential in the database indefinitely; combined with
      the plaintext-at-rest storage (H-008), every backup carries credentials for
      collectors the operator believes are gone. (2) Incident-response queries
      against the TOKEN table by id range surface credentials that should have been
      retired. (3) Data-deletion / GDPR-style retention contracts are silently
      violated — the operator's delete did not delete the secret.
    severity: MEDIUM
    confidence: HIGH
    use_case_kind: teardown
    coverage: unverified
    coverage_note: |-
