assert:
  - "ds_after_scenario_b.name == 'p076-renamed-A'  # scenario A's rename persisted"
  - "final_description == null OR final_description == ''  # scenario B: clearing Description in the modal NULLED the stored description — REPLACE-not-MERGE confirmed from the UI"
