proposed_action: |-
  Add `TermServiceImplStoredXssTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/term/`. Four test methods:
  1. `handleDataEntityDescriptionTerms_withScriptPayloadInTermMentionBrackets_persistsVerbatimInUnhandledTermStagingRow` — call `handleDataEntityDescriptionTerms(dataEntityId, '[[<script>alert(1)</script>:foo]]')`; assert the resulting `data_entity_description_unhandled_term` row exists with `term_namespace_name = '<script>alert(1)</script>'` (lowercased) and `term_name = 'foo'`. Pin the unsanitised persistence.
  2. `handleDataEntityDescriptionTerms_withHtmlTagsInNamespace_acceptedByRegexCharClass` — pin the regex's `[^:]*?` character class accepting `<`, `>`, `"`, `'`, `&` — the operator-visible attack surface boundary.
  3. `getDataEntityTerms_afterStoredScriptPayload_returnsRawPayloadInStagingRowResponse` — confirm the read-side exfiltration: insert the staging row directly, call `getDataEntityTerms(dataEntityId)`, assert the response includes the unsanitised staging-row content.
  4. `handleDataEntityDescriptionTerms_underAuthDisabled_anonymousUserCanPlantPayload` — pin the DISABLED-mode anonymous-write surface for the auto-link side-channel (compounds with TEST-GAP-478).

  Pair with a SERVICE-LAYER fix at `TermServiceImpl.java:67-360`: either (a) sanitise the regex match groups before INSERTing into staging tables (using Jsoup or similar Java HTML sanitiser); OR (b) require the namespace and name capture groups to match a strict identifier regex (`[a-zA-Z0-9_-]+`) and reject mentions that don't conform (would close the side-channel by failing the staging write). Either fix should be paired with this test asserting the SAFE behaviour after the fix lands. Until then, this test PINS the unsafe behaviour as a regression-prevention measure.
