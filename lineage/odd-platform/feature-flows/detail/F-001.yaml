  - facet: Overview is the HOME-PAGE MOUNT closing the F-001 inflation loop (batch ZA)
    observed: |-
      `Overview.tsx:25-27, 53-59` — the home-page chrome conditionally
      mounts `<OwnerAssociation>` (which mounts `<OwnerEntitiesList>`
      which renders the four-column Recommended panel INCLUDING the
      Popular column). The gate is
      `isShowOwnerAssociation = Boolean(appInfo?.authType && appInfo.authType !== 'DISABLED')`.
      Under LOGIN_FORM/OAUTH2/LDAP (the 99% case), the gate evaluates
      TRUE and the Popular column renders with the FULL CATALOG-WIDE
      popular list — NO owner-scoping at the home-page chrome layer,
      NO per-tenant partition (the backend's `listPopular` CTE has no
      `WHERE owner_id = current_user_owner_id` clause per F-003 facet
      `service tier is a 1-line pass-through`). Overview itself fires
      NO data fetch for the Popular column directly — it just controls
      VISIBILITY of the wrapper. EVERY signed-in user with an owner
      association sees the SAME Popular column ranked by global
      view_count DESC — including users whose Owner has zero data
      entities. Overview is therefore the UPSTREAM-MOST home-page
      surface from which the F-001 inflation loop is reachable.
      Overview.tsx itself contains NO useEffect (sidecar
      bugs_limitations_corner_cases[2] severity LOW — clean today;
      surfaced as a regression risk and a cross-reference).
    expected: |-
      The UI-tier inflation-loop closure is the realisation point of
      REFACTOR-220 producer↔consumer closure. The home-page wrapper
      chain (Overview → OwnerAssociation → OwnerEntitiesList →
      PopularStrip) is structurally the cheapest place to add a
      client-side defence (no-refetch-on-back-navigation, per-session
      debounce, analytics-only mode that does NOT trigger
      incrementViewCount), but none exists today.
    drift_class: ui_amplification
    provenance: |-
