behaviour: |-
  **CRITICAL — `PUT /api/datasources/{data_source_id}/token` is a DESTRUCTIVE in-place
  credential rotation whose BINARY-CUTOVER contract is entirely untested at every
  layer. The single most operationally important uncovered behaviour on the
  DataSourceController surface: the instant `tokenRepository.updateToken` commits,
  the OLD data-source token must start failing `POST /ingestion/entities` with 401
  `Token is not correct` and the NEW token must start authenticating — with NO
  two-valid window and NO zero-valid window.** Method-level primary source from the
  batch-ZB `regenerateDataSourceToken` controller-method sidecar:

  - `DataSourceServiceImpl.regenerateDataSourceToken` (DataSourceServiceImpl.java:99-106):
    loads the `DataSourceDto`, hands its `TokenPojo` to `tokenGenerator.regenerateToken`
    (an in-memory `setValue(RandomStringUtils.randomAlphanumeric(40))` mutation), persists
    via `tokenRepository.updateToken` — a single jOOQ `UPDATE token SET value=<new> WHERE id=:id`.
  - There is exactly ONE `token` row per data source (1:1 via `DataSourcePojo.token_id`);
    the UPDATE overwrites the old value. There is NO `previous_token` column and NO
    `valid_until` column anywhere in the schema — revocation of the old token is a
    side effect of overwriting it (sidecar `implicit_adrs[0]`, `stress_findings.name_behavior_pairs`).
  - **The downstream consumer** is `IngestionDataEntitiesFilter` (IngestionDataEntitiesFilter.java:43-58):
    it resolves `dataSourceRepository.getDtoByOddrn(...)`, takes `dto.token()`, and does a
    literal plaintext `.equals(token)` (line 56-57) — throwing `AccessDeniedException("Token is
    not correct")` on mismatch. The moment `updateToken` commits, an in-flight ingestion
    request carrying the old token starts 401-ing.

  **Why CRITICAL**: this is the load-bearing operator contract of the entire token-rotation
  feature — "rotation invalidates the old credential, the new one works." It is also a
  security contract (a leaked token MUST stop working after rotation). The endpoint, its
  service, its repository, and the cross-path integration with `IngestionDataEntitiesFilter`
  ALL have ZERO direct test coverage (Glob-verified at the class sidecar — no
  `DataSourceControllerTest`, no `DataSourceServiceImplTest`). A regression — e.g. a
  `getDtoByOddrn` cache, a `.contains` instead of `.equals`, an FTS-stale token snapshot —
  would silently break the binary cutover with NO test to catch it. The sidecar rates this
  the highest-leverage single test on the node and the maintainer's class sidecar already
  recorded an open CRITICAL test-gap for it; this entry pins it with the specific probe.

  **Test gap shape**: a `WebTestClient` / `@SpringBootTest` integration test (or a
  Testcontainers ingestion-flow test) that: (1) registers a data source, captures its
  token T_old; (2) `POST /ingestion/entities` with T_old → assert non-401 (the baseline);
  (3) `PUT /api/datasources/{id}/token` → capture the response body's NEW plaintext
  T_new (T_new != T_old); (4) `POST /ingestion/entities` with T_old → assert 401
  `Token is not correct`; (5) `POST /ingestion/entities` with T_new → assert non-401.
  Pinned by probe P-051.
