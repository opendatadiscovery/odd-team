cross_pillar_relationships:
- pillar_id: P-10
  kind: feeds_from
  via: |-
    The dashboard renders ALREADY-INGESTED data-quality test runs — ODD
    performs no checks itself (the aggregator-only pillar invariant; live doc
    features/data-quality 2026-05-22 status 200). DQ test results arrive via
    P-10 Integrations & Ingestion (POST /ingestion/entities DataEntityList
    items carrying the DataQualityTest entity-class + the per-run results).
    F-032 is the catalog-wide READ surface for that ingested signal; the
    GET /api/dataqatests/runs endpoint fans out to three repository queries
    (getLatestDataQualityRunsResults / getLatestTablesHealth /
    getMonitoredTables) zipped server-side into one DataQualityResults DTO.
- pillar_id: P-07
  kind: feeds
  via: |-
    A failing DQ test run is the same signal that drives Alerting (F-007
    AlertManager Integration emits FAILED_DQ_TEST alerts via
    AlertActionResolver). The dashboard's Test Results Breakdown ring and the
    per-category FAILED tiles VISUALISE the aggregate of that signal; the
    alert pillar REACTS to each individual failure. F-032 is a read/aggregate
    surface, not an event surface — the relationship is sibling-consumers of
    the same ingested DQ run data.
- pillar_id: P-08
  kind: shares_data_with
  via: |-
    The filter sidebar's five dimensions (Namespace, Datasource, Owner, Title,
    Tag) are populated from the same catalog-metadata list APIs that back the
    Management pillar's lifecycle features — useGetNamespaceList /
    useGetDataSourceList / useGetOwnerList / useGetTitleList / useGetTagList.
    The "Title" filter binds to OWNERSHIP.TITLE_ID (an ownership ROLE such as
    "Data Steward"), the same TITLE table the Owner-association Management
    surfaces operate on. The dashboard READS that metadata for filtering; it
    does not mutate it.
