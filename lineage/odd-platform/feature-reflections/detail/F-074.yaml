    When auth.type=DISABLED (the shipped default), an UNAUTHENTICATED network
    caller issues GET /api/owners (or any of the seven list endpoints) and receives
    HTTP 200 with the full directory — no login, no token, no 401.
  derivation: |-
    DisabledAuthSecurityConfiguration builds .anyExchange().permitAll(); the
    SECURITY_RULES table is inert under DISABLED; application.yml:34 ships DISABLED
