# Namespace Lifecycle — create / list / details / update / delete — product-owner reflection

## product_owner_narrative

**What the feature is.** Namespaces are the platform's label-dimension scoping primitive — the
logical grouping ("finance", "data-engineering", a team or a domain name) that tags, terms,
datasources, collectors, data entities, and lookup tables attach to (per system-mission.md:235 P-08
sub-feature seed; per NamespaceAutocomplete:understanding which enumerates the five binding forms).
Namespace Lifecycle Management is the operator-facing CRUD surface over that primitive: an operator
opens **Management → Namespaces** (the canonical landing tab — `<Navigate to='namespaces' replace />`
at ManagementRoutes.tsx:151, per management-route sidecar implicit_adrs[2]), sees the list of every
namespace, and can create, rename, or delete one. Five HTTP endpoints back it
(`NamespaceController.java:1-62` — create / get / list / update / delete) and the user-facing promise
is the Management doc's verbatim line: *"Create a namespace before authoring tags or terms that should
be scoped to a particular team or domain"* (per NamespaceController:docs_link_semantic, live
/features/management 2026-05-20).

**How a user interacts with it.** Two distinct entry surfaces, and the distinction is the whole story
of this feature. (1) The **dedicated Management → Namespaces tab** is the deliberate-create surface:
the operator types a name into a one-field form (NamespaceForm — `rules={{required, validate:trim}}`
only, per ui_review_2026_05_26 note 2) and saves; this path POSTs `/api/namespaces` and is gated by the
`NAMESPACE_CREATE` permission (per NamespaceController:security.authorization_assertions,
SecurityConstants.java:98-102). (2) The **inline select-or-create combo-box** — `NamespaceAutocomplete`
— is mounted on FIVE other forms (Add-datasource, term, data-entity-group, collector, lookup-table; per
NamespaceAutocomplete:upstream_callers). From the user's seat, they click the "Namespace" field, see a
debounced dropdown of existing namespaces, and — if they type a name that matches nothing — a labelled
row appears: *"No result. Create new custom namespace «X»"* (NamespaceAutocomplete.tsx:78-84,168-174).
Selecting it sends the typed name to the backend's `getOrCreate`, which creates the namespace as a side
effect of saving the parent entity. This is a deliberate, on-screen, labelled affordance — NOT a hidden
back door (per NamespaceAutocomplete:coherence_notes, the LSN-023 case-law artefact).

**The working parts.** Name uniqueness is DB-enforced via a *partial* unique index
`namespace_unique ON namespace(name) WHERE deleted_at IS NULL` (V0_0_31:25), which deliberately enables
**soft-delete reincarnation** — delete "finance", and a later create of "finance" succeeds with a brand
new id and history (per NamespaceController:implicit_adrs[3]). Name comparison is **case-sensitive**
("finance" and "Finance" are two distinct namespaces; ReactiveNamespaceRepositoryImpl.java:26). Delete
is guarded at the application tier against exactly **four referent classes** — DataSource, Collector,
Term, non-deleted DataEntity — via a `Mono.zip` of four `existsByNamespace*` checks
(NamespaceServiceImpl.java:73-90); if any referent exists the delete raises `CascadeDeleteException`
(surfaced as 400). List/details reads are **ungated** — any authenticated user enumerates every
namespace (read-collaborative posture, per system-mission.md:267 and NamespaceController:implicit_adrs[1]).

**The integration story.** This feature feeds Discovery (namespace pills on catalog/search facets, P-01),
the Data Glossary (term-to-namespace binding, P-06), and the producer ecosystem (datasource/collector
namespace, P-10), and shares the RBAC boundary with Security (P-09). The load-bearing cross-pillar
interaction is the side-door: four sister services — TermServiceImpl, DataSourceServiceImpl,
CollectorServiceImpl, DataEntityGroupServiceImpl — call `namespaceService.getOrCreate(name)` from their
own create/update flows (8 call sites; TermServiceImpl.java:103,138 confirmed primary-source), so a
caller holding TERM_CREATE / DATA_SOURCE_CREATE / COLLECTOR_CREATE / DATA_ENTITY_GROUP_CREATE — but NOT
NAMESPACE_CREATE — mints namespaces. The two readings of this fact (an RBAC-bypass of the dedicated
permission vs. the intended product UX) are reconciled in H-007.

**Edge cases a product owner would flag in a demo.** (a) Type a 65-character namespace name → you get an
opaque server error, not a friendly "too long" message (H-006). (b) Delete a namespace someone bookmarked
→ recreating the name gives a new id; the bookmark and historical links break silently (H-008). (c) There
is **no audit trail** — `ActivityEventTypeDto` has no `NAMESPACE_CREATED/_UPDATED/_DELETED` value, so
"who created the finance namespace and when" is unanswerable from production data (H-011 negative-space).
(d) Delete a namespace while someone else is concurrently attaching a datasource to it — the check + the
delete are not atomic, so an orphan referent row pointing at a soft-deleted namespace is possible (H-013).
None of (a)–(d), nor the case-sensitivity surprise, nor the side-door, is documented anywhere
user-facing — and there is no dedicated `/features/management/namespaces` page at all (404 confirmed
2026-05-27).

