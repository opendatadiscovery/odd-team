proposed_canonical: AlertManager Webhook Receiver
rationale: 'Distinct concept from the platform''s internal Alert lifecycle: external
  write-only ingress, no `*Api` interface, hand-rolled DTO, unauthenticated by design
  (operator-delegated). Live `configuration-and-deployment/odd-platform#prometheus-alertmanager-integration`
  documents the endpoint but main-concepts.md does not register the concept (it does
  list ''Slack alert webhook'' as the OUTGOING alert webhook — the inbound AlertManager
  receiver is the conceptual sibling not listed). Cross-references the Alert concept
  (every webhook payload becomes a DISTRIBUTION_ANOMALY Alert) but the receiver itself
  has its own auth posture, perf shape, and operator audience.'
contributing_concepts:
- ExternalAlert (AlertManagerController)
- AlertManagerRequest (AlertManagerController)
- DISTRIBUTION_ANOMALY alert (AlertManagerController)
- entity_oddrn label (AlertManagerController)
suggested_add_to_docs: true
