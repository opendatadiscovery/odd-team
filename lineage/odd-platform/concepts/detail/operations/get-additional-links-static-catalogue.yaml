name: Get Additional Links (static operator-configured catalogue)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-08
description: |-
  NEW OPERATION, batch ZE — GET /api/links. Returns LinkList
  payload (items[].{title, url}). Fired on every UI mount of the
  App toolbar (every routed page, via AppInfoMenu.tsx:18 +
  appInfo.ts:11-17 with default useQuery staleTime=0 — refetches
  on every mount).

  IMPLEMENTATION: LinksController.java:25-36 streams the
  AdditionalLinkProperties.links() record-list to API Link DTOs.
  AdditionalLinkProperties is @ConfigurationProperties bound at
  boot from odd.links[].{title,url}; no DB, no cache, no
  outbound HTTP.

  ORDERING: insertion order via Spring's @ConfigurationProperties
  list binder (documented Spring behaviour, not asserted by any
  test). No explicit sort.

  PAGINATION: NONE — full catalogue per response. No `size`
  parameter, no `page` parameter, no LIMIT. Pathological
  operator config (1000+ entries) degrades the menu render.

  AUTH POSTURE: no @PreAuthorize; not in WHITELIST_PATHS;
  pathMatchers('/**').authenticated() fall-through under
  non-DISABLED. Under DISABLED: 200 to anonymous (operator-internal
  URLs leak to the public internet if the deployment is
  internet-facing).

  SECURITY POSTURE: URL scheme NOT validated at backend —
  operator-supplied `javascript:` or `data:text/html` URLs pass
  unsanitised; React 17+ neutralises `javascript:` but
  `data:text/html` may render. The UI also omits
  rel='noopener noreferrer' on target='_blank' rendering —
  reverse-tabnabbing vector for every configured URL.

  HOT-PATH-LIKE: high call frequency (every page mount) but
  per-call cost is in-memory list copy. The fetch is cheap so
  the missing TanStack-Query staleTime: Infinity is conceptually
  wrong but operationally negligible.
axes_present:
