control_summary: |-
  0 of 4 cells PROBED — feature MINTED this batch (W) from
  NamespaceController class sidecar primary-source. FIFTEEN load-bearing
  drift facets anchored on three themes: (a) side-door directory growth
  via 4 sister services — REFACTOR-NNN-NamespaceSideDoor candidate
  cross-cuts P-06 / P-08 / P-10 because TERM / DATA_SOURCE / COLLECTOR /
  DATA_ENTITY_GROUP forms ALL bypass NAMESPACE_CREATE; (b) cascade-check
  + delete non-transactional TOCTOU race; (c) operator-facing surprise
  surfaces — case-sensitivity, soft-delete reincarnation, oversize-name
  500-vs-400, ungated reads. Service-layer unit-test coverage at the
  happy-path tier is comprehensive (NamespaceServiceImplTest exercises
  10 distinct paths) but the controller-tier authorization wiring + the
  cross-pillar side-door bypass + the TOCTOU race are unverified.

  The HIGHEST-LEVERAGE probe candidates:
  (a) Side-door directory growth regression-pin — grant a test user only
      TERM_CREATE (NOT NAMESPACE_CREATE), POST /api/terms with a never-seen
      namespaceName, then GET /api/namespaces and assert the row was minted.
      Repeat for DATA_SOURCE_CREATE-only, COLLECTOR_CREATE-only,
      DATA_ENTITY_GROUP_CREATE-only. 4-cell test matrix maps to the 4
      sister services.
  (b) TOCTOU race regression-pin — fire DELETE /api/namespaces/{id} + POST
      /api/datasources with namespace_name=existing concurrently from two
      threads; observe orphan data_source row referencing soft-deleted
      namespace OR cascade-deferred outcome.
  (c) Oversize name 500-vs-400 contract pin — POST /api/namespaces with
      name of 65 characters; assert response status (currently 500;
      after fix, should be 400).

  Local docker-compose probe stack: ODD platform + Postgres + a pre-seeded
  user with TERM_CREATE-only policy. The side-door probe is straightforward;
  the TOCTOU probe requires concurrent dispatching which jOOQ on R2DBC
  can drive via Reactor parallel scheduler.

  Cross-feature coherence: this feature LIVES INSIDE pillar P-08 Management
  & Administration (per system-mission.md:240 "Namespaces (label-dimension
  scoping for tags / terms)" as the first P-08 sub-feature seed). It is
  DISTINCT FROM F-019 (Owner Lifecycle Management) — both are P-08
  operator-facing CRUD surfaces but namespaces are the SCOPING primitive
  (labels) while owners are IDENTITY primitives (people / teams). Cross-link
  to F-008 (the DataSourceController batch-W ADR-CANDIDATE-143 counterfactual
  finding — UI admin DataSource path ACCEPTS namespace_name, S2S DROPS it;
  the namespace inheritance asymmetry is the operator-surface manifestation
  of the side-door behaviour catalogued in this feature). Cross-link to
  F-002 (the P-06:F-001 cross_namespace_term_pollution facet is the
  cross-pillar manifestation of THIS feature's case-sensitivity + name
