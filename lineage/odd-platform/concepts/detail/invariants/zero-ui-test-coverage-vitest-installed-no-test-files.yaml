- 'Bootstrap UI test coverage with the highest-leverage tests identified by
  batch J: (a) LSN-017 regression-pin (1 dispatch per mount); (b) F-004
  rehype-sanitize unit-level guard; (c) partial-permission-gating semantic
  for DataEntityDescription; (d) PopularStrip click-target navigation; (e)
  LineageGraph diamond-DAG rendering pin'
- 'Adopt a baseline of "every new component ships with a .test.tsx" — once
  the first 5-10 tests exist, the pattern is self-replicating'
- 'Set a CI gate: any PR touching a component file must include / update a
  test file; the harness already exists, the bar is procedural not technical'
- 'Promote system-level probes (P-004, P-009) to CI-permanent Playwright specs
  — interim regression-pin until unit coverage catches up'
notes: |-
  New invariant captured in batch 2026-05-19J. The zero-UI-test-coverage state is
  the single biggest test-coverage gap on the platform. The harness exists; the
  bar is procedural. A maintainer prioritising test coverage should bootstrap
  with the LSN-017 + F-004 regression-pins (highest-leverage; both already
  empirically pinned by system probes) and grow outward.

  The 5 batch-J sidecars each surface 5-10 uncovered behaviours suitable for
  unit-test bootstrapping. Combined: ~40 distinct testable assertions across the
  5 components. A focused 2-3 day effort by one engineer would close the
  highest-value subset.
