        note: "No UI consumer today; generated client ships unused."
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_config_properties__config-properties-class__GenAIProperties
        section: bugs_limitations_corner_cases[4]
        cite: "Grep for GenaiApi outside generated-sources/ (zero matches)"
        note: "Confirms API-only from the config-tier sidecar."
    operator_visible_failure: |-
