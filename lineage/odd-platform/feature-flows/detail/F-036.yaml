    severity: MEDIUM
    observed: "title.name varchar(128) UNIQUE \u2014 no @Pattern, no @Size, no normalisation\n(case-folding, trimming, slug-deduping). Two operators typing slightly\ndifferent forms ('Data Steward', 'data\
      \ steward', 'DATA STEWARD',\n' Data Steward ', 'data-steward') accumulate as DISTINCT rows. A Policy\ncondition `dataEntity:owner:title == 'Data Steward'` silently misses\nevery other-casing variant."
