batch_origin_note: |-
  2026-05-20 batch Q — NEW pillar-anchored feature minted from the
  convergence of the CollectorsList UI-tier sidecar with prior
  CollectorController backend sidecars (registerCollector +
  updateCollector + deleteCollector + regenerateCollectorToken +
  getCollectorsList — the five-endpoint surface). The Collector
  lifecycle is a coherent user-observable Management surface (per
  the live /features/management Collectors-tab description: 'Registered
  Collectors and their tokens. Issue new tokens, view existing token
  IDs, regenerate or revoke.') that warrants standalone feature-flow
  treatment rather than scattering its drift facets across F-008
  (the credential consumer) or F-019 (sibling Management UI). F-020
  anchors the lifecycle as a single feature with 12 load-bearing
  drift facets and cross-links to F-008 (credential consumer pair),
  F-019 (sibling Management UI), F-006 (permission family), and
  F-011 (auth-mode posture).

  Per Rule 0 evaluation: the substitution from EXTEND-F-008 to MINT-F-020
  is justified because (a) the Collector lifecycle is a USER-OBSERVABLE
  Management capability — operators CRUD the producer ecosystem
  through this UI; (b) F-008 carries the credential-CONSUMER side
  (the two ingestion filters that GATE on the token) — operators
  ingesting metadata; (c) the two are distinct user-observable
  contracts, share data (the token) but encode different operator
  workflows. The substrate evidence supports separation: F-020 emerges
  from a complete UI + backend trinity that lives under P-08
  Management; F-008 lives under P-10 Integrations & Ingestion. The
  cross-pillar `feeds` relationship is recorded above.
