name: Chunked File Upload (3-step state machine)
canonical_in_docs: false
canonical_candidate: true
description: 'Per-data-entity attachment file upload protocol: `initiateFileUpload`
  (issues server-side uploadId UUID from posted DataEntityUploadFormData) → `uploadFileChunk`
  (posts each part with index and the same uploadId) → `completeFileUpload` (finalises
  and returns DataEntityFile). uploadId is the authoritative session key; the path''s
  dataEntityId is effectively cosmetic on uploadFileChunk and completeFileUpload.
  Method-level uploadFileChunk sidecar verifies: chunk staging path /tmp/odd/chunks
  is hardcoded constant (FileUtils.CHUNK_BASE_PATH), storage-mode-independent (applies
  to both LOCAL and REMOTE attachment.storage).'
axes_present:
- controllers
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController
- odd-platform java DataEntityAttachmentController controller-method:uploadFileChunk
contributors:
- 'DataEntityAttachmentController.operations: chunked-file-upload (3-step state machine:
  initiateFileUpload → uploadFileChunk → completeFileUpload)'
- 'uploadFileChunk: middle-step semantics — Integer.parseInt on index (NumberFormatException
  unhandled), delegates to FileServiceImpl.uploadFileChunk which requires PROCESSING-state
  FilePojo and writes via FilePart.transferTo'
