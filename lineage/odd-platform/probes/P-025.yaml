# P-025 — updateTag (rename) FTS search-vector propagation to carrying entities

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (2510, '//probe-source-P-025/db', 'probe-source-P-025')
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, hollow, view_count,
         source_created_at, source_updated_at)
      VALUES (2510, '//probe-source-P-025/db/tables/p025_tagged_entity', 'p025_tagged_entity',
              2510, 1, false, 0, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # A single tag with a distinctive original name.
  - kind: sql
    query: |
      INSERT INTO tag (id, name, important, created_at, updated_at)
      VALUES (2510, 'p025originalname', false, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      INSERT INTO tag_to_data_entity (tag_id, data_entity_id, external)
      VALUES (2510, 2510, false)
      ON CONFLICT (tag_id, data_entity_id) DO NOTHING

  # Prime the search_entrypoint.tag_vector for the entity by triggering the
  # same code path the assignment flow would: call updateChangedTagVectors
  # via a no-op update first, so the BEFORE state is a populated vector
  # containing 'p025originalname'.
  - kind: rest
    method: PUT
    path: /api/tags/2510
    body: '{"name": "p025originalname", "important": false}'
    capture_as: prime_response

observe:
  # BEFORE state: search for the original name should return the entity.
  - kind: rest
    method: GET
    path: /api/search/data_entity?query=p025originalname
    capture_as: search_before_rename

act:
  # Rename the tag. The new name is equally distinctive and shares no token
  # with the old name, so a search for either is unambiguous.
  - kind: rest
    method: PUT
    path: /api/tags/2510
    body: '{"name": "p025renamedvalue", "important": false}'
    capture_as: rename_response

observe:
  - kind: jsonpath
    from: rename_response_body
    path: "$.name"
    capture_as: renamed_tag_name

  # AFTER state H1: search for the NEW name should now return the entity.
  - kind: rest
    method: GET
    path: /api/search/data_entity?query=p025renamedvalue
    capture_as: search_new_name

  # AFTER state H2: search for the OLD name should no longer return it.
  - kind: rest
    method: GET
    path: /api/search/data_entity?query=p025originalname
    capture_as: search_old_name

  # Direct DB read of the search vector for the entity — ground truth.
  - kind: sql
    query: |
      SELECT tag_vector::text AS tag_vector_text
      FROM search_entrypoint
      WHERE data_entity_id = 2510
    capture_as: tag_vector_after_rename

assert:
  - "rename_response.status == 200"
  - "renamed_tag_name == 'p025renamedvalue'"

  # H1 — the new name propagated into the carrying entity's search vector.
  - "'p025renamedvalu' in tag_vector_after_rename.tag_vector_text  # ts lexeme stem"

  # H2 — the old token was OVERWRITTEN, not appended. If this FAILS, the
  # FTS upsert appends and tag renames leave stale searchable tokens.
  - "'p025originalnam' not in tag_vector_after_rename.tag_vector_text  # ts lexeme stem"

cleanup:
  - kind: sql
    query: |
      DELETE FROM tag_to_data_entity WHERE tag_id = 2510
  - kind: sql
    query: |
      DELETE FROM search_entrypoint WHERE data_entity_id = 2510
  - kind: sql
    query: |
      DELETE FROM tag WHERE id = 2510
  - kind: sql
    query: |
      DELETE FROM data_entity WHERE id = 2510
  - kind: sql
    query: |
      DELETE FROM data_source WHERE id = 2510
  - kind: docker-compose-down
    destroy_volumes: true

