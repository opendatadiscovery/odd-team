notes: |-
  New invariant captured in batch 2026-05-19J. The zero-UI-test-coverage state is
  the single biggest test-coverage gap on the platform. The harness exists; the
  bar is procedural. A maintainer prioritising test coverage should bootstrap
  with the LSN-017 + F-004 regression-pins (highest-leverage; both already
  empirically pinned by system probes) and grow outward.

  The 5 batch-J sidecars each surface 5-10 uncovered behaviours suitable for
  unit-test bootstrapping. Combined: ~40 distinct testable assertions across the
  5 components. A focused 2-3 day effort by one engineer would close the
  highest-value subset.

  ## batch ZH update
  Batch ZH brings the count to 10 contributing sidecars with the routes/
  directory added. Net new bootstrap targets: ~30 route-module
  regression-pin assertions (lowest cost-leverage in the codebase —
  single-line builders with trivial outputs). The 1-day focused effort
  closes the directory-wide gap if combined with the LSN-017 + F-004
  bootstrap.
