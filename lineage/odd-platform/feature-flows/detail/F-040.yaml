  description: |-
    Returns DataEntityRunList payload (items[]{startTime, endTime, status,
    statusReason, dataEntityId} + pageInfo{total, hasNext}) — paginated
    timeline of test runs for the named DQ test or Data Transformer.
    READ-ONLY path; NO db-write, NO activity-emit, NO external-call.
  evidence: |-
    DataEntityRunController.java:24-26 (.map(ResponseEntity::ok)) +
    DataEntityRunServiceImpl.java:32-44 (the read path with no write
    side-effect) + ReactiveDataEntityTaskRunRepositoryImpl.java:160-191
    (the paginated SELECT with no UPDATE/INSERT).
  cardinality_per_call: |-
    1 paginated response per GET — items[] cardinality bounded by the
    `size` query parameter (unbounded — see drift facet); pageInfo.total
    bounded by the test's full run history. 2 DB round-trips per request
    (data SELECT + COUNT subquery). 0 db-write, 0 activity emit, 0
    external-call.
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC-INFERRED HIGH for the steady-state user-action multiplicity. Per-mount
  the chain is hop-0a (TestRunsHistory mount = 1 dispatch) × hop-1 (controller
  = 1 method invocation) × hop-2 (service = 1 read) × hop-3 (repository = 2 DB
  round-trips counted as ONE logical read since they are the same response) ×
  hop-4 (mapper = 1) = 1 user-observable response. Infinite-scroll is N
  additional triggers (one per scroll-load), each yielding 1 additional
  response. The hot-path observation lives at the SIZE PARAMETER (unbounded
  → an attacker can pump size=1000000 in a single trigger) and at the
  COUNT SUBQUERY (2 DB queries per request, no cache). The hop-by-hop
  product is 1 — there is no LSN-017-class double-fetch pattern at the
  React layer; the useEffect dep arrays are `[alertStatus]` (TestRunsHistory)
  and `[dataQATestId]` (TestReportDetailsHistory), both externally-driven
  values not response-derived. The 256KB max-in-memory limit applies at the
  HTTP response codec layer if the response exceeds it.
observed_vs_expected:
  facets:
  - facet: |-
      Cross-owner read posture extends to per-test runs history with status_reason
      diagnostic-text leak channel
    observed: |-
      DataEntityRunController.java:13-28 has NO @PreAuthorize. No entry in
      SecurityConstants.SECURITY_RULES for `/api/dataentities/*/runs`
      (verified by grep over lines 98-355 returning zero matches for `runs`).
      ReactiveDataEntityTaskRunRepositoryImpl.getDataEntityRuns
      (lines 161-191) filters only on `DATA_ENTITY.ID.eq(dataQualityTestId)`
      and optionally `STATUS.eq(status.name())` — no JOIN to `ownership`,
      no filter by the calling user's owners. ANY authenticated user under
      LOGIN_FORM/OAUTH2/LDAP reads ANY DQ test's run history. status_reason
      is a free-form text field set by the external test framework (Great
      Expectations / dbt / custom) and commonly contains diagnostic detail —
      failed-row samples, column names that triggered the failure, sample
      failing values. Combined with cross-owner read, this is the DISTINCT
      data-shape leak channel beyond the namespaces/owners/tags lists already
      exposed by cross-owner read elsewhere — a non-owner gets a DQ-diagnostic
      stream including possible PII from operator-supplied failed-row samples.
      NEW invocation site of the REFACTOR-024 cross-owner-read family,
      paralleling F-022's four-GET-endpoints finding at the per-dataset
      DataQualityController + F-032's catalog-wide dashboard finding.
    expected: |-
      Either (a) introduce owner-scoping on the runs endpoint (the lone
      mutation on the sibling DataQualityController is gated by DATASET_TEST_RUN_SET_SEVERITY
      via DATA_ENTITY AuthorizationManagerType — the same pattern would
      gate the runs read), OR (b) the live `features/data-quality` doc
      page disclosures the read-collaborative posture explicitly + warns
      operators that status_reason text may contain PII / sample failing
      values, depending on the test framework's emission policy.
    drift_class: cross_owner_dq_test_run_history_read_no_security_rule
    provenance: |-
      PRIMARY-SOURCE — DataEntityRunController batch-ZG sidecar
      bugs_limitations_corner_cases[5] + security.known_security_gaps[0,1].
      Evidence: SecurityConstants.java:98-355 (path absent) +
      DataEntityRunController.java:1-28 + DataEntityRunServiceImpl.java:32-44
      + ReactiveDataEntityTaskRunRepositoryImpl.java:160-191 (no OWNERSHIP
      join). Probe P-152 pins. Severity: HIGH — distinct from sibling
      cross-owner-read findings because the status_reason payload shape is
      qualitatively different (free-form text vs structured metadata).
  - facet: |-
      Wire enum vs DB enum asymmetry — runs page returns HTTP 500 during
      in-flight test runs (RUNNING status row)
    observed: |-
      DB column `data_entity_task_run.status` accepts the 7-value
      `IngestionTaskRunStatus` enum (SUCCESS|FAILED|SKIPPED|BROKEN|ABORTED|RUNNING|UNKNOWN,
      IngestionTaskRun.java:28-36) but the wire enum `DataEntityRunStatus`
      declares only 6 values (RUNNING is missing, components.yaml:1407-1415).
      The `DataEntityRunMapper` flat-maps the String `status` field to the
      wire enum via MapStruct's `Enum.valueOf()` strategy — which throws
      `IllegalArgumentException` on unknown literals. Hypothesis: the
      runs-history endpoint returns HTTP 500 for any result set containing
      a RUNNING row — making the page UNAVAILABLE exactly while a test is
      in flight (the moment the operator most wants to see the page).
      No integration test asserts whether the operator sees 500 or some
      softer fallback.
    expected: |-
      Either (a) add `RUNNING` to the wire enum (`components.yaml:1407-1415`),
      OR (b) the mapper handles unknown statuses by mapping to UNKNOWN (a
      MapStruct `@ValueMapping(source=MappingConstants.ANY_UNMAPPED,
      target="UNKNOWN")`), OR (c) the service filters out RUNNING rows
      before the mapper runs.
    drift_class: wire_enum_db_enum_asymmetry_running_status_500_during_in_flight_runs
    provenance: |-
      PRIMARY-SOURCE — DataEntityRunController batch-ZG sidecar
      bugs_limitations_corner_cases[1]. Evidence: IngestionTaskRun.java:28-36
      (DB-side 7-value enum) + components.yaml:1407-1415 (wire-side 6-value
      enum) + DataEntityRunMapper.java:13-14 + MapperConfig.java:7-13
      (MapStruct strategy). Probe P-151 pins. Severity: HIGH.
  - facet: |-
      NULL end_time ordering — RUNNING rows appear undated at the top of
      the list
    observed: |-
      ReactiveDataEntityTaskRunRepositoryImpl.java:178 emits
      `ORDER BY end_time DESC` with no `NULLS FIRST/LAST` directive
      (JooqQueryHelper.java:74-89). Postgres default for DESC is NULLS
      FIRST → RUNNING rows (end_time=NULL) appear at the TOP of the runs
      list. The UI labels each row by `startTime` (TestRunItem.tsx:30)
      with an empty Duration column when endTime is null (TestRunItem.tsx:53-57);
      operator sees an undated-looking row first, with no visual signal
      that it represents an in-flight test. Combined with the wire-enum-asymmetry
      bug above: even WITHOUT the 500 (if/when the mapper is fixed), the
      operator sees an in-flight run as an unlabelled row at the top of
      the timeline.
    expected: |-
      Either (a) explicit `NULLS LAST` directive on the ORDER BY, OR (b)
      the UI renders an explicit "RUNNING (in flight)" badge on rows
      with endTime=null + isolates the in-flight row visually from
      completed runs.
    drift_class: nulls_first_ordering_running_rows_appear_undated_at_top
    provenance: |-
      PRIMARY-SOURCE — DataEntityRunController batch-ZG sidecar
      bugs_limitations_corner_cases[2]. Evidence:
      ReactiveDataEntityTaskRunRepositoryImpl.java:176-182 +
      JooqQueryHelper.java:55-90 (no NULLS-FIRST/LAST directive) +
      TestRunItem.tsx:25-60. Probe P-150 pins. Severity: MEDIUM.
  - facet: |-
      No tie-breaker on identical end_time — infinite-scroll page boundary
      may duplicate or skip rows
    observed: |-
      ReactiveDataEntityTaskRunRepositoryImpl.java:178 — single-field
      ORDER BY with no secondary sort key. When two completed runs share
      end_time (e.g. a rapid-fire test batch that completed in the same
      second), the inter-tie order is Postgres physical-storage-defined
      (heap order, non-deterministic across vacuum/reindex events). The
      InfiniteScroll consumer (TestRunsHistory.tsx:90-113) accumulates
      successive pages via independent SQL invocations; if a tie splits
      across the page boundary differently on each fetch (page 1 returns
      A,B with B at position 5; page 2 returns B,A with A at position 0),
      the operator sees duplicated or skipped rows in the rendered list.
    expected: |-
      Either (a) add a deterministic tie-breaker on the ORDER BY (e.g.
      `ORDER BY end_time DESC, id DESC`), OR (b) the docs warn that
      page boundaries on tied end_times may visibly churn.
    drift_class: no_tie_breaker_on_identical_end_time_infinite_scroll_dup_or_skip
    provenance: |-
      PRIMARY-SOURCE — DataEntityRunController batch-ZG sidecar
      bugs_limitations_corner_cases[3]. Evidence:
      ReactiveDataEntityTaskRunRepositoryImpl.java:176-182 +
      TestRunsHistory.tsx:88-113. Probe P-150 pins (combined with NULLS
      ordering). Severity: LOW (low-probability ordering churn).
  - facet: |-
      UI sort key (start_time) ≠ backend sort key (end_time) — long-running
      tests appear out of operator-expected order
    observed: |-
      The operator looking at the runs list sees `startTime` rendered in
      the leftmost column (TestRunsHistory.tsx:75-77 + TestRunItem.tsx:30)
      and naturally expects ordering by that column. Backend orders by
      end_time. For typical completed runs the two are correlated
      (end ~ start + duration); for long-running tests the divergence is
      operator-visible — a slow run STARTED YESTERDAY but ENDED TODAY may
      appear ABOVE a fast run STARTED + ENDED EARLIER TODAY in the
      end_time-ordered list. The operator sees this as a sorting bug.
    expected: |-
      Either (a) align backend ORDER BY with the UI's display column
      (`ORDER BY start_time DESC`), OR (b) the UI displays the end_time
      as the leftmost column, OR (c) the UI label clarifies "Ordered by
      most-recently-completed" + tooltip on the column header.
    drift_class: ui_sort_key_start_time_vs_backend_sort_key_end_time
    provenance: |-
      PRIMARY-SOURCE — DataEntityRunController batch-ZG sidecar
      bugs_limitations_corner_cases[4]. Evidence:
      ReactiveDataEntityTaskRunRepositoryImpl.java:178 +
      TestRunsHistory.tsx:74-87 + TestRunItem.tsx:25-32. Severity: LOW
      (visible only for long-running tests with end-time-precedes-start-time-of-faster-test
      shape).
  - facet: |-
      Page-size parameter unbounded — single-request DoS surface
    observed: |-
      OpenAPI `SizeParam` (components.yaml:4222-4229) declares int32 with
      no min/max. The controller's `Integer size` parameter is passed
      through verbatim to the SQL `LIMIT`. The UI ships size=100
      (TestRunsHistory.tsx:27) and size=10 (TestReportDetailsHistory.tsx:31).
      A deliberately-crafted curl with size=10000000 reaches the DB as-is
      → the JOOQ paginate window-function plan (`COUNT(*) OVER() +
      ROW_NUMBER() OVER(ORDER BY end_time DESC)`) is O(N) on the result
      set; one request can materialise 10M rows through JOOQ + MapStruct +
      Jackson serialisation. No bounds-check anywhere in the chain.
