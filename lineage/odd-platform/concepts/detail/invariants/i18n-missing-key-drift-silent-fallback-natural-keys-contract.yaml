name: |-
  i18n missing-key drift — 14+ code-referenced keys absent from all six locales; natural-keys pattern + no missingKey handler ships silent fallback
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW HIGH-severity INVARIANT, batch ZJ (2026-05-26) — the SPA's
  TypeScript code references 14+ keys via `t('...')` that DO NOT
  EXIST in any of the six locale bundles (en/es/ch/fr/ua/hy).
  The natural-keys pattern + the absence of a `missingKey` event
  handler in `i18n.ts:27-31` compose into a SILENT-FALLBACK
  contract — the rendered text is the KEY STRING ITSELF (the
  English literal), with NO compile-time check, NO runtime warning,
  and NO test catching the drift.

  **Confirmed missing keys (batch ZJ — en.json verified absence
  via grep)**:

    - "Data Quality" (ToolbarTabs.tsx:46) — top-level nav label
    - "Data Modelling" (ToolbarTabs.tsx:51) — top-level nav label
    - "Master Data" (ToolbarTabs.tsx:56) — top-level nav label
    - "Query Examples" (QueryExamples.tsx:23)
    - "query examples overall" (QueryExamples.tsx:25)
    - "Add query example" (AssignEntityQueryExampleForm.tsx:47,67 + QueryExamples.tsx:42)
    - "lookup table" (LookupTableForm.tsx:77)
    - "Table name" (LookupTableForm.tsx:90)
    - "Save lookup table" (LookupTableForm.tsx:129)
    - "Add lookup table" (LookupTableForm.tsx:129)
    - "Enter business name" (InternalNameFormDialog.tsx:69)
    - "Link query" (DataEntityDetailsQueryExamples.tsx:40)
    - "tab" (QueryExampleDetailsContainer.tsx:31 + QueryExampleDetailsTabs.tsx:38)
    - "Delete query example" (QueryExampleDetailsContainerActions.tsx:68)
    - "Are you sure you want to delete this query example?" (QueryExampleDetailsContainerActions.tsx:69)

  **The natural-keys pattern HIDES the drift for English** —
  i18next's default `parseMissingKeyHandler: undefined` +
  `fallbackLng: ['en','es','ch','fr','ua','hy']` chain (from
  i18n.ts:30) walks the chain looking for the key. None of the
  six locales has the key. After exhausting the chain, i18next
  returns the KEY STRING itself. The English UI 'accidentally
  works' because the key IS the English text (the natural-keys
  pattern).

  **The non-English locales DO NOT 'accidentally work'** — a
  French user navigating to Data Quality sees 'Data Quality' in
  English on their UI. A Chinese user sees 'Data Quality' in
  English on theirs. The drift is uniform across all five non-
  English locales (verified: the missing keys are absent across
  all six locale files). Every non-English-locale user sees the
  English literal on the same set of UI surfaces.

  **The root cause is the EMPTY missingKey wiring** —
  i18n.ts:27-31 calls `i18n.use(initReactI18next).init({
  resources, lng, fallbackLng })` with NO `missingKeyHandler`,
  NO `parseMissingKeyHandler`, NO `saveMissing` — the i18next
  default is silent fallback. Combined with the natural-keys
  pattern, the contract 'every t() call site has a matching
  en.json key' is enforced by NOTHING.

  **The fix is multi-shape**:

    (a) **Mechanical fix** — enumerate the 14+ missing keys, add
        each entry to en.json with the English value, then
        propagate to the other five locales (with localised
        translation or with the same English source value as a
        starting point).

    (b) **Tooling fix** — wire a `missingKey` event handler in
        i18n.ts that logs to console in development mode
        (catches at PR-review time) and emits a metric in
        production. ~5 lines.

    (c) **CI step** — add a `npm run check-i18n` script that
        greps `t\\(['\\"]([^'\\"]+)['\\"]\\)` across
        `odd-platform-ui/src/` and asserts presence in en.json.
        Runs at every PR build.

  **The 14+ missing keys list is NOT exhaustive** — the audit
  walked specific call sites in ToolbarTabs.tsx, QueryExamples.tsx,
  LookupTableForm.tsx, InternalNameFormDialog.tsx, the QueryExample
  details subtree, and AssignEntityQueryExampleForm.tsx. A
  full-corpus scan of the SPA's 241 `t()` call sites would
  enumerate the complete set. Probe P-170 emitted (batch ZJ)
  to verify the runtime drift via DOM observation across all
  six locales.

  **Cross-batch coherence (LSN-019/020 class)**: this invariant
  is a structural member of the LSN-019/020 family — the
  contract between code and resource is brittle and silent. The
  missing-key drift is invisible until a non-English-locale user
  encounters a freshly-added key for the first time, or a
  compliance reviewer cross-checks doc copy against UI rendering.
