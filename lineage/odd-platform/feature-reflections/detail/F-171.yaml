- id: H-006
  hypothesis: "When an operator approves one request, only that one request changes state — other pending requests for the same Owner are left untouched for separate review."
  derivation: "Negative-space + response-shape — the row-level Accept affordance promises a row-scoped effect; available-but-unsurfaced side-effect in the service chain."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Approving a request is NOT row-scoped. After the mapping is created,
      updateOwnerAssociationRequest calls
      cancelCollisionAssociationByIdForApprovedRequest
      (OwnerAssociationRequestServiceImpl.java:102, 192-203), which — for APPROVED
      status only — calls repository.cancelCollisionAssociationById(pojo) and marks
      every colliding open request DECLINED, each stamped REQUEST_MANUALLY_DECLINED
      in the activity log (:199-201). So approving Alice's request for Owner-X
      silently auto-declines every OTHER pending request for Owner-X. Neither the
      Accept dialog (NewAssociationRequest.tsx:73-77), nor the UI, nor the live doc
      (WebFetch 2026-06-03: "what happens to other pending requests when one is
      approved" — NOT MENTIONED) discloses this.
    evidence:
      - sidecar: OwnerAssociationRequestServiceImpl.java
        section: cancelCollisionAssociationByIdForApprovedRequest
        cite: "OwnerAssociationRequestServiceImpl.java:102, 192-203"
        note: "On APPROVE, all colliding requests are bulk-DECLINED with REQUEST_MANUALLY_DECLINED."
        source_read_for_validation: true
      - sidecar: NewAssociationRequest.tsx
        section: Accept ConfirmationDialog
        cite: "NewAssociationRequest.tsx:73-77"
        note: "Dialog text names only the single user/owner — no cascade disclosure."
        source_read_for_validation: true
      - sidecar: WebFetch user-owner-association
        section: "what happens to other pending requests"
        cite: "WebFetch 2026-06-03 status 200 — NOT MENTIONED"
        note: "Live doc is silent on the cascade-decline."
    operator_visible_failure: |
      An operator triaging a busy Owner sees N pending requesters and intends to
      approve them one at a time. Approving the FIRST silently DECLINES the other
      N-1 — they vanish from New-requests and reappear in History as
      MANUALLY_DECLINED, attributed to the approving operator who never decided to
      decline them. Two harms: (1) legitimate requesters are silently rejected and
      must re-request (and may never notice); (2) the audit trail shows the operator
      "manually declined" requests they never saw or acted on, corrupting forensic
      reconstruction of who-decided-what. The cascade is by design where one Owner
      maps to one user, but the UI presents per-row Accept as if each is independent.
      This is net_new (PLT-038 covers only the irreversibility/undo text, not the
      cascade semantics).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: "When an operator approves a request whose target Owner was deleted after the request was filed, the system refuses to bind the user to a non-existent Owner (a not-found / validation error), rather than creating a binding to a dead Owner."
  derivation: "Negative-space + cross-pillar (F-019 Owner lifecycle) — the request FK to owner() has no ON DELETE clause; controller sidecar bug [1]."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The approve path has NO soft-deleted-Owner guard. updateOwnerAssociationRequest
      -> createMappingForApprovedRequest (OwnerAssociationRequestServiceImpl.java:184-190)
      calls userOwnerMappingService.createRelation(username, provider, ownerId)
      directly off the request pojo's ownerId, with no cross-check of
      owner.deleted_at. Owner soft-delete (OwnerServiceImpl cascade at :88-100)
      does NOT include owner_association_request as a leg, and the FK
      (V0_0_51__add_owner_association_request.sql:11) has no ON DELETE clause, so the
      orphan request survives, remains listed (getOwnerAssociationRequestList has no
      deleted-Owner filter), and is approvable onto the dead Owner.
    evidence:
      - sidecar: OwnerAssociationRequestServiceImpl.java
        section: createMappingForApprovedRequest
        cite: "OwnerAssociationRequestServiceImpl.java:184-190"
        note: "createRelation off pojo.getOwnerId() with no deleted_at cross-check."
        source_read_for_validation: true
      - sidecar: OwnerAssociationRequestController (controller sidecar)
        section: bugs_limitations_corner_cases[1]
        cite: "OwnerAssociationRequestController sidecar bug [1] (REFACTOR-427) + F-019 line 721-737"
        note: "Owner delete cascade omits the owner_association_request leg; approve creates a mapping to a soft-deleted Owner."
    operator_visible_failure: |
      An operator approves a stale request and binds a user to an Owner that no
      longer exists in the directory. The user_owner_mapping points at a soft-deleted
      Owner; downstream owner-scoped reads (My Objects, owner-filtered alerts) behave
      undefinedly — typically returning empty for that binding. The operator gets no
      error and no signal the Owner is dead. Already tracked as PLT-132 (orphan
      owner_association_request rows survive Owner delete and can be approved onto a
      dead Owner) — convergent with this hypothesis.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

