notes: |-
  This is a generic UI pattern (URL as application state) instantiated on the
  DQ Dashboard's filter panel. A future Lineage refactor or other multi-filter
  page might reuse the same pattern — if so, this concept can be strengthened
  rather than re-minted. Existing siblings include the
  `url-as-source-of-truth-for-lineage-view-state` invariant (lineage-specific,
  different mechanism — URL as the primary lineage view-state container vs.
  this entry's URL-as-side-channel for jotai atom values).
