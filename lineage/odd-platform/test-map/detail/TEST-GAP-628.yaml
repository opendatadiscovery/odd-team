proposed_action: |-
  Add `OwnerSoftDeleteVisibilityAsymmetryTest` with three test methods: (a) seed Owner with id O and roles; DELETE /api/owners/{O}; GET /api/owners; assert O is NOT in the response list (pins list-filtered behaviour); (b) GET /api/owners/{O}; assert the response DTO IS returned with the original name + roles (pins by-id unfiltered behaviour); (c) repeat (b) after explicit re-creation of a new owner with the same name; assert the by-id query against the SOFT-DELETED owner's old id still returns the soft-deleted DTO (not the new owner). All pin the current asymmetry. Future fix that filters deleted_at in getDto query will break tests (b) and (c). Pair with TEST-GAP-702 (NEW batch S service-tier pin) for the full controller-vs-service test pair.
