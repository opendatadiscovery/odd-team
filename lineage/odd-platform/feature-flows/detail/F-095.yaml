terminal_side_effect:
  side_effect_class: db-write
  description: |-
    `dataset_field.stats` JSONB column overwritten with attacker-controlled
    payload for any field whose ODDRN is known. Simultaneously, FTS vector
    recompute fires on the lying parent `datasetOddrn`. Downstream effects:
    Dataset Structure tab renders attacker-controlled values for
    `nulls_count`, `low_value`, `mean_value`; Quality Dashboard rings
    (F-022, F-032) consume the polluted stats; BI tools reading
    `dataset_field.stats` (per cross-pillar consumer mapping) receive
    poisoned values.
  evidence: |-
    odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/DatasetFieldServiceImpl.java:172-181
    + DatasetFieldServiceImpl.java:233-251 (the JSONB.jsonb(...) write at
    field.setStats + bulkUpdate(fieldsToUpdate)).

observed_vs_expected:
  facets:
    - facet: payload-driven field scoping with no parent-child consistency check
      observed: |-
        The supplied `DataSetStatistics.datasetOddrn` is used ONLY as the
        FTS-vector recalc target; the actual dataset_field rows updated
        come from `statistics.keySet()` (which is `Map<field_oddrn, stat>`).
        Submitting `{datasetOddrn: A, fields: {<oddrn-of-field-in-dataset-B>: stat}}`
        writes the stat to dataset B's field while recalcing FTS on A.
        getLastVersionDatasetFieldsByOddrns(statistics.keySet()) performs
        NO JOIN to dataset_oddrn to enforce parent-child consistency.
      expected: |-
        Either (a) assert the resolved field's dataset_id matches the
        payload's `datasetOddrn`-resolved dataset_id; on mismatch throw
        BadUserRequestException("Field does not belong to declared dataset"),
        OR (b) accept the payload's `datasetOddrn` as the ONLY identity and
        look up child fields by parent-id (constrains the write to the
        payload's named dataset).
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/DatasetFieldServiceImpl.java:158-181"
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/DatasetFieldServiceImpl.java:172-181 (getLastVersionDatasetFieldsByOddrns)"
      drift_class: payload_driven_field_scoping_no_parent_validation
      provenance: STATIC — SHB-125 evidence; mechanism verified.
    - facet: unauthenticated in every supported configuration
      observed: |-
        The /ingestion/entities/datasets/stats endpoint is in
        SecurityConstants.WHITELIST_PATHS via `/ingestion/**` and is NOT
        matched by IngestionDataEntitiesFilter's exact-literal path matcher
        (POST /ingestion/entities — F-094 facet). The endpoint is reachable
        anonymously under bundled defaults AND under every supported
        `auth.type` (DISABLED / LOGIN_FORM / OAUTH2 / LDAP).
      expected: |-
        Either (a) gate the endpoint under `auth.ingestion.filter.enabled`
        by broadening the path matcher (see F-094), OR (b) ship a separate
        `auth.ingestion.stats.filter.enabled` property, OR (c) require an
        authenticated caller with TAG_CREATE or a new DATASET_STATS_WRITE
        permission.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/auth/filter/IngestionDataEntitiesFilter.java:28"
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/utils/SecurityConstants.java:95-96"
        - "https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security — verbatim: 'All other /ingestion/* paths (e.g. /ingestion/alert/alertmanager, /ingestion/entities/degs/children, /ingestion/entities/datasets/stats) ... remain outside the ingestion filter's coverage.'"
      drift_class: unauthenticated_under_every_supported_configuration
      provenance: STATIC — SHB-125 evidence; cross-link to F-094.
    - facet: FTS recalc on lying parent enables cheap DoS
      observed: |-
        Because `datasetOddrn` parent feeds the FTS recalc but is uncoupled
        from actual write targets, an attacker can name a heavy dataset
        as the parent (triggering an FTS recalc on it) while writing
        nothing or trivial stats to a small unrelated field. Repeated
        invocations cause Postgres CPU load on the named dataset's FTS
        recompute.
      expected: |-
        Validate parent-child consistency BEFORE issuing the FTS recompute
        OR rate-limit FTS-vector recomputes per dataset_oddrn.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/DatasetFieldServiceImpl.java:168-170,179"
      drift_class: fts_recompute_on_lying_parent_dos_amplifier
      provenance: STATIC — SHB-125 mechanism inference; severity MEDIUM.
    - facet: replay-with-fewer-tags silently destroys EXTERNAL_STATISTICS-origin tags
      observed: |-
        A re-POST of the stats payload with fewer tags causes
        `reactiveTagRepository.deleteDatasetFieldRelations(...,EXTERNAL_STATISTICS)`
        to remove the absent EXTERNAL_STATISTICS-origin tags from the
        affected fields. Combined with the unauthenticated mint surface
        (see F-094's matrix + SHB-126 tag-creation side-channel), this is
        F-008's `silent_destruction_replace_not_merge` class applied to
        per-field tags.
      expected: |-
        Merge semantics OR an explicit "destructive stats ingestion" mode
        flag with audit logging.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/DatasetFieldServiceImpl.java:218-223"
      drift_class: silent_destruction_replace_not_merge
      provenance: STATIC — SHB-125 + SHB-126 cross-link; mirrors F-008's class.

