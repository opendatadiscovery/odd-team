notes: |-
  Promoted to a first-class operation in batch VAL-LSN-019-B to name the
  actual write pipeline. The earlier sidecars listed "create-activity-event"
  in passing but didn't capture the four-step pipeline OR the fact that
  emit-failure rollback is a deliberate semantic (audit-or-fail).

  Cross-cutting connections:
    - Pairs with `read-activity-feed-windowed-filtered-type-dispatched`
      (the existing read-side operation) — together they describe the
      full HTTP surface of the Activity feature
    - Pairs with `activity-handler-state-differ` (new entity) — names
      the dispatch core of step 1 and step 3
    - Pairs with new invariant
      `activity-write-tx-coupled-emit-failure-rolls-back-business-mutation`
      — the operator-surprising TX semantic
    - Pairs with new invariant
      `activity-handler-concurrent-oldstate-capture-race` — the
      handler-tier race that produces wrong diff attribution under
      concurrent mutations

  Two DOC-NNN candidates flow from this operation:
    (a) Document the write-pipeline shape on the activity-feed feature
        page — operators understanding "what gets recorded when I
        change X" need to know the snapshot-diff timing AND the
        @ReactiveTransactional emit-or-fail semantic
    (b) Document the system-event mechanism (null created_by, scheduler
        + ingestion + DISABLED-mode paths) — operators querying the
        feed and seeing rows with NULL actor need to know what that
        means
