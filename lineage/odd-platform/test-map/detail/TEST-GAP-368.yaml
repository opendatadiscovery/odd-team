behaviour: '`getTotals.zipDelayError` partial-failure semantics — line 104 uses `Mono.zipDelayError`
  rather than `Mono.zip`. A failure of one count query does not abort the others; the
  failure propagates AFTER all three complete. The user-facing result is a 500 with
  no partial counts, but the contract for partial-failure shape is unpinned. A future
  refactor to `Mono.zip` (eager-abort) would change the user-facing behaviour silently.'
