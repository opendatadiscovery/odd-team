behaviour: |-
  **SERVICE-TIER COMPOSITION TEST: prove the 3-line cascade (line 71 + lines 117-122 + lines 76-81) yields the destructive empty-roles behaviour PRIMARY-SOURCE at the enclosing-class.** TEST-GAP-622 already pins the EXTERNALLY-OBSERVABLE PUT-omits-roles surface at the controller tier; this batch S sidecar's `bugs_limitations_corner_cases[0]` confirms the hazard is composed across THREE distinct source lines in OwnerServiceImpl.java: (a) line 71 (`final List<Long> newRoles = getRoleIdsList(updateEntityForm);`) — the call site; (b) lines 117-122 (`getRoleIdsList` helper) — the null+empty collapse to `List.of()`; (c) lines 76-81 (`deleteOwnerRelationsExcept(ownerId, newRoles).then(createRelations(ownerId, newRoles))`) — the persistence-layer cascade where the empty list lands. A pure-unit test against OwnerServiceImpl (Mockito-style, no SpringBootTest, no controller-tier needed) should INVOKE `update(ownerId, OwnerFormData{name:"X"})` with no roles field set + assert that `ownerToRoleRepository.deleteOwnerRelationsExcept(ownerId, List.of())` is called THEN `createRelations(ownerId, List.of())` is called. The test pins the 3-line composition INDEPENDENTLY of the controller's request-deserialisation behaviour and INDEPENDENTLY of the JSON omission semantics. A maintainer "fixing" the destructive default at any ONE of the three lines (e.g., changing `getRoleIdsList` to throw on null OR adding a guard at line 76 OR adding @Valid on the form) would require this test to be rewritten — making the change deliberate. Distinct from TEST-GAP-622 which is the API-surface regression-pin; this is the service-tier ALGORITHM-pin.
