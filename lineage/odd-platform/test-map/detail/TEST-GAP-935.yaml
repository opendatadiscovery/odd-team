behaviour: |-
  **GET /api/roles has NO SECURITY_RULES entry — any authenticated caller hits
  the endpoint AND the response content silently forks by caller role: ADMIN
  gets full paginated catalog; non-ADMIN gets in-memory-filtered own-attached
  subset with hasNext=false IGNORING the page/size request parameters.** This
  is read-collaborative-with-content-fork — a class of contract that no
  external consumer can predict without reading RoleServiceImpl.java:40-47.
  An operator authoring a UI dashboard that paginates roles will see correct
  behaviour for ADMINs and silently broken behaviour for non-ADMINs: same
  endpoint, same parameters, different content shapes. Same pattern as the
  symmetric PolicyController.getPolicyList finding. Boundary risk: negative
  page or size values are forwarded to the service tier with no validation —
  what happens for page=-1, size=-1 is undefined.
