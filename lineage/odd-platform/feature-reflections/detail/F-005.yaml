      reliability issue for power users tracing large graphs over a long sitting.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-005-2
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: PENDING-F-005-2
