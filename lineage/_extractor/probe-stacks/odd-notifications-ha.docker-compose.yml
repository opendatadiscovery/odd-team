# Probe-stack: TWO ODD platform replicas (A + B) with notifications ENABLED, sharing one
# Postgres. Exercises ADR-0043 single-leader election + failover: the notification
# subscriber acquires a BLOCKING advisory lock (id 100) before reading the WAL, so exactly
# ONE replica leads and the other blocks; when the leader dies, the standby acquires the
# lock and takes over.
#
# Distinct names + ports + project (-p oddha) from the other stacks. Ephemeral, local-only.
# The spec controls start order (A before B → A is the deterministic leader) and kills A.
version: "3.3"

services:
  probe-database-ha:
    image: postgres:13.2-alpine
    container_name: probe-database-ha
    restart: "no"
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: odd-platform
      POSTGRES_PASSWORD: odd-platform-password
      POSTGRES_DB: odd-platform
    ports:
      - "15437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odd-platform -d odd-platform"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  probe-odd-platform-a:
    image: ghcr.io/opendatadiscovery/odd-platform:latest
    container_name: probe-odd-platform-a
    restart: "no"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://probe-database-ha:5432/odd-platform
      SPRING_DATASOURCE_USERNAME: odd-platform
      SPRING_DATASOURCE_PASSWORD: odd-platform-password
      AUTH_TYPE: DISABLED
      NOTIFICATIONS_ENABLED: "true"
    depends_on:
      probe-database-ha:
        condition: service_healthy
    ports:
      - "18085:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  probe-odd-platform-b:
    image: ghcr.io/opendatadiscovery/odd-platform:latest
    container_name: probe-odd-platform-b
    restart: "no"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://probe-database-ha:5432/odd-platform
      SPRING_DATASOURCE_USERNAME: odd-platform
      SPRING_DATASOURCE_PASSWORD: odd-platform-password
      AUTH_TYPE: DISABLED
      NOTIFICATIONS_ENABLED: "true"
    depends_on:
      probe-database-ha:
        condition: service_healthy
    ports:
      - "18086:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
