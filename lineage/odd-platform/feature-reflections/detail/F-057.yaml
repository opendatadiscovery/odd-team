# DQ test severity change — product-owner reflection

## product_owner_narrative

The Data Quality pillar (P-04) ships "as an aggregator" (`system-mission.md` P-04 one-line
capability) — the platform does not run quality checks, it surfaces results pushed by Great
Expectations / dbt / the profiler / custom adapters. Within that pillar this feature is the
one **write-and-classify** affordance an operator has over quality signal: on the Test
reports tab of any dataset, an operator opens a single test and assigns it a *severity* —
Minor, Major, or Critical (`TestReportDetailsOverview.tsx:71-95` — a "Severity" labelled
dropdown; `DataQualityTestSeverity.java:26-30` — the three-value enum). F-022 owns the
READ surface of DQ on the same dataset (the Test reports tab + the BI-embeddable SLA badge);
this feature owns the classification lifecycle that drives what that badge shows.

A user reaches it from the dataset detail page → Test reports tab → a specific test's
Overview panel. The only input is the severity value; the only persisted output is one row
in `DATA_QUALITY_TEST_SEVERITY` keyed on `(DATA_QUALITY_TEST_ID, DATASET_ID)`
(`ReactiveDataQualityRepositoryImpl.java:86-102`). There is no other field — no note, no
reason, no effective-date. The control is gated by the `DATASET_TEST_RUN_SET_SEVERITY`
permission both in the UI (`WithPermissions … disabled={!isAllowedTo}`,
`TestReportDetailsOverview.tsx:78-94`) and at the route
(`SecurityConstants.java:243-246`, `DATA_ENTITY`-scoped on
`PUT /api/datasets/{data_entity_id}/dataqatests/{dataqa_test_id}/severity`).

The working part that makes this feature matter is not the write — it is the *blast radius*
of the write. Severity is the weight a test carries in the dataset's SLA colour. The
`SLACalculator` buckets every test whose latest run is SUCCESS or FAILED into minors /
majors / criticals and applies threshold rules: any failing Critical → RED; all Majors
failing → RED; some Majors failing → YELLOW (`SLACalculator.java:80-100`). So moving one
failing test from Major to Critical can flip the dataset from YELLOW to RED with no test
result changing at all — the live doc states this verbatim
(WebFetch sla-statuses, 2026-06-03). That colour is read at `/api/datasets/{id}/sla`
as a PNG embeddable in Confluence / Notion / Looker tiles (F-022 / SHB-043) — i.e. the
consequence of a single in-app click is visible to people who never open the platform.

The integration story is three-way. Upstream, the severity buckets are filled by
ingestion-pushed test runs (P-10 → P-04). Sideways, the colour feeds the BI read surface
(F-022) and SHOULD — but does not — feed the Activity Feed (F-021) the way every other
entity-side mutation does (the audit-log-presence-asymmetry pattern shared by F-006 RBAC,
F-019 owner-lifecycle). Downstream, were the event to exist, F-009's WAL notification
fan-out could carry it to Slack / webhook subscribers. The cross-pillar promise P-04 → P-07
("severity changes SHOULD feed Activity Feed") is the load-bearing gap of this feature.

The edge cases a product owner would flag in a demo: the severity dropdown writes on every
change with no Save button and no confirmation (`TestReportDetailsOverview.tsx:81-92`), so the
RED-flipping action is a single mis-click; a test with no severity row is silently counted as
MAJOR (`ReactiveDataQualityRepositoryImpl.java:144-146` + the UI default
`TestReportDetailsOverview.tsx:84`), and there is no "unset" path back to unspecified once
you have picked a value; and the severity write succeeds against soft-deleted datasets and
soft-deleted tests because the only guard is `existsIncludingSoftDeleted`
(`DataQualityServiceImpl.java:67-68`). The compliance question this whole feature fails to
answer — "who set this test to Critical, and when" — has no surface anywhere: not in an
event, not on the row, not on the screen.

## hypotheses

- id: H-001
  hypothesis: |-
    When a user with DATASET_TEST_RUN_SET_SEVERITY changes a test's severity to Critical, a
    compliance reviewer can later answer "who set this test to Critical, and when" from the
    platform (an Activity Feed event, or a last_modified_by / changed_at on the record, or
    an actor/timestamp shown on the screen).
  derivation: |-
    Pillar P-04 + the audit-log-presence-asymmetry concept: a permission-gated state mutation
    on an owned entity is the textbook shape that the Activity Feed records for every other
    surface; a compliance audience expects attribution on a classification that drives SLA.
  seed_source: negative-space + pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      No attribution exists at any layer. The service method has @ReactiveTransactional and
      NO @ActivityLog / ActivityEvent.builder() (grep on DataQualityServiceImpl returns zero
      Activity references; the method body 62-81 calls only the existence guard + the upsert
      + getDimensions + mapper). The repository upsert sets only SEVERITY — no last_modified_by,
      no updated_at, no version column (87-102). The UI shows the severity dropdown but no
      "set by / set at" line (TestReportDetailsOverview.tsx — the LabeledInfoItem block carries
      Severity, Last execution date/duration/status, Parameters, Links; nothing about who
      changed severity). The live doc now states this verbatim: "does not emit an Activity
      Feed event, does not stamp last_modified_by on the row, and does not version the prior
      severity."
    evidence:
      - sidecar: '(absent — source read for validation)'
        section: service
        cite: 'DataQualityServiceImpl.java:62-81'
        note: '@ReactiveTransactional; no ActivityEvent emission; grep ActivityLog|ActivityEvent => 0 hits'
        source_read_for_validation: true
      - sidecar: '(absent — source read for validation)'
        section: repository
        cite: 'ReactiveDataQualityRepositoryImpl.java:86-102'
        note: 'onDuplicateKeyUpdate sets SEVERITY only; no last_modified_by / updated_at / version'
        source_read_for_validation: true
      - sidecar: '(absent — UI read for validation)'
        section: ui
        cite: 'TestReportDetailsOverview.tsx:71-130'
        note: 'no actor/timestamp surfaced for severity; only run date/status shown'
        source_read_for_validation: true
      - sidecar: '(doc cross-ref)'
        section: docs
        cite: 'WebFetch sla-statuses 2026-06-03'
        note: 'doc documents the no-event / no-last_modified_by / no-version behaviour verbatim'
    operator_visible_failure: |-
      Obvious failure: a compliance / governance reviewer auditing "who escalated this test to
      Critical on May 14, and why the dataset went RED" cannot answer it from the platform UI or
      API — there is no event, no stamped actor, no history; the only recourse is raw DB
      inspection (and even that yields only the current value, not who wrote it). Subtle failure:
      an operator triaging a dashboard that flipped RED cannot distinguish (a) a test result
      changed from (b) someone reclassified a test's severity — the two are indistinguishable
      from every readable surface, so incident triage starts from a false premise. Compounding:
