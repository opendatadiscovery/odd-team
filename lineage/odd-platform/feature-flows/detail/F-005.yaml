  evidence: 'DataEntityController.getDataEntityDownstreamLineage → LineageServiceImpl.getLineage → ReactiveLineageRepositoryImpl.getLineageRelations(Set,
    LineageDepth, LineageStreamKind) at lines 122-131 — issues `DSL.withRecursive(lineageCte(...)).selectDistinct(parent,
    child).from(cte)`. The CTE body at lines 150-176 is the canonical recursive walk: seed selects edges touching the root
    oddrn set at depth=1; recursive step joins the CTE to lineage on the direction-appropriate field, increments depth, terminates
    when `tDepth.lessThan(lineageDepth.getDepth())` is FALSE (line 174). NO `LIMIT`, NO Postgres `WITH ... CYCLE` clause,
    NO visited-set guard, NO owner JOIN.'
  cardinality_per_call: 1
amplification_factor: 1
