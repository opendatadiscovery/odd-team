behaviour: Nonexistent policy id in `policies[]` — `RoleServiceImpl.create` passes
  the raw id list to `roleToPolicyRepository.createRelations` without validation;
  the JOIN row INSERT raises a Postgres FK error surfacing as a 500. If the FK references
  the live table without `deleted_at` filtering, soft-deleted policies could still
  satisfy the FK and produce a Role bound to invisible Policies. No pre-check, no
  validation error message, no doc warning.
