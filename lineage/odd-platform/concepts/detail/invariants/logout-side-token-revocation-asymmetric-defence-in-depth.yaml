notes: |-
  The five logout handlers split into a 2+3 cluster — Google and GitHub
  ACTIVELY revoke; Cognito, Azure, ODD_IAM rely on session invalidation
  + natural TTL. The split is partially protocol-driven (Azure v2.0 has
  no RFC 7009 endpoint; ODD_IAM is OIDC-end-session-only) and partially
  implementation-choice (Cognito DOES expose /oauth2/revoke, but the ODD
  Cognito handler doesn't call it). The shared invariant across ALL FIVE
  is local WebSession invalidation (`WebSession::invalidate`) — a
  symmetric platform-side guarantee.

  Cross-link to F-010 (Housekeeping TTL Enforcement): AzureLogoutSuccessHandler
  sidecar coherence_check section confirms F-010 is correct that
  search_facets rows are NOT cleaned at logout — the search_facets table
  has NO user binding column (`V0_0_1__init.sql:204-211`), so logout-time
  cleanup is structurally impossible; the SearchFacetsHousekeepingJob TTL
  eviction is the sole reaper. F-010's TTL-eviction enumeration is
  validated empirically by this sidecar's primary-source Read.

  Cross-link to F-011 (Principal-to-Owner Resolution): the WebSession
  invalidation IS the termination of the principal lifecycle. After logout,
  the WebSession is empty by design, and F-011's
  `empty_security_context_silent_propagation` drift facet is the post-logout
  state observable on any non-logout endpoint — the silent-empty-result
  fallback IS the post-logout state (correctly safe; no contradiction).
