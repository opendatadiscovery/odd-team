notes_for_maintainer: |-
  SME consultation strongly recommended (set above). The pillar mapping
  itself is unambiguous (P-08 operator infrastructure — cross-cutting),
  but the *intent* — is this drift to fix, or contract to document — is
  a domain question for the data-platform architect.

  Probe-needed (local-only): manually delete a Collector via UI, then
  re-create with the same name. Confirm UniqueConstraintException. Then
  delete a Role and re-create. Confirm success. The contrast is the
  operator-observable manifestation of the inconsistency.

  Follow-up scope candidates:
  - REFACTOR-NNN: metadata_field partial unique index migrate to include
    `WHERE deleted_at IS NULL` (Tag-side fix in V0_0_64).
  - REFACTOR-NNN: collector.name migrate FULL UNIQUE → partial unique
    `WHERE deleted_at IS NULL`.
  - REFACTOR-NNN: ownership consider adding `deleted_at` for audit
    recovery independent of activity TTL.
  - DOC-NNN: create "Deletion Semantics" page enumerating each resource.
  - CONCEPT-MERGER: promote `three-soft-delete-mechanisms-across-the-repository-layer`
    from cross-sidecar reference to canonical concept entry with full
    per-table enumeration.

  Cluster_with [F-019, F-020, F-028, F-031, F-006] per source SHB — these
  are the lifecycle features that inherit the deletion mechanism. They
  remain independent F-NNNs; this F-123 is the cross-cutting catalog
  that names the inheritance contract.
provenance: |-
  Graduated from SHB-179 by feature-flow-builder on 2026-05-26 (parallel
