behaviour: |-
  **MEDIUM — `/search/{searchId}` route has no client-side UUID
  validation; non-UUID segments route to `<Search />` and silently dispatch
  a doomed backend call.** `App.tsx:61` declares the route as
  `<Route path={\`${searchPath()}/*\`} element={<Search />} />` — the
  wildcard accepts ANY string in the `searchId` position. React Router 6's
  wildcard semantics capture only the first segment, so
  `/search/abc-def`, `/search/anything-at-all`, and even
  `/search/anything-at-all/nested/garbage` all route to `<Search />` with
  `useSearchRouteParams().searchId === 'anything-at-all'` (or whatever the
  first segment is).

  `Search.tsx:44-48` then fires
  `dispatch(getDataEntitiesSearch({searchId: routerSearchId}))` →
  `GET /api/search/{garbage}` → backend (per batch-M SearchController
  sidecar) responds 404 because `search_facets WHERE id = {uuid}::uuid`
  returns no row. The redux thunk's `handleResponseAsyncThunk` typically
  surfaces the error as a toast OR silently — the user sees an empty
  Catalog (zero results) which is **indistinguishable from "zero matches"
  for an authentic search**.

  Operator-visible consequences:

  (a) **Mistyped URL → silent empty-results page**. A user typing
  `/search/abc` directly (e.g. from a malformed Slack link, an email
  forward, a typo) lands on a blank Catalog with no error banner. They
  may conclude the catalog is empty for their search criteria. There is
  no "session not found" message, no redirect to /search to create a new
  session, no error toast (depending on the redux thunk's error handling
  shape).

  (b) **Bot / scanner scraping**. A bot fetching `/search/*` paths
  (e.g. for SEO discovery, vulnerability scanning, link checking) hits
  the backend for every garbage segment. Each fires a JVM-side
  `GET /api/search/{garbage}` with the full ::uuid cast — a small but
  unbounded cost. The backend's `IllegalArgumentException` (UUID parse
  failure) returns 400 before any DB lookup, but the cost is per-request
  for as many segments as the bot tries.

  (c) **Search.tsx orchestrator confusion**. The `routerSearchId` truthy
  check at `Search.tsx:38, 45-47` distinguishes ONLY "URL has a UUID" vs
  "URL has no UUID". It does NOT distinguish "URL has a valid UUID" vs
  "URL has a garbage UUID". So the orchestrator branches into
  "session-restore" mode (`if (!searchId && routerSearchId) dispatch
  (getDataEntitiesSearch({searchId: routerSearchId}))`) for ANY non-empty
  segment, including garbage. The session-create branch (`createSearch`)
  never fires for malformed URLs, leaving the user stranded on a never-
  completing fetch.

  **The fix at the router declaration layer**: replace
  `searchPath() + '/*'` with `searchPath() + '/:searchId?'` (optional
  param). And the React Router 6 path pattern syntax supports regex-like
  shape constraints via a custom hook (or via a manual guard in
  Search.tsx that checks `routerSearchId.match(/^[0-9a-f]{8}-[0-9a-f]
  {4}-...$/i)` and dispatches createSearch otherwise — bouncing the
  garbage URL to a fresh session). The fix is one-component-change in
  Search.tsx.

  **Why MEDIUM not LOW**: the UX failure mode is silent ("empty results"
  vs "URL not found") and the cost of a bot-scraping load is non-zero.
  But the bug only fires for hand-typed garbage URLs, which are rare in
  practice; users navigating via UI flows always get a server-issued
  valid UUID.

  Pairs with TEST-GAP-948 (the broader HTTP-tier zero-coverage on
  SearchController) — adding a single regression test here at the UI
  tier complements the seven-endpoint HTTP test suite TEST-GAP-948
  proposes; together they pin the contract at both UI and HTTP tiers.
