proposed_action: |-
  Add `ActivityHandlerConcurrentMutationRaceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/activity/` using Testcontainers + `@SpringBootTest` + StepVerifier. The HEADLINE test method:

  1. **`concurrentOwnershipUpdatesOnSameDataEntity_pinDiffIntegrityUnderRace`** (HEADLINE):
     - Arrange: seed a `data_entity` with two existing `ownership` rows (owner X with title T1, owner Y with title T2). Two distinct authenticated users (Alice with `DATA_ENTITY_OWNERSHIP_UPDATE` permission, Bob with same).
     - Act: dispatch two CONCURRENT calls to `OwnershipServiceImpl.update`:
       - Alice's call: change owner X's title from T1 to T1'
       - Bob's call: change owner Y's title from T2 to T2'
     - Use `Mono.zipDelayError(monoAlice, monoBob).block()` to maximize the interleaved-commit window.
     - Assert: query the resulting two activity rows by event_type=OWNERSHIP_UPDATED and data_entity_id; PIN the CURRENT behaviour:
       - Alice's row: `created_by='alice'`, `old_state={ownerships: [X→T1, Y→T2]}`, `new_state=<whatever the race actually produced>`
       - Bob's row: `created_by='bob'`, `old_state={ownerships: [X→T1, Y→T2]}`, `new_state=<whatever the race actually produced>`
     - **The test asserts the CURRENT race behaviour** (likely both rows show old_state=pre AND new_state=post-A+post-B). After the test PINS the current truth, a future fix (SELECT FOR UPDATE, advisory lock, serializable isolation) becomes a coordinated, opt-in change that updates this test.

  2. **`concurrentDescriptionUpdatesOnSameDataEntity_pinDiffIntegrityUnderRace`** (variant): same shape, with `DescriptionUpdatedActivityHandler` (single-row state, no list). Probes whether the race is specific to list-shaped state or applies to scalar fields too.

  3. **`concurrentMutationOnDifferentDataEntities_noRace`** (CONTROL): assert that concurrent @ActivityLog mutations on DIFFERENT data entities produce CORRECT-attribution rows. This pins that the race is data-entity-scoped (not a global serialization issue).

  After P-019 runs and the empirical timing surfaces, update this test's assertions to match the measured truth. Cross-pair with REFACTOR-NNN to formally classify the race as an intentional design choice (audit-or-fail with relaxed concurrency semantics) OR as a bug requiring fence-introduction.
