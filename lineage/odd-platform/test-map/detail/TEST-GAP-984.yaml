behaviour: |-
  **The Quality Dashboard's "Test Results Breakdown" ring lies — it shows TEST counts (one per test) keyed on latest-run-status, NOT RUN counts as both the operation name and the live documentation promise.** This is an LSN-019-class drift instantiated on the highest-visibility surface of P-04: every operator triaging the catalog-wide dashboard reads a count expecting "run volume by status" and gets "test count by their most recent run's status".

  **The semantic drift in detail**:
  - The OpenAPI operation summary reads "Get Data Quality tests runs" (`openapi.yaml:1975-1976`).
  - The UI title chart label says "Test Results Breakdown" (`DataQualityContent.tsx:110`).
  - The live doc at `https://docs.opendatadiscovery.org/features/data-quality/dashboard` says verbatim: **"Test Results Breakdown — the count of test runs broken down by status (passed / failed / skipped)"** (WebFetched 2026-05-25, status 200).
  - The implementation joins `DATA_ENTITY_TASK_LAST_RUN` (`ReactiveDataQualityRunsRepositoryImpl.java:76, 95`), whose `task_oddrn` is `PRIMARY KEY` (`V0_0_45__last_runs_table.sql:9`) — exactly one row per test.

  **Concrete consequence**:
  - A test that ran 100 times (99 SUCCESS, 1 latest FAILED) contributes 1 to the FAILED bucket — NOT 99/1 split.
  - A test that flapped 50/50 over its history but most recently succeeded contributes 1 to SUCCESS — the dashboard cannot distinguish "stable test" from "transient flap".
  - A test that succeeded for years and just started failing shows as 1 FAILED — eclipsing the long success history.
  - An operator reading the FAILED count assumes "N tests are failing right now"; the count actually says "N tests had their most recent run fail at some point" — which COULD include tests that fail intermittently and are currently green at the last refresh.

  **Why CRITICAL**:
  - **Operational mis-decision-making**: triagers prioritise based on this count; the count's meaning disagrees with the operator's mental model formed from the label + doc.
  - **Drift-prone**: a future maintainer "fixing" the SQL to count rows from `DATA_ENTITY_TASK_RUN` would silently triple/100x the counts on the dashboard — and arguably MATCH the documented contract. There is no test pinning the current denormalised behaviour, so the bug-fix-or-bug-pin ambiguity is unresolved.
  - **Compound with TEST-GAP-986**: the denormalisation invariant (single-row-per-task) is the load-bearing assumption — a schema change reverting the denormalisation would silently flip the dashboard's meaning.
  - **LSN-019 family**: this is the canonical instantiation of "operationId name vs implementation behaviour" drift on the highest-traffic dashboard endpoint.
