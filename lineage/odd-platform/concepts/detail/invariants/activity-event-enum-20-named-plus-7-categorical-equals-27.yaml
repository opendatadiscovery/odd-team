name: ActivityEventType enum reconciled — 20 named + 7 categorical = 27 (resolves batch-R puzzle)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-11
description: |-
  **NEW INVARIANT, batch 2026-05-20T (ActivityController class sidecar)** —
  RECONCILES the previously-open batch-R puzzle about the activity event enum
  cardinality. Prior batches noted a 27-vs-20 mismatch between the
  ActivityEventTypeDto.java enum (27 values) and the live activity-feed.md page
  (named 20 event types). This batch resolves the mismatch by walking BOTH
  surfaces in the same session and confirming the reconciliation: **20 named +
  7 categorical = 27**.

  The doc page (WebFetch 2026-05-20 status 200) lists EXACTLY 20 event types in
  the global filter section, organised by 6 categories:
    - Data entity lifecycle (4): DATA_ENTITY_CREATED, DATA_ENTITY_STATUS_UPDATED,
      BUSINESS_NAME_UPDATED, DESCRIPTION_UPDATED
    - Ownership (3): OWNERSHIP_CREATED, OWNERSHIP_UPDATED, OWNERSHIP_DELETED
    - Tags and terms (2): TAG_ASSIGNMENT_UPDATED, TERM_ASSIGNMENT_UPDATED
    - Dataset fields (5): DATASET_FIELD_VALUES_UPDATED,
      DATASET_FIELD_DESCRIPTION_UPDATED, DATASET_FIELD_INTERNAL_NAME_UPDATED,
      DATASET_FIELD_TAGS_UPDATED, DATASET_FIELD_TERM_ASSIGNMENT_UPDATED
    - Data entity groups (2): CUSTOM_GROUP_CREATED, CUSTOM_GROUP_UPDATED
    - Alerts (4): OPEN_ALERT_RECEIVED, RESOLVED_ALERT_RECEIVED,
      ALERT_STATUS_UPDATED, ALERT_HALT_CONFIG_UPDATED

  PLUS a hint block stating 'few additional internal event types (entity overview
  / metadata / schema / relation updates, custom metadata create / update / delete)
  that are recorded on the entity's own Activity tab but are intentionally hidden
  from the global Activity filter.' Those additional types resolve to 7 enum values:
    - DATA_ENTITY_OVERVIEW_UPDATED
    - DATA_ENTITY_METADATA_UPDATED
    - DATA_ENTITY_SCHEMA_UPDATED
    - DATA_ENTITY_RELATION_UPDATED
    - CUSTOM_METADATA_CREATED
    - CUSTOM_METADATA_UPDATED
    - CUSTOM_METADATA_DELETED

  20 + 7 = 27, matching components.yaml:3167-3196 and ActivityEventTypeDto.java:3-31
  (verified — 27 values in each).

  **The reconciliation is technically clean but the doc framing is operator-unfriendly**:
    (a) The 7 internal types are mentioned categorically, not by name — a careful
        operator reading the page cannot enumerate them.
    (b) The controller's `event_type` query parameter accepts any of the 27 values
        per the OpenAPI spec (openapi.yaml:3259-3262 schema=ActivityEventType); there
        is NO server-side filtering that REJECTS a request for DATA_ENTITY_OVERVIEW_UPDATED
        on the GLOBAL endpoint, even though the docs imply this view is restricted
        to per-entity tabs.
    (c) The 'hidden from the global Activity filter' framing is a UI-only convention;
        the API surface is fully open. Programmatic callers can fetch the 'hidden'
        types via the global endpoint.

  **Partial drift, low severity**: an operator filtering for the 7 internal types
  via the API has no doc-side reference for their names; they must walk the OpenAPI
  spec at components.yaml directly. This is an OpenAPI-vs-user-facing-doc coverage
  gap rather than a wire-contract drift.

  **The fix is doc-side** — supplement the activity-feed.md page with a complete
  enumeration of the 27 event types (or at minimum, name the 7 internal types so
  programmatic callers have a complete reference). Cross-link to the OpenAPI spec
  for machine-readable shape.

  Severity: LOW (the wire contract is intact; programmatic callers have everything
  they need via the spec; the gap is purely doc-side and affects users walking the
  page rather than the OpenAPI spec).
