        section: invariants[1] + bugs_limitations_corner_cases[1]
        cite: "PolicyServiceImpl.java:29,62-69 vs 76,87"
        note: "Administrator name reserved on update/delete, NOT on create."
      - sidecar: '(F-006 feature-flow detail — batch N notes finding (2))'
        section: drift_class role_create_administrator_name_asymmetry_mirror
        cite: "RoleServiceImpl.java:51-61 vs 68 vs 81-84 + V0_0_64__remove_is_deleted_field.sql:88-90"
        note: "Role-create has no name check; partial unique index frees the name on soft-delete."
