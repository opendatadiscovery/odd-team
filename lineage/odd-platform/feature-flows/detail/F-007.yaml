feature_id: F-007
feature_name: AlertManager webhook ingestion — ungated cross-tenant alert creation
discovered_from_entry_point: webhook:POST /ingestion/alert/alertmanager
description: 'The platform exposes a webhook receiver at `POST /ingestion/alert/alertmanager`

  (AlertManagerController.java:21) that ingests Prometheus AlertManager-shaped

  webhook payloads and creates OPEN alerts in the ODD `alert` table. The handler

  delegates to AlertServiceImpl.handleExternalAlerts → createAlerts (the batched

  INSERT … RETURNING path on ReactiveAlertRepositoryImpl).


  The webhook receiver is path-mounted at `/ingestion/alert/alertmanager` — a path

  the IngestionDataEntitiesFilter does NOT match (the filter''s path matcher is

  `/ingestion/entities` POST only). The receiver therefore inherits ONLY the global

  WebFilterChain auth gate (which is BYPASSED under `auth.type=DISABLED`); under

  every other auth mode the gate is `.authenticated()` with no DataEntity-scope

  check.


  The webhook payload carries `labels.entity_oddrn` as an UNTRUSTED string used by

  AlertServiceImpl.handleExternalAlerts (line 178) to populate `alert.data_entity_oddrn`

  — meaning any successful POST (anonymous under DISABLED; any authenticated user

  otherwise) can attribute alerts to any data entity in the platform, including

  data entities owned by other tenants. Combined with REFACTOR-024 (the `GET /api/alerts`

  cross-owner default read), this creates a full forge-and-display cycle: a hostile

  POST can inject false-positive alerts attributed to other teams'' data entities,

  and those alerts surface on the platform-wide "All" tab that every authenticated

  user can read.


  The receiver carries a `// TODO: define OpenAPI spec based on alert provider contract`

  comment on AlertManagerController.java:20 — the endpoint is undocumented in the

  OpenAPI spec and on operator-facing pages.

  '
