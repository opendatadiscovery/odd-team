terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Recursive CTE materialises rows up to requested depth in Postgres work_mem
    before the outer selectDistinct prunes; JVM heap holds the full edge list
    via .collectList() at LineageServiceImpl.java:102. With no cycle guard
    AND no upper bound, a cyclic subgraph at ?d=10000 is materialised at
    Postgres + JVM resource costs that scale with the cyclic edge count.
    NOT a db-write (read-only query); but the resource impact is observable
    via slow query log + JVM heap pressure metrics.
  evidence: 'ReactiveLineageRepositoryImpl.java:174 (depth termination) + LineageServiceImpl.java:102 (.collectList)'
observed_vs_expected:
  facets:
    - facet_id: ui_dropdown_cap_is_not_validation_boundary
      drift_class: ui_visible_safety_boundary_does_not_validate_at_any_layer_below
      severity: HIGH
      observed: |-
        Three-layer absent-validation pattern: (1) UI dropdown shows [1..20]
        cap as the operator-visible safety boundary; (2) URL ?d= parser via
        query-string with parseNumbers:true accepts any positive integer
        unclamped; (3) controller has @Min(1) only, no @Max; (4) service hands
        the primitive int through unchanged; (5) repository consumes the value
        directly in the recursive CTE termination. The 20-cap is UI-presentation-only.
      expected: |-
        Layered defence: (a) Math.min(d, 20) at URL-parse layer for
        defence-in-depth; (b) backend @Max(20) on the OpenAPI spec for SDK
        clients; (c) hard ceiling at the service layer
        (Math.min(lineageDepth, MAX_DEPTH)); (d) Postgres statement_timeout
        for the lineage CTE specifically.
      evidence:
        - 'useQueryParams.ts:33-36'
        - 'constants.ts:97-99'
        - 'HierarchyLineage.tsx:47'
        - 'LineageGraph.md:176 bugs[1]'
        - 'ReactiveLineageRepositoryImpl.md:174,183 bugs[3]'
        - 'LineageServiceImpl.md:185 bugs[2]'
        - 'DataEntityController__getDataEntityDownstreamLineage.md:115 bugs HIGH'
      ui_unverified: false
    - facet_id: click_through_compounds_depth_monotonically
      drift_class: ui_amplification_via_url_routing_chain
      severity: MEDIUM
      observed: |-
        Per LineageGraph sidecar bugs[3] + implicit_adrs[4]: clicking a node
        title at depth N navigates to that node's Lineage tab with ?d=N —
        drilling 5 hops out from root opens a new view with depth=5. A user
        accidentally navigates to a depth=N view where N grows monotonically
        per click; no slider state intervenes. Operators casually exploring
        a graph drive deeper queries without intent.
      expected: |-
        Either (a) the click resets ?d to user's last-selected dropdown value,
        OR (b) the click preserves a CLAMPED depth value (Math.min(currentDepth, 20)),
        OR (c) document the monotonic compounding explicitly.
      evidence:
        - 'LineageGraph.md:bugs[3] + implicit_adrs[4]'
      ui_unverified: false
    - facet_id: click_through_can_amplify_depth_beyond_dropdown_cap
      drift_class: ui_amplification_via_click_through_bypasses_dropdown_cap
      severity: MEDIUM
      observed: |-
        Node.tsx:46-52 (Hierarchy-side) — `useQueryParams({...defaultLineageQuery,
        d: node.depth || 1})`. Click navigates with `d` set to the
        CLICKED NODE's depth. The dropdown advertises `[1..20]` as the
        operator-visible cap. But — Node.tsx uses `node.depth || 1`
        where `node.depth` is the d3-hierarchy-assigned depth of the
        CLICKED node within the current rendered tree. If the user
        manually edited the URL to `?d=50`, the tree rendered to
        depth 50, the user clicks a node at depth 50 → new view opens
        with `?d=50` — bypassing the dropdown cap entirely. The
        click-through SCANNER for "did anyone bypass the dropdown" has
        ONE source of truth: the URL parser at useQueryParams.ts. The
        dropdown is decorative. PRIMARY-SOURCE batch J ui-review-2026-05-26.
      expected: |-
        Click-through should clamp the propagated depth — `d: Math.min(node.depth || 1, 20)`.
      evidence:
        - 'Node.tsx:46-52 (Hierarchy-side click-through)'
        - 'constants.ts:97-99 (lineageDepth array [1..20])'
        - 'useQueryParams.ts:33-36 (URL parses any integer)'
      ui_unverified: false
    - facet_id: cyclic_diamond_amplification_no_cycle_guard
      drift_class: postgres_resource_exhaustion_via_unbounded_recursive_cte
      severity: HIGH
      observed: |-
        With no cycle guard at the repository layer (REFACTOR-202) AND no
        depth ceiling, a user requesting ?d=10000 against a cyclic lineage
        subgraph causes the CTE to materialise rows up to depth 10000 in
        Postgres work_mem before the outer selectDistinct prunes. JVM heap
        then holds the full edge list via .collectList() (LineageServiceImpl.java:102).
        Authenticated DoS surface: every authenticated user has the affordance;
        under auth.type=DISABLED the affordance is unauthenticated.
      expected: |-
        (a) Cycle detection inside the recursive CTE (track visited entity
        oddrns), OR (b) Postgres statement_timeout for lineage queries
        specifically, OR (c) per-user / per-tenant query throttling.
      evidence:
        - 'ReactiveLineageRepositoryImpl.md:177 bugs[0]'
        - 'LineageServiceImpl.java:102 (collectList)'
        - 'REFACTOR-202 (cycle-detection backlog)'
      ui_unverified: false
