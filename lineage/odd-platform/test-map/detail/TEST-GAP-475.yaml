behaviour: |-
  getCurrentUserProviderRole first-authority semantics. AuthIdentityProviderImpl.java:43-44 invokes `authorities.iterator().next().getAuthority()` after the `CollectionUtils.isNotEmpty(...)` filter. If GrantedAuthorityExtractor ever emits more than one authority (a future RBAC hierarchy refactor — e.g. (USER, READ_QUERY_EXAMPLE)), the second-and-beyond are silently ignored. If the filter is removed in a regression, an empty authorities collection at iterator().next() throws NoSuchElementException → HTTP 500. Today's GrantedAuthorityExtractor emits exactly USER or ADMIN, so the contract holds — but the assumption is implicit and untested.
