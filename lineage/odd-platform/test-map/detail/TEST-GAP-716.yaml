proposed_action: |-
  Add `DirectoryOddrnExceptionSwallowTest` extending `BaseIngestionTest` with two regression-pin methods:
  (a) `getDataSourceTypes_oddrnParserThrowsRuntimeException_sourceBucketsUnderOther_pinsSwallow`: register a datasource with an ODDRN crafted to trigger a RuntimeException from `Generator.parse()` (e.g., a deliberately malformed but PARSE-LIKE-VALID ODDRN such as `//postgresql/host/<null>` if such inputs throw RuntimeException; or use a mocking wrapper around `Generator` to throw `IllegalStateException` on a specific input). WebTestClient GET `/api/directory`; assert the response status is 200 (NOT 500); assert the source appears under the `Other` (UNKNOWN_DATASOURCE_TYPE) bucket. Pin the swallow-and-bucket fallback under exception path.
  (b) `getDirectoryDatasourceList_otherPrefix_returnsExceptionSwallowedSources`: same fixture; GET `/api/directory/datasources?prefix=other`; assert the response contains the exception-bucketed source, with `properties.oddrn` equal to the raw input string. Pin the "Other" surface as the catch-all for both format-mismatch AND exception path.
  Add `// REGRESSION-PIN — DirectoryServiceImpl.getDataSourcePrefix uses try/catch(Exception) — a deliberate failure-tolerant swallow per implicit_adrs[2]. A refactor that narrows the catch (e.g., to catch (OddrnParseException) only) would silently change behaviour on transient parser bugs. This test injects a runtime exception path to pin the current swallow. If the maintainer decides to surface parser bugs explicitly (e.g., add a log.warn + a "PARSE-ERROR" sentinel distinct from UNKNOWN_DATASOURCE_TYPE), update the assertions accordingly.` comment block.
