      - "GenAIController.md:implicit_adrs.[1]"

  - name: "Reactive Mono<ResponseEntity<...>>.map(ResponseEntity::ok) is the uniform success-response pattern"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Every controller in the catalog returns `Mono<ResponseEntity<...>>` (or `Mono<ResponseEntity<Flux<...>>>` for streaming) with terminal operator `.map(ResponseEntity::ok)` for 200 success or `.thenReturn(ResponseEntity.noContent().build())` for 204 deletes. No exception translation, no status-code branching, no try/catch — non-200/204 responses are produced exclusively by service-thrown exceptions hitting global Spring exception handlers, or by service-emitted Mono.error(...) signals."
