proposed_action: |-
  Add `OwnerUpdateStatusCodeDriftTest` with three methods: (a) seed two active owners A, B; PUT /api/owners/{B} with `{name: A.name}`; assert HTTP 400 with body containing `errorCode: USR003` (pins current USR003 path), document expected 409; (b) PUT /api/owners/{id} happy path; assert HTTP 200 (pins implementation), document expected 201 per OpenAPI spec; (c) rename to a name held by SOFT-DELETED owner; assert HTTP 200 (the partial-unique-index allows this — pins the recovery-path correctness).
