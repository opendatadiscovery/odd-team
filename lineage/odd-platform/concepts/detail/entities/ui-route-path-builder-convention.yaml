notes: |-
  Coherence (Rule 6): no existing concept describes the path-builder
  convention as a first-class entity. Several invariants reference
  individual path builders (dataQualityPath, lookupTablesPath, etc.)
  but no entry catalogues the SHARED shape. This entity becomes the
  landing page for any future enrichment of route modules.

  Surfaced for canonical-vocabulary review: the convention is
  load-bearing for the SPA's URL contract; worth a developer-guide
  doc page explaining the pattern + the known divergences so new
  feature authors follow it.
