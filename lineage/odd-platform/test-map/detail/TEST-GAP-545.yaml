behaviour: |-
  `listMostPopular` with `tag_to_dataset_field` usage — `testListMostPopular` only creates `tag` rows (no relations). The CTE's UNION-ALL of `tag_to_data_entity` + `tag_to_dataset_field` usage counts is not asserted; the `count` field could be silently zero for tags only used on dataset fields. A regression that, say, broke the `boolOr(ORIGIN.ne(INTERNAL.name()))` external-aggregate (`:385`) would silently mis-tag dataset-field-only tags as INTERNAL.
