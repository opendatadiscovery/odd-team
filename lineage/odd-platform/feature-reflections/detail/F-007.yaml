      fetchAlertsTotals inside a useEffect with an EMPTY dependency array; nothing re-invalidates the
      totals after a Resolve, after a tab switch, or after the backend creates new alerts. The
      operator resolves an alert, the row updates, but the badge stays off-by-one until a full reload
      of /alerts. The totals fetch is also non-trivial — Mono.zipDelayError(allCount, countByOwner,
      countDependent) runs three COUNT queries, the last walking a recursive lineage CTE — so the
      "fetch once" choice is a deliberate cost trade-off that leaves the badge silently wrong.
    evidence:
