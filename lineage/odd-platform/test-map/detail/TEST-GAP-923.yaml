  Add `optionsLoadingStaleClosureTest` under `odd-platform-ui/src/components/DataQuality/DataQualityFilters/FilterItem/MultipleFilterItem/MultipleFilterItemAutocomplete/__tests__/`. Use Vitest + React Testing Library + MSW. Three pinning methods:
  (a) `optionsLoading_returnsToFalseAfterSuccessfulListQuery_pinsHappyPath`: render <MultipleFilterItemAutocomplete> with a useGetNamespaceList stub that resolves with [{id:1, name:'prod'}]; assert optionsLoading transitions to false; assert the option renders.
  (b) `optionsLoading_returnsToFalseAfterErroredListQuery_pinsErrorPath_EXPECTED_FAIL`: stub the list query to reject; assert optionsLoading transitions to false AND a "Failed to load options" message renders. EXPECTED TO FAIL today — pins the bug fix.
  (c) `optionsLoading_doesNotRemainTrueAfterPendingQueryResolves_pinsHookResultInDeps_EXPECTED_FAIL`: stub the list query to be pending initially; trigger the effect (mount with a searchText); resolve the query; assert that without any further searchText / autocompleteOpen change, optionsLoading transitions to false and options appear. EXPECTED TO FAIL today (because hookResult is missing from the dep array) — pins the bug fix.

  Add a `// FIX-REQUIRED — MultipleFilterItemAutocomplete.tsx:91-104 — add hookResult.isPending and hookResult.isError to the effect's dependency array; flip setOptionsLoading(false) on both success and error; render an error message in the noOptionsText for the error case. This test PINS the desired behaviour and FAILS until the fix lands.` block.

  Backlog this gap as a bug-fix item (the desired behaviour is missing from the production code) AND as a test-gap.
