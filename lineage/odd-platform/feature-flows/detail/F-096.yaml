    operator-facing ERROR CONTRACT of the platform's single load-bearing write endpoint, and
    ZERO of its 11 user-facing promises has a behavioural test guarding it. The happy-path 200
    is covered (BaseIngestionTest), but every PROMISE that defines the contract — atomicity
    rollback (H-001, confirmed-but-untested), the three client-error-vs-5xx contradictions
    (H-002/3/4), spec-conformance (H-005), concurrent-safety signalling (H-006), per-item errors
    (H-007), synchronous-intake (H-008), rollback observability (H-009) — is unverified. H-001 is
    the highest-value NET-NEW functional demand (the strongest guarantee with no guard). H-002/3/
    4/6/9 are convergent with PLT-045's existing test plan (mint there, do not double-file). The
    feature sitting at 0/11 verified promises is itself the headline finding.

