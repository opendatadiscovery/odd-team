notes: |-
  **STRENGTHENED batch 2026-05-19M to 2-sidecar primary-source
  triangulation** — the deferred-feature carve-out is now confirmed at
  BOTH the service tier (batch I LineageServiceImpl sidecar) AND the
  controller tier (batch M getDataEntityGroupsLineage sidecar). The
  controller-tier confirmation adds operator-facing observability: a
  caller hitting the endpoint with a DEG containing nested DEGs receives
  silent missing edges; the carve-out is invisible to the caller and the
  doc layer is silent.

  Cross-batch test-coverage + doc-coverage observation. The carve-out is
  INTENTIONAL but the missing-test + missing-doc + missing-backlog combo
  means the eventual refactor will land with no feedback signal — either
  the refactor breaks existing consumers silently, or the consumers'
  downstream behaviour was never characterised in the first place.

  Recommended cleanup paths:

    (a) Test: add @Disabled regression test for getDataEntityGroupLineage
        with a nested-DEG fixture; assert the current "inner DEGs filtered
        out" contract. Reference the comment at LineageServiceImpl.java:71
        in the test name.

    (b) Doc: extend /features/data-lineage (or a sub-page) with a
        'DEG lineage' section naming the inner-DEG suppression contract;
        warn that nested DEGs are flattened to their non-DEG members.

    (c) Backlog: log a tracked item (REFACTOR-NNN) for the inner-DEG-support
        feature lift, citing the LineageServiceImpl.java:71 comment as the
        primary marker.

