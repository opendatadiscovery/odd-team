proposed_action: |-
  Add `EmailNotificationSenderCharsetUnsetRegressionPinTest`. Unit test with custom JVM-charset simulation:

  1. `send_nonASCIIEntityName_renderedBodyManglesCharacters_pinsCharsetUnsetVulnerability` —
     - Simulate a JVM with US-ASCII default (run the test with `-Dfile.encoding=US-ASCII` via `@SystemProperty` or fork a child process).
     - Build an `AlertNotificationMessage` with `dataEntity.name="customers_de_2024_§3_§4"` and a Cyrillic data source name `"клиенты_снежинка"`.
     - Stub `JavaMailSender.send(...)` capturing the MimeMessage.
     - Invoke `emailSender.send(message)`.
     - Extract the body bytes (NOT the rendered String).
     - Assert the body bytes do NOT include the UTF-8 encoded sequence for `§` (0xC2 0xA7) or the Cyrillic characters.
     - Assert the body bytes contain `?` or `0x3F` substitution markers.
     - PINS the current mangling behaviour on non-UTF-8 JVM defaults.

  2. `send_nonASCIIEntityName_withJVMUTF8Default_renderedBodyPreservesCharacters_pinsWorkaroundEfficacy` —
     - Same setup but with `-Dfile.encoding=UTF-8`.
     - Assert the body bytes include the correct UTF-8 sequences for the non-ASCII characters.
     - PINS the JAVA_TOOL_OPTIONS workaround.

  3. `send_nonASCIIEntityName_withExplicitUTF8Charset_renderedBodyPreservesCharacters_confirmsFixDirection` — (UPDATE once REFACTOR-NNN lands)
     - After REFACTOR-NNN: simulate US-ASCII JVM default, but the MimeMessageHelper is constructed with explicit UTF-8.
     - Assert the body bytes include the correct UTF-8 sequences.
     - CONFIRMS the fix's effectiveness — the charset workaround is no longer JVM-wide-required.

  Pair with REFACTOR-NNN (one-line fix) and DOC-GAP-NNN (live doc clarification).

  Coherence note (LSN-018 Rule 6): NET-NEW. No prior TEST-GAP pins the charset-unset code line. The sidecar's doc_drift_findings reference the live-doc JAVA_TOOL_OPTIONS workaround but no prior coverage anchors it to EmailNotificationSender.java:47. No contradiction.
