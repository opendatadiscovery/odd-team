  facet enumeration — REFACTOR-024 family extension to the facet COUNTS
  surface; sharper than the search RESULTS surface because facet counts
  expose catalog cardinality across all owners; HIGH severity; (2)
  bearer-token-shaped session UUIDs — the search_facets schema has no
  user binding; URL leakage = session hijack; SECOND batch surfacing
  this finding (batch-E was the first); HIGH severity; (3) tsquery
  operator injection DoS via persisted query — SECOND invocation site
  of the batch-H getHighlightedResult bug; the persisted state breaks
  every subsequent facet read for the affected session; HIGH severity.
  Secondary findings: unbounded pagination at every layer + side-effect
  UPDATE on every GET + session-state accumulates forever + workaround
  doc silent on facet count scoping + catalog-wide count by design
  (implicit ADR) + zero test coverage at any layer. The highest-leverage
  probe candidates are: (a) cross-owner facet enumeration — local
  docker-compose with ODD platform + Postgres + N seeded owners + invoke
  GET /api/search/{id}/facet/OWNERS as one of them + assert response
  lists every owner with their per-owner entity counts; (b) session
  hijack — userA POSTs /api/search + userB invokes GET /api/search/{A's
  UUID} as userB + assert 200 OK (pins the current bearer-token-shaped
  posture); (c) tsquery injection — POST /api/search with
