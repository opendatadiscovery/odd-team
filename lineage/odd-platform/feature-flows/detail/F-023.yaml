description: |-
  The Directory is the catalog's hierarchy-driven browse surface
  complementing Search's query-driven flat results. It is a thin
  reactive WebFlux entry point (`DirectoryController.java` — 52 lines,
  four endpoints) implementing the OpenAPI-generated `DirectoryApi`
  and forwarding each call to either `DirectoryService` (levels 1, 2,
  3) or `DataEntityService` (level 4). The Directory's load-bearing
  design choice is grouping by ODDRN prefix: level 1 returns one entry
  per distinct ODDRN-prefix observed across registered datasources
  (with sources whose ODDRN cannot be parsed bucketed under the
  `Other`/UNKNOWN_DATASOURCE_TYPE sentinel), and each subsequent level
  narrows the scope.

  The user-observable promise (per the live
  `features/data-discovery/directory` page, WebFetched 2026-05-20
  status 200): "Level 1 — Data source types: One card per ODDRN
  prefix … Level 2 — Data sources: lists registered instances with
  name, ODDRN-derived properties (host, port, database, …) and
  per-source entity count … Level 3 — Entity types: Shows distinct
  Data Entity classes present in the chosen data source … Level 4
  — Entities: The final tier displays the paged list of data
  entities matching both filters."

  The user-observable reality, per the batch-T primary-source
  controller-class sidecar + cross-references to
  `DirectoryServiceImpl`, `OddrnUtils`,
  `ReactiveDataSourceRepositoryImpl`, and the level-4 delegate chain
  through `DataEntityServiceImpl` → `ReactiveDataEntityRepositoryImpl`:
  the Directory is a **non-owner-scoped view of the whole catalog
  inventory** — any authenticated user enumerates every registered
  datasource's name, ODDRN, host, database, port, cluster, account,
  warehouse, topic, plus per-prefix and per-source entity counts.
  Under `auth.type=DISABLED` the surface is anonymously reachable.
  The reflection-based property extractor
  (`DirectoryServiceImpl.java:138-171` — Java reflection over
  `@PathField`-annotated fields on each ODDRN subclass) emits every
  datasource-side ODDRN property unredacted; an attacker with no
  Owner binding gets the FULL ODDRN-derived infrastructure map.

  Additionally: level 4 has a page-vs-count PREDICATE DIVERGENCE
  (REFACTOR-NEW, structurally analogous to REFACTOR-425) — the page
  query (`listByDatasourceAndType`) applies HOLLOW + soft-delete only,
  while the count query (`countByDatasourceAndType`) ALSO applies
  `EXCLUDE_FROM_SEARCH IS NULL or = FALSE`; in deployments using
  `EXCLUDE_FROM_SEARCH` to hide intermediate entities, the UI sees
  'X of Y' with X > Y and pagination math breaks. Levels 1-3 have NO
  pagination at all (level-1 returns one row per prefix bucket, but
  level 2 returns ALL datasources matching the prefix without
  chunking — a deployment with 5K Postgres instances returns 5K rows
  in one response). The reflection extractor is unmemoised — per
  request, per data source, the @PathField field set is re-discovered
  and the getter Method is re-resolved.
chain:
- hop: 1
  node: odd-platform java DirectoryController controller-class:DirectoryController
  sidecar: odd-platform__java__DirectoryController__controller-class__DirectoryController.md
  multiplicity_per_trigger: 1
  evidence: |-
    DirectoryController.java:17-52 — 4-method @RestController
    implementing `DirectoryApi`. All 4 methods GET-only, reactive
    `Mono<ResponseEntity<...>>`. NO @PreAuthorize anywhere on the
    class. SecurityConstants.java grep for `/api/directory` returns
    ZERO matches. Falls through to AuthorizationCustomizer's catch-all
    `.authenticated()` rule under LOGIN_FORM/OAUTH2/LDAP; anonymous
    reachable under DISABLED. Two-service composition unique to this
    controller — DirectoryService for levels 1/2/3 (line 20) +
    DataEntityService for level 4 (line 21,42).
  unresolved: false
- hop: 2a-levels-1-2-3
  node: odd-platform java service service:DirectoryServiceImpl
  sidecar: '(referenced from DirectoryController sidecar)'
  multiplicity_per_trigger: 1
  evidence: |-
    DirectoryServiceImpl.java:48-50 — `getDataSourceTypes` loads ALL
    data sources via unpaginated `dataSourceRepository.list()`,
    groups in memory by ODDRN prefix. Lines 91-99 — `findByPrefix`
    fetch (level 2); 84-89 — `getDataSourceEntityTypeIds(dataSourceId)`
    (level 3). NO OWNERSHIP join, NO principal-derived predicate at
    any level. Lines 101-110 — `getDataSourcePrefix` catches all
    Exception and returns `UNKNOWN_DATASOURCE_TYPE='other'` (silent
    bucket-to-other). Lines 138-171 — `getOddrnPathProperties` uses
    Java reflection (`getDeclaredFields` + `getMethod 'get' + invoke`)
    on every data-source row in level 2 — UNMEMOISED per request.
    Lines 124-127 — `DataEntityTypeDto.findById` throws
    `NotFoundException('Data entity type')` for unknown type-ids — a
    server-side data-integrity error masquerading as a client-facing
    404.
  unresolved: true
  unresolved_reason: |-
    DirectoryServiceImpl referenced from the DirectoryController
    sidecar but not yet enriched as a standalone service-tier
    sidecar. Line numbers cited from the controller-class sidecar's
    bugs/implicit_adrs blocks.
- hop: 2b-level-4
  node: odd-platform java service service:DataEntityServiceImpl
  sidecar: '(referenced from DirectoryController sidecar — also a contributing_node of F-001/F-003/F-004)'
  multiplicity_per_trigger: 1
  evidence: |-
    DataEntityServiceImpl.java:164-179 — `getDataEntitiesByDatasourceAndType`
    composes the page query via
    `reactiveDataEntityRepository.listByDatasourceAndType(datasourceId,
    typeId, page, size)` (line 170) with the count query via
    `reactiveDataEntityRepository.countByDatasourceAndType(datasourceId,
    typeId)` (line 173). The TWO queries use DIFFERENT predicate sets
    — the page-vs-count divergence root cause.
  unresolved: false
- hop: 3a-page-path
  node: odd-platform java repository reactive repository:ReactiveDataEntityRepositoryImpl
  sidecar: '(referenced from F-001 / F-003 / F-004 chains — also relevant here)'
  multiplicity_per_trigger: 1
  evidence: |-
    ReactiveDataEntityRepositoryImpl.java:595-613 — `listByDatasourceAndType`.
    cteConditions includes only DATA_SOURCE_ID = ? (+ optional TYPE_ID
    = ?). Lines 909-939 — baseDimensionsSelect → cteDataEntitySelect
    adds `addSoftDeleteFilter(...)` + `DATA_ENTITY.HOLLOW.isFalse()`.
    MISSING: `DATA_ENTITY.EXCLUDE_FROM_SEARCH.isNull() OR .isFalse()`
    (the third filter from `getDataEntityDefaultConditions` at lines
    970-976).
  unresolved: false
- hop: 3b-count-path
  node: odd-platform java repository reactive repository:ReactiveDataEntityRepositoryImpl
  sidecar: '(same)'
  multiplicity_per_trigger: 1
  evidence: |-
    ReactiveDataEntityRepositoryImpl.java:616-627 — `countByDatasourceAndType`.
    `getDataEntityDefaultConditions()` returns THREE conditions:
    `HOLLOW.isFalse()` + `STATUS != DELETED.getId()` + `EXCLUDE_FROM_SEARCH
    IS NULL or = FALSE`. The page path applies the first two but NOT
    the third — the predicate divergence is the bug surface for any
    deployment using `EXCLUDE_FROM_SEARCH` to hide intermediate
    entities.
  unresolved: false
terminal_side_effect:
  side_effect_class: page-render
  description: |-
    200 OK with: DataSourceTypeList (level 1, list of {prefix,
    display_name, entitiesCount}) | DataSourceDirectoryList (level 2,
    list of {data_source_id, name, ODDRN, properties: {host, port,
    database, account, warehouse, cluster, topic, ...}, entitiesCount})
    | Flux<DataEntityType> (level 3, list of TABLE/FILE/STREAM/JOB/...)
    | paged DataEntityList (level 4, ID + ODDRN + name + type + class
    + status + ownership refs).
  evidence: |-
    DirectoryController.java:23-51 + DirectoryServiceImpl.java:46-89 +
    openapi.yaml:3745-3820 (the 4 GET routes and their response
    schemas).
  cardinality_per_call: |-
    Level 1: 1 row per distinct ODDRN prefix bucket (typically
    5-20 buckets including 'other'). Level 2: ALL datasources
    matching the prefix (NO pagination at the OpenAPI level — for a
    platform with 5K Postgres sources, the level-2 response carries
    5K rows + reflection-extracted properties per row). Level 3: 1
    row per distinct DataEntityType value present in the chosen
    data source (typically 3-8 types). Level 4: bounded by
    caller-supplied page + size (mandatory @NotNull per
    openapi.yaml:3810-3811 PageParam/SizeParam).
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: cross-owner datasource-inventory enumeration — REFACTOR-024 family vector
    observed: |-
      All 4 Directory endpoints return platform-wide aggregates with
      NO filtering by the current user's Owner identity.
      `getDataSourceTypes` lists every registered data source via
      unfiltered `dataSourceRepository.list()`; `getDirectoryDatasourceList(prefix)`
      returns every data source matching the prefix;
      `getDatasourceEntities` pages every entity regardless of
      ownership; `getDatasourceEntityTypes` returns every type-id
      present in the datasource. The Directory is a non-owner-scoped
      view of the whole catalog inventory. The shape is DISTINCT and
      BROADER in ONE dimension from prior cross-owner family
      surfaces: it enumerates the DATASOURCE INVENTORY itself (every
      registered DataSource's ODDRN, host, database, prefix) plus
      the per-type/per-source entity counts. An attacker who can
      authenticate but has NO owner binding learns 'platform XYZ
      runs N Postgres clusters at hosts pg-prod-01.internal /
      pg-prod-02.internal, M Snowflake accounts, K Kafka clusters'
      — internal-infrastructure cardinality plus hostnames. NO other
      read surface in the cross-owner family exposes this
      datasource-cardinality dimension.
    expected: |-
      Either (a) the live `data-discovery/directory` doc page
      discloses that the Directory is an unscoped reconnaissance
      surface (today the page says NOTHING about authorization,
      ownership, or visibility), OR (b) the four endpoints gain
      OWNERSHIP-derived predicates limiting datasource enumeration
      to ownership-associated entries.
    drift_class: cross_owner_datasource_inventory_enumeration
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      bugs_limitations_corner_cases[*] + coherence_check.strengthens[REFACTOR-024]
      + DirectoryServiceImpl.java:48 (unfiltered list) + 91-99
      (unfiltered findByPrefix) + DirectoryController.java:42
      (unscoped delegate). Severity: MEDIUM (under
      read-collaborative posture this is intentional;
      doc-side silence is the actionable finding). Cross-link to
      F-014, F-017, F-005 / F-016 for the family.
  - facet: ODDRN reflection — infrastructure-property leak
    observed: |-
      `DirectoryServiceImpl.java:138-171` uses Java reflection over
      the ODDRN PathField annotation set to emit EVERY datasource-side
      ODDRN property: for a PostgreSQL datasource that is `host`,
      `database`, `port` (when set); for Snowflake that adds `account`,
      `warehouse`; for Kafka adds `cluster`, `topic`. NO redaction
      step, NO allow-list, NO per-property visibility gate. An
      attacker with no Owner binding gets the FULL ODDRN-derived
      infrastructure map of the catalog. Compounded under DISABLED
      mode — the leaked payload is infrastructure-revealing, not
      just metadata-revealing.
    expected: |-
      Either (a) the response shape restricts to a known-safe
      subset (display name + ODDRN + entitiesCount; no reflected
      properties), OR (b) an explicit allow-list per OddrnPath
      subclass declares which properties are operator-facing
      vs internal.
    drift_class: oddrn_reflection_infrastructure_property_leak
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      coherence_check.strengthens[REFACTOR-024 directory_reflection_oddrn_property_leak]
      + DirectoryServiceImpl.java:138-171. Severity: MEDIUM-HIGH
      (the leak payload is infrastructure-revealing — hostnames,
      database names, cluster ids).
  - facet: page-vs-count predicate divergence — REFACTOR-NEW (Directory level 4)
    observed: |-
      `DataEntityServiceImpl.getDataEntitiesByDatasourceAndType`
      (line 164-179) composes a page query via
      `listByDatasourceAndType` and a count query via
      `countByDatasourceAndType`. The TWO use DIFFERENT predicate
      sets — page query (via `cteDataEntitySelect` at
      ReactiveDataEntityRepositoryImpl.java:909-939) applies
      HOLLOW + soft-delete only; count query (line 616-627) ALSO
      applies `getDataEntityDefaultConditions()` which adds
      `EXCLUDE_FROM_SEARCH IS NULL or = FALSE`. Result: in a
      datasource containing entities with `EXCLUDE_FROM_SEARCH =
      TRUE`, the page returns rows the count does NOT include —
      UI sees `pageData.size > count.total`, pagination math
      breaks (page 2 returns rows that 'shouldn't exist'). The
      bug is INVISIBLE for catalogs whose per-datasource entities
      are all `EXCLUDE_FROM_SEARCH = FALSE` (the common case);
      manifests in deployments using EXCLUDE_FROM_SEARCH to hide
      intermediate entities (runs, transient inputs, hollow
      placeholders).

      Cross-cutting bug class:
      PREDICATE-DIVERGENCE-IN-PAGINATION-WRAPPERS, same root
      pattern as REFACTOR-425 (which targets
      `ReactiveDataSourceRepositoryImpl.listDto`'s page-vs-count).
      The bug class is now confirmed at TWO sites; an audit sweep
      across all repository `list*/count*` pairs in the codebase
      is the defensible follow-up.
    expected: |-
      Align the predicate sets — update `cteDataEntitySelect` (or
      `listByDatasourceAndType` specifically) to apply
      `EXCLUDE_FROM_SEARCH` filter, matching
      `getDataEntityDefaultConditions`. Alternative: drop
      `EXCLUDE_FROM_SEARCH` from the count predicate (matches
      existing page behaviour but changes the count semantics —
      riskier).
    drift_class: page_vs_count_predicate_divergence_directory_level_4
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      coherence_check.conflicts_surfaced[0] +
      DataEntityServiceImpl.java:164-179 +
      ReactiveDataEntityRepositoryImpl.java:595-613, 616-627,
      909-939, 970-976. Severity: MEDIUM. Filed as REFACTOR-NEW
      (Directory level-4 page-vs-count divergence; recommend
      grouping with REFACTOR-425 in a pagination-predicate-audit
      sprint).
  - facet: no pagination at levels 1, 2, 3 — unbounded response size
    observed: |-
      `openapi.yaml:3745-3779` declares no `page`/`size` parameters
      on the level-1 (`/api/directory`) or level-2
      (`/api/directory/datasources?prefix=...`) routes; level-3
      (`/api/directory/datasources/{id}/types`) similarly. For a
      platform with thousands of data sources of the same type
      (5K Postgres sources), the level-2 response carries 5K rows
      plus reflection-extracted properties per row. The frontend
      has no chunking mechanism. Level 1 is bounded by the small
      number of distinct ODDRN prefixes (typically <20), but
      `getDataSourceTypes` ALSO loads ALL data sources via
      unfiltered `dataSourceRepository.list()` then groups in
      memory — the in-memory aggregation cost is per-request.
    expected: |-
      Add `page` / `size` parameters to levels 2 and 3, with
      reasonable defaults (e.g. size=50 default, size=200 max).
    drift_class: no_pagination_levels_1_2_3_unbounded_response_size
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      bugs_limitations_corner_cases[6] +
      openapi.yaml:3745-3779 + DirectoryServiceImpl.java:65-82.
      Severity: MEDIUM.
  - facet: DISABLED-mode anonymous reach — directory inherits REFACTOR-185
    observed: |-
      Under `auth.type=DISABLED` all 4 Directory endpoints become
      anonymously reachable — no `@ConditionalOnProperty`, no
      method-level conditional, no fail-closed second-line gate.
      The DISABLED-mode blast radius widens because the leaked
      payload is INFRASTRUCTURE-revealing (ODDRN reflection
      properties: hosts, databases, ports, clusters), not just
      metadata-revealing. REFACTOR-185 19th-sidecar pattern
      (batch Q AppToolbar+CollectorsList UI-tier) extends to P-01
      via Directory.
    expected: |-
      Documentation discloses the DISABLED-mode caveat on the
      Directory page; or the four endpoints gain explicit
      DISABLED-mode fail-fast under the broader REFACTOR-185
      remediation surface.
    drift_class: disabled_mode_anonymous_reach_directory
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T security
      auth_mode_relevance + coherence_check.strengthens[REFACTOR-185].
      Severity: LOW-MEDIUM.
  - facet: unknown ODDRN silently buckets to `other`
    observed: |-
      `DirectoryServiceImpl.java:101-110` — `getDataSourcePrefix`
      catches ALL `Exception` and returns
      `UNKNOWN_DATASOURCE_TYPE = "other"`. Lines 112-122 same for
      `getDataSourceName`. A transient ODDRN parser bug or a
      malformed-but-recoverable ODDRN would silently land in the
      `Other` bucket rather than surfacing. Operators investigating
      'why is my Postgres source under Other?' have only the error
      log to go on (line 107 logs the exception, but no metric, no
      alert, no UI signal). The live doc page (WebFetched
      2026-05-20) does NOT mention the `Other` bucket at all.
    expected: |-
      Either (a) document the `Other` bucket on the live Directory
      page, OR (b) surface a UI signal (an admin warning, a
      Prometheus metric) when sources are bucketed under `Other`.
    drift_class: unknown_oddrn_silent_bucket_to_other
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      bugs_limitations_corner_cases[2] + implicit_adrs[2] +
      DirectoryServiceImpl.java:101-110, 112-122 +
      OddrnUtils.java:7. Severity: MEDIUM.
  - facet: doc silence on authorization / owner-scoping / pagination at level 4
    observed: |-
      The live `/features/data-discovery/directory` page (WebFetched
      2026-05-20 status 200) contains NO mention of authorization,
      owner-scoping, pagination semantics at level 4, the `Other`
      bucket for unknown ODDRNs, or scaling behaviour. Yet the
      endpoint exposes the full registered-data-source inventory
      and is unscoped by ownership at the controller layer. The
      API-reference page (`/developer-guides/api-reference/directory`
      status 200) similarly does not mention authorization,
      pagination semantics beyond `page`/`size` names, an `Other`
      bucket, or a level-by-level walkthrough table.
    expected: |-
      Doc-product editorial pass on the Directory page adds the
      access-control framing + the `Other` bucket explainer + the
      level-4 page-vs-count caveat.
    drift_class: doc_silence_on_directory_authorization_owner_scoping
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      docs_link_semantic.doc_drift_findings[0] +
      WebFetch /features/data-discovery/directory 2026-05-20 +
      WebFetch /developer-guides/api-reference/directory 2026-05-20.
      Severity: MEDIUM.
  - facet: empty prefix-group 500 error — fragile invariant
    observed: |-
      `DirectoryServiceImpl.java:51-62` calls `getFirstDataSource`
      on every prefix-group; line 173-178 throws
      `IllegalArgumentException` on empty. True today because the
      multimap only contains keys with values, but a future refactor
      introducing empty groups surfaces as a 500 from
      `/api/directory` rather than an empty type entry.
    expected: |-
      Defensive: replace `IllegalArgumentException` with an
      empty-handling branch that omits empty prefix groups OR
      surfaces them with a `Skipped: 0 sources` label.
    drift_class: empty_prefix_group_500_error
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      bugs_limitations_corner_cases[3] +
      DirectoryServiceImpl.java:51-62, 173-178. Severity: LOW.
  - facet: unmemoised reflection per request per datasource
    observed: |-
      `DirectoryServiceImpl.java:138-171` — `getOddrnPathProperties`
      uses Java reflection over `@PathField`-annotated fields on
      every data-source row in `/api/directory/datasources`. The
      reflection is unmemoised: per request, per data source, the
      annotated field set is re-discovered and the getter Method
      is re-resolved.
    expected: |-
      Cache the per-OddrnPath-subclass field+getter map once at
      bean init (the field set is static per ODDRN class).
    drift_class: unmemoised_reflection_per_request_per_datasource
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      bugs_limitations_corner_cases[4] +
      DirectoryServiceImpl.java:138-171. Severity: LOW (perf class).
  - facet: type vs class dimension doc drift (carried from v0.1.0 sidecar)
    observed: |-
      The level-3 doc copy uses 'Distinct Data Entity CLASSES' but
      the code returns `DataEntityType` (TABLE/FILE/STREAM/...).
      In ODD's vocabulary `DataEntityClass` is a SEPARATE dimension
      (Set/Transformer/Quality Test/...). Operators familiar with
      the distinction may mis-interpret the level-3 surface.
    expected: |-
      Replace 'classes' with 'types' on the live doc page (small
      copy edit); cross-link the main-concepts.md disambiguation.
    drift_class: type_vs_class_dimension_doc_drift
    provenance: |-
      Carried from v0.1.0 sidecar; still applicable at HEAD per
      this batch's stale_probe_check. Severity: LOW.
  - facet: no HTTP caching, no ETag — read-mostly data hit per UI navigation
    observed: |-
      No HTTP caching, no ETag, no `@Cacheable` on any Directory
      endpoint, despite the data being read-mostly (data-source
      registrations change rarely; entity counts change at
      ingestion cadence). Every UI navigation re-runs the full DB
      + grouping pipeline.
    expected: |-
      Add `Cache-Control` headers + ETag on level-1 / level-2
      responses (the typically-stable surfaces); leave level-4
      uncached because the entity list is ingestion-rate-dependent.
    drift_class: no_http_caching_no_etag_directory
    provenance: |-
      PRIMARY-SOURCE — DirectoryController batch T
      bugs_limitations_corner_cases[7] +
      DirectoryController.java:23-51. Severity: LOW (perf class).
