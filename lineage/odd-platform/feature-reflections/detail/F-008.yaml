- id: H-003
  hypothesis: "When a collector re-registers an existing datasource via POST /ingestion/datasources with a changed connection_url (the source's hostname moved), the platform updates the datasource's connection_url."
  derivation: "Endpoint shape (POST /ingestion/datasources accepts a DataSource with connection_url) + the normal CRUD expectation that re-POSTing a resource updates its fields."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The UPDATE path narrows to name + description ONLY. DataSourceIngestionServiceImpl.prepareForUpdate (lines 74-92) copy-constructs from the existing pojo then explicit-sets ONLY name and description: `new DataSourcePojo(a).setName(i.getName()).setDescription(i.getDescription())`. connection_url, active, type, namespace_id, collector_id, token_id are all PRESERVED from the existing row. A collector that needs to update connection_url has no mechanism on this endpoint; the create-path mapper (DataSourceIngestionMapperImpl.java:9-19) does not even set connection_url. The response is 200 OK with an empty body regardless — no signal that the update was a no-op for that field.
    evidence:
      - sidecar: odd-platform__java__service__service__DataSourceIngestionServiceImpl.md
        section: "concepts.invariants (partial-merge narrowing) + coherence_check REFACTOR-422"
        cite: "DataSourceIngestionServiceImpl.java:74-92,86-88"
        note: "Copy-construct + 2 explicit setters; connection_url never written on the S2S path."
      - sidecar: odd-platform__java__service__service__DataSourceIngestionServiceImpl.md
        section: "downstream_side_effects (mapper-side details)"
        cite: "DataSourceIngestionMapperImpl.java:9-19"
        note: "Create-path mapper sets 5 fields; connection_url not among them."
    operator_visible_failure: |
      A collector author whose source hostname changed cannot fix the datasource's connection_url via the documented re-registration flow; the platform silently keeps the stale URL and returns 200. The only path to update connection_url is the disjoint UI admin endpoint (PUT /api/datasources, full-form replace via MapStruct) — which a collector author may not have access to or know about. This is a deliberate collector-tenant-vs-operator-admin design (ADR-CANDIDATE-142), but the asymmetry is operator-invisible and produces a silent no-op.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional   # DataSourceIngestionServiceTest exists but its fixtures set only oddrn+name; NO assertion that connection_url is NOT propagated on update. Pin the partial-merge narrowing.

- id: H-004
  hypothesis: "When an operator renames a datasource (or edits its description) in the Management → Datasources UI, that edit persists across subsequent collector ingestion ticks."
  derivation: "Negative-space — an operator's UI edit to a catalog field is normally durable; a collector re-publish should not silently revert an operator's deliberate curation."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The collector wins. On the next POST /ingestion/datasources that names the same ODDRN, prepareForUpdate (DataSourceIngestionServiceImpl.java:86-88) OVERWRITES name and description from the collector payload — silently. There is no merge-conflict check, no lastModifiedBy discrimination, no log.warn, no Activity event, no diff in the response. The operator's UI rename is replaced by whatever the collector's config carries. (The COUNTERFACTUAL is confirmed at the disjoint UI path per feature-flow batch-W: the UI write path uses DataSourceMapper.applyToPojo writing ALL form fields — so the operator-side and collector-side both write name/description, with the LAST writer winning and no coordination.)
    evidence:
      - sidecar: odd-platform__java__service__service__DataSourceIngestionServiceImpl.md
        section: "coherence_check REFACTOR-423 (silent overwrite of operator UI edits)"
        cite: "DataSourceIngestionServiceImpl.java:86-88"
        note: ".setName(i.getName()) overwrites the operator's UI rename on the next collector tick; no audit."
      - sidecar: odd-platform__java__service__service__DataSourceIngestionServiceImpl.md
        section: "downstream_side_effects (log-only side-effects)"
        cite: "DataSourceIngestionServiceImpl.java:53,62"
        note: "Only log.debug on the to-update/to-create lists; no INFO/WARN, no Activity event recording the overwrite."
    operator_visible_failure: |
      An operator curates a datasource name in the UI ("Snowflake — Prod Finance"); the next time the collector starts, the name reverts to whatever the collector config says ("snowflake-default"). The operator's curation vanishes with no warning and no audit trail to explain why. Diagnosing it requires reading the collector config AND knowing the S2S re-registration path overwrites name/description — neither visible from the UI. This is the datasource-side mirror of the platform-wide audit-silence pattern.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional   # pin the operator-edit-overwrite (set name=X via update payload over an existing row with name=Y, assert X wins, no audit). Both regression-pin and the guard for the fix.

- id: H-005
  hypothesis: "When a custom-collector author sets namespace_name in the POST /ingestion/datasources payload, the registered datasource appears under that namespace."
  derivation: "Endpoint shape — the Ingestion API contract's DataSource model carries a namespace field, implying the caller controls the datasource's namespace."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The payload's namespace_name is NEVER read on this path. mapDataSources (DataSourceIngestionServiceImpl.java:99-111, line 106) stamps namespace_id from CollectorDto.namespace() — the Collector's PRE-CONFIGURED namespace — via MappingUtils.extractFieldFromNullableObject. The datasource always inherits the Collector's namespace; a Collector with no configured namespace produces datasources with namespace_id=null. This is the collector-scoped-tenancy invariant (ADR-CANDIDATE-143) and it is a SOUND security property — a stolen Collector A token cannot register datasources into Collector B's namespace. But it is operator-invisible.
    evidence:
      - sidecar: odd-platform__java__service__service__DataSourceIngestionServiceImpl.md
        section: "concepts.invariants (Namespace inheritance) + coherence_check ADR-CANDIDATE-143"
        cite: "DataSourceIngestionServiceImpl.java:106"
        note: "namespace_id sourced unconditionally from the matched Collector; payload namespace_name silently dropped."
    operator_visible_failure: |
      A collector author setting namespace_name="my-team" sees the datasource appear under the Collector's namespace instead, with no log and no doc warning. They cannot predict the behaviour from the docs and may file a confused bug report. The protective intent is correct; the silent drop is the surprise. (Counterfactual: the UI admin path DOES honour namespace_name via getOrCreate — feature-flow batch-W — so the two surfaces behave oppositely, compounding the confusion.)
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional   # pin the namespace-from-Collector invariant (payload namespace_name="X" + Collector namespace="Y" → datasource lands under Y). Also a SECURITY regression-pin (the cross-tenant-write protection lives here).

- id: H-006
  hypothesis: "When a collector ingests a 1000-entity batch via POST /ingestion/entities and exactly one entity has a constraint violation, the other 999 valid entities are persisted (per-entity error isolation), and the response identifies which entity failed."
  derivation: "Negative-space + response shape — a batch API normally isolates per-item failures or returns a 207 Multi-Status; a collector should not lose a whole batch for one bad row."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The entire batch is all-or-nothing. IngestionServiceImpl.ingest is wrapped in a single @ReactiveTransactional (line 66) that binds the whole 14-processor chain plus the OTLP export. One constraint violation anywhere rolls back ALL entities. The HTTP response is binary — 200/201 (all committed) or 5xx (everything rolled back) — with no 207 Multi-Status, no per-entity error payload, no DLQ. A duplicate ODDRN within the payload crashes the whole batch with IllegalStateException (Collectors.toMap default throwing merger, line 86) surfacing as 5xx with no structured "duplicate oddrn" message.
    evidence:
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: "concepts.invariants (ingest is @ReactiveTransactional) + bugs_limitations_corner_cases (duplicate ODDRN crash)"
        cite: "IngestionServiceImpl.java:66 + 83-86"
        note: "Single outer transaction binds the whole batch; duplicate-ODDRN throws and 5xx's the batch."
    operator_visible_failure: |
      A collector with one glitched row (or an at-least-once retry that re-emits a duplicate ODDRN) loses the entire tick with an opaque 5xx and a stack trace the collector cannot parse. There is no signal of which entity failed and no partial success. On the platform side @Slf4j is unused (zero log.* calls) so the rollback is forensically silent. This is tracked as PLT-045 / DOC-195 (error-contract half of the F-008 pipeline).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional   # pin all-or-nothing: 1 bad entity in an N-entity payload → ALL rolled back (none persisted); duplicate-ODDRN → 5xx not partial. test_matrix unit.uncovered names exactly this.

- id: H-007
  hypothesis: "When a collector with a valid token for datasource A submits a POST /ingestion/entities payload naming datasource B's ODDRN (with the ingestion filter ENABLED), the platform rejects the cross-datasource write."
  derivation: "Endpoint shape + the per-datasource token model implying the token authorises writes only to its own datasource."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      With the filter ENABLED, the cross-datasource write IS prevented at the filter layer: IngestionDataEntitiesFilter resolves the token for the datasource named in the BODY and compares it to the Bearer header — a token for A does not match B's token, so the request 401s (the token must match the datasource in the payload). BUT this only holds when the filter is on. On the SHIPPED default (filter off), there is no token check at all (H-001), and the service resolves whatever datasource the payload names with no caller binding (IngestionServiceImpl.java:68). So the protection exists in exactly one configuration and is absent in the default one. Additionally, the filter binds token-to-datasource, not caller-to-tenant — a stolen token for A still authorises full destruction of A.
    evidence:
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: "security.data_exposure[2]"
        cite: "IngestionDataEntitiesFilter.java:43-58"
        note: "Token comparison binds the caller to the specific datasource named in the payload — when the filter runs."
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: "tests_coverage_semantic.uncovered_behaviours (cross-collector pollution probe)"
        cite: "IngestionServiceImpl.java:68"
        note: "Service resolves the payload-named datasource unconditionally; the only defence is the upstream (default-off) filter."
    operator_visible_failure: |
      In the configuration most operators actually run (default), there is no cross-datasource protection. Even with the filter on, the protection is token-scoped not tenant-scoped, so a leaked token for one datasource is a full write+destroy capability over that datasource. No integration test pins the cross-collector-pollution behaviour (IngestionCrossCollectorPollutionTest does not exist), so a regression weakening the filter's datasource binding would land green.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # pin the filter-ON cross-datasource rejection (token-for-A + payload-names-B → 401) so a regression cannot weaken the binding silently. The unmet part (filter-OFF has no protection) is the H-001 caveat.

- id: H-008
  hypothesis: "When a collector authenticates against POST /ingestion/entities, the bearer token it presents is compared against a securely-stored credential (hashed at rest, constant-time comparison) — as a user would expect of any API key."
  derivation: "Negative-space + security expectation — API credentials are conventionally hashed at rest and compared in constant time."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The token is stored and compared in PLAINTEXT. TOKEN.value is varchar(40) with no hashing column (V0_0_28__add_token.sql:4); TokenGeneratorImpl writes RandomStringUtils.randomAlphanumeric(40) verbatim; ReactiveCollectorRepositoryImpl reads via TOKEN.VALUE.eq(token) (plaintext SQL equality); IngestionDataEntitiesFilter.java:56 compares via String.equals (non-constant-time, not MessageDigest.isEqual). The plaintext-everywhere claim closes end-to-end: schema → codegen → storage → SQL-equality → String.equals → DOM-render (CollectorsList shows the token as a plaintext DOM text node, not an input[type=password]).
    evidence:
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: "implicit_adrs[1] (plaintext-equality shared-secret stance) + security.known_security_gaps[2]"
        cite: "IngestionDataEntitiesFilter.java:56 + TokenGeneratorImpl.java:39 + ReactiveTokenRepositoryImpl.java:30-39"
        note: "String.equals on a plaintext-at-rest 40-char secret."
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "understanding (40-char plaintext bearer token)"
        cite: "CollectorItemToken.tsx:34"
        note: "Token rendered as plaintext DOM text node, not a password input — completes the plaintext-everywhere chain at the render layer."
    operator_visible_failure: |
      Any DB-side reader (a replica, a backup, a pg_dump operator, an accidental jOOQ log leak, a read-only SQL-injection elsewhere) recovers every live ingestion credential in plaintext. The 40-char entropy makes brute-force infeasible, but the at-rest exposure and the non-constant-time compare are both real. The live enable-security doc is SILENT on the storage shape — operators cannot infer the threat model from the doc alone. Tracked as PLT-085 (plaintext-at-rest) + PLT-108 (rotation returns plaintext, no grace window).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # this is a posture/threat-model fact more than a behaviour; the testable guard is a security-tier assertion that the stored TOKEN.value equals the issued value (pins plaintext-at-rest so a future hashing fix is a deliberate, test-flipping change). Lower-value than H-013/H-001 but real.

- id: H-009
  hypothesis: "When an operator rotates a collector's token in the Management → Collectors UI (the 'regenerate token' confirmation says it secures the collector), the rotation has a meaningful security effect on the collector's ingestion."
  derivation: "UI label — the Regenerate token affordance + the live doc's 'rotate a leaked token' guidance promise a security property."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      On the shipped default deployment the rotation has ZERO security effect on the /ingestion/entities write path, because that path is anonymously reachable regardless of token value (filter off per application.yml:48 — H-001). The token only gates /ingestion/entities when auth.ingestion.filter.enabled=true. The CollectorItemToken ConfirmationDialog reads only "Are you sure you want to regenerate token for this collector?" — it promises a security property the default deployment does not enforce. Separately, the rotation is in-place with NO grace window (the old token 401s immediately, ingestion fails until the collector picks up the new value — PLT-108) and regenerateDataSourceToken is non-@ReactiveTransactional so a DB-write failure can leave the response carrying a token the DB never stored (PLT-087).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "requires-config (auth.ingestion.filter.enabled default false) + doc_drift_findings[0]"
        cite: "CollectorItemToken.tsx:38-49 + application.yml:48"
        note: "Rotation dialog promises security; default deployment does not enforce the token on the entities path."
    operator_visible_failure: |
      An operator rotating a leaked token on a default deployment believes they have contained the leak; the entity-ingestion write path remains anonymously open, so the rotation contained nothing. Conversely, an operator rotating during active ingestion (with the filter on) causes an immediate ingestion-failure incident because there is no grace window. The UI gives no signal of either fact. Cornerstone-3 (configuration-as-separate-audience-surface) failure.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
