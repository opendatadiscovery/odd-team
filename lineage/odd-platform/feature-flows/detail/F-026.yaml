    Lines 112-119 (`getCustomSchemaDBUrl`) rebuild the JDBC URL via
    `UriComponentsBuilder` to append `?schema=lookup_tables_schema`.
    Every connection from the `customConnectionPool` lands inside
    `lookup_tables_schema`. The live docs confirm this is intentional
    (WebFetched 2026-05-20): "you can specify any {database_host},
    {database_port} or {database_name} but schema, where Lookup
