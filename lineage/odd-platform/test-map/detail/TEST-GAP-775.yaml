behaviour: |-
  **CRITICAL — Notification SMTP case-sensitivity trap: an operator copy-pasting the live-doc Gmail YAML example (which uses `protocol: SMTP` uppercase) silently bypasses STARTTLS and SMTP AUTH. Credentials may travel in plaintext on every alert email.** Triangulated across code + live docs at the exact line:

  - **Code site**: `NotificationConfiguration.java:63` evaluates `if (emailProperties.getProtocol().equals("smtp"))` — case-sensitive lowercase comparison.
  - **TRUE branch (L63-66)**: populates `mail.smtp.auth = emailProperties.getSmtp().getAuth()` AND `mail.smtp.starttls.enable = emailProperties.getSmtp().getStarttls()`.
  - **ELSE branch (L67-69)**: populates ONLY `mail.transport.protocol = emailProperties.getProtocol()` raw; `mail.smtp.auth` and `mail.smtp.starttls.enable` are NEVER SET regardless of operator config.
  - **Live doc evidence** (WebFetch 2026-05-20 status 200 from `/configuration-and-deployment/odd-platform` Gmail example): `protocol: SMTP` (uppercase) — exactly the value that takes the ELSE branch and silently disables both AUTH and STARTTLS.

  **Operator-impact scenario** (LSN-001 / LSN-002 family — silent insecure default + cryptic doc coverage):
  1. Operator follows the docs verbatim: `protocol: SMTP`, `smtp.auth: true`, `smtp.starttls: true`, `port: 587`.
  2. Spring binds `EmailSenderProperties.protocol = "SMTP"`.
  3. `mailSender(...)` runs the ELSE branch — Properties bag has only `mail.transport.protocol=SMTP`.
  4. JavaMail's per-property defaults (when keys are unset): `mail.smtp.auth=false`, `mail.smtp.starttls.enable=false`.
  5. First alert email triggers `transport.connect(...)` — depending on the relay's policy, the connection either fails plaintext (no AUTH), or sends credentials in plaintext (no STARTTLS), or both.
  6. NO boot warning, NO log line names the case-sensitivity issue. Operator discovers the misconfiguration via either failed delivery OR a security review (worst case: AFTER the credentials have been observed by an MITM).

  **Doc-drift confirmation**: the live doc page at `docs.opendatadiscovery.org/configuration-and-deployment/odd-platform` documents the operator-facing YAML AND uses the uppercase `protocol: SMTP` form in the Gmail worked example. The code's lowercase-only comparison is invisible to the operator reading the docs. This is the SAME class as LSN-001 (LOCAL ephemeral default with caveat-only doc) and LSN-002 (us-east-1 pin with caveat-only doc) — a silent insecure default where the doc carries the surface but the code carries the trap.

  **No existing test gap covers this** — verified by grep of test-map/index.yaml: existing TEST-GAP-197..202 cover blank-field validation, null SMTP fields, non-'smtp' protocols (the protocol pass-through to JavaMail), boot-time IllegalArgumentExceptions. NONE address case-sensitivity specifically.

  **Test gap shape**: parametrised unit test asserting `mailSender(...)` constructs the Properties bag correctly for BOTH `protocol: "smtp"` (lowercase, expected TRUE branch — auth + starttls populated) AND `protocol: "SMTP"` (uppercase — currently the ELSE branch — a REGRESSION-PIN that documents the silent failure mode AND triggers a fix-recommendation for case-insensitive comparison). The test is the place to author the fix simultaneously: change line 63 to `emailProperties.getProtocol().equalsIgnoreCase("smtp")` and verify both cases produce the same Properties bag.
