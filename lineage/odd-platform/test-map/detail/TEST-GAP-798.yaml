behaviour: |-
  **HIGH — Slack 429 rate-limit Retry-After header IGNORED.** Slack documents its incoming-webhooks as rate-limited to ~1 message per second per webhook (short bursts allowed); on excess, Slack returns 429 with a `Retry-After: N` header. `AbstractNotificationSender.java:26` checks only `response.statusCode() != 200` — every non-200 raises an identical `NotificationSenderException` with the same message string and **no body / status-code / header information**.

  **Distinguishes from TEST-GAP-457** (no rate-limiting / no batching / no token bucket — HIGH, batch K): that gap pins the *absence of any rate-limit mechanism* (the platform fires N alerts → N POSTs back-to-back). This gap pins the *failure to consume the receiver's documented backpressure signal* — even if the platform had no client-side rate limit, honouring `Retry-After` would naturally throttle to Slack's documented cadence.

  **Operator-impact compound failure**:
  1. Operator deploys ODD with default behaviour (no rate-limit on dispatch).
  2. DQ misconfiguration creates a burst of 50+ alerts in a 5-second window.
  3. First ~5 POSTs to Slack succeed (200 OK).
  4. Subsequent POSTs receive 429 + `Retry-After: 30`.
  5. Platform IGNORES the header, treats 429 as generic failure, logs ERROR, moves to next sender.
  6. WAL LSN advances regardless of 429 (the dispatcher caught NotificationSenderException → no replay).
  7. The 45+ subsequent alerts are LOST to Slack.
  8. **No operator-visible signal beyond `log.error("Notification sender Slack: ...")` lines** — neither the status code, nor the Retry-After value, nor the body ("rate_limited") is logged.
  9. Operator investigating "why didn't my Slack alerts arrive" must `tcpdump`-style infer the underlying cause; ODD's log surface does not differentiate 429 from 400 / 404 / 500.

  **No code path for status-class branching**: `AbstractNotificationSender.sendAndValidate(...)` (lines 16-30) reads only `response.statusCode()` and wraps as `NotificationSenderException`. No `response.headers().firstValue("Retry-After")` call, no `HttpStatus.TOO_MANY_REQUESTS.value()` branch, no `Thread.sleep(retryAfterMs)`, no scheduled-retry, no per-status-class metric, no exponential back-off.

  **Test gap shape**: regression-pin asserting Slack 429 + `Retry-After` is treated identically to 400 / 500 — the alert is lost from the Slack channel with no operator-visible signal beyond a uniform log line. PINS the current undifferentiated handling; pairs with REFACTOR-NNN adding status-class branching + scheduled-retry honouring Retry-After.
