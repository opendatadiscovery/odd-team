security_aggregate:
  overall: HIGH
  auth_modes_relevant: []
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: N/A
    detail: |-
      Performance invariant — not an authorization concept.
  owner_scoping:
    verdict: N/A
    detail: |-
      Performance invariant — not data-scoped.
  strengths: []
  weaknesses:
    - |-
      An authenticated operator can trivially drive heavy backend load
      by sweeping filter selections (e.g. cycling through all owners
      one at a time). Not a denial-of-service vector at typical
      catalog scale, but operator-driven load amplification.
      Severity LOW; same shape as many ungated read paths.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityFilters.md
    - DataQualityContent.md
    - DataQualityStore.md
  evidence: []
performance_aggregate:
  overall: LOW
  hot_paths:
    - |-
      One backend dashboard fetch per filter chip toggle — the multi-CTE
      multi-join getDataQualityTestsRuns SQL is the per-toggle cost.
    - |-
      The autocomplete search input has the same shape — one list-API
      request per keystroke, no debounce (captured separately under the
      dashboard-filter-panel entity's performance weaknesses).
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One fetch per state transition; no batching, no coalescing. react-
      query dedupes identical concurrent keys but not the gradual
      progression of distinct queryKeys as chips accumulate.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless per-request — backend can scale horizontally to handle
      the load. The concern is backend cost amplification per active
      user, not request handling.
  strengths:
    - |-
      Immediate visual feedback — every filter selection produces a
      result instantly (modulo network latency), no lag from an explicit
      Apply step. The UX is "live", which some operators prefer.
  weaknesses:
    - |-
      The full multi-CTE multi-join SQL runs on every single filter
      change; backend cost amplifies linearly with chip toggles for a
      single operator's slice-building session.
    - |-
      No "Apply" affordance means an operator who clears and re-selects
      five chips fires 10 backend queries (5 clears, 5 new selections).
  cross_file_inconsistencies:
    - |-
      The no-debounce-on-filter-re-query finding is recorded from THREE
      angles — DataQualityStore (derived atom updates synchronously on
      every source write), DataQualityContent (no debounce around
      useGetDataQualityDashboard), DataQualityFilters (no Apply gate).
      Consistent across the batch, not a disagreement — three sidecars
      triangulate the same MEDIUM-severity gap.
  contributing_files:
    - DataQualityFilters.md
    - DataQualityContent.md
    - DataQualityStore.md
  evidence:
    - DataQualityStore.md:performance.known_performance_gaps.[0]
    - DataQualityFilters.md:performance.known_performance_gaps.[1]
    - DataQualityContent.md:performance.hot_paths.[0]
