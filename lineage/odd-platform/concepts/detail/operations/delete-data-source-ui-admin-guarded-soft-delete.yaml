security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
    - S2S
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      DELETE /api/datasources/{data_source_id} is path-gated by
      DATA_SOURCE_DELETE (MANAGEMENT tier) at SecurityConstants.java:121-123.
      NO @PreAuthorize, NO programmatic check — the gate is 100%
      declarative, consistent with the platform's path-based RBAC.
      A service-bypassing caller invoking dataSourceRepository.delete(id)
      directly skips both the auth gate AND the cascade-guard.
  owner_scoping:
    verdict: N/A
    detail: |-
      The delete operates by data_source.id with no owner filter.
      DATA_SOURCE_DELETE is MANAGEMENT-tier (not entity-scoped) — a
      holder can delete ANY data source, not only ones they own.
  strengths:
    - |-
      The cascade-guard prevents accidental destruction of an
      actively-ingested data source — a live data_entity child blocks
      the delete with HTTP 400, no mutation (deleteDataSource.md
      implicit_adrs.[0])
    - |-
      Soft-delete (not hard-delete) — the data_source row, the token,
      and the entities persist; consistent with the platform-wide
      soft-delete convention
  weaknesses:
    - |-
      The orphan plaintext token left behind is a stale-secret-at-rest
      — the deleted data source's token row is never removed (token
      table has no deleted_at, no GC path) — MEDIUM
    - |-
      No audit trail of the delete — DataSourceServiceImpl emits no
      Activity Event; an operator cannot determine who deleted a data
      source — MEDIUM
    - |-
      DISABLED auth.type makes the delete fully open — a misconfigured
      production deployment lets any caller delete any data source
      whose children are soft-deleted
    - |-
      MANAGEMENT-tier permission grants delete of ANY data source —
      DATA_SOURCE_DELETE is not entity-scoped; a holder can delete
      every data source in the catalog — LOW
  cross_file_inconsistencies: []
  contributing_files:
    - deleteDataSource.md
  evidence:
    - deleteDataSource.md:security.authorization_assertions
    - deleteDataSource.md:security.known_security_gaps (orphan token; no audit trail; MANAGEMENT-tier non-entity-scoped)
performance_aggregate:
  overall: HIGH
  hot_paths:
    - |-
      Not a hot path — delete is an operator-initiated, low-frequency
      administrative action. Per call it issues two SQL statements:
      one SELECT EXISTS against data_entity and one UPDATE against
      data_source (deleteDataSource.md performance.hot_paths)
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single-item delete per call — there is no bulk-delete endpoint on this controller.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless handler — scales horizontally. The
      existsNonDeletedByDataSourceId EXISTS query is index-assisted if
      data_entity.data_source_id is indexed; the UPDATE targets a
      single row by primary key. The delete does NOT take the
      getIdByOddrnForUpdate row lock, so it does NOT serialise against
      concurrent collector ingestion of the same data source — the
      cascade-guard/concurrent-ingest interleave can leave a
      soft-deleted data_source with a live child entity.
  strengths:
    - Two-statement operation — bounded cost per call; empty Mono<Void> response, no payload buffering
  weaknesses:
    - |-
      Orphan token rows accumulate without bound across register/delete
      cycles — a slow table-growth leak (deleteDataSource.md
      performance.known_performance_gaps LOW)
    - |-
      The delete does not acquire the FOR UPDATE lock the ingestion
      path uses — a delete and a concurrent collector ingest of the
      same ODDRN can interleave (the cascade-guard race; probe P-047
      establishes the static precondition only)
  cross_file_inconsistencies: []
  contributing_files:
    - deleteDataSource.md
  evidence:
    - deleteDataSource.md:performance.hot_paths
    - deleteDataSource.md:performance.scaling_characteristics + known_performance_gaps
notes: |-
  This operation completes the 4-endpoint UI-admin DataSource write
  surface in the registry: register-data-source (POST),
  update-data-source-ui-admin-replace (PUT, NEW THIS BATCH),
  regenerate-data-source-token (PUT .../token), and
  delete-data-source-ui-admin-guarded-soft-delete (DELETE, THIS
  ENTRY).

  The load-bearing operator-facing fact: "Delete" does NOT remove the
  data source — it soft-deletes it, blocks if the source is actively
  ingested, and leaves the token + FTS vector + historical entities
  in the database. An operator clicking Delete on an actively-ingested
  source gets HTTP 400, not a deletion; the doc page gives no hint of
  the precondition or the stop-the-collector-first workaround.

  Cross-cutting connections:
    - Pairs with the dedicated invariant
      datasource-delete-incomplete-cleanup-orphan-token-uncleared-fts
      (the incomplete-cleanup operator hazard)
    - Pairs with cascade-on-delete-application-tier-guarded-across-n-referent-classes-batch-w
      (the cascade-guard is one instance of the cross-pillar
      application-tier cascade-guard pattern)
    - Pairs with three-soft-delete-mechanisms-across-the-repository-layer
      (data_source uses the deleted_at soft-delete mechanism)
    - Pairs with audit-log-presence-asymmetry-2-tier-audit-story
      (the delete emits no Activity Event)
    - Pairs with register-data-source + update-data-source-ui-admin-replace
      + regenerate-data-source-token (the 4 UI-admin DataSource writes)

  Two DOC-NNN candidates: (a) document on /features/management that
  deleting a data source is BLOCKED while it has live ingested data
  entities, and that the reliable path is to stop the collector
  first; (b) document that the delete is a soft-delete leaving the
  ingested data and the token in the database.
