notes: |-
  This is the architectural pattern for "stable horizontal-tile position
  in a multi-row categorical render". A future UI displaying any other
  fixed-enum dimension across multiple rows should reuse the pattern
  (and reference this concept entry). The legend-matching invariant
  (legend iteration uses the same pattern) is a downstream guarantee
  worth pinning if either ever drifts.
