- id: H-009
  hypothesis: "When a webhook POST creates alerts, the platform records WHO POSTed it (a request-level audit entry), so after a forged-alert incident an operator can reconstruct the source."
  derivation: "Pillar mission + security: P-07's audit story and a forensic expectation for an unauthenticated authoritative-write surface; a senior PO expects an ingress audit trail given the forge risk."
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |
      The audit story is asymmetric. The WEBHOOK INGRESS itself is unaudited: handleExternalAlerts
      has no log.info of who POSTed, no @Timed Micrometer counter, no correlation-id capture
      (postAlerts sidecar known_security_gaps[3]; AlertServiceImpl downstream cross-method invariant 1).
      BUT the resulting alert-STATE-transitions ARE audited: each created alert emits an
      OPEN_ALERT_RECEIVED Activity event (systemEvent=true) via registerNewAlertsActivityEvents ->
      ActivityService.createActivityEvents -> ReactiveActivityRepositoryImpl.save(List) batch path
      with is_system_event=true (AlertServiceImpl.java:309-325 + batch R). So the platform records
      THAT an alert was received on an entity, but NOT the network source / principal of the POST.
      The Activity row's source identity is the SecurityContext username at emit time — which is
      anonymous for the unauthenticated webhook. So the hypothesis holds for "an alert was received"
      and fails for "who POSTed it".
    evidence:
      - sidecar: odd-platform__java__AlertManagerController__controller-method__postAlerts.md
        section: security.known_security_gaps[3]
        cite: "AlertManagerController.java:21-26"
        note: "no entry log / no @Timed / no correlation-id — ingress is unaudited"
      - sidecar: odd-platform__java__service__service__AlertServiceImpl.md
        section: downstream_side_effects (cross-method invariant 1) + invariants (manual createActivityEvents)
        cite: "AlertServiceImpl.java:309-325"
        note: "OPEN_ALERT_RECEIVED Activity events DO persist via the batch save path (the audited half)"
    operator_visible_failure: |
      After a forged-alert incident, an operator can see in the Activity feed that alerts were
      received on the affected entities (and roughly when), but cannot answer "which IP / which
      principal POSTed them" — the ingress is anonymous and unlogged. Forensic reconstruction of the
      attack source is impossible from ODD telemetry; the operator must correlate with reverse-proxy
      / ingress logs they may not retain. The partial-commit risk on the batch Activity save under
      partition rotation (no transaction wrap in executeInPartition) can also drop a subset of the
      received-alert audit rows (F-007 drift_class alert_activity_partial_commit_under_partition_rotation).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    dedup_note: "net_new as a SPECIFIC F-007 ingress-audit caveat. The broader audit-silence family is tracked (F-006 + DOC-179 mentions the absence), and the AlertManager-ingress-unaudited facet is in the F-007 sidecar; but I find no standalone PLT/DOC for 'webhook ingress has no request-level audit'. Distinct from PLT-014 (which is auth/XSS/idempotency, not ingress audit)."

- id: H-010
  hypothesis: "When an alert is POSTed WITHOUT an entity_oddrn label, the caller gets an error (or the alert is clearly surfaced as unrouted) — a write that goes nowhere is not silently accepted."
  derivation: "Negative-space + endpoint-shape: entity_oddrn is the routing key; a senior PO expects a missing routing key to fail loudly rather than persist an invisible row."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      An alert POSTed without entity_oddrn is silently accepted with a 204 and persisted with
      data_entity_oddrn = NULL. AlertServiceImpl.java:178 maps labels.get("entity_oddrn") which
      returns null when the key is absent; no validation rejects it; the controller returns 204
      unconditionally (AlertManagerController.java:25). The orphaned row is invisible on every UI
      surface (the joins resolve no entity) yet it IS persisted and counted in the platform-wide
      open-alert total (countAlertsWithStatusOpen has no entity-FK predicate). The live config doc
      acknowledges the orphan ("will not appear on any entity's page, and is effectively orphaned").
    evidence:
      - sidecar: odd-platform__java__service__service__AlertServiceImpl.md
        section: tests_coverage_semantic.uncovered_behaviours (orphan-on-missing-entity_oddrn)
        cite: "AlertServiceImpl.java:178"
        note: "null entity_oddrn -> AlertPojo with null FK; no rejection"
      - sidecar: odd-platform__java__AlertManagerController__controller-method__postAlerts.md
        section: tests_coverage_semantic.uncovered_behaviours (Orphan alert) + invariants (unconditional 204)
        cite: "AlertManagerController.java:25"
        note: "204 returned regardless; caller cannot tell the alert was orphaned"
    operator_visible_failure: |
      An operator who mislabels an AlertManager rule (typo'd or omitted entity_oddrn) gets a 204
