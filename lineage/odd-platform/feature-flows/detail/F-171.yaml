notes: |-
  Minted from ui-review-2026-05-26 slice H (Management/OwnerAssociations,
  11 components). The triage UX is the OPERATOR-side companion to F-075's
  user-self-request flow — operationally distinct because (a) different
  audience (admin vs end-user), (b) different HTTP verb (PUT vs POST),
  (c) different downstream side-effect (state change on existing row +
  optional user_owner_mapping insert vs new row creation), (d) different
  UI tree (Management → Associations vs identity/profile cluster).

  Hop-4's HTTP shape is ui_unverified because the hook implementation
  (useUpdateAssociationRequest) was not Read in slice H — access to
  lib/hooks/api/ was blocked at the file-read level. A future ui-review
  or backend-read pass refines.

  The four drift facets at this layer are all UI-anchored and
  operator-observable; three are ui_unverified=false (directly
  observable in the .tsx) and one is ui_unverified=true (depends on
  the DTO schema which is generated-sources content).
