ui_review_2026_05_26:
  reviewer: ui-review-2026-05-26 (slice G — Management general)
  status: ui-complete (UI primary-source confirms read-collaborative posture at sidebar visibility layer)
  notes: |-
    UI walk of ManagementTabs.tsx confirms the cross-Management
    read-collaborative posture has an OPERATOR-VISIBLE ANALOGUE in
    the sidebar:
    (1) ManagementTabs.tsx:19-50 defines 9 tab entries (Namespaces,
        Datasources, Integrations, Collectors, Owners, Tags,
        Associations, Roles, Policies). Only the Associations entry
        (line 40-43) carries a `hidden: hideAssociations` flag,
        derived at lines 14-17 from
        `!hasAccessTo(OWNER_ASSOCIATION_MANAGE)`. The other 8 tab
        labels are VISIBLE TO EVERY AUTHENTICATED USER regardless
        of any permission state.
    (2) This is the UI-tier corroboration of F-074's posture: the
        existence of every Management list endpoint is leaked to
        every reader at the sidebar layer (the tab label "Policies"
        tells a non-admin user that a Policy catalog exists),
        BEFORE they navigate to the route, BEFORE the read fires.
        The sidebar is the FIRST disclosure surface; F-074's
        read-endpoint disclosure is the SECOND.
    (3) The Associations carve-out is asymmetric — the maintainer
        treated user-owner-mapping admin as MORE-PRIVILEGED than
        Owner/Datasource/Collector/Namespace/Tag/Role/Policy admin.
        This is a load-bearing operator-mental-model finding:
        operators reading the sidebar build an "Associations is
        special" mental model that does not match the
        permission-data-model (every Management-tier permission is
        a peer of OWNER_ASSOCIATION_MANAGE in SecurityConstants).
    Cross-link to NEWLY MINTED F-161 (Management Section Top-Level
    Chrome) which carries the full UI-tier finding for the sidebar
    asymmetric visibility behaviour.
