control_summary: |-
  0 of 4 cells PROBED — feature emerged from batch P primary-source
  audit of the deleteOwner + updateOwner sidecars (third-sidecar
  createOwner enriched at batch E). The trinity converged on
  2026-05-20 (batch P) — the user-observable Owner Lifecycle Management
  feature is now ENUMERATED at the controller-method tier with full
  primary-source citations across all three CRUD verbs.

  The HIGHEST-LEVERAGE probe candidates are:
  (a) **Empty-roles destructive UX regression-pin** — PUT /api/owners/{id}
      with roles=[] DELETES all role bindings; assert the destructive
      behaviour AND verify the UI guards against it (which it does
      empirically — the UI always sends the current `roles` list).
      Pin the contract as 'destructive when omitted; honour exists
      only at the UI layer; API consumers must include `roles`
      explicitly'.
  (b) **USER_OWNER_MAPPING safe-rename invariant** — seed a
      user_owner_mapping + PUT /api/owners/{id} with a new name +
      assert the mapping still resolves to the same Owner. The
      structural safety is provable from the FK declaration; the
      regression-pin protects against a future refactor that
      accidentally changes the FK to be by name.
  (c) **Six-sidecar audit-silence regression-pin** — exercise all
      three Owner CRUD verbs + GET /api/activity + assert ZERO
      OWNER_*_CREATED / UPDATED / DELETED events. Pin the current
      audit-silence contract so a refactor adding @ActivityLog
      doesn't silently break compatibility with existing audit-export
      pipelines (which don't expect Owner events).

  Local docker-compose probe stack is sufficient: ODD platform +
  Postgres + two pre-seeded Owners + an OWNER_*-permission-granted
  user. No external auth required.

  Cross-batch correction integrated: createOwner sidecar (batch E)
  bugs_limitations_corner_cases[2] + security.known_security_gaps[2]
  claims that owner.name UNIQUE is non-partial — both SUPERSEDED by
  this batch's V0_0_64 verification. Per LSN-018 the supersede note
  is recorded on the createOwner sidecar via
  `superseded_by: deleteOwner sidecar session-2026-05-20-P`.

  Cross-feature coherence: this feature LIVES INSIDE pillar P-08
  Management & Administration but FEEDS pillar P-09 Security & Access
  Control via the operative authorization mutations. Cross-link
  partners: F-006 (RBAC — the orphan-binding closure on the Owner
  side is POSITIVE case-law contrast to the Policy/Role half), F-011
  (Principal-to-Owner Resolution — the OWNER.NAME rename safety is
  the LOAD-BEARING contrast to the OIDC_USERNAME rename hazard).
