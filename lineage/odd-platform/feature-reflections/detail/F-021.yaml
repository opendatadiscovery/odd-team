      (i) When a user leaves the organization and the admin
          soft-deletes their user-owner mapping, every activity row
          that user ever created appears in the UI as a system event
          (OwnerPojo=null). A forensic review three months later
          cannot tell who edited the dataset description on Q2
          earnings — the username is in the database but invisible
          to the read path.
      (ii) When a user-owner mapping is reassigned (the username is
