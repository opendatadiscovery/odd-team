name: Collector
canonical_in_docs: true
canonical_candidate: false
description: Container of pull adapters plus the runtime around them (main-concepts.md
  verbatim). Authenticated to the platform via a shared-secret bearer token used by
  S2S `IngestionDataEntitiesFilter` on `/ingestion/entities`. Platform-level infrastructure
  (no Owner association). Managed via `/api/collectors/*` endpoints — list, create,
  update, delete, regenerate-token. Token rotation is an in-place UPDATE with no grace
  window.
axes_present:
- controllers
nodes:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
contributors:
- 'CollectorController.regenerateCollectorToken: entities[Collector, Token (40-char
  alphanumeric shared secret), TokenPojo, CollectorDto]; operations[regenerate-collector-token,
  rotate-ingestion-secret, return-plaintext-token]'
evidence:
- regenerateCollectorToken.md:concepts.entities.[Collector, Token, TokenPojo, CollectorDto]
- regenerateCollectorToken.md:concepts.operations
- regenerateCollectorToken.md:concepts.invariants.[0-3]
security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: CONSISTENT
    detail: 'Endpoint IS gated: SecurityConstants.java:135-137 registers `SecurityRule(NO_CONTEXT,
      PUT /api/collectors/{collector_id}/token, COLLECTOR_TOKEN_REGENERATE)`. Permission
      is MANAGEMENT-tier per PolicyPermissionDto.java:58. No @PreAuthorize on controller
      (consistent with the centralised-SECURITY_RULES pattern). Live `/configuration-and-deployment/enable-security/authorization/permissions`
      (verified 200, 2026-05-10) documents COLLECTOR_TOKEN_REGENERATE verbatim. The
      gate is correctly wired — the weakness is what the operation EXPOSES, not whether
      it''s gated.'
  owner_scoping:
    verdict: N/A
    detail: Collector is a global resource — platform-level infrastructure, not data-scoped.
      MANAGEMENT-tier permission gates globally; no per-collector ACL beyond the policy.
  strengths:
  - Gated by COLLECTOR_TOKEN_REGENERATE Permission (MANAGEMENT tier) via SECURITY_RULES
    — declarative authorization (regenerateCollectorToken.md:security.authorization_assertions.[0])
  - Centralised gate declaration consistent with the platform-wide SecurityConstants.SECURITY_RULES
    pattern — no scattered @PreAuthorize
  - Token entropy is 40 alphanumeric chars ≈ 238 bits of input space — adequate length
    for a shared secret
  weaknesses:
  - Token entropy uses `RandomStringUtils.randomAlphanumeric(40)` which delegates
    to ThreadLocalRandom (non-CSPRNG); should use `RandomStringUtils.secure().nextAlphanumeric(40)`
    or explicit SecureRandom (regenerateCollectorToken.md:security.known_security_gaps.[1]
    HIGH)
  - 'Token plaintext returned in response body on rotation — any reverse-proxy / browser-history
    / response-logging middleware records the new credential; no `Cache-Control: no-store`,
    no sensitive-body header (regenerateCollectorToken.md:security.known_security_gaps.[0]
    MEDIUM)'
  - Token stored in plaintext in the TOKEN table — DB read/replica/backup carries
    credentials in the clear; IngestionDataEntitiesFilter.java:55-58 confirms plaintext
    `.equals(...)` check (no hashing layer) (regenerateCollectorToken.md:security.known_security_gaps.[3]
    HIGH)
  - Token rotation not audit-logged — grep for log.* against CollectorController/CollectorServiceImpl/TokenGeneratorImpl/ReactiveTokenRepositoryImpl
    returned zero matches. TOKEN.updated_by column is the only forensic trail but
    is overwritten on next rotation — single-state, not append-only (regenerateCollectorToken.md:security.known_security_gaps.[2]
    HIGH)
  - Under auth.type=DISABLED the gate is bypassed entirely — TokenGeneratorImpl.java:30-31
    falls through to `regenerate(tokenPojo, null)` with NULL updated_by. Any caller
    reaching the platform can rotate any collector's token and receive plaintext (regenerateCollectorToken.md:security.known_security_gaps.[4]
    HIGH in DISABLED deployments)
  - No rotation grace period — in-flight ingestion using old token will 401 the moment
    UPDATE commits (regenerateCollectorToken.md:security.known_security_gaps.[5] HIGH
    operational severity)
  - No rate-limit on rotation — stolen MANAGEMENT-permission session can rotate every
    collector's token in a loop, breaking platform-wide ingestion (regenerateCollectorToken.md:security.known_security_gaps.[6]
    MEDIUM)
  cross_file_inconsistencies:
  - Live `/configuration-and-deployment/enable-security/authentication` enumerates
    S2S auth mode without explaining how its credential is rotated; `/permissions`
    names COLLECTOR_TOKEN_REGENERATE without operational guidance (no rotation grace
    period, plaintext-in-response shape) (regenerateCollectorToken.md:docs_link_semantic.doc_drift_findings.[0])
  contributing_files:
  - regenerateCollectorToken.md
  evidence:
  - regenerateCollectorToken.md:security.known_security_gaps.[0-6]
  - regenerateCollectorToken.md:bugs_limitations_corner_cases.[0-7]
performance_aggregate:
  overall: HIGH
  hot_paths:
  - 'PUT /api/collectors/{collector_id}/token — synchronous from caller''s perspective:
    1 DB SELECT with joins (NAMESPACE + TOKEN), in-memory mutation, 1 DB UPDATE RETURNING.
    2 DB round-trips total. Not on the ingestion hot path. (regenerateCollectorToken.md:performance.hot_paths.[0])'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single-collector PUT — no bulk-rotate endpoint. Rotating N collectors
      makes N requests.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Stateless controller. No locks, no advisory locks. Last-write-wins for
      concurrent rotations on same collector_id — no optimistic locking (no @Version
      column, no WHERE updated_at = :prev).
  strengths:
  - Reactive Mono signature — non-blocking on WebFlux thread
  - Stateless — instances scale horizontally without coordination
  - Minimal resource footprint per call (one CollectorDto + one TokenPojo + projection)
  weaknesses:
  - No bulk-rotate endpoint — rotating all collectors after a credential leak requires
    N HTTP calls (regenerateCollectorToken.md:performance.known_performance_gaps.[0]
    LOW)
  - Concurrent-rotation race produces silently-discarded credentials — operators issuing
    rapid retries may walk away with a token that is not actually the persisted one
    (regenerateCollectorToken.md:performance.known_performance_gaps.[1] LOW)
  cross_file_inconsistencies: []
  contributing_files:
  - regenerateCollectorToken.md
  evidence:
  - regenerateCollectorToken.md:performance.hot_paths
  - regenerateCollectorToken.md:performance.known_performance_gaps.[0,1]
notes: 'Collector is canonical in main-concepts.md ("a container of pull adapters

  plus the runtime around them"). The Token Rotation operation surfaces

  multiple architectural concerns (in-place UPDATE, plaintext storage,

  plaintext-in-response, non-CSPRNG entropy, no audit, no grace period,

  no rate limit) — see also the related "Collector Token" concept entry.

  '
