name: |-
  ToolbarTabs label-vs-URL drift — Catalog/Dictionary/Data Modelling/Master Data labels do not match their destination URLs
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-03
  - P-05
  - P-06
  - P-09
description: |-
  NEW MEDIUM-severity Category F INVARIANT, batch ZJ (2026-05-26) —
  FOUR of the nine tabs in `ToolbarTabs.tsx:34-82` have user-visible
  labels that DO NOT match their destination URL vocabulary. The
  operator clicks a tab labelled X, lands on a URL containing
  string Y, and has no signal that the two refer to the same
  feature.

  **The four drift cases**:

  (a) **Catalog tab -> /search/<id>** (ToolbarTabs.tsx:37-39)
      Label: `t('Catalog')`
      URL: `/search` (then `/search/<searchId>` after thunk dispatch)
      Routes module: `searchRoutes.ts`
      Live doc: 'Search and Filtering' (per
      https://docs.opendatadiscovery.org/features/data-discovery/search)
      Four distinct names for one feature.

  (b) **Dictionary tab -> /termsearch/<id>** (ToolbarTabs.tsx:66-69)
      Label: `t('Dictionary')`
      URL: `/termsearch` (then `/termsearch/<termSearchId>` after
      thunk dispatch)
      Routes module: `termsRoutes.ts`
      Live doc: 'Dictionary terms' (per the features index)
      Three distinct names.

  (c) **Data Modelling tab -> /data-modelling/query-examples**
      (ToolbarTabs.tsx:50-54)
      Label: `t('Data Modelling')`
      URL: `/data-modelling/query-examples` (lands on Query
      Examples specifically, NOT an overview page)
      Routes module: `queryExamplesRoutes.ts`
      `dataModellingPath()` exists but is unused as a tab target.
      The pillar has a second sub-feature (Relationships per
      `dataModelling/relationshipsRoutes.ts`) but the tab is
      hardcoded to land on Query Examples.

  (d) **Master Data tab -> /master-data/lookup-tables**
      (ToolbarTabs.tsx:55-59)
      Label: `t('Master Data')`
      URL: `/master-data/lookup-tables` (Lookup Tables is the only
      current Master Data sub-feature)
      Routes module: `masterDataRoutes.ts`
      `masterDataPath()` does not exist; only `lookupTablesPath()`.
      Master Data has only ONE feature today; the drift is
      TRANSLATES_LEGITIMATELY today but becomes
      TRANSLATES_SILENTLY when a second feature lands.

  **Five additional tabs do NOT drift**:
    - Directory tab (t('Directory') -> `/directory`)
    - Data Quality tab (t('Data Quality') -> `/data-quality`)
    - Management tab (t('Management') -> `/management`)
    - Alerts tab (t('Alerts') -> `/alerts/all` — has the /all
      subscope addition but labels align)
    - Activity tab (t('Activity') -> `/activity?<query>` — labels
      align)

  **The doc-side reinforces the drift** — the live docs at
  https://docs.opendatadiscovery.org/features/data-discovery/search
  (WebFetched 2026-05-26 status 200) explicitly say 'select the
  Catalog tab' to reach the search functionality. The doc and the
  tab label align (Catalog), but the URL the user sees in the
  address bar after clicking is `/search/<uuid>`. Bookmarks adopt
  the URL; deep links shared with colleagues say '/search';
  tutorial documentation citing the URL must explain why the doc
  says 'Catalog' but the URL says 'search'.

  **The Dictionary tab has an EXPLICIT internal code reference to
  the label** at ToolbarTabs.tsx:111
  `if (tabs[idx].name === t('Dictionary'))` — a fragile string-
  equality check between localised strings that works only because
  the natural-keys pattern means `t('Dictionary') === 'Dictionary'`
  in every locale. If a locale ever translates the key (e.g.
  `fr.json: "Dictionary": "Dictionnaire"`), the equality check
  WOULD still work because both sides resolve through the same
  i18next instance — but a code-reviewer reading the call site has
  no way to tell that without tracing the i18next semantics.

  **Fix surfaces** (maintainer-triage):

    (a) **Rename the URL** — e.g. `/catalog` instead of `/search`,
        `/dictionary` instead of `/termsearch`. Breaks deep-linked
        bookmarks (any URL containing `/search/<uuid>` or
        `/termsearch/<id>` shared externally). Migration via
        Spring's HTTP 301 redirect or react-router's
        `<Navigate replace>` at the old paths.

    (b) **Rename the i18n key** — e.g. `t('Catalog')` ->
        `t('Search')`, `t('Dictionary')` -> `t('Term Search')`.
        Single grep across `t('Catalog')|t('Dictionary')` call
        sites (5 total — ToolbarTabs.tsx + 2-3 others) +
        updating en.json + the five other locales. Eliminates
        the label↔URL drift but breaks the alignment with the
        live doc page ('Catalog tab').

    (c) **Document the synonym mapping** — add a 'Terms &
        Aliases' table to `documentation/docs/main-concepts.md`
        explaining 'Catalog (tab label) = Search (URL family) =
        Search and Filtering (feature page)'. Lowest-cost fix;
        does not remove the drift but makes it discoverable.
