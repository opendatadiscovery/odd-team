name: Upsert Internal Description (Markdown)
canonical_in_docs: false
canonical_candidate: true
description: 'PUT /api/dataentities/{id}/description — replace data_entity.internal_description
  with a free-text Markdown body. Side-effects: parses [[ns:term]] mentions and updates
  term_relations; refreshes FTS vector with weight B; toggles data_entity_filled.internal_description_filled;
  emits DESCRIPTION_UPDATED + TERM_ASSIGNMENT_UPDATED activity events. The ''upsert''
  name is MISLEADING — underlying is pure UPDATE with silent no-op on missing entity
  (200 OK, empty body, no 404).'
nodes:
- odd-platform java DataEntityController controller-method:upsertDataEntityInternalDescription
contributing_files:
