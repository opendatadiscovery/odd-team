behaviour: |-
  **HIGH — `listMostPopular`'s outer `.orderBy(field(COUNT_FIELD).desc())` (`ReactiveTagRepositoryImpl.java:158`) has NO secondary ORDER BY clause. When two tags have EQUAL aggregated usage_count, the order between them is determined by PostgreSQL's natural-row-order semantics within the GROUP BY result — practically, this inherits from the CTE's row order, which is `tag.id ASC` per the inner `paginate(...)` (line 148). The absence of a secondary tiebreaker IS the design — but it is NOT pinned by any test, and the implementation-defined PostgreSQL order is the only guarantee.** A future refactor that adds a different ORDER BY (or that changes the underlying CTE's row order via a different join strategy) would silently change the tie-break — potentially observable to operators paginating through equal-count tags.

  **The empirical scenario** (per LSN-019 retrospective):
  - 35 tags, all with EQUAL usage_count (every entity tagged by all 35).
  - `size=30, page=1`: response contains IDs 1..30 in tag.id ASC order (the inner CTE's natural order).
  - Verified empirically 2026-05-20 against demo.oddp.io.

  **Why this is a SEPARATE gap from TEST-GAP-855**:
  - TEST-GAP-855 pins the LSN-019 PRIMARY effect: when N > size, the inner paginate selects the OLDEST `size` tags before counting.
  - **This gap (867)** pins the SECONDARY effect: WHEN N ≤ size (no inner paginate exclusion), but multiple tags have EQUAL counts (a degenerate but real case — every entity tagged by all N tags), the OUTER count-DESC sort has NO tie-break and the result inherits the CTE row order = tag.id ASC.
  - Together they fully characterise the response shape:
    - **N > size**: inner paginate selects OLDEST `size` by tag.id ASC; outer re-orders by count DESC within page (effective when counts differ within page).
    - **N ≤ size with unique counts**: outer count-DESC is effective; result is by count DESC.
    - **N ≤ size with equal counts**: outer count-DESC has no tie-break; result is by tag.id ASC (inherited from the CTE).

  **What the test pins**:
  - At equal counts, the SQL's secondary-sort behavior IS implementation-defined.
  - The current implementation-defined order on PostgreSQL happens to be tag.id ASC.
  - A future refactor that switches the inner CTE join order, adds an EXPLICIT `.orderBy(field(COUNT_FIELD).desc(), TAG.ID.asc())`, or changes the database vendor would CHANGE the observed order.
  - The test forces the maintainer to COORDINATE that change.

  **Operator-visible consequences if the tie-break changes**:
  - **Pagination consistency**: a paged tag list with equal counts could shift across page reloads if the implementation-defined order is not stable across queries (it usually is, but the GUARANTEE is implementation-defined).
  - **Display fidelity**: a tag-cloud showing "Top tags" with equal counts would have an apparent stability that changes when the upstream changes.

  **Why HIGH not MEDIUM**:
  - The implementation-defined tie-break IS load-bearing for the UI's "Top tags" stability across pagination.
  - The absence of a secondary sort is a structural defect waiting to surface (a Postgres minor-version planner change could shift the tie-break observed order).
  - The HIGH rating aligns with the LSN-019 family (PRIMARY at CRITICAL; SECONDARY tie-break gap at HIGH).
