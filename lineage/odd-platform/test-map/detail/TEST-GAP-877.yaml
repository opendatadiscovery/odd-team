proposed_action: |-
  Add `ActivityEmptyPartitionsCountScanCostTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/housekeeping/job/` using Testcontainers + Postgres + `EXPLAIN ANALYZE` introspection. Three test methods:

  1. **`isPartitionEmpty_populatedPartition_pinsSequentialScanCost`** (HEADLINE):
     - Arrange: seed `activity_20240101_20240301` partition with 100K rows.
     - Act: invoke `partitionService.isPartitionEmpty(connection, "activity_20240101_20240301")` AND simultaneously capture `EXPLAIN ANALYZE` of the underlying SQL via `pg_stat_statements` or by intercepting the JDBC.
     - Assert (1): the return value is `false` (correct)
     - Assert (2): the EXPLAIN ANALYZE output contains `Seq Scan on activity_20240101_20240301` AND rows_scanned ≈ 100000 — PIN the sequential-scan cost on populated partitions
     - Comment: a future REFACTOR-NNN that rewrites the query to use EXISTS / LIMIT 1 produces an `Index Only Scan` or `Seq Scan with rows=1` — this test then becomes the regression-pin demonstrating the optimization

  2. **`isPartitionEmpty_actuallyEmptyPartition_returnsTrue_pinHappyPath`** (CONTROL):
     - Arrange: empty partition (0 rows).
     - Assert: returns `true`; `rows_scanned = 0`; cost is bounded.

  3. **`fullHousekeepingCycle_withTenPopulatedPartitions_pinsCumulativeIOCost`** (INTEGRATION):
     - Arrange: 10 past populated partitions + 1 past empty partition + 1 future partition.
     - Act: invoke `housekeepingJobManager.runHousekeepingJob` (or directly `getEmptyPastPartitions`).
     - Assert: the empty partition IS dropped; total rows_scanned across all 10 populated checks = sum of partition sizes; PIN the operational cost.

  After P-013 measures the empirical I/O cost on a production-sized partition, refine the test's assertions. Cross-pair with REFACTOR-NNN to rewrite the query; this test proves the optimization. Cross-pair with DOC-NNN to surface housekeeping cycle I/O profile.
