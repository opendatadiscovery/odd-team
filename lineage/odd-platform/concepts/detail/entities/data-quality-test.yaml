evidence:
- |-
  DataQualityController.md:concepts.entities (the five DTO types + the SLA + severity enums)
- |-
  DataQualityController.md:concepts.operations (the five operation IDs)
- |-
  DataQualityController.md:concepts.invariants.[2] (existsIncludingSoftDeleted precedes every
  read path — explicit preservation of post-soft-delete DQ visibility)
- |-
  DataQualityController.md:implicit_adrs.[4] (aggregator-only pillar invariant: zero test-execution
