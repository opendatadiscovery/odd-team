  - "ReactiveCollectorRepositoryImpl.md says (implicit_adrs.[0]): 'TOKEN.value is the plaintext credential at rest — the SQL-tier implementation of bearer-token authentication for the always-on IngestionDataSourceFilter and the opt-in IngestionDataEntitiesFilter. The decision is consistent across the write path (TokenGeneratorImpl.java:34-42 — RandomStringUtils.randomAlphanumeric(40) written verbatim with no hashing), the storage layer (V0_0_28:4 — value varchar(40) NOT NULL, no UNIQUE), the read path (ReactiveCollectorRepositoryImpl.java:94 — TOKEN.VALUE.eq(token) plaintext equality), and the filter cross-check (IngestionDataEntitiesFilter.java:56 — tokenPojo.getValue().equals(token)).'"
  - "V0_0_28__add_token.sql:1-9 (TOKEN table — `value varchar(40) NOT NULL`; no UNIQUE)"
