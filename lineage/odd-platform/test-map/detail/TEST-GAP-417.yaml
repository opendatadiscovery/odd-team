behaviour: |-
  LSN-017 regression-pin — useEffect dep-array MUST dispatch fetchDataEntityDetails exactly ONCE per mount, not twice. The current dep-array at DataEntityDetails.tsx:58-64 contains 5 elements where the 5th (details.status?.status) is response-derived; once the first fetch lands and Redux populates details.status, the dep-array shifts from [id, false, false, false, undefined] to [id, false, false, false, 'STABLE'] (or other enum), triggering a second identical fetch. Empirically pinned by probe P-004 (xhr_count=2, DB delta=2). Fix is 1 line (remove details.status?.status from dep-array, line 63). Without a regression test, another contributor adding a "re-fetch when status changes" later silently restores LSN-017 behaviour.
