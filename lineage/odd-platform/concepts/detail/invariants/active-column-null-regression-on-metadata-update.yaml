mitigations_unimplemented:
  - |-
    Fix the bug — either:
      (a) At the service layer: load the existing pojo via a
          repository GET, then call `.setActive(existingPojo.getActive())`
          before passing to `.update()` (preserves the prior state).
      (b) At the repository layer: refactor `update` to use a
          partial-update pattern, only including columns the caller
          explicitly set (omits NULL-valued columns from the SET clause).
      (c) Provide a `setActiveAware` constructor / setter on the pojo
          that defaults to TRUE — matching the column's DEFAULT TRUE.
  - |-
    Audit downstream queries for usages of `metadata_field_value.active`
    to gauge the bug's impact. If no consumer filters on `active`, the
    bug is latent (operator-invisible but real); if any consumer does,
    edited rows silently disappear from those queries.
  - |-
    Add regression tests:
      (a) Insert a row (active=TRUE by default);
      (b) Upsert it;
      (c) Assert the post-upsert active column is still TRUE.
