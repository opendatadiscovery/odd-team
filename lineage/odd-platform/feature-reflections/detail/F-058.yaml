- id: H-005
  hypothesis: |-
    The "N lookup tables overall" counter in the H1 reflects the same set of tables
    the list below it shows.
  derivation: |-
    The counter sits directly above the list; an operator reads "counter describes
    the list." Counter and list sharing a set is the implicit page contract.
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      The counter and the list diverge on two independent axes. (a) Cap divergence:
      the counter reads facets.total (the backend count of all tables matching the
      query — LookupTables.tsx:60-62), while the list is capped at 30 by the broken
      InfiniteScroll (H-001). For a >30-table tenant the counter says "250" and the
      list shows 30. (b) Scope divergence: facets.total comes from
      LookupDataSearchServiceImpl.countByState with NO owner-filter, namespace-scope,
      or per-permission filter — it is the GLOBAL population size. So the counter
      describes the whole platform's lookup tables, not "what this user can act on"
      and not "what is in the list."
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: bugs_limitations_corner_cases[4]
        cite: "LookupTables.tsx:60-62 + LookupDataSearchServiceImpl.java:62-68"
        note: "Counter is global, unscoped count — no owner/permission filter."
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: bugs_limitations_corner_cases[1]
        cite: "LookupTablesList.tsx:51-53"
        note: "List capped at 30 (H-001) — counter and list cannot agree above 30."
    operator_visible_failure: |-
      (1) Above 30 tables, the counter (true total) and the list (30) visibly
      disagree — the only operator-visible signal of the H-001 silent cap, but one
      most users never inspect. (2) The counter leaks the global lookup-table
      population to any authenticated user regardless of permissions (a MEDIUM
      information-exposure posture confirmed in security.known_security_gaps[1]) —
      a user who can act on zero tables still learns how many exist platform-wide.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: |-
    A user who lacks lookup-table permissions cannot reach the create flow — the
    "+ Add new" button is hidden for them.
  derivation: |-
    The button is wrapped in <WithPermissions permissionTo={Permission.LOOKUP_TABLE_CREATE}>;
    the doc page presents +Add new as the gated create entry point.
  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |-
      The +Add new button is wrapped in <WithPermissions permissionTo=
      {Permission.LOOKUP_TABLE_CREATE}> (LookupTables.tsx:72-82). WithPermissions reads
      usePermissions().hasAccessTo(LOOKUP_TABLE_CREATE); when the user lacks the
      permission the button is not rendered. This holds identically across all four
      auth modes (DISABLED/LOGIN_FORM/OAUTH2/LDAP) — auth mode only changes how the
      permission set is loaded, not the gate logic. The create endpoint is ALSO gated
      at the wire (POST /api/referencedata/table → LOOKUP_TABLE_CREATE in
      SecurityConstants.SECURITY_RULES), so hiding the button is defence-in-depth, not
      the sole gate.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: stress_findings.auth_gates
        cite: "LookupTables.tsx:72-82 + WithPermissions.tsx:11-32"
        note: "Button gated by hasAccessTo(LOOKUP_TABLE_CREATE); identical across auth modes."
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: security.authorization_assertions[0]
        cite: "LookupTables.tsx:72-82"
        note: "Wire-level gate on POST /api/referencedata/table backs the UI gate."
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: |-
    A user who lacks ALL lookup-table permissions cannot see the page (or its
    contents) at all — the page is permission-gated.
  derivation: |-
    The route is mounted under <WithPermissionsProvider> listing CREATE/UPDATE/DELETE;
    the doc page implies the page is permission-gated by describing the +Add new
    button as the entry point. A reader could reasonably expect the whole page gated.
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      The page renders fully for ANY authenticated user regardless of lookup-table
      permissions. The route-level WithPermissionsProvider lists CREATE/UPDATE/DELETE
      but PermissionProvider does NOT short-circuit rendering — it only passes
      permission CONTEXT to children. So title, counter, search box, and the full
      table list all render for a user with zero LOOKUP_TABLE_* permissions; only the
      +Add new button (and per-row Edit/Delete) are hidden. Read endpoints
      (/api/referencedata/search + /results) carry NO RBAC in SECURITY_RULES (per the
      cross-referenced ReferenceDataController sidecar) — this is the platform's
      documented read-collaborative posture, not an accidental hole.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: security.known_security_gaps[0]
        cite: "LookupTables.tsx:72-82 + PermissionProvider.tsx (no render-gate) + masterDataRoutes sidecar"
        note: "Provider passes context, does not block render; page renders for any authenticated user."
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: security.owner_scoping
        cite: "LookupTables.tsx:60-62 + ReferenceDataController sidecar known_security_gaps[0]"
        note: "Read endpoints have no RBAC — read-collaborative posture is intentional."
    operator_visible_failure: |-
      A user with no lookup-table permissions still sees every table's name,
      description, and namespace, plus the global count. If a deployment expected the
      Master Data section to be permission-walled (a reasonable reading of the docs,
      which describe the gated +Add new flow), that expectation is wrong: viewing is
      open to all authenticated users; only mutation is gated. This is a doc/posture
      gap (the read-collaborative stance is undocumented at this page) rather than a
      code bug — the behaviour matches the platform's intentional posture.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: doc-gap-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: |-
    When an operator edits a lookup table and the namespace field is shown disabled,
    the namespace is not part of the update sent to the server (disabled = not editable
    = not transmitted).
  derivation: |-
    The edit form disables the namespace field on edit (disabled={!!lookupTable}); the
    doc page describes LOOKUP_TABLE_UPDATE as "renaming or editing description" only,
    implying namespace is not updateable; a user reads "disabled field = not sent."
  seed_source: ui-label
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The form types its data as LookupTableFormData (the CREATE shape, which includes
      namespaceName) and submits that SAME shape to the UPDATE endpoint
      (editLookupTable({ lookupTableUpdateFormData: data })). The OpenAPI UPDATE schema
      LookupTableUpdateFormData defines ONLY name + description (components.yaml:3853-3862),
      so namespace_name is sent on the wire on every edit despite the field being
      visually disabled. Whether the server silently discards it (Jackson
      FAIL_ON_UNKNOWN_PROPERTIES=false → 200, field ignored) or strictly rejects it
      (400) is not statically determinable from the chain — it requires running the
      edit against a local instance. This is a DRIFT_INPUT_NAME_VS_IMPLEMENTATION
      (Category-F) the sidecar already flagged PROBE-NEEDED (P-191).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: bugs_limitations_corner_cases[2]
        cite: "LookupTableForm.tsx:49, 60-66, 117-123 + components.yaml:3853-3862"
        note: "CREATE shape submitted to UPDATE endpoint; namespace_name on the wire; disabled field hides it from user."
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: stress_findings.request_inputs (lookupTableUpdateFormData)
        cite: "P-191"
        note: "drift: DRIFT_INPUT_NAME_VS_IMPLEMENTATION; discard-vs-reject is PROBE-NEEDED."
    operator_visible_failure: |-
      Probe-pending, two modes: (a) silent-discard — the disabled namespace field is a
      UI hint, not a data guarantee; an operator inspecting the network tab on edit
      sees namespace_name on the wire while the DB is unchanged (confusing but
      harmless). (b) strict-rejection — every edit returns 400 and renaming a table is
      impossible. The probe decides which; both make the UX-disabled field misleading.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-058-1
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

