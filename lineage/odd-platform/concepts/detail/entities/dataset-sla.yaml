name: Dataset SLA (Green/Yellow/Red aggregate + PNG badge)
canonical_in_docs: true
canonical_candidate: false
description: |-
  Per-dataset aggregate quality trust signal — three values: GREEN | YELLOW | RED.
  Computed deterministically by SLACalculator (an aggregation-based, NOT direct
  severity-to-colour, algorithm — SLACalculator.java:80-100). The SLA encodes
  failure-PATTERN semantics, not a per-test mapping: at-least-one-critical-failed
  → RED, all-majors-failed → RED, some-majors-failed → YELLOW, all-minors-failed
  → YELLOW, no-tests-defined → YELLOW (cautious default), all-passed → GREEN.
  Reclassifying ONE test's severity from Major to Critical can flip the entire
  dataset's colour without any test's pass/fail status changing.

  **TWO endpoints surface the SLA, with DELIBERATELY DISTINCT response shapes**
  (NEW entity, batch 2026-05-20T):
    - GET /api/datasets/{data_entity_id}/sla → image/png byte-array (BI-tool
      embeddable badge). PNG bytes resolved from sla/sla_red.png /
      sla/sla_yellow.png / sla/sla_green.png classpath resources cached at
      bean init via CachingByteArraySLAResourceResolver.java:30-54.
    - GET /api/datasets/{data_entity_id}/sla_report → application/json
      DataSetSLAReport (total/success weights + severity_weights breakdown +
      slaColour + slaRef self-link).

  **Two audiences encoded explicitly**: PNG for BI embed (Confluence, Excel,
  any img-src renderer); JSON for programmatic consumers. The dual-endpoint
  pattern is the architectural shape; merging the two would couple audiences.

  vocabulary_status: codebase-anchored + doc-side-covered (live
  https://docs.opendatadiscovery.org/features/data-quality/sla-statuses WebFetched
  2026-05-20 status 200; the SLA enum and the PNG-vs-JSON distinction are
  partially-described — see canonicalisation candidate
  sla-as-png-vs-jsonsla-report-drift for the HIGH-severity doc misalignment
  surfaced by this batch).
vocabulary_status: codebase-anchored, doc-side-covered-with-drift
