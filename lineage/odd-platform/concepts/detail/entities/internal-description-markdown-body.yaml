- 'DataEntityDescription.md:concepts.invariants[No rehype-sanitize configured
  anywhere in the UI; Permission gating is partial — only Edit affordance gated,
  NEVER content; Response echo is NEVER read back after save; Term-mention regex
  STRICTER than backend regex; Cancel discards in-flight edits via state re-sync;
  Term-resolution is best-effort ASYNC; Markdown wrapper auto-enables spellcheck
  via DOM mutation on hard-coded id]'
axes_present:
- controllers
- openapi_paths
- ui_components
security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  authorization_consistency:
    verdict: CONSISTENT
    detail: 'SecurityRule(DATA_ENTITY, ''/api/dataentities/{id}/description'', PUT,
      DATA_ENTITY_DESCRIPTION_UPDATE) is correctly wired (SecurityConstants.java:194-197),
      DataEntityPermissionExtractor resolves per-entity, supports ''is: dataEntity:owner''
      Policy scope. **Batch J UI clarification**: UI gates the Edit affordance with
      WithPermissions{permissionTo=DATA_ENTITY_DESCRIPTION_UPDATE} but does NOT
      gate the rendered content — partial-gating semantic.'
  owner_scoping:
    verdict: RESPECTS
    detail: Per-entity authorization via DataEntityPermissionExtractor (write side).
      Read side BYPASSES — content is universally visible to any DATA_ENTITY_VIEW
      holder.
  strengths:
  - 'Two-permission split: DATA_ENTITY_DESCRIPTION_UPDATE distinct from DATA_ENTITY_INTERNAL_NAME_UPDATE'
  - Reactive @ReactiveTransactional boundary atomic
  - 'P-009 empirically pinned: script execution blocked by defence-in-depth
    (Chromium HTML-parser policy + React attribute filtering)'
  weaknesses:
  - 'Stored-XSS surface (HIGH): no backend Markdown/HTML sanitisation + UI rehype-raw@6.1.1
    without rehype-sanitize'
  - No length cap on description body (Postgres text unbounded; no @Size on form DTO)
  - DISABLED-mode anonymously reachable wholesale content-injection vector
  - 'Term-linking side effect: DATA_ENTITY_DESCRIPTION_UPDATE bypasses DATA_ENTITY_ADD_TERM
    via [[ns:term]] mentions'
  - '**Batch J — Partial permission gating** (MEDIUM): Edit button gated, content
    unconditional; refactor "simplifying" the cluster could silently break read
    access for non-editors'
  - '**Batch J — Cancel discards in-flight edits with no warn-on-navigate** —
    user data loss on accidental cancel/navigate'
  - '**Batch J — Term-mention regex asymmetry**: UI regex `/\[\[([^:\]]+):([^\]]+)\]\]/g`
    requires non-empty namespace AND non-empty term-name; backend regex
    `\[\[([^:]*?):([^\]]*?)\]\]` allows empty groups. A description like `[[:foo]]`
    is parsed differently across layers.'
performance_aggregate:
  overall: MEDIUM
  weaknesses:
  - No length cap → unbounded heap allocation per call + unbounded FTS-index write
    + unbounded activity-row size
  - FTS rebuild is FULL entity tsvector (re-reads ~8 related tables) on every description
    edit
  - Activity-event payload includes FULL description body TWICE (oldState + newState)
    — N edits of 1MB = 2N MB activity-table growth
  - '**Batch J — Term-resolution N+1 risk**: handleMarkdownChange fires on every
    editor keystroke; for a description with 100 unique unresolved mentions, 100
    parallel HTTP requests issue on first render (memoised but NOT batched)'
notes: |-
  Strengthened in batch 2026-05-19J with DataEntityDescription UI cluster sidecar
  closing the F-004 UI half. The cluster is the canonical write+read path for
  internal_description. Partial-gating semantic is fragile — a refactor that
  wraps the entire cluster in WithPermissions would silently break read access
  for non-editors (a class of regression that would be invisible to the existing
  probe suite which exercises authenticated-writer flows, not authenticated-reader-without-write
  flows).
