behaviour: |-
  **Case-sensitivity asymmetry — `listInternalMetadata` uses case-INSENSITIVE substring; `listByKey` uses case-SENSITIVE exact equality.** Line 48: `nameField.containsIgnoreCase(query)` (substring, case-insensitive ILIKE). Line 65: `METADATA_FIELD.NAME.eq(t.fieldName())` (exact equality, case-sensitive — Postgres default text comparison). **Consequence**: a UI search for 'cost' returns both `cost_centre` and `COST_CENTRE`, but the auto-create-on-miss diff in `MetadataFieldServiceImpl.getOrCreateMetadataFields` treats them as distinct names. A user typing the metadata name with different casing across two entities creates two distinct INTERNAL field rows. The two coexist with different IDs; the dropdown shows both; the platform has no canonicalisation. Same shape as the Tag asymmetry already tracked in the concept catalog. Untested.
