status: ui-incomplete
status_reason: |-
  UI half is at primary source — SearchResultsTabs.tsx + Results.tsx +
  the tab→dispatch chain are all read directly in this batch. The
  BACKEND half (how the `entityClasses` facet with string-sentinel
  'all' / 'my' values is actually interpreted at SearchController.updateFacets
  + how the My-Objects toggle interacts with the FacetStateDto.myObjects
  field — they appear to be TWO separate boolean toggles on the backend
  but ONE tab control on the UI) needs primary-source resolution. Mark
  ui-incomplete pending the backend-tier walk of changeDataEntitySearchFacet
  reducer + updateDataEntitiesSearch thunk.
