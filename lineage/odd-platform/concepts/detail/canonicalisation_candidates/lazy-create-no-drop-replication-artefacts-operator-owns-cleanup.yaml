proposed_canonical: Lazy-create-no-drop replication artefacts (operator owns cleanup)
rationale: 'Cross-cutting invariant triangulated across 2 sidecars in batch C: ActivityTablePartitionManager
  partitions (batch B) + NotificationsProperties replication slot + publication (batch
  C). ODD creates these Postgres-resident artefacts lazily on first use, never drops
  them, and relies on operator manual cleanup. Worth surfacing as a code-side convention
  so future Postgres-resident artefacts inherit consistent shape and operator-facing
  documentation.'
contributing_concepts:
- createPartitionsIfNotExists for activity (and message) partitions
- Lazy CREATE on replication slot + publication
- Live doc explicit operator-cleanup statement
suggested_add_to_docs: false
