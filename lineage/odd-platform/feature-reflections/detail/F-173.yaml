# Active-tab Remove UserOwnerMapping — product-owner reflection

## product_owner_narrative

The **Active associations** tab (Management -> Associations -> Active) is the operator's single place to *undo* a user-to-owner binding. Where the Pending tab triages incoming claims (F-171) and the header "Create association" button binds a user directly (F-172), the Active tab lists every binding that is currently live and gives each row a **Remove** button. Removing a row severs the link between an authenticated principal and the Owner identity they were acting as — which in turn governs what that user can edit, which entities show up in their "My objects" view, and which alerts land in their "My" alerts feed. The audience is the platform operator / steward who holds the owner-relation management permission (per `OwnerAssociationRequestController.md:security` and the P-08 Management pillar, `system-mission.md` P-08).

A user interacts with it by opening the tab, finding the row for the user+owner pair they want to unbind, clicking **Remove**, and confirming in a dialog ("Are you sure you want to remove the association?" / "User X will stop being associated with owner Y" — verbatim from `ActiveAssociationRequest.tsx:77-94`). The list itself is the same `useGetOwnerAssociationRequestList` hook the Pending tab uses, filtered to `status=APPROVED` (per the chain hop-2 evidence + `ownerAssociationRequest.ts:19-39`); the Active-tab semantics are "an APPROVED request whose binding row still exists." Each row shows username, owner name, roles, provider, who last updated the status, and when (`ActiveAssociationRequest.tsx:42-75`).

The working part behind the button is deliberately minimal: `handleDelete` fires `deleteAssociation({ownerId})` carrying **only the ownerId** — no username, no provider — even though the row holds all three (`ActiveAssociationRequest.tsx:10-18, 34-39`, Read this session). That routes through `useRemoveUserOwnerMapping` -> the generated `deleteActiveUserOwnerMapping` client -> `DELETE /api/owners/mapping/{owner_id}`, gated by `OWNER_RELATION_MANAGE` (`SecurityConstants.java:159-162`, per `OwnerAssociationRequestController.md:security`). The service method `OwnerAssociationRequestServiceImpl.deleteActiveUserOwnerMapping` (`OwnerAssociationRequestController.md` op-list L58-59) calls `userOwnerMappingService.deleteActiveUserRelation(ownerId)` -> `ReactiveUserOwnerMappingRepositoryImpl.deleteActiveRelationByOwner(ownerId)`, which is a **soft-delete UPDATE** setting `deleted_at = now()` `WHERE owner_id = ? AND deleted_at IS NULL` (`ReactiveUserOwnerMappingRepositoryImpl.md:operations` L65-74). The ownerId-only payload is unambiguous in practice because the DB carries a partial unique index `unique_deleted_at_per_owner ON user_owner_mapping(owner_id) WHERE deleted_at IS NULL` — there is at most ONE active mapping per owner at any time (`ReactiveUserOwnerMappingRepositoryImpl.md:concepts.entities` + `:invariants`).

This feature is the teardown end of an integration triangle: it reverses all three create branches — the self-request-then-approve flow (F-075-A), the DIRECT_OWNER_SYNC auto-approve (F-075-B), and the admin direct-bind (F-172). Its downstream blast radius lands in other pillars: after the unbind, the same user's owner-scoped reads collapse — Activity "My objects" goes silent-empty, Alerts "My" goes silent-empty (F-064), and any RBAC permissions the user held through that Owner's Role bundles disappear (F-006, F-011). The mapping row is the load-bearing primitive for `AuthIdentityProviderImpl.fetchAssociatedOwner` and every owner-scoped read in the platform (`ReactiveUserOwnerMappingRepositoryImpl.md:upstream_callers`).

In a demo, a senior PO would highlight five things: (1) the Remove sits behind a confirmation dialog — a consistent destructive-op posture across the OwnerAssociations subtree, unlike the Owners CRUD subtree; (2) the dialog explains the *local* effect but not the *downstream* one — the user whose binding is removed gets no warning, and the operator gets no in-product checklist of what will go dark; (3) there is no bulk Remove — decommissioning a departing team member across many owners is one click + one confirm per row; (4) the binding-removal leaves no audit footprint — the activity log has events for created/approved/declined but none for removed; and (5) the permission that lights up the button is not the permission the backend checks — a real operator trap.

