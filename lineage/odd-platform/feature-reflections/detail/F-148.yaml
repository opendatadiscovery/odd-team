      - sidecar: "(WebFetch)"
        section: "live doc data-discovery/search"
        cite: "https://docs.opendatadiscovery.org/features/data-discovery/search"
        note: "doc describes My Objects as the authenticated user's owned subset (accurate for result list)"
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional
    note: |-
      CONFIRMED-but-UNTESTED. The owner-scoping of the My Objects result list
      has no Playwright test (the My Objects tab is never clicked in any spec).
      Pairs with H-002's demand; this is the user-facing (result-list) half,
      H-002 is the wire (myObjects-boolean) half. One functional test can cover
      both: click My Objects → assert only owned entities listed AND PUT payload
      carries myObjects:true.

