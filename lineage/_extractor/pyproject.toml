[project]
name = "lineage-extractor"
version = "0.1.0"
description = "Cross-pillar code-lineage extractor for the ODD workspace. Tree-sitter based; produces JSONL nodes/edges, YAML manifests, and Markdown rollups per scanned repo."
requires-python = ">=3.10"
authors = [
    { name = "ODD Team" },
]
readme = "../README.md"

dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "click>=8.1",
    "ruamel.yaml>=0.18",
]

[project.scripts]
lineage-extractor = "lineage_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_extractor"]

[tool.uv]
package = true
