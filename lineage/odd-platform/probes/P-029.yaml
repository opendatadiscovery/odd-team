# P-029 — getPopularTagList degenerate page/size HTTP-status pinning

arrange:
  - kind: docker-compose-up

  # A small, well-known tag directory so the page/size arithmetic is the only
  # variable. 5 tags, no relations needed (usage count is irrelevant to the
  # OFFSET/LIMIT boundary being tested).
  - kind: sql
    query: |
      INSERT INTO tag (id, name, important, created_at, updated_at)
      SELECT 1100 + gs, 'p029_tag_' || lpad((1100 + gs)::text, 4, '0'), false, NOW(), NOW()
      FROM generate_series(0, 4) AS gs
      ON CONFLICT (id) DO NOTHING

  # Sanity: confirm exactly 5 probe tags are present before exercising the API.
  - kind: sql
    query: |
      SELECT COUNT(*) AS probe_tag_count
      FROM tag
      WHERE id BETWEEN 1100 AND 1104
        AND deleted_at IS NULL

act:
  # Case 1 — page=0: OFFSET = (0-1)*size = -size. Expect a SQL-error-driven 5xx.
  - kind: rest
    method: GET
    path: /api/tags?page=0&size=30
    capture_as: page_zero_response

  # Case 2 — page=-1: OFFSET = (-1-1)*size = -2*size. Expect a SQL-error-driven 5xx.
  - kind: rest
    method: GET
    path: /api/tags?page=-1&size=30
    capture_as: page_negative_response

  # Case 3 — size=0: LIMIT 0. Expect a valid 200 with an empty items list.
  - kind: rest
    method: GET
    path: /api/tags?page=1&size=0
    capture_as: size_zero_response

  # Case 4 — size=-1: LIMIT -1. Expect a SQL-error-driven 5xx.
  - kind: rest
    method: GET
    path: /api/tags?page=1&size=-1
    capture_as: size_negative_response

observe:
  - kind: http-status
    from: page_zero_response
    capture_as: page_zero_status

  - kind: http-status
    from: page_negative_response
    capture_as: page_negative_status

  - kind: http-status
    from: size_zero_response
    capture_as: size_zero_status

  - kind: http-status
    from: size_negative_response
    capture_as: size_negative_status

  # For the size=0 case, also capture the body so the empty-page contract
  # (empty items + a correct total) can be asserted.
  - kind: jsonpath
    from: size_zero_response_body
    path: "$.items"
    capture_as: size_zero_items

  - kind: jsonpath
    from: size_zero_response_body
    path: "$.pageInfo.total"
    capture_as: size_zero_total

assert:
  # HYPOTHESIS (current un-validated-input state). If any assertion FAILS,
  # the methodology's static trace was wrong about the surfaced status and
  # the sidecar's stress_findings.tunables must be corrected to the measured
  # value. If they all PASS, the PROBE-NEEDED entries flip to PROBE-VERIFIED.
  - "page_zero_status >= 500"          # negative OFFSET -> PostgreSQL SQL error
  - "page_negative_status >= 500"      # negative OFFSET -> PostgreSQL SQL error
  - "size_negative_status >= 500"      # negative LIMIT  -> PostgreSQL SQL error

  # size=0 is a VALID query (LIMIT 0): a clean empty page, not an error.
  - "size_zero_status == 200"
  - "len(size_zero_items) == 0"
  - "size_zero_total >= 5"             # pageInfo.total reflects the real directory

cleanup:
  - kind: sql
    query: |
      DELETE FROM tag WHERE id BETWEEN 1100 AND 1104

  - kind: docker-compose-down
    destroy_volumes: true

