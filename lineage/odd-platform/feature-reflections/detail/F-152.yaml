# Term Linked-Terms Tab — product-owner reflection

## product_owner_narrative

The **Linked-Terms tab** is one of the reverse-lookup surfaces of the Business Glossary (pillar P-06, "operator-curated term entities … link terms to each other"; `system-mission.md:184-186`). A user who has opened a Term's detail page (say `finance/Customer`) and switches to the "Linked terms" tab expects to see, paginated, every OTHER term that has been linked to this one — `finance/Account`, `finance/Invoice`, and so on — so they can navigate the glossary's term-to-term graph from either end (per the pillar's "reverse-look-up every entity tied to a Term" primary action, and the chain's `terminal_side_effect`: "every Term whose id appears in `term_to_term.linked_term_id` matching the current `term_id` surfaces here", `feature-flows/detail/F-152.yaml:57-62`).

The user reaches the tab at the route `/terms/:termId/linked-terms`, which renders `LinkedTermsList` (`LinkedTermsList.tsx:15-100`). The component fires the tanstack-query infinite hook `useGetTermLinkedTerms({termId, size: 50, query})` (`LinkedTermsList.tsx:28-32`), which calls `termApi.getTermLinkedTerms({page, size, termId, query})` (UI hook `terms.ts:75-84`) → the HTTP operation `GET /api/terms/{term_id}/term` handled by `TermController.getTermLinkedTerms` (`TermController.java:121-127`) → `TermServiceImpl.listByTerm` (`TermServiceImpl.java:281`) → `ReactiveTermRepositoryImpl.listByTerm` (`ReactiveTermRepositoryImpl.java:457-499`). The user sees a two-column table — **Name** and **Namespace** (`LinkedTermsList.tsx:52-59`) — with a search box above it and infinite-scroll below.

The working parts a product owner would demo: (1) a **search box** that filters the linked-terms list by name; (2) **infinite scroll** that auto-loads the next 50 rows as the user scrolls; (3) an **empty state** for terms with no links; (4) an **error page** when the fetch fails. In practice every one of these four parts is defective — and the most fundamental defect is that the endpoint backing the whole tab does not return successfully at all. The maintainer's own integration-test build-out recorded F-152 as **non-viable to test** because `GET /api/terms/{id}/term` returns 500/405 and "the tab page also hangs on the 500" (`integration-tests/PHASE3-BUILDOUT.md:298-300`). That is the headline: the reverse-lookup the tab promises does not render.

This feature shares a pillar and a parent component (`TermDetailsRoutes`) with three sibling reverse-lookup surfaces — Linked Entities (term→data-entity, F-002/F-153, the IT-033 GREEN path), Linked Columns (term→dataset-field, F-153), and Query Examples (F-155, IT-034 GREEN). The dual-surface relationship with F-151 matters to the user: the Overview tab carries a `TermLinkedTerms` mini-panel WITH Add/Delete affordances, while THIS tab shows the same data with search but NO manage affordances (`feature-flows/detail/F-152.yaml:140-145`; PLT-058 Defect 3). A user who learns "add a linked term" on Overview cannot do it on the tab where they go to browse.

Edge cases a product owner would flag in a demo: a Term with **51+ linked terms** (does page 2 ever load?); a Term whose linked term was later **deleted** (does the deleted term still appear?); the **error flash** on initial mount before the first fetch completes; and the fact that, because the backend at `TermController.addLinkedTermToTerm`/`deleteLinkedTermFromTerm` has **no SecurityRule** (`TermController.java:237-249`; DOC-033), any authenticated user can have shaped this graph — so the reverse-lookup is a read-collaborative window onto an unguarded write surface.

