  - odd-platform-ui/src/components/DataEntityDetails/Lineage/DEGLineage/components/DEGLineageControls/DEGLineageControls.tsx:21-27,42-48
  - odd-platform-ui/src/components/DataEntityDetails/Lineage/HierarchyLineage/ZoomableLineage/LineageControls/LineageControls.tsx:50-54,96-102
  - odd-platform-ui/src/components/DataEntityDetails/Lineage/DEGLineage/DEGLineageLayouter/DEGLineageLayouter.tsx:39-56
  - odd-platform-ui/src/components/DataEntityDetails/Lineage/HierarchyLineage/lineageLib/LineageContext/LineageProvider.tsx:53-56
contributing_nodes:
  - node_id: odd-platform ts react-component:DEGLineageControls
    role: ui-control-deg
    sidecar: unresolved
    note: |-
      DEGLineageControls.tsx:21-27 — handleViewChange sets `full` query param
      AND `setIsLayouted(false)`, forcing the layout engine to RERUN (line 24).
      The DEG-subtree treats Compact/Full as a layout-changing decision —
      not just a node-shape decision — because the DEG layout (elkjs/dagre)
      packs nodes by their actual measured heights from the `nodesRefsById`
      ref tree. Switching modes invalidates measured heights → re-measure
      → re-layout → re-render.
  - node_id: odd-platform ts react-component:DEGLineageLayouter
    role: ui-layout-engine-deg
    sidecar: unresolved
    note: |-
      DEGLineageLayouter.tsx:39-56 — useLayoutEffect runs `layoutDEGLineage`
      with `nodesWithSizes` carrying `fullView: full` per node. The hidden
      ref-tree (lines 60-71) mounts every Node twice — once as `hidden` for
      measurement, once visible after layout — to get true heights.
      Compact mode hides Source/Space rows (Node.tsx:62-71 — gated by
      `fullView`); Full mode shows them. Layout cost is O(N) per re-layout.
      BUG: useLayoutEffect deps array is `[]` (line 56) — the effect runs
      ONLY ONCE on mount. The `setIsLayouted(false)` from DEGLineageControls
      re-mounts the layouter via the conditional at DEGLineage.tsx:29-36
      so layout fires fresh each toggle, but the empty deps array is a
      latent bug for any non-mount-driven re-layout trigger.
  - node_id: odd-platform ts react-component:LineageControls (HierarchyLineage)
    role: ui-control-hierarchy
    sidecar: unresolved
    note: |-
      LineageControls.tsx:50-54 — handleViewChange ONLY sets the `full`
      query param. NO layout re-trigger. The hierarchy uses d3-hierarchy +
      visx Tree which lays out by `nodeSize` (computed by LineageProvider).
      Compact mode produces a node WITHOUT ODDRN block (Info.tsx:46-56);
      Full mode includes it. The d3-hierarchy layout treats node sizes as
      static across renders — switching mode RE-RENDERS but does NOT
      re-trigger the tree layout. Visual consequence — depending on node
      count, mode switch may produce overlap on dense graphs because
      nodeSize changes but x/y positions don't.
  - node_id: odd-platform ts react-component:LineageProvider
    role: ui-node-size-provider-hierarchy
    sidecar: unresolved
    note: |-
      LineageProvider.tsx:53-56 — `nodeSize` is `useMemo`d on
      `[full, titleHeight, oddrnHeight]`. Compact mode shrinks `nodeSize`
      vertically. But the providerValue useMemo at line 58-68 has deps
      `[full, fn, renderedLinks, highLightedLinks]` — MISSING
      `titleHeight` and `oddrnHeight` (LSN-017-family dep array bug —
      intermediate memo outputs not propagated to the consumer-facing
      value). On rapid font/data churn, `nodeSize` updates but
      providerValue's identity DOES NOT (the Context consumers get the
      old `nodeSize` ref by closure). Latent staleness window.
  - node_id: odd-platform ts react-component:Info (HierarchyLineage)
    role: ui-node-content-renderer-hierarchy
    sidecar: unresolved
    note: |-
      Info.tsx:46-56 — Compact mode (full=false) AND missing externalName
      → "No Information" placeholder. Compact mode WITH externalName →
      ODDRN-only block (lines 146-166). Full mode → Space/Source labels +
      DEG-Items button. The DEG-Items inline button (lines 120-141) is
      gated by `full && externalName` AND `nodesRelatedWithDEG?.length > 0`
      — Compact mode HIDES the DEG-membership expansion entry point
      (the GroupedEntitiesListModal opener) → operator in Compact mode
      cannot see which DEGs a node belongs to.
