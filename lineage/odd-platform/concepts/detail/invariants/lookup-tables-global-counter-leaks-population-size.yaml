mitigations_unimplemented:
  - |-
    Fix surface 1 (preferred) — scope countByState to owner_id
    filter; UI binds the counter to the user's count. Backend
    change + UI change. Aligns with strict-isolation deployments.
  - |-
    Fix surface 2 (UI toggle) — affordance to scope the counter
    between global / per-user. Operator-visible choice.
  - |-
    Fix surface 3 (doc-only) — document the read-collaborative
    posture on the live master-data-management doc page. LOW-cost
    compliance fix.
  - |-
    Fix surface 4 (cosmetic) — remove the counter entirely.
    Plugs the leak; loses the operator's overview signal.
notes: |-
  NEW invariant captured in batch ZL (2026-05-26) FINAL refresh.
  This is one instance of the broader read-collaborative posture
  (system-mission.md line 267); recorded as a dedicated
  invariant because the counter MAKES THE STANCE VISIBLE in a
  way the table list does not. The list shows N rows; the
  counter says 'overall N+M' so the user learns exactly how
  many rows they cannot see (or can see — depending on the
  deployment's read-isolation model).

  Cross-batch follow-up: enumerate every 'X items overall'
  H1 counter across the SPA. Each is a candidate for the same
  shape-of-leak. Grep for `lookup tables overall` /
  `data entities overall` / `users overall` etc. in
  odd-platform-ui/src locale files.
