  name: "alertWithPIIDatasetName_fullPayloadToEveryChannel_noRedactionHook"
evidence:
  - |-
    NotificationsDispatcher.md says: 'AlertNotificationMessage carries dataEntity.{id,name,dataSourceName,namespaceName,owners[]} + downstream[] lineage entities. The Slack channel (corporate workspace, potentially many viewers), the webhook (operator-defined URL, security posture unknown to ODD), and the email (inbox security varies) all receive the same payload.'
  - "AlertNotificationMessageProcessor.java:24-30 (notificationMessage passed verbatim to every sender)"
  - "AlertNotificationMessageTranslator.java:73-83 (full DB-row payload populated)"
  - "SlackNotificationSender.java:40-49 + WebhookNotificationSender.java:18-23 + EmailNotificationSender.java:60-89 (each receives the same AlertNotificationMessage)"
