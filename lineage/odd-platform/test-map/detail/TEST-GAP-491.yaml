behaviour: |-
  META trap — @Profile("!integration-test") on ActivityAspect means integration tests cannot catch missing-activity-emission regressions for an entire class of write paths. ActivityAspect.java:23-24 declares `@Aspect @Profile("!integration-test")` — the AOP bean is disabled in the `integration-test` Spring profile. Every existing integration test runs under that profile (DataEntityDomainsTest, DataEntityServiceTest, etc.). Consequence: an integration test asserting 'after upsertTags, the activity table has a new row' CANNOT VERIFY the @ActivityLog wiring — the AOP is silent, no row is written, the test would (incorrectly) suggest the annotation is broken. Conversely, tests asserting 'after addDataEntityToDEG, NO row is added' (the forensic-silence pin from TEST-GAP-490) cannot distinguish 'no @ActivityLog' (the real condition) from 'AOP disabled by profile'. This META trap means: (a) every existing integration test that uses the activity feed is testing the WRONG thing or is implicitly broken; (b) the @ActivityLog contract is only testable via a Mockito unit test that intercepts the aspect manually OR via a Spring test that activates a non-integration-test profile; (c) ANY new @ActivityLog wiring (or removal) lands in production with ZERO regression-test coverage — the AOP silently disabled in the test surface. Cross-pillar P-07 (Activity Feed is broken at the test layer), P-09 (Authorization cannot be audited from test surface), P-01+P-06 (every entity-mutation surface inherits the bug). The trap is INVISIBLE — there is no compile-time signal, no test-failure signal; the wrong things just pass. Test-mapper-level META finding. CRITICAL because (a) it invalidates the implied-coverage of a CLASS of behaviours, (b) it co-locates with the forensic-silence concerns of TEST-GAP-490 + TEST-GAP-487, (c) cross-pillar — every controller write path inherits.
