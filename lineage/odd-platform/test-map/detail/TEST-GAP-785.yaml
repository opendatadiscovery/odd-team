proposed_action: |-
  Add `R2DBCCustomPoolSchemaInjectionContractTest`. Four test methods:

  1. `customPool_defaultConfigAppendsSchemaQueryParam_pinsContract` — `@SpringBootTest` default; reflect on `customConnectionPool`'s options; assert URL ends with `?schema=lookup_tables_schema`.
  2. `customPool_operatorProvidedUrlWithoutSchema_appendsSchemaQueryParam` — `spring.custom-datasource.url=jdbc:postgresql://host:5432/db` (no schema); assert URL ends with `?schema=lookup_tables_schema`.
  3. `customPool_operatorProvidedSchemaSilentlyOverridden_pinsSilentRewrite` — `spring.custom-datasource.url=jdbc:postgresql://host:5432/db?schema=other`; assert URL contains BOTH `schema=other` AND `schema=lookup_tables_schema`; PINS the silent-override surface.
  4. `schemaConstants_threeLocationsAlign_pinsDriftDetection` — assert `R2DBCConfiguration.VALUE_PART_FOR_CUSTOM_DB_URL` (Java reflection) == `ReferenceDataRepositoryImpl.SCHEMA_NAME` == the literal in V0_0_86 SQL (resource-file read). Catches drift in any single location.

  Pair with: (a) REFACTOR-NNN — extract to `SchemaConstants.java` with a single source of truth; (b) DOC-GAP-NNN — live docs MUST mention the rewrite.
