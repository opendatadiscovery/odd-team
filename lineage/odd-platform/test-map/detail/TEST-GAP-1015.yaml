proposed_action: |-
  CLI helper + jest test pair:
  (a) odd-platform-ui/scripts/locale-parity.ts — walks the six locale
  files, takes en.json as the reference, computes for each other
  locale: missing-keys (in en.json but absent in target) and
  extra-keys (in target but absent from en.json). Reports both.
  (b) locale-parity.test.ts — asserts both lists are empty for every
  non-English locale.
  Wire as a `pnpm i18n:locale-parity` script + CI step.
  Fix per missing key: add the translated entry (or the English
  literal as a placeholder + a CONTRIBUTING.md note) to the missing
  locale. The test pins the contract that all six locales hold the
  same key set.
