#     4-sidecar triangulated. Recipient list outside POJO (partial-home).
#   - DataCollaborationProperties — Slack collaboration partial config POJO.
#     PARTIAL-HOME: binds 3 of 7 datacollaboration.* keys; other 4 are
#     @Value-scattered (enabled, slack-oauth-token, message-partition-period).
#     Advisory-lock-IDs (sender=120, receiver=110) operator-tunable.
#   - HousekeepingTTLProperties — NEW operational concept. Three TTL fields
#     (resolved_alerts_days, search_facets_days, data_entity_delete_days) all
#     defaulted to 30 days. Crucially: NO activity-retention field, NO
#     message-retention field. CONFIRMS REFACTOR-085 from a second angle —
#     time-based retention for activity + message tables does not exist
#     anywhere in the codebase. AlertHousekeepingJob has a documented jOOQ
