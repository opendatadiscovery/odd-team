name: |-
  NAMESPACE_CREATE side-door confirmed at 4 sister services (Term + DataSource + Collector + DataEntityGroup) — cross-pillar getOrCreate pattern closed at batch W
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-06
  - P-08
  - P-09
description: |-
  STRENGTHENED INVARIANT, batch 2026-05-20W — STRENGTHENS the existing
  namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths
  invariant by confirming the NAMESPACE_CREATE side-door pattern at
  FOUR distinct sister services (not just TermController) PLUS the
  NamespaceController class-level controller-tier evidence of the
  defended-side. The cross-pillar pattern is now fully enumerated;
  the architectural class (getOrCreate-as-side-door for *_CREATE
  permission) is multi-service confirmed.

  THE EXPANDED ENUMERATION — 4 sister services confirmed at batch W:

    Service 1 — TermServiceImpl (batch K + batch U — EXISTING):
      TermServiceImpl.createTerm (TermServiceImpl.java:101-117) and
      TermServiceImpl.updateTerm (TermServiceImpl.java:119-145)
      both invoke namespaceService.getOrCreate(formData.getNamespaceName())
      at lines 103 and 138 respectively.
      Endpoints: POST /api/terms (gated by TERM_CREATE),
                 PUT /api/terms/{term_id} (gated by TERM_UPDATE).
      Side-door grants: TERM_CREATE / TERM_UPDATE implicitly grant
      NAMESPACE_CREATE.

    Service 2 — DataSourceServiceImpl (batch W primary source, NEW
    THIS BATCH):
      DataSourceServiceImpl.create (line 52) at line 57 calls
      `if (StringUtils.isNotEmpty(form.getNamespaceName())) {
       namespaceService.getOrCreate(form.getNamespaceName())... }`.
      DataSourceServiceImpl.update (line 68) at line 75 calls
      the same.
      Endpoints: POST /api/datasources (gated by DATA_SOURCE_CREATE),
                 PUT /api/datasources/{id} (gated by DATA_SOURCE_UPDATE).
      Side-door grants: DATA_SOURCE_CREATE / DATA_SOURCE_UPDATE
      implicitly grant NAMESPACE_CREATE.

    Service 3 — CollectorServiceImpl (batch W primary source, NEW
    THIS BATCH):
      CollectorServiceImpl.create (CollectorServiceImpl.java:37-48)
      at line 43 — invokes namespaceService.getOrCreate when
      CollectorFormData.namespaceName is non-empty.
      CollectorServiceImpl.update (CollectorServiceImpl.java:50-69)
      at line 57 — same pattern on update.
      Endpoints: POST /api/collectors (gated by COLLECTOR_CREATE),
                 PUT /api/collectors/{id} (gated by COLLECTOR_UPDATE).
      Side-door grants: COLLECTOR_CREATE / COLLECTOR_UPDATE
      implicitly grant NAMESPACE_CREATE.

    Service 4 — DataEntityGroupServiceImpl (batch W primary source,
    confirmed VIA NamespaceController batch W bugs):
      DataEntityGroupServiceImpl.createDataEntityGroup (line 65) +
      .updateDEG (line 84) invoke namespaceService.getOrCreate.
      Endpoints: POST /api/dataentitygroups (gated by
                 DATA_ENTITY_GROUP_CREATE),
                 PUT /api/dataentitygroups/{id} (gated by
                 DATA_ENTITY_GROUP_UPDATE).
      Side-door grants: DATA_ENTITY_GROUP_CREATE /
      DATA_ENTITY_GROUP_UPDATE implicitly grant NAMESPACE_CREATE.

  THE FRONT-DOOR — NamespaceController (batch W primary source):

    NamespaceController.createNamespace (POST /api/namespaces) is
    the canonical 'dedicated' creation endpoint, gated by
    NAMESPACE_CREATE at SecurityConstants.java:98-102. This is the
    FRONT-DOOR; the four side-doors above bypass this gate entirely.

    NamespaceController batch W confirms the front-door:
    concepts.invariants.[1] — 'Authorization is enforced ONLY at
    the /api/namespaces[...] path; the side-door creation path via
    namespaceService.getOrCreate(name) exposed through 4 OTHER
    services (TermServiceImpl, DataSourceServiceImpl,
    CollectorServiceImpl, DataEntityGroupServiceImpl) bypasses
    NAMESPACE_CREATE entirely.'

    The controller-class sidecar itself explicitly enumerates the
    side-door pattern at the front-door's defence — making the
    pattern visible from BOTH sides of the architecture.

  THE COMPLETE BYPASS PICTURE — what a permission audit must consider:

    For each operator who is granted ANY of the following permissions,
    they implicitly hold NAMESPACE_CREATE:
      - TERM_CREATE / TERM_UPDATE
      - DATA_SOURCE_CREATE / DATA_SOURCE_UPDATE
      - COLLECTOR_CREATE / COLLECTOR_UPDATE
      - DATA_ENTITY_GROUP_CREATE / DATA_ENTITY_GROUP_UPDATE

    The 8 MANAGEMENT-tier permissions form an implicit superset of
    NAMESPACE_CREATE. An operator authoring an RBAC policy that
    'gives data-engineering team TERM_CREATE on namespace=X' EXPECTS
    the team can only author terms inside namespace X. The reality:
    the team can also create new namespaces called 'finance' or
    'compliance' or whatever they want — without holding
    NAMESPACE_CREATE.

  THE COMPOUND WITH CROSS-NAMESPACE-TERM-POLLUTION (cross-link):

    Combined with the f-002-cross-namespace-term-pollution-ui-surface
    invariant (which captures the symmetric bug on the UI tier —
    Dictionary tab renders all namespaces), the namespace side-door
    AMPLIFIES the cross-namespace pollution:
      - A user with TERM_CREATE on namespace X creates a NEW
        namespace Y via the side-door.
      - The new namespace Y is visible to every other user via the
        Dictionary tab.
      - Terms created in namespace Y inherit the user's
        TERM_CREATE-on-namespace-X scope (the resource extractor
        is namespace-scoped); the user can author terms in their
        OWN newly-minted namespace.
      - The new namespace appears alongside operator-curated
        namespaces; no UI distinction marks it as user-side-door
        creation.

  THE COMPOUND WITH PERMISSION-BYPASS-VIA-OWNER-AUTO-CREATE (cross-link):

    The 4-service pattern at batch W parallels the OwnerController
    batch H finding (permission-bypass-via-owner-auto-create-side-door-write-path).
    Two distinct architectural classes:
      Class A (getOrCreate at the writing service): TermServiceImpl
              + DataSourceServiceImpl + CollectorServiceImpl +
              DataEntityGroupServiceImpl — the 4 confirmed.
      Class B (owner auto-create at the binding controller):
              OwnerController.createOwner side-door (REFACTOR-222
              batch H).

    Both classes share the architectural principle: the dedicated
    *_CREATE permission is bypassable via a parent endpoint whose
    own permission gates a different concept (binding, linking,
    grouping) but whose side-effect creates the dedicated entity.

  THE OUTSTANDING ENUMERATION — *_CREATE permissions yet to
  verify (cross-pillar audit follow-up):

    From the master invariant + batch W's confirmation, the
    pattern is established for:
      DATA_ENTITY_CREATE - RESPECTED (the ingestion pipeline path)
      OWNER_CREATE - BYPASSED (REFACTOR-222 OwnerController side-door)
      TAG_CREATE - BYPASSED (via DATA_ENTITY_TAGS_UPDATE + TERM_TAGS_UPDATE
                  + DATASET_FIELD_TAGS_UPDATE + S2S — batch W
                  getpopulartaglist-open-read invariant)
      NAMESPACE_CREATE - BYPASSED (via TERM + DATA_SOURCE + COLLECTOR +
                        DATA_ENTITY_GROUP — THIS INVARIANT)

    Yet to verify:
      QUERY_EXAMPLE_CREATE — need to check whether any service
                              has getOrCreate-shaped path
      POLICY_CREATE / ROLE_CREATE — likely RESPECTED (no
                                    getOrCreate-shape on RBAC
                                    entities; per batch H + N
                                    primary sources)
      ALERT_*_HALT — likely RESPECTED (alert-config is per-entity
                     scope)
      DATASET_FIELD_LABEL_UPDATE / DATASET_FIELD_INTERNAL_NAME_UPDATE —
                     label creation is a separate side-channel
                     (per batch V); verify whether labels are
                     getOrCreate-side-door class

    A FULL cross-pillar audit batch enumerating every service-tier
    getOrCreate call + the dedicated *_CREATE permission it
    bypasses would close the cross-pillar pattern. CURRENT estimate:
    4 confirmed bypassed + 1 RESPECTED + 4 yet-to-verify.

  SEVERITY MEDIUM — same as the master invariant; the side-door is
  cross-pillar, doc-side silent, operator-policy-authoring
  inverted from doc framing.

