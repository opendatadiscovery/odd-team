note: |-
  Graduated 2026-05-26 from SHB-046. F-026 anchors per-table operations
  (RBAC / XSS / cross-table-jump); F-058 anchors the LISTING surface (counter
  + search + scroll + virtualisation). The two features cover distinct
  failure modes of the same pillar. The listing surface conceptually
  warrants its own feature because the failure mode (silent truncation) is
  invisible at the catalog level while F-026's failures are visible at the
  per-table operation level. Both belong to P-03 Master Data Management.

  A grep sweep across the SPA codebase for every scrollableTarget="<id>"
  pair would enumerate similar copy-paste regressions; if found, this
  thread's bug class extends across pillars and would warrant a methodology
  case-law entry (LSN-NNN — "copy-paste DOM id regression in InfiniteScroll
  pairs"). Out of scope for graduation; recorded as next step on the
  shoebox thread.
