  sme_consultation_recommended: true
  sme_consultation_question: "Do data-catalog operators (DataHub / Amundsen / OpenMetadata) consider a deletion-audit/metric surface a load-bearing default for a retention subsystem, or an enterprise add-on?"
  sme_consultation_archetype: implicit-requirements
  validation:
    verdict: contradicted
    actual_behavior: |
      No observability exists. Per-job logging is `log.debug` (default-off in
      production); manager-level success is `log.debug`, failure is `log.error`.
