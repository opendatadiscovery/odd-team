behaviour: |-
  **The 9 toolbar tabs render UNCONDITIONALLY regardless of backend
  feature-flag state. Specifically: Data Modelling (Query Examples) is
  a Data Collaboration feature gated by
  `Feature.DATA_COLLABORATION` (`datacollaboration.enabled`, default
  FALSE) on its destination pages — but the TAB ENTRYPOINT at
  `ToolbarTabs.tsx:50-54` is NOT wrapped in `<WithFeature
  featureName={Feature.DATA_COLLABORATION}>`.**

  Under the default deployment (`datacollaboration.enabled=false`),
  clicking the Data Modelling tab navigates to
  `/data-modelling/query-examples` but the user sees an empty
  / non-functional surface — the WithFeature wrappers downstream
  (`Message.tsx:59`, `MainThreadMessage.tsx:36`,
  `DataEntityDetailsHeader.tsx:132`) hide the actual content. The
  same pattern applies to ANY tab whose destination is feature-gated
  downstream.

  Reactive side: `fetchActiveFeatures` IS dispatched at App.tsx:49
  (cited in batch-ZJ AppToolbar sidecar's bugs block), but the
  result is NOT consumed by ToolbarTabs — the dispatch is "for
  somebody else"; ToolbarTabs renders the tab regardless.

  This is the operator-confusing UX class that drives the most
  common ODD support ticket pattern: "I see this tab but clicking it
  shows nothing." Severity MEDIUM because (a) the destination
  page correctly shows the disabled-feature state (no data loss /
  no security), (b) the operator confusion is bounded by docs that
  CAN exist (but currently do not — sibling DOC-GAP), (c) the fix
  is structural — adding feature-flag gating at the tab level — and
  not trivial because it requires the FeatureController dispatch to
  complete before tab render OR a loading state on the tab row.

  No test asserts (a) the current state (tab visible regardless of
  feature flag) OR (b) the desired state (tab hidden when its
  feature is disabled).
