proposed_action: |-
  Two-phase implementation:

  **Phase 1 — Vitest unit/integration tests** (4 test methods):
  1. `renderDataEntityDetails_dispatchesFetchDetailsExactlyOncePerMount_pinsLSN017Fix` — mount `<DataEntityDetails />` inside `<MemoryRouter>` + mock Redux store. After mount + after `fetchDataEntityDetails.fulfilled` lands updating `details.status`, observe EXACTLY 1 dispatch of `fetchDataEntityDetails`. **Current bug behaviour: observes 2 dispatches** (the test FAILS today — the assertion pins the bug currently AND becomes a pin-the-fix after line 63 is removed).
  2. `renderDataEntityDetails_doesNotRedispatchWhenStatusFlipsFromUndefinedToConcrete_pinsLineRemovalContract` — mount with `details.status === undefined`, manually dispatch a `setStatus('STABLE')` action, assert NO additional `fetchDataEntityDetails` dispatch. Pins the specific dep-array entry that line 63 removes.
  3. `renderDataEntityDetails_redispatchesWhenIsDataEntityGroupUpdatedFlips_pinsLegitimateRefetchTrigger` — mount, then dispatch `updateDataEntityGroup.fulfilled`, observe 1 additional `fetchDataEntityDetails` dispatch (the LEGITIMATE re-fetch trigger). Pins the dep-array still catches DEG mutations after the fix.
  4. `renderDataEntityDetails_secondUseEffectFiresExactlyFourAncillaryFetchesOncePerMount_pinsCorrectDepArrayShape` — assert alerts-counts / DQ-test-report / SLA-report / resource-permissions each dispatched exactly 1×. The second useEffect uses `[dataEntityId]` only and SHOULD NOT have the LSN-017 issue. Pins the negative-cluster claim at the file level.

  **Phase 2 — Playwright end-to-end CI-permanent regression-pin** (promotes the one-shot probe P-004):
  - `openDataEntityDetailPage_observesExactlyOneApiCallAndOneViewCountDelta_pinsLSN017Fix_playwrightCIPermanent` — Playwright spec equivalent to probe P-004. Boot test-platform via Testcontainers, seed one Data Entity, navigate to `/dataentities/{id}/overview`, network-intercept regex-filtered to `/api/dataentities/{id}`, assert `xhr_count=1`. Backend assertion: query `data_entity.view_count` before + after, assert delta == 1.

  **Coherence note (LSN-018 Rule 6)**: This entry is the UI PRIMARY-SOURCE anchor for LSN-017. TEST-GAP-310 was the earlier ID created in batch H from the backend repository sidecar; that entry remains valid but is now STRENGTHENED by this entry which anchors to the UI-tier primary source (DataEntityDetails.tsx:56-64). The two entries compose: TEST-GAP-310 pins the regression at the backend consumer half (popular ranking); THIS entry pins the regression at the UI producer half (the doubling itself). Both should ship together when the tests pillar activates.

  After this batch (ZA), F-001 has the CANONICAL UI-side regression-pin test fully scoped. The producer→consumer→amplifier loop is now anchored to 4 TEST-GAPs: TEST-GAP-836 (UI producer doubling, this entry), TEST-GAP-256 (backend producer increment), TEST-GAP-309 (popular inflation), TEST-GAP-310 (EXCLUDE_FROM_SEARCH miss + LSN-017 amplification). Fixing them together is the single highest-leverage test-pillar work in the codebase.
