mitigations_unimplemented:
  - |-
    Implement a tsquery-operator escape function in JooqFTSHelper.tsQuery that
    escapes (, ), !, &, |, :, single-quote, backslash, <-> before tokenizing
    — single-touch fix for all six invocation sites.
  - |-
    Switch from to_tsquery to plainto_tsquery or websearch_to_tsquery (Postgres
    11+) which handle user-supplied text without operator interpretation —
    eliminates the entire class of injection.
  - |-
    Add a server-side validation step on POST /api/search rejecting query
    strings containing tsquery metacharacters with HTTP 400 + a structured
    error code — surface the rejection at the boundary rather than letting
    the malformed string persist.
  - |-
    Add a regression test asserting that a search with query = "foo )( bar"
    fails fast with 400 (NOT persists then 500s on subsequent facet reads).
  - |-
    Add a one-time migration to scrub malformed persisted query_string values
    from existing search_facets rows — closes the LATENT poison-pill data
    sitting in production tables.
notes: |-
  Cross-batch finding: the tsquery-operator-injection surface is shared
  between (a) batch E's POST /api/search create-session path, (b) batch H's
  getHighlightedResult SQL-injection / DoS finding, and (c) batch M's FIVE
  facet-aggregator invocations (per-keystroke hot-path in the Catalog tab).
  The shared root cause is a single JooqFTSHelper.tsQuery function with no
  escape; a one-touch fix closes all six surfaces.

  Operator-facing impact: persisted query_string is a poison pill — once a
  malformed string lands in search_facets via POST /api/search, EVERY
  subsequent facet GET on that session 500s. The session is reachable (the
  row exists) but unusable. The 500 surfaces as a generic error to the UI;
  the operator has no signal that the session is corrupted (vs the search
  is degraded vs the DB is failing).

  Cross-references:
    - Search Catalog (faceted, session-as-server-state) — the POST /api/search
      creation path that is the FIRST entry point for the malformed query.
    - Search Session — the persisted server-side state that carries the
      poison query.
    - Read-collaborative cross-owner enumeration — the same facet endpoints
      that suffer this injection ALSO expose catalog-wide cardinality across
      owners; the two findings compound at the same surfaces.
