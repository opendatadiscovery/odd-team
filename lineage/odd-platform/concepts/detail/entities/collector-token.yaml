name: Collector Token
canonical_in_docs: false
canonical_candidate: true
description: '40-character alphanumeric shared-secret bearer token used by an ODD
  collector to authenticate `POST /ingestion/entities` requests against the S2S `IngestionDataEntitiesFilter`.
  Stored in plaintext in the TOKEN table; compared via literal `.equals(...)` (no
  hashing layer). Rotation is an in-place UPDATE; no overlap window between old and
  new (regenerateCollectorToken sidecar `concepts.invariants.[1-3]`). vocabulary_status:
  codebase-anchored, doc-side-partially-covered (main-concepts.md mentions S2S authentication
  but not the token-rotation contract; live `/permissions` names COLLECTOR_TOKEN_REGENERATE
  Permission). **BATCH Q EXTENSION** — UI-tier hazards added (plaintext token
  rendered into DOM as text node + fragile substring-prefix-sniff masking detection
  per CollectorsList sidecar — see new sibling invariant
  `plaintext-token-rendered-into-dom-fragile-substring-prefix-sniff-masking`).'
vocabulary_status: codebase-anchored, doc-side-partially-covered
axes_present:
- controllers
- ui_components
nodes:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
- odd-platform ts react-component component:CollectorsList
contributors:
- 'regenerateCollectorToken: entities[Token (40-char alphanumeric shared secret),
  TokenPojo]; invariants[in-place UPDATE no overlap; plaintext in DB; plaintext in
  response; .equals-based filter check]'
- |-
  **NEW batch Q — CollectorsList.md (UI-tier credential hazards)**:
  bugs_limitations_corner_cases.[0] (MEDIUM — substring-prefix sniff
  masking detection at CollectorItemToken.tsx:25-27; a backend mask
  format change would silently break detection) +
  bugs_limitations_corner_cases.[2] (MEDIUM — Token plaintext rendered
  into DOM as text node at CollectorItemToken.tsx:34 — no <input
  type='password'>-style obfuscation, no Reveal-on-hover affordance,
  no auto-hide-after-N-seconds timer) +
  security.known_security_gaps.[1] (MEDIUM — Token plaintext rendered
  into DOM) + security.known_security_gaps.[2] (MEDIUM — Token-
  visibility detection is a literal substring prefix sniff) +
  implicit_adrs.[0] (HIGH — Token visibility is detected client-side
  via a substring-prefix sniff, not via a backend-supplied flag)
