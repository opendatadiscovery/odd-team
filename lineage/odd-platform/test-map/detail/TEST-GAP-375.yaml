behaviour: 'Service-tier cross-owner read on `listAll` — `AlertServiceImpl.listAll`
  (lines 77-80) is a three-line pass-through with no owner filter, no role check, no
  permission gate. The service is the canonical place where an owner-scoping filter
  could be inserted; current shape confirms the SERVICE is the missing-defence layer,
  not just the repository (TEST-GAP-356 covers the SQL primary source). A regression
  that adds a `.filter(byOwner(currentUser))` at the service tier would silently change
  the All-tab semantics. Pin current cross-owner posture at the service layer.'
