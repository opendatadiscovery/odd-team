  - odd-platform-api java auth logout:AzureLogoutSuccessHandler (line 38-44)
  - odd-platform-api java auth logout:CognitoLogoutSuccessHandler (line 43)
  - odd-platform-api java auth logout:GoogleLogoutSuccessHandler (line 40)
  - odd-platform-api java auth logout:GithubLogoutSuccessHandler (line 45)
  - odd-platform-api java auth logout:ODDIAMLogoutSuccessHandler (line 38)
  - odd-platform-api java utils:UriUtils (lines 11-23 getBaseUri implementation)
  - odd-platform-api resources/application.yml (absence of platform.base-url property)
contributing_nodes:
