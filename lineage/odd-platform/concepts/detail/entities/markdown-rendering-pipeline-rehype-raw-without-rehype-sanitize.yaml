name: Markdown Rendering Pipeline (rehype-raw without rehype-sanitize)
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
- P-01
- P-09
description: |-
  UI-side rendering surface for arbitrary user-authored Markdown bodies, primarily
  for internal_description. Implemented via @uiw/react-markdown-preview@4.2.2 which
  transitively pulls in rehype-raw@6.1.1 (parses raw HTML embedded in Markdown into
  AST nodes). NO rehype-sanitize is configured (grep returns 0 matches across
  odd-platform-ui/). NO skipHtml prop is set. Stored-XSS surface for any caller able
  to write into a Markdown-rendered field. **Batch J — UI HALF (P-01 pillar, with
  P-09 implications)**: the `<Markdown>` shared element at
  `components/shared/elements/Markdown/Markdown.tsx:84-127` wraps `@uiw/react-md-editor`'s
  `MDEditor` (edit mode) and `MDEditor.Markdown` (preview); passes only `source`,
  `wrapperElement`, `disableCopy`, and three custom `components` overrides (`a`,
  `div`, `p`); **NO `rehypePlugins` override** so library defaults remain
  (`rehype-raw`, `rehype-attr`, `rehype-autolink-headings`, `rehype-rewrite`,
  `rehype-slug`, `rehype-ignore`, `rehype-prism-plus` per pnpm-lock.yaml:5911-5938).
  **`<Markdown>` is the SOLE Markdown renderer on the platform** — sub-paths that
  use it include internal descriptions, alert messages, query examples, term
  definitions, dataset-field descriptions, owner descriptions. A rehype-pipeline
  change here affects every Markdown surface in the UI. **P-009 slice-5 empirically
  pinned** (probe run R-20260519T020610Z-P-009 on commit ede5d277): dangerous TAGS
  reach the rendered DOM (`dom_has_script_tag == True`, `dom_has_xss_img_id ==
  True`, `dom_has_xss_iframe_id == True`) BUT event-handler attributes are stripped
  by React's attribute filtering (`dom_has_onerror_attr == False`) AND script
  execution is blocked by Chromium HTML-parser policy + React's attribute filtering
  (`xss_dialog_fired == 0`, `xss_leak_count == 0`). These are DEFENCE-IN-DEPTH
  mitigations, NOT application-layer defences. A future code change (switching to
  `dangerouslySetInnerHTML`, adopting a client-side template renderer, relaxing
  CSP, or adopting an SVG payload that uses `onload`) re-opens the surface
  invisibly. The `<Markdown>` wrapper also auto-enables spellcheck via DOM
  mutation on a hard-coded `id='md-editor'` (Markdown.tsx:96-101, 105) — multiple
  concurrent editors would race on the same id.
