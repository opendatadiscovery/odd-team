proposed_action: |-
  (1) Fix the bug at RelationshipsListItem.tsx:73-81 (replace
  item.sourceDataEntity.* with item.targetDataEntity.*). (2) Add a Vitest
  test pinning Source != Target rendering in the row. (3) Add an
  integration test pinning the table-level column-distinctness contract.
  All three together close the gap. The fix is one-line; the test cost is
  ~30 min; the value is preventing the SAME copy-paste regression on
  future similar row renderers (and the leverage of a regression-pin
  scaffold the next renderer can copy).
