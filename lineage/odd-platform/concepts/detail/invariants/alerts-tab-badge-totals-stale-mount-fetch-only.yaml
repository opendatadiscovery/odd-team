name: |-
  Alerts tab badge totals stale — fetched once on mount, never refreshed after Resolve action
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
description: |-
  NEW MEDIUM-severity UX INVARIANT, batch ZL (2026-05-26) — the
  Alerts page (`components/Alerts/Alerts.tsx:15-17`) dispatches
  `fetchAlertsTotals()` ONCE on mount via a useEffect with empty
  dependency array. The fetched totals populate the three tab
  badges ('All [325]', 'My Objects [12]', 'Dependents [3]'). The
  badges NEVER refresh:

      useEffect(() => {
        dispatch(fetchAlertsTotals());
      }, []);  // ← empty deps; fires exactly once per mount

  Operator-visible failure mode: after the user resolves alerts
  (via the per-alert Resolve button → updateAlertStatus thunk),
  the badge counts stay stale until the user fully reloads the
  page OR navigates away and back to the /alerts route.

  **Trace**:
    - Mount: Alerts.tsx:15-17 → fetchAlertsTotals → AlertController.getAlertTotals
      → AlertServiceImpl runs `Mono.zipDelayError(allCount, countByOwner,
      countDependent)` — three COUNT queries in parallel. Results
      populate state.alerts.totals.
    - After mount: state.alerts.totals is REFERENCED only at
      AlertsTabs.tsx:23,28,34 (each tab label gets the count from
      a different field — `totals.total ?? 0`,
      `totals.myTotal ?? 0`, `totals.dependentTotal ?? 0`).
    - Resolve action: AlertItem.tsx:48-70 → updateAlertStatus
      thunk → alerts.thunks.ts:78-82 → backend mutates ALERT.STATUS.
      The thunk's fulfilment reducer (alerts.slice.ts) updates
      the specific alert's row in state.alerts.items but does
      NOT touch state.alerts.totals. No `dispatch(fetchAlertsTotals())`
      side-effect.

  **The structural cause is the slice's separation of concerns**
  — alerts.slice.ts treats totals (counts) and items (rows) as
  independent state slots. The mutation lifecycle updates rows;
  it does not re-fetch counts. A correct implementation would
  either:
    (a) Optimistically decrement the affected count
        (e.g., `state.alerts.totals.total--` if the resolved
        alert was previously OPEN);
    (b) Dispatch `fetchAlertsTotals` from the updateAlertStatus
        fulfilment;
    (c) Subscribe Alerts.tsx's useEffect to a state.alerts.items
        change signal (deps array including a count-affecting
        derived value).

  **Operator-visible consequences** (three patterns):

  (a) **Operator resolves 10 alerts; badge still shows the pre-
      resolve count.** They may infer the resolve action 'didn't
      take' (it did — the row updated to RESOLVED, but the
      All-tab counter is OPEN-only per the
      `alerts-all-tab-name-vs-implementation-drift-open-only`
      invariant, so the resolved alerts should have decreased
      the All count). They may re-click Resolve; the second
      attempt is idempotent at the backend (per the
      AlertServiceImpl reopen-guard) but wastes their attention.

  (b) **Operator navigating between tabs sees badge counts that
      reflect a state from N actions ago.** The asymmetry between
      'tab counts: stale' and 'tab content: fresh' is operator-
      confusing — the operator may not realise the badges are
      mount-time-only.

  (c) **Tab badge values are also stale during normal-platform
      operation** — new alerts created server-side (via
      AlertManagerWebhook or AlertActionResolver) do NOT propagate
      to the badges until the user re-visits /alerts. This is
      especially visible on long-lived browser tabs (operator
      keeps /alerts open as a dashboard); the badges become a
      lying summary.

  **Fix surfaces** (maintainer-triage):

  1. **Optimistic decrement** — in alerts.slice.ts's
     updateAlertStatus.fulfilled reducer, look at the
     pre/post-status transition and adjust totals accordingly:
       if (was OPEN and isNow RESOLVED) state.alerts.totals.total--;
       if (the resolved alert was in the user's owner set)
         state.alerts.totals.myTotal--;
     ~10 lines; closes the bug for the common case (single-user
     Resolve flow).

  2. **Background re-fetch** — dispatch fetchAlertsTotals from
     the fulfilment reducer. ~5 lines; correct for any state
     change but adds a network round-trip per Resolve action.

  3. **Polling** — Alerts.tsx useEffect with `setInterval` to
     re-fetch every N seconds. Crude; works for long-lived
     dashboard use; should be feature-flagged.

  4. **Event-driven** — backend WebSocket or SSE pushes alert
     state changes to the UI; the badge update is reactive. Out
     of UI-only scope; substantial backend infrastructure work.

  vocabulary_status: codebase-anchored. The live doc page does
  not document the badge refresh behaviour. Surface to
  doc-gap-finder.
