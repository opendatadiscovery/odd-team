name: metadata_field asymmetric uniqueness by origin (INTERNAL name-only; EXTERNAL (type,name))
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20R** — surfaced by the
  ReactiveMetadataFieldRepositoryImpl batch-R sidecar. The
  `metadata_field` table has TWO partial unique indexes that encode
  a DELIBERATE ASYMMETRIC uniqueness model by origin (per
  V0_0_1__init.sql:238-244):

    - `IX_UNIQUE_INTERNAL_NAME ON metadata_field(name) WHERE origin =
      'INTERNAL'` — INTERNAL fields are unique by NAME alone. The
      pair `(cost_centre:STRING:INTERNAL)` and
      `(cost_centre:INTEGER:INTERNAL)` would CONFLICT on insert.
    - `IX_UNIQUE_EXTERNAL_NAME_TYPE ON metadata_field(type, name)
      WHERE origin <> 'INTERNAL'` — EXTERNAL fields are unique by
      (TYPE, NAME). The pair `(cost_centre:STRING:EXTERNAL)` and
      `(cost_centre:INTEGER:EXTERNAL)` COEXIST as distinct rows.

  **The design intent**: operator-curated fields cannot have name
  reuse across types (one canonical `cost_centre` per platform);
  collector-ingested fields can (a collector may legitimately emit
  `cost_centre:STRING` and `cost_centre:INTEGER` from different
  sources without conflict). The asymmetry is encoded in the schema
  via mutually-exclusive `WHERE` clauses on the two partial indexes;
  the `ExceptionUtils.formatMessage` cascade (ExceptionUtils.java:63-65)
  has a SPECIFIC message `"Internal metadata with this name already
  exists"` for the INTERNAL collision — confirming that hitting the
  error is an EXPECTED and operator-facing case.

  **The conflict-arbitrator coupling** (ingestData at
  ReactiveMetadataFieldRepositoryImpl.java:73-109): the bulk-upsert
  path pins ONLY to `IX_UNIQUE_EXTERNAL_NAME_TYPE` and restates the
  predicate at line 101 via
  `.where(ORIGIN.ne(MetadataOrigin.INTERNAL.toString()))`. The
  conflict-arbitrator predicate in Postgres must match the partial
  unique index predicate EXACTLY. The hardcoded `.where(ORIGIN.ne(
  INTERNAL))` clause is brittle to a migration that changes the
  partial-index predicate (e.g. adding `AND deleted_at IS NULL` —
  per the sibling
  `metadata-field-soft-delete-partial-unique-index-mismatch`
  invariant). The `conflictFields` are read DYNAMICALLY from
  `Indexes.IX_UNIQUE_EXTERNAL_NAME_TYPE.getFields()` at line 93-96
  (column changes are auto-tracked); but the predicate is NOT.

  **The asymmetry across CONFLICT-RESOLUTION paths**: `ingestData`
  has race-tolerant semantics (`ON CONFLICT … DO UPDATE SET name =
  EXCLUDED.name`); the UI-tier `bulkCreate` (inherited from
  ReactiveAbstractCRUDRepository.java:113-126) has NO `ON CONFLICT`
  clause. An INTERNAL-field collision throws
  `DataAccessException → UniqueConstraintException("Internal metadata
  with this name already exists")` (ExceptionUtils.java:63-65). An
  EXTERNAL-field collision is swallowed silently by the upsert. The
  ergonomics gap is intentional per
  ReactiveMetadataFieldRepositoryImpl batch R implicit_adrs.[2]:
  TagController.createTag (operator-explicit creation gated by
  permission) MUST fail on duplicate; ingestion-side calls MUST not
  fail because a tag with the same name was added moments earlier.

  **The UX manifestation**:
    (a) An operator who creates a metadata field with name
        `cost_centre` and type `STRING` (INTERNAL) cannot LATER
        create a field with name `cost_centre` and type `INTEGER`
        — even though the user-facing dropdown would let them
        type a new field with that name. The error is opaque.
    (b) A collector emitting `cost_centre:STRING` for source A and
        `cost_centre:INTEGER` for source B silently succeeds.
        Two distinct rows coexist. Both surface on data-entity
        detail pages of their respective entities.

  **The IX_UNIQUE_EXTERNAL_NAME_TYPE index is NOT in
  `ExceptionUtils.formatMessage`** (ExceptionUtils.java:81-82): an
  EXTERNAL collision that ever surfaces as an exception (e.g.
  through a different write path bypassing ingestData) would fall
  through to the generic "Database constraint violation" fallback.
  This is a small but real ergonomics gap relative to the Tag
  pattern, which HAS `TAG_NAME_UNIQUE` in the translation table
  (ExceptionUtils.java:54-56).

  **The asymmetry is INVISIBLE to UI users**: `listInternalMetadata`
  (the only UI-facing list method) returns ONLY INTERNAL rows. The
  UI dropdown population shows the operator-curated set only. The
  collector-ingested EXTERNAL fields surface only on the per-entity
  detail page via `getDtosByDataEntityId`. An operator browsing the
  metadata dropdown to plan name choices CANNOT see the EXTERNAL
  side of the catalog.
