notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20V from the
  DataEntityAttachmentController class-level sidecar. The finding identifies
  a major read-side authorization gap that compounds with the cross-entity
  write finding to make attachments effectively read-write-collaborative
  by default.

  Cross-cutting connections:
    - Companion attachment finding: cross-entity-privilege-escalation-via-discarded-data-entity-id-in-attachment-urls
      (the WRITE-side compound; the READ-side has NO permission at all)
    - Companion attachment finding: filename-path-traversal-and-crlf-header-injection
      (the filename surface compounds: cross-owner reads of files uploaded
      with malicious filenames)
    - read-collaborative-cross-owner-enumeration master invariant — this
      finding is the read-side BLEED to attachments which carry different
      sensitivity content than catalog metadata
    - LSN-001 chunk-staging residue: the catch-all read does NOT extend to
      /tmp/odd/chunks but the residue is a related substrate-exposure
      surface
    - F-006 audit-silence: attachment reads are also UNAUDITED — no
      record of who downloaded which file when
    - Live doc: data-discovery/attachments.md describes attachments as
      'runbook PDFs, sample CSVs' — operator-sensitive content; the
      cross-owner read is contradicted by the implied use case

  Four DOC-NNN candidates flow:
    (a) Code fix Layer 1 — add three SecurityRule entries
    (b) New permission — DATA_ENTITY_ATTACHMENT_VIEW
    (c) Code fix Layer 2 — config flag for read-collaborative opt-in
    (d) Doc admission on the data-discovery/attachments.md page disclosing
        the current read-side posture until the fix lands
