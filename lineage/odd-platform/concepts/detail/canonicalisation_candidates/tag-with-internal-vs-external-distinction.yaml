proposed_canonical: Tag (with INTERNAL vs EXTERNAL distinction)
rationale: 'Batch G surfaces Tag as a concrete entity for the first time (previously
  implicit). Tag is canonical in main-concepts.md, but the INTERNAL vs EXTERNAL distinction
  (TagToDataEntityPojo.external=false/true) is NOT documented. The distinction matters:
  external (ingestion-managed) relations are protected from UI-side replace-all; internal
  (operator-managed) are not. Distinct from ''Term'' (glossary-managed via [[ns:name]]
  syntax).'
contributing_concepts:
- Tag
- Internal Tag (TagToDataEntityPojo.external=false)
- External Tag (TagToDataEntityPojo.external=true)
suggested_add_to_docs: true
