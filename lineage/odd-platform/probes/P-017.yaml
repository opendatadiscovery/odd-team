realism_caveats: |
  - PostgreSQL 12+ makes CREATE TABLE PARTITION OF a metadata-only operation that
    typically completes in <50ms. The lock interaction is minimal in steady state.
  - The `parallel` task primitive may not exist in the current probe-runner framework
    — this probe may need to be split into two sequential probes that share docker
    state, or executed via an external script. Flag for maintainer triage.
  - The probe is CHARACTERISATION, not strict assertion. The observed elapsed
    times feed the F-021 narrative on operator-visible latency during partition
    DDL windows.
  - Probe runs under DISABLED auth. Lock contention is auth-mode-agnostic.
