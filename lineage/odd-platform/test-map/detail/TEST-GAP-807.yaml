behaviour: |-
  **MEDIUM — Webhook URL accepts ANY syntactically-valid `java.net.URI`; no scheme allowlist, no host allowlist, no SSRF defence.** `NotificationConfiguration.java:94` rejects only empty strings (`webhookUrl.toString().isEmpty()`); the URI parser at line 91 accepts any syntactically-valid URI (`file://`, `gopher://`, RFC1918, link-local, `http://localhost`, `http://169.254.169.254/...` for AWS metadata-IMDS).

  **The boot-time validation gap**:
  - The JDK `HttpClient` at runtime will reject non-`http(s)` schemes at send-time (failing with `IllegalArgumentException`), but **no boot-time guard** prevents a misconfigured URL from being instantiated as a Spring bean.
  - The JDK `HttpClient` does NOT reject RFC1918 / link-local / loopback URLs — it happily sends to `http://169.254.169.254/latest/meta-data/iam/security-credentials/...` (AWS IMDS), `http://10.0.0.0/24/internal-service/`, `http://localhost:8500/v1/kv/secrets/` (Consul KV).

  **The SSRF surface**:
  1. An operator (or an attacker who learns the config-write path) sets `notifications.receivers.webhook.url=http://169.254.169.254/latest/meta-data/iam/security-credentials/odd-platform-role`.
  2. The platform's NotificationConfiguration boots cleanly — no validation error.
  3. The first alert fires, the webhook sender POSTs the alert payload to the AWS IMDS endpoint.
  4. AWS IMDS responds with the IAM role credentials.
  5. The dispatcher logs the failure (the IMDS endpoint returns non-200 for the unexpected POST shape) — but the credential response body is now in the platform's network buffer briefly + the request itself revealed the platform's presence to the local metadata service.
  6. More dangerously, if the URL is `http://internal-service.cluster.local/admin/api/users`, the POST body (full AlertNotificationMessage with dataEntity.owners, downstream lineage) is delivered to the internal service.

  **The threat model**:
  - For platforms where the webhook URL is **platform-config-only** (today's case — operator owns the YAML), the SSRF surface is bounded by config-write capability.
  - For platforms where the webhook URL is **user-controllable** (a future feature: per-Owner webhook URL stored in DB; a future Slack-OAuth-style admin surface) — the SSRF surface is direct.
  - In multi-team K8s deployments with ConfigMap edit RBAC distributed broadly, the gap is closer to "user-controllable" than "platform-config-only".

  **Compares to TEST-GAP-808** (Slack SSRF — same gap on the Slack URL): TEST-GAP-808 covers the parallel finding at SlackNotificationSender. Both share the root cause "operator-configured URI accepted verbatim, no allowlist".

  **Test gap shape**: regression-pin asserting boot-time acceptance of RFC1918 / loopback / `file://` URIs. PINS the current vulnerability; pairs with REFACTOR-NNN adding boot-time scheme + host allowlist.
