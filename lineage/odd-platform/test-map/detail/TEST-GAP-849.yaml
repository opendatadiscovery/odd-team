proposed_action: |-
  **Vitest cross-component tests** (3 tests):

  1. `renderDataEntityDetails_routeParamIsNaN_currentlyDispatchesWithNaN_pinsNoShortCircuit` — mount `<DataEntityDetails />` under `<MemoryRouter initialEntries={['/dataentities/abc/overview']}>`. Observe `fetchDataEntityDetails({dataEntityId: NaN})` dispatch. PINS the bypass.

  2. `renderLineage_routeParamIsNaN_currentlyRoutesToHierarchyLineageWithNaN_pinsDispatcherSilentRoute` — mount Lineage with NaN route param, assert HierarchyLineage mounts (because `isDEG=false` on undefined classes). PINS the silent-route-to-wrong-subtree.

  3. `useDataEntityRouteParams_paramIsMalformed_returnsNaN_pinsNoIsFiniteGuard` — unit test on the route helper itself; assert it returns NaN for `'abc'`. PINS the no-guard at the source.

  **Architectural fix recommendation**:
  - Add `if (!Number.isFinite(dataEntityId)) return <NotFoundPage />` at top of DataEntityDetails.tsx + Lineage.tsx + sibling consumers
  - OR add the guard to `useDataEntityRouteParams()` itself (single-source-of-truth fix)
  - Tests then flip assertion direction (assert NotFoundPage renders, dispatch is NOT fired)

  Coherence note (LSN-018 Rule 6): STRENGTHENS the cross-component pattern by establishing it as a project-wide gap, not an isolated component bug. NO contradiction with existing artefacts.
