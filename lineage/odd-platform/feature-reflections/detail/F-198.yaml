of F-014's reflection (the READ tab). The dominant finding is the Rule-9 validation gap (H-011): the four
UI components that ARE this feature have no enriched sidecar, so this reflection is UI-shell-traced +
backend-traced (two Rule-8 source reads), not from-the-screen. The net-new contributions over the existing
tracked items (PLT-034 / PLT-053 / PLT-050 / DOC-201): (a) H-002 resolves the feature-flow's ui_unverified
concurrency facet at the SQL tier — the upsert is unconditional last-writer-wins AND rewrites all four
columns; (b) H-004 surfaces a DISTINCT failed-fetch-then-empty-submit data-loss hazard PLT-053 does not
name; (c) the LSN-030 functional-test demands — the core save->reload promise (H-010) and the permission
gate (H-003) are CONFIRMED but have zero round-trip / security test coverage (the only test mocks the
service tier).
