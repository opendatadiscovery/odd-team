gap_id: TEST-GAP-161
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java LDAPSecurityConfiguration config-key-consumer:auth.type@L51
surfaced_by:
- LDAPSecurityConfiguration@L51.md:bugs_limitations_corner_cases.[actuator-env password
  leak]
- LDAPSecurityConfiguration@L51.md:security.known_security_gaps.[actuator env password]
behaviour: '**Actuator-env password leak surface**: `auth.ldap.password` is bound
  via `@ConfigurationProperties + @Data` on `ODDLDAPProperties`. `/actuator/env` is
  whitelisted by `SecurityConstants.WHITELIST_PATHS = /actuator/**` (permitAll''d
  before the authenticated fall-through in AuthorizationCustomizer). `endpoint.env.enabled:
  true` is the shipped default. Any caller able to reach the platform HTTP port sees
  the property name `auth.ldap.password` (Spring masks the VALUE but the key existence
  + the active LDAP backend are disclosed). Live LDAP docs do not flag the actuator
  surface.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/ActuatorEnvLeakageTest.java
  name: actuatorEnv_anonymousCaller_disclosesAuthLdapPasswordPropertyKey
evidence:
- 'LDAPSecurityConfiguration@L51.md says: ''auth.ldap.password is bound via @ConfigurationProperties
  + Lombok @Data getter ... the env endpoint reveals all resolved property values
  — including auth.ldap.password — to any caller able to reach the actuator port'''
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[4]
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[4]
proposed_action: Add `@WebFluxTest` under `auth.type=LDAP` with shipped application.yml
  (env actuator enabled); send anonymous `GET /actuator/env`; assert response body
  contains property key `auth.ldap.password` (current posture). Locks the leakage
  surface and forces a deliberate test update if the maintainer narrows actuator access.
