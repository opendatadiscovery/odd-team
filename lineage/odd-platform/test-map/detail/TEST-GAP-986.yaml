behaviour: |-
  **The load-bearing denormalisation invariant — `DATA_ENTITY_TASK_LAST_RUN.task_oddrn` is `PRIMARY KEY` (single row per test) — has NO test pinning it.** This is the schema invariant on which the dashboard's entire semantic rests:

  - The dashboard joins `DATA_ENTITY_TASK_LAST_RUN` (`ReactiveDataQualityRunsRepositoryImpl.java:41, 76, 95, 117-141`) — the denormalised "latest run per test" table populated by the ingestion path (`V0_0_45__last_runs_table.sql:7-25`).
  - `task_oddrn` is `PRIMARY KEY` (`V0_0_45__last_runs_table.sql:9`) — exactly one row per test.
  - The denormalisation IS the design — it changes the dashboard's semantic from "count of test runs by status" to "count of tests by their latest-run-status" (the LSN-019 drift documented in TEST-GAP-984).

  **Failure modes this gap enables**:

  1. **Schema-change-without-code-change**: a future maintainer evolves `DATA_ENTITY_TASK_LAST_RUN` (e.g. drops the PK to allow multi-row history; adds a "version" column for soft-mutation) without updating `getLatestDataQualityRunsResults`. The COUNT in the dashboard silently inflates by the number of rows per task. No test catches it.

  2. **Code-change-without-schema-change**: a future maintainer thinks "the doc says count of runs, the code should aggregate over `data_entity_task_run` directly" and refactors the join. The dashboard COUNT inflates 100x in deployments with long history. No test catches it.

  3. **Migration backfill drift**: the `V0_0_45` migration back-fills via `DISTINCT ON (tr.task_oddrn) ORDER BY tr.task_oddrn, tr.end_time DESC ... ON CONFLICT DO UPDATE` (`V0_0_45__last_runs_table.sql:15-21`). A future migration that doesn't preserve the DISTINCT ON semantics would leave dual rows for some tasks. No test pins this.

  4. **Ingestion-write drift**: the ingestion pipeline's `last_runs` upsert (`TaskRunIngestionRequestProcessor` per IngestionService sidecar) is the SOLE writer of `DATA_ENTITY_TASK_LAST_RUN`. A future ingestion refactor that lets two simultaneous writes succeed (race on the upsert) would corrupt the PK invariant on Postgres versions that don't enforce strict serialisability under READ COMMITTED.

  The denormalisation is the DESIGN — a deliberate ADR (`implicit_adrs[0]`). Test coverage pinning it is the regression-pin that converts intentional design into deliberate-test-update on future changes.
