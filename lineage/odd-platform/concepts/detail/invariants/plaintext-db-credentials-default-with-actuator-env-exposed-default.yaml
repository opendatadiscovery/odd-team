name: Plaintext DB credentials default + /actuator/env exposed default — compound credential-reachability
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-08
- P-09
description: |-
  NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20X — surfaces the compound
  finding that two shipped defaults together produce a reachable-credentials
  surface in the platform's default deployment. Neither default alone is
  catastrophic; combined they are operationally meaningful.

  **DEFAULT 1 — Plaintext credentials in YAML**:
    application.yml:5-7 ships:
      spring.datasource.url: jdbc:postgresql://127.0.0.1:5432/odd-platform
      spring.datasource.username: odd-platform
      spring.datasource.password: odd-platform-password
    The password is a well-known literal default. Per the R2DBCConfiguration
    sidecar's primary-source examination, this value flows through to:
      - R2DBCConfiguration.java:35 (primary ConnectionPool credentials)
      - R2DBCConfiguration.java:58, 62 (custom-datasource fallback chain)
      - DataSourceConfiguration.java:17-27 (parallel HikariCP DataSource)
    And the credential is also surfaced into the JVM heap as a Spring-managed
    bean property.

  **DEFAULT 2 — /actuator/env exposed by default**:
    application.yml:230-231 ships:
      management.endpoints.web.exposure.include: health, prometheus, env, info
    The `env` endpoint is enabled (`management.endpoint.env.enabled: true` at
    application.yml:237-238). Spring Boot's `EnvironmentEndpoint` is the default
    implementation behind `/actuator/env`. Spring Boot 3.4+ defaults
    `management.endpoint.env.show-values=NEVER` which masks property values
    matching the key-name substring pattern (`password|secret|key|token`) —
    so the literal `spring.datasource.password` value appears as `******` in
    the actuator response.

  **THE GAPS THE MASKING DOES NOT COVER**:
    1. The JDBC URL — `spring.datasource.url` is NOT covered by the masking
       substring; the actuator response exposes the database host / port /
       database-name. An attacker reaching the actuator endpoint learns the
       PG endpoint location.
    2. The custom-datasource URL — same as above. R2DBCConfiguration.java:56
       binds `spring.custom-datasource.url:` with empty-string default; if
       configured, it appears in the actuator response.
    3. The Slack webhook URL — NotificationConfiguration.java:77 binds
       `notifications.receivers.slack.url`; Spring's default substring mask
       does NOT include 'url'. If notifications are enabled, the Slack URL
       is fetchable.
    4. The generic webhook URL — same as Slack.
    5. The S3 access-key + secret-key — MinioConfig.java:14-17 binds
       `attachment.remote.access-key` + `attachment.remote.secret-key`. The
       substring 'key' IS in the default mask pattern, so these ARE masked —
       but the FIELD NAME (`accessKey`, `secretKey`) and the PRESENCE of the
       configuration leak. An attacker confirming that S3 storage is configured
       narrows reconnaissance.
    6. LOGIN_FORM credentials — under LOGIN_FORM mode the
       `auth.login-form-credentials` plain-text user:pass list is `@Value`-injected
       at LoginFormSecurityConfiguration.java:70. The substring 'credentials'
       is NOT in the default mask pattern; a maintainer override of the mask
       set could expose this — and a form-authenticated user can ALSO reach
       /actuator/env per the LOGIN_FORM sidecar's primary source.

  **COMPOUND WITH AUTH MODE**:
    - DISABLED: /actuator/env is anonymously reachable
      (DisabledAuthSecurityConfiguration.java:13-18 `.anyExchange().permitAll()`).
      An attacker on the network reads (masked) credentials + (unmasked) URLs
      + (unmasked) feature configuration.
    - LOGIN_FORM: /actuator/env requires authentication, but any form-authenticated
      user is ADMIN (per the LOGIN_FORM-ADMIN-for-every-user invariant). Plus
      under LOGIN_FORM the plaintext `auth.login-form-credentials` is reachable
      to any form-authenticated user.
    - OAUTH2 / LDAP: /actuator/env is whitelisted via
      SecurityConstants.WHITELIST_PATHS:95-96 (`/actuator/**` is in the list).
      Under these modes the env endpoint is unauthenticated even though the
      UI auth chain runs.
  The compound-with-DISABLED + compound-with-OAUTH2/LDAP cases are the highest
  risk; the LOGIN_FORM case requires authentication but the auth is permissive.

  **WHY THIS IS THE LSN-001-CLASS PATTERN**:
    Same shape as the original LSN-001 retrospective (attachment ephemeral default):
    a shipped default that is convenient for dev / demo but unsafe for production,
    with the safety entirely depending on operator-discipline (here: rotating
    credentials + restricting the actuator endpoint network reachability +
    overriding the masking). Two case-law precedents (LSN-001, LSN-002) confirm
    operator-discipline is insufficient.

  **SEVERITY**: MEDIUM at the cross-cutting level. Individual elements:
    - Plaintext password default (MEDIUM — deployment-discipline issue)
    - JDBC URL exposure (LOW — host info, not credentials)
    - Slack/webhook URL exposure (MEDIUM — webhook URLs ARE credentials in
      effect — anyone with the URL can post to the channel)
    - Auth-mode-bound reachability (HIGH under DISABLED; MEDIUM under
      OAUTH2/LDAP via /actuator/** whitelist; MEDIUM under LOGIN_FORM via
      ADMIN-for-all)
