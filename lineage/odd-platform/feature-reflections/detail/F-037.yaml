      No scoping is applied at any layer. The route at DataModellingRoutes.tsx:40 is bare (no
      WithPermissionsProvider); the controller has no @PreAuthorize; SecurityConstants (357 lines,
      read end-to-end) has no /api/relationships/** matcher; the service applies no check; and the
      repository SQL has no OWNERSHIP join, no data_source_id filter, no namespace_id filter, no
