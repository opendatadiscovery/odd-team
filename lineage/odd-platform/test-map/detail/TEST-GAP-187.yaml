behaviour: 'Lombok `@Data` on nested `OAuth2Provider` POJO auto-generates `toString()`
  including `clientSecret=<plaintext>`. `provider.toString()` returns String containing
  the secret verbatim. No `@ToString.Exclude`. Spring Boot 3.4.10''s `/actuator/configprops`
  masks `*secret*` keys (actuator path safe) — but any future `log.debug("loaded providers:
  {}", properties.getClient())` emits secrets in plaintext. 4-sidecar-triangulated
  cross-cutting invariant (LDAP password + OAuth2 clientSecret + Email password +
  Notifications).'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/ODDOAuth2ProviderToStringSensitiveFieldTest.java
  name: oauth2Provider_toString_doesNotContainClientSecret
evidence:
- 'ODDOAuth2Properties.md:bugs_limitations_corner_cases.[3] verbatim: ''Lombok @Data
  auto-generates toString() covering all 21 fields including clientSecret. Calling
  provider.toString() returns a String containing clientSecret=<plaintext>'''
- 'Grep `@ToString.Exclude` under `<odd-platform-repo>/odd-platform-api/src/main/java`:
  0 matches'
cross_references:
