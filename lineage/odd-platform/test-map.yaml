     the entire `notification` package has ZERO test files. Nine TEST-GAP-NNN
     entries: WAL decoder cache (TEST-GAP-172), lazy slot/publication
     (TEST-GAP-173), email silent partial delivery (TEST-GAP-174, CRITICAL),
