      SELECT COUNT(*) AS now_count
      FROM activity
      WHERE data_entity_id = 1018
        AND event_type = 'OWNERSHIP_UPDATED'
    capture_as: now_activity_count

  # Sanity: ownership set unchanged — still 2 ownerships, same owners + titles.
  - kind: sql
    query: |
      SELECT owner_id, title_id
      FROM ownership
      WHERE data_entity_id = 1018
      ORDER BY owner_id, title_id
    capture_as: final_ownership_set

oracle:
  # Sanity assertions.
  - "len(final_ownership_set) == 2"

  # PRIMARY ASSERTION (current bug state if the race manifests):
  # A spurious row was created (count delta = 1) AND the old/new state
  # strings differ AND the JSON-parsed sets are semantically equal.
  - "now_activity_count - baseline_activity_count == 1"

  # Byte-different strings.
  - "latest_ownership_activity.old_state != latest_ownership_activity.new_state"

  # Semantic-equality of the parsed JSON sets. The probe-runner must
  # support JSON parsing + tuple-set construction; if not, encode as
  # human-inspect.
  - "set(tuple(d.get('owner_name'), d.get('title_name')) for d in parse_json(latest_ownership_activity.old_state)) == set(tuple(d.get('owner_name'), d.get('title_name')) for d in parse_json(latest_ownership_activity.new_state))"

