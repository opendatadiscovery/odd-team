      `term_search_entrypoint.tag_vector` — a global search for the deleted
      tag name can still surface previously-tagged terms. The single FTS
      refresh the delete path does perform never cleans the token because
      it cannot discover which terms to re-index (the relation rows are
      already gone).
    observed: |-
