behaviour: |-
  **HIGH — Spec-side contract test for REFACTOR-217 / F-002 path-mismatch: `openapi.yaml:973` declares `/api/dataentities/{data_entity_id}/terms` (PLURAL) AND `openapi.yaml:1042` declares `/api/dataentities/{data_entity_id}/terms/{term_id}` (PLURAL) — but `SecurityConstants.java:237-239` registers SINGULAR `/term`. The spec IS correct; the SecurityConstants registration is wrong. ANY authenticated user could link/unlink terms with no DATA_ENTITY_ADD_TERM permission for an unknown number of releases until the sidecar audit caught it.**

  This entry pins the SPEC-SIDE contract test that, if it had existed at REFACTOR-217's introduction time, would have prevented the silent authorization bypass. The TEST-GAP-017 entry pins the CONTROLLER-SIDE behavioural test for the same finding; this entry is the spec-side complement.

  **The contract test that should have existed**:
  - Parse `openapi.yaml` + `components.yaml`.
  - Extract every `/api/*` path declared in the spec.
  - Reflectively load `SecurityConstants.SECURITY_RULES`.
  - For every path-pattern in SECURITY_RULES, assert it MATCHES at least one spec'd path (Spring's path-pattern semantics).
  - For every spec'd path that requires authorization (per the `x-permission` extension proposed in TEST-GAP-828), assert SECURITY_RULES has a matching matcher.
  - The MISMATCH between `/term` (singular, in SECURITY_RULES) and `/terms` (plural, in spec) is the canonical case the test fails on.

  **Why HIGH** (severity matches the sidecar's rating): REFACTOR-217 already establishes the HIGH severity for the underlying authorization bypass; this entry adds the SPEC-SIDE contract test that institutionalises the lesson. STRENGTHENS TEST-GAP-017 (the controller-side regression-pin) by adding the structural class of contract test that PREVENTS the class.

  **Cross-pillar P-06 + P-09 + P-11**: P-06 (Data Glossary) is the affected feature, P-09 (Security & Access Control) is the broken permission model, P-11 (Platform API & Developer Surface) is the artefact (the spec) that should have caught it.

  **Test gap shape**: build-time test that
  1. Parses `SecurityConstants.SECURITY_RULES` via reflection.
  2. Parses the OpenAPI spec.
  3. Asserts every path-pattern in SECURITY_RULES MATCHES at least one spec'd path.
  4. Asserts the test FAILS today on the `/term` vs `/terms` path-pattern, plus any other similar drifts (the test should enumerate ALL such drifts at first run; the maintainer triages each).
