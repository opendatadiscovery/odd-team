- id: H-012
  hypothesis: |-
    When a DEG owner opens the group's Edit dialog, removes one entity chip, and presses "Save
    changes", only that one entity is removed — the other members are untouched.
  derivation: |-
    UI label "Edit Group" / "Save changes" on DataEntityGroupForm (batch-K extension); the
    senior-PO consistency question — does the DEG-side edit behave like the per-entity X chip?
  seed_source: ui-label
