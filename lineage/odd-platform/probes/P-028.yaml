realism_caveats: |
  The race window between listByNames and bulkCreate is narrow; a
  single probe run may not hit it. The probe-runner should run the
  concurrent act step N times (recommend >= 20) and report whether
  the loser-4xx outcome was ever observed. If never observed, the
  finding is "race is theoretically present (no ON CONFLICT) but not
  reproducible at single-host concurrency" — still a documentable
  caveat for high-concurrency deployments, severity LOW. The probe
  does NOT cover the reactive-transaction interaction: both upsertTags
  calls run inside @ReactiveTransactional, so the losing INSERT also
  rolls back its term-relation writes — the caller loses the WHOLE
  PUT, not just the directory row.
