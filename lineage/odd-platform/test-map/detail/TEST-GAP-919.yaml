behaviour: |-
  **MEDIUM — `TestCategoryResults.sortedResults` (`TestCategoryResults.tsx:19-25`) is the component's one non-trivial behaviour: it rebuilds the per-status tile array by iterating `Object.values(DataEntityRunStatus)` in enum-declaration order (SUCCESS, FAILED, SKIPPED, BROKEN, ABORTED, UNKNOWN), so every category row's tiles appear in the SAME horizontal slots. This is what makes the dashboard's category rows visually comparable column-by-column. A regression (e.g. a maintainer simplifying to `results.map`) silently makes column position track backend serialisation order — a category's FAILED tile would land in a different slot than its neighbours' FAILED tiles. No test pins the enum-order tile stabilisation.**

  **The contract** (statically certain):
  - Per-category row layout: a category heading + a large total + a horizontal row of count tiles, one per status (`TestCategoryResults.tsx:27-45`).
  - The tile order MUST be the enum-declaration order across all rendered category rows so that "the FAILED tile is always in slot 2", "the SKIPPED tile is always in slot 3", etc. — making the dashboard a comparable matrix.
  - `sortedResults` enforces this by `Object.values(DataEntityRunStatus).map(status => results.find(result => result.status === status)).flatMap(f => (f ? [f] : []))` (`TestCategoryResults.tsx:19-25`).
  - The same enum-iteration pattern is used for the shared dashboard legend in the sibling `DataQualityContent.tsx:83-89` — so legend slot ↔ tile slot alignment is guaranteed.

  **What can silently break**:
  - A refactor replaces `sortedResults` with `categoryResults.results` (the raw prop). Backend serialisation order leaks through. Today the backend `DataQualityCategoryMapperImpl.java:21-43` does not guarantee any specific order; under load or with a small SQL change, neighbouring category rows could have their FAILED tiles in different visual slots.
  - A refactor changes the iteration to `Object.keys(DataEntityRunStatus)` — at TS string enums, `Object.keys` returns the same as `Object.values` only if there are no reverse mappings, but a future enum addition could subtly differ.

  **No test pins this**: the entire DataQuality subtree has zero tests (verified by `find odd-platform-ui/src/components/DataQuality -type f` — 21 source files, 0 test files, 2026-05-22).

  **Test gap shape**: unit test rendering `<TestCategoryResults>` with a `categoryResults.results` whose statuses arrive in REVERSE enum order (UNKNOWN, ABORTED, BROKEN, SKIPPED, FAILED, SUCCESS). Assert the rendered tiles appear in the FORWARD enum order (SUCCESS, FAILED, SKIPPED, BROKEN, ABORTED, UNKNOWN). PINS the override of backend order.
