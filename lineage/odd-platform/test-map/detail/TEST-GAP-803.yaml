proposed_action: |-
  Add `NotificationDeliveryAuditEnumGapRegressionPinTest`. Static-analysis unit test:

  1. `activityEventTypeDto_noNotificationEventConstants_pinsStructuralAuditSilence` —
     - Use reflection to enumerate `ActivityEventTypeDto.values()`.
     - Assert NONE of the enum values has a `name()` matching the regex `NOTIFICATION.*` or `.*NOTIFICATION.*`.
     - PINS the current 26-enum-value list without notification constants.

  2. `alertNotificationMessageProcessor_noActivityLogAnnotation_pinsAuditMechanismAbsence` —
     - Use reflection on `AlertNotificationMessageProcessor.class` methods.
     - Assert NO method carries `@ActivityLog` annotation.
     - PINS the absence of activity-feed integration.

  3. `notificationDelivery_anyEnumExtensionExistsAndIsLogged_confirmsFixDirection` — (UPDATE once REFACTOR-NNN lands)
     - After REFACTOR-NNN: assert `ActivityEventTypeDto` includes `NOTIFICATION_DELIVERY_ATTEMPTED` constant.
     - Integration test: trigger an alert; assert `/api/activity` returns a row of type `NOTIFICATION_DELIVERY_ATTEMPTED` for the alert.
     - CONFIRMS the fix's effectiveness.

  Pair with REFACTOR-NNN (multi-step enum + Flyway + @ActivityLog emission + UI switch) and DOC-GAP-NNN (live doc audit-coverage clarification).

  Coherence note (LSN-018 Rule 6): This finding STRENGTHENS F-006 (ENUM-rooted audit silence) by adding the notification-delivery surface as the 5th instance of the family. STRENGTHENS TEST-GAP-458 (no delivery audit at dispatcher) by surfacing the structural root cause — the ENUM gap. NO contradiction. NET-NEW at the enum-anchored evidence layer.
