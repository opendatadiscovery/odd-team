terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Housekeeping DELETEs + partition CREATEs + status UPDATEs + session
    cleanup DELETEs against PostgreSQL. Cron-misfire failure mode:
    PostgreSQLPartitionCreationJob's daily 00:01 partition CREATE-TABLE-IF-NOT-EXISTS
    deferred behind a long housekeeping cycle → if queue exceeds 23:59:59 of
    the partition's first-use day, INSERTs against ACTIVITY / MESSAGE fail
    with `no partition exists for the given key`.
  evidence:
    - "HousekeepingJobManager (15-min cycle)"
    - "PostgreSQLPartitionCreationJob (daily 00:01)"
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
    - drift_class: single_thread_executor_default_undocumented
      description: |-
        Spring's default TaskScheduler poolSize=1 is the deployed reality;
        operator docs at `docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#housekeeping`
        mention the 15-minute housekeeping cadence + ShedLock multi-instance
        coordination but do NOT mention single-thread executor OR the
        `spring.task.scheduling.pool.size` knob. Mitigation is one line of
        YAML; documenting it is the substantive gap.
      evidence:
        - "SchedulingConfiguration.java:12-26 (no @Bean TaskScheduler)"
        - "application.yml (zero spring.task.* keys)"
        - "WebFetch docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#housekeeping (verified 2026-05-26 status 200)"
    - drift_class: cron_misfire_partition_creation_blocked_behind_housekeeping
      description: |-
        PostgreSQLPartitionCreationJob daily 00:01 cron creates next-day
        ACTIVITY / MESSAGE partitions. If long housekeeping runs past
        00:01 — and the four jobs share ONE thread — the partition CREATE
        is queued. Spring's default `MissedTaskBehavior` is queue-and-execute-ASAP
        (PROBE-NEEDED per SchedulingConfiguration sidecar P-183). If queue
        exceeds 23:59:59 of partition's first-use day, INSERT failures cascade
        with no obvious cause.
      evidence:
        - "PostgreSQLPartitionCreationJob.java:40 (@Scheduled cron 0 1 0 * * *)"
        - "HousekeepingJobManager.java:25 (@SchedulerLock lockAtLeastFor 14m)"
    - drift_class: session_housekeeping_lacks_schedulerlock_asymmetric_pattern
      description: |-
        PostgreSQLSessionHousekeepingJobHandler is `@Scheduled` WITHOUT
        `@SchedulerLock` — runs on EVERY replica simultaneously every hour.
        Today the DELETE-by-expired-timestamp is idempotent so operationally
        harmless; convention violation is real. A new maintainer adding a
        `@Scheduled` method may copy this pattern and inherit the gap. The
        `@EnableSchedulerLock(defaultLockAtMostFor="1h")` NAME promises
        "enable scheduler lock" but mechanically only enables the AOP
        advisor — bare `@Scheduled` is not locked.
      evidence:
        - "PostgreSQLSessionHousekeepingJobHandler.java:13-18 (no @SchedulerLock)"
        - "SchedulingConfiguration.java (@EnableSchedulerLock defaultLockAtMostFor=1h — dead code today)"
    - drift_class: defaultlockatmostfor_one_hour_dead_code
      description: |-
        `@EnableSchedulerLock(defaultLockAtMostFor="1h")` is DEAD CODE today —
        all three `@SchedulerLock`-annotated methods (housekeeping 14m,
        status-switch 9m, partition-creation 10m) declare their own
        `lockAtMostFor`. Latent safety floor only.
      evidence:
        - "SchedulingConfiguration.java:12-26"
    - drift_class: graceful_shutdown_lock_held_for_lockatmostfor_window
      description: |-
        `kubectl delete pod` mid-housekeeping rolls back the in-flight jOOQ
        transaction (safe) but leaves the shedlock row held until
        lockAtMostFor expires (~14min). No replica can run housekeeping
        during the lock-hold window. `spring.task.scheduling.shutdown.await-termination`
        is unset; Spring default interrupts running threads.
      evidence:
        - "HousekeepingJobManager @SchedulerLock(lockAtMostFor=14m)"
    - drift_class: no_lockprovider_or_executor_micrometer_metrics
      description: |-
        ShedLock LockProvider has NO Micrometer instrumentation; lock-acquisition
        outcomes + lock-hold duration are not surfaced. ThreadPoolTaskExecutor
        active threads + queued tasks similarly invisible. Operators cannot
        answer "is replica B failing to acquire because replica A is holding?"
        from metrics.
      evidence:
        - "SchedulingConfiguration.java (entire — no MeterBinder)"
