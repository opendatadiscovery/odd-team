proposed_action: Add Testcontainers-Prometheus integration test setting `odd.tenant-id=`
  (empty); ingest a counter; assert the proto label list contains `tenant_id=""`;
  then issue `ExternalMetricReader` query; assert the read filter does NOT include
  the tenant_id clause. Locks the asymmetry as the LSN-002-class regression candidate.
