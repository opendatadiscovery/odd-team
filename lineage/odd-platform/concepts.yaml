    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: UNGATED
        detail: "All 5 AlertController endpoints carry no @PreAuthorize and no SECURITY_RULES entry — fall through to .authenticated() only. The generated AlertApi interface has zero authorization annotations. Per-entity alert listings on DataEntityController also lack permission gates. Only `updateAlertConfig` is gated (`DATA_ENTITY_ALERT_CONFIG_UPDATE` per SecurityConstants.java:304-307)."
      owner_scoping:
        verdict: MIXED
        detail: "`getAllAlerts` returns all alerts platform-wide with no owner filter (admin-path-without-admin-gate). `getAssociatedUserAlerts` (`/my`) and `getDependentEntitiesAlerts` (`/dependents`) are owner-scoped at runtime via reactor Context principal resolution — correctness delegated to AlertService.listByOwner / listDependentObjectsAlerts. `changeAlertStatus` does NOT check the caller owns the alert or its referenced data entity (BYPASSES at the mutation path)."
      strengths:
        - "Service-layer reopen-guard: `AlertServiceImpl.updateStatus` rejects manual reopen with 400 if open alert of same type already exists for the entity (AlertServiceImpl.java:124-131)"
        - "Closed enum AlertStatus (OPEN / RESOLVED / RESOLVED_AUTOMATICALLY) — clients cannot introduce new states without OpenAPI change"
        - "@ActivityLog AOP records ALERT_STATUS_UPDATED on every service-mediated mutation (AlertServiceImpl.java:112-113)"
      weaknesses:
        - "`getAllAlerts` returns the entire platform's alert stream to ANY authenticated user — no admin gate, no role check (severity HIGH per AlertController sidecar)"
        - "`changeAlertStatus` accepts mutation with no permission gate — any authenticated user can resolve/reopen any alert by id"
        - "Reopen-conflict guard is read-then-write without serialisable fence — two concurrent OPEN requests for sibling alerts on same entity can both pass the guard (severity MEDIUM)"
        - "Owner-scoped `/my` / `/dependents` rely on reactor Context propagation — a misordered WebFilter could silently degrade to empty or unscoped output"
        - "Spec declares NO security: block on alert-tagged operations and NO error-response contracts (only `200`); consumers reading the spec cannot derive auth requirements"
        - "Under auth.type=DISABLED, anonymous read of every alert AND anonymous mutation of any alert"
      cross_file_inconsistencies:
        - "AlertController per-class mutations are ungated; DataEntityController.updateAlertConfig (the per-entity halt-config mutation) IS gated by DATA_ENTITY_ALERT_CONFIG_UPDATE — same conceptual feature, two different gating models"
        - "Spec-tag:alert reports `security: []` at spec; AlertController reports auth-mode-only at runtime — same conclusion (no permission gate) but reached via different layers"
      contributing_files:
        - "AlertController.md"
        - "openapi-tag-alert.md"
        - "changeAlertStatus.md"
        - "alerts-route.md"
        - "DataEntityController.md"
      evidence:
        - "AlertController.md:security.known_security_gaps.[1] (getAllAlerts severity HIGH)"
        - "AlertController.md:security.known_security_gaps.[2] (changeAlertStatus ungated)"
        - "openapi-tag-alert.md:security.known_security_gaps.[0] (no spec-level security)"
        - "changeAlertStatus.md:security.known_security_gaps.[0] (no @PreAuthorize, severity HIGH)"
    performance_aggregate:
      overall: MEDIUM
      hot_paths:
        - "GET /api/alerts (`getAllAlerts`) — paged list across global alert population, primary 'All' view, fired on every alerts UI tab activation — AlertController + alerts route"
        - "GET /api/alerts/totals (`getAlertTotals`) — three count queries on every alerts-page render to populate tab badges — AlertController"
        - "PUT /api/alerts/{alert_id}/status (`changeAlertStatus`) — single-item mutation, plus @ActivityLog AOP fires synchronous activity-row INSERT every call — AlertController.changeAlertStatus"
        - "POST /ingestion/alert/alertmanager — webhook from Prometheus AlertManager, can fire multiple-times-per-minute on noisy systems (group_interval default 5m) — AlertManagerController (separate concept; cross-references)"
      throughput_shape:
        verdict: SINGLE_ITEM_ONLY
        detail: "No batch resolve / batch reopen / batch list endpoint. A consumer needing to resolve 100 alerts must issue 100 sequential PUT calls. Pagination is offset-based only (no cursor) on the three list endpoints."
      scaling_shape:
        verdict: UNPAGINATED
        detail: "Pagination params (page/size) declared but unconstrained at controller (no @Max). Spec carries no `maximum` on `SizeParam`; spec-conformant `size=2147483647` is permissible. No streaming, no SSE."
      strengths:
        - "All 5 endpoints reactive `Mono<ResponseEntity<...>>` — non-blocking I/O (AlertController.java:21, 30, 36, 44, 52)"
        - "Stateless controller — horizontal scaling unconstrained at the controller layer"
        - "AlertController constructor-injected as singleton (no per-request bean creation overhead)"
      weaknesses:
        - "No upper bound on `size` parameter — caller can request arbitrary response body and DB load"
        - "No caching on `getAlertTotals` — every alerts-page render re-runs the three count queries; for high-traffic platforms this is per-page-load DB hit"
        - "No request-throughput observability (no `@Timed`, no Micrometer counter, no structured logging on entry/exit)"
        - "Reopen-conflict guard is not transactionally fenced (read-then-write race window)"
        - "Single-item-only `changeAlertStatus` — bulk operator workflows pay N round-trips"
        - "Activity-row INSERT fires on every status change regardless of whether status actually changed (no idempotency / no-op short-circuit)"
      cross_file_inconsistencies:
        - "Cursor pagination on getDataEntityActivity (DataEntityController) but offset pagination on every alert list endpoint — cross-controller inconsistency for what could be the same alert-stream concept"
      contributing_files:
        - "AlertController.md"
        - "openapi-tag-alert.md"
        - "changeAlertStatus.md"
        - "alerts-route.md"
      evidence:
        - "AlertController.md:performance.hot_paths.[0-2]"
        - "AlertController.md:performance.known_performance_gaps.[0-3]"
        - "openapi-tag-alert.md:performance.known_performance_gaps.[0-4]"
        - "changeAlertStatus.md:performance.known_performance_gaps.[0-2]"

  - name: "AlertManager Webhook Receiver"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Inbound HTTP webhook receiver at `POST /ingestion/alert/alertmanager` that accepts Prometheus AlertManager-shaped payloads and materialises each as a `DISTRIBUTION_ANOMALY` Alert keyed by the `entity_oddrn` label. Distinct from the platform's internal Alert lifecycle: external write-only ingress, no `*Api` interface, hand-rolled DTO, unauthenticated by design (operator-delegated network controls) (AlertManagerController sidecar `understanding`)."
    axes_present:
      - controllers
    nodes:
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertManagerController"
    contributors:
      - "AlertManagerController: entities[ExternalAlert, AlertManagerRequest, DISTRIBUTION_ANOMALY alert, entity_oddrn label]"
    evidence:
      - "AlertManagerController.md:concepts.entities.[ExternalAlert, AlertManagerRequest]"
      - "AlertManagerController.md:concepts.operations.[receive AlertManager webhook]"
      - "AlertManagerController.md:implicit_adrs.[0] (no_openapi_contract)"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - DISABLED
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: UNGATED
        detail: "Path is in SecurityConstants.WHITELIST_PATHS (`/ingestion/**` at SecurityConstants.java:96), so AuthorizationCustomizer.java:22 exempts it from the entire UI authentication chain. Also NOT covered by IngestionDataEntitiesFilter (which only matches `/ingestion/entities` POST). Authentication is operator-delegated to network-layer controls (reverse proxy, mTLS, NetworkPolicy)."
      owner_scoping:
        verdict: N/A
        detail: "Inbound write-only path. No current-user concept. Caller chooses entity_oddrn freely → no authorization that caller may raise an alert on the chosen entity."
      strengths:
        - "Live security doc explicitly warns operators ('Apply perimeter controls (network segmentation, authenticating reverse proxy, mTLS) for any deployment where these endpoints are reachable from outside the trusted network')"
        - "@ReactiveTransactional ensures per-batch atomicity on AlertServiceImpl.handleExternalAlerts (AlertServiceImpl.java:152)"
      weaknesses:
        - "No application-layer authentication, no shared-secret, no token mechanism on `/ingestion/alert/alertmanager` — entirely operator-delegated to network layer (severity HIGH per sidecar)"
        - "Alert spoofing: caller chooses arbitrary `entity_oddrn`, no check that caller is authorised to raise DISTRIBUTION_ANOMALY against that entity — fabricated alerts surface to all authenticated users on target entity's page (severity HIGH)"
        - "No rate limit / payload size limit / dedup — unauthenticated caller can flood ODD with `AlertPojo` + `AlertChunkPojo` rows (DoS vector + noise injection)"
        - "Silent orphaning: payload missing `entity_oddrn` label is accepted, persisted with null `data_entity_oddrn`, returns 204 No Content — caller has no signal of misconfiguration (severity HIGH)"
        - "ExternalAlert.startsAt is timezone-naive `LocalDateTime`; AlertManager's RFC3339 timezone offset is silently stripped by Jackson"
      cross_file_inconsistencies: []
      contributing_files:
        - "AlertManagerController.md"
      evidence:
        - "AlertManagerController.md:security.known_security_gaps.[0-3]"
        - "AlertManagerController.md:bugs_limitations_corner_cases.[0] (silent_orphan)"
    performance_aggregate:
      overall: MEDIUM
      hot_paths:
        - "Webhook fired by Prometheus AlertManager on alert events — per-group POST every 5m minimum (AlertManager group_interval default) — AlertManagerController"
        - "Per-request DB write fan-out: each ExternalAlert in payload produces one AlertPojo + one AlertChunkPojo row inside @ReactiveTransactional handleExternalAlerts — AlertManagerController + AlertServiceImpl"
      throughput_shape:
        verdict: BATCH_FRIENDLY
        detail: "AlertManagerRequest carries List<ExternalAlert> — per-group batching does cluster alerts into one POST. But no cross-request batching; back-to-back POSTs each open their own transaction."
      scaling_shape:
        verdict: HORIZONTALLY_SCALABLE
        detail: "Stateless controller (only injected AlertService field). Multiple replicas behind a load balancer can each accept POSTs concurrently. @ReactiveTransactional ensures per-batch atomicity but offers no cross-replica ordering guarantee."
      strengths:
        - "Reactive Mono signature — non-blocking up to the service boundary"
        - "Stateless controller — instances scale horizontally without coordination"
      weaknesses:
        - "No rate limit on the endpoint — misconfigured/malicious AlertManager creates unbounded AlertPojo + AlertChunkPojo rows"
        - "No deduplication of repeated alerts within a short window — AlertManager `group_interval` re-sends every 5m by default; each re-send creates a fresh AlertPojo even if `(entity_oddrn, type=DISTRIBUTION_ANOMALY)` already has an OPEN alert"
        - "No backpressure / queue between HTTP intake and DB write — bursty AlertManager groups (post-incident storm) hit DB synchronously; slow Postgres causes 5xx, AlertManager retries, amplifying load"
        - "Hand-rolled DTO drops AlertManager fields (`status`, `endsAt`, `annotations`, `fingerprint`, `groupKey`); cannot honour `status: resolved` to close alerts"
      cross_file_inconsistencies: []
      contributing_files:
        - "AlertManagerController.md"
      evidence:
        - "AlertManagerController.md:performance.hot_paths.[0-1]"
        - "AlertManagerController.md:performance.known_performance_gaps.[0-2]"
    notes: |
      Conceptually this is an inbound write surface for an operator's external
      alerting infrastructure (Prometheus AlertManager) into the ODD Alert
      lifecycle. Distinct from the internal Alert concept — the spec, controller
      shape, auth posture, and routing are all different. The substrate's
      docs canonical-vocabulary does not name this concept; the live
      `configuration-and-deployment/odd-platform#prometheus-alertmanager-integration`
      page documents it but main-concepts.md does not register it as an alias
      or first-class concept.

  - name: "Attachment"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Per-data-entity attachments — uploaded files (chunked multipart upload) and external links — accessible under `/api/dataentities/{data_entity_id}/{attachments|files|links}*`. Files use a 3-step state machine (initiate → upload-part(s) → complete) keyed by a server-issued `uploadId` UUID. Storage backend is operator-configurable (LOCAL filesystem default vs REMOTE S3-compatible) (DataEntityAttachmentController + AttachmentServiceImpl + attachment config-prefix sidecars)."
    axes_present:
      - controllers
      - config_prefixes
    nodes:
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController"
      - "odd-platform java AttachmentServiceImpl config-key-consumer:attachment.max-file-size@L27"
      - "odd-platform yaml application.yml config-prefix:attachment"
    contributors:
      - "DataEntityAttachmentController: entities[DataEntityAttachments, DataEntityFile, DataEntityLink, DataEntityUpload, uploadId]"
      - "AttachmentServiceImpl@L27: entities[DataEntityUploadOptions, DataEntityFile, attachment upload session]"
      - "attachment config-prefix: entities[attachment storage backend, S3-compatible bucket, local filesystem path, attachment upload session, attachment file size cap]"
    evidence:
      - "DataEntityAttachmentController.md:concepts.entities.[DataEntityAttachments]"
      - "AttachmentServiceImpl@L27.md:concepts.entities.[DataEntityUploadOptions]"
      - "attachment-config-prefix.md:concepts.entities.[attachment storage backend, S3-compatible bucket]"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: INCONSISTENT
        detail: "POST/PUT/DELETE on `/files/**` and `/links/**` gated by DATA_ENTITY_ATTACHMENT_MANAGE (SecurityConstants.java:247-276); GET endpoints (`getAttachments`, `getUploadOptions`, `downloadFile`) carry NO permission gate — only authentication required. Six gates on writes, zero gates on reads."
      owner_scoping:
        verdict: BYPASSES
        detail: "Read endpoints return data without owner filtering. `getAttachments` and `downloadFile` accept dataEntityId only, no caller-identity, no ownership filter. Combined with the missing-GET-gate, any authenticated user can read every data entity's attachments and download every file. Whether this is intentional read-availability or a missed gate is unresolved."
      strengths:
        - "DATA_ENTITY_ATTACHMENT_MANAGE permission centralised in SECURITY_RULES with DATA_ENTITY policy context (per-entity policy evaluation)"
        - "Live doc page acknowledges DATA_ENTITY_ATTACHMENT_MANAGE in `#rbac` section (operators can find the gate)"
      weaknesses:
        - "Read-path authorization asymmetry — GET endpoints unprotected (severity HIGH per controller sidecar). Live doc names DATA_ENTITY_ATTACHMENT_MANAGE but is silent on read-side posture"
        - "Server-side attachment.max-file-size cap is advertised via getUploadOptions but NOT enforced on the chunked upload path — non-browser caller can submit arbitrary-size files (severity HIGH per consumer + controller sidecars)"
        - "S3 credentials (attachment.remote.access-key, attachment.remote.secret-key) exposed via /actuator/env by default (Spring Boot Actuator's standard exposure list with endpoint.env.enabled: true) — Spring's default key-pattern sanitisation masks values but the keys themselves leak (severity HIGH per config-prefix sidecar)"
        - "Cross-entity uploadId hijack: a user with DATA_ENTITY_ATTACHMENT_MANAGE on entity X who learns another user's uploadId Y issued for entity Z can post chunks via `POST /api/dataentities/X/files/uploads/Y/chunks` — gate authorises path's data entity, service forwards to uploadId's data entity (severity MEDIUM)"
        - "No audit logging on attachment download — exfiltrating insider leaves no trace (severity MEDIUM)"
        - "No virus / malware scanning on upload — storage backends are passive byte sinks; live doc advertises 'no restriction on file type' (severity MEDIUM)"
        - "Content-Disposition filename injection on download — `filename=\" + dto.fileName()` unsanitised (CR/LF → header injection, quote/semicolon → header truncation; filename is attacker-controlled from upload form data) (severity MEDIUM)"
      cross_file_inconsistencies:
        - "Server-side enforcement bypass surfaces in TWO sidecars (controller + AttachmentServiceImpl@L27 consumer) — same root cause documented at both layers; cross-ref strengthens the systemic-finding signal"
        - "Live doc danger box on LOCAL ephemerality (LSN-001) is consistent across config-prefix and controller sidecars; YAML default still ships `/tmp/odd/attachments` — operator following defaults vs operator following docs diverge"
      contributing_files:
        - "DataEntityAttachmentController.md"
        - "AttachmentServiceImpl@L27.md"
        - "attachment-config-prefix.md"
      evidence:
        - "DataEntityAttachmentController.md:security.known_security_gaps.[0-5]"
        - "AttachmentServiceImpl@L27.md:security.known_security_gaps.[0] (server-side bypass HIGH)"
        - "attachment-config-prefix.md:security.known_security_gaps.[0] (S3 creds via /actuator/env HIGH)"
    performance_aggregate:
      overall: LOW
      hot_paths:
        - "downloadFile — every UI download click streams Resource via reactive pipeline; LOCAL → page-cache, REMOTE → one S3 GetObject per request — DataEntityAttachmentController"
        - "uploadFileChunk — once per chunk per upload (N invocations for N-MB file at default chunk size) — DataEntityAttachmentController"
        - "getAttachments — every entity-detail page load (Attachments tab); two parallel DB reads via Mono.zip — DataEntityAttachmentController"
        - "getUploadOptions — every upload-dialog open; multiplies maxFileSize × 1_000_000 inline — AttachmentServiceImpl@L27"
      throughput_shape:
        verdict: STREAMING
        detail: "Chunked upload supports multi-part transfers but no single-request multi-chunk batch endpoint. Single-file download per request — no Range request support. Bulk-create on links via DataEntityLinkListFormData (single-request multi-link create); updates and deletes are single-item per request."
      scaling_shape:
        verdict: STATEFUL_LOCKED
        detail: "Chunked-upload session state lives in storage backend keyed by uploadId. For LOCAL storage this is a per-instance filesystem path (`/tmp/odd/attachments`) — chunks staged on instance A cannot be completed by instance B without a shared volume. A horizontally-scaled deployment with LOCAL storage produces intermittent failures whenever the load balancer routes uploadFileChunk and completeFileUpload to different instances. REMOTE (S3) is shared by construction."
      strengths:
        - "Chunk persistence streams via FilePart.transferTo(Path) — chunk-bounded memory; aggregate memory pressure scales with concurrent in-flight chunks, NOT total upload size"
        - "Stateless controller (only injected service collaborator) — horizontal scaling unconstrained at controller layer"
        - "Reactive Mono/Flux — non-blocking on server I/O thread"
      weaknesses:
        - "LSN-001 — LOCAL default writes to ephemeral `/tmp/odd/attachments`; container/pod restart wipes all uploaded files. YAML still ships this default despite live doc danger box (severity HIGH)"
        - "Multi-instance LOCAL storage broken: chunk staging directory keyed by uploadId only, no replica id; cross-replica chunk assembly is undefined (severity HIGH)"
        - "LSN-002 — REMOTE on AWS S3 silently restricted to us-east-1 (MinioConfig.minioClient() omits .region(...); MinIO SDK defaults to us-east-1 for SigV4) (severity HIGH)"
        - "MinIO SDK HTTP-client timeouts (~5min) not configurable — slow networks combined with large attachment.max-file-size produce unrecoverable socket timeouts"
        - "No client-side resume protocol: downloadFile does not honour Range requests; flaky-connection user must restart from byte 0 on each retry"
        - "REMOTE bucket not auto-created and not auto-validated for existence at boot — typos boot cleanly, fail on first upload"
        - "No pagination on getAttachments — Mono.zip materialises both file list and link list fully in memory before serialisation (memory spike per request; combined with no API pagination, this is DoS-against-platform)"
        - "Reflection-based ODDRN-property extraction in Directory unmemoised; affects per-data-source attachment property listing"
      cross_file_inconsistencies:
        - "controller sidecar reports REMOTE-backend HTTP client pooling unconfirmed pending MinioConfig sidecar; config-prefix sidecar confirms a single shared MinioAsyncClient bean (no custom OkHttpClient pooling) — cross-file complement, not contradiction"
        - "Storage-tier × file-size interaction surfaces in all three sidecars (LOCAL ephemeral × 20MB cap × N concurrent uploads = LSN-001 risk surface)"
      contributing_files:
        - "DataEntityAttachmentController.md"
        - "AttachmentServiceImpl@L27.md"
        - "attachment-config-prefix.md"
      evidence:
        - "DataEntityAttachmentController.md:performance.known_performance_gaps.[0-4]"
        - "AttachmentServiceImpl@L27.md:performance.known_performance_gaps.[0-2]"
        - "attachment-config-prefix.md:performance.known_performance_gaps.[0-2]"
    notes: |
      "Attachment" is not in main-concepts.md as a canonical term but is a
      first-class platform feature with its own live doc page
      (`features/data-discovery/attachments`), per-entity REST surface,
      RBAC permission (DATA_ENTITY_ATTACHMENT_MANAGE), config-prefix
      (`attachment.*`), and two retrospectives (LSN-001, LSN-002).
      Surface as a canonicalisation candidate.

