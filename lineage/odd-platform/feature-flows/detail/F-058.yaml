pillar_anchored_feature_name: Lookup Tables Listing UX
feature_name: |-
  Lookup Tables list page — operator-visible catalog of lookup tables; silently
  caps at 30 rows because InfiniteScroll scrollableTarget references a
  non-existent DOM id (copy-paste regression from Directory feature)
