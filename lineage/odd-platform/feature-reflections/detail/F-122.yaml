    verdict: contradicted
    actual_behavior: |-
      No `show-values` key exists anywhere in the application.yml management block
      (source read, application.yml:226-245 — the block contains
      `endpoints.enabled-by-default: false`, `exposure.include: health, prometheus,
      env, info`, and per-endpoint `enabled: true` for health/prometheus/env/info,
      but NO `management.endpoint.env.show-values` line). Masking is therefore at
      the Spring Boot framework default (`NEVER` in 3.4+). All four config sidecars
      independently and correctly state this: MinioConfig sidecar:125 ("Spring Boot
      3.4+ defaults show-values=NEVER … the field names themselves … leak");
      ODDLDAPProperties sidecar:128 ("Spring Boot's default, NOT a platform-authored
      protection"); the concept-invariant:31-35 ("Spring Boot 3.4+ defaults
      show-values=NEVER"); R2DBCConfiguration sidecar:195 ("no test … asserts this
      masking"). The live doc also states the default is `show-values: NEVER`. The
      feature-flow facet's claim of an explicit `WHEN_AUTHORIZED` platform setting is
      inaccurate — the difference is load-bearing: a framework default is an
      operator-removable guarantee, whereas the facet implies a platform contract.
    evidence:
      - sidecar: source_read_for_validation
        section: management-block
        cite: "application.yml:226-245 (no show-values key)"
        note: "The management block has no show-values; default NEVER governs."
      - sidecar: "concepts/detail/invariants/plaintext-db-credentials-default-with-actuator-env-exposed-default.yaml"
        section: "DEFAULT 2"
        cite: "concept-invariant:26-35"
        note: "Spring Boot 3.4+ default show-values=NEVER; not platform-set."
      - sidecar: "odd-platform__java__MinioConfig__config-class__MinioConfig.md"
        section: bugs_limitations_corner_cases
        cite: "MinioConfig sidecar:125"
        note: "Spring Boot 3.4+ default; field names + presence still leak."
    source_read_for_validation: true
    operator_visible_failure: |-
      An operator reading the F-122 feature-flow (or any artefact that copied its
      facet text) believes the platform actively sets `WHEN_AUTHORIZED` and so
      assumes masking is a platform guarantee they cannot accidentally weaken. In
      reality (a) masking is the framework default — a Spring Boot major-version
      change, or a pre-3.4 inherited `ALWAYS` default, silently flips it; (b)
      `WHEN_AUTHORIZED` and `NEVER` differ in behaviour — `WHEN_AUTHORIZED` shows
      values to an authorized caller, but under the WHITELIST there is no
      authorization on `/actuator/env`, so the difference is moot AND the facet's
      framing misleads. The maintainer-facing risk is reasoning about the masking
      posture from a wrong premise. Routes to a feature-flow facet correction.
    severity: HIGH
