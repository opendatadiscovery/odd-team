- 'DataEntityController + DataEntityAttachmentController sidecars: implicit_adrs naming
  the path-pattern wiring + the term path-mismatch failure'
- 'AlertController: implicit_adrs[1] — authorization-is-service-layer (the alerts
  variant of the same pattern, where SECURITY_RULES is empty)'
- 'DirectoryController: implicit_adrs[5] — GETs are uniformly authenticated-only across
  the platform'
- 'GenAIController: implicit_adrs[1] — authorization is wired via path-matcher fall-through
  (no SECURITY_RULES entry)'
- 'regenerateCollectorToken.implicit_adrs[0]: example of the pattern WORKING — endpoint
  gated by COLLECTOR_TOKEN_REGENERATE'
- 'getAllAlerts.implicit_adrs[0]: example of the FALL-THROUGH default (no rule = catch-all
  .authenticated())'
- 'uploadFileChunk.implicit_adrs[2]: gate evaluates against URL''s data_entity_id
  with no service-side cross-validation — pattern''s structural failure mode'
- 'postMessageInSlack.bugs_limitations_corner_cases[0]: no SECURITY_RULES entry →
  fall-through to authenticated() catch-all'
- 'getActivity.security.authorization_assertions: no SECURITY_RULES entry; falls through'
- 'DisabledAuthSecurityConfiguration@L10: PRECONDITION-side — explicit `.anyExchange().permitAll()`
  at line 16 means the entire SECURITY_RULES table is INERT under DISABLED; no per-rule
  manager(...) call ever fires'
- 'LoginFormSecurityConfiguration@L31: PRECONDITION-side — `.pathMatchers("/**").authenticated()`
  at line 57 means SECURITY_RULES is INERT under LOGIN_FORM; the AuthorizationCustomizer
  constructor is never called. REFACTOR-073 validated.'
- 'OAuthSecurityConfiguration@L71: PRECONDITION-side — `.authorizeExchange(new AuthorizationCustomizer(permissionService,
  extractors))` at line 98 is THE wiring point under OAUTH2'
- 'LDAPSecurityConfiguration@L51: PRECONDITION-side — same AuthorizationCustomizer
  wiring at line 145 under LDAP; SecurityWebFilterChain at `Ordered.HIGHEST_PRECEDENCE`'
- 'LDAPSecurityConfiguration@L51.implicit_adrs[containsIgnoreCase admin match]: SECONDARY
  structural failure mode of name-based authorization — substring match invites substring-collision
  admin escalation'
- 'RoleController.createRole.implicit_adrs[0]: example of the pattern WORKING — `POST
  /api/roles → ROLE_CREATE` (SecurityConstants.java:169), NO_CONTEXT, uniform pattern
  across NAMESPACE / POLICY / ROLE / TAG / OWNER mutation endpoints'
- 'PolicyController.createPolicy.implicit_adrs[0]: example of the pattern WORKING
  for MANAGEMENT-tier permissions — `POST /api/policies → POLICY_CREATE` (SecurityConstants.java:163-164)'
- 'OwnerController.createOwner.implicit_adrs[0]: example of the pattern WORKING —
  `POST /api/owners → OWNER_CREATE` (SecurityConstants.java:143)'
- 'PermissionController.getResourcePermissions.implicit_adrs[3]: example of the pattern''s
  read-side INTENTIONAL absence — `GET /api/resource/.../permissions` deliberately
  falls through to catch-all `.authenticated()`; the convention is GETs typically
  fall through and SECURITY_RULES enumerates MUTATIONS'
- 'SearchController.search: example of the FALL-THROUGH default for a read surface
  (no SECURITY_RULES entry; falls through to `.authenticated()`) AND of the pattern''s
  structural failure mode (read-collaborative cross-owner enumeration with NO owner
  predicate — same admin-path-without-admin-gate shape as getAllAlerts + getActivity)'
