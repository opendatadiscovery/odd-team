    actual_behavior: |
      The hypothesis predicts a customisation affordance; the code confirms its ABSENCE as the
      designed behaviour. size: 30 is hard-coded at Relationships.tsx:23 with no URL parameter, no
      settings control, and no react-query override. To change it a developer edits the literal and
      rebuilds. The 30 value matches the documented page size (no doc drift), and infinite-scroll
      mitigates the lack of a tunable for most users — but a power-user on a large catalog cannot
