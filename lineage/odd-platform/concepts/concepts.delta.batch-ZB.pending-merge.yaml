        single read/list endpoint of the Management → Datasources tab, the fifth
        UI-admin DataSource endpoint. The controller is a 3-line proxy; the SQL is
        a CTE-paginated data_source scan + 2 LEFT JOINs against NAMESPACE and
        TOKEN, ordered data_source.id ASC (creation order). THE LOAD-BEARING FACT:
        GET /api/datasources has NO entry in SecurityConstants.SECURITY_RULES
        (only POST/PUT/DELETE are gated) — ANY authenticated user lists the entire
        catalogue, no permission, no owner scope (the read-collaborative posture,
        surface 25 of 29). The list emits the token object in the MASKED form
        ("******" + the real last 6 plaintext chars) — API-side masking via
        TokenMapper.mapValue gated by TokenDto.showToken=false on the list path.
        `size` has no upper bound — an unbounded-response surface. Probes
        P-034..P-037.
      detail_path: detail/operations/list-data-sources-ui-admin-paginated-read.yaml
    - slug: update-data-source-ui-admin-replace
      name: Update Data Source (UI admin path — full-form REPLACE)
      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
        - controllers
      nodes_count: 1
      contributors_count: 1
      security_aggregate_overall: MEDIUM
      performance_aggregate_overall: HIGH
      description: |-
        NEW OPERATION, batch ZB — PUT /api/datasources/{data_source_id} is the
        UI-admin "edit data source" action, the missing third UI-admin DataSource
        write operation (register + regenerate-token existed; this is UPDATE). The
        service loads the existing row via getDto, raises a CLEAN 404 via
        switchIfEmpty when absent or soft-deleted, optionally get-or-creates a
        namespace, applies the form via the MapStruct @MappingTarget mapper,
        persists the UPDATE, refreshes the FTS vectors — all in ONE
        @ReactiveTransactional boundary. Gated by DATA_SOURCE_UPDATE (MANAGEMENT
        tier). THE LOAD-BEARING CONTRACT — update is REPLACE not MERGE; a partial
        body silently nulls omitted fields (see the dedicated invariant
        datasource-update-replace-not-merge-mapstruct-set-to-null). Returns HTTP
        200 vs the openapi-declared 201. Concurrent edits are last-writer-wins (no
        optimistic-lock version column). Emits NO Activity Event. Probes P-042
        (404-on-missing), P-043 (REPLACE-vs-MERGE), P-044 (auth matrix).
      detail_path: detail/operations/update-data-source-ui-admin-replace.yaml
    - slug: delete-data-source-ui-admin-guarded-soft-delete
      name: Delete Data Source (UI admin path — guarded soft-delete, blocks on live children)
      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
        - controllers
      nodes_count: 1
      contributors_count: 1
      security_aggregate_overall: MEDIUM
      performance_aggregate_overall: HIGH
      description: |-
        NEW OPERATION, batch ZB — DELETE /api/datasources/{data_source_id} is the
        UI-admin "remove data source" action, the fourth UI-admin DataSource write
        operation. Despite the name, it is a GUARDED SOFT-DELETE that BLOCKS on
        live child data entities — the service calls
        existsNonDeletedByDataSourceId and, if any non-soft-deleted data_entity
        references the source, throws CascadeDeleteException → HTTP 400, NO
        mutation; otherwise runs the inherited soft-delete `UPDATE data_source SET
        deleted_at = NOW()`. Gated by DATA_SOURCE_DELETE (MANAGEMENT tier, not
        entity-scoped). THE LOAD-BEARING FACTS — (a) an actively-ingested data
        source is effectively UNDELETABLE because the collector re-creates
        data_entity rows on its next tick; the reliable delete path is to stop the
        collector first (undocumented); (b) the delete is an INCOMPLETE cleanup —
        orphans the token row, leaves the FTS vector uncleared (see the dedicated
        invariant). Emits NO Activity Event. Returns 204. Probes P-046..P-049.
      detail_path: detail/operations/delete-data-source-ui-admin-guarded-soft-delete.yaml

