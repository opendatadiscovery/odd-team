behaviour: |-
  Cross-owner facet-count enumeration regression-pin (CRITICAL — cross-pillar P-01+P-09; catalog-cardinality exposure surface). Both `GET /api/search/{search_id}` and `GET /api/search/{search_id}/facet/{facet_type}` expose cross-owner catalog cardinality to any authenticated user via facet drill-down. The facet aggregators in `ReactiveSearchFacetRepositoryImpl` apply only `getDataEntityDefaultConditions` (HOLLOW=false, STATUS != DELETED, EXCLUDE_FROM_SEARCH NULL-or-false) with NO `OWNERSHIP` join: entity-class facet at lines 163-249, owner facet at 339-372, tag facet at 374-407, type facet at 251-337, group facet at 409-452, status facet at 454-534. The owner facet (`getOwnerFacetForDataEntity`) is the PRIMARY catalog-cardinality discovery surface — it enumerates EVERY OWNER NAME in the platform with the count of entities each owns. An authenticated attacker can: (1) `getFiltersForFacet(OWNERS)` to enumerate every owner name + per-owner entity count, (2) `getFiltersForFacet(NAMESPACES)` to enumerate every namespace, (3) `getFiltersForFacet(TAGS)` / `(GROUPS)` to enumerate the platform's full tag and group cardinality — all catalog-wide. The single owner-derived input on the path — `authIdentityProvider.fetchAssociatedOwner()` at `SearchServiceImpl.java:128` — feeds ONLY the optional `myObjectsCount` field; if the caller has no owner association, the count switches to `0L` and the request still returns catalog-wide totals successfully. Pairs with REFACTOR-024 (the BATCH alert read) and REFACTOR-340 (the PER-ENTITY alert read): together they form the catalog-wide cross-owner enumeration surface. Live `features/data-discovery/search` doc (WebFetched 2026-05-19 status 200) is SILENT on whether facet counts respect any per-user / per-owner / per-tenant scope — operators may assume the `My Objects` toggle scopes counts (it only scopes the result LIST). Under `auth.type=DISABLED` the endpoints are anonymously reachable.
