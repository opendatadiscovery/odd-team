        cite: 'DataQualityServiceImpl.java:67-78'
        note: 'guard is existsIncludingSoftDeleted on both ids; soft-deleted entities pass'
        source_read_for_validation: true
      - sidecar: '(absent — source read for validation)'
        section: repository
        cite: 'ReactiveDataQualityRepositoryImpl.java:56,78,122'
        note: 'READ queries exclude STATUS=DELETED tests, so a severity on a deleted test is write-accepted but read-invisible'
        source_read_for_validation: true
    operator_visible_failure: |-
      A severity write to a soft-deleted dataset/test is accepted (HTTP 200) and persisted, but
      then silently dropped from every read (SLA, test report) because the read side filters
      DELETED — so the operator gets a success response for a change that has no observable
      effect (a write that lies). The inconsistency between the write guard
      (existsIncludingSoftDeleted) and the read guard (STATUS.ne(DELETED)) is the underlying
      drift; in practice the UI route to the test panel would usually be unreachable for a
      deleted dataset (cf. F-022's RestrictedRoute isStatusDeleted redirect), so the day-to-day
      blast radius is low — but a direct API caller hits it cleanly. LOW operator impact, real
      write/read asymmetry.
