# WAL-driven outbound alert notification fan-out (Slack / Webhook / Email) — product-owner reflection

## product_owner_narrative

Notifications is one of P-07 Active Platform Features' five opt-in subsystems — the one where ODD Platform turns an alert it has detected into a message that reaches a human on a channel they already watch. The promise to a customer is simple and load-bearing for the whole "Active Platform" pitch: *when something breaks in your data (a job fails, a data-quality test fails, a schema change is backwards-incompatible, a distribution anomaly fires), you find out on Slack, on a generic webhook, or by email — without logging into ODD.* The audiences are the platform-operator (who wires it up) and the notification-recipient (the Slack channel / webhook endpoint / inbox that consumes it) (per system-mission.md P-07 audiences + `NotificationsDispatcher.md` concepts.audiences). It is the outbound twin of Alerting (F-007): F-007 raises the `ALERT` row, F-009 delivers it.

Unlike most ODD features, the user does NOT drive this from a screen. There is no button, no form, no modal — the entry point is a Postgres logical-replication WAL event on the `ALERT` table, consumed by a leader-elected single-thread subscriber (`NotificationSubscriber.run()`, per `NotificationSubscriber.md` understanding). So the operator-facing surface of THIS feature is the `application.yml` / environment configuration (the `notifications.*` namespace) plus the channels themselves; the recipient-facing surface is the message that lands in Slack / the webhook / the inbox. The operator turns the whole subsystem on with `notifications.enabled=true` (off by default — `NotificationsFeatureCondition` reads `Boolean.class, false`, per the F-009 batch-X notes; pinned by ADR-0040 / IT-011), then enables each channel independently by supplying its key: `notifications.receivers.slack.url`, `notifications.receivers.webhook.url`, `notifications.receivers.email.sender` (+ recipient list). Absence of a key means that channel's bean never registers and that channel is a silent no-op (per `NotificationConfiguration` batch-X facet 2; pinned by ADR-0041 / AdrNotificationChannelContractTest). The mechanism is durable-by-design: the WAL slot survives a platform crash so an alert raised while the platform was down still delivers on restart (per the live config doc, "send a notification even if ... the Platform crashes"; the slot/publication lifecycle is the IT-011 gate).

The working parts, described as the operator experiences them: one alert fans out to *every* enabled channel — there is no routing knob, no per-severity filter, no per-owner targeting (the for-loop at `AlertNotificationMessageProcessor.java:25-36` iterates `List<NotificationSender>` unconditionally; `NotificationsDispatcher.md` implicit_adrs[0]). The fan-out is sequential on the single WAL-consumer thread, so a slow channel delays the others for the same alert. Each channel shapes the payload differently: Slack renders a Block Kit message including the entity name, data source/namespace, owners, downstream lineage entities (to `notifications.message.downstream-entities-depth`, default 1), and the latest 3 alert-chunk descriptions (per `SlackNotificationSender.md` + the live doc's "outbound carries" list; the render path is exercised by SlackMessageGeneratorTest); the generic webhook POSTs the *full* `AlertNotificationMessage` POJO as snake_case JSON verbatim (per `WebhookNotificationSender.md` understanding); email renders an HTML Freemarker template with nine entity/alert fields and a clickable deep-link back to the ODD UI (per `EmailNotificationSender.md` getEmailContent). Delivery is fire-and-forget: a channel success advances the WAL position; a channel failure is logged at ERROR and the alert is gone from that channel — no retry, no dead-letter, no per-(alert,channel,status) audit row (per `PostgresWALMessageProcessor.md` bugs[0] — the SPI seam's `void` return is the structural root: the dispatcher has no way to tell the subscriber "don't advance the LSN, retry me").

The integration story: F-009 sits at the receiving end of three upstream feeds. F-007 Alerting writes the `ALERT` rows (failed-job / failed-DQ / schema-diff alerts via `AlertActionResolver`, plus Prometheus AlertManager pushes via `/ingestion/alert/alertmanager`) (per system-mission.md P-07 feeds_from [P-04, P-05, P-10] + F-009 related_features F-007). Those alert-chunk descriptions originate from upstream collectors and flow verbatim into the Slack message — which makes F-009 the 6th surface of F-004's description-injection family (per `SlackNotificationSender.md` bugs[2] + F-009 related_features F-004; the render path that consumes the chunks is SlackMessageGenerator, shared with F-038 Data Collaboration's discussion message — SlackMessageGeneratorTest validates both). And the audit-silence story is shared with F-006: `ActivityEventTypeDto` enumerates 26 activity-event constants but ZERO name notification delivery, so the platform's own Activity feed cannot record that an alert was (or was not) delivered (per `PostgresWALMessageProcessor.md` bugs[4] + F-006 cross-link).

Edge cases a product owner would call out in a demo: turning the subsystem on with no channels configured still pays the per-alert recursive-CTE DB cost for zero delivery (empty-senders no-op, `NotificationsDispatcher.md` bugs[7]); a burst of alerts (a DQ run flagging every dataset) sends one message per alert with no batching and no rate-limit, so Slack will 429 and the platform silently drops the rest (per `SlackNotificationSender.md` bugs[0]); and the load-bearing operational risk — a single malformed alert row stalls the whole stream forever (poison-message replay loop, `NotificationSubscriber.md` bugs[0]). Until the 2026-06 refresh the entire `notification/` package had ZERO automated test coverage at the odd-platform-api level; three tests now exist (SlackMessageGeneratorTest + the two ADR contract tests) plus two integration protocols (IT-011/IT-012), but they guard the render path, the channel-activation contract, the fail-soft loop, and the WAL/leader lifecycle — NOT any of the seven contradicted failure-mode behaviours below, every one of which is traced from primary source rather than from a passing test.

