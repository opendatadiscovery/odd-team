mitigations_unimplemented:
  - |-
    Add rehype-sanitize to the shared Markdown.tsx wrapper with an allowlist
    excluding script / iframe / style / onerror — ONE line in ONE file fixes
    ALL FOUR user-curated Markdown surfaces (data-entity description, dataset-
    field description, term definition, query-example definition + query) PLUS
    any future Markdown affordance the platform adds. The shared-element
    architecture is the asset; sanitisation at the leaf prop level is platform-wide.
  - |-
    Backend HTML sanitisation at write time — Jsoup or org.owasp.encoder at
    QueryExampleServiceImpl.createQueryExample + .updateQueryExample (and the
    parallel three other surface entry-points). Defence-in-depth that holds
    even if a future UI refactor accidentally bypasses the shared Markdown.tsx
    wrapper.
  - |-
    Add @Size(max=...) on QueryExampleFormData.definition + .query — cap at e.g.
    64 KiB. The current openapi spec is unbounded; PostgreSQL 'text' accepts
    up to 1GB. Bounds the blast radius of the persistent payload + the FTS
    index size.
  - |-
    Add a regression test that stores a script tag and an img onerror tag in
    BOTH the definition AND the query field, fetches via the four UI surfaces,
    and asserts the round-trip is neutralised. Pin the fix as a regression
    invariant.
  - |-
    Probe pin — promote P-009 to cover the QueryExample detail surface
    specifically; the inference from the shared Markdown.tsx element holds
    structurally but is not empirically verified for the
    /data-modelling/query-examples/{id} route.
  - |-
    Document on the data-modelling live doc page that query example bodies
    are stored as raw Markdown without HTML sanitisation; only trusted
    operators should be granted QUERY_EXAMPLE_CREATE. The doc-page admission
    alone is the operator-facing transparency in lieu of (or alongside) the
    code fix.
notes: |-
  NEW invariant captured in batch 2026-05-20V from the QueryExampleController
  sidecar's F-004 cross-batch coherence finding. The 4-surface closure means
  F-004 is now fully end-to-end on every user-curated Markdown affordance the
  platform exposes; the shared Markdown.tsx renderer is the SINGLE FIX POINT
  for all four surfaces simultaneously.

  The query-example surface is the FOURTH AND LAST primary user-curated
  Markdown surface in the platform's data-modelling and discovery pillars.
  Additional Markdown affordances (alert descriptions, owner descriptions,
  custom-metadata field values) are SECONDARY surfaces — they use the same
  Markdown.tsx wrapper and would be closed by the same single fix.

  Cross-cutting connections:
    - Master invariant: markdown-rendering-via-rehype-raw-without-rehype-sanitize-stored-xss-surface-on-internal-description
    - Companion 3-surface batch-U invariant: f-004-stored-xss-extends-to-term-definition-third-markdown-surface
    - Companion systemic invariant: no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic
    - Companion read-collaborative invariant: read-collaborative-cross-owner-enumeration
    - Companion sensitivity-delta finding: SQL body in query field carries
      higher info-disclosure surface than prose-only Markdown surfaces

  Three DOC-NNN candidates flow:
    (a) Code fix — rehype-sanitize in Markdown.tsx (single point of remediation
        for all four user-curated surfaces)
    (b) Backend sanitisation — Jsoup at the four primary-write methods
    (c) Docs admission — disclose the stored-XSS surface on the data-modelling
        live doc page until the code fix lands
