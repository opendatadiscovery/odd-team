security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  - INTERNAL_ONLY
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Single chokepoint — the three Mono returns are the only
      principal-resolution primitives in the codebase. Consistent across
      all 4 UI auth modes + S2S.
  owner_scoping:
    verdict: RESPECTS
    detail: |-
      This operation IS the per-caller owner resolution primitive. Every
      downstream `WHERE OWNERSHIP.OWNER_ID = ?` JOIN is parameterised by
      the OwnerPojo this operation returns.
  strengths:
  - Single chokepoint — 15 callsites all funnel through three Monos
  - Reactor-Context-based principal flow eliminates the
    controller-must-thread-Authentication pattern
  - Pure identity resolution; authorization decisions happen downstream
    (permission extractors, SecurityRule matchers) — concerns cleanly
    separated
  weaknesses:
  - Cross-mode bleed (LOGIN_FORM + LDAP both produce provider=null)
  - S2S 'ADMIN' literal collides with operator-named users
  - No auto-create on OAUTH2/LDAP first login — silent empty results
  - Empty-SecurityContext silently propagates — regression detection
    surface
  - No per-request or per-session caching — multiplicative DB round-trips
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    fetchAssociatedOwner invocation issues a SELECT against
    user_owner_mapping JOIN owner for every owner-scoped read; 15
    callsites multiplicative across the platform's HTTP request volume.
  - |-
    ReactiveSecurityContextHolder.getContext() invoked twice per
    getCurrentUser AND once per fetchAssociatedOwner — per-call
    Reactor context-switch overhead.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Each principal resolution is independent; no batched lookup.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Stateless — scales horizontally with no coordination.
notes: |-
  NEW operation captured in batch 2026-05-19K. The architectural anchor
  for ADR-CANDIDATE-015 — every owner-scoped reader of the platform
  flows through this operation. The parameter-less Mono interface
  contract is the LOAD-BEARING design statement.

  Cross-cutting connections:
    - Pairs with the "AuthIdentityProvider (per-request principal
      resolution chokepoint)" entity concept — that captures the
      service-level chokepoint; this operation captures the three-step
      flow
    - Pairs with the "Owner-scoped routes — controllers take NO principal
      parameter; principal flows via reactor Context" invariant — this
      operation is the runtime that implements that invariant
    - Pairs with the "Owner-link is the gate for owner-scoped views"
      invariant — this operation IS the gate
    - Companion of the "Resolve current user policies (authorization hot
      path)" operation — both fire per request; this resolves the
      principal+owner, the other resolves the authorisation policy

  Two DOC-NNN candidates flow from this operation:
    (a) Document the three-Mono interface contract on an internal
        architecture doc (currently undocumented; load-bearing decision)
    (b) Promote ADR-CANDIDATE-015 to a real ADR with this operation as
        the canonical implementation reference
