proposed_canonical: S2S Ingestion Pipeline
rationale: 'NEW concept from batch 2026-05-12F that CLOSES the loop opened by batch
  B''s IngestionDataEntitiesFilter. The pipeline composes three concerns into the
  operator-facing S2S ingestion surface: (1) path-whitelisting (`/ingestion/**` is
  in `SecurityConstants.WHITELIST_PATHS`); (2) path-scoped auth filter (`IngestionDataEntitiesFilter`
  gated by `auth.ingestion.filter.enabled`, defaults FALSE — bundled deployment ships
  UNAUTHENTICATED); (3) controller (`IngestionController.postDataEntityList`, 4-line
  proxy with no `@PreAuthorize`). Distinct from the GLOBAL `S2sAuthenticationFilter`
  (`auth.s2s.enabled`, X-API-Key, single shared cluster-wide token granting ADMIN
  globally). main-concepts.md names canonical S2S aliases (''Server-to-server (S2S)
  authentication'', ''Ingestion authentication filter'') but does NOT explain the
  end-to-end pipeline. The doc-side gap is the absence of a canonical `/configuration-and-deployment/data-ingestion`
  page (today the URL returns 404). HIGH-priority canonicalisation candidate: create
  the missing data-ingestion operator-facing page that walks the pipeline end-to-end.'
contributing_concepts:
- POST /ingestion/entities controller (postDataEntityList batch F)
- IngestionDataEntitiesFilter path-scoped auth (batch B)
- CollectorController.regenerateCollectorToken — mints/rotates the per-datasource
  shared secret (batch A)
- WHITELIST_PATHS exemption from UI auth chain
- Payload-driven datasource scoping (data_source_oddrn in body)
- Default-off auth (auth.ingestion.filter.enabled=false ships in application.yml:48)
suggested_add_to_docs: true
