    Fix surface 4 (UX patch) — empty-state copy refinement at
    AlertsList's EmptyContentPlaceholder describing the open-
    only semantic.
notes: |-
  NEW invariant captured in batch ZL (2026-05-26) FINAL refresh.
  This is the Alerts.tsx primary-source confirmation of the
  Category B drift class first surfaced in TagController batch
  19 (the listMostPopular case). The Alerts All-tab instance is
  worth dedicated billing because:
    (a) The All tab is the DEFAULT landing of /alerts;
    (b) The doc copy is EXPLICIT about 'open AND resolved';
    (c) The drift affects security/compliance audit workflows
        ('what happened last quarter') — these workflows mostly
        DO need resolved-too.

  Cross-batch coherence (LSN-018):
    - The `second-securityconstants-bug-alerts-status-wrong-permission`
      invariant is a SECOND drift on the same /alerts surface
      (the status PUT is gated by DATASET_FIELD_ADD_TERM, not
      DATA_ENTITY_ALERT_RESOLVE).
    - Two drifts on one feature = a feature-level hot spot for
      maintainer attention. Worth a Quality Bar audit of the
      whole /alerts subtree.
