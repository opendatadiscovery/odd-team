terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Returns IntegrationPreviewList (list endpoint) OR Integration (single-fetch
    endpoint) JSON payload to the caller. The Integration payload includes
    `content_blocks[].code_snippets[].arguments[].static_value` with
    `platform_url` substituted in (potentially leaking an internal hostname
    under DISABLED). The list endpoint returns ALL wizards in case-insensitive
    id order; the single endpoint returns the matching wizard OR 204 No
    Content for unknown ids.
  evidence: |-
    IntegrationController.java:19-22, 25-27 + IntegrationMapper.java:23-50
    + StaticArgumentMappingContext.java:11-25 + ResourceFilesIntegrationRegistry.java:15-22
  cardinality_per_call: 1
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — primary source confirmed; no probe yet. The amplification factor
  is 1 per request: one HTTP call → one page-render side effect. There is
  no per-request DB I/O (registry is in-memory), no fan-out across resources,
  no SSE. The structural amplification concern is at the deployment
  boundary: a single corrupt wizard YAML in an overlay jar takes down the
  ENTIRE application context (`IllegalStateException` at
  IntegrationRegistryFactory.java:48-50, 56-60) — a 1:1 dependency between
  any wizard manifest and the platform's ability to boot. Operator-visible
  amplification: copy-pasting a wizard snippet with default placeholder
  `http://your.odd.platform` propagates the placeholder to N collector
  deployments, each pointing at a non-existent host.
observed_vs_expected:
  facets:
  - facet: installed field is structurally dead
    observed: |-
      Every Integration / IntegrationPreview response carries
      `installed: false` (IntegrationMapper.java:27, 30 — `@Mapping(target =
      "installed", constant = "false")`). The OpenAPI contract
      (components.yaml:64-70) declares `installed: boolean` as REQUIRED.
      The UI consumes this field at IntegrationPreviewItem.tsx:44-51 via
      `{installed && (<Integrated badge />)}` — the badge code path
      is dead because the value is always false. No code path anywhere
      in `<odd-platform-repo>/odd-platform-api/src/main` inspects whether
      an integration is actually wired into the platform (grep `installed`
      returns only the two mapper constant lines).
    expected: |-
      The field should reflect whether the integration is actually wired
      (e.g. a Snowflake datasource has been registered AND the user's
      collector is reachable). OR the field should be removed from the
      OpenAPI contract if it is structurally dead by design.
    drift_class: installed_field_hardcoded_false_dead_ui_badge_never_renders
    provenance: |-
      STATIC — primary source at IntegrationMapper.java:27, 30 +
      components.yaml:64-70 + IntegrationPreviewItem.tsx:44-51 + grep
      `installed` across the codebase 2026-05-25. Severity MEDIUM —
      operator cannot distinguish 'wizard exists, integration done' from
      'wizard exists, integration pending'.
  - facet: silent 204 on missing id
    observed: |-
      `GET /api/integrations/{unknown-id}` returns HTTP 204 No Content,
      NOT 404. ResourceFilesIntegrationRegistry.java:15-17 issues
      `Mono.justOrEmpty(registry.get(id))` which returns `Mono.empty`
      on missing id; the controller chain `.map(ResponseEntity::ok)`
      is short-circuited; Spring WebFlux translates `Mono.empty` to
      204. The OpenAPI contract (openapi.yaml:75-81) declares only
      the 200 response; no 404 is contracted, no 204 is contracted.
      No `switchIfEmpty(Mono.error(new NotFoundException(...)))` on
      the path. Compare to `MetadataFieldServiceImpl.get` which throws
      NotFoundException on missing id at lines 30-34.
    expected: |-
      Missing id should return HTTP 404 with a `NotFoundException`
      message identifying the missing resource. OR the OpenAPI contract
      should declare 204 as an expected response and the docs should
      explain the semantic ('wizard does not exist').
    drift_class: silent_204_on_missing_id_no_404_no_documented_response
    provenance: |-
      STATIC — primary source at IntegrationController.java:19-22 +
      IntegrationServiceImpl.java:20-23 + ResourceFilesIntegrationRegistry.java:15-17
      + openapi.yaml:75-81. Probe P-126 emitted to pin the 204 actual
      response. Severity MEDIUM — operator-visible HTTP behaviour
      undocumented; SDK generators may auto-generate response handlers
      that don't expect 204 on a 200-only path.
  - facet: default platform_url placeholder in copy-pasted snippets
    observed: |-
      `application.yml:209` has `odd.platform-base-url` commented out;
      the `@Value("${odd.platform-base-url:http://your.odd.platform}")`
      default at StaticArgumentMappingContext.java:16 resolves to the
      literal placeholder `http://your.odd.platform`. IntegrationMapper.java:38-45
      substitutes this into every code-snippet argument with
      `parameter="platform_url"` and `static: true`. An operator running
      a default-config deployment, reading the wizard, copy-pasting the
      snippet into a collector config, points the collector at a
      non-existent host. The live wizard doc page (WebFetched 2026-05-25)
      mentions the fallback exists but does NOT warn operators that this
      is the default deployment state.
    expected: |-
      Either (a) the default deployment should require an operator to
      set `odd.platform-base-url` before serving wizards, OR (b) the
      docs should warn operators that the default is a recognisable
      placeholder, OR (c) the wizard's substituted output should signal
      the placeholder visibly (e.g. wrap in `<<REPLACE_ME>>` markers
      rather than a URL-shaped string).
    drift_class: default_platform_url_placeholder_into_copy_pasted_snippets
    provenance: |-
      STATIC — primary source at application.yml:209 (commented) +
      StaticArgumentMappingContext.java:16 + IntegrationMapper.java:38-45
      + live wizard doc page WebFetched 2026-05-25 status 200. Severity
      LOW (operator action required to misuse; placeholder is recognisable).
  - facet: case-insensitive id collision silently merges wizards
    observed: |-
      IntegrationRegistryFactory.java:32-37 constructs the TreeMap with
      `Comparator.comparing(String::toLowerCase)` (case-insensitive
      ordering AND duplicate-detection) and merge function
      `(o1, o2) -> o2` (last-wins). Two YAMLs with ids `Snowflake` and
      `snowflake` collapse into ONE registry entry — the later-loaded
      survives. With `classpath*:` scanning multiple jars, the load
      order is filesystem-dependent and non-deterministic across
      deployments. An operator overlaying their own `snowflake.yaml`
      to override a vendor's `Snowflake.yaml` MAY succeed or MAY not
      depending on jar order. No live doc page mentions this constraint.
    expected: |-
      Either (a) the comparator should be case-sensitive (so `Snowflake`
      and `snowflake` coexist as distinct registry entries), OR (b) the
      registry construction should warn / refuse on case-insensitive
      collision (log a WARN, fail boot, or apply a documented merge rule).
    drift_class: case_insensitive_id_collision_last_load_wins_silent_merge
    provenance: |-
      STATIC — primary source at IntegrationRegistryFactory.java:32-37 +
      `classpath*:` glob semantics. Severity LOW (requires authoring
      two wizards with case-divergent ids — uncommon in practice but
      latent bug-vector for vendor + operator wizard overlays).
  - facet: boot-time fail-fast on a single corrupt wizard YAML
    observed: |-
      IntegrationRegistryFactory.readManifest (:53-61) catches
      `IOException` and rethrows as `IllegalStateException` with message
      including the resource filename (line 59); `readManifests` (:42-51)
      catches at the resource-scan level. A single malformed YAML in
      any overlay jar takes the entire application context construction
      down at boot. There is no skip-broken-and-continue, no warn-and-omit
      semantics. An operator adding a buggy wizard YAML to their overlay
      finds the platform refuses to start.
    expected: |-
      The error message including the filename is good (fast root-cause);
      operator deployment-time validation of wizard YAMLs is the
      structural mitigation. Either (a) document the boot-time guarantee
      ('a malformed wizard YAML aborts platform startup'), OR (b) add a
      skip-with-WARN mode controlled by a property (e.g. `odd.wizard.fail-on-malformed=true`
      default — operator can flip to false for tolerant boot).
    drift_class: boot_time_fail_fast_single_corrupt_yaml_aborts_application_context
    provenance: |-
      STATIC — primary source at IntegrationRegistryFactory.java:48-50,
      56-60. Severity LOW (operator-induced; fail-fast is the documented
      intent per the implicit ADR
      `fail_fast_on_malformed_wizard_yaml_explicit_messaging_over_silent_skip`).
  - facet: NO RBAC permission for /api/integrations* — any authenticated user reads
    observed: |-
      Neither `SecurityConstants.SECURITY_RULES` (`SecurityConstants.java:98+`)
      nor `PolicyPermissionDto` defines an `INTEGRATION_*` permission entry
      (grep `INTEGRATION` in PolicyPermissionDto.java returns zero matches).
      Both endpoints fall through to `AuthorizationCustomizer.customize`'s
      catch-all `.pathMatchers("/**").authenticated()` (AuthorizationCustomizer.java:29-30).
      A READ_ONLY-role user, a user with only `DATA_ENTITY_TAGS_UPDATE`,
      or any other no-management-permission user gets the full wizard
      surface. The live permissions page (WebFetched 2026-05-25 status 200)
      lists FIVE permission categories (Data entity / Term / Query Example
      / Lookup Table / Management) — none reference integration permissions.
    expected: |-
      This is intentional per the implicit ADR `open_read_by_design`
      (wizard manifests are documented public-knowledge artefacts), but
      the documentation should make the posture explicit. The live wizard
      doc page should state 'any authenticated user can read the wizard
      registry'. Operators auditing the platform's security posture cannot
      find this from the docs today.
    drift_class: no_rbac_permission_open_read_authenticated_users
    provenance: |-
      STATIC — primary source at SecurityConstants.java:98+ + grep
      `INTEGRATION` in PolicyPermissionDto.java returning zero +
      AuthorizationCustomizer.java:29-30 + WebFetch 2026-05-25
      permissions page. Severity LOW (intentional posture, documentation
      gap).
  - facet: DISABLED-mode anonymous reachability with platform_url leak
    observed: |-
      Under `auth.type=DISABLED`, DisabledAuthSecurityConfiguration.java:13-18
      applies `.anyExchange().permitAll()`; any network caller able to
      reach the HTTP port can `GET /api/integrations` and read every
      wizard manifest, including the substituted `platform_url`. If
      operators set `odd.platform-base-url` to an internal hostname
      (a typical deployment pattern for the notification and slack paths
      that share the property), the internal URL leaks via this
      anonymous-readable surface. DISABLED is documented as dev-only,
      but the bundled application.yml DEFAULT is `auth.type=DISABLED`
      — operators who don't override are running in this posture. The
      live wizard doc page (WebFetched 2026-05-25) does NOT mention
      DISABLED's anonymous access posture.
    expected: |-
      Either (a) the wizard endpoints should be in a non-permitAll
      list under DISABLED (the configuration would need to fork DISABLED
      to permit some paths anonymously and gate others), OR (b) the
      docs should warn operators that DISABLED exposes the wizard
      surface anonymously, OR (c) `odd.platform-base-url` substitution
      should be disabled under DISABLED to avoid leaking internal
      hostnames.
    drift_class: disabled_mode_anonymous_reachability_platform_url_leaks
    provenance: |-
      STATIC — primary source at DisabledAuthSecurityConfiguration.java:13-18
      + StaticArgumentMappingContext.java:16 + IntegrationMapper.java:38-45
      + WebFetch 2026-05-25 wizard page (silent). Severity MEDIUM —
      latent leak depending on operator deployment of `odd.platform-base-url`
      to an internal hostname. REFACTOR-185 22nd surface (DISABLED-mode
      bypass cluster).
  - facet: no pagination on getIntegrationPreviews
    observed: |-
      The endpoint returns the full registry contents in one response;
      the registry is `Flux.fromIterable(registry.values()).map(IntegrationOverviewDto::integration).collectList()`
      (ResourceFilesIntegrationRegistry.java:21 + IntegrationServiceImpl.java:27).
      A deployment with 100+ wizard YAMLs returns the full list every
      page-load. There is no `?page=&size=`, no `?query=` (the UI filter
      via `query` state is client-side only — IntegrationPreviewList.tsx:26-29
      filters in JS after receiving the full list). For the wizard-registry
      use case (typical N < 50) this is fine; the limitation is
      architectural rather than a bug.
    expected: |-
      For typical N < 50 this is acceptable. For operator overlays
      that ship 100+ wizards (vendor-specific deployments), server-side
      pagination + filtering would reduce per-page-load cost. Either
      add `?page=&size=` + `?query=` parameters or document the
      registry-size guidance ('wizard overlay should keep N < 50').
    drift_class: no_pagination_full_registry_per_request
    provenance: |-
      STATIC — primary source at ResourceFilesIntegrationRegistry.java:19-22
      + IntegrationServiceImpl.java:25-28 + IntegrationPreviewList.tsx:26-29.
      Severity LOW (not currently observed in any deployment).
  - facet: empty-default-registry trap on default checkout
    observed: |-
      A default `<odd-platform-repo>` checkout has ZERO `META-INF/wizard/*.yaml`
      files (Glob 2026-05-25 returned no hits across the entire repo).
      The registry is empty by default; `getIntegrationPreviews` returns
      an empty items list; the UI's IntegrationPreviewList.tsx:71-75
      renders an `EmptyContentPlaceholder` with no error message. A
      developer running locally from source sees an empty Integration
      panel with no error — they may believe the wizard feature is
      broken when it is actually a configuration step (overlaying wizard
      YAMLs via docker image or operator-supplied classpath additions).
      The live wizard doc page does not warn that the default-build
      state is empty.
    expected: |-
      Either (a) bundle a small set of default wizards in the repo so
      developers running locally see a populated panel out-of-the-box,
      OR (b) document the empty-default behaviour with a pointer to
      the overlay mechanism, OR (c) emit a startup log message
      ('No wizard manifests found on classpath — the Integration panel
      will be empty').
    drift_class: empty_registry_default_checkout_state_undocumented
    provenance: |-
      STATIC — primary source at IntegrationRegistryFactory.java:26
      (`classpath*:` glob) + Glob `<odd-platform-repo>/**/META-INF/wizard/*.yaml`
      returns zero hits + IntegrationPreviewList.tsx:71-75. Severity
      LOW (developer-onboarding confusion; not a production issue).
  - facet: live docs silent on auth posture and 204 response and dead installed field
    observed: |-
      Four URLs WebFetched 2026-05-25 at status 200: (1) the wizard
      page (`https://docs.opendatadiscovery.org/integrations/integrations/integration-wizard`)
      is silent on the auth posture — does NOT state that
      `/api/integrations*` requires authentication under
      LOGIN_FORM/OAUTH2/LDAP, does NOT state DISABLED mode allows
      anonymous access, does NOT mention that there is no RBAC
      permission specific to the wizard; (2) the integrations overview
      page (`https://docs.opendatadiscovery.org/integrations/integrations`)
      mentions the API endpoints but does not discuss RBAC; (3) the
      API-reference page (`https://docs.opendatadiscovery.org/developer-guides/api-reference/integrations`)
      does NOT document response schemas, HTTP status codes
      (including the 204-on-missing-id behaviour), or authentication
      requirements; (4) the permissions page
      (`https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions`)
      does not reference integration permissions. The OpenAPI contract
