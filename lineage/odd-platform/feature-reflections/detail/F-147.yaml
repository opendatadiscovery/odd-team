- id: H-004
  hypothesis: "When a user wants to open a search result in a new background tab (middle-click / Ctrl+click) to keep scanning the list, it opens in a new tab as any link would."
  derivation: "Product-owner UX seed (Rule 9 — 'intuitive and consistent with how the same task is done elsewhere / across device interaction patterns'): opening list items in background tabs is the universal browse-many-then-read gesture; a real <a href> satisfies it for free."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Middle-click / Ctrl+click does nothing useful. The row is a <div> wired with a JS
      `onClick={() => navigate(detailsLink)}` (ResultItem.tsx:75) and carries NO `href` — there is no real
      anchor anywhere in the row (the name cell is a plain MUI Typography, ResultItem.tsx:91-98). React
      Router's `navigate()` is a same-tab programmatic push; it has no new-tab, bookmark, copy-link, or
      "open in new window" behaviour. A user accustomed to middle-clicking results to queue several entities
      in background tabs gets no response from a middle-click and a useless empty target from Ctrl+click.
    evidence:
      - sidecar: "(source read — ResultItem.tsx, hop-1 sidecar unresolved)"
        section: render
        cite: "ResultItem.tsx:42, :72-76, :91-98"
        note: "detailsLink is passed to navigate() not to an href; the name cell is plain Typography, no anchor. source_read_for_validation: true."
    operator_visible_failure: |
      (1) The "open several results in background tabs, then read each" workflow — standard for anyone
      triaging a list of candidates — is unavailable; the user is forced into open-one / go-Back / open-next,
      which (per H-002) inflates view_count on every round-trip. (2) Copy-link-address and bookmark-this-result
      from the row are also impossible because there is no anchor. (3) This is a convenience + consistency
      gap a real `<a href={detailsLink}>` (the PLT-091 suggested fix) resolves while ALSO fixing H-003's
