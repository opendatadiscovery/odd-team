observed_vs_expected:
  facets:
    - facet_id: entity_class_palette_baked_into_theme_not_data_driven
      drift_class: ui_class_palette_static_no_per_deployment_customisation
      severity: LOW
      observed: |-
        EntityClassItem.styles.ts:16 reads
        `theme.palette.entityClass[$entityClassName]` — a STATIC theme
        palette indexed by the DataEntityClassNameEnum value. Adding a new
        class via OpenAPI regen requires both the enum extension AND a
        theme palette extension; otherwise the chip renders with empty
        backgroundColor (`''` per the ternary at line 16). No fallback
        colour, no warning, no log.
      expected: |-
        Either (a) document that the class palette must be extended when
        the enum is, OR (b) provide a per-deployment-customisable palette
        + a deterministic fallback colour when an unknown class arrives.
      operator_visible_consequence: |-
        Today: works because the enum + palette are kept in lockstep via
        the same OpenAPI codegen sweep. Tomorrow: a partial regen (new
        enum value, theme not updated) renders a chip with no
        backgroundColor — a transparent text-only badge that looks broken
        in dense lists. Maintenance contract is undocumented.
      ui_unverified: true
      ui_unverified_reason: |-
        The exact set of theme.palette.entityClass keys vs the
        DataEntityClassNameEnum union has not been cross-checked. A future
        enrichment of the theme palette + the generated-sources enum
        confirms whether the palette is complete OR carries an unrecorded
        drift.
    - facet_id: entity_type_no_colour_coding_visual_asymmetry_with_class
      drift_class: ui_type_no_colour_only_text_visual_asymmetry
      severity: LOW
      observed: |-
        EntityTypeItem renders a uniform-background chip; only the text
        changes per type. EntityClassItem colour-codes per class via
        theme.palette.entityClass. An operator scanning a dense list
        cannot visually distinguish entity TYPES (TABLE vs VIEW vs
        DASHBOARD vs JOB vs MODEL) at a glance the way they can
        distinguish CLASSES.
      expected: |-
        Either (a) symmetric colour-coding (type palette), OR (b) document
        the deliberate asymmetry (class is the primary taxonomic axis;
        type is secondary and labelled-only).
      operator_visible_consequence: |-
        A user filtering a long list by type-relevance has to read every
        chip. The class-coloured-but-type-uncoloured visual hierarchy
        biases attention toward class.
    - facet_id: entity_class_empty_when_entity_class_name_undefined
      drift_class: ui_widget_empty_render_on_undefined_prop_no_fallback
      severity: LOW
      observed: |-
        EntityClassItem.tsx:18-28 — both the title and the inner text
        render only when `entityClassName` is defined. When undefined the
        chip is invisible (an empty Box with no content + the conditional
        background colour). EntityTypeItem has a similar branch via the
        formatter.
      expected: |-
        Either (a) require entityClassName as a non-optional prop, OR (b)
        render a placeholder ('Unknown class', '—') when undefined, OR (c)
        skip the chip render entirely (return null) when undefined.
      operator_visible_consequence: |-
        Today: an entity payload arriving without `entityClasses[]` (an
        ingestion gap, a manually-created entity without class assignment)
        renders empty chips inline — visual whitespace in a list, no
        signal to the user that the entity is unclassified.
    - facet_id: dct_special_case_hardcoded_alongside_openapi_enum
      drift_class: ui_type_enum_union_with_string_literal_outside_spec
      severity: LOW
      observed: |-
        EntityTypeItem.tsx:9 — the prop type is
        `DataEntityTypeNameEnum | 'DCT'`. The string literal `'DCT'` is
        hardcoded outside the OpenAPI-generated enum. A future regen of
        DataEntityTypeNameEnum may add DCT to the enum proper (rendering
        the union redundant) OR may not (leaving the special case
        permanent). The reason `'DCT'` lives outside the enum is not
        documented in the file.
      expected: |-
        Either (a) add a comment naming why DCT is special-cased outside
        the spec, OR (b) include DCT in the OpenAPI enum at the next spec
        revision.
      operator_visible_consequence: |-
        Maintenance-only; no operator-visible defect today. A future
        maintainer dropping the `| 'DCT'` union as "type cleanup" silently
        breaks every surface where the badge renders a DCT type.
