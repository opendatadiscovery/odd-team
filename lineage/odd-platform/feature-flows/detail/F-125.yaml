cross_pillar_relationships:
  - pillar_id: P-09
    kind: feeds
    via: |-
      Token authentication on `/ingestion/*` paths (P-09 Ingestion filter)
      consumes token.value plaintext-equality match in
      ReactiveCollectorRepositoryImpl.getByToken. The credential lifecycle
      surface is the SECURITY load-bearing infrastructure for ingestion
      authentication.
  - pillar_id: P-10
    kind: feeds
    via: |-
      Every Collector and DataSource integration depends on a token
      generated through this lifecycle. Rotation invalidates the producer's
      auth immediately; orphan tokens persist forever beyond the
      producer's existence.
notes_for_maintainer: |-
  Probe-needed (local-only docker-compose stack): boot platform, create
  100 collectors, delete 50, count `SELECT count(*) FROM token` vs
  `SELECT count(*) FROM collector WHERE deleted_at IS NULL` — confirm
  orphan count grows monotonically.

  Follow-up scope candidates:
  - SEC-NNN (HIGH): add housekeeping query to HousekeepingJobManager:
    `DELETE FROM token WHERE id NOT IN (SELECT token_id FROM collector
    WHERE deleted_at IS NULL) AND id NOT IN (SELECT token_id FROM
    data_source WHERE deleted_at IS NULL) AND id NOT IN (...)`. Schedule
    cadence: daily.
  - SEC-NNN (HIGH): encrypt-at-rest the token.value column (pgcrypto OR
    application-layer with operator-config key). Migrate via new column +
    dual-write + read-only-from-new + drop-old over multiple releases.
  - SEC-NNN: add 24-hour grace period on rotation — insert NEW token row,
    mark OLD as `superseded_at`, accept both during grace, then delete OLD.
    Schema migration: drop partial unique `collector_token_unique`,
    add `superseded_at` column.
  - REFACTOR-NNN: add ActivityEvent emission on token rotation +
    collector delete + datasource delete (currently silent).
  - DOC-NNN: operator security page admonition: "Collector and DataSource
    tokens are stored as plaintext in PostgreSQL `token` table; secure your
    Postgres backups and replicas accordingly. Soft-deleted collectors
    leave token rows in the table indefinitely until a future housekeeping
    migration."

  This thread is the SHAPE that LSN-001 and LSN-002 were FOR (silent-default
  footguns shipping operator-trust failures). Maintainer should consider
  whether this constitutes an LSN-NNN candidate in its own right.

  Cluster_with [F-020, F-031] per source SHB. F-020 (Collector Lifecycle)
  + F-031 (DataSource Lifecycle) name the WHAT-it-does of token creation;
  F-125 names the STORAGE-LAYER + HOUSEKEEPING-GAP. Cross-pillar with
  F-010 (Housekeeping) — the fix is in HousekeepingJobManager but the
  feature surface is credential-lifecycle.

  Layer-4b reflection (2026-06-03, feature-reflector/0.3.0): 12 hypotheses
  (6 confirmed / 2 contradicted / 3 partial / 1 probe-needed). use_case_coverage
  1/12 verified. Drift-class CORRECTION surfaced: `regenerate_token_ui_one_click_no_confirmation_modal`
  is factually WRONG — a ConfirmationDialog DOES exist on both token controls
  (DataSourceItemToken.tsx:37-49 + CollectorItemToken.tsx:37-49); the real gap
  is the dialog carries no consequence warning. Net_new load-bearing finding:
  the orphan-token HOUSEKEEPING-SWEEP (H-001) is only partially tracked — PLT-087
  D1 covers DataSource per-delete cleanup; the Collector-side cleanup AND the
  daily housekeeping sweep are net_new. See feature-reflections/detail/F-125.yaml.
