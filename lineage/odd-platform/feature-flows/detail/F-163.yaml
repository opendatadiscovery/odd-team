feature_id: F-163
pillar_id: P-08
pillar_anchored_id: P-08:F-019
pillar_anchored_feature_name: One-Shot Token Reveal Affordance Pattern
feature_name: |-
  Cross-Management one-shot token reveal pattern — the shared UX
  shape used by DataSourceItemToken AND CollectorItemToken to handle
  "ONE-SHOT" plaintext-then-masked credential display. Both
  components use the IDENTICAL substring-prefix detection
  (`token.value.substring(0, 6) === '******'`) at lines 26-27 to
  decide between Regenerate (masked state) and Copy (plaintext state),
  and BOTH parent items (DataSourceItem.tsx:110-121 +
  CollectorItem.tsx:87-98) render an InfoItem warning banner ("Save
  token in a secure location. You will not be able to retrieve it
  again.") when the token is hidden=false. The pattern is a coherent
  cross-Management UX feature distinct from each lifecycle feature's
  own surface (F-020 / F-031) AND distinct from the backend
  plaintext-everywhere claim — F-163 anchors the UI affordance pattern
  itself: how the operator perceives the reveal-once contract, what
  copy / rotate / warning UX is shared across both surfaces, and
  where the pattern's fragility surfaces.
seeded_from: ui-review-2026-05-26
seeded_at: '2026-05-26'
discovered_from_entry_point: |-
  Two parallel UI surfaces sharing the identical token-reveal pattern:
   - ui-component:components/Management/DataSourcesList/DataSourceItem/DataSourceItemToken/DataSourceItemToken.tsx
   - ui-component:components/Management/CollectorsList/CollectorItem/CollectorItemToken/CollectorItemToken.tsx
  Both mount one-per-row inside their parent list items.
