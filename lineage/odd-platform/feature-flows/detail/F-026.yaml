discovered_from_entry_point: rest:POST/GET/PUT/PATCH/DELETE /api/referencedata/** (14-path controller-class surface)
description: |-
  Lookup Tables are the Master Data Management pillar's operator-curated
  reference data surface — the canonical lists, lookup values, and code
  tables that downstream pipelines and BI tools join against. The
  feature exposes 14 paths (17 operations) across four resource groups
  on ReferenceDataController:
  - Table CRUD (POST create / GET get / PUT update / DELETE delete /
    GET list rows) — 5 endpoints
  - Column CRUD (POST add columns / PATCH update column / DELETE delete
    column / GET get column) — 4 endpoints
  - Row CRUD (POST add rows / PUT update row / DELETE delete row) — 3
    endpoints
  - Faceted search session (POST create search / GET get facets / PUT
    update facets / GET get results) — 4 endpoints

  Each lookup table has a backing physical PostgreSQL table in
  `lookup_tables_schema` named `n_{namespaceId}__{lowercased_underscored_name}`
  (ReferenceDataServiceImpl.java:191-194) — operator-curated reference
  data is stored as REAL Postgres tables, SQL-joinable from downstream
  BI; the catalog-side `lookup_tables` row carries the metadata.

  The user-observable contract (per the live
  `https://docs.opendatadiscovery.org/features/master-data-management/lookup-tables`
  doc, WebFetched 2026-05-20 status 200): "The full HTTP API for Lookup
  Tables is documented at API Reference → Reference Data — 16 endpoints
  across four groups" covering Table CRUD, Column CRUD, Row CRUD, and
  Search under `/api/referencedata/`. The doc names 9 PostgreSQL field
  types; code enumerates 9 enum constants but 8 distinct SQL types
  (TYPE_INTEGER and TYPE_SERIAL share INTEGER).

  The user-observable reality, per batch-V primary-source audit of the
  ReferenceDataController class sidecar, surfaces FOURTEEN load-bearing
  drift facets. The HIGH-severity findings: (a) the 9 LOOKUP_TABLE_*
  permissions use NO_CONTEXT resolver — a Policy granting
  LOOKUP_TABLE_UPDATE permits modifying ANY lookup table, not just
  those owned by the user's Owner (architectural inconsistency with
  TERM-scoped + DATA_ENTITY-scoped sibling permissions); (b) row values
  + column names + table name + description are persisted unchanged
  (LookupCharValidator.java:14-17 returns the input string verbatim) —
  the F-004 XSS family extends to this surface; (c)
  `updateLookupTableField(columnId, formData)` discards the
  `lookupTableId` path parameter — a user authorized on table A can
  PATCH a column belonging to table B by spoofing the URL; (d) cascade
  orphan on parent DataEntity delete — no FK enforces the inverse
  direction.

  Reads (6 of 14 endpoints) carry NO SecurityRule entry — only the
  global authentication filter gates them. Compatible with the
  platform-wide read-collaborative posture but not stated in the live
  docs for this pillar.
