observed_vs_expected:
  facets:
  - facet: AlertManager path not gated by IngestionDataEntitiesFilter
    observed: POST /ingestion/alert/alertmanager bypasses IngestionDataEntitiesFilter (the filter's path matcher is /ingestion/entities
      POST only — confirmed from primary source across multiple sidecars). Under auth.type=DISABLED, the endpoint is fully
      anonymous and accepts any AlertManager-shaped payload. Under LOGIN_FORM/OAUTH2/LDAP, ANY authenticated user can POST
      — there is no DataEntity-scope check, no ALERT_CREATE permission, no S2S-token check.
    expected: Either documented S2S-token gating (the AlertManager webhook is by definition a server-to-server channel; typical
      practice is shared-secret header or mutual-TLS) OR an IngestionDataEntitiesFilter-equivalent path matcher on this path
    drift_class: webhook_receiver_ungated
    provenance: STATIC — primary-source verification in batch-H ReactiveAlertRepositoryImpl sidecar known_security_gaps[1]
      + AlertManagerController sidecar. Proposed Type-7 probe — POST anonymous AlertManager-shaped payload to a docker-compose
      stack with AUTH_TYPE=DISABLED + verify alert row appears in /api/alerts attributed to whatever entity_oddrn the payload
      claimed.
  - facet: untrusted entity_oddrn enables cross-tenant attribution
    observed: AlertServiceImpl.handleExternalAlerts maps `labels.entity_oddrn` (a payload field, untrusted) directly to `AlertPojo.dataEntityOddrn`
      at line 178 — NO validation that the oddrn refers to a real DataEntity, NO check that the calling principal owns the
      entity, NO sanitisation. A hostile POST can attribute alerts to ANY data entity. Combined with the cross-owner read
      surface (REFACTOR-024 / F-007 facet 3), an attacker can inject false-positive alerts on competitors' data entities that
      surface on the platform-wide "All" tab.
    expected: Server-side validation — assert entity_oddrn exists in DATA_ENTITY AND the calling principal has permission
      to alert on it
    drift_class: untrusted_input_to_authoritative_state
    provenance: STATIC — primary-source verification in batch-H ReactiveAlertRepositoryImpl sidecar known_security_gaps[1]
      + AlertServiceImpl.java:178 (the verbatim mapping)
  - facet: forge + display compound with REFACTOR-024
    observed: F-007 (forge alerts) + REFACTOR-024 (cross-owner read at listAllWithStatusOpen) compound into a full forge-and-display
      cycle. An attacker (anonymous under DISABLED; any authenticated user otherwise) POSTs false-positive alerts attributed
      to other teams' data entities; those alerts are immediately readable on the platform-wide /api/alerts feed by every
      authenticated user. The "All" tab's live-docs framing ("Platform-wide triage; stewards and admins watching the full
      alert surface") makes the displayed alerts authoritative-looking — a reviewer triaging the All tab cannot distinguish
      forged alerts from real ones. The compound surface is the canonical example of why cross-cutting drift (one feature's
      assumption violated by another feature's posture) requires layer-4 composition to surface.
    expected: Either (a) IngestionDataEntitiesFilter-equivalent gate on the AlertManager path, OR (b) owner-scoped /api/alerts
      read, OR (c) cross-validation that alert.data_entity_oddrn references an entity the alert-creator has permission on
    drift_class: cross_feature_compound_amplification
    provenance: STATIC — primary-source verification in batch-H ReactiveAlertRepositoryImpl sidecar known_security_gaps[0]+[1]
      + the AlertController.getAllAlerts neighbour sidecar's REFACTOR-024 entry (the 7-sidecar finding cluster)
  - facet: undocumented webhook endpoint (OpenAPI gap)
    observed: 'AlertManagerController.java:20 carries a `// TODO: define OpenAPI spec based on alert provider contract` comment.
      The endpoint is NOT in the OpenAPI spec, NOT on the operator-facing alerting doc, NOT in any /developer-guides/api-reference
      page (verified by neighbour sidecar inheritance).'
    expected: OpenAPI spec entry + operator-facing doc page describing the contract, the entity_oddrn schema, the auth posture,
      the de-duplication guarantee (or absence thereof)
    drift_class: undocumented_security_surface
    provenance: STATIC — primary-source verification in batch-H AlertManagerController + ReactiveAlertRepositoryImpl sidecars
  - facet: no idempotency on retry — Prometheus webhook retries duplicate alerts
    observed: createAlerts issues INSERT … RETURNING with NO `.onConflict(...)` clause and no SELECT-then-INSERT de-duplication.
      If Prometheus retries the same webhook (transient network error → standard retry), TWO duplicate ALERT rows are inserted.
      The application-level de-duplication via AlertActionResolver (used by ingestion's applyAlertActions path at AlertServiceImpl.java:223-227)
      is NOT invoked on the AlertManager webhook path (handleExternalAlerts at lines 153-191).
    expected: Idempotency key OR `ON CONFLICT (data_entity_oddrn, type, status, external_id) DO NOTHING`
    drift_class: missing_idempotency
    provenance: STATIC — primary-source verification in batch-H ReactiveAlertRepositoryImpl sidecar bugs_limitations_corner_cases[2]
  - facet: AlertActionResolver asymmetry confirmed PRIMARY-SOURCE at service tier (batch I)
    observed: 'AlertServiceImpl.applyAlertActions (lines 200-231, used by the in-platform ingestion

      path AlertIngestionRequestProcessor) consumes AlertAction objects pre-grouped

      by AlertUniqueConstraint from AlertActionResolver — full de-duplication is

      applied. AlertServiceImpl.handleExternalAlerts (lines 151-191, the AlertManager

      webhook path) constructs AlertPojo DIRECTLY from the webhook payload and skips

      the resolver entirely. The shared `createAlerts` private helper (lines 261-300)

      does NOT de-duplicate at the SQL level. The asymmetry is deliberate (per batch-I

      implicit_adrs[3] — the in-platform ingestion has rich state context, the webhook

      is a thin adapter with no snapshot); the consequence is the Prometheus-retry

      idempotency gap.'
    expected: 'Either route the AlertManager path through AlertActionResolver too (build a

      synthetic snapshot inside the txn) OR add ON CONFLICT idempotency at the SQL

      level OR document the retry-produces-duplicates contract for operators'
    drift_class: missing_idempotency
    provenance: STATIC — primary-source verification in batch-I AlertServiceImpl sidecar implicit_adrs[3] + bugs_limitations_corner_cases[1]
      + downstream_side_effects table.
  - facet: generator URL embedded in chunk description — UI-render-side surface (batch I)
    observed: 'AlertServiceImpl.handleExternalAlerts line 168 builds the URL via UriComponentsBuilder.fromUri(externalAlert.getGeneratorURL());

      line 185 embeds it in the description as `String.format("Distribution Anomaly.

      URL: %s", queryUrl)`. The URI type does some shape validation but does not

      block javascript: scheme or arbitrary host URLs. The chunk description is then

      rendered back in the UI on the alerts feed; if the UI renders descriptions

      as innerHTML (or as a clickable link), this is a stored-XSS / open-redirect

      surface. Combined with the unauthenticated webhook endpoint, any caller with

      network reach can plant the payload — and combined with the cross-owner read

      on /api/alerts (REFACTOR-024), every authenticated user sees it.'
    expected: 'Validate the generator URL against an allow-list of schemes (http/https only)

      AND sanitise rendering on the UI side'
    drift_class: untrusted_input_to_rendered_text
    provenance: STATIC — primary-source verification in batch-I AlertServiceImpl sidecar bugs_limitations_corner_cases[3]
      + security.known_security_gaps[3]. Proposed local probe — POST AlertManager payload with generatorURL=`javascript:alert(1)`
      + GET /api/alerts via UI + assert no script execution + verify URL is sanitised or escaped.
  - facet: ExternalAlert.startsAt timezone-naive — embedded Prometheus query window misaligned (batch I)
    observed: 'AlertServiceImpl line 67-68 declares ALERT_MANAGER_TIME_FORMATTER as `yyyy-MM-dd

      HH:mm:ss` (no timezone). The webhook payload''s ExternalAlert.startsAt field

      is `LocalDateTime` (ExternalAlert.java:14) — timezone-naive — and Jackson''s

      default deserialisation strips any offset present in the AlertManager-side

      RFC3339 string. The URL embedded in the chunk description (line 162-172) uses

      this naive timestamp for `g0.moment_input` / `g0.end_input` query params —

      operators clicking the link land in a Prometheus query window keyed by the

      ODD server''s local time, not the alert''s actual timestamp. If the ODD server

      and the Prometheus deployment are in different timezones, the linked window

      misses the data.'
    expected: ZonedDateTime for ExternalAlert.startsAt + UTC formatter for the query param + documentation of the timestamp
      convention
    drift_class: misaligned_timestamp_contract
    provenance: STATIC — primary-source verification in batch-I AlertServiceImpl sidecar bugs_limitations_corner_cases[7]
      + ExternalAlert.java:14 (the LocalDateTime type).
