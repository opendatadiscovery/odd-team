    delivery class). One ALTER TABLE migration. Allows the INSERT
    to use ON CONFLICT DO NOTHING for idempotency.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-25-ZF from
  EventApiController class-level primary-source evidence. The
  finding is the single most consequential security gap of the
  F-009 inbound-side surface.

  Cross-cutting connections:
    - **OUTBOUND analog**: pairs with
      `webhook-no-hmac-no-signature-no-payload-origin-verification`
      (batch Y) — the SAME class-of-failure on the outbound webhook
      channel. The platform ships unsigned webhooks in BOTH
      directions. A coordinated fix would close BOTH gaps with a
      shared signing-secret config-property convention.
    - **AlertManager analog**: pairs with
      `entity-oddrn-trust-from-alertmanager-webhook` — the
      AlertManager webhook receiver (`POST /ingestion/alert/alertmanager`)
      has the SAME trust-from-unverified-payload shape; AlertManager
      doesn't support signing, but the ODD platform also doesn't
      enforce IP allowlist or any other origin check on that
      endpoint either.
    - **Auth-mode-orthogonal**: the WHITELIST_PATHS bypass for
      /api/slack/events composes with the four-mode
      `two-ingestion-filters-asymmetric-auth` story; the same
      structural assumption — "this endpoint MUST be public for
      external service delivery" — applies to BOTH ingestion AND
      events, and BOTH need a signature-verification compensation
      that the platform doesn't provide.

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the absence on the live data-collaboration page
        with operator-facing mitigation (Slack IP allowlist, mTLS,
        gateway with signature verification) — pending code fix
    (b) Document the new signing-secret config property once the
        code fix ships
    (c) Add a cross-cutting "Webhook security in ODD" page that
        names BOTH directions (inbound Slack events + outbound
        notifications) and the consistent signing-secret pattern
        applied across them
