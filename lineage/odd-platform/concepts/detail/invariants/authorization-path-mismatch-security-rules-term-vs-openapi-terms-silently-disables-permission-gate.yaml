name: Authorization path-mismatch — SECURITY_RULES /term vs OpenAPI /terms silently
  disables permission gate
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-06
- P-09
description: |-
  SecurityConstants.SECURITY_RULES[237-239,240-242] declares path patterns
  with SINGULAR '/term' and '/term/{term_id}' for the
  DATA_ENTITY_ADD_TERM/DELETE_TERM permission checks. OpenAPI spec at
  openapi.yaml:973,1042 declares the actual endpoints as PLURAL '/terms'
  and '/terms/{term_id}'. The generated DataEntityApi interface inherits
  the plural path; AuthorizationCustomizer.customize only invokes the
  permission check when the rule's matcher matches the request — the
  singular matcher never matches the plural path. Customizer falls through
  to .pathMatchers('/**').authenticated(). Net effect: DATA_ENTITY_ADD_TERM
  and DATA_ENTITY_DELETE_TERM are NEVER ENFORCED for the real endpoints.
  ANY authenticated user (LOGIN_FORM/OAUTH2/LDAP) can link or unlink terms
  on any data entity across the platform. ALSO bypassable via the
  description-write path (different surface, same vulnerability class).
  Triangulates: addDataEntityTerm (PRIMARY-SOURCE) +
  upsertDataEntityInternalDescription (the side-channel bypass via
  [[ns:term]]). **STRENGTHENED batch 2026-05-19K** — TermServiceImpl
  primary-source confirms the service-tier consumers
  (linkTermWithDataEntity, removeTermFromDataEntity,
  linkTermWithDatasetField, removeTermFromDatasetField,
  linkTermWithTerm, removeTermToLinkedTermRelation) all carry ZERO
  service-tier permission checks. Even if REFACTOR-217 is fixed at the
  controller-tier, the service-tier surface remains exposed to any
  caller that reaches it directly. PLUS: a SECOND independent
  SecurityConstants bug surfaced this batch at
  SecurityConstants.java:295-296 (alerts-status PUT gated by
  DATASET_FIELD_ADD_TERM — a Term permission on an Alert path); two
  such bugs in the same authorization-wiring file suggest a class of
  failures warranting a startup-time invariant scanner.
