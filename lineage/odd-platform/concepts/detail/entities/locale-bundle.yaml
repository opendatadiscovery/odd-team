security_aggregate:
  overall: HIGH
  auth_modes_relevant:
    - DISABLED
    - LOGIN_FORM
    - OAUTH2
    - LDAP
  ingestion_filter_relevance: N/A
  authorization_consistency:
    verdict: UNKNOWN
    detail: |-
      All three contributing sidecars are TS / JSON modules running in the browser —
      INTERNAL_ONLY for auth_mode_relevance. Authorization is irrelevant by design
      at this layer; no @PreAuthorize, no permissionService call.
  owner_scoping:
    verdict: N/A
    detail: |-
      Code is not data-scoped. The bundles operate on a six-element static locale list;
      no DataEntity, Owner, or other ODD domain object is queried, filtered, or exposed.
  strengths:
    - 'localStorage value `i18nextLng` is unsigned/unencrypted but carries only a 2-letter locale code drawn from a fixed whitelist (en | es | ch | fr | ua | hy) — XSS attacker reading/writing key gains nothing operationally beyond changing victim UI language'
    - 'Whitelist guard on read-back: stored value accepted only if it matches one of the six imported locale keys; any other value is replaced by the default `en`'
    - 'NO dangerouslySetInnerHTML in any t() call site — verified by repo-wide grep returning zero matches in odd-platform-ui/src/. React JSX escaping handles XSS for every locale value. NO i18next interpolation placeholders (`{{var}}`) in any value — verified by repo-wide grep on en.json'
  weaknesses:
    - 'Bootstrap calls localStorage.getItem(i18nextLng) unguarded; in privacy-mode browsers where localStorage access throws, the import-for-side-effects raises before <App /> renders -> entire UI unreachable, including login screen (severity LOW availability concern, not confidentiality)'
    - 'Live `enable-security` doc does not mention browser-side preference persistence — operators implementing a CSP that disables localStorage break this widget persistence path with no docs warning (severity LOW)'
    - 'i18n.ts has no `missingKey` event handler wired — silent fallback on typos, deletions, or code-side keys never added to en.json (batch ZJ — contract is enforced by NOTHING, neither compile-time nor runtime; the natural-keys pattern + no-handler combination ships missing-key drift silently)'
    - 'The "User" filter label in en.json:347 channels the LSN-020 / DOC-GAP-303 drift uniformly to all six locales (per the activity-user-filter-doc-promises-performed-by-sql-binds-owner-mapping invariant) — operator-compliance reviewer gets misleading audit results regardless of locale (severity HIGH at the cross-locale-invariance layer)'
  cross_file_inconsistencies: []
  contributing_files:
    - i18n_ts.md
    - SelectLanguage.md
    - en.md
  evidence:
    - i18n_ts.md:security.known_security_gaps.[0,1]
    - SelectLanguage.md:security.known_security_gaps.[0,1]
    - 'en.md:security.known_security_gaps.[0,1]'
    - 'en.md:bugs_limitations_corner_cases.[7] (no missingKey handler; silent failures are the i18next default)'
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'Module-load runs once per app boot — synchronously imports six locale JSON bundles, constructs resources map, reads localStorage, calls i18n.use(initReactI18next).init({...}); on critical path of first paint via index.tsx:23 side-effect import — i18n.ts'
    - 'Every React component that calls useTranslation() reads from i18next singleton on each render, walking in-memory resources map for active language and (on cache miss) the six-element fallbackLng chain — fires hundreds of times per render cycle on typical platform pages — i18n.ts'
    - 'Render path: dialog body iterates i18n.languages and applies substring filter; click handler awaits i18n.changeLanguage which triggers full app rerender via react-i18next provider — SelectLanguage'
    - '241 t() call sites across odd-platform-ui/src/ per repo-wide grep at commit 4ec2b20 — 50-200 lookups per page render; O(1) hash-map probe per lookup; aggregate cost negligible (batch ZJ measurement)'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      User-event-driven, very low frequency — typical session opens dialog 0-1 times.
      No batching or queuing concern. Module-load is one-shot at boot.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless across the platform backend — no API call, no per-user server record,
      no DB row touched by language preference. Lives entirely in browser localStorage.
      Switching browsers/devices/clearing site data resets to `en`. Backend horizontal
      scaling unaffected.
  strengths:
    - Single i18next instance held in module-scope memory — bounded footprint, not per-user, not per-render
    - No network I/O on language-change click path — purely localStorage.setItem
  weaknesses:
    - No code-splitting on locale — every user pays full ~120 KB locale payload in main JS bundle even though only one locale is active. Adding a seventh locale grows main bundle linearly (severity LOW)
    - fallbackLng is the full six-element array `[en,es,ch,fr,ua,hy]` rather than conventional `en`. On a missing key, i18next walks all six locales in order before giving up. Per-render cost small but for a key genuinely missing across all locales the lookup does six failed map probes (severity LOW)
    - i18n.changeLanguage triggers full app rerender via react-i18next provider — single broadcast rather than incremental segment swapping; on deeply-mounted pages (lineage graph with 100+ nodes) perceived latency to first paint after language click is noticeable (severity LOW)
    - No debounce on search input — every keystroke runs filter on the full locale list; acceptable today (N=6) but a contributor adding 50+ locales would push every keystroke to a 50-element re-render (severity LOW)
    - 'Natural-keys pattern means every t() call carries the full English string as the lookup key; long keys (e.g. "Are you sure you want to delete this collector?" en.json:35 — 47 chars) are bigger lookup constants than slug keys would be. Per-lookup cost is identical (hash-map probe is O(1) regardless of key length) but the in-memory resource map carries more bytes than necessary. Bounded today (~21 KB en.json); not a defect. (batch ZJ)'
  cross_file_inconsistencies: []
  contributing_files:
    - i18n_ts.md
    - SelectLanguage.md
    - en.md
  evidence:
    - i18n_ts.md:performance.hot_paths.[0,1]
    - i18n_ts.md:performance.known_performance_gaps.[0,1]
    - SelectLanguage.md:performance.known_performance_gaps.[0,1]
    - 'en.md:performance.hot_paths.[0,1] (module-load + 241 t() call sites)'
    - 'en.md:performance.known_performance_gaps.[0,1]'
