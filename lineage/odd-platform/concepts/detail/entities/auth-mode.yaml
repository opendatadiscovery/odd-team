    / OAUTH2 / LDAP / S2S
  - OAUTH2 + LDAP both apply `AuthorizationCustomizer` and run at `Ordered.HIGHEST_PRECEDENCE`
    (LDAP) — production modes carry the strongest enforcement; the asymmetry is downward
