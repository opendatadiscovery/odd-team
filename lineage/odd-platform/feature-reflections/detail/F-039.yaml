# GenAI free-text proxy (POST /api/genai/ask) — product-owner reflection (v0.3.0)

## product_owner_narrative

The GenAI Assistant is ODD's first and only generative-AI surface, and the canonical
example of a feature whose product name promises far more than the code delivers. Sold in
the pillar mission as "broker AI questions to an external service" (per system-mission.md:202
P-07 one-line capability) and named, in the canonical concepts catalogue, the "GenAI
Assistant", it is in implementation an 11-line reactive HTTP forwarder: `POST /api/genai/ask`
takes a single free-text field, forwards it verbatim as `{"question": "..."}` to whatever URL
the operator wired at `genai.url`, and hands the response back (per GenAIController.md:understanding
+ GenAIServiceImpl.java:41-43 cited therein). ODD embeds no model, adds no catalog context,
applies no prompt template, and performs no safety filtering — the live feature page is candid
about this, calling the platform "a thin proxy" (per WebFetch features/active-platform-features/genai
2026-06-01). The audience the feature nominally serves — an analyst who wants to "ask my data
catalog a question" — is not who the implementation serves; the implementation serves whatever
external service the operator runs, and trusts it completely.

A user interacts with the feature today only programmatically. There is no UI affordance: a grep
over odd-platform-ui/src for the generated GenaiApi client returns zero hand-written callers (per
GenAIController.md:bugs[3] + GenAIProperties.md:bugs[4]), and both the live config page and feature
page state "API-only today" verbatim. The input is a single JSON field `{"body": "<question>"}`;
the output is a single JSON field `{"body": "<answer>"}` (per GenAIController.md:concepts.entities).
The feature is opt-in and ships disabled — `application.yml:18` writes `genai.enabled: false`
explicitly, not by primitive default (per GenAIProperties.md:implicit_adrs[0]), and that exact
default is now pinned by a real test (FeatureGatingDefaultsTest.offByDefaultFamily_shipsDisabled,
@enforces ADR-0004/ADR-0075). To turn it on, an operator must set three keys: `genai.enabled`
(re-read on every request), `genai.url`, and `genai.request_timeout` (the latter two baked into the
genAiWebClient bean at startup, requiring a restart to change — per GenAIProperties.md:implicit_adrs[2]).

The working parts are deliberately few, and that minimalism is itself the product stance. There is
no batching, no streaming, no response cache, no retry, no circuit breaker (per
GenAIProperties.md:performance.throughput + implicit_adrs[4]). The only request-time logic beyond
"forward the bytes" is: (a) the enabled gate at the SERVICE tier — when `genai.enabled=false` the
service throws BadUserRequestException -> HTTP 400 "Gen AI is disabled" (per GenAIServiceImpl.java:37-39
cited in GenAIController.md:invariants), notably DIFFERENT from the sibling DataCollaboration
EventApiController that 404s its route via `@ConditionalOnDataCollaboration` when disabled; and (b)
the response unwrap — a CharMatcher quote-trim plus StringEscapeUtils.unescapeJava that silently
assumes the external service returns a bare JSON-quoted string (per
GenAIController.md:concepts.invariants[2] + GenAIServiceImpl.java:45-47). The error contract
(BadUserRequest->400, GenAIException->500) is itself pinned by AdrControllerAdviceMappingScanTest
(@enforces ADR-0007) — but that pins the mapping table, not any request-path behaviour.

The integration story is sparse by design but cross-pillar-relevant in three directions. To P-09
(Security): the endpoint carries no RBAC entry, no GENAI_USE Permission, no SecurityConstants rule —
it falls through to the catch-all `.authenticated()` matcher (AuthorizationCustomizer.java:29-30), so
the platform's read-collaborative posture extends here AS A WRITE that costs real money on the
operator's LLM account. This whole cluster is already filed as PLT-020 (six sub-gaps) with a paired
caveat-doc DOC-184, and is characterization-pinned by SecurityRulesAuthzGapsKnownBugsTest's PLT-020
test — so the reflection is CONVERGENT VALIDATION of an already-tracked finding, not a fresh
discovery. To P-11 (Developer surface): the only consumer is the OpenAPI-generated SDK; the developer
audience is the one that can reach it. To P-07 itself: a future GENAI_USAGE event's home is the
Activity Feed (F-021); a future GENAI_USE permission's home is RBAC (F-006).

The edge cases a product owner would flag in a demo are the ones that turn this feature from "minimal"
into "hazardous when enabled carelessly". Enable it with only `genai.enabled=true` and the two unset
keys collapse to `url=null` + `request_timeout=0` — the platform boots clean and reports the feature
enabled, then every single call fails with a confusing user-facing diagnostic ("Gen AI request take
longer that 0 min" — note the typo, and note that the message frames a static misconfiguration as a
slow response) (per GenAIProperties.md:bugs[0] + GenAIController.md:performance.known_performance_gaps[0]).
This silent-misconfiguration is filed as PLT-008. The inert defaults that CAUSE it are pinned by
FeatureGatingDefaultsTest — but the boot-clean-then-fail BEHAVIOUR is not, so the fail-fast promise
(H-002) is unguarded. Point `genai.url` at an internal address and the platform's egress identity
makes the outbound call with no scheme allowlist — an SSRF surface (per GenAIProperties.md:security[1],
PLT-020 Defect 2). And the headline edge case: because there is no authorization gate, no rate limit,
no body-size cap, and no audit log, a single authenticated low-privilege user — or, under
auth.type=DISABLED, an anonymous one — can drive arbitrary, untraced, unredacted cost on the operator's
AI vendor account at HTTP-client speed. This is the "operator follows our guide off a cliff" scenario
for the AI-vendor-billing audience.

## hypotheses

- id: H-001
  hypothesis: |-
    When a least-privilege authenticated user (no admin role, no GenAI-specific permission, default
    role at user creation) calls POST /api/genai/ask under LOGIN_FORM / OAUTH2 / LDAP with
    genai.enabled=true, the request succeeds and the external LLM is invoked on the operator's account
    — i.e. there is no permission/role gate that restricts who may incur GenAI cost.
  derivation: |-
    The endpoint is named "ask" inside a feature called "GenAI Assistant"; the pillar mission lists
    "broker AI questions" as a primary action with no role qualifier; an operator paying per-token
    would expect, by default, that only a privileged subset (or a metered subset) can spend their AI
    budget.
  seed_source: pillar
  sme_consultation_recommended: true
  sme_consultation_question: |-
    Do data-catalog operators running an external-LLM integration expect a per-role / per-permission
    gate on who may consume the model by default, or is "any authenticated catalog user may ask" the
    industry-normal posture (cf. DataHub's AI features, Atlan's natural-language query, OpenMetadata)?
  sme_consultation_archetype: implicit-requirements
  validation:
    verdict: contradicted
    actual_behavior: |-
      There is no authorization gate anywhere on the request path. GenAIController has no @PreAuthorize
      and no programmatic permissionService.hasPermission(...) call; the generated GenaiApi interface
      carries no authorization annotations; PolicyPermissionDto has no GENAI_USE Permission; and
      SecurityConstants has no SECURITY_RULES entry and no WHITELIST_PATHS entry for /api/genai/**.
      Under OAUTH2/LDAP the path falls through to AuthorizationCustomizer.java:29-30
      `.pathMatchers("/**").authenticated()`; under LOGIN_FORM it falls through to
      LoginFormSecurityConfiguration.java:31/57 because the path is not in permittedPaths. Three of four
      auth modes require authentication only; the fourth (DISABLED) requires nothing. A default-role
      viewer is functionally identical to an admin for this endpoint. This is now ALSO characterization-
      pinned: SecurityRulesAuthzGapsKnownBugsTest.genaiEndpointHasNoDedicatedAuthorizationRule_knownBug_PLT020
      GREEN-asserts SECURITY_RULES contains no "genai" — RED the instant a rule lands.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: security.known_security_gaps[0] + implicit_adrs[1]
        cite: "GenAIController.java:13-24 + GenaiApi.java grep (zero authz) + SecurityConstants.java:95-96 + grep `genai` on SecurityConstants.java (zero hits) + AuthorizationCustomizer.java:29-30 + DisabledAuthSecurityConfiguration.java:10"
        note: "Full auth-mode matrix traced; no Permission/Role gate in any mode."
      - source_read_for_validation: true
        cite: "odd-platform-api/src/test/java/.../auth/SecurityRulesAuthzGapsKnownBugsTest.java:58-64 (@pins PLT-020, tagged 'F-039 H-001')"
        note: "Real test pins the BROKEN state (gap exists), not the promise (a gate exists)."
    operator_visible_failure: |-
      (1) Cost injection by any insider — a read-only viewer, a contractor with a default account, or any
      compromised low-privilege credential can fire requests at HTTP-client speed, each one charging the
      operator's external LLM account, bounded only by the vendor's own throttling. (2) No principal
      attribution — combined with the no-audit-log finding (H-005), the operator cannot answer "which user
      ran up this bill" from platform data alone. (3) Permission-creep regression risk — the only test that
      exists pins the CURRENT authenticated-only posture as a known bug; a future maintainer closing PLT-020
      flips that test RED (by design), but no test pins the INTENDED gated behaviour, so the post-fix
      happy-path is unguarded.
    severity: HIGH
    confidence: HIGH
    probe_id: P-160        # already emitted by the file-analyser; status pending-stress-protocol
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # the regression guard for the PLT-020 fix (the gated-happy-path), which the PLT-020 characterization pin does NOT provide

- id: H-002
  hypothesis: |-
    When an operator enables the feature by setting ONLY genai.enabled=true (omitting genai.url and
    genai.request_timeout), the platform refuses to start or surfaces a clear configuration error at boot
    — i.e. a half-configured feature fails fast, not silently.
  derivation: |-
    Negative-space + LSN-002 case-law: a Principal engineer expects an enabled integration with a null
    endpoint and a zero timeout to fail fast at startup, not to boot clean and fail every runtime request
    with a misleading message.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The feature boots clean and reports enabled. GenAIProperties uses Java primitives with no
      initializers and no validation: `String url` defaults to null, `int requestTimeout` defaults to 0;
      the class carries only @ConfigurationProperties + @Data — no @Validated, no @NotBlank/@URL/@Min(1),
      no @PostConstruct validate(). WebClientConfiguration builds the genAiWebClient with baseUrl(null)
      and Duration.ofMinutes(0) — both legal at bean construction, neither throws at boot. Every
      subsequent POST then fails: with url=null the outbound call fails before reaching the external
      service (HTTP 500, generic GenAIException); with request_timeout=0, Duration.ofMinutes(0) trips
      ReadTimeoutException immediately and the user sees "Gen AI request take longer that 0 min" (typo:
      "that" should be "than"). The INERT DEFAULTS (the conditions) are now pinned by
      FeatureGatingDefaultsTest.genai_shipsInert_noEndpointInYaml + genaiProperties_javaDefaults_areInert
      — but those tests assert the defaults are null/0, NOT that the platform fails fast; they actually
      pin the misconfiguration's PRECONDITION as intended behaviour (@enforces ADR-0004).
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_config_properties__config-properties-class__GenAIProperties
        section: bugs_limitations_corner_cases[0,1,2]
        cite: "GenAIProperties.java:8-12 (no validation annotations, no initializers) + WebClientConfiguration.java:22-29 + GenAIServiceImpl.java:48-51"
        note: "No fail-fast; bean constructs with null baseUrl + zero Duration; the typo'd message reads the misconfigured value back."
      - source_read_for_validation: true
        cite: "odd-platform-api/src/test/java/.../config/FeatureGatingDefaultsTest.java:84-119 (genai_shipsInert_noEndpointInYaml + genaiProperties_javaDefaults_areInert)"
        note: "Pins url=null/timeout=0 as the inert default (the misconfig precondition), explicitly NOT a fail-fast."
    operator_visible_failure: |-
      (1) The operator believes the feature is working (boots clean, gate reports enabled) until the first
      real question fails. (2) The diagnostic actively misleads: "request take longer that 0 min" frames a
      static misconfiguration as an intermittent slow-response problem. (3) The url=null and timeout=0 cases
      produce DIFFERENT HTTP 500 bodies, so the operator cannot even rely on a consistent error to diagnose.
      This is the LSN-002 regional analogue (MinIO .region(...) unset -> us-east-1).
    severity: HIGH
    confidence: HIGH
    probe_id: P-161        # already emitted by the file-analyser
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint   # an enable-time invariant the feature should enforce at boot
    coverage: unverified
    test_demand: functional   # the boot-fail-fast / first-request-misconfig behaviour is unpinned (the defaults pin only the precondition)
    note: |-
      Mitigation on the DOCS side: the live config page (WebFetch 2026-06-01) carries a warning admonition
      naming this exact failure ("Setting only genai.enabled=true will silently misconfigure ... Always set
      all three keys"). Documented caveat, NOT an undocumented trap — but the CODE still ships the silent
      failure, so the bug-candidate (add @Min(1) + @NotBlank/@URL fail-fast) stands. Already filed as PLT-008.

- id: H-003
  hypothesis: |-
    When genai.enabled=false (the shipped default) and a user calls POST /api/genai/ask, the request is
    rejected with a clear "disabled" response and no outbound call to the external service fires.
  derivation: |-
    Endpoint shape + the disabled-by-default invariant: a disabled feature must not silently forward, and
    must not charge the operator's account.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      The service-tier gate fires first: GenAIServiceImpl.java:37-39 checks `if (!genAIProperties.isEnabled())`
      and returns Mono.error(new BadUserRequestException("Gen AI is disabled")), which ControllerAdvice.java:24-28
      maps to HTTP 400 with code BAD_REQUEST. The cardinality of the outbound call on the disabled path is 0
      — the short-circuit happens before webClient.post() (per the feature-flow terminal_side_effect). The
      SHIPPED DEFAULT (genai.enabled=false) is pinned by FeatureGatingDefaultsTest.offByDefaultFamily_shipsDisabled
      (@enforces ADR-0004/ADR-0075), and the ControllerAdvice 400 mapping is pinned by
      AdrControllerAdviceMappingScanTest (@enforces ADR-0007). The live config page documents the 400 verbatim.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: concepts.invariants[1]
        cite: "GenAIServiceImpl.java:37-39 + ControllerAdvice.java:24-28"
        note: "Disabled path returns HTTP 400; no outbound call."
      - source_read_for_validation: true
        cite: "FeatureGatingDefaultsTest.java:48-63 (offByDefaultFamily_shipsDisabled) + AdrControllerAdviceMappingScanTest.java:37-53 (BadUserRequest->400)"
        note: "Real tests pin the disabled DEFAULT + the 400 mapping — but NOT the request-path 400+zero-outbound behaviour end-to-end."
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: empty/no-match    # the disabled/short-circuit path is the user's "feature off" experience
    coverage: verified
    test_ref: "FeatureGatingDefaultsTest.offByDefaultFamily_shipsDisabled + AdrControllerAdviceMappingScanTest.exceptionHierarchyMapsToStatus"
    test_demand: functional   # PARTIAL guard — the DEFAULT and the MAPPING are pinned, but no WebTestClient test asserts POST /api/genai/ask returns 400 with body "Gen AI is disabled" AND fires zero outbound calls. coverage=verified on the conservative reading that "ships disabled" + "400 mapping exists" jointly carry the load-bearing half; the request-path behavioural assertion is the residual demand.
    note: |-
      The ONLY hypothesis with coverage=verified — and even here the verification is two structural pins
      (default value + exception-status mapping), not one behavioural request-path test. This is the
      LSN-030 nuance: a confirmed promise can be "verified" by structural pins yet still lack the
      behavioural test that proves the user-visible outcome. The functional_test_demand for the
      end-to-end 400+zero-outbound is retained.

- id: H-004
  hypothesis: |-
    When genai.enabled=false, the GenAI endpoint behaves like a not-deployed feature — i.e. it returns
    HTTP 404, consistent with how ODD's other feature-flagged endpoints (e.g. DataCollaboration's
    EventApiController) hide themselves when disabled.
  derivation: |-
    Cross-pillar / consistency: a developer-audience SDK consumer who learns ODD's convention from one
    feature-flagged controller expects the next one to behave the same way.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      GenAI returns HTTP 400, not 404, when disabled. The controller bean is ALWAYS registered (no
      @ConditionalOnProperty on the class), so the route is always reachable; the gate is at the service
      tier (BadUserRequestException -> 400). The sibling EventApiController carries
      @ConditionalOnDataCollaboration, so its bean is NOT registered when disabled and the route returns
      404. Two sibling controllers, two opposite conventions for "feature flag off". Both internally
      consistent; the inconsistency BETWEEN them is the finding.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: implicit_adrs[1] (feature-flow facet enabled_gate_at_service_tier_400_not_404...)
        cite: "GenAIServiceImpl.java:37-39 + GenAIController.java:13-24 (no @ConditionalOnProperty) + contrast EventApiController.java:15 (@ConditionalOnDataCollaboration)"
        note: "GenAI=400 reachable-but-gated; DataCollaboration=404 not-registered."
    operator_visible_failure: |-
      An SDK consumer or operator probing "is this feature available" gets different signals from sibling
      endpoints: a 404 reads as "not deployed / not in this build" while a 400 reads as "deployed but you
      sent a bad request" — which can send a developer hunting for a request-body error that does not exist.
      The divergence is benign (both responses are debuggable) but it is a real cross-feature consistency
      defect on the developer surface, and it is undocumented — neither convention is called out as the
      deliberate choice.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor    # developer-surface consistency expectation
    coverage: unverified
    test_demand: functional   # no test pins the 400-not-404 disabled-feature convention divergence

- id: H-005
  hypothesis: |-
    When a user submits a GenAI question, the platform records who asked what (an audit trail of principal
    + question + timestamp) so an operator can later reconstruct usage and investigate abuse.
  derivation: |-
    Negative-space + pillar mission ("the platform is itself an actor" — actions the platform takes on the
    operator's behalf are auditable elsewhere in P-07, e.g. the Activity Feed); an action that spends money
    with no record is an operational blind spot a senior PO would flag.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      No audit trail exists. GenAIServiceImpl declares @Slf4j but makes ZERO log.* calls anywhere on the
      request path; the controller has no Logger field. The ServerWebExchange parameter on the controller
      method (GenAIController.java:19-20) — which exposes the user Principal, X-Forwarded-For, User-Agent,
      and trace context via exchange.getPrincipal()/getRequest().getHeaders() — is declared but never read.
      There is no GenAI interaction persisted to the database, no GENAI_USAGE Activity event. The only trace
      of a call is whatever the reverse proxy and the external service log independently.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: security.known_security_gaps[6]
        cite: "GenAIServiceImpl.java:35-52 (no log.* calls; @Slf4j log field unreferenced) + GenAIController.java:19-23 (ServerWebExchange unreferenced)"
        note: "No audit log; the Principal is available-but-unused (Category F Q5 fix-anchor)."
    operator_visible_failure: |-
      (1) Forensic vacuum — when the AI bill spikes or a prompt leaks sensitive data, the operator cannot
      answer "who, what, when" from ODD; they must cross-reference reverse-proxy access logs (no question
      body) with the external vendor's logs (if any). (2) No usage analytics. (3) The fix-anchor is already
      present and discarded — reading the ServerWebExchange to log Principal + question is a small change,
      which makes the absence a deliberate-looking gap. Note the compound F-021a constraint: the
      activity-feed schema's `data_entity_id NOT NULL` means a GENAI_USAGE activity event needs a schema
      migration (PLT-020 PR-3 picks the non-activity-feed audit table to sidestep this).
    severity: HIGH
    confidence: HIGH
