    Endpoint shape (getRuns returns DataEntityRunList) + response-shape DTO
    fields (startTime/endTime/status/statusReason) + the UI /history route mount.
  seed_source: endpoint-shape + response-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      The repository SELECTs data_entity_task_run rows for the entity's oddrn,
      ORDER BY end_time DESC, LIMIT/OFFSET paginated, and the mapper flat-maps
      each pojo to a DataEntityRun{startTime,endTime,status,statusReason,
      dataEntityId} inside a DataEntityRunList{items,pageInfo}. The repository
      integration test pins ordering + pagination + status-filter end to end
      against a real Postgres. "Most-recent-first" is by end_time (a caveat —
      see H-009), but for the steady-state completed-run case the promise holds.
