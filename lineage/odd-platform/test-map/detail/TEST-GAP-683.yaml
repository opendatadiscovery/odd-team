behaviour: |-
  **`OwnerServiceImpl.getOrCreate` is a SERVICE-TIER PERMISSION-BYPASS WRITE PATH for OWNER row minting.** Lines 38-42. Reached from `OwnerAssociationRequestServiceImpl.createOwnerAssociationRequest` (line 57 of that file) AND `OwnershipServiceImpl.create` (line 52 of that file) AND `TermOwnershipServiceImpl.create`. The Owner row is auto-created WITHOUT the caller holding `OWNER_CREATE` — the SecurityRule at `SecurityConstants.SECURITY_RULES[143]` gates `POST /api/owners` (`OwnerController.createOwner`), NOT `OwnerServiceImpl.getOrCreate`. The bypass is INTENTIONAL (the association-request and ownership-creation flows need to mint the owner if absent) but is the documented `permission-bypass-via-owner-auto-create-side-door-write-path` concept. Any future per-Owner authorization scoping decision must consider that the side-door produces Owner rows whose `OWNER_CREATE`-permission attribution is the CALLER OF THE SIDE-DOOR, not necessarily a holder of `OWNER_CREATE`. The current contract is documented at the concept-catalog level but is NOT regression-pinned: a refactor that "tightens" `getOrCreate` to require `OWNER_CREATE` would break the OwnerAssociationRequest flow; a refactor that "tightens" `OwnerAssociationRequestServiceImpl` to require `OWNER_CREATE` before invoking `getOrCreate` would break the user-facing 'I want to associate with owner X' flow. The test pins the CURRENT permission-bypass behaviour as the EXPECTED contract so a regression is detected.
