- id: H-005
  hypothesis: "When the operator has a sub-editor dialog open (e.g. the tags Edit dialog) for column A and clicks column B's row in the list, the system either keeps the dialog editing column A, or warns before discarding the in-progress edit — it does NOT silently submit column A's edited values against column B."
  derivation: "Composer mounts sub-editors unconditionally (DatasetFieldOverview.tsx:54-98); selectedFieldIdAtom updates on row click while a dialog (TagsEditForm DialogWrapper) is open; the dialog's useForm state was initialised from column A. feature-flow drift facet per_column_editor_composition_no_unsaved_changes_warning_on_field_switch (ui_unverified: true)."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Undefined from static analysis. The dialog's submit handler closes over a
      datasetFieldId; whether it captures column A's id (closure capture at mount)
      or rebinds to column B's id (re-render) depends on render timing that .tsx
      alone does not resolve (feature-flow facet, ui_unverified: true;
      DatasetFieldOverview.tsx:54-98 + TagsEditForm.tsx:111-124). There is NO
      unsaved-changes warning and NO loading state on switch (feature-flow
      observed). This is a latent data-corruption hazard: submit-A's-tags-against-B
      would silently corrupt column B's annotations.
    evidence:
      - sidecar: "(feature-flow F-192 facet)"
        section: "observed_vs_expected.facets[0]"
        cite: "DatasetFieldOverview.tsx:54-98; TagsEditForm.tsx:111-124"
        note: "closure-capture vs re-render timing unresolved from .tsx — requires runtime probe"
    operator_visible_failure: |-
      If submit rebinds to column B: the operator edits column A's tags, clicks
      column B to look at it, hits Save (thinking they are saving A), and column
      B's tags are silently overwritten with A's edited set — data corruption with
      no warning. If submit stays bound to A: the operator believes they are
      editing B but the save lands on A — equally surprising. Either way the
      absence of an unsaved-changes guard is the defect.
    severity: HIGH
    confidence: LOW
    probe_id: PENDING-F-192-1
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: "PENDING-F-192-1"

- id: H-006
  hypothesis: "When the operator rapidly clicks through several columns in 1-2 seconds, the enum-value section finally displayed belongs to the column currently selected — not to a column whose in-flight fetch resolved last."
  derivation: "DatasetFieldOverviewEnums.tsx:35-43 useEffect dispatches fetchDataSetFieldEnum on every field.id change; cleanup is resetLoaderByAction (does NOT abort the in-flight HTTP request). feature-flow drift facet per_column_editor_fast_field_switch_useeffect_enum_fetch_race (ui_unverified: true)."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Cannot be determined statically. The useEffect re-fires per field.id but the
      cleanup only resets loader state — it does not AbortController-cancel the
      prior request (feature-flow facet; DatasetFieldOverviewEnums.tsx:35-43).
      Whether field B can show field A's enum values depends on the reducer's
      enum-storage keying (per-field-id keyed map vs a global last-fetched buffer),
      which is opaque from .tsx and requires the datasetStructure/enum slice
      sidecar (which does not exist). A race is plausible but its operator-visible
      outcome is unproven.
    evidence:
      - sidecar: "(feature-flow F-192 facet)"
        section: "observed_vs_expected.facets[2]"
        cite: "DatasetFieldOverviewEnums.tsx:35-43"
        note: "no request abort on switch; reducer keying opaque — slice sidecar absent (validation gap)"
    operator_visible_failure: |-
      If the reducer uses a global last-fetched buffer: a curator sweeping a wide
      table fast could see column B displaying column A's enum values, then edit
      and save the WRONG values onto B (compounds H-007's bulk-replace destruction).
      If the reducer is per-field-id keyed: the race is benign (stale response
      discarded). The two outcomes differ by a single reducer design choice.
    severity: MEDIUM
    confidence: LOW
    probe_id: PENDING-F-192-2
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: "PENDING-F-192-2"

- id: H-007
  hypothesis: "When a non-UI caller (a generated SDK client, a script, a future UI refactor) POSTs a SINGLE new enum value to a column that already has values, that value is ADDED and the existing values are preserved."
  derivation: "Endpoint operationId createEnumValue (singular CREATE verb, openapi.yaml:2536-2554); the verb promises additive create. DatasetFieldController sidecar name_behavior_pairs flags DRIFT_NAME_VS_BEHAVIOR."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      The endpoint is BULK-REPLACE: the body IS the entire new state. A partial
      body of one item runs softDeleteExcept and SILENTLY SOFT-DELETES every
      existing enum value not in the body (EnumValueServiceImpl.java:91-122;
      DatasetFieldController sidecar). The operationId createEnumValue promises an
      additive single-CREATE; the implementation destroys the omitted values. The
      UI is safe only because DatasetFieldEnumsForm sends the full set; any other
      caller trusting the verb name corrupts data.
    evidence:
      - sidecar: odd-platform__java__DatasetFieldController__controller-class__DatasetFieldController.md
        section: stress_findings.name_behavior_pairs / bugs_limitations_corner_cases
        cite: "EnumValueServiceImpl.java:91-122; openapi.yaml:2536-2554"
        note: "createEnumValue is replace-state-with-body; partial body soft-deletes omitted rows"
    operator_visible_failure: |-
      An SDK consumer or integration author calls createEnumValue with one new
      value (the verb says create-one), and the column's other allowed values
      vanish — silent data loss with a 200/201 success. Additionally, replaying
      an identical body churns row identities and emits a fresh
      DATASET_FIELD_VALUES_UPDATED activity event each time, so auditors
      correlating events by row id lose the chain (DatasetFieldController sidecar
      replay finding). Concurrent POSTs are last-write-wins with no lock.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: "When the operator removes a glossary term from a column via the per-term delete affordance, the term disappears from the column's terms list."
  derivation: "DatasetFieldTerms TermItem per-row delete gated by DATASET_FIELD_DELETE_TERM (hop 2e); TermItem has a !isDescriptionLink guard hiding delete for description-derived links (TermItem.tsx:63-71)."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |-
      For a term linked ONLY via the manual Add-term path, delete works. But the
      backend DELETE filters on IS_DESCRIPTION_LINK.isFalse() — it removes ONLY
      manual term-links (DatasetFieldController sidecar invariant + name_behavior_pairs
      DRIFT_NAME_VS_BEHAVIOR; TermRelationsRepositoryImpl.java:179). A term linked
      via BOTH the manual path AND a [[namespace/name]] marker in the description
      has two rows; DELETE removes only the manual row and the term REMAINS visible
      (carried by the surviving description-link row). The UI mitigates by hiding
      the delete affordance on description-link rows (TermItem.tsx:63-71), but a
      DUAL-linked term still presents a working-looking delete that does not remove
      the term.
    evidence:
      - sidecar: odd-platform__java__DatasetFieldController__controller-class__DatasetFieldController.md
        section: stress_findings.name_behavior_pairs / bugs_limitations_corner_cases
        cite: "TermRelationsRepositoryImpl.java:179; TermItem.tsx:63-71"
        note: "DELETE removes only manual links; dual-linked term survives — delete appears to succeed but term stays"
    operator_visible_failure: |-
      For a term that is both manually-linked and description-mentioned, the
      operator clicks delete, the row's delete returns success, but the term stays
      in the list (the description-link row survives). The remedy — edit the
      description and remove the marker — is undocumented and non-obvious. The
      operator concludes the delete is broken.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

