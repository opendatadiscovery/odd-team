control_summary: |-
  0 of 4 cells PROBED — feature SEEDED from SHB-060 shoebox thread + reaffirmed
  at multiple sidecar primary sources (ActivityServiceImpl batch A,
  AlertServiceImpl batch I, AuthIdentityProviderImpl F-011 batch R, ReactiveUserOwnerMappingRepositoryImpl).
  The headline behaviour — every "My" view in the platform silently
  degrades for users without a user_owner_mapping row — is a
  cross-cutting UX gap, NOT a single-endpoint bug.

  Status: ui-incomplete. The backend chain is composed PRIMARY-SOURCE at
  every hop; the UI half — whether Activity.tsx and Alerts.tsx render
  the silent-empty payload as a generic empty-state OR surface any
  diagnostic affordance — is inferred from F-021 batch-ZL + F-007
  batch-ZL component-tier notes but not enriched at a dedicated
  empty-state-component sidecar. Drift facets carrying UI-dependent
  meaning are marked `ui_unverified: true` per Rule 0b LSN-023.

  The HIGHEST-LEVERAGE probe candidate, executable on the maintainer's
  local workstation:
  (P-shb060-1) **Silent-empty pin** — bootstrap docker-compose ODD platform
    + Postgres + LOGIN_FORM auth + create user "bob" with valid login
    credentials but NO user_owner_mapping row; log in as bob, navigate
    to Activity → My objects, observe empty list; navigate to Alerts →
    My tab, observe empty list; query `/api/activity/counts` and
    `/api/alerts/counts`, observe zeros. Pins the load-bearing
    cross-feature silent-empty contract.

  REFACTOR-NNN candidates: (a) `hint: "no_owner_association"` payload at
  the controller boundary; (b) shared `<EmptyStateAffordance kind="no_owner_association" />`
  component; (c) global "missing association" widget at toolbar layer.
  The third is highest-leverage but requires the most refactor scope.

  Cross-feature coherence: F-064 is a SIBLING of F-021 (Activity Feed —
  read surface where the silent-empty manifests), F-014 (Per-Entity Alert
  View — sibling alert silent-empty), F-011 (Principal-to-Owner Resolution —
  the underlying chokepoint), and the future F-015 (My-Objects Anchor-Set
  Reads — every "My" view in the platform). The pillar slot is P-07:F-007
  (seventh sub-feature inside Active Platform Features — sibling to F-007
  AlertManager, F-009 Notifications, F-014 Per-Entity Alert View, F-021
  Activity Feed, F-038 Data Collaboration, F-039 GenAI Assistant).
