      - Scenario B: `Seq Scan` on 1M rows = expected ~50-200ms per partition
      - Scenario C: `Seq Scan` on 10M rows = expected ~500ms-2s per partition
    contrast: |
      Run also: EXPLAIN (ANALYZE, BUFFERS) SELECT 1 FROM <partition> LIMIT 1
      — measure short-circuit cost. Hypothesis: O(1) on any partition size
      (planner emits `Limit` + `Seq Scan` with early exit on first row).
  - kind: application_metric
