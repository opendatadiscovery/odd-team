# Platform Feature-Flag Exposure — product-owner reflection

## product_owner_narrative

Platform Feature-Flag Exposure is the one small mechanism that lets a deployment turn two optional, heavyweight subsystems on or off and have the user interface react: **Data Collaboration** (the Slack-backed Discussions surface) and **Alert Notifications**. When the single-page app mounts, it fires one request — `GET /api/features/active` — and stores the returned list in Redux; from then on, every UI control that belongs to one of those subsystems asks "is my feature in that list?" before it renders (per `odd-platform__java__FeatureController...:understanding` + Rule-8 read `WithFeature.tsx:23`). The audience is two-sided: the **platform operator** who flips `datacollaboration.enabled` / `notifications.enabled` in `application.yml` and expects the UI to follow, and the **end user** who should only ever see the affordances their deployment actually supports. There is no user-facing screen for this feature — it is invisible plumbing whose only job is to make other features appear and disappear cleanly.

A user never interacts with this feature directly. The interaction is entirely indirect: the operator sets two booleans at deploy time, and the end user observes the consequences — an "Open in Slack" button that is present or absent, a Discussions thread surface that exists or does not (per `FeatureController` sidecar `audiences` block, citing `Message.tsx:59`, `DataEntityDetailsHeader.tsx:132`). The request itself is parameterless: it takes no query parameter, no body, and ignores the per-request handle it is given (`FeatureController` sidecar `stress_findings.request_inputs` — the `ServerWebExchange` is received but never read). The response is the same for everyone — there is no per-user or per-role tailoring (`FeatureController` sidecar `security.owner_scoping: N/A`); the flags are a property of the deployment, not of the person.

The working parts are deliberately tiny. The backend resolves the two booleans **once, at boot**, into an immutable `Set<Feature>` and hands back a fresh copy of that same set on every call (`FeatureController` sidecar `implicit_adrs[0]` + `stress_findings.name_behavior_pairs[0]`, citing `FeatureResolverImpl.java:14,16-31`). Both flags default to **false**, so a stock install returns an empty list and both optional surfaces are hidden (`FeatureController` sidecar `understanding`, citing `application.yml:173,205`). The UI side has exactly one consumer primitive — `WithFeature` — which renders its children when the named feature is in the set and renders **nothing** otherwise (Rule-8 read `WithFeature.tsx:31-32`). There is no polling, no re-fetch, no cache invalidation: the value is captured at app-mount and frozen for the session (feature-flow `amplification_note`).

This feature is the meeting point of three pillars and the place where they fail to line up. It is **anchored in Security & Access Control (P-09)** because its accessibility shifts across the four auth modes and because under `auth.type=DISABLED` it is anonymously reachable. It **serves Active Platform Features (P-07)** because the two flags it exposes are exactly the two opt-in subsystems that pillar describes (`system-mission.md` P-07 sub-feature seed: Data Collaboration + Notifications). And it **collides with the UI shell / navigation chrome (F-041)** because the navigation toolbar — the thing that lands a user on a feature's pages — never consults the feature-flag set at all (`ToolbarTabs` sidecar `understanding` + `security.known_security_gaps[1]`, citing the zero-match Grep for `WithFeature|getActiveFeatures` across the AppToolbar subtree). The promise the endpoint name makes ("active features") and the promise the toolbar makes ("these are the surfaces you can use") are honoured in two different places and reconciled in neither.

A product owner demoing this would highlight the empty states and the silent ones. With both flags off (the shipped default), the Discussions tab and the Open-in-Slack button simply are not there — and there is no placeholder explaining why, because `WithFeature` returns `null` (Rule-8 read `WithFeature.tsx:32`). With Data Collaboration **off** but the user clicking the "Data Modelling" tab anyway, they land on a page whose feature-gated controls are wrapped and therefore invisible — a half-empty surface with no signal that the operator disabled something (`ToolbarTabs` sidecar `bugs_limitations_corner_cases[0]` + feature-flow `observed_vs_expected.facets[3].operator_visible_consequence`). And an operator who toggles a flag at runtime and refreshes will be surprised: the running process keeps returning the boot-time set until it is restarted (`FeatureController` sidecar `bugs_limitations_corner_cases[1]`). These are the corner cases this reflection turns into falsifiable hypotheses below.

