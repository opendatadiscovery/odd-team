  Three DOC-NNN candidates flow from the new findings:
    (a) Document the (username, provider) compound key shape on
        user-owner-association doc page
    (b) Document the auth-mode migration playbook on the authentication
        doc page (audit user_owner_mapping for overlapping usernames
        before migrating)
    (c) Document the S2S username='ADMIN' literal on the S2S auth doc
        page until the code-fix lands

  **NEW batch N — TWO MORE DOC-NNN candidates**:
    (d) Document the multi-row-per-oidc_username schema permission on
        the user-owner-association doc page — operators' mental model
        is "one user, one mapping" but the schema permits two-row
        coexistence; an operator inspecting USER_OWNER_MAPPING needs
        the docs
    (e) Add an operator-facing audit-script in the operations playbook
        to scan for cross-provider username overlap (e.g.
        `SELECT oidc_username, COUNT(*) FROM user_owner_mapping WHERE
         deleted_at IS NULL GROUP BY oidc_username HAVING COUNT(*) > 1`)

  **NEW batch O — TWO MORE DOC-NNN candidates**:
    (f) Document the GitHub username-rename risk on the OAuth2/OIDC
        GitHub config page — operators need to know that
        `user-name-attribute: login` (the default) binds USER_OWNER_MAPPING
        to a mutable IDP identifier. Suggest using `id` as the username
        attribute for stable identity binding.
    (g) Add an operator-recovery procedure for orphan USER_OWNER_MAPPING
        rows post-rename: (1) operator detects rename via business
        channel; (2) operator either re-creates the association request
        with the new username OR runs a manual UPDATE to migrate the
        owner_id binding from (old_login, github) to (new_login, github).
        Suggest adding admin tooling at /api/owner_association_request
        to support this workflow.

  Cross-link to F-011 (Principal-to-Owner Resolution): batch O confirms
  the GitHub identity-source angle of F-011's compound_key_silent_in_docs
  facet. The drift facet now has THREE distinct manifestations:
  (1) cross-mode migration (LOGIN_FORM ↔ LDAP, batch K + N),
  (2) S2S 'ADMIN' literal collision (batch K),
  (3) GitHub free-rename identity drift (batch O — NEW).
  Same facet, different surface; each requires distinct operator
  awareness + distinct mitigation.
