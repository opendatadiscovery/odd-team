name: Plaintext collector token rendered into DOM + fragile substring-prefix-sniff masking detection (UI-side credential hazards)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
  - P-09
description: |-
  **NEW MEDIUM-severity INVARIANT, batch 2026-05-20-Q (CollectorsList
  primary source)** — two coupled UI-side hazards in the collector
  token surface:

  **(A) Plaintext token rendered into DOM text node**: A freshly-
  created or freshly-regenerated collector token (40-char alphanumeric
  per `RandomStringUtils.randomAlphanumeric` per the existing
  `collector-token` entity) is rendered DIRECTLY INTO THE DOM as
  plaintext via `<Token>{collector.token.value}</Token>` at
  `CollectorItemToken.tsx:34`. There is:
    - NO `<input type='password'>`-style obfuscation
    - NO Reveal-on-hover affordance
    - NO auto-hide-after-N-seconds timer
    - NO copy-to-clipboard-and-immediately-mask pattern
    - NO viewport-scrolled-out-of-view defence

  Any browser extension with content-script access, any screenshot
  tool, any accessibility screen reader, any DOM-inspection tool,
  any browser-cache mechanism captures the credential by default.
  The visible warning admonition ("Save token in a secure location.
  You will not be able to retrieve it again." per
  `CollectorItem.tsx:87-98`) is the SOLE operational mitigation —
  operator vigilance.

  **(B) Token-visibility detection is a literal substring-prefix sniff
  on `'******'`** (six exact stars): `useEffect(() => {
  setIsHidden(collector.token.value.substring(0, 6) === '******'); },
  [collector.token.value]);` at `CollectorItemToken.tsx:25-27`. The
  client-side flag `isHidden` drives:
    - The mask-vs-plaintext rendering branch
    - The Copy-button vs Regenerate-button choice
    - The warning admonition's appearance

  The mask format is decided by the backend at
  `TokenMapper.java:15-18`: `"******" + value.substring(value.length()
  - 6)`. A FUTURE BACKEND CHANGE to the mask format (e.g. shortening
  to 4 stars `****{last6}`, switching to a Unicode block character
  `▒▒▒▒▒▒…`, prepending whitespace, dropping the mask entirely)
  would SILENTLY BREAK the visibility detection — the UI would offer
  the Copy button on a masked value, copying `******abc123`-style
  fragments to the operator's clipboard.

  **The shared underlying pattern**: the token-visibility contract
  between backend and UI is implicit (mask format) and unenforced
  (no automated test, no version negotiation, no API-level "is this
  masked" boolean). A backend refactor changing the mask is
  detectable only by manual UI testing.

  **Why MEDIUM severity**:
    - (A) — operator vigilance can mitigate; the admonition is
      visible; not all token-display surfaces are equally exposed
      (the regenerate / create response IS the only display path
      for the plaintext). Severity is bounded by operator awareness.
    - (B) — silent regression on a refactor would leak credential
      fragments to clipboards in a way operators expect to be safe.
      Severity is bounded by the likelihood of a backend mask-format
      change (LOW probability — the backend mask format has been
      stable). Combined severity MEDIUM.

  **Mitigations** (already enumerated in CollectorsList sidecar
  bugs_limitations_corner_cases + security.known_security_gaps):
    - Use `<input type='password'>` with a Reveal-on-hover affordance
      (industry-standard pattern for secret display)
    - Auto-hide the plaintext after N seconds with a "Copy now"
      countdown
    - Backend-supplied `tokenVisible: boolean` field on the Collector
      DTO removes the substring-sniff entirely (explicit contract)
    - Vitest tests asserting (i) plaintext renders Copy + admonition;
      (ii) masked renders Regenerate; (iii) various mask formats
      (4 stars, 6 stars, Unicode) handled per current code

  **Cross-batch coherence (LSN-018)**: this sidecar STRENGTHENS the
  existing `collector-token` entity (the regenerateCollectorToken
  sidecar already catalogued the backend-side plaintext + non-CSPRNG
  + no-audit weaknesses; this sidecar adds the UI-side DOM-rendering
  + fragile-detection hazards as the THIRD evidence point in the
  token-hygiene cluster).
