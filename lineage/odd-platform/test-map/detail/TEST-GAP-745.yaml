proposed_action: |-
  Add `QueryExampleControllerHttpFloorTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Six test methods minimum (one per architectural concern):
  1. `createQueryExamples_returnsHttp200NotSpecDeclared201_pinsStatusCodeDrift` — POST `/api/queryexample` with valid body; assert 200 (not the spec-declared 201).
  2. `createQueryExamples_callerWithoutQUERY_EXAMPLE_CREATE_returns403` — pin the SecurityRule enforcement at line 112-113.
  3. `getQueryExampleByDatasetId_callerWithNoOwnerAssociation_succeedsCrossOwner_pinsReadCollaborativePosture` — pin the 10-of-13 ungated read posture.
  4. `queryExamplesSearch_searchIdFromAnotherUser_canBeRetrieved_pinsSessionUuidOnly` — pin the no-caller-binding contract.
  5. `getQueryExampleByDatasetId_returnsHasNextFalseAlways_pinsBrokenPagination` — pin the hard-coded `hasNext=false` contract (per `QueryExampleMapper.mapListToQueryExampleList` line 72-74).
  6. `deleteQueryExample_orphanLinkRowAndSearchEntrypoint_pinsCascadeIncompleteness` — pin the cascade-incompleteness from TEST-GAP-742 at the HTTP boundary.

  Add a `// REGRESSION-PIN — QueryExampleController HTTP-tier floor. Asserts the 3-of-13 gating asymmetry + the spec/code response-code drift + the read-collaborative posture + the broken-pagination + the cascade-incompleteness all at the HTTP boundary. A SecurityConstants editing error moving any of the 3 gated rules will break the relevant test.` comment block.
