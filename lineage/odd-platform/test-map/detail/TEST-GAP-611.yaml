  - "GithubUserHandler.md:bugs_limitations_corner_cases (similar pattern across handlers)"
behaviour: |-
  **No null-guard on `oAuth2Properties.getClient().get(registrationId)` lookup — NPE in pathological reconfigure scenarios.** GoogleUserHandler line 46: `final ODDOAuth2Properties.OAuth2Provider provider = oAuth2Properties.getClient().get(registrationId);` — if `registrationId` isn't present in the map (Spring framework guarantee violation, but possible during reconfigure-without-restart with dynamic Spring contexts), `provider` is null and line 50 `provider.getAllowedDomain()` throws NPE. ALL handlers share this pattern uniformly: AbstractOIDCUserHandler.java:28, GithubUserHandler.java:52, ODDIAMUserHandler.java:35. Spring guarantees registrationId is bound at registration; only triggers in pathological reconfigure scenarios. Pin the consistent uniformly-no-null-guard pattern across the chain — future addition of null-guards (defensive coding) would be a deliberate shift in the design stance.
test_class: missing-edge-case
test_files_existing: []
test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/handler/OAuthHandlerProviderLookupNullSafetyTest.java"
  name: "enrichUser_unknownRegistrationId_providerLookupReturnsNull_npeOnDereference_pinsUniformPattern"
evidence:
  - "GoogleUserHandler.md says (bugs_limitations_corner_cases.[4]): 'No null-guard on provider — NullPointerException if oAuth2Properties.getClient().get(registrationId) returns null. The other handlers (AbstractOIDCUserHandler.java:28, GithubUserHandler.java:52, ODDIAMUserHandler.java:35) have the same pattern — uniformly no null-guard. The fragility is shared across all handlers, not specific to Google.' severity: LOW"
  - "GoogleUserHandler.java:46 + GithubUserHandler.java:52"
cross_references:
  - "F-011"
proposed_action: |-
  Parameterised unit test across all 5 OAuth handlers (Google, GitHub, Cognito, Azure, ODDIAM). (a) Mock OidcUserRequest with a registrationId NOT in the ODDOAuth2Properties.getClient() map. (b) Invoke enrichUserWithProviderInformation. (c) Assert NullPointerException is thrown (current uniformly-no-null-guard behaviour). (d) Pin the design stance; future defensive null-guard introduction flips assertions.
