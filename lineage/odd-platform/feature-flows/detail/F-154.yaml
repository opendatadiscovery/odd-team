feature_name: |-
  Term Create / Edit Form — the dialog mounted from "Add term" CTA
  (TermSearchHeader) and "Edit" CTA (TermDetailsHeader). Carries client-side
  duplicate detection, no error-path handling for backend failures,
  Markdown definition editor (XSS surface), and an invalidate-by-undefined-key
  bug in create mode.
