name: Permission-bypass via Owner auto-create (side-door write path)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-12F** — codebase-wide structural permission-bypass
  pattern. The documented `OWNER_CREATE` permission is supposed to gate Owner directory
  growth via `POST /api/owners` (per batch E createOwner). But `DataEntityController.createOwnership`
  (`POST /api/dataentities/{id}/ownership`) accepts a free-text `owner_name` and calls
  `OwnerService.getOrCreate(name)` which silently INSERT-s a fresh `OwnerPojo` when
  the name is novel (`OwnerServiceImpl.java:39-42`). Any caller with `DATA_ENTITY_OWNERSHIP_CREATE`
  on any data entity can mint Owner directory entries WITHOUT holding `OWNER_CREATE`.
  SAME pattern on Title — `TitleService.getOrCreate(title_name)` (`TitleServiceImpl.java:19-22`)
  auto-creates Title rows; there is NO documented Title-create permission gate at
  all (Title is fully free text — no enum, no allowlist, no length cap on the `title_name`
  field, `components.yaml:450-451` declares only `type: string`). **The codebase has
  a 2-tier directory-growth story**: explicit-path-grow via `POST /api/owners` (gated
  by `OWNER_CREATE` per SECURITY_RULES) AND side-door-grow via `POST /api/dataentities/{id}/ownership`
  (gated only by `DATA_ENTITY_OWNERSHIP_CREATE`). The asymmetry is silent: no doc
  warns operators; no @Slf4j log call captures the side-effect; the `@ActivityLog(OWNERSHIP_CREATED)`
  audit event fires for the ownership-binding but NOT for the Owner/Title-directory
  growth. **Codebase-wide analog risk**: any future endpoint with auto-create-on-missing
  semantics (`getOrCreate`, `findOrInsert`, `ensureExists`) inherits this side-door
  pattern unless it explicitly checks the create-side permission. Recommended remediation:
  extend `OwnerService.getOrCreate(...)` to take a `caller-must-hold(OWNER_CREATE)`
  constraint OR factor the auto-create into an explicit `createIfAbsent` method that
  checks the permission AND emits an audit signal. Same for `TitleService.getOrCreate`.'
