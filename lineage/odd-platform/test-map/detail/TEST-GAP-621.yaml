behaviour: |-
  **TOKEN REUSE / DELETED COLLECTOR / NAMESPACE-INHERITANCE EDGE CASES — all unprotected at the filter+controller boundary.** Three load-bearing edge cases at the IngestionDataSourceFilter integration point with NO test coverage: (1) **Token reuse across collectors**: if (by misconfiguration) two Collectors share the same TOKEN.value, `collectorRepository.getByToken(token)` returns the FIRST match (the query doesn't enforce uniqueness — TOKEN.value has no UNIQUE constraint visible at the schema level via the repository code). COLLECTOR_ID_SESSION_KEY gets set to the first-matched collector id; cross-collector data-source registration becomes silently possible. (2) **Soft-deleted collector path**: the filter's `collectorRepository.getByToken(token)` query joins TOKEN on COLLECTOR_ID and filters by `addSoftDeleteFilter` (per ReactiveCollectorRepositoryImpl.java:89-97). If a collector is soft-deleted while its token is still valid, the filter returns Mono.empty() → AccessDeniedException → 401. This is the INTENDED safe behaviour but is NOT tested — a regression that drops the soft-delete filter would resurrect deleted collectors' tokens. (3) **Namespace-from-collector-not-payload invariant**: re-POSTing a datasource with a `namespace_name` field set in the payload — the platform's namespace_id remains the COLLECTOR's namespace, NOT a namespace looked up from the payload field. NO test pins this contract. The current mapper at DataSourceIngestionServiceImpl.java:106 inherits from the Collector unconditionally; a refactor that adds payload-namespace-lookup would break the tenancy model silently.
