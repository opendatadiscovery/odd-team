name: '@Slf4j present but unused — no audit trail at IngestionServiceImpl + DatasetFieldServiceImpl.updateStatistics'
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
- P-10
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20-Z** —
  `IngestionServiceImpl.java` declares the Lombok `@Slf4j` annotation
  at the class level (per the IngestionServiceImpl sidecar) BUT no
  method body invokes any `log.info / log.warn / log.error / log.debug`
  call across the entire `ingest(...)` flow (the ENTIRE per-batch
  reactive chain — datasource resolution / entity partition /
  bulkUpdate / bulkCreate / processor chain dispatch / OTLP metric
  export / response). The same shape repeats at
  `DatasetFieldServiceImpl.updateStatistics` (line 158-181) — `@Slf4j`
  imported at the class level, ZERO log calls on the stats-ingestion
  path (the sole log.error at line 240-241 fires only in an inverse
  branch that cannot actually execute by construction).

  **The audit-trail consequence**: a security or operational incident
  asking 'who ingested what data when, against which datasource, with
  which token' has NO operational answer from application logs.
  Activity Feed (the platform's user-facing audit surface) covers
  data-entity-side mutations (per the AUDIT-LOG-PRESENCE-ASYMMETRY-2-TIER
  pattern) BUT NOT ingestion writes; the ingestion path has no
  `@ActivityLog` annotation on either service method. The platform's
  combined log+activity audit surface for ingestion is ZERO.

  **Composition with REFACTOR-185 AUTH-MODE-ORTHOGONAL facet**: under
  default deployment the three S2S sub-path endpoints (metrics + stats +
  get-by-deg) are unauthenticated. Combined with the audit-trail gap,
  a post-incident investigation of 'who wrote what stats / who triggered
  which ingestion' has NO data-side log AND no authentication context
  to correlate with. Compounds the LSN-001 / LSN-002 risk pattern
  (silent failure mode under default configuration).

  **The contrast with sibling methods**:
    - `DatasetFieldServiceImpl.updateInternalName` (line 99) IS
      `@ActivityLog(event = DATASET_FIELD_INTERNAL_NAME_UPDATED)`
    - `DatasetFieldServiceImpl.updateDatasetFieldTags` (line 119) IS
      `@ActivityLog(event = DATASET_FIELD_TAGS_UPDATED)`
    - `DatasetFieldServiceImpl.updateStatistics` (line 158-181) has
      NEITHER `@ActivityLog` NOR any `log.*` invocation
  The omission is an asymmetry WITHIN the same service class.

  **Severity MEDIUM**: the operational consequence is real (post-incident
  investigation is impossible) but the absence is fail-silent (no
  visible failure to operators in normal ops). Composes with
  REFACTOR-185 to amplify the impact.
