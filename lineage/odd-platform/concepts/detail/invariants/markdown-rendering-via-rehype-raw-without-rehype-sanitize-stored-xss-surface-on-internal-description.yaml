name: Markdown rendering via rehype-raw without rehype-sanitize → stored-XSS surface
  on internal_description
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
- P-09
description: |-
  Backend stores the description body verbatim (no Jsoup.clean, no Encode.html, no
  allowlist, no length cap). UI renders via @uiw/react-markdown-preview@4.2.2 which
  transitively pulls in rehype-raw@6.1.1 (parses raw HTML embedded inside Markdown
  into AST nodes). NO rehype-sanitize configured anywhere in the UI (grep -rln
  'rehype-sanitize' returns 0). NO skipHtml prop set. Every authenticated reader
  of an entity (DATA_ENTITY_VIEW = effectively every catalog visitor) is downstream
  of the writer's payload. A future minor-version bump of any rendering library
  can widen the surface invisibly with no test catching the regression. **Batch J
  — UI HALF EMPIRICALLY PINNED**: P-009 slice-5/-6 probe (run R-20260519T020610Z-P-009
  on commit ede5d277) confirmed the F-004 fingerprint: script + img-id + iframe-id
  substrings DO reach the rendered DOM (`dom_has_script_tag == True`,
  `dom_has_xss_img_id == True`, `dom_has_xss_iframe_id == True`) — confirming the
  surface IS open at the rehype-raw layer. Event-handler attributes are stripped
  by React's attribute filtering (`dom_has_onerror_attr == False`) AND script
  execution is blocked by Chromium HTML-parser policy (`xss_dialog_fired == 0`,
  `xss_leak_count == 0`). **These are defence-in-depth mitigations, NOT
  application-layer defences**: relaxing CSP, switching to dangerouslySetInnerHTML,
  adopting an SVG payload with `onload`, or testing on a different browser
  (Firefox/Safari NOT empirically verified) re-opens the surface. The DataEntityDescription
  cluster (InternalDescription + InternalDescriptionPreview + Markdown shared
  element + useTermWiki hook) is the canonical write+read path; sibling
  DatasetFieldDescription cluster shares the same Markdown shared element. P-009
  is the regression-pin for the F-004 fix (adding rehype-sanitize would flip
  `dom_has_script_tag` from True to False).
