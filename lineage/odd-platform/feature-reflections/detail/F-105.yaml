- id: H-003
  hypothesis: |-
    When a user navigates to /management/policies/{id} without POLICY-related
    permissions, they cannot read the policy's authorization grants (the policy
    JSON: permission codes, ODDRN selectors, role bindings).
  derivation: |-
    A policy's JSON contents are the operative authorization rules of the
    deployment; the negative-space expectation is that the most sensitive admin
    surface gates its read. PolicyList renders only {id,name}; detail loads JSON
    on row-click (PolicyList:understanding).
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The policy detail page renders the full JSON regardless of POLICY
      permissions. PolicyList.tsx shows {id,name} rows; clicking a row routes to
      PolicyDetails.tsx → PolicyForm.tsx, which mounts AppJSONEditor against the
      schema from GET /api/policies/schema and the policy's own statements. The
      only gate is on the Save button (POLICY_UPDATE) and the Create CTA
      (POLICY_CREATE). For non-ADMIN users the SERVICE layer narrows the visible
      list to policies attached to the user's own roles (PolicyServiceImpl.java:53-60),
      but ADMIN users — and any user whose roles include the policy — read the
      full JSON, and the route itself never blocks navigation.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__PolicyList.md
        section: understanding
        cite: "PolicyList.tsx:119 + PolicyServiceImpl.java:53-60,97-100"
        note: "list = {id,name}; detail mounts full JSON; non-ADMIN list narrowed by role-attachment at the service."
    operator_visible_failure: |-
      A non-admin user with at least one role can read the full authorization
      JSON of every policy attached to any of their roles — including the exact
      permission codes and ODDRN selectors that define what those policies grant.
      A security reviewer expecting "policy contents are admin-only" is wrong; an
      operator auditing separation-of-duties cannot rely on the UI to hide the
      RBAC topology. The non-ADMIN list-narrowing (role-attachment scoping) is a
      partial mitigation for the LIST, but provides no protection once the user
      navigates to a policy id their role touches.
    severity: HIGH
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |-
    When a create/edit/delete action is unavailable to the user, the UI shows
    the button in a disabled/greyed state so the user understands the action
    exists but requires a permission.
  derivation: |-
    A senior-PO UX question (Rule 9: "does the user understand how to use this
    from what is on screen?"). The intuitive convention for an unavailable action
    is disable-with-tooltip, not hide.
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |-
      The platform's deliberate convention is hide-not-disable: WithPermissions
      returns null (renders nothing) when hasAccessTo(permissionTo) is false
      (WithPermissions.tsx:28). The Create-policy button is therefore INVISIBLE,
      not greyed, to a user without POLICY_CREATE (PolicyList.tsx:91-98). The
      hypothesis as a UX expectation is contradicted by the convention, BUT the
      convention is intentional and consistent across every Management write
      affordance (PolicyList:implicit_adrs documents it as the platform-wide
      pattern). So the implementation is confirmed-as-deliberate, not a defect —
      the trade-off (no permission noise vs. no discoverability of gated actions)
      is an accepted design choice now also stated in the live Authorization doc
      ("hide-not-disable UI convention").
    evidence:
      - sidecar: odd-platform__ts__react-component__component__PolicyList.md
        section: implicit_adrs
        cite: "PolicyList.tsx:91-98 + WithPermissions.tsx:11-32"
        note: "hide-not-disable is the consistent platform convention; intentional."
      - sidecar: odd-platform__ts__routes__route__management.md
        section: docs_link_semantic
        cite: "WebFetch authorization (2026-06-03, status 200)"
        note: "live doc now names the hide-not-disable convention explicitly."
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    When the platform runs under auth.type=DISABLED, an anonymous network caller
    (never logged in) who navigates to /management/policies is blocked from
    reading the policy catalog.
  derivation: |-
    Negative-space + cross-pillar (P-09): an operator exposing the platform to a
    network expects the admin surface to require authentication even under
    DISABLED, OR expects DISABLED to be documented as wide-open.
  seed_source: cross-pillar
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Static analysis (route__management:stress_findings.auth_gates) reads: under
      DISABLED the SPA mounts anonymously, fetchIdentity (App.tsx:48) returns
      whatever the back-end gives anonymous sessions (typically a default identity
      with empty global permissions), and the Management lists render. Under
      LOGIN_FORM/OAUTH2/LDAP the Spring Security layer redirects unauthenticated
      visitors to login BEFORE the SPA is served. IT-009 confirms DISABLED leaves
      non-whitelisted endpoints anonymously reachable (anyExchange().permitAll()),
      which makes the DISABLED-read-bypass HIGHLY likely — but IT-009 probes
      /api/dataentities/classes, not the Management list endpoints, and the exact
      identity/permission set the back-end injects for anonymous sessions is
      flagged "verify with P-162" in the sidecar. Running the system is required
      to confirm the rendered list payload, not just the endpoint reachability.
    evidence:
      - sidecar: odd-platform__ts__routes__route__management.md
        section: stress_findings.auth_gates
        cite: "App.tsx:48 + ManagementRoutes.tsx:101-110 + PermissionContext.ts:9-13"
        note: "DISABLED branch renders lists; anonymous identity/permission set marked verify-with-P-162."
    operator_visible_failure: |-
      If confirmed: a platform exposed to a public or shared network under
      auth.type=DISABLED leaks the entire RBAC topology + catalog (policy JSON,
      collector identities, datasource ODDRNs) to any anonymous caller who can
      reach the SPA — the REFACTOR-185 19-sidecar cluster anchors the
      public-exposure shape. The mitigation operators assume ("Management is
      admin-only") does not exist; the only perimeter is the network itself.
    severity: HIGH
    confidence: MEDIUM
    probe_id: PENDING-F-105-1
    routes_to_finding: probe-needed
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: |-
    When an integration feature inside /management/integrations checks an
    integration-specific permission (e.g. via usePermissions().hasAccessTo),
    the check evaluates against the user's actual integration permissions.
  derivation: |-
    Endpoint-shape / view-mode: /management/integrations is a first-class
    sub-area; a permission check inside it should resolve against that area's
    permission context. The feature-flow facet
    integrations_sub_area_has_no_permission_context_at_all flags a structural risk.
  seed_source: view-mode
  validation:
    verdict: contradicted
    actual_behavior: |-
      The /management/integrations and /management/integrations/:id routes have NO
      WithPermissionsProvider wrapping at all (ManagementRoutes.tsx:150). Every
      other sub-route at least wraps in a context provider that SETS the contextual
      allowedPermissions used by inner hasAccessTo checks. Without a wrapping
      provider, any inner usePermissions().hasAccessTo(<integration permission>)
      inside the Integrations subtree falls back to the OUTER Management.tsx
      context, whose allowedPermissions = [OWNER_ASSOCIATION_MANAGE] only. Per
      PermissionProvider.tsx:27-32, hasAccessTo resolves via
      allowedPermissions.includes(...), so a check for e.g. DATA_SOURCE_UPDATE
      deny-by-defaults regardless of the user's real grants (OWNER_ASSOCIATION_MANAGE
      != DATA_SOURCE_UPDATE). Today no Integration component is confirmed to call
      usePermissions (the grep is a P-162 follow-up), so it is currently latent.
    evidence:
      - sidecar: odd-platform__ts__routes__route__management.md
        section: security
        cite: "ManagementRoutes.tsx:150 + Management.tsx:9-12 + PermissionProvider.tsx:27-32"
        note: "no provider on integrations route; inner checks fall through to OWNER_ASSOCIATION_MANAGE context."
    operator_visible_failure: |-
      The day a permission-gated integration feature ships (any control wrapped in
      a hasAccessTo(<integration permission>) check inside the Integrations
      subtree), it will be DEAD for every user — no admin can use it without being
      explicitly granted OWNER_ASSOCIATION_MANAGE, which is semantically unrelated
      to integrations. The failure is silent (hide-not-disable: the control simply
      never appears) and would present as "the new integration toggle does
      nothing / isn't there" with no error. This is a future foot-gun baked into
      the route topology now.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

