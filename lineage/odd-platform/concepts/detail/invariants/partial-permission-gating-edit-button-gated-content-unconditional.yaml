notes: |-
  New invariant captured in batch 2026-05-19J. The partial-gating semantic is
  the UI-layer realisation of the read-collaborative posture. The pattern is
  consistent across the platform (DataEntityDetails header, DataEntityDescription
  cluster, presumably other detail-page surfaces).

  **STRENGTHENED batch 2026-05-20-Q** with 4 Management list component
  confirmations — the pattern is now confirmed across 6 components spanning
  both the DataEntity detail-page tree AND the Management list tree. The
  HIDE-not-DISABLE convention is platform-wide.

  **REFINED batch ZH (2026-05-26)** — the WithPermissions vs
  WithPermissionsProvider distinction is now explicit. Batch ZH adds 5
  route-module contributors making the platform-wide convention visible
  at 11 distinct primary sources. The new sibling invariant
  `withpermissionsprovider-context-seed-not-route-gate` documents the
  Provider's name-vs-behaviour drift as a first-class concept.

  The risk surface is REFACTOR fragility: an engineer "tidying up" the WithPermissions
  placement could easily flip the semantic from "edit gated" to "content gated",
  hiding the content from legitimate readers. The fix is a SCREAMING test that
  assertively pins the current semantic: "a non-editor sees the description text
  AND does not see the Edit button". Without that test, every refactor risks the
  semantic shift.

