  - kind: docker-compose-up
    note: odd-platform + Postgres, auth.type=DISABLED
  - kind: sql
    query: |
      INSERT INTO token (id, name, value, created_at, updated_at)
      VALUES (7601, 'p076-token', 'p076tokenvalue0000000000000000000000token', NOW(), NOW())
