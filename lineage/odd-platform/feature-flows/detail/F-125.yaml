seeded_at: 2026-05-26
discovered_from_entry_point: |-
  rest:POST /api/collectors/{id}/token (regenerate) + DELETE
  /api/collectors/{id} (soft-delete) + parallel surfaces on
  /api/datasources. Token table has NO `deleted_at`; regenerate UPDATEs
  in place (no grace period); soft-delete-collector leaves token row
  dangling; HousekeepingJobManager does NOT touch orphan tokens.
