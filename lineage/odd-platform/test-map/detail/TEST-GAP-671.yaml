behaviour: |-
  **Service-bypass attack surface: the repository's inherited `bulkUpdate` faithfully writes ANY non-non-updatable column the caller supplies — the "only name + description" narrowing is a SERVICE-TIER convention enforced by `DataSourceIngestionServiceImpl.prepareForUpdate`** (lines 86-88: `new DataSourcePojo(a).setName(i.getName()).setDescription(i.getDescription())`). The repository's `bulkUpdate` (inherited at `ReactiveAbstractCRUDRepository.java:128-142` → `updateMany` at lines 203-223) builds the SET clause from `recordTable.fields()` MINUS `getNonUpdatableFields()` (id, created_at, deleted_at per `ReactiveAbstractSoftDeleteCRUDRepository.java:113-117`). Every other column (name, oddrn, description, namespace_id, collector_id, token_id, updated_at) is in the SET clause. **A service-bypassing caller invoking `dataSourceRepository.bulkUpdate(pojoListWithChangedCollectorId)` DIRECTLY could write ANY column on `data_source`.** This is the load-bearing refinement to ADR-CANDIDATE-142: the partial-merge contract lives ONE LAYER above the persistence. A future maintainer "improving" the API to expose a bulk-update endpoint without going through `prepareForUpdate` would silently break the cross-collector preservation invariant (a collector B's payload could rebind ODDRN X from collector A to collector B). No test exists at any layer pinning this contract.
