control_summary: |-
  0 of 4 cells PROBED. Feature emerges from the batch-T primary-source
  audit of `DirectoryController` (controller-class) plus references to
  `DirectoryServiceImpl`, `OddrnUtils`,
  `ReactiveDataSourceRepositoryImpl`, and the level-4 delegate chain
  through `DataEntityServiceImpl` → `ReactiveDataEntityRepositoryImpl`.
  Directory is the FIRST P-01 anchored pillar-feature minted via this
  reducer specifically for the hierarchy-driven browse surface;
  prior P-01 features (F-001 + F-003 popular, F-004 description, F-012
  DEG, F-013 metadata, F-017 search facets, F-018 tags) cover
  ranking / editing / search but NOT the hierarchy-driven inventory
  enumeration that Directory IS. The pillar-anchored slot P-01:F-007
  is the next available within P-01 after F-006 (Manual Object
  Tagging = P-01:F-006 in batch N).

  Twelve substantive drift facets cluster around four load-bearing
  themes: (1) cross-owner DATASOURCE INVENTORY enumeration (the
  REFACTOR-024 family extension to a NEW dimension — datasource
  cardinality + hostnames); (2) ODDRN reflection infrastructure-property
  leak (the load-bearing security finding); (3) level-4 page-vs-count
  PREDICATE DIVERGENCE (REFACTOR-NEW, structurally analogous to
  REFACTOR-425); (4) no pagination at levels 1/2/3 + doc silence at
  the Directory page + the API-reference page.

  The highest-leverage probe candidates are: (a) cross-owner inventory
  enumeration pin — auth as a user with no Owner association, GET
  /api/directory + /api/directory/datasources?prefix=postgresql,
  assert 200 + every datasource visible; (b) ODDRN reflection leak
  pin — register a Snowflake datasource with `account` + `warehouse`
  ODDRN properties, GET level 2, assert the properties appear in
  the response unredacted; (c) REFACTOR-NEW level-4 page-vs-count
  divergence — seed dataset+datasource with 3 entities, mark 1
  EXCLUDE_FROM_SEARCH=TRUE, GET /api/directory/datasources/{id}?type_id=
  &page=1&size=10, assert page.size=3 vs count=2 mismatch; (d)
  DISABLED-mode reach — flip `auth.type=DISABLED`, assert anonymous
  reach of all 4 endpoints; (e) `Other` bucket regression pin —
  register a Postgres datasource then break its ODDRN, GET
  /api/directory, assert the source moves to the `Other` bucket
  silently. Local docker-compose probe stack: ODD platform + Postgres
  + 2 seeded Datasources (Postgres + Snowflake) + a soft-deleted
  test entity with EXCLUDE_FROM_SEARCH=TRUE.
