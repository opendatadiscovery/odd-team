proposed_action: |-
  Add `NotificationConfigurationProtocolCaseSensitivityTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/config/`. Two test methods asserting the Properties bag shape for both cases:

  1. `mailSender_protocolLowercaseSmtp_propertiesBagContainsAuthAndStarttls` — construct `EmailSenderProperties` with `protocol="smtp"`, `smtp.auth=true`, `smtp.starttls=true`; invoke `new NotificationConfiguration(...).mailSender(emailProperties)`; reflect into the JavaMailSenderImpl to read the Properties bag; assert `mail.smtp.auth=true` AND `mail.smtp.starttls.enable=true` are both present.
  2. `mailSender_protocolUppercaseSMTP_propertiesBagAlsoContainsAuthAndStarttls_pinsCaseSensitivityFix` — same fixture except `protocol="SMTP"`. **This test FAILS against the current code** (Properties bag has neither `mail.smtp.auth` nor `mail.smtp.starttls.enable`), DOCUMENTING the silent failure mode. The fix is one line at NotificationConfiguration.java:63: `if (emailProperties.getProtocol().equalsIgnoreCase("smtp"))`. Land both fix and test in the same PR.

  Pair with: (a) live-doc update — `/configuration-and-deployment/odd-platform` Gmail example must use lowercase OR call out the case-sensitivity; (b) `@PostConstruct` validator on `EmailSenderProperties` that normalises `protocol` to lowercase at boot, removing the trap entirely.

  Add a `// SILENT-INSECURE-DEFAULT — Per the live docs (Gmail example uses uppercase SMTP), but the code does case-sensitive lowercase comparison. STARTTLS + AUTH silently skipped. This test pins both cases producing the same Properties bag after the .equalsIgnoreCase(\"smtp\") fix.` comment block.
