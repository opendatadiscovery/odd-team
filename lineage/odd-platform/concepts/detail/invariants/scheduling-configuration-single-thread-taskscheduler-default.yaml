notes: |-
  NEW invariant batch ZK (2026-05-26). The first PRIMARY-SOURCE pin to
  the platform-level scheduling FOUNDATION at SchedulingConfiguration.java.
  The four @Scheduled consumers were enumerated in prior batches
  (HousekeepingJobManager batch K, the partition-creation job, the
  status-switch job, the session-housekeeping job batch X); batch ZK
  adds the platform-side observation that they all share ONE thread
  by Spring Boot's default — undocumented in live docs and not surfaced
  by any prior sidecar.

  Three high-priority DOC-NNN candidates from this invariant:
    (a) `/configuration-and-deployment/odd-platform#housekeeping`
        admonition naming the single-thread default + the
        `spring.task.scheduling.pool.size` mitigation
    (b) Platform-side: declare a Micrometer-instrumented TaskScheduler
        @Bean (closes the no-Micrometer gap simultaneously)
    (c) An integration test asserting the 4 @Scheduled jobs serialise
        by default (pins the current behaviour; allows future
        parallel-execution changes to be detected)
