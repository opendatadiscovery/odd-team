behaviour: |-
  **HIGH — Copy-paste integration bug. Operator-observable cap at
  page 1 (30 rows) for any tenant with >30 lookup tables.**

  `LookupTablesList.tsx:51-53` declares:
  ```jsx
  <ScrollableContainer id="lookup-tables-list" $offsetY={165}>
    <InfiniteScroll
      scrollableTarget="directory-entities-list"
      dataLength={...} next={fetchNextPage} hasMore={hasNextPage}
    >
      ...
  ```

  The `scrollableTarget="directory-entities-list"` is a copy-paste
  from `components/Directory/.../DirectoryEntitiesList.tsx` where
  the surrounding ScrollableContainer DOES have id
  `directory-entities-list`. On the Lookup Tables page, the
  surrounding container's id is `lookup-tables-list` — so
  `scrollableTarget` references a DOM node that does NOT exist on
  this page.

  Per react-infinite-scroll-component documentation, an
  unresolvable `scrollableTarget` falls back to listening on the
  WINDOW scroll. BUT — the wrapping `ScrollableContainer` declares
  `$offsetY={165}` and (per the shared styled-components convention)
  applies `overflow: auto` to itself. The user scrolls INSIDE the
  container, not the window. The window scroll event never fires
  for content inside an overflow-auto container.

  **Effective behaviour**: the page renders the first 30 rows
  (`size: 30` hard-coded at LookupTablesList.tsx:23 — the page size
  for `useGetReferenceDataSearchResults`); the user scrolls within
  the container; `fetchNextPage` is never triggered;
  `hasNextPage === true` indefinitely but no further rows fetched.

  **Operator-observable consequence**: any tenant with more than
  30 lookup tables sees only the first 30 in the UI. The page
  COUNTER `<NumberFormatted value={facets?.total} /> lookup tables
  overall` correctly reports the total (e.g. "47 lookup tables
  overall"), but the LIST below it shows only 30 — a visible
  COUNT/LIST divergence that doubles as the operator's only
  signal that something is wrong. There is no error message, no
  "load more" button, no warning.

  **Why HIGH**:
  - **Functional**: the operator cannot reach lookup tables
    beyond row 30. They can search (the SearchInput dispatches
    `updateFacets({...facets, query})` and fetches results) but
    cannot browse.
  - **Discoverability**: any onboarding tenant building lookup
    tables hits this at table 31. The 30→31 boundary is silent.
  - **Coverage**: zero direct tests exist (LookupTables.md
    test_files: [] verified — Glob across
    `**/LookupTables/**/*.test.*` returns zero matches at
    commit 4ec2b20). A single integration test rendering with
    >30 mocked rows would catch the entire failure mode.
  - **Trivial fix**: change `scrollableTarget="directory-entities-list"`
    to `scrollableTarget="lookup-tables-list"`. Single-character
    typo class; the test pins it.

  **Probe P-192** (emitted in batch ZL): boot the platform, create
  35 lookup tables, navigate to `/master-data/lookup-tables`,
  scroll within the container, observe network — assert
  `GET /api/referencedata/search/{id}/results?page=2` IS issued.
  Probe RED today (no second-page request); GREEN after the
  copy-paste fix.

  **Cross-pillar implication**: this is the canonical case-law
  for a category of bugs — "shared infrastructure component
  consumed across multiple pillar pages where the consumer's
  configuration is page-specific and a copy-paste error silently
  breaks one page". The architectural recommendation is to derive
  `scrollableTarget` from the wrapping container's id rather
  than passing it explicitly — but that's a refactor of the
  shared ScrollableContainer + InfiniteScroll convention.
