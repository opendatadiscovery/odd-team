name: Data Quality Engineer
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-04
description: |-
  An operator role focused on the quality of data ingested into the
  ODD catalog — typically responsible for authoring data-quality test
  suites in external frameworks (Great Expectations, dbt tests, custom
  push adapters), monitoring their results across the catalog, triaging
  failures, and assigning severity to tests so SLA badges accurately
  reflect operational priority. NEW audience, batch ZC (2026-05-22).

  Named verbatim in the live https://docs.opendatadiscovery.org/use-cases/use-cases/dq-visibility
  page (linked from the data-quality.md pillar landing) as the primary
  audience of the Data Quality Engineer use case. The standalone
  `/data-quality` dashboard is the role's PRIMARY surface — the
  catalog-wide aggregate view backing the role's daily triage workflow.

  Surfaces the Data Quality Engineer interacts with:
    - `/data-quality` dashboard (the catalog-wide aggregate) — pillar
      feature P-04:F-002, batch ZC; the entry-point for "what's
      broken across the platform right now"
    - per-dataset Test reports tab (the per-entity drill-down) —
      pillar feature F-022; the per-dataset triage view
    - per-dataset SLA badge (PNG endpoint) — embeddable in BI tools;
      visible status of a dataset's quality posture
    - DataQualityTestSeverity (MINOR / MAJOR / CRITICAL) — operator-
      set per-test severity that feeds the SLA aggregation
    - alerting (P-07 Alerting) — failed DQ test runs feed AlertManager-
      style alerts the role may consume

  Cross-pillar reach:
    - P-04 (Data Quality): primary pillar — every DQ surface belongs
      to the role's daily workflow
    - P-07 (Alerting): downstream consumer of DQ failures
    - P-08 (Visualisation): SLA PNG endpoint embedded in BI dashboards
    - P-11 (UI): the dashboard is a primary UI surface; the role's
      effectiveness depends on the dashboard's clarity (the bare
      Title filter mislabelling, the missing access-control disclosure,
      the empty-state ambiguity — all degrade the role's daily
      experience)
