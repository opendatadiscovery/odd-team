name: LoadMore Lineage Expansion (depth-1 fan-out + slice monotonic accumulation)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-05
description: |-
  **NEW CONCEPT, batch 2026-05-19J** — the UI mechanic for progressive lineage
  expansion. Clicking the "Load N more" button (`LoadMoreButton.tsx:55-65`) on a
  leaf node in the lineage canvas: (a) dispatches a NEW thunk
  `fetchDataEntityDownstreamLineage({ dataEntityId, lineageDepth: 1, rootNodeId,
  expandGroups: eag })` — **hardcoded `lineageDepth: 1`** (a depth-1 fan-out
  around the clicked node, not user-driven depth increase); (b) appends the
  clicked entity id to the URL `?exd=` (downstream) or `?exu=` (upstream) array.
  The Redux slice (`dataEntityLineage.slice.ts:206-220`) MERGES the new
  nodes/edges into local state — `if (!localDownstreamState.nodeIds.has(node.id))
  localDownstreamState.allNodes.push(node)`. **Critical invariant**: the
  accumulator grows MONOTONICALLY across LoadMore clicks. There is no "remove this
  expansion" action, no LRU eviction, no max-size cap. A user clicking LoadMore on
  100 leaf nodes in a 10K-node graph accumulates 100x payload-size in memory + in
  the rendered SVG tree. The LoadMoreButton hides itself after click (`Node.tsx:174
  setHideLoadMore(true)`) but the underlying data stays. The depth-slider in
  LineageControls (`?d=` URL param) controls the INITIAL load via the
  `[d, dataEntityId]` useEffect dep; user expansion is always 1-hop at a time.
  **Two-overload protocol at the SQL repository**: the recursive walk uses
  `getLineageRelations(Set, LineageDepth, LineageStreamKind)` for the main
  subgraph; the depth-1 expansion uses `getLineageRelationsForDepthOne(List<Long>,
  LineageStreamKind)` — separate SQL primitives merged downstream by
  LineageServiceImpl. The split signals an intentional "recursive walk for main
  subgraph + one-hop expansion for UI clicks" protocol.
