- id: H-003
  hypothesis: |-
    When a control is hidden by WithPermissions in the UI, a user who bypasses the
    UI and calls the underlying mutation endpoint directly is still DENIED by the
    server (the UI is not the security boundary).
  derivation: |-
    The LSN-023 trap anchor + the feature_name's central claim (CONTEXT not GATE);
    the PermissionController sidecar's implicit_adrs[0] states the same
    PermissionService bean enforces mutations server-side. This is THE
    cross-verification the methodology must run, not assume.
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      Server-side authorization is enforced independently of the UI. The
      AuthorizationCustomizer applies SecurityConstants.SECURITY_RULES to mutation
      endpoints (PermissionController class sidecar implicit_adrs[0] +
      OAuthSecurityConfiguration.java:87-98 wires the SAME PermissionService bean
      into the mutation enforcer that the read-side controller uses). IT-010
      empirically pins this under LDAP: a non-admin USER calling
      `DELETE /api/owners/{id}` directly receives 403, NOT 404 — the 403-vs-404
      distinction is the enforcement signal (404 would mean authz was bypassed).
      ReactiveNonContextPermissionAuthorizationManager resolves permissions from
      policies with NO ADMIN bypass. The UI hiding the Delete button is courtesy,
      not protection; protection is the server rule, and it holds.
    evidence:
      - sidecar: odd-platform__java__PermissionController__controller-class__PermissionController.md
        section: implicit_adrs
        cite: "OAuthSecurityConfiguration.java:87-98 + AuthorizationCustomizer.java:16"
        note: "read-side controller and mutation enforcer share one PermissionService evaluation graph."
      - sidecar: odd-platform__java__PermissionController__controller-method__getResourcePermissions.md
        section: understanding
        cite: "PermissionController.java:20-25 (authoritative, not a UI hint)"
        note: "a forged response returning more permissions than the user has does NOT bypass mutation gating."
      - sidecar: "integration-tests/protocols/IT-010-ldap-rbac-enforcement.md"
        section: "assertions"
        cite: "SecurityConstants.java:143-147 (OWNER_DELETE) + IT-010 spec ldap-rbac-enforcement.spec.ts"
        note: "GREEN: non-admin LDAP USER DELETE /api/owners/{id} returns 403, not 404 — backend gate enforces."
    severity: LOW
    confidence: HIGH
    use_case_kind: cross-actor
    coverage: verified
    test_ref: "integration-tests/e2e/specs/ldap-rbac-enforcement.spec.ts (IT-010)"
    test_demand: none

- id: H-004
  hypothesis: |-
    A methodology pass (scan / audit) that reads WithPermissions or
    WithPermissionsProvider and concludes the UI is the authorization boundary
    (a `permission_side_door` finding) is WRONG — the verdict requires reading the
    backend gate too.
  derivation: |-
    This feature exists as the LSN-023 anchor; facet
    hoc_is_context_not_gate_lsn023_trap_anchor states the consequence is
    methodological. The hypothesis tests the methodology's own correctness against
    the assembled chain.
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |-
      The HOC's job is UX shape (hide the button); it performs no authorization.
      hasAccessTo is a pure boolean read of a client-side context populated by the
      read-side endpoint — which is itself NOT a gate (it returns the caller's own
      resolved permissions and is intentionally left out of SECURITY_RULES, per
      PermissionController method sidecar implicit_adrs[3], read-collaborative
      posture). The actual gate is AuthorizationCustomizer + SECURITY_RULES
      (H-003). Therefore any finding of the shape "permission enforced/bypassed at
      the UI" derived from the HOC ALONE is a false positive of the LSN-023 class.
      The original false-positive was F-031's namespace_name reading (LSN-023:39-44).
      This reflection's own discipline — validating H-003 by reading the backend
      AND citing IT-010 rather than reasoning from the HOC — is the correct posture.
    evidence:
      - sidecar: "feature-flows/detail/F-207.yaml"
        section: "observed_vs_expected.hoc_is_context_not_gate_lsn023_trap_anchor"
        cite: "WithPermissions.tsx:11-34 + SecurityConstants + @PreAuthorize on @Endpoint methods"
        note: "the UI is not the enforcement boundary; the backend has its own gate that may or may not mirror the UI's choice."
      - sidecar: odd-platform__java__PermissionController__controller-method__getResourcePermissions.md
        section: implicit_adrs
        cite: "SecurityConstants.java:98-355 + AuthorizationCustomizer.java:29-30"
        note: "read-side endpoint deliberately not in SECURITY_RULES — the read reveals only what the policy graph already grants the caller."
    severity: LOW
    confidence: HIGH
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    When a user is on a page where controls are hidden because they lack the
    permission, the page tells them WHY (a tooltip, a disabled-state, an
    admin-contact hint) so they can self-diagnose the missing permission.
  derivation: |-
    Senior-PO UX seed (Rule 9 — "does the user understand how to use this from
    what is on screen?"): a user encountering a permission-gated page should be
    able to tell whether a control is absent because it does not exist or because
    they are not allowed. Facet hide_not_disable_creates_admin_contact_silence.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      No such signal exists. WithPermissions unconditionally renders `null` for a
      forbidden control (WithPermissions.tsx:28) — there is no `disabledWithTooltip`
      mode, no admin-contact CTA, no first-time hint, no platform-wide "this view is
      filtered by your permissions" banner (per F-207 facet
      hide_not_disable_creates_admin_contact_silence). A non-ADMIN viewing
      PolicyList or RolesList sees a read-only list with no buttons and no
      explanation. This is the platform-wide default; there is no opt-in disable
      mode on the HOC API.
    evidence:
      - sidecar: "feature-flows/detail/F-207.yaml"
        section: "observed_vs_expected.hide_not_disable_creates_admin_contact_silence"
        cite: "WithPermissions.tsx:11-34 (no disabledWithTooltip / no whenForbidden prop)"
        note: "unconditional hide; no tooltip, no admin-contact CTA, no first-time hint."
      - sidecar: "feature-reflections/detail/F-105.yaml"
        section: "H-001 operator_visible_failure"
        cite: "PolicyList.tsx:109-122"
        note: "list renders, only the Create CTA hides — the surface LOOKS read-only, masking that affordances were removed."
    operator_visible_failure: |-
      A new operator encountering a permission-gated page (PolicyList, RolesList,
      an entity-detail page) sees a seemingly read-only UI with NO signal that
      affordances are hidden. They cannot answer "am I missing a permission, or
      does this platform simply not have this action?" without contacting an admin.
      The subtle compounding failure: because the LIST still renders (only the
      buttons hide), the surface looks complete and intentional — the operator may
      reasonably conclude "no controls exist here" and never file a request for the
      missing permission. The hide-not-disable convention is platform-wide and was
      undocumented at the operator surface until DOC-176 documented it on the
      Authorization page. The code behaviour itself is a UX-product decision, not a
      defect to fix in code without a design choice.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: |-
    Wrapping a subtree in WithPermissionsProvider PREVENTS an unpermitted user
    from reaching/rendering that subtree (the name implies a gate).
  derivation: |-
    Naming-drift seed (Rule 4): "Provider" + a permissions list reads like a route
    or render gate; facet provider_unconditionally_renders_children_no_top_level
    _route_gate. A maintainer assuming the provider gates the route mis-models the
    architecture.
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |-
      WithPermissionsProvider does NOT gate anything. All three of its branches
      (render-prop `render`, `Component`, or `children`) return the child
      unconditionally regardless of permission state (per F-207 facet
      provider_unconditionally_renders_children..., confirmed at
      WithPermissionsProvider.tsx:12-48/51 by the F-105 reflection). Its sole job
      is to mount a PermissionProvider that ANNOUNCES the allowed/resource
      permission lists to descendant usePermissions() calls. Route-level gating is
      a separate concern: only `/management/associations/*` uses a RestrictedRoute
      that redirects (F-105 H-002, ManagementRoutes.tsx:101-110). The name carries
      a gate connotation the implementation does not honour.
    evidence:
      - sidecar: "feature-flows/detail/F-207.yaml"
        section: "observed_vs_expected.provider_unconditionally_renders_children_no_top_level_route_gate"
        cite: "WithPermissionsProvider.tsx:12-51"
        note: "provider announces context; renders children/Component/render unconditionally; does not gate."
      - sidecar: "feature-reflections/detail/F-105.yaml"
        section: "H-001 actual_behavior"
        cite: "WithPermissionsProvider.tsx:12-48 + ManagementRoutes.tsx:101-110"
        note: "8 of 9 Management sub-routes wrap in this non-blocking provider; only associations/* is route-gated via RestrictedRoute."
    operator_visible_failure: |-
      The operator-visible consequence is indirect but real and is the F-105 case:
      because the provider does not gate, deep-linking a no-permission user to
      /management/policies renders the full Policy LIST (names, owners, and on
      click-through the full policy JSON), so an operator who provisioned a
      "read-only" user believing the Management surface would be hidden has in fact
      granted a complete read of the RBAC topology. For THIS feature the failure is
      a maintainer-comprehension trap: a developer adding a new gated route by
      wrapping it in WithPermissionsProvider (expecting a redirect) ships an
      ungated route. The naming-vs-implementation gap is the defect surface.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: |-
    Under auth.type=DISABLED, the UI hides every mutation control (because the
    user has no resolved permissions) AND the underlying mutation is correspondingly
    blocked — the UI's "you can do nothing" matches reality.
  derivation: |-
    View-mode seed (auth.type branch) crossed with the read endpoint behaviour:
    PermissionController sidecar bugs_limitations_corner_cases[0] traces the
    DISABLED empty-permission cascade. A product owner expects the visible state
    to match the enforced state.
  seed_source: view-mode
  validation:
    verdict: contradicted
    actual_behavior: |-
      Under DISABLED the two layers diverge. The read-side endpoint returns an
      empty Flux<Permission> (DisabledAuthSecurityConfiguration permitAll → empty
      SecurityContext → AuthIdentityProvider returns empty → policy cascade yields
      []; PermissionController method sidecar bugs_limitations_corner_cases[0]),
      so usePermissions resolves hasAccessTo=false everywhere and WithPermissions
      hides EVERY mutation button. But the mutation endpoints are simultaneously
      `.permitAll()` under DISABLED — a direct API caller (or the same browser via
      devtools) can perform every mutation. The UI renders "you can do nothing"
      while the API enforces "anyone can do anything." The contradiction is silent:
      no error, no log, no admonition. (IT-009 pins that DISABLED leaves
      non-whitelisted endpoints anonymously reachable.)
    evidence:
      - sidecar: odd-platform__java__PermissionController__controller-method__getResourcePermissions.md
        section: "bugs_limitations_corner_cases[0] + security.known_security_gaps[0]"
        cite: "DisabledAuthSecurityConfiguration.java:13-17 + empty-context cascade"
        note: "DISABLED returns empty permission set → UI hides all buttons, while mutation endpoints are permitAll()."
      - sidecar: "integration-tests/protocols/IT-009-auth-mode-boundary.md"
        section: "assertions"
        cite: "DisabledAuthSecurityConfiguration.java:16"
        note: "GREEN: DISABLED leaves a non-whitelisted endpoint anonymously reachable (open)."
    operator_visible_failure: |-
      An operator running DISABLED (the development/demo default) sees a UI with no
      edit/delete buttons and may conclude the deployment is locked down or
      read-only. It is the opposite: the write API is wide open to any network
      caller. An operator who exposes a DISABLED deployment believing the empty-
      button UI means "safe" has shipped an unauthenticated write surface. This is
      the highest-trust-cost divergence of the feature — the UI's permission
      affordance actively misleads about the security posture. (Documented at the
      backend tier; the UI-affordance-vs-posture divergence is the net-new framing.)
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: |-
    Under auth.type=LOGIN_FORM, the UI shows controls matching the operator's
    configured policies — if an operator revokes a permission in the UI, the
    corresponding button disappears for that user.
  derivation: |-
    View-mode seed (LOGIN_FORM branch): PermissionController sidecar
    bugs_limitations_corner_cases[1] documents the static-admin authority. A
    product owner configuring LOGIN_FORM for staging expects per-resource gating to
    be honoured.
  seed_source: view-mode
  validation:
    verdict: contradicted
    actual_behavior: |-
      Under LOGIN_FORM every authenticated credential is granted the static ADMIN
      authority (LoginFormSecurityConfiguration.java:74-82 +
      GrantedAuthorityExtractor.java:12-14), and the seeded Administrator role
      carries 'ALL' on DATA_ENTITY/TERM/QUERY_EXAMPLE/MANAGEMENT
      (V0_0_56 migration). The read-side endpoint therefore returns the FULL
      permission set for every caller regardless of any policy the operator
      revoked in the UI — the in-memory admin authority bypasses the database
      user_owner→roles→policies join (PermissionController method sidecar
      bugs_limitations_corner_cases[1]). So WithPermissions shows EVERY button to
      EVERY user. Revoking a policy in the UI has no effect on what renders.
    evidence:
      - sidecar: odd-platform__java__PermissionController__controller-method__getResourcePermissions.md
        section: "bugs_limitations_corner_cases[1] + security.known_security_gaps[1]"
        cite: "LoginFormSecurityConfiguration.java:74-82 + GrantedAuthorityExtractor.java:12-14 + V0_0_56__add_predefined_roles_and_policies.sql:1-31"
        note: "LOGIN_FORM grants static ADMIN → endpoint returns ALL permissions → UI shows every button regardless of policy revocation."
    operator_visible_failure: |-
      An operator using LOGIN_FORM for a staging/multi-user environment configures
      per-resource policies, revokes a permission for a teammate, and observes the
      teammate STILL sees every button — because every LOGIN_FORM credential is
      admin. The operator may believe RBAC is honoured in staging when it is a
      no-op (LOGIN_FORM is single-tenant by design; only LDAP/OAUTH2 wire real
      per-user policy evaluation locally, per IT-010's scope note). The UI's
      permission affordance shows full access that the operator did not intend to
      grant. Documented at the backend tier (bugs_limitations_corner_cases[1]); the
      UI-affordance consequence is the product-owner framing.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

