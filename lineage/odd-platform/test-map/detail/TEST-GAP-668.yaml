proposed_action: |-
  Testcontainers integration test (DISABLED-mode profile). (a) Boot the application with `auth.type=DISABLED`. (b) Issue an anonymous PUT to a description-editing endpoint that triggers @ActivityLog (e.g. PUT `/api/dataentities/{id}/description`). (c) Query the activity table: `SELECT created_by, is_system_event FROM activity WHERE event_type = 'DESCRIPTION_UPDATED' AND data_entity_id = ? ORDER BY created_at DESC LIMIT 1`. (d) Assert `created_by IS NULL` and `is_system_event = false`. (e) Insert a separate row via `activityServiceImpl.createActivityEvent(...).systemEvent(true)` programmatically — assert `created_by IS NULL` and `is_system_event = true`. (f) Pin the indistinguishability gap: the only field distinguishing anonymous-mutation from system-event is `is_system_event`. A reviewer reading the UI activity feed (which surfaces `is_system_event=false → unattributed user; is_system_event=true → system`) cannot distinguish the two. Add a `// REGRESSION-PIN — DISABLED-mode anonymous mutations write null-created_by. REFACTOR-NNN proposes a sentinel '__anonymous__' value for distinguishability; this test flips to assert the sentinel.` comment block.
