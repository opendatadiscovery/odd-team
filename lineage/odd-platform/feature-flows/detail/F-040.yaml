description: |-
  DQ Test Run History is the per-data-entity test-execution timeline surface.
  ONE GET endpoint — `/api/dataentities/{data_entity_id}/runs` — returns a
  paginated DataEntityRunList of past executions for either a Data Quality
  Test (entity class 4) or a Data Transformer (entity class 2). The UI
  mounts the endpoint at TWO sites: the dedicated `/dataentities/{id}/history`
  route (page-size 100, infinite scroll, status-filter dropdown) and the
  test-report-details first-10-runs preview on the test-report tab.

  Per Rule 0 evaluation against `system-mission.md`: P-04 Data Quality
  enumerates three sub-features (Test Results Import / Quality Dashboard /
  Dataset Quality Statuses SLA). The per-test runs-history surface is NOT
  one of those three; it is a per-TEST-EXECUTION-timeline view that
  COMPOSES from the same ingested test-run data F-022's per-dataset reports
  + F-032's catalog-wide aggregate aggregate over, but at a DIFFERENT
  granularity. It belongs inside P-04 as a third user-observable read
  surface; the natural slot is P-04:F-003. The existing P-04 features F-022
  (per-dataset) and F-032 (catalog-wide) DO NOT cover the per-test history
  surface — registry-search graph-search confirms the closest matches are
  F-014 (Per-Entity Alert View) at 0.71 similarity (a sibling per-entity
  read but different signal) and F-022 at 0.70 (sibling pillar feature but
  different surface).

  The user-observable promise (per OpenAPI summary at openapi.yaml:1365-1366
  + the dedicated UI route TestRunsHistory): "Get runs for DataTransformer
  or DataQualityTest" — an operator drills into a DQ test's detail page,
  clicks the History tab, and sees a paginated timeline of every past run
  with status (SUCCESS / FAILED / SKIPPED / BROKEN / ABORTED / UNKNOWN) +
  startTime + endTime + status_reason diagnostic text.

  The user-observable REALITY, per the batch-ZG DataEntityRunController
  controller-class sidecar: 14 load-bearing drift facets cluster around
  four load-bearing themes — (a) the cross-owner read posture extended to
  per-test history with a DISTINCT data-shape leak channel (status_reason
  is free-form test-framework diagnostic text commonly containing PII /
  failed-row samples); (b) wire-enum vs DB-enum asymmetry (DB column
  `data_entity_task_run.status` accepts 7-value IngestionTaskRunStatus
  with RUNNING; wire enum DataEntityRunStatus has 6 values without RUNNING;
  mapper uses MapStruct's Enum.valueOf which throws — hypothesis HTTP 500
  during in-flight test runs); (c) NULL-end-time ordering surprises
  (Postgres default for ORDER BY end_time DESC is NULLS FIRST → RUNNING
  rows with end_time=NULL appear at the TOP of the list, displayed by
  startTime label without visual signal that the row is in-flight); (d)
  ordering asymmetry (backend sorts by end_time, UI displays start_time
  — for long-running tests the divergence is operator-visible).

  Plus structural concerns: size param unbounded (OpenAPI SizeParam has
  no max → an attacker can request size=10000000); page=0 produces
  negative offset (the JOOQ paginate behaviour is implementation-defined,
  no test asserts); soft-delete-NON-inclusive existence check (inconsistent
  with sibling DataQualityController's deliberate `existsIncludingSoftDeleted`
  forensic preservation pattern from F-022 — F-040's DataEntityRunServiceImpl
  uses bare `dataEntityRepository.get(id)` which excludes soft-deleted, so a
  DQ test whose status is DELETED cannot have its run history viewed for
  forensic purposes); the entity-class gate fires at the service tier
  with a generic "not supposed to have runs" message that doesn't tell the
  operator which classes ARE supported.

  Three probes already authored by the sidecar: P-150 (NULL end_time
  ordering + tie-breaker on identical end_time), P-151 (wire-enum-asymmetry
  500 during in-flight runs), P-152 (cross-owner read + status_reason leak
  channel).

  Status: NOT ui-incomplete per Rule 0b — the two UI consumers
  (TestRunsHistory.tsx + TestReportDetailsHistory.tsx) are observed in the
  sidecar's upstream_callers block as enriched-pending-sidecar references;
  the UI surfaces are CONCRETE and named at specific file:line citations
  (TestRunsHistory.tsx:24-122 + TestReportDetailsHistory.tsx:30-32). The
  feature is UI-complete on the frontend; the UI-tier sidecars will be
  enriched in a future batch to close hop-0a/0b with PRIMARY-SOURCE.
