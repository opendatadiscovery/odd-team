proposed_action: |-
  Add `IngestMetricsInternalPostgresTenantIdAbsentTenantIsolationLeakTest`. Testcontainers integration test:

  1. **Setup A**: ODD instance configured `odd.tenant-id=tenantA`, `metrics.storage=INTERNAL_POSTGRES`. Same Postgres testcontainer shared with Setup B.
  2. **Setup B**: ODD instance (different bean profile) configured `odd.tenant-id=tenantB`, `metrics.storage=INTERNAL_POSTGRES`. Same Postgres.
  3. **From A**: POST metrics for ODDRN `urn:..:tenantA:entity-A1` with labels `{tenant_id: "tenantA"}`.
  4. **From B**: POST metrics for ODDRN `urn:..:tenantB:entity-B1` with labels `{tenant_id: "tenantB"}`.
  5. **Cross-poll**: from A, POST metrics for ODDRN `urn:..:tenantB:entity-B1` (using tenant B's ODDRN) — assert 201 (pin no controller-side rejection).
  6. **Assert leak**:
     - `SELECT count(*) FROM metric_series` returns 3 rows — A, B, and A's cross-tenant write.
     - From B, `GET /api/dataentities/{B1.id}/metrics` returns BOTH B's metrics AND A's polluted metrics — pins the cross-tenant visibility.
     - From A, `GET /api/dataentities/{B1.id}/metrics` (if B1 is somehow visible to A) returns its own pollution back.
  7. **Comparison sister**: same setup but `metrics.storage=PROMETHEUS` (against a Prometheus testcontainer) — assert tenant_id label IS appended and queries with the wrong tenant_id return empty. PINS the storage-asymmetry.

  Pair with REFACTOR-NNN, DOC-GAP-NNN, and a concept-merger pass to add `storage_backend_asymmetry` to the `multi-tenant-configuration-odd-tenant-id` entity weakness.

  Coherence note (LSN-018 Rule 6): NET-NEW. The sidecar's batch-Z `bugs_limitations_corner_cases.[2]` rates this MEDIUM; promoted to CRITICAL here per the multi-tenant cross-org impact analysis above. SUPERSEDES NOTHING — no prior TEST-GAP names tenant_id-absent on INTERNAL_POSTGRES. STRENGTHENS the `multi-tenant-configuration-odd-tenant-id` concept entry by adding the storage_backend_asymmetry weakness. STRENGTHENS system-mission.md canonicalisation_candidates[2] by providing the operational evidence the candidate currently lacks.
