name: |-
  DataSource UI update is REPLACE-not-MERGE — MapStruct SET_TO_NULL nulls every omitted form field (silent partial-edit data loss)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-21ZB — surfaced at
  primary source by the updateDataSource method-level sidecar. The
  UI-admin update endpoint PUT /api/datasources/{data_source_id} is a
  full-form REPLACE of the three mutable fields (name, description,
  namespace_name), NOT a field-wise MERGE. An API consumer (or a UI
  bug) sending a PARTIAL body to change one field SILENTLY NULLS the
  other two.

  THE MECHANISM — why a partial body wipes data:

    DataSourceServiceImpl.update (DataSourceServiceImpl.java:68-83)
    applies the form to the loaded pojo through the MapStruct
    @MappingTarget mapper DataSourceMapper.applyToPojo
    (DataSourceMapper.java:49-56). The platform's MapperConfig
    (MapperConfig.java:7-11) sets componentModel / unmappedTargetPolicy /
    injectionStrategy but DOES NOT set
    `nullValuePropertyMappingStrategy`. MapStruct's default for an
    UNSPECIFIED strategy is SET_TO_NULL. DataSourceUpdateFormData has
    3 optional fields with NO `required` block (components.yaml:1317-1325);
    an omitted JSON field deserialises to a null Java field and is
    written as null onto the existing pojo. The namespace overload
    (DataSourceMapper.java:51-56) explicitly sets namespace_id to null
    when namespace == null (i.e. when namespace_name was empty/omitted).

  THE OPERATOR-VISIBLE CONSEQUENCE — the data-loss-on-partial-edit class:

    An operator (or programmatic client) calling PUT to "rename a
    data source" with a body carrying only `name`:
      - the `description` column is overwritten with NULL — the
        existing description is silently wiped;
      - the `namespace_id` column is overwritten with NULL — the
        data source is silently detached from its namespace.
    There is NO MERGE option on this endpoint. The endpoint name
    "update" does not signal that callers MUST resend every field
    they want to keep. Probe P-043 pins the REPLACE-vs-MERGE behaviour.

  THE FRAGILITY — one config line flips the contract:

    The REPLACE-not-MERGE behaviour is a CONSEQUENCE of MapperConfig
    not setting a strategy. A future global edit setting
    `nullValuePropertyMappingStrategy = IGNORE` on MapperConfig would
    SILENTLY convert this endpoint (and every other @MappingTarget
    mapper in the platform) from REPLACE to MERGE — an operator-visible
    behaviour change with no code change at the DataSource endpoint
    and no test to catch it. Conversely a contract change adding a
    `connection`-style field to DataSourceUpdateFormData would
    silently fold the new field into the REPLACE set.

  WHY THIS IS A DISTINCT INVARIANT (not folded into the 5-vertex
  ADR-142/143 triangulation):

    The existing datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation
    invariant frames "full-form REPLACE via MapStruct @MappingTarget"
    as ONE ASYMMETRY-vertex contrasting the UI path with the S2S
    path's 2-field partial-merge. That invariant's concern is the
    cross-path architectural disjunction. THIS invariant's concern is
    the FILE-LOCAL OPERATOR HAZARD inside the UI path itself: a
    partial PUT body silently destroys data, the mechanism is a
    missing MapperConfig line, and the bug is one config edit away
    from inverting. The two are kept separate: one is an architectural
    map, the other is a maintainer-facing fragility + a data-loss bug.

  THE CONTRAST WITH the S2S ingestion REPLACE-not-MERGE:

    The platform already carries a `silent-data-loss-replace-not-merge-ingestion-semantics`
    invariant for the ingestion pipeline (lineage edges + metadata
    fields). THIS is the UI-admin DataSource analogue — same
    REPLACE-not-MERGE class, different mechanism (MapStruct
    SET_TO_NULL vs the ingestion processors' delete-on-absence). The
    platform exhibits the silent-replace hazard on BOTH the S2S
    ingestion surface and the UI-admin DataSource surface.

  SEVERITY MEDIUM — operator-observable silent data loss on a routine
  partial-edit; the mechanism is a framework default that looks
  unintentional, and the absence of any test means a refactor cannot
  surface the contract.
