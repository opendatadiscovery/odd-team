notes: |-
  The fix is one of (a) Apply button, (b) debounce, (c) both. Each has
  a different operator-visible cost; (a) is the most explicit, (b) is
  the most transparent, (c) is the most defensive. A maintainer
  triaging this should consider the typical operator slice-building
  workflow on the dashboard before choosing.

  Same pattern exists at the autocomplete level (one list request per
  keystroke), recorded under the `dashboard-filter-panel` performance
  weaknesses. Both pattern instances together describe the dashboard's
  full request-amplification surface.
