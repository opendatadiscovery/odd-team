evidence:
- 'NotificationsProperties.md says: ''A burst of 10k alerts (e.g. a misconfigured
  data-quality run) will fire 10k Slack messages, 10k webhook POSTs, and 10k emails
  with no rate cap. Slack will rate-limit the webhook (Slack returns 429), webhooks
  will overwhelm the receiver'''
cross_references:
