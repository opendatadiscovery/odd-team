behaviour: |-
  **`@EnableSchedulerLock(defaultLockAtMostFor = "1h")` at SchedulingConfiguration.java:14 is currently DEAD CODE in the platform.** All three `@SchedulerLock`-annotated methods in `<odd-platform-repo>/odd-platform-api/src/main/java` set their own `lockAtMostFor` explicitly:

  - HousekeepingJobManager.java:26 — `lockAtMostFor = "14m"`
  - DataEntityStatusSwitchJob.java:22 — `lockAtMostFor = "9m"`
  - PostgreSQLPartitionCreationJob.java:41 — `lockAtMostFor = "10m"`

  The `1h` default is a latent safety floor for FUTURE `@SchedulerLock(name="X")` annotations that omit the timing attribute. No test currently exercises this inheritance contract. A reader of SchedulingConfiguration.java cannot tell from the file alone whether the default is meaningful; the `1h` value is only validated by reading the three downstream consumers and confirming each sets its own.

  Test gap shape: a custom `@Component` in the test source set declaring `@Scheduled(fixedRate = ...)` + `@SchedulerLock(name = "testLock")` WITHOUT any timing attributes, then asserting that the `shedlock` row's `lock_until` is approximately `now() + 1h` (from PG via `.usingDbTime()`).

  Currently LOW because (a) no current code path exercises the default; (b) the alternative (the ShedLock library default, typically `Long.MAX_VALUE`) is strictly worse — the explicit `1h` IS the safety mechanism. Pin to ensure a future SchedulingConfiguration refactor does not accidentally drop the default value (e.g. someone removing the argument and falling back to ShedLock's library default).
