name: Service-tier transactional asymmetry between sibling services (Policy vs Role vs DataEntity)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19I (service-layer sidecars)** — sibling
  services that own structurally identical CRUD surfaces apply `@ReactiveTransactional`
  asymmetrically, creating concrete lost-update race windows on some paths while
  others are protected. The cross-batch headline: `RoleServiceImpl.create / update
  / delete` ARE all `@ReactiveTransactional` (RoleServiceImpl.java:50, 64, 77) but
  the SIBLING `PolicyServiceImpl.create / update / delete` (PolicyServiceImpl.java:62,
  71, 83) carry NO annotation. Both classes operate on similar RBAC primary-surface
  shapes (single-row CRUD over base `ReactiveAbstractSoftDeleteCRUDRepository`). The
  asymmetry surfaces as: (a) `PolicyServiceImpl.update` reads-then-writes outside
  any transaction (lines 71-81: `policyRepository.get(id)` then `policyRepository.update(...)`)
  — two concurrent UPDATEs on the same policy id can lost-update (client A reads
  v1, client B reads v1, A writes v2, B writes v3 BASED ON v1; A''s change clobbered);
  (b) `PolicyServiceImpl.delete` (lines 83-95) issues `get` → `isPolicyAttachedToRole`
  → conditional `CascadeDeleteException` → `delete` — four separate R2DBC calls outside
  any transaction, race-window between the cascade check and the delete (a concurrent
  role binding can land between the check and the soft-delete, leaving an orphan-binding
  permission leak — the exact state batch H identified at the repository layer);
  (c) `DataEntityServiceImpl` (DataEntityServiceImpl.java) carries 8 `@ReactiveTransactional`
  occurrences (lines 197, 246, 288, 308, 324, 337, 357, 388, 411), the repository
  has zero — every write that needs atomicity is delimited at the service tier. The
  pattern in `DataEntityServiceImpl` is the platform IDIOM; `PolicyServiceImpl` IS
  the outlier. **Batch-I AlertServiceImpl confirms the same idiom with a DELIBERATE
  EXCEPTION**: `handleExternalAlerts` (line 152) and `applyAlertActions` (line 201)
  carry `@ReactiveTransactional`; `updateStatus` (lines 111-113) DELIBERATELY does
  NOT — the AOP-injected `@ReactiveTransactional` from `ActivityAspect.monoActivityAspect`
  (ActivityAspect.java:42) provides the wrapping transaction; the design tolerates
  the read-then-write race on user-driven status changes because the reopen-conflict
  guard catches the data-integrity case at the application level. The contrast:
  AlertServiceImpl''s missing annotation is INTENTIONAL with a named compensating
  mechanism; PolicyServiceImpl''s missing annotation has NO defending comment, NO
  AOP fallback, and NO compensating mechanism — it appears to be an oversight relative
  to the sibling RoleServiceImpl. **The single highest-leverage fix is one annotation**:
  add `@ReactiveTransactional` to `PolicyServiceImpl.update / delete` (matching
  `RoleServiceImpl`). Higher-leverage doc-side path: extend the persistence-layer
  conventions doc with the rule "every service-layer read-then-write composition
  MUST be wrapped in `@ReactiveTransactional`" and audit existing services for compliance.'
