control_summary: |-
  0 of 4 cells PROBED. Feature emerges from the batch-T primary-source
  audit of `DataQualityController` (controller-class) plus references
  to `DataQualityServiceImpl`, `ReactiveDataQualityRepositoryImpl`,
  `SLACalculator`, and `CachingByteArraySLAResourceResolver`. Per-Dataset
  Data Quality Test Reports & SLA is the FIRST P-04 anchored
  pillar-feature minted — system-mission.md names P-04 with three
  sub-features (Test Results Import / Quality Dashboard / Dataset
  Quality Statuses SLA); the controller's 5 endpoints span Test Results
  Import (`getDataEntityDataQATests`, `getDatasetTestReport`,
  `setDataQATestSeverity`) and SLA (`getSLA`, `getDatasetSLAReport`)
  via a SINGLE controller-class. The pillar-anchored slot P-04:F-001 is
  the natural home — F-001 within P-04 captures the canonical per-dataset
  DQ surface; future batches enriching DataQualityRepositoryImpl /
  SLACalculator / DataQualityServiceImpl as standalone sidecars will
  strengthen the chain to PRIMARY-SOURCE at every layer.

  Twelve substantive drift facets cluster around four load-bearing
  themes: (1) the PNG vs JSON doc drift on /sla (HIGH — the canonical
  'operator follows our guide off a cliff' for BI engineers); (2) the
  REFACTOR-024 cross-owner read family extension to P-04 (four GETs
  unscoped, only the lone PUT owner-scoped via DATA_ENTITY); (3) silent
  inflation surfaces (default-MAJOR severity, 404-on-empty test list,
  no pagination on test list); (4) audit-silence (the
  setDataQATestSeverity write produces NO Activity Feed row — 8-sidecar
  pattern from F-006 extended to per-dataset DQ-severity mutations).

  The highest-leverage probe candidates are: (a) PNG-vs-JSON regression
  pin — fetch /api/datasets/{id}/sla, assert Content-Type=image/png;
  fetch /api/datasets/{id}/sla_report, assert Content-Type=application/json
  + schema-matching DataSetSLAReport; pin the bug at HTTP level so doc
  fix lands first; (b) DISABLED-mode reach — flip
  `auth.type=DISABLED` + assert anonymous reach of all 5 endpoints; (c)
  severity-mutation audit gap — set severity via PUT + read
  /api/activity, assert no activity row for the dataset/test surface;
  (d) cross-owner reach — auth as a user with no Owner association,
  GET /api/datasets/{id}/test_report for a dataset they have no
  ownership of, assert 200 + full payload; (e) default-MAJOR inflation
  — seed dataset with 100 unset tests + 1 critical-failing test, assert
  SLA=RED; toggle the proposed `severity_source` discriminator off,
  assert SLA flips to YELLOW. Local docker-compose probe stack: ODD
  platform + Postgres + a seeded dataset with 100 stub tests + a single
  critical-failing test + the DataQualityController exposed.
