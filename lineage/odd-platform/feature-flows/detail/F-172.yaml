feature_id: F-172
pillar_id: P-08
pillar_anchored_id: P-08:F-017
pillar_anchored_feature_name: Admin Direct-Bind UserOwnerMapping Create (bypass-the-request-flow third branch)
feature_name: |-
  Admin Direct-Bind UserOwnerMapping Create — the Management → Associations
  header's "Create association" affordance opens a modal form
  (OwnerAssociationForm) that lets an operator authoring with
  Permission.OWNER_RELATION_MANAGE directly mint a user_owner_mapping
  row WITHOUT going through the OwnerAssociationRequest flow. Distinct
  from F-075's two branches (A user-self-request-with-pending, B
  DIRECT_OWNER_SYNC auto-approve) — this is BRANCH C: admin acts on
  behalf, no PENDING state, no Activity log entry from the
  OwnerAssociationRequest service, no operator-visible audit trail
  inside the History tab.
seeded_from: ui-review-2026-05-26
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  ui-component:OwnerAssociationsHeader (the "+ Create association" button)
  ui-component:OwnerAssociationForm (the modal form)
  rest:POST /api/user_owner_mapping (inferred from useCreateUserOwnerMapping naming)
primary_subject:
  - "odd-platform ts react-component component:OwnerAssociationForm"
  - "odd-platform ts react-component component:OwnerAssociationsHeader"
  - "odd-platform java UserOwnerMappingController (presumed; not Read in slice H)"
  - "odd-platform java UserOwnerMappingServiceImpl (cross-link F-011, F-075 hop 6)"
contributing_nodes:
  - "odd-platform ts react-component component:OwnerAssociationsHeader"
  - "odd-platform ts react-component component:OwnerAssociationForm"
  - "odd-platform java UserOwnerMappingService (binding-write surface)"
chain:
  - hop: 1
    node: "ui-component:OwnerAssociationsHeader (Create association button)"
    sidecar: unresolved
    evidence: |-
      OwnerAssociationsHeader.tsx:29-39 — the "Create association" button
      is wrapped in <WithPermissions permissionTo={Permission.OWNER_RELATION_MANAGE}>.
      Operators without the permission do NOT see the button (HIDE
      posture, not DISABLE — opposite of F-171's per-row Accept/Reject).
      The button opens the OwnerAssociationForm dialog via DialogWrapper's
      handleOpen pattern.
    multiplicity_per_trigger: 1
  - hop: 2
    node: "ui-component:OwnerAssociationForm (modal create form)"
    sidecar: unresolved
    evidence: |-
      OwnerAssociationForm.tsx:22-26 — uses useCreateUserOwnerMapping
      mutation (NOT useCreateOwnerAssociationRequest). Three required
      fields via react-hook-form Controllers: ownerId (via
      OwnerIdAutocomplete), oidcUsername (text), provider (via
      ProviderAutocomplete). On submit fires
      createUserOwnerMapping({userOwnerMappingFormData}).
    multiplicity_per_trigger: 1
  - hop: 3
    node: "rest:POST /api/user_owner_mapping (inferred from hook name)"
    sidecar: unresolved
    evidence: |-
      The hook is `useCreateUserOwnerMapping` (imported from lib/hooks).
      Payload type `UserOwnerMappingFormData` confirms a direct write
      to user_owner_mapping, NOT an OwnerAssociationRequest. The
      backend service consumed is UserOwnerMappingService (cross-link
      F-075 hop 6 and F-011 chokepoint).
    multiplicity_per_trigger: 1
    ui_unverified: true
    ui_unverified_reason: |-
      The exact REST shape, the controller class, and the permission
      gate on the controller side are not Read in slice H — access to
      lib/hooks/api/ and the corresponding Java controller blocked at
      file-read level. The presumption that this is a single-shot
      INSERT (no PENDING intermediate row, no Activity log emission)
      needs backend confirmation. The CRITICAL backend question: does
      this path emit to owner_association_request_activity? If not, an
      operator's direct binds are forensically silent — a worse
      audit-silence than F-075 branch A (which IS audited).
primary_drift_class: admin_direct_bind_bypasses_owner_association_request_audit_trail_no_history_tab_entry
drift_class_summary:
  - admin_direct_bind_bypasses_owner_association_request_audit_trail_no_history_tab_entry
  - third_write_path_undocumented_in_user_owner_association_doc
  - composes_with_owner_get_or_create_side_door_admin_can_self_mint_arbitrary_owner_to_self
  - form_lacks_validation_on_oidc_username_no_existence_check_no_format_constraint
  - submit_success_no_toast_no_redirect_modal_silently_closes
observed_vs_expected:
  facets:
    - drift_class: admin_direct_bind_bypasses_owner_association_request_audit_trail_no_history_tab_entry
      description: |-
        The History tab of the Associations UI shows
        owner_association_request_activity rows — entries WRITTEN BY
        the OwnerAssociationRequest service. If POST /api/user_owner_mapping
        does NOT write to that activity table (which is the suspected
        behaviour since it's a different controller / service stack), then
        an operator using "+ Create association" leaves NO trace in the
        operator-visible History audit. The chain is forensically
        SILENT at the same UI surface that promises audit visibility.
        Cross-link F-019's `owner_lifecycle_audit_silence_six_sidecar_pattern`
        — this is the symmetric finding on the user-owner binding side.
      evidence:
        - "OwnerAssociationForm.tsx:43-46 — calls useCreateUserOwnerMapping (NOT useCreateOwnerAssociationRequest), implying a different controller path that bypasses the request audit table"
        - "OwnerAssociationsResolved.tsx:30-35 — History tab consumes useGetOwnerAssociationActivityList (the request activity feed, not a UserOwnerMapping audit feed)"
      ui_unverified: true
      ui_unverified_reason: |-
        Whether the UserOwnerMapping controller emits to ANY audit table
        (activity, owner_association_request_activity, or a separate
        binding-audit table) requires backend Read. The drift is HIGH
        if confirmed silent; defer for now with ui_unverified.
      reflection_supersedes: |-
        SUPERSEDED by feature-reflector/0.3.0 (2026-06-03, reflection F-172
        H-003). Backend Read of OwnerAssociationRequestServiceImpl.java:107-148
        (this invocation) CONTRADICTS this drift class: POST /api/owners/mapping
        (the actual endpoint — NOT /api/user_owner_mapping) routes through
        OwnerAssociationRequestServiceImpl.createUserOwnerMapping, which calls
        createManualAssociationRequest FIRST. That method stamps an
        owner_association_request row with status=APPROVED and calls
        createOwnerAssociationRequestWithActivity(association, isManual=true)
        at line 146 — writing a REQUEST_MANUALLY_APPROVED activity row
        (OwnerAssociationRequestServiceImpl.java:205-221). The History tab
        consumes owner_association_request_activity, so the admin direct-bind
        IS visible there. The live doc (WebFetched 2026-06-03 status 200) now
        confirms: "All three write-paths are recorded here … Direct admin
        bindings appear as 'Approved' rows attributed to the administrator".
        ACTION: flip this primary_drift_class to an AUDITED-confirmed finding;
        close scanner finding F-172a as stale. The slice-H inference (audit
        silence from the useCreateUserOwnerMapping hook name) was a bottom-up
        UI artefact corrected by the top-down + backend pass.
    - drift_class: third_write_path_undocumented_in_user_owner_association_doc
      description: |-
        The live doc
        `/configuration-and-deployment/enable-security/authorization/user-owner-association`
        documents the two-step SELF-request flow (F-075 branch A) and
        is silent on DIRECT_OWNER_SYNC auto-approve (F-075 branch B —
        captured as F-075 drift facet
        live_doc_user_owner_association_silent_on_auto_approve_branch).
        It is ALSO silent on this THIRD branch — the admin-direct-bind
        affordance. Operators reading the doc cannot infer that a third
        write path into user_owner_mapping exists; the only mention in
        the UI is the "+ Create association" button visible from the
        Associations page header behind the OWNER_RELATION_MANAGE gate.
      evidence:
        - "Cross-link F-075 facet `live_doc_user_owner_association_silent_on_auto_approve_branch`"
        - "OwnerAssociationsHeader.tsx:32-37 — the button text is just 'Create association' with no in-UI explanation that it bypasses the request flow"
      ui_unverified: false
      reflection_supersedes: |-
        SUPERSEDED by feature-reflector/0.3.0 (2026-06-03, reflection F-172
        H-008). The live page was WebFetched THIS invocation (status 200) and
        NOW documents all three write-paths, including "operators holding the
        OWNER_RELATION_MANAGE permission see a Create association button" that
        "writes the binding directly — no intermediate 'pending' state". The
        doc gap is CLOSED; scanner finding F-172a is stale. ACTION: close
        F-172a as a doc-gap CLOSURE.
    - drift_class: composes_with_owner_get_or_create_side_door_admin_can_self_mint_arbitrary_owner_to_self
      description: |-
        The OwnerAssociationForm uses an OwnerIdAutocomplete for the
        ownerId field — meaning the admin selects an EXISTING Owner row
        (the autocomplete is over /api/owners). This does NOT compose
        with the F-019 getOrCreate side-door directly from the UI (the
        F-075 branch B mint path is service-side, not exposed by this
        form). POSITIVE FINDING: the admin must pick an existing Owner,
        which means the F-075 branch B "self-mint-then-self-bind" hazard
        is NOT reachable via this UI branch (the admin can already
        create an Owner from the Owners tab and then bind to it via
        this form, but those are two explicit operator actions, not one
        chain).
      evidence:
        - "OwnerAssociationForm.tsx:56-61 — ownerId field is OwnerIdAutocomplete (existing-owner picker), not a free-text input"
      ui_unverified: false
      reflection_confirms: |-
        CONFIRMED by feature-reflector/0.3.0 (2026-06-03, reflection F-172
        H-002): the manual flow resolves ownerId via getOwnerDtoById (lookup)
        not getOrCreate (mint) — OwnerAssociationRequestServiceImpl.java:113.
        No owner mint from this form. POSITIVE finding upheld.
    - drift_class: form_lacks_validation_on_oidc_username_no_existence_check_no_format_constraint
      description: |-
        The oidcUsername field is a free-text Input with only
        `rules={{ required: true }}` — no format validation, no
        existence check against the IdP, no validation that the
        username corresponds to an actual identity. An admin can bind
        an Owner to a username string that does not yet exist (or never
        will exist) in the IdP. The resulting user_owner_mapping row is
        an orphan binding from day one. F-011 (Principal-to-Owner
        Resolution) is the consumer that will silently NEVER match the
        intended user, with no diagnostic affordance.
      evidence:
        - "OwnerAssociationForm.tsx:62-76 — oidcUsername Controller has only `required: true`, no format / existence validators"
      ui_unverified: false
      reflection_confirms: |-
        CONFIRMED by feature-reflector/0.3.0 (2026-06-03, reflection F-172
        H-005, severity HIGH) and independently by scanner finding F-172b
        (→ PLT-024). The top-down pass re-derived this from the consumer
        (F-011) side: getAssociatedOwner is a case-sensitive .eq on
        oidc_username (ReactiveUserOwnerMappingRepositoryImpl.java:116-127),
        so a typo OR a wrong-provider pick yields a permanent orphan binding
        with no diagnostic anywhere. Convergent validation (scanner + reflection)
        raises confidence. Tracked as PLT-024.
    - drift_class: submit_success_no_toast_no_redirect_modal_silently_closes
      description: |-
        On successful submit (`isSuccess=true` from useCreateUserOwnerMapping)
        the form's DialogWrapper closes via `handleCloseSubmittedForm={isSuccess}`
        — there is no success toast, no inline confirmation, no
        navigation to the Active tab where the new mapping would appear.
        The operator's only feedback that the bind worked is the modal
        disappearing. If the Active tab does not auto-refetch
        (rq cache is invalidated on tab change per
        OwnerAssociationsTabs:44-47, but operator may not switch tabs
        immediately), the operator has no visible confirmation that
        the row exists. Adjacent to F-064 silent-empty pattern at the
        operator UX level.
      evidence:
        - "OwnerAssociationForm.tsx:108 — handleCloseSubmittedForm={isSuccess} (close-on-success, no toast/redirect)"
        - "OwnerAssociationsTabs.tsx:44-47 (query invalidation only on tab switch)"
      ui_unverified: true
      ui_unverified_reason: |-
        Whether useCreateUserOwnerMapping internally invalidates the
        OwnerAssociationRequestList rq cache (so Active tab refetches
        automatically) was not Read in slice H. The drift is
        ui_unverified pending that hook's source.
      reflection_partial: |-
        PARTIAL per feature-reflector/0.3.0 (2026-06-03, reflection F-172
        H-006): close-on-success only, no toast/redirect (confirmed); the
        create-hook's rq-invalidation remains ui_unverified (no enriched UI
        sidecar). Routed to a LOW UI-polish PLT candidate.
terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Single INSERT into user_owner_mapping(user_id, owner_id, ...) — the
    direct binding without an intermediate owner_association_request
    row. The owner_id is pre-existing (admin selected from autocomplete).
    The user_id may or may not correspond to an actual logged-in user
    yet (no existence check on the oidcUsername input). Audit silence
    on the binding event itself is the load-bearing facet.
  evidence: "OwnerAssociationForm.tsx:42-46 + inferred backend"
  reflection_correction: |-
    CORRECTED by feature-reflector/0.3.0 (2026-06-03). The endpoint is
    POST /api/owners/mapping (NOT /api/user_owner_mapping — the hop-3 inference
    from the React hook name; confirmed at SecurityConstants.java:155-158 this
    invocation). The write is NOT a single bare INSERT and is NOT audit-silent:
    OwnerAssociationRequestServiceImpl.createUserOwnerMapping (line 107-114)
    writes an owner_association_request row (status=APPROVED) + a
    REQUEST_MANUALLY_APPROVED owner_association_request_activity row BEFORE the
    user_owner_mapping INSERT, all under one @ReactiveTransactional. The
    "Audit silence … is the load-bearing facet" sentence is FALSE — see
    reflection F-172 H-003.
