    expected: |-
      Either (a) decouple via compensating-action / outbox pattern
      (audit becomes best-effort), OR (b) explicit operator-facing
      doc text "the activity emit is in the SAME transaction as
      the business mutation; activity-write failure rolls back the
      mutation".
    drift_class: activity_emit_couples_rollback_to_business_mutation_same_reactive_transactional
    provenance: |-
      PRIMARY-SOURCE — ActivityAspect.java:42 (@ReactiveTransactional)
      + ActivityServiceImpl.java line-by-line verified absence of
      local TX + AlertServiceImpl.java:201 + IngestionServiceImpl.java:66.
      Severity: HIGH (operator-surprising coupling; surfaced via
      Stress Protocol Category E). Cross-reference REFACTOR-NNN
      (extract activity emit to outbox) + TEST-GAP-NNN (no test
      pins the rollback contract). Source batch: VAL-LSN-019-B.
  - facet: ActivityEmptyPartitionsHousekeepingJob check-then-drop race → silent row loss
    observed: |-
      The job's name honors its CENTRE meaning (only EMPTY past
      partitions dropped) — but the implementation is two
      non-transactional statements: `SELECT count(*) = 0 FROM
      <partition>` at PartitionServiceImpl.java:134 followed by
      `DROP TABLE <partition>` at line 122. A concurrent
      `INSERT INTO activity` landing AFTER the count-zero check
      but BEFORE the DROP TABLE causes the just-inserted row to
      be DROPPED with the partition. The INSERT caller sees
      success; the row is GONE. The parent template
      (EmptyPartitionsHousekeepingJob.java:16-33) does NOT wrap in
      `DSL.using(connection).transaction(...)`, unlike sibling
      AlertHousekeepingJob.java:25 which DOES.
    expected: |-
      Either (a) wrap empty-check + DROP in a `DSL.using(connection)
      .transaction(...)` (structurally aligns with
      AlertHousekeepingJob's pattern), OR (b) re-check emptiness
      AFTER acquiring ACCESS EXCLUSIVE lock on the partition before
      DROP, OR (c) explicit operator-facing doc text on
      "DROP-without-IF-EXISTS race window".
    drift_class: activity_empty_partitions_housekeeping_check_then_drop_race_silent_row_loss
    provenance: |-
      PRIMARY-SOURCE — PartitionServiceImpl.java:108-117 (the
      two-statement non-transactional pattern) +
      EmptyPartitionsHousekeepingJob.java:16-33 (no transaction
      wrapper, contrast with AlertHousekeepingJob.java:25
      `transaction(...)`). Severity: HIGH (silent-data-loss class —
      LSN-001 sibling shape on the audit trail itself). Surfaced
      via Stress Protocol Category E. Probe P-022 emitted.
      Cross-reference LSN-018 (the structural-analogue —
      coherence-check gap), F-010 (Housekeeping TTL) batch-R
      activity-monotonic-growth confirmation. Source batch: VAL-LSN-019-B.
  - facet: Concurrent oldState capture race → wrong attribution in second handler's diff
    observed: |-
      When two concurrent `@ActivityLog`-annotated mutations
      target the SAME data entity, both `getContextInfo` calls
      capture the SAME pre-mutation oldState (the
      `@ReactiveTransactional` isolation is READ COMMITTED, not
      SERIALIZABLE — both transactions read committed state
      pre-A). Mutation A runs; A's `getUpdatedState` sees state
      after A. Mutation B runs after A; B's `getUpdatedState`
      sees state after both — but B records diff (pre-A →
      after-A+B), claiming credit for A's change. The Activity
      Feed shows two rows each claiming credit for the other's
      change. No optimistic-concurrency check at the UI level
      catches this; no SELECT-FOR-UPDATE at the handler level
      serialises the snapshots.
    expected: |-
      Either (a) SERIALIZABLE isolation on @ActivityLog flows
      (broad performance cost), OR (b) per-data-entity advisory
      lock during the @ActivityLog window (handler-tier serialization),
      OR (c) explicit doc text + UI optimistic-concurrency for
      operator-visible-on-conflict semantics.
    drift_class: concurrent_oldstate_capture_race_wrong_attribution_in_second_handler_diff
    provenance: |-
      PRIMARY-SOURCE — ActivityHandler.java:12-15 (read-before /
      read-after contract) + ActivityAspect.java:48-95 (the
      around-advice flow; no inter-snapshot locking) +
      ActivityAspect.java:42 (READ COMMITTED isolation, default
      Postgres). Severity: HIGH (audit-trail-trust class —
      operator confidence in the feed degrades). Surfaced via
      Stress Protocol Category E. Cross-reference TEST-GAP-NNN
      (StepVerifier two-concurrent-OwnershipServiceImpl-update
      integration test) + P-019 (the structural-analogue concurrent
      write race surfaced at the Tag layer in VAL-LSN-019).
      Source batch: VAL-LSN-019-B.
  - facet: Service-tier zero authorization → cross-owner / multi-tenant data leak
    observed: |-
      ActivityServiceImpl.java lines 33-273 verified line-by-line:
      zero @PreAuthorize, zero programmatic
      `permissionService.hasPermission(...)`, zero owner scoping
      on reads except `MY_OBJECTS` view-mode (which scopes along
      OBJECT-OWNERSHIP, NOT ACTOR axis — see existing
      `read_default_cross_owner_my_objects_axis_mismatch` facet).
      `getDataEntityActivityList` (line 119-136) accepts a
      `dataEntityId` and unconditionally fetches activity for that
      ID — any authenticated user reads any data entity's audit
      trail including JSONB old/newState descriptions. In a
      multi-tenant scenario operators of tenant A see tenant B's
      lifecycle events including PII / credentials accidentally
      pasted into description fields.
      CROSS-CUTTING POSTURE CONFIRMATION: this is the SAME root
      cause finding as F-018's
      `tag_service_tier_zero_permission_checks_controller_perimeter_sole_authorization`
      (VAL-LSN-019 batch). The two findings are not Tag-specific
      or Activity-specific — they are the PLATFORM's service-tier
      auth posture: controller perimeter is the sole authorization
      gate; service tier is auth-free by design.
    expected: |-
      Either (a) introduce a service-tier authorization layer
      (e.g. @PreAuthorize on every public method), OR (b)
      explicit ADR documenting the design — controller perimeter
      sole authorization, no per-tenant scoping at service tier —
      so operators understand the posture before deploying
      multi-tenant.
    drift_class: service_tier_zero_authorization_cross_owner_visibility_multi_tenant_leak
    provenance: |-
      PRIMARY-SOURCE — ActivityServiceImpl.java:33-273 (verified
      line-by-line absence) + ActivityController.java:1-58 (no
      @PreAuthorize) + ReactiveActivityRepositoryImpl.java:128-145
      (no per-tenant filter). Severity: HIGH (multi-tenant data
      leak class). Surfaced via Stress Protocol Category D. CROSS-
      CONFEDERATE with F-018 VAL-LSN-019 finding — two distinct
      services exhibit the SAME architectural posture; the cross-
      batch confirmation validates that the protocol fires
      consistently across feature shapes. Cross-reference
      REFACTOR-547 (the Tag analogue — same root cause). Source
      batch: VAL-LSN-019-B.
  - facet: Spurious activity events from Postgres row-order non-determinism in diff equality
    observed: |-
      `getOwnershipsByDataEntityId`
      (ReactiveOwnershipRepositoryImpl.java:130-145) has NO
      `ORDER BY`; `listDataEntityDtos`
      (ReactiveTagRepositoryImpl.java:69-81) has only
      `groupBy(TAG.fields())`, NO `ORDER BY`. Both produce
      `List<*Dto>` that ActivityHandler concrete impls serialize
      as JSON (`AbstractOwnershipActivityHandler.java:19-22`
      collectList → JSON; `TagActivityHandlerImpl.java:41-50`
      list → JSON). The same underlying owner / tag set
      serializes as `[A, B]` or `[B, A]` depending on Postgres
      row order (storage order, can change after VACUUM,
      UPDATE-MOVE, or query-plan changes). The
      `info.getOldState().equals(newState)` filter at
      ActivityAspect.java:86 is STRING-equality — a row-order
      flip emits a spurious activity event recording "same
      owners changed to same owners in different order".
    expected: |-
      Either (a) add `ORDER BY` on the list queries (cheapest,
      most direct), OR (b) replace JSON-string-equality with
      semantic-equality (deserialize + DTO comparator) at
      ActivityAspect.java:86, OR (c) sort the List<*Dto>
      deterministically before JSON-serialization at the handler.
    drift_class: spurious_activity_events_from_postgres_row_order_non_determinism_in_diff
    provenance: |-
      PRIMARY-SOURCE — ReactiveOwnershipRepositoryImpl.java:130-145
      (no ORDER BY) + ReactiveTagRepositoryImpl.java:69-81 (no
      ORDER BY) + AbstractOwnershipActivityHandler.java:19-22 +
      TagActivityHandlerImpl.java:41-50 + ActivityAspect.java:86
      (string-equality). Severity: MEDIUM (audit-trail-noise
      class — operator confidence degrades). Surfaced via Stress
      Protocol Category C. P-018 probe emitted to pin
      empirically. Source batch: VAL-LSN-019-B.
  - facet: Ingestion attribution null — no is_system_event flag disambiguator at write
    observed: |-
      `ActivityServiceImpl.createActivityEvent` (line 46-49) +
      `createActivityEvents` (line 60): the
      `switchIfEmpty(Mono.defer(() -> Mono.just(activityMapper.mapToPojo(event,
      activityCreateTime, null))))` fallback fires when
      `authIdentityProvider.getCurrentUser()` is Mono.empty() —
      for ActivityIngestionRequestProcessor (S2S ingestion path;
      no SecurityContext), AlertServiceImpl scheduler flows
      (background thread; SecurityContext lost across boundary),
      and DISABLED-mode anonymous mutations. The
      `ActivityCreateEvent` carries a `systemEvent: boolean`
      field (line 13) but the fallback path passes the event
      through `activityMapper.mapToPojo(event, time, null)` — the
      mapper SHOULD set `is_system_event` from
      `event.systemEvent()` (per the MapStruct convention) but the
      audit-trail discriminator surface for operators is the
      `created_by IS NULL` value, which conflates "ingestion did
      it" with "user did it but auth context bug". Operators
      cannot disambiguate from the UI.
    expected: |-
      Either (a) write `'<anonymous>'` / `'<ingestion-system>'`
      literal into `created_by` for the no-auth-context case
      (reserves NULL for genuine schema-default cases), OR (b)
      surface `is_system_event` explicitly in the Activity Feed
      UI render (operator visually distinguishes), OR (c)
      operator-facing doc text on the discriminator semantics.
    drift_class: ingestion_attribution_null_created_by_no_is_system_event_flag_disambiguator
    provenance: |-
      PRIMARY-SOURCE — ActivityServiceImpl.java:46-49, 58-60 +
      ActivityCreateEvent.java:13 + V0_0_48__add_activity.sql:8
      (is_system_event column exists). Severity: MEDIUM
      (forensic-disambiguation class). Surfaced via Stress
      Protocol Category B. Cross-reference TEST-GAP-NNN
      (testCreateActivityEvent_NoAuthContext_PersistsNullUserId +
      UI render of null user). Source batch: VAL-LSN-019-B.
  - facet: Doc silence — visibility, type filter, pagination, ordering, partition lifecycle
    observed: |-
      Live `/features/active-platform-features/activity-feed`
      doc (WebFetched 2026-05-20 status 200) returns "NOT MENTIONED"
      for FIVE categories: (a) authorization / visibility / who
      can access (anyone authenticated reads global feed cross-owner;
      doc silent); (b) the `type` query parameter and 4 view-mode
      tabs (ALL / MY_OBJECTS / UPSTREAM / DOWNSTREAM); (c)
      pagination / cursor / page-size / default-size; (d) ordering
      / sort-order / chronological framing; (e) the partition-based
      retention model (no row-level TTL; non-empty partitions never
      drop). Each of the FIVE is operator-visible behaviour the
      controller embodies.
    expected: |-
      A dedicated "Visibility and Authorization" section on the
      activity-feed page enumerating the cross-owner default,
      the MY_OBJECTS object-axis scoping, the DISABLED-mode
      anonymous reach; a "Filtering and Pagination" section
      enumerating the type parameter values + cursor semantics +
      size bounds; an "Ordering" section pinning the
      `CREATED_AT DESC, ID DESC` tie-break + the
      second-truncation cursor; a "Retention and Lifecycle"
      section pinning the partition-based reaper + monotonic
      growth + manual-drop-required path. Plus a per-tag API
      reference page at `/developer-guides/api-reference/activity`
      (currently 404; parallel to `/alerts`).
    drift_class: doc_silence_on_visibility_type_filter_pagination_ordering_partition_lifecycle
    provenance: |-
      PRIMARY-SOURCE — WebFetch
      /features/active-platform-features/activity-feed 2026-05-20
      (5-category inventory NOT MENTIONED) +
      ActivityController.java:1-58 (visibility surface) +
      ActivityServiceImpl.java:107-117 (type dispatch) +
      ReactiveActivityRepositoryImpl.java:285-291 (cursor +
      ordering) + ActivityEmptyPartitionsHousekeepingJob (lifecycle).
      Severity: HIGH (doc-class; combined with the in-product
      surface this is a publishing-standard miss). Cross-reference
      DOC-GAP-NNN (each of the 5 categories deferred to
      doc-gap-finder). Source batch: VAL-LSN-019-B.
