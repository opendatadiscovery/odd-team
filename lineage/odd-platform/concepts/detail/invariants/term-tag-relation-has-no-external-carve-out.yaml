name: Term-tag relation has NO external/origin carve-out — tag_to_term replace-all removes every relation
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-06
  - P-01
description: |-
  NEW INVARIANT, batch X-TAGGING (2026-05-21) — captures a
  schema-rooted divergence between the three tag-relation tables that
  makes the term-tag replace-all operation behave differently from its
  data-entity and dataset-field siblings.

  THE THREE TAG-RELATION TABLES — provenance discriminator comparison:

    tag_to_data_entity — carries an `external` BOOLEAN column. The
      data-entity replace-all (updateRelationsWithDataEntity) carves
      OUT external = true relations: Collector-set tags survive a UI
      replace-all.

    tag_to_dataset_field — carries an `origin` VARCHAR column with a
      three-value TagOrigin enum (INTERNAL / EXTERNAL /
      EXTERNAL_STATISTICS). The dataset-field replace-all
      (updateDatasetFieldTags) scopes its DELETE to origin = 'INTERNAL':
      EXTERNAL and EXTERNAL_STATISTICS relations survive.

    tag_to_term — has NEITHER. `V0_0_35__add_terms.sql:18-28` declares
      tag_to_term with primary key (tag_id, term_id), FKs to tag and
      term, and NO `external` column and NO `origin` column. The
      `deleted_at` column was later DROPPED by
      V0_0_76__term_relations_hard_delete.sql:12-13 (term relations are
      hard-deleted, no tombstone).

  THE CONSEQUENCE:
    TagServiceImpl.deleteRelationsWithTerm (the phase-1 worker of the
    term-tag replace-all) treats the submitted tag_name_list as
    `tagsToKeep` and HARD-deletes EVERY tag_to_term row whose tag name
    is absent from the submitted set. listByTerm
    (ReactiveTagRepositoryImpl.java:128-135) filters only on
    TAG.DELETED_AT.isNull() — there is no provenance column to consult,
    so there is no ingested-tag set to preserve.

  WHY THIS IS NOT A BUG — and why it is still worth recording:
    The absence is INTENTIONAL at the schema level: terms are a
    UI/API-authored business-glossary concept (P-06) with NO
    ingestion-side tagging path. No Collector ever writes a tag_to_term
    row, so there is genuinely nothing to carve out. The invariant is
    recorded NOT as a defect but as a cross-axis FACT a maintainer
    needs: an operator who knows the data-entity tag behaviour (where
    external tags survive) will INCORRECTLY assume the term-tag path
    behaves identically. The three replace-all operations look alike
    at the API surface but diverge at the schema — this invariant is
    the join key that documents the divergence.

  CROSS-REFERENCE — the related but distinct audit-silence asymmetry:
    The term-tag path ALSO emits no @ActivityLog event (unlike the
    data-entity tag path's TAG_ASSIGNMENT_UPDATED). That is a separate
    finding tracked by the F-006 audit-silence invariant family and by
    the new `replace-all-term-tag-relations` operation's
    security_aggregate.weaknesses — it is NOT the same as this
    schema-rooted carve-out absence.

