terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Two terminal-effect classes for the spec:
    (a) build-time — openapi-generator-cli emits the platform-side
    `*Api` interfaces (`DataEntityApi`, `AlertApi`, `TermApi`, ...
    ~150 generated Java files) plus the React UI's TypeScript client
    + ~250 schema POJOs from components.yaml. Controllers
    `@Override`-implement the generated interfaces (verified across
    every controller sidecar including batch-W class-level audits).
    No controller declares its own `@RequestMapping` for spec'd
    operations — the spec is the path/method authority.
    (b) runtime — every running platform serves the spec at
    `{platform-base-url}/api/v3/api-docs` via Spring's springdoc-openapi
    integration; Swagger UI renders the spec for interactive testing.
    Per live API-reference doc (WebFetched 2026-05-20): "The Swagger
    UI hosted on every running ODD Platform is the place to
    interactively test the endpoints documented above against your
    own deployment."
  evidence: |-
    Build-time: cross-batch evidence at every controller sidecar
    (`extends *Api` pattern verified at AlertController +
    DataEntityController + TermController + OwnerController +
    QueryExampleController + DataSourceController + CollectorController
    + TagController). Runtime: live api-reference page WebFetched
    2026-05-20 status 200 (the canonical operator-facing landing).
  cardinality_per_call: |-
    Spec parse is one-shot at build time; spec serving is per-request
    at `/api/v3/api-docs`. Per request: 1 reactive routing decision +
    1 spec read (cached) + 1 JSON serialisation. The spec is
    immutable per release; horizontal scaling has no impact on spec
    serving (each instance serves an identical copy).
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — primary-source in batch Z `odd-platform-public-api`
