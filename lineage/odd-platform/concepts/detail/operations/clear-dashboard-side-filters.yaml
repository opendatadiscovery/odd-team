notes: |-
  No test pins the per-side isolation (clearing tables leaves tests intact
  and vice versa). The unit-test cost would be trivial (mount the store,
  set both sides, dispatch one clear, assert only one half is empty);
  zero coverage today. The integration cost (mount the panel, click Clear,
  assert the other side's chips remain) is also untested.
