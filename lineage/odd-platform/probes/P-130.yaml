realism_caveats: |
  The probe assumes docker-compose-up brings up an empty (or near-empty)
  data_entity table; the page=999999 assertion requires that no relationship-class
  entity has 30M rows ahead of it.

  The page=0 boundary is the operator-visible bug class — a JS-style 0-indexed
  caller (typical) hits a 500 / 400 instead of seeing the first page. The
  contract surface is the OpenAPI spec; the spec's PageParam doesn't declare
  a minimum: 1 constraint, so validation never fires at the controller layer.
  This is a request-input validation gap (Category F-adjacent — input name
  `page` promises 1-indexed semantics but the controller doesn't enforce it).
