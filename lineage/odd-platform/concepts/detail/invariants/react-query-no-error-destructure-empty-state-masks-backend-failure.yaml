security_aggregate:
  overall: HIGH
  auth_modes_relevant: []
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: N/A
    detail: |-
      Pattern invariant — not an authorization concept directly. Note: a 401
      auth failure under this pattern is indistinguishable from an empty catalog
      to the operator, which is a SECONDARY security concern (operator may not
      realise their session expired vs. genuinely seeing no data).
  owner_scoping:
    verdict: N/A
    detail: |-
      Pattern invariant — not data-scoped.
  strengths: []
  weaknesses:
    - |-
      A 401 from an expired session shows the same zero-state — the operator
      doesn't see "please log in" and may believe the catalog is empty. The
      app shell DOES catch most auth-redirect cases upstream, but a token
      that quietly expires mid-session at the moment of a dashboard fetch
      could land in this code path.
