terminal_side_effect:
  side_effect_class: db-read
  description: |-
    Per-call: ONE jOOQ SELECT against `user_owner_mapping JOIN owner` (small,
    indexed, single-row). The terminal effect is the resolved OwnerPojo (or
    empty Mono if no mapping exists). Downstream consumers use this to scope
    SQL JOIN predicates on subsequent reads — the OwnerPojo is the
    authorization-relevant primitive, not a user-observable HTTP body itself.
    Side-effect class is db-read at this chokepoint; downstream chains terminate
    in page-render (the /my reads) or activity-emit (the per-owner activity
    views) per the consumer's contract.
  evidence: |-
    AuthIdentityProviderImpl.java:50-53 + ReactiveUserOwnerMappingRepositoryImpl.java:77-85, 116-127.
  cardinality_per_call: 'one OwnerPojo (Mono) per call; consumers fire N calls per request (3-5 sequential identical queries observed per page-load)'
amplification_factor: '3-5 sequential identical DB round-trips per page-load (no per-request memoisation)'
amplification_factor_provenance: |-
  STATIC — primary-source in batch K AuthIdentityProviderImpl sidecar
  performance.hot_paths + bugs_limitations_corner_cases[4]. A single HTTP
  request invoking `getCurrentUser` or `fetchAssociatedOwner` multiple times
  (controller for owner-scoping + permission extractor + activity-logging path)
