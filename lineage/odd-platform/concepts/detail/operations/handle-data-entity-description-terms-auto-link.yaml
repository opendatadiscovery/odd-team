name: Handle Data Entity Description Terms (auto-link reconciliation)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-06
- P-01
description: |-
  **NEW OPERATION, batch 2026-05-19K** — the description-mention auto-link
  reconciliation operation. Invoked from
  `DataEntityServiceImpl.upsertDescription` (line 328 of
  DataEntityServiceImpl) after every description-update on a data-entity.
  Implementation at `TermServiceImpl.handleDataEntityDescriptionTerms`
  (lines 201-207) + `findTermsInDescription` (lines 337-360) +
  `updateDataEntityDescriptionTermsState` (lines 362-389) +
  `buildDataEntityUnknownTerms` (lines 501-512). The operation flow:
    1. **Parse** — Static-final `Pattern TERM_PATTERN = compile("\[\[([^:]*?):([^\]]*?)\]\]")`
       at line 67 is matched against the description text. Each match
       yields `TermBaseInfoDto(namespaceName, name)`. Matches with empty
       namespace OR empty name short-circuit (the regex permits empty
       groups but downstream comparison drops them).
    2. **Batch-lookup** — `getByNameAndNamespace(List<TermBaseInfoDto>)`
       at ReactiveTermRepositoryImpl.java:162-179 builds a single
       OR-chained WHERE clause and runs one DB round-trip; partitions
       the result into foundTerms (existing terms) + unknownTerms
       (mentions whose (ns, name) pair has no matching term).
    3. **Reconcile** — `updateDataEntityDescriptionTermsState` issues
       4-5 DB statements:
         (a) Re-query existing data_entity_to_term rows with
             is_description_link=TRUE for this data-entity;
         (b) Compute delete-set (existing-rows minus new-foundTerms);
         (c) Compute create-set (new-foundTerms minus existing-rows);
         (d) DELETE old rows;
         (e) INSERT new rows with is_description_link=TRUE;
         (f) Symmetrically reconcile data_entity_description_unhandled_term
             for unknownTerms (DELETE stale + INSERT new staging rows).
    4. **Activity emission** — The operation is annotated with
       `@ActivityLog(event = TERM_ASSIGNMENT_UPDATED)` at line 200; the
       activity handler `TermAssignmentActivityHandler` re-queries
       getDataEntityTerms BEFORE + AFTER the method invocation for
       BEFORE/AFTER state capture.
  **Security implication**: this operation creates term-link rows with
  `is_description_link=TRUE` regardless of whether the caller holds
  `DATA_ENTITY_ADD_TERM` — only `DATA_ENTITY_DESCRIPTION_UPDATE` is gated
  at the controller (the `[[ns:term]]` auto-link side-channel — see
  companion invariant). **Forward-compat side-effect**: a mention for a
  non-existent term is staged in `data_entity_description_unhandled_term`;
  when the matching term is later created via `createTerm`,
  `resolveUnhandledDescriptionMentions` (lines 421-442) drains the
  staging and materialises real link rows AUTOMATICALLY.
