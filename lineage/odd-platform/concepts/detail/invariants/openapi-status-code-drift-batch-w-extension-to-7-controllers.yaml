mitigations_unimplemented:
  - |-
    Coordinated codebase-wide audit: enumerate every controller
    method that implements an OpenAPI-generated *Api interface
    AND verify the response status matches the openapi.yaml's
    declared response code. Estimated 12-18 endpoints affected.
    The audit's deliverable is a single PR per direction-fix.
  - |-
    Direction A (align spec to code): edit openapi.yaml entries
    to declare 200 for create + update paths AND 302 for the
    redirect path. Silently changes the contract for downstream
    SDK consumers; aligns to test reality.
  - |-
    Direction B (align code to spec): edit every controller method
    to use ResponseEntity.status(HttpStatus.CREATED) AND change
    redirect to emit 301. Breaks every existing test that asserts
    isOk(); changes the cacheability of the redirect endpoint
    (301 is cacheable; 302 is not — production impact).
  - |-
    Build-time scanner: enforce status-code consistency between
    controller @Override methods and the openapi.yaml's declared
    response codes. Add to the CI matrix as a gate; future drift
    is caught at PR time.

notes: |-
  This invariant captures the FIRST codebase-wide enumeration of
  the 200-vs-201 status-code drift class. Previous batches
  established the pattern at individual controllers; batch W
  extends to 7+ controllers and confirms the drift is platform-wide.
  Batch ZF re-anchors the IngestionController instance at the
  class level AND surfaces a SECOND drift class (302-vs-301 on
  the DataCollab redirect endpoint).

  The drift's load-bearing observation: it is UNIFORM AND
  UNCOORDINATED. Every controller's createX + updateX exhibits
  it; no controller has been corrected. The OpenAPI spec is the
  published artefact; the controllers are the runtime; the tests
  are the lock-in. The maintainer's call is which direction to
  align (codebase-wide PR).

  Cross-cutting connections:
    - STRENGTHENS the master openapi-200-vs-201-status-code-drift
      (extends to 10+ endpoint-level instances across 8+ controllers
      after batch ZF)
    - Pairs with datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation
      (the DataSource controller is one of the new instances)
    - Pairs with collector-plaintext-token-chain-controller-tier-closure
      (the Collector controller is one of the new instances)
    - Pairs with getpopulartaglist-open-read-plus-side-door-compose-to-write-read-directory-bypass
      (the Tag controller is one of the new instances)
    - **BATCH ZF NEW PAIRING**: cross-link to
      `controllers-are-pass-through-delegates-with-http-wiring-on-generated-api-interfaces` —
      the thin-delegate pattern + the status-code-drift pattern are
      twin manifestations of the maintainer's posture toward the
      OpenAPI spec: the spec is consulted at endpoint-shape time
      (path, method, request body) but not at status-code-precision
      time, and the controllers carry the "actually shipped"
      contract that diverges from the "spec-declared" contract.

  Two DOC-NNN candidates:
    (a) The maintainer's directional call (align spec to code, OR
        align code to spec); the chosen direction's PR is the closure.
    (b) The 302-vs-301 redirect drift is OPERATOR-VISIBLE (cacheability
        affects browser behaviour); the live api-reference doc page
        already names the drift but the spec itself does not — a
        coordinated fix would either update the spec or update the
        controller, ideally before any SDK consumer relies on the
        301-cacheability behaviour.
