- id: H-008
  hypothesis: |-
    When an authenticated user submits a very large request body (multi-megabyte question), the platform
    rejects it before forwarding — i.e. a per-request size cap protects the operator from a single call
    exhausting the LLM context window or driving outsized cost.
  derivation: |-
    Endpoint-shape (GenAIRequest.body is type:string with no maxLength) + cost-injection negative-space; an
    operator paying per-token would expect a bound on input size by default.
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |-
      There is NO GenAI-specific body cap: GenAIRequest.body is `type: string` in the OpenAPI schema
      (components.yaml:4200-4204) with no maxLength/pattern; the generated model has no @Size; the controller
      has no @Valid. So a multi-MB body is accepted at the GenAI layer and forwarded verbatim. The PARTIAL is
      that a global ceiling DOES apply: the application-wide spring.codec.max-in-memory-size is 20MB
      (application.yml:14-15), which bounds the inbound request body for the whole platform. So "rejected
      before forwarding" is true only above 20MB, and false for anything between a sensible LLM input size
      (tens of KB) and 20MB. The live feature page now documents exactly this (DOC-184; "No GenAI-specific
      request-body size cap ... governed only by global WebFlux limit, default 20MB", WebFetch 2026-06-01).
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: bugs_limitations_corner_cases (no @Size) + performance.throughput_characteristics[2]
        cite: "components.yaml:4200-4204 + GenAIController.java:19-23 (no @Size/maxLength/@Valid) + application.yml:14-15 (20MB)"
        note: "Global 20MB inbound ceiling is the only bound; no sensible per-request cap."
    operator_visible_failure: |-
      (1) A single authenticated user can POST a ~20MB question, charging the operator for tokens that may
      blow past the model's context window (most LLMs cap at 4K-128K tokens, far below 20MB of text). (2)
      Combined with no-auth-gate (H-001) and no-rate-limit (H-011), this is a cost-injection vector. The
      mitigation is that 20MB is a hard ceiling and the docs now disclose it; the residual gap is the absence
      of a SENSIBLE per-request cap (e.g. tens of KB) matched to LLM context windows (PLT-020 PR-4 proposes
      16KB).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # no test asserts the body-cap behaviour (neither the 20MB ceiling nor the absence of a smaller cap)

- id: H-009
  hypothesis: |-
    When the external AI service returns a structured JSON object (e.g. {"answer":"42 datasets"}) rather
    than a bare JSON-quoted string, the user still receives a clean, readable answer.
  derivation: |-
    Response-shape: the response unwrap (CharMatcher quote-trim + unescapeJava) encodes an UNDOCUMENTED
    contract on the external service's response shape; a PO asks what a user sees when a reasonable external
    service returns the other common shape (a JSON object).
  seed_source: response-shape
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Traced statically: GenAIServiceImpl.java:45-47 does
      `StringEscapeUtils.unescapeJava(CharMatcher.is('"').trimFrom(item))`. For a bare quoted string
      `"text\n"` this yields the clean unescaped text. For a structured object `{"answer":"text"}` the
      boundary chars are `{`/`}`, so trimFrom strips nothing at the boundaries and the caller receives the
      literal JSON text — silently wrong, HTTP 200, not an error. The exact mutated string depends on how
      unescapeJava treats interior escapes, so the operator-visible string needs a run to pin precisely; the
      load-bearing prediction (the caller does NOT get a clean answer) is static-inferred HIGH but the precise
      leaked output is probe-needed.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: concepts.invariants[2] + docs_link_semantic.doc_drift_findings[2]
        cite: "GenAIServiceImpl.java:45-47"
        note: "Unwrap assumes a bare JSON-quoted string; structured object leaks literal JSON; contract undocumented."
    operator_visible_failure: |-
      An operator who wires an external service that returns structured JSON (a very common shape) sees
      garbled answers (raw JSON braces and field names) in the response body with HTTP 200 — there is no
      error to alert on, so the failure is silent and only a human reading the answer notices. The
      compatibility constraint (the external service MUST return a bare JSON-quoted string) is nowhere in the
      docs, so an operator cannot know to conform their service.
    severity: MEDIUM
    confidence: HIGH
    probe_id: PENDING-F-039-1   # parallel-safe mode: NOT materialised as a P-NNN file; record only
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional   # = the emitted probe PENDING-F-039-1 (the response-shape unwrap matrix: bare-quoted-string vs structured-object)

- id: H-010
  hypothesis: |-
    When the external AI service returns a long-form answer larger than 256KB but within the 20MB ceiling
    the feature page names, the user receives the full answer.
  derivation: |-
    Doc-claim seed: the live feature page frames the size ceiling as "governed only by global WebFlux limit,
    default 20MB"; a PO checks whether that ceiling actually governs the OUTBOUND response path, not just the
    inbound request.
  seed_source: doc-claim
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Traced statically: the genAiWebClient builder (WebClientConfiguration.java:26-29) does NOT call
      `.codecs(c -> c.defaultCodecs().maxInMemorySize(...))`, so it uses the Spring WebFlux DEFAULT
      outbound-response in-memory ceiling of 256KB. The application-wide spring.codec.max-in-memory-size: 20MB
      is NOT inherited onto this dedicated client. A response >256KB throws DataBufferLimitException
      mid-stream, which (not being a ReadTimeoutException) collapses through GenAIServiceImpl.java:48-51 into a
      generic GenAIException -> HTTP 500. The doc's "20MB" framing describes the INBOUND request codec; it does
      not apply to the response direction. A run pins the exact boundary and confirms the 500. (The
      GenAIException->500 leg is itself pinned by AdrControllerAdviceMappingScanTest, so the 500 mapping is
      guarded — but not the 256KB cause.)
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_config_properties__config-properties-class__GenAIProperties
        section: performance.resource_allocation[default-max-in-memory]
        cite: "WebClientConfiguration.java:26-29 (no .codecs override) + application.yml:14-15"
        note: "256KB WebFlux default on this client, NOT the 20MB app-wide value."
    operator_visible_failure: |-
      (1) Long-form LLM answers (multi-paragraph summaries, the exact kind of output a GenAI assistant
      produces) silently fail with HTTP 500 once they exceed 256KB. (2) The error is the generic GenAIException
      branch, NOT the friendly timeout message, so the operator gets a raw DataBufferLimitException.getMessage()
      that does not name the codec ceiling. (3) The live docs MISLEAD here: an operator reading "20MB ceiling"
      reasonably expects answers up to 20MB to work, when the real outbound ceiling is 256KB — an 80x gap.
    severity: MEDIUM
    confidence: HIGH
    probe_id: PENDING-F-039-2   # parallel-safe mode: NOT materialised as a P-NNN file; record only
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional   # = the emitted probe PENDING-F-039-2 (response size boundary at 256KB; assert 500 + the doc-vs-code 80x gap)

- id: H-011
  hypothesis: |-
    When a single authenticated user fires GenAI requests in a tight loop, the platform throttles them (a
    per-user or global rate limit) so one client cannot monopolise the external service or run up unbounded
    cost.
  derivation: |-
    Negative-space + cost-injection: a paid external integration would, by default, be expected to carry some
    rate control; a PO confirms whether ANY throttle exists on the path.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      No rate limit exists anywhere on the path. There is no Bucket4j, no Resilience4j RateLimiter, no
      @RateLimit, no token bucket (grep over the genai/controller/config packages returns zero matches at
      commit ede5d277); the WebClient builder has no ExchangeFilterFunction for throttling. The only bound is
      the external service's own throttling. With N replicas behind a load balancer, effective rate multiplies
      by N because there is no shared cross-instance limiter. The live feature page now documents this ("No
      per-user quota or rate limit", WebFetch 2026-06-01; DOC-184 caveat 1a).
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_config_properties__config-properties-class__GenAIProperties
        section: performance.scaling_characteristics[no-shared-rate-limiter] + performance.known_performance_gaps[no-concurrency-cap]
        cite: "GenAIServiceImpl.java:41 + WebClientConfiguration.java:20-30 (no RateLimiter/Bulkhead/Resilience4j wiring) + grep for rate-limit primitives (zero matches)"
        note: "No rate-limit primitive anywhere on the path; N replicas multiply effective external rate by N."
    operator_visible_failure: |-
      (1) One authenticated user (or a captured request replayed — there is no idempotency key) can drive cost
      without bound at HTTP-client speed. (2) Horizontal scaling makes it worse, not better — more replicas
      means more uncoordinated outbound rate. The mitigation is that the docs now disclose the absence and
      advise network-layer controls (DOC-184); the residual is whether the platform should offer an opt-in
      limiter (PLT-020 PR-2). Routes to caveat (doc satisfied) but flagged because the cost consequence is real
      money.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # no test / load-probe pins the absence of rate limit at the platform layer

- id: H-012
  hypothesis: |-
    Because there is no in-app UI affordance for GenAI today, the feature's security gaps
    (H-001/H-005/H-006/H-011) are not actually exposed to ordinary end-users — the surface is reachable only
    by developers reading the OpenAPI spec, so the risk is latent rather than live.
  derivation: |-
    Cross-pillar (P-11 developer surface) + the "API-only today" claim; a PO asks whether the absence of UI is
    a real mitigation or a false comfort.
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |-
      The premise is TRUE today: grep over odd-platform-ui/src for the generated GenaiApi client returns zero
      hand-written callers, and the live docs state "API-only today" on both the feature and config pages. So
      an ordinary UI user cannot reach the endpoint via a button. BUT the gaps are no less PRESENT — they are
      reachable by any authenticated user via the OpenAPI-generated SDK or hand-crafted REST, including a
      low-privilege insider. And the generated TypeScript client already ships in the UI bundle, so a future
      in-app affordance (a sidebar chat panel) would expand reach to every authenticated user with a single
      deployment-time flip — at which point the latent gaps become live with no additional code review of the
      security model.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: bugs_limitations_corner_cases[3]
        cite: "grep odd-platform-ui/src for GenaiApi|genAiQuestion|/genai/ (zero matches) + live config page 'API-only today'"
        note: "No UI consumer today; generated client ships unused."
    operator_visible_failure: |-
      (1) False comfort — an operator who reasons "no UI, so low risk" underrates the insider/SDK reachability
      that exists today. (2) Trajectory risk — the gaps should be closed BEFORE a UI consumer ships, not after;
      the absence of UI is not a substitute for the absent authorization/audit/rate-limit. The PARTIAL is that
      the no-UI premise is genuinely true and does reduce casual exposure, but it does not make the feature safe.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render    # the (absent) UI surface — Rule 9 API-only acknowledgement
    coverage: unverified
    test_demand: functional   # a guard test that no hand-written UI caller imports GenaiApi (so the latent->live flip is a conscious, reviewed edit) — the LSN-029-style structural pin

