gap_id: TEST-GAP-076
category: missing-integration
criticality: HIGH
node_ids:
- odd-platform java DataEntityAttachmentController controller-method:uploadFileChunk
- odd-platform yaml application.yml config-prefix:attachment
surfaced_by:
- uploadFileChunk.md:tests_coverage_semantic.uncovered_behaviours.[8]
- uploadFileChunk.md:bugs_limitations_corner_cases.[0] (severity HIGH)
behaviour: 'Multi-instance routing — chunk POST hits an instance that did not handle
  `initiateFileUpload`; `/tmp/odd/chunks/{uploadId}/` does not exist locally, `transferTo`
  raises `NoSuchFileException`. Method-level finding: chunk staging path is hardcoded
  in `FileUtils.CHUNK_BASE_PATH` (FileUtils.java:24) and is storage-mode-independent
  — applies to BOTH `attachment.storage=LOCAL` AND `REMOTE`. Class-level sidecar identified
  the LOCAL flavour; method-level evidence promotes it to a universal multi-instance
  gap. Closely related to TEST-GAP-024 (storage-backend parity) and TEST-GAP-051 (LSN-001)
  but distinct: this is the chunk-staging path, NOT the finalised file path.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/integration/AttachmentMultiInstanceChunkRoutingTest.java
  name: uploadFileChunk_routedToDifferentInstanceThanInitiate_failsWithNoSuchFileException
evidence:
- 'uploadFileChunk.md says: ''If a load balancer routes initiateFileUpload and uploadFileChunk
  to different instances without a shared volume backing /tmp/odd/chunks, transferTo
  raises NoSuchFileException ... This applies to BOTH attachment.storage=LOCAL AND
  attachment.storage=REMOTE'''
- 'concepts.yaml:entities[Attachment].performance_aggregate.weaknesses.[1] verbatim:
  ''Multi-instance LOCAL storage broken: chunk staging directory keyed by uploadId
  only ... uploadFileChunk method-level finding extends scope: this applies to REMOTE
  storage too because the chunk staging path is upstream of the storage-backend dispatch
  (severity HIGH)'''
cross_references:
- concepts.yaml:entities[Attachment].performance_aggregate.weaknesses.[1]
- retrospectives/LSN-001-attachment-ephemeral-default.md
proposed_action: Add Testcontainers integration test simulating two-instance routing
  (initiate on instance A, chunk POST on instance B without shared volume); assert
  NoSuchFileException + 5xx. Pair with sibling assertion that shared volume / external
  chunk-store fixes it. Locks the multi-instance contract for a future fix.
