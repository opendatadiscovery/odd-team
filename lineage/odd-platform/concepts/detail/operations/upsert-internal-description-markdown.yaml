security_aggregate:
  overall: HIGH
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  authorization_consistency:
    verdict: CONSISTENT
    detail: SecurityRule + DATA_ENTITY_DESCRIPTION_UPDATE correctly wired; supports
