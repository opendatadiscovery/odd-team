description: |-
  **NEW INVARIANT, batch 2026-05-19K — PRIMARY-SOURCE PIN of REFACTOR-142.**
  The AlertHousekeepingJob TTL filter at `housekeeping/job/AlertHousekeepingJob.java:28-34`
  builds its jOOQ DELETE predicate as:
  `.where(ALERT.STATUS.eq(RESOLVED)).or(ALERT.STATUS.eq(RESOLVED_AUTOMATICALLY)).and(ALERT.STATUS_UPDATED_AT.lessOrEqual(cutoff))`
  jOOQ's fluent-builder precedence: `.and(...)` binds to the most recent
  `.or(...)`. The emitted SQL is therefore
  `WHERE (STATUS = 'RESOLVED') OR (STATUS = 'RESOLVED_AUTOMATICALLY' AND STATUS_UPDATED_AT <= cutoff)`.
  The TTL applies ONLY to `RESOLVED_AUTOMATICALLY` rows; manual `RESOLVED`
  rows are hard-deleted on the very next 15-minute housekeeping cycle
  regardless of `housekeeping.ttl.resolved_alerts_days`. The live docs
  (WebFetch /configuration-and-deployment/odd-platform 2026-05-19, status
  200) acknowledge the bug VERBATIM: "a known platform bug currently exempts
  manual resolutions from the retention check — manual RESOLVED alerts are
  hard-deleted on the next housekeeping run regardless of this value." The
  bug is therefore docs-acknowledged BUT: (a) there is NO `// TODO`, NO
  `// BUG`, NO comment in the source pointing to the docs acknowledgement;
  (b) NO GitHub-issue link; (c) NO regression test asserting either current
  behaviour or intended behaviour; (d) NO mention of the fix shape (the
  parenthesisation needed). A future maintainer reading the docs page learns
  the bug exists but cannot find the corresponding code line; a future
  maintainer reading the code cannot infer the bug is known. **The fix**:
  parenthesise the predicate as
  `.where(STATUS.eq(RESOLVED).or(STATUS.eq(RESOLVED_AUTOMATICALLY))).and(STATUS_UPDATED_AT.lessOrEqual(cutoff))`.
  The HousekeepingJobManager sidecar primary-source confirms the bug from
  the orchestrator-side angle (HousekeepingJobManager.java:33-35 invokes
  the buggy job in the same 15-min cycle as the other four jobs). The
  HousekeepingTTLProperties batch-D sidecar surfaced the bug from the
  config-key angle. **This batch-K finding is the FIRST primary-source
  pin to the actual code line and the exact jOOQ predicate text.**
