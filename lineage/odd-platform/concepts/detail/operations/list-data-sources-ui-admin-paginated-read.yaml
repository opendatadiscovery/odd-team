security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
    - S2S
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      GET /api/datasources has NO SecurityRule — it falls through to
      the `pathMatchers('/**').authenticated()` catch-all. ANY
      authenticated user lists every data source regardless of role
      or policy. No @PreAuthorize, no programmatic permissionService
      check. This is the deliberate read-collaborative posture
      (mutations gated, reads open) — consistent with 28 sibling read
      surfaces — but it is undocumented at the doc-site.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      getDataSourceList returns ALL live data sources — no owner-scope
      predicate at the controller, service, or repository. A read-only
      user can enumerate the full topology of registered systems
      (id, name, oddrn, namespace, masked token).
  strengths:
    - |-
      The list path is fully idempotent and read-only — no @ReactiveTransactional
      needed; concurrent calls are independent reads with no shared
      mutable state
    - |-
      The token field is MASKED API-side on the list path
      (`"******" + last6`) — the full 40-char plaintext is NOT exposed
      on the list endpoint (only on register/regenerate)
  weaknesses:
    - |-
      GET endpoint not in SECURITY_RULES — every authenticated user
      lists the full catalogue incl. masked tokens, ODDRNs, namespaces
      with no MANAGEMENT permission and no owner scope (MEDIUM —
      intentional read-collaborative posture but undocumented)
    - |-
      The masked token form leaks the REAL last 6 characters of every
      collector token to read-only users — the doc page calls it
      'partially-redacted' but does not say the visible part is real
      token material (LOW)
    - |-
      A single-line change at ReactiveDataSourceRepositoryImpl.java:167
      (1-arg TokenDto → TokenDto.visibleToken) would flip the list
      endpoint to expose full 40-char plaintext tokens to every
      authenticated user, with no test to catch it (MEDIUM
      regression-surface; probe P-035 is the guard)
  cross_file_inconsistencies: []
  contributing_files:
    - getDataSourceList.md
  evidence:
    - getDataSourceList.md:security.authorization_assertions + security.owner_scoping
    - getDataSourceList.md:security.known_security_gaps (GET not in SECURITY_RULES; masked-token leaks last 6 chars; the 1-line plaintext-exposure regression surface)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      getDataSourceList runs synchronously per request — the SQL is a
      CTE-paginated data_source scan + 2 LEFT JOINs against NAMESPACE
      and TOKEN; the window-function count runs in the same query. For
      typical catalogs (<500 data sources) sub-100ms (getDataSourceList.md
      performance.hot_paths)
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One paginated read per request; clients iterate pages to
      enumerate the catalogue. There is no streaming and no bulk
      variant.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      Stateless and read-only — instances scale horizontally with no
      lock. BUT `size` has NO upper bound (the OpenAPI SizeParam
      declares no `maximum`); a caller requesting size=Integer.MAX_VALUE
      makes the server materialise the entire data_source table + 2
      LEFT JOINs into one in-memory list — an unbounded-response
      surface. The list is effectively un-clamped, not truly paginated.
  strengths:
    - Stateless, read-only — horizontally scalable; no FOR UPDATE lock on the list path
    - The name filter uses startsWithIgnoreCase (a sargable LIKE-prefix — can use a B-tree index on name)
  weaknesses:
    - |-
      `size` has no upper bound — at a very large catalogue a single
      oversized request degrades response time and memory; no clamp,
      no default ceiling (getDataSourceList.md performance.known_performance_gaps
      LOW; pinned by probe P-037)
  cross_file_inconsistencies: []
  contributing_files:
    - getDataSourceList.md
  evidence:
    - getDataSourceList.md:performance.hot_paths + resource_allocation
    - getDataSourceList.md:performance.scaling_characteristics + known_performance_gaps (unbounded size; probe P-037)
notes: |-
  This operation completes the 5-endpoint UI-admin DataSource surface
  in the registry — the four write operations (register-data-source,
  update-data-source-ui-admin-replace, delete-data-source-ui-admin-guarded-soft-delete,
  regenerate-data-source-token) plus this READ operation.

  The load-bearing fact: the list endpoint has NO permission gate —
  any authenticated user enumerates the full data-source catalogue
  including masked collector tokens. This is the deliberate
  read-collaborative posture, but an operator wiring an RBAC policy
  to "restrict user X to view-only on the Datasources tab" achieves
  nothing — the user can already view all data sources without any
  DATA_SOURCE_* permission.

  Cross-cutting connections:
    - Pairs with datasource-listdto-page-vs-count-predicate-divergence-refactor-425
      (the query prefix-vs-substring divergence on this endpoint)
    - Pairs with read-collaborative-cross-owner-enumeration-batch-w-extension
      (GET /api/datasources is surface 25 of the 29-surface pattern)
    - Pairs with entity collector-token (the list endpoint emits the
      MASKED token form — API-side redaction RESOLVED by this sidecar)
    - Pairs with register-data-source + update-data-source-ui-admin-replace
      + delete-data-source-ui-admin-guarded-soft-delete + regenerate-data-source-token
      (the 5 UI-admin DataSource operations)
    - Four probes minted on this endpoint — P-034 (id-ASC ordering),
      P-035 (masked token form), P-036 (query prefix-vs-substring
      divergence), P-037 (unbounded size + size/page boundary)

  Two DOC-NNN candidates: (a) document on /features/management that
  the Datasources list is visible to every authenticated user
  regardless of role; (b) document the list ordering (creation-order
  id-ASC — newly-registered sources appear LAST, not first) and the
  absence of a `size` ceiling.
