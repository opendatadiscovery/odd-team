behaviour: |-
  **MEDIUM — `IngestionServiceImpl` carries the Lombok `@Slf4j` annotation (line 53) but contains ZERO `log.*` calls. Every behavioural decision (JOB_RUN split, DELETED-status restore, MICROSERVICE exclusion, hollow-vs-real partition, duplicate-ODDRN crash, null-entityClassIds NPE) executes SILENTLY.**

  Per the sidecar's `dependencies_semantic.requires-runtime`:
  > "Lombok `@Slf4j` (line 53) — log instance present. **Verified: zero `log.*` calls in the file** (Grep for `log\.` in IngestionServiceImpl.java returned no matches). The `@Slf4j` annotation is dead code at this layer — every behavioural decision in the file (the JOB_RUN split, the DELETED-status restore, the MICROSERVICE exclusion, the hollow-vs-real partition, the duplicate-ODDRN crash) executes silently."

  **Operator-impact chain**:
  1. F-008 5-vertex picture establishes that this service tier is reached by ANY HTTP caller under `auth.ingestion.filter.enabled=false` (the shipped default).
  2. The service performs DESTRUCTIVE writes: replace-not-merge on lineage, delete-on-absence on metadata bindings, EXTERNAL_STATISTICS tag reconciliation, etc.
  3. An attacker exercising the destructive surface produces NO log line in the service tier — no audit trail.
  4. A post-incident question "which payloads were ingested at 2am Tuesday?" has no operational answer from application logs alone.

  **Composes with**:
  - TEST-GAP-815/819/823 (unauthenticated reach): the attack surface exists.
  - TEST-GAP-832/833 (untested crashes): even the CRASHES are silent (the NPE / IllegalStateException is logged at the WebFlux error handler, not the service tier).
  - F-008 `destruction_under_default_off_auth` drift facet: the destruction happens here; the audit gap is here.

  **Why MEDIUM** (operationally important, not security-load-bearing alone):
  - The audit gap is one of MANY contributors to the platform-wide audit-log presence asymmetry (per concept `audit-log-presence-asymmetry-2-tier-audit-story`).
  - Some logging IS performed downstream — `OTLPMetricService.exportMetrics` (terminal step) likely emits metrics; processor chain may log per-processor.
  - But the service-tier orchestration decisions (which entities updated, which restored, which crash-rollback'd) are invisible.

  **Test gap shape**: regression-pin test that
  1. Configures a test `LogCaptor` for `IngestionServiceImpl`.
  2. POSTs a happy-path payload.
  3. Asserts the `IngestionServiceImpl` logger emitted ZERO entries — pinning the current silent behaviour.
  4. Pair with REFACTOR-NNN that adds key log lines at decision points (JOB_RUN split count, restore count, hollow-promotion count, processor success/failure).
