proposed_canonical: Locale Bundle
rationale: Two sidecars (i18n.ts, SelectLanguage) describe the multilingual UI's per-language
  resource bundle in consistent terms; main-concepts.md does not name 'Locale Bundle',
  'Multilingual UI', or 'i18n' anywhere. The platform ships six locales (en/es/ch/fr/ua/hy)
  with a user-facing language switcher and yet has zero doc-side coverage (canonical
  F-047 finding). A canonical doc-side concept entry would close the discoverability
  gap.
contributing_concepts:
- locale resource bundle (i18n.ts)
- language code (SelectLanguage)
- persisted language preference (both)
- i18n singleton (i18n.ts)
suggested_add_to_docs: true
