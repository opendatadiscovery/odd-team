name: Search Session
canonical_in_docs: false
canonical_candidate: true
description: |-
  Server-side persistent state representing one user current catalog-search
  context. POST /api/search does NOT return entity rows directly — it
  creates a search_facets row keyed by a server-generated UUID, returns
  aggregated facet counts + the UUID, and requires the caller to call
  GET /api/search/{search_id}/results for paginated rows. The same UUID is
  used by getSearchFacetList, updateSearchFacets, getFiltersForFacet, and
  highlightDataEntity — every search interaction is bound to a persistent
  session row. **STRENGTHENED batch 2026-05-19M (facets sidecar)** —
  schema-level finding: V0_0_1__init.sql:204-211 defines the table with NO
  owner_id / created_by / user_id column; the UUID is the sole identifier;
  the session is bearer-token-shaped at the schema layer. The TODO markers
  acknowledge UUID generation and TTL gaps without addressing ownership.

  Trade-off: server retains query state across multi-step UI interactions
  (facet drill-down, pagination, highlighting) at the cost of an unbounded
  search_facets table requiring housekeeping (SearchFacetsHousekeepingJob +
  housekeeping.ttl.search_facets_days, default 30 days). Sibling features
  (/api/terms/search, /api/queryexample/search, /api/referencedata/search)
  replicate the same UUID pattern. NOT named in main-concepts.md.

  ## STRENGTHENED batch ZE (2026-05-25) — class-level controller surface

  Batch ZE adds the SearchController class-level sidecar — the full
  7-endpoint surface that operates on the session UUID is now pinned:
  search / getSearchFacetList / updateSearchFacets / getSearchResults /
  getFiltersForFacet / getSearchSuggestions / highlightDataEntity.
  Cross-link: invariant:get-highlighted-result-formatted-sql-injection
  is the TRUE SQL-injection vector compounding the bearer-token reach
  on the highlight path; invariant:has-next-true-contract-bug-pagination-loop
  is the Category B drift on getSearchResults that produces
  pagination-loop for third-party API consumers.

  ## STRENGTHENED batch ZI (2026-05-26) — UI-route surface + Category F drift

  Batch ZI adds the OPERATOR-FACING SURFACE — the `searchRoutes.ts`
  module that declares the URL form `/search/{searchId}` and exposes
  `useSearchRouteParams()` to consumers. Key additions:

    (a) The URL form is `/search/{searchId}` where `searchId` is the
        server-side session UUID. The route module's
        `searchPath(searchId?)` builder produces `/search` (no-arg)
        or `/search/{uuid}` (with arg). Consumed by `App.tsx:61` (route
        mount), `Search.tsx:27` (param read), `useCreateSearch.ts:17`
        (post-create navigate target), `ToolbarTabs.tsx:38, 93` (top-
        nav tab link + active-tab matchPath).

    (b) **Category F drift at the URL-PARAM-NAME layer** (captured
        separately as
        `invariant:search-id-route-param-is-session-uuid-not-saved-search-category-f`):
        the URL param is named `searchId`, suggesting a saved-search
        / durable-handle semantic. The implementation binds to the
        server-side transient session row with no user binding, 30-day
        TTL, and mutated on every facet change. Three operator-visible
        consequences:
          - Bookmark fragility — `/search/{uuid}` 404s after 30-day TTL.
          - Cross-user link sharing exposes session state at fetch time
            (which may differ from when the link was sent).
          - Top-nav Catalog tab DROPS the session UUID (links to
            `searchPath()` no-arg → `/search`), creating a fresh
            session via `POST /api/search`. The previous session
            UUID becomes an orphan row.

    (c) **Naming triplet drift**: tab label `t('Catalog')` ↔ URL
        `/search` ↔ doc feature label "Search and Filtering". Three
        different strings for the same feature; operators searching
        the codebase for "Catalog" find nothing.

    (d) **`/search/*` wildcard accepts garbage** (captured separately
        as `invariant:search-route-wildcard-accepts-garbage-no-uuid-validation`):
        any string in the `:searchId` segment routes to `<Search/>`;
        garbage UUIDs produce empty Catalog rendering indistinguishable
        from "no matches".

  The UI-route layer is the FIRST encounter point with the bearer-
  token semantic — operators see the URL bar with the UUID before
  they see the API; the drift presents at the URL layer first.
axes_present:
  - controllers
  - ui_routes
