name: Render AppErrorPage (controlled per-page error display)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW OPERATION, batch ZJ (2026-05-26) — the project-wide convention
  for surfacing a page-level fetch error to the user: each data-
  loading page component wires `<AppErrorPage>` as a sibling
  inside its render, conditional on the relevant async-thunk-
  rejection state from the redux `loader` slice.

  **Operation shape**:

    - **Caller**: a page-level data-loading component (e.g.
      `DataEntityDetails`, `TermDetails`, `Search/Results`,
      `AlertsList`, ...)
    - **Input**: `(showError: boolean, error?: ErrorState,
      offsetTop?: number)`. The boolean comes from the
      caller's `getXxxFetchingStatuses` selector
      (`isXxxNotFetched`); the error comes from
      `getXxxFetchingError` selector.
    - **Output**: page-level full-viewport-height error pane
      (`<Grid>` with status code + statusText + Home Page link)
      OR `null` when `showError=false`.
    - **Side effects**: NONE. The operation is pure render.

  **23 caller files apply the operation consistently** with the
  pattern `<AppErrorPage showError={isXxxNotFetched}
  error={xxxFetchingError} />`. Six callers also pass
  non-default `offsetTop` (Search=210, OwnerAssociations*=182,
  IntegrationPreviewList=120) to clear a sticky header.

  **The operation IS the project's standard error-surface
  convention for large entity loads** — paired with the
  `switchOffErrorMessage: true` flag in the 10 affected thunk
  files (per the `app-error-page-as-error-render-surface-
  suppressed-toasts` invariant). The flag tells
  `handleResponseAsyncThunk` to skip the toast on error;
  `<AppErrorPage>` replaces the toast as the visible signal.

  **The information-disclosure boundary is load-bearing** —
  the operation surfaces only `error.status` and
  `error.statusText`. The `error.url` and `error.message` fields
  are accepted by the type system but never rendered (per the
  `app-error-page-controlled-render-helper-not-error-boundary`
  entity). A future improvement adding url or message rendering
  would invert the boundary and silently leak backend response
  bodies.

  **The operation does NOT cover routing-layer fall-through** —
  bare URLs that don't match any explicit Route, synchronous JS
  render errors, and lazy chunk-load failures all produce blank
  pages instead of this operation's pane (per the
  `no-react-error-boundary-no-catch-all-route-blank-page-root-
  cause` invariant). The operation's scope is intentional —
  per-page-component-owned — but the architectural absence of
  global coverage means 4 failure-mode classes are not handled
  by anything.

  **Stateless and idempotent** — same props produce same DOM.
  Mount/unmount is fast. Performance is negligible.
