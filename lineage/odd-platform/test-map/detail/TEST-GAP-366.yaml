behaviour: 'AlertManager webhook idempotency gap — `handleExternalAlerts` (lines 151-191)
  bypasses `AlertActionResolver` (which the in-platform ingestion path uses) and forwards
  directly to `createAlerts` (line 190), a bulk INSERT with no ON CONFLICT (per batch-H
  ReactiveAlertRepositoryImpl sidecar). Two POSTs of the same AlertManager payload (e.g.
  Prometheus retry on transient network error) produce two duplicate ALERT rows. The
  applyAlertActions path de-duplicates via the resolver; handleExternalAlerts deliberately
  skips it. No test asserts row count = 1 after a duplicate POST.'
test_class: missing-edge-case
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/AlertManagerWebhookIdempotencyTest.java
  name: handleExternalAlerts_duplicatePayload_createsTwoRowsButShouldCreateOne
evidence:
- 'AlertServiceImpl.md says: ''Two POSTs of the same AlertManager payload (e.g. Prometheus
  retry on transient network error) produce two duplicate ALERT rows because `handleExternalAlerts`
  does not de-duplicate'''
- 'AlertServiceImpl.java:154-191 — handleExternalAlerts body — no `AlertActionResolver`
  use, no `getOpenAlertsForEntities` snapshot, no de-dup'
- cross-reference batch-H bugs_limitations_corner_cases[2] (`createAlerts` issues INSERT
