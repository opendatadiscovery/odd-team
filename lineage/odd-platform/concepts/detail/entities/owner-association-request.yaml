name: |-
  Owner Association Request (User-to-Owner binding workflow with dedicated audit table — F-011 anchor)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-08
  - P-09
description: |-
  First-class concept for the user-to-Owner binding workflow — the mechanism
  by which an authenticated platform user (identified by oidc-username +
  provider) becomes associated with a catalog-side Owner directory entry so
  that owner-scoped behaviours (My Objects, owner-filtered alerts, ownership
  badges) can resolve. Implements F-011 Principal-to-Owner Resolution as the
  USER-FACING half (the in-service authIdentityProvider.fetchAssociatedOwner
  resolution is the consumer half).

  PRIMARY-SOURCE ANCHOR — file:line citations from
  OwnerAssociationRequestController batch V:

    Controller surface — 7 endpoints across two URL spaces:
      Self-association flow (/api/owner_association_request*):
        POST /api/owner_association_request (create-self-association-request)
        GET /api/owner_association_request (list-pending-requests)
        PUT /api/owner_association_request/{id} (approve-or-decline-request)
        GET /api/owner_association_request/activity (list-request-activity)
      Manual / direct mapping flow (/api/owners/mapping*):
        POST /api/owners/mapping (create-manual-user-owner-mapping)
        DELETE /api/owners/mapping/{owner_id} (delete-active-user-owner-mapping)
      Discovery (/api/owners/providers):
        GET /api/owners/providers (discover-auth-providers)

    Two parallel control planes — SELF-service vs ADMIN-manual:
      SELF plane — user submits a request (POST /api/owner_association_request);
        Admin approves or declines (PUT /api/owner_association_request/{id}).
        The Admin gate is OWNER_ASSOCIATION_MANAGE.
      MANUAL plane — Admin directly creates a USER_OWNER_MAPPING bypassing
        the request workflow (POST /api/owners/mapping). Gate is
        OWNER_RELATION_MANAGE.

    Dedicated audit table — owner_association_request_activity
      (V0_0_51__add_owner_association_request.sql) with 5 typed event values
      (OwnerAssociationRequestActivityType.java:3-8):
        REQUEST_CREATED — user submits a self-request
        REQUEST_DECLINED — Admin declines a pending self-request
        REQUEST_APPROVED — Admin approves a pending self-request
        REQUEST_MANUALLY_APPROVED — Admin direct-creates a mapping
        REQUEST_MANUALLY_DECLINED — Admin manually revokes a mapping

    Schema — V0_0_51__add_owner_association_request.sql:
      owner_association_request: id, oidc_username, provider, owner_id (FK
        to owner with NO ON DELETE clause — per REFACTOR-427), status,
        status_updated_at, status_updated_by_user_id, created_at
      owner_association_request_activity: id, request_id, event_type
        (one of 5), event_user_id, event_at + indices

    Authorization wiring (SecurityConstants.java:148-162):
      LIST / APPROVE / DECLINE: OWNER_ASSOCIATION_MANAGE
      MANUAL-MAP / MANUAL-REVOKE: OWNER_RELATION_MANAGE
      ABSENT for: POST self-request, GET providers, GET activity-list
      (three ungated endpoints — separate batch V invariant)

  CROSS-PILLAR RELATIONSHIPS:

    feeds: [P-09]  # produces USER_OWNER_MAPPING rows that F-011 consumes
    feeds_from: [P-09]  # consumes OWNER_ASSOCIATION_MANAGE / _RELATION_MANAGE
      permissions
    shares_data_with: [P-08]  # Management UI surface

  RELATED FEATURES (per F-011 + F-019 + F-006 connections):
    F-011 Principal-to-Owner Resolution — THIS controller IS the producer
      of the USER_OWNER_MAPPING rows
    F-019 Owner Lifecycle Management — REFACTOR-427 orphan rows on Owner
      delete; the FK has NO ON DELETE
    F-006 RBAC + audit-silence — THIS controller is the POSITIVE half of
      the 2-tier audit story (HAS a dedicated audit table; the parallel
      RBAC mutations DO NOT)

  AUDIENCES:
    odd-platform-ui-end-user (the SELF-request creator)
    platform-operator (the Admin who approves / manages / manually-binds
      via the Management → Associations + Owners tabs)
    odd-api-consumer (programmatic clients)
