proposed_action: |-
  Add `DataModellingBareRouteRedirect.test.tsx`:

  (a) `visitingBareDataModelling_redirectsToQueryExamples_pinsCanonicalFirstTab`: drive `<App>` in a MemoryRouter at `/data-modelling`; assert the rendered route resolves to `/data-modelling/query-examples` (the `<Navigate>` element fires); assert `<QueryExamples>` mounts. Pins (a) the redirect HAPPENS and (b) the target is `query-examples` (not `relationships`).

  (b) `visitingBareDataModellingRelationships_doesNotRedirect_pinsExistingNonBaseRoutes`: assert `/data-modelling/relationships` mounts `<Relationships>` directly (no redirect); pins the contrast.

  Add a comment at DataModellingRoutes.tsx:16 documenting: 'INTENTIONAL: bare /data-modelling redirects to /data-modelling/query-examples (the canonical first tab, per the ToolbarTabs.tsx:52 deep-link). If you want to make Relationships the canonical landing, update this Navigate AND the toolbar deep-link AND TEST-GAP-1004 + DataModellingTabs.tsx tab order. See TEST-GAP-998 + TEST-GAP-999 for the sister blank-page anti-patterns at /terms + /master-data.'
