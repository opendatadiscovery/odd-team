name: Dataset Test Report (count-per-status aggregate)
canonical_in_docs: false
canonical_candidate: true
description: |-
  Per-dataset aggregate of test-result counts grouped by status — surfaces on
  the Test reports tab as a six-bucket distribution (success / failed / aborted
  / skipped / broken / unknown totals). NEW entity, batch 2026-05-20T
  (DataQualityController class sidecar).

  Reached via GET /api/datasets/{data_entity_id}/test_report
  (DataQualityController.java:33-39) → DataQualityServiceImpl.getDatasetTestReport
  → ReactiveDataQualityRepositoryImpl.getDatasetTestReport (lines 62-84).
  The SQL is a single GROUP BY on DATA_ENTITY_TASK_LAST_RUN.STATUS scoped by
  the dataset's test ODDRNs; result cardinality is at most 6 rows (one per
  status enum value).

  Distinct from DataSetSLAReport: the test report exposes RAW counts per status;
  the SLA report exposes WEIGHTED counts per severity bucket. Both are read
  surfaces with no mutation; both are unscoped by owner.

  vocabulary_status: codebase-anchored, doc-side-partially-covered (live
  https://docs.opendatadiscovery.org/features/data-quality/test-results-import
  mentions 'Test outcomes surface on the dataset's detail page Test reports tab'
  but does NOT name 'Dataset Test Report' as a canonical term; the API contract
  carries the DataSetTestReport schema at components.yaml:1177-1203).
vocabulary_status: codebase-anchored, doc-side-partially-covered
axes_present:
- controllers
nodes:
- odd-platform java DataQualityController controller-class:DataQualityController
