proposed_action: |-
  **Vitest dispatcher contract tests** (3 tests across entity classes):

  1. `renderLineage_entityIsMicroservice_routesToHierarchyLineage_pinsNoMicroserviceBranch` — mount Lineage with `entityClasses=[MICROSERVICE]`, assert HierarchyLineage mounts (NOT a hypothetical MicroserviceLineage). PINS the no-special-branch contract.

  2. `renderLineage_entityIsTransformer_routesToHierarchyLineage_pinsSameSubtreeAsMicroservices` — mount with TRANSFORMER class, assert same subtree.

  3. `renderLineage_entityIsDataset_routesToHierarchyLineage_pinsSameSubtreeAsMicroservices` — mount with DATASET class, assert same subtree.

  **Doc-side coordination**: Update `docs/features/data-lineage.md` to explicitly state that microservices share the HierarchyLineage subtree. Remove the implication of a distinct "microservices view" component.

  **Architectural fix dependency**: If the maintainer decides microservices DESERVE a distinct UI (e.g. to render trace timing), add a third branch to Lineage.tsx: `isMicroservice ? <MicroserviceLineage /> : isDEG ? <DEGLineage /> : <HierarchyLineage />`. The test then flips assertion direction.

  Coherence note (LSN-018 Rule 6): STRENGTHENS Lineage.md:docs_link_semantic.doc_drift_findings.[1] by establishing the missing branch as a tested contract. NO contradiction with existing artefacts.
