expected_outcome: |
  Stress question (Category D — auth gates at the IngestionController class level):
  Verify the 4-mode auth disjointness across the 5 ingestion endpoints.

  Specifically: under LOGIN_FORM auth mode, the configured permittedPaths
  array contains ONLY `/ingestion/entities` + `/ingestion/datasources`
  (LoginFormSecurityConfiguration.java:49-51). The other 3 nested ingestion
  paths — `/ingestion/entities/datasets/stats`, `/ingestion/metrics`,
  `/ingestion/dataentitygroups/{deg_oddrn}/entities` — should fall through
  to `pathMatchers("/**").authenticated()` (line 57) and thus REQUIRE
  LOGIN_FORM authentication.

  Under OAUTH2 / LDAP, the AuthorizationCustomizer uses
  SecurityConstants.WHITELIST_PATHS which contains `/ingestion/**`
  (SecurityConstants.java:96) — so ALL ingestion paths are permitAll,
  INCLUDING the 3 nested ones.

  Hypothesis: under LOGIN_FORM, an unauthenticated POST to
  `/ingestion/entities/datasets/stats` returns 401 (or redirect to /login);
  under OAUTH2 the same call returns 201 Created (no auth required).
  If confirmed, the 4-mode disjointness is asymmetric — LOGIN_FORM is
  STRICTER than OAUTH2/LDAP for 3 of the 5 ingestion endpoints,
  documenting the inconsistency in the platform's path-permit posture.

  Failure mode (LOGIN_FORM behaviour matches OAUTH2): the LoginForm
  permittedPaths array silently treats `/ingestion/*` as a prefix even
  though the array contains literal exact-match strings — would indicate
  a Spring Security path-matcher semantic the maintainer was unaware of.

  Success (LOGIN_FORM is stricter): confirms the audit finding that
  the 4 auth-mode behaviours are NOT uniform on this controller's
  surface and that operators picking LOGIN_FORM get incidentally
  better ingestion protection than operators picking OAUTH2/LDAP —
  an architectural inconsistency worth surfacing in DOC/REFACTOR backlog.
