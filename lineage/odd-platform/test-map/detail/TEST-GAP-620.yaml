proposed_action: |-
  Add `DataSourceIngestionServiceMergeSemanticsTest` with three test methods: (1) re-register existing datasource with modified connection_url, type, active, namespace_name — assert ONLY name + description changed; (2) re-register with payload-side namespace_name set to a different namespace — assert namespace_id remains the COLLECTOR's namespace (collector wins); (3) UI-side rename then collector re-registration — assert the collector's name wins. Pins the current partial-merge contract; future enhancement that propagates connection_url breaks the test, forcing explicit re-authoring.
