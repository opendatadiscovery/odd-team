  related_concepts: ["data-entity-status", "housekeeping-ttl-retention", "soft-delete-is-the-platforms-deletion-model"]
  upstream_issues: [PLT-027]   # Thread C (per-tick batch cap) — this probe measures whether the cap is needed at 5K
  retrospectives: []
