behaviour: |-
  **`platform_url` substitution in wizard code-snippets is untested across the
  full boundary range — default-placeholder, configured-public, configured-internal,
  empty-string-override.** StaticArgumentMappingContext.java:16's @Value(
  "${odd.platform-base-url:http://your.odd.platform}") resolves to the literal
  placeholder under default config (application.yml:209 is commented out);
  IntegrationMapper.java:38-45 substitutes the resolved value into every
  code-snippet argument with parameter="platform_url" and static: true. Boundary
  shapes: (a) default deployment → wizard snippets carry literal
  http://your.odd.platform; operators copy-paste a placeholder URL into their
  collector config and the collector points at a non-existent host; (b)
  operator-configured public URL → correct copy-paste target; (c) internal
  hostname (typical for the notification/slack/k8s service-discovery pattern)
  → internal URL leaks via /api/integrations under DISABLED's anonymous
  reachability (TEST-GAP-941 composition); (d) empty-string override
  (ODD_PLATFORM_BASE_URL=) → snippets carry http:// → broken copy-paste.
  No validation guard (no @URL, no scheme check) — operator typos pass
  through verbatim.
