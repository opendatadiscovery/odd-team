expected_outcome: |
  Stress question for TermController#createTermTagsRelations,
  Category E (resource boundaries — concurrency).

  TagServiceImpl.getOrCreateTagsByName:80-86 -> divideTagsByExistence
  :144-159 is a read-then-write: it first SELECTs existing tags by name
  (ReactiveTagRepositoryImpl.listByNames:120-125, soft-delete-filtered),
  then bulkCreates the names not found. There is NO ON CONFLICT clause
  on the directory INSERT (ReactiveAbstractCRUDRepository.bulkCreate
  :114-126 -> insertManyReturning, a plain INSERT). The `tag` table
  carries a partial unique index on (name) WHERE the row is not
  soft-deleted.

  Hypothesis: two concurrent PUT /api/terms/{a}/tags and
  PUT /api/terms/{b}/tags requests that each submit the SAME
  never-before-seen tag name both pass listByNames ("not present"),
  both call bulkCreate, and exactly ONE INSERT wins on the unique
  index — the loser receives a database integrity-constraint
  violation surfaced as a 4xx error response to the caller. The
  term-tag path has NO retry: the operator-visible result is a failed
  PUT for a tag name that, by the time they retry, already exists.

  NOTE: this contrasts with the term-tag RELATION insert
  (createTermRelations, ReactiveTagRepositoryImpl.java:326-347) which
  DOES use .onDuplicateKeyIgnore() — so the tag_to_term primary-key
  collision is silent; only the global `tag` DIRECTORY insert races.
