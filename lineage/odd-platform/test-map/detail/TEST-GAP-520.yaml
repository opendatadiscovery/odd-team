behaviour: |-
  to_tsquery operator-injection DoS regression-pin — SECOND INVOCATION SITE (HIGH — cross-pillar P-01+P-09; STRENGTHENS TEST-GAP-250 at the facet endpoint surface). `JooqFTSHelper.tsQuery` (`JooqFTSHelper.java:164-168`) does `Arrays.stream(plainQuery.split(" ")).map(q -> q + ":*").collect(Collectors.joining("&"))` — every word becomes a `prefix-match` token AND-joined. But if the persisted `query_string` contains characters that to_tsquery treats as syntax (`!`, `(`, `)`, `:`, `<->`, `&`, `|`, `'`, `\\`), they are NOT escaped before reaching the parser. A caller who POSTs a search with `query = 'foo ) | (bar'` PERSISTS that string in `search_facets.query_string`. Every subsequent facet aggregator that joins to SEARCH_ENTRYPOINT (entity-class facet at line 182, type facet at 267, owner facet at 469, tag facet at 582 — ALL FOUR call `ftsCondition(SEARCH_ENTRYPOINT.SEARCH_VECTOR, state.getQuery())`) will fail at SQL-parse time with a Postgres `syntax error in tsquery`, **breaking the session permanently** — the row is reachable but every facet read 500s. The injection is bounded by Postgres tsquery semantics (the parser does not eval SQL — it raises `42601`), but it IS a denial-of-service surface AND it is the SAME code path that batch H flagged on `getHighlightedResult`. The facet endpoints are an ADDITIONAL invocation site for the same bug — meaning: (a) the same input attack reaches FOUR different facet aggregators in this controller surface alone, (b) every UI re-mount on a tampered session re-triggers the 500, (c) combined with TEST-GAP-519 (cross-user session hijack) an attacker can permanently poison another user's session with a single PUT. Cross-link batch H finding on `getHighlightedResult` (TEST-GAP-250 — same code path); this finding STRENGTHENS the existing TEST-GAP-250 with a second/third/fourth invocation site at the facet endpoints.
