proposed_action: |-
  Add `IngestMetricsPIILabelPropagationVerbatimRegressionPinTest`. Two variants:

  **Variant A (INTERNAL_POSTGRES)**:
  1. Setup: ODD platform, Testcontainers Postgres.
  2. POST metric for an entity with labels `{user_email: "joe@example.com", api_key: "sk-...", normal_label: "x"}`.
  3. Assert 201.
  4. `SELECT name, value FROM metric_label_value WHERE name IN ('user_email', 'api_key', 'normal_label')` returns 3 rows with values verbatim — NO sanitisation, NO redaction.
  5. `GET /api/dataentities/{id}/metrics` as ANY authenticated user — assert the response carries the PII verbatim.

  **Variant B (PROMETHEUS)**:
  1. Setup: ODD configured `metrics.storage=PROMETHEUS`, Prometheus testcontainer.
  2. POST same metric.
  3. Query Prometheus `/api/v1/query` directly for the metric — assert labels are present.

  Pair with REFACTOR-NNN and DOC-GAP-NNN.

  Coherence note (LSN-018 Rule 6): NET-NEW. STRENGTHENS the CounterTimeSeriesExtractor sidecar's `known_security_gaps.[1]` by adding the controller-layer dimension (the verbatim pass-through starts at the controller; the extractor is a downstream confirmation). Sister to TEST-GAP-823/824/825 — together the four entries cover the ingestMetrics security surface: reach + isolation + DoS + PII.
