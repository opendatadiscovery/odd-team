behaviour: |-
  **RACE-WINDOW BETWEEN CASCADE-CHECK AND SOFT-DELETE — orphan OWNERSHIP rows possible.** The three `existsBy*` reads (OwnerServiceImpl.java:90-91) and the `ownerRepository.delete` (line 98) run inside one @ReactiveTransactional boundary (line 88) — BUT the reads do NOT acquire row-level locks (no `SELECT FOR UPDATE`, no Postgres advisory lock on `owner_id`). Under `READ COMMITTED` isolation (Spring/R2DBC default — `READ COMMITTED` does not serialize the read against concurrent writes on the same key), a concurrent `POST /api/dataentities/{id}/ownership` (creating an OWNERSHIP row for this owner) racing with `DELETE /api/owners/{owner_id}` is theoretically able to slip a fresh OWNERSHIP row past the existence check. Result: an OWNERSHIP row pointing to a soft-deleted OWNER. **MIRRORS F-006 batch I `cascade_check_non_atomic` facet (PolicyServiceImpl.delete + role_to_policy)** — same shape, different table. The race window is bounded by the transaction's isolation level but is NOT zero. NO test exercises the concurrent-write race. A regression that flips the @ReactiveTransactional annotation or changes isolation level would silently widen the window with the build green. The race-window severity is LOW in practice (concurrent admin-time operations are rare) but the structural concern is correctness — a successful exploit produces an orphan OWNERSHIP row pointing to a soft-deleted owner; the data entity continues to surface ownership info (including the deleted owner's name and roles) until the ownership row is independently cleaned. The data-exposure consequence escalates severity to HIGH (the post-attack state surfaces info to authenticated users via the entity's owner-list).
