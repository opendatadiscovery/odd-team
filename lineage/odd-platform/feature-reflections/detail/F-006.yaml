- id: H-010
  hypothesis: |
    The `Administrator` / `User` predefined-name protection behaves consistently
    regardless of the casing an operator types — the platform treats `administrator`
    and `Administrator` as the same reserved name.
  derivation: |
    Negative-space — predefined-name protection is a security guard; a senior
    engineer expects case-insensitive matching for a reserved identifier (operators
    typo casing constantly). Inconsistent casing across CRUD verbs is a classic
    guard-bypass shape.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
