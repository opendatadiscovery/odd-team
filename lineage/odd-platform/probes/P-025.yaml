expected_outcome: |
  Stress question (Category B / Category E — updateTag search-vector
  propagation): TagServiceImpl.update calls updateSearchVectors
  (TagServiceImpl.java:53,161-167), which runs three concurrent FTS-upsert
  queries. The first, ReactiveSearchEntrypointRepositoryImpl.updateChangedTagVectors
  (ReactiveSearchEntrypointRepositoryImpl.java:319-341), JOINs
  TAG -> TAG_TO_DATA_ENTITY -> DATA_ENTITY and writes SEARCH_ENTRYPOINT.TAG_VECTOR
  per data entity carrying the tag. STATIC TRACE CONCLUSION: renaming a tag
  via PUT /api/tags/{id} DOES propagate the new tag name into the
  search_entrypoint.tag_vector of every data entity carrying that tag, so a
  full-text search for the NEW name should return those entities, and a
  search for the OLD name should NOT.

  This probe pins that conclusion in CI. The two hypotheses it tests:
  (H1) after a rename, GET /api/search... for the NEW tag name returns the
       data entities carrying the tag (search vector refreshed);
  (H2) after a rename, search for the OLD tag name no longer returns those
       entities (the old token was overwritten, not appended).

  Secondary question (out of static scope): whether updateChangedTagVectors
  is a full overwrite of TAG_VECTOR or an append — buildVectorUpsert is
  called with the `true` flag at ReactiveSearchEntrypointRepositoryImpl.java:338
  (argument name not resolved in this sidecar's 1-hop budget). If H2 FAILS
  (old name still searchable), the upsert appends rather than replaces, and
  a tag rename leaves stale search tokens — an operator-visible drift.
