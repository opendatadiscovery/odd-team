control_summary: |-
  0 of 4 cells PROBED — feature MINTED this batch (V) from
  QueryExampleController class sidecar primary-source. THIRTEEN drift
  facets anchored on three load-bearing themes: (a) RBAC split + 10
  ungated endpoints + audit silence — the operator-facing posture of
  the Query Examples surface; (b) F-004 XSS class extension to the 4th
  surface — verbatim Markdown storage + MDEditor.Markdown render; (c)
  cosmetic + UX defects — spec/code response-code drift, broken
  pagination, plural operationId typo, hard/soft-delete asymmetry,
  stale FTS entrypoint row.

  The HIGHEST-LEVERAGE probe candidates are:
  (a) **F-004 4th-surface XSS regression-pin** — POST /api/queryexample
      with `definition` and `query` containing
      `<img src=x onerror=alert(1)>` + GET /api/queryexample/{id} +
      assert verbatim storage + render the QueryExampleDetailsContainer
      page + assert the MDEditor.Markdown pipeline behaviour (the
      partial-mitigation envelope from F-004 slice 5/6 applies). Local
      docker-compose probe stack with a seeded Query Example.
  (b) **Audit-silence regression-pin** — exercise all four mutation
      verbs (create + update + delete + dataset-link via
      DataEntityController + term-link via TermController) + GET
      /api/activity + assert ZERO QUERY_EXAMPLE_* events. Pin the
      current audit-silence contract so a refactor adding @ActivityLog
      doesn't silently break audit-export compatibility.
  (c) **Search-session UUID hijack regression-pin** — user A creates
      session, copies URL, user B mutates facets — assert behaviour
      (likely succeeds today; pin).

  Local docker-compose probe stack is sufficient: ODD platform +
  Postgres + two seeded Owners + an authenticated user. No external
  auth required.

  Cross-feature coherence: this feature LIVES INSIDE pillar P-02 Data
  Modelling (the FIRST P-02 anchored feature in the registry; the
  pillar's sub-feature seed at system-mission.md:118-119 names it).
  The P-02:F-001 anchor is the canonical home; sibling P-02:F-002
  Relationships and ERDs is the second pillar feature awaiting
  enrichment. Cross-link partners: F-004 (XSS family — 4th surface),
  F-002 (term-side reverse-lookup), F-014 / F-015 / F-017
  (read-collaborative posture family).
