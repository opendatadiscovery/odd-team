name: LSN-017 Cross-Layer Bug Pattern — Canonical Vocabulary Extension
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: |-
  **NEW CANONICALISATION CANDIDATE, batch 2026-05-19J — vocabulary extension
  proposal**. LSN-017 (`retrospectives/LSN-017-per-node-scan-cannot-see-cross-layer-user-effects.md`)
  names a class of bug whose cause and observable effect live in different
  layers — UI dep-array (cause) + backend read-as-write UPDATE (observable). **No
  per-layer scan (UI-only or backend-only) catches the doubling**; only the
  empirical signal (probe P-004) is reliable. **The class is broader than just
  view_count**: any feature where (a) a UI state is populated by a fetched
  response, AND (b) the state is itself a dep-array entry of the effect that
  fired the fetch, will exhibit the same self-feeding refire. Other latent
  cross-layer-bug instances surfaced by batch J: (a) DataEntityDetails second
  useEffect's 4 dispatches all key on dataEntityId alone (NO bug) — but a future
  change adding a response-derived value would replicate LSN-017's pattern;
  (b) the LineageGraph component's HierarchyLineage.tsx:44-67 useEffect with
  dep-array `[d, dataEntityId]` does NOT contain a response-derived value — but
  if a future change added one, the cross-layer doubling would manifest there
  too. **The pattern is worth naming canonically**: in the workspace's
  retrospectives (LSN-NNN), the class needs a name beyond "LSN-017 specifically";
  call it "self-feeding effect with response-derived dep-array" or
  "cross-layer-cause-effect-bug". **Detection mechanism**: probes that observe
  both the UI behaviour (xhr count) AND the backend observable (DB delta) within
  a single regex-filtered scope; no per-layer test catches this. **The catalog
  would benefit from a canonical entry for this pattern** so that future per-file
  sidecars can flag it explicitly when authoring their dep-array invariants.
contributing_concepts:
- lsn-017-self-feeding-double-fetch-dep-array-cross-layer-bug
- view-count-update-read-loop-closed-trivially-inflatable-no-anti-abuse-signal
- f-001-ui-loop-closure-popular-tile-click-feeds-view-count-increment
suggested_canonical_choice: |-
  Add a new entry in `docs/main-concepts.md` under a "Cross-cutting concerns"
  section: "Cross-layer cause-effect bug — a bug whose root cause and observable
  effect live in different architectural layers (e.g. UI state populated by a
  fetched response feeding the dep-array of the effect that fires the fetch).
  No per-layer scan catches the bug; only empirical observation across layers
  detects it. Canonical example: LSN-017 (DataEntityDetails dep-array doubling
  view_count UPDATE)."
suggested_add_to_docs: true
rationale: |-
  The cross-layer-bug pattern is a deliberate workspace-methodology finding —
  the LSN-017 retro title explicitly names it. The catalog should expose the
  class as a canonical entry so future reducers (file-analyser, feature-flow-builder)
  can detect candidates structurally.

  Maintainer should decide: extend main-concepts.md with a "Cross-cutting concerns"
  section explicitly naming this class? Or keep the class as retrospective-only
  knowledge? The latter is the current state; surfacing as a canonical concept
  would let the workspace pre-emptively flag candidates.
