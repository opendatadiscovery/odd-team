observed_vs_expected:
  facets:
    - facet_id: parallel_but_distinct_compact_full_implementations_one_label_two_semantics
      drift_class: parallel_ui_surfaces_with_drift_one_user_label_two_behaviours
      severity: MEDIUM
      observed: |-
        Both subtrees expose Compact/Full as AppTabs control. The DEG
        branch (DEGLineageControls.tsx:42-48 + DEGLineageLayouter.tsx:39-56)
        triggers re-layout via `setIsLayouted(false)`; the Hierarchy
        branch (LineageControls.tsx:50-54) only re-renders. An operator
        switching mode on a DEG canvas sees a loading spinner + re-layout
        animation; switching on a Hierarchy canvas sees an instant node
        shape change with no layout migration. Same control, two
        observable experiences.
      expected: |-
        Either (a) both branches re-layout for Compact/Full so the user
        experience is uniform; OR (b) document the two semantics on
        the data-lineage feature page; OR (c) extract a shared
        `useViewMode()` hook that abstracts the re-layout-or-not
        decision behind a uniform API.
      evidence:
        - 'DEGLineageControls.tsx:21-27,42-48'
        - 'LineageControls.tsx:50-54,96-102'
        - 'DEGLineageLayouter.tsx:39-56'
        - 'LineageProvider.tsx:53-56'
      ui_unverified: false
    - facet_id: compact_mode_hides_deg_membership_entry_point_in_hierarchy_canvas
      drift_class: compact_mode_loses_navigational_affordance_undocumented
      severity: MEDIUM
      observed: |-
        Info.tsx:120-141 — the GroupedEntitiesListModal opener (the
        Items button + DEG-membership expansion modal) is gated by
        `full && externalName && nodesRelatedWithDEG?.length > 0`.
        Compact mode HIDES this entry point. An operator who switches
        to Compact for graph-overview readability LOSES the ability to
        click into a DEG-typed node and see its members — they must
        switch back to Full first. The doc does not flag this
        compromise.
      expected: |-
        Either (a) the Items button stays visible in Compact mode as a
        minimal icon; OR (b) the Compact mode help-tip documents the
        trade-off; OR (c) the click-through on the Compact node opens
        the same modal via a different entry point.
      evidence:
        - 'Info.tsx:46-56 (Compact + no externalName → No Information)'
        - 'Info.tsx:120-141 (DEG Items button gated by full=true)'
        - 'GroupedEntitiesListModal.tsx (DEG-membership expansion)'
      ui_unverified: false
    - facet_id: hierarchy_mode_switch_no_layout_migration_overlap_risk_on_dense_graphs
      drift_class: ui_layout_static_after_node_size_change_dense_graph_overlap
      severity: LOW
      observed: |-
        LineageControls.tsx:50-54 — handleViewChange ONLY sets the `full`
        query param. The d3-hierarchy + visx Tree layout was computed
        with the PREVIOUS nodeSize (LineageProvider.tsx:53-56 — nodeSize
        memo updates on `full`). Node positions (x/y) computed at the
        previous nodeSize are NOT recomputed after mode change — visx
        Tree layout is static. On dense lineage graphs (10+ siblings at
        one depth level), Compact-to-Full switch may visually overlap
        node rects because the layout still uses Compact-sized spacing.
      expected: |-
        Either (a) re-trigger the d3-hierarchy layout on `full` change
        via a dedicated effect; OR (b) cache the layout for both modes
        upfront on data load; OR (c) document the dense-graph overlap
        possibility.
      evidence:
        - 'LineageControls.tsx:50-54'
        - 'LineageProvider.tsx:53-56'
        - 'LineageGraph.tsx:38-44 (generateTree happens on data change, not full change)'
      ui_unverified: true
    - facet_id: deg_layouter_useLayoutEffect_empty_deps_array_LSN_017_shape
      drift_class: useLayoutEffect_deps_empty_array_brittle_to_future_drivers
      severity: LOW
      observed: |-
        DEGLineageLayouter.tsx:39-56 — useLayoutEffect's deps array is
        `[]` (line 56). The effect computes node sizes against current
        `nodes`/`edges` and the closure-captured `full`. It works today
        because the parent DEGLineage.tsx re-mounts the layouter when
        `setIsLayouted(false)` fires (DEGLineage.tsx:29-36 conditional).
        A future refactor that keeps the layouter mounted across mode
        switches would silently use stale closures for `full`/`nodes`/`edges`.
        LSN-017-family pattern.
      expected: |-
        Deps array should be `[nodes, edges, full]` — making the effect's
        contract explicit.
      evidence:
        - 'DEGLineageLayouter.tsx:39-56'
        - 'LSN-017 (dep-array missing dynamic value pattern)'
      ui_unverified: false
    - facet_id: lineage_provider_useMemo_omits_titleHeight_oddrnHeight_LSN_017_shape
      drift_class: useMemo_intermediate_outputs_not_propagated_to_consumer_value
      severity: LOW
      observed: |-
        LineageProvider.tsx:58-68 — `providerValue` useMemo includes
        `nodeSize` in the returned object but has deps `[full, fn, renderedLinks, highLightedLinks]`
        — MISSING `titleHeight`, `oddrnHeight` (and transitively `renderedNodes`).
        The `nodeSize` ref captured by closure at line 60 can update
        (driven by titleHeight/oddrnHeight changes via the line 53-56
        useMemo) WITHOUT propagating to providerValue's identity.
        Context consumers re-read the same `nodeSize` ref the next time
        providerValue actually re-evaluates — but during the staleness
        window they see the old ref. LSN-017-family pattern.
      expected: |-
        Deps array should include `nodeSize` (or all of its inputs:
        `titleHeight`, `oddrnHeight`) so the provider value identity
        updates in lockstep with the values inside.
      evidence:
        - 'LineageProvider.tsx:53-56 (nodeSize memo deps)'
        - 'LineageProvider.tsx:58-68 (providerValue memo deps — missing titleHeight + oddrnHeight)'
        - 'LSN-017 (dep-array stale closure pattern)'
      ui_unverified: false
