proposed_action: |-
  Add `IngestionNullEntityClassIdsCalculateDeltaCountNPERegressionPinTest`. Testcontainers integration test:

  1. **Setup**: Postgres testcontainer, ODD with default config, datasource D-A registered.
  2. **POST /ingestion/entities** with payload `{data_source_oddrn: D-A.oddrn, items: [{oddrn: "urn:nullclasses1", type: DATASET, entity_class_ids: null, ...}]}`.
  3. **Assert**:
     - HTTP 5xx.
     - Server log / response body contains NPE stack frame with `calculateDeltaValues` or `Arrays.stream`.
     - `SELECT count(*) FROM data_entity WHERE oddrn='urn:nullclasses1'` returns 0 (atomic rollback).
  4. **Sister extract-lineage variant**: payload with `dataTransformer.sourceList: null` → same NPE class at line 249.
  5. **Maintainer-choice gate**: when REFACTOR-NNN lands the fix, update this test to assert 200 + entity persisted (with the null-as-empty-list contract) OR 400 (with the null-forbidden contract).

  Coherence note (LSN-018 Rule 6): NET-NEW. Sister to TEST-GAP-832 (duplicate ODDRN). Both pin specific deterministic untested crashes inside `IngestionServiceImpl`. NO contradiction with F-008.
