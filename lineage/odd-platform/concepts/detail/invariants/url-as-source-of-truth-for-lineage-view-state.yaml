name: URL as Source of Truth for Lineage View State
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
- P-05
description: |-
  **NEW INVARIANT, batch 2026-05-19J**. The Lineage tab's view state — depth `d`,
  full-names toggle `fn`, view-mode `full`, expand-all-groups `eag`, transform
  matrix `t` (JSON-encoded pan/zoom state), and the four expansion-id arrays
  `exd` / `exu` / `exdg` / `exug` — ALL live in the URL query string
  (`LineageQueryParams` interface at `interfaces.ts:75-85`). Not in React state,
  not in localStorage, not in Redux UI-slice. The `useQueryParams` hook
  (`useQueryParams.ts:38-44`) reads `location.search` and falls back to
  `defaultLineageQuery` (`constants.ts:74-84`) — `d` defaults to **1** in the
  UI, which means the UI ALWAYS supplies a non-null `lineage_depth` to the API,
  masking the F-005 NPE caveat from the typical UI path. **Every control writes
  via `setQueryParams`**: LineageControls.tsx:33, 40, 47, 51; LoadMoreButton.tsx:59,
  64; ZoomableLineage.tsx:30. The pattern is consistent: every component
  participates in the same URL-bound state contract. The implicit ADR is
  **"lineage view is shareable via URL"** — a user can copy the URL and a
  colleague opens the exact same view (depth, expansions, pan/zoom). **Trade-off**:
  the URL bag carries the IDs of every node the user has LoadMore-expanded —
  a screenshot or shared URL leaks the IDs of every node the user has
  enumerated into a backend-readable cross-owner footprint. Under DISABLED-mode
  the URL is anonymously shareable; under LOGIN_FORM/OAUTH2/LDAP the recipient
  must be authenticated but the IDs themselves are accessible to any authenticated
  user (read-collaborative). **No UI clamp on URL parameter values**: a curious
  user editing `?d=10000` triggers the backend amplification surface
  (REFACTOR-202) from the URL — `useQueryParams.ts:36` uses `parseNumbers: true`
  which converts `?d=999999999` to `d: 999999999` without validation.
