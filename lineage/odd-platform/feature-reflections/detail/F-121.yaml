# Scheduled-Job Executor Architecture — product-owner reflection

## product_owner_narrative

This feature is not a screen — it is the **scheduled-job executor**: the boot-time wiring (`SchedulingConfiguration`, 26 lines) that turns on the platform's entire background-task subsystem with `@EnableScheduling` + `@EnableSchedulerLock(defaultLockAtMostFor="1h")` + a PostgreSQL-backed `LockProvider` bean, and the four `@Scheduled` jobs that run on top of it: housekeeping (`fixedRate=15min`), data-entity status-switch (`fixedRate=10min`), partition-creation (`cron 0 1 0 * * *`, daily 00:01), and session-housekeeping (`fixedRate=1h`) (per SchedulingConfiguration:12-26). The "user" here is the **platform-operator** audience of pillar P-08 — the engineer sizing a multi-replica Kubernetes deployment, setting Helm values, and reading `/actuator/prometheus`. Their "screen" is `application.yml`, the deployment manifest, and the metrics endpoint; there is no React surface to this feature, which is the correct and complete shape of an operational-infrastructure feature (see the validation_gap below — this is operator-facing, not GUI-facing).

The operator interacts with this feature in three ways. First, by **not touching it**: the executor ships with zero `spring.task.scheduling.*` keys and no `@Bean TaskScheduler`, so Spring Boot's default `ThreadPoolTaskScheduler` (`poolSize=1`) is the deployed reality and every background job runs on one thread (per SchedulingConfiguration invariants; `grep TaskScheduler` and `grep spring.task` against the repo both return zero matches, recorded in the sidecar). Second, by **scaling replicas**: ShedLock arbitrates a PostgreSQL `shedlock`-table row per `@SchedulerLock` name so only one replica runs each guarded job per window, using `.usingDbTime()` to neutralise clock skew between replicas (per SchedulingConfiguration:22 + implicit_adrs[0]). Third, by **tuning retention**: the `housekeeping.ttl.*` and `odd.activity.partition-period` keys govern WHAT the jobs delete/create — but those are F-010's and the Activity-Feed's boundary, not this feature's.

The working parts an operator would want explained: (a) three of the four jobs are ShedLock-guarded with explicit lock windows (housekeeping 14m/14m, status-switch 9m/9m, partition-creation 10m/10m); (b) the fourth — session-housekeeping — has `@Scheduled` but NO `@SchedulerLock`, so it runs on every replica every hour unguarded (per SchedulingConfiguration:34 + HousekeepingJobManager coupling); (c) the platform-level `@EnableSchedulerLock(defaultLockAtMostFor="1h")` is currently DEAD CODE — all three guarded jobs set their own `lockAtMostFor`, so the 1h default applies to zero methods today (per SchedulingConfiguration:43 + bugs_limitations_corner_cases[2]); (d) partition-creation runs not only on the nightly cron but ALSO at boot via `@PostConstruct` behind the leader-election advisory lock (`leaderElectionManager.acquire(activityLockId)`), confirmed by reading `partition/PostgreSQLPartitionCreationJob.java:29-51` and the ADR-0028 pin (`AdrPartitionLifecycleScanTest`) — this is the load-bearing fact that blunts the cron-misfire blast radius the feature-flow headline fears.

The integration story: this executor is the infrastructure beneath F-010 (Housekeeping TTL Enforcement — WHAT the 15-min cycle deletes), the Activity-Feed partition lifecycle (P-07, the daily partition CREATE that keeps `activity`/`message` INSERTs working), and the soft-delete model (ADR-0058 — the 10-min status-switch job advances `isSwitchable` entities to `DELETED`). A failure of the executor's scheduling guarantees is a silent failure of all three: housekeeping that quietly drifts off-cadence, a partition that is created late, a status-switch that is delayed (per cross_pillar_relationships P-07 on the feature-flow + ADR-0058 realises clause).

Edge cases an operator would hit in production and which the docs are silent on: a rolling deployment (`kubectl delete pod`) mid-housekeeping interrupts the in-flight jOOQ transaction (safe — it rolls back) but leaves the `shedlock` row held until `lockAtMostFor` (~14min) expires, so no replica runs housekeeping during that window (per SchedulingConfiguration bugs[3]); a heavy housekeeping backlog that overruns 14 minutes can release the lock before the transaction commits and let a second replica acquire at the 15-minute mark (per HousekeepingJobManager invariants — the 60-second slack); and the complete absence of any Micrometer surface means the operator answering "is replica B failing to acquire because replica A is holding?" has only raw SQL against the `shedlock` table (per SchedulingConfiguration bugs[5] + performance.known_performance_gaps[1]).

## hypotheses

- id: H-001
  hypothesis: "When an operator deploys the platform with the four background jobs and does not set any thread-pool configuration, the jobs run on independent threads so a long-running housekeeping cycle does NOT delay the status-switch or partition-creation jobs."
  derivation: "An operator's default mental model for 'four scheduled jobs' is parallelism; the executor architecture is the feature whose name promises a working scheduler. Tested against the absence of spring.task.scheduling.pool.size and any TaskScheduler bean."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      All four @Scheduled jobs share ONE thread. SchedulingConfiguration declares no
      `@Bean TaskScheduler`; application.yml ships zero `spring.task.scheduling.*` keys
      (both verified by grep in the sidecar). Spring Boot's `TaskSchedulerBuilder` therefore
      builds a `ThreadPoolTaskScheduler` with `poolSize=1`. The four jobs (housekeeping 15m,
      status-switch 10m, partition-creation daily, session-housekeeping 1h) execute serially:
      when two are due at the same instant, the second waits for the first to finish. A
      14-minute housekeeping cycle delays the 10-minute status-switch by up to 14 minutes;
      under a sustained backlog the status-switch cadence drifts from 10min toward 24min+.
    evidence:
      - sidecar: odd-platform__java__config__config-class__SchedulingConfiguration.md
        section: "concepts.invariants[0] + bugs_limitations_corner_cases[0] + stress_findings.tunables[ThreadPoolTaskScheduler.poolSize]"
        cite: "SchedulingConfiguration.java:12-26 (no @Bean TaskScheduler) + application.yml (zero spring.task.* keys)"
        note: "Single-thread default mechanically derived from absence-of-config; grep TaskScheduler + grep spring.task both return zero."
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: "performance.scaling_characteristics + bugs[3]"
        cite: "HousekeepingJobManager.java:25-26 (fixedRate=15m, lock 14m)"
        note: "The 14-min cycle is the concrete delayer of the 10-min status-switch on the shared thread."
    operator_visible_failure: |
      (1) Cadence drift: an operator who set status-switch to run every 10 minutes finds
      soft-deletes auto-advancing on a 14-24min cadence instead, because housekeeping holds
      the only thread. (2) The mitigation is one line — `spring.task.scheduling.pool.size: 4`
      — but it is documented NOWHERE (live-verified absent 2026-06-03), so an operator
      cannot discover it without reading Spring Boot internals. (3) No metric exposes the
      contention, so the drift is invisible until a downstream symptom (late partition,
      stale soft-delete) appears. The fix proposal is doc + a one-line YAML default, NOT a
      code redesign — hence routes to BOTH a caveat (document the default + the knob) and
      a bug-candidate for shipping the explicit pool size.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
