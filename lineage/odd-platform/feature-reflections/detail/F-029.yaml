        section: bugs_limitations_corner_cases[7]
        cite: "live api-reference WebFetched 2026-05-20 (9 sub-pages) + openapi.yaml:13-48 (35 tags)"
        note: "9 doc sub-pages vs 35 spec tags; 26 tags uncovered (DOC-GAP-009 family)."
      - sidecar: feature-reflector live cross-reference
