behaviour: |-
  **`DataSourceIngestionServiceImpl` HAS A DEFENSE-IN-DEPTH ODDRN VALIDATION AT THE SERVICE TIER (line 103) — the service does NOT trust the controller's validation.** `if (StringUtils.isEmpty(ds.getOddrn())) throw new BadUserRequestException("ODDRN must be filled for all data sources")`. The controller already validates non-empty ODDRN at `IngestionController.java:97-102` (per batch P sidecar); the service-tier check is REDUNDANT in the current invocation path. The deliberate choice is "the service guarantees its own preconditions" — a future refactor that moves the controller's validation downstream OR exposes the service to a DIFFERENT caller cannot bypass this check. The test pins the defense-in-depth pattern as the EXPECTED contract: any future caller that bypasses the controller's validation MUST still trigger this throw. Without a test, a maintainer "simplifying" the service by removing the redundant check could silently re-open the empty-ODDRN attack surface.
