behaviour: |-
  **MEDIUM — `customConnectionPool` is instantiated UNCONDITIONALLY at R2DBCConfiguration.java:54 — no `@ConditionalOnProperty` gate on `spring.custom-datasource.url`. Every ODD Platform deployment, including those that never use Lookup Tables, opens TWO R2DBC connection pools (each with `initialSize` connections from Spring Boot's default of ~10) — 20+ PG connection slots minimum per replica, regardless of feature usage.**

  Sidecar primary source:
  - R2DBCConfiguration.java:54 — `@Bean(name = "customConnectionPool", destroyMethod = "dispose")` with NO `@ConditionalOnProperty`.
  - Compared to other opt-in beans: `HousekeepingJobManager.java:18` (gated), `NotificationConfiguration.java:27` (gated by @ConditionalOnNotifications), `OAuthSecurityConfiguration.java:71` (gated by auth.type=OAUTH2).
  - When all three `spring.custom-datasource.*` keys are blank (the shipped default), the bean falls back to primary `DataSourceProperties` and opens a SECOND pool against the SAME database, only differing by the `?schema=lookup_tables_schema` URL query-param.

  **Operator-impact scenarios**:
  - Small dev deployment (1 replica, no Lookup Tables): 20 PG connection slots consumed (10 primary pool + 10 custom pool) for zero benefit.
  - Production deployment (5 replicas, Lookup Tables in active use): 100 PG connection slots consumed at default sizing — PG `max_connections` default is 100, so a 5-replica deployment with NO collectors / no operator tools at the edge.
  - K8s Resource sizing: operators sizing their PG backend based on the primary pool alone (the "one R2DBC pool per replica" mental model) under-provision; first symptom is PG `too many connections` errors during scale-out.

  **Test gap shape**:
  1. Default-config bean assertion — verify both `connectionPool` (primary, @Primary) AND `customConnectionPool` exist in the context.
  2. Connection-count assertion — verify the platform opens 2N connections to PG at startup (where N is the default pool initialSize).
  3. Conditional-creation pin (the FIX direction) — under a hypothetical future `@ConditionalOnProperty(name="custom-datasource.enabled", havingValue="true")` gate, verify the bean is ABSENT when the property is unset; this test would FAIL against the current code (the bean IS present); PINS the absence of the gate.

  After the fix lands (REFACTOR-NNN adding a feature-flag for custom-datasource), the test naturally inverts to verify gated creation.
