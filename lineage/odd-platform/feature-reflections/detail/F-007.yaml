- id: H-014
  hypothesis: "When two alerts share the same last_created_at, the global list orders them deterministically so infinite-scroll paging does not skip or duplicate a row at the page boundary."
  derivation: "Negative-space + response-shape: a paginated, infinite-scroll list needs a stable total order or boundary rows are skipped/duplicated; a senior PO expects deterministic ordering."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      The ordering is deterministic and total. createAlertJoinQuery declares
      List.of(OrderByField(ALERT.LAST_CREATED_AT, DESC), OrderByField(ALERT.ID, DESC)) and applies
      it to BOTH the inner paginate CTE and the outer select (ReactiveAlertRepositoryImpl.java:474-483,
      505). ALERT.ID is monotonic per insert, so ties on last_created_at break by id DESC — a stable
      total order. The UI receives the items as-is with no client re-sort (alerts.thunks.ts +
      alerts.slice.ts), so page boundaries are stable. (Caveat: a page=0 / negative-page request
      produces a negative OFFSET that Postgres rejects — a visible error, not a silent skip — and a
      page-1/page-2 race can briefly show a longer list before settling, but neither skips/duplicates
      the committed order.)
    evidence:
      - sidecar: odd-platform__ts__react-component__component__Alerts.md
        section: stress_findings.orderings
        cite: "ReactiveAlertRepositoryImpl.java:475-476"
        note: "(LAST_CREATED_AT DESC, ID DESC) applied to inner + outer select; stable total order"
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveAlertRepositoryImpl.md
        section: invariants (pagination via pageifyResult) + bugs_limitations_corner_cases (negative OFFSET)
        cite: "ReactiveAlertRepositoryImpl.java:147, 474-483"
        note: "deterministic order; negative-page is a visible error not a silent skip"
    confidence: HIGH
    # LSN-030 — THE FIX. v0.2.0 routed this to `none`; the deterministic-order proof had no guard.
    use_case_kind: render
    coverage: unverified
    coverage_evidence: |
      No test (unit, integration, or e2e) asserts the (LAST_CREATED_AT DESC, ID DESC) ordering on any
      of the three global tabs, nor the page-boundary stability under a tie. AlertIngestionTest does
      not page; AlertServiceImplTest does not touch listAll; there is no /alerts e2e.
    test_demand: functional
    test_demand_note: "missing-functional: a repository/integration test that inserts >page-size alerts with a tie on last_created_at and asserts the page-1/page-2 boundary neither skips nor duplicates the tied rows (the stable (last_created_at, id) total order). Guards against a future ORDER BY change dropping the id tiebreak."
    routes_to_finding: functional-test-demand

