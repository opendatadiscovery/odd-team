security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
    - S2S
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      PUT /api/datasources/{data_source_id} is path-gated by
      DATA_SOURCE_UPDATE (MANAGEMENT tier) at SecurityConstants.java:118-120.
      NO @PreAuthorize, NO programmatic check — the gate is 100%
      declarative, consistent with the platform's path-based RBAC
      pattern. The DISABLED-mode all-open behaviour is the known
      platform-wide bypass, not an endpoint-specific gap.
  owner_scoping:
    verdict: N/A
    detail: |-
      data_source rows are not owner-scoped; the endpoint updates by
      id with no current-user-owner predicate. DATA_SOURCE_UPDATE is
      a MANAGEMENT-tier permission, not entity-scoped — a holder can
      update ANY data source.
  strengths:
    - |-
      Clean 404 fail-fast on a missing/soft-deleted id — the endpoint
      never silently no-ops (the anti-silent-write guard; cf. the
      F-004 upsertDescription counter-case)
    - |-
      The whole update runs in one @ReactiveTransactional boundary —
      getDto + namespace get-or-create + UPDATE + 2 FTS writes commit
      or roll back together
  weaknesses:
    - |-
      DISABLED auth.type makes this destructive edit endpoint fully
      open — a misconfigured production deployment lets any caller
      rename/blank any data source (updateDataSource.md
      security.known_security_gaps — HIGH under DISABLED)
    - |-
      namespace_name get-or-create side-effect — an operator with
      DATA_SOURCE_UPDATE but NOT NAMESPACE_CREATE can create a
      namespace by editing a data source with an unknown
      namespace_name (LOW-MEDIUM; the cross-pillar getOrCreate
      side-door)
    - |-
      No Activity Event on the UPDATE — a malicious or mistaken edit
      (e.g. renaming a source to impersonate another) leaves no audit
      trail (MEDIUM)
  cross_file_inconsistencies: []
  contributing_files:
    - updateDataSource.md
  evidence:
    - updateDataSource.md:security.authorization_assertions
    - updateDataSource.md:security.known_security_gaps (DISABLED-open; namespace side-door; no Activity Event)
performance_aggregate:
  overall: HIGH
  hot_paths:
    - |-
      updateDataSource worst case 4 sequential DB calls inside the
      @ReactiveTransactional boundary — getDto (1 SELECT, 2 LEFT
      JOINs), namespaceService.getOrCreate (1 SELECT + conditional 1
      INSERT), the UPDATE, then 2 FTS vector writes. Not a
      high-frequency endpoint (operator-initiated edits) — updateDataSource.md
      performance.hot_paths
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single-row per request — no bulk-update surface on the UI side.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless handler — instances scale horizontally. No FOR UPDATE
      row lock in the UI update path (distinct from the ingestion
      path's getIdByOddrnForUpdate) — concurrent edits to the same id
      are last-writer-wins with NO conflict detection (a lost-update
      window; no optimistic-lock version column on data_source).
  strengths:
    - Reactive Mono — non-blocking; one R2DBC connection held for the @ReactiveTransactional duration
    - Small fixed-shape payload (3-field DTO + the DataSource response)
  weaknesses:
    - |-
      No optimistic-lock version column on data_source — concurrent
      operator edits silently lose the earlier write (a
      correctness-under-concurrency gap, not a throughput gap) —
      updateDataSource.md performance.known_performance_gaps LOW
  cross_file_inconsistencies: []
  contributing_files:
    - updateDataSource.md
  evidence:
    - updateDataSource.md:performance.hot_paths
    - updateDataSource.md:performance.scaling_characteristics + known_performance_gaps
notes: |-
  This operation closes the UI-admin DataSource write trio: the
  registry already carried register-data-source (POST) and
  regenerate-data-source-token (PUT .../token); update-data-source
  (PUT /api/datasources/{id}) was missing. The deleteDataSource
  operation is the fourth UI-admin write — captured at
  delete-data-source-ui-admin-guarded-soft-delete (NEW THIS BATCH).

  Cross-cutting connections:
    - Pairs with the dedicated invariant
      datasource-update-replace-not-merge-mapstruct-set-to-null
      (the REPLACE-not-MERGE operator hazard)
    - Pairs with datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation-batch-w
      (the architectural picture — UI update REPLACE vs S2S
      partial-merge)
    - Pairs with namespace-create-side-doors-cross-pillar-4-sister-services-batch-w-closure
      (DATA_SOURCE_UPDATE implicitly grants NAMESPACE_CREATE via
      DataSourceServiceImpl.update line 75)
    - Pairs with openapi-status-code-drift-batch-w-extension-to-7-controllers
      (PUT returns 200; openapi.yaml:482 declares 201)
    - Pairs with audit-log-presence-asymmetry-2-tier-audit-story
      (the UPDATE emits no Activity Event)
    - Pairs with register-data-source + regenerate-data-source-token
      + delete-data-source-ui-admin-guarded-soft-delete (the 4 UI-admin
      DataSource write operations)

  One DOC-NNN candidate: document the editable field-set (name,
  description, namespace_name only — NOT oddrn, NOT token), the
  REPLACE semantic, and the 404-on-missing behaviour on the
  /features/management Datasources tab.
