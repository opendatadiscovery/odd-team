- id: H-007
  hypothesis: "When term B (linked to term A) is later DELETED, term B stops appearing on term A's Linked-Terms tab."
  derivation: "negative-space: a deleted term disappears from reverse-lookup; soft-delete of term sets deleted_at and every term read filters TERM.DELETED_AT IS NULL."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      Two competing facts. (1) listByTerm joins the TERM table and every term
      read filters TERM.DELETED_AT IS NULL (ReactiveTermRepositoryImpl invariant,
      verified at line 461 among the 13 sites) — so a SOFT-DELETED term B would
      be excluded by the term-side filter. BUT (2) TermServiceImpl.delete does
      NOT clean up term_to_term rows (it cleans data_entity_to_term +
      dataset_field_to_term only; TermServiceImpl.java:155-164; implicit_adr LOW
      + bugs_limitations_corner_cases MEDIUM), AND the term_to_term reads do NOT
      filter term_to_term.deleted_at IS NULL (the V0_0_91-vs-V0_0_76 schema
      asymmetry — 7+ unfiltered read sites). So whether deleted term B disappears
      depends on the JOIN: if listByTerm's join to TERM (with DELETED_AT IS NULL)
      drops the row, B disappears; the orphan term_to_term edge remains in the
      table but points at a now-invisible term. The reverse case — A is deleted
      while B's tab shows the link — leaves a dangling edge that the term-side
      filter on the OTHER term's read may or may not hide depending on which
      end is soft-deleted. The behaviour is correct for the common soft-delete
      path but the orphan-edge cleanup is absent, leaving a latent inconsistency.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveTermRepositoryImpl.md
        section: invariants
        cite: "ReactiveTermRepositoryImpl.java:461 (TERM.DELETED_AT.isNull on listByTerm)"
        note: "Term-side filter excludes a soft-deleted linked term via the JOIN."
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: bugs_limitations_corner_cases
        cite: "TermServiceImpl.java:155-164"
        note: "delete cleans data_entity_to_term + dataset_field_to_term but NOT term_to_term — orphan edges left."
    operator_visible_failure: |
      Orphan term_to_term edges accumulate when terms with term-to-term links are
      deleted: the edge row survives though it points at a soft-deleted term.
      If any future read site drops the TERM join filter (or a sibling reverse
      read like getLinkedTermsByTargetTermId is used directly), the deleted term
      reappears in a linked-terms list. This is a latent correctness/consistency
      defect, not an active one on THIS read path — but it is the exact class
      the term_to_term schema-drift caveat (batch-N) describes.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

