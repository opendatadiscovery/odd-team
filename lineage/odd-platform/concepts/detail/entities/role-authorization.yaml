      REPOSITORY-DOC-GAP-B: the soft-deleted-policy aggregation behaviour
      undocumented on the Roles page;
      REPOSITORY-DOC-GAP-C: the create-side `Administrator`/`User` name
      asymmetry undocumented on the Roles page.
  contributing_files:
  - createRole.md
  - getResourcePermissions.md
  - createOwner.md
  - ReactiveRoleRepositoryImpl.md
  evidence:
  - createRole.md:security.known_security_gaps.[0-7]
  - createOwner.md:dependencies_semantic.requires-runtime (owner_to_role table)
  - |-
    ReactiveRoleRepositoryImpl.md:bugs_limitations_corner_cases.[DRIFT-FACET-A
    through D] + concepts.invariants.[1] + downstream_side_effects (no
