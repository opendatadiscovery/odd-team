behaviour: |-
  **Logout-button click unit gap.** `AppToolbar.tsx:35-37` performs `window.location.href = '/logout'` — an unconditional full-page navigation. This is the SPA's primary user-facing logout affordance (the only React-authored auth surface — no local login form exists per the sidecar's invariants). No test asserts (a) clicking the Logout `<AppMenuItem>` triggers exactly `window.location.href = '/logout'`; (b) the target URL is `/logout` (a refactor changing the URL or adding a query parameter would slip through); (c) the navigation is a window-location assignment rather than a fetch + redux dispatch (the implicit-ADR that "ALL session-termination logic — local cookie clearing, OIDC end-session redirect, provider-specific logout URI assembly — is on the backend's LogoutSuccessHandler chain"). A regression that switched to `dispatch(logout())` followed by `navigate('/login')` would silently break Azure / Cognito / generic-OIDC end-session flows. Bundled with the no-confirmation-prompt observation (bugs_limitations_corner_cases.[2]) — also untested.
