proposed_action: |-
  Add parametrised test `token_visibility_substring_prefix_sniff_is_exactly_six_stars` to `CollectorItemToken.test.tsx`. Test cases: (a) `'******abc123'` → `isHidden=true`, Regenerate button rendered, Copy hidden; (b) `'40CharAlphaNum...'` → `isHidden=false`, Copy + warning; (c) `'*****abc123'` (5 stars) → `isHidden=false`, Copy rendered (regression-pin: if mask drops to 5 stars, this test fires); (d) `'XXXXXX{last6}'` → `isHidden=false` (mask change pin); (e) `' ******abc'` (leading space) → `isHidden=false` (whitespace pin); (f) `'▒▒▒▒▒▒abc'` (Unicode block) → `isHidden=false` (Unicode pin). Each case asserts the rendered DOM state. The test surface pins the sniff contract at the UI tier; any backend mask-format change must be coordinated with this test.
