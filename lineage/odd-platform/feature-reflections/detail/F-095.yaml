- id: H-005
  hypothesis: "When a producer pushes a statistic with an out-of-range value (negative nulls_count, high_value < low_value, NaN/Infinity mean), the platform rejects it or normalises it so downstream DQ surfaces never render nonsense."
  derivation: "Response-shape / DTO field semantics — `nulls_count`, `low_value`/`high_value`, `mean_value` name quantities with natural validity constraints a quality product would enforce."
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |
      Partial: the happy path (well-formed numbers) is honoured and rendered (H-001),
      but there is NO application-layer validation of numeric validity. The OpenAPI
      integer fields are `format: int64` with no `minimum`/`maximum`
      (opendatadiscovery-specification components.yaml:1596-1621), and
      `updateFieldsStatistics` serialises the supplied stat verbatim into JSONB
      (lines 233-251). Negative counts, inverted ranges, `unique_count > row_count`,
      and NaN/Infinity doubles are all accepted and persisted.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: bugs_limitations_corner_cases[4]
        cite: "components.yaml:1596-1621 (no bounds) + DatasetFieldServiceImpl.java:233-251 (verbatim serialize-and-write)"
        note: "no numeric validation; invalid values persist"
    operator_visible_failure: |
      The Dataset Structure tab and Quality Dashboard rings render nonsense values
      (a column showing -5 nulls, or a min greater than its max). A BI tool reading
      `dataset_field.stats` (cross-pillar consumer) ingests the same garbage. The
      failure is silent: 201 Created, no warning. Honest producers with a sampling
      bug, and malicious callers seeding confusing numbers, both land here.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: "When a producer includes a `tags` array on a `DataSetFieldStat`, creating a brand-new catalog tag requires the same `TAG_CREATE` authority the UI requires — an unauthenticated caller cannot populate the global tag taxonomy through this endpoint."
  derivation: "Cross-pillar promise (P-10 ingest → P-08 Tag taxonomy): the Tags management surface is RBAC-gated by TAG_CREATE; a product owner expects tag creation to honour that gate regardless of the door used."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      `updateFieldsTags` extracts tag names from the payload's `stat.getTags()` and
      calls `tagService.getOrCreateTagsByName(...)` (DatasetFieldServiceImpl.java:202),
      which CREATES any tag name not already present. There is no `TAG_CREATE`
      check on this path (no auth at all — H-003). An anonymous POST with
      `tags: [{name: 'arbitrary'}]` mints the tag into the global namespace, stamped
      `EXTERNAL_STATISTICS` origin, discoverable by every user via tag search.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: bugs_limitations_corner_cases[5]
        cite: "DatasetFieldServiceImpl.java:202 (getOrCreateTagsByName) + IngestionController.java:81-87 (no auth)"
        note: "tag auto-create reachable unauthenticated, bypassing TAG_CREATE"
    operator_visible_failure: |
      The catalog's tag-filter facet and tag search fill with attacker-controlled
      tag names; an operator curating a clean tag taxonomy finds it polluted with
      entries they never authorised and cannot trace (no audit — H-004). This is the
      `getOrCreateTagsByName` auto-create side-channel that PLT-026 enumerates as one
      of the "5 side-channel mints into the global Tag directory" — the stats
      endpoint is one of those five doors.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: "When a producer re-pushes statistics for a field but omits a tag it sent on a previous push, the previously-pushed tag is preserved (a missing tag in one payload does not silently delete it)."
  derivation: "Negative-space — a product owner expects a profiling run that briefly stops emitting a tag (sampling jitter) not to destroy catalog state; merge, not replace, is the safe default."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Re-push is replace-not-merge for EXTERNAL_STATISTICS-origin tags:
      `updateFieldsTags` computes `relationsToDelete` as the existing
      EXTERNAL_STATISTICS relations not present in the new payload and DELETEs them
      (DatasetFieldServiceImpl.java:221-223), then re-creates the desired set. A
      re-push with fewer tags silently removes the absent ones. This is exactly the
      F-008 `silent_destruction_replace_not_merge` class, applied to the per-field
      EXTERNAL_STATISTICS tag plane (F-008 is the entity-list plane).
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: bugs_limitations_corner_cases[6]
        cite: "DatasetFieldServiceImpl.java:221-223 (relationsToDelete = existing minus new) + 201-228"
        note: "replay-with-fewer-tags deletes the absent EXTERNAL_STATISTICS tags"
    operator_visible_failure: |
      A producer whose profiler skips a tag for one tick (a transient sampling bug)
      silently loses that tag on every affected field — with no audit trail to
      notice (H-004). The operator sees tags disappear from the Structure tab with no
      explanation. Note this is the SAME drift class as F-008 but a DISTINCT code
      locus (per-field EXTERNAL_STATISTICS reconciliation, not entity-list metadata
      replace), so it is a net-new instance, not a duplicate of F-008's finding.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: "When a producer re-pushes the exact same statistics payload, the operation is idempotent — the second push produces the same final state as the first, with no duplication and no surprise."
  derivation: "Endpoint shape — a 'push your latest stats' endpoint is expected to be safely repeatable (collectors retry on timeout); a product owner expects replay-safety."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      Partial: at the data layer a replay IS idempotent for the stats blob (re-push
      overwrites `dataset_field.stats` to the same value; the tag-reconciliation diff
      is empty for an identical payload) — confirmed by the overwrite-by-bulkUpdate
      semantics. BUT there is NO request-level idempotency key and NO atomicity
      across concurrent posts: two concurrent POSTs against the same fields race
      inside `@ReactiveTransactional`; Postgres MVCC serialises the row writes but
      the EXTERNAL_STATISTICS tag read-modify-write (lines 217-228) is computed
      independently per request, so concurrent tag reconciliation is last-writer-wins,
      not merge. The single-caller replay is safe; the concurrent-caller case is not.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: concepts.invariants[3]
        cite: "DatasetFieldServiceImpl.java:233-251 (overwrite) + 201-228 (tag reconcile)"
        note: "data-layer replay idempotent for stats blob"
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: bugs_limitations_corner_cases[11]
        cite: "DatasetFieldServiceImpl.java:217-228 (read-modify-write not atomic across concurrent POSTs)"
        note: "concurrent tag reconciliation is last-writer-wins"
    operator_visible_failure: |
      A single collector retrying is safe. But two producers (or one producer with
      overlapping ticks) posting to the same fields concurrently can drop each
      other's tags non-deterministically — a flaky, hard-to-reproduce tag-loss that
      only appears under concurrency. The verdict on the concurrent case needs a
      runtime probe to characterise the actual race window (see H-008 probe).
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: probe-needed
    use_case_kind: edit-reconcile
    coverage: unverified
    probe_id: PENDING-F-095-1
    test_demand: PENDING-F-095-1

- id: H-009
  hypothesis: "When a UI user has hand-curated (INTERNAL-origin) tags on a dataset field, a statistics ingestion push does NOT clobber those manually-set tags."
  derivation: "Cross-pillar promise (P-10 ingest must not destroy P-08/P-01 UI-curated state) + DTO origin semantics — EXTERNAL_STATISTICS is a distinct origin from INTERNAL; a product owner expects the ingest to touch only its own origin."
  seed_source: cross-pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      The reconciliation operates ONLY on EXTERNAL_STATISTICS-origin relations:
      `listTagsRelations(datasetFieldIds, TagOrigin.EXTERNAL_STATISTICS)` (line 218)
      restricts the read, and `createExternalStatisticsRelation` stamps
