name: |-
  No rehype-sanitize anywhere in odd-platform-ui — systemic XSS-class architectural absence (Grep-verified)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-06
  - P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20U — companion to the
  F-004 3-surface closure (batch U). Surfaced by primary-source Grep
  verification across the entire odd-platform-ui tree confirming that
  the platform's stored-XSS defence is SYSTEMICALLY ABSENT, not just
  missing on one or two surfaces.

  THE GREP VERIFICATION (TermDetails batch U sidecar primary source):

    grep over odd-platform-ui/src for the string rehype-sanitize returns
    ZERO matches across:
      - Source files (.ts, .tsx, .js, .jsx).
      - Component implementation files.
      - Shared element wrappers (Markdown.tsx, MarkdownContent, etc.).
      - Per-feature view files.

    grep over pnpm-lock.yaml for rehype-sanitize returns ZERO matches —
    the package is NOT installed as a direct or transitive dependency.

    By contrast, rehype-raw IS bundled at pnpm-lock.yaml:3900, 5922, 8843
    as a transitive of @uiw/react-md-editor@4.x — the LIBRARY that
    Markdown.tsx wraps. The rehype-raw plugin parses raw HTML embedded
    inside Markdown into AST nodes; rehype-sanitize is the COMPANION
    plugin that would strip dangerous tags. The platform pulls the raw
    pipeline and SKIPS the sanitisation step.

    Additionally Grep over odd-platform-ui/src for the strings
    allowDangerousHtml-disabling or skipHtml or HTMLSanitizer or DOMPurify
    returns zero matches — there is NO alternative sanitisation layer
    anywhere in the UI tree.

  THE SCOPE OF THE SHARED ELEMENT:

    Markdown.tsx (at components/shared/elements/Markdown/) is the SOLE
    renderer of user-curated Markdown across the entire platform.
    Cross-batch evidence enumerated below confirms every Markdown-rendered
    surface routes through this one element:

      - data-entity internal description (batch F + batch J primary source)
      - dataset-field internal description (batch R primary source)
      - term definition (batch U primary source — TermDefinition.tsx:45)
      - alert descriptions (referenced in batch F existing F-004 evidence)
      - query example descriptions (referenced in master F-004 invariant)
      - owner descriptions (referenced in master F-004 invariant)
      - attachment descriptions (referenced in master F-004 invariant)

    Six surfaces converge on one renderer. The shared-element architecture
    is the asset for the fix (add rehype-sanitize once and all surfaces
    are sanitised) AND the asset for the bug (omitting rehype-sanitize
    once and all surfaces are vulnerable).

  THE PLATFORM-WIDE COVERAGE (negative finding — Grep-anchored):

    Component-level inspection of every Markdown-consuming React component
    across batches F / J / R / U:

      InternalDescription.tsx, InternalDescriptionPreview.tsx (batch F + J):
        no per-component sanitisation; relies on Markdown.tsx.

      DatasetFieldDescription.tsx (batch R):
        no per-component sanitisation; relies on Markdown.tsx.

      TermDefinition.tsx (batch U — primary source):
        no per-component sanitisation; relies on Markdown.tsx.

      Markdown.tsx (the shared element):
        no per-element sanitisation; relies on MDEditor.Markdown from
        @uiw/react-md-editor, which uses rehype-raw without
        rehype-sanitize per the bundled-but-unconfigured dependency
        chain.

    Net: there is NO LAYER in the UI tree where HTML sanitisation
    occurs. The XSS surface is platform-wide; not localised to one
    feature.

  THE BROWSER MITIGATION REMAINS DEFENCE-IN-DEPTH:

    P-009 slice-5/-6 probe run R-20260519T020610Z-P-009 empirically
    confirmed for the data-entity surface that:
      dom_has_script_tag is True (script tag REACHES the DOM)
      dom_has_xss_img_id is True (img tag REACHES the DOM)
      dom_has_xss_iframe_id is True (iframe tag REACHES the DOM)
      dom_has_onerror_attr is False (React attribute filtering strips it)
      xss_dialog_fired is zero (Chromium HTML-parser policy blocks
                                 inline script execution)
      xss_leak_count is zero (no observable leak in the test browser)

    The Chromium-side block + React attribute filtering are
    DEFENCE-IN-DEPTH MITIGATIONS, NOT application-layer defences. The
    application is reaching DOM with dangerous tags. The mitigations
    fail if:
      - CSP is relaxed (operators frequently customise CSP).
      - The component switches to dangerouslySetInnerHTML for any reason.
      - A different browser (Firefox / Safari) is used — not empirically
        verified.
      - An SVG payload with onload is used (some browsers handle this
        differently from script tags).
      - Future framework updates change attribute filtering semantics.

  THE SYSTEMIC VS LOCALISED CONSEQUENCE:

    A localised fix at one component (e.g., adding rehype-sanitize as
    a prop to one TermDefinition.tsx call to Markdown) leaves five
    surfaces vulnerable. A systemic fix at the Markdown.tsx shared
    element fixes all six surfaces. The architectural lever is the
    shared element; the maintainer should choose between:
      (a) Add rehype-sanitize at Markdown.tsx with a strict allowlist —
          fixes all six surfaces uniformly. Recommended.
      (b) Per-surface override — accept the maintenance burden of
          tracking sanitisation policy across six call sites.
      (c) Replace @uiw/react-md-editor with a sanitising renderer —
          larger change but fixes the underlying dependency choice.

    Option (a) is the same one-line one-file fix the master F-004
    invariant recommends; this companion invariant reinforces it by
    surfacing the SYSTEMIC absence.

  WHY THIS IS A SEPARATE INVARIANT FROM F-004 PROPER:

    The master F-004 invariant
    (markdown-rendering-via-rehype-raw-without-rehype-sanitize-stored-xss-surface-on-internal-description)
    captures the BEHAVIOUR (rehype-raw without rehype-sanitize on
    internal_description). The F-004 3-surface extension (batch U
    companion invariant) captures the SCOPE OF VULNERABLE SURFACES
    (data-entity description + dataset-field description + term
    definition). This invariant captures the SYSTEMIC ABSENCE — the
    third axis: the codebase has NO sanitisation infrastructure
    anywhere in the UI tree. Three angles, one ROOT CAUSE: the
    shared Markdown.tsx renders rehype-raw without rehype-sanitize
    because rehype-sanitize is not installed AND no per-component
    sanitisation has been added.

  SEVERITY HIGH — the systemic absence amplifies the severity of any
  future Markdown surface added to the platform. Any future feature
  that calls Markdown.tsx inherits the XSS surface by default. A
  maintainer adding a new Markdown-rendered surface (e.g., a Discussion
  thread body, a custom-link description, a notification template)
  ships an XSS surface without any new code or scanner alert. The
  failure mode is structural: missing infrastructure, not missing
  feature-level code.
