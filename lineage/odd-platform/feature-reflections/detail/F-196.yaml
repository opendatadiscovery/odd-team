- id: H-007
  hypothesis: |
    When a data entity is hard-deleted (purged, not soft-deleted), its historical activity
    rows recorded on the per-entity tab are no longer needed — but for any entity still
    present (soft-deleted or live), the full history is returned.
  derivation: |
    The per-entity tab reads through the shared ReactiveActivityRepositoryImpl find queries,
    which (per F-021) INNER JOIN DATA_ENTITY. The reflection interrogates whether a soft-vs-
    hard delete changes what the per-entity tab returns.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      The per-entity read shares the global feed's `INNER JOIN DATA_ENTITY ON DATA_ENTITY.ID
      = ACTIVITY.DATA_ENTITY_ID` (per F-021 reflection H-011 + drift class
      inner_join_to_data_entity_hardelete_history_erasure). For a SOFT-deleted entity the
      row still exists, so the INNER JOIN matches and the per-entity tab returns the history
      (consistent with H-004 + the existsIncludingSoftDeleted gate). For a HARD-deleted
      entity the DATA_ENTITY row is gone, the INNER JOIN matches nothing, and the activity
      rows — though physically still in the activity table (no CASCADE DELETE) — drop from
      every read path including this per-entity tab. The hypothesis as stated is confirmed:
      soft-deleted -> history returned; hard-deleted -> history invisible. (The hard-delete
      erasure is itself a documented F-021 bug H-011; here it merely scopes what the
      per-entity tab can ever show.)
    evidence:
      - sidecar: "(parent F-021 reflection)"
        section: H-011 + drift class inner_join_to_data_entity_hardelete_history_erasure
        cite: "ReactiveActivityRepositoryImpl.java:219 (INNER JOIN DATA_ENTITY)"
        note: "Shared find-query JOIN; the per-entity tab inherits soft-survives / hard-erases"
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityAlerts.md
        section: implicit_adrs[1] (existsIncludingSoftDeleted)
        cite: "AlertServiceImpl.java:327-335"
        note: "Per-entity reads admit soft-deleted entities by the helper-name convention"
    severity: N/A
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional
    test_note: |
      CONFIRMED but UNTESTED. Functional demand: an integration test seeding an entity with
      activity rows, soft-deleting it (assert tab still returns rows), then hard-deleting it
      (assert tab returns empty) — guards the soft-survives / hard-erases boundary that the
      per-entity tab depends on.

- id: H-008
  hypothesis: |
    When a user paginates the per-entity Activity tab (scrolls to load more), the next page
    returns strictly-older rows for this entity without skipping or duplicating events.
  derivation: |
    `ActivityResults.tsx:47-59` `fetchNextPage` threads `lastEventId` + `lastEventDateTime`
    (cursor) with `isQueryUpdated: false` (append). The product promise of infinite scroll
    is "every event once, newest-first".
  seed_source: endpoint-shape + ui-label
  validation:
    verdict: partial
    actual_behavior: |
      The per-entity tab implements cursor pagination correctly at the UI tier (Rule-8 read
      of ActivityResults.tsx:47-59: `fetchNextPage` guards on `hasNext`, threads
      `(lastEventId=lastId, lastEventDateTime=lastDateTime)` from pageInfo, appends with
      `isQueryUpdated: false`). It inherits the SHARED backend cursor mechanism, which F-021
      H-008 found has an asymmetric-precision edge case: SECOND-truncation on the cursor
      predicate vs microsecond ORDER BY, allowing possible visual out-of-order or skip
      within a single second-bucket that splits across a page boundary UNDER SUSTAINED HIGH
      WRITE RATE. On a single entity the per-second write rate is far lower than the global
      feed's catalog-wide rate, so the edge case is much less likely to manifest here — but
      the mechanism is identical and the upper-bound risk is non-zero for a very-hot entity
      (e.g. one under heavy concurrent ingestion). The happy-path is confirmed; the
      high-write-rate boundary is the unverified part (F-021's P-024 probe covers the
      mechanism; the per-entity amplitude is lower).
    evidence:
      - sidecar: "(source read for validation)"
        section: fetchNextPage cursor
        cite: "ActivityResults.tsx:47-59"
        note: "source_read_for_validation: true — hasNext-guarded cursor pagination with (lastEventId,lastEventDateTime) append confirmed"
      - sidecar: "(parent F-021 reflection)"
        section: H-008 (cursor visual-order under high write rate)
        cite: "ReactiveActivityRepositoryImpl.java:285-291 + probe P-024"
        note: "Shared cursor mechanism; per-entity amplitude lower (single-entity write rate << catalog-wide)"
    operator_visible_failure: |
      For a normal entity, none observable — pagination is correct. For an exceptionally hot
      entity under sustained concurrent ingestion (many activity rows/second on the SAME
      entity), a page-boundary that splits a second-bucket could skip or re-order a row, the
      same class as F-021 H-008 but at much lower probability. The partial verdict reflects
      "happy-path works; the rare high-write boundary is shared-and-unpinned".
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional
    test_note: |
      Functional demand: an integration test seeding > size rows on one entity and asserting
      forward cursor pagination returns each row exactly once newest-first. The high-write
      boundary is covered by the shared F-021 P-024 probe (not re-emitted here).

