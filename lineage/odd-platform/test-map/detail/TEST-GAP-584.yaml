behaviour: |-
  **Token caching ABSENT on the auth hot path — every ingestion request re-fetches the datasource (and optionally collector) from PostgreSQL.** `getDtoByOddrn` (line 43) + `getDto` (line 49) are non-cached reactive DB calls. On a high-throughput ingestion stream (hundreds of `POST /ingestion/entities` per second from a busy `odd-collector`), this is N+M extra DB round-trips on the auth path BEFORE the controller's own DB writes. A short-TTL Caffeine cache keyed by `dataSourceOddrn` would eliminate per-request DB hits with a known invalidation requirement on `regenerateCollectorToken` / datasource-token rotation. The maintainer's deliberate omission (per the broader no-cache stance — AuthIdentityProviderImpl implicit_adrs[3]) is the design choice: avoid cache-invalidation surface; pay per-request cost.
