  - facet: ActivityHandler interface misnamed — state-snapshot differ, not write-handler
    observed: |-
      The dispatch interface "ActivityHandler" name implies a
      write-side handle(event) contract, but the 4-method body
      (ActivityHandler.java:9-22) declares only state-READING
