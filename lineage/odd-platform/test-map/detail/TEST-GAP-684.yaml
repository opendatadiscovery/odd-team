behaviour: |-
  **TRANSACTIONAL ROLLBACK ON UPDATE — no test injects a mid-pipeline failure to verify @ReactiveTransactional rolls back the partial state.** OwnerServiceImpl.java:69 carries `@ReactiveTransactional`. The update pipeline at lines 70-84 chains: (1) `ownerRepository.get(id).switchIfEmpty(NotFound)`; (2) `applyToPojo`; (3) `ownerRepository.update`; (4) `ownerToRoleRepository.deleteOwnerRelationsExcept`; (5) `ownerToRoleRepository.createRelations`; (6) `updateSearchVectors` (calling `searchEntrypointRepository.updateChangedOwnerVectors` + `termSearchEntrypointRepository.updateChangedOwnerVectors` in parallel); (7) `ownerRepository.getDto(owner.getId())` re-read. The transactional contract: any failure between (1) and (7) MUST roll back ALL of (3)–(6) — name changes reverted, role bindings reverted, search vectors reverted. The third-highest priority OwnerServiceImpl test per the sidecar's `gaps` framing. Without a regression pin, a future maintainer dropping `@ReactiveTransactional` (perhaps to investigate a transaction-related performance issue) would silently expose the partial-update window: a network-error mid-pipeline could leave the OWNER row UPDATED but the role bindings WIPED (the destructive empty-roles surface compounds with rollback absence).
