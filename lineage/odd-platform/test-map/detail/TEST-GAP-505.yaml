behaviour: |-
  DEG-membership read-vs-write authorization asymmetry regression-pin (HIGH — P-01+P-09 cross-pillar). The DEG-membership WRITE paths are gated by Permission-bound SecurityRule entries: `addDataEntityDataEntityGroup` (POST) is gated by `DATA_ENTITY_ADD_TO_GROUP` Permission (`SecurityConstants.java:228-231`); `deleteDataEntityFromDataEntityGroup` (DELETE) is gated by `DATA_ENTITY_DELETE_FROM_GROUP` Permission (`SecurityConstants.java:232-236`). But `getDataEntityGroupsLineage` (GET) is gated only by `.authenticated()` — no DEG-related Permission, no SecurityRule entry, no `@PreAuthorize`. An operator who reads the `permissions.md` page and sees the explicit DEG-management permissions might reasonably assume that DEG-RELATED ENDPOINTS REQUIRE DEG PERMISSIONS — but reading the DEG's lineage (which surfaces all members + their lineage subgraph) requires none. The asymmetry is operator-surprising: ODD's published permission vocabulary names DEG operations as gated, but the most data-rich DEG endpoint (the lineage view) is NOT gated. This is consistent with ODD's read-collaborative posture but contradicts the operator-visible 'manage DEG' permission vocabulary. NO test exists pinning the asymmetry, so a future tightening (e.g. adding a `DATA_ENTITY_GROUP_VIEW_LINEAGE` permission) would have no regression catcher; conversely a future loosening (e.g. removing the WRITE permissions for consistency) would silently flip the platform from 'partial DEG-RBAC' to 'no DEG-RBAC'. Cross-pillar P-01 (Discovery — DEG operation vocabulary) + P-09 (Security RBAC clarity).
