- id: H-005
  hypothesis: "When a user deletes a query example by mistake, the snippet and its dataset/term associations can be recovered (delete is reversible, consistent with the platform's soft-delete model)."
  derivation: "Negative-space + pillar mission — operators curate snippets over time; a product owner expects a 'deleted' artefact to be restorable, matching the platform-wide soft-delete posture."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      Delete is ASYMMETRIC: `QueryExampleServiceImpl.deleteQueryExample` (lines 84-92) HARD-deletes
      the link rows in `data_entity_to_query_example` AND `query_example_to_term` (DELETE SQL), then
      SOFT-deletes only the snippet itself (UPDATE query_example SET deleted_at=NOW(), is_deleted=TRUE
      via the soft-delete CRUD base). The join tables have NO deleted_at column and no ON DELETE CASCADE
      (V0_0_84:18-22) — the associations are gone permanently. Even if a maintainer added an undelete
      affordance for the snippet row, every dataset and term association would be lost. The platform
      exposes no restore affordance today, so the practical effect is: delete is irreversible at the
      link level, and the snippet's FTS entrypoint row leaks (never cleaned up).
    evidence:
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController
        section: implicit_adrs.[hard-delete-of-links] + invariants + downstream_side_effects
        cite: "QueryExampleServiceImpl.java:84-92 + V0_0_84__create_query_example.sql:18-22"
        note: "hard DELETE of link rows + soft delete of snippet; no cascade column"
    operator_visible_failure: |-
      (1) An operator who deletes a snippet to "clean up the catalog" and then realises it was the
      canonical join for a critical dataset cannot restore the dataset/term linkages — they must
      re-author the snippet AND re-attach every dataset and term by hand. (2) The user gets no
      warning at delete time that the action destroys associations irreversibly (the docs are also
      silent on delete-cascade per the controller sidecar doc_drift_findings). (3) Each delete leaks
      a `query_example_search_entrypoint` row (slow unbounded storage growth, invisible until an
      operator monitors PG table sizes). The asymmetry also means a future "restore" feature would
      silently return a snippet with NULL associations.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    coverage_note: "deleteQueryExample happy-path is service-tested (QueryExampleServiceTest line 208) but no test pins the hard-vs-soft asymmetry or the entrypoint leak; no UI warning exists to test."

