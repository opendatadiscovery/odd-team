notes: |-
  Cross-cutting infrastructural concept named in main-concepts.md's
  `Data Security (governance-level)` callout that points at
  `configuration-and-deployment/enable-security/README.md`. Every
  controller sidecar invokes this concept verbatim; the catalog
  records it once with the union of nodes that depend on it.

  Batch 2026-05-10B promoted this from a SIMPLE pointer concept
  (auth_modes_relevant list union) to a FULL aggregate with
  security_aggregate — because THREE independent sidecars converged
  on the same triangulated insecure-default finding.

  Batch 2026-05-12C completes the wiring-side picture: each of the
  four `auth.type` modes now has its own canonical *SecurityConfiguration
  sidecar (DisabledAuthSecurityConfiguration / LoginFormSecurityConfiguration /
  OAuthSecurityConfiguration / LDAPSecurityConfiguration), making per-mode
  claims directly citable rather than inferred. Three triangulated findings
  now have 4+ contributing sidecars: (a) the default-DISABLED + no-fail-fast
  trap; (b) the S2S composes-not-mutex pattern (X-API-Key grants ADMIN
  across all /**); (c) the LOGIN_FORM-without-AuthorizationCustomizer
  finding (REFACTOR-073 validated). The aggregate now carries 13 weaknesses
  across all four modes plus three previously-implicit cross-mode
  inconsistencies.

  Batch 2026-05-12D adds the canonical config-POJO sidecars for OAUTH2
  (`ODDOAuth2Properties`) and LDAP (`ODDLDAPProperties`). This validates
  three batch-C claims from the primary source (Provider enum 5 values
  vs docs 7; azureTenantId field ABSENT from POJO; Azure logoutUri
  NPE-prone) and adds a NEW high-impact doc-drift finding: live OAuth2
  docs use field key `username-attribute` (single-word kebab) but the
  POJO field is `userNameAttribute` (camelCase split) — operator
  copy-paste-from-docs silently fails to bind. Batch D also REFINES
  the actuator-env credential-leak claim originally surfaced for LDAP
  in batch C: Spring Boot 3.4.10's `management.endpoint.env.show-values:
  NEVER` default DOES sanitise actuator-env (password appears as `******`).
  The DURABLE leak surface across all four sensitive config classes
  (NotificationsProperties batch C + EmailSenderProperties D password +
  ODDLDAPProperties D password + ODDOAuth2Properties D clientSecret) is
  Lombok `@Data`-generated `toString()` if logged or custom-serialised.
  Surfaced as a separate cross-cutting invariant (4-sidecar triangulated).

  Batch 2026-05-12E adds 5 RBAC-and-search-area sidecars (RoleController.
  createRole + PolicyController.createPolicy + OwnerController.createOwner
  + PermissionController.getResourcePermissions + SearchController.search).
  These corroborate the Auth Mode aggregate's two dominant weaknesses
  from the RBAC primary-surface and the read-side angles:

  (1) DISABLED-mode-bypass weakness — now 8-SIDECAR triangulated
  (was 4 from wiring side; +4 from batch E: every RBAC mutation
  endpoint reachable unauthenticated AND the read-side
  permission-discovery endpoint silently misleads UI consumers).
  DISABLED is now the most-corroborated insecure-default in the
  whole catalog.

  (2) LOGIN_FORM-ADMIN-for-all weakness — now 3-SIDECAR triangulated
  (LoginFormSecurityConfiguration@L31 wiring + getResourcePermissions
  read-side + createRole RBAC-mutation side). The read-side endpoint
  returns the FULL admin permission set for every caller under
  LOGIN_FORM regardless of UI-configured policies — the most
  diagnostic single test for whether per-resource gating is
  effective.

  Batch E also surfaces THREE NEW cross-cutting invariants captured
  under `invariants:` further down — Administrator-name reservation
  asymmetry on CRUD (Role + Policy 2-sidecar primary source) +
  No-audit-log on RBAC mutations (Role + Policy + Owner 3-sidecar)
  + Read-collaborative cross-owner enumeration (now 3-sidecar:
  getAllAlerts + getActivity + search).

  Batch 2026-05-12F adds 5 controller-method sidecars covering the
  DataEntity primary surface + the canonical S2S ingestion controller.
  Three of the five (getDataEntityDetails + createOwnership +
  updateStatus) add DataEntity-side corroboration to the DISABLED-mode
  weakness, raising it to 11-SIDECAR triangulated — the most-corroborated
  insecure-default in the whole catalog. The fourth (lineage) adds the
  graph-shaped cross-owner enumeration variant; the fifth (postDataEntityList)
  CLOSES THE S2S LOOP opened by IngestionDataEntitiesFilter in batch B
  (default-off unauth confirmed from BOTH the WIRING side and the
  CONTROLLER side).

  Batch F also surfaces THREE NEW/REFINED cross-cutting invariants:
  (1) Permission-bypass via Owner auto-create — createOwnership
  auto-creates Owner via getOrCreate without OWNER_CREATE permission
  check; structural permission-escalation side-door.
  (2) TTL retention broken by statusUpdatedAt nullification — batch D's
  HousekeepingTTLProperties + batch F's updateStatus combine to surface
  a cross-batch defect: the 30-day data-entity-delete TTL relies on a
  field that's never bumped on status transition (ordering bug in
  DataEntityMapperImpl.applyStatus).
  (3) Audit-log presence ASYMMETRY (REFINEMENT of batch-E theme) —
  RBAC mutations (Role/Policy/Owner) have NO audit; DataEntity mutations
  (updateStatus, createOwnership) DO emit audit signals. The codebase
  has a 2-tier audit story: DataEntity-scoped writes are TIER-1
  audited; RBAC-scoped writes are TIER-2 unaudited. Inverse of the
  expected security-conscious posture.

  Batch F also RESOLVES ADR-CANDIDATE-003 borderline_flag — the
  read-collaborative posture on the CENTERPIECE READ (`GET /api/dataentities/{id}`)
  is DELIBERATE and consistent with 27+ other GETs on the same
  controller; the doc-gap is that live `/configuration-and-deployment/enable-security/authorization`
  does NOT name this stance.

  Batch 2026-05-19-O adds 5 OAuth provider-specific sidecars
  (GoogleUserHandler + GithubUserHandler at the user-enrichment handler
  axis; AzureLogoutSuccessHandler + CognitoLogoutSuccessHandler at the
  logout-handler axis; IngestionDataEntitiesFilter at the auth/filter
  axis — the latter is the filter-class-layer primary source
  complementing the existing config-key-consumer axis sidecar).

  Batch O surfaces 4 NEW cross-cutting concepts and 1 SUPERSEDE:

  (1) OAuth Provider-Quirks Strategy Pattern (new invariant) — each
  OAuth provider handler diverges from `AbstractOIDCUserHandler` in a
  UNIQUE direction (Google: hd-claim + Spring-discovered userNameAttribute
  + email-default admin-attribute, drops the abstract base; GitHub:
  OAuth2-not-OIDC distinct list + two outbound HTTP calls + org-and-team
  gating; Azure logout: NO null guard; Cognito logout: graceful-
  degradation guard). Chain wiring is symmetric (shouldHandle +
  @Conditional + first-match-wins) but per-provider SUBSTANCE diverges.
  Captures ADR-CANDIDATE-034 at the code level.

  (2) admin-groups silent no-op (asymmetric provider support) (new
  invariant) — `OAuth2Provider.adminGroups : Set<String>` POJO field
  binds for ALL providers but the runtime read is implemented ONLY in
  `AbstractOIDCUserHandler` + `GithubUserHandler`. Google handler
  SILENTLY IGNORES the field. LSN-001-pattern applied to OAuth
  authorization: silent fail-open policy gap.

  (3) Logout-side token revocation asymmetric defence-in-depth (new
  invariant) — 2-of-5 OAuth logout handlers actively revoke provider-
  side tokens (Google + GitHub); 3-of-5 invalidate ONLY the local
  WebSession (Cognito + Azure + ODD_IAM). Exfiltrated tokens retain
  provider-side authority after platform logout until natural TTL —
  exposure window of 1hr-90days depending on provider.

  (4) admin-principals bypass organization-name gate (new invariant) —
  GitHub admin-principals match BYPASSES organization-name gate by
  design (explicit allowlist beats org gate) but undocumented. Operators
  expecting organization-name as a global gate are surprised.

  (5) SUPERSEDE of substring-match-admin-escalation-ldap-containsignorecase
  canonicalisation candidate — `OperationUtils.containsIgnoreCase` is
  FULL-STRING equality (`anyMatch(element::equalsIgnoreCase)`), NOT
  substring (verified by direct primary-source Read of
  OperationUtils.java:7-10 in batch O). Four call sites confirmed:
  LDAPSecurityConfiguration.java:94-97; GithubUserHandler.java:114-119
  + 122-131 + 135-137; GoogleUserHandler.java:60. New corrected
  canonicalisation candidate: oauth-admin-allowlist-full-string-equality-semantics.
  The doc-completeness gap remains valid (admin-allowlist semantics
  not specified in live docs) but the FACTUAL claim about substring
  matching is retracted.

  Batch O also surfaces 2 NEW canonicalisation candidates:
  (a) github-username-rename-orphans-user-owner-mapping — silent
  loss of owner-linkage on GitHub free-rename (90-day escrow); HIGH
