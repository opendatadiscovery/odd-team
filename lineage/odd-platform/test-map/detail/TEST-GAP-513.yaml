behaviour: |-
  DOC-GAP-099 OpenAPI-vs-impl contract regression-pin (HIGH — cross-pillar P-09+P-11+P-05; inverse semantic of the API contract). The OpenAPI spec at `openapi.yaml:843-844` (upstream) and `openapi.yaml:861-862` (downstream) declares: `summary: "Get my objects with upstream/downstream dependencies"` and `description: "Returns list of data entities owned by current user with upstream/downstream dependencies"`. The ACTUAL response semantic is the **INVERSE**: entities the user does **NOT** own that are upstream/downstream-reachable from entities they DO own. The `Predicate.not(oddrns::contains)` filter at `DataEntityRelationsServiceImpl.java:37` explicitly EXCLUDES the user's owned set from the response. The UI consumer label `Upstream dependents` / `Downstream dependents` (`OwnerEntitiesList.tsx:87,89`) is semantically accurate (the entities are dependents, not the user's owns). But the OpenAPI summary is the contract layer that third-party API consumers read — multi-tenant operators reading the spec and treating ownership as a tenancy boundary expect tenant-isolated results, will receive cross-tenant upstream/downstream-lineage neighbours, and may silently misinterpret the data ecosystem (e.g. consuming the response as 'my entities' or 'my data ecosystem with my entities included'). The doc-vs-code inversion is the most directly-falsifiable security claim in this slice of the API surface. Triangulated across batch G (`getMyObjects` sidecar), batch H (`ReactiveLineageRepositoryImpl` no-owner-JOIN SQL primary source), batch I (`LineageServiceImpl` NEGATIVE-CASE SIBLING), and now batch M (controller-method primary source for BOTH variants). NO test pins the contract — a future refactor that "fixed" the implementation to MATCH the OpenAPI summary (returning owned entities + their dependencies) would silently flip the response semantics with no regression catcher. Cross-pillar P-09 (Security — operator misreading the spec), P-11 (API spec correctness), P-05 (Data Lineage).
