- id: H-003
  hypothesis: "When a DEG contains a nested DEG (DEG-A contains DEG-B which contains entity E), the operator viewing DEG-A's group lineage sees the nested DEG-B and its members represented in the graph."
  derivation: "The recursive CTE walks nested DEGs and the OpenAPI summary says 'the group's children' — an operator reasonably expects nesting to be reflected in the children graph."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The SQL member-resolution CTE DOES walk nested DEGs (ReactiveGroupEntityRelationRepositoryImpl.java:177-204),
      but the service then explicitly filters OUT every edge whose endpoint is a DEG AND removes DEG-typed entries
      from the response dictionary (LineageServiceImpl.java:71-75), with the comment
      `// Remove this when we will support inner DEGs for DEG lineage`. The operator therefore sees a FLAT graph
      of non-DEG members. Nested DEG-B does NOT appear as a node; whether entity E (DEG-B's member) appears
      depends on whether E is also reachable as a transitive member of DEG-A and has non-DEG inter-member edges —
      the DEG node B itself is always suppressed. This is an explicit deferred-feature carve-out, not an accident.
    evidence:
      - sidecar: odd-platform__java__service__service__LineageServiceImpl.md
        section: implicit_adrs / invariants
        cite: "LineageServiceImpl.java:71-75"
        note: "Deferred-feature filter strips DEG-typed nodes + DEG metadata; the comment is the intent anchor."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityGroupsLineage.md
        section: implicit_adrs[0] / docs_link_semantic.doc_drift_findings[0]
        cite: "ReactiveGroupEntityRelationRepositoryImpl.java:177-204 + LineageServiceImpl.java:71-75"
        note: "SQL recurses; Java filter suppresses; live API-reference does NOT disclose the carve-out."
    operator_visible_failure: |
      (1) A third-party caller building tooling on a DEG that contains nested DEGs silently observes the nested
      DEGs missing from the response, with no contract description of why. (2) The contract is unpinned by any
      test: a one-line accidental removal of the filter would silently flip the response shape from 'flat graph of
      non-DEG members' to 'recursive graph including DEG nodes' for every UI client and API consumer with zero
      test signal. (3) The deferred-feature comment has no backlog citation linking it to a triaged ticket.
