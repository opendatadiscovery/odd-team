performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - |-
    GET /api/activity (fetchAllActivities) — single PostgreSQL query against
    `activity` table filtered by 8 facets + cursor; with no `size` upper bound,
    wide-window queries trigger full-window scans — getActivity.md:performance.hot_paths.[0]
    + ActivityController (class).md:performance.hot_paths.[0]
  - |-
    GET /api/activity/counts — 4 parallel aggregation queries per call via Mono.zip
    (totalCount, myObjectsCount, downstreamCount, upstreamCount) —
    getActivity.md:performance.hot_paths.[2] + ActivityController (class).md:performance.hot_paths.[2]
  - |-
    fetchDependentActivities — lineage-graph resolution BEFORE the activity query;
    for deep lineage graphs the resolution step dominates latency —
    getActivity.md:performance.hot_paths.[1] + ActivityController (class).md:performance.hot_paths.[1]
  - |-
    fetchMyActivities — 1 user-owner-mapping lookup + 1 activity-table SELECT
    filtered by OWNERSHIP.OWNER_ID = currentOwnerId; lower cost than the default
    path — ActivityController (class).md:performance.hot_paths.[3]
  - |-
    **NEW batch VAL-LSN-019-B (service tier)**: getActivityHandler linear scan
    over 17 ActivityHandler implementations per @ActivityLog method invocation
    — O(N) where N=17; runs twice per @ActivityLog mutation (once for
    getContextInfo, once for getUpdatedInfo). Low absolute cost but
    contributes a constant overhead to every audit-emitting mutation
    (ActivityServiceImpl.java:260-264)
  - |-
    **NEW batch VAL-LSN-019-B (write tier)**: ActivityServiceImpl.
    createActivityEvents batch path partitions in 1000-row chunks via
    JooqReactiveOperations.executeInPartition; chunk-N failure leaves chunks
    1..N-1 committed (partial-commit on chunk-error — repository sidecar
    Stress Protocol E2/E3)
  - |-
    **NEW batch VAL-LSN-019-B (housekeeping tier)**:
    ActivityEmptyPartitionsHousekeepingJob runs every 15 minutes; each cycle
    issues `SELECT count(*) = 0 FROM <partition>` over EVERY past activity
    partition. For multi-year deployments with N≈61 partitions and 600M
    rows/partition, this is a sequential count scan per partition per cycle —
    HIDDEN DB load on busy deployments (P-013 probe emitted)
  throughput_shape:
    verdict: MIXED
    detail: |-
      Read path: SINGLE_ITEM_ONLY — single-window per call, no batch /
      multi-window endpoint. Write path: BATCH_FRIENDLY — `createActivityEvents`
      accepts a List<ActivityCreateEvent> and batches in 1000-row chunks per
      `JooqReactiveOperations.executeInPartition`. Counts: SINGLE_ITEM_ONLY
      (one 4-way Mono.zip per call; no caching, no debouncing).
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless controllers + services + repository — instances scale
      horizontally. Read-only HTTP path, no locks. Cursor pagination scales
      linearly with page count. Bounded only by DB connection pool and
      Postgres planner. F-010 interaction: the activity table grows
      monotonically while non-empty partitions are never dropped; read scans
      over the full historical window scale with deployment age. Write path
      is reactive and non-blocking; the only serialisation points are
      ShedLock-coordinated housekeeping and the boot-time partition-create
      advisory lock — neither on the hot path.
  strengths:
  - |-
    Reactive Mono/Flux end-to-end — non-blocking on the request thread
    AND non-blocking on the write path (batch VAL-LSN-019-B verified at
    every layer: controller, service, repository)
  - |-
    Cursor pagination over an append-only `activity` table — appropriate index
    shape, avoids offset cliffs
  - |-
    Repository uses `(trunc(created_at, SECOND), id)` SYMMETRIC tuple-less-than
    cursor comparison — corrected from prior v0.2 "skip rows" claim to
    "stable result, shuffled visual order within a second" (batch VAL-LSN-019-B
    REWRITE rule9_supersedes; P-021 emitted for empirical pin)
  - |-
    Repository does NOT use `JooqQueryHelper.paginate(...)` — the LSN-019
    paginate-inside-CTE drift class does NOT apply here (batch VAL-LSN-019-B
    REWRITE explicit non-applicability finding via grep)
  weaknesses:
  - |-
    `size` parameter has no @Max constraint and no programmatic upper bound —
    `size=Integer.MAX_VALUE` only safeguarded by the DB query plan
    (severity MEDIUM)
  - |-
    Counts endpoint fans out to 4 aggregation queries per call — for a UI polling
    counts on a refresh interval, DB load is 4x apparent endpoint count; no
    caching, no debouncing, no aggregate table (severity LOW)
  - |-
    Cursor predicate must be backed by `(created_at DESC, id DESC)` composite
    index on `activity` — if absent, deep-window scans degrade
    (severity LOW; out-of-scope at the controller layer)
  - |-
    fetchDependentActivities walks the lineage graph on the hot path — no
    precomputed dependency-set on the activity row (severity LOW; deployment-dependent)
  - |-
    **Unbounded monotonic growth of `public.activity` table** —
    ActivityTablePartitionManager calls only `createPartitionsIfNotExists`;
    PartitionService.dropPartition + getEmptyPastPartitions exist on the service
    interface but are NEVER invoked for the activity table (severity HIGH —
    silent-data-growth class analogous to LSN-001). Live
    `features/active-platform-features/activity-feed#configuration` claims
    `odd.activity.partition-period` controls 'retention and partitioning' —
    INCORRECT: the setting controls partition WIDTH only, no retention path
    exists. CONFIRMED FROM SECOND ANGLE in batch 2026-05-12D via
    HousekeepingTTLProperties.
    **Batch VAL-LSN-019-B FOURTH-ANGLE confirmation**:
    ActivityEmptyPartitionsHousekeepingJob honors the empty-only contract
    but is functionally a near-no-op on steadily-used platforms (60-day
    windows rarely empty out). Confirmed five-evidence-point primary source.
  - |-
    Silent-fail on partition CREATE failure — PostgreSQLPartitionCreationJob
    catches the wrapping RuntimeException, logs at ERROR, and the outer loop
    continues. No health-check, no metric, no alert (severity HIGH)
  - |-
    No `@Min(1)` validation on `odd.activity.partition-period` — `partition-period=0`
    produces zero partitions; rows are then REJECTED by Postgres
    (severity MEDIUM)
  - |-
    No Micrometer / health-check observability on partition lifecycle — operators
    have no metric to alert on 'partition creation has been failing silently for
    30 days' (severity MEDIUM)
  - |-
    No rate limiting at the controller layer — a hostile or mis-tuned client can
    drive arbitrarily many getActivity calls (severity MEDIUM — confirmed batch T)
  - |-
    **NEW batch VAL-LSN-019-B — count(*)=0 housekeeping check is unindexed
    sequential scan on every past partition**: for a deployment with 60+
    past partitions and millions of rows per partition, the housekeeping
    cycle pays for a sequential count scan per partition per 15-minute
    cycle — even though every partition is non-empty (so no DROP fires).
    Fix: `WHERE NOT EXISTS (SELECT 1 FROM <partition> LIMIT 1)`. Severity
    MEDIUM on populated deployments (probe P-013 emitted)
  - |-
    **NEW batch VAL-LSN-019-B — getActivityCounts unbounded null-date scan**:
    if begin_date/end_date are null, the count query aggregates over the
    ENTIRE retained activity history (all partitions per F-010 — never
    dropped while non-empty). Asymmetric to getActivityList (which rejects
    null dates with BadUserRequestException). Severity MEDIUM (P-023
    probe emitted)
  cross_file_inconsistencies:
  - |-
    Activity Feed concept now spans SEVEN sidecars at different concept layers:
    controller-method getActivity (read-method surface) + controller-class
    ActivityController (class-level shape + cross-cutting evidence) +
    config-key-consumer ActivityTablePartitionManager (durability surface) +
    service ActivityServiceImpl (orchestration) + repository
    ReactiveActivityRepositoryImpl (SQL) + service-interface ActivityHandler
    (snapshot-differ) + housekeeping ActivityEmptyPartitionsHousekeepingJob
    (reaper). The seven reach related LSN-class findings (cross-owner audit
    exposure, unbounded table growth, F-006 audit-silence, cross-mode bleed,
    concurrent oldState race, TX-coupled emit) for the same Activity Feed
    feature — no cross-file disagreement; the septet is the most
    thoroughly-enriched feature in the catalog.
