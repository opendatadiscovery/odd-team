behaviour: |-
  **MEDIUM — the dashboard's `GET /api/dataqatests/runs` fetch multiplicity is unverified at every common operator action: plain `/data-quality` open should fire exactly 1 fetch; deep-linked open (`/data-quality?deNamespaceIds=[1]`) should fire EITHER 1 (if the mount-sync useEffect runs synchronously before first render) OR 2 (if it runs after — LSN-017 class). No filter change should fire MORE than 1 fetch.**

  **The multiplicity surfaces** (statically traced):
  - Plain open: `<DataQualityContent>` mounts, reads `filtersAtom` (empty), `useGetDataQualityDashboard({})` calls react-query's `useQuery` with keyed `['dataQualityDashboard', {}]` — 1 fetch.
  - Deep-linked open (`/data-quality?deNamespaceIds=[1]`): `<DataQualityContent>` mounts and renders FIRST (since the sidebar's mount-sync useEffect at `DataQualityFilters.tsx:28-43` runs AFTER the first render in React's mount order). The first render uses `filtersAtom = {}` → 1 fetch. THEN the useEffect fires, sets `formFiltersAtom` from URL → derived `filtersAtom` recomputes → react-query sees a new key → SECOND fetch. **2 fetches per deep-link open** (LSN-017 multiplicity class).
  - Filter change: operator selects a chip → `formFiltersAtom` write → `filtersAtom` re-derives → react-query sees a new key → 1 fetch (correct).
  - No-op filter churn: clicking the same already-selected chip should NOT fire a new fetch (`filtersAtom` value is identity-equal). React-query dedupes — but this is a TEST gap because no test pins the dedup behaviour.

  **Why this matters**: the dashboard's backend resolves each fetch into THREE repository queries with multi-CTE multi-join SQL (`DataQualityRunsServiceImpl.java:36-39` zips `getLatestDataQualityRunsResults` / `getLatestTablesHealth` / `getMonitoredTables`). Doubling fetches doubles DB load on a deep-link click. For a SOC dashboard left open and tabbed-in / tabbed-out 50 times per day, the multiplicity matters.

  **Why MEDIUM**: the multiplicity is correctness-adjacent (the data is still correct on the second fetch), but a performance / cost regression — sidecar self-rates MEDIUM. No security or data loss; single-pillar. MEDIUM stands.

  **Test gap shape**: integration test that spies on react-query's `useQuery` fetch count (or mocks `dataQualityRunsApi.getDataQualityTestsRuns` and counts calls). Three scenarios: plain open (assert 1), deep-link open (assert 1 or 2 — PINS the current state), filter chip toggle (assert exactly 1 new fetch).
