behaviour: |-
  **MEDIUM — The `!external` guard at `TagServiceImpl.update` (:49-50) and `TagServiceImpl.delete` (:62-63) blocks UI-tier mutations on tags that have ANY `tag_to_*` row with `external = true`. The guard's intent: a Collector that pushes a tag via `ExternalTagIngestionRequestProcessor` claims ownership of it; UI mutations would silently override the Collector-side semantics on next push. The guard's error messages are user-facing contract strings: "Can't update tag which has external relations" / "Can't delete tag which has external relations".** Primary-source confirmed in batch-W TagController sidecar:

  - `TagServiceImpl.update` (lines 49-50): `if (anyExternalRelation(tagId)) { return Mono.error(new BadUserRequestException("Can't update tag which has external relations")); }`
  - `TagServiceImpl.delete` (lines 62-63): same shape with "Can't delete tag which has external relations".
  - The check queries `tag_to_data_entity` / `tag_to_term` / `tag_to_dataset_field` for any row with `external = true`.
  - **Soft-lock semantic**: once the operator removes all external relations (via the collector's next push that omits the tag, OR by manually deleting the external relations via raw DB access), the tag becomes UI-editable again.

  **Behaviour to pin** (the test gap):
  - Seed a tag attached to a data_entity with `external = true` (simulating a collector-pushed assignment).
  - `PUT /api/tags/{tag_id}` for that tag → HTTP 400 with body containing "Can't update tag which has external relations".
  - `DELETE /api/tags/{tag_id}` for that tag → HTTP 400 with body containing "Can't delete tag which has external relations".
  - Conversely: a tag with ONLY `external = false` assignments is UPDATABLE and DELETABLE via the UI surface.

  **Why MEDIUM not LOW**:
  - The guard implements an important cross-pillar invariant (collector-driven tags are NOT silently overwritten by UI edits).
  - The guard's error messages are user-facing contract strings — operators see them in the Management → Tags tab and reasonably build expectations around them.
  - **A regression** that REMOVED the `!external` guard (perhaps in service of a refactor unifying create / update paths) would let UI users overwrite Collector-pushed external tags silently, breaking the invariant.

  **Test gap shape**: regression-pin asserting: (a) update of a tag with any external relation returns HTTP 400 with the canonical message; (b) delete of a tag with any external relation returns HTTP 400 with the canonical message; (c) update / delete of a tag with NO external relations succeeds. The current state is PINNED — failures land if a future maintainer removes the guard.
