# Attachment Lifecycle (Files + Links) — product-owner reflection

## reflection_scope_caveat

**This reflection is BACKEND/API-ONLY. The feature's UI interaction layer is NOT in the chain (APPROACH.md section 0.3 + Rule 9 / LSN-023).** Attachment Lifecycle is a heavily UI-driven, user-facing capability — the user lives through a per-entity "Attachments" tab, a drag-and-drop file uploader, a progress indicator across the 3-step chunked upload, a link-add form, and per-attachment edit/delete action icons (the live feature page describes "drag-and-drop the file into the attachment window, or browse to select" and "per-attachment action icons" — WebFetch 2026-06-01). NONE of those React components is enriched as a sidecar in F-027's `contributing_nodes`: the chain is ten Java surfaces (controller, services, upload-strategy beans, MinioConfig, FileUtils). I checked: `Grep [Aa]ttachment` across `understanding/*ts*.md` returns only Search / DataEntityDetails / PopularStrip / Roles / DataEntityDescription / AppInfoMenu / SelectLanguage — there is NO attachments-uploader, link-form, or attachment-list component sidecar. Consequently the senior-product-owner UX questions (Rule 9: *does the user understand how to use this from the screen? is the interaction convenient/intuitive? can they customise it? how does it behave across device types?*) CANNOT be answered from this chain. The hypotheses below are confined to behaviours observable at the HTTP/storage boundary; they do NOT judge what the user experiences on screen. The UI gap is logged as a `validation_gap` (see cross_references) and a `new_drift_class` (`attachment_ui_surface_unenriched_reflection_api_only_F027`) so the substrate-coverage pass (APPROACH.md Rule 20 / Failure F) anchors the missing components and a follow-up reflection can cover the UX.

## product_owner_narrative

**What it is.** Attachment Lifecycle is the operator-and-user capability to staple supporting context onto any data entity in the catalog: uploaded **files** (runbook PDFs, sample CSVs, dashboard screenshots) and external **links** (wiki pages, ticket references) (per `DataEntityAttachmentController__controller-class` understanding + WebFetch `features/data-discovery/attachments` 2026-06-01 — "Users may attach files and links to data entities"). It is the canonical home for two of the project's most-cited incidents: LSN-001 (the attachment-storage default that silently wiped production data on container restart) and LSN-002 (the MinIO region pin that broke AWS S3 outside us-east-1). The audience is any authenticated platform user who has the `DATA_ENTITY_ATTACHMENT_MANAGE` permission for the entity they are annotating (per `DataEntityAttachmentController__controller-class` implicit_adrs[0] + WebFetch `features/data-discovery/attachments` 2026-06-01 — "Attachment management requires the DATA_ENTITY_ATTACHMENT_MANAGE permission"); the problem it solves is keeping operational context attached to the data it describes, inside the catalog, rather than scattered across wikis and chat.

**How a user interacts with it.** The capability is exposed as ten HTTP endpoints on `DataEntityAttachmentController` under `/api/dataentities/{data_entity_id}/{attachments|files|links}*`, across three resource groups (per `DataEntityAttachmentController__controller-class` concepts.operations): the **attachments aggregate** (`GET .../attachments` list, `GET .../files/uploads` upload-options) — 2 read endpoints; **files** (`POST .../files` initiate, `POST .../files/uploads/{upload_id}/chunks` chunk, `POST .../files/uploads/{upload_id}/complete`, `GET .../files/{file_id}` download, `DELETE .../files/{file_id}`) — 5 endpoints; and **links** (`POST .../links` save-bulk, `PUT .../links/{link_id}` update, `DELETE .../links/{link_id}` delete) — 3 endpoints. A file upload is a deliberate 3-step state machine: the client calls `initiate` with a `fileName` and gets back a server-minted `uploadId` UUID, posts each chunk by integer `index` against that `uploadId`, then calls `complete` to assemble and persist (per `DataEntityAttachmentController__controller-class` concepts.operations[2] + `uploadFileChunk` understanding). The user provides a filename, the file bytes, and (for links) a URL and display name; on success they see the file/link appear in the entity's attachment list and can download or delete it.

**The working parts.** Storage strategy is a boot-time switch: `attachment.storage=LOCAL` (the default, via `matchIfMissing=true`) writes to the container filesystem; `attachment.storage=REMOTE` writes to an S3/MinIO bucket (per `DataEntityAttachmentController__controller-class` implicit_adrs[1] + `MinioConfig` invariants — `@ConditionalOnProperty` selects exactly one upload-strategy bean at boot). Uploads larger than `attachment.max-file-size` (default 20 MB) are advertised as rejected (per WebFetch `features/data-discovery/attachments` 2026-06-01 — "Files larger than the cap are rejected by the upload API"). There is no file-type restriction (per same — "images, CSVs, PDFs, TXT files, and any other format are accepted"). A `(dataEntityId, fileName)` pair is treated as a logical primary key — a duplicate filename on the same entity is rejected at initiate time (per `DataEntityAttachmentController__controller-class` implicit_adrs[5] / FileServiceImpl.java:47-54). Authorization is wired declaratively at the Spring Security WebFilter layer by path-pattern matchers — six `SecurityRule` entries gate POST/PUT/DELETE on `/files/**` and `/links/**` with `DATA_ENTITY_ATTACHMENT_MANAGE`; the three GET (read) endpoints have NO rule (per `DataEntityAttachmentController__controller-class` security.authorization_assertions + bugs_limitations_corner_cases[0]).

**The integration story.** Attachments are a read-side citizen of P-01 Data Discovery — the file/link list renders on the Data Entity detail page's Overview tab for any audience, so the read render path belongs to F-001/F-004 (per F-027 flow `cross_pillar_relationships` P-01 leg). The link-URL surface is family-adjacent to F-004's stored-XSS family (a `javascript:` link is storable; the UI rendering contract decides the attack surface — per `DataEntityAttachmentController__controller-class` bugs_limitations_corner_cases[7]). The `DATA_ENTITY_ATTACHMENT_MANAGE` permission lives on the `DATA_ENTITY` resource scope and is part of P-09's RBAC model (per F-027 flow `cross_pillar_relationships` P-09 leg). Uploaded files may carry DQ test report PDFs or sample CSVs, an informal feed into P-04 Data Quality (per F-027 flow `cross_pillar_relationships` P-04 leg). Critically, NO attachment mutation writes an Activity event — the feature shares the audit-silence pattern of F-019/F-021 (per F-027 `control_summary` cross-link to F-019).

**Edge cases a product owner would demo.** Three are load-bearing. (a) **The LOCAL default is ephemeral** — files written to `/tmp/odd/attachments` vanish on any container/pod restart; the live operator page now warns about this verbatim (LSN-001 doc remediation is healthy — WebFetch `configuration-and-deployment/odd-platform` 2026-06-01). (b) **Even REMOTE persistence does not protect an in-flight upload** — the chunk staging path `/tmp/odd/chunks` is hard-coded regardless of storage mode (per `DataEntityAttachmentController__controller-class` bugs_limitations_corner_cases[5] / FileUtils.java:24); the live operator page now also warns about this ("Even in REMOTE mode, chunked uploads are assembled on the container's local filesystem... container restarts during upload lose staged chunks permanently" — WebFetch 2026-06-01). (c) **Storage and read access are catalog-wide, not entity-scoped** — any authenticated user can list and download any entity's files, and the write permission, once held on one entity, reaches every entity via URL spoofing; the live feature page now names the read caveat ("any authenticated user lists any data entity's attachments by id today") and the cross-entity mutation caveat ("users with this permission on one entity can reportedly mutate attachments on other entities by targeting file IDs" — WebFetch 2026-06-01).

## hypotheses

- id: H-001
  hypothesis: "When a user uploads a file via POST /api/dataentities/{id}/files (initiate) with a fileName that already exists on that same data entity, the platform rejects the upload with a clear 'already exists' error rather than silently creating a second file or overwriting the first."
  derivation: "Endpoint-shape + the (dataEntityId, fileName) logical-PK invariant — initiate takes a fileName; a catalog that treats filename as an identity key rejects duplicates predictably."
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      initiateUpload checks for an existing (dataEntityId, fileName) before minting the
      uploadId: fileRepository.getFileByDataEntityAndName(...).handle((pojo, sink) -> { if
      (pojo != null) sink.error(new BadUserRequestException("File with name %s already
      exists for this data entity")); }). The rejection happens at initiate time (before any
      chunk is accepted), so the user gets the error up front, not after uploading bytes.
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: implicit_adrs[5]
        cite: "FileServiceImpl.java:47-54"
        note: "Duplicate (dataEntityId, fileName) rejected at initiate with BadUserRequestException."
    confidence: HIGH
    routes_to_finding: none

- id: H-002
  hypothesis: "When a user (or API client) tries to upload a file larger than attachment.max-file-size (default 20 MB), the platform rejects it — as the docs promise ('Files larger than the cap are rejected by the upload API')."
  derivation: "Doc-claim seed + endpoint-shape — getUploadOptions advertises max-file-size; the docs state the cap is enforced by the upload API."
  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      attachment.max-file-size is surfaced by getUploadOptions as a UI HINT only (multiplied
      to bytes and returned). The chunk endpoint enforces NO size limit on the request critical
      path: uploadFileChunk reads no byte count, and FileServiceImpl.uploadFileChunk calls
      FilePart.transferTo without checking the chunk or cumulative size. A client that ignores
      getUploadOptions and streams chunks beyond 20 MB is accepted unconditionally. The promise
      "the upload API rejects oversize files" is true at the UI layer (the React uploader
      enforces it before upload) and FALSE at the API layer. The live operator config page now
      states this accurately ("the UI enforces before upload ... the server does not re-validate
      this on upload, and direct API callers can exceed it" — WebFetch 2026-06-01), but the live
      FEATURE page still tells end users "Files larger than the cap are rejected by the upload
      API" (WebFetch 2026-06-01) — a residual user-facing overstatement.
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-method__uploadFileChunk
        section: bugs_limitations_corner_cases[1]
        cite: "DataEntityAttachmentController.java:54-62 + AttachmentServiceImpl.java:60-62 + FileServiceImpl.java:58-67"
        note: "Cap surfaced via getUploadOptions but never enforced on the chunk path. Tracked as REFACTOR-013 (HIGH)."
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-method__uploadFileChunk
        section: docs_link_semantic.doc_drift_findings[1]
        cite: "refactoring-scopes.md:107-115"
        note: "Doc statement true at UI layer, false at API layer — already REFACTOR-013."
    operator_visible_failure: |
      (1) Storage-fill DoS: an authenticated user (or a buggy script) bypasses the advertised
      20 MB ceiling and writes arbitrarily large objects, filling the LOCAL /tmp partition or the
      REMOTE bucket — there is also no per-user/per-entity quota (H-008), so the only real limit
      is disk/bucket capacity. (2) Heap pressure on REMOTE: completeFileUpload buffers the whole
      reassembled file into one ByteBuffer before the PUT (RemoteFileUploadServiceImpl.java:67-77),
      so an oversize file is an oversize heap allocation per concurrent upload. (3) Trust gap: an
      operator who read "the upload API rejects oversize files" and sized their disk for 20 MB
      files discovers the real ceiling only when the partition fills.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-003
  hypothesis: "When a client posts file chunks, the server reassembles them in the order the chunks were created (by ascending index), so the downloaded file is byte-identical to the uploaded file even if chunks arrive out of order over the network."
  derivation: "Endpoint-shape — the chunk endpoint takes an integer index; correct reassembly is the core promise of a chunked-upload protocol."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      Reassembly DOES sort by numeric index: FileUtils.listFilesInOrder sorts chunk files via
      Comparator.comparing(p -> Integer.parseInt(p.getFileName())), so out-of-order network
      arrival reassembles correctly. BUT two corner cases break the byte-identity promise: (a) a
      same-index retry is a last-writer-wins file overwrite with no write-isolation — a client
      retrying chunk index=3 while the prior write is still flushing can produce a partially-written
      chunk that completeFileUpload concatenates silently (no checksum, no length verification); and
      (b) any stray non-integer file in the chunk directory (a .DS_Store, an editor swap, an
      interrupted-write .tmp) makes Integer.parseInt throw NumberFormatException, wrapped as
      RuntimeException, aborting the whole upload.
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-method__uploadFileChunk
        section: tests_coverage_semantic.uncovered_behaviours + bugs_limitations_corner_cases[4]
        cite: "FileUtils.java:43-49 + FileServiceImpl.java:62"
        note: "Numeric sort is correct; same-index race is last-writer-wins with no isolation; corruption is silent."
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: bugs_limitations_corner_cases[6]
        cite: "FileUtils.java:43-49"
        note: "Stray non-integer filename throws NumberFormatException and aborts the upload."
    operator_visible_failure: |
      (1) Silent corruption: a retried chunk under contention yields a downloaded file that differs
      from the uploaded file with no error surfaced at upload or download — the worst kind of failure
      for a file users trust to carry runbooks or sample data. (2) Spurious upload abort: an operator
      whose container's /tmp is shared with anything that drops a dotfile (some k8s sidecars, some CSI
      drivers) sees uploads fail mid-flight with an opaque 500 and no explanation.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-004
  hypothesis: "When a low-privilege authenticated user (no DATA_ENTITY_ATTACHMENT_MANAGE on anything) calls GET /api/dataentities/{id}/files/{file_id} for a file on an entity they do not own, the platform denies the download (403) — attachments are protected by the same permission family that gates managing them."
  derivation: "Pillar mission anchor (P-09 'RBAC gates every mutation/read') + endpoint-shape — a managed resource is not world-readable to any logged-in user."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The three read endpoints (getAttachments list, getUploadOptions, downloadFile) have NO
      SecurityRule entry in SecurityConstants.SECURITY_RULES — only POST/PUT/DELETE matchers exist
      for /files/** and /links/**. The read endpoints fall through to the global authentication
      filter, so ANY authenticated identity (including the lowest-privilege role, and under
      auth.type=DISABLED, any anonymous caller) can LIST and DOWNLOAD the files attached to ANY data
      entity in the catalog regardless of owner or role. The live feature page now names this
      ("any authenticated user lists any data entity's attachments by id today" — WebFetch 2026-06-01).
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: security.known_security_gaps[0] + bugs_limitations_corner_cases[0]
        cite: "SecurityConstants.java:247-276 + DataEntityAttachmentController.java:31-42,73-80"
        note: "No GET matcher; read endpoints are authentication-only, not authorization-gated."
    operator_visible_failure: |
      (1) Cross-tenant data exposure: an operator who uploads a sensitive PDF (an incident postmortem,
      a credentials runbook, a customer-data sample CSV) to one entity has, in effect, published it to
      every authenticated user in the platform — they need only know or enumerate a file_id. (2)
      Enumeration: file_id is a sequential long; a curious user can walk file_ids and pull every
      attachment in the catalog. (3) Under auth.type=DISABLED (a supported mode), the files are
      reachable with no login at all. The read-collaborative posture is a platform-wide implicit ADR
      (per system-mission.md P-09 maintainer notes) — but for attachment CONTENTS specifically, "every
      authenticated user can read every file" is a sharper exposure than catalog-metadata reads.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-005
  hypothesis: "When a user holds DATA_ENTITY_ATTACHMENT_MANAGE on data entity A but NOT on data entity B, and they issue DELETE /api/dataentities/{A}/files/{file_id_of_B}, the platform rejects the request and B's file survives — the per-entity authorization grant confines mutations to the entity it was granted on."
  derivation: "Pillar mission anchor (P-09 RBAC is per-data-entity) + cross-layer naming drift (path dataEntityId vs service fileId) — the URL hierarchy promises entity scoping; does the implementation honour it?"
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The hierarchical URL (/api/dataentities/{data_entity_id}/files/{file_id}) is layout-only. The
      controller binds dataEntityId from the path but DISCARDS it; deleteFile / updateLink / deleteLink
      / completeFileUpload / downloadFile pass only fileId / linkId to the service
      (AttachmentServiceImpl.java:71-88). The SecurityRule gate evaluates DATA_ENTITY_ATTACHMENT_MANAGE
      in DATA_ENTITY context against the URL's dataEntityId (A — which the caller IS authorized on), so
      the gate passes; but the mutation lands on file_id (B's file). No service-tier check verifies the
      file/link belongs to the URL's data entity. A user authorized on ANY single entity can therefore
      delete, update, download, or complete files+links on EVERY entity in the catalog by spoofing the
      URL prefix. This is the LSN-020 / Category-F cross-layer drift shape (path-name promises entity
      scope; implementation keys on a different identifier). The live feature page now names it
      ("users with this permission on one entity can reportedly mutate attachments on other entities by
      targeting file IDs" — WebFetch 2026-06-01).
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: security.known_security_gaps[1] + security.owner_scoping + implicit_adrs[6]
        cite: "DataEntityAttachmentController.java:83-88,100-107,110-114 + AttachmentServiceImpl.java:71-88 + SecurityConstants.java:248"
        note: "owner_scoping: BYPASSES — gate on path entity, mutation on fileId; cross-entity privilege escalation."
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-method__uploadFileChunk
        section: bugs_limitations_corner_cases[2]
        cite: "FileServiceImpl.java:93-102 + SecurityConstants.java:247-251"
        note: "Chunk-path sibling: checkProcessingUploadById resolves by uploadId only; gate evaluates path entity — same misalignment for the upload-in-progress case."
    operator_visible_failure: |
      (1) Cross-entity privilege escalation: any user with attachment-manage on a single low-value
      entity can DELETE attachments on every other entity — a one-permission grant becomes
      catalog-wide write access to the attachment surface. (2) Cross-entity tamper: updateLink lets the
      same user repoint another entity's runbook link to an attacker-controlled URL. (3) Cross-entity
      data theft: downloadFile (already world-readable per H-004) compounds — but even if the read gap
      were fixed, the URL-spoof would still let a manage-on-A user pull B's files. (4) Silent: there is
      no audit log on any of these mutations (H-013), so the escalation leaves no application-side
      trace. This is the highest-severity finding in the feature.
    severity: HIGH
    confidence: HIGH
    probe_id: P-195
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: "When a user adds a link via POST /api/dataentities/{id}/links with a URL field, the platform validates that it is a real, safe web URL (http/https) — a javascript: or data: URI is rejected rather than stored and later rendered."
  derivation: "Endpoint-shape (DataEntityLinkFormData.url) + cross-pillar promise (F-004 stored-XSS family) — a 'link' control promises a navigable URL, not arbitrary script."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      saveLinks and updateLink accept DataEntityLinkFormData.url with NO validation — the OpenAPI schema
      has no format/pattern (components.yaml:2482-2491), there is no @URL constraint, no scheme allowlist,
      no length cap. LinkServiceImpl stores the raw value via the mapper (bulk-create and update both pass
      formData straight through). A link with a javascript: or data: scheme is stored verbatim; whether it
      executes is decided by the UI rendering contract (out of this chain — F-004), but the storage layer
      offers no defence. This is the same stored-XSS class as F-004's description-field family, on the
      dedicated link surface.
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: bugs_limitations_corner_cases[7] + security.known_security_gaps[4]
        cite: "components.yaml:2482-2491 + LinkServiceImpl.java:31-46 + DataEntityAttachmentController.java:91-114"
        note: "Link URL stored raw; no scheme allowlist; javascript:/data: storable — cross-reference F-004."
    operator_visible_failure: |
      (1) Stored XSS: a user with attachment-manage (which, per H-005, is reachable across all entities)
      saves a javascript: link on a widely-viewed entity; if the UI renders the link as a clickable
      anchor with the raw href, any user who clicks it executes attacker script in their authenticated
      session. (2) Phishing/redirect: a data: URI or a look-alike URL can be planted as a "runbook" link.
      The verdict on whether the click actually executes belongs to the F-004 UI render path (absent from
      this chain), but the STORAGE-side contract — "we store whatever string you send as a link" — is the
      contradiction here, and it is independent of the renderer.
    severity: HIGH
    confidence: MEDIUM
    routes_to_finding: bug-candidate

- id: H-007
  hypothesis: "When a user uploads a file whose fileName contains path-traversal characters (e.g. ../../../etc/odd-secret), the platform rejects or neutralises the filename, and the stored object stays inside attachment.local.path — it cannot be written outside the attachment directory."
  derivation: "Negative-space + endpoint-shape (fileName flows into the storage path) — a filename is user input that becomes a filesystem path; a safe system sanitises it."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      fileName is propagated RAW from DataEntityUploadFormData.fileName into the storage path:
      FileMapper.java:30-31 calls pathConstructor.getFilePath(fileName, dataEntityId);
      LocalFilePathConstructor.java:31-33 returns getFileDirectory(dataEntityId).resolve(fileName).
      Path.resolve("../../../etc/odd-secret") escapes the per-entity directory, so for LOCAL storage a
      traversal filename writes (and on download, reads) OUTSIDE attachment.local.path. There is no
      sanitization, no `..` rejection, no NUL-byte filter, no length cap anywhere in the upload path. The
      same raw filename is also emitted into the Content-Disposition header on download without RFC-6266
      quoting (a CRLF in the filename can inject headers). The live docs are silent on filename handling
      (WebFetch `configuration-and-deployment/odd-platform` 2026-06-01 — "no explicit claims about
      filename sanitization").
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: bugs_limitations_corner_cases[1] + security.known_security_gaps[2]
        cite: "FileMapper.java:30-31 + LocalFilePathConstructor.java:31-33 + DataEntityAttachmentController.java:76-79"
        note: "Raw fileName into storage path (path traversal for LOCAL) AND into Content-Disposition (CRLF header injection)."
    operator_visible_failure: |
      (1) Arbitrary filesystem write (LOCAL): a traversal filename writes the uploaded bytes to an
      attacker-chosen location relative to the attachment base path — overwriting config, planting files
      in directories the platform process can write. (2) Arbitrary read-back: download resolves the same
      traversal, so a file written to an escaped path can be retrieved. (3) Header injection on download:
      a CRLF-bearing filename can inject response headers (e.g. set a cookie, smuggle a second response)
      because the Content-Disposition value is unquoted. (4) For REMOTE the raw filename becomes an S3
