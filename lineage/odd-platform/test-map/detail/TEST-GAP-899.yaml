behaviour: |-
  **CRITICAL — the `PUT /api/datasources/{data_source_id}/token` RBAC matrix is entirely
  untested, and the `auth.type=DISABLED` cell is a credential-rotation-hijack surface: on a
  network-reachable DISABLED deployment, ANY caller can rotate ANY data source's ingestion
  credential and receive the new plaintext token in the response body.** Method-level
  primary source from the batch-ZB `regenerateDataSourceToken` controller-method sidecar:

  - The endpoint is gated by Permission `DATA_SOURCE_TOKEN_REGENERATE` (MANAGEMENT tier)
    via `SecurityConstants.SECURITY_RULES` (SecurityConstants.java:124-126 — the tuple
    `(/api/datasources/{data_source_id}/token, PUT, DATA_SOURCE_TOKEN_REGENERATE)`). There
    is NO `@PreAuthorize` on the controller and NO programmatic permission check in
    `DataSourceServiceImpl.regenerateDataSourceToken`.
  - **Under `auth.type=DISABLED`** the `SecurityConstants` rule chain is bypassed entirely
    (the rule is enforced only by the LOGIN_FORM / OAUTH2 / LDAP security configs;
    `DisabledSecurityConfiguration` sets all paths permitAll). `TokenGeneratorImpl.java:31`
    has a no-current-user fallback `regenerate(tokenPojo, null)` — rotation succeeds with
    `updated_by` NULL. An attacker on a DISABLED deployment can break ingestion
    platform-wide AND harvest the new tokens (each rotation response carries the new
    40-char plaintext).
  - The 4-cell auth matrix (`permission absent → 403`, `permission present → 200`,
    `unauthenticated → 401` under LOGIN_FORM, `any caller → 200` under DISABLED) is
    PROBE-NEEDED per the sidecar — the path-rule-to-403 mapping is inferred from the
    `SecurityConstants` pattern but not statically provable end-to-end.

  **Why CRITICAL**: credential rotation is a security-critical operation. The DISABLED
  cell is the LSN-001 / LSN-002 operator-cliff shape — an operator who leaves a deployment
  on the default `auth.type` exposes a credential-rotation-hijack on the network. The
  endpoint has ZERO direct test coverage (Glob-verified — no `DataSourceControllerTest`).
  A `SecurityConstants` typo or a rule deletion would silently fall the endpoint back to
  authenticated-only (the FAIL-OPEN coupling the class sidecar documents) with no test to
  catch it. This is a member of the platform-wide DISABLED-bypass cluster (DOC-GAP-082) and
  the parallel of the COLLECTOR token-regenerate DISABLED-bypass already pinned at
  TEST-GAP-099 — but on a DISTINCT endpoint with a DISTINCT credential (the data-source
  token, not the collector token).

  **Test gap shape**: a parametrized `@SpringBootTest` security test asserting the 4 cells:
  (a) a LOGIN_FORM user whose Policy lacks `DATA_SOURCE_TOKEN_REGENERATE` → 403; (b) a user
  whose Policy grants it → 200; (c) an unauthenticated caller → 401; (d) under
  `auth.type=DISABLED` (a separate Spring context), any caller → 200 and the response
  carries the new plaintext token. Cell (d) PINS the bypass; when a fix lands (e.g. a
  DISABLED-mode hard block on token-issuing endpoints), cell (d) inverts.
