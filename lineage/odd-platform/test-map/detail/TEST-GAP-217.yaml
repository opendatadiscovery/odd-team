behaviour: SECURITY_RULES ROLE_CREATE gate blocks a caller without the permission
  — no integration test asserts the gate is wired correctly at SecurityConstants.java:169.
  The gate is the only thing preventing an authenticated non-admin user from rewriting
  the authorization model. A regression that demotes the rule to `.authenticated()`,
  removes the entry, or changes the path pattern (`/api/role` typo for `/api/roles`)
  would ship undetected.
