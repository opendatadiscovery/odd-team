# Custom metadata field value upsert — product-owner reflection

## product_owner_narrative

Custom Metadata is how an operator pins arbitrary key/value facts onto a catalogued data entity that ODD's fixed schema does not already capture — a `cost_centre`, a `pii_classification`, a `retention_days`, a `data_owner_email`. It lives on the entity's **Overview** tab in a panel beside Description and Tags: the operator clicks "Add metadata", picks (or types) a field name in an autocomplete, the field's declared type drives the value control (a true/false radio for BOOLEAN, a text box otherwise), and Save persists the value (per the e2e page object `tests/ui/pages/data_entity/overview.page.ts:18-23,117-123` — `add_metadata` button → `add_custom_metadata_input` → `add_custom_metadata_type_select` → save; and per `MetadataFieldController` sidecar audiences, the `MetadataCreateFormItem` MUI `freeSolo` autocomplete). The audience is every catalog curator with the `DATA_ENTITY_CUSTOM_METADATA_{CREATE,UPDATE,DELETE}` permission, typically entity owners (per `upsertDataEntityMetadataFieldValue` sidecar audiences + the live Permissions doc).

The feature is a **two-half surface**: a per-entity VALUE write side (F-013, `PUT /api/dataentities/{id}/metadata/{field_id}` + the paired POST/DELETE) and a global FIELD-DEFINITION catalogue read side (F-046, `GET /api/metadata/fields`, powering the autocomplete dropdown). The field DEFINITIONS are global — `metadata_field` has no tenant / owner / namespace column (per `ReactiveMetadataFieldRepositoryImpl` sidecar understanding + `V0_0_1__init.sql:166-173`); only the per-entity VALUES are scoped. The autocomplete is a deliberate **select-or-create combo-box**: typing a brand-new name and saving auto-creates an INTERNAL-origin field row via `getOrCreateMetadataFields` (per `MetadataFieldController` sidecar operations) — the platform's standard novel-vocabulary-mint UX, the same pattern as Tags and Term namespaces (per APPROACH.md Rule 19; the create flow is exactly the e2e `createCustomMetadata` path).

How a user expects it to behave (reasoned from the endpoint shape, the DTO field names, the OpenAPI operationId "upsert", and the UI's own success toast) is the load-bearing question this reflection asks. The OpenAPI operationId is literally "upsert" (`openapi.yaml:1219-1220`); the redux thunk hard-codes "Metadata successfully updated." on any 200 (`metadata.thunks.ts:51-54`); the form body field is named `value` and carries an optional `origin` (`components.yaml:2144-2152`); the field carries a declared `type` from the 8-value `MetadataTypeEnum`. Each of those names is a promise. The implementation, walked controller → service → repository, is a **pure UPDATE with no INSERT-on-conflict, no entity-existence check, no type coercion, no origin guard, and no activity log** (per `upsertDataEntityMetadataFieldValue` sidecar invariants + `DataEntityServiceImpl.java:287-305` + `ReactiveMetadataFieldValueRepositoryImpl.java:95-104`). The gap between the promise layer and the implementation is the substance of the findings below.

This feature feeds Data Discovery search — metadata values are tokenised into the entity's FTS vector on every successful write (per sidecar implicit_adrs.fts-refresh-on-write). It shares the entity surface with Description (F-004, the identical silent-200 pattern), Tags, and Business Names (all of which DO emit activity events; custom metadata is the one that does not). It is fed FROM the Integrations pillar (P-10): collectors ingest EXTERNAL-origin fields + values during the ingestion pipeline (per `MetadataFieldServiceImpl.ingestMetadataFields`), and those EXTERNAL values render in the SAME panel under the SAME edit gate as operator-curated INTERNAL ones (per feature-flow batch `ui-review-2026-05-26-slice-I`).

A product owner demoing this would highlight the happy path ("type a field, set a value, it shows on the entity and it's searchable") — and that happy path has NO automated test of any kind (no WebTestClient HTTP test, no e2e edit flow; the sole test is a mocked service-composition unit test per `upsertDataEntityMetadataFieldValue` sidecar tests_coverage_semantic). Every promise this feature makes is currently unguarded. The live `custom-metadata.md` doc page (created by DOC-189, WebFetched 2026-06-04, 200) has caught up and documents five of the contradictions below as "Known limitations" admonitions — so the doc is honest; the code is not yet fixed (PLT-025, status draft, owns the five fix threads).

## hypotheses

- id: H-001
  hypothesis: "When an operator edits a custom metadata field on an entity that does NOT yet have a value for that field (the field exists in the catalogue but was never created for this entity), the PUT call persists the new value and the entity now shows it."
  derivation: "OpenAPI operationId is literally 'upsert' (openapi.yaml:1219-1220); the UI toast hard-codes 'Metadata successfully updated.' on any 200 — both promise replace-OR-create."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The repository call is a pure `DSL.update(METADATA_FIELD_VALUE).set(VALUE,...).set(ACTIVE,...).where(METADATA_FIELD_ID.eq(?).and(DATA_ENTITY_ID.eq(?))).returning()` with NO `INSERT ... ON CONFLICT` and NO `switchIfEmpty(NotFoundException)`. When no row exists for the (dataEntityId, metadataFieldId) pair, the UPDATE matches zero rows, the inner Mono collapses to empty, the FTS refresh + mapper are short-circuited by empty-mono propagation, and the controller returns 200 OK with an EMPTY body. Nothing is persisted. The redux thunk toasts "Metadata successfully updated." on that empty 200.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityMetadataFieldValue
        section: invariants / bugs_limitations_corner_cases[0]
        cite: "ReactiveMetadataFieldValueRepositoryImpl.java:95-104"
        note: "pure UPDATE, no switchIfEmpty, missing pair → Mono.empty → silent 200"
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityMetadataFieldValue
        section: coupling.ui-toast
        cite: "odd-platform-ui/src/redux/thunks/metadata.thunks.ts:51-54"
        note: "hard-coded success toast on any non-error response"
    operator_visible_failure: |
      Two failure modes. (1) Reconciliation / API consumers: a script or SDK client written from the OpenAPI "upsert" contract that PUTs the desired state for a field that was never created on the entity silently loses the write — 200, empty body, nothing stored — and has no signal to distinguish success from no-op. (2) UI users editing through some future affordance that targets a not-yet-created pair see the green success toast and believe the value saved; it did not. The catalog silently diverges from the operator's mental model.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    test_demand: functional

