proposed_action: |-
  Add `DataQualityFiltersUrlRoundTripTest` under `odd-platform-ui/src/components/DataQuality/__tests__/`. Use Vitest + React Testing Library + `<MemoryRouter initialEntries={...}>`. Five pinning methods:
  (a) `urlToAtom_mountWithNamespaceIds_hydratesFormFiltersAtom`: mount `<DataQualityAtomProvider><DataQualityFilters/></DataQualityAtomProvider>` inside `<MemoryRouter initialEntries={['/data-quality?namespaceIds=[{"id":42,"name":"prod"}]']}>`. Assert (via a hidden test-only atom subscriber, or via the rendered chip in the Namespace autocomplete) that `formFiltersAtom.namespaceIds` equals `[{id:42, name:"prod"}]`.
  (b) `urlToAtom_mountWithDeTitleIds_hydratesTableSideFilter`: same shape, deeplink with `deTitleIds=[...]`; assert the table-side TitleFilter shows the chip.
  (c) `atomToUrl_selectFilterChip_updatesSearchParamsWithReplaceTrue`: mount with empty URL; select a filter chip; spy on `setSearchParams`; assert it was called with `(<expected newSearchParams>, { replace: true })` and the new params JSON-stringify the FilterOption[] verbatim including the `name` field.
  (d) `atomToUrl_emptyFilterArrayIsDroppedFromUrl`: mount with `?namespaceIds=[{...}]`; click "Clear" on the tests-side; assert `setSearchParams` was called with the `namespaceIds` key REMOVED (not present as an empty array) — PINS the `value.length === 0` skip at `DataQualityFilters.tsx:49`.
  (e) `roundTrip_selectThenRemountSameUrl_atomHydratedFromUrl`: select chips; capture the URL the panel produced; unmount; remount at that exact URL; assert the atom contains the same selections. PINS the full bookmark-survives-reload round-trip.

  Add a `// REGRESSION-PIN — DataQualityFilters.tsx:28-54 — the URL ↔ formFiltersAtom bidirectional sync IS the deep-link / shareable-URL contract. JSON-stringified FilterOption[] (id + name) round-trips through the query string. replace: true keeps history clean. If you change the encoding, the key set, or the replace flag, every existing bookmarked /data-quality URL silently breaks.` block. Pair with DOC-GAP-NNN documenting the deep-link contract on the dashboard page.
