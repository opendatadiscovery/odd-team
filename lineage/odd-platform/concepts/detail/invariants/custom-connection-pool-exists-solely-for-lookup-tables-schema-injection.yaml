mitigations_unimplemented:
- |-
  Code-side (refactor): extract the schema-name constant
  `lookup_tables_schema` to a single shared constant module
  (e.g., `org.opendatadiscovery.oddplatform.referencedata.SchemaConstants.LOOKUP_TABLES_SCHEMA`)
  consumed by R2DBCConfiguration.java:25, ReferenceDataRepositoryImpl.java:57,
  AND referenced in V0_0_86 migration via Flyway placeholders. Closes the
  three-location drift risk.
- |-
  Code-side: extract the duplicated PropertyMapper pool-tuning blocks
  (R2DBCConfiguration.java:38-50 vs 72-84 are byte-identical) into a
  shared helper `applyPoolDefaults(R2dbcProperties.Pool pool,
  ConnectionPoolConfiguration.Builder builder)`. Improves maintainability;
  a future tuning change requires updating only one site.
- |-
  Code-side: add a `@ConditionalOnProperty` gate on customConnectionPool —
  e.g., only instantiate when `spring.custom-datasource.url` is set OR when
  `feature.lookup-tables.enabled=true` (a new feature flag). Saves the
  always-on second pool on deployments that never use Lookup Tables.
- |-
  Doc-side: publish the `spring.r2dbc.pool.*` keys as operator-tunable on
  `/configuration-and-deployment/odd-platform`. At minimum document
  `spring.r2dbc.pool.max-size` (the saturation bound called out in the
  concept catalog's authorization-hot-path entry).
- |-
  Doc-side: extend the Lookup Tables page with a 'PostgreSQL connection
  topology' section explaining the two-pool architecture, the
  `?schema=lookup_tables_schema` URL injection, the always-on second pool,
  and the implication for `max_connections` sizing.
- |-
  Code-side: add a unit test asserting the schema-name constant alignment
  across R2DBCConfiguration + ReferenceDataRepositoryImpl + (Flyway-resolved)
  V0_0_86. A drift in any location should fail the test at compile time.
notes: |-
  NEW MEDIUM-SEVERITY INVARIANT captured in batch 2026-05-20X via the
  R2DBCConfiguration sidecar's primary-source examination. The two-pool
  topology is an architectural decision that operators need to understand
  to deploy at scale (PG `max_connections` sizing), but the docs surface
  it only obliquely.

  Cross-cutting connections:
    - master-data-management-lookup-table-pillar-p-03-anchored (existing
      entity) — this invariant is the persistence-layer substrate for that
      feature pillar
    - lookup-table-rename-via-alter-table-breaks-downstream-sql-consumers
      (existing canonicalisation_candidate) — sibling concept; renaming the
      schema would break downstream consumers (direct PG access by BI tools);
      this invariant explicitly names the contract
    - authorization-hot-path-getcurrentuserroles-per-request-no-cache
      (existing invariant) — references R2DBC pool size as the upper bound
      on the per-request authorization cost; this invariant pinpoints where
      that bound is set (or rather, NOT set — at Spring Boot defaults)
    - reference-data-lookup-table-crud (existing operation) — the user-facing
      surface that depends on this substrate

  Three DOC-NNN candidates:
    (a) PG connection topology / pool sizing section on the deployment docs
    (b) Two-pool architecture note on the Lookup Tables feature page
    (c) Schema-name-as-contract-surface admonition on the Lookup Tables page
        warning operators that direct-PG queries to `lookup_tables_schema`
        are a stable surface
