      page or global tab shows, while still inflating the global open-alert count badge (H-008's
      badge can read higher than the sum of visible alerts). The misconfiguration is silent at both
      ends: no error on POST, no visible row to debug from. Over time orphans accumulate in the
      total until housekeeping TTL deletes them.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    dedup_note: "net_new. The orphan behaviour is doc-acknowledged (config page) but I find no PLT/DOC tracking the count-inflation / silent-204 consequence as a finding. New drift class proposed (all_tab_orphan_alerts_null_entity_oddrn_persisted_but_invisible_everywhere)."

