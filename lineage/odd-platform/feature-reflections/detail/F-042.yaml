- id: H-005
  hypothesis: "When a page fails, the backend response-body message (which may carry stack traces, SQL exception strings, or echoed PII) is never persisted in the rendered error page DOM — at most it appears briefly in a transient channel."
  derivation: "Security / negative-space — error.message is populated (body?.message or 'An error occurred') but a maintainer reading the prop signature would expect it surfaced; leaking it would be an information-disclosure bug."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      The persistent error PAGE never renders error.message (AppErrorPage.tsx:24-29 reads only status +
      statusText). So the page itself holds the boundary. BUT the message IS surfaced via a separate channel:
      showServerErrorToast (errorHandling.tsx:48-68) emits a react-hot-toast carrying the backend message for
      6 seconds (App.tsx:55 6000ms default). So the message is disclosed — briefly, side-of-screen — for every
      error EXCEPT where the thunk sets switchOffErrorMessage: true (e.g. fetchTermDetails, terms.thunks.ts:83,
      where AppErrorPage is then the ONLY surface and the message is suppressed entirely). The hypothesis holds
      for the page but is "partly true" for the user: the message is shown, then lost.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppErrorPage__ui-shell-widget__AppErrorPage.md
        section: "security.known_security_gaps[toast-side-channel] + implicit_adrs[1]"
        cite: "AppErrorPage.tsx:24-29 + errorHandling.tsx:48-68 + App.tsx:55"
        note: "page omits message; toast carries it for 6s then it is gone"
      - sidecar: odd-platform__ts__routes__route__terms.md
        section: "upstream_callers[TermDetails] (switchOffErrorMessage)"
        cite: "terms.thunks.ts:83"
        note: "term fetches suppress the toast — message disclosed nowhere"
    operator_visible_failure: |
      Two asymmetric failure modes. (1) Information-disclosure: for non-suppressed errors the backend message
      (potentially a SQL exception fragment, a permission hint like 'You need DATA_ENTITY_READ', or echoed
      input) is shown to whoever is at the screen for 6 seconds — short, but real, and not redacted. (2) Lost
      recourse: the status code stays on the page indefinitely while the message vanishes in 6 seconds; a user
      who blinks, or whose first toast is dismissed by a second, can never recover the backend's specific hint.
      For term-detail failures the message is suppressed entirely, so the user gets only '404 / Not Found' with
      zero context about which term or why.
    severity: LOW
    confidence: HIGH
    probe_id: ""
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

