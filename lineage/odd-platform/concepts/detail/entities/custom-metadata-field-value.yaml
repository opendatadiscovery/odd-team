name: Custom Metadata Field + Value
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-10
description: |-
  **NEW ENTITY, batch 2026-05-19L** — the per-(data-entity, metadata_field)
  custom-metadata pair. Two tables form the entity:

    - `metadata_field` (`V0_0_1__init.sql:166-173`): the GLOBAL
      field-name + type registry (no tenant / project / owner scoping).
      Columns: `id, name, type, origin, is_deleted`.
      - `type` ∈ `MetadataTypeEnum` (INTEGER / FLOAT / BOOLEAN /
        DATETIME / ARRAY / JSON / STRING / UNKNOWN per
        `MetadataTypeEnum.java:3-12`)
      - `origin` ∈ `MetadataFieldOrigin` (INTERNAL — operator-curated
        via UI; EXTERNAL — collector-ingested during ingestion)
      - `is_deleted` — soft-delete flag

    - `metadata_field_value` (`V0_0_1__init.sql:175-186`): the per-entity
      value. Columns: `data_entity_id, metadata_field_id, value (text),
      active (boolean DEFAULT TRUE)`, composite PK
      `(data_entity_id, metadata_field_id)`.

  **Architectural-key intent**: the field-definition is GLOBAL — a
  metadata field name `cost_centre` typed STRING is a SHARED definition
  across every data entity. The `MetadataKey(name, type)` record at
  `MetadataKey.java:6-15` acts as the natural key — two teams creating
  the same `(name, type)` pair collapse to ONE field row. There is no
  platform-side mechanism to namespace metadata fields per team /
  project / owner.

  **Write surfaces**:
    - POST /api/dataentities/{data_entity_id}/metadata
      (`createDataEntityMetadataFieldValue` — bulk-add; uses
      `getOrCreateMetadataFields` to auto-create field rows)
    - PUT /api/dataentities/{data_entity_id}/metadata/{metadata_field_id}
      (`upsertDataEntityMetadataFieldValue` — the per-row updater that
      is misleadingly named "upsert" — the underlying mechanism is
      UPDATE-only with silent no-op on missing pair, per the NEW
      silent-200-on-missing-pair invariant)
    - DELETE /api/dataentities/{data_entity_id}/metadata/{metadata_field_id}
      (`deleteDataEntityMetadataFieldValue`)
    - Ingestion: collectors emit `metadata_field` rows + per-entity
      values via `MetadataFieldServiceImpl.ingestMetadataFields` (lines
      62-71) with `origin=EXTERNAL`.

  **Side-effects on write**: FTS vector refresh
  (`reactiveSearchEntrypointRepository.updateMetadataVectors` —
  metadata values are tokenised into the entity's
  `search_entrypoint.metadata_vector` per `V0_0_1__init.sql:193`); the
  filled-flag toggle (`data_entity_filled.INTERNAL_METADATA`); for
  the upsert path: NO `@ActivityLog` (the `CUSTOM_METADATA_UPDATED`
  enum is reserved but never fired — same forensic-silence pattern as
  DEG membership writes).

  **Three substantive write-path defects** (batch L PRIMARY SOURCE on
  upsertDataEntityMetadataFieldValue):
    1. **Silent 200-on-missing-pair / missing-entity** — the upsert path
       returns 200 OK with empty body for non-existent
       (dataEntityId, metadataFieldId) pairs. UI thunks claim success
       on writes that did not happen.
    2. **NO type validation against `metadata_field.type`** — the
       `value` is `text` regardless of declared type; a STRING-typed
       field accepts `"42"` but an INTEGER-typed field accepts
       `"not a number"`. Downstream readers must defend against
       arbitrary text content regardless of the type column.
    3. **EXTERNAL-origin overwrite is silent** — `upsertMetadataFieldValue`
       does not check `MetadataFieldPojo.getOrigin()`; a user with
       `DATA_ENTITY_CUSTOM_METADATA_UPDATE` (commonly granted via
       `dataEntity:owner` scope) can overwrite collector-ingested
       values until the next ingestion run replaces them. Pairs with
       the no-audit gap.

  **Plus a fourth — the active=NULL regression**: every upsert silently
  flips the `metadata_field_value.active` column from TRUE (the
  INSERT default) to NULL because the pojo construction at the
  service layer omits `setActive(...)` and the repository's UPDATE
  statement writes every column including the NULL-default.
