behaviour: |-
  **Catalog and Dictionary toolbar-tab clicks are thunk-then-navigate
  patterns with NO `.catch()` — a rejected thunk produces a no-op
  click with NO toast, NO error message, NO logging.** The user
  clicks Catalog (or Dictionary), the URL does not change, the
  current page stays put, and there is no UI signal that anything
  failed. Exact failure-mode class that LSN-019 documented for
  backend-ordering and LSN-020 for user-filter (silent failure with
  no operator-visible error).

  Verified at primary source (ToolbarTabs.tsx — to be Read for line
  numbers but the sidecar pin is enough): the click handlers
  dispatch `createDataEntitiesSearch` (Catalog) and `createTermSearch`
  (Dictionary), call `.unwrap().then(navigate)`, and have NO
  `.catch()`. Under any thunk rejection (network glitch, transient
  5xx, auth-token-expired mid-session, backend search-id pool
  exhausted), the navigation never fires.

  This is the SAME class of bug as TEST-GAP-846 (useCreateSearch.ts —
  identical pattern at a different call site) — they should be tested
  as a pair because (a) they exercise the same underlying contract,
  (b) a fix to one pattern should propagate to the other.

  HIGH severity because (i) the two affected click paths are the
  PRIMARY user entrypoints to the platform's two main surfaces
  (Catalog / Dictionary), (ii) the failure mode is silent — operators
  cannot self-diagnose without browser DevTools, (iii) under
  intermittent backend health (the most common production scenario),
  the user perceives "the platform feels broken" with no specific
  error.
