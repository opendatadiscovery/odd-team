realism_caveats: |
  - The probe assumes a `/api/internal/housekeeping/run-now` admin endpoint
    that force-triggers the housekeeping cycle. **THIS ENDPOINT DOES NOT
    EXIST** in the codebase (grep verified). To make the probe runnable,
    EITHER:
    (a) Author a test-profile admin endpoint, OR
    (b) Convert to a docker-compose override that sets fixedRate to 5s,
        sleep 10s, and check the partitions.

  - The probe specifically verifies the EMPTY-ONLY DROP contract — a
    CRITICAL safety invariant. Any code change that introduces
    hard-retention DROP of non-empty partitions would silently destroy
    audit data; this probe surfaces such a regression by asserting
    `nonempty_partition_exists_after == 1`.

  - The probe does NOT directly measure the lock-collision under load.
    A follow-up probe P-022-B would race a concurrent INSERT-storm
    against a housekeeping trigger and capture latency distribution
    under contention. That probe needs millisecond-precision timing
    coordination — out-of-scope of this initial pin.

  - The partition naming convention is `activity_YYYYMMDD_YYYYMMDD` per
    PartitionServiceImpl.java:144-147; the isPartitionInPast parser at
    PartitionServiceImpl.java:72-80 expects this format.

  - The probe runs under DISABLED auth. Housekeeping is auth-mode-
    agnostic; the admin endpoint (if authored per (a)) must be gated
    by profile, not by auth-mode.

  - If the hypothesis FAILS (i.e. nonempty_partition_exists_after == 0
    or surviving_row_count == 0), the housekeeping has destroyed audit
    data — file an URGENT regression backlog item (PRIORITY: critical).
