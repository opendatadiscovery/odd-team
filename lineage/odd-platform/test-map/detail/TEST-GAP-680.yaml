  Add `OwnerServiceImplTest.update_omittedAndEmptyRolesField_composesGetRoleIdsListNullCollapseWithDeleteOwnerRelationsExcept_destructiveEmptyRolesCascade`. (a) Mockito-mock `ownerRepository`, `ownerToRoleRepository`, `searchEntrypointRepository`, `termSearchEntrypointRepository`. (b) Stub `ownerRepository.get(id)` to return a populated OwnerPojo with id=1. (c) Stub `ownerRepository.updateWithoutSync` and the search-vector helpers as `Mono.empty`. (d) Invoke `ownerService.update(1L, new OwnerFormData().name("X"))` — no roles set. (e) `verify(ownerToRoleRepository).deleteOwnerRelationsExcept(1L, List.of())`. (f) `verify(ownerToRoleRepository, never()).createRelations(eq(1L), argThat(list -> !list.isEmpty()))`. (g) Repeat with `OwnerFormData().name("X").roles(List.of())` — assert IDENTICAL verification (both null and empty collapse to the same persistence call). (h) Add a `// REGRESSION-PIN — The 3-line composition (line 71 + lines 117-122 + lines 76-81) is the destructive-empty-roles cascade. A REFACTOR fixing any one line will flip this test, making the fix deliberate.` comment block. Distinct from TEST-GAP-622 because this is unit-level and operates on the service collaboration graph; TEST-GAP-622 is integration-level and operates on HTTP semantics.
