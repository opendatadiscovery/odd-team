name: Title Directory has no length/pattern/case normalisation — silent policy-leak class
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
  - P-09
description: |-
  NEW INVARIANT, batch ZE — `title.name varchar(128)` per
  V0_0_3__add_ownership.sql:4 carries NO @Pattern, NO @Size, NO
  enum check, NO trimming, NO case-folding, NO deduping by
  lowercase. The TitleServiceImpl.java:19-22 auto-create path
  inserts the raw user-typed string verbatim.

  ACCUMULATION OF VARIANTS — the directory accumulates
  'data steward', 'Data Steward', 'DATA STEWARD',
  ' Data Steward ' (leading space), 'data-steward',
  'data_steward', 'DataSteward' as DISTINCT rows the moment
  two operators type slightly different forms into the
  OwnerTitleAutocomplete (freeSolo: true at
  OwnerTitleAutocomplete.tsx:149).

  POLICY-LEAK CLASS — Title is a Policy condition field per the
  live /authorization/policies page:
    - `dataEntity:owner:title == 'Data Steward'`
    - `term:owner:title == 'Data Steward'`
  ANY policy wired against ONE casing variant SILENTLY MISSES
  every OTHER casing variant. Operators with hundreds of
  ownership grants over time accumulate Title-directory
  variants drift — the policy intended to gate 'Data Stewards'
  fails for owners titled 'data steward' or 'DBA' (lower case
  vs all-caps).

  Operator-visible failure mode is COMPOSITE — a maintainer
  reviewing policy effects must enumerate every
  case-and-whitespace variant of every condition Title to
  realise the gap exists. There is NO UI affordance to detect
  Title-variant pollution (no admin page, no de-dup tool).

  Cross-link: invariant:dashboard-title-filter-binds-ownership-title-not-dataset-name
  (LSN-020) — the Title directory has TWO operator-visible
  surfaces (ownership grants + DQ filter + Policy conditions);
  variants drift compounds across all three.

  FIX ANCHORS:
    (a) Schema-level CHECK constraint enforcing trim() +
        case-fold + normalised character set;
    (b) Service-tier normalisation in TitleService.getOrCreate
        before persistence;
    (c) Admin UI for de-duping existing variants and rebinding
        ownership grants;
    (d) Documentation surface naming the variant-drift class.

  Severity: MEDIUM (silent policy-leak class; auditability +
  authorization-effect-gap shape).
