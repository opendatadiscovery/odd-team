  derivation: "The most basic operator mental model: picking a non-DISABLED auth mode makes the platform require login. Pillar P-09 ('pick a UI auth mode') + IT-009's own contract (auth.type decides whether a route needs auth). Pillar-mission + doc-claim seed."
