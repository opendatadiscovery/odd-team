realism_caveats: |
  The probe pins the status-code drift only. If status_code == 200 the drift is
  confirmed and the fix is either (a) change the controller to
  ResponseEntity.status(CREATED) or (b) change openapi.yaml:454 to '200'. The
  probe does not decide WHICH side is wrong — REST convention favours 201 for
  resource creation, so the controller is the more likely defect. If
  status_code == 201 the controller was changed since commit 80637ed; re-read
  DataSourceController.java:30-36.
