  seeded_from: SHB-005
  drift_class: tag_origin_channel_ownership_asymmetric_external_protection
  description: |-
    SHB-005 anchors the THREE-CHANNEL ownership model on tag↔target
    relations (INTERNAL/EXTERNAL/EXTERNAL_STATISTICS) that determines who
    can mutate what. F-018 already names the side-channel-mint problem
    (collectors + 4 services bypass TAG_CREATE); SHB-005 surfaces the
    COMPLEMENTARY facet — per-relation ownership channel that determines
    who can MODIFY existing rows. Asymmetry: the data-entity side uses a
    boolean `external` column; the dataset-field side uses a `TagOrigin`
    enum with three values. A tag with INTERNAL data-entity relations +
    EXTERNAL dataset-field relations is NOT blocked by TagServiceImpl.update's
    guard (which reads only `tagDto.external()` aggregate — the data-entity
    side only).
