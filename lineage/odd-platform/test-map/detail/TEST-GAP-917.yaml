behaviour: |-
  **MEDIUM — a FAILED dashboard fetch (`GET /api/dataqatests/runs` returns 4xx/5xx or times out) shows the all-zero `initialData` placeholder identical to a genuinely empty catalog. The component destructures only `{ data, isSuccess }` from `useGetDataQualityDashboard` (`DataQualityContent.tsx:24`) — never `isError` / `error`. On a backend failure, react-query keeps `data` at `initialData` (all zeros), `isSuccess` stays false, `testResults` is `[]`, and the operator sees three grey 'No data' donuts with NO error message. A real backend failure is presented as 'your catalog has no data quality tests'.**

  **The contract drift** (statically certain):
  - `useGetDataQualityDashboard` wraps `useQuery({ queryKey, queryFn, initialData })` (`dataQuality.ts:77-81`) — no error callback, no `onError` handler, no `isError` destructure exposed to the caller.
  - `DataQualityContent.tsx:24` destructures only `{ data, isSuccess }` — `isError` is discarded.
  - All five `if (!data) return [...]` guards (`DataQualityContent.tsx:33, 44, 54, 66`) are dead while `initialData` is set (`data` is never undefined after first render) — so the empty-array path is taken on FAILED fetches as well as on EMPTY-catalog fetches.
  - The user-facing result is identical: three grey 'No data' donuts, zero category cards.

  **What an operator sees on a 500 from the backend**:
  - The dashboard renders. No loading spinner stuck. No error banner. No retry button. The grey 'No data' state.
  - There is no signal that the backend failed; the operator concludes the catalog has no DQ tests; they don't escalate; the platform reports green metrics; the failure is INVISIBLE until someone notices the dashboard stays grey across known-good ingestion runs.

  **Why MEDIUM**: it is a UX correctness defect (a failure presented as a null result), but the operator can disprove the empty-catalog reading by checking `/api/dataqatests/runs` directly in the network tab. The blast radius is bounded — only one dashboard surface. Sidecar self-rates MEDIUM. Single-pillar; MEDIUM stands.

  **Test gap shape**: integration test mocking `dataQualityRunsApi.getDataQualityTestsRuns` to reject (a) with HTTP 500, (b) with network error, (c) with HTTP 401. Three assertions: the component does NOT render the all-zero state silently — it SHOULD render an error banner (the test PINS the desired behaviour and FAILS today, so it is both a regression-pin AND an actionable bug-fix request). Alternatively: PIN the CURRENT (broken) behaviour and add a TODO comment requesting the fix.
