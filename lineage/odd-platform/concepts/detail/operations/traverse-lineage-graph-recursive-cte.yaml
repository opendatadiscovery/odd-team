notes: "Operation vocabulary captured for future DOC-NNN follow-ups on the\nlineage-graph\
  \ surface. Two doc-bugs are live on\n`/developer-guides/api-reference/lineage`:\n\
  \  (a) `lineage_depth` 'Unset returns the platform's default depth'\n      claim\
  \ is UNIMPLEMENTED — there is no default; unset is a\n      500 NPE.\n  (b) `expanded_entity_ids`\
  \ 'IDs of Data Entity Group entities'\n      claim is incorrect — code accepts ANY\
  \ data-entity IDs.\n\nSibling `/api/dataentitygroups/{id}/lineage` accepts no depth\n\
  parameter at all (openapi.yaml:2418-2433) — DEG-lineage is\nalways one-hop. This\
  \ shape inconsistency is undocumented.\n\nThe lineage-graph cross-owner enumeration\
  \ is one of the five\nsurfaces in the read-collaborative cross-cutting invariant\
  \ —\nlineage edges leak causal connections between entities owned by\ndifferent\
  \ teams.\n\n**Batch H repository-level detail**: the recursive-CTE has 5 specific\
  \ failure modes\nnow primary-source-confirmed at the SQL layer: no cycle guard (HIGH),\
  \ no owner JOIN\n(HIGH), no upper bound on depth (HIGH), diamond-DAG amplification\
  \ (MEDIUM), and the\nLineageDepth.empty() folklore (MEDIUM — the `empty` flag is\
  \ NEVER read inside\nlineageCte; only the depth integer is consulted; `empty()` means\
  \ 'seed-only', not\n'zero edges returned'). The two-overload split (`getLineageRelations(Set,\
  \ LineageDepth,\nLineageStreamKind)` for the recursive walk + `getLineageRelationsForDepthOne(List<Long>,\n\
  LineageStreamKind)` for the progressive-expansion fan-out) is the canonical 'recursive\n\
  walk for main subgraph + one-hop expansion for UI clicks' protocol — IMPLICIT\nADR\
  \ #2 at the repository.\n"
