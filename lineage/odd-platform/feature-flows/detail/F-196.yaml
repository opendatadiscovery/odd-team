feature_id: F-196
pillar_id: P-07
pillar_anchored_id: P-07:F-021-per-entity-tab
pillar_anchored_feature_name: Per-Entity Activity Tab — Sibling Surface to Global Activity Feed (F-021)
feature_name: |-
  Data-entity detail-page Activity tab — per-entity, entity-id-scoped variant of
  the Global Activity Feed (F-021). Different filter UX (no type-tabs axis,
  no MY_OBJECTS / UPSTREAM / DOWNSTREAM), distinct backend endpoint
  (`/api/dataentities/{id}/activity`), but inherits the same LSN-020
  `User` filter mislabel + provider-agnostic actor resolution drift.
