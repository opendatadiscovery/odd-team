behaviour: |-
  **CRITICAL — LSN-017 view_count doubling regression-pin at the UI PRIMARY-SOURCE anchor.** `DataEntityDetails.tsx:56-64` is the platform-wide canonical source-code anchor of LSN-017 (retrospective `retrospectives/LSN-017-per-node-scan-cannot-see-cross-layer-user-effects.md` cites this exact file:line as the bug locus). The useEffect's 5-element dependency array contains 4 externally-driven values plus 1 response-derived value (`details.status?.status`, line 63). On mount: dep-array = `[id, false, false, false, undefined]`; first dispatch fires `fetchDataEntityDetails`. When the response lands and Redux populates `details.status`, the dep-array flips to `[id, false, false, false, 'STABLE']`, triggering a SECOND identical fetch. The cycle quiesces at exactly +2 backend `view_count` UPDATE per page-open.

  **Empirically pinned by probe P-004** (run R-20260519T010758Z-P-004 — xhr_count=2 + DB delta=2 with regex-filtered exact `/api/dataentities/{id}` path match). **Fix is 1 line** (remove `details.status?.status` from dep-array line 63). The single most valuable test in the entire UI codebase is a Vitest + react-testing-library + mockStore suite that asserts "exactly 1 `fetchDataEntityDetails` dispatch per mount". That assertion flips from 2 → 1 the moment line 63 is removed; once flipped, it pins the fix against future drift.

  **Blast radius the test ALSO regression-pins:**
  - F-001 P-01:F-001 Popular Entities Ranking — the doubling AMPLIFIES this component's contribution to the home-page Popular strip ranking by exactly 2× (the producer-side amplification of the inflation loop confirmed at REFACTOR-220).
  - REFACTOR-220-confirmed inflation attacks are 2× cheaper from the UI than from a direct API call.
  - REFACTOR-221 (no index on `data_entity.view_count`) seq-scan cost is compounded by 2× row participation.
  - REFACTOR-201 (read-as-write @ReactiveTransactional) hot-row write contention is compounded by 2×.
  - Cross-pillar bug — UI-side cause, backend-side observable; no per-layer scan catches it.

  **Negative-cluster context (LSN-018 Rule 6 coherence)**: the second useEffect in this same file (lines 66-76) uses `[dataEntityId]` ONLY (line 76), demonstrating the author KNEW the correct pattern. Batch-Q's UI sibling cluster (PolicyList, RolesList, OwnersList, CollectorsList) plus batch-U TermDetails ALL verified to use externally-driven-only dep arrays. **This component is the SOLE platform-wide canonical instance of the response-derived-dep-array shape** — verified across 5 batch-Q + 1 batch-U sibling sidecars + the structural confirmation in this batch ZA sidecar.

  **Test gap shape**: TWO test surfaces, both required:
  1. **Vitest unit/integration test** asserting exactly 1 `fetchDataEntityDetails` dispatch per mount + per legitimate dep-array trigger (`dataEntityId`, `isDataEntityGroupUpdated`, `isDataEntityAddedToGroup`, `isDataEntityDeletedFromGroup`). Pins the dispatch-count invariant.
  2. **Playwright end-to-end probe** asserting `xhr_count=1` regex-filtered to the exact `/api/dataentities/{id}` path AND backend `view_count` delta = 1 across a single page-open. Promotes the one-shot probe P-004 to a CI-permanent regression-pin.
