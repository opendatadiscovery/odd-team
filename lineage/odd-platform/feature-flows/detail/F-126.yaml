terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Operator-observable page render at `/alerts/{all|my|dependents}` —
    a paginated list of AlertItem cards each carrying alert id,
    status, lastReason, type, dataEntity link, alertChunkList
    (collapsible), Resolve/Reopen Button (post-action permission
    discovery). Auto-redirect from `/alerts` bare-URL to
    `/alerts/all` (the cross-owner tab).
  evidence: |-
    Alerts.tsx:22-29 + AlertsRoutes.tsx:18 + AlertsList.tsx:83-107
    + AlertItem.tsx:113-192.
  cardinality_per_call: |-
    1 to 30 alert rows per fetchAlerts call (hardcoded page size);
    full alert set reached via InfiniteScroll page advancement.
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: bare-/alerts auto-redirect lands every user on the cross-owner All tab
    observed: |-
      AlertsRoutes.tsx:18 — `<Route path='/' element={<Navigate to='all' replace />} />`.
      A user landing on `/alerts` (e.g. via a toolbar link or a
      bookmarked URL) is auto-redirected to `/alerts/all`. The
      `/all` route mounts AlertsList wired to `fetchAllAlertList`
      which calls `GET /api/alerts` — per F-007 batch P + REFACTOR-024
      this is the cross-owner read endpoint. Every authenticated
      user — including unprivileged users who have no ownership
      association — lands on a cross-owner feed by default.
      Combined with AlertsTabs hiding My/Dependents for those
      same users, the ALL tab is the ONLY visible tab — implicit
      framing "alerts = platform-wide" instead of "alerts I can
      action".
    expected: |-
      Either (a) redirect to `/alerts/my` when the caller has
      ownership association (selector `getOwnership` already
      computed); fall back to `/alerts/all` when no ownership —
      with explicit empty-state messaging about user-owner
      mapping prerequisite (cross-link F-064), OR (b) explicit
      doc text framing the All tab as "platform-wide" so
      operators understand the read posture before they see
      cross-owner data.
    drift_class: alerts_default_redirect_to_all_silently_lands_unprivileged_users_on_cross_owner_feed
    provenance: |-
      STATIC PRIMARY-SOURCE — AlertsRoutes.tsx:18 + Alerts.tsx:20
      (showMyAndDepends from getOwnership selector) +
      AlertsTabs.tsx:30,36 (hidden conditions) + cross-ref
      F-007 batch P + F-014 cross-owner read posture +
      REFACTOR-024. Severity: MEDIUM (UX-framing + security-UX
      class). ui_unverified: false.
  - facet: AlertsTabs hidden property — UI hides tabs but backend routes remain navigable
    observed: |-
      AlertsTabs.tsx lines 30 & 36 set `hidden: !showMyAndDepends`
      on the My Objects and Dependents tab items. The AppTabs
      component honors `hidden` and suppresses the tab render.
      However, the corresponding routes `/alerts/my` and
      `/alerts/dependents` remain mounted in AlertsRoutes — a
      user with prior URL knowledge (or via browser history)
      can still reach them. Those routes will then fire
      `fetchMyAlertList` / `fetchMyDependentsAlertList`,
      which backend-side resolve via authIdentityProvider.
      For a caller with no user_owner_mapping (per F-064 silent-
      empty pattern), the page renders empty — visually
      indistinguishable from "no alerts in window". The hidden-
      not-blocked posture is a UX leak.
    expected: |-
      Either (a) AlertsRoutes guards the `/my` and `/dependents`
      sub-routes with a render-block when ownership is absent
      (redirect to /all OR render an explicit empty-state with
      F-064 framing), OR (b) explicit doc text on the alerting
      page about the three-tab axis + the ownership requirement.
    drift_class: alerts_tabs_hidden_property_hides_tab_but_routes_remain_directly_navigable
    provenance: |-
      STATIC PRIMARY-SOURCE — AlertsTabs.tsx:30,36 (hidden conditions)
      + AlertsRoutes.tsx:10-21 (all three routes mounted
      unconditionally) + F-064 silent-empty cross-ref. Severity:
      LOW (UX-leak — user reaches a half-broken view via direct URL).
      ui_unverified: false.
  - facet: AlertsList no filter UI — no status / type / date / entity-name search
    observed: |-
      AlertsList.tsx:37-108 — the listing renders alerts directly
      with NO filter UI. No status selector (OPEN / RESOLVED /
      RESOLVED_AUTOMATICALLY), no alert-type selector (FAILED_JOB /
      FAILED_DQ_TEST / BACKWARDS_INCOMPATIBLE_SCHEMA /
      DISTRIBUTION_ANOMALY), no date range, no entity-name search.
      Contrast with the Activity page (Filters.tsx) which exposes
      a 7-facet filter panel. The hardcoded page size=30 (line 72)
      means deep audits walk through dozens of round-trips.
    expected: |-
      Either (a) parallel Filters component analogous to the
      Activity page exposing status + type + date + entity-search,
      OR (b) explicit framing that the global Alerts page is a
      "recent alerts" view + cross-link to API for advanced
      filtering, OR (c) at minimum a status filter wiring the
      sibling counts endpoint pattern.
    drift_class: alerts_list_hardcoded_size_30_no_status_filter_no_type_filter_no_date_filter
    provenance: |-
      STATIC PRIMARY-SOURCE — AlertsList.tsx:37-108 (no filter
      composition) + Filters.tsx (the Activity-side contrast).
      Severity: MEDIUM (operator-effectiveness class — at scale
      the global Alerts list becomes hard to navigate).
      ui_unverified: false.
  - facet: alerts_global_page_no_doc_page — only inline mentions on entity pages
    observed: |-
      The live `documentation/docs/features/active-platform-features/alerting`
      doc covers Alerts at the FEATURE level + cross-links the
      per-entity alert view + the AlertManager workaround. There
      is no dedicated doc-page anchor for the `/alerts` global
      page itself — no enumeration of the three tabs, no
      framing of the cross-owner posture on the All tab, no
      mention of the silent-redirect from `/alerts` bare-URL.
      Operators learning the page do so via UI exploration.
    expected: |-
      Add a "Browsing the global Alerts page" section to the
      alerting doc page enumerating the three tabs + the auto-
      redirect behaviour + the cross-owner posture on All +
      the ownership-required posture on My/Dependents.
    drift_class: alerts_list_no_doc_page_anchored_at_alerts_route_only_inline_via_data_entity_pages
    provenance: |-
      STATIC — UI primary source + WebFetch /features/active-platform-features/alerting
      reference (the doc focuses on the per-entity workflow + the
      AlertManager workaround; the global page is not anchored).
      Severity: LOW (doc-class — operators discover via UI;
      consistency with the activity-feed doc page would be the
      target). ui_unverified: true   # the live alerting page is referenced via prior batch evidence, not re-WebFetched in this UI batch
  - facet: AlertsTabs ownership-selector silent-empty when mapped owner has no alerts
    observed: |-
      AlertsTabs.tsx:20 + Alerts.tsx:20 wire `showMyAndDepends`
      from `getOwnership` selector — this evaluates whether the
      caller HAS a user_owner_mapping (per F-064 chain). When
      true, the My + Dependents tabs are visible. But once the
      tabs are visible, clicking them fetches via the My/Dependents
      thunks which can STILL return zero rows (the mapped owner
      has no alerts on entities they own). The silent-empty
      F-064 pattern surfaces here too — user with a valid
      mapping sees the tab + the empty list + has no diagnostic
      hint distinguishing "no alerts" from "mapping problem"
      (since the mapping IS present, the empty IS legitimate
      but the UI still doesn't distinguish "your owned entities
      have no alerts" from "no alerts matching your tab"). Cross-
      link F-064 silent-empty pattern.
    expected: |-
      Either (a) inline empty-state messaging on the My/Dependents
      tabs ("No alerts on the X entities you own / the Y
      downstream dependents of your owned entities — last
      checked at T"), OR (b) total-count surfaced on the tab
      badges already differentiates (0 vs N) — but the user
      reads the EMPTY card render, not the badge. Strengthen
      the empty-state.
    drift_class: alerts_tabs_show_my_and_depends_consults_ownership_selector_but_silent_empty_remains_when_mapped_owner_has_no_alerts
    provenance: |-
      STATIC PRIMARY-SOURCE — AlertsTabs.tsx:20 + Alerts.tsx:20
      + AlertsList.tsx:101-105 (empty-state placeholder without
      contextual messaging) + F-064 silent-empty cross-ref.
      Severity: LOW (UX-class — affects unmapped + low-alert-volume
      operators uniformly). ui_unverified: false.
  - facet: alerts_global_page_no_bulk_resolve_no_export_no_search_by_data_entity_name
    observed: |-
      AlertsList.tsx renders alerts as individual cards; AlertItem
      provides a single Resolve/Reopen button per row. No bulk-
      select checkbox, no "resolve all matching X" affordance,
      no export-to-CSV, no search-by-entity-name on the list. An
      operator with 50 open alerts on a single dataset would
      click 50 times to resolve them all. Contrast with industry
      patterns where alert lists offer at minimum bulk-select.
    expected: |-
      Either (a) bulk-select + bulk-resolve UI (the backend
      already supports per-alert PUT, so this is purely a UI
      addition with a per-row permission re-check), OR (b)
      explicit doc framing the page as "manual triage" + cross-
      link to API for bulk operations, OR (c) search-by-entity-
      name input filtering the rendered set client-side.
    drift_class: alerts_global_page_no_bulk_resolve_no_export_no_search_by_data_entity_name
    provenance: |-
      STATIC PRIMARY-SOURCE — AlertsList.tsx:83-107 (no bulk-
      select scaffolding) + AlertItem.tsx (single-row Resolve).
      Severity: LOW (operator-effectiveness class — surfaces
      under sustained high-alert-volume scenarios). ui_unverified: false.
