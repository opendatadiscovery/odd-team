name: Data Quality Test Severity (MINOR / MAJOR / CRITICAL)
canonical_in_docs: true
canonical_candidate: false
description: |-
  Operator-set per-test importance — three values: MINOR | MAJOR | CRITICAL.
  Used in SLA-colour weight aggregation (SLACalculator.java:14-16, 35-60).
  Set via PUT /api/datasets/{data_entity_id}/dataqatests/{dataqa_test_id}/severity
  carrying a DataQualityTestSeverityForm payload. NEW entity, batch 2026-05-20T
  (DataQualityController class sidecar).

  Two critical defaults govern the runtime behaviour:
    (a) MAJOR is the implicit fallback at the SQL-tier left-join mapper
        (ReactiveDataQualityRepositoryImpl.java:142-148) when no
        DATA_QUALITY_TEST_SEVERITY row exists for a (test, dataset) pair.
        A dataset with 100 unset tests + 1 critical-failing test is computed
        AS IF every unset test were Major — possibly inflating Red/Yellow
        outcomes compared to the operator's mental model.
    (b) No operator-facing surface signals 'this is a default-MAJOR contribution,
        not an operator-set MAJOR'. The UI cannot distinguish the two
        provenances; severity is treated as a single derived field.

  Operator-facing severity-set flow (per live sla-statuses.md):
  'Open the dataset's main page → Test reports tab → click on a test result row →
  in the right-side panel, choose a severity (Minor, Major, or Critical)'.
  The audience setting severities is named verbatim as 'operator' in the docs —
  no permission name (DATASET_TEST_RUN_SET_SEVERITY) and no owner-scoping
  language appears.

  vocabulary_status: codebase-anchored + doc-side-partially-covered (live
  https://docs.opendatadiscovery.org/features/data-quality/sla-statuses 2026-05-20
  status 200 names the three severity values verbatim; the default-MAJOR fallback
  is NOT documented — see canonicalisation_candidates/default-major-severity-fallback-silently-inflates-sla).
vocabulary_status: codebase-anchored, doc-side-partially-covered
axes_present:
- controllers
nodes:
- odd-platform java DataQualityController controller-class:DataQualityController
contributors:
