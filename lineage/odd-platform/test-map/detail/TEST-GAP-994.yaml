proposed_action: |-
  Three-method test class `WithPermissionsProvider.semantic.test.tsx` under `odd-platform-ui/src/components/shared/contexts/Permission/__tests__/`:

  (a) `WithPermissionsProvider_renderingChildIsUnconditional`: mount `<WithPermissionsProvider allowedPermissions={[Permission.LOOKUP_TABLE_CREATE]}>` with `usePermissions().hasAccessTo` stub returning false for ALL permissions; assert the wrapped child IS rendered (the gate does NOT block); pins the deliberate context-only semantic.

  (b) `WithPermissions_renderingChildIsBlocked`: same setup but the SIBLING `<WithPermissions permissionTo={Permission.LOOKUP_TABLE_CREATE}>`; assert child is NOT rendered (returns null); pins the contrast that THIS wrapper IS the actual gate.

  (c) `WithPermissionsProvider_seedsContext`: assert that `<WithPermissions>` descendant correctly reads from the seeded context (the function the wrapper is named for is FULFILLED — context seeding works); pins the legitimate purpose so a future refactor knows to preserve it.

  Pair with a single integration test under `odd-platform-ui/src/__tests__/routes-permissions.posture.test.tsx`: drive `<App>` in a MemoryRouter with a minimum-privilege user; navigate to `/management/policies` AND `/data-modelling/query-examples` AND `/master-data/lookup-tables`; assert ALL THREE pages render (page chrome + list); pins the deliberate cross-route read-collaborative posture.

  Add a REGRESSION-PIN comment in WithPermissionsProvider.tsx:30 documenting: 'This wrapper does NOT block rendering — it seeds PermissionContext only. Use <WithPermissions> (no Provider suffix) to actually gate an affordance. See tests/WithPermissionsProvider.semantic.test.tsx for the contract.'
