name: List Popular Data Entities
canonical_in_docs: true
canonical_candidate: true
pillar_affinity:
- P-01
description: 'GET /api/dataentities/popular — the read-side closure of the view_count
  loop. Returns 9-field DataEntityRef projection ranked by view_count DESC (sole signal;
  id DESC tiebreaker). Surfaces entities across all owners to every authenticated
  caller. NO transactional boundary, NO enrichment, NO auth filter, NO owner predicate,
  NO rate-limit, NO anti-abuse. Trivially inflatable via scripted detail-reads. EXCLUDE_FROM_SEARCH
  is NOT applied (sole list-shape that ignores it). **Batch J — UI HALF (P-01
  pillar)**: the UI caller is `fetchPopularDataEntitiesList` redux-thunk dispatched
  ONCE on mount of `OwnerEntitiesList.tsx:58-64` via `useEffect(..., [])` (empty
  deps array, no polling, no auto-refresh). Hardcoded `{page: 1, size: 5}` — the
  UI consumes only the first 5 entries; no pagination, no view-more link, no infinite
  scroll. The response replaces `state.dataEntities.popular` wholesale via the
  fulfilled reducer at dataentities.slice.ts:205-208. Rendering gate (UI-only):
  the Popular column is one of four columns inside OwnerEntitiesList which is
  conditionally rendered only when `identity && ownership` (OwnerAssociation.tsx:84-86)
  AND `appInfo.authType !== ''DISABLED''` (Overview.tsx:25-27, :53-59) — under
  DISABLED-mode the Recommended panel is hidden, contradicting docs which say
  the panel IS visible under DISABLED. Each tile is a `<Link>` to
  `dataEntityDetailsPath(item.id)` (default path=''overview''); click triggers
  navigation that mounts DataEntityDetails which fires fetchDataEntityDetails
  which increments view_count. **F-001 LOOP CLOSURE on the client side**.'
