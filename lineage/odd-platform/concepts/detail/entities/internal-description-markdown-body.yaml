name: Internal Description (Markdown body)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: 'Free-text Markdown stored verbatim in data_entity.internal_description
  (Postgres text, unbounded) — the largest per-entity free-text write surface on the
  platform. Distinct from Description (external/ingested), which is owned by the collector
  ingestion pipeline. **Batch J — UI HALF (P-01 pillar)**: the canonical UI cluster
  is `DataEntityDetails/Overview/OverviewDescription/` — six TSX files compose:
  `OverviewDescription` (section shell with collapse-on-overflow), `InternalDescription`
  (read/edit toggle + useTermWiki hook wiring), `InternalDescriptionHeader` (Edit
  button + [[ns:term]] syntax tooltip), `InternalDescriptionPreview` (render path
  via <Markdown value>), `InternalDescriptionEdit` (write path via <Markdown editor>),
  + the shared `Markdown` element. **Permission gating is PARTIAL**: only the Edit
  affordance is wrapped in `<WithPermissions
  permissionTo={Permission.DATA_ENTITY_DESCRIPTION_UPDATE}>`; the description CONTENT
  is rendered to every authenticated user with DATA_ENTITY_VIEW on the entity. The
  Markdown rendering pipeline has NO rehype-sanitize (transitively pulls rehype-raw
  via @uiw/react-markdown-preview) — P-009 empirically pinned dangerous tags reach
  the DOM (execution blocked only by Chromium HTML-parser policy + React attribute
  filtering). The `useTermWiki` hook (useTermWiki.ts:30-228) parses `[[Namespace:TermName]]`
  mentions on every keystroke + every description-prop change — fires
  GET /api/terms/namespaces/{ns}/names/{name} once per unique unresolved term
  (memoised in fetchedTerms / unsuccessfulTerms). UI saves via Shift+Enter (undocumented
  keyboard shortcut) OR Save button → dispatches `updateDataEntityInternalDescription`
  thunk → PUT /api/dataentities/{id}/description. Cancel re-syncs state to discard
  in-flight edits (no draft preservation, no autosave). The Markdown wrapper
  auto-enables spellcheck via DOM mutation on hard-coded id="md-editor" — multiple
  concurrent editors race on the same id.'
