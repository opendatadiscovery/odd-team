        - "**Metric labels propagated VERBATIM from ingestion payload to Prometheus proto label list** — no allowlist, no PII filter. If a collector ingests a metric whose labels carry PII (`user_email=...`, `dataset_owner_email=...`), that PII is written verbatim to the operator's Prometheus and becomes readable to every operator/team with access to the Prometheus UI. Cardinality risk is the well-known Prometheus property; ODD adds no pre-filtering. Severity MEDIUM (CounterTimeSeriesExtractor@L20.md:security.known_security_gaps.[1])"
        - "**No rate-limit / per-tenant quota** on metric ingestion at this layer. A misbehaving collector POSTing high-cardinality labels can balloon Prometheus storage on the operator's shared Prometheus — no per-tenant cap protects co-tenants. Severity LOW (CounterTimeSeriesExtractor@L20.md:security.known_security_gaps.[2])"
        - "**Tenant-isolation is by-label-convention, not enforcement** — see Multi-Tenant Configuration concept; cross-link to the tenant-id label asymmetry"
      cross_file_inconsistencies: []
      contributing_files:
        - "CounterTimeSeriesExtractor@L20.md"
      evidence:
        - "CounterTimeSeriesExtractor@L20.md:security.data_exposure"
        - "CounterTimeSeriesExtractor@L20.md:security.known_security_gaps.[0-2]"
    performance_aggregate:
      overall: MEDIUM
      hot_paths:
        - "extractTimeSeries invoked on every metric_point of every metric of every metric_family of every metric_set in every POST /ingestion/metric_sets request — quadruple-nested loop; dispatcher resolution is O(M) over M extractor beans (currently 4) per metric-point per call"
        - "Entire ingestion request batch serialised into a single Prometheus remote-write payload, Snappy-compressed, POSTed in one shot. Latency of operator's Prometheus is on the per-request critical path"
      throughput_shape:
        verdict: BATCH_FRIENDLY
        detail: "A MetricSetList of N MetricSets each with M MetricFamilies fans out to N*M*P TimeSeries records (P metric points per metric), all sent in a single Snappy-compressed POST. No per-MetricSet streaming or chunking — whole list must fit in the WebClient codec budget (`spring.codec.max-in-memory-size` default 20MB)."
      scaling_shape:
        verdict: HORIZONTALLY_SCALABLE
        detail: "Stateless component — each extractor instance holds tenantId + IngestionMetricsMapper reference. Multiple replicas write to the same Prometheus host — Prometheus's own write throughput is the cluster-wide scaling ceiling. No per-replica sharding."
      strengths:
        - "Reactive Mono signature on saveMetricsToPrometheus — non-blocking on JVM side"
        - "Single shared WebClient per service — no per-request client construction"
        - "Stateless extractor instances — safe to reuse across requests"
      weaknesses:
        - "**No retry / backoff / DLQ on Prometheus /api/v1/write failures** — `onErrorMap` rethrows as `PrometheusException`; transient Prometheus outage loses the entire batch. No in-memory queue, no Postgres fallback, no eventual-consistency. Severity MEDIUM (CounterTimeSeriesExtractor@L20.md:performance.known_performance_gaps.[0])"
        - "**One bad point aborts the entire batch** — `counterValue.getTotal() == null` throws IllegalArgumentException at request time; exception escapes the Mono upstream of webClient.post(); no per-extractor try/catch. A single bad counter from one DataEntity rejects metrics for every co-batched DataEntity. Severity MEDIUM (CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[2])"
        - "**No codec override on Prometheus WebClient** — bounded by `spring.codec.max-in-memory-size: 20MB`. Large ingestion request (high-cardinality / high-fanout) producing >20MB Snappy-compressed Prometheus write silently fails at the codec layer with DataBufferLimitException before the POST is sent"
        - "**`Double.NaN` substitution divergence between storage backends** — Prometheus path emits NaN where Postgres path stores null. Same input metric produces divergent query behaviour across storage backends. Severity LOW (CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[3])"
        - "**Linear-scan dispatcher per metric point** — `getExtractor(MetricType)` is O(M) where M = number of TimeSeriesExtractor beans. Small today (M=4); future extractor-set explosion would multiply request latency. Severity LOW (CounterTimeSeriesExtractor@L20.md:performance.known_performance_gaps.[1])"
      cross_file_inconsistencies: []
      contributing_files:
        - "CounterTimeSeriesExtractor@L20.md"
      evidence:
        - "CounterTimeSeriesExtractor@L20.md:performance.hot_paths"
        - "CounterTimeSeriesExtractor@L20.md:performance.known_performance_gaps.[0,1]"
        - "CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[2,3]"
    notes: |
      The Counter sidecar at @L20 is representative — the same concept
      spans Gauge / Histogram / Summary mirrors in the same package (one
      pair of beans per MetricType, gated by the same `metrics.storage`
      switch). main-concepts.md does not name "Metrics" or "Metrics
      Ingestion" as a canonical concept; the live `/configuration-and-deployment/odd-platform`
      page documents the config keys but does NOT surface the per-MetricType
      fan-out, the silent-third-value fallthrough (a `metrics.storage` value
      outside the enumeration produces a zero-extractor config that throws
      at request time), or the read/write tenant-id label asymmetry (split
      into the separate Multi-Tenant Configuration concept).

  - name: "Multi-Tenant Configuration (odd.tenant-id)"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Single-string config key `odd.tenant-id` (default empty per application.yml:208-210) that, when `metrics.storage=PROMETHEUS`, is appended as a `tenant_id` label on every Prometheus TimeSeries write — enabling a single shared Prometheus to serve metric data for multiple ODD Platform deployments without their series colliding. ONLY meaningful in PROMETHEUS metrics-storage mode (ignored under INTERNAL_POSTGRES). vocabulary_status: codebase-anchored, doc-side-partially-covered (live `/configuration-and-deployment/odd-platform#prometheus-tenant-label-odd-tenant-id` documents the read-side semantics — 'empty means no label is applied, and the Prometheus query returns series across all tenants' — but does NOT document the read/write asymmetry on empty-string)."
    vocabulary_status: "codebase-anchored, doc-side-partially-covered"
    axes_present:
      - config_prefixes
    nodes:
      - "odd-platform java CounterTimeSeriesExtractor config-key-consumer:metrics.storage@L20"
    contributors:
      - "CounterTimeSeriesExtractor@L20 (via AbstractTimeSeriesExtractor.java:21-22, 60-62): tenant_id label append at write side when `tenantId != null`; ExternalMetricReader.java:111 uses `StringUtils.isNotEmpty(tenantId)` at read side — divergent treatment of empty-string vs null"
    evidence:
      - "CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[0,1] (read/write tenant-id label asymmetry; by-label-convention isolation, not enforcement)"
      - "CounterTimeSeriesExtractor@L20.md:security.known_security_gaps.[0] (shared-Prometheus tenant-isolation HIGH)"
      - "CounterTimeSeriesExtractor@L20.md:docs_link_semantic.doc_drift_findings.[0]"
    security_aggregate:
      overall: LOW
      auth_modes_relevant: []
      ingestion_filter_relevance: "N/A"
      authorization_consistency:
        verdict: "N/A"
        detail: "Config-key isolation surface. No HTTP gating; tenant isolation is by-label-convention at the metrics-storage layer."
      owner_scoping:
        verdict: BYPASSES
        detail: "Tenant identity is operator-config-supplied at startup, NOT user-scoped at request time. No server-side validation, no allowlist, no uniqueness check across ODD Platform instances sharing the same Prometheus."
      strengths:
        - "Live doc at `/configuration-and-deployment/odd-platform#prometheus-tenant-label-odd-tenant-id` documents the intent (shared-Prometheus multi-tenancy enabler)"
        - "Default empty (no label applied) is a sane default for single-tenant deployments"
      weaknesses:
        - "**Read/write tenant-id label asymmetry on empty-string (HIGH severity)** — Write side `AbstractTimeSeriesExtractor.java:60` uses `if (tenantId != null)`: an empty string PASSES the guard and writes a `tenant_id=\"\"` label. Read side `ExternalMetricReader.java:111` uses `StringUtils.isNotEmpty(tenantId)`: an empty string FAILS the guard and the read filter omits the tenant_id clause. Net: if an operator supplies `ODD_TENANT_ID=` (env var set to empty, NOT unset), every write goes to a series tagged `tenant_id=\"\"` but reads query across all tenants. In a shared-Prometheus multi-tenant deployment this either (a) buries this tenant's series under an unfilterable label that other tenants don't have, or (b) causes this tenant's reads to return series from co-tenants whose tenantId was null. (CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[0])"
        - "**Tenant isolation is by-label-convention, not enforcement (MEDIUM severity)** — no server-side validation that two ODD Platform deployments don't accidentally share the same `odd.tenant-id` against the same `metrics.prometheus-host`. Their series merge silently. Mid-life rebrand / typo correction makes historical series at the old label unreachable from `ExternalMetricReader` reads. (CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[1])"
        - "**No hot-reload** — `tenantId` is `@Value` constructor-injected once; Spring Cloud Config refresh would NOT propagate to live extractor instances. Platform restart required to change tenant. Severity LOW (CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[4])"
        - "**Shared-Prometheus tenant-isolation depends on operator-supplied tenant_id discipline (HIGH severity)** — combined with the empty-string asymmetry, the multi-tenant guarantee is brittle. Severity HIGH (CounterTimeSeriesExtractor@L20.md:security.known_security_gaps.[0])"
      cross_file_inconsistencies: []
      contributing_files:
        - "CounterTimeSeriesExtractor@L20.md"
      evidence:
        - "CounterTimeSeriesExtractor@L20.md:security.known_security_gaps.[0]"
        - "CounterTimeSeriesExtractor@L20.md:bugs_limitations_corner_cases.[0,1,4]"
    performance_aggregate:
      overall: HIGH
      hot_paths: []
      throughput_shape:
        verdict: "N/A"
        detail: "Config-key concept, not a throughput surface. The label-append cost is part of the parent Metrics Ingestion concept's hot path."
      scaling_shape:
        verdict: HORIZONTALLY_SCALABLE
        detail: "tenantId is captured at bean construction; horizontally scalable extractor instances each carry their own immutable copy of the configured value. No coordination, no contention."
      strengths:
        - "Per-instance immutable tenantId — no per-request lookup cost, no shared mutable state"
      weaknesses: []
      cross_file_inconsistencies: []
      contributing_files:
        - "CounterTimeSeriesExtractor@L20.md"
      evidence: []
    notes: |
      Multi-Tenant Configuration is a sub-concept of Metrics Ingestion but
      operationally distinct enough to merit its own catalog entry: it
      carries its own retrospective-class finding (the empty-string
      read/write asymmetry is the LSN-002-class concern flagged in the
      input prompt — same shape as MinIO's silent us-east-1 pin: a primitive
      default silently breaks the feature when an operator thinks they
      configured it). main-concepts.md does not name "Tenant" or
      "Multi-Tenant" as canonical vocabulary. Recommended canonicalisation:
      add a "Multi-Tenant Metrics" section to the operator reference
      explicitly stating the asymmetry — "leave odd.tenant-id UNSET (not
      empty-string) in single-tenant deployments" — and consider tightening
      the write-side guard to `StringUtils.isNotEmpty(tenantId)` for
      consistency.

  - name: "Deployment Introspection (/api/appInfo)"
    canonical_in_docs: false
    canonical_candidate: true
    description: "`GET /api/appInfo` is a pre-auth (under DISABLED) / post-auth (under LOGIN_FORM/OAUTH2/LDAP) endpoint that returns `{projectVersion, authType}` — used by the frontend SPA to discover which auth mode the backend is running so it can render the appropriate login flow. The endpoint is the REPORTER of the active auth mode (it READS `auth.type` and echoes the string in the response body). Distinct from the consumer-of-mode pattern used by the four `*SecurityConfiguration` classes. Carries deployment metadata that is operator-sensitive under `auth.type=DISABLED` (the application.yml default) — passive fingerprinting surface for network attackers. vocabulary_status: codebase-anchored, doc-side-absent (live `enable-security` does NOT name `/api/appInfo` or document the auth-mode echo)."
    vocabulary_status: "codebase-anchored, doc-side-absent"
    axes_present:
      - controllers
      - config_prefixes
    nodes:
      - "odd-platform java AppInfoController config-key-consumer:auth.type@L18"
    contributors:
      - "AppInfoController@L18: entities[AppInfo DTO {projectVersion: String, authType: String}, BuildProperties]; operations[inject-auth.type-as-String, echo-authType-into-response]; invariants[authType field initialised once at controller construction (final field); no normalisation, no enum mapping at this layer]"
    evidence:
      - "AppInfoController@L18.md:concepts.entities + concepts.operations + concepts.invariants"
      - "AppInfoController@L18.md:implicit_adrs.[0,1] (deliberate published-contract field for SPA + reporter-not-reactor pattern via @Value vs @ConditionalOnProperty)"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - DISABLED
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: UNGATED
        detail: "Controller has no @PreAuthorize, no programmatic permission check. Path `/api/appInfo` is not in `SecurityConstants.SECURITY_RULES`. Generated `AppInfoApi` interface has no @PreAuthorize and no SecurityRequirement. Falls through to whatever the active SecurityWebFilterChain decides for 'any path not in WHITELIST_PATHS / SECURITY_RULES' — `authenticated()` for LOGIN_FORM/OAUTH2/LDAP, `permitAll()` for DISABLED."
      owner_scoping:
        verdict: "N/A"
        detail: "Endpoint returns deployment metadata, not data entities."
      strengths:
        - "The published contract intentionally exposes authType — this is the SPA's login-flow gate, not an accidental leak. AppInfoApi.java:43 + AppInfo.java:48-66 confirm the field is part of the OpenAPI surface"
      weaknesses:
        - "**Under `auth.type=DISABLED` (application.yml default), the endpoint is anonymously reachable and discloses {projectVersion, authType} to any network caller** — passive fingerprinting surface. Severity MEDIUM. (AppInfoController@L18.md:security.known_security_gaps.[0])"
        - "**Empty-string `auth.type` injection silently produces a deployment with no SecurityWebFilterChain bean** — `@Value(\"${auth.type}\")` declares no default; if an operator overrides to empty string (`AUTH_TYPE=` env var), Spring injects empty string, controller echoes it, and every downstream `@ConditionalOnProperty(havingValue=\"...\")` fails to match. Severity LOW (AppInfoController@L18.md:security.known_security_gaps.[1])"
        - "**No enum validation** — typo (`OUATH2`) silently disables all `@ConditionalOnProperty` matches and produces the same no-SecurityWebFilterChain deployment, with `/api/appInfo` echoing the typo. No boot-time fail-fast. Severity LOW (AppInfoController@L18.md:security.known_security_gaps.[2])"
        - "**Whitelist gap for LOGIN_FORM**: `/api/appInfo` is NOT in `SecurityConstants.WHITELIST_PATHS` and NOT in `LoginFormSecurityConfiguration.permittedPaths`. Under LOGIN_FORM the SPA needs the response BEFORE the user authenticates (to render the form). Either the current configuration is relying on a path I have not traced, or the SPA calls /api/appInfo post-auth in LOGIN_FORM mode — undocumented behaviour either way. Severity MEDIUM (AppInfoController@L18.md:bugs_limitations_corner_cases.[4])"
      cross_file_inconsistencies:
        - "AppInfoController@L18 is the only sidecar where `auth.type` is itself the DATA being exposed — all other controller sidecars treat it as opaque gating. The two layers (consumer-of-mode vs reporter-of-mode) coexist in the codebase and the catalog has to surface both."
      contributing_files:
        - "AppInfoController@L18.md"
      evidence:
        - "AppInfoController@L18.md:security.known_security_gaps.[0,1,2]"
        - "AppInfoController@L18.md:bugs_limitations_corner_cases.[0,1,2,3,4]"
    performance_aggregate:
      overall: HIGH
      hot_paths: []
      throughput_shape:
        verdict: SINGLE_ITEM_ONLY
        detail: "Single-call, single-response — `Mono.just(new AppInfo(...)).map(ResponseEntity::ok)`. No streaming, no backpressure, no bulk."
      scaling_shape:
        verdict: HORIZONTALLY_SCALABLE
        detail: "Stateless controller. authType captured at construction (final field). Horizontal scaling unaffected."
      strengths:
        - "Pure in-memory field access — no DB round-trip, no I/O"
        - "Trivial allocation cost (new AppInfo DTO per request)"
      weaknesses: []
      cross_file_inconsistencies: []
      contributing_files:
        - "AppInfoController@L18.md"
      evidence: []
    notes: |
      The concept name "Deployment Introspection" is the closest available
      label; the live docs name neither the concept nor the endpoint.
      Recommended canonicalisation: add a "Deployment Introspection"
      section to the live `enable-security` page covering (a) which fields
      `/api/appInfo` exposes, (b) the fingerprinting surface under
      `auth.type=DISABLED`, (c) the operator's options for restricting
      pre-auth access (whitelist gap discussion). The 2026-05-10B sidecar
      surfaces this as a doc-drift candidate for the maintainer's DOC-NNN
      queue.

  - name: "Attachment"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Per-data-entity attachments — uploaded files (chunked multipart upload) and external links — accessible under `/api/dataentities/{data_entity_id}/{attachments|files|links}*`. Files use a 3-step state machine (initiate → upload-part(s) → complete) keyed by a server-issued `uploadId` UUID. Storage backend is operator-configurable (LOCAL filesystem default vs REMOTE S3-compatible); however chunk staging path `/tmp/odd/chunks` is hardcoded and storage-mode-independent (DataEntityAttachmentController + AttachmentServiceImpl + uploadFileChunk + attachment config-prefix sidecars)."
    axes_present:
      - controllers
      - config_prefixes
    nodes:
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController"
      - "odd-platform java AttachmentServiceImpl config-key-consumer:attachment.max-file-size@L27"
      - "odd-platform yaml application.yml config-prefix:attachment"
      - "odd-platform java DataEntityAttachmentController controller-method:uploadFileChunk"
    contributors:
      - "DataEntityAttachmentController: entities[DataEntityAttachments, DataEntityFile, DataEntityLink, DataEntityUpload, uploadId]"
      - "AttachmentServiceImpl@L27: entities[DataEntityUploadOptions, DataEntityFile, attachment upload session]"
      - "attachment config-prefix: entities[attachment storage backend, S3-compatible bucket, local filesystem path, attachment upload session, attachment file size cap]"
      - "uploadFileChunk: entities[uploadId, index, Part, dataEntityId]; operations[parse-chunk-index, delegate-chunk-upload, lift-to-200-ok]; invariants[uploadId is authoritative session key, dataEntityId cosmetic at chunk-upload]"
    evidence:
      - "DataEntityAttachmentController.md:concepts.entities.[DataEntityAttachments]"
      - "AttachmentServiceImpl@L27.md:concepts.entities.[DataEntityUploadOptions]"
      - "attachment-config-prefix.md:concepts.entities.[attachment storage backend, S3-compatible bucket]"
      - "uploadFileChunk.md:concepts.invariants.[0] (uploadId authoritative; dataEntityId cosmetic)"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: INCONSISTENT
        detail: "POST/PUT/DELETE on `/files/**` and `/links/**` gated by DATA_ENTITY_ATTACHMENT_MANAGE (SecurityConstants.java:247-276); GET endpoints (`getAttachments`, `getUploadOptions`, `downloadFile`) carry NO permission gate — only authentication required. Six gates on writes, zero gates on reads. Chunk-upload path matches `POST /api/dataentities/{data_entity_id}/files/**` glob and IS gated — but the gate evaluates against URL's data_entity_id while the file row resolves by uploadId, enabling cross-entity hijack (uploadFileChunk.md:security.known_security_gaps.[0])."
      owner_scoping:
        verdict: BYPASSES
        detail: "Read endpoints return data without owner filtering. `getAttachments` and `downloadFile` accept dataEntityId only, no caller-identity, no ownership filter. Combined with the missing-GET-gate, any authenticated user can read every data entity's attachments and download every file. Whether this is intentional read-availability or a missed gate is unresolved. Chunk-upload write path is N/A (no data returned), but the cross-entity hijack is owner-scoping-adjacent — gate context entity (path) and mutated entity (uploadId) diverge."
      strengths:
        - "DATA_ENTITY_ATTACHMENT_MANAGE permission centralised in SECURITY_RULES with DATA_ENTITY policy context (per-entity policy evaluation)"
        - "Live doc page acknowledges DATA_ENTITY_ATTACHMENT_MANAGE in `#rbac` section (operators can find the gate)"
        - "Chunked-upload state machine requires the uploadId's FilePojo to be in PROCESSING state (FileServiceImpl.java:93-102) — guards against late chunk arrivals after completion"
      weaknesses:
        - "Read-path authorization asymmetry — GET endpoints unprotected (severity HIGH per controller sidecar). Live doc names DATA_ENTITY_ATTACHMENT_MANAGE but is silent on read-side posture"
        - "Server-side attachment.max-file-size cap is advertised via getUploadOptions but NOT enforced on the chunked upload path — non-browser caller can submit arbitrary-size chunks (severity HIGH per consumer + controller + uploadFileChunk sidecars; tracked as REFACTOR-013 HIGH)"
        - "S3 credentials (attachment.remote.access-key, attachment.remote.secret-key) exposed via /actuator/env by default (Spring Boot Actuator's standard exposure list with endpoint.env.enabled: true) — Spring's default key-pattern sanitisation masks values but the keys themselves leak (severity HIGH per config-prefix sidecar)"
        - "Cross-entity uploadId hijack: a user with DATA_ENTITY_ATTACHMENT_MANAGE on entity X who learns another user's uploadId Y issued for entity Z can post chunks via `POST /api/dataentities/X/files/uploads/Y/chunks` — gate authorises path's data entity, service forwards to uploadId's data entity. Confirmed at method level (uploadFileChunk.md:security.known_security_gaps.[0] MEDIUM)"
        - "Same-`index` race: client retries chunk index=3 while prior attempt still flushing — `transferTo` is last-writer-wins; assembled file may silently include partial bytes from the prior attempt (uploadFileChunk.md:bugs_limitations_corner_cases.[4] MEDIUM)"
        - "No audit logging on attachment download (severity MEDIUM); no audit logging on chunk acceptance either — cross-entity hijack leaves no application-side trace (uploadFileChunk.md:security.known_security_gaps.[2] MEDIUM)"
        - "No virus / malware scanning on upload — storage backends are passive byte sinks; live doc advertises 'no restriction on file type' (severity MEDIUM)"
        - "Content-Disposition filename injection on download — `filename=\" + dto.fileName()` unsanitised (severity MEDIUM)"
        - "No rate limit / per-uploadId concurrency cap — thousands of in-flight chunks against one uploadId amplify the disk-DOS surface against /tmp/odd/chunks (uploadFileChunk.md:bugs_limitations_corner_cases.[5] MEDIUM)"
      cross_file_inconsistencies:
        - "Server-side enforcement bypass surfaces in THREE sidecars (controller + AttachmentServiceImpl@L27 consumer + uploadFileChunk method) — same root cause documented at three layers; cross-ref strengthens the systemic-finding signal"
        - "Live doc danger box on LOCAL ephemerality (LSN-001) is consistent across config-prefix and controller sidecars; YAML default still ships `/tmp/odd/attachments`; uploadFileChunk reveals chunk path /tmp/odd/chunks is ALSO ephemeral AND storage-mode-independent — operator following defaults vs operator following docs diverge"
      contributing_files:
        - "DataEntityAttachmentController.md"
        - "AttachmentServiceImpl@L27.md"
        - "attachment-config-prefix.md"
        - "uploadFileChunk.md"
      evidence:
        - "DataEntityAttachmentController.md:security.known_security_gaps.[0-5]"
        - "AttachmentServiceImpl@L27.md:security.known_security_gaps.[0] (server-side bypass HIGH)"
        - "attachment-config-prefix.md:security.known_security_gaps.[0] (S3 creds via /actuator/env HIGH)"
        - "uploadFileChunk.md:security.known_security_gaps.[0-3] (hijack, no virus scan, no audit log, no size enforcement)"
    performance_aggregate:
      overall: LOW
      hot_paths:
        - "downloadFile — every UI download click streams Resource via reactive pipeline; LOCAL → page-cache, REMOTE → one S3 GetObject per request — DataEntityAttachmentController"
        - "uploadFileChunk — once per chunk per upload (N invocations for N-MB file at default chunk size); each call dispatches Integer.parseInt(index), checkProcessingUploadById DB SELECT, then FilePart.transferTo filesystem write (uploadFileChunk.md:performance.hot_paths.[0])"
        - "getAttachments — every entity-detail page load (Attachments tab); two parallel DB reads via Mono.zip — DataEntityAttachmentController"
        - "getUploadOptions — every upload-dialog open; multiplies maxFileSize × 1_000_000 inline — AttachmentServiceImpl@L27"
      throughput_shape:
        verdict: STREAMING
        detail: "Chunked upload supports multi-part transfers but no single-request multi-chunk batch endpoint. Single-file download per request — no Range request support. Bulk-create on links via DataEntityLinkListFormData (single-request multi-link create); updates and deletes are single-item per request. Each chunk POST carries TLS + HTTP-framing overhead per chunk."
      scaling_shape:
        verdict: STATEFUL_LOCKED
        detail: "Chunked-upload session state lives in storage backend keyed by uploadId. For LOCAL storage the finalised file path is per-instance filesystem — chunks staged on instance A cannot be completed by instance B without a shared volume. Chunk staging path /tmp/odd/chunks is hardcoded in FileUtils.CHUNK_BASE_PATH (FileUtils.java:24) and is storage-mode-independent — applies to BOTH attachment.storage=LOCAL AND REMOTE. The class-level sidecar identified the LOCAL multi-instance risk; the method-level uploadFileChunk sidecar reveals it's universal."
      strengths:
        - "Chunk persistence streams via FilePart.transferTo(Path) — chunk-bounded memory; aggregate memory pressure scales with concurrent in-flight chunks, NOT total upload size"
        - "Stateless controller (only injected service collaborator) — horizontal scaling unconstrained at controller layer"
        - "Reactive Mono/Flux — non-blocking on server I/O thread"
      weaknesses:
        - "LSN-001 — LOCAL default writes to ephemeral `/tmp/odd/attachments`; container/pod restart wipes all uploaded files. YAML still ships this default despite live doc danger box (severity HIGH)"
        - "Multi-instance LOCAL storage broken: chunk staging directory keyed by uploadId only, no replica id; cross-replica chunk assembly is undefined. uploadFileChunk method-level finding extends scope: this applies to REMOTE storage too because the chunk staging path is upstream of the storage-backend dispatch (severity HIGH; uploadFileChunk.md:performance.known_performance_gaps.[0])"
        - "LSN-002 — REMOTE on AWS S3 silently restricted to us-east-1 (MinioConfig.minioClient() omits .region(...); MinIO SDK defaults to us-east-1 for SigV4) (severity HIGH)"
        - "MinIO SDK HTTP-client timeouts (~5min) not configurable — slow networks combined with large attachment.max-file-size produce unrecoverable socket timeouts"
        - "Per-chunk DB round-trip via checkProcessingUploadById gating each chunk write — for a 200-MB upload split into 200 × 1-MB chunks that's 200 DB SELECTs against `file` table (uploadFileChunk.md:performance.known_performance_gaps.[1] LOW)"
