terminal_side_effect:
  side_effect_class: db-delete
  description: |-
    Per 15-minute cycle: up to 5 sequential jOOQ DELETE/DROP statements (3 TTL-driven
    purges + 2 empty-partition drops). On a busy system the DataEntityHousekeepingJob
    cascade alone can be ~25 distinct DELETE statements per soft-deleted entity, all in
    one transaction. The terminal effect is the row deletion / partition drop in the
    Postgres catalog tables.
  evidence: |-
    HousekeepingJobManager.java:33-35 (the for-loop) + AlertHousekeepingJob.java:40-43
    (the DELETE) + SearchFacetsHousekeepingJob.java:23-27 (the DELETE) +
    DataEntityHousekeepingJob.java:99-126 (the ~25-table cascade) +
    EmptyPartitionsHousekeepingJob (the DROP PARTITION).
  cardinality_per_call: 'cycle_jobs × rows_past_TTL (variable; can reach thousands per cycle on busy systems)'
amplification_factor: '5 jobs × N_eligible_rows_per_job per 15-minute cycle (cluster-wide ONE active instance via ShedLock)'
amplification_factor_provenance: |-
  STATIC — confirmed from primary-source in batch K HousekeepingJobManager sidecar.
  The cluster-wide multiplier is 1 (leader-elected via ShedLock advisory lock — one
  active instance per 15-min slot). Within a cycle: 5 sequential jobs × per-job
  row count. The per-job multiplier scales with the soft-delete backlog —
  unbounded at the schedule level (no rate-limit, no max-rows-per-cycle cap, no
  pagination of DataEntityHousekeepingJob's ~25-table cascade).
observed_vs_expected:
  facets:
  - facet: AlertHousekeepingJob jOOQ operator-precedence bug
    observed: |-
      AlertHousekeepingJob.java:28-34 chains `.where(STATUS.eq(RESOLVED)).or(STATUS.eq(RESOLVED_AUTOMATICALLY)).and(STATUS_UPDATED_AT.lessOrEqual(cutoff))`.
      jOOQ's fluent-builder precedence binds the `.and(...)` to the most recent
      `.or(...)`. The emitted SQL is `WHERE (STATUS='RESOLVED') OR
      (STATUS='RESOLVED_AUTOMATICALLY' AND STATUS_UPDATED_AT <= cutoff)` — the
      TTL applies ONLY to RESOLVED_AUTOMATICALLY rows; manual RESOLVED rows are
      hard-deleted on the very next 15-minute cycle regardless of
      `housekeeping.ttl.resolved_alerts_days`. Live doc acknowledges this
      verbatim. NO `// TODO`, no `// BUG`, no comment in the source pointing to
      the docs, no GitHub-issue link, no regression test.
    expected: |-
      Manual RESOLVED rows should be retained for `resolved_alerts_days` after
      status update — symmetric with RESOLVED_AUTOMATICALLY. The fix:
      parenthesise the predicate as
      `.where(STATUS.eq(RESOLVED).or(STATUS.eq(RESOLVED_AUTOMATICALLY)))
      .and(STATUS_UPDATED_AT.lessOrEqual(cutoff))`.
    drift_class: jooq_operator_precedence_suspected_but_FALSIFIED_PLT005_behaviourally_verified_correct
    provenance: STATIC — PRIMARY-SOURCE confirmation of REFACTOR-142 in batch K
      HousekeepingJobManager sidecar bugs_limitations_corner_cases[1] +
      AlertHousekeepingJob.java:28-34 + WebFetch /configuration-and-deployment/odd-platform 2026-05-19 status 200
  - facet: 3-vs-5 job count framing in docs
    observed: |-
      Live `/configuration-and-deployment/odd-platform` page enumerates "three
      cleanup tasks executed by the housekeeping job" (WebFetched 2026-05-19,
      status 200). The `housekeeping/job/` package contains FIVE concrete
      @Component classes implementing HousekeepingJob; Spring's
      `List<HousekeepingJob>` injection at HousekeepingJobManager.java:23 picks
      up all five mechanically. The two empty-partition-drop jobs are not
      surfaced in the docs.
    expected: |-
      Either rename the docs to "three retention-driven tasks plus two
      empty-partition-drop tasks" OR enumerate all five jobs with their distinct
      semantics. An operator reading the docs cannot learn that the same 15-min
      schedule also drops empty activity/message partitions.
    drift_class: docs_three_vs_code_five_job_count
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      bugs_limitations_corner_cases[0] + housekeeping/job/ directory listing +
      WebFetch /configuration-and-deployment/odd-platform 2026-05-19
  - facet: ShedLock window dangerously close to schedule
    observed: |-
      `lockAtLeastFor="14m"` AND `lockAtMostFor="14m"` against `fixedRate=15`
      minutes (HousekeepingJobManager.java:25-26). 60-second slack between
      maximum lock and next scheduled invocation. A cycle running ≥14 minutes
      releases the lock before commit and a second instance can acquire at the
      next 15-minute slot while the first is still finalising. Most jobs are
      idempotent at the row-DELETE level, but DataEntityHousekeepingJob's
      ~25-table cascade reads-then-deletes — concurrent instances could read
      different snapshots and produce divergent cascade behaviour.
    expected: |-
      Either `lockAtMostFor` ≥ `2 × fixedRate` (e.g. 30m) so the lock outlives
      any plausible cycle duration OR a documented narrative that explains the
      14m / 15m pairing's intent. Currently undocumented.
    drift_class: shedlock_window_dangerously_close_to_schedule
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      bugs_limitations_corner_cases[3] + implicit_adrs[2] + HousekeepingJobManager.java:25-26
  - facet: per-job failure isolation undocumented
    observed: |-
      Inner try/catch at HousekeepingJobManager.java:41-47 catches `Exception`
      per job and logs at ERROR (`log.error("Error while running a housekeeping
      job", e)`), then continues to the next job. The docs page describes the
      cleanup tasks as if they all succeed; the failure-isolation behaviour is
      undocumented. An operator setting up log aggregation cannot pre-configure
      a housekeeping-failure alert.
    expected: |-
      Either docs explicitly state "one failing job is caught and logged at
      ERROR; remaining jobs continue" OR a Prometheus counter
      (`housekeeping_job_failure_total{job=...}`) gives operators a structured
      signal independent of log-aggregation grep patterns.
    drift_class: per_job_failure_isolation_undocumented
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      bugs_limitations_corner_cases[5] + docs_link_semantic.doc_drift_findings[2] +
      HousekeepingJobManager.java:41-47
  - facet: strict opt-in vs default-true framing
    observed: |-
      `@ConditionalOnProperty("housekeeping.enabled", havingValue="true")` with
      NO `matchIfMissing` (HousekeepingJobManager.java:18). The shipped
      `application.yml:166` ships `housekeeping.enabled: true`. Docs say the
      property "defaults to true" — technically correct only when the bundled
      application.yml is the resolved config. An operator-customised
      application.yml that overrides this file without re-supplying the key
      silently disables housekeeping with NO boot warning.
    expected: |-
      Either docs explicitly state "strict opt-in — omitting the key disables
      housekeeping" OR the code uses `matchIfMissing=true` (default-on
      regardless of YAML).
    drift_class: strict_opt_in_vs_default_true_framing
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      bugs_limitations_corner_cases[6] + docs_link_semantic.doc_drift_findings[3] +
      HousekeepingJobManager.java:18 + application.yml:166
  - facet: .block() inside transaction anti-pattern
    observed: |-
      DataEntityHousekeepingJob.doHousekeeping (lines 71-82) wraps the ~25-table
      cascade in `DSL.using(connection).transaction(ctx -> {...})`. Inside,
      `deleteFiles` (lines 131-143) calls reactive
      `fileUploadService.deleteFiles(filePojos).block()` at line 142 — NO
      explicit `.block(Duration)` timeout. If MinIO/S3 is unreachable, the
      block hangs until transport-level read-timeout or the 14-minute
      ShedLock expires. If S3 eventually throws, the transaction rolls back ALL
      ~25 deletes — the next cycle retries the entire batch. Under persistent
      S3 misconfiguration, housekeeping never makes progress; the only signal is
      `log.error` at the outer manager catch.
    expected: |-
      Either `.block(Duration.ofSeconds(N))` with explicit timeout AND structured
      failure metric OR S3 deletion moved OUTSIDE the transaction (best-effort
      post-commit) so DB cleanup completes regardless of S3 reachability.
    drift_class: block_inside_transaction_anti_pattern
    provenance: STATIC — REFACTOR-145 PRIMARY-SOURCE confirmation in batch K
      HousekeepingJobManager sidecar bugs_limitations_corner_cases[2] +
      DataEntityHousekeepingJob.java:71,142
  - facet: no dry-run / no preview / no archive
    observed: |-
      The three TTL-driven jobs issue jOOQ DELETE directly with no
      `housekeeping.dry-run=true` config, no `housekeeping.ttl.archive-table`
      that copies rows before delete, no operator-overrideable gate. A
      misconfigured `housekeeping.ttl.data_entity_delete_days=1` would
      immediately cascade through ~25 tables on the next 15-minute cycle with
      no recovery path. LSN-001 shape — silent default + immediate destructive
      action + no preview.
    expected: |-
      Either a `housekeeping.dry-run=true` mode that logs intended deletions
      without executing them OR per-job preview metrics
      (`housekeeping_eligible_rows{job=...}`) that operators can alert on
      before the destructive cycle runs.
    drift_class: no_dry_run_no_preview_no_archive
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      bugs_limitations_corner_cases[5]
  - facet: no observability — no metrics / no audit log
    observed: |-
      Per-job logging is `log.debug` (default-off in production); manager-level
      logging is `log.debug` (line 30) and `log.error` (lines 36-38, 44-46).
      No Micrometer counter, no Prometheus gauge, no structured audit event,
      no @ActivityLog annotation. An operator answering "how much did
      housekeeping delete yesterday?" must run a SQL count manually.
      Compliance frameworks requiring "data deletions must be logged and
      reviewable" are not satisfied.
    expected: |-
      At minimum: `housekeeping_deleted_total{table=...}` Prometheus counter +
      `housekeeping_cycle_duration_seconds` histogram + `housekeeping_backlog{table=...}`
      gauge. Ideally: structured audit row per deletion (table + row id + cutoff
      + cycle id) for forensics.
    drift_class: no_observability_metrics_or_audit_log
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      bugs_limitations_corner_cases[4] + security.known_security_gaps[0]
  - facet: shared connection — slowest job blocks cycle
    observed: |-
      One `pgConnectionFactory.getConnection()` call at line 32 wraps all five
      jobs in try-with-resources. A 10-minute DataEntityHousekeepingJob delays
      AlertHousekeepingJob and SearchFacetsHousekeepingJob by 10 minutes (each
      sub-second on quiet systems). The architectural decision (resource
      economy: one TCP handshake vs five per cycle) limits parallelism.
    expected: |-
      Either per-job connection (allows parallel execution) OR documented
      narrative that explains the cycle-time = sum-of-jobs trade-off.
    drift_class: shared_connection_slowest_job_blocks_cycle
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      performance.known_performance_gaps[0] + HousekeepingJobManager.java:32-35
  - facet: no ordering contract on job list
    observed: |-
      `List<HousekeepingJob>` injection at line 23 receives beans in Spring's
      discovered order (class-scan-order-dependent). No @Order annotations on
      any of the five components, no @DependsOn, no explicit list ordering.
      Today's five jobs operate on disjoint table sets so order is irrelevant,
      but the contract is fragile to extension.
    expected: |-
      Either explicit @Order annotations per job OR a documented "order
      irrelevant — jobs must operate on disjoint table sets" contract.
    drift_class: no_ordering_contract_on_job_list
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      bugs_limitations_corner_cases[7] + HousekeepingJobManager.java:23
  - facet: system-scope deletions — no owner-scoping
    observed: |-
      The orchestrator and all five jobs operate at system scope, deleting rows
      across ALL OWNERS without regard to the ODD ownership model. Particularly
      DataEntityHousekeepingJob.deleteOwnerships (lines 268-273) — a CASCADE
      step within the data-entity purge — removes ALL ownership rows for the
      soft-deleted entity regardless of who the Owners are. No tenant-id scope,
      no per-owner config.
    expected: |-
      Either per-tenant housekeeping (`odd.tenant-id`-aware purge cycles) OR
      documented narrative that housekeeping is a system-level admin
      operation outside the multi-tenant boundary.
    drift_class: system_scope_no_owner_scoping
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      security.owner_scoping
  - facet: no tamper-evident audit on TTL configuration changes
    observed: |-
      A malicious operator with `housekeeping.ttl.*` write access at deploy time
      (Helm chart override / env var / Spring Cloud Config) could set all three
      TTLs to `0` and the next housekeeping cycle would silently destroy all
      RESOLVED alert history, all search-facet history, and all soft-deleted
      entities (with the ~25-table cascade). There is NO audit trail of the
      configuration change AND NO audit trail of the deletion. SOX / GDPR
      records-of-processing requirements (data-retention-policy changes must be
      logged and reviewable) are not satisfied.
    expected: |-
      Either boot-time emission of resolved HousekeepingTTLProperties values
      into a tamper-evident log channel OR structured audit event on each
      housekeeping cycle (`audit.housekeeping.cycle{table, deleted, cutoff}`).
    drift_class: no_tamper_evident_audit_on_ttl_config_changes
    provenance: STATIC — primary-source in batch K HousekeepingJobManager sidecar
      security.known_security_gaps[0]
