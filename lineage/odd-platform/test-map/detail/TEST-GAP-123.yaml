behaviour: Failed-auth attempts not logged — no `@Slf4j` log call in the filter or
  its parent on either `"Token is missed"` or `"Token is not correct"` paths. A security
  incident review of 'how many failed-auth attempts in the last hour against the ingestion
  endpoint' cannot be answered from application logs. No rate-limit, lockout, or metric
  counter on the failure path.
