    LIVE-DOC PAGE surfaces this knob — verified WebFetch
    2026-05-20). NEW drift facet for F-026:
    `lookup_tables_custom_pool_default_max_size_undocumented_no_operator_guidance_spring_boot_framework_default_governs`.

    (4) **CUSTOM POOL INSTANTIATED UNCONDITIONALLY — RESOURCE
    OVERHEAD EVEN WITHOUT LOOKUP TABLES (LOW severity —
    operational overhead)** — R2DBCConfiguration.java:54
    `@Bean(name = "customConnectionPool", destroyMethod = "dispose")`
    has NO `@ConditionalOnProperty` gating on `spring.custom-datasource.*`
    presence. Every deployment runs TWO R2DBC pools regardless of
    whether Lookup Tables are used; a deployment that never creates
    a Lookup Table still pays `initialSize` connections worth of
    DB-side connection slots held against `lookup_tables_schema`
    perpetually. NEW drift facet for F-026:
    `lookup_tables_custom_connection_pool_no_conditional_on_property_unconditionally_instantiated_resource_overhead`.

    (5) **R2DBC-ONLY MICROMETER BINDER NOT WIRED — POOL UTILISATION
