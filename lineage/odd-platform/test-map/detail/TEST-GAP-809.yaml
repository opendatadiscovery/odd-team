behaviour: |-
  **MEDIUM — `setAppliedLSN` advances for NON-INSERT/UPDATE WAL messages — TRUNCATE on the alert table is silently dropped.** `NotificationSubscriber.java:79` short-circuits the processor call on `Optional.empty()` (the decoder returns empty for RELATION / TRUNCATE / DELETE / BEGIN / COMMIT / TYPE / ORIGIN / LOGICAL_DECODING_MESSAGE per `PostgresWALMessageDecoder.java:46-54`), but **lines 83-84 STILL advance setAppliedLSN + setFlushedLSN unconditionally**. This is correct behaviour for irrelevant message types (we don't want WAL accumulation just because we're skipping BEGIN / COMMIT / TYPE).

  **The subtle implication**: a **TRUNCATE on the alert table** would advance the WAL pointer past the truncation **without firing a notification**. Operators relying on alerts during a TRUNCATE-induced outage have NO signal — the alert table is empty, the WAL position has advanced past the truncation, and the subscriber has no way to detect that alerts were lost.

  **Operator-impact scenarios**:
  1. **Operational TRUNCATE**: an operator running `TRUNCATE TABLE alert` (perhaps as part of a database maintenance script, perhaps as part of a misguided cleanup operation) loses ALL pending alerts AND the subscriber silently advances past the truncation.
  2. **Cascading TRUNCATE**: if a future Flyway migration adds `TRUNCATE alert` to a maintenance migration (e.g. as part of a reorg or partition drop), the same silent loss applies.
  3. **Adversarial TRUNCATE**: an attacker with DB-DELETE privilege on the alert table (a higher-privilege threat than ODD-app-level auth, but reachable in shared-DB deployments) can mask their tracks by truncating after misuse — the subscriber's WAL pointer advances past the malicious activity.

  **Distinguishes from prior coverage**:
  - **TEST-GAP-455** pins the poison-message replay loop (LSN does NOT advance on uncaught throws). THIS gap pins the OPPOSITE — LSN DOES advance for messages that produce no notification. The two gaps cover the LSN-advance contract from both directions: advance when no error AND when no INSERT/UPDATE (this gap) vs do NOT advance when there's an uncaught throw (TEST-GAP-455).
  - **TEST-GAP-172** pins WAL decoder cache-invalidation on RELATION-id recycling. Different decoder concern.

  **Severity is MEDIUM because** operators don't normally TRUNCATE the alert table in production — but the silent-failure consequence is severe (no notification, no recovery signal). The fix is documentation (warn operators) rather than code change (the LSN-advance behaviour is correct for BEGIN/COMMIT/TYPE; only TRUNCATE-on-alert is the operationally-surprising case).

  **Test gap shape**: regression-pin asserting that TRUNCATE on alert table advances LSN without firing a notification. PINS the current behavioural surface.
