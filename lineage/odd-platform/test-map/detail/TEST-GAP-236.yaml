gap_id: TEST-GAP-236
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java OwnerController controller-method:createOwner
surfaced_by:
- createOwner.md:tests_coverage_semantic.uncovered_behaviours.[4]
behaviour: Authorization regression — `SecurityRule(NO_CONTEXT, /api/owners POST,
  OWNER_CREATE)` is wired at SecurityConstants.java:143; no integration test asserts
  that a caller WITHOUT `OWNER_CREATE` receives 403, and a caller WITH `OWNER_CREATE`
  receives 200. The SecurityRule entry is verified by code reading, not by an HTTP
  test. Owner directory mutations cascade into Ownership rows that gate every downstream
  action.
