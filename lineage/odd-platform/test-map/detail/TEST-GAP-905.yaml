behaviour: |-
  **MEDIUM — `DELETE /api/datasources/{id}` is an INCOMPLETE cleanup: a successful
  soft-delete leaves the `token` row ORPHANED (the `token` table has no `deleted_at` and no
  GC path — every register/delete cycle leaks one plaintext-secret row) AND leaves the FTS
  `search_entrypoint` vector UNCLEARED (unlike the `update` path). Neither leak is tested.**
  Method-level primary source from the batch-ZB `deleteDataSource` controller-method
  sidecar:

  - **Orphan token**: `data_source.token_id` is an FK to the `token` table
    (V0_0_28__add_token.sql:13). The soft-delete sets only `data_source.deleted_at`
    (ReactiveAbstractSoftDeleteCRUDRepository.java:106-110); it never deletes the `token`
    row. The `token` table has NO `deleted_at` column (V0_0_28__add_token.sql:1-9) so the
    token cannot even be soft-deleted, and NO code path GCs orphan tokens (no scheduled
    job, no Flyway migration — Grep-confirmed). Each register-then-delete cycle leaks one
    `token` row. The orphaned row is a stale 40-char plaintext secret at rest (`token.value
    varchar(40)`) — a DB-level reader sees a credential that no longer maps to any live
    data source.
  - **FTS uncleared**: `DataSourceServiceImpl.delete` (lines 85-96) calls NO
    `searchEntrypointRepository` method — unlike `update` (which calls
    `updateSearchVectors` at lines 127-136). Whether a soft-deleted data source still
    appears in catalog search depends entirely on whether the search query JOINs
    `data_source` with a `deleted_at IS NULL` predicate; if it does not, the soft-deleted
    source remains searchable.

  **Why MEDIUM**: neither leak is an active security breach or a correctness failure on the
  request path — they are slow accumulation hazards (unbounded `token`-table growth; stale
  search rows; stale plaintext secrets at rest). But `deleteDataSource` is a priority-1
  data-mutation node and the `delete` endpoint + `DataSourceServiceImpl.delete` are entirely
  uncovered (Glob-verified — no `DataSourceControllerTest`, no `DataSourceServiceImplTest`).
  This is the SAME orphan-token pattern batch W confirmed for Collector delete
  (TEST-GAP-675). A test would pin the current (leaking) state and surface the cleanup gap
  for triage.

  **Test gap shape**: a `@SpringBootTest` integration test that: (1) registers a data
  source (with no children), records its `token_id`; (2) `DELETE /api/datasources/{id}` →
  204; (3) asserts `SELECT COUNT(*) FROM token WHERE id = <token_id>` returns 1 — the
  token row PERSISTS, now unreferenced by any live data source (PIN the orphan-token leak);
  (4) asserts the `search_entrypoint` row for the data source still exists (PIN the
  uncleared-FTS leak). Pinned by probes P-046 (orphan token) and P-048 (FTS uncleared).
  When a cleanup fix lands (a token-delete on data-source delete, an FTS-clear), tests #3
  and #4 invert.
