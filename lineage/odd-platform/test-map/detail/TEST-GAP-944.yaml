proposed_action: |-
  Author PlatformUrlSubstitutionTest using Spring property-overlay testing
  (@TestPropertySource or @DynamicPropertySource) parameterised over four
  property values. For each, fire a wizard with a static_value snippet
  argument and assert the rendered code_snippet's static_value field matches
  the expected substitution. The empty-string + malformed cases document
  the no-validation contract for future hardening (the test is a regression
  pin for a future @URL annotation addition).
