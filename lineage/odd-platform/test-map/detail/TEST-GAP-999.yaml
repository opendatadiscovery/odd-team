  - 'masterData.md says (stress_findings.request_inputs.[BASE_PATH] DRIFT_INPUT_NAME_VS_IMPLEMENTATION): The constant name (BASE_PATH) suggests a usable root, but visiting /master-data does not match any <Route> and renders nothing. The "master data" base is an in-code organisational marker that has no corresponding URL surface.'
  - 'masterData.md says (tests_coverage_semantic.uncovered_behaviours): Operator-visible: a user clicking Master Data would expect to land on the only sub-route, not on an empty content area. No fallback <Route> is declared in App.tsx for /master-data. test_class: integration; criticality: MEDIUM'
  - 'Verified at primary source: App.tsx:60-89 (no <Route path="/master-data" ...> and no <Route path="*" ...> fallback) + masterDataRoutes.ts:1 (BASE_PATH = /master-data) + ToolbarTabs.tsx:100-104 (substring match makes the tab light up regardless)'
