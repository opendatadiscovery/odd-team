behaviour: |-
  Regex `\\[\\[([^:]*?):([^\\]]*?)\\]\\]` (TermServiceImpl.java:67) does not handle nested or escaped brackets, has multiple unproven edge cases. A description containing `[[foo[bar]:baz]]` will match `[foo[bar]:baz]` against the FIRST inner `]]`-like pattern, producing an unexpected term lookup. There is no escaping mechanism (`\\[\\[`). Operators writing prose with bracket-heavy content (e.g. array notation in code blocks) may produce unintended term mentions. Other unproven edge cases: empty groups (`[[:foo]]`, `[[foo:]]`), Unicode names, multi-line behaviour (regex compiled with no MULTILINE or DOTALL flags). The case-folding consistency between `buildXUnknownTerms` (lowercases namespace + name) and the later `equalsIgnoreCase` comparison in `isTermUnknown` is also unproven.
