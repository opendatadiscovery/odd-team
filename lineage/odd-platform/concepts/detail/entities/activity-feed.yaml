security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  - INTERNAL_ONLY
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      Both ActivityController endpoints (getActivity + getActivityCounts) carry no
      @PreAuthorize, no programmatic permissionService check. Generated ActivityApi
      interface has no auth annotations (grep verified across the generated sources).
      `/api/activity` and `/api/activity/counts` are NOT in SecurityConstants.SECURITY_RULES
      (full file read; zero matches for activity/Activity/ACTIVITY) and NOT in
      WHITELIST_PATHS — falls through to pathMatchers('/**').authenticated().
      ActivityServiceImpl (batch VAL-LSN-019-B) confirms the gap reaches the
      SERVICE LAYER: lines 33-273 verified line-by-line — ZERO @PreAuthorize,
      ZERO programmatic permissionService calls, ZERO permission predicates.
      Even getDataEntityActivityList (the per-entity read path) accepts a
      dataEntityId parameter without any per-entity authorization check
      (S-D-3 — any authenticated user reads activity for ANY data entity
      including entities they have no permission to view). ReactiveActivityRepositoryImpl
      (batch VAL-LSN-019-B) confirms the read paths are cross-owner SQL —
      no SQL-tier ownership filter, no row-level security. The Activity
      feature is the SAME read-collaborative-cross-owner-enumeration posture
      as the Tag / Alert / Search / Owner-directory surfaces — confirmed at
      THREE TIERS (HTTP, service, repository). The MY_OBJECTS branch is the
      sole owner-respecting dispatch (1 of 4 view modes).
      Live `/configuration-and-deployment/enable-security/authorization` documents
      the Policies/Permissions/Roles framework but per-endpoint wiring for /api/activity
      is absent on the live page. **Batch T controller-class evidence is the 9th-sidecar
      anchor for F-006 audit-silence at the read surface that surfaces what the
      schema-rooted scope can record.**
  owner_scoping:
    verdict: MIXED
    detail: |-
      type=null (default) and type=ALL → fetchAllActivities returns cross-owner
      audit trail (no owner filter). type=MY_OBJECTS → fetchMyActivities filters
      via authIdentityProvider.fetchAssociatedOwner() (the only path that respects
      caller ownership). type=UPSTREAM/DOWNSTREAM → fetchDependentActivities walks
      lineage graph WITHOUT caller-ownership filter — anyone can ask 'what changed
      upstream of X' regardless of whether they own X. Two distinct dispatch paths
      (`if (type == null)` + `case ALL`) both lead to fetchAllActivities — a
      future refactor updating only one branch silently bypasses any new gate.

      **Batch VAL-LSN-019-B service-layer addition (S-B-2)**: `ownerIds`
      filter parameter is silently DROPPED for non-ALL view modes — the
      ActivityType switch at ActivityServiceImpl.java:107-116 threads
      `ownerIds` ONLY for ALL/null. A caller submitting
      `type=MY_OBJECTS&owner_ids=[5]` gets their own owner's activity,
      not owner-5's. Discoverable drift.
  strengths:
  - |-
    Cursor pagination on `(lastEventId, lastEventDateTime)` — append-only audit
    data shape; avoids deep-offset cliffs (ActivityController.java:34-35)
  - |-
    Service-layer null-date validation throws BadUserRequestException — belt-and-braces
    defence beyond OpenAPI required:true (ActivityServiceImpl.java:98-100)
  - |-
    Reactive Mono/Flux signature end-to-end — non-blocking on request thread
  - |-
    **Activity write IS in same @ReactiveTransactional as originating mutation**
    via ActivityAspect.monoActivityAspect — accidental partial-state
    (mutation succeeded but audit row didn't) is structurally impossible.
    The aspect captures pre-snapshot, runs joinPoint.proceed(), captures
    post-snapshot, persists ActivityPojo — all under ONE TX. Same for
    AlertServiceImpl.applyAlertActions (line 201 outer TX) and
    ActivityIngestionRequestProcessor (IngestionServiceImpl.ingest:66
    outer TX) (batch VAL-LSN-019-B — S-E-1 verified across three caller
    paths).
  weaknesses:
  - |-
    `/api/activity` (and `/api/activity/counts`) globally readable by any
    authenticated user — exposes who-changed-what audit trail across every owner
    including ActivityState old/new diffs of descriptions, business names,
    ownership changes, custom metadata (severity HIGH — F-018 + REFACTOR-547
    cross-reference: SAME posture as Tag service-tier zero-auth +
    read-collaborative-cross-owner-enumeration 24-sidecar invariant)
  - |-
    userIds/ownerIds filter parameters not validated — submitting candidate id
    lists allows enumeration of which users/owners have generated platform
    activity (severity MEDIUM)
  - |-
    DescriptionActivityStateDto carries free-text user-supplied descriptions —
    if sensitive content ever lands there (incident notes, customer ids, internal
    tickets), the activity feed surfaces it cross-owner with no redaction
    (severity MEDIUM)
  - |-
    Under auth.type=DISABLED, anonymous read of the entire cross-owner audit trail
  - |-
    Public-API parameter typo `lasEventId` (missing `t`) on the controller signature
    — generated client SDKs carry the typo permanently (severity LOW; ActivityService
    interface fixes it at line 42)
  - |-
    **Audit-trail SILENCE on RBAC/Owner CRUD/Datasource/Collector mutations**
    (the F-006 9-sidecar pattern, schema-rooted at activity.data_entity_id NOT NULL
    FK per batch R + ReactiveActivityRepositoryImpl): operationally a Role creation,
    Policy edit, Owner deletion, or Collector token rotation produces NO row in
    this feed. The doc page does not state the scope boundary (severity HIGH —
    confirmed at controller-class layer in batch T)
  - |-
    **NEW batch VAL-LSN-019-B — S-D-3 per-entity Activity has no authorization
    check**: `getDataEntityActivityList(dataEntityId)` accepts any
    dataEntityId without permission check. Every authenticated user reads
    activity for every data entity in the system, including entities they
    have no other permission to see; the diff payloads expose description /
    tag / ownership content. Severity MEDIUM
  - |-
    **NEW batch VAL-LSN-019-B — Activity emit failure rolls back the
    originating business mutation**: this is the OPPOSITE of the
    "audit-or-fail" intuition. ActivityAspect's @ReactiveTransactional
    wraps EVERY @ActivityLog-annotated business method PLUS the activity
    emit; a transient ActivityRepository.saveReturning failure rolls back
    the user's successful mutation and surfaces 500 with no indication the
    mutation was reverted. Operator-surprising; either intentional and needs
    documentation OR a refactor candidate (decouple via @Async post-commit
    hook). Severity MEDIUM (correctness vs operability tradeoff)
  - |-
    **NEW batch VAL-LSN-019-B — handler-tier concurrent oldState capture race**:
    two parallel @ActivityLog mutations on the same data entity both capture
    the SAME pre-mutation oldState in their ActivityContextInfo, then proceed
    in their own TX. The second handler's diff records (oldState_pre_both ->
    newState_post_both) — its oldState is wrong (it should be newState of the
    first mutation, since at the time the second handler started its
    business mutation, the first one was committed). Discoverable as
    "the audit log says alice changed X from null to 'A,B' but the activity
    actually shows X going from null to 'B' twice." Severity HIGH at scale
    (under concurrent load); LOW in typical single-user UX
  - |-
    **NEW batch VAL-LSN-019-B — `getActivityCounts` accepts null dates;
    `getActivityList` rejects them**: asymmetric validation — a UI bug or
    operator curl-ing `/api/activity/counts` without `begin_date` /
    `end_date` issues an unbounded COUNT(*) over the entire retained
    activity history (all partitions per F-010). Performance cliff at
    scale. Severity MEDIUM (probe P-023 emitted)
  cross_file_inconsistencies:
  - |-
    Per-entity getDataEntityActivity (DataEntityController) uses the same cursor
    pattern but is reached from a different route and has different scoping —
    both endpoints expose the same payload, the global one is the larger blast
    radius
  - |-
    The 27-vs-20 enum cardinality mismatch from batch R is RECONCILED at the
    controller layer in batch T (20 named + 7 categorical = 27); see invariant
    activity-event-enum-20-named-plus-7-categorical-equals-27 — LOW-severity
    doc-completeness gap rather than a wire drift
  - |-
    Activity feature spans SEVEN sidecars after batch VAL-LSN-019-B —
    getActivity (controller method) + ActivityController (class) +
    ActivityTablePartitionManager (partition lifecycle) + ActivityServiceImpl
    (orchestration) + ReactiveActivityRepositoryImpl (SQL) + ActivityHandler
    (snapshot-differ interface) + ActivityEmptyPartitionsHousekeepingJob
    (reaper). No cross-tier contradictions — the read-collaborative posture,
    schema-rooted audit-silence, cross-mode bleed, and monotonic-growth
    findings are uniform across every tier
