- id: H-005
  hypothesis: "When an operator clicks Delete on a data source and confirms, the data source is removed from the catalog and the operator gets clear feedback that it succeeded (or a comprehensible message if it could not)."
  derivation: "Endpoint shape (DELETE /api/datasources/{id}) + the per-card 'Delete' control + the doc phrase 'remove a source no longer ingested'. Negative-space: the most likely delete target is an actively-ingested source."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Delete is a guarded soft-delete that FAILS for the most likely target, and
      the UI handles the failure hostilely. The backend deleteDataSource
      (DataSourceServiceImpl.java:85-96) returns HTTP 400 CascadeDeleteException
      whenever a live data_entity child exists (existsNonDeletedByDataSourceId,
      ReactiveDataEntityRepositoryImpl.java:158-163). Collectors re-create
      data_entity rows on the next ingest tick, so an actively-ingested source is
      effectively undeletable — deleting the children races the collector; the only
      reliable path is to stop the collector first, which no doc mentions. The UI
      makes it worse: DataSourceItem's ConfirmationDialog carries NO forewarning
      that the delete may be blocked; on the 400, handleResponseAsyncThunk surfaces
      the RAW backend string in a generic red toast (errorHandling.tsx:48-68); and
      ConfirmationDialog.onClose does `action().then(...).catch(() => {})`
      (ConfirmationDialog.tsx:28-34) — on rejection neither handleClose nor
      setIsLoading(false) runs, so the modal STAYS OPEN with its confirm button
      stuck spinning. The static trace is confirmed-certain (DataSourceItem.md
      confidence: ConfirmationDialog.tsx:33 swallow is statically certain) and the
      runtime behaviour is pinned by the already-authored probe P-078.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItem
        section: bugs_limitations_corner_cases[0] (the §0 defect) + coherence_notes (strengthens)
        cite: "DataSourceItem.tsx:58-74 + ConfirmationDialog.tsx:28-34 + handleResponseThunk.ts:34-42"
        note: ".catch(()=>{}) swallows the 400; modal stuck-open + isLoading never reset"
      - sidecar: odd-platform__java__DataSourceController__controller-method__deleteDataSource
        section: observed_vs_expected facet (delete_cascade_block_on_live_children)
        cite: "DataSourceServiceImpl.java:85-96 + ReactiveDataEntityRepositoryImpl.java:158-163"
        note: "400 CascadeDeleteException while a live child exists"
    operator_visible_failure: |
      (1) Deleting an actively-ingested source — the single most common delete
      attempt — produces a stuck-loading modal the operator must hard-refresh to
      escape, plus a backend-jargon toast ('Data source cannot be deleted: there
      are still data entities attached') with no in-product guidance on what to do.
      (2) No forewarning: the operator commits to the delete (clicks through the
      confirm) before discovering it is impossible — work-discovered-wasted. (3) No
      pre-flight check and no disabled-with-tooltip state: the Delete control looks
      identical for a deletable and an undeletable source. (4) The operator has
      neither documentation nor product guidance telling them to stop the collector
      / soft-delete the children first (the doc gap DOC-261-class compounds the UI
      gap, per DataSourceItem.md coherence_notes refines).
    severity: HIGH
    confidence: HIGH
    probe_id: P-078
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: "When an operator clicks 'Regenerate' on a data source's token and confirms, they understand that the old token stops working immediately and that any running collector bound to this source will break until reconfigured."
  derivation: "UI label ('Regenerate' button + its ConfirmationDialog) + the destructive-rotation backend behaviour. Senior-PO UX seed: does the user understand the consequence from what is on screen?"
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The rotation is destructive with no grace period, and the UI's confirmation
      step under-states it. The backend (ReactiveTokenRepositoryImpl.updateToken,
      lines 30-39) does an in-place UPDATE token SET value=<new> — no old/new
      overlap, no previous_token column, no revoke step. A collector still
      presenting the old token starts 401-ing on POST /ingestion/entities the
      instant the UPDATE commits (IngestionDataEntitiesFilter literal .equals). The
      UI ConfirmationDialog body says only 'Are you sure you want to regenerate
      token for this datasource?' / 'Regenerate token for "{name}"?'
      (DataSourceItemToken.tsx:42-46) — it names the datasource but states NOTHING
      about the consequence: no mention that the old token dies immediately, that
      ingestion breaks, or that there is no grace window. The dialog MITIGATES an
      accidental click but does NOT inform an intentional one. The PUT is also
      non-idempotent — a double-confirm-across-reopen rotates twice, invalidating
      the token the first response returned before the operator copies it. Note
      the rotation has NO security effect on the default deployment at all, because
      auth.ingestion.filter.enabled defaults to false.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken
        section: stress_findings.name_behavior_pairs (DRIFT) + bugs[0] + security.known_security_gaps
        cite: "DataSourceItemToken.tsx:37-49,42-46"
        note: "confirm dialog has no consequence warning — HIGH"
      - sidecar: odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken
        section: observed_vs_expected facet (destructive_rotation_no_grace_period)
        cite: "ReactiveTokenRepositoryImpl.java:30-39 + IngestionDataEntitiesFilter.java:43-58"
        note: "in-place UPDATE, no grace; old token 401s immediately"
    operator_visible_failure: |
      (1) An operator who knowingly clicks Regenerate (even after confirming) is
      given no indication they have just broken every running collector bound to
      this source until each is reconfigured + redeployed — zero-downtime rotation
      is impossible with this shape. (2) A double-submit (close+reopen the dialog,
      or a network retry) rotates twice; the operator copies a token from response
      1 that response 2 has already invalidated, and ingestion stays broken. (3) On
      the default deployment the operator believes rotation hardens security when
      the ingestion filter is off entirely, so it does nothing. The 'Regenerate'
      label + bare confirm reads as additive/safe; the behaviour is destructive.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-007
  hypothesis: "When a data source is registered or its token regenerated, the operator can copy the new plaintext token, and the plaintext is shown only that once — it is never re-served on subsequent visits."
  derivation: "Response shape (token.value plaintext on register/regenerate, masked on list) + the UI one-shot-reveal warning 'You will not be able to retrieve it again'."
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |
      The one-shot-reveal UX is real but leaky on three axes. TRUE: the list
      endpoint returns the masked '******'+last-6 form (TokenMapper.mapValue) and
      DataSourceItemToken renders token.value verbatim, inferring masked-vs-plaintext
      from the '******' prefix (DataSourceItemToken.tsx:25-27); after a regenerate
      the row swaps to plaintext + Copy + the 'save it, you cannot retrieve it
      again' warning (DataSourceItem.tsx:110-121); on the next list refetch it
      re-masks. LEAKY: (a) the masked form exposes the REAL last 6 plaintext chars
      of every token to every authenticated viewer, not a placeholder
      (TokenMapper.java:15-18); (b) the plaintext token persists in the redux store
      after regeneration (datasources.slice.ts:41-42 upsertOne) until a refetch —
      any devtools/error-reporter serialising redux state captures it; (c) the
      register/regenerate HTTP responses carry the 40-char plaintext with no
      Cache-Control: no-store (DataSourceController.java:33-35,53-58) — proxies /
      browser history / inspection appliances may cache it; (d) if the operator
      navigates away before copying, the plaintext is unrecoverable and they must
      regenerate AGAIN (another destructive rotation, per H-006).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken
        section: understanding + security.data_exposure + bugs[2]
        cite: "DataSourceItemToken.tsx:25-37,51-53 + datasources.slice.ts:41-42"
        note: "one-shot reveal works; plaintext persists in redux store; re-mask on refetch loses it"
      - sidecar: odd-platform__java__DataSourceController__controller-method__getDataSourceList
        section: observed_vs_expected facet (list_token_leaks_real_last_six_chars)
        cite: "TokenMapper.java:15-18"
        note: "mask exposes real last-6 plaintext chars to every viewer"
    operator_visible_failure: |
      (1) A read-only user reads genuine token material (last 6 chars) for every
      data source. (2) The plaintext credential lands in the redux store, browser
      response cache, and any proxy/HAR/APM on the path — surfaces the operator did
      not authorise, undermining the tight blast radius they expect from a one-shot
      reveal. (3) Navigating away before copying forces a second destructive
      rotation to obtain a usable token. The one-shot model is the right idea; the
      leaks erode it.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-008
  hypothesis: "When the backend rejects a register or edit submit (e.g. an ODDRN collision returns HTTP 400), the operator sees the error in context and the values they typed are preserved so they can correct and retry."
  derivation: "Negative-space + senior-PO convenience seed: a form that discards typed input on a server error is a hostile UX a product owner would not ship."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The modal closes on failure exactly as on success, discarding everything
      typed. DataSourceForm.onSubmit chains `.then(() => clearState())`
      (DataSourceForm.tsx:78-80) onto the dispatch; handleResponseAsyncThunk
      CATCHES the error and rejectWithValue's it — it NEVER re-throws
      (handleResponseThunk.ts:34-42) — so the dispatch promise RESOLVES even on a
      400/404, `.then()` runs, and clearState() resets the form and the modal
      auto-closes. The operator's only failure signal is the transient global
      server-error toast; the form has no errorText wiring (DialogWrapper supports
      an errorText slot but DataSourceForm never passes one). Pinned by P-075.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceForm
        section: bugs_limitations_corner_cases[0] + tests_coverage_semantic.gaps
        cite: "DataSourceForm.tsx:69-81 + handleResponseThunk.ts:34-42 + DataSourceForm.tsx:157-169"
        note: ".then(clearState) runs on failure too; no inline error; modal closes discarding input"
    operator_visible_failure: |
      (1) An operator registering a source whose ODDRN collides (a common
      copy-paste mistake) clicks Save, the modal vanishes, a red toast flashes, and
      every field they typed is gone — they must re-open the modal and re-enter
      everything to retry. (2) The same on a 403 (missing permission, per H-012) —
      the modal closes with no in-context explanation. (3) No inline field error
      ever appears; an operator who misses the transient toast cannot tell the
      submit failed at all and may believe the source was created. The auto-close-
      on-failure + input-discard is the hostile path.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-009
  hypothesis: "When a data source is deleted, the resources it owned are cleaned up — its token row is removed and it stops appearing in catalog search."
  derivation: "Negative-space + the conventional expectation that a delete tidies up. Available-but-unused: the token table has no deleted_at; the delete path calls no FTS refresh."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The soft-delete leaves two trailing artefacts. (1) ORPHAN TOKEN — the
      soft-delete sets only data_source.deleted_at
      (ReactiveAbstractSoftDeleteCRUDRepository.java:106-110); it never deletes the
      token row, and the token table has NO deleted_at column
      (V0_0_28__add_token.sql:1-9) so it cannot even be soft-deleted; no code path
      GCs orphan tokens (no Housekeeping job — F-010 gap). Each register-then-delete
      cycle leaks one token row carrying a stale 40-char plaintext secret. (2) FTS
      UNCLEARED — deleteDataSource calls no searchEntrypoint method, unlike update
      (which DOES refresh the FTS vector); whether the soft-deleted source keeps
      surfacing in catalog search depends on the search query's deleted_at
      predicate. This is the backend half; the UI cannot mitigate it. Tracked
      end-to-end as PLT-087 Defect 1 + DOC-255 Caveat 2.
    evidence:
      - sidecar: odd-platform__java__DataSourceController__controller-method__deleteDataSource
        section: observed_vs_expected facet (orphan_row_on_delete)
        cite: "ReactiveAbstractSoftDeleteCRUDRepository.java:106-110 + V0_0_28__add_token.sql:1-13"
        note: "token row orphaned; FTS not cleared on delete (asymmetry with update)"
    operator_visible_failure: |
      (1) Operators auditing the token table for orphans see unbounded growth with
      no obvious source (the parent is soft-deleted) — each register/delete cycle
      leaks a live-format secret with no GC path. (2) A 'deleted' data source can
      keep surfacing in faceted catalog search until an unrelated event refreshes
      the affected entries — the operator believes it is gone. Severity MEDIUM:
      operator-trust + state-consistency, not an active exploit.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-010
  hypothesis: "When an operator types text into the 'Search datasource' box, the list shows every data source whose name contains that text."
  derivation: "UI label ('Search datasource' placeholder) — the natural reading of a search box is a substring/contains match. Endpoint shape: the query param feeds the backend list."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The search is a name-PREFIX match on the page, not a contains match — and the
      mismatch is masked by a second bug so the operator gets no zero-result
      signal. The typed text becomes local query (DataSourcesList.tsx:58-61),
      debounced 500ms, sent as the backend `query` parameter; the backend
      ReactiveDataSourceRepositoryImpl applies DATA_SOURCE.NAME.startsWithIgnoreCase
      on the PAGE (line 156) but containsIgnoreCase on the empty-page COUNT
      (REFACTOR-425 divergence). The UI applies no filtering of its own. Worse: the
      header 'N datasources overall' count is a local mirror frozen at the
      pre-search total while a search is active (DataSourcesList.tsx:50-52), so the
      operator gets neither matching rows NOR a '0 of N' hint.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourcesList
        section: stress_findings.name_behavior_pairs (DRIFT) + request_inputs.query (TRANSLATES_SILENTLY) + bugs
        cite: "DataSourcesList.tsx:58-61,83,50-52"
        note: "'Search datasource' label implies substring; backend page query is prefix; header count frozen mid-search"
      - sidecar: odd-platform__java__DataSourceController__controller-method__getDataSourceList
        section: observed_vs_expected facet (list_query_page_vs_count_predicate_divergence)
        cite: "ReactiveDataSourceRepositoryImpl.java:151-160"
        note: "startsWithIgnoreCase page vs containsIgnoreCase count"
    operator_visible_failure: |
      (1) An operator searching a mid-name fragment (e.g. 'flake' for
      'my-snowflake-dev', or 'prod' for 'analytics-prod-warehouse') gets an EMPTY
      list and the empty-state placeholder — the source exists but is invisible to
      that search. (2) Because the header count is frozen at the pre-search total,
      there is not even a '0 results' hint; the operator is likely to conclude the
      data source is not registered and re-register it (creating a duplicate /
      hitting the ODDRN-collision 400 with the input-discarding modal of H-008).
      Severity MEDIUM: a routine search behaviour silently lies about what exists.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-011
  hypothesis: "When an operator (or a security reviewer) wants to know who registered, edited, deleted, or rotated the token of a data source, and when, they can find it in the Activity Feed or an audit trail."
  derivation: "Pillar mission — P-08 Management is the mutating surface; an audit-trail expectation is load-bearing for any operator console. Cross-pillar: F-021 Activity Feed is the audit surface."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The entire data-source lifecycle is invisible to audit. DataSourceServiceImpl
      emits NO Activity Event for any of the five verbs (the class imports no
      ActivityEvent emitter), and there is no log.info/log.warn on any path across
      controller / service / token-generator / token-repository
      (DataSourceServiceImpl.java:38-106). ActivityEventTypeDto has no DATA_SOURCE_*
      constant — the same enum-rooted audit-silence the platform-wide pattern
      catalogues (F-006 / F-019 / F-020 / F-028 all carry it). The only signals are
      the row's deleted_at / updated_at timestamps and token.updated_by, all
      actor-thin or single-state (overwritten on the next mutation).
    evidence:
      - sidecar: odd-platform__java__DataSourceController__controller-class__DataSourceController
        section: observed_vs_expected facet (audit_silence_no_activity_log_no_logging_any_layer)
        cite: "DataSourceServiceImpl.java:38-106"
        note: "no Activity emitter, no log call on any of the 5 verbs"
    operator_visible_failure: |
      (1) An operator asking 'who registered / edited / deleted this source, and
      when' has no audit trail. (2) A security reviewer asking 'who rotated this
      data source's token before the last rotation' cannot answer it from
      production data — token.updated_by holds only the last rotator and is
      overwritten each time. (3) Combined with H-003's REPLACE-not-MERGE + the
      SHB-092 collector overwrite, an operator who finds a field reverted has no way
      to learn whether a person or a collector startup did it. Severity MEDIUM:
      the lifecycle works but is unauditable. Routed as a doc-gap (the audit-silence
      is an architectural decision deferred to the platform_event ADR — DOC-255
      Caveat 3 + PLT-087 'Out of scope' note).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: doc-gap-candidate

- id: H-012
  hypothesis: "When a user without DATA_SOURCE_CREATE / UPDATE / DELETE / TOKEN_REGENERATE opens the Datasources tab, they cannot perform that mutation — and the platform enforces it consistently whether they use the UI or call the API directly."
  derivation: "Pillar mission (RBAC-gated Management) + cross-pillar P-09 Security. The four mutating verbs carry MANAGEMENT-tier SecurityRules; the UI wraps controls in WithPermissions."
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |
      Enforcement holds under the three authenticated modes but is two-layered with
      a UX gap, and collapses under DISABLED. UNDER LOGIN_FORM/OAUTH2/LDAP: the UI
      hides each control via WithPermissions (renders null — DataSourceItem.tsx:44,57,
      DataSourcesList.tsx:90, DataSourceItemToken.tsx:36) AND the backend
      SecurityConstants rules (lines 116-126) are the real gate, enforced before the
      controller — a crafted PUT from a non-holder is rejected 403. So far so good,
      and the read list is open to any authenticated user by design
      (read-collaborative). THE GAPS: (1) the Save button in DataSourceForm is
      disabled only by form validity, NOT by permission — a user who can open the
      form but lacks the permission types, clicks an ENABLED Save, and only THEN
      gets a 403 (discovered late, work wasted; and the modal then closes
      discarding input per H-008). (2) UNDER auth.type=DISABLED all four mutating
      verbs are anonymously reachable — DisabledSecurityConfiguration permitAll()
      and the SecurityRules are not enforced; a caller can register/edit/delete and
      rotate any token, receiving the new plaintext, with null actor attribution.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItem
        section: stress_findings.auth_gates + security
        cite: "DataSourceItem.tsx:44,57 + WithPermissions.tsx:27-29"
        note: "UI hides controls (advisory); backend SecurityConstants is the boundary"
      - sidecar: odd-platform__ts__react-component__component__DataSourceForm
        section: stress_findings.auth_gates (wrong-role) + security.known_security_gaps
        cite: "DataSourceForm.tsx:146-155"
        note: "Save enabled by validity only — permission failure surfaces post-submit as 403"
      - sidecar: odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken
        section: observed_vs_expected facet (disabled_mode_bypass)
        cite: "SecurityConstants.java:116-126"
        note: "under DISABLED all 4 mutating verbs anonymously reachable incl. token rotation"
    operator_visible_failure: |
      (1) A read-mostly user with no DATA_SOURCE_CREATE who can open the Add modal
      (or any mutating modal) does the work, clicks Save, and only then learns they
      lack permission — late failure, then the input-discarding close of H-008.
      (2) On a network-exposed DISABLED deployment (doc-marked dev-only but run in
      prod by some operators) there is NO data-source, namespace, or token
      protection — an attacker can break ingestion platform-wide and harvest the new
      plaintext tokens with no actor attribution. The authenticated-mode enforcement
      is correct; the late-failure UX and the DISABLED bypass are the partial.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-013
  hypothesis: "When two operators (or one operator double-clicking Save) submit changes to the same data source concurrently, the platform serialises them so no change is silently lost."
  derivation: "Negative-space + resource-boundary: the Save button is not isLoading-guarded; no optimistic lock on the row."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      Static evidence establishes the create path is protected by the ODDRN
      partial-unique index (a concurrent duplicate register 400s — the second loses
      cleanly) and that the Save button is disabled only by form validity, not by
      isLoading (DataSourceForm.tsx:153), so a fast double-click CAN fire two POSTs
      before the first resolves (P-077). But the UPDATE (PUT) path has NO optimistic
      lock / version column — two concurrent edits to the same id are last-write-wins
      with no detection, and combined with H-003's REPLACE semantics a later edit
      can silently clobber an earlier operator's field changes. Whether the
      double-click guard / last-write-wins is observable in practice (and whether
      the ConfirmationDialog's in-flight isLoading reliably blocks a double-confirm
      on delete/regenerate) requires running the system — pinned by the
      already-authored P-077 (double-submit register), P-079 (double-confirm
      delete), P-050 (concurrent token rotation). One genuinely-uncovered case — two
      concurrent PUT edits to the same id producing a lost-update with no
      optimistic-lock detection — has no dedicated probe; a new probe (P-241) is emitted.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceForm
        section: stress_findings.resource_boundaries (idempotency)
        cite: "DataSourceForm.tsx:146-155"
        note: "Save not isLoading-guarded; double-click can fire 2 POSTs (P-077)"
      - sidecar: odd-platform__java__DataSourceController__controller-method__updateDataSource
        section: observed_vs_expected facet (concurrent_update_lost_update_no_optimistic_lock)
        cite: "DataSourceServiceImpl.java:68-83"
        note: "no version column; two concurrent PUTs = last-write-wins, no detection"
    probe_id: P-241
    routes_to_finding: bug-candidate

