  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/PolicyServiceImplAntiElevationGuardAbsenceTest.java"
  name: "createPolicy_managementAllStatement_byPolicyCreateOnlyUser_succeeds_pinsNoAntiElevationGuard"
evidence:
  - "PolicyServiceImpl.md says (security.known_security_gaps.[5]): 'No anti-elevation guard. A POLICY_CREATE-bearing user can author a MANAGEMENT/ALL policy and then (with ROLE_CREATE or ROLE_UPDATE — both MANAGEMENT-tier) bind it to a role they belong to, completing a self-elevation chain. The validator (PolicyJSONValidator + schema) accepts MANAGEMENT/ALL as a legal shape — identical to the seeded Administrator. There is no `cannot grant permissions you don''t already have` check. This is intentional in the platform''s design (an administrator can author administrator policies — that''s the bootstrap) but the consequence is that POLICY_CREATE is functionally root-on-the-platform.' severity: HIGH"
  - "Source: PolicyServiceImpl.java:62-69 (no elevation check) + policy_schema.json (accepts MANAGEMENT/ALL) + V0_0_56__add_predefined_roles_and_policies.sql:1-31 (Administrator uses MANAGEMENT/ALL)"
