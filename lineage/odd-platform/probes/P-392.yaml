realism_caveats: |
  This probe does NOT verify the ORIGINAL rationale in the comment at
  JooqFTSHelper.java:59-61 (that an uncapped query would approach the Postgres
  65535 bind ceiling). 64 leaves is roughly three orders of magnitude below that
  ceiling, so the cap is a product-level conservatism, not a driver-level limit —
  measuring the true bind/latency curve would need a separate performance probe
  with the cap temporarily raised, which changes the code under test.

  It also does not exercise the UI. If the assertions hold, the follow-up question
  belongs to the Search UI sidecar: does the results page render "No matches found"
  for a refused query, and is that acceptable? The backend half is what this probe
  settles.
