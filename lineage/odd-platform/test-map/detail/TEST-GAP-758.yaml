proposed_action: |-
  Add `CollectorTokenVisibilityContractTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Six test methods:
  1. `registerCollector_responseTokenValueIs40CharPlaintext_pinsRegisterShowsPlaintextContract` — POST `/api/collectors`; assert `token.value.length() == 40` AND assert the value matches `[a-zA-Z0-9]{40}` regex (proves it's plaintext, not masked).
  2. `regenerateCollectorToken_responseTokenValueIs40CharPlaintext_pinsRegeneratePlaintextContract` — sister test on rotation.
  3. `getCollectorList_responseTokenValueIsMasked_pinsListMaskingContract` — POST a collector first; capture the plaintext token; then GET `/api/collectors`; find the same collector in the list; assert `token.value` is `******{6 chars}` format AND the 6 chars are the LAST 6 chars of the plaintext.
  4. `updateCollector_responseTokenValueIsMasked_pinsUpdateMaskingContract` — sister test on update.
  5. `plaintextTokenFromRegister_authenticatesAgainstIngestionDataEntitiesFilter_pinsS2SContract` — capture plaintext from register; POST `/ingestion/entities` with `Authorization: Bearer {plaintext}`; assert 200.
  6. `maskedTokenFromList_doesNotAuthenticateAgainstIngestionFilter_pinsMaskedIsNotCredential` — capture masked from list; POST `/ingestion/entities` with `Authorization: Bearer {masked}`; assert 401 / 403.

  Pair with the existing TokenMapper / TokenDto / showToken design — the test pins the contract; any refactor touching the 4 implicated files (ReactiveTokenRepositoryImpl, ReactiveCollectorRepositoryImpl, TokenDto, TokenMapper) will see the test fail if the visibility flips.
