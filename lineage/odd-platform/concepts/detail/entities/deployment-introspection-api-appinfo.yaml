security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - DISABLED
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      Controller has no @PreAuthorize, no programmatic permission check. Path
      `/api/appInfo` is not in SecurityConstants.SECURITY_RULES. Generated
      AppInfoApi interface has no @PreAuthorize and no SecurityRequirement.
      Falls through to whatever the active SecurityWebFilterChain decides for
      'any path not in WHITELIST_PATHS / SECURITY_RULES' — `authenticated()`
      for LOGIN_FORM/OAUTH2/LDAP, `permitAll()` for DISABLED.
  owner_scoping:
    verdict: N/A
    detail: Endpoint returns deployment metadata, not data entities.
  strengths:
  - |-
    The published contract intentionally exposes authType — this is the SPA's
    login-flow gate, not an accidental leak. AppInfoApi.java:43 + AppInfo.java:48-66
    confirm the field is part of the OpenAPI surface.
  - |-
    **Expose-mode-hide-provider contract** (NEW batch T invariant): AppInfo
    deliberately surfaces ONLY auth-mode + project version. NO OAuth provider
    name, NO LDAP server URI, NO issuer URL, NO build SHA, NO hostname. The
    Identity surface (IdentityController whoami) ALSO surfaces NO `provider`
    field. The two endpoints together encode a deliberate 'expose mode, hide
    provider' contract — limits the unauthenticated fingerprinting surface
    under DISABLED to (mode + version).
  - |-
    Stateless controller — buildProperties and authType captured at construction
    as final fields. Horizontal scaling unaffected.
  weaknesses:
  - |-
    **Under `auth.type=DISABLED` (application.yml default), the endpoint is
    anonymously reachable and discloses `{projectVersion, authType}` to any
    network caller** — passive fingerprinting surface. Severity MEDIUM. This
    is the 19th supporting sidecar of REFACTOR-185 (DISABLED-mode bypass
    enumeration) — the controller-class layer view of a surface batch B cited
    at the config-key-consumer-axis layer.
  - |-
    Empty-string `auth.type` injection silently produces a deployment with no
    SecurityWebFilterChain bean — `@Value("${auth.type}")` declares no default;
    if an operator overrides to empty string (`AUTH_TYPE=` env var), Spring
    injects empty string, controller echoes it, and every downstream
    @ConditionalOnProperty(havingValue="...") fails to match.
    Severity LOW.
  - |-
    No enum validation — typo (`OUATH2`) silently disables all @ConditionalOnProperty
    matches and produces the same no-SecurityWebFilterChain deployment, with
    /api/appInfo echoing the typo. No boot-time fail-fast. Severity LOW.
  - |-
    Whitelist gap for LOGIN_FORM: `/api/appInfo` is NOT in
    SecurityConstants.WHITELIST_PATHS and NOT in
    LoginFormSecurityConfiguration.permittedPaths. Under LOGIN_FORM the SPA
    needs the response BEFORE the user authenticates (to render the form).
    Either the current configuration is relying on a path I have not traced,
    or the SPA calls /api/appInfo post-auth in LOGIN_FORM mode — undocumented
    behaviour either way. Severity MEDIUM.
  - |-
    The expose-mode-hide-provider contract is FRAGILE — no test asserts the
    absence of provider/host/SHA fields; a future contributor could add them
    without realising the security implication, silently widening the
    fingerprinting surface. Severity MEDIUM (NEW batch T finding).
  cross_file_inconsistencies:
  - |-
    AppInfoController@L18 is the only sidecar where `auth.type` is itself the
    DATA being exposed — all other controller sidecars treat it as opaque
    gating. The two layers (consumer-of-mode vs reporter-of-mode) coexist in
    the codebase and the catalog has to surface both.
  - |-
    Batch T's controller-class sidecar reinforces the consumer-of-mode vs
    reporter-of-mode framing AND adds the cross-endpoint expose-mode-hide-provider
    contract spanning AppInfoController + IdentityController. The contract is
    invisible from any single controller; only cross-batch reasoning surfaces it.
  contributing_files:
  - AppInfoController@L18.md
  - AppInfoController controller-class.md
  evidence:
  - AppInfoController@L18.md:security.known_security_gaps.[0,1,2]
  - AppInfoController@L18.md:bugs_limitations_corner_cases.[0,1,2,3,4]
  - |-
    AppInfoController (class).md:implicit_adrs.[2] (expose-mode-hide-provider contract)
  - |-
    AppInfoController (class).md:security.known_security_gaps.[0] (REFACTOR-185
    19th sidecar — MEDIUM severity)
  - |-
    AppInfoController (class).md:security.known_security_gaps.[1] (highest-signal-
    density fingerprint endpoint under DISABLED — MEDIUM)
  - |-
    AppInfoController (class).md:security.known_security_gaps.[2] (empty-string
    / typo'd auth.type — LOW)
performance_aggregate:
  overall: HIGH
  hot_paths: []
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Single-call, single-response — `Mono.just(new AppInfo(...)).map(ResponseEntity::ok)`.
      No streaming, no backpressure, no bulk.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless controller. authType captured at construction (final field).
      Horizontal scaling unaffected. ProjectVersion + authType identical across
      replicas of the same deployment.
  strengths:
  - Pure in-memory field access — no DB round-trip, no I/O
  - |-
    Trivial allocation cost (new AppInfo DTO per request; the field strings
    are references to pre-allocated values captured at construction)
  weaknesses:
  - |-
    No HTTP caching directives, no @Cacheable, no ETag, no HTTP cache headers
    (severity LOW — per-call cost is trivial)
  cross_file_inconsistencies: []
  contributing_files:
  - AppInfoController@L18.md
  - AppInfoController controller-class.md
  evidence: []
notes: |-
  The concept name 'Deployment Introspection' is the closest available label;
  the live docs name neither the concept nor the endpoint.

  Recommended canonicalisation: add a 'Deployment Introspection' section to
  the live `enable-security` page covering (a) which fields `/api/appInfo`
  exposes, (b) the fingerprinting surface under `auth.type=DISABLED`, (c)
  the operator's options for restricting pre-auth access (whitelist gap
  discussion), (d) the expose-mode-hide-provider contract spanning AppInfo +
  Identity and the security rationale (limit unauthenticated fingerprinting
  to mode + version).

  **Batch T (2026-05-20) adds**:
    - Controller-class layer evidence anchoring the REPORTER-not-REACTOR pattern
      and the deliberate two-field contract
    - NEW expose-mode-hide-provider invariant (cross-endpoint design across
      AppInfo + Identity)
    - REFACTOR-185 reaches 19-SIDECAR with this controller-class layer view
    - Recommended ADR-145 promotion: 'SPA Runtime Configuration Discovery —
      Expose Mode, Hide Provider' to formalise the cross-endpoint contract

  The 2026-05-10B sidecar surfaces this as a doc-drift candidate for the
  maintainer's DOC-NNN queue.
