proposed_action: |-
  Testcontainers integration test (pinning the bug). (a) Create an INTERNAL metadata field via `metadataFieldRepository.bulkCreate(List.of(new MetadataFieldPojo().setName("cost_centre").setType("STRING").setOrigin("INTERNAL")))`. (b) Soft-delete via `metadataFieldRepository.delete(id)`. (c) Verify `listInternalMetadata("cost")` returns EMPTY (the field is hidden from the UI dropdown). (d) Attempt to re-create with the SAME name + same origin via `bulkCreate`. (e) Assert: `UniqueConstraintException` raised with message `Internal metadata with this name already exists`. (f) Add a `// REGRESSION-PIN — this test asserts the CURRENT LATENT BUG behaviour. The companion REFACTOR-NNN will add WHERE deleted_at IS NULL to the partial indexes (mirroring Tag's V0_0_64 fix); this test will then flip to assert that re-creation succeeds with a fresh id.` comment block. (g) Pair with a passing variant for EXTERNAL origin showing that `(name='cost_centre', type='STRING', origin='EXTERNAL')` and `(name='cost_centre', type='INTEGER', origin='EXTERNAL')` coexist (the asymmetric uniqueness model invariant).
