related_pillar_features:
  - "P-04:F-002"
notes: |-
  This operation is the SINGLE backend contract behind the entire dashboard.
  The pattern (one aggregate endpoint serving multiple visual blocks via a
  single composite DTO) is a deliberate architectural choice — recorded under
  the `single-fetch-aggregate-dashboard-projection` invariant. Sibling
  per-dataset operations (`aggregate-test-status-counts-for-dataset`) under
  F-022 have a different shape (per-entity scoped, one endpoint per surface).
maintainer_curated: false
