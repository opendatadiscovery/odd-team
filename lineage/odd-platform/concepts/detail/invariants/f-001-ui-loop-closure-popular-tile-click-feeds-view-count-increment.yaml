notes: |-
  New invariant captured in batch 2026-05-19J. The F-001 UI loop closure is the
  user-observable embodiment of the view_count UPDATE→READ loop on the client
  side. The loop is INTENTIONALLY closed — there is no separate analytics
  pipeline (no Mixpanel / Amplitude / Segment / GA / PostHog in the UI; verified
  by grep returning ZERO matches). The implicit decision is "the server-side
  view_count counter IS our usage metric".

  This decision couples the analytics signal to the read-as-write side-effect
  (per batch F's `read-as-write` implicit ADR). The coupling makes the F-001
  inflation surface MAXIMALLY visible to anyone driving the UI: a user can see
  their inflation take effect within the SPA session by clicking → back →
  observing the new ranking.
