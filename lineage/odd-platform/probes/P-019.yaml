expected_outcome: |
  LSN-019 STRESS-FINDING S-E-2: Pin whether two concurrent
  @ActivityLog-annotated mutations on the SAME data entity produce
  ActivityPojo rows with INCORRECTLY-ATTRIBUTED diffs.

  Mechanism: `ActivityAspect.monoActivityAspect` (`:41-59`) calls
  `getContextInfo(parameters, eventType)` BEFORE `joinPoint.proceed()`.
  The `@ReactiveTransactional` annotation (`:42`) wraps the around-advice
  in ONE TX, but two concurrent calls hold DIFFERENT TXs. Under
  READ_COMMITTED (Postgres default), if both TXs start before either
  commits, both capture `oldState = pre-mutation`. Then Tx A commits, Tx B's
  `getUpdatedState` reads post-A+post-B state. Tx A's ActivityPojo records
  `pre-mutation → post-A` (CORRECT). Tx B's ActivityPojo records
  `pre-mutation → post-A+post-B` (WRONG: attributes B's diff as
  `pre-mutation → post-A+post-B` instead of `post-A → post-A+post-B`).

  The Activity Feed shows B's row as if B reverted A's change AND added
  B's change, instead of just adding B's change.

  Arrange: 1 data entity (id 1019) + 2 pre-existing ownerships.

  Act: PARALLEL invocation — Tx A PUT (update ownership 1019's title);
  Tx B POST (add a new ownership). Synchronize via barrier so the calls
  overlap.

  Observe: read the two ActivityPojo rows that landed. Sort by
  insertion order (id ASC); the later-committed row's `old_state` should
  reflect pre-this-mutation state, NOT include the earlier-committed
  row's outcome.

  Assertion (current bug state, if the race manifests):
  - later_row.old_state == earlier_row.new_state  (the later TX saw
    the earlier's commit as its OLD — the wrong-attribution bug)

  Assertion (clean state, if isolation is correctly handled):
  - later_row.old_state != earlier_row.new_state  (each TX captured
    its genuine pre-this-mutation state via row lock or
    SELECT FOR UPDATE)

  When the fix lands (e.g. `getContextInfo` uses `SELECT ... FOR UPDATE`
  to lock the row, or the implementation moves to SERIALIZABLE isolation),
  this probe's wrong-attribution assertion flips — surfacing the fix in CI.

