behaviour: DataEntityHousekeepingJob ~25-table cascaded DELETE wrapped in a single
  jOOQ transaction (`DataEntityHousekeepingJob.java:71` `DSL.using(connection).transaction(ctx
  -> {...})` enclosing lines 99-126). A future schema migration that adds a new child
  table referencing DATA_ENTITY by FK would need a new `deleteX(...)` step here; missing
  it would either (a) fail the transaction with FK violation (loud) or (b) leave orphan
  rows if FK is ON DELETE CASCADE (silent). Zero integration coverage.
