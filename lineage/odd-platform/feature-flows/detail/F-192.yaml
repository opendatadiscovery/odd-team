terminal_side_effect:
  side_effect_class: composition-shell
  description: |-
    The composer renders one of six per-column sub-editors at a time
    (description in Edit or Preview mode; tags in dialog or chip-list;
    enums in dialog; terms with per-row delete; business-name in dialog;
    lookup-table column edit/delete dialogs). EVERY mutation routes
    through the F-047 backend chain. The composition's behaviour under
    fast field-switching (clicking through 10 fields in 2 seconds) is
    unverified — useEffect-based enum fetches may race.
  evidence: |-
    DatasetFieldOverview.tsx:54-98; DatasetFieldOverviewEnums.tsx:35-43;
    DatasetStructureItem.tsx:71-74.
observed_vs_expected:
  observed: |-
    Operator clicks a row in DatasetStructureList → selectedFieldIdAtom
    updates → every sub-editor re-renders against the new field. The
    description Edit button reads the new field's permission state
    (WithPermissions wraps EACH sub-editor's edit affordance separately).
    There is NO loading state when switching fields; if the previous
    field's enum fetch is still in flight, the new field's state may
    briefly show the previous field's data depending on Redux store
    update ordering. There is NO unsaved-changes warning when switching
    fields with an open dialog (e.g. tags Edit dialog open + click
    another field row — the dialog stays open editing the PREVIOUS
    field's tags).
  expected: |-
    Field-switching should (a) abort in-flight per-field fetches (enums,
    metrics) via AbortController; (b) warn on switch when a sub-editor
    has unsaved changes; (c) display a loading indicator on the composer
    until per-field-fan-out hooks resolve; (d) document the
    composition's keyboard navigation contract (arrow-keys move between
    fields? no — only mouse click; documented as click-only?).
  facets:
    - drift_class: per_column_editor_composition_no_unsaved_changes_warning_on_field_switch
      description: |-
        DatasetFieldOverview.tsx mounts six sub-editor components
        unconditionally. When a sub-editor dialog (e.g. TagsEditForm's
        DialogWrapper) is open and the operator clicks another field row
        in DatasetStructureList, the dialog stays open but the
        selectedFieldIdAtom updates. The dialog is a child of the
        composer that re-renders for the NEW field — but the dialog's
        internal `useForm` state was initialised from the PREVIOUS field's
        tags. Submit on this dialog would submit the previous field's
        tags against the new field's id (or rebind to the new field's
        id via the closure capture on `datasetFieldId` — depends on
        re-render timing). Behaviour is undefined from .tsx alone.
      evidence:
        - "DatasetFieldOverview.tsx:54-98 (unconditional sub-editor mount)"
        - "TagsEditForm.tsx:111-124 (DialogWrapper with handleCloseSubmittedForm)"
      severity: MEDIUM
      ui_unverified: true
      ui_unverified_reason: |-
        The behaviour under fast field-switching with open dialog requires
        runtime probe — datasetFieldId closure capture vs re-render
        contract unclear from static analysis.
    - drift_class: per_column_editor_no_keyboard_navigation_between_fields
      description: |-
        DatasetStructureList uses @tanstack/react-virtual (line 29-34) for
        VIRTUALIZED row rendering — only visible rows are mounted. There
        is NO keyboard handler for arrow-key navigation between rows;
        DatasetStructureItem.tsx:88-94 binds onClick only. Operators using
        keyboard-only workflows cannot tab-navigate the field list (the
        chevron expand button has aria-label but the row container does
        not have role="button" or tabIndex). Documentation does not
        flag the click-only requirement.
      evidence:
        - "DatasetStructureItem.tsx:88-94 (onClick-only row)"
        - "DatasetStructureList.tsx:29-34 (virtualized list)"
      severity: LOW
      ui_unverified: false
    - drift_class: per_column_editor_fast_field_switch_useeffect_enum_fetch_race
      description: |-
        DatasetFieldOverviewEnums.tsx:35-43 — `useEffect` dispatches
        `fetchDataSetFieldEnum({datasetFieldId: field.id})` on every
        change of `field.id` AND on `showEnums` flip. Cleanup is
        `resetLoaderByAction` (line 41) — resets loader state but does
        NOT abort the in-flight HTTP request. Fast field-switching can
        produce a race where field B's response arrives BEFORE field A's
        and the reducer overwrites field B's stored enums with field A's
        — depending on the reducer's keying. From .tsx alone the keying
        is opaque; the slice (datasetStructure.slice or enum.slice) would
        confirm.
      evidence:
        - "DatasetFieldOverviewEnums.tsx:35-43"
      severity: LOW
      ui_unverified: true
      ui_unverified_reason: |-
        The reducer's enum-storage keying (per-field-id keyed map vs
        global last-fetched buffer) is opaque from .tsx — slice
        enrichment needed.
    - drift_class: composer_split_state_management_redux_thunks_plus_react_query_hooks_coexist
      description: |-
        Within the same composition, description / tags / enums dispatch
        Redux thunks (updateDataSetFieldDescription / updateDataSetFieldTags /
        createDataSetFieldEnum), while business-name / term-add / term-delete
        use React Query mutations (useUpdateDatasetFieldInternalName /
        useAddDatasetFieldTerm / useDeleteDatasetFieldTerm). The two
        paradigms have different invalidation / cache semantics; an
        operator editing tags then immediately viewing the field via a
        different path may see stale data if Redux update succeeded
        but React Query cache is unaware. Mixed-paradigm composition is
        a refactor candidate per project-wide gradual-migration pattern.
      evidence:
        - "DatasetFieldDescription.tsx:9 (updateDataSetFieldDescription thunk)"
        - "DatasetFieldTags.tsx → TagsEditForm.tsx:7 (updateDataSetFieldTags thunk)"
        - "DatasetFieldHeader → DatasetFieldInternalNameForm.tsx:5 (useUpdateDatasetFieldInternalName)"
        - "DatasetFieldTerms.tsx → AssignFieldTermForm.tsx:3 (useAddDatasetFieldTerm)"
        - "TermItem.tsx:12 (useDeleteDatasetFieldTerm)"
      severity: LOW
      ui_unverified: false
    - drift_class: each_sub_editor_separately_wrapped_in_with_permissions_no_composite_read_only_mode
      description: |-
        Each per-column sub-editor wraps ITS OWN edit-affordance in a
        WithPermissions component (DATASET_FIELD_DESCRIPTION_UPDATE,
        DATASET_FIELD_TAGS_UPDATE, DATASET_FIELD_ENUMS_UPDATE,
        DATASET_FIELD_ADD_TERM, DATASET_FIELD_DELETE_TERM,
        DATASET_FIELD_INTERNAL_NAME_UPDATE). A user with READ-ONLY
        catalog access sees the composer but every edit button is
        disabled or hidden. The composer has NO read-only mode header
        ("You have read-only access to this dataset's fields") — the
        affordance is implicit. Consistent with platform-wide
        read-collaborative posture (per F-025 + system-mission.md), but
        operators may not realise WHY edit buttons are disabled.
      evidence:
        - "DatasetFieldDescription.tsx:65-77"
        - "DatasetFieldTags.tsx:41-54"
        - "DatasetFieldOverviewEnums.tsx:78-98"
        - "DatasetFieldTerms.tsx:76-93"
        - "DatasetFieldHeader.tsx:68-84"
      severity: LOW
      ui_unverified: false
    - drift_class: status_deleted_isstatusdeleted_propagation_to_all_sub_editors_consistent
      description: |-
        DatasetFieldOverview.tsx:25 reads `isStatusDeleted` from
        `getIsEntityStatusDeleted(dataEntityId)` and threads it to
        DatasetFieldDescription, DatasetFieldTags, DatasetFieldOverviewEnums,
        DatasetFieldTerms (lines 65-82). Each sub-editor conditionally
        renders its edit affordance ONLY when `!isStatusDeleted`. This
        is the LEGITIMATE deleted-entity read-only mode; correctly
        propagated. NOT a drift — corroboration finding.
      evidence:
        - "DatasetFieldOverview.tsx:25 + 65-82"
      severity: NONE
      ui_unverified: false
