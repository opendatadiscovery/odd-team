terminal_side_effect:
  side_effect_class: db-read
  description: |-
    Per-call: ONE jOOQ SELECT against `user_owner_mapping JOIN owner` (small,
    indexed, single-row). The terminal effect is the resolved OwnerPojo (or
    empty Mono if no mapping exists). Downstream consumers use this to scope
    SQL JOIN predicates on subsequent reads — the OwnerPojo is the
    authorization-relevant primitive, not a user-observable HTTP body itself.
    Side-effect class is db-read at this chokepoint; downstream chains terminate
    in page-render (the /my reads) or activity-emit (the per-owner activity
    views) per the consumer's contract.
  evidence: |-
    AuthIdentityProviderImpl.java:50-53 + ReactiveUserOwnerMappingRepositoryImpl.java:77-85, 116-127.
  cardinality_per_call: 'one OwnerPojo (Mono) per call; consumers fire N calls per request (3-5 sequential identical queries observed per page-load)'
amplification_factor: '3-5 sequential identical DB round-trips per page-load (no per-request memoisation)'
amplification_factor_provenance: |-
  STATIC — primary-source in batch K AuthIdentityProviderImpl sidecar
  performance.hot_paths + bugs_limitations_corner_cases[4]. A single HTTP
  request invoking `getCurrentUser` or `fetchAssociatedOwner` multiple times
  (controller for owner-scoping + permission extractor + activity-logging path)
  triggers N identical DB round-trips. The amplification is a known-and-deliberate
  no-cache stance (implicit_adrs[3]) but is unbounded — a future page rendering
  more owner-scoped surfaces would multiply linearly with no architectural
  guard.
observed_vs_expected:
  facets:
  - facet: S2S 'ADMIN' username / operator-named user 'ADMIN' collision (NEW HIGH)
    observed: |-
      S2sAuthenticationFilter.java:31-34 hardcodes
      `User.withUsername("ADMIN").roles("ADMIN")` and wraps in
      UsernamePasswordAuthenticationToken (provider=null at
      AuthIdentityProviderImpl.java:32). Any S2S call invoking a service using
      `fetchAssociatedOwner` looks up
      `WHERE OIDC_USERNAME='ADMIN' AND PROVIDER IS NULL`. If an operator has
      named a LOGIN_FORM or LDAP user 'ADMIN' (uppercase, exact case-sensitive
      match — the SQL uses `eq`, not `equalIgnoreCase`), the S2S caller's owner
      lookup resolves to THAT user's Owner. S2S API key holders thereby inherit
      one specific operator user's owner-scoped reads/mutations. The case
      sensitivity reduces but does not eliminate the collision.
    expected: |-
      S2S callers should either resolve to a system-Owner (separate from any
      operator user) OR carry an explicit no-owner flag (operations
      principal-independent). The hardcoded 'ADMIN' username is the boundary
      failure on naming collision.
    drift_class: s2s_admin_username_collision_security_boundary
    provenance: STATIC — PRIMARY-SOURCE in batch K AuthIdentityProviderImpl sidecar
      bugs_limitations_corner_cases[1] + security.known_security_gaps[1] +
      S2sAuthenticationFilter.java:31-34 + AuthIdentityProviderImpl.java:29-33 +
      ReactiveUserOwnerMappingRepositoryImpl.java:116-127
  - facet: LOGIN_FORM ↔ LDAP cross-mode bleed via provider=null
    observed: |-
      A LOGIN_FORM user `alice` and an LDAP user `alice` both produce
      `UserDto("alice", null)` at AuthIdentityProviderImpl.java:32. The
      downstream lookup builds `WHERE OIDC_USERNAME='alice' AND DELETED_AT IS
      NULL AND PROVIDER IS NULL` (ReactiveUserOwnerMappingRepositoryImpl.java:116-127).
      If both auth modes are configured to point at users that overlap (a
      common migration scenario), the second-mode user inherits the first-mode
      user's Owner-link. NO mode-check, NO warning log, NO fail-fast — the
      migration step is silent.
    expected: |-
      Either (a) all non-OAUTH2 modes produce a provider string that
      distinguishes them (e.g. "LOGIN_FORM" / "LDAP") OR (b) document the
      cross-mode bleed explicitly and require operators to avoid overlap.
    drift_class: login_form_ldap_provider_null_cross_mode_bleed
    provenance: STATIC — primary-source in batch K AuthIdentityProviderImpl sidecar
      bugs_limitations_corner_cases[0] + security.known_security_gaps[0] +
      AuthIdentityProviderImpl.java:29-33
  - facet: no auto-create of Owner on first login under OAUTH2 / LDAP
    observed: |-
      A new OAUTH2 or LDAP user authenticated for the first time has NO
      USER_OWNER_MAPPING row. `fetchAssociatedOwner` chain emits empty Mono.
      Downstream consumers (AlertService.listByOwner, DataEntityService.listAssociated,
      SearchServiceImpl.search with my_objects=true, ActivityServiceImpl.listMyEvents)
      all degrade to empty results with HTTP 200 — NOT 401/403/404. The new
      user sees `My Objects` empty, `My Alerts` empty, MY_OBJECTS activity
      empty, with NO on-screen signal directing them to the
      OwnerAssociationRequest flow.
    expected: |-
      Either (a) UI banner / status flag on first login directing the user to
      request owner-association OR (b) auto-create-on-first-login (configurable;
      maps to the documented invariant "one user, one owner") OR (c) explicit
      404/403 response with a "request owner association" hint.
    drift_class: no_auto_create_on_first_login
    provenance: STATIC — primary-source in batch K AuthIdentityProviderImpl sidecar
      bugs_limitations_corner_cases[2] + security.known_security_gaps[3] +
      AuthIdentityProviderImpl.java:50-53 + OwnerAssociationRequestServiceImpl.java:54-76 +
      live user-owner-association doc WebFetched 2026-05-19 status 200 silent on first-login
  - facet: empty SecurityContext silent propagation
    observed: |-
      When `ReactiveSecurityContextHolder.getContext()` emits empty (under
      `auth.type=DISABLED` — DisabledAuthSecurityConfiguration.java:11-19 wires
      no ServerSecurityContextRepository — OR a future regression where a
      WebFilter is misordered), `getCurrentUser` emits empty (no
      `.switchIfEmpty(Mono.error(...))`); every owner-scoped consumer therefore
      degrades to empty results. There is no logging, no metric, no warning. A
      regression that broke principal propagation across the entire reactor
      pipeline would manifest as "every user sees empty My Objects" —
      diagnosable only by examining each affected endpoint.
    expected: |-
      Either (a) `.switchIfEmpty(Mono.error(new UnauthenticatedException()))`
      with a warning log OR (b) documented narrative that empty SecurityContext
      is a valid state (DISABLED-mode dev-only) AND a Prometheus counter for
      "empty-context calls per second" as an observability surface.
    drift_class: empty_security_context_silent_propagation
    provenance: STATIC — primary-source in batch K AuthIdentityProviderImpl sidecar
      bugs_limitations_corner_cases[3] + security.known_security_gaps[2] +
      AuthIdentityProviderImpl.java:24-35
  - facet: single chokepoint + no caching = N DB round-trips per page load
    observed: |-
      Every fetchAssociatedOwner invocation issues `SELECT owner.* FROM
      user_owner_mapping JOIN owner ... WHERE oidc_username=? AND deleted_at IS
      NULL AND (provider=? OR provider IS NULL)`. For a UI rendering catalog
      home (mounting Recommended → My Objects + My Alerts count + Activity feed
      simultaneously), a single user page-load triggers 3-5 sequential
      identical queries to user_owner_mapping. The query is indexed (per the
      schema migrations) and small, but the absence of even a per-request
      memoisation (e.g. a reactor Context attribute) is a measurable per-page
      cost.
    expected: |-
      Either (a) per-request memoisation via reactor Context (resolve once per
      HTTP request, reuse across consumers) OR (b) per-session caching with
      explicit invalidation on USER_OWNER_MAPPING UPDATE / DELETE.
    drift_class: single_chokepoint_no_caching
    provenance: STATIC — primary-source in batch K AuthIdentityProviderImpl sidecar
      performance.hot_paths + performance.known_performance_gaps[0] +
      bugs_limitations_corner_cases[4] + implicit_adrs[3] (stateless / no-cache by deliberate omission)
  - facet: silent authority drop on multi-authority Authentication
    observed: |-
      `getCurrentUserProviderRole` reads ONLY the first authority via
      `authorities.iterator().next().getAuthority()` (line 44). If the
      GrantedAuthorityExtractor ever emits more than one authority (a future
      RBAC hierarchy refactor), the second-and-beyond are silently ignored.
      Today this is fine — the extractor emits exactly USER or ADMIN — but a
      future change adding (USER, READ_QUERY_EXAMPLE) etc. would silently lose
      information without test cover.
    expected: |-
      Either (a) explicit comment + test asserting "first-authority semantics
      are intentional; extractor emits exactly one authority" OR (b) aggregate
      across all authorities (or expose Set<UserProviderRole>).
    drift_class: silent_authority_drop
    provenance: STATIC — primary-source in batch K AuthIdentityProviderImpl sidecar
      bugs_limitations_corner_cases[5] + AuthIdentityProviderImpl.java:41-46
  - facet: compound (username, provider) key silent in docs
    observed: |-
      The user-owner-association doc says "one user can be associated only with
      one owner" but is silent on how "one user" is identified. The code
      identifies users by the COMPOUND key (username, provider) where provider
      is the OAuth2 registrationId or NULL. An operator migrating from
      LOGIN_FORM to OAUTH2 (or vice versa) discovers their existing user-owner
      mappings no longer match because the OAuth2 user has (alice, github)
      whereas the LOGIN_FORM user had (alice, null).
    expected: |-
      Documentation should spell out the compound key explicitly + a migration
      runbook for cross-mode transitions.
    drift_class: compound_key_silent_in_docs
    provenance: STATIC — primary-source in batch K AuthIdentityProviderImpl sidecar
      docs_link_semantic.doc_drift_findings[0] + AuthIdentityProviderImpl.java:29-33 +
      ReactiveUserOwnerMappingRepositoryImpl.java:116-127 + live doc WebFetched 2026-05-19
