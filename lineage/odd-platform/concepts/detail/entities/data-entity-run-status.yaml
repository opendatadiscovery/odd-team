notes: |-
  The enum is a `canonical_candidate: true` because the live docs name only
  a subset of the values and ODD's main-concepts.md does not enumerate it.
  Worth proposing for canonical-vocabulary extension on the next docs refresh —
  the dashboard.md sub-page is the natural home for the full six-value table
  with one-line semantics per value (SUCCESS / FAILED / SKIPPED — clear;
  BROKEN / ABORTED / UNKNOWN — undocumented; surface a DOC-NNN follow-up).

  Same enum drives F-022 (per-dataset test reports — DataSetTestReport bucket
  counts: success/failed/aborted/skipped/broken/unknown) and F-032 (dashboard
  breakdown ring + per-category tiles). Two independent UI surfaces, one shared
  type — concept entry exists once.
