proposed_action: |-
  Add `TagServiceImplDeleteSearchVectorRefreshTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/` using Mockito + `@SpringBootTest`. Two test methods:

  1. **`delete_invokesOnlyTermSearchVectorRefresh_pinsAsymmetricRefreshVsUpdate`** (HEADLINE):
     - Arrange: spy on `reactiveSearchEntrypointRepository` AND `reactiveTermSearchEntrypointRepository`. Seed a non-external tag.
     - Act: `tagService.delete(tagId).block()`.
     - Assert: `verify(reactiveTermSearchEntrypointRepository, times(1)).updateChangedTagVectors(tagId)`; `verify(reactiveSearchEntrypointRepository, never()).updateChangedTagVectors(any())`; `verify(reactiveSearchEntrypointRepository, never()).updateChangedTagStructureVector(any())`. PIN: the asymmetric refresh.

  2. **`delete_andUpdate_haveDifferentRefreshCounts_documentsAsymmetryAsContract`**:
     - Arrange: same spy setup. Seed a non-external tag.
     - Act: `tagService.update(tagId, formData).block()` → THEN `tagService.delete(tagId).block()` on a SECOND tag.
     - Assert: across BOTH operations, `reactiveTermSearchEntrypointRepository.updateChangedTagVectors` was called TWICE (once per op); `reactiveSearchEntrypointRepository.updateChangedTagVectors` was called ONCE (update only); `reactiveSearchEntrypointRepository.updateChangedTagStructureVector` was called ONCE (update only). PIN: the asymmetry is per-operation, NOT a configuration-driven choice.

  Cross-pair with TEST-GAP-861. After both land, REFACTOR-NNN can extract a unified helper. Cross-pair with DOC-NNN to surface the freshness asymmetry.
