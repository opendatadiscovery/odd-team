question: |
  What is the actual I/O cost of `SELECT count(*) = 0 FROM <partition>`
  (PartitionServiceImpl.java:133-142) when applied to a POPULATED activity
  partition on a multi-year deployment?

  The static-inferred fear: 96 cycles/day × N past partitions × per-partition
  count-scan cost = potentially gigabytes of I/O per day, all spent confirming
  that NO partition can be dropped (because all are populated).

  Specifically: on a partition with 10M rows, does Postgres short-circuit
  `count(*) = 0` (e.g. via planner optimisation that detects the predicate)
  or does it sequentially scan the entire partition?

  Cross-question: would rewriting as `WHERE NOT EXISTS (SELECT 1 FROM
  <partition> LIMIT 1)` reduce the cost to O(1)?

stress_category: A (tunables — scaling boundaries), Performance
stress_question_ids: [Q-A.4]

triggers:
  - PartitionServiceImpl.java:134 (`SELECT count(*) = 0 FROM %s`)
  - No `LIMIT`, no `EXISTS`, no early-exit hint
  - Runs every 15 minutes per past partition
  - Multi-year deployment with `partition-period=1` (e.g. compliance setting
    for narrow partitions) accumulates 365 past partitions/year

arrange:
  - docker-compose: postgres + odd-platform.
  - Configure: `housekeeping.enabled=true`; `odd.activity.partition-period=30`
    (default).
  - Seed scenarios:
    - Scenario A (empty baseline): 10 past empty partitions, no rows.
    - Scenario B (populated): 10 past partitions, EACH containing 1M rows
      (synthesise via `INSERT INTO activity_YYYYMMDD_YYYYMMDD SELECT
      ... FROM generate_series(1, 1000000)`).
    - Scenario C (heavily populated): 10 past partitions, EACH containing
      10M rows.
  - Enable Postgres slow-query log (`log_min_duration_statement = 100`).
  - Enable `EXPLAIN (ANALYZE, BUFFERS)` capture: alter
    `PartitionServiceImpl.isPartitionEmpty` temporarily to log the query
    plan + execution time per partition (or instrument via JDBC trace).

act:
  - Trigger one housekeeping cycle in each scenario.
  - Measure: total cycle wall-clock time; per-partition `count(*) = 0` time;
    per-partition I/O (buffers hit / buffers read from disk).

