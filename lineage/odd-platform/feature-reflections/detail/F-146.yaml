- id: H-007
  hypothesis: "When the same entity is at the staleness threshold boundary, every user sees a consistent is_stale value regardless of which platform replica served their request."
  derivation: "Negative-space — the predicate calls DateTimeUtil.generateNow() per mapper invocation (no centralised clock); horizontally-scaled deployments have per-node wall clocks."
  seed_source: negative-space + pillar (cross-replica consistency)
  validation:
    verdict: probe-needed
    actual_behavior: |
      The predicate uses `DateTimeUtil.generateNow()` evaluated on the rendering replica
      (DataEntityStaleDetector.java:16). For an entity whose `lastIngestedAt + stalePeriod` is within the
      inter-node clock-skew window of "now", two replicas can land on opposite sides of the cutoff and
      return different is_stale values for the same entity at the same wall-clock instant — a visual
      flicker as a load-balanced user's requests round-robin across pods. Whether this is OBSERVABLE
      requires running a 2-node deployment with induced skew and seeding an entity at the threshold edge;
      it cannot be settled from static reading (it depends on real clock drift + LB behaviour). metadata-
      stale.md:74-78 documents the mechanism and rates it low-impact for sub-second-NTP single-region
      deployments. Verdict is probe-needed to confirm the magnitude and the exact boundary condition.
    evidence:
      - sidecar: source_read_for_validation
        section: clock
        cite: "DataEntityStaleDetector.java:16"
        note: "DateTimeUtil.generateNow() per invocation — no centralised / DB-side NOW()"
      - sidecar: feature-flows/detail/F-146.yaml
        section: "observed_vs_expected facet (clock-skew)"
        cite: "DataEntityStaleDetector.java:13"
        note: "per-mapper-invocation now() → flicker on horizontally-scaled deployments"
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-146-1
    routes_to_finding: probe-needed
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: probe

