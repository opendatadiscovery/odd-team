name: |-
  Exception-type asymmetry between notification senders — STRENGTHENED batch Y with primary source at EmailNotificationSender lines 58-60 + sibling silence at Slack/Webhook + seam root cause at PostgresWALMessageProcessor
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
description: |-
  STRENGTHENS the existing exception-type-asymmetry-notification-senders
  invariant (batch K) by PRIMARY-SOURCE pinning the contract-violation site
  at EmailNotificationSender.java:58-60 (the RuntimeException wrap) via
  the batch-Y EmailNotificationSender file-analyser sidecar AND
  cross-confirming the symmetric well-behaved behaviour at the two HTTP
  channel siblings (SlackNotificationSender, WebhookNotificationSender)
  via their batch-Y sidecars AND root-causing the architectural pattern
  at the seam (PostgresWALMessageProcessor batch Y).

  The batch-K invariant identified the SYMPTOM (email RuntimeException
  bypasses dispatcher's per-sender catch). Batch Y provides:
    - PRIMARY SOURCE at EmailNotificationSender (THE contract violator)
    - SYMMETRIC CONFIRMATION at SlackNotificationSender + WebhookNotificationSender
      (THE well-behaved siblings)
    - SEAM ROOT CAUSE at PostgresWALMessageProcessor (the architectural
      pattern that makes the bypass possible)
    - LATENT EXTENSION findings (the JSON-serialise path in Slack +
      Webhook is also a latent RuntimeException leak)

  THE PRIMARY-SOURCE EVIDENCE — EmailNotificationSender batch Y:

    EmailNotificationSender.java:58-60 (the contract-violation site):
      } catch (MessagingException | TemplateException | IOException e) {
          throw new RuntimeException(e);
      }
    The wrap is RuntimeException — NOT NotificationSenderException. The
    raw RuntimeException is unchecked; the catch site at
    AlertNotificationMessageProcessor.java:31 catches ONLY
    NotificationSenderException (checked); the RuntimeException bypasses
    and propagates upward, aborting the per-sender loop mid-fan-out.

    Verified by reading EmailNotificationSender.java:1-87 end-to-end at
    batch Y. The RuntimeException is the ONLY non-NotificationSenderException
    path out of send(). No other sender in the codebase performs this
    wrap.

  THE SYMMETRIC CONFIRMATION — SlackNotificationSender batch Y:

    SlackNotificationSender.java:48 — delegates entirely to
    AbstractNotificationSender.sendAndValidate (the parent at
    AbstractNotificationSender.java:16-30). The parent at lines 22-29:
      } catch (IOException e) {
          throw new NotificationSenderException(...);
      }
      if (response.statusCode() != HttpStatus.OK.value()) {
          throw new NotificationSenderException(...);
      }
    Both failure paths wrap as NotificationSenderException. CONTRACT-
    COMPLIANT.

    LATENT extension (SlackNotificationSender.java:62-66 — the
    serializePayload helper):
      try {
          return objectMapper.writeValueAsString(payload);
      } catch (JsonProcessingException e) {
          throw new IllegalArgumentException(e);
      }
    IllegalArgumentException is a RuntimeException. If Jackson
    serialisation ever throws (currently unreachable because
    AlertNotificationMessage is Jackson-clean), the IllegalArgumentException
    bypasses the dispatcher's catch identically to the email path. The
    Slack sender has the same latent hazard. Severity LOW because
    currently unreachable.

  THE SYMMETRIC CONFIRMATION — WebhookNotificationSender batch Y:

    WebhookNotificationSender.java:18-23 — also delegates to
    AbstractNotificationSender.sendAndValidate. CONTRACT-COMPLIANT for
    the IOException + non-200 paths.

    LATENT extension (WebhookNotificationSender.java:22 +
    JSONSerDeUtils.java:62-64):
      WebhookNotificationSender.java:22 calls JSONSerDeUtils.serializeJson(message).
      JSONSerDeUtils.java:62-64:
        } catch (JsonProcessingException e) {
            throw new RuntimeException(e);
        }
      The wrap is raw RuntimeException — IDENTICAL to the email path.
      Currently unreachable (AlertNotificationMessage is Jackson-clean)
      but STRUCTURALLY VIOLATES the contract.

    Severity LOW because currently unreachable, but the latent hazard is
    structurally identical to the email path's runtime bypass.

  THE SEAM ROOT CAUSE — PostgresWALMessageProcessor batch Y:

    PostgresWALMessageProcessor.java:6 (the seam contract):
      void process(final DecodedWALMessage message) throws InterruptedException;
    The seam declares ONLY InterruptedException. Any wider exception
    type from the implementor is UNDECLARED. The implementor
    (AlertNotificationMessageProcessor) handles per-sender failures via
    catch (NotificationSenderException e) — but cannot declare that on
    the seam because the seam's narrow throws clause forbids it. The
    seam's narrow shape PRECLUDES expressing "the implementor may throw
    sender-class exceptions; please handle them" — every wider exception
    leaks out of process() into the subscriber's generic catch
    (Exception e) at NotificationSubscriber.java:90 and triggers the
    poison-replay loop.

    The architectural root cause: a seam shape designed for one
    caller-impl pair (NotificationSubscriber + AlertNotificationMessageProcessor)
    with narrow throws clause means the implementor's wider runtime
    exception surface is invisible at the interface level; a maintainer
    reading PostgresWALMessageProcessor.java alone cannot know that
    RuntimeException is a real path through the seam.

  THE 4-PART PICTURE — refined from batch-K's 1-part:

    Part 1 (batch K — original capture):
      EmailNotificationSender wraps as RuntimeException; dispatcher's
      catch only handles NotificationSenderException; email RuntimeException
      bypasses and aborts fan-out for OTHER channels still in the iteration.

    Part 2 (batch Y EmailNotificationSender — PRIMARY SOURCE pin):
      The wrap site at EmailNotificationSender.java:58-60 is the SOLE
      runtime-contract-violator in the sender hierarchy. No other sender
      does this at runtime.

    Part 3 (batch Y SlackNotificationSender + WebhookNotificationSender —
      LATENT EXTENSIONS):
      Both HTTP senders have a LATENT runtime-contract-violation via
      Jackson-serialise paths (IllegalArgumentException for Slack +
      RuntimeException for Webhook). Currently unreachable, but the
      structural pattern is present. A future change that breaks
      Jackson-clean status of AlertNotificationMessage activates these
      latent extensions.

    Part 4 (batch Y PostgresWALMessageProcessor — SEAM ROOT CAUSE):
      The seam's narrow throws clause (only InterruptedException) is the
      structural reason the implementor cannot declare a wider runtime
      exception surface at the interface level. A maintainer adding a
      new sender or extending an existing sender cannot consult the
      seam to learn the exception contract — they must read each
      sender impl AND the parent AbstractNotificationSender AND the
      dispatcher's catch to know what's expected.

  CROSS-LINK TO BATCH-Y CROSS-CHANNEL-RUNTIMEEXCEPTION-ABORT INVARIANT:

    The new batch-Y invariant
    cross-channel-runtimeexception-abort-void-return-root-cause-at-postgreswalmessageprocessor
    captures the same seam-shape root cause from a different angle (void
    return + narrow throws = no failure-signal channel). The two
    invariants are siblings:
      - THIS invariant (exception-type-asymmetry — STRENGTHENED batch Y):
        focuses on the IMPL-SIDE contract violation + symmetric behaviour
        across senders + the LATENT extensions
      - cross-channel-runtimeexception-abort: focuses on the BLAST-RADIUS
        consequence (one sender's RuntimeException aborts other channels
        for the same message)
    Both invariants should be cited when the F-009 exception-class
    architecture is discussed.

  THE MITIGATION COMPARISON — three options, all primary-sourced:

    Option A (closes the symptom; ignores latent extensions and root
              cause): broaden AlertNotificationMessageProcessor.java:31
      from catch (NotificationSenderException e) to catch (Exception e).
      ONE-line fix. Closes the email-bypass leak (Part 1 + 2) AND the
      latent Jackson-serialise leaks (Part 3) simultaneously. Does NOT
      change the seam (Part 4). Best near-term fix; recommended.

    Option B (closes the root cause; requires architectural change):
      widen PostgresWALMessageProcessor's throws clause to declare a
      wider runtime exception type (or wrap all implementors' runtime
      exceptions at the seam-boundary into a typed result). Requires
      coordinated change at the implementor + caller. Closes Part 4 but
      leaves Parts 1-3 unaddressed unless paired with Option A.

    Option C (fixes the contract violator at source; ignores siblings
              and root cause):
      change EmailNotificationSender.java:58-60 to wrap as
      NotificationSenderException instead of RuntimeException. Closes
      Part 1 + 2 only. Leaves Part 3 (latent extensions) live and Part
      4 (root cause) live.

  SEVERITY remains HIGH (inherited from batch-K); this strengthening
  does not change severity but provides the 4-part architectural
  picture and primary-sources the latent extensions and seam root cause.
