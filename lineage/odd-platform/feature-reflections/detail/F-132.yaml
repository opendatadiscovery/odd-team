- id: H-004
  hypothesis: "When a user opens a link with a tab value that does not exist (e.g. a stale or hand-typed /data-modelling/query-examples/42?tab=foo), the page falls back to a sensible default tab (Overview) and shows content."
  derivation: "Negative-space + UI device behaviour — tab links get shared in chat and edited by hand; a product owner expects graceful fallback, not a blank screen. This is the feature-flow's own facet[0]."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The fallback is HALF-wired. `QueryExampleDetailsContainer.tsx:31` reads
      `searchParams.get('tab') ?? 'overview'` — the `??` only defaults when the param is ABSENT; for
      `?tab=foo` the value is the literal string 'foo', which is truthy, so NO default applies. None of
      the three conditional render branches at lines 74 ('overview'), 80 ('linked-entities'), 85
      ('linked-terms') match 'foo', so the body renders NOTHING. In parallel, QueryExampleDetailsTabs.tsx:38
      derives the active tab index via `tabs.findIndex(tab => tab.value === type)`, which returns -1 for
      'foo', so AppTabs highlights NO tab. Net user-visible result: the page header renders, but the body
      is BLANK and no tab is active. This is the feature-flow's facet[0]
      (query_example_details_tab_url_param_no_runtime_validation_arbitrary_strings_fall_through_to_overview_silently)
      — same URL-as-typed-state-without-validation family as F-037's relationships_type facet.
    evidence:
      - sidecar: "(feature-flow primary-source) F-132 observed_vs_expected facet[0]"
        section: "observed_vs_expected.facets[0].evidence"
        cite: "QueryExampleDetailsContainer.tsx:30-31,74,80,85 + QueryExampleDetailsTabs.tsx:38"
        note: "?? defaults only on absence; 'foo' falls through all 3 branches → blank body, findIndex -1 → no active tab"
    operator_visible_failure: |-
      (1) A user who clicks a stale shared link, or whose link was line-wrapped/truncated by a chat client
      to a malformed ?tab value, lands on a page that shows the snippet header but a completely empty body
      with no active tab and no error message — they cannot tell whether the snippet has no content or the
      page is broken. (2) A future rename of a tab value (e.g. 'linked-entities' → 'entities') would
      silently break every previously-shared link to that tab with the same blank-body symptom. (3) Recovery
      requires the user to manually delete the ?tab segment or click a tab — non-obvious. The facet is rated
      LOW severity in the feature-flow (cosmetic/UX), but as a user-facing promise the blank-body-no-active-tab
      outcome is a clear contradiction of the 'sensible default' expectation.
    severity: LOW
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: resolve-later
    coverage: unverified
    coverage_note: |-
      No test exercises a malformed ?tab value and asserts the rendered fallback. The fix (validate
      `tab` against the known set and default to 'overview' when not found) would make this a clean
      happy-path; a regression test would pin the validated fallback.

