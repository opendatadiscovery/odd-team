behaviour: |-
  Cross-owner per-entity alert read regression-pin (HIGH — REFACTOR-024 sibling on a per-entity surface). GET /api/dataentities/{id}/alerts has NO @PreAuthorize, NO SecurityConstants.SECURITY_RULES entry for the GET path (SecurityConstants.java:98-355 enumerated — only PUT /api/dataentities/{data_entity_id}/alert_config at line 306 with DATA_ENTITY_ALERT_CONFIG_UPDATE is gated), NO owner-scoping at any layer. The downstream `AlertService.getDataEntityAlerts → ReactiveAlertRepository.getAlertsByDataEntityId` is a single `SELECT ALERT.* FROM ALERT JOIN DATA_ENTITY ON DATA_ENTITY.ODDRN = ALERT.DATA_ENTITY_ODDRN WHERE DATA_ENTITY.ID = :id` jOOQ select with NO OWNERSHIP join and NO principal-derived predicate (AlertServiceImpl.java:138-143, ReactiveAlertRepositoryImpl.java:182-199). The structural asymmetry with the sibling `listByOwner` query (ReactiveAlertRepositoryImpl.java:160-178) — which DOES `.join(OWNERSHIP)` — confirms the per-entity-unscoped pattern is deliberate. An authenticated caller enumerating `data_entity_id` values via the search/list endpoints can read every alert ever raised on every catalogued entity, including alert chunks (raw AlertManager-derived generator-URL text propagated from ingestion). The live alerting doc (WebFetched 2026-05-19 status 200) names this endpoint VERBATIM as the audit-export workaround for the housekeeping bug but does NOT say whether cross-owner access is intentional. The doc's intended workaround use case (an owner exporting THEIR OWN entity's alerts) is harmless; the same endpoint is a discovery surface for an attacker with any authenticated session willing to enumerate IDs. Pair with REFACTOR-024 (catalog-wide cross-owner enumeration on `getAllAlerts`) — the per-entity surface is structurally the same. Cross-pillar P-07 (Alerts feature) + P-09 (Authorization model — read-collaborative posture).
