control_summary: |-
  0 of 4 cells COVERED — feature emerges from batch-K primary-source audit of
  AuthIdentityProviderImpl. ZERO direct unit tests for this class (verified via
  Grep for `AuthIdentityProviderImplTest` / `AuthIdentityProviderTest` under
  `odd-platform-api/src/test` returning zero matches). Given that this is the
  SOLE chokepoint for owner-scoping across 15 callsites, a regression in any of
  the three method bodies silently degrades the entire owner-scoped read
  surface to either empty results (false negative — user sees nothing they own)
  or wrong-owner results (false positive — user sees another owner's data).
  The two highest-leverage probe candidates are: (a) the S2S 'ADMIN' username
  collision security boundary (configure LDAP with an 'ADMIN' user + a
  separately-owned set of data entities + issue an S2S call + assert whether
  the call resolves to a system-Owner OR to the LDAP 'ADMIN' user's Owner —
  HIGHEST SEVERITY probe); (b) the LOGIN_FORM ↔ LDAP cross-mode bleed (configure
  both modes with overlapping usernames + assert second-mode user inherits the
  first-mode's Owner). Local docker-compose probe stack is sufficient: ODD
  platform + Postgres + an LDAP server (e.g. OpenLDAP docker image) + a
  LOGIN_FORM user with the same username.

  Batch N adds ReactiveUserOwnerMappingRepositoryImpl primary-source — the
  SQL-LAYER twin of the AuthIdentityProviderImpl batch-K primary source. The
  cross-mode bleed architectural triangle is now CLOSED at three vertices:
  (a) principal layer producer (AuthIdentityProviderImpl.java:32 — UserDto(name,
  null) for LOGIN_FORM/LDAP/S2S), (b) SQL layer consumer (THIS batch —
  ReactiveUserOwnerMappingRepositoryImpl.java:121-125 — the
  `StringUtils.isNotEmpty(provider) ? PROVIDER.eq(provider) : PROVIDER.isNull()`
  branch), (c) schema (V0_0_55__add_policies_and_roles.sql:1-2 nullable
  `provider VARCHAR(255)` column). A migration mitigation must touch ALL THREE
  vertices simultaneously. Six new drift facets surface: provider-null bleed
  PRIMARY SOURCE at SQL layer + cross-provider username row-duplication in
  external JOINs (four other repositories LEFT JOIN on OIDC_USERNAME only —
  alerts/activity feed duplicate; Owner display non-deterministic on naming
  collision) + positional INSERT schema-evolution fragility (line 45) + no
  @ReactiveTransactional on multi-statement createRelation (partial-failure
  leaves user unmapped) + soft-delete-only table growth (no operator pruning
  path, no Housekeeping job) + type mismatch DATE vs TIMESTAMP on
  deleted_at INSERT. ZERO direct unit tests at this repository
  (`ReactiveOwnerAssociationRequestRepositoryImplTest.java:50` uses it only
  for fixture setup). The chokepoint is now PRIMARY-SOURCE COMPLETE at every
  layer of the chain (principal + SQL + schema); the S2S 'ADMIN' collision
  + LOGIN_FORM↔LDAP bleed remain the two HIGHEST-LEVERAGE probe candidates,
  unchanged from batch K, now with explicit SQL-layer evidence at lines
  121-125 for the maintainer to use as the regression-pin oracle.

  Batch-P adds OwnerController.updateOwner primary-source — the
  load-bearing CONTRAST to the OIDC_USERNAME rename hazard surfaced
  in batch O. The OWNER.NAME rename surface PRESERVES USER_OWNER_MAPPING
  intact because the FK is by `owner.id` (the bigserial PK), NOT by
  name (V0_0_4__add_user_owner_mapping.sql:3). Together with REFACTOR-391
  (GitHub-login-rename orphan — OIDC_USERNAME side is hazardous), the
  two findings describe the COMPLETE rename hazard surface: the
  OIDC_USERNAME side is the dangerous direction; the OWNER.NAME side
  is the safe direction. Cite BOTH in any future "owner-mapping
  stability" documentation. Five additional concerns on the OWNER.NAME
  rename surface: (1) no audit-log on update (6th audit-silence
  sidecar for the Owner side of the RBAC mutation surface,
  complementing the 5-sidecar pattern surfaced by batch-P's deleteOwner);
  (2) empty `roles` field silently destroys ALL role bindings (HIGH —
  destructive UX hazard); (3) rename collision propagates as USR003 /
  HTTP 400 not 409 Conflict (consistent with the batch-K cross-batch
  correction pattern); (4) OpenAPI declares 201 for the PUT-update
  but the implementation returns 200 (class-wide drift mirrored on
  the createOwner sibling); (5) OWNER_UPDATE permission scope is
  GLOBAL — a caller with OWNER_UPDATE can rename ANY Owner row
  regardless of USER_OWNER_MAPPING-association. The disambiguation
  finding (OWNER.NAME vs OIDC_USERNAME rename safety) is the headline;
  the five secondary concerns are the operator-visible surface that
  should be documented on the live owners page. NO probe required —
  the safe-rename invariant is structurally provable from the schema
  (V0_0_4__add_user_owner_mapping.sql:3 FK declaration); the regression-pin
  for the OIDC_USERNAME side already exists at batch O via REFACTOR-391.
