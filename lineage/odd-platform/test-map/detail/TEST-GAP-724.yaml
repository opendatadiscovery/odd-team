proposed_action: |-
  Add `TermToTermDeletedAtMissedMigrationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/term/`. Four test methods:
  1. `v0_0_91_termToTerm_deletedAtColumnExistsButNoCodePathWritesToIt` — schema-shape assertion: query `information_schema.columns WHERE table_name='term_to_term' AND column_name='deleted_at'` returns ONE row (the dead column). PIN the current state. Pair with the maintainer note that this should return ZERO rows post-cleanup-migration.
  2. `termServiceImplDelete_doesNotCleanUpTermToTermRows_currentStateLeavesDangling` — call `TermServiceImpl.delete(termId)` on a term that is in N `term_to_term` rows; assert `SELECT COUNT(*) FROM term_to_term WHERE assigned_term_id = ? OR target_term_id = ?` returns N (the dangling state). PIN the bug. Pair with the maintainer note that this should return 0 post-cascade-fix.
  3. `termServiceImplDelete_doesCleanUpDataEntityToTermAndDatasetFieldToTerm_assertsPositiveCascade` — pin the symmetric POSITIVE behaviour for the two sibling link tables to make the asymmetry clear.
  4. `linkTermWithTerm_thenDelete_assertsHardDeleteNotSoftDelete` — call `linkTermWithTerm(A, B)`, then `removeTermToLinkedTermRelation(A, B)`, assert the row is GONE from `term_to_term` (hard delete) and NOT merely flagged with `deleted_at`. PIN the actual mutation semantics.

  Pair with a follow-up backlog item proposing a cleanup migration `V0_0_NNN__drop_term_to_term_deleted_at.sql` that runs `ALTER TABLE term_to_term DROP COLUMN IF EXISTS deleted_at` — and that also adds a `termRelationsRepository.deleteRelationsWithTerm(termId)` method called from `TermServiceImpl.delete` to fix the orphan-rows issue. When the fix lands, test #1 inverts to assert ZERO rows; test #2 inverts to assert 0 dangling.

  This gap is a primary-source SUPERSEDE on TEST-GAP-538's interpretation — recommend the maintainer mark TEST-GAP-538 with `superseded_by: TEST-GAP-724` per the LSN-018 Rule 6 coherence-correction protocol.
