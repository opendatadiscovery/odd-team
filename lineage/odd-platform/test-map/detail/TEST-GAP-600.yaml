  WebTestClient + cookie test. (a) Boot with `auth.type=OAUTH2` + Azure provider configured with logout-uri. (b) Authenticate a stub Azure user; obtain session. (c) POST /logout with explicit `X-Forwarded-Host: attacker.example.com` header. (d) Assert response 302 Location contains `post_logout_redirect_uri=https://attacker.example.com/` (the Host header propagates without sanitization). (e) Mirror for Cognito: assert `logout_uri=https://attacker.example.com/`. (f) Pin the current Host-trusting behaviour; future REFACTOR adding `odd.platform-url` + cross-check flips assertions to expect 400 OR the configured platform URL substituted.
