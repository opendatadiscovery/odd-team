cross_cutting_patterns:
  - pattern: |
      DataSourceController is a fully-shipped 5-endpoint operator + S2S-credential
      management surface with ZERO controller-tier and ZERO service-tier test coverage.
      No DataSourceControllerTest, no DataSourceServiceImplTest, no TokenGeneratorImplTest.
      The only DataSource test is DataSourceRepositoryImplTest (repository-tier, 7
      methods). Every drift this batch surfaced — the destructive token-rotation cutover,
      the DISABLED-bypass credential-rotation-hijack, the masked-token one-line-flip
      leak, the REPLACE-not-MERGE silent field-wipe, the cascade-block, the orphan-token
      leak, the 201-vs-200 spec drift, the no-permission list posture — is silent in CI;
      a refactor touching any of them compiles and passes every existing test.
    affected_node_count: 6
    contributing_sidecars:
      - "odd-platform__java__DataSourceController__controller-method__getDataSourceList.md"
      - "odd-platform__java__DataSourceController__controller-method__registerDataSource.md"
      - "odd-platform__java__DataSourceController__controller-method__updateDataSource.md"
      - "odd-platform__java__DataSourceController__controller-method__deleteDataSource.md"
      - "odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken.md"
    proposed_remedy: |
      See TEST-GAP-909 (META anchor) — stand up the DataSource test package
      (HTTP-tier @SpringBootTest + service-tier classes) with a Testcontainers base, an
      RBAC-permission fixture, and an auth.type=DISABLED context. Houses TEST-GAP-898..908
      + TEST-GAP-749..753 as child test-authoring tasks.

  - pattern: |
      The shared TokenGeneratorImpl + ReactiveTokenRepositoryImpl + TokenMapper +
      TokenDto stack underlies BOTH the data-source token surface (DataSourceController)
      and the collector token surface (CollectorController). The two surfaces are
      structurally identical — both gate a MANAGEMENT-tier *_TOKEN_REGENERATE permission
      with no @PreAuthorize, both return plaintext on issue/rotate, both miss
      @ReactiveTransactional on the service rotation method, both share the
      RandomStringUtils-not-SecureRandom entropy gap, both have the DISABLED-bypass and
      the no-audit-log gap. A fix to one (SecureRandom, audit logging, grace period,
      Cache-Control: no-store) should be applied to both. A single TokenGeneratorImplTest
      satisfies both TEST-GAP-098 (collector) and TEST-GAP-907 (data-source).
    affected_node_count: 2
    contributing_sidecars:
      - "odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken.md"
    proposed_remedy: |
      Treat the token-rotation hardening (SecureRandom, audit log, grace window,
      no-store header) as a single cross-controller REFACTOR family; the test classes
      proposed by TEST-GAP-898/899/900/907 + the existing TEST-GAP-093..100 should land
      in a shared token-rotation test package covering both controllers.

