terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Per-column annotation rows mutated: dataset_field.internal_description
    (verbatim, no sanitization), dataset_field.internal_name,
    tag_to_dataset_field (INTERNAL channel — delete-all-then-recreate),
    dataset_field_enum_values (bulk-replace via softDeleteExcept),
    dataset_field_to_term (manual rows only, description-link rows
    survive). Activity events may fire (TERM_ASSIGNMENT_UPDATED for
    description-derived term links — see SHB-017's analysis).
  evidence: |-
    DatasetFieldServiceImpl.java:117-132; EnumValueServiceImpl.java:91-122;
    TermRelationsRepositoryImpl.java:179; ReactiveDatasetFieldRepositoryImpl.java:73-80.
observed_vs_expected:
  observed: |-
    Operator edits per-column description in the Structure tab → body
    is stored verbatim (HTML / markdown / scripts). Tags update on a
    column with `tags: []` clears every INTERNAL tag silently.
    EXTERNAL_STATISTICS tags (from collector ingestion) survive but
    the operator may not realise the surviving rows belong to a
    different channel. Enum-value POST with a partial body silently
    deletes existing items (operationId says CREATE; behaviour is
    BULK-REPLACE). DELETE-term on a column that has the term linked
    via both manual-add AND description marker returns 204 but the
    term remains. SecurityConstants wires the term-add endpoint to
    DATA_ENTITY_ADD_TERM (Data Entity scope) instead of the documented
    DATASET_FIELD_ADD_TERM (field scope) — anyone with the entity-scope
    permission can link terms to any field of any entity they hold the
    permission on. Spec declares 201 for the three PUTs; controller
    returns 200.
  expected: |-
    Description is sanitized at write time (or render-time defence is
    documented and tested). Tag update is a diff (current tags ∪
    submitted tags, removals are explicit). Enum-value POST is
    truly create-only OR the operationId is renamed to
    replaceEnumValues. DELETE-term removes all rows OR returns 409
    Conflict explaining the description-link survivor. Permission
    gates match the docs (DATASET_FIELD_ADD_TERM gates the field-scope
    endpoint; DATA_ENTITY_ALERT_RESOLVE gates alert PUT). Response
    code 201 matches the spec for resource-creating PUTs.
  facets:
    - drift_class: security_constants_wiring_bug_term_endpoint_gated_by_data_entity_permission
      description: |-
        SecurityConstants.java:299 gates POST /api/datasetfields/{id}/terms
        with DATA_ENTITY_ADD_TERM (DataEntity-scope) instead of the
        documented DATASET_FIELD_ADD_TERM (field-scope). Anyone with the
        entity-scope permission can link terms to ANY field of any
        entity they hold the permission on.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/auth/util/SecurityConstants.java:299"
        - "https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions (verified 2026-05-25 status 200) — DATASET_FIELD_ADD_TERM documented as field-scope"
      severity: HIGH
      seeded_from: SHB-010
    - drift_class: security_constants_wiring_bug_alert_status_gated_by_dataset_field_permission
      description: |-
        SecurityConstants.java:295-296 gates PUT /api/alerts/{id}/status
        with DATASET_FIELD_ADD_TERM. Copy-paste bug. Anyone with the
        field-scope term-add permission can resolve alerts on any
        entity.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/auth/util/SecurityConstants.java:295-296"
      severity: HIGH
      seeded_from: SHB-010
    - drift_class: update_dataset_field_tags_delete_all_then_recreate_not_diff
      description: |-
        updateDatasetFieldTags calls deleteDatasetFieldInternalRelations
        first (unconditional DELETE filtered by origin = INTERNAL),
        then re-inserts the submitted set. Submitting `tags: []`
        clears every INTERNAL tag silently. NOT a diff (unlike
        TagServiceImpl.updateRelationsWithDataEntity).
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/DatasetFieldServiceImpl.java:117-132"
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/repository/reactive/ReactiveTagRepositoryImpl.java:289-295"
      severity: HIGH
      seeded_from: SHB-010
    - drift_class: create_enum_value_named_create_implemented_bulk_replace
      description: |-
        operationId createEnumValue says CREATE (singular); the
        implementation is bulk-replace via softDeleteExcept. Items not
        in the request body are soft-deleted. Spec schema name
        BulkEnumValueFormData is honest; operationId hides it.
        Same shape as F-013's silent-overwrite class (batch-ZG cross-link).
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/EnumValueServiceImpl.java:91-122"
        - "odd-platform-specification/openapi.yaml:2536-2554"
      severity: HIGH
      seeded_from: SHB-010
    - drift_class: delete_term_from_dataset_field_filters_description_link_isfalse_survives
      description: |-
        DELETE filter `.and(DATASET_FIELD_TO_TERM.IS_DESCRIPTION_LINK.isFalse())`.
        Description-derived term-link rows survive. Operator clicks
        DELETE expecting "the term is gone" → 204 No Content → the term
        remains visible because the description-link row was untouched.
        Endpoint description does not warn.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/repository/reactive/TermRelationsRepositoryImpl.java:179"
      severity: MEDIUM
      seeded_from: SHB-010
    - drift_class: description_verbatim_storage_no_sanitization_xss_class_at_per_column_surface
      description: |-
        updateDescription is UPDATE dataset_field SET internal_description = ?.
        No Jsoup.clean, no Encode.html, no length cap. The F-004
        XSS-class fingerprint at the per-column variant. Defence in
        depth lives only at UI render.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/repository/reactive/ReactiveDatasetFieldRepositoryImpl.java:73-80"
      severity: HIGH
      seeded_from: SHB-010
    - drift_class: jooq_unset_origin_insert_relies_on_db_default
      description: |-
        TagToDatasetFieldPojo is constructed without .setOrigin(...) —
        the schema column is NOT NULL DEFAULT 'INTERNAL'. Whether jOOQ's
        newRecord(table, pojo) omits the field (default applies) or
        emits explicit NULL (constraint violation) is unverified by any
        test. A jOOQ version bump could change null-field-handling
        silently.
      evidence:
        - "DatasetFieldServiceImpl.java — getUpdatedRelations does not set origin"
        - "V0_0_82__add_tag_to_dataset_field.sql:12 — origin varchar NOT NULL DEFAULT 'INTERNAL'"
      severity: MEDIUM
      seeded_from: SHB-010
    - drift_class: http_200_vs_spec_201_drift_on_three_put_endpoints
      description: |-
        Spec declares 201 for the three PUT endpoints; controller
        returns 200 via ResponseEntity::ok. Generated SDKs branching on
        201 mishandle the response.
      evidence:
        - "odd-platform-specification/openapi.yaml:2465 2488 2511"
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/controller/DatasetFieldController.java:35-103"
      severity: LOW
      seeded_from: SHB-010
    - drift_class: bulk_replace_enum_value_no_concurrency_control_last_writer_wins
      description: |-
        No optimistic-lock, no advisory lock at the dataset_field_id
        level, no SERIALIZABLE isolation. Two concurrent POSTs to the
        same field's enum values produce silent last-write-wins.
      evidence:
        - "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/EnumValueServiceImpl.java:91-122"
      severity: MEDIUM
      seeded_from: SHB-010
