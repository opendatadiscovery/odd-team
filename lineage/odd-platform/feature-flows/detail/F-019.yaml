discovered_from_entry_point: rest:POST /api/owners + PUT /api/owners/{owner_id} + DELETE /api/owners/{owner_id}
description: |-
  The Owner Lifecycle Management feature is the operator-facing CRUD
  surface for the Owner directory entries under `Management → Owners`.
  Three controller methods on `OwnerController` form a coherent
  user-observable trinity:

  - `createOwner` (`POST /api/owners`) — gated by `OWNER_CREATE`
    permission. Mints an Owner directory row + role bindings.
  - `updateOwner` (`PUT /api/owners/{owner_id}`) — gated by
    `OWNER_UPDATE`. Renames the Owner + rebinds roles (destructive
    replace-by-set-difference) + refreshes search vectors.
  - `deleteOwner` (`DELETE /api/owners/{owner_id}`) — gated by
    `OWNER_DELETE`. Cascade-blocks on termOwnership + ownership +
    userOwnerMapping; soft-deletes the Owner row; hard-deletes
    owner_to_role bindings.

  As of batch P, all three sidecars are PRIMARY-SOURCE enriched at
  the controller-method tier. The feature surfaces are user-observable
  capabilities exposed by the Management UI's Owners tab; the doc-anchored
  intent (live `/configuration-and-deployment/enable-security/authorization/owners`
  page, WebFetched 2026-05-20 status 200) is "Owners are Data Owners —
  people who manage and maintain a particular data entity or term"
  and "Owners can be managed in the Management → Owners tab".

  The user-observable reality, per the batch-P primary-source audit
  of the three sidecars, surfaces THIRTEEN load-bearing drift facets.
  The headline (HIGH severity) is the SIX-SIDECAR audit-silence
  pattern: createOwner + updateOwner + deleteOwner all have NO
  @ActivityLog annotation, AND extend the 4-sidecar pattern from
  batch N (RoleController + PolicyController + ReactivePolicyRepositoryImpl
  + ReactiveRoleRepositoryImpl) to a 6-sidecar pattern (Policy + Role
  + Owner CREATE + Owner UPDATE + Owner DELETE — though the F-006
  4-sidecar count refers to RBAC mutation specifically while this
  feature surfaces the Owner-lifecycle 3-sidecar subset). The Owner
  side has NO audit trail for "owner X was created/renamed/deleted
  by Y at T" — combined with the role-binding HARD-delete on the
  delete path (irreversible) and the partial-unique-index pattern
  enabling name re-use after soft-delete, the audit story is: an
  operator can delete an Owner and then re-create a DIFFERENT Owner
  with the same name, with no trace anywhere.

  Secondary load-bearing drifts include the empty-`roles` destructive
  UX hazard on UPDATE (a script omitting `roles` SILENTLY STRIPS ALL
  role assignments — the form's roles is treated as REPLACE-NULL-WITH-EMPTY
  not as IGNORE-IF-OMITTED), the class-wide OpenAPI 201-vs-impl-200
  drift on create AND update sibling methods, the rename hazard
  disambiguation (OWNER.NAME rename SAFE for USER_OWNER_MAPPING via
  FK by `owner.id` vs OIDC_USERNAME rename HAZARDOUS per REFACTOR-391),
  the FTS search-vector refresh ASYMMETRY between update and delete
  (update DOES refresh; delete does NOT — soft-deleted Owner names
  surface in catalog search until other events refresh affected
  entities' vectors), the silent-204 idempotency on delete (caller
  cannot distinguish "I deleted it" from "it was already deleted"
  from "it never existed"), and the orphan owner_association_request
  rows persisting after Owner delete (the cascade-block checks 3
  tables, not 4 — the association_request FK has no ON DELETE clause).
  Three "positive" findings: (a) USER_OWNER_MAPPING.owner_id FK is
  by id not name — OWNER.NAME rename is structurally safe; (b)
  Owner-side OWNER_TO_ROLE HARD-delete closes the orphan-binding
  pattern that F-006 surfaces on the Policy/Role half — Owner side
  is POSITIVE case-law (orphan-binding closure DONE CORRECTLY);
  (c) the partial-unique-index `owner_name_unique WHERE deleted_at
  IS NULL` enables name re-use after soft-delete (intended operator
  workflow per V0_0_64).

  This feature did not appear in earlier batches because the THREE
  CRUD sidecars only converged into a coherent trinity at batch P
  (createOwner enriched at batch E; updateOwner + deleteOwner enriched
  at batch P together). The pillar anchor is P-08 Management &
  Administration — the trinity is one of the Management section's
  central operator workflows (per the live `/features/management` doc).
