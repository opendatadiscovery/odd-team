realism_caveats: |
  The probe pins the load-bearing claim: the platform emits whatever URL
  Slack returned verbatim, without host/scheme/structure validation.

  The probe does NOT assert any operational exploit — it does NOT assume
  Slack's API is compromised. The probe scenario is:
  "IF the Slack API ever returned a non-slack.com URL for any reason
  (compromise, MitM under poor TLS, API behaviour change, bug in
  chat.getPermalink), THEN the platform's redirect endpoint becomes an
  attacker-controlled redirector trusted by every authenticated UI user
  via the 'Open in Slack' button on Message.tsx:60-66."

  The current operational risk depends entirely on Slack's API integrity.
  Slack has not publicly disclosed any incident where chat.getPermalink
  returned a non-permalink URL. The hypothetical class is documented in
  OWASP A01:2021 — Broken Access Control / Unvalidated Redirects.

  The probe also does not exercise:
  - HTTP-vs-HTTPS Slack URLs (chat.getPermalink should always return
    https://; a non-https URL would be an additional smell).
  - URL-encoded attack payloads (e.g., `https://evil.example.com/%2F%2E%2E`)
    — the platform uses URI.create which decodes per RFC 3986; a follow-up
    probe could exercise URI-decoding edge cases.
  - The "redirect chain" case (a chain of multiple redirects on the
    attacker's domain after the platform redirects to evil.example.com)
    — that's a browser-side concern, not the platform's responsibility.

  If the platform ever adds URL-validation to the redirect path (e.g., a
  host allowlist check, or a structural URL parser before
  ResponseEntity.setLocation), this probe MUST be re-run; the current
  claim is correct only for commit 4ec2b20.

  The mitigation is a small block of code along these lines:
    URI loc = URI.create(providerUrl);
    if (loc.getScheme() == null || !loc.getScheme().equals("https")
        || loc.getHost() == null
        || !(loc.getHost().endsWith(".slack.com")
             || loc.getHost().equals("slack.com"))) {
        return Mono.error(new IllegalStateException(
            "Refusing to redirect to non-slack.com URL: " + providerUrl));
    }
  — but it requires a policy decision about which Slack-related hosts are
  trusted (workspace subdomains follow `{workspace}.slack.com`, app
  subdomains follow `app.slack.com`, edu workspaces follow
  `{workspace}.enterprise.slack.com`).
