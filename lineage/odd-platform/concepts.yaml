        - "Token stored in plaintext in the TOKEN table — DB read/replica/backup carries credentials in the clear; IngestionDataEntitiesFilter.java:55-58 confirms plaintext `.equals(...)` check (no hashing layer) (regenerateCollectorToken.md:security.known_security_gaps.[3] HIGH)"
        - "Token rotation not audit-logged — grep for log.* against CollectorController/CollectorServiceImpl/TokenGeneratorImpl/ReactiveTokenRepositoryImpl returned zero matches. TOKEN.updated_by column is the only forensic trail but is overwritten on next rotation — single-state, not append-only (regenerateCollectorToken.md:security.known_security_gaps.[2] HIGH)"
        - "Under auth.type=DISABLED the gate is bypassed entirely — TokenGeneratorImpl.java:30-31 falls through to `regenerate(tokenPojo, null)` with NULL updated_by. Any caller reaching the platform can rotate any collector's token and receive plaintext (regenerateCollectorToken.md:security.known_security_gaps.[4] HIGH in DISABLED deployments)"
        - "No rotation grace period — in-flight ingestion using old token will 401 the moment UPDATE commits (regenerateCollectorToken.md:security.known_security_gaps.[5] HIGH operational severity)"
        - "No rate-limit on rotation — stolen MANAGEMENT-permission session can rotate every collector's token in a loop, breaking platform-wide ingestion (regenerateCollectorToken.md:security.known_security_gaps.[6] MEDIUM)"
