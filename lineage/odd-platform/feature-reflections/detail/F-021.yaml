      rewriting the apparent attribution. This is the same
      attribution-rewriting failure mode as H-001 case (b), via a
      different mechanism (this one via the JOIN, H-001 via the
      filter; same root cause: current-state-projected user-owner
      mapping over historical actor records).
    evidence:
