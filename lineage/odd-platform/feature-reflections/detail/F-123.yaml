      (1) Ownership history older than the activity-feed retention window is permanently
      unrecoverable — an operator cannot answer "who owned this entity last quarter" once
      the activity event is purged. (2) The recovery depends on a separate subsystem
      (activity feed) with its own retention + its own delivery reliability — coupling
      disaster-recovery to an audit log the operator may not realise is the system of
