control_summary: |-
  1 of 4 cells PARTIAL (unit happy-path mocked test only) + 3 GAP.
  Feature emerges from batch-L primary-source audit of the controller method
  + the service composition + the repository UPDATE + the OpenAPI schema +
  the DB migration. Eleven substantive drift facets cluster around three
  load-bearing themes: (1) silent UPDATE-not-UPSERT semantics — the impl
  is pure UPDATE with no `switchIfEmpty(NotFoundException)` and no
  entity-existence pre-check; the missing-pair and missing-entity cases
  both return 200-with-empty-body while the UI displays a success toast
  (SAME shape as F-004 upsertDescription); (2) zero validation — no type
  validation against MetadataTypeEnum, no origin restriction (EXTERNAL
  fields are writable), no length cap, the `origin` body field is silently
  dropped, the `active` column is silently dropped to NULL on every UPDATE;
  (3) forensic silence — no @ActivityLog despite ActivityEventTypeDto
  reserving CUSTOM_METADATA_CREATED/UPDATED/DELETED enum values. The
  highest-leverage probe candidates are: (a) silent overwrite of
  collector-ingested metadata — ingest entity X with metadata field
  `cost_centre=ACME` via collector + as authorized user PUT
  cost_centre=FOO + assert the UI shows FOO until the next ingestion +
  assert NO activity event records the overwrite (pins both the
  EXTERNAL-writable and forensic-silence facets); (b) active=NULL
  regression — INSERT a metadata_field_value row with active=TRUE +
  PUT a new value + read back the row + assert active is NOW NULL (pins
  the active-drop bug); (c) silent-200 missing-entity — PUT against a
  non-existent dataEntityId + assert 200 empty body (the headline
  UPDATE-not-UPSERT bug). Local docker-compose probe stack: ODD platform
  + Postgres + a seeded INTERNAL field + a seeded EXTERNAL field + a
  collector-mock pushing metadata to keep the EXTERNAL field alive.
