name: Platform Operator
canonical_in_docs: true
canonical_candidate: false
description: Engineers deploying and configuring ODD Platform — set values in `application.yml`
  / env vars / Helm values; pick auth mode (DISABLED / LOGIN_FORM / OAUTH2 / LDAP)
  + S2S composition decision; enable GenAI / configure attachment storage; deploy
  AlertManager network controls; rotate collector tokens; tune partition cadence;
  configure metrics storage; opt-in ingestion-token verification; configure Notifications
  receivers + PG logical replication. Maintain `docs.opendatadiscovery.org` is the
  operator-facing surface.
axes_present:
- config_prefixes
- controllers
nodes:
- odd-platform yaml application.yml config-prefix:attachment
- odd-platform java org.opendatadiscovery.oddplatform.config.properties config-properties-class:GenAIProperties
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertManagerController
- odd-platform java CollectorController controller-method:regenerateCollectorToken
- odd-platform java ActivityTablePartitionManager config-key-consumer:odd.activity.partition-period@L11
- odd-platform java CounterTimeSeriesExtractor config-key-consumer:metrics.storage@L20
- odd-platform java IngestionDataEntitiesFilter config-key-consumer:auth.ingestion.filter.enabled@L20
- odd-platform java AppInfoController config-key-consumer:auth.type@L18
- odd-platform java AuthorizationManagerCondition config-key-consumer:auth.type@L11
- odd-platform java DisabledAuthSecurityConfiguration config-key-consumer:auth.type@L10
- odd-platform java LoginFormSecurityConfiguration config-key-consumer:auth.type@L31
- odd-platform java OAuthSecurityConfiguration config-key-consumer:auth.type@L71
- odd-platform java LDAPSecurityConfiguration config-key-consumer:auth.type@L51
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties
- odd-platform java org.opendatadiscovery.oddplatform.auth config-properties-class:ODDOAuth2Properties
- odd-platform java org.opendatadiscovery.oddplatform.auth config-properties-class:ODDLDAPProperties
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:EmailSenderProperties
- odd-platform java org.opendatadiscovery.oddplatform.datacollaboration.config config-properties-class:DataCollaborationProperties
- odd-platform java org.opendatadiscovery.oddplatform.housekeeping.config config-properties-class:HousekeepingTTLProperties
- odd-platform java IngestionController controller-method:postDataEntityList
- odd-platform java DataEntityController controller-method:updateStatus
contributors:
- 'attachment config-prefix.audiences: platform operators (set via application.yml,
  env vars, Helm values); MinIO/S3 service operators on receiving end of REMOTE mode'
- 'GenAIProperties.audiences: Platform operators configuring the GenAI proxy via application.yml
  or GENAI_* env vars'
- 'AlertManagerController.audiences: platform operators configuring AlertManager to
  push into ODD'
- 'regenerateCollectorToken.audiences: odd-platform-ui collector settings page (operators
  rotating leaked / scheduled-rotation tokens), platform admins enforcing credential
  hygiene'
- 'ActivityTablePartitionManager@L11.audiences: operators tuning vacuum / partition-prune
  for high-volume activity; DBAs sizing the activity table for retention'
- 'CounterTimeSeriesExtractor@L20.audiences: operators choosing metrics-storage backend;
  operators sizing the per-tenant metric label set'
- 'IngestionDataEntitiesFilter@L20.audiences: operators deciding whether to require
  ingestion-token verification; security reviewers'
- 'AppInfoController@L18.audiences: operators reading the AppInfo response surface;
  security reviewers analysing the introspection endpoint'
- 'AuthorizationManagerCondition@L11.audiences: maintainers extending the auth-mode
  wiring; reviewers verifying the Policies/Permissions/Roles/Owners framework is wired'
- 'DisabledAuthSecurityConfiguration@L10.audiences: any HTTP caller able to reach
  the platform''s network port when auth.type=DISABLED — i.e. every caller, with no
  further gate; the operator owns the blast radius via the operator-facing knob'
- 'LoginFormSecurityConfiguration@L31.audiences: operators choosing the in-memory
  credentials list at `auth.login-form-credentials`; the in-memory authenticated user
  (UI/API caller presenting form credentials); CI/CD callers presenting X-API-Key
  when auth.s2s.enabled=true'
- 'OAuthSecurityConfiguration@L71.audiences: operators deploying ODD Platform with
  auth.type=OAUTH2 against Cognito/GitHub/Google/Azure/ODD_IAM/Okta/Keycloak; OAuth2/OIDC
  providers federated with'
- 'LDAPSecurityConfiguration@L51.audiences: enterprise / on-prem operators deploying
  ODD against an existing corporate directory (OpenLDAP / Active Directory)'
- 'NotificationsProperties.audiences: platform operator (must enable + configure PG
  logical replication); alert recipient (Slack channel / webhook endpoint / email
  inbox)'
- 'ODDOAuth2Properties.audiences: operators registering OAuth2/OIDC clients (one per
  provider — Cognito/GitHub/Google/Azure/ODD_IAM/Okta/Keycloak); maintainers extending
  the provider routing chain'
- 'ODDLDAPProperties.audiences: enterprise / on-prem operators deploying ODD against
  an existing corporate directory (OpenLDAP / Active Directory)'
- 'EmailSenderProperties.audiences: platform operator configuring SMTP relay credentials
  + transport; alert recipient receiving full alert payload rendered via email.ftlh'
- 'DataCollaborationProperties.audiences: odd-platform operators tuning the Data Collaboration
  background-job plumbing (advisory-lock IDs + retry budget)'
- 'HousekeepingTTLProperties.audiences: odd-platform operators tuning database growth;
  DBAs sizing the alert/search/data-entity tables; compliance / data-retention reviewers
  who need to know what''s purged and when'
- 'postDataEntityList.audiences: operators standing up an ingestion pipeline; security
  reviewers auditing the S2S surface (default-off auth, payload-driven datasource
  scoping, doc-drift around X-API-Key vs Authorization: Bearer)'
- 'updateStatus.audiences: operators triaging data-entity lifecycle (DRAFT/STABLE/DEPRECATED/DELETED),
  DBAs auditing the 30-day data-entity-delete TTL window (currently BROKEN by statusUpdatedAt
  nullification bug), reviewers verifying soft-delete cascade semantics'
