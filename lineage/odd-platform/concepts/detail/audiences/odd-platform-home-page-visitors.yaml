name: ODD Platform Home-Page Visitors
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
description: 'Every authenticated user (and any anonymous caller under DISABLED) —
  the readers of the platform''s Overview/Overview.tsx home page. Consumes (a) Recommended
  → My Objects (per-user, owner-scoped; getMyObjects) and (b) Popular strip (cross-owner,
  view_count-ranked; getPopular). The first-impression surface of the entire platform.
  **Batch J — UI HALF CONFIRMED**: the home-page Recommended panel is rendered as
  OwnerEntitiesList with FOUR columns (My Objects, Upstream, Downstream, Popular).
  Each column is a `DataEntityList` tile renderer; the panel is owner-association-gated
  AND auth-mode-gated (Overview.tsx hides it under DISABLED-mode — contradicting docs
  which say the panel IS visible under DISABLED). Each tile click navigates to
  /dataentities/{id}/overview — which mounts DataEntityDetails which fires
  fetchDataEntityDetails which increments view_count, **closing the F-001 loop on
  the client side**. Combined with LSN-017 doubling = +2 view_count per tile click.'
nodes:
