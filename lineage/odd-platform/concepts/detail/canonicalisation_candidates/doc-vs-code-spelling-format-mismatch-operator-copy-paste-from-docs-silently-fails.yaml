proposed_canonical: Doc-vs-code spelling/format mismatch (operator copy-paste-from-docs
  silently fails)
rationale: 'NEW cross-cutting doc-drift invariant from batch 2026-05-12F — now 2-sidecar
  primary-source triangulated (batch D ODDOAuth2Properties.username-attribute + batch
  F postDataEntityList.X-API-Key). Live docs show a verbatim YAML key or HTTP header
  that does NOT match what the code binds/expects. Operator copy-paste-from-docs verbatim
  succeeds against the docs but silently fails against the code. Two DOC-NNN fixes
  flow directly from this invariant: (a) `/configuration-and-deployment/enable-security/authentication/oauth2-oidc`:
  `username-attribute` → `user-name-attribute`; (b) `/configuration-and-deployment/enable-security/authentication/s2s`:
  distinguish `X-API-Key` (global S2S) from `Authorization: Bearer` (path-scoped IngestionDataEntitiesFilter).'
contributing_concepts:
- ODDOAuth2Properties username-attribute (kebab single-word) vs userNameAttribute
  (camelCase split) (batch D)
- 'S2S X-API-Key example vs IngestionDataEntitiesFilter Authorization: Bearer requirement
  (batch F)'
suggested_add_to_docs: true
