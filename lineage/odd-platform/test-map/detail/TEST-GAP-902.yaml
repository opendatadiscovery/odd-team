behaviour: |-
  **HIGH — `POST /api/datasources` mints a token row + (conditionally) a namespace row +
  the data_source row inside ONE `@ReactiveTransactional` boundary. The atomicity invariant
  — a failed register leaks NO orphan token row and NO orphan namespace row — is entirely
  untested.** Method-level primary source from the batch-ZB `registerDataSource`
  controller-method sidecar:

  - `DataSourceServiceImpl.create` (DataSourceServiceImpl.java:51-66, annotated
    `@ReactiveTransactional` at line 52) runs THREE sequential DB writes inside one R2DBC
    transaction: `INSERT INTO token` (line 54, unconditional — a fresh 40-char token is
    minted on EVERY register), conditional `INSERT INTO namespace` (line 56-57, when
    `namespace_name` is non-empty and unknown), `INSERT INTO data_source` (line 122-123).
  - The `data_source` ODDRN partial-unique index raises `UniqueConstraintException`
    (SQLSTATE 23505) on a live-ODDRN collision; the empty-ODDRN check throws
    `BadUserRequestException` (DataSourceServiceImpl.java:119-120) — both INSIDE the
    transaction boundary.
  - **The invariant to pin**: when the `data_source` INSERT fails (ODDRN collision) AFTER
    the token INSERT and the namespace INSERT have already executed in the same
    transaction, the `@ReactiveTransactional` rollback MUST discard the token row and the
    namespace row — leaving no orphans.

  **Why this matters**: orphan tokens are a confirmed accumulation hazard on the DELETE
  path (TEST-GAP-905 — the `token` table has no `deleted_at` and no GC). If the rollback
  on a FAILED register did NOT discard the token row, every failed-register attempt would
  ALSO leak a token — compounding the unbounded `token`-table growth AND scattering stale
  plaintext secrets at rest. The `@ReactiveTransactional` annotation is the only thing
  protecting this invariant, and there is no test (Glob-verified — no
  `DataSourceControllerTest`, no `DataSourceServiceImplTest`). A regression removing the
  annotation, or splitting `create` into separately-committed writes, would silently start
  leaking token + namespace rows on every failed register.

  **Test gap shape**: a `@SpringBootTest` integration test that: (1) registers a data
  source with ODDRN X (succeeds); (2) attempts a SECOND register with the SAME ODDRN X
  AND a never-seen `namespace_name` AND records the `token` / `namespace` table row counts
  before; (3) asserts the second register returns HTTP 400 (UniqueConstraintException);
  (4) asserts `SELECT COUNT(*) FROM token` is UNCHANGED from the pre-call count (no orphan
  token); (5) asserts `SELECT COUNT(*) FROM namespace WHERE name = <the never-seen name>`
  returns 0 (the namespace INSERT rolled back). Pinned by probe P-041.
