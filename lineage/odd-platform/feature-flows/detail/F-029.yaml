  zero structural defence against drift means every authoring session
  is a potential new drift instance.
observed_vs_expected:
  facets:
  - facet: ZERO securitySchemes block — auth illegible to SDK generators
    observed: |-
      Grep across `openapi.yaml` (4212 lines) + `components.yaml`
      (2937 lines) returns ZERO matches for `securitySchemes` and
      ZERO for `security:` declarations. The platform supports four
      UI auth modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP per
      system-mission.md P-09) + S2S `X-API-Key` + Ingestion filter —
      NONE are declared in the spec. Generated SDKs contain no
      authentication code (no Bearer wiring, no session cookie
      handling, no `X-API-Key` injection). Third-party SDK consumers
      must hand-author auth glue, which is the easiest place for a
      misconfiguration. The platform's auth posture is
      machine-illegible to its own contract surface.
    expected: |-
      Add a `components.securitySchemes:` block declaring the four
      UI modes + S2S + Ingestion filter as OpenAPI security schemes
      (`http: bearer`, `apiKey: header X-API-Key`, `oauth2`, `openIdConnect`
      for OAUTH2/LDAP). Add per-operation `security:` declarations
      naming which schemes apply. Generated SDKs would then carry
      typed authentication code.
    drift_class: openapi_no_security_schemes_no_machine_readable_auth
    provenance: |-
      STATIC — primary-source in batch Z odd-platform-public-api
      sidecar bugs_limitations_corner_cases[0] + security.auth_mode_relevance
      + security.known_security_gaps[1]. Grep verified zero matches
      for `securitySchemes` and `security:` across both files. Cross-link
      to system-mission.md P-09 (4 UI auth modes + S2S + Ingestion
      filter). Severity: MEDIUM (SDK-quality + integration-quality
      impact; not a security boundary failure since auth IS enforced
      server-side).
  - facet: only 3 of 194 operations declare 4xx/5xx — no typed error model
    observed: |-
      Grep on `openapi.yaml` for `'4..':` returns 2 occurrences (lines
      172 + 3433); `'5..':` returns 1 (line 152). The remaining 191
      operations declare ONLY their 2xx happy path. The platform DOES
      return 4xx and 5xx in production (per every controller sidecar
      across batches D-X) — `BadUserRequestException` 400, NotFoundException
      404, AccessDeniedException 401/403, internal 5xx — but the spec
      is silent on the error shapes. SDK clients consuming the spec
      have no typed error model; they reverse-engineer error responses
      from the running service.
    expected: |-
      Add operation-level `responses` entries for the canonical error
      shapes the platform actually returns. At minimum declare 400 +
      401 + 403 + 404 + 500 with `application/json` schema references
      to a shared `ErrorResponse` component schema. SDK generators
      would then emit typed exception classes.
    drift_class: openapi_no_error_model_only_three_4xx_5xx_declarations
    provenance: |-
      STATIC — primary-source in batch Z odd-platform-public-api
      sidecar bugs_limitations_corner_cases[1]. Grep counts: 31
      `'201':`; 137 `'200':`; 2 `'4..':`; 1 `'5..':`. Severity:
      MEDIUM.
  - facet: 201-vs-200 status-code drift at 7+ controllers, 9+ endpoint-level instances
    observed: |-
      `openapi.yaml` declares 31 operations with `'201':` response;
      controllers uniformly return 200 via `ResponseEntity::ok`. Batch-W
      primary-source enumeration closes the drift at 7+ controller
      pairs: Owner / Role / Policy / Ingestion postDataEntityList /
      Term createTerm + updateTerm / DataSource registerDataSource +
      updateDataSource (openapi.yaml:454, 482) / Collector
      registerCollector + updateCollector (openapi.yaml:558, 586) /
      Tag createTag + updateTag (openapi.yaml:372, 400). Tests assert
      `isOk()`, locking in 200. Three independent authoring streams
      diverged: spec author chose 201 by REST convention, controller
      authors chose 200 by Spring convention, test authors locked in
      200. No review reconciled the three. A single directional-fix
      PR (align spec→code OR align code→spec) closes the entire
      cluster.
    expected: |-
      Pick a direction (spec→200 vs code→201) and ship one PR per
      controller family. The directional choice is the maintainer's
      call — the structural drift is closeable in finite work.
    drift_class: openapi_status_code_drift_201_vs_200_seven_controllers
    provenance: |-
      STATIC — primary-source in batch Z odd-platform-public-api
      sidecar bugs_limitations_corner_cases[2] + cross-batch evidence
      (batches E + F + U + W). 6 batch-W file:line citations verified
      via Read at openapi.yaml:372, 400, 454, 482, 558, 586.
      Severity: MEDIUM.
  - facet: UPDATE-with-201-description copy/paste at 5 spec locations
    observed: |-
      Five distinct spec locations exhibit the canonical defect — a
      `'201'` status code with a description that says "successfully
      modified/updated" (which is 200/204 semantics, not 201): Tag
      updateTag (openapi.yaml:400), DataSource updateDataSource
      (openapi.yaml:482), Collector updateCollector (openapi.yaml:586),
      QueryExample updateQueryExample (openapi.yaml:2156-2157), Term
      updateTerm (openapi.yaml:2797-2799). The spec authors themselves
      treated 201 as the platform-wide convention for both Create AND
      Update — the convention was confused at authoring time.
    expected: |-
      Flip every Update operation to `'200':` with a "modified"
      description; reserve `'201':` for Create operations only.
      Closeable in a single PR.
    drift_class: openapi_status_code_update_with_201_description_copy_paste_five_instances
    provenance: |-
