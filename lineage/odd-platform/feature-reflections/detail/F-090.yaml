    confidence: HIGH
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    routes_to_finding: functional-test-demand

- id: H-010
  hypothesis: |
    When the caller's policies change (a role is granted or revoked in the
    Management UI), the next GET /api/resource/{type}/{id}/permissions call reflects
    the change — the permission read is live, not a stale per-session snapshot.
  derivation: |
    Negative-space + response-freshness. A senior PO expects an authorization-read
    surface that drives live UI button state to reflect a just-committed policy change
    without requiring re-login.
  seed_source: negative-space + response-shape
  validation:
    verdict: partial
    actual_behavior: |
      The endpoint recomputes per request — no caching layer between the controller
      and the policy/role tables; the role->policy->context->permission chain is
      re-run every call (getResourcePermissions sidecar concepts.invariants[4] +
      implicit_adrs[1] "never trust a UI-shaped permission cache"). So under
      OAUTH2/LDAP a committed role change IS observable on the next call. PARTIAL,
      with a load-bearing exception: under LOGIN_FORM the seeded admin's authority is
      STATIC in-memory (GrantedAuthorityExtractor.getAuthorities(true) + the
      Administrator role's 'ALL' policy), so EVERY caller resolves as admin and EVERY
      call returns the full permission set REGARDLESS of subsequent UI policy
      revocations — the in-memory admin authority bypasses the DB role mapping
      (sidecar bugs_limitations_corner_cases[1] + security.known_security_gaps[1]).
