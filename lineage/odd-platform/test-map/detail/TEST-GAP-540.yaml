behaviour: |-
  **TOCTOU race between `listByNames` and `bulkCreate` in `TagServiceImpl.getOrCreateTagsByName`** — the service calls `listByNames(tagNames)` to filter existing names, then `bulkCreate(tagsToCreate)` for the remainder. Between these two reactor stages, another caller can insert the same novel name. In PostgreSQL's READ COMMITTED isolation, the `listByNames` snapshot does NOT see uncommitted INSERTs from a concurrent TX, so the second caller will attempt `bulkCreate` with the now-conflicting name, hit `tag_name_unique`, and receive `UniqueConstraintException("Tag with this name already exists")`. The user sees a 500-level error on a normal-looking PUT request. There is NO caller-side retry of `listByNames` after the conflict. The `ingestData` upsert path is safe; the `bulkCreate` path is NOT.
