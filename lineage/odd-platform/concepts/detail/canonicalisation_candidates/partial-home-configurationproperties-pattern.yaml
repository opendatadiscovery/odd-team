proposed_canonical: Partial-home @ConfigurationProperties pattern
rationale: '2-sidecar triangulated cross-cutting refactoring-hazard invariant from
  batch 2026-05-12D: ODD''s @ConfigurationProperties POJOs sometimes bind only a SUBSET
  of their prefix''s keys; the remaining keys are @Value-scattered across consumer
  files. DataCollaborationProperties binds 3 of 7 datacollaboration.* keys; EmailSenderProperties
  binds the SMTP transport surface but NOT the recipient list (notifications.receivers.email.notification.emails,
  consumed via raw @Value in NotificationConfiguration.java:104). A maintainer reading
  the Properties class to learn the config-prefix sees a partial picture. Refactoring
  hazard for IDE auto-completion, Spring Boot metadata generation, and central validation.
  Recommended cleanup: complete the binding — every @Value reading a key in a prefix
  that has a @ConfigurationProperties POJO should be replaced by adding the field
  to that POJO.'
contributing_concepts:
- DataCollaborationProperties binds 3 of 7 keys; 4 keys @Value-scattered across 4
  files (batch D)
- EmailSenderProperties binds 6 SMTP-transport keys; recipient list consumed via raw
  @Value (batch D)
suggested_add_to_docs: false
