realism_caveats: |
  (1) This probe verifies BACKEND acceptance only. It does NOT verify the BROWSER
  behaviour. A `javascript:alert(1)` URL accepted by the backend is NOT
  necessarily exploitable in a user's browser — React's react-router-dom <Link>
  component (AppInfoMenu.tsx:61) and modern browsers' link-following heuristics
  may neutralise the dangerous schemes at render time or at click time. To
  characterise the full chain, a Playwright probe (deferred — see P-128's
  realism_caveats) must:
    - configure odd.links[i].url with each of these strings,
    - render the AppInfoMenu in a real browser context,
    - inspect the resulting <a href> attribute via DOM query,
    - simulate a click and assert the navigation target (or refusal).

  (2) Env-var round-tripping: some env-var injection mechanisms (docker run -e,
  kubernetes ConfigMap) strip or escape newlines and special characters. The
  newline-injection assertion may behave differently under different env-var
  delivery mechanisms; if the YAML-binding path is the operator's actual usage,
  add a parallel arrange step that mounts a YAML file with the same payload.

  (3) The `boot_warnings == ''` assertion is loose — it documents the EXPECTED
  silence; tighten it to grep for specific failure markers once you observe a
  baseline boot log on the probe stack.

  (4) The probe runs with AUTH_TYPE=DISABLED to avoid auth-handshake complications
  during the smoke. The endpoint behaviour under LOGIN_FORM is covered by P-128;
  the URL-acceptance behaviour is independent of auth mode (the binding happens
  at boot, before any request).

  (5) If the test fails because Spring's relaxed binder coerces one of the
  pathological inputs (e.g. trims whitespace), the failure is INFORMATIONAL —
  it means the binder is doing more than the file-analyser's static reading
  inferred, and the sidecar must be corrected.
