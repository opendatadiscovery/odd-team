proposed_action: |-
  Add `QueryExampleActivityFeedSilenceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/`. Six test methods asserting the absence of activity emission:
  1. `createQueryExample_producesZeroActivityEvents` — call create; query `SELECT COUNT(*) FROM activity WHERE created_by = ? AND created_at > ?`; assert 0.
  2. `updateQueryExample_producesZeroActivityEvents` — same shape.
  3. `deleteQueryExample_producesZeroActivityEvents` — same shape.
  4. `createQueryExampleToDatasetRelationship_producesZeroActivityEvents` — same shape (cross-controller — endpoint lives on DataEntityController but service is QueryExampleService).
  5. `activityEventTypeDtoEnum_doesNotDefineQueryExampleEvents_enumRootedSilence` — pin the schema-level absence: enum has NO QUERY_EXAMPLE_CREATED / _UPDATED / _DELETED / _LINKED values. Sister enum-rooted finding to TEST-GAP-725 (Term).
  6. `queryExampleServiceImpl_hasNoActivityLogAnnotation_pinsServiceTierSilence` — reflection-based test asserting that QueryExampleServiceImpl methods have NO @ActivityLog annotation.

  Add a `// REGRESSION-PIN — F-006 audit-silence pattern at the QueryExample surface. Schema-rooted (no enum values) + service-rooted (no annotations). A REFACTOR adding QUERY_EXAMPLE_* enum values AND @ActivityLog annotations at the service tier will break tests #5 and #6; the maintainer must update them to assert presence + count.` comment block.

  Pair with: (a) REFACTOR-NNN adding enum values + annotations; (b) DOC-NNN disclosing the current silence on the Query Examples doc page.
