    verdict: confirmed
    actual_behavior: |-
      All three services implement the block. Owner: Mono.zip of
      termOwnership.existsByOwner + ownership.existsByOwner +
      userOwnerMapping.isOwnerAssociated, OR'd, .filter(!exists) →
      CascadeDeleteException (OwnerServiceImpl.java:90-96). Namespace: 4-leg zip
      of existsByNamespace checks (NamespaceServiceImpl.java:75-87). DataSource:
      existsNonDeletedByDataSourceId → CascadeDeleteException
      (DataSourceServiceImpl.java:88-95). The block is real and is the
      mechanically dominant path. Verified-by-test this session: the cascade-block
      legs are now unit-covered for all three services (the sidecars predate these tests).
