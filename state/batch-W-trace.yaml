phase1_outcomes:
  - target: DataSourceController
    coherence: { strengthens: 7, supersedes: 0, conflicts_surfaced: 3 }
    headline: "5-endpoint UI admin DISJOINT from S2S createDataSourceEntity (separate auth + service + mutation semantics). **5th vertex of ADR-142/143 triangulation closed**. GET no SecurityRule. NEW: implicit namespace creation bypasses NAMESPACE_CREATE; regenerateDataSourceToken missing @ReactiveTransactional; 201-vs-200 status code drift."
  - target: CollectorController
    coherence: { strengthens: 7+, supersedes: 0, conflicts_surfaced: 0 }
    headline: "**End-to-end plaintext token chain CLOSED at controller tier** (register POST + regenerate-token PUT both return 40-char plaintext via showToken=true). GET-list unrestricted. **Orphan TOKEN row on delete CONFIRMED** at controller layer. Full-replace update with null-as-erase. Zero audit logging across F-020. NO controller test file."
  - target: NamespaceController
    coherence: { strengthens: 5, supersedes: 0, conflicts_surfaced: 1 }
    headline: "**NAMESPACE_CREATE side-door confirmed at 4 sister services** (TermService + DataSourceService + CollectorService + DataEntityGroupService — 8 call sites) — bypasses the controller's RBAC gate via namespaceService.getOrCreate(name). Partial-unique-index allows soft-delete reincarnation. Cascade app-tier-guarded across 4 referent classes. TOCTOU between cascade-check and concurrent referent insert."
  - target: TagController
    coherence: { strengthens: 4, supersedes: 0, conflicts_surfaced: 1 }
    headline: "REFACTOR-223 / DOC-GAP-168 side-door is at SERVICE LAYER (TagServiceImpl.getOrCreateTagsByName invoked from 5 distinct paths). This controller is the GATED path, not the side-door. **deleteTag cascade ASYMMETRIC** — cleans tag_to_data_entity + tag_to_term but NOT tag_to_dataset_field (orphans persist invisible to reads). getPopularTagList open-read for ALL authenticated users regardless of TAG_* permissions."
  - target: DatasetController
    coherence: { strengthens: 7, supersedes: 0, conflicts_surfaced: 2 }
    headline: "**HIGH: per-entity-scoping BYPASS at getDataSetStructureByVersionId + getDataSetStructureDiff** — dataEntityId URL parameter NOT enforced against version_id (ReactiveDatasetVersionRepositoryImpl filters on DATASET_VERSION.ID only). 4 endpoints NO SecurityRule. F-004 verbatim-description read-side surface at column level. **Undocumented `dataSet` OpenAPI tag** (4/4 endpoints absent from live api-reference hub)."
