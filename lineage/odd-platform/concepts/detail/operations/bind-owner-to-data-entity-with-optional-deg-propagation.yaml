notes: |-
  STRENGTHENED batch 2026-05-19K. The service-layer orchestration is now
  primary-source pinned at OwnershipServiceImpl.java:47-74 (create) +
  76-97 (delete) + 99-119 (update) + 121-149 (DEG cascade). Two cross-batch
  corrections propagated:
    - HTTP 400 USR003 duplicate-key surface (NOT 5xx; batch F was
      incorrect)
    - Self-grant decoupling primary-source confirmed (owner_name verbatim
      from form, no principal inference)

  Companion new concepts surfaced this batch:
    - Manage Ownership Lifecycle (create/update/delete with DEG cascade)
      [new operation — service-layer counterpart of this controller-method
      operation]
    - DEG-propagation cascade audit-feed asymmetry [new invariant]

  Operation vocabulary captured for future DOC-NNN follow-ups on the
  ownership-binding surface. Six doc-gaps surface from this operation:
    (a) Permission DATA_ENTITY_OWNERSHIP_CREATE listed with one-sentence
        description; no enumeration of who holds it by default.
    (b) Self-grant feasibility undocumented (now PRIMARY-SOURCE confirmed
        the service is principal-independent — a Policy granting
        OWNERSHIP_CREATE unconditionally lets the holder grant any owner
        to any data entity).
    (c) Owner auto-create side-effect via getOrCreate undocumented
        (REFACTOR-199 — now cross-batch primary-source confirmed).
    (d) Title auto-create side-effect via getOrCreate undocumented
        (REFACTOR-206 — now cross-batch primary-source confirmed).
    (e) DEG propagation semantics (propagate: true cascade to children,
        onConflict-doUpdate-title) undocumented.
    (f) Duplicate-prevention surface error shape — HTTP 400 USR003 NOT
        5xx (CORRECTED batch H + K; batch F was wrong).

  The OWNERSHIP_CREATED activity event payload shape
  (OwnershipActivityStateDto = (ownerName, titleName)) is also
  undocumented on the activity-feed doc page.

  NEW DOC-NNN from batch K:
    (g) Document the DEG-propagation audit-feed asymmetry — per-child
        events are NOT emitted; cascade audit-trail inference required.
    (h) Document the delete-flow FTS staleness — search results may
        still surface old owner names until next mutation refreshes the
        vector.
