proposed_action: |-
  Add `DatasetFieldTagRelationOriginTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Promote probe P-030 to CI:
  1. `updateDatasetFieldTags_nonEmptyPayload_returns200NotServerError` — `PUT /api/datasetfields/{id}/tags` with `{"tags":["x","y"]}`; assert HTTP 200 (NOT 500). If this fails, the unset-origin INSERT is emitting an explicit NULL — the endpoint is broken; raise a CRITICAL bug.
  2. `updateDatasetFieldTags_persistedRelationOriginIsInternal` — after #1, raw DB `SELECT origin FROM tag_to_dataset_field WHERE dataset_field_id = ?`; assert every row's `origin == 'INTERNAL'`.
  3. `updateDatasetFieldTags_subsequentReplaceAll_deletesInternalRelations` — after #1, `PUT` `{"tags":[]}`; assert ALL the rows from #1 are deleted. This proves the persisted `origin` IS `'INTERNAL'` (so `deleteDatasetFieldInternalRelations`'s `WHERE origin = 'INTERNAL'` filter reaches them) — guarding against the silent-orphan-accumulation failure mode.

  Pair with REFACTOR-NNN: make `getUpdatedRelations` explicitly `.setOrigin(TagOrigin.INTERNAL)` to remove the DB-default reliance — a 1-line fix matching the data-entity path's `.setExternal(false)` discipline. When the fix lands, tests #1-#3 still pass (they pin the OBSERVABLE contract regardless of whether origin is set in code or by default).
