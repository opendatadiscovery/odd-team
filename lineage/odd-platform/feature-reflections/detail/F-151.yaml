# Term Detail Page — product-owner reflection

## product_owner_narrative

The **Term detail page** is the operator-facing home of a single glossary Term — the
canonical place where a data engineer, analyst, or steward lands after clicking a Term in
search, following a breadcrumb, or deep-linking to `/terms/{id}/overview`. A Term is a
first-class catalog citizen in the Data Glossary pillar (P-06): it names and describes a
business concept ("what `Customer` means in your taxonomy"), it links to other Terms, and
it links to the data entities, dataset fields, and query examples that embody it. This page
is where all of that converges into one screen (per system-mission.md P-06; per
`TermDetails.md` understanding — "the OPERATOR-FACING ENTRY POINT for everything F-002
surfaces"). It solves the problem the pillar exists for: when the catalog grows, an operator
needs one durable surface that answers "what does this term mean, who owns it, and what is it
attached to."

A user interacts with the page through a thin shell plus a five-tab strip. On mount, the
shell fires exactly one `fetchTermDetails({termId})` and one `fetchResourcePermissions`
(per `TermDetails.md` invariants — deps `[termId]` only, explicitly NOT the LSN-017 doubling
shape). The header shows the Term name, its last-update timestamp, and — gated behind
`TERM_UPDATE` / `TERM_DELETE` — Edit and Delete affordances (per `TermDetails.md`
`couples-to` TermDetailsHeader). Below the header sits the tab strip: **Overview** (always
shown — the default landing), **Linked entities**, **Linked columns**, **Linked terms**, and
**Query examples** (per F-151 chain hop 2, `TermDetailsTabs.tsx:9-63`).

The working parts the operator would describe in a demo: a definition rendered as rich
Markdown on the Overview tab; inline mini-panels on Overview for Owners, Tags, and linked
Terms with Add/Delete affordances; three of the five tabs that **auto-hide when their count
is zero** (Linked entities / Linked columns / Linked terms — per F-151 chain hop 2); and a
**Query examples** sub-route that is the only one gated by a permission
(`QUERY_EXAMPLE_TERM_CREATE` / `QUERY_EXAMPLE_TERM_DELETE` — per F-151 chain hop 3,
`TermDetailsRoutes.tsx`). The other four sub-routes are ungated at the UI layer, consistent
with the platform's read-collaborative posture: any authenticated user can read any term's
full content (per `TermDetails.md` security `owner_scoping: BYPASSES`; per system-mission.md
P-09 read-collaborative maintainer-note).

The integration story: this page is the read-and-edit face of F-002 (Term-to-Entity Linkage)
and the parent surface for F-155 (Term Query-Example Linkage). Editing a Term's definition
flows into the `[[namespace:term]]` auto-link side-channel (F-056) — a definition that
mentions `[[finance:Customer]]` silently creates a term-to-term link row with
`is_description_link=TRUE` (per `TermServiceImpl.md` understanding). The page is backed by the
platform's most expensive read, `ReactiveTermRepositoryImpl.getTermDetailsDto` — an 11-LEFT-JOIN
+ 4-countDistinct + 7-jsonArrayAgg hot path (per `ReactiveTermRepositoryImpl.md` operations).

Edge cases a product owner would flag in a demo: opening the Overview tab fires the expensive
hot-path query **twice** (the shell's `fetchTermDetails` AND Overview's `useGetTermByID` —
per F-151 facet `overview_tab_double_fetch_on_12_join_hot_path`); a brand-new Term with no
links shows only two tabs, so a first-time operator cannot tell the platform supports linking
at all (per F-151 facet `tabs_auto_hide_on_zero_count_no_empty_state`); the linked-terms data
appears in two places with different affordances (per F-151 facet
`linked_terms_overview_panel_vs_linked_terms_tab_dual_surface`); and a definition can carry
unsanitised HTML that executes for every viewer (per `TermDetails.md` known_security_gaps —
the F-004 extension).

