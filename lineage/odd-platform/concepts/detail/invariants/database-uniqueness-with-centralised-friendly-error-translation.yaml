notes: "Cross-batch architectural convention surfaced across 3 of the 5 batch-H repository\n\
  sidecars. The convention is uniform; the surface differs by use case:\n\n  - Soft-delete-aware\
  \ entity uniqueness (Policy / Role / Owner / etc.): partial unique\n    index WHERE\
  \ deleted_at IS NULL enables recreation; duplicate of LIVE row → HTTP 400\n    via\
  \ ExceptionUtils translation.\n  - Hard-delete edge uniqueness (Ownership / TermOwnership):\
  \ plain unique constraint;\n    duplicate → HTTP 400 via ExceptionUtils translation.\n\
  \  - Idempotent batch-insert (Lineage): onConflictDoNothing; duplicate silently\
  \ skipped;\n    no exception path.\n\nThe centralised translation at ExceptionUtils.translateDatabaseException\
  \ (lines 30-83)\nenumerates every known unique index name and maps it to a tailored\
  \ message. The pattern\nis deliberate-and-curated — each new unique index added\
  \ in a future migration MUST be\nregistered in ExceptionUtils to surface a friendly\
  \ message; absence falls through to the\ngeneric DatabaseException with a less helpful\
  \ message.\n\nCROSS-BATCH CORRECTION propagated from batch H: the batch-F createOwnership\
  \ sidecar's\nbugs_limitations_corner_cases[2] stated the duplicate-key surface error\
  \ is 5xx. The actual\nsurface is HTTP 400 (USR003) with the friendly message. The\
  \ correction should propagate to\nany downstream artefact that quotes the batch-F\
  \ claim verbatim.\n\nRecommended cleanup paths:\n\n  - Audit every new unique index\
  \ added in a future migration; ensure ExceptionUtils\n    has a matching translation\
  \ branch with a tailored message.\n\n  - Document the duplicate-key surface error\
  \ shape (HTTP 400 + USR003 + friendly message)\n    in the OpenAPI spec response\
  \ schemas for endpoints that can produce duplicates\n    (POST /api/policies, POST\
  \ /api/dataentities/{id}/ownership, POST /api/roles, etc.).\n    The live OpenAPI\
  \ today does NOT declare a 400 response with this message shape;\n    API consumers\
  \ reading the spec cannot anticipate the surface.\n\nThree DOC-NNN candidates flow\
  \ from this invariant:\n  (a) OpenAPI spec update: declare 400-Bad-Request response\
  \ with USR003 error code +\n      friendly message on every endpoint that can produce\
  \ a unique-constraint violation.\n  (b) Public 'API errors' doc page (if it exists)\
  \ or new docs page: enumerate the USR003\n      cases (Policy / Role / Owner / Ownership\
  \ / etc.) and their friendly messages.\n  (c) Cross-batch correction in any artefact\
  \ that inherits the batch-F createOwnership\n      5xx misclaim.\n"
