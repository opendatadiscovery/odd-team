terminal_side_effect:
  side_effect_class: db-write + page-render
  description: |-
    Dual side-effect: (a) SERVER-SIDE search session row INSERT/UPDATE
    in `search_facets` table on session-create + facet-update + text-query
    submit (the TermSearchService persistence — opaque to this feature's
    primary chain but is the load-bearing side-effect that makes the URL
    deep-linkable). (b) PAGE-RENDER of the paginated term catalogue via
    TermSearchResults.tsx + TermSearchResultItem.tsx — every Term row
    exposes {id, name, namespace.name, ownership[].owner.name,
    entitiesUsingCount + columnsUsingCount + linkedTermsUsingCount,
    createdAt, updatedAt}. The page render is the operator-observable
    output of the catalog enumeration.
  evidence: |-
    db-write: TermController.termSearch + updateTermSearchFacets +
    getTermSearchFacetList (lines 178-216) → TermSearchService.create/update
    /get → search_facets table (cross-link F-017 Search Facets +
    F-010 SearchFacetsHousekeepingJob TTL eviction at 30 days).
    page-render: TermSearchResults.tsx:64-110 (InfiniteScroll +
    per-row TermSearchResultItem render).
  cardinality_per_call: 1 (per session create/update); 1 page (per fetch)
amplification_factor: 1 (clean — the dispatch model is one PUT per facet
  click + one GET per scroll page, modulo the debouncer-recreate bug that
  flips facet-click coalescing to per-click dispatch — see drift facet 1)
amplification_factor_provenance: |-
  STATIC — confirmed from primary source. The 1500ms debouncer (TermSearch.tsx:50-64)
  is INTENDED to coalesce rapid facet clicks into 1 PUT, but the
  `useCallback` deps array includes `termSearchFacetParams` (line 63)
  which changes on every facet click — the debouncer is recreated on
  every render, losing the trailing-edge defer. Effective behaviour:
  every facet click dispatches `updateTermSearch` immediately; the
  1500ms "debounce" rate-limits nothing. A user rapidly clicking 5
  facets in 2 seconds dispatches 5 PUTs instead of the intended 1.
  Not strictly an "amplification" in the LSN-017 sense (no per-trigger
  multiplier from a single user action — the user IS clicking 5 times),
  but the rate-limit guarantee operators expect from a debounce model
  is silently broken.
observed_vs_expected:
  facets:
  - facet: facet-debouncer recreated on every render — rate-limit lost (batch U — STATIC PRIMARY-SOURCE)
    observed: |-
      TermSearch.tsx:50-64: `useCallback(useDebouncedCallback(..., 1500,
      {leading: true}), [termSearchId, termSearchFacetParams])`. The
      `useCallback` deps include `termSearchFacetParams` — which changes
      on every facet click. Each click constructs a NEW
      `useDebouncedCallback(...)` instance — the prior debouncer's
      pending trailing timer is GARBAGE COLLECTED. With `{leading: true}`,
      the new debouncer fires on its FIRST call (immediately) AND would
      defer a trailing call until 1500ms — but the trailing call NEVER
      fires because the next click constructs yet another debouncer.
      Effective behaviour: every facet click dispatches updateTermSearch
      immediately; the 1500ms "debounce" rate-limits nothing. A user
      rapidly clicking 5 facets in 2 seconds dispatches 5 PUTs instead
      of the intended 1. Server-side TermSearchService must handle the
      load (per F-010 SearchFacetsHousekeepingJob context — sessions
      are persisted; per-facet PUT is correctness-safe but expensive).
    expected: |-
      Either (a) move `useDebouncedCallback` outside `useCallback` with
      stable deps OR (b) drop the `useCallback` wrapper entirely. The
      use-debounce library's intended pattern is to call the hook ONCE
      per component lifecycle, not per-render.
