behaviour: |-
  **CRITICAL — `NotificationSubscriberStarter` has no thread-death detection; subscriber dies silently.** The starter at `NotificationSubscriberStarter.java:33-35` submits `new NotificationSubscriber(...)` to a single-thread `ExecutorService` but **never holds the returned `Future`** — there is no `future.get()`, no `setUncaughtExceptionHandler(...)`, no restart logic, no health-probe integration. If `NotificationSubscriber.run()` exits (e.g. via the `NotificationSubscriberException` re-thrown at lines 89 / 99 on `InterruptedException` during the inner OR outer 10s sleep), the executor's single worker thread dies and the subscriber is gone for the rest of the JVM lifetime.

  **The platform continues to accept alerts** (INSERT/UPDATE into `alert` table continues; alert-creation paths are untouched). **Postgres continues to retain WAL** on the slot (`confirmed_flush_lsn` is frozen at the LSN the dead subscriber left it at). **No notifications fire** — silently. **No log line tracks the dead subscriber** (the run() method's exit is via re-throw, which the executor's default UncaughtExceptionHandler logs at WARN-level to stderr — but ODD's logging configuration does not surface this to operator dashboards). **Operators discover the failure when an alert they expected never delivers** — which may be hours or days after the death event.

  **Compound with TEST-GAP-795** (the WAL-retention disk-exhaustion finding): the dead subscriber's frozen `confirmed_flush_lsn` causes the same WAL retention pathology — but with the additional pathology that the platform CANNOT recover by itself (no restart logic). The operator must restart the entire JVM process.

  **The brittleness extends to graceful-shutdown paths**: a SIGTERM during normal operation reaches the executor service; the inner-loop `Thread.interrupt()` checkpoint at L62 honours the interrupt and exits cleanly (no LSN advance on in-flight). BUT: a SIGTERM arriving during the OUTER 10 s back-off sleep at L96 hits the catch block at L97-100, which re-interrupts and throws `NotificationSubscriberException` — exiting `run()` entirely. The same dead-subscriber-no-detection pathology applies. The 10-second back-off cadence means there is a ~33% chance (10s out of 30s effective duty cycle on a typical poison-replay scenario) that any random SIGTERM lands during the outer sleep and produces a dead subscriber rather than a clean exit.

  **Why CRITICAL**: silent subsystem death + no observability + recovery requires JVM restart + compounds with WAL retention. The platform's only outbound alerting mechanism can be silently disabled by a single transient `InterruptedException` event.

  **Test gap shape**: integration test demonstrating the death-via-InterruptedException scenario and pinning the absence of recovery. Three test methods:
  1. Drive an `InterruptedException` during the outer 10s sleep → assert the subscriber thread exits AND no restart occurs.
  2. After the death event, INSERT a new ALERT row → assert no notification fires.
  3. Assert that `pg_replication_slots.confirmed_flush_lsn` for the slot remains frozen at the LSN held when the subscriber died.
