  - name: "Auth Mode"
    canonical_in_docs: true
    canonical_candidate: false
    description: "The `auth.type` configuration knob selecting the platform's UI/API authentication mode. Four supported values: `DISABLED | LOGIN_FORM | OAUTH2 | LDAP` (verbatim per `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security`). S2S coexists as an additional filter activated by `auth.s2s.enabled`, orthogonal to the four `auth.type` modes — composable with LOGIN_FORM / OAUTH2 / LDAP, silently ignored under DISABLED. Every controller sidecar names these as `auth_mode_relevance`. Batch 2026-05-10B added three config-key-consumer sidecars (AppInfoController@L18, AuthorizationManagerCondition@L11, IngestionDataEntitiesFilter@L20). Batch 2026-05-12C adds the four canonical `*SecurityConfiguration` sidecars — one per mode — making the per-mode behaviour fully cited: DisabledAuthSecurityConfiguration@L10 (permit-all chain, no CSRF, no CORS, no S2S wiring, no boot WARN), LoginFormSecurityConfiguration@L31 (validates REFACTOR-073 — LOGIN_FORM runs WITHOUT AuthorizationCustomizer), OAuthSecurityConfiguration@L71 (WIRES AuthorizationCustomizer; S2S composes-not-mutex), LDAPSecurityConfiguration@L51 (WIRES AuthorizationCustomizer; containsIgnoreCase admin match)."
