    description: "Cross-cutting hygiene invariant: structurally-significant declarations that exist in the codebase but have ZERO consumers. Two instances triangulated so far. (a) `AuthorizationManagerCondition` (batch 2026-05-10B) — composite `AnyNestedCondition` class authored to gate the AuthorizationCustomizer wiring for OAUTH2|LDAP via `@Conditional(AuthorizationManagerCondition.class)`, but zero `@Conditional` consumers exist in the repo per grep on 2026-05-10. AuthorizationCustomizer is in practice wired by direct `@ConditionalOnProperty` on OAuthSecurityConfiguration.java:71 + LDAPSecurityConfiguration.java:51 — bypassing the Condition class entirely. (b) `NotificationsProperties.webhookUrl` (batch 2026-05-12C) — top-level field declared on the `@ConfigurationProperties` POJO but NO consumer reads it; the active webhook URL is `notifications.receivers.webhook.url` read via `@Value` in `NotificationConfiguration`. An operator setting `notifications.webhookUrl=...` gets silent acceptance and zero effect. Both instances share the failure shape: an operator or maintainer reading the code may rely on a declaration the runtime never honours. Both warrant cleanup either via deletion or via an `@Deprecated` annotation + admonition."
    axes_present:
      - config_prefixes
    nodes:
