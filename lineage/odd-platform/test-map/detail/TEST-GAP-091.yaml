  name: postMessageInSlack_slackFailureAfter202_userMustPollMessagesEndpointForStatus
evidence:
- 'postMessageInSlack.md says: ''Caller cannot observe send failure: the controller
  returns 202 Accepted with a Message body whose state is PENDING_SEND ... but there
  is no notification / push mechanism on the HTTP surface to inform the original caller'''
cross_references:
- concepts.yaml:invariants[Decoupled-write pattern — accept-202 with queue-and-single-leader-elected-sender]
proposed_action: Add integration test asserting (202 returned with PENDING_SEND, then
  state flips to ERROR_SENDING after sender drains, then user must hit GET /api/dataentities/{id}/messages
  to learn). Locks the visibility-gap contract.
