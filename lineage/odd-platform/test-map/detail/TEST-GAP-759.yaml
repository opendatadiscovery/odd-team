proposed_action: |-
  Add `NamespaceDeleteTOCTOURaceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `concurrentDeleteAndDataSourceCreate_dataSourceReferencesSoftDeletedNamespace_pinsTOCTOURaceWindow` — seed a namespace with NO children; start two reactive subscriptions in parallel: (a) `DELETE /api/namespaces/{id}`; (b) `POST /api/datasources` with `namespaceName={same_name}`. Use a barrier to ensure the existsByNamespace check fires BEFORE the createDataSource INSERT but the namespaceRepository.delete fires AFTER. Assert the datasource is created AND the namespace is soft-deleted AND the datasource's namespace_id references the soft-deleted namespace.
  2. `namespaceServiceImplDeleteMethod_lacksReactiveTransactionalAnnotation_pinsCurrentNonAtomicPosture` — use reflection to assert `NamespaceServiceImpl.delete` does NOT carry `@ReactiveTransactional` (while `update` DOES).
  3. `concurrentDeleteAndTermCreate_sameRaceClass_assertsRaceExtendsToAllFourSideDoors` — repeat #1 with `POST /api/terms` instead of `/api/datasources`; assert the same race outcome. Demonstrates the race is structural (all 8 side-door call sites exhibit it), not endpoint-specific.

  Pair with REFACTOR-NNN: add `@ReactiveTransactional` to NamespaceServiceImpl.delete AND change the cascade-check to use `SELECT ... FOR UPDATE` on the namespace row. When the fix lands, test #1 inverts to assert the createDataSource is BLOCKED on the namespace row lock OR the delete is BLOCKED on the concurrent referent.
