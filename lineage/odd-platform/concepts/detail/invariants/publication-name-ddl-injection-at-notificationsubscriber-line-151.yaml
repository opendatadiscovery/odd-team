name: |-
  Publication-name DDL injection at NotificationSubscriber.java:151 (CREATE PUBLICATION with String.formatted operator config — batch Y)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
  - P-09
description: |-
  NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20Y — surfaced by primary-source
  examination of NotificationSubscriber.java at the registerPublication helper
  (lines 144-152). The CREATE PUBLICATION DDL is constructed via
  String.formatted (Java 15+ instance method) directly interpolating the
  operator-configured publication name and the jOOQ-derived table name; no
  identifier escaping is applied.

  THE PRIMARY-SOURCE EVIDENCE — NotificationSubscriber batch Y:

    NotificationSubscriber.java:144-152 (the registerPublication helper):
      final String tableName = targetTable.getSchema().getName() + "." +
                               targetTable.getName();
      // ... existence probe via PreparedStatement (parameterised, L133-135)
      // ... and then:
      final String sql = "CREATE PUBLICATION %s FOR TABLE %s"
          .formatted(walProperties.getPublicationName(), tableName);
      try (final Statement stmt = connection.createStatement()) {
          stmt.execute(sql);
      }

  THE ASYMMETRY — probe vs create:

    The publication-EXISTS probe at L133-135 uses a PreparedStatement with
    a parameter binding:
      SELECT EXISTS (SELECT oid FROM pg_publication WHERE pubname = ?)
    The probe IS parameterised — SQL injection on the probe is impossible.

    The CREATE PUBLICATION DDL at L151 is NOT parameterised — PG bans
    parameterised DDL identifiers (this is a structural Postgres limitation,
    not a code bug). The String.formatted interpolation is therefore
    structurally REQUIRED, but the code applies NO additional escaping or
    validation between operator config and the interpolated value.

  THE ATTACK SURFACE:

    The publication-name value comes from operator config
    (notifications.wal.publication-name, default
    odd_platform_publication_alert, read by Spring @Value into
    NotificationsProperties$WalProperties). A pathological config value
    such as
      'odd_alert; DROP TABLE alert; --'
    would, when interpolated, produce:
      CREATE PUBLICATION odd_alert; DROP TABLE alert; -- FOR TABLE public.alert
    Postgres executes the DDL multi-statement (separator ';'). The DROP
    TABLE alert runs on the platform's own ALERT table.

    The likelihood is LOW because:
      - the attack vector requires operator-config-modification capability
      - operators with this capability already have a much broader threat
        model (they can read database credentials from the same config
        file)
      - no UI surface exposes the publication name as user-controllable

    The severity is MEDIUM because:
      - the code is structurally vulnerable to identifier-injection (no
        validation, no escaping)
      - the asymmetry between probe (parameterised) and create (formatted)
        is a maintainer-trap: a future maintainer reading the probe might
        assume the create is similarly safe
      - a build-time scanner cannot detect this without dataflow analysis
        (the @Value flow from config to formatted-string interpolation is
        not a syntactic pattern)

  THE BROADER CLASS — DDL identifier injection:

    PG identifiers ARE quotable via double-quotes if they contain special
    characters. The fix is to wrap the publication name in double-quotes
    AND escape any embedded double-quotes by doubling them:
      "CREATE PUBLICATION \"%s\" FOR TABLE %s"
          .formatted(walProperties.getPublicationName().replace("\"", "\"\""),
                     tableName)
    OR to validate the publication name against a strict allowlist regex
    (e.g. [a-z_][a-z0-9_]*) at boot via @ConfigurationProperties validator
    and fail fast on a pathological value.

    Neither mitigation is present in the current code.

  THE SLOT-NAME ANALOGUE — sibling LOW-severity gap:

    The replication-slot lazy-create at L113-120 uses
    pgConnection.createReplicationSlot() (org.postgresql driver method)
    not raw DDL. The driver-side method applies its own slot-name
    validation. The slot-name does not flow through String.formatted
    on the create path. SLOT name injection is therefore NOT present —
    only PUBLICATION name injection is.

  CROSS-FEATURE NOTE — similar patterns elsewhere in odd-platform:

    The Lookup Tables subsystem already has a "custom connection pool
    exists solely for lookup-tables schema injection" invariant (batch P)
    capturing a similar DDL identifier-interpolation surface — but with
    explicit operator-trust framing (the operator is trusted to set the
    schema name). The publication-name surface is similar in that it is
    operator-controlled, but DIFFERENT in that the live doc treats
    publication-name as a "tunable knob" rather than as a privileged
    identifier; operators reading the live doc would not realise the
    knob carries DDL-injection responsibility.

  SEVERITY MEDIUM — bounded by operator-config-modification threat model,
  but structurally present at the code level and undocumented.
