mitigations_unimplemented:
  - |-
    SIMPLE FIX — add the missing call. TagServiceImpl.delete should
    extend the Flux.zip at line 64-65 to include
    `reactiveTagRepository.deleteDatasetFieldRelations(tagId)`. This
    closes the asymmetry; the cascade becomes symmetric across all
    three relation tables. ONE-LINE FIX at TagServiceImpl.java:64.
  - |-
    COMPOUND FIX (preferred — batch VAL-LSN-019 insight) — extend the
    delete path to address BOTH known asymmetries in one commit:
      (a) Add deleteDatasetFieldRelations to the Flux.zip cascade.
      (b) Extend the search-vector refresh to all THREE vectors
          (see `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`).
    The two omissions live in the same method; the maintainer should
    fix both atomically. The delete path's contract becomes:
      Flux.zip(deleteTermRelations, deleteDataEntityRelations,
               deleteDatasetFieldRelations)
        .then(softDelete(tagId))
        .then(Mono.zip(refresh3vectors))
  - |-
    Add a regression test asserting the symmetric cascade:
      (a) Create a tag T.
      (b) Bind T to a data entity (DATA_ENTITY_TAGS_UPDATE path).
      (c) Bind T to a dataset field (DATASET_FIELD_TAGS_UPDATE path).
      (d) Bind T to a term (TERM_TAGS_UPDATE path).
      (e) Delete T via TAG_DELETE.
      (f) Assert: tag_to_data_entity row REMOVED.
      (g) Assert: tag_to_dataset_field row REMOVED.  (CURRENTLY FAILS)
      (h) Assert: tag_to_term row REMOVED.
      (i) Assert: tag.deleted_at = NOW() (soft-deleted).
    The (g) assertion pins the bug; once the simple fix lands, (g)
    passes.
  - |-
    Add a one-time cleanup migration that DELETEs the existing orphan
    tag_to_dataset_field rows in long-running deployments:
      DELETE FROM tag_to_dataset_field
      WHERE tag_id IN (SELECT id FROM tag WHERE deleted_at IS NOT NULL);
    For a deployment with N orphan rows accumulated over months,
    this releases the disk usage.
  - |-
    OR (longer-term) — add a housekeeping job that nightly scans
    for orphan tag_to_dataset_field rows. Same architectural class
    as the proposed orphan-TOKEN-row cleanup job. The housekeeping
    pattern already exists; one more job to the registry. Requires
    HousekeepingTTLProperties to gain a tag_orphan_relations_days
    knob (deferred cleanup vs immediate).
  - |-
    Document the cascade behaviour on the
    /features/data-discovery/tagging live page — explicit text:
    'Deleting a tag from the catalog vocabulary REMOVES every
    binding to data entities, dataset fields, and terms.' The text
    should match the FIXED behaviour, not the current behaviour.
    DOC-NNN candidate.

notes: |-
  STRENGTHENED batch VAL-LSN-019 (2026-05-20) — TagServiceImpl
  promoted to SERVICE-TIER PRIMARY SOURCE. The compound observation
  (the delete method has TWO asymmetries — cascade incomplete AND
  search-vector refresh incomplete) is captured this batch and pairs
  with the sibling `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
  invariant. Both asymmetries are code-omissions in the same method;
  the recommended fix is a COMPOUND FIX touching both in one commit.

  This invariant captures a CODE-OMISSION BUG visible only by
  cross-referencing TWO files (TagServiceImpl.java + ReactiveTagRepositoryImpl.java).
  The asymmetry is invisible from EITHER file in isolation:
    - TagServiceImpl.delete calls TWO of three relation-cleanup methods.
      A maintainer reading just this file sees a coherent
      'delete-with-cascade' shape — they would not notice the missing
      third relation table because the file is otherwise complete.
    - ReactiveTagRepositoryImpl exposes THREE relation-cleanup methods
      symmetrically. A maintainer reading just this file sees the
      three methods named consistently — they would not notice that
      one of them is never called.
  The bug surfaces ONLY when the controller-level analysis
  systematically enumerates 'what does deleteTag actually do, and
  what could it have done?'. This is the same shape as several
  prior cross-file bugs (REFACTOR-217 path-mismatch, the
  SecurityConstants alerts-status mis-gate, the
  term-to-term-deleted-at-schema-drift). The cross-file scan
  protocol per LSN-018 IS the only mechanism that catches it.

  Cross-cutting connections:
    - Pairs with the spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create
      master invariant (the side-doors create the rows that this
      invariant says are not cleaned up — compound bug class)
    - Pairs with the namespace-create-tag-create-side-doors-via-termcontroller-unguarded-paths
      master invariant (the broader cross-pillar pattern — TermController
      side-door for Tag creation + DatasetField side-door for Tag
      creation; the cleanup asymmetry compounds the bypass asymmetry)
    - Pairs with the three-soft-delete-mechanisms-across-the-repository-layer
      master invariant (the cascade asymmetry is a NEW VARIANT
      within the relationship-edge cluster — same architectural
      class as the SOFT-DELETE-on-cascade vs HARD-DELETE-on-user
      split in group_entity_relations + data_entity_to_term)
    - Pairs with the collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
      invariant (both are 'orphan rows accumulate unbounded after
      parent soft-delete with no housekeeping job' — same
      operational class; both need housekeeping additions)
    - Pairs with the audit-log-presence-asymmetry-2-tier-audit-story
      master invariant (tag_to_dataset_field operations do NOT emit
      Activity events; tag_to_data_entity DOES emit
      TAG_ASSIGNMENT_UPDATED; the orphans-after-delete are forensically
      dark because Activity Feed has no record of which dataset fields
      had the tag attached)
    - **NEW batch VAL-LSN-019** — pairs with the sibling
      `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
      invariant. The delete method has TWO code-omissions; they live
      in the same method and should be fixed atomically.

  Three DOC-NNN candidates:
    (a) /features/data-discovery/tagging — document the cascade
        behaviour explicitly (assuming the simple fix lands; document
        the FIXED behaviour, not the buggy one).
    (b) /features/management — admonition on the Tags tab Delete
        action: 'Deleting a tag removes all bindings to data entities,
        dataset fields, and terms.'
    (c) Operator playbook for cleanup of historical orphans — if a
        deployment has been running pre-fix, the cleanup migration
        is operator-runnable (DELETE FROM tag_to_dataset_field WHERE
        tag_id IN ...).
