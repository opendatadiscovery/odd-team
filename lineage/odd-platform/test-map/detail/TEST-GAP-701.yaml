  - "DataSourceIngestionServiceImpl.md says (bugs_limitations_corner_cases.[7]): 'FTS index NOT refreshed on collector-driven datasource rename. Unlike DataSourceServiceImpl.update (the UI path per batch R sidecar — calls searchEntrypointRepository.updateChangedDataSourceVector(id) at DataSourceServiceImpl.java:133), this service does NOT refresh the search_entrypoint FTS vector for the renamed datasource.' severity: LOW"
