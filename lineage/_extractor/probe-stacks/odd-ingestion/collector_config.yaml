# IT-128 — the REAL odd-collector config for the ingestion-grade relationships stand.
# Two plugins, one per source system. Token arrives via the env (!ENV) — the spec
# registers the collector through POST /api/collectors (the real one-shot-token flow)
# and starts this container with $COLLECTOR_TOKEN set (helpers/ingestion-stack.ts).
#
# Gotcha encoded (maintainer-hit 2026-06-12): the neo4j plugin inherits the generic
# `WithPort.port: str` (odd-collector domain/plugin.py:19-20) so its port MUST be a
# QUOTED STRING; the postgresql plugin overrides `port: int = 5432` so a bare int is fine.
default_pulling_interval: 1
token: !ENV ${COLLECTOR_TOKEN}
plugins:
  - type: neo4j
    name: it128_neo4j_graph
    host: probe-ingest-neo4j
    port: "7687"
    database: neo4j
    user: neo4j
    password: odd-neo4j-password
  - type: postgresql
    name: it128_postgres_erd
    host: probe-ingest-source-postgres
    port: 5432
    database: shop
    user: shop
    password: shop-password
