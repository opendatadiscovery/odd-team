proposed_action: |-
  Add `R2DBCActuatorEnvPasswordMaskingRegressionPinTest`. Three test methods:

  1. `actuatorEnv_exposesUrlButMasksPassword_pinsDefaultBehaviour` — `@SpringBootTest` with `spring.datasource.password=unique-test-pw-12345`; GET `/actuator/env`; assert response status 200; assert response body contains `spring.datasource.url` AND `spring.datasource.password` keys but the password value is `******` (or whatever Spring masks to).

  2. `actuatorEnv_jdbcUrlIsExposed_pinsHostAndPortLeak` — same fixture; assert the JDBC URL is fully readable (not masked). Documents the database-location-disclosure surface.

  3. `actuatorEnv_renamedKeyWithoutPasswordSubstring_wouldExposeValue_pinsMaskingConvention` — hypothetical fixture with `spring.datasource.dbpass=unique-test-pw-12345`; assert the value IS in the response body (the substring-mask boundary). Documents what an OPERATOR refactor would break.

  Add a `// CONVENTION-PIN — Spring Boot's actuator env masking is substring-based on the key name. /actuator/env is exposed by default. This test pins the current state until REFACTOR-029 lands either (a) restricting actuator exposure to safer set OR (b) structural masking via @JsonIgnore-style annotation on credentials.` comment block.
