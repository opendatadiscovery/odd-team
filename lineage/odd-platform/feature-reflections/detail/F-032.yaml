      test_demand_note: "No test distinguishes failed-fetch from empty-catalog. The demand: an e2e that forces a 5xx on the dashboard fetch and asserts an explicit error state. Routes to DOC-GAP-269 (doc-side) + the code sliver (read isError / ErrorBoundary) + this guard."

