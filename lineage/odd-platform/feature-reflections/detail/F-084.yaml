        section: concepts.entities (21-field POJO; allowedDomain uniform)
        cite: "ODDOAuth2Properties.java:30-53"
        note: "allowedDomain is a uniform field on every provider; only Google consumes it"
    operator_visible_failure: |-
      An operator who believes they have domain-restricted a Cognito or Azure login has, in
      fact, an open login that admits any account the IdP authenticates — a silent
