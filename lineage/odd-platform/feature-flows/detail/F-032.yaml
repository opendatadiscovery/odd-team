discovered_from_entry_point: ui_route:/data-quality
description: |-
  The Catalog-wide Data Quality Dashboard is the standalone /data-quality SPA
  page — the cross-entity aggregate quality view, DISTINCT from the per-dataset
  "Test reports" tab (F-022, P-04:F-001). Where F-022 answers "how is THIS
  dataset's quality", F-032 answers "how is the WHOLE catalog's quality": how
  many tables are healthy, how many are monitored, how test runs break down by
  status, and the per-test-category spread of run outcomes.

  Five batch-ZC sidecars compose the feature:

  - DataQuality.tsx (DataQuality.tsx:7-18) — the React route-entry component
    registered for /data-quality at App.tsx:73. A 20-line pure-composition
    component: it wraps the subtree in a feature-scoped jotai Provider
    (DataQualityAtomProvider) and lays out a sticky filter Sidebar +
    a scrolling Content pane. It is lazy-loaded / code-split (App.tsx:39) and
    — unlike the sibling /lookup-tables route at App.tsx:75-88 — is mounted
    with NO WithPermissionsProvider wrapper.
  - DataQualityContent.tsx (DataQualityContent.tsx:22-147) — the dashboard
    body. It reads the jotai derived filtersAtom and issues a SINGLE aggregate
    fetch via useGetDataQualityDashboard(filterState) → GET /api/dataqatests/runs
    (operationId getDataQualityTestsRuns), then projects the one
    DataQualityResults DTO into three DonutChart rings (Table Health / Test
    Results Breakdown / Monitored Tables) and one TestCategoryResults card per
    backend test category, alphabetically sorted.
  - DataQualityFilters.tsx (DataQualityFilters.tsx:56-91) — the sticky
    left-sidebar filter panel. Two independent filter blocks ("Filters for
    tables" / "Filters for tests"), each with the same five sub-filters
    (Namespace, Datasource, Owner, Title, Tag), writing ten distinct keys into
    the jotai formFiltersAtom. It owns the URL searchParams round-trip so the
    filtered view is deep-linkable.
  - DataQualityStore.ts (DataQualityStore.ts:1-66) — the jotai atom module:
    formFiltersAtom (the 10-key source-of-truth selection), the derived
    read-only filtersAtom (projects the selection into the dashboard-query
    request shape), and two write-only clear atoms (one per side). Per-Provider
    -mount scope — navigating away resets every filter.
  - TestCategoryResults.tsx (TestCategoryResults.tsx:11-45) — the leaf
    per-category result row: a category heading, a large total count, and a
    fixed enum-ordered row of six per-run-status count tiles.

  The single backend contract behind the whole page is GET /api/dataqatests/runs,
  served by DataQualityRunsController → DataQualityRunsServiceImpl (which fans
  out to three repository queries and zips them into one DataQualityResults
  DTO). The DataQualityRunsController node is NOT yet enriched as a sidecar —
  recorded as an unresolved REFERENCE; the chain's terminal DB-read side effect
  and the backend authorization posture (probe P-090) resolve when that node is
  walked.

  The user-observable reality, per the five batch-ZC sidecars, surfaces 15
  load-bearing drift facets. The headline cluster: (a) the /data-quality route
  is mounted with NO client-side permission guard — any authenticated user (and,
  under auth.type=DISABLED, any anonymous caller) opens the catalog-wide
  aggregate health of every dataset; (b) a HIGH-severity latent crash —
  DataQualityContent.tsx:47-48 indexes palette.runStatus[status].color, which
  throws an uncaught TypeError and blanks the WHOLE dashboard if the backend
  ever returns a run-status outside the six-value DataEntityRunStatus enum;
  (c) the "Title" filter is the LSN-020 input-name-vs-implementation drift —
  the bare label "Title" reads as "dataset name" but binds at the SQL layer to
  OWNERSHIP.TITLE_ID, an ownership role; (d) the operator's filter slice does
  NOT survive a navigate-away — the per-Provider-mount jotai store resets to
  all-empty on every remount. Secondary: the live dashboard doc describes the
  Test Results ring as 3 statuses where the code renders up to 6, and Table
  Health as "success/failed/broken" where the UI shows "Healthy/Warning/Error";
  a failed fetch is presented identically to an empty catalog (no error UI);
  category cards are alphabetically ordered (worst-failing category not
  surfaced first); and there is no debounce on either the per-filter dashboard
  refetch or the autocomplete list queries.
