behaviour: |-
  **HIGH — Category B (DRIFT_NAME_VS_BEHAVIOR) on the global Alerts page's
  "All" tab.** The live docs page at
  `https://docs.opendatadiscovery.org/features/active-platform-features/alerting`
  (WebFetched 2026-05-26, status 200) describes the All tab as: "Every open
  and resolved alert across the whole platform." The implementation
  (`AlertController.getAllAlerts` -> `AlertServiceImpl.listAll` ->
  `ReactiveAlertRepositoryImpl.listAllWithStatusOpen`) hard-filters
  `ALERT.STATUS.eq(OPEN.getCode())` at three call sites:
  `ReactiveAlertRepositoryImpl.java:145, 166, 230` (the three global-tab
  list methods: `listAllWithStatusOpen`, `listByOwner`,
  `listDependentObjectsAlerts`).

  **Operator-observable consequence**: an operator opens `/alerts/all`
  expecting to see ALL alerts (per the docs), searches for a known
  RESOLVED alert from yesterday, and cannot find it. The natural
  conclusion is "the alert was purged" — even though the alert is still
  in the database, still attached to the entity's per-entity Alerts tab
  (which IS unfiltered: `getAlertsByDataEntityId` has no status filter,
  lines 182-199), and would re-surface if reopened.

  **Why HIGH**:
  - **Operator harm**: a security-relevant alert (e.g. data-quality test
    failure) that was resolved-then-recreated or resolved-prematurely is
    invisible to the on-call. Forensic incident-response is misled.
  - **Cross-locale uniformity**: the "All" label is the i18n key
    `t('All')` — no locale corrects it (verified via batch ZJ en.json
    sidecar; all six locales translate to the same misleading label).
  - **Sibling-tab consistency**: "My Objects" and "Dependents" tabs
    have the same OPEN-only filter (lines 166, 230); the drift is
    uniform across the global page surface.
  - **Same Category B failure class as LSN-019** (TagController
    `listMostPopular` — the name "most popular" vs the SQL "most used
    in popular entities"). Category B classification confirmed in the
    sidecar.

  **The OPEN-only filter is INTENTIONAL** (the implicit ADR per
  Alerts.md:implicit_adrs[3] — alerts are reset on resolve, so the
  global tabs are inbox-style rather than archive-style). The fix is
  EITHER (a) update the docs to say "every OPEN alert" OR (b) add a
  status filter to the page so operators can opt into resolved-view
  OR (c) the per-entity Alerts tab already shows full history; cross-
  link to it from the global page's empty state when the user
  searches for a resolved alert.

  **Test gap shape**:
  1. **Backend regression-pin**: `AlertControllerStatusFilterTest` —
     POST an alert, mark it RESOLVED, GET /api/alerts (all), assert
     the alert is ABSENT. PINS the OPEN-only filter at the controller
     surface; flips assertion direction if the fix path (b) is taken.
  2. **UI regression-pin**: `Alerts.AllTab.OpenOnlyFilter.test.tsx` —
     mock the alerts thunk to return mixed-status payloads, render
     the All tab, assert only OPEN-status items render in the list.
     PINS the UI-side accommodation of the backend filter.
  3. **Doc-drift regression**: `Alerts.AllTab.DocVsImpl.test.tsx` —
     parse the live docs page (or its archived snapshot at commit
     time) and assert the page text either (a) says "every OPEN
     alert" (after doc fix) OR (b) the docs and the impl agree on
     scope. PINS the cross-artefact coherence.
