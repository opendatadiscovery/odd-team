contributors:
- 'All controller sidecars: security.auth_mode_relevance lists DISABLED/LOGIN_FORM/OAUTH2/LDAP
  (with auth-mode names verbatim from the live enable-security doc)'
- 'AlertManagerController: auth_mode_relevance is `NONE — operator-delegated network-layer
  auth` (the singular exception — `/ingestion/**` whitelist exempts the path from
  the UI authentication chain)'
- 'CollectorController.regenerateCollectorToken: also implicates S2S — the rotated
  token is the S2S credential the ingestion filter validates (collector-token surface
  is producer-side of S2S)'
- 'AppInfoController@L18: relevant to ALL FOUR modes — its job is to REPORT which
  mode is active; `/api/appInfo` echoes `authType` verbatim. Under `auth.type=DISABLED`
  (the application.yml default at L34) the endpoint is anonymously reachable and discloses
  {projectVersion, authType}'
- 'AuthorizationManagerCondition@L11: documents the AUTHORIZATION-side gating (NOT
  authentication). The composite `AnyNestedCondition` is designed to gate the AuthorizationCustomizer
  wiring for OAUTH2|LDAP — but is DEAD CODE (zero @Conditional consumers in repo per
  grep on 2026-05-10). The Policies/Permissions/Roles/Owners framework is in practice
  wired by direct `@ConditionalOnProperty` on OAuthSecurityConfiguration.java:71 +
  LDAPSecurityConfiguration.java:51. LOGIN_FORM runs WITHOUT AuthorizationCustomizer
  (LoginFormSecurityConfiguration.java:53-66 has no .authorizeExchange(new AuthorizationCustomizer(...)))
  — authenticated-but-unauthorized.'
- 'IngestionDataEntitiesFilter@L20: the ingestion-token verification path is ORTHOGONAL
  to `auth.type` — every UI/API security config explicitly puts `/ingestion/entities`
  in permittedPaths or in `WHITELIST_PATHS = /ingestion/**`, so authentication on
  the ingestion endpoint depends EXCLUSIVELY on `auth.ingestion.filter.enabled` regardless
  of `auth.type`. When that property is `false` (the application.yml:48 default),
  `/ingestion/entities` is unauthenticated under ALL four UI auth modes.'
- 'DisabledAuthSecurityConfiguration@L10: CANONICAL sidecar for the DISABLED branch
  — the bean produces a `securityWebFilterChainDisabled` that calls `.csrf(...disable).authorizeExchange(...
  .anyExchange().permitAll())`; NO `.cors(...)`, NO `AuthorizationCustomizer`, NO
  `S2sAuthenticationFilter` wiring (S2S silently ignored even when `auth.s2s.enabled=true`),
  NO `@Slf4j` boot WARN, NO `matchIfMissing`. The shortest of the four SecurityConfiguration
  siblings (19 lines). Under DISABLED, `/actuator/{health,prometheus,env,info}` are
  reachable on the same HTTP port.'
- 'LoginFormSecurityConfiguration@L31: CANONICAL sidecar for the LOGIN_FORM branch
  — VALIDATES REFACTOR-073: `LoginFormSecurityConfiguration.java:55-57` configures
  only `.pathMatchers(permittedPaths).permitAll().pathMatchers("/**").authenticated()`
  — NO `AuthorizationCustomizer`. Every form-authenticated user is granted ADMIN authorities
  via `getAuthorities(true)` at line 81; CSRF disabled at line 54; S2S additively
  composable at HTTP_BASIC order at line 61-63; `auth.login-form-redirect` is an open-redirect
  surface (no scheme/host validation); plaintext credentials leak via `/actuator/env`.'
- 'OAuthSecurityConfiguration@L71: CANONICAL sidecar for the OAUTH2 branch — WIRES
  `AuthorizationCustomizer(permissionService, extractors)` at line 98 (the Policies/Permissions/Roles/Owners
  framework). CSRF disabled at line 96. S2S COMPOSES (not mutex) at HTTP_BASIC at
  line 108-110 — and when composed, the S2sAuthenticationFilter grants ADMIN role
  across all `/**` paths (not just `/ingestion/entities`). Multi-client login chooser
  at `GET /login` is public. Provider enum carries only Cognito/GitHub/Google/Azure/ODD_IAM
  — Okta/Keycloak operators (per live docs) get no provider-specific user enrichment
  or logout.'
- 'LDAPSecurityConfiguration@L51: CANONICAL sidecar for the LDAP branch — WIRES `AuthorizationCustomizer(permissionService,
  extractors)` at line 145; SecurityWebFilterChain runs at `Ordered.HIGHEST_PRECEDENCE`
  at line 136. Admin-group match uses `containsIgnoreCase` (line 96). **CORRECTED batch O**:
  `OperationUtils.containsIgnoreCase` is full-string `element::equalsIgnoreCase`,
  NOT substring (verified by direct Read of OperationUtils.java:7-10). The original
  substring-collision-admin-escalation claim is FACTUALLY WRONG and is being retracted
  in the canonicalisation_candidates supersede block. NO scheme enforcement on `auth.ldap.url`
  (plaintext `ldap://` accepted; bind creds + end-user creds in cleartext).
  `auth.ldap.password` exposed via `/actuator/env`. Active Directory branch silently
  ignores `dn-pattern` and `user-filter` config. S2S additively composable at HTTP_BASIC
  at line 149-151.'
- 'ODDOAuth2Properties (batch 2026-05-12D): CANONICAL config-POJO sidecar for the
  OAUTH2 branch. `@ConfigurationProperties("auth.oauth2")` with single `Map<String,
  OAuth2Provider> client` field — operators register N OAuth2/OIDC clients keyed by
  registrationId. `@PostConstruct validate()` (lines 16-19) enforces ONLY `clientId`
  + `provider` non-empty per client; every other field (Azure-required `logoutUri`,
  GitHub-required `read:org` scope, URL formats) is unvalidated. Provider field is
  a FREE STRING — `Provider` enum at Provider.java:3-5 lists 5 values (`COGNITO, GITHUB,
  GOOGLE, ODD_IAM, AZURE`) but the field accepts any string; consumer-side dispatch
  via `equalsIgnoreCase(Provider.X.name())` silently routes typos / Okta / Keycloak
  through generic OIDC. Validates 3 batch-C OAuth claims from primary source: (a)
  Provider enum 5 values vs docs 7 (Okta + Keycloak unmapped); (b) `azureTenantId`
  ABSENT from POJO — `application.yml:128-156` Azure example uses `${auth.oauth2.client.azure.azure-tenant-id}`
  placeholder only, not a POJO field; (c) Azure `logoutUri` is NPE-prone at `AzureLogoutSuccessHandler.java:39`
  (`URI.create(provider.getLogoutUri())` with no null guard, vs `CognitoLogoutSuccessHandler.java:33-35`
  which DOES guard). NEW doc-drift finding: live docs at `/oauth2-oidc` use field
  key `username-attribute` (kebab single-word) but POJO field is `userNameAttribute`
  (camelCase split User+Name) — Spring relaxed binding requires `user-name-attribute`
  (kebab triple-word), NOT `username-attribute`. Operator copy-paste-from-docs verbatim
  fails to bind silently.'
- 'ODDLDAPProperties (batch 2026-05-12D): CANONICAL config-POJO sidecar for the LDAP
  branch. `@ConfigurationProperties("auth.ldap")` with six top-level fields (`url`,
  `username`, `password`, `base`, `dnPattern`, `userFilter.filter`) + nested `Group`
  block (`searchBase`, `filter`, `adminGroups`) + nested `ActiveDirectory` block (`enabled`,
  `domain`). `@PostConstruct validate()` (lines 40-49) enforces TWO and ONLY TWO invariants:
  URL non-empty AND at least one of {dnPattern, userFilter.filter}; every other field
  unvalidated (password, base, adminGroups, AD.domain). Validates batch-C LDAP claims
  AND REFINES the actuator-env credential-leak finding: Spring Boot 3.4.10''s `management.endpoint.env.show-values:
  NEVER` default DOES sanitise `/actuator/env` (the password appears as `******` in
  actuator). The DURABLE leak surface is Lombok `@Data`-generated `toString()` — `EmailSenderProperties.java:6-10`
  + `ODDLDAPProperties.java:10,14` both declare `@Data` with no `@ToString.Exclude`
  on the password field. Any `log.info("props = {}", properties)` (or future code
  adding such a line) emits the password in cleartext. The actuator-env scope from
  batch C was overbroad; the Lombok-toString scope is precise. `adminGroups` confirmed
  `Set<String>` (full-string-equality semantic via `LDAPSecurityConfiguration.java:96`
  `containsIgnoreCase` per OperationUtils — CORRECTED batch O; NOT substring as
  previously claimed). Also surfaces: AD.domain unvalidated; ldap:// vs ldaps:// scheme
  not enforced; absent admin-groups silently produces zero-admin LDAP deployment.'
- 'RoleController.createRole (batch 2026-05-12E): RBAC primary-surface sidecar. SECURITY_RULES
  POLICY_CREATE-class gate (ROLE_CREATE NO_CONTEXT at SecurityConstants.java:169).
  Under DISABLED: gate INERT (`auth.type=DISABLED` bypasses entire SECURITY_RULES
  table — RBAC mutation endpoint reachable unauthenticated; LSN-001 shape). Under
  LOGIN_FORM: AuthorizationCustomizer not wired AND every form-authenticated user
  is ADMIN via `getAuthorities(true)` — effective ROLE_CREATE for everyone. Under
  any non-DISABLED mode with `auth.s2s.enabled=true`: S2sAuthenticationFilter.java:31-39
  injects ADMIN globally — REFACTOR-108 (S2S admin-everywhere reaches RBAC, not just
  /ingestion).'
- 'PolicyController.createPolicy (batch 2026-05-12E): RBAC primary-surface sidecar.
  SECURITY_RULES POLICY_CREATE MANAGEMENT-tier gate at SecurityConstants.java:163-164.
  Same DISABLED-bypass shape. Plus: live `/oauth2-oidc` / `/login-form` / `/ldap`
  per-mode pages do NOT cross-link to `/permissions` page that DOES list POLICY_CREATE
  — operators can''t tell which auth modes actually enforce it. The policy schema
  endpoint `GET /api/policies/schema` is NOT in SECURITY_RULES (falls through to `.authenticated()`)
  — undocumented but reachable for schema-introspection.'
- 'OwnerController.createOwner (batch 2026-05-12E): RBAC directory sidecar. SECURITY_RULES
  OWNER_CREATE NO_CONTEXT at SecurityConstants.java:143. Same DISABLED-bypass + LOGIN_FORM-ADMIN-everywhere
  shapes. Plus identity-decoupled-CRUD invariant: no auth-mode flow auto-creates an
  Owner on first login (LDAP/OAuth2/LOGIN_FORM all skip this); operators must MANUALLY
  pre-create per-user Owner rows OR accept association requests.'
- 'PermissionController.getResourcePermissions (batch 2026-05-12E): RBAC READ-side
  sidecar. NO SECURITY_RULES entry (deliberate — read-collaborative posture). Endpoint
  is the canonical reveal of two HIGH auth-mode-bypass findings: (a) under DISABLED,
  response is EMPTY while mutation endpoints are simultaneously `.permitAll()` — UI
  shows ''you can do nothing'' while API accepts everything (silent UI-vs-API contradiction);
  (b) under LOGIN_FORM, response is ALWAYS the FULL admin permission set regardless
  of UI-configured policies (LOGIN_FORM-ADMIN-everywhere bypass). Cross-corroborates
  Auth Mode (LOGIN_FORM branch) — now 3-sidecar.'
- 'SearchController.search (batch 2026-05-12E): NEW search-area sidecar. NO SECURITY_RULES
  entry — falls through to `.authenticated()` catch-all. Under DISABLED, anonymously
  reachable. Default `my_objects=false` returns aggregations over the entire catalog
  (owner-bypass). Third read-collaborative cross-owner enumeration surface (after
  getAllAlerts batch A + getActivity batch B) — wider blast radius than either since
  search paginates the WHOLE catalog by name/ODDRN/descriptions/ownership/tags.'
- 'DataEntityController.getDataEntityDetails (batch 2026-05-12F): DATAENTITY PRIMARY
  SURFACE sidecar — the platform''s single hottest endpoint. NO SECURITY_RULES entry.
  Under DISABLED, anonymous read of every entity''s full 34-field DataEntityDetails
  payload (including soft-deleted entities — `includeDeleted(true)` is deliberate).
  **RESOLVES ADR-CANDIDATE-003 borderline_flag**: the read-collaborative posture is
  INTENTIONAL on the centerpiece read; consistent with 27+ other GETs on the same
  controller. Also: under DISABLED any anonymous caller can inflate any entity''s
  `view_count` (the GET is a write at the DB layer). Centerpiece embodiment of the
  Auth Mode DISABLED weakness.'
- 'DataEntityController.createOwnership (batch 2026-05-12F): DATAENTITY OWNERSHIP-BINDING
  sidecar. SECURITY_RULES-gated under non-DISABLED (`DATA_ENTITY_OWNERSHIP_CREATE`
  per-data-entity at SecurityConstants.java:215-217). Under DISABLED, anonymous callers
  can bind any Owner (including auto-created via getOrCreate) to any data entity,
  and emit OWNERSHIP_CREATED activity events with undefined caller identity (the `@ActivityLog`
  fires, but `ActivityContextInfo` lacks principal). Under LOGIN_FORM with `getAuthorities(true)`
  ADMIN-for-all, every form-authenticated user effectively holds DATA_ENTITY_OWNERSHIP_CREATE
  everywhere.'
- 'DataEntityController.updateStatus (batch 2026-05-12F): DATAENTITY STATUS-LIFECYCLE
  sidecar. SECURITY_RULES-gated under non-DISABLED (`DATA_ENTITY_STATUS_UPDATE` per-data-entity
  at SecurityConstants.java:277-281). Under DISABLED, anonymous callers can flip ANY
  data entity to DELETED, triggering the soft-delete cascade (lineage / group-relations
  / parent-group-relations / statistics / filled-flag) — effectively wholesale catalog
  deletion to anonymous traffic. HIGH-severity blast radius under DISABLED specifically
  because of the cascade fan-out.'
- 'DataEntityController.getDataEntityDownstreamLineage (batch 2026-05-12F): DATAENTITY
  LINEAGE-GRAPH sidecar. NO SECURITY_RULES entry — falls through to `.authenticated()`.
  Under DISABLED, anonymous callers can drive arbitrarily-expensive recursive-CTE
  queries (no `@Max` cap on `lineage_depth`; no CTE cycle guard) AND enumerate the
  full reachable graph from any rooted entity, including entities owned by other teams.
  Graph-shaped cross-owner-enumeration vector under DISABLED — combined with DoS-amplification
  this is the highest-stakes lineage read under DISABLED.'
- 'IngestionController.postDataEntityList (batch 2026-05-12F): S2S INGESTION CONTROLLER
  sidecar — CLOSES THE LOOP opened by IngestionDataEntitiesFilter (batch B). Path
  `/ingestion/**` is in `SecurityConstants.WHITELIST_PATHS` (line 95-96), exempted
  from the UI authentication chain in every mode (DISABLED/LOGIN_FORM/OAUTH2/LDAP).
  Authentication is EXCLUSIVELY the responsibility of IngestionDataEntitiesFilter
  (`auth.ingestion.filter.enabled` defaults false). Under DEFAULT-OFF, ANY caller
  able to reach the platform''s HTTP port can ingest arbitrary data entities into
  any datasource by writing its ODDRN in the payload — DEFAULT-OFF unauth confirmed
  at the CONTROLLER side. Two-sidecar with IngestionDataEntitiesFilter batch B.'
- 'GoogleUserHandler (batch 2026-05-19-O): OAUTH2-mode Google-specific OIDC user-
  enrichment handler. `@Conditional(GoogleCondition.class)`-gated. Validates `hd`
  (hosted-domain) claim against `provider.allowedDomain` if set (lines 49-55).
  Reads `provider.adminAttribute` claim (default `email`) for admin-principal
  matching (lines 56-65). Does NOT extend `AbstractOIDCUserHandler` — direct
  interface implementation; provider-specific quirks (hd-claim verification,
  Spring-discovered userNameAttribute via ClientRegistration not POJO, email-default
  admin attribute). SILENTLY IGNORES `admin-groups` config — POJO field binds,
  handler never reads. Doc-drift: live docs do not name the hd-claim or
  document the rejection-message-quality (`Domain null doesn''t match` for
  personal @gmail.com accounts).'
- 'GithubUserHandler (batch 2026-05-19-O): OAUTH2-mode GitHub OAuth2 user-
  enrichment handler (non-OIDC variant — implements `OAuthUserHandler<OAuth2User,
  OAuth2UserRequest>`). Hard-coded singleton WebClient bound to `https://api.github.com`
  (line 39) — GitHub Enterprise Server (GHES) cannot be supported by this handler;
  no `apiBaseUrl` config knob. Two outbound HTTP calls per login: `/user/orgs`
  for organization membership, `/user/teams` for admin-team membership (conditional
  on adminGroups non-empty). admin-principals BYPASSES organization-name gate
  (lines 54-67 fire before org-check at line 68 — explicit allowlist beats
  org gate). Username = mutable `login` string — GitHub username-rename
  orphans the USER_OWNER_MAPPING row (silent loss of owner-linkage). No retry,
  no timeout, no rate-limit handling on the outbound calls.'
- 'AzureLogoutSuccessHandler (batch 2026-05-19-O): OAUTH2-mode Azure-specific
  logout dispatcher. `@Conditional(AzureCondition.class)`-gated. Constructs the
  Azure end-session URL via `UriComponentsBuilder.fromUri(URI.create(provider.getLogoutUri()))`
  with `post_logout_redirect_uri` + `client_id` query params, sets 302 Location,
  invalidates local WebSession. **NO null guard** on `provider.getLogoutUri()`
  at line 39 (NPE-prone) — sibling Cognito carries `StringUtils.isEmpty` guard;
  Azure does not (inconsistent guard pattern). `post_logout_redirect_uri` derived
  from inbound Host header via `UriUtils.getBaseUri(requestUri)` — no platform-
  side allowlist; Azure App Registration Logout URLs are the only mitigation.
  No server-side token revocation (Azure v2.0 has no RFC 7009 endpoint; only
  end-session redirect closes the IDP-side session). CONFIRMS F-010 search_facets
  TTL eviction is correct (no logout-time cleanup needed because the row has
  no user binding).'
- 'CognitoLogoutSuccessHandler (batch 2026-05-19-O): OAUTH2-mode Cognito-specific
  logout dispatcher. `@Conditional(CognitoCondition.class)`-gated. Constructs
  AWS Cognito `/logout` redirect with `client_id` + `logout_uri` (note: lowercase
  per AWS spec — Cognito convention, NOT the `post_logout_redirect_uri` OIDC
  name). **HAS** `StringUtils.isEmpty(provider.getLogoutUri())` guard at lines
  33-35 — graceful-degradation: returns `Mono.empty()` if logoutUri is empty,
  leaving user SILENTLY logged in (no error, no redirect, no session invalidation).
  Cognito SOLE sibling with this guard; Azure does NOT. No call to Cognito
  `/oauth2/revoke` endpoint — AWS Cognito DOES expose RFC 7009 revocation but
  this handler doesn''t use it. AWS docs explicitly state `/logout` does NOT
  sign user out of upstream federated IdPs (Google / Facebook / SAML brokers);
  the handler does not surface this.'
- 'IngestionDataEntitiesFilter (batch 2026-05-19-O — auth/filter axis): NEW
  filter-class-layer sidecar complementing the existing config-key-consumer
  axis. Carries the FILTER CLASS layer evidence (path-matching exact-literal
  `/ingestion/entities`, body-buffering-before-auth at 20MB max, token-resolution
  precedence: datasource.token() first then collector.token() fallback,
  plaintext-equality comparison at line 56, NotFoundException → 5xx not 401
  surface, duplicate body parse). 16-sidecar REFACTOR-185 triangulation (was
  15) with auth/filter axis added.'
