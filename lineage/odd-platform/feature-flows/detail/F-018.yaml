- batch: VAL-LSN-019
  entry_point_added: |-
    NONE — VAL-LSN-019 is the LSN-019 Stress Protocol validation canary
    batch. The three sidecars re-enriched this batch
    (ReactiveTagRepositoryImpl, TagServiceImpl, TagController) carry the
    new `stress_findings` block (rev-4 schema, LSN-019) which surfaces
    NAME-vs-BEHAVIOUR drift, AUTH-gate enumeration absences, TUNABLE
    boundary conditions, ORDERING / pagination semantics, and RESOURCE
    boundary races. No new entry-points; the existing chain composition
    (UI tag-assign → setDataEntityTags → TagService → ReactiveTagRepository
    → ingestData/bulkCreate + listMostPopular) is unchanged. What CHANGES
    is the operator-visible truth at hop 3 (`listMostPopular`) and the
    repository/service-tier auth posture catalogue.
  contributing_nodes_added: []
  contributing_nodes_re_enriched:
  - odd-platform java repository reactive repository:ReactiveTagRepositoryImpl
  - odd-platform java service service:TagServiceImpl
  - odd-platform java TagController controller-class:TagController
  notes: |-
    LSN-019 Stress Protocol canary batch. ONE NEW HEADLINE drift facet
    + FOUR STRENGTHENS on existing F-018 facets + ONE cross-cutting
    posture confirmation. Ordered by architectural leverage:

    (1) NEW HEADLINE — **listMostPopular ranking lie — paginate-inside-CTE
    yields OLDEST-by-tag.id-ASC, NOT MOST-POPULAR-by-count** (HIGH
    severity, F-018-DRIFT-LSN019-listMostPopular-ranking). The OpenAPI
    spec promises "sorted by popularity" (`odd-platform-specification/
    openapi.yaml:344-346`); the implementation truncates the candidate
    pool by `tag.id ASC` BEFORE counts are computed
    (ReactiveTagRepositoryImpl.java:148 `paginate(homogeneousQuery,
    [OrderByField(TAG.ID, ASC)], (page-1)*size, size)`). The outer
    `cteSelect.orderBy(field(COUNT_FIELD).desc())` at line 158 only
    re-ranks the already-truncated window. Empirical confirmation:
    LSN-019:23-32 (2026-05-20 maintainer test against demo.oddp.io — 35
    tags all equally popular, size=30 → response = oldest 30 by tag.id
    ASC; 5 youngest absent). Operator-visible consequence: UI 'Top Tags'
    tile on Catalog Overview shows the OLDEST tags when directory N > 30;
    a newly-created high-usage tag is INVISIBLE on page 1 of /api/tags
    /popular. P-010 (file-analyser-emitted) + P-LSN019-listMostPopular-
    drift (service-sidecar-emitted) pin the SQL contract permanently in
    CI; REFACTOR-LSN019-listMostPopular-ranking captures the fix-shape
    options.

    The pre-existing F-018 drift facet
    `list_most_popular_globally_scoped_no_per_owner_filter` (batch-N) is
    ORTHOGONAL — that one is about scope (no per-Owner / per-Namespace
    filter); THIS one is about RANKING SEMANTICS (the rank-by-count
    promise unmet for N > size). Both facets coexist on the same SQL
    method but describe distinct drifts.

    (2) STRENGTHENS — **service-tier zero-permission-checks posture pinned
    by Stress Protocol Category D** (MEDIUM severity, STRENGTHENS the
    existing F-018 facet `tag_service_tier_zero_permission_checks_
    controller_perimeter_sole_authorization` — batch-W primary source).
    TagServiceImpl.java:1-167 verified line-by-line: ZERO `@PreAuthorize`,
    ZERO `permissionService.hasPermission(...)`, ZERO
    `OwnerAuthorizationFacade` invocations, ZERO `SecurityContextHolder`
    reads, ZERO programmatic permission checks of any kind, across all 9
    public methods + 2 private helpers. The Stress Protocol Category D
    enumeration confirms the absence is COMPLETE (not just at one method
    — at every method) and CONSISTENT (not just on read paths — on every
    write path including the five side-door entry points TermService /
    DataEntityService / DatasetFieldService / Collector S2S /
    TagController). This finding is CROSS-CUTTING (also applies to many
    other ODD services per the prior batch-T 9-SIDECAR audit-silence
    pattern), but its instantiation on F-018 is captured here; the
    cross-cutting posture itself is documented under P-09 Security &
    Access Control as the architectural decision. NO new P-09 feature
    minted by this batch — the existing F-018 facet is the canonical
    home for the Tag-directory instance.

    (3) STRENGTHENS — **TagController.getPopularTagList ranking-promise
    failure pinned at the controller perimeter** (HIGH severity,
    STRENGTHENS the new headline F-018-DRIFT-LSN019-listMostPopular-
    ranking from the controller tier). The TagController sidecar's
    stress_findings.name_behavior_pairs[0] traces the FULL chain
    (TagController → TagService → ReactiveTagRepository → JooqQueryHelper
    .paginate semantics) and ANCHORS the operator-visible UI-surface
    misnaming at the controller layer (`@GetMapping('/popular')`,
    `getPopularTagList`). The trace closes the picture: NO upstream
    re-sort at controller or service tier; UI consumes the response
    verbatim. The previous batch-W TagController sidecar transcribed
    this as 'orders by descending count' — the WRONG claim, the canonical
    LSN-019 failure mode that motivated the rev-4 schema. The corrected
    transcription is the load-bearing pillar of this canary batch.

    (4) STRENGTHENS — **`updateRelationsWithDataEntity` empty-set
    destructive semantic** (MEDIUM severity, NEW STRENGTHENS on the
    existing implicit F-018 contract). Stress Protocol Category C
    finding S-C-2 (TagServiceImpl sidecar): an empty `tagNames` Set
    passed to `updateRelationsWithDataEntity(dataEntityId, {})` is
    INTERPRETED as "remove all non-external tag relations from this data
    entity" via the diff semantic (`pojosToDelete = current \\ updated =
    current`). The contract is intentional but the trap is real: callers
    must NOT pass `{}` to mean "no-op"; it is a delete-all. The method
    name does not advertise the asymmetry. P-LSN019-updateRelations-empty
    -deletes-all probe-skeleton emitted.

    (5) STRENGTHENS — **case-sensitivity divergence between divideTagsByExistence
    and listMostPopular's query** (MEDIUM severity, STRENGTHENS existing
    F-018 facet `case_sensitive_listbynames_silent_duplicate_rows` —
    batch-N primary source). Stress Protocol Category B finding S-B-3
    (TagServiceImpl sidecar): `divideTagsByExistence` uses `listByNames`
    which is case-SENSITIVE; the UI tag-search-facet (`listMostPopular`'s
    `query` parameter) uses `listCondition`'s `containsIgnoreCase` —
    case-INSENSITIVE. A user can search "postgres" + see a "Postgres" tag,
    then submit "postgres" for a new entity, and the service silently
    mints a SECOND "postgres" tag row distinct from the "Postgres" row
    because the `tag_name_unique` partial index is byte-exact. The
    Stress Protocol confirms this is INTENTIONAL at the SQL layer (no
    LOWER/ILIKE on the dedup primitive) but UNDOCUMENTED at the
    operator-facing tagging.md page. P-LSN019-divide-case-sensitive
    probe-skeleton emitted.

    (6) STRENGTHENS — **getOrCreateTagsByName TOCTOU window pinned** (HIGH
    severity, STRENGTHENS existing F-018 facet
    `toctou_between_list_by_names_and_bulk_create`). Stress Protocol
    Category E finding S-E-1 (TagServiceImpl sidecar) provides per-method
    `@ReactiveTransactional` enumeration: `getOrCreateTagsByName` is
    multi-step (listByNames + optional bulkCreate) WITHOUT
    `@ReactiveTransactional` at the service tier; the inherited
    `ReactiveAbstractCRUDRepository.bulkCreate` annotation wraps the
    INSERT alone, not the read+write pair. Sibling `getOrInjectTagByName`
    silences the race via ON CONFLICT DO UPDATE — intentional dual-method
    design. `deleteRelationsWithTerm` is also multi-step without TX
    (separate but related shape). P-LSN019-getOrCreate-vs-getOrInject-
    toctou probe-skeleton emitted.

    Coherence (LSN-018 Rule 6 sweep):
    STRENGTHENS=6 (existing F-018 facets + the new headline pinned at
    controller tier).
    SUPERSEDES=1 (the batch-W TagController sidecar's "orders by
    descending count" claim about getPopularTagList — SUPERSEDED by the
    LSN-019 canary's primary-source trace; the canary was AUTHORED to
    fix exactly this miss).
    CONFLICTS=0.

    HIGHEST-LEVERAGE remediation: implement the fix at
    ReactiveTagRepositoryImpl.listMostPopular (move ORDER BY count DESC
    OUTSIDE the paginate-inside-CTE, OR add an OUTER paginate AFTER count
    aggregation) — this closes the operator-visible ranking lie. The
    P-010 probe pins the current behaviour; the fix flips the assertion.
    Local docker-compose probe stack: ODD platform + Postgres + curl
    script seeding 35 tags with known IDs + tag-assignment fixture +
    GET /api/tags/popular?size=30&page=1; assert response IDs ⊆ [1..30]
    BEFORE fix; assert response IDs ⊄ {1..30} AFTER fix.

    Methodology-meta: this batch is the LSN-019 Stress Protocol
    VALIDATION CANARY. The rev-4 file-analyser schema (with
    `stress_findings` block + Category A/B/C/D/E exhaustion + named
    questions per category + REFERENCE/STATIC-INFERRED/PROBE-NEEDED
    confidence flags) was designed specifically to catch the
    name-vs-behaviour drift class that earlier schemas missed (batch-W
    transcribed `listMostPopular` as "orders by descending count" — the
    WRONG claim). This canary batch proves the rev-4 schema CAN surface
    a known-bug at the right severity and with empirical pin (LSN-019:
    23-32) when applied to the same source file. The headline drift
    facet F-018-DRIFT-LSN019-listMostPopular-ranking IS the validation
    success criterion.
