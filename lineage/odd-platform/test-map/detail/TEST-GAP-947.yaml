behaviour: |-
  **OpenAPI contract bug — `DataEntityList.pageInfo.hasNext` is ALWAYS
  true regardless of remaining rows on GET /api/search/{search_id}/results.**
  `DataEntityServiceImpl.findByState:181-194` constructs
  `new Page<>(dtos, total, true)` with the third argument HARD-CODED to
  `true` (Page.java:11-15 is the wrapper carrying it through). The mapper
  writes that into `DataEntityList.pageInfo.hasNext` verbatim. No
  compensating logic exists at the service, mapper, or controller layers.

  Operator-visible impact diverges by consumer class:
  (a) ODD UI: the `fetchDataEntitySearchResults` thunk at
  `dataentitiesSearch.thunks.ts:62-63` OVERRIDES with
  `hasNext: page * size < pageInfo.total` — the UI is correct;
  (b) third-party API consumers (mobile, CLI, automation, third-party
  catalog connectors) reading the documented OpenAPI contract directly
  trust `hasNext: false` as the pagination terminator. With the value
  hard-coded to `true`, those consumers pagination-loop indefinitely —
  fetching page 1, page 2, ..., page N where N*size >= total, then
  continue fetching empty pages until rate-limited or timed out.

  This is a Category B drift (UI compensates for backend) on a documented
  OpenAPI response field. The OpenAPI spec at openapi.yaml:734-755
  documents PageInfo as the standard pagination envelope; the UI's
  client-side override is undocumented compensation. No regression test
  for this exists. A fix candidate is changing
  DataEntityServiceImpl.java:192 from `new Page<>(dtos, total, true)` to
  `new Page<>(dtos, total, (page * size) < total)`.
