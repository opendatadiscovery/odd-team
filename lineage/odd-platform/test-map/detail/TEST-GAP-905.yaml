proposed_action: |-
  Add `DataSourceDeleteOrphanCleanupTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `deleteDataSource_leavesOrphanedTokenRow_pinsTokenLeak` — register a data source with no children, capture `data_source.token_id` via raw DB query; DELETE /api/datasources/{id} (assert 204); assert `SELECT COUNT(*) FROM token WHERE id = <token_id>` returns 1 — the token row persists, unreferenced by any live data source. PIN the orphan-token leak.
  2. `deleteDataSource_doesNotClearSearchEntrypointVector_pinsFtsLeak` — register a data source; assert a `search_entrypoint` row exists for it; DELETE; assert the `search_entrypoint` row still exists. PIN the uncleared-FTS leak.
  3. `registerThenDeleteCycle_repeated_accumulatesOrphanTokens_pinsUnboundedGrowth` — record `SELECT COUNT(*) FROM token`; run register+delete 5 times; assert the token count grew by 5. PIN the unbounded accumulation.

  These tests PIN the current (leaking) cleanup behaviour. Pair with a REFACTOR follow-up:
  add token-row cleanup + search_entrypoint clear to `DataSourceServiceImpl.delete`, OR a
  scheduled housekeeping job. When the fix lands, tests #1-#3 invert.
