      The promise this hypothesis falsifies (delete retires the secret) is unguarded.
    test_demand: functional
    routes_to_finding: bug-candidate
    routes_note: |-
      Bug tracked via PLT-085 AS BEFORE. v0.3.0 ALSO routes a functional demand: an integration test
