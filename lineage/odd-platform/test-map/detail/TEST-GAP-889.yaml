behaviour: |-
  **HIGH — the `DELETE /api/tags/{tag_id}` (deleteTag) delete path is unverified end-to-end at the controller AND service layers. The tag-deletion semantic is SOFT (the `tag` row's `deleted_at` is stamped, the row is not physically removed) — a load-bearing invariant: a regression to a physical `DELETE FROM tag` would change FK cascade behaviour on every relation table. The not-found path (`NotFoundException` -> 404 on a non-existent OR already-soft-deleted id) and the transactional all-or-nothing wrapping of the six-step chain are also unpinned.** Method-level primary source from the batch-X-TAGGING `deleteTag` controller-method sidecar:

  - `TagController.deleteTag` (`:30-34`): `tagService.delete(tagId).then(Mono.just(ResponseEntity.noContent().build()))` — 5-line delegation; HTTP 204.
  - `TagServiceImpl.delete` (`:57-70`, `@ReactiveTransactional`): six-step chain — (1) `getDto(tagId)`, (2) `switchIfEmpty -> NotFoundException("Tag", tagId)`, (3) `.filter(!external)` else `BadUserRequestException`, (4) `Flux.zip(deleteTermRelations, deleteDataEntityRelations)` — two concurrent hard deletes, (5) `reactiveTagRepository.delete(tagId)` SOFT-delete, (6) FTS refresh.
  - `ReactiveAbstractSoftDeleteCRUDRepository.delete` (`:50-59`): `UPDATE tag SET deleted_at = now() WHERE id = ? AND deleted_at IS NULL RETURNING *`. The `idCondition` override (`:77-79`) adds `addSoftDeleteFilter` so an already-deleted id matches nothing.
  - `getDto` filters `tag.deleted_at IS NULL` (`ReactiveTagRepositoryImpl.java:54-66`) — so a non-existent OR already-deleted `tagId` triggers `switchIfEmpty` -> `NotFoundException`.

  **Three distinct sub-behaviours, all unpinned:**
  - **Soft-delete semantics** — `DELETE` returns 204; the `tag` row's `deleted_at` is stamped, the row is NOT physically removed. The soft-vs-hard distinction is load-bearing — a regression to physical delete changes FK cascade behaviour on `tag_to_term` / `tag_to_data_entity` / `tag_to_dataset_field`.
  - **Not-found / already-deleted -> 404** — `DELETE` of a non-existent id, OR a replay of `DELETE` after a successful delete, yields `NotFoundException` -> 404 (the replay is idempotent in EFFECT but NOT in status code: first call 204, replay 404).
  - **Atomic rollback** — the `@ReactiveTransactional` wraps the two hard deletes, the soft delete, and the FTS refresh; if any step fails, all roll back. A failure injected into the FTS-refresh step must leave the relation rows intact.

  **Why HIGH**: the entire delete-tag path is unverified; the only adjacent coverage is `TagRepositoryImplTest`, which covers the `deleteDataEntityRelations(Collection)` overload (the diff-list variant used by `updateRelationsWithDataEntity`) — NOT the `deleteDataEntityRelations(long tagId)` overload that `deleteTag` uses, NOT `deleteTermRelations`, NOT the inherited soft-delete, NOT the service-layer chain. The soft-delete semantic is the most consequential to pin.

  **Test gap shape**: a `WebTestClient` / `@SpringBootTest` test asserting (a) `DELETE /api/tags/{id}` returns 204 AND a raw DB `SELECT deleted_at FROM tag WHERE id = ?` returns a non-null timestamp (the row PHYSICALLY EXISTS); (b) `DELETE` of a non-existent id returns 404; (c) a replay of `DELETE` after a successful delete returns 404 (not 204); (d) a failure in any chain step leaves the relation rows intact. The current state is PINNED — a regression to physical delete fails (a).
