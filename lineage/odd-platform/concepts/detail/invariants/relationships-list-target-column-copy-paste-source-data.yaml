name: |-
  Relationships list — Target column renders Source data (copy-paste UI bug, doc-vs-code drift)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-02
description: |-
  **NEW HIGH-severity UI BUG, batch ZI (2026-05-26)** — surfaced via the
  relationships route sidecar's primary read of
  `components/DataModelling/Relationships/RelationshipsListItem.tsx:73-81`.

  The Relationships list page (`/data-modelling/relationships`) renders
  a table with five columns: Name, Type, Namespace+Datasource, Source,
  Target — per the live doc page at
  `https://docs.opendatadiscovery.org/features/data-modelling/relationships`
  (WebFetched 2026-05-26, status 200) which verbatim names
  "Source entity, Target entity" as distinct columns.

  The implementation in `RelationshipsListItem.tsx:64-72` renders the
  Source cell correctly:

      <RelationshipDatasetInfo
        dataEntityId={item.sourceDataEntity.id}
        name={item.sourceDataEntity.internalName ||
              item.sourceDataEntity.externalName || ''}
        oddrn={item.sourceDataEntity.oddrn || ''}
      />

  Lines 73-81 render the Target cell with the SAME fields (literal copy-
  paste of the Source cell):

      <RelationshipDatasetInfo
        dataEntityId={item.sourceDataEntity.id}      // BUG: should be item.targetDataEntity.id
        name={item.sourceDataEntity.internalName ||  // BUG: should be item.targetDataEntity.*
              item.sourceDataEntity.externalName || ''}
        oddrn={item.sourceDataEntity.oddrn || ''}    // BUG: should be item.targetDataEntity.oddrn
      />

  Result — every row displays the Source dataset in BOTH the Source AND
  Target column. The user has no way to see what each relationship
  POINTS TO from the list page.

  **The bug is in the row renderer ONLY** — `item.targetDataEntity` IS
  present on the `DataEntityRelationship` interface (verified by reading
  the OpenAPI-generated type) and IS consumed correctly by sibling
  components:
    - `components/shared/elements/Relationships/RelationshipTypes/EntityRelationship.tsx:33-35`
      uses `targetDataEntity` to render ERD details.
    - `components/shared/elements/Relationships/RelationshipTypes/GraphRelationship.tsx:32-34`
      uses `targetDataEntity` to render Graph details.

  Backend correctness is unaffected — the
  `RelationshipController.getRelationships` response payload populates
  `targetDataEntity` correctly per
  `ReactiveDataEntityRelationshipRepositoryImpl.java:57-131`. The
  rendering layer simply ignores the target field at the list-page
  layer (the detail pages render it).

  **TYPE-SYSTEM IS NOT A SAFETY NET** — `item.sourceDataEntity.id` is
  type-correct (it IS a `DataEntityRef['id']`); the field name is what
  is wrong. TypeScript catches missing fields, not copy-paste bugs
  that ARE structurally valid in the wrong column. Only a Playwright
  / RTL integration test asserting `source.href !== target.href` for
  at least one seeded row would catch this — and no such test exists
  (Grep across `odd-platform-ui/src/` for `RelationshipsListItem` in
  `*.test.*` / `*.spec.*` returns zero matches at commit 4ec2b20).

  **Probe P-167 Block D** pins the runtime observation (the
  relationships route sidecar emits this).

  **Routing context**: the bug is operator-visible on the
  `/data-modelling/relationships` URL which is reachable by every
  authenticated user (per
  `ui-route-no-permission-guard-data-quality-vs-lookup-tables-contrast`)
  AND by every caller able to reach the application port under
  `auth.type=DISABLED` (per the un-gated RelationshipController
  posture — see
  `relationships-no-exclude-from-search-asymmetry-vs-dataentities`).

  **Fix surface**:
    1. Single 3-line correction at `RelationshipsListItem.tsx:73-81`:
       replace `item.sourceDataEntity` with `item.targetDataEntity` in
       lines 75, 77-79, 80.
    2. ADD an integration test under
       `components/DataModelling/Relationships/__tests__/` asserting
       `Source !== Target` on a seeded row.

  vocabulary_status: codebase-anchored. The live doc at
  `/features/data-modelling/relationships` (WebFetched 2026-05-26
  status 200) IS correct; the code IS wrong. No documentation
  refresh required after the code fix.
