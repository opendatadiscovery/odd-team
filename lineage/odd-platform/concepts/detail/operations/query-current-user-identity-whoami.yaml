name: Query Current User Identity (whoami)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW OPERATION, batch 2026-05-25-ZD** — the HTTP boundary operation
  that answers the SPA's "who am I and what can I do?" question.
  `GET /api/identity/whoami` is dispatched once on every SPA mount
  (`App.tsx:48` useEffect with empty dep-array) and once per
  successful Owner-association submission (`OwnerAssociationForm.tsx:128`).
  The endpoint is the SOLE consumer-facing identity surface; the
  response shape populates `profile.slice.ts:24-26` and feeds every
  downstream selector (`getGlobalPermissions`, `getIdentity`, the
  Owner-association flow predicates, the toolbar's user-menu render).

  ## Path
  `GET /api/identity/whoami` (openapi.yaml:115-128, operationId `whoami`)

  ## Authorization

  NO `@PreAuthorize` annotation on the controller (IdentityController.java:23-28).
  NO programmatic permission check in the controller or the service.
  By design (implicit_adrs.[1] in the batch-ZD sidecar): the whoami
  endpoint is the SOURCE of authorization, not a gated operation. The
  gate lives entirely in the SecurityWebFilterChain — anonymous calls
  are rejected BEFORE reaching the controller under LOGIN_FORM / OAUTH2
  / LDAP. Under DISABLED, no gate exists — the endpoint is anonymously
  reachable AND returns a positive admin claim (see the IDENTITY-LAYER
  FACET invariant).

  ## Implementation chain

  `IdentityController.whoami(exchange)` → `IdentityServiceImpl.whoami()`
  → `Mono.zip(AuthIdentityProviderImpl.fetchAssociatedOwner,
  OwnerAssociationRequestRepository.getLastRequestForUsername,
  PermissionService.getNonContextualPermissionsForCurrentUser)` →
  `.map(AssociatedOwnerMapperImpl.mapAssociatedOwnerWithPermissions)`
  → `Mono<ResponseEntity<AssociatedOwner>>`.

  On the happy path, the response carries:
    - `identity.username` — the real principal name from
      `ReactiveSecurityContextHolder.getContext()`
    - `identity.permissions` — the union of policy-resolved
      non-contextual MANAGEMENT-scope permissions
    - `owner` — the user's mapped Owner (or null if unassociated)
    - `associationRequest` — the user's pending owner-association
      request (or null if no pending request)

  On the empty-SecurityContext path (DISABLED mode), the
  `switchIfEmpty(dummyOwner())` fallback at line 27 returns 200 OK
  with hardcoded `identity.username = "admin"` and ALL 70+ Permission
  enum values.

  ## Performance characteristics

  - One round-trip per SPA mount (App.tsx:46-51 useEffect empty
    dep-array; fires once per full SPA load)
  - 3 parallel DB queries via Mono.zip under authenticated modes
  - 0 DB queries on the empty-SecurityContext path (the dummy
    fallback fires BEFORE the service-chain DB reads)
  - Stateless reactive — instances scale horizontally
  - No caching: every whoami call issues fresh DB reads

  ## Distinct from the service-tier operation

  This is the HTTP-boundary operation. The service-tier
  per-request identity-resolution chokepoint is the SEPARATE
  operation:
  `operation:resolve-current-principal-and-associated-owner`
  (15 callsites via AuthIdentityProvider; service-tier scope).
  THIS operation is the SOLE HTTP-tier consumer of that
  chokepoint — the UI's principal-resolution surface — and
  carries its own observable characteristics (the dummyOwner
  fallback, the Cache-Control absence, the audit-log absence,
  the no-rate-limit anonymous reach).

  ## Audiences

  - Every SPA user on every mount (1 call per app boot)
  - Every successful Owner-association submission (refresh)
  - Direct REST API consumers reading the OpenAPI spec
  - Anonymous probes under DISABLED (auth-mode reconnaissance)
