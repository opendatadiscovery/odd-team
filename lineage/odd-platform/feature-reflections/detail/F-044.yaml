# Data Entity Status Lifecycle — product-owner reflection

## product_owner_narrative

The Data Entity Status Lifecycle is the catalog-hygiene surface of Data Discovery
(pillar P-01): it lets an operator mark any catalogued entity with one of five
lifecycle states — `UNASSIGNED`, `DRAFT`, `STABLE`, `DEPRECATED`, `DELETED` — and,
for the two "transitional" states (`DRAFT`, `DEPRECATED`), schedule an automatic
flip to `DELETED` at an operator-chosen `status_switch_time` (per
updateStatus.md:concepts + WebFetch statuses 2026-06-01). The promise to the
operator is a **two-stage retirement pipeline**: stage one, the entity flips to
`DELETED` (a soft delete that hides it from default views and cascades through
lineage, group relations, statistics, and attachments); stage two, after a 30-day
grace window, the housekeeping job permanently hard-deletes the row and everything
attached to it (per HousekeepingTTLProperties.md:concepts.invariants + WebFetch
verbatim "permanently deletes a `DELETED` entity ... only after ... 30 days").
The mental model the product sells is "deprecate, give downstream consumers a
month, then it's gone and your storage is reclaimed."

A user reaches this feature two ways. Interactively, an operator opens an entity's
detail page, picks a status from a dropdown, and (for DRAFT/DEPRECATED) sets a
switch time — this is `PUT /api/dataentities/{id}/statuses` carrying a
`DataEntityStatusFormData` body (per updateStatus.md:understanding). Hands-off, the
platform itself acts: `DataEntityStatusSwitchJob` fires every 10 minutes under a
9-minute ShedLock, reads every entity whose `status_switch_time` has elapsed, and
bulk-flips them to `DELETED` (DataEntityStatusSwitchJob.java:21-31,
source_read_for_validation). Both paths are the SAME write path — they both route
through `DataEntityInternalStateServiceImpl.changeStatusForDataEntities` →
`DataEntityMapperImpl.applyStatus` (per updateStatus.md:dependencies_semantic +
the F-044 chain hops 3-4). Whatever is true of one path is true of the other.

The working parts the operator would see in a demo: a status dropdown with five
options; a switch-time picker that appears for DRAFT and DEPRECATED; a soft-delete
that cascades (so deleting a Data Entity Group with `propagate=true` deletes its
members too — per updateStatus.md:implicit_adrs); a "deleted items" filter to find
soft-deleted entities; and — invisibly — a background reaper that is supposed to
sweep DELETED entities away 30 days later. The operator tunes the window with
`housekeeping.ttl.data_entity_delete_days` (default 30, application.yml:170, per
HousekeepingTTLProperties.md).

This feature integrates tightly with three neighbours. It FEEDS the Housekeeping
TTL Enforcement job (F-010 / P-08:F-002) — the downstream consumer that performs
stage two and is the entire reason `status_updated_at` exists. It SHARES the
soft-delete cascade with Attachment Lifecycle (F-027) — a hard-deleted entity's
attachment files are removed via a reactive `.block()` inside the housekeeping
transaction. And it is the lifecycle sibling of view-count tracking (F-001):
`status_switch_time` and `view_count` are the two operator-or-system-mutated
columns on `data_entity`, and the `isStale` indicator reads alongside status.

Edge cases a senior product owner flags in the demo: what happens to a DELETED
entity's audit trail when the deleting actor was the scheduler (not a human)?
what happens on RESTORE (DELETED → STABLE) — does the clock reset cleanly? what
does an operator see if 5,000 entities all mature in the same 10-minute window?
and — the one that turns out to matter most — does the storage actually get
reclaimed after 30 days, or does "soft delete" silently mean "delete forever"?
The bottom-up substrate already answered the last one: it does not (per
concepts.yaml "TTL retention broken by statusUpdatedAt nullification" cross-batch
invariant). The hypotheses below trace each promise through the assembled chain.

## hypotheses

- id: H-001
  hypothesis: |-
    When an operator sets a `status_switch_time` on a DEPRECATED entity, the
    scheduled job picks it up within at most ~10 minutes and flips the entity's
    status to DELETED.
  derivation: |-
    Endpoint shape (`status_switch_time` body field on DRAFT/DEPRECATED) + pillar
    primary action ("flag entity statuses ... auto-transition") + the
    DataEntityStatusSwitchJob @Scheduled(fixedRate=10min) cadence.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      DataEntityStatusSwitchJob.run() is annotated @Scheduled(fixedRate = 10,
      timeUnit = MINUTES) with @SchedulerLock("statusSwitchJob"). It calls
      getPojosForStatusSwitch() (rows whose STATUS_SWITCH_TIME has elapsed),
      collectList, and on a non-empty set invokes changeStatusForDataEntities(
      pojos, new DataEntityStatus(DELETED)). The flip to DELETED on elapsed
      switch-time is exactly what the hypothesis predicts; worst-case latency is
      one tick (≤10 min) plus job runtime.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveDataEntityRepositoryImpl.md
        section: concepts (scheduled-batch-read) + upstream_callers
        cite: "ReactiveDataEntityRepositoryImpl.java:256 (getPojosForStatusSwitch); upstream_callers: DataEntityStatusSwitchJob"
        note: "the query selects rows whose STATUS_SWITCH_TIME has elapsed, consumed by the job"
      - sidecar: source_read_for_validation
        section: DataEntityStatusSwitchJob.run()
        cite: "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/job/DataEntityStatusSwitchJob.java:21-31"
        note: "fixedRate=10min + flatMap to changeStatusForDataEntities(pojos, DELETED); confirms the auto-flip"
    confidence: HIGH
    routes_to_finding: none

- id: H-002
  hypothesis: |-
    When an entity is flipped to DELETED (by the scheduler OR by a manual PUT), it
    is permanently hard-deleted after the 30-day retention window
    (housekeeping.ttl.data_entity_delete_days), reclaiming storage and removing
    every cascading row — i.e. the documented two-stage retirement actually
    completes stage two.
  derivation: |-
    Pillar mission ("soft-delete TTL") + the live doc's verbatim 30-day-then-
    hard-delete promise + the existence of housekeeping.ttl.data_entity_delete_days
    as a tunable retention knob.
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The hard-delete NEVER fires for any entity transitioned through this
      feature. DataEntityMapperImpl.applyStatus (lines 247-251,
      source_read_for_validation) executes `pojo.setStatus(statusDto.getId())` on
      line 247 BEFORE the change-detection guard `if (statusDto.getId() !=
      pojo.getStatus())` on line 249. At the guard, pojo.getStatus() already
      equals the just-written value, so the condition is ALWAYS false and line 250
      `pojo.setStatusUpdatedAt(DateTimeUtil.generateNow())` is unreachable. Every
      status transition leaves status_updated_at NULL. The housekeeping reaper
      (DataEntityHousekeepingJob.doHousekeeping, lines 73-78,
      source_read_for_validation) selects `WHERE STATUS = DELETED AND
      STATUS_UPDATED_AT.lessOrEqual(now - dataEntityDeleteDays)`. In SQL
      three-valued logic, NULL <= cutoff evaluates to NULL (not TRUE), so every
      NULL-timestamp row is silently excluded from the delete set. The soft-delete
      is permanent; stage two never runs.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: bugs_limitations_corner_cases.[0]
        cite: "DataEntityMapperImpl.java:242-253 + DataEntityHousekeepingJob.java:73-82"
        note: "the sidecar pins the ordering bug + the NULL-exclusion mechanism as HIGH severity"
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: dependencies_semantic.requires-feature + concepts.invariants
        cite: "DataEntityHousekeepingJob.java:71-80 (TTL query keyed on STATUS_UPDATED_AT)"
        note: "the TTL surface depends on STATUS_UPDATED_AT being maintained; this feature never maintains it"
      - sidecar: source_read_for_validation
        section: applyStatus + doHousekeeping
        cite: "DataEntityMapperImpl.java:247-251 + DataEntityHousekeepingJob.java:73-78"
        note: "verbatim confirmation of the always-false guard and the STATUS_UPDATED_AT.lessOrEqual predicate"
    operator_visible_failure: |-
      (1) Storage never reclaimed: `SELECT count(*) FROM data_entity WHERE status
      = 'DELETED'` grows monotonically and never drops; the table and its ~25
      cascading child tables grow unbounded. (2) Compliance violation: an operator
      under a "delete records 30 days after retire" policy who trusts the doc
      silently violates it — legal exposure. (3) Skewed analytics: DELETED entities
      remain FK-referenced and counted in statistics rollups / Catalog Overview
      tile counts (zombie rows). (4) Re-ingestion hazard: re-creating an entity at
      a previously-DELETED oddrn hits FK paths that should have been cleared. The
      failure is invisible until the operator runs the count query by hand — there
      is no UI signal, no metric, no log at production level.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-003
  hypothesis: |-
    The same retention promise holds for an entity an operator manually PUTs to
    DELETED via the entity detail page (not just for scheduler-flipped entities) —
    a human-initiated delete is reclaimed after 30 days.
  derivation: |-
    Endpoint shape (`PUT /api/dataentities/{id}/statuses` body target = DELETED) +
    the shared-service-path observation (manual + scheduler route through the same
    mapper).
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      Identical to H-002 — the manual PUT path and the scheduler path both call
      DataEntityInternalStateServiceImpl.changeStatusForDataEntities →
      DataEntityMapperImpl.applyStatus (per updateStatus.md:dependencies_semantic
      requires-feature + the F-044 chain hops 3-4). The applyStatus ordering bug
      affects BOTH paths uniformly; a human clicking "Delete" leaves
      status_updated_at NULL just as the scheduler does. Verification on either
      side confirms the other (drift_class shared_service_path_*).
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: dependencies_semantic.requires-feature + understanding
        cite: "DataEntityController.java:193-200 → DataEntityServiceImpl.updateStatus → DataEntityInternalStateServiceImpl.changeStatusForDataEntities → DataEntityMapper.applyStatus"
        note: "manual PUT routes through the identical mapper as the scheduled job"
      - sidecar: source_read_for_validation
        section: applyStatus
        cite: "DataEntityMapperImpl.java:247-251"
        note: "single bug locus shared by both entry points"
    operator_visible_failure: |-
      An operator who manually deletes an entity expecting it gone in 30 days has
      the same outcome as H-002: it persists forever. This DOUBLES the blast radius
      — the bug is not confined to the (rarer) scheduled-flip path; it is on the
      everyday "operator clicks Delete" path too. The cascade fires (the entity
      disappears from default views immediately), which makes the operator believe
      the delete worked; the storage-reclamation half silently never happens.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-004
  hypothesis: |-
    When a large backlog of entities matures in the same window (e.g. 5,000
    entities with status_switch_time all elapsing within one hour), each tick
    processes a bounded batch so the job completes inside its 9-minute ShedLock
    window and the next tick is not skipped.
  derivation: |-
    Negative-space (a reasonable operator expectation that a scheduled reaper is
    burst-safe) + the getPojosForStatusSwitch query shape + the 9-minute lock
    window vs 10-minute cadence.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      getPojosForStatusSwitch returns ALL eligible pojos with NO LIMIT and the job
      collectList()s the entire set into one transaction
      (ReactiveDataEntityRepositoryImpl.md:concepts scheduled-batch-read +
      DataEntityStatusSwitchJob.java:26-30, source_read_for_validation — no .take(N),
      no chunking). Statically, a 5K-entity backlog × the 3-7-write soft-delete
      cascade per entity runs as a single bulk flip. Whether that EXCEEDS the
      9-minute lockAtMostFor window (releasing the lock and letting the next tick
      acquire / skip, producing phantom-double-tick latency) depends on real DB
      latency, cascade fan-out, and machine — it cannot be settled by reading. The
      no-cap STRUCTURE is confirmed; the timing OUTCOME requires running it.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: performance.known_performance_gaps.[2]
        cite: "ReactiveDataEntityRepositoryImpl.java:256-262 (no LIMIT) + DataEntityStatusSwitchJob.java:21-30 (no chunking)"
        note: "the sidecar flags 'potentially exceeding the 9-minute lock window' as MEDIUM but does not measure it"
      - sidecar: source_read_for_validation
        section: DataEntityStatusSwitchJob.run()
        cite: "odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/service/job/DataEntityStatusSwitchJob.java:26-30"
        note: "collectList() on the full unbounded result — confirms no per-tick cap"
    operator_visible_failure: |-
      If a tick exceeds 9 minutes: the ShedLock releases before commit, the next
      10-minute tick may acquire mid-commit (undefined cross-instance state in a
      multi-replica deployment) or skip; auto-flip latency for the tail of a large
      backlog degrades unpredictably; and combined with H-002, the burst produces
      a wave of DELETED-forever rows. Severity is MEDIUM (latency + multi-instance
      race), not HIGH, because it requires a large synchronized backlog.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: P-390
    routes_to_finding: caveat-candidate

- id: H-005
  hypothesis: |-
    When an operator deletes a Data Entity Group with `propagate=true`, every
    member entity is also flipped to DELETED (the group delete cascades to its
    children).
  derivation: |-
    Endpoint shape (the `propagate` body flag) + updateStatus.md implicit ADR on
    DEG propagation.
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |-
      propagate=true IS honoured when the target is a DATA_ENTITY_GROUP:
      DataEntityServiceImpl.updateStatus fetches getDEGEntitiesOddrns(id) and
      applies the status to each member plus the parent (updateStatus.md:
      implicit_adrs + concepts.invariants). BUT (a) propagation is SINGLE-HOP —
      getDEGEntitiesOddrns is non-recursive, so a DEG-of-DEGs propagates only to
      immediate children, not transitively (updateStatus.md:
      bugs_limitations_corner_cases.[6]); and (b) propagate=true on a NON-group
      entity is SILENTLY IGNORED (no error, no signal). The "cascade" works at one
      level for groups only.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: implicit_adrs.[5] + bugs_limitations_corner_cases.[6]
        cite: "DataEntityServiceImpl.java:468-476 (propagation branch) + :470 (getDEGEntitiesOddrns non-recursive) + :680-684 (needToPropagateStatus requires DATA_ENTITY_GROUP)"
        note: "honoured for groups, single-hop only, silently ignored for non-groups"
    operator_visible_failure: |-
      An operator deleting a nested group structure (DEG containing sub-DEGs)
      expecting the whole tree to retire gets only the top-level members — the
      grandchildren keep their prior status. An operator setting propagate=true on
      a plain dataset sees no effect and no warning that the flag did nothing.
      Both are silent semantic gaps (no UI / API signal). Severity MEDIUM.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-006
  hypothesis: |-
    The auto-transition behaviour is restricted to DRAFT and DEPRECATED — those
    are the only statuses for which a `status_switch_time` is meaningful and
    accepted.
  derivation: |-
    Response/endpoint shape (the isSwitchable flag on the status enum) + the
    validation guard requiring switch-time for switchable statuses.
  seed_source: view-mode
  validation:
    verdict: confirmed
    actual_behavior: |-
      DataEntityStatusDto encodes DRAFT(2, true) and DEPRECATED(4, true) as
      isSwitchable; STABLE/UNASSIGNED/DELETED are isSwitchable=false
      (updateStatus.md:implicit_adrs.[2]). DataEntityServiceImpl rejects a
      switchable status submitted WITHOUT a status_switch_time
      (BadUserRequestException → 400). The auto-flip semantics are baked into the
      enum structure exactly as the hypothesis predicts.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: implicit_adrs.[2] + concepts.invariants
        cite: "DataEntityStatusDto.java:13-16 (isSwitchable) + DataEntityServiceImpl.java:462-465 (the guard)"
        note: "only DRAFT/DEPRECATED are switchable; the guard enforces switch-time presence"
    confidence: HIGH
    routes_to_finding: none

- id: H-007
  hypothesis: |-
    Disabling housekeeping (or running with the shipped default) gives the
    operator the retention behaviour the docs describe — i.e. with housekeeping ON
    (the shipped default), DELETED entities ARE eventually purged.
  derivation: |-
    Cross-pillar promise (this feature FEEDS the Housekeeping TTL job F-010) +
    HousekeepingTTLProperties doc claim that the subsystem is on-by-default.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      Even with housekeeping fully enabled and correctly configured (the shipped
      application.yml default housekeeping.enabled=true,
      data_entity_delete_days=30), the DataEntityHousekeepingJob runs every 15
      minutes, queries STATUS_UPDATED_AT <= cutoff, and matches ZERO of this
      feature's entities because their status_updated_at is NULL (H-002 root
      cause). The housekeeping subsystem is healthy and firing; the data-entity
      purge step is a no-op against this feature's output. The cross-pillar
      contract (F-044 produces DELETED rows that F-010 reaps) is structurally
      broken at the data layer — F-010 receives nothing to reap because the join
      key was never written.
    evidence:
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: coupling + concepts
        cite: "HousekeepingJobManager.java:23-35 (DataEntityHousekeepingJob discovered + run every 15min) + coupling to DataEntityStatusSwitchJob"
        note: "the reaper runs fine; it just never matches NULL-timestamp rows"
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: dependencies_semantic.requires-feature.[2]
        cite: "DataEntityHousekeepingJob.java:71-80"
        note: "consumes data_entity_delete_days; predicate depends on STATUS_UPDATED_AT being maintained"
    operator_visible_failure: |-
      An operator who reads "housekeeping is on by default, retention is 30 days,"
      verifies housekeeping.enabled=true, and trusts that storage is bounded, is
      wrong: the data-entity table grows without bound regardless of the
      housekeeping setting. Tuning data_entity_delete_days has no observable effect
      — an operator lowering it to reclaim storage faster sees nothing change. The
      knob is inert. Severity HIGH (same data-bloat consequence as H-002, surfaced
      from the cross-pillar contract angle).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-008
  hypothesis: |-
    When an operator RESTORES a soft-deleted entity (DELETED → STABLE), the
    status_updated_at clock resets cleanly so that, if later re-deleted, the 30-day
    window starts fresh from the new deletion.
  derivation: |-
    Negative-space (restore is an explicitly supported transition per the live doc
    and updateStatus.md; an operator expects the lifecycle clock to behave
    consistently across restore).
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The restore path (DELETED → STABLE/DRAFT/DEPRECATED/UNASSIGNED) routes
      through the SAME applyStatus mapper (per updateStatus.md:understanding —
      restore-on-undelete is handled in changeStatusForDataEntities, which calls
      applyStatus). The applyStatus ordering bug means status_updated_at is NEVER
      written on restore either. So: an entity restored from DELETED keeps whatever
      status_updated_at it had (NULL, from the original broken delete). There is no
      clean clock at all — the column is uniformly NULL across the entire lifecycle.
      This is a NEW facet not separately enumerated in the F-044 drift_class_summary
      (restore_from_deleted_also_leaves_status_updated_at_null).
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: understanding + tests_coverage_semantic.uncovered_behaviours
        cite: "DataEntityInternalStateServiceImpl.java:73-98 (restore branch routes through applyStatus); restore path is explicitly UNCOVERED by tests"
        note: "restore is a status transition → inherits the same mapper bug"
      - sidecar: source_read_for_validation
        section: applyStatus
        cite: "DataEntityMapperImpl.java:247-251"
        note: "the guard is unconditionally false for ANY transition, restore included"
    operator_visible_failure: |-
      Because status_updated_at is uniformly NULL, the column carries NO usable
      lifecycle timestamp for any entity touched by this feature — not just for
      deletes. Any future feature that reasons about "when did this entity's status
      last change?" (audit, staleness, SLA) reads NULL. The restore case makes
      clear the bug is not "deletes don't get reaped" but "the status-change
      timestamp is dead platform-wide." Severity MEDIUM (no immediate data-loss on
      restore itself, but a load-bearing column is silently always-NULL).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

