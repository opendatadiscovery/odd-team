observed_vs_expected:
  facets:
  - facet: 7-permission grid split across three controllers — operator-unobvious
    observed: |-
      Live docs at `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions`
      enumerate seven `QUERY_EXAMPLE_*` permissions:
      QUERY_EXAMPLE_CREATE / _UPDATE / _DELETE / _DATASET_CREATE /
      _DATASET_DELETE / _TERM_CREATE / _TERM_DELETE. The first three are
      wired on this controller (SecurityConstants.java:112-113, 312-317).
      The next two (DATASET link CRUD) are wired on DataEntityController
      (SecurityConstants.java:318-324). The last two (TERM link CRUD) are
      wired on TermController (SecurityConstants.java:187-193). The split
      is consistent with the "links live with the relationship owner"
      pattern (data-entity-side links on DataEntityController, term-side
      links on TermController), but operators configuring Query Example
      permissions in one place will miss four of seven gates.
    expected: |-
      Either (a) consolidate the 7-permission grid onto THIS controller
      (move the link permissions out of DataEntityController +
      TermController) for surface coherence — risky because it changes
      the URL paths; OR (b) document the split explicitly on the live
      query-examples page ("Link-CRUD permissions live on the related
      entity's controller; configuring QueryExample permissions requires
      checking three SecurityConstants blocks").
    drift_class: query_example_partial_rbac_grid_split_across_three_controllers
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      understanding + SecurityConstants.java:112-113, 187-193, 312-317,
      318-324 + WebFetch permissions doc 2026-05-20 status 200.
      Severity LOW (architecturally consistent; operator-facing
      doc-gap).
  - facet: ten of thirteen endpoints have NO SecurityRule (read-collaborative posture)
    observed: |-
      Only 3 of 13 endpoints on this controller have SecurityRule entries
      in SecurityConstants.SECURITY_RULES:
      (1) `POST /api/queryexample` → QUERY_EXAMPLE_CREATE
          (SecurityConstants.java:112-113)
      (2) `PUT /api/queryexample/{example_id}` → QUERY_EXAMPLE_UPDATE
          (SecurityConstants.java:312-314)
      (3) `DELETE /api/queryexample/{example_id}` → QUERY_EXAMPLE_DELETE
          (SecurityConstants.java:315-317)
      The remaining 10 endpoints (5 reads + 4 search-session
      reads/mutations + 1 list) fall through to AuthorizationCustomizer's
      catch-all `pathMatchers("/**").authenticated()`. Under
      auth.type=DISABLED, all 13 endpoints are anonymous; under all
      other modes, ANY authenticated user can read every query example
      across every namespace + every owner.
    expected: |-
      Aligned with platform-wide read-collaborative posture
      (system-mission.md:267); the missing 10 SecurityRules are
      intentional. Recommend a doc page on the Query Examples surface
      noting "Read endpoints + search-session endpoints are visible to
      every authenticated user; Query Examples may contain SQL
      referencing internal table names — low-but-non-zero information
      disclosure surface".
    drift_class: ten_of_thirteen_endpoints_no_security_rule_authenticated_only
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      security.authorization_assertions + SecurityConstants.java
      Grep-confirmed.
      Severity LOW (intentional; UX-side info-disclosure surface).
  - facet: F-004 XSS class — 4th surface (Markdown rendered via MDEditor.Markdown)
    observed: |-
      Query body + Markdown `definition` are stored verbatim (`text NOT
      NULL` per V0_0_84__create_query_example.sql:5 — no length cap, no
      allowlist) AND rendered through `@uiw/react-md-editor`'s
      `MDEditor.Markdown` in TWO UI sites: (a)
      QueryExampleDetailsOverview.tsx:25 (for both `definition` and
      `query`); (b) QueryExamplesListItem.tsx:45-52 (for both in the
      catalog table). This places this surface as the 4TH XSS-class
      member of the F-004 family (peer to entity description + term
      definition + dataset-field description). The UI defence-in-depth
      (probe P-009 — React attribute filtering + Chromium HTML-parser
      policy) measured against the entity description applies the same
      way to this surface; partial-mitigation envelope unchanged
      (SVG-onload + CSS-expression + href-javascript vectors remain
