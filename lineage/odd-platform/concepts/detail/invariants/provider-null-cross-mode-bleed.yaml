name: LOGIN_FORM/LDAP provider=null cross-mode bleed
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-19K — STRENGTHENED TO
  SQL-LAYER GROUND TRUTH IN BATCH N (2026-05-19N); FURTHER STRENGTHENED
  IN BATCH R (2026-05-20R) WITH A READ-SIDE MIRROR AT THE ACTIVITY-FEED
  REPOSITORY; STRENGTHENED BATCH X (2026-05-20X) WITH THE LOGIN_FORM CONFIG-CLASS
  LAYER ANCHOR** — a security boundary failure during auth-mode migration
  scenarios, originally surfaced by primary-source examination of
  `AuthIdentityProviderImpl.java:29-33`. The line `if (authentication
  instanceof OAuth2AuthenticationToken oauthToken) { return new
  UserDto(name, registrationId); } else { return new UserDto(name,
  null); }` collapses ALL non-OAuth2 auth flows into the null-provider
  bucket: LOGIN_FORM (which wraps UsernamePasswordAuthenticationToken
  per LoginFormSecurityConfiguration.java:39-66 with provider=null), LDAP
  (ProviderManager wraps LdapAuthenticationProvider per
  LDAPSecurityConfiguration.java:82 with provider=null), and S2S
  (S2sAuthenticationFilter.java:38 with provider=null) — all three produce
  `UserDto(username, null)`.

  **BATCH X NEW VERTEX — LoginFormSecurityConfiguration config-class layer**:
  the cross-mode bleed mechanism is now PRIMARY-SOURCE PINNED at the
  AUTH-CONFIGURATION layer of the LOGIN_FORM corner of the quartet. The
  LoginFormSecurityConfiguration config-class sidecar (batch X) cites:
    - LoginFormSecurityConfiguration.java:1-104 — no provider tag set on the
      SecurityContext anywhere in the file. The LOGIN_FORM authentication
      flow produces `UsernamePasswordAuthenticationToken` which has no
      `getAuthorizedClientRegistrationId()` method (that exists only on
      `OAuth2AuthenticationToken`); AuthIdentityProviderImpl's else branch
      at line 32 fires, returning provider=null.
    - The MapReactiveUserDetailsService user store at line 85 contains
      `User` instances with username + password + authorities, but no
      provider field. The user identity that propagates downstream carries
      no provider distinction.
    - The bleed is INVISIBLE at the LOGIN_FORM layer (the config-class
      sidecar surfaces this as the load-bearing batch X finding) — only
      the repository node (ReactiveUserOwnerMappingRepositoryImpl) and the
      activity-feed read path (ReactiveActivityRepositoryImpl) make the
      bleed observable.

  **BATCH N PRIMARY-SOURCE UPGRADE — SQL-LAYER CONFIRMATION**: the
  downstream USER_OWNER_MAPPING lookup is now SQL-LAYER GROUND TRUTH at
  `ReactiveUserOwnerMappingRepositoryImpl.java:116-127`. The
  `getConditions(oidcUsername, provider)` private helper builds the
  exact WHERE clause:
    `USER_OWNER_MAPPING.OIDC_USERNAME.eq(oidcUsername)`
    `AND USER_OWNER_MAPPING.DELETED_AT.isNull()`
    `AND (StringUtils.isNotEmpty(provider) ? PROVIDER.eq(provider)
                                            : PROVIDER.isNull())`
  Line 121-125 IS the branch — the source of the bleed at the SQL primary
  source. **The branch fires the IS NULL predicate for BOTH null AND
  empty-string provider** — an explicit-empty-string provider sent through
  `POST /api/owners/associations/manual` would land in the same bucket as
  a true-null provider.

  **BATCH R EXTENSION — READ-SIDE MIRROR AT ACTIVITY-FEED REPOSITORY**:
  `ReactiveActivityRepositoryImpl.java:157-158, 178-179, 199-200,
  221-222` carries the EXACT SAME provider-null-cross-mode-bleed shape
  on the READ side — every one of the FOUR read paths
  (findAllActivities / findMyActivities / findDependentActivities /
  findDataEntityActivities) issues `.leftJoin(USER_OWNER_MAPPING).on(
  USER_OWNER_MAPPING.OIDC_USERNAME.eq(ACTIVITY.CREATED_BY).and(
  USER_OWNER_MAPPING.DELETED_AT.isNull()))`. **The JOIN ON predicate
  omits PROVIDER** — joining purely by OIDC username. A LOGIN_FORM
  'alice' and an LDAP 'alice' (provider=null in both cases per
  AuthIdentityProviderImpl) resolve to the SAME OwnerPojo on every read
  path. The PRIMARY SOURCE for the read-side bleed; combined with the
  write-side primary at ActivityServiceImpl.java:47-49 (single-username
  INSERT with NO provider qualifier), the activity feed's actor
  resolution becomes ambiguous when LOGIN_FORM and LDAP users share
  usernames. Forensic incident-response over an audit feed is misled —
  the auditor cannot distinguish 'LOGIN_FORM alice did X' from
  'LDAP alice did X' from the surfaced data alone.

  Net effect: a LOGIN_FORM user `alice` and an LDAP user `alice` BOTH
  produce the same lookup key (alice, null) and BOTH resolve to the SAME
  OwnerPojo via the same active user_owner_mapping row. **The codepath
  has NO mode-check, NO warning log, NO fail-fast.** Migration scenarios
  with overlapping usernames silently grant the second-mode user the
  first-mode user's owner-link.

  The maintainer's design intent was per-IDP OAuth2 namespace via
  `getAuthorizedClientRegistrationId()`; LOGIN_FORM and LDAP are each
  "local" to the deployment and the maintainer chose not to distinguish
  them — accepting the migration-time bleed. **The decision is undocumented.**
  The live `/configuration-and-deployment/enable-security/authentication`
  doc page enumerates the four modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP)
  but is silent on (a) the (username, provider) compound key shape; (b) the
  migration behaviour for overlapping usernames across modes. Three
  scenarios trigger the bleed in real deployments: (a) operator migrates
  from LOGIN_FORM to LDAP, retains user names, expects old user-owner
  mappings to invalidate — they don't, the new LDAP user inherits the old
  LOGIN_FORM user's Owner; (b) operator runs LOGIN_FORM and LDAP
  concurrently (a valid composition), naming collisions silently bleed; (c)
  operator runs LOGIN_FORM and S2S, S2S username 'ADMIN' (uppercase)
  collides with a LOGIN_FORM user named 'ADMIN' (the companion S2S literal
  collision invariant).

  **Batch X — the architectural triangle now extends to FIVE vertices**:
    Vertex 1 — Principal layer (AuthIdentityProviderImpl.java:29-33,
                batch K) — the else-branch that produces provider=null
    Vertex 2 — Persistence-WRITE layer
                (ReactiveUserOwnerMappingRepositoryImpl.java:116-127,
                batch N) — the SQL WHERE clause that resolves
                provider=null to the bleed bucket
    Vertex 3 — Schema layer (V0_0_55__add_policies_and_roles.sql:1-2 +
                V0_0_89__update_user_owner.sql:1-15) — the schema
                permission for provider to be nullable
    Vertex 4 — Persistence-READ-CONSUMER layer
                (ReactiveActivityRepositoryImpl.java:157/178/199/221,
                batch R) — the read-side mirror that joins activity
                rows to OwnerPojo by OIDC_USERNAME only. EVERY downstream
                read of the audit feed inherits the bleed.
    Vertex 5 — Auth-configuration layer (LoginFormSecurityConfiguration
                config-class, batch X NEW) — the LOGIN_FORM-corner
                anchor that confirms NO provider tag is set on the
                SecurityContext anywhere in the LOGIN_FORM auth flow.
                Closes the picture: the bleed is rooted at LOGIN_FORM's
                own design (UsernamePasswordAuthenticationToken carries
                no provider) and is observable only downstream at vertices
                2 + 4. The PRINCIPAL layer (vertex 1) is the
                BRIDGE BETWEEN VERTEX 5 (auth config) AND VERTEX 2 (SQL
                write) AND VERTEX 4 (SQL read).
