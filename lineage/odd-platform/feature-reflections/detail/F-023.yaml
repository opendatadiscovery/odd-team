  expected_outcome: "When a platform has thousands of data sources of one type (5K Postgres instances), opening that type's level-2 list returns a usable, bounded response — the user is not handed all 5K rows in one payload, each with per-row reflection cost."
  probe_shape: |
    Local docker-compose: ODD platform + Postgres. Seed 5000 Postgres datasources
    (distinct ODDRNs sharing the postgresql prefix), each with a small entity count.
    k6/wrk: GET /api/directory/datasources?prefix=postgresql; record p50/p95 latency,
    response byte size, and server CPU. Separately load /directory level-2 in a headless
    browser (Playwright) and record time-to-interactive + DOM node count. PASS if the
    response is paginated or bounded and TTI < 2s; FAIL (confirms unbounded shape hurts)
    if latency/DOM grows linearly past a usable threshold. Note: confirms the MAGNITUDE
    of the statically-known no-pagination facet (bugs_limitations_corner_cases[6]).

