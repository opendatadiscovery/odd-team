- id: H-011
  hypothesis: "When a caller passes a data_entity_id that does not exist at all, GET /api/dataentities/{id}/alerts returns 404 (not an empty 200 that hides the bad id)."
  derivation: "Endpoint-shape robustness + negative-space: an integration author needs to distinguish 'entity has no alerts' from 'entity does not exist'; a senior PO expects a missing entity to 404, not to masquerade as an empty result."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      A fully-absent data_entity_id returns 404. The service gates the read on checkDataEntityExistence
      (AlertServiceImpl.java:140, 327-335), which emits NotFoundException("Data Entity", dataEntityId) when the
      existence check fails (AlertServiceImpl.java:330), surfacing as HTTP 404 via the global handler. A
      soft-deleted id still returns 200 (existsIncludingSoftDeleted admits it — H-005); only a fully-purged /
      never-existed id 404s. So "entity has no alerts" (200 with empty list) is correctly distinguished from "entity
      does not exist" (404), with the documented soft-delete exception.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityAlerts.md
        section: concepts.operations + concepts.entities (NotFoundException)
        cite: "AlertServiceImpl.java:140, 327-335, 330"
        note: "checkDataEntityExistence → NotFoundException → 404 on absent id; 200 empty list on existing-but-alertless"
    confidence: HIGH
    routes_to_finding: none

- id: H-012
  hypothesis: "When an entity HAS alerts, GET /api/dataentities/{id}/alerts returns them as a well-formed paginated AlertList (the core read promise works end to end on the happy path)."
  derivation: "Pillar primary user action ('view an entity's alert history') — the baseline confirm that the feature delivers its core read when correctly called."
  seed_source: pillar
  validation:
    verdict: confirmed
    actual_behavior: |
      The happy path is intact. DataEntityController.getDataEntityAlerts delegates to
      AlertServiceImpl.getDataEntityAlerts (lines 138-143), which composes checkDataEntityExistence.then(
      alertRepository.getAlertsByDataEntityId(id, page, size)).map(alertMapper::mapAlerts). The repository issues
      SELECT ALERT.* FROM ALERT JOIN DATA_ENTITY ON DATA_ENTITY.ODDRN = ALERT.DATA_ENTITY_ODDRN WHERE
      DATA_ENTITY.ID = :id, paginated via pageifyResult (window-fn COUNT + ROW_NUMBER), and the result maps to an
      AlertList with 200 OK. The chain mechanically returns the entity's alert history (all statuses, with chunks
      and status-updated-by owner identity). (The read is cross-owner — H-001 — but for the HAPPY-PATH read of an
      entity the caller is entitled to, the chain works.)
    evidence:
