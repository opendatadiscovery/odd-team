behaviour: '`list()` admin-vs-non-admin branching invariants. (1) Admin user → repository-paged
  result (line 58 branch). (2) Non-admin → in-memory filter on role-attached policies
  (lines 57, 109-116), IGNORING `page`/`size` request params; `hasNext=false` regardless
  of result size. (3) User with empty roles list: `roles.stream().noneMatch(...)`
  returns TRUE vacuously, the in-memory branch is taken, `getRolePolicies` returns
  empty Page. Critical invariant: empty-roles users are NOT silently routed to the
  admin repository path. (4) Query string filters case-insensitively. These four invariants
  are the role-based pagination contract.'
