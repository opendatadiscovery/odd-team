behaviour: |-
  **The most operationally load-bearing behaviour of this repository — the `SELECT … FOR UPDATE` row lock acquisition in `getIdByOddrnForUpdate` (lines 94-101) — has zero test coverage.** The lock is held until the surrounding `@ReactiveTransactional` commits or rolls back, serialising ingestion against concurrent UI deletes of the same datasource AND against concurrent collector re-registrations of the same datasource. Without this lock, the `IngestionService`'s downstream `persistDataEntities` flow (`IngestionServiceImpl.java:65-74`) could be racing the operator's delete or the collector's UPSERT for the same data_source_id. The current `DataSourceRepositoryImplTest` (260+ lines) covers happy-path read/write/delete round-trips but does NOT pin the row-lock semantic. A regression that accidentally removed `.forUpdate()` from line 98 would compile, pass every existing test, AND silently introduce a race window in the ingestion pipeline that only manifests under concurrent load against the same datasource — exactly the kind of bug that ships and surfaces months later in production when a customer ingestion volume scales up.
test_files_existing:
