  - kind: dom-probe
    capture:
      - selector: "header, [class*='Toolbar'], nav"
        capture_as: toolbar_present
      - js: "document.location.pathname"
        capture_as: final_pathname
      - js: "(document.querySelector('div.App > div:last-child')?.innerText || '').trim()"
        capture_as: main_content_text
      - js: "[...document.querySelectorAll('body *')].some(el => /page not found|404/i.test(el.textContent || ''))"
        capture_as: has_404_affordance
assert:
  - "toolbar_present != null  # chrome renders above the null outlet (App.tsx:56)"
  - "final_pathname == '/this-route-does-not-exist-p245'  # no redirect issued"
  - "main_content_text == ''  # null outlet — blank main area below the toolbar"
  - "has_404_affordance == false  # characterization: asserting the GAP (no 404 UX)"
cleanup:
