behaviour: |-
  **HIGH — UI route param `searchId` is a Category F (LSN-020 family)
  DRIFT_INPUT_NAME_VS_IMPLEMENTATION drift.** `searchRoutes.ts:4`
  declares `SEARCH_ID_PARAM = ':searchId'`. The name promises "the identifier
  of a search" — a naive reading suggests a saved-search id, a user-meaningful
  query id, or a saved-filter token. The URL form `/search/{searchId}`
  reinforces this — it looks like the canonical "view search id X" RESTful URL.

  **The implementation translates this as a SERVER-SIDE SESSION ROW UUID** —
  a transient `search_facets` row that was minted by the most recent
  `POST /api/search` and that has no user binding, no TTL guarantee at this
  layer, no "saved search" semantics. The same row gets MUTATED on every
  facet change (`PUT /api/search/{searchId}/facets`).

  This drift produces **three operator-visible consequences distinct from
  the TEST-GAP-252 security angle (UUID-as-bearer-token, session hijack)**:

  (a) **Bookmark fragility.** A user bookmarks `/search/{uuid}`. The
  server-side `search_facets` row may be cleaned up at some unknown TTL
  (probe P-168 emitted to resolve). The bookmark 404s; the user sees an
  empty Catalog (or a toast) and doesn't understand why their "saved
  search" disappeared.

  (b) **Cross-user sharing exposes whatever state the session has at
  fetch time.** User A shares `/search/{uuid}` with User B; between A's
  last `updateSearchFacets` and B's arrival, A keeps clicking
  (each click mutates the SAME row via PUT /facets); the URL B opens
  30 seconds later shows STATE B never expected. The URL doesn't behave
  like a saved-search id; it behaves like "pointer to whatever this row
  currently holds".

  (c) **Tab navigation drops the session.** Clicking the Catalog top-nav
  tab (`ToolbarTabs.tsx:38 → searchPath()` no arg → `/search`) drops the
  UUID. The user expected their "saved search" would be there when they
  came back. It isn't — `Search.tsx:37-42` creates a fresh empty session
  via `useCreateSearch({query:'', pageSize:30, filters:{}})`. Their
  previous filter state is lost.

  The live doc page `https://docs.opendatadiscovery.org/features/data-discovery/search`
  (WebFetched 2026-05-26, status 200) does NOT mention the
  `/search/{searchId}` URL form at all — no statement that the URL bar
  carries a session UUID, no statement that the UUID is shareable, no
  statement that the UUID represents a persisted server-side row, no
  warning that tab-click drops the session. Operators have NO way to
  learn this except by reading source or trial-and-error.

  **Distinct from TEST-GAP-252**: TEST-GAP-252 is the SECURITY angle
  (no per-user binding → bearer-token UUID enumeration); this gap is the
  Category F UX/operator-surprise angle (NAME promises saved-search,
  IMPLEMENTATION delivers session UUID). Both gaps are operator-relevant
  and need distinct regression pins. TEST-GAP-1007 is the LSN-020
  family's third UI-tier instance after the LSN-020 backend
  `userIds`/`OWNER_ID` finding and the activity-route inheritance.

  **Fix at the documentation layer + at the type layer**: either rename
  the param to `searchSessionId` across all three modules
  (`searchRoutes.ts`, the URL form `/search/{sessionId}`,
  `useSearchRouteParams`) — high-churn rename — OR add a JSDoc on the
  `SearchRouteParams` interface documenting "this is a server-side
  session UUID, not a saved-search id"; PLUS a doc-page sentence
  explaining the URL form and its lifecycle.
