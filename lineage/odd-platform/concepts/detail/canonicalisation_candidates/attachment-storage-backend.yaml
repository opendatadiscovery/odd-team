proposed_canonical: Attachment Storage Backend
rationale: 'Operationally distinct sub-concept of Attachment with its own ADR (LOCAL
  is matchIfMissing default), retrospectives (LSN-001, LSN-002), and operator-config
  surface. Method-level uploadFileChunk sidecar adds critical finding: chunk-staging
  path `/tmp/odd/chunks` is hardcoded constant (FileUtils.CHUNK_BASE_PATH), NOT switched
  by attachment.storage — REMOTE-storage deployments still suffer per-instance multi-replica
  failure. Useful as a navigation anchor for storage-tier discussions.'
contributing_concepts:
- attachment storage backend (config-prefix)
- S3-compatible bucket (config-prefix)
- local filesystem path (config-prefix)
- chunk staging path /tmp/odd/chunks (uploadFileChunk — storage-mode-independent)
suggested_add_to_docs: false
