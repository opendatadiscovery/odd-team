behaviour: |-
  **MEDIUM — OpenAPI spec declares 301 Moved Permanently for `GET /api/messages/{message_id}/url` but the controller emits `HttpStatus.FOUND` (302). Three sources of truth disagree: code emits 302, spec declares 301, live api-reference doc page acknowledges 302 — OpenAPI-codegen clients are wrongly typed.**

  Verified at primary source:
  - `openapi.yaml:1788-1789` declares `'301': $ref './components.yaml/#/components/responses/MovedPermanently'`.
  - `DataCollaborationController.java:45` emits `ResponseEntity.status(FOUND)` where `FOUND` is `HttpStatus.FOUND` (302).
  - Live `https://docs.opendatadiscovery.org/developer-guides/api-reference/data-collaboration` (WebFetched 2026-05-25 status 200) acknowledges: 'The OpenAPI spec declares `301 Moved Permanently` for this route; the platform actually serves `302 Found`. Operators should treat responses as 302.'

  **Operator-visible consequence**:
  - OpenAPI-codegen clients (TypeScript, Python, Java, etc.) generate response-type signatures based on the spec. A client expecting 301 may not register a handler for 302 → falls into a default-handler path that drops the redirect.
  - Browser-via-UI: modern browsers handle both 301 and 302 the same way for GET (follow redirect); no operator impact for the in-app UI use case.
  - Spec-conformance audits: the platform fails OpenAPI conformance.

  **Why MEDIUM**: harmless for the dominant UI use-case, but locks in the spec-vs-code drift indefinitely without a test. The live api-reference doc page acknowledging the drift is itself documentation debt — the spec should match the implementation OR the implementation should switch to 301.

  **Why pin the current behaviour (not fix immediately)**: the choice between 301 (cacheable) and 302 (non-cacheable) is meaningful. For Slack permalinks that may change (Slack workspace migration, channel rename, archived channel), 302 is the correct semantic. The fix is to update the SPEC, not the CODE. The test pins the current shipped behaviour so spec-update + test-update happen in lock-step.

  **Distinguishes**:
  - `concepts/detail/invariants/openapi-200-vs-201-status-code-drift.yaml` — sister drift family (different status pair).
  - TEST-GAP-971 (sister this batch) — Ingestion controller class-wide 200-vs-201 drift on 3 mutating handlers.
