- id: H-002
  hypothesis: |-
    When a user looks at the top-right user cluster, the name shown identifies who they actually are —
    so that an operator glancing at a screen (or a screenshot) can tell whether the session is
    authenticated and as whom.
  derivation: |-
    Response/identity shape — owner?.name ?? identity?.username renders the principal; pillar P-09
    "pick a UI auth mode" implies the chrome reflects the authenticated principal.
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      Under auth.type=DISABLED (the bundled default per application.yml:34) the backend
      IdentityController.whoami returns dummyOwner with username='admin' and owner=null
      (IdentityController.java:30-33); the nullish-coalescing owner?.name ?? identity?.username
      (AppToolbar.tsx:74) falls through to the literal string 'admin'. DisabledAuthSecurityConfiguration
      permits /api/identity/whoami anonymously (.anyExchange().permitAll()), so EVERY anonymous network
      caller who reaches the SPA is rendered as 'admin' in the top-right corner. The toolbar surfaces no
      banner, no "auth disabled" indicator, no signal that the viewer is unauthenticated. This is the UI
      symptom of the REFACTOR-185 anonymous-reachability cluster.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar__ui-shell-widget__AppToolbar.md
        section: bugs_limitations_corner_cases + security.known_security_gaps
        cite: "AppToolbar.tsx:74 + IdentityController.java:30-33 + DisabledAuthSecurityConfiguration.java:11-19"
        note: "owner?.name ?? identity?.username → 'admin' under DISABLED; permitAll on whoami; no chrome-level warning."
    operator_visible_failure: |-
      Failure modes, ordered by blast radius: (1) a DISABLED-mode deployment exposed to a network — any
      anonymous caller opening the SPA sees themselves rendered as 'admin' with every UI affordance
      available (and, per the REFACTOR-185 cluster, every backend permitAll endpoint reachable); there is
      no chrome-level cue that the auth wall is off. (2) Operators auditing screenshots or a shared
      terminal cannot distinguish an authenticated admin from an anonymous viewer — both read 'admin'.
      (3) The depersonalised label trains every user to think of themselves as 'admin', eroding any mental
      model of identity. NOTE: the cross-link is REFACTOR-185; the chrome is the amplifier, not the root
      cause (the dummyOwner originates at IdentityController) — but the toolbar is where the operator SEES it.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_ref: ""

- id: H-003
  hypothesis: |-
    When a user clicks the Logout item in the user menu, they are logged out (their session is cleared
    and they land on a sensible post-logout page).
  derivation: |-
    UI-label — the menu item is labelled "Logout"; the senior-PO expectation that a labelled primary
    action does what it says, consistently across the platform's auth modes.
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |-
      Logout is a hard-coded full-page redirect: window.location.href = '/logout' (AppToolbar.tsx:35-37).
      The /logout handler is registered ONLY by a Spring-Security formLogin chain — LoginFormSecurityConfiguration.java:59
      (.logout(Customizer.withDefaults())) and LDAPSecurityConfiguration.java:146; OAUTH2 uses a custom
      chain. Under LOGIN_FORM / LDAP / OAUTH2 the click works (clears session, redirects). Under
      auth.type=DISABLED, DisabledAuthSecurityConfiguration has NO .logout(...) chain, so the GET /logout
      hits a 404. The Logout item is shown universally; it works in 3 of 4 modes and 404s in the bundled
      default mode. Partial: the promise holds for authenticated modes, fails for DISABLED.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar__ui-shell-widget__AppToolbar.md
        section: bugs_limitations_corner_cases + stress_findings.name_behavior_pairs (handleLogout)
        cite: "AppToolbar.tsx:35-37 + DisabledAuthSecurityConfiguration.java:11-19 + LoginFormSecurityConfiguration.java:59 + LDAPSecurityConfiguration.java:146"
        note: "hard-coded /logout; handler registered only under formLogin/LDAP/OAUTH2; absent under DISABLED → 404."
    operator_visible_failure: |-
      Under the bundled default deployment (auth.type=DISABLED) a user clicking Logout gets a 404 error
      page they must back out of; their "session" (there is none) is unchanged. Failure modes: (1) the
      user believes the platform is broken on a primary action shown in the chrome; (2) a security-conscious
      user on a shared machine clicks Logout expecting to end their session and is left on a 404 with the
      'admin' chrome still live behind it — a false sense of having logged out. UX-confusing; security-neutral
      in DISABLED (there was no session), but it actively misleads in the exact mode where the H-002 'admin'
      render most needs a working exit.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_ref: ""

- id: H-004
  hypothesis: |-
    When a user with no administrative permissions looks at the toolbar, the Management tab (the entry
    into Owner / Role / Policy / Tag / Lookup-Table / Identity-Provider administration) is not presented
    to them as an available navigation affordance.
  derivation: |-
    Pillar P-08 exposes admin surfaces; the operator-conventional default for a separation-of-duties
    surface is to hide admin entry points from non-admin users (the F-041 facet expected-clause).
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The Management tab is rendered unconditionally. ToolbarTabs.tsx:34-82 has no permission predicate,
      no role discrimination, no WithPermissionsProvider wrapping; AppToolbar reads only identity + owner
      from Redux and never consults permissions. Every authenticated user — and, under DISABLED, every
      anonymous caller — sees the Management tab and can click into /management/*. The downstream
      /management/* page bodies are individually permission-gated (and per the ZH systemic finding the
      WithPermissionsProvider wrapper is itself non-blocking), but the TAB ENTRY POINT is not gated. The
      backend authorizes the actual administrative actions, so this is a discovery/reconnaissance leak, not
      a privilege escalation. Matches scanner finding F-041a (STATIC-INFERRED, ontology-confirmed).
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar_ToolbarTabs__ui-shell-widget__ToolbarTabs.md
        section: bugs_limitations_corner_cases + security.known_security_gaps + stress_findings.auth_gates
        cite: "ToolbarTabs.tsx:34-82 (no permission read) + App.tsx:56 (unconditional mount)"
        note: "no role/permission gate on any tab; READ_ONLY sees the same tabs as ADMIN; Grep usePermissions in the AppToolbar subtree = 0."
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar__ui-shell-widget__AppToolbar.md
        section: bugs_limitations_corner_cases + security.known_security_gaps
        cite: "AppToolbar.tsx:18-22 (reads identity/owner only, no permission selector)"
        note: "chrome reads no permission/role; cross-ref scanner finding F-041a."
    operator_visible_failure: |-
      On a deployment with strict separation-of-duties requirements, every authenticated user (regardless
      of role) sees the existence of an admin surface — the Management tab — and can navigate into it.
      Failure modes: (1) reconnaissance — a non-admin user learns the platform HAS Owner/Role/Policy
      administration and where it lives, which they would not learn if the tab were hidden; (2) under
      DISABLED-mode network exposure, an anonymous caller sees the Management tab too; (3) the UX is
      inconsistent with a permission-aware chrome — clicking Management as a read-only user lands them on a
      page where most actions 403 or no-op, with no upstream signal the affordance was inapplicable. NOT a
      privilege-escalation (the backend gates the mutations); the leak is the affordance + the existence
      disclosure. Whether to hide the tab or to accept the leak as a documented consequence is a maintainer call.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_ref: ""

