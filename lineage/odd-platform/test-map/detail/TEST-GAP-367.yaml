behaviour: 'AlertManager webhook `generatorURL` XSS / open-redirect — line 168 builds
  the URL via `UriComponentsBuilder.fromUri(externalAlert.getGeneratorURL())`; line
  185 embeds it in the alert chunk description as `String.format("Distribution Anomaly.
  URL: %s", queryUrl)`. The URI type does not block `javascript:` scheme or arbitrary
  host URLs. If the UI renders the description as a clickable link or innerHTML, this
  is a stored-XSS / open-redirect surface — and the AlertManager endpoint is unauthenticated
  (combined with TEST-GAP-365 spoof), so any caller can plant the payload. Cross-references
  the F-004 XSS finding (TEST-GAP-293) but on a different ingress surface. STRENGTHENED
  batch P — the AlertManagerController#postAlerts sidecar PRIMARY-SOURCE adds the
  controller-boundary half: ExternalAlert.java:13 declares `generatorURL` as type
  `URI`. The URI type validates wire-shape but does NOT constrain scheme. The controller
  at AlertManagerController.java:24 passes the payload verbatim to the service with
  NO scheme-allowlist validation. Combined with the unauthenticated receiver and
  REFACTOR-024 cross-owner read on `GET /api/alerts`, the attack chain is: (a) any
  caller plants `generatorURL=javascript:alert(1)` → (b) AlertServiceImpl.java:168-185
  builds the description String containing the payload verbatim → (c) every authenticated
  user sees the alert on the All tab → (d) UI render path may execute the script
  if it uses innerHTML or a-href without sanitisation. Cross-link to the existing
  dynamic-verification probe P-009 (XSS render probe).'
