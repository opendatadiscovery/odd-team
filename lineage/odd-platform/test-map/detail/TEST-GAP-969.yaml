behaviour: |-
  **HIGH — IngestionController's 5 handlers use TWO ENTIRELY DIFFERENT identity-resolution mechanisms; the asymmetry is silent, has no comment, and no test asserts the consequence: createDataSource reads collector identity from the WebSession (session-bridge from IngestionDataSourceFilter), while postDataEntityList / postDataSetStatsList / ingestMetrics identify the target via PAYLOAD ODDRNs (downstream identity validation).**

  Verified at primary source:
  - `createDataSource` (`IngestionController.java:47-73`) is the ONLY method that reads the WebSession (lines 50-58 — `exchange.getSession().flatMap(session -> session.getAttribute(SessionConstants.COLLECTOR_ID_SESSION_KEY))`).
  - Session attribute is WRITTEN by `IngestionDataSourceFilter.java:37-38` BEFORE this controller method runs.
  - The other 4 methods do NOT read the session.
  - `postDataEntityList` identifies the target datasource via the PAYLOAD field `dataSourceOddrn` (consumed downstream in `IngestionServiceImpl.java:68`).
  - `IngestionDataEntitiesFilter.java:43` (when toggle is enabled) reads `dataSourceOddrn` from the body for token validation.

  **The asymmetry has no comment** (verified by reading IngestionServiceImpl.java end-to-end and IngestionController.java end-to-end 2026-05-25 — no inline comment, no Javadoc, no ADR explanation).

  **Three concrete consequences the absence of testing preserves**:

  1. **Cross-collector authentication** (the sidecar's uncovered_behaviours.[3]): Collector A's token attempting to register a datasource that Collector B already owns — NO test asserts the cross-tenant authentication boundary. The session-based mechanism for `createDataSource` enforces 'the token IS the collector identity'; the payload-based mechanism for `postDataEntityList` enforces 'the token signs payloads for THIS datasource'. The boundary is enforceable but unenforced/untested.

  2. **Payload-vs-token cross-validation on POST /ingestion/entities**: when IngestionDataEntitiesFilter IS enabled, a valid collector-A token POSTing entities under data_source_oddrn belonging to collector B — no test asserts the rejection.

  3. **Failure-shape divergence**: `createDataSource` throws `IllegalStateException("Collector id is null")` (line 54) when session attribute is missing — propagates as **HTTP 500** via the default reactive error handler (NOT 401). `postDataEntityList` and siblings have no equivalent fail-loud check — they accept anonymous requests when the filter is unregistered. The operator-visible diagnostic across the 5 endpoints is INCONSISTENT.

  **Why HIGH**: this is the class-level posture asymmetry that the TEST-GAP-958 4-mode matrix doesn't fully cover. TEST-GAP-958 tests reachability; TEST-GAP-969 tests **identity correctness** — orthogonal concerns. A cross-tenant exploit (collector A POSTing entities for collector B's datasource) is reachable in the gap between 'reachable + unauthenticated' (TEST-GAP-958) and 'reachable but identity-correct' (this gap).

  **Distinguishes**:
  - TEST-GAP-958 (CRITICAL — class-level reachability matrix, this batch).
  - TEST-GAP-097 / 119 / 583 — existing S2S filter coupling regressions.
  - This entry is the **identity-resolution bifurcation** concern specifically; no prior TEST-GAP names the session-vs-payload asymmetry as a single class-level finding.
