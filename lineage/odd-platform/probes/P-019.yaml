realism_caveats: |
  - Race window is narrow. Probe-runner must execute both REST calls
    in genuine parallel; OS/JVM scheduling must let them interleave.
    Best-effort; if probe consistently passes (no race), report
    `probe-inconclusive` and re-run with `pg_sleep` injection inside
    one TX to widen the window.

  - `parallel:` runner directive may not be supported yet. If not,
    this probe is queued as CAPABILITY-PENDING; runner task includes
    "add parallel block support."

  - DISABLED auth — race is auth-mode-agnostic.

  - OpenAPI endpoint paths (PUT `/api/dataentities/{id}/ownerships/{ownershipId}`,
    POST `/api/dataentities/{id}/ownerships`) need spec verification.

  - The bug assertion encodes the EXACT bug shape (later.old_state ==
    earlier.new_state). If the bug manifests in a different shape
    (e.g. both TXs see the SAME pre-mutation oldState, neither sees
    the other's commit), the assertion fails informatively for human
    inspection.

  - OWNERSHIP_CREATED handler (Tx B's POST path) uses the same
    `getDataEntityOwnerships` mechanism as OWNERSHIP_UPDATED, so the
    race is symmetric across CREATE and UPDATE event types.
