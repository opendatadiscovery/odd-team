name: Recommended Panel Under DISABLED Auth — Code Hides, Docs Say Visible
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-01
- P-09
description: |-
  **NEW CANONICALISATION CANDIDATE, batch 2026-05-19J — direct factual code-vs-docs
  contradiction**. The live doc page
  `https://docs.opendatadiscovery.org/features/data-discovery/catalog-overview`
  (local clone at `documentation/docs/data-discovery/catalog-overview.md:43`)
  states: "The Recommended panel requires the signed-in user to be linked to an
  Owner; without the user-owner association in place, the Recommended panel is
  empty (and **on auth-disabled deployments the panel is visible but the
  per-user filtering does not apply**)". **The code does the opposite**:
  `Overview.tsx:25-27` defines
  `isShowOwnerAssociation = Boolean(appInfo?.authType && appInfo.authType !== 'DISABLED')`;
  `Overview.tsx:53-59` renders `<WithPermissionsProvider Component={OwnerAssociation}>`
  only when `isShowOwnerAssociation` is true. Under DISABLED-mode this is FALSE,
  so the entire Recommended panel (including Popular, My Objects, Upstream,
  Downstream) does NOT render. **The published behaviour is unreachable on a
  DISABLED deployment**: a user on the home page sees Search + Top tags + Domains
  + DataEntitiesUsageInfo + Directory + (no Recommended panel). **This is a
  direct factual contradiction between docs and code, file:line-anchored on
  both sides**. **Two resolution paths**: (a) **Update the doc** — remove the
  parenthetical "on auth-disabled deployments the panel is visible" claim;
  document that the panel is hidden under DISABLED (which is a sensible UX
  choice — the panel would have no user-owner association to drive personalisation
  under DISABLED, so hiding it is the cleaner UX). (b) **Update the code** —
  add a DISABLED-mode branch that renders the panel with the per-user filtering
  bypassed (e.g. show top-N global Popular only); this would honour the doc
  claim. **Recommended resolution**: docs are wrong; code is the cleaner UX;
  update the doc to say "the Recommended panel is hidden under DISABLED-mode
  deployments because user-owner association is the precondition".
contributing_concepts:
- popular-entities-ranking
- list-popular-data-entities
- owner-association-gate-ui-only-not-api
suggested_canonical_choice: |-
  Update the doc page `/features/data-discovery/catalog-overview` to remove the
  parenthetical "on auth-disabled deployments the panel is visible" claim and
  replace with: "Under DISABLED-mode deployments the Recommended panel is hidden
  on the home page; the underlying Popular API endpoint remains anonymously
  reachable for third-party integrations."
suggested_add_to_docs: true
rationale: |-
  This is a Cornerstone 1 finding (incorrect documentation). Operators reading
  the doc claim and then deploying with DISABLED auth would expect to see the
  Recommended panel and would file a bug report when it doesn't appear. The doc
  is actively misleading.

  The code-side decision (hide the panel under DISABLED) is the cleaner UX:
  there is no user-owner association to drive personalisation, so showing an
  empty panel would be worse. Update the doc to match.
evidence:
- 'PopularStrip.md:doc_drift_findings.[DISABLED-mode rendering mismatch — docs
  say Recommended panel IS visible under DISABLED, code hides it. Live doc
  (catalog-overview.md:43): "on auth-disabled deployments the panel is visible
  but the per-user filtering does not apply". Code (Overview.tsx:25-27, :53-59):
  isShowOwnerAssociation = Boolean(appInfo?.authType && appInfo.authType !==
  ''DISABLED'') — under DISABLED this is false, so the entire
  WithPermissionsProvider(...Component=OwnerAssociation) block does NOT render.
  The published behaviour is unreachable on a DISABLED deployment]'
- 'PopularStrip.md:concepts.invariants[rendering gate: auth.type != DISABLED]'
notes: |-
  Surface to maintainer for a one-line doc fix. The catalog-overview.md:43 line
  is the only place this claim appears; update it to match the implementation.
  Operators relying on the published claim would be misled on every DISABLED-mode
  deployment.
