behaviour: |-
  **Zero direct test coverage on FeatureController OR FeatureResolverImpl.
  The Feature-flag → UI mapping has no regression test.** GET
  /api/features/active is dispatched ONCE per app-mount from App.tsx:49;
  the response feeds every `WithFeature featureName={Feature.X}` wrapper
  in the SPA (Message.tsx:59 Open in Slack button,
  DataEntityDetailsHeader.tsx:132 CreateMessageForm visibility, etc.).
  The contract is:

  (a) When `datacollaboration.enabled=true` AND `notifications.enabled=true`
  → items = [DATA_COLLABORATION, ALERT_NOTIFICATIONS];
  (b) When BOTH flags are false (the bundled application.yml defaults at
  lines 173, 205) → items = [] (NOT null, NOT 404);
  (c) Asymmetric: each flag independently maps to one Feature enum value.

  No test pins this mapping. A refactor that swaps which @Value binds to
  which enum (e.g. `datacollaboration.enabled` accidentally bound to
  ALERT_NOTIFICATIONS) silently flips every WithFeature consumer's
  rendered output platform-wide. The blast radius is ALL UI users of
  optional features. The build would not catch it. Stock-deployment
  baseline (both flags false → items=[]) is the second highest-leverage
  case — a regression to `null` or `404` would silently break the
  appInfo.selectors.ts:9 `appInfo.activeFeatures || emptyArr` fallback
  in some edge.
