behaviour: |-
  Soft-delete bypass in `listByNames` — no test asserts that a soft-deleted tag (one with `deleted_at = now()`) is filtered out by `listByNames`. The `addSoftDeleteFilter` is wired in (inherited via the base), but the test corpus does not exercise it for this specific method. A regression flipping the soft-delete filter would either: (a) silently include soft-deleted tags in listByNames results (operators see "deleted" tags in tag-pickers) OR (b) miss the partial-index alignment between listByNames and the ingestData upsert.
