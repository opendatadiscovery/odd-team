name: Get data entity group lineage (flat graph per DEG member, inner DEGs suppressed)
canonical_in_docs: false
canonical_candidate: true
description: |-
  **NEW OPERATION, batch 2026-05-19I (LineageServiceImpl sidecar)**;
  **STRENGTHENED batch 2026-05-19M (getDataEntityGroupsLineage controller
  PRIMARY SOURCE)** — LineageServiceImpl.getDataEntityGroupLineage(Long
  dataEntityGroupId) at lines 59-85. Called from
  DataEntityController.getDataEntityGroupsLineage
  (DataEntityController.java:275-281), consumed by the DEG Lineage tab in
  the UI.

  **Contract**:
  (1) resolve DEG-member oddrns via
      groupEntityRelationRepository.getDEGEntitiesOddrns(dataEntityGroupId)
      (line 61) — 404 if no entities
      (switchIfEmpty(Flux.error(NotFoundException(...))), line 62);
  (2) fetch entity metadata via getDataEntityWithDatasourceMap (line 65)
      and lineage edges via lineageRepository.getLineageRelations(oddrns)
      (line 66);
  (3) **filter out inner DEGs**: the conditional at lines 71-75 with the
      literal source-level comment
      // Remove this when we will support inner DEGs for DEG lineage
      removes edges where EITHER endpoint is itself a DEG, AND removes
      DEG-typed entries from the metadata dictionary (the explicit
      deferred-feature marker — see
      inner-deg-suppression-comment-marked-deferred-feature invariant);
  (4) build the relations map (buildRelationsMap lines 282-289 — each edge
      filed under BOTH endpoints), partition the DEG member graph into
      per-member connected components via establishDEGRelations (lines
      200-216) using BFS-shaped recursion via getRelationsForEntities
      (lines 218-233);
  (5) produce ONE DataEntityLineageStreamDto per DEG-member oddrn via the
      3-arg getLineageStream private overload (lines 181-198) which always
      passes List.of() as groups and Map.of() as groupsRelations (line
      197) — DEG-lineage results NEVER surface group memberships in the
      response. Read-only, NOT transactional.

  **Five concrete gaps (batch M PRIMARY-SOURCE controller-layer confirms)**:
  (a) **anchor-set defence-in-depth NOT applied** — same as getLineage;
      DEG ID is the anchor; any DEG visible to the caller exposes its
      full member-graph + reachable edges + per-member metadata; the
      LineageServiceImpl has no AuthIdentityProvider field (verified by
      reading LineageServiceImpl.java:54-57); HIGH severity;
  (b) **JVM-stack recursion in getRelationsForEntities** — tail-recursive
      in structure but Java has no TCO; each call adds a stack frame; for
      a wide-component DEG (e.g. 10K+ entities in a single component)
      this can blow the stack; LOW severity;
  (c) **NO unit test on this method exists** — LineageServiceTest.java has
      zero matches for getDataEntityGroupLineage; the DEG-lineage path is
      entirely untested at the service layer; the batch-M controller
      sidecar also confirms zero controller-boundary tests (Grep on
      getDataEntityGroupsLineage|getDataEntityGroupLineage at
      odd-platform-api/src/test/java returns zero matches);
  (d) **404 conflates three semantically distinct conditions** — batch M
      surfaces: DEG-not-found vs DEG-has-no-members vs non-DEG-typed-ID
      all produce identical NotFoundException("Data entity group", id);
      operators debugging "why is my DEG-lineage call returning 404?"
      cannot discriminate; MEDIUM severity;
  (e) **bidirectional edge filter silently drops cross-boundary edges** —
      getLineageRelations(List<String>) at
      ReactiveLineageRepositoryImpl.java:112-119 requires BOTH endpoints
      in the member set; edges exiting the DEG (to non-member parents) or
      entering the DEG (from non-member children) are dropped; an operator
      viewing a DEG lineage cannot tell that "this DEG has upstream
      sources outside the DEG" or "feeds into consumers outside the DEG";
      MEDIUM severity.

  The // Remove this when we will support inner DEGs for DEG lineage
  comment at line 71 acknowledges a known-deferred-feature without a
  corresponding @Disabled test or backlog citation.
