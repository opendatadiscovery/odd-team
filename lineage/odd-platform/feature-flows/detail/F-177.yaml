control_summary: |-
  0 of 4 cells PROBED — feature minted at ui-review-2026-05-26 to anchor
  the badge rendering at the detail-page header. The badge surface is
  load-bearing because the same `entityClasses` array drives Overview
  composition (F-176) AND tab visibility (DataEntityDetailsTabs). The
  drifts are UX-layer — the badges encode load-bearing semantics but the
  surface does not communicate that to operators. The type-badge XSS
  facet under security is a worthwhile static-check candidate (cross-link
  F-004 XSS family) — if `type.name` is collector-supplied and rendered
  unescaped, this is a 7th XSS surface.

  Highest-leverage probe: render a hostile `type.name` (e.g.
  "<script>alert(1)</script>") via ingestion and observe whether the
  EntityTypeItem render path escapes it (Slice M scope).
