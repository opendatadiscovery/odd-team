proposed_action: |-
  Testcontainers integration test. (a) Create three dataset_version rows for `data_entity #1` with versions [1, 2, 3]. (b) Create dataset_field rows: oddrn `//col1` linked to v1 + v2 + v3 (SAME row across versions), oddrn `//col2` linked to v1 + v2 with one row + v3 with a NEW row (representing a column rename). (c) Call `getLastVersionDatasetFieldsByOddrns(List.of("//col1", "//col2"))`. (d) Assert: `//col1` returns the single shared row; `//col2` returns the v3-linked row (NEWEST). (e) Add a v4 dataset_version with a NEW row for `//col2`. (f) Re-call `getLastVersionDatasetFieldsByOddrns(...)`. Assert: `//col2` now returns the v4-linked row (the promotion is correct). (g) Pair with the partition-boundary case: 1001 oddrns input → splits into chunk-1 (1000) + chunk-2 (1) — assert ALL 1001 results returned, no duplicates. (h) Add a `// REGRESSION-PIN — Window-function CTE correctness is load-bearing for ingestion. A planner change OR refactor that returns non-maximal rows would silently corrupt the dataset_structure model.` comment block.
