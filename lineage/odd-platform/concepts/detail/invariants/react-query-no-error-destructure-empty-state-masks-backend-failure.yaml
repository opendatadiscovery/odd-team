notes: |-
  Generalizes beyond the DQ Dashboard. Sibling existing concept
  `app-error-page-as-error-render-surface-suppressed-toasts` describes the
  inverse pattern (where AppErrorPage is correctly rendered and suppresses
  toasts on large loaders) — both concepts together map the spectrum of
  ODD UI error handling.

  Future sidecars (any react-query consumer that destructures only
  `data + isSuccess`) can STRENGTHEN this concept by adding their node
  to the `nodes:` list and recording their `bugs_limitations_corner_cases`
  reference under `contributors`.
