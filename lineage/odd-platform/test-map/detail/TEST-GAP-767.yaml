proposed_action: |-
  Add `DatasetVersionPerEntityScopingBypassTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `getDataSetStructureByVersionId_urlDataEntityIdMismatchesVersionIdParent_returnsOtherDatasetStructure_pinsBypass` — seed two datasets A and B with distinct versions; GET `/api/datasets/{A_id}/structure/{B_version_id}`; assert HTTP 200 with B's structure in the response (NOT 404). PIN the bypass.
  2. `getDataSetStructureByVersionId_wrongVersionIdNonexistent_returnsNotFound_pinsExistingErrorPath` — GET with `/api/datasets/{A}/structure/999999`; assert HTTP 404 with the canonical NotFoundException message.
  3. `getLatestDatasetVersion_DOES_scopeByDataEntityId_pinsAsymmetricSibling` — GET `/api/datasets/{B_id}/structure` (latest); assert response is B's structure. GET `/api/datasets/{A_id}/structure` for a dataset with no versions; assert 404. PIN the sibling contract that DOES scope.
  4. `sqlWhereClause_isOverDatasetVersionIdOnly_pinsSqlShape` — query `pg_stat_activity` or use jOOQ's debug logging during a `getDatasetVersion` call; capture the WHERE clause; assert it includes `DATASET_VERSION.ID = ?` but NOT `DATA_ENTITY.ID = ?`. PIN the SQL shape contract.
  5. `enumerationVector_sequentialVersionIds_returnsAllDatasetsHistoryAcrossOwners_pinsBlastRadius` — for version_id in {1..N}; GET `/api/datasets/1/structure/{version_id}`; collect all returned dataset oddrns; assert the set covers MULTIPLE distinct datasets. PIN the catalog-wide enumeration capability.

  Pair with REFACTOR-NNN: add `DATA_ENTITY.ID = datasetId` WHERE clause to the `getDatasetVersion` SQL shape AT `ReactiveDatasetVersionRepositoryImpl.java:97-144`. When the fix lands, test #1 inverts to assert HTTP 404 on the mismatched-id case.

  Cross-pair with DOC-NNN: surface the read-collaborative posture on the Data Discovery doc + the Security Architecture doc. Until the code fix lands, the docs are the only surface that can warn operators.
