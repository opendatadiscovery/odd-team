proposed_action: |-
  Author TitleControllerListContractTest as a @SpringBootTest +
  WebTestClient harness with four cases against a seeded directory of
  6+ titles (including one soft-deleted):
  (a) empty query → assert all non-deleted titles in id ASC;
  (b) query='owner' → assert substring matches case-insensitive;
  (c) soft-deleted title → assert absent;
  (d) pagination boundary: page=1, size=2 → assert first 2; page=2,
  size=2 → assert next 2.
  Order-pin is the load-bearing assertion — id-ASC is intentional
  framework default, not relevance-ranked. A maintainer "improving" to
  alphabetical without seeing this test would break the
  OwnerTitleAutocomplete UX silently.
