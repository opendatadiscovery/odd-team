name: Regenerate Collector Token
canonical_in_docs: false
canonical_candidate: true
description: 'PUT /api/collectors/{collector_id}/token — gated by COLLECTOR_TOKEN_REGENERATE
  Permission. Loads CollectorDto, hands existing TokenPojo to TokenGenerator.regenerate
  (mutates in-place: value=RandomStringUtils.randomAlphanumeric(40), updatedAt=now,
  updatedBy=currentUsername), persists via ReactiveTokenRepository.updateToken, returns
  Collector with the new plaintext token visible in token.value (showToken=true).
  In-place UPDATE — no rotation grace, no old/new pair. IngestionDataEntitiesFilter
  starts rejecting old-token requests the moment UPDATE commits.'
axes_present:
- controllers
nodes:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
contributors:
- 'regenerateCollectorToken.operations: regenerate-collector-token, rotate-ingestion-secret,
  return-plaintext-token'
- 'regenerateCollectorToken.invariants[0-3]: Permission-gated, in-place UPDATE, plaintext-in-response,
  plaintext-equality validation at IngestionDataEntitiesFilter'
evidence:
- regenerateCollectorToken.md:concepts.operations
- regenerateCollectorToken.md:concepts.invariants.[0-3]
notes: 'The operational vocabulary (in-place UPDATE; no grace; plaintext;

  Permission-gated) is captured here so the catalog has a referent

  when DOC-NNN follow-ups land for Token Rotation documentation.

  '
