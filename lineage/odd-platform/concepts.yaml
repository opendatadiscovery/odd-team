  - name: "Housekeeping TTL retention"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Time-based retention subsystem — a `@ConditionalOnProperty(housekeeping.enabled=true)` `HousekeepingJobManager` fires every 15 minutes (Spring `@Scheduled(fixedRate = 15, timeUnit = MINUTES)`, ShedLock-coordinated as `housekeepingJob` with `lockAtLeastFor=14m / lockAtMostFor=14m`) and iterates a discovered `List<HousekeepingJob>` of FIVE jobs total: three TTL-driven purge jobs (`AlertHousekeepingJob`, `SearchFacetsHousekeepingJob`, `DataEntityHousekeepingJob`) each consuming one of `HousekeepingTTLProperties`' three int fields (`resolved_alerts_days`, `search_facets_days`, `data_entity_delete_days` — all defaulted to 30 in `application.yml:167-170`), plus two `EmptyPartitionsHousekeepingJob` subclasses (`ActivityEmptyPartitionsHousekeepingJob`, `MessageEmptyPartitionsHousekeepingJob`) that drop EMPTY past partitions only (no TTL coupling). The TTL surface covers EXACTLY three tables: ALERT (with ALERT_CHUNK cascade), SEARCH_FACETS, and DATA_ENTITY (with ~25-table cascade via DataEntityHousekeepingJob). **NO time-based retention exists for the ACTIVITY or MESSAGE tables anywhere in the codebase** — REFACTOR-085 confirmed from primary source. vocabulary_status: codebase-anchored, doc-side-partially-covered (live `/configuration-and-deployment/odd-platform#housekeeping` documents the three TTL keys and the master gate, but enumerates only 'three cleanup tasks' — the two EmptyPartitions jobs are not listed). main-concepts.md does not name 'Housekeeping' or 'Retention' as canonical vocabulary."
