proposed_action: |-
  Add Testcontainers-backed integration test `OwnerServiceImplTransactionalTest.update_failureBetweenRoleRebindAndSearchVectorRefresh_rollsBackOwnerNameAndRoleBindings`. (a) Seed Owner X with name "Alice" + roles [ROLE_A, ROLE_B]. (b) Use a SpringBootTest with `@Profile("test")` and a mocked `searchEntrypointRepository.updateChangedOwnerVectors(...)` that returns `Mono.error(new RuntimeException("FTS refresh failed"))`. (c) Invoke `ownerService.update(X, new OwnerFormData().name("Bob").roles(List.of(ROLE_C)))`. (d) Assert the call completes with the RuntimeException. (e) Query the database directly: `SELECT name FROM owner WHERE id = X` should return "Alice" (rollback successful); `SELECT role_id FROM owner_to_role WHERE owner_id = X` should return [ROLE_A, ROLE_B] (role-rebind rolled back). (f) Add a `// REGRESSION-PIN — @ReactiveTransactional on OwnerServiceImpl.update covers ALL six writes (name + 2 role-rebind primitives + 2 search-vector updates + read-back). A failure ANYWHERE between (3) and (6) MUST roll back (3)–(5). Dropping the annotation will break this test.` comment block. Pair with similar tests for create-rollback + delete-rollback.
