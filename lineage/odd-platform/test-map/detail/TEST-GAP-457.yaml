behaviour: |-
  No rate-limiting / no batching / no token bucket. WAL streams alerts as fast as Postgres decodes them; dispatcher runs synchronously; senders block on HTTP/SMTP. A burst of 10k alerts (e.g. a misconfigured DQ run flagging every dataset) translates 1:1 into 10k Slack messages, 10k webhook POSTs, 10k emails. Slack will rate-limit at the receiver (HTTP 429); the AbstractNotificationSender.java:24-27 only checks for HTTP 200, treating 429 as a NotificationSenderException — dispatcher logs and drops the alert from that channel. No retry, no exponential backoff, no batching. The 'fan-out to all configured channels' contract collapses under burst load with NO operator-visible signal beyond log.error.
