terminal_side_effect:
  side_effect_class: page-render
  description: |-
    Renders the composed Overview tab as a two-column grid with 12 panel
    slots. No direct DB / API write side-effect from the composer; the
    sub-panels carry their own write paths (description edit, tag edit,
    metadata edit, attachments upload, owners CRUD, terms link/unlink,
    DEG add/remove). The composer's only network side-effect is the
    initial population via DataEntityDetails.tsx's useEffect (F-001 chain
    hop 1) which triggers the LSN-017 doubled fetch.
  evidence: |-
    Overview.tsx:50-156 — entirely render logic; no useEffect at this layer
    (F-001 batch ZA — Overview.tsx contains NO useEffect, only one useMemo
    at line 45). The render side-effect IS the operator-observable outcome:
    a populated 12-panel surface composed from one already-fetched details
    object plus three sidebar-specific selectors (alerts count, DQ-test
    report, SLA report — all fetched by DataEntityDetails.tsx hop-1 second
    useEffect at lines 66-76).
  cardinality_per_call: 1 page render per route navigation
amplification_factor: 1
amplification_factor_provenance: |-
  STATIC — composition surface; per-render multiplicity is 1. The
  load-bearing amplification is inherited: the parent DataEntityDetails
  fires fetchDataEntityDetails TWICE per mount (LSN-017 — F-001 hop 1),
  and this Overview composer mounts within that lifecycle. The composer
  itself adds no multiplicity but consumes the result.
observed_vs_expected:
  facets:
  - facet: composed surface — no single truth about what renders per entity class
    observed: |-
      The "what renders for this entity" decision is SPREAD across multiple
      points: Overview.tsx:58 (`hasDataQualityTestExpectations` for the
      Expectations panel), :91 (`showOverview={isDataset}` for Metrics),
      :105 (`isDataset && datasetQualityTestReport?.total` for the DQ
      panel), plus OverviewStats's internal switch over entityClass.name
      (OverviewStats.tsx:23-83). A maintainer who wants to know "for a
      TRANSFORMER class entity, which panels render?" must read all four
      sites + the OverviewStats switch + the OverviewMetrics body. There
      is no manifest / lookup table / class→panels map.
    expected: |-
      Either (a) a single class-to-panels declarative map (config-as-data)
      that the composer iterates, OR (b) doc-anchored explanation of the
      per-class composition matrix in the Data Discovery doc page.
    drift_class: composed_surface_no_single_truth_about_what_renders_per_entity_class
    evidence:
    - 'Overview.tsx:58 — hasDataQualityTestExpectations gate'
    - 'Overview.tsx:91 — showOverview={isDataset} gate'
    - 'Overview.tsx:105 — isDataset && datasetQualityTestReport?.total gate'
    - 'OverviewStats.tsx:23-83 — class-conditional sub-panel switch'
    provenance: STATIC — composer source enumerated above.
    severity: LOW
  - facet: per-panel permission provider — each editable panel resolves its own permission set
    observed: |-
      Overview.tsx wraps SEVEN of the panels in their own
      `<WithPermissionsProvider>` (lines 67-71, 74-78, 81-90, 95-103,
      112-124, 127-132, 134-147), EACH with a DIFFERENT `allowedPermissions`
      array. The composer-level permission set is therefore the union of
      seven sub-sets — derivable only by reading every panel. There is no
      single `<WithPermissionsProvider>` at the composer level that fans
      out one resource-permissions fetch; the parent DataEntityDetails
      passes a single `resourcePermissions` selector value down to each
      Provider (Overview.tsx:37-39, :69, :76, :87, :101, :117, :129,
      :139). The composer-level UX of "what can I edit on this entity?"
      is the union of seven panel-internal evaluations.
    expected: |-
      Either documented per-panel permission table OR a single composer-
      level provider with the full union, simplifying review.
    drift_class: per_panel_permission_provider_resolves_per_section_no_shared_provider
    evidence:
    - 'Overview.tsx:67-71 — Description WithPermissionsProvider'
    - 'Overview.tsx:74-78 — Attachments WithPermissionsProvider'
    - 'Overview.tsx:81-90 — Metadata WithPermissionsProvider'
    - 'Overview.tsx:95-103 — General/Ownership WithPermissionsProvider'
    - 'Overview.tsx:112-124 — Groups WithPermissionsProvider'
    - 'Overview.tsx:127-132 — Tags WithPermissionsProvider'
    - 'Overview.tsx:134-147 — Terms WithPermissionsProvider'
    provenance: STATIC.
    severity: LOW
  - facet: skeleton only for top-level details async — each panel owns its own loading independently
    observed: |-
      The MAIN body gate is `!isDataEntityDetailsFetching` (Overview.tsx:52)
      driven by F-001's fetchDataEntityDetails. But OverviewAttachments has
      its OWN async via `useDataEntityAttachments` (OverviewAttachments.tsx:14)
      that surfaces its own `isLoading` spinner; the DQ panels depend on
      `getDatasetTestReport` selector populated by a SEPARATE thunk
      (fetchDataSetQualityTestReport — DataEntityDetails.tsx:68); the
      SLA report is a THIRD lifecycle (fetchDataSetQualitySLAReport
      DataEntityDetails.tsx:69). A user lands on the page → top-level
      skeleton flips to populated MAIN body → attachments / DQ panels
      can still be in their own loading or error states. Visually this
      can look like a "partially-broken" page until each panel resolves.
    expected: |-
      Either (a) the skeleton covers ALL panel async until every panel
      reports loaded, OR (b) each panel renders its own panel-shaped
      skeleton during its load window for a cleaner composed experience.
    drift_class: skeleton_only_for_top_level_details_async_each_panel_owns_its_own_loading_independently
    evidence:
    - 'Overview.tsx:51-52 — top-level skeleton gate'
    - 'OverviewAttachments.tsx:14 — useDataEntityAttachments independent hook'
    - 'DataEntityDetails.tsx:66-76 — three independent fetches in second useEffect'
    provenance: STATIC.
    severity: MEDIUM
    ui_unverified: true
    ui_unverified_reason: |-
      The visual outcome ("partially broken-looking page") needs a live
      observation against a slow-network simulation to confirm the
      composition order operators actually see.
  - facet: class-conditional render silent when class enum is absent or unrecognised
    observed: |-
      OverviewStats.tsx:23-83 — `entityClasses?.map(...)` followed by a
      switch with a `default: return null` branch. An entity with
      `entityClasses === undefined`, `entityClasses === []`, or a class
      name not in the seven-case enum renders NO stats panel — silently.
      OverviewMetrics is gated on `showOverview={isDataset}` and the
      DQ panel on `isDataset && datasetQualityTestReport?.total`. An
      entity that is misclassified or has no classes set renders an
      Overview tab with just General / Description / Tags / Terms /
      Groups — the operator has no signal that the surface is incomplete
      because the missing panels would have been class-driven.
    expected: |-
      Either (a) explicit empty-state for unrecognised class ("stats not
      available for this class"), OR (b) operator-facing telemetry that
      this entity has zero recognised classes.
    drift_class: class_conditional_render_silent_when_class_unknown_or_payload_missing_classes
    evidence:
    - 'OverviewStats.tsx:23-83 — switch + default return null'
    - 'Overview.tsx:91 — OverviewMetrics gate'
    - 'Overview.tsx:105 — DQ panel gate'
    provenance: STATIC.
    severity: LOW
  - facet: two-column grid xs={9} / xs={3} — no responsive collapse below sm undocumented
    observed: |-
      Overview.tsx:54, :93 — `<Grid item xs={9}>` and `<Grid item xs={3}>`
      with NO `md` / `sm` overrides. MUI's xs is the smallest breakpoint;
      no fallback to a single-column on small viewports is provided in
      this composer. The platform's other large-page surfaces (Search,
      Catalog Overview) do explicit responsive layouts; the Overview
      composer's desktop-first assumption is implicit.
    expected: |-
      Either explicit responsive breakpoints (e.g. xs={12} md={9}) on the
      grid items, OR documented operator-facing minimum viewport size.
    drift_class: two_column_grid_xs9_xs3_no_explicit_responsive_collapse_below_sm_breakpoint_undocumented
    evidence:
    - 'Overview.tsx:54 — <Grid item xs={9}>'
    - 'Overview.tsx:93 — <Grid item xs={3}>'
    provenance: STATIC.
    severity: LOW
    ui_unverified: true
    ui_unverified_reason: |-
      Whether MUI's default responsive grid still yields a usable
      experience at narrow viewports is a layered question; live
      observation at a phone-width viewport would confirm.
  - facet: right-column DQ report silent when zero tests — indistinguishable from loading
    observed: |-
      Overview.tsx:105 — `isDataset && datasetQualityTestReport?.total ?
      <SectionContainer>...</SectionContainer> : null`. An entity that
      IS a dataset but has zero test reports renders NO DQ section. A
      dataset whose DQ-report thunk is still loading also renders no
      section (the selector is empty until the thunk resolves). The
      same DOM absence covers both states; the operator cannot tell
      "this dataset has no tests" from "the tests are still loading."
    expected: |-
      Either (a) an explicit empty-state for "no tests recorded for this
      dataset," OR (b) a loading placeholder during the test-report
      fetch window.
    drift_class: right_column_dq_report_gated_on_total_truthy_silent_when_zero_tests_indistinguishable_from_loading
    evidence:
    - 'Overview.tsx:105 — isDataset && datasetQualityTestReport?.total gate'
    - 'DataEntityDetails.tsx:68 — fetchDataSetQualityTestReport dispatch'
    provenance: STATIC.
    severity: MEDIUM
    ui_unverified: true
  - facet: predefined metadata renders under custom-metadata permission gate — no separate audience signal
    observed: |-
      OverviewMetadata.tsx:26-29 — TWO selectors: predefinedMetadata
      (collector-ingested EXTERNAL-origin) AND customMetadata (operator-
      curated INTERNAL-origin). Both render in the same panel under the
      same WithPermissionsProvider gated on DATA_ENTITY_CUSTOM_METADATA_*
      (Overview.tsx:83-86). Predefined metadata has no separate
      visibility / edit permission; the gate exists only for the custom
      side. Operators viewing predefined metadata see no distinct UI
      cue that this section's items come from collectors vs operators —
      the MetadataItem treats them uniformly. (Cross-link F-013 facet
      `external_origin_writable_overwrites_ingestion` — the WRITE side
      already collapses INTERNAL vs EXTERNAL identity; the READ side
      mirrors that.)
    expected: |-
      Either (a) visually distinguish predefined-vs-custom metadata in
      the panel header, OR (b) document the conflation on the data-
      discovery metadata doc page.
    drift_class: predefined_metadata_renders_under_custom_metadata_perm_gate_no_separate_audience_signal
    evidence:
    - 'OverviewMetadata.tsx:26-29, :97-108 — predefined + custom both rendered'
    - 'Overview.tsx:83-86 — single gate on DATA_ENTITY_CUSTOM_METADATA_*'
    provenance: STATIC.
    severity: LOW
