name: Collector
canonical_in_docs: true
canonical_candidate: false
description: Container of pull adapters plus the runtime around them (main-concepts.md
  verbatim). Authenticated to the platform via a shared-secret bearer token used by
  S2S `IngestionDataEntitiesFilter` on `/ingestion/entities`. Platform-level infrastructure
  (no Owner association). Managed via `/api/collectors/*` endpoints — list, create,
  update, delete, regenerate-token. Token rotation is an in-place UPDATE with no grace
  window. **BATCH Q EXTENSION** — Management → Collectors UI tab catalogued
  (CollectorsList sidecar); UI-tier credential hazards documented (plaintext token
  rendered into DOM + fragile substring-prefix-sniff masking detection); see new
  sibling invariant `plaintext-token-rendered-into-dom-fragile-substring-prefix-sniff-masking`.
axes_present:
- controllers
- ui_components
nodes:
- odd-platform java CollectorController controller-method:regenerateCollectorToken
- odd-platform ts react-component component:CollectorsList
contributors:
- 'CollectorController.regenerateCollectorToken: entities[Collector, Token (40-char
  alphanumeric shared secret), TokenPojo, CollectorDto]; operations[regenerate-collector-token,
  rotate-ingestion-secret, return-plaintext-token]'
- |-
  **NEW batch Q — CollectorsList.md (Management → Collectors UI tab)**:
  concepts.entities.[0] (Collector — the generated API model with id, name,
  description, namespace, token: { value: string }, createdAt, updatedAt) +
  concepts.operations[list-collectors-paginated, search-collectors-debounced,
  create-collector, update-collector, delete-collector, regenerate-token,
  copy-token-to-clipboard, detect-masked-token-by-prefix] +
  bugs_limitations_corner_cases.[0,1,2,3,4] (UI-tier hazards including
  the UI-vs-API asymmetry under DISABLED — the 19th-and-final-known
  sidecar facet of REFACTOR-185)
evidence:
