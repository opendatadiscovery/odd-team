proposed_action: |-
  Add Mockito test `create_doesNotCallUpdateSearchVectors_pinsLazyFtsSeedingContract` in `OwnerServiceImplTest`. (a) Mock `ownerRepository`, `ownerToRoleRepository`, `searchEntrypointRepository`, `termSearchEntrypointRepository`. (b) Stub `ownerRepository.create` to return a populated OwnerPojo. (c) Invoke `ownerService.create(new OwnerFormData().name("Alice"))`. (d) `verify(searchEntrypointRepository, never()).updateChangedOwnerVectors(anyLong())`. (e) `verify(termSearchEntrypointRepository, never()).updateChangedOwnerVectors(anyLong())`. (f) Add a `// REGRESSION-PIN — Create deliberately does NOT call updateSearchVectors. The maintainer's choice is lazy FTS seeding: an Owner becomes findable when downstream data entities reference it. A REFACTOR adding updateSearchVectors to create will break this test, making the decision deliberate.` comment block. Pair with TEST-GAP-625 (which pins the SAME absence for delete + presence for update) to surface the FULL asymmetry across all three lifecycle verbs.
