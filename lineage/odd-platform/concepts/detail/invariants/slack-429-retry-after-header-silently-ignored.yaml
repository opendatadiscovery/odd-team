severity: MEDIUM
severity_dim: durability
mitigations_unimplemented:
  - |-
    Modify AbstractNotificationSender.sendAndValidate to read the
    Retry-After header on 429 responses and either (a) sleep + retry once
    in the sender thread (simple, blocks dispatcher tail latency) or
    (b) enqueue a deferred-delivery row in a notifications_retry table
    and have a scheduled job drain it after the indicated delay (complex,
    requires schema change but preserves dispatcher throughput).
  - |-
    Emit a Prometheus counter notification_send_failed_total{channel,
    status_code} so operators can distinguish "Slack rate-limited 429"
    from "Slack auth-revoked 404" from "Slack-outage 5xx" without
    log-grep.
  - |-
    Add a client-side token-bucket rate limiter at the sender layer
    (~1 token/sec per sender, configurable cap) — closes both the
    receiver-side Retry-After-ignored gap AND the client-side burst-
    overflow gap (REFACTOR-129).
  - |-
    Document the rate-limit handling absence on the live
    /features/active-platform-features/notifications page; cross-link
    to operator-side queueing-relay guidance (e.g. nginx with
    limit_req, or a dedicated SQS+Lambda relay between the platform
    and Slack).
notes: |-
  NEW MEDIUM-severity invariant captured in batch 2026-05-20Y from the
  SlackNotificationSender sidecar's primary-source evidence. The finding
  generalises across all HTTP-channel senders (Slack + Webhook) because
  the shared parent AbstractNotificationSender owns the 200-only binary
  check.

  Cross-cutting connections:
    - Pairs with REFACTOR-129 / NotificationsProperties.md:bugs_limitations_corner_cases.[10]
      (No rate-limiting at any layer) — sibling: receiver-side signal
      ignored AND client-side throttle absent; both gaps must close for
      end-to-end rate-limit correctness
    - Pairs with the no-retry-no-dlq-no-audit gap on the F-009 feature
      flow (all 3 senders + dispatcher) — the architectural reason
      Retry-After cannot be honoured today is the no-retry posture; a
      retry implementation would unblock all three (rate-limit, transient
      5xx, transient IOException) classes simultaneously
    - Cross-link to the cross-channel-runtimeexception-abort invariant
      (also batch Y) — both findings are about the dispatcher's per-sender
      handling being too binary: 200-vs-non-200, NotificationSenderException-
      vs-RuntimeException

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the Slack 429 / Retry-After silence on the live
        notifications page with operator-facing mitigation (queueing
        relay)
    (b) Document the 200-only accept (Slack + Webhook) as an explicit
        contract — receivers returning 2xx-non-200 are unsupported
