proposed_action: |-
  Repository-layer integration test. (a) Create 2001 ActivityPojos. (b) Inject a fault at the 1001st row (e.g. set `data_entity_id = 99999999` — FK violation). (c) Call `activityRepository.save(pojos)`. (d) Assert the returned Mono emits an error. (e) Query the activity table directly: `SELECT COUNT(*) FROM activity WHERE ...`. Assert count = 1000 (the first chunk committed; the second chunk's first row hit FK violation; the entire second chunk rolled back via PG, BUT the first chunk is committed). (f) Add a `// REGRESSION-PIN — Chunked batch save commits per-chunk with no overall transaction. A partial failure mid-batch leaves partial audit data. REFACTOR-NNN will wrap save(List) in @ReactiveTransactional; this test flips to expect count=0 (entire batch rolled back).` comment block. (g) Pair with a successful-batch variant asserting full count.
