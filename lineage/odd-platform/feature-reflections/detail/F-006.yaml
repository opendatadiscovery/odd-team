        cite: "RoleServiceImpl.java:68 (case-sensitive) vs 82 (case-insensitive)"
        note: "Update guard case-sensitive; delete guard case-insensitive — primary source."
      - sidecar: odd-platform__ts__react-component__component__RolesList.md
        section: invariants ("Predefined-role name protection is UI-only")
        cite: "RoleItem.tsx:24-25 + RoleForm.tsx:28,90"
