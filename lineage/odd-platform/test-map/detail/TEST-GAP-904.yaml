proposed_action: |-
  Add `DataSourceListEndpointTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `getDataSourceList_happyPath_returns200WithDataSourceList` — register 3 data sources; GET /api/datasources?page=1&size=10; assert HTTP 200, a DataSourceList body with 3 items each carrying id/name/oddrn/namespace/token, and page_info{total=3, has_next=false}.
  2. `getDataSourceList_orderedByIdAsc_pinsCreationOrder` — register data sources with names that are NOT in ascending alphabetical order relative to their insertion order; GET /api/datasources; assert the items[] are ordered by ascending `id`, NOT by name. PIN the id-ASC ordering (probe P-034).
  3. `getDataSourceList_userWithoutManagementPermission_stillListsFullCatalog_pinsReadCollaborativePosture` — authenticate as a user whose Policy grants NO DATA_SOURCE_* / MANAGEMENT permission; GET /api/datasources; assert HTTP 200 with the full list. PIN that the GET is intentionally not permission-gated.

  Pair with a DOC-NNN follow-up: the management doc page should state the list is ordered
  by creation (id-ASC) so operators are not surprised that newly-registered sources appear
  at the bottom.
