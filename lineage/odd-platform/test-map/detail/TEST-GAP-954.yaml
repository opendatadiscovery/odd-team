proposed_action: |-
  Three tests in one item:
  (a) LinksControllerUrlSafetyTest (backend): seed odd.links with one
  javascript: URL and one data:text/html URL; GET /api/links; assert the
  response items contain the URLs verbatim TODAY (regression-pin); fix
  adds either an @URL constraint OR a controller-level filter.
  (b) AppInfoMenu.reverseTabnabbing.test.tsx (UI): assert every rendered
  Link with target=_blank carries rel=noopener noreferrer — covering ALL
  FIVE rendering call sites (lines 41, 61, 95, 103, 112). The test is
  RED today; the fix is a five-line UI change adding rel='noopener noreferrer'
  on each Link.
  (c) Additional fixtures: javascript: URL renders an <a> with sanitised
  href (React 17 behaviour pin); data:text/html URL renders an <a> that
  is not executable under modern Chromium (browser-defence regression pin).
  Note: the URL-scheme allowlist is the bigger architectural change;
  the rel-noopener fix is trivial and should ship first.
