notes: |-
  NEW entity captured in batch 2026-05-25-ZD. The single-entry
  mapping is the architectural commitment to ONE platform-supplied
  substitution dimension; adding more dimensions requires extending
  this class + the mapper (~5-line change but a coupled-concerns
  surface).

  DOC-NNN candidates:
    - Document the default placeholder behaviour
      (`http://your.odd.platform` is the observable value when the
      property is unset; operators need to know this is a
      copy-paste-trap not a working URL).
    - Document the no-validation posture — operator typos
      substitute verbatim.
    - Cross-link to the security page for the
      internal-hostname-under-DISABLED-leakage caveat.
