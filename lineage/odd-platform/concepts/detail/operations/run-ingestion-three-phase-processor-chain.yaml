name: Run ingestion three-phase processor chain (INITIAL → MAIN → FINALIZING)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW OPERATION, batch 2026-05-19I (IngestionService sidecar)** —
  the orchestration primitive for the platform''s 14 `IngestionRequestProcessor`
  implementations. Invoked from `IngestionServiceImpl.ingest(...)` (`IngestionServiceImpl.java:71`)
  via `processIngestionRequest` — delegates to `IngestionProcessorChain` (`IngestionProcessorChain.java:17-56`).
  Contract: groups all `IngestionRequestProcessor` beans by `IngestionProcessingPhase`
  (enum: INITIAL=1, MAIN=2, FINALIZING=3) into a TreeMap ordered by `phase.order`.
  Within a phase, processors run via `Mono.zip(...)` (line 36) — parallel reactive
  subscription. Between phases, `.concatMap` (line 39) enforces sequential ordering.
  The 14 processors split across phases: **INITIAL phase**: `HollowDataEntityIngestionRequestProcessor`
  (creates hollow `data_entity` rows for ODDRNs referenced in lineage / DQ-test
  datasets but not in the current payload — placeholders for future ingestion).
  **MAIN phase (11 processors)**: `DatasetStructureIngestionRequestProcessor` (writes
  `dataset_version` + `dataset_field` rows; sets `datasetSchemaChanged=true` flag
  feeding FINALIZING phase''s BIS alert raising), `TaskRunIngestionRequestProcessor`
  (bulk-INSERT new task runs / bulk-UPDATE existing into `data_entity_task_run`;
  nests `@ReactiveTransactional`), `MetadataIngestionRequestProcessor` (writes
  metadata_field + metadata_field_value; **DELETE-on-absence** of bindings — silent
  data loss per companion invariant), `LineageIngestionRequestProcessor` (delegates
  to `LineageServiceImpl.replaceLineagePaths` — **REPLACE-not-merge** per companion
  invariant), `DataQualityTestRelationIngestionRequestProcessor`, `GroupEntityRelationIngestionRequestProcessor`,
  `GroupParentGroupIngestionRequestProcessor`, `RelationshipIngestionRequestProcessor`
  (writes `erd_relationships` + `graph_relationships`), `ExternalTagIngestionRequestProcessor`,
  `UsageReportIngestionRequestProcessor` (runs on EVERY ingestion — `shouldProcess`
  returns `true` unconditionally; even zero-delta payloads write to `data_entity_statistics`).
  **FINALIZING phase (3 processors)**: `FTSVectorsIngestionRequestProcessor` (rebuilds
  Postgres FTS tsvector index for EVERY non-JOB_RUN entity in the request — no diff
  check; hot Postgres CPU on idempotent re-ingestion), `ActivityIngestionRequestProcessor`
  (emits `DATA_ENTITY_CREATED` rows for NEW entities ONLY — UPDATEs from ingestion
  emit NO activity event; an audit gap), `AlertIngestionRequestProcessor` (the
  BIS alert raiser — consumes `request.getChangedDatasetIds()` and `request.getTaskRuns()`
  + halt configs, computes `AlertAction` candidates, dispatches via `AlertServiceImpl::applyAlertActions`).
  **Within-phase execution order is non-deterministic** (Spring bean injection order)
  — a future processor with an undeclared write-then-read dependency on another
  MAIN-phase processor would silently fail under different Spring resolution orders.
  The whole chain runs INSIDE one `@ReactiveTransactional` (per `single-transaction-per-batch-ingestion`
  invariant).'
