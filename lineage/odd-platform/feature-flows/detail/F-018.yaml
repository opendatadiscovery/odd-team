      F-017's Tag facet on Search.tsx is the CONSUMER. The full loop:
      mint a novel tag on one entity → that tag becomes a top-level
      Search facet → any authenticated user enumerates it → catalog-wide
      tag vocabulary pollution is OPERATOR-INVISIBLE (the live tagging.md
      page does not describe the enumeration consequence; sidecar
      Search.tsx doc_drift_findings[A] severity MEDIUM — undocumented
      catalog discoverability).
