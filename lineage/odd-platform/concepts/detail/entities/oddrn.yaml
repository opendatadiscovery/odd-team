name: ODDRN
canonical_in_docs: true
canonical_candidate: false
description: Open Data Discovery Resource Name — unique stable string identifying
  every entity in the system. Encodes data-source family + connection coordinates
  (e.g. `//postgresql/host/.../databases/.../schemas/.../table/...`). The grouping
  key for Directory's data-source-type aggregation; the routing key for AlertManager
  webhook's `entity_oddrn` label (DirectoryController + AlertManagerController sidecars;
  main-concepts.md `## ODDRN` is the canonical home).
axes_present:
- controllers
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:DirectoryController
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertManagerController
contributors:
- 'DirectoryController: entities[ODDRN]; ODDRN prefix is the canonical grouping key
  for data-source-type aggregation'
- 'AlertManagerController: entity_oddrn label is the only routing key — alerts without
  it become orphaned'
evidence:
- DirectoryController.md:concepts.entities.[ODDRN]
- DirectoryController.md:implicit_adrs.[2] (ODDRN prefix as canonical grouping key)
- AlertManagerController.md:concepts.invariants.[entity_oddrn-only routing]
