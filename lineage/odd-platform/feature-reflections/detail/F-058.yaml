      is out of this file's scope and not captured in the sidecar. Whether SearchInput
      debounces internally is undetermined — it requires reading the shared component
      or observing the network tab while typing. If it does not debounce, every
      keystroke is a server round-trip.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: performance.known_performance_gaps[0]
        cite: "LookupTables.tsx:50-71"
