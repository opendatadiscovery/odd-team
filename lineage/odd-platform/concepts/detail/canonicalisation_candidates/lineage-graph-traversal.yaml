proposed_canonical: Lineage Graph Traversal
rationale: 'NEW concept from batch 2026-05-12F (getDataEntityDownstreamLineage). The
  platform''s lineage-graph read interface — `GET /api/dataentities/{id}/lineage/downstream`
  (sibling `/upstream`) — walks `lineage` table edges via Postgres `WITH RECURSIVE`
  CTE with two client-driven inputs (`lineage_depth` recursion bound + `expandedEntityIds`
  progressive expansion fan-out). main-concepts.md names `Data Lineage` as a Data
  Governance pillar but does NOT name the API surface, the recursion-bound mechanism,
  the dual-input expansion model, or the cross-owner-enumeration semantics. Two doc-bugs
  on `/developer-guides/api-reference/lineage` (the null-default claim + the group-only
  `expanded_entity_ids` claim) need correction. Strong member of the Read-collaborative
  cross-owner enumeration invariant (5-sidecar) — graph-shaped enumeration is a unique
  blast-radius shape because lineage edges leak causal connections between entities
  owned by different teams. HIGH-priority canonicalisation candidate: extend main-concepts.md''s
  Data Lineage section + fix the API-reference doc-bugs.'
contributing_concepts:
- DataEntity root (getDataEntityDownstreamLineage)
- LineagePojo edges in `lineage` table
- DataEntityLineage response graph DTO
- LineageDepth wrapper for recursion bound
- DataEntityLineageNode / DataEntityLineageEdge
- Single-query recursive-CTE traversal (implicit_adrs.[0])
- Client-driven progressive-expansion model (implicit_adrs.[1])
suggested_add_to_docs: true
