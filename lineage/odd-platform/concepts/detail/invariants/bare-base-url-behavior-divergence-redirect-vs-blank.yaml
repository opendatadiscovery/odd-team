name: Bare base-URL behaviour diverges — some pillars redirect to canonical first tab, others render blank
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-02
  - P-03
  - P-06
  - P-08
description: |-
  **NEW MEDIUM-severity INVARIANT, batch ZH (2026-05-26)**. The SPA's
  multi-tab pillar routes diverge in how they handle the BARE base URL
  (the URL with no sub-tab fragment):

  **Redirect convention** (the bare URL is NOT a renderable view; it
  bounces to the canonical first tab):
    - `/data-modelling` -> `/data-modelling/query-examples` via
      `<Navigate to='query-examples' />` at DataModellingRoutes.tsx:16
    - `/alerts` -> `/alerts/all` (same pattern per the alerts route
      sidecar implicit_adrs.[4])
    - `/management` -> `/management/namespaces` via `<Navigate
      to='namespaces' replace />` at ManagementRoutes.tsx:151

  **Blank convention** (the bare URL matches a parent route with no
  default child, no element, and no fallback — renders nothing
  beneath the toolbar):
    - `/master-data` — App.tsx:60-89 declares no /master-data route
      at all; the toolbar tab navigates DIRECTLY to /master-data/
      lookup-tables. Typing /master-data renders no element match;
      no 404, no redirect (per masterData route sidecar
      bugs_limitations_corner_cases.[0])
    - `/terms` — App.tsx:66 declares `<Route path={termsPath()}>`
      as a PARENT route with one child :termId/* and NO index route
      and NO element prop. React Router matches the parent but has
      nothing to render. The Dictionary tab navigates to /termsearch
      (a DIFFERENT base path); typing /terms renders blank (per
      terms route sidecar bugs_limitations_corner_cases.[0],
      pinned by P-164).

  **The operator-visible failure mode is the same** in both
  blank-convention cases: someone deep-links to the bare base URL
  (bookmark, external link, hand-typed) and sees the global toolbar
  but no content beneath it. No 404, no error message, no redirect.
  The Master Data toolbar tab also lights up as 'selected' via
  ToolbarTabs.tsx:101 substring match on 'master-data' — so the
  operator KNOWS they navigated to Master Data successfully but
  sees no page. The terms case is more severe because the docs
  imply a list view exists at the Dictionary tab (per the live
  Business Glossary page WebFetched 2026-05-26 status 200: 'The
  Dictionary tab is the catalog-wide list of all terms') — an
  operator deducing 'maybe at /terms' gets the blank page.

  **The redirect convention is the correct one** — every multi-tab
  pillar's bare base URL SHOULD redirect to the canonical first
  tab. The masterData and terms divergences are gaps:
    - masterData: when the pillar adds a second sub-feature
      (currently only Lookup Tables), the convention break shifts
      from cosmetic to operator-confusing (the operator landing
      on /master-data would expect a sub-feature chooser, not
      blank).
    - terms: the /terms parent could be assigned `<Route index
      element={<Navigate to=':someId/overview' />} />` for a default
      term, OR simply not have a /terms parent at all (move
      termDetails to a self-contained mount). Today the parent
      is structurally necessary because termDetailsPath uses
      /terms/:termId — so the index-route fix is the
      minimum-viable correction.

  **Cross-batch observation (LSN-018 coherence)**: the redirect
  convention is consistent across alerts (batch ZH alerts route
  sibling), dataModelling (batch ZH dataModelling), and management
  (batch ZH management). The two divergences (masterData, terms)
  share the failure mode but are STRUCTURALLY DIFFERENT —
  masterData has no /master-data parent route at all; terms has
  a parent route with no element. The fix shapes differ accordingly.

  vocabulary_status: codebase-anchored. The redirect convention is
  observable but not named in any documentation. Surfaces for
  canonical-vocabulary review (worth promoting to a pattern
  doc page).

  ## STRENGTHENED — batch ZJ (2026-05-26)

  Batch ZJ adds the AppErrorPage.tsx primary-source sidecar
  (odd-platform__ts__components_shared_elements_AppErrorPage__ui-shell-widget__AppErrorPage.md)
  with the STRUCTURAL ROOT-CAUSE evidence:

  **No path='*' catch-all route exists in App.tsx**. The 11 `<Route>`
  entries at App.tsx:59-89 are explicit; none has `path='*'`. React
  Router DOM v6's NO-MATCH behaviour is to render NOTHING inside
  `<Routes>`. The AppToolbar (line 56) still renders, but the
  route-body area is empty. Verified by grep on
  `path=['"]\*['"]|NotFound|Page404|404Page|NoMatch` over
  odd-platform-ui/src returning NO matches.

  **No React error boundary anywhere in the platform UI**. Grep on
  `ErrorBoundary|componentDidCatch|getDerivedStateFromError` over
  odd-platform-ui/src returns ZERO matches. The closest is
  AppSuspenseWrapper (Suspense only, no error handling). The
  AppErrorPage widget is NOT an error boundary; it is a controlled
  render helper consumed by 23 page-level components only.

  **The architectural absence is the cause**. This invariant
  previously identified the OBSERVATION (some routes blank, some
  redirect); batch ZJ pins the CAUSE: the SPA has no global
  catch-all + no error boundary. Therefore:
    - bare URLs that don't match any explicit route -> blank
    - parent routes with no element + no index -> blank
    - synchronous JS render errors -> blank (whole tree unmounts)
    - lazy chunk-load failures -> blank or indefinite Suspense

  Every blank-page report the operator files traces to one of these
  four structural absences. AppErrorPage's scope is ONLY async-
  thunk-rejection paths (e.g. /terms/9999 -> backend 404 ->
  fetchTermDetails rejects -> AppErrorPage shows '404'); the
  routing-layer fall-through is OUTSIDE its scope.

  **A 5-line fix would close ALL bare-base-URL fall-through cases**:
  adding `<Route path='*' element={<AppErrorPage showError
  error={{status: 404, statusText: 'Page Not Found', url: '',
  message: ''}} />} />` to App.tsx:89. This routes /master-data,
  /terms, AND any unknown URL to a uniform 404 surface. The fix is
  named in the AppErrorPage sidecar (bugs_limitations_corner_cases.[0]).

  Captured as a separate dedicated invariant
  `no-react-error-boundary-no-catch-all-route-blank-page-root-cause`
  for the broader architectural-absence framing (4 failure modes,
  not just 2 routes).

  Probe P-176 emitted (batch ZJ) to runtime-verify bare /terms and
  bare /master-data both show blank below-toolbar pane (not
  AppErrorPage, not 404).
