behaviour: |-
  **HIGH — `getPopularTagList` + per-entity-tag-editors compose to a full directory bypass: an authenticated user with `DATA_ENTITY_TAGS_UPDATE` (or `TERM_TAGS_UPDATE` / `DATASET_FIELD_TAGS_UPDATE`) — but explicitly NOT `TAG_CREATE` — can both READ the global tag directory (via the ungated `GET /api/tags`) AND WRITE to it (via the side-door `getOrCreateTagsByName` chain). The controller-defended `TAG_CREATE` permission is effectively bypassed in BOTH directions.** Primary-source confirmed in batch-W TagController sidecar:

  **Read-side: GET /api/tags is ungated** (per TagController.md:bugs_limitations_corner_cases):
  - `TagController.getPopularTagList` (lines 37-44): no `@PreAuthorize`.
  - `SecurityConstants.java:138-142`: only 3 entries for `/api/tags*` — POST (TAG_CREATE), PUT (TAG_UPDATE), DELETE (TAG_DELETE). NO GET entry.
  - `AuthorizationCustomizer.java:29-30`: catch-all `pathMatchers("/**").authenticated()` — any authenticated user reaches the GET endpoint.

  **Write-side: 4 side-door paths bypass TAG_CREATE** (per TagController.md:bugs_limitations_corner_cases):
  - `TagServiceImpl.updateRelationsWithDataEntity → getOrCreateTagsByName` (TagServiceImpl.java:105) — DATA_ENTITY_TAGS_UPDATE caller mints tags.
  - `TermServiceImpl.upsertTags → getOrCreateTagsByName` (TermServiceImpl.java:257) — TERM_TAGS_UPDATE caller mints tags.
  - `DatasetFieldServiceImpl → getOrCreateTagsByName` (DatasetFieldServiceImpl.java:202, 266) — DATASET_FIELD_TAGS_UPDATE caller mints tags.
  - `ExternalTagIngestionRequestProcessor.process → getOrInjectTagByName → ingestData upsert` (ExternalTagIngestionRequestProcessor.java:104) — S2S ingestion caller mints tags.

  **The compound finding**:
  - **READ + WRITE** without TAG_CREATE: a per-entity-tag-editor user can both list the entire global tag vocabulary AND extend it with new tags, all without holding the dedicated `TAG_CREATE` permission documented per the Management → Tags tab.
  - **The TAG_CREATE permission gate is the controller's perimeter defence**: it gates the canonical `POST /api/tags` write surface. But the 4 side-door paths bypass the perimeter at the SERVICE layer (`getOrCreateTagsByName`).
  - **No service-tier check**: per TagController.md:security.known_security_gaps.[Service-tier zero-checks posture]: "`TagServiceImpl` performs no `@PreAuthorize` or programmatic permission checks (`:1-167` end-to-end). The controller perimeter is the SOLE authorisation defence."

  **What the docs claim vs what the code enforces** (per WebFetch 2026-05-20):
  - Live `https://docs.opendatadiscovery.org/features/data-discovery/tagging` (status 200): describes `TAG_CREATE` as "Create a new tag in the catalog vocabulary"; describes `TAG_UPDATE` / `TAG_DELETE` as "vocabulary-level mutations". Does NOT name `DATA_ENTITY_TAGS_UPDATE` as a second write path into the directory.
  - Live `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions` (status 200): names `TAG_CREATE` AND `DATA_ENTITY_TAGS_UPDATE` separately. Says `DATA_ENTITY_TAGS_UPDATE` "Allows editing a data entity's tags." Does NOT describe any mechanism by which `DATA_ENTITY_TAGS_UPDATE` can create new global tags.
  - Operators authoring RBAC policies that GRANT `DATA_ENTITY_TAGS_UPDATE` but WITHHOLD `TAG_CREATE` reasonably expect that grantees cannot mint new tags. The code contradicts that expectation.

  **Operator-impact**:
  - A "data-entity-tagger" Role intended for analysts (with `DATA_ENTITY_TAGS_UPDATE` only) can pollute the global tag vocabulary indefinitely. The Management → Tags tab (intended as the controlled-vocabulary surface) is effectively ungated.
  - Read-side enumeration: an authenticated auditor with ZERO `TAG_*` permissions can list every tag in the catalog (which may include tags reflecting internal team names, project codenames, sensitivity classifications).

  **Why HIGH not MEDIUM (the sidecar's own rating)**: the sidecar rates the side-door write paths HIGH (per security.known_security_gaps.[Side-door directory growth]). The read-side is MEDIUM in isolation. The COMPOUND (read+write bypass on the same permission) is HIGH because operators authoring RBAC reason about WHERE permissions gate — and the platform's design says TAG_CREATE gates writes, but the code has 4 bypass paths AND no read gate at all. The aggregate is a perimeter-defence collapse.

  **Test gap shape**: regression-pin asserting: (a) authenticated user with NO `TAG_*` permissions can GET `/api/tags` and receive a full result set; (b) authenticated user with `DATA_ENTITY_TAGS_UPDATE` ONLY (no `TAG_CREATE`) can `POST /api/dataentities/{id}/tags` with novel tag names and successfully create them; (c) the new tags appear in `GET /api/tags` for that user (verifying the side-door's write IS observable via the controller's read); (d) `POST /api/tags` (direct creation) fails with 403 for the same user. The current state is PINNED — failures land if a future maintainer adds RBAC gating to the side-door paths.
