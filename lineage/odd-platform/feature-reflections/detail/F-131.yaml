# Query Example Authoring Dialog — product-owner reflection

## product_owner_narrative

The Query Example Authoring Dialog is the single screen a data engineer or steward uses to write down *how a dataset is meant to be queried* and pin that knowledge to the catalog. It is a modal dialog — there is no dedicated authoring page — opened from two places that both route through the SAME `QueryExampleForm` component: an "Add" button on the Query Examples catalog list (gated behind `<WithPermissions permissionTo=QUERY_EXAMPLE_CREATE>`), and an "Edit" button on a snippet's details page (gated behind `QUERY_EXAMPLE_UPDATE`) (per F-131 `discovered_from_entry_point`; QueryExampleForm.tsx:1-145). The dialog presents exactly two fields: **Definition** — a plain single-line `<Input>` for the human, prompt-style description of what the snippet does — and **Query** — a 200px-tall embedded Markdown editor (`@uiw/react-md-editor` in `preview='edit'` mode) holding the executable SQL / KQL / Spark body (QueryExampleForm.tsx:79-113). The author writes both, clicks "Add query example" (create) or "Save query example" (edit), and lands on the snippet's details page (QueryExampleForm.tsx:63-66).

The interaction the user actually lives through is shaped by three deliberate choices, all verified from the form source. First, **validation is presence-plus-trim only**: each field carries `rules={{ required: true, validate: value => !!value.trim() }}` and the form validates live (`mode: 'onChange'`); the submit button is disabled until both fields are non-empty-after-trim (`disabled={!formState.isValid}`, QueryExampleForm.tsx:83, 94, 124). There is no length cap, no character allowlist, no SQL/Markdown syntax check — exactly what the live doc now states verbatim ("validates only that the `definition` and `query` fields are non-empty — there is no length cap, no HTML-content allowlist", per WebFetch 2026-06-03). Second, **the dialog has no dirty-form guard**: it is wrapped in `DialogWrapper` with no navigation-warning or draft-persistence hook, so an author mid-snippet who hits Escape, clicks outside, or browser-backs loses the entire in-progress body silently (QueryExampleForm.tsx:128-141; live doc confirms). Third, **the two fields are authored in different modes but rendered in the same mode**: Definition is a plain Input at authoring time yet is rendered through the Markdown renderer on the details page (`QueryExampleDetailsOverview.tsx:19`), so an author who types `**bold**` or a `[link](javascript:...)` into Definition sees plain text in the form and rendered Markdown on save (per F-131 facet `..._definition_is_plain_input_not_markdown...`; live doc confirms).

On submit, the dialog calls one of two React-Query mutation hooks. The create path (`useCreateQueryExample`) fires the POST, shows a "Query Example successfully created!" toast, and invalidates NO query cache (queryExamples.ts:32-41). The edit path (`useUpdateQueryExample`) fires the PUT, toasts, and invalidates ONLY the single details query for that snippet (`['getQueryExampleDetails', id]`) — not the catalog list, not the per-dataset tab, not the per-term tab (queryExamples.ts:43-60). Because the post-submit navigation lands the user on the details page (which refetches fresh), the snippet they just authored looks correct *there* — but the catalog list and the in-context dataset/term tabs they came from are not refreshed. This is the load-bearing contradiction this reflection surfaces (H-006): the success toast promises the catalog now has their example; the list cache says otherwise until a manual refetch.

The dialog is the FIRST point in the platform's stored-XSS chain (the F-004 family) where a client-side allowlist could intervene cheaply, and it does not (per F-131 facet `..._authoring_xss_chain_first_intervention_point_uncaptured`; controller sidecar `bugs_limitations_corner_cases.[6]`). The body the author types is passed verbatim to the API (`QueryExampleController.createQueryExamples` / `updateQueryExample`, controller sidecar `operations`), stored verbatim as `text NOT NULL` (V0_0_84__create_query_example.sql:5 per the flow hop-3 evidence), indexed verbatim into the FTS search vector (`QueryExampleServiceImpl.java:166-167`, flow hop-4), and rendered through the same unsanitised `MDEditor.Markdown` on every reader's screen. The authoring-time gap and the render-time gap are the same defence-in-depth hole seen from two ends; both are now documented (DOC-183, shipped) and both are tracked as a platform bug (PLT-018).

This feature sits inside the broader Query Examples CRUD + Faceted Search feature (F-025, whose own v0.3.0 reflection covers the endpoint-level read-collaborative posture, the delete-cascade asymmetry, and the audit silence). F-131's distinct contribution is the AUTHORING SCREEN itself — the form, its validation, its dirty-state handling, and the create/update cache contract — none of which F-025's endpoint-anchored hypotheses reach. Its cross-pillar edges are inherited: the snippet links to data entities (P-01) and glossary terms (P-06), but those linkage operations are authored elsewhere (the dataset/term detail pages, via `DataEntityController` / `TermController`), not in this dialog.

