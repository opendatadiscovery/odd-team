proposed_action: |-
  **Phase 1 — Vitest dispatcher contract tests** (5 unit tests covering the dispatch decision matrix):

  1. `renderLineage_userLacksOwnerRelationToEntity_currentlyRoutesToSubtree_pinsReadCollaborativePosture` — render `<Lineage />` with mocked Redux state representing a user with no Owner relation to the entity. Assert the subtree mounts (HierarchyLineage or DEGLineage based on isDEG). PINS the current read-collaborative posture.

  2. `renderLineage_userHasOwnerRelationToEntity_routesToSubtree_pinsHappyPath` — same with Owner relation present, assert subtree mounts. PINS the happy path.

  3. `renderLineage_isDEGtrueAndIsLoadedTrue_mountsDEGLineageInsideJotaiProvider_pinsDispatcherContract` — assert the jotai Provider wraps DEGLineage on the DEG branch (line 20-22 of Lineage.tsx).

  4. `renderLineage_isDEGfalseAndIsLoadedTrue_mountsHierarchyLineageWithoutProvider_pinsDispatcherContract` — assert no jotai Provider on the non-DEG branch.

  5. `renderLineage_isLoadedFalse_returnsNull_pinsRenderNullGuard` — assert the render-null guard at line 17.

  **Architectural fix decision** (maintainer policy call):
  - Option A (preserve read-collaborative posture per ADR-CANDIDATE-003): the test PINS the contract; UI defense-in-depth is intentionally absent
  - Option B (add UI-layer defense-in-depth at the dispatcher): add `<RestrictedPlaceholder />` short-circuit; test flips assertion direction

  Coherence note (LSN-018 Rule 6): STRENGTHENS F-005 + F-016 by establishing the UI dispatcher tier as the single defense-in-depth chokepoint. NO contradiction with existing artefacts. The read-collaborative posture is consistent across the codebase (Search, Directory, Popular, Lineage all share the stance); the Lineage dispatcher is the cheapest place to add a defense-in-depth check IF the maintainer ever wants one.
