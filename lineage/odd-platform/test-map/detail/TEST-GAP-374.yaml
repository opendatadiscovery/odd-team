evidence:
- 'AlertServiceImpl.md says: ''The @ActivityLog AOP is @Profile("!integration-test")
  — activity emission for updateStatus is SILENTLY DISABLED in integration tests'''
- 'ActivityAspect.java:24 — the @Profile guard'
- 'AlertServiceImpl.java:111-112 — the only @ActivityLog-annotated method on this file'
cross_references:
- 'cross_cutting_pattern: SYSTEMIC — every @ActivityLog-annotated service method in
  the codebase (AlertService, DataEntityService, RoleService, OwnerService, ...) has
  this trap. A backlog item should propose extending the testing strategy with an explicit
  unit-test profile that DOES run ActivityAspect.'
- TEST-GAP-221 (Role no-audit-log) — sibling pattern
