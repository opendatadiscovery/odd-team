- id: H-002
  hypothesis: "When two namespaces are created with names that differ only in case ('finance' and 'Finance'), both succeed and are stored as two distinct namespaces."
  derivation: "Repository getByName uses NAMESPACE.NAME.eq (case-sensitive byte-equality); unique index over (name) with no case-folding; NamespaceForm applies no normalisation."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      ReactiveNamespaceRepositoryImpl.getByName uses `NAMESPACE.NAME.eq(name)` (line 26), a case-sensitive
      comparison, and the partial unique index is over raw `(name)` with no `lower()` expression. No
      case-fold hook exists at controller, mapper, or repository tier (NamespaceMapper.java:1-29). So
      'finance' and 'Finance' do NOT collide on the unique index and both persist. NOTE the cross-pillar
      DIVERGENCE: TermServiceImpl treats the namespace natural key as case-INSENSITIVE (`equalIgnoreCase`,
      ReactiveTermRepositoryImpl.java:156-157) — so the SAME namespace name is matched case-insensitively
      when reached via the term side-door but case-sensitively when reached via NamespaceController. This
      is an internal inconsistency worth a caveat.
    evidence:
      - sidecar: odd-platform__java__NamespaceController__controller-class__NamespaceController
        section: concepts.invariants[4] + bugs_limitations_corner_cases[3]
        cite: "ReactiveNamespaceRepositoryImpl.java:26 + V0_0_31__add_deleted_at_field.sql:25"
        note: "case-sensitive eq + no case-fold on the unique index."
      - sidecar: odd-platform__java__service__service__TermServiceImpl
        section: concepts.invariants
        cite: "ReactiveTermRepositoryImpl.java:156-157,167 (equalIgnoreCase)"
        note: "term-side namespace lookup is case-INSENSITIVE — opposite of the namespace-controller path."
    operator_visible_failure: |
      An operator who created 'finance' and later types 'Finance' (or vice versa) on the Namespaces form
      gets a SECOND namespace silently, splitting the label dimension: tags/terms/entities scoped under
      'finance' and 'Finance' are now in two different scopes that look identical in a list and on pills.
      Worse, because the term side-door matches case-insensitively, a term author typing 'Finance' may
      bind to the existing 'finance' row, while a datasource author typing 'Finance' via the same combo-box
      could land differently — the same typed string resolves to different namespaces depending on the
      entry path. No UI warning, no doc caveat.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    note: "No test asserts that 'finance' + 'Finance' produce two distinct ids (NamespaceServiceImplTest + NamespaceRepositoryImplTest both use random UUID names — they never collide on case). Promise hand-proven from code, untested."

