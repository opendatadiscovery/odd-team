mitigations_unimplemented:
- |-
  Add a startup-time check (Spring @PostConstruct on ActivityServiceImpl):
  iterate every ActivityEventTypeDto value, dispatch to the matching
  handler, check whether the handler overrides
  `getUpdatedState(parameters, List<Long>)` via reflection
  (`handler.getClass().getMethod("getUpdatedState", Map.class,
  List.class).getDeclaringClass() != ActivityHandler.class`). For each
  event type that has a non-overriding handler AND is reachable from
  a multi-id @ActivityLog method, fail-fast at bean initialization.
- |-
  OR: refactor the interface contract — promote multi-id support to a
  separate sub-interface (BatchedActivityHandler), with a
  `instanceof BatchedActivityHandler` check at the multi-id call site
  in ActivityServiceImpl.getUpdatedInfo. Throws a cleaner error
  ("handler X does not support multi-id batch") at the call site
  with a typed dispatch instead of a runtime exception.
- |-
  OR: implement the multi-id default at the interface level as a
  N×single-id composition:
    ```java
    default Mono<Map<Long, String>> getUpdatedState(
        Map<String, Object> parameters, List<Long> dataEntityIds) {
      return Flux.fromIterable(dataEntityIds)
          .flatMap(id -> getUpdatedState(parameters, id)
              .map(s -> Tuples.of(id, s)))
          .collectMap(Tuple2::getT1, Tuple2::getT2);
    }
    ```
  Cost: N DB reads instead of 1 batch read; correctness gain.
  Trade-off: silently slow when called from a non-batch-aware caller.
- |-
  Add a test
  `ActivityHandlerContractTest.testMultiIdGetUpdatedState_UnsupportedHandlers_ThrowsUnsupportedOperation`
  per the ActivityHandler sidecar's recommended test name. Pin the
  current contract until the fix lands.
- |-
  Document the contract on the activity-feed feature page (or an
  internal architecture note): "ActivityHandler.getUpdatedState
  multi-id default throws at runtime. Maintainers adding new
  @ActivityLog methods that pass a List<Long> dataEntityIds must
  explicitly override the multi-id method on the corresponding
  handler."
notes: |-
  NEW invariant captured in batch VAL-LSN-019-B. Surfaced by primary-source
  examination of ActivityHandler.java line-by-line + Glob enumeration
  of the 18 concrete handler implementations.

  This is a LATENT REGRESSION invariant — the bug is dormant in the
  current codebase (only DATA_ENTITY_CREATED uses the multi-id path)
  but the interface contract advertises a polymorphic batch path
  that is silently unsupported by 14 of 16 impls. Future maintainers
  adding bulk operations are likely to hit it.

  Cross-cutting connections:
    - Pairs with `activity-handler-state-differ` (new entity) — the
      multi-id contract is part of the dispatch core's interface;
      this finding is "the interface advertises more than the impls
      deliver"
    - Pairs with `activity-write-tx-coupled-emit-failure-rolls-back-business-mutation`
      — the @ReactiveTransactional emit-or-fail semantic means a
      multi-id call hitting the throwing default would also roll
      back the whole bulk business mutation (large blast radius)

  PRIMARY-SOURCE confidence: HIGH (Glob enumeration of 18 concrete
  impls in service/activity/handler/; line citations to the two
  override impls; ActivityIngestionRequestProcessor.process as the
  sole multi-id caller verified via Grep across the codebase).
