behaviour: |-
  `LineageDepth.empty()` sentinel encoding regression-pin (LOW — P-05; fragile encoding). The `getLineageRelations` implementation guards the recursive branch via `tDepth.lessThan(lineageDepth.getDepth())` (`ReactiveLineageRepositoryImpl.java:174`). With `LineageDepth.empty()` (`LineageDepth.java:16-18`: `depth=-1, empty=true`), the guard becomes `tDepth < -1` (never true) and the recursive UNION ALL never fires — single-hop only. **CRITICAL fragility**: the recursive CTE termination predicate reads ONLY the `int depth` field via `tDepth.lessThan(lineageDepth.getDepth())`; the `boolean empty` flag (set to `true` by `LineageDepth.empty()`) is NEVER read by the CTE. The current behaviour (recursion terminates after seed step when depth=-1) depends on the SQL semantics of `lessThan(-1)`, NOT on an explicit `if (empty) return seed` branch. A future refactor changing the termination predicate to `lessThanOrEqual` would SILENTLY EXPAND this endpoint to two hops without any test catching it — because the `empty()` semantic is encoded only by the magic `-1` integer, not by a dedicated code path. The dual-encoding at `LineageDepth.java:8-19` (boolean `empty` + int `depth`) is misleading — a maintainer reading `LineageDepth.empty()` could reasonably misinterpret it as 'no depth limit / unlimited recursion' rather than 'single-hop only'. NO test pins the single-hop semantic. Cross-link to batch H DOC-GAP-105 (recursive CTE no upper bound).
