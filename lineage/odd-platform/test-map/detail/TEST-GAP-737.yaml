proposed_action: |-
  Add `OwnerAssociationManualMappingSelfBindTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `createUserOwnerMapping_adminSelfBindsToOwner_succeeds_auditTrailHasNoSuspicionFlag` — authenticate as Admin user with OWNER_RELATION_MANAGE; POST `/api/owners/mapping` with `{ oidcUsername: <admin's-own-username>, provider: <admin's-own-provider>, ownerId: 42 }`; assert HTTP 200; verify USER_OWNER_MAPPING row exists; verify the `REQUEST_MANUALLY_APPROVED` activity row is authored by the Admin themselves (self-approve). PIN the self-bind chain.
  2. `createUserOwnerMapping_adminBindsNonExistentUserIdentity_succeeds_danglingMappingPersists` — POST with `oidcUsername: "non-existent-user-" + UUID.randomUUID()`; assert success; assert NO existence check fired; assert the mapping persists indefinitely until manually deleted.
  3. `createUserOwnerMapping_silentlyCancelsCollidingPendingRequests` — pre-seed a PENDING owner_association_request from user X to owner Y; Admin POSTs /api/owners/mapping with `(X, provider, Y)`; assert the manual mapping succeeds AND the pre-existing PENDING request is silently DECLINED (per `cancelAssociationByOwnerId/Username` chain); assert the cancelled-request author is NOT notified.
  4. `createUserOwnerMapping_callerWithoutOwnerRelationManage_returns403` — pin the positive contract: WITHOUT OWNER_RELATION_MANAGE, the endpoint returns 403.

  Add a `// REGRESSION-PIN — MANUAL-mapping flow allows self-bind by Admin without second-Admin approval. Audit-trail records the event but does not flag self-bind. A REFACTOR that rejects self-bind (formData.username == currentUser.username) will break test #1; a REFACTOR adding identity-existence check at the auth source will break test #2.` comment block.

  Pair with REFACTOR-NNN: at OwnerAssociationRequestServiceImpl.createManualAssociationRequest, add (a) self-bind rejection; (b) existence-check via AuthIdentityProvider.lookupUser; (c) flag REQUEST_MANUALLY_APPROVED rows where authoring user == bound user with a SUSPICIOUS_SELF_BIND audit-type variant. Pair with DOC-NNN: surface the MANUAL-mapping flow on the live doc page.
