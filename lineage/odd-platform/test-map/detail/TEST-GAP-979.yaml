behaviour: |-
  **The `/history` UI tab returns HTTP 500 — silently UNAVAILABLE — exactly while a Data Quality test is in flight, because the wire enum `DataEntityRunStatus` (6 values) is missing the `RUNNING` literal that the DB column `data_entity_task_run.status` carries (7-value `IngestionTaskRunStatus` per `IngestionTaskRun.java:28-36`).** When `getDataEntityRuns(...)` returns a result set containing ANY row with `status='RUNNING'`, the `DataEntityRunMapper.java:13-14` flat-maps the String → wire enum target; MapStruct's String-to-enum conversion strategy uses `Enum.valueOf()` which throws `IllegalArgumentException` on unknown literals. Without an `@onError` fallback at the mapper level or a `.onErrorResume` at the controller layer, the exception propagates to the global `ControllerAdvice` and becomes HTTP 500.

  **Operator-visible failure**: the moment an operator MOST wants to see the run-history page (to monitor an in-flight test) is exactly when the page breaks. The UI displays "Something went wrong" with no path forward; the operator has no signal that the failure is correlated with the in-flight status, no workaround documented, no graceful degradation. Once the in-flight test completes (status transitions to SUCCESS/FAILED/etc.), the page magically works again — a Heisenbug from the operator's perspective.

  **NULL end_time compounds**: a RUNNING task has `end_time=NULL`; Postgres default for `ORDER BY end_time DESC` is NULLS FIRST (`ReactiveDataEntityTaskRunRepositoryImpl.java:178` — no `NULLS FIRST/LAST` directive), so RUNNING rows appear AT THE TOP of the result set — guaranteeing the failure case fires on EVERY request during an in-flight test.

  **Why this is the worst kind of test gap**: pure repository-tier testing CANNOT catch this — the SQL is correct; the bug is at the SQL→Java mapper boundary. Pure unit testing of `DataEntityRunMapper` would catch it ONLY if the test deliberately constructs a Pojo with `status='RUNNING'`. The current `DataEntityRunRepositoryImplTest.java:34-93` does seed a RUNNING row (line 50) but only tests `paginate(...)` not `getDataEntityRuns(...)` — the mapper boundary is never exercised on RUNNING input.
