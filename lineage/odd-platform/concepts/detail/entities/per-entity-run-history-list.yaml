notes: |-
  The per-entity run-history surface is conceptually a peer of the
  catalog-wide `data-quality-dashboard` (P-04:F-002 aggregate view)
  and of the per-dataset Test Reports tab (F-022 — DataSetTestReport
  DTO). Three distinct surfaces, three different DTOs, all consuming
  the `data-entity-run-status` enum (and all surfacing the same
  6-vs-7 wire-enum-asymmetry risk if a RUNNING row appears).

  Pairs with:
    - operation:list-runs-for-data-entity (the operation backing
      this entity)
    - entitie:data-entity-task-last-run (the DENORMALISED PK-per-test
      table used by the DASHBOARD; this entity reads from
      data_entity_task_run, NOT from the denormalised table)
    - invariant:wire-enum-running-asymmetry-data-entity-run-status
      (the HIGH severity mapper-failure risk on RUNNING result rows)
    - invariant:read-collaborative-cross-owner-enumeration (the
      cross-owner read posture this is a 5th invocation site of)
