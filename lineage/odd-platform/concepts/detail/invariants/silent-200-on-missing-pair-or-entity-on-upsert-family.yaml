mitigations_unimplemented:
  - |-
    Add an existence-check pre-condition at the service layer: every
    `upsert*` endpoint on DataEntityController should call
    `reactiveDataEntityRepository.get(dataEntityId).switchIfEmpty(NotFoundException)`
    BEFORE the UPDATE, matching the pattern at `createMetadata`
    (lines 257-258).
  - |-
    Add a `switchIfEmpty(NotFoundException)` on the UPDATE's returning
    Mono — when the row predicate matches zero, the service should
    raise a 404 with a specific message rather than completing empty.
  - |-
    Document the contract drift on
    /developer-guides/api-reference — the OpenAPI operationId `upsert*`
    promises an UPSERT contract; the actual mechanism is UPDATE-only.
    Either rename the operations OR fix the implementation; either fix
    the docs explicitly.
  - |-
    Add regression tests:
      (a) PUT a non-existent (dataEntityId, metadataFieldId) pair —
          assert 404 (under the fix) OR 200 with empty body (under
          current behaviour — pin the current state).
      (b) PUT a non-existent dataEntityId on the description endpoint —
          same assertion shape.
  - |-
    Fix the UI's redux thunks to inspect the response body and emit a
    different toast for empty-body responses ("Metadata may not have
    updated — please verify the entity/field combination exists.") OR
    align with the backend fix once it lands.
notes: |-
  NEW invariant captured in batch 2026-05-19L. The pattern is the upsert
  family's sibling of the DELETE family's silent-204 pattern
  (silent-204-on-no-op-delete-vs-400-duplicate-on-no-op-add). Together
  they form a coherent ODD-platform "silent success on no-op" cluster —
  the maintainer must take an explicit stance per endpoint on whether
  "2xx means something happened" is the contract or not.

  Cross-cutting connections:
    - Pairs with "silent-204-on-no-op-delete-vs-400-duplicate-on-no-op-add"
      — the DELETE family's matching pattern; together they characterize
      ODD's "silently succeed on no-op writes" stance
    - Pairs with "Reactive Mono<ResponseEntity<...>>.map(ResponseEntity::ok)
      is the uniform success-response pattern" — the structural shape
      that ENABLES the silent-200 propagation through empty-Mono
      short-circuits
    - Cross-references "Operation name vs behaviour drift — create*-shaped
      operationId for replace-all semantic tag relations" — same class
      of OpenAPI-operationId-vs-implementation drift

  Three DOC-NNN candidates:
    (a) Document the silent-200 contract on /developer-guides/api-reference
        for the upsert family
    (b) Either fix the implementation (add existence checks) OR rename
        the OpenAPI operations from upsert* to update* to match
    (c) Add regression tests pinning the current behaviour so the
        contract drift is detectable
