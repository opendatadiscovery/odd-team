mitigations_unimplemented:
  - |-
    Layer 1 — service-tier verification at AttachmentServiceImpl: every
    mutation method takes dataEntityId AND fileId/linkId; verifies
    fileRepository.findById(fileId).getDataEntityId() == dataEntityId
    OR linkRepository.findById(linkId).getDataEntityId() == dataEntityId;
    throws NotFoundException OR BadUserRequestException on mismatch.
  - |-
    Layer 2 — controller-tier path-param forwarding at
    DataEntityAttachmentController: pass dataEntityId to the service in
    every mutation method signature.
  - |-
    Layer 3 — repository-tier filter at FileRepository / LinkRepository:
    every find/update/delete query accepts a parent-entity scope as part of
    the WHERE clause. Eliminates the cross-entity vector at the data layer.
  - |-
    Regression tests — five tests, one per mutation method:
      (a) Authenticate as user with DATA_ENTITY_ATTACHMENT_MANAGE on entity
          A but not entity B.
      (b) Issue the mutation against entity B's file/link via entity A's
          URL prefix.
      (c) Assert response is 403 OR 404 (under the fix) or 200 (under
          current behaviour — pin as regression boundary).
  - |-
    Live docs — disclose the URL-hierarchy-vs-resource-binding decoupling
    on the attachment-related docs. Operators authoring Policies must know
    that DATA_ENTITY_ATTACHMENT_MANAGE on entity A grants mutation access
    to ANY file/link in the platform until the fix lands.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20V from the
  DataEntityAttachmentController class-level sidecar. The finding is a
  direct cross-owner privilege escalation surface — visible only by
  cross-reading the controller signatures and the service signatures
  together.

  Cross-cutting connections:
    - Companion attachment finding: attachment-read-endpoints-no-securityrule-cross-owner-file-download
      (the read-side has NO permission gate at all; combined with this
      finding, downloadFile is reachable by ANY authenticated user)
    - Companion attachment finding: filename-path-traversal-and-crlf-header-injection
      (the filename surface compounds: user with MANAGE on A uploads a
      malicious filename targeting B's storage path)
    - REFACTOR-024 / REFACTOR-203 read-collaborative posture — this
      finding is the WRITE-SIDE compound of the read-collaborative
      posture; the platform's stance is read-collaborative for reads AND
      effectively write-collaborative for attachment mutations
    - Parent permission resolver: the DATA_ENTITY resolver pattern is the
      correct scope shape; the bug is that the controller's URL hierarchy
      is layout-only, not authorization-binding
    - F-006 audit-silence: attachment mutations have NO @ActivityLog (per
      the existing F-006 master) — the cross-entity write is also
      untraceable in the activity feed

  Three DOC-NNN candidates flow:
    (a) Code fix Layer 1 + Layer 2 + Layer 3 (defence-in-depth)
    (b) Regression tests pinning all five attack shapes
    (c) Doc admission disclosing the URL-hierarchy-vs-resource-binding
        decoupling until the fix lands
