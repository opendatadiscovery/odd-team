proposed_action: |-
  Add `OwnerAssociationActivityListUnauthorizedTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `getOwnerAssociationRequestActivityList_userWithZeroManagementPermissions_succeeds_exposesForensicTrail` — authenticate as a user with ZERO permissions (no OWNER_ASSOCIATION_MANAGE, no OWNER_RELATION_MANAGE, no DIRECT_OWNER_SYNC); GET `/api/owner_association_request/activity`; assert HTTP 200 with a paginated activity list response. PIN the current unauthorized-read surface.
  2. `getOwnerAssociationRequestList_userWithZeroManagementPermissions_returns403_pinsAsymmetry` — same authentication context; GET `/api/owner_association_request` (the LIST endpoint, NOT activity); assert HTTP 403 (the LIST endpoint IS gated). PIN the asymmetry between the two endpoints.
  3. `getOwnerAssociationRequestActivityList_underAuthDisabled_anonymousReadSucceeds` — pin the DISABLED-mode behaviour. Under auth.type=DISABLED, no authentication is required; the activity list is open to anonymous callers.

  Add a `// REGRESSION-PIN — GET /api/owner_association_request/activity has NO SecurityRule entry. The endpoint is read-collaborative-posture by accident, not by design — the LIST endpoint requires OWNER_ASSOCIATION_MANAGE; the ACTIVITY endpoint does not. A REFACTOR adding the SecurityRule will flip test #1 to 403 and break test #3 (under DISABLED the new rule may still allow anonymous access — depends on the rule's auth-mode-relevance).` comment block.

  Pair with REFACTOR-NNN: add `SecurityRule(NO_CONTEXT, /api/owner_association_request/activity, GET, OWNER_ASSOCIATION_MANAGE)` to SecurityConstants. Pair with DOC-NNN: surface the activity-log read endpoint on the user-owner-association doc page; document the OWNER_ASSOCIATION_MANAGE gate it should carry post-fix.
