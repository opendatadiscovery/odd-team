terminal_side_effect:
  side_effect_class: db-write
  description: |-
    Per-call: 1-3 writes against the Collector + Token tables.
    - REGISTER: 1× INSERT collector + 1× INSERT token + N× update FTS
      vectors (if applicable).
    - UPDATE: 1× SELECT collector + 1× UPDATE collector.
    - DELETE: cascade-check + 1× UPDATE collector SET deleted_at OR
      1× error response (USR004 CascadeDeleteException).
    - REGENERATE-TOKEN: 1× SELECT collector + 1× UPDATE token.value.
    - LIST: 0 writes (pure read; but no SecurityRule).
    Side-effects fan out to: `IngestionDataSourceFilter` (which
    consumes the token to populate WebSession-attribute Collector
    identity for `POST /ingestion/datasources`) +
    `IngestionDataEntitiesFilter` (which consumes the token to gate
    `POST /ingestion/entities` IFF
    `auth.ingestion.filter.enabled=true`).
  evidence: |-
    CollectorController.java:14-52 + CollectorServiceImpl (token
    generation via RandomStringUtils.randomAlphanumeric(40) +
    cascade-block + token rotation) +
    `ReactiveTokenRepositoryImpl.java:30-39` (token table write) +
    SecurityConstants.java:127-137 (four COLLECTOR_* permission gates) +
    application.yml:48 (filter default-off) +
    DisabledAuthSecurityConfiguration.java:11-19 (DISABLED bypass) +
    IngestionDataEntitiesFilter.java:38-56 (the token-consuming path).
  cardinality_per_call: 1-3 writes per call (varies by verb)
amplification_factor: 1
