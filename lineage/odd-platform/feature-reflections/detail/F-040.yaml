- id: H-002
  hypothesis: |-
    When an operator opens the History tab while one of the test's runs is
    currently in flight (status RUNNING, end_time not yet set), the page shows
    that in-flight run (e.g. a "running…" row) alongside the completed runs.
  derivation: |-
    Response-shape: the DB status column has a RUNNING value (IngestionTaskRun);
    negative-space: an operator watching a test execute expects to see it listed.
  seed_source: response-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The DB column data_entity_task_run.status accepts the 7-value
      IngestionTaskRunStatus enum INCLUDING RUNNING; the wire enum
      DataEntityRunStatus declares only 6 values (no RUNNING). DataEntityRunMapper
      flat-maps the String status into the wire enum via MapStruct's Enum.valueOf()
      strategy, which throws IllegalArgumentException on the unknown literal
      "RUNNING". With no onErrorResume in the reactive chain, the exception
      propagates to Spring's default handler → HTTP 500 for the ENTIRE response
      (not just the offending row). The dedicated doc page confirms this verbatim:
      "The page returns HTTP 500 while a test is currently running."
    evidence:
      - sidecar: DataEntityRunController
        section: "bugs_limitations_corner_cases[1] + concepts.entities.DataEntityRunStatus + stress_findings.request_inputs[status]"
        cite: "IngestionTaskRun.java:28-36; components.yaml:1407-1415; DataEntityRunMapper.java:13-14; MapperConfig.java:7-13"
        note: "7-value DB enum vs 6-value wire enum; strict valueOf mapper"
      - sidecar: DataEntityRunController
        section: "implicit_adrs[2]"
        cite: "DataEntityRunController.java:24-26"
        note: "no onErrorResume — mapper exception propagates as 500"
      - source_read_for_validation: true
        cite: "https://docs.opendatadiscovery.org/features/data-quality/test-run-history (WebFetch 2026-06-04)"
        note: "doc page documents the 500 verbatim — doc is ahead of code"
    operator_visible_failure: |-
      (a) The runs-history page is UNAVAILABLE (HTTP 500 / generic error) for a
      test the moment any run is in flight — which is exactly the moment an
      operator opens History to watch the execution. (b) The failure is
      all-or-nothing: a single RUNNING row poisons the whole page, so even the
      9 completed runs the operator could have seen are hidden. (c) The
      test-report preview (TestReportDetailsHistory, size=10) shares the
      endpoint, so the embedded preview on the test-report tab ALSO breaks
      while a run is in flight. (d) The status filter offers no escape: the
      operator cannot filter to "completed only" because RUNNING is not a wire
      value to exclude against; omitting the filter returns all rows including
      the poison row.
    severity: HIGH
    confidence: MEDIUM
    probe_id: PENDING-F-040-1
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    coverage_note: |-
      No test asserts the 500-during-RUNNING path. The new mapper unit test
      (DataEntityRunMapperImplTest) covers ONLY the empty-page PageInfo case —
      it does NOT feed a RUNNING-status pojo through the enum conversion.
      This is both a bug-candidate AND the regression guard the fix needs.

- id: H-003
  hypothesis: |-
    When an operator who does not own a dataset opens (or curls) the run
    history of a DQ test on that dataset, they are denied or see a redacted
    view — the per-run diagnostic text of another team's test is not readable
    by an unrelated signed-in user.
  derivation: |-
    Pillar mission (DQ is a per-team operator surface) + cross-pillar P-09
    Security boundary + the status_reason data-shape (free-form diagnostics).
  seed_source: cross-pillar + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      There is no owner-scoping anywhere in the chain. The controller has no
      @PreAuthorize; the endpoint has NO entry in SecurityConstants.SECURITY_RULES
      (grep over lines 98-355 returns zero matches for /runs); it falls through
      to AuthorizationCustomizer's .pathMatchers("/**").authenticated() catch-all.
      The repository filters only on DATA_ENTITY.ID and optional STATUS — no JOIN
      to ownership, no principal-derived predicate. Therefore ANY authenticated
      user reads ANY test's full run history including the verbatim status_reason
      diagnostic text. The dedicated doc page now states this plainly: "any
      signed-in user from one team reads every other team's per-run diagnostic
      text indefinitely."
    evidence:
      - sidecar: DataEntityRunController
        section: "security.authorization_assertions + security.owner_scoping + bugs_limitations_corner_cases[5]"
        cite: "SecurityConstants.java:98-355; AuthorizationCustomizer.java:29-30; ReactiveDataEntityTaskRunRepositoryImpl.java:161-191"
        note: "no rule entry, no @PreAuthorize, no ownership join — cross-owner read"
      - sidecar: DataEntityRunController
        section: "stress_findings.auth_gates"
        cite: "DataEntityRunController.java (no annotations); DataEntityRunServiceImpl.java (no permission call)"
        note: "wrong-role caller gets 200 OK + full payload (PROBE-NEEDED → P-152)"
    operator_visible_failure: |-
      (a) Any signed-in user reads any DQ test's failure history across the
      whole catalog regardless of which team owns the dataset — confidentiality
      boundary that operators reasonably assume exists does not. (b) The leaked
      payload is qualitatively worse than the namespaces/owners/tags already
      exposed by cross-owner read elsewhere: status_reason is free-form text the
      external framework wrote, routinely containing sample failing data VALUES
      (potential PII) and compiled SQL — per the doc page. (c) A non-owner can
      enumerate which datasets are tested and the failure cadence across the
      org (timing-side-channel for "which team's data is unhealthy right now").
      (d) Under auth.type=DISABLED the same surface is anonymously reachable.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    coverage_note: |-
      No security test exercises bob-reads-alice's-runs (P-152 is the pending
      probe). This is the REFACTOR-024 read-collaborative-catalog posture's 5th
      invocation site — if the maintainer adopts the documented posture as
      intentional, this is a caveat (and the doc already carries it); if the
      status_reason PII shape makes it a fix, it is a bug. Either way the
      regression guard (a cross-owner WebFluxTest) does not exist.

- id: H-004
  hypothesis: |-
    When an operator wants to see only the in-flight runs of a test, they can
    pass status=RUNNING to the runs endpoint and get back the currently-running
    executions.
  derivation: |-
    Endpoint shape: the status query parameter promises filtering by any run
    status; an operator monitoring live executions expects RUNNING to be filterable.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      The status query parameter is typed to the 6-value wire enum
      DataEntityRunStatus, which has no RUNNING literal. An operator literally
      cannot pass status=RUNNING — the request is rejected at OpenAPI
      deserialisation (400 invalid enum value). Their only path to seeing
      in-flight runs is to omit the filter and fetch all statuses — which then
      trips the H-002 mapper 500. So the in-flight-monitoring use case is
      unreachable through the documented API.
    evidence:
      - sidecar: DataEntityRunController
        section: "stress_findings.request_inputs[status]"
        cite: "components.yaml:1407-1415; ReactiveDataEntityTaskRunRepositoryImpl.java:166-168; IngestionTaskRun.java:28-36"
        note: "wire enum (6) is a strict subset of DB column values (7); RUNNING unfilterable"
    operator_visible_failure: |-
      (a) An operator monitoring a live DQ run has NO API path to list only
      in-flight runs. (b) The natural workaround (omit the filter) is the one
      that triggers the H-002 500, so the workaround is also broken. (c) The
      filter dropdown silently presents an incomplete set of the statuses that
      actually exist in the data — the operator cannot tell from the UI that a
      7th state exists in their database.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    coverage_note: |-
      Tied to H-002's fix (add RUNNING to the wire enum, or map-to-UNKNOWN).
      No test asserts the status=RUNNING rejection. Folds into the H-002
      regression-guard demand.

- id: H-005
  hypothesis: |-
    When an operator requests a runs page, the page size they ask for is
    bounded by a server-side maximum so that a malformed or hostile request
    cannot pull the entire run history in one response.
  derivation: |-
    Endpoint shape (size query parameter) + implicit functional/security
    requirement an operator of a catalog of this class assumes by default.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      OpenAPI SizeParam (components.yaml:4222-4229) declares int32 with no
      min/max. The Integer size flows verbatim through controller → service →
      repository → SQL LIMIT with no clamp anywhere. A curl with size=10000000
      reaches the DB as LIMIT 10000000; the window-function paginate plan is
      O(N) on the result set and would attempt to materialise that many rows
      through JOOQ + MapStruct + Jackson. The UI ships 100 (/history) and 10
      (/test-report), but nothing enforces those values on the wire.
    evidence:
      - sidecar: DataEntityRunController
        section: "bugs_limitations_corner_cases[0] + performance.known_performance_gaps[0] + stress_findings.request_inputs[size]"
        cite: "components.yaml:4222-4229; DataEntityRunController.java:19-26; ReactiveDataEntityTaskRunRepositoryImpl.java:180-181"
        note: "no @Max, no service clamp, no spec maximum"
    operator_visible_failure: |-
      (a) A single hostile or careless request (size=10000000) is a DoS surface:
      latency spike + API-tier memory pressure, possibly OOM, affecting all
      tenants on the instance. (b) There is no 4xx telling the caller their
      page size was unreasonable — the request is accepted and the damage is
      server-side. (c) Combined with the cross-owner read (H-003), an
      unauthorized-but-authenticated user can pull a very large slice of another
      team's run history in one shot.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional
    coverage_note: |-
      No performance/bounds test asserts a server-side cap. The fix is a
      @Max(N) on the param or a service clamp; the guard is a test asserting
      size beyond the cap is rejected or clamped.

