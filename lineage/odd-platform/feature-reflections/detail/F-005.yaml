- id: H-008
  hypothesis: "When an entity D is reachable from the root via two different paths (a diamond: root→B→D and root→C→D), the canvas shows D once — a single node with two incoming edges — so the user sees the true shape of the graph."
  derivation: "A lineage graph is a DAG; a user reasoning about 'what feeds D' expects D to appear once with its multiple inputs converging, not duplicated."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      D is rendered TWICE. The canvas builds a d3-hierarchy TREE (not a DAG):
      hierarchy(root, childAccessor) recursively visits children from each node with no
      visited-set check, so a node reachable via two paths yields two distinct
      HierarchyPointNode instances at different positions; React keys use `node.x${node.y}`
      so React mounts both SVG nodes (LineageGraph.md bugs[0] + implicit_adrs[2];
      generateGraph.ts:68-76, 108-116; LineageGraph.tsx:84-110). This amplifies the backend
      diamond behaviour (the recursive CTE materialises duplicate intermediate rows before
      the outer selectDistinct dedupes — ReactiveLineageRepositoryImpl.md downstream_side_
      effects) into the visual layer: a depth-D diamond with branching B renders all the
      duplicated instances. The choice is deliberate (tree layout for determinism, with
      cross-edges as an overlay) but the user-visible effect contradicts the single-node
      expectation.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LineageGraph
        section: bugs_limitations_corner_cases[0] + implicit_adrs[2]
        cite: "generateGraph.ts:68-76, 108-116 + LineageGraph.tsx:84-110, 91"
        note: "d3-hierarchy tree with no visited-set; diamond node duplicated; distinct React keys mount both."
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveLineageRepositoryImpl
        section: downstream_side_effects (getLineageRelations Set,depth,kind)
        cite: "ReactiveLineageRepositoryImpl.java:122-131, 163-175"
        note: "Backend CTE materialises duplicate intermediate rows; outer selectDistinct dedupes pairs but cost is paid."
    operator_visible_failure: |
      (1) Misleading topology: a user tracing convergence ("which sources feed D?") sees D
      appear in multiple places and may mis-count or mis-read the graph; the convergence
      structure is obscured rather than shown. (2) Render-cost amplification: diamond-heavy
      graphs mount duplicate SVG subtrees, doubling render work and worsening the
      no-virtualisation cost on large graphs. The behaviour is undocumented at the
      user-facing level (the data-lineage page does not mention diamond duplication).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-009
  hypothesis: "When the lineage graph contains a cycle (e.g. A→B→A, a transformer consuming its own downstream artefact), opening the canvas terminates quickly and renders a bounded graph — it does not hang or spike the database."
  derivation: "Real lineage graphs can contain cycles; an observability tool must handle them gracefully (visited-set, Postgres WITH...CYCLE, or a depth bound) rather than degrade."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      Statically, the recursive CTE has NO cycle guard: the body is UNION ALL with no
      visited-set and no Postgres `WITH ... CYCLE` clause; termination is solely
      `tDepth.lessThan(lineageDepth.getDepth())` (ReactiveLineageRepositoryImpl.md
      bugs/invariants; lines 168, 174). So a cycle terminates only via the depth bound —
      which is itself unbounded (H-003). The static reading says: with a bounded depth the
      walk terminates but materialises duplicated intermediate rows along the cycle; with a
      large depth on a cyclic graph the intermediate row growth before termination is the
      amplification surface. What is NOT known without running it: the actual wall-clock /
      DB-CPU profile for a representative cycle at a representative depth (does it complete
      in <5s on the minimal stack, or does it spike Postgres CPU?). That dynamic question
      is the load-bearing one for the user-facing claim and requires a probe.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveLineageRepositoryImpl
        section: downstream_side_effects (lineageCte) + invariants
        cite: "ReactiveLineageRepositoryImpl.java:150-176 (UNION ALL, no CYCLE clause, no visited-set)"
        note: "Static confirmation of no cycle guard; runtime cost profile unmeasured."
      - sidecar: odd-platform__java__service__service__LineageServiceImpl
        section: tests_coverage_semantic.uncovered_behaviours
        cite: "LineageServiceImpl.java:87-122 (no cyclic-graph test exists)"
        note: "No integration test seeds a cycle; behaviour is structurally unpinned."
    operator_visible_failure: |
      If the probe confirms a spike: a cyclic subgraph + a moderately-large depth can hang
      the canvas open and saturate Postgres CPU, degrading the platform for all users
      (amplified under DISABLED by anonymous reachability). Even at bounded depth the user
      sees duplicated nodes along the cycle (the diamond mechanism of H-008 applies to
      cycles too). The probe pins the wall-clock/CPU behaviour from the operator's seat.
    severity: HIGH
    confidence: MEDIUM
    probe_id: P-226
    routes_to_finding: bug-candidate

- id: H-010
  hypothesis: "When a user progressively expands many nodes via 'Load N more' during a long lineage-exploration session, the canvas lets them collapse expansions back, or otherwise bounds memory — the view does not grow without limit until the page is left."
  derivation: "Progressive disclosure UIs normally let the user undo an expansion; a senior product owner expects a 'collapse' affordance and bounded client memory for a long session."
  seed_source: ui-label
  validation:
    verdict: probe-needed
    actual_behavior: |
      Statically: the slice MERGES new nodes monotonically — `if
      (!localDownstreamState.nodeIds.has(node.id)) allNodes.push(node)` — with no
      remove-expansion action, no LRU eviction, no max-size cap; the LoadMore button hides
      itself after click but the underlying data stays; the accumulators are module-level
      mutable globals reset only on root-entity navigation (LineageGraph.md bugs[3] +
      implicit_adrs[5]; dataEntityLineage.slice.ts:30-48, 206-220, 281-282). There is no
      collapse affordance. So the hypothesis is statically FALSE on the "collapse" half.
      What needs a probe is the "bounds memory" half: how much heap / DOM does a realistic
      long session (e.g. 100 LoadMore clicks on leaves of a 10K-node graph) actually
      accumulate, and at what point does the no-virtualisation SVG render degrade the
      browser frame budget? That is a runtime/perf measurement, not derivable from the
      sidecars.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LineageGraph
        section: bugs_limitations_corner_cases[3] + implicit_adrs[5]
        cite: "dataEntityLineage.slice.ts:30-48, 206-220, 285-299 + LoadMoreButton.tsx:55-65"
        note: "Monotonic accumulation, no collapse/eviction/cap; module-level globals opaque to DevTools."
    operator_visible_failure: |
      No collapse affordance is a definite UX gap (a user who over-expands cannot tidy the
      view without reloading). The probe quantifies the memory/render degradation of a long
      session — if it confirms unbounded growth to a browser-stalling size, that is a
      reliability issue for power users tracing large graphs over a long sitting.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: P-225
    routes_to_finding: caveat-candidate

- id: H-011
  hypothesis: "When a user shares the URL of a lineage view they have explored (specific depth, expansions, zoom), the recipient opening that URL sees the same view — the lineage canvas is shareable/deep-linkable."
  derivation: "URL-as-state is a recognised collaboration affordance; the control set (depth, expansion arrays, transform matrix) is all in the query string."
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |
      The canvas state IS in the URL and IS shareable. Depth `d`, full-names `fn`,
      view-mode `full`, expand-all-groups `eag`, the four expansion-id arrays
      (`exd`/`exu`/`exdg`/`exug`), and the zoom transform matrix `t` all live in the query
      string and are written via setQueryParams; opening the URL replays the view
      (LineageGraph.md implicit_adrs[1] — URL is the source of truth, interfaces.ts:75-85;
      ZoomableLineage persists the matrix to `?t=` on mouseleave). Two CAVEATS bound the
      confirmation: (a) URL length — Chrome's ~2K effective limit is hit after ~200
      expansions, so very-heavily-explored views do not fully round-trip (LineageGraph.md
      scaling_characteristics); (b) a malformed `?t=` is JSON.parsed with no try/catch and
      crashes the tree (LineageGraph.md security.known_security_gaps[4]).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LineageGraph
        section: implicit_adrs[1] + performance.scaling_characteristics
        cite: "interfaces.ts:75-85 + setQueryParams across 4 components + ZoomableLineage.tsx:28-31"
        note: "All view state in URL; deep-linking works; bounded by URL length + unguarded ?t= parse."
    operator_visible_failure: |
      N/A for the core claim (confirmed). The two caveats — silent truncation of very
      large exploration states and a crash on a hand-corrupted `?t=` — are minor edge
      conditions a power user could hit; both are undocumented.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-012
  hypothesis: "When a user requests dataset structure by version through the same data-entity/dataset detail surface, the version they receive belongs to the dataset named in the URL — `GET /api/datasets/{id}/structure/{versionId}` returns {id}'s structure, not some other dataset's."
  derivation: "The path `/api/datasets/{data_entity_id}/structure/{version_id}` names the dataset; a user reasoning about 'this dataset's schema history' expects the response to be scoped to that dataset. (Cross-surface extension of F-005's per-entity-scoping class to the dataset-structure read surface, per F-005 batch-W.)"
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The `data_entity_id` path component is consumed but never enforced. The by-version-id
      lookup filters `WHERE DATASET_VERSION.ID = datasetVersionId` only
      (ReactiveDatasetVersionRepositoryImpl.java:129); the `datasetId` argument is used only
      in the NotFoundException message text. A request to
      `GET /api/datasets/{anyId}/structure/{validVersionIdForAnotherDataset}` returns the
      OTHER dataset's structure. The diff endpoint has the same defect (filters
      `DATASET_VERSION.ID IN (first, second)` only — cross-dataset diff is possible). No
      SecurityRule covers these paths; they fall through to authentication-only
      (DataSetController.md understanding + invariants; F-005.yaml batch-W facets). This is
      the same per-entity-scoping bypass class as the lineage cross-owner finding, on the
      dataset-structure surface.
    evidence:
      - sidecar: odd-platform__java__DataSetController__controller-class__DataSetController
        section: understanding + invariants (Category F drift)
        cite: "ReactiveDatasetVersionRepositoryImpl.java:129, 154 + DatasetVersionServiceImpl.java:39-45"
        note: "data_entity_id consumed but never re-checked against the version id; by-version and diff both affected."
    operator_visible_failure: |
      (1) Cross-dataset read: any authenticated user (anonymous under DISABLED) can read any
      dataset's full schema (field names, types, descriptions, tags, terms) by guessing a
      version id, regardless of the dataset id in the URL. (2) The Compare/diff surface — a
      TRUSTED audit surface for "what changed between V1 and V2" — can be fed two version
      ids from different datasets and returns a well-formed but nonsensical cross-dataset
      diff, misleading an operator reasoning about schema change. This is the dataset-side
      realisation of the same per-entity-scoping bypass that H-002 finds on lineage.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

