proposed_action: Add integration test submitting a 20MB payload with a malformed token;
  instrument the test to observe heap allocation (or rely on a memory-bounded test
  profile); assert the body is fully read into heap before the 401 response. Locks
  the current posture; future auth-first reordering converts the test into a deliberate
  update.
