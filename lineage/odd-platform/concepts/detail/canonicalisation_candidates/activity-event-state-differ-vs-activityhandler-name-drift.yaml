name: ActivityHandler is misnamed — it's a state-differ, not an event-handler
canonical_in_docs: false
canonical_candidate: true
proposed_canonical: Activity Event State Differ (or ActivityStateSnapshotter)
proposed_rename_target: ActivityHandler → ActivityStateDiffer or
  ActivityStateSnapshotter
rationale: |-
  **NEW CANONICALISATION CANDIDATE, batch VAL-LSN-019-B (2026-05-20)** —
  the name `ActivityHandler` on the Java interface (`service/activity/handler/
  ActivityHandler.java:9-22`) does NOT match what the type does. This is a
  classic NAME-VS-BEHAVIOR drift (per LSN-019 Stress Protocol Category B).

  **WHAT THE NAME PROMISES**:
    `ActivityHandler` suggests a write-handler or event-handler — a type
    that HANDLES an Activity event by responding to it (persisting it,
    forwarding it, dispatching to a downstream consumer). The pattern is
    standard in event-driven systems: "Handler" types receive events and
    mutate state.

  **WHAT THE INTERFACE ACTUALLY DOES**:
    The interface defines four methods, ALL READ-ONLY at the handler tier:
    - `boolean isHandle(ActivityEventTypeDto)` — dispatch predicate
    - `Mono<ActivityContextInfo> getContextInfo(parameters)` — captures
      the OLD state of the affected data_entity BEFORE the wrapped business
      mutation runs
    - `Mono<String> getUpdatedState(parameters, dataEntityId)` — captures
      the NEW state of the affected data_entity AFTER the wrapped business
      mutation runs
    - `Mono<Map<Long, String>> getUpdatedState(parameters, List<Long>
       dataEntityIds)` — multi-id variant (default throws)

    NONE of these methods PERSIST anything. NONE of these methods MUTATE
    state. The handler is a STATE SNAPSHOTTER that produces a (pre, post)
    pair, and the wrapping `ActivityAspect` does the actual diff + persist
    + dispatch (`ActivityAspect.java:48-94`).

  **THE OPERATOR-VISIBLE COST OF THE DRIFT**:
    A maintainer reading the codebase encounters `ActivityHandler` and
    forms a mental model of "this is the type that handles activity
    events." They then look for a `handle()` method and don't find one.
    They look for a `persist()` method and don't find one. They look at
    the implementations and see them reading state from repositories.
    They have to reverse-engineer the snapshot-differ pattern by tracing
    ActivityAspect's 100-line around-advice.

    A maintainer adding new audit coverage for a new entity (e.g.
    a new data-quality-check assertion) opens
    `service/activity/handler/` and creates `DataQualityCheckActivityHandler
    implements ActivityHandler` — they think they're writing a handler.
    They put `persist()` logic in `getContextInfo`. The bug emerges at
    runtime when the handler double-persists (its own write + the
    aspect's write).

  **THE RENAME PROPOSAL**:
    Two candidate names; either is more honest than `ActivityHandler`:
      (a) `ActivityStateDiffer` — emphasizes the diff role
      (b) `ActivityStateSnapshotter` — emphasizes the snapshot role
      (c) `ActivityEventStateDiffer` — most precise but longest

    The rename touches:
      - `service/activity/handler/ActivityHandler.java` → new file at
        `service/activity/differ/ActivityStateDiffer.java` (or rename
        in-place with full Git history)
      - 18 concrete implementation classes' `implements ActivityHandler`
        → `implements ActivityStateDiffer`
      - 2 abstract bases' class names + `extends` declarations
      - `ActivityServiceImpl.handlers` field rename to `differs`
      - `ActivityServiceImpl.getActivityHandler(eventType)` rename to
        `getActivityStateDiffer(eventType)` or
        `getDiffer(eventType)`
      - All Javadoc references
      - The activity-feed feature page documentation

    The 18-handler set is a manageable rename scope. CI tests would
    catch all reference updates. Backwards compatibility is not a
    concern (the interface is internal — no @Public annotation, no
    extension point exposed beyond the platform module).

  **ALTERNATIVE TO THE RENAME — DOCUMENT THE CONTRACT**:
    If the rename is too disruptive, the lighter-weight fix is to
    document the contract at the interface level:
      ```java
      /**
       * Snapshot-differ contract for activity-feed audit events.
       *
       * IMPORTANT: This is NOT a write-handler interface despite the
       * "Handler" suffix in the name. Implementations capture
       * (pre, post) state snapshots; the wrapping {@link ActivityAspect}
       * computes the diff (JSON-string equality at line 86) and
       * persists the ActivityPojo. Implementations MUST NOT persist
       * activity rows; doing so causes double-persist (handler + aspect)
       * and stale-read race conditions.
       */
      public interface ActivityHandler {
        // ...
      }
      ```
    Cost: one Javadoc block. Benefit: future maintainers see the
    contract on hover.

  **WHY THIS IS A CANONICALISATION CANDIDATE, NOT JUST A BACKLOG
  ITEM**:
    main-concepts.md does not name the snapshot-differ pattern.
    The Activity Feed concept entry currently mentions "ActivityHandler"
    in passing (via the new entity entry
    `activity-handler-state-differ`); but the term itself is not in
    the canonical vocabulary. Two paths:
      (a) Add "Activity Event State Differ" or "Activity State
          Snapshotter" to main-concepts.md as the canonical concept
          name, then rename the Java interface to match
      (b) Add "ActivityHandler (state-differ pattern)" with a
          clarifying gloss in main-concepts.md, accepting the name
          and documenting the contract trap

    The maintainer's choice. The recommendation here: pursue path
    (a) — the name is misleading enough that renaming the Java code
    pays back the migration cost in reduced ongoing confusion.

  vocabulary_status: codebase-anchored, doc-side-absent (main-concepts.md
  does not name the snapshot-differ pattern OR the activity-handler
  abstraction; the live activity-feed.md page does not name either).
