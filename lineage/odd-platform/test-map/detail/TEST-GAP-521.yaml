behaviour: |-
  Side-effect UPDATE-on-read of `last_accessed_at` regression-pin (LOW — P-01). `ReactiveSearchFacetRepositoryImpl.get(UUID)` (lines 99-106) is an UPDATE-RETURNING shape: every `GET /api/search/{search_id}` and `GET /api/search/{search_id}/facet/{facet_type}` call issues an UPDATE on `search_facets.last_accessed_at`. Implications: (a) `GET /api/search/{search_id}` is NOT idempotent at the storage layer — operationally surprising for a GET endpoint, (b) the side-effect UPDATE acquires a row lock; with concurrent UI tabs hitting the same session simultaneously, the write contention can stall, (c) the `last_accessed_at` field exists in the schema but is NEVER READ by any housekeeping job (`V0_0_52__introduce_housekeeping.sql` has NO `search_facets` policy — verified by grep during sidecar enrichment). The field is updated but useless — the design implies a future TTL eviction job that never landed (consistent with the `V0_0_1__init.sql:207` TODO `find a way to define TTL`). NO comment, annotation, or surrounding code defends the side-effect read posture as intentional. NO test pins the contract. A future refactor adding the TTL eviction job would actually USE `last_accessed_at` for the first time; conversely a refactor removing the UPDATE-on-read (treating GET as truly idempotent) would silently break the (currently unused) TTL infrastructure.
