behaviour: |-
  Duplicate-prevention surface error path — HTTP 400 USR003 contract test (cross-batch correction primary-source pin). No test calls `create(...)` twice with the same `(data_entity_id, owner_id)` and asserts that the second call emits `UniqueConstraintException` (USR003) via the `JooqReactiveOperations.mono(...).onErrorMap(...)` chain. STRENGTHENED — batch H found this; batch K PRIMARY-SOURCE confirms via OwnershipServiceImpl sidecar's `implicit_adrs.[3]` that the error chain is: jOOQ DataAccessException → JooqReactiveOperations.mono.onErrorMap → ExceptionUtils.translateDatabaseException at ExceptionUtils.java:30-36 → matches SQLStateClass.C23_INTEGRITY_CONSTRAINT_VIOLATION → constructs `UniqueConstraintException("Ownership for this data entity and owner already exists")` per ExceptionUtils.java:69-71 → ControllerAdvice.handleUniqueConstraint maps to HttpStatus.BAD_REQUEST per ControllerAdvice.java:36-40 → response body carries `code: "USR003", resolvable: true, retryable: false` per ErrorCode.java:11. The batch-F sidecar's `bugs_limitations_corner_cases[2]` and `known_security_gaps[3]` claim of '5xx surface' is INCORRECT; the actual surface is 400 USR003 with a friendly message. Test MUST pin 400 (not 500) AND the friendly message AND USR003 error code.
