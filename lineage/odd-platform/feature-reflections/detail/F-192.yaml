  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |-
      The server gates POST /api/datasetfields/{id}/terms on DATA_ENTITY_ADD_TERM,
      NOT the documented DATASET_FIELD_ADD_TERM (SecurityConstants.java:299;
      DatasetFieldController sidecar invariant + bugs_limitations_corner_cases +
      doc_drift_findings, verified against the live permissions page 2026-05-25
      status 200). The UI shows + enables the Add-term affordance for a user
      holding DATASET_FIELD_ADD_TERM (the documented permission). For such a user
      the click hits the endpoint, the server denies it (they lack
      DATA_ENTITY_ADD_TERM), and TermItem's catch path swallows the 403 silently
      (PLT-029 Defect 1 Bug 2). The term never appears; the operator sees no error.
    evidence:
      - sidecar: odd-platform__java__DatasetFieldController__controller-class__DatasetFieldController.md
        section: bugs_limitations_corner_cases / doc_drift_findings / invariants
        cite: "SecurityConstants.java:297-299; PolicyPermissionDto.java:34; docs permissions page (verified 2026-05-25, 200)"
        note: "endpoint gated on DATA_ENTITY_ADD_TERM; docs + UI use DATASET_FIELD_ADD_TERM — silent capability denial"
    operator_visible_failure: |-
      (1) A user granted EXACTLY the documented permission (DATASET_FIELD_ADD_TERM)
      for the field-level Add-term action silently CANNOT perform it — the button
      is enabled, the click does nothing visible, the term never links, no error
      toast. (2) Inversely, a user granted only DATA_ENTITY_ADD_TERM (intended for
      entity-level term linking) CAN link terms to fields — a separation-of-duties
      leak. (3) The operator who configured permissions from the published docs has
      a runtime authorization model that does not match the docs.
