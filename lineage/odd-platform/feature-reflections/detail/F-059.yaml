- id: H-003
  hypothesis: |-
    When an operator renames a lookup table, the rename DDL affects ONLY the physical
    table (so the operator's mental model "I renamed the table" matches the database
    change exactly).
  derivation: |-
    Endpoint/DTO shape implies a single rename target; verify the actual DDL scope
    against that mental model (cross-layer name-vs-implementation scope check, Rule 4).
  seed_source: response-shape
  sme_consultation_recommended: false
  validation:
    verdict: partial
    actual_behavior: |-
      The DDL renames MORE than the table. ReferenceDataRepositoryImpl.updateLookupTable
      renames (a) the table itself (ALTER TABLE ... RENAME TO), (b) every sequence whose
      name matches the old-table prefix template (ALTER SEQUENCE IF EXISTS ... RENAME TO),
      and (c) every constraint matching the old-table template (ALTER TABLE ... RENAME
      CONSTRAINT ... TO ...). The blast radius is wider than the feature-flow's
      terminal_side_effect modelled (which named only the table RENAME). For pure
      catalog-consumers this is invisible; but any downstream tooling that referenced the
      old SERIAL sequence name (e.g. nextval('lookup_tables_schema.n_5__customer_lookups_id_seq'))
      ALSO breaks on rename — a second, undocumented break surface beyond the table name.
    evidence:
      - sidecar: "(source-read-for-validation)"
        section: ReferenceDataRepositoryImpl.updateLookupTable
        cite: "ReferenceDataRepositoryImpl.java:184-201"
        note: "Renames table (L192), then matching sequences (L194-195), then matching constraints (L197-200)."
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: feature-flow terminal_side_effect
        cite: "lineage/odd-platform/feature-flows/detail/F-059.yaml:86-96"
        note: "Feature-flow models only the table RENAME; sequence + constraint rename under-described."
    operator_visible_failure: |-
      A downstream job referencing the auto-generated id sequence by its old name (common
      for TYPE_SERIAL columns when an ETL job pre-fetches ids) breaks on rename in addition
      to the table itself — a failure mode neither the UI, the feature-flow model, nor the
      doc page enumerates. The operator's mental model "I renamed one thing" is incomplete:
      they renamed a table, its sequences, and its constraints atomically.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |-
    When an operator renames a lookup table to a Name that — after lowercasing and
    space-replacement — collides with an EXISTING physical table in the same namespace,
    the platform rejects the rename with a clear, actionable error (e.g. "a table with
    that physical name already exists").
  derivation: |-
    A senior PO expects name collisions to fail safe and legibly. buildTableName is a
    lossy normalisation with no documented uniqueness pre-check.
  seed_source: negative-space
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |-
      No pre-check exists. buildTableName lowercases + space-replaces with no uniqueness
      guard, and updateLookupTable calls the rename DDL directly. Two names that normalise
      to the same physical string in one namespace (e.g. "Customer Lookups" and "customer
      lookups", or "Customer Lookups" and "Customer  Lookups" with a double space) drive
      ALTER TABLE ... RENAME TO an already-existing relation, which Postgres rejects with a
      raw error surfaced as a generic 500 — not a friendly 409 / BadUserRequestException.
      (The create path has the identically-shaped gap per the controller sidecar; the
      rename path inherits it.)
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: bugs_limitations_corner_cases[2]
        cite: "ReferenceDataServiceImpl.java:191-194 + 73-86"
        note: "buildTableName lossy normalisation; no uniqueness pre-check before the DDL."
      - sidecar: "(source-read-for-validation)"
        section: ReferenceDataServiceImpl.updateLookupTable
        cite: "ReferenceDataServiceImpl.java:113-122"
        note: "Rename path calls repository DDL directly with no collision pre-check."
    operator_visible_failure: |-
      (1) The operator sees a generic 500 / opaque server error with no hint that a name
      collision caused it; they cannot tell whether the platform is broken or their input
      was the problem. (2) Whether the original table survives the failed rename depends on
      transaction boundaries the operator cannot see — partial-failure ambiguity on a
      data-bearing table. (3) The lossy normalisation means two visually-distinct display
      names silently share one physical namespace — a latent foot-gun even before any
      collision error.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    When an operator opens the edit form, the disabled Namespace field means "namespace
    cannot be changed on edit" — and the platform does not transmit or act on a namespace
    value on the update request.
  derivation: |-
    UI-label/control semantics (Rule 9): a disabled field promises "not editable"; verify
    the wire matches the control. DTO field vs implementation drift (Rule 4).
  seed_source: ui-label
  sme_consultation_recommended: false
  validation:
    verdict: partial
    actual_behavior: |-
      The disabled control correctly communicates "namespace is not editable on update,"
      and the server-side outcome matches that promise: the UPDATE schema
      (LookupTableUpdateFormData) defines only name + description, and the service rebuilds
      the physical name using the EXISTING table.namespacePojo() — never a client-supplied
      namespace. SO THE USER-VISIBLE OUTCOME IS HONEST. The drift is on the wire only: the
      form is typed as the CREATE shape (LookupTableFormData with namespaceName), so on
      edit it SENDS namespace_name in the request body, which the server silently discards
      (Jackson lenient binding). An operator inspecting the network tab sees namespace_name
      on every edit, contradicting the "field disabled = field not sent" intuition.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: bugs_limitations_corner_cases[2] + stress_findings.request_inputs[1]
        cite: "LookupTableForm.tsx:49, 60-66, 117-123 + components.yaml:3853-3862"
        note: "Form typed as CREATE shape; namespace_name on the wire on edit; UPDATE schema rejects it; server discards (DRIFT_INPUT_NAME_VS_IMPLEMENTATION)."
      - sidecar: "(source-read-for-validation)"
        section: ReferenceDataServiceImpl.updateLookupTable
        cite: "ReferenceDataServiceImpl.java:112-117"
        note: "Service uses table.namespacePojo() (existing), never a request-supplied namespace — the namespace genuinely cannot change on edit."
    operator_visible_failure: |-
      Functionally benign for the end user (namespace genuinely cannot change), but two
      smells for the developer/operator: (1) an operator reading the network tab is misled
      into thinking namespace IS being changed; (2) the form contract is fragile — if the
      server ever flips Jackson to FAIL_ON_UNKNOWN_PROPERTIES, every edit returns 400 and
      rename becomes impossible. This is the same DTO-drift the LookupTables sidecar flags
      (was P-191) — already a known finding.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

