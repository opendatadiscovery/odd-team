behaviour: |-
  **No server-side Azure access/refresh/id token revocation on logout — tokens persist at Azure until natural TTL.** The handler invalidates ONLY the platform-side `WebSession` (line 47 `exchange.getExchange().getSession().flatMap(WebSession::invalidate)`). It does NOT call any Azure token revocation endpoint. Azure AD v2.0 does not expose RFC 7009 token revocation, so even attempting revocation would 404 — but the platform-side caveat is undocumented and operators with stringent immediate-revocation requirements need to know. Compare: `GoogleLogoutSuccessHandler.java:43-54` POSTs to `https://oauth2.googleapis.com/revoke` (active revocation); `GithubLogoutSuccessHandler.java:51-63` DELETEs `/applications/{client_id}/grant`. For Azure (and Cognito and ODD_IAM and Custom): the access token / refresh token / id_token issued by Azure remain valid at Azure until their natural TTLs expire (typical access token: 60-90 minutes; refresh token: up to 90 days for confidential clients). If the token was previously exfiltrated (XSS, non-HttpOnly storage, browser-extension compromise), logging the user out of the platform does NOT invalidate the token at Azure. The implicit ADR (delegate-revocation-to-natural-TTL) is encoded by ABSENCE; docs silent.
