notes: |-
  Coherence (Rule 6): No existing concept describes this pattern.
  Pure batch-ZH net-new. The 2-instance triangulation across two
  different pillars (P-06 Glossary, P-08 Management) suggests the
  pattern is conventional — additional route modules with `:id`
  params may exhibit the same drift but the batch did not enrich
  them.

  Surfaced for future batches: any new `use*RouteParams` hook
  authored in a route module SHOULD include an isNaN guard or
  honest Partial<>-aware return type.
