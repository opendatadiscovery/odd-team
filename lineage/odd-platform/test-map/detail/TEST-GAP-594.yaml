  - "TEST-GAP-159 (LDAP substring-collision admin-escalation — sibling full-string-eq concern)"
proposed_action: |-
  Unit test on GithubUserHandler with mocked WebClient. Four cases pinning the gates: (1) provider.organizationName='my-cool-org' + /user/orgs returns [{login: 'other-org'}] → Mono.error; (2) provider.organizationName='my-cool-org' + /user/orgs returns [{login: 'MY-COOL-ORG'}] + adminGroups=[] → USER (case-insensitive org match); (3) org match + adminGroups=['Admins'] + /user/teams returns [{name:'Admins', organization:{login:'my-cool-org'}}] → ADMIN; (4) org match + adminGroups=['Admins'] + /user/teams returns [{name:'Admins', organization:{login:'OTHER-ORG'}}] → USER (cross-org filter). Pin all four.
