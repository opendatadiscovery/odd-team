- id: H-012
  hypothesis: "When an operator submits a very large description (megabytes of Markdown), the platform rejects it with a clear validation error or accepts it without degrading the entity's read and search behaviour."
  derivation: "A product owner expects a bound on a free-text surface, or graceful handling — not an unbounded text column that bloats search and the activity table on every edit."
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: partial
    actual_behavior: |
      There is NO application-level length cap. InternalDescriptionFormData.internal_description has no
      maxLength (components.yaml:2188-2194), no @Size on the generated DTO; the column is Postgres text
      (unbounded). The ONLY de-facto bound is Spring WebFlux's spring.codec.max-in-memory-size (default 256 KB)
      which returns a generic 413/500, NOT a validation-shaped 400. Below that bound, a large description is
      accepted, FTS-indexed (full-entity tsvector rebuild on every edit), and JSON-serialised into the activity
      table TWICE (oldState + newState) per edit. So the feature "handles" large input up to ~256 KB but
      degrades search/activity-table cost; above 256 KB the error is a generic, non-validation-shaped failure.
      The promise is half-met: there is a bound, but it is implicit, non-validation-shaped, and below it the
      cost characteristics are unbounded.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityInternalDescription
        section: bugs_limitations_corner_cases[2] + performance.known_performance_gaps[0,2]
        cite: "components.yaml:2188-2194 + V0_0_1__init.sql:80 + DescriptionUpdatedActivityHandler.java:39-42"
        note: "no maxLength/@Size; text column; activity row holds description twice per edit"
    operator_visible_failure: |
      (a) A 256 KB+ description PUT returns a generic 413/500, not a 400 with a field error — the writer can't
      tell it was a length problem. (b) A frequently-edited large description grows the activity table ~2x the
      body size per edit with no documented TTL — a slow table-growth operational hazard. (c) The full-entity
      FTS rebuild on every description write does I/O proportional to the entity's tags/owners/metadata, not
      just the description bytes. Severity LOW (per-edit, low-RPS surface) but a real scaling caveat.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_ref: null
    test_demand: functional
    use_case_note: "No test exercises a >256 KB body or asserts the request-size-limit behaviour. The length-bound promise is unverified. Confidence MEDIUM because the exact codec limit is the framework default, not statically pinned in this repo's config."

