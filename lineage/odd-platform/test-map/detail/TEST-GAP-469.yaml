behaviour: |-
  No housekeeping-job ordering contract. The `List<HousekeepingJob>` injection at HousekeepingJobManager.java:23 receives beans in Spring's discovered order, which is NOT explicitly declared. Five jobs today operate on disjoint table sets so order is irrelevant; a future job with cross-job dependencies (e.g. 'a new TermHousekeepingJob must run BEFORE DataEntityHousekeepingJob to avoid stale FK references') would silently inherit whatever order Spring picks. No `@Order` annotations on any of the five existing jobs, no `@DependsOn`, no explicit list ordering in the manager.
test_class: missing-edge-case
