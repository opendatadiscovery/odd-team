behaviour: |-
  **LOW — MinioConfig.java:19-25 never calls `.httpClient(...)` on `MinioAsyncClient.builder()`. The MinIO SDK's default OkHttp client uses ~5-minute timeouts that are NOT operator-tunable. Operators on slow networks with large `attachment.max-file-size` see unrecoverable socket timeouts.**

  **Sibling to TEST-GAP-776** (`.region(...)` unset, LSN-002 — CRITICAL). Both are Gate-5 unset-parameter-audit findings on the same builder chain. Severity is LOW here because the SDK default timeouts are NOT a security risk (unlike the region issue) and NOT a data-loss risk — they are a slow-deployment usability issue with a manual workaround (operators can increase `attachment.max-file-size` or reduce file sizes on slow networks).

  **Test gap shape**: regression-pin asserting the builder chain has EXACTLY three calls (`.endpoint`, `.credentials`, `.build`) — no `.httpClient(...)`. PINS the absence; drives REFACTOR-034 to surface operator-tunable timeouts.
