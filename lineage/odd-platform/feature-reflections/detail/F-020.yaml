      collector's token_id still exists — pins the orphan AND is the regression guard for the PLT-085
      cascade-cleanup fix.

- id: H-008
  hypothesis: "When a collector's token is at rest in the platform's database, it is protected the way a credential is expected to be — hashed or encrypted — so a database read or backup does not hand an attacker every live collector secret."
  derivation: "Negative-space (the universal expectation that stored authentication secrets are not kept in clear text) + response-shape (the API masks the token on reads, implying the platform treats it as sensitive)."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The token is plaintext at rest end-to-end. V0_0_28__add_token.sql:4 declares
      `value varchar(40) NOT NULL` with no hashing column, no salt, no UNIQUE
      constraint. TokenGeneratorImpl.java:34-42 writes
      RandomStringUtils.randomAlphanumeric(40) verbatim. ReactiveCollectorRepository
      Impl.java:94 resolves an inbound bearer token via `TOKEN.VALUE.eq(token)` —
      plaintext SQL equality; IngestionDataEntitiesFilter.java:55-58 mirrors it with
      a non-constant-time `tokenPojo.getValue().equals(token)`. Every layer of the
      bearer-token flow assumes plaintext (the repository sidecar names this the
      load-bearing implicit ADR). The API masking on reads is cosmetic — it hides
      the value in list views but the storage is clear text. (Separately, the
      generator uses ThreadLocalRandom, not SecureRandom — a distinct entropy
      defect; see H-013.)
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveCollectorRepositoryImpl.md
        section: "bugs_limitations_corner_cases[0] + implicit_adrs[0]"
        cite: "V0_0_28__add_token.sql:1-9 + TokenGeneratorImpl.java:34-42 + ReactiveCollectorRepositoryImpl.java:94 + IngestionDataEntitiesFilter.java:55-58"
        note: "No hashing anywhere; SQL + application equality are both plaintext."
      - sidecar: odd-platform__java__CollectorController__controller-method__regenerateCollectorToken.md
        section: "implicit_adrs[3] + security.known_security_gaps[3]"
        cite: "IngestionDataEntitiesFilter.java:55-58 + ReactiveTokenRepositoryImpl.java:21-39"
        note: "Direct String.equals, not BCrypt.matches; shared-secret-stored-as-is model."
      - sidecar: "(test, source_read_for_validation: true)"
        section: "CollectorTokenStorageKnownBugTest"
        cite: "odd-platform-api/.../repository/reactive/CollectorTokenStorageKnownBugTest.java:37-44"
        note: "@pins PLT-085 — asserts ReactiveCollectorRepositoryImpl contains 'TOKEN.VALUE.eq(token)'; GREEN while plaintext, RED on hash-at-rest. This characterization pin is the test guard for the contradiction (new since the 0.2.0 reflection)."
    operator_visible_failure: |
      (1) Any DB-side reader — pg_dump artefact, read replica snapshot, WAL archive,
      jOOQ statement-log leak, Datadog/pgaudit DB observability — recovers every
      live collector credential in clear text. (2) A single leaked backup is a
      platform-wide credential compromise requiring rotation of every token (which,
