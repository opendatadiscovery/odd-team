        cite: "Overview.tsx:55-147"
        note: "uniform container + permission-provider chrome — platform-consistent"
      - sidecar: "(related feature-flow)"
        section: F-156 Term Overview right-rail
        cite: "lineage/odd-platform/feature-flows/detail/F-156.yaml"
        note: "same WithPermissionsProvider edit-affordance pattern on a sibling detail surface — consistency anchor"
      - sidecar: "(doc cross-ref)"
        section: entity-detail-page.md warnings
        cite: "documentation/docs/data-discovery/entity-detail-page.md:70-92"
        note: "all conditional behaviours are explained in docs, none on-screen"
    operator_visible_failure: |-
      (1) A new user who expects a stats panel or a DQ section and sees plain
      empty space has no on-screen affordance (tooltip, empty-state text, help
      link) to learn why — they must find the docs. (2) The inconsistency is
      internal: the surface is structurally consistent with sibling detail
