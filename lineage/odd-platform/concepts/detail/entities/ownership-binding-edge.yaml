name: Ownership (binding edge)
canonical_in_docs: false
canonical_candidate: true
description: '**NEW CONCEPT, batch 2026-05-19H** — the `ownership` table row capturing
  the (data_entity_id, owner_id, title_id) binding. Distinct from the Owner directory
  entry (the platform-managed Owner row) and from the User-Owner Mapping (the per-user
  oidc_username → owner_id binding). Ownership is the EDGE table connecting Owners
  to Data Entities with an optional Title attribute. Hard-delete only — the `ownership`
  table has NO `deleted_at` column (V0_0_3__add_ownership.sql:10-22 declares id, data_entity_id,
  owner_id, role_id only; V0_0_53__rename_role_to_title.sql renames role_id→title_id;
  no deleted_at addition in any of 5 ownership-mentioning migrations). Operators retrieving
  historical ownership state must reconstruct from the activity-feed audit trail,
  not from the ownership table. Duplicate prevention is at the DATABASE layer via
  the `UNIQUE (data_entity_id, owner_id)` constraint (V0_0_3:17); the violation translates
  to HTTP 400 (USR003) with friendly message "Ownership for this data entity and owner
  already exists" via JooqReactiveOperations.mono(...).onErrorMap(...) → ExceptionUtils.translateDatabaseException
  → OWNERSHIP_DATA_ENTITY_ID_OWNER_ID_KEY-specific message (ExceptionUtils.java:69-71).
  The repository is `ReactiveOwnershipRepositoryImpl` — 8 thin jOOQ-reactive methods
  (get, create, createOrUpdate, delete, deleteByDataEntityAndOwner, updateTitle, existsByOwner,
  getOwnershipsByDataEntityId). Each method signature takes Long ids or POJO collections;
  NO method takes an Authentication / Principal / Owner / ServerWebExchange — the
  principal-derived owner-id is resolved at the SERVICE layer (via authIdentityProvider.fetchAssociatedOwner()
  per ADR-CANDIDATE-015) BEFORE reaching this repository. **The repository does NOT
  participate in the owner-scoping JOIN for /my reads** — that JOIN is built locally
  inside ReactiveDataEntityRepositoryImpl#listByOwner at lines 526-527, not via this
  class. The architectural separation: ReactiveOwnershipRepository owns CRUD on the
  `ownership` row; sibling repositories embed JOIN OWNERSHIP into their own queries
  when filtering their primary entity by owner (12 JOIN OWNERSHIP sites surfaced by
  grep across the repository layer). Three signature operations exist exclusively
  to serve the DEG-propagation path: `createOrUpdate` (batched UPSERT via executeInPartitionReturning
  1000-row partitions, with `.onConflictOnConstraint(OWNERSHIP_DATA_ENTITY_ID_OWNER_ID_KEY).doUpdate().set(TITLE_ID,
  EXCLUDED)` — title-overwriting semantics) + `deleteByDataEntityAndOwner` (operator-precedence-safe
  OR-chain of explicit AND-pairs reduced over Condition::or). The activity-feed handlers
  (OwnershipCreatedActivityHandler, OwnershipUpdatedActivityHandler, OwnershipDeletedActivityHandler)
  call `getOwnershipsByDataEntityId(dataEntityId)` TWICE per ownership-write event
  to capture BEFORE/AFTER state for activity-feed JSON diffs. `OwnerService.delete`
  calls `existsByOwner(ownerId)` to gate cascade-delete (refuse with CascadeDeleteException
  if any ownership row references the owner). **CROSS-BATCH CORRECTION (batch H)**:
  the batch-F createOwnership sidecar incorrectly stated the duplicate-key surface
  error is 5xx — the actual surface is HTTP 400 (USR003) with friendly message via
  ExceptionUtils + ControllerAdvice.handleUniqueConstraint mapping; downstream artefacts
  inheriting the batch-F misclaim should be corrected.'
axes_present:
- controllers
- repositories_reactive
nodes:
- odd-platform java DataEntityController controller-method:createOwnership
- odd-platform java repository reactive repository:ReactiveOwnershipRepositoryImpl
contributors:
- 'createOwnership.md (batch F): entities[Ownership, OwnershipFormData, OwnershipPojo,
  OwnerPojo (auto-created via getOrCreate), TitlePojo (auto-created via getOrCreate)];
  operations[bind-owner-to-data-entity with optional DEG propagation, search-index
  refresh, mark data_entity_filled.OWNERS]; the controller-method-level surface for
  the binding-creation HTTP path.'
- 'ReactiveOwnershipRepositoryImpl (batch H): entities[OwnershipPojo (id, data_entity_id,
  owner_id, title_id; no deleted_at), OwnershipDto (joined OWNERSHIP / OWNER / TITLE
  read shape), OwnershipRecord (jOOQ TableRecord), OWNERSHIP_DATA_ENTITY_ID_OWNER_ID_KEY
  (the named unique constraint imported from generated Keys)]; 8 operations covering
  the full CRUD lifecycle + the DEG-propagation primitives + activity-handler reads
  + existence-gate for OwnerService.delete cascade. 5 ADRs: (1) hard-delete by design
  (ownership is an edge table; reconstruction relies on activity-feed audit trail
  — parallel pattern at V0_0_76__term_relations_hard_delete.sql:8-13 on term_ownership);
  (2) duplicate-prevention is database-constraint-driven with friendly-error translation
  via ExceptionUtils (centralised onErrorMap at JooqReactiveOperations.java:41); (3)
  batched UPSERT is title-overwriting (the DEG-propagation contract built into the
  only batch-insert method — there is no createIgnore variant); (4) batched DELETE
  uses OR-chain of explicit AND-pairs (operator-precedence-safe — each AND-pair closed
  before OR-combining); (5) repository takes NO principal — all owner-id parameters
  arrive pre-resolved at the service layer per ADR-CANDIDATE-015.'
