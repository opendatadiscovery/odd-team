feature_id: F-043
pillar_id: P-08
pillar_anchored_id: P-08:F-013
pillar_anchored_feature_name: Multilingual UI (i18n / Locale Switching)
feature_name: |-
  Multilingual UI — six-locale (en/es/ch/fr/ua/hy) i18next-driven UI
  translation layer with browser-localStorage-persisted preference,
  natural-keys English-source pattern, and silent missing-key fallback
  that ships unlocalised English to non-English users for any t() call
  whose key is missing from the locale bundle
primary_drift_class: i18n_natural_keys_silent_missing_key_fallback_no_validation
drift_class_summary:
  - i18n_natural_keys_silent_missing_key_fallback_no_validation
  - missing_key_drift_12_plus_keys_referenced_in_code_absent_in_all_six_locales
  - locale_set_drift_three_to_four_keys_per_locale_diverge_from_english
  - no_missingkey_event_handler_silent_failure_at_runtime
  - no_compile_time_validation_of_t_call_key_against_locale_bundle
  - browser_language_navigator_language_never_consulted_localStorage_or_en_only
  - statuses_key_locale_divergent_spanish_singular_translates_plural_english
  - main_search_placeholder_content_drift_english_enumerates_4_entities_other_locales_generic
  - activity_user_filter_label_misleading_label_vs_sql_drift_lsn_020_channel
  - dictionary_label_vs_termsearch_url_drift_via_natural_keys
  - case_whitespace_key_duplication_17_pairs_doubles_translation_surface
  - no_code_splitting_per_locale_all_six_bundles_ship_together
