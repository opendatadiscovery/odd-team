cross_pillar_relationships:
- pillar_id: P-09
  kind: shares_data_with
  via: |-
    The endpoint is gated only by the catch-all `.authenticated()` at the
    SecurityWebFilterChain layer — there is NO Permission entry in
    PolicyPermissionDto for GenAI usage, NO SecurityRule entry in
    SecurityConstants.SECURITY_RULES for `/api/genai/**`. Any authenticated
    principal (any Role, any owner association) succeeds under
    LOGIN_FORM/OAUTH2/LDAP; under DISABLED any anonymous caller succeeds.
    The read-collaborative posture extends here AS A WRITE: the call drives
    cost on the operator's external LLM account with no per-user gate.
