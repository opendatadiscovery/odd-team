# Entity Class / Type Badge — product-owner reflection

## product_owner_narrative

The Entity Class / Type Badge is the single most-seen widget in the whole catalog: a small coloured chip that tells an operator, at a glance, *what kind of thing* a data entity is. It renders everywhere a `DataEntity` appears — on every search result row, every Directory list entry, the detail-page header, the Linked-Entities lists, the Lineage node cards, the Activity feed rows, and the per-entity Alert rows (per the F-206 feature-flow `contributing_nodes` + `related_features`). Two primitives carry it: `EntityClassItem` paints the platform's **primary categorical taxonomy** — the entity *class* (Dataset / Transformer / Consumer / Quality Test / Data Input / Group / Relationship and the `*_RUN` variants) — as a colour-coded chip; `EntityTypeItem` paints the entity *type* (TABLE / VIEW / DASHBOARD / JOB / ML_EXPERIMENT / KAFKA_TOPIC / …) as a text-only chip (per `EntityClassItem.tsx:13-29` + `EntityTypeItem.tsx:13-19`).

An operator never "uses" this feature with a click — they *read* it. Its whole job is to compress "is this a dataset or a job or a quality test?" into a coloured token the eye can scan down a list of fifty rows. That makes the badge's correctness a discovery primitive, not a cosmetic one: the class chip is also the signal F-176 keys the per-entity Overview composition off, and F-177 projects onto the detail header (per the F-176/F-177 cross-links). If the chip is wrong, blank, or visually ambiguous, the operator's mental model of the catalog is wrong at the cheapest, most-repeated surface.

The working parts are static lookups baked into the bundle. The class **label** comes from `DataEntityClassLabelMap` (a 9-entry `Map` in `lib/constants.ts:52-80`) — rendering the short form ("DS", "DC", "TS", "DI", "QT", "DEG", "QTR", "TSR", "REL") by default, or the normal form ("Dataset", "Consumer", …) when `fullName` is set; the hover-title always uses the normal form (`EntityClassItem.tsx:24-27`). The class **colour** comes from `theme.palette.entityClass[$entityClassName]` (a 9-entry palette in `theme/palette.ts:103-113`), keyed by the wire enum value (`DATA_SET`, `DATA_TRANSFORMER`, …). The type **label** is produced on the fly by `stringFormatted(entityTypeName, '_', 'all')` (`lib/helpers.ts:13-38`) — split on underscore, upper-case each word, re-join with a space ("KAFKA_TOPIC" → "KAFKA TOPIC"). The type badge is *not* colour-coded — it uses a uniform background (`EntityTypeItem.tsx:14`); the only per-type distinction is the text.

The badge feeds the rest of P-01 Data Discovery and the entity-detail surfaces: it is the categorical axis a user reads alongside search facets (F-017), Directory drill-down rows (F-023), and the detail header (F-024 / F-177). It shares the `DataEntityClassNameEnum` taxonomy with the ingestion side — the same enum the platform assigns at ingest is the enum the chip paints — so an unclassified or newly-classed entity surfaces here first (per the P-01 pillar's "Data entities operated on: Data Entity (incl. DEG / Domain)" and the cross-pillar `P-10 feeds P-01` relationship in `system-mission.md`).

In a demo, the product owner would flag four edge cases. (1) An entity with **no class** (an ingestion gap, or a manually-created entity without class assignment) renders *no class chip at all* — silently indistinguishable from an entity the UI simply hasn't drawn yet (per facet `entity_class_empty_when_entity_class_name_undefined`, verified live by IT-018's negative path). (2) A **multi-class** entity stacks one chip per class. (3) The class palette is kept in lockstep with the enum by the OpenAPI codegen sweep — but there is no fallback colour if they ever drift (facet `entity_class_palette_baked_into_theme_not_data_driven`). (4) The `'DCT'` type is special-cased into the prop type outside the generated enum (`EntityTypeItem.tsx:9`), an undocumented divergence a future "type cleanup" could silently break.

