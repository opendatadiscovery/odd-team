- id: H-002
  hypothesis: |-
    When a user holding DIRECT_OWNER_SYNC submits POST /api/owner_association_request for an
    owner name that does NOT yet exist, the system creates that Owner AND binds the
    requesting user to it in a single call — without OWNER_CREATE and without any Admin approval.
  derivation: |-
    The auto-approve branch (lines 60-67) calls userOwnerMappingService.createRelation
    immediately; getOrCreate (line 57) mints the Owner with no OWNER_CREATE check
    (OwnerServiceImpl.java:38-42); pillar P-09 frames association as the binding the
    authorization graph reads — so a self-chosen owner becomes attacker-controllable scope.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The implementation does exactly what the hypothesis predicts, and the contradiction is
      against the PRODUCT PROMISE the docs make (the canonical flow is "request → Admin
      approves"). getOrCreate runs unconditionally at line 57 (mints the Owner if the name is
      unseen, no OWNER_CREATE), then at lines 64-67 `permissions.contains(DIRECT_OWNER_SYNC)`
      is true → `userOwnerMappingService.createRelation(user, provider, owner.id)` fires →
      `mapToApprovedRequest(...)` is returned. One authenticated POST = a freshly-minted Owner
      + a binding to it + a pre-approved request. The DIRECT_OWNER_SYNC check verifies the
      PERMISSION ALONE; it never verifies the OIDC group mapping the design intent assumes
      (implicit_adrs[2]). Result: a self-mint-then-self-bind privilege chain.
    evidence:
      - sidecar: SOURCE_READ
        section: source_read_for_validation
        cite: "OwnerAssociationRequestServiceImpl.java:54-67"
        note: "getOrCreate unconditional at :57; createRelation in the DIRECT_OWNER_SYNC branch at :64-67 (source_read_for_validation: true)."
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: "operations.getOrCreate + upstream_callers"
        cite: "OwnerServiceImpl.java:38-42 (no permission check)"
        note: "getOrCreate = getByName.switchIfEmpty(create); the ONLY OWNER write that bypasses OWNER_CREATE."
      - sidecar: odd-platform__java__OwnerAssociationRequestController__controller-class__OwnerAssociationRequestController.md
        section: "security.known_security_gaps[3]"
        cite: "OwnerAssociationRequestServiceImpl.java:60-67 + :57"
        note: "Sidecar independently rates this HIGH: DIRECT_OWNER_SYNC + getOrCreate = complete privilege-escalation chain."
    operator_visible_failure: |-
      (1) Privilege escalation: a DIRECT_OWNER_SYNC holder mints an arbitrary owner name and
      self-binds, becoming the principal for any `dataEntity:owner == '<that name>'` policy —
      including the chance to pre-empt an owner name a future policy will reference. (2)
      Documented-impossible behaviour: an operator reading the doc believes association ALWAYS
      requires Admin approval; in an IdP deployment granting DIRECT_OWNER_SYNC via group claim,
      users self-approve, contradicting the doc. (3) Directory pollution: arbitrary owner rows
      minted with no OWNER_CREATE. (4) Audit asymmetry: the request is recorded
      (REQUEST_APPROVED, isManual=false) but the Owner MINT is @ActivityLog-silent, so the
      "who created Owner-X" question has no trace (mint_path_audit_silent_on_self_mint).
