      one has approved any association request yet" (true on a fresh
      deploy) vs "everyone has been unbound" (operationally distinct).
      Same component used across all three tabs (Active / New /
      History) so an admin on Day 1 of a deployment sees the same UI
      shape they would see on a deployment with 1000 historical
      associations that have all been removed. The operator's only
      diagnostic affordance is the "+ Create association" button in
      the Header — present only behind OWNER_RELATION_MANAGE
      permission. For an admin LACKING that permission, the empty
      Active tab is fully silent.
    expected: |-
      Empty-state copy that distinguishes "no associations have ever
      existed" (offer the create CTA + link to the doc on user-owner
