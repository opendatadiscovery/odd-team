name: |-
  CHUNK_BASE_PATH hardcoded /tmp/odd/chunks regardless of attachment.storage (LSN-001 in-code residue — partial remediation gap)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-08
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20V — STRENGTHENS the LSN-001
  attachment-ephemeral-default retrospective by surfacing a partial remediation
  gap that remains in the code AFTER the doc-side remediation closed.

  THE LSN-001 LINEAGE:

    Original LSN-001 (retrospectives/LSN-001-attachment-ephemeral-default.md)
    captured the failure: 'LOCAL writes to /tmp/odd/attachments — wiped on
    container restart — documented as the safe default'. The doc-side
    remediation added the ephemeral-storage warning + the REMOTE recommendation
    + the Kubernetes-specific operator guidance (verified live at
    https://docs.opendatadiscovery.org/configuration-and-deployment/odd-platform#attachment-storage-configuration
    WebFetched 2026-05-20 status 200). Gate 3 (caveats-as-admonitions) and
    Gate 4 (consumer-read-before-authoring) emerged from this retrospective.

  THE IN-CODE RESIDUE — discovered by batch V primary-source examination:

    FileUtils.java:24 declares: private static final String CHUNK_BASE_PATH =
    '/tmp/odd/chunks'; (constant, NO operator-configurable knob, NO
    @ConditionalOnProperty switch on attachment.storage).

    Consumers (verified by batch V grep):
      - LocalFileUploadServiceImpl.java:34 uses CHUNK_BASE_PATH on initiate +
        upload + complete (the LOCAL storage path).
      - RemoteFileUploadServiceImpl.java:55 uses CHUNK_BASE_PATH on initiate +
        upload + complete (the REMOTE/S3 storage path).

    Effect: even when an operator follows the now-correct LSN-001-remediated
    documentation and switches attachment.storage=REMOTE for persistence,
    in-flight uploads still stage chunks under /tmp on the local container
    filesystem. A container restart in the middle of a multi-chunk upload
    loses the chunks-in-progress regardless of REMOTE configuration. The
    user-data-loss vector is REDUCED (completed files persist in S3) but
    NOT ELIMINATED.

  THE OPERATIONAL FAILURE MODE:

    1. Operator runs ODD Platform with attachment.storage=REMOTE (S3/MinIO).
    2. User starts a chunked file upload (initiateFileUpload returns uploadId).
    3. User uploads chunks 1-9 of 10 over a 30-second window.
    4. Container restarts — Kubernetes eviction, pod rolling restart, node drain.
    5. /tmp/odd/chunks/{uploadId}/ contents are GONE (tmpfs or container layer,
       not persistent).
    6. User retries completeFileUpload — fails because the chunks are missing.
    7. Operator sees a 'partial upload failed' error; user sees the upload
       wheel spin then fail; the docs say REMOTE persists files.
    8. Operator and user both assume REMOTE is broken; in fact REMOTE works
       perfectly for completed uploads; the staging path is the gap.

  THE MULTI-REPLICA FAILURE MODE — compounding:

    Multi-replica deployments (the platform's intended scaling shape per
    'Stateless controller — instances scale horizontally') exacerbate this
    failure. Upload chunks 1-3 land on pod A; chunk 4 routes to pod B;
    pod B has NO chunks 1-3 under /tmp; completeFileUpload on pod B fails
    or worse, completes-with-missing-chunks producing a corrupted assembled
    file. The node-local staging requires either (a) sticky session routing
    (not documented), (b) single-replica deployment (regression from the
    stated scaling shape), or (c) operators understand the staging-path
    constraint and configure their LB accordingly (not documented).

  THE PATTERN-LEVEL OBSERVATION:

    LSN-001 was a CONFIG-LAYER failure (the YAML default ships the wrong
    storage tier). LSN-001's CODE-LAYER residue is the CHUNK_BASE_PATH
    constant — a HARDCODED PATH that applies to both storage modes regardless
    of operator configuration. The doc-side remediation rule (Gate 3) closed
    the YAML failure; the code-side residue requires a code-level fix and is
    invisible at the YAML level. This is exactly the substrate's value-add:
    LSN-001's retrospective closed the doc loop; the code-side residue was
    invisible without consumer-read of FileUtils.java + the two consumer
    classes.

  THE REMEDIATION SCOPE:

    Minimal — make CHUNK_BASE_PATH operator-configurable via @Value with
    a sensible default OR mirror attachment.storage's @ConditionalOnProperty
    pattern with a chunk-specific staging path. The minimum viable fix is:

      @Value('${attachment.chunk.staging-path:/tmp/odd/chunks}')
      private String chunkBasePath;

    Paired with a doc admonition: 'multi-replica REMOTE deployments require
    either a shared filesystem for chunk staging OR sticky session routing
    OR operator-side acceptance that in-flight uploads do not survive
    pod restarts and pod boundaries'.

    A more thorough fix moves the chunk-staging to the REMOTE backend itself
    (multipart upload to S3 directly with the uploadId as the multipart-upload
    handle) — but that's a substantial refactor; the configurable-path is
    the immediate mitigation.

  SEVERITY: HIGH for clustered deployments (multi-replica + REMOTE storage
  presented as the recommended posture; the chunk-staging path silently
  breaks); MEDIUM for single-replica REMOTE deployments (a routine pod
  restart loses in-flight uploads but completed files persist).
