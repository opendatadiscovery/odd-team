description: |-
  NEW INVARIANT, batch 2026-05-20S — STRENGTHENS the existing
  `no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f`
  pattern from 8-sidecar to 9-sidecar by adding the service-tier PRIMARY-SOURCE
  closure across FIVE files in batch S. Records the cross-batch evidence
  consolidation so the audit-silence pattern's growth across batches A → S
  is traceable.

  THE 9-SIDECAR PATTERN END-TO-END (now batch-S-anchored):
    UI tier (batch Q — 5 sidecars):
      - AppToolbar (ui_shell — no logout audit affordance)
      - PolicyList (Management → Policies — no console.log, no analytics)
      - RolesList (Management → Roles — same)
      - OwnersList (Management → Owners — same; the operator-facing
        manifestation of the destructive-empty-roles silent strip)
      - CollectorsList (Management → Collectors — same; token rotation
        UI has no audit affordance despite destructive semantic)

    HTTP / controller tier (batch E + P — 5 sidecars):
      - createRole (batch E — RoleServiceImpl no @ActivityLog)
      - createPolicy (batch E — PolicyServiceImpl no @ActivityLog)
      - createOwner (batch E — OwnerServiceImpl.create no @ActivityLog)
      - updateOwner (batch P — OwnerServiceImpl.update no @ActivityLog;
        the rename verb silently destroys role bindings)
      - deleteOwner (batch P — OwnerServiceImpl.delete no @ActivityLog;
        HARD-deletes OWNER_TO_ROLE; soft-deletes owner; name re-usable)

    Service tier (batch S — 5 sidecars — THIS BATCH IS THE PRIMARY-SOURCE
    CLOSURE):
      - **OwnerServiceImpl (batch S)** — Grep-verified `@ActivityLog`
        absence across all 6 public methods of the 123-line class
        (`OwnerServiceImpl.java:1-123` + Grep `@ActivityLog` across
        `<odd-platform-api>/service/*.java` 2026-05-20 returns 10 files,
        NONE OwnerServiceImpl). The SEVENTH corroborating sidecar in the
        prior pattern; SERVICE-TIER ENCLOSING-CLASS anchor for the Owner
        directory mutation surface.
      - **PolicyServiceImpl (batch S)** — Grep-verified absence: NO
        @Slf4j annotation, NO Logger field, NO log.info / .warn / .error
        call, NO @ActivityLog annotation across the 117-line class.
        The EIGHTH corroborating sidecar; SERVICE-TIER PRIMARY-SOURCE
        for the Policy half.
      - **RoleServiceImpl (batch S)** — Grep-verified absence across
        the 143-line class; SERVICE-TIER PRIMARY-SOURCE for the Role
        half. The NINTH corroborating sidecar.
      - **AlertServiceImpl (batch S)** — partial-audit shape REFINED:
        the AlertManager webhook INGRESS (handleExternalAlerts lines
        151-191) is unaudited (no log, no @Timed), BUT the resulting
        alert-state-transitions ARE audited via the activity-feed batch
        save path (registerNewAlertsActivityEvents lines 309-325 with
        systemEvent=true). The audit gap is at INGRESS only. See
        companion invariant `audit-silence-applies-at-webhook-ingress-not-state-transitions`.
      - **DataSourceIngestionServiceImpl (batch S)** — DEBUG-only log
        at lines 53, 62; no INFO/WARN/ERROR; no ActivityEventEmitter;
        the datasource-side mirror of the RBAC audit gap. Also schema-blocked
        per batch R.

    SQL tier (batch H + N + R — 3 sidecars):
      - ReactivePolicyRepositoryImpl (batch H — persistence-layer silence)
      - ReactiveRoleRepositoryImpl (batch N — symmetric SQL primary-source)
      - ReactiveActivityRepositoryImpl (batch R — the SCHEMA-LAYER root cause)

    Schema tier (batch R):
      - V0_0_48__add_activity.sql:4,12 (data_entity_id NOT NULL FK to
        data_entity — the activity table CANNOT physically store an
        event that does not reference a data entity)

  WHY 9 SIDECARS MATTERS: the pattern is now anchored at the SERVICE-TIER
  PRIMARY-SOURCE for all FIVE major surfaces (Policy / Role / Owner /
  Datasource / Alert-ingress). Combined with the prior controller + UI +
  SQL + schema tiers, the audit-silence pattern is FULLY end-to-end at
  EVERY layer an operator can reach. A maintainer scanning the platform
  for "where do we audit RBAC mutations?" finds the answer: nowhere —
  not at the HTTP method, not at the service, not at the repository,
  not at the schema, not in the UI.

  THE BATCH S REFINEMENT: the Alert ingestion path is the ONE positive
  case-law point — alert state-transitions ARE audited because alerts
  ARE data-entity-scoped events. The schema-rooted limitation (batch R)
  is the unifying explanation for why some events emit and some do not.
  Cross-link to companion invariant
  `audit-silence-applies-at-webhook-ingress-not-state-transitions`.

  REMEDIATION SCOPE (per the schema-rooted invariant): adding annotations
  to OwnerServiceImpl / PolicyServiceImpl / RoleServiceImpl is INSUFFICIENT
  — the activity-event INSERT would fail at the FK constraint. The right
  scope is a schema migration (NULLable data_entity_id + discriminator
  column, OR a separate platform_event table) PAIRED with service-tier
  annotations + activity-event-type enum extensions.

  Severity: HIGH (the 9-sidecar pattern means the platform's RBAC + Owner
  + Datasource + Alert-ingress audit story is uniformly absent across
  every layer; a privileged caller / hijacked admin / S2S API-key holder
  per REFACTOR-108 who mutates the authorization model leaves no trail
  anywhere).
