# Data Entity Status Lifecycle — product-owner reflection

## product_owner_narrative

The Data Entity Status Lifecycle is the catalog-hygiene surface of Data Discovery
(pillar P-01): it lets an operator mark any catalogued entity with one of five
lifecycle states — `UNASSIGNED`, `DRAFT`, `STABLE`, `DEPRECATED`, `DELETED` — and,
for the two "transitional" states (`DRAFT`, `DEPRECATED`), schedule an automatic
flip to `DELETED` at an operator-chosen `status_switch_time` (per
updateStatus.md:concepts + WebFetch statuses 2026-06-04). The promise to the
operator is a **two-stage retirement pipeline**: stage one, the entity flips to
`DELETED` (a soft delete that hides it from default views and cascades through
lineage, group relations, statistics, and attachments); stage two, after a 30-day
grace window, the housekeeping job permanently hard-deletes the row and everything
attached to it (per HousekeepingTTLProperties.md:dependencies_semantic + WebFetch
verbatim "the default is 30 days ... governed by `housekeeping.ttl.data_entity_delete_days`").
The mental model the product sells is "deprecate, give downstream consumers a
month, then it's gone and your storage is reclaimed."

A user reaches this feature two ways. Interactively, an operator opens an entity's
detail page, picks a status from a dropdown, and (for DRAFT/DEPRECATED) sets a
switch time — this is `PUT /api/dataentities/{id}/statuses` carrying a
`DataEntityStatusFormData` body (per updateStatus.md:understanding). The detail
header then renders the chosen status as a data-driven badge (verified end-to-end
by IT-021, run 2026-06-03 PASS — STABLE / DEPRECATED render verbatim uppercase).
Hands-off, the platform itself acts: `DataEntityStatusSwitchJob` fires every 10
minutes under a 9-minute ShedLock, reads every entity whose `status_switch_time`
has elapsed, and bulk-flips them to `DELETED` (DataEntityStatusSwitchJob.java:21-31,
source_read_for_validation). Both paths are the SAME write path — they both route
through `DataEntityInternalStateServiceImpl.changeStatusForDataEntities` →
`DataEntityMapperImpl.applyStatus` (per updateStatus.md:dependencies_semantic +
the F-044 chain hops 3-4). Whatever is true of one path is true of the other.

The working parts the operator would see in a demo: a status dropdown with five
options; a switch-time picker that appears for DRAFT and DEPRECATED; a soft-delete
that cascades (so deleting a Data Entity Group with `propagate=true` deletes its
members too — per updateStatus.md:implicit_adrs); a "deleted items" filter to find
soft-deleted entities; and — invisibly — a background reaper that is supposed to
sweep DELETED entities away 30 days later. The operator tunes the window with
`housekeeping.ttl.data_entity_delete_days` (default 30, application.yml:170, per
HousekeepingTTLProperties.md). The catalog's source tree now carries an explicit
characterization pin (DataEntityStatusKnownBugTest, @pins PLT-027) that proves —
GREEN — that the reaper half is broken as shipped.

This feature integrates tightly with three neighbours. It FEEDS the Housekeeping
TTL Enforcement job (F-010 / P-08:F-002) — the downstream consumer that performs
stage two and is the entire reason `status_updated_at` exists. It SHARES the
soft-delete cascade with Attachment Lifecycle (F-027) — a hard-deleted entity's
attachment files are removed via a reactive `.block()` inside the housekeeping
transaction. And it is the lifecycle sibling of view-count tracking (F-001):
`status_switch_time` and `view_count` are the two operator-or-system-mutated
columns on `data_entity`, and the `isStale` indicator reads alongside status.

Edge cases a senior product owner flags in the demo: what happens to a DELETED
entity's audit trail when the deleting actor was the scheduler (not a human)?
what happens on RESTORE (DELETED → STABLE) — does the clock reset cleanly? what
does an operator see if 5,000 entities all mature in the same 10-minute window?
and — the one that turns out to matter most — does the storage actually get
reclaimed after 30 days, or does "soft delete" silently mean "delete forever"?
The bottom-up substrate already answered the last one: it does not (per
concepts "TTL retention broken by statusUpdatedAt nullification" cross-batch
invariant, now pinned GREEN by DataEntityStatusKnownBugTest). The hypotheses below
trace each promise through the assembled chain and, per the v0.3.0 promise layer,
assign each a coverage verdict against the real odd-platform test tree.

