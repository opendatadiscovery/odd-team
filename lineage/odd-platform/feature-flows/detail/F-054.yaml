note: |-
  Graduated 2026-05-26 from SHB-023. Pillar P-05 sub-feature "Microservices
  Lineage" is the second of two P-05 sub-feature seeds per system-mission.md
  (the first is "Data Objects Lineage" anchored by F-005 / F-016). This feature
  is the doc-promised distinct surface that has NO code-side anchor today; the
  three drift facets above capture the meaningful gaps. Promotion criterion:
  the doc-side pillar surface PROMISED a distinct UX; the code-side delivers
  uniformity — that asymmetry IS the feature.
