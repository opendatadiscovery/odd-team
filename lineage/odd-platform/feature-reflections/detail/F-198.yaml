  hypothesis: "When an operator sets only ONE alert type's halt window in the dialog and leaves the other three untouched, only that one column is changed server-side (the other three retain their existing values)."
  derivation: "Response-shape + Category-F: the form exposes four independent pickers, so a senior PO expects a partial edit to be a partial write — editing 'failed job' should not disturb 'incompatible schema'."
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |
      Field-level isolation holds ONLY because the dialog re-populates all four values from the on-open
      fetch and submits the whole form. The repository's DO UPDATE sets ALL FOUR halt columns
      unconditionally (AlertHaltConfigRepositoryImpl.java:55-60) — there is no per-column "only if
      present" merge at the SQL tier. So the invariant "untouched columns keep their value" is an
      emergent property of the UI round-tripping the full config, NOT a guarantee of the write path. It
      holds on the happy path (successful populate -> edit one -> submit full). It BREAKS on the
      failed-populate path (H-004: empty form -> all four blanked) and on the concurrent-edit path
      (H-002: a stale full-form submit rewrites the three the operator never looked at). PARTIAL: the
      promise is delivered on the happy path and silently violated on the two edge paths.
    evidence:
      - sidecar: "(source_read_for_validation — AlertHaltConfigRepositoryImpl.java)"
        section: "create() DO UPDATE sets all four halt columns"
        cite: "AlertHaltConfigRepositoryImpl.java:55-60"
        note: "all four columns set on every upsert — no per-column conditional merge"
        source_read_for_validation: true
      - sidecar: "(F-198 feature-flow chain hop 2)"
        section: "chain[hop 2] evidence (full-form submit)"
        cite: "NotificationSettings.tsx:50 (updateDataEntityAlertsConfig with full dataEntityAlertConfig)"
        note: "the UI submits the whole config — the only reason untouched columns survive"
        source_read_for_validation: false
    operator_visible_failure: |
      In the steady state an operator editing one alert type does not disturb the others — fine. But the
      isolation is fragile: it depends entirely on the dialog faithfully reloading and resubmitting the
      full config. The moment the populate fails (H-004) or a concurrent dialog holds stale data (H-002),
      editing one column silently rewrites the other three. An operator has no way to know that "I only
      touched failed-job" did not, in fact, leave the other three alone.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional
    dedup_note: "net_new as a low-severity caveat, but it is the SAME ROOT as H-002/H-004 (the unconditional all-column DO UPDATE). Folds under PLT-053 Defect 1 once a version/merge strategy is chosen (a field-level merge or a version check both fix this). No separate filing — record as a corroborating consequence of the all-column-upsert root."

