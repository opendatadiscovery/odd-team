      No protection. toggleEditMode (useTermWiki.ts:46-49) re-syncs internalDescription = description (the
      redux-stored value) on EVERY flip — so a user who clicks Cancel then re-clicks Edit sees the LAST SAVED
      description, not their cancelled work. There is NO autosave, NO draft preservation, NO warn-on-navigate,
      NO undo, NO confirm-discard prompt. The sidecar's implicit-ADR reading is that this is deliberate (the
      reset line is explicit and would have been trivial to omit) — but a product owner would flag it as a
      data-loss UX hazard on a free-text surface where users write paragraphs.
