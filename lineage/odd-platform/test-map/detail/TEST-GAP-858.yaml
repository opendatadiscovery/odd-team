surfaced_by:
  - "TagServiceImpl.md:stress_findings.C.S-C-2 (updateRelationsWithDataEntity with EMPTY tagNames Set — INTERPRETED as remove all non-external tags from this data entity — destructive operation triggered by an empty input)"
behaviour: |-
  **HIGH — `TagServiceImpl.updateRelationsWithDataEntity(dataEntityId, Set.of())` is DESTRUCTIVE: with an empty `tagNames` Set, the diff computes `pojosToDelete = currentRelations \ updated = currentRelations` (every non-external relation goes into the delete set), then issues `deleteDataEntityRelations(pojosToDelete) + createDataEntityRelations(empty)`. The empty input is INTERPRETED as "remove all non-external tags from this entity" — a destructive operation triggered by what callers might intuitively read as "no change requested".** No test pins this contract; a future caller (`DataEntityServiceImpl.upsertTags`) that mistakenly passes `Set.of()` when meaning "no-op" will silently strip all non-external relations from the entity.

  **Primary-source chain** (per TagServiceImpl.md:stress_findings.C.S-C-2):
  - `TagServiceImpl.java:96-121` (`updateRelationsWithDataEntity`): the diff method.
  - `:102` reads `currentRelations` filtered to `!external`.
  - `:107-110` builds `updatedRelations` from `tagNames`. If `tagNames = Set.of()`, `getOrCreateTagsByName(Set.of())` returns `Flux.empty()` → `updatedRelations = []`.
  - `:114-116`: `pojosToDelete = current.stream().filter(r -> !updated.contains(r)).toList()` → `pojosToDelete = current` (everything goes into delete set).
  - `:117-118`: `deleteDataEntityRelations(pojosToDelete)` hard-deletes all non-external `tag_to_data_entity` rows.
  - `:119`: `createDataEntityRelations(updated)` is a no-op (empty list short-circuits per repository's empty-batch guard).
  - `:120-121`: `listDataEntityDtos(dataEntityId)` returns the post-state — which is ONLY the external relations.

  **What this CAN do operationally**:
  - **The path is reachable from `PUT /api/dataentities/{id}/tags` with `tagNames: []`**: an SDK consumer passing an empty array (perhaps as part of a multi-form-field UI's serialisation when the user clears all chips) triggers the destructive cascade. No client-side warning, no server-side warning.
  - **The doc page DOES NOT advertise this semantic**: the live tagging page describes the per-entity assignment as "select from existing vocabulary or create new labels on the spot"; nothing names the empty-array-deletes-all behavior.
  - **The test corpus does NOT pin this**: no `TagServiceImplTest` exists at all (per TagServiceImpl.md:tests_coverage_semantic.covered_behaviours = []).

  **Why HIGH not MEDIUM**:
  - The empty-input destructive operation is a SILENT data-loss surface. A user clicking "remove all tags" in a UI followed by Save triggers it intentionally; a UI bug submitting empty list when the user navigated away triggers it accidentally.
  - The pattern is shared with REFACTOR-NNN class "empty-input destructive operations" — sister cases include other diff-style endpoints where empty means "remove all".
  - The defense against it (cap empty-list to a UI confirmation or an explicit `removeAll: true` flag) requires either a contract change or a guard at the service layer.

  **The OpenAPI side** — `openapi.yaml` documents `tag_name_list: List<String>` with no `minItems` constraint. Future SDK consumers building against the spec see the field as a regular list and submit empty lists for "no tags" / "clear all" / "no change" — three semantically distinct operator intents, ONE behavior.
