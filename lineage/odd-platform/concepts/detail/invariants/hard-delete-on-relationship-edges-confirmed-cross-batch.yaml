name: HARD-DELETE on relationship-edge tables (multi-site confirmed)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-06
description: |-
  **NEW INVARIANT, batch 2026-05-19L** — cross-site confirmation of a
  deliberate ODD architectural pattern: relationship-edge tables (join
  tables between two first-class entities) use HARD-DELETE on user-initiated
  unlink, distinct from the entity-deletion CASCADE which uses
  SOFT-DELETE. The intent is encoded across multiple migrations + multiple
  repository sites:

  **Site 1 — `data_entity_to_term`** (term-linkage edge):
    - Migration `V0_0_76__term_relations_hard_delete.sql:1-6` explicitly
      DROPS the `deleted_at` column from `data_entity_to_term` AND deletes
      any rows where `deleted_at IS NOT NULL`. The migration is forward-only
      data-migrating, not just a schema change.
    - `TermRelationsRepositoryImpl.java:81-87` issues `DSL.deleteFrom(DATA_ENTITY_TO_TERM)`
      (physical DELETE) on user-initiated unlink.
    - The composite PK `(data_entity_id, term_id, is_description_link)` per
      `V0_0_77__data_entity_term_description.sql:13-14` supports the
      two-row coexistence pattern (manual + description-link).

  **Site 2 — `group_entity_relations`** (DEG-membership edge):
    - `ReactiveGroupEntityRelationRepositoryImpl.java:57-65` uses
      `DSL.deleteFrom(GROUP_ENTITY_RELATIONS)` (HARD-DELETE) on
      user-initiated `deleteRelationsReturning`.
    - The SIBLING `softDeleteRelationsForDeletedDataEntities` (lines 92-101)
      uses `DSL.update(...).set(IS_DELETED, true)` for the
      entity-deletion CASCADE only — paired with
      `restoreRelationsForDataEntities` (lines 104-112).

  **Site 3 — `ownership`** (cross-batch from batch H):
    - `ReactiveOwnershipRepositoryImpl` uses physical DELETE on the
      `ownership` edge table; no `deleted_at` column.

  **The architectural intent** (cross-batch ADR shape):
    - User-initiated unlink is a DELIBERATE removal — the operator
      committed to ending the relationship; the row's removal is final.
    - Entity-deletion CASCADE is a TENTATIVE removal — the underlying
      entity might be restored (ingestion may re-emit a deleted entity);
      the edge row is soft-deleted so `restore*` can resurrect it
      symmetrically with the entity's restore.
    - The semantic split prevents accidental data-loss while preserving
      operator commit-to-removal for explicit actions.

  **Operator-facing manifestation**:

    - Once a user unlinks (term, entity) or (entity, DEG), there is NO
      row-level restore — the only durable record is the
      `@ActivityLog(TERM_ASSIGNMENT_UPDATED)` BEFORE/AFTER JSON state
      (for term links; for DEG memberships there is ZERO audit because
      `addDataEntityToDEG` + `deleteDataEntityFromDEG` carry NO
      `@ActivityLog`).
    - Restoring a soft-deleted entity DOES resurrect soft-deleted edges
      via the `restore*` repository methods — but only edges that were
      removed by the CASCADE, not by user action. Mixed-history is
      surprising: "I deleted the entity, then restored it; some of my
      DEG memberships came back but not the one I'd explicitly removed
      last month."

  **Pattern shape vs other soft-delete mechanisms**: cross-references the
  batch-H "three-soft-delete-mechanisms-across-the-repository-layer"
  invariant. Combined map:
    - Operator-facing entities (data_entity, term, owner, role, policy,
      datasource, collector, namespace, tag) — SOFT-DELETE
      (deleted_at OR is_deleted OR STATUS state-machine; 3 variants).
    - Relationship-edge tables (data_entity_to_term, group_entity_relations,
      ownership, term_relations) — HARD-DELETE on user action,
      SOFT-DELETE on cascade (where applicable).

  **Documentation gap**: the operator-facing pages (groups-domains.md,
  business-glossary.md) do NOT explain that user-initiated unlinks are
  IRREVERSIBLE while cascade-driven unlinks are restorable. Operators
  reasoning about "will my term-links come back after entity restore?"
  need this knowledge but the docs are silent.
