behaviour: |-
  **DISABLED-mode 'admin' username display + Logout 404 + scroll-elevation rendering edge-case gap.** AppToolbar is unconditionally mounted by App.tsx:56 across all 4 auth modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP). Three specific edge cases are uncovered:
  (a) **DISABLED-mode 'admin' literal**: when `auth.type=DISABLED` the IdentityController.dummyOwner returns identity.username='admin' with owner=null, so the toolbar's `{owner?.name ?? identity?.username}` (AppToolbar.tsx:74) renders the literal string 'admin' to every anonymous network caller. This is the user-visible UX symptom of REFACTOR-185: any anonymous network caller who can reach the SPA sees themselves rendered as 'admin' in the top-right corner and has every action available. The toolbar surfaces NO warning, NO banner, and NO indicator that the user is unauthenticated. severity HIGH per batch-ZJ AppToolbar bugs_limitations_corner_cases.[2].
  (b) **Logout 404 under DISABLED**: clicking Logout under auth.type=DISABLED yields a 404 — `.logout(Customizer.withDefaults())` is only configured in `LoginFormSecurityConfiguration.java:59` and `LDAPSecurityConfiguration.java:146`; OAUTH2 uses a custom handler; DisabledAuthSecurityConfiguration.java has NO `.logout(...)` call. The Logout link is shown to every user including DISABLED-mode users; clicking it produces a confusing 404. severity MEDIUM per batch-ZJ AppToolbar bugs_limitations_corner_cases.[3].
  (c) **Scroll-triggered elevation**: `AppToolbar.tsx:40-44` uses `useScrollTrigger({ disableHysteresis: true, threshold: 10 })` to toggle a visual elevation state via `useEffect` at line 46. No test asserts (i) elevation transitions from 0 to elevated when the trigger flips; (ii) the threshold of 10px is preserved (regression-pin against accidental changes).
