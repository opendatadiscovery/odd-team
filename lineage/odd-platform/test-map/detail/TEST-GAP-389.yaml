behaviour: 'Silent lineage-replace-on-each-call — ingest entity E with lineage to A,B;
  re-ingest E with lineage to A only. The B edge is REMOVED (per LineageIngestionRequestProcessor.java:17
  — `replaceLineagePaths`; LineageService.replaceLineagePaths SQL primary source verbatim
  per LineageServiceImpl.java:124-133 — `batchDeleteByEstablisherOddrn(establishers).thenMany(batchInsertLineages(pojos))`).
  Same silent-data-loss class as metadata. No test asserts this. A regression that
  changed replace to merge (or vice versa) would not break any test. The replace-not-merge
  is the ESTABLISHER-KEYED atomic-rewrite contract (per LineageServiceImpl.md:implicit_adrs.[1])
  — pinning current behaviour anchors the contract for non-destructive multi-producer
  ingestion.'
