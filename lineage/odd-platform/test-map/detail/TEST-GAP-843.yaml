behaviour: |-
  **HIGH — Directory level-1 catalog inventory anonymously reachable under DISABLED. UI-tier confirmation of F-023 facet 5 (disabled_mode_anonymous_reach_directory).** Directory.tsx:14-55 has NO `authType` check. The route mount at App.tsx:72 (`<Route path={`${directoryPath()}/*`} element={<DirectoryRoutes />}/>`) is unconditional. Under `auth.type=DISABLED`, the SPA serves `/directory` to ANY anonymous caller AND the level-1 cards render with full `entitiesCount` per ODDRN-prefix bucket.

  **Contrast with sibling components**:
  - `Overview.tsx:53-59` gates the Recommended panel by `appInfo.authType !== 'DISABLED'` (the OwnerAssociation wrapper hides the Popular column under DISABLED)
  - `PopularStrip` sidecar invariant 6 (batch J) — same authType check
  - `Directory.tsx` has NEITHER check

  **The asymmetry is structural**: Overview's authType check is intentional (the Popular column inside the Recommended panel SHOULD NOT render under DISABLED per the doc); Directory's absence is similarly intentional under ADR-CANDIDATE-003 (read-collaborative catalog posture). BUT the result is that the level-1 catalog inventory leaks operational fingerprinting data to ANY anonymous caller under DISABLED:
  - Every ODDRN-prefix bucket (postgresql, snowflake, kafka, airflow, mysql, ...) — reveals deployment stack composition
  - `entitiesCount` per bucket — reveals deployment scale and per-source proportionality
  - The 4-level drill-down navigation (level-2 reveals datasource instances with HOST/PORT/DATABASE per F-023 facet 2; level-3 reveals entity-class distributions; level-4 reveals individual entity ODDRNs)

  **The doc page** (data-discovery/directory, WebFetched 2026-05-20 status 200) does NOT warn that under DISABLED the Directory is anonymously reachable. Operators reading the doc cannot calibrate the risk.

  **Why HIGH**:
  - **Security**: anonymous reach to catalog inventory under default config (DISABLED is the application.yml default per AppInfoController sidecar batch-T)
  - **Fingerprinting**: the level-1 grid reveals deployment composition without authentication
  - **Cascade**: the level-1 cards are `<Link to={prefix}>` — clicking drills into level-2 (datasource instances), level-3 (entity types), level-4 (individual entities) — all unscoped per F-023

  **Test gap shape**: Integration test confirming the route is anonymously reachable under DISABLED + the cards render with full content + the level-2/3/4 chain is also reachable.
