behaviour: |-
  hasDescriptionRelations — restore-soft-deleted-entity corner case: a Term is hard-deleted while only mentioned in a soft-deleted entity; the entity is restored; the Term is now dangling. Verify `[[ns:term]]` text resolution behaviour post-restore. The guard at lines 415, 425 filters `DATA_ENTITY.STATUS.ne(DELETED.getId())` — so a Term mentioned only in a soft-deleted data-entity's description CAN be renamed or hard-deleted; when the data-entity is later restored, the description's `[[ns:term]]` text still references the (now-renamed-or-deleted) Term. The description's mention silently downgrades to 'unhandled' on the next description edit (if the Term was renamed) or remains as broken-link text (if the Term was deleted). Operator-visible inconsistency surface: restore-soft-deleted-entity is a documented feature but its interaction with Term lifecycle is undocumented.
