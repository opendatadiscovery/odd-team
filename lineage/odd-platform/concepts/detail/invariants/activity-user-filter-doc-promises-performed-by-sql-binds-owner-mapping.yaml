security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: N/A
    detail: |-
      Not an authorization invariant — name-vs-binding drift at the
      filter parameter layer.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The bug REINFORCES the cross-owner enumeration posture — the
      User filter doesn't restrict by who-performed; it filters by
      who-owns-entity via mapping. Combined with the un-gated
      ActivityController (cross-owner read-collaborative), the audit
      trail is operator-misleading from BOTH ends: who can see WHAT
      (cross-owner) and WHO filters WHO (owner-of-entity via
      mapping).
  strengths:
    - |-
      The backend code IS internally consistent — `userIds` binds to
      `USER_OWNER_MAPPING.OWNER_ID` deterministically; the SQL is
      not buggy, it just implements a different semantic than the
      label promises.
    - |-
      The cross-batch LSN-020 family captures this drift class at
      multiple sites — the maintainer has visibility into the
      pattern across the platform.
  weaknesses:
    - |-
      A security/compliance reviewer auditing "who did X" gets the
      wrong answer silently. The audit trail's first-line filter
      misleads the most common security use case (insider-threat
      review).
    - |-
      Doc, UI label, and backend code form THREE-LAYER reinforcement
      of the wrong promise — operator has no signal anywhere that
      the filter semantic differs from "events performed by".
    - |-
      The drift is uniform across all six locales — no locale
      corrects the misleading label (natural-keys pattern + no
      locale-specific override of en.json:347). A French / Spanish /
      Chinese / Ukrainian / Armenian compliance reviewer sees the
      same misleading label on their localised UI. (batch ZJ)
    - |-
      Reassigning user-owner associations retroactively rewrites who
      appears responsible for past actions — the audit trail
      mutates under maintainer admin actions.
  cross_file_inconsistencies:
    - |-
      The Filters component label, the live doc, the i18n key in all
      six locales, and the SQL binding DISAGREE. The doc and the key
      label promise "performed by"; the SQL binds to "owner of entity
      via user-mapping". Four independent sources of truth with no
      consistency check.
  contributing_files:
    - odd-platform__ts__routes__route__activity.md
    - ActivityController.getActivity.md
    - 'odd-platform__json__locales_translations__i18n-resource__en.md'
