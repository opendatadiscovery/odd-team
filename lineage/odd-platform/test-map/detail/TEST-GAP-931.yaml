proposed_action: |-
  Author IdentityControllerCacheControlTest as a four-mode @SpringBootTest
  asserting that GET /api/identity/whoami carries `Cache-Control: no-store,
  no-cache, max-age=0, must-revalidate` (or at minimum `no-store`) under every
  auth mode INCLUDING DISABLED. FIX-REQUIRED — the production controller needs
  the header set explicitly (Spring Security's default does not fire under
  DISABLED because no security chain runs). Two-line fix in the controller:
  `exchange.getResponse().getHeaders().setCacheControl(CacheControl.noStore())`
  before the .map(ResponseEntity::ok).
