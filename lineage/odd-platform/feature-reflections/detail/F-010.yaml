    coverage: unverified  # no test asserts the empty-only drop semantics for the activity table at runtime
    test_demand: functional  # an integration guard: seed a non-empty past activity partition, run a cycle, assert it is NOT dropped (pins the no-time-based-retention reality)

- id: H-007
  hypothesis: >-
    When an empty past `activity` partition is dropped, no concurrently-written
    activity row is lost — the "empty partitions only" name guarantees the drop is
    safe against in-flight writes.
  derivation: >-
    The class name `ActivityEmptyPartitionsHousekeepingJob` promises it only drops
    EMPTY partitions; an operator trusts that an audit row being written at the
    same moment is not silently destroyed.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The empty-check (`SELECT count(*) = 0`) and the `DROP TABLE` (no `IF EXISTS`)
      are TWO separate statements on the shared connection, NOT wrapped in a
      transaction and holding no pre-emptive lock (PartitionServiceImpl.java:108-127;
      EmptyPartitionsHousekeepingJob does NOT wrap in `transaction(...)`, unlike
      AlertHousekeepingJob/DataEntityHousekeepingJob). An `INSERT INTO activity`
      that lands AFTER the count-zero check but BEFORE the DROP would succeed
      (committed on the writer's autocommit connection), then DROP TABLE destroys
      the just-inserted row with no recheck and no error to the original caller.
      Static analysis says the race window is real (Q-E.3, Q-B.2); whether it is
      reachable under realistic write timing requires running the system.
    evidence:
      - sidecar: odd-platform__java__housekeeping__job__ActivityEmptyPartitionsHousekeepingJob.md
        section: bugs_limitations_corner_cases[1] + stress_findings Q-E.3 / Q-B.2
        cite: "PartitionServiceImpl.java:108-127 (two-statement non-transactional pattern)"
        note: "race window between empty-check and DROP; silent row loss if INSERT wins"
      - test: "AdrHousekeepingPartitionScanTest.theOneBridgeDelegatesDropToPartitionService (@enforces ADR-0045)"
        note: >-
          v0.3.0 — a structural pin confirms EmptyPartitionsHousekeepingJob
          delegates to PartitionService.getEmptyPastPartitions + dropPartition, but
          it asserts NOTHING about the check-then-drop atomicity; the race is
          unguarded.
    operator_visible_failure: |
      If confirmed: silent loss of an audit-trail row that the writing code saw as
      committed-success — the worst kind of audit defect (the record the operator
      believes was saved is gone, with no error and no compensating undo). Severity
      HIGH if reachable.
    severity: HIGH
    confidence: MEDIUM
    probe_id: PENDING-F-010-1  # parallel-safe: see ## probes_emitted; corresponds to existing P-022 (activity check-then-drop race)
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint  # the "empty-only, race-safe" drop promise behind the class name
    coverage: unverified  # probe-needed; static pin confirms delegation only, not atomicity
    test_demand: probe  # PENDING-F-010-1 (the concurrent-INSERT-during-drop race probe)

- id: H-008
  hypothesis: >-
    When ODD is deployed with multiple replicas, exactly one housekeeping cycle
    runs per 15-minute slot — ShedLock guarantees no two instances purge
    concurrently.
  derivation: >-
    The doc states housekeeping "uses ShedLock so only one platform instance runs
    it at a time in a multi-instance deployment"; the operator expects safe
    multi-replica behaviour.
  seed_source: doc-claim
  validation:
    verdict: probe-needed
    actual_behavior: |
      The orchestrator's lock is `lockAtLeastFor="14m" / lockAtMostFor="14m"`
      against a `fixedRate=15` schedule (HousekeepingJobManager.java:25-26) — only
      60 seconds of slack between maximum lock and next invocation. A cycle running
      ≥14 minutes (a large DataEntityHousekeepingJob cascade, especially with the
      `.block()` on S3 deletions) releases the lock BEFORE it commits, and a second
      instance can acquire at the 15-minute mark while the first is still
      finalising — two instances running housekeeping concurrently. Most row
      DELETEs are idempotent, but the data-entity cascade reads-then-deletes, so
      two concurrent snapshots could diverge; the empty-partition DROP (no
      IF EXISTS) raises an error on the loser. Whether a real cascade exceeds 14
      minutes (and thus whether the race is reachable) requires running the system.
    evidence:
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: bugs_limitations_corner_cases[3] + implicit_adrs[2]
        cite: "HousekeepingJobManager.java:25-26 (14m lock vs 15m schedule)"
        note: "razor-thin window; lock can release before commit on slow cycles"
      - sidecar: odd-platform__java__housekeeping__job__ActivityEmptyPartitionsHousekeepingJob.md
        section: stress_findings Q-E.1
        cite: "EmptyPartitionsHousekeepingJob.java:30-32 + HousekeepingJobManager.java:25-26"
        note: "two concurrent instances → DROP TABLE error on the loser, log noise, wasted work"
      - test: "AdrHousekeepingPartitionScanTest.housekeepingRunsFixedRate_partitionRunsNightlyCronAndBoot (@enforces ADR-0045)"
        note: >-
          v0.3.0 — a structural pin confirms fixedRate=15 + TimeUnit.MINUTES and
          the distinct ShedLock name, but asserts NOTHING about the 14m/14m
          lock-window vs 15m schedule slack; the race is unguarded.
    operator_visible_failure: |
      If confirmed under a realistic backlog: divergent data-entity cascade
      behaviour between two concurrent instances, plus per-cycle ERROR-log noise on
      the empty-partition DROP race, on every interval where a cycle straddles the
      15-minute boundary. Severity MEDIUM (theoretical until the soft-delete
      backlog grows the cascade past 14 minutes).
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-010-2  # parallel-safe: see ## probes_emitted; corresponds to existing P-011 (multi-instance ShedLock race)
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor  # the multi-replica single-runner promise
    coverage: unverified  # probe-needed; static pin confirms schedule/lock name only, not the window-slack behaviour
    test_demand: probe  # PENDING-F-010-2 (multi-instance docker-compose, inject a >=14m cycle, assert second instance does not acquire)

- id: H-009
  hypothesis: >-
    When MinIO/S3 attachment storage is unreachable, the housekeeping cycle still
    completes its alert + search-facet purges and only the data-entity cascade is
    affected.
  derivation: >-
    A robust per-cycle design isolates a failing dependency; the operator expects
    one broken subsystem (S3) not to wedge unrelated cleanup. (The feature DOES
    have per-job exception isolation — HousekeepingJobManager.java:41-47 — so the
    naive expectation is that S3 failure is contained.)
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The per-job try/catch isolates a job that THROWS, but
      `fileUploadService.deleteFiles(filePojos).block()` at
      DataEntityHousekeepingJob.java:142 is `.block()`ed with NO timeout INSIDE the
      ~25-table transaction (DataEntityHousekeepingJob.java:71). Under an
      accepted-but-silent S3 endpoint the `.block()` HANGS rather than throws — and
      because all five jobs run sequentially on ONE shared connection
      (HousekeepingJobManager.java:32-35) with NO ordering contract
      (HousekeepingJobManager.java:23), a hung DataEntityHousekeepingJob that runs
      first blocks the alert + search-facet purges for that cycle. If S3 eventually
      throws, the transaction rolls back ALL ~25 deletes and the next cycle retries
      the whole batch — under persistent misconfiguration the data-entity backlog
      never drains, with only `log.error` as signal. Whether the block hangs vs
      bounds depends on the S3 client timeout; requires running the system to
      know which jobs are blocked and for how long.
    evidence:
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: bugs_limitations_corner_cases[2] + coupling[3]
        cite: "DataEntityHousekeepingJob.java:71,142 + HousekeepingJobManager.java:32-35,45"
        note: ".block() inside transaction, no timeout, shared connection, no @Order — REFACTOR-145"
    operator_visible_failure: |
      If confirmed: (1) a misconfigured S3 region/credential (LSN-002 shape) stalls
      the entire housekeeping cycle until the read-timeout or 14m ShedLock expiry,
      and — depending on bean order — silently prevents the alert + search-facet
      purges from running at all; (2) soft-deleted entities never fully purge while
      S3 is down (silent backlog accumulation); (3) the only operator signal is a
      single ERROR log line — no metric, no per-job failure counter. Severity
      MEDIUM.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-010-3  # parallel-safe: see ## probes_emitted; corresponds to existing P-310 (.block()-S3 cycle-wedge)
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor  # per-job failure isolation under a failing external dependency
    coverage: unverified  # probe-needed
    test_demand: probe  # PENDING-F-010-3 (mock-S3 infinite hang, assert cycle stalls + cascade rolls back; order-dependent block of alert/facet purges)

