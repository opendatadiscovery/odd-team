proposed_action: |-
  Add `TokenGeneratorEntropySourceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/`. Three test methods:
  1. `tokenGeneratorImpl_generateToken_usesRandomStringUtils_pinsCurrentImplementation` — use reflection or AST inspection to assert `TokenGeneratorImpl.generateToken` invokes `org.apache.commons.lang3.RandomStringUtils.randomAlphanumeric(40)`. PIN the current implementation.
  2. `tokenGeneratorImpl_regenerateToken_usesSameMethod_assertsSymmetry` — sister assertion on the regenerate path.
  3. `randomStringUtilsRandomAlphanumeric_delegatesToThreadLocalRandom_pinsLibraryContract` — use a fixed seed on ThreadLocalRandom; assert that two calls to RandomStringUtils.randomAlphanumeric produce reproducible output (proving ThreadLocalRandom is the source); document the comparison vs SecureRandom (which would NOT be reproducible with a fixed seed in the same manner).

  Pair with REFACTOR-NNN: migrate `TokenGeneratorImpl` to use `SecureRandom`. The fix is a 5-line change:
  ```java
  private static final SecureRandom secureRandom = new SecureRandom();
  private static final String CHARS = "abcdefghijklmnopqrstuvwxyz...";
  public String generateToken() { ... use secureRandom ... }
  ```

  When the fix lands, test #3 inverts to assert SecureRandom is the source.

  Cross-pair with DOC-NNN: add a "Token Strength" subsection to the Security Architecture doc; explain the current entropy source AND the planned migration to SecureRandom.
