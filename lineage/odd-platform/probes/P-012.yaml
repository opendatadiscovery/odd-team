question: |
  Does ActivityEmptyPartitionsHousekeepingJob silently DROP a partition that
  became NON-EMPTY between the `isPartitionEmpty` check (PartitionServiceImpl.java:133-142,
  `SELECT count(*) = 0 FROM <partition>`) and the `DROP TABLE` call
  (PartitionServiceImpl.java:121-127) — i.e. does a concurrent
  `INSERT INTO activity` landing in the race window result in the just-inserted
  row being silently destroyed without any error returned to the inserting
  caller?

  This is the boundary verification of the class name's promise:
  "EmptyPartitions" implies "only empty partitions are dropped". The centre
  meaning holds (the check fires). The boundary meaning is at risk.

stress_category: B (name-behavior pairs), E (resource boundaries)
stress_question_ids: [Q-B.2, Q-E.3, Q-E.5]

