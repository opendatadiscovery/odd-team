expected_outcome: |
  Quoting hypothesis H-012 verbatim:
  "Two operators opening the same popular entity's detail page concurrently each
  have their read counted correctly (no lost updates), and a client paging
  through the full Popular list sees each entity exactly once."

  Two sub-assertions, neither settle-able statically:

  (a) NO LOST UPDATE on view_count under concurrency. The increment is
      `UPDATE data_entity SET view_count = view_count + 1`, which Postgres makes
      atomic per-statement — so N concurrent detail-reads of the SAME entity must
      produce exactly +N (the sidecar asserts this "by SQL semantics, not by
      test"; this probe MEASURES it). Because of the LSN-017 +2 doubling, a
      headless page-open fires TWO increments — so for the API-driven variant we
      drive GET /api/dataentities/{id} directly (one increment per call) to
      isolate the lost-update question from the doubling.

  (b) PAGINATION STABILITY. getPopular is non-transactional + offset-based. A
      client iterating page=1..K WHILE concurrent reads mutate view_count may see
      an entity twice or miss one. This probe pages through a seeded set with a
      controlled concurrent-increment stream and asserts the union of ids across
      pages contains no duplicate and no dropped seeded id beyond the documented
      offset-shift tolerance.

  PASS = (a) delta == number_of_concurrent_api_calls exactly (no lost update);
  (b) reflection verdict for H-012 flips from probe-needed to confirmed if pages
  are duplicate/skip-free under the concurrent stream, or to partial/contradicted
  if duplicates/skips are observed (with the observed rate recorded).
