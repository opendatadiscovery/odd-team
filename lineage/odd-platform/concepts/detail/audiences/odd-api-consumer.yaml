name: ODD API Consumer
canonical_in_docs: false
canonical_candidate: true
description: Programmatic clients building integrations against the platform's `/api/*`
  HTTP surface (OpenAPI-generated SDKs, custom curl/scripts, third-party tooling).
  Distinct from the UI end-user — different shape (programmatic), different cadence,
  different testing posture. Surfaces across every controller and openapi-tag sidecar.
axes_present:
- controllers
- openapi_tags
nodes:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertController
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityController
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:GenAIController
- odd-platform openapi tags openapi-tag:alert
- odd-platform openapi tags openapi-tag:dataEntity
- odd-platform java DataEntityAttachmentController controller-method:uploadFileChunk
- odd-platform java DataEntityController controller-method:getDataEntityDetails
- odd-platform java DataEntityController controller-method:getDataEntityDownstreamLineage
- odd-platform java IngestionController controller-method:postDataEntityList
contributors:
- 'Multiple controller sidecars: API consumers building integrations against /api/<resource>*'
- 'openapi-tag:alert.audiences: OpenAPI generator + Human readers of the spec navigating
  by tag in tools like Swagger UI / ReDoc / Stoplight'
- 'openapi-tag:dataEntity.audiences: UI client + platform integrations writing back
  metadata + operators inspecting alerts/runs/activity'
- 'uploadFileChunk.audiences: API consumers implementing the 3-step protocol against
  /api/dataentities/{id}/files/uploads/{upload_id}/chunks'
- 'getDataEntityDetails.audiences: third-party API consumers calling GET /api/dataentities/{id}
  to build dashboards, exports, or compliance scans (often reading the OpenAPI spec
  to discover the 34-field DataEntityDetails payload because no doc page enumerates
  it)'
- 'getDataEntityDownstreamLineage.audiences: third-party API consumers reading /api/dataentities/{id}/lineage/downstream
  directly — no contract caveat tells them what depth is safe to ask for; live API-reference
  page has two doc-bugs'
- 'postDataEntityList.audiences: odd-collector / odd-collector-sdk HTTP clients pushing
  data-entity definitions; odd-platform operators standing up an ingestion pipeline;
  security reviewers auditing the S2S surface'
evidence:
- AlertController.md:concepts.audiences.[1]
- DataEntityController.md:concepts.audiences.[1]
- openapi-tag-alert.md:concepts.audiences
- openapi-tag-dataEntity.md:concepts.audiences
- uploadFileChunk.md:concepts.audiences
- getDataEntityDetails.md:concepts.audiences
- getDataEntityDownstreamLineage.md:concepts.audiences
- postDataEntityList.md:concepts.audiences
notes: '"API Consumer" is not in main-concepts.md''s vocabulary as a

  first-class audience. Surface as canonicalisation candidate;

  every controller and openapi-tag sidecar names this audience.

