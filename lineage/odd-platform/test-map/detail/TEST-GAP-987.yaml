proposed_action: |-
  Add `DataQualityRunsCrossOwnerReadTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `getDataQualityTestsRuns_callerHasNoOwnership_returns200WithFullCatalogAggregate_pinsReadCollaborativePosture` — seed datasets owned by alice + carol; switch principal to bob with NO ownership association; GET dashboard; assert HTTP 200 with non-zero counts spanning alice's + carol's tests. PIN the catalog-wide read posture.
  2. `getDataQualityTestsRuns_unauthenticatedUnderLOGIN_FORM_returns401_baselineAuthGate` — no session; GET; assert HTTP 401. Baseline auth gate verification (so test 1 isn't accidentally about auth-disabled).
  3. `getDataQualityTestsRuns_authTypeDISABLED_anonymousCaller_returns200WithFullCatalog_pinsWorstCase` — under DISABLED, no auth; GET; assert HTTP 200 with full catalog data. PIN the anonymous-leak worst case.
  4. `getDataQualityTestsRuns_filterDimensionEnumeration_returnsPerFilterAggregates_pinsEnumerationVector` — supply per-namespaceId / per-ownerId filter; verify the response narrows accordingly; pin that filter combination is a catalog-mapping tool (an attacker can iterate through all namespace ids enumerating which has failing tests).

  Pair with REFACTOR-024 follow-up: introduce an OPTIONAL `DATA_QUALITY_DASHBOARD_VIEW` permission (defaulting to "any authenticated user" for backwards compat) — owner-scoped operators can grant only to subset users. Pair with DOC-NNN: surface the read-collaborative posture explicitly on the dashboard doc page.
