name: Locale Bundle
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  Multilingual UI's per-language resource bundle — JSON dictionary of translation
  keys to localised strings, statically imported and registered with i18next at app
  boot. Six locales ship today (en/es/ch/fr/ua/hy), each ~16-25 KB; total ~120 KB
  in main JS bundle (i18n.ts + SelectLanguage sidecars `concepts.entities`).

  ## STRENGTHENED — batch ZJ (2026-05-26)

  Batch ZJ adds the en.json primary-source sidecar
  (odd-platform__json__locales_translations__i18n-resource__en.md)
  with the FULL semantic walkthrough — 418 flat string-to-string
  entries (one per visible label, button, header, table column,
  modal title, confirmation prompt, placeholder, and inline
  noun/verb across the SPA). The bundle IS the contract surface
  for the entire SPA's localised text.

  **The natural-keys pattern is the canonical i18n contract**:
  417 of 418 entries in en.json have `key === value` (e.g.
  '"About": "About"', '"Add owner": "Add owner"'). The keys ARE
  the English source phrases. The single exception is line 381
  '"main search placeholder": "Search data tables, feature group,
  jobs and ML models via keywords"' — a slug-key indirection for
  the global search bar placeholder.

  **Consequence of the natural-keys pattern**: a missing key in
  any locale silently renders the KEY (the English phrase) rather
  than a placeholder or error. The English UI 'accidentally works'
  for any key the code references but the resource omits.

  **The cross-locale parity drift is structural**:
    - en.json: 418 entries (the canonical English source)
    - ch.json: 415 entries
    - fr.json: 415 entries
    - es.json: 414 entries
    - hy.json: 414 entries
    - ua.json: 414 entries

  Three to four keys exist in en.json but NOT in the other five
  locales. The natural-keys pattern hides this drift — the
  fallbackLng chain `['en','es','ch','fr','ua','hy']` (i18n.ts:30)
  fills the gap with English text.

  **Six locales chained in fallbackLng** (i18n.ts:30,
  `fallbackLng: ['en','es','ch','fr','ua','hy']`) — non-conventional;
  most i18next deployments use a single `'en'` fallback. The chain
  order encodes a 'graceful degradation across all locales' stance
  vs. the more common 'graceful degradation to English only' default.

  **One key has a non-key value with content-quality drift across
  locales** — '"main search placeholder"' (line 381) carries the
  English value enumerating four entity types ('data tables,
  feature group, jobs and ML models'); the French/Spanish/Chinese/
  Ukrainian/Armenian values are SHORTER generic placeholders
  ('espace de recherche principal' — 'main search space' — does
  not enumerate the four entity types). A French user does not
  see the entity-type guidance an English user sees.

  **No `missingKey` event handler is wired in i18n.ts** — typos,
  deletions, or code-side keys never added to en.json all produce
  silent fallback. The contract 'every t() call site has a matching
  en.json key' is enforced by NOTHING — neither compile-time nor
  runtime. This is the i18next default but combined with the
  natural-keys pattern means missing-key drift ships silently.

  **No XSS via dangerouslySetInnerHTML** — repo-wide grep returns
  zero `dangerouslySetInnerHTML` matches in odd-platform-ui/src.
  React's default JSX escaping handles XSS for every t() call site.
  The i18n layer does not introduce an XSS surface today; a future
  contributor introducing `dangerouslySetInnerHTML={{ __html:
  t('SomeKey') }}` would invert the boundary. Defence-in-depth
  rule lives at the consumer layer.

  **No interpolation placeholders** — repo-wide grep on en.json
  returns zero `{{var}}` patterns. Variable substitution is handled
  by JSX composition (e.g. `{t('Hi')} {identity?.username}.` in
  OwnerAssociationForm.tsx:153) rather than i18next interpolation,
  sidestepping the locale-divergence risk where a contributor adds
  `{{var}}` in one locale and forgets it in others.

  **Capitalisation/whitespace duplication** — the file has 17
  pairs of keys differing only in capitalisation or trailing space
  (e.g. '"description"'/'"Description"', '"owner"'/'"Owner"',
  '"tags"'/'"Tags"'). The convention appears to be lower-case for
  inline noun, upper-case for label/heading/button. Doubles the
  translation surface for every noun-verb pair.

  **One locale-divergent Spanish translation observed** — en.json
  line 418 '"Statuses": "Statuses"' (natural-keys); es.json line
  410 '"Statuses": "Estado"' (singular Spanish — drift from English
  plural). The other four locales (ch/fr/hy/ua) carry the English
  source. A Spanish-locale user sees 'Estado' (singular) on a
  multi-select status facet — inconsistent with what the widget
  actually does.
