name: |-
  Logout link produces 404 under auth.type=DISABLED (no /logout handler registered)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW MEDIUM-severity UX INVARIANT, batch ZJ (2026-05-26) — the
  AppToolbar's user-menu Logout item is a HARDCODED full-page
  redirect to `/logout` (`AppToolbar.tsx:35-37`,
  `handleLogout = () => { window.location.href = '/logout'; }`).

  Under `auth.type=DISABLED`, `DisabledAuthSecurityConfiguration.java`
  has NO `.logout(...)` chain — the `/logout` path is NOT registered
  as a Spring Security handler. Clicking Logout under DISABLED
  produces a 404 page the user must back out of.

  **The Logout button is shown to every user including DISABLED-
  mode anonymous callers**. The UI surfaces no auth-mode-aware
  rendering — under DISABLED the user sees a 'Logout' menu item
  in the user-menu cluster just as a LOGIN_FORM/OAUTH2/LDAP user
  would. The visible label promises functionality the backend
  does not provide.

  **Under LOGIN_FORM and LDAP**, `LoginFormSecurityConfiguration.java:59`
  and `LDAPSecurityConfiguration.java:146` register
  `.logout(Customizer.withDefaults())` which auto-binds the GET
  `/logout` handler that clears the session and redirects to the
  login form. The button functions as labelled.

  **Under OAUTH2**, `OAuthSecurityConfiguration.java:100` registers
  a custom `LogoutSuccessHandler` chaining to the IDP's
  `end_session_endpoint` (Cognito / Google / Azure / ODD_IAM). The
  button functions as labelled (with the cross-provider asymmetry
  noted in the `logout-side-token-revocation-asymmetric-defence-
  in-depth` invariant).

  **Under DISABLED**, no `.logout(...)` chain is configured. The
  `anyExchange().permitAll()` rule at
  `DisabledAuthSecurityConfiguration.java:13-18` allows the
  request through but no controller handles GET `/logout`. The
  browser receives 404 (the platform's default 404 response).

  **Severity is MEDIUM** — UX-confusing but security-neutral.
  There is no session to log out from under DISABLED; the user's
  identity is the anonymous `dummyOwner('admin')` rendered
  uniformly to every network caller (per the REFACTOR-185
  IDENTITY-LAYER FACET).

  **The fix is small** but has two shapes:

    (a) **Backend fix**: register a noop logout chain in
        `DisabledAuthSecurityConfiguration.java:11-19` that
        responds with a redirect to '/' or a clearly-labelled
        'unauthenticated mode — no session to clear' page. Three
        to five lines.

    (b) **Frontend fix**: hide the Logout menu item under DISABLED
        by gating on the identity selectors' state. The AppToolbar
        already reads `identity` via `useAppSelector(getIdentity)`
        (line 20); a 2-line condition + an additional `<Menu Item>`
        suppression closes the surface.

  Either fix removes the operator-confusing 404 click; option (b)
  is preferred because it ALSO solves the related UX surprise of
  rendering 'admin' as the username under DISABLED — the same
  if-DISABLED-then branch could surface a permanent banner
  ('You are in unauthenticated mode') as the
  REFACTOR-185 invariant recommends.

  **Cross-batch coherence**: this invariant is the UX-symptom
  partner of REFACTOR-185 IDENTITY-LAYER FACET. The IDENTITY-LAYER
  facet says 'whoami returns admin'; this invariant says 'and the
  Logout button to clear that admin claim is non-functional'. The
  user is rendered as admin, cannot log out, and has no
  affordance explaining why.
