behaviour: |-
  Case-sensitivity of `listByNames` — no test asserts that `Postgres` and `postgres` are returned as separate tags from `listByNames(["Postgres", "postgres"])`. This is the root cause of `TagServiceImpl.divideTagsByExistence` treating case-only-different names as novel — silently creating two Tag rows where the UI may render either case-folded. A caller submitting `tag_name_list: ['PII']` against a directory that already contains `pii` will see `pii` as missing and mint a fresh `PII` row. The `tag_name_unique` partial index is also case-sensitive (PostgreSQL `text` column default), so both rows coexist. UI tag-dropdown renders both. Two operators looking for `pii` may apply different rows, fragmenting the search facet.
