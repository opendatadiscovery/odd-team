behaviour: |-
  **PROVIDER-NULL CROSS-MODE BLEED — PRIMARY SOURCE at the SQL layer.** getAssociatedOwner(alice, null) returns the SAME OwnerPojo regardless of which auth mode the caller is in. Set up a USER_OWNER_MAPPING row with (owner_id=X, oidc_username='alice', provider=null, deleted_at=null). Assert that `getAssociatedOwner('alice', null)` returns X. Then issue `getAssociatedOwner('alice', '')` — must ALSO return X (the `StringUtils.isNotEmpty` branch fires the IS NULL predicate for empty string as well as null). NO test asserts this. The runtime callers (LOGIN_FORM, LDAP, S2S all produce provider=null at AuthIdentityProviderImpl.java:32) ALL hit this path. A LOGIN_FORM user 'alice' and an LDAP user 'alice' BOTH resolve to the SAME user_owner_mapping row via `WHERE OIDC_USERNAME = 'alice' AND DELETED_AT IS NULL AND PROVIDER IS NULL`. **Security crossover during migration; undocumented.**
