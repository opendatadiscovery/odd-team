proposed_action: |-
  Add `DataQualityControllerOwnerScopingAsymmetryTest` with FIVE regression-pin methods covering the asymmetric posture exhaustively:
  (a) `getDataEntityDataQATests_callerHasNoOwnerOfDataset_returns200WithFullList_pinsReadCrossOwner`: seed Owner A owning dataset D, with N DQ tests; authenticate as Owner B (no association with D); WebTestClient GET `/api/datasets/{D}/dataqatests`; assert 200 + N entities. Pins read-cross-owner.
  (b) `getDatasetTestReport_callerHasNoOwner_returns200WithCountsAggregate`: same fixture; GET `/api/datasets/{D}/test_report`; assert 200 + valid DataSetTestReport. Pins read-cross-owner.
  (c) `getSLA_callerHasNoOwner_returns200WithPng`: same fixture; GET `/api/datasets/{D}/sla`; assert 200 + Content-Type starts with image/png. Pins read-cross-owner.
  (d) `getDatasetSLAReport_callerHasNoOwner_returns200WithJson`: same fixture; GET `/api/datasets/{D}/sla_report`; assert 200 + JSON DataSetSLAReport. Pins read-cross-owner.
  (e) `setDataQATestSeverity_callerHasNoOwner_returns403_pinsLoneOwnerScopedGate`: same fixture; WebTestClient (authenticated as Owner B) PUT `/api/datasets/{D}/dataqatests/{T}/severity` with `{"severity": "CRITICAL"}`; assert response is 403 Forbidden. Then re-authenticate as Owner A; PUT same payload; assert 200. Pins the owner-scoped PUT.
  Add `// REGRESSION-PIN — DataQualityController encodes the read-collaborative-asymmetric posture: 4 reads unscoped, 1 PUT owner-scoped. The asymmetry is intentional per implicit_adrs[0] (a maintainer made the deliberate decision to add ONE rule and not five). If the maintainer ever tightens reads to require ownership, methods (a)–(d) flip and the test should be updated. If the maintainer ever removes the PUT gate, method (e)'s 403 assertion catches it. Pair with DOC-GAP-NNN that adds the access-control statement at data-quality.md.` comment block.
