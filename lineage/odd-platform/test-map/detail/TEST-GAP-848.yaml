behaviour: |-
  **MEDIUM — The 'Other' bucket renders identically to known ODDRN prefixes; the operator has no UI affordance to investigate misparsed datasources.** Directory.tsx:38-45 renders one DirectoryItem per ODDRN-prefix bucket returned by the API. The server (DirectoryServiceImpl.java:101-110 per F-023 batch-T facet 6) places datasources whose ODDRN failed parsing into a bucket named `'other'`.

  **The UI has no per-prefix conditional rendering** — `'other'` shows as a card with the literal name "Other" and the `entitiesCount` aggregate of every misparsed source. There is:
  - No tooltip explaining what 'Other' means
  - No icon distinguishing it from recognised prefixes
  - No "click for details on misparsed sources" affordance
  - No link to operator documentation

  **Failure mode**: A datasource whose ODDRN failed parsing lands in 'Other' silently. The operator sees 'Other' but has no UI affordance to ask "why is this Postgres source under Other?" The only signal is the server-side error log (per F-023 facet 6 unknown_oddrn_silent_bucket_to_other).

  **Cross-reference to docs**: The live `/features/data-discovery/directory` page (WebFetched 2026-05-20 status 200) does NOT describe the 'Other' bucket. Operators reading the doc cannot calibrate the expected behaviour.

  **Why MEDIUM**:
  - **Operator-observability gap** — misparsed datasources are invisible at the UI tier
  - **Compounds with backend silent bucketing** — operator must dig into server logs to discover misparsing
  - **UX gap** — no diagnostic path for a deployment with ODDRN-parser regressions

  **Test gap shape**: A `Directory.test.tsx` rendering test asserting the 'Other' bucket renders identically + a doc-side coordination to add a UI signal (icon, tooltip, link).
