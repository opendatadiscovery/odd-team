behaviour: |-
  **LOW — Asymmetric skeleton trigger produces visible flicker under slow `appInfo` load.** Overview.tsx:29-32: `const isLoading = useMemo(() => isIdentityFetching || isTagsFetching, [isIdentityFetching, isTagsFetching])`. The skeleton trigger watches ONLY identity + tags loading — NOT `useAppInfo`, NOT domains, NOT directory, NOT entities-usage.

  **Failure mode**: Under a slow `useAppInfo` response (cold backend boot, network congestion, stalled SecurityWebFilterChain init), Overview can RENDER (skeleton gone) BEFORE `appInfo` arrives. At first paint, `appInfo` is `undefined` so `appInfo?.authType` is `undefined` → `Boolean(undefined && ...) === false` → OwnerAssociation HIDDEN. When `appInfo` arrives (e.g. 800ms later), React re-renders, the gate flips to `true` (under non-DISABLED modes), and OwnerAssociation appears mid-page. **The user observes a layout shift / late-card-flicker.**

  There is no `<Suspense>` boundary, no shimmer, no "still loading" overlay. On a DISABLED-mode deployment the second render is identical to the first (gate stays false), so the flicker is invisible — but on the 99% of production deployments (LOGIN_FORM/OAUTH2/LDAP), the flicker is observable.

  **Why LOW**:
  - UX-only issue (no security / data integrity impact)
  - Bounded: the flicker lasts ~one render cycle (sub-second on typical deployments)
  - The asymmetric trigger is INTENTIONAL per implicit_adrs[2] — the design choice is documented as time-to-first-paint optimisation
  - Easy to mitigate (add `useAppInfo`'s loading state to the trigger composition)

  **Test gap shape**: A `Overview.test.tsx` rendering test asserting the skeleton-trigger composition matches the documented behaviour. Pins the contract; surfaces if a future maintainer adds new loading dependencies.
