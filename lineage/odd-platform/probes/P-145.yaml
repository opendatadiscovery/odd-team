expected_outcome: |
  Stress question: DataCollaborationController.redirect (`:41-49`) emits
  `ResponseEntity.status(FOUND).headers(h -> h.setLocation(URI.create(providerUrl))).build()`
  where `providerUrl` comes from Slack's chat.getPermalink API via
  SlackAPIClientImpl.exchangeForUrl (`:83-95`) UNCONDITIONALLY. There is NO
  validation of the URL host, scheme, structure, or content before it is
  emitted as the Location header of a 302 response.

  Hypothesis: this is a classic open-redirect-class surface. The trust
  assumption is "Slack returns slack.com URLs"; the assumption is enforced
  nowhere in the platform's code. If a (hypothetical) compromised Slack
  workspace, a man-in-the-middle on the Slack API connection (under poorly-
  configured TLS), or a future Slack API behaviour change ever returned a
  non-slack.com URL, the platform becomes an open redirector trusted by
  every authenticated UI user.

  The probe arranges a WireMock for `chat.getPermalink` that returns three
  classes of attacker-controlled URLs and asserts the controller emits the
  302 Location header verbatim:

  (1) **External HTTPS URL** — `https://evil.example.com/landing-page` — the
      classic phishing-redirect scenario. The browser follows the redirect;
      the user lands on a non-slack.com site. The UI's "Open in Slack" button
      (`Message.tsx:60-66`) targets `_blank`, so the new tab has no
      Referer-based defense.

  (2) **Javascript URL** — `javascript:alert('XSS')` — a more pathological
      case. URI.create accepts this syntactically; modern browsers block
      javascript: in Location headers (per WHATWG fetch spec, javascript: URIs
      in Location are disallowed since 2019), so the user-impact is bounded —
      but the platform STILL emits the header.

  (3) **Malformed URL** — `not a url at all` — URI.create THROWS
      IllegalArgumentException for malformed input. The exception bubbles to
      the WebFlux exception handler as 500 Internal Server Error. The user
      sees a 5xx page; the platform reveals a stack trace in dev mode and a
      generic 500 in prod.

  Confirmed = the platform has zero URL-validation in this path. Mitigation
  recommendation: add a host allowlist check (e.g.,
  `URI.create(providerUrl).getHost().endsWith(".slack.com")`) before the
  setLocation call.
