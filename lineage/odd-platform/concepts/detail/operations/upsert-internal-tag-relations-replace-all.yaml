name: Upsert Internal Tag Relations (Replace-All)
canonical_in_docs: false
canonical_candidate: true
description: |-
  PUT /api/dataentities/{id}/tags — replace-all the INTERNAL tag relations
  for a data entity (external/ingested tag relations are PROTECTED via
  filter !external). Side-effects: auto-creates Tag directory rows for
  novel names (important=false); refreshes search vector; emits
  TAG_ASSIGNMENT_UPDATED. Despite the create*-shaped operationId, the
  underlying semantic is REPLACE-ALL diff (delete missing + insert new).

  **STRENGTHENED BATCH VAL-LSN-019 (2026-05-20) — SERVICE-TIER PRIMARY
  SOURCE NOW PINNED.** TagServiceImpl.updateRelationsWithDataEntity
  (TagServiceImpl.java:96-121, @ReactiveTransactional) is the
  service-tier orchestrator. The end-to-end flow is:

    (1) `currentRelations` Mono: `listTagRelations(List.of(dataEntityId))`
        filtered to `!pojo.getExternal()` (line 102) — leaves
        Collector-set EXTERNAL relations untouched.
    (2) `getOrCreateTagsByName(tagNames)` mints missing tags via the
        race-prone bulkCreate path (TOCTOU window — see the
        `tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race`
        invariant).
    (3) Build `TagToDataEntityPojo`s with `setExternal(false)` (line 109)
        — hardcoded; UI cannot impersonate a Collector.
    (4) `Mono.zip(current, updated).flatMap` computes
        `pojosToDelete = current \ updated` via
        `.filter(r -> !updated.contains(r))` on the relation rows.
    (5) Concurrent deletes + creates: `deleteDataEntityRelations(pojosToDelete)`
        + `createDataEntityRelations(updated)` + final
        `listDataEntityDtos(dataEntityId)` for the response.

  The diff is implemented in-memory (collection-difference, O(N×M))
  — relies on the `TagToDataEntityPojo` jOOQ-generated `equals()`
  covering `tagId + dataEntityId + external`.

  **NEW LOAD-BEARING FINDINGS BATCH VAL-LSN-019**:

    (a) **!external GUARD INTERACTS WITH THIS OPERATION** — the
        operation is one of three TagServiceImpl methods carrying the
        `!external` guard pattern (along with update and delete). See
        the
        `external-relations-immutable-to-ui-users-cross-method-guard-tagserviceimpl`
        invariant. The relations-filter at line 102 + the hardcoded
        external=false at line 109 together defend Collector-set
        relations from UI mutation.

    (b) **TOCTOU RACE AT THE getOrCreateTagsByName CALL-SITE** — this
        operation is the (a) call-site of the 4-side-door write surface
        (DATA_ENTITY_TAGS_UPDATE permission). Two concurrent calls to
        this method with overlapping novel tag names race at the
        getOrCreateTagsByName stage; one wins, the other receives
        UniqueConstraintException with NO service-tier retry. See the
        `tag-toctou-listbynames-then-bulkcreate-auto-create-on-miss-race`
        invariant.

    (c) **DESTRUCTIVE-ON-EMPTY-INPUT** — Stress-finding S-C-2: empty
        `tagNames` Set is INTERPRETED as "remove all non-external tags
        from this data entity". A caller passing `{}` to mean "no
        change requested" triggers a destructive operation. The trap
        is real if a caller treats `{}` as "no-op".

    (d) **PERFORMANCE — O(N×M) DIFF** — the in-memory diff is linear
        in current × updated. For typical operations (dozens of
        relations per entity), this is not a bottleneck; at extreme
        scale (1000+ relations per entity) it would be.

    (e) **OPERATIONID DRIFT (existing — STRENGTHENED)** — the operation's
        OpenAPI operationId is `createDataEntityTagsRelations` (CREATE-
        shaped) for what is REPLACE-ALL semantically. See the
        `operation-name-vs-behaviour-drift-create-shaped-operationid-for-replace-all-semantic-tag-relations`
        invariant.

  **The operation is a major side-door write into the Tag directory**:
  via `getOrCreateTagsByName`, this operation can mint NEW global Tag
  rows for any caller holding DATA_ENTITY_TAGS_UPDATE on a single
  entity. The Tag directory grows from per-entity-tag-editor actions.
  See the `getpopulartaglist-open-read-plus-side-door-compose-to-write-read-directory-bypass`
  invariant.
