proposed_action: |-
  Add `SessionTimeoutMinusOneHousekeepingNoOpRegressionPinTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Two test methods asserting the compound state:

  1. `sessionTimeout_shippedDefaultIsMinusOne_pinsConfigState` — read `spring.session.timeout` from `application.yml`; assert value is `-1` (the shipped default). PINS the configuration state.

  2. `housekeepingJob_underDefaultTimeout_deletesZeroRows_pinsCompoundNoOp` — `@SpringBootTest(properties = { "session.provider=INTERNAL_POSTGRESQL" })` + Testcontainers Postgres; create N sessions via `JooqSessionRepository.save(...)`; trigger `PostgreSQLSessionHousekeepingJobHandler.runHousekeeping()` directly; assert `SPRING_SESSION` table row count is still N (zero deletions). Confirms the housekeeping NO-OP.

  Add a `// COMPOUND-RISK-PIN — spring.session.timeout=-1 (shipped default) makes housekeeping a no-op AND combines with no cookie security + LOGIN_FORM ADMIN-for-every-user into a permanent-ADMIN-on-cookie-theft posture. This test pins the current state until REFACTOR-NNN ships a safer default (24h) + a boot-time warning when -1 is detected on non-IN_MEMORY providers.` comment block.

  Pair with: (a) REFACTOR-NNN — change application.yml:2-3 default from `-1` to a reasonable production value (24-48h); (b) DOC-GAP-NNN — live `/configuration-and-deployment/odd-platform` should recommend a production timeout (24h is industry standard) and explicitly warn against `-1` for non-IN_MEMORY providers.
