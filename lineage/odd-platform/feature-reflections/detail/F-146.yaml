- id: H-004
  hypothesis: "When a Data Entity has never been ingested (manually created in the UI, or pending its first collector pull), its row shows NO stale icon — and that absence correctly communicates 'fresh, recently maintained'."
  derivation: "Negative-space — the predicate's first conjunct `lastIngestedAt != null`; a never-ingested entity has NULL lastIngestedAt."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      DataEntityStaleDetector.java:14 short-circuits to FALSE when `lastIngestedAt == null`. A never-
      ingested entity therefore reports is_stale=false → no icon — IDENTICAL to a freshly-ingested
      entity. The absence of an icon conflates two opposite states: "ingested twenty minutes ago" and
      "never ingested, has no data at all". The hypothesis's claim that the absence communicates
      freshness is FALSE — it communicates "fresh OR empty", and the UI offers no way to tell them apart.
      Documented at metadata-stale.md:56-60.
    evidence:
      - sidecar: source_read_for_validation
        section: predicate first conjunct
        cite: "DataEntityStaleDetector.java:14"
        note: "lastIngestedAt != null → never-ingested short-circuits to is_stale=false"
      - sidecar: shoebox/detail/SHB-001-data-entity-staleness.md
        section: Caveat 2
        cite: "DataEntityStaleDetector.java:13"
        note: "never-ingested reported as fresh — misleading for manually-created entities"
    operator_visible_failure: |
      (1) A manually-created Data Entity Group / Domain, or an entity awaiting its first collector pull,
      renders with no stale icon — looking exactly like a healthy recently-refreshed entity. (2) An
      operator auditing a new ingestion's progress cannot distinguish "the collector pulled this and it
      is fresh" from "the collector has never touched this". (3) Dashboards / SLA reports that treat
      absence-of-stale as evidence of recency silently over-count healthy entities. Tracked + documented:
      never-ingested entities must be enumerated separately (`WHERE last_ingested_at IS NULL`).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    test_demand_note: "No test asserts is_stale=false for a NULL lastIngestedAt entity (the never-ingested branch), nor the tri-state FRESH/STALE/NEVER_INGESTED behaviour PLT-097 proposes."

