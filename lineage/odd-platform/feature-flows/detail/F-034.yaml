amplification_factor: 1
amplification_note: |-
  Once per App-mount. Empty dep-array. No polling. No retry. No re-render
  invalidation. Boot-immutable cached value.
observed_vs_expected:
  facets:
    - facet_id: boot_immutable_runtime_change_silently_ignored
      drift_class: drift_name_vs_behavior_endpoint_name_implies_runtime_current
      severity: MEDIUM
      observed: |-
        FeatureResolverImpl.java:14, 16-31 captures the @Value-injected booleans
        into a `private final Set<Feature>` ONCE in the constructor; subsequent
        runtime mutation (e.g. via /actuator/refresh if exposed) is NOT reflected.
      expected: |-
        Endpoint name `getActiveFeatures` and the prose "active features" promise
        runtime-current view.
      operator_visible_consequence: |-
        Toggle YAML + actuator-refresh → next call returns OLD boot-time set
        until process restart.
    - facet_id: disabled_mode_anonymous_feature_fingerprinting
      drift_class: disabled_mode_bypass_provider_null_bleed_limited_risk_facet_of_refactor_185
      severity: LOW
      observed: |-
        Under auth.type=DISABLED (bundled default per application.yml:34),
        DisabledAuthSecurityConfiguration.java:13-18 exposes the endpoint
        anonymously. External scanner can fingerprint which optional platform
        features are activated without authenticating.
      expected: Auth-mode-dependent disclosure; or rate-limited per-IP catalogue read.
      operator_visible_consequence: |-
        Information narrower than IdentityController's principal-impersonation
        or IntegrationController's internal-hostname leak — only enum names on/off.
    - facet_id: feature_enum_ui_backend_skew_silent_disable
      drift_class: cross_repo_enum_drift_default_false_at_consumer
      severity: LOW
      observed: |-
        If backend adds a Feature value (e.g. GENAI_QUERY_ASSIST) without
        regenerating UI sources, WithFeature.tsx:22 activeFeatures.includes(featureName)
        silently treats the new flag as disabled.
    - facet_id: feature_flag_set_dispatched_but_not_consumed_by_navigation_chrome
      drift_class: feature_flag_set_published_to_redux_unused_by_toolbar_tab_visibility
      severity: MEDIUM
      observed: |-
        App.tsx:49 dispatches fetchActiveFeatures on SPA mount. The result is
        stored in Redux but NOT consumed by ToolbarTabs.tsx:34-82 — no
        useAppSelector(getActiveFeatures), no WithFeature wrap on any of the
        9 hardcoded tabs. Grep across the AppToolbar subtree for
        `WithFeature|getActiveFeatures` returns ZERO matches. Tab visibility
        is structurally invariant to the published flag set.
      expected: |-
        The presence of WithFeature.tsx + the dispatch of fetchActiveFeatures
        on mount suggest the design INTENT was feature-flag-aware. The
        implementation stops at sub-page level — the tab entry points are
        not gated. Per F-041's `tabs_render_regardless_of_active_features_set`
        facet.
      operator_visible_consequence: |-
        Disabling DATA_COLLABORATION at the backend (`datacollaboration.enabled=false`,
        the default) does NOT hide the Data Modelling tab; users click it
        and land on Query Examples surface where the actual feature-gated
        affordances are wrapped in WithFeature and produce a non-functional
        sub-page. The disconnect is at the chrome layer — cross-link F-041
        as the new chrome feature.
