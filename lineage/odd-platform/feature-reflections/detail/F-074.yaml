- id: H-002
  hypothesis: |-
    When an operator practising least-privilege withholds OWNER_CREATE /
    DATA_SOURCE_CREATE / NAMESPACE_CREATE / COLLECTOR_* from a role (expecting that
    a user who cannot CREATE a datasource also cannot LIST/READ the datasource
    directory), the read is restricted to match.
  derivation: |-
    Operator mental model from least-privilege: a permission set with no read verb
    is normally assumed to gate reads too. The pillar's "create / edit / delete"
    primary actions (system-mission.md:225) imply per-verb gating.
  seed_source: negative-space + pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      Withholding any *_CREATE / *_UPDATE / *_DELETE permission has ZERO effect on
      read access. The read endpoints consult no permission at all — they fall to
      the wire-auth catch-all. The live /permissions doc now confirms this verbatim:
      "None of the Management permissions above gates the corresponding GET
      endpoint — withholding OWNER_CREATE, NAMESPACE_CREATE, DATA_SOURCE_CREATE,
      etc. does not restrict reads of the matching catalog" and "Operators who want
      to restrict read access on a Management catalog cannot do so through this
      permission set today." There is no *_READ permission to grant or withhold.
    evidence:
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: bugs_limitations_corner_cases[0]
        cite: "SecurityConstants.java:95-355 (no /api/titles rule, no *_READ key)"
        note: "No OWNER_RELATION_MANAGE / no read-Permission consulted on the read path"
      - sidecar: odd-platform__java__DataSourceController__controller-method__getDataSourceList.md
        section: "tests_coverage_semantic.uncovered_behaviours (RBAC)"
        cite: "getDataSourceList.md:113-116"
        note: "A user with NO MANAGEMENT permission CAN still list all datasources"
      - sidecar: WebFetch
        section: permissions doc
        cite: "https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions (2026-06-03 status 200)"
        note: "Doc now states the no-read-gating posture verbatim"
    operator_visible_failure: |-
      (1) An operator who builds a "read-only auditor" role by granting nothing and
      expects the user to see nothing finds the user can browse every Management
      directory — owners, datasources, collectors (with token last-6), titles,
      namespaces. (2) An operator who builds a "datasource viewer but not editor"
      role cannot scope WHAT the user reads — the user reads ALL datasources across
      all teams, not a subset. (3) On a multi-tenant / multi-team deployment, there
      is NO permission lever to isolate one team's Management catalog from another's
      readers — the only mitigation is a network perimeter (the doc now recommends
      exactly this). The contradiction is between the least-privilege expectation
      and the read-collaborative design; it is INTENTIONAL (ADR-0003) but was
      operator-invisible until the docs were corrected.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: verified
    test_ref: "AdrSecurityRulesContractTest.securityRulesGuardMutationsOnly_withTheSingleGetException (@enforces ADR-0003 — pins the no-read-gate contract)"
    test_demand: null

- id: H-003
