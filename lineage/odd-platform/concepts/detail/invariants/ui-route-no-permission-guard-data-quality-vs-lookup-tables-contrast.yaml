notes: |-
  The maintainer's triage choice is whether to (a) gate the route (mirror
  /lookup-tables's WithPermissionsProvider pattern), (b) document the
  read-collaborative posture explicitly on the dashboard.md doc page, or
  (c) both. The minimum-viable correction is (b) — document the posture
  so an operator who lands on /data-quality knows that the visible data
  reflects the platform's read-collaborative stance, not a missing gate.

  ## batch ZH update (2026-05-26)
  The (a) option above (mirror /lookup-tables's WithPermissionsProvider
  pattern) is REVEALED as inadequate by batch ZH: the
  WithPermissionsProvider wrapper does NOT block rendering. Mirroring
  it onto /data-quality would not change behaviour. The real fix
  options are: (a') use RestrictedRoute instead; (b) document the
  read-collaborative posture; (c) both. Option (b) remains the
  minimum-viable correction.

  ## batch ZI update (2026-05-26)
  The doc-pillar action item GROWS in scope: option (b) now needs to
  document the read-collaborative posture on EVERY primary feature
  page including activity-feed, directory, search, data-modelling/
  relationships, data-modelling/query-examples — five additional doc
  pages with the same visibility note. The shape:

      **Visibility**: this page renders for every authenticated user.
      Under auth.type=DISABLED it is also reachable anonymously. The
      page reflects the platform-wide read-collaborative posture; data
      shown is not narrowed by the caller's permissions, role, or
      owner association. Write actions on this page are gated
      separately (see [permissions reference]).

  Adding this section to each pillar's doc page is a sub-DOC-NNN
  candidate for the next maintenance pass.

  The pattern of "bare UI route + backend possibly unscoped" is the
  REFACTOR-024 family. The dashboard is a new instance of the family
  (cross-owner read endpoints reachable without ownership association).
  Batch ZI confirms five more instances (one per route sidecar).

  ## batch ZI special findings cross-references
  - `invariant:relationships-list-target-column-copy-paste-source-data`
    — HIGH UI bug at the relationships route; orthogonal to the gate
    posture but operator-visible on the same un-gated surface.
  - `invariant:search-id-route-param-is-session-uuid-not-saved-search-category-f`
    — Category F drift at the URL layer; combined with the un-gated
    Search route produces the bearer-token-share + bookmark-fragility
    UX.
  - `invariant:activity-user-filter-doc-promises-performed-by-sql-binds-owner-mapping`
