behaviour: |-
  **Unbounded monotonic growth of the dataset_field table for any churning dataset.** `dataset_field` has NO native soft-delete column (`V0_0_1__init.sql:148-164` plus every subsequent `ALTER TABLE dataset_field` migration verified — none adds `deleted_at` / `is_deleted` / `status`). `delete(id)` / `delete(ids)` inherited from `ReactiveAbstractCRUDRepository.java:144-155` would issue HARD DELETE — BUT no caller in the platform invokes them. The version-aware identity model (V0_0_9__normalize_dataset_structure.sql:1-43 introduced the M:N `dataset_structure` table AND DROPPED the `dataset_field.dataset_version_id` FK) means that every column-schema change in a dataset creates a NEW dataset_field row; the OLD row is preserved (still referenced by historical dataset_versions via dataset_structure). There is NO scheduled housekeeping job referencing the DATASET_FIELD table (Grep against `<odd-platform>/odd-platform-api/src/main/java/.../housekeeping/job/*.java` returns zero matches). Over many ingestion cycles on a churning dataset (say a Snowflake table where columns are added/renamed monthly), `dataset_field` accumulates row-count well above the current column count × retained-versions. No retention policy, no TTL, no admin endpoint to purge. For a deployment ingesting 1000 datasets × 100 columns × 12 schema-changes/year, this is 1.2M new rows/year with no cleanup — over 5 years, ~6M rows in dataset_field alone (separate from the dataset_structure M:N which grows similarly).
