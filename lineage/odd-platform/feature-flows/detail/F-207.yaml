discovered_from_entry_point: |-
  ui-component:WithPermissions (the 35-line shared HOC at
  components/shared/contexts/Permission/WithPermissions.tsx) +
  ui-component:WithPermissionsProvider (the 51-line resource-scoped
  context provider at WithPermissionsProvider.tsx). Mounted across every
  RBAC-gated affordance in the SPA — entity-detail action buttons, the
  Management section route gates, the per-resource tag/description/owner
  edit affordances. Cross-cuts F-006 (RBAC policy lifecycle), F-105
  (Management Section Route Gating), and every per-entity-action F-NNN.
