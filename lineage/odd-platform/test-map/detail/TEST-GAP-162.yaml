- LDAPSecurityConfiguration@L51.md:security.known_security_gaps.[no admins when empty]
behaviour: 'Empty/null `admin-groups` produces deployment with NO LDAP path to ADMIN:
  every authenticated LDAP user is USER. Combined with `auth.s2s.enabled=false` default,
  no caller can ever reach ADMIN-gated endpoints. The bundled `application.yml:50-65`
  ldap block ships commented-out, so this is the default LDAP posture for a freshly-configured
  operator.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/LDAPNoAdminWhenEmptyGroupsTest.java
  name: ldap_adminGroupsNullOrEmpty_authenticatedUserIsUSEROnly
evidence:
- 'LDAPSecurityConfiguration@L51.md says: ''every authenticated LDAP user is assigned
  only the USER role ... An operator who configures LDAP without admin-groups and
  without S2S has a deployment with NO admins'''
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[4]
proposed_action: Configure `auth.type=LDAP` with no `auth.ldap.groups.admin-groups`;
  authenticate a user; assert the authority set is exactly `[USER]`. Locks the operability
  defect; drives a docs-clarification follow-up.
