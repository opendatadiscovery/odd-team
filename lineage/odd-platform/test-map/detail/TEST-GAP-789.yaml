proposed_action: |-
  Add `SessionRedisHealthCheckSilentFailureRegressionPinTest`. Three test methods:

  1. `actuatorHealth_underSessionRedis_doesNotIncludeRedisComponent_pinsDefaultOff` — `@SpringBootTest(properties = { "session.provider=REDIS" })` + Testcontainers Redis; GET `/actuator/health`; assert response body does NOT include `redis` in `components`.
  2. `actuatorHealth_redisDown_returns200_pinsSilentFailure` — same fixture; stop Redis; GET `/actuator/health`; assert HTTP 200 (despite the session backend being down). PINS the silent failure.
  3. `actuatorHealth_redisHealthEnabled_returns503OnRedisDown_documentsFixDirection` — `@TestPropertySource("management.health.redis.enabled=true")`; stop Redis; GET `/actuator/health`; assert HTTP 503. CONFIRMS the fix's effectiveness.

  Pair with: (a) REFACTOR-NNN — make `management.health.redis.enabled` conditional on `session.provider=REDIS` (or document the prerequisite in YAML); (b) DOC-GAP-NNN — live docs MUST cross-link session provider choice to actuator health check posture.
