security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      Read endpoint with no SecurityRule entry at SecurityConstants.java:98-355;
      falls through to global authenticated(); anonymously reachable under DISABLED.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The aggregate is returned for any dataset id with no OWNERSHIP join at the
      repository tier (ReactiveDataQualityRepositoryImpl.java:62-84). Cross-owner
      enumeration vector applied to test-status distributions.
  strengths:
  - |-
    Cheap SQL — single GROUP BY at-most-6-row result; minimal data flow to JVM
  weaknesses:
  - |-
    Cross-owner readable per dataset id; doc-side silent on access control
  - |-
    Anonymous reach under DISABLED (REFACTOR-185 family)
  cross_file_inconsistencies: []
  contributing_files:
  - DataQualityController.md
  evidence:
  - DataQualityController.md:security.known_security_gaps.[0,2]
performance_aggregate:
  overall: HIGH
  hot_paths:
  - |-
    Test-reports tab activation on every dataset-detail page navigation — single
    SQL aggregation per call; UI typically issues this alongside the test-list
    endpoint.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Per-dataset; no bulk/batch variant.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless. Single short-running SQL per request. The bottleneck under high
      load is DB connection pool capacity, not handler cost.
  strengths:
  - |-
    Smallest of the five DataQualityController response payloads — six counters
    per dataset. Trivial serialisation cost.
  weaknesses:
  - |-
    No HTTP caching despite the response being a deterministic function of
    (datasetId, current_test_run_states).
  cross_file_inconsistencies: []
  contributing_files:
  - DataQualityController.md
  evidence: []
notes: |-
  This is an entity in the catalog-vocabulary sense — a named aggregate that
  surfaces in the UI as a distinct widget — but doc-side it is referred to only
  as 'the Test reports tab summary'. Recommended canonicalisation: surface
  'Dataset Test Report' in the live docs as a named first-class artefact, OR
  treat it as an implementation detail of the Test reports tab.
