mitigations_unimplemented:
- |-
  Document the contract — add a section to documentation/docs/configuration-and-deployment/enable-security/
  titled 'SPA Runtime Configuration Discovery' explaining (a) AppInfo exposes auth
  mode + project version, (b) Identity exposes username + permissions, (c) neither
  exposes the OAuth provider name, LDAP server URI, issuer URL, build SHA, or
  hostname, (d) operators should NOT add these fields without realising the
  fingerprinting implication.
- |-
  Add an integration test asserting the AppInfo and Identity response shapes
  contain only their currently-documented fields. The test fails CI if a future
  PR adds a `provider` field to Identity or a `host`/`sha` field to AppInfo —
  preventing silent disclosure-surface widening. Test scope: serialise an Identity
  + AppInfo to JSON, assert the JSON keys are exactly the expected sets.
- |-
  Optional: add HTTP-level fingerprinting reduction by NOT echoing projectVersion
  under DISABLED (the assumption being that DISABLED is dev-only; if an operator
  ran DISABLED in production we want to minimise the fingerprinting surface a
  network attacker can reach unauthenticated). This is a code change at
  AppInfoController.java:25-28 — return projectVersion only if a session is
  authenticated, or move the version field behind a separate
  authenticated-only endpoint.
notes: |-
  The expose-mode-hide-provider contract is one of the clearest examples of a
  security invariant that is NOT named in any documentation, NOT enforced by any
  test, and NOT formalised in any ADR — but IS the design decision encoded across
  two controllers and surfaced in the F-011 drift-class enumeration. The contract
  is LOAD-BEARING (the SPA depends on the mode; an attacker would benefit from
  the provider info), and FRAGILE (a future refactor could break it silently).

  Recommended canonicalisation: promote to a formal ADR (ADR-145 'SPA Runtime
  Configuration Discovery — Expose Mode, Hide Provider') AND back the ADR with
  an integration test (per the second mitigation above). The ADR is the long-term
  artefact; the test is the runtime guardrail.

  Cross-references:
    - Companion entity: `deployment-introspection-api-appinfo`
    - Sibling invariant: `identity-wire-has-no-provider-field-not-a-provider-null-cross-mode-bleed-surface`
    - Cross-batch confirmation in F-011 drift-class enumeration
    - REFACTOR-185 (DISABLED-mode bypass — interacts with the projectVersion
      disclosure under DISABLED)
