      cteDataEntitySelect (listPopular, listByOwner, listByTerm, getDEGExperimentRuns,
      getDimensions, getDetails, getQuerySuggestions). An entity flagged exclude_from_search=true
      with a high view_count therefore appears in the Popular column on the platform home page.
      MEASURED: probe P-006 (run R-20260519T011813Z-P-006) seeded such an entity, GET'd
      /api/dataentities/popular, asserted appears_in_popular == True.
