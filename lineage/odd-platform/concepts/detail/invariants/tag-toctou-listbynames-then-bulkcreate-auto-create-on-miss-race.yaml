mitigations_unimplemented:
- |-
  Add a service-layer retry-on-UniqueConstraintException loop in
  TagServiceImpl.getOrCreateTagsByName AND
  MetadataFieldServiceImpl.getOrCreateMetadataFields: on first
  UniqueConstraintException, re-fetch listBy*, filter out the
  now-existing names, and re-attempt bulkCreate with the (now-empty
  or now-smaller) residual. Bounded retry count (max 2 attempts).
  Same fix shape for both sites.
- |-
  Migrate TagServiceImpl.getOrCreateTagsByName AND
  MetadataFieldServiceImpl.getOrCreateMetadataFields to use the
  upsert path (ingestData equivalent) instead of bulkCreate. The
  upsert returns the existing row's id; the caller wraps the result
  list into the relation-create call. For both Tag and MetadataField,
  the upsert variant ALREADY EXISTS (just used only on the
  ingestion path). Requires a routing decision at each respective
  Controller — the explicit create path (which wants the
  fail-on-duplicate semantic) vs the assign-to-entity flow (which
  wants the return-existing).
- |-
  Wrap the listBy + bulkCreate pair in a @ReactiveTransactional
  with isolation = SERIALIZABLE on TagServiceImpl.updateRelationsWithDataEntity
  AND on the metadata equivalent. Serialisable would cause the race
  losers to fail with serialisation-failure (40001) which is RETRY-able
  rather than the silent-no-recovery 5xx today.
- |-
  Add regression tests at BOTH sites:
    (a) Set up parallel Mono<Void> with the same tag/field name
        list at each respective service;
    (b) Run them concurrently via Mono.zip / StepVerifier with
        parallel scheduler;
    (c) Assert that ONE succeeds AND the other surfaces
        UniqueConstraintException (pinning the current — buggy —
        behaviour as a regression baseline) OR assert BOTH return
        the same id (under the proposed retry-or-upsert fix).
- |-
  Document the TOCTOU race window in the API reference for the
  data-entity-tags-update endpoint AND the metadata-field-create
  endpoint — operators can plan retry strategies client-side until
  the server fix lands.
notes: |-
  STRENGTHENED batch 2026-05-20-VAL-LSN-019 — TagServiceImpl
  SERVICE-TIER PRIMARY SOURCE pins the read-then-write pattern at
  the service-orchestration layer. The maintainer's deliberate
  design choice (no @ReactiveTransactional on the
  getOrCreateTagsByName pair) is now triple-anchored across all
  three sidecars (controller + service + repository).

  Original batch N notes (preserved): NEW HIGH-severity invariant
  captured in batch 2026-05-19N. Primary source is the
  ReactiveTagRepositoryImpl repository sidecar's
  bugs_limitations_corner_cases.[0] — the TOCTOU between
  TagServiceImpl.divideTagsByExistence (listByNames) and the subsequent
  TagServiceImpl.upsertTags (bulkCreate). The race is at the SERVICE
  layer; the repository's DB-side `tag_name_unique` partial index is the
  load-bearing protection that prevents silent-duplicate data corruption,
  at the cost of surfacing the race as a 5xx error to the user.

  Class shape: this is ONE INSTANCE of a CROSS-CUTTING bug class —
  every auto-create-on-miss service-tier method that does listBy →
  bulkCreate without the DB-side ON CONFLICT protection has the same
  race surface. Other instances:
    - Owner auto-create (batch F finding)
    - Namespace auto-create (batch K finding via TermServiceImpl)
    - Title auto-create (similar shape)
    - **MetadataField INTERNAL auto-create (batch R — primary source)**

  Cross-cutting connections:
    - Pairs with spec-documented-auto-create-with-scope-asymmetry-tag-side-door-past-tag-create
      — the side-door creates the wide-open surface; the TOCTOU
      surfaces the operational fragility under concurrent load
    - Pairs with permission-bypass-via-owner-auto-create-side-door-write-path
      — same architectural shape on Owner
    - Pairs with the batch-N
      `ingestData-upsert-with-returning-conflict-trigger` operation —
      the SAFE counterpart that the race-prone path should migrate to
    - **NEW batch R** — pairs with
      `metadata-field-soft-delete-partial-unique-index-mismatch`
      invariant — the metadata_field TOCTOU race compounds with the
      soft-delete + unique-index mismatch: a TOCTOU loser hits the
      partial-index collision AND the stale-soft-deleted-row collision
    - **NEW batch R** — pairs with
      `metadata-field-asymmetric-uniqueness-by-origin` invariant — the
      INTERNAL TOCTOU race surface is exactly the side that gets the
      fail-on-duplicate ergonomic; the EXTERNAL side gets the
      race-tolerant ingestData
    - **NEW batch VAL-LSN-019** — service-tier orchestration evidence:
      TagServiceImpl confirms the design intent (no
      @ReactiveTransactional) AND the call-site graph (4 side-doors).
      The dual-method design (getOrCreateTagsByName race-prone vs
      getOrInjectTagByName race-safe) is now operating evidence rather
      than reasoned-about-but-untraced.

  Companion testing gap: BOTH batch-N + batch-R sidecars'
  tests_coverage_semantic.uncovered_behaviours blocks name the race
  as a HIGH-severity uncovered test case. Neither repository has
  direct test coverage for the concurrent-race scenario. Batch
  VAL-LSN-019's TagServiceImpl sidecar additionally names the
  service-tier-test-coverage gap: there is NO TagServiceImplTest.java
  in the test corpus, so even the service-tier orchestration is
  unverified.

  Three DOC-NNN candidates flow from this invariant:
    (a) Document the auto-create-on-miss race window for tag-assignment
        callers AND for metadata-field create callers
    (b) Fix the service layer at BOTH sites (retry-on-conflict OR
        migrate to ingestData upsert path)
    (c) Add the regression tests pinning the race behaviour as a
        baseline AT BOTH sites
