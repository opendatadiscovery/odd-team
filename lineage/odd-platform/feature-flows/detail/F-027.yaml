    existing F-027 drift facet
    `minio_builder_three_caveat_defaulted_params_region_httpclient_credentialsprovider_only_region_doc_mitigated`
    with the explicit operator-experience consequences of each of the
    three caveats:

    (1) `.region(...)` UNSET — AWS S3 in any non-us-east-1 region returns
    opaque `AuthorizationHeaderMalformed` / `PermanentRedirect` errors;
    self-hosted MinIO unaffected. Doc-side mitigation HEALTHY at the
    operator page; code-side residue UNMITIGATED (no `attachment.remote.region`
    config key anywhere; grep returns zero).

    (2) `.httpClient(...)` UNSET — `OkHttpClient` defaults to ~5-minute
    socket/connect/read timeouts. Operators uploading large CSVs (DQ test
    reports, sample data) on slow network paths see uploads hang AT the
    5-minute boundary. Doc-side mitigation PARTIAL (operator page names
    "MinIO SDK default ~5 minutes, not configurable"); code-side residue
    UNMITIGATED (no `attachment.remote.connect-timeout-millis` /
    `attachment.remote.read-timeout-millis` config keys).

    (3) `.credentialsProvider(...)` UNSET — `MinioConfig.java:21`'s
    two-arg `.credentials(accessKey, secretKey)` produces a
    `StaticProvider`-only client. AWS EKS operators forced to manage
    static IAM-user keys when their platform would otherwise rotate via
    IRSA / IAM-instance-profile / Pod-identity. Combined with SHB-177 /
    F-122 `/actuator/env` exposure: the static keys are reachable via
    the management endpoint. Doc-side mitigation MISSING entirely; the
    live operator page does NOT name this caveat.

    The cross-cutting hypothesis: "the platform's REMOTE attachment
    surface inherits every MinIO SDK default that isn't deliberately
    overridden". The same audit shape applies to ANY SDK-builder ODD
    wires (Snowflake, Kafka, BigQuery, etc.) — the pattern is
    missing-by-default vs documented-default. F-027 is the LSN-002
    canonical home and now also the THREE-CAVEAT canonical home.

    Asymmetric @PostConstruct validation noted in the
    RemoteFileUploadServiceImpl sidecar: only `StringUtils.isEmpty(bucket)`
    is checked; no boot-time validation of region, URL reachability,
    credential validity, or bucket existence. Operators see the REMOTE
    bean wire successfully even when bucket doesn't exist / endpoint
