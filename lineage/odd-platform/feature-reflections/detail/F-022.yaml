      EXPLICITLY preserves DQ visibility for soft-deleted datasets:
      `existsIncludingSoftDeleted` at `DataQualityServiceImpl.java:55,67,96`. BUT the
      UI route HIDES the tab. Reading `DataEntityDetailsRoutes.tsx:44-69` this
      session: the `test-reports/*` route is wrapped in `<RestrictedRoute
      isAllowedTo={!isStatusDeleted} redirectTo='../overview' component={TestReport}/>`
      (lines 56-64). REFINEMENT vs the prior reflection: this gate is NOT unique to
      test-reports — the identical `isAllowedTo={!isStatusDeleted} redirectTo='../overview'`
