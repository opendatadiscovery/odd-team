      operator-visible failure appears only at scale: a heavily-curated term that accumulates dozens or
      hundreds of query examples loads them ALL in one response and renders ALL rows, degrading tab
      latency O(N) with no cap (QueryExampleController known_performance_gaps.[0], severity MEDIUM there).
      The hasNext=false also means a future client that DID try to paginate would believe there is never a
      next page. Worth a documented caveat that the by-term list is unbounded.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

