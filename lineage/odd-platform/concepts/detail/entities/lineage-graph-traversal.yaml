  (`/api/dataentitygroups/{id}/lineage`) extends the pattern to\ngroups (no depth\
  \ parameter on that variant — DEG-lineage is\nalways one-hop).\n\nmain-concepts.md\
  \ names `Data Lineage` as a Data Governance pillar\nbut does not name the API surface\
  \ or the dual-input expansion\nmechanism. Recommended canonicalisation: extend main-concepts.md's\n\
  Data Lineage section with a 'Lineage Graph Traversal' sub-concept\nnaming `GET /api/dataentities/{id}/lineage/{downstream|upstream}`,\n\
  the `lineage_depth` recursion bound, and the `expanded_entity_ids`\nprogressive-expansion\
  \ fan-out. Plus fix two doc-bugs on\n`/developer-guides/api-reference/lineage`:\n\
  \  (a) Correct the `lineage_depth` 'Unset returns the platform's\n      default\
  \ depth' claim — there IS no default; unset is a 500.\n  (b) Correct the `expanded_entity_ids`\
  \ 'IDs of Data Entity Group\n      entities' claim — the parameter accepts any data-entity\
  \ IDs,\n      not just groups.\n\nStrong member of the Read-collaborative cross-owner\
  \ enumeration\ncross-cutting invariant (6-sidecar now with ReactiveLineageRepositoryImpl)\
