proposed_action: |-
  Add `EmailNotificationSenderNoSetFromRegressionPinTest`. Unit test stubbing `JavaMailSender.send(...)`:

  1. `send_fromHeaderEqualsSenderConfigVerbatim_noAllowlistCheck_pinsImplicitDerivation` —
     - Configure `notifications.receivers.email.sender="alerts@odd.example.com"`.
     - Stub `JavaMailSender.send(...)` capturing the MimeMessage.
     - Invoke `emailSender.send(message)`.
     - Assert `mimeMessage.getFrom()[0].toString()` equals `"alerts@odd.example.com"`.
     - PINS the implicit-from-derivation.

  2. `send_senderConfigChangedToSpoofedValue_outgoingFromMatchesSpoofedValue_pinsAbsenceOfAllowlist` —
     - Configure `notifications.receivers.email.sender="ceo@company.com"` (no allowlist).
     - Same capture.
     - Assert outgoing From is `"ceo@company.com"`.
     - PINS the spoofing surface.

  3. `send_explicitFromKeyConfigured_outgoingFromMatchesExplicit_confirmsFixDirection` — (UPDATE once REFACTOR-NNN lands)
     - After REFACTOR-NNN: configure `notifications.receivers.email.from="alerts@odd.example.com"` separately from sender.
     - Assert outgoing From matches the explicit From key.

  Pair with REFACTOR-NNN (add explicit From key + allowlist) and DOC-GAP-NNN (document the SMTP-relay dependency).

