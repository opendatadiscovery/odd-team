- id: H-009
  hypothesis: "When two lineage subgraphs share a node reachable by two paths (a diamond: A->B, A->C, B->D, C->D), the canvas renders D once — a user sees each entity a single time in the graph."
  derivation: "Negative-space + senior-PO 'is the UI intuitive' seed — a user expects one node per entity, not duplicates, in a lineage visualisation."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      D renders TWICE. The UI builds a d3-hierarchy TREE, not a DAG: hierarchy(root, childAccessor)
      re-visits the same raw node along each path with no visited-set check, so a diamond produces
      duplicate HierarchyPointNode entries (each with its own x/y), and React keys on position mount
      two SVG nodes (LineageGraph.md:bugs[0] diamond-DAG-amplification + invariants on tree topology).
      The backend recursive CTE deduplicates only the FINAL (parent,child) projection at the outer
      selectDistinct; intermediate diamond rows are materialised first (getDataEntityDownstreamLineage
      .md:bugs[7]).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LineageGraph.md
        section: bugs_limitations_corner_cases[0] + invariants
        cite: "generateGraph.ts:68-76 (no visited-set); LineageGraph.tsx:84-110 (node-per-instance)"
        note: "Tree-not-DAG: diamond node rendered twice; no client-side dedupe before tree build."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityDownstreamLineage.md
        section: bugs_limitations_corner_cases[7]
        cite: "ReactiveLineageRepositoryImpl.java:126-131 (outer selectDistinct) + 163-175 (UNION ALL no inner DISTINCT)"
        note: "Backend dedups only the final projection; diamond intermediates materialised."
    operator_visible_failure: |
      A user tracing a diamond-shaped lineage (common where two jobs both write the same dataset)
      sees the shared entity duplicated in the canvas — visually misleading (is this two entities
      or one?), and as depth grows the duplication amplifies the render cost (O(N) SVG primitives
      with diamond multiplication). The depth boundary interacts: deeper walks over diamond-heavy
      topologies multiply duplicate nodes. This is a render-correctness + performance gap, not a
      data-loss one.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-010
  hypothesis: "When a user expands lineage repeatedly via 'Load N more' on many leaf nodes, the canvas keeps the displayed graph bounded — old expansions can be collapsed or evicted so a long exploration session does not accumulate unbounded state."
  derivation: "Senior-PO 'is it convenient / customisable' seed — LoadMore is the primary depth-extension affordance; a user expects to be able to walk it back."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      LoadMore accumulation is monotonic with no collapse affordance. Each LoadMore dispatches a
      lineageDepth=1 fetch and MERGES new nodes/edges into module-level globals
      localDownstreamState.allNodes/allEdges (LineageGraph.md:bugs[3] monotonic-accumulation +
      operations LoadMoreButton). There is no "remove this expansion" action, no LRU eviction, no
      max-size cap; the LoadMore button hides itself after click but the underlying data and the
      rendered SVG stay (LineageGraph.md:bugs[3]). State is bounded only by navigating to a new
      root entity (slice reset).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LineageGraph.md
        section: bugs_limitations_corner_cases[3] + implicit_adrs
        cite: "dataEntityLineage.slice.ts:206-220 (monotonic merge); LoadMoreButton.tsx:55-65"
        note: "No collapse / eviction / cap; module-level globals grow until root change."
    operator_visible_failure: |
      A user exploring a large graph by clicking LoadMore on dozens of leaves accumulates every
      batch in memory and in the rendered SVG tree, with no way to fold a branch back in. On a
      long session against a 10K-node graph this drives browser memory pressure and frame-budget
      exhaustion (no virtualisation), and the only "reset" is to navigate away and lose the
      exploration. The interaction is not convenient: expansion is one-way.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: "When a curious user sets ?d=20 (the max dropdown value) on an entity at the centre of a dense, real-world lineage graph, the Lineage tab returns within an interactive latency budget (e.g. < 2s) rather than pegging Postgres or timing out."
  derivation: "Performance + negative-space seed — 20 is the advertised max; the user expects opening the max to be a supported, performant operation, not a foot-gun. Whether it is requires measuring against a real dense graph."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      Cannot be determined from the chain alone — the answer depends on real graph density,
      Postgres work_mem, and connection behaviour under load. The static facts establish the RISK
      (no caching, recursive-CTE cost grows as O(branching^depth) for diamonds, full-graph
      .collectList() into heap, no statement_timeout enforced at the repository, no virtualisation
      at the UI — getDataEntityDownstreamLineage.md:performance + ReactiveLineageRepositoryImpl.md:
      performance), but whether depth=20 on a representative dense entity stays within an
      interactive budget is a runtime question. Per Rule 6 this is locally executable: seed a dense
      + a cyclic lineage subgraph in a local Testcontainers Postgres and measure the depth=20
      (and depth=10000) walk latency + row counts via the existing LineageRepositoryTest harness.
    evidence:
      - sidecar: odd-platform__java__service__service__LineageServiceImpl.md
        section: performance.resource_allocation + scaling_characteristics
