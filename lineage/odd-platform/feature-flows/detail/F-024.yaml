control_summary: |-
  0 of 4 cells PROBED — feature MINTED this batch (U) from TermSearch.tsx
  UI sidecar + paired with TermController search-session endpoints +
  ReactiveTermRepositoryImpl + ReactiveTermSearchEntrypointRepositoryImpl
  primary-source evidence. NINE drift facets surface, anchored on three
  load-bearing themes: (a) UI dispatch shape defects (debouncer recreate
  losing rate-limit + LSN-017-adjacent dep-array smell); (b) session
  lifecycle gaps (stale UUID silent broken + cross-user hijack via UUID
  share + no per-caller ownership check); (c) read-collaborative
  surface manifestations (cross-namespace enumeration unscoped + DOM
  permission leak + doc silence on Dictionary tab affordances).

  The capability is structurally analogous to F-017 Search Facets on
  the Discovery pillar — both are URL-backed server-side search-session
  models with debounced facet mutations + infinite-scroll pagination.
  The same SearchFacetsHousekeepingJob TTL eviction infrastructure
  (F-010 / LSN-018) governs both. Future probe candidates: (1) cross-user
  session hijack pin — auth as user A, create session, copy URL, auth
  as user B in incognito, navigate to URL, assert session restores +
  updateTermSearch succeeds; (2) facet-debouncer rate-limit probe —
  rapid-click 5 facets in <2 seconds, measure PUTs hitting backend;
  (3) stale-session UUID probe — DIRECT DB UPDATE setting
  search_facets.created_at = NOW() - INTERVAL '31 days', reload UI,
  assert error path or recovery; (4) read-collaborative DISABLED mode —
  anonymous GET /api/termsearch + /api/termsearch/{uuid}/results, assert
  full catalog visible.

  The feature CO-EXISTS with F-002 Term-to-Entity Linkage — they share
  contributing nodes (TermController + TermServiceImpl +
  ReactiveTermRepositoryImpl + ReactiveTermSearchEntrypointRepositoryImpl)
  but distinct user-observable contracts: F-002 is "operator links a
