proposed_action: 'Add an integration test: user A creates a search session; user B
  uses the search_id directly to query `GET /api/search/{search_id}/results`. Assert
  current behaviour (B succeeds — UUID is bearer-token-like). Drives a future owner-scoping
  decision. Note batch M adds TEST-GAP-519 for the facet endpoint surface specifically
  with full mutation + cross-owner-enumeration coverage — that test is the dedicated
  regression-pin at the facet endpoint family. The two tests together cover the full
  attack surface (search + facet); the criticality bump from LOW to HIGH reflects
  the combined surface area discovered at batch M.'
