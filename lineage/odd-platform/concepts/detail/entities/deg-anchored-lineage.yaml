name: DEG-Anchored Lineage (group-internal co-membership view)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-05
  - P-09
  - P-01
description: |-
  NEW ENTITY, batch 2026-05-19M (getDataEntityGroupsLineage sidecar) — the
  DEG-anchored lineage view returned by
  GET /api/dataentitygroups/{data_entity_group_id}/lineage. Rooted not at a
  single data entity but at a Data Entity Group (DEG), the response is one
  DataEntityLineageStream per starting-oddrn-anchored CONNECTED COMPONENT of
  the inter-member lineage graph (LineageServiceImpl.java:78-82 +
  establishDEGRelations lines 200-216 + getRelationsForEntities lines
  218-233). Three deliberate carve-outs at the service layer:
    (a) **DEG-member recursion**: getDEGEntitiesOddrns
        (ReactiveGroupEntityRelationRepositoryImpl.java:177-204) is a Postgres
        WITH RECURSIVE CTE that walks nested DEGs at the SQL layer — the
        member set is transitive across nested-DEG containment;
    (b) **Inner-DEG suppression**: the conditional filter at
        LineageServiceImpl.java:71-75 strips edges where ANY endpoint is a
        DEG AND removes DEG-typed entries from the metadata dictionary — the
        rendered graph is FLAT (only non-DEG members appear). Anchored by
        the literal source-level comment
        // Remove this when we will support inner DEGs for DEG lineage
        — the explicit deferred-feature marker;
    (c) **Bidirectional edge filter**: getLineageRelations(List<String>)
        (ReactiveLineageRepositoryImpl.java:112-119) requires BOTH PARENT_ODDRN
        and CHILD_ODDRN in the member set — edges crossing the DEG boundary
        (exiting to a non-member or entering from a non-member) are DROPPED.
  Distinct query shape from the per-entity lineage path: the per-entity
  /api/dataentity/{id}/lineage uses the recursive-CTE variant
  (ReactiveLineageRepositoryImpl.java:122-148 with LineageDepth bound + depth-1
  fan-out); the DEG-lineage path uses the simpler list-based
  getLineageRelations(List<String>) — recursion happens at the MEMBERSHIP
  layer, not at the edge layer. Read-only, NOT transactional, NO
  fetchAssociatedOwner call (the service has no AuthIdentityProvider field).
  **Operator-facing posture**: cross-owner-readable at the DEG layer — any
  authenticated user (or under DISABLED, any anonymous probe) can read any
  DEG full member-graph + per-member metadata. The DEG-anchored variant is
  WIDER blast than the per-entity REFACTOR-203 because the DEG itself is a
  CONCEPTUAL grouping (a Domain or a multi-team data product) — leaking
  "team A and team B both contribute to the Finance Domain" exposes
  organisational structure that the DEG was designed to REPRESENT but not
  necessarily to DISCLOSE to every authenticated user.
