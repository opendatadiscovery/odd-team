gap_id: TEST-GAP-239
category: missing-edge-case
criticality: HIGH
node_ids:
- odd-platform java OwnerController controller-method:createOwner
surfaced_by:
- createOwner.md:tests_coverage_semantic.uncovered_behaviours.[2]
behaviour: Name uniqueness — `owner.name varchar(255) NOT NULL UNIQUE` (V0_0_1__init.sql)
  is a plain (non-partial) unique constraint. A soft-deleted owner (`deleted_at` set,
  row remains) permanently holds the name; `INSERT INTO owner (name, ...)` fails for
  that name with an opaque DB error. The `user_owner_mapping` table received a partial-unique
  migration (V0_0_89) but the `owner` table did not. Operators recovering from an
  accidental delete cannot 'just re-create' an owner with the same name; the encountered
  DB error is uncatch-translated to a useful 409/400.
test_files_existing:
- odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/OwnerRepositoryImplTest.java
  (repository-layer only; does not exercise the soft-delete-then-recreate path)
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/OwnerSoftDeleteRecoveryTest.java
  name: createOwner_afterSoftDeleteOfSameName_currentlyFailsWith500
