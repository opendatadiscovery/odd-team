gap_id: TEST-GAP-618
category: missing-security
criticality: CRITICAL
node_ids:
  - "odd-platform java IngestionController controller-method:createDataSourceEntity"
pillars_affected: [P-09, P-10]
surfaced_by:
  - "createDataSourceEntity.md:coherence_check.strengthens.[1] (REFACTOR-185 17th surface — DISABLED + UI-open + create-collector + token-leak chain to ingestion-datasource creation)"
  - "createDataSourceEntity.md:implicit_adrs.[1] (datasource auth is ALWAYS-ON via unconditional @Component IngestionDataSourceFilter)"
behaviour: |-
  **ASYMMETRIC AUTH POSTURE: `/ingestion/datasources` is ALWAYS-ON; `/ingestion/entities` is OFF-BY-DEFAULT — the two endpoints in the SAME controller use entirely different auth pipelines.** IngestionController.createDataSource (POST /ingestion/datasources) is protected by the sibling unconditional `@Component IngestionDataSourceFilter` (no `@ConditionalOnProperty`), which validates the `Authorization: Bearer <token>` header against the COLLECTOR table and writes `COLLECTOR_ID_SESSION_KEY` into the WebSession before the controller runs. In contrast, the sibling `postDataEntityList` method on the SAME controller class is protected by `IngestionDataEntitiesFilter` which IS conditional on `auth.ingestion.filter.enabled=true` (default `false` per application.yml:48). REFACTOR-185 family adds a NEW invocation site: under DISABLED + default deployment, the IngestionDataSourceFilter STILL runs and requires a valid token. BUT under DISABLED there's no UI auth on the platform either — an attacker who can REACH the platform can also create a new Collector via the UI (POST /api/collectors), copy the new token, and then call POST /ingestion/datasources with that token. The DISABLED-mode bypass therefore EXTENDS to datasource creation by composition: DISABLED → UI is open → create-collector → token-leak → ingestion datasource creation. The 17th surface in the REFACTOR-185 enumeration. Plus NO test exists at the controller-boundary tier (zero matches for IngestionController test class).
