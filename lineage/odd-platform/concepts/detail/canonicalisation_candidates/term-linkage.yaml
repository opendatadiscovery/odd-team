proposed_canonical: Term Linkage
rationale: addDataEntityTerm + upsertDataEntityInternalDescription surface 'Term Linkage'
  as the per-(data_entity, term) edge — distinct from 'Term' (the glossary entry)
  and from 'Tag' (the labelling directory). The two write paths (manual via POST /terms;
  auto via [[ns:name]] in description) coexist as separate rows in data_entity_to_term
  distinguished by is_description_link. Worth naming because the bug surface is path-specific
  and the term/term-linkage distinction is conceptually load-bearing for the path-mismatch
  finding.
contributing_concepts:
- Term Linkage
- DataEntityToTermPojo
- is_description_link (manual vs description-derived)
suggested_add_to_docs: true
