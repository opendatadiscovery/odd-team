- id: H-009
  hypothesis: "When an operator rotates a 'leaked' token on a default deployment, the rotation actually has a security effect on the ingestion write path (the old token can no longer write to `/ingestion/entities`)."
  derivation: "Doc-claim seed: the Management doc says 'rotate a leaked token', implying rotation hardens the write path. Tested against the `auth.ingestion.filter.enabled` default + the /ingestion/entities filter registration."
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      It depends entirely on a config flag the UI never surfaces. `IngestionDataEntitiesFilter` (the filter that validates
      the token on `POST /ingestion/entities`) is `@ConditionalOnProperty("auth.ingestion.filter.enabled", havingValue="true")`,
      and that flag defaults to FALSE (application.yml:48). So on a default deployment, `/ingestion/entities` is anonymously
      reachable REGARDLESS of token value — rotating a leaked token there is a no-op for that path. (The sibling always-on
      `IngestionDataSourceFilter` on `/ingestion/datasources` DOES validate the token unconditionally, so rotation is NOT a
      total no-op — it does invalidate the old token on the datasources-registration path.) The doc's "rotate a leaked token"
      promise holds only when the operator has flipped the filter on; the default deployment does not enforce the property the
      UI/doc implies.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "bugs_limitations_corner_cases[4] + security.known_security_gaps[4] + dependencies_semantic.requires-config"
        cite: "application.yml:48 (filter default false) + IngestionDataEntitiesFilter.java:19-20 (@ConditionalOnProperty)"
        note: "Default-OFF filter => rotation has zero effect on /ingestion/entities until the operator opts in."
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveCollectorRepositoryImpl.md
        section: "coupling[IngestionDataSourceFilter-asymmetric] + security.known_security_gaps[4]"
        cite: "IngestionDataSourceFilter.java:15-22 (always-on, no @ConditionalOnProperty) vs IngestionDataEntitiesFilter.java:19-20"
        note: "Asymmetry: /ingestion/datasources always validates; /ingestion/entities only when the flag is on."
    operator_visible_failure: |
      An operator responding to a leaked-credential incident on a default deployment rotates the token expecting to cut off
      the attacker's write access to `/ingestion/entities` — and does not, because that endpoint never checked the token.
      The UI promises a security property (rotate-to-revoke) the default deployment does not enforce; a Cornerstone-3
      configuration-as-separate-audience failure that compounds with REFACTOR-185. Tracked via the IngestionDataEntitiesFilter
      default-OFF finding (REFACTOR-185 family) + DOC caveats; routed as a caveat-candidate here (the credential-lifecycle
      surface should warn that rotation's effect is gated on auth.ingestion.filter.enabled).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-010
  hypothesis: "When an operator double-clicks Regenerate (a slow click, a network retry, or closing and re-opening the dialog), the token is rotated only once, so the plaintext value they just copied stays valid."
  derivation: "Endpoint shape (idempotency) + senior-PO convenience seed. The PUT is not idempotent; the UI dialog has a spinner. Tested against the controller's idempotency posture + the UI pending-guard."
  seed_source: endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |
      Static analysis: the PUT is NOT idempotent — each call generates a fresh random token and overwrites the row (no
      idempotency key, no If-Match ETag; regenerate*Token sidecars' resource_boundaries). The UI's ConfirmationDialog shows a
      loading spinner that blocks a second confirm WITHIN one open dialog, but the component places NO pending-guard on the
      dispatch, and nothing stops the operator closing+reopening the dialog or (once the row re-masks) clicking Regenerate
      again. Two rapid rotations => the operator copies a token (from response 1) that response 2 has already invalidated.
      Backend is last-write-wins with no corruption, but the exact behaviour under a fast double-confirm-across-reopen needs
      runtime — the DataSourceItemToken sidecar emitted P-082 specifically for this, and the regenerateDataSourceToken sidecar
      emitted P-050 (concurrent double-rotation). Verdict requires running the system.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken.md
        section: "stress_findings.resource_boundaries[idempotency] + bugs_limitations_corner_cases[3] + probes_emitted[P-082]"
        cite: "DataSourceItemToken.tsx:29-30 (bare dispatch, no pending guard) + ConfirmationDialog.tsx:24-35 (spinner is dialog-scoped)"
        note: "UI dialog spinner blocks intra-dialog double-confirm; no guard across reopen — PROBE-NEEDED P-082."
      - sidecar: odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken.md
        section: "stress_findings.resource_boundaries[transactional] + probes_emitted[P-050]"
        cite: "ReactiveTokenRepositoryImpl.java:33-36 (no @Version / optimistic lock) + DataSourceController.java:53-59 (no If-Match)"
        note: "Backend last-write-wins, no corruption; the observable defect (stale copied token) needs runtime — P-050."
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-125-1
    routes_to_finding: probe-needed
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

- id: H-011
  hypothesis: "When the backend changes the token-mask format (e.g. from 6 asterisks to a different placeholder), the UI continues to correctly distinguish a masked token from a plaintext one (so it never offers Copy on a useless masked string or Regenerate on a live plaintext token)."
  derivation: "Cross-layer naming/format drift (Rule 4): the UI's masked/plaintext decision is a literal `substring(0,6) === '******'` prefix sniff hard-coupled to TokenMapper.mapValue. Tested against the coupling between the UI sentinel and the backend mask format."
  seed_source: response-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      The hypothesis (UI stays correct across a mask-format change) is FALSE — confirmed as a real fragility. The UI's entire
      masked/plaintext decision is `token.value.substring(0,6) === '******'` (DataSourceItemToken.tsx:26 +
      CollectorItemToken.tsx:26), hard-coupled to the backend `TokenMapper.mapValue` emitting EXACTLY six asterisks
      (TokenMapper.java:15-18). If the backend mask ever changes (5 or 7 asterisks, a Unicode block char, a leading space),
      the substring test silently false-negatives and the UI classifies every token as plaintext — offering Copy on a useless
      masked `******abc`-style string and never reaching the Regenerate branch. There is no typed `showToken` field exposed to
      the UI (it is server-side only), so the UI legitimately has nothing typed to bind to — but the prefix-sniff contract is
      undefended by any test.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken.md
        section: "bugs_limitations_corner_cases[1] + stress_findings.tunables[masked-token sentinel] + implicit_adrs[0]"
        cite: "DataSourceItemToken.tsx:26 + TokenMapper.java:15-18 (the 6-asterisk mask the sniff depends on)"
        note: "Cross-repo string-format coupling; a backend mask change silently mis-classifies tokens in the UI."
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "concepts.invariants[2] + bugs_limitations_corner_cases[0] + security.known_security_gaps[2]"
        cite: "CollectorItemToken.tsx:25-27"
        note: "Identical sniff on the Collector side; same fragility."
    operator_visible_failure: |
      No operator-visible failure TODAY (the 6-asterisk literal matches the backend). The latent risk: a backend mask-format
      change (a routine-looking edit to TokenMapper) silently flips the UI to offer Copy on a masked value — leaking
      `******{last6}` fragments to the operator's clipboard — or to show Regenerate on a live plaintext token. A unit test
      pinning both render branches against the exact backend mask is the cheapest regression guard. Tracked statically as the
      UI sidecars' MEDIUM bug; net_new (no PLT for the prefix-sniff fragility specifically).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-012
  hypothesis: "When an operator regenerates a token and then navigates away (or the list refetches) before copying it, the platform still lets them recover the value without performing another destructive rotation."
  derivation: "Senior-PO convenience/customisability seed: the one-time reveal is a known pattern, but a usable system gives a non-destructive recovery path (re-reveal). Tested against the UI re-mask behaviour + the only recovery affordance."
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |
      The hypothesis (a non-destructive recovery path exists) is FALSE — confirmed. The plaintext is one-time-reveal: after a
      successful rotation the row shows the plaintext + Copy, but the moment the list refetches (or the operator navigates
      away and back), the API returns the masked `******{last6}` form and `isHidden` recomputes to true — the only way to see
      a usable token again is to Regenerate AGAIN, i.e. another destructive in-place rotation that invalidates the just-issued
      token and re-breaks any collector that picked it up. The UI does not auto-copy, does not focus the Copy button, and does
      not block navigation. There is no "reveal token" affordance.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken.md
        section: "bugs_limitations_corner_cases[2] + concepts.invariants[1,2] + downstream_side_effects[page-render]"
        cite: "DataSourceItemToken.tsx:25-27,51-53 + DataSourceItem.tsx:110-121 + datasources.slice.ts:41-42 (upsertOne replaces row)"
        note: "Re-mask on refetch; only recovery is a second destructive Regenerate."
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "concepts.invariants[1]"
        cite: "CollectorItemToken.tsx:25-27 (one-shot; no 'show token again' affordance)"
        note: "Same one-shot model on the Collector side."
    operator_visible_failure: |
      An operator who fails to copy on first display (a phone call, a tab switch, an accidental refresh) loses the credential
      with no recovery short of a destructive rotation — which itself breaks any collector that already picked up the token,
      cascading into the H-002 no-grace outage. This compounds the no-grace fragility into a "lose-it-and-you-must-break-it"
      trap. Tracked statically as the UI sidecars' MEDIUM bug; the doc-side one-time-reveal silence is part of the DOC-GAP
      candidate. net_new at the recovery-path level.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

