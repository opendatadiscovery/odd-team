description: |-
  **NEW INVARIANT, batch 2026-05-19J — exhaustively verified across 5 UI sidecars**.
  **STRENGTHENED batch ZH (2026-05-26) with 5 route-module sidecars confirming
  the gap extends to the entire `routes/` directory.**

  The `odd-platform-ui` package has Vitest configured (`package.json:10`
  `"test": "vitest"`, `package.json:136` `"vitest": "^4.0.17"`), declares
  `test:coverage` script, and ships `@testing-library/react`, `@testing-library/jest-dom`,
  `@testing-library/user-event`, `vite-plugin-checker`, `jsdom` as dev dependencies
  — but ZERO `.test.tsx` / `.spec.tsx` files exist in the entire UI codebase. **Exhaustive
  verification across batch J sidecars**: Glob `odd-platform-ui/**/*.test.*` →
  no results; Glob `odd-platform-ui/**/*.spec.*` → no results; Glob
  `odd-platform-ui/**/__tests__/**` → no results; Grep for any component name
  across `.test.*` → no matches. The test harness is fully configured but
  completely unused. **The PopularStrip sidecar identifies a single counter-example**:
  the `DataEntitiesUsageInfo` subtree (sibling to OwnerEntitiesList in
  Overview/...) HAS coverage (`DataEntitiesUsageInfoView/__tests__/...`,
  `DataEntityUsageInfoCard/__tests__/...`, `DataEntitiesUsageInfo/__tests__/...`)
  — confirming the harness CAN run and there is no infrastructure blocker. The
  rest of the UI codebase shares the zero-coverage state. **Operational impact**:
  every UI regression is shipped invisibly until either (a) a probe catches it
  at the system level (P-004 caught LSN-017; P-009 caught F-004 XSS surface), or
  (b) an operator reports it. The system-level probes are slow + manual; the
  unit-test gap means a developer modifying any UI component cannot run a quick
  feedback loop. **Most consequential gaps surfaced by batch J**: (1) LSN-017
  has the highest-leverage UI bug in the platform's hottest flow and ZERO unit
  test coverage; (2) the partial permission gating on DataEntityDescription is
  the kind of subtle semantic that a refactor easily breaks; (3) the F-004 XSS
  surface is empirically pinned by P-009 but no unit test of the Markdown wrapper
  exists — a future rehype-pipeline change ships invisibly until probe runs.

  ## STRENGTHENED — batch ZH (2026-05-26)

  Batch ZH extends the finding to the `odd-platform-ui/src/routes/`
  directory. All 5 route sidecars enrich the same gap (verified at
  commits 4ec2b20 and ede5d277 and 80637ed via Grep over `*.test.*`
  and `*.spec.*` for path-builder function names):
    - dataModelling route: NO tests for dataModellingPath /
      queryExamplesPath / relationshipsPath.
    - dataQuality route: NO tests for dataQualityPath.
    - management route: NO tests for managementPath / associationsPath
      / integrationsPath.
    - masterData route: NO tests for lookupTablesPath.
    - terms route: NO tests for termsPath / termsSearchPath /
      termDetailsPath / useTermsRouteParams.

  **The route-directory gap is structurally consequential** because:
    (a) Renaming a BASE_PATH literal silently breaks every consumer's
        link without a failing test (per the path-builder-convention
        entity's known-gaps section).
    (b) The useTermsRouteParams / useIntegrationRouteParams hooks
        carry type-system lies (per the
        `useparams-type-lie-parseint-nan-coercion` invariant) that a
        single isNaN-guard test would pin.
    (c) The bare `/master-data` and `/terms` blank-page renders (per
        the `bare-base-url-behavior-divergence` invariant) have no
        integration test asserting deterministic behaviour.
    (d) The route-mount permission wrappers' name-vs-behaviour drift
        (per `withpermissionsprovider-context-seed-not-route-gate`) has
        no test asserting that wrapped routes still render for
        un-permissioned users — a behavioural pin would catch a future
        refactor that "tightens" the wrapper.

  The route-directory gap shares the platform-wide gap's character: the
  test harness exists; only procedural discipline is missing. A 1-day
  focused effort by one engineer would close ~30 route-module
  assertions at the cheapest cost-leverage ratio.
