name: StaticArgumentMappingContext (platform_url substitution)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
- P-10
description: |-
  **NEW ENTITY, batch 2026-05-25-ZD** — singleton Spring bean
  (`StaticArgumentMappingContext.java:10-25`) carrying the
  platform-supplied substitution values that the Integration Wizard
  mapper interpolates into wizard code-snippet templates.

  ## Shape

  Single-entry `Map<String, String>`:

      Map.of(PLATFORM_URL_PARAM_NAME, platformUrl)

  Where `PLATFORM_URL_PARAM_NAME = "platform_url"` (line 11) and
  `platformUrl` is sourced from
  `@Value("${odd.platform-base-url:http://your.odd.platform}")`
  (line 16) at boot. The constructor builds the map; the bean is
  immutable for its lifetime.

  ## Why "Static"

  The class is named `Static` to emphasise that this is the
  single-dimension PLATFORM-SUPPLIED substitution. Every other
  wizard argument (credentials, hosts, ports, schema names) is
  operator-typed at face value in the wizard form; only
  `platform_url` is substituted at render time.

  ## Default value behaviour

  - **Unset** (the default in `application.yml:209` — the
    `odd.platform-base-url` line is COMMENTED OUT):
    `@Value`'s fallback `http://your.odd.platform` is resolved.
    Every wizard snippet's `platform_url` argument renders the
    literal placeholder. Operators copy-pasting the snippet
    point at a non-existent host.

  - **Empty string** (`odd.platform-base-url=`): Spring autoboxes
    into empty String; the map carries `"platform_url" -> ""`;
    snippets render `http://` (broken).

  - **Internal hostname** (e.g.
    `odd.platform-base-url=http://odd-platform.internal:8080`):
    snippets carry the internal URL; under DISABLED, that URL
    is anonymously readable via the wizard endpoints — a
    config-disclosure vector.

  - **Public URL** (e.g. `https://odd.example.com`): snippets
    are correct copy-paste targets.

  No defensive guard exists on the value:
    - No `@URL` validation
    - No scheme check
    - No length cap
    - An operator typo (`htttp://`) substitutes verbatim

  ## Consumed by

  `IntegrationMapper.java:38-45` calls
  `ctx.get(dto.parameter())` on every code-snippet argument with
  `static: true`. For arguments where `parameter="platform_url"`,
  the substitution fires; for other parameters, the get returns
  null (treated as 'caller fills this in').

  ## Lifecycle

  - Constructed at Spring boot
  - Lives for the lifetime of the application
  - No reload path (changing `odd.platform-base-url` requires
    application restart)

  ## Audiences

  - Wizard authors (who reference `parameter="platform_url"` in
    code-snippet argument YAMLs)
  - Platform operators (who set the value at deployment time)
  - Anyone authoring custom static parameters (would need to
    extend this class to register more)
