proposed_action: |-
  Testcontainers integration test. (a) Pre-create data entity X. (b) Pre-create metadata field F with origin=EXTERNAL via the collector path (MetadataFieldServiceImpl.ingestMetadataFields). (c) Insert a value row (X, F, 'collector-value') with origin=EXTERNAL. (d) As a user with DATA_ENTITY_CUSTOM_METADATA_UPDATE, PUT /api/dataentities/X/metadata/F with body {value: 'user-fabricated'}. (e) Assert HTTP 200. (f) Query `SELECT value FROM metadata_field_value WHERE data_entity_id=X AND metadata_field_id=F` returns 'user-fabricated' (the user override, not the collector value). (g) Test comment 'LOCKS the EXTERNAL-origin overwrite contract as of 2026-05-19. Cross-reference TEST-GAP-491 — the override leaves no activity-feed trail.' When REFACTOR-NNN adds origin-gating, this test FLIPS to expect 400.
