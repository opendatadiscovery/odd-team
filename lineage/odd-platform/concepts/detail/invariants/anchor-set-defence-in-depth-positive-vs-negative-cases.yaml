name: Anchor-set defence-in-depth — positive vs negative cases at the service tier
canonical_in_docs: false
canonical_candidate: true
description: |-
  **NEW INVARIANT, batch 2026-05-19I (LineageServiceImpl + DataEntityServiceImpl
  sidecars); STRENGTHENED batch 2026-05-19M with 4 new sidecars at the
  CONTROLLER-METHOD layer + the FACET-AGGREGATOR surface** — the platform's
  read-collaborative posture (REFACTOR-024 / 203 family, ADR-CANDIDATE-003) is
  mitigated AT SOME service-layer surfaces by an "anchor-set" pattern: the
  service calls authIdentityProvider.fetchAssociatedOwner() upfront, resolves
  the caller owner-anchored ODDRN set, and feeds that set as the boundary
  parameter into the same downstream repository method that would otherwise
  enumerate cross-owner. **The pattern is applied INCONSISTENTLY** across the
  service surface — sibling methods on adjacent paths show diametric postures.

  POSITIVE CASES (DO apply anchor-set):
    (a) DataEntityRelationsServiceImpl.getDependentDataEntityOddrns
        (DataEntityRelationsServiceImpl.java:25-39) DOES call
        fetchAssociatedOwner() (line 26) before passing the resolved owner
        entity-oddrn set to ReactiveLineageRepository.getLineageRelations.
        This is how DataEntityController.getMyObjectsWithUpstream/Downstream
        (batch G + batch M PRIMARY SOURCE) achieves owner-scoping even though
        the SQL layer has no owner column. The anchor IS the defence — but
        SINGLE-POINT-OF-FAILURE because the downstream listByOddrns has no
        JOIN-side defence-in-depth (REFACTOR-225, batch M PRIMARY SOURCE);
    (b) DataEntityServiceImpl.listAssociated (line 218-225) — the orchestrator
        delegate; one counter-example proving the project knows how to apply
        the pattern.

  NEGATIVE CASES (do NOT apply anchor-set):
    (c) LineageServiceImpl.getLineage (LineageServiceImpl.java:87-122) accepts
        dataEntityId from the controller WITHOUT calling
        fetchAssociatedOwner() — confirmed by direct read of
        LineageServiceImpl.java:19 (no AuthIdentityProvider import) + lines
        54-57 (no authIdentityProvider field) + the entire method body. The
        recursive-CTE walk operates on the caller-supplied oddrn with NO
        owner filter at any layer;
    (d) LineageServiceImpl.getDataEntityGroupLineage (LineageServiceImpl.java:59-85,
        batch I + batch M PRIMARY SOURCE confirmation at the controller layer
        via getDataEntityGroupsLineage) — same shape; DEG ID is the anchor;
        any DEG visible to the caller exposes its full member-graph +
        reachable edges + per-member metadata; the DEG-anchored variant is the
        WIDEST blast because the DEG is itself a conceptual grouping;
    (e) DataEntityServiceImpl — 10 list-shape / single-entity read methods
        (getDetails, getDimensions overloads, getDataEntitiesByDatasourceAndType,
        listByTerm, listPopular, getDataEntityGroupsChildren, getDomainsInfo,
        getDataEntityUsageInfo) apply NO anchor-set;
    (f) **NEW batch M** — SearchServiceImpl.getFacets +
        SearchServiceImpl.getFilterOptions — the facet-aggregator suite
        applies fetchAssociatedOwner ONLY to compute the OPTIONAL myObjectsCount
        alongside the catalog-wide total; the FACET COUNTS themselves are
        catalog-wide (no OWNERSHIP join, no principal-derived predicate). The
        anchor-set pattern is INVOKED but consumed as an additive scope not a
        boundary predicate.

  MOSTLY-NEGATIVE CASE:
    (g) DataEntityServiceImpl.findByState (line 181-194) takes an OPTIONAL
        OwnerPojo parameter (SearchServiceImpl can pass it); the pattern is
        AVAILABLE but not always invoked.

  **The pattern is the PLATFORM primary defence-in-depth mechanism for the
  read-collaborative posture, but its application is sparse and uneven**. A
  consistent application across LineageServiceImpl.getLineage,
  LineageServiceImpl.getDataEntityGroupLineage, DataEntityServiceImpl.getDetails,
  and the facet-aggregator suite would meaningfully tighten the read posture
  without rewriting the SQL layer. The architectural shape is clear (the
  positive examples exist); the gap is implementation completeness, not design
  ambiguity. **Batch M adds two SECONDARY findings about even the POSITIVE
  cases**: (1) REFACTOR-225 — the positive case lacks JOIN-side defence-in-depth
  at listByOddrns, making owner-scoping single-point-of-failure at the anchor;
  (2) LineageDepth.empty() — the positive case uses a magic-number sentinel
  for single-hop encoding that is fragile to CTE-termination refactors.
