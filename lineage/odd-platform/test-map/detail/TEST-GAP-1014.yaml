  - 'en.md:tests_coverage_semantic.gaps (No test under odd-platform-ui/src/ references the locale JSON files directly. No CI step validates code↔resource key parity)'
behaviour: |-
  **No CI / test step asserts that every `t(...)` call site in the SPA
  resolves to a key present in `en.json`.** A contributor adding a
  `t('NewFilterLabel')` to a React component with NO accompanying
  en.json entry ships the literal string 'NewFilterLabel' as the
  user-facing text — i18next's missing-key fallback returns the key
  itself.

  The en.md sidecar enumerates 14+ existing drift cases in its
  bugs_limitations_corner_cases block (the specific key list is in the
  sidecar and not duplicated here for length). The natural-keys
  convention (key === English literal) makes the drift INVISIBLE to
  English-speaking developers and reviewers — the rendered string
  looks identical whether the key resolves or falls through.

  The drift is structurally exactly the failure-mode class that
  LSN-020 documents for the Activity Feed `t('User')` label
  (TEST-GAP-1016 sibling): operator-facing text decoupled from the
  resource that defines it, with no CI step asserting parity.
  Severity HIGH because (a) every fresh contribution to the UI
  introduces drift candidates, (b) the drift is silent under the
  English locale (the dominant developer experience), (c) the only
  observable consequence is a non-English user encountering an
  untranslated key OR a developer copy-paste error that leaves the
  literal key as the rendered string.
