gap_id: TEST-GAP-220
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java RoleController controller-method:createRole
surfaced_by:
- createRole.md:tests_coverage_semantic.uncovered_behaviours.[8]
behaviour: '`RoleServiceImpl.create` (lines 51-61) does NOT check `UserProviderRole.values()`
  before creating a new Role, unlike `.update` (line 67-69) and `.delete` (line 81-84)
  which DO. The partial unique index `role_name_unique` on `role(name) WHERE deleted_at
  IS NULL` is the only fence and depends on the seeded Administrator row remaining
  present. If an operator hard-deletes the seeded Administrator row (direct SQL bypassing
  soft-delete), this endpoint can recreate it with attacker-chosen policy bindings.
  The recreated row binds to any user-owner mapping that referenced the original Administrator
  role''s id.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/RoleAdministratorNameAsymmetryTest.java
  name: createRole_withName_Administrator_afterSeededRowHardDeleted_currentlyAllowed
evidence:
- 'createRole.md says: ''creating a role with the exact name `Administrator` or `User`
  (predefined names) — IS rejected by `role_name_unique` ONLY because the migration
  V0_0_56 already inserted those rows; if an operator hard-deletes them, this protection
  vanishes (no service-layer check on UserProviderRole names AT CREATE, unlike `update`
  and `delete` which DO check — RoleServiceImpl.java:68-69 and 81-84)'''
- createRole.md:bugs_limitations_corner_cases.[create-side name-protection gap] severity
  HIGH
- 'concepts.yaml:entities[Role (Authorization)].security_aggregate.weaknesses.[0]
  verbatim: ''**Administrator-name reservation asymmetry on create (HIGH)**'''
cross_references:
- concepts.yaml:entities[Role (Authorization)].security_aggregate.weaknesses.[0]
- concepts.yaml:cross-cutting invariant — Administrator-name reservation asymmetry
  on CRUD (Role + Policy parallel)
- test-map.yaml:test_gaps[TEST-GAP-231] (Policy parallel asymmetry)
proposed_action: 'Add an integration test that: (a) hard-deletes the seeded Administrator
  role row via direct SQL; (b) POSTs /api/roles with `name=''Administrator''` + arbitrary
  policies; (c) asserts the call CURRENTLY succeeds (locks present behaviour); (d)
  once the maintainer adds `UserProviderRole.values()` check to `RoleServiceImpl.create`,
  flips assertion to expect 400 `BadUserRequestException`.'
