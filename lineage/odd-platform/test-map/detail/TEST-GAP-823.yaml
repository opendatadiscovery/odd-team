behaviour: |-
  **CRITICAL — `POST /ingestion/metrics` is unauthenticated in EVERY supported deployment posture, AND there is NO configuration toggle that can fail-close it.**

  The endpoint is reachable by ANY HTTP caller under EVERY combination of:
  - `auth.type ∈ {DISABLED, LOGIN_FORM, OAUTH2, LDAP}` — `/ingestion/**` is in `SecurityConstants.WHITELIST_PATHS` (line 96); enforced for OAUTH2/LDAP via `AuthorizationCustomizer.java:22` and for LOGIN_FORM via `permittedPaths` configuration.
  - `auth.s2s.enabled ∈ {true, false}` — the `S2sAuthenticationFilter` documented to gate "any endpoint that admins can call" does NOT cover `/ingestion/**` paths because of the WHITELIST short-circuit.
  - `auth.ingestion.filter.enabled ∈ {true, false}` — `IngestionDataEntitiesFilter` exact-matches `/ingestion/entities` ONLY (not metrics); `IngestionDataSourceFilter` exact-matches `/ingestion/datasources` ONLY. Neither matches `/ingestion/metrics`. There is NO `IngestionMetricsFilter` class in the codebase.

  **WORSE THAN F-008**: F-008's destructive-write surface (POST /ingestion/entities) at least HAS a toggle (`auth.ingestion.filter.enabled`); ingestMetrics has NO such toggle. To restrict the endpoint, an operator MUST:
  - Deploy network-level controls (firewall rule, reverse-proxy auth), OR
  - Patch the codebase to add a sister `IngestionMetricsFilter`.

  Neither option is documented anywhere in the ODD configuration surface.

  **Blast radius**:
  - Attacker submits arbitrary `MetricSetList` with any ODDRN + any labels.
  - INTERNAL_POSTGRES mode (default): metric_entity / metric_family / metric_label_value / metric_series / metric_point rows are created (per `InternalIngestionMetricsServiceImpl.java:78-98`).
  - PROMETHEUS mode: TimeSeries are remote-written to the operator's external Prometheus instance (per `ExternalIngestionMetricsServiceImpl.java:202-220`). The operator's Prometheus storage costs balloon proportional to attacker traffic.
  - Combined with TEST-GAP-825 (ODDRN-by-payload cardinality DoS), the attacker mints arbitrary metric series at unlimited rate.

  **Live docs surface the gap PARTIALLY**:
  - `/configuration-and-deployment/enable-security` (WebFetched 2026-05-20 status 200) explicitly states `IngestionDataEntitiesFilter` covers `/ingestion/entities` only and "sibling endpoints remain unprotected by this filter" — but does NOT enumerate `/ingestion/metrics` in its list of uncovered sibling paths (the page names `/ingestion/alert/alertmanager`, `/ingestion/entities/degs/children`, `/ingestion/entities/datasets/stats` but NOT `/ingestion/metrics`).
  - `/features/active-platform-features` (WebFetched 2026-05-20) does NOT list metrics ingestion as a sub-feature at all.
  - `/configuration-and-deployment/odd-platform` covers `metrics.storage` + `metrics.prometheus-host` but does NOT describe the endpoint's auth posture.

  **Why CRITICAL**: matches the F-008 + TEST-GAP-815/819 class but with the additional structural worsening (no toggle). Same severity-class as the AlertManagerController unauthenticated-by-default finding in F-008 — that endpoint is uncovered by ANY filter too.

  **Test gap shape**: WebTestClient matrix test covering every deployment posture × the lack-of-toggle assertion.
