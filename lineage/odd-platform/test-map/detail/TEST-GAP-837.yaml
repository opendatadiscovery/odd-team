behaviour: |-
  **HIGH — OwnerAssociation mis-gating across 4 operator-misconfiguration scenarios. The UI-side closure of the batch-T AppInfoController finding (compounded gap at `@Value("${auth.type}")` no default + Overview.tsx string-equality predicate).** Overview.tsx:25-27 evaluates `isShowOwnerAssociation = Boolean(appInfo?.authType && appInfo.authType !== 'DISABLED')`. The predicate is fragile string-equality on a value that has zero validation upstream. Four operator-misconfiguration scenarios produce SURPRISING outcomes WITH NO DIAGNOSTIC:

  **Scenario 1 — Empty auth.type (`AUTH_TYPE=`)**: Backend `@Value("${auth.type}")` at AppInfoController.java:18 has no `:default` → injects `''` → AppInfo response carries `authType: ''` → `Boolean('' && ...) === false` → OwnerAssociation card HIDDEN. **Compound risk**: EVERY backend `@ConditionalOnProperty(havingValue=...)` fails to match → NO SecurityWebFilterChain bean → silently degraded security (REFACTOR-073 + REFACTOR-185 family). The UI hides the card AS IF auth were intentionally disabled, MASKING the deployment misconfiguration from the operator looking at the home page.

  **Scenario 2 — Typo (`AUTH_TYPE=OUATH2`, transposed A and U)**: Backend injects `'OUATH2'` → AppInfo response carries `authType: 'OUATH2'` → `Boolean('OUATH2' && 'OUATH2' !== 'DISABLED') === true` → OwnerAssociation card SHOWS. But the backend has NO matching `@ConditionalOnProperty(havingValue='OUATH2')` → NO SecurityWebFilterChain wired → operator sees an apparently-functional OwnerAssociation card on a deployment with NO authentication (the OPPOSITE risk of Scenario 1).

  **Scenario 3 — Lowercase (`AUTH_TYPE=disabled`)**: Backend injects `'disabled'` → AppInfo response carries `authType: 'disabled'` → `Boolean('disabled' && 'disabled' !== 'DISABLED') === true` (string-equality is case-sensitive) → OwnerAssociation card SHOWS even though the operator's clear INTENT was to disable auth.

  **Scenario 4 — Whitespace (`AUTH_TYPE=' DISABLED'`, leading space)**: Same case-sensitive outcome as Scenario 3 — card SHOWS under what the operator believes is a DISABLED deployment.

  **In all four cases the UI fails-open or fails-closed without any error boundary or warning.** No `console.warn`, no toast, no fallback render that announces "auth.type is not a recognised value". The two failure layers (no `@Value` default at AppInfoController.java:18 + no enum validation in Overview.tsx:26) COMPOUND — neither layer catches the other's gap.

  **Test gap shape**: A `Overview.test.tsx` with a parameterised test that sweeps the 10-value matrix:
  - 4 valid values (DISABLED / LOGIN_FORM / OAUTH2 / LDAP)
  - 4 bug-shaped values (empty / OUATH2 / disabled / ' DISABLED')
  - 2 absent-shape values (undefined / null)
  For each value, mount Overview with `appInfo: { authType: <value> }` mocked in React-Query cache and assert the EXPECTED visibility of OwnerAssociation. The test should DOCUMENT the surprising behaviours (Scenarios 2-4 produce TRUE; Scenario 1 produces FALSE). This pins the contract today. Pairing with REFACTOR-073 (boot-time security-posture validator) is the architectural fix; the test becomes the regression-pin for both layers.
