security_aggregate:
  overall: HIGH
  auth_modes_relevant: []
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: N/A
    detail: |-
      Pattern invariant — the single-fetch shape does not gate; it composes.
      The dashboard's actual authorization posture is captured under the
      `aggregate-catalog-wide-data-quality` operation and the parent
      Data Quality Dashboard entity.
  owner_scoping:
    verdict: N/A
    detail: |-
      Pattern invariant — not data-scoped.
  strengths:
    - |-
      Atomic snapshot semantics — no partial-load skew across the rings.
      An operator reading "Table Health = X" and "Test Results = Y" can
      be sure both numbers describe the same filter state at the same
      instant.
  weaknesses:
    - |-
      A failed fetch fails the entire dashboard at once. No graceful
      degradation where (say) Table Health renders and Test Results shows
      an error — there is one fetch, success or fail. (The component
      destructures only `data` and `isSuccess`, never `isError` — so the
      operator sees three grey 'No data' donuts; see
      `react-query-no-error-destructure-empty-state-masks-backend-failure`.)
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityContent.md
  evidence:
    - DataQualityContent.md:implicit_adrs.[0]
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Single GET /api/dataqatests/runs per dashboard mount and per filter
      change. Backend resolves as three repository queries zipped. Per-render
      client cost is three useMemo reductions over testResults — cheap.
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One aggregate fetch per filter state; no per-ring lazy loading; no
      per-category streaming. All visual blocks come from one DTO.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      The dashboard contract has no pagination (openapi.yaml:1973-2087 declares
      no page/size params). The category set is small and backend-bounded
      (~6), so this is not a scaling failure today, but the contract has no
      pagination — adding a seventh anomaly-class category is a non-trivial
      operator-facing UX change.
  strengths:
    - |-
      Server-side fan-out (three queries zipped) reduces the round-trip
      count to one — saves network latency vs three independent fetches.
    - |-
      Smaller per-block render cost — derivations are pure memoised
      reductions over a small DTO, no async coordination needed.
  weaknesses:
    - |-
      Larger single payload — the whole DTO must arrive before any block
      renders. For an operator on a slow connection, the entire dashboard
      stays in initialData (all zeros) until the fetch resolves; no
      progressive disclosure of any one block.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityContent.md
  evidence:
    - DataQualityContent.md:performance.hot_paths.[0]
    - DataQualityContent.md:performance.throughput_characteristics
related_features:
  - F-032
related_pillar_features:
  - "P-04:F-002"
notes: |-
  The pattern is a recognised dashboard-architecture trade-off. Most
  operator-facing dashboards in mature monitoring tools (Grafana,
  Datadog) use per-panel independent fetches with per-panel error
  surfaces; ODD's choice is the simpler atomic-snapshot variant. The
  trade-off is captured here so a future maintainer reading the
  catalog understands WHY the dashboard is one endpoint, not many.
maintainer_curated: false
