proposed_action: |-
  Add `TermDetailsRoutesSlugConsistency.test.ts`:

  (a) `termDetailsRoutesSlug_matchesRendererPaths_pinsSoTInvariant`: import `TermDetailsRoutes` from termsRoutes.ts; read the source of `components/Terms/TermDetails/TermDetailsRoutes/TermDetailsRoutes.tsx` (via fs.readFileSync if necessary); for each value in `TermDetailsRoutes` (e.g. `'overview'`, `'linked-entities'`, ...), assert the renderer file contains the string `path='${value}'`; pins the SoT invariant across both files.

  (b) `termDetailsPath_defaultArg_referencesTermDetailsRoutesOverview`: parse the source of `termsRoutes.ts:37` and assert the default arg is REFERENCED via `TermDetailsRoutes.OVERVIEW` (not a string literal `'overview'`); CURRENTLY FAILS — the test documents the fix the maintainer should apply (replace the literal with the reference).

  Pair with a `pre-commit` reminder: 'When adding a sub-tab to TermDetails (e.g. `comments`), update TermDetailsRoutes (termsRoutes.ts:25-31), TermDetailsRoutes.tsx (`<Route path>` declarations), TermDetailsTabs.tsx (tab item), AND TEST-GAP-1005.test.'

  Generalisable extension: the same shape exists at alerts + management routes — a single SLUG-CONSISTENCY test class that walks ALL "$pillar"Routes.ts + "$pillar"Routes.tsx pairs and pins the cross-file slug invariant. Defer to TEST-GAP-1003 scaffolding for the directory-wide test home.
