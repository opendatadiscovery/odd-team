gap_id: TEST-GAP-143
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java LoginFormSecurityConfiguration config-key-consumer:auth.type@L31
surfaced_by:
- LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[6]
- LoginFormSecurityConfiguration@L31.md:security.known_security_gaps.[3]
behaviour: 'Session-cookie security: `LoginFormSecurityConfiguration` does NOT configure
  `HttpOnly`/`Secure`/`SameSite` on the session cookie at this chain layer. `spring.session.timeout:
  -1` (application.yml:3) makes sessions never expire. A cookie compromised on HTTP
  or via XSS is valid until JVM restart with no revocation mechanism.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/LoginFormSessionCookieSecurityTest.java
  name: loginFormSession_responseSetCookieMissingSecureHttpOnlySameSite
evidence:
- 'LoginFormSecurityConfiguration@L31.md says: ''Spring''s default SecurityWebFilterChain
  produces a SESSION cookie ... LoginFormSecurityConfiguration does NOT configure
  HttpOnly, Secure, SameSite, or session timeout via the chain ... a session cookie
  obtained on an HTTP (non-HTTPS) deployment is observable in transit'''
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[5,6]
proposed_action: Send a successful form-login request; inspect the response `Set-Cookie`
  header for the SESSION cookie; assert (a) no `Secure` attribute, (b) no explicit
  `SameSite`, (c) no `Max-Age`/`Expires` shorter than infinite. Locks the cookie posture
  for the current LOGIN_FORM chain.
