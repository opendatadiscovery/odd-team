behaviour: 'Owner creation emits NO activity-feed event — `@ActivityLog` is applied
  to `AlertServiceImpl`, `DataEntityServiceImpl`, `DataEntityGroupServiceImpl`, `AlertHaltConfigServiceImpl`,
  `DataEntityInternalStateServiceImpl` (verified by grep) but NOT to `OwnerServiceImpl.create`.
  The activity feed surface therefore does not include a ''an owner named X was created
  by Y at T'' record. Operator''s perspective: owner directory changes are invisible
  to the activity audit, even when they cascade into ownership-row changes that ARE
  recorded. Same shape as Role + Policy no-audit-log. STRENGTHENED batch P — the
  updateOwner and deleteOwner sidecars confirm the SAME absence on the SIBLING write
  surfaces. The asymmetry is now CLASS-WIDE: ALL THREE mutating methods on OwnerServiceImpl
  (create, update, delete) lack @ActivityLog. The deleteOwner sidecar adds the FIFTH
  corroborating sidecar to F-006''s 4-sidecar audit-silence pattern (RoleController
  + PolicyController + ReactivePolicyRepositoryImpl + ReactiveRoleRepositoryImpl
  + OwnerServiceImpl.delete). The updateOwner sidecar additionally surfaces a NEW
  drift: the role-rebind destructive replace at OwnerServiceImpl.java:76-81 (deleteOwnerRelationsExcept
  + createRelations) destructively reassigns Owner''s roles WITHOUT audit trail —
  ''owner X had roles [A, B] before, now has [B, C]'' is not recorded. Combined with
  the OWNER_TO_ROLE hard-delete on owner-delete (deleteOwner.md:implicit_adrs.[1]),
  the audit story is: an operator can rename, re-role, AND delete an owner — with
  NO trace anywhere except (a) the DB row''s `deleted_at` timestamp (no operator-readable
  surface) and (b) the absence of OWNER_TO_ROLE rows (no historical record).'
