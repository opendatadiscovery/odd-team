behaviour: |-
  **STRENGTHENS TEST-GAP-121 with filter-class file:line anchor + at-rest implication.** The filter-class sidecar primary-sources the plaintext-equality contract: `IngestionDataEntitiesFilter.java:56` — `dto.tokenPojo().getValue().equals(token)`. Plaintext `String.equals`, NOT `MessageDigest.isEqual` (not constant-time). The token is also stored at-rest as plaintext in PostgreSQL (TOKEN.value column populated by `RandomStringUtils.randomAlphanumeric(40)` per the rotate-side sidecar). Two-layer concern: (a) timing-based token discovery on a low-latency network is theoretically feasible (62^40 ≈ 2.4e71 search space makes practical attack infeasible, but the principle is violated); (b) DB-read attack (read-only SQL injection elsewhere in the platform, e.g. the recently-flagged FTS SQL-injection in batch H) would yield the live ingestion tokens directly. Implicit ADR encoded: shared-secret stance applies to BOTH `S2sAuthenticationFilter` (sibling — YAML-configured plaintext) AND this filter; the architectural decision is uniform across the auth surface.
