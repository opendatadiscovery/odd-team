observed_vs_expected:
  facets:
    - drift_class: per_entity_activity_tab_no_type_axis_unlike_global_feed
      description: |-
        Per-entity Activity tab exposes only date + eventType + userIds
        filters; the global Activity page exposes a TYPE-TABS axis
        (ALL / MY_OBJECTS / UPSTREAM / DOWNSTREAM) the per-entity surface
        has NO equivalent for. Per-entity is implicitly ALL-equivalent;
        no doc page mentions the asymmetry. Operators expecting "filter
        my-owned changes on this entity" cannot — they get every change
        from every actor on the entity regardless of ownership scope.
      evidence:
        - "DataEntityActivity/Filters/Filters.tsx:44-60 (no type-tabs / no AppTabs)"
        - "components/shared/elements/Activity/ActivityTabs.tsx:29-51 (the GLOBAL tabs that don't appear here)"
      ui_unverified: false
    - drift_class: user_filter_label_misleads_at_per_entity_tab_inherits_lsn_020
      description: |-
        The `User` filter label at Filters.tsx:58 channels the F-021
        LSN-020 surface to the per-entity tab: dropdown lists OWNERS,
        binds `userIds` query param, backend SQL resolves OWNER_ID via
        USER_OWNER_MAPPING — filters by ownership-of-entity not
        actor-of-action. Compounded at the per-entity surface: an
        operator on a single entity expects "show only actions by
        Alice" and gets "show actions on this entity by Alice's
        OWNER (which may include Bob's actions if Bob shares Alice's
        owner mapping)".
      evidence:
        - "DataEntityActivity/Filters/Filters.tsx:58 (MultipleFilter filterName='userIds' name={t('User')})"
        - "F-021 drift_class_summary user_filter_label_promises_actor_axis_sql_binds_owner_of_entity_axis_ui_doc_both_misleading"
      ui_unverified: false
    - drift_class: per_entity_activity_no_permission_gate_no_restrictedroute_wrap
      description: |-
        DataEntityDetailsRoutes.tsx:105 mounts `<DataEntityActivity />`
        BARE — no `RestrictedRoute`, no `WithPermissionsProvider`
        (contrast `alerts` at lines 70-84 which uses BOTH, `history`
        at 85-94 which uses RestrictedRoute on `!isStatusDeleted`,
        `linked-entities` at 95-104 same). The Activity tab survives
        soft-deleted entities; the operator can read audit history
        on a SOFT-DELETED entity from the per-entity tab without any
        gate — same cross-channel-leak class as F-014's
        soft_delete_inclusive_existence_check facet.
      evidence:
        - "DataEntityDetailsRoutes/DataEntityDetailsRoutes.tsx:105"
        - "DataEntityDetailsRoutes/DataEntityDetailsRoutes.tsx:70-84 (alerts route — gated)"
      ui_unverified: true
      ui_unverified_reason: |-
        Soft-delete behaviour at the per-entity Activity endpoint
        depends on backend `getDataEntityActivity` implementation —
        whether it filters DATA_ENTITY.STATUS or uses
        existsIncludingSoftDeleted like F-014 — not verified at the
        controller sidecar tier.
    - drift_class: per_entity_activity_no_useeffect_debounce_no_abortcontroller
      description: |-
        ActivityResults.tsx:41-45 dispatches on `[queryParams,
        dataEntityId]` change with no debounce and no in-flight
        cancellation. Lower amplification than the global feed
        (1 DB query vs 5) but the same race contract — twiddle the
        calendar fast, redux reducer accepts whichever response
        lands last regardless of correlation with the latest
        queryParams.
      evidence:
        - "DataEntityActivity/ActivityResults/ActivityResults.tsx:41-45"
      ui_unverified: false
    - drift_class: per_entity_activity_tabs_visible_when_entity_deleted_inconsistent_with_other_tabs
      description: |-
        DataEntityDetailsTabs.tsx:91-94 renders the Activity tab
        unconditionally — the only tab in the entity-detail tab strip
        without a `hidden:` clause (contrast every other tab which is
        hidden when `isStatusDeleted`). An operator landing on a
        soft-deleted entity sees Activity as the ONLY surviving tab,
        which is operationally correct (audit history matters most on
        deleted entities) but visually inconsistent — no doc explains
        why Activity is privileged.
      evidence:
        - "DataEntityDetailsTabs/DataEntityDetailsTabs.tsx:91-94 (no hidden clause)"
        - "DataEntityDetailsTabs/DataEntityDetailsTabs.tsx:62, 67, 72, 79, 84, 89, 98 (other tabs with hidden: isStatusDeleted or related)"
      ui_unverified: false
    - drift_class: i18n_user_label_uniform_across_locales_per_entity_inherits_global_amplifier
      description: |-
        The `t('User')` natural-keys lookup at Filters.tsx:58 channels
        through the same i18n resource (en.json:347 + 5 non-English
        locales identical) that F-021 batch ZJ pinned as the LSN-020
        amplifier. Per-entity tab inherits — compliance reviewer in any
        locale gets the same misleading label.
      evidence:
        - "DataEntityActivity/Filters/Filters.tsx:58"
        - "F-021 batch ZJ note 1 (en.json natural-keys uniform across 6 locales)"
      ui_unverified: false
