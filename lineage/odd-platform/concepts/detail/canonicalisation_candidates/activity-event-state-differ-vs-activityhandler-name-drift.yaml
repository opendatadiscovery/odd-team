evidence:
- |-
  ActivityHandler.md:understanding — verbatim: "ActivityHandler is a
  4-method interface (3 abstract + 1 default that throws) in 22 lines
  (ActivityHandler.java:9-22) that defines the dispatch contract for
  ODD's Activity-feed audit-event recording. It is NOT a write-side
  'handle(event)' interface as the dispatch pattern name might suggest —
  it is a state-snapshot differ: getContextInfo(parameters) captures
  the OLD state of the affected data_entity BEFORE the mutation runs;
  getUpdatedState(parameters, dataEntityId) captures the NEW state
  AFTER the mutation runs. The handler never writes the ActivityPojo
  — the actual diff (oldState != newState string-equality at
  ActivityAspect.java:86) and the persist (activityRepository.saveReturning
  at ActivityServiceImpl.java:50) happen in ActivityAspect/
  ActivityServiceImpl AFTER both snapshots are in hand."
- |-
  ActivityHandler.md:concepts.invariants.[0] — verbatim: "Snapshot-differ
  contract, NOT write-handler contract. The interface defines only
  state-reading methods. Diff computation (postActivity's filter at
  ActivityAspect:86) is OUTSIDE the handler scope; ActivityPojo
  persistence (activityRepository::saveReturning) is OUTSIDE the
  handler scope. A handler that misimplements getContextInfo or
  getUpdatedState produces a wrong-but-still-emitted activity record
  OR a silently-no-emit (oldState == newState, filter blocks)"
- |-
  ActivityHandler.java:9-22 — line-by-line: the 4-method interface
  has no `handle()` method, no `persist()` method, no `dispatch()`
  method; the methods are `isHandle` (predicate), `getContextInfo`
  (snapshot pre), `getUpdatedState` × 2 (snapshot post)
- |-
  The 18 concrete impls under service/activity/handler/ — verified
  read-only via Glob; each impl's body issues DB reads, not DB
  writes; verified pattern uniformity (DescriptionUpdatedActivityHandler,
  BusinessNameUpdatedActivityHandler, TagActivityHandlerImpl, etc.)
notes: |-
  This canonicalisation candidate is the load-bearing finding of batch
  VAL-LSN-019-B. The name `ActivityHandler` is a textbook NAME-VS-
  BEHAVIOR drift — the type does NOT do what its name implies — and
  the cost is paid by every maintainer who has to reverse-engineer
  the snapshot-differ pattern from the surrounding ActivityAspect
  code.

  The candidate proposes a rename (Java interface + 18 concrete impls
  + 2 abstract bases + Javadoc + feature-page docs). Estimated effort:
  1-2 days of refactoring + review. Alternative: document the
  contract at the interface level (~30 minutes of Javadoc work).

  The maintainer should consider this candidate alongside the new
  invariants `activity-handler-concurrent-oldstate-capture-race` and
  `activity-handler-multi-id-default-throws-runtime-not-compile` —
  ALL THREE findings point at the handler tier as an underdeveloped
  abstraction. A pillar-level refactor that (a) renames the
  interface, (b) closes the multi-id default-throw via N×single-id
  composition, (c) adds optimistic concurrency control to close the
  oldstate-capture race would address all three at once.

  Cross-cutting connections:
    - Pairs with new entity `activity-handler-state-differ` — the
      first-class entry that explicitly states the snapshot-differ
      contract
    - Pairs with new operation `write-activity-event-snapshot-diff-emit`
      — names the actual write pipeline the differ is the dispatch
      core of
    - Pairs with the LSN-019 Stress Protocol Category B (name-behavior
      pairs) — this finding is a CANONICAL EXAMPLE of the pattern
      that triggered the Stress Protocol's creation

  Three DOC-NNN / REFACTOR-NNN candidates:
    (a) Rename `ActivityHandler` → `ActivityStateDiffer` (or
        `ActivityStateSnapshotter`) in odd-platform; update 18+ impls,
        2 abstract bases, 1 service-tier field name, 1 dispatcher
        method name, all Javadoc references, and the activity-feed
        feature-page docs
    (b) (Alternative if rename rejected) Add interface-level Javadoc
        explicitly stating the snapshot-differ contract; warn that
        handlers MUST NOT persist
    (c) Add `Activity Event State Differ` (or chosen rename target)
        as a canonical concept in main-concepts.md
