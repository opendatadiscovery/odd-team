# Multilingual UI (i18n / Locale Switching) — product-owner reflection

## product_owner_narrative

Multilingual UI is the platform SPA's localisation surface: the promise to a new
customer is "the ODD Platform interface is available in six languages — English,
Spanish, Chinese, French, Ukrainian, and Armenian — and a user's chosen language
persists across reloads" (per `i18n_ts.md` understanding; six locales registered at
`i18n.ts:10-17`). The audience is every authenticated `odd-platform-ui-end-user`,
and operationally the `platform-operator` deploying ODD for a non-English-speaking
team. It is a cross-cutting UI-shell capability owned by the Management pillar's UI
surface, sibling to F-041 (the Application Toolbar that HOSTS the switcher) and F-035
(the App Info menu); F-043 owns the i18n LAYER itself — the contract between every
`t('<key>')` call site and the locale bundles.

A user interacts with it through one control: the `SelectLanguage` dialog, reached
from the user-account dropdown in the top-right toolbar (per `SelectLanguage.md`
understanding; mounted at `AppToolbar.tsx:97`). The dialog lists every locale read
live from `i18n.languages`, filters by a friendly-name search, and on click swaps the
active bundle via `i18n.changeLanguage(lang)` and writes the choice to
`localStorage('i18nextLng')` (`SelectLanguage.tsx:28-33`). There is no backend call,
no cookie, no user-profile record — the entire persistence path is browser-local
(grep for `i18nextLng` across `odd-platform-api/` returns zero matches, per both UI
sidecars). On next page load the bootstrap reads the key back, falling back to a
hardcoded `'en'` when it is unset or whitelisted-out (`i18n.ts:20-25`).

The working parts a product owner would demo: 418 distinct English source strings in
`en.json` rendered across every page (`en.md` understanding); the **natural-keys**
contract where the key IS the English phrase (417/418 entries have `key === value`,
one slug exception at `en.json:381`); a six-element `fallbackLng` chain
`['en','es','ch','fr','ua','hy']` walked on a missing key (`i18n.ts:30`); and the
locale switcher with country-flag visuals (`SelectLanguage.tsx:60-62`). But the
reality diverges from the promise in ways only a non-English user can see. Twelve-plus
keys referenced via `t()` are absent from EVERY locale — including the three top-level
navigation tabs `Data Quality` / `Data Modelling` / `Master Data` (`ToolbarTabs.tsx:46,51,56`)
— so a French user sees three untranslated English tabs amid the translated chrome
(`en.md` bugs_limitations_corner_cases.[0], grep-verified across all six files). The
locale files have drifted in cardinality (en=418, ch=415, fr=415, es=414, hy=414,
ua=414) with no CI parity check, and no `missingKeyHandler` is wired (`i18n.ts:27-31`)
— so the contract "every t() call has a matching key" is enforced by nothing.

The integration story is where this layer becomes load-bearing for OTHER features.
Every label drift in the platform channels through this layer UNIFORMLY: the Activity
Feed `t('User')` filter label (`en.json:347` → `Filters.tsx:58`) is the LSN-020 drift
surface — `userIds` binds at the SQL layer to `USER_OWNER_MAPPING.OWNER_ID.in(userIds)`
(`ReactiveActivityRepositoryImpl.java:273`), not to the actor `activity.created_by`,
and no locale corrects the misleading label (F-021 owns the SQL bug; F-043 is the
channel). The `Dictionary` tab label → `/termsearch` URL drift channels the same way
(F-024 downstream). The natural-keys default means a wrong label reaches a Spanish or
Armenian compliance reviewer with identical fidelity to an English one — the
multilingual feature actively PROPAGATES every label-vs-implementation mismatch across
all six languages rather than offering a per-locale correction seam.

Edge cases a senior product owner would flag in the demo: the switcher itself is
labelled and searchable only in English (`SelectLanguage.tsx:48-50` filters by the
English friendly-name; native-name search returns empty) — the one control a
non-English user needs to find their language is in a language they may not read;
`navigator.language` is never consulted on first visit, so a Spanish-browser user
lands entirely in English (`i18n.ts:22`); the preference resets to English on any new
device or cleared browser data; and the whole feature is invisible in the published
docs (`en.md` doc_drift_findings.[1] / F-047).

## hypotheses

- id: H-001
  hypothesis: |-
    When a user opens the SelectLanguage dialog and picks "Spanish", the entire SPA
    re-renders in Spanish — every label that HAS an es.json entry shows the Spanish
    string — and the choice is applied immediately without a page reload.
  derivation: |-
    SelectLanguage is the single locale-switch control (UI-label seed); changeLanguage
    swaps the in-memory bundle and the react-i18next provider broadcasts a re-render.
  seed_source: ui-label
  validation:
    verdict: confirmed
    actual_behavior: |-
      Picking a locale row calls `await i18n.changeLanguage(lang)` (SelectLanguage.tsx:29)
      which swaps the active resource bundle in memory; the react-i18next provider
      (wired at i18n.ts:27 via initReactI18next) broadcasts a change event that
      re-renders every t()/useTranslation()-consuming component in the tree (per
      SelectLanguage.md performance.known_performance_gaps.[0] — "a single broadcast").
      No reload is required; the swap is synchronous-feeling for the user. For every
      key present in es.json the Spanish value renders; for keys absent from es.json
      the fallbackLng chain returns English (or another locale — see H-008).
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar__ui-shell-widget__SelectLanguage.md
        section: understanding + concepts.operations.swap_active_i18next_language
        cite: "SelectLanguage.tsx:29 (i18n.changeLanguage) + SelectLanguage.tsx:48 (i18n.languages list)"
        note: "in-memory bundle swap + provider broadcast; no reload, no backend call."
      - sidecar: odd-platform__ts__locales__ui-shell-bootstrap__i18n_ts.md
        section: dependencies_semantic.requires-feature
        cite: "i18n.ts:27 (initReactI18next provider binding)"
        note: "the provider chain is what propagates the language change to all consumers."
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

- id: H-002
  hypothesis: |-
    When a user picks a language and later reloads the page (same browser, same device),
    the platform remembers their choice and renders in that language again.
  derivation: |-
    The switcher writes localStorage('i18nextLng') and the bootstrap reads it back —
    the persistence round-trip is the user-facing promise "my preference persists".
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |-
      The localStorage round-trip works WITHIN one browser on one device: SelectLanguage
      writes `localStorage.setItem('i18nextLng', lang)` (SelectLanguage.tsx:30) and the
      bootstrap reads `localStorage('i18nextLng')` on next module load (i18n.ts:22), so a
      same-browser reload restores the choice. It does NOT persist across devices,
      browsers, private-mode windows, or a browser-data clear — there is no server-side
      user-profile binding (grep i18nextLng across odd-platform-api/ = 0 matches, per
      both UI sidecars). On any of those resets the user falls back to hardcoded English.
      This is the same finding F-041 H-010 surfaces from the chrome's seat.
    evidence:
      - sidecar: odd-platform__ts__components_shared_elements_AppToolbar__ui-shell-widget__SelectLanguage.md
        section: implicit_adrs.[0] + bugs_limitations_corner_cases.[2]
        cite: "SelectLanguage.tsx:30 (write) + i18n.ts:22 (read) + grep i18nextLng in odd-platform-api = 0"
        note: "client-side only persistence; no server profile, no cookie."
      - sidecar: odd-platform__ts__locales__ui-shell-bootstrap__i18n_ts.md
        section: bugs_limitations_corner_cases.[1] + scaling_characteristics.[1]
        cite: "i18n.ts:22 (localStorage read with hardcoded 'en' fallback)"
        note: "switching browsers/devices/clearing data resets to default English."
    operator_visible_failure: |-
      A user who sets Spanish on their work laptop sees English when they open ODD on
      their phone, in an incognito window, or after clearing cookies — for a six-locale
      product this materially undercuts the "persists across reloads" promise: it
      persists across reloads on ONE browser only. An operator deploying ODD for a
      Spanish-speaking team cannot set an org-wide default; every user must re-pick on
      every device. The reset is silent — no banner explains the language reverted.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
