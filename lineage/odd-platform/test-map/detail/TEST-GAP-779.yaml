behaviour: |-
  **HIGH — `spring.session.timeout=-1` (shipped default at application.yml:2-3) makes sessions never expire across ALL three session providers, which compounds with the hourly housekeeping job into a silent no-op.** Sidecar primary-source confirms three composing facts:

  (1) **`spring.session.timeout=-1` is the shipped default** (application.yml:2-3): the value applies to all three session providers (IN_MEMORY / INTERNAL_POSTGRESQL / REDIS). Spring's `MaxInactiveInterval` for the session is set to whatever the SessionStore computes from this value — and `JooqSessionRepository.java:138-148` confirms the per-record `expiry_time` column is computed as `lastAccessedTime + maxInactiveInterval.toSeconds()`. When `maxInactiveInterval` is unset or negative, the expiry is effectively never reached.

  (2) **Housekeeping job uses `expiry_time < now()` predicate** at PostgreSQLSessionHousekeepingJob.java:30. Combined with (1), the predicate NEVER matches — the housekeeping job is a NO-OP under the shipped defaults. The `SPRING_SESSION` + `SPRING_SESSION_ATTRIBUTES` tables grow monotonically.

  (3) **No log warning, no operator-visible signal**: SessionConfiguration carries no `@Slf4j`, no boot-time `log.warn("spring.session.timeout=-1 — sessions never expire")` (verified via the sidecar's `dependencies_semantic.requires-config` block + grep for `log.warn|log.info` in SessionConfiguration.java — 0 matches). An operator inspecting `/actuator/env` sees the value but no compound warning.

  **Operator-impact scenario** (LSN-001 family — silent monotonic growth):
  - **IN_MEMORY**: the `ConcurrentHashMap` grows monotonically until JVM restart. For a high-RPS deployment (1000 unique users/day × 365 days × baseline 5 KB per session), heap pressure surfaces as GC pauses, then OOM after weeks/months.
  - **INTERNAL_POSTGRESQL**: the `SPRING_SESSION` table grows monotonically. The shipped Flyway migration V0_0_41 creates no `EXPIRY_TIME` index that would help; full-table scan on session lookup degrades latency.
  - **REDIS**: the Redis key-space grows monotonically. Operators relying on Redis `maxmemory-policy` default `noeviction` see OOM-on-write failures.

  All three are SILENT — no log line, no metric, no actuator-health alert. The operator discovers the issue when something breaks.

  **Compound risk with TEST-GAP-777** (no cookie security): a never-expiring session that grants permanent ADMIN access (LOGIN_FORM hardcoded admin per TEST-GAP-774) means cookie theft has no time bound. The compound posture is the LSN-001 / LSN-002 / cross-batch-Q (REFACTOR-417 session-cookie permanence) all in one place.

  **Test gap shape**: integration test asserting (a) the shipped default `spring.session.timeout` is `-1`, (b) the housekeeping job's `expiry_time < now()` predicate matches NO rows when sessions are written under default config, (c) the JOOQ SQL produces a never-matching SELECT plan (verifiable via `EXPLAIN ANALYZE` or via test-side row count after housekeeping run). PINS the compound risk so a future change to `spring.session.timeout=86400` (24h, the recommended-production-default) AS a deliberate update triggers test failure and forces explicit human review.
