    EmailNotificationSender.java:58-60 to throw NotificationSenderException
    instead of RuntimeException. Closes the email-side symptom but leaves
    the latent extensions and the seam root cause unaddressed.
  - |-
    Add a unit test that injects a throwing sender (RuntimeException +
    NotificationSenderException + IllegalArgumentException variants) and
    asserts the next sender in the list still receives the message —
    pins the contract independent of the chosen mitigation option.
  - |-
    Document the per-sender failure isolation contract on the live
    /features/active-platform-features/notifications page — operators
    choosing channel order should know the current asymmetry and the
    planned mitigation.
notes: |-
  STRENGTHENS the batch-K exception-type-asymmetry-notification-senders
  invariant from a 1-part finding to a 4-part architectural picture:
    Part 1 — original symptom (batch K dispatcher capture)
    Part 2 — primary source (batch Y EmailNotificationSender pin)
    Part 3 — latent extensions (batch Y Slack + Webhook Jackson paths)
    Part 4 — seam root cause (batch Y PostgresWALMessageProcessor)

  The 4-part picture explains why Option A (one-line dispatcher broaden)
  is the recommended near-term fix even though Option B (widening the
  seam) is architecturally cleaner: Option A simultaneously closes the
  CURRENT symptom (email bypass) AND the LATENT extensions (Slack +
  Webhook Jackson paths) AND avoids the cost of changing the seam.
  Option B should be considered as part of a broader F-009 architectural
  refactor that also addresses poison-skip expressivity.

  Cross-cutting connections:
    - Pairs with the sibling batch-Y invariant
      cross-channel-runtimeexception-abort-void-return-root-cause-at-postgreswalmessageprocessor
      — both findings root-cause to the same seam shape from different
      angles (this invariant: impl-side contract; sibling: blast-radius
      consequence)
    - Pairs with the batch-Y poison-message-wal-replay-loop strengthening
      — the same seam shape's narrow-throws problem produces BOTH the
      symptoms (email-bypass for the per-sender catch + translator-bypass
      for the dispatcher-level catch)
    - Cross-cutting case-law: "narrow SPI seam designed for one
      caller-impl pair plus silent-narrowing of impl's actual exception
      surface plus widening latent through dependencies (Jackson here,
      Freemarker for email)" — a class of architectural drift that
      compounds over time as new dependencies are added

  Three DOC-NNN candidates flow from this strengthening:
    (a) Document the per-sender failure isolation contract on the live
        notifications page; operators choosing channel order should know
    (b) Document the recommended fix path (Option A near-term, Option B
        long-term) as a future-evolution ADR
    (c) Cross-link from the F-009 feature-flow's exception-type-asymmetry
        drift facet to this strengthened invariant
