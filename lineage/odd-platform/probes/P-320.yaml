realism_caveats: |
  - LOCAL-ONLY (APPROACH.md §9 rule 12): docker-compose stack (ODD platform + Postgres) +
    direct HTTP (a small script / curl) + DB SELECT/UPDATE seeding — no cloud, no managed DB,
    no hosted runner. Satisfies feature-reflector Rule 6.
  - The DISABLED-default variant (sub-assertions a + d) needs no auth header: under
    auth.type=DISABLED every call is anonymous, which is itself the "caller with no ownership"
    condition (and the H-002 anonymous-reach pin). To ALSO pin the authenticated-cross-owner
    leg (H-001 under a real auth mode), the harness can re-run sub-assertion (a) against a
    LOGIN_FORM-configured stack authenticated as owner A (32001) — same expected 200. The
    DISABLED run is the minimum; the LOGIN_FORM run is the stronger pin.
  - This probe PINS THE CURRENT (contradicted) BEHAVIOUR deliberately: PASS = the cross-owner +
    soft-deleted + unbounded-size compound reproduces. A future fix (owner-scope, soft-delete-
    exclude, or @Max clamp) is EXPECTED to make these assertions FAIL — that is the regression
    signal, and at that point H-001/H-003/H-005/H-010 flip to confirmed-fixed and this probe is
    updated to assert the new secure posture.
  - The status_updated_by username-PII leg (H-009) is NOT asserted here because it depends on the
    AlertItem render path (Owner-name vs raw-username), which has no enriched UI sidecar — see the
    reflection's validation_gaps. A UI-render probe is the right vehicle once the per-entity tab is
    enriched, not this API-level compound.
  - If the harness observes size clamping somewhere not visible in the static trace (e.g. an R2DBC
    fetch-size ceiling), record the observed effective cap — that converts H-003's unbounded half
    from contradicted to partial.
