behaviour: |-
  **`RoleServiceImpl.list` (LINE 43) uses `noneMatch(Administrator)` — VACUOUSLY TRUE on EMPTY roles list — empty-role users see ZERO roles (correct) but the path is fragile.** A user with no role bindings → `getCurrentUserRoles → getUserRolesByOwner` returns `List.of()` → `roles.stream().noneMatch(r -> r.pojo().getName().equals("Administrator"))` returns TRUE (vacuous truth) → the `.map` branch fires → `filterUserRoles(emptyList, query)` returns empty Page. The correct path. BUT: a maintainer flipping `noneMatch` to `anyMatch` (e.g., for a refactor) would invert the logic: `anyMatch` on empty stream returns FALSE → the switchIfEmpty fires → the admin path is taken. The data-exposure consequence: a user with NO roles would suddenly see the FULL paginated admin policy/role catalog. The fix at this line is a SINGLE-CHARACTER refactor (`.noneMatch` → `.anyMatch`) — there is no compiler error, no IDE warning, no test asserting the current behaviour. The test pins the empty-roles invariant explicitly. Sister of TEST-GAP-NN (PolicyServiceImpl batch-I bug-4) which captures the SAME pattern on the policy half.
