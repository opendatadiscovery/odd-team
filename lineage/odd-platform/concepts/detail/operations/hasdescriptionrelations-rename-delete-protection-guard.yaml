notes: |-
  NEW operation captured in batch N. The single repository method is
  the platform's TERM-WRITE-PROTECTION enforcer — every authenticated
  rename or delete of a Term routes through it.

  Cross-cutting connections:
    - Pairs with the Term Linkage entity — this guard protects the
      term-link-mention semantics
    - Pairs with the hasdescriptionrelations-parent-soft-delete-bypass
      invariant (batch N) — surfaces the corner case where the guard
      bypasses
    - Pairs with the term-to-term-deleted-at-schema-drift-v0_0_76-vs-v0_0_91
      invariant (batch N) — subquery 3 has a separate
      schema-drift gap on its `term_to_term` reference
    - Cross-references the three-soft-delete-mechanisms-across-the-repository-layer
      invariant — the guard's three subqueries each use a DIFFERENT
      soft-delete predicate reflecting the platform's architectural
      inconsistency

  Recommended documentation:
    (a) Document the rename-protection / delete-protection on the
        business-glossary operator page — operators encountering the
        400 message need the context
    (b) Document the parent-soft-delete corner case (the operator-visible
        consequence of restoring a soft-deleted entity whose description
        mentions a Term that has since been renamed or deleted)
    (c) Add a regression test pinning the corner case (per the
        hasdescriptionrelations-parent-soft-delete-bypass invariant's
        recommended test)
