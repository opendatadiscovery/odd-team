behaviour: |-
  **Path coverage IS endpoint-by-endpoint, not feature-by-feature — the toggle name is misleading.** `auth.ingestion.filter.enabled=true` locks down ONLY `/ingestion/entities` (the hardcoded path at IngestionDataEntitiesFilter.java:28). Sibling endpoints are routed differently: (a) `POST /ingestion/datasources` is covered by `IngestionDataSourceFilter` (UNCONDITIONAL — no toggle); (b) `POST /ingestion/alert/alertmanager` (AlertManagerController.java:21) is covered by NO filter AND has NO `@PreAuthorize`. An operator reading the property name reasonably believes 'ingestion' is locked when toggle=true, and is wrong by one endpoint. STRENGTHENS TEST-GAP-014 (AlertManager webhook anonymous) by providing the filter-class structural confirmation that the toggle does NOT cover the AlertManager surface — the gap is not a defect to be fixed by 'flipping the toggle on' but requires explicit additional filtering. The asymmetry across the three ingestion endpoints (toggled, always-on, none) is the architectural finding.
