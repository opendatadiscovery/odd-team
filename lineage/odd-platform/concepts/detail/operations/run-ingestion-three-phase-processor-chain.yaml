notes: |
  Operation vocabulary captured for the ingestion pipeline orchestration primitive.
  Five doc + test + code gaps surface:

    (a) The 14-processor chain is an internal architectural detail invisible to
        operator-facing docs and the OpenAPI contract. Contributor-facing doc
        gap (no `/developer-guides/...` page for new-processor authoring).

    (b) Within-phase execution order is non-deterministic — no test catches a
        regression where a MAIN-phase processor develops an undeclared write-then-read
        dependency on another MAIN-phase processor.

    (c) FTSVectorsIngestionRequestProcessor processes ALL entities every time
        (no diff check). A high-frequency idempotent collector burns Postgres
        CPU recomputing identical tsvectors.

    (d) UsageReportIngestionRequestProcessor runs on EVERY ingestion regardless
        of delta — wasted writes to data_entity_statistics on zero-delta requests.

    (e) ActivityIngestionRequestProcessor emits CREATE rows only — UPDATEs from
        ingestion are silently un-audited. An operator investigating "who changed
        this entity's description via ingestion" cannot answer from logs.

  Cross-references:
    - Companion invariant: `single-transaction-per-batch-ingestion-no-per-entity-isolation`
      (the broader transaction scope).
    - Companion invariant: `silent-data-loss-via-replace-not-merge-ingestion-semantics`
      (the destructive semantics of MetadataIngestionRequestProcessor + LineageIngestionRequestProcessor).
    - Companion entity: `s2s-ingestion-pipeline` (the broader pipeline concept).
