behaviour: '`LdapTemplate.setIgnoreSizeLimitExceededException(true)` (line 131) silently
  truncates group searches that exceed the directory''s size limit. Admin user whose
  admin-group membership lives beyond the cutoff is silently demoted to USER on login
  — no log, no alert. Combined with substring-collision matching (TEST-GAP-159), authority
  sets become non-deterministic across logins.'
