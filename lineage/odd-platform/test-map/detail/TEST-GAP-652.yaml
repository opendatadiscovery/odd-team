behaviour: |-
  **CRITICAL: UI-vs-API security asymmetry under `auth.type=DISABLED` for COLLECTOR_* permissions (REFACTOR-185 19th sidecar facet).** Under `auth.type=DISABLED`, `/api/identity` returns empty `permissions` → `WithPermissions` HIDES every Add / Edit / Delete / Regenerate button (because `hasAccessTo(*) === false` for all COLLECTOR_* permissions). An operator clicking around the UI sees a **READ-ONLY surface** and may reasonably infer "this deployment is locked down" or "COLLECTOR_* permissions are missing from my role". BUT the BACKEND `DisabledAuthSecurityConfiguration.java:11-19` bypasses ALL `SECURITY_RULES` including the four `COLLECTOR_*` permissions at `SecurityConstants.java:127-137`. A direct `curl POST /api/collectors` succeeds anonymously. The UI is QUIETER than the API on this surface — a security-critical UI-vs-API asymmetry that compounds with REFACTOR-185's other 18 facets. An attacker bypassing the UI with `curl POST /api/collectors` can mint a new collector token, then use it at `POST /ingestion/datasources` (always-on filter chain) to bootstrap a hostile collector identity (per ADR-CANDIDATE-141). The compound surface under default `auth.type=DISABLED`: anyone on the network can `POST /api/collectors`, copy the response token, and `POST /ingestion/datasources` with that token to spawn a hostile collector — the DISABLED-mode bypass extends through the ENTIRE collector boot-of-self chain. NO test asserts (a) under `auth.type=DISABLED`, the UI renders zero Add / Edit / Delete / Regenerate buttons (positive UI-side pin); (b) under the same configuration, the BACKEND endpoint accepts an anonymous `POST /api/collectors` (negative-finding pin); (c) the cross-layer asymmetry is the regression-pin — the UI promises a security property the backend does not enforce.
