behaviour: |-
  **No-authorization posture on /api/relationships/** is unpinned —
  every endpoint is reachable by any authenticated caller (or anonymous
  under DISABLED) without owner-scoping, data_source_id filter,
  namespace_id filter, EXCLUDE_FROM_SEARCH filter, or HOLLOW filter.**
  The controller has no @PreAuthorize, SecurityConstants.java:95-355
  has no /api/relationships/** matcher, the service applies no check,
  and the repository SQL filters only by `entity_class_ids =
  [DATA_RELATIONSHIP.getId()=9]`.

  Whether this is intentional (implicit_adrs[1] — catalog-as-public-
  metadata posture, symmetric to /api/lineage) or a security defect
  depends on the maintainer's stance. The asymmetry vs /api/dataentities
  is documented in the sidecar: /api/dataentities applies the
  EXCLUDE_FROM_SEARCH filter (per batch-T REFACTOR-425), /api/relationships
  does not. Specifically:
  (a) Cross-data-source visibility: a caller with policy/role grants
  over data_source_1 only nonetheless sees relationships from
  data_source_2 in list and detail payloads;
  (b) EXCLUDE_FROM_SEARCH bypass: a relationship-class data_entity
  flagged exclude_from_search=true (via operator HIDE OR corrupted
  ingestion) IS NEVERTHELESS RETURNED here;
  (c) DISABLED-mode anonymous reachability: full payload to any
  network-reachable caller.

  No test pins ANY of these — the no-auth invariant could be silently
  tightened OR silently loosened without detection. Operator surprise
  surface: an operator assuming the platform-wide EXCLUDE_FROM_SEARCH
  semantics also gate /api/relationships would be wrong.
