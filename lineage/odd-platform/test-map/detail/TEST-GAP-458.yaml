  - "TEST-GAP-455 (related: WAL replay loop)"
  - "TEST-GAP-456 (related: exception asymmetry)"
proposed_action: |-
  Unit test asserting that a NotificationSenderException from any sender produces (a) one log.error invocation with the receiver id, (b) ZERO DB writes to any audit / notification_delivery table (verify via Testcontainers query 'SELECT count(*) FROM pg_tables WHERE tablename LIKE notification_%' returns the existing publication/slot tables only), (c) ZERO Micrometer Counter increments (verify via SimpleMeterRegistry.getMetersAsString()). This LOCKS the current no-audit posture as the documented contract; promotes to a fix-required regression when audit/metric lands.
