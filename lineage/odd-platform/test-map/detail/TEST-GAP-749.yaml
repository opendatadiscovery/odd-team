proposed_action: |-
  Add `DataSourceServiceImplRegenerateTokenSplitStateTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/`. Four test methods:
  1. `regenerateDataSourceToken_serviceMethodLacksReactiveTransactional_pinsCurrentNonAtomicPosture` — use reflection or AST inspection to assert that `DataSourceServiceImpl.regenerateDataSourceToken` does NOT carry `@ReactiveTransactional`, while `create`, `update`, `delete` DO. PIN the architectural asymmetry.
  2. `regenerateDataSourceToken_dbWriteFails_responseCarriesUncommittedToken_pinsSplitState` — use Mockito to inject a failing `tokenRepository.updateToken` that throws after `tokenGenerator.regenerateToken` returns; assert the in-memory NEW TokenDto exists in the failed Mono pipeline; assert the DB row still holds the OLD token; assert the operator-side response bubbles a 500 with no clear remediation hint.
  3. `regenerateDataSourceToken_dbWriteFailsAndRetrySucceeds_eachAttemptGeneratesNewToken_breaksOperatorCapturedToken` — first call fails (DB blip), operator captures the NEW token from failed-response; second call succeeds (different NEW token persisted to DB); assert the operator's captured token is NOT the persisted one and therefore not usable.
  4. `regenerateDataSourceToken_oldTokenStillAuthenticatesAgainstIngestionFilterDuringSplitState_pinsCollectorStillWorks` — after failed rotation, send a POST to `/ingestion/datasources` with the OLD token; assert it authenticates successfully. Demonstrates that the destructive rotation's destruction is not actually destructive when split-state.

  Pair with a follow-up backlog item: add `@ReactiveTransactional` to the regenerate path. When the fix lands, tests #2-#4 invert: the response no longer leaks an uncommitted token; the OLD token is reliably dead after a successful rotation.
