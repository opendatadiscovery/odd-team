- id: H-013
  hypothesis: |
    The `image/png` SLA badge endpoint is safe to embed cross-origin (e.g. in a
    third-party BI tool's HTML) without leaking a dataset's SLA colour to an
    untrusted embedding page beyond what the viewer is already authorised to see.
  derivation: |
    Cross-pillar (BI-embed) + security seed: the doc encourages `<img src=...>`
    embedding; the controller sidecar's security block flags cross-origin
    embeddability with cookie-bearing auth as a potential leak.
  seed_source: cross-pillar + endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |
      Static analysis (per `DataQualityController.md`
      security.known_security_gaps[1]): the PNG endpoint sets no `@CrossOrigin`,
      no `Cache-Control: private`, no `X-Frame-Options` at the method/path level;
      under cookie-based auth (LOGIN_FORM with a session cookie), a malicious
      page that the victim visits while logged in could `<img
      src='{platform}/api/datasets/123/sla'>` and the browser would attach the
      auth cookie, returning the SLA colour for dataset 123 to the attacker's
      page (a cross-site read of the colour — not the full report, but the
      Red/Yellow/Green signal, which can itself be sensitive: "this finance
      dataset is failing"). Whether this actually leaks depends on the platform's
      deployed CORS config, the auth mode, and whether cookies are SameSite —
      none of which is determinable from the controller sidecar alone (the
      security config beans are not in this chain). This needs a measured run
      against a local instance to confirm whether the colour is readable
      cross-origin under a realistic cookie-auth deployment.
    evidence:
      - sidecar: odd-platform__java__DataQualityController__controller-class__DataQualityController.md
        section: security.known_security_gaps[1]
        cite: "DataQualityController.java:42-48 (no @CrossOrigin / no X-Frame-Options / no Cache-Control: private)"
        note: "PNG badge embeddable cross-origin; cookie-bearing read could leak the SLA colour to an embedding page"
    operator_visible_failure: |
      IF the probe confirms cross-origin readability under cookie auth: any web
      page a logged-in operator visits could silently read the SLA colour of any
      dataset id (badges are keyed by sequential data_entity_id, so an attacker
      can enumerate). For deployments where the colour is business-sensitive,
      this is a confidentiality leak; for deployments treating SLA as public,
      it is benign. The verdict requires a run because the outcome is
      auth-mode-and-CORS-config dependent.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: P-223
    routes_to_finding: validation-gap

