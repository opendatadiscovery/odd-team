proposed_action: |-
  Testcontainers integration test. (a) Create data entity X, term T. (b) Create row in data_entity_to_term with (X.id, T.id, is_description_link=TRUE) — simulating the description-mention auto-link. (c) DELETE /api/dataentities/X/terms/T.id. (d) Assert HTTP 204. (e) Query `SELECT count(*) FROM data_entity_to_term WHERE data_entity_id=X.id AND term_id=T.id AND is_description_link=TRUE` returns 1 (the description-link row is intact). (f) Test comment 'LOCKS the description-link protection contract — DELETE only removes manual links (is_description_link=FALSE), preserves description-mention auto-links. A regression that dropped the IS_DESCRIPTION_LINK.isFalse() filter would FAIL this test.'
