surfaced_by:
- ODDOAuth2Properties.md:docs_link_semantic.doc_drift_findings.[3] (`username-attribute`
  vs `userNameAttribute`)
- ODDOAuth2Properties.md:tests_coverage_semantic.uncovered_behaviours.[3]
behaviour: Spring relaxed binding for `auth.oauth2.client.{id}.username-attribute`
  (kebab single-word per live docs) silently fails to bind to POJO field `userNameAttribute`
  (camelCase split User+Name). Spring maps `username-attribute` → `usernameAttribute`
  (single word), NOT `userNameAttribute` — the correct kebab-form is `user-name-attribute`
  (kebab triple-word). Operator copy-paste-from-docs verbatim gets a silently-unbound
  field; whichever username claim defaults the OAuth2/OIDC client picks is used instead.
