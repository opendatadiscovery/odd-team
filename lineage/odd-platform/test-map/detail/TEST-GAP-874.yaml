behaviour: |-
  **MEDIUM — Cursor pagination at `(trunc(created_at, SECOND), id)` truncates BOTH sides of the comparator to second-precision but the ORDER BY sorts at microsecond-precision — producing a visual-order shuffle within a single second under sustained write rate.** `ReactiveActivityRepositoryImpl.java:287-288` constructs the cursor predicate `row(trunc(ACTIVITY.CREATED_AT, DatePart.SECOND), ACTIVITY.ID).lessThan(truncated, lastEventId)` where `truncated = lastEventDateTime.truncatedTo(ChronoUnit.SECONDS)`. The ORDER BY at line 291 is full-precision `ACTIVITY.CREATED_AT.desc(), ACTIVITY.ID.desc()`. **The asymmetry between comparator-precision (second) and sort-precision (microsecond)** means that within a single second-bucket containing multiple rows, pages may visit them in a different visual order — i.e. page 2's cursor predicate cannot disambiguate same-second rows, but the ORDER BY on the new page sorts them at microsecond precision. **This is NOT a row-skip bug** (the symmetric truncation guarantees no row is missed) — it is a visual-order anomaly under sustained write rate. The v0.2 sidecar previously claimed "skip rows"; the LSN-019 Stress Protocol correction (per coherence_notes.rule9_supersedes) re-classifies it as "stable result but shuffled visual order within a second bucket".

  **Primary-source chain**:
  - `ReactiveActivityRepositoryImpl.java:285-288` — composite cursor predicate
    ```
    row(trunc(ACTIVITY.CREATED_AT, DatePart.SECOND), ACTIVITY.ID)
      .lessThan(truncated, lastEventId)
    ```
    where `truncated = lastEventDateTime.truncatedTo(ChronoUnit.SECONDS)` (symmetric second-precision)
  - `ReactiveActivityRepositoryImpl.java:290-291` — `orderBy(ACTIVITY.CREATED_AT.desc(), ACTIVITY.ID.desc())` (full microsecond-precision)
  - `ReactiveActivityRepositoryImpl.java:292` — `.limit(size)` with no upper bound (per Controller's STRESS_A1)
  - V0_0_48__add_activity.sql:9 — `created_at timestamp without time zone` (microsecond precision)
  - V0_0_48__add_activity.sql:15 — `activity_created_at_idx` index on column (NOT a functional index on `trunc(...)`)

  **The mechanism** (per ReactiveActivityRepositoryImpl.md:stress_findings.C2, expanded):
  - Page 1 ORDER BY: rows sorted by (microsecond DESC, id DESC) → returns N rows
  - Page 1's last row has timestamp μ_L and id L
  - Cursor passed back: `(truncated_to_second(μ_L), L)`
  - Page 2 cursor predicate: `(trunc_second(col), id) < (truncated_to_second(μ_L), L)`
  - This includes rows in the same second-bucket as μ_L with `id < L`
  - BUT it ALSO includes rows in the same second-bucket whose microsecond > μ_L IF their id < L
  - Page 2's ORDER BY re-sorts those by microsecond DESC
  - Result: page 2 may surface rows whose timestamp is microseconds BEFORE page 1's cursor-anchor (which the operator considers "older than" the cursor) but whose id is older

  **The CLIENT-visible effect**:
  - For a static activity table (no concurrent writes): cursor is deterministic; correct end-to-end
  - For a steadily-written table at >1 event/sec: pages may show rows in an order operators don't expect; the row-set is COMPLETE (no skips) but the visual ordering within a second-bucket varies across page boundaries

  **Operator-visible consequences**:
  - **UI confusion**: a user paging through "newest activity" at high write rate sees pages where adjacent timestamps within the same second appear in inconsistent order across page boundaries
  - **Forensic inconsistency**: an investigator paginating to find "the third event of the second" cannot rely on the cursor producing the same ordering across pages
  - **Test/observability**: integration tests that assert "event X appears on page N" become flaky under load

  **Why MEDIUM not HIGH (and CORRECTED from v0.2 severity)**:
  - The v0.2 sidecar rated this MEDIUM as a "skip rows" bug; the Stress Protocol corrects to "no skips, shuffled visual order"
  - Sidecar elevates to current LOW severity in `bugs_limitations_corner_cases.[4]`
  - **We rate MEDIUM (between LOW and HIGH)** because: (a) the cursor's truthful behaviour matters for UI predictability and forensic accuracy; (b) the asymmetry (comparator vs ORDER BY precision) is a deliberate design choice per `implicit_adrs.[1]` — but undocumented; (c) a future refactor that switches the comparator to microsecond-precision (eliminating the truncation) would change visible behaviour silently.

  **Connection to probe P-021**:
  - The sidecar emits P-021 to PIN the empirical behaviour under high write rate
  - This TEST-GAP is the regression-pin AFTER P-021 confirms the timing semantics

  **Connection to TEST-GAP-084**:
  - TEST-GAP-084 (existing) pins cursor boundary handling at result-set boundaries (the typo `lasEventId` + general correctness)
  - This gap (874) pins the SECOND-PRECISION asymmetry specifically — the deeper structural mechanism
  - Together they fully characterise the cursor surface
