notes: |-
  Cross-link to canonicalisation-candidate `substring-match-admin-escalation-ldap-containsignorecase`
  (now superseded as factually wrong): `OperationUtils.containsIgnoreCase` is
  full-string `equalsIgnoreCase`, NOT substring. So `admin-principals: [alice]`
  matches user `alice`, `ALICE`, `Alice` — but NOT `alice2` or `alicia`. This
  invariant is about the BYPASS ORDERING (admin-principals beats org-name),
  NOT about substring matching.

  Operator mitigation today: do NOT use `admin-principals` if you want
  organization-name to be a strict gate. Use `admin-groups` (Cognito/GitHub
  only — silently no-op for Google per sibling invariant
  `admin-groups-silent-no-op-asymmetric-provider-support`) which IS scoped
  by organization-name (team must belong to organizationName) — GitHub-only
  semantic at `GithubUserHandler.java:114-119`.

  Doc-side follow-up DOC-NNN candidate: live OAuth2/OIDC page should add an
  ADMONITION block on the GitHub config example noting
  "admin-principals BYPASSES organization-name — use admin-groups for
  organization-scoped admin assignment".
