- id: H-010
  hypothesis: |-
    When a user removes an entity from a DEG by clicking the X chip, and later wants it back,
    the restore behaves the same regardless of whether the original removal was a user click or an
    ingestion-deletion cascade.
  derivation: |-
    Negative-space durability symmetry: user DELETE is a HARD delete; the cascade is a soft delete with
    a restore path (hard_delete_vs_soft_delete_cascade_semantic_gap).
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The two removals have DIFFERENT durability. User-initiated DELETE HARD-deletes the row
      (deleteRelationsReturning → DSL.deleteFrom, ReactiveGroupEntityRelationRepositoryImpl.java:57-65) — the
      row is gone, so a later entity-restore has nothing to resurrect; the membership stays permanently
      removed and must be manually re-added. The ingestion-deletion cascade SOFT-deletes (:92-101), and
      restoreRelationsForDataEntities (:104-112) resurrects those memberships on entity restore. Same
      operator-visible action ("entity removed from group"), different durability — and (forensic silence,
      H-005) no audit trail records which kind of removal happened. (Already tracked: PLT-024 / DOC-188 cascade
      admonition.)
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__deleteDataEntityFromDataEntityGroup.md
        section: concepts.invariants[5] (HARD vs soft) + understanding
        cite: "ReactiveGroupEntityRelationRepositoryImpl.java:57-65 (HARD) vs :92-112 (soft + restore)"
        note: "user DELETE hard-deletes; cascade soft-deletes + restorable; different durability."
    operator_visible_failure: |-
      (1) An operator who removes an entity from a DEG by hand and later restores a (separately) deleted
      entity is surprised that cascade-removed memberships come back but hand-removed ones do not — the same
      "removed from group" action behaves differently depending on an invisible distinction. (2) There is no
      "restore my removed memberships" affordance for user-initiated removals. (3) The asymmetry interacts
      with H-009: a hand-DELETE leaves no row (re-add works cleanly), but a cascade-soft-delete leaves a row
