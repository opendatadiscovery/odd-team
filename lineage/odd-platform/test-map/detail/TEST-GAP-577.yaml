behaviour: |-
  No batch-size or rate-limit on getByName / getDto. The single-row dto reads materialise into Mono<RoleDto> with a Set<PolicyPojo> attached. For a role bound to N policies, the result holds N PolicyPojos in memory — typical role: 1-10 policies, ~500 bytes each; pathological role: thousands of policies, multi-MB result. No defensive bound is enforced.
