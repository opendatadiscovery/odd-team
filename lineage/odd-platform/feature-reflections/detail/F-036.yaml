# Owner-Relationship Title Directory — product-owner reflection

## product_owner_narrative

The **Title directory** is the platform's vocabulary of *owner-relationship labels* — the short strings such as "Data Steward", "DBA", "Maintainer", "Reviewer" that an operator attaches when they grant a person (an Owner) ownership of a Data Entity or a Term (per `TitleController.md:understanding` + `OwnershipServiceImpl.md:invariants[2]`). It is not a feature an operator navigates *to*: there is no "Titles" tab in Management (the UI walk in `feature-flow F-036:ui_review_2026_05_26` confirms `ManagementTabs.tsx:19-50` enumerates 9 tabs and none is Titles), no create/edit/delete screen, and no curation surface. The directory exists only at the two seams where a user touches a title string: the **ownership-grant form** (where they pick or type one) and the **Data Quality runs filter** (where they filter test runs by an owner's title).

A user interacts with it in three concrete ways (per `TitleController.md:audiences` + `:upstream_callers`). First, on a Data Entity or Term detail page, the **Owners section** opens an ownership form whose `OwnerTitleAutocomplete` control fetches `GET /api/titles?page=1&size=30&query=<typed>` on focus and on each 500ms-debounced keystroke, presenting matching titles in a dropdown that also accepts a brand-new free-text value (MUI `freeSolo`, `OwnerTitleAutocomplete.tsx:43-48,149`). Second, on the `/data-quality/runs` page, the **TitleFilter** populates `titleIds` / `deTitleIds` query parameters from the same `GET /api/titles` list to scope the runs table. Third, any authenticated API client can paginate the directory directly via `GET /api/titles`.

The working parts are deliberately thin (per `TitleController.md:concepts.invariants` + `:stress_findings`). The read endpoint returns titles filtered by a **case-insensitive substring** on `name`, ordered by **`id` ASC (insertion order)** — not alphabetical, not by usage, not by relevance — with **no server-side cap on `size`** and no validation of `page`. The write path is *implicit*: there is no write endpoint on `TitleController` at all. A title row is created only as a **side effect** of `OwnershipServiceImpl.create/update`, which calls `titleService.getOrCreate(formData.getTitleName())` and silently inserts the typed string when no exact-byte match exists (`OwnershipServiceImpl.md:invariants[2]` + `TitleServiceImpl.java:19-22`). There is no `TITLE_CREATE` permission anywhere in the codebase (grep returns zero matches, per `REFACTOR-206`), no allowlist, no `@Pattern`/`@Size`, and no normalisation (case-fold, trim, dedupe).

The integration story is what makes this feature load-bearing rather than cosmetic (per `system-mission.md` P-09 + the live Policies doc + `REFACTOR-624`). The Title is consumed by the **authorization model**: Policy conditions `dataEntity:owner:title == 'X'` and `term:owner:title == 'X'` gate access by an owner's title, matched as case-sensitive string equality. So the same free-text string that one user types into a label autocomplete becomes the vocabulary another operator references in a security Policy — a label-entry surface feeding an authorization surface, with no schema, no curation, and (until recently) no documentation joining the two. The feature also feeds Discovery (the FTS vector refresh on ownership write) and the Activity Feed (the `OWNERSHIP_*` events on the *parent* grant only).

In a demo a product owner would highlight the edge cases that bite operators (per `REFACTOR-624` + `TitleController.md:performance` + `:stress_findings.resource_boundaries`): a directory that grows monotonically and never tombstones in production (the soft-delete machinery is provisioned but has no caller); an autocomplete that, once the directory exceeds 30 rows, makes the 31st-oldest-and-later titles invisible regardless of relevance to what the user typed (the 30-row id-ASC server window clips before the client-side MUI filter ever sees them); and a concurrent-grant race on a brand-new title name that surfaces to one of the two users as a hard HTTP 400 with no explanation of why their ownership grant failed.

## hypotheses

- id: H-001
  hypothesis: "When a user types a substring into the title autocomplete on an ownership form, the dropdown shows every existing title whose name contains that substring, case-insensitively."
  derivation: "GET /api/titles `query` parameter (SearchParam, 'Search text') + the case-insensitive containment filter in the inherited CRUD list."
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      `query` flows to `ReactiveAbstractCRUDRepository.listCondition` which emits
      `nameField.containsIgnoreCase(nameQuery)` → `LOWER(name) LIKE LOWER('%query%')`.
      Empty/null query returns all non-deleted titles. Substring containment, not
      prefix-match, not FTS. The match is honoured for what is fetched from the
      server — see H-008 for the window-clipping caveat that limits which rows are
      eligible to match in the first place.
    evidence:
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: stress_findings.request_inputs[query]
        cite: "ReactiveAbstractCRUDRepository.java:240-249"
        note: "containsIgnoreCase on the name column; isNotEmpty guard returns all on empty query"
    severity: null
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

- id: H-002
  hypothesis: "When a user opens the title autocomplete, the dropdown shows the most relevant or most commonly-used titles first."
  derivation: "Negative-space: a user picking a label from a long list reasonably expects the list ordered by usefulness (relevance to typed text, or popularity), the way most autocompletes behave platform-wide."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The list is ordered by `id ASC` (insertion / chronological order), hardcoded
      in the generic CRUD paginate-wrapper — not by relevance, not alphabetical, not
      by usage count. The OLDEST titles appear first. The client-side MUI
      createFilterOptions then re-filters within the fetched window but does NOT
      re-sort by relevance. A user typing "steward" who has 40 titles in the
      directory may not see the cleanly-spelled "Data Steward" at all if it was
      created after the 30 oldest rows (see H-008), and will see oldest-matching
      first among those that do appear.
    evidence:
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: stress_findings.orderings
        cite: "ReactiveAbstractCRUDRepository.java:90-91 + JooqQueryHelper.paginate:63-80"
        note: "OrderByField(idField, SortOrder.ASC) hardcoded; id is bigserial PK = insertion order"
      - sidecar: odd-platform__java__TitleController__controller-class__TitleController.md
        section: stress_findings.orderings
        cite: "OwnerTitleAutocomplete.tsx:38-89"
        note: "MUI createFilterOptions re-filters but does not re-rank by relevance"
    operator_visible_failure: |
      For a deployment with a small directory (the common case, tens of rows) the
      effect is mild: the dropdown is unsorted-by-relevance but everything fits.
      For a directory grown past 30 rows the failure is acute — clean entries
      created recently are pushed out of the fetched window entirely (H-008), so
      typing the exact title returns nothing and the user re-types it as free text,
      minting yet another duplicate (compounding H-004/H-005). Even within the
      window, an operator scanning for the right label scrolls past historical
      typos and language variants before reaching the canonical one.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

