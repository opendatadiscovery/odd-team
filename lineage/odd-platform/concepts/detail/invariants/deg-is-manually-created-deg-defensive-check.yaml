name: DEG isManuallyCreatedDEG defensive check (intent-anchored)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-10
description: |-
  **NEW INVARIANT, batch 2026-05-19L** — primary-source confirmed at
  `DataEntityServiceImpl.java:483-486`. The `isManuallyCreatedDEG` predicate
  is a 4-line defensive check that gates EVERY DEG-membership write:

      private boolean isManuallyCreatedDEG(final DataEntityPojo pojo) {
          return pojo.getManuallyCreated()
              && contains(pojo.getEntityClassIds(), DATA_ENTITY_GROUP.getId());
      }

  The predicate filters the target DEG pojo on BOTH conditions:
    1. `manuallyCreated = true` — the DEG was created via the UI's
       `POST /api/dataentitygroups` (gated by `DATA_ENTITY_GROUP_CREATE`),
       NOT via the ingestion pipeline.
    2. The pojo's `entityClassIds` contains the `DATA_ENTITY_GROUP` class
       id (8 per `DataEntityClassDto.java:50`) — the entity is a DEG (or
       Domain / ML Experiment / DAG / DATABASE_SERVICE / API_SERVICE /
       KAFKA_SERVICE — the subtypes that share the DATA_ENTITY_GROUP class).

  **Both call sites** in DataEntityServiceImpl use the predicate symmetrically:
    - `addDataEntityToDEG` line 394: rejects if predicate is false
    - `deleteDataEntityFromDEG` line 417: same rejection shape

  The shared predicate is the DRY anchor for "the legal-target set for
  DEG-membership operations is identical for both write directions". A
  future maintainer wanting to relax (e.g. allow ingested DEGs to receive
  manual membership writes) changes one line; the constraint is also
  visible at the API contract level (OpenAPI description at
  `openapi.yaml:1073`: "Adds data entity to manually created data entity
  group").

  **The architectural intent** (the implicit ADR — `addDataEntityToDEG`
  implicit_adrs.[0]): DEGs are a HEAVIER primitive than tags, owners,
  titles — they carry their own metadata, owners, tags, terms; they are
  visible on the Catalog Overview's Domains tile; they participate in
  Group lineage. Creating one accidentally as a SIDE EFFECT of another
  endpoint (the REFACTOR-199 / REFACTOR-206 / REFACTOR-227 family of
  side-doors — Owner / Title / Tag auto-create-on-miss) would be more
  damaging than auto-creating a Tag or Owner row. The architectural
  decision encodes:

    "DEGs are first-class data entities with their own permission gate
    (DATA_ENTITY_GROUP_CREATE); membership writes never substitute for
    DEG creation."

  **This DIVERGES from the REFACTOR-199 / REFACTOR-206 family**:
  Owner auto-create (`getOrCreate(owner_name)`), Title auto-create
  (`getOrCreate(title_name)`), Tag auto-create
  (`getOrCreateTagsByName(...)`), Namespace auto-create
  (`namespaceService.getOrCreate(name)`) — all of which silently mint
  directory rows from per-resource permissions. The DEG path is
  structurally PROTECTED by the up-front predicate. The predicate is the
  positive case of "do not side-door past the create-permission" —
  literally the inverse of the structural enabler that the
  REFACTOR-199 family invariant captures.

  **Why this is itself a load-bearing intent statement** (not just an
  implementation detail): the predicate's existence + its DUAL gating
  (both ADD and DELETE check it) + the OpenAPI description naming the
  constraint together encode a maintainer-explicit boundary. Future
  refactors must preserve the boundary or explicitly REJECT it. The
  invariant exists to make that boundary documented + grep-able.

  **The error-message ambiguity is the only documented weakness**: the
  predicate's failure throws
  `BadUserRequestException("Entity with id %s is not manually created
  DEG")`, which conflates three failure modes:
    (a) the DEG id doesn't exist (no row in `data_entity`)
    (b) the entity at that id is not manually-created (e.g. ingested DEG,
        regular dataset, or a deleted entity)
    (c) the entity at that id has no `DATA_ENTITY_GROUP` class
  Operators receiving this error cannot distinguish "DEG was deleted"
  from "I pointed at the wrong entity". 404 for case (a) and 400 for
  cases (b)+(c) would be more semantic.

  **Pairs with**: the write-collaborative DEG invariant. The DEG-side
  AUTHORIZATION may be missing (any caller with child-side
  DATA_ENTITY_ADD_TO_GROUP can write into any DEG), but DEG-side
  VALIDITY is strictly enforced (the target must be a manually-created
  DEG). The defensive predicate is the structural answer to "what
  prevents ingestion-created DEGs from being rewritten by UI callers" —
  the answer is that they're filtered at the gate, even if they're
  reachable.
