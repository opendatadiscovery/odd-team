proposed_action: |-
  Testcontainers integration test. (a) Seed two live datasources: `(name='snowflake-prod', oddrn='//snowflake/prod', collector_id=C1)` and `(name='redshift-prod', oddrn='//redshift/prod', collector_id=C1)`. (b) Issue a collector-driven `POST /ingestion/datasources` payload that includes (i) ODDRN `//snowflake/prod` renamed to `name=redshift-prod` (the colliding name), (ii) a NEW ODDRN `//mysql/prod` to be CREATED. (c) Assert: the response is HTTP 500 with a `UniqueConstraintException`-rooted body. (d) Verify both datasources unchanged: `snowflake-prod` still has its original name; `mysql/prod` was NOT created (the bulkCreate rolled back). (e) Pin the silent-rollback regression: a future REFACTOR that introduces per-row error handling (the F-008 drift facet enumerates this) would flip this test to expect the `mysql/prod` insert to succeed.
