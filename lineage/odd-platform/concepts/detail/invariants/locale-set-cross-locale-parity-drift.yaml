notes: |-
  Coherence (Rule 6): grepped `concepts/detail/invariants/` for
  "locale" + "parity" + "drift" — no existing concept covers the
  file-size-drift across the six locale bundles. The closest is
  `entitie:locale-bundle` (the entity definition; the invariant
  evidence for cross-locale parity drift is new in batch ZJ).

  This invariant is the file-size-and-content sibling of the
  `i18n-missing-key-drift-silent-fallback-natural-keys-contract`
  invariant — the latter covers keys missing in ALL SIX locales
  (code references but no locale has); this invariant covers keys
  missing in 5 of 6 (en has but others don't). Both share the
  same root cause (no automation enforces cross-locale parity);
  the user-visible symptoms differ.
