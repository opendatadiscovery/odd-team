proposed_action: |-
  Testcontainers integration test (pinning the bug, not the fix). (a) Seed three live datasources: `['snowflake-prod', 'my-snowflake-dev', 'redshift-prod']`. (b) Call `dataSourceRepository.listDto(page=1, size=10, nameQuery='snow')`. (c) Assert `page.data.size() == 1` (only 'snowflake-prod' STARTS WITH 'snow'). (d) Assert `page.total == 2` (both 'snowflake-prod' and 'my-snowflake-dev' CONTAIN 'snow'). (e) Assert `page.hasNext == false` (1 page is enough for total=2, size=10). (f) Add a `// REGRESSION-PIN — this test asserts the CURRENT BUGGY behaviour. REFACTOR-425 will align the predicates; flip this test to assert the chosen direction (page == total — either both 'contains' or both 'starts-with').` comment block. (g) Also pin the regression-direction for the equivalent query mode where startsWithIgnoreCase is used in BOTH branches (the desired fix shape).
