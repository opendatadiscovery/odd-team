proposed_action: |-
  Add `TagDeleteSoftDeleteSemanticsTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `deleteTag_returns204_andSoftDeletesTagRow_pinsSoftDeleteInvariant` — seed a tag; `DELETE /api/tags/{id}`; assert HTTP 204; then raw DB `SELECT deleted_at FROM tag WHERE id = ?` returns a non-null timestamp (the row PHYSICALLY EXISTS — soft delete, not hard delete).
  2. `deleteTag_nonExistentId_returns404` — `DELETE /api/tags/{nonexistent}`; assert 404.
  3. `deleteTag_replayAfterSuccessfulDelete_returns404NotIdempotent` — `DELETE` a tag twice; assert first call 204, second call 404 (idempotent in effect, not in status code).
  4. `deleteTag_hardDeletesTagToTermAndTagToDataEntityRows` — seed a tag with term + data-entity relations; `DELETE`; raw DB SELECT confirms `tag_to_term` and `tag_to_data_entity` rows are GONE (hard-deleted), while the `tag` row is soft-deleted.

  Pair with TEST-GAP-762 (cascade asymmetry — tag_to_dataset_field orphans) for the complete delete-path picture.
