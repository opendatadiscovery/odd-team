notes: |-
  Minted from ui-review-2026-05-26 slice H. The CRITICAL operator-mental-
  model finding: the Associations UI shows THREE surfaces (Active /
  Pending / History) that all consume the owner_association_request
  domain, but the "+ Create association" affordance writes DIRECTLY to
  user_owner_mapping via a separate controller. This breaks the
  operator's assumption that "everything I do in this UI shows up in
  History."

  Branch labelling (for cross-feature coherence):
  - Branch A (F-075) — user self-requests, admin approves via F-171
  - Branch B (F-075) — DIRECT_OWNER_SYNC permission auto-approves
  - Branch C (F-172) — admin directly binds via "+ Create association",
    NO request row created, NO triage step, NO History entry (if
    audit silence is confirmed)

  Defer to backend Read pass for: the controller class, the audit
  emission behaviour (the highest-leverage drift), and the rq cache
  invalidation surface around isSuccess.

  REFLECTION UPDATE (feature-reflector/0.3.0, 2026-06-03): the deferred
  backend Read pass is DONE. The slice-H assumption "writes DIRECTLY to
  user_owner_mapping via a SEPARATE controller … NO History entry" is
  CONTRADICTED. The endpoint is POST /api/owners/mapping on the SAME
  OwnerAssociationRequestController; createUserOwnerMapping writes a
  status=APPROVED owner_association_request row + a REQUEST_MANUALLY_APPROVED
  activity row, so the bind IS in the History tab. The operator-mental-model
  break the note describes does NOT exist at the audit layer. The live doc
  now documents all three write-paths. See feature-reflections/detail/F-172.yaml
  (H-003, H-008) and the reflection_supersedes blocks on the facets above.
  Net-new finding that DOES survive: the orphan-binding hazard on an
  unvalidated oidcUsername (H-005 -> PLT-024).
