behaviour: |-
  **MEDIUM — the URL→atom mount-sync effect at `DataQualityFilters.tsx:31-39` does `JSON.parse(value)` on each query-param value with NO try/catch. A user who hand-edits or shares a malformed URL like `/data-quality?namespaceIds=foo` (not valid JSON) causes `JSON.parse` to THROW inside the React effect; React surfaces this as an UNCAUGHT render-time error and the dashboard fails to render. Additionally there is NO schema validation on the parsed shape — a param parsed to a non-array, or to an object missing `id`, flows straight into `formFiltersAtom` and may cause downstream renders to malfunction.**

  **The mount-sync effect** (`DataQualityFilters.tsx:28-43`):
  ```
  useEffect(() => {
    const newFilters = { ...formFilters };
    for (const [key, value] of searchParams) {
      if (key in newFilters) {
        newFilters[key] = JSON.parse(value);  // UNGUARDED
      }
    }
    setFormFilters(newFilters);
  }, [searchParams]);
  ```

  **Three failure scenarios**:
  1. **Malformed JSON**: `?namespaceIds=foo` → `JSON.parse('foo')` throws SyntaxError → effect crashes → React surfaces uncaught error → dashboard fails to render.
  2. **Wrong shape (string not array)**: `?namespaceIds="hello"` → parses to `"hello"` → `formFiltersAtom.namespaceIds = "hello"` → derived `filtersAtom`'s `value.map(({id}) => id)` (`DataQualityStore.ts:37`) throws TypeError because string has no `.map` callback expecting `{id}`.
  3. **Wrong shape (objects missing `id`)**: `?namespaceIds=[{}]` → parses to `[{}]` → `filtersAtom` projects to `[undefined]` → backend receives `namespaceIds=` with no value or with `undefined` → backend may 400, may silently return unfiltered, may crash.

  **What the operator sees**: depending on the malformation, EITHER the dashboard blanks (scenario 1 uncaught throw) OR renders but filters return wrong results (scenarios 2-3). All three are operator-confusing; none surfaces a friendly error message.

  **Why this is operator-visible despite low base severity**: shared URLs are a primary use case (TEST-GAP-913 pins the happy-path round-trip). When the SHARED URL is broken (clipboard truncation, manual edit, link-shortener mangling, character-encoding double-decoding), the receiving operator sees a blank dashboard with no signal what happened. Sidecar self-rates LOW (`bugs_limitations_corner_cases.[5]`) — bumped to MEDIUM because the failure mode is operator-facing and discoverable through normal usage (paste a URL from a chat client that escaped a character wrong → dashboard blanks).

  **No test pins this**.

  **Test gap shape**: three negative-path unit/integration tests covering each of the three malformation scenarios above. Each test mounts at the bad URL; asserts EITHER (a) the dashboard renders gracefully with a "URL filter could not be parsed" message (PROPOSED behaviour) OR (b) the dashboard surfaces a friendly error and clears the malformed filter, retaining a clean atom. Today both fail; pair the test with a FIX-REQUIRED note.
