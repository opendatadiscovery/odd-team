- batch: ui-review-2026-05-26
  entry_point_added: |-
    ui-component cluster — Directory/Directory/Directory.tsx (level 1
    grid) + DataSourceList.tsx (level 2 list) + Entities.tsx (level 3+4
    surface) + EntitiesList.tsx + EntityItem.tsx + EntitiesTabs.tsx +
    TableHeader.tsx + DirectoryBreadCrumbs.tsx + DirectoryItem.tsx. The
    UI realisation of all 4 levels of the F-023 drill-down. Previously
    only the level-1 ROOT component (Directory.tsx) was anchored at hop
    UI-1 (via batch ZA). The level 2/3/4 UI components are the
    operator-observable rendering of each subsequent level's API
    response.
  contributing_nodes_added:
    - odd-platform ts react-component:Directory_level2_DataSourceList
    - odd-platform ts react-component:Entities_level34
    - odd-platform ts react-component:EntitiesList
    - odd-platform ts react-component:EntityItem
    - odd-platform ts react-component:EntitiesTabs
    - odd-platform ts react-component:TableHeader (Directory-side)
    - odd-platform ts react-component:DirectoryBreadCrumbs
    - odd-platform ts react-component:DirectoryItem (Directory-side, level-1 card)
  notes: |-
    UI-review-2026-05-26 walks the level 2/3/4 React components.
    Findings:

    (A) LEVEL-2 — DataSourceList.tsx (128 LOC). The `transformToHeaderCells`
    function (line 38-60) DYNAMICALLY derives the table column set from
    the FIRST response's `properties` object — meaning EVERY @PathField-
    annotated property leaks visually into the table header.
    PostgreSQL renders {host, database, port, entitiesCount}; Snowflake
    renders {account, warehouse, entitiesCount}; Kafka adds
    {cluster, topic}. NO redaction step at the UI tier; the
    `oddrn_reflection_infrastructure_property_leak` facet from F-023
    batch T is now CONFIRMED at the UI rendering tier — the leaked
    properties become COLUMNS in a table the operator browses. The
    table column order is also data-dependent (uniq of all keys) — UX
    consequence: two deployments with different first-row data show
    column orders that differ.

    (B) LEVEL-3 — EntitiesTabs.tsx (44 LOC). Tab list is composed of:
    one hardcoded "All" tab pointing to `directoryDataSourcePath(prefix,
    dsId, 'all')` (line 23-27) + dynamic per-type tabs (line 17-21). The
    `'all'` literal is the load-bearing magic string flagged by F-023
    batch ZI note (2). EntitiesTabs.tsx:45 sets `handleTabChange={() => {}}`
    — empty handler — meaning tab CLICKS rely on the `<AppTabs>`
    component's internal navigation via the `link` field, NOT a state
    update. The synchronisation between selectedTab state (line 14, 33-37)
    and the URL is one-way (URL drives selectedTab on mount + URL change,
    but tab clicks navigate via Link). A regression in AppTabs that
    triggers handleTabChange before the Link fires would leave the SPA
    in an inconsistent state.

    (C) LEVEL-4 — Entities.tsx + EntitiesList.tsx + EntityItem.tsx. The
    EntitiesList uses `react-infinite-scroll-component` (EntitiesList.tsx:46-56)
    with `size: 30` per page (Entities.tsx:38). The page-vs-count drift
    flagged by F-023 facet `page_vs_count_predicate_divergence_directory_level_4`
    surfaces at the UI as `total` (Entities.tsx:50-53) read from
    `entitiesResponse.pages[0].entities.pageInfo.total` AND the
    `entities.length` derived from `flatMap(page => page.entities.items)`
    (line 55). If the backend page query returns MORE rows than the
    count claims, `total` displays X but the infinite-scroll loads X+N
    rows — operator sees "30 entities" header but scrolls past 35
    entries. The `isContentEmpty={!total}` prop (line 85) hides the
    EmptyContentPlaceholder when `total > 0` — but if `total = 0`
    while `entities.length > 0` (the page-vs-count divergence direction),
    the operator sees both the empty placeholder AND populated rows.

    (D) ENTITYITEM CLICK-TARGET — EntityItem.tsx:44
    (`<Link to={dataEntityDetailsPath(id)}>`). Same path as F-001 hop-1
    inflation-loop closure point. Clicking ANY Directory level-4 entity
    fires the F-001 inflation loop: +2 view_count per click. The
    Directory becomes ANOTHER UI-tier surface that closes the F-001
    inflation loop — IN ADDITION TO the home-page Popular-strip closure
    already documented. Operators using Directory to browse the catalog
    are simultaneously inflating view_count on every entity they open.

    (E) TYPE COLUMN VISIBILITY — TableHeader.tsx:22 + EntityItem.tsx:81.
    The "Type" column is HIDDEN when `typeId` is set (a specific entity
    type is selected) and SHOWN when `typeId` is undefined (the "All"
    tab). Conditional column rendering means the table layout DIFFERS
    between tabs without a width-stable affordance — Web-Vitals CLS
    shift on tab change.

    (F) DIRECTORY BREADCRUMBS — DirectoryBreadCrumbs.tsx:13-23. Three-
    level breadcrumb (`directory / {prefix} / {dataSourceId}`). NO
    breadcrumb for the level-4 type filter — once the user is on the
    "Postgres" tab, the URL is `/directory/postgresql/123/45` but the
    breadcrumb reads only `Directories > PostgreSQL > {dsName}`. The
    operator cannot navigate "back" to the All-types view via
    breadcrumb — has to click the All tab. Minor UX gap.

    (G) ROUTE-PARAM NAN GUARD — F-023 batch ZI note (3) already
    surfaced `useDirectoryRouteParams` lacks isNaN guard on
    `parseInt(dataSourceId)`. The six consumers (DataSourceList.tsx:27,
    Entities.tsx:20, DirectoryBreadCrumbs.tsx:13, EntitiesTabs.tsx:13,
    EntityItem.tsx:40, TableHeader.tsx:13) are now CONFIRMED via
    direct read — all six call `useDirectoryRouteParams()` and use
    the returned values WITHOUT guarding. Deep-link with malformed
    dataSourceId yields NaN propagation across the entire level-3/4
    UI surface.

    (H) DIRECTORYITEM HIDDEN BRAND DATA — DirectoryItem.tsx:16
    (`<Link to={prefix}>`). The level-1 card link is RELATIVE — on
    `/directory` this resolves to `/directory/{prefix}` (correct
    drilldown). The Overview-side mini Directory at
    `Overview/Directory/DirectoryItem.tsx` uses the SAME relative link
    pattern from `/` — yielding `/{prefix}` which is OFF-ROUTE (see
    F-141 hop 3c). Two implementations of the same component name
    diverge in semantics depending on the parent route.

    ui_route:/directory/* — URL-shape contract module
    `routes/directoryRoutes.ts` (63 lines) exporting `directoryPath()`,
    `directoryDataSourcePath(prefix, dsId?, typeId?)`, and
    `useDirectoryRouteParams()` (typed wrapper around `useParams` that
    coerces `dataSourceId` string→number and translates literal `'all'`
    segment to `undefined typeId`). Mounted at `App.tsx:72` as
    `<Route path={`${directoryPath()}/*`} element={<DirectoryRoutes />}>`
    — BARE, NO `WithPermissionsProvider` wrapping (contrast
    `lookupTablesPath` at App.tsx:75-88 which IS wrapped). Global
    toolbar Directory tab at `ToolbarTabs.tsx:42` deep-links via
    `directoryPath()` for every authenticated session, unconditional
    render. Inner subtree at `Directory/DirectoryRoutes.tsx:11-17`
    declares four routes including the level-3 Navigate fallback
    `<Navigate to='all' replace />`. hop-0 UI entry-point covering all
    four documented levels (level 1 `/directory`, level 2 `/directory/{prefix}`,
    level 3 `/directory/{prefix}/{dsId}/all`, level 4
    `/directory/{prefix}/{dsId}/{typeId}`).
  contributing_nodes_added:
  - odd-platform ts routes route:directory
  notes: |-
    The route module sidecar (session-2026-05-26-ZI) corroborates F-023's
    existing cross-owner-datasource-inventory-enumeration posture from
    the UI direction PLUS surfaces THREE novel UI-layer findings:

    (1) F-023 ENTIRE CROSS-OWNER + DISABLED-MODE POSTURE REAFFIRMED AT
    UI ROUTE TIER (HIGH, refinement). All 4 levels of the Directory
    are reachable by every authenticated user (and by every caller
    under `auth.type=DISABLED`). The route declaration imposes NO
    permission gate; the toolbar tab is unconditional; even if
    `WithPermissionsProvider` were applied, the ZH systemic finding
    establishes it is NON-BLOCKING (`WithPermissionsProvider.tsx:12-49`
    — all three render branches unconditionally render the child).
    The full picture: bare frontend route + ALSO unconditional toolbar
    tab + non-blocking wrapper class + zero-`@PreAuthorize` backend +
    cross-owner read posture + ODDRN-property reflection leak.
    STRENGTHENS F-023's existing
    `cross_owner_datasource_inventory_enumeration` +
    `disabled_mode_anonymous_reach_directory` +
    `oddrn_reflection_infrastructure_property_leak` facets with
    UI-layer primary-source confirmation. The chain is unguarded
    end-to-end at every layer.

    (2) NEW UI-TIER DRIFT FACET — `'all'` LITERAL IS A LOAD-BEARING
    MAGIC STRING ACROSS THREE FILES WITH NO NAMED CONSTANT UNITING
    THEM (LOW, structural fragility). The `'all'` sentinel meaning
    "no type filter; show all entity types" lives in THREE coordinated
    locations: (a) the hook coercion at `directoryRoutes.ts:34`
    (`typeId === 'all' ? undefined : parseInt(typeId, 10)`); (b) the
    inner Routes Navigate target at `Directory/DirectoryRoutes.tsx:16`
    (`<Navigate to='all' replace />`); (c) the EntitiesTabs builder
    call at `EntitiesTabs.tsx:26`
    (`directoryDataSourcePath(prefix, dsId, 'all')`). Renaming `'all'`
    to e.g. `'any'` in one location without the others silently
    desynchronises navigation; TableHeader.tsx:22 would not render
    the Type column on the 'All' tab even when intended. Same shape
    as the alerts `<Route path='all|my|dependents'>` re-hardcoding
    finding from the alerts sidecar. NEW DRIFT FACET candidate:
    `directory_all_literal_load_bearing_magic_string_three_files_no_named_constant`.

    (3) NEW UI-TIER DRIFT FACET — `parseInt(dataSourceId, 10)` NO `isNaN`
    GUARD; NaN PROPAGATES TO 6 CONSUMERS (LOW, defensive-coding gap).
    `useDirectoryRouteParams` at line 37 calls
    `parseInt(dataSourceId, 10)` with no isNaN check. A deep-link to
    `/directory/postgresql/abc/all` produces `dataSourceId: NaN`;
    consumers `DataSourceList.tsx:27`, `Entities.tsx:20`,
    `DirectoryBreadCrumbs.tsx:13`, `EntitiesTabs.tsx:13`,
    `EntityItem.tsx:40`, `TableHeader.tsx:13` receive `NaN` without
    guard and call `directoryApi.getDatasourceEntities({dataSourceId: NaN})`
    → backend returns 400/404 → UI surfaces an AppErrorPage indistinguishable
    from "data source genuinely missing". Same NaN-swallowing shape as
    `useTermsRouteParams` (terms sidecar invariants[2]). NEW DRIFT
    FACET candidate:
    `use_directory_route_params_no_isnan_guard_nan_propagates_to_six_consumers_indistinguishable_from_missing`.

    (4) DOC-PAGE ACCESS-CONTROL SILENCE REAFFIRMED (MEDIUM, refinement).
    Live `data-discovery/directory` page (status 200, 2026-05-26) and
    sibling `developer-guides/api-reference/directory` page (also 200)
    both make NO statement about who can view the Directory. An
    operator deploying ODD with RBAC expectations from the
    `enable-security/authorization` doc has no signal that the
    Directory is read-collaborative end-to-end. STRENGTHENS F-023's
    existing `doc_silence_on_directory_authorization_owner_scoping`
    facet with the UI-tier corroboration that the absence is
    operator-relevant (operators see a permission-named wrapper they
    cannot rely on).

    (5) DOC-PAGE `'all'` MAGIC-STRING UNEXPLAINED (LOW, doc-clarity).
    The live doc page lists `/directory/{type-prefix}/{data-source-id}/all`
    as the level-3 URL pattern but does NOT explain that `'all'` is an
    in-band sentinel. An operator deep-linking to a level-3 URL has to
    read the source or navigate from level 2 to learn that the `all`
    segment is special; the same doc explains level 4's `{type-id}` as
    a numeric id by contrast. A one-sentence doc clarification closes
    the gap.

    (6) LEVEL-3 URL ONLY REACHED VIA `<Navigate to='all' replace />`
    REDIRECT (LOW, structural). `directoryDataSourcePath` has ONLY TWO
    output branches (level-2 bare-prefix at lines 59-61; level-4 full
    path at lines 48-57). The level-3 URL is reached either via the
    React Router Navigate fallback (`DirectoryRoutes.tsx:15-17`) when
    a user clicks a data-source row from level 2, OR via the
    EntitiesTabs.tsx:26 explicit `'all'` builder call. The `replace`
    semantic on Navigate means the level-3 URL does not appear in
    browser history. Recorded as the structural ADR explaining why
    the builder shape has only 2 branches despite the URL space having
    4 distinct shapes.

    Probe emitted by the sidecar: P-169 pins the visual outcome of a
    minimum-privilege authenticated user navigating the full /directory
    hierarchy (full inventory render expected end-to-end; bare frontend
    + non-blocking wrapper + zero-`@PreAuthorize` chain).

    Coherence sweep STRENGTHENS=3 (F-023 existing facets reaffirmed at
    UI tier; F-005 sibling — Directory's FLAT-LIST enumeration exhausts
    the catalog-shape surface alongside lineage's GRAPH-shape;
    F-008/P-10 ingestion-side relationship — Directory exposes what
    Batch Ingestion populates). SUPERSEDES=0. CONFLICTS=0.
