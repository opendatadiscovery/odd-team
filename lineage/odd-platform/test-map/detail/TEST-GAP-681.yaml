proposed_action: |-
  Add three Mockito test methods in `OwnerServiceImplTest`: (a) `delete_onlyTermOwnershipBinding_raisesCascadeDeleteException` — stub `termOwnershipRepository.existsByOwner(id) → Mono.just(true)`, the other two as `Mono.just(false)`; invoke `service.delete(id)`; assert `CascadeDeleteException` and no call to `ownerRepository.delete`. (b) `delete_onlyOwnershipBinding_raisesCascadeDeleteException` — symmetric with the ownership leg true. (c) `delete_onlyUserOwnerMappingBinding_raisesCascadeDeleteException` — symmetric with the userOwnerMapping leg true. (d) `delete_noCascadeBindings_succeeds` — all three legs return `Mono.just(false)`; assert `ownerRepository.delete(id)` is invoked. Add a `// REGRESSION-PIN — Each cascade leg independently triggers the CascadeDeleteException. A REFACTOR that flips || to && or drops one leg will break exactly ONE of these tests, surfacing the regression.` comment block. Each test is small (~10 lines) but TOGETHER they pin the OR semantics that no single composite test can.
