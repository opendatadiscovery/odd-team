name: PostgreSQLSessionHousekeepingJob has NO @SchedulerLock — N-instance DB-load amplification
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20X — surfaces an operational
  inconsistency in the platform's scheduled-jobs leader-election convention. The
  PostgreSQLSessionHousekeepingJobHandler is the SOLE `@Scheduled` job in the
  codebase WITHOUT leader-election (Postgres advisory lock or ShedLock
  @SchedulerLock). The asymmetry produces N× DB load on multi-replica deployments
  for the cleanup pass.

  **THE PRIMARY SOURCE**:
    PostgreSQLSessionHousekeepingJobHandler.java:13 declares
    `@Scheduled(fixedRate = 1, timeUnit = TimeUnit.HOURS)` — fires the cleanup
    hourly. There is NO `@SchedulerLock(name = ...)` annotation, NO Postgres
    advisory-lock acquire/release wrapping, NO `@ConditionalOnProperty` gating
    by an advisory-lock-id config key. Every replica runs the housekeeping job
    every hour independently.

  **THE CONVENTION THIS BREAKS**:
    The platform's other scheduled background jobs ALL use leader-election:
      - ActivityTablePartitionManager (boot-time partition creation + nightly
        `@Scheduled(cron="0 1 0 * * *")`) — uses ShedLock
        `partitionCreationJob` with lockAtLeastFor=10m / lockAtMostFor=10m
        AND Postgres advisory lock id `partition.advisory-lock-id`
        default 90
      - NotificationSubscriberStarter — uses Postgres advisory lock id
        `notifications.wal.advisory-lock-id` default 100; single-thread WAL
        consumer
      - DataCollaborationReceiveEventThread + DataCollaborationSenderMessageThread —
        use two distinct advisory locks `datacollaboration.receive-event-advisory-lock-id`
        default 110 + `datacollaboration.sender-message-advisory-lock-id`
        default 120
    Every other background job has a leader-elected single-thread execution
    contract. The session housekeeping is the asymmetric outlier.

  **OPERATIONAL CONSEQUENCE**:
    On a 5-replica deployment under `session.provider=INTERNAL_POSTGRESQL`:
      - 5 replicas × 1 housekeeping invocation per hour = 5 DELETE statements
        per hour against `SPRING_SESSION` + `SPRING_SESSION_ATTRIBUTES`
      - The deletes are IDEMPOTENT — the second DELETE in any given minute
        sees no rows matching `expiry_time < now()` that the first DELETE
        didn't already remove
      - So the CORRECTNESS is OK, but the DB load is 5× the intended rate
      - On a busier deployment the SAME job competes for connection-pool slots
        against application traffic, briefly throttling the pool 5x per hour
    The cost grows linearly with replica count.

  **WHY IT MATTERS — INCONSISTENCY HARMS DEBUGABILITY**:
    Operators reasoning about ODD's background-job semantics learn the
    advisory-lock convention from the (4 of 5) jobs that use it. They reasonably
    assume session housekeeping ALSO uses the convention. When debugging an
    unexpected DB-side connection-pool spike, the natural mental model is
    'leader-elected job ran' — but in the housekeeping case the spike is N×.
    This is a latent diagnostic surface.

  **AGGRAVATING FACTOR — `spring.session.timeout: -1` MAKES THE JOB A NO-OP**:
    Compound finding with spring-session-timeout-minus-one-housekeeping-noop
    (batch X). Under the shipped default the housekeeping does nothing — so
    the lack of leader-election produces N× no-ops, not N× actual deletes.
    This MITIGATES the immediate impact at default settings but the gap
    SURFACES the moment an operator switches to a finite session timeout
    (the recommended posture for production). In other words, the missing
    @SchedulerLock is benign under defaults but becomes the operational gap
    the moment operators harden their session timeout.

  **SEVERITY**: MEDIUM — operational inconsistency / observability hazard rather
  than correctness bug. The deletes are idempotent so duplicate execution does
  not corrupt state, but the inconsistency violates the platform's own
  leader-election convention AND amplifies DB load on multi-replica deployments
  under finite session timeouts.
