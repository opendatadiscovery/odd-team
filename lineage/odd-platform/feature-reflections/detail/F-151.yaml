- id: H-008
  hypothesis: "When a user opens a term they cannot edit, the linked-terms data is presented consistently — the Overview mini-panel and the Linked-terms tab offer the same actions for the same data."
  derivation: "Senior-PO UX seed (consistency + intuitive): the same data shown twice should not carry contradictory affordances."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      Linked terms appear in TWO surfaces with DIFFERENT affordances: the Overview "TERMS" mini-panel
      (Overview.tsx:65-72 → TermLinkedTerms) shows linked terms inline WITH Add/Delete affordances; the
      Linked-terms TAB (TermDetailsRoutes.tsx:32 → LinkedTermsList) shows the SAME linked terms in a
      paginated table WITH a search input but NO Add and NO Delete. So the consistency holds for the
      DATA (same links shown) but breaks for the ACTIONS (Add/Delete on the panel; search-only on the
      tab). Adding a term from the Overview panel does not navigate to the tab; the tab silently
      inherits the new entry. This is the F-151 facet
      linked_terms_overview_panel_vs_linked_terms_tab_dual_surface.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__TermDetails.md
        section: bugs_limitations_corner_cases
        cite: "Overview.tsx:65-72 (panel: Add/Delete) + TermLinkedTermsList.tsx:15-100 (tab: search, no Add/Delete)"
        note: "same data, inconsistent affordances across two surfaces"
    operator_visible_failure: |
      An operator who manages linked terms from the Overview panel, then clicks into the Linked-terms
      tab to "see all," loses the Add/Delete affordances and gains a search box — the mental model
      ("this is where I manage linked terms") breaks at the surface boundary. Conversely an operator who
      starts on the tab cannot add/remove from there and must hunt back to the Overview panel. No data
      loss; this is a UX-consistency paper-cut (severity LOW). Documenting the intended split (panel =
      manage recent; tab = search-all) would resolve it without code change.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

