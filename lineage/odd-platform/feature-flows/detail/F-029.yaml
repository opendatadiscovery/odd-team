control_summary: |-
  0 of 4 cells COVERED. Feature MINTED this batch (Z) from the
  odd-platform-public-api OpenAPI spec sidecar. 14 substantive drift
  facets cluster around four load-bearing themes: (1) auth illegible
  — zero securitySchemes + no error model + spec publicly served as
  reconnaissance surface; (2) drift accumulation — 201-vs-200 across
  7+ controllers + UPDATE-with-201 description copy/paste + REFACTOR-217
  path mismatch silently disables term-link authorization + inverse-
  semantic on getMyObjects family 4-angle confirmed + operationId
  misnamed on createDataEntityTagsRelations; (3) doc-coverage abdication
  — hub page lists 9 sub-pages while spec carries 35 tags + SLA
  endpoint response-shape contradiction; (4) authoring-quality cosmetics
  — ProspectLog legacy title + servers: stub localhost + no rate-limit
  / pagination-size declarations + QueryExampleFormData missing name.
  The HIGHEST-LEVERAGE remediation is a SPEC-DRIVEN CONTRACT TEST —
  one test that fires every spec'd operation against a running
  platform instance and asserts status-code + response-DTO field-set
  would catch every triangulated drift currently logged AND surface
  unknowns. Build-it-once + run-it-on-every-PR. Single-cluster-fix
  PRs feasible for the status-code drift (one direction per controller
  family — closeable per row in the 7-controller enumeration) and
  for the REFACTOR-217 path mismatch (one SecurityConstants line
  edit to align with spec). Local docker-compose probe stack: ODD
  platform + Postgres + a script that walks every spec'd path and
  invokes via WebTestClient.

  This pillar-anchor feature CLOSES THE LAST UNCOVERED PILLAR
  (P-11 Platform API & Developer Surface). All 11 pillars now have at
  least one feature MINTED in the rev-3 ontology. Cross-batch
  pattern: every feature in F-001..F-028 has a spec-side mirror; this
  feature is the canonical home for the cross-feature
  contract-surface drift.
