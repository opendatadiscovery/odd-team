    all similar bugs at once. Out-of-UI-scope.
notes: |-
  NEW invariant captured in batch ZL (2026-05-26) FINAL refresh.
  This is the second instance of the 'edit-form sends CREATE
  shape' class — the first was the DataSource update
  REPLACE-not-MERGE behaviour
  (`invariant:datasource-update-replace-not-merge-mapstruct-set-to-null`),
  though that was a different shape (MapStruct nulling omitted
  fields). The pattern: form-data type lies about its destination
  shape.

  Cross-batch follow-up: an audit of every form in odd-platform-ui
  that has a single useForm call but is used for BOTH create
  AND edit modes. Each is a candidate for the same shape-of-bug.
  Grep for `useForm<.*FormData>` in odd-platform-ui/src should
  enumerate candidates.
