feature_id: F-035
name: Operator-Configured Additional Links
pillar_anchored_id: P-08:F-009
discovered_at_batch: ZE
discovered_at_commit: 25e66b1
discovered_from_entry_point: |-
  ui_route:* — every page that renders AppToolbar mounts AppInfoMenu which
  fires GET /api/links via TanStack Query.
batch_extensions:
  - batch: ZJ
    entry_point_added: |-
      ui-shell-widget:AppInfoMenu — the React widget that consumes
      `useAppLinks()` and renders the operator-configured links inside
      the App Info menu popover. Hop-3 of F-035's chain previously
      cited AppInfoMenu.tsx as an unresolved UI render surface; batch
      ZJ promotes it to a primary-source sidecar AND adds the
      surrounding 5-link-site evidence + the keyboard-inaccessibility
      finding + the keepMounted-+-no-staleTime silent-staleness chain
      + the URL-as-React-key duplicate-key warning.
    contributing_nodes_added:
      - odd-platform ts components/shared/elements/AppToolbar/AppInfoMenu ui-shell-widget:AppInfoMenu
    notes: |-
      FIVE refinements / new findings surface from the AppInfoMenu
      primary-source enrichment:

      (1) TABNABBING SURFACE EXTENDED — ALL 5 LINK SITES, not just
      operator-configured (MEDIUM, STRENGTHENS the existing
      `reverse_tabnabbing_target_blank_without_rel_noopener_noreferrer`
      facet) — The widget uses `<Link target='_blank'>` WITHOUT
      `rel='noopener noreferrer'` at FIVE sites:
        - line 41 (project version GitHub link — hardcoded)
        - line 61 (operator-configured links — already documented)
        - line 95 (Documentation link — hardcoded gitbookLink)
        - line 103 (Slack link — hardcoded slackLink)
        - line 112 (Feedback link — hardcoded reviewLink)
      The four hardcoded targets (docs.opendatadiscovery.org,
      go.opendatadiscovery.org, github.com/opendatadiscovery/odd-platform,
      producthunt.com) are first-party-trusted today but inherit the
      same window.opener leak as a defence-in-depth gap. F-035's
      existing facet identified the operator-configured surface
      specifically; the AppInfoMenu sidecar's evidence widens the
      surface to FIVE link sites. STRENGTHENS the existing facet.

      (2) APP INFO MENU IS KEYBOARD-INACCESSIBLE — WCAG 2.1 SC 2.1.1
      VIOLATION (NEW drift facet, MEDIUM) — AppInfoMenu.tsx:78-82
      declares the icon button with `onMouseEnter` ONLY — no onClick,
      no onKeyDown, no onFocus handler. The ARIA attributes
      (`aria-haspopup='true'` line 80, `aria-controls={menuId}` line 79)
      suggest the AUTHOR EXPECTED keyboard accessibility, but no
      handler is wired. Touch-device users (iOS Safari, Android Chrome)
      generate NO mouseenter on the icon button; the menu is
      unreachable for them too. NEW drift facet for F-035:
      `app_info_menu_keyboard_inaccessible_aria_haspopup_claims_support_no_handler_wired`.

      (3) KEEP-MOUNTED + NO STALE-TIME → YAML EDITS INVISIBLE UNTIL
      RELOAD (NEW drift facet, LOW; STRENGTHENS F-035's existing
      `config_properties_boot_time_only_runtime_yaml_change_silent_until_restart`)
      — AppInfoMenu.tsx:90 sets `keepMounted` on the MUI Menu — the
      DOM tree stays mounted forever after the first hover.
      `lib/hooks/api/appInfo.ts:11-17` sets NO `staleTime`, NO
      `refetchInterval` on the `useAppLinks` query — TanStack Query
      defaults to `staleTime=0` (refetch on every mount). Combined
      with keepMounted, the widget NEVER UNMOUNTS for the lifetime of
      the SPA tab — so the cache is effectively kept hot. Operator
      edits to `odd.links` in YAML + backend restart are invisible to
      users in long-lived SPA tabs until they do a full page reload.
      F-035's `config_properties_boot_time_only` facet identifies the
      backend boot-immutability; this UI-tier finding identifies the
      frontend cache-hot-on-mount amplifier. NEW drift facet:
      `appinfomenu_keepmounted_combined_with_no_staletime_renders_yaml_edits_invisible_until_reload`.

      (4) LINK.URL AS REACT RECONCILIATION KEY — DUPLICATE-URL WARNING
      RISK (NEW drift facet, LOW) — AppInfoMenu.tsx:61 uses `link.url`
      as the React key in the operator-link map. If the operator
      configures two `odd.links` entries with the same URL but
      different titles (e.g. "Runbook" + "Runbook (old)" pointing at
      the same wiki), React emits a duplicate-key warning and may
      de-duplicate the render in some reconciliation paths. NEW drift
      facet for F-035:
      `linkurl_as_react_reconciliation_key_duplicate_url_warning_risk`.

      (5) LOCALISATION GAP — HARDCODED ENGLISH LABELS BYPASS i18n
      (NEW drift facet, LOW) — AppInfoMenu.tsx:20-23, 48, 100, 108, 117
      — labels 'Documentation', 'Slack', 'ODD Platform version', 'Leave
      a feedback' hardcode English and bypass the `useTranslation()`
      infrastructure already present in `AppToolbar.tsx:19`. A non-English
      locale user sees these four labels in English inside an otherwise-
      translated menu. Cross-link F-043. NEW drift facet:
      `appinfomenu_4_hardcoded_english_labels_bypass_i18n_localisation_gap`.

      Coherence sweep STRENGTHENS=2 (`reverse_tabnabbing` facet widened
      from 1 site to 5; `config_properties_boot_time_only` extended with
      the keepMounted+no-staleTime amplifier); SUPERSEDES=0; CONFLICTS=0.

      Cross-references:
        - F-041 (new this batch) owns the toolbar chrome surface that
          HOSTS this widget; F-035 owns the additional-links data
          contract. The two cover different boundaries of the same
          UI affordance.
        - F-043 (new this batch) owns the multilingual UI; the
          AppInfoMenu localisation gap is one of 12+ missing-key-or-
          hardcoded-string sites the i18n feature catalogues.
        - REFACTOR-629 / REFACTOR-631 already track the tabnabbing
          gap + boot-time YAML staleness at the controller / config
          layer; the AppInfoMenu sidecar extends them to the UI
          consumer layer.
