test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/processor/AlertNotificationDeliveryAuditTest.java"
  name: "channelFailure_noAuditRow_noPrometheusCounter_onlyLogError"
evidence:
  - |-
    NotificationsDispatcher.md says: 'No delivery audit at dispatcher — no DB record of which alert went to which channel with what status. Operators auditing who-saw-what have nothing beyond log greppable receiver-id strings.'
  - "AlertNotificationMessageProcessor.java:30-35 (catch-log-only)"
  - "NotificationSubscriber.java:83-84 (LSN advanced unconditionally)"
  - "Grep `Counter|Meter|Gauge|@ActivityLog|notification_audit` against odd-platform-api/src/main/java/.../notification returns 0 matches"
cross_references:
