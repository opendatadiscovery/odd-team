realism_caveats: |
  This probe verifies the BACKEND behaviour only. It does NOT verify the UI-side
  consequences flagged in the sidecar's bugs_limitations_corner_cases:
    - target='_blank' without rel="noopener noreferrer" (tabnabbing) — needs a
      Playwright/headless-browser probe against AppInfoMenu.tsx that injects a
      malicious link.url and asserts that the rendered <a> attribute carries rel.
    - link.url used as React key — needs a probe that configures two odd.links
      entries with the SAME url and asserts the UI renders both (or warns).
    - URL scheme validation — needs a probe that configures odd.links[0].url =
      "javascript:alert(1)" and asserts the rendered <a href> is sanitised.
  These three UI-side concerns SHOULD be split into separate probes (P-129,
  P-130, P-131) when a UI-layer Playwright harness is available; this single
  probe stays scoped to backend behaviour.
