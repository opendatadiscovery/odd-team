- feature_id: F-008
  feature_name: Ingestion-replace destruction surface — silent metadata-delete + lineage-replace-on-call
  discovered_from_entry_point: webhook:POST /ingestion/entities
  description_excerpt: |-
    The platform's primary S2S ingestion endpoint `POST /ingestion/entities` accepts
    a DataEntityList payload from collectors. The user-observable promise (per the
    live Catalog Overview page + the live integration docs) is "merge" semantics:
    a collector re-publishes a SUBSET of fields per tick and the platform integrates
    them with what it already knew. The user-observable reality, per batch-I primary-source
    code-walk of IngestionService + MetadataIngestionRequestProcessor + LineageIngestionRequestProcessor:
    the ingestion path is REPLACE, not merge. TWO destructive surfaces are confirmed
    PRIMARY-SOURCE: (1) METADATA DELETE-ON-ABSENCE — MetadataIngestionRequestProcessor.java:72-74
