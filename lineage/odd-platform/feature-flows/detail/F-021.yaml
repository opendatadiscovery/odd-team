control_summary: |-
  0 of 4 cells COVERED. Feature emerges from the batch-R primary-source
  audit of `ReactiveActivityRepositoryImpl` paired with prior batch-A
  sidecars (ActivityController.getActivity + ActivityServiceImpl) +
  batch-K (ActivityTablePartitionManager) + F-010 (housekeeping
  coupling) + F-006 (audit-silence schema-rooted) + F-011
  (provider-agnostic resolution). The Activity Feed is the
  user-observable audit-trail surface under P-07 Active Platform
  Features — distinct from F-007 AlertManager Integration (alert
  ingress), F-009 WAL-driven Notification Delivery (outbound
  communication), F-014 Per-Entity Alert View (alert-history read).
  Thirteen substantive drift facets cluster around four load-bearing
  themes: (1) the audit scope is schema-rooted to data-entity events
  (the F-006 audit-silence finding's structural root cause); (2)
  the read default is cross-owner with an axis-mismatched
  MY_OBJECTS view; (3) provider-agnostic actor resolution produces
  cross-mode bleed (the F-011 batch-N pattern manifest end-to-end);
  (4) operational characteristics — monotonic growth, partial-commit
  under partition rotation, hard-delete history erasure, no DISTINCT
  on multi-facet filters — produce subtle correctness gaps under
  load + over time. The highest-leverage probe candidates are: (a)
  cross-mode bleed end-to-end — configure LOGIN_FORM 'alice' +
  LDAP 'alice' + assert activity rows from both modes resolve to
  the same OwnerPojo on read; (b) anonymous-mutation attribution
  gap under DISABLED — flip `auth.type=DISABLED`, mutate an entity
  anonymously, read the Activity Feed, assert the row appears with
  no actor distinguished from system events; (c) JSONB old_state /
  new_state leak — submit a description containing a sensitive
  string via PUT /api/dataentities/{id}/description, GET
  /api/activity, assert the sensitive string appears verbatim to
  any authenticated user; (d) 27-vs-20 doc drift — for each of the
  7 undocumented event types, trigger the event and assert it
  appears in the live Activity Feed without doc explanation. Local
  docker-compose probe stack: ODD platform + Postgres + two seeded
  Owners + multi-mode auth config + DISABLED-mode toggle.
