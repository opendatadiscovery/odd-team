- id: H-002
  hypothesis: "When an operator sets LDAP `admin-groups: ['ODD_ADMINS']`, a user is promoted to ADMIN if and only if one of the directory authorities the populator returns for them equals `ODD_ADMINS` (case-insensitive full string), so the operator must know the exact authority string the populator emits (CN vs DN vs prefixed)."
  derivation: "Corrected from H-001 ground truth: the match is full-string equality between each `a.getAuthority()` and each configured admin-group. The matched value is whatever `DefaultLdapAuthoritiesPopulator` returns with `setRolePrefix(\"\")` (LDAPSecurityConfiguration.java:108)."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The match is exact (case-insensitive) full-string equality, which is correct and what the docs'
      framing ("a list granting admin permissions") implies. The SUBTLE caveat: the value being matched
      is `a.getAuthority()` — the authority string `DefaultLdapAuthoritiesPopulator` produces. The
      populator is configured with `setRolePrefix("")` (LDAPSecurityConfiguration.java:108) and
      `setSearchSubtree(true)` (line 112); by Spring Security default it maps the group's `cn` to the
      authority. So an operator must configure `admin-groups` with the group's CN exactly (e.g. `ODD_ADMINS`),
      NOT its full DN (`cn=ODD_ADMINS,ou=Groups,...`). The sidecars do not pin which attribute the
      populator returns under every directory configuration, so the exact string an operator must supply
      is config-dependent and not fully traced. This is the legitimate, milder caveat that the (wrong)
      substring narrative was standing in front of.
    evidence:
      - sidecar: "(source-read, Rule 8 exception)"
        section: "LDAPSecurityConfiguration.authoritiesPopulator"
        cite: "LDAPSecurityConfiguration.java:106-113"
        note: "`new DefaultLdapAuthoritiesPopulator(contextSource, groupsSearchBase)` + `setRolePrefix(\"\")` — the authority string is the populator's group-name output, unprefixed."
      - sidecar: "odd-platform__java__LDAPSecurityConfiguration__config-key-consumer__auth_type@L51.md"
        section: "concepts.invariants + tests_coverage_semantic.uncovered_behaviours"
        cite: "LDAPSecurityConfiguration.java:91-98"
        note: "Sidecar enumerates the admin-vs-user decision behaviours as uncovered; does not pin the exact authority-string format per directory."
    operator_visible_failure: |
      An operator who configures `admin-groups` with the full DN (a natural mistake, since LDAP config
      elsewhere uses DNs) gets NO admins — the DN string will never equalsIgnoreCase the CN the populator
      returns. Silent under-promotion. There is no boot warning, no log line at sign-in. This is the
      real, documentable LDAP admin-groups caveat (exact CN match, case-insensitive, no DN, no substring).
    severity: MEDIUM
