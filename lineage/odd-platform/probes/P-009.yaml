---
probe_id: P-009
feature_id: F-004
test_class: security
verified_against_commit: ede5d277
prompt_version: probe-runner/0.1.0
maintainer_curated: true
stack_profile: odd-minimal
expected_outcome: |
  Defence-in-depth complement to P-007. P-007 pinned the BACKEND no-sanitisation
  posture (XSS payload stored verbatim in DB). P-009 pins the UI RENDER side:
  after the PUT, opens the data-entity detail page in headless Chromium, captures
  the rendered DOM via page.content(), asserts the unsanitised payload IS present
  in the rendered HTML.

  Note this probe specifically tests `rehype-raw` + no-`rehype-sanitize` behaviour
  — when react-markdown sees the XSS-laden description, it parses raw HTML
  (rehype-raw) without filtering (no rehype-sanitize), so dangerous markup
  reaches the DOM. The actual XSS EXECUTION (alert popping, fetch leakage)
  depends on Chromium's CSP + same-origin behaviour; this probe pins the
  RENDER-time presence of dangerous markup in the DOM tree, which is the
  necessary precondition for execution.

  When the UI fix lands (add rehype-sanitize to the Markdown rendering
  pipeline), this probe's assertions flip: dangerous markup must NOT appear
  in the rendered DOM.

  Slice-5 upgrade: this probe now uses the new `browser_dom_query` observe
  kind to assert against page.content() captured post-settle. The earlier
  slice-4 version of P-009 could only assert backend-side (DB roundtrip + SPA
  navigated); slice-5 closes the gap end-to-end.
---

# P-009 — UI render-side XSS defence-in-depth (REFACTOR-218 UI half)

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (1009, '//probe-source-P-009/db', 'probe-source-P-009')
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, view_count,
         source_created_at, source_updated_at)
      VALUES (1009, '//probe-source-P-009/db/tables/p009_ui_xss', 'p009_ui_xss',
              1009, 1, 0, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # PUT the XSS payload (same approach as P-007).
  - kind: rest
    method: PUT
    path: /api/dataentities/1009/description
    body:
      internal_description: |
        # P-009 — UI render XSS probe

        Normal markdown.

        <script>window.__P009_XSS_MARKER='executed'</script>

        <img id="p009-xss-img" src=x onerror="window.__P009_XSS_MARKER='img-onerror'" />

        <iframe id="p009-xss-iframe" src="data:text/html,inner"></iframe>

        End of payload.

act:
  - kind: browser
    path: /dataentities/1009/overview
    base: "http://localhost:18080"
    wait_until: load
    timeout_ms: 30000
    post_settle_ms: 6000
    xhr_filter_regex: '^http://localhost:18080/api/dataentities/1009(\?.*)?$'
    # Slice-6: leak_filter_regex matches the SPECIFIC exfil target this probe's
    # XSS payload would call out to if the onerror handler executed. We
    # deliberately match ONLY `attacker.example` rather than "any off-platform
    # URL" — a broader filter would surface legitimate SPA behaviour (e.g. the
    # UI loads Roboto from Google Fonts, which is a real off-platform request
    # that has nothing to do with XSS execution). Empirically observed on the
    # first slice-6 run: 2 Google Fonts URLs would otherwise have falsely
    # tripped xss_leak_count > 0.
    leak_filter_regex: 'attacker\.example'

observe:
  # Slice-5: UI-render-side DOM-presence assertions.
  - kind: browser_dom_query
    from: dom_html
    text_contains: "<script>"
    capture_as: dom_has_script_tag

  - kind: browser_dom_query
    from: dom_html
    text_contains: "p009-xss-img"
    capture_as: dom_has_xss_img_id

  - kind: browser_dom_query
    from: dom_html
    text_contains: "p009-xss-iframe"
    capture_as: dom_has_xss_iframe_id

  - kind: browser_dom_query
    from: dom_html
    text_contains: "onerror="
    capture_as: dom_has_onerror_attr

  # Slice-6: XSS-execution telemetry. browser_events reads the Playwright-
  # captured page.on('dialog') firings + off-platform request matches. Any
  # observed dialog or leak request indicates the dangerous markup did
  # something beyond just landing in the DOM — i.e. the surface materialised
  # into actual code execution.
  - kind: browser_events
    event: dialog
    capture_as: xss_dialog_fired
    capture_list_as: xss_dialog_payloads

  - kind: browser_events
    event: leak
    capture_as: xss_leak_count
    capture_list_as: xss_leak_targets

  # Backend sanity: verify the description was actually stored. If the DB
  # write failed, the DOM-presence assertions would be vacuously false.
  - kind: sql
    query: |
      SELECT internal_description FROM data_entity WHERE id = 1009
    capture_as: stored_description

assert:
  # Backend assertions (P-007 sanity check — confirms the payload landed
  # for the UI to render).
  - "'<script>' in stored_description"
  - "'onerror=' in stored_description"
  # The SPA navigated + fetched the entity (LSN-017's pattern; on this entity
  # it also confirms the rendering pipeline ran).
  - "xhr_count >= 1"
  # SLICE-5 — UI-render-side MEASURED truth (DOM-presence facets).
  # Dangerous TAGS reach the DOM (script / img / iframe) but EVENT-HANDLER
  # attributes (onerror=) are stripped by React's attribute-handling on
  # rehype-raw's render path. When rehype-sanitize lands, the first three
  # flip to == False; the fourth stays. Provenance: R-20260519T020610Z-P-009.
  - "dom_has_script_tag == True"
  - "dom_has_xss_img_id == True"
  - "dom_has_xss_iframe_id == True"
  - "dom_has_onerror_attr == False"
  # SLICE-6 — UI-render-side MEASURED truth (EXECUTION facets).
  # Pinning the full F-004 picture: dangerous markup reaches the DOM (above)
  # BUT does not execute. No alert/confirm/prompt fired (xss_dialog_fired==0),
  # no off-platform request leaked (xss_leak_count==0). The execution surface
  # is closed for THIS attack vector by the Chromium HTML-parser's policy of
  # not executing <script> tags inserted via innerHTML (a long-standing browser
  # mitigation) + React stripping event-handler attributes.
  #
  # This makes REFACTOR-218 a MEASURED-DEFENCE-IN-DEPTH finding: the bug
  # surface (tag injection) still warrants the rehype-sanitize fix, but the
  # exploitable attack vector via this PUT path is currently closed by the
  # browser's own protections. When future code changes (e.g. switching from
  # react-markdown to dangerouslySetInnerHTML directly, or introducing a
  # client-side template renderer that DOES execute embedded scripts), these
  # assertions would flip and the probe would surface the regression.
  - "xss_dialog_fired == 0"
  - "xss_leak_count == 0"

cleanup:
  - kind: docker-compose-down
    destroy_volumes: true

cross_references:
  refactoring_scopes: [REFACTOR-218]
  test_gaps: [TEST-GAP-293]
  doc_gaps: [DOC-GAP-096]
  related_concepts: ["Markdown Rendering Pipeline", "Internal Description (Markdown body)"]
  retrospectives: [LSN-017]

realism_caveats: |
  - This probe is the DEFENCE-IN-DEPTH counterpart to P-007. P-007 pins the
    backend storage gap; P-009 pins the UI render-path exposure (the dangerous
    markup reaches the rendered DOM tree via react-markdown + rehype-raw
    without rehype-sanitize).
  - The DOM-presence assertions are necessary preconditions for actual XSS
    execution. They do NOT prove that the <script> tag *executed* (Chromium
    blocks scripts inserted via dangerouslySetInnerHTML / rehype-raw in some
    contexts; CSP and same-origin policies also intervene). Proving execution
    end-to-end needs `page.on('dialog')` + `page.on('request')` hooks to
    observe attacker.example/leak callbacks — slice-6 candidate when the
    runner gains a Playwright event-capture observe kind.
  - Probe runs under DISABLED auth. The XSS surface applies to ANY auth mode
    once the writer has DATA_ENTITY_DESCRIPTION_UPDATE; the UI renders the
    same DOM regardless of caller identity.
