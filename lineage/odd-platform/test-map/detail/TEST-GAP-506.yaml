proposed_action: |-
  Testcontainers integration test. (a) Create DEG D-outer; create DEG D-inner; add D-inner as a member of D-outer (the nested DEG relationship). (b) Add 2 non-DEG members m1 (member of D-inner) and m2 (member of D-outer directly). (c) Add lineage edges m1->D-inner, m2->m1. (d) GET /api/dataentitygroups/D-outer.id/lineage. (e) Assert response items contain m1 and m2 nodes. (f) Assert response items do NOT contain D-inner as a node (the Java filter at LineageServiceImpl.java:71-75 strips DEG entries). (g) Assert response edges do NOT include m1->D-inner (the bidirectional filter strips edges where ANY endpoint is a DEG). (h) Test comment 'LOCKS the inner-DEG suppression contract as of 2026-05-19 (intent_anchor: // Remove this when we will support inner DEGs for DEG lineage at LineageServiceImpl.java:71). When the deferred-feature is lifted, this test FLIPS to expect D-inner in the nodes list and the m1->D-inner edge in the edges list.'
