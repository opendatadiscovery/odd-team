# P-390 — status-switch burst completes within the 9-minute ShedLock window (H-004)

arrange:
  - kind: docker-compose-up
    note: |
      Local docker-compose stack (platform + Postgres), APPROACH.md §9 rule 12
      local-only. The platform's DataEntityStatusSwitchJob runs every 10 minutes
      under a 9-minute ShedLock; this probe does not wait for the natural cadence
      — it seeds an elapsed backlog and triggers/observes a single tick's work.

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (3900, '//probe-source-P-390/db', 'probe-source-P-390')
      ON CONFLICT (id) DO NOTHING

  # Seed 5000 DEPRECATED entities whose status_switch_time has ALREADY elapsed
  # (now - 1 minute), so the next status-switch tick selects the entire set in one
  # unbounded getPojosForStatusSwitch read. status=4 is DEPRECATED (switchable).
  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, status,
         status_switch_time, source_created_at, source_updated_at)
      SELECT 3900000 + g,
             '//probe-source-P-390/db/tables/p390_' || g,
             'p390_' || g,
             3900, 1, 4,
             NOW() - INTERVAL '1 minute',
             NOW(), NOW()
      FROM generate_series(0, 4999) AS g
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      SELECT count(*) FROM data_entity
      WHERE id BETWEEN 3900000 AND 3904999 AND status = 4
    capture_as: seeded_deprecated_count

act:
  # Trigger ONE status-switch tick and time it end-to-end. The harness invokes the
  # job's write path once (e.g. via a test-only actuator endpoint, a direct bean
  # call in an integration-test harness, or by aligning the seed to the next
  # natural @Scheduled tick and timing from first-write to last-write). The
  # measured value is the wall-clock duration of the single bulk flip.
  - kind: timed-job-invocation
    target: "DataEntityStatusSwitchJob.run() (service/job/DataEntityStatusSwitchJob.java:23)"
    base: "http://localhost:18080"
    timeout_seconds: 1200          # 20 min ceiling so a >9-min breach is observable, not truncated
    capture_duration_as: tick_duration_seconds

observe:
  - kind: sql
    query: |
      SELECT count(*) FROM data_entity
      WHERE id BETWEEN 3900000 AND 3904999 AND status = 5   -- 5 = DELETED
    capture_as: flipped_to_deleted_count

  # Confirm the H-002 interaction in passing: the flipped rows have status_updated_at
  # NULL (the applyStatus bug). Recorded as corroboration of PLT-027, not asserted
  # as the pass condition of THIS probe (P-390 is the timing probe).
  - kind: sql
    query: |
      SELECT count(*) FROM data_entity
      WHERE id BETWEEN 3900000 AND 3904999 AND status = 5
        AND status_updated_at IS NULL
    capture_as: flipped_with_null_status_updated_at

assert:
  # All 5000 flipped in the single tick (no split across ticks under the lock).
  - "flipped_to_deleted_count == 5000"
  # The headline timing assertion: the tick completed inside the 9-minute
  # (540-second) ShedLock window. FAIL here is the load-bearing result — it
  # converts H-004 from probe-needed to contradicted and justifies PLT-027 Thread C.
  - "tick_duration_seconds < 540"

cleanup:
  - kind: docker-compose-down
    destroy_volumes: true

