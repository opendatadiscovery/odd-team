notes: |-
  New concept captured in batch 2026-05-19J. The UI lineage rendering primitive
  is a tree-with-overlay design, not a DAG visualisation. The maintainer may
  want to consider migrating to a DAG-aware renderer (e.g. react-flow with manual
  layering) to eliminate diamond duplication — but this would be a deep refactor
  affecting the entire Lineage tab UX.

  The d3-hierarchy choice is intentional (`implicit_adrs[2]` at LineageGraph.md)
  — the project prioritises layout determinism over DAG faithfulness. Diamonds
  appear twice because the underlying graph topology demands it; a DAG-aware
  layout would require introducing visited-set tracking + a layout algorithm
  capable of node-reuse (Sugiyama-style layered rendering or similar).
