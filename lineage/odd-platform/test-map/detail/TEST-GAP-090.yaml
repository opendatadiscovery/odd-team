gap_id: TEST-GAP-090
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java DataCollaborationController controller-method:postMessageInSlack
surfaced_by:
- postMessageInSlack.md:bugs_limitations_corner_cases.[2]
- postMessageInSlack.md:security.known_security_gaps.[3] (severity MEDIUM)
behaviour: Channel-id is fully user-supplied and not validated against an allowlist
  server-side — the request body's `channel_id` is passed straight to `SlackAPIClient.exchangeForChannel(channelId)`.
  Any Slack channel the bot has been invited to is acceptable; no concept of 'which
  channels are valid for which data entity / owner'.
