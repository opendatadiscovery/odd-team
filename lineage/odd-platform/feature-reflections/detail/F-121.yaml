- id: H-004
  hypothesis: "When an operator names the platform-level annotation `@EnableSchedulerLock`, every @Scheduled job in the platform is protected by a distributed lock (so the name 'enable scheduler lock' means what it says)."
  derivation: "The annotation NAME promises platform-wide lock enablement; Category-F-style name-vs-implementation check on a boot-time annotation."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      `@EnableSchedulerLock` imports the ShedLock AOP advisor only — it makes `@SchedulerLock`
      OPT-IN per method. It does NOT auto-lock bare @Scheduled methods. The
      PostgreSQLSessionHousekeepingJobHandler.deleteExpiredSessions() job is @Scheduled
      (fixedRate=1h) with NO @SchedulerLock, so it runs UNLOCKED on every replica every hour,
      in direct contradiction to the apparent scope of the platform-level annotation. The name
      promises "enable scheduler lock"; the mechanism is "enable scheduler-lock AOP — opt in
      per method." (Confirmed by reading PostgreSQLSessionHousekeepingJobHandler.java:10-19.)
    evidence:
      - sidecar: odd-platform__java__config__config-class__SchedulingConfiguration.md
        section: "stress_findings.name_behavior_pairs[@EnableSchedulerLock] (drift: MINOR) + concepts.invariants[1]"
        cite: "SchedulingConfiguration.java:14 + PostgreSQLSessionHousekeepingJobHandler.java:13-18"
        note: "The sidecar explicitly classified this as a name-vs-implementation MINOR drift."
    operator_visible_failure: |
      An operator (or a future maintainer) reading `@EnableSchedulerLock` at the top of the
      config class reasonably concludes all scheduled work is leader-elected. It is not: the
      hourly session purge runs N times on N replicas. Today the DELETE-by-expired-timestamp
      is idempotent so this is operationally harmless (wasted DB load only), but the
      inconsistency is a debugger/incident-response trap and a copy-paste hazard for the next
      @Scheduled method added without @SchedulerLock. This is the SAME defect tracked as
      PLT-083 Defect 2 (code fix) and DOC-250 Caveat 4 (doc, done) — see dedup below.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: grammar
    coverage: verified
    test_ref: "config.FeatureGatingDefaultsTest (asserts the gating-default family; session-lock asymmetry is documented via DOC-250 and code-tracked via PLT-083)"

