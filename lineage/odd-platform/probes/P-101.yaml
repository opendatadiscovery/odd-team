expected_outcome: |
  Stress question (Rule 6 upstream_callers multiplicity, LSN-017 class): how many times
  does GET /api/dataqatests/runs fire per one operator open of the /data-quality page,
  and per one filter change?

  DataQualityContent.tsx:24 calls useGetDataQualityDashboard(filterState) where
  filterState is a jotai DERIVED atom (filtersAtom, DataQualityStore.ts:32-42) recomputed
  from formFiltersAtom. The hook (lib/hooks/api/dataQuality.ts:74-82) wraps useQuery with
  queryKey ['dataQualityDashboard', params]. React-Query dedupes by queryKey, so a
  stable filterState object SHOULD produce exactly one network call per distinct key.

  Two doubling risks to pin:
  (H1 — derived-atom identity churn): filtersAtom returns a NEW object literal on every
  recomputation (DataQualityStore.ts:34-41 builds a fresh `{}` via reduce). React-Query
  serialises the queryKey, so a structurally-equal-but-referentially-new params object
  is the SAME key after serialisation and should NOT refetch. Confirm no refetch on a
  no-op formFiltersAtom write.
  (H2 — mount-time searchParams sync double-write): DataQualityFilters.tsx:28-43 has a
  useEffect that, on mount, reads searchParams and may setFormFilters once; a second
  useEffect (lines 46-54) writes searchParams back. If the page is opened with a filter
  already in the URL, the mount sequence is: initial render (fetch #1 with empty
  filters) -> searchParams-sync effect sets formFilters -> filtersAtom recomputes ->
  fetch #2 with the URL filters. That is a legitimate 2x for the URL-deeplink case, not
  a bug, but it MUST be recorded as multiplicity_per_trigger=2 for the
  "open /data-quality?deNamespaceIds=[1]" entry-point variant.
