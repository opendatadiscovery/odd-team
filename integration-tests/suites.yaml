  known-bugs:
    description: "Quarantine lane — pins that reproduce a KNOWN, UNFIXED bug; EXPECTED to be RED. Keeps them visible without making feature-complete permanently red. When a bug is fixed its pin flips GREEN → move it to feature-complete (that move is the measurable regression closure)."
    # IT-003 PLT-090/127 (tsquery poison) ·
    # IT-004 PLT-052 (DQ unknown-status crash) ·
    # IT-006 TEST-GAP-1013 (no SPA error boundary) · IT-007 LSN-001/PLT-086 (LOCAL
    # attachment lost on container recreate). All expected RED until fixed.
    # (IT-002 view_count +2 flipped GREEN 2026-06-11 — fixed by #1764/CTRIB-004 — moved to feature-complete.)
    # (IT-005 Top Tags oldest-by-id flipped GREEN 2026-06-12 — fixed by #1773 Thread A/CTRIB-007 — moved to feature-complete.)
    protocols: [IT-003, IT-004, IT-006, IT-007]

  multi-stack:
    description: "GREEN-target specs that each bring up their OWN docker stack (NOT odd-minimal). Run SEPARATELY from feature-complete — each up/down is ~30-60s so this suite is slow by nature; run-suite.sh runs them all in one playwright pass but every spec self-manages (and tears down) its own compose project. Kept out of feature-complete so the fast odd-minimal regression isn't a 7-min churn (2026-06-07)."
    # IT-008 REMOTE attachment round-trip (MinIO eu-west-1) · IT-009 auth-mode boundary (LOGIN_FORM) ·
    # IT-010 LDAP RBAC enforcement (LDAP) · IT-011 notifications WAL lifecycle · IT-012 WAL failover
    # (notifications, FLAKY on fresh boot — PLT-139 create-order wedge) · IT-123 session-cookie posture
    # (LOGIN_FORM) · IT-124 RBAC policy lifecycle (LDAP). Also reachable via I1/I2/I3.
    protocols: [IT-008, IT-009, IT-010, IT-011, IT-012, IT-123, IT-124]

  ingestion-e2e:
    description: "INGESTION-GRADE pipeline stands (maintainer directive 2026-06-12; adrs/drafts/ingestion-grade-e2e-stands.md) — REAL source systems + the REAL odd-collector + the platform; nothing seeded into the platform DB. Assertion model: seed a KNOWN truth in the source system, assert ODD's API + UI agree with it. Each spec self-manages its own compose project (collector registered via POST /api/collectors — the real one-shot-token flow) and tears it down with volumes. Slow by nature (source images + collector pull + ingestion wait) — its own lane, never folded into feature-complete. Part of the FULL-set regression alongside feature-complete/multi-stack/known-bugs (G-C2)."
    # IT-128 relationships pipeline: neo4j:latest GRAPH truth (5 directed typed edges → direction preserved,
    # is_directed, UNKNOWN-typed attributes) + postgres-FK ERD truth (constraint-named, child→parent,
    # cardinality + is_identifying per the adapter checkers) → API + UI (F-037, the #1752 contract through
    # the real pipeline).
    protocols: [IT-128]

