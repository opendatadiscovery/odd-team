name: AppErrorPage (controlled render helper, NOT React error boundary, NOT catch-all route)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW ENTITY, batch ZJ — the 40-line React component at
  `components/shared/elements/AppErrorPage/AppErrorPage.tsx` that
  serves as the platform UI's PER-PAGE-COMPONENT-OWNED error display
  surface. NOT a global error pane.

  **What the widget IS**:

    - A CONTROLLED render helper. Props: `{ showError: boolean;
      error?: ErrorState; offsetTop?: number = 32 }`.
    - Renders a full-viewport-height grid with a large HTTP-status-
      code on the left + status-text heading on the right + 'Return
      to the Home Page' button when `showError=true`. Returns `null`
      when `showError=false`.
    - Renders ONLY `error?.status` (numeric) and `error?.statusText`
      (RFC 7231 reason phrase). The `error.url` and `error.message`
      fields populated upstream by `getErrorResponse` are NEVER
      rendered. (The `error.message` is surfaced briefly via the
      6-second react-hot-toast `showServerErrorToast`; the error
      page does NOT recapitulate it.)
    - Falls back to localised `t('Unknown Error')` when error is
      undefined or statusText is empty.
    - 'Return to the Home Page' button is hard-coded to `to='/'`;
      no prop to redirect elsewhere.

  **What the widget is NOT**:

    - NOT a React error boundary. It is a functional component
      with no `componentDidCatch`, no `getDerivedStateFromError`.
      Synchronous JS render errors are not caught. Grep across
      odd-platform-ui/src for `ErrorBoundary|componentDidCatch|
      getDerivedStateFromError` returns ZERO matches: NO React
      error boundary exists anywhere in the platform UI.
    - NOT mounted on `path='*'` catch-all in `App.tsx`. The
      Router-DOM v6 fall-through case (a URL matching no `<Route>`)
      produces a blank page, not this widget. App.tsx:59-89
      declares exactly 11 `<Route>` entries; none has `path='*'`.
    - NOT a redux subscriber. The parent (a data-loading page
      component such as DataEntityDetails / TermDetails / Search /
      Alerts) reads the redux `loader` slice via
      `getXxxFetchingStatuses` / `getXxxFetchingError` selectors
      and conditionally renders `<AppErrorPage>` when the relevant
      async thunk has rejected.

  **23 caller files mount the widget consistently** (per the
  per-page-component-owned ADR — `<AppErrorPage showError=
  {isXxxNotFetched} error={xxxFetchingError} />`). The full
  list: DataEntityDetails, TermDetails, Search/Results, AlertsList,
  ActivityResults, Directory, DataSourceList, Entities, TestReport,
  DataEntityAlerts, ActivityResults, HierarchyLineage,
  DatasetStructureOverview, DatasetStructureCompare,
  LinkedEntitiesList, LinkedTermsList, PolicyDetails, +
  OwnerAssociations{Active,New,Resolved}, IntegrationPreviewList,
  Integration.

  **The 2-of-4 information-disclosure boundary is the load-bearing
  safety property of this widget** — but is UNDOCUMENTED in the
  code (no JSDoc, no inline comment defends the omission of `url`
  and `message`). A future 'improvement' PR adding
  `<Typography>{error.url}</Typography>` (to help operators
  identify the failing endpoint) or
  `<Typography>{error.message}</Typography>` (to surface the
  backend hint) would silently leak — backend response bodies
  (which may carry stack-trace fragments, SQL exception text, or
  echoed PII depending on backend's error formatter) would land
  in the DOM. No test exists. Probe P-176 emitted (batch ZJ).

  **The `offsetTop` prop allows callers to clear a parent's sticky
  header** — six callers pass non-default values (Search=210,
  OwnerAssociations{Active,New,Resolved}=182, IntegrationPreviewList=120).

  **react-query callers cast their error type to ErrorState** —
  Integration.tsx:33 and IntegrationPreviewList.tsx:70 pass
  react-query errors via `error as ErrorState`. The cast works
  at compile time but produces undefined behaviour at runtime if
  the react-query error shape doesn't carry status/statusText.

  **NOT a global error pane is the load-bearing limit** — its
  scope is ONLY async-thunk-rejection paths (e.g. /terms/9999 ->
  backend 404 -> fetchTermDetails rejects -> AppErrorPage shows
  '404'). The routing-layer fall-through (bare /terms, /master-data,
  any unknown URL) does NOT reach this widget; users see a blank
  page below the toolbar.
