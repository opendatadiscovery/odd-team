question: |
  What is the autocommit / transactional posture of the `Connection` returned by
  `PGConnectionFactory.getConnection()` (used at `HousekeepingJobManager.java:32`),
  and what is the resulting transactional posture of each `DROP TABLE <partition>`
  call issued from `EmptyPartitionsHousekeepingJob` for the activity table?

  Specifically: if a cycle drops 5 partitions then errors on the 6th, do the
  first 5 stay dropped (autocommit) or roll back (in-transaction)?

  Additionally: under a multi-instance race where the ShedLock window (14m/14m
  against 15m schedule) releases early on a long cycle, two instances racing to
  `DROP TABLE` the same partition — does Postgres serialise correctly, what
  error does the loser see, and does the loser's RuntimeException abort the
  remaining drops in its cycle?

stress_category: E (resource boundaries)
stress_question_ids: [Q-E.1, Q-E.4]

