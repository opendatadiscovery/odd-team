name: |-
  EXTERNAL relations are immutable to UI users — cross-method `!external` guard pattern (TagServiceImpl)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-09
  - P-10
description: |-
  NEW INVARIANT, batch VAL-LSN-019 (2026-05-20) — captures a
  three-method consistency pattern in TagServiceImpl that defends
  Collector-set EXTERNAL tags from UI-driven mutation. The pattern
  is INTENTIONAL (per the explicit BadUserRequestException messages
  in the source code) but NOT documented anywhere operator-facing
  — and the pattern has a SUBTLE GAP (the `!external` check is
  computed from `tag_to_data_entity` only, ignoring the
  `tag_to_dataset_field` origin enum).

  THE THREE-METHOD GUARD PATTERN:

    TagServiceImpl carries THREE guards across distinct methods, all
    reading the same `TagDto.external()` aggregate value to decide
    whether the operation is permitted:

      Guard 1 — `update` method (TagServiceImpl.java:49-50):
        `.filter(tagDto -> !tagDto.external())`
        `.switchIfEmpty(Mono.error(new BadUserRequestException(
        "Can't update tag which has external relations")))`
        Rejects UI tag-rename / important-flag toggle on
        Collector-set tags.

      Guard 2 — `delete` method (TagServiceImpl.java:62-63):
        `.filter(tagDto -> !tagDto.external())`
        `.switchIfEmpty(Mono.error(new BadUserRequestException(
        "Can't delete tag which has external relations")))`
        Rejects UI tag-delete on Collector-set tags.

      Guard 3 — `updateRelationsWithDataEntity` method
      (TagServiceImpl.java:102 + :109):
        Line 102: filter the read-side current relations to
          `!pojo.getExternal()` BEFORE the diff. The diff sees
          ONLY non-Collector-set relations.
        Line 109: every new relation written is hardcoded with
          `.setExternal(false)`. The UI cannot impersonate a
          Collector via this path.

    The three guards work together: Guard 1 + Guard 2 protect the
    DIRECTORY-VOCABULARY layer (the tag name/flag); Guard 3 protects
    the per-entity ASSIGNMENT layer (the tag_to_data_entity rows).
    A user with TAG_UPDATE / TAG_DELETE / DATA_ENTITY_TAGS_UPDATE
    cannot mutate any Collector-set state via the UI surface.

  THE MAINTAINER'S DESIGN INTENT (load-bearing):

    The maintainer-authored exception messages name the contract in
    user-visible language:
      - "Can't update tag which has external relations"
      - "Can't delete tag which has external relations"
    Three independent guards aligned across three methods (with
    matching code shapes) = INTENTIONAL pattern, not coincidence.

    The architectural statement is: the Collector OWNS its EXTERNAL
    bit; the UI cannot impersonate. This is the equivalent of an
    ownership model — but the "owner" is the Collector subsystem,
    not a User or a Policy.

  THE SUBTLE GAP — what the !external guard DOES NOT see:

    The `TagDto.external()` aggregate is computed at
    ReactiveTagRepositoryImpl.getDto by aggregating
    `boolOr(tag_to_data_entity.external)` across the tag's
    data-entity relations. It DOES NOT consult the
    `tag_to_dataset_field.origin` enum field — even though
    `tag_to_dataset_field` has a parallel `TagOrigin` enum
    (`INTERNAL | EXTERNAL | EXTERNAL_STATISTICS`) that carries
    the same semantic.

    A tag with ONLY INTERNAL data-entity relations but EXTERNAL
    dataset-field relations would have `external()=false` from the
    aggregate; the !external guard would PERMIT update / delete on
    such a tag — silently mutating dataset-field-side Collector-set
    state.

    The gap is a code-omission bug at the AGGREGATE-COMPUTATION
    layer, not at the guard layer. The fix is one of:
      (a) Extend the aggregate to also fold in
          `boolOr(tag_to_dataset_field.origin <> 'INTERNAL')`.
      (b) Add a parallel `dataset_field_external` field to TagDto
          and check both in each guard.

    Operator-visible: a Collector that uses `tag_to_dataset_field`
    with `origin=EXTERNAL` (the schema-stat tags) does NOT get the
    same protection as the data-entity-side Collector tags. The
    gap is INVISIBLE unless an operator notices that a dataset-field-
    tagged-as-EXTERNAL got mutated by the UI.

  THE PERMISSION-LIKE BEHAVIOUR (architectural class):

    The !external guard pattern is functionally a permission check
    expressed at the DATA-LAYER, not at the AUTH-LAYER:
      - Standard permission check: "does the user hold permission P?"
        Implemented via SecurityRule path-matching or @PreAuthorize.
      - The !external guard: "does the operand data carry the
        Collector-ownership bit?" Implemented via a row-aggregate
        filter at the service tier.

    The two mechanisms COMBINE to produce the operator-facing
    behaviour: a user holding TAG_UPDATE can update a tag UNLESS
    a Collector has marked it. The combination is NOT documented
    anywhere — operators reading the Permissions doc see ONLY the
    TAG_* permissions; they do not see the !external guard's
    second-axis defence.

  THE TEST COVERAGE GAP (CRITICAL):

    Per the TagServiceImpl sidecar's uncovered_behaviours:
      - `testUpdate_ExternalTag_ThrowsBadUserRequest` — HIGH
      - `testDelete_ExternalTag_ThrowsBadUserRequest` — HIGH
      - `testUpdateRelationsWithDataEntity_PreservesExternalRelations` — HIGH
      - `testUpdateRelationsWithDataEntity_NewRelationsExternalFalse` — MEDIUM

    There is NO TagServiceImplTest.java in the test corpus. A future
    refactor that REMOVES the `.filter(tagDto -> !tagDto.external())`
    guard would compile, pass all existing tests, and silently let
    UI users mutate Collector-owned tags. This is a
    permission-bypass regression with ZERO CI signal.

    The maintainer's intent (the three explicit BadUserRequestException
    messages) IS the architectural statement — but the test corpus
    has not pinned the intent. A regression is not detectable today.

