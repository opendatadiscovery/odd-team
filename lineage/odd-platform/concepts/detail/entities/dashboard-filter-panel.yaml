name: Dashboard Filter Panel (two-set tables-vs-tests independent filters)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-04
description: |-
  The sticky left-sidebar filter panel on the Data Quality Dashboard
  (`/data-quality`) — a TWO-set independent filter design unique to this
  page. Each set carries the SAME FIVE sub-filters (Namespace, Datasource,
  Owner, Title, Tag); the tables-side set writes the five `de*`-prefixed
  keys (`deNamespaceIds`/`deDatasourceIds`/`deOwnerIds`/`deTitleIds`/`deTagIds`)
  to scope the Table Health + Monitored Tables rings, the tests-side set
  writes the five unprefixed keys (`namespaceIds`/`datasourceIds`/`ownerIds`/
  `titleIds`/`tagIds`) to scope the Test Results Breakdown ring. Ten distinct
  keys, two independent slices, one shared form atom. NEW entity, batch ZC
  (2026-05-22) — first concept-catalog entry for the dashboard's filter tier.

  The panel is a pure form: it never fetches the dashboard itself
  (`DataQualityContent` does that) — it owns the URL `searchParams`
  round-trip (two `useEffect` hooks bi-directionally sync `formFilters` ↔
  the query string at DataQualityFilters.tsx:28-54, encoded as
  `JSON.stringify`/`parse` of the full FilterOption[] including names) and
  the per-side "Clear" buttons (write-only jotai atoms
  `clearTableFiltersAtom` / `clearTestFiltersAtom` at
  DataQualityStore.ts:44-66 — each touches only its own five keys).

  The same five filter components are reused across the two sides via a
  single `filterKey` prop typed `keyof DataQualityRunsApiGetDataQualityTestsRunsRequest`
  (NamespaceFilter.tsx:10-12); a copy-paste swap of two `filterKey` props
  would route a filter to the wrong backend parameter with no compile error
  (both prefixes are valid keys of the same union type) — and no test guards
  the wiring.

  vocabulary_status: codebase-anchored, doc-side-partially-covered. The live
  https://docs.opendatadiscovery.org/features/data-quality/dashboard
  (WebFetched 2026-05-22 status 200) names the five filter dimensions and
  the tables-vs-tests independence verbatim; it does NOT document the URL
  deep-linking, the two-Clear-button design, the autocomplete search, or
  the load-bearing Title-binds-to-ownership-title semantic. The dashboard
  doc covers the read surface and is silent on the operator's primary
  INTERACTION surface — three independent doc gaps.
vocabulary_status: codebase-anchored, doc-side-partially-covered
