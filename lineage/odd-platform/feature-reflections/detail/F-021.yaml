  hypothesis_id: H-008
  emitted_by: feature-reflector
  status: pending-reflection-verification
  local_execution_blocked: false
  hypothesis_text: |
    When the user scrolls the Activity feed (cursor pagination on lastEventId+lastEventDateTime),
    page N+1 returns strictly-older rows newest-first without skipping or duplicating any row, even
    under sustained write rate (>=100 events/sec). Static analysis shows the asymmetric precision
