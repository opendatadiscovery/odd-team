proposed_action: |-
  Add `PolicyValidationErrorMappingTest.createPolicy_malformedJsonBody_currentlyReturns500_pinsBugBeforeFix` as a WebFluxTest. (a) Authenticate as a user with `POLICY_CREATE` permission. (b) POST `/api/policies` with body `{"name": "P", "policy": {"foo": "bar", "id": 42}}` (extra `id` field violates `additionalProperties: false` per policy_schema.json:15). (c) Assert HTTP 500. (d) Assert response body is the generic `Internal Server Error` text, NOT the validator's detailed error message. (e) Add a `// REGRESSION-PIN — Malformed policy bodies currently return HTTP 500 with generic body. The fix is one-line: change PolicyJSONValidator to throw BadUserRequestException (or add ControllerAdvice handler for IllegalArgumentException). Once fixed, this test must be REPLACED with: assert HTTP 400 + body contains the validator error message.` comment block. Pair with a test for the SAME malformed body on `PUT /api/policies/{id}` — both paths invoke the same validator at PolicyServiceImpl.java:73.
