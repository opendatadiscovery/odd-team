behaviour: |-
  Partial permission-gating invariant — the description cluster gates ONLY the Edit/Add buttons via <WithPermissions permissionTo=DATA_ENTITY_DESCRIPTION_UPDATE> at InternalDescriptionHeader.tsx:40-50 + InternalDescriptionPreview.tsx:32-40; the rendered Markdown content is universally visible to any DATA_ENTITY_VIEW holder. The placement is deliberate (read-collaborative posture) but FRAGILE — a "simplifying" refactor wrapping the entire cluster in <WithPermissions> would silently break legitimate read access for non-editors. Tests must pin (a) Edit button visible for caller WITH update permission; (b) Edit button hidden for caller WITHOUT update permission; (c) description content renders in BOTH cases.
test_class: missing-security
test_files_existing: []
test_files_proposed:
  path: "odd-platform-ui/src/components/DataEntityDetails/Overview/OverviewDescription/__tests__/OverviewDescription.permissions.test.tsx"
  name: "OverviewDescription_partialGating_editButtonGatedContentUniversal"
evidence:
  - "DataEntityDescription.md says: 'permission-gated Edit button rendering: shows Add/Edit when caller has DATA_ENTITY_DESCRIPTION_UPDATE on the entity, hides when not' — uncovered_behaviours[11]"
  - "DataEntityDescription.md says: 'description content rendering for callers WITHOUT edit permission: preview still renders, including any embedded HTML payload. The partial-gating invariant (Edit button gated, content NOT gated) is unverified. Tests should pin this explicitly to surface the gap at every regression' — uncovered_behaviours[12]"
  - "DataEntityDescription.md bugs_limitations_corner_cases.[1]: 'Permission gating is PARTIAL — only the Edit button is gated, NEVER the rendered content... a refactor simplifying the cluster by wrapping OverviewDescription in a <WithPermissions> would silently break legitimate read access for non-editors'"
  - "DataEntityDescription.md security.known_security_gaps.[2]: 'Permission-gating placement is fragile — A junior developer cleaning up the cluster by hoisting the wrapper to the parent could silently hide descriptions from non-editors'"
cross_references:
  - "TEST-GAP-421 (sibling — DataEntityDetails 3-permission vector)"
  - "F-004"
  - "P-09 read-collaborative posture"
proposed_action: |-
  Three Vitest tests rendering <OverviewDescription /> with mocked usePermissions. Case A — permission true, content present, Edit button present. Case B — permission false, content present, Edit button absent. Case C — entity has no description, permission true, Add button present. Snapshot the DOM to catch any future hoisting refactor.
