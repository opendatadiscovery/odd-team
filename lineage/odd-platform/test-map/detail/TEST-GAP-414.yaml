behaviour: '`getLineage` missing-oddrn-during-metadata-fetch race — `Optional.orElseThrow(()
  -> new RuntimeException("Entity with oddrn %s wasn''t fetched"))` (lines 152-154
  + 170-173) — if an entity is HARD-deleted between the lineage walk and the metadata
  fetch, the dtoRepository map will not contain the oddrn referenced by the edge set,
  and the assembly throws a bare RuntimeException with no error-code mapping. The
  user sees a generic 500. Unpinned; the soft-delete path mitigates this for the common
  case but the hard-delete race window is unprotected.'
