      The hooks ARE safe for current call sites — React Router's
      route declaration structurally pins where each hook can be
      called.
    - |-
      **NEW batch ZI** — the pattern is uniform across 5 confirmed
      instances; a maintainer who learns the convention reads any
      typed-wrapper hook in routes/ correctly. The architectural
      shape (typed wrapper + parseInt + cast) IS predictable, even
      if individually each is a foot-gun.
  weaknesses:
    - |-
      The type-system assertions are LIES — a future caller
      relocating the hook gets silently NaN/undefined with no
      compile-time warning. Tests would catch it; no tests exist
      (zero UI coverage per the existing
      zero-ui-test-coverage-vitest-installed-no-test-files
      invariant).
    - |-
      **NEW batch ZI** — the queryExamples instance shows a SPECIFIC
      operator-visible failure mode: AppLoadingPage hangs indefinitely
      on NaN-id URLs until the backend's 400/404 response arrives.
      A typo'd URL or stale bookmark produces an apparent-infinite-
      loading UX. Low-severity but operator-confusing.
