pillars_affected: [P-09]
surfaced_by:
  - "GithubUserHandler.md:docs_link_semantic.doc_drift_findings.[0] (Doc says token claim, code reads /user attributes)"
behaviour: |-
  **Docs claim ADMIN is determined by 'token claim'; code reads OAuth2User attributes from `/user` JSON — OIDC-vocabulary inappropriate for GitHub OAuth2 (no id_token).** Per the live OAuth2/OIDC docs WebFetched 2026-05-19 status 200: 'admin-attribute - Specifies which token claim determines admin status'. The code reads `user.getAttribute(adminAttribute)` (GithubUserHandler.java:57) — these are the OAuth2User's `getAttributes()` map, populated by `DefaultReactiveOAuth2UserService.loadUser(request)` from GitHub's `/user` JSON response — NOT id_token claims (GitHub OAuth2 does NOT issue an id_token). The framing 'token claim' is OIDC-inherited from Google/OIDC handler docs and is technically wrong here. Severity: LOW doc-drift (operationally a non-issue; the documented config keys work as intended). The test pins the actual source of `admin-attribute` lookup so any future change in attribute source (e.g. switching to id_token if GitHub ever issues one) is detected.
test_class: missing-edge-case
test_files_existing: []
test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/auth/handler/GithubUserHandlerAttributeSourceTest.java"
  name: "enrichUser_adminAttribute_readFromOAuth2UserAttributes_NotFromIdTokenClaim"
evidence:
  - "GithubUserHandler.md says (doc_drift_findings.[0]): 'Doc says ADMIN is determined by token claim; code says /user attributes. The framing token claim is OIDC-inherited from Google/OIDC handler docs and is technically wrong here.'"
  - "GithubUserHandler.java:57 (user.getAttribute(adminAttribute))"
  - "Live OAuth2/OIDC docs WebFetched 2026-05-19 status 200 (the misleading 'token claim' framing)"
cross_references:
