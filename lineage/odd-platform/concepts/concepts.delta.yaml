new_index_entries:
  operations:
    - slug: create-tag
      name: Create Tag (bulk, fail-on-duplicate)
      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
        - controllers
        - openapi_tags
      nodes_count: 2
      contributors_count: 2
      security_aggregate_overall: MEDIUM
      performance_aggregate_overall: MEDIUM
      description: |-
        POST /api/tags — bulk tag-vocabulary create (BulkTagFormData, an array of
        TagFormData). FAIL-ON-DUPLICATE not upsert: the inherited
        ReactiveAbstractCRUDRepository.bulkCreate has no ON CONFLICT clause, so a
        name colliding with a non-deleted directory row raises
        UniqueConstraintException. The deliberate counterpart to the upsert-shaped
        Collector-path getOrInjectTagByName. Gated by TAG_CREATE (Management scope).
        Two drifts — returns HTTP 200 vs the OpenAPI-declared 201; returns a nested
        reactive Flux<Tag> vs the declared static TagList. In-batch duplicate
        atomicity is UNVERIFIED — probe P-026.
      detail_path: detail/operations/create-tag.yaml
    - slug: update-tag
      name: Update Tag (rename + Important-flag toggle, search-vector-symmetric)
      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
        - controllers
        - openapi_tags
      nodes_count: 2
      contributors_count: 2
      security_aggregate_overall: MEDIUM
      performance_aggregate_overall: MEDIUM
      description: |-
        PUT /api/tags/{tag_id} — renames a Tag and/or toggles its important flag,
        gated by TAG_UPDATE (Management scope). The search-index-consistent
        counterpart to the asymmetric delete path: updateSearchVectors refreshes
        all THREE FTS vectors (entity tag_vector + dataset-structure + term-side),
        whereas delete refreshes only one. Limitations — returns HTTP 200 vs the
        declared 201; the response Tag omits external/usedCount (bare-pojo mapper
        overload); the !external guard reads only the tag_to_data_entity aggregate;
        a TOCTOU window exists between getDto and update.
      detail_path: detail/operations/update-tag.yaml
    - slug: replace-all-term-tag-relations
      name: Replace-All Term Tag Relations (term-side, no external carve-out)
      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
        - controllers
      nodes_count: 1
      contributors_count: 1
      security_aggregate_overall: MEDIUM
      performance_aggregate_overall: MEDIUM
      description: |-
        PUT /api/terms/{term_id}/tags (operationId createTermTagsRelations) — the
        term-side member of the tag-relation write trio. Two-phase
        delete-then-recreate: phase 1 hard-deletes every tag_to_term row whose name
        is absent from the submitted list, phase 2 auto-creates novel names and
        re-inserts the full set. Gated by the DEDICATED TERM_TAGS_UPDATE permission.
        DISTINCT from the data-entity path — NO activity-feed event and NO
        external-tag carve-out (tag_to_term has no external/origin column). The
        create*-shaped operationId is replace-all; an empty list silently clears
        all term tags (probe P-027).
      detail_path: detail/operations/replace-all-term-tag-relations.yaml
    - slug: replace-internal-dataset-field-tag-relations
      name: Replace Internal Dataset-Field Tag Relations (origin-scoped delete-then-recreate)
      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
        - controllers
      nodes_count: 1
      contributors_count: 1
      security_aggregate_overall: MEDIUM
      performance_aggregate_overall: MEDIUM
      description: |-
        PUT /api/datasetfields/{dataset_field_id}/tags (operationId
        updateDatasetFieldTags) — the dataset-field-side member of the tag-relation
        write trio. Delete-all-then-recreate scoped to origin = INTERNAL: EXTERNAL
        and EXTERNAL_STATISTICS (ingestion-sourced) relations survive. Authorization
        is PARENT-SCOPED — the dataset-field id resolves to its owning data entity,
        then DATASET_FIELD_TAGS_UPDATE (a DATA_ENTITY-scoped permission) is
        evaluated. Carries the most-complete activity-feed audit of the trio. The
        relation INSERT relies on the DB column default for the unset origin field
        — a CRITICAL untested fragility, probe P-030.
      detail_path: detail/operations/replace-internal-dataset-field-tag-relations.yaml
  invariants:
    - slug: term-tag-relation-has-no-external-carve-out
      name: Term-tag relation has NO external/origin carve-out — tag_to_term replace-all removes every relation
      canonical_in_docs: false
      canonical_candidate: true
      axes_present:
