mitigations_unimplemented:
  - |-
    Add `onClick={handleAppMenuOpen}` to the button at
    AppInfoMenu.tsx:78-82. One line. Restores keyboard activation
    (MUI IconButton supports Enter/Space on click handler by default).
  - |-
    Optionally add explicit `onKeyDown` handler for arrow-key
    navigation within the open menu (lower priority — MUI Menu
    handles this once activated).
