notes: |-
  Operation vocabulary captured for the lineage-variant /my* triplet. The
  operation is materially distinct from:
    (a) listByOwner (the canonical owner-scoped read — JOIN-side defended
        at ReactiveDataEntityRepositoryImpl.java:515-534) — used by
        getMyObjects;
    (b) the per-entity lineage read at /api/dataentity/{id}/lineage — uses
        the recursive-CTE variant with LineageDepth bound + depth-1 fan-out;
    (c) the DEG-anchored lineage read at /api/dataentitygroups/{id}/lineage
        — uses the simpler getLineageRelations(List<String>) without
        recursion at the edge layer.

  The architectural posture "anchor + expand + exclude" is the
  defence-in-depth primitive the platform supports — proves the project
  knows how to scope by owner via the anchor-set pattern; the absence of
  redundant JOIN-side filtering at the derived-set layer is the
  single-point-of-failure documented at REFACTOR-225.

  Cross-references:
    - REFACTOR-225 anchor-set single-point-of-failure (invariant) — the
      security finding this operation is the primary surface for.
    - DOC-GAP-099 OpenAPI summary inverse-semantic (invariant) — the
      contract finding this operation is the primary surface for.
    - LineageDepth.empty() sentinel magic-number encoding (invariant) —
      the naming-fragility finding this operation depends on.
    - Owner-scoped routes — controllers take NO principal parameter
      (invariant) — the ADR-CANDIDATE-015 controller-shape this
      operation's three endpoints (getMyObjects, getMyObjectsWithUpstream,
      getMyObjectsWithDownstream) jointly anchor.
    - Anchor-set defence-in-depth — positive vs negative cases (invariant)
      — the platform-level pattern this operation IS the positive-case
      embodiment of.
