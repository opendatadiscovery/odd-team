surfaced_by:
  - 'AppInfoMenu.md:tests_coverage_semantic.uncovered_behaviours.[7] (When auth.type=DISABLED, an anonymous viewer of the SPA root URL sees the projectVersion in the toolbars About menu — security; MEDIUM; Paired with AppInfoControllers REFACTOR-185 19th-sidecar finding)'
behaviour: |-
  **Under `auth.type=DISABLED`, AppInfoMenu surfaces the deployment's
  `appInfo.projectVersion` (the platform's running version string) to
  ANY anonymous network caller who can reach the SPA root URL.** No
  authentication is required to retrieve this datum. The version
  string identifies the running platform version exactly (e.g.
  "1.7.3") and exposes a reconnaissance signal to network attackers
  who can map versions to known CVEs.

  This is the UI confirmation of the REFACTOR-185 family finding:
  ODD Platform's `auth.type=DISABLED` mode is silently
  open-network. The AppInfoMenu surfaces this in the toolbar's
  about-menu as soon as any user (including anonymous) opens the
  menu via the information icon. The version is fetched via
  useAppInfo() → GET /api/appInfo (AppInfoController), which under
  DISABLED returns the version verbatim with no authentication.

  The toolbar surfaces no warning to the operator that this data
  ought to be access-controlled under any deployment scenario where
  the platform is reachable beyond a trusted network. No
  documentation note. No deployment-mode guard. Severity MEDIUM
  because (a) the version disclosure is reconnaissance, not data
  exposure, (b) the realistic threat is bounded by who can reach
  the SPA, (c) the deployment-mode mistake (publishing DISABLED to a
  public network) is the operator's misconfiguration to make, not
  ODD's failure to defend.

  But: no test pins the relationship. A future change that
  ADDS authentication-gating to AppInfoController (e.g. a
  hardening change to the F-009 deployment-introspection surface)
  would not break any test today, and the AppInfoMenu would
  silently start rendering an empty version label to anonymous
  users. The test pins the current behaviour AND surfaces the
  REFACTOR-185 disclosure for operator-facing docs.
