name: FTS vector refreshed on owner-update but NOT on owner-delete
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-01
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20-P** —
  PRIMARY-SOURCE confirmed at `OwnerServiceImpl.java:69-85` (update)
  vs `:87-100` (delete). The update path refreshes BOTH FTS search
  entrypoints inside the transaction; the delete path does NOT.
  After successful owner-delete, the FTS index continues to surface
  the deleted owner's name in catalog searches until another event
  refreshes the affected entities' vectors.

  **The mechanism**:

    - `OwnerServiceImpl.update` (lines 69-85) calls
      `updateSearchVectors(owner)` at line 82 →
      `updateSearchVectors` private method (lines 109-114) does
      `Mono.zip(searchEntrypointRepository.updateChangedOwnerVectors(id),
      termSearchEntrypointRepository.updateChangedOwnerVectors(id))`.
      BOTH vectors refresh, in parallel, awaited inside the
      `@ReactiveTransactional` boundary.

    - `OwnerServiceImpl.delete` (lines 87-100) has NO
      `updateSearchVectors` call. The transactional pipeline ends
      with `ownerRepository.delete(id)` (the soft-delete UPDATE).
      The two `search_entrypoint` tables retain the deleted owner's
      name in their text-search vectors.

  **The operator-impacting consequence**: searching the catalog
  for the deleted owner's name continues to match against entities
  the owner bore. The orange-clock-stale indicator doesn't fire
  (the entities were not modified); the data-entity detail page
  still shows the deleted owner's name in the Owners section (UNLESS
  the page-render's ownership query filters `OWNER.deleted_at IS
  NULL` — which varies per query; the rendered surface depends on
  the specific query path).

  **The drift between update and delete**:

    - **Update** ensures READ-AFTER-WRITE consistency on the FTS
      surface. An UPDATE that completes guarantees searches by the
      new name return the renamed owner immediately. The trade-off
      is the response-latency cost of doing the vector refresh
      synchronously.

    - **Delete** does NOT. The trade-off is the response-latency
      cost would be the same — but the implementation skips the
      step. Whether this is an OVERSIGHT or an intentional
      decision is unclear; no comment defends the absence; no
      test pins either side.

  **Mirror of F-006 batch-K `delete_search_vector_not_refreshed`
  facet** (originally surfaced on `OwnershipServiceImpl.delete`).
  Same shape: the platform's three-table soft-delete posture
  (OWNER + USER_OWNER_MAPPING are soft-delete; OWNERSHIP +
  TERM_OWNERSHIP are hard-delete; OWNER_TO_ROLE is hard-delete)
  is paired with FTS vector materialisation that the update paths
  invalidate-and-refresh but the delete paths LEAVE STALE.

  **The cleanup path** (one-line fix):

  Extend `OwnerServiceImpl.delete` (around line 99) with:
    ```
    .then(updateSearchVectors(deletedOwnerPojo))
    .then();
    ```
    where `deletedOwnerPojo` is the soft-deleted owner row
    (resolved from the `Mono<OwnerPojo>` chain). The
    `updateChangedOwnerVectors(id)` calls already handle the
    deleted state (they look up `search_entrypoint` rows
    referencing the owner_id and recompute their vectors based on
    the current OWNER state — which post-soft-delete shows the
    owner as deleted).

  **Severity**: MEDIUM — operationally visible only via stale
  catalog search results; not a security gap, not actively
  misleading; UX inconsistency between update and delete. The
  severity rises in deployments where owner names are sensitive
  (the stale FTS vector continues to match against the deleted
  name).
