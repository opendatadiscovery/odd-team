behaviour: |-
  **`DataQualityRunsController` has ZERO HTTP-tier test coverage** — the controller is the SOLE backing endpoint of the catalog-wide Data Quality Dashboard (pillar P-04:F-002, the `/data-quality` UI route). Repository-tier tests exist but cover only 2 of 3 sub-queries (`ReactiveDataQualityRunsRepositoryTest.java:91-119` exercises `getLatestDataQualityRunsResults` + `getMonitoredTables` only — `getLatestTablesHealth` is uncovered, see TEST-GAP-985). Service tier, controller tier, and HTTP boundary are entirely unverified.

  **What's at risk**:
  - **WebFlux routing** of `GET /api/dataqatests/runs` to `DataQualityRunsController.getDataQualityTestsRuns` (`DataQualityRunsController.java:18-33`).
  - **OpenAPI-generated `@RequestParam` deserialisation of 10 `List<Long>` arrays** (`namespaceIds | datasourceIds | ownerIds | titleIds | tagIds` + 5 `de*` siblings — `openapi.yaml:1979-2078`). A regression in the generator template, the Spring `?ids=1,2,3` vs `?ids=1&ids=2&ids=3` convention, OR the int-vs-long boundary at the wire would silently break filter behaviour.
  - **Three-way `Mono.zipWith` composition** (`DataQualityRunsServiceImpl.java:36-39`) — fan-out + collect-list dance is correctness-critical; a regression that drops a slice or returns null inside the envelope is invisible at the build layer.
  - **Jackson serialisation of the nested envelope** (`DataQualityResults{testResults:[...], tablesDashboard:{...}}` — `components.yaml:3748-3800`).
  - **Mapper padding** (`DataQualityCategoryMapperImpl.java:24-30, 45-60`) — the always-36-cells contract; a regression that strips zero-count cells would break UI rendering invariants.

  Combined with TEST-GAP-984 (the LSN-019 test-vs-run drift) and TEST-GAP-985 (table-health zero coverage), the dashboard's CRITICAL slice has both a semantic-drift bug AND zero defensive coverage. A maintainer refactoring `Mono.zipWith` to a single bulk SQL would have no test catching the regression.
