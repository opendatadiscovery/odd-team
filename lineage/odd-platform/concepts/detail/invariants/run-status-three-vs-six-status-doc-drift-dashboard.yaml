batch_zg_addendum: |-
  ## STRENGTHENS — batch ZG (2026-05-26)

    Re-confirmed at the BACKEND class-level sidecar
    (DataQualityRunsController, batch ZG); now adjacent to TWO sibling
    failure modes that together form the THREE-FAILURE-ONE-ENUM cluster:

      Mode 1 (this invariant) — DOC says 3, CODE renders 6.

      Mode 2 — Wire-enum-RUNNING asymmetry: DB accepts 7 values (+RUNNING),
      wire declares 6. The DataEntityRunController endpoint returns HTTP 500
      on any result set containing a RUNNING row (MapStruct
      String→enum throw). Captured at
      `wire-enum-running-asymmetry-data-entity-run-status` THIS BATCH.

      Mode 3 — UI palette TypeError on out-of-enum status blanks dashboard
      (existing invariant
      `run-status-palette-type-error-on-out-of-enum-status-blanks-dashboard`).

    Three FAILURES, ONE ENUM. The hardening recommendation (extend the
    wire enum to match the DB by adding RUNNING, regenerate UI + backend,
    update the doc) closes ALL THREE simultaneously.

    Routes to a single REFACTOR-NNN that addresses the three together,
    with the doc-side update as the third leg of the fix.

