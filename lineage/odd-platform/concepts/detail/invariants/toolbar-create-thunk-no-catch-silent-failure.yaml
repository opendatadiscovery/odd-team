name: |-
  Catalog and Dictionary tab clicks silently fail on backend rejection — create-thunk-then-navigate handlers omit .catch()
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-02
  - P-09
description: |-
  NEW MEDIUM-severity UX INVARIANT, batch ZJ (2026-05-26) — both
  create-thunk-then-navigate handlers in `ToolbarTabs.tsx` call
  `.unwrap().then(...)` WITHOUT a `.catch(...)`. If the thunk
  rejects (e.g. backend unavailable, 5xx on the search-create
  POST), the user clicks the tab and NOTHING happens. No error
  toast, no navigation, no state change.

  **The two affected handlers**:

  (a) **Catalog tab click** (`useCreateSearch.ts:14-19` via
      ToolbarTabs.tsx:121-123):

          dispatch(createDataEntitiesSearch(initialParams))
            .unwrap()
            .then((searchId) => {
              navigate(searchPath(searchId));
            });

      No `.catch()`. If `createDataEntitiesSearch` rejects, the
      promise is silently unhandled.

  (b) **Dictionary tab click** (ToolbarTabs.tsx:112-117):

          dispatch(createTermSearch({termSearchFormData}))
            .unwrap()
            .then(({searchId}) => {
              navigate(termsSearchPath(searchId));
            });

      Same shape, same silent-failure surface.

  **The operator-visible failure mode**: the user clicks 'Catalog'
  or 'Dictionary' expecting to navigate to a fresh search session.
  If the backend is degraded (5xx) or returning unexpected data
  (4xx), the click DOES NOTHING. The user is left on their
  previous page with no error toast, no navigation, no log
  indicator. They click again — same silent no-op. Eventually
  they may refresh the page or report 'the Catalog tab is broken'
  to support, with no diagnostic information.

  **The pattern matches LSN-019 / LSN-020 silent-failure class** —
  the failure-mode where the UI surfaces nothing on a backend
  error and the operator has no path to diagnose. Both create-
  thunk-then-navigate handlers are on the critical path for a
  primary nav action; a silent failure on a primary nav action
  is the highest-leverage form of this class.

  **The other seven tabs do NOT have this problem** — they are
  pure `<Link to=...>` navigations rendered by AppLinkTab (no JS
  handler intercept). React-router-dom Link cannot fail in a
  way the user wouldn't see (the URL bar would update; the
  destination component would mount; any error there would be
  the destination's responsibility).

  **The fix is minimal — 2-line `.catch()` per handler**:

  (a) Catalog:

          dispatch(createDataEntitiesSearch(initialParams))
            .unwrap()
            .then((searchId) => navigate(searchPath(searchId)))
            .catch(err => {
              showServerErrorToast({err, message: 'Failed to start Catalog search'});
            });

  (b) Dictionary: same shape.

  Approximate cost: 4 lines, no new imports (showServerErrorToast
  is already used across the platform per the
  `app-error-page-as-error-render-surface-suppressed-toasts`
  invariant).

  **Cross-batch coherence**: this invariant is the silent-failure-
  on-nav-action sibling of the broader `tab-click-drops-session-
  state-cross-route-pattern` invariant. The latter captures the
  intentional homecoming pattern (drop URL state, mint new
  session). This invariant captures the UNINTENTIONAL silent-
  failure pattern when that mint operation fails. The two
  invariants together describe Catalog + Dictionary tab semantics
  end-to-end.
