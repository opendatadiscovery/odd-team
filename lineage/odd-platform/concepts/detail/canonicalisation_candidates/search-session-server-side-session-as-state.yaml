proposed_canonical: Search Session (server-side session-as-state)
rationale: 'NET-NEW canonical-candidate concept from batch 2026-05-12E (SearchController.search).
  The platform''s catalog-search interaction is bound to a persistent `search_facets`
  row keyed by a server-generated UUID — `POST /api/search` creates the session, returns
  counts + UUID; subsequent calls (`getSearchResults`, `getSearchFacetList`, `updateSearchFacets`,
  `getFiltersForFacet`, `highlightDataEntity`) all reference the same UUID. Sibling
  features (`/api/terms/search`, `/api/queryexample/search`, `/api/referencedata/search`)
  replicate the same pattern. Cost: unbounded `search_facets` table with PII-persistent
  query text at 30-day default housekeeping floor. main-concepts.md does not name
  this pattern; the closest doc anchor is `/features/data-discovery/search` which
  describes the user experience but not the server-side mechanism.'
contributing_concepts:
- SearchController.search creates a `search_facets` row keyed by UUID (batch E)
- Sibling search endpoints (terms/queryexample/referencedata) replicate the pattern
  (batch E)
- HousekeepingTTLProperties.search_facets_days TTL retention (batch D)
- REFACTOR-141 housekeeping default-leak intersection (TTL is operator-tuneable, defaults
  to 30 days at YAML floor; 0 days if YAML floor is overridden without re-supplying
  the block)
suggested_add_to_docs: true
