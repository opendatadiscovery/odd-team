# DEG-Anchored Lineage — product-owner reflection

## product_owner_narrative

DEG-Anchored Lineage is the "Group lineage" view inside the Data Lineage pillar (P-05). It answers one operator question: *"For this Data Entity Group — a Finance domain, an ML-experiment grouping, an ETL bundle — what does the data flow look like AMONG its member entities?"* Instead of opening the lineage of one dataset at a time and stitching the picture together by hand, an operator opens a single tab on a DEG's detail page and sees the lineage union across the group's children in one canvas (per getDataEntityGroupsLineage.md:understanding + the live data-lineage feature page, WebFetch 2026-05-19 status 200, "inspect what a group aggregates without first expanding each member entity"). The audiences are the data-engineer-analyst, data-quality-engineer, and data-scientist-ml-engineer who reason about a pipeline or a domain as a unit (per system-mission.md P-05 audiences).

The user reaches it without ever choosing it. There is no "group lineage" URL and no toggle: the same route `/dataentities/{id}/lineage` renders one of two entirely different subsystems based on the entity's class. When `entityClasses` contains `ENTITY_GROUP`, the `Lineage.tsx` dispatcher (Lineage.tsx:19-22, per Lineage.md:understanding) mounts `<DEGLineageAtomProvider><DEGLineage/></DEGLineageAtomProvider>` — a jotai-scoped subtree that fires `useDataEntityGroupLineage({dataEntityId})` → `GET /api/dataentitygroups/{id}/lineage`; for every other class it mounts `<HierarchyLineage/>`, the Redux-thunk per-entity canvas of F-005. The entity decides which lineage is meaningful; the user cannot override it (Lineage.md:implicit_adrs[0]). The API itself is a six-line controller pass-through (DataEntityController.java:275-281) onto `LineageServiceImpl.getDataEntityGroupLineage` (LineageServiceImpl.java:59-85), which resolves the transitive member set via a recursive CTE (ReactiveGroupEntityRelationRepositoryImpl.java:177-204), fetches the edges where BOTH endpoints are members, strips DEG-typed nodes, and partitions the result into one stream per connected component.

The working parts a product owner would demo: the input is just the DEG (no date filter, no depth slider, no owner filter — the endpoint declares only the path parameter, openapi.yaml:2418-2433); the output is a `DataEntityGroupLineageList` of per-connected-component subgraphs; the filtering is membership-bounded (the CTE walks nested DEGs to enumerate members, then the service deliberately filters out DEG-typed nodes themselves with the comment `// Remove this when we will support inner DEGs for DEG lineage` at LineageServiceImpl.java:71). On an empty/missing DEG the canvas shows an `EmptyContentPlaceholder` with no error toast and no retry (Lineage.md:downstream_side_effects, DEGLineage.tsx:23-25).

The integration story is dense and is where the load-bearing findings live. The DEG primitive itself is a P-01 Data Discovery entity (a `DATA_ENTITY_GROUP`-classed Data Entity); its membership graph is written by the P-01 DEG-membership feature and READ here (per the feature flow's cross_pillar_relationships P-01). The same DEG-member resolution is also exposed by a sibling S2S endpoint, `GET /ingestion/entities/{degOddrn}` (getDataEntitiesByDEGOddrn.md), which returns a flat single-level member list and — critically — returns `200 OK` with `items: []` for the exact empty-DEG condition where THIS lineage endpoint raises `404`. Two endpoints on the same platform disagree on the contract for the same input.

In a demo a product owner would highlight five edge cases an operator hits in the wild: (1) the response is a LIST of disjoint subgraphs, not a single graph — a client assuming one stream silently truncates; (2) edges that exit or enter the DEG are dropped, so "what does this domain consume from outside?" is unanswerable here by design; (3) nested DEGs are invisible in the result even though the SQL walked them; (4) a 404 means one of three different things (DEG-not-found, empty-DEG, or the ID is not a DEG at all); and (5) any authenticated user can open any DEG's group lineage regardless of ownership — the read-collaborative posture (a documented platform-wide implicit ADR per concepts.yaml "Read-collaborative cross-owner enumeration" + ADR-CANDIDATE-003), here amplified because a DEG deliberately spans owner boundaries.

