realism_caveats: |
  This probe verifies the missing-key drift HYPOTHESIS using runtime
  observation of the rendered DOM. It does NOT verify the inverse —
  that no key REFERENCED in code is FAILING SILENTLY in production for
  a user of a specific locale. A complete coverage test would enumerate
  every t('...') call site, every locale, and assert the rendered value
  matches the locale's intended translation (not the English key). That
  is a CI-class probe, not a one-off integration test. If the assertions
  PASS, the natural-keys fallback IS the de-facto contract, and the
  doc / contributing guide must state it explicitly. If the assertions
  FAIL (i.e. some locale renders a non-English string for a key absent
  from en.json), there is a hidden translation in that locale that the
  English-locale developer never sees, and a separate audit of locale
  divergence is warranted.
