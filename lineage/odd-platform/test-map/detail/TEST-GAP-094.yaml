behaviour: Controller-layer test of `PUT /api/collectors/{collector_id}/token` returning
  200 with a `Collector` body whose `token.value` is the full 40-character plaintext
  (`showToken=true` on regenerate path) — distinguishing this endpoint from list/get
  endpoints that mask via `mapValue` to `******{last6}`. Without this test, a future
  flip of `showToken` to false (or a TokenMapper change) would silently break UI copy-to-clipboard
  flows.
