  guard — batch F)
proposed_action: Build a fixture with a 3-node cycle; call with depth=10; assert response
  shape (no infinite recursion) AND DB CPU time is bounded (could be expressed as
  latency upper bound or as a count of CTE intermediate rows). The current absence
  of a cycle guard is a structural weakness; this test pins behaviour.
