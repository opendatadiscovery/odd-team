        ← HTTP-transport sibling at NotificationConfiguration.java:31-34;
        F-006 batch-K + batch-N audit-silence ENUM-ROOTED pattern
        ← notification-subsystem extension at ActivityEventTypeDto;
        F-004 batch-V markdown XSS family ← Slack mrkdwn-injection
        as 6th surface; F-007 batch-T alerts-downstream cross-feature
        ← F-007 OPEN alerts trigger F-009 outbound delivery — the
        cross-pillar feed P-07 → P-07 inside Active Platform Features).
      - SUPERSEDES=0.
      - CONFLICTS=0. No registry artefact contradicts the findings.
        Cross-batch evidence is uniformly direction-aligned.

    Probe candidates for this batch:
      (P-W-1) **Poison-message WAL replay regression test** — local
        docker-compose with PG logical replication + ODD platform;
        inject an ALERT row with `type_id` referencing a non-existent
        alert-type-name; observe WAL stream stalls with 10s back-off
        cycles + verify `pg_replication_slots.confirmed_flush_lsn`
