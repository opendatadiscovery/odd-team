behaviour: |-
  `existsByNamespace` returns TRUE when at least one non-deleted Term has the given namespace_id; FALSE otherwise; FALSE for namespaces with only soft-deleted terms. This is the namespace-delete guard at NamespaceServiceImpl.java:78 — the existence test BLOCKS namespace deletion if any active Term references it. A regression that flipped the soft-delete predicate (`STATUS != DELETED` or `deleted_at IS NOT NULL`) would either: (a) silently permit namespace deletion while live Terms still reference it (orphan-FK exposure at delete time), or (b) permanently block namespace deletion once any Term ever existed (operator confusion). Today NamespaceServiceImplTest mocks the existsByNamespace return; no test exercises the repository's actual soft-delete-aware semantic.
