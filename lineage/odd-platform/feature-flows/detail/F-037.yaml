    (1) **NEW DRIFT FACET — `?type` URL PARAM ACCEPTS ARBITRARY
    STRING; NO ENUM VALIDATION; FALLBACK TO `ALL`** (LOW,
    URL-state coercion). `Relationships.tsx:19` reads
    `const type = (searchParams.get('type') ?? RelationshipsType.ALL)
