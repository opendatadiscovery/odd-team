name: |-
  MetadataField catalogue listing is theatre-paginated — PageInfo block lies (total=size, hasNext=false), no LIMIT/OFFSET/ORDER BY, unbounded return (batch ZF)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
  - P-11
description: |-
  **NEW MEDIUM-severity INVARIANT, batch 2026-05-25-ZF** — the
  `GET /api/metadata/fields` endpoint at MetadataFieldController is
  the read surface for the custom-metadata field catalogue
  (populated as a side effect of every Data Entity custom-metadata
  creation via `MetadataFieldServiceImpl.getOrCreateMetadataFields`).
  The endpoint's response shape advertises pagination via
  `MetadataFieldList = {items, page_info: {total, has_next}}`
  (`components.yaml:2111-2120`) but THREE composing behaviours
  make the pagination theatre:

  (1) **No LIMIT / no OFFSET / no ORDER BY in the SQL** — the
      JOOQ chain at `ReactiveMetadataFieldRepositoryImpl.java:44-56`
      is `DSL.selectFrom(METADATA_FIELD).where(conditions)` with
      no pagination call and no order specification. Postgres
      returns rows in heap-scan order. The wire response carries
      the ENTIRE filtered set in one payload.

  (2) **PageInfo values are constant-mocked** —
      `MetadataFieldMapperImpl.java:30-33` constructs
      `new PageInfo().total((long) pojos.size()).hasNext(false)`.
      `total` equals `items.length` ALWAYS; `hasNext` is the
      constant `false` ALWAYS. A caller using `page_info` to
      drive pagination cannot detect overflow; the values
      describe the response, not the catalogue.

  (3) **Unbounded return** — no LIMIT means an installation with
      10K+ INTERNAL metadata fields returns ALL of them in one
      response. The UI's autocomplete (`MetadataCreateFormItem.tsx:43-51`,
      500ms debounce) fires this on EVERY keystroke; the
      amplification scales linearly with directory cardinality.

  ## THE THIRD DISTINCT PageInfo SHAPE

  The codebase now exhibits THREE distinct PageInfo-drift shapes:

    (A) `has-next-true-contract-bug-pagination-loop` (batch ZE) —
        `DataEntityList.pageInfo.hasNext` is HARDCODED `true`
        regardless of remaining rows. Third-party consumers
        pagination-loop infinitely.

    (B) `pagination-parameters-declared-but-unconstrained-at-spec-and-controller-layers`
        (cross-batch) — the page/size query params on paginated
        endpoints have no upper bound; a caller can request
        size=10000000.

    (C) **`metadata-fields-pageinfo-theatre-no-pagination-no-order-unbounded`**
        (this invariant, batch ZF) — the endpoint advertises
        pagination via PageInfo but DOES NOT PAGINATE at all;
        every call returns the entire filtered set with a
        constant-mocked PageInfo. Distinct from (A) because
        hasNext is FALSE (not TRUE), and distinct from (B)
        because there is no page/size param at all.

  The three shapes share an architectural pattern: the OpenAPI
  spec uses the same PageInfo type across many endpoints, but
  the implementation behaviour diverges in three different ways
  at three different endpoints. A consumer reading the spec sees
  uniform pagination; the runtime ships three different
  realities.

  ## THE PRIMARY-SOURCE EVIDENCE

  MetadataFieldController.java:18-24 (the controller body):
    @Override
    public Mono<ResponseEntity<MetadataFieldList>> getMetadataFieldList(
            final String query,
            final ServerWebExchange exchange) {
      return metadataFieldService.listInternalMetadata(query)
          .map(MetadataFieldList::new)
          .map(ResponseEntity::ok);
    }

  No page/size params; no pagination at the controller layer.

  ReactiveMetadataFieldRepositoryImpl.java:44-56 (the SQL):
    return jooqReactiveOperations
        .flux(DSL
            .selectFrom(METADATA_FIELD)
            .where(conditions))
        ...

  No `.limit(...)`, no `.offset(...)`, no `.orderBy(...)` —
  verified by reading the method body end-to-end.

  MetadataFieldMapperImpl.java:30-33 (the mapper):
    return new MetadataFieldList()
        .items(items)
        .pageInfo(new PageInfo()
            .total((long) pojos.size())
            .hasNext(false));

  `total = pojos.size()` (the materialised list length); `hasNext
  = false` (constant). The mapper has no access to the actual
  table cardinality; it cannot honestly populate PageInfo even
  if it wanted to.

  ## THE UI'S WORKAROUND

  The React `searchMetadata` thunk
  (`<odd-platform-ui>/src/redux/thunks/metadata.thunks.ts:78-88`)
  DISCARDS `page_info` entirely (line 84-85: `const { items } = ...`)
  and propagates only the `items` array into the Redux store. The
  UI knows (operationally, not by spec) that PageInfo is dead
  weight on the wire for this endpoint. Direct API consumers
  reading the OpenAPI spec do NOT have this knowledge.

  ## CONTRAST WITH SIBLING PAGINATED ENDPOINTS

  Genuinely-paginated endpoints in the codebase use a different
  shape — they call `ReactiveAbstractCRUDRepository.list(page,
  size, query)` which constructs a query with `LIMIT` + `OFFSET`
  AND uses a `count().over()` window to populate PageInfo.total
  honestly. Examples:
    - GET /api/owners (OwnerController.getOwnerList — paginated)
    - GET /api/titles (TitleController.getTitleList — paginated)
    - GET /api/datasources (DataSourceController.getDataSources — paginated)

  The MetadataField endpoint OPTS OUT of this convention — it
  doesn't accept page/size params at the API layer (verified by
  reading the OpenAPI spec for `/api/metadata/fields`) AND
  doesn't call the generic CRUD repository's `list` method. The
  endpoint is the OUTLIER.

  ## CONTRAST WITH THE LIVE DOCS

  No live doc page documents the Custom Metadata feature
  end-to-end (verified WebFetch 2026-05-25):
    - `/active-platform-features/metadata` — 404
    - `/active-platform-features/custom-metadata` — 404
    - `/features/data-discovery/custom-metadata` — not in sitemap
    - `/active-platform-features` (lists Activity Feed / GenAI /
      Alerting / Notifications — does NOT include custom metadata)

  The only metadata-related page is `/features/data-discovery/metadata-stale.md`
  which documents the staleness indicator only — explicitly
  silent on the catalogue, on INTERNAL vs EXTERNAL origin, on
  the autocomplete behaviour, and on the auto-create-on-miss
  semantics.

  The OpenAPI response schema (`components.yaml:2111-2120`)
  embeds PageInfo and ADVERTISES the standard paginated shape;
  the doc-side reality reinforces the OpenAPI-spec drift. An
  integrator with no UI access reading the docs+spec cannot
  infer that the endpoint is theatre-paginated.

  ## SEVERITY MEDIUM

  Functional impact:
    - SDK author implementing a load-more UI based on `hasNext`
      cannot detect overflow (`hasNext` is constant `false`)
    - Operator reading `page_info.total` cannot use it as a
      catalogue-size indicator (it equals the array length they
      already counted)
    - At scale (10K+ INTERNAL metadata fields): 10K MetadataFieldPojo
      + 10K MetadataField DTOs + wire payload per autocomplete-open
      keystroke. The auto-create-on-miss pattern at
      `MetadataFieldServiceImpl.getOrCreateMetadataFields` guarantees
      monotonic catalogue growth over deployment lifetime; the
      severity ceiling rises with deployment age.
    - No security impact (read-only catalogue)
    - No data-loss
