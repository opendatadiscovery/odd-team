discovered_from_entry_point: rest:POST/GET/PUT/DELETE /api/queryexample/** (13-endpoint controller-class surface)
description: |-
  Query Examples are the Data Modelling pillar's operator-curated artefact
  that describes how a dataset (or term) is intended to be queried.
  Operators author SQL / KQL / Spark snippets with a free-form Markdown
  `definition` describing the snippet and a `query` carrying the executable
  code body; the snippet attaches to one or more data entities (via
  `data_entity_to_query_example`) and one or more terms (via
  `query_example_to_term`). The platform surfaces a faceted-search
  session pattern (POST `/queryexample/search` creates a session UUID;
  subsequent GET/PUT operate against the session) plus paginated list +
  per-id details + reverse-lookup-by-dataset + reverse-lookup-by-term
  endpoints — 13 endpoints total on this controller, with 4 sibling
  link-CRUD endpoints on DataEntityController + TermController.

  The user-observable contract (per the live
  `https://docs.opendatadiscovery.org/features/data-modelling/query-examples`
  doc, WebFetched 2026-05-20 status 200): "Query Examples is a
  catalog-wide library of canonical query snippets…"

  The user-observable reality, per batch-V primary-source audit of the
  QueryExampleController class sidecar, surfaces THIRTEEN load-bearing
  drift facets. The most operator-relevant: (a) the documented
  7-permission grid is doc-correct but operationally split across THREE
  controllers — operators configuring `QUERY_EXAMPLE_*` permissions in
  one place will miss the cross-controller wiring; (b) 10 of 13
  endpoints have NO SecurityRule entry — every authenticated user can
  read every query example across every namespace + create/mutate
  search sessions; (c) the query body is stored verbatim and rendered
  through `@uiw/react-md-editor`'s MDEditor.Markdown in TWO UI sites,
  placing this surface as the 4TH XSS-class member of the F-004 family
  (entity description + term definition + dataset-field description +
  query example query/definition); (d) NO activity log emits on any
  Query Example mutation — query-example-create / update / delete /
  link-add / link-remove are INVISIBLE on the global Activity Feed AND
  the per-data-entity Activity tab (extends the audit-log-presence
  asymmetry canonicalisation candidate from system-mission.md).
