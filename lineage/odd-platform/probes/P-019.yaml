  - kind: sql
    query: |
      SELECT id, event_type, old_state, new_state, created_at
      FROM activity
      WHERE data_entity_id = 1019
      ORDER BY id ASC
    capture_as: race_activity_rows

  # Final ownership set — should reflect both mutations:
  # - owner_alpha at title_engineer (Tx A's change)
  # - owner_beta at title_steward (unchanged)
  # - owner_gamma at title_analyst (Tx B's addition)
  - kind: sql
    query: |
      SELECT owner_id, title_id
      FROM ownership
      WHERE data_entity_id = 1019
      ORDER BY owner_id, title_id
    capture_as: final_ownership_set

  - kind: sql
    query: |
      SELECT COUNT(*) AS now_count
      FROM activity
      WHERE data_entity_id = 1019
    capture_as: now_activity_count

oracle:
  # Sanity: both mutations succeeded.
