behaviour: |-
  **MEDIUM — Cross-cutting: ALL FIVE batch-W controllers (DataSourceController, CollectorController, NamespaceController, TagController, DatasetController) have ZERO direct HTTP-tier tests. The test coverage gap is systemic: every test currently in the repo is at the service tier (mock-based) or the repository tier (Testcontainers DB) — NO `*ControllerTest.java` exists for any of the 5 controllers. The HTTP boundary (path mapping, SecurityRule wiring, request-body parsing, reactive response shape, ControllerAdvice exception mapping) is unverified.** Primary-source confirmed across all 5 batch-W sidecars:

  - **DataSourceController**: ZERO. No `DataSourceControllerTest`, no `DataSourceServiceImplTest`, no `DataSourceServiceTest` (verified by Glob returning 'No files found'). The only test that touches DataSourceService indirectly is `DataEntityServiceTest` (mocks create/list).
  - **CollectorController**: ZERO direct controller tests. `CollectorRepositoryImplTest` (repository tier, Testcontainers) exists but does NOT exercise the controller, service, authorization gate, or token-visibility contract.
  - **NamespaceController**: ZERO direct controller tests. `NamespaceServiceImplTest` (service tier, mock-based) exists with 10 tests but does NOT exercise the controller-tier security wiring.
  - **TagController**: ZERO direct controller tests. `TagRepositoryImplTest` (repository tier, 10 tests) exists but does NOT exercise the controller's TAG_CREATE / TAG_UPDATE / TAG_DELETE SecurityRule wiring.
  - **DatasetController**: ZERO direct controller tests. `ReactiveDatasetVersionRepositoryImplTest` (repository tier, 2 tests on getDatasetVersion) exists but does NOT exercise the 4 endpoints' HTTP behaviour.

  **What the HTTP-tier tests would cover that no other tier can**:
  - **Path mapping**: does the OpenAPI-generated path actually wire to the controller method? (A refactor changing the `@RequestMapping` or `@PostMapping` annotation silently breaks the endpoint without compile-time failure.)
  - **SecurityRule wiring**: does `SecurityConstants.SECURITY_RULES` actually gate the right path → permission? (Test by calling without the permission, expecting 403.)
  - **Request body parsing**: does the OpenAPI-generated FormData unwrap correctly into the controller's `Mono<FormData>` argument? (Test by sending malformed JSON, expecting 400.)
  - **ControllerAdvice exception mapping**: does `BadUserRequestException` map to HTTP 400, `NotFoundException` to 404, `UniqueConstraintException` to 400, `CascadeDeleteException` to 400? (Test by triggering each exception and asserting the status.)
  - **Reactive response shape**: does `Mono<ResponseEntity<...>>` serialize correctly under WebFlux's reactive codec? (Test for large payloads, empty payloads, streaming.)

  **Architectural pattern**: this is the same gap class as the canonicalisation candidate at the system-mission level — the platform's controllers are intentionally thin OpenAPI-passthrough delegates, AND the test posture is intentionally service-tier mock-heavy. The HTTP boundary is the SOLE place where path mapping + auth wiring + exception mapping converge. The absence of HTTP-tier tests means refactors at the boundary are unverified.

  **Aggregate count**: 5 controllers × ~4-6 endpoints each = ~25-30 HTTP-tier endpoints uncovered.

  **Why MEDIUM not HIGH**:
  - The functional behaviour IS covered (per-controller service-tier tests catch business-logic regressions).
  - The boundary regressions are RECOVERABLE — a broken path mapping fails on first real call; the platform's deployment process catches this in staging.
  - HIGH would be inappropriate because each individual missing test is MEDIUM-LOW; the AGGREGATE is MEDIUM because the pattern is systemic.

  **Test gap shape**: regression-pin asserting that each of the 5 controllers' endpoints is reachable via WebTestClient with the documented permission and returns the documented status code. The test file is a single fixture exercising all 5 controllers' happy-paths + auth-403 paths + bad-input-400 paths. Establishes a HTTP-tier baseline for the batch-W surface.
