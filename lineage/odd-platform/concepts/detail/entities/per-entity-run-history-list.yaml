name: Per-Entity Run History (DataEntityRunList — paginated run-history read surface for one DQ test or transformer)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  NEW ENTITY, batch ZG (2026-05-25, DataEntityRunController class-level
  primary source). The paginated run-history view surfaced via
  GET /api/dataentities/{data_entity_id}/runs — the per-entity
  drill-down complement to the catalog-wide Data Quality Dashboard
  (`aggregate-catalog-wide-data-quality` operation) and the
  per-dataset Test Reports tab (F-022).

  Wire-side shape (`components.yaml:1037-1048`): DataEntityRunList =
  `{items: List<DataEntityRun>, pageInfo: {total, hasNext}}`. Each
  DataEntityRun (`components.yaml:960-980`) projects a row of
  `data_entity_task_run` joined to its parent entity: dataEntityId +
  startTime + endTime + status + statusReason + type.

  THREE UI surfaces consume this entity:
    - Dedicated `/dataentities/{id}/history` tab (TestRunsHistory.tsx)
      — page-size 100, infinite scroll, status-filter dropdown.
    - Test-report-details preview (TestReportDetailsHistory.tsx) —
      first 10 runs, no pagination.
    - Third-party API consumers reading the documented OpenAPI
      endpoint — multiplicity unbounded.

  THREE LOAD-BEARING semantic properties (the entity's quality
  surface):

    (1) CROSS-OWNER READ POSTURE: GET /api/dataentities/{id}/runs
        is NOT in SecurityConstants.SECURITY_RULES; falls through
        to `pathMatchers('/**').authenticated()`. Any authenticated
        user reads any DQ test's or transformer's history including
        `statusReason` text — diagnostic text that test frameworks
        (Great Expectations, dbt, custom) commonly populate with
        failed-row samples potentially containing PII. The 5th
        invocation site of REFACTOR-024 read-collaborative family.

    (2) WIRE ENUM vs DB ENUM ASYMMETRY: DB column accepts the
        seven-value `IngestionTaskRunStatus`
        (SUCCESS|FAILED|SKIPPED|BROKEN|ABORTED|RUNNING|UNKNOWN) but
        the wire enum DataEntityRunStatus declares only six values
        (RUNNING is missing). When a result set contains a RUNNING
        row, the DataEntityRunMapper's String→enum conversion via
        `Enum.valueOf()` throws — the runs-history page returns 500
        EXACTLY WHILE A TEST IS IN FLIGHT (the moment the operator
        most wants to see the page). Captured in
        `wire-enum-running-asymmetry-data-entity-run-status` invariant.

    (3) PAGINATION UNBOUNDED: OpenAPI `SizeParam` (components.yaml
        :4222-4229) declares int32 with no min/max. The UI ships
        size=100 (TestRunsHistory.tsx:27) and size=10
        (TestReportDetailsHistory.tsx:31); a deliberately-crafted
        curl with size=10000000 reaches the LIMIT clause as-is.

  Distinct from `per-entity-alert-listing` (the per-entity ALERT
  read surface; different OpenAPI tag, different controller,
  different data) and from `data-quality-dashboard` (the
  CATALOG-WIDE aggregate, different DTO shape).
