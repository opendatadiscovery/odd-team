feature_name: Downstream lineage traversal — default depth handling
discovered_from_entry_point: rest:GET /api/dataentities/{id}/lineage/downstream
description: 'The lineage-downstream endpoint accepts an optional lineage_depth query

  parameter. OpenAPI declares it `required: false` (so callers may omit it)

  and the live API-reference doc claims "Unset returns the platform''s

  default depth". The implementation uses primitive `int` for the parameter;

  null → autoboxing throws NullPointerException → 500. The documented

  contract is unimplementable. Batch-H adds primary-source SQL confirmation

  at the repository layer (ReactiveLineageRepositoryImpl.lineageCte lines

  150-176): the recursive CTE has NO depth cap, NO cycle guard, and NO

  JOIN-side owner filter — confirming REFACTOR-202 (cycle/diamond

  amplification) and REFACTOR-203 (cross-owner enumeration) from primary

  source.

  '
contributing_nodes:
- ts react-component:LineageGraph (Lineage tab on data-entity-detail page — shell + d3-hierarchy canvas)
- odd-platform java DataEntityController controller-method:getDataEntityDownstreamLineage
- odd-platform java LineageService.getLineage(int depth, ...)
- odd-platform java service service:LineageServiceImpl
- odd-platform java repository reactive repository:ReactiveLineageRepositoryImpl
terminal_side_effect:
  side_effect_class: page-render
  description: Returns LineageGraph payload to the lineage canvas component
  evidence: 'DataEntityController.getDataEntityDownstreamLineage → LineageServiceImpl.getLineage → ReactiveLineageRepositoryImpl.getLineageRelations(Set,
    LineageDepth, LineageStreamKind) at lines 122-131 — issues `DSL.withRecursive(lineageCte(...)).selectDistinct(parent,
    child).from(cte)`. The CTE body at lines 150-176 is the canonical recursive walk: seed selects edges touching the root
    oddrn set at depth=1; recursive step joins the CTE to lineage on the direction-appropriate field, increments depth, terminates
    when `tDepth.lessThan(lineageDepth.getDepth())` is FALSE (line 174). NO `LIMIT`, NO Postgres `WITH ... CYCLE` clause,
    NO visited-set guard, NO owner JOIN.'
  cardinality_per_call: 1
amplification_factor: 1
observed_vs_expected:
  facets:
  - facet: default-depth handling on omitted parameter
    observed: GET /api/dataentities/{id}/lineage/downstream WITHOUT lineage_depth returns 5xx (NPE)
    expected: Per live api-reference doc — 'Unset returns the platform's default depth' → 200 with default-depth result
    drift_class: spec_says_X_impl_does_Y
    provenance: MEASURED — P-008 (run R-20260519T012533Z-P-008) GETs without lineage_depth; observed last_response_status
      in [500, 599]. Batch-H primary-source SQL confirmation — the recursive CTE consumes the primitive depth via `lineageDepth.getDepth()`
      at line 174; the controller-layer NPE on null happens BEFORE the repo is reached.
  - facet: recursive-CTE cycle/diamond amplification (REFACTOR-202 — STATIC primary-source)
    observed: CTE body is `UNION ALL` (line 168) without visited-set guard or Postgres `WITH ... CYCLE` clause. Outer `selectDistinct`
      (line 127) deduplicates the FINAL result but does NOT prune intermediate CTE rows. For a depth-N diamond pattern with
      branching factor B, intermediate row count grows as O(B^N) before the outer projection prunes duplicates. For a true
      cycle (A→B→A), row growth is bounded ONLY by the depth ceiling — which itself has no repository-layer upper bound (line
      174 consumes the raw int).
    expected: Bounded cost — either visited-set guard, Postgres WITH CYCLE, or a defensive depth cap (e.g. Math.min(depth,
      MAX_LINEAGE_DEPTH))
    drift_class: structural_amplification_surface
    provenance: STATIC — primary-source verification in batch-H ReactiveLineageRepositoryImpl sidecar bugs_limitations_corner_cases[0]+[1]+[3].
      Proposed Type-7 probe — seed A→B→C→A cycle, GET lineage with depth=5, assert response time < 5s + no DB CPU spike (proposed
      local probe with docker-compose + postgres + curl).
  - facet: cross-owner enumeration without JOIN-side filter (REFACTOR-203 — STATIC primary-source)
    observed: The `lineage` table has NO owner column (schema migrations V0_0_2 + V0_0_17 + V0_0_79 confirm). The recursive
      CTE seed + recursive step filter ONLY on `is_deleted` (lines 167, 174). When invoked from `LineageServiceImpl.getLineage`
      (the lineage-canvas read path), NO owner-scoping is applied at any layer — any caller (authenticated under LOGIN_FORM/OAUTH2/LDAP;
      anonymous under DISABLED) can read the full reachable subgraph from any root oddrn, including edges into entities owned
      by other teams.
    expected: Either documented cross-owner posture OR per-owner filtering at SOME layer
    drift_class: cross_owner_enumeration_default
    provenance: STATIC — primary-source verification in batch-H ReactiveLineageRepositoryImpl sidecar bugs_limitations_corner_cases[2]
      + security.owner_scoping. Proposed Type-7 probe — seed two entities with disjoint owners + a lineage edge, GET downstream
      from owner-A's entity as owner-B's identity, assert response shape.
  - facet: anchor-set defence-in-depth (the BATCH-H NEW PATTERN)
    observed: 'TWO call sites of getLineageRelations(Set, LineageDepth, StreamKind): (A) LineageServiceImpl.getLineage (lineage-canvas
      read path) passes a single root oddrn with NO owner filter at any layer — the cross-owner enumeration surface. (B) DataEntityRelationsServiceImpl.getDependentOddrns
      (used by getMyObjectsWith{Upstream,Downstream}) resolves owner FIRST via authIdentityProvider.fetchAssociatedOwner()
      (line 26), then passes the owner''s entity-oddrn set AS THE ANCHOR with LineageDepth.empty() (depth=-1) — the seed-only
      one-hop expansion. The owner-scoping defence lives AT THE ANCHOR SET, not at JOIN time. The recursive expansion that
      follows is NOT owner-scoped: any edges reachable from the anchor set are returned, including edges into entities owned
      by other teams. The pattern works for the my-objects use case (owner''s entities are the seed, expansion reaches lineage
      neighbours they''re causally connected to) but DOES NOT generalise to the lineage-canvas use case (any-root-by-id) which
      currently has no defence.'
    expected: A consistent defence model — either (a) JOIN-side owner-aware filter, or (b) anchor-set discipline AT EVERY
      CALL SITE, not just one
    drift_class: anchor_set_defence_in_depth_partial_application
    provenance: STATIC — primary-source verification in batch-H ReactiveLineageRepositoryImpl sidecar upstream_callers + bugs_limitations_corner_cases[7]
      + LineageDepth.java:16-18 (.empty() semantics — value=-1 terminates after seed). LineageServiceImpl.getLineage is the
      NEGATIVE case (no owner-set anchor); DataEntityRelationsServiceImpl.getDependentOddrns is the POSITIVE case. Proposed
      Type-7 probe — exercise BOTH call sites with the same backend stack and assert per-call observable scope.
  - facet: NEGATIVE-case anchor-set confirmed PRIMARY-SOURCE at service tier (batch I)
    observed: 'LineageServiceImpl.getLineage (lines 87-122) has NO AuthIdentityProvider field

      (verified at lines 54-57), NO fetchAssociatedOwner call (verified anywhere in

      the method body), NO owner argument on the public interface signature (LineageService.java:11-19).

      The root is resolved by raw dataEntityId at line 92 (reactiveDataEntityRepository.getDataEntityWithDataSourceAndNamespace),

      then the recursive-CTE walk fires at line 95 with `Set.of(root.getDataEntity().getOddrn())`

      — a single-element root set with NO caller-identity scoping. The negative-case

      half of the anchor-set pattern is CONFIRMED primary-source at the service layer

      this batch enriches. Contrast: DataEntityRelationsServiceImpl.java:25-30 imports

      AuthIdentityProvider, has the field, and calls fetchAssociatedOwner() at line

      26 BEFORE invoking the same repository method.'
    expected: anchor-set discipline applied to getLineage — call fetchAssociatedOwner before resolving the root OR apply JOIN-side
      owner filter at the repository
    drift_class: anchor_set_defence_in_depth_partial_application
    provenance: STATIC — primary-source verification in batch-I LineageServiceImpl sidecar bugs_limitations_corner_cases[0]
      + security.owner_scoping (the negative case named) vs DataEntityRelationsServiceImpl.java:20, 26 (the positive case).
  - facet: no upper-bound check on lineageDepth at service tier (batch I — STATIC)
    observed: 'LineageServiceImpl.getLineage builds `LineageDepth.of(lineageDepth)` (line 96)

      and hands the primitive int directly to the repository. There is NO `Math.min(lineageDepth,

      MAX_DEPTH)` defensive clamp, NO `if (lineageDepth > MAX) throw new ...`, NO

      warning log. The controller→service boundary autoboxes Integer → int (which

      itself NPEs on null per F-005 facet 1) and the service-tier code path between

      the boundary and the repository call adds nothing. A caller passing `lineageDepth=Integer.MAX_VALUE`

      drives the recursive CTE to Postgres limits. REFACTOR-202 amplification is confirmed

      end-to-end through this service.'
    expected: defensive clamp at service tier OR depth ceiling at repository tier
    drift_class: structural_amplification_surface
    provenance: STATIC — primary-source verification in batch-I LineageServiceImpl sidecar bugs_limitations_corner_cases[2]
      + ReactiveLineageRepositoryImpl.java:174 (the recursive-step termination consumes the raw int). No probe yet — proposed
      local k6 + lineage_depth=2147483647 probe to surface the DB CPU response.
  - facet: inner-DEG suppression in getDataEntityGroupLineage (batch I — STATIC, DEG sub-flow)
    observed: 'LineageServiceImpl.getDataEntityGroupLineage (lines 59-85) filters out edges

      whose endpoint is itself a DEG (line 73) AND removes DEG-typed entries from

      the metadata dictionary (line 75). The comment at line 71 — `// Remove this

      when we will support inner DEGs for DEG lineage` — is an explicit deferred-feature

      marker. The current API contract for DEG-lineage is therefore "flat graph of

      non-DEG members, not a recursive graph of nested DEGs". A third-party caller

      building tooling on getDataEntityGroupsLineage for a DEG that contains nested

      DEGs silently observes missing edges with no contract description of why.'
    expected: documented behaviour OR backlog-citation linking the comment to a triaged item OR @Disabled regression test
      pinning the current contract
    drift_class: undocumented_carve_out
    provenance: STATIC — primary-source verification in batch-I LineageServiceImpl sidecar bugs_limitations_corner_cases[7]
      + implicit_adrs[3] (the deliberate filter as deferred-feature). Proposed local probe — seed a nested DEG (DEG-A containing
      DEG-B containing entity E + lineage edges) + GET /api/dataentitygroups/{A}/lineage + assert DEG-B does not surface in
      the response.
  - facet: UI uses anchor-set-undefended endpoints (batch J — PRIMARY-SOURCE)
    observed: |-
      The UI ALWAYS fetches via `dataEntityApi.getDataEntityDownstreamLineage`
      / `getDataEntityUpstreamLineage` (`HierarchyLineage.tsx` thunks.ts:19, 36)
      — i.e. the NEGATIVE-case endpoints (`/api/dataentities/{id}/lineage/downstream`
      + `/upstream`) confirmed at batch-I as having NO anchor-set defence
      (LineageServiceImpl.java:54-57 no AuthIdentityProvider field, line 92
      resolves root by raw dataEntityId with no owner-anchoring). The UI does
      NOT use the POSITIVE-case endpoints (`/my/upstream` + `/my/downstream`
      via DataEntityRelationsServiceImpl.getDependentOddrns which DOES call
      `authIdentityProvider.fetchAssociatedOwner()` before invoking the
      repository). CONSEQUENCE: every authenticated user (LOGIN_FORM /
      OAUTH2 / LDAP) enumerates the cross-owner lineage subgraph from the
      Lineage tab on ANY entity, regardless of owner association. Anonymous
      callers do the same under DISABLED auth. The UI is the user-observable
      realisation point for REFACTOR-203. PRIMARY-SOURCE CONFIRMED batch J
      via LineageGraph sidecar bugs_limitations_corner_cases[8] (severity
      HIGH — "the user-observable consequence of the security gap; not a UI
      bug per se, but the UI is the realisation point") + security.owner_scoping.
    expected: UI uses anchor-set-defended endpoints OR backend adds JOIN-side
      owner filter to the lineage endpoints used by the canvas
    drift_class: cross_owner_enumeration
    provenance: STATIC — primary-source verification at thunks.ts:19, 36
      (the only fetch surface in the lineage UI tree) + LineageGraph sidecar
      bugs_limitations_corner_cases[8] + security.owner_scoping. Closes
