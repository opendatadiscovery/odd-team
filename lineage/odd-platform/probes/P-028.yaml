        body: '{"tag_name_list": ["p028-race-tag"]}'
        capture_as: race_response_a
      - method: PUT
        path: /api/terms/8002/tags
        body: '{"tag_name_list": ["p028-race-tag"]}'
        capture_as: race_response_b
observe:
