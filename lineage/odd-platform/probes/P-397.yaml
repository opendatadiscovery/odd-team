realism_caveats: |
  This probe measures the DISCLOSURE, not the data. Under an /api/info outage the backend still
  resolves the shared sentinel and the favorites bucket is still instance-wide
  (CurrentUserIdentityResolver.java:26-29) — nothing about the stored data changes. The finding, if
  H2 confirms, is that the operator is not told, in exactly the mode where the platform's own
  documentation posture says they must be.

  The 300 ms early sample is timing-sensitive: on a warm machine /api/info can resolve inside it
  even with the 1500 ms route delay if the delay is applied after the response is already cached by
  a previous context. A fresh browser context per act step is mandatory; if `early_label` already
  reads "(shared)", H1 is UNPROVEN rather than disproven — re-run with a longer delay.

  H1 alone is cosmetic and would not justify a change on its own. H2 is the load-bearing half; if
  H1 fails and H2 holds, record only H2.

  The same `appInfo?.authType === 'DISABLED'` gate is used by FavoritesColumn.tsx:46,
  RecentlyViewedColumn.tsx:32 and Overview.tsx:27, so a confirmed H2 is a CLASS finding across four
  surfaces, not a FavoritesFilter defect. Route it accordingly — the fix belongs at the hook or at
  a shared `useIsSharedFavoritesBucket()` seam, not in this component.
