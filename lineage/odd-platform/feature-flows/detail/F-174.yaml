notes: |-
  Minted from ui-review-2026-05-26 slice H. F-174 is the operator-side
  CLAIM of audit visibility within the OwnerAssociations UI subtree.
  The load-bearing finding is the drift facet
  `history_tab_only_audits_owner_association_request_flow_not_direct_user_owner_mapping_writes`
  — if confirmed, an operator who trusts the History tab to enumerate
  ALL user-owner binding events is SILENTLY MISSING the F-172 direct-
  bind and F-173 unbind events. Highest-leverage backend probe.

  The RequestStatus fallback-to-pending finding (drift facet 2) is a
  minor robustness gap but observable in the .tsx without any backend
  read.
