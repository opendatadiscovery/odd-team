  - "REFACTOR-NNN candidate: emit TAG_ASSIGNMENT_UPDATED from ingestion-path tag mutations"
proposed_action: |-
  Testcontainers integration test. (a) Submit an ingestion payload via POST /ingestion/entities with a new Tag attached to a data entity. (b) Verify the tag row is created in `tag` table AND the relation is created in `tag_to_data_entity`. (c) Query the activity-feed table for TAG_ASSIGNMENT_UPDATED events for that entity within the request window. Assert: ZERO events. (d) Mirror: submit the same change via DataEntityServiceImpl.upsertTags (UI path). Assert: ONE event present. (e) Test comment: 'PINS the audit asymmetry. Future REFACTOR-NNN that adds @ActivityLog to ExternalTagIngestionRequestProcessor would FLIP this test to expect the event.'
