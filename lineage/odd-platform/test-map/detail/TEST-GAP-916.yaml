proposed_action: |-
  Add `DataQualityFetchMultiplicityTest` under `odd-platform-ui/src/components/DataQuality/__tests__/`. Four pinning methods:
  (a) `plainOpen_firesExactlyOneFetch`: mount <DataQuality> at /data-quality with no query params; spy on dataQualityRunsApi.getDataQualityTestsRuns; assert called exactly once.
  (b) `deeplinkOpen_firesAtMostTwoFetches_pinsLSN017Multiplicity`: mount <DataQuality> at /data-quality?deNamespaceIds=[{id:1,name:"prod"}]; assert called 1 or 2 times (current state may legitimately be either). If 2, also assert the FIRST call had params={} and the SECOND call had params={deNamespaceIds:[1]} — PINS the order-of-effects.
  (c) `filterChipToggle_firesExactlyOneAdditionalFetch`: mount with empty URL; spy.resetHistory; select a chip; assert exactly 1 additional fetch.
  (d) `noopFilterChurn_doesNotFireAdditionalFetch`: mount with one chip selected; spy.resetHistory; "re-select" the same chip (write the same value into the atom); assert ZERO additional fetches (react-query dedupes identical keys).

  Add a `// REGRESSION-PIN — DataQualityContent.tsx:24 + DataQualityFilters.tsx:28-43 — the dashboard fetch multiplicity. Plain open = 1; deeplink open = 1 or 2 (LSN-017 class — pin the current state); filter toggle = +1; no-op = +0. If you refactor the mount useEffect to run BEFORE first render, the deeplink case becomes 1 — that is a perf improvement, but this test forces the maintainer to acknowledge the change.` block.
