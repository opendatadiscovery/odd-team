proposed_action: |-
  Add `DataSourceImplicitNamespaceCreationSideDoorTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `registerDataSource_withNeverSeenNamespaceName_succeedsForUserHoldingDataSourceCreateButNotNamespaceCreate_pinsCurrentBypass` — authenticate as a user with DATA_SOURCE_CREATE only; POST `/api/datasources` with `namespaceName: 'fresh-namespace-' + UUID.randomUUID()`; assert HTTP 200 with new datasource id; assert `SELECT COUNT(*) FROM namespace WHERE name = ?` returns 1. PIN the bypass.
  2. `updateDataSource_withNeverSeenNamespaceName_succeedsForUserHoldingDataSourceUpdateButNotNamespaceCreate_pinsCurrentBypass` — sister test on the update path. PUT `/api/datasources/{id}` with a new namespaceName; assert namespace is created.
  3. `registerDataSource_withExistingNamespaceName_doesNotCreateDuplicate_pinsGetOrCreateContract` — POST `/api/datasources` with an existing namespaceName; assert the existing namespace id is used (no duplicate row created). PIN the get-half of the getOrCreate semantic.

  Pair with REFACTOR-223-extension follow-up: split `namespaceService.getOrCreate` into separate `get` and `create` at the 4 sister services; require NAMESPACE_CREATE for the create branch. When the fix lands, tests #1 and #2 invert to assert HTTP 403.

  Cross-pair with DOC-NNN: surface the side-door in the Datasources tab doc page — RBAC architects authoring policies need to see this to avoid the cliff.
