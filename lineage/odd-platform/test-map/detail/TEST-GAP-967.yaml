behaviour: |-
  **MEDIUM — `GET /api/datacollaboration/providers/slack/channels?channel_name=<X>` filters by `channel.name.startsWith(X)`, NOT `contains` / `fuzzy`. A user typing the middle of a channel name (e.g. `platform` to find `#odd-platform-alerts`) returns zero results despite the channel existing in the bot's joined set.**

  Verified at primary source: `SlackMessageProviderClient.java:50-55`:
  ```java
  return cache.get(SENTINEL).thenApply(channels ->
    channels.stream()
        .filter(c -> c.name().startsWith(nameLike))
        .toList());
  ```

  **Operator-visible UX consequences**:
  - User types `platform` in the channel autocomplete → expects autocomplete to surface `#odd-platform-alerts`, `#data-platform-team`, `#core-platform-engineering` → gets EMPTY autocomplete list.
  - User then types `odd-platform` (the prefix) → autocomplete works → user learns the implicit prefix-only contract by trial-and-error.
  - Slack's own channel autocomplete (`#`-typeahead in the desktop app) uses `contains` matching — the ODD platform autocomplete is INCONSISTENT with Slack's UX norms.
  - Documentation: the live api-reference page describes `channel_name` as 'optionally filtered by `channel_name`' — does NOT state the filter is `startsWith` (per sidecar's doc_drift_findings.[3]).

  **The 500ms debounce compounds**: `SlackChannelsAutocomplete.tsx:43-54` dispatches a fresh API call on every debounced keystroke. A user typing 'platform' (8 chars) dispatches up to 8 cache-fronted requests, all returning empty — the user sees the empty list flicker for 4+ seconds before giving up.

  **Why MEDIUM**: the failure mode is UX-shaped (the channel exists, user just can't find it). But (a) the Discussions sub-feature is OPT-IN and operator-facing-only; (b) the workaround (type the channel prefix) is discoverable; (c) the silent contract drift erodes operator confidence in autocomplete reliability.

  **Distinguishes**: no prior TEST-GAP covers this specific filter contract. NET-NEW.
