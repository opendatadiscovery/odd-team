proposed_action: |-
  Add `DataQualityContentUnknownRunStatusTest` under `odd-platform-ui/src/components/DataQuality/__tests__/`. Use Vitest + React Testing Library + MSW to mock `GET /api/dataqatests/runs`. Three pinning methods:
  (a) `renderDashboardWithUnknownStatus_doesNotCrash`: mock the endpoint to return one category whose `results` contains `{status: "PENDING", count: 5}` plus the 6 known statuses. Render `<DataQuality>` inside a `<MemoryRouter>`. Assert the dashboard renders without throwing — the three DonutCharts mount, the category card renders, and either the unknown status is silently excluded (current intended-by-fallback behaviour) OR rendered with `palette.dataQualityDashboard.unknown` (the fallback intent the `??` operator implies). The test FORCES the maintainer to decide which is correct.
  (b) `renderDashboardWithUnknownStatus_breakdownTotalIsConsistent`: same mock — assert the `Test Results Breakdown` ring's total equals the sum of all status counts INCLUDING the unknown one (the operator must not see a "lying total" that excludes the unknown count silently).
  (c) `renderDashboardWithUnknownStatus_legendShowsAllStatusesIncludingUnknown`: assert the legend renders an entry for the unknown status (or pins the deliberate exclusion).
  Add a `// REGRESSION-PIN — DataQualityContent.tsx:47-48 — palette.runStatus[status].color throws TypeError on out-of-enum status. The ?? fallback is mis-written (guards missing .color, not missing entry). This test pins that the dashboard SURVIVES an out-of-enum status. If the maintainer ever adds a new DataEntityRunStatus value to components.yaml:1407-1415, this test forces them to also extend palette.runStatus in interfaces.ts:55.` comment block.
