behaviour: '**Lock-id-collision detection across subsystems** — no behaviour validates
  that `senderMessageAdvisoryLockId != receiveEventAdvisoryLockId` nor that neither
  collides with `partition.advisory-lock-id=90` or `notifications.wal.advisory-lock-id=100`.
  Shipped defaults (90/100/110/120) are disjoint; operator override can collide silently,
  breaking two subsystems on the same advisory lock. 3-sidecar evidence cross-subsystem
  (DataCollaborationProperties + NotificationsProperties + ActivityTablePartitionManager).'
