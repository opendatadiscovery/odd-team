  description_excerpt: 'Manual Object Tagging is the operator-facing capability listed
    in

    system-mission.md P-01''s sub-feature seed as "Manual Object Tagging (3

    TAG_* permissions)". Users apply tags to data entities (and to dataset

    fields and terms) via the UI''s tag-assign surfaces; collectors push tags

    with their ingested entities via the S2S ingestion pipeline. The Tag

    directory itself is a global, namespace-free vocabulary surfaced via

    `GET /api/tags` (the Catalog Overview''s Top-Tags strip + the tag-search

    facet) and the tag-dropdown on every entity-detail page. The directory

    CRUD lives behind the `tag` OpenAPI…'
