security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      Asymmetrical: four reads (getDataEntityDataQATests, getDatasetTestReport,
      getSLA, getDatasetSLAReport) have NO SecurityRule entry; the lone mutation
      (setDataQATestSeverity PUT) is gated via SecurityConstants.java:243-246
      with the DATA_ENTITY AuthorizationManagerType + DATASET_TEST_RUN_SET_SEVERITY
      permission. Read-collaborative posture (ADR-CANDIDATE-003) extended to
      a new feature surface; the deliberate registration of exactly ONE rule
      (not five) is the intent_anchor.

      Batch ZC: the catalog-wide UI surface (GET /api/dataqatests/runs via
      DataQualityRunsController) likely follows the same read-collaborative posture
      (P-090 PROBE-NEEDED — DataQualityRunsController not yet enriched); the UI
      route /data-quality has NO WithPermissionsProvider wrapper at App.tsx:73
      (vs the wrapped /lookup-tables sibling at App.tsx:75-88) — frontend tier
      ungated.
  owner_scoping:
    verdict: MIXED
    detail: |-
      Reads BYPASS owner-scoping at the repository tier — ReactiveDataQualityRepositoryImpl
      applies only HOLLOW.isFalse() + STATUS != DELETED filters with no OWNERSHIP
      join. The lone PUT (setDataQATestSeverity) RESPECTS owner-scoping via the
      DATA_ENTITY SecurityRule — caller must be associated with one of the
      dataset's owners.

      Batch ZC: the catalog-wide dashboard fetch is owner-unscoped at the UI tier
      (no current-user predicate); backend SQL joins OWNERSHIP only when the operator
      supplies owner/title FILTER ids (user-driven filter, NOT principal-derived scope).
      Consistent with the read-collaborative posture, now triangulated across
      per-dataset (DataQualityController) + catalog-wide (dashboard) surfaces.
  strengths:
    - |-
      The PUT is consistently gated through the centralised SecurityConstants.SECURITY_RULES
      table — not through method-level annotation; the authorization wiring follows the
      platform-wide convention.
    - |-
      existsIncludingSoftDeleted as the existence-check primitive — soft-deleted datasets
      still surface their historical DQ signal for forensic/audit workflows.
  weaknesses:
    - |-
      Four read endpoints unscoped — any authenticated user reads per-dataset DQ tests,
      test reports, SLA report, and SLA PNG badge for ANY dataset by id. New invocation
      sites of the REFACTOR-024 cross-owner-read family (severity MEDIUM); the live
      /features/data-quality docs are silent on access control.
    - |-
      Under auth.type=DISABLED, all five endpoints become anonymously reachable —
      the DISABLED-mode blast radius (REFACTOR-185 family) extends to per-dataset
      DQ data and SLA colours. Batch ZC: same blast radius extends to the catalog-wide
      dashboard at /data-quality.
    - |-
      The SLA PNG endpoint is cross-origin embeddable (image/png; no @CrossOrigin,
      no Cache-Control restrictions). A malicious page can img-tag the SLA badge
      cross-origin to leak the colour for a known dataset id (severity LOW-MEDIUM
      depending on operator's sensitivity classification of the SLA colour).
    - |-
      setDataQATestSeverity uses onDuplicateKeyUpdate at ReactiveDataQualityRepositoryImpl.java:90-101
      — idempotent in outcome but NO ActivityEvent emission, NO audit log, NO last_modified_by.
      Severity-change history is unrecoverable post-fact (audit-log presence asymmetry
      instantiated on the DQ surface).
    - |-
      Batch ZC: the catalog-wide dashboard route /data-quality is mounted bare at
      App.tsx:73 with no WithPermissionsProvider (vs the wrapped /lookup-tables
      sibling at App.tsx:75-88) — frontend gives no UI-tier permission gate; whether
      the backend GET /api/dataqatests/runs is gated is PROBE-NEEDED (P-090).
  cross_file_inconsistencies:
    - |-
      Per-method authorization choices are CONSISTENT with platform-wide patterns:
      reads cross-owner, mutations owner-scoped — but the read-collaborative
      posture is undocumented on the live data-quality landing page (same shape
      as alerting/lineage doc drift). Batch ZC: the dashboard.md sub-page also
      silent on access control (triangulated).
  contributing_files:
    - DataQualityController.md
    - DataQualityContent.md
    - DataQuality.md
  evidence:
    - DataQualityController.md:security.known_security_gaps.[0] (cross-owner reads — REFACTOR-024 family extension)
    - DataQualityController.md:security.known_security_gaps.[1] (PNG cross-origin embeddability)
    - DataQualityController.md:security.known_security_gaps.[2] (DISABLED reach)
    - DataQualityController.md:bugs_limitations_corner_cases.[4] (audit-trail absence on severity changes)
    - DataQualityContent.md:security.known_security_gaps.[0] (catalog-wide dashboard ungated at UI tier)
    - DataQuality.md:bugs_limitations_corner_cases.[0] (App.tsx:73 bare route vs gated /lookup-tables sibling)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      GET /api/datasets/{id}/dataqatests + GET /api/datasets/{id}/test_report fire on
      every dataset-detail-page 'Test reports' tab activation per the live data-quality.md
      page — per-render cost compounds linearly with catalog navigation —
      DataQualityController.java:25-39
    - |-
      GET /api/datasets/{id}/sla PNG endpoint is potentially embedded in BI dashboards
      per the live sla-statuses.md page; for a dashboard with N tiles each pulling SLA
      for a different dataset, request fan-out is N per render. PNG bytes cached at the
      resolver layer (CachingByteArraySLAResourceResolver.java:15) so per-request cost
      is SQL aggregation + byte-array copy; PNG-file IO is NOT per-request.
    - |-
      Batch ZC: GET /api/dataqatests/runs (the catalog-wide dashboard endpoint) fires
      once per /data-quality mount and on every filter change / window-focus
      (react-query default staleTime 0). Backend fans out to THREE repository queries
      zipped server-side (DataQualityRunsServiceImpl.java:36-39). Per-filter-chip-toggle
      cost is one multi-CTE multi-join SQL execution — no debounce, no Apply gate
      (captured in `live-filter-no-apply-gate-multi-cte-sql-per-chip-toggle` invariant).
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      No batch / bulk variant — setDataQATestSeverity operates on a single
      (test, dataset) pair per call; an operator setting severities for 50
      tests issues 50 PUTs. All four reads are reactive Mono with no
      streaming / chunked alternative. Catalog-wide dashboard fetch is also
      single-aggregate (one DTO; no per-ring or per-category lazy loading).
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      getDataEntityDataQATests returns the full list of DQ tests for the dataset —
      no page / size parameters in the OpenAPI spec at openapi.yaml:1932-1947.
      A dataset with thousands of tests returns thousands of rows in one response;
      UI must render all at once. The catalog-wide dashboard endpoint
      (openapi.yaml:1973-2087) also declares no pagination — testResults is the
      full category set; bounded in practice at ~6, but the contract has no clamp.
  strengths:
    - |-
      All four reads are reactive (Mono/ResponseEntity) — non-blocking I/O end-to-end
    - |-
      Single DB round-trip per request for getDatasetTestReport, getSLA, getSLAReport;
      two parallel sub-queries (severities + dimensions) zipped for getDataEntityDataQATests
    - |-
      PNG resolver caches all 3 SLA images at bean init (CachingByteArraySLAResourceResolver.java:30-42)
      — total cached bytes ~3-6 KB; no per-request file IO
    - |-
      setDataQATestSeverity is @ReactiveTransactional — existence check + upsert
      run in a single reactive transaction (DataQualityServiceImpl.java:63-81)
    - |-
      Batch ZC: the catalog-wide dashboard is a single-fetch aggregate — all rings
      reflect the same filter application at the same instant; no partial-load skew.
      The three backend queries are zipped server-side, saving network round-trips.
  weaknesses:
    - |-
      No pagination on getDataEntityDataQATests — full list of DQ tests for a dataset
      in one response; no @Max, no client-side hint, no server-side clamp
      (severity MEDIUM)
    - |-
      No HTTP caching headers (Cache-Control, ETag, Last-Modified) on any response —
      every UI tab activation and BI-dashboard render hits the platform fresh.
      For the PNG endpoint the response is fully determined by (datasetId,
      current_test_states) — an ETag derived from underlying state would let BI tools
      cache the badge (severity LOW-MEDIUM depending on BI-render frequency)
    - |-
      Default-MAJOR fallback for unset severities (ReactiveDataQualityRepositoryImpl.java:142-148)
      inflates SLACalculator work — every unset test contributes to MAJOR weight
      calculation through the hierarchical Counter arithmetic (severity LOW)
    - |-
      No method-level observability — no @Timed, no Micrometer counter, no structured
      log; latency regressions on hot paths surface only in WebFlux/DB metrics
      (severity LOW)
    - |-
      Batch ZC: the catalog-wide dashboard re-fetches on every single filter chip
      toggle (no debounce, no Apply gate) — full multi-CTE multi-join SQL runs per
      chip. Severity MEDIUM. Captured in
      `live-filter-no-apply-gate-multi-cte-sql-per-chip-toggle` invariant.
    - |-
      Batch ZC: the dashboard's react-query hook (useGetDataQualityDashboard) sets
      no staleTime — refetches on every remount and window-focus. Severity LOW.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityController.md
    - DataQualityContent.md
    - DataQualityFilters.md
    - DataQualityStore.md
  evidence:
    - DataQualityController.md:performance.hot_paths.[0-1]
    - DataQualityController.md:performance.known_performance_gaps.[0-3]
    - DataQualityContent.md:performance.hot_paths.[0]
    - DataQualityFilters.md:performance.known_performance_gaps
    - DataQualityStore.md:performance.known_performance_gaps.[0]
notes: |-
  Data Quality Test is named in main-concepts.md / data-quality.md / sla-statuses.md
  verbatim. The new DataQualityController class sidecar is the first concept-catalog
  contributor at the controller-class layer; prior batches enriched only the
  configuration / repository / service tiers. The five-endpoint surface this entity
  embodies is documented at the live API-reference but not at a per-tag
  /developer-guides/api-reference/data-quality page (the API-reference hub omits
  data-quality from its per-feature sub-page list per WebFetch 2026-05-20).

  STRENGTHENED batch ZC (2026-05-22): adds the catalog-wide UI surface
  (/data-quality dashboard, F-032 / P-04:F-002) as the second consumer of DQ test
  data. The dashboard exposes the SAME DQ test runs through a different API
  endpoint (GET /api/dataqatests/runs) and a different aggregate shape (catalog-wide
  per-category bucket counts vs per-dataset status counts). Two surfaces, one
  underlying entity — captured as related-but-distinct UI features that each
  warrant their own concept entries (`data-quality-dashboard`,
  `data-quality-test-category`, `data-entity-run-status`).
maintainer_curated: false
