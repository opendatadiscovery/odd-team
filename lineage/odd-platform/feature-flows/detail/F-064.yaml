    severity: LOW
    ui_unverified: false
  - facet: |-
      Onboarding workflow gap — admin sets up RBAC for OTHERS but not for
      themselves
    observed: |-
      The platform admin authoring Roles / Policies / Owners during initial
      setup typically configures these FOR OTHERS — creating Owner entities
      representing their teammates and attaching Roles. The admin's own
      account often has no `user_owner_mapping` row because the admin's
      identity is "the operator who set up the platform" rather than "a
      catalog owner of any entity." Result: the admin experiences every
      "My" view as silent-empty during setup, may conclude the platform
