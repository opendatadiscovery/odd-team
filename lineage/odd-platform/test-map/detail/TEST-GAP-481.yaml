proposed_action: |-
  Integration test. (a) Create namespace `team-a` and `team-b`. (b) Create term `team-b:Internal`. (c) Create data entity in `team-a` namespace with description `"Refer to [[team-b:Internal]]"`. (d) Query `SELECT count(*) FROM data_entity_to_term WHERE term_id=team-b-internal.id AND data_entity_id=?` returns 1. The test EXPOSES the cross-namespace link; the fix (if intended) would require namespace ownership semantics + a denial path with an admonition that this is a deliberate read-collaborative design.
