# Overview sidebar Tags / Terms / Groups truncation — product-owner reflection

## product_owner_narrative

The per-entity **Overview tab** is the first screen an operator lands on after clicking any data
entity in the catalog (route `/dataentities/{id}/overview`, the routing default per
`Overview.md` downstream_side_effects and the F-176 composition). Down the right rail of that
screen sit three sibling collection panels — **Tags**, **Dictionary terms**, and **Data entity
groups** — each answering an at-a-glance question the operator carries to the entity: *what does
this entity mean, who classified it, and what is it part of?* (panel headers `t('Tags')`,
`t('Dictionary terms')`, `t('Data entity groups')` — OverviewTags.tsx:37, OverviewTerms.tsx:30,
OverviewGroups.tsx:31). This feature is the **per-entity READ surface** for three concepts whose
authoring/directory surfaces live elsewhere: F-018 owns the Tag directory, F-002 the Term linkage,
F-012 the group-membership write path. F-179 is where those three land on the screen the user
actually reads.

The user interacts with each panel in one of three states. When the collection is non-empty, the
panel renders the items as chips/rows, capped at a panel-specific visible limit — 20 for Tags
(OverviewTags.tsx:23), 20 for Terms (OverviewTerms.tsx:22), 10 for Groups
(OverviewGroups.tsx:24). When the collection exceeds the cap, a `View All (N)` button appears whose
parenthetical count is the only on-screen signal that more items exist
(OverviewTags.tsx:85, OverviewTerms.tsx:76, OverviewGroups.tsx:71-73); clicking it expands a
`<Collapse unmountOnExit>` that renders the overflow inline (OverviewTags.tsx:68-83). When the
collection is empty, the panel shows `t('Not created').` plus a permission-gated add affordance
(OverviewTags.tsx:102-109). A fourth, cross-cutting state: when the entity's status is **DELETED**,
the add/edit affordance is hidden on all three panels (`!isStatusDeleted &&` at OverviewTags.tsx:39,
OverviewTerms.tsx:32, OverviewGroups.tsx:33) while the already-assigned items still render — a
read-only teardown view.

The working parts the operator would describe in a demo: *"the Tags panel puts the important tags
first so you can see what matters about this entity at a glance"* (the `tagsCompare` comparator,
OverviewTags.tsx:26-32, sorts important-first then alphabetically) — and *"if there are a lot of
tags, the first twenty show and you click View All for the rest."* These two descriptions are each
true in isolation and **false in combination**, which is the load-bearing finding of this whole
feature. The render expression is `tags.slice(0, visibleLimit).sort(tagsCompare).map(...)`
(OverviewTags.tsx:54-65): JavaScript evaluates left-to-right, so `.slice` runs first and returns the
first 20 elements in the server's return order (insertion / database order, no `ORDER BY` on the
join per the F-018 repository semantics), and `.sort` then re-orders only those 20. An important tag
sitting at array index 22 is never in the window the comparator can reach. Terms and Groups have the
same slice-then-sort shape with an additional defect — the comparator is a **bare `.sort()`** with no
arguments on arrays of objects (`LinkedTerm[]` at OverviewTerms.tsx:48-50, `DataEntityRef[]` at
OverviewGroups.tsx:49-51), which per ECMAScript stringifies each element to `"[object Object]"`, all
elements compare equal, and the sort is a silent no-op.

This feature integrates downstream of three other pillars and upstream of none: it CONSUMES the
`tags` / `terms` / `dataEntityGroups` arrays from the parent `DataEntityDetails` payload
(`GET /api/dataentities/{id}`, the same fetch IT-020/IT-016/IT-024 wait on), which is itself fed by
the F-018 tag-assign, F-002 term-link, and F-012 group-membership write paths and ultimately by the
P-10 ingestion pipeline. F-179 fires no mutation of its own beyond the in-panel edit forms; it is a
`page-render` terminal side effect (feature-flow `terminal_side_effect.side_effect_class:
page-render`). The cross-pillar promise that matters here is the **same READ-surface drift family as
F-018**: the Top-Tags catalog-home strip (F-018, IT-005) has a backend `listMostPopular` ordering bug;
F-179 has the symmetric CLIENT-side ordering bug on the per-entity strip. Two surfaces, two layers,
one user-facing failure: *"the ordering I see is not the ordering the panel promises."*

In a demo a senior product owner would highlight three edge cases. First, the >20-tags entity where
the important tags were added last (the common case — an operator adds the entity, then later marks
its key tags important): the visible top-20 contains zero important tags and the operator concludes
the entity has none. Second, the expand-then-collapse cycle: `unmountOnExit` tears down the DOM, so a
user who expanded, scrolled, and collapsed loses their scroll position on re-expand. Third — the one
the feature-flow detail under-stated — **clicking View All does NOT repair the ordering**: the overflow
window (`tags.slice(visibleLimit).sort(tagsCompare)`, OverviewTags.tsx:70-72) is sorted independently
of the first window, so the merged global importance order is never assembled; an important tag at
index 22 appears in window 2, after every non-important tag in window 1. The operator's mental model
("View All will show me everything in importance order") is contradicted even after the click.

## hypotheses

- id: H-001
  hypothesis: |
    When a data entity carries more than 20 tags and at least one tag marked `important: true`
    sits beyond array index 19 (e.g. the operator added it last), opening the entity's Overview
    tab shows that important tag among the FIRST tags in the visible window — because the Tags
    panel "sorts by importance first" (the tagsCompare comparator's stated intent).
  derivation: |
    The `tagsCompare` comparator (OverviewTags.tsx:26-32) declares "compare by importance and
    alphabet" and returns important-first; the panel header "Tags" plus the comparator's existence
    is the user-facing promise that important tags surface at a glance.
  seed_source: ui-label
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |
      The render expression is `tags.slice(0, visibleLimit).sort(tagsCompare).map(...)`
      (OverviewTags.tsx:54-56). JS array methods evaluate left-to-right: `.slice(0, 20)` runs
      FIRST and returns the first 20 elements in the array's existing order (the server's return
      order — tag_to_data_entity insertion / DB order, no ORDER BY on the relation join per the
      F-018 ReactiveDataEntityRepositoryImpl semantics). `.sort(tagsCompare)` then re-orders only
      those 20. A tag at index 22 marked important is never in the sliced window, so it cannot
      surface regardless of its importance flag. The comparator's promise holds only WITHIN the
      first-20 window of the array, not across the full list.
    evidence:
      - sidecar: "(source read — OverviewTags has no sidecar)"
        section: render
        cite: "OverviewTags.tsx:54-56"
        note: ".slice(0, visibleLimit) runs before .sort(tagsCompare) — slice truncates first"
      - sidecar: "(source read)"
        section: comparator
        cite: "OverviewTags.tsx:26-32"
        note: "tagsCompare declares important-first intent — the unmet promise"
      - sidecar: F-179.yaml
        section: observed_vs_expected.facets[0]
        cite: "F-179.yaml:136-164"
        note: "feature-flow detail confirms slice_then_sort drift class at this anchor"
    operator_visible_failure: |
      (1) Obvious: an entity with 25 tags where indices 22-24 are important shows NONE of its
      important tags in the visible top-20; the operator scans the strip, sees no important tag, and
      assumes the entity has no important tags. (2) Subtle: which tags ARE visible is non-deterministic
      from the operator's seat — it is whatever order the backend join returned (insertion order),
      so two entities tagged with the same set in a different add-sequence show different "top" tags.
      (3) Compounding: the failure is invisible — there is no "showing arbitrary subset" signal; the
      panel looks like it is honouring the importance ordering because the 20 it shows ARE sorted.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-002
  hypothesis: |
    When a Tags panel is truncated and the operator clicks "View All (N)", the full list is then
    presented in importance order (important tags first across the whole list) — i.e. View All is
    the escape hatch that restores the ordering the truncated window could not show.
  derivation: |
    Negative-space: a user who notices the truncation expects the expand action to give them the
    complete, correctly-ordered list. This is the natural recovery from H-001.
  seed_source: negative-space
  sme_consultation_recommended: false
  validation:
    verdict: contradicted
    actual_behavior: |
      The overflow render is `tags.slice(visibleLimit).sort(tagsCompare).map(...)`
      (OverviewTags.tsx:70-72) inside the `<Collapse>`. The visible window (slice 0..20, sorted)
      and the overflow window (slice 20.., sorted) are sorted INDEPENDENTLY and concatenated in DOM
      order; the merged global importance order is never assembled. So after View All, the operator
      sees: [window-1: indices 0-19 sorted important-first] THEN [window-2: indices 20+ sorted
      important-first]. An important tag at index 22 appears in window-2 — i.e. AFTER every tag in
      window-1, including non-important ones. The importance ordering is NOT restored by expansion;
      it is only ever local to each 20-element window.
    evidence:
      - sidecar: "(source read)"
        section: collapse-overflow-render
        cite: "OverviewTags.tsx:68-83"
        note: "second window slice(visibleLimit).sort(tagsCompare) — sorted independently of window 1"
      - sidecar: F-179.yaml
        section: observed_vs_expected.facets[0].evidence
        cite: "F-179.yaml:158 — OverviewTags.tsx:69-83 (Collapse contents sorts the SECOND window)"
        note: "feature-flow notes each window independently sorted; global order never assembled"
    operator_visible_failure: |
      The operator who DOES notice the truncation and clicks View All to recover still cannot trust
      the ordering: an important tag added late lands at the start of the SECOND visual block, below
      every non-important tag in the first block. The recovery action the UI offers does not actually
      recover the promised ordering — there is no point in the flow at which the operator sees
      important-first across the full list. This is the new drift class
      view_all_expansion_sorts_each_window_independently_merged_importance_order_never_assembled and
      is the part of the defect the single-window framing of PLT-096 under-stated.
    severity: MEDIUM
