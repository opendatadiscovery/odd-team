proposed_action: |-
  Add `OpenAPISpecSecuritySchemesContractTest`. Build-time test (no Spring context):

  1. **Parse spec**: use `swagger-parser` or `openapi-parser` Maven dep to load `openapi.yaml` + `components.yaml`.
  2. **Assertion 1 (CURRENTLY FAILING — the headline)**: `spec.components.securitySchemes` is NOT null AND has at least one scheme defined. PINS the absence.
  3. **Assertion 2 (CURRENTLY FAILING)**: at most one operation under `/api/*` is declared without either a `security:` block OR an entry in an explicit `x-public-unauthenticated` allowlist (managed in a sibling YAML committed to the repo).
  4. **Assertion 3 (CURRENTLY FAILING)**: every operation declares `x-permission` extension naming the required permission (e.g. `DATA_ENTITY_ADD_TERM`), and these MATCH `SecurityConstants.SECURITY_RULES` entries by `(httpMethod, pathPattern)` — the runtime-vs-spec contract.

  The test fails today on assertion 1 (no securitySchemes), assertion 2 (no security: blocks), assertion 3 (no x-permission extensions). Each assertion's failure is a structural finding — pairs with REFACTOR-NNN.

  Coherence note (LSN-018 Rule 6): NET-NEW. Sister to TEST-GAP-829 (the 4xx/5xx absence; same contract-test class) and TEST-GAP-830 (the REFACTOR-217 path-mismatch contract test). Together they form the foundation of the spec-conformance test suite. STRENGTHENS DOC-GAP-099 (spec-drift META cluster) by adding the SECURITY axis. STRENGTHENS REFACTOR-217 by establishing the structural class of drift the test would prevent.
