proposed_action: |-
  Add `ActivityControllerCrossOwnerReadPostureTest` with three regression-pin methods:
  (a) `getActivity_typeNull_returnsActivityForEntitiesOwnedByOthers_pinsCrossOwnerVisibility`: seed Owner A + Owner B each owning a data entity; have @ActivityLog-annotated services record events on both entities; authenticate as a user associated only with Owner A; WebTestClient GET `/api/activity` (no `type` param); assert the response Flux<Activity> contains events from BOTH Owner A's entity AND Owner B's entity. Pins the unscoped default behaviour.
  (b) `getActivity_typeMyObjects_returnsOnlyCallerOwnerEntities_pinsTheOnlyOwnerScopedBranch`: same fixture; GET `/api/activity?type=MY_OBJECTS`; assert only Owner A's entity events return. Pins the MY_OBJECTS-only owner-scoping (i.e., the asymmetric branch in ActivityServiceImpl.fetchMyActivities).
  (c) `getActivity_typeUpstream_returnsEventsAcrossLineageWithoutOwnerFilter_pinsLineageBypass`: build lineage Owner A's entity → Owner B's entity; authenticate as Owner A; GET `/api/activity?type=UPSTREAM` for Owner A's entity; assert events on Owner B's lineage-connected entity ARE returned (no owner filter on the lineage walk).
  Add `// REGRESSION-PIN — ActivityController surfaces the read-collaborative cross-owner audit-trail; only the MY_OBJECTS branch consults caller ownership. If the maintainer ever tightens to require Owner-context, this test breaks and the maintainer must coordinate the doc fix at activity-feed.md.` comment block. Pair with DOC-GAP that adds the visibility statement at activity-feed.md.
