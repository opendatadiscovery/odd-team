suggested_canonical_choice: |-
  Rename the substrate node-id `odd-platform ts react-component
  component:PopularStrip` to `component:OwnerEntitiesList` (or
  `component:RecommendedPanel`) to match the implementation. Update the
  sidecar's filename to match.
suggested_add_to_docs: false
rationale: |-
  This is a substrate-axis hygiene concern — not a doc-product or code-product
  concern. The maintainer's substrate extractor inferred a logical node from
  feature-flow context; the inference is incorrect for the implementation.
  Renaming the substrate node-id is cheaper than refactoring the implementation
  to match.

  Surfaced because the sidecar (PopularStrip.md) opens with a 3-paragraph
  explanation of "there is no dedicated PopularStrip.tsx component in this
  codebase" — a clear signal that the substrate-side naming needs maintenance.
