    touch `housekeeping.ttl.*`, the platform retains resolved alerts / search
    facets / soft-deleted entities for 30 days (the documented default).
  derivation: >-
    Live doc states "Defaults to 30" for all three TTL keys; the operator expects
    the 30-day default to be a property of the platform, not of one specific YAML
    file.
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      TRUE only when the bundled `application.yml:165-170` is the resolved
      configuration. The Java fields are declared `private int resolvedAlertsDays;`
      / `searchFacetsDays;` / `dataEntityDeleteDays;` with NO `= 30` initialiser
      (HousekeepingTTLProperties.java:8-12); the `30` safety floor lives ONLY in
      the shipped YAML. A deployment that overrides application.yml via a Helm
      values overlay, `--spring.config.location=` to a profile that omits the
      block, Spring Cloud Config slice, or a Kubernetes ConfigMap mount that does
      not re-supply `housekeeping.ttl.*` binds Spring's primitive-int default `0`
      for all three. The next cycle computes `cutoff = now() - 0 days = now()` and
      the predicate `STATUS_UPDATED_AT <= cutoff` matches every row — immediate
      hard-delete-everything.
