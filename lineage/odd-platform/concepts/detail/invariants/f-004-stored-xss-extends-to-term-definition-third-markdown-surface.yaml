mitigations_unimplemented:
  - |-
    Add rehype-sanitize to the shared Markdown.tsx wrapper with an
    allowlist excluding script / iframe / style / onerror — ONE line
    in ONE file fixes ALL THREE surfaces (data-entity description,
    dataset-field description, term definition) PLUS the other Markdown
    affordances on the platform (alerts, query examples, owner descriptions,
    attachments). The shared element architecture is the asset here —
    sanitisation at the leaf prop level is platform-wide.
  - |-
    Backend HTML sanitisation at write time — Jsoup or org.owasp.encoder
    at TermServiceImpl.createTerm and TermServiceImpl.updateTerm (and
    the parallel data-entity and dataset-field description endpoints).
    Defence-in-depth that holds even if a future UI refactor accidentally
    bypasses the shared Markdown.tsx wrapper.
  - |-
    Add @Size(max=...) on TermFormData.definition + InternalDescriptionFormData
    + DatasetFieldDescriptionFormData — cap at e.g. 64 KiB. Bounds the
    blast radius of the persistent staging row payload.
  - |-
    Add a regression test that stores a script tag and an img onerror tag
    in a term's definition + the data-entity description + the dataset-
    field description and asserts the round-trip is neutralised. Pin
    the fix as a regression invariant.
  - |-
    Probe pin — promote P-009 to cover the TermDefinition surface
    specifically; the inference from the shared Markdown.tsx element
    holds structurally but is not empirically verified for the
    /terms/term_id/overview route. A probe run targeting that route
    closes the empirical pin.
  - |-
    Document on the data-glossary live doc page (UI-DOC-GAP-A from the
    TermDetails sidecar) that term definitions are stored as raw
    Markdown without HTML sanitisation; only trusted operators should
    be granted TERM_UPDATE. The doc page admission alone is the
    operator-facing transparency in lieu of (or alongside) the code fix.
notes: |-
  NEW invariant captured in batch 2026-05-20U from the TermDetails
  sidecar's F-004 cross-batch coherence finding plus the TermServiceImpl
  batch K cross-reference. The 3-surface closure means F-004 is now
  fully end-to-end on every user-curated Markdown affordance the
  platform exposes; the shared Markdown.tsx renderer is the SINGLE FIX
  POINT for all three surfaces simultaneously.

  Cross-cutting connections:
    - STRENGTHENS the master F-004 invariant
      (markdown-rendering-via-rehype-raw-without-rehype-sanitize-stored-xss-surface-on-internal-description)
      from 2-surface to 3-surface coverage
    - Pairs with the companion invariant
      (no-rehype-sanitize-anywhere-in-odd-platform-ui-systemic)
      from batch U — the systemic absence Grep-verified across the
      entire UI tree
    - Pairs with the partial-permission-gating-edit-button-gated-content-unconditional
      invariant — the term content is uniformly readable; the XSS
      attack surface reaches every authenticated viewer
    - Pairs with read-collaborative-cross-owner-enumeration — the
      impact set of a single TERM_UPDATE-holder is the entire
      authenticated user population
    - Pairs with [[ns:term]] auto-link side-channel REFACTOR-227 —
      the staging-row XSS variant compounds the surface (TermServiceImpl
      batch K bugs_limitations_corner_cases.[3] F-004 intersection)

  Three DOC-NNN candidates flow from this invariant:
    (a) Code fix — add rehype-sanitize to Markdown.tsx (one line, three
        surfaces fixed plus all other Markdown affordances)
    (b) Backend sanitisation — Jsoup or org.owasp.encoder at the three
        primary-write methods
    (c) Docs admission — disclose the stored-XSS surface on each of
        the three feature pages until the code fix lands
