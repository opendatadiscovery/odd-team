        section: bugs_limitations_corner_cases[2] + invariants[0] + doc_drift_findings (SERVICE-DOC-GAP-D)
        cite: "PolicyJSONValidator.java:28-32 + ControllerAdvice.java:61-66"
        note: "IllegalArgumentException has no handler — malformed policy yields HTTP 500."
      - sidecar: '(issues/odd-platform/PLT-076.md)'
        section: "What + Why it matters"
        cite: "ControllerAdvice.java:23-66 (no IllegalArgumentException handler)"
        note: "Class-wide fix; PLT-076 names the Policy JSON validator as a sibling IllegalArgumentException->500 vector."
    operator_visible_failure: |
      (a) An operator authoring a policy and getting a field wrong receives a generic
          "Internal Server Error" 500 with NO indication of what was malformed —
          they cannot tell whether they sent a bad body or hit a server bug, and the
          validator's detailed error message is only in the server logs they may not
