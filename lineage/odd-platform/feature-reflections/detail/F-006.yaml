- id: H-009
  hypothesis: |
    When an operator creates a Policy or Role, the platform protects the seeded
    `Administrator` identity the same way it does on edit and delete — an operator
    cannot create a second entity named `Administrator` and ride the trusted name.
  derivation: |
    Negative-space + cross-pillar — the platform reserves `Administrator` on update
    and delete (visible in the UI guard + service guard, now test-pinned on
    update/delete by PolicyServiceImplTest + RoleServiceImplTest); a consistent
    product protects the name symmetrically across all three CRUD verbs. An operator
    assumes "Administrator is reserved" means reserved everywhere.
  seed_source: negative-space + ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      PolicyServiceImpl.create (lines 62-69) and RoleServiceImpl.create (lines
      51-61) have NO name check against the predefined `Administrator`/`User` names —
      only update (line 76/68) and delete (line 87/82) do (and those two ARE now
      test-pinned: PolicyServiceImplTest.update_administratorPolicy + delete, and
      RoleServiceImplTest.update_adminRole + delete_predefinedRole). The sole
      protection on create is the DB partial unique index
      (`policy_name_unique`/`role_name_unique WHERE deleted_at IS NULL`), which
      protects ONLY while the seeded row is live. If the seeded Administrator row is
