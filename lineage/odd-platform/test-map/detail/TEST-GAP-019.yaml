behaviour: 'Lineage pagination / depth-limit boundary tests — `lineageDepth=0`, very
  large `expandedEntityIds`, `lineageDepth=1000000` reaches LineageService unmodified
  (no `@Max` at controller). DataEntityGroup lineage has no depth parameter at all.
  STRENGTHENED batch I — the LineageServiceImpl sidecar primary-source confirms there
  is NO upper-bound check at the service either: `LineageDepth.of(lineageDepth)` (line
  96) hands the primitive int directly to the repository with no defensive clamp,
  no warning log. A caller passes `lineageDepth=Integer.MAX_VALUE` and the recursive
  CTE runs to whatever Postgres or graph-density limits enforce (REFACTOR-202 amplification
  at the service layer). The DoS-amplification vector is inherited end-to-end across
  controller + service + SQL tiers.'
