name: Clear dashboard-side filters (per-side write-only atom dispatch)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  Two write-only jotai atoms — `clearTableFiltersAtom` and
  `clearTestFiltersAtom` (DataQualityStore.ts:44-54, 56-66) — each
  empty exactly one half of the dashboard's `formFiltersAtom`. The
  Clear button inside the "Filters for tables" block dispatches
  `clearTableFiltersAtom`, which resets the five `de*`-prefixed keys
  (`deNamespaceIds`/`deDatasourceIds`/`deOwnerIds`/`deTitleIds`/`deTagIds`)
  to `[]` while spreading the other five (test-side) keys unchanged.
  The Clear button inside the "Filters for tests" block dispatches the
  mirror atom and clears the five unprefixed keys. NEW operation, batch
  ZC (2026-05-22).

  The two atoms are exact mirrors: `atom(null, (get, set) => set(formFiltersAtom,
  prev => ({ ...prev, deNamespaceIds: [], ... })))`. Each touches only its
  own five keys; no Clear button clears ALL filters at once (no global
  clear). The two-side independence — captured under the
  `dashboard-filter-panel` entity's invariants — relies on these two
  atoms staying correctly mirrored; a regression that merged them or
  cleared both sides would silently break the operator's mental model.

  Side effects: a clear dispatch (a) mutates `formFiltersAtom` in the
  jotai store, (b) re-derives `filtersAtom` (now `{}` for the cleared
  side, projected into the dashboard request shape), (c) triggers a
  new dashboard fetch via the standing `useGetDataQualityDashboard`
  subscription in `DataQualityContent`, and (d) triggers the URL-sync
  effect in `DataQualityFilters`, removing the cleared keys from the
  query string.
