mitigations_unimplemented:
- |-
  Doc-side: extend developer-guides/api-reference hub to cover ALL 35 tags
  (not 9) — at minimum a per-tag landing paragraph naming the canonical
  operations + a Swagger UI deep link. The 26 missing tags include the
  platform's largest surface (dataEntity with 45+ operations).
- |-
  Build-time: derive a SPEC SHAPE REPORT from openapi.yaml at build time
  (op count by tag + method distribution + status-code distribution +
  schema count) and publish as a build artefact. Would enable change
  detection on the spec's contract surface (operation count regression,
  status-code drift expansion, tag explosion).
- |-
  Build-time: contract-conformance test — fire every spec'd operation
  against a running platform instance + assert status code matches the
  spec's declared response code. Would close the 200-vs-201 drift cluster
  in one cycle (catch every divergence; let the maintainer choose direction
  of fix per drift instance).
