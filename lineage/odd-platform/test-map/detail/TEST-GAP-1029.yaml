behaviour: |-
  **`HousekeepingTTLProperties.java:8-12` declares three `private int` fields (`resolvedAlertsDays`, `searchFacetsDays`, `dataEntitiesDays`) with NO `@Min(0)`, NO `@PositiveOrZero`, NO `@Validated` on the class.** Spring Boot `@ConfigurationProperties` binds negative integers without complaint. An operator setting `housekeeping.ttl.resolved_alerts_days: -1` binds `-1` successfully; the downstream jOOQ chain computes the cutoff as `now() - (-1) days` = `now() + 1 day`, which matches ALL alert rows with `STATUS_UPDATED_AT <= tomorrow` — i.e. every resolved alert.

  Concretely the AlertHousekeepingJob.java code path is:
  ```
  final OffsetDateTime cutoff = DSL.currentOffsetDateTime().minus(housekeepingTTLProperties.getResolvedAlertsDays());
  ```
  With `getResolvedAlertsDays()` returning `-1`, the cutoff becomes `current_timestamp + interval '1 day'` (jOOQ days-flipped via negative). Combined with the pre-existing jOOQ operator-precedence bug (TEST-GAP-211) which makes manual RESOLVED rows ignore the cutoff entirely, this is silent data loss across both manual and automatic resolved alerts in a single misconfigured deploy.

  The mitigation (`@Min(0)` on each field + `@Validated` at the class level) would fail-fast at boot with a clear `ConstraintViolationException` instead of silently producing wrong-cutoff deletions. The constraint annotations are available in the classpath (jakarta.validation is used elsewhere in the codebase per LDAPSecurityConfiguration patterns).

  Test gap shape: pin the current binding behaviour with negative integers AND assert the cutoff-flip propagates to the SQL emitted; pair with a positive-control test asserting `@Min(0)` (when added) rejects negative values at startup with a clear error.
