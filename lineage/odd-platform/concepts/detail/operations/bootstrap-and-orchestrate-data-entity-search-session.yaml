notes: |-
  NEW operation captured in batch ZL (2026-05-26). This is the
  UI orchestrator role, distinct from the backend search-catalog-
  faceted-session-as-server-state operation (which describes
  what happens after the dispatch reaches the controller).

  The operation surfaces FIVE distinct invariants that are each
  worth pinning separately:
    1. The broken-debouncer bug (already pinned, this sidecar
       strengthens it as a second primary instance);
    2. The tsquery FTS injection chain (already pinned at the
       repository layer; UI confirms the user-controlled text
       reaches the chain unsanitised);
    3. The TRUE SQL injection at highlightDataEntity (already
       pinned at the repository layer; UI confirms the entry
       surface);
    4. The session-UUID-as-bearer-token shape (already pinned;
       UI confirms the URL is the bearer);
    5. The session-expiry no-recovery UX (housekeeping reaper
       at 30 days; UI has no recovery path).
