name: Update Data Entity Status (lifecycle with cascade)
canonical_in_docs: true
canonical_candidate: false
description: '`PUT /api/dataentities/{data_entity_id}/statuses` — gated by `DATA_ENTITY_STATUS_UPDATE`
  per-data-entity Permission via SECURITY_RULES (SecurityConstants.java:277-281).
  Body is `Mono<DataEntityStatusFormData>` carrying target `DataEntityStatus` (one
  of UNASSIGNED / DRAFT / STABLE / DEPRECATED / DELETED) + optional `propagate` +
  optional `status_switch_time` (REQUIRED when target is DRAFT or DEPRECATED — `isSwitchable=true`
  on the enum). Delegates to `DataEntityService.updateStatus(...)` → `DataEntityInternalStateServiceImpl.changeStatusForDataEntities(...)`
  which mutates the pojo + cascades on DELETED transitions (soft-delete cascade: lineage
  relations + group relations + parent-group relations + statistics + `MANUALLY_CREATED`
  filled-flag) OR on restore-from-DELETED transitions (mirror cascade). **Programmatic
  activity-event emission** via `logStatusChangeEvents(oldStates, ids)` — captures
  `DATA_ENTITY_STATUS_UPDATED` events with explicit `oldState`/`newState` JSON payloads
  PER POJO (NOT AOP `@ActivityLog` because the mutation is bulk; oldState must be
  captured per-pojo BEFORE the in-place mutation). DEG propagation (`propagate=true`
  on a Data Entity Group target) fetches all member oddrns + applies status to each
  plus the parent. Scheduled `DataEntityStatusSwitchJob` runs every 10 minutes (ShedLock
  9-minute window) and uses the SAME write path to bulk-flip entities whose `status_switch_time
  <= now` to DELETED.'
axes_present:
- controllers
nodes:
