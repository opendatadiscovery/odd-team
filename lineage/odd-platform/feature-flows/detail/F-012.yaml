observed_vs_expected:
  facets:
  - facet: write-collaborative DEG with no DEG-side authorization
    observed: |-
      SecurityConstants.java:228-236 binds permission on the CHILD
      data_entity_id from the URL path; the target data_entity_group_id has
      NO authorization check. A caller with DATA_ENTITY_ADD_TO_GROUP on
      entity X can place X into ANY manually-created DEG in the catalog,
      including DEGs in unrelated organisational silos. The Catalog
      Overview's Domain tiles can be polluted by drive-by writes.
      `PolicyPermissionDto.java:22-23` confirms the scope is DATA_ENTITY,
      not DATA_ENTITY_GROUP.
    expected: |-
      Either a DEG-side authorization check (a new permission like
      DATA_ENTITY_GROUP_MEMBERSHIP_MANAGE evaluated against the target DEG
      id) OR explicit documentation that DEG membership writes are
      write-collaborative across organisational boundaries.
    drift_class: write_collaborative_no_deg_side_authorization
    provenance: |-
      STATIC — primary-source in batch L addDataEntityDataEntityGroup
      sidecar bugs_limitations_corner_cases[1] +
      security.known_security_gaps[0] + SecurityConstants.java:228-236 +
      PolicyPermissionDto.java:22-23 + absence of DEG-side authorization
      check in DataEntityServiceImpl.addDataEntityToDEG + WebFetch
      2026-05-19 of docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions
      (live doc text silent on which side is gated). Severity: HIGH.
  - facet: forensic silence on DEG membership writes (no @ActivityLog on add OR delete)
    observed: |-
      Neither addDataEntityToDEG (DataEntityServiceImpl.java:387-408) nor
      deleteDataEntityFromDEG (lines 411-438) is annotated with @ActivityLog.
      ActivityEventTypeDto.DATA_ENTITY_RELATION_UPDATED exists as enum value
      at line 12 but is never emitted — dead code in the audit-log enum.
      Sibling write methods on this controller DO emit activity (upsertTags
      line 358 TAG_ASSIGNMENT_UPDATED; upsertBusinessName line 239
      BUSINESS_NAME_UPDATED; updateStatus line 198 DATA_ENTITY_STATUS_UPDATED;
      addDataEntityTerm via TermService TERM_ASSIGNMENT_UPDATED).
    expected: |-
      Either an @ActivityLog(event = DATA_ENTITY_RELATION_UPDATED)
      annotation on BOTH methods with a TermAssignmentActivityHandler-style
      BEFORE/AFTER state capture, OR a documented "DEG membership is
      metadata-management not a tracked event" framing in the audit-log
      coverage docs. The presence of the unused enum value is itself a
      forensic signal — at some point a developer planned the emission and
      did not complete the wiring.
    drift_class: forensic_silence_on_membership_writes
    provenance: |-
      STATIC — primary-source in batch L sidecars
      (addDataEntityDataEntityGroup bugs_limitations_corner_cases[0] +
      deleteDataEntityFromDataEntityGroup bugs_limitations_corner_cases[0])
      + DataEntityServiceImpl.java:387-438 (no @ActivityLog) +
      ActivityEventTypeDto.java:12 (unused enum) + sibling-method
      @ActivityLog annotations at :358, :239, :198, :153. Severity: MEDIUM.
  - facet: ADD/DELETE permission asymmetry
    observed: |-
      SecurityConstants.java:228-236 registers TWO separate SecurityRule
      entries with TWO different permissions: DATA_ENTITY_ADD_TO_GROUP for
      POST and DATA_ENTITY_DELETE_FROM_GROUP for DELETE. PolicyPermissionDto.java:22-23
      declares both as DATA_ENTITY-scoped enum values, independently
      grantable. A Policy granting only ADD allows the caller to add but
      not remove; a Policy granting only DELETE allows the caller to
      remove but not add. The live Permissions doc lists both permissions
      as one-line descriptions without naming "manage DEG memberships" as a
      compound capability requiring BOTH grants.
    expected: |-
      Either a single DATA_ENTITY_DEG_MEMBERSHIP_MANAGE permission gating
      both directions (matching the operator mental model of "a steward
      curates membership"), OR a documentation example in the Permissions /
      Policies pages calling out the compound capability with both grants
      shown together.
    drift_class: add_delete_permission_asymmetry
    provenance: |-
      STATIC — primary-source in batch L
      deleteDataEntityFromDataEntityGroup sidecar bugs_limitations_corner_cases[3]
      + implicit_adrs[1] + SecurityConstants.java:228-236 +
      PolicyPermissionDto.java:22-23 + WebFetch 2026-05-19 of permissions
      page (no compound-capability note). Severity: LOW (UX).
  - facet: idempotence asymmetry — ADD raises 400 on duplicate; DELETE silently returns 204 on no-op
    observed: |-
      ADD path at DataEntityServiceImpl.java:401-403 raises
      BadUserRequestException("Data entity is already in this DEG") on
      duplicate INSERT (the `onDuplicateKeyIgnore` returns empty Flux which
      triggers `.switchIfEmpty`). DELETE path at lines 421-426 issues
      `deleteRelationsReturning(...).collectList()` with NO `.switchIfEmpty`
      — an empty list flows through to `Flux.fromIterable(emptyList)` →
      `ignoreElements().thenReturn(noContent())` returning 204 IDENTICAL
      to the successful-removal response. Operators writing reconciliation
      scripts face different idempotence contracts for write-symmetric
      operations. Combined with the forensic-silence finding, the caller
      cannot tell from the HTTP response or the activity feed whether
      anything changed.
    expected: |-
      Symmetric idempotence — either BOTH endpoints are idempotent (DELETE
      stays 204; ADD becomes 204 on duplicate with a documented `Was-Present`
      header), OR BOTH endpoints are non-idempotent (ADD stays 400; DELETE
      raises 404 on no-op). The current asymmetric pair is operator-surprising.
    drift_class: silent_204_on_no_op_delete_vs_400_on_duplicate_add
    provenance: |-
      STATIC — primary-source in batch L addDataEntityDataEntityGroup
      bugs_limitations_corner_cases[6] +
      deleteDataEntityFromDataEntityGroup bugs_limitations_corner_cases[1]
      + DataEntityServiceImpl.java:401-403 (ADD raises) vs :421-426
      (DELETE silent). Severity: LOW.
  - facet: soft-deleted membership blocks re-add with misleading "already in this DEG" error
    observed: |-
      The (group_oddrn, data_entity_oddrn) PK does NOT include is_deleted
      (V0_0_21__add_data_entity_group_relation.sql:6 declared the PK;
      V0_0_79__data_deprecation.sql:14-15 added the is_deleted column
      LATER). softDeleteRelationsForDeletedDataEntities
      (ReactiveGroupEntityRelationRepositoryImpl.java:92-101) flips
      is_deleted=true when the child entity is deleted via the
      STATUS=DELETED cascade. The matching restoreRelationsForDataEntities
      (lines 104-112) is the ONLY path to flip the bit back, and is NOT
      called from addDataEntityToDEG. Net effect: after a soft-delete +
      restore cycle, a re-add of the same (group, entity) pair collides
      with the PK, `onDuplicateKeyIgnore` returns empty Flux, service
      raises "Data entity is already in this DEG" — but
      getManuallyCreatedRelations (filtered by is_deleted=false at lines
      127-137) reports zero memberships from the user's perspective. The
      error is misleading; the only workaround is admin DB intervention.
    expected: |-
      addDataEntityToDEG should call restoreRelationsForDataEntities when
      an existing soft-deleted row is detected, OR the PK should include
      is_deleted via partial unique index `(group_oddrn, data_entity_oddrn)
      WHERE is_deleted = false`, OR the error message should detect the
      soft-deleted condition and provide a recovery instruction.
    drift_class: soft_deleted_membership_blocks_re_add_misleading_error
    provenance: |-
      STATIC — primary-source in batch L addDataEntityDataEntityGroup
      sidecar bugs_limitations_corner_cases[2] +
      V0_0_21__add_data_entity_group_relation.sql:6 (PK without is_deleted)
      + V0_0_79__data_deprecation.sql:14-15 (is_deleted addition) +
      ReactiveGroupEntityRelationRepositoryImpl.java:79-89 (onDuplicateKeyIgnore)
      + :92-101 (cascade soft-delete) + :104-112 (restore not invoked
      from add) + :127-137 (read filter on is_deleted=false) + absence of
      restore-on-add logic in addDataEntityToDEG. Severity: MEDIUM.
  - facet: HARD vs soft-delete cascade semantic gap
    observed: |-
      User-initiated DELETE hard-deletes the group_entity_relations row
      (deleteRelationsReturning at ReactiveGroupEntityRelationRepositoryImpl.java:57-65
      — `DSL.deleteFrom(...)`). Entity-deletion cascade soft-deletes
      (softDeleteRelationsForDeletedDataEntities at :92-101 — sets
      `IS_DELETED = true`). If the entity is ingestion-deleted and later
      restored, restoreRelationsForDataEntities (:104-112) resurrects
      memberships removed by cascade — but the user-initiated hard-delete
      has no row to flip; that membership stays gone. Same operator-visible
      behaviour ("entity removed from group"), different durability semantics
      depending on whether the removal was a user click or an ingestion
      cascade.
    expected: |-
      Either: (a) document the asymmetry explicitly in groups-domains.md
      ("user-initiated removal is permanent; ingestion-cascade removal is
      restorable on entity restore"), OR (b) make user-initiated removal
      also soft-delete with a separate "restore my removed memberships"
      affordance, OR (c) make ingestion cascade also hard-delete.
    drift_class: hard_delete_vs_soft_delete_cascade_semantic_gap
    provenance: |-
      STATIC — primary-source in batch L
      deleteDataEntityFromDataEntityGroup sidecar
      bugs_limitations_corner_cases[5] + implicit_adrs[3] +
      ReactiveGroupEntityRelationRepositoryImpl.java:57-65 (HARD for user)
      + :92-112 (soft + restore for cascade) + groups-domains.md (no
      documentation of the asymmetry). Severity: MEDIUM.
  - facet: conflated 400 error message on DEG-type pre-check
    observed: |-
      DataEntityServiceImpl.java:416-420 rejects with
      BadUserRequestException("Entity with id %s is not manually created
      DEG".formatted(dataEntityGroupId)) when (a) the DEG id doesn't exist
      (no row in data_entity), (b) the entity at that id is not
      manually-created (e.g. ingested DEG), or (c) the entity at that id
      has no DATA_ENTITY_GROUP class. The three failure modes produce
      IDENTICAL 400 responses; operators cannot distinguish "DEG was
      deleted" from "I pointed at the wrong entity" from "this DEG was
      ingested, not manually-created". Pairs with the same pattern in the
      ADD path at lines 393-397.
    expected: |-
      Distinct error responses — 404 for case (a), 400 with
      "not_manually_created" code for (b), 400 with "wrong_entity_class"
      code for (c).
    drift_class: conflated_error_message_on_deg_type_check
    provenance: |-
      STATIC — primary-source in batch L
      deleteDataEntityFromDataEntityGroup sidecar
      bugs_limitations_corner_cases[4] + DataEntityServiceImpl.java:416-420.
      Severity: LOW.
  - facet: data_entity_group_id is OPTIONAL per OpenAPI spec — null produces "id null" error
    observed: |-
      DataEntityDataEntityGroupFormData (components.yaml:1087-1092)
      declares the property WITHOUT a `required` clause: `type: object,
      properties: {data_entity_group_id: {type: integer, format: int64}}`.
      A POST body `{}` or `{"data_entity_group_id": null}` passes OpenAPI
      validation. The Jackson deserialiser yields
      formData.getDataEntityGroupId() == null. The service then calls
      reactiveDataEntityRepository.get(null) (line 393) which returns
      Mono.empty(); switchIfEmpty fires
      BadUserRequestException("Entity with id null is not manually created
      DEG") — a user-visible error mentioning "id null" rather than
      "data_entity_group_id is required".
    expected: |-
      Add `required: [data_entity_group_id]` to the
      DataEntityDataEntityGroupFormData schema in components.yaml so
      OpenAPI validation rejects `{}` with a clear "required field
      missing" 400.
    drift_class: optional_data_entity_group_id_yields_null_error
    provenance: |-
      STATIC — primary-source in batch L addDataEntityDataEntityGroup
      sidecar bugs_limitations_corner_cases[3] + components.yaml:1087-1092
      (no required clause) + DataEntityServiceImpl.java:393. Severity: LOW.
  - facet: empty DEG is a valid persistent state
    observed: |-
      If the DELETE removes the LAST entity from a DEG, the DEG itself
      persists as a data_entity row with class_id containing
      DATA_ENTITY_GROUP and continues to appear in search, on lookups,
      and on the Catalog Overview's Domain tile (if domain-flagged).
      There is no cascade-delete and no warning. The DELETE endpoint for
      the DEG itself (`/api/dataentitygroups/{id}`) is the only way to
      remove an empty DEG. Operators iteratively cleaning up DEGs may end
      up with stale empty groups littering the catalog. The
      groups-domains.md page does not warn about this.
    expected: |-
      Either (a) cascade-delete empty DEGs with a confirmation dialog, OR
      (b) document the empty-DEG state on groups-domains.md, OR (c)
      surface "Empty Group" status on the DEG detail page.
    drift_class: empty_deg_valid_persistent_state
    provenance: |-
      STATIC — primary-source in batch L
      deleteDataEntityFromDataEntityGroup sidecar
      bugs_limitations_corner_cases[2] + DataEntityServiceImpl.java:411-438
      (no DEG-self-delete branch). Severity: LOW.
  - facet: DISABLED-mode bypass — anonymous DEG membership writes
    observed: |-
      Under auth.type=DISABLED, DisabledAuthSecurityConfiguration
      `.anyExchange().permitAll()` (V_class-level sidecar) bypasses
      SECURITY_RULES entirely. Anonymous callers can POST and DELETE
      against the DEG-membership endpoints, polluting Catalog Overview's
      Domain tiles with no audit trail (per forensic-silence finding).
    expected: |-
      DISABLED documented as truly dev-only; operators warned not to
      expose a DISABLED deployment on a network-reachable port. The
      pattern repeats across batches A/B/C/E/F/G/K.
    drift_class: disabled_mode_bypass
    provenance: |-
      STATIC — cross-ref batches A/B/C/E/F/G/K DISABLED-bypass pattern +
      SecurityConstants.java:228-236 (rules not consulted under DISABLED).
      Severity: HIGH on network-reachable DISABLED; LOW if honestly dev-only.
  - facet: dead DATA_ENTITY_RELATION_UPDATED enum value
    observed: |-
      ActivityEventTypeDto.java:12 declares DATA_ENTITY_RELATION_UPDATED
      as an enum member; grep across odd-platform-api/src/main/java for
      `DATA_ENTITY_RELATION_UPDATED` returns ONLY the enum-declaration
      line. The semantically-natural consumer of this event is THIS
      endpoint pair (and the matching deleteDataEntityFromDEG). The
      forensic-silence facet above explains the gap; this facet adds
      the architectural observation that the planned-but-unshipped
      audit emission is itself a signal — either the enum value is dead
      code (cleanup candidate) or it is reserved for the planned wiring.
    expected: |-
      Either remove the dead enum value (refactor) OR wire it through
      addDataEntityToDEG + deleteDataEntityFromDEG to close the audit gap.
    drift_class: dead_enum_data_entity_relation_updated
    provenance: |-
      STATIC — primary-source in batch L addDataEntityDataEntityGroup
      bugs_limitations_corner_cases[7] + ActivityEventTypeDto.java:12 +
      grep across `odd-platform-api/src/main/java` returns ZERO usages.
      Severity: LOW.
