name: DEG-propagation cascade audit-feed asymmetry
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-07
- P-08
description: |-
  **NEW INVARIANT, batch 2026-05-19K** — surfaced by primary-source examination
  of `OwnershipServiceImpl.java:48, 77, 100, 121-149`. The activity-feed
  audit emission is structurally asymmetric between the user-facing action
  and the cascade:
    (a) `@ActivityLog(event = OWNERSHIP_CREATED)` (line 48),
        `OWNERSHIP_UPDATED` (line 100), `OWNERSHIP_DELETED` (line 77)
        annotate ONLY the three top-level public methods.
    (b) The DEG-propagation cascade `propagateOwnership` (lines 134-148)
        inserts/deletes N child ownership rows via
        `ownershipRepository.createOrUpdate(pojos)` (CREATE-side cascade
        for create + update) or `deleteByDataEntityAndOwner(pojos)`
        (DELETE-side cascade), but emits NO per-child events.
    (c) `OwnershipCreatedActivityHandler.getUpdatedState` (per
        OwnershipCreatedActivityHandler.java:33-36) captures
        `getDataEntityOwnerships(dataEntityId)` for the PARENT
        data-entity only. The children's ownership changes are invisible
        at the activity-feed layer.
  Operator-facing manifestation: an admin calls
  `POST /api/dataentities/{DEG_ID}/ownership` with `propagate: true`,
  creating an ownership row on the DEG itself AND on every child of the
  DEG (potentially thousands of rows). The activity-feed records ONE
  event for the DEG. The children's owner sections silently change. An
  operator auditing "when did this child data entity gain owner X?" via
  `ActivityController.getActivity` for the child sees NO event;
  they must walk the parent DEG's activity feed and INFER the cascade
  fan-out. **The architectural choice is intentional** per
  implicit_adrs.[2]: audit at the user-facing action level (one operator
  click → one audit row), not at the storage level (one storage operation
  → one audit row). The trade-off: fewer audit rows + clearer
  user-intent mapping, BUT cross-entity audit-trail inference is required.
  Cross-cutting case-law: any operation that fans out to child entities
  (DEG propagation here; soft-delete cascade on DataEntityHousekeepingJob;
  Term-rename's auto-update-mentions) inherits this audit-granularity
  trade-off. **Some inherit deliberately, others don't.** This invariant
  is the canonical PIN for the "deliberate" case — the maintainer chose
  it explicitly for ownership propagation.
