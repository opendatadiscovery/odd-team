proposed_action: |-
  Add `CollectorDeleteLeavesOrphanTokenRowTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `deleteCollector_softDeletesCollectorRow_pinsParentDeletion` — POST `/api/collectors` to seed; capture token_id; DELETE `/api/collectors/{id}`; assert `SELECT deleted_at FROM collector WHERE id = ?` returns NON-NULL.
  2. `deleteCollector_leavesTokenRowIntact_plaintextValuePersists_pinsOrphanGrowth` — same setup; after DELETE assert `SELECT COUNT(*), value FROM token WHERE id = ?` returns count=1 AND value=plaintext-40-char-string. PIN the orphan-row + plaintext-persistence.
  3. `deleteCollector_subsequentHousekeepingCycleDoesNotGcOrphanToken_pinsNoCleanupJob` — DELETE the collector; trigger ALL existing housekeeping jobs via the scheduler; assert the orphan TOKEN row STILL EXISTS. PIN the absence of cleanup.

  Pair with REFACTOR-NNN: add `tokenRepository.delete(...)` to `CollectorServiceImpl.delete` (synchronous fix) OR add a `TokenOrphanHousekeepingJob` (scheduled GC fix). When the synchronous fix lands, test #2 inverts to assert the TOKEN row is also deleted.

  Cross-pair with DOC-NNN: add a "Compliance and Data Retention" subsection to the Management → Collectors doc page; explain that DELETE soft-deletes the collector but the credential persists in the at-rest store; advise on raw-DB cleanup procedures for compliance audits.
