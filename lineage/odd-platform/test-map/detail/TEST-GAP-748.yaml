proposed_action: |-
  Add `ReferenceDataRenameBreaksDownstreamTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `updateLookupTable_renameProducesNewPhysicalTableName_pinsBreakingChange` — create a lookup table named "Customer Lookups"; PUT `/api/referencedata/table/{id}` with `{ name: "Customer Reference Codes" }`; assert the physical Postgres table has been renamed; assert the OLD physical name no longer exists. PIN the breaking change.
  2. `updateLookupTable_renameDoesNotLeaveDeprecationView_breakingForDownstreamConsumers` — same shape; assert NO view or alias is left at the old name (a downstream `SELECT * FROM lookup_tables_schema.{old_name}` fails).
  3. `updateLookupTable_renameUnderConcurrentRead_blocksOnAccessExclusiveLock` — simulate concurrent read traffic; trigger the rename; assert the read blocks for the duration of the rename transaction.
  4. `updateLookupTable_renameSameCaseAndWhitespaceCollision_failsWithCollision_compoundsWithTEST_GAP_734` — if the operator renames to a name that lossy-normalises to a different existing table, the rename fails. Pin the compound with TEST-GAP-734.

  Add a `// REGRESSION-PIN — Lookup table rename is BREAKING for downstream consumers that hardcoded the physical Postgres table name. No deprecation alias is left. A REFACTOR adding a deprecation VIEW or warning operators about the rename-is-breaking contract will break tests #1 and #2; the maintainer must re-author them.` comment block.

  Pair with REFACTOR-NNN (deprecation view) + DOC-NNN (rename-is-breaking warning).
