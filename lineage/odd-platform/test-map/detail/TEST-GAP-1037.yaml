behaviour: |-
  **MEDIUM — Three composing race / staleness shapes on the global
  Alerts page. Together they form a "what the operator sees vs.
  what is true" gap of moderate operator-visibility but high
  cross-cutting test value.**

  **(a) Tab-switch race**: AlertsTabs.tsx:44-46 dispatches
  `changeAlertsFilterAction` on tab change which clears
  `state.alerts.items = []`. Then the new-tab route mount fires
  the new-tab fetch. If the PREVIOUS tab had an in-flight page=N
  fetch, its response can land AFTER the clear AND AFTER the
  new-tab's page=1 fetch initiated. The slice's
  `updateAlerts` reducer (alerts.slice.ts:30) appends if
  pageInfo.page > 1, replaces if == 1. So the stale page=N
  response APPENDS to the new-tab's already-rendered page=1 —
  the user sees a mix of (current-tab alerts 1-30) + (previous-
  tab alerts 31-60). No request cancellation on tab-switch.

  **(b) Page-burst race**: InfiniteScroll auto-fetches on
  scrollThreshold='200px' (AlertsList.tsx:91). Fast-scroll on a
  large list issues page=N+1 requests faster than the backend
  returns. If page-1 and page-2 race AND page-2 returns first,
  the page-2 branch APPENDS items 31-60. Then page-1 returns,
  REPLACES items with rows 1-30, dropping page-2's already-
  received rows. State is now coherent (rows 1-30) but the
  user briefly saw a longer list.

  **(c) Stale tab badge totals**: Alerts.tsx:15-17 fires
  `fetchAlertsTotals` ONCE on mount with empty dep array. After
  a Resolve action (which removes the alert from the OPEN-only
  filtered view but does NOT re-fetch totals), the badge still
  shows the pre-Resolve count. The operator resolves 5 alerts,
  the badge stays at e.g. "127" until full page reload.
  Conversely, if `fetchAlertsTotals` fails on mount
  (AlertsTabs.tsx:23,28,34 fallback to `?? 0`), all three tab
  badges show "0" with no visible failure indicator. The
  operator interprets as "no alerts" rather than "backend
  unreachable".

  **Why MEDIUM** (compound):
  - Race (a) and (b) are limited corruption — the SPA recovers
    on next render, and the visual disturbance is transient.
    But "the user briefly saw a longer / mixed-tab list" is
    operator-visible — they may take action on a stale row.
  - Staleness (c) compounds with TEST-GAP-1034 (Resolve button
    rendered to unauthorised users) — the operator clicks
    Resolve on a row they cannot resolve, the action fails
    silently per AlertItem.tsx, the badge stays at the pre-
    Resolve count, and the operator concludes the resolve
    "worked but UI is slow".
  - The MEDIUM rating is the sum of three small operator-
    visibility issues that together undermine confidence in
    the page's correctness during normal use.

  **Test gap shape**: three independent regression-pin tests,
  one per failure mode.
