name: LSN-002-class — primitive default ships disabled-but-broken-when-enabled
canonical_in_docs: false
canonical_candidate: true
description: |-
  Recurring failure mode across the catalog: a primitive Java type (`int`,
  `String`) with no field initializer ships a value (`0`, `null`) that is legal at
  boot but broken at first use when an operator enables the feature. GenAIProperties.requestTimeout
  is the canonical example: `int` default 0 → `Duration.ofMinutes(0)` → immediate
  timeout. AttachmentServiceImpl.maxFileSize has the same `@Value` shape (boxed Integer,
  no `:default`), saved only by application.yml shipping a value. Live config-doc
  admonitions exist; the code itself has no fail-fast (LSN-002 retrospective is named
  verbatim). Batch 2026-05-10B adds three more instances of the same pattern: AppInfoController@L18
  (`@Value("${auth.type}")` with no default — empty/typo silently produces no-SecurityWebFilterChain
  deployment), CounterTimeSeriesExtractor@L20 + the tenant-id label asymmetry (`@Value("${odd.tenant-id}")`
  with no default — empty-string injection silently splits multi-tenant data), ActivityTablePartitionManager@L11
  + the `partition.advisory-lock-id` sibling (`@Value("${partition.advisory-lock-id}")`
  with no `:default` — operator unsetting the key fails bean wiring at boot, partition-period
  itself has `:30` but no @Min(1)). Note: DataCollaborationConfiguration takes the
  OPPOSITE choice — explicit fail-fast empty-check on slack-oauth-token throws IllegalArgumentException
  at boot.

  **BATCH X STRENGTHENING (2026-05-20X)** — four NEW instances surface in batch X
  config-class sidecars, each at the file the LSN-002 retrospective named OR at a
  semantic sibling:

    1. **MinioConfig.java:19-25** — DIRECT primary source of LSN-002 itself. The
       MinioAsyncClient.builder() chain is exactly `.endpoint().credentials().build()`
       — `.region(...)` ABSENT. Three other silent defaults at the same call site:
       `.httpClient(...)` (no operator timeout knobs — REFACTOR-034) and
       `.credentialsProvider(...)` (no IAM-role / IRSA support). The Gate-5 unset-
       parameter audit per the MinioConfig sidecar classifies all three as
       'caveat-defaulted'. See the strengthened
       `minio-region-unset-lsn-002-primary-source-confirmation-at-minioconfig`
       invariant for the file-level details.

    2. **LoginFormSecurityConfiguration.java:70 — `auth.login-form-credentials`**
       — `@Value("${auth.login-form-credentials}")` with NO `:default` fallback.
       Operator switching `auth.type` DISABLED → LOGIN_FORM in override config
       WITHOUT supplying the credentials key triggers BeanCreationException with
       'Could not resolve placeholder' at boot. Fail-loud is correct, but the live
       doc surface does NOT name the required-pair nature of these two keys
       (auth.type + auth.login-form-credentials).

    3. **NotificationConfiguration.java:123 — `notifications.message.downstream-entities-depth`**
       — `@Value("${notifications.message.downstream-entities-depth}")` with NO
       default value in the @Value expression. Inconsistent with the platform-base-url
       at L105 which DOES have a `:http://localhost:8080` fallback. An operator who
       enables `notifications.enabled=true` and forgets to set the depth knob fails
       at boot with Spring's generic placeholder-resolution error. application.yml
       ships `notifications.message.downstream-entities-depth: 1` (line 175) which
       masks the trap during default runs, but any override that removes the key
       triggers it.

    4. **R2DBCConfiguration.java:41-50, 75-84 — `spring.r2dbc.pool.*` (10 keys)**
       — PropertyMapper wires 10 pool-tuning parameters but `application.yml` ships
       ZERO `spring.r2dbc.pool.*` keys. Pool ceiling is Spring Boot's framework
       default (`maxSize=10`); a Spring Boot upgrade altering the default would
       silently change the platform's deployed pool ceiling. The platform commits
       to no specific ceiling.

  **THE BATCH X COUNTER-EXAMPLE** — NotificationConfiguration.java:39-49 (mailSender bean
  body) DOES validate the trio of email-channel fields (sender / host / protocol) with
  explicit IllegalArgumentException paths. The discipline is local to this one bean
  method; the asymmetry within the same file (mailSender validates, downstream-depth
  doesn't) is itself the LSN-002-class pattern made explicit.

  **BATCH ZK STRENGTHENING (2026-05-26)** — three NEW config-properties-class
  layer instances surface in batch ZK, each at the config-properties-POJO
  type (a fourth axis distinct from the @Value-consumer + config-class +
  SDK-builder instances enumerated in prior batches):

    1. **HousekeepingTTLProperties.java:9-11** — three `private int` fields
       (`resolvedAlertsDays`, `searchFacetsDays`, `dataEntityDeleteDays`)
       with NO `= 30` initializer. The `30`-day safety floor lives ONLY in
       the shipped `application.yml:168-170`. An operator overriding
       `application.yml` without re-supplying the `housekeeping.ttl.*`
       block (e.g. via `--spring.config.location=` mounting a custom
       config, Spring Cloud Config, Kubernetes ConfigMap mount) binds
       `0` for all three fields and the next 15-minute housekeeping cycle
       hard-deletes ALL resolved alerts + ALL search-facets + ALL
       soft-deleted data-entities cascading through ~25 child tables.
       This is the CANONICAL LSN-001-shape silent-data-loss compounded
       with LSN-002 primitive-default. Fix shape: `private int
       resolvedAlertsDays = 30;` etc., or use Spring `@DefaultValue` on
       the field, or move to `Integer` boxed type + `@NotNull` for
       fail-fast.

    2. **GenAIProperties.java:11** — `private int requestTimeout;` with
       no initializer + no `@Min(1)` + no `@Validated`. When operator sets
       `genai.enabled=true` and forgets to set `genai.request_timeout`,
       the `genAiWebClient` is built with `Duration.ofMinutes(0)`
       (`Duration.ZERO`), Reactor Netty's
       `HttpClient.responseTimeout(Duration.ZERO)` does NOT throw at
       construction, and every outbound `POST /api/genai/ask` fails with
       `ReadTimeoutException` surfaced as "Gen AI request take longer
       that 0 min" — a confusing user error rather than a configuration
       error at boot. The live doc page DOES warn operators with an
       explicit admonition, but the source itself has no field-level
       safety. P-179 probe was emitted in batch ZK to pin Reactor
       Netty's N=0 / N=negative behaviour empirically.

    3. **AdditionalLinkProperties.java:7-9** — outer record + inner
       `Link(String title, String url)` record. The `links` field defaults
       to `null` (record fields with no default are null-on-binding when
       `odd.links` is absent), forcing downstream consumers to repeat
       the null-guard. LinksController.java:27 does the null-guard via
       `CollectionUtils.isEmpty`; ANY future consumer (a metrics
       extractor, an audit-log emitter) must repeat the null-handling.
       The record could safely default the field to `List.of()` in a
       compact constructor and absorb the downstream null-handling
       burden. Lower-severity than (1) and (2) — the consequence is
       NOT data-loss but maintenance-burden and consumer-side-failure
       surface.

  The LSN-002 pattern now spans 13 distinct sidecars across config-prefix
  consumers (5) + config-classes (4) + config-properties-classes (4 —
  GenAIProperties existing + HousekeepingTTLProperties ZK NEW +
  AdditionalLinkProperties ZK NEW + GenAIProperties ZK REV-2
  re-confirmation). The HousekeepingTTLProperties instance is
  particularly load-bearing because it COMPOUNDS with LSN-001 (silent
  default produces production data loss) — the worst class of the
  LSN-002 family.
