    verdict: contradicted
    actual_behavior: |
      `OperationUtils.containsIgnoreCase` is FULL-STRING case-insensitive equality, NOT substring
      containment. The definition (read directly this session) is
      `return collection.stream().anyMatch(element::equalsIgnoreCase);` — `String::equalsIgnoreCase`,
      not `String::contains`. At the call site `LDAPSecurityConfiguration.java:96` the call is
      `containsIgnoreCase(properties.getGroups().getAdminGroups(), a.getAuthority())` →
      `collection = adminGroups`, `element = a.getAuthority()` (the directory-returned authority).
      The stream evaluates `authority.equalsIgnoreCase(adminGroup)` for each configured admin group.
      So an LDAP authority `devops` tested against `admin-groups: ['ops']` is
      `"devops".equalsIgnoreCase("ops")` = FALSE. There is NO substring collision. The
      over-promotion the facet describes cannot occur. The same helper is the one used by GitHub
      (`GithubUserHandler.java:119`) — so the GitHub "substring overpromotion" claim (PLT-081 / F-124b /
      DOC-235 CRITICAL) is wrong on the identical axis.
