      NO isNaN guard. A non-numeric segment yields dataSourceId=NaN, propagated to all six
      consumers (DataSourceList, Entities, DirectoryBreadCrumbs, EntitiesTabs, EntityItem,
      TableHeader) without guard; the level-4 fetch calls getDatasourceEntities({dataSourceId: NaN}),
      the backend responds 400/404, and the UI surfaces a generic AppErrorPage. So the user DOES
      get an error (not a crash, not silent data) — but it is INDISTINGUISHABLE from a genuinely
      missing data source; the "invalid URL" vs "no such source" distinction is lost.
    evidence:
      - sidecar: odd-platform__ts__routes__route__directory
        section: bugs_limitations_corner_cases[1] + invariants[2]
        cite: "directoryRoutes.ts:37 (no isNaN); Entities.tsx:36-41, 60-64"
        note: "NaN propagates to 6 consumers; generic error page"
    operator_visible_failure: |
      A user who fat-fingers or shares a malformed Directory link sees the same AppErrorPage as
      a user whose data source was deleted — no signal that the URL itself is the problem, so
      troubleshooting time is wasted chasing a non-existent data issue.
    severity: LOW
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional
    note: "Already tracked as PLT-093 Defect 3 (and corroborates DOC-GAP-252 per the feature-flow scanner_reviews F-023a). Partial because the error IS surfaced — only the distinguishability is the defect."

