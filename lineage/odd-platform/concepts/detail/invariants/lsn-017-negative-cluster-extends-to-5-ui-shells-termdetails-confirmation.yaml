mitigations_unimplemented:
  - |-
    Codify the LSN-017-negative-cluster safe-pattern in
    /odd-platform-ui/src/components/README.md or sibling. Pattern:
    detail-page useEffect deps are externally-driven (URL parameters,
    mutation status flags, hardcoded constants, stable thunk references);
    NO fetch-response-derived values appear. Future detail-page
    surfaces follow the safe pattern.
  - |-
    Add a custom ESLint rule that flags any useEffect deps array
    containing a value sourced from a Redux selector that the same
    effect's dispatch would modify — the structural shape of canonical
    LSN-017. A lint rule prevents recurrence.
  - |-
    Add Vitest + react-testing-library tests on at least one UI shell
    from each enriched cluster (PolicyList OR TermDetails) asserting
    'calling the fetcher once + receiving a response does NOT trigger
    a second fetcher dispatch'. Pins the safe pattern as regression.
  - |-
    Extend the LSN-017 retrospective with a 'verified-negative-cluster'
    section enumerating the 5 confirmed shells + the
    cross-component-fetch-duplication SIBLING shape. The retrospective
    becomes a complete tour of the broader family.
  - |-
    Future shell enrichment — each new UI shell sidecar (P-02 / P-03 /
    P-04 / P-05 / P-07) should include a coherence_check section
    documenting whether canonical LSN-017 applies. Update this invariant
    + the master batch-Q invariant on each enrichment.
notes: |-
  NEW invariant captured in batch 2026-05-20U from the TermDetails
  sidecar's coherence_check. Positive findings are catalogued for
  structural-safety evidence; the 5-shell negative cluster narrows
  the canonical LSN-017 to a SINGLE platform-wide instance.

  The negative cluster is increasingly load-bearing for the
  maintainer's audit and refactor decisions:
    - LSN-017 fixes are localised to DataEntityDetails (one component).
    - Sibling-class bugs (cross-component fetch duplication) require
      different remediations and are tracked separately.
    - Future detail-page or list-page authoring follows the documented
      safe pattern; no LSN-017 doubling shape is generalised.

  Cross-cutting connections:
    - STRENGTHENS the master negative-cluster invariant
      lsn-017-doubling-anti-pattern-absent-in-management-list-components
      (batch Q) from 4 to 5 components
    - Pairs with the canonical LSN-017 invariant
      lsn-017-self-feeding-double-fetch-dep-array-cross-layer-bug
      (batch J)
    - Pairs with the companion batch-U invariant
      cross-component-fetch-duplication-shell-plus-tab-double-fire-hot-path
      (the SIBLING-CLASS bug at the same TermDetails component, different
      shape, different remediation)
    - Pairs with the LSN-018 retrospective on per-node-scan limitations

  Two DOC-NNN candidates flow from this invariant:
    (a) Convention doc + lint rule — codify the safe pattern at the
        platform level
    (b) Retrospective extension — enrich LSN-017 with the verified-negative
        cluster + the sibling-class evidence
