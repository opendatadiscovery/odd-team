  - facet: spec says 201, impl returns 200 — class-wide drift on create + update
    observed: |-
      QueryExampleController.java:26-42 — `createQueryExamples` and
      `updateQueryExample` return 200 via `.map(ResponseEntity::ok)`
      (lines 31, 41). OpenAPI declares 201 for both (openapi.yaml:2118
      "'201': The resource has been successfully created"; openapi.yaml:2156
