notes: |-
  Pairs with:

    - `owner-rename-fts-vector-refresh-in-update-not-delete`
      invariant (new in this batch) — describes the FTS-side staleness
      after delete; this invariant describes the by-id surface; both
      compound to make the post-delete visibility of the owner
      INCONSISTENT across THREE surfaces (list / by-id / FTS).

    - `delete-owner-with-cascade-block` operation (new in this batch)
      — the operation whose semantics produce this asymmetry.

  Doc-side recommended action: extend the live `/owners` page with
  a "Visibility after delete" subsection: enumerate the three
  surfaces (list / by-id / FTS) and the three different post-delete
  visibilities. Backlog: DOC-NNN follow-up.
