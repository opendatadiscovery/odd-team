behaviour: |-
  **NEW asymmetry surfaced via LSN-018 pre-emit coherence check at the enclosing-class tier: `OwnerServiceImpl.create` does NOT call `updateSearchVectors`, in deliberate symmetric absence with `delete`.** Lines 54-66 (create), 82 (update calls helper), 87-100 (delete — also no call), 109-114 (the helper itself). New Owners are seeded into FTS LAZILY — the `search_entrypoint` row for an owner's name is populated when a downstream data entity references the owner (via OwnershipServiceImpl.create's `updateChangedOwnershipVectors`) or via the housekeeping batch refresh. The asymmetry is: rename refreshes (read-after-write consistency), create does not (lazy seeding), delete does not (lazy invalidation). The maintainer's intent is plausibly INTENTIONAL but the asymmetry is unstated and uncovered. A REGRESSION-PIN would: (a) verify create does NOT call either `searchEntrypointRepository.updateChangedOwnerVectors` or `termSearchEntrypointRepository.updateChangedOwnerVectors`; (b) document the lazy-seed contract via a comment block so a future maintainer adding FTS refresh on create breaks the test deliberately. Sister gap to TEST-GAP-625 (which pins update-refresh-yes + delete-refresh-no); this batch-S sidecar adds the create-refresh-no axis.
