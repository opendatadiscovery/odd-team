- id: H-005
  hypothesis: |-
    When an SDK consumer generates a client from the spec, the generated client includes the
    authentication scaffolding the platform requires (a way to present the OAuth2 bearer / session
    cookie / S2S X-API-Key header), because the spec declares its security schemes.
  derivation: |-
    A spec that promises a discoverable contract should declare HOW to authenticate; the platform
    enforces auth server-side, so a complete contract surfaces it.
  seed_source: negative-space + doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |-
      Grep for `securitySchemes` and `security:` across openapi.yaml + components.yaml returns ZERO
      matches (verified by the spec sidecar; re-confirmed by the feature-flow's scanner_reviews).
      The spec is machine-readable for SHAPE but silent on AUTH. openapi-generator produces client
      classes with no authentication code at all — no bearer wiring, no session-cookie handling, no
      X-API-Key injection — even though the platform enforces auth server-side under
      LOGIN_FORM/OAUTH2/LDAP + S2S (the four auth-mode sidecars confirm enforcement is real).
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api.md
        section: bugs_limitations_corner_cases
        cite: "openapi.yaml + components.yaml — grep securitySchemes/security: 0 matches"
        note: "spec auth-illegible; generated SDKs silently omit auth scaffolding"
      - sidecar: odd-platform__java__OAuthSecurityConfiguration__config-key-consumer__auth_type@L71.md
        section: security
        cite: "OAuthSecurityConfiguration.java:98 + S2sAuthenticationFilter.java:31-34"
        note: "auth IS enforced server-side (OAuth2 session + X-API-Key admin grant) — but undeclared in the spec"
    operator_visible_failure: |-
      (1) Every generated SDK consumer must reverse-engineer the auth model from the running
      service and hand-author auth glue — the single easiest place for a security misconfiguration.
      (2) Consumers cannot programmatically discover that S2S uses X-API-Key or that OAUTH2 needs a
      session. (3) Not a server-side boundary failure (auth IS enforced) — an SDK-quality + integration
      defect. Already tracked as SPC-001 Facet 2.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
