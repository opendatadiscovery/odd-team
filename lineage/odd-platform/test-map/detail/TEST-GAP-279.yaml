behaviour: 'Null-`lineage_depth` NPE — `Integer lineageDepth` is null when client
  omits the parameter (OpenAPI marks it `required: false`); autoboxing to primitive
  `int` in `LineageService.getLineage(...)` throws NPE → 500. The live API-reference
  doc states ''Unset returns the platform''s default depth'' — there is no default
  in code; the documented behaviour is unimplementable. STRENGTHENED batch I — the
  service sidecar confirms at primary source: `LineageService.java:12` signature requires
  primitive `int`; null cannot reach the LineageServiceImpl body; the NPE fires at
  the autobox call site `DataEntityController.java:261` BEFORE this service''s body
  executes. The doc is actively misleading; there is no platform default.'
