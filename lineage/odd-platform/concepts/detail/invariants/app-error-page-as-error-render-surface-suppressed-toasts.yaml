name: <AppErrorPage> as Error Render Surface (Suppressed Toasts on Large Loaders)
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
- P-01
- P-05
description: |-
  **NEW INVARIANT, batch 2026-05-19J**. The project's pattern for handling "expected
  failure" loads (large entity payloads — DataEntityDetails, TermDetails, Policy,
  DataEntityAlertList, DatasetStructure, Alerts, Activity, PolicyList,
  DataEntityLineage, DataQualityTest) is **selective error-toast suppression** via
  `switchOffErrorMessage: true`. The flag (14 occurrences across 10 thunk files,
  per fetchDataEntityDetails.md grep counts) tells `handleResponseAsyncThunk` to
  SKIP the `showServerErrorToast` call on the error path but still persist the
  `AppError` payload into `loader.errors[<actionType>]`. **Full-page error surface**:
  the affected components render `<AppErrorPage showError={true}
  error={loader.errors[...]} />` as a full-page banner (e.g. DataEntityDetails.tsx:116-119;
  HierarchyLineage.tsx:129-133). The banner displays `error.status`, `error.statusText`,
  `error.url`, and `error.message` from the backend's error response. **The
  decision shape**: large entity loads' failures are MORE prominent than a
  transient toast (they take over the full content area), but the user retains
  the surrounding UI shell (header, navigation). A 404 / 403 / 500 from a detail
  page is rendered identically. **Generic error fallback**: `AppError.message`
  falls back to literal `'An error occurred'` when the backend returns a non-JSON
  body or a body without a `message` field (`lib/errorHandling.tsx:12-26`). A
  502/504 from the platform process or an intervening proxy with an HTML error
  body becomes the same opaque banner as a real 404 — operators have no way to
  tell from the UI whether the entity doesn't exist or the backend is down.
  **Error-payload reflection**: `AppError.url` carries the request URL into the
  UI's error banner; for a deployment behind a reverse proxy that strips internal
  paths this is harmless; for a deployment exposing the platform directly the
  banner reveals the backend's actual API path.
contributing_files:
- DataEntityDetails.md
- fetchDataEntityDetails.md
- LineageGraph.md
triangulation_count: 3
cross_batch: false
severity: LOW
severity_dim: ux
evidence:
- 'fetchDataEntityDetails.md:implicit_adrs.[1] Selective error-toast suppression
  is the project pattern for handling expected failure loads. switchOffErrorMessage:
  true signals that the detail-page load is one of the loaders whose failure is
  expected to be communicated by the full-page <AppErrorPage> banner, not by a
  transient toast. 14 occurrences across 10 thunk files share this stance'
- 'fetchDataEntityDetails.md:bugs_limitations_corner_cases.[AppError.message falls
  back to the literal string An error occurred when the backend returns a non-JSON
  body or a body without a message field — operators have no way to tell from
  the UI whether the entity does not exist or the backend is down MEDIUM]'
- 'DataEntityDetails.md:bugs_limitations_corner_cases.[component does not surface
  backend permission errors to the user — AppErrorPage rendering is generic; a
  retrofitted auth gate would need UI changes to discriminate 403/404/500]'
- 'LineageGraph.md:bugs_limitations_corner_cases.[no retry on transient failure —
  switchOffErrorMessage:true means the thunk silently sets the error state instead
  of showing a toast; user sees only the AppErrorPage at the end of the chain;
  no exponential backoff, no automatic retry, no retry button on the error page]'
mitigations_unimplemented:
- 'Differentiate 403 / 404 / 500 in AppErrorPage rendering — different error
  surfaces give different operator signal'
- 'Add a "Retry" button to AppErrorPage — the user has no client-side affordance
  for transient backend failures'
- 'Detect non-JSON error responses (HTML 502/504 from proxies) and surface a
  distinct message — operators currently see "An error occurred" for backend
  downtime AND for missing entities'
- 'Strip AppError.url from the banner in production builds — the URL reflection
  is a defence-in-depth concern for direct-exposed deployments'
notes: |-
  New invariant captured in batch 2026-05-19J. The AppErrorPage + switchOffErrorMessage
  pattern is intentional and load-bearing — it embodies the project's "expected
  failure for large loads" stance. The pattern is well-understood but has three
  gaps that batch J surfaces:
    (a) Generic fallback message hides backend signal.
    (b) Status-code-agnostic rendering hides 403/404/500 differences.
    (c) No retry affordance for transient failures.

  Recommended improvement: extend AppErrorPage to discriminate by `error.status`
  + add a Retry button + strip URL in production. Affects 10 large-loader thunks
  consistently.
