description: |-
  The platform exposes a per-entity alert read endpoint at
  `GET /api/dataentities/{data_entity_id}/alerts` — a one-line WebFlux
  delegation (DataEntityController.java:315-321) that returns the full
  alert history for the named entity (open + resolved + auto-resolved +
  chunks + status history) as a paginated AlertList payload. The endpoint
  backs the per-entity Alerts tab on the UI's data-entity detail page AND
  is the doc-recommended **audit-export workaround** for the housekeeping
  bug that hard-deletes manually-resolved alerts. The live alerting page
  (WebFetched 2026-05-19 status 200, anchor #auto-cleanup-of-resolved-alerts)
  names this endpoint verbatim: `GET /api/dataentities/{data_entity_id}/alerts
  returns the open and recently-resolved set including chunks and status
  history. Persist the response somewhere durable... if the audit trail
  matters for compliance or postmortems.`

  The user-observable promise (per the live page): operators with access
  to the data-entity can export the alert audit data before manually
  resolving alerts as a workaround for the auto-cleanup bug.

  The user-observable reality, per batch-L primary-source code-walk of
  the controller + service + repository + SecurityConstants:

  (1) **Cross-owner per-entity alert read — REFACTOR-024 family
  extension** — the endpoint has NO @PreAuthorize, NO entry in
  `SecurityConstants.SECURITY_RULES` for the GET path
  (`SecurityConstants.java:98-355` contains only mutations), and the
  downstream SQL at `ReactiveAlertRepositoryImpl.java:182-199` is
  `WHERE DATA_ENTITY.ID = :id` with NO `OWNERSHIP` join and NO
  principal-derived predicate. Any authenticated caller can read every
  alert ever raised on every catalogued entity by enumerating
  data_entity_id. The contrast with the SIBLING listByOwner query at
  `ReactiveAlertRepositoryImpl.java:160-178` (which DOES `.join(OWNERSHIP)`)
  is structural — the asymmetry encodes an implicit ADR that
  per-entity reads are unscoped because the caller has already chosen the
  entity. This is the per-entity-surface extension of the REFACTOR-024
  cross-owner enumeration pattern (which covers the batch endpoint
  `getAllAlerts`).

  (2) **Soft-delete-inclusive existence check** — `AlertServiceImpl.java:327-335`
  gates the read on `dataEntityRepository.existsIncludingSoftDeleted(dataEntityId)`,
  whose body at `ReactiveDataEntityRepositoryImpl.java:150-155` issues
  `selectExists` over DATA_ENTITY with NO soft-delete filter. The sibling
  `existsNonDeletedByDataSourceId` at lines 158-160 DOES apply
  `addSoftDeleteFilter(...)` — the naming pair encodes the intent:
  "soft-deleted entities remain readable for audit / housekeeping use
  cases". Net effect: a caller passing a soft-deleted dataEntityId
  receives 200 OK with the entity's pre-deletion alert history; a
  fully-purged ID receives 404.

  (3) **No alert-status filter — sibling counts endpoint accepts one** —
  `getDataEntityAlertsCounts` (DataEntityController.java:324-330) accepts
  an `AlertStatus status` query param and filters by status
  (ReactiveAlertRepositoryImpl.java:202-215). `getDataEntityAlerts`
  does NOT — it always returns ALL statuses (OPEN /
  RESOLVED / RESOLVED_AUTOMATICALLY). A caller wanting only OPEN
  alerts must paginate the full set and filter client-side. No
  inline comment defends the asymmetry as intentional.

  (4) **Unbounded pagination size at every layer** — the controller
  does not validate `page` or `size`; the OpenAPI PageParam / SizeParam
  at `components.yaml:4213-4229` carry no `minimum:` or `maximum:`;
  the repository computes `OFFSET = (page - 1) * size`
  (`ReactiveAlertRepositoryImpl.java:189`) with no clamping. A caller
  passing `size=1_000_000` triggers a single jOOQ query bounded only
  by Postgres / network buffers; `page=0` produces a negative OFFSET.

  (5) **Read/write SecurityRule asymmetry** — the mutation endpoint on
  the same entity-scoped namespace (`PUT /api/dataentities/{data_entity_id}/alert_config`)
  IS registered in SecurityConstants.SECURITY_RULES (line 304-307) and
  pairs the `DATA_ENTITY` resource type with the
  `DATA_ENTITY_ALERT_CONFIG_UPDATE` permission. The read endpoint
  `GET /api/dataentities/{data_entity_id}/alerts` is absent from the
  rule list. No comment, annotation, or surrounding code defends the
  read/write asymmetry as intentional — the absence of permission
  gates on GET endpoints is a class-wide convention but the convention
  itself has no inline justification.

  (6) **UI tier — per-entity Alerts tab review (batch UI-A 2026-05-26)** —
  the React component `DataEntityAlerts.tsx` (93 lines) is the UI
  consumer of `GET /api/dataentities/{id}/alerts`. Mounted on each
  Data Entity detail page; fetches with hardcoded `size=30`
  (line 31) and infinite-scroll pagination at line 69-77. The
  halt-config affordance (NotificationSettings) IS wrapped in a
  `<WithPermissions permissionTo={Permission.DATA_ENTITY_ALERT_CONFIG_UPDATE}>`
  block at line 53 — gating the visibility of the halt-config UI
  on resource permissions. NEW UI-tier drift facets surface:
  (a) The WithPermissions wrapper is a CONTEXT, not a render-block
  (per F-021 batch-ZL note #6 systemic finding) — visible to
  descendants but the wrapped Button is unconditionally rendered.
  In this case the wrapped child is just the halt-config Button;
  the WithPermissions check IS effective for HIDING the button
  itself because the descendant (NotificationSettings → the dialog
  it opens) consults the same permission context — but the
  current rendering relies on the wrapper short-circuiting the
  Button render, NOT on the dialog gating mutation paths. A bug
  in the WithPermissions wrapper (e.g. permission context not
  hydrated yet on first render) would briefly show the Button
  to unprivileged users until they clicked, surfacing the
  AlertItem post-action permission discovery anti-pattern.
  (b) AlertItem.tsx (shared between global Alerts list and this
  per-entity tab) implements POST-ACTION permission discovery
  at lines 48-70: clicking "Resolve" fires
  `fetchResourcePermissions(...).unwrap().then(({permissions}) => ...)`
  — the permission check happens AFTER the user clicks, then
  conditionally calls `dispatchUpdateAlertStatus()` OR sets
  `disableResolve=true` and renders a small "No access!"
  caption inline. Bad UX: the button is enabled until the
  user discovers via click that they cannot use it. The user-
  observable promise is "actionable button"; the reality is
  "speculative button". NEW drift facet candidate to add to
  drift_class_summary —
  `alertitem_post_action_permission_discovery_button_enabled_until_click_reveals_no_access`.
  (c) The size=30 hardcoded constant has no operator-facing UI
  to adjust; deep alert histories require infinite-scroll
  walking through many round-trips. No filter UI for status
  (OPEN / RESOLVED / RESOLVED_AUTOMATICALLY) on the per-entity
  tab. STRENGTHENS the existing F-014 facet
  `no_alert_status_filter_asymmetric_with_sibling_counts` —
  the asymmetry surfaces at the UI consumer tier too (the tab
  has no UX for the status filter the backend cannot accept).
facets_summary: |-
  9 substantive drifts: cross-owner per-entity alert read (REFACTOR-024
  family extension to per-entity surface) + soft-delete-inclusive
  existence check (cross-channel leak surface) + no alert-status filter
  asymmetric with sibling counts endpoint + unbounded pagination size at
  every layer + read/write SecurityRule asymmetry (DESCRIBE-but-don't-CONSTRAIN)
  + DISABLED-mode bypass + workaround doc silent on pagination + audit-export
  use case has zero test coverage.
