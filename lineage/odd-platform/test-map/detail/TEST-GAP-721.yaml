behaviour: |-
  **CROSS-CUTTING SYSTEMIC GAP — THE ENTIRE P-06 DATA GLOSSARY PILLAR HAS ZERO DIRECT TEST COVERAGE AT ANY TIER.** Verified across all five batch-U sidecars + cross-validated against the platform's test tree 2026-05-20:

  - **HTTP tier — TermController**: ZERO direct tests. Grep `TermController` against `odd-platform-api/src/test` returns zero files. 23 endpoints reachable in production with no contract-level test asserting OpenAPI-binding, content-negotiation, security wiring, or DTO serialisation parity.
  - **Service tier — TermServiceImpl**: ZERO direct tests. The 552-line service with 17 methods has no `TermServiceImpl*Test*` (Grep verified). The only reference is `DataEntityServiceTest.java:80` (`@Mock private TermService termService`) — a mock that is never invoked. 17 methods carrying multiple `@ReactiveTransactional` perimeters, three link-table mutators with `is_description_link` flag semantics, the `[[ns:term]]` regex parser, the three-stage unhandled-mention staging system, and the description-mention guards are entirely uncovered.
  - **Repository tier — ReactiveTermSearchEntrypointRepositoryImpl**: ZERO direct tests. Seven SQL-heavy methods (CTEs, aggregates, `INSERT ... ON CONFLICT`, `tsvector_agg` remapping) with no test corpus. The only reference is `NamespaceServiceImplTest.java:175, 186, 205` — mock-only interactions that verify the method is called but NOT what SQL produces.
  - **Repository tier — ReactiveTermRepositoryImpl** (batch-N): ZERO direct tests per the batch-N sidecar's tests_coverage_semantic block. 15 public methods + the 7 term_to_term.deleted_at-unfiltered read sites are entirely uncovered.
  - **UI tier — TermSearch + TermDetails + TermDefinition + TermSearchHeader + TermSearchResults + TermDetailsTabs + TermDetailsRoutes + Overview**: ZERO direct tests. Glob over `odd-platform-ui/src/components/Terms/**/*.test.*` returns ZERO matches (verified 2026-05-20).

  **What's lost by the absence**: the Business Glossary pillar P-06 hosts 23 endpoints, the term-mention auto-link side-channel, the V0_0_91 schema-drift, the description-mention guard, the FTS materialisation chain, the term-to-term linkage (un-RBAC'd per TEST-GAP-718), and the cross-pillar Term→Entity / Term→Term graph rendering. ALL of these regressions would land undetected. A future maintainer's "small refactor" to any one of: (a) the `findTermsInDescription` regex (TermServiceImpl.java:67), (b) the `nameOrNamespaceHasChanged` boolean direction (TermServiceImpl.java:125, 331-335 — semantically inverted name), (c) the FTS vector refresh fan-out (ReactiveTermSearchEntrypointRepositoryImpl.java:63-250), (d) the TermDetails double-fetch consolidation (TermDetails.tsx:37-45 + Overview.tsx:19-21), or (e) any SecurityConstants entry shuffle — would ship green CI and surface as operator-visible regressions in production.

  **Why CRITICAL not HIGH**: P-06 is one of the platform's load-bearing pillars (the Business Glossary is the catalog's vocabulary — every data-entity description, every dataset-field description, every search facet references terms). A regression in P-06 surfaces as: "term I just edited doesn't show up in search", "deleted term still in autocomplete", "term-link I just authored isn't there after refresh", "Dictionary tab now shows different counts than the term-details page", "auto-link to my new term didn't fire", "rename of a referenced term silently succeeded and broke 100 descriptions". The operator-recoverable cost of these regressions exceeds the test investment by orders of magnitude. The cross-cutting nature — ALL FIVE TIERS (HTTP / Service / Repository × 2 / UI) are uncovered — elevates this above any single-tier gap. **Pattern, not isolated gap**: this is the P-06-pillar instance of the systemic cross-controller-floor pattern in TEST-GAP-001 + TEST-GAP-717; the entire pillar repeats the bottom-tier-absence at every tier.
