proposed_action: Add `AlertManagerWebhookIdempotencyTest` that POSTs the same well-formed
  AlertManager payload twice via WebTestClient against the live endpoint; assert that
  `alertRepository.listAllWithStatusOpen` returns exactly ONE row for the given entity_oddrn
  + type (the expectation), then mark the test as `@DisabledUntilFixed` referencing
  REFACTOR-NNN if not yet remediated, so the test pins the current (broken) behaviour
  vs the target.
