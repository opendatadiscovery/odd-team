proposed_action: |-
  Testcontainers integration test. (a) Authenticate user A. (b) POST /api/search 100 times → 100 sessions created. (c) Query `SELECT count(*) FROM search_facets` → assert count is ≥ 100. (d) Trigger ALL existing housekeeping jobs (manually invoke or wait for the schedule). (e) Query `SELECT count(*) FROM search_facets` → assert count UNCHANGED (no housekeeping touches search_facets). (f) Test comment 'LOCKS the unbounded-growth contract as of 2026-05-19. When the TTL housekeeping job for search_facets is added (REFACTOR-NNN), this test FLIPS to expect (a) the housekeeping schedule INCLUDES search_facets, (b) rows older than the configured TTL are pruned. Until then, this test documents the storage gap.' Pair with the V0_0_52__introduce_housekeeping.sql migration verification.
