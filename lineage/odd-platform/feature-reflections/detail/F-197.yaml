- id: H-003
  hypothesis: |-
    When a user copies the URL of a message thread they are viewing and sends it to a
    colleague, the colleague opens the same entity, the same channel filter, and the same
    message thread the sender was looking at.
  derivation: |-
    Per-message deep-linking is the stated design intent ("per-message thread drilldown"
    pillar_anchored_feature_name) — a deep-linkable URL must carry the full view state to
    be useful; consistency seed (the sibling Activity tab uses useQueryParams for filters).
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |-
      The dataEntityId and the messageId DO travel in the URL (MessagesList.tsx:22-74
      navigates to dataEntityDiscussionsPath(dataEntityId, messageId) on message click —
      chain hop-2; the right panel reads messageId from the URL — chain hop-4). BUT the
      channelId and the messageDate (scroll position) are held in local React useState in
      DataCollaboration.tsx:22-23 (chain hop-1 + observed_vs_expected facet
      channelid_messagedate_in_component_state_not_url). A shared link therefore preserves
      "which entity + which message" but DROPS "which channel filter + where in the scroll"
      — the recipient lands on the same entity and message but with the channel filter reset
      and scrolled to a different position. The sibling DataEntityActivity tab uses
      useQueryParams for exactly these (ActivityResults.tsx:25), so this surface is also
      inconsistent with the platform's own established pattern.
    evidence:
      - sidecar: "(feature-flow chain — F-197 hop-1, hop-2)"
        section: chain.hop-1.evidence + chain.hop-2.evidence
        cite: "DataCollaboration.tsx:22-23 (useState channelId/messageDate) + MessagesList.tsx (messageId→URL)"
        note: "messageId in URL; channelId + scroll in component state."
      - sidecar: "(feature-flow observed_vs_expected)"
        section: "facet: channelid_messagedate_in_component_state_not_url"
        cite: "F-197.yaml observed_vs_expected (ui_unverified: false)"
        note: "Inconsistent with DataEntityActivity useQueryParams pattern."
    operator_visible_failure: |-
      A user who shares a discussion link expecting a colleague to see exactly what they see
      gets a partial reproduction: the message opens, but if the sender had filtered to a
      specific channel, the recipient sees an unfiltered list, and the scroll position
      differs. For a feature whose value is "discuss this entity together," a link that
      drops half the view state quietly erodes the collaboration promise. Inconsistency with
      the Activity tab's URL-state discipline also breaks the "works like the rest of the
      platform" expectation.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: |-
    When a user opens the channel autocomplete in the Share dialog and types the middle of
    a channel's name (e.g. "platform" to find "#odd-platform-alerts"), the matching channel
    appears in the dropdown.
  derivation: |-
    Endpoint-shape: the parameter is channel_name and the UI is an autocomplete; a user's
    default mental model of an autocomplete is substring/fuzzy match, so the name promises
    "find a channel by what I type."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      getSlackChannels filters with `slackChannel.name().startsWith(nameLike)` — a PREFIX
      match, not contains/fuzzy (DataCollaborationController.md invariant "filters by
      startsWith, not contains"; SlackMessageProviderClient.java:52). Typing "platform"
      returns zero results for "#odd-platform-alerts" even though the bot is in that channel.
      The UI surfaces no hint that the match is prefix-only. The live doc NOW states this
      explicitly ("The typed filter is a prefix match (startsWith)... typing the middle of a
      channel name returns no suggestions"), so the behaviour is documented — but the UI
      itself gives the user an empty dropdown with no explanation.
    evidence:
      - sidecar: odd-platform__java__DataCollaborationController__controller-class__DataCollaborationController.md
        section: invariants + bugs_limitations_corner_cases
        cite: "SlackMessageProviderClient.java:50-55 + SlackChannelsAutocomplete.tsx:43-54"
        note: "startsWith filter drives the autocomplete on every debounced keystroke."
      - sidecar: "(live doc cross-ref)"
        section: WebFetch
        cite: "https://docs.opendatadiscovery.org/features/active-platform-features/data-collaboration (2026-06-03, 200)"
        note: "Doc now states the prefix-match behaviour explicitly."
    operator_visible_failure: |-
      A user searching for a channel by a distinctive middle word gets an empty dropdown and
      concludes the bot is not in the channel (or the channel does not exist), when in fact a
      prefix-typed query would have found it. They cannot post to a channel they can't find.
      The only feedback is emptiness; the prefix constraint is invisible at the point of use.
