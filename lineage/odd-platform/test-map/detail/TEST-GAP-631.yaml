  - "postAlerts.md says (performance.known_performance_gaps.[0]): 'No rate limit, no payload-size cap, no batch-cardinality cap — a misconfigured AlertManager (or unauthenticated attacker) can create unbounded AlertPojo + AlertChunkPojo + ActivityCreateEvent rows.'"
  - "Source: AlertManagerController.java:21-26 (no rate limit annotation, no body-size constraint, no log statement, no @Timed) + AlertServiceImpl.java:152-191 (the loop materialises one alert+chunk per input array entry) + AlertServiceImpl.java:302-325 (Activity events are entity-side, not request-side)"
