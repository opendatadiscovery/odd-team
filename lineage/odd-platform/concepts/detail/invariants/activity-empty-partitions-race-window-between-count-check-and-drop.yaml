  Verbatim: "A concurrent INSERT INTO activity that lands AFTER the
  count-zero check but BEFORE the DROP TABLE acquires ACCESS EXCLUSIVE
  — Postgres will queue one behind the other on the partition's lock,
  but ONE will win: if INSERT wins, it succeeds, then DROP TABLE
  proceeds to drop a now-non-empty table SILENTLY (no recheck),
  deleting the just-inserted row. The row's caller never sees an
  error (INSERT returned success), but the row is gone."
