behaviour: |-
  **AppInfoController IS THE HIGHEST-SIGNAL-DENSITY FINGERPRINT ENDPOINT UNDER `auth.type=DISABLED` (the application.yml default).** Under the platform's default deployment config (`application.yml:34` — `auth.type=DISABLED`), `DisabledAuthSecurityConfiguration.java:13-18` applies `.anyExchange().permitAll()`; `/api/appInfo` (NOT in `SecurityConstants.WHITELIST_PATHS` per lines 95-96, NOT in `SecurityConstants.SECURITY_RULES`) becomes anonymously reachable. The endpoint returns `{projectVersion: String, authType: String}` (`AppInfoController.java:24-28` + `components.yaml:2493-2499`) — both fields together let any network caller (a) confirm the deployment IS ODD (`projectVersion` is the give-away — the field name + the version string format are ODD-specific), (b) learn the exact platform version (scoping CVE matching to known-vulnerable releases in the Spring Boot / WebFlux / Reactor / R2DBC / OAuth-client chains), and (c) learn the active auth mode (`DISABLED` / `LOGIN_FORM` / `OAUTH2` / `LDAP` — telling them whether to attempt credential stuffing vs OIDC tampering vs walking in unauthenticated). Compared with `/actuator/info` (whitelisted) or `/` (returns SPA HTML), `/api/appInfo` is the highest-signal-density fingerprint in a single 200 byte response. **No test catches this**: `find <odd-platform> -path '*test*' -name 'AppInfo*'` returned no matches 2026-05-20; `Grep 'AppInfoController|getAppInfo|api/appInfo'` against `odd-platform-api/src/test/` returned 0 files. The live `documentation/docs/configuration-and-deployment/enable-security` page (WebFetched 2026-05-20 status 200) names the `auth.type` switch but does NOT mention `/api/appInfo`, the AppInfo endpoint, or warn about the fingerprinting risk under DISABLED. This is the **19th supporting sidecar for REFACTOR-185 (DISABLED-mode bypass)** — the controller-class-tier confirmation of a finding originating in batch B at the config-key-consumer-axis layer.
