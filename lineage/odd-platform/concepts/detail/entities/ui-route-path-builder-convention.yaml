  - |-
    dataQuality route batch ZH:
      concepts.entities[DataQualityDashboard URL — the literal /data-quality, the single canonical mount point];
      concepts.invariants[the string /data-quality exists in EXACTLY ONE place in source; both consumers call dataQualityPath() instead of hard-coding the literal];
      implicit_adrs[Each route module under odd-platform-ui/src/routes/ declares its URL prefix and exposes a path-builder function from a single file];
      implicit_adrs[Path builders are functions even when they take no arguments — the route's URL is callable, not a bare constant]
  - |-
    management route batch ZH:
      concepts.entities[ManagementSubRoute - one of namespaces / datasources / integrations / collectors / owners / tags / associations / roles / policies];
      concepts.invariants[BASE_PATH = '/management' is the single canonical prefix; consumers that hard-code /management drift silently];
      concepts.invariants[the nine sub-area slugs are compile-time-restricted to the literals in ManagementRoutes];
      implicit_adrs[Route modules declare BASE_PATH as a file-private inline const rather than importing from a shared routes module — 8 of 9 modules]
  - |-
    masterData route batch ZH:
      concepts.entities[LookupTable — the only first-class entity reachable via this route];
      implicit_adrs[Master Data is a top-level URL namespace reserved for a future family of master-data-management sub-features]
  - |-
    terms route batch ZH:
      concepts.entities[TermDetailsRoutes — frozen object literal with FIVE sub-route fragments; as const widens the values to literal-string types];
      concepts.invariants[generatePath is imported from react-router-dom and used to substitute the :termSearchId and :termId params; unlike alertsRoutes which imports nothing];
      implicit_adrs[termsPath() exists ONLY to keep the App.tsx route mount and the termDetailsPath prefix in lock-step];
      implicit_adrs[Sub-tabs taxonomy is fixed at 5 members — adding a new tab is a deliberate three-file change]
  - |-
    alerts route batch ZH (REFERENCE — from sibling sidecar):
      route module declares BASE_PATH inline + AlertsRoutes object literal for 3 sub-tabs;
      consumers import via routes/index.ts barrel
