proposed_action: |-
  Add `SessionCookieSecurityAttributesRegressionPinTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:

  1. `sessionCookie_loginFormSuccess_setCookieHeaderHasHttpOnlyAndLaxButNoSecure_pinsFrameworkDefault` — `@SpringBootTest` with `auth.type=LOGIN_FORM`; submit form-login; capture the response's `Set-Cookie` header; assert it contains `HttpOnly` AND does NOT contain `Secure` AND contains `SameSite=Lax`. PIN current framework-default state.

  2. `sessionCookie_oauth2Success_setCookieHeaderHasSameAttributesAsLoginForm_pinsCrossAuthModeUniformAbsence` — same fixture under `auth.type=OAUTH2`; confirm the cookie attributes are identical (the issue lives at the session backing store, not at the auth mode).

  3. `sessionTimeout_minusOneMeansNeverExpire_pinsCompoundRisk` — assert `spring.session.timeout: -1` in the bound `WebSessionProperties` (or whatever Spring binds it as); pin the relationship to TEST-GAP-779 (housekeeping no-op compound).

  Add a `// COMPOUND-RISK-PIN — SessionConfiguration wires zero cookie-security attributes. Combined with spring.session.timeout=-1 (never expire) + LOGIN_FORM ADMIN-for-every-user + CSRF disabled + no in-platform revocation, a stolen cookie grants permanent ADMIN access. This test pins the framework-default state until REFACTOR-NNN registers a CookieWebSessionIdResolver bean.` comment block.

  Pair with: (a) live-doc update for `/configuration-and-deployment/odd-platform#select-session-provider` covering cookie attributes AND production-deployment posture (Secure flag, TLS termination, SameSite=Strict for state-changing endpoints); (b) REFACTOR-NNN implementation registering a `CookieWebSessionIdResolver` bean with HttpOnly + Secure (configurable, default to env-detected) + SameSite=Strict + a sensible default timeout.
