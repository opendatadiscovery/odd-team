mitigations_unimplemented:
  - Change SecurityRule path strings to plural to match the OpenAPI surface
  - Add a @WebFluxTest regression that asserts a no-permission user receives 403
  - Build a startup invariant that scans SECURITY_RULES paths against OpenAPI paths
    and fails-fast on mismatch
  - |-
    **NEW batch K**: Build a startup invariant that scans SECURITY_RULES
    permissions for name-prefix consistency with the URL path's resource
    (e.g. `/api/alerts/*` paths should only be gated by permissions starting
    with `ALERT_` or `DATA_ENTITY_ALERT_`). This would have caught both
    REFACTOR-217 AND the alert-status DATASET_FIELD_ADD_TERM bug.
  - |-
    **NEW batch K**: Add @PreAuthorize at TermServiceImpl mutating methods
    for defence-in-depth — the service-tier-zero-permission-checks posture
    is the structural enabler that turns controller-tier path-mismatches
    into actual exploits.
  - |-
    **STRENGTHENED batch L**: Add @WebFluxTest regressions for BOTH the
    POST and DELETE halves of REFACTOR-217 — both halves are now
    primary-source pinned, so the test pair is the safety net for the
    one-PR fix.
