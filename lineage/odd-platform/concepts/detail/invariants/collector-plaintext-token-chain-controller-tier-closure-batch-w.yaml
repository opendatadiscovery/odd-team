description: |-
  STRENGTHENED INVARIANT, batch 2026-05-20W — adds the CONTROLLER-tier
  closure to the existing collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
  master invariant. The end-to-end plaintext token chain is now
  5-tier confirmed at primary source: (1) controller-tier (CollectorController +
  DataSourceController, THIS BATCH); (2) service-tier (CollectorServiceImpl +
  DataSourceServiceImpl, THIS BATCH + batch-B regenerateCollectorToken);
  (3) repository-tier (ReactiveCollectorRepositoryImpl + ReactiveTokenRepositoryImpl,
  batch R); (4) at-rest schema (V0_0_28__add_token.sql, batch R);
  (5) UI render-tier (CollectorsList batch Q + CollectorItemToken.tsx).

  THE NEW VERTEX — controller-tier confirmation (batch W):

    CollectorController batch W primary source confirms the
    plaintext-everywhere assumption at the HTTP entry-points:

      CollectorController.registerCollector (POST /api/collectors,
        lines 22-31): calls CollectorServiceImpl.create → returns
        Mono<ResponseEntity<Collector>> where Collector.Token.value
        is the FULL 40-character alphanumeric PLAINTEXT (via
        TokenDto(..., true) set in ReactiveTokenRepositoryImpl.create).
        Response header has NO Cache-Control: no-store, NO
        X-Sensitive-Body marker.

      CollectorController.regenerateCollectorToken (PUT
        /api/collectors/{id}/token, lines 46-51): same — returns
        the new plaintext token via TokenDto(..., true) from
        ReactiveTokenRepositoryImpl.updateToken.

      CollectorController.updateCollector (PUT /api/collectors/{id},
        lines 33-40): returns Token.value MASKED as
        '******{last6chars}' (via TokenMapper.mapValue using
        showToken=false default from listDto/getDto).

      CollectorController.getCollectorList (GET /api/collectors,
        lines 19-25): returns Token.value MASKED similarly. NO
        SecurityRule entry — any authenticated user enumerates.

    DataSourceController batch W primary source confirms the SAME
    pattern for the DataSource token (which IS THE COLLECTOR TOKEN
    per the schema — data_source.token_id REFERENCES token.id, the
    same TOKEN table that backs collectors):

      DataSourceController.registerDataSource (POST /api/datasources,
        lines 30-36): generates a new token via tokenGenerator.generateToken(),
        persists via tokenRepository.create, returns the DataSource
        with the embedded plaintext token. Same TokenDto showToken=true
        path.

      DataSourceController.regenerateDataSourceToken (PUT
        /api/datasources/{id}/token, lines 53-59): NOT
        @ReactiveTransactional (unique compared to other DataSource
        write paths) — in-memory rotation + DB write are separately
        committed. Same plaintext-everywhere semantic.

  THE CLOSED 5-TIER CHAIN — complete picture:

    Tier 1 — CONTROLLER (batch W primary source for both Collector + DataSource):
      Two register endpoints + two regenerate endpoints return the
      40-char alphanumeric plaintext token in the response body.
      The four endpoints share TokenDto's showToken=true branch
      (TokenMapper.mapValue at TokenMapper.java:15-18). NO response-
      header markers. The HTTP response is the wire-carrier of the
      credential.

    Tier 2 — SERVICE (batch B regenerateCollectorToken + batch S
    DataSourceServiceImpl + batch W class-level closure):
      CollectorServiceImpl + DataSourceServiceImpl both invoke
      TokenGenerator.regenerateToken/generateToken which mutates
      the in-memory TokenPojo via RandomStringUtils.randomAlphanumeric(40).
      The Random implementation is ThreadLocalRandom (NOT a CSPRNG).
      The plaintext value is then handed to the repository tier
      for persistence — NO sanitization, hashing, encoding at the
      service tier. Service classes are @ReactiveTransactional
      except DataSourceServiceImpl.regenerateDataSourceToken
      (line 98 missing annotation — file-local code-shape issue).

    Tier 3 — REPOSITORY (batch R ReactiveCollectorRepositoryImpl +
    ReactiveTokenRepositoryImpl):
      ReactiveTokenRepositoryImpl.create + .updateToken both INSERT
      / UPDATE the token.value column as plaintext. ReactiveCollectorRepositoryImpl.getByToken
      performs the SELECT-then-equality at line 89-97 — plaintext
      WHERE clause. No hashing, no salt, no BCryptPasswordEncoder.

    Tier 4 — AT-REST SCHEMA (V0_0_28__add_token.sql:1-9, batch R):
      token.value varchar(40) NOT NULL — plaintext column. NO
      UNIQUE constraint on value. NO index on value (the
      `getByToken` query falls back to sequential scan of the
      TOKEN table). Soft-deleted collectors' TOKEN rows persist
      forever (orphan-row class — see collector-plaintext-token-at-rest
      master invariant).

    Tier 5 — UI RENDER (batch Q CollectorsList + CollectorItemToken.tsx):
      CollectorItemToken.tsx:34 — `<Token>{collector.token.value}</Token>`
      renders the plaintext token directly into the DOM as a text
      node. NO `<input type="password">` obfuscation, NO Reveal-on-hover,
      NO auto-hide timer. Any browser extension, screenshot tool,
      accessibility screen reader, DOM-inspection tool, browser
      cache captures the credential.

  CONFIRMED EXPOSURE POINTS — six points where the credential
  could leak:

    (1) PostgreSQL row at rest — `SELECT * FROM token` (DB admin)
    (2) Backup / replica / pg_dump — credential travels with the row
    (3) jOOQ query log if enabled at DEBUG / TRACE — bound parameter
        surfaces
    (4) Application log if any code path logs TokenPojo — currently
        no such path but no defence either
    (5) Browser DOM after token creation/rotation — until full page
        unmount
    (6) Network transport — TLS-protected; no application-layer
        signing or HMAC

    PLUS new this batch:
    (7) HTTP response body buffered by reverse proxies, API gateways,
        APM tools, browser request-response loggers — between the
        platform's HTTP stack and the UI consumer, ANY intermediate
        component records the plaintext credential. No response
        header (Cache-Control: no-store, X-Sensitive-Body) marks
        the body as sensitive.

  THE REAFFIRMED LOAD-BEARING IMPLICIT ADR — plaintext-everywhere:

    Per the master invariant collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
    (originally batch R primary source), the plaintext-everywhere
    assumption IS the load-bearing architectural decision. Every
    component of the bearer-token flow assumes plaintext-at-rest.
    Introducing token hashing requires coordinated changes at FIVE
    layers (now SIX — the response header at the controller tier
    + the five tiers in the master).

    Batch W's closure adds:
      - HTTP response header surface (Cache-Control / X-Sensitive-Body
        annotations) — no defence at this layer either.
      - The DataSource token (same TOKEN table; same plaintext;
        same risk; same operator-facing surfaces) — broadens the
        master's Collector-only framing to include DataSources.
      - The DataSourceController.regenerateDataSourceToken missing
        @ReactiveTransactional — NEW partial-rotation failure mode
        (separate from the master's destructive-rotation class).

  WHY BATCH W EXISTS AS A SEPARATE INVARIANT:

    The master invariant is at 5-tier (SQL + filter + service +
    UI). Batch W adds an explicit CONTROLLER-tier vertex via the
    HTTP response body's role in carrying the plaintext, AND extends
    the framing from Collector-only to Collector+DataSource (since
    they share the TOKEN table). The master invariant's mitigations
    enumerate the FIVE layers needing coordinated changes; batch
    W adds the SIXTH layer (HTTP response).

    The TWO invariants together carry the complete picture; this
    one is the closure vertex.

  SEVERITY HIGH — same as the master invariant.

