evidence:
  - "ReactiveActivityRepositoryImpl.md says (stress_findings.C2): 'Symmetric truncate-to-second cursor with full-precision ORDER BY. ORDER BY at line 291 sorts at MICROSECOND precision (the created_at column is timestamp without time zone — PG's microsecond default). Cursor predicate at line 287-288 compares at SECOND precision on BOTH sides: row(trunc(created_at, SECOND), id) < (truncated_last_event_dt, last_event_id). No row skip (forward correctness): all rows with trunc(created_at, SECOND) < truncated_last_event_dt are unambiguously returned... Possible out-of-order within a second: ORDER BY treats created_at at microsecond precision; the cursor predicate cannot disambiguate two rows within the same second-bucket EXCEPT by id... Probe P-021 emitted to PIN the empirical behaviour under high write rate.' confidence: STATIC-INFERRED → PROBE-NEEDED for the visual-order claim. The 'no row skip' half is STATIC-VERIFIED."
  - "ReactiveActivityRepositoryImpl.md says (coherence_notes.rule9_supersedes): 'LSN-019 Stress Protocol (Rule 9, Category C — orderings) trace-answers that claim in stress_findings.C2: the truncation occurs ONLY ON THE LEFT side of the row-comparator (line 287-288 -- truncate column to second-precision AND truncate cursor to second-precision -- producing equal precision on the comparator); the ORDER BY at line 291 uses full-precision created_at DESC tied with id DESC. The combination is CORRECT for forward cursoring (every row that should be returned is returned) but produces a re-ordering anomaly at second boundaries... This is NOT skip rows but stable-result-but-shuffled-order-within-a-second-bucket. Stress Protocol corrects the severity classification and emits probe P-021.'"
  - "ReactiveActivityRepositoryImpl.md says (implicit_adrs.[1]): 'Cursor pagination uses SYMMETRIC truncate-to-second comparator + full-precision ORDER BY: the asymmetry between comparator-precision and sort-precision is intentional — the client passes lastEventDateTime as an OffsetDateTime whose microsecond precision may have been altered by JSON serialisation (the ISO-8601 wire format only carries 3 decimal digits in some clients); truncating both sides of the comparator to second accommodates that loss while the ORDER BY preserves full-precision newest-first sort.' confidence: MEDIUM"
  - "Verified at primary source: ReactiveActivityRepositoryImpl.java:285-288 + line 290-291 + V0_0_48__add_activity.sql:9 (timestamp microsecond precision) + V0_0_48__add_activity.sql:15 (created_at index — plain column, not functional)"
