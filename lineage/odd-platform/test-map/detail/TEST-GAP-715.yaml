  - "AppInfoController.md says (bugs_limitations_corner_cases.[1]): 'No validation that authType matches the documented enum DISABLED | LOGIN_FORM | OAUTH2 | LDAP. A typo (OUATH2, LOGINFORM) silently disables ALL @ConditionalOnProperty(havingValue=...) matches and produces the same no-SecurityWebFilterChain deployment as the empty-string case. Meanwhile /api/appInfo continues to echo the typo back to clients. Combined with Overview.tsx:26''s !== DISABLED check, a typo passes the gate and renders OwnerAssociation in a deployment that has no working authentication.' severity: MEDIUM"
  - "AppInfoController.md says (concepts.invariants.[1]): 'authType is whatever Spring resolved for ${auth.type} — NO normalisation, NO enum constraint, NO @Value default at the injection site'"
