gap_id: TEST-GAP-121
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java IngestionDataEntitiesFilter config-key-consumer:auth.ingestion.filter.enabled@L20
surfaced_by:
- IngestionDataEntitiesFilter@L20.md:bugs_limitations_corner_cases.[2]
- IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[1]
behaviour: Token comparison is `.equals(...)` (IngestionDataEntitiesFilter.java:56),
  not `MessageDigest.isEqual(...)` — vulnerable to timing-based token discovery on
  a low-latency network. 40-char alphanumeric search space (62^40 ≈ 2.4e71) makes
  the practical attack surface small but the principle is violated. Same issue in
  sibling `S2sAuthenticationFilter`. Pairs with the producer-side entropy concern
  at TEST-GAP-098.
