- id: H-002
  hypothesis: "When a producer POSTs a stat keyed by a field ODDRN that belongs to dataset B, but declares the parent `datasetOddrn` as dataset A, the platform writes the stat to dataset A's field (or rejects the mismatch) — i.e. the declared parent dataset bounds where the write lands."
  derivation: "The DTO pairs a parent `datasetOddrn` with a `fields` map; a product owner reading 'push statistics for dataset A' expects the write confined to dataset A's columns, not to any column whose ODDRN the caller happens to know."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The write is scoped ENTIRELY by the field ODDRN: `updateStatistics` resolves
      target rows via `getLastVersionDatasetFieldsByOddrns(statistics.keySet())`
      where the keys are the field ODDRNs from the payload. The declared parent
      `datasetOddrn` is consumed ONLY to compute the set of dataset ODDRNs whose
      FTS vector to recalc (lines 168-170, 179). There is no JOIN from the resolved
      field back to `dataset_oddrn`, and no consistency check. A payload
      `{datasetOddrn: A, fields: {<field-of-B>: stat}}` writes the stat to dataset
      B's field while recalcing FTS on dataset A.
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: concepts.invariants[4]
        cite: "DatasetFieldServiceImpl.java:172-174 (resolve by field ODDRN) + 168-170,179 (datasetOddrn used only for FTS)"
        note: "write target is field-ODDRN; parent claim feeds FTS only"
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: bugs_limitations_corner_cases[1]
        cite: "DatasetFieldServiceImpl.java:158-181 (no parent-child cross-check)"
        note: "explicit: no parent-child consistency check anywhere in the chain"
    operator_visible_failure: |
      (1) Cross-dataset stats poisoning: a caller who knows one field's ODDRN
      overwrites that field's profile while the audit-confusing FTS recalc fires on
      an unrelated, attacker-named dataset. Field ODDRNs follow a deterministic
      naming convention and are visible to every authenticated catalog viewer, so
      they are enumerable. (2) The operator viewing dataset B's Structure tab sees
      statistics they cannot explain and cannot attribute (no audit — see H-011),
      and a confused investigator looking at dataset A's FTS/search churn finds no
      stats change there. (3) Combined with the unauthenticated posture (H-003),
      any HTTP caller — not merely a misconfigured collector — can do this. The
      Quality Dashboard rings (F-032) and per-dataset SLA (F-022) aggregate the
      poisoned values, so the blast radius is the catalog-wide DQ surface, not one
      column.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: "When the platform is deployed with a UI auth mode enabled (`auth.type=OAUTH2/LDAP/LOGIN_FORM`) and/or the ingestion filter on (`auth.ingestion.filter.enabled=true`), an unauthenticated caller POSTing to `/ingestion/entities/datasets/stats` is rejected (401/403)."
  derivation: "Pillar P-09's stated contract is that operators configure authentication for write surfaces; an operator who turns on OAUTH2 + the ingestion filter reasonably expects every ingestion write to require a credential."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The endpoint is unauthenticated under EVERY combination of `auth.type` and
      `auth.ingestion.filter.enabled`. `/ingestion/**` is in
      `SecurityConstants.WHITELIST_PATHS` (SecurityConstants.java:95-96) so the UI
      auth chain never sees it; and `IngestionDataEntitiesFilter`'s path matcher is
      exact-literal `/ingestion/entities` POST (IngestionDataEntitiesFilter.java:28)
      so it does not match the sub-path. The controller carries no `@PreAuthorize`
      and the OpenAPI-generated `IngestionApi` interface carries no security
      annotation. The live Security doc page confirms verbatim: this path "remains
      outside the ingestion filter's coverage" and is "Unauthenticated under
      auth.type = DISABLED, OAUTH2, or LDAP — even when the ingestion filter is
      enabled."
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: security.auth_mode_relevance
        cite: "IngestionController.java:81-87 + IngestionDataEntitiesFilter.java:28 + SecurityConstants.java:95-96"
        note: "no method auth; exact-literal filter matcher; whitelist"
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: docs_link_semantic.inferred_docs[1]
        cite: "WebFetch enable-security 2026-05-20 (status 200) — verbatim 'outside the ingestion filter's coverage'"
        note: "live doc confirms the gap"
    operator_visible_failure: |
      An operator who has done everything the Security docs ask — enabled OAUTH2 for
      the UI and turned on the ingestion filter — still has an open, anonymous write
      endpoint for dataset statistics. The property `auth.ingestion.filter.enabled`
      reads as "protect the ingestion namespace" but its matcher protects exactly
      one sibling endpoint; flipping it to true gives the operator a false sense
      that all of `/ingestion/*` is now gated. Any caller able to reach the port can
      poison stats (H-002) and mint tags (H-006).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

