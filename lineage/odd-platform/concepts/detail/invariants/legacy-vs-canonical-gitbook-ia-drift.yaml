name: Legacy-vs-canonical GitBook IA drift
canonical_in_docs: false
canonical_candidate: true
description: 'Cross-cutting doc-IA invariant: ODD''s documentation has TWO parallel
  path schemes for active platform features — `active-platform-features/{slug}` (legacy
  / index-linked) and `features/active-platform-features/{slug}` (canonical / current).
  The canonical path returns 200; the legacy path returns 404 even though the active-platform-features
  index page links to it. **3-SIDECAR TRIANGULATED (batch E)**: (a) DataCollaboration
  (batch 2026-05-10A, postMessageInSlack.docs_link_semantic.doc_drift_findings[2])
  — `/active-platform-features/data-collaboration` returns 404 vs canonical `/features/active-platform-features/data-collaboration`
  200. (b) Notifications (batch 2026-05-12C, NotificationsProperties.docs_link_semantic.doc_drift_findings[0])
  — `/active-platform-features/notifications` returns 404 vs canonical `/features/active-platform-features/notifications`
  200. (c) Search (batch 2026-05-12E, search.md:docs_link_semantic.inferred_docs[1])
  — `/features/active-platform-features/search` returns 404 (negative result captured
  deliberately so future doc-gap passes don''t retry it) vs canonical `/features/data-discovery/search`
  200. Notably, search lives under `data-discovery` rather than `active-platform-features`
  — the docs IA splits the search feature OUT of the parallel pattern but the page
  exists at canonical only. The drift class is index-page-link-rot: the parent index
  page (or a sibling navigational element) carries the legacy path while the page
  itself has been moved. Operators Googling ''odd data collaboration'', ''odd notifications'',
  or ''odd search'' currently land on a mix of broken pages and unexpected paths.'
