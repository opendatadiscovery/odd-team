behaviour: |-
  Permission-vector contract — WithPermissionsProvider at DataEntityDetails.tsx:82-87 receives a 3-permission vector (DATA_ENTITY_INTERNAL_NAME_UPDATE, DATA_ENTITY_GROUP_UPDATE, DATA_ENTITY_STATUS_UPDATE) + the resourcePermissions selector result, gating descendant mutation affordances. Tests must pin (a) the precise permissions vector passed to the provider; (b) that mutation affordances inside the header disappear when permissions absent; (c) that the description CONTENT renders regardless of permission state (partial-gating invariant from sibling DataEntityDescription cluster). A junior-developer refactor "hoisting" WithPermissions to wrap the entire cluster would silently break read access for non-editors AND would be undetected today.
