# P-022 — Activity housekeeping: empty-only DROP contract verification (Stress Protocol E1)

stress_category: E (resource boundaries)

triggers:
  - PartitionServiceImpl.java:120-127 (DROP TABLE DDL — plain JDBC, no IF EXISTS)
  - HousekeepingJobManager.java:25-39 (@Scheduled 15-min, @SchedulerLock cluster mutex)
  - ActivityEmptyPartitionsHousekeepingJob.java:9-17 (targets activity table)
  - EmptyPartitionsHousekeepingJob.java:17-33 (iterates empty past partitions, drops each)
  - PartitionServiceImpl.java:133-142 (isPartitionEmpty: SELECT count(*) = 0)
  - LSN-019 Stress Protocol Category E (resource boundaries)

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      SELECT child.relname AS partition_name
      FROM pg_inherits
      JOIN pg_class parent ON pg_inherits.inhparent = parent.oid
      JOIN pg_class child ON pg_inherits.inhrelid = child.oid
      WHERE parent.relname = 'activity'
      ORDER BY child.relname
    capture_as: existing_activity_partitions

  # Create an EMPTY past partition. This will be dropped by housekeeping.
  - kind: sql
    query: |
      CREATE TABLE IF NOT EXISTS activity_20200101_20200131
      PARTITION OF activity
      FOR VALUES FROM ('2020-01-01') TO ('2020-01-31')

  # Setup: create a data_entity for the non-empty-partition row.
  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (1022, '//probe-source-P-022/db', 'probe-source-P-022')
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, view_count,
         source_created_at, source_updated_at)
      VALUES (1022, '//probe-source-P-022/db/tables/p022_activity_target',
              'p022_activity_target', 1022, 1, 0, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # Create a SECOND past partition (different date range) and INSERT a row.
  - kind: sql
    query: |
      CREATE TABLE IF NOT EXISTS activity_20200201_20200229
      PARTITION OF activity
      FOR VALUES FROM ('2020-02-01') TO ('2020-02-29')

  - kind: sql
    query: |
      INSERT INTO activity
        (data_entity_id, event_type, is_system_event, created_at, created_by)
      VALUES (1022, 'DESCRIPTION_UPDATED', false,
              '2020-02-15T12:00:00'::timestamp, 'p022_user')

  - kind: sql
    query: |
      SELECT COUNT(*) AS empty_count FROM activity_20200101_20200131
    capture_as: empty_partition_row_count

  - kind: sql
    query: |
      SELECT COUNT(*) AS nonempty_count FROM activity_20200201_20200229
    capture_as: nonempty_partition_row_count

act:
  # Trigger the housekeeping cycle. See realism_caveats for the endpoint
  # requirement.
  - kind: rest
    method: POST
    path: "/api/internal/housekeeping/run-now"
    body: {}
    capture_as: housekeeping_response

  - kind: sleep
    seconds: 5

observe:
  - kind: sql
    query: |
      SELECT COUNT(*) AS exists_count
      FROM information_schema.tables
      WHERE table_schema = 'public' AND table_name = 'activity_20200101_20200131'
    capture_as: empty_partition_exists_after

  - kind: sql
    query: |
      SELECT COUNT(*) AS exists_count
      FROM information_schema.tables
      WHERE table_schema = 'public' AND table_name = 'activity_20200201_20200229'
    capture_as: nonempty_partition_exists_after

  - kind: sql
    query: |
      SELECT COUNT(*) AS row_count
      FROM activity
      WHERE data_entity_id = 1022 AND created_by = 'p022_user'
    capture_as: surviving_row_count

assert:
  - "empty_partition_row_count == 0"
  - "nonempty_partition_row_count == 1"

  # PRIMARY: housekeeping dropped the empty past partition.
  - "empty_partition_exists_after == 0"

  # CRITICAL SAFETY: housekeeping did NOT drop the non-empty past partition.
  # If this assertion ever fails, the empty-only-drop contract is broken
  # and the housekeeping has silently destroyed audit data.
  - "nonempty_partition_exists_after == 1"

  - "surviving_row_count == 1"

cleanup:
  - kind: sql
    query: |
      DELETE FROM activity WHERE data_entity_id = 1022 AND created_by = 'p022_user'

  - kind: sql
    query: |
      DROP TABLE IF EXISTS activity_20200201_20200229

  - kind: sql
    query: |
      DROP TABLE IF EXISTS activity_20200101_20200131

  - kind: sql
    query: |
      DELETE FROM data_entity WHERE id = 1022

  - kind: sql
    query: |
      DELETE FROM data_source WHERE id = 1022

  - kind: docker-compose-down
    destroy_volumes: true

