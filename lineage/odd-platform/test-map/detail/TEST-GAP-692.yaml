behaviour: |-
  **`AlertServiceImpl.updateStatus` UNDER `auth.type=DISABLED` STILL COMPLETES THE UPDATE WITH `status_updated_by=NULL` — audit-attribution leak.** Line 117 calls `authIdentityProvider.getCurrentUser()` which returns `Mono.empty()` under DISABLED; line 119's `switchIfEmpty(alertRepository.updateAlertStatus(alertId, status, null))` fallback proceeds with `username=null`. The audit trail loses the actor; the activity-feed row (emitted via the `@ActivityLog` AOP at line 112) records the `dataEntityId` and the new status but cannot attribute the change. The behaviour is intentional for SYSTEM-CONTEXT callers (system events ARE allowed to have null updated_by) but combined with the absence of any controller-layer access check on `PUT /api/alerts/{id}/status` (per `AlertController.changeAlertStatus` neighbour sidecar, severity HIGH) it means under DISABLED an anonymous caller can mutate ANY alert and leave NO actor attribution. This is the SERVICE-TIER mirror of the F-007 `unauthenticated_payload_trust` facet — distinct from the AlertManager webhook's unauthenticated-by-design model: `updateStatus` is on the UI surface where authentication IS expected under non-DISABLED modes.
