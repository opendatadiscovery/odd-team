      AuthorizationCustomizer (which applies SECURITY_RULES) is NOT wired under
      DISABLED, so every /api/** path including the seven directory lists is served
      to any caller. The Title auth_gates block confirms: "DISABLED — endpoint is
      unauthenticated; any caller sees the full title list". The live /features/
      management doc now warns "Any authenticated user (anonymous under DISABLED)".
