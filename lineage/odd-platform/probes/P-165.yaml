      INSERT INTO owner (id, name) VALUES (9002, 'p165_updater') ON CONFLICT DO NOTHING;
      INSERT INTO role (id, name) VALUES (9102, 'p165_updater_role') ON CONFLICT DO NOTHING;
      INSERT INTO policy (id, name, policy_schema) VALUES (
        9202, 'p165_updater_policy',
