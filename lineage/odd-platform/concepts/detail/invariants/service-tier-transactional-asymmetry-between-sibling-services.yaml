notes: |
  Cross-batch architectural-hygiene observation surfaced by triangulating the 5 batch-I
  service-layer sidecars together. The platform's IDIOM is "service-tier @ReactiveTransactional
  delimits multi-statement writes"; the ASYMMETRY is between siblings that should
  follow the idiom uniformly but don't.

  Concrete instances surfaced by batch I:

    (a) PolicyServiceImpl.update lost-update race (MEDIUM): no transaction; concurrent
        PUTs on same policy id can lost-update silently. Sibling RoleServiceImpl
        IS transactional. One-line fix: add @ReactiveTransactional to PolicyServiceImpl.update.

    (b) PolicyServiceImpl.delete orphan-binding race (MEDIUM): non-atomic cascade
        check + soft-delete. A concurrent role binding lands between check and
        soft-delete → soft-deleted policy with surviving role bindings. This is
        the EXACT state batch H identified at the repository layer (getRolesPolicies
        JOIN missing deleted_at filter).

    (c) AlertServiceImpl.updateStatus DELIBERATE absence: the ActivityAspect AOP
        provides the wrapping transaction; the reopen-conflict guard catches the
        data-integrity case at the application level. Distinct from PolicyServiceImpl's
        oversight-shaped absence.

  Recommended cleanup paths:

    - Audit every service-layer method that calls a Reactive*Repository to confirm
      @ReactiveTransactional is present on read-then-write paths.

    - Surface a project-internal `@RequiresTransaction` annotation on repository
      methods that callers MUST wrap (e.g. `update`, `delete`, `cascade-check-then-delete`).
      Verify at build time via Spring AOP or custom Checkstyle rule.

    - Document the convention in a top-level repository conventions doc so future
      maintainers can infer the atomicity contract from a single canonical location.

  Cross-references:
    - Companion invariant: `repository-transactional-boundary-at-service-layer-not-repository`
      (batch H — established the platform's repository-side untransactional posture).
    - Companion invariant: `reopen-conflict-server-enforced-application-logic-not-db-constraint`
      (batch I — the compensating mechanism for AlertServiceImpl.updateStatus's
      deliberately-non-transactional posture).
