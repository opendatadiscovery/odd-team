- id: H-006
  hypothesis: |-
    When a user submits a question containing PII or secrets (an email, a credit card number, an API key
    pasted by mistake), the platform redacts or at least detects it before forwarding to the external LLM,
    so sensitive data does not silently cross the operator's trust boundary.
  derivation: |-
    Negative-space + data-exposure: operators pointing genai.url at a third-party SaaS LLM (the typical
    case) are subject to that vendor's data-retention policy; a data-catalog product handling potentially-
    sensitive metadata would, by default, be expected to guard the boundary.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The question text is forwarded verbatim. GenAIServiceImpl.java:41-43 builds the outbound body as
      Map.of("question", request.getBody()) with no scrubber, no allowlist, no PII/secret detection, no
      length cap, no system-prompt overlay. The live feature page confirms the stance ("No prompt
      modification: Questions are forwarded verbatim") and now also explicitly states "No PII redaction.
      The user's question text ... flows verbatim to the external LLM" (WebFetch 2026-06-01). So the
      behaviour is real AND now documented (DOC-184 caveat 1c).
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: security.known_security_gaps[1] + data_exposure[0]
        cite: "GenAIServiceImpl.java:41-43 + WebClientConfiguration.java:26-29"
        note: "Verbatim forward; no redaction or content filter."
    operator_visible_failure: |-
      (1) Sensitive content leaves the trust boundary — any authenticated user can paste secrets/PII into a
      question and it reaches the configured external service, subject to that vendor's retention. (2)
      Prompt-injection content is equally unfiltered (see H-007). The mitigating fact is that the live docs
      now disclose this clearly (DOC-184), so it is a documented design stance rather than a hidden defect —
      which is why this routes to caveat (already satisfied) rather than bug. The residual product question
      (an optional scrub hook, PLT-020 PR-4) is a roadmap item.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # no test asserts verbatim-forward / absence of redaction (a characterization test would pin the documented stance)

- id: H-007
  hypothesis: |-
    When a user submits a prompt-injection / jailbreak payload (role-override text, system-prompt-overriding
    instructions), the platform neither filters it nor leaves a trace of it — i.e. the platform applies no
    safety boundary and an operator cannot detect the attempt from platform data.
  derivation: |-
    Endpoint-shape (free-text body, unconstrained) + the "assistant" framing implies some safety posture; a
    senior PO asks where the safety boundary is and confirms whether the platform abdicates it entirely.
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |-
      The platform applies no safety boundary and leaves no trace. The body is forwarded verbatim
      (GenAIServiceImpl.java:41-43) with no content scan; there is no log of the prompt (H-005). The live
      feature page is explicit that injection handling "falls to your external service implementation"
      (WebFetch 2026-06-01). The hypothesis (no filter AND no trace) is exactly what the code does —
      confirmed as a deliberate thin-proxy stance, with the operator-relevant nuance that the no-trace half
      compounds the no-filter half. Probe P-158 (already emitted by the file-analyser) pins verbatim-forward
      + no-platform-trace against WireMock.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: security.known_security_gaps[1] (+ implicit_adrs[2] thin-proxy)
        cite: "GenAIController.java:19-23 + GenAIServiceImpl.java:36-52 (body forwarded verbatim; no transformation/validation/length check)"
        note: "Body forwarded verbatim; no filter; no log."
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_controller__controller__GenAIController
        section: bugs_limitations_corner_cases (probe trail)
        cite: "lineage/odd-platform/probes/P-158.yaml"
        note: "P-158 pins verbatim-forward + no-platform-trace (exists in probes/)."
    confidence: HIGH
    probe_id: P-158        # already emitted by the file-analyser; exists at probes/P-158.yaml
    routes_to_finding: functional-test-demand
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional   # CONFIRMED-but-untested: a characterization test (verbatim-forward + no-trace) guards the documented thin-proxy stance against silent change. P-158 is the probe; no committed test pins it.
    note: |-
      LSN-030 exemplar: the v0.1.0 reflection routed this confirmed hypothesis to caveat-candidate and
      stopped. v0.3.0 ALSO demands the functional test — the no-filter+no-trace COMBINATION is a deliberate
