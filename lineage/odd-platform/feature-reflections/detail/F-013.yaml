- id: H-006
  hypothesis: "After an operator edits a metadata value, the value row remains active (visible) — editing a value does not toggle the row's visibility/active state."
  derivation: "Response-shape: the value row carries an `active boolean DEFAULT TRUE` column; editing the VALUE should not change the row's active flag — a user expects an edit to change only what they edited."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      ReactiveMetadataFieldValueRepositoryImpl.java:98 writes `.set(ACTIVE, pojo.getActive())`, but the upsert path's pojo (DataEntityServiceImpl.java:292-295) never calls setActive(...). The jOOQ-generated getActive() returns boxed Boolean null. The column is `boolean DEFAULT TRUE` but DEFAULTs apply on INSERT only; an UPDATE writing NULL drops a previously-TRUE row to NULL. Every edit silently sets active=NULL.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityMetadataFieldValue
        section: bugs_limitations_corner_cases[4]
        cite: "ReactiveMetadataFieldValueRepositoryImpl.java:97-98 + DataEntityServiceImpl.java:292-295 + V0_0_1__init.sql:180"
        note: "active=NULL regression on every UPDATE"
    operator_visible_failure: |
      Any platform code (current or future) that filters `WHERE active = TRUE` rather than `IS DISTINCT FROM FALSE` silently drops every edited row — the value vanishes from that query after the first edit. The sidecar flags the downstream consumers of `active` as not exhaustively audited, so the blast radius is unverified; the regression itself is certain. This is a latent state-corruption bug invisible until a consumer filtering strictly-TRUE is added.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

