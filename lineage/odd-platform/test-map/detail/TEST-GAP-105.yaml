gap_id: TEST-GAP-105
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java AppInfoController config-key-consumer:auth.type@L18
surfaced_by:
- AppInfoController@L18.md:bugs_limitations_corner_cases.[4]
behaviour: 'LOGIN_FORM whitelist gap: `/api/appInfo` is NOT in `SecurityConstants.WHITELIST_PATHS`
  and NOT in `LoginFormSecurityConfiguration.permittedPaths`. Under LOGIN_FORM the
  SPA needs the `authType` response BEFORE the user authenticates (to render the login
  form), yet the configuration falls through to `.authenticated()`. Either current
  configuration relies on a path not traced, or SPA calls `/api/appInfo` post-auth
  — undocumented behaviour either way.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/AppInfoLoginFormReachabilityTest.java
  name: getAppInfo_loginFormPreAuth_eitherWhitelistedOrReturns401
evidence:
- 'AppInfoController@L18.md says: ''under LOGIN_FORM, the SPA needs the response BEFORE
  the user has authenticated (to render the form) ... if the former, the current configuration
  must be relying on a request being permitted by some path I have not traced'''
cross_references:
- concepts.yaml:entities[Deployment Introspection (/api/appInfo)].security_aggregate.weaknesses.[3]
proposed_action: Add `@WebFluxTest` parameterised over `auth.type=LOGIN_FORM`; assert
  anonymous GET `/api/appInfo` either returns 200 (whitelist works via a path not
  yet identified — surfaces the path) or 302/401 (SPA must auth first — surfaces the
  inconsistency with intended UX).
