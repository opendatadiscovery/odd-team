behaviour: |-
  **HIGH — Slack mrkdwn injection via `AlertChunkPojo.description`.** `AlertChunkPojo.description` strings flow into Slack as `markdownText(...)` at `SlackMessageGenerator.java:77` (the chain `buildDescriptionsFromChunks` helper at lines 95-101 builds the description block from the latest 3 chunks). Slack interprets `*bold*`, `_italic_`, `~strikethrough~`, `<url|text>`, `@channel`, `@here`, `<!channel>`, `<!here>` as mrkdwn markup. `AlertChunkPojo` populates `.description` from ingestion-side `AlertActionResolverImpl.java:162` which sets it from upstream collector-supplied content (e.g. a dbt test description, a Great Expectations expectation result string, a schema-diff narrative).

  **The F-004 cross-pillar XSS / injection family — 6th surface confirmed at the Slack channel**. Prior 5 surfaces enumerated in F-004:
  - DOM-tier markdown rendering (UI side; LSN-017 measured truth)
  - DataEntity description (mid-tier)
  - DatasetField description (mid-tier)
  - QueryExample Markdown (P-02)
  - ReferenceData LookupCharValidator (P-03)

  This gap pins the 6th surface: outbound Slack notifications. Distinct from the UI surfaces in that the ATTACK SINK is a Slack workspace's channel members (not browser users). An upstream-side actor with control over the description string can inject:
  - `@channel` → broadcast-notify the entire Slack channel membership (operationally disruptive)
  - `<!here>` → alert online users in the channel
  - `<https://attacker.example/|click here>` → render a fake-link with operator-trusted text (phishing within an operator-trusted channel)
  - `*bold*` / `_italic_` / `~strikethrough~` → spoof formatting authority (e.g. fake `*CRITICAL ALERT*` for a benign event)

  **The attack vector is upstream-collector-side**: ingestion accepts arbitrary descriptions; ODD does NOT validate / sanitise / escape collector-supplied content per the platform's "trust upstream metadata" stance. A compromised collector OR a malicious metadata-source row can inject the markup. The trust boundary is wide: any of the 41 pull-collector adapters + 6 push-adapter shapes (per P-10) is a viable injection point.

  **No mitigation in code**:
  - No `MrkdwnUtils.escape(...)` exists in `MrkdwnUtils.java:1-14`; the only mrkdwn helpers are `bold(...)` and `buildLink(...)` for platform-controlled strings — operator-supplied / ingestion-supplied strings are passed through raw.
  - No allowlist on description chars, no length cap, no normalisation.
  - No live-doc warning to operators.

  **Distinguishes from prior coverage**: F-004's existing 5 surfaces are all UI XSS / markdown-rendering surfaces. The Slack mrkdwn-injection surface is a NEW SINK class — an external workspace channel, not a browser. Operator threat-model for the Slack channel is "I trust the channel members"; the platform's threat-model is "I trust the upstream collectors". The two trust models don't compose: a compromised collector becomes an injection sink that reaches the operator's trusted Slack channel verbatim.

  **Test gap shape**: regression-pin asserting that mrkdwn metacharacters in `alertChunks.description` reach the Slack POST body verbatim. PINS the current vulnerability; pairs with REFACTOR-NNN adding a `MrkdwnUtils.escape(...)` helper.
