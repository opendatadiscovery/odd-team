proposed_action: |-
  Testcontainers test. (a) Seed Administrator (V0_0_56). create(new RolePojo().setName("Administrator")) → UniqueConstraintException with message 'Role with this name already exists'. (b) Direct UPDATE: SET role.deleted_at = NOW() ON Administrator row. (c) create(new RolePojo().setName("Administrator")) — SUCCEEDS (the partial unique index permits it). (d) Attacker now creates RoleFormData binding to attacker-controlled Policy → RoleServiceImpl.create succeeds. (e) Test comment: 'PINS the exploitable asymmetry. Future fix adding name-protection to RoleServiceImpl.create would FLIP step (c) to BadUserRequestException.'
