behaviour: |-
  **SLA PNG-vs-JSON ENDPOINT CONFUSION — operator follows our guide off a cliff.** The live `documentation/docs/data-quality/sla-statuses.md` page (WebFetched 2026-05-20 status 200) tells operators: "Each dataset exposes its current aggregate SLA at: `GET https://{platform_url}/api/datasets/{data_entity_id}/sla` … The endpoint returns a `DataSetSLAReport` that includes: The dataset's current SLA colour — GREEN, YELLOW, or RED. A breakdown of severity weights — counts of tests at each severity. A slaRef self-link." A BI engineer following the docs verbatim writes a JSON-parsing client pointed at `/api/datasets/{id}/sla`. **The code returns `image/png`** (`DataQualityController.java:42-48` + `openapi.yaml:1880-1894` + `CachingByteArraySLAResourceResolver.java:44-49` mapping `GREEN → sla/sla_green.png`, etc.). The client receives a 1-2KB PNG byte stream and fails to deserialise. The JSON endpoint they want is `/api/datasets/{id}/sla_report` (sibling, operationId `getDatasetSLAReport`, `openapi.yaml:1898-1913`). The docs conflate the two endpoints. **No test catches this**: `find <odd-platform> -path '*test*' -name 'DataQualityController*'` returned no matches (verified 2026-05-20); the only SLA tests are calculator-tier (`SLAColourTest`, `SLAReportTest`) which exercise the algorithm in isolation, not the HTTP boundary. A regression that flips the content-type to JSON (or accidentally aligns the code with the docs) would silently break every BI dashboard that embeds the PNG; a regression that breaks the PNG-byte path would silently leave the docs lying. The test pins BOTH paths simultaneously: assert `/sla` returns `image/png` with non-zero byte body matching the expected `sla_{red,yellow,green}.png` classpath bytes; assert `/sla_report` returns `application/json` matching the `DataSetSLAReport` schema. Future maintainers fixing the doc-vs-code drift will need to decide which side moves; the test forces the decision rather than letting one side silently drift.
