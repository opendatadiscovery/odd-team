behaviour: |-
  WAL replay-loop regression-pin for poison-message handling. A RuntimeException from translate() (unknown alert-type code at AlertNotificationMessageTranslator.java:87 IllegalArgumentException, missing or duplicate alerted-entity rows at lines 94-101 IllegalStateException) bypasses AlertNotificationMessageProcessor's per-sender try/catch and reaches NotificationSubscriber.java:90. The subscriber logs the error, releases the advisory lock, waits 10s via Thread.sleep, then re-acquires and re-decodes the SAME WAL LSN. setAppliedLSN/setFlushedLSN are NOT called for the failing LSN at line 83-84 (only called inside the try block AFTER process() returns successfully). The poison message replays indefinitely with 10s back-off between cycles. No test pins this contract — a regression that wrapped translate() in try/catch and advanced LSN on failure would silently drop alerts; a regression that removed the 10s back-off would burn CPU and DB on replay; a regression that broke the FK / type-code constraints upstream would block the entire notification subsystem indefinitely.
test_class: missing-edge-case
