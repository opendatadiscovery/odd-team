proposed_action: |-
  Add `GenAIAuditTrailAbsenceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Three test methods:
  1. `genAiAsk_promptAndResponse_absentFromActivityFeedAndApplicationLog_pinsForensicsGap` — submit a prompt with caller A; immediately query `/api/activity` for caller A's recent events; assert NO entry references GenAI / LLM / prompt / `/api/genai/ask`. PIN the absence.
  2. `genAiAsk_applicationLogRemainsSilent_evenForLargeOrSuspiciousPrompts_pinsLogAbsence` — submit a 19MB prompt with suspicious content (e.g. "ignore previous instructions"); capture application logs via TestAppender; assert no log entry references the prompt content, the prompt size, or the user id. PIN the application-log absence.
  3. `genAiAsk_underDISABLED_anonymousPrompt_noTrailAtAll_pinsAnonymousGenAIAbusePosture` — under DISABLED, anonymous caller submits 5 prompts; assert no activity-feed entry + no application-log entry + no Micrometer counter increment exists for GenAI invocations. PIN the worst-case posture: anonymous user + zero audit trail.

  Pair with REFACTOR-NNN: add `GEN_AI_PROMPT_SUBMITTED` ActivityEventType; emit at controller entry capturing (caller-id, prompt-hash, prompt-byte-length, upstream-response-status). Operator-toggleable verbatim-text capture via `genai.audit.full_text=true` for compliance contexts. Pair with DOC-NNN: surface the audit posture on the live GenAI page.
