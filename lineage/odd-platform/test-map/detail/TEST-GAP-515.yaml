behaviour: |-
  Unstable-pagination `listByOddrns` no-ORDER-BY regression-pin (MEDIUM — P-05). `ReactiveDataEntityRepositoryImpl.java:247-250` builds `DSL.selectFrom(DATA_ENTITY).where(conditions).limit(size).offset(page)` with NO `.orderBy(...)` call. Postgres does NOT guarantee row order without an explicit ORDER BY — the order is implementation-defined. Pagination across pages may produce: (a) duplicate entries between consecutive requests, (b) missing entries between consecutive requests, (c) seemingly random reordering when underlying table is updated. The base `/my` endpoint shares this issue (per batch G TEST-GAP-077) but the symptom is more acute for `/my/upstream` and `/my/downstream` because the derived oddrn set is itself in-memory-materialised (no stable ordering) and then SQL-paginated. The combined effect: an operator paginating through their upstream lineage neighbours sees an effectively random subset on each page. NO test pins the unstable contract. The cure is either (a) `.orderBy(DATA_ENTITY.ID)` for stable keyset ordering, or (b) `.orderBy(DATA_ENTITY.UPDATED_AT.desc())` for recency ordering. The fix is one line; the regression-pin documents the current contract and would FLIP when the fix lands.
