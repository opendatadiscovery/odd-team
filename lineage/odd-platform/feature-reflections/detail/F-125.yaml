- id: H-002
  hypothesis: "When an operator rotates a token, the previous token keeps working for a short grace period so they can reconfigure the running collector without an ingestion outage."
  derivation: "Endpoint shape: the operation is named 'regenerate'/'rotate'; a senior operator's mental model of credential rotation in a production system (cf. AWS access-key rotation, GitHub PAT regeneration) defaults to a make-before-break overlap window. Tested against the repository write path."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      There is no grace period — rotation is a destructive in-place UPDATE of the single token row. TokenGeneratorImpl
      mutates the existing TokenPojo's value to a fresh 40-char string in memory; ReactiveTokenRepositoryImpl.updateToken
      issues `UPDATE token SET value=<new> WHERE id=:id`. There is exactly ONE token row (1:1 with the collector/datasource
      via token_id), no `previous_token` column, no `valid_until`. The cutover is atomic and binary: the instant the UPDATE
      commits, the old value no longer exists anywhere and `IngestionDataSourceFilter`/`IngestionDataEntitiesFilter` start
      returning 401 `Token is not correct` for any in-flight request carrying it (regenerateCollectorToken/regenerateDataSourceToken
      sidecars; the latter's stress name_behavior_pair explicitly classifies this as "instantaneous and binary, no grace window").
    evidence:
      - sidecar: odd-platform__java__CollectorController__controller-method__regenerateCollectorToken.md
        section: "bugs_limitations_corner_cases[0] + concepts.invariants[1] + security.known_security_gaps[5]"
        cite: "ReactiveTokenRepositoryImpl.java:30-39 (UPDATE not INSERT) + IngestionDataEntitiesFilter.java:55-58 (single-value equality)"
        note: "In-place UPDATE; old token 401s the moment the rotation commits."
      - sidecar: odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken.md
        section: "stress_findings.name_behavior_pairs[regenerate revoke-then-issue?] + bugs[1]"
        cite: "ReactiveTokenRepositoryImpl.java:33-38 (single DSL.update) + DataSourceServiceImpl.java:99-106"
        note: "Sidecar's own Category-F check confirms: no instant of two-valid, no instant of zero-valid — binary cutover."
    operator_visible_failure: |
      An operator rotating a collector's token during active ingestion locks out ingestion until the collector picks up the
      new token — which is typically a config-file edit + process restart on the operator's OWN infrastructure, possibly
      minutes-to-hours of coordination away. There is no "old+new both valid for 24h" pattern, so an unplanned mid-load
      rotation is an ingestion incident. This is operationally fragile but is a documented behaviour (DOC-252/DOC-255 done)
      — it routes to caveat at the doc/UX level rather than a code bug, EXCEPT that the proper fix (a graceful 24h dual-token
      window with a `superseded_at` column) is a real feature the maintainer flagged in notes_for_maintainer; recorded as a
      caveat-candidate with the grace-window enhancement noted.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional

