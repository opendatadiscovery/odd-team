- id: H-011
  hypothesis: |
    "The facet drill-down list is bounded — asking for a facet's options returns a sane,
    paginated number of rows; I can't accidentally (or maliciously) request a million."
  derivation: |
    Endpoint shape: getFiltersForFacet takes page + size params; a well-behaved list endpoint
    is expected to clamp page size.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      Pagination is unbounded at every layer. Controller params Integer page, Integer size
      (SearchController.java:33-34) carry no validation annotations; the OpenAPI PageParam /
      SizeParam (components.yaml:4213-4229) have no minimum: or maximum:; the repository
      computes OFFSET = (page - 1) * size at multiple sites with no clamping. size=1_000_000
      triggers a single facet aggregator query bounded only by Postgres / network buffers and
      table cardinality; page=0 produces a negative OFFSET (implementation-defined).
    evidence:
      - sidecar: odd-platform__java__SearchController__controller-method__facets.md
        section: bugs_limitations_corner_cases[3]
        cite: "SearchController.java:33-34 + components.yaml:4213-4229 + ReactiveSearchFacetRepositoryImpl.java:129, 157, 315, 369, 404, 449, 515"
        note: "Unbounded pagination at controller + OpenAPI + repository; no @Min/@Max."
    operator_visible_failure: |
      A careless or malicious size=1_000_000 produces an arbitrarily large response and an
      unbounded jOOQ query on the largest catalog tables (the OWNERS facet is a 4-way join) —
      a resource-exhaustion / DoS lever requiring no special privilege beyond an authenticated
      session (anonymous under DISABLED). page=0's negative OFFSET is an undefined-behaviour
      surface. Same pattern as the alert and activity endpoint families — a platform-wide
      missing-clamp class rather than a one-off.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

