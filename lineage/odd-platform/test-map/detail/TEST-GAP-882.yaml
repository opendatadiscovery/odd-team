behaviour: |-
  **HIGH — CROSS-CUTTING META: the ENTIRE Activity Feed feature (P-07:F-003) has ZERO direct test coverage across FIVE tiers — handler interface, service orchestration, controller HTTP surface, repository SQL, AND housekeeping partition lifecycle. NO test file exists for `ActivityHandler` or any of its 18 concrete impls. NO `ActivityServiceImplTest.java`. NO `ActivityControllerTest.java`. NO test references `ReactiveActivityRepositoryImpl` or `ReactiveActivityRepository`. NO test references `ActivityEmptyPartitionsHousekeepingJob` or its abstract parent. Glob `src/test/**/Activity*.java` returns ONLY `ActivityMapperTest.java` (the mapper-tier unit test). The Activity Feed is a primary user-facing accountability surface (per F-021 + the activity-feed.md docs page) — and EVERY layer of its implementation is unverified by automated test.** This is the cross-cutting anchor for the test-pillar effort on the Activity Feed feature.

  **The five-tier absence**:
  - **Handler tier**: 18 concrete handlers (BusinessNameUpdatedActivityHandler, OwnershipCreatedActivityHandler, DescriptionUpdatedActivityHandler, ...) — all uncovered. The interface's contract (linear dispatch, first-match-wins, snapshot-differ pattern, multi-id default-throw, system-event null-username fallback) is unverified.
  - **Service tier**: `ActivityServiceImpl` (273 lines, 9 public + 5 private methods) — all uncovered. The view-mode dispatch (`getActivityList`), asymmetric date validation, owner-scoping (MY_OBJECTS-only), Mono.zip count aggregation, TX coupling — all unverified.
  - **Controller tier**: `ActivityController` (2 methods: getActivity + getActivityCounts) — uncovered. The validation-error response-shape across the WebFlux body-subscription seam, the size REQUIRED-vs-NULLABLE drift, the cursor pagination contract, the cross-owner read default — all unverified.
  - **Repository tier**: `ReactiveActivityRepositoryImpl` (310 lines, 8 public methods) — uncovered. The data-entity-FK invariant, cross-mode bleed (USER_OWNER_MAPPING join by username only), cursor sub-second behaviour, batch INSERT partial-commit, append-only semantics — all unverified.
  - **Housekeeping tier**: `ActivityEmptyPartitionsHousekeepingJob` + `EmptyPartitionsHousekeepingJob` parent + `PartitionServiceImpl.isPartitionEmpty / dropPartition / getEmptyPastPartitions` — all uncovered. The empty-only contract, the race window, the lock collision, the sequential-scan cost — all unverified.

  **The 14 individual uncovered behaviours pinned by VAL-LSN-019-B batch** (TEST-GAPs 868-881):
  - **TEST-GAP-868 (CRITICAL)**: ActivityHandler oldState capture race — concurrent @ActivityLog wrong attribution
  - **TEST-GAP-869 (CRITICAL)**: Activity emit failure rolls back originating mutation (TX coupling)
  - **TEST-GAP-870 (HIGH)**: EmptyPartitions check-then-drop race window — silent data loss
  - **TEST-GAP-871 (HIGH)**: Activity feed cross-owner visibility (per-entity tab)
  - **TEST-GAP-872 (HIGH)**: Activity ingestion-path created_by_user_id NULL ambiguity
  - **TEST-GAP-873 (MEDIUM)**: Spurious activity events from unstable list ordering in diff
  - **TEST-GAP-874 (MEDIUM)**: Activity cursor order-stability at sub-second boundaries
  - **TEST-GAP-875 (MEDIUM)**: Activity read during partition DROP (lock collision)
  - **TEST-GAP-876 (MEDIUM)**: getActivityCounts unbounded scan with null dates
  - **TEST-GAP-877 (LOW)**: EmptyPartitions count(*) seq-scan performance
  - **TEST-GAP-878 (MEDIUM)**: Mono.just(Flux.error()) error seam silent-empty
  - **TEST-GAP-879 (MEDIUM)**: Activity size param REQUIRED-in-spec vs NULLABLE-in-Java
  - **TEST-GAP-880 (MEDIUM)**: Activity read-during-partition-DDL disconnect cancellation
  - **TEST-GAP-881 (LOW)**: ActivityHandler default multi-id getUpdatedState throws for 16/18 impls

  **Why HIGH not CRITICAL**:
  - Sister META findings (TEST-GAP-814 F-009 notification, TEST-GAP-835 F-008 ingestion, TEST-GAP-854 UI components, TEST-GAP-865 TagServiceImpl) are HIGH for similar cross-cutting absences.
  - CRITICAL is reserved for security-flagged uncovered behaviours where the concept's security_aggregate.overall is HIGH; the individual gaps above (868, 869, 871) carry the CRITICAL/HIGH severity per their specific surface.
  - We rate this META anchor HIGH because: (a) the test-floor establishment is the largest single authoring effort for the activity-feed feature; (b) the individual gaps fully decompose the work but the META scope captures the cross-cutting ABSENCE; (c) sister META gaps in other features carry HIGH.

  **Connection to existing TEST-GAPs**:
  - TEST-GAP-078..085 (existing — batch 1 from getActivity controller-method sidecar): cover specific behaviours but did NOT pin the meta absence
  - TEST-GAP-082..083, 298 (existing — cross-owner visibility on the global feed): STRENGTHENED by TEST-GAP-871
  - TEST-GAP-079 (existing — getActivity null-date validation): STRENGTHENED by TEST-GAP-876 + TEST-GAP-878
  - TEST-GAP-084 (existing — cursor-pagination correctness): STRENGTHENED by TEST-GAP-874
  - This META anchor (882) is the SINGLE entry the maintainer triages the activity-feed test-floor effort against

  **Authoring effort estimate**: ~6-10 sprint-weeks to author the full Activity-Feed test suite across all five tiers. The individual gaps (868-881) cover the headline surfaces; the remaining surface (per-handler behaviour for the 18 concrete impls, view-mode dispatch happy paths, batch-INSERT correctness, etc.) needs comprehensive tests at each tier.
