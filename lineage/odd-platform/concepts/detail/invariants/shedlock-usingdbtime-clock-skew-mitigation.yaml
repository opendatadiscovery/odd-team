notes: |-
  NEW invariant batch ZK (2026-05-26). The first PRIMARY-SOURCE pin to
  the POSITIVE implicit ADR at SchedulingConfiguration.java:22. Unlike
  most invariants in the catalog (which capture bugs / limitations /
  drift), this one captures a CORRECT decision that the catalog should
  defend against regression.

  Pairs with the new
  `scheduling-configuration-single-thread-taskscheduler-default`
  invariant — that one is the NEGATIVE silent operational risk (no
  thread-pool sizing); THIS one is the POSITIVE implicit ADR
  (clock-skew mitigation). Both surface from the same SchedulingConfiguration
  sidecar in batch ZK.

  One DOC-NNN candidate:
    Document the clock-skew-tolerance posture under
    /configuration-and-deployment/odd-platform — naming `.usingDbTime()`
    as the mechanism + the implicit ADR + operator-visible consequence
    ('you do not need replica clock synchronisation; PG arbitrates').

  Cross-cutting connection: pairs with the
  `housekeeping-job-no-scheduler-lock-multi-instance-amplification`
  invariant — both invariants describe the multi-replica behaviour of
  the platform's scheduled-task subsystem, but from different angles
  (THIS one: clock-skew tolerance for @SchedulerLock-protected jobs;
  THAT one: lack of coordination for the unlocked session-housekeeping
  job).
