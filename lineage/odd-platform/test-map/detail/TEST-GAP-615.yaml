behaviour: |-
  **GitHub OAuth2 login = 3 sequential outbound HTTPS calls to api.github.com per login** — (1) Spring's `DefaultReactiveOAuth2UserService.loadUser` `/user` call (OAuthSecurityConfiguration.java:130-131); (2) this handler's `/user/orgs` (line 78); (3) this handler's `/user/teams` (line 106, only if `adminGroups` non-empty). Total login latency = sum of three RTT to api.github.com + JSON parse. Typical: 300-600ms; tail latencies > 2s observed in GitHub-API incidents. No caching of org/team membership — every login re-fetches both lists. For a user logging in 10 times per day, 20 GitHub API tokens are consumed per user per day. Bounded but multiplicative; consistent with the broader no-cache stance (AuthIdentityProviderImpl batch K implicit_adrs[3]). The 3-call architecture is structural — GitHub's `/user` endpoint does NOT return org/team membership, so the handler MUST make the subsequent calls. Pin the cost model.
