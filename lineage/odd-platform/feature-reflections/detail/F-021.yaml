- hypothesis_id: H-011
  severity: HIGH
  one_line: "Hard-deleting a data entity erases its audit history from reads — the activity rows survive in the table but the INNER JOIN to DATA_ENTITY drops them from every read path."
  dedup_status: net_new
  recommended_log_as: upstream-issue (opendatadiscovery/odd-platform)
