proposed_canonical: Dead code in load-bearing positions (cross-cutting hygiene)
rationale: 'Cross-cutting hygiene invariant: AuthorizationManagerCondition (batch
  B, dead Condition class — zero @Conditional consumers) + NotificationsProperties.webhookUrl
  (batch C, dead top-level config field — no consumer reads it). Both shapes expose
  maintainers + operators to subtle ''I thought this would work'' failure modes. Surface
  for hygiene scans / @Deprecated annotations.'
contributing_concepts:
- AuthorizationManagerCondition (designed as @Conditional gate; bypassed by direct
  @ConditionalOnProperty on the *SecurityConfiguration siblings)
- NotificationsProperties.webhookUrl (designed as top-level config; superseded by
  notifications.receivers.webhook.url)
suggested_add_to_docs: false
