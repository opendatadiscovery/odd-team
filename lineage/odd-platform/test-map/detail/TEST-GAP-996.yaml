  - 'management.md says (security.known_security_gaps.[1]): an inner check like hasAccessTo(Permission.DATA_SOURCE_UPDATE) on an Integration form deny-by-defaults regardless of the user global permissions, because OWNER_ASSOCIATION_MANAGE != DATA_SOURCE_UPDATE so the allowedPermissions.includes() check fails (per PermissionProvider.tsx:27-32). severity: MEDIUM'
  - 'Verified at primary source: ManagementRoutes.tsx:150 (no permission wrap) + Management.tsx:9 (outer context = OWNER_ASSOCIATION_MANAGE only) + Integrations.tsx:10-19 (no permission gating in the integrations subtree either)'
