            in-product GUIDANCE gap (what-to-do-next / pre-flight forewarning) is PLT-128, separately open.

- id: H-004
  hypothesis: |-
    When an operator wants to delete a DataSource that is no longer needed, they
    can complete the deletion through the UI (soft-delete its entities, then
    delete the source) and it succeeds.
  derivation: |-
    The Management page frames the Delete control as "remove a source no longer
    ingested" — the implied promise is that an operator CAN remove it.
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |-
      It succeeds ONLY if no collector re-ingests between the two steps. Because
      data_entity rows are collector-created and re-created on the next ingest
      tick, an operator who soft-deletes all entities and then deletes the source
      RACES the collector: a re-ingest re-creates live data_entity rows and the
      next delete 400s again. The delete does NOT take the getIdByOddrnForUpdate
      row lock the ingestion path uses, so it does not serialise against ingestion.
      The only reliable path is to stop the collector first — which neither the
      doc nor the UI mentions (deleteDataSource.md:bugs[2] + stress_findings.resource_boundaries).
    evidence:
      - sidecar: odd-platform__java__DataSourceController__controller-method__deleteDataSource.md
        section: bugs_limitations_corner_cases
        cite: "DataSourceServiceImpl.java:88-95 + ReactiveDataEntityRepositoryImpl.java:158-163"
        note: "actively-ingested source is effectively undeletable; races the collector"
    operator_visible_failure: |-
      An operator following the documented workflow ("remove a source no longer
      ingested") on a source whose collector is still scheduled hits an endless
      cycle: soft-delete entities → delete source → 400 → entities re-appeared.
      They have no documented or in-product instruction to stop the collector,
      and (per H-003) the failure surfaces as a stuck modal. The convenient,
      intuitive path the doc promises is an operational dead-end without the
      undocumented prerequisite.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: |-
    When an operator deletes an Owner / Namespace / DataSource and a concurrent
    request creates a new referent for that same parent at the same moment, the
    platform either blocks the delete or blocks the referent-create — it never
    leaves a live referent pointing at a soft-deleted parent.
  derivation: |-
    The cascade-block exists precisely to prevent orphaned referents; an operator
    expects that guarantee to hold under concurrency, not just single-threaded.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      None of the three delete paths acquires a row-level lock (SELECT FOR UPDATE)
      or a Postgres advisory lock on the parent id, and all run under READ
      COMMITTED. The existence-check SELECT(s) and the soft-delete UPDATE are a
      classic TOCTOU pair: a concurrent INSERT into a referent table (e.g.
      POST /api/dataentities/{id}/ownership for Owner; dataSourceService.create
      with namespace_id for Namespace; collector re-ingest for DataSource) can
      land in the window AFTER the exists-check returns false and BEFORE the
      soft-delete commits. The result is a live referent row that satisfied its
      FK at insert time but now points at a deleted_at-non-NULL parent
      (OwnerServiceImpl.md:bugs[2] / REFACTOR-430; NamespaceController.md:bugs[2];
      deleteDataSource.md:stress_findings.resource_boundaries). The FKs carry NO
      ON DELETE clause and the parent is soft-deleted (UPDATE, not DELETE FROM),
      so the FK is never consulted — nothing at the schema tier closes the gap.
    evidence:
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: bugs_limitations_corner_cases
        cite: "OwnerServiceImpl.java:88-100"
        note: "cascade-read + soft-delete in one @ReactiveTransactional but no FOR UPDATE; READ COMMITTED"
      - sidecar: odd-platform__java__NamespaceController__controller-class__NamespaceController.md
        section: bugs_limitations_corner_cases
        cite: "NamespaceServiceImpl.java:73-90"
        note: "no @ReactiveTransactional, no SELECT FOR UPDATE, no advisory lock"
      - sidecar: odd-platform__java__DataSourceController__controller-method__deleteDataSource.md
        section: stress_findings.resource_boundaries
        cite: "DataSourceServiceImpl.java:87-95"
        note: "does not take getIdByOddrnForUpdate; does not serialise vs ingestion"
    operator_visible_failure: |-
      The protective promise of the entire feature silently fails under
      sustained admin load + concurrent ingestion. An orphan ownership row, an
      orphan datasource-under-a-deleted-namespace, or a live entity under a
      soft-deleted datasource is produced with no error to either caller. The
      orphan is HIDDEN from list endpoints (soft-delete filter) but surfaces via
      by-id reads (OwnerServiceImpl.md:bugs[9] visibility asymmetry; F-019
      cross-link), producing forensic ambiguity for an auditor and dangling
      references for downstream consumers. The window is narrow (bounded by 1-4
      EXISTS queries) but it is real and unguarded, and it widens across
      multiple platform replicas (NamespaceController.md:performance.scaling).
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: bug-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: |-
    When an operator deletes a Namespace, the cascade-check and the soft-delete
    happen atomically — a partial failure (e.g. a network blip mid-operation)
    never leaves the namespace half-deleted while the UI reports success.
  derivation: |-
    Owner and DataSource deletes carry @ReactiveTransactional; an operator would
    reasonably expect the sibling Namespace delete to have the same atomicity.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      NamespaceServiceImpl.delete (line 74, confirmed at HEAD 107c9aa this
      session) has NO @ReactiveTransactional — while NamespaceServiceImpl.update
      at line 63 DOES. The cascade-check zip + soft-delete UPDATE chain is
      therefore non-atomic with ITSELF, even single-threaded: a partial failure
      between the existsByNamespace predicates and the namespaceRepository.delete
      UPDATE leaves the namespace as deleted_at IS NULL (still present) while the
      reactive chain may have already signalled toward completion. This is the
      WORST of the three surfaces — Owner and DataSource at least have a
      transaction boundary (NamespaceController.md:bugs[6]; OwnerServiceImpl.md;
      deleteDataSource.md:requires-runtime).
    evidence:
      - sidecar: odd-platform__java__NamespaceController__controller-class__NamespaceController.md
        section: bugs_limitations_corner_cases
        cite: "NamespaceServiceImpl.java:62-71 (@ReactiveTransactional) vs 73-90 (no annotation)"
        note: "update transactional, delete NOT — asymmetry confirmed at HEAD"
      - sidecar: source_read_for_validation
        section: head-recheck
        cite: "NamespaceServiceImpl.java:63 (@ReactiveTransactional on update) + :74 (delete — none)"
        note: "source_read_for_validation: true — re-confirmed at commit 107c9aa this session"
    operator_visible_failure: |-
      An operator who deletes a namespace and sees a success response may have a
      namespace that is still present in the database (deleted_at IS NULL) if the
      delete UPDATE partially failed — there is no compensating action. The UI
      shows it as gone on the optimistic path but the next list refresh re-surfaces
      it, or worse the operator believes the cleanup succeeded when it did not.
      Combined with H-005, the namespace delete has neither single-thread
      atomicity nor concurrency protection.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: |-
    When an operator deletes an Owner, every kind of row that points at that
    Owner is checked by the cascade-block, so deleting an Owner never leaves a
    dangling reference anywhere in the catalog.
  derivation: |-
    The cascade-block enumerates the Owner's referent tables; an operator expects
    that enumeration to be complete (all owner-bearing tables, not a subset).
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      The Owner cascade-block is 3-leg — termOwnership + ownership +
      userOwnerMapping (OwnerServiceImpl.java:90-91) — but it OMITS a 4th
      owner-bearing table: owner_association_request. Its FK to owner(id)
      (V0_0_51:11) has NO ON DELETE clause, and because Owner uses soft-delete the
      FK is never consulted. A PENDING or APPROVED association request for the
      just-deleted Owner persists as an orphan and can even be approved onto a
      dead Owner (OwnerServiceImpl.md:bugs[3]; tracked PLT-132).
    evidence:
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: bugs_limitations_corner_cases
        cite: "OwnerServiceImpl.java:90-91 + V0_0_51__add_owner_association_request.sql:11"
        note: "3-leg cascade omits owner_association_request; FK no ON DELETE"
    operator_visible_failure: |-
      After an operator deletes an Owner, the Associations tab can still surface a
      pending/approved request pointing at the now-deleted owner; an admin can
      approve that request onto a dead Owner, producing a user-owner mapping to a
      soft-deleted owner. The forensic History becomes ambiguous. This is the
      asymmetric, surface-specific instance of the same incompleteness the whole
      F-076 class warns about.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: |-
    When an operator deletes an Owner / Namespace / DataSource, the action is
    recorded in the Activity Feed so an auditor can later see who deleted what
    and when.
  derivation: |-
    P-08 is the operator-mutating surface and P-07's Activity Feed is the audit
    surface; an auditor expects directory deletions to be auditable.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |-
      None of the three delete paths emits an activity event. OwnerServiceImpl
      carries NO @ActivityLog on any of create/update/delete (verified by Grep
      across service/*.java: 10 services carry it, none is OwnerServiceImpl —
      OwnerServiceImpl.md:invariants). DataSourceServiceImpl emits no ActivityEvent
      (deleteDataSource.md:bugs). The only trace of a delete is the deleted_at
      timestamp, which carries no actor. This is the audit-log-presence-asymmetry
      pattern (entity-metadata mutations ARE logged; directory + RBAC mutations
      are not).
    evidence:
      - sidecar: odd-platform__java__service__service__OwnerServiceImpl.md
        section: security.known_security_gaps
        cite: "OwnerServiceImpl.java:38-122 (no @ActivityLog) + Grep service/*.java"
        note: "Owner directory mutation surface forensically silent"
      - sidecar: odd-platform__java__DataSourceController__controller-method__deleteDataSource.md
        section: bugs_limitations_corner_cases
        cite: "DataSourceServiceImpl.java:85-96 (no activityEventEmitter)"
        note: "no audit trail of who deleted a data source"
    operator_visible_failure: |-
      An auditor asking "who deleted this datasource / owner / namespace and
      when" has no answer — there is no actor, no event, nothing in the Activity
      Feed. Combined with the destructive role-rebind on Owner and the orphan
      consequences above, a directory mutation (including a destructive one) is
      invisible to the audit surface the platform advertises. NOTE: this is a
      known cross-feature pattern (F-019/F-006 audit-silence); surfaced here as
