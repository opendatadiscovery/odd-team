      gated. (3) The path /api/v3/swagger-ui.html (which serves JSON) is itself a naming footgun:
      a user who guesses the UI is at the ".html" path gets JSON. (4) Documentation that says
      "the OpenAPI spec is at /api/v3/api-docs" is factually wrong about what that URL returns.
    severity: HIGH
    confidence: HIGH
    source_read_for_validation: true
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

