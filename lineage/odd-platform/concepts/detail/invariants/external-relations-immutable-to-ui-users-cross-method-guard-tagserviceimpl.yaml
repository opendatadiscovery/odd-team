mitigations_unimplemented:
  - |-
    Add the missing tests pinning the three-method guard pattern.
    The tests are sketched in TagServiceImpl.md:tests_coverage_semantic.uncovered_behaviours;
    converting them to Testcontainers-backed @SpringBootTest pins
    the maintainer's intent permanently. A future refactor that
    removes the guard would FAIL the tests rather than silently
    bypassing the protection.
  - |-
    Extend `TagDto.external()` aggregation to fold in
    `boolOr(tag_to_dataset_field.origin <> 'INTERNAL')`. The fix
    closes the silent gap between data-entity-side and
    dataset-field-side EXTERNAL semantics. Cost: an additional
    LEFT JOIN in ReactiveTagRepositoryImpl.getDto (and
    listDataEntityDtos / listDatasetFieldDtos if those should
    expose the same aggregate).
  - |-
    Document the !external guard on the live
    /features/data-discovery/tagging doc page — explicit text:
    "Tags applied by Collectors during ingestion are protected from
    UI-driven modification. Operators with TAG_UPDATE / TAG_DELETE
    can mutate vocabulary entries that are PURELY operator-set;
    Collector-managed tags require de-registering the Collector to
    modify." Adds a second-axis check the operator can reason about.
  - |-
    Document the dataset-field-EXTERNAL gap until the aggregate fix
    lands. Operators using `tag_to_dataset_field` with
    `origin=EXTERNAL_STATISTICS` need to know the UI can mutate those
    even though "they're external".
  - |-
    Consider promoting the !external mechanism to an explicit
    architectural concept rather than three independent ad-hoc
    guards. A `TagOwnershipBoundary` class (or
    `@CollectorOwnedTagsCheck` aspect) would centralise the rule
    + the dataset-field-aware aggregate; the three methods would
    invoke a single helper. Reduces the surface for future
    refactor-bypass.

notes: |-
  CAPTURED batch VAL-LSN-019 (2026-05-20). The three-method guard
  pattern is the maintainer's intentional defence against UI-driven
  Collector-set tag mutation. The pattern is INTENTIONAL (named in
  three independent exception messages + consistent code shape) but
  fragile (no test corpus pins it; a refactor could remove it
  silently).

  Cross-cutting connections:
    - Pairs with the entity `Tag` (the carrier of the external bit)
    - Pairs with `tag-with-internal-vs-external-distinction` (the
      vocabulary-level naming of the INTERNAL/EXTERNAL split)
    - Pairs with the LSN-019 drift class — the LSN-019 surfacing
      methodology is what surfaced THIS pattern as a coherent
      cross-method finding (the Stress Protocol's D-category +
      E-category questions on each method made the consistency
      visible)
    - Pairs with `audit-log-presence-asymmetry-2-tier-audit-story`
      — the !external guard's BadUserRequestException emits NO
      Activity event; operators who repeatedly attempt to mutate
      Collector-set tags via the UI leave no audit trail
    - Pairs with `s2s-composes-not-mutex-privilege-escalation-across-auth-modes`
      — the !external guard is the second-axis check the platform
      uses to compose UI authorities with S2S authorities; this
      pattern is the architectural ledger entry

  Two DOC-NNN candidates:
    (a) /features/data-discovery/tagging — admonition on the
        Collector-owned EXTERNAL tag protection
    (b) /developer-guides/api-reference/tagging NEW page — explicit
        documentation of the 4xx surface when an operator attempts
        to update/delete an EXTERNAL tag via the UI
