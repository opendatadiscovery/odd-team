# IT-145 — the REAL odd-collector config for the ingestion-grade DATASET-pipeline stand.
# One postgresql plugin against the source warehouse. Token arrives via the env (!ENV):
# the spec registers the collector through POST /api/collectors (the real one-shot-token
# flow) and starts this container with $COLLECTOR_TOKEN set (helpers/ingestion-dataset-stack.ts).
#
# default_pulling_interval is 1 (minute) AND the collector pulls once at startup, so the
# delta/deletion phases re-collect by RESTARTING this container after mutating the source
# (a restart forces an immediate fresh pull — faster + more deterministic than waiting a tick).
#
# Port note (IT-128 case-law): the postgresql plugin overrides `port: int = 5432`
# (odd-collector domain/plugin.py), so a bare int is correct here (unlike neo4j's quoted str).
default_pulling_interval: 1
token: !ENV ${COLLECTOR_TOKEN}
plugins:
  - type: postgresql
    name: it145_postgres_warehouse
    host: probe-ingestds-source-postgres
    port: 5432
    database: warehouse
    user: warehouse
    password: warehouse-password
