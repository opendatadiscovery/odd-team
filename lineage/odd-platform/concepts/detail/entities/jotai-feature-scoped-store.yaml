security_aggregate:
  overall: HIGH
  auth_modes_relevant: []
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: N/A
    detail: |-
      A client-state convention has no authorization surface. The convention does
      MARGINALLY improve isolation between features (state cannot leak between
      pages via a shared global store) — a defence-in-depth benefit, not an
      authorization gate.
  owner_scoping:
    verdict: N/A
    detail: |-
      Client state, no scoping concept.
  strengths:
    - |-
      Per-feature scoping reduces cross-feature state leakage — if two features
      named the same atom key (which jotai's global default would conflate),
      the nested Provider isolates them.
    - |-
      Per-mount reset makes feature state non-persistent across navigation —
      sensitive in-progress selections (e.g. filter chips on the DQ dashboard)
      do not survive a navigate-away as a stale leak.
  weaknesses: []
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityStore.md
  evidence:
    - DataQualityStore.md:implicit_adrs.[0-1]
performance_aggregate:
  overall: HIGH
  hot_paths: []
  throughput_shape:
    verdict: N/A
    detail: |-
      Client state; not a throughput concept.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Per-tab, per-mount; no shared state across tabs or sessions.
  strengths:
    - |-
      Atomic state primitives — small re-render surfaces vs redux's slice-wide
      re-renders. Each atom subscription is per-component, jotai automatically
      tracks which atoms a component reads.
    - |-
      Derived atoms are O(input-size) pure functions cached by jotai; recompute
      only when source atoms change.
  weaknesses:
    - |-
      Easy to subscribe to a whole composite atom (e.g. `useAtom(formFiltersAtom)`)
      when only one field is needed — re-renders propagate beyond necessity. The
      DataQuality feature ships an unused per-key `getFieldFilterAtom` factory
      (DataQualityStore.ts:24-30); the focused-atom fix exists but is unused.
      Severity LOW (bounded by feature size).
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityStore.md
  evidence:
    - DataQualityStore.md:performance.hot_paths (re-render fan-out + fetch trigger chain)
