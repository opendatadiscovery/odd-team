name: 'ShedLock .usingDbTime() — PG-arbitrated lock time neutralises JVM clock-skew across replicas'
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  **NEW INVARIANT, batch ZK (2026-05-26) — POSITIVE implicit ADR pin at
  SchedulingConfiguration.java:22.**

  `SchedulingConfiguration.lockProvider(DataSource)` (`SchedulingConfiguration.java:17-25`)
  constructs the platform's `LockProvider` Bean as a
  `JdbcTemplateLockProvider` over the auto-wired primary `DataSource`,
  with an EXPLICIT call to `.usingDbTime()` on the configuration
  builder. This single method call is the LOAD-BEARING positive choice
  for multi-replica deployments.

  **WHY IT MATTERS**: the JdbcTemplateLockProvider has TWO time sources
  available:

    (a) Default (without `.usingDbTime()`) — JVM-side `Instant.now()`
        on the platform replica acquiring/releasing the lock. Two
        replicas with skewed clocks would write DIFFERENT `lock_until`
        values to the `shedlock` PG table for the same lock, and the
        lock-validity decisions would be vulnerable to clock drift. A
        replica with a fast clock could prematurely consider an
        expired-lock-row as still-held by another replica, OR consider
        a still-held lock as expired and incorrectly grab it
        (split-brain on lock arbitration).

    (b) With `.usingDbTime()` (the ODD platform's choice at line 22) —
        PostgreSQL's `current_timestamp` (server-side `now()`) is the
        authoritative time. Both `lock_until` (written on lock
        acquisition) and the lock-expiry check (read on subsequent
        acquisition attempts) use the SAME PG clock. Clock-skew between
        JVM replicas is NEUTRALISED. The trade-off: one extra DB
        round-trip per lock operation (a `SELECT now()` per
        UPSERT/UPDATE), at the platform's sub-1-QPS shedlock-write
        rate — negligible cost.

  **WHY THIS IS AN IMPLICIT ADR**: the JdbcTemplateLockProvider's
  default WITHOUT this call is JVM-side timestamps. The deliberate
  invocation of `.usingDbTime()` at line 22 IS the architectural
  decision — it cannot have happened by accident (the method must be
  called explicitly on the Configuration builder). The choice encodes
  the intent: 'arbitrate via PostgreSQL's `current_timestamp`, not
  the JVM's clock'.

  **DOC GAP**: this is NOT documented anywhere in the live ODD docs.
  WebFetch `/configuration-and-deployment/odd-platform` 2026-05-26
  (HTTP 200) mentions ShedLock for housekeeping coordination but does
  NOT state how clock-skew between replicas is handled. An operator
  considering 'do I need to install chrony on my K8s nodes to keep
  replicas in sync?' has no way to learn from the docs that the
  platform tolerates clock skew because PG arbitrates the lock time.

  **REGRESSION RISK** — a future refactor could silently remove this
  protection:

    (a) Switching to a different LockProvider (e.g. Redis-based
        `RedisLockProvider` for a multi-database deployment) would
        lose `.usingDbTime()` without anyone noticing. The shedlock
        semantics would shift from DB-authoritative-time to
        Redis-server-time; multi-replica clock-skew assumptions would
        change.

    (b) A maintainer simplifying the builder chain ("Configuration
        builder feels unnecessary — let's just call `.builder().build()`
        with defaults") would drop `.usingDbTime()` accidentally.

    (c) ShedLock library upgrades that change the meaning of
        `.usingDbTime()` (unlikely but not impossible).

  No integration test pins the `.usingDbTime()` contract. P-182 probe
  NEW (batch ZK) — multi-instance lock-race verification under
  `.usingDbTime()`: two JVMs boot simultaneously, both
  `@SchedulerLock("housekeepingJob")` methods fire at the same wall-clock
  moment; with `.usingDbTime()` enabled, only one wins lock acquisition;
  verify the second receives `Optional.empty()` from the LockProvider
  AND verify the first's `shedlock` row's `lock_until` is approximately
  PG's `now() + 14m`, NOT JVM's `Instant.now() + 14m`.

  **FIX SHAPE**: NOT a bug — this invariant captures a POSITIVE platform
  decision. Mitigation path is to LOCK the contract:
    (a) Add a regression integration test asserting the
        JdbcTemplateLockProvider bean uses `.usingDbTime()` (Spring-context
        introspection or a Testcontainers test querying the actual
        `lock_until` value against PG's `now()`).
    (b) Add a Javadoc comment at line 22 explaining the choice ('do
        NOT remove `.usingDbTime()` — neutralises JVM clock-skew
        across replicas; see implicit_adrs').
    (c) Document the clock-skew-tolerance posture on the live docs page
        — operators choosing 'do I need chrony?' deserve to learn that
        the platform tolerates clock skew because PG arbitrates lock
        time.

  Severity: NOT-A-BUG / INVARIANT-LOCK — the platform's current behaviour
  is correct; the invariant captures the choice that makes it correct
  so a future regression can be detected.
