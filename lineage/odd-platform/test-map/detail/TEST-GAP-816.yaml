proposed_action: |-
  Add `GetDataEntitiesByDEGOddrnSequentialIdEnumerationDoSAuditSilentTest`. Testcontainers-Postgres test:

  1. **Seed**: create 100 DEGs (ids 1-100) owned by 3 different owners (A, B, C); add 5-10 members to each DEG.
  2. **Burst**: as anonymous (no auth) caller, fire 100 GET /ingestion/entities/{construct_DEG_oddrn(id)} requests in <1s.
  3. **Assert**:
     - All 100 return 200 (no rate-limiting kicked in).
     - All cross-owner DEGs returned full member lists (no owner-filter applied).
     - `activity_event` table has ZERO new rows attributable to these reads.
     - Application log has ZERO `log.info/warn/error` lines from `IngestionController` or `DataEntityGroupServiceImpl`.
     - Prometheus metrics show NO `http_requests_total{path="/ingestion/entities/*"}` counter increment beyond the request-level instrumentation (no domain-specific counter).
  4. **Pair with the REFACTOR-NNN candidates**: (a) rate-limit at controller; (b) audit-log on suspicious read patterns; (c) owner-scoping at service tier.

  Coherence note (LSN-018 Rule 6): NET-NEW. Sister to TEST-GAP-815 (which pins unauthenticated reach across auth modes); this entry pins the cross-owner + sequential-id + audit-silent COMPOSITION. Together they specify the full DEG-member-enumeration blast radius. STRENGTHENS REFACTOR-024 by adding a 6th surface; the existing REFACTOR-024 detail YAML should gain `surface_6: getDataEntitiesByDEGOddrn (S2S read)` per LSN-018 backlink protocol.
