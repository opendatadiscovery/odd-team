behaviour: |-
  **CRITICAL — Concurrent `@ActivityLog`-annotated mutations on the SAME data entity produce wrong-attribution audit rows.** Two users A and B concurrently submitting `OwnershipServiceImpl.update` (or any other `@ActivityLog` write) on the SAME `data_entity_id` both call `getContextInfo(parameters)` BEFORE `joinPoint.proceed()` — both capture `oldState = pre-mutation` at the SAME baseline. Tx A's mutation commits at T1; Tx B's at T2. After joinPoint.proceed completes, each transaction's `getUpdatedState` runs and reads POST-mutation state — but under READ_COMMITTED isolation B's `getUpdatedState` reads post-A+post-B state (since A committed first). Both ActivityPojo rows record `pre-mutation → post-A+post-B`, with two rows attributed to A and B. **The Activity Feed shows two activity rows each claiming credit for the other user's change.** No test pins what the row diff content SHOULD be under interleaved commits, so any future refactor of the race window (e.g. moving capture to a `SELECT FOR UPDATE` boundary, switching to serializable isolation, batching multi-mutation events) lands without a regression catcher.

  **Primary-source chain**:
  - `ActivityAspect.java:41-59` (monoActivityAspect — the @ReactiveTransactional around-advice):
    - Line 48: `activityService.getContextInfo(activityParameters, eventType)` — **pre-mutation snapshot capture**
    - Line 49: `joinPoint.proceed()` — the business mutation runs
    - Line 85: `activityService.getUpdatedInfo(activityParameters, info.getDataEntityId(), eventType)` — **post-mutation snapshot capture**
  - `ActivityServiceImpl.java:46-50` (createActivityEvent):
    - Line 47: `authIdentityProvider.getCurrentUser()` — actor identity capture
    - Line 50: `activityRepository.saveReturning(pojo)` — INSERT (no ON CONFLICT, no dedup)
  - `ActivityHandler.java:9-22` (interface): all 4 methods are READ-only state observers; diff and persist live OUTSIDE the handler.
  - Per `ReactiveActivityRepositoryImpl.md:stress_findings.E3`: no unique index on `(data_entity_id, event_type, created_by, created_at)`; two parallel INSERTs commit two rows.

  **The race window structure** (per ActivityHandler.md:stress_findings.S-E-2):
  1. Tx A: `getContextInfo` reads pre-state at T=0
  2. Tx B: `getContextInfo` reads pre-state at T=0 (same baseline)
  3. Tx A: `joinPoint.proceed()` runs A's mutation; commits at T=1
  4. Tx B: `joinPoint.proceed()` runs B's mutation; commits at T=2
  5. Tx A: `getUpdatedState` reads post-A state at T=1
  6. Tx B: `getUpdatedState` reads post-A+post-B state at T=2 (READ_COMMITTED)
  7. Both Activity rows record: `oldState=pre, newState=post-A+post-B`, attributed to A and B respectively

  **Operator-visible consequences**:
  - **Forensic distortion**: a user investigating "who changed the description from X to Y" sees BOTH user A and user B's activity rows showing the FULL combined change — neither user actually made the full change alone
  - **Wrong-attribution audit trail**: an operator looking at the activity feed for accountability cannot determine which user actually performed which sub-change
  - **The Activity Feed is a user-facing accountability surface**: a wrong-diff bug under concurrent load is a **trust-destroyer** for the entire audit-trail story

  **Why CRITICAL not HIGH**:
  - The Activity Feed concept (concepts.yaml) carries security_aggregate weaknesses including audit-integrity claims; the wrong-attribution bug undermines the audit-or-fail semantic captured at `implicit_adrs.[0]` (ActivityHandler.md).
  - Under sustained mutation load (operator UI flurry, bulk-tag assignment, concurrent ownership updates), this race is empirically observable.
  - The race is INVISIBLE to single-threaded testing — a future refactor that moves capture timing OR switches isolation level COMPILES, passes every existing test, and silently changes the audit-trail's truthfulness for the entire dataset of historical activity rows.

  **Connection to probe P-019**:
  - The sidecar emits P-019 as the runtime measurement; this TEST-GAP is the regression-pin AFTER the probe surfaces the empirical timing.
