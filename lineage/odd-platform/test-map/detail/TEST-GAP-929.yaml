proposed_action: |-
  In IdentityControllerAuthMatrixTest, add a four-fold defence-in-depth block:
  (a) authenticated LOGIN_FORM user via formLogin → 200 with non-literal-admin
  username; (b) authenticated OAUTH2 mock-token → 200 with provider-sub-as-username;
  (c) authenticated LDAP basic-auth → 200 with LDAP uid; (d) anonymous call under
  each of LOGIN_FORM/OAUTH2/LDAP → 302/401, never 200. The assertion shape:
  `assertThat(response.identity.username).isNotEqualTo("admin")` plus a positive
  match against the expected principal. A SecurityContext-loss regression
  flips (a)/(b)/(c) to the literal admin string and the test fails.
