behaviour: |-
  **CRITICAL — `PUT /api/datasetfields/{dataset_field_id}/tags` (updateDatasetFieldTags) inserts `tag_to_dataset_field` relation rows from a `TagToDatasetFieldPojo` that has `tagId` and `datasetFieldId` set but `origin` LEFT UNSET — the endpoint relies entirely on the DB column default `origin varchar NOT NULL DEFAULT 'INTERNAL'`. Whether jOOQ's `newRecord(table, pojo)` OMITS the unset column (default applies — correct) or EMITS an explicit `NULL` (violates `NOT NULL` — the INSERT fails) is NOT statically determinable. If the latter, the endpoint is BROKEN for any non-empty `tags` payload. The data-entity sibling path side-steps this entirely by explicitly calling `.setExternal(false)` on its relation pojo (`TagServiceImpl.java:109`); the dataset-field path does NOT set its discriminator. No test covers this load-bearing path.** Method-level primary source from the batch-X-TAGGING `updateDatasetFieldTags` controller-method sidecar:

  - `DatasetFieldServiceImpl.getUpdatedRelations` (`:264-271`): builds `TagToDatasetFieldPojo` instances with `tagId` + `datasetFieldId` set, NEVER calling `.setOrigin(...)`.
  - `ReactiveTagRepositoryImpl.createDatasetFieldRelations` (`:350-371`): maps each pojo via `jooqReactiveOperations.newRecord(TAG_TO_DATASET_FIELD, p)` then INSERTs, ending with `.onDuplicateKeyIgnore()` (`:367`).
  - `V0_0_82__add_tag_to_dataset_field.sql:12`: `origin varchar NOT NULL DEFAULT 'INTERNAL'` — the relied-upon default. The PK is `(tag_id, dataset_field_id)` (`:14`).
  - Contrast: `TagServiceImpl.updateRelationsWithDataEntity` explicitly calls `.setExternal(false)` on every `TagToDataEntityPojo` (`TagServiceImpl.java:109`) — the data-entity path sets its discriminator IN CODE; the dataset-field path relies on the DB default.

  **Two failure modes if jOOQ emits an explicit NULL:**
  - **Endpoint dead for non-empty payloads** — the INSERT violates `origin NOT NULL`; every `PUT` with a non-empty `tags` list returns a 500. (The empty-list `tags: []` path does only a DELETE, so it would still appear to work — masking the breakage in any smoke test that only exercises clear-all.)
  - **Worse — silent orphan accumulation if `origin` lands as something OTHER than 'INTERNAL'**: the next call's `deleteDatasetFieldInternalRelations` filters `WHERE origin = 'INTERNAL'` (`ReactiveTagRepositoryImpl.java:292`) — a row persisted with a non-INTERNAL origin is never deleted by a subsequent replace-all, and the field accumulates orphan relations the cleanup cannot reach.

  **Why this is fragile-by-construction and CRITICAL**: the correctness of the endpoint's PRIMARY write path depends on an UNTESTED, statically-uncertain jOOQ behaviour (null-field-handling × `onDuplicateKeyIgnore` interaction). A jOOQ version bump changing null-field handling, OR a maintainer adding `.setOrigin(null)`, would either break the endpoint outright or corrupt the replace-all semantic. The repository tests (`TagRepositoryImplTest`) cover the data-entity relation path (which DOES set its discriminator explicitly) — NOT the dataset-field path.

  **Test gap shape**: a Testcontainers-backed `@SpringBootTest` test promoting probe P-030: `PUT /api/datasetfields/{id}/tags` with a non-empty `tags` list, assert (a) the call returns 200 (NOT 500); (b) a raw DB `SELECT origin FROM tag_to_dataset_field WHERE dataset_field_id = ?` returns `'INTERNAL'` for every inserted row; (c) a subsequent replace-all `PUT` correctly deletes those rows (proving the persisted `origin` IS `'INTERNAL'` so the delete filter reaches them). The current state is PINNED — failures land if a jOOQ change or a `.setOrigin` edit alters the persisted value.
