proposed_action: |-
  Add `IngestMetricsODDRNByPayloadCardinalityDoSPostgresPrometheusTest`. Two variants:

  **Variant A (INTERNAL_POSTGRES)**:
  1. Setup: empty platform, Testcontainers Postgres.
  2. Pre-baseline: `SELECT count(*) FROM metric_entity` = N (typically 0).
  3. Burst-POST 10 separate requests, each containing 1000 `MetricSet` items with novel `literal:fake-{i}-{j}` ODDRNs.
  4. Assert: all 10 return 201; `SELECT count(*) FROM metric_entity` = N + 10000.
  5. Assert no rate-limit (no 429 responses); no `activity_event` row; no domain-specific Prometheus counter.

  **Variant B (PROMETHEUS)**:
  1. Setup: ODD configured `metrics.storage=PROMETHEUS`, against a `prom/prometheus:v2.42.0` testcontainer with `--web.enable-remote-write-receiver`.
  2. Burst-POST 10000 novel-ODDRN MetricSets.
  3. Assert: Prometheus has 10000 new series via the testcontainer's `/api/v1/series` endpoint.
  4. Assert no rate-limit / quota enforcement; assert no per-tenant cost-attribution metric.

  Pair with REFACTOR-NNN (existence-check + rate-limit) and the metrics-ingestion concept-merger pass to add `cardinality_dos_vector` weakness.

  Coherence note (LSN-018 Rule 6): NET-NEW. Sister to TEST-GAP-823 (precondition: unauthenticated reach) and TEST-GAP-824 (cross-tenant amplification). STRENGTHENS the `metrics-ingestion` concept entry's existing weakness `No rate-limit / per-tenant quota on metric ingestion` by providing the cardinality-DoS exploit chain anchored at primary source.
