description: |-
  NEW INVARIANT, batch 2026-05-19M (schema-level primary source) — the
  search_facets table at V0_0_1__init.sql:204-211 is defined as:
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(), query_string varchar(255),
  filters jsonb (+ last_accessed_at, created_at). There is NO owner_id, NO
  created_by, NO user_id column — the UUID is the sole identifier. The
  schema-level decision is reinforced at the service layer: SearchServiceImpl.search
  creates a new row WITHOUT capturing the caller principal
  (SearchServiceImpl.java:75-82); updateFacets reads + merges + writes
  WITHOUT checking ownership (SearchServiceImpl.java:84-96); fetchFacetState(searchId)
  does a raw lookup with no owner predicate (SearchServiceImpl.java:157-160);
  ReactiveSearchFacetRepositoryImpl.get(id) is a raw UUID-keyed UPDATE-RETURNING
  (lines 99-106). **Operator-facing consequence**: search sessions are
  bearer-token-shaped — any authenticated user in possession of any other
  user UUID can READ, UPDATE, and DRIVE that session. Concrete impacts:
  (a) an operator copying a search URL into a bug report exposes their entire
  saved-filter state including My Objects posture; (b) a CSRF-style cross-tab
  actor with read access to URL bars can hijack the session; (c) an
  authenticated attacker probing GET /api/search/{guess} UUIDs either gets
  "Search not found" 404 or reads another user session 200. The UUID space
  is 122-bit gen_random_uuid so brute-force is infeasible, but URL leakage
  is not. **TODO markers acknowledge maintenance gaps but do NOT defend the
  unscoped posture** — V0_0_1__init.sql:206-207 carries
  "TODO: find more clever way to generate uuid" + "TODO: find a way to
  define TTL" — neither addresses the missing owner-binding. The schema
  went into the initial migration this way and has been retained across all
  subsequent migrations. **Severity**: HIGH — schema-level decision; lift
  requires a migration + a back-fill strategy.

  ## STRENGTHENED batch ZE (2026-05-25) — SearchController class-level

  Batch ZE adds the SearchController class-level confirmation. The
  full controller class (7 endpoints across the search surface) is
  pinned: NO @PreAuthorize, NO SECURITY_RULES entry for any
  /api/search* path (verified by `grep -in 'search\|facet'` returning
  zero matches), authIdentityProvider.fetchAssociatedOwner is called
  only for the OPTIONAL myObjects scoping branch — never for session
  ownership. Cross-link:
    - The 7 SearchController endpoints' SearchAPI exposure
      (search/getSearchFacetList/updateSearchFacets/getSearchResults/
      getFiltersForFacet/getSearchSuggestions/highlightDataEntity)
    - All endpoints inherit the bearer-token semantic from the
      bearer-token-shaped session UUID at the schema layer.
    - Same UUID also reaches the highlightDataEntity endpoint
      (cross-link with the get-highlighted-result-formatted-sql-injection
      invariant — bearer-token semantics PLUS SQL-injection vector
      compound the threat).

  Sibling concepts: TermController + QueryExampleController +
  ReferenceDataController follow the same UUID-keyed bearer-token
  session pattern — four feature surfaces, identical posture.
