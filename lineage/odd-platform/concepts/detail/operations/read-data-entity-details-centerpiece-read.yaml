name: Read Data Entity Details (centerpiece read)
canonical_in_docs: true
canonical_candidate: false
description: '`GET /api/dataentities/{data_entity_id}` — the platform''s single hottest
  read endpoint. NO `@PreAuthorize`, NO SECURITY_RULES entry, falls through to `pathMatchers(''/**'').authenticated()`
  (and `permitAll()` under DISABLED). Pure delegation to `DataEntityService.getDetails(long)`:
  1 CTE select (multi-JOIN, `baseDimensionsSelect`) + 5 parallel reactive lookups
  (enrich-class: dependencies + last-task-runs + DEG-children + DEG-children-count
  + consumers-count) + 1 parent-DEG lookup + 4 parallel reactive lookups (enrich-details:
  metadata + dataset-versions + terms + tags) + 1 UPDATE `view_count` → ~10 round-trips
  per call. `@ReactiveTransactional` wraps the chain INCLUDING the view-count UPDATE
  — every read is also a write at the DB layer. Soft-deleted entities ARE returned
  (`.includeDeleted(true)` is deliberate; UI needs this to render the `isStale` flag).
  Returns the FULL 34-field `DataEntityDetails` payload — ownership[], descriptions,
  tags, terms, metadataFieldValues[], dataSource, linkedUrlList[], sourceList[]/targetList[]/outputList[]/inputList[],
  viewCount, isStale, manuallyCreated, suiteUrl/suiteName/expectation/severity. Centerpiece
  embodiment of the read-collaborative posture (ADR-CANDIDATE-003 RESOLVED as INTENTIONAL
  on this endpoint).'
axes_present:
- controllers
