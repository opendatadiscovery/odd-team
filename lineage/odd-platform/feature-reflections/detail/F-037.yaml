- id: H-012
  hypothesis: "When a power-user on a large catalog wants more than 30 rows per page, they can adjust the page size from the UI."
  derivation: "Senior-product-owner UX seed (customisation): a list browser on a large catalog would let the user tune density / page size."
  seed_source: ui-label
  validation:
