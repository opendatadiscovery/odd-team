mitigations_unimplemented:
  - |-
    DECISION REQUIRED — choose the update contract and make it explicit:
    Option A (keep REPLACE): document on the /features/management
    Datasources tab that editing a data source via the API requires
    sending the COMPLETE field-set; a partial body nulls the omitted
    fields. The UI form already resends all fields, so this is an
    API-consumer-facing caveat.
    Option B (switch to MERGE): set
    `nullValuePropertyMappingStrategy = NullValuePropertyMappingStrategy.IGNORE`
    on the DataSourceMapper (NOT globally on MapperConfig — a global
    change affects every @MappingTarget mapper in the platform). This
    converts the endpoint to field-wise PATCH; an omitted field
    leaves the column untouched.
  - |-
    Add the regression test (criticality HIGH, currently absent):
    PUT /api/datasources/{id} with a body carrying only `name`;
    assert the existing `description` and `namespace_id` are
    PRESERVED (under Option B) or NULLED (under Option A — pins the
    current behaviour). Either way the test makes the contract
    refactor-visible.
  - |-
    Build-time guard: a MapStruct-config lint that flags any
    @MappingTarget mapper whose enclosing MapperConfig leaves
    nullValuePropertyMappingStrategy unspecified — surfaces every
    silent-REPLACE @MappingTarget across the platform so the
    maintainer can audit each for intent.
notes: |-
  This invariant is the file-local operator-hazard companion to the
  architectural datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation
  invariant. The 5-vertex invariant says WHAT the disjunction is; this
  invariant says WHY a routine partial edit on the UI path destroys
  data and HOW FRAGILE the mechanism is (one MapperConfig line).

  The load-bearing observation: the REPLACE semantic is not declared
  anywhere — not in the endpoint name, not in the OpenAPI description,
  not in the live doc page. It is an EMERGENT consequence of (a)
  DataSourceUpdateFormData having no `required` block, (b) MapStruct's
  default SET_TO_NULL, and (c) MapperConfig not overriding it. A
  maintainer reading any one of those three in isolation would not
  predict the data-loss behaviour.

  Cross-cutting connections:
    - Pairs with datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation-batch-w
      (the architectural-disjunction framing of the same REPLACE fact)
    - Pairs with silent-data-loss-replace-not-merge-ingestion-semantics
      (the ingestion-pipeline analogue of the silent-replace hazard)
    - Pairs with entity datasource-form-dto-create-update-narrow-mutable-surface
      (the all-optional UpdateFormData is the enabler)
    - Pairs with operation update-data-source-ui-admin-replace
      (the operation that carries this invariant)

  One DOC-NNN candidate: the /features/management Datasources tab
  should document the partial-edit-nulls-omitted-fields behaviour for
  API consumers — OR the maintainer switches the mapper to MERGE and
  the caveat disappears.
