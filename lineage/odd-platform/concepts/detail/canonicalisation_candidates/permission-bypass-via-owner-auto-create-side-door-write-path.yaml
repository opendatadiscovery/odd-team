proposed_canonical: Permission-bypass via Owner auto-create (side-door write path)
rationale: 'NEW cross-cutting invariant from batch 2026-05-12F. `DataEntityController.createOwnership`
  calls `OwnerService.getOrCreate(owner_name)` and `TitleService.getOrCreate(title_name)`
  which silently create directory rows when the name is novel — bypassing `OWNER_CREATE`
  permission and any Title-create permission gate that would otherwise exist. Documented
  `OWNER_CREATE` permission on `POST /api/owners` is incomplete because of the side-door.
  Codebase-wide analog risk: any future auto-create-on-missing pattern (`getOrCreate`,
  `findOrInsert`, `ensureExists`) inherits this shape unless the create-side permission
  is explicitly checked. Three DOC-NNN candidates flow: (a) `/authorization/permissions`
  page should name the side-door; (b) `/authorization/owners` page should clarify
  the two write paths; (c) new `/authorization/title-and-tag-vocabularies` page (or
  section) for free-text vocabulary growth.'
contributing_concepts:
- OwnerService.getOrCreate side-door (createOwnership batch F)
- TitleService.getOrCreate side-door (createOwnership batch F)
- Documented OWNER_CREATE permission gate on POST /api/owners (createOwner batch E)
- 'Codebase-wide audit candidates: TagService.getOrCreate, TermService.getOrCreate,
  NamespaceService'
suggested_add_to_docs: true
