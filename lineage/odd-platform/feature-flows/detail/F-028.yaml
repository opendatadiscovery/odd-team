cross_pillar_relationships:
- pillar_id: P-01
  kind: feeds
  via: |-
    Namespaces are the label-dimension scoping primitive for tags, terms,
    data entities, and lookup tables (per system-mission.md:96 P-01 sub-feature
    seed "Namespaces (label-dimension scoping for tags / terms)"). Namespace
    rows produced by this feature surface in Catalog Overview, Search facets,
    and the per-entity detail page namespace pill rendering.
- pillar_id: P-06
  kind: feeds
  via: |-
    Term-to-namespace binding is part of the Data Glossary primitive
    (system-mission.md:193 P-06 references the namespace association on
    Term entities). The F-002 (P-06:F-001 Term-to-Entity Linkage) reference
    `cross_namespace_term_pollution` facet is the cross-pillar manifestation
    of this feature's case-sensitivity + soft-delete-reincarnation invariants.
- pillar_id: P-09
  kind: shares_data_with
  via: |-
    Namespace mutation is gated by NAMESPACE_CREATE / NAMESPACE_UPDATE /
    NAMESPACE_DELETE (Management-scope permissions) per SecurityConstants.java:98-108.
    The four side-door services bypass this gate via parent-form permissions
    (TERM_CREATE/UPDATE, DATA_SOURCE_CREATE/UPDATE, COLLECTOR_CREATE/UPDATE,
    DATA_ENTITY_GROUP_CREATE/UPDATE) — the cross-pillar interaction with P-09
    RBAC is the canonical "Namespace Side-Door" finding documented across
    8 distinct call sites.
- pillar_id: P-10
  kind: shares_data_with
  via: |-
    Namespace binding on DataSource and Collector (the producer-ecosystem
    primitives in P-10) flows through this feature's create surface OR via
    the side-door (DataSourceServiceImpl.createDataSource / CollectorServiceImpl.create
    call namespaceService.getOrCreate). Cross-link to F-008 (Batch Ingestion
    + the DataSourceController batch-W ADR-CANDIDATE-143 counterfactual finding —
    UI admin DataSource registration ACCEPTS namespace_name; S2S Ingestion
    silently DROPS namespace from payload).
