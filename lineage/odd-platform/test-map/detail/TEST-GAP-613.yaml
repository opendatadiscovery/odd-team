  - "IngestionDataEntitiesFilter.md says (implicit_adrs.[1]): 'Token verification is PLAINTEXT-EQUALITY against a shared secret stored unhashed in PostgreSQL. The same stance applies to S2sAuthenticationFilter (sibling class).' confidence: HIGH"
