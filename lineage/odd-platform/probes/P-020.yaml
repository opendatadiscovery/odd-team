realism_caveats: |
  - Ingestion endpoint shape (`POST /ingestion/entities`) needs
    verification against actual OpenAPI ingestion spec. The Collector
    body has its own DataEntityList shape; field names may differ.

  - Probe assumes `auth.ingestion.filter.enabled=false` in the test
    environment (S2S filter disabled). Under enabled, the probe needs
    a valid S2S token.

  - The schema-introspection assertion (`is_system_event` column) is
    the SECONDARY finding: even if the primary NULL-username behaviour
    is verified, absence of a persisted systemEvent indicator is its
    own gap. Probe-runner should report both findings.

  - Activity Feed API call requires DISABLED auth OR a valid session
    token. The probe runs under DISABLED.

  - When the fix lands (warn-on-unexpected-NULL + persist systemEvent),
    assertions update to reflect new behaviour as documented in
    `expected_outcome`.

  - Complementary probe (future P-020-B): trigger an @ActivityLog-annotated
    mutation from an unauthenticated UI request under DISABLED auth to
    verify whether NULL-user manifests ALSO on the UI path or only the
    ingestion path. The two paths use DIFFERENT entry points
