expected_outcome: |
  Stress questions for GET /api/links (LinksController):

  (1) ORDERING (Category C): The controller streams linkProperties.links() and maps
  to LinkList without an explicit ORDER BY or sort. Spring Boot's @ConfigurationProperties
  binder for List<Record> typically preserves declaration order from the YAML / env
  flattening. Hypothesis: the order returned matches the order in the YAML / env
  variable indices. If the operator declares
      odd.links[0].title=A
      odd.links[1].title=B
      odd.links[2].title=C
  the API response.items SHOULD be A, B, C in that order. Verify this holds.

  (2) BOOT-TIME BINDING (Category E): @ConfigurationProperties is bound once at
  application startup. If the operator edits application.yml or the env at runtime
  (without restart), the endpoint MUST continue to return the boot-time value.
  Hypothesis: zero-rebind; the change is invisible until restart. Operator-visible
  consequence: editing the YAML inside a running container and refreshing the UI
  shows the OLD links, with no indication that a restart is required.

  (3) AUTH GATE (Category D): /api/links is NOT in WHITELIST_PATHS and has no
  SecurityRule entry, so it falls under the default
  `pathMatchers("/**").authenticated()`. Hypothesis:
    - DISABLED mode → 200, returns links (no auth wall at all).
    - LOGIN_FORM / OAUTH2 / LDAP modes → 401 unauthenticated, 200 for any
      authenticated user regardless of role/permission.
  No per-role gate. Verify that a freshly-provisioned user with no roles/owners
  can still read the global link list.

  (4) NULL / EMPTY HANDLING: When odd.links is unset entirely, linkProperties
  receives links=null; CollectionUtils.isEmpty handles both null and []. Response
  should be 200 with items=[]. Verify behaviour matches.

  (5) NO LIST-SIZE CAP: No upper bound enforced on the number of configured links.
  Hypothesis: with 5000 link entries configured, the endpoint still returns 200
  with all 5000; the UI's AppInfoMenu would render all 5000 (no pagination on
  client side either). Operator-visible: pathological config crashes the menu.
