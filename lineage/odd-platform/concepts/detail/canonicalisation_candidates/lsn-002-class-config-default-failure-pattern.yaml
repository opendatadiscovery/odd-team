proposed_canonical: LSN-002-class config default failure pattern
rationale: |
  Originally two-sidecar evidence (GenAIProperties + AttachmentServiceImpl@L27) embodying
  the same architectural pattern: a typed config field with no Java initializer ships a
  primitive default (`int` 0, boxed `Integer` null) that is legal at boot but broken at
  first use. LSN-002 retrospective names the regional variant (MinIO us-east-1); the
  `requestTimeout=0` and `maxFileSize` unset cases are the same root cause in
  different domains. postMessageInSlack provides the disciplined counter-example:
  explicit fail-fast empty-check on slack-oauth-token. Useful as a pattern-recognition
  anchor for future enrichments.

  **STRENGTHENED batch 2026-05-20X — promoted to canonical invariant**.
  The `lsn-002-class-primitive-default-ships-disabled-but-broken-when-enabled` invariant
  has grown to 10-sidecar triangulated coverage (5 existing config-key-consumers +
  4 batch X config-classes + 1 existing config-properties-class). Batch X added four
  NEW instances at the config-class layer:
    - MinioConfig.java:19-25 — DIRECT primary source of LSN-002 itself (the file the
      retrospective named)
    - LoginFormSecurityConfiguration.java:70 — auth.login-form-credentials no-default
      fail-loud
    - NotificationConfiguration.java:123 — notifications.message.downstream-entities-depth
      no-default
    - R2DBCConfiguration.java:41-50, 75-84 — spring.r2dbc.pool.* un-published framework
      defaults

  This canonicalisation_candidate is now SUPERSEDED by the canonical invariant; retained
  here for cross-batch traceability. The maintainer can review the canonicalisation_candidate
  against the promoted invariant.
contributing_concepts:
- silent misconfiguration when genai.enabled=true is the only key set (GenAIProperties)
- boot-time crash if attachment.max-file-size is unset (AttachmentServiceImpl@L27)
- LSN-002-class concern flagged in input prompt (GenAIProperties.performance.known_performance_gaps[0]
  — counter-example)
- fail-fast on empty slack-oauth-token at boot (postMessageInSlack implicit_adrs[0]
  — counter-example)
- 'BATCH X: MinioConfig.java:19-25 — DIRECT primary source (4 instances at the file
  the retrospective named: .region, .httpClient, .credentialsProvider, no @PostConstruct
  validation)'
- 'BATCH X: LoginFormSecurityConfiguration.java:70 — auth.login-form-credentials with
  no `:default` (fail-loud BeanCreationException at boot)'
- 'BATCH X: NotificationConfiguration.java:123 — notifications.message.downstream-entities-depth
  with no default + the in-file asymmetry with platform-base-url at L105 which DOES
  have a default'
- 'BATCH X: R2DBCConfiguration.java:41-50, 75-84 — 10 spring.r2dbc.pool.* keys wired
  via PropertyMapper but zero shipped in application.yml'
suggested_add_to_docs: false
