behaviour: |-
  DEG-with-members-but-no-edges 200/empty-items contract regression-pin (LOW — P-05). When the DEG has members but none of them share lineage edges, `getLineageRelations(List<String>)` returns an empty Flux, `establishedRelations` is empty, `items` is `List.of()`, and the response is `200 OK` with `{"items": []}`. The DEGLineage React component (`DEGLineage.tsx:18-19`) reads `data?.nodes || []` and `data?.edges || []` which both come out empty; the component then renders an `EmptyContentPlaceholder`. Importantly, this is DISTINCT from the DEG-with-zero-members case (TEST-GAP-507) which produces a 404. The contract is: (a) DEG has zero members → 404; (b) DEG has members but no edges between them → 200 with empty items; (c) DEG has members and edges → 200 with populated items. NO test pins the asymmetry between (a) and (b). A regression that conflated the two states (e.g. switchIfEmpty firing on empty edges instead of empty members) would silently break the UI's EmptyContentPlaceholder rendering and confuse operators about whether their DEG has members.
