# Search Result Row tile — product-owner reflection

## product_owner_narrative

**What it is.** The Search results list is the main pane of the Data Discovery Catalog page (`/search/*`) — the surface a user lands on after typing a query into the catalog search box. Each match renders as one horizontal row (`ResultItem`), and the rows stack inside an infinite-scroll list (per `Search.md:understanding` + `Results.tsx:151-159`). A row shows the entity's name (with a staleness clock if `is_stale`), its entity-class badges, per-class stats (rows/columns/consumers for datasets, source/target for transformers, etc.), its namespace, its datasource (with logo), its owners, its status, and created/updated timestamps (`ResultItem.tsx:85-244`). This is where an operator answers "is this the table I'm looking for?" by scanning the list — and then opens the one they want.

**How a user interacts with it.** The entire row is one big click target: `<S.Container container onClick={() => navigate(detailsLink)}>` (`ResultItem.tsx:72-76`). `detailsLink` is built once as `dataEntityDetailsPath(searchResult.id)` (`ResultItem.tsx:42`), which — with no path segment supplied — resolves to `/dataentities/{id}/overview`, the entity's Overview tab. So a click anywhere on the row navigates the SPA to that entity's detail page. There is no separate "open" button and no anchor on the name cell; the row tile IS the affordance.

**The working parts — and the part the user never sees.** The Overview tab the row navigates to is the F-001 chain's mounting site. Mounting `DataEntityDetails` fires `fetchDataEntityDetails` → `GET /api/dataentities/{id}` → `DataEntityServiceImpl.getDetails` (`@ReactiveTransactional`) → `ReactiveDataEntityRepositoryImpl.incrementViewCount` → `UPDATE data_entity SET view_count = view_count + 1` (per `DataEntityDetails.md:downstream_side_effects`). Because of the LSN-017 dependency-array bug at `DataEntityDetails.tsx:56-64`, that mount fires the fetch TWICE, so a single row-click writes +2 view_count (empirically pinned by probe P-004 — xhr_count=2, DB delta=2). The home-page "Popular" strip (F-003) ranks by exactly this column. So the act of clicking a search result to inspect it feeds the popularity ranking — the user is voting by browsing, with no awareness and no opt-out (per `F-001.yaml` facet `Directory level-4 EntityItem ALSO closes the F-001 inflation loop` — the Search row is the same closure shape at a different mount site).

**The integration story.** F-147 is the SEARCH-LIST analog of F-001's home-page PopularStrip closure and the Directory level-4 EntityItem closure: three distinct UI surfaces, all routing through `dataEntityDetailsPath(id)` into the same read-as-write Overview tab (per `DataEntityDetails.md:upstream_callers`). Search is one of the platform's three read-collaborative cross-owner surfaces (alongside Popular and the Activity feed; per `system-mission.md` P-09 maintainer notes), so the list a user scans spans every owner's entities — and every click on any of them inflates the global Popular ranking. The fix the maintainer has scoped (PLT-091 + PLT-104) deliberately couples the search-side and home-side triggers so the Popular metric becomes meaningful only when BOTH are addressed.

**Edge cases a demo would highlight.** A keyboard-only operator can type a query, watch results render, and then have no way to open one — the row is a `<div>` (`S.Container` is a styled MUI `Grid`), not an `<a>`/`<button>`, with no `tabindex`, `role`, `aria-label`, or `onKeyDown` (`ResultItem.tsx:72-76`). A power user who middle-clicks a result to open it in a background tab (the universal "open this, keep scanning" gesture) gets nothing — there is no real `href`, only a JS `navigate`. And inside the row sit three smaller interactive elements — a staleness tooltip, a search-highlights `QuestionIcon` tooltip, and a hover-preview (`MetadataStale` / `AppTooltip`+`QuestionIcon` / `DataEntityDetailsPreview` at `ResultItem.tsx:87-106`) — none of which stop click propagation at the consumer site, so a click intended for one of them also fires the row's navigate.

