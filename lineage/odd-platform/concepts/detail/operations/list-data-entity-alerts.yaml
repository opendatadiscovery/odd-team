security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      No SecurityRule entry; no controller-level annotation. Falls
      through to .authenticated() catch-all. Same pattern as REFACTOR-024
      on getAllAlerts but applied to a per-entity surface.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      No OWNERSHIP join in the SQL; no principal parameter at any layer.
      Every authenticated caller sees every alert for every data_entity_id.
  weaknesses:
    - |-
      HIGH — cross-owner read of full alert history (status / chunks /
      generator-URL text); pairs with REFACTOR-024
    - |-
      MEDIUM — sibling-asymmetry: alert_config PUT is rule-gated,
      this read is not; no inline justification
    - |-
      LOW — soft-deleted entities' alert history reachable to any
      ID-knowing caller; intentional but undocumented
    - HIGH under DISABLED — anonymous cross-owner enumeration
  strengths:
    - |-
      Soft-delete-inclusive existence-check is INTENTIONAL (the helper
      name encodes intent); supports the documented audit-export
      workaround use case
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - Per-tab activation on the entity detail page (fires alongside getDataEntityAlertsCounts)
    - Audit-export workaround burst — operators hit before manually resolving
  weaknesses:
    - |-
      MEDIUM — no upper bound on pagination `size`; the audit-export use
      case amplifies (operators want large pages to complete with fewer
      round-trips). A `size=1_000_000` triggers unbounded query.
    - LOW — deep-pagination cost via OFFSET = (page - 1) * size
    - LOW — 2 sequential DB round-trips (existence + page); could be 1
    - LOW — no caching / Cache-Control / ETag
    - LOW — no method-level observability
notes: |-
  NEW operation captured in batch 2026-05-19L. The operation is doubly
  significant — operationally as the per-entity Alerts tab AND as the
  platform-recommended audit-export workaround. The contract is
  intentionally permissive (cross-owner read + soft-delete-inclusive
  existence + no pagination upper bound) in service of the workaround;
  the docs do not surface the implications.

  Cross-cutting connections:
    - Related entity: per-entity-alert-listing (NEW)
    - Strengthens existing invariants:
      - read-collaborative-cross-owner-enumeration (NEW SURFACE — the
        15th contributing site, per-entity sub-shape applied to alerts)
      - pagination-parameters-declared-but-unconstrained-at-spec-and-controller-layers
        (NEW PRIMARY SOURCE confirmation on the read side)
      - "Centralised authorization in SecurityRules; GET endpoints by
        convention are NOT rule-gated" (the implicit ADR sometimes
        referenced as the "authorization is path-pattern wired"
        invariant)
    - Cross-references "List Alerts (three visibility scopes)"
      operation — the BATCH-read counterparts (getAllAlerts /
      getAssociatedUserAlerts / getDependentEntitiesAlerts); this
      operation is the per-entity counterpart with the same cross-owner
      posture for the unscoped case

  Three DOC-NNN candidates flow from this operation:
    (a) Update the alerting feature page to document the cross-owner
        read posture on the per-entity tab
    (b) Document the pagination shape on the audit-export workaround
        recommendation
    (c) Document the soft-delete-inclusive existence-check behaviour
