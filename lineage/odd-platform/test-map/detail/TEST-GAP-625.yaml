behaviour: |-
  **SEARCH-VECTOR REFRESH-AFTER-RENAME IS IN-TRANSACTION; DELETE PATH SKIPS IT (asymmetry).** updateOwner's search-vector refresh runs INSIDE the @ReactiveTransactional boundary via `Mono.zip` over `searchEntrypointRepository.updateChangedOwnerVectors` + `termSearchEntrypointRepository.updateChangedOwnerVectors` (OwnerServiceImpl.java:82, 109-114); both UPDATE statements complete before the final `getDto(owner.getId())` re-read. The transaction boundary covers all six writes; a rollback restores name, role-bindings, AND search vectors. **However: the sibling deleteOwner path does NOT refresh search vectors** (OwnerServiceImpl.java:89-100 has no `updateSearchVectors` call). The asymmetry produces a real bug after delete: FTS searches against `search_entrypoint` continue to surface the deleted owner's name in catalog search results until another event refreshes the affected entities' vectors. NO test asserts: (a) update path: searches by OLD name no longer match after rename, AND searches by NEW name DO match; (b) delete path: searches by deleted name STILL match (the current buggy behaviour). Both vectors must update; a regression in either `updateChangedOwnerVectors` would leave stale indexes. Plus the search-vector cost scales O(N) over the number of search-entries referencing this owner — for a high-cardinality owner, rename is amortised admin-time expensive but unrelated to test gap.
