security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      Routes that LOOK gated by WithPermissionsProvider listing permissions
      are NOT gated — the wrapper renders unconditionally. The only
      route-level gates in the entire SPA route registry are
      ManagementRoutes.tsx:101-110 (RestrictedRoute around Associations)
      and a few specific cases. Every other 'wrapped' route renders for
      any authenticated user; the inner WithPermissions HOCs hide
      individual buttons.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Route mount has no current-user predicate; data fetched by inner
      components is read-collaborative (per the cross-owner enumeration
      invariant). The wrapper at the mount does not narrow data access.
  strengths:
    - |-
      The read-collaborative intent IS consistent across the codebase —
      every route that wraps with WithPermissionsProvider is intentionally
      read-open; the wrapper's purpose IS to seed inner button permissions
      via context. The intent is intentional.
    - |-
      The 'real' gate (WithPermissions HOC) at the button level DOES
      consistently HIDE-not-DISABLE when permission absent (return null
      per WithPermissions.tsx:27-29). The HOC name and behaviour align —
      drift is in the Provider sibling.
  weaknesses:
    - |-
      The wrapper name promises an access gate; the behaviour is context
      only. A reviewer reading the route registry believes routes are
      gated. A maintainer simplifying an inner WithPermissions believing
      the route wrapper handles it ships an open page.
    - |-
      The doc-side phrasing ('RBAC-gated by PERM') across data-modelling,
      lookup-tables, and other pillar docs is more restrictive than the
      implementation — operators reading the docs cannot tell from the
      phrasing where the gate actually applies.
    - |-
      The maintainer cannot grep for 'route gates' by searching
      WithPermissionsProvider — the actual route-level gates are
      RestrictedRoute (Associations only) + the dynamic in-button HOCs.
      Audit surface is opaque.
  cross_file_inconsistencies:
    - |-
      The 5 contributing sidecars TRIANGULATE on the same finding —
      WithPermissionsProvider does not block rendering — across 5
      independent route mounts spanning P-02 (Data Modelling),
      P-03 (Master Data), P-04 (Data Quality), P-06 (Glossary), P-08
      (Management). No contributing sidecar disputes the claim.
  contributing_files:
