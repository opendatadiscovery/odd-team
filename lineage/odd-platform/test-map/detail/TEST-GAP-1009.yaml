  - path: "odd-platform-ui/src/routes/__tests__/directoryRoutes.useDirectoryRouteParams.test.tsx"
    name: "useDirectoryRouteParams_nonNumericDataSourceId_returnsNaNAndAllSixConsumersPropagate"
    description: |-
      Same fixture but URL '/directory/postgresql/abc/all'. Assert
      dataSourceId is NaN AND Number.isNaN(dataSourceId) === true.
      Document the swallowing explicitly. Pair with six SHALLOW renders
      of each consumer (DataSourceList, Entities, DirectoryBreadCrumbs,
      EntitiesTabs, EntityItem, TableHeader) with a mocked
      useDirectoryRouteParams returning {dataSourceId: NaN}; assert each
      consumer either short-circuits to NotFoundPage OR dispatches with
      NaN. Pins the current six-consumer NaN fan-out.
  - path: "odd-platform-ui/src/routes/__tests__/directoryRoutes.useDirectoryRouteParams.test.tsx"
    name: "useDirectoryRouteParams_garbageTypeId_returnsNaNAndTypeColumnStillRenders"
    description: |-
      URL '/directory/postgresql/1/garbage'. Assert typeId === NaN (NOT
      undefined; the 'all' sentinel is not matched). Verify
      `TableHeader.tsx:22 if (!typeId)` evaluates true on NaN (NaN is
      falsy) → the Type column renders. PINS the inconsistent UX path
      (column renders but the backend call still fires with NaN).
  - path: "odd-platform-ui/src/routes/__tests__/safeParseRouteParamId.test.ts"
    name: "safeParseRouteParamId_helperAcceptsValidNumberRejectsNaNZeroNegative"
    description: |-
      Forward-looking test for the SHARED HELPER that would close this
      pattern project-wide. Once the helper is authored, the four sibling
      hooks (useDirectoryRouteParams, useTermsRouteParams,
      useDataEntityRouteParams, useIntegrationRouteParams) consume it and
      each return `{id: number | undefined}` — making the type system
      honest. Tests on the helper itself: accepts '42' → 42; rejects 'abc'
      → undefined; rejects '0' → undefined (per the queryExamples falsy-id
      pattern); rejects '-1' → undefined; rejects undefined → undefined.
      Pair with consumer-side guards that bail with NotFoundPage on
      undefined.
