gap_id: TEST-GAP-249
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java SearchController controller-method:search
surfaced_by:
- search.md:bugs_limitations_corner_cases.[0]
behaviour: '`POST /api/search` returns the catalog-wide aggregation to any authenticated
  user — no Permission gate, no Role check, no admin restriction, no owner-scoping.
  A user toggling `my_objects=false` (the default) gets `countByState(state)` over
  the ENTIRE catalog. Combined with `GET /api/search/{search_id}/results` (which only
  owner-filters when `state.isMyObjects()`), an authenticated user can paginate through
  every non-`EXCLUDE_FROM_SEARCH` data entity in the platform — name, ODDRN, descriptions,
  ownership, tags, custom metadata. Same shape as REFACTOR-024 (getAllAlerts cross-owner)
  and REFACTOR-053 (Activity feed) but with WIDER blast radius — search is the catalog''s
  primary discovery surface. Live `features/data-discovery/search` doc says NOTHING
  about WHO can search.'
test_files_existing:
- tests/features/search/search.spec.ts (Playwright UI — does NOT assert authorization
  posture)
- tests/features/search/search_in_data_entity.spec.ts
