name: |-
  getPopularTagList open-read + per-entity-tag-editors compose to WRITE+READ directory bypass (HIGH severity, batch W cross-batch closure; STRENGTHENED batch VAL-LSN-019 with TagServiceImpl service-tier confirmation of zero-auth posture)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-08
  - P-09
description: |-
  HIGH-SEVERITY INVARIANT, batch 2026-05-20W — composes the
  existing TAG_CREATE side-door (write-side, batch K + U) with the
  newly-confirmed open-read on getPopularTagList (read-side, batch W
  primary source) into a complete WRITE+READ bypass of the dedicated
  TAG_* permissions. A per-entity-tag-editor with NO `TAG_*`
  permissions can both MUTATE and ENUMERATE the global Tag directory.
  STRENGTHENED batch VAL-LSN-019 with TagServiceImpl confirming
  zero service-tier authorisation across all 9 public methods.

  THE COMPOUND PATTERN:

    Write side (existing — strengthened batch W + batch VAL-LSN-019):
      A caller holding ONLY DATA_ENTITY_TAGS_UPDATE (or
      TERM_TAGS_UPDATE / DATASET_FIELD_TAGS_UPDATE / S2S ingestion)
      can MINT NEW global Tag rows via tagService.getOrCreateTagsByName
      WITHOUT holding TAG_CREATE. The side-door has been progressively
      enumerated:
        - batch F initial finding — Tag side-door past TAG_CREATE
          (spec-documented-auto-create-with-scope-asymmetry...)
        - batch K — TermServiceImpl.upsertTags + DatasetFieldServiceImpl
          + ExternalTagIngestionRequestProcessor confirmed as 3 of 4
          call sites
        - batch U — TermController class-level confirms the 3 side-door
          call sites + adds the architectural class
          (getOrCreate-as-side-door-pattern)
        - batch W — TagController class-level explicitly enumerates
          ALL 4 side-door call sites + their gating permissions:
            (a) TagServiceImpl.updateRelationsWithDataEntity
                (`:105`) — DATA_ENTITY_TAGS_UPDATE permission
                (per-entity scope)
            (b) TermServiceImpl.upsertTags (`:257`) —
                TERM_TAGS_UPDATE permission (per-term scope)
            (c) DatasetFieldServiceImpl (`:202, 266`) —
                DATASET_FIELD_TAGS_UPDATE permission (per-field
                scope)
            (d) ExternalTagIngestionRequestProcessor (`:104`) —
                gated only by `auth.ingestion.filter.enabled` S2S
                filter
        - NEW batch VAL-LSN-019 — TagServiceImpl class-level
          confirms ZERO service-tier authorisation. Across all 9
          public methods + 2 private helpers:
            - ZERO `@PreAuthorize` annotations
            - ZERO `permissionService.hasPermission(...)` calls
            - ZERO `OwnerAuthorizationFacade` invocations
            - ZERO `SecurityContextHolder` reads
          The controller perimeter is the SOLE auth defence. The
          four side-door write paths apply their per-feature
          permission (DATA_ENTITY_TAGS_UPDATE etc.) BEFORE reaching
          this service; the service-tier methods themselves have no
          second-axis check. The dual-method design
          (getOrCreateTagsByName vs getOrInjectTagByName, the
          "create-shape" choice) IS the only TAG_*-related architectural
          variance at this layer — neither variant gates on TAG_CREATE.

    Read side (TagController controller-class — batch W):
      GET /api/tags (getPopularTagList) has NO SecurityRule entry
      at SecurityConstants.java:138-142 — verified by reading the
      file end-to-end. The endpoint falls through to
      AuthorizationCustomizer.java:29-30 `.authenticated()`
      catch-all. ANY authenticated user — including a user with
      ONLY per-entity DATA_ENTITY_TAGS_UPDATE — can enumerate the
      ENTIRE global tag directory regardless of `TAG_*` permissions
      or Management-scope role. The page-size parameter is NOT
      clamped at the controller, service, or repository tier
      (TagController.java:37-42 passes `size` straight through);
      a single request can enumerate the entire directory.

      NEW batch VAL-LSN-019 — the read-side compound with the
      LSN-019 drift: an enumerator gets the OLDEST tags in tag.id
      ASC order (per the LSN-019 listMostPopular drift). For an
      attacker mapping the global tag namespace, this is a
      side-channel — the youngest tags (the ones a defender might
      consider sensitive, e.g., newly-added "pii_classification"
      tags) are MORE DIFFICULT to enumerate because they require
      paging beyond the first page. NOT a defence against
      enumeration (every authenticated user can page); just an
      operational note that the LSN-019 drift makes the surface
      ordered-but-unexpected.

  THE COMPOUND CONSEQUENCE:

    A user holding ONLY DATA_ENTITY_TAGS_UPDATE on entity X (the
    Policy condition `is: dataEntity:owner` is the canonical way
    to grant this) can:
      (1) Read the entire global tag directory via GET /api/tags
          (NO TAG_* permission needed).
      (2) Discover existing tag names + their popularity rankings
          across all owners. (Caveat: LSN-019 means the "popularity"
          ordering is OLDEST-first ranked-by-count within the
          window; the user enumerates the OLDEST tags first.)
      (3) MINT new tag names via PUT /api/dataentities/X/tags with
          novel tag-name entries (DATA_ENTITY_TAGS_UPDATE permission
          alone).
      (4) The newly-minted tags are immediately visible to every
          other authenticated user via GET /api/tags.
      (5) The user has both READ and WRITE access to the global
          tag namespace WITHOUT holding ANY `TAG_*` permission.

    The Policy author who granted DATA_ENTITY_TAGS_UPDATE 'on entity
    X' expects the user to mutate ONE entity's tags. The compound
    bypass elevates that grant to FULL DIRECTORY READ+WRITE — a
    cross-tenant catalog vocabulary pollution surface.

    The doc-side framing is consistently 'vocabulary-level vs
    assignment-level' (per the live /features/data-discovery/tagging
    page WebFetched 2026-05-20 status 200, verbatim): 'TAG_CREATE,
    TAG_UPDATE, TAG_DELETE: All three govern vocabulary-level
    mutations, not assignment operations.' But the compound bypass
    inverts this — DATA_ENTITY_TAGS_UPDATE is doc-framed as an
    'assignment' permission yet ARCHITECTURALLY-IT-IS a vocabulary-
    mutation permission for novel names.

  THE COMPOUND WITH deleteTag CASCADE ASYMMETRY (cross-link to
  batch W sibling invariant):

    The per-entity-tag-editor MINTS rows in tag_to_dataset_field
    via the DATASET_FIELD_TAGS_UPDATE side-door. When the operator
    (with TAG_DELETE) later deletes the tag, the
    tag_to_dataset_field rows are NOT cleaned up (per the deletetag-cascade-asymmetric
    invariant). The orphan rows persist forever; the
    per-entity-tag-editor's actions outlast the operator's cleanup.

  THE COMPOUND WITH ZERO AUDIT-LOG (cross-link to existing concept):

    Tag directory mutations (createTag, updateTag, deleteTag) do
    NOT emit Activity Feed entries (confirmed batch W from
    TagController class-level sidecar; STRENGTHENED batch
    VAL-LSN-019 from TagServiceImpl). The platform's
    @ActivityLog(event = TAG_ASSIGNMENT_UPDATED) annotation exists
    at DataEntityServiceImpl.java:358 (per-entity tag-assignment
    path) but NOT at the directory-vocabulary path. Operators using
    the Management → Tags tab to delete or rename a tag produces
    NO audit trace. Combined with the side-door + open-read, the
    Tag-directory mutations are TRIPLY-DARK:
      - The mutations themselves are not audited.
      - The side-door entry point is not gated by TAG_*.
      - The read posture allows unrestricted enumeration.

  THE COMPOUND WITH LSN-019 (NEW cross-link, batch VAL-LSN-019):

    The open-read endpoint AT WHICH the directory is enumerated
    ALSO lies about its ordering. An attacker enumerating the tag
    namespace believes they are seeing tags ranked by popularity
    (per the UI label "Top Tags" + the method name + the OpenAPI
    description). They are actually seeing OLDEST tags ranked by
    count DESC within the OLDEST window. The compound bypass is
    not a NEW security risk from the LSN-019 drift — but it does
    mean the attacker's mental model is wrong; recently-minted
    tags (e.g., the attacker's own newly-side-door-created
    "novel_name_xyz") are NOT at the top of page 1. The defender,
    too, has a wrong mental model — checking page 1 for "what
    recently appeared" returns OLDEST tags, not RECENT additions.

  THE THREE-DOC-PAGE SILENCE:

    Live /features/data-discovery/tagging (WebFetched 2026-05-20
    status 200): describes the per-entity 'create a new tag inline'
    UX, but the permission framing names ONLY TAG_CREATE / TAG_UPDATE
    / TAG_DELETE and describes them as 'vocabulary-level mutations'.
    Does NOT state that DATA_ENTITY_TAGS_UPDATE alone can mint
    new tag-vocabulary rows.

    Live /configuration-and-deployment/enable-security/authorization/permissions
    (WebFetched 2026-05-20 status 200): names BOTH TAG_CREATE
    (MANAGEMENT scope) AND DATA_ENTITY_TAGS_UPDATE (DATA_ENTITY
    scope) but does NOT describe the side-channel. Verbatim:
    'The documentation does not describe any mechanism by which the
    DATA_ENTITY_TAGS_UPDATE permission can create new global tags.
    Only TAG_CREATE is listed as enabling tag creation in the
    Management permissions section.'

    The doc pages frame the system as if the dedicated TAG_*
    permissions are the SOLE write surface. The architecture
    contradicts this framing across 4 side-doors AND on the
    read side AND at the service-tier (zero authorisation).

  SEVERITY HIGH — operator-policy-authoring surface inverted from
  doc framing; cross-tenant catalog pollution; compound with
  cascade-asymmetry, audit-silence, and LSN-019 misnaming.

