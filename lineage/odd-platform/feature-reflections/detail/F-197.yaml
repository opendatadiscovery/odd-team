- id: H-011
  hypothesis: |-
    When a user posts a message and Slack delivery later fails (token revoked, channel
    archived, text too long, rate-limited beyond retries), the user is informed in the UI
    that their message did not reach Slack.
  derivation: |-
    Negative-space: a 202-Accepted async send means the success acknowledgement precedes
    actual delivery; a user reasonably expects to learn if delivery failed.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The send returns 202 with a Message body in PENDING_SEND state; downstream failures
      flip the row to ERROR_SENDING in the sender job, but there is NO push/notification on
      the HTTP surface to tell the original caller — the user must re-fetch
      /api/dataentities/{id}/messages to see status (postMessageInSlack.md
      bugs_limitations_corner_cases[4]). Whether the UI's messages list renders the
      ERROR_SENDING state visibly (a failed-badge, a retry affordance) cannot be determined
      from the chain — the Message component rendering (MessagesList/Message,
      ThreadMessage/MainThreadMessage) is sidecar:unresolved (VG-001) and the state-to-UI
      mapping is not in any read artefact. This requires standing the feature up locally and
      forcing an ERROR_SENDING (e.g. revoke the token after enqueue) to observe the UI.
    evidence:
      - sidecar: odd-platform__java__DataCollaborationController__controller-method__postMessageInSlack.md
        section: bugs_limitations_corner_cases
        cite: "DataCollaborationController.java:38 + DataCollaborationServiceImpl.java:96 + DataCollaborationMessageSenderJob.java:58-63"
        note: "ERROR_SENDING persisted; no HTTP-surface notification back to caller."
      - sidecar: "(validation gap)"
        section: VG-001
        cite: "Message / ThreadMessage UI components sidecar:unresolved"
        note: "UI rendering of message state not in any read artefact."
    operator_visible_failure: |-
      If the UI does not surface ERROR_SENDING, a user believes their message reached Slack
      (they got an apparent success and saw it in the list as PENDING) when it silently
      failed — the message is in the DB marked failed, but the team in Slack never saw it.
      The probe resolves whether the UI closes this loop.
    severity: MEDIUM
    confidence: LOW
    probe_id: PENDING-F-197-1
    routes_to_finding: functional-test-demand
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: "PENDING-F-197-1 (local probe — force ERROR_SENDING, observe UI)"

