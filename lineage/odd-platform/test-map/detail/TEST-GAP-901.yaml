proposed_action: |-
  Add `DataSourceListTokenMaskingTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Two test methods:
  1. `getDataSourceList_tokenValueIsMaskedSixStarsPlusRealLast6_notPlaintext_pinsTokenDtoConstructorChoice` — register a data source via POST /api/datasources, capture the 40-char plaintext token T from the POST response; GET /api/datasources; locate the matching item; assert `item.token.value` starts with exactly "******" (six stars); assert `item.token.value` is NOT equal to T; assert `item.token.value.substring(6)` equals `T.substring(T.length() - 6)`. PINS the masked rendering and documents that the mask leaks the real trailing 6 chars.
  2. `getDataSourceList_maskedTokenIsNotAValidIngestionCredential` — take the masked token from the list response; POST /ingestion/entities with it; assert 401 (the masked value fails the plaintext .equals in IngestionDataEntitiesFilter). Confirms the masked form is inert.

  A regression that swaps `new TokenDto(tokenPojo)` to `TokenDto.visibleToken(tokenPojo)`
  at ReactiveDataSourceRepositoryImpl.java:167 inverts test #1. Pair with DOC-GAP-034: the
  docs should state the masked form contains the REAL last 6 token characters, not a
  placeholder.
