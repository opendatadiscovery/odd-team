behaviour: |-
  **LOW — OwnerController class-wide OpenAPI vs implementation status-code drift on mutating endpoints: `createOwner` declares 201 returns 200 (OwnerController.java:26 vs openapi.yaml:165-171); `updateOwner` declares 201 returns 200 (OwnerController.java:53 vs openapi.yaml:195-201). The two non-drift methods (`deleteOwner` 204→204, `getOwnerList` 200→200) align. The drift is consistent class-wide: BOTH PUT/POST mutating endpoints underspecify the success code.**

  Verified at primary source:
  - `OwnerController.java:26` — `createOwner` returns `.map(ResponseEntity::ok)` (HTTP 200).
  - `OwnerController.java:53` — `updateOwner` returns `.map(ResponseEntity::ok)` (HTTP 200).
  - `OwnerController.java:44` — `deleteOwner` returns 204 (aligns with spec at openapi.yaml:215-217).
  - `OwnerController.java:37` — `getOwnerList` returns 200 (aligns with spec at openapi.yaml:145-151).
  - `openapi.yaml:165-171` — createOwner declares `'201': $ref './components.yaml/#/components/responses/Created'`.
  - `openapi.yaml:195-201` — updateOwner declares `'201': $ref './components.yaml/#/components/responses/Created'`.

  **Operator-visible consequence**:
  - OpenAPI-codegen client expecting 201 sees 200 → silent client-side warning; the failure mode is "unexpected status code" in the generated handler.
  - Sibling write operations across the platform (`PUT /api/policies/{id}`, `PUT /api/tags/{id}`, `PUT /api/roles/{id}`) show similar drift per the F-006 batch sidecars — this is **platform-wide pattern**, not OwnerController-specific.

  **Why LOW**:
  - The pattern is platform-wide; the OwnerController instance is a contributing data point, not a singularity.
  - The fix path is well-defined (spec OR code update; coordinated).
  - The drift is locked in by zero existing tests (the OwnerController has NO controller-tier HTTP test); a fresh test pins the current shipped behaviour without breaking anything.

  **Distinguishes**:
  - TEST-GAP-971 (sister this batch) — IngestionController class-wide drift on 3 mutating handlers.
  - TEST-GAP-966 (sister this batch) — DataCollab 302-vs-301 drift.
  - `concepts/detail/invariants/openapi-200-vs-201-status-code-drift.yaml` — the cross-pillar invariant.
