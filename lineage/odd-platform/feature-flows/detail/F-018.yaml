      For a per-entity detail page with N tags, this is 3xN DB rows
      materialised. Same shape as the term-activity-handler triple-re-query
      (REFACTOR-228 — captured in F-002).
    expected: |-
      Per-request memoisation via reactor Context, OR refactor the three
      consumers to share a single Tag-list fetch.
    drift_class: triple_fetch_list_data_entity_dtos_per_request
    provenance: |-
