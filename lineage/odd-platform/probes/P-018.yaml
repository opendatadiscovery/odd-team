expected_outcome: |
  LSN-019 STRESS-FINDING S-E-4: Pin whether Postgres row-order non-determinism
  in the ownership-list query produces SPURIOUS activity events when the
  underlying ownership set is unchanged.

  Mechanism: `ReactiveOwnershipRepositoryImpl.getOwnershipsByDataEntityId`
  (`:130-145`) issues a 3-table JOIN (OWNERSHIP × OWNER × TITLE) with NO
  `ORDER BY` clause. `AbstractOwnershipActivityHandler.getDataEntityOwnerships`
  (`:18-22`) `.collectList()`s the Flux and `JSONSerDeUtils.serializeJson`s
  the list. `ActivityAspect.postActivity` (`:81-95`) compares old vs new as
  `String.equals` (`:86`). If Postgres returns the same owner set in
  DIFFERENT order between `getContextInfo` (before mutation) and
  `getUpdatedState` (after mutation), the byte-strings differ, the filter
  passes, and a SPURIOUS ActivityPojo row is created showing "ownership
  updated" when nothing semantically changed.

  Arrange: 1 data entity (id 1018) + 2 pre-existing ownerships
  (alpha/lead, beta/steward) + CLUSTER OWNERSHIP table to force a
  storage perturbation between reads.

  Act: PUT a no-op ownership update (same title onto the same ownership)
  that triggers the @ActivityLog path.

  Observe: query the `activity` table for the resulting OWNERSHIP_UPDATED
  row. Parse `old_state` and `new_state` JSON. Are they byte-different
  but semantically equal as sets of (owner_name, title_name) tuples?

  Assertion (current bug state, if the race manifests):
  - A spurious ActivityPojo row exists with byte-different old/new states
    that are semantically equal.

  Assertion (clean state if the race does NOT manifest in this setup):
  - No spurious row. Probe-runner reports `probe-inconclusive` because
    the bug mechanism is structurally present; this run just didn't
    perturb storage enough to make Postgres flip row order.

  When the fix lands (add `ORDER BY ownership.owner_id, ownership.title_id`
  to `getOwnershipsByDataEntityId`, or order in-memory before
  serialization in the handler), this probe's spurious-row assertion
  flips to "no spurious row even under storage churn" — surfacing the
  fix in CI.

