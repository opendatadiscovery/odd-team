behaviour: |-
  **NO RATE-LIMIT + NO AUDIT-LOG ON THE UNAUTHENTICATED WEBHOOK = UNBOUNDED ROW INSERTS AND ZERO FORENSIC RECONSTRUCTION.** Four compounding gaps at the AlertManager webhook entry point: (1) `@Valid` is NOT on `@RequestBody final Mono<AlertManagerRequest>` (AlertManagerController.java:22) — even if the inner DTO carried `@NotNull` / `@Size` annotations they would not fire; (2) there is NO path-level rate-limiter WebFilter; the only throughput constraint is the @ReactiveTransactional boundary on AlertServiceImpl.handleExternalAlerts (which serialises per-batch but doesn't cap cross-batch volume); (3) NO `log.info(...)` at controller entry, NO Micrometer `@Timed` counter, NO per-call correlation-id capture — forensic reconstruction of `who POSTed what when` after a forge incident is NOT possible — only the resulting alert rows persist; (4) the Activity feed events emitted from createAlerts at AlertServiceImpl.java:302-325 are `OPEN_ALERT_RECEIVED` events on the data entity (operational signal of the alert), NOT a request-level audit trail (no record of source-of-POST). Combined with the unauthenticated receiver (TEST-GAP-014), the cross-tenant attribution surface (TEST-GAP-015), and the no-idempotency duplicate-row hazard (TEST-GAP-366) — a misconfigured AlertManager (or a malicious caller) can flood ODD with thousands of duplicate alerts per minute with zero defensive surface and zero forensic trail. NO test pins this absence.
