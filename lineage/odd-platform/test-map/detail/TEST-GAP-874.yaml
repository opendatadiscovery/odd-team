proposed_action: |-
  Add `ReactiveActivityRepositoryImplCursorSubSecondTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/reactive/` using Testcontainers + Postgres. Three test methods:

  1. **`cursorPagination_sustainedWriteRateOneEventPer100ms_pinsVisualOrderShuffleWithinSecondBucket`** (HEADLINE):
     - Arrange: seed 50 activity rows within a single second-bucket (e.g. 2026-01-01T12:00:00.000 through 2026-01-01T12:00:00.999 at 100ms intervals). Each row has a distinct microsecond stamp and a distinct sequential id.
     - Act:
       - Fetch page 1 with `size=10` (no cursor) → record the 10 rows returned, in order
       - Use page 1's last row to construct the cursor `(lastEventId, lastEventDateTime)`
       - Fetch page 2 with the cursor → record the 10 rows returned, in order
       - Compare: are the 20 returned rows globally sorted by full-precision (microsecond DESC, id DESC)? Or are there inversions at the page boundary?
     - Assert: PIN the CURRENT behaviour — likely page-boundary inversions when same-second rows exist. The test asserts the CURRENT truth so future refactors are caught.

  2. **`cursorPagination_acrossSecondBoundary_noSkipNoLoss`** (CONTROL):
     - Arrange: seed rows in 3 distinct seconds: 12:00:00, 12:00:01, 12:00:02 (10 rows per second).
     - Act: paginate across all 30 rows with size=10.
     - Assert: 30 distinct rows returned across 3 pages; no duplicates, no missing rows. Pins the row-completeness (the "no skip" half of the C2 finding).

  3. **`cursorPagination_clientPassesMillisPrecisionDateTime_pinsTruncationCompensation`**:
     - Arrange: seed 1 row at `2026-01-01T12:00:00.123456` (microsecond detail).
     - Act: call cursor with `lastEventDateTime = 2026-01-01T12:00:00.123` (millis precision — typical JSON wire format).
     - Assert: the cursor predicate still correctly filters; PIN the design intent (per implicit_adrs.[1]) that the client may pass a less-precise timestamp.

  After P-021 measures the empirical timing on a production-sized DB, refine the test. Cross-pair with REFACTOR-NNN (document or change the asymmetry) and DOC-NNN (surface cursor mechanics on activity-feed.md).
