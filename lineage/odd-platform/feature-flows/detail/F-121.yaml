feature_id: F-121
feature_name: "Scheduled-Job Executor Architecture — four jobs share one thread silently"
pillar_id: P-08
pillar_anchored_id: P-08:F-015
pillar_anchored_feature_name: "Scheduled-Job Executor Concurrency Contract"
seeded_from: SHB-176
