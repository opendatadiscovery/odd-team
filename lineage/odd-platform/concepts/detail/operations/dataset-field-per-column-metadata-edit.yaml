security_aggregate:
  overall: MEDIUM
  auth_modes_relevant: [LOGIN_FORM, OAUTH2, LDAP, DISABLED]
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      5 of 7 endpoints have SecurityRule + correct permission. 1 endpoint
      (POST /terms) has SecurityRule + WRONG permission (DATA_ENTITY_ADD_TERM
      vs documented DATASET_FIELD_ADD_TERM). 2 read endpoints (GET /enum_values
      and GET /metrics) have NO rule.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Read endpoints platform-wide visible. Mutation endpoints gated by
      parent-DataEntity permission, not field-level.
  strengths:
    - Activity-log emission symmetric across description, internal-name,
      tags, term-link, term-unlink (CORRECTING prior batch-R claim)
    - 404 on missing id at inner-service (CORRECTING prior batch-R claim)
    - Parent-scoped authorization model is sound design
  weaknesses:
    - SecurityConstants.java:297-299 wires /terms POST to DATA_ENTITY_ADD_TERM
      (HIGH — wrong permission)
    - SecurityConstants.java:295-296 alerts-status copy-paste bug — HIGH
    - F-004 verbatim-storage XSS-class at the per-column surface
    - 2 read endpoints have no SecurityRule
  contributing_files:
    - DatasetFieldController.md
    - DatasetFieldController-class.md
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'Every authorized request runs DatasetFieldResourceExtractor 3-table
      join BEFORE the operation — DatasetFieldController.md'
    - 'Description-edit chains 4-5 sequential DB operations —
      DatasetFieldController.md'
    - 'Tags-edit chains 6 sequential DB operations — DatasetFieldController.md'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Per-field user edits — single item per call. No bulk-edit endpoint.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless controller; @ReactiveTransactional service-tier boundaries
      keep transactions short.
  contributing_files:
    - DatasetFieldController.md
    - DatasetFieldController-class.md
