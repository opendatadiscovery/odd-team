# Activity Feed (Audit-Trail Surface) — product-owner reflection

## product_owner_narrative

The Activity Feed is ODD Platform's **audit-trail read surface** — the user-observable history of what changed on the catalog's data entities, exposed to every authenticated user under three personas: an end-user browsing the global Activity page to see recent platform-wide change activity; a data steward opening a specific Data Entity's Activity tab to see the per-entity history; and a security or compliance reviewer auditing "who did what when" against a particular owner, user, or date window (per `system-mission.md:200-220` P-07 pillar block + `documentation/docs/features/active-platform-features/activity-feed` WebFetched 2026-05-21 status 200). The feed records 27 event types across entity lifecycle, ownership, tags & terms, dataset-field edits, custom-metadata edits, custom groups, and alerts (per `ActivityEventTypeDto.java:3-31` enumerated in `odd-platform__java__service__ActivityServiceImpl.md` concepts.entities); the live doc page enumerates 20 by name plus a categorical mention of "7 internal types" (per WebFetch 2026-05-21 — "Tag and Owner filters support multi-select capability; User filter specifically: show events performed by one or more selected users").

A user reaches the Activity Feed via two HTTP entry points (per `odd-platform__java__ActivityController__controller-class__ActivityController.md` understanding): `GET /api/activity` returns a cursor-paginated Flux of activity rows with 12 query parameters (`beginDate`, `endDate`, `size`, `datasourceId`, `namespaceId`, `tagIds`, `ownerIds`, `userIds`, `type`, `eventType`, `lasEventId` [sic — typo on the Java surface], `lastEventDateTime`); `GET /api/activity/counts` returns the four-way aggregate (`totalCount`, `myObjectsCount`, `downstreamCount`, `upstreamCount`) with 8 query parameters (no `size`, no `type`). Both endpoints have NO `@PreAuthorize`, NO entry in `SecurityConstants.SECURITY_RULES`, and fall through to Spring's catch-all `.authenticated()` rule — meaning **every authenticated identity reads the full cross-owner audit trail** by default (per `ActivityController.md` coherence_notes.F-006). The per-entity tab uses a sibling endpoint (`GET /api/dataentities/{id}/activity` on `DataEntityController.getDataEntityActivity` — out-of-scope of this reflection's chain).

The working parts a product owner would describe in a demo are seven filter facets (per the live doc): Calendar / Datasource / Namespace / Event Type / Tag / Owner / User (per WebFetch 2026-05-21 + `ActivityController.md` understanding line 138). Three undocumented public-API parameters extend that surface: `type` (a four-way view-mode dispatch — `ALL` / `MY_OBJECTS` / `UPSTREAM` / `DOWNSTREAM`); cursor pagination via `(lastEventId, lastEventDateTime)`; and a `size` parameter with no upper bound at any layer. The `MY_OBJECTS` view scopes to entities the caller owns (via `OWNERSHIP.OWNER_ID = currentUser.ownerId`, resolved through `AuthIdentityProvider.fetchAssociatedOwner()`); the other three view modes apply NO principal-derived predicate (per `ActivityServiceImpl.md` line 184-217 + `ReactiveActivityRepositoryImpl.md` invariants). Ordering is `ACTIVITY.CREATED_AT DESC, ACTIVITY.ID DESC` (per repository line 291); pagination is cursor-based with a SECOND-truncation on the cursor predicate and microsecond precision on ORDER BY (per repository line 287-291 + `ActivityServiceImpl.md` S-C-2).

The integration story has three cross-pillar legs (per `system-mission.md:200-220` + F-021 frontmatter `cross_pillar_relationships`): the feed **feeds P-01 Data Discovery** as the change-driven discovery surface — every `DESCRIPTION_UPDATED` or `BUSINESS_NAME_UPDATED` event is visible alongside the data entity on its detail page; it **shares schema with P-09 Security** — the actor-resolution LEFT JOIN to `USER_OWNER_MAPPING` ON `OIDC_USERNAME = ACTIVITY.CREATED_BY` (with NO provider qualifier) is the read-side mirror of the `provider-null-cross-mode-bleed` mechanism documented in F-011's batch-R extension; and it **is operationally coupled to P-08 Housekeeping** — `ActivityEmptyPartitionsHousekeepingJob` drops EMPTY past partitions of the activity table, but **non-empty partitions never drop** (per F-021 frontmatter notes + `ActivityEmptyPartitionsHousekeepingJob.md` per-sidecar). The audit-silence-on-RBAC pattern observed across batches F/H/N/P/Q/R on F-006 (RBAC mutations have NO audit log) is rooted in THIS feature's schema decision: `activity.data_entity_id` is `NOT NULL` with FK to `data_entity(id)` (per `V0_0_48__add_activity.sql:4,12` cited across multiple sidecars).

A product owner introducing this feature should highlight three edge cases in a demo: (a) the **"My objects" view shows changes TO entities I own, not changes I performed** — a confusing axis-mismatch for users coming from action-centric audit-log mental models (per `ActivityServiceImpl.md` invariant 4); (b) the **anonymous mutations under `auth.type=DISABLED` write `created_by=null` and surface visually indistinguishable from system events** in the UI — the only on-row discriminator is `is_system_event`, which is `false` for anonymous mutations and `true` for genuine system events, but the front-end exposes only the actor field which is null in both cases (per `ActivityServiceImpl.md` line 49 + V0_0_48 schema + DisabledAuth security config); and (c) the **activity table grows monotonically** — empty partitions drop, non-empty partitions persist forever; an operator running 1M events/day accumulates ~365GB/year of audit data with no row-level TTL or DELETE path (per F-021 frontmatter facet `activity_table_monotonic_growth_no_delete_path`).

## hypotheses

- id: H-001
  hypothesis: |
    When the caller passes `GET /api/activity?user_ids=42` (a user id),
    the response contains only activity rows whose ACTOR (the user who
    performed the change — i.e. the value in `activity.created_by`)
    corresponds to the user id 42.
  derivation: |
    The query parameter is named `userIds` (plural USERS) — strongly
    suggests filtering by user-as-actor; the response includes a
    `created_by` field surfacing the actor's identity (per
    `ActivityController.md` line 138); the pillar mission frames the
    feature as "audit-trail surface" (`system-mission.md:200-220`) which
    implies action-attribution filtering; the live doc says of the
    User filter: "show events performed by one or more selected users
    ... useful for auditing a specific person's platform activity"
    (per WebFetch 2026-05-21 — verbatim).
  seed_source: endpoint-shape + doc-claim + pillar-mission
  validation:
    verdict: contradicted
    actual_behavior: |
      The chain takes the caller-supplied `userIds: List<Long>` and
      binds it to `USER_OWNER_MAPPING.OWNER_ID.in(userIds)` at the SQL
      layer — i.e. it filters by OWNER ID, not by the user's auth
      principal id and not by the actor column `activity.created_by`.
      The actor column IS joined into every read query via
      `leftJoin(USER_OWNER_MAPPING).on(USER_OWNER_MAPPING.OIDC_USERNAME
      .eq(ACTIVITY.CREATED_BY).and(USER_OWNER_MAPPING.DELETED_AT
      .isNull()))` — but it is NEVER filtered. The translation chain
      is: controller `userIds: List<Long>` → service `userIds` (passed
      through unchanged at ActivityServiceImpl.java:107-117 view-mode
      dispatch) → repository `getCommonConditions` line 272-275
      `if (CollectionUtils.isNotEmpty(userIds)) { conditions.add(
      USER_OWNER_MAPPING.OWNER_ID.in(userIds));
      conditions.add(USER_OWNER_MAPPING.DELETED_AT.isNull()); }`.
      Three layers of name fidelity (`userIds` in the controller, the
      service, the repository signature, the OpenAPI spec, AND the doc
      page's User filter label) — and the predicate at the SQL layer
      filters `OWNER_ID`.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: stress_findings.A5 + invariants.[3] + bugs_limitations_corner_cases.[3]
        cite: "ReactiveActivityRepositoryImpl.java:272-275"
        note: "The literal `USER_OWNER_MAPPING.OWNER_ID.in(userIds)` SQL bind"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: invariants.[3]
        cite: "ReactiveActivityRepositoryImpl.java:220-222"
        note: "LEFT JOIN ON `USER_OWNER_MAPPING.OIDC_USERNAME = ACTIVITY.CREATED_BY` — joins actor but never filters on actor column"
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: operations + invariants.[3]
        cite: "ActivityServiceImpl.java:107-117"
        note: "Service passes `userIds` through every view-mode arm unchanged; no remapping, no clamp, no validation"
      - sidecar: odd-platform__java__ActivityController__controller-class__ActivityController.md
        section: understanding + invariants.[3]
        cite: "ActivityController.java:24-41"
        note: "Controller declares parameter `userIds: List<Long>` per OpenAPI spec; no validation, no transformation"
      - sidecar: '(WebFetch live doc)'
        section: User filter section
        cite: "https://docs.opendatadiscovery.org/features/active-platform-features/activity-feed (verified 2026-05-21 status 200)"
        note: 'Doc page User filter labelled "show events performed by one or more selected users ... useful for auditing a specific person''s platform activity" — promises actor-axis filtering'
      - sidecar: '(source read for validation)'
        section: getCommonConditions
        cite: "ReactiveActivityRepositoryImpl.java:272-275"
        note: "Source read for canary validation — single line confirms the bind to OWNER_ID. source_read_for_validation: true (per agent system-prompt Rule 8 exception)"
    operator_visible_failure: |
      Three operator-visible failure modes — the canary triplet:

      (a) A platform USER with NO entry in `user_owner_mapping` (a
          newly-onboarded auth principal who has not been linked to a
          catalog Owner) CANNOT be filtered by their userId. Passing
          `user_ids=<their_user_id>` returns ZERO rows even when they
          have made many platform changes — because their activity rows
          have `created_by=<their_username>` but their userId is not
          present as any `USER_OWNER_MAPPING.OWNER_ID` value, so the
          IN-predicate excludes every row. The auditor concludes "user
          X did nothing"; user X did many things.

      (b) An admin reassigning the user-owner association — moving
          user `alice@corp` from owner-12 to owner-99 — RETROACTIVELY
          REWRITES the apparent attribution of every past activity row
          alice ever generated. Filtering `user_ids=12` after the
          reassignment surfaces ZERO of alice's past actions; filtering
          `user_ids=99` surfaces ALL of them including pre-reassignment
          history. The audit log is current-state-projected, not
          historical — defeats the forensic-of-record purpose for any
          deployment where user-owner mappings change over time
          (organizational reorgs, role rotations, account closures).

      (c) When MULTIPLE users (auth principals) map to the SAME owner
          (e.g. a team-account pattern where `alice`, `bob`, `carol`
          all map to owner-12 for shared-ownership semantics), filtering
          by `user_ids=<alice's user_id>` versus `user_ids=<bob's
          user_id>` versus `user_ids=<carol's user_id>` returns
          IDENTICAL result sets — every row created by any of the
          three. An auditor asking "what did alice do?" cannot
          distinguish her actions from bob's or carol's via the User
          filter. They get the union, not the slice.

      The actor column `activity.created_by` (which DOES carry the
      auth-principal username at write time per ActivityServiceImpl.java:47)
      is JOINED into every read query but never FILTERED. The filter
      mechanism that the parameter name promises (actor-axis) is not
      implemented anywhere in the chain.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    case_law_anchor: "retrospectives/LSN-020 (rev 5 — the case-law that motivated this Layer 4b subagent; this hypothesis IS the canonical demonstration that the methodology change catches what the Stress Protocol could not)"

- id: H-002
  hypothesis: |
    When the caller passes `GET /api/activity?type=MY_OBJECTS`, the
    response contains activity events the caller PERFORMED (i.e. the
    auth principal's own actions across the catalog).
  derivation: |
    The view-mode label `MY_OBJECTS` and the UI tab framing
    ("My objects") — a user reading the tab name expects to see their
    OWN platform activity (the natural mental model: "my activity =
    things I did"). The pillar mission's "audit metadata changes"
    primary action (`system-mission.md:203`) reinforces this
    actor-centric reading.
  seed_source: view-mode + ui-label + pillar-mission
  validation:
    verdict: contradicted
    actual_behavior: |
      `type=MY_OBJECTS` resolves the caller's Owner id via
      `authIdentityProvider.fetchAssociatedOwner().getId()` (per
      ActivityServiceImpl.java:194 invariant.[4]) and threads it as
      `currentOwnerId` into `findMyActivities` which translates to
      `OWNERSHIP.OWNER_ID.in([currentOwnerId])` at line 270 of the
      repository. The filter is along the OBJECT-OWNERSHIP axis
      (entities the caller owns) — NOT the ACTOR axis (activity the
      caller performed). A user who edits a description on an entity
      they do NOT own makes a change that is INVISIBLE in their own
      MY_OBJECTS view. A user with NO ownership attachments who has
      made platform changes sees an EMPTY MY_OBJECTS feed even when
      they have many activity rows under `created_by=<their_username>`.
      Additionally, `fetchAssociatedOwner()` returns Mono.empty() for
      users without a USER_OWNER_MAPPING row → `.switchIfEmpty(
      Flux.empty())` at ActivityServiceImpl.java:198 → silently empty
      feed with no error and no UI hint.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: stress_findings.B2 + bugs_limitations_corner_cases.[3]
        cite: "ReactiveActivityRepositoryImpl.java:91-107 + line 270"
        note: "findMyActivities threads currentOwnerId into OWNERSHIP.OWNER_ID predicate (object axis), not USER_OWNER_MAPPING.OWNER_ID (actor axis)"
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: invariants.[4] + stress_findings.D2
        cite: "ActivityServiceImpl.java:184-199"
        note: "fetchMyActivities → fetchAssociatedOwner → currentOwnerId; .switchIfEmpty(Flux.empty()) silently empty-returns for users without owner mapping"
    operator_visible_failure: |
      Two failure modes:
      (i) A fresh user without an owner-mapping who has been editing
          descriptions / tags / business names sees a COMPLETELY EMPTY
          "My objects" feed — they cannot find their own past actions.
          No error message, no "no owner association" hint. Visually
          identical to "no activity in window".
      (ii) A user WITH an owner-mapping but who edits entities they do
           not own (the common shared-platform pattern) sees only
           activity ON the entities they own — most of which they did
           NOT personally cause; their own actions on other-owned
           entities are absent. The "My" tab is therefore not a
           reliable "my recent work" surface.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-003
  hypothesis: |
    When the caller passes `GET /api/activity?type=ALL` (or omits
    `type`), the response contains activity events across ALL owners
    in the catalog, subject only to the date / event-type / cursor
    filters.
  derivation: |
    The view-mode label `ALL` promises "all" semantics; the absence
    of an authorization annotation on the controller (per
    ActivityController.md invariants.[1] and security block) suggests
    no per-call permission gate; the controller's lack of any
    principal-derived predicate (per coherence_notes.F-006) confirms
    no upstream owner-scoping.
  seed_source: view-mode + endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      `type=null` and `type=ALL` both route to
      `ActivityServiceImpl.fetchAllActivities` (per ActivityServiceImpl.java:107-116
      invariants.[1]); `fetchAllActivities` → repository
      `findAllActivities` (line 73-89) which applies NO current-user
      predicate at the SQL layer — only the caller-supplied filters
      (datasourceId, namespaceId, tagIds, ownerIds, userIds, eventType,
      cursor, date window). The default response is cross-owner —
      every authenticated identity reads every data entity's activity.
      The controller falls through to Spring's catch-all
      `.authenticated()` rule (per ActivityController.md security
      block); under `auth.type=DISABLED` the gate is `.permitAll()`
      and anonymous traffic reads the global feed.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: security + owner_scoping
        cite: "ReactiveActivityRepositoryImpl.java:73-89"
        note: "findAllActivities — no current-user predicate at SQL"
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: operations + invariants.[1]
        cite: "ActivityServiceImpl.java:107-116"
        note: "type=null and type=ALL both route to fetchAllActivities (silent equivalence)"
      - sidecar: odd-platform__java__ActivityController__controller-class__ActivityController.md
        section: security + coherence_notes.F-006
        cite: "ActivityController.java (whole class)"
        note: "No @PreAuthorize, no SecurityConstants entry, no programmatic permission gate"
    severity: N/A
    confidence: HIGH
    routes_to_finding: caveat-candidate
    caveat_note: |
      Cross-owner default is a deliberate (read-collaborative) posture
      — but the live doc says NOTHING about who can see the global
      feed (per ActivityController.md coherence_notes.[3]). The
      authorization page (/configuration-and-deployment/enable-security/
      authorization, status 200) also does not mention per-endpoint
      wiring for /api/activity. The CONFIRMED behaviour is itself a
      caveat-worth-documenting because operators reading the docs
      cannot tell that activity is cross-owner by default.

- id: H-004
  hypothesis: |
    When the caller passes `GET /api/activity?type=UPSTREAM&
    owner_ids=42,99`, the response contains activity events on data
    entities upstream in the lineage graph AND filtered to those whose
    owner is in [42, 99].
  derivation: |
    The HTTP API exposes `ownerIds` as a query parameter on
    `/api/activity` regardless of `type`. A user combining `type` with
    `ownerIds` reasonably expects both filters to compose — there is
    no doc-side warning that any parameter is silently ignored.
  seed_source: endpoint-shape + view-mode
  validation:
    verdict: contradicted
    actual_behavior: |
      The view-mode dispatch at ActivityServiceImpl.java:107-117 routes
      `UPSTREAM`/`DOWNSTREAM` to `fetchDependentActivities(beginDate,
      endDate, size, datasourceId, namespaceId, tagIds, userIds,
      eventType, lastEventId, lastEventDateTime, LineageStreamKind)`
      — the signature accepts NO `ownerIds` parameter; the caller's
      `ownerIds` is SILENTLY DROPPED. Same drop for `type=MY_OBJECTS`
      → `fetchMyActivities(...)`, which also has no `ownerIds`
      parameter. Only the `type=ALL` / `type=null` arm passes
      `ownerIds` through to the repository's `getCommonConditions`
      (line 269-271 `OWNERSHIP.OWNER_ID.in(ownerIds)`). The OpenAPI
      spec exposes `owner_ids` on the endpoint unconditionally; the
      Java service silently ignores it for three of four view modes.
    evidence:
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: stress_findings.S-B-2 + operations
        cite: "ActivityServiceImpl.java:107-116"
        note: "View-mode arms — fetchMyActivities/fetchDependentActivities signatures lack ownerIds parameter"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: stress_findings.A5
        cite: "ReactiveActivityRepositoryImpl.java:266-275"
        note: "ownerIds predicate is in getCommonConditions; only fired when caller actually passes it to the find method"
    operator_visible_failure: |
      An operator asking "show me changes to entities upstream of X
      that Alice's team owns" by setting `type=UPSTREAM&owner_ids=
      [alice_team_owner_id]` gets the WHOLE upstream-lineage activity,
      unfiltered by owner — Alice's team's changes are mixed with
      every other team's changes on every upstream entity. No error,
      no warning, no doc-side caveat. The filter the operator chose
      did NOT take effect. Similar drop for `MY_OBJECTS` + `ownerIds`
      combo (one of the natural intuitions: "show me MY OBJECTS that
      also belong to owners X" — the second filter silently disappears).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-005
  hypothesis: |
    The response `created_by` field on each activity row identifies
    the AUTH PRINCIPAL (the user account, identified by username +
    auth provider) who performed the change — so an auditor can
    distinguish LOGIN_FORM 'alice' from LDAP 'alice' if both exist
    in a multi-auth-mode deployment.
  derivation: |
    The field name `created_by` and the catalog Owner resolution
    surface this as the actor's identity; the doc page promises
    "auditing a specific person's platform activity" — a "person" is
    a single identifiable user, not a username-only string that
    multiple identities share.
  seed_source: response-shape + doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      The write side records `activity.created_by` as the
      auth-principal's USERNAME ONLY (`UserDto::username` mapping at
      ActivityServiceImpl.java:47, 58 — the `provider` field is
      DROPPED before persistence). The read side resolves the actor
      via `LEFT JOIN USER_OWNER_MAPPING ON USER_OWNER_MAPPING.
      OIDC_USERNAME = ACTIVITY.CREATED_BY AND DELETED_AT IS NULL` —
      provider-agnostic (per ReactiveActivityRepositoryImpl.java:
      220-222 + lines 157-158/178-179/199-200/221-222 across four read
      paths). For SINGLE-mode deployments (one of LOGIN_FORM /
      OAUTH2 / LDAP / DISABLED), the field correctly identifies the
      actor. For MULTI-mode deployments (e.g. operator running both
      LDAP and LOGIN_FORM during a migration window), a
      LOGIN_FORM-authenticated 'alice' and an LDAP-authenticated
      'alice' write the SAME `created_by='alice'` value and BOTH
      resolve to the SAME OwnerPojo via the username-only join —
      EVEN IF THEY ARE DIFFERENT PEOPLE. Forensic incident response
      misled. The field is half-true.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveActivityRepositoryImpl.md
        section: implicit_adrs + bugs_limitations_corner_cases.[1] + security
        cite: "ReactiveActivityRepositoryImpl.java:157-158/178-179/199-200/221-222"
        note: "Four PROVIDER-omitted LEFT JOINs — read-side mirror of the cross-mode-bleed mechanism"
      - sidecar: odd-platform__java__service__ActivityServiceImpl.md
        section: invariants.[3]
        cite: "ActivityServiceImpl.java:47, 58"
        note: "Write side drops UserDto.provider — only username persisted"
      - sidecar: '(WebFetch live doc)'
        section: User filter section
        cite: "https://docs.opendatadiscovery.org/features/active-platform-features/activity-feed"
        note: 'Doc promises "auditing a specific person''s platform activity" — implicit single-identity-per-user contract'
    operator_visible_failure: |
      Multi-auth-mode deployments (rare but real during migration windows
      or hybrid setups): a forensic reviewer asking "did LDAP-alice or
      LOGIN_FORM-alice approve this change?" cannot tell from the
      activity feed; both surface as the same OwnerPojo. A bad-faith
      actor who registers as LOGIN_FORM-alice can plausibly-deny
      attribution of past actions actually performed by LDAP-alice
      (or vice versa). Severity is bounded by deployment posture —
      single-mode deployments are unaffected; multi-mode deployments
      have a forensic-integrity gap with no mitigation surfaced in
      the docs.
