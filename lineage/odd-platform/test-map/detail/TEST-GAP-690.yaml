proposed_action: |-
  Add `RoleServiceImplNameGuardCaseSensitivityTest.createUpdateDelete_threeCaseSensitivityPolicies_pinThreeBehavioursForLowercaseAdministratorRole`. (a) Testcontainers test. (b) STEP 1: Create a role named 'administrator' (lowercase) via DIRECT DB INSERT (bypasses the seeded-row DB unique check since case-sensitive). (c) STEP 2: PUT /api/roles/{id of lowercase admin} with new name 'lowercase-admin'. Assert HTTP 200 (case-sensitive update guard does NOT match 'administrator' to 'Administrator'). (d) STEP 3: PUT the role BACK to 'administrator'. Assert HTTP 200. (e) STEP 4: DELETE /api/roles/{id}. Assert HTTP 400 with 'Role is predefined and cannot be deleted' (case-INSENSITIVE delete guard MATCHES 'administrator' to 'Administrator'). (f) Add a `// REGRESSION-PIN — Three case-policies coexist in RoleServiceImpl: create=none, update=case-sensitive, delete=case-insensitive. A REFACTOR normalising to ONE case-policy will break exactly two of the four steps above, surfacing the change as deliberate. The case-asymmetry is a known drift facet (DRIFT-FACET-B); fixing requires explicit choice of which case-policy wins.` comment block.
