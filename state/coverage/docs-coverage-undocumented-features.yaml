  batch_assignments:
    # PRE-ASSIGNED batches enabling PARALLEL /scan execution across separate sessions /
    # parallel agents / overnight loop. Each batch's F-NNN set is disjoint from every
    # other batch's. A /scan invocation reads this block, picks a batch with
    # status: pending, optionally claims it by setting status: in-progress, runs the
    # mode-B pseudo-protocol against that explicit feature list, then sets status: scanned.
    #
    # Parallel-safety contract: each batch produces ITS OWN scanner-feed log + findings
    # file (uniquely named by scan_run_id), AND writes scanner_reviews ONLY to F-NNNs in
    # its own assignment. The coverage-manifest update is a small last-step append; under
    # parallel runs the manifest is last-write-wins on the `scanned_features` list — re-
    # run the manifest's `coverage_pct` recompute after all parallel batches return.
    #
    # Each /scan command can target a specific batch via:
    #   `/scan scanners/docs/coverage/undocumented-features.md batch=batch-N`
    # If no explicit batch is given, the scanner picks the next pending batch by ID.
    #
    # Batches sized 8-13 features. Composition optimised for:
    #   (a) pillar cohesion — each batch groups related features so triage of one
    #       findings file produces a coherent DOC-NNN slice;
