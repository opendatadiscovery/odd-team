behaviour: |-
  **HIGH — `GET /api/tags` (getPopularTagList) does NOT return the most-popular tags for any directory holding more than `size` tags — it returns the OLDEST `size` tags by `TAG.ID ASC` (creation order). The method name, the service method (`listMostPopular`), and the OpenAPI `description` ('Gets the list of existing tags sorted by popularity', `openapi.yaml:345`) all assert popularity ordering the implementation does not deliver. This is the LSN-019 name-vs-behaviour drift, empirically reproduced by the maintainer 2026-05-20 (35 equally-popular tags + size=30 -> the oldest 30 returned, the 5 newest absent).** Method-level primary source from the batch-X-TAGGING `getPopularTagList` controller-method sidecar:

  - `ReactiveTagRepositoryImpl.listMostPopular` (`:137-167`) is the SQL surface. The drift is two-level ordering:
    - INNER row-SELECTION: `paginate(selectFrom(TAG).where(conditions), [new OrderByField(TAG.ID, SortOrder.ASC)], (page-1)*size, size)` (`:148`) — `JooqQueryHelper.paginate` emits `ORDER BY tag.id ASC LIMIT size OFFSET (page-1)*size`. Only the so-selected `size` rows enter `tag_cte` (`:150`).
    - OUTER re-rank: `cteSelect.orderBy(field(COUNT_FIELD).desc())` (`:158`) re-orders ONLY the already-selected rows by summed usage-count desc — it CANNOT reach tags excluded by the inner LIMIT.
  - The UNION-ALL usage-count CTE (`getDataEntityWithDatasetFields`, `:373-392`) computes counts over the CTE rows ONLY — so for `size` < total, the count is computed for the wrong (oldest) candidate pool.
  - `TagServiceImpl.listMostPopular` (`:72-77`) and `TagController.getPopularTagList` (`:36-44`) are straight-through delegations — NO re-sort at the service or controller layer; no upstream layer corrects the drift.

  **The existing test is structurally blind.** `TagRepositoryImplTest.testListMostPopular` (`TagRepositoryImplTest.java:237-267`) cannot detect the drift for two reasons, both verified by reading the test:
  - **The LIMIT never fires below total** — line 257 calls `listMostPopular(testName, List.of(), 1, numberOfTestTags)` where `numberOfTestTags == 8` (the full test directory). With `size == total`, the inner `LIMIT 8` selects all rows; the drift only manifests when `size < total`.
  - **Order is never asserted** — line 264 uses `containsExactlyInAnyOrder(...)`, which ignores ordering entirely. Even with `size < total`, an order-insensitive assertion cannot catch a "wrong rows in wrong order" defect.

  **Operator-visible consequence**: a deployment with more than `size` tags renders OLD-and-unused tags as the Catalog Overview 'Top Tags' chip strip. The UI label is operator-misleading — it is effectively 'Oldest Tags' beyond `size` tags. The drift is in the OpenAPI `description` text itself (`openapi.yaml:345`) — a spec consumer reading the contract is told the result is popularity-sorted.

  **Test gap shape**: a Testcontainers-backed `@SpringBootTest` / `WebTestClient` test promoting probe P-010's arrange/act/assert to CI: seed N tags where N > size, give the YOUNGEST tags HIGHER usage counts than the oldest size, `GET /api/tags?size={size}`, assert (a) the returned tag ids are the size LOWEST ids (the oldest), (b) the actual-most-popular (youngest) tags are ABSENT, (c) `pageInfo.total` correctly reports N (the total IS correct — only WHICH rows are returned drifts). The current state is PINNED — failures land if a future maintainer moves the count-ordering inside the paginate window (the fix), at which point the test inverts to assert the most-popular size are returned.
