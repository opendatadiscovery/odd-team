behaviour: |-
  active=NULL regression-pin on upsertMetadataFieldValue (HIGH — silent state corruption). ReactiveMetadataFieldValueRepositoryImpl.java:97-98 writes `.set(METADATA_FIELD_VALUE.ACTIVE, pojo.getActive())`, but the upsert path's pojo construction at DataEntityServiceImpl.java:292-295 never calls `setActive(...)`. The jOOQ-generated `MetadataFieldValuePojo.getActive()` returns boxed Boolean NULL when unset. The DB column is `boolean DEFAULT TRUE` (V0_0_1__init.sql:180), but DEFAULTs apply on INSERT only — an UPDATE that explicitly sets the column writes NULL, dropping a previously-TRUE row to NULL. This is a silent state-corruption bug — every edit converts an active=TRUE row to active=NULL. The downstream impact depends on whether any platform code filters `WHERE metadata_field_value.active = TRUE` (rather than `IS DISTINCT FROM FALSE`) — edited rows would silently disappear from those queries. Operators editing a custom metadata value via the UI's Overview > Metadata panel may notice the row 'disappearing' from filtered views. The current single happy-path test (DataEntityServiceTest.upsertMetadataFieldValueTest) MOCKS the repository and does NOT exercise the actual SQL — the mock cannot capture the NULL-writing behaviour. A real DB integration test would expose it. Cross-pillar P-01 (Discovery / custom metadata is a P-01 authoring surface; silent state corruption undermines operator trust).
