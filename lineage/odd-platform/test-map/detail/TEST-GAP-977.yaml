behaviour: |-
  **No audit log of GenAI prompts or responses — abuse investigation, PII leak forensics, and compliance reporting are impossible at the platform tier.** The controller has no `@Slf4j` annotation and no log calls (`GenAIController.java:1-24`); `GenAIServiceImpl.java:19`'s `@Slf4j` annotation is present but its `log` instance is unreferenced in the visible 53 lines (no `log.info` / `log.warn` / `log.error` calls). An operator investigating:

  - **Prompt-injection abuse**: which user submitted the malicious system-prompt-overlay attempt that broke the upstream LLM into leaking another tenant's data?
  - **PII exfiltration through prompts**: which user submitted a dataset extract as a prompt body, leaking GDPR-protected data to the external LLM operator?
  - **Spend anomaly**: who burned through the LLM budget last weekend?
  - **Compliance**: who has accessed the LLM service today (SOC 2 access-log requirement)?

  ...has NO platform-side trail. The only audit trail is at the external LLM service (which the platform operator may not control) plus the network layer (which captures URLs not bodies for HTTPS traffic).

  **Distinct from TEST-GAP-039** (which pins prompt-injection / SSRF posture at request-time). This gap pins POST-incident-forensics posture — even if no defense exists, an audit log enables retrospective investigation and credible compliance reporting. Combined with TEST-GAP-976 (no rate limit), the platform offers NEITHER prevention NOR detection of LLM abuse.

  The live GenAI doc page acknowledges this gap implicitly (no logging language in the operator-facing guidance); explicitly surfacing it as a test gap pins the current posture and converts future audit-log instrumentation into a deliberate test update.
