  - "updateOwner.md:security.known_security_gaps.[2] (Empty roles silently destroys all role bindings — severity HIGH)"
behaviour: |-
  **DESTRUCTIVE-DEFAULT: an API consumer omitting `roles` in PUT /api/owners/{id} body SILENTLY STRIPS ALL ROLES.** `OwnerFormData.roles` is OpenAPI-optional (components.yaml:419-422; `requiredMode` not declared); `getRoleIdsList` (OwnerServiceImpl.java:117-122) collapses both null AND empty list to `List.of()`. The update transaction then calls `deleteOwnerRelationsExcept(ownerId, List.of()).then(createRelations(ownerId, List.of()))` — the first half DELETES all current role-links (since no existing link is in the empty-set); the second half INSERTS nothing. An operator updating ONLY the owner name (omitting `roles` to mean 'don't touch') instead REMOVES all role assignments. This is a silent, destructive UX hazard: the form's `roles` is treated as REPLACE-NULL-WITH-EMPTY, not as IGNORE-IF-OMITTED. The UI in practice always sends the current `roles` list (`owners.thunks.ts` per UI source code), so the hazard is masked in normal UI flows — but any API consumer (script, integration, malformed UI request) that omits `roles` will silently strip ALL roles from the Owner. NO confirmation step, NO 'are you sure' check, NO partial-update mechanism. Combined with the no-audit-log gap (TEST-GAP-238 family) and the OWNER_TO_ROLE hard-delete on owner-delete (deleteOwner side), role-stripping is silent AND irreversible from logs.
