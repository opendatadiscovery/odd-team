proposed_action: |-
  Add `AppInfoControllerAuthTypeRoundTripTest` with three regression-pin methods:
  (a) `getAppInfo_authTypeOAUTH2_roundTripsVerbatim_pinsNoNormalisation`: `@TestPropertySource(properties = {"auth.type=OAUTH2"})`; GET `/api/appInfo`; assert body's `authType` equals "OAUTH2" exactly. Pin the no-normalisation contract.
  (b) `getAppInfo_authTypeEmptyString_roundTripsEmpty_pinsAbsentDefault`: configure `auth.type=` (literally empty value); GET `/api/appInfo`; assert response body's `authType` equals "" (empty string). Note: this test may need to bypass Spring's `application.yml` default — set via `@TestPropertySource` after a fresh context. Pin the empty-string round-trip; documents that operators removing the key produce this state.
  (c) `getAppInfo_authTypeTypo_roundTripsTypo_pinsNoEnumValidation`: configure `auth.type=OUATH2` (deliberate typo); GET `/api/appInfo`; assert response body's `authType` equals "OUATH2" exactly (typo round-trips). Pin the absent enum validation; documents that operator typos pass through silently.
  Add `// REGRESSION-PIN — AppInfoController.authType is round-tripped verbatim — empty-string and typos pass through. This pairs with the SPA's Overview.tsx:26 gating logic (appInfo?.authType && appInfo.authType !== DISABLED) where a typo like OUATH2 returns truthy and renders OwnerAssociation in a deployment with no working SecurityWebFilterChain. A future maintainer adding @Pattern or enum validation will flip methods (b) and (c) to assert 4xx; update the assertions accordingly. The current asserts pin the absent-validation reality so a future regression that adds validation is caught.` comment block.
