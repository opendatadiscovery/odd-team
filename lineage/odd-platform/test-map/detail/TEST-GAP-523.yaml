behaviour: |-
  search_facets table unbounded growth regression-pin (LOW — cross-pillar P-01+P-08; storage cost + bearer-token persistence). Every `POST /api/search` creates a row via `searchFacetRepository::create` (`SearchServiceImpl.java:80`); NO TTL eviction, NO row deletion on user logout, NO archive policy. Operators on long-running platforms see the table grow forever. Combined with TEST-GAP-519 (no user binding), the table is an indefinitely-growing pool of bearer-token-shaped session state with full filter history retained as jsonb. The `V0_0_52__introduce_housekeeping.sql` policy list has NO `search_facets` entry (verified by sidecar grep during enrichment) — the TTL TODO at `V0_0_1__init.sql:207` (`find a way to define TTL`) was never implemented. The `last_accessed_at` field is updated on every read (TEST-GAP-521) but never consumed for cleanup. Storage cost grows monotonically; for a platform with 1000 active users each creating 10 search sessions/day, the table grows by 3.65M rows/year — bounded only by disk. Each row's `filters` jsonb can be arbitrarily large (filter selections, facet states). NO test pins the unbounded growth, NO test exercises a configured TTL housekeeping job (because none exists). Cross-pillar P-01 (Discovery session state lifecycle) + P-08 (Management/operational — operators have no visibility into table size; no operator-facing tooling for session cleanup).
