- id: H-008
  hypothesis: |
    When the platform is deployed with the default-shipped auth posture, a caller
    who is not an authenticated administrator cannot create or rebind RBAC policies
    and roles.
  derivation: |
    Pillar-mission — P-09 frames RBAC as the authorization gate; the negative-space
    concern is the as-shipped default posture (the LSN-001/LSN-002 class — what does
    the default deployment expose?). An operator assumes the security feature is
    secure by default.
  seed_source: pillar-mission + negative-space + cross-pillar
  validation:
    verdict: partial
    actual_behavior: |
      The platform ships `auth.type=DISABLED` as the bundled default
      (application.yml). Under DISABLED, DisabledAuthSecurityConfiguration applies
      `anyExchange().permitAll()` — the SECURITY_RULES gate (which wires
      POLICY_CREATE/ROLE_CREATE/OWNER_CREATE) is entirely short-circuited. Any
      network-reachable caller can POST a MANAGEMENT/ALL policy and bind it to a
      role with no credential. IT-009 (auth-mode-boundary.spec.ts) now PROVES the
      authentication-boundary half of this directly: under DISABLED a non-whitelisted
      endpoint (`/api/dataentities/classes`) is anonymously reachable (2xx), while
      LOGIN_FORM rejects the same endpoint (401/302). So the hypothesis is PARTIAL:
      it is TRUE under any enforcing mode (LOGIN_FORM/OAUTH2/LDAP require auth, and
      IT-010 proves LDAP further denies a non-admin the gated mutation), and FALSE
      under the as-shipped DISABLED default (open RBAC write surface). The
      DISABLED openness is a known-by-design dev mode, but the as-shipped default IS
      DISABLED and the live docs do not enumerate the specific RBAC exposure.
      (IT-009 explicitly disclaims testing RBAC writes — it pins the authentication
      boundary, not the specific POST /api/policies escalation under DISABLED.)
    evidence:
      - sidecar: '(test) integration-tests/e2e/specs/auth-mode-boundary.spec.ts'
        section: "IT-009 — DISABLED open vs LOGIN_FORM closed"
        cite: "DisabledAuthSecurityConfiguration.java:16 + LoginFormSecurityConfiguration.java:57"
        note: "VERIFIES the authentication-boundary half: DISABLED endpoint open (2xx), LOGIN_FORM requires auth. Does NOT exercise the RBAC-write escalation specifically."
      - sidecar: '(concepts.yaml — Policy / Role security_aggregate)'
        section: authorization_consistency.detail
        cite: "DisabledAuthSecurityConfiguration.java:13-18 (anyExchange().permitAll())"
        note: "DISABLED short-circuits SECURITY_RULES — POLICY_CREATE/ROLE_CREATE unenforced under the as-shipped default."
    operator_visible_failure: |
      (a) An operator who deploys ODD with the bundled config on a reachable network
          port (the LSN-001/LSN-002 default-trap class) has, without realising it, an
          RBAC surface any unauthenticated caller can fully rewrite — including
          minting a MANAGEMENT/ALL policy + role (full platform control).
      (b) Combined with H-001, the escalation is invisible: no audit, no log, no UI
          authorship.
      (c) The P-09 docs state "enabling one does not protect the other" but do not
          specifically walk the RBAC-surface exposure under DISABLED — an operator
          reading the docs gets the general warning but not the concrete "anyone can
          become admin" consequence for this feature.
    severity: HIGH
    confidence: HIGH
    probe_id: P-199
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor     # anonymous (DISABLED) vs authenticated-admin (enforcing) actor split
    coverage: verified             # IT-009 pins the load-bearing DISABLED-open vs enforcing-closed boundary
    test_ref: "integration-tests/e2e/specs/auth-mode-boundary.spec.ts (IT-009, enforces ADR-0074)"
    test_demand: none              # the enforcing-mode half is verified; the unmet bit is a DOC caveat, not a test gap
    partial_note: |
      Re-verdicted contradicted->partial this refresh BECAUSE IT-009 now verifies the
      enforcing-mode boundary (the hypothesis IS true under LOGIN_FORM/OAUTH2/LDAP)
      and IT-010 verifies LDAP further denies the gated mutation. The FALSE half is
