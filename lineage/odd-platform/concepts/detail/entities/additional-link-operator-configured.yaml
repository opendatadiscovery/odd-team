notes: |-
  Operator-configured external links are a STATIC catalogue, not a
  runtime-mutable feature; the absence of any persistence layer or
  admin UI is the explicit decision (implicit_adrs[0]). For
  per-data-entity links (the DATA_ENTITY_ATTACHMENT_MANAGE surface),
  see `attachment` and related concepts.

  **STRENGTHENED batch ZK** — AdditionalLinkProperties config-properties-class
  sidecar (rev file-analyser/0.5.0) adds the BINDING-OWNER angle alongside
  the prior LinksController CONSUMER angle. Three NEW findings (class-name-vs-prefix
  drift; @ConfigurationProperties("odd") namespace overclaim → Partial-home
  pattern; null-vs-empty-list distinction at record layer) join the existing
  rel-noopener + URL-scheme findings.

  Cross-cutting connections (batch ZK):
    - The namespace-overclaim observation feeds the existing
      `partial-home-configurationproperties-pattern` invariant (3rd
      sidecar instance — joins DataCollaborationProperties +
      EmailSenderProperties).
    - The no-JSR-303-validation observation feeds the existing
      `additional-links-no-rel-noopener-and-no-url-validation` invariant
      from the BACKEND angle (the prior anchors were LinksController +
      AppInfoMenu UI rendering).
