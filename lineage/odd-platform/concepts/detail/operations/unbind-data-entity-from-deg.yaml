security_aggregate:
  overall: HIGH
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      Child-side gate IS wired correctly (SecurityRule path matches
      OpenAPI surface; permission is DATA_ENTITY-scoped). DEG-side
      gate is absent. Cross-DEG unlinks permitted by design.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      Owner-scope is the CHILD entity, not the parent DEG. Domain
      owners cannot defend their DEG from drive-by membership removals
      by any DATA_ENTITY_DELETE_FROM_GROUP-holder on the child.
  weaknesses:
    - HIGH — write-collaborative DEG (no DEG-side gate; symmetric with ADD)
    - MEDIUM — forensic silence (no @ActivityLog despite enum exists)
    - MEDIUM — silent-204 on no-op (cannot distinguish unlink from no-op)
    - |-
      MEDIUM — HARD-DELETE finality + audit-feed absence = compliance gap
      for entities tracking organizational moves
    - HIGH under DISABLED — anonymous Domain corruption
  strengths:
    - |-
      Independent permission from ADD — separable Policy capabilities
      (DATA_ENTITY_ADD_TO_GROUP + DATA_ENTITY_DELETE_FROM_GROUP)
    - |-
      Conditional filled-flag transition (only flips when residual
      manual DEGs == 0) — preserves the aggregate-flag semantic
    - |-
      HARD-DELETE on user action / SOFT-DELETE on cascade split is
      INTENTIONAL — pairs with the existing soft-delete invariant
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      4-5 DB round-trips per call (2× GET + 1× DELETE + 1× residual
      SELECT + conditional UPDATE). Cost is constant per call; no
      bulk endpoint.
  weaknesses:
    - |-
      LOW — getManuallyCreatedRelations materialises ALL manual DEG
      memberships for the entity to check emptiness (full collectList +
      isEmpty); a countManuallyCreatedRelations or exists* would be
      O(1) at the SQL level. Acceptable for typical entity-DEG count
      (<10) but hidden O(N) on extreme cases.
    - LOW — no method-level observability
notes: |-
  NEW operation captured in batch 2026-05-19L. Pairs with the symmetric
  bind-data-entity-as-DEG-child-member operation; together they form
  the per-entity DEG-membership CRUD surface. Independent permission
  from the ADD op enables stewardship Policies that grant only one
  direction.

  Cross-cutting connections:
    - Related entity: data-entity-group-membership-edge (NEW)
    - Related invariants:
      - write-collaborative-deg-no-deg-side-authorization (NEW HIGH)
      - add-delete-permission-asymmetry-on-deg-membership (NEW)
