- id: H-008
  hypothesis: "When the catalog has a very large number of dataset fields, opening the Linked Columns tab for a term with few links is still fast (the query reads roughly the linked rows, not the whole field population)."
  derivation: "Negative-space / performance — a reverse-lookup on a term with 3 links should not scan the entire `dataset_field` table; a product owner of a catalog-scale system asks about the cost ceiling. Pillar = catalog-wide governance surface."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The query materialises the FULL `dataset_field` table before narrowing to the
      term. `ReactiveDatasetFieldRepositoryImpl.listByTerm` builds the CTE `records` as
      `select(DATASET_FIELD.fields()).from(DATASET_FIELD).where(conditions)` where
      `conditions` is EITHER empty OR just the optional name filter (lines 144-154) — it
      has NO termId predicate — and the CTE is `asMaterialized` (line 192). The term
      filter is applied only in the OUTER query after the join (line 196). So Postgres
      materialises every dataset field in the catalog (modulo the name filter) before
      the join+filter reduces to the term's links. Whether the planner pushes the
      `dataset_field_to_term` join down to avoid the full materialise — and the real
      p95 latency for a catalog with, say, 500K fields and a term with 5 links — cannot
      be determined by reading; it must be measured.
    evidence:
      - sidecar: "(source read)"
        section: listByTerm
        cite: "ReactiveDatasetFieldRepositoryImpl.java:151-156,191-196"
        note: "CTE over all DATASET_FIELD, asMaterialized, termId filtered only in outer query"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveTermRepositoryImpl.md
        section: docs_link_semantic.doc_drift_findings
        cite: "REPOSITORY-DOC-GAP-C"
        note: "sibling getTermDetailsDto has an analogous undocumented fan-out cost ceiling"
    operator_visible_failure: |
      If the materialise is not optimised away, every open of the Linked Columns tab
      issues a full-table read of `dataset_field` (the largest table in a mature
      catalog), gated only by the 50-row outer limit. On a large deployment this is a
      slow tab open and a load multiplier (every steward opening any term's columns tab
      hits it). The 50-cap masks the result SIZE but not the SCAN COST. Probe required
      to confirm whether this is a real hot path or planner-elided.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-153-1
    routes_to_finding: bug-candidate
    source_read_for_validation: true
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-153-1"

