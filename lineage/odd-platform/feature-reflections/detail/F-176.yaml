      the inner Add-metadata WithPermissions). Predefined items have no separate
      visibility/edit control. The canonical doc acknowledges they are "in one
      combined list" (entity-detail-page.md:25) — but the on-screen panel gives
      no distinct visual cue (no origin badge/section split) that a given item
      came from a collector vs an operator; the MetadataItem treats both
      uniformly. So the data IS present from both sources (the "see both"
      sub-promise holds), but the "distinguish which is which" sub-promise does
      NOT hold at the UI layer.
    evidence:
      - sidecar: "(Rule-8 confirmation read)"
        section: OverviewMetadata two selectors
        cite: "OverviewMetadata.tsx:26-29,59"
        note: "predefined + custom both read, rendered in one list; source_read_for_validation: true"
      - sidecar: "(doc cross-ref)"
        section: entity-detail-page.md panel table
        cite: "documentation/docs/data-discovery/entity-detail-page.md:25"
        note: "doc names 'one combined list' but not the audience/edit asymmetry"
    operator_visible_failure: |-
      (1) An operator editing metadata cannot tell at a glance which fields are
      operator-owned (safe to edit) versus collector-ingested (will be
      overwritten on next ingestion) — they share one undifferentiated list.
      (2) Combined with F-013's write-side INTERNAL-vs-EXTERNAL collapse, an
      operator can edit a predefined-looking field and have it silently
      overwritten by the next collector run, with no UI warning that the field's
      origin made it volatile.
    severity: LOW
    confidence: MEDIUM
    confidence_reason: |-
      The "no distinct visual cue" claim rests on the absence of an origin
      marker in the composer + OverviewMetadata header read; MetadataItem itself
      (a child) was not read in full, so a subtle per-item origin indicator
      cannot be fully excluded from static reading — hence MEDIUM, not HIGH.
    routes_to_finding: caveat-candidate
    source_read_for_validation: true
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-009
  hypothesis: |-
    When a user opens the Overview tab exactly once, the "View count" value
    shown on the General panel reflects the true number of times the entity has
    been viewed.
  derivation: |-
    OverviewGeneral renders dataEntityDetails.viewCount raw as a labeled field
    (OverviewGeneral.tsx:74-76). A user reading "View count: N" reasonably
    expects N to be the real visit count. Response-shape seed; intersects F-001.
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      OverviewGeneral.tsx:74-76 renders `dataEntityDetails.viewCount` verbatim in
      a LabeledInfoItem. The value comes from the parent DataEntityDetails fetch
      (F-001 hop-1), which fires TWICE per page-open due to the LSN-017
      `details.status?.status` dep-array re-fire (DataEntityDetails.tsx:56-64),
      each firing a bare `view_count + 1` UPDATE — so a single page-open
      registers +2 (empirically pinned by probe P-004, xhr_count=2 + DB delta=2;
      tracked as PLT-104). The number the operator reads on THIS panel is the
      same inflated count that drives the Popular ranking. The user-visible
      consequence on the Overview tab is direct: open the page once, the displayed
      View count jumps by 2.
    evidence:
      - sidecar: "(Rule-8 confirmation read)"
        section: OverviewGeneral viewCount field
        cite: "OverviewGeneral.tsx:74-76"
        note: "renders dataEntityDetails.viewCount raw; source_read_for_validation: true"
      - sidecar: odd-platform__ts__react-component__component__DataEntityDetails.md
        section: understanding / LSN-017 anchor
        cite: "DataEntityDetails.tsx:56-64"
        note: "the response-derived dep-array double-fetch; canonical LSN-017 source; P-004 pins delta=2"
    operator_visible_failure: |-
      (1) The View count an operator reads on the General panel is roughly double
      the real visit count; an operator using it to judge "is this entity
      actually used?" is misled by ~2x. (2) Because the same count drives the
      Popular ranking (F-001), an entity a user merely clicks into repeatedly
      climbs the home-page Popular strip at double rate — and the Overview tab is
      precisely where the operator would go to verify the number, only to be
      shown the inflated figure as fact. (3) The count is trivially inflatable
      (no rate-limit/auth/idempotency per PLT-104), and this panel is the surface
      that makes the inflated result legible to every viewer.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    source_read_for_validation: true
    use_case_kind: render
    coverage: unverified
    test_demand: functional
    test_demand_note: |-
      IT-002 (e2e:specs/view-count-overview.spec.ts) is the user-flow test for
      exactly this — it opens /dataentities/2001/overview once and asserts
      view_count==1; it is RED today (asserts the bug: +2), pinning PLT-104. So
      the promise is GUARDED by a characterization test, but the guard is RED
      (the promise is broken). The functional demand here is the regression test
      that goes GREEN when PLT-104 is fixed — i.e. IT-002 IS the demand, awaiting
      the fix.

