proposed_action: |-
  Add `DataQualityController404OnEmptyTestListTest` with three regression-pin methods covering the asymmetry across the four read endpoints:
  (a) `getDataEntityDataQATests_datasetExistsWithZeroTests_returns404_pinsCurrentApiShape`: seed a dataset D with zero DQ tests; WebTestClient GET `/api/datasets/{D}/dataqatests`; assert response status 404 (NOT 200 with empty list). Pins the asymmetric 404-on-empty.
  (b) `getDatasetTestReport_datasetExistsWithZeroTests_returns200WithZeroCounts_pinsConsistentSiblingShape`: same fixture; GET `/api/datasets/{D}/test_report`; assert response status 200 + body has all counters at 0. Pins the sibling-endpoint behavior so the inconsistency is visible.
  (c) `getDataEntityDataQATests_datasetDoesNotExist_returns404WithDistinctMessage_pinsTheOtherKindOf404`: GET `/api/datasets/999999/dataqatests` (no such dataset); assert response 404 + error body contains the substring "Dataset" (the dataset-not-found message), distinguishing it from the test-list-empty 404 ("Data quality tests"). Pin the dual-404 surface so a client doing string-based message parsing can tell them apart.
  Add `// REGRESSION-PIN — DataQualityController has an asymmetric API shape on empty-tests: getDataEntityDataQATests 404s, getDatasetTestReport returns 200-with-zero, getSLA returns 200-with-YELLOW. The 404-on-empty is unusual; the maintainer may want to harmonise across the four read endpoints (recommended: 200-with-empty for all four). This test pins the CURRENT asymmetry; when the maintainer ships the harmonisation, methods (a) and (b)/(c) will need updating in lockstep with the chosen direction.` comment block.
