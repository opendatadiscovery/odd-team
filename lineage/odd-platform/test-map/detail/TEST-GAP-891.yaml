behaviour: |-
  **HIGH — renaming a tag via `PUT /api/tags/{tag_id}` (updateTag) propagates the new name into the full-text search vectors of every data entity, dataset, and term carrying it — a tag rename SILENTLY CHANGES which entities surface for a full-text search of the tag name. The propagation runs THREE concurrent FTS-vector refreshes inside the transaction (`updateSearchVectors` triple-`Mono.zip`). Nothing pins this: a refactor dropping the `flatMap(this::updateSearchVectors)` would compile, pass every existing test, and leave the search index stale after every rename. Additionally, whether the FTS upsert OVERWRITES or APPENDS the old name's token is statically unresolved (probe P-025) — if it appends, a search for the OLD name still surfaces the entities after a rename.** Method-level primary source from the batch-X-TAGGING `updateTag` controller-method sidecar:

  - `TagServiceImpl.update` (`:44-55`, `@ReactiveTransactional`): after persisting the renamed `tag` row, `flatMap(this::updateSearchVectors)` (`:53`).
  - `updateSearchVectors` (`:161-167`): a `Mono.zip` of THREE concurrent calls — `reactiveSearchEntrypointRepository.updateChangedTagVectors` (entity `tag_vector`), `.updateChangedTagStructureVector` (dataset-structure vector), `reactiveTermSearchEntrypointRepository.updateChangedTagVectors` (term-search vector).
  - `updateChangedTagVectors` (`ReactiveSearchEntrypointRepositoryImpl.java:319-341`): joins `TAG -> TAG_TO_DATA_ENTITY -> DATA_ENTITY` (filtered `DATA_ENTITY.HOLLOW.isFalse()`) and `buildVectorUpsert(..., true)` upserts `SEARCH_ENTRYPOINT.TAG_VECTOR` per carrying entity.
  - The `true` flag's meaning (overwrite vs append) is NOT resolvable within the sidecar's 1-hop budget — probe P-025 emitted.
  - This `update` path refreshes 3 vectors; the sibling `delete` path refreshes only 1 (the asymmetry is a delete-side gap, not an updateTag gap — see TEST-GAP-762 family).

  **Two distinct sub-behaviours, both unpinned:**
  - **Propagation correctness** — after a rename, a full-text search of the NEW name returns the carrying entities. A regression dropping `flatMap(this::updateSearchVectors)` would leave the search index stale — silent, CI-green.
  - **Triple-refresh completeness + overwrite semantics** — all three `updateChangedTag*Vectors` calls must fire (a regression collapsing the `Mono.zip` to a single call silently breaks the term-search OR structure-vector FTS index); AND the upsert must OVERWRITE the old name (if `buildVectorUpsert`'s `true` flag means append, a search for the OLD name still surfaces the entity — P-025 assertion H2).

  **Why HIGH**: a tag rename silently changing search results is a discovery-surface correctness contract; the propagation is the highest-leverage gap on the node (per the sidecar's gaps paragraph). The overwrite-vs-append uncertainty is load-bearing for the "rename leaves no stale token" claim.

  **Test gap shape**: a Testcontainers-backed `@SpringBootTest` test promoting probe P-025: seed a tag attached to a data entity, a dataset field, and a term; `PUT /api/tags/{id}` renaming it; assert (a) a full-text search of the NEW name returns all three carrying entities; (b) a full-text search of the OLD name returns NONE of them (overwrite, not append); (c) all three vector tables (`search_entrypoint.tag_vector`, the dataset-structure vector, `term_search_entrypoint.tag_vector`) reflect the new name. The current state is PINNED — a dropped `updateSearchVectors` or a collapsed `Mono.zip` fails the test.
