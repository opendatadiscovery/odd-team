  - "DOC-NNN candidate: S2S 'ADMIN' username collision risk silent in docs"
proposed_action: |-
  Testcontainers integration test. (1) Configure both S2S auth (`auth.s2s.enabled=true`) AND LOGIN_FORM. (2) Seed one `owner` row and one `user_owner_mapping`: (oidc_username='ADMIN', provider=null, owner_id=admin-owner.id). (3) Issue an S2S request with X-API-Key. (4) Assert fetchAssociatedOwner() returns admin-owner. (5) Repeat with `oidc_username='admin'` (lowercase) — assert fetchAssociatedOwner() does NOT return admin-owner (case-sensitive). (6) Repeat with `oidc_username='ADMIN'` and provider='LOGIN_FORM' — assert NOT returned (provider mismatch). The test EXPOSES the case-sensitive collision; the fix requires changing S2S to a reserved username (e.g. 's2s-system' with a non-colliding distinguishing prefix) and the test must update.
