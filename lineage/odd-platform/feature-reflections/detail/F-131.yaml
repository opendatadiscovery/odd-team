      submit button is type='submit' bound to the form; once clicked while valid it fires the
      POST/PUT. BUT the button is NOT disabled during the in-flight request by its own `disabled`
      prop (that prop tracks only `formState.isValid`, not `isCreating`/`isUpdating`); the
      DialogWrapper receives `isLoading={isCreating|isUpdating}` (line 138) but whether that
      blocks a second submit depends on DialogWrapper internals, which are NOT enriched (sidecar
      unresolved). The per-click cardinality is confirmed; the double-click-during-flight guard
