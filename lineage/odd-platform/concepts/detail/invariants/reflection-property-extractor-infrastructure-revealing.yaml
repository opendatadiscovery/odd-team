mitigations_unimplemented:
- |-
  Per-property allow-list (SAFEST). Add `@VisibleInDirectory` annotation alongside
  `@PathField` in oddrn-generator's OddrnPath subclasses; reflection extractor
  walks only @VisibleInDirectory-annotated fields. Requires aligned oddrn-generator
  release. Doc-side note: surface 'which fields are visible in the Directory'
  per data-source type on the documentation/docs/data-discovery/directory.md page.
- |-
  Per-deployment configuration knob (LEAST DISRUPTIVE). Add
  `odd.directory.expose-oddrn-properties=full|redacted|none` to application.yml
  with default `full` (preserves current behaviour). Operators with hostname-
  sensitivity policies set `redacted` to strip host/database/port/account from
  the response; the alternative `none` returns ODDRN-property maps but with all
  values masked. No oddrn-generator change needed. Doc-side: document the knob
  under documentation/docs/configuration-and-deployment/.
- |-
  Per-user authorization gate (REQUIRES POLICY DECISION). Add a new permission
  DATASOURCE_INFRASTRUCTURE_READ; gate the reflection extractor on it. Requires
  re-evaluating the read-collaborative posture for the Directory specifically —
  cross-link ADR-CANDIDATE-003. Most disruptive option; appropriate ONLY if the
  maintainer decides infrastructure metadata should be owner-scoped or admin-only.
- |-
  At minimum, doc-side disclosure — the live data-discovery/directory.md doc
  page does NOT mention that Directory exposes per-source ODDRN properties.
  Operators reading the page assume Directory is metadata-only; they are NOT
  warned about the infrastructure leak. Add a 'Visibility and Disclosure' section
  to the directory.md page disclosing the ODDRN-property emission.
notes: |-
  This invariant is the FIRST in the catalog to surface the reflection-based
  property extractor as a distinct security observation. The extractor is
  PRE-EXISTING in DirectoryServiceImpl (since at least batch B per the v0.1.0
  controller-axis sidecar), but no concept-catalog entry framed it as an
  infrastructure-revealing surface. Batch T's controller-class sidecar provides
  the framing.

  Cross-references:
    - Companion entity: `directory`
    - Cross-cutting posture: `read-collaborative-cross-owner-enumeration`
    - DISABLED-mode amplifier: `ui-vs-api-asymmetry-under-disabled-...` (REFACTOR-185)
