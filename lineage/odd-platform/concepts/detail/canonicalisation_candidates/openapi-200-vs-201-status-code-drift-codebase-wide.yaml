proposed_canonical: OpenAPI 200-vs-201 status-code drift (codebase-wide)
rationale: 'NEW cross-cutting hygiene invariant from batch 2026-05-12F — now 2-sidecar
  primary-source triangulated (batch E createOwner + batch F postDataEntityList).
  Spec declares 201 Created; controller returns 200 OK; tests lock in 200. Drift has
  shipped — fix requires coordinating spec vs implementation vs tests. Codebase-wide
  audit candidate: every controller-method that implements an OpenAPI-generated `*Api`
  interface. Likely 6-10 endpoints affected. Surfaces via `/developer-guides/api-reference/*`
  for SDK consumers.'
contributing_concepts:
- OwnerController.createOwner (batch E)
- IngestionController.postDataEntityList (batch F)
- RoleController.createRole + PolicyController.createPolicy (batch E — same pattern)
suggested_add_to_docs: false
