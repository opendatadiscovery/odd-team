name: Search Session
canonical_in_docs: false
canonical_candidate: true
description: |-
  Server-side persistent state representing one user current catalog-search
  context. POST /api/search does NOT return entity rows directly — it
  creates a search_facets row keyed by a server-generated UUID, returns
  aggregated facet counts + the UUID, and requires the caller to call
  GET /api/search/{search_id}/results for paginated rows. The same UUID is
  used by getSearchFacetList, updateSearchFacets, getFiltersForFacet, and
  highlightDataEntity — every search interaction is bound to a persistent
  session row. **STRENGTHENED batch 2026-05-19M (facets sidecar)** —
  schema-level finding: V0_0_1__init.sql:204-211 defines the table with NO
  owner_id / created_by / user_id column; the UUID is the sole identifier;
  the session is bearer-token-shaped at the schema layer. The TODO markers
  acknowledge UUID generation and TTL gaps without addressing ownership.

  Trade-off: server retains query state across multi-step UI interactions
  (facet drill-down, pagination, highlighting) at the cost of an unbounded
  search_facets table requiring housekeeping (SearchFacetsHousekeepingJob +
  housekeeping.ttl.search_facets_days, default 30 days). Sibling features
  (/api/terms/search, /api/queryexample/search, /api/referencedata/search)
  replicate the same UUID pattern. NOT named in main-concepts.md.

  ## STRENGTHENED batch ZE (2026-05-25) — class-level controller surface

  Batch ZE adds the SearchController class-level sidecar — the full
  7-endpoint surface that operates on the session UUID is now pinned:
  search / getSearchFacetList / updateSearchFacets / getSearchResults /
  getFiltersForFacet / getSearchSuggestions / highlightDataEntity.
  Cross-link: invariant:get-highlighted-result-formatted-sql-injection
  is the TRUE SQL-injection vector compounding the bearer-token reach
  on the highlight path; invariant:has-next-true-contract-bug-pagination-loop
  is the Category B drift on getSearchResults that produces
  pagination-loop for third-party API consumers.
