mitigations_unimplemented:
  - |-
    Decide the token lifecycle on data-source delete. Either:
    (a) hard-delete the `token` row inside DataSourceServiceImpl.delete's
        @ReactiveTransactional boundary (the token is 1:1 with the
        data source, has no other referent, so a hard delete is
        safe) — closes the stale-secret-at-rest AND the unbounded-growth
        leak; or
    (b) add a `deleted_at` column to the `token` table and soft-delete
        it alongside the data source (consistent with the platform's
        soft-delete convention).
    Option (a) is simpler and matches the token's 1:1 lifecycle.
  - |-
    Clear the FTS search_entrypoint vector on delete — add a
    searchEntrypointRepository call to DataSourceServiceImpl.delete
    mirroring the update path's updateSearchVectors (lines 127-136),
    so a soft-deleted data source cannot surface in catalog search.
    First verify via probe P-048 whether the search query already
    filters deleted_at — if it does, the FTS leak is moot.
  - |-
    Add the integration test (criticality HIGH, currently absent):
    register a data source, attach a live data_entity, assert
    DELETE → 400; soft-delete the entity, assert DELETE → 204; then
    assert (a) data_source.deleted_at is set, (b) the token row is
    orphaned (still present — pins the current bug), (c) the
    search_entrypoint vector is cleared/uncleared per the chosen fix.
  - |-
    Add an orphan-token housekeeping job — same shape as the
    dataset_field orphan-cleanup proposal — removing `token` rows
    where `id NOT IN (SELECT token_id FROM data_source) AND id NOT IN
    (SELECT token_id FROM collector)`. Bounds the growth if the
    inline hard-delete is not adopted.
notes: |-
  This invariant captures the cleanup-INCOMPLETENESS of the DataSource
  delete. The `three-soft-delete-mechanisms` invariant tells a
  maintainer that `data_source` uses `deleted_at`; it does NOT tell
  them that the delete leaves an orphan plaintext token and a stale
  FTS vector. A maintainer reading the soft-delete catalogue would
  conclude "delete is handled"; the method-level trace shows the
  delete handles ONLY the `data_source` row.

  The load-bearing observation: a "soft-delete" that the operator
  expects to "remove the data source and its footprint" actually
  removes only one row's `deleted_at` flag and leaves three classes
  of residue — an orphan credential, a stale search vector, and
  FK-dangling historical children. The orphan-credential is the
  security-relevant one; it is also an exact repeat of the Collector
  delete pattern, which means a single fix shape applies to both
  token-bearing entities.

  Cross-cutting connections:
    - Pairs with three-soft-delete-mechanisms-across-the-repository-layer
      (the soft-delete-mechanism catalogue; THIS adds the
      incomplete-cleanup fact for data_source)
    - Pairs with collector-plaintext-token-at-rest-end-to-end-sql-to-dom-chain
      (the orphan-token-on-delete pattern is identical for Collector)
    - Pairs with operation delete-data-source-ui-admin-guarded-soft-delete
      (the operation carrying this invariant)
    - Pairs with audit-log-presence-asymmetry-2-tier-audit-story
      (the delete also emits no Activity Event — recorded under the
      audit invariant, cross-linked here)

  Two DOC-NNN candidates: (a) document on /features/management that
  deleting a data source is a soft-delete that leaves the ingested
  data entities and the token in the database; (b) document the
  orphan-token cleanup expectation once the maintainer picks a fix.
