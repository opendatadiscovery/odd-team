evidence:
- |-
  ActivityServiceImpl.md:concepts.invariants.[5] — verbatim: "There
  is NO replay-safety / idempotency mechanism on the write path.
  activityRepository.saveReturning(pojo) performs an unconditional
  INSERT ... there is no ON CONFLICT clause, no idempotency key, no
  dedup. If a caller retries the SAME mutation (e.g. user double-clicks
  the description-update button, or a retry-policy fires), TWO
  activity rows are created with sequential id values and
  indistinguishable payloads. The aspect's .filter(newState ->
  !info.getOldState().equals(newState)) at ActivityAspect.java:86
  catches the no-op case (the second click finds the state already
  updated → no emit), but a TRUE concurrent double-mutation (two
  different oldStates resolving to the same newState in opposite
  orders) emits one row per resolution path."
- |-
  ActivityServiceImpl.md:stress_findings.S-B-4 — verbatim:
  "createActivityEvent name vs createActivityEvents name promise —
  neither method has retry, idempotency, or replay-safety. saveReturning
  is an unconditional INSERT (per repository sidecar line 52-53);
  save is an unconditional batched INSERT. A caller-side retry
  produces TWO rows. Operator-visible drift: any caller that retries
  (Spring Retry, RestTemplate retry, user double-click) creates
  duplicate audit entries. Severity: MEDIUM. Confidence: STATIC-
  INFERRED HIGH."
- |-
  ActivityServiceImpl.md:stress_findings.S-E-2 — verbatim: "If the
  same ActivityCreateEvent is submitted twice (caller retry, user
  double-click, scheduler re-fire), how many rows are written?
  Resolution: TRACE-answer (STATIC-INFERRED) — TWO rows, with
  sequential id values and indistinguishable payloads. The aspect
  path provides PARTIAL protection ... For TRUE concurrent retries
  (two requests arriving before either has committed) BOTH succeed
  at the activity-write level (no ON CONFLICT, no advisory lock).
  Severity: MEDIUM."
