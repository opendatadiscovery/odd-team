behaviour: |-
  DEG add/delete @ActivityLog regression-pin (HIGH — forensic silence pattern). Both `addDataEntityToDEG` (DataEntityServiceImpl.java:387-408) and `deleteDataEntityFromDEG` (lines 411-438) carry NO `@ActivityLog` annotation, despite (a) the matching enum value `ActivityEventTypeDto.DATA_ENTITY_RELATION_UPDATED` existing at ActivityEventTypeDto.java:12, (b) every other write surface on this controller emitting activity (`upsertTags` line 358 TAG_ASSIGNMENT_UPDATED, `upsertBusinessName` line 239 BUSINESS_NAME_UPDATED, `updateStatus` line 198 DATA_ENTITY_STATUS_UPDATED, `addDataEntityTerm` line 153 via TermService TERM_ASSIGNMENT_UPDATED). An operator auditing 'who placed entity X into the Finance Domain on date Z' through `ActivityController.getActivity` sees NOTHING — the activity feed is the documented audit surface for entity changes, and DEG membership (a meaningful organizational change) is silently omitted. The unused enum value confirms the wiring was planned: grep DATA_ENTITY_RELATION_UPDATED against odd-platform-api/src/main/java returns ONLY the enum declaration line. Pair with batch-K's `OwnershipServiceImpl.propagateOwnership` cascade audit-absent finding and F-006 RBAC forensic-silence — three cross-batch surfaces (RBAC, ownership cascade, DEG membership) collectively form a 'metadata-mutation forensic-silence cluster'. Cross-pillar P-01 (DEG is a P-01 sub-feature) + P-07 (Activity Feed is the P-07 audit surface; the feature consumer is broken). Regression risk: BOTH directions — (1) a future maintainer adding @ActivityLog with the wrong event type would silently emit events that look like 'real changes' to historic data, breaking the audit timeline; (2) a refactor removing the enum value as 'dead code' would erase the intent signal.
