      single field carrying disabled semantics — and the OpenAPI
      DataSourceUpdateFormData has no oddrn property (components.yaml:1317-1325), so
      the PUT path cannot carry a changed ODDRN even if the UI allowed it. The UI
      and the contract agree the identity string is set once. This is correct
