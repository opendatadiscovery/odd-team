- id: H-005
  hypothesis: "When a custom-collector author sets namespace_name in the POST /ingestion/datasources payload, the registered datasource appears under that namespace."
  derivation: "Endpoint shape — the Ingestion API contract's DataSource model carries a namespace field, implying the caller controls the datasource's namespace."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The payload's namespace_name is NEVER read on this path. mapDataSources (DataSourceIngestionServiceImpl.java:99-111, line 106) stamps namespace_id from CollectorDto.namespace() — the Collector's PRE-CONFIGURED namespace — via MappingUtils.extractFieldFromNullableObject. The datasource always inherits the Collector's namespace; a Collector with no configured namespace produces datasources with namespace_id=null. This is the collector-scoped-tenancy invariant (ADR-CANDIDATE-143) and it is a SOUND security property — a stolen Collector A token cannot register datasources into Collector B's namespace. But it is operator-invisible.
    evidence:
      - sidecar: odd-platform__java__service__service__DataSourceIngestionServiceImpl.md
        section: "concepts.invariants (Namespace inheritance) + coherence_check ADR-CANDIDATE-143"
        cite: "DataSourceIngestionServiceImpl.java:106"
        note: "namespace_id sourced unconditionally from the matched Collector; payload namespace_name silently dropped."
    operator_visible_failure: |
      A collector author setting namespace_name="my-team" sees the datasource appear under the Collector's namespace instead, with no log and no doc warning. They cannot predict the behaviour from the docs and may file a confused bug report. The protective intent is correct; the silent drop is the surprise. (Counterfactual: the UI admin path DOES honour namespace_name via getOrCreate — feature-flow batch-W — so the two surfaces behave oppositely, compounding the confusion.)
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-006
  hypothesis: "When a collector ingests a 1000-entity batch via POST /ingestion/entities and exactly one entity has a constraint violation, the other 999 valid entities are persisted (per-entity error isolation), and the response identifies which entity failed."
  derivation: "Negative-space + response shape — a batch API normally isolates per-item failures or returns a 207 Multi-Status; a collector should not lose a whole batch for one bad row."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The entire batch is all-or-nothing. IngestionServiceImpl.ingest is wrapped in a single @ReactiveTransactional (line 66) that binds the whole 14-processor chain plus the OTLP export. One constraint violation anywhere rolls back ALL entities. The HTTP response is binary — 200/201 (all committed) or 5xx (everything rolled back) — with no 207 Multi-Status, no per-entity error payload, no DLQ. A duplicate ODDRN within the payload crashes the whole batch with IllegalStateException (Collectors.toMap default throwing merger, line 86) surfacing as 5xx with no structured "duplicate oddrn" message.
    evidence:
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: "concepts.invariants (ingest is @ReactiveTransactional) + bugs_limitations_corner_cases (duplicate ODDRN crash)"
        cite: "IngestionServiceImpl.java:66 + 83-86"
        note: "Single outer transaction binds the whole batch; duplicate-ODDRN throws and 5xx's the batch."
    operator_visible_failure: |
      A collector with one glitched row (or an at-least-once retry that re-emits a duplicate ODDRN) loses the entire tick with an opaque 5xx and a stack trace the collector cannot parse. There is no signal of which entity failed and no partial success. On the platform side @Slf4j is unused (zero log.* calls) so the rollback is forensically silent. This is tracked as PLT-045 / DOC-195 (error-contract half of the F-008 pipeline).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-007
  hypothesis: "When a collector with a valid token for datasource A submits a POST /ingestion/entities payload naming datasource B's ODDRN (with the ingestion filter ENABLED), the platform rejects the cross-datasource write."
  derivation: "Endpoint shape + the per-datasource token model implying the token authorises writes only to its own datasource."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      With the filter ENABLED, the cross-datasource write IS prevented at the filter layer: IngestionDataEntitiesFilter resolves the token for the datasource named in the BODY and compares it to the Bearer header — a token for A does not match B's token, so the request 401s (the token must match the datasource in the payload). BUT this only holds when the filter is on. On the SHIPPED default (filter off), there is no token check at all (H-001), and the service resolves whatever datasource the payload names with no caller binding (IngestionServiceImpl.java:68). So the protection exists in exactly one configuration and is absent in the default one. Additionally, the filter binds token-to-datasource, not caller-to-tenant — a stolen token for A still authorises full destruction of A.
    evidence:
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: "security.data_exposure[2]"
        cite: "IngestionDataEntitiesFilter.java:43-58"
        note: "Token comparison binds the caller to the specific datasource named in the payload — when the filter runs."
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: "tests_coverage_semantic.uncovered_behaviours (cross-collector pollution probe)"
        cite: "IngestionServiceImpl.java:68"
        note: "Service resolves the payload-named datasource unconditionally; the only defence is the upstream (default-off) filter."
    operator_visible_failure: |
      In the configuration most operators actually run (default), there is no cross-datasource protection. Even with the filter on, the protection is token-scoped not tenant-scoped, so a leaked token for one datasource is a full write+destroy capability over that datasource. No integration test pins the cross-collector-pollution behaviour (IngestionCrossCollectorPollutionTest does not exist), so a regression weakening the filter's datasource binding would land green.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-008
  hypothesis: "When a collector authenticates against POST /ingestion/entities, the bearer token it presents is compared against a securely-stored credential (hashed at rest, constant-time comparison) — as a user would expect of any API key."
  derivation: "Negative-space + security expectation — API credentials are conventionally hashed at rest and compared in constant time."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The token is stored and compared in PLAINTEXT. TOKEN.value is varchar(40) with no hashing column (V0_0_28__add_token.sql:4); TokenGeneratorImpl writes RandomStringUtils.randomAlphanumeric(40) verbatim; ReactiveCollectorRepositoryImpl reads via TOKEN.VALUE.eq(token) (plaintext SQL equality); IngestionDataEntitiesFilter.java:56 compares via String.equals (non-constant-time, not MessageDigest.isEqual). The plaintext-everywhere claim closes end-to-end: schema → codegen → storage → SQL-equality → String.equals → DOM-render (CollectorsList shows the token as a plaintext DOM text node, not an input[type=password]).
    evidence:
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: "implicit_adrs[1] (plaintext-equality shared-secret stance) + security.known_security_gaps[2]"
        cite: "IngestionDataEntitiesFilter.java:56 + TokenGeneratorImpl.java:39 + ReactiveTokenRepositoryImpl.java:30-39"
        note: "String.equals on a plaintext-at-rest 40-char secret."
      - sidecar: odd-platform__ts__react-component__component__CollectorsList.md
        section: "understanding (40-char plaintext bearer token)"
        cite: "CollectorItemToken.tsx:34"
        note: "Token rendered as plaintext DOM text node, not a password input — completes the plaintext-everywhere chain at the render layer."
    operator_visible_failure: |
      Any DB-side reader (a replica, a backup, a pg_dump operator, an accidental jOOQ log leak, a read-only SQL-injection elsewhere) recovers every live ingestion credential in plaintext. The 40-char entropy makes brute-force infeasible, but the at-rest exposure and the non-constant-time compare are both real. The live enable-security doc is SILENT on the storage shape — operators cannot infer the threat model from the doc alone. Tracked as PLT-085 (plaintext-at-rest) + PLT-108 (rotation returns plaintext, no grace window).
    severity: HIGH
    confidence: HIGH
    routes_to_finding: caveat-candidate

