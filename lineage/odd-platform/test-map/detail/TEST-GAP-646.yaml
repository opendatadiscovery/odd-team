proposed_action: |-
  Stand up `RolesList.integration.test.tsx` test `non_admin_sees_only_own_attached_roles_no_count_disclosure` — Testcontainers Postgres + V0_0_56 seed. Method (a): authenticate as ADMIN; mount RolesList; assert ALL seeded roles appear in the list; assert pageInfo.total matches the seed count. Method (b): authenticate as a non-ADMIN user attached only to USER role; mount RolesList; assert ONLY the USER row renders; assert the "X roles overall" subtitle says "1" (NOT the seed count); assert no "showing 1 of N" disclosure messaging anywhere on the page. Method (c): regression-pin — if the `noneMatch(ADMIN)` branch is removed, both tests detect (non-ADMIN sees too many roles). The pin freezes the principal-aware contract.
