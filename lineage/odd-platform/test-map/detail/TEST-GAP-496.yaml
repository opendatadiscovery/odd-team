behaviour: |-
  silent-200-on-missing-data-entity regression-pin for upsertMetadataFieldValue (HIGH — operator-deceptive). When `dataEntityId` does NOT exist (no data_entity row), the `metadataFieldService.get(metadataFieldId)` still returns the GLOBAL field metadata (metadata_field is a platform-global table — V0_0_1__init.sql:166-173, no scoping column). The UPDATE then matches zero rows in metadata_field_value (FK to data_entity(id) is intact but there's no value row for the non-existent entity), and the response is 200-with-empty-body. UNLIKE `createMetadata` (DataEntityServiceImpl.java:257-258 does `reactiveDataEntityRepository.get(dataEntityId).switchIfEmpty(Mono.error(new NotFoundException))`), the upsert path at line 287-305 NEVER validates the entity exists. Operators following the UI flow have no way to encounter this case (the UI passes the id from the entity page), but API consumers (curl, scripts, automation) targeting a stale or typo'd ID get a silent success. Pair with TEST-GAP-492 (silent-200-on-missing-pair) — together they form the 'three indistinguishable silent-success outcomes' for upsertMetadataFieldValue. Cross-pillar P-01 (Discovery / catalog metadata authority undermined by silent-success on invalid IDs).
