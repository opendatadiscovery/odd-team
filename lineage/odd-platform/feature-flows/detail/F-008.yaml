terminal_side_effect:
  side_effect_class: db-delete
  description: 'Two distinct destructive writes per ingest: (a) metadata_field_value DELETE

    of bindings missing from the new payload (MetadataIngestionRequestProcessor.java:72-80);

    (b) lineage DELETE of all edges by the establishers in the payload

    (ReactiveLineageRepositoryImpl.batchDeleteByEstablisherOddrn). Both happen

    INSIDE the same Postgres transaction that ALSO inserts the new payload; partial

    failure rolls back ALL writes including the deletes.'
  evidence: 'MetadataIngestionRequestProcessor.java:72-80 (the difference-then-delete

    sequence) + LineageIngestionRequestProcessor.java:17 (replaceLineagePaths verb)

    + LineageServiceImpl.java:124-133 (the delete-then-insert atomic rewrite) +

    IngestionServiceImpl.java:66 (the outer @ReactiveTransactional binding the

    entire pipeline) + cross-ref to ReactiveLineageRepositoryImpl batch-H sidecar

    + IngestionService batch-I sidecar downstream_side_effects table.'
  cardinality_per_call: 'N + M per call (N = count of metadata bindings dropped from the payload, M =

    count of lineage establishers in the payload). Both can be zero on a perfectly-merged

    re-ingestion, or arbitrarily large on a partial-state re-ingestion.'
