proposed_action: |-
  Testcontainers integration test. (a) Create data entity X and DEG Y, link them via addDataEntityToDEG (status 200). (b) Soft-delete X by setting STATUS=DELETED — triggers the soft-delete cascade into group_entity_relations, flipping is_deleted=true. (c) Restore X by setting STATUS=STABLE. (d) Confirm `getManuallyCreatedRelations(X.oddrn)` returns empty (filter excludes is_deleted=true). (e) POST /api/dataentities/X/data_entity_group with body {data_entity_group_id: Y.id}. (f) Assert HTTP 400 with body 'Data entity is already in this DEG' (current contract — the misleading error). (g) Test comment 'LOCKS the misleading-error regression. When REFACTOR-NNN adds restore-on-add logic, this test FLIPS to assert 200 with the membership row's is_deleted flipped back to false.'
