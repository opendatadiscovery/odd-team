security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNKNOWN
    detail: |-
      At the FRONTEND tier: ungated — the component issues a bare GET with no
      WithPermissionsProvider wrapper around the route (App.tsx:73). At the
      BACKEND tier (DataQualityRunsController): PROBE-NEEDED (P-090), not
      enrichable from the UI sidecars. The hypothesis under P-090 is that the
      backend mirrors the read-collaborative posture of the related per-dataset
      DataQualityController (four read endpoints unscoped, severity-set PUT
      owner-scoped) — consistent with ODD's read-collaborative catalog stance.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      No principal-derived scope at the UI layer; the SQL joins OWNERSHIP only
      when the operator supplies owner/title filter IDs (user-driven filter,
      NOT security scope). The dashboard fetches and renders catalog-wide
      aggregates — table-health counts, monitored/unmonitored counts,
      per-category run-status counts across ALL datasets.
  strengths:
    - |-
      One GET, idempotent, no mutation surface. The operation is fully
      idempotent and side-effect-free.
    - |-
      react-query dedupes concurrent identical-key requests; a filter change
      creates a new queryKey and triggers one refetch.
  weaknesses:
    - |-
      Operator-visible exposure of catalog-wide quality aggregates to any
      authenticated user (and to anonymous callers under auth.type=DISABLED)
      without a documented "read-collaborative" disclosure on the live
      Data Quality doc pages. Severity MEDIUM — captured under the parent
      Data Quality Dashboard entity and the
      `dq-dashboard-doc-silent-on-access-control` invariant.
    - |-
      The component destructures only `{ data, isSuccess }` from the fetch hook
      — never `isError`/`error`. A 4xx/5xx from the backend is presented as
      three grey 'No data' donuts, indistinguishable from a genuinely empty
      catalog. Captured as its own invariant
      (`react-query-no-error-destructure-empty-state-masks-backend-failure`).
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityContent.md
  evidence:
    - DataQualityContent.md:security.known_security_gaps.[0]
    - DataQualityContent.md:bugs_limitations_corner_cases.[5] (no error UI)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Component issues exactly one GET /api/dataqatests/runs per /data-quality
      mount and a refetch on filter change / window-focus (react-query default
      staleTime 0). Backend resolves it as THREE repository queries zipped
      server-side. DataQualityContent.tsx:24 + DataQualityRunsServiceImpl.java:36-39
    - |-
      Per-render client cost is three useMemo reductions over `testResults` —
      cheap, bounded by the number of categories (~6) times statuses (~6).
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      Single aggregate fetch — no per-ring or per-category lazy loading; all
      three rings + all category cards come from one DTO. No bulk / batch
      variant. react-query dedupes concurrent identical-key requests.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      The endpoint declares no page/size params (openapi.yaml:1973-2087);
      testResults is the full category set. Bounded in practice — the
      category count is small and backend-bounded (~6) — so this is not
      a scaling failure, but the contract has no pagination.
  strengths:
    - |-
      Single atomic fetch — all three rings reflect the same filter application
      at the same instant; no partial-load skew across the dashboard.
    - |-
      Server-side zip of three queries means client never sees partial state;
      no client-side composition cost.
    - |-
      Bounded category cardinality (~6) means client memoisations are O(36)
      worst case (6 categories x 6 statuses) — trivially cheap.
  weaknesses:
    - |-
      No staleTime / gcTime configured on `useGetDataQualityDashboard` —
      react-query default staleTime 0 means the dashboard re-runs all three
      backend queries on every remount and every window-focus. A modest
      staleTime would cut redundant fetches with no correctness loss (DQ
      aggregates do not change second-to-second). Severity LOW.
    - |-
      A deeplink open (/data-quality?deNamespaceIds=...) double-fires the
      fetch: 1 on plain mount (default `{}` filters) + 1 after
      DataQualityFilters mount-useEffect hydrates from searchParams (LSN-017
      class). Probe P-101 pins the exact multiplicity.
    - |-
      `data.testResults.toSorted(...)` is computed OUTSIDE a useMemo at
      DataQualityContent.tsx:75-77 — re-sorts on every parent re-render even
      when `data` is unchanged. Cheap at N=6, inconsistent with the surrounding
      useMemo-wrapped derivations. Severity LOW.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQualityContent.md
  evidence:
    - DataQualityContent.md:performance.known_performance_gaps.[0-1]
    - DataQualityContent.md:performance.throughput_characteristics
    - DataQualityContent.md:upstream_callers.[1] (deeplink double-fire)
related_features:
