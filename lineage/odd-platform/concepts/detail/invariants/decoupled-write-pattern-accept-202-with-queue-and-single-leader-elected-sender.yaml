name: Decoupled-write pattern — accept-202 with queue-and-single-leader-elected-sender
canonical_in_docs: false
canonical_candidate: true
description: 'Outbound integrations that depend on an unreliable external service
  (Slack) accept the inbound request, persist intent to Postgres in PENDING state,
  return 202 Accepted immediately, and let a single-leader-elected background job
  drain the queue with retries. The leader election uses a Postgres advisory lock
  (configurable `datacollaboration.sender-message-advisory-lock-id`, default 120).
  This preserves the Postgres-as-only-dependency posture while still decoupling caller
  latency from external service availability. Single example in the catalog so far:
  DataCollaborationMessageSenderJob for Slack messages.'
axes_present:
- controllers
nodes:
- odd-platform java DataCollaborationController controller-method:postMessageInSlack
contributors:
- 'postMessageInSlack.implicit_adrs[3]: explicit 202+queue+sender decomposition'
- 'postMessageInSlack.implicit_adrs[4]: Postgres advisory lock for single-sender ordering
  (preserves Postgres-as-only-dependency)'
evidence:
- postMessageInSlack.md:implicit_adrs.[3]
- postMessageInSlack.md:implicit_adrs.[4]
notes: 'Architecturally significant pattern not seen elsewhere in the catalog

  so far. Surface as a canonicalisation candidate; the maintainer may

  promote to ADR if future features (e.g., outbound webhooks, email

  notifications) adopt the same shape.

