name: Expose-mode-hide-provider — SPA runtime-config contract across AppInfo + Identity
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW INVARIANT, batch 2026-05-20T (AppInfoController class sidecar)** — the
  React SPA's runtime configuration-discovery surface consists of TWO endpoints
  that the SPA hits early in the load sequence: GET /api/appInfo and GET /api/identity
  (the whoami surface). Together they encode a DELIBERATE contract:

    - **Expose the auth MODE**: AppInfoController returns `{projectVersion, authType}`
      (AppInfoController.java:24-28 + components.yaml:2493-2499); the SPA needs the
      mode value to gate UI rendering (`Overview.tsx:25-27`: `appInfo?.authType &&
      appInfo.authType !== 'DISABLED'` gates the OwnerAssociation card).
    - **Hide the PROVIDER**: AppInfo exposes NO OAuth provider name, NO LDAP server
      URI, NO issuer URL, NO build SHA, NO hostname. IdentityController.whoami
      (IdentityController.java:24-33) returns `AssociatedOwner.identity`, where the
      Identity model has `username + permissions` — NO `provider` field. The two
      endpoints together encode a 'expose mode, hide provider' contract.

  **Why this is a real invariant**: the SPA needs ENOUGH info to render the right
  login flow but NOT ENOUGH info for an unauthenticated network attacker to
  fingerprint the deployment's identity-provider topology. The mode tells the SPA
  WHICH login button to show; the provider name/URL would tell an attacker WHICH
  OAuth or LDAP topology to attack.

  **Cross-batch confirmation**: F-011's drift-class enumeration includes
  `ui_identity_render_has_no_provider_field_positive_negative_no_leak` confirming
  the IdentityController side is INTENTIONAL — the absence of a `provider` field
  on the Identity DTO is a deliberate non-disclosure (NOT a missing-feature gap).
  Combined with the AppInfo contract verified by this batch, the two-endpoint
  pattern is a load-bearing security design.

  **The contract's failure modes** (NEW catalogued by this invariant):
    (a) Adding `provider` to the Identity DTO would BREAK the contract by leaking
        the OAuth/LDAP topology to authenticated callers (even if not unauthenticated
        ones — the attack surface widens to compromised authenticated principals).
    (b) Adding host/SHA/deployment-id to AppInfo would BREAK the contract by widening
        the fingerprinting surface beyond the (mode + version) signal it currently
        carries.
    (c) The contract is FRAGILE — no test asserts the absence of these fields; a
        future contributor could add them without realising the security implication.
        The fingerprinting surface widens silently.

  **What is still leaked**: even with the contract intact, AppInfo discloses
  `projectVersion` — enabling CVE scoping for attackers (the version tells them
  which CVEs in the Spring Boot / WebFlux / Reactor / R2DBC / OAuth-client chains
  apply to THIS deployment). The contract limits the leakage to (mode + version);
  the version alone is still a fingerprinting signal under DISABLED.

  Severity: MEDIUM (the contract is intentional but fragile; absence of test-side
  enforcement means a future refactor could widen the disclosure surface silently;
  the fingerprinting capability under DISABLED is a real attack surface).
