# Named integration-test suites — each a list of IT-NNN protocols run together.
# Maps to test-plan.md integration batches I1-I10. Run: integration-tests/run-suite.sh <name>
# Protocols are authored (Step 3) by copying TEMPLATE.md → protocols/IT-NNN-*.md and
# adding the id to the relevant suite below.

suites:
  smoke:
    description: "Framework canary — proves the stack + protocol + log loop end-to-end."
    protocols: [IT-001]

  feature-complete:
    description: "The GREEN-target regression suite — run when a feature is implemented or a bug fixed; everything here should pass. Excludes known-open-bug pins (those live in `known-bugs`). Run alongside the unit suite (scripts/run-platform-tests.sh)."
    protocols: [IT-001]   # passing pins only; grows as green I-batches land

  known-bugs:
    description: "Quarantine lane — pins that reproduce a KNOWN, UNFIXED bug; EXPECTED to be RED. Keeps them visible without making feature-complete permanently red. When a bug is fixed its pin flips GREEN → move it to feature-complete (that move is the measurable regression closure)."
    # IT-002 PLT-104 (view_count +2) · IT-003 PLT-090/127 (tsquery poison) ·
    # IT-004 PLT-052 (DQ unknown-status crash) · IT-005 PLT-026 (Top Tags oldest-by-id) ·
    # IT-006 TEST-GAP-1013 (no SPA error boundary). All expected RED until fixed.
    protocols: [IT-002, IT-003, IT-004, IT-005, IT-006]

  ui-e2e:
    description: "Browser end-to-end (Playwright) user-flow tests — the user-observable half of integration. Self-contained in integration-tests/e2e/. Several here are known-bug pins (expected RED) — see the known-bugs suite."
    protocols: [IT-002, IT-003, IT-004, IT-005, IT-006]

  # --- test-plan.md integration batches (protocols authored during Step-3 implementation) ---
  I1-auth-mode-authz:
    description: "Auth-mode + authz enforcement — ADR-0002/0003/0074; cross-owner read-openness. test-plan I1."
    protocols: []
  I2-attachment-storage:
    description: "Attachment storage LSN-001/002 + ADR-0012 — Testcontainers-MinIO non-us-east-1 + container-restart durability. test-plan I2."
    protocols: []
  I3-notifications-wal:
    description: "Notifications WAL + fan-out — ADR-0040/42/43/44, PLT-016 (poison-message, thread-death, fail-soft). 2-replica + advisory-lock failover. test-plan I3."
    protocols: []
  I4-data-collaboration:
    description: "Data Collaboration — ADR-0019/0020, PLT-119/054 (cross-entity post, Slack signature). test-plan I4."
    protocols: []
  I5-ingestion-identity:
    description: "Ingestion identity contract — ADR-0070/0073, PLT-003/012 (pull/push parity, ODDRN idempotency, term-gate path). test-plan I5."
    protocols: []
  I6-lineage-safety:
    description: "Lineage traversal safety — PLT-100/042/028 (unset-depth, depth clamp, cycle guard, cross-entity structure). test-plan I6."
    protocols: []
  I7-search-session:
    description: "Search/session poisoning + facet scope — PLT-090/127 (tsquery injection, cross-owner facets, tag ordering). test-plan I7."
    protocols: [IT-003, IT-005]   # IT-003 tsquery poison (catalog+dictionary) · IT-005 Top Tags ordering
  I8-audit-trail:
    description: "Audit-trail completeness — PLT-062, ADR-0058. NOTE TEST-GAP-491 (@Profile !integration-test) must be resolved first. test-plan I8."
    protocols: []
  I9-ui-e2e:
    description: "UI cross-tier e2e (Playwright) — error boundary, F-001 inflation loop, F-031/F-032 dialogs. Harness lives in integration-tests/e2e/. test-plan I9."
    protocols: [IT-002, IT-004, IT-006]   # IT-002 F-001 inflation · IT-004 F-032 dashboard crash · IT-006 F-042 error boundary
  I10-api-conformance:
    description: "API conformance harness — F-029 H-012 spec↔platform conformance, SLA PNG/JSON, Glossary smoke. test-plan I10."
    protocols: []
