- id: H-002
  hypothesis: "Clicking a search result row to inspect an entity is a read-only browse action — it does not itself change that entity's popularity ranking."
  derivation: "Negative-space + product-owner: a user scanning search hits expects browsing TO an entity to be neutral with respect to a 'most-popular' ranking elsewhere; a ranking that moves because you clicked a search result is a feedback loop a senior PO flags on sight."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      A row click is NOT read-only with respect to the ranking — it writes +2 view_count. The row
      navigates to /dataentities/{id}/overview (ResultItem.tsx:42,:75), which mounts DataEntityDetails,
      which fires the read-as-write fetchDataEntityDetails. Because of the LSN-017 dep-array bug
      (DataEntityDetails.tsx:56-64), that mount fires the fetch twice → +2 view_count per click
      (empirically pinned by probe P-004: xhr_count=2, DB delta=2). The home-page Popular strip (F-003)
      ranks solely by view_count DESC. There is no client-side debounce, no per-session "already counted"
      guard, no analytics-only navigation, no idempotency key at any layer of the F-001 chain. The Search
      row is the SECOND UI closure point of the inflation loop (after the home-page PopularStrip), and the
      Directory level-4 EntityItem is a third — all three route through dataEntityDetailsPath into the same
      read-as-write Overview tab.
    evidence:
      - sidecar: "(source read — ResultItem.tsx, hop-1 sidecar unresolved)"
        section: render
        cite: "ResultItem.tsx:42, :72-76"
        note: "Whole-row navigate into the Overview tab; no client-side dedupe/analytics-only mode. source_read_for_validation: true."
      - sidecar: odd-platform__ts__react-component__component__DataEntityDetails.md
        section: bugs_limitations_corner_cases
        cite: "DataEntityDetails.tsx:56-64 + lineage/odd-platform/probe-runs/2026-05-19-P-004.yaml"
        note: "LSN-017 doubling: one page-open = +2 view_count, empirically pinned (xhr_count=2, delta=2)."
      - sidecar: odd-platform__ts__react-component__component__DataEntityDetails.md
        section: upstream_callers
        cite: "DataEntityDetails.md upstream_callers (Search results + Directory leaves enumerated as click sources)"
        note: "Search row is one of three UI surfaces closing the inflation loop into the same Overview read-as-write."
    operator_visible_failure: |
      (1) Routine search browsing — type a query, click a result to check it, hit Back, click the next —
      silently inflates the home-page Popular ranking by +2 per click. One operator re-reading a result
      twice writes that entity's popularity by +4. (2) The Popular metric thus measures "what people
      searched and clicked" as much as "what the team values" — an operator using Popular to decide what to
      deprecate/promote is reasoning over a polluted signal. (3) Cross-owner amplification: because Search
      spans every owner's entities (read-collaborative posture), a user scanning results across teams
      inflates OTHER teams' entities into the shared home-page strip. (4) There is no read-only browse mode
      and no per-session guard, so the user cannot avoid contributing to the loop. (5) Combined with the
      a11y gap (H-005), a user who DID have a real anchor could middle-click to inspect without mounting the
      page — but the whole-row navigate forecloses even that mitigation.
    severity: HIGH
    confidence: HIGH
    source_read_for_validation: true
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional
    routes_to_finding: bug-candidate

- id: H-003
  hypothesis: "A keyboard-only operator can reach and open a search result row using the keyboard (Tab to the row, Enter/Space to open it)."
  derivation: "Product-owner UX seed (Rule 9 — 'can the user use this from what is on screen / across input modalities'): a catalog search list is a primary navigation surface; WCAG 2.1.1 makes keyboard reach a baseline expectation for any actionable element."
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      The row is unreachable by keyboard. `<S.Container container onClick={...}>` (ResultItem.tsx:72-76)
      is a styled MUI Grid (a <div>), not an <a> or <button>. It carries only `data-testid` and `container`
      props — NO `tabIndex`, NO `role`, NO `aria-label`, NO `onKeyDown` handler for Enter/Space. The
      row therefore does not appear in the tab order, screen readers do not announce it as actionable, and
      there is no key binding to trigger the navigate. A keyboard-only operator can type a query, see the
      results render, and has no way to open any of them. The hover background-change in S.Container styles
      is a mouse-only affordance and does not serve as a focus indicator.
    evidence:
      - sidecar: "(source read — ResultItem.tsx, hop-1 sidecar unresolved)"
        section: render
        cite: "ResultItem.tsx:72-76"
        note: "S.Container is a styled Grid div with onClick only — no tabindex/role/aria-label/onKeyDown. source_read_for_validation: true."
    operator_visible_failure: |
      (1) Keyboard-only operators (motor-impairment, power users, screen-reader users) are locked out of the
      Search surface entirely — they can search but cannot open a result without a pointing device
      (WCAG 2.1.1 Keyboard failure). (2) Screen readers announce each row as static text, giving no signal
      that it is clickable, so an assistive-tech user cannot discover the primary action. (3) This is
      inconsistent with the rest of the platform's navigable lists insofar as none expose a real link here;
      the same fix shape is already on the F-001 PopularStrip a11y backlog.
    severity: MEDIUM
    confidence: HIGH
    source_read_for_validation: true
    use_case_kind: render
    coverage: unverified
    test_demand: functional
