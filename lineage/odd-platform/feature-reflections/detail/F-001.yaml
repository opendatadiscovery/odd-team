# Popular Entities Ranking — product-owner reflection

## product_owner_narrative

**What it is.** "Popular" is the home-page strip a returning user sees under the *Recommended* heading on the ODD catalog overview — a short list (five tiles) of the data entities that are most-viewed across the whole catalog (per `getPopular.md:understanding` + the live doc, WebFetched 2026-06-01: *"The most-viewed data entities across the catalog, ranked by view count alone (highest first)"*). Its job is the platform's first impression: a new joiner who lands on the home page is meant to learn, in one glance, *what matters here* — which tables, models, and pipelines the rest of the team actually opens. It is served to every signed-in user who has an associated Owner, and (via the API) to any caller at all (per `getPopular.md:concepts.audiences`).

**How a user interacts with it.** There are two halves to the feature, and they form a closed loop. The *consumer* half is `GET /api/dataentities/popular?page=1&size=5` — a four-line reactive pass-through (`DataEntityController.getPopular` → `DataEntityServiceImpl.listPopular` → `ReactiveDataEntityRepositoryImpl.listPopular`) that ranks rows by `DATA_ENTITY.VIEW_COUNT DESC` with an `id DESC` tiebreaker and returns a 9-field `DataEntityRef` projection (per `getPopular.md:operations` + `ReactiveDataEntityRepositoryImpl.java:633`). The *producer* half is the view counter: every time a user opens an entity's detail page, the SPA's `DataEntityDetails` component fires `fetchDataEntityDetails` → `GET /api/dataentities/{id}` → `DataEntityServiceImpl.getDetails` (which carries `@ReactiveTransactional`) → `ReactiveDataEntityRepositoryImpl.incrementViewCount` → `UPDATE data_entity SET view_count = view_count + 1` (per `DataEntityDetails.md:downstream_side_effects` + `ReactiveDataEntityRepositoryImpl.java:173-180`). A user never "votes" explicitly — the act of reading *is* the vote.

**The working parts.** The ranking signal is deliberately the simplest possible thing: cumulative reads, one column, descending, no time-decay, no per-class weight, no per-owner partition, no anti-abuse signal (per `getPopular.md:implicit_adrs[0]`). On the home page the Popular column is rendered by the fourth `DataEntityList` inside `OwnerEntitiesList` (the substrate's logical "PopularStrip" node — there is no dedicated `PopularStrip.tsx`; per `PopularStrip.md:understanding`), fetched once on mount with `{page:1, size:5}`, and each tile is a `<Link>` to `/dataentities/{id}/overview`. Clicking a tile therefore navigates straight into the read-as-write endpoint — *clicking the most-popular entity makes it more popular* (per `PopularStrip.md:bugs_limitations_corner_cases[0]`). The whole Recommended panel is gated on `appInfo.authType !== 'DISABLED'` at the home-page chrome layer (`Overview.tsx:25-27`), so on auth-disabled deployments the strip is hidden from the home page entirely (the API endpoint stays open).

**The integration story.** This feature sits at the centre of the Data Discovery pillar (P-01) and is one of the platform's three read-collaborative cross-owner surfaces (alongside catalog Search and the Activity feed; per `system-mission.md` P-09 maintainer notes + `concepts.yaml` read-collaborative cluster). The Popular column shares the *Recommended* heading with three sibling columns — My Objects, Upstream, Downstream — which ARE owner-scoped; Popular alone is catalog-wide (per `Overview.md:bugs_limitations_corner_cases[1]`). It also inherits the platform-wide soft-delete-via-STATUS and hollow-exclusion conventions, but — uniquely among list-shaped surfaces — it does NOT inherit the `EXCLUDE_FROM_SEARCH` convention (per `ReactiveDataEntityRepositoryImpl.md:invariants[2]`).

**Edge cases a demo would highlight.** On a fresh deployment with zero historical traffic, `view_count = 0` everywhere and the ranking degenerates to the `id DESC` tiebreaker — so "Popular" silently shows the *newest-ingested* entities, not the most-viewed (per `getPopular.md:bugs_limitations_corner_cases[6]`). The strip caches per home-page mount (no polling), so a back-button navigation re-fetches and the user can watch their own click change the ranking in real time (per `PopularStrip.md:downstream_side_effects`). And the response never carries `view_count` itself — the order leaks, the magnitude does not (per `getPopular.md:doc_drift_findings[2]`).

