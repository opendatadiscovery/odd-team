  derivation: "cross-pillar (P-07 Activity Feed): term-link mutations on the sibling relations emit @ActivityLog(TERM_ASSIGNMENT_UPDATED); an auditor expects symmetric coverage."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The term-to-term link/unlink family (linkTermWithTerm /
      removeTermToLinkedTermRelation, TermServiceImpl.java:288-301; controller
      addLinkedTermToTerm/deleteLinkedTermFromTerm, TermController.java:237-249)
      is NOT annotated with @ActivityLog — UNLIKE every sibling linkage operation
      (linkTermWithDataEntity, removeTermFromDataEntity, linkTermWithDatasetField,
      removeTermFromDatasetField all carry @ActivityLog(TERM_ASSIGNMENT_UPDATED)).
      So the very mutations that SHAPE the reverse-lookup graph this tab displays
      are invisible to the Activity Feed. (Compounded by H-002's unguarded
      term-to-term write endpoints — any authenticated user can shape this graph
      with neither RBAC nor an audit trail.)
    evidence:
