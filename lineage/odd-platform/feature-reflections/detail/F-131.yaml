- id: H-009
  hypothesis: "When a user without QUERY_EXAMPLE_CREATE views the catalog list, the 'Add query example' button is not available to them; and a user without QUERY_EXAMPLE_UPDATE does not see the 'Edit' button on the details page."
  derivation: "Both render sites are wrapped by <WithPermissions permissionTo=QUERY_EXAMPLE_CREATE|UPDATE> (F-131 discovered_from_entry_point:16-17)."
  seed_source: ui-label
  validation:
    verdict: partial
    actual_behavior: |
      The Add and Edit buttons ARE wrapped in `<WithPermissions permissionTo=QUERY_EXAMPLE_CREATE>`
      (list) and `<QUERY_EXAMPLE_UPDATE>` (details) respectively (F-131 discovered_from_entry_point).
      Per the F-025 reflection's analysis of `WithPermissions`, that component gates VISIBILITY using
      the caller's permission context — so a user lacking the permission does not see the button.
      This is the visibility half. The ENFORCEMENT half is server-side: the controller gates
      `createQueryExamples` (QUERY_EXAMPLE_CREATE) and `updateQueryExample` (QUERY_EXAMPLE_UPDATE)
      via SecurityConstants (controller sidecar `security.authorization_assertions`). The two halves
      agree for the create/update endpoints. The partial verdict reflects two caveats: (a) the
      `WithPermissions` gate is a UI-render decision, not a route guard — it hides the button but a
      determined caller can still POST directly (the server rule is the real gate, and it IS present
      here, so this is defence-consistent); (b) under auth.type=DISABLED the server falls through to
      `authenticated()` which anonymous callers pass, so the gate is only as strong as the deployed
      auth mode (controller sidecar `security.auth_mode_relevance`).
    evidence:
      - sidecar: "F-131 flow"
        section: discovered_from_entry_point
        cite: "F-131.yaml:11-17"
        note: "render sites wrapped by WithPermissions CREATE / UPDATE"
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController.md
        section: "security.authorization_assertions + auth_mode_relevance"
        cite: "SecurityConstants.java:112-113,312-314"
        note: "server gates create+update; under DISABLED auth all rules fall through to authenticated()"
    operator_visible_failure: |
      Under a properly-configured auth mode (LOGIN_FORM / OAUTH2 / LDAP), the gate works at both
      layers. The residual exposure is the DISABLED-auth default deployment, where the UI may hide
      the button but the server accepts anonymous create/update — an operator reading the
      button-less screen as 'locked down' ships a platform whose authoring endpoint is open to the
      network (the same class as F-020's collector-button finding). This is inherited deployment
      posture, not a defect of this dialog specifically.
    severity: LOW
    confidence: MEDIUM
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-010
  hypothesis: "When a user pastes a very large query body (e.g. a 5MB generated SQL) into the dialog and submits, the platform either accepts it or gives a clear size-limit error — it does not fail silently or hang."
  derivation: "No client length cap (presence+trim only); schema is `text NOT NULL` (1GB PG ceiling); WebFlux default in-memory codec cap is 256KB but configurable (controller sidecar `bugs_limitations_corner_cases.[5]`)."
  seed_source: endpoint-shape
  validation:
    verdict: probe-needed
    actual_behavior: |
      The client imposes no length cap (QueryExampleForm.tsx:83,94 — presence+trim only). The
      schema stores `text NOT NULL` (PG accepts up to ~1GB). BUT the WebFlux default in-memory codec
      limit is 256KB (`spring.codec.max-in-memory-size`, configurable) per the controller sidecar
      `bugs_limitations_corner_cases.[5]`. Whether a >256KB body produces a clean 4xx with an
      operator-readable message, a 500, or a silently-swallowed rejection that closes the dialog
      and discards the typed input (the F-031-class `.then(...)`-without-`.catch(...)` failure —
      and note QueryExampleForm.tsx:63-66 chains `.then()` with NO `.catch()`) cannot be determined
      from static reading. It requires standing up the platform and POSTing an oversize body.
    evidence:
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController.md
        section: "bugs_limitations_corner_cases.[5] (no content-length cap)"
        cite: "V0_0_84__create_query_example.sql:5 + components.yaml:2799-2808"
        note: "no maxLength in schema; WebFlux 256KB default codec cap, configurable"
      - sidecar: "(source_read_for_validation) QueryExampleForm.tsx"
        section: onSubmit
        cite: "QueryExampleForm.tsx:63-66"
        note: ".then(qe => reset()+navigate()) with NO .catch — a rejected mutation has no UI error path here"
    operator_visible_failure: |
      If the oversize POST rejects and the unhandled `.then()` chain leaves the dialog open with no
      error toast (the suspected behaviour, matching the F-031 ConfirmationDialog-swallows-rejection
      class), the author sees a dialog that does nothing on Save and loses confidence / re-clicks.
      The probe resolves whether large-body submit is a clean error or a silent dead-end.
    severity: LOW
    confidence: LOW
    probe_id: PENDING-F-131-2
    routes_to_finding: probe-needed
    use_case_kind: grammar
    coverage: unverified
    test_demand: PENDING-F-131-2

