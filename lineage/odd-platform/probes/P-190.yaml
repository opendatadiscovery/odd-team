arrange:
  - kind: docker-compose-up
  - kind: sql
    query: |
      -- Two owners
      INSERT INTO owner (id, name, deleted_at)
      VALUES (8001, 'probe_owner_alpha', NULL),
             (8002, 'probe_owner_beta',  NULL);
  - kind: sql
    query: |
      -- 'alice_username' mapped to owner alpha; 'bob_username' has
      -- NO user-owner mapping.
      INSERT INTO user_owner_mapping (id, oidc_username, owner_id, deleted_at)
      VALUES (8101, 'alice_username', 8001, NULL);
  - kind: sql
    query: |
      INSERT INTO data_entity (id, oddrn, external_name, data_source_id, type_id)
      VALUES (8200, '//probe-src/p190/entity', 'p190_entity', 1, 1);
  - kind: sql
    query: |
      -- 5 activity rows by alice_username + 5 by bob_username, in window.
      INSERT INTO activity (id, data_entity_id, event_type, created_by, created_at,
                            old_state, new_state)
      SELECT 8300 + i, 8200, 'TAG_ASSIGNMENT_UPDATED', 'alice_username',
             NOW() - (i || ' hour')::interval, '{}', '{}'
      FROM generate_series(1, 5) AS i;
      INSERT INTO activity (id, data_entity_id, event_type, created_by, created_at,
                            old_state, new_state)
      SELECT 8400 + i, 8200, 'TAG_ASSIGNMENT_UPDATED', 'bob_username',
             NOW() - (i || ' hour')::interval, '{}', '{}'
      FROM generate_series(1, 5) AS i;
act:
  - kind: rest
    method: GET
    path: /api/activity?beginDate={now-1d}&endDate={now+1d}&size=30&userIds=8001
    capture_as: response_filter_by_owner_alpha
  - kind: rest
    method: GET
    path: /api/activity?beginDate={now-1d}&endDate={now+1d}&size=30&userIds=8002
    capture_as: response_filter_by_owner_beta
  - kind: dom-probe
    description: |
      Open the Activity page in a headless browser; click the "User"
      filter autocomplete and type "alice"; observe what the dropdown
      displays. Expected per code-trace: the dropdown queries
      fetchOwnersList and lists OWNERS whose names match "alice" (none —
      alice is a user, not an owner name). Then type "alpha"; dropdown
      should list owner `probe_owner_alpha` (id=8001).
    capture_as: dropdown_options_for_alice
  - kind: sql
    description: |
      Simulate retroactive rewrite: change alice's mapping from owner
      alpha to owner beta, then re-fetch.
    query: |
      UPDATE user_owner_mapping
      SET owner_id = 8002
      WHERE id = 8101;
  - kind: rest
    method: GET
    path: /api/activity?beginDate={now-1d}&endDate={now+1d}&size=30&userIds=8001
    capture_as: response_after_remap_owner_alpha
  - kind: rest
    method: GET
    path: /api/activity?beginDate={now-1d}&endDate={now+1d}&size=30&userIds=8002
    capture_as: response_after_remap_owner_beta
observe:
  - kind: sql
    description: |
      Reference row sets — actor truth never changes; only the mapping
      moves between the two REST calls.
    query: |
      SELECT id, created_by FROM activity
      WHERE created_by IN ('alice_username','bob_username')
        AND data_entity_id = 8200
      ORDER BY id;
    capture_as: actor_truth
assert:
  - "len(response_filter_by_owner_alpha.body) == 5  # 5 alice rows (alice maps to owner alpha)"
  - "all(row.created_by == 'alice_username' for row in response_filter_by_owner_alpha.body)"
  - "len(response_filter_by_owner_beta.body) == 0  # owner beta has no mapped user; bob is unmapped"
  - "len(dropdown_options_for_alice) == 0  # User autocomplete shows zero matches for 'alice' — fetchOwnersList does not return users"
  - "len(response_after_remap_owner_alpha.body) == 0  # alice no longer maps to alpha; alpha-filter empties retroactively"
  - "len(response_after_remap_owner_beta.body) == 5  # alice now maps to beta; 5 historical rows reappear under owner beta filter"
  - "len(actor_truth) == 10  # underlying activity.created_by values never changed; only the mapping moved"
cleanup:
  - kind: sql
    query: |
      DELETE FROM activity WHERE data_entity_id = 8200;
      DELETE FROM user_owner_mapping WHERE id = 8101;
      DELETE FROM data_entity WHERE id = 8200;
      DELETE FROM owner WHERE id IN (8001, 8002);
  - kind: docker-compose-down
    destroy_volumes: true
