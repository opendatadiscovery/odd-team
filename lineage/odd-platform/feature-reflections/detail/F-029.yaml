# Platform Public API Contract — product-owner reflection

## reflection_scope_caveat

**This reflection judges the SPEC ARTEFACT and the CONTRACT it promises — it does NOT judge what a developer experiences in the rendered Swagger UI or in a generated SDK's ergonomics (APPROACH.md section 0.3 + Rule 9 / LSN-023).** The "user-facing surface" of a pillar-P-11 feature is developer-facing: the interactive Swagger UI served at `{platform-base-url}/api/v3/api-docs`, the generated TypeScript/Java SDK, and the API-reference documentation hub. Of these three, ONLY the spec source file is enriched as a sidecar in F-029's `contributing_nodes` (`odd-platform__openapi__spec__odd-platform-public-api`); the Swagger UI's render behaviour (does the left-nav group 35 tags legibly? does "Try it out" work without auth? does the contact email render as a clickable mailto?) and the generated SDK's developer-ergonomics (does `openapi-generator-cli` emit a usable client? does a strict-status client reach the success branch?) have NO sidecar. I checked: the chain is one OpenAPI spec node plus three IngestionController controller-methods — there is no `ui-shell`/`react-component` sidecar for the Swagger UI, and the only runtime surfacing recorded is the spec sidecar's `terminal_side_effect: page-render` cross-reference. Consequently the senior-product-owner UX questions (Rule 9: *can the developer understand how to authenticate from what is on screen? is the Swagger UI convenient/intuitive? is it consistent with how other catalogs publish their contract?*) are answered HERE only from the spec's CONTENT, not from the rendered product. The render/SDK gap is logged as a `validation_gap` and a `new_drift_class` (`openapi_swagger_ui_render_surface_unenriched_reflection_spec_only_F029`). One caveat is now load-bearing for the hub: the live API-reference landing page that the spec sidecar verified at status 200 on 2026-05-20 is a **404 today** (WebFetch 2026-06-01) — so the developer-facing surface is partly broken in a way no spec read can show, and the substrate-coverage pass (APPROACH.md Rule 20 / Failure F) should anchor the Swagger UI render component so a follow-up reflection can cover the developer UX.

## product_owner_narrative

**What it is.** The Platform Public API Contract is the single source of truth for the *shape* of every HTTP call against the ODD Platform: a 4212-line `odd-platform-specification/openapi.yaml` plus its 2937-line sibling `components.yaml`, together declaring **194 operations across 35 tags** under the `/api/**` URL space (per `odd-platform__openapi__spec__odd-platform-public-api` understanding + concepts.invariants). It is the contract that three audiences build against: third-party programmatic clients generating SDKs, the React UI's generated TypeScript client, and every running platform's interactive Swagger UI (per spec sidecar audiences). It is the developer-facing half of pillar P-11 — and per `system-mission.md` P-11 it is the surface that "feeds every other pillar's HTTP face." Its load-bearing convention is an implicit ADR confirmed both in the chain and in the live ADR log (ADR-0001, WebFetch 2026-06-01): controllers are thin delegates that `@Override` the spec-generated `*Api` interfaces and never declare their own `@RequestMapping` — so the spec, not the Java, is the path/method authority (per spec sidecar implicit_adrs[0]).

**How a developer interacts with it.** Two entry points. At build time, `openapi-generator-cli` parses the spec and emits ~150 server-side `*Api` Java interfaces plus the React UI's TypeScript client and ~250 schema POJOs (per spec sidecar terminal_side_effect + dependencies_semantic). At runtime, every deployment serves the spec via Spring's springdoc-openapi integration at `{platform-base-url}/api/v3/api-docs`, where Swagger UI renders it for interactive testing (per spec sidecar terminal_side_effect[b]). A developer reads an operation's method/path/request-body/response-body from the spec, generates a client, and calls the endpoint. What they DO NOT get from the spec: how to authenticate (no `securitySchemes`), what an error looks like (only 3 of 194 operations declare any 4xx/5xx), or what the safe pagination cap is (no `maximum:` on `PageParam`/`SizeParam`) — all per spec sidecar concepts.invariants[3,4] + performance.known_performance_gaps.

**The working parts.** The spec partitions its 194 operations across 35 feature tags (`dataEntity` is the largest at 45+ ops; `genai`/`links`/`identity` are single-op tags) and references `components.yaml` 487 times via `$ref`, with zero inline schemas of consequence (per spec sidecar implicit_adrs[2,3]). Status codes are non-uniform: 31 operations declare `'201'`, 137 declare `'200'`, and across the Create/Update families the spec mixes the two while controllers uniformly return 200 via `ResponseEntity::ok` and tests lock in `isOk()` (per spec sidecar concepts.invariants[5] + bugs_limitations_corner_cases[2]). One endpoint (`GET /api/datasets/{id}/sla`) is uniquely `image/png` (per spec sidecar concepts.invariants[6]). The spec is silent on authorization entirely — a developer cannot learn from it which operation needs `DATA_ENTITY_ADD_TERM` vs `TAG_CREATE` (per spec sidecar security.authorization_assertions).

**The integration story.** The platform-api spec described here is the `/api/**` half of pillar P-10's wire contract; the SIBLING ingestion-api spec (in the separate `opendatadiscovery-specification` artefact) covers `/ingestion/**` (per spec sidecar implicit_adrs[1] + the feature-flow cross_pillar_relationships P-10 leg). The three IngestionController contributing nodes (`postDataSetStatsList`, `ingestMetrics`, `getDataEntitiesByDEGOddrn`) are on the INGESTION side — they appear in this chain because they demonstrate the spec-vs-implementation status-code reconciliation (they correctly return 201 matching their spec, while the platform-side Create/Update families drift) and because they are the canonical cross-spec boundary. Every per-feature drift in P-01..P-10 has a spec-side mirror here (status-code, inverse-semantic on getMyObjects, the REFACTOR-217 path mismatch) — this feature is the canonical home for cross-feature contract-surface drift (per feature-flow control_summary).

**Edge cases a product owner would demo.** Three are load-bearing. (a) **The spec is the security incident's silent enabler** — the spec declares the term-link path correctly as plural `/terms`, and it is precisely that correctness that makes the SecurityConstants `/term` SINGULAR registration a SILENT authorization bypass (the spec is right, the gate is wrong, nothing reconciles them — per spec sidecar bugs_limitations_corner_cases[6]). (b) **The spec is the reconnaissance surface** — served at `/api/v3/api-docs`, under the shipped-default `auth.type=DISABLED` it is reachable unauthenticated, exposing all 194 operations + DTO shapes + a contributor's personal email `ndementev@provectus.com` (per spec sidecar security.data_exposure). (c) **Zero conformance test exists** — nothing fires the spec'd operations against the running platform to assert the contract holds, which is the structural root that lets every drift class above accumulate (per spec sidecar tests_coverage_semantic.gaps).

## hypotheses

- id: H-001
  hypothesis: "When a developer generates an SDK from the platform OpenAPI spec (e.g. via openapi-generator-cli), the generated client contains authentication code — Bearer/session-cookie/X-API-Key wiring — so the developer can call protected endpoints without hand-authoring auth glue."
  derivation: "Pillar-mission anchor (P-11 'build a custom collector ... interact via Swagger UI') + the platform supports 4 UI auth modes + S2S X-API-Key + Ingestion filter per P-09; a contract that is the developer surface for an authenticated platform would declare those schemes."
  seed_source: pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The spec declares ZERO securitySchemes and ZERO per-operation security: blocks (Grep
      across openapi.yaml + components.yaml returns 0 matches for both). Generated SDKs therefore
      contain NO authentication code at all — no Bearer wiring, no session-cookie handling, no
      X-API-Key injection. A developer must reverse-engineer the platform's auth posture from the
      running service (or the separate enable-security doc page) and hand-author the auth glue,
      which is the single easiest place for a misconfiguration. Auth IS enforced server-side via
      SecurityWebFilterChain — so this is an SDK-quality / integration-quality contradiction, not
      a server-side boundary failure.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: bugs_limitations_corner_cases[0]
        cite: "openapi.yaml:1-49 + components.yaml:1-2937 (Grep securitySchemes/security: -> 0 matches)"
        note: "No securitySchemes block, no security: declaration anywhere in either file."
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: security.known_security_gaps[1]
        cite: "openapi.yaml (0 Grep matches)"
        note: "Generated SDKs silently omit auth; consumers hand-author auth glue."
    operator_visible_failure: |
      A third-party integrator generates a client, calls GET /api/dataentities, and gets a 401/302
      they did not expect because the SDK sent no credentials. Worse: under the shipped default
      auth.type=DISABLED the SAME un-authenticated SDK call SUCCEEDS in dev, so the integrator
      ships the auth-less client and it breaks only when the operator hardens the deployment to
      OAUTH2/LDAP — a failure that surfaces in production, not at integration time. The integrator
      cannot discover from the contract that an X-API-Key header is the S2S path.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    sme_consultation_recommended: true
    sme_consultation_question: "What do SDK consumers of a data-catalog REST contract (DataHub / Amundsen / OpenMetadata) expect by default from securitySchemes — is a bare http:bearer + apiKey:X-API-Key declaration the industry-canonical minimum, or do peers commonly ship openIdConnect discovery for OAuth2/LDAP-backed deployments?"
    sme_consultation_archetype: comparative

- id: H-002
  hypothesis: "When a developer reads the spec for an operation (e.g. POST /api/owners) to handle failures programmatically, the spec declares the operation's error responses (400 validation, 401/403 auth, 404 not-found, 500 internal) with a typed error-body schema, so the generated SDK emits typed exception classes."
  derivation: "Response-shape seed — every controller across batches D-X returns 4xx/5xx in production; a wire contract that is the SDK source would declare what those error responses look like."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      Only 3 of 194 operations declare ANY non-2xx response: POST /api/owners declares 403
      (openapi.yaml:172), GET /api/owners declares 500 (openapi.yaml:152), POST /api/owners/
      mapping/{owner_id} declares 403 (openapi.yaml:3433). The remaining 191 operations declare
      ONLY their 2xx happy path. There is no shared ErrorResponse component schema. The platform
      DOES return BadUserRequestException 400, NotFoundException 404, AccessDeniedException 401/403,
      and internal 5xx in production (per every controller sidecar) — but the contract is silent on
      the shape. SDK clients have no typed error model and reverse-engineer error responses from
      the running service.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: bugs_limitations_corner_cases[1]
        cite: "openapi.yaml:152, 172, 3433 (Grep '4..': -> 2; '5..': -> 1)"
        note: "Only 3 of 194 operations declare a 4xx/5xx; 191 declare only the 2xx happy path."
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: bugs_limitations_corner_cases
        cite: "IngestionController.java:82-87 + application.yml:14-15"
        note: "Corroborating runtime evidence that errors (e.g. DataBufferLimitException -> 500) are real and undeclared, on a sibling-spec endpoint."
    operator_visible_failure: |
      An SDK consumer cannot catch a typed exception per failure class — every error is an opaque
      HTTP status with an undocumented body. A client author writing retry-with-backoff cannot tell
      from the contract that a 400 (duplicate-name) is non-retryable while a 500 (transient) is — so
      they either retry everything (retry storms against permanent errors) or retry nothing (drop
      transient failures). The contract being silent forces every consumer to independently
      rediscover the error shapes, and to diverge in how they handle them.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-003
  hypothesis: "When a developer's generated SDK branches on the declared success status (e.g. expects 201 Created from a create operation like createTag / registerDataSource / registerCollector / createTerm), the running platform returns that same status, so the SDK reaches its success branch."
  derivation: "Endpoint-shape — 31 operations declare 201; a contract is only useful if the declared status is the status the server returns."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The spec declares 201 for the Create/Update families at openapi.yaml:372/400 (Tag),
      454/482 (DataSource), 558/586 (Collector), plus Term create/update, Owner, Role, Policy; the
      controllers uniformly return 200 via ResponseEntity::ok, and the tests assert isOk() — locking
      in 200. Three independent authoring streams diverged: the spec author chose 201 by REST
      convention, the controller authors chose 200 by Spring convention, the test authors locked in
      200; no review reconciled the three. An SDK client that strictly branches on isCreated()
      NEVER reaches its success branch for these operations. (The functional impact is bounded —
      both 200 and 201 are success — but a strict status-checking client treats the response as
      unexpected.) Notably the three IngestionController siblings in THIS chain are on the CORRECT
      side: ingestMetrics + postDataSetStatsList return 201 matching their spec; postDataEntityList
      is the lone ingestion drifter at 200.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: bugs_limitations_corner_cases[2]
        cite: "openapi.yaml:372, 400, 454, 482, 558, 586 (Read-verified) + Grep '201': -> 31; '200': -> 137"
        note: "Spec declares 201 for Create/Update; controllers return 200; tests lock in 200."
      - sidecar: odd-platform__java__IngestionController__controller-method__ingestMetrics
        section: concepts.invariants[2]
        cite: "IngestionController.java:94 (HttpStatus.CREATED)"
        note: "Contrast: ingestMetrics correctly returns 201 matching its (sibling) spec — shows the platform-side Create/Update drift is the anomaly, not the rule."
    operator_visible_failure: |
      A generated SDK client with strict status assertions (e.g. a Python client checking
      `response.status == 201`) raises on every successful create/update of a Tag, DataSource,
      Collector, Term, Owner, Role, or Policy — the operation actually succeeded but the client
      reports failure, causing spurious retries or surfaced errors. The reverse-direction risk:
      a future controller change to actually return 201 (to match the spec) would silently break
      every client that learned to expect 200 — the drift is bidirectionally hazardous until one
      side is reconciled.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-004
  hypothesis: "When a developer reads an UPDATE operation in the spec (e.g. updateTag, updateDataSource, updateCollector, updateQueryExample, updateTerm), the declared success response describes update semantics (200 OK 'modified' or 204 No Content) — not resource-creation semantics."
  derivation: "Endpoint-shape + response-shape — an UPDATE that modifies an existing resource is canonically 200/204; 201 Created is the POST-creates-resource shape. A mismatch confuses the contract reader about what the operation does."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      Five distinct UPDATE operations declare '201' (canonically Created) paired with a description
      that says "successfully modified/updated" (which is 200/204 semantics): updateTag
      (openapi.yaml:400), updateDataSource (:482), updateCollector (:586), updateQueryExample
      (:2156-2157), updateTerm (:2797-2799). The copy/paste is uniform across the spec — the
      authors treated 201 as the platform-wide convention for BOTH Create AND Update. The status
      code and the description contradict each other in the SAME operation. (Controllers return 200
      regardless, so the functional impact is in spec-metadata clarity, not runtime behaviour.)
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: bugs_limitations_corner_cases[3]
        cite: "openapi.yaml:400, 482, 586, 2156-2157, 2797-2799 (each Read-verified)"
        note: "5 UPDATE operations carry '201' + a 'successfully modified' description — internally contradictory."
    operator_visible_failure: |
      A developer reading updateTerm sees status 201 ('a resource was created') next to 'The
      resource has been successfully modified' — and cannot tell whether the operation creates or
      mutates. A code-generation tool that maps 201 to a 'created' return type produces a misleading
      SDK signature for an update. This is the lowest-severity of the status-code family (it is a
      metadata self-contradiction, not a runtime drift), but it compounds H-003: it shows the 201
      choice was an authoring confusion, not a deliberate REST stance.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-005
  hypothesis: "When a developer reads the getMyObjectsWithUpstream / getMyObjectsWithDownstream operation summaries to understand what GET /api/dataentities/my/upstream returns, the summary accurately describes the response — and a developer building a multi-tenant integration can trust the stated semantic ('data entities owned by current user with upstream dependencies')."
  derivation: "Response-shape + cross-pillar — the spec summary is the load-bearing description a developer reads; a summary that inverts the implementation misleads every consumer, and the multi-tenant trust implication is security-relevant."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The summary at openapi.yaml:842-857 states "Returns list of data entities owned by current
      user with upstream dependencies" (symmetric at 860-878 for downstream). The implementation
      returns the INVERSE — the NON-owned entities reachable from the owned set
      (DataEntityRelationsServiceImpl.java:37 explicitly EXCLUDES the owned set via
      Predicate.not(oddrns::contains)), confirmed by 4-angle triangulation (spec / service /
      repository SQL / controller-method) in DOC-GAP-099. The spec summary is the LOAD-BEARING
      single source of the misframe. The UI label "Upstream dependents" is semantically accurate;
      the spec contradicts both the code and the UI.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: bugs_limitations_corner_cases[5]
        cite: "openapi.yaml:842-878 + DataEntityRelationsServiceImpl.java:25-39"
        note: "Spec summary is the inverse of the implementation; 4-angle confirmed (DOC-GAP-099)."
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: security.known_security_gaps[2]
        cite: "openapi.yaml:842-878 (cross-link DOC-GAP-099 batch-M)"
        note: "SDK clients in multi-tenant deployments assume tenant isolation that does not exist."
    operator_visible_failure: |
      A developer building a multi-tenant integration reads 'owned by current user' and assumes
      the endpoint is tenant-scoped — they expose it to a tenant believing it returns only that
      tenant's owned entities. In reality it returns the NON-owned reachable set, leaking the
      existence + identity of entities the calling user does NOT own (cross-tenant data exposure in
      a multi-tenant deployment). The contradiction is the highest-leverage class because the
      developer is actively misled by the canonical description into a security-relevant wrong belief.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-006
  hypothesis: "Because the spec is the source of truth for the path a client hits, the platform's authorization rules are keyed on that same path — so when a client POSTs to the spec-declared /api/dataentities/{id}/terms to link a term, the DATA_ENTITY_ADD_TERM permission gate fires and an unauthorized user is rejected."
  derivation: "Negative-space + cross-pillar (P-09 gates every mutation) — a contract whose path is authoritative for the client must be authoritative for the security rule too; a divergence is a silent bypass."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The spec declares the term-link path as PLURAL: /api/dataentities/{data_entity_id}/terms
      (openapi.yaml:973) and /api/dataentities/{data_entity_id}/terms/{term_id} (openapi.yaml:1042)
      — this is the URL clients actually hit (correctly). But SecurityConstants.java:237-242
      registers PathPatternParserServerWebExchangeMatcher entries for the SINGULAR /term and
      /term/{term_id}. The matcher never matches the live plural path; the SecurityRule never
      fires; the SecurityWebFilterChain falls through to .authenticated(). Result: ANY authenticated
      user under LOGIN_FORM/OAUTH2/LDAP can link OR unlink any term to any data entity regardless of
      DATA_ENTITY_ADD_TERM / DATA_ENTITY_DELETE_TERM. The SPEC SIDE IS CORRECT — and that is exactly
      what makes the SecurityConstants drift silent and load-bearing (REFACTOR-217: the remedy is to
      fix SecurityConstants to match the spec, not the reverse).
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: bugs_limitations_corner_cases[6]
        cite: "openapi.yaml:973 + openapi.yaml:1042 (PLURAL) vs SecurityConstants.java:237-242 (SINGULAR)"
        note: "Spec plural path is the client-hit URL; SecurityConstants singular registration never matches; gate silently skipped."
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: security.known_security_gaps[3]
        cite: "openapi.yaml:973, 1042 + REFACTOR-217 cross-link"
        note: "Direction matters: spec is correct, security rule is wrong; a build-time path-parity validator would catch the whole class."
    operator_visible_failure: |
      An operator who configures Policies to restrict term-linking to a curator role discovers — or
      worse, never discovers — that ANY authenticated user can link/unlink any term to any entity.
      The catalog's glossary-linkage integrity is unprotected for an unknown number of releases. The
      failure is invisible from the spec (the spec is right) and invisible from a permission-model
      read (the permission exists) — it surfaces only when someone diffs the spec path against the
      SecurityConstants path. This is the canonical 'each layer locally consistent, the gap lives
      only at the cross-layer seam' finding the reflection layer exists to surface.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-007
  hypothesis: "When a developer reaches the platform's Swagger UI at {platform-base-url}/api/v3/api-docs, access is gated by the platform's configured authentication so the full 194-operation API surface is not exposed to unauthenticated network callers."
  derivation: "Negative-space + pillar (P-09 security posture) — a contract surface that enumerates every operation + DTO is a reconnaissance target; a security-conscious platform would gate it under non-DISABLED auth."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      Under auth.type=DISABLED (the shipped dev default per system-mission.md P-09) the spec URL is
      reachable unauthenticated — this is the intentional dev posture. Under LOGIN_FORM/OAUTH2/LDAP
      the reachability is NOT specified by the spec or the doc, and is not enumerated in-repo: the
      4-cell matrix (auth.type x /api/v3/api-docs reachable?) is undocumented. /api/v3/api-docs is
      under /api/** (NOT under the /ingestion/** whitelist), so its reachability depends on each
      auth-mode's SecurityWebFilterChain wiring — which the workspace has not enumerated. So the
      hypothesis is TRUE-by-intent under DISABLED and UNKNOWN under the production modes. The full
      surface (operation IDs, paths, DTO shapes, and the contributor email
      ndementev@provectus.com at openapi.yaml:5-9) is the easiest reconnaissance target before any
      authentication when the URL is reachable.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: security.known_security_gaps[0]
        cite: "openapi.yaml:1-49 + security.data_exposure[0,2]"
        note: "Spec served at /api/v3/api-docs; unauthenticated under DISABLED; reachability under other modes unspecified; exposes full surface + a personal email."
    operator_visible_failure: |
      An operator who hardens the UI to OAUTH2 expecting the whole platform to be gated may leave
      /api/v3/api-docs reachable (it is under /api/**, and the matrix is undocumented), exposing the
      complete API surface + DTO shapes + a contributor's personal email to unauthenticated
      reconnaissance. The gap is a known-but-undocumented posture: the maintainer-facing remedy
      (a feature-level auth.swagger.enabled toggle) is already tracked (PLT-046), but the
      operator-facing 4-cell reachability matrix is not documented anywhere — so an operator cannot
      verify their own posture without reading SecurityConstants.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: caveat-candidate

- id: H-008
  hypothesis: "When a developer authors a Query Example programmatically via the spec'd API (POST .../queryExample with a QueryExampleFormData body), they can set the example's name/title — the same name the UI shows in the Query Examples catalog list."
  derivation: "Endpoint-shape — the UI lists query examples by a short label; a contract that is what programmatic clients build against should expose the field that populates that label."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      QueryExampleFormData (components.yaml:2799-2808) declares required [definition, query] and NO
      name field. QueryExampleRef (components.yaml:2729-2742) and QueryExample
      (components.yaml:2757-2776) similarly have NO name field. The UI shows query examples by some
      short label, but the spec'd authoring API cannot set a name — a programmatic client building
      against the contract cannot author a named query example. This is a feature-shape gap: the
      spec is what programmatic clients build against, and the field a UI user can set is simply
      absent from the contract.
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: bugs_limitations_corner_cases[4]
        cite: "components.yaml:2729-2776, 2799-2808 (Read-verified; no name: property in any of the 3 QueryExample-family schemas)"
        note: "No name field on QueryExampleFormData / QueryExampleRef / QueryExample."
    operator_visible_failure: |
      A developer building a 'bulk-import our team's canonical SQL snippets' integration against the
      spec'd API produces query examples that cannot carry a human-readable name — the catalog list
      shows them by definition text or a blank label, degrading the very discoverability the Query
      Examples feature exists to provide. The programmatic surface is strictly weaker than the UI
      surface for the same feature, with no contract signal that the field is missing on purpose.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-009
  hypothesis: "When a developer reads the operationId createDataEntityTagsRelations, the CRUD verb 'create' accurately names the operation's semantic — it ADDS tag relations to a data entity without removing existing ones."
  derivation: "Endpoint-shape (operationId naming) — an operationId is the primary handle an SDK consumer reasons about; a 'create' verb that actually replaces-all is a contract surprise."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The operationId createDataEntityTagsRelations (openapi.yaml:867-925 area) names a 'create'
      operation, but the controller semantic is replace-all-internal-tags (per the
      createDataEntityTagsRelations sidecar + DOC-GAP-098). A POST that the developer believes ADDS
      tags actually REPLACES the entity's full internal-tag set — tags not present in the request
      are removed. The operationId actively misleads about the CRUD semantic. (The true semantic IS
      reachable by reading the operation body, so this is lower severity than an inverted summary —
      but the operationId is the handle most SDK consumers read first.)
    evidence:
      - sidecar: odd-platform__openapi__spec__odd-platform-public-api
        section: docs_link_semantic.doc_drift_findings[5]
        cite: "openapi.yaml:867-925 area + createDataEntityTagsRelations.md (DOC-GAP-098)"
        note: "operationId 'create' but the controller semantic is replace-all-internal-tags."
    operator_visible_failure: |
      A developer calling createDataEntityTagsRelations with the one new tag they want to add
      silently DELETES every other internal tag on that entity — a destructive replace masquerading
      as an additive create. This is the same shape as the createEnumValue mis-naming (PLT-029,
      enum-values locus) but on the internal-tags locus; the UI avoids the trap by always sending
      the full set, leaving direct API consumers as the only victims.
    severity: MEDIUM
    confidence: MEDIUM
    routes_to_finding: bug-candidate

