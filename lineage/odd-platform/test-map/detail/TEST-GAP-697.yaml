behaviour: |-
  **`DataSourceIngestionServiceImpl` SILENTLY DROPS PAYLOAD `namespace_name` — every datasource registered through `/ingestion/datasources` inherits the Collector's namespace; the payload's namespace_name field is NEVER read.** Line 106 hardcodes namespace_id to `MappingUtils.extractFieldFromNullableObject(c.namespace(), NamespacePojo::getId)` — extracted from the matched Collector, NEVER from the payload. A custom-collector author following the OpenAPI contract sets `namespace_name = "my-team"` and expects the datasource to land under `my-team`; in reality it lands under the Collector's pre-configured namespace. No log, no warning, no UI surface. The protective invariant (a stolen Collector A token cannot register datasources into Collector B's namespace) is the intentional side; the SILENT DROP is the operational caveat. Per REFACTOR-424. The existing `DataSourceIngestionServiceTest` (lines 60-93) creates a CollectorDto with `new NamespacePojo()` (line 78) — a NamespacePojo with `id = null` — and uses the simple `DataSource().oddrn(...).name(...)` payload (lines 100-105) WITHOUT any namespace field. A regression that READ namespace_name from the payload would NOT be caught: the existing test would still pass (because the assertion only checks oddrn + name via the DataSource contract model).
