proposed_action: |-
  Add `DatasetFieldResponseCodeSpecDriftTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `updateDescription_returnsHttp200NotSpecDeclared201` — PUT `/api/datasetfields/{id}/description`; assert `response.status() == 200` (NOT 201 as declared by openapi.yaml:2465). PIN the current drift.
  2. `updateInternalName_returnsHttp200NotSpecDeclared201` — sister test on the internal-name endpoint.
  3. `updateDatasetFieldTags_returnsHttp200NotSpecDeclared201` — sister test on the tags endpoint.
  4. `createEnumValue_returnsHttp201_pinsCorrectContract` — pin the POSITIVE asymmetry: POST `/api/datasetfields/{id}/enum_values`; assert HTTP 201 (the spec and the code agree).

  Add a `// REGRESSION-PIN — Spec/code response-code drift on three PUT endpoints: controller returns 200, OpenAPI declares 201. Asymmetric with the POST endpoint which correctly returns 201. A REFACTOR aligning the controller with the spec (200 → 201) will break tests #1, #2, #3; a REFACTOR aligning the spec with the controller (201 → 200) requires regenerating client SDKs. The maintainer must coordinate the choice + the SDK regeneration.` comment block.

  Pair with REFACTOR-NNN: decide controller-aligns-to-spec (the spec is canonical) vs spec-aligns-to-controller (the controller is the actual contract); pair with DOC-NNN.
