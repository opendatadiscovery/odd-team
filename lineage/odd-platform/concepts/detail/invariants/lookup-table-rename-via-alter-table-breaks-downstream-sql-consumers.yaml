mitigations_unimplemented:
  - |-
    Layer 2 — preserve the old name as a SQL VIEW pointing at the new name.
    The rename DDL chain becomes:
      ALTER TABLE old_name RENAME TO new_name
      CREATE OR REPLACE VIEW old_name AS SELECT * FROM new_name
    Operator-owned cleanup via a separate DROP VIEW endpoint OR via direct
    SQL.
  - |-
    Layer 3 — operator warning at rename time. The UI rename dialog should
    surface: 'Renaming this table will change the physical PG table name
    from X to Y. Downstream SQL consumers that hardcoded X will break.
    Confirm?' Pair with a doc admonition on the P-03 live page.
  - |-
    Doc admission — disclose the rename behaviour on the
    /features/master-data-management/lookup-tables live page. Three doc-NNN
    candidates flow from this finding alone (rename behaviour, collision risk,
    cascade behaviour on delete).
  - |-
    Audit-trail enhancement — emit a new ActivityEvent type LOOKUP_TABLE_RENAMED
    capturing the old + new names. The Lookup Table IS a Data Entity, so
    the activity table CAN hold the event (per F-006 schema-rooted
    constraint).
  - |-
    Regression test — assert the rename behaviour: PUT a lookup table's
    name, fetch the new name, query the old name via direct SQL, assert
    'relation does not exist'. Pin the current behaviour as a regression
    boundary until the Layer-2 view-preservation lands.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20V from the
  ReferenceDataController class-level sidecar. The finding identifies a
  silent operational data-loss vector at the Lookup Tables rename surface —
  combined with the doc-side silence (the P-03 page positions direct
  PostgreSQL JOINs as the primary use case but does not warn about rename
  consequences), the failure mode is invisible to operators until downstream
  pipelines fail.

  Cross-cutting connections:
    - Companion finding: lookup-table-cascade-orphan-on-data-entity-delete
      (the parent DataEntity soft-delete leaves orphan physical tables —
      mirror-image issue at the delete surface)
    - Sibling finding: tableName-collision-no-pre-check (the lossy
      normalisation creates ambiguous physical names)
    - Doc-drift: the P-03 master-data-management.md page positions Lookup
      Tables as the canonical operator-curated reference-data surface for
      BI tools; the rename behaviour breaks the load-bearing use case
    - F-006 audit-silence: rename has NO @ActivityLog at the service tier;
      operators cannot reconstruct 'who renamed which Lookup Table when'
      from the activity feed (the LOOKUP_TABLE_RENAMED event type does not
      exist in ActivityEventType)
    - Cross-tier consistency: the rename couples catalog-metadata + physical
      table; a partial failure (catalog renames, DDL fails) is theoretically
      possible per the no-transactional-consistency finding (separate
      bugs_limitations_corner_cases.[4] in the sidecar)

  Four DOC-NNN candidates flow:
    (a) Code fix Layer 2 — view-preservation on rename
    (b) UI rename-confirmation dialog
    (c) Doc admission on the P-03 live page
    (d) Audit event LOOKUP_TABLE_RENAMED
