behaviour: |-
  **HIGH — Unreachable Slack/Webhook URL hangs the WAL consumer thread indefinitely.** `HttpClient.newHttpClient()` at `NotificationConfiguration.java:32` does NOT set a `connectTimeout`. `HttpRequest.newBuilder()` at `WebhookNotificationSender.java:20` AND `SlackNotificationSender.java:43` do NOT set a `.timeout(Duration)`. The underlying JDK socket-level timeout (system-dependent, typically 75-120s on Linux for SYN retries; potentially unbounded for half-open connections) is the effective ceiling.

  **The cascade failure**:
  1. Operator configures `notifications.receivers.webhook.url=https://webhook.unreachable.example/`.
  2. The DNS resolves but TCP connect hangs (deeply-broken endpoint, transparent proxy that drops without RST, firewall DROP rule).
  3. ODD fires an alert.
  4. The dispatcher invokes `webhookSender.send(message)` on the WAL consumer thread.
  5. `HttpClient.send(...)` blocks at the socket layer.
  6. **The WAL consumer thread is the SINGLE consumer for the entire cluster** (leader-elected single-thread per `NotificationSubscriberStarter.java:21-23`).
  7. Subsequent alerts queue in the WAL replication slot.
  8. After 75-120s (Linux default SYN retry timeout), the IOException finally surfaces.
  9. The dispatcher catches NotificationSenderException, moves to next sender, the WAL LSN advances.
  10. The next alert's webhook delivery repeats the cycle: 75-120s hang per alert.

  **Cluster-wide alert latency** under an unreachable webhook URL: **>75 seconds per alert**, with the WAL replication slot accumulating WAL bytes throughout. For a busy DQ-pipeline producing alerts at 1/minute, the platform falls behind by 75/60 = 1.25× real-time — the slot grows unboundedly until the operator notices.

  **The same pathology affects Slack** (`SlackNotificationSender` uses the same shared `HttpClient` bean — `NotificationConfiguration.java:31-34`). The two channels are NOT independently timeout-tunable; both depend on JDK socket defaults.

  **Compound with TEST-GAP-462** (sequential synchronous fan-out): even when only ONE channel is unreachable, all OTHER channels for that alert are blocked until the unreachable channel's timeout. A platform with all three channels enabled and one unreachable URL is effectively delivering alerts at 1/75s on the working channels.

  **No operator-tunable knob**: there is no `notifications.receivers.{slack|webhook}.connect-timeout-ms`, no `.request-timeout-ms`, no `.read-timeout-ms`. The only way to tune is to swap the `HttpClient` bean wholesale, which requires code modification.

  **Test gap shape**: regression-pin asserting that an unreachable URL causes the dispatcher thread to block for at least 30 seconds before surfacing the IOException. PINS the current vulnerability; pairs with REFACTOR-NNN adding per-channel timeouts.
