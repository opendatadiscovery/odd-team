security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - DISABLED
    - LOGIN_FORM
    - OAUTH2
    - LDAP
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      No @PreAuthorize on DataEntityRunController; no programmatic
      permissionService.hasPermission(...) call in the service; no
      owner predicate in ReactiveDataEntityTaskRunRepositoryImpl.
      No entry in SecurityConstants.SECURITY_RULES (verified by
      grep over SecurityConstants.java:98-355 returning zero matches
      for `/runs`). The catch-all `pathMatchers('/**').authenticated()`
      at AuthorizationCustomizer.java:29-30 is the entire gate.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      ReactiveDataEntityTaskRunRepositoryImpl.getDataEntityRuns
      (lines 161-191) filters only on DATA_ENTITY.ID.eq(dataQualityTestId)
      and optionally STATUS.eq(...); NO ownership JOIN, NO filter by
      the calling user's owners. 5th invocation site of REFACTOR-024
      cross-owner-read family.
  strengths:
    - |-
      Reactive Mono signature throughout — non-blocking I/O from the
      platform's perspective; success always emits 200 OK via .map(ResponseEntity::ok).
    - |-
      Entity-class gate at the SERVICE tier (`checkIfDeClassSupposedToHaveRuns`)
      rejects non-transformer / non-quality-test entities with
      BadUserRequestException (400) — typed error, not a generic 500.
    - |-
      404 (NotFoundException) on missing entity via `.switchIfEmpty` —
      clear error contract for the absent-id path.
  weaknesses:
    - |-
      Cross-owner read posture undocumented at the runs-history surface;
      status_reason free-form text from test frameworks may carry PII
      (failed-row samples for Great Expectations) and is broadcast to
      every authenticated user across the catalog (severity HIGH).
    - |-
      Wire enum vs DB enum asymmetry — DataEntityRunStatus declares 6
      values, DB accepts 7 (includes RUNNING). The DataEntityRunMapper
      flat-maps String→wire enum via MapStruct's Enum.valueOf which
      throws on unknown literals — runs-history returns HTTP 500 for
      any result set containing a RUNNING row, exactly while a test
      is in flight (severity HIGH).
    - |-
      Size parameter unbounded — components.yaml:4222-4229 declares
      int32 with no min/max; the controller passes through verbatim
      to SQL LIMIT (severity MEDIUM — DoS vector via single large
      page request).
    - |-
      Under auth.type=DISABLED, the runs-history endpoint is anonymously
      reachable; no fail-closed behaviour (severity LOW — DISABLED is
      dev-only per docs).
  cross_file_inconsistencies: []
  contributing_files:
    - DataEntityRunController.md
  evidence:
    - DataEntityRunController.md:security.known_security_gaps.[0-2]
    - DataEntityRunController.md:bugs_limitations_corner_cases.[1,5] (HIGH severity)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      List query runs synchronously per request, paginated, no cache:
      SELECT data_entity_task_run.* FROM data_entity_task_run JOIN
      data_entity ON data_entity.oddrn = data_entity_task_run.task_oddrn
      WHERE data_entity.id = ? AND status = ? ORDER BY end_time DESC
      LIMIT ? OFFSET ?. Plus a `SELECT COUNT(*)` over the base query
      for pageInfo.total. Two DB round-trips per request.
      (ReactiveDataEntityTaskRunRepositoryImpl.java:170-191)
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      One paginated fetch per request. No bulk / batch variant. The
      InfiniteScroll consumer accumulates pages client-side; a user
      scrolling through 1000 runs triggers 10 round-trips.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      Pagination declared but UNCONSTRAINED — size has no upper bound;
      a single request with size=1000000 reaches the LIMIT clause as-is.
      Combined with no rate limit, operator with high-volume DQ
      ingestion + large size param can sustain DB pressure.
  strengths:
    - |-
      Reactive Mono/Flux signature — non-blocking I/O; each request
      consumes one Postgres connection from the reactive pool for the
      duration of the two queries.
    - |-
      Stateless controller — instances scale horizontally; bottleneck
      is the DB tier, not API CPU.
  weaknesses:
    - |-
      size parameter unbounded (severity MEDIUM) — a deliberately-crafted
      curl with size=10000000 attempts to materialise 1M rows through
      JOOQ + MapStruct + Jackson serialisation.
    - |-
      Two-query pattern per request (data + COUNT subquery) — the COUNT
      subquery is unnecessary if hasNext could be computed from LIMIT
      size+1 peek (severity LOW — premature optimisation at scale).
    - |-
      No caching at controller / service layer — popular DQ tests with
      stable history re-run the same query per page-load (severity LOW).
  cross_file_inconsistencies: []
  contributing_files:
    - DataEntityRunController.md
  evidence:
    - DataEntityRunController.md:performance.hot_paths.[0]
    - DataEntityRunController.md:performance.known_performance_gaps.[0-2]
