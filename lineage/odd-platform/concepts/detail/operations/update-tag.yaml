security_aggregate:
  overall: MEDIUM
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
  ingestion_filter_relevance: NO
  authorization_consistency:
    verdict: CONSISTENT
    detail: |-
      Gated at the controller perimeter via SecurityConstants.SECURITY_RULES
      (TAG_UPDATE, Management scope, NO_CONTEXT). NO @PreAuthorize on the
      method; the service tier has zero @PreAuthorize and zero programmatic
      permission checks — controller-perimeter-only is the consistent
      platform shape.
  owner_scoping:
    verdict: N/A
    detail: The tag table has no owner_id column; any caller holding TAG_UPDATE can rename any tag.
  strengths:
    - |-
      `!external` guard prevents UI users from renaming Collector-set tags
      (cross-method consistent with delete + updateRelationsWithDataEntity).
    - |-
      @ReactiveTransactional boundary — the rename + triple FTS refresh
      run atomically; search-index consistency is part of the awaited
      response, not fire-and-forget.
  weaknesses:
    - |-
      MEDIUM — service-tier zero-checks posture — the controller perimeter
      is the SOLE authorisation defence; a /api/tags/{tag_id} path rename
      (REFACTOR-217 class) silently bypasses TAG_UPDATE.
    - |-
      MEDIUM — no audit log on the rename path — updateTag produces no
      Activity Feed entry; a malicious or mistaken rename of a widely-used
      tag is untraceable.
    - |-
      MEDIUM — the `!external` guard reads only the tag_to_data_entity
      aggregate, never tag_to_dataset_field origins — a tag with EXTERNAL
      dataset-field relations is renamable by a UI user.
    - |-
      LOW — no request-body validation on the tag-name shape — arbitrary
      content is accepted and propagates into FTS vectors.
  cross_file_inconsistencies:
    - |-
      The openapi-tag tag sidecar and the updateTag method sidecar agree
      on the 200-vs-201 status-code drift — corroborating, no conflict.
  contributing_files:
    - updateTag.md
    - openapi-tag__tag.md
  evidence:
    - 'updateTag.md:security.authorization_assertions'
    - 'updateTag.md:security.known_security_gaps'

performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - |-
      Runs once per Management -> Tags edit action — low frequency
      relative to the read path. The per-call cost is dominated by
      updateSearchVectors. odd-platform java TagController controller-method:updateTag
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      PUT /api/tags/{tag_id} takes one id; there is no bulk-update
      endpoint (the bulk shape exists only for createTag).
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: |-
      Stateless controller; no row-level locking on the write path —
      concurrent renames of the same tag race to last-write-wins
      (no version column).
  weaknesses:
    - |-
      LOW — updateTag runs three concurrent search-vector update queries
      on EVERY edit, even a trivial important-flag flip with no name
      change; there is no name-changed short-circuit.
    - |-
      LOW — the FTS-upsert cost is unbounded in the tag's usage breadth —
      renaming a tag attached to a very large number of entities triggers
      a proportionally large search_entrypoint upsert inside the request
      transaction.
  contributing_files:
    - updateTag.md
  evidence:
    - 'updateTag.md:performance.hot_paths'
    - 'updateTag.md:performance.known_performance_gaps'

notes: |-
  CAPTURED batch X-TAGGING (2026-05-21). updateTag is the
  search-index-consistent counterpart to the asymmetric delete path —
  it correctly refreshes all three FTS vectors. The asymmetry the
  `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
  invariant captures is a delete-side gap; updateTag is the
  well-behaved sibling.

  Cross-cutting connections:
    - Pairs with the Tag entity (lifecycle)
    - Pairs with `create-tag` (the create counterpart)
    - Pairs with `delete-tag-with-asymmetric-cascade` (the delete
      counterpart — the search-vector-asymmetric sibling)
    - Pairs with `get-popular-tag-list` (the read counterpart)
    - Pairs with `external-relations-immutable-to-ui-users-cross-method-guard-tagserviceimpl`
      (the !external guard at step 2)
    - Pairs with `tagserviceimpl-asymmetric-search-vector-refresh-update-3-delete-1`
      (update is the 3-refresh side of that asymmetry)
    - Pairs with `openapi-200-vs-201-status-code-drift-codebase-wide`
      (the status-code drift)
