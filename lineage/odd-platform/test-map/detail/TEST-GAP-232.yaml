gap_id: TEST-GAP-232
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java PolicyController controller-method:createPolicy
surfaced_by:
- createPolicy.md:tests_coverage_semantic.gaps (audit-log absence)
behaviour: Policy creation is NOT audit-logged. PolicyServiceImpl.create (lines 62-69)
  has no `log.info/warn/audit` call (verified by reading end-to-end). The `policy`
  table's row-history is single-state — there is no `policy_audit` / `policy_history`
  companion table and no append-only log of (who, when, what JSON). A security incident
  review of 'a MANAGEMENT/ALL policy named X was created on date Y — who authored
  it?' cannot be answered from the running platform. Same shape as TEST-GAP-221 (Role)
  and TEST-GAP-238 (Owner).
