proposed_action: |-
  Integration test. (1) Snapshot current `title` table row count N. (2) POST /api/dataentities/{id}/ownership with `title_name: 'XPYZ_typo_strict'` (a novel string). (3) Assert HTTP 200. (4) Query `SELECT count(*) FROM title` returns N+1. (5) Repeat with 100 unique title_name strings; assert directory grew to N+101 (no de-dup at the auth tier). LOCKS the unconstrained-growth contract; promotes to a fix-required regression when TITLE_CREATE permission OR title allowlist lands.
