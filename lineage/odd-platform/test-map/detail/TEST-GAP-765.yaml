proposed_action: |-
  Add `TagExternalRelationsGuardTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `updateTag_withTagToDataEntityExternalTrue_returns400_pinsUpdateGuardOnDataEntityRelation` — seed a tag with a `tag_to_data_entity` row where `external = true`; PUT `/api/tags/{tag_id}`; assert HTTP 400 with body containing "Can't update tag which has external relations".
  2. `deleteTag_withTagToDataEntityExternalTrue_returns400_pinsDeleteGuardOnDataEntityRelation` — same setup; DELETE; assert 400 with body containing "Can't delete tag which has external relations".
  3. `updateTag_withAllRelationsExternalFalse_succeeds_pinsGuardScopedToExternalTrue` — seed a tag with `tag_to_data_entity` row `external = false`; PUT; assert HTTP 200. PIN that the guard ONLY blocks external-true.
  4. `deleteTag_afterCollectorReleasesExternalRelation_unblocksDeletion_pinsSoftLockSemantic` — seed `external = true`; simulate collector removing the external relation (DELETE the tag_to_data_entity row); DELETE the tag; assert HTTP 200. PIN the soft-lock release.

  Pair with DOC-NNN: surface the !external guard on the Tagging doc; explain when operators see the canonical error messages.
