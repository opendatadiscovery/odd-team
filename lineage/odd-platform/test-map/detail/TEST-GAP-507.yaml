behaviour: |-
  404-conflation regression-pin for getDataEntityGroupsLineage (MEDIUM — P-05). `NotFoundException("Data entity group", dataEntityGroupId)` at `LineageServiceImpl.java:62` fires when: (a) the DEG ID does not exist, (b) the ID references a non-DEG-typed entity, OR (c) the DEG exists but has zero non-soft-deleted members. The SQL CTE at `ReactiveGroupEntityRelationRepositoryImpl.java:177-204` selects from `group_entity_relations` keyed on the entity's oddrn — for cases (a) and (b) the inner subquery `DSL.select(DATA_ENTITY.ODDRN).from(DATA_ENTITY).where(DATA_ENTITY.ID.eq(dataEntityGroupId))` either returns no row OR returns the wrong-typed oddrn, and the outer recursive CTE returns empty in both cases. The error message is identical for all three: 'Data entity group {id} doesn't exist'. Operators debugging 'why is my DEG-lineage call returning 404?' cannot discriminate between: (i) the DEG doesn't exist (their fault — wrong ID), (ii) the entity exists but isn't a DEG (misleading), (iii) the DEG exists but has no members (legitimate empty state arguably should be 200 with empty items). The live API-reference docs treat this as a single error condition; the code surface treats it as three. NO test pins the conflation, so a future refactor splitting the conditions (e.g. returning 200/[] for case (c) and 404 only for (a)/(b), or differentiating (b) with a distinct error code) has no regression anchor.
