behaviour: |-
  **Three PUT endpoints on `DatasetFieldController` return HTTP 200 — but the OpenAPI spec declares HTTP 201.** The spec/code drift affects:

  - `PUT /api/datasetfields/{id}/description` — spec at `openapi.yaml:2465` declares `'201': description: OK`; controller returns `ResponseEntity::ok` (`DatasetFieldController.java:42`) = HTTP 200.
  - `PUT /api/datasetfields/{id}/name` — spec at `openapi.yaml:2488` declares 201; controller returns 200 (line 52).
  - `PUT /api/datasetfields/{id}/tags` — spec at `openapi.yaml:2511` declares 201; controller returns 200 (line 62).

  **Notable asymmetry** (per `DatasetFieldController.md:bugs_limitations_corner_cases.[5]`): the `POST /enum_values` endpoint CORRECTLY returns HTTP 201 (`HttpStatus.CREATED` at line 71) matching the spec at `openapi.yaml:2549`. So only the three PUTs drift; the POST does not. The drift implies the controller author followed the spec for one endpoint but not the others.

  **Operator-visible failure modes**:
  - Generated client SDKs (Python, Go, Java) generated FROM the OpenAPI spec branch on the declared response code. An SDK that branches `if (response.status == 201) { /* parse body */ } else { /* error */ }` will silently mishandle the 200 success path — falling into the error branch, possibly retrying, possibly raising an unmodeled exception.
  - Reverse-proxy / API gateway logging that filters by 2xx subgroup boundaries.
  - Operator-facing API documentation generated from the OpenAPI spec advertises 201 — operator testing in curl sees 200 and assumes a documentation bug.

  **Why MEDIUM not HIGH**:
  - Both 200 and 201 are 2xx success; the practical impact is limited to SDK-consumer correctness.
  - The fix is trivial — change `ResponseEntity::ok` to `ResponseEntity::created` (or update the spec to 200). The choice is the question: spec or code is the source of truth?
  - The asymmetry (POST 201 ok, PUTs 200 drift) suggests the spec is the source-of-truth and the PUTs should follow `ResponseEntity::created`.

  No test pins the current drift. A regression-pin test asserting "200 on PUT" locks the current state; a fix flipping the assertion locks the intent.
