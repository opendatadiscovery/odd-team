- id: H-011
  hypothesis: |-
    When the operator double-clicks Regenerate (slow network, impatient click) or
    re-opens the dialog and confirms twice in quick succession, the system rotates
    the token exactly once — it does not silently issue a second token that
    invalidates the one the operator just copied.
  derivation: |-
    Endpoint-shape — the PUT is not idempotent and the UI has no pending-guard on
    the dispatch; a user reasonably expects one confirmed action = one rotation.
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      The ConfirmationDialog spinner blocks a second confirm WITHIN one open
      dialog instance (ConfirmationDialog.tsx:24-35), but the component places NO
      pending-guard on the dispatch itself and nothing stops the operator closing
      and re-opening the dialog, or — once the row re-masks — clicking Regenerate
      again (DataSourceItemToken.tsx:29-30). The backend PUT is NOT idempotent:
      each call mints a fresh random token and overwrites the row (last-write-
      wins, no @Version, no If-Match) per the regenerateDataSourceToken backend
      sidecar resource_boundaries. No DB corruption results, but the observable
      defect is that the operator can copy a token (from response 1) that
      response 2 has already invalidated. The exact behaviour under a fast
      double-confirm-across-reopen requires runtime (the source sidecar emits
      P-050 concurrency + P-082 confirm-flow as PROBE-NEEDED for exactly this).
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataSourceItemToken.md
        section: resource_boundaries (idempotency) + bugs_limitations_corner_cases[3]
        cite: "DataSourceItemToken.tsx:29-30 + ConfirmationDialog.tsx:24-35"
        note: "No dispatch-level pending guard; spinner is dialog-scoped only."
      - sidecar: odd-platform__java__DataSourceController__controller-method__regenerateDataSourceToken.md
        section: stress_findings.resource_boundaries (P-050)
        cite: "ReactiveTokenRepositoryImpl.java:33-36 (no version predicate)"
        note: "Non-idempotent PUT; last-write-wins; loser keeps an invalid token."
    operator_visible_failure: |-
      If a double-confirm does issue two rotations, the operator copies the token
      from the first 200 response, but only the second (later-committed) token
      actually authenticates ingestion — so the carefully-copied credential is
      already dead, and the operator discovers this only when the collector 401s.
      Verdict held at probe-needed because whether the dialog spinner + the
      re-mask timing actually permit a fast second rotation from the UI is not
      statically provable; it is a headless-browser question.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-163-1
    routes_to_finding: probe-needed
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: probe

## cross_references

### bug_candidates
- hypothesis_id: H-004
  severity: HIGH
  one_line: |-
    The Regenerate confirmation dialog (both surfaces) ships verbatim "Are you
    sure?" text and never warns that rotation instantly kills the old token and
    breaks running collector ingestion until redeploy.
  dedup_status: net_new
  distinct_from: PLT-108
  distinct_reason: |-
    PLT-108 (+ PLT-087) is the BACKEND mechanic (in-place UPDATE, no grace
    window, plaintext, not audit-logged) and proposes a backend grace-window /
    hashing / audit fix. DOC-252 (done) + DOC-255 are the DOC caveats. NONE of
    them is the UI-tier defect: the in-product ConfirmationDialog at the point of
    decision carries no consequence warning. This is the F-163 cross-surface
    UI-affordance finding — a richer dialog body (the consequence + a planned-
    redeploy checkbox), mirroring the DELETE pattern's explicit-consequence text.
  recommended_log_as: upstream-issue
  proposed_fix_anchor: |-
    DataSourceItemToken.tsx:37-49 + CollectorItemToken.tsx:37-49 — add
    additionalContent to the ConfirmationDialog listing the three consequences
    (old token dies now; running collector 401s; redeploy required), applied to
    BOTH surfaces in one change.

- hypothesis_id: H-005
  severity: MEDIUM
  one_line: |-
    The one-time plaintext reveal + warning banner are discarded on the next list
    refetch with no acknowledgement/copy-confirm, so a distracted operator can
    lose the only copy of a credential and must destructively re-rotate to recover.
  dedup_status: net_new
  recommended_log_as: upstream-issue
  proposed_fix_anchor: |-
    DataSourceItemToken.tsx:25-27,51-53 + DataSourceItem.tsx:110-121 — persist the
    reveal until explicit dismiss/acknowledge (parent-owned state, not derived
    from token mask state), OR move the reveal to a non-dismissable modal that is
    the copy surface. Apply to the Collector sibling.

- hypothesis_id: H-007
  severity: MEDIUM
  one_line: |-
    Masked/plaintext detection is a verbatim-replicated substring('******') sniff
    on both surfaces with no shared constant and no server isMasked field — a
    future backend mask-format change silently breaks the one-shot reveal on both
    tabs at once.
  dedup_status: net_new
  recommended_log_as: upstream-issue
  proposed_fix_anchor: |-
    Server-side: add an isMasked boolean (or a {value:null, masked:true} sentinel)
    to the Token DTO so the UI never string-parses. Client interim: a single
    shared MASKED_PREFIX constant imported by both Token components
    (DataSourceItemToken.tsx:26 + CollectorItemToken.tsx:26).

- hypothesis_id: H-008
  severity: MEDIUM
  one_line: |-
    The one-time plaintext token is rendered into a plain DOM text node (both
    surfaces) with no password-style obfuscation, no reveal-on-hover, and no
    Cache-Control: no-store on the response — leaking to bystanders, screen-shares,
    screenshots, and response caches.
  dedup_status: net_new
  distinct_from: PLT-087
  distinct_reason: |-
    PLT-087 names "plaintext-token response without Cache-Control" as a BACKEND
    response-header item for the DataSource path. The F-163 finding is the
    cross-surface UI-affordance angle: the value is rendered as clear-view DOM
    text (no <input type=password>, no reveal-on-hover, no download-only) AND held
    in the redux store on BOTH tabs. The Cache-Control half overlaps PLT-087 and
    should be co-filed; the DOM-obfuscation half is net new.
  recommended_log_as: upstream-issue
  proposed_fix_anchor: |-
    DataSourceItemToken.tsx:32-34 + CollectorItemToken.tsx:32-34 — render the
    plaintext into a readOnly <input type='password'> with explicit reveal-on-hover
    (or a one-time download), and set Cache-Control: no-store on the rotate/create
    response (DataSourceController.java:56-58, co-file with PLT-087).

