proposed_action: |-
  Three Mockito unit tests in OwnershipServiceImplTest.java. (A) `testDeleteOwnership` happy-path: mocks ownershipRepository.get + delete + markEntityUnfilled; asserts (i) delete called, (ii) markEntityUnfilled called when no remaining ownerships, (iii) activity event OWNERSHIP_DELETED would fire. (B) `testDeleteOwnership_missingFTSRefresh`: assert `searchEntrypointRepository.updateChangedOwnershipVectors` is NOT invoked on the delete path (LOCKS the bug AS-IS; flips when fix lands). (C) `testDeleteOwnership_nonExistentReturnsEmpty`: mock ownershipRepository.delete to return empty; assert the service chain returns Mono.empty() / completes without error (LOCKS the idempotent-friendly-but-typo-masking contract).
