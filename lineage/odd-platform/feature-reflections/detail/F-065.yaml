      Postgres lock-wait state forever: bean construction already returned, so /actuator/beans
      and /actuator/health both report the platform "UP", and the wedged subsystem emits no
      error (it is waiting, not failing). The operator's first signal is "one feature stopped
      working", diagnosable only by `SELECT * FROM pg_locks WHERE locktype='advisory'` — a
