      SCENARIO A (name-only edit, description untouched): change Name to
      'p076-renamed-A', leave Description as pre-filled, click Save.
    capture_as: edit_name_only
  - kind: dom-probe
    note: |
      Re-open the edit modal on the (now renamed) data source.
