behaviour: Silent-fail on partition CREATE failure — `PostgreSQLPartitionCreationJob.createPartitionIfNotExists`
  (lines 53-61) catches `RuntimeException` and logs ERROR before continuing the loop.
  No alerting, no metric, no health-check degradation. An ODD instance that booted
  with a DB role lacking `CREATE TABLE` privilege would log ERROR once and continue
  serving traffic — until `activity` INSERTs began failing as rows arrived for the
  uncovered window. Severity HIGH per Activity Table Partitioning concept (durability-critical
  subsystem).
