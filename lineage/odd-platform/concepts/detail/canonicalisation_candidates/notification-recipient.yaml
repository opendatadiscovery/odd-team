proposed_canonical: Notification Recipient
rationale: Notification destinations are a distinct audience from ODD Platform UI
  End-User and ODD API Consumer — they receive ODD's outbound alert delivery via Slack
  channel, generic webhook, or email inbox. main-concepts.md does not name this; the
  canonicalisation depends on first establishing the Notifications concept.
contributing_concepts:
- Slack channel (configured via notifications.receivers.slack.url)
- Webhook endpoint (configured via notifications.receivers.webhook.url)
- Email inbox (configured via notifications.receivers.email.recipients)
suggested_add_to_docs: true
