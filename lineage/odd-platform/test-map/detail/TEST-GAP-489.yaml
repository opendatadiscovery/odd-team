behaviour: |-
  REFACTOR-217 DELETE-half regression-pin (CRITICAL — DATA_ENTITY_DELETE_TERM bypass primary-source confirmed). The SYMMETRIC counterpart of the addDataEntityTerm path-mismatch (TEST-GAP-017). SecurityConstants.java:240-242 registers `new PathPatternParserServerWebExchangeMatcher("/api/dataentities/{data_entity_id}/term/{term_id}", DELETE)` (SINGULAR `term`); openapi.yaml:1042 declares the operation path as `/api/dataentities/{data_entity_id}/terms/{term_id}` (PLURAL); the controller @Override (DataEntityController.java:158-163) inherits the plural path from generated DataEntityApi. AuthorizationCustomizer.customize (AuthorizationCustomizer.java:24-30) only fires the permission check when `rule.matcher()` matches the request — the singular matcher NEVER matches the plural request path. The no-match fallback at line 29-30 is `.pathMatchers("/**").authenticated()`. Net effect: ANY authenticated user under LOGIN_FORM/OAUTH2/LDAP can DELETE any term-to-data-entity relation regardless of their Policy set. The UI gates the X button via `WithPermissions permissionTo={Permission.DATA_ENTITY_DELETE_TERM}` (TermItem.tsx:48), but UI gating is client-side only — a curl/DevTools caller bypasses it. Both POST (link) and DELETE (unlink) on the term-to-data-entity surface are unauthorized server-side. Combined with the HARD-DELETE semantics (migration V0_0_76 removed soft-delete and tombstoned existing rows), unauthorized callers can mass-delete term taxonomy with no row-level restore path. The activity-feed event captures BEFORE/AFTER JSON state, providing the only forensic trail — but on a high-traffic DISABLED deployment, that log fills rapidly. Permissions doc (live 2026-05-19, status 200) verbatim describes DATA_ENTITY_DELETE_TERM as 'Allows removing a term from a data entity' — the intended access model — and is silent on the wiring bug. Cross-pillar P-06 (Glossary integrity) + P-09 (Authorization).
