name: OpenAPI 200-vs-201 status-code drift
canonical_in_docs: false
canonical_candidate: true
description: |-
  **NEW INVARIANT, batch 2026-05-12F — now 2-sidecar** — repository-wide
  cross-cutting hygiene defect: ODD's OpenAPI spec declares `201 Created` for creation
  endpoints, but the controller implementation returns `200 OK` instead. The drift
  is silent (no compile-time guard) and the test suite locks it in (tests assert `isOk()`
  200, so a fix that aligns to spec would break tests). Two-sidecar primary-source
  corroborated: (a) OwnerController.createOwner (batch E — same drift on `POST /api/owners`,
  `PUT /api/owners/{id}`); (b) IngestionController.postDataEntityList (batch F — `POST
  /ingestion/entities` declared 201 in `opendatadiscovery-specification/specification/odd_api.yaml:23-25`,
  implementation returns 200 at `IngestionController.java:44`, `BaseIngestionTest.java:79`
  locks in 200). NOTE: sibling endpoints on IngestionController DO match the spec
  (`postDataSetStatsList` line 82 + `ingestMetrics` line 89 both return 201) — `postDataEntityList`
  is the only divergence on its controller. Also: `createRole`, `createPolicy` exhibit
  the same shape per batch E. Operators consuming the published OpenAPI spec to generate
  SDKs (e.g. odd-collector-sdk) receive 200 where they expect 201 — HTTP semantics
  make both acceptable, but the spec/code mismatch is unresolved and the canonical
  artefact (spec vs implementation) is unclear.

  ## STRENGTHENED — batch ZD (RoleController + PolicyController class-level confirmation)

  Batch ZD adds CLASS-LEVEL confirmations at RoleController + PolicyController
  that surface the SAME drift on the FULL FOUR-METHOD (Role) / SIX-METHOD
  (Policy) controller surface in one view rather than per-method:

    - **RoleController** (batch ZD, 4 endpoints): POST /api/roles (createRole)
      returns 200 via `ResponseEntity::ok` at line 24; OpenAPI declares 201
      at openapi.yaml:3629 — DRIFT. PUT /api/roles/{role_id} (updateRole)
      returns 200 at line 42; OpenAPI declares 201 at openapi.yaml:3656 —
      DRIFT. GET /api/roles returns 200 (consistent). DELETE
      /api/roles/{role_id} returns 204 (consistent with openapi.yaml:3676).
      TWO of FOUR endpoints disagree with the spec.

    - **PolicyController** (batch ZD, 6 endpoints): POST /api/policies
      (createPolicy) returns 200 at line 24; openapi.yaml:3528 declares 201 —
      DRIFT. PUT /api/policies/{policy_id} (updatePolicy) returns 200 at
      line 49; openapi.yaml:3566 declares 201 — DRIFT. DELETE
      /api/policies/{policy_id} returns 204 (consistent). GET endpoints
      return 200 (consistent). TWO of SIX endpoints disagree with the spec.

  The batch-ZD class-level sidecars are PRIMARY-SOURCE confirmations of
  the drift previously inferred at the controller-method-level sidecars
  in batch E for createRole + createPolicy. Both confirm the same shape:
  spec declares 201; code uses `ResponseEntity::ok` (HTTP 200).

  Combined with the earlier batch-W extension (DataSource, Collector,
  Tag), the count is now ~13+ endpoint-level instances across 9
  controllers (Owner, Role, Policy, Ingestion, Term, Alert, DataSource,
  Collector, Tag) — the pattern is **PERVASIVE**. Every controller's
  `createX` and most `updateX` endpoints exhibit it. The drift is
  LOCKED IN by tests; a fix to align EITHER side requires coordinated
  changes.

  **Codebase-wide audit candidate**: grep all controllers for
  `ResponseEntity.ok()` on POST methods; cross-reference with OpenAPI
  spec's declared status codes. Likely findings: every `*Controller.create*`
  method on a controller that implements an OpenAPI-generated `*Api` interface.
