mitigations_unimplemented:
  - |-
    Add OWNERSHIP join to every facet aggregator — gated by the caller
    resolved owner. Refines facet counts to "what entities the caller can
    see"; eliminates the catalog-cardinality discovery vector.
  - |-
    Alternatively: add a config switch facet.scope = catalog | owner |
    namespace that operators enable in multi-tenant deployments — keeps the
    current default for collaborative deployments; closes the surface for
    tenant-isolated deployments.
  - |-
    Doc: extend /features/data-discovery/search with a "Facet count scoping"
    section explicitly stating that facet counts reflect the WHOLE CATALOG
    (not the caller scope) — operators must understand the discovery
    surface.
  - |-
    Doc: extend /configuration-and-deployment/enable-security/authorization
    "Read-side posture" section to enumerate the cross-owner facet count
    surface alongside the other 15 read-collaborative surfaces.
  - |-
    Backlog: a REFACTOR-NNN tracked follow-up for the OWNERSHIP-join
    refactor; cite this invariant as the requirement spec.
notes: |-
  Cross-batch finding: the facet-drill-down surface is the SIXTEENTH
  cross-owner-readable read surface in the platform — adding to the
  fifteen-surface tally documented at read-collaborative-cross-owner-enumeration
  (15 sidecars at batch L). With batch M's four sidecars all on or
  adjacent to anchor-set / cross-owner findings, the total reachable
  posture surfaces are now 19+ across the codebase.

  Operator-relevant compounding:
    (a) /api/search/{id}/facet/OWNERS — enumerate every owner name + count;
    (b) /api/search/{id}/facet/NAMESPACES (via getSearchFacetList aggregate)
        — enumerate every namespace;
    (c) /api/search/{id}/facet/TAGS — enumerate every tag + frequency;
    (d) /api/search/{id}/facet/GROUPS — enumerate every DEG + size;
    (e) /api/search/{id}/facet/STATUSES — enumerate every status + count;
    (f) /api/search/{id}/facet/TYPES — enumerate every entity type + count;
  A single authenticated caller drilling all six facet panels reconstructs
  most of the catalog topology with no per-entity-read required.

  Cross-references:
    - Read-collaborative cross-owner enumeration — the broader pattern;
      this is the SIXTEENTH cross-owner-readable surface.
    - Search Catalog (faceted, session-as-server-state) — the parent
      operation that creates the bearer-token session feeding the facet
      drill-down.
    - tsquery operator-injection via persisted state — the SAME aggregators
      that suffer this finding ALSO suffer the tsquery injection.
    - REFACTOR-024 / REFACTOR-340 — the per-entity alert read family;
      this invariant extends the cross-owner enumeration to the
      catalog-cardinality surface.
