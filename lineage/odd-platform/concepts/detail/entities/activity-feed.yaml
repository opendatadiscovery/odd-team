security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: ActivityController.getActivity carries no @PreAuthorize, no programmatic
      permissionService check. Generated ActivityApi interface has no auth annotations
      (grep verified). `/api/activity` is not in SecurityConstants.SECURITY_RULES
      (SecurityConstants.java:98-356) and not in WHITELIST_PATHS — falls through to
      pathMatchers('/**').authenticated(). Live `/configuration-and-deployment/enable-security/authorization`
      (verified 200, 2026-05-10) documents the Policies/Permissions/Roles framework
      but per-endpoint wiring for /api/activity is absent.
  owner_scoping:
    verdict: MIXED
    detail: type=null (default) and type=ALL → fetchAllActivities returns cross-owner
      audit trail (no owner filter). type=MY_OBJECTS → fetchMyActivities filters via
      authIdentityProvider.fetchAssociatedOwner() (the only path that respects caller
      ownership). type=UPSTREAM/DOWNSTREAM → fetchDependentActivities walks lineage
      graph WITHOUT caller-ownership filter — anyone can ask 'what changed upstream
      of X' regardless of whether they own X. Two distinct dispatch paths (`if (type
      == null)` + `case ALL`) both lead to fetchAllActivities — a future refactor
      updating only one branch silently bypasses any new gate (getActivity.md:security.known_security_gaps.[1]).
  strengths:
  - Cursor pagination on `(lastEventId, lastEventDateTime)` — append-only audit data
    shape; avoids deep-offset cliffs (ActivityController.java:34-35)
  - Service-layer null-date validation throws BadUserRequestException — belt-and-braces
    defence beyond OpenAPI required:true (ActivityServiceImpl.java:98-100)
  weaknesses:
  - '`/api/activity` (and `/api/activity/counts`) globally readable by any authenticated
    user — exposes who-changed-what audit trail across every owner including ActivityState
    old/new diffs of descriptions, business names, ownership changes, custom metadata
    (getActivity.md:security.known_security_gaps.[0] severity HIGH)'
  - userIds/ownerIds filter parameters not validated — submitting candidate id lists
    allows enumeration of which users/owners have generated platform activity (severity
    MEDIUM)
  - DescriptionActivityStateDto carries free-text user-supplied descriptions — if
    sensitive content ever lands there (incident notes, customer ids, internal tickets),
    the activity feed surfaces it cross-owner with no redaction (severity MEDIUM)
  - Under auth.type=DISABLED, anonymous read of the entire cross-owner audit trail
  - Public-API parameter typo `lasEventId` (missing `t`) on the controller signature
    — generated client SDKs carry the typo permanently (severity LOW; ActivityService
    interface fixes it at line 42)
  cross_file_inconsistencies:
  - Per-entity getDataEntityActivity (DataEntityController) uses the same cursor pattern
    but is reached from a different route and has different scoping — both endpoints
    expose the same payload, the global one is the larger blast radius
  contributing_files:
  - getActivity.md
  evidence:
  - getActivity.md:security.known_security_gaps.[0] (cross-owner audit-trail exposure
    HIGH)
  - getActivity.md:security.known_security_gaps.[1] (two-branch dispatch refactor
    risk MEDIUM)
  - getActivity.md:security.known_security_gaps.[2] (userIds/ownerIds enumeration
    MEDIUM)
  - getActivity.md:security.known_security_gaps.[3] (DISABLED-mode anonymous read
    LOW)
performance_aggregate:
  overall: MEDIUM
  hot_paths:
  - GET /api/activity (fetchAllActivities) — single PostgreSQL query against `activity`
    table filtered by 8 facets + cursor; with no `size` upper bound, wide-window queries
    trigger full-window scans — getActivity.md:performance.hot_paths.[0]
  - GET /api/activity/counts — 4 parallel aggregation queries per call via Mono.zip
    (totalCount, myObjectsCount, downstreamCount, upstreamCount) — getActivity.md:performance.hot_paths.[2]
  - fetchDependentActivities — lineage-graph resolution BEFORE the activity query;
    for deep lineage graphs the resolution step dominates latency — getActivity.md:performance.hot_paths.[1]
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: Single-window per call. No batch / multi-window endpoint. UI rendering
      a multi-window dashboard issues N separate calls.
  scaling_shape:
    verdict: HORIZONTALLY_SCALABLE
    detail: Stateless controller — instances scale horizontally. Read-only path, no
      locks. Cursor pagination scales linearly with page count. Bounded only by DB
      connection pool and Postgres planner.
  strengths:
  - Reactive Mono/Flux end-to-end — non-blocking on the request thread
  - Cursor pagination over an append-only `activity` table — appropriate index shape,
    avoids offset cliffs
  weaknesses:
  - '`size` parameter has no @Max constraint and no programmatic upper bound — `size=Integer.MAX_VALUE`
    only safeguarded by the DB query plan (getActivity.md:performance.known_performance_gaps.[0]
    severity MEDIUM)'
  - Counts endpoint fans out to 4 aggregation queries per call — for a UI polling
    counts on a refresh interval, DB load is 4x apparent endpoint count; no caching,
    no debouncing, no aggregate table (severity LOW)
  - Cursor predicate must be backed by `(created_at DESC, id DESC)` composite index
    on `activity` — if absent, deep-window scans degrade (out-of-scope at the controller
    layer; surface for repository review)
  - fetchDependentActivities walks the lineage graph on the hot path — no precomputed
    dependency-set on the activity row (severity LOW; deployment-dependent)
  - '**Unbounded monotonic growth of `public.activity` table** — `ActivityTablePartitionManager`
    calls only `createPartitionsIfNotExists`; `PartitionService.dropPartition` + `getEmptyPastPartitions`
    exist on the service interface but are NEVER invoked for the activity table (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[0]
    severity HIGH — silent-data-growth class analogous to LSN-001). Live `features/active-platform-features/activity-feed#configuration`
    claims `odd.activity.partition-period` controls ''retention and partitioning''
    — INCORRECT: the setting controls partition WIDTH only, no retention path exists.
    **CONFIRMED FROM SECOND ANGLE in batch 2026-05-12D via HousekeepingTTLProperties**
    — the entire housekeeping TTL surface contains exactly three fields (resolved_alerts_days,
    search_facets_days, data_entity_delete_days) and NONE targets the ACTIVITY table.
    The only activity-touching housekeeping path is `ActivityEmptyPartitionsHousekeepingJob`,
    which requires partitions to already be EMPTY (`COUNT(*) = 0` at PartitionServiceImpl.java:133-141)
    before dropping — there is NO code path that deletes activity rows by age. Two-angle
    confirmation: REFACTOR-085 is real, not inferred. (HousekeepingTTLProperties.md:bugs_limitations_corner_cases.[0]
    — drift CONFIRMED from second angle)'
  - '**Silent-fail on partition CREATE failure** — `PostgreSQLPartitionCreationJob.createPartitionIfNotExists`
    (lines 53-60) catches the wrapping RuntimeException, logs at ERROR, and the outer
    loop continues. No health-check, no metric, no alert. An ODD instance with a DB
    role lacking CREATE TABLE privilege would log ERROR at boot once and silently
    degrade until `activity` INSERTs began failing as rows arrived for an uncovered
    window (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[2]
    severity HIGH — silent-fail of a durability-critical subsystem).'
  - No `@Min(1)` validation on `odd.activity.partition-period` — `partition-period=0`
    produces zero partitions (the `while (lastPartitionDate.isBefore(bufferDate))`
    predicate evaluates baseline.isBefore(baseline) = false); rows are then REJECTED
    by Postgres with `no partition of relation "activity" found for row`. Silent operator
    misconfiguration → hard-fail INSERT path (ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[1]
    severity MEDIUM).
  - No Micrometer / health-check observability on partition lifecycle — operators
    have no metric to alert on 'partition creation has been failing silently for 30
    days' (ActivityTablePartitionManager@L11.md:performance.known_performance_gaps.[1]
    severity MEDIUM).
  cross_file_inconsistencies:
  - 'Activity Feed concept now spans two sidecars at different concept layers: controller-method
    getActivity (read surface) + config-key-consumer ActivityTablePartitionManager
    (durability surface). The two reach different LSN-class findings (cross-owner
    audit exposure vs unbounded table growth) for the same Activity Feed feature —
    no cross-file disagreement, but the pair is the first example in the catalog where
    reading the feature requires BOTH the surface-axis and the operational-axis sidecar.'
  contributing_files:
  - getActivity.md
  - ActivityTablePartitionManager@L11.md
  evidence:
  - getActivity.md:performance.hot_paths.[0-2]
  - getActivity.md:performance.known_performance_gaps.[0-3]
  - ActivityTablePartitionManager@L11.md:bugs_limitations_corner_cases.[0,1,2] (no
    retention; no @Min validation; silent-fail)
  - ActivityTablePartitionManager@L11.md:performance.known_performance_gaps.[1,2]
    (no observability; planner cost growth)
notes: 'Activity Feed surfaces in main-concepts.md only implicitly via the

  `Data Discovery` and `Data Security` pillars — neither name "Activity

  Feed" or "audit trail" as a canonical term. Live `features/active-platform-features/activity-feed`

  page (verified 200, 2026-05-10) describes the UI feature but omits the

  `type` parameter (MY_OBJECTS/UPSTREAM/DOWNSTREAM/ALL), the visibility

  model (who can see what), and the cursor pagination mechanics. The

  `/developer-guides/api-reference/activity` page returns 404 — there is

  NO first-party API-reference home for this surface. Batch 2026-05-10B

  adds operational-axis findings: the `public.activity` table grows

  monotonically (no retention path), the docs page mis-describes

  `odd.activity.partition-period` as a retention control, and partition

  creation fails silently with no observability. Recommended as a

  canonicalisation candidate: add "Activity Feed" to main-concepts.md

  Terms & Aliases AND create the missing api-reference page AND correct

  the partition-period documentation to clearly state WIDTH-only-not-retention.

  '
