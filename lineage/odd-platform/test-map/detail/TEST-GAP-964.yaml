behaviour: |-
  **HIGH — `GET /api/metadata/fields` is RBAC-ungated AND its catalogue is GLOBALLY-SHARED: ANY authenticated user reads the entire INTERNAL metadata-field catalogue including names that may reveal organizational structure, internal taxonomies, or PII-leaking field labels created by other users on unrelated data entities.**

  Verified by Grep `/api/metadata/fields` against `../odd-platform/odd-platform-api/src/main/java/org/opendatadiscovery/oddplatform/auth/SecurityConstants.java` 2026-05-25: ZERO matches. The endpoint falls through to `AuthorizationCustomizer.customize`'s catch-all `.authenticated()` rule.

  **The catalogue is cross-data-entity globally shared**:
  - `MetadataFieldServiceImpl.getOrCreateMetadataFields` (called from `DataEntityServiceImpl.createMetadata`) inserts a new row into the global `metadata_field` table whenever a user submits a custom-metadata value with a previously-unseen field name.
  - Every authenticated user reading `GET /api/metadata/fields` sees the union: their own creations + every other authenticated user's creations + every collector-ingested EXTERNAL-origin field's INTERNAL siblings.
  - The Discoverer of a field-name created by Team A on data entity X (e.g. `acquisition_cost_2025_q3`) is Team B, browsing autocomplete on data entity Y.

  **Three concrete leak vectors**:
  1. **Organizational discovery**: field names like `acquisition_cost_2025_q3`, `pii_compliance_status`, `pre_ipo_runway_months` reveal business context.
  2. **PII-by-label**: field names like `customer_alice_smith_notes`, `vendor_redacted_co_pricing` leak per-row identifiers via the FIELD NAME itself (rare but observed in customer deployments).
  3. **Taxonomy reconnaissance**: an attacker authenticated as a low-privilege auditor enumerates the full INTERNAL taxonomy of every data entity in the catalogue.

  **Documentation silence (compounding)**:
  - No `CUSTOM_METADATA_FIELD_READ` permission exists in the live `/permissions` page (WebFetched 2026-05-25 status 200, verified silent).
  - No live doc page documents the cross-data-entity catalogue exposure (`MetadataFieldController.md` doc_drift_findings.[2-3] both verbatim 'no live doc page documents').
  - Live `/active-platform-features/metadata` returns 404 (per sidecar's WebFetch).
  - Operators wiring policies for the write-side (e.g. restricting DATA_ENTITY_CUSTOM_METADATA_UPDATE to entity owners) reasonably assume the catalogue is similarly scoped; documentation never clarifies the truth.

  **Distinguishes from existing IDs**:
  - TEST-GAP-728 (CRITICAL) — DatasetField wrong-permission wiring bug. Different controller.
  - TEST-GAP-706 — ActivityController global audit exposure. Different surface.
  - TEST-GAP-962 (sister this batch) — OwnerController GET unauthenticated. Same class-of-bug; different controller.
  - This entry is the **CLASS-LEVEL NEW** for MetadataFieldController.
