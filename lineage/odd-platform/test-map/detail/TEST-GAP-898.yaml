proposed_action: |-
  Add `DataSourceTokenRotationCutoverTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. The single load-bearing test method:
  1. `regenerateDataSourceToken_oldTokenStops401NewTokenStarts200OnIngestionEntities_pinsBinaryCutover` — register a data source via POST /api/datasources, capture token T_old from the response; with `auth.ingestion.filter.enabled=true`, POST /ingestion/entities with T_old and assert the request is NOT rejected with 401; PUT /api/datasources/{id}/token and capture the NEW plaintext token T_new from the response body (assert T_new != T_old, both 40-char alphanumeric); POST /ingestion/entities with T_old and assert 401 AccessDeniedException "Token is not correct"; POST /ingestion/entities with T_new and assert non-401.

  This is the highest-leverage single test on the regenerateDataSourceToken node — it
  protects the load-bearing operator contract (rotation invalidates the old credential)
  AND would catch a regression that flips the response token to masked (breaking the
  operator's copy-to-clipboard flow). Pair with DOC-GAP-034: the token-rotation operational
  mechanics (destructive, no grace period, immediate ingestion lockout) must be documented
  in the enable-security pages.
