realism_caveats: |
  This probe measures network-call cardinality at the browser boundary; it does NOT
  measure React component re-render count (a re-render without a refetch is harmless
  here and out of scope). The count_b == 2 assertion encodes the EXPECTED deeplink
  behaviour — if a future change makes the searchParams-sync effect run before the
  first fetch, count_b would drop to 1, which is an improvement, not a regression;
  probe-runner should treat a count_b of 1 as a passing-with-note, not a failure.
  Scenario C's select+deselect produces two genuinely distinct queryKeys, so 2 is the
  floor; the real thing under test is the absence of a THIRD fetch from derived-atom
  object-identity churn (H1).
