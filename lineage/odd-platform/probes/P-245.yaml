realism_caveats: |
  The probe does not verify what search-engine crawlers or HTTP clients see
  (the server's SPA fallback serves index.html with HTTP 200 for any path —
  that server-side half belongs to the static-resource/router backend node).
  It also cannot distinguish "blank because no route matched" from "blank
  because a lazy chunk failed" — the network-idle wait plus the unmatched
  path makes the former the only expected cause on a healthy stack. Selector
  for the content region is structural (div.App > div:last-child per
  App.tsx:54-98) and breaks if the shell layout is restructured; that is
  acceptable — a restructure should re-fire this question anyway.
