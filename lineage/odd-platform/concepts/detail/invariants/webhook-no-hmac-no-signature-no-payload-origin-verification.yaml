mitigations_unimplemented:
  - |-
    Add a new config key notifications.receivers.webhook.signing-secret
    (optional, empty = no signing for backwards compat). Compute HMAC-SHA256
    of the JSON body in WebhookNotificationSender.send and set the
    X-ODD-Signature: sha256=<hex> header. Document the signing convention
    on the live notifications page with a Node.js / Python receiver-side
    verification example.
  - |-
    OR: add support for a custom-headers config map at
    notifications.receivers.webhook.headers (Map String String) — operators
    can configure Authorization, X-API-Key, etc. headers without code
    change. Less secure than HMAC (the auth header is static, not
    payload-bound), but closer to industry parlance.
  - |-
    OR (defence-in-depth): add request timestamp + nonce headers
    (X-ODD-Timestamp, X-ODD-Nonce) and include them in the HMAC body —
    closes replay attacks where an adversary captures + re-sends a real
    payload.
  - |-
    Document the absence on the live notifications page with operator-
    facing mitigation: use mTLS, private network, or HTTP gateway with
    HMAC sidecar. Pending the platform fix, this is the only path to a
    trustworthy receiver.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20Y from the
  WebhookNotificationSender sidecar's primary-source evidence at the
  send chain construction site. The finding is the single most consequential
  security gap of the F-009 5-LAYER closure.

  Cross-cutting connections:
    - Pairs with the webhook cross-tenant-exposure-one-url-per-deployment
      invariant (also batch Y) — the URL is a credential AND a routing
      key; leaking it reveals BOTH the receiver identity AND the ability
      to forge payloads
    - Pairs with REFACTOR-498 (URL scheme allowlist absence) — the
      operator-misconfiguration angle of the same broader story (operator
      can mis-set the URL OR the URL gets correctly set and then leaks)
    - Cross-link to the Slack channel: Slack's incoming webhook URL is
      similarly an unsigned bearer credential, but the Slack-side
      mitigation is "the URL is unguessable + the workspace admin
      controls the channel"; for the generic webhook the operator is
      the workspace admin AND there is no Slack-side mitigation; the
      generic-webhook channel is structurally less defendable than the
      Slack channel even though they share the same architectural shape

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the absence on the live notifications page + ship a
        receiver-side verification example (pending code fix)
    (b) Document the new signing-secret config key once the code fix
        ships
