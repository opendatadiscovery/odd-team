name: MICROSERVICE entity type silently excluded from specific-attributes diffs
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19I (IngestionService sidecar)** —
  `IngestionServiceImpl.java:103` filters MICROSERVICE-typed existing entities out
  of the `specificAttributesDeltas` list: `.filter(e -> DataEntityTypeDto.MICROSERVICE
  != e.getValue().getType())`. The consequence: when an existing entity of type
  MICROSERVICE has changed `specific_attributes` JSON, NO `DataEntitySpecificAttributesDelta`
  is emitted, and NO `BACKWARDS_INCOMPATIBLE_SCHEMA` alert candidate is raised
  via the `AlertIngestionRequestProcessor` FINALIZING-phase consumer. **MICROSERVICE
  entities can NEVER trigger schema-diff BIS alerts via the specific-attributes
  path**, regardless of how their attributes change. The exclusion is undocumented:
  no comment defends it (verified by reading IngestionServiceImpl.java:101-105 —
  the filter has no surrounding comment); no doc page mentions it. The coupling
  is fragile: a rename / removal of the `MICROSERVICE` enum value (or its addition
  to a sibling type that ALSO should be excluded) would silently change behaviour.
  A regression that removes the filter would suddenly emit BIS alerts for every
  microservice ingestion — likely surprising for operators whose microservice catalogs
  are noisy by design. **Severity**: MEDIUM — undocumented carve-out, silent
  behavioural impact on a specific entity type, no test anchor pinning the current
  behaviour. The intent is presumed: microservices are typed as endpoints (REST
  shape, request/response schemas) rather than data shapes (column lists) — schema-diff
  semantics don''t map cleanly to microservice endpoint changes. But the rationale
  is not surfaced in code or docs.'
