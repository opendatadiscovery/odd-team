name: Set data-quality test severity (owner-scoped mutation)
canonical_in_docs: true
canonical_candidate: false
description: |-
  PUT /api/datasets/{data_entity_id}/dataqatests/{dataqa_test_id}/severity —
  the LONE owner-scoped mutating endpoint of DataQualityController. Gated via
  SecurityConstants.java:243-246 with DATA_ENTITY AuthorizationManagerType +
  DATASET_TEST_RUN_SET_SEVERITY permission. Caller must be associated with one
  of the dataset's owners. NEW operation, batch 2026-05-20T (DataQualityController
  class sidecar).

  Repository implementation uses onDuplicateKeyUpdate at
  ReactiveDataQualityRepositoryImpl.java:90-101 — idempotent in outcome, but
  NO ActivityEvent emission, NO audit log, NO last_modified_by, NO version
  increment. Severity-change history is unrecoverable post-fact (audit-log
  presence asymmetry instantiated on the DQ surface — see canonicalisation
  candidate data-quality-set-severity-no-audit-trail-onduplicatekeyupdate).

  The operation is the MUTATING half of the asymmetrical owner-scoping pattern
  in DataQualityController: reads (4 endpoints) cross-owner, mutations (this 1
  endpoint) owner-scoped. The deliberate registration of exactly ONE rule in
  SecurityConstants.SECURITY_RULES (not five) is the intent_anchor for the
  asymmetrical owner-scoping ADR-CANDIDATE-114 (read-cardinality split).

  vocabulary_status: codebase-anchored + doc-side-partially-covered (live
  sla-statuses.md names the user-facing flow 'open the test row's right-side
  panel and choose a severity' but does NOT name the DATASET_TEST_RUN_SET_SEVERITY
  permission or the DATA_ENTITY-scoped owner-association requirement).
