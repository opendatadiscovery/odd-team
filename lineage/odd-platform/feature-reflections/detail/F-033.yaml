- id: H-003
  hypothesis: "When an operator copies a code snippet out of an integration card on a default-configuration deployment, the snippet contains their platform's real address ready to use against their running ODD instance."
  derivation: "The platform_url substitution (StaticArgumentMappingContext sourcing odd.platform-base-url) exists precisely so the operator does not type their own platform address; the feature's value is a ready-to-paste snippet."
  seed_source: response-shape + endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The substitution mechanism works: any code-snippet argument with `parameter="platform_url"`
      and `static: true` has the configured `odd.platform-base-url` injected into its
      `static_value` (`IntegrationMapper.java:38-45`). BUT on a default deployment the property
      is COMMENTED OUT in `application.yml:209`, so the `@Value("${odd.platform-base-url:http://your.odd.platform}")`
      default resolves to the literal placeholder `http://your.odd.platform`. The snippet the
      operator copies therefore points at a non-existent host until they set the override. The
      promise holds ONLY when the operator has configured `odd.platform-base-url`; on a stock
      install it silently hands out a placeholder URL.
    evidence:
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: bugs_limitations_corner_cases[platform-url-placeholder]
        cite: "application.yml:209 (commented) + StaticArgumentMappingContext.java:16 + IntegrationMapper.java:38-45"
        note: "Default resolves to literal placeholder; substitution otherwise correct."
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: stress_findings.tunables[platform-base-url]
        cite: "StaticArgumentMappingContext.java:15-20"
        note: "No @URL validation; empty-string override yields 'http://' in snippets."
    operator_visible_failure: |
      An operator on a stock install copies a wizard snippet, pastes it into their collector
      config, and the collector points at `http://your.odd.platform` — a non-existent host — so
      ingestion silently fails to reach the platform. The placeholder is recognisable to a
      careful reader, but the wizard's whole value proposition (ready-to-paste) is undermined,
      and the live doc names the fallback exists without warning it is the DEFAULT state.
      Secondary failure: an empty-string override (`odd.platform-base-url=`) renders bare
      `http://` into every snippet with no guard.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

- id: H-004
  hypothesis: "When an operator requests an integration that does not exist (GET /api/integrations/nonexistent), they receive a 404 Not Found telling them the integration is unknown."
  derivation: "Standard REST convention for GET-by-id on a missing resource; the codebase's own MetadataFieldServiceImpl.get throws NotFoundException on a missing id — operators reasonably expect the same shape here."
  seed_source: endpoint-shape + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      On a missing id, `ResourceFilesIntegrationRegistry.java:15-17` issues
      `Mono.justOrEmpty(registry.get(id))` which returns `Mono.empty`; the controller's
      `.map(ResponseEntity::ok)` is short-circuited; Spring WebFlux translates the empty Mono to
      `204 No Content`, NOT 404. There is no `switchIfEmpty(Mono.error(new NotFoundException(...)))`
      on the path. The OpenAPI contract declares ONLY the 200 response (`openapi.yaml:75-81`) —
      neither 404 nor 204 is contracted. P-126 was emitted by the file-analyser to pin the exact
      204 body/content-type; the static trace already establishes 204 (not 404).
    evidence:
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: bugs_limitations_corner_cases[204-on-missing]
        cite: "ResourceFilesIntegrationRegistry.java:15-17 + IntegrationServiceImpl.java:20-23 + IntegrationController.java:19-22 + openapi.yaml:75-81"
        note: "Mono.empty → 204; no switchIfEmpty; contract declares only 200."
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: stress_findings.name_behavior_pairs[getIntegration-204]
        cite: "IntegrationController.java:19-22 + openapi.yaml:75-81"
        note: "drift MINOR; 204 is undocumented either way."
    operator_visible_failure: |
      An operator or SDK probing the wizard surface with an unknown id gets `204 No Content` — a
      SUCCESS status with an empty body. An OpenAPI-generated client expects 200 with an
      Integration body on this path and may throw a deserialisation error on the empty 204, or
      silently treat 'no integration' as 'success with null'. An operator cannot distinguish
      'this integration id does not exist' from 'it exists but has no content' (the latter is
      currently impossible, but the response shape does not say so). Because no 404/204 is
      documented, nobody can write a correct client without observing the live behaviour.
    severity: MEDIUM
    confidence: HIGH
    probe_id: PENDING-F-033-1
    routes_to_finding: bug-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

- id: H-005
  hypothesis: "When an operator looks up an integration by id, the lookup matches the id exactly as the manifest author wrote it (case-sensitive), so two manifests Snowflake and snowflake are distinct integrations."
  derivation: "The path variable is named integrationId and the manifest carries a single id field; a caller reasonably expects an id to be an exact key."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The registry TreeMap uses `Comparator.comparing(String::toLowerCase)`
      (`IntegrationRegistryFactory.java:36`), so lookup is CASE-INSENSITIVE: a request for
      `snowflake` reaches a manifest registered as `Snowflake` and vice-versa. This is a
      LEGITIMATE, convenient translation for lookup (the operator does not have to remember
      exact casing) — the sidecar's Category-F analysis classifies it `TRANSLATES_LEGITIMATELY`.
      BUT the SAME comparator + merge function `(o1, o2) -> o2` (line 35) means two manifests
      whose ids differ only in case SILENTLY COLLAPSE into one entry (last-loaded wins), so they
      are NOT distinct integrations. With `classpath*:` scanning multiple jars in
      filesystem-dependent order, which one survives is non-deterministic across deployments.
    evidence:
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: stress_findings.request_inputs[integrationId]
        cite: "IntegrationRegistryFactory.java:32-37 + ResourceFilesIntegrationRegistry.java:15-17"
        note: "Case-insensitive lookup = legitimate; case-collision merge = silent data loss."
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: bugs_limitations_corner_cases[case-collision]
        cite: "IntegrationRegistryFactory.java:32-37"
        note: "Last-load-wins; jar-order dependent; no log/warn/exception."
    operator_visible_failure: |
      For the common case (single manifest per id), the case-insensitive lookup is a convenience
      and behaves as a user would want. The failure is at the overlay boundary: an operator
      shipping their own `snowflake.yaml` to OVERRIDE a vendor's `Snowflake.yaml` MAY succeed or
      MAY silently keep the vendor's manifest, depending on classpath/jar load order — with no
      warning that a collision occurred. The override is non-deterministic across builds and
      undocumented for wizard authors.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar
    coverage: unverified
    test_demand: functional

- id: H-006
  hypothesis: "When an operator (or an integration-author) adds a new wizard YAML to their overlay and one of the manifests is malformed, the platform skips the broken manifest, logs a warning, and starts normally with the remaining valid wizards."
  derivation: "Negative-space: a resilient registry would isolate one bad input; an operator expects adding a buggy card not to take down the entire catalog server."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      `IntegrationRegistryFactory.readManifest` (`:53-61`) catches `IOException` and rethrows as
      `IllegalStateException("Couldn't read wizard manifest: <filename>")` (line 59);
      `readManifests` (`:42-51`) does the same at the resource-scan level. The exception
      propagates through `IntegrationConfiguration.integrationRegistry()` and aborts Spring
      application-context construction. There is NO skip-broken-and-continue and NO
      warn-and-omit mode. A single malformed wizard YAML in ANY overlay jar makes the entire
      platform refuse to start. (The error message does include the filename, which makes
      root-causing fast — that part is deliberate per implicit ADR #5 'fail-fast over silent-skip'.)
    evidence:
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: bugs_limitations_corner_cases[fail-fast-yaml]
        cite: "IntegrationRegistryFactory.java:48-50, 56-60"
        note: "Boot-time fail-fast; whole context fails; no skip mode."
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: implicit_adrs[fail-fast-on-malformed]
        cite: "IntegrationRegistryFactory.java:48-50, 56-60"
        note: "Fail-fast is the documented intent (specific filename-anchored message)."
    operator_visible_failure: |
      An operator who adds one buggy wizard YAML to their classpath overlay finds the WHOLE
      platform fails to boot — not just the wizard surface, but search, lineage, ingestion,
      every API. The blast radius of a documentation-tier artefact (a wizard manifest is
      essentially copy-paste docs) is the entire application. This is a deliberate fail-fast
      decision, so it routes to a caveat (document the boot-time guarantee + recommend
      deployment-time YAML validation) rather than a bug — but it is a sharp, undocumented
      operational hazard for anyone authoring overlays.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: teardown-constraint
    coverage: unverified
    test_demand: functional

- id: H-007
  hypothesis: "When the platform runs under an authenticated UI mode (LOGIN_FORM/OAUTH2/LDAP), only an operator with a management/administration-class permission can read the Integration Wizard registry, consistent with the rest of the Management section being permission-gated."
  derivation: "system-mission P-08 describes Management as the operator-facing, permission-gated surface; every WRITE-shaped Management controller (Tag/Namespace/Role/Policy) has SECURITY_RULES entries — a reader reasonably expects a Management-section read to be gated too."
  seed_source: cross-pillar + pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      Neither `SecurityConstants.SECURITY_RULES` (`SecurityConstants.java:98+`) nor
      `PolicyPermissionDto` defines ANY `INTEGRATION_*` permission (grep `INTEGRATION` in
      PolicyPermissionDto.java returns zero matches). Both endpoints fall through to
      `AuthorizationCustomizer.customize`'s catch-all `pathMatchers("/**").authenticated()`
      (`AuthorizationCustomizer.java:29-30`). ANY authenticated user — READ_ONLY role, a user
      with only `DATA_ENTITY_TAGS_UPDATE`, any no-management-permission user — reads the full
      wizard registry including every content block, code snippet, and the live `platform_url`
      value. This is INTENTIONAL per implicit ADR #2 'open-read by design' (wizard manifests are
      treated as documented public-knowledge artefacts), but it contradicts the naive
      expectation set by the Management-section placement, and it is documented NOWHERE.
    evidence:
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: stress_findings.auth_gates
        cite: "SecurityConstants.java:98+ + AuthorizationCustomizer.java:29-30 + grep INTEGRATION in PolicyPermissionDto.java = 0"
        note: "No INTEGRATION_* permission; catch-all authenticated() only."
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: implicit_adrs[open-read-by-design]
        cite: "SecurityConstants.java:98+ + PolicyPermissionDto (no INTEGRATION_*)"
        note: "Open-read is the deliberate architectural decision (parallel-structure absence)."
    operator_visible_failure: |
      An operator auditing the platform's RBAC posture cannot find, from the docs or the
      permissions catalog, that the wizard registry is readable by every authenticated user
      regardless of role — the live permissions page lists five permission categories and none
      reference integrations. They may assume the Management → Integrations tab is gated like
      its sibling tabs (Roles, Policies, Owners) when it is not. The information exposed is
      low-sensitivity (documentation-grade snippets, not credentials), so this is an
      open-read-by-DESIGN posture; the failure is the DOCUMENTATION GAP, not the access itself.
      Note: a future change that ADDED an INTEGRATION_READ permission would silently break the
      UI for non-permissioned users, because no test pins the open-read contract either way.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-008
  hypothesis: "When the platform runs under auth.type=DISABLED, the Integration Wizard endpoints (and the platform_url they embed) are NOT reachable by an unauthenticated network caller — DISABLED relaxes UI login but does not expose internal configuration to anonymous traffic."
  derivation: "system-mission cross_pillar P-09 names auth.type as the load-bearing gate; an operator reasonably expects 'auth disabled' to mean 'no login screen', not 'every endpoint world-readable including substituted internal URLs'."
  seed_source: cross-pillar + negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Under `auth.type=DISABLED`, `DisabledAuthSecurityConfiguration.java:13-18` applies
      `.anyExchange().permitAll()`. SECURITY_RULES is not consulted. Any network caller able to
      reach the HTTP port can `GET /api/integrations` and read every wizard manifest, INCLUDING
      the substituted `platform_url`. If the operator has set `odd.platform-base-url` to an
      internal hostname (a typical pattern shared with the notification and Slack paths), that
      internal URL leaks to any anonymous caller. The bundled `application.yml` DEFAULT is
      `auth.type=DISABLED`, so operators who do not override are running in exactly this posture.
      This is the REFACTOR-185 DISABLED-mode bypass cluster's 22nd supporting surface.
    evidence:
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: security.known_security_gaps[disabled-anonymous]
        cite: "DisabledAuthSecurityConfiguration.java:13-18 + StaticArgumentMappingContext.java:16 + IntegrationMapper.java:38-45"
        note: "Anonymous reachability + platform_url leak under the application.yml default."
      - sidecar: odd-platform__java__IntegrationController__controller-class__IntegrationController.md
        section: stress_findings.auth_gates
        cite: "DisabledAuthSecurityConfiguration.java:13-18 + AuthorizationCustomizer.java:29-30"
        note: "DISABLED: 200 with full registry to anonymous callers."
    operator_visible_failure: |
      An operator who leaves the default `auth.type=DISABLED` in place (or uses it in a
      not-truly-private dev/staging network) exposes the wizard registry — and any internal
      hostname configured in `odd.platform-base-url` — to any passive network observer who can
      reach the port, with no authentication and no request log to detect the probe. The leak is
      latent (it depends on the operator having configured an internal URL) but real, and the
      live wizard doc page is silent on the DISABLED anonymous-access posture. Whether to fork
      DISABLED to gate this is a platform-wide read-posture decision; the load-bearing immediate
      ship is the documented caveat.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_demand: functional

- id: H-009
  hypothesis: "When an operator types into the Integration Wizard search box, the platform returns matching integrations — the search scales to a large registry because filtering happens server-side."
  derivation: "Endpoint shape + UI label: a search box on a list view implies a query; a senior PO asks whether the search is server-paged or client-only, and whether it scales."
  seed_source: ui-label + endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      The search IS functional but is CLIENT-SIDE ONLY. `getIntegrationPreviews` accepts no
