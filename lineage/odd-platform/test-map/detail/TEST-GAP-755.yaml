behaviour: |-
  **HIGH — `DELETE /api/collectors/{id}` soft-deletes the `collector` row BUT LEAVES THE TOKEN ROW INTACT in the `token` table indefinitely. The plaintext credential of a deleted collector persists in DB backups, replicas, dumps, and reads forever.** Primary-source confirmed in batch-W CollectorController sidecar + cross-link to batch-R `ReactiveCollectorRepositoryImpl` sidecar:

  **Persistence-layer evidence**:
  - `CollectorServiceImpl.delete` (lines 71-80, `@ReactiveTransactional`): the only delete operation is `collectorRepository.delete(id)` (line 78). NO `tokenRepository.delete(...)` call. NO grep hit for `tokenRepository.delete` anywhere in `CollectorServiceImpl`.
  - `ReactiveAbstractSoftDeleteCRUDRepository.delete` (lines 51-59): the inherited soft-delete UPDATEs ONLY the parent table — `UPDATE collector SET deleted_at = NOW() WHERE id = ?`. The FK `collector.token_id → token.id` remains; the `token` row is untouched.
  - **The TOKEN row remains**: its `value` column carries the plaintext credential, indefinitely. The row is unreachable via Collector navigation (the parent is soft-deleted) but lives in the table.

  **Operator-visible consequences**:
  - **Backup retention**: an operator running standard PostgreSQL backups (pg_dump nightly, retained for 90 days per typical SOX/GDPR compliance) carries 90 days of plaintext deleted-collector tokens.
  - **Replica drift**: a hot-standby or read-replica carries the orphan tokens until manual cleanup.
  - **Incident response**: an operator investigating a credential leak ("did we ever issue a token for this URL?") queries `SELECT * FROM token WHERE created_at > '2025-01-01'` and sees credentials that have been "deleted" via the UI but are still in the table — confusing the investigation timeline.
  - **GDPR right-to-erasure**: a customer requesting data erasure for their integration credentials cannot be told "the token has been deleted" — it has not.
  - **Audit trail asymmetry**: the UI shows "Collector deleted"; the DB shows "TOKEN row still present". Audit reports comparing UI state to DB state surface a discrepancy.

  **Why HIGH not MEDIUM (the sidecar's own rating)**: the sidecar rates this MEDIUM-HIGH per `bugs_limitations_corner_cases` and HIGH per `security.known_security_gaps`. We rate THIS gap HIGH because: (a) the plaintext-credential persistence has GDPR/SOX implications operators cannot mitigate without raw DB access; (b) the orphan growth is unbounded — every collector ever deleted leaves a row; (c) there is NO scheduled cleanup job (no entry in the 5-job housekeeping cycle covers the `token` table). The asymmetry between the UI's "deleted" view and the DB's "still present" reality is a forensic-investigation hazard.

  **Test gap shape**: regression-pin asserting: (a) after `DELETE /api/collectors/{id}`, the `collector` row has `deleted_at IS NOT NULL`; (b) the `token` row referenced by the deleted collector's `token_id` STILL EXISTS in the `token` table; (c) the `token.value` column STILL HOLDS the plaintext credential; (d) no scheduled job (housekeeping cycle) removes the orphan token. The current state is PINNED — failures land if a future maintainer adds `tokenRepository.delete(collector.token_id)` to the delete path, or adds a housekeeping job to GC orphan tokens.
