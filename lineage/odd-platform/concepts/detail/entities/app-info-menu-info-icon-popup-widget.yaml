  owner_scoping:
    verdict: 'N/A'
    detail: |-
      Code is not data-scoped; the widget renders deployment-level +
      global operator-configured information identically for every
      viewer.
  strengths:
    - 'projectVersion renders ONLY when appInfo?.projectVersion is truthy — empty value gracefully suppresses the row (no placeholder leak)'
  weaknesses:
    - 'ALL five external links use target=_blank without rel=noopener noreferrer — reverse tabnabbing vector (per additional-links-no-rel-noopener-and-no-url-validation invariant — broader than batch ZE F-035 scope) (MEDIUM)'
    - 'Operator-configured link URLs are NOT scheme-validated; javascript: / data: / vbscript: pass through; React 17+ neutralises javascript: but not data: (MEDIUM)'
    - 'Under auth.type=DISABLED, projectVersion + operator-configured URLs render inline to anonymous viewers — the UI MULTIPLIES the API-layer disclosure (MEDIUM — REFACTOR-185 UI symptom)'
    - 'Menu is keyboard-inaccessible (only onMouseEnter, no onClick/onKeyDown) — WCAG 2.1 SC 2.1.1 violation. ARIA attributes (aria-haspopup, aria-controls) claim keyboard support that does not exist (MEDIUM — accessibility class, not exploit class)'
