notes: |-
  Strengthened in batch 2026-05-19J with LineageGraph UI sidecar closing the
  traversal operation UI half. Two UI-driven amplifications now confirmed at the
  operation layer:
    (a) UI ALWAYS sends lineageDepth=d (default 1) — masks F-005 NPE from the
        UI path but the silent default may give artificially shallow first
        impression.
    (b) Click-through compounds depth: clicking deep and navigating opens new
        view with d=clicked node's depth (not 1) — compounds backend recursive-CTE
        cost on drill-in.

  Two doc-bugs remain live on `/developer-guides/api-reference/lineage`:
    (a) `lineage_depth` 'Unset returns the platform's default depth' claim is
        UNIMPLEMENTED — there is no default; unset is a 500 NPE; UI masks by
        sending 1.
    (b) `expanded_entity_ids` 'IDs of Data Entity Group entities' claim is
        incorrect — code accepts ANY data-entity IDs.
