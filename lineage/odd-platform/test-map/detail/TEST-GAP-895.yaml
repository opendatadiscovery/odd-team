proposed_action: |-
  Add `TagSideChannelDisabledAuthBypassTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/` annotated `@SpringBootTest` with `auth.type=DISABLED`. Four test methods:
  1. `createTermTagsRelations_underDisabledAuth_anonymousCallerRewritesTermTags` — no token; `PUT /api/terms/{id}/tags`; assert 200 and the term's tag set is rewritten.
  2. `createTermTagsRelations_underDisabledAuth_producesNoActivityEntry_pinsDoubleInvisibility` — after #1, assert ZERO activity-feed rows for the term-tag change (no auth AND no audit).
  3. `updateDatasetFieldTags_underDisabledAuth_anonymousCallerRewritesInternalTags` — no token; `PUT /api/datasetfields/{id}/tags`; assert 200 and the internal tag set is rewritten.
  4. `updateDatasetFieldTags_underDisabledAuth_activityEntryHasUndefinedCaller` — after #3, assert a `DATASET_FIELD_TAGS_UPDATED` activity row exists but with an undefined/null caller identity.

  These tests PIN the DISABLED-bypass as documented behaviour. Pair with the LSN-001/LSN-002-family operator-cliff awareness: consider a fail-fast or a loud startup warning when `auth.type=DISABLED` is set on a non-loopback bind address (a separate REFACTOR/DOC item spanning all DISABLED-mode endpoints).
