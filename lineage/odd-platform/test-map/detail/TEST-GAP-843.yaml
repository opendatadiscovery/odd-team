proposed_action: |-
  **Phase 1 — UI Playwright regression-pin**:

  1. `anonymousCallerUnderDISABLEDNavigatesToDirectory_routeRenders_pinsDisabledAnonymousReach` — boot test-platform with `auth.type=DISABLED`, NO authenticated session, navigate to `/directory`, assert the level-1 grid renders with N cards.

  2. `anonymousCallerUnderDISABLEDNavigatesToDirectoryLevel2_clicksThroughToDataSourceList_pinsCascadeReach` — same setup, click a level-1 card, assert level-2 DataSourceList renders with HOST/PORT/DATABASE properties per card (per F-023 facet 2). PINS the cascade reach.

  **Phase 2 — Backend integration tests**:

  3. `anonymousCallerUnderDISABLEDGetsApiDirectory_returns200WithFullPayload_pinsBackendAnonymousReach` — WebTestClient with no auth header against `GET /api/directory`, assert 200 with full payload.

  4. `anonymousCallerUnderDISABLEDGetsApiDirectoryLevel2_returns200WithFullPayload_pinsCascadeBackend` — same for `GET /api/directory/{prefix}`.

  **Architectural fix decision**:
  - Option A (preserve read-collaborative posture): the test PINS the contract; doc fix is the only change. Add explicit DISABLED-anonymous-reach warning to docs.
  - Option B (gate under DISABLED): add `appInfo.authType !== 'DISABLED'` check to Directory.tsx + backend route. Test flips assertion direction (anonymous caller gets a redirect or 401 under DISABLED).

  The maintainer's policy call (per ADR-CANDIDATE-003) is currently Option A — the test pins the contract. This is consistent with system-mission.md line 267 (read-collaborative posture as an architectural stance).

  Coherence note (LSN-018 Rule 6): STRENGTHENS F-023 + REFACTOR-185 by establishing the UI-tier consequence explicitly. NO contradiction with existing artefacts. The asymmetry with Overview.tsx (which DOES gate the Recommended panel) is structural and deliberate per ADR-CANDIDATE-003. The test pins both the absence of the gate AND the rationale.
