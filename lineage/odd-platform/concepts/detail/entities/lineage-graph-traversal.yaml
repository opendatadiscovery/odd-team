  establisher_oddrn, is_deleted), LineageDepth wrapper, LineageStreamKind (UPSTREAM
  | DOWNSTREAM enum), CommonTableExpression<Record> jOOQ CTE handle, LINEAGE jOOQ
  table reference]; operations[batchDeleteByEstablisherOddrn (ingest-rewrite primitive),
  batchInsertLineages (multi-row INSERT with onDuplicateKeyIgnore on (parent, child,
  establisher) tuples), getTargetsCount + getChildrenCount + getParentCount (group-by
  fan-out counts on non-deleted edges), softDeleteLineageRelations + restoreLineageRelations
  (UPDATE is_deleted for entity status-change cascade), getLineageRelations(List)
  (DEG-internal edges — distinct (parent,child) where BOTH endpoints in oddrn list),
  getLineageRelations(Set, LineageDepth, LineageStreamKind) (THE recursive-CTE traversal
  — primary read), getLineageRelationsForDepthOne (depth-1 fan-out around entity IDs
  joined to DATA_ENTITY — progressive-expansion primitive), lineageCte (private CTE
  assembly)]; 5 ADRs (soft-delete canonical via is_deleted flag — every read filters
  IS_DELETED.isFalse(); ingestion atomicity via paired batchDelete + batchInsert under
  caller @ReactiveTransactional; single-query recursive-CTE traversal — one DB round-trip
  not BFS-per-node; idempotent batch insert via onDuplicateKeyIgnore on PK (parent,
  child, establisher); establisher-keyed edge provenance enables non-destructive cross-producer
  ingestion). **Soft-delete mechanism distinct from policy/data-entity** — uses is_deleted
  boolean (NOT deleted_at timestamp, NOT STATUS state-machine), added in V0_0_79__data_deprecation.sql:11-12.'
