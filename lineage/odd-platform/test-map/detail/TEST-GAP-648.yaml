behaviour: |-
  **Refetch-asymmetry on update vs create/delete unit gap.** OwnersList.tsx:44-46 uses `useEffect(() => { if (!query) dispatch(fetchOwnersList({page:1, size})) }, [isOwnerCreating, isOwnerDeleting, query])`. The dep array includes `isOwnerCreating` and `isOwnerDeleting` but NOT `isOwnerUpdating`. When a create completes (`isOwnerCreating: true → false`), the effect re-fires and refetches page 1. Same for delete. Update completion does NOT trigger a list refetch — the path relies on the `updateOwner` thunk's response hydrating `byId[ownerId]` and the `getOwnersList` selector re-running because `byId` changed. This works IF the response carries the full DTO matching the list projection. Edge case: if the response omits any field rendered by `EditableOwnerItem` (id/name/roles), the row will show STALE data until manual reload. The update path also bypasses any server-side filtering: if the rename changed the owner's match against the current `query`, the list keeps showing the (now-non-matching) row. The asymmetry is deliberate (avoid clobbering an active search) but the cost is a fragile contract. No test asserts (a) `isOwnerCreating` true→false triggers a refetch under `!query`; (b) `isOwnerDeleting` true→false triggers a refetch under `!query`; (c) `isOwnerUpdating` true→false does NOT trigger a refetch (the asymmetry pin); (d) under `query !== ''`, create/delete completion does NOT refetch (the `if (!query)` guard); (e) after a rename via update, if the new name no longer matches the current query, the list keeps showing the row (regression-pin for stale display).
