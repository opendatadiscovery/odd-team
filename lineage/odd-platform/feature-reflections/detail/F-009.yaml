- id: H-011
  hypothesis: "When the text describing why an alert fired (the alert-chunk description, supplied by an upstream collector) contains Slack control sequences such as @channel or a fake link, the Slack message renders those as plain text — it does not broadcast-notify the whole channel or render an attacker-controlled clickable link."
  derivation: "Response-shape + security: the alert-chunk description is rendered into the Slack message body; a notifier should not let upstream-supplied content control Slack-side behaviour."
  seed_source: response-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The latest 3 alert-chunk descriptions are rendered via markdownText(...) at
      SlackMessageGenerator.java:77 (+ 95-101) with NO escaping. Slack interprets @channel,
      @here, <!channel>, <!here>, *bold*, _italic_, ~strike~, and <url|text> as markup.
      AlertChunkPojo.description is populated from ingestion-side AlertActionResolverImpl.java:162
      (upstream collector content — dbt test descriptions, GE expectation strings, schema-diff
      narratives). MrkdwnUtils.java:1-14 has only bold(...) and buildLink(...) helpers for
      platform-controlled strings; there is NO escape(...) for untrusted content, so the
      sequences pass through raw.
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__SlackNotificationSender.md
        section: bugs_limitations_corner_cases[2] + security.known_security_gaps[0]
        cite: "SlackMessageGenerator.java:77 + MrkdwnUtils.java:1-14 + AlertActionResolverImpl.java:162"
        note: "ingestion-supplied description -> markdownText with no escape -> mrkdwn injection"
    operator_visible_failure: |
      An upstream actor who controls an alert description (a compromised or careless collector,
      or anyone who can influence a dbt test name / GE expectation message) can inject @channel
      / <!here> to broadcast-notify the entire Slack channel membership on every matching alert
      (notification fatigue / denial-of-attention), or inject a fake <https://attacker/|click
      here> link to phish channel members who trust ODD alerts. The remediation is a small
      MrkdwnUtils.escape applied before markdownText. The live doc (2026-06-01) now warns about
      this passthrough — doc-gap closed; code gap remains. This is the 6th surface of F-004's
      description-injection family.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-012
  hypothesis: "When the platform writes an alert to Slack / webhook / email, the platform keeps a record (an audit row or its own Activity-feed event) that the alert was delivered (or failed), so an operator or compliance reviewer can later answer 'was alert X delivered, and to which channel?'."
  derivation: "Pillar primary user action 'audit metadata changes on the Activity feed'; cross-pillar (P-07 feeds P-01 activity) + compliance expectation for an alerting subsystem."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      There is no delivery record of any kind. The dispatcher logs at DEBUG on send (off by
      default) and ERROR on per-sender failure; there is no DB audit table, no metric counter
      (notifications_sent_total), no delivery-latency histogram, and crucially no Activity-feed
      event — ActivityEventTypeDto.java:3-31 enumerates 26 constants but ZERO name notification
      delivery (no NOTIFICATION_SENT / NOTIFICATION_FAILED / NOTIFICATION_DELIVERY_ATTEMPTED).
      The SPI seam's void return + no per-message id means even an implementor that WANTED to
      emit an audit event has no message identifier to anchor it to. This is structurally the
      same enum-rooted audit-silence pattern F-006 catalogues, extended to the outbound surface.
    evidence:
      - sidecar: odd-platform__java__notification__processor__class__PostgresWALMessageProcessor.md
        section: bugs_limitations_corner_cases[4]
        cite: "ActivityEventTypeDto.java:3-31"
        note: "26 activity-event constants; none names notification delivery -> structural audit silence"
      - sidecar: odd-platform__java__service__service__NotificationsDispatcher.md
        section: bugs_limitations_corner_cases[1] + security.known_security_gaps[1]
        cite: "AlertNotificationMessageProcessor.java:30-35 + NotificationSubscriber.java:83-84"
        note: "catch-and-log only; LSN advances regardless; no audit row, no metric"
    operator_visible_failure: |
      An operator cannot answer "how many alerts went to Slack last week?", "which alerts
      failed delivery between 14:00-14:30?", or "did the on-call channel receive the schema-break
      alert?" from any ODD telemetry — only by grepping platform logs for receiver-id substrings
      (and DEBUG-level send logs are off by default). A compliance regime requiring proof of
      alert delivery cannot be satisfied. The cross-pillar promise (P-07 alerts/activity feeding
      the audit surface) does not extend to notification delivery. The live doc (2026-06-01)
      now states "Failed deliveries are lost without trace ... no per-channel audit" — doc-gap
      closed; code gap remains.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-013
  hypothesis: "When the operator updates the email recipient list (`notifications.receivers.email.notification.emails`) on a running platform, the change takes effect for subsequent alerts."
  derivation: "Endpoint/config-shape: a recipient list is operator-tunable config; an operator reasonably expects config changes to apply (especially via Actuator /refresh)."
  seed_source: endpoint-shape
  validation:
    verdict: partial
    actual_behavior: |
      The recipient list is bound ONCE at bean construction (EmailNotificationSender.java:36,
      from NotificationConfiguration.java:104,118 via @Value parsing of the comma-string) and
      is never re-read per message. Operator changes require a Spring context restart to take
      effect; Actuator /refresh does not cover this path because the value flows via @Value
      constructor injection, not a @ConfigurationProperties POJO that supports rebind. So the
      hypothesis is TRUE after a restart and FALSE for a live change. The same immutability
      applies to the Slack/webhook URLs (bound as final fields at boot).
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__EmailNotificationSender.md
        section: bugs_limitations_corner_cases[7]
        cite: "EmailNotificationSender.java:36 + NotificationConfiguration.java:104,118"
        note: "recipient list bound at construction; no per-message re-read; /refresh not covered"
      - sidecar: odd-platform__java__notification__sender__class__SlackNotificationSender.md
        section: bugs_limitations_corner_cases[9]
        cite: "SlackNotificationSender.java:27 + NotificationConfiguration.java:77"
        note: "Slack webhook URL is a credential bound at boot; no in-app rotation hook"
    operator_visible_failure: |
      An operator who adds an on-call engineer to the email recipient list (or rotates a leaked
      Slack webhook URL) during an incident sees no effect until they restart the platform
      process. For credential rotation (a leaked Slack/webhook URL is a live bearer token) this
      is operationally significant: there is no SIGHUP / live-reload path, so closing a credential
      leak requires a restart. This is consistent with ODD's broader @Value-config posture, but
      it is load-bearing for credential-class config and undocumented at the channel level.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate

## cross_references

### bug_candidates
- hypothesis_id: H-007
  severity: HIGH
  one_line: "A single malformed alert row poison-stalls ALL alerting cluster-wide (10s replay loop) and grows Postgres WAL until the primary disk exhausts; no DLQ / skip-poison / operator escape short of deleting the row or dropping the slot."
  recommended_log_as: BUG-NNN (or upstream-issue opendatadiscovery/odd-platform)
  proposed_fix_anchor: "NotificationSubscriber.java:80-84 — wrap process() in try/catch and skip-and-advance the LSN on a non-transient processor failure (poison-quarantine), distinguishing it from transient PG-connectivity errors; OR widen the SPI seam (PostgresWALMessageProcessor.java:6) to return a per-message disposition (DELIVERED / RETRY / SKIP-POISON)."
- hypothesis_id: H-008
  severity: HIGH
  one_line: "The single-thread WAL subscriber can die silently (InterruptedException re-throw exits run()); NotificationSubscriberStarter retains no Future and has no death detection, so alerting stops cluster-wide with zero telemetry."
  recommended_log_as: BUG-NNN
  proposed_fix_anchor: "NotificationSubscriberStarter.java:33-35 — retain the Future and add a supervisor (resubmit on unexpected exit) + a health indicator / metric for subscriber liveness."
- hypothesis_id: H-002
  severity: HIGH
  one_line: "Email failures wrapped as raw RuntimeException bypass the dispatcher's per-sender catch and abort fan-out to all subsequent channels for that alert; order is undefined (no @Order), so an email outage can non-deterministically take down Slack + Webhook delivery."
  recommended_log_as: BUG-NNN
  proposed_fix_anchor: "EmailNotificationSender.java:58-60 — wrap as NotificationSenderException (symmetric with Slack/Webhook); OR AlertNotificationMessageProcessor.java:31 — catch the broader Exception per sender. Also add @Order to make fan-out order deterministic."
- hypothesis_id: H-011
  severity: HIGH
  one_line: "Ingestion-supplied alert-chunk descriptions render into Slack mrkdwn unescaped, allowing @channel / <!here> broadcast injection and fake-link phishing (6th surface of F-004's description-injection family)."
  recommended_log_as: BUG-NNN
  proposed_fix_anchor: "SlackMessageGenerator.java:77 — apply a new MrkdwnUtils.escape(...) helper to the alert-chunk description text before markdownText(...)."
- hypothesis_id: H-004
  severity: HIGH
  one_line: "The generic webhook is unsigned — no HMAC / X-ODD-Signature / shared secret / Authorization header and no config knob; anyone who learns the URL can forge alerts into the operator's incident pipeline."
  recommended_log_as: BUG-NNN
  proposed_fix_anchor: "WebhookNotificationSender.java:20-22 + NotificationConfiguration.java:88-99 — add an optional notifications.receivers.webhook.secret config + compute an X-ODD-Signature HMAC-SHA256 over the body; also set Content-Type: application/json."
- hypothesis_id: H-006
  severity: HIGH
  one_line: "Alert bursts are sent 1:1 with no batching / no client-side rate-limit; Slack 429 is undifferentiated and Retry-After is ignored, so most burst alerts are silently dropped exactly when alerting matters most."
  recommended_log_as: BUG-NNN (cross-link REFACTOR-129 'no rate-limiting at any layer')
  proposed_fix_anchor: "AbstractNotificationSender.java:24-29 — read Retry-After on 429 and apply a bounded client-side rate-limit / token bucket; OR coalesce bursts of alerts on the same entity into one message."
- hypothesis_id: H-009
  severity: HIGH
  one_line: "Email protocol check is case-sensitive lowercase 'smtp'; uppercase SMTP silently disables STARTTLS + SMTP AUTH (credentials may go plaintext), with no boot warning."
  recommended_log_as: BUG-NNN (small hardening — doc side already fixed)
  proposed_fix_anchor: "NotificationConfiguration.java:63 — use .equalsIgnoreCase(\"smtp\") (or normalise the protocol value) so STARTTLS/AUTH engage regardless of casing."
- hypothesis_id: H-005
  severity: MEDIUM
  one_line: "Generic-webhook delivery accepts ONLY HTTP 200; 201/202/204 from async-accept receivers are treated as failures and the alert is dropped."
  recommended_log_as: BUG-NNN
  proposed_fix_anchor: "AbstractNotificationSender.java:26-29 — accept the full 2xx range for the webhook channel (keep exact-200 for Slack if Slack requires it)."

