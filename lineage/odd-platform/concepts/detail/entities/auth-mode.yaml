security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - DISABLED
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - S2S
  ingestion_filter_relevance: MIXED
  authorization_consistency:
    verdict: INCONSISTENT
    detail: 'The four `auth.type` modes have asymmetric authentication AND authorization
      wiring. **OAUTH2 + LDAP wire AuthorizationCustomizer** (Policies/Permissions/Roles/Owners
      framework) — `OAuthSecurityConfiguration.java:98` and `LDAPSecurityConfiguration.java:145`
      both call `.authorizeExchange(new AuthorizationCustomizer(permissionService,
      extractors))`. **LOGIN_FORM does NOT wire AuthorizationCustomizer** — `LoginFormSecurityConfiguration.java:55-57`
      runs `.authorizeExchange(... .pathMatchers("/**").authenticated())` only; combined
      with `getAuthorities(true)` at line 81 every form-authenticated user is ADMIN.
      **DISABLED bypasses both** (`DisabledAuthSecurityConfiguration.java:13-18` is
      `.anyExchange().permitAll()`). The composite AuthorizationManagerCondition correctly
      maps the OAUTH2-or-LDAP disjunction but is dead code. (Per-mode wiring matrix
      verified across the four canonical *SecurityConfiguration sidecars: AuthorizationManagerCondition@L11.md:bugs_limitations_corner_cases.[0,1]
      + LoginFormSecurityConfiguration@L31.md:bugs_limitations_corner_cases.[0] +
      OAuthSecurityConfiguration@L71.md:implicit_adrs.[0] + LDAPSecurityConfiguration@L51.md:implicit_adrs.[AuthorizationCustomizer
      mode-agnostic])'
  owner_scoping:
    verdict: MIXED
    detail: Auth Mode itself is not data-scoped; the modes determine WHETHER any owner-scoping
      downstream applies. Under DISABLED, no owner-scoping (no authenticated principal).
      Under LOGIN_FORM, owner-scoping requires authentication only — but every user
      is ADMIN, so the Policies/Permissions/Roles/Owners framework is inert. Under
      OAUTH2/LDAP, owner-scoping operates via the Policies/Permissions/Roles/Owners
      framework gated by AuthorizationCustomizer.
  strengths:
  - Four explicit modes declared in `application.yml:33` as a YAML comment (`# DISABLED,
    LOGIN_FORM, OAUTH2, LDAP`) — operators reading the file see the enumeration
  - Default value `DISABLED` is in `application.yml:34` (not absent) — explicit choice,
    not accidental
  - Mutually-exclusive `@ConditionalOnProperty(value="auth.type", havingValue="...")`
    on the four SecurityConfiguration classes — clean Spring idiom (DisabledAuthSecurityConfiguration.java:10
    + LoginFormSecurityConfiguration.java:31 + OAuthSecurityConfiguration.java:71
    + LDAPSecurityConfiguration.java:51 — parallel structure consistently authored
    across the four files)
  - DISABLED mode is INTENTIONALLY an explicit-chain construction (not a no-bean fall-through
    to Spring autoconfig) — `DisabledAuthSecurityConfiguration.java:13-18` carries
    the permit-all chain in code so the posture is statement-of-intent rather than
    emergent. (DisabledAuthSecurityConfiguration@L10.md:implicit_adrs.[1])
  - Live `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security`
