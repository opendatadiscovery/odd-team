name: Per-Entity Alert Listing (read surface)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-07
  - P-01
description: |-
  **NEW ENTITY, batch 2026-05-19L** — the per-entity alert-read surface
  at `GET /api/dataentities/{data_entity_id}/alerts`. The endpoint is
  THIN at every layer — one-line controller (`DataEntityController.java:315-321`),
  five-line service (`AlertServiceImpl.java:138-143`), single-SELECT
  repository (`ReactiveAlertRepositoryImpl.java:182-199`) — but is the
  doc-recommended **audit-export workaround** for the housekeeping bug
  that hard-deletes manually-resolved alerts (per the live alerting page
  WebFetched 2026-05-19, anchor `#auto-cleanup-of-resolved-alerts`).

  **What the endpoint returns**: an `AlertList` payload (paginated by
  required `page` + `size` query params) containing the entity's
  complete alert history (OPEN + RESOLVED + RESOLVED_AUTOMATICALLY)
  with all chunks (raw description text propagated from ingestion or
  AlertManager webhooks) and status history (status_updated_by owner
  identity included).

  **What's distinctive about the contract** (the architecturally-load-bearing
  observations):

    - **Cross-owner read posture**: no `@PreAuthorize`, no entry in
      `SecurityConstants.SECURITY_RULES` for the GET path, no
      `OWNERSHIP` join in the SQL. Falls through to `pathMatchers('/**')
      .authenticated()`. Any authenticated user (LOGIN_FORM / OAUTH2 /
      LDAP) can enumerate any data entity's alert history by ID. Same
      pattern shape as REFACTOR-024 (catalog-wide cross-owner
      enumeration on getAllAlerts), applied to a per-entity surface.

    - **Soft-delete-inclusive existence-check**: the service-layer
      existence-check uses `existsIncludingSoftDeleted`
      (`AlertServiceImpl.java:327-335` →
      `ReactiveDataEntityRepositoryImpl.java:150-155`) rather than the
      sibling `existsNonDeletedByDataSourceId` (line 158) which DOES
      filter soft-delete. Operators passing soft-deleted entity IDs
      receive the pre-deletion alert history — intentional, useful for
      the audit-export workaround, but un-documented in the live alerting
      page.

    - **Read-cardinality split between batch and per-entity reads** —
      batch reads (getAllAlerts, getAssociatedUserAlerts,
      getDependentEntitiesAlerts) are owner-scoped via reactor Context
      at `AlertServiceImpl.listByOwner` (except getAllAlerts which is
      unscoped per REFACTOR-024); per-entity reads
      (getDataEntityAlerts, getDataEntityAlertsCounts) are UNSCOPED by
      DESIGN. The implicit ADR: "per-entity alert reads are unscoped
      because the caller has already chosen the entity". The decision
      shape is visible structurally — `ReactiveAlertRepositoryImpl.java:182-199`
      has no `OWNERSHIP` join; the sibling `listByOwner` query at
      lines 160-178 DOES.

    - **Pagination is required by contract but unbounded by validation**
      — `PageParam` + `SizeParam` (`components.yaml:4213-4229`) are
      `required: true` but carry no `minimum:` or `maximum:`; the
      repository computes `OFFSET = (page - 1) * size` (line 189) with
      no clamping. A caller passing `size=1_000_000` triggers a single
      large query bounded only by Postgres / network buffers. Pairs
      with the existing
      "pagination-parameters-declared-but-unconstrained-at-spec-and-controller-layers"
      invariant.

    - **No alert-status filter** while the sibling counts endpoint
      accepts one — `getDataEntityAlertsCounts` accepts an
      `AlertStatus status` query param; the listing endpoint does
      not.

  **Audiences**:
    - ODD Platform UI — the per-entity `Alerts` tab on the data-entity
      detail page (live alerting page names this verbatim).
    - Operators running the housekeeping audit-export workaround — the
      live alerting page WebFetched 2026-05-19 names this endpoint as
      the workaround for the manually-resolved-alert hard-delete bug.
    - Third-party API consumers building compliance / audit-export
      integrations.

  **Documentation drift** (verified WebFetch 2026-05-19): the live
  alerting page documents the endpoint as the audit-export workaround
  but is SILENT on (a) the cross-owner read posture (the workaround
  is described as if intended for one's own entities only), (b)
  the pagination shape (a complete export of a high-volume entity
  requires multiple paginated calls — operators following the doc
  literally silently truncate).
