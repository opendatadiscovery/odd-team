### H-004 — original-name footer surfaces the pre-rename name when both names exist

- id: H-004
- hypothesis: |-
    When an operator has renamed an entity (business name AND external name both present),
    the header shows an `Original: {externalName}` footer so the user can still see what
    the entity was called before the rename.
- derivation: "originalName = internalName && externalName && (...) (DataEntityDetailsHeader.tsx:63-70)."
- seed_source: response-shape
- validation:
    verdict: partial
    actual_behavior: |-
      `DataEntityDetailsHeader.tsx:63-70` renders the `Original: {externalName}` footer ONLY
      when BOTH `internalName` AND `externalName` are truthy. The promise holds for the
      renamed case. BUT the footer is discovery-hostile in the inverse: an operator who has
      NOT yet authored a business name sees the imported name in the heading with NO hint
      that an `Original`/`External name` concept even exists — the footer's existence is only
      revealed AFTER the rename. The label is also localized as "Original" with no "External
      name" framing, so a first-time user cannot infer the footer is the collector source.
    evidence:
      - sidecar: "SOURCE DataEntityDetailsHeader.tsx:63-70"
        section: source-read
        cite: "DataEntityDetailsHeader.tsx:63-70"
        note: "internalName && externalName && (<LabelItem Original> {externalName})"
        source_read_for_validation: true
    operator_visible_failure: |-
      An operator who has authored a business name sees both names (correct). An operator who
      has NOT renamed the entity sees only the imported name and never learns there is an
      "external/original name" distinction until they happen upon the "Add business name"
      button on the far right of the row. The footer documents a relationship that is invisible
      until it is too late to be a discovery aid. Low operator harm (cosmetic/discoverability),
      but a genuine asymmetry between the promise ("you can always see the original name") and
      the reality ("only after you rename").
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

