behaviour: |-
  DEG-anchored lineage cross-owner regression-pin (CRITICAL — primary-source confirmation of REFACTOR-203 on the DEG-anchored sibling endpoint; cross-pillar P-05+P-09+P-01). `LineageServiceImpl.getDataEntityGroupLineage` (LineageServiceImpl.java:59-85) has NO `AuthIdentityProvider` field (verified at lines 54-57), NO `fetchAssociatedOwner()` call, NO `permissionService.hasPermission(...)` call, NO `@PreAuthorize`, and NO `SecurityRule` entry in `SecurityConstants.SECURITY_RULES` (verified by Grep `dataentitygroups.*lineage` returning zero matches). The path falls through to `AuthorizationCustomizer.java:29-30`'s catch-all `.pathMatchers("/**").authenticated()`. Any authenticated user — regardless of owner association — can read ANY DEG's full member graph + inter-member edges + per-member metadata (id, oddrn, internal/external name, entity_classes, datasource, namespace, status, owners, tags). For multi-team Domains/DEGs the leakage is structurally WIDER than per-entity lineage REFACTOR-203 — the per-connected-component partitioning at `establishDEGRelations` (LineageServiceImpl.java:200-216) surfaces 'team A's entity X is on the same data-pipeline as team B's entity Y' even when the individual entities would not be cross-team-searchable. The DEG itself is a CONCEPTUAL grouping — leaking 'team A and team B both contribute to the Finance Domain' reveals organisational structure that the DEG was designed to represent but not necessarily to disclose to every authenticated user. Under `auth.type=DISABLED` the endpoint is anonymously reachable. The live operator-facing data-lineage and api-reference docs are SILENT on this posture (WebFetched 2026-05-19 status 200 — both). Cross-pillar bump: P-05 (Data Lineage feature exposure) + P-09 (security read-collaborative posture, ADR-CANDIDATE-003) + P-01 (Discovery — DEG cross-owner member enumeration). NO test exists.
