feature_id: F-059
pillar_id: P-03
pillar_anchored_id: P-03:F-003
pillar_anchored_feature_name: Lookup Table Rename Cascade
feature_name: |-
  Lookup table rename — operator metadata edit silently renames the underlying
  Postgres table, breaking every downstream pipeline that joined against the
  documented public surface (lookup_tables_schema)
seeded_from: SHB-047
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  rest:PUT /api/referencedata/table/{lookup_table_id} — the metadata
  rename endpoint. Beyond updating the catalog metadata, executes
  `ALTER TABLE lookup_tables_schema.n_{nsId}__{old_underscored_name}
  RENAME TO lookup_tables_schema.n_{nsId}__{new_underscored_name}` as a
  side effect.
primary_subject:
  - odd-platform-api/src/main/java/.../ReferenceDataServiceImpl.java:107-124
  - odd-platform-api/src/main/java/.../ReferenceDataRepositoryImpl.java:181-202
  - odd-platform-api/src/main/java/.../ReferenceDataServiceImpl.java:191-194 (buildTableName)
contributing_nodes:
  - node_id: odd-platform ts react-component:LookupTableForm
    role: ui-edit-form
    sidecar: lineage/odd-platform/understanding/odd-platform__ts__react-component__component__LookupTables.md
    note: |-
      LookupTableForm.tsx:84-93 — form has ONE name field. No UI surface to
      opt out of the physical rename, no UI surface to set an alias, no
      warning dialog at rename-time, no preview of the resulting physical
      table name. The operator-visible action is "edit metadata"; the
      hidden side-effect is "DDL on a documented public SQL surface."
    unresolved: false
  - node_id: odd-platform java controller:ReferenceDataController (updateLookupTable)
    role: rest-entry-point
    sidecar: lineage/odd-platform/understanding/odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
    note: |-
      bugs_limitations_corner_cases[7] (sister-sidecar) records this finding
      at MEDIUM severity. SHB-047 promotes to HIGH because the doc-promised
      public-schema surface compounds the blast radius.
  - node_id: odd-platform java service:ReferenceDataServiceImpl (updateLookupTable)
    role: service-tier
    sidecar: '(referenced from ReferenceDataController sidecar coupling)'
    note: |-
      ReferenceDataServiceImpl.java:107-124 — updateLookupTable rebuilds the
      physical table name by re-running buildTableName(formData.getName(),
      table.namespacePojo()) — the rename is a SIDE EFFECT of the metadata
      edit. buildTableName at lines 191-194:
      name.toLowerCase().replace(" ", "_"). So "Customer Lookups" →
      customer_lookups; "Customer Lookup Codes" → customer_lookup_codes.
      Any name change that mutates the lowercased-underscored form mutates
      the table name.
    unresolved: true
  - node_id: odd-platform java repository:ReferenceDataRepositoryImpl
    role: persistence-tier-ddl
    sidecar: '(referenced from ReferenceDataController sidecar coupling)'
    note: |-
      ReferenceDataRepositoryImpl.java:181-202 — the DDL chain executing
      `ALTER TABLE ... RENAME TO ...` against lookup_tables_schema. No
      deprecation alias, no rename view, no notification, no audit emission,
      no UI warning at rename-time.
    unresolved: true
