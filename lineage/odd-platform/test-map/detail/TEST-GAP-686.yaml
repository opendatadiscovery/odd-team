proposed_action: |-
  Add `AuthorizationHotPathCacheTest.getCurrentUserPolicies_perRequestNoCache_alwaysFreshFromDb_pinsImmediateRevocationContract` as a Mockito-style unit test. (a) Spy on `roleService.getCurrentUserRoles()` and `policyRepository.getRolesPolicies(any())`. (b) Invoke `policyService.getCurrentUserPolicies()` THREE TIMES sequentially. (c) `verify(roleService, times(3)).getCurrentUserRoles()`. `verify(policyRepository, times(3)).getRolesPolicies(any())`. (d) Pair with an integration-level rev-test: revoke a permission via `PUT /api/roles/{id}` with body removing the permission; immediately call `GET /api/dataentities/{id}` (a permission-gated read); assert 403. The integration half pins the immediate-revocation contract. (e) Add a `// REGRESSION-PIN — Authorization is RESOLVED FRESH PER REQUEST. No cache; permission revocation takes effect on the NEXT request. A REFACTOR introducing a Caffeine/Redis cache will break (c)'s call count assertion, and will also change the revocation latency from "next request" to "next cache eviction" — making the trade-off DELIBERATE.` comment block. Also surface as a candidate REFACTOR for permission-resolution caching once the freshness vs cost trade-off is explicitly debated.
