notes: |
  Cross-batch architectural-hygiene + security finding. The replace-not-merge
  pattern is INTENTIONAL design with a real contract (multi-producer ingestion
  is safe because each producer owns its own establisher-keyed edges) BUT the
  destructive surface for any SINGLE producer is uncovered in the operator-facing
  docs and uncaught by any test.

  Headline gap: no test pins the replace-not-merge semantics. A maintainer
  changing the verb from `replace` to `merge` (or vice versa) would silently
  flip the contract with no test feedback.

  Recommended doc + test follow-ups:

    (a) Test: integration test pinning the replace-not-merge semantics for
        BOTH lineage and metadata. Re-ingest the entity with a partial set;
        assert the omitted edges/fields are REMOVED.

    (b) Doc: extend `/integrations/ingestion-filters` (or a new
        `/integrations/ingestion-semantics` page) with a 'Per-call contract'
        section naming the replace-not-merge invariant; warn that collectors
        MUST re-emit the full state every call.

    (c) Log: add `log.warn` on the metadata-delete branch (when bindingsToDelete
        is non-empty) so operators have an audit trail of silent deletes.

    (d) Activity emission: extend `ActivityIngestionRequestProcessor` to
        emit `DATA_ENTITY_UPDATED` events for existing entities that had
        their metadata or lineage modified — closes the audit gap that's
        currently invisible.

  Cross-references:
    - Companion invariant: `single-transaction-per-batch-ingestion-no-per-entity-isolation`
      (the other side of the ingestion-contract gap operators don't expect).
    - LSN-001 (attachment ephemeral default) — class of finding: bundled defaults
      ship with destructive trade-offs that are not signposted.
