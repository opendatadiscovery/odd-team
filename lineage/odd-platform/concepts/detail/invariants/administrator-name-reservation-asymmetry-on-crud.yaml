name: Administrator-name reservation asymmetry on CRUD
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-12E** — codebase-wide CRUD-defensive
  asymmetry pattern on the RBAC primary surface. `RoleServiceImpl` + `PolicyServiceImpl`
  both protect the seeded `Administrator` predefined name on **update** + **delete**
  paths but NOT on **create**. Specifically: (a) `RoleServiceImpl.update` (line 67-69)
  + `.delete` (lines 81-84) explicitly check `UserProviderRole.values()` (case-sensitive
  `.equals` on update, case-insensitive `.equalsIgnoreCase` on delete — itself an
  internal inconsistency) and reject with `BadUserRequestException` if the target
  name matches the predefined enum; `RoleServiceImpl.create` (lines 51-61) has NO
  such check. (b) `PolicyServiceImpl.update` (line 76) + `.delete` (line 87) explicitly
  filter `policy -> !policy.getName().equals(ADMINISTRATOR_POLICY)` and raise `BadUserRequestException("Administrator
  policy cannot be updated/deleted")`; `PolicyServiceImpl.create` (lines 62-69) has
  NO such check. The only thing protecting the reserved name on creation is the partial-unique
  DB index — `role_name_unique` on `role(name) WHERE deleted_at IS NULL` (V0_0_55__add_policies_and_roles.sql:42)
  + `policy_name_unique` on `policy(name) WHERE deleted_at IS NULL` (V0_0_55__add_policies_and_roles.sql:30)
  — both of which depend on the seeded row still being present. If an operator hard-deletes
  the seeded Administrator row (e.g. direct SQL `DELETE FROM role WHERE name=''Administrator''`
  bypassing the soft-delete API), this endpoint can recreate it with attacker-chosen
  policy bindings. The recreated row binds to existing user-owner mappings that referenced
  the original Administrator id (FK semantics depend on `owner_to_role` and `role_to_policy`
  cascade behaviour, not verified in this pass). Asymmetry is silent: no comment,
  no exception, no doc warning. **OwnerController also exhibits a related-but-different
  shape**: there is no seeded ''Administrator'' Owner row to begin with, so the name-reservation
  pattern doesn''t directly apply — but the same `OwnerServiceImpl.update`/`.delete`
  paths perform existence/cascade guards while `.create` does not enforce uniqueness
  beyond the DB constraint. The pattern across all three services (Role + Policy +
  Owner) is ''destructive mutations validate; create paths don''t'', a codebase-wide
  CRUD-defensive asymmetry. Recommended cleanup: extract a `RbacNameValidator` helper
  that checks `UserProviderRole.values()` + `ADMINISTRATOR_POLICY` and invoke it from
  all three `create` paths, OR move the protected-name check into the `BaseSoftDeleteCRUDRepository.create`
  template method.'
axes_present:
- controllers
nodes:
- odd-platform java RoleController controller-method:createRole
- odd-platform java PolicyController controller-method:createPolicy
