proposed_canonical: Authoritative server-side permission evaluation graph (shared
  read + enforce)
rationale: 'Single-sidecar canonical observation from batch 2026-05-12E (PermissionController.getResourcePermissions).
  The platform deliberately exposes `GET /api/resource/{type}/{id}/permissions` as
  a first-class read-side surface that runs the SAME policy-evaluation graph the mutation
  enforcer uses. Trade-off: forged response cannot bypass mutation gating (authoritative-not-UI-hint);
  cost is 4 DB round-trips per call with no caching. Worth surfacing because the design
  intent is invisible to operators reading SECURITY_RULES — the read endpoint has
  no rule entry, looking like an oversight when it''s intentional. HIGH-priority doc-extension:
  extend `/authorization` page with a ''Read-side permission discovery'' section naming
  this endpoint AND explaining why it has no SECURITY_RULES gate (the answer is bounded
  to the caller''s own resolved permissions). Plus add a batch-variant performance
  recommendation (POST /api/resource/{type}/permissions for list-view N+1 elimination).'
contributing_concepts:
- PermissionController.getResourcePermissions (batch E)
- Shared `PermissionService` + `ContextualPermissionExtractor` graph between read
  endpoint and AuthorizationCustomizer (batch E)
- Per-request 4-query fan-out (policies + dimensions + tags + owner)
suggested_add_to_docs: true
