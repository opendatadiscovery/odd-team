### H-006 — DELETED entity shows a banner explaining why edit affordances are gone

- id: H-006
- hypothesis: |-
    When an operator opens a DELETED (soft-deleted) entity and the edit affordances are
    hidden, the header (or page) shows a banner / message explaining the entity is
    soft-deleted and read-only — so the operator understands WHY the buttons are missing
    and how to recover (flip status back to STABLE/DRAFT/DEPRECATED).
- derivation: |-
    Negative-space: an operator's normal expectation is that a UI explains why an action is
    unavailable rather than silently removing it. `isStatusDeleted` gates span lines 47, 87,
    123. P-01 mission treats DELETED as a recoverable soft-delete state (30-day TTL).
- seed_source: negative-space
- validation:
    verdict: contradicted
    actual_behavior: |-
      There is NO banner. `DataEntityDetailsHeader.tsx:47` computes `isStatusDeleted` and
      lines 87 (business-name edit), 123 (Edit-group), plus sibling gates
      `OverviewTags.tsx:39` and `OverviewGroups.tsx:33` simply render NOTHING when
      `isStatusDeleted` is true. Five edit affordances vanish with no explanatory surface.
      The status badge still shows "DELETED" but no copy connects the missing buttons to
      that state. updateStatus.md confirms DELETED is a recoverable soft-delete (restore via
      status flip) — so the recovery path exists but is undiscoverable from the read-only view.
    evidence:
      - sidecar: "SOURCE DataEntityDetailsHeader.tsx"
        section: source-read
        cite: "DataEntityDetailsHeader.tsx:47, :87, :123"
        note: "three isStatusDeleted gates; no banner branch"
        source_read_for_validation: true
      - sidecar: odd-platform__java__DataEntityController__controller-method__updateStatus.md
        section: implicit_adrs
        cite: "DataEntityInternalStateServiceImpl.java:78-98"
        note: "DELETED is a recoverable soft-delete state — restore via status flip back to a visible state"
    operator_visible_failure: |-
      (1) An operator opening a DELETED entity sees the business-name edit, Edit-group,
      Tags-edit, and Groups-edit buttons all absent and concludes "I do not have permission"
      — a wrong diagnosis that sends them to an admin to request access they already have.
      (2) The recovery path (flip status back to editable) is never surfaced, so even an
      operator WITH status-update permission may not realise restoring the entity re-enables
      editing. (3) The behaviour is undocumented on the Statuses page (verified silent,
      2026-05-27). Operator-visible: silent removal of capability + a misleading mental model.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

