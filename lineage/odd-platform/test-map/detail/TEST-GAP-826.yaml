behaviour: |-
  **MEDIUM — Metric labels are propagated verbatim from the ingestion payload through to the storage backend with NO allowlist, NO sanitisation, NO opt-out.**

  `AbstractTimeSeriesExtractor.java:30-31` calls `mapper.mapToProtoLabels(labels)` as a straight pass-through. `CounterTimeSeriesExtractor.java:32-46` (and the three other extractors) apply no filtering. The labels flow:

  **PROMETHEUS path**: labels are written verbatim as Prometheus label key-value pairs via the Snappy-compressed `WriteRequest` protobuf. PII labels (`user_email=joe@example.com`, `dataset_owner_email=`, internal-employee identifiers) are stored in the operator's external Prometheus AND become queryable by every operator/team with read access to that Prometheus instance.

  **INTERNAL_POSTGRES path**: labels are written to `metric_label_value` table via `metricLabelValueRepository.getOrCreateMetricLabelValues(...)` (`InternalIngestionMetricsServiceImpl.java:159-160`). Stored in plaintext. Readable via the per-DataEntity Metrics tab to every authenticated platform user.

  **PII surface examples**:
  - A `DataConsumer`-typed entity ingests labels `{user_email: "...", session_id: "..."}` — PII enters the catalog.
  - A `Job`-typed entity ingests labels `{run_user: "ml-team@corp.com", api_key_fragment: "..."}` — credentials leak.
  - A `Dataset`-typed entity ingests labels `{sensitive_partition: "ssn_2024"}` — schema metadata that should be redacted leaks.

  **No counter-measures**:
  - No allowlist on label keys (verified: no `LabelSanitiser` / `MetricLabelFilter` / `PIIScrubber` class in the codebase).
  - No regex filter on label values.
  - No opt-out (operator cannot configure "drop these label keys").
  - No PII tagging on stored labels (no `is_pii` column on `metric_label`).

  **Compound failure**:
  - **With TEST-GAP-823**: unauthenticated callers (i.e. anyone reaching the HTTP port) can inject PII into the catalog. A malicious actor floods the catalog with falsified PII to trigger downstream GDPR/CCPA compliance events.
  - **With TEST-GAP-824**: multi-tenant deployments leak PII across tenant boundaries (INTERNAL_POSTGRES has no tenant isolation; PII from tenant A is visible to tenant B's users).

  **Why MEDIUM** (the sidecar rates MEDIUM): the gap is real but PII injection requires intentional misuse or an upstream collector bug; legitimate metric labels are usually non-PII. But the absence of ANY guard is the structural finding — a single misconfigured collector emitting `user_email=` as a label silently leaks PII into the catalog forever.

  **Test gap shape**: regression-pin asserting:
  1. PII-shaped labels (`user_email=...`, `password=...`, `ssn=...`) ingest without filtering.
  2. The labels become readable via `GET /api/dataentities/{id}/metrics`.
  3. (PROMETHEUS variant) the labels are present in the external Prometheus `/api/v1/query` response.
