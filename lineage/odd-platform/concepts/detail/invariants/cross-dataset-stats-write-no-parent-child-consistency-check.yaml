name: Cross-dataset stats-write — payload dataset_oddrn NOT validated against field-ODDRN parent relationship
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
- P-04
- P-10
description: |-
  **NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20-Z (postDataSetStatsList sidecar)** —
  the `POST /ingestion/entities/datasets/stats` endpoint accepts a
  `DatasetStatisticsList` payload of per-dataset records, each carrying
  a `dataset_oddrn: String` + a `fields: Map<datasetFieldOddrn, DataSetFieldStat>`
  map. The implementation
  (`DatasetFieldServiceImpl.updateStatistics` line 158-181) uses the payload
  in two structurally-independent ways:
    (a) the per-DataSetStatistics `dataset_oddrn` is consumed ONLY to
        compute the set of dataset ODDRNs whose FTS structure vectors to
        recompute (line 168-170, 179);
    (b) the per-field `dataset_field` rows are resolved by FIELD ODDRN from
        the payload's `fields.keySet()` (line 172-174 —
        `getLastVersionDatasetFieldsByOddrns`); the actual writes target
        the resolved field rows regardless of which dataset they belong to.

  **The structural consequence**: there is NO parent-child consistency check
  between the declared `dataset_oddrn` and the resolved field's actual
  parent dataset. A malicious payload of shape
  `{dataset_oddrn: A, fields: {odd:datasource:B:dataset:b:field:b1: <stats>}}`
  writes stats to field `b1` of dataset B while triggering FTS recalc on
  the unrelated dataset A. An attacker with knowledge of ANY field's ODDRN
  (deterministic per `{datasource_oddrn}/datasets/{dataset_name}/fields/{field_name}`
  shape; visible in the platform's UI to all authenticated users) can write
  arbitrary statistics to that field's `stats` JSONB column.

  **Composition with REFACTOR-185 AUTH-MODE-ORTHOGONAL facet**: the endpoint
  is unauthenticated in every shipped deployment posture (per the batch-Z
  REFACTOR-185 27-sidecar extension). Combined with this cross-dataset
  write gap, the data path is: any HTTP caller → arbitrary field-by-ODDRN
  writes → catalog-wide poisoning of the Dataset Structure tab + the
  Quality Dashboard rings + BI tools consuming `dataset_field.stats`.

  **The audit-trail amplifier**: no `@ActivityLog` on
  `DatasetFieldServiceImpl.updateStatistics` (line 158-181) — unlike the
  sibling `updateInternalName` (line 99) and `updateDatasetFieldTags`
  (line 119) which ARE audited. The cross-dataset write surface is
  unaudited. Per the AUDIT-LOG-PRESENCE-ASYMMETRY-2-TIER pattern: stats
  writes fall through both tiers (no Activity Feed, no domain log).

  **Severity HIGH**: write-to-any-field-by-ODDRN cross-dataset, combined
  with unauthenticated reach and no audit-trail. Same shape as the F-008
  `datasource_scoping_is_payload_driven_not_principal_driven` drift facet
  but applied to a SEPARATE endpoint with NO ingestion-filter coverage.
