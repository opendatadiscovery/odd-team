- id: H-004
  hypothesis: "When an operator points the generic webhook at their incident-management endpoint, that endpoint can verify the POST genuinely came from ODD (a signature / HMAC / shared secret), so a third party who learns the URL cannot forge alerts."
  derivation: "Endpoint-shape (a generic webhook is a security boundary); industry-canonical webhook integrations (GitHub HMAC-SHA256, Slack signing secret, AlertManager auth headers) make origin-verification a default operator expectation."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      WebhookNotificationSender builds the request with .uri(...) + .POST(ofString(json)) +
      .build() only — no Authorization header, no X-ODD-Signature, no HMAC over the body, no
      shared-secret config knob, and not even a Content-Type header. There is no
      notifications.receivers.webhook.* config for headers or secrets. The operator's receiver
      cannot distinguish a genuine ODD alert from a forged AlertNotificationMessage-shaped payload
      POSTed by anyone who learned the URL (e.g. via an exposed /actuator/env — the URL is not
      masked by Spring's default sanitisation).
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__WebhookNotificationSender.md
        section: bugs_limitations_corner_cases[0] + security.known_security_gaps[0]
        cite: "WebhookNotificationSender.java:20-22"
        note: "no header / no signing on the HttpRequest builder"
      - sidecar: odd-platform__java__notification__sender__class__WebhookNotificationSender.md
        section: security.data_exposure[3]
        cite: "NotificationConfiguration.java:91"
        note: "webhook URL reachable via /actuator/env; Spring default mask does not cover 'url'"
    operator_visible_failure: |
      The webhook URL IS the only credential, and it is unsigned: any party who obtains it (leaked
      container image, deployment artefact, exposed actuator) can inject fabricated alerts into the
      operator's incident pipeline — triggering false pages, masking real incidents, or poisoning
      downstream automation. The operator's only defence is network isolation (VPN / private
      network / IP allowlist) which ODD does not enforce or surface. The live doc (as of 2026-06-01)
      NOW warns about this, so the doc-gap is closed — the code gap remains.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_ref: null
    coverage_note: |-
      CONTRADICTED security gap, tracked as PLT-016 Defect 6. The fix (an X-ODD-Signature HMAC over
      the body + a signing-secret config) wants a regression guard once it lands. test_demand:
      functional (assert the outbound POST carries a valid HMAC header when a secret is configured).
    test_demand: functional

- id: H-005
  hypothesis: "When an operator's webhook receiver accepts the alert and responds with a standard success code (201 Created, 202 Accepted, 204 No Content — common for async-accept receivers), ODD treats the delivery as successful."
  derivation: "Endpoint-shape: a generic webhook POST follows HTTP semantics where any 2xx is success; async incident receivers commonly return 202."
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      AbstractNotificationSender.sendAndValidate checks `response.statusCode() !=
      HttpStatus.OK.value()` — i.e. exactly 200. Any other status, INCLUDING 201/202/204 and 3xx
      redirects, raises NotificationSenderException and the alert is dropped from that channel with
      the message "Notification sender response didn't complete with 200 status code". A
      correctly-functioning async-accept receiver that returns 202 is treated as a failure. The
      same 200-only rule applies to Slack (where it is per-spec — Slack returns 200) but for the
      generic webhook it is an unwarranted narrowing of the 2xx contract.
    evidence:
      - sidecar: odd-platform__java__notification__sender__class__WebhookNotificationSender.md
        section: bugs_limitations_corner_cases[7] + invariants
        cite: "AbstractNotificationSender.java:26-29"
        note: "statusCode() != 200 -> exception; 2xx-non-200 treated as failure"
      - sidecar: odd-platform__java__notification__sender__class__SlackNotificationSender.md
        section: invariants + bugs_limitations_corner_cases[0]
        cite: "AbstractNotificationSender.java:24-29"
        note: "shared exactly-200 contract inherited by both Slack and Webhook senders"
    operator_visible_failure: |
      Operators integrating ODD's generic webhook with queue-backed / async incident receivers
      (which return 202 Accepted) see EVERY alert reported as a failure in the logs and (depending
      on the receiver) the receiver may have actually processed the alert — so ODD's failure log is
      wrong, OR a strict receiver that returns 204 silently drops the alert. Either way the operator
      cannot use ODD's webhook with a 2xx-but-not-200 receiver without inserting an HTTP gateway
      that rewrites the status code.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_ref: null
    coverage_note: |-
