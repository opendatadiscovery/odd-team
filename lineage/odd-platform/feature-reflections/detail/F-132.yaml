- id: H-007
  hypothesis: "When a user views the Overview tab, the snippet definition and query are displayed as the literal text the author typed — not interpreted as Markdown/HTML, and not executing any embedded payload."
  derivation: "Response shape + negative-space — the Overview tab is the read surface for a SQL body; a user does not expect SQL or a comment containing < or a Markdown link to be reinterpreted. This is the F-004 family render site QueryExampleDetailsOverview.tsx."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The Overview tab renders both `definition` and `query` through `@uiw/react-md-editor`'s
      MDEditor.Markdown at QueryExampleDetailsOverview.tsx:19,25 (per the QueryExampleController sidecar
      security.data_exposure + known_security_gaps + DOC-183 Caveat 3). The fields are stored verbatim
      (text NOT NULL, no HTTP/service sanitisation) and the shared Markdown.tsx adds no rehype-sanitize
      allowlist beyond the library default. So Markdown IS interpreted: `**bold**` renders bold,
      `[x](javascript:...)` renders a link, raw HTML blocks render. This is the 4th member of the F-004
      stored-XSS family — the SAME render site the F-025 sibling reflection H-007 routes to PLT-018.
    evidence:
      - sidecar: odd-platform__java__QueryExampleController__controller-class__QueryExampleController
        section: security.known_security_gaps[0] + security.data_exposure + bugs_limitations_corner_cases.[Markdown XSS]
        cite: "QueryExampleDetailsOverview.tsx:19,25 + Markdown.tsx:1-127 + V0_0_84__create_query_example.sql:5"
        note: "Overview tab renders definition+query via MDEditor.Markdown, no extra sanitiser — F-004 4th surface"
    operator_visible_failure: |-
      (1) An author pasting a SQL body that contains Markdown-significant characters (a comment with
      `**` or a URL in brackets) sees it reflowed/rendered on the Overview tab rather than shown verbatim
      — confusing for a 'query body' the user expects to copy-paste. (2) The security failure: an author
      with QUERY_EXAMPLE_CREATE can plant a payload (javascript: href link, target/data-attr injection)
      that renders to EVERY authenticated reader who opens the Overview tab — and because
      getQueryExampleDetails is read-collaborative (no RBAC gate), the blast radius is every authenticated
      user. (3) No length cap (text up to 1GB; WebFlux 256KB default request cap). The live doc warns about
      this (DOC-183, done); the code fix is PLT-018.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    coverage_note: |-
      No stored-XSS regression-pin protects THIS render site specifically (the Overview tab). The
      F-004-family demand covers it; the guarding test (POST a payload, open the details page, assert the
      rendered DOM neutralises the active vector once PLT-018 lands) is a distinct functional demand.

