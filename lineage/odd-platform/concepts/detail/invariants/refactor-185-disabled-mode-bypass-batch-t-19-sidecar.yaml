name: REFACTOR-185 DISABLED-mode + LOGIN_FORM-ADMIN-for-all bypass + read-side AUTH-MODE-ORTHOGONAL (S2S /ingestion/** whitelist) — batch Z 27-sidecar
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  STRENGTHENED INVARIANT — batch 2026-05-20-Z promotes the pattern from 24-sidecar
  (batch X) to 27-sidecar with a NEW THIRD FACET: the AUTH-MODE-ORTHOGONAL read-side
  variant. The pattern now covers a structurally distinct THIRD mechanism by which
  authorization is effectively absent — not via DISABLED (anonymous reach via
  permitAll), not via LOGIN_FORM (every authenticated user is ADMIN regardless of
  Policy), but via the SecurityConstants WHITELIST_PATHS exemption: the entire
  /ingestion/** namespace is removed from BOTH the UI auth chain AND the S2S
  IngestionDataEntitiesFilter (which only path-matches POST /ingestion/entities
  exactly) — leaving 4 sibling /ingestion/* endpoints unauthenticated in EVERY
  shipped deployment posture, including the fully-hardened (auth.type=OAUTH2 +
  auth.s2s.enabled=true + auth.ingestion.filter.enabled=true) configuration.

  **BATCH Z EXPANSION — the AUTH-MODE-ORTHOGONAL S2S facet** (3 new sidecars):
    The IngestionController.getDataEntitiesByDEGOddrn (GET S2S READ) +
    IngestionController.postDataSetStatsList (POST stats) +
    IngestionController.ingestMetrics (POST metrics) sidecars from batch Z
    reveal that THREE sibling /ingestion/* endpoints are unauthenticated under
    EVERY auth-mode combination — not because the path is bypassed by a
    SecurityConfiguration permitAll() (DISABLED) and not because every
    authenticated user is ADMIN (LOGIN_FORM), but because:
      (a) `/ingestion/**` is in SecurityConstants.WHITELIST_PATHS line 95-96 —
          removed from EVERY UI auth chain by AuthorizationCustomizer line 22
      (b) `IngestionDataEntitiesFilter` path matcher is exact-literal
          `/ingestion/entities` POST (IngestionDataEntitiesFilter.java:28) —
          does not match the sibling sub-paths
      (c) `IngestionDataSourceFilter` path matcher is exact-literal
          `/ingestion/datasources` POST (IngestionDataSourceFilter.java:20) —
          does not match the metrics, stats, or get-by-deg paths
      (d) AlertManagerController is the FOURTH sibling — fully unauthenticated
          per the existing `entity-oddrn-trust-from-alertmanager-webhook`
          invariant

    The 3 new sidecars in the AUTH-MODE-ORTHOGONAL facet:
      - getDataEntitiesByDEGOddrn (batch Z) — S2S READ unauthenticated; the
        endpoint cannot be locked down by any shipped configuration toggle;
        sequential ODDRN id enumeration leaks the full DEG-to-members graph
      - postDataSetStatsList (batch Z) — S2S WRITE unauthenticated; can populate
        catalog tag taxonomy with arbitrary tag names via the EXTERNAL_STATISTICS
        side-channel (bypassing the TAG_CREATE permission); cross-dataset write
        is the default behaviour (no parent-child consistency check)
      - ingestMetrics (batch Z) — S2S WRITE unauthenticated; metric labels
        propagated verbatim to Postgres/Prometheus with no PII filtering; tenant
        isolation NONEXISTENT on the INTERNAL_POSTGRES default backend (no
        tenant_id column on metric_series/metric_point tables)

    Net result: 24 (batch X) + 3 (batch Z AUTH-MODE-ORTHOGONAL facet) =
    27-sidecar pattern.

  **THE AUTH-MODE-ORTHOGONAL FACET IS OPERATIONALLY DIFFERENT FROM DISABLED AND LOGIN_FORM**:
    Under DISABLED: anonymous network caller hits the platform's HTTP port and
      reads /api/* freely. The DISABLED facet covers the API surface.
    Under LOGIN_FORM: every authenticated caller is ADMIN. The LOGIN_FORM facet
      covers the API surface under one specific auth mode.
    Under AUTH-MODE-ORTHOGONAL: ANY caller able to reach the platform's HTTP
      port hits `/ingestion/**` endpoints (entities-stats / metrics /
      get-by-deg-oddrn / alertmanager) unauthenticated, regardless of which UI
      auth mode is configured AND regardless of whether
      auth.ingestion.filter.enabled is true. The shipped property name
      auth.ingestion.filter.enabled READS as 'lock down ingestion' but only
      protects ONE endpoint (POST /ingestion/entities); 4 sibling endpoints
      remain anonymously reachable.

    The DISABLED variant is the worst (anyone can read everything via /api/*);
    the LOGIN_FORM variant is second-worst (default-credential dependency);
    the AUTH-MODE-ORTHOGONAL variant is third — narrower in scope (4
    /ingestion/* endpoints rather than the entire /api/* surface) but
    UNFIXABLE BY OPERATOR CONFIGURATION (no toggle closes it). To restrict
    these endpoints, an operator must deploy network-level controls (firewall,
    reverse proxy auth) OR patch the codebase. The live docs (Security page,
    WebFetched 2026-05-20) EXPLICITLY surface this — quote: '/ingestion/entities/datasets/stats
    ... remain outside the ingestion filter's coverage' and 'Unauthenticated
    under auth.type = DISABLED, OAUTH2, or LDAP — even when the ingestion
    filter is enabled' — but at the SECURITY page, not at the DATA QUALITY page
    where an operator first encounters POST /ingestion/entities/datasets/stats.

  **THE 24-sidecar baseline (batches T + X)** — preserved from the prior entry:
    - DISABLED facet (19 sidecars): AppInfoController class + DirectoryController
      + ActivityController + DataQualityController + 14 prior SecurityConfiguration
      siblings + 4 UI-tier safety-asymmetry sidecars (CollectorsList / OwnersList
      / RolesList / PolicyList).
    - LOGIN_FORM facet (+5 sidecars): LoginFormSecurityConfiguration config-class
      + @L31 config-key-consumer + getResourcePermissions + login-form-admin
      invariant + auth-mode-quartet meta-invariant.

  **WHY THIS REACHES 27 SIDECARS MATTERS**: REFACTOR-185 is now the platform's
  most thoroughly-enumerated security pattern. Three structurally-distinct
  facets, each with its own mechanism: DISABLED (permitAll), LOGIN_FORM
  (ADMIN-for-all), AUTH-MODE-ORTHOGONAL (whitelist exempts /ingestion/**).
  The 27-sidecar pattern documents three different code-side paths to the
  same effective end-state (authorization is absent for the affected
  endpoint set), each requiring a distinct remediation: DISABLED → docs +
  UI banner + operator-discipline; LOGIN_FORM → wire AuthorizationCustomizer
  + replace hard-coded true at line 81; AUTH-MODE-ORTHOGONAL → either add
  filters for the 4 sibling endpoints OR remove `/ingestion/**` from
  WHITELIST_PATHS and wire UI auth through the /ingestion/* surface.

  Severity: HIGH (the 27-sidecar enumeration is the platform's most
  thoroughly-catalogued security failure mode; the AUTH-MODE-ORTHOGONAL facet
  is qualitatively different from the prior two — operator-discipline is NOT
  a viable mitigation because no toggle exposes the gap; network-layer
  controls or codebase patches are the only paths).
