proposed_action: |-
  Test using a custom `ObjectMapper` bean wrapped to count deserialise invocations of `DataEntityList`. (a) Boot with `auth.ingestion.filter.enabled=true` and the wrapper. (b) POST `/ingestion/entities` with a single valid payload. (c) Assert deserialise counter incremented TWICE (once in filter, once in controller). (d) Pin the duplicate-parse contract; future JsonPath-style early extraction or shared parsed-payload reactor Context flips the assertion to expect ONE parse.
