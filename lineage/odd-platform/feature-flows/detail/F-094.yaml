feature_id: F-094
feature_name: |-
  Ingestion API Authentication Coverage Matrix — `auth.ingestion.filter.enabled`
  covers 1 of 5 ingestion endpoints, but its name suggests the whole namespace
pillar_id: P-10
pillar_anchored_id: P-10:F-002
pillar_anchored_feature_name: |-
  Ingestion authentication-coverage matrix (5 endpoints × 4 UI auth modes ×
  2 filter toggle × 2 S2S toggle = 80-cell operator-visible deployment matrix
  with property-name misdirection at the core)
seeded_from: SHB-123
seeded_at: 2026-05-26
batch_origin: 'batch-shoebox-graduation 2026-05-26 — slice G'

discovered_from_entry_point: |-
  property:auth.ingestion.filter.enabled (consumed at IngestionDataEntitiesFilter
  bean construction); compounded across 5 endpoints in IngestionController +
  4 auth-mode bean variants (DisabledAuthSecurityConfiguration / LoginFormSecurityConfiguration
  / AuthorizationCustomizer × OAUTH2 / AuthorizationCustomizer × LDAP) +
  S2SAuthFilter conditional.

