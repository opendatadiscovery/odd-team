- id: H-002
  hypothesis: |-
    When an operator raises a single failing test from Major to Critical, the dataset's SLA
    colour at /api/datasets/{id}/sla changes accordingly (e.g. YELLOW → RED) even though no
    test pass/fail status changed.
  derivation: 'endpoint-shape + the feature mission "severity drives SLA colour"; SLACalculator buckets by severity.'
  seed_source: pillar + cross-pillar
  validation:
    verdict: confirmed
    actual_behavior: |-
      getSLA reads the dataset's tests (status + severity) and calls SLACalculator.calculateSLA,
      which buckets each SUCCESS/FAILED test by severity into minors/majors/criticals and applies
      threshold rules: anyCriticalFailed (criticalCount != criticalSuccess) → RED
      (SLACalculator.java:84-85,102-104). Moving one failing test from the majors bucket to the
      criticals bucket means criticalSuccess < criticalCount, so the colour becomes RED. With the
      test still only in the majors bucket and not all majors failing, the colour would be YELLOW
      (93-95). So the severity write alone flips YELLOW → RED. The doc states this verbatim.
    evidence:
      - sidecar: '(absent — source read for validation)'
        section: sla-calc
        cite: 'SLACalculator.java:72-104'
        note: 'calculateSLA buckets by severity; anyCriticalFailed => RED; hasFailedMajors => YELLOW'
        source_read_for_validation: true
      - sidecar: '(absent — source read for validation)'
        section: service
        cite: 'DataQualityServiceImpl.java:84-87,95-101'
        note: 'getSLA -> getDatasetSLA -> calculateSLA; severity read from the same severity row written by setDataQualityTestSeverity'
        source_read_for_validation: true
      - sidecar: '(doc cross-ref)'
        section: docs
        cite: 'WebFetch sla-statuses 2026-06-03'
        note: '"changing a single test severity from Major to Critical can flip the dataset from Yellow to Red"'
    severity: null
