      user on the LATEST revision regardless of which revision they had been viewing before they
      opened compare. So "Close" is operationally a "go to latest structure", not a "go back". The
      compare query-state is dropped; the browser back button may bring them BACK to the compare
      URL and re-fetch. TRUE that it returns to the structure tab; FALSE that context is preserved.
