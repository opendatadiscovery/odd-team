test_files_proposed:
  path: "odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/housekeeping/HousekeepingJobInjectionOrderTest.java"
  name: "fiveJobsInjected_orderIsSpringDiscoveryDependent_noExplicitContract"
evidence:
  - |-
    HousekeepingJobManager.md says: 'No @Order annotations, no @DependsOn, no explicit list ordering in the manager. Today's five jobs operate on disjoint table sets so order is irrelevant, but the contract is fragile to extension.'
  - "HousekeepingJobManager.java:23 (private final List<HousekeepingJob> housekeepingJobs;)"
  - "Grep `@Order|@Priority|@DependsOn` against housekeeping/job/ returns 0 matches"
cross_references:
  - "TEST-GAP-463 (parallel pattern: NotificationSender injection order also undefined)"
proposed_action: |-
  Spring context-load test in a slice configuration with all five HousekeepingJobs registered. Inject List<HousekeepingJob>. Assert size == 5. Probe via getClass().getSimpleName() and DOCUMENT the observed order. The test FAILS if order changes — surfacing the implicit contract. Fix is to add explicit @Order to each HousekeepingJob class.
