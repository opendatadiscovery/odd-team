name: |-
  ToolbarTabs ignores fetchActiveFeatures — feature-flag fetch dispatched at boot but result unused by tab list
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW MEDIUM-severity INVARIANT, batch ZJ (2026-05-26) — App.tsx
  dispatches `fetchActiveFeatures()` at line 49 on app mount. The
  result is stored in the redux `profile` slice and exposed via
  `getActiveFeatures` selector. The selector is consumed by
  destination-page components (e.g. `Message.tsx:59`,
  `MainThreadMessage.tsx:36`, `DataEntityDetailsHeader.tsx:132`)
  which wrap children in `<WithFeature featureName={
  Feature.DATA_COLLABORATION}>` — but the TAB ENTRYPOINT in
  `ToolbarTabs.tsx:34-82` does NOT consume the selector at all.

  **The 9-tab list is hardcoded regardless of which features the
  operator enabled**. Grep against `<WithFeature` in the
  AppToolbar subtree returns NO matches. Grep against
  `getActiveFeatures|useActiveFeatures` in
  ToolbarTabs.tsx returns NO matches.

  **The operator-visible consequence**: a deployment with
  `datacollaboration.enabled=false` (the default per
  application.yml) STILL shows the Data Modelling tab to every
  user, the Master Data tab to every user, etc. Clicking Data
  Modelling navigates to `/data-modelling/query-examples`
  where Query Examples lives — the destination page IS
  wrapped in `<WithFeature>` and renders an empty / non-
  functional surface; the user sees the tab work as labelled
  but the page work nothing.

  **The pattern applies to ANY tab whose destination is feature-
  gated downstream**:

    - Data Modelling (Query Examples uses Feature.DATA_COLLABORATION)
    - Alerts (Feature.ALERT_NOTIFICATIONS for outbound notifications;
      list itself is not gated)
    - Master Data (Lookup Tables today; future Master Data sub-
      features may be feature-gated)

  Today only Data Modelling/Query Examples is observably gated
  downstream of an unfeature-gated tab. But the architectural
  invariant — 'tab visibility is decoupled from feature-flag
  state' — is the load-bearing claim.

  **The fix is small**: extend each tab entry in the `tabs`
  useMemo at ToolbarTabs.tsx:34-82 with an optional `featureName`
  field. Then wrap each tab entry in `<WithFeature
  featureName={tab.featureName}>` when defined. Approximate
  cost: 15 lines, no new imports beyond `WithFeature` (already
  used elsewhere).

  **Cross-batch coherence (LSN-018)**: this invariant is the
  feature-flag-side counterpart of the
  `management-tab-visible-to-all-authenticated-users-
  unpermissioned-tab-visibility` invariant. The latter says
  'tabs are not permission-gated'; this invariant says 'tabs are
  also not feature-gated'. Both invariants share the same root
  cause: ToolbarTabs is a hardcoded literal-array enumerator
  with no consumption of redux state beyond the i18next `t`
  function and the `activityQueryString`.

  **The fetchActiveFeatures dispatch IS still load-bearing** —
  it populates the selector used by destination-page WithFeature
  wrappers. The invariant is NOT 'don't fetch' but 'fetch and
  also consume at the toolbar layer'.
