notes: "Promoted to a NEW cross-cutting invariant in batch 2026-05-12D.\nThe pattern\
  \ is structurally similar to the \"Dead code in load-bearing\npositions\" invariant\
  \ — both expose maintainers to \"I thought this was\nthe source of truth\" failure\
  \ modes. Recommended cleanup:\n  - DataCollaborationProperties: add `Boolean enabled`,\
  \ `String slackOauthToken`,\n    `int messagePartitionPeriod` fields; replace 4\
  \ @Value reads with\n    DataCollaborationProperties getters. (NB: enabled field\
  \ requires\n    coordination with FeatureResolverImpl's SpEL-based conditional\n\
  \    evaluation.)\n  - EmailSenderProperties: add `String recipients` (CSV) or\n\
  \    `List<String> recipients` field bound to `notification.emails`;\n    replace\
  \ the @Value read in NotificationConfiguration.java:104.\n"
