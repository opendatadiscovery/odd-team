expected_outcome: |
  Stress question (Category F — UI surface of LSN-020): the Activity page's
  "User" filter (Filters.tsx:93-98 — `filterName='userIds'`, label
  `t('User')`) is rendered by `MultipleFilter` which dispatches
  `fetchOwnersList` (MultipleFilter.tsx:32-34) for any filterName that is
  not `tagIds`. MultipleFilterAutocomplete (lines 44-47) also routes the
  search query to `fetchOwnersList`. The dropdown therefore lists OWNERS
  (not users). Selecting an OWNER from the "User" dropdown stores that
  owner's ID in `queryParams.userIds`. The thunk sends
  `userIds=[<ownerId>]` to `GET /api/activity`. ActivityController.getActivity
  passes through to `getCommonConditions`
  (ReactiveActivityRepositoryImpl.java:272-273) which binds
  `USER_OWNER_MAPPING.OWNER_ID.in(userIds)`. End-to-end, the round-trip is
  internally consistent on the OWNER axis: pick an owner, get rows where
  the actor's user-owner mapping points to that owner.

  But the operator's mental model — driven by the label `User`, the live
  doc excerpt "show events **performed by** one or more selected users",
  and the standalone parameter name `userIds` — is that they are filtering
  by the user who PERFORMED the action. Three concrete operator-observable
  failure modes follow:

    (a) Users without an owner mapping cannot be filtered at all — the
        autocomplete only surfaces owners, so user-without-owner is
        silently absent from the dropdown rather than returning empty.
    (b) Reassigning the user-owner association RETROACTIVELY rewrites
        which historical activity rows match the filter. A user who was
        owner A on 2025-01 and owner B on 2025-06 has all 2025-01
        activity look like it was performed by owner B once the mapping
        flips. The audit trail's "who did this" answer changes silently.
    (c) Multiple users mapped to the same owner all collapse into the
        same filter result — picking "User: Alice" actually returns rows
        for every user mapped to the same owner as Alice.

  Available-but-unused column: `activity.created_by` is the actual actor
  username (read in the LEFT JOIN at line 221, SELECTED in
  `buildBaseQuery` line 212, never used in WHERE).
