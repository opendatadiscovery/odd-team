name: LOGIN_FORM hard-codes ADMIN for every user — RBAC framework INERT
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20X — surfaces the LOGIN_FORM-mode
  authorization-framework absence at the CONFIG-CLASS layer (the bean-factory side,
  not just the config-key-consumer side). LoginFormSecurityConfiguration is the entire
  LOGIN_FORM-mode authentication wiring (104 lines) and TWO load-bearing decisions
  encoded in it make the Policies/Permissions/Roles/Owners framework INERT for every
  form-authenticated user.

  **DECISION 1 — ADMIN hard-coded for every user**:
    Line 81 invokes `.authorities(grantedAuthorityExtractor.getAuthorities(true))`.
    The literal `true` is the `isAdmin` flag; `GrantedAuthorityExtractor.java:12-17`
    interprets it as `UserProviderRole.ADMIN`. EVERY form-authenticated user — every
    entry in the shipped default `admin:admin,root:root` (application.yml:37) plus
    every operator-defined entry — receives ADMIN authority. There is NO per-user
    role distinction in this mode.

  **DECISION 2 — AuthorizationCustomizer is NOT wired**:
    Lines 55-57 configure the chain as:
      `.authorizeExchange(spec -> spec.pathMatchers(permittedPaths).permitAll()
       .pathMatchers("/**").authenticated())`
    There is NO `.authorizeExchange(new AuthorizationCustomizer(permissionService,
    extractors))` call — contrast with `OAuthSecurityConfiguration.java:98` AND
    `LDAPSecurityConfiguration.java:145` where the AuthorizationCustomizer is
    explicitly wired. The Customizer is the class that walks
    `SecurityConstants.SECURITY_RULES:98-355` and applies per-Policy/Permission/Role/
    Owner access managers via `ReactiveAuthorizationManagerFactory.manager(...)`. By
    skipping it in LOGIN_FORM mode, SECURITY_RULES is INERT — every authenticated
    request bypasses every per-feature permission gate.

  **COMPOUND EFFECT**: every LOGIN_FORM-authenticated user is (a) ADMIN AND (b)
  bypasses the RBAC table. Operators who author Policies + Roles + Owners via the
  platform UI under LOGIN_FORM mode get a fully-built RBAC configuration that the
  live auth chain SILENTLY IGNORES. Combined with the shipped credentials
  `admin:admin,root:root` (application.yml:37) and the doc warning "Change these
  defaults before any non-local deployment" being warning-only with no programmatic
  guardrail, the platform's LOGIN_FORM posture is "every form-authenticated user
  can call every endpoint, with shipped credentials that ship known to the world."

  **DOC DRIFT**: the live `/configuration-and-deployment/enable-security/authorization`
  page (WebFetched 2026-05-20 status 200) names "fine-grained access control" and
  enumerates Policies/Permissions/Roles/Owners but is SILENT on which `auth.type`
  modes actually wire the framework. An operator following the docs to author a
  least-privilege RBAC configuration under LOGIN_FORM gets the ADMIN-for-all silent
  bypass with no warning.

  **STRENGTHENS REFACTOR-185** to a 24-sidecar pattern (was 23 — DISABLED-mode
  bypass). The LOGIN_FORM facet has its own shape — under DISABLED the SECURITY_RULES
  bypass is via `.anyExchange().permitAll()`; under LOGIN_FORM the bypass is via
  hard-coded ADMIN + absent AuthorizationCustomizer. Same effective end-state:
  every endpoint reachable by every authenticated caller regardless of any
  operator-authored RBAC configuration.

  **STRENGTHENS REFACTOR-073** (login-form-without-authorizationcustomizer
  validated) — promotes the existing canonicalisation_candidate single-sidecar
  evidence to a full invariant with the CONFIG-CLASS layer primary source
  (LoginFormSecurityConfiguration.java config-class sidecar in addition to the
  pre-existing config-key-consumer @L31 sidecar).
