notes: |-
  Cross-batch architectural-hygiene invariant surfaced ONLY by triangulating
  the 4 batch-H repository sidecars together. None of the individual sidecars
  name the platform-wide inconsistency — each sidecar describes its own mechanism
  as a deliberate ADR, but the catalog reveals the platform ships 3 DIFFERENT
  soft-delete mechanisms + 1 hard-delete pattern across what reads as a uniform
  Reactive*Repository naming convention.

  **STRENGTHENED batch 2026-05-19L** — the HARD-DELETE relationship-edge
  cluster is now multi-site primary-source confirmed across 3 tables
  (data_entity_to_term + group_entity_relations + ownership; plus the
  term_ownership migration). The dedicated
  hard-delete-on-relationship-edges-confirmed-cross-batch invariant
  captures the relationship-edge cluster pattern; this invariant
  remains the platform-wide-mechanism map.

  Recommended cleanup paths (in increasing scope):

    - Document the asymmetry on a single page (e.g. an `adrs/`-style file in
      the documentation repo or a new `internal/persistence-conventions.md` page)
      naming all 4 mechanisms + the rationale for each. Cheap; preserves the
      existing semantics; arms maintainers.

    - Standardise on ONE mechanism (preferably `deleted_at` timestamp — the most
      widely used) and migrate the DataEntity STATUS-state-machine + lineage is_deleted
      + ownership hard-delete to share the same shape. High scope (DataEntity STATUS
      state-machine carries lifecycle semantics that deleted_at does not, so the
      migration would either lose information or require dual-write). Likely infeasible.

    - Document each subclass-override (DataEntity's STATUS override is the most
      surprising) in the ParentClass's Javadoc so a maintainer reading the parent
      sees the override contract before refactoring.

  Five DOC-NNN candidates flow from this invariant:
    (a) Add a 'Persistence layer conventions' note to the internal Architecture docs
        naming the 4 mechanisms.
    (b) Document the soft-delete-aware-recreation invariant on the Policies + Roles
        live pages (operators can recreate a policy with a previously-used name).
    (c) Document the hard-delete semantics on the Owners + Term-relations live pages
        (operators cannot undelete an ownership row — recovery via activity feed only).
    (d) Document the STATUS-state-machine semantics on the DataEntity Status / Lifecycle
        live page (operators can soft-delete + restore an entity; the entity is recoverable
        via status change, not via a separate undelete endpoint).
    (e) **NEW from batch L** — Document the user-DELETE-is-HARD-DELETE
        vs cascade-is-SOFT-DELETE asymmetry on the
        groups-domains + business-glossary feature pages (operators
        reasoning "will my memberships come back after entity
        restore?" need this knowledge).
