  - "RoleServiceImpl.md says (tests_coverage_semantic.uncovered_behaviours.[2]): 'create() with name=''administrator'' (lowercase) SUCCEEDS — the unique index is byte-for-byte case-sensitive in Postgres; the new row co-exists with the seeded ''Administrator''. Pin the case-sensitivity exploitation vector.'"
  - "RoleServiceImpl.md says (bugs_limitations_corner_cases.[0]): 'DRIFT-FACET-A (P-09:F-001 RBAC — role-create predefined-name asymmetry, PRIMARY-SOURCE at service tier). RoleServiceImpl.create (lines 49-61) has NO check against formData.getName().equals(UserProviderRole.ADMIN.getValue()) or .USER.getValue(). The constants are consulted at line 43 (list admin-detection), 68 (update Administrator block), 81-82 (delete predefined-name block), 104 (update User-rename block) — FOUR distinct sites — but NOT on the create path. The only protection against a duplicate Administrator or User role is the DB partial UNIQUE INDEX, which: (a) protects WHILE the seeded rows are live; (b) DOES NOT protect if the seeded row is ever soft-deleted out-of-band.' severity: HIGH"
  - "Source: RoleServiceImpl.java:49-61 (no name check) + 68 (update Administrator block) + 81-82 (delete predefined block) + 104 (update User-rename block) + V0_0_55__add_policies_and_roles.sql:42 + V0_0_56__add_predefined_roles_and_policies.sql:33-36"
