proposed_action: |-
  Add to `AppToolbar.test.tsx`: (a) `renders_under_disabled_mode_with_synthetic_identity` — provide a redux store with the DISABLED-mode synthetic identity (typical shape: `{username: 'anonymous', permissions: []}`); mount AppToolbar; assert toolbar renders, the username label shows `anonymous` (or whatever the synthetic provider yields); assert popup-menu opens; assert Logout item is present. (b) `scroll_threshold_10px_toggles_elevation_state` — mount AppToolbar inside a tall container; programmatically scroll to 5px → elevation 0; scroll to 15px → elevation flipped (the threshold-10 pin); scroll back to 5px → elevation 0. Pair with `.todo` test for the eventual fix to add a DISABLED-mode logout handler (or operator-facing banner explaining the no-op).
