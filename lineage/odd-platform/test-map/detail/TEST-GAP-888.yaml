behaviour: |-
  **HIGH — `PUT /api/datasetfields/{dataset_field_id}/tags` (updateDatasetFieldTags) carries two non-trivial, zero-coverage contracts: (1) PARENT-SCOPED authorization — the `DATASET_FIELD_TAGS_UPDATE` permission (a `DATA_ENTITY`-typed enum member) is evaluated against the dataset field's OWNING data entity, NOT the field itself, after a 4-table join resolves `dataset_field -> dataset_structure -> dataset_version -> data_entity`; (2) the delete-then-recreate replace-all is scoped to `origin = 'INTERNAL'` ONLY — EXTERNAL and EXTERNAL_STATISTICS (ingestion-sourced, dataset-statistics-derived) relations MUST survive a UI/API call. Neither contract is asserted anywhere.** Method-level primary source from the batch-X-TAGGING `updateDatasetFieldTags` controller-method sidecar:

  - **Parent-scoped auth resolution**: `SecurityConstants.java:288-290` registers `new SecurityRule(DATASET_FIELD, PathPatternParserServerWebExchangeMatcher("/api/datasetfields/{dataset_field_id}/tags", PUT), DATASET_FIELD_TAGS_UPDATE)`. `DatasetFieldResourceExtractor.extractResourceId` (`:20-27`) chains `.flatMap(datasetFieldRepository::getDataEntityIdByDatasetFieldId)` — the SQL joins `dataset_field -> dataset_structure -> dataset_version -> data_entity` (`ReactiveDatasetFieldRepositoryImpl.java:116-125`). `DATASET_FIELD_TAGS_UPDATE` is `DATA_ENTITY`-typed (`PolicyPermissionDto.java:32`). The caller's Policies are evaluated against the PARENT data entity.
  - **The INTERNAL-only replace-all**: `DatasetFieldServiceImpl.updateDatasetFieldTags` calls `deleteDatasetFieldInternalRelations(datasetFieldId)` first (`:124`) — an unconditional `DELETE FROM tag_to_dataset_field WHERE dataset_field_id = ? AND origin = 'INTERNAL'` (`ReactiveTagRepositoryImpl.java:289-295`). The `TagOrigin` enum has three members — `INTERNAL`, `EXTERNAL`, `EXTERNAL_STATISTICS` (`TagOrigin.java:3-7`). EXTERNAL_STATISTICS relations are written by the ingestion path `DatasetFieldServiceImpl.updateFieldsTags` from `DataSetFieldStat.getTags()` (`:191-231`) and MUST survive this UI call.

  **Two distinct sub-behaviours, both unpinned:**
  - **Parent-scoped 403** — a caller WITHOUT `DATASET_FIELD_TAGS_UPDATE` on the dataset field's PARENT data entity must get 403; a caller WITH it (admin or `dataEntity:owner`-conditional grant scoped to the parent) gets 200. The `getDataEntityIdByDatasetFieldId` resolution returning the WRONG parent would be an authorization bypass — and nothing asserts the resolution returns the right parent. This is a non-trivial multi-join resolution path with zero coverage.
  - **EXTERNAL_STATISTICS preservation** — `PUT` with `tags: ['ui-tag']` on a field that ALSO has an ingested EXTERNAL_STATISTICS tag relation must end with `{ui-tag (INTERNAL), <ingested> (EXTERNAL_STATISTICS)}`. A regression broadening the `deleteDatasetFieldInternalRelations` filter (dropping the `origin = 'INTERNAL'` predicate) would silently destroy ingested-statistics tag relations on every UI save — a cross-pillar (ingestion vs UI) ownership-contract break.

  **Why HIGH**: parent-scoped authorization is a non-trivial resolution path — an operator authoring a `dataEntity:owner` Policy cannot tell from the docs that granting it for a data entity also grants tag-edit on all of that entity's dataset fields; a resolution bug is an authorization bypass. The EXTERNAL_STATISTICS carve-out is the line that defines what 'replace-all' means here; without a test, a filter-broadening regression destroys ingested data silently.

  **Test gap shape**: a `WebTestClient` security + integration test asserting (a) a caller WITHOUT `DATASET_FIELD_TAGS_UPDATE` on the parent data entity gets 403; (b) a caller WITH a `dataEntity:owner` grant on the parent gets 200; (c) `PUT` `tags: []` removes all INTERNAL relations but EXTERNAL_STATISTICS relations survive; (d) the `getDataEntityIdByDatasetFieldId` join resolves to the correct parent (a field of data entity A is NOT editable by a caller scoped only to data entity B). The current state is PINNED — a filter-broadening or resolution regression fails the test.
