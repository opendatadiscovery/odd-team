  Add `delete_refetch_search_clear_rewinds_pagination_debounce_enter_bypass` to CollectorsList.test.tsx. Methods: (a) `delete_refetch_under_no_query` — render; flip `isCollectorDeleting: true → false`; assert one `fetchCollectorsList({page: 1, size: 30})` dispatched; (b) `delete_refetch_skipped_under_active_query` — set `query: 'foo'`; flip `isCollectorDeleting`; assert NO refetch; (c) `search_clear_rewinds_pagination` — set `query: 'bar'`, simulate paginated state (page 5); clear query (`setQuery('')`); assert `fetchCollectorsList({page: 1, size: 30, query: ''})` dispatches (page 1, no scroll preservation); (d) `enter_key_fires_search_immediately` — type 3 chars in search input, press Enter before 500ms; assert one dispatch fires immediately (NOT debounced). Pair with `.todo` for the eventual scroll-preservation UX fix.
