        section: security.auth_mode_relevance
        cite: "AuthIdentityProviderImpl.java:24-35 + DisabledAuthSecurityConfiguration.java:11-19"
        note: "empty SecurityContext -> empty anchor -> empty (not leak) under DISABLED"
    operator_visible_failure: |
