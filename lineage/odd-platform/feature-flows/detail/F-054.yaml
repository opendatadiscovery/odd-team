terminal_side_effect:
  side_effect_class: page-render
  description: |-
    page-render — hierarchy canvas indistinguishable from dataset / transformer
    lineage. Any microservice-specific payload fields (operation_name, span_kind,
    error_rate, p95_latency) silently dropped at the response DTO mapper.
  evidence: 'LineageGraph.md:182 bugs[7]'
observed_vs_expected:
  facets:
    - facet_id: microservices_lineage_indistinguishable_from_data_object_lineage_no_class_aware_ui
      drift_class: doc_promises_distinct_surface_code_treats_as_data_class_no_ui_anchor
      severity: MEDIUM
      observed: |-
        Live doc fetch 2026-05-20 (per Lineage.tsx sidecar docs_link_semantic)
        names microservices lineage as a distinct surface. Code treats it as a
        class of data entity reachable through the same endpoints. Operators
        opening the Lineage tab on a microservice see the SAME canvas (boxes
        with names + edges) as a dataset.
      expected: |-
        Either (a) the doc page narrows the framing to "microservices are data
        entities with lineage rendered uniformly" (matches code), OR (b) the UI
        adds a class-aware branch with operation-name / trace-timing /
        service-call-cardinality affordances (matches doc-promised distinct
        surface).
      evidence:
        - 'Lineage.tsx:14,19-25 (only isDEG branch)'
        - 'HierarchyLineage.tsx:1-138 (single non-DEG renderer; no class branches)'
        - 'LineageServiceImpl.getLineage:39 (no EntityClass parameter)'
        - 'Lineage.md:139 bugs[2] (verbatim: "No microservices-specific branch")'
        - 'LineageGraph.md:182 bugs[7]'
      ui_unverified: false
    - facet_id: microservice_specific_payload_fields_silently_dropped_at_response_dto_mapper
      drift_class: payload_silently_dropped_no_class_aware_mapper
      severity: MEDIUM
      observed: |-
        DataEntityLineageNode response DTO is class-agnostic. A third-party
        odd-tracing-gateway collector emitting microservice-specific metadata
        (operation_name, span_kind, error_rate, p95_latency, callsPerMinute)
        would have those fields silently dropped at the response-DTO mapper
        (LineageMapper.mapLineageDto), invisible at both UI and API layers.
      expected: |-
        Either (a) the response DTO carries a class-discriminated payload union
        (DataEntityLineageNode + MicroserviceLineageNode variants), OR (b) the
        microservice-specific fields are explicit in the spec with documented
        UI rendering paths.
      evidence:
        - 'SHB-023 evidence — verbatim sidecar quotes from LineageGraph.md:182 + Lineage.md:139'
        - 'LineageMapper.mapLineageDto referenced from sidecar coherence_check (file:line not yet enriched)'
      ui_unverified: false
    - facet_id: cross_owner_enumeration_amplified_on_microservices_class
      drift_class: read_collaborative_posture_amplified_by_sensitive_class
      severity: HIGH
      observed: |-
        LineageServiceImpl.getLineage applies NO owner-scoping (REFACTOR-203).
        A user can click into ANY microservice and see the full cross-service
        call graph — including services owned by other teams. The same
        cross-owner-enumeration gap as F-005 / F-014 / F-037, but on a class
        of entities whose operational data (latency, error rate, call rate) is
        often more sensitive than table schemas.
      expected: |-
        Owner-scoped read (matching the per-tenant / per-namespace expectation
        the operator's RBAC mental model carries) OR explicit doc-side framing
        that microservices-lineage reads are catalog-public-by-design.
      evidence:
        - 'LineageServiceImpl.md security.known_security_gaps (REFACTOR-203 cross-owner enumeration)'
        - 'SHB-023 Notes (cross-owner amplification observation)'
      ui_unverified: false
