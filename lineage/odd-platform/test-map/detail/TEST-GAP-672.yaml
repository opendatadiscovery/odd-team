proposed_action: |-
  Testcontainers integration test. (a) Create an INTERNAL metadata field `foo:STRING`. (b) Attach a value for `foo` to data_entity #42. (c) Soft-delete the metadata field via `metadataFieldRepository.delete(id)`. (d) Verify `listInternalMetadata("foo")` returns EMPTY (field hidden from dropdown). (e) Call `getDtosByDataEntityId(42)`. (f) Assert the result list INCLUDES the soft-deleted field — pin the CURRENT BUGGY behaviour. (g) Add a `// REGRESSION-PIN — A soft-deleted metadata field with surviving values still appears on the per-entity Metadata panel. REFACTOR-NNN will add the soft-delete filter; this test flips to assert the field is EXCLUDED.` comment block. (h) Pair with the FTS-side regression: assert that after soft-deletion, the FTS vector for entity 42 still contains the field name (re-indexed via updateMetadataVectors).
