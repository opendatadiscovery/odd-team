discovered_from_entry_point: |-
  ui_shell:AppToolbar (the SPA's persistent top-of-viewport fixed-position bar
  mounted unconditionally at App.tsx:56 above the <Routes> block). Three child
  widgets compose the chrome: ToolbarTabs (the 9-tab strip), AppInfoMenu (the
  information-icon popup), and AppMenu containing SelectLanguage + Logout.
description: |-
  The Application Toolbar is the single global navigation chrome of the ODD
  Platform SPA — a 123-line stateless React component mounted EXACTLY ONCE in
  App.tsx:56, above the <Routes> block, on every authenticated route
  (including anonymous DISABLED-mode traffic). It composes four sub-surfaces:

  (a) BRAND BLOCK — the logo + "Platform" h4, linked to `/` (AppToolbar.tsx:54-61).

  (b) PRIMARY TAB NAVIGATION — the 9-tab strip rendered by ToolbarTabs
  (AppToolbar.tsx:64 + ToolbarTabs.tsx:34-82). The tabs are HARDCODED in
  source: Catalog / Directory / Data Quality / Data Modelling / Master Data /
  Management / Dictionary / Alerts / Activity. NO permission / feature-flag /
  role gating at the entry-point layer. Every authenticated user sees every
  tab; every anonymous user under DISABLED sees every tab.

  (c) APP INFO MENU — the information-icon popup composed by AppInfoMenu
  (AppToolbar.tsx:67 + AppInfoMenu.tsx:71-122). Composes FIVE surfaces in one
  MUI popover: Documentation link, Slack link, project version (from GET
  /api/appInfo via useAppInfo), Leave-feedback link, operator-configured
  additional links (from GET /api/links via useAppLinks — the F-035 surface).

  (d) USER CLUSTER — clickable owner.name ?? identity.username text (line 74)
  + dropdown chevron, opens an AppMenu (keepMounted MUI Menu) containing the
  language switcher (SelectLanguage — 6 locales en/es/ch/fr/ua/hy) + Logout
  (window.location.href = '/logout', AppToolbar.tsx:35-37).

  The toolbar is the OPERATOR-VISIBLE SHELL of every other pillar — its tabs
  are the entry points into Discovery / Lineage / Glossary / Quality / Modelling
  / Master Data / Active Platform Features / Management. The feature is named
  by what the user SEES (a unified navigation bar), not by what the code
  enumerates (three React components stitched together).

  The drift surface is rich: tab visibility is structurally unconditional (no
  permission read, no feature-flag consumption — App.tsx:49 fetches feature
  flags into Redux but ToolbarTabs does not consume them); the Logout link
  404s under DISABLED (no /logout handler registered without a Spring-Security
  formLogin chain); the userName renders the literal "admin" under DISABLED
  (IdentityController.dummyOwner); the AppInfoMenu opens on hover only (WCAG
  2.1 SC 2.1.1 keyboard-accessibility violation); all five external links use
  target='_blank' without rel='noopener noreferrer'; three of the nine tab
  labels (Data Quality / Data Modelling / Master Data) are missing from EVERY
  locale's translation bundle (the natural-keys fallback renders the English
  key literal regardless of selected language); the Catalog tab label
  navigates to /search not /catalog (the docs reinforce the LABEL but the URL
  contradicts); the Dictionary tab navigates to /termsearch (URL vocabulary
  disagrees with the label across all 6 locales).

  Under "what the user observes" the feature is the entire chrome, not the
  per-axis machinery. The cross-pillar coupling is large — every other pillar
  is reached through this surface — but the chrome is owned here.
