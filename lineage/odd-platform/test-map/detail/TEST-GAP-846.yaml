proposed_action: |-
  **Vitest error-path tests** (3 tests with mocked rejected promises):

  1. `createSearch_rejects500_uiDoesNotSurfaceError_pinsSilentFailureMode` — mock `createDataEntitiesSearch` to reject with 500, render Search, assert NO error toast/notification appears. PINS the current silent-failure.

  2. `getSearch_rejects401_uiDoesNotSurfaceError_pinsAuthExpiryFrozenPage` — mock `getDataEntitiesSearch` to reject with 401, render Search with URL UUID, assert UI stays frozen with no error. PINS the auth-expiry case.

  3. `getSearch_rejects404OnStaleUUID_uiDoesNotFallbackToCreateFreshSession_pinsBookmarkRotFailure` — mock the GET to return 404, render Search with URL UUID, assert NO automatic fallback to `createDataEntitiesSearch` happens. PINS the stale-bookmark case.

  **Architectural fix**:
  - Add `.catch(error => slice.dispatch(setSessionError(error)))` to useCreateSearch.ts:14-19
  - Add `.rejected` reducer cases to slice.ts:214-260 that set `error` field with diagnostic text
  - Add `<ErrorBoundary fallback={<SessionRecoveryPlaceholder />}>` around the Route element at App.tsx:60-65 OR add a per-Search local boundary
  - Add fallback logic: on 404 from GET, automatically dispatch `createDataEntitiesSearch` to recover
  - The tests then flip assertion direction: assert the error message IS surfaced

  Coherence note (LSN-018 Rule 6): STRENGTHENS TermSearch batch-U bugs[3] by establishing the clone-propagation explicitly. NO contradiction with existing artefacts.
