- id: H-010
  hypothesis: "When a dataset field is linked to the term ONLY via a `[[ns:term]]` description mention (the auto-link side-channel), it appears in the Linked Columns tab exactly like a manually-linked field."
  derivation: "Response shape / cross-pillar — `dataset_field_to_term` carries `is_description_link`; the TermServiceImpl sidecar documents that description mentions synthesise link rows. A steward auditing 'where is this term used' expects auto-linked columns to surface."
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |
      Auto-linked fields DO surface — the `listByTerm` query joins `dataset_field_to_term`
      with NO filter on `is_description_link` (ReactiveDatasetFieldRepositoryImpl.java:188-189),
      so rows created by description mentions (is_description_link=TRUE) and manual links
      (is_description_link=FALSE) both appear. GOOD for completeness. The PARTIAL: the
      tab does NOT project or render the `is_description_link` distinction at all — the
      five rendered columns are name/dataset/namespace/datasource/owner
      (DatasetFieldListMapperImpl.mapPojo:27-44), with no auto-link badge. So a steward
      cannot tell, from this tab, which columns were linked deliberately vs swept in by a
      description mention. (Note the sibling Linked Entities tab has the SAME omission per
      business-glossary.md:185.) AND: if both a manual and a description-link row exist for
      the same (field, term), the dataset-field read path does not run the
      `removeDuplicateNonDescriptionTerms` collapse that the Term-side read paths use
      (that collapse lives in TermServiceImpl.getDataEntityTerms/getDatasetFieldTerms, NOT
      in DatasetFieldService.listByTerm) — so a field with both link rows could appear
      TWICE in this list. Unverified-by-read whether the PK on
      (dataset_field_id, term_id, is_description_link) permits both rows here; routed to probe.
    evidence:
      - sidecar: "(source read)"
        section: listByTerm
        cite: "ReactiveDatasetFieldRepositoryImpl.java:188-189"
        note: "join on dataset_field_to_term with no is_description_link filter — both link kinds surface"
      - sidecar: odd-platform__java__service__service__TermServiceImpl.md
        section: invariants
        cite: "removeDuplicateNonDescriptionTerms (TermServiceImpl.java:444-448)"
        note: "the Term-side read collapses dup link rows; the DatasetFieldService path does NOT call it"
      - sidecar: "(doc clone)"
        section: "Visibility and cross-tab UX"
        cite: "documentation/docs/data-glossary/business-glossary.md:185"
        note: "sibling tab omits the auto-link visual distinction"
    operator_visible_failure: |
      (1) AUDIT AMBIGUITY — a steward cannot distinguish deliberate links from
      description-mention sweeps in this tab; "show me columns deliberately tagged PII"
      is not answerable from the UI. (2) POSSIBLE DOUBLE ROW — if a field carries both
      a manual and a description-mention link, it may render twice (unconfirmed; probe
      PENDING-F-153-2). If so, the count is inflated and the list looks buggy. Routed
      as caveat + probe; the duplicate-row question must be measured against a real DB.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: PENDING-F-153-2
    routes_to_finding: caveat-candidate
    source_read_for_validation: true
    use_case_kind: render
    coverage: unverified
    test_demand: "probe PENDING-F-153-2"

