- id: H-011
  hypothesis: "When a user navigates to a malformed term URL such as /terms/abc/overview, the page shows a clear not-found state rather than crashing or showing a blank screen."
  derivation: "Negative-space — useTermsRouteParams parses termId via parseInt(termId,10); a non-numeric segment yields NaN."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      parseInt('abc',10) → NaN (termsRoutes.ts:60). NaN flows into getTermDetails(NaN) (returns the empty
      fallback) and fetchTermDetails({termId: NaN}) hits GET /api/terms/NaN, which the backend answers 400
      (NumberFormatException on path-variable bind) or 404. isTermDetailsNotFetched becomes true →
      AppErrorPage renders (TermDetails.tsx:80-83). So the user does NOT see a crash or a blank screen —
      they see the error page. The gap is that the graceful outcome RELIES on the backend producing a 4xx;
      there is no client-side isNaN guard, so the error path is "unprincipled" (per TermDetails.md
      bugs_limitations_corner_cases — severity LOW). It works today; it is fragile to a backend change in
      path-variable handling.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__TermDetails.md
        section: bugs_limitations_corner_cases
        cite: "termsRoutes.ts:60 (parseInt → NaN) + TermDetails.tsx:25,32,34,38,80-83 (NaN → AppErrorPage)"
        note: "no client-side NaN guard; relies on backend 4xx to show the error page"
    operator_visible_failure: |
      A mistyped or stale term URL lands on the AppErrorPage (acceptable). The latent risk: if a future
      backend change made GET /api/terms/NaN return 200-with-empty or 500-without-the-not-fetched-flag, the
      page could show a blank shell or an unhandled error. Severity LOW — current behaviour is correct;
      the partial is the absence of a defensive client guard.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: empty/no-match
    coverage: unverified
    test_demand: functional

