- id: H-011
  hypothesis: |
    When an operator deletes a Policy and the platform blocks the delete because the
    policy is still bound to a role (the cascade-delete defence), no concurrent
    request can slip the policy into a soft-deleted-but-still-bound state.
  derivation: |
    Negative-space — the cascade-delete defence is the SOLE guard against the
    orphan-binding grant leak (H-002). A senior engineer asks whether the check and
    the delete are atomic; if they are two separate calls, a concurrent role-bind
    can race between them.
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |
      The cascade check (isPolicyAttachedToRole at PolicyServiceImpl.java:89) and the
      soft-delete (policyRepository.delete at line 93) are TWO separate R2DBC calls
      OUTSIDE any @ReactiveTransactional. Statically, the race window is real: client
      A reads isAttached=false (the policy is currently unbound), client B binds the
      policy to a role (inserts a role_to_policy row), client A continues and
      soft-deletes the now-bound policy — yielding the orphan-binding state the
      defence intended to block, which (via H-002's unfiltered JOIN) keeps granting.
      Whether the window is WIN-able under READ COMMITTED at realistic concurrency
      requires running the system — hence probe-needed (the same non-atomic shape is
      confirmed on the Owner-delete side, so a positive result generalises).
    evidence:
      - sidecar: odd-platform__java__service__service__PolicyServiceImpl.md
        section: bugs_limitations_corner_cases[5] (cascade-check non-atomic)
        cite: "PolicyServiceImpl.java:83-95 (check line 89, delete line 93, no transaction)"
        note: "Two separate R2DBC calls outside any transaction — race window present in code."
      - sidecar: '(F-006 feature-flow detail — shoebox-F notes finding (2))'
        section: three_concurrent_client_race_description
        cite: "PolicyServiceImpl.java:89 vs 93"
        note: "Concrete A/B/C interleaving makes the race reproducible — probe target."
    operator_visible_failure: |
      If the race is WIN-able: an operator's cascade-protected delete provides FALSE
      assurance — under concurrent role mutation the platform CAN reach the exact
      orphan-binding state the defence advertises it prevents, and the operator
      receives no signal (no error, no audit). The defence's value (the guard that
      makes "the UI delete path is safe" true) is undermined under concurrency.
    severity: MEDIUM
    confidence: MEDIUM
    probe_id: P-197
    routes_to_finding: bug-candidate
    use_case_kind: edit-reconcile  # concurrent cascade-check vs role-bind reconciliation
    coverage: unverified
    test_demand: probe             # the verdict requires running the system; test_demand = the emitted probe P-197
    local_execution_blocked: false

