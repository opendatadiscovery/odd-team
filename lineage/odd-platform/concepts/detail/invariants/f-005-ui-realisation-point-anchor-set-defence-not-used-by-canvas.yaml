notes: |-
  New invariant captured in batch 2026-05-19J. This is the UI-side cross-confirmation
  of REFACTOR-203 — the user-observable consequence is now triangulated at three
  layers: SQL (batch H — ReactiveLineageRepositoryImpl), service (batch I —
  LineageServiceImpl NEGATIVE-CASE SIBLING), UI (batch J — LineageGraph fetches
  via negative case). The catalog now has end-to-end uniform confirmation that
  the lineage canvas is the user-visible REALISATION POINT of REFACTOR-203.

  Cross-pillar implications:
    (a) P-05 Data Lineage — the canvas IS the operator-facing surface; operators
        in multi-tenant deployments need this documented
    (b) P-09 Security & Access Control — the read-collaborative posture is realised
        at the UI; the absence of compensating UI affordance is itself a finding
