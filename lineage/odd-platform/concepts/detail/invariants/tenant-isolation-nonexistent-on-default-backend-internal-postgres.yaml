mitigations_unimplemented:
- |-
  Code-side: add a `tenant_id` column to `metric_series` + `metric_point`
  tables; populate from `odd.tenant-id` at the InternalIngestionMetricsServiceImpl
  insert path; add a `tenant_id` predicate to InternalMetricReader queries.
  This is a schema migration + 2-3 file change.
- |-
  Code-side (alternative): fail-fast at boot if `odd.tenant-id` is set
  AND `metrics.storage=INTERNAL_POSTGRES` (the property has no effect under
  this combination — surfacing it as a misconfiguration would prevent
  operator-believing-isolation-exists scenarios).
- |-
  Doc-side: extend `configuration-and-deployment/odd-platform#metric-storage-backend`
  with an explicit Tenant Isolation Scope sub-section enumerating which
  storage backends honour `odd.tenant-id` (PROMETHEUS only) and which
  silently ignore it (INTERNAL_POSTGRES default). The current page
  presents `odd.tenant-id` as a global property; the scope is silently
  Prometheus-only.
