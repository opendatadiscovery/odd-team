behaviour: |-
  S2S 'ADMIN' username-collision regression-pin. S2sAuthenticationFilter.java:31-34 builds `User.withUsername("ADMIN").roles("ADMIN")` and wraps in UsernamePasswordAuthenticationToken (provider=null via AuthIdentityProviderImpl.java:32). Any S2S call that invokes a service using `fetchAssociatedOwner` looks up `WHERE OIDC_USERNAME = 'ADMIN' AND PROVIDER IS NULL`. If an operator has named a LOGIN_FORM or LDAP user 'ADMIN' (uppercase, exact case-sensitive match — the SQL uses `eq`, not `equalIgnoreCase`), the S2S caller resolves to THAT user's Owner. S2S API key holders thereby inherit one specific operator user's owner-scoped reads/mutations. The uppercase / case-sensitivity reduces but does not eliminate the collision. Auth boundary failure: S2S inherits user identity through user_owner_mapping lookup.
test_class: missing-security
