proposed_action: |-
  Add `TagServiceImplEmptyTagNamesDeletesAllTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/service/` using Testcontainers + `@SpringBootTest`. Three test methods:

  1. **`updateRelationsWithDataEntity_withEmptyTagNamesSet_removesAllNonExternalRelations_pinsDestructiveSemantic`** (HEADLINE):
     - Arrange: 1 data_entity. Seed 3 `tag_to_data_entity` rows: `(tagA, entity, external=false)`, `(tagB, entity, external=false)`, `(tagC, entity, external=true)` (Collector-pushed).
     - Act: `tagService.updateRelationsWithDataEntity(entity.id, Set.of()).block()`.
     - Assert: query `SELECT tag_id, external FROM tag_to_data_entity WHERE data_entity_id = ?`. Result: ONLY `(tagC, true)` remains. tagA and tagB are GONE. PIN: empty Set is destructive across the non-external set.

  2. **`updateRelationsWithDataEntity_withEmptyTagNamesSet_externalRelationsPreserved_pinsExternalImmutabilityUnderDeleteAll`**:
     - Arrange: 2 `tag_to_data_entity` rows both `external=true` (e.g., from a Collector push).
     - Act: `updateRelationsWithDataEntity(entity.id, Set.of()).block()`.
     - Assert: BOTH external rows STILL present. PIN: even the destructive empty-input does not breach the external-immutability invariant (sister to TEST-GAP-857).

  3. **`updateRelationsWithDataEntity_withEmptyTagNamesSet_listReturnsOnlyExternalRelations_pinsPostStateShape`**:
     - Arrange: as in #1.
     - Act: capture the return value `List<TagDto>` from the call.
     - Assert: returned list contains ONLY the tagC TagDto with `external = true`. PIN: the return shape after the destructive operation is the external-only residue.

  After landing the test: pair with REFACTOR-NNN — either change the contract to differentiate empty-list (delete all) from absent / null (no-op) at the OpenAPI level, OR add a guard at the service layer. Cross-pair with DOC-NNN to surface this on the doc page so SDK authors don't get burned.
