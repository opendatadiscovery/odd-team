    When the user applies a single filter on the Activity page (Event type, Datasource, Namespace,
    Tag, Owner, or Period), the feed narrows to rows matching that filter and the expected entity's
    activity remains visible.
  derivation: |
    The seven-facet filter panel is the primary affordance on screen; a user expects each facet to
    narrow the list to matching activity (Rule 9: convenience + understanding from the screen).
  seed_source: ui-label + endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      The Playwright e2e (tests/features/activity/activity.spec.ts) drives the real UI -> backend -> DB
      flow: open the Activity tab, apply each of Event type / Datasource / Namespace / Tag / Owner /
      Period, and assert the seeded entity (Book_ETL_aqa) still appears (countListItems >= 1). Six of the
      seven facets are covered end-to-end. CRITICAL OMISSION: the User filter is NOT among them — which is
      consistent with the LSN-020 bug (H-001), since a User-filter e2e would have to grapple with the
      owner-axis semantic. So the happy-path narrowing promise is verified for 6/7 facets, NOT for User.
    evidence:
      - test: "odd-platform/tests/features/activity/activity.spec.ts"
        cite: "activity.spec.ts:24-87 (Event type, Datasource, Namespace, Tag, Owner, Period)"
        note: "real UI->backend->DB single-filter narrowing, 6 facets; User filter absent"
      - sidecar: odd-platform__ts__react-component__component__Activity.md
        section: "concepts.operations"
        cite: "components/Activity/Filters/Filters.tsx (seven-facet panel)"
        note: "the seven facets the e2e exercises six of"
    severity: N/A
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: verified
    test_ref: "activity.spec.ts 'Display an expected item with filter {Event type|Datasource|Namespace|Tag|Owner|Period}'"
    coverage_note: |
      6 of 7 facets verified. The User facet is the gap — and it is the highest-leverage missing e2e
      because it is exactly the LSN-020 surface. A User-filter e2e would either (a) document the
      owner-axis behaviour as the current contract, or (b) become the RED gate for the PLT-030 fix.
      Functional demand UC-17 (the User-filter e2e).

