behaviour: |-
  `listMostPopular` pagination — `testListMostPopular` uses page=1, size=numberOfTestTags (no page boundary); no test asserts that page=2 returns the next slice, that `total` is consistent across pages, or that an out-of-bounds page returns an empty page. Combined with the lack of a size-cap (no `@Max`, no `maximum:` in OpenAPI), this is a DoS-amp surface: any authenticated caller can submit `size=100000` to force a full-directory aggregate.
