proposed_action: |-
  Reflection-based + integration test. (a) Reflection: assert the `webClient` field is bound to `https://api.github.com` literal (current). (b) Configure a GHES-style provider with `auth.oauth2.client.github.provider: github` (no apiBaseUrl). (c) Attempt to login; assert the WebClient call resolves to api.github.com (not the operator's GHES). (d) Pin the hard-coding; future REFACTOR adding apiBaseUrl flips this test.
