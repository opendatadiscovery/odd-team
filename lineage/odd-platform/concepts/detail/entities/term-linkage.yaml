name: Term Linkage
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-06
- P-01
- P-09
description: |-
  Per-(data-entity, term) edge stored in data_entity_to_term, with PK
  (data_entity_id, term_id, is_description_link). Allows manual link
  (is_description_link=FALSE) AND description-parsed link
  ([[ns:term]] regex match, is_description_link=TRUE) to coexist as
  separate rows. Created via POST /api/dataentities/{id}/terms or via the
  description-edit pipeline. **STRENGTHENED batch 2026-05-19K** —
  TermServiceImpl primary-source confirms the link-table semantics:
    - is_description_link flag is INTENTIONAL per implicit_adrs.[1] —
      manual + description-link rows coexist; the PK
      (data_entity_id, term_id, is_description_link) allows both;
      removeDuplicateNonDescriptionTerms collapses the pair at projection
      time, preferring the description variant
    - Description-mention guard blocks rename/delete (per implicit_adrs.[2])
      — a term cannot be renamed or deleted while any active description
      mentions it; the guard filters parent entity status != DELETED
    - Unhandled-mention staging with auto-resolution on term-create (per
      implicit_adrs.[3]) — mentions for non-existent terms are NOT silently
      dropped; staged in *_unhandled_term tables; auto-materialised on
      term-create
  **NEW HIGH findings batch K**:
    - REFACTOR-217 primary-source: SecurityConstants.java:237-242 paths
      are SINGULAR (/term) but OpenAPI declares PLURAL (/terms) — the
      DATA_ENTITY_ADD_TERM / DATA_ENTITY_DELETE_TERM gates NEVER FIRE for
      the real endpoints (silently disabled)
    - REFACTOR-227 primary-source: the [[ns:term]] auto-link side-channel
      bypasses DATA_ENTITY_ADD_TERM even when REFACTOR-217 is fixed; the
      service-tier handleDataEntityDescriptionTerms invocation from
      DataEntityServiceImpl.upsertDescription is reachable via the
      DATA_ENTITY_DESCRIPTION_UPDATE gate alone
    - Second SecurityConstants bug (NEW HIGH): /api/alerts/{id}/status PUT
      is gated by DATASET_FIELD_ADD_TERM (a Term permission on an Alert
      path — copy/paste error at SecurityConstants.java:295-296)
    - TermServiceImpl service-tier has ZERO permission checks (verified
      via grep); authorization is entirely controller-tier
    - Cross-namespace pollution unconstrained — no per-tenant scoping at
      service or repository layer; descriptions in one namespace can
      auto-link to terms in another namespace
