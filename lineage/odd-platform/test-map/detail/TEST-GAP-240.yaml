behaviour: No auth flow auto-creates an Owner on first login — `AuthIdentityProviderImpl`,
  `LDAPSecurityConfiguration`, `OAuthSecurityConfiguration` never call `OwnerService.create`
  or `getOrCreate`. `getOrCreate` is invoked ONLY from `OwnerAssociationRequestServiceImpl.createOwnerAssociationRequest`.
  Operators must MANUALLY pre-create per-user Owner rows OR accept manual association
  requests. Live owners doc states 'Every ODD Platform user should associate themselves
  with one of the existing owners' — aligning with code but operator-discoverability
  gap remains.
