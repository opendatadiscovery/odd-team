proposed_action: |-
  Local docker-compose: odd-platform + nginx reverse proxy configured
  to forward X-Forwarded-Host. Spin up Keycloak as an Azure-shape IdP
  with permissive logout-URL allowlist. From a browser at victim.local,
  trigger logout with a crafted X-Forwarded-Host: attacker.local
  (curl direct, or browser extension). Verify the IdP-issued 302 redirects
  to attacker.local.
notes: |-
  Genuinely new feature shape — anchors the operator-observable
  open-redirect surface that no existing F-NNN names. F-011 batch O
  carries Azure-NPE-on-null-logout-uri (a different facet of the same
  handler chain); F-086 (this batch) carries the token-revocation
  semantics. F-089 carries the redirect-provenance surface. Together
  the three features describe the full "what does logout actually do?"
  question on the SecuritypageSecurity & Access Control pillar.

