      STATIC — primary-source in batch Z odd-platform-public-api
      sidecar bugs_limitations_corner_cases[9] + openapi.yaml:10-12.
      Severity: LOW.
  - facet: info.title 'ProspectLog' legacy branding visible in Swagger UI
    observed: |-
      `openapi.yaml:2-9` declares
      `info.title: ProspectLog data catalog HTTP API contract`.
      'ProspectLog' is an internal/early name predating the ODD
      rename; `info.contact.url: https://provectus.com` ties to
      Provectus, ODD's origin company; `info.contact.email:
      ndementev@provectus.com` is a direct individual contact.
      Operators interacting with the Swagger UI see the title
      'ProspectLog data catalog HTTP API contract' which does not
      match the project's public branding 'Open Data Discovery'.
    expected: |-
      Rename `info.title` to "Open Data Discovery Platform API";
      replace `info.contact.url` with the project's GitHub org URL;
      either drop `info.contact.email` or replace with a project
      contact (e.g. the GitHub issues URL or a generic
      contact@opendatadiscovery.org alias).
    drift_class: openapi_info_title_prospectlog_legacy_branding
    provenance: |-
      STATIC — primary-source in batch Z odd-platform-public-api
      sidecar bugs_limitations_corner_cases[8] + openapi.yaml:2-9.
      Severity: LOW (branding/cosmetic; not load-bearing on behaviour
      but operator-visible on every running Swagger UI).
  - facet: no rate-limit / pagination-size declarations — clients cannot discover safe limits
    observed: |-
      Grep `openapi.yaml` for `x-throttle` / `x-rate-limit` returns 0
      matches; the platform also does not enforce rate limits today
      (no `@RateLimiter` annotations on controllers per cross-batch
      evidence). Pagination is done via `PageParam`/`SizeParam`
      (re-usable parameter refs in components.yaml) but with NO
      `maximum:` declared in those parameters — the platform accepts
      any positive integer including very large values
      (DataEntityController, AlertController batches confirmed).
      Third-party clients cannot discover from the spec what the safe
      max-page-size is.
    expected: |-
      Add `maximum: 1000` (or empirically-safe value per controller)
      to `PageParam`/`SizeParam` parameter declarations; add per-
      operation `x-rate-limit` extensions when rate-limit support is
      implemented. The 'no rate limits exist' fact is currently
      accurately reflected in the spec; a future rate-limit
      implementation needs spec extensions.
    drift_class: openapi_no_pagination_size_caps_no_rate_limit_declarations
    provenance: |-
      STATIC — primary-source in batch Z odd-platform-public-api
      sidecar performance.known_performance_gaps. Severity: LOW
      (information-quality issue with potential performance impact
      under abuse).
