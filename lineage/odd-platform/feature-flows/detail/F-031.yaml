batch_origin_note: |-
  2026-05-21 batch ZB — NEW pillar-anchored feature minted from the 5
  DataSourceController endpoint-method sidecars (getDataSourceList,
  registerDataSource, updateDataSource, deleteDataSource,
  regenerateDataSourceToken). Per Rule 0 evaluation: the Data Source
  lifecycle is a USER-OBSERVABLE Management capability — operators CRUD
  registered data sources + rotate ingestion tokens via the Management →
  Datasources tab. The system-mission.md P-08 sub-feature seed names
  "Datasources tab (audit, edit, link Collector + Namespace)" as a
  distinct sub-feature; this anchors F-031 as P-08:F-007, the FOURTH
  P-08 UI-admin lifecycle sibling alongside F-019 (Owner), F-020
  (Collector), F-028 (Namespace).

  Dedup (rev-7.1 protocol, registry-search-spawn.md): the
  lineage/_extractor/.venv exists, but this agent environment has no
  Bash tool to invoke `lineage-extractor graph-search`; per the
  playbook's "graph layer unavailable" fallback the dedup was run as a
  grep over feature-flows/index.yaml for `DataSource` / `datasource` /
  `Datasources tab`. dedup_fallback: grep. The grep is conclusive: every
  hit is either F-008 (the S2S `/ingestion/datasources` path), F-023
  (Directory's read-only `/api/directory/datasources`), or an F-020 /
  F-028 cross-reference. There is NO existing UI-admin DataSource
  lifecycle feature. The batch-W DataSourceController CLASS sidecar was
  used only to EXTEND F-008 by counterfactual (UI-admin path DISJOINT
  from S2S). MINT F-031 is therefore correct — the 5 endpoint-method
  sidecars give the full lifecycle shape and the UI-admin Management
  capability is too rich to fold into F-008 (which is the P-10 S2S
  ingestion pillar) without losing the user-observable Management shape.

  The substitution from EXTEND-F-008 to MINT-F-031 is justified
  because (a) the UI-admin half is a different pillar (P-08 Management)
  from F-008's pillar (P-10 Ingestion); (b) the substrate evidence —
