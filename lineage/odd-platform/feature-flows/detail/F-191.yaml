feature_id: F-191
pillar_id: P-01
pillar_anchored_id: P-01:F-009-ui
pillar_anchored_feature_name: Dataset Schema Revision Compare Viewer (UI surface)
feature_name: |-
  Dataset Schema Revision Compare Viewer — the side-by-side per-field
  diff UI surface at `/dataentities/{id}/structure/compare?firstVersionId=&secondVersionId=`,
  the OPERATOR-OBSERVABLE counterpart of the
  GET /api/datasets/{id}/structure/diff backend endpoint F-045 anchors.
  Surface composes 4 UI components (DatasetStructureCompare,
  DatasetStructureCompareHeader, DatasetStructureCompareList,
  DatasetStructureCompareListItem) with jotai "show changes only" state +
  URL-query-param-driven version-id selection.
seeded_from: ui-review-2026-05-26
seeded_at: 2026-05-26
status: ui-complete
discovered_from_entry_point: |-
  ui_route:/dataentities/{id}/structure/compare?firstVersionId=&secondVersionId=
  → DatasetStructureCompare.tsx (55 loc, hooks=5) mounted via
  `datasetStructureComparePath` route helper. Operator-visible affordance
  is the "Revision compare" button in DatasetStructureHeader.tsx:144-150
  (disabled if datasetVersions.length < 2).
