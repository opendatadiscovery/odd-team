name: Fetch Data Entity Details (Redux Toolkit createAsyncThunk)
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
- P-01
description: |-
  **NEW CONCEPT, batch 2026-05-19J** — the UI-side Redux Toolkit `createAsyncThunk`
  (wrapped by the project's local `handleResponseAsyncThunk` helper) that takes
  `{ dataEntityId }`, calls `dataEntityApi.getDataEntityDetails({ dataEntityId })`
  (the OpenAPI-generated client for `GET /api/dataentities/{data_entity_id}`), and
  on `fulfilled` lets the resolved `DataEntityDetails` payload fan into **three**
  extraReducers — `dataentities.slice` (the entity itself, minus metadata +
  ownership), `metadata.slice` (the `metadataFieldValues` chunk), and `owners.slice`
  (the `ownership` chunk) — that together rehydrate the per-entity slice of the
  Redux store on every detail-page mount or status change. **The producer half of
  F-001 view_count loop on the UI side** — every dispatch costs the backend +1
  view_count UPDATE on the entity (and LSN-017 doubles that to +2 per page-open).
  Dispatched ONLY from `DataEntityDetails.tsx:56-64` (verified by grep — exactly
  one match in the entire UI tree). Errors are deliberately silenced at the toast
  layer via `{ switchOffErrorMessage: true }` — but the `rejected` action still
  writes the `AppError` into `loader.errors[fetchDataEntityDetails]`, where
  `<AppErrorPage>` renders it as a full-page banner. No client-side caching, no
  retry, no debounce, no in-flight de-dup. The action-type string is a STABLE
  prefix (`'dataEntities/fetchDataEntityDetails'`) consumed by the loader-slice
  matchers.
nodes:
