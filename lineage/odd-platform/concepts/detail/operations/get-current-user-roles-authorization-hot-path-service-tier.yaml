notes: |
  Operation vocabulary captured for the authorization-hot-path story.
  This is the Role-side service-tier vertex; the Policy-side counterpart
  is `get-current-user-policies-authorization-hot-path-service-tier`.
  Both vertices flow per-request from the permission extractors.

  Recommended cleanup (covered in detail at the companion invariant
  `authorization-hot-path-getcurrentuserroles-per-request-no-cache`):
    (1) Request-scoped caching via @RequestScope.
    (2) Process-wide short-TTL Caffeine cache keyed by (username, provider).
    (3) Close the batch N missing role.deleted_at filter on the 5-table
        JOIN (one-line fix at ReactiveUserOwnerMappingRepositoryImpl.java:
        99-114).
    (4) Close the batch S case-sensitivity mismatch on create (one-line
        fix at RoleServiceImpl.java:50-51 per the companion invariant
        `predefined-role-name-three-policy-case-sensitivity-mismatch`).

  Cross-references:
    - New invariant `authorization-hot-path-getcurrentuserroles-per-request-no-cache`
      (the broader caching gap).
    - Existing entity `Role (Authorization)` (the broader concept).
    - New operation `get-current-user-policies-authorization-hot-path-service-tier`
      (the Policy-side counterpart on the same hot path).
    - Existing operation `query-resource-permissions` (the read-side
      surface that ALSO consumes the per-request authorization resolution).
