# 5. Concepts EVALUATED for dedup but deliberately NOT minted / NOT merged.
#    (Transparency for the maintainer's /review — shows what was considered.)
# ---------------------------------------------------------------------------
dedup_decisions:
  - candidate: openapi-tag:tag as a standalone entity
    decision: NOT-MINTED — folded into the existing `tag` entity
    rationale: |-
      The catalog's prior `alert` and `dataEntity` openapi-tag sidecars were
      handled the same way — openapi_tags appears as an axes_present VALUE on
      the relevant entity/operation concepts, not as standalone concept entries.
      The `tag` openapi-tag sidecar describes the contract grouping label for
      the 4 /api/tags CRUD operations; its content (Tag/TagList/TagsResponse/
      TagFormData/BulkTagFormData schemas, the 4 operations, the
      no-security-block invariant) all attach to the existing `tag` entity and
      the new create-tag/update-tag operations. Minting a separate
      'openapi-tag-tag-surface' entity would duplicate the Tag entity.
  - candidate: status-code 200-vs-201 drift on createTag/updateTag
    decision: NOT-MINTED as a new invariant — routed to the EXISTING candidate
    rationale: |-
      `openapi-200-vs-201-status-code-drift-codebase-wide` already exists in
      canonicalisation_candidates. createTag and updateTag are two more
      instances of that codebase-wide class (the openapi-tag sidecar explicitly
      says 'Same drift class as TermController.createTerm'). The new create-tag
      and update-tag operation detail files cross-reference that candidate in
      their notes + weaknesses rather than minting a duplicate. A maintainer
      may choose to append the two new instances to that candidate's detail
      file in a follow-up.
  - candidate: tag-name validation absence (empty/whitespace/unbounded names)
    decision: NOT-MINTED as a new concept — recorded as a per-operation weakness
    rationale: |-
      All 4 tag-mutation operations (createTag, updateTag, the two relation
      replace-alls) carry the same 'no tag-name validation' finding. It is a
      LOW-severity cross-cutting weakness already implicitly covered by the
      Tag entity. Recording it as per-operation security_aggregate.weaknesses
      on the new detail files is sufficient; minting a standalone invariant
      would be a generic LLM-suggested concept with no single primary source.
  - candidate: merging the three tag-relation replace-all operations
    decision: NOT-MERGED — kept as three distinct concepts
    rationale: |-
      Conservative-clustering rule (system-prompt Rule 3). The data-entity,
      term, and dataset-field tag-relation replace-all operations share the
      auto-create side-door but DIVERGE materially: (a) term path emits NO
      activity-feed event and has NO external carve-out; (b) dataset-field path
      discards-and-rebuilds rather than diffs and has a three-value TagOrigin
      discriminator; (c) data-entity path diffs and carries a boolean external
      flag. Merging them would erase the cross-axis distinctions a maintainer
      needs. False-positive merges damage catalog trustworthiness more than
      false-negative splits.

