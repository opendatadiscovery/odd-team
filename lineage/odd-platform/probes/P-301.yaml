# P-301 — view_count concurrent-increment correctness + Popular pagination stability (H-012)

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (3010, '//probe-source-P-301/db', 'probe-source-P-301')
      ON CONFLICT (id) DO NOTHING

  # Seed one hot entity for the lost-update test (sub-assertion a).
  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, view_count,
         source_created_at, source_updated_at)
      VALUES (301000, '//probe-source-P-301/db/tables/p301_hot', 'p301_hot',
              3010, 1, 0, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # Seed 50 entities with descending view_count for the pagination-stability test
  # (sub-assertion b). generate_series gives a deterministic, gap-free ranking.
  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, view_count,
         source_created_at, source_updated_at)
      SELECT 301100 + g,
             '//probe-source-P-301/db/tables/p301_page_' || g,
             'p301_page_' || g,
             3010, 1, (1000 - g),
             NOW(), NOW()
      FROM generate_series(0, 49) AS g
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      SELECT view_count FROM data_entity WHERE id = 301000
    capture_as: initial_hot_view_count

act:
  # Sub-assertion (a): fire N concurrent direct API reads of the SAME hot entity.
  # Direct API (not browser) so each call = exactly +1 (isolates lost-update from
  # the LSN-017 +2 doubling). 200 concurrent calls is enough to surface any
  # read-modify-write race if one existed.
  - kind: http-load
    method: GET
    path: /api/dataentities/301000
    base: "http://localhost:18080"
    concurrency: 50
    total_requests: 200
    capture_status_counts_as: hot_read_status_counts

  # Sub-assertion (b): page through Popular (size=10, pages 1..5 = the 50 seeded
  # rows) WHILE a background concurrent-increment stream mutates view_count, to
  # provoke any offset-shift duplicate/skip.
  - kind: http-load
    method: GET
    path: /api/dataentities/301107   # mid-rank seeded entity; pumping it reorders the page boundary
    base: "http://localhost:18080"
    concurrency: 10
    total_requests: 100
    background: true
    capture_status_counts_as: pagination_disruptor_status_counts

  - kind: http-collect-pages
    method: GET
    path_template: "/api/dataentities/popular?page={page}&size=10"
    base: "http://localhost:18080"
    pages: [1, 2, 3, 4, 5]
    collect_field: id
    only_seeded_prefix: 3011          # restrict the union check to the 50 p301_page_* ids
    capture_ids_as: paged_seeded_ids

observe:
  - kind: sql
    query: |
      SELECT view_count FROM data_entity WHERE id = 301000
    capture_as: final_hot_view_count

assert:
  # (a) NO LOST UPDATE — exactly +200 from 200 successful concurrent API reads.
  # If any read returned non-200 the harness subtracts it; the invariant is
  # delta == count(200 responses) so the equality below is gated on all-200.
  - "hot_read_status_counts['200'] == 200"
  - "final_hot_view_count - initial_hot_view_count == 200"

  # (b) PAGINATION STABILITY — no duplicate seeded id across the 5 pages.
  - "len(paged_seeded_ids) == len(set(paged_seeded_ids))"
  # No seeded id dropped beyond a 1-row offset-shift tolerance (a single
  # boundary-crossing reorder can legitimately shift exactly one row between
  # adjacent pages under offset pagination; >1 missing means a real skip).
  - "len(set(range(301100, 301150)) - set(paged_seeded_ids)) <= 1"

cleanup:
  - kind: docker-compose-down
    destroy_volumes: true

cross_references:
  refactoring_scopes: [REFACTOR-201, REFACTOR-220, REFACTOR-221]
  test_gaps: [TEST-GAP-256, TEST-GAP-259]
  related_concepts: ["Popular Entities Ranking", "Data Entity"]
  retrospectives: [LSN-017]
  reflection: "lineage/odd-platform/feature-reflections/detail/F-001.yaml#H-012"

realism_caveats: |
  - LOCAL-ONLY (APPROACH.md §9 rule 12): docker-compose stack + direct HTTP load
    (k6 / wrk / a small asyncio script) + DB SELECT — no cloud, no managed DB.
  - The lost-update test uses DIRECT API reads (one +1 per call), deliberately
    NOT headless-browser page-opens, to isolate the concurrency question from the
    LSN-017 +2 doubling pinned by P-004. A browser-driven variant would expect
    +400 (200 page-opens × 2) but conflate two effects.
  - Sub-assertion (b)'s 1-row offset-shift tolerance reflects the inherent
    semantics of non-transactional offset pagination under concurrent writes; it
    is NOT a pass for unbounded skipping. If the harness observes >1 missing or
    any duplicate, record the exact rate — that converts H-012's pagination half
    from probe-needed to partial/contradicted.
  - Under auth.type=DISABLED (the probe stack default) all calls are anonymous,
    which matches the documented DISABLED reachability — no auth header needed.
