notes: |-
  Promoted to a NEW cross-cutting invariant in batch 2026-05-12D.
  The pattern is structurally similar to the "Dead code in load-bearing
  positions" invariant — both expose maintainers to "I thought this was
  the source of truth" failure modes.

  Recommended cleanup:
    - DataCollaborationProperties: add `Boolean enabled`, `String slackOauthToken`,
      `int messagePartitionPeriod` fields; replace 4 @Value reads with
      DataCollaborationProperties getters. (NB: enabled field requires
      coordination with FeatureResolverImpl's SpEL-based conditional
      evaluation.)
    - EmailSenderProperties: add `String recipients` (CSV) or
      `List<String> recipients` field bound to `notification.emails`;
      replace the @Value read in NotificationConfiguration.java:104.
    - **batch ZK NEW** AdditionalLinkProperties: either complete the
      binding (add tenant-id / platform-base-url / data-entity-stale-period /
      activity.partition-period fields), OR move `links` to its own
      `odd.links.*` sub-prefix (`@ConfigurationProperties("odd.links")`),
      OR add `(ignoreUnknownFields = true)` explicitly to lock the current
      tolerant-binding behaviour. Without one of these three, the next
      hardening PR will break the boot path.

  **batch ZK new triangulation finding**: AdditionalLinkProperties is
  the FIRST instance where the partial-home pattern's foot-gun has
  CONCRETE shape — the `odd.*` namespace has 5 known sibling keys, the
  Properties class binds 1 of 5, and the latent-strict-mode failure is
  4 lines of bean-creation errors at boot. Prior instances
  (DataCollaborationProperties, EmailSenderProperties) hide the
  foot-gun behind less-visible namespaces.
