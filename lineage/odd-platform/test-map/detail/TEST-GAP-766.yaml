behaviour: |-
  **MEDIUM — TagController's 3 write endpoints (`createTag`, `updateTag`, `deleteTag`) produce ZERO Activity Feed entries. The platform's `@ActivityLog(event = TAG_ASSIGNMENT_UPDATED)` annotation exists at `DataEntityServiceImpl.java:358` (the per-entity tag-assignment path), but NOT at the controller-side directory-vocabulary path. An operator using the Management → Tags tab to delete or rename a tag produces no audit trace.** Primary-source confirmed in batch-W TagController sidecar:

  - `TagController.java:22-52`: NO `@ActivityLog` annotations on any of the 4 method handlers.
  - `TagServiceImpl.java:31-167`: NO `@ActivityLog` on `bulkCreate / update / delete`.
  - `DataEntityServiceImpl.java:358`: the ONLY `@ActivityLog` entry related to tags — and it's on the PER-ENTITY tag-assignment surface (TAG_ASSIGNMENT_UPDATED), NOT the directory-vocabulary lifecycle (TAG_CREATED / TAG_UPDATED / TAG_DELETED enum values do not exist in `ActivityEventTypeDto`).

  **Cross-pillar pattern** — this is another instance of the system-wide `audit-log-presence-asymmetry-2-tier-audit-story` canonicalisation candidate (per system-mission.md §"Audit-log Presence Asymmetry (2-tier audit story)"):
  - **Tier 1 (audited)**: per-entity metadata changes (description edits, tag ASSIGNMENTS, ownership changes).
  - **Tier 2 (NOT audited)**: RBAC mutations + Collector lifecycle (TEST-GAP-757) + Datasource lifecycle (TEST-GAP-749 family) + **Tag DIRECTORY lifecycle (THIS gap)**.

  The Management tab surface — operators' canonical place for vocabulary-level mutations — has the LOWEST audit-trail granularity. The asymmetry is invisible until an operator goes looking.

  **Operator-visible consequences**:
  - **Audit confusion**: an operator browsing the Activity Feed expects to see "user X created tag 'finance-pii' at 14:32" but sees nothing. The tag exists in the directory; no audit trail.
  - **Compliance gap**: SOX / GDPR / ISO 27001 audit reports demonstrating "who has modified the catalog vocabulary in 2026-Q1" cannot be reconstructed from the Activity Feed.
  - **Forensic investigation**: a stewardship investigation ("who renamed the `sensitive` tag to `Sensitive`?") has no answer from the Activity Feed; the only audit signal is `tag.updated_at` + (if available) the rename-time correlation with an operator's session.
  - **Compound with TEST-GAP-763**: side-door write paths bypass `TAG_CREATE` AND produce no audit log. An auditor investigating "who polluted the tag vocabulary" cannot identify the responsible side-door caller.

  **Why MEDIUM not HIGH**:
  - The audit-log absence is a known platform-wide pattern (per system-mission.md canonicalisation candidate); the Tag DIRECTORY is one of multiple surfaces.
  - The functional impact is recoverable (the operator can examine `tag` table directly for `updated_at` + DB-level audit if enabled).
  - HIGH would be inappropriate when sister findings at the same severity (CollectorController audit-silence TEST-GAP-757, DataSourceController audit-silence in the TEST-GAP-752 family) are rated HIGH ONLY when combined with other invariants. The Tag DIRECTORY in isolation is MEDIUM.

  **Test gap shape**: regression-pin asserting: (a) `POST /api/tags` produces ZERO Activity Feed entries; (b) `PUT /api/tags/{id}` produces ZERO; (c) `DELETE /api/tags/{id}` produces ZERO; (d) the per-entity tag-assignment path AT `DataEntityServiceImpl.java:358` DOES produce TAG_ASSIGNMENT_UPDATED Activity entries (asserting the asymmetry exists); (e) `ActivityEventTypeDto` does NOT have `TAG_CREATED / TAG_UPDATED / TAG_DELETED` enum values (the schema-level absence). The current state is PINNED — failures land if a future maintainer adds enum values + `@ActivityLog` instrumentation.
