      ('every authenticated user can enumerate the entire catalog') and
      with the platform-wide implicit ADR observed across F-001 + F-003
      + F-006 + F-023.
    expected: |-
      Aligned with the documented read-collaborative posture; no fix
      required. Recommend a doc page on the Business Glossary surface
      noting "Dictionary tab is catalog-wide; namespace concept is
      informational, not isolating" to set operator expectations.
    drift_class: read_collaborative_posture_inherits_repo_tier_no_ui_filter
    provenance: |-
      STATIC — primary-source in batch U TermSearch sidecar
      invariants[2] + implicit_adrs[3] + cross-link system-mission.md
      P-09 read-collaborative posture + F-002 batch-N. Severity LOW
      (intentional; UX manifestation of an architectural stance).
  - facet: search-session no per-caller ownership check (batch U — STATIC)
    observed: |-
      TermController.java:166-216 — the 6 search-state endpoints
      authenticate via `pathMatchers("/**").authenticated()` and rely
      on the unguessable `searchId` UUID as session ownership. No
      rate-limit on session creation, no per-caller session count, no
      confirmation that the caller is the session creator on
      updateTermSearchFacets — any authenticated user with a valid
      `searchId` UUID can read or mutate the session. The pattern is
      identical to F-017 SearchController on `/search/*`. Functionally
      OK because the UUID is unguessable (effective resource-capability
      pattern), but two operators sharing a UUID (e.g. via a Slack
      link) can race-mutate the same session.
    expected: |-
      Either (a) per-caller session-creator binding (write
      `created_by_user_id` to search_facets + check on update/get) OR
      (b) document the resource-capability model explicitly — sharing
      a /termsearch/{uuid} URL grants full session-state access.
    drift_class: search_session_no_per_caller_ownership_check
    provenance: |-
      STATIC — primary-source in batch U TermController sidecar
      bugs_limitations_corner_cases[3] + TermController.java:166-216 +
      cross-link F-017 SearchController (same pattern).
      Severity MEDIUM.
  - facet: empty-state copy fails onboarding (batch U)
    observed: |-
      TermSearchResults.tsx:105-107 renders `<EmptyContentPlaceholder
      text={t('No matches found')}/>` whenever `!isTermSearchFetching
      && !total`. A fresh deployment with no terms yet sees "No matches
      found" — an operator new to ODD would reasonably expect "No terms
      exist yet — click 'Add term' to create your first one" or similar
      onboarding copy. Pairs with the Business Glossary docs page
      framing "All created terms are gathered in the Dictionary tab" —
      but the empty state on day 1 reads like a search miss.
    expected: |-
      Distinguish the two empty states — onboarding (`!total && !query
      && empty(filters)`) vs filtered-zero (`!total && (query ||
      !empty(filters))`).
    drift_class: empty_state_copy_no_onboarding_disambiguation
    provenance: |-
      STATIC — primary-source in batch U TermSearch sidecar
      bugs_limitations_corner_cases[8] + TermSearchResults.tsx:105-107.
      Severity LOW (onboarding UX gap).
  - facet: doc silence on Dictionary tab — facets / search / pagination / sessions undocumented (batch U)
    observed: |-
      Business Glossary docs (WebFetch 2026-05-20 status 200) line 26-34
      describe the Dictionary tab with three user actions (Browse / Create
      / Open) — NONE mention free-text search, the facet sidebar, the
      pageSize=30 + infinite-scroll behaviour, the URL-backed
      deep-link-share-ability, or the 30-day session TTL. Operators
      reading the docs are unaware these affordances exist; a 30-day-old
      bookmark linked from Slack is functionally broken without doc-side
      framing.
    expected: |-
      Doc page additions covering: (a) free-text search; (b) faceted
      filter sidebar with axes; (c) pagination semantics; (d) URL
      deep-link share-ability with the session-TTL caveat.
    drift_class: doc_silence_dictionary_tab_search_facets_pagination
    provenance: |-
      STATIC — primary-source in batch U TermSearch sidecar
      doc_drift_findings[UI-DOC-GAP-D + E + F + G + H] + WebFetch
      business-glossary.md 2026-05-20 status 200. Severity LOW (multi-gap
      doc-side surface; operator-facing usability).
  - facet: create-term CTA visibility leaks TERM_CREATE permission (batch U)
    observed: |-
      The "Add term" CTA inside TermSearchHeader (gated by
      `<WithPermissions permissionTo={Permission.TERM_CREATE}>` at
      TermSearchHeader.tsx:17) is RENDERED iff the current user has
      TERM_CREATE. An adversary inspecting the DOM (or using browser
      dev tools) can enumerate the current user's permission set by
      observing which CTAs are visible. Architectural pattern across
      the platform (UI-only hide via WithPermissions HOC); SECURITY_RULES
      backend is the actual defence. NOT a defect per se — but a
      consistent platform-wide informational-disclosure pattern that
      operators may be unaware of.
    expected: |-
      Aligned with platform-wide UI gating convention; no fix required.
      Recommend a platform-wide doc note "UI permission gates hide
      affordances; permission set is inferrable via DOM inspection;
      backend SECURITY_RULES is the operative defence".
    drift_class: term_create_cta_dom_inspection_leaks_permission
    provenance: |-
      STATIC — primary-source in batch U TermSearch sidecar
      authorization_assertions + cross-link batch-Q PolicyList same
      pattern. Severity LOW (architectural pattern; documented
      consequence of the UI-only-hide convention).
  - facet: search session UUID share = session hijack (batch U)
    observed: |-
      The `/termsearch/{uuid}` URL is opaque to outside observers but
      constitutes an unguessable bearer of session state. Sharing the
      URL with a colleague grants them the SESSION's full state —
      filter state, query string, pagination position. If a user
      shares a URL after applying sensitive filters (e.g. an internal
      compliance namespace filter), the recipient sees the same filter
      applied. The session is otherwise read-collaborative anyway
      (every authenticated user sees every term), so the marginal
      info-disclosure is low — but operators may not realise URL
      sharing transfers session state.
    expected: |-
      Either (a) re-bind the session to the receiving user (write
      created_by_user_id check on update/get and 403 on cross-user
      access) OR (b) document the URL share = session share semantic.
    drift_class: term_search_session_hijack_via_searchid_uuid_share
    provenance: |-
      STATIC — primary-source in batch U TermSearch sidecar
      data_exposure ("URL-visible session UUID") + bugs_limitations_corner_cases[3].
      Severity LOW (intentional; UX manifestation of the resource-capability
      pattern).
