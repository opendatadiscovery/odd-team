proposed_action: |-
  Unit test. (a) Mock ClientRegistration with userNameAttributeName='name'. Mock OidcUserRequest with the ClientRegistration. (b) Invoke enrichUserWithProviderInformation; assert DefaultOidcUser's userNameAttributeName is 'name' (from ClientRegistration). (c) Mock ClientRegistration with userNameAttributeName=null. (d) Invoke; assert userNameAttributeName is 'sub' (IdTokenClaimNames.SUB fallback). (e) Set provider.userNameAttribute='different-value' in the POJO. (f) Invoke; assert userNameAttributeName is STILL the ClientRegistration value (POJO ignored — the Google-specific divergence).
