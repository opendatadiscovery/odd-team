- id: H-012
  hypothesis: "When an operator types a row value containing HTML/script (e.g. <img src=x onerror=alert(1)>) and saves it, the value is sanitised or escaped before it is stored and rendered, so it cannot execute when another user views the table."
  derivation: "Negative-space + cross-pillar (F-004 XSS family) — a steward-curated reference surface that other authenticated users read is a stored-XSS target; a product owner expects input sanitisation on a multi-user surface."
  seed_source: cross-pillar
  validation:
    verdict: partial
    actual_behavior: |
      At the STORAGE layer the value is persisted verbatim — LookupCharValidator.getValue returns the input
      string unchanged (LookupCharValidator.java:14-17): no <script> stripping, no length cap, no HTML escaping,
      no allowlist; the OpenAPI form schemas place no maxLength/pattern on name/description/default_value/value.
      Writes are SQL-injection-safe (parameterised DSL.val), but content is stored raw. At the RENDER layer the
      list renders {name, description, namespace.name} through React's <Link>/{...}/<Typography> (per
      LookupTablesListItem referenced via the LookupTables sidecar) — React's default text-node escaping provides
      partial mitigation (the same defence-in-depth envelope the F-004 family relies on), so a naive payload in a
      text node does not execute. The hypothesis is PARTIAL: storage does NOT sanitise (contradicts the promise),
      while the common render path escapes (the promise mostly holds for plain-text cells). The full attack surface
      depends on every render site of these values (markdown-rendered description fields, attribute contexts,
      the confirm-dialog body) — not all are verified from this chain.
    evidence:
      - sidecar: odd-platform__java__ReferenceDataController__controller-class__ReferenceDataController.md
        section: bugs_limitations_corner_cases[1] + security.known_security_gaps[1]
        cite: "LookupCharValidator.java:14-17 + components.yaml:3863-3882,4006-4025"
        note: "Verbatim storage, no constraints; F-004 5th surface (storage side)."
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: security.known_security_gaps[2] + data_exposure
        cite: "LookupTablesListItem.tsx:30-44 (name/description/namespace rendered to any authenticated user)"
        note: "Render path; React text-node escaping is the partial mitigation."
    operator_visible_failure: |
      Reference-data values are a stored-XSS vector: the platform accepts and stores arbitrary HTML/JS verbatim,
      and the values are visible to every authenticated user (reads are ungated — H-003). React's default escaping
      blocks the simplest text-node payloads, but any render site that interprets the value as markup (a markdown
      description renderer, an attribute interpolation, the delete-confirmation dialog that echoes the table name)
      is exploitable. The platform offers no storage-layer defence, so the security posture rests entirely on every
      consumer escaping correctly forever — the exact fragility the F-004 family documents. An operator pasting
      reference data from an untrusted source has no warning that the surface is trusted-input-only.
    severity: HIGH
    confidence: MEDIUM
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

