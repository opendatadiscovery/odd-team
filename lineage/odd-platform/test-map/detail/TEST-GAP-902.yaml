criticality_rationale: |-
  HIGH per Rule 3: the registerDataSource sidecar rates this uncovered behaviour HIGH and
  flags it the second-priority gap on the node (after the namespace-bypass security gap).
  The atomicity invariant is the only thing preventing a failed register from compounding
  the confirmed orphan-token accumulation hazard (TEST-GAP-905) AND scattering stale
  plaintext secrets. Not CRITICAL — the failure mode is resource accumulation + stale
  secrets at rest, not an active cross-boundary breach, and the @ReactiveTransactional
  annotation IS present (the gap is the absence of a regression guard, not a known live
  bug). pillars_affected len 1 (P-08) — no cross-pillar bump.
