name: /api/relationships does NOT apply EXCLUDE_FROM_SEARCH (asymmetric to /api/dataentities)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-02
  - P-09
description: |-
  NEW INVARIANT, batch ZE —
  ReactiveDataEntityRelationshipRepositoryImpl.java:66-72 (list
  conditionList) and :152-208 (detail conditionList) select ONLY
  by `entity_class_ids = [9]` (DATA_RELATIONSHIP) and optional
  `external_name` match.

  ABSENT predicates:
    - NO `data_entity.exclude_from_search IS NULL OR
      exclude_from_search = false`
    - NO `data_entity.hollow = false`
    - NO `data_entity.status_id != DELETED_ID`
    - NO OWNERSHIP join
    - NO data_source_id filter (cross-tenant)
    - NO namespace_id filter

  ASYMMETRY — the SIBLING list endpoint /api/dataentities applies
  EXCLUDE_FROM_SEARCH (per batch-T REFACTOR-425) + HOLLOW=false +
  STATUS != DELETED via getDataEntityDefaultConditions; the
  /api/relationships list does NOT.

  CONSEQUENCE — a relationship-class data_entity flagged
  `exclude_from_search=true` (e.g. via an operator-marked HIDE
  action OR a corrupted ingestion) IS NEVERTHELESS RETURNED by
  /api/relationships. Same for HOLLOW entities (placeholder rows
  awaiting full ingestion) and DELETED entities (soft-deleted).
  The catalog-asymmetric surface lets a caller enumerate
  relationships in states that operators believe are hidden.

  STRUCTURALLY DISTINCT from invariant:cross-owner-facet-count-enumeration-via-drill-down
  (which is the /api/search facet-count enumeration vector) and
  invariant:rbac-read-endpoints-no-securityrule-authenticated-only-fall-through
  (which is the RBAC management read surface). The relationships
  asymmetry is its own auditability shape — even within the
  catalog-as-public-metadata posture (per the implicit_adrs[1]
  catalog-global read decision), the operator-marked HIDE
  signal is silently ignored.

  Cross-link: invariant:exclude-from-search-is-broadly-applied-but-not-to-popular
  (the existing /popular asymmetry) — same shape, different
  endpoint family. Plus the LSN-class question: which OTHER
  list surfaces also bypass EXCLUDE_FROM_SEARCH? Pinned by
  P-131 + future cross-batch audit.

  Severity: MEDIUM (auditability + operator-HIDE-signal-respect
  gap). Doc gap on data-modelling/relationships.md.
