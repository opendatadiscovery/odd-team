        cite: "SecurityConstants.java:95-96 + S2sAuthenticationFilter (addFilterAt after permitAll) + LoginFormSecurityConfiguration.java:61-63"
        note: "/ingestion/** whitelist permitAll precedes the S2S authority check; S2S does not gate ingestion."
      - sidecar: odd-platform__java__auth__filter__IngestionDataEntitiesFilter.md
        section: dependencies_semantic.coupling[3]
        cite: "S2sAuthenticationFilter.java:17-48 + live S2S doc WebFetch 2026-05-19"
        note: "Doc recommends combining S2S with the ingestion filter — a defense-in-depth pairing the platform does not enforce on whitelisted paths."
    operator_visible_failure: |
      An operator following the live S2S doc literally — enabling S2S as the
      extra lock on ingestion — gets a false sense of layered protection: the
      three filter-uncovered endpoints (stats, metrics, alertmanager) stay open
