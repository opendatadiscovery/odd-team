# P-021 — Activity feed cursor: order-stability at sub-second boundaries (Stress Protocol C2)

stress_category: C (orderings / pagination / aggregation)

triggers:
  - ReactiveActivityRepositoryImpl.java:285-288 (symmetric truncate-to-second cursor)
  - ReactiveActivityRepositoryImpl.java:291 (full-precision ORDER BY)
  - V0_0_48__add_activity.sql:9 (created_at timestamp — microsecond precision in PG)
  - LSN-019 Stress Protocol Category C (orderings)

arrange:
  - kind: docker-compose-up

  - kind: sql
    query: |
      INSERT INTO data_source (id, oddrn, name)
      VALUES (1021, '//probe-source-P-021/db', 'probe-source-P-021')
      ON CONFLICT (id) DO NOTHING

  - kind: sql
    query: |
      INSERT INTO data_entity
        (id, oddrn, external_name, data_source_id, type_id, view_count,
         source_created_at, source_updated_at)
      VALUES (1021, '//probe-source-P-021/db/tables/p021_activity_target',
              'p021_activity_target', 1021, 1, 0, NOW(), NOW())
      ON CONFLICT (id) DO NOTHING

  # Insert 100 activity rows within a SINGLE wall-clock second with a
  # MONOTONIC-INCREASING created_at-microsecond progression so that the
  # ORDER BY DESC produces newest-first as [id 100, id 99, ..., id 1].
  # Each id N gets microsecond N (N=1..100); the latest microsecond is 100.
  - kind: sql
    query: |
      WITH base AS (
        SELECT date_trunc('second', NOW()) + interval '500 millisecond' AS t0
      )
      INSERT INTO activity
        (data_entity_id, event_type, is_system_event, created_at, created_by)
      SELECT 1021, 'DESCRIPTION_UPDATED', false,
             base.t0 + (gs * interval '10 microsecond'),
             'p021_user'
      FROM generate_series(1, 100) AS gs, base

  # Sanity: confirm 100 rows in a single second-bucket.
  - kind: sql
    query: |
      SELECT
        COUNT(*) AS row_count,
        COUNT(DISTINCT date_trunc('second', created_at)) AS bucket_count
      FROM activity
      WHERE data_entity_id = 1021 AND created_by = 'p021_user'
    capture_as: setup_sanity

act:
  - kind: rest
    method: GET
    path: "/api/dataentities/1021/activity?size=50&beginDate=2024-01-01T00:00:00.000Z&endDate=2030-12-31T23:59:59.000Z"
    capture_as: page1_response

observe:
  - kind: jsonpath
    from: page1_response_body
    path: "$.items[*].id"
    capture_as: page1_ids

  - kind: jsonpath
    from: page1_response_body
    path: "$.items[*].createdAt"
    capture_as: page1_timestamps

  - kind: jsonpath
    from: page1_response_body
    path: "$.pageInfo.lastEventId"
    capture_as: page1_cursor_event_id

  - kind: jsonpath
    from: page1_response_body
    path: "$.pageInfo.lastEventDateTime"
    capture_as: page1_cursor_event_dt

act_page2:
  - kind: rest
    method: GET
    path: "/api/dataentities/1021/activity?size=50&beginDate=2024-01-01T00:00:00.000Z&endDate=2030-12-31T23:59:59.000Z&lastEventId={page1_cursor_event_id}&lastEventDateTime={page1_cursor_event_dt}"
    capture_as: page2_response

observe_page2:
  - kind: jsonpath
    from: page2_response_body
    path: "$.items[*].id"
    capture_as: page2_ids

  - kind: jsonpath
    from: page2_response_body
    path: "$.items[*].createdAt"
    capture_as: page2_timestamps

assert:
  - "setup_sanity.row_count == 100"
  - "setup_sanity.bucket_count == 1"
  - "len(page1_ids) == 50"
  - "len(page2_ids) == 50"

  # PRIMARY: forward correctness — every row visited exactly once.
  - "len(set(page1_ids) & set(page2_ids)) == 0"
  - "len(set(page1_ids) | set(page2_ids)) == 100"

  # SECONDARY: visual order. Under strict (created_at DESC, id DESC), the
  # newest-microsecond rows come first. We inserted id N at microsecond N
  # (1..100), so the descending order is id 100, 99, ..., 1. Page 1 should
  # be ids 100..51, page 2 should be ids 50..1.
  - "page1_ids == list(range(100, 50, -1))"
  - "page2_ids == list(range(50, 0, -1))"

  # SECONDARY-2: timestamp monotonic across pages. The minimum timestamp
  # on page 1 should be STRICTLY GREATER than the maximum timestamp on
  # page 2 (microsecond comparison; visual time-travel would invert this).
  # If this assertion fails, the cursor's truncate-to-second cut has
  # produced a visual-shuffle — empirical confirmation of the hypothesis.
  - "min(page1_timestamps) > max(page2_timestamps)"

cleanup:
  - kind: sql
    query: |
      DELETE FROM activity WHERE data_entity_id = 1021 AND created_by = 'p021_user'

  - kind: sql
    query: |
      DELETE FROM data_entity WHERE id = 1021

  - kind: sql
    query: |
      DELETE FROM data_source WHERE id = 1021

  - kind: docker-compose-down
    destroy_volumes: true

