- id: H-008
  hypothesis: |-
    The visible field label the operator reads is the same identifier that gets substituted
    into the snippet — so what they see named on screen is what they are setting.
  derivation: |-
    Cross-layer naming drift (Rule 4) — the label uses arg.name; the form registers and
    Handlebars substitutes under arg.parameter. If name != parameter, the operator sets a field
    whose template key differs from its label.
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |-
      The label is `arg.name` (Typography at line 60 for BOOLEAN, line 95 for text). The form
      field is registered under `arg.parameter` (line 41 `name={arg.parameter}`, line 73
      `register(arg.parameter)`, line 83 `name={arg.parameter}`). The compiled Handlebars template
      substitutes by the form data keys — i.e. by `arg.parameter`. So the operator reads a label
      derived from `arg.name` but is populating the template variable `arg.parameter`. When the
      manifest author sets name == parameter (or name is a human-friendly synonym of the same
      concept) this is invisible and harmless — the intended pattern (a friendly label over a
      template key). When name and parameter diverge in meaning, the operator's mental model
      ("I am setting <name>") is mismatched against what the template receives. This is a
      name-vs-key divergence that is correct-by-convention but undisclosed, hence partial.
    evidence:
      - sidecar: "(unresolved — source_read_for_validation)"
        section: render
        cite: "IntegrationCodeSnippetWithForm.tsx:41, 60, 73, 83, 95"
        note: "label=arg.name; form key + Handlebars substitution=arg.parameter"
    operator_visible_failure: |-
      Mostly benign (the friendly-label-over-key pattern is normal). The failure surfaces only if
      a manifest author authors a label (arg.name) that does not correspond to the template
      variable (arg.parameter) — the operator then believes they configured X while the snippet
      received the value under a differently-named key. There is no on-screen disclosure of the
      underlying parameter key, so an operator debugging a mis-substituted snippet cannot see the
      mapping from the form alone. This is a manifest-authoring caveat, not a code defect.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional
  sme_consultation_recommended: false

