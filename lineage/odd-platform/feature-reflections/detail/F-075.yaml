# User-Owner Association (POST /api/owner_association_request) — product-owner reflection

## product_owner_narrative

The **User-Owner Association** feature is how an authenticated platform user becomes
linked to a catalog-side **Owner** directory entry, so that owner-scoped behaviours —
"My Objects", owner-filtered alerts, ownership badges, and ownership-conditioned RBAC
policies — can resolve for that user (per the OwnerAssociationRequestController sidecar
`understanding`, and the live `/authorization/owners` doc: "Every ODD Platform user
should associate themselves with one of the existing owners"). It is a P-08 Management
capability that straddles into P-09 Security: the *act* of association is a Management
workflow, but the resulting `user_owner_mapping` row is what P-09's authorization graph
reads to decide what a user can do.

A user interacts with it by submitting their chosen owner name on a self-request form and
pressing "Send request" (per WebFetch `/authorization/user-owner-association`). The
request POSTs to `/api/owner_association_request` (the controller delegates to
`OwnerAssociationRequestServiceImpl.createOwnerAssociationRequest` at
`OwnerAssociationRequestServiceImpl.java:54`). In the documented happy path the request is
recorded as PENDING and an operator with `OWNER_ASSOCIATION_MANAGE` approves or declines it
from the Management → Associations triage inbox (the `new`/`history`/`active` sub-tabs per
the managementRoutes sidecar; the operator side is F-171). On approval the service writes
the `user_owner_mapping` row (`OwnerAssociationRequestServiceImpl.java:184-190`) plus a
`REQUEST_APPROVED` audit row in the dedicated `owner_association_request_activity` table —
so "who approved whom, when" is forensically recoverable (per the F-006 coherence note: this
workflow is the *positive* half of the platform's 2-tier audit story).

The working parts that a product owner would demo: a **name-only self-request** (the user
types an owner name, not picks from a closed list); an **Admin approve/decline** with a
typed activity trail; and — the part absent from every demo and every doc page — a
**`DIRECT_OWNER_SYNC` auto-approve branch** (`OwnerAssociationRequestServiceImpl.java:60-67`).
If the requesting user holds the `DIRECT_OWNER_SYNC` MANAGEMENT permission, the request is
approved *synchronously, in the same call* — `userOwnerMappingService.createRelation(...)`
fires and the response is a pre-approved request; no Admin click ever happens. The design
intent (per the controller sidecar `implicit_adrs[2]`, confidence MEDIUM) is a "trust the
IdP" deployment: an OIDC group claim maps a user to an owner and the platform should not
make them queue for manual approval. The load-bearing gap this reflection exists to surface
is that the implementation checks *the permission alone* — it never verifies the OIDC group
mapping the design assumes — and it composes with a second behaviour.

That second behaviour is the **`OwnerService.getOrCreate` side-door**
(`OwnerServiceImpl.java:38-42`): a `getByName(...).switchIfEmpty(create(...))` with no
`OWNER_CREATE` permission check. The association flow calls it *unconditionally* at
`OwnerAssociationRequestServiceImpl.java:57` — before the permission branch — so a
never-seen owner name is minted into the directory whether or not the user is auto-approved.
The mint half is already tracked as PLT-132 (the Owner-side `getOrCreate` side-door, sibling
to the TERM/NAMESPACE side-doors of PLT-101). What F-075 contributes is the *composition*:
DIRECT_OWNER_SYNC + getOrCreate = a single authenticated call in which a user mints an Owner
they just named and binds themselves to it, becoming the principal for any
`dataEntity:owner == 'X'` policy on that owner — a complete self-mint-then-self-bind chain
(per the controller sidecar `security.known_security_gaps[3]`, severity HIGH, and the
feature-flow facet `self_mint_then_self_bind_privilege_chain_via_direct_owner_sync`).

Edge cases a careful product owner would flag in a demo: under `auth.type=DISABLED` the flow
is *fail-closed* (the service throws `RuntimeException("There is no current authorization")`
at line 56 — unlike the Owner-CRUD surface which runs anonymously); the self-request POST has
NO `SecurityConstants.SECURITY_RULES` entry so any *authenticated* user reaches it (pinned by
`AdrSecurityRulesContractTest` — exactly one GET rule, no POST rule); the Owner mint emits no
`@ActivityLog` so the *mint* itself is audit-silent even though the *request* is recorded; and
the feature's submitter-side UI surface (the self-request form) is NOT in the reviewed
Management/OwnerAssociations subtree — it lives in an identity/profile cluster not yet
enriched, so this reflection cannot judge what the user sees on screen.

