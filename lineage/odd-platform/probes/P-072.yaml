  - kind: sql
    query: |
      -- 10 datasources; exactly 2 share the 'alpha-' name prefix
      INSERT INTO data_source (id, name, oddrn, description, created_at) VALUES
        (7201, 'alpha-one',   '//p072-source/datasource/7201', 'probe P-072', NOW()),
        (7202, 'alpha-two',   '//p072-source/datasource/7202', 'probe P-072', NOW()),
