behaviour: |-
  **HIGH — MimeMessageHelper constructed WITHOUT charset; non-ASCII alert content mangled on containerised deployments.** `EmailNotificationSender.java:47` constructs `new MimeMessageHelper(mimeMessage)` (1-arg constructor) — defaulting to the JVM's default charset. Spring's `MimeMessageHelper` offers 2-arg `(mimeMessage, encoding)` and 3-arg constructors that take an encoding string; **neither is used**.

  **Containerised-deployment impact**:
  - Minimal Linux containers (alpine, distroless, slim variants) ship with `LANG=C` / `LC_ALL=C` by default — the JVM picks up US-ASCII as the default charset.
  - On such a deployment, an alert payload containing non-ASCII characters (e.g. a data entity name `bestellungen_2024` is fine, but `customers_de_2024_§3_§4` or a Russian / Japanese / Korean / Chinese / Arabic dataset name) is **mangled in the email body**: non-ASCII bytes become `?` or U+FFFD replacement characters.
  - The live doc documents the workaround: set `JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8` — but this is a JVM-level workaround that affects **every** charset-sensitive code path in the platform, not just notifications. Operators have no per-notification-charset knob.

  **The fix is one line** (`new MimeMessageHelper(mimeMessage, StandardCharsets.UTF_8.name())`) — but the absence of this is silent: a developer testing on a Mac (UTF-8 default) sees the bug only when deploying to alpine. The bug surfaces in operator-facing emails, in the recipient's inbox, at a time when the alert content matters most.

  **Why HIGH** (sidecar rates MEDIUM):
  - The bug is **silent on developer machines** (most have UTF-8 defaults).
  - The bug is **active in containerised deployments** (the most common production deployment shape).
  - The bug affects **operator-facing communications** — emails read at incident time.
  - Fix is one line; cost of not fixing is operator-readability of every alert containing non-ASCII data entity attributes.

  **Compares to TEST-GAP-456** (RuntimeException bypass): TEST-GAP-456 covers the exception-handling asymmetry; this gap covers the charset-handling asymmetry. Both are silent-on-developer-machine code-side defects in `EmailNotificationSender`.

  **Test gap shape**: regression-pin asserting that the rendered email body preserves non-ASCII characters when the JVM default charset is non-UTF-8. PINS the current vulnerability; pairs with REFACTOR-NNN setting UTF-8 explicitly.
