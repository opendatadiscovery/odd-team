behaviour: |-
  **No HTTP-level integration test exists for ANY of the 7 endpoints on
  SearchController (POST /api/search, GET /api/search/{id}, PUT
  /api/search/{id}, GET /api/search/{id}/results, GET
  /api/search/{id}/facet/{type}, GET /api/search/suggestions, GET
  /api/search/{id}/data_entities/{de_id}/highlights).** The only existing
  search tests are two Playwright UI specs (tests/features/search/*.spec.ts)
  that drive the entire UI end-to-end and do NOT pin individual HTTP
  contract behaviour. A regression in OpenAPI routing, WebFlux config,
  Jackson serialisation, jOOQ FTS, the highlighting SQL, the facet
  aggregators, or the session-row CRUD would not be caught by the build.

  The architectural cost: this is the seven-endpoint surface of one of
  ODD's primary user-facing features (catalog search). Five of seven
  endpoints (all except `search` and `getSearchSuggestions`) are keyed by
  a `searchId` UUID — a bearer-token shape (TEST-GAP-252). The whole
  surface has zero JVM-side coverage. A round-trip integration test
  spanning all seven endpoints would simultaneously catch (a) the
  hasNext-always-true contract bug (TEST-GAP-947), (b) the bearer-token
  cross-user-access regression (TEST-GAP-252 STRENGTHENED), (c) OpenAPI
  routing drift, (d) Jackson serialisation drift, (e) the tsquery
  injection class (TEST-GAP-250 / TEST-GAP-946 preconditions). One test
  class with seven WebTestClient calls covers the entire surface; the
  per-finding STRENGTHENS gaps narrow the assertion shape inside that
  class.
