      - sidecar: WebFetch
        section: management doc
        cite: "https://docs.opendatadiscovery.org/features/management (2026-06-03, status 200)"
        note: "responsive/mobile support absent from the page — not adaptive AND not documented desktop-only."
    operator_visible_failure: |-
      (1) An operator working on a laptop split-pane (browser beside collector logs)
