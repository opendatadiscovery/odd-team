chain:
- hop: 1
  node: odd-platform ts react-component:SearchResultsTabs
  sidecar: unresolved
  evidence: |-
    SearchResultsTabs.tsx:22-64 — `useEffect([totals])` synchronously
    builds the 9-tab array. Each tab carries `{name, hint, value}`.
    value is mixed: `'all'` (string), `'my'` (string), and
    `totals[DataEntityClassNameEnum.SET]?.id` (number — backend class id).
    The setTabs is called on EVERY totals change — no memoization on the
    tab structure.
  multiplicity_per_trigger: 1
  unresolved: false
- hop: 2
  node: odd-platform ts react-component:Results
  sidecar: unresolved
  evidence: |-
    Results.tsx:83-100 — `onSearchClassChange(tabValue)` does
    `newSearchClass = tabValue ? get(dataEntityClassesDict, tabValue) : null`;
    `facetOptionId = newSearchClass?.id ?? tabValue`. For class-id tabs
    the lookup succeeds + facetOptionId is numeric. For 'all' / 'my'
    string tabs, `get(dataEntityClassesDict, 'my')` returns undefined +
    facetOptionId falls through to `tabValue` (the string 'all' or 'my').
    Dispatch: `changeDataEntitySearchFacet({facetName:'entityClasses',
    facetOptionId, facetOptionName, facetOptionState:true,
    facetSingle:true})`.
  multiplicity_per_trigger: 1
  unresolved: false
- hop: 3
  node: odd-platform ts redux-slice:dataEntitySearch.slice (changeDataEntitySearchFacet reducer)
  sidecar: unresolved
  evidence: |-
    The reducer body is NOT read in this slice (out of scope —
    components/Search/* only). The dispatch payload includes
    `facetOptionId` as either a number (class id) or string ('all' / 'my')
    — the reducer's normalisation behaviour is unverified.
  multiplicity_per_trigger: 1
  unresolved: true
  unresolved_reason: |-
    redux/slices/dataEntitySearch.slice is out of slice E scope.
    Walk needed to resolve how 'all' / 'my' string facetOptionId values
    flow into FacetStateDto.entityClasses (which is an array of numeric
    class IDs per openapi.yaml) and whether the slice also flips the
    FacetStateDto.myObjects boolean.
- hop: 4
  node: F-017 backend chain (updateDataEntitiesSearch thunk →
    PUT /api/search/{id}/facets → SearchServiceImpl.updateFacets →
    ReactiveSearchFacetRepositoryImpl)
  sidecar: F-017.yaml
  evidence: |-
    Per F-017's resolved chain — the PUT /facets call carries the
    FacetStateDto with entityClasses + myObjects fields. The string-
    sentinel passthrough (if it happens) reaches the backend; the
    consequence at the SQL aggregator layer depends on how the field
    is deserialised + how the SQL CASE statements handle the mismatched
    type.
  multiplicity_per_trigger: 1
  unresolved: false
