amplification_factor: 2
amplification_factor_provenance: FULLY MEASURED end-to-end — P-004 (run R-20260519T010758Z-P-004)
  observed xhr_count=2 AND view_count delta=2 in a single UI page-open via headless
  Chromium. The full chain product is empirically confirmed. LSN-017's headline (`opening
  a detail page registers as +2 views`) is no longer inferred — it is the measured
  truth.
observed_vs_expected:
  facets:
  - facet: backend per-call delta
    observed: +1 view_count per GET /api/dataentities/{id}
    expected: +1 (matches intent)
    drift_class: null
    provenance: MEASURED — P-001 ran 5 sequential GETs; observed final_view_count
      - initial_view_count = 5 (run R-20260519T003701Z-P-001)
  - facet: UI page-open delta
    observed: +2 view_count per page-open; UI fires 2 sequential GET /api/dataentities/{id}
      per mount
    expected: +1 per logical page-open (per the operator-facing UX intent)
    drift_class: ui_amplification
    provenance: MEASURED — P-004 (run R-20260519T010758Z-P-004) launched headless
      Chromium, navigated to /dataentities/1004, observed xhr_count=2 (regex-filtered
      to exact `/api/dataentities/1004` matches) AND view_count delta=2. LSN-017's
      headline empirically proven; fix would flip xhr_count to 1 + delta to 1.
  - facet: anonymous reachability under DISABLED
    observed: anonymous caller successfully fetches detail AND increments view_count;
      10 anon calls → +10 view_count
    expected: either documented anonymous-OK posture OR 401/403
    drift_class: disabled_mode_bypass
    provenance: MEASURED — P-002 ran 10 unauthenticated GETs against probe-stack with
      AUTH_TYPE=DISABLED; observed final_view_count - initial_view_count = 10 (run
      R-20260519T003811Z-P-002)
  - facet: detail-read latency baseline (small seed, single entity)
    observed: p50=106ms, p95=202ms, p99=1539ms (50 calls; the p99 outlier is JIT/warmup
      on the first call)
    expected: establish a baseline; bound is empirical, not documented
    drift_class: null
    provenance: MEASURED — P-003 ran 50 sequential GETs against :latest image (run
      R-20260519T003916Z-P-003)
  surfaced_by:
  - lineage/odd-platform/understanding/odd-platform__java__DataEntityController__controller-method__getDataEntityDetails.md
