use_case_coverage:
  verified: 7
  total: 12
  note: |-
    SECOND COVERAGE FRONTIER (verified promises / total promises) — distinct from
    line/method coverage and from the test_matrix cells. 2/12 promises are verified
    (UC-1 stats-render-on-Structure-tab, UC-9 INTERNAL-tag-survives-ingest — both
    pinned by the service test DatasetFieldIngestionTest.externalStatisticsTagStateIngestionTest).
    The other 10 are unverified: 7 contradicted (UC-2 cross-dataset write, UC-3
    unauthenticated, UC-4 unaudited, UC-6 tag-mint side-channel, UC-7 silent tag
    destruction, UC-10 silent-drop-unknown-ODDRN, UC-12 FTS-on-lying-parent), 2
    partial (UC-5 numeric validity, UC-11 empty/null body), 1 probe-needed (UC-8
    concurrent reconcile). A user-facing WRITE surface sitting at 2/12 verified
    promises — where 6 of the 7 contradictions are security/destruction failures
    (UC-2/3/4/6/7/12; UC-10 is a silent-success correctness failure) and NONE has a
    regression guard — is itself the headline finding. The two HIGHEST-severity
    contradictions (UC-2 cross-dataset write, UC-3 unauthenticated) are tracked as
    PLT-106 but have no test; their missing-functional demands ARE the regression
    guards for PLT-106's eventual fix.

