name: entity_oddrn label trusted verbatim from unauthenticated AlertManager webhook
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19I (AlertServiceImpl sidecar)** —
  the AlertManager webhook path (`AlertServiceImpl.handleExternalAlerts`, line 178)
  reads `externalAlert.getLabels().get("entity_oddrn")` and assigns it to `setDataEntityOddrn`
  DIRECTLY, with no validation against the calling principal (there is none — the
  webhook endpoint is on the `/ingestion/**` whitelist, batch-A finding) and no
  validation against the data-entity registry (no existence check, no ODDRN shape
  validation, no ownership check). Combined with the unauthenticated endpoint (`/ingestion/alert/alertmanager`
  is in the `/ingestion/**` Spring Security whitelist AND is NOT covered by `IngestionDataEntitiesFilter`
  which only matches `/ingestion/entities` POST), any caller with network reach
  to the platform can POST AlertManager-shaped payloads naming arbitrary data-entity
  ODDRNs. **Three concrete surfaces**: (1) **SPOOF**: an attacker who knows or
  guesses a data-entity ODDRN can create arbitrary `DISTRIBUTION_ANOMALY` alerts
  on it (the type is hardcoded — line 177); (2) **ORPHAN**: a payload with `labels`
  missing `entity_oddrn` produces an `AlertPojo` with `dataEntityOddrn=null` —
  the alert is created with a null FK, visible nowhere in the UI but persisted
  (documented on the live AlertManager-integration doc page per batch-F neighbour
  sidecar 2026-05-08 status 200); (3) **XSS/OPEN-REDIRECT vector**: line 168-185
  builds the URL via `UriComponentsBuilder.fromUri(externalAlert.getGeneratorURL())`
  and embeds it verbatim in the chunk description as `String.format("Distribution
  Anomaly. URL: %s", queryUrl)`. The `URI` type does some shape validation but does
  NOT block `javascript:` scheme or arbitrary host URLs. If the UI renders the
  description as a clickable link (or as innerHTML), this is a stored-XSS / open-redirect
  surface — and the endpoint is unauthenticated, so any caller can plant the payload.
  The orphan case is documented; the spoof case is NOT; the XSS surface depends
  on UI rendering layer (out of scope for this file). **Severity**: HIGH (spoof
  + XSS) / MEDIUM (orphan documented). The fix is multi-layered: (a) require S2S
  authentication on the AlertManager webhook (extend `IngestionDataEntitiesFilter`''s
  path match or wire a sibling filter); (b) validate `entity_oddrn` against the
  `data_entity` table and reject the payload if absent; (c) escape the generator
  URL when embedding in chunk descriptions, and validate the UI rendering layer
  uses `rehype-sanitize` (cross-ref `markdown-rendering-pipeline-rehype-raw-without-rehype-sanitize`
  invariant).'
