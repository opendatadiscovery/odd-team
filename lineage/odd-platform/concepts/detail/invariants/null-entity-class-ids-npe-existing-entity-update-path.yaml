mitigations_unimplemented:
- |-
  Code-side: add an explicit guard at line 142-143 — if
  `ingestionDtoMap.get(d.getOddrn())` returns null, log.error and
  throw a domain-specific exception (e.g.
  `IngestionPipelineConsistencyException`) instead of letting null
  propagate downstream. Surfaces the DB-trigger-rewriting-ODDRN
  scenario explicitly.
- |-
  Code-side: add a corresponding guard at calculateTotalDeltaCount —
  same shape, log.warn at the null-entity-class-ids branch BEFORE
  the existing skip-branch logic. Surfaces the legacy-row scenario
  for operator awareness.
- |-
  Test-side: add a unit test pinning the current null-tolerant
  behaviour at calculateTotalDeltaCount (existing null entityClassIds
  → no NPE, no decrement) — the test locks the defensive guard in
  place against future refactors that might inadvertently remove it.
