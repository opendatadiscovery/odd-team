control_summary: |-
  2 of 4 cells PROBED+EXISTING — integration (PROBED-PINNING-BUG for
  default-depth + EXISTING for happy-path tree). 6 uncovered behaviours newly
  surfaced by batch-H primary-source SQL audit
  (cycle/diamond/soft-delete/empty()/owner-anchor-pattern). Batch-H adds the
  resolved chain hop for the recursive CTE + folds in REFACTOR-202 +
  REFACTOR-203 primary-source confirmation + surfaces the
  anchor-set-defence-in-depth pattern as a NEW drift_class. Batch-I closes
  the negative-case half of the anchor-set pattern PRIMARY-SOURCE at the
  service tier (LineageServiceImpl.java:54-57 no AuthIdentityProvider field,
  87-122 no fetchAssociatedOwner call) AND adds the no-upper-bound-check
  service-tier facet (line 96 hands raw int to repo) AND surfaces the
  DEG-lineage inner-DEG suppression carve-out (line 71 comment). Batch-J
  adds the UI HALF PRIMARY-SOURCE CONFIRMED: the lineage canvas
  (`Lineage.tsx` → `HierarchyLineage` → `LineageProvider` → `Zoom` →
  `ZoomableLineage` → `LineageGraph`) ALWAYS fetches via the
  anchor-set-undefended endpoints (`/api/dataentities/{id}/lineage/{down,up}stream`)
  — never the `/my/{down,up}stream` anchor-set-defended endpoints used by
  DataEntityRelationsServiceImpl. The UI is the user-observable realisation
  point of REFACTOR-203. ALSO: d3-hierarchy renders diamond-DAG duplicates
  (REFACTOR-202 amplified into the visual layer); the UI hardcodes `d=1`
  default which silently masks the F-005 NPE caveat; the URL `?d=` has NO
  upper bound + the depth slider exposes [1..20] but the URL accepts ANY
  integer; LoadMore monotonic accumulation has no collapse affordance;
  click-through on a node title compounds depth (`d = node.depth`). FIVE
  new UI-axis drift facets + ZERO unit/integration tests at any layer of
  the UI tree. Batch M adds the DEG-anchored variant cross-reference
  via getDataEntityGroupsLineage primary-source: the read-collaborative
  posture extends to DEG-anchored reads with a STRICTLY WIDER blast
  radius (DEGs commonly span owner boundaries — the inter-member edges
  ARE the cross-owner lineage). The DEG-anchored variant is captured
  as F-016 (P-05:F-002 DEG-Anchored Lineage) — distinct feature_id
  because the chain, SQL overload, 404-conflation, inner-DEG carve-out,
  and per-component partitioning are DEG-specific. One new drift facet
  (co_membership_leakage) added here so a reader of F-005 finds the
  DEG variant via cross-link.

  Batch W adds the DatasetController controller-class PRIMARY-SOURCE
  for THREE new drift facets extending the F-005 cross-owner enumeration
  + per-entity-scoping-bypass class to the DATASET STRUCTURE surface:
  (1) `getDataSetStructureByVersionId(dataEntityId, versionId)` IGNORES
  the `data_entity_id` URL parameter — the SQL filters
  `WHERE DATASET_VERSION.ID = datasetVersionId` only
  (ReactiveDatasetVersionRepositoryImpl.java:129); a request to
  `GET /api/datasets/{any_id}/structure/{valid_version_id_for_other_dataset}`
  returns the OTHER dataset's structure. (2) `getDataSetStructureDiff`
  similarly ignores the `data_entity_id` — the SQL filters
  `WHERE DATASET_VERSION.ID IN (firstVersionId, secondVersionId)`
  only (line 154); a caller may diff two version_ids belonging to
  two DIFFERENT datasets and receive a well-formed but cross-dataset
  diff. (3) NO SecurityRule entry exists for any
  `/api/datasets/{data_entity_id}/structure/*` or
  `/api/datasets/{data_entity_id}/relationships` path
  (SecurityConstants.java:98-355 verified — only
  `/api/datasets/{data_entity_id}/dataqatests/{dataqa_test_id}/severity PUT`
  is gated); reads fall through to global authentication-only. The
  F-005 cross-owner enumeration class extends from LINEAGE GRAPH
  EDGES to DATASET STRUCTURE + SCHEMA HISTORY + RELATIONSHIPS — three
  additional read surfaces with the same read-collaborative posture.
  The dataset-relationships endpoint `GET /api/datasets/{id}/relationships`
  is in the spec at openapi.yaml:1810-1826 but is NOT documented at
  the live API-reference Relationships sub-page (WebFetched 2026-05-20
  status 200 — explicitly omitted). NEW drift facets for F-005:
  `dataset_structure_by_version_id_ignores_data_entity_id_url_parameter`,
  `dataset_structure_diff_ignores_data_entity_id_url_parameter_cross_dataset_diff`,
  `dataset_structure_endpoints_no_security_rule_cross_owner_read_extension`,
  `dataset_structure_diff_500_on_missing_version_id_not_404_inconsistent_error_contract`,
  `dataset_diff_parent_field_cascade_delete_create_amplification_undocumented`.
