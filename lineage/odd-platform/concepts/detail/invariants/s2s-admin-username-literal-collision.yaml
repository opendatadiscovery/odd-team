mitigations_unimplemented:
- |-
  Replace the hardcoded `"ADMIN"` username in S2sAuthenticationFilter.java:31
  with a sentinel literal that cannot collide (e.g.
  `"__s2s_principal_" + UUID.randomUUID()` per filter instance, or a
  compile-time constant like `"__S2S_PRINCIPAL__"` that is BANNED from
  human-user creation by adding a validator on OwnerAssociationRequest /
  Owner / User-creation paths).
- |-
  Override AuthIdentityProvider.fetchAssociatedOwner to detect S2S-shape
  authentications (e.g. inspect the Authentication.getDetails() or
  authorities containing a distinct S2S marker) and short-circuit to
  Mono.empty() — S2S callers do NOT need an owner-link because the S2S
  role is ADMIN.
- |-
  Add a startup-time validator that fails fast if any user_owner_mapping
  row has oidc_username='ADMIN' AND provider IS NULL — operator-deployment
  hygiene check.
- |-
  Add a regression test that:
    (a) inserts a LOGIN_FORM user named 'ADMIN' with provider=null and
        an active user_owner_mapping row;
    (b) invokes an S2S-authenticated request to an owner-scoped endpoint;
    (c) asserts the S2S caller does NOT resolve to that operator's Owner.
- |-
  Document the literal on the
  `/configuration-and-deployment/enable-security/authentication` or S2S
  page — warn operators against naming users 'ADMIN' (uppercase) until
  the code-fix lands.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-19K. The risk is
  doubly latent: (a) it only triggers on operator-naming collision; (b)
  it only triggers on case-sensitive exact match. Operators who do not
  name a user 'ADMIN' are not vulnerable today. But the failure mode is
  invisible — there is no log line, no metric, no audit event when the
  collision fires; the S2S caller silently inherits the operator user's
  owner-link.

  This finding is the third member of the AuthIdentityProviderImpl
  security cluster (the other two are the LOGIN_FORM/LDAP cross-mode
  bleed via provider=null AND the no-auto-create-on-first-login gap).
  All three were latent prior to batch K; this batch's primary-source
  enrichment surfaced them via the explicit instanceof check on line
  29 + the verbatim literal on S2sAuthenticationFilter.java:31.

  Cross-cutting connections:
    - Pairs with the "AuthIdentityProvider (per-request principal
      resolution chokepoint)" entity concept — this is one of the
      entity's load-bearing security gaps
    - Pairs with the "LOGIN_FORM/LDAP cross-mode bleed via provider=null"
      invariant (also surfaced by batch K) — both rely on the same
      else-branch at line 32 collapsing non-OAuth2 auth into
      provider=null
    - Companion of the "user_owner_mapping is the gate for owner-scoped
      views" invariant — the gate's input parameters (username, provider)
      are the surface of this bug

  Three DOC-NNN candidates flow from this invariant:
    (a) Code fix — replace the hardcoded literal (highest priority)
    (b) Docs warning on the S2S auth page (mitigation while code fix
        lands)
    (c) Startup-time hygiene validator (defence-in-depth)
