name: PUT /api/owners empty-roles silently deletes all role bindings (STRENGTHENED batch Q — UI-tier reachability)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-08
description: |-
  **NEW HIGH-SEVERITY BUG-CLASS INVARIANT, batch 2026-05-20-P** —
  PRIMARY-SOURCE confirmed at `OwnerServiceImpl.java:71, 76-81, 117-122`.
  An API caller (script, integration, malformed UI request) who omits
  the `roles` field on `PUT /api/owners/{owner_id}` — reasonably
  expecting "don't touch roles" semantics — instead SILENTLY STRIPS
  ALL role bindings from the Owner. The form's `roles` field is
  treated as REPLACE-NULL-WITH-EMPTY, not as IGNORE-IF-OMITTED.

  **The mechanism**:

    1. `OwnerFormData.roles` is OpenAPI-optional (`components.yaml:419-422`;
       `requiredMode` not declared; no `required` marker on the field).

    2. `getRoleIdsList` (`OwnerServiceImpl.java:117-122`) collapses
       BOTH null `roles` and EMPTY list `roles: []` to `List.of()`:
       ```
       private List<Long> getRoleIdsList(final OwnerFormData formData) {
         if (CollectionUtils.isEmpty(formData.getRoles())) {
           return List.of();
         }
         ...
       }
       ```

    3. The update transaction calls
       `deleteOwnerRelationsExcept(ownerId, List.of()).then(createRelations(ownerId, List.of()))`
       (`OwnerServiceImpl.java:76-81`):
        - The first half `deleteOwnerRelationsExcept(ownerId, List.of())`
          issues `DELETE FROM owner_to_role WHERE owner_id = ? AND
          role_id NOT IN ()` — Postgres handles the empty-NOT-IN as
          always-true, so ALL existing role-links are deleted.
        - The second half `createRelations(ownerId, List.of())` inserts
          nothing.

  **The destructive consequence**: an Owner who had role bindings
  `[ADMIN, MANAGER]` before the PUT call (with the body omitting
  `roles`) now has `[]` — completely role-stripped. The next
  authorization-resolution call for any USER_OWNER_MAPPING-bound
  user resolves to ZERO Policies → effectively no permissions.

  **Batch-P claim about UI masking the hazard — REFUTED in batch Q**:
  the batch-P invariant text claimed "the UI in practice always sends
  the current `roles` list (`owners.thunks.ts` per UI source code) —
  it loads the Owner, lets the user edit the name + role checkboxes,
  and PUTs back the COMPLETE state. So the hazard is invisible in
  normal UI flows." **Batch Q's OwnersList sidecar REFUTES this**:
  the OwnerForm dialog allows the operator to REMOVE every role
  TagItem via the X-icon (`OwnerForm.tsx:101 onRemoveClick={handleRemove(idx)}`).
  The `roles` field has NO validation. The Save button remains enabled.
  Submission dispatches `updateOwner({ ownerId, ownerFormData })` with
  `roles: []` — which is exactly the destructive payload. The UI is
  NOT a defence; it is a 3-click trigger. See the new sibling
  invariant
  `destructive-empty-roles-update-reachable-from-ui-three-clicks-no-confirmation`.

  **Why API consumers hit the hazard**: a script that wants to rename
  an Owner without touching roles will reasonably PUT
  `{ name: "newname" }` (omitting `roles`). The platform interprets
  that as "rename + strip all roles". There is NO confirmation step,
  NO 'are you sure' check, NO partial-update mechanism, NO PATCH
  endpoint. Combined with the `no-audit-log-on-rbac-mutations`
  invariant — role-stripping is silent AND irreversible from logs.

  **The contract design defence**: per REST semantics, PUT is canonical
  full-replace. The contract's behaviour is internally consistent.
  But the OpenAPI contract carries `roles` as OPTIONAL (the marker is
  absent in `components.yaml:419-422`), which is the BUG: optional
  in the schema, destructive in the implementation. Either:
    (a) mark `roles` as REQUIRED in the contract (the implementation's
        actual semantics — at least operators reading the OpenAPI spec
        learn the field cannot be omitted); OR
    (b) introduce a PATCH endpoint for partial updates; OR
    (c) interpret omitted/null roles as "preserve" (would break PUT
        REST canon but match operator expectations).

  **Severity**: HIGH — destructive-default UX hazard; silent;
  irreversible from audit; not surfaced anywhere in the live docs;
  the live permissions page describes `OWNER_UPDATE` as 'Allows
  editing an existing owner' with no caveat about role-binding
  destruction.

  **BATCH Q EXTENSION — UI-TIER REACHABILITY ELEVATES THE SEVERITY**:
  the OwnersList sidecar confirms the destructive default is reachable
  from operator UI in three clicks (Edit Owner → remove all role
  TagItems → Save). The OwnerForm has no validation on `roles`; Save
  remains enabled because formState.isValid only checks `name`. The
  asymmetry: DELETE-Owner has a confirmation modal; UPDATE-with-empty-
  roles (more destructive) does not. See sibling invariant
  `destructive-empty-roles-update-reachable-from-ui-three-clicks-no-confirmation`
  for the full operator-facing reachability analysis.
