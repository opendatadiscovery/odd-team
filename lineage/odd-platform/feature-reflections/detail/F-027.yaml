- id: H-005
  hypothesis: "When a user holds DATA_ENTITY_ATTACHMENT_MANAGE on data entity A but NOT on data entity B, and they issue DELETE /api/dataentities/{A}/files/{file_id_of_B}, the platform rejects the request and B's file survives — the per-entity authorization grant confines mutations to the entity it was granted on."
  derivation: "Pillar mission anchor (P-09 RBAC is per-data-entity) + cross-layer naming drift (path dataEntityId vs service fileId) — the URL hierarchy promises entity scoping; does the implementation honour it?"
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The hierarchical URL (/api/dataentities/{data_entity_id}/files/{file_id}) is layout-only. The
      controller binds dataEntityId from the path but DISCARDS it; deleteFile / updateLink / deleteLink
      / completeFileUpload / downloadFile pass only fileId / linkId to the service
      (AttachmentServiceImpl.java:71-88). The SecurityRule gate evaluates DATA_ENTITY_ATTACHMENT_MANAGE
      in DATA_ENTITY context against the URL's dataEntityId (A — which the caller IS authorized on), so
      the gate passes; but the mutation lands on file_id (B's file). No service-tier check verifies the
      file/link belongs to the URL's data entity. A user authorized on ANY single entity can therefore
      delete, update, download, or complete files+links on EVERY entity in the catalog by spoofing the
      URL prefix. This is the LSN-020 / Category-F cross-layer drift shape (path-name promises entity
      scope; implementation keys on a different identifier). The live feature page now names it
      ("users with this permission on one entity can reportedly mutate attachments on other entities by
      targeting file IDs" — WebFetch 2026-06-01).
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: security.known_security_gaps[1] + security.owner_scoping + implicit_adrs[6]
        cite: "DataEntityAttachmentController.java:83-88,100-107,110-114 + AttachmentServiceImpl.java:71-88 + SecurityConstants.java:248"
        note: "owner_scoping: BYPASSES — gate on path entity, mutation on fileId; cross-entity privilege escalation."
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-method__uploadFileChunk
        section: bugs_limitations_corner_cases[2]
        cite: "FileServiceImpl.java:93-102 + SecurityConstants.java:247-251"
        note: "Chunk-path sibling: checkProcessingUploadById resolves by uploadId only; gate evaluates path entity — same misalignment for the upload-in-progress case."
    operator_visible_failure: |
      (1) Cross-entity privilege escalation: any user with attachment-manage on a single low-value
      entity can DELETE attachments on every other entity — a one-permission grant becomes
      catalog-wide write access to the attachment surface. (2) Cross-entity tamper: updateLink lets the
      same user repoint another entity's runbook link to an attacker-controlled URL. (3) Cross-entity
      data theft: downloadFile (already world-readable per H-004) compounds — but even if the read gap
      were fixed, the URL-spoof would still let a manage-on-A user pull B's files. (4) Silent: there is
      no audit log on any of these mutations (H-013), so the escalation leaves no application-side
      trace. This is the highest-severity finding in the feature.
    severity: HIGH
    confidence: HIGH
    probe_id: PENDING-F-027-1
    use_case_kind: cross-actor
    coverage: unverified   # integration test_matrix lists "DELETE /api/dataentities/{A}/files/{file_id_of_B} + assert SUCCESS (pin the cross-entity bug)" as uncovered; no pin exists.
    test_ref: null
    test_demand: functional
    routes_to_finding: bug-candidate   # PLT-086 Defect 1 + functional-test-demand (the regression guard for the belongs-to fix)

- id: H-006
  hypothesis: "When a user adds a link via POST /api/dataentities/{id}/links with a URL field, the platform validates that it is a real, safe web URL (http/https) — a javascript: or data: URI is rejected rather than stored and later rendered."
  derivation: "Endpoint-shape (DataEntityLinkFormData.url) + cross-pillar promise (F-004 stored-XSS family) — a 'link' control promises a navigable URL, not arbitrary script."
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      saveLinks and updateLink accept DataEntityLinkFormData.url with NO validation — the OpenAPI schema
      has no format/pattern (components.yaml:2482-2491), there is no @URL constraint, no scheme allowlist,
      no length cap. LinkServiceImpl stores the raw value via the mapper (bulk-create and update both pass
      formData straight through). A link with a javascript: or data: scheme is stored verbatim; whether it
      executes is decided by the UI rendering contract (out of this chain — F-004), but the storage layer
      offers no defence. This is the same stored-XSS class as F-004's description-field family, on the
      dedicated link surface. NOTE: AttachmentLinkSchemeKnownBugTest (@pins PLT-086) pins exactly this
      absence — it asserts LinkServiceImpl + LinkMapper contain no scheme guard today, GREEN while broken;
      it pins the BUG, it does NOT verify the promise.
    evidence:
      - sidecar: odd-platform__java__DataEntityAttachmentController__controller-class__DataEntityAttachmentController
        section: bugs_limitations_corner_cases[7] + security.known_security_gaps[4]
        cite: "components.yaml:2482-2491 + LinkServiceImpl.java:31-46 + DataEntityAttachmentController.java:91-114"
        note: "Link URL stored raw; no scheme allowlist; javascript:/data: storable — cross-reference F-004."
      - sidecar: "(test, source_read_for_validation)"
        section: "AttachmentLinkSchemeKnownBugTest.java"
        cite: "odd-platform-api/.../service/attachment/AttachmentLinkSchemeKnownBugTest.java:39-53"
        note: "KNOWN-BUG PIN @pins PLT-086 — pins the broken state (no scheme guard); does not verify the promise."
        source_read_for_validation: true
    operator_visible_failure: |
      (1) Stored XSS: a user with attachment-manage (which, per H-005, is reachable across all entities)
      saves a javascript: link on a widely-viewed entity; if the UI renders the link as a clickable
      anchor with the raw href, any user who clicks it executes attacker script in their authenticated
      session. (2) Phishing/redirect: a data: URI or a look-alike URL can be planted as a "runbook" link.
      The verdict on whether the click actually executes belongs to the F-004 UI render path (absent from
      this chain), but the STORAGE-side contract — "we store whatever string you send as a link" — is the
      contradiction here, and it is independent of the renderer.
    severity: HIGH
    confidence: MEDIUM
    use_case_kind: grammar
    coverage: unverified   # the @pins test guards the BROKEN state, not the promise. The promise (javascript: rejected) is verified only after the fix lands and the pin flips to @regresses.
    test_ref: "AttachmentLinkSchemeKnownBugTest (pins the BUG, not the promise)"
    test_demand: functional
