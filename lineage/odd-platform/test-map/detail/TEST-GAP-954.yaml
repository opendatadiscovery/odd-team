behaviour: |-
  **TWIN-DEFECT class on the `odd.links` operator-configured external-URL
  surface AND on the FOUR HARDCODED links — reverse tabnabbing AND
  URL-scheme passthrough.**

  Batch-ZJ AppInfoMenu sidecar PROMOTES this gap's scope: the
  reverse-tabnabbing surface is NOT limited to operator-configured
  `odd.links` URLs. ALL FIVE Link rendering call sites in
  `AppInfoMenu.tsx` (lines 41, 61, 95, 103, 112 — verified 2026-05-26)
  use `<Link to={...} target='_blank'>` WITHOUT `rel='noopener noreferrer'`.
  The hardcoded four are: (i) GitHub repo link (`appInfo.linkToRepository`),
  (ii) Gitbook documentation (`gitbookLink`), (iii) Slack community
  (`slackLink`), (iv) Product Hunt review (`reviewLink`). Plus (v) the
  N operator-configured `odd.links` entries.

  (1) Reverse tabnabbing: any URL — including the FOUR HARDCODED ones —
  opens with `window.opener` set; the destination page can navigate the
  ODD Platform tab to a phishing page. Realistic threat: a compromised
  Gitbook content or Product Hunt page; severity is non-zero but
  bounded. Bumped to HIGH from MEDIUM because hardcoded external links
  expand the attack surface beyond operator-controlled URLs.

  (2) URL-scheme passthrough: Neither the backend
  (`AdditionalLinkProperties.java:8` — no `@URL` / `@Pattern` constraint
  on the `url` field; no controller validation) nor the UI validates
  the URL scheme. An operator-supplied `javascript:alert(1)` or
  `data:text/html,<script>...</script>` URL is passed unsanitised.
  React 17+ neutralises `javascript:` in <a href>, but `data:text/html`
  and `vbscript:` may still render in some browsers. No allowlist.

  No test pins either defect. Both surface in the UI; both can be
  asserted in a test.
