      Static reading says: under DISABLED, the `/` route is anonymously reachable (no RequireAuth at the component;
      DisabledAuthSecurityConfiguration `.anyExchange().permitAll()`), and the gate correctly HIDES the
      OwnerAssociation/Recommended panel (authType==='DISABLED' → false). But the other four widgets render anonymously
      and each leaks a catalog-shape signal: TopTagsList (the tag taxonomy), Domains (Domain DEG names + child counts),
