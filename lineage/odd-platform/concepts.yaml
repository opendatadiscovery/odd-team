    contributors:
      - "IngestionDataEntitiesFilter@L20: CANONICAL sidecar — `@ConditionalOnProperty(\"auth.ingestion.filter.enabled\", havingValue=\"true\")` is the bean-registration gate; path matcher hard-coded to `POST /ingestion/entities` only (IngestionDataEntitiesFilter.java:28); token comparison is plaintext `String.equals(...)` against the matched datasource's TOKEN row (or fallback to parent collector's TOKEN row)"
      - "Every UI/API surface sidecar: ingestion_filter_relevance: NO — UI/API surface, not ingestion"
      - "AlertManagerController: ingestion_filter_relevance: NO — different path (`/ingestion/alert/alertmanager` is in `/ingestion/**` whitelist namespace but NOT covered by IngestionDataEntitiesFilter)"
      - "regenerateCollectorToken: PRODUCER-side of the filter — endpoint mints/rotates the credential that IngestionDataEntitiesFilter validates via plaintext `.equals(...)` (cross-link: regenerateCollectorToken.implicit_adrs[3] establishes the plaintext-stored-shared-secret stance; IngestionDataEntitiesFilter.java:56 carries it across to the verify-side)"
    evidence:
      - "IngestionDataEntitiesFilter@L20.md:concepts.invariants.[0-4] (conditional registration; default-false in YAML; whitelist on /ingestion/**; AccessDeniedException flow; .equals comparison)"
      - "IngestionDataEntitiesFilter@L20.md:implicit_adrs.[0-3] (opt-in toggle; per-subclass hard-coded matcher; plaintext-equality; mixed conditional vs unconditional subclasses)"
      - "AlertController.md:security.ingestion_filter_relevance"
      - "AlertManagerController.md:security.ingestion_filter_relevance (the asymmetry finding)"
      - "DataEntityController.md:security.ingestion_filter_relevance"
      - "DataEntityAttachmentController.md:security.ingestion_filter_relevance"
      - "regenerateCollectorToken.md:concepts.invariants.[3] (plaintext-equality check; producer-side coupling)"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - S2S
        - DISABLED
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: YES
      authorization_consistency:
        verdict: INCONSISTENT
        detail: "When `auth.ingestion.filter.enabled=true`, callers possessing a valid bearer token for ANY datasource can submit DataEntityList payloads for THAT datasource (per-datasource shared secret). When `auth.ingestion.filter.enabled=false` (the application.yml:48 default), ANY caller able to reach `POST /ingestion/entities` can submit a payload without credentials. The toggle covers ONLY `/ingestion/entities` — sibling `/ingestion/datasources` is covered by the UNCONDITIONAL `IngestionDataSourceFilter`, and `/ingestion/alert/alertmanager` is covered by NO filter and has no @PreAuthorize. ALSO: the SECOND ingestion-related auth filter — `S2sAuthenticationFilter` (gated by `auth.s2s.enabled`, default `false`) — is composed ADDITIVELY into the LOGIN_FORM/OAUTH2/LDAP SecurityWebFilterChain at `SecurityWebFiltersOrder.HTTP_BASIC` and grants ADMIN role across the ENTIRE `/**` surface (not just `/ingestion/entities`) — see Auth Mode security_aggregate for the privilege-escalation pattern. The two filters use different config keys, different headers (`Authorization: Bearer` vs `X-API-Key`), different scope (path-matched vs global), different token sources (per-datasource DB rows vs a single shared `auth.s2s.token`). Operators conflate them."
      owner_scoping:
        verdict: "N/A"
        detail: "Ingestion path is not owner-scoped. The filter authenticates the CALLER (a collector / datasource via shared-secret token) but does not associate the request with an Owner. Token = identity-of-collector, not identity-of-user."
      strengths:
        - "Plaintext-equality is O(1) — bounded cost per ingestion request (no hashing round-trip; the trade-off is documented under 'Collector Token' concept)"
        - "Path matcher per subclass (`new PathPatternParserServerWebExchangeMatcher(...)`) — each filter class names its own path; coupling is discoverable by file name (IngestionDataEntitiesFilter ↔ /ingestion/entities, IngestionDataSourceFilter ↔ /ingestion/datasources)"
        - "Conditional registration is consistent with how every other optional-feature toggle is wired (metrics.export.enabled, housekeeping.enabled, notifications.enabled, datacollaboration.enabled — all carry explicit boolean defaults in YAML)"
      weaknesses:
        - "**Default-off ingestion auth (HIGH severity, LSN-001-class)** — `application.yml:48` ships `auth.ingestion.filter.enabled: false`; IngestionDataEntitiesFilter.java:20 has no `matchIfMissing=true`. Bundled deployment that operator runs unmodified has `POST /ingestion/entities` reachable without any credential check. Live docs (WebFetched 2026-05-10) do not surface this property. Combined with `SecurityConstants.WHITELIST_PATHS` including `/ingestion/**` and every UI security config's `permittedPaths` including `/ingestion/entities`, an attacker reaching the platform's HTTP port can plant arbitrary data entities visible to all users. Cross-references the Auth Mode concept's triangulated insecure-default finding (IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[0])"
        - "**Sibling endpoint coverage gap (HIGH severity)** — the property NAME `auth.ingestion.filter.enabled` reads as 'ingestion is locked down' but the toggle covers ONLY `/ingestion/entities`. `POST /ingestion/alert/alertmanager` (AlertManagerController.java:21) has NO filter coverage and NO `@PreAuthorize`; it is on WHITELIST_PATHS and every auth mode's permitted-paths. An attacker reaching the platform can POST arbitrary external-alert payloads. (IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[3])"
        - "**Plaintext-equality `.equals()` not constant-time (MEDIUM severity)** — IngestionDataEntitiesFilter.java:56 uses `String.equals(...)`, not `MessageDigest.isEqual(...)`. Timing-based discovery is theoretically feasible on a low-latency network; the 40-char alphanumeric search space makes the practical attack surface small but the principle is violated. Same issue in sibling `S2sAuthenticationFilter`. (IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[1])"
        - "**Body-buffered-before-auth (MEDIUM security / MEDIUM perf)** — filter reads the FULL request body into memory via `collectList()` to extract `dataSourceOddrn` BEFORE validating the token. An attacker submitting maximum-size 20MB payloads with invalid tokens forces the platform to buffer + parse them before rejecting — low-effort heap-pressure DoS vector. Auth-first ordering would shed bad traffic earlier but would require knowing the dataSourceOddrn before body parse. (IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[4] + performance.known_performance_gaps.[1])"
        - "**No failed-auth log / metric (MEDIUM severity)** — no @Slf4j log call on either 'Token is missed' or 'Token is not correct' paths. No Micrometer counter. A security incident review of 'attacker probed ingestion endpoint with N invalid tokens' cannot be answered from application logs. (IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[2])"
        - "**Hard-coded path matcher (MEDIUM future-regression risk)** — `/ingestion/entities` exact match, no wildcard. A future addition of `POST /ingestion/entities/batch` or `/v2` would bypass the filter silently with no compile-time signal. (IngestionDataEntitiesFilter@L20.md:bugs_limitations_corner_cases.[3])"
        - "**SIBLING `S2sAuthenticationFilter` is the OTHER ingestion-credential filter and it grants ADMIN globally when valid (HIGH severity)** — verified across 4 sidecars in batch 2026-05-12C: `S2sAuthenticationFilter.java:31-39` hard-codes `User.withUsername(\"ADMIN\")...roles(\"ADMIN\")` on `X-API-Key` match. The filter is added at `SecurityWebFiltersOrder.HTTP_BASIC` order in EACH of `LoginFormSecurityConfiguration.java:61-63` + `OAuthSecurityConfiguration.java:108-110` + `LDAPSecurityConfiguration.java:149-151`, and runs BEFORE the interactive-auth challenge. So `auth.s2s.enabled=true` + `auth.s2s.token=<value>` produces a single shared ingestion-flavoured credential that grants ADMIN across the ENTIRE `/**` UI/API surface. Under DISABLED, S2S is silently ignored (DisabledAuthSecurityConfiguration does not read the property). Distinct from this `IngestionDataEntitiesFilter` which is path-scoped to `/ingestion/entities` and per-datasource-token. Operators reading `enable-security/authentication/s2s` see 'they can call any endpoint that admins can call' but the per-mode pages do NOT cross-link or warn — and the property names `auth.ingestion.filter.enabled` vs `auth.s2s.enabled` are easily conflated. (OAuthSecurityConfiguration@L71.md:security.known_security_gaps.[0] + LDAPSecurityConfiguration@L51.md:bugs_limitations_corner_cases.[S2S admin everywhere] + LoginFormSecurityConfiguration@L31.md:implicit_adrs.[2] + DisabledAuthSecurityConfiguration@L10.md:bugs_limitations_corner_cases.[2])"
      cross_file_inconsistencies:
        - "Live docs site (`enable-security/authentication/s2s`) describes `S2sAuthenticationFilter` (auth.s2s.enabled + auth.s2s.token + X-API-Key header) — a SEPARATE filter from IngestionDataEntitiesFilter (auth.ingestion.filter.enabled + Authorization: Bearer header). The two filters use different header conventions, different scope (global vs path-matched), different config keys, different token sources (single shared `auth.s2s.token` string vs per-datasource/per-collector DB rows). Operators conflate them. (IngestionDataEntitiesFilter@L20.md:docs_link_semantic.doc_drift_findings.[1])"
        - "S2S COMPOSES (not mutex) with each interactive auth mode — verified across the 4 *SecurityConfiguration sidecars in batch 2026-05-12C. `IngestionDataEntitiesFilter` is independent of both (it has its own toggle). The Ingestion-credential concept therefore has TWO orthogonal surfaces: per-datasource path-scoped (this filter) AND global-ADMIN-shared-secret (S2S)."
        - "regenerateCollectorToken sidecar establishes the plaintext-stored-shared-secret stance at the WRITE side (TOKEN.value is raw `RandomStringUtils.randomAlphanumeric(40)`); IngestionDataEntitiesFilter@L20 line 56 establishes the same at the VERIFY side (`String.equals` against the in-DB value). Triangulated evidence of the plaintext-token model spanning rotate + verify (cross-link to Collector Token concept)."
      contributing_files:
        - "IngestionDataEntitiesFilter@L20.md"
        - "regenerateCollectorToken.md"
        - "AlertManagerController.md"
        - "DisabledAuthSecurityConfiguration@L10.md"
        - "LoginFormSecurityConfiguration@L31.md"
        - "OAuthSecurityConfiguration@L71.md"
        - "LDAPSecurityConfiguration@L51.md"
      evidence:
        - "IngestionDataEntitiesFilter@L20.md:security.known_security_gaps.[0-4]"
        - "IngestionDataEntitiesFilter@L20.md:bugs_limitations_corner_cases.[0,2,3,5,6,7]"
        - "regenerateCollectorToken.md:concepts.invariants.[3] (plaintext-equality at the verify side)"
        - "OAuthSecurityConfiguration@L71.md:security.known_security_gaps.[0] (S2S grants ADMIN across all /** HIGH)"
        - "LDAPSecurityConfiguration@L51.md:bugs_limitations_corner_cases.[S2S admin everywhere]"
        - "LoginFormSecurityConfiguration@L31.md:implicit_adrs.[2] (S2S additive across modes)"
        - "DisabledAuthSecurityConfiguration@L10.md:bugs_limitations_corner_cases.[2] (S2S silently ignored under DISABLED)"
    performance_aggregate:
      overall: MEDIUM
      hot_paths:
        - "Every `POST /ingestion/entities` request (when filter registered) incurs: 1 buffer-collect of full body, 1 Jackson deserialisation to `DataEntityList` (duplicates the controller's later parse), 1 DB SELECT for the datasource, +1 fallback DB SELECT for the collector if datasource.token() is null — 2-3 DB round-trips per ingestion request on the happy path"
      throughput_shape:
        verdict: SINGLE_ITEM_ONLY
        detail: "Single-request, single-batch — but the filter reads the entire body before deciding auth. No streaming validation path."
      scaling_shape:
        verdict: HORIZONTALLY_SCALABLE
        detail: "Filter is stateless. Instances scale horizontally. ConditionalOnProperty resolved at startup — a property change requires restart."
      strengths:
        - "Reactive Flux<DataBuffer> signature — non-blocking on server I/O thread"
        - "Stateless — instances scale horizontally without coordination"
      weaknesses:
        - "**Duplicate body parse** — filter materialises DataEntityList from bytes purely to extract `dataSourceOddrn`, then re-emits the original buffers for the controller to deserialise the same payload AGAIN. Per-request O(payload-size) Jackson parse on a high-throughput ingestion path. A JsonPath-style streaming extraction would avoid the duplicate parse. Severity MEDIUM (IngestionDataEntitiesFilter@L20.md:performance.known_performance_gaps.[0])"
        - "**No token cache** — every ingestion request re-fetches the datasource (and possibly the collector) from DB. A short-TTL Caffeine cache keyed by `dataSourceOddrn` would eliminate per-request DB hits on steady-state ingestion streams. Would require invalidation hook on `regenerateCollectorToken`. Severity MEDIUM (IngestionDataEntitiesFilter@L20.md:performance.known_performance_gaps.[2])"
        - "**Per-filter ObjectMapper** — `AbstractIngestionFilter.java:32` instantiates `new ObjectMapper()` per filter instance (instance field, not static). Two ObjectMappers exist (one per concrete filter). Minor — Jackson ObjectMapper is documented thread-safe-after-configuration; a shared static instance would be cheaper (IngestionDataEntitiesFilter@L20.md:performance.resource_allocation)"
        - "**20MB body buffered before auth** — concurrent invalid-token requests at maximum size produce N × 20MB heap pressure during the parse+reject window"
      cross_file_inconsistencies:
        - "Sibling `IngestionDataSourceFilter` is registered UNCONDITIONALLY (no @ConditionalOnProperty) while `IngestionDataEntitiesFilter` is conditional — the `auth.ingestion.filter.enabled` toggle only suppresses the per-datasource data-entity filter; the collector-token-required filter on `POST /ingestion/datasources` is always on. The implicit decision: 'you must always be a known collector to register a datasource, but you may or may not be a token-bearing collector to ingest data entities.' (IngestionDataEntitiesFilter@L20.md:implicit_adrs.[3])"
      contributing_files:
        - "IngestionDataEntitiesFilter@L20.md"
      evidence:
        - "IngestionDataEntitiesFilter@L20.md:performance.hot_paths"
        - "IngestionDataEntitiesFilter@L20.md:performance.known_performance_gaps.[0,1,2]"
    notes: |
      Batch 2026-05-10B promotes IngestionDataEntitiesFilter from a
      sidecar-referenced concept (every controller said "this is not me")
      to a CANONICAL sidecar with primary evidence. The concept now carries
      its own security_aggregate + performance_aggregate. The plaintext-
      equality token model is corroborated by batch A's regenerateCollectorToken
      sidecar — the catalog has cross-side evidence that the token model is
      plaintext at WRITE (rotate) AND plaintext at VERIFY (ingestion-filter
      equals-check).

      Batch 2026-05-12C surfaces the SIBLING auth-credential filter
      (`S2sAuthenticationFilter`) as a separate-but-easily-conflated
      concern: when composed, X-API-Key grants ADMIN across the entire
      `/**` surface, not just `/ingestion/**`. The 4-sidecar triangulation
      (DisabledAuth + LoginForm + OAuth + LDAP) makes the per-mode
      composition behaviour citable rather than inferred. Surfaced as a
      HIGH-severity weakness in the security_aggregate above.

  - name: "Notifications"
    canonical_in_docs: false
    canonical_candidate: true
    description: "Outbound alert-notification subsystem — a feature-flagged, off-by-default service that streams `ALERT` table changes via PostgreSQL logical-replication WAL and fans them out to Slack (incoming webhook), generic webhook (JSON POST), and SMTP email channels. Each channel is independently activated by the presence of its URL/sender key. Disabled by default at `notifications.enabled=false` (read by `NotificationsFeatureCondition` from the Spring `Environment` — bypassing `NotificationsProperties.enabled` field on the boot path). The WAL subscriber is a leader-elected single-thread consumer gated by Postgres advisory lock id `notifications.wal.advisory-lock-id` (default 100), running ONE thread named `notification-subscriber-thread` on the elected leader. Replication slot + publication are created LAZILY on first run if absent; ODD never drops them on shutdown — operator owns cleanup. Fan-out through `List<NotificationSender>` is sequential and fail-soft: per-sender exceptions are caught at the processor and the loop continues. Distinct from the platform's internal `Alert` lifecycle (this is the OUTBOUND delivery surface for alerts) and from the `Slack collaboration app` (which is bidirectional in-app Discussions, not alert notifications). vocabulary_status: codebase-anchored, doc-side-feature-page-covered (`features/active-platform-features/notifications` returns 200; `active-platform-features/notifications` returns 404 — GitBook IA drift). main-concepts.md names `Slack alert webhook` in Terms & Aliases (outgoing variant) but does NOT name `Notifications` as a first-class canonical feature."
    vocabulary_status: "codebase-anchored, doc-side-feature-page-covered"
    axes_present:
      - config_prefixes
    nodes:
      - "odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties"
    contributors:
      - "NotificationsProperties: entities[NotificationsProperties, WalProperties, EmailSenderProperties (sibling), AlertNotificationMessage, DecodedWALMessage, NotificationSender (Slack | Webhook | Email)]; operations[feature-flag gating, WAL replication-slot coordinates carrier, fan-out alert delivery, leader-elected single-thread WAL consumer]; invariants[subsystem disabled by default; feature-condition reads notifications.enabled from Spring Environment directly; WAL subscriber leader-elected via advisory lock id 100; replication-slot + publication lazily created; never dropped; fan-out sequential + fail-soft per channel]"
    evidence:
      - "NotificationsProperties.md:concepts.entities + concepts.operations + concepts.invariants"
      - "NotificationsProperties.md:implicit_adrs.[0-5]"
      - "NotificationsProperties.md:dependencies_semantic.requires-config (notifications.* + odd.platform-base-url + Postgres logical-replication runtime)"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - INTERNAL_ONLY
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: BYPASSES
        detail: "NotificationsProperties is a config-binding POJO, not an HTTP surface — no `@PreAuthorize` applicable. Downstream effect: the WAL subscriber reads `ALERT` table rows directly via Postgres logical replication, bypassing any application-layer authorization. Fan-out is unconditional: every configured channel receives every alert event regardless of which data-entity owners would have been entitled to see it. The `AlertNotificationMessage` payload includes `owners[]` (owner name + title) for the alerted entity, but does NOT route based on them. Cross-tenant / multi-team deployments cannot scope notifications to the owning team."
      owner_scoping:
        verdict: BYPASSES
        detail: "Fan-out unconditional — every Slack channel / webhook URL / email recipient gets every alert. `AlertNotificationMessageProcessor.java:25-36` loop iterates `List<NotificationSender>` unconditionally on every `AlertNotificationMessage`; no per-recipient owner filter; no per-channel routing predicate."
      strengths:
        - "Disabled-by-default — `notifications.enabled=false` is the default read by `NotificationsFeatureCondition.java:8-13` from the Spring `Environment` (single source of truth, enforced uniformly across `NotificationConfiguration`, `NotificationSubscriberStarter`, and `AlertNotificationMessageProcessor` via `@ConditionalOnNotifications`)"
        - "Per-channel URL-presence activation — `@ConditionalOnProperty(name = \"notifications.receivers.slack.url\" | \"notifications.receivers.webhook.url\" | \"notifications.receivers.email.sender\")` on each sender bean method. Absence of a key = no bean = silently no-op for that channel. Operators configure only the channels they want."
        - "Email password masked by Spring's default `/actuator/env` sanitisation (`password`-suffixed keys in Spring's default mask list) — partial mitigation"
        - "Single `HttpClient` bean shared across Slack + Webhook senders — bounded resource footprint"
      weaknesses:
        - "**No retry / dead-letter queue / audit trail on failed notification delivery (HIGH severity)** — `AlertNotificationMessageProcessor.java:30-35` catches `NotificationSenderException`, logs at ERROR, and moves on. The alert is lost from that channel's perspective with no record in the `ALERT` table that delivery failed. No `notification_delivery` table, no metric counter, no Prometheus gauge. Operators have no DB-visible signal that notifications stopped working. (NotificationsProperties.md:bugs_limitations_corner_cases.[3] + known_security_gaps.[3])"
        - "**Email per-recipient silent partial delivery (HIGH severity)** — `EmailNotificationSender.java:53-61` iterates `notificationsEmails` in order, reusing the same `MimeMessage` and calling `helper.setTo(email); emailSender.send(mimeMessage);` per iteration. Any thrown `MessagingException` aborts the loop via the surrounding try/catch — recipients after the failing one never receive the alert. Documented as a known limitation on the live doc, but the code has no fault-tolerance (no continue-on-error, no per-recipient try/catch). (NotificationsProperties.md:bugs_limitations_corner_cases.[4])"
        - "**No rate-limiting / throttling at any layer (HIGH severity)** — WAL streams as fast as Postgres can decode, the loop in `AlertNotificationMessageProcessor` is synchronous, and senders block on HTTP. A burst of 10k alerts (misconfigured data-quality run) will fire 10k Slack messages + 10k webhook POSTs + 10k emails with no rate cap. Slack will rate-limit the webhook (429); platform has no retry-with-backoff on 429 — logs the failure, drops the alert. (NotificationsProperties.md:bugs_limitations_corner_cases.[10] + known_performance_gaps.[0])"
        - "**Webhook delivery unsigned / no shared secret / no HMAC (MEDIUM)** — `WebhookNotificationSender.java:18-23` is `HttpRequest.newBuilder().uri(webhookUrl).POST(...)` with no auth header, no signature. The receiving endpoint cannot verify the webhook actually originated from ODD Platform vs an attacker who scraped the webhook URL. (NotificationsProperties.md:known_security_gaps.[0])"
        - "**Alert payload routes to ALL configured channels regardless of owner (MEDIUM)** — cross-tenant / multi-team deployments cannot scope notifications to the owning team. `AlertNotificationMessage` carries `owners[]` but the processor does not consult them for routing. (NotificationsProperties.md:known_security_gaps.[2])"
        - "**PII surface in notification payloads (MEDIUM)** — `AlertNotificationMessage` carries `dataEntity.{name, dataSourceName, namespaceName}`, `owners[].ownerName`, `eventAt`, and `downstream` lineage entities up to `notifications.message.downstream-entities-depth`. Any operator-supplied free-text (descriptions, table names) is rendered verbatim into Slack/webhook/email — no redaction, no allowlist. (NotificationsProperties.md:bugs_limitations_corner_cases.[11])"
        - "**Dead config field: `NotificationsProperties.webhookUrl` (MEDIUM)** — top-level field declared on the POJO but NO consumer reads it; the active webhook URL is `notifications.receivers.webhook.url` read via `@Value` in `NotificationConfiguration`. An operator setting `notifications.webhookUrl=...` gets silent acceptance and zero effect. (NotificationsProperties.md:bugs_limitations_corner_cases.[0])"
        - "**No structured audit log of notifications sent (MEDIUM)** — only `log.debug(\"Sending notification message via {}: {}\", ...)`. Operators have no way to answer 'when did notifications last work?' or 'which alert IDs were delivered to which channels?'. (NotificationsProperties.md:bugs_limitations_corner_cases.[11])"
        - "**Replication-slot orphan risk (MEDIUM)** — if operator renames `notifications.wal.replication-slot-name` between deployments and forgets to drop the old slot, Postgres retains WAL for the orphaned slot indefinitely — risking primary disk exhaustion. Live doc warns about manual cleanup but does not warn about rename-orphan specifically. (NotificationsProperties.md:bugs_limitations_corner_cases.[12])"
        - "**Advisory-lock-id collision risk (MEDIUM)** — `notifications.wal.advisory-lock-id` defaults to 100. Cross-subsystem collision targets: `partition.advisory-lock-id=90`, `datacollaboration.receive-event-advisory-lock-id=110`, `datacollaboration.sender-message-advisory-lock-id=120`. Distinct in shipped defaults, but operator customisation could collide silently. (NotificationsProperties.md:bugs_limitations_corner_cases.[2])"
        - "**Email + Slack URL accept any scheme/host (LOW)** — `notifications.receivers.slack.url=file:///etc/passwd` boots OK and fails at HTTP-send time; no `@URL` constraint, no allowlist, no SSRF guard. (NotificationsProperties.md:bugs_limitations_corner_cases.[6] + known_security_gaps.[1])"
        - "**PG replication role is broad (LOW)** — `ALTER ROLE ... WITH REPLICATION` is required cluster-wide; ODD does not document scoping to a per-publication role. (NotificationsProperties.md:known_security_gaps.[4])"
      cross_file_inconsistencies:
        - "GitBook IA drift: `active-platform-features/notifications` returns 404; canonical is `features/active-platform-features/notifications` (200). Same drift class as DataCollaboration's 404 — surface in cross-cutting invariants."
        - "`notifications.message.downstream-entities-depth` is consumed via raw `@Value` in `NotificationConfiguration#alertNotificationMessageTranslator`, NOT through this `@ConfigurationProperties` POJO — the POJO model is incomplete vs the actual config surface. Cosmetic inconsistency vs ODD's `@ConfigurationProperties` pattern elsewhere. (NotificationsProperties.md:bugs_limitations_corner_cases.[1])"
        - "`NotificationsProperties.enabled` field exists but is NOT the gate — `NotificationsFeatureCondition` reads `notifications.enabled` directly from the Spring `Environment`, bypassing this POJO. Two parallel paths for reading the same key — a future maintainer wiring `@ConditionalOnProperty(matchIfMissing=false)` on the bean methods would conflict with the existing Condition class."
      contributing_files:
        - "NotificationsProperties.md"
      evidence:
        - "NotificationsProperties.md:bugs_limitations_corner_cases.[0-13]"
        - "NotificationsProperties.md:security.known_security_gaps.[0-4]"
        - "NotificationsProperties.md:implicit_adrs.[0-5]"
    performance_aggregate:
      overall: LOW
      hot_paths:
        - "Per WAL message: `messageDecoder.decode(buffer)` (sync, in-thread) then `messageProcessor.process(decodedMessage)` runs `messageTranslator.translate(...)` (multi-statement jOOQ query: alert chunks + alerted data entity + recursive downstream CTE) then sequentially iterates `List<NotificationSender>` calling `.send(...)` on each — every send is a synchronous HTTP/SMTP round-trip. End-to-end latency per alert ≈ (decode) + (DB roundtrips for downstream depth≥1) + Σ per-channel network RTT — NotificationsProperties + NotificationSubscriber.java:64-77 + AlertNotificationMessageProcessor.java:25-36 + AlertNotificationMessageTranslator.java:60-86"
        - "Recursive downstream lineage CTE in `AlertNotificationMessageTranslator#fetchDownstream` — depth-bounded by `notifications.message.downstream-entities-depth` (default 1). At depth N over wide lineage graphs, CTE cost scales with the branching factor."
      throughput_shape:
        verdict: SINGLE_ITEM_ONLY
        detail: "Single-thread WAL consumer per cluster (leader-elected at advisory lock id 100). Throughput bounded by the slowest sender plus translation DB cost. No parallelisation across channels. No batching — one HTTP/SMTP roundtrip per alert per channel. Polling loop sleeps 10ms between empty `readPending()` calls — idle CPU baseline bounded."
      scaling_shape:
        verdict: STATEFUL_LOCKED
        detail: "Stateful at the cluster level — Postgres advisory lock id 100 + named replication slot + named publication. Horizontal scaling = exactly one active subscriber. Replication slot + publication are global Postgres objects; renaming requires manual drop of the prior slot or WAL accumulation on the primary. No queueing layer between WAL decode and HTTP send — bursts of alerts directly translate into bursts of outbound HTTP/SMTP requests; no backpressure mechanism."
      strengths:
        - "Single shared `HttpClient` bean across Slack + Webhook senders — connection reuse"
        - "Polling loop sleeps 10ms between empty reads — bounded idle CPU"
        - "Email sender reuses single `MimeMessage` across recipients — minor allocation savings"
        - "Default partition WIDTH `:30` and default `downstream-entities-depth: 1` are sensible safe defaults"
      weaknesses:
        - "**No rate-limiting — bursty alert events translate 1:1 into outbound deliveries (HIGH severity)** — Slack will 429; platform has no retry-with-backoff. (NotificationsProperties.md:performance.known_performance_gaps.[0])"
        - "**Synchronous fan-out — one slow sender stalls all subsequent senders for the same alert (MEDIUM)** — misconfigured webhook with 30s SLA blocks Slack + email delivery. (NotificationsProperties.md:performance.known_performance_gaps.[1])"
        - "**SMTP timeouts unset — hung SMTP server blocks subscriber thread forever, stopping ALL notification delivery (HIGH severity)** — `NotificationConfiguration.java:34-68` has no `mail.smtp.connectiontimeout` / `mail.smtp.timeout` / `mail.smtp.writetimeout` in the Properties bag. Live-doc-documented limitation. (NotificationsProperties.md:performance.known_performance_gaps.[2])"
        - "**No connection-pool sizing knobs surfaced for the shared `HttpClient` (LOW)** — `HttpClient.newHttpClient()` uses default executor + default pool. (NotificationsProperties.md:performance.known_performance_gaps.[3])"
        - "**Slack response-status check is hard-coded == 200 (LOW)** — Slack's incoming webhook can return 2xx other than 200; non-200 2xx will be misclassified as failure. (NotificationsProperties.md:bugs_limitations_corner_cases.[8])"
      cross_file_inconsistencies: []
      contributing_files:
        - "NotificationsProperties.md"
      evidence:
        - "NotificationsProperties.md:performance.hot_paths.[0-1]"
        - "NotificationsProperties.md:performance.throughput_characteristics + scaling_characteristics"
        - "NotificationsProperties.md:performance.known_performance_gaps.[0-3]"
    notes: |
      Notifications is the outbound counterpart to the platform's internal
      `Alert` concept — Alert is the data-entity-scoped issue surface, this
      is the operator-facing delivery channel for those alerts. Three
      channels (Slack incoming webhook, generic JSON webhook, SMTP email)
      each independently activated by the presence of its URL/sender key.

      main-concepts.md names `Slack alert webhook` in Terms & Aliases (the
      OUTGOING variant — distinct from `Slack collaboration app` which is
      the bidirectional Discussions integration), but does NOT name
      "Notifications" as a first-class canonical feature. Live feature page
      exists at `features/active-platform-features/notifications` (200); the
      legacy/alternate path `active-platform-features/notifications` returns
      404 — GitBook IA drift mirrored by DataCollaboration.

      Cross-cutting connections:
        - 202+queue+Postgres-advisory-lock single-sender pattern: now
          2-sidecar triangulated (this + postMessageInSlack); see the
          cross-cutting invariant.
        - Lazy-create-no-drop replication artefacts: 2-sidecar triangulated
          (this + ActivityTablePartitionManager partitions); see the
          cross-cutting invariant.
        - Dead code in load-bearing positions: `webhookUrl` field on this
          POJO + AuthorizationManagerCondition class; see the cross-cutting
          invariant.
        - Legacy-vs-canonical doc-path drift: this + DataCollaboration; see
          the cross-cutting invariant.

      Recommended canonicalisation: add `Notifications` to main-concepts.md
      as a first-class feature concept with sub-concepts for each channel
      (Slack incoming webhook, generic JSON webhook, SMTP email); also extend
      `enable-security` to document the operator's responsibility to scope
      the Postgres REPLICATION role and to manually drop the replication
      slot + publication on uninstall.

