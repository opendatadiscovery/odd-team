behaviour: |-
  **TRANSLATES_SILENTLY — `relationshipId` path parameter on
  GET /api/relationships/erd/{relationship_id} and
  GET /api/relationships/graph/{relationship_id} promises the
  `relationships`-table primary key but the SQL at
  ReactiveRelationshipsRepositoryImpl.java:194 filters by
  `relationshipsDataEntity.field(DATA_ENTITY.ID).eq(relationshipId)` —
  the data_entity.id column, NOT relationships.id.** The list endpoint's
  response maps `.id(item.dataEntityRelationship().getId())` at
  RelationshipMapper.java:53 — the data_entity id. UI round-trip works
  because the list and detail endpoints both speak data_entity.id under
  the parameter name `relationship_id`. A third-party API consumer
  reading the OpenAPI spec literally (where `relationship_id` plus the
  operation summary 'Get erd relationship by id' reads as the
  relationships-table id) and supplying the actual `relationships.id`
  value gets 404 — or worse, a 200 for an UNRELATED relationship if the
  data_entity.id and relationships.id values happen to collide (both
  bigserial; collision is admissible across two independent counters).

  LSN-020 class — input-name-vs-implementation drift. The fix candidate
  is changing line 194 from
  `relationshipsDataEntity.field(DATA_ENTITY.ID).eq(relationshipId)` to
  `RELATIONSHIPS.ID.eq(relationshipId)` AND updating the list endpoint's
  mapper at RelationshipMapper.java:53 to surface
  `relationshipPojo().getId()` as the response `id` field. Both halves
  needed for the rename — either half alone breaks the UI round-trip.
