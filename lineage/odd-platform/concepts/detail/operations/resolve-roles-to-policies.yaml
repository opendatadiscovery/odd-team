notes: 'NEW operation captured in batch H. The single repository method is the platform''s
  authorization hot path; every authenticated request that traverses any SECURITY_RULES
  entry transitively invokes it.


  Recommended fixes (in priority order):


    (1) HIGH-severity: add `.and(POLICY.DELETED_AT.isNull())` to the JOIN at line
  34. Closes the orphan-binding permission leak.


    (2) MEDIUM-leverage: introduce a short-TTL request-scoped or user-scoped cache
  to amortise the DB cost across N authorized requests/sec. A 30-second cache keyed
  on (userId, roleIds) would significantly reduce DB load on busy platforms without
  meaningfully delaying permission propagation.


    (3) LOW-leverage: project away policy text for callers that only need permissions
  (currently the only consumer needs the full policy text to compute permissions,
  so this is not a real gap).


  Doc-gap candidate: extend `/configuration-and-deployment/enable-security/authorization`
  with a "Permission resolution mechanism" subsection naming the per-request hot path,
  the cache absence, and the deleted_at filter gap (until fixed).

  '
