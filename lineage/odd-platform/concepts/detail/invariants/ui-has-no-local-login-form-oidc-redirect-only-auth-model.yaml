mitigations_unimplemented:
  - |-
    Doc-side: extend `/configuration-and-deployment/enable-security/authentication`
    with an explicit "What you see at login per auth.type" section:
      - DISABLED → no login challenge
      - LOGIN_FORM → Spring Security framework default (unbranded)
      - LDAP → Spring Security framework default (unbranded)
      - OAUTH2 → redirect to IdP's hosted page
    Operators considering ODD for production benefit from knowing the
    login UI is not customisable without code changes.
  - |-
    Optional code-side: introduce a `loginPage("/login")` chain on the
    LOGIN_FORM and LDAP security configurations + author a React
    LoginForm component matching ODD's design system. Requires non-trivial
    work but closes the UX gap.
notes: |-
  Positive finding (the absence is correct for the OIDC-redirect-only
  auth model the platform was designed around). Recording as an
  invariant because future scanners + maintainers reading the SPA
  source code expect a LoginForm component and need to know one does
  not exist — the framework default is the contract.

  Cross-references:
    - `auth-mode` entity (the `auth.type` knob)
    - `partial-permission-gating-edit-button-gated-content-unconditional`
      (the UI's other permission-gating posture)
    - `read-collaborative-cross-owner-enumeration` (the toolbar's
      unconditional mount is consistent with the read-collaborative
      posture)
