behaviour: 'Policy + Role + Owner creation is NOT audit-logged at ANY tier (controller,
  service, repository) AND the schema-tier root cause is V0_0_48__add_activity.sql:4
  — `activity.data_entity_id NOT NULL`. PolicyServiceImpl.create (lines 62-69), RoleServiceImpl.create
  (lines 49-61), and OwnerServiceImpl.create (lines 54-66) have no `log.info/warn/audit`
  call (verified by reading end-to-end). The `policy` / `role` / `owner` tables'' row-history
  is single-state — there is no `policy_audit` / `role_audit` / `owner_audit` companion
  table and no append-only log of (who, when, what JSON). A security incident review
  of ''a MANAGEMENT/ALL policy named X was created on date Y — who authored it?'' cannot
  be answered from the running platform. STRENGTHENED batch I — the PolicyServiceImpl
  sidecar primary-source confirms: NO `@Slf4j` annotation, NO Logger field, NO `log.info
  / .warn / .error` call in the entire class. STRENGTHENED batch S — the PolicyServiceImpl
  + RoleServiceImpl + OwnerServiceImpl service-tier closure sidecars (2026-05-20) confirm
  the 8-sidecar audit-silence pattern: RoleController batch E + PolicyController batch
  E + ReactivePolicyRepositoryImpl batch H + ReactiveRoleRepositoryImpl batch N + OwnerServiceImpl
  batch P + ReactiveActivityRepositoryImpl batch R + PolicyServiceImpl batch I/S + RoleServiceImpl
  batch S = 8 sidecars all confirming forensic silence. The batch-R primary-source finding
  (V0_0_48__add_activity.sql:4 — `activity.data_entity_id NOT NULL` with FK constraint
  to `data_entity(id)`) is the SCHEMA-ROOT-CAUSE — even adding `@ActivityLog(event
  = POLICY_CREATED)` here would FAIL at the SQL layer because RBAC mutations have no
  data-entity context. The fix is a SCHEMA MIGRATION (NULLable data_entity_id + discriminator
  column, OR a separate `platform_event` table for non-data-entity-scoped events),
  NOT an annotation-level change here.'
