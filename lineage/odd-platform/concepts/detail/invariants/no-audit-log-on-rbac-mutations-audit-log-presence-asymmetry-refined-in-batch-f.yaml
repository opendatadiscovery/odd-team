notes: |-
  REFINED cross-cutting hygiene invariant in batch 2026-05-12F. Originally
  captured in batch E as a 3-sidecar 'codebase-wide' hygiene gap; batch F
  primary-source corroboration on DataEntity-side updateStatus + createOwnership
  shows the gap is NOT codebase-wide — it is specifically the RBAC primary
  surface. **Batch H** adds the SQL-layer confirmation via ReactivePolicyRepositoryImpl
  — persistence-layer silence on {create, update, delete} of policies.

  **Batch L** extends the 2-tier story to a 4-tier story by discovering
  TIER-1 EXCEPTIONS (entity-side writes that ALSO lack audit) AND the
  TIER-1c audit-noisy shape (events fire on no-op).

  **Batch N** anchors the SYMMETRIC end-to-end pattern across the RBAC
  mutation surface — the 4-sidecar pattern is now 5-sidecar with the
  ReactiveRoleRepositoryImpl persistence-layer confirmation. Both
  halves of the RBAC repository pair (Role + Policy) are now
  primary-source-pinned at the SQL layer as forensically dark on
  {create, update, delete}. The platform's RBAC mutation surface has
  NO BACKUP AUDIT at any layer (HTTP → service → SQL all silent).

  **Batch P** corroborates the pattern at the FULL Owner-directory
  mutation surface (create + update + delete; 3-of-3 verbs in the
  Owner controller). The 5-sidecar pattern at the controller tier
  (+ 2-sidecar at the repository tier = 7 sidecars end-to-end) is
  now: createRole / createPolicy / createOwner / updateOwner /
  deleteOwner — all of which carry NO @ActivityLog, no Slf4j log,
  no audit-table INSERT. The deleteOwner verb is the most-severe
  composition: role bindings HARD-deleted (irreversible), owner
  row soft-deleted (name re-usable), operation silent. Combined
  with createOwner's same silence, an attacker (or hijacked admin)
  can delete an Owner + re-create another with the same name + zero
  audit trail anywhere. The HIGH severity classification is
  consistent across all three Owner-controller mutations.

  Tier 1a (entity-side writes — AUDITED):
    - status updates (programmatic logStatusChangeEvents)
    - ownership-bindings (@ActivityLog OWNERSHIP_CREATED)
    - description / business-name updates
    - tag / term-link additions and removals (UI side)
    - alert-config updates
    - alert status changes (@ActivityLog ALERT_STATUS_UPDATED — batch H
      confirmed at AlertServiceImpl.java:112)

  Tier 1b (entity-side writes — UNAUDITED despite reserved enum values —
  NEW batch L):
    - DEG membership add/delete (DATA_ENTITY_RELATION_UPDATED enum
      reserved but @ActivityLog absent)
    - custom-metadata create/update/delete (CUSTOM_METADATA_CREATED /
      UPDATED / DELETED enum values all reserved but @ActivityLog absent)

  Tier 1c (entity-side writes — AUDIT-NOISY — NEW batch L):
    - term-unlink DELETE on non-member: activity-event fires with
      BEFORE=AFTER state JSON; auditors cannot distinguish real removals
      from no-op DELETEs

  Tier 1c-equivalent (NEW batch N — repository-tier silence on entity
  writes; the UI side is audited but the ingestion / direct path is
  not):
    - Tag ingestion-side writes (ExternalTagIngestionRequestProcessor
      bypasses the @ActivityLog at DataEntityServiceImpl.upsertTags)
    - Term repository-tier writes (TermServiceImpl audited; direct
      repository invocation silent)

  Tier 2 (RBAC-scoped writes — UNAUDITED end-to-end):
    - Policy create / update / delete (service + persistence layers)
    - Role create / update / delete (service + persistence layers
      — batch N SYMMETRIC MIRROR confirmation)
    - Owner directory create (Owner-controller side, not ownership binding)
    - **Owner directory update (Owner-controller side; NEW batch P)** —
      OwnerServiceImpl.update no @ActivityLog; rename + role-rebind
      both silent
    - **Owner directory delete (Owner-controller side; NEW batch P)** —
      OwnerServiceImpl.delete no @ActivityLog; the DESTRUCTIVE verb is
      the worst-case composition in the pattern

  Tier 2-equivalent (NEW batch N — RBAC-adjacent writes that are
  user-binding rather than role-binding):
    - user_owner_mapping createRelation / deleteRelation /
      deleteActiveRelationByOwner (RBAC-adjacent because they bind a
      user to an Owner identity, which CHANGES the user's effective
      RBAC role bundle via getUserRolesByOwner; the audit silence
      compounds with the cross-mode bleed corner cases)

  The 4-tier-plus-equivalents story shows that audit is selectively
  applied across the codebase — the audit decision is per-write, and
  unfortunately the selection is INCONSISTENT (some entity writes
  audited, some not, some noisy). The maintainer-facing implication:
  the platform does NOT have a uniform audit story; understanding "is
  this audited?" requires per-endpoint inspection.

  Recommended cleanup options (in increasing scope):

    - Add `@Slf4j` log.info("created policy {name} by {currentUser}")
      to PolicyServiceImpl.create, RoleServiceImpl.create,
      OwnerServiceImpl.create. Minimum-cost, log-only audit trail.

    - Add `@ActivityLog` annotations matching the existing pattern in
      AlertServiceImpl + DataEntityServiceImpl + OwnershipServiceImpl
      (the batch F + H evidence shows the pattern is alive and proven on
      the DataEntity + Alert sides). Surfaces in the activity feed. Requires
      extending the ActivityEventType enum to cover RBAC mutations +
      extending the ActivityState renderer to handle
      Role/Policy/Owner-mutation payloads.

    - **NEW batch L** — wire `@ActivityLog(DATA_ENTITY_RELATION_UPDATED)`
      on DEG add/delete; wire `@ActivityLog(CUSTOM_METADATA_UPDATED)` on
      custom-metadata upsert (and the matching CREATED / DELETED on
      sibling methods). The enum values ALREADY EXIST — only the
      annotation + handler wiring is missing. Lowest-cost fix in the
      RBAC space.

    - **NEW batch L** — for Tier 1c (audit-noisy): early-exit the
      @ActivityLog AOP advice when the DELETE matches zero rows — the
      handler should not emit a TERM_ASSIGNMENT_UPDATED event with
      BEFORE=AFTER state. Either short-circuit at the AOP layer OR add
      a programmatic check at the service.

    - Introduce a dedicated `rbac_audit` append-only table written via
      `BaseSoftDeleteCRUDRepository`'s mutation lifecycle hooks. Full
      forensic trail; coordinates with the existing soft-delete pattern.

    - **NEW batch N** — wire @Slf4j on the user_owner_mapping write path
      (createRelation / deleteRelation / deleteActiveRelationByOwner)
      so cross-mode bleed events leave a trail; this is independently
      important AND a step toward the broader RBAC-side audit cleanup.

    - **NEW batch P — extend the Owner-side cleanup to ALL THREE
      verbs**: wire `@ActivityLog(OWNER_CREATED)`,
      `@ActivityLog(OWNER_UPDATED)`, `@ActivityLog(OWNER_DELETED)` on
      the corresponding OwnerServiceImpl methods. The enum values
      do NOT currently exist in `ActivityEventTypeDto.java` (verified
      verbatim by the batch P deleteOwner sidecar); adding them is
      part of the cleanup. The deleteOwner verb is the highest-leverage
      single fix (HIGH severity; destructive; irreversible role-binding
      hard-delete + soft-deleted-but-re-creatable owner row). Until
      this lands, deleting an Owner is a fully invisible operation in
      the platform's audit trail.

  Surface as canonicalisation candidate AND a refactoring-scope item.
  Eight DOC-NNN candidates flow from this invariant — four for RBAC
  surface (now including Owner-update + Owner-delete); three for
  Tier 1b/1c gaps; one for user-owner-binding audit.
