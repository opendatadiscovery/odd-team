proposed_action: |-
  Testcontainers integration test. (a) Pre-create data entity X and metadata field F (so the field side resolves). (b) DO NOT create a row in metadata_field_value for (X, F). (c) PUT /api/dataentities/X/metadata/F with body {value: 'test'}. (d) Assert HTTP 200 with empty/null response body (current contract). (e) Query `SELECT count(*) FROM metadata_field_value WHERE data_entity_id=X AND metadata_field_id=F` returns 0 (no row touched). (f) Test comment 'LOCKS the silent-200-no-op contract. When REFACTOR-NNN adds switchIfEmpty+404, this test FLIPS to expect 404.' Pair with TEST-GAP-496 (silent-200-on-missing-data-entity) — the two missing cases share a fix.
