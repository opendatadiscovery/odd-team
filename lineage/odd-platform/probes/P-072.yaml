expected_outcome: |
  Stress question (bugs_limitations_corner_cases — the totalDataSources mirror
  at DataSourcesList.tsx:44,50-52): the screen header shows
  '<N> datasources overall' where N is `totalDataSources`, a LOCAL React-state
  copy of the Redux slice `total` updated ONLY by a useEffect guarded
  `if (!query)` (DataSourcesList.tsx:50-52). Hypothesis: while a search is
  active (query non-empty), the header count stays FROZEN at the pre-search
  catalog total instead of reflecting the search-scoped total — e.g. in a
  10-datasource catalog, searching for a prefix matching 2 sources still shows
  '10 datasources overall' above a 2-card list. Clearing the search box
  resyncs the header to the slice total.
