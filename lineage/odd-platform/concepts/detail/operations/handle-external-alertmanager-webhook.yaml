notes: |
  Operation vocabulary captured for the AlertManager-webhook adapter path. Five
  test + doc + code gaps surface:

    (a) No test asserts the entity_oddrn orphan behaviour (label absent → null
        FK, alert persisted but invisible).

    (b) No test asserts the idempotency gap (POST same payload twice → assert
        row count = 1 vs 2 — captures the bug).

    (c) No test asserts the LocalDateTime timezone-naivety on the embedded
        generator URL window.

    (d) Live doc says nothing about idempotency (companion invariant); says
        nothing about the LocalDateTime timezone gap; documents the orphan
        case but not the spoof case.

    (e) Code: the generator URL should be validated against javascript: scheme
        and escaped before embedding in chunk descriptions.

