name: Register Data Source (UI admin path)
canonical_in_docs: false
canonical_candidate: true
description: |-
  POST /api/datasources — UI admin counterpart to the S2S
  IngestionController.createDataSourceEntity (POST /ingestion/datasources).
  Gated by DATA_SOURCE_CREATE Permission (MANAGEMENT scope) at
  SecurityConstants.java:116-117. The controller's registerDataSource
  handler (DataSourceController.java:30-36) is a one-line delegation
  to DataSourceServiceImpl.create (lines 52-66, @ReactiveTransactional).
  The service: (1) generates a new token via tokenGenerator.generateToken
  then persists via tokenRepository.create (line 54); (2) IF
  DataSourceFormData.namespaceName is non-empty, calls
  namespaceService.getOrCreate (the side-door — see
  namespace-create-side-doors-cross-pillar-4-sister-services
  invariant); (3) calls private createDataSource which throws
  BadUserRequestException('ODDRN must be filled for data source')
  if oddrn is empty (HTTP 400); (4) the mapper at DataSourceMapper.java:38-47
  maps the FormData to a DataSourcePojo trimming the ODDRN, stamping
  namespace_id + token_id; (5) dataSourceRepository.create →
  INSERT INTO data_source(...) — collision with an existing live
  ODDRN raises UniqueConstraintException (SQLSTATE 23505) → HTTP 400.
  Returns 200 (controller line 35) BUT OpenAPI declares 201 — same
  drift class as registerCollector.

  Distinct from IngestionController.createDataSourceEntity (the
  S2S path) — see datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation
  invariant THIS BATCH for the 5-vertex architectural picture.
  Key asymmetries:
    (a) UI path is full-form REPLACE on update; S2S path is
        UPSERT-by-ODDRN partial-merge of name + description only.
    (b) UI path can pick any namespace; S2S path inherits from
        Collector.
    (c) UI path requires DATA_SOURCE_CREATE; S2S path requires
        a valid collector token.
axes_present:
