surfaced_by:
  - "CollectorController.md:bugs_limitations_corner_cases.[Token entropy uses RandomStringUtils.randomAlphanumeric(40) which delegates to ThreadLocalRandom in commons-lang 3.16+, NOT SecureRandom. Cross-confirmed in the regenerateCollectorToken method-level sidecar — applies equally to the register path which uses the same TokenGenerator]"
  - "CollectorController.md:security.known_security_gaps.[Token entropy is non-cryptographically-secure (RandomStringUtils.randomAlphanumeric → ThreadLocalRandom in commons-lang 3.16+, not SecureRandom). 40 alphanumeric chars ≈ 238 bits of input space but the RNG quality is the binding constraint — severity HIGH]"
behaviour: |-
  **HIGH — Collector tokens are generated by `RandomStringUtils.randomAlphanumeric(40)` which (in commons-lang 3.16+) delegates to `ThreadLocalRandom`, NOT `SecureRandom`. The 40-character alphanumeric token has ≈238 bits of input space, but the RNG quality is the binding security constraint. ThreadLocalRandom is a predictable PRNG seeded once per thread — its output is reproducible given knowledge of the seed.** Primary-source confirmed in batch-W CollectorController sidecar:

  - `TokenGeneratorImpl.java:39, 49` — verified by sidecar primary-source line-by-line read.
  - Used by BOTH `CollectorController.registerCollector` (line 27) → `CollectorServiceImpl.create` (line 42) → `tokenGenerator.generateToken()` AND `CollectorController.regenerateCollectorToken` (line 47) → `CollectorServiceImpl.regenerateCollectorToken` (line 90) → `tokenGenerator.regenerateToken(...)`.
  - Also used by `DataSourceController.registerDataSource` → `DataSourceServiceImpl.create` (line 54) → `tokenGenerator.generateToken()` (per batch-W DataSourceController sidecar).
  - **The same TokenGenerator** is shared across F-020 (Collector Lifecycle) AND F-008 (Datasource registration). The vulnerability is platform-wide.

  **Why HIGH not MEDIUM**:
  - **ThreadLocalRandom is NOT cryptographically secure** per Java's official documentation: "Instances of java.util.concurrent.ThreadLocalRandom are not cryptographically secure. Consider using SecureRandom in security-sensitive applications." (Source: Java SE 17 docs, java.util.concurrent.ThreadLocalRandom).
  - **40 alphanumeric chars = 238 bits of ENTROPY** — but only if the RNG is uniform-random over the full space. ThreadLocalRandom's actual entropy depends on the seed; if the seed is predictable (e.g., timestamp-derived), the effective entropy drops sharply.
  - **The token IS the credential** — there is no salt, no HMAC, no derived form. A compromised RNG yields a compromised token.

  **Attack scenario**:
  - An attacker who can run code on the same JVM (or observe its timing) can characterize ThreadLocalRandom's seed and predict next-token outputs. For a JVM running an open-source platform with deterministic startup behaviour, the seed entropy is bounded by the system clock at startup.
  - Even without same-JVM access, ThreadLocalRandom's reduced entropy means brute-force search over the credential space is FASTER than a true 238-bit search. The 40-char alphanumeric token gives the ATTACKER fewer effective bits than the operator thinks.

  **Cross-platform evidence**:
  - **CollectorController register path** (`TokenGeneratorImpl.java:39`): the seed entropy of the token issued during collector registration.
  - **CollectorController regenerate path** (`TokenGeneratorImpl.java:49`): the seed entropy of the token issued during rotation.
  - **DataSourceController register path** (uses the same `TokenGenerator` per batch-W DataSourceController sidecar): the seed entropy of the token issued during datasource registration.
  - **DataSourceController regenerate path**: same.

  **Mitigation**: replace `RandomStringUtils.randomAlphanumeric(40)` with a `SecureRandom`-backed equivalent:
  ```java
  private final SecureRandom secureRandom = new SecureRandom();
  private static final String CHARS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  String token = IntStream.range(0, 40)
      .map(i -> CHARS.charAt(secureRandom.nextInt(CHARS.length())))
      .collect(Collectors.joining());
  ```

  **Test gap shape**: regression-pin asserting: (a) `TokenGeneratorImpl.generateToken` uses `RandomStringUtils.randomAlphanumeric` (assert via reflection or AST inspection); (b) `TokenGeneratorImpl.regenerateToken` uses the same method; (c) the method delegates to `ThreadLocalRandom` (assertable via JVM instrumentation or library introspection on commons-lang ≥3.16). The current state is PINNED — failures land if a future maintainer migrates to `SecureRandom`. When the fix lands, the test inverts to assert `SecureRandom` IS the source.
