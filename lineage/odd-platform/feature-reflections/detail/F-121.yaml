- id: H-007
  hypothesis: "When a multi-replica deployment runs under clock skew (JVM clocks drifted across nodes), the ShedLock coordination still arbitrates correctly because lock validity is judged by a single authoritative clock."
  derivation: "implicit_adrs[0] — the explicit `.usingDbTime()` call is the decision; an operator deciding 'do I need chrony on my K8s nodes?' relies on this."
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      SchedulingConfiguration:22 explicitly calls `.usingDbTime()` on the JdbcTemplateLockProvider
      builder, so lock_until / locked_at are written from PostgreSQL's current_timestamp, not from
      each JVM's Instant.now(). Two replicas with drifted clocks both read PG's authoritative time,
      so a lock held by replica A is correctly seen as held by replica B regardless of relative
      clock state. The default (without the call) would use JVM time and be split-brain-vulnerable;
      the deliberate invocation is the documented intent (implicit ADR, HIGH confidence).
    evidence:
      - sidecar: odd-platform__java__config__config-class__SchedulingConfiguration.md
        section: "implicit_adrs[0] + stress_findings.name_behavior_pairs[lockProvider] + stress_findings.tunables[.usingDbTime]"
        cite: "SchedulingConfiguration.java:22 (.usingDbTime())"
        note: "Name and implementation match; clock-skew tolerance is mechanically guaranteed by DB-authoritative time."
    severity: ~
    confidence: HIGH
    routes_to_finding: functional-test-demand
    use_case_kind: happy-path
    coverage: unverified
    test_demand: functional

