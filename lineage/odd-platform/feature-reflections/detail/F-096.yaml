    actual_behavior: |-
      `dataEntityRepository.listByOddrns(emptySet, true, true)` (line 93) is reached when every item
      is JOB_RUN. The service sidecar (uncovered_behaviours) states the empty-set path is "likely"
      short-circuited by listByOddrns but explicitly UNTESTED (`IngestionAllJobRunPayloadTest` does
      not exist). I will NOT assert confirmed on a path the sidecar itself flags as unverified and
      hedges. Settling it needs either a direct repository read of the listByOddrns empty-IN handling
      or a local run with an all-JOB_RUN payload.
    evidence:
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: tests_coverage_semantic.uncovered_behaviours
        cite: "IngestionServiceImpl.java:93"
        note: "All-JOB_RUN → empty keySet → listByOddrns(emptySet,..); path untested."
    operator_visible_failure: |-
      A collector that emits ONLY task-runs on a given tick (a common pattern for a job-monitoring
      collector) hits this path on every such tick. If the empty-IN path throws, that collector's
