proposed_action: |-
  WebTestClient integration test with mocked `AuthIdentityProvider`. (a) Create Owner A with entities a1, a2; Owner B with entities b1, b2. (b) Create lineage edges a1->a2 (internal to A), b1->b2 (internal to B). (c) Create cross-owner edge a1->b1. (d) Mock `authIdentityProvider.fetchAssociatedOwner()` to return Owner A (current correct behaviour). (e) GET /api/dataentities/my/upstream — assert response contains entities NOT in {a1, a2} but reachable upstream of {a1, a2} (the correct contract: response excludes anchor). (f) GET /api/dataentities/my/downstream — assert symmetric. (g) **Regression vector**: Mock `fetchAssociatedOwner` to return Owner B (simulating a refactor that returns wrong owner). (h) GET /api/dataentities/my/upstream — assert response contains entities reachable upstream of {b1, b2} (the LEAK — the user authenticated as A receives B's lineage neighbourhood). (i) Test comment 'LOCKS the REFACTOR-225 single-point-of-failure as of 2026-05-19. When a listByOddrnsAndOwner repository method is added with JOIN OWNERSHIP defence-in-depth, the regression-vector test (h) FLIPS to expect empty response — the wrong anchor produces no leakage because the JOIN filter intercepts.' This is both a regression-pin AND a vulnerability-proof.
