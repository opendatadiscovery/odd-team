      + performance.scaling_characteristics.
      Severity MEDIUM.
  - facet: 'link URL unvalidated — javascript: scheme storable, F-004 XSS family'
    observed: |-
      `saveLinks` / `updateLink` accept `DataEntityLinkFormData.url`
      with no validation — no `@URL` constraint, no scheme allowlist,
