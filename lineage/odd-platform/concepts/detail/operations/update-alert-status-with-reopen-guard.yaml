notes: |
  Operation vocabulary captured for future DOC-NNN follow-ups on the
  live alerting feature page (refreshed 2026-05-20 batch P, status 200).
  The reopen-conflict guard is acknowledged in the live API-reference
  doc (cited as "see AlertServiceImpl.updateStatus(...)" per the
  AlertController.changeAlertStatus sidecar inferred_docs[0].fetched_excerpts)
  but the race-window caveat is not documented — operators reading
  the doc cannot learn that two concurrent reopen requests for sibling
  alerts can both pass.

  Recommended cleanup:
    (a) DB-level partial unique index `UNIQUE (data_entity_oddrn, type)
        WHERE status = OPEN AND deleted_at IS NULL` — closes the race
        at the persistence layer; one-migration fix.
    (b) Service-level row-version field on AlertPojo + optimistic-
        concurrency check at update time — orthogonal to the partial
        index; provides stronger semantics for any future multi-field
        update.
    (c) Doc: extend the API-reference alerts page with a note on the
        race-window caveat AND on the anonymous-fallback audit-attribution
        loss under DISABLED.

  Cross-references:
    - Existing entity `Alert` (the broader concept — Platform-detected and
      externally-injected issues).
    - Existing operation `change-alert-status` (the controller-tier
      operation; this is the SERVICE-tier enactment).
    - New invariant `alertservice-handle-external-alerts-skip-resolver-asymmetry`
      (batch S — the de-dup divergence between updateStatus path's
      @ActivityLog AOP and handleExternalAlerts' manual emission).
