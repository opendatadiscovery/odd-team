behaviour: |-
  **MEDIUM — Response-code drift across the 3 mutating handlers on IngestionController: postDataEntityList returns 200 OK (line 44) but OpenAPI spec declares 201 Created; postDataSetStatsList returns 201 Created (line 86); ingestMetrics returns 201 Created (line 94); createDataSource returns 200 OK (line 72). Three different response-code postures on one controller. The drift is locked in by BaseIngestionTest.java:79 asserting isOk() (200) for postDataEntityList vs isCreated() (201) for ingestStatistics/ingestMetrics. Spec-vs-impl drift has shipped.**

  Verified at primary source:
  - `IngestionController.java:44` — `postDataEntityList` returns `ResponseEntity.ok().build()` (HTTP 200).
  - `IngestionController.java:86` — `postDataSetStatsList` returns `ResponseEntity.status(HttpStatus.CREATED).build()` (HTTP 201).
  - `IngestionController.java:94` — `ingestMetrics` returns `ResponseEntity.status(HttpStatus.CREATED).build()` (HTTP 201).
  - `IngestionController.java:72` — `createDataSource` returns `ResponseEntity.ok().build()` (HTTP 200).
  - `BaseIngestionTest.java:79` — asserts `.expectStatus().isOk()` for postDataEntityList.
  - `BaseIngestionTest.java:87` — asserts `.expectStatus().isCreated()` for ingestStatistics.
  - `BaseIngestionTest.java:95` — asserts `.expectStatus().isCreated()` for ingestMetrics.
  - The OpenAPI spec declares 201 Created for postDataEntityList per the per-method postDataEntityList sidecar (concepts.invariants.[2]) — the spec and code disagree.

  **Operator-visible consequence**:
  - OpenAPI-codegen clients consuming the spec generate 201-expecting handlers; the platform returns 200 for postDataEntityList → silent client-side warning OR fall into a default-handler path.
  - Spec-conformance audits fail.
  - The PATTERN of "3 mutating endpoints, 3 different response postures" is itself a code smell — a reviewer reading the controller sees 200 / 201 / 201 / 200 across consecutive methods with no comment explaining the asymmetry.

  **Why MEDIUM (not LOW)**:
  - The spec is the published contract for collectors building against the IngestionApi interface.
  - The drift is locked in by the test suite (which asserts per-implementation, not per-spec) — meaning a "fix" to align code with spec would BREAK existing tests, requiring coordinated update.
  - This is the canonical case-study of the `openapi-200-vs-201-status-code-drift` concept (cross-pillar invariant at `concepts/detail/invariants/openapi-200-vs-201-status-code-drift.yaml`).

  **Why pin the current behaviour**: the choice between 200 and 201 has semantic meaning (201 implies a resource was created and its URI is in the response). The fix path is either (a) update the spec to declare 200 for postDataEntityList, OR (b) update the code to return 201. The test pins the CURRENT shipped behaviour so the fix is intentional.

  **Distinguishes**:
  - `concepts/detail/invariants/openapi-200-vs-201-status-code-drift.yaml` — the cross-pillar invariant.
  - TEST-GAP-974 (sister this batch) — OwnerController 201-vs-200 drift on create+update.
  - TEST-GAP-966 (sister this batch) — DataCollab 302-vs-301 drift.
