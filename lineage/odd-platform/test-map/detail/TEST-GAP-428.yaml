behaviour: |-
  XSS-payload regression-pin for rehype-sanitize defence-in-depth. Today the shared <Markdown> at Markdown.tsx:112-124 invokes MDEditor.Markdown with NO rehypePlugins override; the bundled rehype-raw expands embedded HTML without sanitization. Probe P-009 empirically proves dangerous TAGS (script, img, iframe) reach the DOM; only Chromium HTML-parser policy + React attribute filtering close execution. A future code change (switching to dangerouslySetInnerHTML, relaxing CSP, SVG onload payload, Firefox/Safari/future Chromium policy changes) re-opens the surface. Tests must (a) assert rehype-sanitize is wired into the pipeline; (b) assert dangerous tags ARE stripped at render-time (not just at execution-time via browser policy); (c) assert curated-safe tags (anchor links, headings, code blocks, images) STILL render.
