# Custom Metadata Field Catalogue — product-owner reflection

## product_owner_narrative

The Custom Metadata Field Catalogue is the small autocomplete dropdown a catalog user
meets the moment they decide to attach a bespoke key/value annotation to a data entity
that the platform's built-in fields (tags, status, owners, description) do not cover —
a `cost_centre`, a `pii_classification`, a `retention_days`. From the user's seat the
feature is a single text box on the per-entity "Add metadata" form: they start typing, a
list of existing field names appears, and they either pick one or keep typing to coin a
new field (per the `MetadataCreateFormItem` autocomplete, described inline at
`MetadataCreateFormItem.tsx:24-109` within the MetadataFieldController sidecar
`audiences` block). The product promise is "reuse the team's existing custom-metadata
vocabulary, and extend it when you need to." This is one half of the Custom Metadata
feature: F-046 is the READ surface (the dropdown you pick from); F-013 is the WRITE
surface (the value you actually save, and the auto-mint of a new field on a previously-
unseen name).

A user interacts with exactly one entry point: `GET /api/metadata/fields`, fired by the
form's autocomplete on focus and on each keystroke, debounced 500ms (per the controller
sidecar `understanding`, citing `MetadataCreateFormItem.tsx:43-51`). The one input is a
free-text `query` string; the server answers with a `MetadataFieldList` of `{id, name,
type, origin}` rows whose `name` contains the typed substring, case-insensitively, scoped
to INTERNAL-origin non-deleted fields (per `ReactiveMetadataFieldRepositoryImpl.java:44-56`,
confirmed by `ReactiveMetadataFieldRepositoryImplTest.testListInternalMetadata`). When the
box is empty the server returns the entire INTERNAL catalogue. Collector-ingested EXTERNAL
fields are never offered here — the origin filter is hardcoded (per
`ReactiveMetadataFieldRepositoryImpl.java:46`).

The working parts are deliberately thin, and that thinness is where the product promise and
the implementation diverge. There is no real pagination: the OpenAPI response embeds a
`page_info{total, has_next}` block (`components.yaml:2111-2120`) that signals "paged"
to every SDK author, but the mapper hardcodes `total = items.length` and `has_next = false`
on every response, and the SQL has no LIMIT/OFFSET/ORDER BY (per `MetadataFieldMapperImpl.java:29-33`
and `ReactiveMetadataFieldRepositoryImpl.java:51-55`, both cited in the controller sidecar
`stress_findings`). There is no read scoping: `/api/metadata/fields` has no SecurityRule, so
any authenticated user — and under `auth.type=DISABLED` any anonymous caller — enumerates
the entire deployment's custom-metadata vocabulary regardless of which entities they can see
(per `SecurityConstants.java` by absence; the controller sidecar `auth_gates`). There is no
ordering contract: rows return in Postgres heap-scan order, which drifts across vacuum cycles.
And there is no case-folding: `cost_centre` and `Cost_centre` are distinct catalogue rows
because the partial unique index is case-sensitive while the search box is case-insensitive
(per the repository sidecar `invariants` and `bugs_limitations_corner_cases`).

The integration story binds F-046 to three neighbours. Upstream, the catalogue is GROWN as a
pure side effect of F-013's write path: `DataEntityServiceImpl.createMetadata` →
`MetadataFieldServiceImpl.getOrCreateMetadataFields` silently mints an INTERNAL row whenever a
user saves a value under a name not already in the catalogue (per the repository sidecar
`upstream_callers` + the F-013 cross-cited sidecar). Sideways, the same `metadata_field` table
is shared with the Collector ingestion pipeline (F-008), which writes EXTERNAL-origin rows the
dropdown never shows. Downstream, the field names a user picks here become FTS-searchable tokens
once a value is written (P-01 search). The catalogue is the vocabulary spine of the whole Custom
Metadata feature, yet it is the least-governed surface in it — a fact already captured at the
issue layer as PLT-025 (and its doc companion DOC-189), which this reflection re-derives top-down.

In a demo a product owner would have to caveat several edge cases. The catalogue grows
monotonically and has no UI delete — a typo'd `cost-centre` lives in the dropdown forever.
A soft-deleted field is worse than permanent: it vanishes from the dropdown but its name still
blocks re-creation with a `UniqueConstraintException`, so a user who "deleted" a field and tries
to recreate it is told it both does not exist (empty dropdown) and already exists (create error)
(per the repository sidecar `bugs_limitations_corner_cases[0]`). At 10,000 fields the endpoint
still returns all of them in one payload on every keystroke-debounce. And nothing on the screen
tells the user that coining a new field name publishes a directory entry visible to every other
user in the deployment.

## hypotheses

- id: H-001
  hypothesis: |
    When a user types "cost" into the metadata-field autocomplete, the response contains every
    INTERNAL-origin custom-metadata field whose name contains "cost" (case-insensitively), and
    excludes collector-ingested (EXTERNAL-origin) and soft-deleted fields.
  derivation: |
    The `query` parameter is named generically as "Search text" (components.yaml:4231-4237); the
    repository binds it to `nameField.containsIgnoreCase(query)` plus `origin = INTERNAL` plus the
    soft-delete filter (ReactiveMetadataFieldRepositoryImpl.java:44-56).
  seed_source: endpoint-shape
  validation:
    verdict: confirmed
    actual_behavior: |
      The chain MetadataFieldController.getMetadataFieldList(query) → listInternalMetadata(query)
      → SELECT * FROM metadata_field WHERE origin='INTERNAL' AND deleted_at IS NULL AND
      LOWER(name) LIKE LOWER('%query%'). The origin filter, soft-delete filter, and
      case-insensitive substring are all present and exercised by an integration test.
    evidence:
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveMetadataFieldRepositoryImpl
        section: operations + invariants
        cite: "ReactiveMetadataFieldRepositoryImpl.java:44-56"
        note: "origin=INTERNAL + addSoftDeleteFilter + containsIgnoreCase(query)"
      - sidecar: odd-platform__java__MetadataFieldController__controller-class__MetadataFieldController
        section: tests_coverage_semantic.covered_behaviours
        cite: "ReactiveMetadataFieldRepositoryImplTest.testListInternalMetadata:34-67"
        note: "5 seeded (3 INTERNAL, 2 EXTERNAL) -> 3 returned; soft-delete one -> 2; substring filter -> 1 match"
    severity: null
    confidence: HIGH
    routes_to_finding: none
    use_case_kind: happy-path
    coverage: verified
    test_ref: "ReactiveMetadataFieldRepositoryImplTest.testListInternalMetadata"
    test_demand: null
    coverage_note: |
      Verified at the REPOSITORY tier only. The repository test pins origin + soft-delete + that
      a substring matches the exact field name. It does NOT prove case-INSENSITIVITY directly (it
      filters by the exact full name, not a case-variant) and does NOT exercise the controller->
      mapper chain. Treated as `verified` for the core happy-path promise (the load-bearing
      origin/soft-delete/substring behaviour is asserted); the case-insensitivity sub-promise is
      carried separately under H-009. routes_to_finding is `none` because a REAL test exists.

- id: H-002
  hypothesis: |
    When a user opens the "Add metadata" form without typing anything, the autocomplete shows the
    custom-metadata fields relevant to the entity they are editing.
  derivation: |
    Product expectation: an autocomplete on a per-entity form scopes its suggestions to that entity's
    context (the form is opened FROM a specific data entity's Metadata panel — MetadataCreateFormItem.tsx).
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |
      An empty query returns the ENTIRE deployment-wide INTERNAL catalogue, identical for every
      entity. The endpoint receives no entity id, consults no ownership or parent-entity context,
      and the ServerWebExchange (which carries the caller principal) is declared but never read
      (MetadataFieldController.java:20-22, "wired but unused"). The dropdown a user sees while editing
      entity A is byte-identical to the one they see editing entity B.
    evidence:
      - sidecar: odd-platform__java__MetadataFieldController__controller-class__MetadataFieldController
        section: invariants + stress_findings.request_inputs
        cite: "MetadataFieldController.java:18-23"
        note: "no entity id parameter; exchange unused; empty query returns ALL non-deleted INTERNAL fields"
      - sidecar: odd-platform__java__repository__reactive__repository__ReactiveMetadataFieldRepositoryImpl
        section: implicit_adrs
        cite: "V0_0_1__init.sql:166-173"
        note: "metadata_field has no tenant/owner/entity scoping column — the registry is global by design"
    operator_visible_failure: |
      A user editing a narrow, sensitive entity is offered the whole organisation's field vocabulary —
      including names other teams coined (`salary_band`, `phi_classification`). Two consequences: (1)
      cross-team vocabulary leakage on every form open (the names themselves are the leak, even before
      any value is written); (2) cognitive noise — in a large deployment the dropdown is hundreds of
      unrelated fields with no entity relevance, defeating the "reuse YOUR vocabulary" promise.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

- id: H-003
  hypothesis: |
    When a user picks an existing field name from the dropdown, the form pre-fills the correct value
    type (STRING / INTEGER / BOOLEAN / ...) for that field, so they cannot save a value of the wrong type.
  derivation: |
    The response carries a `type` field per row (MetadataFieldType enum, components.yaml:2077-2086);
    a typed catalogue promises type-safe value entry.
  seed_source: response-shape
  validation:
    verdict: partial
    actual_behavior: |
      The dropdown DOES auto-populate the `type` SELECT when an existing field is picked (per the
      controller sidecar audiences, MetadataCreateFormItem.tsx). But the `type` is documentation-only
      at write time: the F-013 write path (upsertDataEntityMetadataFieldValue / createMetadata) stores
      the raw value as text with NO coercion or validation against the field's declared type. So the
      pre-fill is cosmetic guidance, not an enforced constraint — a value that contradicts the type is
      accepted.
    evidence:
      - sidecar: odd-platform__java__MetadataFieldController__controller-class__MetadataFieldController
        section: bugs_limitations_corner_cases
        cite: "components.yaml:2077-2086 + cross-ref batch L upsertDataEntityMetadataFieldValue invariants[3]"
        note: "MetadataFieldType is a vocabulary, not a constraint; write side ignores it"
      - sidecar: odd-platform__java__DataEntityController__controller-method__upsertDataEntityMetadataFieldValue
        section: bugs_limitations_corner_cases (no_type_validation_against_metadata_field_type)
        cite: "DataEntityServiceImpl.createMetadata / upsertMetadataFieldValue"
        note: "raw text stored; no type coercion at write"
    operator_visible_failure: |
      A user picks a field declared INTEGER, types "n/a", and the platform saves it. Later consumers
      (BI tools, downstream SDK clients reading metadata_field.type=INTEGER) parse the value as an
      integer and fail or silently mis-type. The catalogue's `type` column promises a contract it does
      not enforce; the read surface accurately REPORTS the type, the write surface ignores it — a
      split-brain between F-046's display and F-013's storage.
    severity: MEDIUM
