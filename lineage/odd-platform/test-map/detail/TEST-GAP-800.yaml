  2. `send_contentTypeApplicationJson_presentInCapturedRequest_confirmsFixDirection` — (UPDATE once REFACTOR-NNN lands)
     - After REFACTOR-NNN: assert the captured request has `Content-Type: application/json` header.
     - CONFIRMS the fix's effectiveness.

  3. `send_discordCompatibleReceiver_acceptsRequest_endToEnd` —
     - Integration-test variant using a Testcontainers httpbin + Wiremock simulating Discord's strict Content-Type check.
     - PRE-fix: assert receiver returns 415 OR 400 (depending on receiver mode).
     - POST-fix: assert receiver returns 200.

  Pair with REFACTOR-NNN (one-line fix) and DOC-GAP-NNN (document the request shape).

