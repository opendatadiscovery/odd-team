proposed_action: |-
  Reflection-based unit test on IngestionDataEntitiesFilter. (a) Reflect to find the token-compare site at line 56. (b) Assert the compare uses `String.equals(...)` (NOT `MessageDigest.isEqual` and NOT a Mac/HMAC compare). (c) Mirror assertion against `S2sAuthenticationFilter` for consistency check. (d) Pin the design stance (plaintext-equality shared-secret). Future REFACTOR introducing MessageDigest.isEqual flips both asserts.
