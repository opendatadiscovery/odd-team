proposed_action: |-
  Add `EventApiControllerSlackSignatureVerificationTest`:

  1. `post_slackEvents_currentImplementation_acceptsAnyPayloadWithoutXSlackSignatureHeader_pinsVulnerability` — WebTestClient `.post().uri("/api/slack/events").bodyValue(forgedMessageEvent).exchange().expectStatus().isOk()`. Comment block: '// REGRESSION-PIN — current implementation accepts unverified events. When TEST-GAP-959 is fixed, this test MUST FLIP to expectStatus().isUnauthorized() and a sibling test asserting valid HMAC signature is accepted is added.'
  2. `post_slackEvents_currentImplementation_acceptsForgedMessageEvent_writesToMessageProviderEventTable_pinsExploit` — assert the exploit chain: forged POST → assert `message_provider_event` table contains a new PENDING row → assert no audit log entry.
  3. `post_slackEvents_currentImplementation_acceptsCrossWorkspaceEvent_noTeamIdValidation` — POST with a `team_id` not matching the configured Slack app's installation → assert 200 (the vulnerability extends to cross-workspace forgery).
  4. Pair with REFACTOR-NNN-candidate (add HMAC-SHA256 verification filter) and DOC-GAP-NNN-candidate (live docs MUST warn).

  Coherence note (LSN-018 Rule 6): NET-NEW. Dedup query "EventApiController Slack webhook signature verification" returned only F-009 webhook-no-HMAC TEST-GAP-799 (HIGH — outbound webhook from ODD to consumer) — opposite direction. TEST-GAP-959 is the INBOUND complement. STRENGTHENS no existing entries.
