proposed_action: |-
  Add `DatasetFieldTagParentScopedAuthTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `updateDatasetFieldTags_callerWithoutParentDataEntityPermission_returns403` — caller with NO `DATASET_FIELD_TAGS_UPDATE` on the parent data entity; `PUT`; assert 403.
  2. `updateDatasetFieldTags_callerWithParentScopedGrant_returns200` — caller with a `dataEntity:owner`-conditional `DATASET_FIELD_TAGS_UPDATE` on the parent; `PUT`; assert 200.
  3. `updateDatasetFieldTags_callerScopedToDifferentDataEntity_returns403` — caller authorized for data entity B's fields; `PUT` on a field of data entity A; assert 403. PINS that `getDataEntityIdByDatasetFieldId` resolves to the correct parent.
  4. `updateDatasetFieldTags_emptyList_removesInternalButPreservesExternalStatistics` — seed a field with one INTERNAL relation AND one EXTERNAL_STATISTICS relation; `PUT` `{"tags":[]}`; assert the INTERNAL relation is gone AND the EXTERNAL_STATISTICS relation survives.
  5. `updateDatasetFieldTags_replaceAll_doesNotTouchExternalStatistics` — seed an EXTERNAL_STATISTICS relation; `PUT` `{"tags":["ui-tag"]}`; assert the field ends with `{ui-tag (INTERNAL), <ingested> (EXTERNAL_STATISTICS)}`.

  Pair with a DOC-NNN: document that `DATASET_FIELD_TAGS_UPDATE` resolves against the dataset field's PARENT data entity (so granting it for a data entity grants tag-edit on all its fields).
