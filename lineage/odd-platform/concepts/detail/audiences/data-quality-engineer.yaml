security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      The role's primary surface (the /data-quality dashboard) is reachable
      by any authenticated user with no permission gate. The role is not
      Permission-bound; any authenticated user CAN act as a Data Quality
      Engineer on the dashboard's read surface. The lone write surface
      (PUT /api/datasets/{id}/dataqatests/{tid}/severity) IS gated via
      DATASET_TEST_RUN_SET_SEVERITY permission + owner association — the
      role's mutation power requires a Permission, not the role's name.
  owner_scoping:
    verdict: MIXED
    detail: |-
      Reads (the dashboard + per-dataset test reports + SLA badges) are
      cross-owner — the role sees all datasets. The severity-set mutation
      is owner-scoped — the role can only annotate datasets they own.
      This matches ODD's read-collaborative + owner-scoped-write pattern.
  strengths:
    - |-
      The role's surfaces are well-aligned with the read-collaborative
      catalog posture: any team member CAN inspect quality, only owners
      CAN modify quality-related annotations.
  weaknesses:
    - |-
      The cross-owner read posture is undocumented on every Data Quality
      doc page. The role's effectiveness is improved by knowing they can
      see all datasets; the docs do not tell them this is by design.
  cross_file_inconsistencies: []
  contributing_files:
    - DataQuality.md
    - DataQualityContent.md
    - DataQualityFilters.md
    - TestCategoryResults.md
  evidence:
    - DataQuality.md:security.authorization_assertions
    - DataQualityContent.md:security.known_security_gaps.[0]
