    A user cannot set a severity on a test belonging to a soft-deleted (logically removed)
    dataset, or on a soft-deleted test — the mutation is rejected for entities the catalog
    considers deleted.
  derivation: 'negative-space — DataEntityStatusDto.DELETED is the soft-delete tombstone; a user expects mutations on a deleted entity to be refused.'
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |-
      The only existence guard in setDataQualityTestSeverity is existsIncludingSoftDeleted on
      both the dataset and the test (DataQualityServiceImpl.java:67-68) — which by name returns
      true for soft-deleted entities. So the write succeeds against a soft-deleted dataset and a
      soft-deleted test. (Note: the SLA/test-report READ queries DO exclude
      STATUS=DELETED tests via dataQualityTest.STATUS.ne(DELETED) —
      ReactiveDataQualityRepositoryImpl.java:56,78,122 — so a severity written to a deleted test
      lands in the table but is then filtered out of every read.)
    evidence:
      - sidecar: '(absent — source read for validation)'
