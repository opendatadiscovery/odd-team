mitigations_unimplemented:
  - |-
    Doc enhancement — every feature's permission grid in the
    /configuration-and-deployment/enable-security/authorization/permissions
    page should annotate each permission with its resolver (QUERY_EXAMPLE /
    DATA_ENTITY / TERM / DATASET_FIELD / NO_CONTEXT). Operators authoring
    Policies need this to scope correctly.
  - |-
    Doc enhancement — feature-pillar pages (e.g. data-modelling/query-examples,
    data-glossary, data-discovery) should disclose the cross-controller
    split — when a permission lives on a DIFFERENT controller than the
    feature's primary surface, that should be visible to operators reading
    the feature page.
  - |-
    Code annotation — add JavaDoc-style cross-references on the controller
    methods that own non-self-resource permissions (e.g.
    DataEntityController.createQueryExampleToDatasetRelationshipNew should
    have a JavaDoc note: 'gates QUERY_EXAMPLE_DATASET_CREATE — owned by
    this controller because the resolver is DATA_ENTITY (dataset-scoped),
    not QUERY_EXAMPLE'). The annotation gives the next code reader the
    architectural intent.
  - |-
    Build-time scanner Rule R2 (from the 5-failure SecurityConstants
    invariant) — every SecurityRule's resource-extractor MUST match the
    permission's documented scope. The R2 rule subsumes the pattern: if
    QUERY_EXAMPLE_DATASET_CREATE is documented as 'scoped to dataset', the
    resolver must be DATA_ENTITY. Catches wrong-resolver wiring at build
    time.
notes: |-
  NEW pattern invariant captured in batch 2026-05-20V from the
  QueryExampleController class-level sidecar's cross-controller observation,
  triangulated against TermController batches K + U and against the
  DatasetFieldController batch V SecurityConstants finding. The pattern
  is structural — visible only by cross-reading three controllers'
  SecurityRules layouts — and previously implicit in the catalog.

  Cross-cutting connections:
    - 5-failure SecurityConstants invariant: securityconstants-wiring-failures-count-grows-to-5-fourth-and-fifth-from-batch-v
      (Failure 4 — wrong resolver at the DatasetFieldController /terms POST
      endpoint — is a direct violation of this pattern)
    - Build-time scanner Rule R2: the proposed name-prefix consistency
      check turns the implicit pattern into an enforced invariant
    - Doc gap on the canonical permissions page: operators reading the
      flat grid can't infer the resolver

  Two DOC-NNN candidates flow:
    (a) Annotate each permission with its resolver on the live
        /authorization/permissions page
    (b) Disclose the cross-controller split on each feature-pillar page

  The pattern itself is SOUND architecture — fine-scope Policy authoring
  IS possible because of the split — but the cost of that capability is
  poor doc discoverability and the build-time-scanner-absent failure
  mode the 5-failure invariant catalogs.
