behaviour: 'Bean-graph contract for LOGIN_FORM mode: no Spring-context test asserts
  that `securityWebFilterChainLoginForm` is present when `auth.type=LOGIN_FORM` AND
  that `AuthorizationCustomizer` is ABSENT. The absence of `AuthorizationCustomizer`
  is the central LOGIN_FORM finding (TEST-GAP-140); a Spring-context test that asserts
  the bean-graph shape would catch any future refactor that wires it in (or removes
  it from OAUTH2/LDAP).'
