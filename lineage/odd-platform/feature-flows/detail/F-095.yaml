feature_id: F-095
feature_name: |-
  Dataset-Field Statistics Ingestion — cross-dataset write surface
  (`POST /ingestion/entities/datasets/stats`) accepts any field-ODDRN regardless
  of payload parent-dataset claim
pillar_id: P-10
pillar_anchored_id: P-10:F-003
pillar_anchored_feature_name: |-
  Statistics ingestion endpoint cross-dataset write surface — field-ODDRN
  resolves writes; payload's parent `datasetOddrn` is used only for FTS
  recalc, never validated against the resolved field's actual parent
seeded_from: SHB-125
seeded_at: 2026-05-26
batch_origin: 'batch-shoebox-graduation 2026-05-26 — slice G'

