behaviour: |-
  Search-session UUID cross-user enumeration regression-pin for the FACET ENDPOINT FAMILY (HIGH — cross-pillar P-01+P-09; second invocation site after TEST-GAP-252 at /search). STRENGTHENS TEST-GAP-252 by extending it from /search-create + /search-results to the facet endpoints AND criticality-bumping from LOW to HIGH given the additional data exposure surface (cross-owner facet counts). The `search_facets` table schema (`V0_0_1__init.sql:204-211`) has NO `owner_id` / `created_by` / `user_id` column — the UUID is the sole identifier. `SearchServiceImpl.search` creates a row WITHOUT capturing the caller's principal (`SearchServiceImpl.java:75-82`); `updateFacets` reads+merges+writes WITHOUT checking ownership (`SearchServiceImpl.java:84-96`); `fetchFacetState(searchId)` does a raw lookup with NO owner predicate (`SearchServiceImpl.java:157-160`); `ReactiveSearchFacetRepositoryImpl.get` (lines 99-106) is a raw UUID-keyed UPDATE-RETURNING. Any authenticated user with knowledge of any other user's UUID can read AND mutate that user's session state via: `GET /api/search/{search_id}`, `GET /api/search/{search_id}/facet/{facet_type}`, `PUT /api/search/{search_id}` (updateSearchFacets), `POST /api/search/{search_id}` (searchByQuery resync), `GET /api/search/{search_id}/results`. Concrete impact: (a) an operator who copies a search URL into a bug report exposes their entire saved-filter state including `My Objects` posture, (b) a CSRF-style cross-tab actor with read access to URL bars in the browser can hijack the session, (c) an authenticated attacker can probe `GET /api/search/{guess}/facet/OWNERS` UUIDs — most return 404, but a hit yields full facet drill-down of another user's session including the cross-owner catalog cardinality (TEST-GAP-518). The UUID space is 122-bit `gen_random_uuid()` so brute-force is infeasible, but URL leakage is not. The TODOs at `V0_0_1__init.sql:206-207` (`more clever way to generate uuid` + `find a way to define TTL`) acknowledge maintenance gaps but no migration addresses the unscoped posture. Under `auth.type=DISABLED` the endpoints become anonymously reachable AND unbound — combined effect: any unauthenticated client on the network can probe UUIDs and read facet drill-downs. Cross-pillar P-01 (Discovery — search session state) + P-09 (Security — session ownership model).
