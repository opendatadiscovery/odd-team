description: |-
  NEW ENTITY, batch ZJ — the inner widget rendered inside the SPA's
  `<AppToolbar>` at AppToolbar.tsx:64 that owns the entire top-bar
  tab list. A single 138-line component (`components/shared/elements/
  AppToolbar/ToolbarTabs/ToolbarTabs.tsx`) that:

    (a) Builds a static, hard-coded array of NINE `AppTabItem`s
        in the order Catalog / Directory / Data Quality / Data
        Modelling / Master Data / Management / Dictionary / Alerts /
        Activity at lines 34-82.

    (b) Wires each tab to a route-helper function from `routes/`
        (`searchPath`, `directoryPath`, `dataQualityPath`,
        `queryExamplesPath`, `lookupTablesPath`, `managementPath`,
        `termsSearchPath`, `alertsPath`, `activityPath`).

    (c) Computes selected-tab from `useLocation().pathname` via a
        substring scan against `tab.value` (lines 86-105) — two
        special-case branches: '/' produces `selectedTab=-1` (no
        tab); search/dataentities/* selects tab 0 (Catalog).

    (d) Delegates rendering to the generic `<AppTabs>` primitive
        in `type='menu'` mode.

  **Two tabs have non-trivial onClick handlers**:
    - 'Catalog' click dispatches `createDataEntitiesSearch` via
      useCreateSearch then navigates to /search/<newId>
      (ToolbarTabs.tsx:121-123).
    - 'Dictionary' click dispatches `createTermSearch` then
      navigates to /termsearch/<newId> (ToolbarTabs.tsx:111-119).

  The other seven tabs are pure `<Link to=...>` navigations.

  **Structurally UNCONDITIONAL visibility** — there is no permission
  read, no feature-flag read, no role check. Every authenticated
  user (and every anonymous DISABLED-mode caller) sees ALL NINE
  tabs (per the `management-tab-visible-to-all-authenticated-users-
  unpermissioned-tab-visibility` invariant). `useMemo` dependency
  is `[t, activityQueryString]` only.

  **The selected-tab heuristic is fragile** — substring-match via
  `pathname.includes(tab.value)` works today because the
  `tab.value` strings are happen to be unambiguous, but renaming
  any route helper without updating the matching `value` literal
  silently breaks tab-highlighting (no test catches it).

  **The `tab.value` string is NOT the URL path** — it is a hand-
  picked discriminator. E.g. the Catalog tab has NO `value` field
  (relies on the dedicated `searchPath / dataEntitiesPath`
  substring branch). The Master Data tab has `value: 'master-data'`
  but the URL is `/master-data/lookup-tables`.

  **Routes that the labels do NOT match** (4 label-URL drifts,
  batch ZJ per ToolbarTabs.md docs_link_semantic.doc_drift_findings):

    - 'Catalog' tab navigates to `/search` (not `/catalog`)
    - 'Dictionary' tab navigates to `/termsearch` (not
      `/dictionary` or `/terms`)
    - 'Data Modelling' tab navigates to `/data-modelling/
      query-examples` (NOT an overview page; lands on Query
      Examples specifically)
    - 'Master Data' tab navigates to `/master-data/lookup-tables`
      (one-feature-pillar today; will be DRIFT when a second
      feature lands)

  The `AppTabs` primitive supports `hidden` and `disabled` per-
  AppTabItem (AppTabs.tsx:17-18) but ToolbarTabs NEVER sets either.
  Dead code at this caller.

  **The component IS the canonical source for 'what top-level
  surfaces exist'** — reordering or feature-flag-gating tabs
  requires editing this file. No ADR or config-driven mechanism
  exists.
