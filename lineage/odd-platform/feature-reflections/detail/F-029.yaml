      Integrations/Lineage/Query Examples/Reference Data/Relationships) while the spec partitions
      operations across 35 tags — 26 tags (incl. dataEntity, the largest at 45+ ops) had NO doc-side
      sub-page; the hub abdicated to Swagger UI without naming the gap. (b) Existence: the hub page
      itself is now a 404 (WebFetch 2026-06-01 of /developer-guides/api-reference). The parent
      /developer-guides landing still exists and lists the 10 feature endpoint pages + the ADR log,
      but the dedicated 'canonical reference hub' the spec sidecar anchored to has been removed/
