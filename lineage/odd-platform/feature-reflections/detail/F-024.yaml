- id: H-007
  hypothesis: "When a user clicks a facet and then immediately presses Enter on a new text query (or vice versa), the final Dictionary view reflects both intentions and does not silently drop the facet selection."
  derivation: "Negative-space — two concurrent session-mutating dispatches (facet PUT with filters vs text PUT with filters:{}) race against the same session row."
  seed_source: negative-space
  validation:
    verdict: partial
    actual_behavior: |
      Both dispatches hit PUT /api/termsearch/{searchId} with DIFFERENT payloads —
      the facet PUT carries filters:mapValues(termSearchFacetParams), the text-query
      PUT carries filters:{} (it RESETS filters). On the SERVER, updateFacets does NOT
      blindly overwrite — it merges the form delta into the current persisted state
      (FacetStateDto.merge, TermSearchServiceImpl.java:84-86) — but a text PUT whose
      mapped form carries an empty/cleared filter set can still clear the just-applied
      facet depending on the merge semantics of an explicitly-empty facet group, and
      the client slice's updateTermsSearchState is last-write-wins on the round-trip
      (TermSearch.md bugs[4]). Works correctly when the two actions are not interleaved
      within the round-trip window; can lose the facet when they are.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__TermSearch.md
        section: bugs_limitations_corner_cases
        cite: "TermSearch.tsx:50-58 + TermSearchInput.tsx:25-28"
        note: "Facet PUT carries filters; text PUT carries filters:{} — last-write-wins on the client."
      - sidecar: "(source) odd-platform-api/.../service/term/TermSearchServiceImpl.java"
        section: updateFacets
        cite: "TermSearchServiceImpl.java:82-90"
        note: "Server merges delta into persisted state (FacetStateDto.merge) — not a blind overwrite."
    operator_visible_failure: |
      An operator who clicks the 'compliance' namespace facet and then immediately
      types a term name and hits Enter can have the facet silently cleared (the text
      submit ships an empty filter group and resolves second on the client). The user
      perceives "I filtered to compliance and searched, but I'm getting results from
      every namespace" — a confusing, intermittent loss of intent. Rare in practice
      (requires interleaving within the PUT round-trip) but reproducible on a slow
      connection. The exact server merge behaviour for an explicitly-empty facet group
      is the part that should be probed/tested to settle whether this is server- or
      client-side.
    severity: LOW
    confidence: MEDIUM
    use_case_kind: edit-reconcile
    coverage: unverified
    test_demand: functional
    routes_to_finding: caveat-candidate

