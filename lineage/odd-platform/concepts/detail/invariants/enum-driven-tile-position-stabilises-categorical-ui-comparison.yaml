name: Enum-driven tile position stabilises categorical UI comparison (Dashboard pattern)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  `TestCategoryResults` deliberately discards the order the backend
  serialised `results[]` in and rebuilds the array by iterating
  `Object.values(DataEntityRunStatus)` (the enum's declaration order:
  SUCCESS, FAILED, SKIPPED, BROKEN, ABORTED, UNKNOWN) and `find`-ing
  each status (`TestCategoryResults.tsx:19-25`):
  `Object.values(DataEntityRunStatus).map(status => results.find(r => r.status === status)).flatMap(f => (f ? [f] : []))`.
  NEW invariant, batch ZC (2026-05-22).

  The decision is visible in the code shape: a plain `results.map(...)`
  would have been shorter; the developer chose the enum-driven re-sort
  specifically so every category row shows its SUCCESS / FAILED / SKIPPED
  / BROKEN / ABORTED / UNKNOWN tiles in the SAME HORIZONTAL SLOTS, making
  the dashboard columns visually comparable across category rows. The
  same enum-iteration pattern is used for the shared dashboard legend
  in DataQualityContent.tsx:83-89, so legend order and tile order are
  guaranteed to match.

  The invariant is the explicit choice of declaration-order over either
  (a) value-order (e.g. sorted by count) or (b) server-order (whatever
  the backend serialised) for a categorical dimension where horizontal
  alignment across rows matters.

  Failure mode masking dead branch: the `flatMap(f => (f ? [f] : []))`
  silently DROPS statuses absent from `results[]` rather than emitting
  zero-count placeholders. In production this never triggers (the
  backend `DataQualityCategoryMapperImpl.addMissingStatuses`
  (DataQualityCategoryMapperImpl.java:45-60) injects a zero-count
  `DataQualityRunStatusCount` for every absent status — so every
  category's `results[]` always carries all six entries). The drop
  branch is dead code, but it MASKS a cross-tier coupling: the UI's
  column-alignment correctness depends on a backend mapper guarantee
  that nothing in the UI asserts. Captured separately in the
  `category-row-status-tile-six-status-backend-guarantee-silent-cross-tier-coupling`
  invariant.
