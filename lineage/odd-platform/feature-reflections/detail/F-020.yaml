- id: H-014
  hypothesis: "When an operator deletes a collector that still has data sources registered against it, the platform refuses the delete (it does not silently remove a collector that producers still depend on)."
  derivation: "UI label ('Delete' opens a ConfirmationDialog) + the universal operator expectation that destroying a parent with live children is blocked, not silently cascaded; the service-tier cascade-block pattern shared across Management entities."
  seed_source: negative-space
  validation:
    verdict: confirmed
    actual_behavior: |
      Delete is cascade-protected at the application layer. CollectorServiceImpl.delete
      (lines 71-80) checks dataSourceRepository.existsByCollector(id); if any
      non-soft-deleted DataSource references the collector, it errors with
      CascadeDeleteException and the collector is NEVER removed; otherwise it
      soft-deletes and returns the id. A delete of a missing collector errors
      NotFoundException. This is the feature behaving as an operator expects:
      retiring a collector is blocked while producers still depend on it. (Note:
      this is the DELETE-SAFETY promise, distinct from H-007's credential-retention
      promise — H-007 remains contradicted because the cascade-blocked-or-allowed
      delete still leaves the TOKEN row orphaned when it DOES proceed.)
    evidence:
      - sidecar: odd-platform__java__CollectorController__controller-class__CollectorController.md
        section: "concepts.invariants[4] (delete cascade-protected via existsByCollector)"
        cite: "CollectorServiceImpl.java:71-80 + ReactiveDataSourceRepositoryImpl.java:124-132"
        note: "existsByCollector gate throws CascadeDeleteException before the soft-delete commits."
      - sidecar: "(test, source_read_for_validation: true)"
        section: "CollectorServiceImplTest"
        cite: "odd-platform-api/.../service/CollectorServiceImplTest.java:67-95"
        note: "@validates F-020 — delete_collectorWithAssociatedDataSources_errorsCascadeDeleteAndNeverDeletes uses a poison-Mono to assert the delete never subscribes on the blocked path; delete_collectorWithoutDataSources_deletesAndReturnsId + delete_collectorNotFound_errorsNotFound cover the other arms. New since the 0.2.0 reflection."
    severity: null
    confidence: HIGH
    use_case_kind: teardown-constraint
    coverage: verified
    test_ref: "CollectorServiceImplTest.delete_collectorWithAssociatedDataSources_errorsCascadeDeleteAndNeverDeletes (+ delete_collectorWithoutDataSources_deletesAndReturnsId)"
    test_demand: none
    routes_to_finding: none
    routes_note: |-
      NEW hypothesis in v0.3.0 (folded into H-007's evidence in 0.2.0, now standalone). Confirmed AND
