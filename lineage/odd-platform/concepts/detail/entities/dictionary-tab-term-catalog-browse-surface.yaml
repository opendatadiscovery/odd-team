name: Dictionary tab — Term catalog browse surface (UI shell for P-06 Data Glossary)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-06
description: |-
  NEW ENTITY, batch 2026-05-20U — the user-facing entry point at
  /termsearch/* for the platform's Business Glossary (P-06 Data
  Glossary pillar's Dictionary tab). Documented on the live
  business-glossary.md page (WebFetched 2026-05-20 status 200) as
  'The catalog-wide list of all terms in the platform' with three
  declared user actions: browse terms across every namespace; create
  a new term (gated by TERM_CREATE); open a term's detail page to
  edit description / manage owners / link to other terms / review
  linked data entities.

  ## STRENGTHENED — batch ZH (2026-05-26)

  Batch ZH adds the URL-shape contract: `termsRoutes.ts` declares
  TWO module-private base paths — `BASE_PATH = '/terms'` and
  `TERMS_SEARCH_PATH = '/termsearch'`. The Dictionary tab in
  ToolbarTabs.tsx:67 is wired to `termsSearchPath()` (i.e.
  `/termsearch`); search results link to `termDetailsPath(id)`
  (i.e. `/terms/:termId/overview`). The route module also exposes:
    - `termsPath()` returning `/terms` (ONLY consumer is App.tsx:66
      route mount; no navigate-to-bare-`/terms` callers exist)
    - `useTermsRouteParams()` hook that coerces `termId` via
      `parseInt(termId, 10)` with NO isNaN guard (per the
      `useparams-type-lie-parseint-nan-coercion` invariant)
    - `TermDetailsRoutes` frozen object literal with 5 sub-tabs
      (Overview / Linked entities / Linked columns / Linked terms /
      Query examples) — the 5-member taxonomy is fixed at compile
      time

  **Two batch-ZH-confirmed name-vs-behaviour drifts on this surface**:
    (a) **`/terms` bare URL renders blank** — App.tsx:66 declares
        the parent with one child :termId/* and NO index route, NO
        element. Operator typing `/terms` sees blank beneath toolbar.
        Pinned by P-164. Per the
        `bare-base-url-behavior-divergence-redirect-vs-blank` invariant.
    (b) **Live doc says 'list', code shows 'search'** — Business
        Glossary doc page (WebFetched 2026-05-26 status 200) says
        "The Dictionary tab is the catalog-wide list of all terms in
        the platform"; the actual Dictionary tab lands the user on
        the search UI with facets and an empty result set until they
        type a query.

  ## ORIGINAL — batch U

  ARCHITECTURAL SHAPE:
    Root component: TermSearch.tsx (90-line shell) at
    components/Terms/TermSearch/TermSearch.tsx.

    Sub-components (Terms/TermSearch/ subtree):
      - TermSearchHeader.tsx — top header carrying the search input
        and the Add-term CTA (gated by Permission.TERM_CREATE via
        WithPermissions).
      - TermSearchInput.tsx — free-text search input; dispatches
        synchronously on Enter / search-click (bypasses the 1500ms
        debouncer that wraps facet changes).
      - TermSearchFilters.tsx — left sidebar with faceted filters
        (namespace + owner + tag axes).
      - TermSearchResults.tsx — main result list with infinite-scroll
        pagination + EmptyContentPlaceholder.
      - TermSearchResultItem.tsx — per-row rendering of
        name + namespace + owners + usingCount + createdAt + updatedAt.

    Backend wiring (server-side search session):
      - POST /api/termsearch (TermController.termSearch) — creates
        a server-side session UUID surfaced in the URL.
      - GET /api/termsearch/searchId (TermController.getTermSearchFacetList) —
        restores session from URL on reload / deep-link.
      - PUT /api/termsearch/searchId (TermController.updateTermSearchFacets) —
        mutates facet state.
      - GET /api/termsearch/searchId/results (TermController.getTermSearchResults) —
        paginated results for infinite-scroll.

  DISTINCTIVE PROPERTIES:
    - URL-backed session state (deep-link share-able): a colleague
      receiving the URL /termsearch/uuid lands on the same filtered
      view.
    - Server-side session lifecycle: search_facets row evicted at
      30 days default per SearchFacetsHousekeepingJob (F-010 housekeeping).
    - Read-collaborative posture: every authenticated user sees every
      term across every namespace; no UI filter affordance for
      per-namespace or per-owner scoping (per the
      f-002-cross-namespace-term-pollution-ui-surface-confirmed
      invariant).
    - Permission-gated mutations: Add-term CTA hidden when
      Permission.TERM_CREATE absent; list + search + filters render
      unconditionally (per the partial-permission-gating master
      invariant).
    - 1500ms leading-edge debouncer for facet-state mutations (text
      query bypasses; intended coalescing is currently broken — per
      the broken-debouncer-pattern invariant from this batch U).
    - Pagination contract: pageSize=30 hardcoded at TermSearch.tsx:36
      AND TermSearchResults.tsx:38 (two literals must stay aligned).
    - Empty-state copy 'No matches found' — does not distinguish
      fresh-deployment from filter-returned-nothing (UI-DOC-GAP).

  CROSS-FEATURE COMPOUNDS:
    - The catalog read flows through ReactiveTermRepositoryImpl
      (batch N — repository sidecar) which DOES NOT filter
      term_to_term.deleted_at (V0_0_91 schema drift — DEAD schema
      classification per the batch U disambiguation invariant).
    - The 7 TERM_* permissions per Business Glossary docs gate
      MUTATIONS only; reads are uniform.
    - Cross-pillar wiring with the F-002 Term-to-Entity Linkage
      feature flow: this UI is the OPERATOR ENTRY POINT for the
      term-catalog half.

  AUDIENCES:
    - odd-platform-ui-end-user — the Dictionary tab is reachable from
      top-nav SPA navigation.
    - data-engineer-analyst — primary curator audience.
    - data-scientist-ml-engineer — terms describe domain concepts
      consumed by ML model documentation.
    - data-steward-owner — owners attached to terms see their terms
      alongside the rest of the catalog; no visual distinction.

