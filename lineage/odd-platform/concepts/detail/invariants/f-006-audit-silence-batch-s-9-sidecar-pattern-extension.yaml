notes: |
  This invariant is the BATCH S strengthening artefact for the master
  audit-silence pattern. Rather than re-write the 900-line master file
  (which carries cumulative cross-batch history and would risk YAML
  fragility), this batch S extension records the 9-sidecar pattern at
  a separate detail file. The rebuild_indexes.py rolls both into the
  index together.

  The master entry (`no-audit-log-on-rbac-mutations-...-batch-f`) remains
  the canonical home for the multi-batch narrative; this batch S extension
  is the focused service-tier closure marker. Future readers should
  consult BOTH files for the full picture; this file is the load-bearing
  service-tier evidence consolidation.

