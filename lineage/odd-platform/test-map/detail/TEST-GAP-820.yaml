behaviour: |-
  **HIGH — Statistics ingestion is an unauthenticated side-channel for catalog tag taxonomy population.**

  `DatasetFieldServiceImpl.updateStatistics` (line 202) calls `tagService.getOrCreateTagsByName(tagNames)` for every tag name in the payload's `DataSetFieldStat.tags` array. This CREATES catalog `tag` rows for tag names that don't exist — bypassing the `TAG_CREATE` permission that gates the UI's Tags-management surface (the Management tab's Tags is RBAC-gated; the stats path is the bypass).

  **Bypass chain**:
  1. Attacker submits unauthenticated `POST /ingestion/entities/datasets/stats` (per TEST-GAP-819's unauthenticated reach).
  2. Payload includes `tags: [{name: "any-string"}]` on any `DataSetFieldStat`.
  3. `tagService.getOrCreateTagsByName` inserts new tag rows for unseen names.
  4. New tags are stamped `TagOrigin.EXTERNAL_STATISTICS` (`TagOrigin.java:6`) — distinguishing them from `INTERNAL` (UI-curated) tags.
  5. Tags become discoverable by all authenticated users via tag search and tag-filter facets.
  6. Tags persist in the catalog tag namespace until manually deleted by a UI admin.

  **Why HIGH** (the sidecar rates MEDIUM):
  - The bypass is **silent** — no audit log entry on tag creation via this path.
  - The bypass **persists** — tags remain in the namespace after the attack.
  - The bypass **propagates** — every tag is discoverable across all UI surfaces (autocomplete, filter facet, tag-popularity ranking via the `listMostPopular` CTE — TEST-GAP-545 sister).
  - The bypass **mocks the RBAC model** — `TAG_CREATE` is gated for a reason (preventing namespace pollution); the side-channel renders it ineffective for any deployment where the ingestion endpoint is reachable (i.e. every shipped deployment per TEST-GAP-819).

  **Concrete operator impact**:
  - Attacker populates catalog with `tags: [{name: "PROD-CRITICAL"}, {name: "DEPRECATED"}, {name: "SENSITIVE-PII"}]` — confusing UI users about data classification.
  - Attacker pollutes the tag-popularity ranking by injecting thousands of unique tag names.
  - Combined with the no-rate-limit posture (TEST-GAP-816 family), the attacker can scale to thousands of tag-creations per second.

  **Test gap shape**: regression-pin test that:
  1. Asserts unauthenticated POST with novel tag names CREATES rows in the `tag` table.
  2. Asserts the created rows carry `origin = 'EXTERNAL_STATISTICS'`.
  3. Asserts no `activity_event` row is emitted for the tag creation.
  4. Asserts the tags appear in `GET /api/tags?...` listing.
