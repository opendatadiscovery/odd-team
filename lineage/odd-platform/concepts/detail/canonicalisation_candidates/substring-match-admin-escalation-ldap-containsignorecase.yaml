proposed_canonical: Substring-match admin escalation (LDAP containsIgnoreCase)
rationale: 'Single-sidecar canonical evidence from batch C (LDAPSecurityConfiguration@L51).
  Admin-group match uses `containsIgnoreCase` (substring matcher imported from `OperationUtils`)
  — `admin-groups: [''Admin'']` matches `cn=Administrators` AND `cn=NonAdminContractors`.
  Live LDAP docs say ''A list granting admin permissions'' with no warning. Doc +
  code candidate: switch to equality match or document the substring semantics with
  explicit warning.'
contributing_concepts:
- LDAPSecurityConfiguration.java:96 (containsIgnoreCase call site)
- OperationUtils.containsIgnoreCase (substring matcher)
- admin-groups allowlist semantics
suggested_add_to_docs: true
superseded:
  by_batch: 2026-05-19-O
  by_sidecars:
    - odd-platform__java__auth__handler__GithubUserHandler.md
    - odd-platform__java__auth__handler__GoogleUserHandler.md
  superseded_at_commit: 80637ed
  status: RETRACTED-FACTUALLY-WRONG
  retraction_reason: |-
    The original candidate claim that `OperationUtils.containsIgnoreCase`
    performs SUBSTRING matching is FACTUALLY WRONG. Verified by direct
    Read of `/odd-platform-api/.../utils/OperationUtils.java` at commit
    80637ed (see source-verification below). The helper performs
    FULL-STRING case-insensitive equality, not substring matching.
    Three call sites use this helper and ALL THREE are full-string-equality:
    (1) LDAPSecurityConfiguration.java:94-97 (LDAP admin-group match),
    (2) GithubUserHandler.java:114-119 + 122-131 (GitHub admin-team match
        scoped within organizationName + team.name equality),
    (3) GithubUserHandler.java:135-137 (GitHub org-membership match
        on org.login).
    The GoogleUserHandler.java:60 admin-principals check ALSO uses the
    same helper and is therefore also full-string equality.
    The original sidecar's "substring-collision admin escalation" worked
    example (`admin-groups: ['ops']` matches `devops` / `noops` / `oopsgroup`)
    DOES NOT OCCUR — those are not full-string matches and would not match.
  source_verification: |-
    OperationUtils.java verbatim (commit 80637ed, lines 5-11):
        public final class OperationUtils {
            public static boolean containsIgnoreCase(final Collection<String> collection,
                                                     final String element) {
                return collection.stream().anyMatch(element::equalsIgnoreCase);
            }
        }
    The `anyMatch(element::equalsIgnoreCase)` lambda is full-string
    equalsIgnoreCase, NOT substring. Greppable via:
        Grep("containsIgnoreCase|equalsIgnoreCase",
             path="<odd-platform-repo>", glob="**/OperationUtils.java")
  preserved_truthful_aspect: |-
    The candidate's underlying observation that admin-group allowlist
    semantics are doc-thin REMAINS valid. The live LDAP docs say
    "A list granting admin permissions" without specifying matching
    semantics (case-sensitive? whole-name? substring?). The correct
    framing (post-retraction) is:
      "admin-groups uses case-INSENSITIVE FULL-STRING equality;
       `admin-groups: ['Admin']` matches `Admin`, `admin`, `ADMIN`
       but NOT `Administrator` or `admin-contractors`."
    This is the CORRECT canonical claim — not substring-collision.
    The same semantic applies to GitHub admin-groups (team-name equality)
    and Google admin-principals (principal-claim equality). A new
    canonicalisation candidate `oauth-admin-allowlist-full-string-equality-semantics`
    captures the corrected claim (see batch O new concepts).
  affected_downstream_concepts:
    - auth-mode (security_aggregate.weaknesses references "containsIgnoreCase substring match" — needs correction in next reducer pass)
    - LDAPSecurityConfiguration@L51 sidecar bugs_limitations_corner_cases / security.known_security_gaps "substring admin match" (factually wrong; primary source of the propagation)
  lsn_018_compliance: |-
    Per LSN-018 Rule 6 pre-emit coherence check, the GithubUserHandler
    sidecar (batch O) explicitly performed the source-Read of
    OperationUtils.java and surfaced this CONFLICTS finding to the
    reducer with full file:line evidence. The supersede is recorded
    here in the canonical-append pattern (no -batch-O suffix file).
