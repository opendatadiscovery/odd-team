name: Pagination parameters declared but unconstrained at spec and controller layers
canonical_in_docs: false
canonical_candidate: true
description: |-
  PageParam and SizeParam in components.yaml:4213-4229 are int32 with no
  minimum, no maximum, no default. Every list endpoint in the catalog
  references these unconstrained params; controllers do not validate (no
  `@Min`, `@Max`, `@Size` annotations). A spec-conformant
  `size=2147483647` is permissible; runtime guardrails (if any) live in
  service/repository layers. Cross-cutting weakness named in alert-tag,
  dataEntity-tag, AlertController, DataEntityController, getActivity,
  getAllAlerts sidecars. **STRENGTHENED batch 2026-05-19L** —
  `getDataEntityAlerts` adds a per-entity-alerts site to the pattern;
  notable because the audit-export workaround named in the live alerting
  page (WebFetched 2026-05-19) AMPLIFIES the risk — operators following
  the documented workaround will naturally use large page sizes to
  complete exports with fewer round-trips, and a misconfigured
  `size=1_000_000` against a high-volume alert entity triggers an
  unbounded query bounded only by Postgres / network buffers.
axes_present:
  - openapi_tags
  - controllers
nodes:
  - odd-platform openapi tags openapi-tag:alert
  - odd-platform openapi tags openapi-tag:dataEntity
  - odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertController
  - odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityController
  - odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController
  - odd-platform java AlertController controller-method:getAllAlerts
  - odd-platform java ActivityController controller-method:getActivity
  - odd-platform java SearchController controller-method:search
  - odd-platform java DataEntityController controller-method:getDataEntityAlerts
contributors:
