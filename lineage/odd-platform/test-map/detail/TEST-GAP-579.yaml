behaviour: |-
  **Filter-class anchor for default-OFF posture (STRENGTHENS TEST-GAP-116).** The new filter-class sidecar primary-sources the load-bearing chain: (a) `@ConditionalOnProperty(value="auth.ingestion.filter.enabled", havingValue="true")` with NO `matchIfMissing`; (b) `application.yml:48` ships explicit literal `false`; (c) every UI security configuration permits `/ingestion/entities` — LoginFormSecurityConfiguration.java:49-51 lists it in `permittedPaths`, OAUTH2/LDAP route through `SecurityConstants.WHITELIST_PATHS` (`/ingestion/**` wildcard at line 96 + `AuthorizationCustomizer.java:22`), DisabledAuthSecurityConfiguration is `.anyExchange().permitAll()`; (d) `SecurityConstants.SECURITY_RULES` (lines 98-355) has NO entry for `/ingestion/entities`. The conclusion is structurally unavoidable: when the filter bean is not registered (the default), the ingestion endpoint is anonymously reachable under EVERY UI auth mode. The bean-non-registration + ServerWebExchangeMatcher (path-based, not auth-aware) means the FilterChain never sees an auth requirement. Same LSN-001 shape — bundled default ships a destruction surface open. This test pins ALL FOUR UI modes simultaneously to lock the no-fallback-defense invariant.
