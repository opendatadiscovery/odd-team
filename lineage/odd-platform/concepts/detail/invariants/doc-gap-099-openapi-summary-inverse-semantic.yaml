notes: |-
  4-angle triangulation summary (which sidecars confirm the inverse semantic):
    angle 1 (batch G): getMyObjects (architectural sibling) — surfaces the /my*
        triplet shape; the contrast between getMyObjects (returns owned) and
        getMyObjectsWithUpstream/Downstream (returns non-owned-but-reachable)
        IS the inverse-semantic finding's structural shape;
    angle 2 (batch H): ReactiveLineageRepositoryImpl — the lineage CTE that
        materialises the non-owned-but-reachable set; SQL primary source for
        the no-owner-JOIN observation that lets the inversion happen
        in the first place;
    angle 3 (batch I): LineageServiceImpl — the negative-case service sibling
        (the lineage-canvas read path that takes a raw dataEntityId and
        does not call fetchAssociatedOwner at all) — surfaces that the
        platform has THREE distinct owner-scoping postures on the downstream
        lineage direction: RESPECTS (none) / PARTIAL (the /my* lineage variants)
        / BYPASSES (the lineage canvas);
    angle 4 (batch M): getMyObjectsWithUpstream + getMyObjectsWithDownstream
        — the CONTROLLER-METHOD PRIMARY SOURCES; the file:line evidence at
        DataEntityRelationsServiceImpl.java:37 (the Predicate.not exclusion)
        plus the openapi.yaml:843-844 / 859-871 summary text plus the
        OwnerEntitiesList.tsx:87 correct UI label forms the closed triangle.

  The 4-angle convergence is rare in this catalog — most findings are 1-2 angle.
  DOC-GAP-099 is now anchored at the controller-method, repository, service, and
  spec layers; the architectural shape is unambiguous; the fix is a one-line spec
  edit + a new doc page.

  Cross-references:
    - REFACTOR-225 anchor-set single-point-of-failure (the security adjacency:
      the same code path that produces the inverse-semantic also produces the
      single-point-of-failure for owner-scoping).
    - Owner-scoped routes — controllers take NO principal parameter (the
      ADR-CANDIDATE-015 controller-shape that the spec misrepresents).
    - Anchor-set defence-in-depth — positive vs negative cases (the
      platform-level architectural invariant the inverse-semantic obscures).
