  seed_source: doc-claim
  validation:
    verdict: contradicted
    actual_behavior: |
      There is no platform default. The OpenAPI spec marks lineage_depth required:false → generated interface declares
      Integer lineageDepth; the service signature is primitive `int` (LineageService.java:12). A null Integer autoboxes
      to int at the controller→service call (DataEntityController.java:257-261), throwing NullPointerException BEFORE
      getLineage's body runs (LineageServiceImpl.java:96 LineageDepth.of). The caller receives an HTTP 500 with a
      server-side exception trace, not a default-depth graph. The documented unset behaviour is unimplementable as written.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getDataEntityDownstreamLineage.md
        section: bugs_limitations_corner_cases[0] + docs_link_semantic.doc_drift_findings[0]
        cite: "DataEntityController.java:257-261 + LineageService.java:12 + LineageServiceImpl.java:96"
        note: "null Integer → int autobox NPE → HTTP 500; doc 'default depth' is unimplemented."
      - sidecar: odd-platform__java__service__service__LineageServiceImpl.md
        section: bugs_limitations_corner_cases[null-lineageDepth]
        cite: "LineageServiceImpl.java:88-89"
        note: "Service cannot null-check a primitive; realised behaviour is unimplementable as documented."
    operator_visible_failure: |
