# User-Owner Association Request Workflow — product-owner reflection

## product_owner_narrative

The User-Owner Association workflow is the **front door to identity in ODD**. ODD Platform
keeps two separate notions of "who you are": the authentication identity (your OIDC / LDAP /
login-form username) and the catalog-side **Owner** (a directory entry that data entities,
alerts, and policies attach to). A freshly-authenticated user is no-one in catalog terms
until those two are bound. This feature is the screen where the user does the binding: it
appears as an inline block at the very bottom of the Catalog Overview home page (the live
doc is explicit — "not a modal dialog and has no overlay … the Owner association widget
appears inline as the last block on the page", per WebFetch 2026-06-03). It exists because
without this binding the user's "My Objects" panel is silently empty (companion feature F-064)
and owner-filtered alerts return nothing — so this workflow is the prerequisite the user must
complete before the rest of the personalised platform turns on (per F-064 companion_to note;
Overview.md dependencies_semantic.requires-feature[3]).

A user interacts with it through a **four-branch state machine** rendered conditionally on
the home page (per feature-flow chain hop:1 — `OwnerAssociation.tsx:32-89`). The component
reads four Redux selectors (identity, ownership, request-status, supposed-owner-name) and a
pure render-time switch decides which face the user sees: (1) **no association yet** → a
request form; (2) **request pending** → a "request being checked" waiting screen; (3) **request
declined** → a dismissable rejection banner above a fresh form; (4) **already an owner** → the
populated four-column "Recommended" panel (`OwnerEntitiesList`, hop:3). Any other combination
(still loading, error, no identity) falls through to `return null` — the block simply does not
appear (feature-flow chain hop:1 evidence, line 88). The form itself is a MUI Autocomplete in
`freeSolo` mode: the user can pick an existing owner OR type a brand-new name, and on mount it
pre-seeds suggestions matching their own username under a "Maybe it's you" hint (feature-flow
chain hop:2 — `OwnerAssociationForm.tsx:131-142,190,203-222`).

The working parts a product owner would demo: you **search or type an owner name**; if you hold
the `DIRECT_OWNER_SYNC` permission the button reads **"Associate"** and binding is immediate, and
if you do not it reads **"Send a request"** and an admin must approve (the live doc documents
both labels; backend split at `OwnerAssociationRequestServiceImpl.java:60-67` per the controller
sidecar implicit_adrs[2]). On approval the home page flips to the Recommended panel; on decline
you get a banner you can dismiss — but the dismissal is per-render-only and the banner returns on
your next login (feature-flow facet `declined_message…no_persistence`). There is **no
self-service way to change or revoke** an approved binding — the doc says so plainly ("you have
no self-service path to change or remove it … ask an administrator with the
`OWNER_RELATION_MANAGE` permission"), and the state machine has no revoke/re-request branch
(feature-flow facet `association_lifecycle_no_revoke_no_re_request`).

The integration story: this workflow is the **write side of F-011 (Principal-to-Owner
Resolution)** — the `user_owner_mapping` row it produces is exactly what F-011 reads at login to
resolve owner-scoped reads (feature-flow companion_to F-011). It sits inside F-141 (the Catalog
Overview composition) and is gated by the same `auth.type !== 'DISABLED'` predicate that gates
the Popular column (F-001 / F-003). On the backend it shares the `OwnerAssociationRequestController`
with the **admin triage workflow** (F-171, the approve/decline queue) and the **admin direct-bind
flow** (F-172, `POST /api/owners/mapping`). The security-sensitive backend compositions reachable
from this same form — minting an Owner row with no `OWNER_CREATE` permission, and the
`DIRECT_OWNER_SYNC` self-mint-then-self-bind privilege chain — are **already owned by the F-075
reflection and tracked as PLT-125** (and the orphan-rows-on-owner-delete by PLT-132); this
reflection treats them as cross-references and concentrates on the **user-facing screen** the
F-075 backend reflection did not cover.

Edge cases a product owner would flag in a demo: under a **misconfigured `auth.type`** the whole
block silently mis-gates — hidden when the operator meant to enable auth, or shown on a deployment
with no security filter wired at all (Overview.md bugs[0], severity HIGH; tracked PLT-077); the
**"Maybe it's you" seed** only works when usernames look like person-names (opaque OAuth subject
UUIDs produce noise); the declined user is told nothing about **why** they were declined or whom
to escalate to; and a user typing a novel name with a typo silently pollutes the shared Owner
directory with no "this will create a new owner" warning on the form.

