# Scheduled housekeeping cycle — product-owner reflection

## product_owner_narrative

ODD Platform's housekeeping is the platform's self-maintenance subsystem: every 15 minutes, a single ShedLock-elected instance fires a cycle that permanently deletes data the operator has chosen to age out, so that a long-lived PostgreSQL catalog does not grow without bound (per `odd-platform__java__service__service__HousekeepingJobManager.md`:understanding + live `/configuration-and-deployment/odd-platform`). The audience is operators sizing their database, DBAs, and compliance reviewers who need to know what is purged and when. The user-facing promise is a retention policy: "resolved alerts, search-facet history, and soft-deleted data entities are kept for N days (default 30), then permanently removed" — expressed through three `housekeeping.ttl.*` knobs an operator tunes (per `HousekeepingTTLProperties.md`:understanding + live doc verbatim "Defaults to 30").

An operator interacts with this feature almost entirely through configuration, not a screen — this feature has NO UI surface (see the validation_gap below). The inputs are `housekeeping.enabled` (master gate, default `true`) and the three `housekeeping.ttl.*` day-counts; the observable outputs are bounded table growth and, on failure, an ERROR log line. There is no dashboard, no "what will be deleted" preview, no per-cycle report, and no metric (per `HousekeepingJobManager.md`:bugs_limitations_corner_cases[4] — all per-job logging is `log.debug`, default-off in production). The operator's mental model of "I set 30 days, so data lives 30 days" is the load-bearing user expectation this reflection tests.

The working parts: the orchestrator injects a `List<HousekeepingJob>` and discovers FIVE beans (per `HousekeepingJobManager.md`:understanding) — three TTL-driven row reapers (`AlertHousekeepingJob`, `SearchFacetsHousekeepingJob`, `DataEntityHousekeepingJob`) that hard-DELETE rows past `now() - ttl days`, plus two `EmptyPartitionsHousekeepingJob` subclasses (`ActivityEmptyPartitionsHousekeepingJob`, `MessageEmptyPartitionsHousekeepingJob`) that drop EMPTY past partitions only and consume NO TTL key (per `ActivityEmptyPartitionsHousekeepingJob.md`:concepts.invariants). The five run SEQUENTIALLY on one shared raw JDBC connection inside a 14-minute ShedLock against the 15-minute schedule (per `HousekeepingJobManager.md`:concepts.operations). `DataEntityHousekeepingJob` is the heavy one: a ~25-table cascade inside a single jOOQ transaction that also blocks on `fileUploadService.deleteFiles(...).block()` to remove S3 attachments (per F-010 chain hop 3c evidence + `HousekeepingJobManager.md`:coupling[3]).

This feature is the operational counterpart to two other pillars (per system-mission.md cross-pillar map + F-010 `cross_pillar_relationships`): it owns the retention of the Data Quality pillar's (P-04) resolved-alert table via `resolved_alerts_days`, and it is the SOLE reaper of the Active-Platform-Features pillar's (P-07) Activity table via the empty-partition drop — coordinating across orchestrators with `ActivityTablePartitionManager` (which creates partitions nightly). A SIXTH housekeeping-shaped job exists outside the orchestrator entirely: `PostgreSQLSessionHousekeepingJobHandler` purges expired `SPRING_SESSION` rows hourly, gated by `session.provider=INTERNAL_POSTGRESQL`, with no leader-election guard (per F-010 batch-X notes + live doc verbatim 2026-06-01).

The edge cases a product owner would flag in a demo are the dangerous ones: a partial config override silently rebinds all three TTLs to `0` and the next cycle deletes everything (LSN-001 shape, per `HousekeepingTTLProperties.md`:bugs_limitations_corner_cases[2] — now PINNED by `HousekeepingTtlKnownBugsTest`); the Activity and Message tables have NO time-based retention knob at all and grow monotonically on any busy platform (per `ActivityEmptyPartitionsHousekeepingJob.md`:bugs_limitations_corner_cases[0]); and — the deepest one — the soft-delete-grace TTL the whole feature advertises never fires for data entities because of a status-mutation ordering bug two layers upstream (per `concepts.yaml` cross-batch invariant D+F, line 185-192; tracked as PLT-027 / SHB-004, now PINNED by `DataEntityStatusKnownBugTest`). The v0.3.0 promise-layer pass adds the crucial second axis: of the 13 user-facing promises below, exactly ONE has a GREEN test asserting it is delivered (H-003's strict-opt-out gate); the other twelve are unverified — including the three whose bugs ARE pinned but whose CORRECT behaviour has no behavioural guard.

## hypotheses

- id: H-001
  hypothesis: >-
    When an operator sets `housekeeping.ttl.resolved_alerts_days=30`, an alert
    the operator MANUALLY marked RESOLVED is retained for 30 days after its
    status-update before housekeeping deletes it (symmetric with auto-resolved
    alerts).
  derivation: >-
    The config key is named `resolved_alerts_days` and the doc states it is
    "intended to apply to both RESOLVED (manual) and RESOLVED_AUTOMATICALLY
    (system) states" — the user expects the retention window to cover all
    resolved alerts.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |
      The jOOQ predicate at AlertHousekeepingJob.java:28-34 chains
      `.where(STATUS.eq(RESOLVED)).or(STATUS.eq(RESOLVED_AUTOMATICALLY)).and(STATUS_UPDATED_AT.lessOrEqual(cutoff))`.
      jOOQ fluent-builder precedence binds `.and(...)` to the most recent
      `.or(...)`, emitting `WHERE (STATUS='RESOLVED') OR (STATUS='RESOLVED_AUTOMATICALLY'
      AND STATUS_UPDATED_AT <= cutoff)`. The TTL cutoff therefore applies ONLY to
      RESOLVED_AUTOMATICALLY rows; a manually-RESOLVED alert matches the bare
      first clause and is hard-deleted on the VERY NEXT 15-minute cycle,
      regardless of `resolved_alerts_days`.
    evidence:
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: bugs_limitations_corner_cases[1]
        cite: "AlertHousekeepingJob.java:28-34"
        note: "the operator-precedence predicate chain; PRIMARY-SOURCE confirmation of REFACTOR-142"
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: bugs_limitations_corner_cases[3]
        cite: "AlertHousekeepingJob.java:28-34 + WebFetch /configuration-and-deployment/odd-platform"
        note: "second-angle confirmation; live doc acknowledges the bug verbatim"
      - test: "HousekeepingTtlKnownBugsTest.alertHousekeepingOrAndPrecedence_knownBug_PLT005 (@pins PLT-005)"
        note: >-
          v0.3.0 — a known-bug characterization pin asserts the CURRENT buggy
          predicate chain is present (GREEN now, RED the instant the OR is
          grouped). This GUARDS the contradiction against a silent fix; it does
          NOT assert the user-facing 30-day-retention PROMISE.
    operator_visible_failure: |
      (1) An operator clicking "RESOLVED" on a production alert loses the alert —
      and its audit trail — within ~15 minutes, not 30 days. (2) Raising
      `resolved_alerts_days` to 90 for a compliance requirement buys longer
      retention for auto-resolved alerts ONLY; manual resolutions silently ignore
      the setting entirely. (3) The data has been silently lost since 2023 (commit
      c8dc0544) on every deployment — older deployments have years of vanished
      manual-resolution audit history. SOC2/SOX/HIPAA alert-retention claims built
      on `resolved_alerts_days` are unsound for manual-resolved rows.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: happy-path
    coverage: unverified  # the BUG is pinned (PLT-005), but no GREEN test asserts the correct retention promise
    pinned_by: "HousekeepingTtlKnownBugsTest.alertHousekeepingOrAndPrecedence_knownBug_PLT005"
    test_demand: functional  # the post-fix regression guard: seed a manual RESOLVED alert younger than the TTL, run a cycle, assert it survives

- id: H-002
  hypothesis: >-
    When an operator deploys ODD with the documented default config and does NOT
    touch `housekeeping.ttl.*`, the platform retains resolved alerts / search
    facets / soft-deleted entities for 30 days (the documented default).
  derivation: >-
    Live doc states "Defaults to 30" for all three TTL keys; the operator expects
    the 30-day default to be a property of the platform, not of one specific YAML
    file.
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      TRUE only when the bundled `application.yml:165-170` is the resolved
      configuration. The Java fields are declared `private int resolvedAlertsDays;`
      / `searchFacetsDays;` / `dataEntityDeleteDays;` with NO `= 30` initialiser
      (HousekeepingTTLProperties.java:8-12); the `30` safety floor lives ONLY in
      the shipped YAML. A deployment that overrides application.yml via a Helm
      values overlay, `--spring.config.location=` to a profile that omits the
      block, Spring Cloud Config slice, or a Kubernetes ConfigMap mount that does
      not re-supply `housekeeping.ttl.*` binds Spring's primitive-int default `0`
      for all three. The next cycle computes `cutoff = now() - 0 days = now()` and
      the predicate `STATUS_UPDATED_AT <= cutoff` matches every row — immediate
      hard-delete-everything.
    evidence:
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: bugs_limitations_corner_cases[2]
        cite: "HousekeepingTTLProperties.java:8-12 + application.yml:168-170"
        note: "Java-side fields have no initialiser; safety floor only in YAML — LSN-001 shape"
      - sidecar: odd-platform__java__org_opendatadiscovery_oddplatform_housekeeping_config__config-properties-class__HousekeepingTTLProperties.md
        section: concepts.invariants[1]
        cite: "HousekeepingTTLProperties.java:9-11"
        note: "'Defaults shipped at the YAML level, NOT the Java level'"
      - test: "HousekeepingTtlKnownBugsTest.ttlFieldsSilentlyDefaultToZero_knownBug_PLT083 (@pins PLT-083)"
        note: >-
          v0.3.0 — pins the bare-primitive-int / no-@DefaultValue Java-side shape
          (the zero-default half of this partial). GUARDS the LSN-001-shape bug
          against a silent fix; does NOT verify the 30-day runtime retention promise.
      - test: "FeatureGatingDefaultsTest.hygieneFamily_shipsEnabled (@enforces ADR-0075/0046)"
        note: >-
          v0.3.0 — asserts the shipped `housekeeping.enabled=true` from
          application.yml, but does NOT assert the three TTL day-count defaults
          (the 30-day floor is unguarded by any test).
    operator_visible_failure: |
      (1) An operator standardising per-env Helm overlays (the common pattern of
      a base values.yaml + env overlays) who drops the housekeeping block from one
      overlay gets a SILENT TOTAL WIPE within 15 minutes of that environment's
      next restart: all RESOLVED alert history, all search-facet history, all
      soft-deleted entities cascading through ~25 tables AND the corresponding S3
      attachments (DataEntityHousekeepingJob.java:142). (2) No boot warning, no log
      above DEBUG, no metric — recovery requires Postgres PITR + S3 versioning
      replay. This is the exact LSN-001 (attachment-storage default) failure shape
      on a different config family.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: happy-path
    coverage: unverified  # zero-default bug pinned (PLT-083); the 30-day retention promise + the shipped TTL defaults are unguarded
    pinned_by: "HousekeepingTtlKnownBugsTest.ttlFieldsSilentlyDefaultToZero_knownBug_PLT083"
    test_demand: functional  # the post-fix guard: assert a sane non-zero default (or unset≠0); + assert the shipped 30-day TTL values in FeatureGatingDefaultsTest

- id: H-003
  hypothesis: >-
    When housekeeping is left at its default, it runs — i.e. "on by default" means
    a deployment gets housekeeping unless the operator explicitly turns it off.
  derivation: >-
    Live doc says `housekeeping.enabled` "Defaults to true"; the operator reads
    this as a platform property.
  seed_source: doc-claim
  validation:
    verdict: partial
    actual_behavior: |
      The gate is `@ConditionalOnProperty(value="housekeeping.enabled",
      havingValue="true")` with NO `matchIfMissing` (HousekeepingJobManager.java:18).
      "Default true" is delivered EXCLUSIVELY by the shipped application.yml:166.
      If the key is ABSENT from the resolved config (operator-customised
      application.yml that omits it), the `@ConditionalOnProperty` evaluates the
      property as missing → the bean is NOT registered → housekeeping silently does
      not run, with no boot log. So "omitting the key" and "setting it false" are
      indistinguishable, and the safe-default depends on the bundled YAML being
      present.
    evidence:
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: bugs_limitations_corner_cases[7]
        cite: "HousekeepingJobManager.java:18 (no matchIfMissing)"
        note: "strict opt-in if key absent; silent no-op"
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: implicit_adrs[3]
        cite: "HousekeepingJobManager.java:18 + application.yml:166"
        note: "fail-CLOSED-on-missing-config is the deliberate ADR (ADR-0046)"
      - test: "AdrHousekeepingOptOutScanTest.housekeepingManagerIsConditionalOptOut_noMatchIfMissing (@enforces ADR-0046)"
        note: >-
          v0.3.0 — GREEN test asserts the EXACT gate: @ConditionalOnProperty
          havingValue=true with NO matchIfMissing. This VERIFIES the mechanism
          behind the promise (shipped-true enables; absent-key disables).
      - test: "FeatureGatingDefaultsTest.hygieneFamily_shipsEnabled (@enforces ADR-0075/0046)"
        note: >-
          v0.3.0 — GREEN test asserts the shipped application.yml ships
          housekeeping.enabled=true. Together with the opt-out scan, the
          'on at the documented default' half of the promise is genuinely verified.
    operator_visible_failure: |
      The opposite failure mode from H-002: an operator who omits the
      `housekeeping.enabled` key in a custom config gets ZERO housekeeping (silent
      unbounded growth) rather than the "on by default" the docs promise. Blast
      radius is bounded (operator-error gated; the shipped default works), so this
      is a documentation/strict-opt-in caveat rather than a data-loss bug.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: happy-path
    coverage: verified  # the only verified promise — the gate + shipped-true are both asserted by GREEN tests
    test_ref: "AdrHousekeepingOptOutScanTest.housekeepingManagerIsConditionalOptOut_noMatchIfMissing + FeatureGatingDefaultsTest.hygieneFamily_shipsEnabled"
    test_demand: none  # the on-at-default half is verified; the absent-key-disables caveat half is documentation, not a behavioural test gap

