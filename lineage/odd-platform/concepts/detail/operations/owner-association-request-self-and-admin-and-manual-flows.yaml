security_aggregate:
  overall: MEDIUM
  auth_modes_relevant: [LOGIN_FORM, OAUTH2, LDAP, DISABLED]
  authorization_consistency:
    verdict: INCONSISTENT
    detail: |-
      5 of 7 endpoints have SecurityRules. 2 are intentionally ungated
      (SELF-request + providers); 1 is unintentionally ungated (audit-read —
      HIGH-severity finding).
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      LIST returns all pending/approved/declined requests across all users.
      AUDIT-LIST returns full forensic trail across all users.
  strengths:
    - Dedicated audit table covering all 5 event types
    - Fail-closed under DISABLED (contrast with OwnerController)
    - Authorization wired at path-pattern matcher (consistent with platform-wide
      pattern)
  weaknesses:
    - DIRECT_OWNER_SYNC + getOrCreate composition (HIGH privilege-escalation)
    - Audit-read endpoint UNGATED (HIGH)
    - createUserOwnerMapping has no existence check (MEDIUM)
    - delete-active-user-owner-mapping silently idempotent (LOW)
    - REFACTOR-427 orphan request rows on Owner delete (MEDIUM)
  contributing_files:
    - OwnerAssociationRequestController.md
performance_aggregate:
  overall: MEDIUM
  hot_paths:
    - 'list-pending-requests: paginated join — OwnerAssociationRequestController.md'
    - 'list-request-activity: twin-join per row + cascade-cancel fan-out —
      OwnerAssociationRequestController.md'
  throughput_shape:
    verdict: SINGLE_ITEM_ONLY
    detail: |-
      All endpoints single-item. Approve fans out to N+1 activity writes
      (cascade-cancel) in the same transaction.
  scaling_shape:
    verdict: UNPAGINATED
    detail: No page-size upper bound on either list endpoint.
  contributing_files:
    - OwnerAssociationRequestController.md
