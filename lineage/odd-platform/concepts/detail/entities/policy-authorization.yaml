name: Policy (Authorization)
canonical_in_docs: true
canonical_candidate: false
description: 'A named JSON document of `statements` over resource types `DATA_ENTITY
  | TERM | QUERY_EXAMPLE | MANAGEMENT` granting specific `permissions` or the `ALL`
  wildcard. Policies are validated server-side against `schema/policy_schema.json`
  (JSON Schema V201909) at every create + update; the persisted text column is always
  schema-valid. A Policy is inert until bound to a Role via `role_to_policy`. The
  seeded `Administrator` policy is reserved by name on UPDATE + DELETE (PolicyServiceImpl.java:76,
  87) but NOT on CREATE (PolicyServiceImpl.java:62-69 — name-asymmetry invariant).
  Authorization gate on CREATE is `POLICY_CREATE` (MANAGEMENT tier) wired in SECURITY_RULES
  line 163-164, **bypassed under `auth.type=DISABLED`**. **Batch H adds the SQL primary-source
  persistence layer** via ReactivePolicyRepositoryImpl — 40-line shell that adds exactly
  ONE method (`getRolesPolicies`, the policy-by-role JOIN used to resolve current
  user effective policies on EVERY authorized request) and inherits standard CRUD
  from `ReactiveAbstractSoftDeleteCRUDRepository`. **Soft-delete uses deleted_at timestamp**,
  enforced via partial unique index `policy_name_unique ON policy(name) WHERE deleted_at
  IS NULL` (V0_0_55__add_policies_and_roles.sql:30) — the soft-delete-aware-recreation
  invariant operators rely on. **NEW HIGH-severity gap (batch H)**: `getRolesPolicies`
  at lines 32-35 does NOT filter `deleted_at IS NULL` — a soft-deleted policy with
  surviving role_to_policy bindings continues to confer permissions; PolicyServiceImpl
  defends only at the cascade-delete check (lines 89-92); any DB-direct UPDATE setting
  deleted_at, schema migration mistake, or future refactor weakening the cascade re-opens
  the gap. The fix is one line: AND policy.deleted_at IS NULL in the JOIN. **Batch
  I adds the SERVICE-layer primary source** via PolicyServiceImpl — the 117-line
  service owns three invariants the repository does NOT: (1) Administrator-name
  reservation on UPDATE+DELETE-only (asymmetry confirmed); (2) JSON-schema validation
  via PolicyJSONValidator (Draft 2019-09) at CREATE+UPDATE; (3) cascade-binding
  check via isPolicyAttachedToRole on DELETE — the SOLE service-layer defence
  against the orphan-binding permission leak that batch H established. **Batch
  I NEW HIGH/MEDIUM service-layer findings**: (a) **PolicyServiceImpl.update LOST-UPDATE
  race** — no @ReactiveTransactional; two concurrent PUTs on same policy id can
  lost-update silently; sibling RoleServiceImpl IS transactional (MEDIUM); (b) **PolicyServiceImpl.delete
  orphan-binding race** — cascade-check + soft-delete are non-atomic; a concurrent
  role-binding mutation between the check and the delete leaves a soft-deleted
  policy with surviving role bindings (MEDIUM); (c) **getCurrentUserPolicies authorization
  hot path** — invoked on EVERY authorized HTTP request through ManagementPermissionExtractor
  + AbstractContextualPermissionExtractor; no caching at any layer; two JOIN roundtrips
  per request; (d) **Schema-validation failure surfaces as HTTP 500** (not 400) —
  IllegalArgumentException has NO dedicated @ExceptionHandler in ControllerAdvice;
  falls through to the catch-all (MEDIUM); (e) **Forensic silence** — PolicyServiceImpl
  has zero @Slf4j / log calls on RBAC mutation paths (HIGH). Canonical doc anchor:
  `configuration-and-deployment/enable-security/authorization/policies` (200, 2026-05-12).'
axes_present:
- controllers
- repositories_reactive
- services
nodes:
- odd-platform java PolicyController controller-method:createPolicy
