gap_id: TEST-GAP-027
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:DataEntityAttachmentController
surfaced_by:
- DataEntityAttachmentController.md:tests_coverage_semantic.uncovered_behaviours.[6]
behaviour: '`downloadFile` injects `dto.fileName()` directly into a `Content-Disposition`
  header without sanitisation. CR/LF → header injection; quote/semicolon → header
  truncation. Filename is attacker-controlled from upload form data.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/AttachmentDownloadHeaderInjectionTest.java
  name: downloadFile_filenameContainingCRLF_emitsInjectedResponseHeader
evidence:
- 'DataEntityAttachmentController.md says: ''no test asserts behaviour for a filename
  containing CR/LF or quote characters'''
- 'concepts.yaml:entities[Attachment].security_aggregate.weaknesses.[6] verbatim:
  ''Content-Disposition filename injection on download — `filename=" + dto.fileName()`
  unsanitised (CR/LF → header injection ...) (severity MEDIUM)'''
cross_references:
- concepts.yaml:entities[Attachment].security_aggregate.weaknesses.[6]
proposed_action: Add test where uploaded fileName contains CR/LF/quote; download and
  inspect response headers; assert current vulnerable behaviour, document the failure
  mode.
