status_reason: |-
  Surface is operator-observable and UI-tier RESOLVED (4 components, fetch
  hook + URL-query-param contract enumerated). Backend chain pre-existing
  in F-045. Status `ui-complete` because the user-facing surface is
  resolvable from .tsx alone; the BACKEND defects are inherited from F-045
  and not re-stated here.
control_summary: |-
  0/4 cells COVERED. The Compare viewer is the operator-facing
  manifestation of F-045's diff endpoint; the four drift facets enumerated
  here are UI-tier consequences of F-045 backend defects PLUS one
  ui_unverified showChangesOnly contract question pending a hook-tier
  enrichment. The Compare viewer is also the natural entry-point for
  operators investigating "what changed in schema between ingest A and
  ingest B" — a critical downstream-impact analysis workflow that the
  live `/features/data-modelling` doc page references.
