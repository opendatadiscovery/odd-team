      AuthorizationCustomizer.java:22-23 (OAUTH2/LDAP) and
      LoginFormSecurityConfiguration.java:49-51 (LOGIN_FORM).
      DisabledAuthSecurityConfiguration permits everything anyway.
    multiplicity_per_trigger: 1
  - hop: 4
    node: "db-write:message_provider_event INSERT"
    sidecar: unresolved
    evidence: |-
      odd-platform-api/src/main/resources/db/migration/V0_0_59__data_collaboration.sql:25-39
