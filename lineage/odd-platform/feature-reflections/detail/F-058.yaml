# Lookup Tables list page — product-owner reflection

## product_owner_narrative

The **Lookup Tables list page** at `/master-data/lookup-tables` is the entire
front door of the Master Data Management pillar (P-03). It is where an operator
who curates reference data inside ODD — country-code tables, tier mappings,
customer-segment enumerations, the canonical lists that downstream pipelines and
BI tools join against — comes to see, in one place, every lookup table they have
authored or can read (per `system-mission.md:125-141`, P-03's one-line capability
is "manage operator-curated reference data as first-class catalog entities," and
the pillar is intentionally narrow — Lookup Tables is its sole child surface).
The page is reached by clicking the **Master Data** toolbar tab; there is no
other path to this content — no Directory drill-down for `LOOKUP_TABLE`-class
entities, no Search facet that returns the full lookup-table population (per
`LookupTables` sidecar understanding + `system-mission.md:125-141`). What the
operator sees on this one page IS the feature.

The page presents five pieces (per `LookupTables` sidecar understanding): a big
**H1 count badge** that reads "N lookup tables overall," a **global search box**,
a permission-gated **"+ Add new"** button that opens a create dialog, and a
**scrolling table list** of three columns — Name, Description, Namespace — with
per-row Edit and Delete actions. The operator's mental model is the obvious one:
the counter tells me how many tables exist, the list shows me those tables, and I
scroll to walk through all of them. They type in the search box to narrow down;
they click "+ Add new" to author a table; they click a row's Edit to rename it or
fix its description.

The working parts the operator relies on are: a **server-side persisted search
session** (the page mints a `?searchId=<uuid>` on first visit so a filtered view
can be deep-linked or reloaded — per `LookupTables` sidecar implicit_adrs[0]); a
**count facet** that the H1 reads straight from the backend; **search-as-you-type**
that pushes each query to the session; **modal create/edit dialogs**; and an
**infinite-scroll list** that is supposed to fetch the next page of 30 rows as the
operator scrolls toward the bottom (per `LookupTables` sidecar performance +
downstream_side_effects). The pagination is the load-bearing part: the list fetches
30 rows per page and is meant to keep fetching as the operator scrolls.

The integration story is small but real: lookup tables are themselves Data
Entities of class `LOOKUP_TABLE`, so they show up in Discovery and lineage
(per `system-mission.md:134` — P-03 feeds P-01 and P-05); each row's name links
out to the catalog detail page for the underlying dataset (per `LookupTables`
sidecar security.data_exposure). The create/edit flow shares form code with the
per-table mutation lifecycle that sibling feature F-026 anchors.

The edge cases a product owner would flag in a demo are exactly the ones this
reflection lands on. The empty state shows a generic placeholder with no "create
your first table" call to action (per `LookupTables` sidecar
bugs_limitations_corner_cases[6]). The counter is global and unscoped — every
authenticated user sees the platform-wide table count even with zero lookup-table
permissions (per `LookupTables` sidecar security.known_security_gaps[1]). And the
single most important edge — what happens when a tenant has more than 30 tables —
is where the feature silently fails: the infinite-scroll list never fetches page
two, so the catalog APPEARS complete at 30 rows while the counter above it reads
the true (larger) total (per `LookupTables` sidecar bugs_limitations_corner_cases[1],
stress_findings.name_behavior_pairs InfiniteScroll). This reflection converts each
of these operator expectations into a falsifiable promise and traces it.

## hypotheses

- id: H-001
  hypothesis: |-
    When a tenant has more than 30 lookup tables, an operator who scrolls to the
    bottom of the list sees the next page of tables load automatically (infinite
    scroll), until the whole catalog is visible.
  derivation: |-
    The list renders size=30 per page via useInfiniteQuery and wraps the rows in an
    InfiniteScroll whose name promises "load more rows when the user scrolls near the
    bottom" — the standard SPA infinite-scroll pattern used on every other list page.
  seed_source: ui-label
  validation:
    verdict: contradicted
    actual_behavior: |-
      The InfiniteScroll does NOT fetch page two from container scroll. The list
      wraps the rows in <ScrollableContainer id='lookup-tables-list'> (LookupTablesList.tsx:51)
      but mounts <InfiniteScroll scrollableTarget='directory-entities-list'>
      (LookupTablesList.tsx:53) — the scrollableTarget points at a DOM id that does
      NOT exist on this page; it is the Directory feature's container id (confirmed:
      Directory/Entities/EntitiesList/EntitiesList.tsx:45 declares id='directory-entities-list').
      react-infinite-scroll-component falls back to window scroll when scrollableTarget
      is unresolvable, but the rows live inside a ScrollableContainer with $offsetY=165
      and overflow:auto, so window scroll never fires for content inside the container.
      Net effect: fetchNextPage is never triggered by scrolling; the list is capped at
      the first 30 rows. I confirmed via a single Rule-8 source read (grep across the
      whole SPA) that EVERY other InfiniteScroll in the codebase (28 instances) pairs a
      matching container id with its scrollableTarget; LookupTablesList is the SOLE mismatch.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: bugs_limitations_corner_cases[1]
        cite: "LookupTablesList.tsx:51-53"
        note: "Mismatched id pair: container 'lookup-tables-list' vs target 'directory-entities-list'."
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: stress_findings.name_behavior_pairs (InfiniteScroll)
        cite: "LookupTablesList.tsx:51-53"
        note: "drift: DRIFT_NAME_VS_BEHAVIOR — promise 'loads more rows' vs behaviour 'fetchNextPage never fires'."
      - sidecar: odd-platform__ts__react-component__component__LookupTables.md
        section: source_read_for_validation
        cite: "Directory/Entities/EntitiesList/EntitiesList.tsx:45 (id='directory-entities-list')"
        note: "Confirms the copy-paste source — the target id belongs to the Directory feature, not this page."
    source_read_for_validation: true
    operator_visible_failure: |-
      (1) Primary: for any tenant with >30 lookup tables, the list shows only the
      first 30 and gives NO signal that more exist — no bottom skeleton loader, no
      "Load more" button, no pagination control, no count of shown-vs-total. The
      operator believes they are looking at the complete catalog when they are not.
      (2) Discovery failure: a new operator or a hand-over scenario cannot find a
      table they don't already know exists — the search workaround only helps someone
      who knows the missing table's name. (3) Blast radius: this is 100% of the P-03
      pillar's user-facing UX (the pillar has exactly one surface), so a modest
      organisation exceeding 30 tables loses the whole feature silently. (4) Trust:
      the H1 counter reads the true total (e.g. "250 lookup tables overall") directly
      above a list of 30 — once an operator notices the mismatch they cannot trust the
      page, but most never look closely enough to notice.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate
    use_case_kind: render
    coverage: unverified
    test_demand: functional

