behaviour: |-
  **Empty-identity-render unit gap.** `App.tsx:48` swallows ANY `fetchIdentity` error via `.catch(() => {})` — under a transient 5xx, network glitch, or unexpected API contract change, both `identity` and `owner` remain null in the redux store. `AppToolbar.tsx:74` then renders `{owner?.name ?? identity?.username}` which evaluates to an EMPTY STRING wrapped in `<S.UserName>`. The dropdown chevron stays clickable; the user-identifier label is just blank. No test asserts (a) the empty-string render path; (b) the dropdown still opens (so the user can still click Logout); (c) under `auth.type=DISABLED` whether `whoami` returns a synthetic identity (in which case the precedence yields a non-empty fallback, e.g. `anonymous`) or stays null. The sidecar marks this LOW severity (operator-noticeable but not a security gap) but pins it as the most likely undetected regression class via "a refactor that silently changes the user-identifier precedence ... would ship without test signal."
