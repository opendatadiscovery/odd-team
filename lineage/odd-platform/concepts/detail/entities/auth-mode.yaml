name: Auth Mode
canonical_in_docs: true
canonical_candidate: false
description: 'The `auth.type` configuration knob selecting the platform''s UI/API
  authentication mode. Four supported values: `DISABLED | LOGIN_FORM | OAUTH2 | LDAP`
  (verbatim per `https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security`).
  S2S coexists as an additional filter activated by `auth.s2s.enabled`, orthogonal
  to the four `auth.type` modes — composable with LOGIN_FORM / OAUTH2 / LDAP, silently
  ignored under DISABLED. Every controller sidecar names these as `auth_mode_relevance`.
  Batch 2026-05-10B added three config-key-consumer sidecars (AppInfoController@L18,
  AuthorizationManagerCondition@L11, IngestionDataEntitiesFilter@L20). Batch 2026-05-12C
  adds the four canonical `*SecurityConfiguration` sidecars — one per mode — making
  the per-mode behaviour fully cited: DisabledAuthSecurityConfiguration@L10 (permit-all
  chain, no CSRF, no CORS, no S2S wiring, no boot WARN), LoginFormSecurityConfiguration@L31
  (validates REFACTOR-073 — LOGIN_FORM runs WITHOUT AuthorizationCustomizer), OAuthSecurityConfiguration@L71
  (WIRES AuthorizationCustomizer; S2S composes-not-mutex), LDAPSecurityConfiguration@L51
  (WIRES AuthorizationCustomizer; containsIgnoreCase admin match). **STRENGTHENED batch
  2026-05-19-O** with 5 OAuth provider-specific sidecars: GoogleUserHandler + GithubUserHandler
  (user-enrichment dispatcher chain) + AzureLogoutSuccessHandler + CognitoLogoutSuccessHandler
  (logout dispatcher chain) + IngestionDataEntitiesFilter (filter-class-layer
  primary source). Batch O surfaces the OAuth Provider-Quirks Strategy Pattern
  (each provider diverges from the abstract base uniquely), the admin-groups
  silent-no-op asymmetry (Google ignores while POJO field binds), and the logout-
  side token revocation asymmetry (Google + GitHub actively revoke; Cognito +
  Azure + ODD_IAM rely on session invalidation + natural TTL).


  **STRENGTHENED batch ZK (2026-05-26)** — ODDLDAPProperties REV-2
  (file-analyser/0.4.0) re-enriches the LDAP-mode corner with Stress
  Protocol Category F request-input analysis on five fields (password,
  url, adminGroups, ActiveDirectory.{enabled,domain}, username). Four
  formal DRIFT_INPUT_NAME_VS_IMPLEMENTATION classifications surface:
  password (TRANSLATES_SILENTLY — Lombok @Data exposes via toString;
  see lombok-data-tostring-sensitive-field-leak invariant); url
  (TRANSLATES_SILENTLY — non-emptiness only validation, no LDAPS
  enforcement); ActiveDirectory.domain (TRANSLATES_SILENTLY — docs
  say required-when-AD-enabled but enforced by zero code); adminGroups
  contract DEFERRED to a future OperationUtils.containsIgnoreCase
  primary-source pin (see coherence-conflicts-batch-ZK.md — the
  ODDLDAPProperties sidecar claims SUBSTRING matching whereas the
  prior auth-mode-quartet-meta-invariant claims FULL-string-equality
  per batch-O correction; neither has cited the implementation
  directly; resolution pending). Probes P-186 (password actuator/log
  dual leak), P-184 (substring-collision admin-escalation hypothesis
  — gated on the coherence resolution), P-185 (AD null-domain silent
  degradation) NEW.'
