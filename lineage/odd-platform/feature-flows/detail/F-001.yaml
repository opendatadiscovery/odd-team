  - live probe-runs/2026-05-19-P-003.yaml — latency baseline at small N
test_matrix:
  unit:
    state: GAP
    covered: []
    uncovered:
    - ReactiveDataEntityRepositoryImpl.incrementViewCount — assert +1 delta on call
      (an isolated unit equivalent would mock the JDBC layer; the integration-class
      probe P-001 already pins the observable behaviour end-to-end)
    - DataEntityDetails.tsx — assert useEffect dispatches exactly once per mount (target
      for slice-3 Playwright probe)
    - fetchDataEntityDetails thunk — assert one network call per dispatch
  integration:
    state: PROBED-PINNING-BUG
    covered:
    - behaviour: 5 sequential GET /api/dataentities/{id} increments view_count by
        exactly 5
      pinned_by_probe_run: R-20260519T003701Z-P-001
      cell_evidence: lineage/odd-platform/probe-runs/2026-05-19-P-001.yaml — final_view_count=5,
        initial_view_count=0
    - behaviour: Opening /dataentities/{id} in headless Chromium fires GET /api/dataentities/{id}
        TWICE per mount AND view_count grows by 2
      pinned_by_probe_run: R-20260519T010758Z-P-004
      cell_evidence: lineage/odd-platform/probe-runs/2026-05-19-P-004.yaml — xhr_count=2
        (regex-filtered exact-path), delta=2
      note: 'PINNING-BUG: LSN-017 empirically proven. UI useEffect dep-array at DataEntityDetails.tsx:56-64
        fires the fetch twice per mount; backend +1 each = +2 user-visible. Fix →
        assertion flips to xhr_count == 1 AND delta == 1.'
    uncovered:
    - Multiple sequential page-opens — assert linear accumulation (extension of P-001)
    - Concurrent page-opens — assert no lost-update
    - Popular ranking — assert entity with inflated view_count rises (see F-003 for
      the Popular surface)
  performance:
    state: PROBED-PASSING
    covered:
    - behaviour: 'Detail-read latency baseline (single entity, small seed): p50=74ms,
        p95=153ms, p99=1741ms (50 calls)'
      pinned_by_probe_run: R-20260519T003916Z-P-003
      cell_evidence: lineage/odd-platform/probe-runs/2026-05-19-P-003.yaml — latency_curve.*
        + final_view_count=50 sanity
      caveat: p99 outlier driven by first-call JIT warmup; p95 is the steady-state
        reference
    uncovered:
    - view_count UPDATE under 100 concurrent detail-reads — assert no row-level lock
      starvation (deferred to slice 3 with k6 load injection)
    - Popular page render p99 under 50K-entity catalog — assert <200ms (deferred to
      slice 3 with seeded large dataset)
    - view_count column index regression — EXPLAIN ANALYZE uses Index Scan not Seq
      Scan (the absence of the index is itself REFACTOR-221; performance probe at
      scale will surface the consequence)
  security:
    state: PROBED-PINNING-BUG
    covered:
    - behaviour: Under auth.type=DISABLED, anonymous unauthenticated caller successfully
        fetches detail AND inflates view_count by 10 across 10 anon calls
      pinned_by_probe_run: R-20260519T003811Z-P-002
      cell_evidence: lineage/odd-platform/probe-runs/2026-05-19-P-002.yaml — final_view_count-initial_view_count==10
        with no Authorization header
      note: 'PINNING-BUG: documents the current DISABLED-bypass behaviour. When fail-closed
        lands, P-002''s assertion flips (expect 401/403) and the probe becomes the
        regression-pin for the fix. Empirical confirmation of REFACTOR-073''s 18-sidecar
        cluster — at least 1 of 17 endpoints empirically demonstrated.'
    uncovered:
    - Rate-limit absence — single authenticated caller can pump 10K views in N seconds
      (deferred to slice 3 with k6 load + auth)
    - Cross-tenant inflation — caller in tenant A pumps tenant B's entity to A's home
      page (deferred — multi-tenant probe stack)
control_summary: 3/14 cells PROBED (1 PROBED-PINNING-BUG security + 1 PROBED-PASSING
