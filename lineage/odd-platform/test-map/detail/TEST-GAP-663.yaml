behaviour: |-
  **HIGH-impact latent UX bug: soft-deleted INTERNAL custom-metadata fields are PERMANENT name-blockers.** The partial unique indexes `IX_UNIQUE_INTERNAL_NAME ON metadata_field (name) WHERE origin = 'INTERNAL'` (V0_0_1__init.sql:242-244) and `IX_UNIQUE_EXTERNAL_NAME_TYPE ON metadata_field (type, name) WHERE origin <> 'INTERNAL'` (V0_0_1:238-240) filter ONLY by origin — NOT by `deleted_at`. The sibling `tag_name_unique` WAS migrated by `V0_0_64__remove_is_deleted_field.sql:103-105` to `WHERE tag.deleted_at IS NULL`; the metadata_field partial indexes were NOT touched by the same migration despite V0_0_64:41-50 retrofitting `deleted_at` to the metadata_field TABLE. **Consequence**: an operator who soft-deletes a custom INTERNAL metadata field `cost_centre` through the UI then tries to re-create it receives `UniqueConstraintException("Internal metadata with this name already exists")` (ExceptionUtils.java:63-65). But `listInternalMetadata` (line 43-56) FILTERS soft-deleted out via `addSoftDeleteFilter` (line 46), so the dropdown reports `cost_centre doesn't exist`. The user sees a contradictory state: "doesn't exist" in the dropdown but cannot create. No hard-delete path exists in the codebase; soft-deleted fields are permanent name-blockers until a manual DBA UPDATE removes the soft-deleted row. The asymmetry with Tag's V0_0_64 fix is undocumented and untested.
