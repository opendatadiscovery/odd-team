name: Register Data Source from Collector (S2S, upsert by ODDRN)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-10
  - P-09
description: |-
  **NEW OPERATION, batch 2026-05-20-P** — the S2S boot-of-collector endpoint
  `POST /ingestion/datasources` handled by `IngestionController.createDataSource`
  (`IngestionController.java:47-73`; the substrate's node-label `createDataSourceEntity`
  is a synonym). A Collector POSTs a `DataSourceList` payload to register or
  update the datasources it will subsequently ingest into. The path is
  ALWAYS authenticated by the SIBLING `IngestionDataSourceFilter` (unconditional
  `@Component`, NOT gated by `auth.ingestion.filter.enabled`) which validates
  the `Authorization: Bearer <token>` header against the COLLECTOR table and
  writes the matched `collectorId` into the WebSession's
  `COLLECTOR_ID_SESSION_KEY` attribute BEFORE the controller method runs.
  The controller reads that session attribute (fail-loud
  `IllegalStateException("Collector id is null")` if missing), validates that
  every payload item has non-empty `name` + `oddrn`, and delegates to
  `DataSourceIngestionServiceImpl.createDataSources(collectorId, ...)` which
  upserts by ODDRN inside one `@ReactiveTransactional` boundary.

  The CRITICAL ASYMMETRY with the sibling `postDataEntityList`: this filter
  is ALWAYS-ON (no `@ConditionalOnProperty`); the data-entity filter is
  OFF-by-default. Both share the same `/ingestion/**` WHITELIST_PATHS, so
  the four UI auth modes (DISABLED / LOGIN_FORM / OAUTH2 / LDAP) layer no
  additional defence for either path.

  The merge semantics on UPDATE are deliberately PARTIAL: only `name` +
  `description` flow from the new payload. Existing `connection_url`,
  `active` flag, `type`, `namespace_id`, `collector_id`, `token_id`,
  soft-delete flag, all timestamps — all PRESERVED (`DataSourceIngestionServiceImpl.java:74-92`).
  An operator who renames a datasource in the UI and re-runs the collector
  will see their UI-side rename OVERWRITTEN by the collector's payload; no
  log records the overwrite. A collector that genuinely needs to update
  `connection_url` CANNOT do so via this endpoint.

  Namespace is INHERITED from the COLLECTOR, NOT the payload (the
  collector-scoped tenancy model, `DataSourceIngestionServiceImpl.java:99-111`).
  Any `namespace_name` in the payload is silently ignored.

  Response is hard-coded 200 OK with empty body (`Mono<ResponseEntity<Void>>`);
  the platform-assigned `id` of the registered datasource is NOT echoed —
  callers must call `GET /api/datasources` separately to discover the id.
  The OpenAPI contract for the operation may declare a response shape; the
  Java return type is hard-coded `Void` regardless.

  Cross-references: the operation anchors F-008 (P-10:F-001 Batch Ingestion),
  surfaces the `two_ingestion_filters_asymmetric_auth` invariant (sibling
  invariant in this batch), and contributes a NEW invocation site to
  REFACTOR-185 (the DISABLED-mode bypass — the filter still requires a
  valid collector token even under DISABLED, but DISABLED + open UI lets
  an attacker create the collector first, then call this endpoint).
