      whose branches map exactly to the live doc's stated rules (WebFetch 2026-06-01):
      RED = at least one Critical failing OR all Majors failing; YELLOW = some (not
      all) Majors failing OR all Minors failing OR no tests defined; GREEN =
      otherwise. The hierarchical-multiplicative weight aggregation
      (`SLACalculator.java:37-60`) and zero-tests->YELLOW cautious default
      (`SLACalculator.java:81-83`) both match the doc. VERIFIED THIS SESSION by
      reading `SLAReportTest.java` in full: 8 @Test methods assert exact colour +
      severity weights for empty (YELLOW, weights 0/0/0), minor-only (GREEN),
      major-only (YELLOW), critical-only (RED), and the mixed cases including
      `minorAndCriticalTests` (RED, weights 3/0/12) and `allTestsArePresented`
      (YELLOW, total=39 success=35, weights 3/9/27). The algorithm is treated as the
      spec by an exhaustive suite — this is the ONE part of the chain with strong
      unit-test coverage.
