name: Aggregate test-status counts for dataset (Test reports tab summary)
canonical_in_docs: false
canonical_candidate: true
description: |-
  GET /api/datasets/{data_entity_id}/test_report — single SQL GROUP BY on
  DATA_ENTITY_TASK_LAST_RUN.STATUS scoped by the dataset's test ODDRNs; returns
  DataSetTestReport (counts per status: success / failed / aborted / skipped /
  broken / unknown). At-most-6-row result; data flow to the JVM is tiny.
  NEW operation, batch 2026-05-20T (DataQualityController class sidecar).

  Companion read to list-data-quality-tests-for-dataset (which returns the
  per-test detail). Surfaces on the dataset's detail-page 'Test reports' tab
  as the headline six-bucket summary.

  vocabulary_status: codebase-anchored + doc-side-partially-covered (live
  https://docs.opendatadiscovery.org/features/data-quality/test-results-import
  describes the 'Test reports tab' surface but does NOT name the aggregate as
  'Dataset Test Report' or document the six-bucket distribution).
axes_present:
- controllers
nodes:
- odd-platform java DataQualityController controller-class:DataQualityController
contributors:
- |-
  DataQualityController (class) batch T:
    operations[aggregate-test-status-counts-for-dataset — the canonical name];
    invariants[existsIncludingSoftDeleted-precedes-the-read,
    SQL GROUP BY at-most-6-row result]
evidence:
- |-
  DataQualityController.md:concepts.operations.[aggregate-test-status-counts-for-dataset]
- |-
  DataQualityController.md:concepts.invariants.[2] (existsIncludingSoftDeleted
  preserves DQ visibility post-soft-delete — applies here)
- |-
  Companion entity: dataset-test-report (the response DTO)
notes: |-
  Cheapest of the five DataQualityController endpoints in DB cost; single
  short-running SQL. Yet uncached at the HTTP layer despite the response being
  a deterministic function of (datasetId, current_test_run_states).
