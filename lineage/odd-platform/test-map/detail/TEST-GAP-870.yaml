behaviour: |-
  **HIGH — Race window between `SELECT count(*) = 0 FROM <partition>` empty-check and `DROP TABLE <partition>` allows concurrent INSERTs to land in a partition that gets dropped milliseconds later — silently destroying the just-inserted activity rows.** `PartitionServiceImpl.getEmptyPastPartitions` (`:108-117`) runs two SEPARATE PreparedStatements on the same Connection — `SELECT count(*) = 0` (line 134) THEN, in the caller's for-loop (`EmptyPartitionsHousekeepingJob.java:24-27`), `DROP TABLE` (line 122) — with NO transaction wrapper (unlike `AlertHousekeepingJob.java:25` and `DataEntityHousekeepingJob.java:71` which BOTH wrap in `DSL.using(connection).transaction(...)`). Between the count-zero check returning TRUE and the DROP firing, a concurrent `INSERT INTO activity` from any `@ActivityLog`-annotated business method, ingestion path, or AlertServiceImpl flow can land in the soon-to-be-dropped partition. PostgreSQL routes the INSERT via partition rules (the partition still exists in `pg_class`); the INSERT commits (autocommit on the writing connection); then the housekeeping DROP TABLE arrives, acquires ACCESS EXCLUSIVE, and destroys the partition — **the just-inserted row is GONE with no compensating undo, no error to the original INSERT caller (who saw committed-success).**

  **The class name promise**: "Activity**Empty**Partitions**Housekeeping**Job" implies "only EMPTY partitions are dropped". The promise IS honoured at the centre (the `SELECT count(*) = 0` check IS a real DB query, not a date-only heuristic per `S-E-2.[B-1]`). **The promise drifts at the boundary**: the partition was empty when checked, NOT empty when dropped. The class-name's invariant is violated by the race.

  **Primary-source chain**:
  - `ActivityEmptyPartitionsHousekeepingJob.java:14-17` (overrides `getTargetTable()` returning `Tables.ACTIVITY.getName()`; NO `exclusions()` override; runs every 15 min via parent's `doHousekeeping`)
  - `EmptyPartitionsHousekeepingJob.java:16-33` (`doHousekeeping` — calls `partitionService.getEmptyPastPartitions(connection, target, exclusions)` then for-loop calls `partitionService.dropPartition(connection, name)`)
  - `PartitionServiceImpl.java:108-117` (`getEmptyPastPartitions` — Java-level `isPartitionInPast && isPartitionEmpty` AND, NOT atomic at SQL layer)
  - `PartitionServiceImpl.java:133-142` (`isPartitionEmpty` — runs `SELECT count(*) = 0 FROM <partition>` SQL)
  - `PartitionServiceImpl.java:121-127` (`dropPartition` — runs `DROP TABLE <partition>` SQL, NO `IF EXISTS`)
  - `EmptyPartitionsHousekeepingJob.java:16-33` — **NO `transaction(...)` wrapper** (contrast `AlertHousekeepingJob.java:25` and `DataEntityHousekeepingJob.java:71`)
  - `ReactiveActivityRepositoryImpl.java:50-54` (`saveReturning` — single-row INSERT, no partition-routing fallback)
  - `ReactiveActivityRepositoryImpl.java:57-71` (`save` batch — same INSERT path)

  **The race window structure** (per ActivityEmptyPartitionsHousekeepingJob.md:stress_findings.S-E-3):
  1. Housekeeping cycle T=0: `SELECT count(*) = 0 FROM activity_20240101_20240301` returns TRUE
  2. App code T=1ms: an `@ActivityLog`-annotated mutation fires; `createActivityEvent` reaches `saveReturning(pojo)` with `created_at` in the [20240101, 20240301) range
  3. Postgres routes the INSERT to `activity_20240101_20240301` (the partition still exists in `pg_class`)
  4. INSERT commits at T=2ms (autocommit on the R2DBC connection)
  5. Housekeeping T=3ms: `DROP TABLE activity_20240101_20240301` arrives; acquires ACCESS EXCLUSIVE; succeeds (no recheck of emptiness)
  6. The activity row inserted at T=2ms is **gone with the partition**. The original caller saw HTTP 200. No error log, no compensating signal.

  **Operator-visible consequences**:
  - **Silent activity-trail data loss**: a forensic investigation looking for "did user X do action Y at time T" finds NO activity row — but the user's mutation DID succeed (the business state changed; only the audit trail was lost).
  - **Disproportionate impact at partition boundaries**: the race window aligns with the housekeeping 15-minute cycle. A platform with N empty past partitions per cycle has N race windows per 15 minutes. Aged platforms with old empty partitions (low-activity periods that DID empty out) are repeatedly probed every cycle.
  - **LSN-001 family**: silent default + destructive action; the EmptyPartitions job's failure mode is shaped exactly like the attachment-storage default — operator's "background housekeeping" deletes data the operator did not intend to delete.

  **Why HIGH not CRITICAL**:
  - The race window is narrow (milliseconds); empirical hit rate depends on activity volume × partition-empty-cycle alignment.
  - The data loss is bounded to activity-trail rows (not user data); the business mutation itself is unaffected.
  - We rate HIGH (not CRITICAL) because the surface is the audit log only, AND empirical observability requires P-012 to measure.
  - This is the AUDIT-side companion to the LSN-001-class (which lost user data via misconfigured storage); the audit-side loss is operationally similar but business-data-safer.

  **Connection to probe P-012**:
  - The sidecar emits P-012 to MEASURE the race window experimentally with a tight concurrent insert
  - This TEST-GAP is the regression-pin AFTER P-012 confirms the timing
