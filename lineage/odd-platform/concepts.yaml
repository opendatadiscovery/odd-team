  - name: "GenAI Assistant"
    canonical_in_docs: true
    canonical_candidate: false
    description: "Opt-in proxy from a single platform endpoint (`POST /api/genai/ask`) to an external AI service the operator runs. The platform does not embed an LLM. API-only today (no in-app UI affordance). Three-key configuration (`genai.enabled` request-time gate, `genai.url` + `genai.request_timeout` baked into genAiWebClient at startup) (GenAIController + GenAIProperties sidecars; main-concepts.md `## AI aspects` names this as 'GenAI assistant')."
    axes_present:
      - controllers
      - config_prefixes
    nodes:
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:GenAIController"
      - "odd-platform java org.opendatadiscovery.oddplatform.config.properties config-properties-class:GenAIProperties"
    contributors:
      - "GenAIController: entities[GenAIRequest, GenAIResponse, external genai service]"
      - "GenAIProperties: entities[GenAIProperties (typed config POJO), genai.* YAML namespace, genAiWebClient Spring bean]"
    evidence:
      - "GenAIController.md:concepts.entities.[GenAIRequest, GenAIResponse]"
      - "GenAIProperties.md:concepts.entities.[GenAIProperties, genai.* namespace, genAiWebClient]"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - DISABLED
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: UNGATED
        detail: "GenAIController has no @PreAuthorize, no programmatic permissionService.hasPermission(...) call. Generated GenaiApi interface has zero authorization annotations. SecurityConstants has no SECURITY_RULES entry for `/api/genai/ask` — falls through to `pathMatchers(\"/**\").authenticated()`. Net: any authenticated user under LOGIN_FORM/OAUTH2/LDAP can invoke the LLM proxy; under auth.type=DISABLED it is anonymously reachable."
      owner_scoping:
        verdict: N/A
        detail: "Endpoint takes free-form prompt, returns LLM answer; does not query catalog, filter by owner, or associate output with any DataEntity. Owner scoping is not a meaningful concept here. Relevant scoping question is 'should arbitrary authenticated users be allowed to call this endpoint?'"
      strengths:
        - "Disabled-by-default — `application.yml:18` ships `genai.enabled: false` explicitly (visible to operators reading YAML, not just an absence)"
        - "Live config-doc warning admonition explicitly flags silent-misconfiguration scenario (`genai.enabled=true` with unset url/timeout)"
        - "Live feature page acknowledges 'thin proxy' stance and 'Injection concerns fall to your external service implementation'"
      weaknesses:
        - "Prompt-injection from authenticated platform users → external LLM is unmitigated at platform boundary — `GenAIServiceImpl.java:43` forwards `genAIRequest.body` verbatim, no length cap, no character filter, no system-prompt overlay (severity HIGH)"
        - "Outbound URL operator-supplied via `genai.url` with NO allowlist, NO scheme check, NO SSRF guard; `WebClientConfiguration.java:28` baseUrl(...) without validation; an attacker landing config injection elsewhere can pivot the platform's egress (severity HIGH)"
        - "Under auth.type=DISABLED, `/api/genai/ask` is anonymously reachable; no fail-closed behaviour, no startup warning when DISABLED + genai.enabled=true (severity HIGH)"
        - "No outbound authentication sent to {genai.url} — no defaultHeader(HttpHeaders.AUTHORIZATION, ...), no apiKey/token field on GenAIProperties; operators must put external service on a trusted network or front it with their own auth proxy (severity MEDIUM)"
        - "No per-user / global rate limit, no abuse-detection — authenticated user can issue unbounded prompts; combined with no @Size on GenAIRequest.body (only the implicit spring.codec.max-in-memory-size: 20MB ceiling) this is DoS + unbounded-cost surface (severity MEDIUM)"
        - "Neither prompt nor response is logged for audit/abuse-investigation — controller has no @Slf4j, GenAIServiceImpl's @Slf4j-provided log is unused (severity MEDIUM)"
        - "No @PreAuthorize at controller; no `GENAI_USE` Permission in vocabulary — every authenticated user can consume external AI quota with no role gate (severity MEDIUM)"
      cross_file_inconsistencies:
        - "Both sidecars (GenAIController + GenAIProperties) confirm zero authorization at runtime AND at config-binding layer; no cross-file disagreement"
      contributing_files:
        - "GenAIController.md"
        - "GenAIProperties.md"
      evidence:
        - "GenAIController.md:security.known_security_gaps.[0-6]"
        - "GenAIProperties.md:security.known_security_gaps.[0-3]"
    performance_aggregate:
      overall: LOW
      hot_paths:
        - "POST /api/genai/ask — one synchronous outbound HTTP call to {genai.url}/query_data per request; latency floor is round-trip to external LLM (typically seconds-to-minutes); configured timeout is in MINUTES, not seconds — GenAIController + GenAIProperties"
        - "genAIProperties.isEnabled() re-read on every request (cheap volatile field read on singleton, but worth noting it's request-time not startup-time) — GenAIServiceImpl"
      throughput_shape:
        verdict: SINGLE_ITEM_ONLY
        detail: "Single-prompt-per-request only; no batch / multi-prompt endpoint, no streaming response (no SSE / chunked / Flux<GenAIResponse> variant). Consumer needing 10 LLM answers issues 10 sequential POST calls."
      scaling_shape:
        verdict: HORIZONTALLY_SCALABLE
        detail: "Stateless controller (single GenAIService field). Each platform instance fires its own outbound — no shared rate limiter, no distributed concurrency cap, no token bucket. N replicas behind a load balancer multiply request rate to external service by N. genAiWebClient bean is per-instance; config changes require Platform restart."
      strengths:
        - "Single shared genAiWebClient bean (Reactor Netty HttpClient.create() + WebClient.builder()) — no per-request client construction"
        - "Reactive Mono signature throughout — non-blocking on server side"
        - "Stateless config bean (GenAIProperties) — instances scale horizontally without coordination"
      weaknesses:
        - "request_timeout configured in MINUTES, primitive `int` default 0 → `Duration.ofMinutes(0)` zero-duration timeout when operator sets `genai.enabled=true` without setting request_timeout. Every request fires immediately as ReadTimeoutException with confusing 'Gen AI request take longer that 0 min' message (LSN-002-class concern, severity HIGH)"
        - "No retry / exponential backoff / circuit breaker on outbound — single transient blip surfaces as 500 to caller"
        - "No outbound concurrency cap declared on genAiWebClient — relies on Reactor Netty default ConnectionProvider (default pendingAcquireTimeout=45s)"
        - "No prompt-result caching — identical prompts re-fan-out to external LLM (cost amplification)"
        - "No request-throughput observability at controller or service layer"
        - "No max-in-memory-size override on genAiWebClient — uses Spring WebFlux default 256KB; large LLM responses may truncate"
        - "Hot-reload not supported: genai.url + genai.request_timeout baked into bean at startup; operators cannot tune timeout without downtime"
      cross_file_inconsistencies: []
      contributing_files:
        - "GenAIController.md"
        - "GenAIProperties.md"
      evidence:
        - "GenAIController.md:performance.known_performance_gaps.[0-5]"
        - "GenAIProperties.md:performance.known_performance_gaps.[0-3]"
        - "GenAIProperties.md:bugs_limitations_corner_cases.[0,1] (silent misconfiguration, requestTimeout=0)"

  - name: "Directory"
    canonical_in_docs: true
    canonical_candidate: false
    description: "Catalogue's hierarchical browse interface complementing Search — four-level navigation: data source type → data source → entity type → entity. Read-only `GET` endpoints under `/api/directory`, with ODDRN prefix as the grouping key (sources whose ODDRN can't be parsed bucket under `Other`/UNKNOWN_DATASOURCE_TYPE) (DirectoryController sidecar `understanding`; main-concepts.md `Data Discovery` pillar names Directory as one of four entry paths)."
    axes_present:
      - controllers
    nodes:
      - "odd-platform java org.opendatadiscovery.oddplatform.controller controller:DirectoryController"
    contributors:
      - "DirectoryController: entities[Data Source Type, Data Source, Data Entity Type, Data Entity, ODDRN]; operations[list-data-source-types-with-counts, list-data-sources-by-prefix, list-data-entity-types-within-datasource, list-data-entities-by-datasource-and-type-paged]"
    evidence:
      - "DirectoryController.md:concepts.entities.[Data Source Type, Data Source, Data Entity Type, Data Entity, ODDRN]"
      - "DirectoryController.md:concepts.operations.[four levels]"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: UNGATED
        detail: "DirectoryController has zero @PreAuthorize annotations and no entry in SecurityConstants.SECURITY_RULES (rule list is mutating-method-only; all four Directory routes are GETs). Falls through to global SecurityFilterChain `authenticated()` rule. Under auth.type=DISABLED Directory is open to any caller."
      owner_scoping:
        verdict: BYPASSES
        detail: "All four Directory endpoints return platform-wide aggregates with no filtering by current user's owner identity. `getDataSourceTypes` lists every registered data source via unfiltered `dataSourceRepository.list()`. `getDirectoryDatasourceList(prefix)` returns every data source matching the prefix. Directory is a non-owner-scoped view of the whole catalogue — any authenticated user (in LOGIN_FORM/OAUTH2/LDAP) can enumerate every registered data source's name, ODDRN, host, database, and entity counts."
      strengths:
        - "Read-only feature surface — no mutation paths to gate"
        - "Stateless controller — no in-memory session state"
      weaknesses:
        - "Directory is a reconnaissance surface: an authenticated user with no Permissions and no Owner association can still enumerate every registered data source's ODDRN, host, database, and per-type entity count (severity MEDIUM)"
        - "Live `data-discovery/directory` doc page does NOT warn operators that Directory is platform-wide and unscoped by ownership"
        - "ODDRN-derived properties exposed via `getOddrnProperties` include `host` and `database` of every data source — for deployments intentionally avoiding internal hostname exposure, the Directory leaks them; reflection-based extractor walks every @PathField with no allow-list/redaction step (severity LOW)"
        - "No fail-closed per-route gate as a second line of defence — global filter regression silently makes `/api/directory*` open"
      cross_file_inconsistencies: []
      contributing_files:
        - "DirectoryController.md"
      evidence:
        - "DirectoryController.md:security.known_security_gaps.[0-3]"
    performance_aggregate:
      overall: LOW
      hot_paths:
        - "GET /api/directory (getDataSourceTypes) — Directory landing page, fires on every navigation; runs `dataSourceRepository.list()` (full scan, no pagination) AND `dataEntityRepository.getCountByDataSources()` aggregate count; cross-DB round-trips parallelised via Mono.zip but in-memory grouping cost grows linearly — DirectoryController"
        - "GET /api/directory/datasources?prefix={prefix} — every type-card click; runs `findByPrefix(prefix)` + per-source-id count + reflection-based ODDRN-property extraction on every returned source — DirectoryController"
        - "GET /api/directory/datasources/{id} — every entity-type drill-down click; delegates to dataEntityService.getDataEntitiesByDatasourceAndType which paginates at DB level (page/size mandatory @NotNull) — DirectoryController"
      throughput_shape:
        verdict: MIXED
        detail: "Level 4 (entities) paginates with mandatory page/size. Levels 1, 2, 3 return ALL matching items in single response — no pagination on the type-card list or per-prefix data-source list."
      scaling_shape:
        verdict: UNPAGINATED
        detail: "Levels 1, 2 unpaginated — response payload size grows O(N) with registered-data-source count. A platform with 10K+ data sources renders a 10K-item type-card landing page (after grouping, fewer cards but each carries the per-prefix count over all 10K rows). No HTTP caching, no ETag, no @Cacheable — every UI navigation re-runs the full pipeline."
      strengths:
        - "All four endpoints reactive (Mono/Flux)"
        - "Stateless controller — instances scale horizontally"
        - "Pagination at level 4 (entity-leaf) is mandatory (page + size @NotNull) — bounded response size for the leaf"
      weaknesses:
        - "No pagination on `/api/directory` (level 1 type list) — degrades response time and memory linearly with registered-data-source count (severity MEDIUM)"
        - "No pagination on `/api/directory/datasources?prefix=...` (level 2 data-source list) — single popular prefix (e.g. `postgresql` with 5K registered sources) produces 5K-item response with reflection-based property extraction per row (severity MEDIUM)"
        - "Reflection-based getOddrnPathProperties unmemoised — per request, per data source, the @PathField field set is re-discovered and the getter Method re-resolved (severity LOW)"
        - "No HTTP / server-side caching — data is read-mostly (registrations change rarely, counts at ingestion cadence) but every UI navigation re-runs full DB+grouping pipeline (severity LOW)"
        - "getDataSourceTypes runs aggregation across ALL data sources even though response only needs counts grouped by prefix; pre-aggregation by ODDRN-prefix at DB level would shrink work materially"
      cross_file_inconsistencies: []
      contributing_files:
        - "DirectoryController.md"
      evidence:
        - "DirectoryController.md:performance.known_performance_gaps.[0-4]"

  - name: "Slack collaboration app"
    canonical_in_docs: true
    canonical_candidate: false
    description: "Full Slack app for in-app per-entity Discussions threads — bidirectional integration via OAuth bot token (`datacollaboration.slack-oauth-token`) plus the Slack Events API webhook to read replies back into the platform (main-concepts.md Terms & Aliases: 'Slack collaboration app' aka 'Slack Events API', 'Slack OAuth integration', 'Data Collaboration Slack'). Outbound delivery is decoupled from HTTP request via `202 Accepted` + Postgres-advisory-lock-elected sender queue (DataCollaborationMessageSenderJob); inbound Slack events are consumed by a second leader-elected thread (DataCollaborationMessageEventProcessor). Both leader-election locks are operator-tunable advisory-lock-IDs (sender=120, receiver=110 by default). Batch 2026-05-12D adds `DataCollaborationProperties` — typed config-POJO that binds 3 of 7 `datacollaboration.*` keys (sender-message-advisory-lock-id, receive-event-advisory-lock-id, sending-messages-retry-count); the other 4 keys (`enabled`, `slack-oauth-token`, `message-partition-period`) are `@Value`-scattered across four different files. Partial-home pattern."
    axes_present:
      - controllers
      - config_prefixes
    nodes:
      - "odd-platform java DataCollaborationController controller-method:postMessageInSlack"
      - "odd-platform java org.opendatadiscovery.oddplatform.datacollaboration.config config-properties-class:DataCollaborationProperties"
    contributors:
      - "DataCollaborationController.postMessageInSlack: entities[MessageRequest, Message, MessagePojo, MessageChannelDto, MessageProviderDto, DataEntityPojo]; operations[enqueue-slack-message, resolve-channel-by-id, resolve-data-entity, persist-pending-message]"
      - "DataCollaborationProperties (batch 2026-05-12D): entities[DataCollaborationProperties, Postgres advisory lock, retry budget, message-sender thread, message-event-receiver thread]; operations[bind 3 of 7 datacollaboration.* keys, validate retry-count non-negative at @PostConstruct]; invariants[`sending-messages-retry-count >= 0` (DataCollaborationProperties.java:16-19); senderMessageAdvisoryLockId=120 default, receiveEventAdvisoryLockId=110 default; class has @ConditionalOnDataCollaboration gate (whole bean tree absent when datacollaboration.enabled=false); partial-home — only binds 3 keys, slack-oauth-token + enabled + message-partition-period are @Value-scattered]"
    evidence:
      - "postMessageInSlack.md:concepts.entities.[MessageRequest, Message, MessagePojo]"
      - "postMessageInSlack.md:concepts.operations.[enqueue-slack-message, resolve-channel-by-id, resolve-data-entity, persist-pending-message]"
      - "postMessageInSlack.md:implicit_adrs.[3,4] (decoupled 202+queue + Postgres-advisory-lock single-sender)"
      - "DataCollaborationProperties.md:concepts.entities + concepts.invariants + concepts.operations"
      - "DataCollaborationProperties.md:implicit_adrs.[0-2] (fail-fast retry validation + lock-id-as-property + Postgres advisory locks as election mechanism)"
      - "DataCollaborationProperties.md:bugs_limitations_corner_cases.[0-5] (lock-id collision risks, partial-home, no @Validated)"
    security_aggregate:
      overall: LOW
      auth_modes_relevant:
        - LOGIN_FORM
        - OAUTH2
        - LDAP
      ingestion_filter_relevance: NO
      authorization_consistency:
        verdict: UNGATED
        detail: "POST /api/datacollaboration/providers/slack/messages has NO @PreAuthorize, NO SecurityRule in SecurityConstants.SECURITY_RULES, and NO programmatic permission check in DataCollaborationServiceImpl.createAndSendMessage. Falls through to AuthorizationCustomizer.pathMatchers('/**').authenticated() catch-all (postMessageInSlack.md:security.known_security_gaps.[0] HIGH). The class is @ConditionalOnDataCollaboration-gated so endpoints return 404 when datacollaboration.enabled=false — but no permission gate above the authenticated-only baseline."
      owner_scoping:
        verdict: BYPASSES
        detail: "Service accepts any user-supplied data_entity_id with only existence + hollow-check (DataCollaborationServiceImpl.java:50-52); NO ownership check. User A can attach a message to a data entity owned by user B's owner — cross-tenant message-injection path (postMessageInSlack.md:security.known_security_gaps.[2] HIGH). Channel_id is also fully user-supplied (DataCollaborationController.java:34-37); no server-side mapping of `(data_entity, allowed_channels)`. Users without an owner association can still post — MessagePojo.ownerId is null (postMessageInSlack.md:security.known_security_gaps.[1] MEDIUM)."
      strengths:
        - "Disabled-by-default via @ConditionalOnDataCollaboration + application.yml:205 ships enabled: false explicitly"
        - "Fail-fast empty-check on `datacollaboration.slack-oauth-token` at boot — `throw new IllegalArgumentException` when unset (DataCollaborationConfiguration.java:23-25)"
        - "Spring's default Sanitizer masks `token`-suffixed keys via /actuator/env — `slack-oauth-token` matches the pattern so values are masked (postMessageInSlack.md:bugs_limitations_corner_cases.[8] LOW)"
        - "AsyncMethodsClient built once at boot — shared across all requests; no per-request client allocation (DataCollaborationConfiguration.java:27)"
      weaknesses:
        - "No authorization gate on POST — any authenticated user can post to any Slack channel the bot can reach, attached to any data_entity_id (postMessageInSlack.md:security.known_security_gaps.[0] HIGH)"
        - "Cross-tenant posting: user A can attach a message to user B's owned entity (postMessageInSlack.md:security.known_security_gaps.[2] HIGH)"
        - "Channel-id fully user-supplied; no `(data_entity, allowed_channels)` server-side mapping (postMessageInSlack.md:security.known_security_gaps.[3] MEDIUM)"
        - "No body validation: MessageRequest.text is `required` only — no max-length, no sanitisation; 4MB body accepted and persisted; Slack's per-message ~40KB limit only hits AFTER 202 has returned (postMessageInSlack.md:bugs_limitations_corner_cases.[1] MEDIUM)"
        - "No audit logging — `messages` row records ownerId but not the calling user's id when no owner association; no log.info on the post path (postMessageInSlack.md:bugs_limitations_corner_cases.[6] MEDIUM)"
        - "No rate limit / throttling — single authenticated user can flood the messages table; sender thread is the bottleneck, not the inbound (postMessageInSlack.md:bugs_limitations_corner_cases.[7] MEDIUM)"
        - "Slack error leak: SlackAPIException messages persisted to messages.failure_reason via `markMessageAsFailed(message.getUuid(), e.getMessage())` — literal Slack error strings (`invalid_auth`, `token_revoked`) become a token-state oracle if surfaced via read endpoints (postMessageInSlack.md:security.known_security_gaps.[4] LOW)"
        - "Slack rate-limit handling is non-discriminating — every Exception caught at DataCollaborationMessageSenderJob.java:55 retried 3× with fixed 1-second sleep, regardless of whether it's 429/auth/channel error (postMessageInSlack.md:bugs_limitations_corner_cases.[5] MEDIUM)"
        - "**No upper bound on `sending-messages-retry-count` — operator setting Integer.MAX_VALUE blocks the single-leader sender thread indefinitely on poisoned messages (MEDIUM — batch D primary-source)** — `DataCollaborationProperties.validate()` enforces `>= 0` only; no upper bound. Combined with the fixed 1-second `Thread.sleep(1000)` between retries in `DataCollaborationMessageSenderJob.java:60`, a single poisoned message can block the whole deployment's Slack delivery indefinitely. (DataCollaborationProperties.md:bugs_limitations_corner_cases.[1])"
        - "**Lock-ID collision risk with cross-subsystem advisory locks (MEDIUM — batch D primary-source)** — `DataCollaborationProperties.senderMessageAdvisoryLockId` (default 120) and `receiveEventAdvisoryLockId` (default 110) are operator-tunable but unvalidated. No `@PostConstruct` check that they are mutually disjoint and disjoint from sibling advisory-lock subsystems (`partition.advisory-lock-id`=90 + `notifications.wal.advisory-lock-id`=100). An operator who copies default 100 into `datacollaboration.sender-message-advisory-lock-id` silently makes the Slack sender + Notifications WAL subscriber contend on the same Postgres advisory lock — neither subsystem works. (DataCollaborationProperties.md:bugs_limitations_corner_cases.[2] + security.known_security_gaps.[1])"
        - "**Partial-home @ConfigurationProperties — config-prefix coverage incomplete on the typed POJO (LOW — batch D primary-source)** — `DataCollaborationProperties` binds only 3 of the 7 `datacollaboration.*` keys. The other 4 (`enabled`, `slack-oauth-token`, `message-partition-period`) are scattered as `@Value` reads across `DataCollaborationConfiguration.java:21`, `FeatureResolverImpl.java:17`, `DataCollaborationFeatureCondition.java:18-22`, and `MessageTablePartitionManager.java:19`. A maintainer reading the Properties class to understand the config-prefix sees three int fields and would falsely conclude the prefix has only three keys. Surfaced separately as a cross-cutting invariant. (DataCollaborationProperties.md:bugs_limitations_corner_cases.[3,4])"
      cross_file_inconsistencies:
        - "Live /developer-guides/api-reference/data-collaboration documents the endpoint but omits authentication/authorization, request validation, and rate-limit behaviour — operators reading the docs cannot infer the security model (postMessageInSlack.md:docs_link_semantic.doc_drift_findings.[0,1])"
        - "Live /active-platform-features/data-collaboration returns 404 even though source exists in documentation/docs/active-platform-features/data-collaboration.md — operators Googling 'odd data collaboration' currently land on broken page (postMessageInSlack.md:docs_link_semantic.doc_drift_findings.[2] HIGH for doc-drift)"
      contributing_files:
        - "postMessageInSlack.md"
        - "DataCollaborationProperties.md"
