  Doc-side / spec-side: rename `info.title` to 'Open Data Discovery
  Platform API'; change `info.contact` to a shared GitHub repo URL +
  shared mailbox. One-line spec changes; downstream visibility on
  every deployment's Swagger UI.
- |-
