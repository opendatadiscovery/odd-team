proposed_action: |-
  Add `OwnerServiceImplVisibilityAsymmetryTest.softDeletedOwner_invisibleViaList_visibleViaGetOwnerDtoById_pinsServiceTierAsymmetry`. (a) Testcontainers integration test. (b) Authenticate as an admin user. (c) Create Owner X via POST /api/owners. (d) DELETE /api/owners/{X.id} (soft-delete). (e) GET /api/owners — assert X is NOT in the response (filtered by listCondition). (f) GET /api/owners/{X.id} — assert HTTP 200 with X's full DTO (NOT 404). (g) Add a `// REGRESSION-PIN — Soft-deleted owners are INVISIBLE via list but VISIBLE via getOwnerDtoById. The asymmetry is at ReactiveOwnerRepositoryImpl.getDto (no deleted_at filter) vs ReactiveAbstractSoftDeleteCRUDRepository.listCondition (filter present). A REFACTOR that unifies the visibility (either filtering getDto OR not filtering list) will flip one half of this test, making the choice deliberate. If the deleted Owner's name is sensitive PII the by-id surface leaks it — the test surfaces this attack precondition for triage.` comment block.
