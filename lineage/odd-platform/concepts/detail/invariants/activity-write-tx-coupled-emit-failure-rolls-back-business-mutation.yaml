evidence:
- |-
  ActivityServiceImpl.md:stress_findings.S-E-1 — "The answer depends on
  the caller path" with three caller paths enumerated; all three are
  TX-coupled. "Roll back the business mutation → roll back the activity
  row. Activity emit fails → roll back the mutation. CONSISTENT but
  potentially surprising."
- |-
  ActivityServiceImpl.md:concepts.invariants.[4] — "Activity emit
  ordering across multi-statement writes is the responsibility of the
  caller's TX, not this service. ... When the caller is
  ActivityAspect.monoActivityAspect (line 42), the aspect's
  @ReactiveTransactional wraps the WHOLE business method + the
  postActivity emit — so the activity row is in the SAME TX as the
  mutation."
- |-
  ActivityHandler.md:concepts.invariants.[5] — "Wrapping @ReactiveTransactional
  makes audit emission TX-coupled. The aspect (ActivityAspect:42, 62)
  annotates the around-advice methods with @ReactiveTransactional;
  thus getContextInfo + the underlying mutation + getUpdatedState +
  createActivityEvent all share ONE R2DBC transaction. Emit failure
  rolls back the actual mutation. This is the intended audit-or-fail
  semantic, but is not stated anywhere — a future caller that expects
  best-effort audit would be surprised."
- |-
  ActivityHandler.md:tests_coverage_semantic.uncovered_behaviours —
  "TX-coupled emit failure rolls back the wrapping mutation — no test
  asserts that an ActivityRepository.saveReturning failure inside the
  aspect's @ReactiveTransactional rolls back the wrapped business
  mutation. A future regression that splits the TX (e.g. moves the
  activity emit to an @Async post-commit hook) would silently change
  the audit-or-fail semantic." Severity MEDIUM
