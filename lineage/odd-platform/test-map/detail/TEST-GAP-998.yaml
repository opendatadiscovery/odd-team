proposed_action: |-
  Add `termsRouteBareUrl.test.tsx` under `odd-platform-ui/src/components/App/__tests__/`:

  (a) `visitingBareTerms_rendersNothingInOutlet_pinsCurrentBlankBehavior`: drive `<App>` in a MemoryRouter initialised at `/terms`; assert the AppToolbar IS rendered AND assert NO `TermDetails` / `TermSearch` / `Navigate` element is mounted inside the route outlet (the page area is empty). Pins the current behaviour.

  (b) `visitingTermsWithTermId_rendersTermDetails`: assert `/terms/42/overview` correctly mounts `<TermDetails>` (sanity check the rest of the route tree works).

  Decision-point comment at App.tsx:66 documenting THREE options for fixing this in a future maintenance pass: (1) Add `<Route index element={<Navigate to='/termsearch' replace />} />` — redirects to the search surface (consistent with Dictionary tab UX); (2) Add `<Route index element={<TermSearch />} />` — bare `/terms` and `/termsearch` both show the search UI; (3) Add `<Route index element={<EmptyTermsPlaceholder />} />` — explicit empty-state. The test should be updated to lock in whichever option is chosen.

  Pair with DOC-GAP-NNN (doc-side fix): the Business Glossary page at `https://docs.opendatadiscovery.org/features/data-glossary/business-glossary` should either name the URL `/termsearch` explicitly OR drop the "list" framing in favour of "search" so the operator mental model matches.
