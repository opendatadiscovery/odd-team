- id: H-010
  hypothesis: "When an operator types a malformed mention like [[:foo]] (empty namespace) or [[foo:]] (empty term) in the editor, the UI and backend agree on whether it is a valid term mention."
  derivation: "Consistency-across-platform UX seed (Rule 9): a user expects the live editor preview and the persisted behaviour to agree on what counts as a mention."
  seed_source: ui-label + negative-space (cross-layer naming/parse drift, Rule 4)
  validation:
    verdict: partial
    actual_behavior: |
      The UI and backend regexes DIVERGE (Rule-4 cross-layer drift). UI TERM_PATTERN
      = /\[\[([^:\]]+):([^\]]+)\]\]/g (lib/constants.ts:177) REQUIRES non-empty namespace AND non-empty term
      (character class one-or-more). Backend Pattern.compile("\\[\\[([^:]*?):([^\\]]*?)\\]\\]")
      (TermServiceImpl.java:67) is non-greedy and ALLOWS empty groups. So [[:foo]] / [[foo:]] is INVISIBLE to
      the UI parser (renders verbatim, no link, no error) but the backend parses it (then short-circuits on the
      empty group inside handleDataEntityDescriptionTerms). For an interactive UI user the behaviour is
      consistent (both effectively no-op the malformed mention), so the promise holds for the screen user; for
      a programmatic caller writing descriptions with empty groups, the two layers silently disagree with no
      error surfaced anywhere.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataEntityDescription
        section: invariants[3] + bugs_limitations_corner_cases (UI/backend regex divergence)
        cite: "lib/constants.ts:177 (UI regex) + TermServiceImpl.java:67 (backend regex)"
        note: "UI requires non-empty groups; backend allows empty — latent inconsistency"
    operator_visible_failure: |
      (a) A programmatic caller (odd-cli / collector) that writes [[:foo]] sees the UI render it verbatim later
      while the backend silently no-ops it — neither surfaces an error, so a typo in a mention is undetectable.
      (b) Subtle confusion if a description is authored partly via API and partly via UI: the same string is
      parsed by two different grammars. Severity LOW (both layers effectively ignore the malformed mention; the
      drift is a correctness-of-contract concern, not a data bug).
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: grammar
    coverage: unverified
    test_ref: null
    test_demand: functional
    use_case_note: "No test pins the UI-regex vs backend-regex parity contract. The grammar-divergence promise is unverified at both layers."

- id: H-011
  hypothesis: "When an operator is editing a long description and clicks Cancel (or accidentally navigates away), the platform protects their in-flight work (confirm prompt, draft preservation, or warn-on-navigate)."
  derivation: "Senior-product-owner UX seed (Rule 9 — convenience / data-loss avoidance): a user editing a long body expects not to lose work on an accidental cancel."
  seed_source: negative-space (UX convenience)
  validation:
    verdict: contradicted
