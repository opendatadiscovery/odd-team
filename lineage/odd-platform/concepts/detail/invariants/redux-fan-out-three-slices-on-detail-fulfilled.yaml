name: Redux Fan-Out — Three Slices Mutated on Detail Fulfilled
canonical_in_docs: false
canonical_candidate: false
pillar_affinity:
- P-01
description: |-
  **NEW INVARIANT, batch 2026-05-19J**. The `fetchDataEntityDetails` thunk's
  `fulfilled` action triggers SIMULTANEOUS extraReducers in THREE Redux slices:
  (a) `dataentities.slice.ts:97-99` — `byId[payload.id]` populated with the full
  `DataEntityDetails` payload minus metadata + ownership (those fields stripped
  by `updateDataEntity` at lines 20-67); (b) `metadata.slice.ts:18-22` —
  `metadataFieldValues` extracted into the metadata-by-entity index;
  (c) `owners.slice.ts:52-54` — `ownership` extracted into the owners-by-entity
  index. **All three reducers consume the SAME `{ payload }` and partition it by
  field**. **The author rejected a "nested entity record" shape in favour of
  side-by-side normalised slices** — visible in the verbatim comment at
  `dataentities.slice.ts:55`: `// Metadata and Ownership are being stored in
  MetadataState and OwnersState`. **The fan-out is synchronous at fulfilled-time**:
  three slices update in the same Redux action dispatch tick; no async/debounced
  reducer composition. **Consequence for component rendering**: every component
  subscribing to any of the three slices (Header reads owners, Tabs read metadata,
  child route components read dataentities) re-renders on the same action — the
  detail-page repaint is atomic relative to the response landing. **Fragility**:
  a backend field-name change on `DataEntityDetails` (e.g. renaming `ownership`
  to `owners`) could silently break the metadata-slice or owners-slice extraReducer
  WITHOUT breaking compilation if the field becomes optional in the OpenAPI-generated
  type. A future contributor authoring a new slice that ALSO consumes
  `fetchDataEntityDetails.fulfilled` would not need to coordinate with the existing
  three — extraReducers are additive — but the field-partition discipline relies
  on convention, not type-level enforcement.
