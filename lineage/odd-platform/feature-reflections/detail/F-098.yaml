## cross_references

### bug_candidates
- hypothesis_id: H-001
  severity: HIGH
  one_line: |-
    `/api/slack/events` implements no X-Slack-Signature HMAC verification — any
    internet host can forge Slack events that materialise into messages on a
    real entity's Discussions tab.
  dedup_status: already_tracked
  tracked_as: PLT-054
  recommended_log_as: n/a (PLT-054 Defect 1 — drafted upstream-issue)
  proposed_fix_anchor: |-
    Bind @RequestHeader X-Slack-Signature + X-Slack-Request-Timestamp on
    EventApiController; add a WebFilter / verifier computing HMAC-SHA256 over
    `v0:{timestamp}:{body}` against `datacollaboration.slack-signing-secret`;
    reject 401 + reject stale timestamps (>5min). (PLT-054 carries the exact
    code sketch.)
- hypothesis_id: H-004
  severity: HIGH
  one_line: |-
    Slack at-least-once delivery has no platform-side dedup — duplicate events
    materialise duplicate child messages on the Discussions tab.
  dedup_status: already_tracked
  tracked_as: PLT-054
  recommended_log_as: n/a (PLT-054 Defect 2; also overlaps PLT-035)
  proposed_fix_anchor: |-
