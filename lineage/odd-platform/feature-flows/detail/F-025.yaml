    wraps `query-examples` in `<WithPermissionsProvider allowedPermissions={[QUERY_EXAMPLE_CREATE]}>`,
    and DataModellingRoutes.tsx:31-37 wraps `query-examples/:queryExampleId`
    in `<WithPermissionsProvider allowedPermissions={[QUERY_EXAMPLE_UPDATE, QUERY_EXAMPLE_DELETE]}>`.
    INSPECTION of WithPermissionsProvider.tsx:11-49 + PermissionProvider.tsx:12-46:
    the wrapper UNCONDITIONALLY renders its child; it only computes `isAllowedTo`
    and exposes it via React Context. The actual gate (`WithPermissions` —
    NO `Provider` suffix — at WithPermissions.tsx:27-29) returns null only
    inside QueryExamples.tsx:36-46 (the Add-button gate). A user without
    `QUERY_EXAMPLE_CREATE` who navigates to `/data-modelling/query-examples`
    STILL SEES the catalog list — only the Add-button is hidden. **The doc
    page (live https://docs.opendatadiscovery.org/features/data-modelling
    WebFetched 2026-05-26 status 200) phrases creation as `RBAC-gated by
    QUERY_EXAMPLE_CREATE` — overstates the restriction; the page is OPEN to
    read for every authenticated user.** This is the UI-layer manifestation
    of F-025's existing `ten_of_thirteen_endpoints_no_security_rule_authenticated_only`
    facet. NEW route-tier drift facet:
    `with_permissions_provider_context_only_not_route_gate_doc_overstates_restriction`.

    (b) **`/data-modelling/query-examples/:queryExampleId` requires BOTH
    QUERY_EXAMPLE_UPDATE AND QUERY_EXAMPLE_DELETE** (PermissionProvider.tsx:21-25
