      createTerm/updateTerm + F-019 OpenAPI 201-vs-impl 200 class-wide
      on Owner create + update + F-013 metadata-field create. Generated
      client SDKs branching on 201 would never enter the success branch.
    expected: |-
      Align controller and spec — either (a) controller returns 201 via
      `.map(qe -> ResponseEntity.status(HttpStatus.CREATED).body(qe))`
      OR (b) spec updates to declare 200. CONVENTION across the platform
      to date has been controller-200 + spec-201; the recommended fix is
      spec-side alignment to the de-facto contract.
    drift_class: spec_says_201_impl_returns_200_create_and_update_drift
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      operations.createQueryExamples + updateQueryExample + cross-link
      F-002 + F-013 + F-019 same class.
      Severity LOW (cosmetic; SDK consumer impact).
  - facet: delete leaves stale FTS search-vector entrypoint row
    observed: |-
      `QueryExampleServiceImpl.deleteQueryExample` (lines 84-92) HARD-deletes
      the link rows (`data_entity_to_query_example` +
      `query_example_to_term`), then SOFT-deletes the query example
      itself via the inherited CRUD base
      (`ReactiveAbstractSoftDeleteCRUDRepository`). The
      `query_example_search_entrypoint` row (created by
      `updateQueryExampleVectors` at service line 166-167) is NOT cleaned
      up on delete. The FTS index will still contain the tombstoned
      example's vector until a separate housekeeping pass — which does
      not exist (no HousekeepingJob for query_example_search_entrypoint
      per F-010 batch K). The repository search filter does check
      `QUERY_EXAMPLE.DELETED_AT IS NULL` at lines 80, 99 (per
      ReactiveQueryExampleRepositoryImpl.java) — so deleted examples are
      filtered out of SEARCH results. But the entrypoint row leak is
      real: a future change to the search filter (e.g. forgetting the
      deleted_at check on a new search endpoint) would silently surface
      tombstoned examples.
    expected: |-
      Either (a) add `searchEntrypointRepository.deleteByQueryExampleId(id)`
      to the delete chain at QueryExampleServiceImpl.java:84-92 OR (b)
      add a HousekeepingJob that periodically reaps tombstoned vectors
      (matches the housekeeping pattern from F-010).
    drift_class: delete_search_vector_not_cleaned_up_fts_entrypoint_row_leak
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      bugs_limitations_corner_cases.[3] + invariants block re hard-delete
      + soft-delete asymmetry + cross-link F-010 housekeeping.
      Severity LOW (latent — only surfaces if the search filter changes).
  - facet: hard-delete-of-links vs soft-delete-of-entity asymmetry
    observed: |-
      `QueryExampleServiceImpl.deleteQueryExample` lines 84-92 — the
      link rows (`data_entity_to_query_example`, `query_example_to_term`)
      are HARD-deleted via `removeRelationWithDataEntityByQueryId` /
      `removeRelationWithTermByQueryId` (DELETE SQL). The query example
      itself goes through the soft-delete CRUD base (UPDATE
      query_example SET deleted_at = NOW(), is_deleted = TRUE). This
      asymmetry means a "deleted" query example tombstones with NULL
      relationship pointers — restore-by-undelete (if the platform ever
      adds that affordance) would lose all dataset/term context. The
      `data_entity_to_query_example` and `query_example_to_term` tables
      have NO `ON DELETE CASCADE` clause (V0_0_84__create_query_example.sql:18-22)
      — the cascade is service-orchestrated, not FK-enforced.
    expected: |-
      Either (a) preserve link rows as soft-deletes too (extend with
      `deleted_at` column on both join tables — requires migration) OR
      (b) document explicitly that "Query Example delete is irreversible
      for link associations — restore from the example tombstone will
      not recover dataset/term linkages".
    drift_class: delete_link_rows_hard_delete_vs_example_soft_delete_asymmetry
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      invariants.[6] + V0_0_84__create_query_example.sql:18-22.
      Severity LOW (forensic-only; platform does not currently expose a
      restore affordance).
  - facet: search session ownership via unguessable UUID — no per-caller check
    observed: |-
      `getQueryExampleSearchFacetList` / `getQueryExampleSearchResults` /
      `updateQueryExampleSearchFacetList` (controller lines 91-116)
      inherit session ownership from the `searchId` UUID — no explicit
      gate confirms the caller created the session. Any authenticated
      caller with a valid `searchId` UUID can fetch facets, read
      results, or update facet state. Same session-ownership-via-UUID
      shape as F-017 SearchController + F-024 TermSearch + the
      Reference Data search session F-026 minted this batch. Functionally
      OK because the UUID is unguessable (resource-capability pattern),
      but two operators sharing a UUID via Slack can race-mutate the
      same session.
    expected: |-
      Either (a) per-caller session-creator binding (write `created_by_user_id`
      to search_facets + check on update/get) OR (b) document the
      resource-capability model explicitly across the four search-session
      surfaces — sharing a search-session URL grants full session state
      access.
    drift_class: session_ownership_via_unguessable_uuid_no_per_caller_check
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      operations.getQueryExampleSearchFacetList + cross-link F-017 +
      F-024.
      Severity LOW (intentional resource-capability pattern; UX
      manifestation).
  - facet: read-collaborative posture — no per-owner / per-namespace filter
    observed: |-
      Every read endpoint on this controller — getQueryExampleByDatasetId,
      getQueryExampleByTermId, getQueryExampleDetails, getQueryExampleList,
      plus all 5 search endpoints — returns data across every namespace
      to every authenticated user. NO per-owner or per-namespace scoping
      is applied at the controller layer. Consistent with the
      platform-wide read-collaborative posture (system-mission.md:267),
      but Query Examples may contain SQL referencing internal table
      names — a low-but-non-zero information-disclosure surface that
      aggregates with the DataEntity name-disclosure surface.
    expected: |-
      Aligned with platform-wide stance; no fix required. Recommend a
      doc page note on the Query Examples surface highlighting "Query
      Example bodies may contain SQL referencing internal table/column
      names; the catalog is read-collaborative".
    drift_class: read_collaborative_posture_no_per_owner_per_namespace_filter
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      invariants.[3] + security.owner_scoping block.
      Severity LOW (architectural stance; UX manifestation).
  - facet: service tier has zero @PreAuthorize — controller perimeter is sole defence
    observed: |-
      QueryExampleServiceImpl has ZERO `@PreAuthorize` or programmatic
      permission checks (verified by reading lines 1-169 of the service
      file per the batch V sidecar). The controller perimeter (3
      SecurityRules + AuthorizationCustomizer catch-all) is the SOLE
      defence; if a non-HTTP caller invokes the service bean
      (cross-component composition or future internal use), no
      permission check fires. Aligned with the project-wide pattern
      (path-pattern matching at the Spring Security filter layer rather
      than declarative method-level guards) — same as F-019 OwnerService
      + F-006 PolicyService + F-006 RoleService.
    expected: |-
      Aligned with platform-wide convention; no fix required.
    drift_class: service_tier_no_preauthorize_controller_perimeter_sole_defence
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      invariants.[4] + cross-link F-019 + F-006 same pattern.
      Severity LOW (architectural convention).
  - facet: broken pagination — hasNext hardcoded false on by-dataset / by-term reads
    observed: |-
      `QueryExampleMapper.mapListToQueryExampleList` lines 72-74 always
      sets `hasNext = false` on the response shape used by
      `getQueryExampleByDatasetId` (controller line 52-56) +
      `getQueryExampleByTermId` (line 59-63) + `getQueryExampleSearchResults`
      (line 99-106). Callers cannot tell whether more rows exist;
      paginated UIs cannot show "Next" affordances correctly. Same
      shape as F-002 batch K `TermServiceImpl.listByTerm` broken-pagination
      finding.
    expected: |-
      Compute hasNext from the actual total vs page+size at the
      mapper layer.
    drift_class: broken_pagination_has_next_hardcoded_false_by_dataset_term_endpoints
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      concepts.QueryExampleList + invariants + cross-link F-002 batch K
      same finding.
      Severity LOW (operator-facing UX gap; SDK consumer impact).
  - facet: operationId plural typo — createQueryExamples (plural) creates single example
    observed: |-
      The OpenAPI operationId is `createQueryExamples` (plural) and the
      controller method preserves that name (line 26), but a single
      example is created per call — the body is a single
      QueryExampleFormData, not a list. The plural typo is cosmetic but
      visible in the generated SDK (`QueryExampleApiCreateQueryExamplesRequest`).
    expected: |-
      Rename to `createQueryExample` (singular) — requires spec change +
      generated SDK regeneration; minor breaking change for SDK
      consumers.
    drift_class: operation_name_plural_typo_create_query_examples_single_create
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      operations.createQueryExamples + concepts.QueryExampleFormData.
      Severity LOW (cosmetic).
  - facet: zero controller-tier test coverage
    observed: |-
      Per QueryExampleController batch V sidecar
      tests_coverage_semantic.test_files — NO controller-level tests
      exist. QueryExampleServiceTest covers `createQueryExample`,
      `createQueryExampleToDatasetRelationship` (a method NOT exposed
      by this controller — that endpoint lives on
      DataEntityController.createQueryExampleToDatasetRelationshipNew),
      `getQueryExampleDetails`, `deleteQueryExample`, and a
      `BadUserRequestException` duplicate-relation path — but the HTTP
      wiring is untested.
    expected: |-
      Add @WebFluxTest covering the 13 endpoints — 404 on missing id,
      authorization-enforcement (DATA_ENTITY_ATTACHMENT_MANAGE-style 403
      regression-pin), spec-vs-impl response code drift pin, broken
      pagination pin, search-session ownership behaviour pin.
    drift_class: zero_controller_tier_test_coverage
    provenance: |-
      STATIC — primary-source at QueryExampleController batch V sidecar
      tests_coverage_semantic.test_files.
      Severity MEDIUM.
