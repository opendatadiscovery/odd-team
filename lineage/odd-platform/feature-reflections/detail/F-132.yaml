    Enrich the QueryExampleDetails subtree as first-class react-component sidecars (the same gap the F-025
    sibling reflection flagged for the QueryExample list/form/detail subtree): capture the ?tab URL-state
    round-trip + the no-validation fallthrough (facet[0]), the two count-badge sources + the asymmetry
    (facet[1]), the two read-only tables + EmptyContentPlaceholder usage on BOTH (facet[3] + H-010), the
    Overview MDEditor.Markdown render sites (F-004 4th surface), the absence of a breadcrumb (facet[2]),
