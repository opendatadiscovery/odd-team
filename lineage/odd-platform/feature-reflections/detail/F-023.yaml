# Directory — hierarchy-driven catalog browse — product-owner reflection

## product_owner_narrative

The Directory is ODD Platform's hierarchy-driven way to find data when you don't have a search term in mind — the complement to query-driven Search inside the Data Discovery pillar (per `system-mission.md` P-01; per `odd-platform__java__DirectoryController__controller-class__DirectoryController.md:understanding`). Where Search asks "what are you looking for?", the Directory answers "what is registered here, and how is it organised?". You reach it from the global toolbar's unconditional "Directory" tab (per `odd-platform__ts__routes__route__directory.md:couples-to` — `ToolbarTabs.tsx:42`), landing on a grid of cards — one card per kind of data source the platform has ingested (PostgreSQL, Snowflake, Kafka, Airflow, …), each card showing how many entities that kind holds (per `odd-platform__ts__react-component__component__Directory.md:understanding` — `Directory.tsx:38-45` + `DirectoryItem.tsx:23-25`).

A user drills in four levels: pick a source TYPE (level 1, the card grid) → see the registered INSTANCES of that type with their connection properties and per-instance entity counts (level 2) → see the entity TYPES present in one instance (level 3) → see the paged list of ENTITIES of a chosen type within that instance (level 4) (per the live doc page, WebFetched 2026-05-26 status 200, via `odd-platform__ts__routes__route__directory.md:docs_link_semantic`; backed by the four GET endpoints at `DirectoryController.java:23-51`). Each UI level maps to exactly one backend call — navigation is on-demand, not a single tree fetch (per `DirectoryController.md:implicit_adrs[1]`). The level-1/2/3 lists are unpaginated; only level 4 paginates, with `page` and `size` mandatory (per `DirectoryController.md:implicit_adrs[3]` + `openapi.yaml:3810-3811`).

The working parts a product owner would demo: the ODDRN-prefix grouping that turns a flat datasource table into a type taxonomy; the per-bucket and per-source entity counts that let an operator audit "did the collector actually pull from this source?"; the level-2 properties panel that shows each instance's host / database / port (PostgreSQL) or account / warehouse (Snowflake) or cluster / topic (Kafka), derived at request time by reflecting over the registered ODDRN (per `DirectoryController.md:understanding` + `DirectoryServiceImpl.java:138-171`); and the `Other` bucket that catches any datasource whose ODDRN failed to parse (per `DirectoryController.md:implicit_adrs[2]`). The level-4 type tabs (`All` + one tab per entity type) let a user narrow to just Tables, just Jobs, etc. (per the batch-extension notes — `EntitiesTabs.tsx`).

Integration story: the Directory is the READ counterpart of Batch Ingestion (F-008 / P-10) — it surfaces what producers populate; it is a sibling browse surface to Search (F-017) and to the lineage graph (F-005) within Discovery (per the feature-flow `cross_pillar_relationships`). It shares the read-collaborative posture of Security (P-09): the four endpoints carry no `@PreAuthorize` and no `SecurityConstants` rule, so they fall to the global `.authenticated()` gate, and clicking any level-4 entity navigates to that entity's detail page — the same path that closes the F-001 view-count inflation loop (per the batch ui-review-2026-05-26 note D).

Edge cases a careful demo would flag: the level-1 grid is a stale-while-revalidate singleton — a datasource registered in Management does not refresh the Directory for a user already on the page (per `Directory.md:downstream_side_effects` — no `invalidateQueries`); the `Other` bucket renders as an ordinary card with no signal that it represents a parse failure (per `Directory.md:bugs_limitations_corner_cases[1]`); a deployment with thousands of same-type sources returns all of them in one unbounded level-2 response (per `DirectoryController.md:bugs_limitations_corner_cases[6]`); and the level-4 count and page queries use different predicate sets, so the "X of Y" header can disagree with the rows actually returned (per `DirectoryController.md:coherence_check.conflicts_surfaced[0]`).

