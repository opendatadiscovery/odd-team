name: DEG-membership returns empty-200 / DEG-lineage returns 404 — contract asymmetry between two paths for the same condition
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-05
- P-11
description: |-
  **NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-20-Z (getDataEntitiesByDEGOddrn sidecar)** —
  the platform exposes TWO closely-related read endpoints, both keyed by
  a DEG ODDRN / DEG id, both returning DEG-scoped graph data, both
  hitting the same DEG-membership tables — but they implement DIFFERENT
  shapes for the SAME semantic condition (the DEG has no resolvable members):
    - `GET /ingestion/entities/{deg_oddrn}` (the S2S read endpoint, batch Z):
      DataEntityGroupServiceImpl.listEntitiesWithinDEG (line 92-108) maps
      the always-present `Mono<List<DataEntityPojo>>` to a CompactDataEntityList
      with empty items. No switchIfEmpty(Mono.error(...)). UNKNOWN DEG +
      EMPTY DEG + MALFORMED ODDRN all return `200 OK` with `items: []`.
    - `GET /api/dataentitygroups/{data_entity_group_id}/lineage` (the
      UI-side endpoint, sidecar getDataEntityGroupsLineage batch M):
      LineageServiceImpl.getDataEntityGroupLineage (line 62) explicitly
      `.switchIfEmpty(Flux.error(new NotFoundException("Data entity
      group", id)))` for the same empty-membership condition. Returns
      `404 Not Found`.

  **The structural consequence**: a third-party integration that wires
  BOTH endpoints (e.g. a custom dashboard walking the catalog's DEG
  graph + reading membership) must handle TWO different response shapes
  for the same semantic situation. The S2S read silently conflates
  "DEG exists with no members" / "DEG does not exist" / "wrong ODDRN
  format"; the UI-side lineage endpoint distinguishes "DEG does not
  exist" (404) from "DEG exists with empty edges" (200 with empty
  streams) — but only for the lineage shape, not for the membership
  shape.

  **The four conditions and their responses on each endpoint**:
  Condition                         | get-by-deg-oddrn | get-deg-lineage
  -------------------------------- | ---------------- | ---------------
  DEG exists, has N>0 members      | 200 + N items     | 200 + N streams
  DEG exists, has 0 members        | 200 + []          | 404
  DEG does not exist               | 200 + []          | 404
  Malformed ODDRN                  | 200 + []          | 404

  Three of the four conditions produce different status codes on the
  two endpoints. The asymmetry is silent — no live doc on either
  endpoint warns about it.

  **The directional remedy candidates**:
    (a) Align S2S read to UI behaviour: add
        `.switchIfEmpty(Mono.error(NotFoundException))` to
        DataEntityGroupServiceImpl.listEntitiesWithinDEG. Surface 404
        for unknown + empty DEG + malformed. Breaks the silent-empty
        contract; surfaces malformed-input cases as authentic 404
        instead of silent empty.
    (b) Align UI lineage to S2S behaviour: REMOVE the
        `.switchIfEmpty(Flux.error(NotFoundException))` at
        LineageServiceImpl.java:62. Return 200 with empty streams.
        Aligns to S2S; removes the operator-friendly 404 distinction.
    (c) Keep the asymmetry but document it. The maintainer's call.

  **Severity MEDIUM**: contract-shape gap, not security gap. Third-party
  integrations consuming both endpoints face complexity; operators
  reading either endpoint in isolation are unaffected.
