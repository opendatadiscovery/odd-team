  - "deleteOwner.md says (tests_coverage_semantic.uncovered_behaviours): 'Idempotency — no test exercises DELETE /api/owners/{id} twice... Not-found surface — no test exercises DELETE /api/owners/9999999 (non-existent id). Same shape as the idempotency case: empty result + HTTP 204.'"
  - "Source: OwnerServiceImpl.java:88-100 (delete, no NotFound check) vs OwnerServiceImpl.java:69-85 (update with switchIfEmpty)"
