security_aggregate:
  overall: LOW
  auth_modes_relevant:
  - LOGIN_FORM
  - OAUTH2
  - LDAP
  - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      DirectoryController has zero @PreAuthorize annotations and no entry in
      SecurityConstants.SECURITY_RULES (rule list is mutating-method-only; all
      four Directory routes are GETs). Falls through to global SecurityFilterChain
      `authenticated()` rule. Under auth.type=DISABLED Directory is open to any
      caller. Confirmed at controller-class layer in batch T — grep `/api/directory`
      across SecurityConstants returns zero matches.
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      All four Directory endpoints return platform-wide aggregates with no
      filtering by current user's owner identity. `getDataSourceTypes` lists
      every registered data source via unfiltered `dataSourceRepository.list()`.
      `getDirectoryDatasourceList(prefix)` returns every data source matching
      the prefix. Directory is a non-owner-scoped view of the whole catalogue
      — any authenticated user (in LOGIN_FORM/OAUTH2/LDAP) can enumerate every
      registered data source's name, ODDRN, host, database, port, plus
      per-prefix and per-source entity counts.
  strengths:
  - Read-only feature surface — no mutation paths to gate
  - Stateless controller — no in-memory session state
  weaknesses:
  - |-
    Directory is a reconnaissance surface: an authenticated user with no
    Permissions and no Owner association can still enumerate every registered
    data source's ODDRN, host, database, port, plus per-type entity count
    (severity MEDIUM — confirmed at controller-class layer in batch T)
  - |-
    Live `data-discovery/directory` doc page does NOT warn operators that
    Directory is platform-wide and unscoped by ownership (severity MEDIUM —
    re-verified live 2026-05-20 still silent)
  - |-
    **ODDRN-property reflection leak (NEW batch T invariant): getOddrnProperties
    emits EVERY @PathField-annotated property on the OddrnPath subclass — Postgres
    → host + database + port; Snowflake → account + warehouse + database + schema;
    Kafka → cluster + topic; no allow-list, no redaction, no per-property
    visibility gate. Deployments intentionally avoiding internal hostname exposure
    still leak them via the Directory level-2 response (severity LOW — rises to
    MEDIUM in hostname-sensitive deployments; rises to HIGH under DISABLED).**
  - |-
    No fail-closed per-route gate as a second line of defence — global filter
    regression silently makes `/api/directory*` open
  - |-
    Under auth.type=DISABLED, the Directory becomes an unauthenticated read
    of the entire data-source inventory PLUS the ODDRN-derived infrastructure
    map (the reflection extractor's payload). Cross-link REFACTOR-185 (19-SIDECAR
    strongest); the DISABLED-mode amplifier for the infrastructure leak.
  cross_file_inconsistencies:
  - |-
    The v0.1.0 controller-axis sidecar (session-2026-05-08-01, enriched_at_commit
    ede5d277) recorded cross-owner / no-pagination / reflection-leak findings at
    HIGH-MEDIUM severity. Batch T's v0.3.0 controller-class sidecar (enriched_at_commit
    9ac6436e) RE-VERIFIES at primary source and ADDS the page-vs-count predicate
    divergence and the reflection-extractor framing. The v0.1.0 sidecar is
    marked STALE-but-not-deleted (historically valid; superseded by batch T).
  contributing_files:
  - DirectoryController.md
  - DirectoryController controller-class.md
  evidence:
  - DirectoryController.md:security.known_security_gaps.[0-3]
  - |-
    DirectoryController (class).md:security.known_security_gaps.[0] (reconnaissance
    surface MEDIUM)
  - |-
    DirectoryController (class).md:security.known_security_gaps.[1] (no fail-closed
    per-route gate LOW)
  - |-
    DirectoryController (class).md:security.known_security_gaps.[2] (ODDRN-property
    reflection leak LOW)
  - |-
    DirectoryController (class).md:security.known_security_gaps.[3] (auth.type=DISABLED
    reachability LOW; rises with REFACTOR-185)
performance_aggregate:
  overall: LOW
  hot_paths:
  - |-
    GET /api/directory (getDataSourceTypes) — Directory landing page, fires on
    every navigation; runs `dataSourceRepository.list()` (full scan, no pagination)
    AND `dataEntityRepository.getCountByDataSources()` aggregate count;
    cross-DB round-trips parallelised via Mono.zip but in-memory grouping cost
    grows linearly — DirectoryController
  - |-
    GET /api/directory/datasources?prefix={prefix} — every type-card click; runs
    `findByPrefix(prefix)` + per-source-id count + reflection-based ODDRN-property
    extraction on every returned source — DirectoryController
  - |-
    GET /api/directory/datasources/{id} — every entity-type drill-down click;
    delegates to dataEntityService.getDataEntitiesByDatasourceAndType which
    paginates at DB level (page/size mandatory @NotNull) — DirectoryController.
    **NEW batch T finding**: the page query and count query use DIFFERENT
    predicates (see security/correctness invariant
    `data-entity-page-vs-count-predicate-divergence-exclude-from-search`).
  throughput_shape:
    verdict: MIXED
    detail: |-
      Level 4 (entities) paginates with mandatory page/size. Levels 1, 2, 3
      return ALL matching items in single response — no pagination on the
      type-card list or per-prefix data-source list.
  scaling_shape:
    verdict: UNPAGINATED
    detail: |-
      Levels 1, 2 unpaginated — response payload size grows O(N) with
      registered-data-source count. A platform with 10K+ data sources renders
      a 10K-item type-card landing page (after grouping, fewer cards but each
      carries the per-prefix count over all 10K rows). No HTTP caching, no
      ETag, no @Cacheable — every UI navigation re-runs the full pipeline.
  strengths:
  - All four endpoints reactive (Mono/Flux)
  - Stateless controller — instances scale horizontally
  - |-
    Pagination at level 4 (entity-leaf) is mandatory (page + size @NotNull) —
    bounded response size for the leaf (but per the new batch T finding, the
    bound is over a slightly different population than the count reports)
  weaknesses:
  - |-
    No pagination on `/api/directory` (level 1 type list) — degrades response
    time and memory linearly with registered-data-source count (severity MEDIUM)
  - |-
    No pagination on `/api/directory/datasources?prefix=...` (level 2 data-source
    list) — single popular prefix (e.g. `postgresql` with 5K registered sources)
    produces 5K-item response with reflection-based property extraction per row
    (severity MEDIUM)
  - |-
    Reflection-based getOddrnPathProperties unmemoised — per request, per data
    source, the @PathField field set is re-discovered and the getter Method
    re-resolved (severity LOW)
  - |-
    No HTTP / server-side caching — data is read-mostly (registrations change
    rarely, counts at ingestion cadence) but every UI navigation re-runs full
    DB+grouping pipeline (severity LOW)
  - |-
    getDataSourceTypes runs aggregation across ALL data sources even though
    response only needs counts grouped by prefix; pre-aggregation by ODDRN-prefix
    at DB level would shrink work materially
  - |-
    **Page-vs-count predicate divergence at level 4 (NEW batch T finding)**:
    DataEntityServiceImpl.getDataEntitiesByDatasourceAndType composes the page
    query via listByDatasourceAndType (HOLLOW + soft-delete only) and the count
    query via countByDatasourceAndType (HOLLOW + STATUS != DELETED +
    EXCLUDE_FROM_SEARCH). Pagination math breaks visibly in deployments using
    EXCLUDE_FROM_SEARCH (severity MEDIUM). STRUCTURALLY ANALOGOUS to REFACTOR-425.
  cross_file_inconsistencies: []
  contributing_files:
  - DirectoryController.md
  - DirectoryController controller-class.md
  evidence:
  - DirectoryController.md:performance.known_performance_gaps.[0-4]
  - |-
    DirectoryController (class).md:performance.hot_paths.[0-2]
  - |-
    DirectoryController (class).md:performance.known_performance_gaps.[0-4]
  - |-
    DirectoryController (class).md:coherence_check.conflicts_surfaced.[0]
    (page-vs-count predicate divergence — correctness AND performance shape concern)
notes: |-
  **Batch T (2026-05-20) adds**:
    - Controller-class layer evidence anchoring the four-level shape and the
      no-@PreAuthorize / no-SecurityConstants-entry posture
    - NEW invariant: data-entity-page-vs-count-predicate-divergence-exclude-from-search
      — SECOND known instance of the PREDICATE-DIVERGENCE-IN-PAGINATION-WRAPPERS
      bug class (first was REFACTOR-425). Recommended remediation: align the
      predicate sets in cteDataEntitySelect to match getDataEntityDefaultConditions.
    - NEW invariant: reflection-property-extractor-infrastructure-revealing —
      first concept-catalog framing of the reflection-based ODDRN property
      extractor as a distinct security observation. Recommended remediation:
      per-property allow-list (@VisibleInDirectory annotation) OR per-deployment
      configuration knob.
    - REFACTOR-024 strengthening to a 5th+ enumeration vector — Directory is the
      FLAT-LIST inventory enumeration sibling of REFACTOR-203's GRAPH-SHAPED vector;
      together they exhaust the catalog-shape reconnaissance surface.

  Open canonicalisation question per the DirectoryController class sidecar:
  the cross-owner read-collaborative posture has now been confirmed at SIX surfaces
  (alerts batch + alerts per-entity + search results + search facets + lineage
  graph + DEG-anchored lineage), and DIRECTORY is the SEVENTH (a flat-list
  inventory enumeration). If the maintainer accepts ADR-CANDIDATE-003
  (read-collaborative-GET) as intentional, the live `/features/data-discovery/directory`
  doc page needs an explicit 'Visibility' section disclosing that Directory is
  platform-wide unscoped — currently silent.
