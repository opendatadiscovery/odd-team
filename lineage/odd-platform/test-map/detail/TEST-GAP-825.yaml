behaviour: |-
  **HIGH — ODDRN-by-payload write creates metric_entity rows with NO referential integrity check, enabling Postgres-side AND Prometheus-side cardinality DoS at attacker-controlled rate.**

  `InternalIngestionMetricsServiceImpl.java:86-88` calls `metricEntityRepository.registerMetricEntityOddrns(request.metricRelatedOddrns())` — creates `metric_entity` rows BY ODDRN with NO check that a corresponding `data_entity.oddrn` row exists. The PROMETHEUS path writes the same ODDRN string as a Prometheus label value.

  **Attack chain**:
  1. Attacker submits unauthenticated `POST /ingestion/metrics` (per TEST-GAP-823) with `MetricSetList { items: [{oddrn: "literal:fake-1", metric_families: [...]}, {oddrn: "literal:fake-2"}, ...] }` — N items per request.
  2. INTERNAL_POSTGRES path: N rows inserted into `metric_entity` table. With no rate-limit, attacker submits thousands of requests per second.
  3. PROMETHEUS path: N TimeSeries with fake ODDRN labels written to operator's external Prometheus. Prometheus cardinality explodes proportional to attacker traffic.
  4. **Result on PROMETHEUS deployments**: operator's Prometheus storage costs balloon. Cardinality limits trigger (Prometheus's `--query.max-samples`, `--storage.tsdb.max-block-duration`); legitimate queries start failing. Same Prometheus may serve multiple ODD tenants (per the multi-tenant docs) — one attacker DoSes all tenants.
  5. **Result on INTERNAL_POSTGRES deployments**: `metric_entity` table grows unbounded. Index size + JOIN cost on `GET /api/dataentities/{id}/metrics` degrades.

  **No counter-measures**:
  - **No FK from `metric_entity.entity_oddrn` to `data_entity.oddrn`** (verified at JOOQ POJO level — `MetricEntityPojo` is independent of `DataEntityPojo`).
  - **No rate-limit at the controller** (`@RateLimiter` not present anywhere in `<odd-platform-repo>/odd-platform-api/src/main/java`).
  - **No per-tenant quota** — per metrics-ingestion concept `weaknesses` list.
  - **No PII filtering on labels** — TEST-GAP-826 sister covers the PII propagation chain.

  **Why HIGH** (the sidecar rates MEDIUM): the operator-borne cost (their Prometheus storage; their Postgres pressure) compounds without bound; the cross-tenant amplification (per TEST-GAP-824) makes one bad actor capable of degrading every co-tenant.

  **Test gap shape**: integration test that:
  1. Burst-POSTs metrics for 10K novel ODDRNs.
  2. Asserts `metric_entity` table grew by 10K rows.
  3. Asserts no rate-limit kicked in.
  4. Asserts no audit log entry.
  5. (PROMETHEUS variant) asserts external Prometheus testcontainer received 10K series.
