mitigations_unimplemented:
- |-
  Choose ONE predicate (recommended: `containsIgnoreCase` to match the
  inherited base and operator intuition) and align the other site.
  Concrete fix:
    REPLACE `DATA_SOURCE.NAME.startsWithIgnoreCase(nameQuery)` at
    ReactiveDataSourceRepositoryImpl.java:156 with
    `DATA_SOURCE.NAME.containsIgnoreCase(nameQuery)`
  Single-line change; no schema impact; no migration needed.
- |-
  Add the regression test from the test-coverage proposal:
    Create three datasources `['snowflake-prod', 'my-snowflake-dev',
    'redshift-prod']`; call listDto with `nameQuery='snow'`; assert
    `page.data.size == 2` (both snowflake entries) AND `page.total
    == 2` (parity); under the proposed fix the test passes;
    under the current bug the test fails with page.data.size == 1.
- |-
  Audit the other custom-listDto methods in the repository layer for
  similar private queryCondition vs inherited listCondition drift.
  Candidates to check: ReactiveCollectorRepositoryImpl (no private
  queryCondition observed in batch R sidecar — inherits cleanly),
  ReactiveTermRepositoryImpl, ReactiveTagRepositoryImpl,
  ReactiveOwnerRepositoryImpl, ReactiveRoleRepositoryImpl,
  ReactivePolicyRepositoryImpl, ReactiveNamespaceRepositoryImpl.
notes: |-
  This is a NARROW MEDIUM-severity bug — it affects the Management →
  Datasources tab filter and only manifests when name substring search
  reaches across the startsWith vs contains boundary. The bug class is
  PREDICATE-DIVERGENCE-IN-PAGINATION-WRAPPERS: any repository that
  shadows the inherited listCondition with a private queryCondition
  for the page query but reaches the count via the inherited base
  risks this defect.

  Cross-cutting connections:
    - Pairs with the inherited `ReactiveAbstractCRUDRepository`
      pattern — the parent's listCondition is the implicit
      contract; private shadow conditions break the parent's
      assumption that page query and count query are symmetric
    - Companion to the search-facets-bearer-token-shaped-no-user-binding
      invariant — both reflect pagination-correctness concerns in
      list endpoints, though the two have DIFFERENT root causes
    - Does NOT pair with the read-collaborative posture (this is a
      correctness bug, not an authorization bug; the catalog is read
      cross-owner regardless of nameQuery)

  Two DOC-NNN candidates flow from this invariant:
    (a) After the fix lands, update the docs to clarify the
        Management → Datasources tab's substring-search semantics
        (operators currently see broken pagination silently)
    (b) Add a one-line repository-layer convention note (e.g. to an
        internal architecture page) — "private queryCondition methods
        for paginated listDto MUST match the inherited listCondition
        the count branch uses"
