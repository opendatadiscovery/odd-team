behaviour: '`ODDLDAPProperties.password` (line 14) is plain `String` with Lombok `@Data`
  (line 10) generating `toString()` covering all fields including `password`. No `@ToString.Exclude`,
  no `@JsonIgnore`. Spring Boot 3.4.10''s `management.endpoint.env.show-values: NEVER`
  default sanitises `/actuator/env` (password → `******`) — the actuator path is partially
  protected. The DURABLE leak surface is `log.info("props = {}", properties)` or any
  custom serialiser. 4-sidecar triangulated.'
