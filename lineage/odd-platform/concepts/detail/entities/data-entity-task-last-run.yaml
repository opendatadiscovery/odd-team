name: data_entity_task_last_run (denormalised one-row-per-task latest-run table — load-bearing for DQ dashboard semantics)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-04
description: |-
  NEW ENTITY, batch ZG (2026-05-25, DataQualityRunsController class-level
  primary source). The denormalised "latest run per task" PostgreSQL
  table created at `V0_0_45__last_runs_table.sql:7-25`. Its `task_oddrn`
  column is a `PRIMARY KEY` — exactly ONE row per data-quality test or
  transformer.

  WHY THIS MATTERS: the table is load-bearing for the Data Quality
  Dashboard's semantic shape. The dashboard's `testResults` aggregate
  (the breakdown ring + the per-category cards) is a count of
  `data_entity_task_last_run` rows grouped by (category, status) —
  which means the dashboard counts TESTS BY THEIR LATEST-RUN STATUS,
  NOT TEST RUNS BY STATUS. A test that has run 100 times (99 SUCCESS,
  1 latest FAILED) contributes ONE row to the FAILED bucket — not
  99/1. This contradicts the live doc's verbatim definition
  ("count of test runs broken down by status") and is captured in the
  `dq-dashboard-test-results-counts-tests-not-runs` HIGH-severity
  invariant.

  THE BACK-FILL MIGRATION (V0_0_45__last_runs_table.sql:15-21):
    SELECT DISTINCT ON (tr.task_oddrn)
      tr.task_oddrn AS task_oddrn,
      tr.oddrn AS last_task_run_oddrn,
      tr.end_time AS end_time,
      tr.status AS status
    FROM data_entity_task_run tr
    ORDER BY tr.task_oddrn, tr.end_time DESC

  STEADY-STATE UPDATES: the ingestion path (TaskRunIngestionRequestProcessor)
  maintains the table via `ON CONFLICT (task_oddrn) DO UPDATE` whenever
  a new task_run row lands. The table is therefore an OUT-OF-BAND
  materialisation maintained by the ingestion pipeline — not a JOOQ
  view computed at query time.

  THE TRADE-OFF: the DESIGN choice is to PRE-COMPUTE "latest run per
  test" at write time (denormalisation) rather than running
  `DISTINCT ON (task_oddrn) ORDER BY end_time DESC` at every dashboard
  load. Captured as implicit_adrs[0] of the
  DataQualityRunsController sidecar.

  THREE LOAD-BEARING CONSUMERS:

    (1) DATA QUALITY DASHBOARD's testResults (per-category counts):
        ReactiveDataQualityRunsRepositoryImpl.java:76, 95 joins this
        table — counts tests, not runs.

    (2) DATA QUALITY DASHBOARD's tablesHealth (HEALTHY/WARNING/ERROR
        classification): the CTE algebra at lines 111-157 uses the
        denormalised table to ask "does this dataset have a last_run
        with status != SUCCESS / status in {BROKEN, FAILED} / etc."

    (3) DATASET SLA badge (F-022 PNG badge): the per-dataset SLA
        computation also reads this table to compute the per-dataset
        green/yellow/red rollup; same semantic — last-run-status,
        not run-history.

  Distinct from `data_entity_task_run` (the FULL run history table,
  many rows per task, read by per-entity run-history endpoint
  GET /api/dataentities/{id}/runs — the `per-entity-run-history-list`
  entity).
