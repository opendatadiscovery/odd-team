realism_caveats: |
  The probe pins three documented permission-vs-implementation drifts. If all
  three asserts PASS, the SecurityConstants wiring at lines 295-303 is
  authoritatively broken per the documented permission model. If arm2 PASSES
  (status 200) instead of FAILING (403), it means there is some additional
  permission resolution path that I missed (e.g. a fallback at the
  ReactiveResourcePermissionAuthorizationManager level that re-checks against
  the documented permission name) — re-read SecurityConstants.java and
  ReactiveResourcePermissionAuthorizationManager carefully.

  The probe does NOT verify the FOURTH question of Category D — the auth-mode
  matrix (DISABLED, LOGIN_FORM, OAUTH2, LDAP). The asserts assume LOGIN_FORM
  is active; a separate probe would iterate the auth.type configurations. The
  wiring bug is auth-mode-independent (it lives in SecurityConstants which is
  mode-invariant), so the bug-pinning asserts hold across all four modes.

  The probe inserts test fixtures (owners 9301, 9302, role/policy 9101, 9102,
  data entity 9401, etc.) in the 9000-range to minimise collision with
  existing seed data; cleanup is correspondingly id-scoped.

  The probe relies on probe-runner's local-only stack (Testcontainers + docker
  compose); per Rule 8 no remote infrastructure is invoked.
