evidence:
  - "AppInfoController.md says (security.known_security_gaps.[0]): 'Under the application.yml default auth.type=DISABLED (application.yml:34) the entire HTTP surface — including /api/appInfo, which echoes the deployment's auth mode AND project version — is .anyExchange().permitAll() (DisabledAuthSecurityConfiguration.java:13-18). Any caller able to reach the platform's HTTP port can read the response, enumerate the deployment, and use the project version to scope CVE matching. The live docs name the auth.type switch but do NOT document the introspection surface that /api/appInfo provides, nor warn about the fingerprinting risk under DISABLED. This is the 19th supporting sidecar for REFACTOR-185 (DISABLED-mode bypass) — the controller-class layer view of a surface batch B already cited at the config-key-consumer-axis layer.' severity: MEDIUM"
  - "AppInfoController.md says (security.known_security_gaps.[1]): '/api/appInfo is the simplest network-reachable fingerprint endpoint in the platform — no body, no auth, returns two strings. An attacker scanning a port range for ODD instances under DISABLED gets BOTH (a) confirmation it's ODD AND (b) the precise version + auth mode in a single GET. Compared with hitting /actuator/info (whitelisted) or / (returns SPA HTML), /api/appInfo is the highest-signal-density fingerprint.' severity: MEDIUM"
  - "AppInfoController.md says (bugs_limitations_corner_cases.[3]): 'Response body exposes projectVersion from BuildProperties alongside authType. Combined with unauthenticated reachability under auth.type=DISABLED, a network attacker can fingerprint (a) the deployment's auth mode AND (b) the precise platform version (scoping CVE matching). Neither piece of metadata is documented as a public-disclosure surface in the live docs.' severity: MEDIUM"
  - "Source: AppInfoController.java:14-28 + application.yml:32-34 + DisabledAuthSecurityConfiguration.java:13-18 + SecurityConstants.java:95-96 + SecurityConstants.java:98-355 (no rule for /api/appInfo) + components.yaml:2493-2499 + WebFetch enable-security 2026-05-20 status 200 (no /api/appInfo documentation)"
  - "Grep verification: `Grep AppInfoController|getAppInfo|api/appInfo` against odd-platform-api/src/test/ returned 0 files 2026-05-20"
