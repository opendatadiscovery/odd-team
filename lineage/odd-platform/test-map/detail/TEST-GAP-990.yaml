behaviour: |-
  **Two concurrent `POST /api/datasetfields/{id}/enum_values` against the same datasetFieldId produce silent last-write-wins — there is NO optimistic locking, NO advisory lock, NO version check.** The implementation runs each call in its own `@ReactiveTransactional` transaction at READ-COMMITTED isolation (`EnumValueServiceImpl.java:40`):

  Concurrent T1 + T2 timeline:
  1. T1 reads `getEnumState` (line 51) — pre-T1 state.
  2. T2 reads `getEnumState` — pre-T2 state (= pre-T1 + T1's not-yet-committed writes are invisible).
  3. T1 `softDeleteExcept(idsToKeep_T1)` — soft-deletes everything not in T1's request.
  4. T1 `bulkCreate(items_T1)` — creates T1's new items.
  5. T2 `softDeleteExcept(idsToKeep_T2)` — soft-deletes everything not in T2's request (INCLUDING T1's just-created items, since T2's read happened before T1's create was visible).
  6. T2 `bulkCreate(items_T2)` — creates T2's new items.
  7. T1 COMMITS. T2 COMMITS LAST. Final state = T2's items only. T1's writes are silently lost.

  **Operator-visible failure mode**:
  - One operator editing enum values via the UI form (well-behaved — sends the full current list).
  - One automated script (terraform-odd-provider, glossary-importer) editing the same field's enum values concurrently.
  - Result: whichever commits last wins; the other's edits are silently destroyed.
  - The activity feed emits TWO `DATASET_FIELD_VALUES_UPDATED` events; the operator inspecting the feed sees "values updated twice" with no indication that work was lost.

  **Why HIGH**:
  - **Silent data destruction (cross-amplifies TEST-GAP-989)**: even when both operators send "full" bodies, their states differ (different concurrent edits) — last-write-wins drops the other's edits.
  - **No optimistic-lock recovery path**: no HTTP 409 Conflict, no version field on enum_value, no Etag header on the field. The operator cannot retry-on-conflict because there IS no conflict signaled.
  - **Compound with bulk import patterns**: bulk-import scripts often parallelise across fields, but operator + script may collide on the SAME field. The race window is the SQL transaction window — small in absolute terms but realistic during sustained traffic.
  - **Probe P-154 pins this**: emit two concurrent POSTs via `Flux.parallel(2).flatMap(...)` and assert exactly ONE of the two states survives — the other is silently dropped.

  Distinct from TEST-GAP-989: that gap is about ONE caller submitting a partial body. THIS gap is about TWO callers submitting different bodies that destructively interleave.
