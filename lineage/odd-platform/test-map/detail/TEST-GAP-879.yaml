  - "ActivityController.md says (STRESS_A2): 'size=0: JOOQ emits LIMIT 0 → DB returns empty result set; controller returns 200 OK with empty Flux. STATIC-INFERRED HIGH. size=-1: JOOQ emits LIMIT -1; PostgreSQL rejects negative LIMIT. The error propagates as a Reactor onError to the controller; ControllerAdvice.handleServerException catches the generic exception and returns HTTP 500. Operator-visible: a -1 size yields a 500, not a 400. STATIC-INFERRED MEDIUM. size=Integer.MAX_VALUE: JOOQ emits LIMIT 2147483647; PostgreSQL accepts and plans a full-table scan against the activity table. STATIC-INFERRED HIGH.'"
