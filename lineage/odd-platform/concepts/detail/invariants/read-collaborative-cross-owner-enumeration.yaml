description: |-
  **STRENGTHENED INVARIANT, batch 2026-05-13G — 5-sidecar; ADR-CANDIDATE-003
  RESOLVED as DELIBERATE; batch 2026-05-19H — 8-sidecar with two repository-layer
  SQL primary-source confirmations; batch 2026-05-19I — 11-SIDECAR with FOUR
  service-layer service-tier confirmations; batch 2026-05-19J — 14-SIDECAR with
  THREE UI-LAYER REALISATION-POINT CONFIRMATIONS; batch 2026-05-19L —
  15-SIDECAR with a new PER-ENTITY ALERT-READ surface; batch 2026-05-19M —
  19-SIDECAR with the ANCHOR-SET-DEFENCE AUDIT family (DEG-lineage +
  /my/upstream + /my/downstream + facet-aggregator suite)** — Repository-wide
  read-side posture: GET / read-shaped endpoints fall through to
  pathMatchers('/**').authenticated() and return data across owners with no
  owner predicate.

  **NINETEEN corroborating surfaces** all share the same admin-path-without-
  admin-gate failure mode:
  (a) getAllAlerts; (b) getActivity; (c) search; (d)
  getDataEntityDownstreamLineage; (e) getDataEntityDetails (CENTERPIECE READ);
  (f) ReactiveAlertRepositoryImpl.listAllWithStatusOpen (REFACTOR-024 SQL);
  (g) ReactiveLineageRepositoryImpl.getLineageRelations (REFACTOR-203 SQL —
  graph-shaped enumeration sink); (h) ReactiveDataEntityRepositoryImpl
  (every list-shape method lacks principal/owner parameter);
  (i) DataEntityServiceImpl (10 of 22 public methods owner-unaware);
  (j) AlertServiceImpl (listAll + getTotals.total + getDataEntityAlerts
  BYPASSES); (k) LineageServiceImpl (NEGATIVE-CASE SIBLING — no anchor-set
  defence-in-depth); (l) DataEntityDetails React component (batch J — UI
  REALISATION POINT); (m) fetchDataEntityDetails redux-thunk (batch J — UI
  REALISATION POINT); (n) LineageGraph React component family (batch J — UI
  REALISATION POINT); (o) getDataEntityAlerts controller method (batch L —
  PER-ENTITY ALERT-READ SURFACE);
  **(p) getMyObjectsWithUpstream controller method (batch M — POSITIVE CASE
  WITH SINGLE-POINT-OF-FAILURE)** — the anchor-set IS applied at
  DataEntityRelationsServiceImpl.java:26 but the downstream listByOddrns has
  no JOIN-side defence-in-depth (REFACTOR-225); also the OpenAPI summary is
  the INVERSE of the actual semantic (DOC-GAP-099);
  **(q) getMyObjectsWithDownstream controller method (batch M — SYMMETRIC
  SIBLING)** — same posture as upstream; same REFACTOR-225 + DOC-GAP-099
  findings;
  **(r) getDataEntityGroupsLineage controller method (batch M — DEG-ANCHORED
  WIDEST-BLAST SURFACE)** — the WIDEST cross-owner enumeration blast because
  the DEG itself is a CONCEPTUAL grouping (a Domain or multi-team data
  product); leaking "team A and team B both contribute to the Finance Domain"
  exposes organisational structure; WRITE-side is RBAC-gated but READ-side
  has no SecurityRule entry and no fetchAssociatedOwner call;
  **(s) SearchController.facets (getSearchFacetList + getFiltersForFacet)
  controller method (batch M — CATALOG-CARDINALITY-DISCOVERY SURFACE)** —
  every facet count computed catalog-wide with no OWNERSHIP join; owner
  facet enumeration via getFiltersForFacet(OWNERS) reveals every owner name
  + per-owner entity count; pairs with REFACTOR-024 + REFACTOR-340 to form
  the catalog-wide cross-owner enumeration surface.

  **Live docs do not warn about this posture on any of the surfaces**. The
  pattern is the platform deliberate stance (ADR-CANDIDATE-003 —
  read-collaborative tradeoff: ODD catalog is intentionally cross-owner-
  readable to facilitate cross-team collaboration). Batches F/H/I confirmed
  the posture is uniform end-to-end (HTTP → service → SQL). Batch J confirms
  the posture is uniform UI → API → service → SQL — the UI provides no
  compensating defence, no permission-aware UI, no owner-scoping toggle.
  **Batch L** adds the per-entity Alert-read surface — applying the same
  posture to a documented audit-workaround endpoint. **Batch M** adds the
  ANCHOR-SET-DEFENCE AUDIT family — 4 sidecars confirming the posture even
  at endpoints designed to be owner-anchored (single-point-of-failure +
  inverse-semantic + DEG-anchored widest-blast + catalog-cardinality
  discovery).
