control_summary: |-
  0 of 4 cells COVERED — feature emerges from batch-K primary-source audit of
  NotificationsDispatcher (AlertNotificationMessageProcessor). The entire
  notification/ package — dispatcher + senders + translator + decoder + subscriber +
  leader-election interaction — has ZERO test coverage at the odd-platform-api
  level (verified via `find <odd-platform-repo> -name '*Test*.java' -path '*notification*'`
  returning zero matches). The two highest-leverage probe candidates are: (a) the
  RuntimeException-bypass asymmetry (drop a poisoned email into the chain + assert
  fan-out continues OR aborts at email — pins the exception-type contract); (b) the
  translation-failure poison-message replay loop (inject a WAL event with an unknown
  alert_type_id + assert the LSN replays with 10s back-off + subsequent messages
  stall — pins the WAL-acknowledgement contract). Local docker-compose probe
  stack is sufficient: ODD platform + Postgres with logical replication + a
  mock-Slack endpoint (WireMock) + a SMTP capture server (e.g. MailHog) + an
  injected ALERT row to drive the WAL stream.
