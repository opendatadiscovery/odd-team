name: |-
  SecurityConstants wiring failures grow 3 → 5 (alerts-status 295-296 primary-source + DATA_ENTITY_ADD_TERM mis-gate at /api/datasetfields/{id}/terms POST line 297-299)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
description: |-
  NEW HIGH-SEVERITY INVARIANT, batch 2026-05-20V — STRENGTHENS the existing
  3-failure SecurityConstants wiring story to 5 failures with TWO new
  primary-source confirmations from the DatasetFieldController class-level
  sidecar. Both failures live in SecurityConstants.java within 5 lines of
  each other (lines 295-299) — visible to anyone reading the dataset-field
  block, invisible to anyone scanning the file by string match alone.

  THE FAILURE INVENTORY — now 5 distinct wiring bugs:

    Failure 1 — REFACTOR-217 path-mismatch (batch K primary source):
      SecurityConstants.java:237-242 wires the singular '/term' path; the
      OpenAPI operation paths at openapi.yaml:973, 1042 use the plural
      '/terms'. The matchers never fire. DATA_ENTITY_ADD_TERM is silently
      unenforced for the dataentity-term-linkage endpoint. Anchor invariant:
      authorization-path-mismatch-security-rules-term-vs-openapi-terms-silently-disables-permission-gate.yaml

    Failure 2 — alerts-status DATASET_FIELD_ADD_TERM mis-gate (batch K
    initial finding + batch V primary-source confirmation):
      SecurityConstants.java:295-296 wires PUT /api/alerts/{alert_id}/status
      to DATASET_FIELD_ADD_TERM — a TERM permission applied to an ALERT
      path. The DatasetFieldController batch V sidecar surfaces this with
      primary-source citation reading the lines IN CONTEXT — the line
      immediately precedes the DatasetField-permission block, making the
      copy-paste origin visible. Existing invariant:
      second-securityconstants-bug-alerts-status-wrong-permission.yaml
      stands; batch V adds positional context (the bug is at the boundary
      between alert-related and dataset-field-related rules).

    Failure 3 — term-to-term linkage NO SecurityRule (batch U primary source):
      TermController.java:237-249 — addLinkedTermToTerm + deleteLinkedTermFromTerm
      have NO SecurityRule entry. Anchor invariant:
      securityconstants-term-to-term-no-security-rule-third-wiring-failure.yaml

    Failure 4 — NEW BATCH V: /api/datasetfields/{id}/terms POST mis-gated
    to DATA_ENTITY_ADD_TERM at SecurityConstants.java:297-299:
      The SecurityRule entry reads (paraphrased to avoid YAML scalar
      pitfalls): SecurityRule with DATASET_FIELD resolver + PathPattern
      '/api/datasetfields/{dataset_field_id}/terms' + POST verb + permission
      DATA_ENTITY_ADD_TERM. The intended permission per the live docs at
      https://docs.opendatadiscovery.org/configuration-and-deployment/enable-security/authorization/permissions
      (WebFetched 2026-05-20 status 200) is DATASET_FIELD_ADD_TERM (the
      doc-quoted definition: 'Allows linking a business glossary term to
      a specific field within a dataset'). The wiring is the WRONG permission
      from the same DATA_ENTITY/DATASET_FIELD scope family — same shape as
      Failure 2's copy-paste bug, same root cause (hand-curated static
      list, no compile-time consistency check).

      Two-way bypass effects:
        (a) A user holding DATA_ENTITY_ADD_TERM (intended for entity-level
            term-linking) effectively gets dataset-field term-linking too.
        (b) A user holding DATASET_FIELD_ADD_TERM (the documented permission)
            cannot link terms to dataset fields.
      Same surface as Failure 2 — both grant too much to one cohort and
      block too much from another cohort, both impact common Policies.

    Failure 5 — NEW BATCH V: alerts-status PRIMARY-SOURCE confirmation
    at SecurityConstants.java:295-296 (the SAME bug as Failure 2, now
    primary-source-cited in DatasetFieldController context):
      DatasetFieldController batch V — concepts.invariants[6] explicitly
      cites SecurityConstants.java:295-296 in the context of the
      dataset-field permission block. The bug was previously known (batch K)
      but batch V is the SECOND primary-source citation, raising confidence
      from MEDIUM to HIGH and confirming the position-in-file ordering: the
      alerts-status mis-gate sits BETWEEN the dataset-field block at
      lines 282-294 + 297-303 and the (now-discovered) /terms POST mis-gate.
      The two bugs are PROXIMATE in source — within 5 lines of each other —
      a single careless copy-paste that affected two SecurityRule entries
      simultaneously.

  THE 5-FAILURE COUNT and the BUG DENSITY:

    Five independent wiring failures in a single ~360-line authorization
    table. Two distinct failure classes:
      - PATH-MISMATCH class (Failure 1) — the URL pattern does not match
        the OpenAPI path; the matcher silently never fires.
      - WRONG-PERMISSION class (Failures 2, 4, 5 — three of five) — the
        URL pattern matches; the wrong permission key is wired; the gate
        fires but on the wrong identity.
      - MISSING-RULE class (Failure 3) — there is NO SecurityRule for the
        endpoint at all; the catch-all authenticated() rule is the sole
        gate.

    Three distinct failure classes is itself a finding — each requires a
    different remediation pattern. The COMMON ROOT CAUSE is the
    SecurityConstants.SECURITY_RULES static list at SecurityConstants.java:98 —
    a hand-curated SINGLE SOURCE OF TRUTH with NO compile-time,
    test-time, or startup-time integrity check. The pattern is unstable
    by design.

  THE BUILD-TIME REMEDIATION OBSERVATION:

    A startup-time invariant would close ALL FIVE failure classes simultaneously:

      Rule R1 — every OpenAPI operationId tagged as a 'write' verb (POST /
        PUT / DELETE) must match exactly one SecurityRule via path-pattern
        glob + verb. Catches Failure 1 (path mismatch) and Failure 3 (missing
        rule).

      Rule R2 — every SecurityRule's permission key must have a name-prefix
        matching the URL path's resource family (e.g. paths under /api/alerts
        gate only ALERT_* or DATA_ENTITY_ALERT_* permissions; paths under
        /api/datasetfields gate only DATASET_FIELD_* permissions; paths
        under /api/terms gate only TERM_* or DATA_ENTITY_*_TERM permissions;
        etc.). Catches Failures 2, 4, 5 (wrong permission).

      Rule R3 — every SecurityRule's path-pattern must match exactly one
        OpenAPI operation path (no orphan rules; no dead path patterns).
        Catches future drift between the spec and the wiring.

    The three rules together turn the hand-curated list into a guarded
    canonical source. A few hundred lines of Java + a build-time test
    pass is the entire remediation scope. The cost-benefit ratio is highly
    asymmetric: low remediation cost + persistent prevention of an entire
    failure class.

  SEVERITY: HIGH — both new failures (4 + 5) are HIGH-severity in isolation.
  The PATTERN of repeated independent failures in the same file raises the
  meta-severity: a sixth or seventh failure probably awaits discovery; the
  hand-curated list IS NOT a stable canonical authority for authorization.
