proposed_action: |-
  Testcontainers concurrency test. (a) Two parallel Monos: roleRepository.create(name="FreshRole") AND roleRepository.create(name="FreshRole"). (b) Use Mono.zip with .onErrorResume to capture both outcomes. (c) Assert: exactly ONE succeeds with a persisted RolePojo; the OTHER fails with UniqueConstraintException via ExceptionUtils. (d) Verify only ONE row exists in `role` with that name.
