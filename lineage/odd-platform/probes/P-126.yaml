realism_caveats: |
  This probe verifies:
  (a) the unknown-id 204 hypothesis (the load-bearing claim);
  (b) the installed=false constant (the dead-field claim);
  (c) the platform_url default-placeholder substitution (the operator-confusion vector);
  (d) the case-insensitive lookup (the registry comparator behaviour).

  This probe does NOT verify:
  (a) DISABLED-mode anonymous reachability vs LOGIN_FORM/OAUTH2/LDAP authentication
      requirements — a separate auth-mode-matrix probe is needed for the open-read
      posture (under DISABLED the probe runs as anonymous; under the other three modes
      a separate authenticated client + a no-INTEGRATION_*-permission user would
      assert open-read is honoured);
  (b) the case-collision merge behaviour (`Snowflake` + `snowflake` in two
      separate overlay jars) — would require a multi-overlay test rig with
      jar-order control;
  (c) the boot-time fail-fast on malformed YAML — would require a malformed
      manifest fixture and a boot-failure capture;
  (d) the `installed: false` UI-side rendering consequences (no 'Integrated' badge
      shown for any integration) — would require a Playwright probe against the
      rendered Integration page;
  (e) the operator-side `odd.platform-base-url` override case — a follow-up
      probe with the property explicitly set would confirm the substitution
      flows the configured value through end-to-end (including the
      DISABLED-mode anonymous leak of an internal hostname).

  If assertion `unknown_status == 204` FAILS with `404`, the static trace was
  wrong: an upstream layer (Spring's default 404-on-Mono.empty handler? or a
  ResponseStatusException-throwing global handler not visible in the controller
  code) is converting Mono.empty to 404. If FAILS with `200`-with-empty-body,
  Spring is honoring the .map(ResponseEntity::ok) but returning empty payload —
  another distinct possibility worth pinning.

  If assertion `known_uppercase_status == 200` FAILS, the TreeMap's
  case-insensitive comparator is NOT being honoured at lookup time (would
  imply a bug in how the comparator is applied to `Map.get`).

  If assertion `known_body.contentBlocks[0].codeSnippets[0].arguments[0].staticValue
  == 'http://your.odd.platform'` FAILS, either (a) the platform_url substitution
  is broken end-to-end (regression in IntegrationMapper or
  StaticArgumentMappingContext), or (b) `odd.platform-base-url` has been
  set in the test environment (probe-rig bug — the arrange step must keep the
  property unset).

  If `installed == false` ever returns `true` for any integration, the dead-field
  claim is wrong and a (presumably recent) feature commit has added installed-state
  detection; the sidecar's invariant needs updating.
