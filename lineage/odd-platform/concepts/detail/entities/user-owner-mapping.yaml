      Hot path 2 — getUserRolesByOwner — invoked transitively from
        PolicyServiceImpl.getCurrentUserPolicies on EVERY authorized
        HTTP request via the RBAC permission framework. 4-way JOIN
        with jsonArrayAgg over policy column. This is the SINGLE
        MOST-FREQUENT query against user_owner_mapping.
    (ReactiveUserOwnerMappingRepositoryImpl.md:performance.hot_paths.[0,1])
  weaknesses:
  - Per-request DB round-trip for principal lookup — short-lived session cache would
    eliminate this for high-RPS callers
  - |-
    **STRENGTHENED batch K**: the per-request DB round-trip is multiplicative
    across 15 callsites; a single page-load (catalog home rendering
    Recommended + My Objects + My Alerts) triggers 3-5 sequential
    identical queries.
    (AuthIdentityProviderImpl.md:performance.hot_paths.[0])
  - |-
    **STRENGTHENED batch N** — the RBAC permission framework's
    `policyService.getCurrentUserPolicies()` invokes getUserRolesByOwner
    on EVERY authorized HTTP request. No caching at repository, service,
    or extractor level. For a busy platform with N authorized req/s,
    this is N+M DB calls (N for permission resolution, M ≪ N for
    mutations). A short-TTL request-scoped or user-scoped cache would
    significantly reduce DB load.
    (ReactiveUserOwnerMappingRepositoryImpl.md:performance.known_performance_gaps.[0])
  - |-
    **NEW LOW batch N — Soft-delete-only table growth.** Without
    operator-driven pruning, the user_owner_mapping table grows
    monotonically with every binding change. A platform with 1000 users
    churning mappings monthly accumulates ~12,000 rows annually — small
    enough that the partial unique indexes' WHERE-clause coverage keeps
    query times bounded, but the operator may not know they can
    `DELETE FROM user_owner_mapping WHERE deleted_at IS NOT NULL`
    safely.
    (ReactiveUserOwnerMappingRepositoryImpl.md:performance.known_performance_gaps.[1])
notes: |-
