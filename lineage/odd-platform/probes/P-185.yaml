  retrospectives: []
realism_caveats: |
  The probe uses OpenLDAP as the directory backend (real Active Directory
  is not necessary to exercise Spring Security's ActiveDirectoryLdapAuthenticationProvider).
  Spring's AD provider speaks the same LDAP protocol; the only difference
  is the bind-shape decision (UPN `<user>@<domain>` vs the OpenLDAP-style
  `uid=<user>,ou=people,...`).

  The PRIMARY hypothesis (validate() does NOT catch missing domain) is the
  load-bearing one. If `platform_booted == True` AND `validate_did_not_throw
  == True`, the sidecar's bugs_limitations_corner_cases[AD.domain unvalidated]
  finding is runtime-confirmed.

  The TERTIARY observation (first-login outcome) is less deterministic.
  Spring Security's ActiveDirectoryLdapAuthenticationProvider with a null
  domain has version-dependent behaviour:
    - Spring Security 6.x (used here per Spring Boot 3.4.10): the provider
      constructs a search filter using
      `(&(objectClass=user)(userPrincipalName={0}@<domain>))` — with
      domain=null, the filter becomes `...userPrincipalName={0}@null...`
      which fails to match against the OpenLDAP `inetOrgPerson` (no
      userPrincipalName attribute).
    - Effect: 401 at login with a generic "Bad credentials" message and no
      log line naming the root cause as "missing AD domain".

  What the probe DOES confirm regardless of the tertiary outcome:
    (1) Boot succeeds — the unvalidated-pair finding is real.
    (2) No diagnostic message names the missing domain — silent degradation.
    (3) The user-visible failure is generic — operator must read code or
        bounce config many times to find the cause.

  What this probe does NOT verify:
    - Whether against an ACTUAL Active Directory (Windows Domain Controller),
      the null-domain provider succeeds, fails, or returns a different error
      shape. Setting up a real AD on Testcontainers is impractical for OSS;
      OpenLDAP is the local-only proxy.
    - Whether the ActiveDirectoryLdapAuthenticationProvider's contract
      semantics change in a future Spring Security upgrade (the platform's
      pinned version is documented; future probes would re-pin against the
      new version).
    - Whether `domain=""` (empty string) behaves differently from
      `domain=null` — both should be tested; a follow-up probe could
      parametrise.
