feature_id: F-059
pillar_id: P-03
pillar_anchored_id: P-03:F-003
pillar_anchored_feature_name: Lookup Table Rename Cascade
feature_name: |-
  Lookup table rename — operator metadata edit silently renames the underlying
  Postgres table, breaking every downstream pipeline that joined against the
  documented public surface (lookup_tables_schema)
seeded_from: SHB-047
seeded_at: 2026-05-26
discovered_from_entry_point: |-
  rest:PUT /api/referencedata/table/{lookup_table_id} — the metadata
  rename endpoint. Beyond updating the catalog metadata, executes
  `ALTER TABLE lookup_tables_schema.n_{nsId}__{old_underscored_name}
  RENAME TO lookup_tables_schema.n_{nsId}__{new_underscored_name}` as a
  side effect.
primary_subject:
