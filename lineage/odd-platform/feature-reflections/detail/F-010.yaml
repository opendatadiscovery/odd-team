- id: H-011
  hypothesis: >-
    When a deployment uses PostgreSQL-backed sessions and runs multiple replicas,
    the expired-session cleanup (like the rest of housekeeping) runs on exactly one
    instance.
  derivation: >-
    The session-expiry purge is housekeeping-shaped (a scheduled DELETE of stale
    rows); an operator who learned the housekeeping subsystem is ShedLock-guarded
    reasonably extends that expectation to the session cleanup.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      `PostgreSQLSessionHousekeepingJobHandler.java:13` is
      `@Scheduled(fixedRate=1, timeUnit=HOURS)` with NO `@SchedulerLock`, NO
      advisory-lock, NO `@ConditionalOnProperty` leader-election guard — the SOLE
      `@Scheduled` job in the codebase without leader election (inconsistent with
      the 5 HousekeepingJobManager jobs, NotificationSubscriber, the two
      DataCollaboration jobs, ActivityTablePartitionManager). On an N-replica
      `INTERNAL_POSTGRESQL` deployment, every replica runs
      `DELETE FROM SPRING_SESSION WHERE expiry_time < now()` hourly — N× redundant
      DB load. (`@EnableSchedulerLock(defaultLockAtMostFor="1h")` does NOT cover it:
      the default applies only to `@SchedulerLock`-annotated methods that omit
      their own timing, not to bare `@Scheduled`.) The live doc now documents this
      gap verbatim (2026-06-01).
    evidence:
      - sidecar: F-010 feature-flow batch-X notes (SessionConfiguration enrichment)
        section: "drift facet postgresql_session_housekeeping_job_no_scheduler_lock_..."
        cite: "PostgreSQLSessionHousekeepingJobHandler.java:13"
        note: "no @SchedulerLock; N× hourly DB load on multi-replica"
      - sidecar: F-010 feature-flow batch-ZK notes (SchedulingConfiguration enrichment)
        section: "drift facet (6) cross-sidecar confirmation"
        cite: "SchedulingConfiguration.java:14 (defaultLockAtMostFor does not cover bare @Scheduled)"
        note: "the @EnableSchedulerLock mental model is refuted at the config tier"
    operator_visible_failure: |
      (1) On a multi-replica INTERNAL_POSTGRESQL deployment, N× redundant hourly
      DELETE load on SPRING_SESSION — wasted DB IOPS, not a correctness bug
      (deletes are idempotent). (2) Incident-response surprise: an operator reading
      `application.yml`'s four `*.advisory-lock-id` keys cannot trace the extra
      SPRING_SESSION load back to a leaderless job. Severity MEDIUM (cost +
      inconsistency, not data loss).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-012
  hypothesis: >-
    When an operator deploys with default session settings, expired sessions are
    cleaned up by the session-housekeeping job (bounded SPRING_SESSION growth).
  derivation: >-
    The session-housekeeping job's WHERE clause is `expiry_time < now()`; the
    operator expects it to bound the session table.
  seed_source: cross-pillar
  validation:
    verdict: contradicted
    actual_behavior: |
      The shipped default is `spring.session.timeout: -1` (never-expire). Under
      `-1`, sessions are written with an `expiry_time` that never falls before
      `now()`, so the session-housekeeping predicate `expiry_time < now()` never
      matches — the job is a NO-OP and SPRING_SESSION grows monotonically with the
      high-water-mark of authenticated users. The live doc now states both the
      `-1` default and that it means "sessions never expire" (2026-06-01).
    evidence:
      - sidecar: F-010 feature-flow batch-X notes
        section: "drift facet postgresql_session_housekeeping_job_no_op_under_default_spring_session_timeout_minus_one_..."
        cite: "application.yml:2-3 (spring.session.timeout: -1) + PostgreSQLSessionHousekeepingJob.java:30"
        note: "WHERE expiry_time < now() never matches under -1; session table grows"
    operator_visible_failure: |
      (1) On an INTERNAL_POSTGRESQL deployment left at the default, SPRING_SESSION
      grows without bound — another monotonic-growth surface under default config,
      sibling to H-006. (2) The session-housekeeping job exists but does nothing
      until the operator sets a finite timeout — and only THEN does H-011's N×
      load surface. Severity MEDIUM (default-config silent growth; the live doc now
      warns, so the doc-side is covered).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

- id: H-013
  hypothesis: >-
    When an operator misconfigures a TTL to a destructive value (e.g.
    `data_entity_delete_days=1` or `0`), the platform protects them — a preview,
    a dry-run, a validation rejection, or an archive-before-delete.
  derivation: >-
    Any operator of a system that permanently deletes data expects a guard rail
    against a fat-fingered retention value; this is an implicit safety requirement
    for a destructive subsystem.
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      There is NO guard rail. `HousekeepingTTLProperties` has NO `@Validated`, NO
      `@Min(1)`/`@Max`, NO `@DefaultValue`, NO `@PostConstruct validate()` (contrast
      the sibling ODDLDAPProperties which DOES carry a `@PostConstruct validate()`).
      There is no `housekeeping.dry-run=true` mode, no `archive-table`, no
      operator-overrideable gate, and no in-cycle abort. A misconfigured
      `data_entity_delete_days=1` (or `0`, or a negative producing a future cutoff)
      silently binds and the next 15-minute cycle hard-deletes / cascades with no
      recovery path. Once a cycle starts, the only "abort" is killing the JVM
      mid-cycle to force a rollback.
    evidence:
      - sidecar: F-010 feature-flow batch-ZK notes (2)
        section: "drift facet housekeeping_ttl_no_validated_no_min_no_max_no_postconstruct_validate_no_fail_fast"
        cite: "HousekeepingTTLProperties.java:1-12 (no @Validated/@Min/@PostConstruct)"
        note: "no fail-fast at boot on a destructive misconfiguration; sibling class has validate()"
      - sidecar: odd-platform__java__service__service__HousekeepingJobManager.md
        section: bugs_limitations_corner_cases[5] + security.known_security_gaps[1]
        cite: "HousekeepingJobManager.java:25-39 (no dry-run/preview/kill-switch)"
        note: "destructive cycle fires unconditionally; ~15 min from misconfig to cascade"
    operator_visible_failure: |
      (1) A typo in a retention value (or an intentional `0` for a one-off test
      left in place) destroys data on the next cycle with no boot rejection and no
      preview — the LSN-001 shape (silent default + immediate destructive action +
      no preview). (2) An operator who notices the bad value in real time has ~15
      minutes and no in-cycle abort short of a JVM restart. Severity MEDIUM (the
      validator gap is the proposed fix-option-B of PLT-083, so this folds into
      that hardening item).
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: bug-candidate

