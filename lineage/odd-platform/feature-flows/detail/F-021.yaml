observed_vs_expected:
  facets:
  - facet: audit data-entity-scoped — schema root cause
    observed: |-
      `activity.data_entity_id` is NOT NULL with FK to `data_entity(id)`
      (V0_0_48__add_activity.sql:4,12). The audit table CANNOT
      physically store an event that lacks a data-entity reference.
      RBAC mutations (Role/Policy/Owner CRUD), Datasource registration,
      Collector token rotation, integration-wizard changes — NONE
      can emit to this table even if a future @ActivityLog were
      added. Implicit ADR: the activity table is the 'data-entity
      audit log', not the 'platform audit log'.
    expected: |-
      A maintainer reading the live activity-feed doc ('records
      changes to data entities') would reasonably interpret this as
      the audit-of-record for the platform. Operators auditing
      'who created admin role X' / 'who deleted owner Y' / 'who
      registered datasource Z' find no audit surface in the activity
      feed; raw application logs (which may not exist in production,
      may not be retained) are the only fallback.
    drift_class: audit_data_entity_scoped_schema_root_cause
    provenance: |-
      PRIMARY-SOURCE — ReactiveActivityRepositoryImpl batch R
      implicit_adrs[0] + V0_0_48__add_activity.sql:4,12 + repository
      line 219 (INNER JOIN to DATA_ENTITY in every read path).
      Severity: HIGH (forensic-coverage class). Cross-link to F-006
      `audit_silence_schema_rooted_activity_data_entity_fk_not_null`
      drift facet (batch R extension on F-006).
  - facet: activity table monotonic growth — no DELETE path, no non-empty-partition DROP
    observed: |-
      The activity table grows monotonically. Grep verified zero
      `deleteFrom(ACTIVITY)` matches across the repository.
      ActivityEmptyPartitionsHousekeepingJob drops EMPTY past
      partitions only — once a partition has any activity row it
      persists forever. A high-volume deployment (1M events/day)
      accumulates ~365GB+/year of audit data with no recovery path
      short of manual `DROP TABLE activity_YYYYMMDD_YYYYMMDD`. The
      live doc's framing 'Activity-feed retention and partitioning
      are controlled by the platform-level setting
      `odd.activity.partition-period`' is misleading — operators
      reasonably assume rows age out.
    expected: |-
      Either (a) row-level DELETE pathway driven by a
      `housekeeping.ttl.activity_days` TTL config (parallel to
      `resolved_alerts_days` and `search_facets_days`), OR (b)
      explicit doc text stating 'activity table grows monotonically;
      no DELETE path; operators must manually drop non-empty
      partitions to reclaim space'.
    drift_class: activity_table_monotonic_growth_no_delete_path
    provenance: |-
      PRIMARY-SOURCE — repository file 1-310 + grep verified zero
      `deleteFrom(ACTIVITY)` matches + ActivityEmptyPartitionsHousekeepingJob.java:9-17.
      Severity: HIGH (silent-data-growth class). Cross-link to
      F-010 batch-R extension.
  - facet: read default cross-owner; MY_OBJECTS axis-mismatch
    observed: |-
      `findAllActivities`, `findDependentActivities`,
      `findDataEntityActivities` carry NO current-user predicate
      at the SQL layer. The default Activity Feed view is cross-owner
      — every authenticated user sees every data entity's activity.
      `findMyActivities` is owner-scoped along the OBJECT axis
      (`OWNERSHIP.OWNER_ID.in(currentOwnerIds)` line 270) — meaning
      'changes to entities I own', NOT 'changes I performed'. A
      user with no ownership attachments who has made platform
      changes sees their own changes ONLY by passing themselves
      explicitly via `userIds`, not via the `MY_OBJECTS` type
      parameter.
    expected: |-
      Either documented as 'My view shows changes to entities you
      own, not changes you performed; use the User filter to find
      your own actions' — OR `MY_OBJECTS` redesigned to query along
      the actor axis via USER_OWNER_MAPPING.OWNER_ID.
    drift_class: read_default_cross_owner_my_objects_axis_mismatch
    provenance: |-
      PRIMARY-SOURCE — repository lines 73-89 + 91-107 + 264-275
      + ActivityServiceImpl.java:184-199. Severity: MEDIUM
      (semantics gap — confused operators under-detect their own
      past changes). Cross-link to read-collaborative posture
      concept (`read-collaborative-posture-every-authenticated-user-enumerates-the-catalog`).
  - facet: provider-agnostic actor resolution — cross-mode bleed read surface
    observed: |-
      All four read paths LEFT JOIN USER_OWNER_MAPPING by OIDC_USERNAME
      only — provider-AGNOSTIC. Lines 157-158, 178-179, 199-200,
      221-222 — the JOIN ON predicate explicitly names OIDC_USERNAME
      and DELETED_AT; PROVIDER is NEVER referenced. A LOGIN_FORM
      'alice' activity row and an LDAP 'alice' activity row resolve
      to the SAME OwnerPojo in the UI — even if they are different
      people. Forensic incident response over an audit feed is
      misled.
    expected: |-
      Either (a) the LEFT JOIN adds `AND USER_OWNER_MAPPING.PROVIDER =
      :activityProvider` predicate (which would require ALSO recording
      the provider on activity row writes — a schema migration), OR
      (b) doc-side warning naming the cross-mode bleed for multi-mode
      deployments.
    drift_class: provider_agnostic_actor_resolution_cross_mode_bleed
    provenance: |-
      PRIMARY-SOURCE — repository lines 157-158/178-179/199-200/221-222
      (four PROVIDER-omitted joins) + ActivityServiceImpl.java:47-49
      (the username-only write path) + V0_0_48__add_activity.sql:10
      (no provider column on schema). Severity: HIGH
      (forensic-integrity class). Cross-link to F-011 batch-R extension
      and the cross-batch concept `provider-null-cross-mode-bleed`.
  - facet: anonymous-mutation attribution gap — DISABLED mode null created_by
    observed: |-
      `activity.created_by` is varchar(512) NULLABLE
      (V0_0_48__add_activity.sql:10). Anonymous mutations under
      `auth.type=DISABLED` write `created_by=null`
      (ActivityServiceImpl.java:47-49). The null-created_by rows
      orphan on the USER_OWNER_MAPPING LEFT JOIN and surface in
      the UI with OwnerPojo=null — visually INDISTINGUISHABLE from
      'system' events. A reviewer cannot determine whether a
      null-created_by row is an unattributed user action or a
      missed-username on a real user. Under DISABLED-mode, the
      anonymous mutations LOOK like system events.
    expected: |-
      Either (a) DISABLED-mode anonymous mutations write a
      `'<anonymous>'` literal into `created_by` (so the
      `created_by=null` slot is reserved for genuine system events),
      OR (b) the UI surfaces a separate '<anonymous>' visual
      distinguisher.
    drift_class: anonymous_mutation_attribution_gap_disabled_mode_null_created_by
    provenance: |-
      PRIMARY-SOURCE — ActivityServiceImpl.java:47-49 (null-username
      fallback) + V0_0_48__add_activity.sql:8 (is_system_event NOT
      NULL) + DisabledAuthSecurityConfiguration.java:16 (anonymous
      permitted). Severity: MEDIUM (auth-mode-cost class).
      Cross-link to F-011 batch-R extension and DisabledAuth
      caveat concept.
  - facet: cursor pagination truncate-to-second tolerance may skip rows
    observed: |-
      Cursor predicate `row(trunc(ACTIVITY.CREATED_AT, DatePart.SECOND),
      ACTIVITY.ID).lessThan(truncated, lastEventId)` (line 287-288)
      uses a truncated-to-SECOND comparator on the LEFT side and
      full-precision on the RIGHT side; ORDER BY uses full-precision
      `created_at DESC, id DESC` (line 291). Under sustained
      high-write rate (1k+ events/sec), multiple rows share the
      same SECOND-truncation bucket — the cursor-less-than predicate
      may skip rows that arrived in the same second as the cursor
      anchor due to mismatched comparator/sort precision.
    expected: |-
      Either (a) ORDER BY also truncates to SECOND, OR (b) cursor
      predicate uses full-precision, OR (c) explicit doc text on
      audit-stream pagination semantics under load.
    drift_class: cursor_pagination_truncate_to_second_skip_under_high_write_rate
    provenance: |-
      PRIMARY-SOURCE — repository line 285-288 + 290-291. Severity:
      MEDIUM (forensic-integrity-under-load class). Implicit ADR
      (per the sidecar's implicit_adrs[1]): the asymmetry is
      intentional — accommodates client clock-skew on cursor pass-back
      — but the audit-stream semantic implication is undocumented.
  - facet: batch save partial-commit under partition rotation
    observed: |-
      `save(List<ActivityPojo>)` dispatches to executeInPartition
      (line 62-70) which chunks at BATCH_SIZE=1000 and reduces via
      `.zipWith(Integer::sum)`. NO transaction wrap. A failed
      mid-batch chunk leaves prior chunks committed and surfaces
      the error to the caller — the audit trail has 'holes' an
      attacker triggering ingestion-side errors could exploit to
      hide individual events. AlertServiceImpl's batch flows (line
      252-258, 318-324) are the most exposed at midnight rotation
      boundaries.
    expected: |-
      Either (a) `@ReactiveTransactional` wrap around the
      executeInPartition reduce, OR (b) compensating-delete-on-error
      mechanism, OR (c) explicit operator-facing log line on
      partial-commit.
    drift_class: batch_save_partial_commit_under_partition_rotation
    provenance: |-
      PRIMARY-SOURCE — repository line 62-70 + JooqReactiveOperations.java:51-67
      + AlertServiceImpl.java:252-258, 318-324. Severity: MEDIUM
      (forensic-completeness class). Cross-link to F-007 batch-R
      extension.
  - facet: INNER JOIN to DATA_ENTITY — hard-delete history erasure
    observed: |-
      Every read path INNER JOINs DATA_ENTITY at line 219. A
      data_entity HARD-delete (via F-010 DataEntityHousekeepingJob
      cascade) cascades through the FK and removes the activity
      rows — the historical record of WHO created / edited those
      entities disappears. Soft-delete preserves the rows (the
      INNER JOIN still matches); hard-delete erases them. Operators
      cleaning up old data entities also clean up the audit trail
      explaining who created them.
    expected: |-
      Either (a) LEFT JOIN with NULL-handling for the data_entity
      side (rows survive hard-delete of parent), OR (b)
      audit-history-pre-erase warning in the housekeeping job docs,
      OR (c) hard-delete-blocked-while-activity-exists semantic.
    drift_class: inner_join_to_data_entity_hardelete_history_erasure
    provenance: |-
      PRIMARY-SOURCE — repository line 219 + F-010 sidecar
      DataEntityHousekeepingJob. Severity: MEDIUM
      (forensic-history-erasure class).
  - facet: no DISTINCT — multi-facet filter produces duplicate rows
    observed: |-
      `buildBaseQuery` (line 208-225) issues plain
      `DSL.select(selectFields).from(ACTIVITY).join(DATA_ENTITY)...`
      with conditional LEFT JOINs to TAG_TO_DATA_ENTITY and OWNERSHIP
      when those filter facets are present (line 237-242). A data
      entity with 3 tags + 2 owners produces 6 rows from join
      cardinality alone; SELECT returns all 6 (activity columns
      identical, join columns differing). NO DISTINCT applied at
      finalize (line 290-292). A `size=100` request with multi-tag
      filter may return only 30-40 distinct activity events with
      60-70 duplicates.
    expected: |-
      Either DISTINCT on (activity.*) projection, OR
      pre-aggregated subquery for the joined facet predicates.
    drift_class: no_distinct_multi_facet_filter_duplicates
    provenance: |-
      PRIMARY-SOURCE — repository line 208-225 + 237-242 + 290-292.
      Severity: MEDIUM (results-correctness class).
  - facet: doc drift — 27 enum values in code, 20 documented
    observed: |-
      `ActivityEventTypeDto.java:3-31` declares 27 values; the live
      activity-feed page enumerates 20 in 6 groups. Seven undocumented:
      DATA_ENTITY_OVERVIEW_UPDATED, DATA_ENTITY_METADATA_UPDATED,
      DATA_ENTITY_SCHEMA_UPDATED, DATA_ENTITY_RELATION_UPDATED,
      CUSTOM_METADATA_CREATED, CUSTOM_METADATA_UPDATED,
      CUSTOM_METADATA_DELETED. Each can be emitted by ingestion or
      metadata-handler code; operators see event_type values the
      docs don't enumerate.
    expected: |-
      Live doc enumerates ALL 27 event types in the relevant groups
      OR explicit doc text 'this list is non-exhaustive; see the
      `ActivityEventTypeDto` enum in code for the full set'.
    drift_class: doc_drift_27_enum_values_in_code_vs_20_in_live_docs
    provenance: |-
      PRIMARY-SOURCE — ActivityEventTypeDto.java:3-31 + WebFetch
      activity-feed Event Types section (20 values enumerated).
      Severity: MEDIUM (doc-class). Filed as DOC-GAP-NNN candidate
      (deferred to doc-gap-finder). Cross-link to F-007 batch-R
      same finding.
  - facet: doc silence — cross-owner default read
    observed: |-
      Live doc enumerates 7 filter facets but does NOT state that
      the default view is cross-owner (every authenticated user
      sees activity for every data entity, regardless of ownership
      association). The User filter is framed for 'auditing a
      specific person's platform activity' — implicitly acknowledging
      cross-owner reads but not stating it.
    expected: |-
      Doc text 'the Activity Feed default view is cross-owner —
      every authenticated user sees the platform-wide audit. Use
      the My-objects view to scope to entities you own.'
    drift_class: doc_silence_on_cross_owner_default_read
    provenance: |-
      PRIMARY-SOURCE — repository lines 73-89 (no current-user
