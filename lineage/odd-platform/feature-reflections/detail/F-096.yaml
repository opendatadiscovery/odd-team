    verdict: contradicted
    actual_behavior: |-
      `persistDataEntities` builds the per-call entity map with
      `Collectors.toMap(DataEntityIngestionDto::getOddrn, identity())` (IngestionServiceImpl.java:86)
      using the DEFAULT throwing merger. Two items sharing one ODDRN throw
      `IllegalStateException: Duplicate key`. There is NO `@ExceptionHandler` on the ingestion
      controller for it (controller sidecar uncovered_behaviours: no advice maps it), so the
      default reactive error handler returns HTTP 5xx. The author receives a 500 — the exact
      signal that means "retry me" — for an error that will crash identically on every retry.
    evidence:
      - sidecar: odd-platform__java__service__service__IngestionServiceImpl.md
        section: concepts.invariants[2] + bugs_limitations_corner_cases[0]
        cite: "IngestionServiceImpl.java:83-86"
        note: "Two-arg Collectors.toMap → default throwing merger → IllegalStateException."
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataEntityList.md
        section: tests_coverage_semantic.uncovered_behaviours[5] + bugs_limitations_corner_cases
        cite: "IngestionController.java:38-45"
        note: "No @ExceptionHandler(IllegalStateException) on the path → 500, not 400."
    operator_visible_failure: |-
      (1) A collector with a glitched source-iteration that emits a duplicate ODDRN once per
      tick crashes the ENTIRE tick's ingestion — not just the duplicate — losing every other
      entity in that batch (compounds with H-001's all-or-nothing rollback). (2) The author's
      retry-with-backoff (the documented response to 5xx) fires against an error that NEVER
      succeeds on retry, so a one-line collector bug becomes a self-inflicted retry storm that
      pegs the platform for the whole retry budget. (3) The author cannot tell "I sent
      duplicates" from "the platform crashed" without platform-side log access (which is empty,
