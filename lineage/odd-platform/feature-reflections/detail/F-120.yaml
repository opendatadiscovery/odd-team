# R2DBC Connection-Pool Sizing — product-owner reflection

## product_owner_narrative

R2DBC Connection-Pool Sizing is not a screen — it is an **operator-infrastructure surface**: the set of `spring.r2dbc.pool.*` configuration keys (ten of them) that an operator deploying ODD Platform would expect to set in `application.yml`, an environment variable, or a Helm value to control how many concurrent PostgreSQL queries each platform replica can run before requests start queueing. The "user" of this feature is the **platform-operator** and, behind them, the **DBA** sizing the PostgreSQL backend — the two audiences the contributing sidecar names explicitly (per `R2DBCConfiguration` sidecar `concepts.audiences`). The capability the feature *name* promises — "operator-tunable concurrency ceiling" — sits squarely inside Pillar P-08's one-line mission: "everything an operator configures inside the running platform" (per `system-mission.md` P-08). (Naming note: the feature-flow detail carries a malformed `pillar_anchored_id: P-08:F-014` — `F-014` is already the anchor for a P-07 alert-read reflection per `feature-reflections/index.yaml`; this reflection uses the clean `P-08:F-120`.)

An operator interacts with this feature the way they interact with any Spring Boot config knob: they read the deployment docs, find the key, set a value, restart the JVM, and the new ceiling takes effect at boot (the `ConnectionPool` bean is built once at context init — a runtime change requires a restart, per sidecar `requires-config`). What they observe is *indirect*: there is no in-app gauge, so an operator confirms the pool is correctly sized by watching request latency, PostgreSQL's `pg_stat_activity` connection count, or `/actuator/prometheus` — except, as this reflection establishes, `/actuator/prometheus` exposes no pool gauge at all (per sidecar `performance.known_performance_gaps[1]`). The operator's only screen for this feature is therefore the config file going in and PostgreSQL's own server-side connection count coming out.

The working parts an operator would want to reason about: (1) **how many connections per replica** — governed by `spring.r2dbc.pool.max-size`, which ships UNSET, so the ceiling is Spring Boot's framework default of 10 (per sidecar invariant on lines 71); (2) **how many pools** — the platform wires TWO `io.r2dbc.pool.ConnectionPool` beans (a `@Primary` one and a `customConnectionPool` for the Lookup-Tables schema), and the second is instantiated UNCONDITIONALLY with no `@ConditionalOnProperty` gate (per sidecar `bugs_limitations_corner_cases[2]`), so EVERY deployment pays for both — 2 x 10 = 20 connection slots per replica whether or not Lookup Tables are ever used; (3) **the timeouts** — `maxAcquireTime`, `maxCreateConnectionTime` and seven other parameters, all at framework default, all wired through `PropertyMapper.alwaysApplyingWhenNonNull()` (sidecar lines 64); (4) **what happens at saturation** — request 21 to a single replica is queued by Reactor's `Mono` backpressure (a latency spike with no error and no gauge), per the feature-flow `terminal_side_effect`.

This feature does not stand alone — its integration story is the load-bearing finding. The **authorization hot path** (Pillar P-09: every authenticated HTTP request resolves `getCurrentUserRoles -> getCurrentUserPolicies`, which is two uncached DB JOINs per request, per concept invariant `authorization-hot-path-getcurrentuserroles-per-request-no-cache` lines 40-47) runs on the SAME primary pool. So at high RPS the 20-per-replica ceiling is the hard ceiling on *authorization throughput* — the platform can run out of pool before it runs out of CPU, and the symptom is auth-resolution latency, not business-logic latency (per concept invariant + sidecar `performance.hot_paths[0]`). The second cross-pillar tie is to Pillar P-03 (Master Data Management / Lookup Tables): the `customConnectionPool` exists solely for that subsystem, yet its always-on instantiation taxes deployments that never touch it.

A product owner demoing this feature would have to make an awkward admission in the demo: there is nothing to show. There is no settings page, no sizing wizard, no recommended-value table, no metrics panel. The feature is "tunable" only in the sense that the keys *exist in the framework* and the platform's `PropertyMapper` *would* apply them if set — but the platform ships zero of them, documents zero of them, and surfaces zero telemetry to know whether they need setting. The highest-leverage edge cases an operator hits in production: a 5-replica deployment silently sitting at 100 PostgreSQL connection slots (PostgreSQL's own default `max_connections` is 100, so the platform alone can exhaust the database before any collector or admin tool connects — per sidecar `performance.resource_allocation`); and a future Spring Boot upgrade silently moving the framework `maxSize` default and thereby moving ODD's deployed ceiling with no PR, changelog, or migration note (per sidecar `bugs_limitations_corner_cases[3]`).

