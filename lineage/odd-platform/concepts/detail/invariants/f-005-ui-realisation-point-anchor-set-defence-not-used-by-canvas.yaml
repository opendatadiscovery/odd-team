notes: |-
  **STRENGTHENED batch 2026-05-19M to 4-sidecar triangulation** — the
  invariant is now confirmed at:
    angle 1 (batch J): LineageGraph.tsx UI sidecar — the UI does not
        consume the positive endpoints;
    angles 2+3 (batch M): getMyObjectsWithUpstream + getMyObjectsWithDownstream
        — the POSITIVE endpoints the UI does not consume have their own
        latent vulnerability (REFACTOR-225) and contract drift (DOC-GAP-099);
    angle 4 (batch M): getDataEntityGroupsLineage — the DEG-anchored
        variant that the UI DOES consume (via DEGLineage.tsx) is the
        WIDEST cross-owner enumeration blast (no anchor-set at all).

  The catalog now has end-to-end (UI → API → service → SQL) uniform
  confirmation that:
    (a) the lineage canvas is the user-visible REALISATION POINT of
        REFACTOR-203;
    (b) switching the UI to consume the positive endpoints would not
        fully close the gap (REFACTOR-225 + DOC-GAP-099);
    (c) the DEG-lineage canvas has no positive-case sibling at the
        backend at all.

  Cross-pillar implications:
    (a) P-05 Data Lineage — the canvas IS the operator-facing surface;
        operators in multi-tenant deployments need this documented;
    (b) P-09 Security & Access Control — the read-collaborative posture
        is realised at the UI; the absence of compensating UI affordance
        is itself a finding;
    (c) P-11 Platform API & Developer Surface — the OpenAPI spec is the
        CONTRACT the SPA generated client consumes; DOC-GAP-099 lives
        at this interface.

  Cross-references:
    - REFACTOR-225 anchor-set single-point-of-failure (NEW batch M
      invariant) — the POSITIVE-case latent vulnerability.
    - DOC-GAP-099 OpenAPI summary inverse-semantic (NEW batch M invariant
      4-angle triangulated) — the POSITIVE-case contract drift.
    - DEG-membership read vs write authorization asymmetry (NEW batch M
      invariant) — the DEG-anchored variant's structural finding.
    - Lineage Graph Traversal (broader entity).
    - Read-collaborative cross-owner enumeration (broader posture).
