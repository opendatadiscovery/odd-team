behaviour: |-
  **MEDIUM — Code-doc disagreement: docs say "Microservices lineage" is a distinct view, but the code routes ALL microservices to HierarchyLineage (the same subtree as datasets/transformers).** Lineage.tsx:14 dispatches on `isDEG` only — `getIsDataEntityBelongsToClass(dataEntityId).isDEG` checks ONLY for `ENTITY_GROUP`. Microservices have entity class `TRANSFORMER` (or a microservice-specific class — verified by absence from the `isDEG` check at selectors.ts:43-45).

  **Microservices therefore route to `HierarchyLineage`** — same subtree as datasets and transformers. The doc's separate naming of "microservices view" is misleading: there is NO microservices-specific component at this layer.

  **All HierarchyLineage caveats apply identically to microservices**:
  - Diamond amplification (batch-J LineageGraph bugs[0])
  - Monotonic LoadMore (batch-J)
  - No upper bound on `?d=` (batch-J)
  - Click-through-compounds-depth (batch-J)
  - Anchor-set-undefended endpoints causing REFACTOR-203 cross-owner enumeration

  **Microservices-specific affordances** (operation names, trace timing, service-call cardinalities) **are not rendered** — they would be silently dropped if the response has them.

  **Why MEDIUM**:
  - **Doc-product editorial finding** — operator-misleading documentation creates expectation drift
  - **Operator experience gap** — if microservices have rendering-relevant attributes (trace IDs, latency), they're invisible at the UI tier
  - **Cross-pillar implication** — P-05 (Lineage) and `odd-tracing-gateway` (P-10) compose; the UI does not surface the compose
  - **Latent feature gap** — a future addition of microservices-specific rendering would require either a third branch in Lineage.tsx OR a refactor to HierarchyLineage to handle microservice variants

  **Test gap shape**: A `Lineage.test.tsx` test asserting microservices route to HierarchyLineage (PINS the contract); pair with a doc-side note that the "microservices view" naming is misleading.
