realism_caveats: |
  The probe runs under AUTH_TYPE=DISABLED to avoid coupling the test to
  the auth modes; under LOGIN_FORM / OAUTH2 the same SQL ordering applies
  regardless. If the operator's runtime is OAUTH2, the same hypothesis
  holds but the call requires a bearer token.

  The probe assumes Postgres default NULLS-ordering. If the team ever
  sets a non-default sort flag globally (no evidence in JooqQueryHelper)
  the assertion `r1_names[0] == 'run_A_running'` would flip — which is
  itself a finding.

  IMPORTANT: assertion r1_statuses[0] == 'RUNNING' depends on the
  DataEntityRunMapper not throwing on the unknown 'RUNNING' enum literal.
  The wire-side OpenAPI enum DataEntityRunStatus does NOT include RUNNING
  (components.yaml:1407-1415: SUCCESS|FAILED|SKIPPED|BROKEN|ABORTED|UNKNOWN),
  but the DB column accepts RUNNING (IngestionTaskRunStatus enum has it).
  MapStruct default unmappedTargetPolicy is IGNORE
  (MapperConfig.java:9), but enum-value-mismatch typically still throws
  IllegalArgumentException at the @ValueMapping site. P-151 isolates this
  question; if P-151 confirms the 500, this probe's first assertion may
  also fail — but the failure mode is different (500 from the whole
  endpoint vs the operator seeing RUNNING). Run P-151 first, then
  re-evaluate this assertion's expected outcome.

  The "tie pagination duplicates" assertion captures the second-order
  concern: even if any single page-1 fetch is internally self-consistent
  (Postgres returns the same physical order within one query), the
  InfiniteScroll consumer in TestRunsHistory.tsx:90-113 issues SEPARATE
  page fetches via fetchPage(pageInfo.page + 1). When two rows share a
  sort key, Postgres can split them across page boundaries differently
  on each invocation. The probe seeds and reads back-to-back so it may
  NOT reproduce the divergence on a clean docker postgres. If the probe
  PASSES this assertion, the risk is theoretical-only on this specific
  seed; if it FAILS, the drift is concretely reproducible.
