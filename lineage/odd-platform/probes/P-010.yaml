realism_caveats: |
  - The assertion `set(returned_tag_ids) == set(range(1009, 1039))` is
    EXACT (closed-form). It works because all 35 tags have IDENTICAL
    usage_count (2), so the outer ORDER BY count DESC at line 158 is
    fully degenerate; the only effective ordering is tag.id ASC inherited
    from the CTE. This makes the test deterministic.

  - If the underlying ID assignment ever changes (e.g. table-wide id
    sequence advances between probe runs causing 1009..1043 to be in use
    by other test fixtures), the explicit `INSERT (id, ...)` setup may
    conflict. The `ON CONFLICT (id) DO NOTHING` clauses are defensive,
    but a partial-setup state could leave the assertions flapping. If this
    becomes a problem, switch to a CTE that picks the lowest available
    IDs in a single transaction.

  - The probe runs under DISABLED auth. The popular-tags ordering bug
    applies to ANY auth mode; the SQL chain is auth-mode-agnostic. So
    DISABLED is sufficient and reduces the probe's setup cost.

  - WHEN THE FIX LANDS (move pagination after count aggregation, or
    introduce an outer ORDER BY count DESC, tag.created_at DESC over the
    full candidate set), this probe's primary assertion FLIPS — the
    failing assertion in CI surfaces the change. The maintainer would
    then update the assertion to reflect the new contract (e.g.
    `len(set(returned_tag_ids) & set(range(1039, 1044))) > 0`, asserting
    that at least one of the newest tags is included). This is the
    intended probe lifecycle: pin the bug, surface the fix, update the
    assertion, ship.

  - A complementary probe variant (P-010-B, future) should test the
    NON-DEGENERATE case: 5 newest tags tagged 100x each, 30 oldest tags
    tagged 2x each. The bug-free behaviour would return the 5 newest +
    25 of the older ones; the buggy behaviour returns 30 oldest. P-010
    pins the equal-count regime; P-010-B would pin the varying-count
    regime.
