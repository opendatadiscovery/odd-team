expected_outcome: |
  Stress question: the en.json resource is missing several translation keys that
  the code references via t('...') — notably "Data Quality", "Data Modelling",
  "Master Data", "Query Examples", "Add query example", "Save lookup table",
  "Table name", "Enter business name", "Link query", "query examples overall",
  "lookup table", "tab", "Delete query example", "Are you sure you want to
  delete this query example?". The natural-keys i18next pattern means a missing
  key falls back to the key STRING itself, so the English UI accidentally works.
  But (a) what does each non-English locale actually render for these keys, and
  (b) does the six-element fallbackLng chain (`['en','es','ch','fr','ua','hy']`
  per i18n.ts:30) cause a French user to see Spanish or Chinese text before
  English when a missing key is genuinely missing across multiple locales?
  Hypothesis: French user navigating to /data-quality, /data-modelling, or
  /master-data tabs sees the English label (not French) — confirming the
  natural-keys fallback. Hypothesis (b): if a key is present in es.json or
  ch.json but missing in fr.json (none observed in this audit, but a future
  contributor could introduce this), French users see Spanish or Chinese text
  before English in the fallback chain.
---
arrange:
  - kind: docker-compose-up
    spec: odd-platform-ui dev server (npm run start in odd-platform-ui)
  - kind: dom-probe
    description: |
      Open browser headless, navigate to /?lng=fr to force French locale
      via the SelectLanguage widget (which writes localStorage.i18nextLng = 'fr').
act:
  - kind: dom-probe
    description: |
      Read the rendered text of the toolbar tab labels on the global navigation:
      [data-test=toolbar-tabs] > * > .tab-label
    capture_as: french_tab_labels
  - kind: dom-probe
    description: |
      Switch locale to 'es' via SelectLanguage; re-read the same tab labels.
    capture_as: spanish_tab_labels
  - kind: dom-probe
    description: |
      Switch locale to 'ch' via SelectLanguage; re-read the same tab labels.
    capture_as: chinese_tab_labels
observe:
  - kind: dom-probe
    description: enumerate which labels rendered the English-key fallback vs an actual translation
    capture_as: per_locale_drift_report
assert:
  - "french_tab_labels['Data Quality'] == 'Data Quality'  # confirms missing-key → key-string fallback"
  - "french_tab_labels['Data Modelling'] == 'Data Modelling'"
  - "french_tab_labels['Master Data'] == 'Master Data'"
  - "spanish_tab_labels['Data Quality'] == 'Data Quality'  # same drift across locales"
  - "spanish_tab_labels['Data Modelling'] == 'Data Modelling'"
  - "spanish_tab_labels['Master Data'] == 'Master Data'"
  - "chinese_tab_labels['Data Quality'] == 'Data Quality'  # same drift, Chinese locale"
  - "chinese_tab_labels['Data Modelling'] == 'Data Modelling'"
  - "chinese_tab_labels['Master Data'] == 'Master Data'"
cleanup:
  - kind: docker-compose-down
    destroy_volumes: true
cross_references:
  related_sidecars:
