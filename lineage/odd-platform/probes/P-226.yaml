realism_caveats: |
  The probe pins the RUNTIME cost of a cyclic walk, not correctness. If arm (a)
  completes well under 5s with low Postgres CPU, H-009's "terminates quickly"
  half is CONFIRMED at runtime and the cycle guard is a hardening item, not a
  default-deployment correctness bug. If arm (a) ALREADY spikes, escalate: the
  cycle guard + depth cap (PLT-042) become load-bearing for ordinary use.

  The latency thresholds (5s) and CPU threshold (90%) are calibration starting
  points for the odd-minimal single-container Postgres; a probe-runner on a
  faster host should keep the relative interpretation (arm_a fast + low CPU =
  PASS) rather than the absolute numbers.

  Branching factor here is 1 (a pure cycle), which is the CONSERVATIVE case —
  it isolates cycle-traversal cost from diamond-fanout cost. A follow-up probe
  could combine a cycle with branching (B>1) to measure the compounded
  amplification, but that conflates two effects; this probe deliberately
  measures the cycle in isolation.

  Per Rule 6 / Rule 12: docker-compose + Postgres + curl, entirely local; no
  remote infrastructure. The fixtures use the 8800-range to avoid collision
  with seed data; cleanup is id/establisher-scoped.
