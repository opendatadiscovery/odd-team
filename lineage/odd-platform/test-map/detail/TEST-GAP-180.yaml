gap_id: TEST-GAP-180
category: missing-security
criticality: HIGH
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.notification.config config-properties-class:NotificationsProperties
surfaced_by:
- NotificationsProperties.md:bugs_limitations_corner_cases.[9]
- NotificationsProperties.md:security.known_security_gaps.[2]
behaviour: '**Owner-scope bypass**: fan-out unconditional — every Slack channel /
  webhook URL / email recipient gets every alert regardless of which data-entity owners
  would have been entitled to see it. `AlertNotificationMessage` carries `owners[]`
  but the processor does not consult them for routing. Cross-tenant / multi-team deployments
  cannot scope notifications to the owning team.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/notification/CrossTeamOwnerScopeBypassTest.java
  name: alertForEntityOwnedByTeamA_fansOutToTeamBChannelWithoutFiltering
evidence:
- 'NotificationsProperties.md says: ''Fan-out unconditional — every Slack channel
  / webhook URL / email recipient gets every alert. AlertNotificationMessageProcessor.java:25-36
  loop iterates List<NotificationSender> unconditionally on every AlertNotificationMessage;
  no per-recipient owner filter; no per-channel routing predicate'''
cross_references:
- concepts.yaml:entities[Notifications].security_aggregate.weaknesses.[4]
proposed_action: 'Add test: configure two webhooks (team A, team B); trigger an alert
  on a data-entity owned by team A; assert BOTH webhooks receive the same payload
  (current posture). Locks the no-routing posture; drives owner-scope routing as a
  deliberate test update.'
