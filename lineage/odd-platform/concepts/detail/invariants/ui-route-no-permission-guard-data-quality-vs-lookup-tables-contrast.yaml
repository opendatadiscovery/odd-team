security_aggregate:
  overall: LOW
  auth_modes_relevant:
    - LOGIN_FORM
    - OAUTH2
    - LDAP
    - DISABLED
  ingestion_filter_relevance: false
  authorization_consistency:
    verdict: UNGATED
    detail: |-
      Frontend bare route, no WithPermissionsProvider, no conditional tab.
      Backend posture PROBE-NEEDED at GET /api/dataqatests/runs
      (DataQualityRunsController not yet enriched, P-090).
  owner_scoping:
    verdict: BYPASSES
    detail: |-
      The dashboard renders catalog-wide aggregates with no current-user
      predicate at the UI layer. Backend SQL joins OWNERSHIP only when the
      operator supplies owner/title FILTER ids — user-driven filter, not
      principal-derived scope.
  strengths:
    - |-
      Read-only surface — no mutation, no owner-scoped write. The
      catalog-wide quality posture is read-collaborative by design
      (consistent with ADR-CANDIDATE-003).
  weaknesses:
    - |-
      The sibling-route contrast (gated /lookup-tables vs bare /data-quality)
      is the load-bearing evidence — the absence is UNEXPLAINED, not
      defended, not documented. A future maintainer reading the route
      registry cannot tell whether the bare mount is intentional or a
      drift from a prior security-tightening PR.
    - |-
      Under auth.type=DISABLED, the dashboard is anonymously reachable —
      catalog-wide DQ aggregate visible to any anonymous browser. Severity
      depends on the operator's sensitivity classification of quality data.
  cross_file_inconsistencies:
    - |-
      Both contributing sidecars AGREE — DataQuality and DataQualityContent
      both record App.tsx:73 as a bare route with no WithPermissionsProvider.
      Triangulated, not disputed.
