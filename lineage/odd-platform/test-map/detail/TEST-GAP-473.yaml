  Unit test with a Reactor test scheduler emitting EMPTY ReactiveSecurityContextHolder.getContext(). Subscribe to AuthIdentityProviderImpl.getCurrentUser(). Assert via StepVerifier.create(mono).expectComplete().verify() (i.e. the Mono completes with NO emission and NO error). Repeat for getCurrentUserProviderRole() and fetchAssociatedOwner(). LOCKS the empty-propagation contract. Promotes to a fix-required regression when fail-fast (Mono.error(...)) lands.
