mitigations_unimplemented:
  - |-
    The smallest-cost remediation — document on the
    /features/data-glossary/business-glossary live doc page that
    'namespace is a LABEL DIMENSION, not an ISOLATION BOUNDARY. Every
    authenticated user sees every term across every namespace. The
    TERM_* permissions gate MUTATIONS; reads are uniform across the
    catalog.' Add an admonition block. Pairs with the existing
    read-collaborative-posture-doc-silence DOC-NNN candidate.
  - |-
    UI-level affordance — add a 'Show only my owners' or 'Filter by
    my namespace' option to TermSearchFilters. Pure UX (no SQL change);
    operators who wish to scope their view can opt-in. The full
    catalog remains read-collaborative at the architecture; the UI
    just adds a self-scoping convenience.
  - |-
    Architectural change (largest scope) — add per-namespace isolation
    as an opt-in P-09 feature. Requires:
      - Schema: introduce a 'visibility' column on namespace
        (PRIVATE / TEAM / PUBLIC) or use existing owner-binding for
        team scope.
      - Service tier: every Term read filters by visibility +
        current-user-owner-set.
      - UI: a Settings tab for operators to mark namespaces as
        private.
    Scope-doubling change; pause-and-ask the maintainer before
    pursuing.
  - |-
    Add a regression test asserting the current behaviour:
      (a) Create two terms in two different namespaces with two
          different owners.
      (b) Authenticate as a user with ownership of one but not the
          other.
      (c) GET /api/terms — assert BOTH terms are returned (pins the
          current behaviour).
      (d) GET /api/terms/term_id for the other-namespace term —
          assert 200 (pins the current behaviour).
    Without this test, a future per-namespace isolation feature would
    break the read-collaborative invariant silently.
notes: |-
  NEW invariant captured in batch 2026-05-20U from the TermSearch +
  TermDetails sidecars. The UI-surface confirmation completes the
  end-to-end chain (UI to service to SQL) for the F-002
  cross_namespace_term_pollution drift class.

  The follow-up actions are mostly DOC-NNN candidates — the
  architectural posture is consistent with the documented
  read-collaborative stance, but the doc page's implicit framing
  misleads operators. The smallest-cost fix is the doc admonition.

  Cross-cutting connections:
    - STRENGTHENS the F-002 cross_namespace_term_pollution drift facet
      with the UI-surface confirmation
    - Pairs with read-collaborative-cross-owner-enumeration master
      invariant (28-sidecar — batch T) — adds Term as a specific
      surface within the broader read-collaborative pattern
    - Pairs with partial-permission-gating-edit-button-gated-content-unconditional
      (6-component pattern — batch Q + J) — Term details are the 5th
      surface where the partial-gating manifests
    - Pairs with the three batch-U sister invariants
      (f-004-stored-xss-extends-to-term-definition,
      securityconstants-term-to-term-no-security-rule,
      namespace-create-tag-create-side-doors) — together these four
      make the Term subsystem the platform's most-open feature for
      authenticated readers
    - Pairs with the maintainer's pending canonicalisation candidate
      for the read-collaborative posture explicit doc admission

  Two DOC-NNN candidates flow from this invariant:
    (a) Doc admission — describe namespace-as-label vs namespace-as-isolation
        on the business-glossary page
    (b) UI affordance — 'Show only my namespace' filter as opt-in UX
