description: |-
  Page-level UI Error Display is the SPA's failure-path chrome surface — a
  40-line stateless React widget (AppErrorPage) rendered by 23 page-level
  data-loading components on async-thunk rejection. The widget displays:
  (a) a large HTTP status code (errorCode typography variant, 72px) in the
  left column, (b) a status-text heading (h1) + "Return to the Home Page"
  link in the right column, all centered in a viewport-height-clearing grid
  sized via `calc(100vh - toolbarHeight - offsetTop)`. The widget is a
  CONTROLLED component — it reads no redux state, no react-query cache; the
  parent supplies `showError` (boolean) + optional `error` (ErrorState) +
  optional `offsetTop` (px).

  The widget's information-disclosure boundary is load-bearing: only
  `error?.status` (line 25) and `error?.statusText` (line 29) are rendered to
  the DOM. The `error.url` (failing API URL) and `error.message` (backend
  response body message) fields populated upstream by `getErrorResponse`
  (errorHandling.tsx:12-26) are NEVER displayed — they would leak backend
  implementation details (stack traces, SQL exception strings, internal URL
  paths) if rendered. The `error.message` IS surfaced via `react-hot-toast`
  for 6 seconds (errorHandling.tsx:48-68 + App.tsx:55 toast duration default)
  — a separate channel with a short window.

  The feature's load-bearing STRUCTURAL DRIFT is what's NOT here: the SPA
  has NO global error boundary (Grep `ErrorBoundary|componentDidCatch|getDerivedStateFromError`
  over odd-platform-ui/src returns ZERO matches) AND NO `<Route path='*'>`
  catch-all (App.tsx:59-89 declares 11 Route entries, none with path='*').
  React-Router-DOM v6's no-match behaviour is to render nothing inside
  <Routes> — visiting bare /terms (parent route declared but no index child)
  or bare /master-data (no parent route exists) or any unknown URL renders
  the AppToolbar plus a BLANK pane below. The AppErrorPage is reached ONLY
  when an async thunk rejects, NEVER when react-router fails to match.

  This is the cross-batch finding with ZH+ZI that observed bare /terms and
  /master-data produce a blank page. The structural root cause is here:
  AppErrorPage's scope is per-page-component-owned, and the only thing that
  could route route-layer fall-through into a visible error pane is a
  `path='*'` catch-all that does not exist. A 5-line fix (add `<Route path='*'
  element={<AppErrorPage showError error={{status:404, statusText:'Page Not
  Found', url:'', message:''}} />} />` to App.tsx:89) would route ALL
  fall-through to this widget; alternatively the gap should be documented
  explicitly. Either option closes the operator-surprise; the code fix is
  preferred.

  The drift surface beyond the structural absence: AppErrorPage has NO retry
  CTA (only "Return to the Home Page"); the `error` prop is typed `ErrorState`
  but 2 callers (Integration.tsx, IntegrationPreviewList.tsx) cast react-query
  errors via `error as ErrorState` — undefined runtime behaviour if the
  react-query error shape lacks `status`/`statusText`; 8 callers pass
  `showError` without `error` (OwnerAssociationsActive.tsx and siblings) —
  the widget falls back to "Unknown Error" with an empty status code column;
  the information-disclosure boundary (omit `url` + `message`) is
  undocumented in the code (no JSDoc, no comment) and undocumented on the
  public docs site (no troubleshooting page mentions error pages or HTTP
  codes displayed in the UI).
