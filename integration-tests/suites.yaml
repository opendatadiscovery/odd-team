# Named integration-test suites — each a list of IT-NNN protocols run together.
# Maps to test-plan.md integration batches I1-I10. Run: integration-tests/run-suite.sh <name>
# Protocols are authored (Step 3) by copying TEMPLATE.md → protocols/IT-NNN-*.md and
# adding the id to the relevant suite below.

suites:
  smoke:
    description: "Framework canary — proves the stack + protocol + log loop end-to-end."
    protocols: [IT-001]

  feature-complete:
    description: "The GREEN-target regression suite — run when a feature is implemented or a bug fixed; everything here should pass. Excludes known-open-bug pins (those live in `known-bugs`). Run alongside the unit suite (scripts/run-platform-tests.sh)."
    # passing pins only (all GREEN): IT-008 REMOTE round-trip · IT-009 auth-mode boundary ·
    # IT-010 LDAP RBAC enforcement · IT-011 notifications WAL lifecycle · IT-012 WAL failover ·
    # IT-013 F-176 data-entity Overview composition.
    protocols: [IT-001, IT-008, IT-009, IT-010, IT-011, IT-012, IT-013, IT-014, IT-015, IT-016, IT-017, IT-018, IT-019, IT-020, IT-021, IT-022, IT-023, IT-024, IT-025, IT-026, IT-027, IT-028, IT-029, IT-030, IT-031, IT-032, IT-033, IT-034, IT-035, IT-036, IT-037, IT-038, IT-039, IT-040, IT-041, IT-042, IT-043, IT-044, IT-045, IT-046, IT-047, IT-048, IT-049, IT-050, IT-051, IT-052, IT-053, IT-054, IT-055, IT-056, IT-057, IT-058, IT-059, IT-060, IT-061, IT-062, IT-063, IT-064, IT-065, IT-066, IT-067, IT-068, IT-069, IT-070, IT-071, IT-072, IT-073, IT-074, IT-075, IT-076, IT-077, IT-078, IT-079, IT-080, IT-081, IT-082, IT-083, IT-084, IT-085, IT-086, IT-087, IT-088, IT-089, IT-090, IT-091, IT-092, IT-093, IT-094, IT-095, IT-096, IT-097, IT-098, IT-099, IT-100, IT-101, IT-102, IT-103, IT-104, IT-105, IT-106, IT-107, IT-108, IT-109, IT-110]
    # Wave-3 (IT-088..110): activity/collab/notifications (F-021/196/038/197/198) · platform internals housekeeping/
    # scheduler/advisory-lock/r2dbc (F-010/121/065/120) · collectors+integration wizard (F-020/033/162/163) · UI
    # chrome/i18n/jotai-state (F-041/043/104/161) · owner-association mgmt workflow (F-075/171/172/173/174/142).
    # Mix of browser + API+config-observable e2e. Pins: PLT-148 (owner-assoc WRITE surface 500s under DISABLED while
    # the UI renders every action enabled — LSN-001/002 class) · PLT-149 (unknown integration id 200-not-404) ·
    # PLT-005/074/083/089 (platform scheduler/housekeeping/advisory-lock pins, all GREEN-now / RED-on-fix).
    # Wave-2 (IT-066..087): catalog search rendering (F-003/146/147/148) · browse+overview home (F-023/141/179/206)
    # · lineage+relationships (F-016/054/186/037) · dataset detail (F-191/192/036) · terms/glossary (F-056/152/154/156)
    # · query examples (F-025/131/132). All browser-driven (page.goto -> rendered-DOM assertion + DB read-back).
    # GREEN-now characterization pins inside: search-results NPE (PLT-147), ERD target-column (PLT-056), F-152
    # empty-state copy-paste, F-036 no-titles-curation-surface — all flip RED on the fix.
    # Wave-1 (IT-048..065): lookup RDM/rename/listing (F-026/058/059) · cascade-on-delete + mgmt read/route gating
    # (F-076/074/105) · principal→owner + my-objects (F-011/015/064) · DQ severity/reports/history (F-057/022/040) ·
    # ingestion credential/atomicity/auth-matrix (F-125/096/094) · public-API conformance + appInfo + actuator
    # (F-029/119/122). Several carry GREEN-now LSN-029 characterization pins (lookup-rename data-loss, my-objects
    # silent-empty, plaintext-token, RUNNING-row 500) — they flip RED on the fix, so they live here, not known-bugs.
    # IT-060/061/062 are API-only ingestion-contract pins (F-125 credential lifecycle · F-096 batch atomicity ·
    # F-094 auth matrix). They carry LSN-029 characterization pins of KNOWN bugs (plaintext-at-rest PLT-085,
    # orphan-token F-125 H-001, client-error-5xx PLT-045) that are GREEN today — they FLIP RED when the platform
    # hardens, so they live in feature-complete (the green-now lane), not known-bugs (the expected-red lane).

  known-bugs:
    description: "Quarantine lane — pins that reproduce a KNOWN, UNFIXED bug; EXPECTED to be RED. Keeps them visible without making feature-complete permanently red. When a bug is fixed its pin flips GREEN → move it to feature-complete (that move is the measurable regression closure)."
    # IT-002 PLT-104 (view_count +2) · IT-003 PLT-090/127 (tsquery poison) ·
    # IT-004 PLT-052 (DQ unknown-status crash) · IT-005 PLT-026 (Top Tags oldest-by-id) ·
    # IT-006 TEST-GAP-1013 (no SPA error boundary) · IT-007 LSN-001/PLT-086 (LOCAL
    # attachment lost on container recreate). All expected RED until fixed.
    protocols: [IT-002, IT-003, IT-004, IT-005, IT-006, IT-007]

  ui-e2e:
    description: "Browser end-to-end (Playwright) user-flow tests — the user-observable half of integration. Self-contained in integration-tests/e2e/. Several here are known-bug pins (expected RED) — see the known-bugs suite."
    protocols: [IT-002, IT-003, IT-004, IT-005, IT-006, IT-013, IT-014, IT-015, IT-016, IT-017, IT-018, IT-019, IT-020, IT-021, IT-022, IT-023, IT-024, IT-025, IT-026, IT-027, IT-028, IT-029, IT-030, IT-031, IT-032, IT-033, IT-034, IT-035, IT-036, IT-037, IT-038, IT-039, IT-040, IT-041, IT-042, IT-043, IT-044, IT-045, IT-049, IT-066, IT-067, IT-068, IT-069, IT-070, IT-071, IT-072, IT-073, IT-074, IT-075, IT-076, IT-077, IT-078, IT-079, IT-080, IT-081, IT-082, IT-083, IT-084, IT-085, IT-086, IT-087, IT-088, IT-089, IT-090, IT-091, IT-092, IT-097, IT-099, IT-100, IT-101, IT-102, IT-103, IT-104, IT-106, IT-107, IT-108, IT-109, IT-110]   # IT-046 + the rest of IT-048..065 are API-only (no browser) -> feature-complete, not ui-e2e. IT-049 (lookup listing) + all of wave-2 (IT-066..087) browser. Wave-3 browser: IT-088..092/097/099/100/101..104/106..110 (page.goto); IT-093..096/098/105 are API-only.

  # --- test-plan.md integration batches (protocols authored during Step-3 implementation) ---
  I1-auth-mode-authz:
    description: "Auth-mode + authz enforcement — ADR-0002/0003/0074; cross-owner read-openness. test-plan I1."
    # IT-009 ADR-0074 auth-mode boundary (DISABLED vs LOGIN_FORM) · IT-010 LDAP RBAC
    # enforcement (a non-admin USER denied a gated admin mutation). Both GREEN.
    protocols: [IT-009, IT-010, IT-046, IT-052, IT-053, IT-054, IT-055, IT-056, IT-105, IT-106, IT-107, IT-108, IT-109, IT-110]   # IT-105..110 owner-association workflow (F-075/171/172/173/174/142) — read surfaces GREEN, write surfaces pinned 500 under DISABLED (PLT-148). IT-046 DISABLED open posture (F-008 UC-01/UC-10) · IT-052 mgmt directory ungated reads (F-074) · IT-053 mgmt route gating reads-bypass-authz (F-105) · IT-054 principal→owner phantom-admin/no-owner (F-011) · IT-055 my-objects anchor reads empty-under-DISABLED (F-015) · IT-056 my-objects silent-empty pins (F-064)
  I2-attachment-storage:
    description: "Attachment storage LSN-001/002 + ADR-0012 — Testcontainers-MinIO non-us-east-1 + container-restart durability. test-plan I2."
    # IT-007 LSN-001 LOCAL-storage container-recreate durability (RED) · IT-008 REMOTE
    # round-trip vs S3/MinIO (GREEN). LSN-002 region defect is a STRUCTURAL unit pin in
    # odd-platform (MinioConfigRegionTest, @regresses PLT-086) — vanilla MinIO can't repro it.
    protocols: [IT-007, IT-008]
  I3-notifications-wal:
    description: "Notifications WAL + fan-out — ADR-0040/42/43/44, PLT-016 (poison-message, thread-death, fail-soft). 2-replica + advisory-lock failover. test-plan I3."
    # IT-011 ADR-0040/0044 lifecycle (slot+pub created only when enabled) · IT-012 ADR-0043
    # leader failover (kill leader → standby takes over). Delivery + leader-stability are
    # flaky on fresh boot (create-order wedge, PLT-139 — IT-012 un-wedges a clean leader first).
    protocols: [IT-011, IT-012]
  I4-data-collaboration:
    description: "Data Collaboration — ADR-0019/0020, PLT-119/054 (cross-entity post, Slack signature). test-plan I4."
    protocols: [IT-088, IT-089, IT-090, IT-091, IT-092]   # IT-088 activity feed (F-021) · IT-089 entity activity tab (F-196) · IT-090 discussions tab (F-038) · IT-091 collaboration UI tab (F-197) · IT-092 notification settings dialog (F-198). Slack non-functional on odd-minimal -> no-config render characterized.
  I5-ingestion-identity:
    description: "Ingestion identity contract — ADR-0070/0073, PLT-003/012 (pull/push parity, ODDRN idempotency, term-gate path). test-plan I5."
    protocols: [IT-035, IT-036, IT-044, IT-045, IT-047, IT-060, IT-061, IT-062, IT-097, IT-098, IT-099, IT-100]   # IT-035 write · IT-036 metrics · IT-044 stats · IT-045 stats-validation · IT-047 stats tags (UC-6/7) · IT-060 credential lifecycle (F-125 reveal/orphan/plaintext) · IT-061 batch atomicity + error contract (F-096) · IT-062 auth coverage matrix (F-094, DISABLED open posture) · IT-097 collector lifecycle (F-020) · IT-098 integration manifests (F-033, PLT-149) · IT-099 wizard arg-form (F-162) · IT-100 one-shot token reveal (F-163)
